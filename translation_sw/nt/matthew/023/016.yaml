id: MAT.23.16
reference: Matthew 23:16
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, ὁδηγοὶ τυφλοὶ οἱ λέγοντες· Ὃς ἂν ὀμόσῃ ἐν τῷ ναῷ, οὐδέν ἐστιν, ὃς δ’ ἂν ὀμόσῃ ἐν τῷ χρυσῷ τοῦ ναοῦ ὀφείλει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/016.yaml
  text: Woe to you[a], blind guides, who say, ‘Whoever swears by the temple, it is nothing[b]; but whoever swears by the gold of the temple is bound.’
translation:
  language: sw
  text: Ole wenu, viongozi vipofu, mnaosema, ‘Yeyote anayeapa kwa Hekalu, kiapo hicho si kitu[a]; lakini yeyote anayeapa kwa dhahabu ya Hekalu anawajibika kutimiza kiapo hicho.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kigiriki, “si kitu,” yaani, kiapo hicho kinahesabiwa kuwa hakifungi.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐαὶ ὑμῖν
  choice: Ole wenu
  rationale: Kauli ya kawaida ya kinabii ya kutangaza hukumu; inadumisha uzito wa shutuma ya Yesu na ni ya asili katika Kiswahili cha Biblia.
- source_word: ὁδηγοὶ τυφλοὶ
  choice: viongozi vipofu
  rationale: ‘Viongozi’ huwasilisha watu wanaowaongoza wengine, huku ‘vipofu’ ikidumisha sitiari kuu ya watu wasioona wanaowaelekeza wengine.
- source_word: οἱ λέγοντες
  choice: mnaosema
  rationale: Kishirikishi chenye kibainishi kinatafsiriwa kwa kawaida kama kishazi rejeshi kinachowahusu wale wanaoambiwa moja kwa moja.
- source_word: Ὃς ἂν ὀμόσῃ
  choice: Yeyote anayeapa
  rationale: Muundo wenye ἄν na hali tegemezi unaeleza sharti la jumla lisilo na mhusika maalumu; Kiswahili hiki ni cha kawaida na sahihi.
- source_word: ἐν τῷ ναῷ
  choice: kwa Hekalu
  rationale: Ingawa ἐν kwa msingi inaweza kuwa ‘katika,’ hapa ni sehemu ya lugha ya kiapo na ina maana ya kuliita Hekalu kuwa dhamana ya kiapo.
- source_word: οὐδέν ἐστιν
  choice: kiapo hicho si kitu
  rationale: Hudumisha usemi mfupi na wenye pengo wa Kigiriki, huku ikibainisha kwamba ‘hicho’ kinachohesabiwa kuwa si kitu ni kiapo, si Hekalu.
- source_word: χρυσῷ τοῦ ναοῦ
  choice: dhahabu ya Hekalu
  rationale: Tafsiri ya moja kwa moja ya muundo wa umilikaji, ikihifadhi utofauti kati ya Hekalu na dhahabu yake.
- source_word: ὀφείλει
  choice: amefungwa na kiapo chake
  rationale: Katika muktadha wa viapo, kitenzi kinaeleza kuwajibika au kuwa chini ya wajibu. Kauli hii inafanya dhana iliyodokezwa ieleweke kwa msomaji wa leo.
theological_decisions:
- issue: Lugha yenye pengo kuhusu uzito wa kiapo na wajibu wake
  choice: Kishazi cha kwanza kinabaki karibu na usemi ‘si kitu,’ lakini nomino ‘kiapo’ inawekwa wazi; kishazi cha pili kinaeleza wajibu kama kufungwa na kiapo.
  alternative: ‘Yeyote anayeapa kwa Hekalu, si kitu; lakini yeyote anayeapa kwa dhahabu ya Hekalu anawajibika.’
  rationale: Kigiriki kina usemi mfupi οὐδέν ἐστιν ... ὀφείλει. Tafsiri iliyochaguliwa inahifadhi mkazo wa tofauti hiyo huku ikifanya maana ya kimaadili na kisheria ya hoja ieleweke bila kuongeza fundisho la kidhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. ‘Ole wenu’ inadumisha sauti ya kinabii; ‘Hekalu’ limeandikwa kwa herufi kubwa kwa kuwa linarejelea Hekalu la Yerusalemu. Alama ya tanbihi [a] imewekwa mara moja katika matini kuu.
