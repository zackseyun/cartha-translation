source:
  edition: robinson-pierpont-2005-byzantine
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι κατεσθίετε τὰς οἰκίας τῶν χηρῶν, καὶ προφάσει μακρὰ προσευχόμενοι· διὰ τοῦτο λήψεσθε περισσότερον κρίμα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/014.yaml
  text: Woe[a] to you, scribes and Pharisees, hypocrites! For you devour widows' houses, and as a pretext make long prayers; therefore you will receive greater condemnation.
translation:
  language: sw
  text: Ole wenu,[a] walimu wa sheria na Mafarisayo, wanafiki! Kwa maana mnakula mali za wajane, na kwa kisingizio mnasali sala ndefu; kwa hiyo, mtapata hukumu kali zaidi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mstari huu haupo katika hati za kale zaidi za Kigiriki, zikiwemo Sinaiticus na Vaticanus za karne ya nne, wala katika tafsiri za kale za Kikopti. Hata hivyo, umo katika mapokeo ya hati nyingi za Kibizanti, Kilatini cha Kale, Vulgata na Kisiria. Huenda wanakili wa baadaye waliuongeza ili kupatanisha kifungu hiki na maneno yanayofanana katika Marko 12:40 na Luka 20:47. Hati zinazoujumuisha zinatofautiana pia kuhusu kama unawekwa kabla au baada ya mstari wa 13.
    reason: textual_critical
lexical_decisions:
- source_word: κατεσθίετε
  choice: mnatafuna mali
  rationale: Kitenzi hiki maana yake ya msingi ni ‘kula kabisa’; hapa ni sitiari ya kuwanyonya wajane kwa ukatili na kupora mali zao. ‘Mnatafuna mali’ huhifadhi nguvu ya sitiari huku ikieleweka kwa Kiswahili cha sasa.
- source_word: τὰς οἰκίας τῶν χηρῶν
  choice: mali za wajane
  rationale: ‘Nyumba’ inaweza kumaanisha kaya au mali yote ya mtu, si jengo pekee. ‘Mali za wajane’ huwasilisha wazi unyonyaji wa kiuchumi unaokusudiwa katika muktadha.
- source_word: προφάσει
  choice: kwa kujifanya tu
  rationale: Neno hili linaashiria kisingizio au mwonekano wa nje unaoficha nia halisi. Usemi huu wa kawaida unaonyesha kwamba sala hizo ni unafiki wa kufunika matendo yao.
- source_word: περισσότερον
  choice: kali zaidi
  rationale: Ikiwa inahusishwa na hukumu ya adhabu, neno hili huonyesha hukumu nzito au yenye ukali zaidi, si wingi wa kidhahania tu.
- source_word: κρίμα
  choice: hukumu
  rationale: ‘Hukumu’ huhifadhi upana wa κρίμα, ingawa hapa muktadha unaonyesha wazi kuwa ni hukumu ya hatia yenye adhabu.
- source_word: γραμματεῖς
  choice: walimu wa sheria
  rationale: Katika muktadha wa Agano Jipya, hawa si waandishi wa kawaida bali wataalamu na wafafanuzi wa Sheria; ‘walimu wa sheria’ ni tafsiri ya maana inayoeleweka vizuri.
theological_decisions:
- issue: Maana ya ‘hukumu kali zaidi’
  choice: Kudumisha kauli ya kulinganisha bila kufafanua viwango au namna ya adhabu
  alternative: Kuitafsiri kama fundisho mahsusi kuhusu daraja za adhabu ya mwisho
  rationale: Kigiriki kinasema tu kwamba watapata hukumu kubwa/kali zaidi; hakielezi hapa mfumo au namna kamili ya viwango vya adhabu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Ole wenu’ huhifadhi uzito wa kauli ya kinabii; ‘mnatafuna mali’ huhifadhi sitiari kali bila kuwa ya kizamani. Alama ya tanbihi [a] imewekwa baada ya kauli ya mwanzo ili kutahadharisha kuhusu tofauti ya hati kwa mstari mzima.
