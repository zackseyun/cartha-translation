lexical_decisions:
- source_word: Τότε
  choice: Kisha
  rationale: Kielezi hiki kinaonyesha mfuatano wa simulizi; “Kisha” ni tafsiri ya kawaida na fupi katika muktadha huu.
- source_word: ὁ Ἰησοῦς
  choice: Yesu
  rationale: Ni jina la pekee; katika Kiswahili halihitaji kutafsiri kibainishi cha Kigiriki kilicho mbele yake.
- source_word: ἐλάλησεν
  choice: akazungumza
  rationale: Kitenzi λαλέω humaanisha kusema au kuzungumza; “akazungumza” huhifadhi tendo rahisi la kusema na kuendana kwa kawaida na “na” kwa wale wanaoelekezewa maneno.
- source_word: τοῖς ὄχλοις
  choice: na umati wa watu
  rationale: Ingawa Kigiriki kina wingi, Kiswahili kwa kawaida hutumia “umati wa watu” kwa hadhira iliyokusanyika; maana ya kundi kubwa la watu inabaki wazi bila kutumia muundo usio wa kawaida.
- source_word: καὶ
  choice: na
  rationale: Kiunganishi rahisi kinachounganisha makundi mawili yaliyoelekezewa maneno.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: na wanafunzi wake
  rationale: “Wanafunzi” ni tafsiri iliyozoeleka na sahihi ya μαθηταί katika Injili, huku “wake” ikiwakilisha αὐτοῦ kwa Kiswahili cha kawaida.
