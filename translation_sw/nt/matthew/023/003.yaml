  text: πάντα οὖν ὅσα ⸀ἐὰν εἴπωσιν ὑμῖν ⸂ποιήσατε καὶ τηρεῖτε⸃, κατὰ δὲ τὰ ἔργα αὐτῶν μὴ ποιεῖτε, λέγουσιν γὰρ καὶ οὐ ποιοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/003.yaml
  text: Therefore[a], do and keep everything they tell you, but do not do according to their works, for they say and do not do.
translation:
  language: sw
  text: Kwa hiyo, yote watakayowaambia, yafanyeni na kuyazingatia; lakini msifanye kulingana na matendo yao[a], kwa maana wanasema lakini hawafanyi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “msitende kama wao wanavyotenda.”
    reason: Njia nyingine ya kutafsiri κατὰ τὰ ἔργα αὐτῶν kwa Kiswahili laini zaidi.
lexical_decisions:
- source_word: πάντα οὖν ὅσα ἐὰν
  choice: Kwa hiyo, yote watakayo-
  rationale: “Kwa hiyo” linaonyesha hitimisho la οὖν, na “yote watakayo-” linahifadhi maana pana ya πάντα ὅσα ἐὰν kwa Kiswahili cha kawaida.
- source_word: εἴπωσιν ὑμῖν
  choice: watakayowaambia
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya usemi unaoelekezwa kwa wasikilizaji, bila kuongeza dhana mahsusi ya kufundisha.
- source_word: ποιήσατε
  choice: yafanyeni
  rationale: Kitenzi hiki cha amri kinatafsiriwa moja kwa moja, huku kiambishi “ya-” kikirejelea mambo yote yaliyotajwa.
- source_word: τηρεῖτε
  choice: kuyashika
  rationale: “Kuyashika” kinadumisha tofauti na “yafanyeni” na kinaweza kumaanisha kuyatunza au kuyazingatia kwa uaminifu bila kuifinya maana kuwa utii pekee.
- source_word: κατὰ δὲ τὰ ἔργα αὐτῶν
  choice: lakini msifanye kulingana na matendo yao
  rationale: “Kulingana na” linahifadhi wazo la kufuata kigezo au mfano, na “matendo” linafaa kwa ἔργα katika muktadha wa mwenendo.
- source_word: λέγουσιν γὰρ καὶ οὐ ποιοῦσιν
  choice: kwa maana wanasema lakini hawafanyi
  rationale: Tafsiri inadumisha usemi mfupi na mkali wa Kigiriki pamoja na marudio ya mzizi wa “kufanya,” ambayo yanafunua tofauti kati ya maneno na matendo.
theological_decisions:
- issue: Iwapo mamlaka ya mafundisho ya waandishi na Mafarisayo, iliyotajwa katika muktadha uliotangulia, ifafanuliwe ndani ya aya hii
  choice: Kuacha jambo wanaloambiwa likiwa bila ufafanuzi wa ziada, kama lilivyo katika aya yenyewe
  alternative: Kupanua kuwa “yote watakayowafundisha” au “yote watakayowaambia kutoka katika kiti cha Musa”
  rationale: Muktadha unatambulisha wanaorejelewa, lakini aya hii hairudii maelezo hayo. Kutoyaongeza kunazuia tafsiri kuamua zaidi ya maneno ya chanzo.
- issue: Iwapo marudio ya ποιέω yalainishwe kwa kutumia vitenzi tofauti
  choice: Kudumisha marudio kwa “yafanyeni ... msifanye ... hawafanyi”
  alternative: Kutumia maneno kama “tekelezeni ... msiwaige ... hawatendi”
  rationale: Marudio hayo ni sehemu ya nguvu ya hoja dhidi ya unafiki; kuyadumisha kunahifadhi mvutano wa kimatamshi wa chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Mpangilio wa kuanza na “yote watakayowaambia” unadumisha msisitizo wa neno la Kigiriki πάντα.
