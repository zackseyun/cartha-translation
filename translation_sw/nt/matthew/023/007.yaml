  text: καὶ τοὺς ἀσπασμοὺς ἐν ταῖς ἀγοραῖς καὶ καλεῖσθαι ὑπὸ τῶν ἀνθρώπων· ⸀Ῥαββί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/007.yaml
  text: and greetings in the marketplaces, and to be called by men, ‘Rabbi.’
translation:
  language: sw
  text: na kusalimiwa katika masoko, na kuitwa na watu, ‘Rabi.’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοὺς ἀσπασμοὺς
  choice: kusalimiwa kwa heshima
  rationale: Katika muktadha huu neno halimaanishi salamu za kawaida tu, bali salamu za heshima walizozipenda viongozi hao.
- source_word: ἐν ταῖς ἀγοραῖς
  choice: sokoni
  rationale: ἀγοραί ni maeneo ya wazi ya biashara na mikusanyiko ya umma; ‘sokoni’ ni usemi wa kawaida na wa asili katika Kiswahili.
- source_word: ὑπὸ τῶν ἀνθρώπων
  choice: na watu
  rationale: Katika muundo wa kutendwa, kifungu hiki humaanisha ‘na watu’; ἄνθρωποι hapa linawahusu wanadamu kwa ujumla, si wanaume pekee.
- source_word: Ῥαββί
  choice: Rabi
  rationale: Jina hili la heshima la Kiyahudi limetoholewa kwa namna inayotambulika katika Kiswahili, huku maana na mazingira yake ya kihistoria yakihifadhiwa.
theological_decisions:
- issue: Uzito wa cheo ‘Rabi’
  choice: Kuhifadhi cheo kama ‘Rabi’ bila kukifafanua ndani ya mstari
  alternative: ‘Mwalimu’
  rationale: Neno la Kigiriki limenukuu moja kwa moja cheo cha Kisemiti; kulihifadhi huepuka kufuta mazingira ya Kiyahudi au kulazimisha maana moja tu ya cheo hicho.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na heshima. Kitenzi ‘kupenda’ kinaendeleza orodha kutoka muktadha wa mstari uliotangulia, kama ilivyo katika sentensi ya Kigiriki.
