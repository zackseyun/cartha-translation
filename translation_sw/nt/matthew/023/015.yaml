id: MAT.23.15
reference: Matthew 23:15
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι περιάγετε τὴν θάλασσαν καὶ τὴν ξηρὰν ποιῆσαι ἕνα προσήλυτον, καὶ ὅταν γένηται ποιεῖτε αὐτὸν υἱὸν γεέννης διπλότερον ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/015.yaml
  text: Woe to you[a], scribes and Pharisees, hypocrites! Because you travel over sea and land to make one convert, and when he becomes one[b], you make him twice as much a son of Gehenna as yourselves.
translation:
  language: sw
  text: Ole wenu, waandishi na Mafarisayo, wanafiki! Kwa maana mnasafiri baharini na nchi kavu ili kumfanya mtu mmoja awe mwongofu,[a] na anapokuwa mwongofu, mnamfanya awe mwana wa Gehena[b] mara mbili kuliko ninyi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, proseliti, yaani mtu aliyejiunga na dini ya Kiyahudi.
    reason: lexical_alternative
  - marker: b
    text: 'Au, mwana wa kuzimu. Kigiriki: mwana wa Gehena.'
    reason: alternative_reading
lexical_decisions:
- source_word: Οὐαὶ
  choice: Ole wenu
  rationale: Kauli hii ya kawaida na yenye uzito huhifadhi nguvu ya onyo na hukumu ya kinabii katika οὐαί.
- source_word: γραμματεῖς
  choice: waandishi
  rationale: Ni istilahi ya kawaida ya Kibiblia kwa kundi la wataalamu wa Maandiko na sheria ya Kiyahudi; inaepuka kufafanua kazi yao kupita kiasi ndani ya matini.
- source_word: Φαρισαῖοι
  choice: Mafarisayo
  rationale: Hili ndilo jina sanifu la Kiswahili la dhehebu hili la Kiyahudi.
- source_word: ὑποκριταί
  choice: wanafiki
  rationale: Huwasilisha kwa lugha ya sasa unafiki wa kidini na kimaadili unaokemewa hapa.
- source_word: περιάγετε τὴν θάλασσαν καὶ τὴν ξηρὰν
  choice: mnasafiri baharini na nchi kavu
  rationale: Hutoa kwa Kiswahili cha kawaida maana ya kwenda mbali na kufanya juhudi kubwa, huku ikihifadhi jozi ya bahari na nchi kavu.
- source_word: ποιῆσαι ἕνα προσήλυτον
  choice: ili kumpata mwongofu mmoja
  rationale: Katika muktadha huu ποιέω ina maana ya kumfanya au kumpata mtu awe mwongofu. ‘Kumpata mwongofu’ ni ya asili zaidi kwa Kiswahili, huku ‘mwongofu’ ikihifadhi wazo la mtu anayejiunga na imani yao.
- source_word: ὅταν γένηται
  choice: anapokuwa mwongofu
  rationale: Huweka wazi kijalizo kinachoeleweka katika Kigiriki bila kuongeza kundi au taratibu ambazo hazikutajwa.
- source_word: υἱὸν γεέννης
  choice: mwana wa Gehena
  rationale: Huhifadhi istilahi γεέννα na nahau ya Kisemiti ‘mwana wa’ badala ya kuifafanua kimafundisho.
- source_word: διπλότερον ὑμῶν
  choice: mara mbili kuliko ninyi
  rationale: Huwasilisha ulinganisho wa Kigiriki kwa ufupi na kwa Kiswahili kinachoeleweka, bila kugeuza ‘mara mbili’ kuwa ‘mara mbili zaidi,’ ambako kunaweza kueleweka vibaya.
theological_decisions:
- issue: Tafsiri ya γεέννα
  choice: Gehena
  alternative: kuzimu
  rationale: Jina ‘Gehena’ huhifadhi neno maalumu la Kigiriki pamoja na mazingira yake ya Kiyahudi ya kihistoria na ya hukumu ya mwisho. Neno linalofahamika zaidi, ‘kuzimu,’ limetolewa katika tanbihi bila kulazimisha ulinganifu kamili wa dhana hizo.
- issue: Nahau υἱὸν γεέννης
  choice: mwana wa Gehena
  alternative: mtu anayestahili Gehena
  rationale: Tafsiri ya ‘mwana wa Gehena’ huhifadhi nahau yenyewe na mvutano wake wa kitheolojia; mbadala ungeifafanua maana yake na hivyo kupunguza taswira ya matini.
- issue: Rejeo la umoja baada ya προσήλυτον
  choice: mwongofu mmoja … anapokuwa mwongofu … mnamfanya
  alternative: mtu mmoja anapoongoka … mtu huyo
  rationale: Kiswahili hakihitaji kuonyesha jinsia ya kisarufi hapa. Umoja wa rejeo la Kigiriki umehifadhiwa kwa umbo la kawaida la Kiswahili bila kuongeza dai kwamba kifungu kinawahusu wanaume peke yao.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Muundo wa lawama ya moja kwa moja na uradidi wa ‘mwongofu’ umehifadhiwa kwa uwazi; ‘Gehena’ na nahau ‘mwana wa’ zimeachwa katika matini ili kutosawazisha maana yake ya Kiyahudi na ya hukumu kupita kiasi.
