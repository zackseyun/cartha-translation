  source_fidelity: 'Tafsiri inahifadhi kwa usahihi muundo wa kauli ya jumla katika Kigiriki: mtu yeyote aapaye kwa hekalu huapa pia kwa hekalu hilo na kwa yule anayekaa ndani yake. “Kwa” ni tafsiri sahihi ya kiidiomu ya ἐν katika muktadha wa kiapo, na “ndani yake” hurejelea hekalu.'
