  text: καὶ ὁ ὀμόσας ἐν τῷ ναῷ ὀμνύει ἐν αὐτῷ καὶ ἐν τῷ ⸀κατοικοῦντι αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/021.yaml
  text: And whoever swears by the temple swears by it and by the One dwelling in it[a].
translation:
  language: sw
  text: Na yeyote anayeapa kwa hekalu, anaapa kwa hilo na kwa Yeye anayekaa ndani yake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika hekalu ... ndani yake”; kihusishi cha Kigiriki kwa maana ya moja kwa moja ni “katika,” lakini katika kauli hii ya kiapo kina maana ya “kwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ὀμόσας
  choice: yeyote anayeapa
  rationale: Kishiriki chenye kibainishi kinamtaja mtu yeyote kwa ujumla; usemi huu ni wa kawaida na unaeleweka katika Kiswahili cha sasa.
- source_word: ἐν τῷ ναῷ
  choice: kwa hekalu
  rationale: Ingawa ἐν kwa kawaida humaanisha ‘katika,’ katika kauli hii ya kiapo inaonyesha kile kinachotajwa kuwa dhamana ya kiapo, hivyo ‘kwa hekalu’ ni ya asili katika Kiswahili.
- source_word: ναῷ
  choice: hekalu
  rationale: ναός hapa hurejelea hekalu, hasa mahali patakatifu pa hekalu la Yerusalemu; ‘hekalu’ ni neno wazi na la kawaida kwa muktadha huu.
- source_word: ὀμνύει
  choice: anaapa
  rationale: Wakati wa sasa unaeleza kanuni ya jumla; ‘anaapa’ ni tafsiri fupi na ya asili.
- source_word: ἐν αὐτῷ
  choice: kwa hilo
  rationale: Kama ilivyo katika kishazi cha kwanza, ἐν ina maana ya kitu kinachotajwa katika kiapo; ‘hilo’ hurejelea hekalu.
- source_word: τῷ κατοικοῦντι αὐτόν
  choice: Yeye anayekaa ndani yake
  rationale: Kishiriki hiki humrejelea Mungu anayekaa hekaluni. ‘Anayekaa ndani yake’ huhifadhi taswira na hali endelevu ya κατοικοῦντι.
- source_word: αὐτόν
  choice: ndani yake
  rationale: Kiwakilishi kinarejelea hekalu; Kiswahili hutumia ‘-ke’ kwa ngeli ya hekalu katika usemi huu.
theological_decisions:
- issue: Utambulisho wa anayekaa hekaluni
  choice: ‘Yeye’ humrejelea Mungu kwa njia iliyo wazi katika muktadha
  alternative: ‘yeye’ kwa herufi ndogo, ambayo ingeacha marejeleo yakiwa ya kidokezo zaidi
  rationale: Muktadha unaonyesha kwamba kiapo kwa hekalu kinamhusisha Mungu anayekaa humo. Herufi kubwa inaashiria marejeleo hayo bila kuongeza dai jipya la kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi umehifadhi usambamba wa kauli mbili za kiapo.
