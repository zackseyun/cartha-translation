  yaml_path: translation/nt/matthew/023/010.yaml
  text: Do not be called instructors, for you have one instructor, the Messiah[a].
translation:
  language: sw
  text: Wala msiitwe viongozi, kwa maana kiongozi wenu ni mmoja, ndiye Masihi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kristo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδὲ
  choice: Wala msi-
  rationale: “Wala” linaendeleza mfululizo wa makatazo katika muktadha uliotangulia, huku “msi-” likibeba katazo lenyewe kwa Kiswahili cha kawaida.
- source_word: κληθῆτε
  choice: msiitwe
  rationale: Kauli tendwa ya καλέω hapa inahusu kuitwa kwa cheo au jina fulani; “msiitwe” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: καθηγηταί / καθηγητής
  choice: viongozi / kiongozi
  rationale: Neno hili humaanisha mtu anayeongoza au kuelekeza. “Kiongozi” linafaa kama cheo na halichanganyi neno hili na διδάσκαλος (“mwalimu”) lililo karibu katika muktadha.
- source_word: ὅτι
  choice: kwa maana
  rationale: Kiunganishi hiki kinatoa sababu ya katazo, na “kwa maana” ni cha asili na chenye hadhi katika usemi huu.
- source_word: ὑμῶν ἐστιν εἷς
  choice: wenu ni mmoja
  rationale: Muundo huu unahifadhi msisitizo wa Kigiriki kwamba wana kiongozi mmoja tu bila kulazimisha mpangilio usio wa kawaida katika Kiswahili.
- source_word: ὁ χριστός
  choice: Masihi
  rationale: Hapa Χριστός linatumika kama cheo; “Masihi” huhifadhi maana yake na muktadha wake wa Kiyahudi.
theological_decisions:
- issue: Tafsiri ya Χριστός
  choice: Masihi
  alternative: Kristo
  rationale: Kifungu hiki kinatumia neno hilo kama cheo, si kama jina tu. “Masihi” huonyesha maana ya cheo hicho, huku tanbihi ikihifadhi tafsiri mbadala iliyozoeleka.
- issue: Maana ya καθηγητής
  choice: kiongozi
  alternative: mwelekezaji
  rationale: Neno la Kigiriki linaweza kumaanisha anayeongoza au kufundisha. “Kiongozi” linaweka wazi matumizi yake kama cheo na kudumisha utofauti na “mwalimu” katika mistari ya karibu, bila kuondoa wigo wa maana wa kuongoza.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Wala” linaunganisha mstari na makatazo yaliyotangulia; “yaani” linamtambulisha Masihi kuwa huyo kiongozi mmoja bila kudokeza kuwa ni kiongozi wa pili.
