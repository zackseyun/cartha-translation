  text: καὶ ὁ ὀμόσας ἐν τῷ οὐρανῷ ὀμνύει ἐν τῷ θρόνῳ τοῦ θεοῦ καὶ ἐν τῷ καθημένῳ ἐπάνω αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/022.yaml
  text: And whoever swears by heaven swears by the throne of God and by the one seated upon it[a].
translation:
  language: sw
  text: Na yeyote anayeapa kwa mbingu huapa kwa kiti cha enzi cha Mungu na kwa yule anayeketi juu yake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “yule aketiye juu yake.”
    reason: Mbadala wa kimtindo wa Kiswahili kwa participio τῷ καθημένῳ; hudumisha maana ya yule aliye katika hali ya kuketi juu ya kiti cha enzi.
lexical_decisions:
- source_word: ὁ ὀμόσας
  choice: yeyote anayeapa
  rationale: Kirai nomino chenye participio ya aoristi kinatumika kwa maana ya jumla. Muundo huu wa Kiswahili unaeleza kanuni inayomhusu mtu yeyote, bila kuifanya kuwa tendo la wakati uliopita.
- source_word: ἐν
  choice: kwa
  rationale: Katika kauli za kiapo, ἐν pamoja na dativu ina maana ya chombo au kitu kinachotajwa katika kiapo; kwa hiyo ‘kuapa kwa’ ni Kiswahili cha kawaida na sahihi hapa.
- source_word: οὐρανῷ
  choice: mbingu
  rationale: Katika muktadha huu wa kidini, neno hilo linarejelea makao ya mbinguni, si anga tu, hasa kwa kuwa linaunganishwa mara moja na kiti cha enzi cha Mungu.
- source_word: ὀμνύει
  choice: anaapa
  rationale: Kitenzi cha wakati wa sasa kinaeleza ukweli wa jumla; wakati wa sasa wa Kiswahili unafaa kwa matumizi hayo.
- source_word: θρόνῳ τοῦ θεοῦ
  choice: kiti cha enzi cha Mungu
  rationale: Tafsiri hii inahifadhi muundo wa umilikaji wa Kigiriki na lugha ya heshima inayohusiana na utawala wa kifalme.
- source_word: τῷ καθημένῳ
  choice: yule anayeketi
  rationale: Partisipio hii humtaja aliye katika hali ya kuketi kwenye kiti cha enzi. ‘Anayeketi’ ni ya kawaida na ya sasa katika Kiswahili, huku ikihifadhi taswira ya maandiko.
- source_word: ἐπάνω αὐτοῦ
  choice: juu yake
  rationale: Katika muktadha wa kiti cha enzi, kirai hiki humaanisha kuketi juu ya kiti hicho, si kuwa mbali juu yake. Kiwakilishi ‘yake’ kinarejelea kiti cha enzi.
theological_decisions:
- issue: Mrejelewa wa ‘yule anayeketi juu yake’
  choice: Kauli ya heshima inayomrejelea Mungu akiwa ameketi kwenye kiti chake cha enzi
  alternative: 'Kauli isiyoainisha wazi: ‘yule anayeketi hapo’'
  rationale: Kirai kilichotangulia, ‘kiti cha enzi cha Mungu,’ kinamfanya mrejelewa awe wazi. Hata hivyo, tafsiri haibadilishi kauli hii kuwa ‘Mungu,’ bali inadumisha namna ya usemi wa Kigiriki na uzito wake wa kitheolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Kiti cha enzi’ kinadumisha taswira ya kifalme; ‘yeyote anayeapa’ ni ya kawaida na inaeleweka kwa wasomaji wengi. Alama ya tanbihi [a] imewekwa katika matini kuu.
