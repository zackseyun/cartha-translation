id: MAT.23.35
reference: Matthew 23:35
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὅπως ἔλθῃ ἐφ’ ὑμᾶς πᾶν αἷμα δίκαιον ἐκχυννόμενον ἐπὶ τῆς γῆς ἀπὸ τοῦ αἵματος Ἅβελ τοῦ δικαίου ἕως τοῦ αἵματος Ζαχαρίου υἱοῦ Βαραχίου, ὃν ἐφονεύσατε μεταξὺ τοῦ ναοῦ καὶ τοῦ θυσιαστηρίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/035.yaml
  text: so that upon you may come all the righteous blood being poured out on the earth[a], from the blood of righteous Abel to the blood of Zechariah son of Berechiah[b], whom you murdered between the sanctuary and the altar.
translation:
  language: sw
  text: ili juu yenu ije damu yote ya wenye haki inayomwagwa duniani[a], tangu damu ya Abeli mwenye haki mpaka damu ya Zekaria mwana wa Barakia[b], ambaye mlimwua katikati ya patakatifu na madhabahu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika nchi.” Neno la Kigiriki linaweza kumaanisha “dunia” au “nchi.”
    reason: lexical_alternative
  - marker: b
    text: Utambulisho wa “Zekaria mwana wa Barakia” unabishaniwa. Wengine humhusianisha na nabii Zekaria; wengine humhusianisha na Zekaria mwana wa Yehoyada (2 Mambo ya Nyakati 24:20–22). Tafsiri hii inafuata maandishi ya Kigiriki kama yalivyo.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπως
  choice: ili
  rationale: Huonyesha kusudi au matokeo yanayotokana na shutuma iliyotangulia, kwa Kiswahili cha kawaida na chenye uzito.
- source_word: ἔλθῃ ἐφ’ ὑμᾶς
  choice: juu yenu ije
  rationale: Huhifadhi wazo la damu kuja juu yao katika maana ya hukumu na hatia, pamoja na hali ya uwezekano/kusudi ya kitenzi.
- source_word: πᾶν αἷμα δίκαιον
  choice: damu yote ya wenye haki
  rationale: Ingawa Kigiriki kina nomino ya umoja, usemi huu unarejelea kwa njia ya metonimia damu ya watu wote wenye haki; muundo huu ni wazi na wa asili kwa Kiswahili.
- source_word: ἐκχυννόμενον
  choice: inayomwagwa
  rationale: Huhifadhi taswira ya kumwaga damu na hali endelevu ya kitenzi-shirikishi cha wakati uliopo, badala ya kuifanya kuwa tukio lililofungwa kabisa katika wakati uliopita.
- source_word: ἐπὶ τῆς γῆς
  choice: duniani
  rationale: γῆ yaweza kumaanisha dunia au nchi; muktadha mpana kuanzia Abeli unaunga mkono 'duniani,' huku maana nyingine ikihifadhiwa katika tanbihi.
- source_word: ἀπὸ τοῦ αἵματος Ἅβελ τοῦ δικαίου
  choice: tangu damu ya Abeli mwenye haki
  rationale: Huhifadhi mwanzo wa wigo wa ἀπό...ἕως na sifa ya Abeli kuwa mwenye haki.
- source_word: ἕως τοῦ αἵματος Ζαχαρίου υἱοῦ Βαραχίου
  choice: mpaka damu ya Zekaria mwana wa Barakia
  rationale: Ni tafsiri ya kawaida na wazi ya mwisho wa wigo, huku majina yakitoholewa kwa tahajia ya Kiswahili.
- source_word: ὃν ἐφονεύσατε
  choice: ambaye mlimwua
  rationale: Kitenzi 'mlimwua' kinawasilisha moja kwa moja shtaka la φονεύω; muktadha unaonyesha uuaji wenye hatia, bila kutumia neno lisilo la kawaida katika Kiswahili cha sasa.
- source_word: μεταξὺ τοῦ ναοῦ καὶ τοῦ θυσιαστηρίου
  choice: katikati ya patakatifu na madhabahu
  rationale: ναός hapa ni sehemu takatifu ya hekalu, si eneo lote la hekalu; 'patakatifu' huhifadhi utofautisho huo.
theological_decisions:
- issue: Utambulisho wa Zekaria mwana wa Barakia
  choice: Kuhifadhi jina kama lilivyo katika maandishi ya Kigiriki bila kulisawazisha au kulibadili.
  alternative: Kumtambua kama nabii Zekaria mwana wa Barakia, au kumhusianisha na Zekaria mwana wa Yehoyada wa 2 Mambo ya Nyakati 24:20–22.
  rationale: Utambulisho huu unabishaniwa. Tafsiri inapaswa kufuata maandishi ya Kigiriki huku ikihifadhi tatizo la kihistoria katika tanbihi badala ya kulitatua kimyakimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa mwanzo umehifadhiwa kwa kiasi ili kubeba msisitizo wa hukumu, lakini bila kuifanya sentensi kuwa ngumu isivyo lazima.
