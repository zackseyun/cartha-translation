  source_fidelity: 'Tafsiri inafuata kwa uaminifu muundo na maana ya Kigiriki: ὅπως imewasilishwa kwa “ili”; ἔλθῃ ἐφ’ ὑμᾶς kwa “juu yenu ije”; wigo wa “tangu ... mpaka ...” unahifadhiwa; na shtaka la kuua pamoja na mahali “katikati ya patakatifu na madhabahu” umewekwa wazi. “Inayomwagwa” huakisi ipasavyo kitenzi-shirikishi cha wakati uliopo ἐκχυννόμενον bila kuondoa taswira ya kumwaga damu.'
