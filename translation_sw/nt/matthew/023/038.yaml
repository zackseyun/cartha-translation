  text: Look[a], your house is left to you desolate.
translation:
  language: sw
  text: Tazama, nyumba yenu[a] imeachwa kwenu katika hali ya ukiwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “hekalu lenu”; usemi “nyumba yenu” huenda unarejelea hasa hekalu, ingawa Kigiriki kinaacha maana yake ikiwa pana zaidi.
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: Tazama
  rationale: Ni tamko la kawaida na lenye uzito la kuvuta fikira katika Kiswahili cha sasa, bila kutumia mtindo wa kizamani.
- source_word: ἀφίεται
  choice: imeachwa
  rationale: Huhifadhi hali ya kutendwa ya kitenzi cha Kigiriki bila kutaja wazi mtendaji wala kufasiri kwa nguvu zaidi kuwa ‘imetelekezwa.’
- source_word: ὑμῖν
  choice: kwenu
  rationale: Huhifadhi maana ya kitu kuachwa kwa wahusika wanaosemeshwa, kwa muundo wa asili wa Kiswahili.
- source_word: ὁ οἶκος ὑμῶν
  choice: nyumba yenu
  rationale: Ni tafsiri ya moja kwa moja inayohifadhi upana wa usemi wa Kigiriki badala ya kuufanya moja kwa moja kuwa hekalu, Yerusalemu, au taifa.
- source_word: ἔρημος
  choice: katika hali ya ukiwa
  rationale: Huwasilisha maana ya kuachwa pasipo watu na chini ya hukumu kwa Kiswahili cha kawaida; muundo huu pia huepuka mkanganyiko wa kisarufi ambao ungeweza kutokea kwa kutumia ‘ukiwa’ peke yake kama kivumishi.
theological_decisions:
- issue: Kirejelewa cha ‘nyumba yenu’
  choice: Usemi ‘nyumba yenu’ umehifadhiwa katika matini kuu.
  alternative: ‘hekalu lenu,’ ‘Yerusalemu,’ au ‘nyumba/taifa la Israeli’
  rationale: Muktadha unaelekeza hasa kwa hekalu na Yerusalemu, lakini Kigiriki kina usemi mpana zaidi. Kutaja tu ‘nyumba’ kunahifadhi taswira na mvutano wa kinabii bila kulazimisha fasiri moja.
- issue: Nguvu ya ἔρημος katika tangazo la hukumu
  choice: ‘katika hali ya ukiwa’
  alternative: ‘tupu,’ ‘imeachwa bila watu,’ au ‘imeharibiwa’
  rationale: ‘Ukiwa’ huhifadhi uzito wa kinabii wa kuachwa na uharibifu unaodokezwa, bila kudai wazi kwamba nyumba tayari imebomolewa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni fupi na nzito kama tangazo la hukumu; ‘Tazama’ huhifadhi mwito wa kusikiliza, na ‘nyumba yenu’ huhifadhi utata wa makusudi wa matini.
