id: MAT.23.27
reference: Matthew 23:27
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι ⸀παρομοιάζετε τάφοις κεκονιαμένοις, οἵτινες ἔξωθεν μὲν φαίνονται ὡραῖοι ἔσωθεν δὲ γέμουσιν ὀστέων νεκρῶν καὶ πάσης ἀκαθαρσίας·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/027.yaml
  text: Woe to you[a], scribes and Pharisees, hypocrites! For you are like whitewashed tombs, which outwardly appear beautiful[b], but inwardly are full of dead people's bones and every kind of uncleanness.
translation:
  language: sw
  text: Ole wenu, walimu wa sheria na Mafarisayo, wanafiki! Kwa maana mnafanana na makaburi yaliyopakwa chokaa[a]. Kwa nje yanaonekana kuwa mazuri, lakini kwa ndani yamejaa mifupa ya wafu na kila aina ya uchafu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, makaburi yaliyofanywa meupe kwa chokaa.
    reason: lexical_alternative
  - marker: b
    text: Katika muktadha huu, “uchafu” unaweza kumaanisha unajisi wa kidini na pia upotovu wa kimaadili.
    reason: cultural_note
lexical_decisions:
- source_word: Οὐαὶ
  choice: Ole wenu
  rationale: Kauli hii ya kinabii inaonyesha hukumu na shutuma kali, si huzuni peke yake.
- source_word: γραμματεῖς
  choice: walimu wa sheria
  rationale: Huwatambulisha kwa kazi yao kama wataalamu na wafundishaji wa sheria; neno la moja kwa moja “waandishi” linaweza kueleweka vibaya katika Kiswahili cha sasa kuwa waandishi wa vitabu.
- source_word: Φαρισαῖοι
  choice: Mafarisayo
  rationale: Hili ndilo jina la kawaida la Kiswahili kwa kundi hili la Kiyahudi.
- source_word: ὑποκριταί
  choice: wanafiki
  rationale: Linafikisha wazi shutuma ya kujionyesha kwa nje kuwa waadilifu huku hali ya ndani ikiwa tofauti.
- source_word: παρομοιάζετε
  choice: mnafanana na
  rationale: Linahifadhi wakati wa sasa na ulinganisho wa moja kwa moja wa Kigiriki kwa Kiswahili cha kawaida.
- source_word: τάφοις κεκονιαμένοις
  choice: makaburi yaliyopakwa chokaa
  rationale: “Makaburi” yanafaa kwa mahali pa kuzikia, na “yaliyopakwa chokaa” linaonyesha kitendo halisi cha kuyafanya meupe.
- source_word: ἔξωθεν μὲν ... ἔσωθεν δὲ
  choice: kwa nje ... lakini kwa ndani
  rationale: Muundo huu wa kawaida wa Kiswahili unadumisha utofauti mkali kati ya mwonekano wa nje na hali ya ndani.
- source_word: φαίνονται ὡραῖοι
  choice: yanaonekana kuwa mazuri
  rationale: Linadumisha mkazo wa Kigiriki juu ya jinsi yanavyoonekana, bila kusema kwamba uzuri huo ndio hali yao halisi.
- source_word: γέμουσιν ὀστέων νεκρῶν
  choice: yamejaa mifupa ya wafu
  rationale: Hii ni kauli ya asili na iliyo wazi katika Kiswahili, inayowasilisha picha ya ndani ya kaburi.
- source_word: πάσης ἀκαθαρσίας
  choice: kila aina ya uchafu
  rationale: “Uchafu” ni pana vya kutosha kujumuisha unajisi wa kidini na upotovu wa kimaadili bila kuamua maana moja tu.
theological_decisions:
- issue: Maana ya ἀκαθαρσία katika mfano
  choice: kila aina ya uchafu
  alternative: unajisi wa kidini pekee; au upotovu wa kimaadili pekee
  rationale: Makaburi yalihusishwa na unajisi wa kidini katika mazingira ya Kiyahudi, lakini shutuma ya Yesu pia inalenga uovu wa ndani. Tafsiri pana inadumisha mvutano huo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imegawanywa baada ya picha ya makaburi ili iwe rahisi kusoma huku utofauti wa “kwa nje ... lakini kwa ndani” ukibaki wazi.
