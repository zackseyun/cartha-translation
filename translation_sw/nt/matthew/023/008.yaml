  text: ὑμεῖς δὲ μὴ κληθῆτε· Ῥαββί, εἷς γάρ ἐστιν ὑμῶν ὁ ⸀διδάσκαλος, πάντες δὲ ὑμεῖς ἀδελφοί ἐστε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/008.yaml
  text: But you are not to be called ‘Rabbi,’ for one is your teacher[b][a], and you are all brothers.
translation:
  language: sw
  text: Lakini ninyi msiitwe “Rabi,”[a] kwa maana mwalimu wenu ni mmoja, nanyi nyote ni ndugu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Mwalimu.” Cheo hiki “Rabi” kina maana ya mwalimu, lakini kulitohowa kunahifadhi mazingira ya Kiyahudi na hakulichanganyi na neno “mwalimu” linalofuata katika aya.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kigiriki lililotafsiriwa “ndugu” ni wingi wa kiume. Katika muktadha linaweza kuwataja wanafunzi wenzake kwa pamoja.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ κληθῆτε
  choice: msiitwe
  rationale: Kauli hii ya kutendwa pamoja na μή inatoa katazo. “Msiitwe” ni Kiswahili cha kawaida kinachohifadhi katazo hilo bila kulipanua zaidi ya maneno ya aya.
- source_word: Ῥαββί
  choice: Rabi
  rationale: Neno la cheo limetoholewa badala ya kutafsiriwa kuwa “Mwalimu,” hivyo linahifadhi mazingira ya Kiyahudi na kutofautishwa na διδάσκαλος inayofuata.
- source_word: εἷς
  choice: mmoja
  rationale: “Mmoja” ni kisawe cha moja kwa moja kinachohifadhi msisitizo wa umoja bila kuongeza neno la ufafanuzi kama “mmoja tu.”
- source_word: ὑμῶν ὁ διδάσκαλος
  choice: mwalimu wenu
  rationale: Kifungu hiki kinaonyesha uhusiano wa mwalimu na wanafunzi. “Mwalimu wenu” ni cha asili katika Kiswahili na kinadumisha maana hiyo.
- source_word: πάντες δὲ ὑμεῖς
  choice: nanyi nyote
  rationale: Muundo huu unahifadhi msisitizo kwamba wote katika kundi wana hadhi ileile.
- source_word: ἀδελφοί
  choice: ndugu
  rationale: “Ndugu” linahifadhi sitiari ya kifamilia. Kwa Kiswahili, neno hili halibainishi jinsia, ingawa neno la Kigiriki ni wingi wa kiume na katika muktadha linaweza kulitaja kundi lote la wanafunzi.
theological_decisions:
- issue: Je, Yesu anakataza kabisa matumizi yote ya vyeo vya kibinadamu, au anakemea kutafuta hadhi miongoni mwa wanafunzi?
  choice: 'Tafsiri inahifadhi katazo la moja kwa moja: “msiitwe ‘Rabi.’”'
  alternative: Kulipanua kuwa marufuku ya jumla ya kila cheo kinachofanana, au kulipunguza kuwa katazo la tamaa ya hadhi pekee.
  rationale: Kigiriki kinatoa katazo na sababu yake, lakini aya yenyewe haifafanui matumizi yake yote katika hali za baadaye. Tafsiri haipaswi kutatua mvutano huo kwa kuongeza fundisho lisilotajwa wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Mpangilio “mwalimu wenu ni mmoja” ni wa asili na unahifadhi msisitizo wa εἷς.
