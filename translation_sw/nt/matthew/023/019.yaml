base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/019.yaml
  text: Blind men[a], for which is greater[b], the gift or the altar that sanctifies the gift?
translation:
  language: sw
  text: 'Enyi vipofu! Kwa maana, ni kipi kilicho kikubwa zaidi: sadaka[a], au madhabahu inayoifanya sadaka kuwa takatifu?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “zawadi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τυφλοί
  choice: Enyi vipofu
  rationale: Ni kivumishi cha wingi kilichotumiwa kama nomino katika mwito wa moja kwa moja. “Enyi vipofu” ni karipio la kawaida na lenye nguvu, bila kuongeza neno “wapumbavu,” ambalo halipo katika matini hii.
- source_word: τί γὰρ μεῖζον
  choice: Kwa maana, ni kipi kilicho kikubwa zaidi
  rationale: “Kwa maana” linaonyesha nguvu ya ufafanuzi ya γάρ, na swali “ni kipi kilicho kikubwa zaidi” linadumisha ulinganisho wa μεῖζον bila kuufasiri tu kuwa “muhimu zaidi.”
- source_word: τὸ δῶρον
  choice: sadaka
  rationale: δῶρον kimsingi ni zawadi, lakini katika muktadha wa hekalu humaanisha kitu kinachotolewa kwa Mungu. “Sadaka” ni neno la kawaida na wazi zaidi katika Kiswahili cha sasa; “zawadi” imehifadhiwa katika tanbihi kama maana mbadala ya karibu.
- source_word: θυσιαστήριον
  choice: madhabahu
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa altar katika muktadha wa ibada na linadumisha mazingira ya hekalu.
- source_word: τὸ ἁγιάζον
  choice: inayoifanya sadaka kuwa takatifu
  rationale: Muundo huu unaeleza kwa Kiswahili cha kawaida maana ya ἁγιάζω na kudumisha hoja kwamba madhabahu huipa sadaka utakatifu. “Inayoitakasa” ni mbadala mfupi wenye uzito wa kiibada.
theological_decisions:
- issue: Lugha ya kiibada ya ἁγιάζω kuhusu madhabahu na sadaka
  choice: inayoifanya sadaka kuwa takatifu
  alternative: inayoitakasa sadaka
  rationale: Tafsiri inadumisha dhana ya matini kwamba madhabahu huipa sadaka utakatifu, bila kupunguza jambo hilo kuwa tendo la nje la kidini wala kuliongezea ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Karipio “Enyi vipofu!” ni la moja kwa moja na la asili; sentensi inayofuata inadumisha swali la ulinganisho na lugha ya utakatifu wa hekalu.
