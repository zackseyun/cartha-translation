  yaml_path: translation/nt/matthew/023/030.yaml
  text: and you say[a], ‘If we had been living in the days of our fathers[b], we would not have been partners with them in the blood of the prophets.’
translation:
  language: sw
  text: Nanyi mnasema, “Kama tungalikuwako katika siku za baba zetu, tusingalikuwa washirika wao[a] katika damu ya manabii.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, washirika pamoja nao katika kumwaga damu ya manabii; wanadai kwamba wasingeshiriki katika hatia ya damu ya baba zao.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγετε
  choice: mnasema
  rationale: Kitenzi cha wakati uliopo, nafsi ya pili wingi, kimetafsiriwa kama usemi wa moja kwa moja katika lawama ya Yesu.
- source_word: Εἰ ἤμεθα ἐν ταῖς ἡμέραις
  choice: Kama tungaliishi katika siku
  rationale: Muundo wa sharti lisilotimia kuhusu wakati uliopita umeonyeshwa kwa ‘kama tungaliishi’; ‘katika siku’ huhifadhi nahau ya Kigiriki na mtindo wa kibiblia unaoeleweka.
- source_word: τῶν πατέρων ἡμῶν
  choice: za baba zetu
  rationale: Huhifadhi maana ya moja kwa moja ya πατέρων na rejeo kwa mababu wa kiume bila kuigeuza kuwa istilahi pana zaidi.
- source_word: οὐκ ἂν ἤμεθα
  choice: tusingalishirikiana
  rationale: Umbo la ‘-ngali-’ linaonyesha matokeo yasiyotokea ya sharti la wakati uliopita kwa Kiswahili sanifu.
- source_word: αὐτῶν κοινωνοὶ
  choice: tusingalishirikiana nao
  rationale: κοινωνοί huonyesha kushiriki pamoja au kuwa na ushirika katika tendo; ‘kushirikiana nao’ ni ya asili na haiongezi moja kwa moja neno lenye nguvu zaidi kama ‘washirika wa uhalifu’.
- source_word: ἐν τῷ αἵματι τῶν προφητῶν
  choice: katika damu ya manabii
  rationale: Tafsiri hii huhifadhi taswira halisi ya damu na utata wenye maana wa kirai cha Kigiriki badala ya kukifafanua moja kwa moja kuwa kumwaga damu au hatia ya damu.
theological_decisions:
- issue: Kiwango cha ushiriki au hatia kinachodokezwa na κοινωνοὶ ἐν τῷ αἵματι
  choice: kushirikiana nao katika damu ya manabii
  alternative: kuwa washirika wao katika kumwaga damu ya manabii
  rationale: Chaguo kuu huhifadhi lugha ya uhusiano ya κοινωνοί na taswira ya ‘damu,’ huku muktadha ukidokeza ushiriki katika mauaji na hatia yake bila tafsiri kufafanua zaidi ya maandishi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Miundo ‘tungaliishi/tusingalishirikiana’ huhifadhi sharti la wakati uliopita lisilotimia. Alama ya tanbihi [a] imewekwa katika maandishi.
