  yaml_path: translation/nt/matthew/023/011.yaml
  text: But the greatest among you will be your servant[a].
translation:
  language: sw
  text: Lakini aliye mkuu zaidi miongoni mwenu atakuwa mtumishi wenu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata muundo wa Kigiriki kwa karibu zaidi, “aliye mkuu miongoni mwenu atakuwa mtumishi wenu.” Neno la Kigiriki lililo katika daraja la kulinganisha linaweza kutumiwa kumaanisha mtu mwenye cheo cha juu zaidi ndani ya kundi.
    reason: lexical_alternative
lexical_decisions:
- source_word: μείζων
  choice: aliye mkuu zaidi
  rationale: Ingawa ni umbo la kulinganisha, katika muktadha huu linaweza kutumiwa kwa maana inayokaribia daraja la juu zaidi ndani ya kundi. Kauli hii ni ya asili katika Kiswahili na bado inaonyesha wazo la cheo au ukuu.
- source_word: ὑμῶν (ya kwanza)
  choice: miongoni mwenu
  rationale: 'Hii inaonyesha wazi maana ya sehemu ya kundi: mtu aliye mkuu ndani ya wale wanaosemewa.'
- source_word: ἔσται
  choice: atakuwa
  rationale: Ni tafsiri ya kawaida na ya sasa ya wakati ujao wa εἰμί.
- source_word: ὑμῶν (ya pili)
  choice: wenu
  rationale: Hii inawakilisha uhusiano wa διάκονος na kundi linalosemewa kwa Kiswahili cha kawaida.
- source_word: διάκονος
  choice: mtumishi
  rationale: Katika muktadha huu neno linamaanisha mtu anayewatumikia wengine, si cheo maalumu cha kanisa. “Mtumishi” huhifadhi maana ya huduma bila kuingiza wadhifa wa kikanisa.
- source_word: δὲ
  choice: Lakini
  rationale: Kiunganishi hiki kinaonyesha tofauti kati ya kutafuta hadhi na ukuu unaodhihirishwa kwa kuwatumikia wengine.
theological_decisions:
- issue: Lugha ya hadhi katika fundisho la Yesu kuhusu ukuu na utumishi
  choice: aliye mkuu zaidi miongoni mwenu atakuwa mtumishi wenu
  alternative: aliye mkubwa miongoni mwenu atakuwa mhudumu wenu
  rationale: 'Tafsiri inaendeleza ugeuzaji wa hadhi unaofundishwa na Yesu: mwenye ukuu anatakiwa kuwa mtumishi. Haifanyi διάκονος kuwa cheo cha baadaye cha kanisa wala kuondoa mvutano kati ya ukuu na utumishi.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. “Mkuu zaidi” limetumiwa badala ya lugha ya kikanisa, na “mtumishi” linaweka wazi tendo la kuwatumikia wengine.
