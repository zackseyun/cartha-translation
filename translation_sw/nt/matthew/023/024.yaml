  yaml_path: translation/nt/matthew/023/024.yaml
  text: Blind guides[a], straining out the gnat but swallowing the camel!
translation:
  language: sw
  text: Enyi viongozi vipofu! Mnachuja mbu[a], lakini mnameza ngamia!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mnachuja kinywaji ili kumwondoa mbu.” Kitenzi cha Kigiriki humaanisha kuchuja kimiminika ili kuondoa kitu kisichotakiwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁδηγοὶ
  choice: viongozi
  rationale: Neno hili humaanisha watu wanaowaongoza wengine. “Viongozi” ni la kawaida na linafaa kwa muktadha wa viongozi wa kidini, huku likihifadhi wazo la kuwaelekeza wengine.
- source_word: τυφλοί
  choice: vipofu
  rationale: Linahifadhi moja kwa moja picha kali ya upofu wa kiroho iliyotumiwa katika karipio hili.
- source_word: διϋλίζοντες
  choice: mnachuja
  rationale: Kitenzi cha Kigiriki humaanisha kuchuja kimiminika ili kuondoa kitu kisichotakiwa. “Mnachuja” ni usemi wa kawaida wa Kiswahili na unadumisha picha hiyo bila kuongeza maelezo ndani ya mstari.
- source_word: τὸν κώνωπα
  choice: mbu
  rationale: κώνωψ ni mdudu mdogo kama mbu. “Mbu” ni neno la kawaida na linaloeleweka katika Kiswahili cha Afrika Mashariki, na linaendeleza tofauti kati ya mdudu mdogo sana na ngamia.
- source_word: τὴν δὲ κάμηλον
  choice: lakini ... ngamia
  rationale: “Lakini” linawakilisha δέ ya utofautishaji, na “ngamia” linahifadhi taswira halisi na ya kupindukia ya chanzo.
- source_word: καταπίνοντες
  choice: mnameza
  rationale: “Mnameza” ni tafsiri ya moja kwa moja na ya kawaida, inayohifadhi taswira kali bila kuongeza ladha ya mazungumzo isiyomo katika Kigiriki.
theological_decisions:
- issue: Nguvu ya sitiari ya uchafu wa kidini na uwiano wa maadili
  choice: Kudumisha picha halisi ya kuchuja mbu na kumeza ngamia kama karipio kuhusu kupotosha uzito wa mambo.
  alternative: Kufafanua moja kwa moja kuwa wanajali makosa madogo huku wakipuuza makubwa.
  rationale: Nguvu ya mstari inatokana na picha ya kipuuzi ya kuondoa kitu kidogo sana huku ukimeza kikubwa mno. Kudumisha picha hiyo kunaheshimu Kigiriki na huepuka kuingiza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa nafsi ya pili “mnachuja ... mnameza” unaonyesha wazi kuwa Yesu anawahutubia viongozi hao, kama inavyodokezwa na vivumishi endelevu vya Kigiriki. Alama ya tanbihi imewekwa kwenye kitenzi kinachofafanuliwa.
