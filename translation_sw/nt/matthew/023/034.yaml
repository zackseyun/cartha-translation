id: MAT.23.34
reference: Matthew 23:34
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: διὰ τοῦτο ἰδοὺ ἐγὼ ἀποστέλλω πρὸς ὑμᾶς προφήτας καὶ σοφοὺς καὶ γραμματεῖς· ⸀ἐξ αὐτῶν ἀποκτενεῖτε καὶ σταυρώσετε, καὶ ἐξ αὐτῶν μαστιγώσετε ἐν ταῖς συναγωγαῖς ὑμῶν καὶ διώξετε ἀπὸ πόλεως εἰς πόλιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/034.yaml
  text: Therefore, look, I am sending to you prophets and wise men and scribes. Some of them you will kill and crucify, and some of them you will flog in your synagogues and persecute from city to city.
translation:
  language: sw
  text: Kwa hiyo, tazameni, ninawatuma kwenu manabii, wenye hekima na waandishi. Baadhi yao mtawaua na kuwasulubisha, na baadhi yao mtawapiga mijeledi katika masinagogi yenu na kuwatesa kutoka mji mmoja hadi mwingine.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Kwa hiyo
  rationale: Huonyesha hitimisho au matokeo yanayotokana na hukumu iliyotangulia.
- source_word: ἰδοὺ
  choice: tazameni
  rationale: Amri ya wingi inawavuta wasikilizaji kuzingatia tangazo linalofuata; ni ya heshima na ya kawaida katika lugha ya kibiblia ya Kiswahili.
- source_word: γραμματεῖς
  choice: waandishi
  rationale: Hifadhi ya istilahi ya kihistoria kwa wataalamu wa Maandiko, bila kuongeza ufafanuzi usiotajwa moja kwa moja hapa.
- source_word: μαστιγώσετε
  choice: mtawapiga mijeledi
  rationale: Hutoa wazi tendo la kuadhibu kwa mijeledi kuliko neno la jumla la kupiga.
- source_word: διώξετε
  choice: kuwatesa
  rationale: Katika muktadha huu humaanisha kuwafuatilia kwa uhasama na kuwadhulumu, si kuwafukuza mara moja tu.
- source_word: ἀπὸ πόλεως εἰς πόλιν
  choice: kutoka mji mmoja hadi mwingine
  rationale: Ni Kiswahili cha asili kinachohifadhi wazo la mateso yanayoendelea mahali baada ya mahali.
theological_decisions:
- issue: Msemaji anasema ἐγὼ ἀποστέλλω, ‘mimi ninawatuma’
  choice: ninawatuma
  alternative: nitawatuma
  rationale: Wakati wa sasa wa Kigiriki umehifadhiwa, ukiweza kueleza hatua inayotangazwa kuwa inaanza au iko karibu; haujageuzwa kimakusudi kuwa wakati ujao.
- issue: Uhusiano kati ya kuuawa na kusulubishwa katika ἐξ αὐτῶν ἀποκτενεῖτε καὶ σταυρώσετε
  choice: Baadhi yao mtawaua na kuwasulubisha
  alternative: Baadhi yao mtawaua, na wengine mtawasulubisha
  rationale: Muundo wa chanzo unaweza kusomwa kwa matendo yote mawili ndani ya kundi lilelile bila kulazimisha kuwa kila mtu binafsi atafanyiwa yote; tafsiri haiongezi mgawanyo mwingine ambao haupo wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inadumisha mkazo wa moja kwa moja wa onyo, orodha ya makundi matatu, na mfuatano wa vitendo vya uhasama.
