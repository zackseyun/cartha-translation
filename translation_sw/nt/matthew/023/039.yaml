id: MAT.23.39
reference: Matthew 23:39
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: λέγω γὰρ ὑμῖν, οὐ μή με ἴδητε ἀπ’ ἄρτι ἕως ἂν εἴπητε· Εὐλογημένος ὁ ἐρχόμενος ἐν ὀνόματι κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/039.yaml
  text: For I tell you[a], from now on you will certainly not see me until you say[b], ‘Blessed is he who comes in the name of the Lord.’
translation:
  language: sw
  text: Kwa maana ninawaambia[a], tangu sasa hakika hamtaniona mpaka mtakaposema[b], “Amebarikiwa yule anayekuja kwa jina la Bwana.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “ninawaambia: hakika hamtaniona tangu sasa mpaka mtakaposema.” Kigiriki kinatumia ukanushaji wenye mkazo (οὐ μή).'
    reason: lexical_alternative
  - marker: b
    text: Nukuu au dokezo la Zaburi 118:26.
    reason: cross_reference
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: Kwa maana ninawaambia
  rationale: “Ninawaambia” ni kauli ya moja kwa moja na ya kawaida katika Kiswahili; “kwa maana” inadumisha nguvu ya γάρ inayounganisha tamko hili na maombolezo na hukumu iliyotangulia.
- source_word: οὐ μή
  choice: hakika hamtaniona
  rationale: Muundo οὐ μή pamoja na subjunktivu ya aoristi ni ukanushaji wenye mkazo. “Hakika hamtaniona” unaonyesha uhakika wa kutotokea bila kuugeuza kuwa dai lisilo na kikomo la “kamwe.”
- source_word: ἴδητε
  choice: mtaniona
  rationale: Kitenzi ὁράω hapa kinamaanisha kuona; umbo lenye kiambishi cha yambwa linaweka wazi kwamba Yesu ndiye atakayeonekana.
- source_word: ἀπ’ ἄρτι
  choice: tangu sasa
  rationale: Hueleza kipindi kinachoanza wakati huu; “tangu sasa” ni Kiswahili cha kawaida na sahihi.
- source_word: ἕως ἂν εἴπητε
  choice: mpaka mtakaposema
  rationale: ἕως ἄν pamoja na subjunktivu huonyesha mpaka wa wakati unaotarajiwa baadaye bila kufafanua tukio au tarehe yake.
- source_word: Εὐλογημένος
  choice: Amebarikiwa
  rationale: Hili linadumisha maana na mwangwi wa Maandiko katika Zaburi 118:26; “amesifiwa” lingehamisha mkazo kutoka baraka kwenda sifa.
- source_word: ὁ ἐρχόμενος
  choice: yule anayekuja
  rationale: Kirai hiki cha partisipo chenye kibainishi kinamtaja mtu anayekuja bila kulazimisha maana maalumu ya cheo ambayo maandishi yenyewe hayaelezi wazi.
- source_word: ἐν ὀνόματι κυρίου
  choice: kwa jina la Bwana
  rationale: Katika Kiswahili, “kuja kwa jina la” ni usemi wa kawaida unaowakilisha ἐν ὀνόματι na kudumisha mtindo wa nukuu ya Maandiko.
- source_word: κυρίου
  choice: Bwana
  rationale: “Bwana” ndiyo tafsiri ya kawaida ya κύριος katika muktadha huu na inadumisha mwangwi wa nukuu ya Zaburi.
theological_decisions:
- issue: Nguvu ya tamko la Yesu kuhusu kuonekana tena na kukiri kwa maneno ya baraka
  choice: Tamko zito kwamba hawatamwona tangu wakati huo mpaka watakaposema maneno yaliyonukuliwa, bila kutaja wazi tukio au wakati hususa.
  alternative: Kulifasiri moja kwa moja kuwa kuingia Yerusalemu kwa shangwe, kuja kwa pili, au toba ya Israeli ya wakati ujao.
  rationale: Kigiriki kinaweka mpaka kwa “mpaka mtakaposema,” lakini hakifafanui hapa tukio la kihistoria au la mwisho wa nyakati. Tafsiri haipaswi kuamua mvutano huo wa kitheolojia kwa niaba ya msomaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Hakika hamtaniona” hudumisha mkazo wa ukanushaji; “yule anayekuja” ni ya kawaida na haiongezi tafsiri ya kimadhehebu.
