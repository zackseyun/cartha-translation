  text: ὥστε μαρτυρεῖτε ἑαυτοῖς ὅτι υἱοί ἐστε τῶν φονευσάντων τοὺς προφήτας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/031.yaml
  text: So you testify against yourselves that you are sons of those who murdered the prophets[a].
translation:
  language: sw
  text: Kwa hiyo, mnatoa ushahidi dhidi yenu wenyewe kwamba ninyi ni wana wa wale waliowaua manabii.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mnatoa ushahidi juu yenu wenyewe.” Muundo wa Kigiriki unaweza kutafsiriwa kwa ukaribu zaidi hivi, ingawa katika muktadha ushahidi wao unawahukumu wao wenyewe.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Kwa hiyo
  rationale: Inaonyesha hitimisho linalotokana na maneno yaliyotangulia; ni Kiswahili cha kawaida na chenye nguvu ya kimantiki.
- source_word: μαρτυρεῖτε ἑαυτοῖς
  choice: mnatoa ushahidi dhidi yenu wenyewe
  rationale: Kitenzi kinamaanisha kutoa ushahidi, na katika muktadha ushahidi wao wenyewe unawahukumu. Tafsiri hii inaweka wazi maana ya kimuktadha huku tanbihi ikihifadhi muundo wa karibu zaidi na Kigiriki.
- source_word: ὅτι
  choice: kwamba
  rationale: Inatanguliza yaliyomo katika ushahidi, wala si sababu.
- source_word: υἱοί
  choice: wana
  rationale: Inahifadhi taswira ya kifamilia na wingi wa kiume wa neno la Kigiriki, pamoja na maana ya ukoo na kufanana kwa matendo.
- source_word: τῶν φονευσάντων
  choice: wa wale waliowaua
  rationale: Inawatambulisha mababu kwa kitendo chao kilichokamilika cha kuwaua manabii; muktadha unaonyesha wazi kwamba mauaji hayo yalikuwa ya uovu.
- source_word: τοὺς προφήτας
  choice: manabii
  rationale: Ni tafsiri ya moja kwa moja ya kundi linalojulikana la wajumbe wa Mungu.
theological_decisions:
- issue: Iwapo υἱοί itafsiriwe kihalisi kama “wana” au kwa upana kama “watoto” au “wazao.”
  choice: wana
  alternative: watoto; wazao
  rationale: “Wana” huhifadhi lugha ya kifamilia na ukali wa hoja ya Yesu. Inadokeza ukoo halisi na pia mshikamano wao na matendo ya waliowatangulia bila kulazimisha mojawapo kuwa maana pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imewekwa wazi kwa wasomaji wa kawaida, huku tanbihi ikihifadhi uwezekano wa tafsiri ya karibu zaidi na muundo wa Kigiriki.
