id: MAT.23.17
reference: Matthew 23:17
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: μωροὶ καὶ τυφλοί, τίς γὰρ μείζων ἐστίν, ὁ χρυσὸς ἢ ὁ ναὸς ὁ ⸀ἁγιάσας τὸν χρυσόν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/017.yaml
  text: 'You fools and blind men, for which is greater: the gold, or the temple that sanctified the gold?'
translation:
  language: sw
  text: 'Enyi wapumbavu na vipofu! Kwa maana, kipi ni kikubwa zaidi: dhahabu, au hekalu[b] lililoifanya dhahabu kuwa takatifu[a]?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “lililoitakasa dhahabu.”
    reason: lexical_alternative
  - marker: b
    text: Neno la Kigiriki ναός linaweza kumaanisha hasa patakatifu pa hekalu.
    reason: cultural_note
lexical_decisions:
- source_word: μωροὶ
  choice: wapumbavu
  rationale: Ni kivumishi cha wingi katika usemi wa moja kwa moja. “Wapumbavu” ni karipio la kawaida, lenye nguvu na lenye heshima ya lugha kuliko maneno ya mtaani.
- source_word: τυφλοί
  choice: vipofu
  rationale: Ni kivumishi/nomino cha wingi kinachowataja watu moja kwa moja; “vipofu” ni Kiswahili cha kawaida na huhifadhi taswira ya upofu.
- source_word: τίς γὰρ μείζων ἐστίν
  choice: Kwa maana, kipi ni kikubwa zaidi
  rationale: “Kipi” huuliza uchaguzi kati ya vitu viwili vilivyotajwa, “kwa maana” huhifadhi nguvu ya ufafanuzi ya γάρ, na “kikubwa zaidi” huonyesha ulinganisho.
- source_word: ὁ χρυσὸς
  choice: dhahabu
  rationale: Katika Kiswahili, nomino hii kwa kawaida haihitaji kibainishi tofauti ili kurejelea dhahabu maalumu inayozungumziwa katika muktadha.
- source_word: ὁ ναὸς
  choice: hekalu
  rationale: “Hekalu” ni neno la kawaida na linaloeleweka; tanbihi inaeleza kwamba ναός inaweza kumaanisha hasa patakatifu pa hekalu.
- source_word: ὁ ἁγιάσας
  choice: lililoifanya ... kuwa takatifu
  rationale: Muundo huu wa Kiswahili unaeleza wazi tendo la hekalu kuipa dhahabu hadhi ya utakatifu, huku ukihifadhi mtazamo wa aoristi wa Kigiriki.
- source_word: τὸν χρυσόν
  choice: dhahabu
  rationale: Kurudia “dhahabu” badala ya kutumia kiwakilishi huhifadhi uwazi na ulinganifu wa hoja ya Kigiriki.
theological_decisions:
- issue: Tafsiri ya neno la ibada ἁγιάζω katika muktadha wa hekalu
  choice: lililoifanya dhahabu kuwa takatifu
  alternative: lililoitakasa dhahabu
  rationale: “Kuifanya kuwa takatifu” huonyesha wazi kwamba hekalu liliipa dhahabu hadhi takatifu bila kufasiri zaidi namna tendo hilo lilivyotokea. “Kuitakasa” ni fupi lakini kwa baadhi ya wasomaji inaweza kudokeza kuondoa uchafu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Karipio limehifadhiwa kwa nguvu bila kutumia lugha ya mtaani. Alama zote za tanbihi zimewekwa katika matini kuu.
