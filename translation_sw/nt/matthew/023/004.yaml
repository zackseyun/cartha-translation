  source_fidelity: 'Tafsiri inadumisha kwa uaminifu vitendo vya Kigiriki: kufunga mizigo mizito, kuiweka juu ya mabega ya watu, na kukataa kwa hiari kuisogeza kwa kidole. Kiambishi cha urejeshi katika “kuiweka” na “kuisogeza” kinakubaliana sawasawa na “mizigo” (ngeli ya 4).'
