id: MAT.23.4
reference: Matthew 23:4
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: δεσμεύουσιν ⸀δὲ φορτία ⸀βαρέα καὶ ἐπιτιθέασιν ἐπὶ τοὺς ὤμους τῶν ἀνθρώπων, ⸂αὐτοὶ δὲ τῷ⸃ δακτύλῳ αὐτῶν οὐ θέλουσιν κινῆσαι αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/004.yaml
  text: They tie up heavy burdens and lay them on the shoulders of men[a], but they themselves are unwilling to move them with their finger.
translation:
  language: sw
  text: Wao hufunga mizigo mizito na kuiweka mabegani mwa watu, lakini wao wenyewe hawataki kuisogeza hata kwa kidole chao.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δεσμεύουσιν
  choice: hufunga
  rationale: Kitenzi hiki hudumisha picha ya kufunga au kuandaa mizigo pamoja, na ni cha kawaida katika Kiswahili cha sasa.
- source_word: φορτία βαρέα
  choice: mizigo mizito
  rationale: Tafsiri hii huhifadhi picha halisi ya uzito pamoja na maana ya kimfano ya masharti yenye kulemea.
- source_word: ἐπιτιθέασιν ἐπὶ τοὺς ὤμους τῶν ἀνθρώπων
  choice: kuiweka mabegani mwa watu
  rationale: Huhifadhi picha dhahiri ya kuweka mzigo juu ya mabega; 'watu' hapa huwakilisha wanadamu kwa ujumla kama ilivyo maana ya ἀνθρώπων katika muktadha.
- source_word: αὐτοὶ δὲ
  choice: lakini wao wenyewe
  rationale: Neno 'wenyewe' huhifadhi msisitizo na tofauti kati ya wanachowatendea wengine na kile wanachokataa kufanya.
- source_word: τῷ δακτύλῳ αὐτῶν
  choice: hata kwa kidole chao
  rationale: 'Ingawa ''hata'' haijaandikwa kama neno tofauti katika Kigiriki, kwa Kiswahili huonyesha kwa kawaida nguvu ya msemo huu: hawako tayari kufanya juhudi ndogo kabisa.'
- source_word: οὐ θέλουσιν κινῆσαι αὐτά
  choice: hawataki kuisogeza
  rationale: Huhifadhi wazo la kukataa kwa hiari katika θέλουσιν na maana ya moja kwa moja ya κινῆσαι, 'kusogeza,' bila kuifasiri kuwa 'kuinua' au 'kuibeba.'
theological_decisions:
- issue: Iwapo mizigo ni halisi au ya kimfano
  choice: Kudumisha picha ya 'mizigo mizito' bila kutaja wazi inawakilisha nini.
  alternative: Kuitafsiri moja kwa moja kuwa masharti ya sheria au kanuni za kidini.
  rationale: Muktadha unaelekeza kwenye wajibu wenye kulemea uliowekwa na waandishi na Mafarisayo, lakini mstari wenyewe hautaji wajibu huo wazi. Kudumisha sitiari huepuka kubana maana kuliko chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wazi kwa wasomaji wa kawaida, huku picha za kufunga mizigo, mabega, na kidole zikihifadhiwa. Hakuna tanbihi inayohitajika kwa 'watu,' kwa kuwa ni tafsiri ya kawaida na sahihi ya ἀνθρώπων katika maana yake jumuishi.
