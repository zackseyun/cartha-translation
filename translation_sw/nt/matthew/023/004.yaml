  terminology: “Mizigo mizito,” “watu,” na “wao wenyewe” ni chaguo sahihi na yasiyo na upendeleo wa kimafundisho. “Watu” huwakilisha kwa usahihi matumizi ya kijumla ya ἀνθρώπων.
