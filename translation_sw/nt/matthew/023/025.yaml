  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι καθαρίζετε τὸ ἔξωθεν τοῦ ποτηρίου καὶ τῆς παροψίδος, ἔσωθεν δὲ γέμουσιν ἐξ ἁρπαγῆς καὶ ⸀ἀκρασίας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/025.yaml
  text: Woe to you[a], scribes and Pharisees, hypocrites! For you clean the outside of the cup and the dish, but inside they are full of greed and self-indulgence.
translation:
  language: sw
  text: Ole wenu, waandishi na Mafarisayo, wanafiki! Kwa maana mnasafisha sehemu ya nje ya kikombe na sahani, lakini ndani ya vyombo hivyo kumejaa unyang’anyi na kukosa kujitawala.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “lakini ndani ya vyombo hivyo kumejaa tamaa ya kujipatia mali na kujifurahisha kupita kiasi.” Maneno ya Kigiriki yanaweza pia kudokeza uchu na kujiachia bila kiasi, lakini yana maana yenye nguvu ya unyakuzi au unyang’anyi na ukosefu wa kujitawala.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐαὶ
  choice: Ole wenu
  rationale: Huhifadhi nguvu ya tangazo la kinabii la hukumu, badala ya kuwa kilio hafifu cha huzuni tu.
- source_word: γραμματεῖς
  choice: waandishi
  rationale: Ni istilahi ya kawaida ya Kibiblia kwa wataalamu wa kuandika na kufafanua Sheria, bila kuongeza ufafanuzi ndani ya matini.
- source_word: Φαρισαῖοι
  choice: Mafarisayo
  rationale: Ni jina la kawaida la kundi hili katika Kiswahili.
- source_word: ὑποκριταί
  choice: wanafiki
  rationale: Huonyesha kwa wazi unafiki wa kidini na kimaadili unaokemewa hapa.
- source_word: καθαρίζετε
  choice: mnasafisha
  rationale: Ni kitenzi cha kawaida na cha sasa kinachoeleza kusafisha vyombo.
- source_word: τὸ ἔξωθεν
  choice: sehemu ya nje
  rationale: Huweka wazi utofautishaji wa nje na ndani kwa Kiswahili cha kawaida.
- source_word: ποτηρίου
  choice: kikombe
  rationale: Ni kisawe cha moja kwa moja na kinachoeleweka kwa urahisi.
- source_word: παροψίδος
  choice: sahani
  rationale: Ni neno pana na la kawaida kwa chombo cha mezani, bila kukibainisha kupita kiasi kuwa bakuli au sinia.
- source_word: ἔσωθεν
  choice: ndani yake
  rationale: Huhifadhi taswira ya sehemu ya ndani ya vyombo; umbo hili pia huepuka tatizo la upatanisho wa ngeli tofauti za ‘kikombe’ na ‘sahani’.
- source_word: γέμουσιν
  choice: kumejaa
  rationale: Muundo wa mahali ni wa asili katika Kiswahili na huonyesha kuwa sehemu ya ndani imejaa, huku muktadha ukihusisha vyombo vyote viwili.
- source_word: ἁρπαγῆς
  choice: tamaa ya kujipatia mali
  rationale: Huwasilisha katika matini kuu tabia ya uchu wa kujinyakulia mali; maana kali zaidi ya unyang’anyi au uporaji imehifadhiwa katika tanbihi.
- source_word: ἀκρασίας
  choice: kujifurahisha kupita kiasi
  rationale: Hueleza hali ya kutotawala tamaa na kujiachia kupita kiasi kwa lugha ya sasa na inayoeleweka.
theological_decisions:
- issue: Kinachorejelewa na uchafu wa ndani katika sitiari
  choice: Kudumisha taswira ya ndani ya kikombe na sahani kwa kusema ‘ndani yake kumejaa,’ bila kutaja moja kwa moja mioyo ya viongozi.
  alternative: ‘lakini kwa ndani mmejaa tamaa ...’
  rationale: Kigiriki kinaendeleza sitiari ya vyombo katika kishazi hiki, ingawa viongozi ndio wanaolengwa. Tafsiri haipaswi kufafanua wazi jambo ambalo matini imelidokeza kwa taswira.
- issue: Nguvu ya ἁρπαγῆς na ἀκρασίας
  choice: Kutumia lugha ya maadili inayoeleweka katika matini kuu na kuweka maana kali zaidi katika tanbihi.
  alternative: ‘unyang’anyi na kukosa kujitawala’
  rationale: Maneno ya Kigiriki yanaweza kuonyesha matendo ya kujinyakulia kwa nguvu na ukosefu wa kujitawala; tanbihi huhifadhi uwezekano huo bila kuondoa usomaji wa tamaa na anasa katika sitiari.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inadumisha sauti kali ya onyo, istilahi zinazotambulika za Injili, na ulinganisho wa nje na ndani bila kufafanua sitiari kupita matini.
