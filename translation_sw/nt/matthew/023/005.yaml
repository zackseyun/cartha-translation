  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: πάντα δὲ τὰ ἔργα αὐτῶν ποιοῦσιν πρὸς τὸ θεαθῆναι τοῖς ἀνθρώποις· πλατύνουσι ⸀γὰρ τὰ φυλακτήρια αὐτῶν καὶ μεγαλύνουσι τὰ ⸀κράσπεδα,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/005.yaml
  text: But they do all their works to be seen by people[b][a], for they widen their phylacteries and enlarge their tassels.
translation:
  language: sw
  text: Lakini wao hufanya matendo yao yote ili waonekane na watu; kwa maana hupanua filakteria zao[a] na hukuza vishada vya mavazi yao[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, viboksi vidogo vya ngozi vyenye vifungu vya Maandiko, vilivyovaliwa na baadhi ya Wayahudi kwa kutii maagizo kama lile la Kumbukumbu la Torati 6:8.
    reason: cultural_note
  - marker: b
    text: Au “mapindo.” Linganisha Hesabu 15:38–39 kuhusu vishada vilivyovaliwa kwenye pembe za mavazi.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα τὰ ἔργα αὐτῶν
  choice: matendo yao yote
  rationale: Huwasilisha jumla ya yale wanayofanya kwa Kiswahili cha kawaida; “matendo” ni ya asili zaidi hapa kuliko “kazi,” ambayo ingeweza kueleweka kuwa ajira au shughuli.
- source_word: δὲ
  choice: Lakini
  rationale: Huonyesha tofauti na maelezo yaliyotangulia kuhusu kusema kwao na kutenda kwao.
- source_word: ποιοῦσιν πρὸς τὸ θεαθῆναι
  choice: hufanya ... ili waonekane
  rationale: Muundo huu huhifadhi wazi kusudi linaloonyeshwa na πρὸς τὸ pamoja na kitenzi-jina cha Kigiriki.
- source_word: τοῖς ἀνθρώποις
  choice: na watu
  rationale: Katika Kiswahili, “kuonekana na watu” ni muundo wa kawaida wa hali ya kutendwa na haudokezi wanaume pekee.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Huanzisha maelezo yanayothibitisha shtaka lililotangulia.
- source_word: πλατύνουσι
  choice: hupanua
  rationale: Huhifadhi maana halisi ya kufanya kitu kiwe kipana.
- source_word: φυλακτήρια
  choice: vibweta vyao vyenye Maandiko
  rationale: Ni tafsiri inayoeleweka ya vibweta vidogo vya ngozi vilivyokuwa na vifungu vya Maandiko; tanbihi inatoa jina la kitaalamu “filakteri.”
- source_word: μεγαλύνουσι
  choice: kufanya ... kuwa vikubwa
  rationale: Huhifadhi maana pana ya kufanya vikubwa bila kuibana kimakusudi kuwa kurefusha tu.
- source_word: κράσπεδα
  choice: vishada vya mavazi yao
  rationale: Katika muktadha huu neno linarejelea vishada vilivyowekwa kwenye pembe za mavazi kwa kufuata Torati; kutaja mavazi huondoa utata.
theological_decisions:
- issue: Kutaja vifaa vya kidini vya Kiyahudi bila kuvidhalilisha
  choice: Kueleza φυλακτήρια kama “vibweta ... vyenye Maandiko” na κράσπεδα kama “vishada vya mavazi,” huku tanbihi zikifafanua desturi hiyo.
  alternative: Kutumia “hirizi” kwa φυλακτήρια na “mapindo” kwa κράσπεδα.
  rationale: Yesu anakosoa kufanya vitu hivyo vikubwa ili kuonekana, si kutangaza kwamba desturi zenyewe ni mbaya. “Hirizi” ingeweza kuleta dhana ya uchawi ambayo si lazima katika muktadha huu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi zimewekwa wazi kwa msomaji wa kawaida, huku kusudi la matendo yao na maelezo ya vitu vya Kiyahudi yakihifadhiwa bila kuingiza maana ya kimadhehebu.
