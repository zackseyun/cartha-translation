  text: Nao hupenda mahali pa heshima kwenye karamu[c][a] na viti vya heshima katika masinagogi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mahali pa kwanza mezani,” yaani nafasi iliyoheshimiwa zaidi ya kuegemea wakati wa milo rasmi katika ulimwengu wa kale.
    reason: lexical_alternative
  - marker: b
    text: Au, “viti vya mbele.” Kigiriki kinakazia viti vyenye hadhi au utangulizi wa juu zaidi.
    reason: lexical_alternative
  - marker: c
    text: Katika karamu za ulimwengu wa kale wa Mediterania, nafasi za wageni zilionyesha wazi viwango vya heshima; kwa hiyo maneno haya yanaonyesha tamaa ya hadhi mbele ya watu, si starehe tu.
