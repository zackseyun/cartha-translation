lexical_decisions:
- source_word: φιλοῦσι
  choice: hupenda
  rationale: Kitenzi hiki hapa kinaonyesha kupendelea sana au kufurahia, si upendo wa maana maalumu ya kitheolojia. “Hupenda” ni ya kawaida, ya moja kwa moja, na inadumisha uzito wa ukosoaji wa Yesu.
- source_word: δὲ
  choice: Nao
  rationale: δέ hapa ni kiunganishi hafifu kinachoendeleza maelezo ya tabia zao. “Nao” huunganisha sentensi na muktadha bila kuongeza wazo kali la upinzani.
- source_word: πρωτοκλισίαν
  choice: mahali pa heshima
  rationale: Neno hili linamaanisha mahali palipoheshimiwa zaidi pa kuegemea wakati wa mlo. “Mahali pa heshima” huwasilisha hadhi ya kijamii kwa lugha ya asili ya Kiswahili bila kutegemea msomaji kufahamu desturi ya kale ya kula kwa kuegemea.
- source_word: ἐν τοῖς δείπνοις
  choice: kwenye karamu
  rationale: δεῖπνον ni mlo wa jioni au mlo rasmi; katika muktadha huu wa hadhi ya hadharani, “karamu” huonyesha vizuri mikusanyiko ya mlo yenye wageni na mpangilio wa heshima.
- source_word: πρωτοκαθεδρίας
  choice: viti vya mbele
  rationale: Neno linataja viti vyenye cheo au nafasi ya juu katika sinagogi. “Viti vya mbele” ni usemi unaoeleweka kwa urahisi na unaendana na mpangilio wa nafasi maarufu katika mahali pa kusanyiko; tanbihi inabainisha maana ya hadhi.
- source_word: ἐν ταῖς συναγωγαῖς
  choice: katika masinagogi
  rationale: Ni kirai cha mahali kinachotaja mikusanyiko au majengo ya Kiyahudi. “Katika masinagogi” ni tafsiri ya moja kwa moja na ya kawaida katika Kiswahili cha Biblia.
