base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/002.yaml
  text: saying[a], “The scribes and the Pharisees sit in Moses’ seat.”
translation:
  language: sw
  text: akisema[a], “Waandishi na Mafarisayo wameketi katika kiti cha Musa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “waliketi katika kiti cha Musa”; pia yaweza kueleweka, “wamejiketisha katika kiti cha Musa.” Kitenzi cha Kigiriki kinaweza kueleza kuketi au kuchukua nafasi ya mamlaka.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγων
  choice: akisema
  rationale: Kivumishi-endo cha wakati uliopo kinaunganisha maneno haya na mstari uliotangulia; “akisema” huhifadhi uhusiano huo kwa Kiswahili cha kawaida.
- source_word: Ἐπὶ τῆς Μωϋσέως καθέδρας
  choice: katika kiti cha Musa
  rationale: Kirai hiki kinaonyesha nafasi ya mamlaka ya kufundisha inayohusishwa na Musa. “Katika kiti” huhifadhi sitiari bila kudokeza tu kukalia kitu kimwili.
- source_word: ἐκάθισαν
  choice: wameketi
  rationale: Wakati timilifu wa Kiswahili unaonyesha tendo la kuketi lililotokea na hali inayoendelea. Haufanyi maana ya kujiketisha kuwa ya lazima, ambayo haijaonyeshwa wazi na kitenzi cha Kigiriki.
- source_word: οἱ γραμματεῖς
  choice: Waandishi
  rationale: Hili ni jina fupi na la kawaida la kundi la wataalamu wa Maandiko na Sheria; maana yao ya kitaalamu inaeleweka kutokana na muktadha.
- source_word: οἱ Φαρισαῖοι
  choice: Mafarisayo
  rationale: Hili ndilo umbo la kawaida la Kiswahili la jina la kundi hili.
theological_decisions:
- issue: Ikiwa ἐκάθισαν inaeleza kuketi kwa upande wowote au kujitwalia nafasi ya mamlaka
  choice: wameketi
  alternative: wamejiketisha
  rationale: Kigiriki kinaweza kueleza kuketi au kuchukua nafasi, lakini hakitumii kiwakilishi cha kujirejelea. “Wameketi” huhifadhi picha ya kushika nafasi ya mamlaka bila kuamua kwamba walijitwalia mamlaka hiyo wenyewe; tanbihi inahifadhi uwezekano mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Kiti cha Musa” kimehifadhiwa kama sitiari ya nafasi ya mamlaka ya kufundisha; “wameketi” ni ya asili kuliko “wamekaa” katika picha hii ya kiti na mamlaka.
