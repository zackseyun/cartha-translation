  text: καὶ πατέρα μὴ καλέσητε ὑμῶν ἐπὶ τῆς γῆς, εἷς γάρ ἐστιν ⸂ὑμῶν ὁ πατὴρ⸃ ὁ ⸀οὐράνιος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/009.yaml
  text: And call no man on earth your father[a], for one is your Father[b], the heavenly One.
translation:
  language: sw
  text: Wala msimwite mtu yeyote duniani baba yenu,[a] kwa maana mmoja ndiye Baba yenu wa mbinguni.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wala msimwite yeyote duniani baba yenu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa maana Baba yenu wa mbinguni ni mmoja,” au “kwa maana mmoja ndiye Baba yenu aliye mbinguni.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πατέρα
  choice: baba
  rationale: Neno hili limetafsiriwa moja kwa moja na linadumisha lugha ya cheo pamoja na ulinganifu wake na “Baba” katika kishazi cha pili; tafsiri haifafanui kimya-kimya kwamba ni ubaba wa kibaiolojia.
- source_word: μὴ καλέσητε
  choice: msimwite
  rationale: Muundo wa kitenzi pamoja na μή ni katazo. “Msimwite” ni Kiswahili cha kawaida na hudumisha nguvu ya amri bila kuongeza ufafanuzi kama “msimpe cheo cha.”
- source_word: ὑμῶν
  choice: yenu
  rationale: Kiwakilishi cha umilikaji katika wingi kimetafsiriwa kwa kawaida kuwa “yenu,” kikihifadhi uhusiano unaoelezwa katika vifungu vyote viwili.
- source_word: ἐπὶ τῆς γῆς
  choice: duniani
  rationale: Hii ni tafsiri ya kawaida ya eneo la kidunia, ambalo linatofautishwa na yule wa mbinguni.
- source_word: εἷς
  choice: mmoja
  rationale: Chanzo kinasema wazi “mmoja.” Neno “pekee” halijaongezwa, ingawa muktadha unaonyesha upekee.
- source_word: ὁ πατήρ
  choice: Baba yenu
  rationale: Tafsiri hii huhifadhi jina la uhusiano na kiwakilishi ὑμῶν kilicho katika matini iliyotolewa. Herufi kubwa inatofautisha rejeo hili la Mungu bila kubadili maana ya neno.
- source_word: ὁ οὐράνιος
  choice: aliye wa mbinguni
  rationale: Kivumishi chenye matumizi ya kijina kinamtambulisha Baba kuwa wa mbinguni. “Aliye wa mbinguni” ni cha asili katika Kiswahili na hudumisha muundo wenye maana pana kuliko kuufanya moja kwa moja kuwa “aliye mbinguni.”
- source_word: mtu yeyote (kijalizo kinachoeleweka)
  choice: mtu yeyote
  rationale: Kigiriki hakina nomino tofauti inayolingana na “mtu,” lakini Kiswahili huhitaji kijalizo kinachoeleweka hapa. “Mtu yeyote” ni jumuishi, cha asili, na hakibadili katazo.
theological_decisions:
- issue: Upeo wa katazo la Yesu
  choice: Kudumisha katazo kali la kumwita mtu yeyote duniani “baba yenu” bila kuingiza ufafanuzi wa namna ya ubaba unaokusudiwa.
  alternative: Kulitafsiri kuwa katazo la kila matumizi ya neno “baba,” au kulainisha kama katazo la cheo cha kiroho pekee.
  rationale: Kigiriki kina katazo la moja kwa moja, lakini hakielezi ndani ya mstari huu jinsi linavyohusiana na ubaba wa kibaiolojia, kijamii, au wa heshima. Tafsiri inapaswa kuacha mvutano huo uamuliwe na muktadha badala ya kuutatua kwa ufafanuzi ulioongezwa.
- issue: Maana ya οὐράνιος
  choice: “aliye wa mbinguni”
  alternative: “Baba wa mbinguni” au “aliye mbinguni”
  rationale: Chaguo hili linahifadhi nguvu ya kivumishi cha Kigiriki na utambulisho wa Baba bila kulazimisha ikiwa maana kuu ni asili/sifa ya kimbingu au mahali alipo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. “Wala” huunganisha katazo hili na mfululizo wa mafundisho katika muktadha; “msimwite mtu yeyote” ni ya kawaida na inafikika kwa wasomaji wengi. Mpangilio “mmoja ndiye Baba yenu” unasisitiza “mmoja” kama ilivyo katika Kigiriki.
