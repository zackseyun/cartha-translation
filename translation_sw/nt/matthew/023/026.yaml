  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Φαρισαῖε τυφλέ, καθάρισον πρῶτον τὸ ἐντὸς τοῦ ποτηρίου ⸂καὶ τῆς παροψίδος⸃, ἵνα γένηται καὶ τὸ ἐκτὸς ⸀αὐτοῦ καθαρόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/026.yaml
  text: Blind Pharisee[a], first clean the inside of the cup and the dish, so that its outside also may become clean.
translation:
  language: sw
  text: Ewe Farisayo kipofu, safisha kwanza ndani ya kikombe na sahani[a], ili nje yake pia iwe safi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “bakuli” au “sinia.” Neno la Kigiriki παροψίς linamaanisha chombo cha kuwekea au kutolea chakula.
    reason: lexical_alternative
lexical_decisions:
- source_word: Φαρισαῖε τυφλέ
  choice: Ewe Farisayo kipofu
  rationale: Miundo yote miwili ni ya kumwita mtu moja kwa moja. “Ewe” huonyesha wazi usemi wa moja kwa moja, huku “kipofu” ikidumisha sitiari kali ya upofu wa kiroho bila kuifafanua zaidi.
- source_word: καθάρισον πρῶτον
  choice: safisha kwanza
  rationale: “Safisha” ni amri ya moja kwa moja na ya kawaida kwa vyombo; “kwanza” hudumisha kipaumbele cha hatua hii.
- source_word: τὸ ἐντὸς τοῦ ποτηρίου
  choice: ndani ya kikombe
  rationale: Usemi huu ni wa asili katika Kiswahili na unadumisha picha halisi ya sehemu ya ndani ya chombo.
- source_word: καὶ τῆς παροψίδος
  choice: na sahani[a]
  rationale: παροψίς ni chombo cha kuwekea au kutolea chakula. “Sahani” ni neno la kawaida lisilobainisha umbo kwa kupita kiasi; tanbihi inataja uwezekano mwingine.
- source_word: ἵνα γένηται καὶ τὸ ἐκτὸς αὐτοῦ καθαρόν
  choice: ili nje yake pia iwe safi
  rationale: “Ili” hudumisha uhusiano wa kusudi au matokeo; “pia” huonyesha καί. “Iwe safi” ni Kiswahili cha kawaida kinachowasilisha mabadiliko yanayodokezwa na γένηται, huku “yake” ikidumisha umoja wa αὐτοῦ.
theological_decisions:
- issue: Picha halisi ya vyombo dhidi ya ufafanuzi wa moja kwa moja wa maana ya kimaadili
  choice: Kudumisha picha ya kusafisha ndani na nje ya kikombe na sahani bila kueleza wazi kuwa inahusu maisha ya ndani na mwenendo wa nje.
  alternative: “Safisha kwanza maisha yako ya ndani, ili maisha yako ya nje pia yawe safi.”
  rationale: Kauli ya Yesu inawasilisha maana ya kimaadili kwa njia ya sitiari halisi. Kuifafanua katika matini kuu kungeondoa mvutano na nguvu ya picha iliyopo katika Kigiriki.
- issue: Umoja wa αὐτοῦ baada ya kutajwa kwa vyombo viwili
  choice: Kutumia “yake,” ambayo ni umoja, kama ilivyo katika matini ya SBLGNT.
  alternative: Kutumia “zake” au “vyake” ili kurejelea vyombo vyote viwili kwa wingi.
  rationale: Matini iliyotolewa ina αὐτοῦ katika umoja. Tafsiri haibadilishi kimya kimya kuwa wingi, hata ingawa marejeleo yake baada ya “kikombe na sahani” yanaweza kuonekana kuwa na utata.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Sentensi ni fupi na yenye nguvu ya kukemea; “Ewe” inafaa kwa mwito wa moja kwa moja katika muktadha huu. Tanbihi imewekwa baada ya “sahani,” neno ambalo inaeleza.
