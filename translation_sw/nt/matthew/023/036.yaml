  text: ἀμὴν λέγω ὑμῖν, ⸀ἥξει ⸂ταῦτα πάντα⸃ ἐπὶ τὴν γενεὰν ταύτην.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/036.yaml
  text: Truly I say to you[b][a], all these things will come upon this generation.
translation:
  language: sw
  text: Amin, ninawaambia, mambo haya yote yatakipata kizazi hiki.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Kizazi hiki” kimefasiriwa na baadhi kuwa “watu hawa” au kizazi kipana chenye sifa ya kutokuamini; lakini Kigiriki kinasomeka moja kwa moja “kizazi hiki.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν
  choice: Amin
  rationale: Katika kauli ya Yesu ya kuanzisha tamko lenye mamlaka, “Amin” ni neno linalotambulika katika Kiswahili na linadumisha uzito wa uthibitisho wa asili bila kulifanya kuwa kiapo.
- source_word: λέγω ὑμῖν
  choice: ninawaambia
  rationale: Hii ni tafsiri ya kawaida na ya asili ya kitenzi pamoja na kiwakilishi cha wingi; inadumisha maana ya Yesu kuwaambia wasikilizaji wake moja kwa moja.
- source_word: ἥξει ... ἐπὶ
  choice: yatakipata
  rationale: Muundo huu wa Kiswahili unaeleza kwa kawaida mambo au matokeo yanayomjia mtu au kizazi. Unadumisha wazo la kuja juu ya walengwa bila kutumia muundo mzito usio wa kawaida.
- source_word: ταῦτα πάντα
  choice: mambo haya yote
  rationale: Nomino ya wingi iliyodokezwa na ταῦτα imewekwa wazi kama “mambo,” huku mpangilio wa Kiswahili “haya yote” ukidumisha wingi na ujumla wa maneno ya Kigiriki.
- source_word: γενεὰν ταύτην
  choice: kizazi hiki
  rationale: Hii ndiyo tafsiri ya moja kwa moja na ya kawaida zaidi, na haifungii tafsiri kwenye maana ya “watu hawa,” jamii fulani katika historia yote, au enzi.
theological_decisions:
- issue: Rejeleo la γενεὰν ταύτην
  choice: kizazi hiki
  alternative: watu hawa; kizazi kipana chenye kutokuamini; enzi hii
  rationale: Tafsiri inadumisha usemi wa moja kwa moja na mvutano wake wa wakati bila kuamua mjadala wa kieskatolojia au kuingiza mfumo fulani wa mafundisho.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa tamko zito la Yesu. “Amin” limetumiwa kama mwanzo unaotambulika wa tamko la hakika; “yatakipata” ni ya asili zaidi kuliko tafsiri halisi yenye muundo wa “yatakuja juu ya.”
