  text: καί· Ὃς ⸀ἂν ὀμόσῃ ἐν τῷ θυσιαστηρίῳ, οὐδέν ἐστιν, ὃς δ’ ἂν ὀμόσῃ ἐν τῷ δώρῳ τῷ ἐπάνω αὐτοῦ ὀφείλει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/018.yaml
  text: And[a], ‘Whoever swears by the altar, it is nothing[b]; but whoever swears by the gift on top of it is obligated.’
translation:
  language: sw
  text: Na, ‘Yeyote anayeapa kwa madhabahu, hilo si kitu[a]; lakini yeyote anayeapa kwa sadaka[b] iliyo juu yake ana wajibu.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, kulingana na fundisho ambalo Yesu analishutumu, kiapo kwa madhabahu ‘hakihesabiki,’ lakini kiapo kwa sadaka iliyo juu yake huonwa kuwa cha lazima.
    reason: cultural_note
  - marker: b
    text: Au “toleo.” Neno la Kigiriki linaweza kumaanisha kitu kinachotolewa kwa Mungu katika Hekalu.
    reason: lexical_alternative
lexical_decisions:
- source_word: καί
  choice: Tena
  rationale: Kiunganishi hiki kinaendeleza mfululizo wa mafundisho yanayonukuliwa na kushutumiwa; “Tena” kinaonyesha mwendelezo huo kwa Kiswahili cha kawaida.
- source_word: Ὃς ἂν ... ὀμόσῃ / ὃς δ’ ἂν ... ὀμόσῃ
  choice: Yeyote anayeapa ... lakini yeyote anayeapa
  rationale: Muundo wa ὅς pamoja na ἄν na kitenzi katika hali tegemezi una maana ya jumla isiyo na mtu maalumu; “yeyote anayeapa” ni ya asili na inadumisha maana hiyo.
- source_word: ἐν τῷ θυσιαστηρίῳ
  choice: kwa madhabahu
  rationale: Katika usemi wa kiapo, ἐν hutaja kitu ambacho mtu anaapia; “kwa madhabahu” ndiyo nahau ya kawaida ya Kiswahili.
- source_word: θυσιαστήριον
  choice: madhabahu
  rationale: Hili ndilo neno la kawaida na sahihi kwa mahali pa kutolea dhabihu katika mazingira ya Hekalu.
- source_word: οὐδέν ἐστιν
  choice: hilo si kitu
  rationale: Tafsiri hii inabaki karibu na usemi mfupi wa Kigiriki huku “hilo” likirejelea tendo au kiapo kilichotangulia bila kuongeza maelezo yasiyotajwa wazi.
- source_word: ἐν τῷ δώρῳ
  choice: kwa sadaka
  rationale: Katika mazingira ya Hekalu, δῶρον ni kitu kinachotolewa kwa Mungu. “Sadaka” ni ya asili na huwasilisha maana ya utoaji wa ibada vizuri kuliko “zawadi.”
- source_word: τῷ ἐπάνω αὐτοῦ
  choice: iliyo juu yake
  rationale: Usemi huu unadumisha maana ya mahali ya ἐπάνω na kiwakilishi kinachorejelea madhabahu.
- source_word: ὀφείλει
  choice: ana wajibu
  rationale: Katika muktadha wa kiapo, kitenzi hiki kinaonyesha kwamba mtu yuko chini ya wajibu. Tafsiri haiongezi jambo analowajibika kufanya, kwa kuwa Kigiriki hakilitaji wazi.
theological_decisions:
- issue: Jambo lisilotajwa linalomhusu mwenye wajibu katika ὀφείλει
  choice: ana wajibu
  alternative: amefungwa na kiapo chake / ana wajibu wa kukitimiza
  rationale: Matini ya Kigiriki haionyeshi wazi kitu au tendo linalodaiwa. “Ana wajibu” inadumisha ufupi na uwazi huo, ingawa muktadha unaonyesha kuwa wajibu wa kiapo ndio unaozungumziwa.
- issue: Maana ya οὐδέν ἐστιν katika fundisho linaloshutumiwa
  choice: hilo si kitu
  alternative: kiapo hicho hakina nguvu / hakihesabiki
  rationale: Usemi wa moja kwa moja unahifadhi lugha ya chanzo na haubadili dai hilo kuwa kauli ya Yesu mwenyewe; tanbihi inaeleza kwamba ni msimamo anaoushutumu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inadumisha muundo wa kauli iliyonukuliwa, urudiaji wa “yeyote anayeapa,” na ufupi wa madai ya chanzo. Alama za tanbihi zimewekwa karibu na maneno yanayofafanuliwa.
