translation:
  language: sw
  text: Na ninyi, jazeni kipimo cha baba zenu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “timizeni kipimo cha dhambi za baba zenu.” Kigiriki husema kihalisi, “jazeni kipimo cha baba zenu,” ikitumia sitiari ya hatia iliyokusanyika hadi kufikia ukomo.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Nanyi
  rationale: Kiunganishi καὶ pamoja na kiwakilishi cha msisitizo ὑμεῖς kimetafsiriwa kwa muundo wa kawaida wa Kiswahili unaoendeleza shutuma ya mstari uliotangulia na kusisitiza wahusika.
- source_word: ὑμεῖς
  choice: nanyi
  rationale: Kiwakilishi hiki kimetajwa wazi katika Kigiriki kwa msisitizo; “nanyi” huhifadhi msisitizo huo kwa Kiswahili cha kawaida.
- source_word: πληρώσατε
  choice: jazeni
  rationale: Ni amri ya aoristi, nafsi ya pili wingi. “Jazeni” huhifadhi umbo la amri na sitiari ya kufanya kipimo kifikie ukomo wake.
- source_word: τὸ μέτρον
  choice: kipimo
  rationale: Tafsiri hii ya moja kwa moja huhifadhi sitiari ya kiasi kinachokusanywa hadi kufikia ukomo bila kuongeza neno “kamili” katika matini kuu.
- source_word: τῶν πατέρων ὑμῶν
  choice: cha baba zenu
  rationale: “Baba zenu” huhifadhi usemi halisi na mwendelezo wa hoja kuhusu uhusiano wao na waliowatangulia; katika muktadha inaweza kumaanisha mababu zao.
theological_decisions:
- issue: Kauli ya Yesu ni amri au utabiri wenye kejeli
  choice: 'Amri yenye nguvu ya kejeli na hukumu: “jazeni kipimo cha baba zenu.”'
  alternative: 'Utabiri: “mnajaza” au “mtajaza kipimo cha baba zenu.”'
  rationale: Umbo la πληρώσατε ni amri ya aoristi, nafsi ya pili wingi. Tafsiri imehifadhi amri hiyo, huku muktadha ukionyesha kwamba ni mwito wa kejeli wa kukamilisha mwenendo wa hatia wa waliowatangulia, si idhini ya kutenda dhambi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Jazeni kipimo” limeachwa kama sitiari yenye ukali wa kimahakama; tanbihi inaeleza maana yake bila kuifafanua kupita kiasi katika matini kuu.
