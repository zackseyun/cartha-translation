  text: ὅστις δὲ ὑψώσει ἑαυτὸν ταπεινωθήσεται, καὶ ὅστις ταπεινώσει ἑαυτὸν ⸀ὑψωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/012.yaml
  text: But whoever exalts himself will be humbled[b][a], and whoever humbles himself will be exalted.
translation:
  language: sw
  text: Lakini yeyote atakayejikweza atashushwa[a], na yeyote atakayejishusha atakwezwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “atafanywa kuwa wa chini” ... “atainuliwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅστις
  choice: yeyote atakaye-
  rationale: Kiwakilishi hiki kinaanzisha kanuni ya jumla; “yeyote atakaye-” ni Kiswahili cha kawaida kinachohifadhi maana ya mtu yeyote bila kubainisha jinsia.
- source_word: δὲ
  choice: Lakini
  rationale: Kiunganishi hiki kinaonyesha tofauti ya kiasi na yaliyoitangulia aya; “Lakini” kinaonyesha tofauti hiyo kwa uwazi.
- source_word: ὑψώσει ἑαυτὸν
  choice: atakayejikweza
  rationale: Kitenzi cha kujirejelea kinaeleza mtu anayejipa cheo au heshima ya juu. “Kujikweza” ni usemi wa asili unaofaa muktadha wa kiburi na hadhi.
- source_word: ταπεινωθήσεται
  choice: atashushwa
  rationale: Wakati ujao wa hali ya kutendwa umehifadhiwa bila kumtaja mtendaji. “Atashushwa” huwasilisha kushushwa hadhi na pia ni Kiswahili cha kawaida.
- source_word: καὶ
  choice: na
  rationale: Kiunganishi rahisi kinachounganisha vipashio viwili vinavyolingana.
- source_word: ταπεινώσει ἑαυτὸν
  choice: atakayejishusha
  rationale: Muundo wa kujirejelea unamaanisha mtu kujifanya wa chini au kujinyenyekeza. “Kujishusha” huhifadhi taswira ya juu na chini inayokinzana na “kujikweza.”
- source_word: ὑψωθήσεται
  choice: atakwezwa
  rationale: Wakati ujao wa hali ya kutendwa umehifadhiwa, pamoja na ulinganifu wa kileksia na “kujikweza,” bila kumtaja mtendaji.
theological_decisions:
- issue: Mtendaji wa vitenzi vya hali ya kutendwa
  choice: Kubaki na “atashushwa” na “atakwezwa” bila kumtaja mtendaji
  alternative: 'Kutaja Mungu waziwazi: “Mungu atamshusha ... Mungu atamweza”'
  rationale: Kigiriki kinatumia hali ya kutendwa bila kumtaja mtendaji. Tafsiri haimtaji Mungu moja kwa moja, hivyo inadumisha namna ya usemi wa chanzo na kuacha uwezekano wa utendaji wa Mungu ukiwa umeelekezwa lakini haujaelezwa wazi.
- issue: Kauli ya jumla katika umoja wa kiume wa Kigiriki
  choice: Kutumia “yeyote” isiyoonyesha jinsia kwa sababu ya sarufi ya Kiswahili
  alternative: Kuongeza nomino yenye jinsia, kama “mwanaume yeyote”
  rationale: Ingawa Kigiriki kina maumbo ya umoja wa kiume yanayotumika kiwakilishi kwa mtu yeyote, Kiswahili hakibainishi jinsia katika “yeyote.” Kuongeza jinsia kungepunguza isivyofaa upeo wa kanuni hii ya jumla.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa wakati ujao “atakaye-” unahifadhi nguvu ya vitenzi vya Kigiriki vya wakati ujao, huku “kujikweza/kushushwa” na “kujishusha/kukwezwa” zikidumisha ulinganifu wa kimethali wa juu na chini.
