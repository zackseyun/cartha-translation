  text: Οὕτως οὖν προσεύχεσθε ὑμεῖς· Πάτερ ἡμῶν ὁ ἐν τοῖς οὐρανοῖς· ἁγιασθήτω τὸ ὄνομά σου,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/009.yaml
  text: 'Therefore[a], you should pray like this: Our Father in the heavens, may your name be treated as holy[b],'
translation:
  language: sw
  text: 'Basi, ninyi salini hivi: “Baba yetu uliye mbinguni[a], jina lako litakaswe[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki kinasema kihalisi “katika mbingu,” kwa umbo la wingi. Kiswahili “mbinguni” ni usemi wa asili unaotumia neno “mbingu.”
    reason: lexical_alternative
  - marker: b
    text: Yaani, jina lako litambuliwe na kutendewa kama takatifu. Tafsiri ya jadi ni “jina lako litukuzwe,” lakini “kutukuza” huelekeza zaidi kwenye kupewa utukufu kuliko kutakaswa.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὕτως
  choice: hivi
  rationale: Neno hili linaonyesha namna au kielelezo cha kusali. “Hivi” ni la kawaida na la asili katika Kiswahili cha sasa.
- source_word: οὖν
  choice: Basi
  rationale: Linaunganisha agizo hili na mafundisho yaliyotangulia kwa kuonyesha hitimisho au hatua inayofuata.
- source_word: προσεύχεσθε ὑμεῖς
  choice: ninyi salini
  rationale: Kitenzi ni agizo kwa watu wengi, na kiwakilishi ὑμεῖς kimetajwa wazi kwa msisitizo. “Ninyi salini” huhifadhi msisitizo huo kwa Kiswahili cha kawaida.
- source_word: Πάτερ ἡμῶν
  choice: Baba yetu
  rationale: Hii ni namna ya asili ya kumwita baba moja kwa moja, huku ikihifadhi kiwakilishi cha pamoja “yetu.”
- source_word: ὁ ἐν τοῖς οὐρανοῖς
  choice: uliye mbinguni
  rationale: Kirai hiki kinamtambulisha Baba kwa mahali alipo. “Uliye mbinguni” ni Kiswahili cha asili; neno “mbingu” pia huhifadhi umbo la wingi lililo katika Kigiriki bila kulazimisha usemi usio wa kawaida.
- source_word: ἁγιασθήτω
  choice: na litakaswe
  rationale: Ni agizo la nafsi ya tatu katika hali ya kutendwa, likitumika kama ombi. “Na litakaswe” huhifadhi muundo wa ombi na wazo la kulitambua au kulitendea jina kuwa takatifu.
- source_word: τὸ ὄνομά σου
  choice: jina lako
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida. Inahifadhi neno “jina” bila kulibadili kuwa sifa, heshima, au nafsi ya Mungu pekee.
theological_decisions:
- issue: Anwani kwa Mungu na usemi wa mahali “katika mbingu”
  choice: Baba yetu uliye mbinguni
  alternative: Baba yetu wa mbinguni
  rationale: “Uliye mbinguni” hudumisha maana ya kirai cha Kigiriki kinachoeleza mahali, huku “wa mbinguni” ingeweza kueleweka zaidi kama sifa. Pia huhifadhi ukaribu wa “Baba yetu” pamoja na ukuu wa Mungu.
- issue: Maana ya ἁγιασθήτω kuhusu jina la Mungu
  choice: jina lako na litakaswe
  alternative: jina lako na liheshimiwe kuwa takatifu
  rationale: “Na litakaswe” huhifadhi ufupi, uzito, na hali ya kutendwa ya Kigiriki. Inaacha wazi upeo wa ombi—jina litambuliwe, litendewe, au lionyeshwe kuwa takatifu—badala ya kuufunga kwa tendo la heshima pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Basi, ninyi salini hivi” ni agizo la moja kwa moja lenye msisitizo wa kiwakilishi. Muundo “na litakaswe” ni wa sala na ombi, unaofahamika bila kuwa wa kizamani kupita kiasi.
