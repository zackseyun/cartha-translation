reference: Matthew 6:25
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Διὰ τοῦτο λέγω ὑμῖν· μὴ μεριμνᾶτε τῇ ψυχῇ ὑμῶν τί ⸀φάγητε, μηδὲ τῷ σώματι ὑμῶν τί ἐνδύσησθε· οὐχὶ ἡ ψυχὴ πλεῖόν ἐστι τῆς τροφῆς καὶ τὸ σῶμα τοῦ ἐνδύματος;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/025.yaml
  text: Therefore I tell you[a], do not worry about your life, what you will eat, or about your body, what you will wear. Is not life more than food, and the body than clothing?
translation:
  language: sw
  text: 'Kwa hiyo ninawaambia: Msihangaikie maisha yenu—mtakula nini—wala miili yenu—mtavaa nini. Je, maisha si zaidi ya chakula, na mwili zaidi ya mavazi?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Kwa hiyo
  rationale: Inaonyesha hitimisho linalotokana na mafundisho yaliyotangulia, kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: μεριμνᾶτε
  choice: msihangaikie
  rationale: Kitenzi hiki hapa kinamaanisha kuwa na wasiwasi au kujishughulisha kwa mahangaiko; ‘msihangaikie’ ni cha asili na kinaepuka maana ya kukataza utunzaji wote wa busara.
- source_word: ψυχῇ / ψυχὴ
  choice: maisha / maisha
  rationale: Muktadha wa kula unaonyesha ψυχή kwa maana ya uhai au maisha ya mtu, si hasa sehemu isiyo ya mwili iitwayo ‘nafsi’.
- source_word: τί φάγητε
  choice: kwamba mtakula nini
  rationale: Swali tegemezi linaeleza jambo la wakati ujao linaloweza kuleta mahangaiko.
- source_word: σώματι / σῶμα
  choice: miili / mwili
  rationale: Inarejelea mwili wa kibinadamu kwa kulinganisha na mavazi; wingi katika sehemu ya kwanza unakubaliana kwa kawaida na ‘yenu,’ na umoja katika swali la jumla unafuata chanzo.
- source_word: τί ἐνδύσησθε
  choice: kwamba mtavaa nini
  rationale: ‘Kuvaa’ ni tafsiri ya kawaida ya kitendo cha kujivika na inafaa kwa muktadha wa mavazi.
- source_word: οὐχὶ
  choice: Je, ... si
  rationale: Muundo huu wa swali la balagha unatarajia jibu la ndiyo na unasikika kwa kawaida katika Kiswahili sanifu.
- source_word: πλεῖόν
  choice: zaidi ya
  rationale: Inahifadhi ulinganisho mpana wa umuhimu au ukuu bila kuongeza wazi dhana ya thamani ambayo haijasemwa moja kwa moja.
- source_word: τροφῆς
  choice: chakula
  rationale: Ni neno wazi na la kawaida kwa kile kinachodumisha maisha.
- source_word: ἐνδύματος
  choice: mavazi
  rationale: Ni istilahi ya jumla na ya kisasa kwa nguo, na inalingana vizuri na ‘chakula’.
theological_decisions:
- issue: Maana ya ψυχή katika fundisho hili
  choice: maisha
  alternative: nafsi
  rationale: Muktadha wa kula, mwili, na mavazi unaelekeza kwenye uhai au maisha ya mtu. ‘Maisha’ huepuka kuingiza madai maalumu kuhusu mgawanyiko wa mwili na nafsi ambayo mstari huu haulazimishi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa, wazi na chenye hadhi. Muundo wa balagha na ulinganisho wa chanzo umehifadhiwa bila kufanya sentensi kuwa ngumu isivyo lazima.
