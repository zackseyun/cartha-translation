source:
  edition: SBLGNT
  text: ὅπως ᾖ σου ἡ ἐλεημοσύνη ἐν τῷ κρυπτῷ· καὶ ὁ πατήρ σου ὁ βλέπων ἐν τῷ ⸀κρυπτῷ ἀποδώσει ⸀σοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/004.yaml
  text: so that your giving to the poor may be in secret[b][a]; and your Father who sees in secret will reward you.
translation:
  language: sw
  text: ili utoaji wako kwa maskini ufanywe kwa siri[a]; na Baba yako aonaye kwa siri atakutuza[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sadaka.” Neno la Kigiriki linamaanisha hasa msaada unaotolewa kwa maskini.
    reason: lexical_alternative
  - marker: b
    text: Au, “atakulipa.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπως ᾖ
  choice: ili ... uwe
  rationale: Muundo huu unaonyesha kusudi la agizo lililotangulia na kuhifadhi maana ya hali ya utegemezi katika kitenzi cha Kigiriki.
- source_word: ἐλεημοσύνη
  choice: utoaji wako kwa maskini
  rationale: Neno hili linamaanisha hasa kutoa msaada kwa maskini, si tendo la huruma kwa ujumla. Tafsiri hii ni wazi na ya kawaida kwa msomaji wa kisasa.
- source_word: ἐν τῷ κρυπτῷ
  choice: wa siri / sirini
  rationale: Kauli hii inahusu jambo lisilofanywa hadharani. Miundo hii miwili ya Kiswahili ni ya asili na inadumisha urudiaji wa wazo lilelile katika vifungu vyote viwili.
- source_word: ὁ πατήρ σου
  choice: Baba yako
  rationale: Kigiriki kinasema tu ‘Baba yako’; neno ‘wa mbinguni’ halijaongezwa kutoka vifungu jirani.
- source_word: ὁ βλέπων
  choice: aonaye
  rationale: Hii ni tafsiri fupi, ya kawaida na yenye hadhi ya kishiriki cha Kigiriki kinachomtaja Baba kuwa ndiye anayeona.
- source_word: ἀποδώσει σοι
  choice: atakutuza
  rationale: Katika muktadha huu kitenzi kinaonyesha jibu jema la Mungu kwa utoaji uliofanywa kwa siri. ‘Atakutuza’ ni cha kawaida bila kufafanua tuzo hiyo ni ya aina gani.
theological_decisions:
- issue: Aina ya malipo ya Mungu katika ἀποδώσει
  choice: atakutuza
  alternative: atakulipa
  rationale: ‘Atakutuza’ huhifadhi maana chanya katika muktadha huu, lakini haisemi kama tuzo hiyo ni ya sasa au ya wakati ujao, ya kimwili au ya kiroho. ‘Atakulipa’ huhifadhi kwa karibu zaidi wazo la kumrudishia mtu kile kinachomstahili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Utoaji wako kwa maskini’ hufanya maana maalumu ya neno la Kigiriki ἐλεημοσύνη ieleweke; ‘sadaka’ imehifadhiwa katika tanbihi kwa sababu ni tafsiri ya jadi lakini inaweza kueleweka kwa upana zaidi. Kauli hiyo haiongezi ‘wa mbinguni’ wala haifafanui namna ya tuzo.
