  text: ἐὰν δὲ μὴ ἀφῆτε τοῖς ⸀ἀνθρώποις, οὐδὲ ὁ πατὴρ ὑμῶν ἀφήσει τὰ παραπτώματα ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/015.yaml
  text: But if you do not forgive people[a], neither will your Father forgive your trespasses.
translation:
  language: sw
  text: Lakini msipowasamehe watu, Baba yenu naye hatawasamehe makosa[a] yenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “maasi” au “makosa ya kukiuka sheria.”
    reason: Neno παραπτώματα linaweza kumaanisha makosa, maasi, au matendo ya kukiuka sheria; tanbihi inaonyesha mbadala wa kimaana bila kubadilisha maana ya “yenu.”
lexical_decisions:
- source_word: ἐὰν δὲ μὴ
  choice: Lakini msipo-
  rationale: Muundo wa sharti hasi ἐὰν ... μή umetafsiriwa kwa kiambishi cha Kiswahili “msipo-,” huku δέ ikitolewa kwa “Lakini” ili kuonyesha tofauti na mstari uliotangulia.
- source_word: ἀφῆτε
  choice: wasamehe
  rationale: Katika muktadha wa makosa baina ya watu, ἀφίημι humaanisha kusamehe. Chaguo hili pia linahifadhi ulinganifu na ἀφήσει katika sehemu ya pili ya mstari.
- source_word: τοῖς ἀνθρώποις
  choice: watu
  rationale: ἄνθρωποι linawahusu wanadamu kwa ujumla, si wanaume pekee; “watu” ni tafsiri ya kawaida, wazi na isiyobagua kijinsia.
- source_word: οὐδὲ
  choice: naye hata-
  rationale: Muundo “naye hata-” unaonyesha kwamba, ikiwa tendo la kwanza halifanyiki, Baba pia hatafanya tendo linalolingana. Ni wa kawaida katika Kiswahili na unadumisha nguvu ya ukanushaji wa οὐδέ.
- source_word: ὁ πατὴρ ὑμῶν
  choice: Baba yenu
  rationale: Kigiriki kinasema tu “Baba yenu”; neno “wa mbinguni” halijaongezwa kwa kuwa halipo katika mstari huu.
- source_word: ἀφήσει
  choice: hatawasamehe
  rationale: Wakati ujao wa ἀφίημι umetafsiriwa kwa kitenzi kilekile cha “kusamehe,” hivyo kurudia kwa msamiati na muundo wa pande mbili kunahifadhiwa.
- source_word: τὰ παραπτώματα ὑμῶν
  choice: makosa yenu
  rationale: παραπτώματα ni makosa au matendo ya kukiuka yaliyo sawa. “Makosa” ni neno la sasa na linaloeleweka kwa urahisi, huku tanbihi ikionyesha mbadala wenye uzito tofauti kidogo.
theological_decisions:
- issue: Uhusiano wa sharti kati ya watu kusamehe na Mungu kusamehe
  choice: 'Kauli ya moja kwa moja ya sharti imehifadhiwa bila kupunguzwa makali: “msipowasamehe ... hatawasamehe.”'
  alternative: Kuifafanua kama ishara tu ya kuwa mtu amesamehewa tayari, au kama kupoteza ushirika badala ya kutosamehewa.
  rationale: Kigiriki kinatoa sharti la moja kwa moja. Tafsiri inapaswa kuhifadhi mvutano huo wa kiteolojia bila kuamua mjadala mpana kwa njia ya ufafanuzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. “Msipowasamehe” ni muundo wa kawaida wa sharti hasi; “naye hatawasamehe” huleta ulinganifu wa sentensi bila kuwa mzito kupita kiasi.
