  text: ἐὰν δὲ ὁ ὀφθαλμός σου πονηρὸς ᾖ, ὅλον τὸ σῶμά σου σκοτεινὸν ἔσται. εἰ οὖν τὸ φῶς τὸ ἐν σοὶ σκότος ἐστίν, τὸ σκότος πόσον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/023.yaml
  text: But if your eye is bad[a], your whole body will be dark. If then the light in you is darkness, how great is the darkness!
translation:
  language: sw
  text: Lakini ikiwa jicho lako ni baya[a], mwili wako wote utakuwa na giza. Basi, ikiwa nuru iliyo ndani yako ni giza, giza hilo ni kubwa kama nini!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ovu,” “lisilo na afya,” au huenda “la ubahili,” kwa kuzingatia nahau ya “jicho” na muktadha unaozunguka.
    reason: lexical_alternative
lexical_decisions:
- source_word: πονηρὸς
  choice: baya
  rationale: Neno hili linaweza kumaanisha baya kiadili, lisilo na afya, au katika nahau ya jicho, lenye ubahili. “Baya” linahifadhi upana huo bila kufunga sitiari kwa maana moja tu.
- source_word: σκοτεινὸν
  choice: utakuwa gizani
  rationale: Muundo huu ni wa asili katika Kiswahili na unaeleza hali ya kuwa katika giza bila kuongeza ufafanuzi wa sitiari.
- source_word: φῶς
  choice: nuru
  rationale: “Nuru” ni tafsiri ya moja kwa moja inayohifadhi sitiari na tofauti yake na giza.
- source_word: σκότος
  choice: giza
  rationale: “Giza” linahifadhi tofauti ya kisitiari na nuru pamoja na marudio yenye msisitizo mwishoni.
- source_word: πόσον
  choice: ni kubwa kama nini
  rationale: Katika kishazi hiki cha mshangao, πόσον huonyesha kiwango; usemi huu ni wa kawaida na wenye nguvu katika Kiswahili.
- source_word: ὀφθαλμός
  choice: jicho
  rationale: Tafsiri halisi inadumisha sitiari ya kiungo cha mwili kuhusu mtazamo, nia, na mwelekeo wa ndani.
- source_word: ὅλον τὸ σῶμά σου
  choice: mwili wako wote
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida inayohifadhi msisitizo wa ujumla.
- source_word: τὸ φῶς τὸ ἐν σοὶ
  choice: nuru iliyo ndani yako
  rationale: Tafsiri hii iko karibu na Kigiriki na haifasiri kupita kiasi kuwa aina fulani maalumu ya nuru ya ndani.
theological_decisions:
- issue: Maana ya sitiari ya “jicho baya”
  choice: Kuhifadhi sitiari pana kwa kutumia “baya” katika matini kuu.
  alternative: “Jicho ovu,” “jicho lisilo na afya,” au “jicho la ubahili.”
  rationale: Muktadha unaruhusu maana zinazoingiliana za uovu wa kimaadili, mtazamo uliopotoka, na huenda nahau ya Kisemiti kuhusu kutokuwa mkarimu. Tafsiri pana hailazimishi maana moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. “Utakuwa gizani” limetumiwa kwa uasilia wa Kiswahili, huku “nuru” na “giza” zikidumisha sitiari ya chanzo.
