id: MAT.6.5
reference: Matthew 6:5
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ ὅταν ⸂προσεύχησθε, οὐκ ἔσεσθε ὡς⸃ οἱ ὑποκριταί· ὅτι φιλοῦσιν ἐν ταῖς συναγωγαῖς καὶ ἐν ταῖς γωνίαις τῶν πλατειῶν ἑστῶτες προσεύχεσθαι, ⸀ὅπως φανῶσιν τοῖς ἀνθρώποις· ἀμὴν λέγω ⸀ὑμῖν, ἀπέχουσι τὸν μισθὸν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/005.yaml
  text: And whenever you pray[a], you shall not be like the hypocrites, because they love to stand and pray in the synagogues and on the corners of the broad streets, so that they may be seen by people. Truly I say to you[c][b], they have received their reward.
translation:
  language: sw
  text: “Kila mnaposali, msiwe kama wanafiki, kwa maana wao hupenda kusali wakiwa wamesimama katika masinagogi na kwenye pembe za barabara pana[a], ili waonekane na watu. Amin, ninawaambia, wamekwisha kupokea thawabu yao yote[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “kwenye pembe za barabara.” Kigiriki kinasema kwa karibu zaidi, “kwenye pembe za barabara pana.”'
    reason: lexical_alternative
  - marker: b
    text: 'Au: “wamekwisha kupata thawabu yao.” Kitenzi cha Kigiriki kinaweza kuwa na maana ya kupokea malipo kikamilifu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν προσεύχησθε
  choice: kila mnaposali
  rationale: 'Huwasilisha tendo la wakati usio maalumu na linaloweza kurudiwa: ‘kila wakati mnaposali.’'
- source_word: οὐκ ἔσεσθε ὡς
  choice: msiwe kama
  rationale: Ingawa Kigiriki kimetumia kitenzi cha wakati ujao chenye nguvu ya katazo, Kiswahili cha kawaida huwasilisha agizo hili kwa ‘msiwe kama.’
- source_word: ὑποκριταί
  choice: wanafiki
  rationale: Ni istilahi ya kawaida na sahihi kwa watu wanaoonyesha uchaji ili waonekane, badala ya tafsiri ya kietimolojia kama ‘waigizaji.’
- source_word: φιλοῦσιν
  choice: hupenda
  rationale: Huhifadhi maana kwamba wao hufurahia na huchagua desturi hiyo ya kujionyesha hadharani.
- source_word: ἐν ταῖς συναγωγαῖς
  choice: katika masinagogi
  rationale: Huhifadhi mazingira mahususi ya kihistoria na kidini ya Kiyahudi.
- source_word: ἐν ταῖς γωνίαις τῶν πλατειῶν
  choice: kwenye pembe za barabara pana
  rationale: Hufuata kwa karibu picha ya Kigiriki ya pembe za njia pana za umma, huku ikiwa wazi kwa msomaji wa Kiswahili.
- source_word: ἑστῶτες προσεύχεσθαι
  choice: kusali wakiwa wamesimama
  rationale: Huhusianisha hali ya kusimama na tendo la kusali bila kudokeza kwamba kusimama kwenyewe ndilo jambo linalokemewa.
- source_word: ὅπως φανῶσιν τοῖς ἀνθρώποις
  choice: ili waonekane na watu
  rationale: Hueleza kusudi lao na kutafsiri ἀνθρώποις kwa maana yake jumuishi ya wanadamu kwa ujumla.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: Amin, ninawaambia
  rationale: Huhifadhi neno la Kisemiti lililotumiwa katika chanzo na uzito wa kauli ya Yesu, kwa namna inayoeleweka katika Kiswahili cha Biblia.
- source_word: ἀπέχουσι τὸν μισθὸν αὐτῶν
  choice: wamekwisha kupokea thawabu yao yote
  rationale: '‘Wamekwisha kupokea’ pamoja na ‘yote’ huonyesha nahau ya kibiashara ya ἀπέχουσι: malipo yamepokelewa kikamilifu, wala si kwamba bado yanangojea.'
theological_decisions:
- issue: Maana jumuishi ya ἀνθρώποις
  choice: watu
  alternative: wanaume
  rationale: Katika muktadha huu neno hilo linawahusu watazamaji wa kibinadamu kwa ujumla, si wanaume pekee.
- issue: Nguvu ya onyo kuhusu thawabu
  choice: wamekwisha kupokea thawabu yao yote
  alternative: wana thawabu yao
  rationale: 'Tafsiri hii huonyesha nguvu ya nahau ya ἀπέχουσι bila kuongeza fundisho la nje: kutambuliwa na watu ndilo malipo kamili wanalotafuta na kupata.'
- issue: Kusimama wakati wa kusali
  choice: kusali wakiwa wamesimama
  alternative: kusimama na kusali
  rationale: Muundo huu unaonyesha kwamba lawama inalenga kusudi la kuonekana na watu, bila kugeuza mkao wa kusimama wenyewe kuwa kosa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Kila mnaposali’ na ‘msiwe’ ni miundo ya kawaida kwa agizo linalohusu tendo linalorudiwa. ‘Masinagogi’ huhifadhi mazingira ya kihistoria; ‘Amin, ninawaambia’ huhifadhi uzito wa fomula ya chanzo. Alama zote za tanbihi zimewekwa katika matini kuu.
