  text: μὴ οὖν μεριμνήσητε λέγοντες· Τί φάγωμεν; ἤ· Τί πίωμεν; ἤ· Τί περιβαλώμεθα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/031.yaml
  text: Therefore do not worry[a], saying, ‘What will we eat?’ or ‘What will we drink?’ or ‘What will we wear?’
translation:
  language: sw
  text: Kwa hiyo msihangaike, mkisema, “Tutakula nini?” au “Tutakunywa nini?” au “Tutavaa nini?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ οὖν μεριμνήσητε
  choice: Kwa hiyo, msihangaike
  rationale: Neno οὖν linaonyesha hitimisho kutokana na hoja iliyotangulia, hivyo limetafsiriwa “Kwa hiyo.” Katika muktadha huu μεριμνάω ni kuhangaika kwa wasiwasi kuhusu mahitaji ya maisha; “msihangaike” ni Kiswahili cha kawaida kinachobeba katazo hilo bila kukataza mipango ya busara.
- source_word: λέγοντες
  choice: mkisema
  rationale: Kauli endelevu “mkisema” inaonyesha maneno yanayoambatana na hali ya kuhangaika na inasikika kwa kawaida katika Kiswahili.
- source_word: Τί
  choice: nini
  rationale: “Nini” ndiyo njia ya kawaida na ya moja kwa moja ya kuanzisha maswali haya kuhusu mahitaji.
- source_word: φάγωμεν
  choice: Tutakula
  rationale: Hii ni kauli ya kuuliza kuhusu chakula cha wakati ujao; “Tutakula nini?” hutoa maana hiyo kwa Kiswahili cha kawaida.
- source_word: πίωμεν
  choice: Tutakunywa
  rationale: Sawa na φάγωμεν, kitenzi hiki kinauliza kuhusu mahitaji ya wakati ujao na kimetafsiriwa kwa muundo wa kawaida, “Tutakunywa nini?”
- source_word: περιβαλώμεθα
  choice: Tutavaa
  rationale: Katika muktadha huu kitenzi kinamaanisha kujivika nguo. “Tutavaa nini?” ni tafsiri ya kawaida kuliko usemi halisi wa kujizungushia kitu.
- source_word: ἤ ... ἤ ... ἤ
  choice: au ... au ... au
  rationale: Kurudiwa kwa “au” kunadumisha orodha ya maswali matatu tofauti katika chanzo.
theological_decisions:
- issue: Asili ya katazo la Yesu kuhusu mahitaji ya maisha
  choice: “Msihangaike” limeeleweka kama katazo la wasiwasi wenye kuhangaisha kuhusu riziki.
  alternative: “Msiwe na wasiwasi” au tafsiri inayoweza kueleweka kuwa katazo la kila aina ya kufikiria mahitaji.
  rationale: Muktadha unashughulikia hofu na mahangaiko kuhusu kupata mahitaji, si kukataza mipango ya busara. Tafsiri hii inadumisha nguvu ya katazo bila kuongeza dai lisilosemwa na kifungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, wazi na yenye staha. Muundo wa maswali matatu na urudiaji wa “au” umehifadhiwa.
