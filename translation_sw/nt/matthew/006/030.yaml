id: MAT.6.30
reference: Matthew 6:30
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἰ δὲ τὸν χόρτον τοῦ ἀγροῦ σήμερον ὄντα καὶ αὔριον εἰς κλίβανον βαλλόμενον ὁ θεὸς οὕτως ἀμφιέννυσιν, οὐ πολλῷ μᾶλλον ὑμᾶς, ὀλιγόπιστοι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/030.yaml
  text: But if God so clothes the grass of the field[a], which is here today and tomorrow is thrown into an oven, will he not much more clothe you[b], you of little faith?
translation:
  language: sw
  text: Lakini ikiwa Mungu huivika hivyo nyasi ya kondeni, ambayo ipo leo na kesho hutupwa katika tanuru[a], je, hatawavika ninyi zaidi sana, enyi wenye imani haba?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tanuru hili ni la kuokea; nyasi na mimea ya kondeni iliyokauka ingeweza kutumiwa kama kuni.
    reason: cultural_note
  - marker: b
    text: Au “enyi mlio na imani ndogo.” Kigiriki ni wito wa moja kwa moja unaokemea imani isiyotosha.
    reason: lexical_alternative
lexical_decisions:
- source_word: χόρτον τοῦ ἀγροῦ
  choice: nyasi ya kondeni
  rationale: χόρτος inaweza kumaanisha nyasi au mimea ya majani. “Nyasi ya kondeni” ni usemi wa kawaida unaodumisha picha ya uoto wa muda mfupi bila kuibana kuwa maua pekee.
- source_word: σήμερον ὄντα
  choice: ambayo ipo leo
  rationale: Huwasilisha maana ya kuwapo sasa ya ὄντα kwa Kiswahili cha kawaida bila kuongeza wazo la kuwa hai.
- source_word: αὔριον εἰς κλίβανον βαλλόμενον
  choice: kesho hutupwa katika tanuru
  rationale: κλίβανος hapa ni tanuru la kuokea, na βαλλόμενον ni umbo la kutendwa; tafsiri inadumisha picha ya mimea iliyokauka kutumiwa kama kuni.
- source_word: οὕτως ἀμφιέννυσιν
  choice: huivika hivyo
  rationale: ἀμφιέννυμι humaanisha kuvika. Muundo huu huhifadhi sitiari ya Mungu kuuvika uoto.
- source_word: οὐ πολλῷ μᾶλλον
  choice: je, hatawavika ninyi zaidi sana
  rationale: Huhifadhi swali la balagha na hoja ya kutoka jambo dogo kwenda kubwa, huku kitenzi kinachodokezwa kikirejelewa kwa uwazi.
- source_word: ὀλιγόπιστοι
  choice: enyi wenye imani haba
  rationale: Ni nomino ya wito ya wingi yenye karipio kuhusu imani isiyotosha. “Enyi” huonyesha kwamba Yesu anawahutubia moja kwa moja, na “imani haba” ni ya sasa na yenye hadhi.
- source_word: εἰ δὲ
  choice: Lakini ikiwa
  rationale: δέ huleta ugeuko au tofauti nyepesi katika hoja; “Lakini ikiwa” hudumisha uhusiano huo.
theological_decisions:
- issue: Hoja ya utunzaji wa Mungu kutoka kilicho kidogo kwenda kilicho kikubwa
  choice: 'Swali la balagha limedumishwa: Mungu anayevika nyasi ya muda mfupi atawavika wanafunzi kwa hakika zaidi.'
  alternative: Kuligeuza kuwa kauli ya moja kwa moja badala ya swali.
  rationale: Muundo wa Kigiriki pamoja na wito wa mwisho unaunga mkono swali la balagha linalokazia karipio la Yesu bila kuongeza madai mengine ya kimafundisho.
- issue: Maana ya ὀλιγόπιστοι
  choice: “wenye imani haba,” yaani karipio kwa imani au tumaini lisilotosha
  alternative: “msio na imani,” ambalo lingedokeza kutokuwapo kabisa kwa imani
  rationale: Kiambishi ὀλιγο- humaanisha uchache, si kutokuwapo kabisa; tafsiri inadumisha mvutano wa kuwa na imani lakini isiyotosha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Kondeni” na “tanuru” hudumisha picha ya kilimo na kuoka; “enyi wenye imani haba” huhifadhi wito wa moja kwa moja bila mtindo wa kizamani kupita kiasi.
