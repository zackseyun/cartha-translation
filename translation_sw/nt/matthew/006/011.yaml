  text: τὸν ἄρτον ἡμῶν τὸν ἐπιούσιον δὸς ἡμῖν σήμερον·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/011.yaml
  text: Give us today our daily bread[a].
translation:
  language: sw
  text: Utupe leo mkate wetu wa kila siku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mkate wetu wa leo,” “mkate wetu wa siku inayokuja,” au “mkate tunaohitaji.” Kivumishi cha Kigiriki ἐπιούσιον ni nadra, na maana yake kamili inajadiliwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρτον (ἄρτος)
  choice: mkate
  rationale: Neno hili kwa msingi humaanisha “mkate.” Ingawa linaweza kuwakilisha chakula au riziki kwa upana, taswira halisi ya mkate imehifadhiwa katika maandishi.
- source_word: ἡμῶν
  choice: wetu
  rationale: Ni kiwakilishi kimilikishi kinachoeleza kwamba mkate unaoombwa ni “wetu,” yaani kwa jumuiya inayosali.
- source_word: ἐπιούσιον (ἐπιούσιος)
  choice: wa kila siku
  rationale: Kivumishi hiki ni nadra sana na maana yake kamili inajadiliwa. “Wa kila siku” ni tafsiri iliyozoeleka, wazi, na inayofaa pamoja na “leo,” bila kuficha tafsiri nyingine zinazowezekana, ambazo zimewekwa katika tanbihi.
- source_word: δὸς (δίδωμι)
  choice: utupe
  rationale: Ni amri yenye maana ya moja kwa moja ya “toa.” Umbo “utupe” linaunganisha kwa njia ya kawaida katika Kiswahili kitendo hicho na walengwa wake, “sisi.”
- source_word: ἡμῖν
  choice: -tu- katika “utupe”
  rationale: Kiwakilishi cha yambwa “sisi” huwakilishwa kwa kawaida na kiambishi -tu- katika kitenzi cha Kiswahili.
- source_word: σήμερον
  choice: leo
  rationale: “Leo” ni tafsiri ya moja kwa moja na ya kawaida katika Kiswahili cha sasa.
theological_decisions:
- issue: Maana ya ἐπιούσιον katika Sala ya Bwana
  choice: wa kila siku
  alternative: wa leo; wa siku inayokuja; tunaohitaji
  rationale: Neno ἐπιούσιος linaweza kueleweka kwa habari ya mkate wa siku ya sasa, wa siku inayokuja, au mkate unaohitajika kwa maisha. Maandishi makuu yanatumia “wa kila siku” kwa kuwa ni ya asili na yanaeleweka kwa urahisi, huku tanbihi ikihifadhi utata wa kweli wa neno la Kigiriki bila kuamua kimyakimya kati ya tafsiri hizo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. “Utupe” ni fupi na ya asili katika sala; “mkate” huhifadhi taswira halisi ya chanzo.
