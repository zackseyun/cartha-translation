  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: σὺ δὲ ὅταν προσεύχῃ, εἴσελθε εἰς τὸ ταμεῖόν σου καὶ κλείσας τὴν θύραν σου πρόσευξαι τῷ πατρί σου τῷ ἐν τῷ κρυπτῷ· καὶ ὁ πατήρ σου ὁ βλέπων ἐν τῷ κρυπτῷ ἀποδώσει ⸀σοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/006.yaml
  text: But when you pray[a], go into your inner room, and after shutting your door, pray to your Father who is in secret; and your Father, who sees in secret[b], will reward you.
translation:
  language: sw
  text: Lakini wewe unaposali, ingia katika chumba chako cha ndani[a], funga mlango wako, kisha usali kwa Baba yako aliye sirini; naye Baba yako aonaye sirini atakuthawabisha[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “chumba chako cha faragha” au “ghala lako.” Neno la Kigiriki linamaanisha chumba cha ndani kilichotumiwa kwa faragha au kuhifadhia vitu.
    reason: lexical_alternative
  - marker: b
    text: Au “atakulipa.” Kitenzi cha Kigiriki kinaweza kumaanisha kutoa malipo, kulipa, au kurudisha.
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ δὲ
  choice: Lakini wewe
  rationale: Kiwakilishi chenye mkazo pamoja na δέ kinaonyesha tofauti kati ya msomaji na wanafiki waliotajwa katika mstari uliotangulia.
- source_word: ὅταν προσεύχῃ
  choice: unaposali
  rationale: Muundo huu unaeleza wakati wa tendo linalotarajiwa au kurudiwa; “unaposali” ni Kiswahili cha kawaida na cha moja kwa moja.
- source_word: εἴσελθε εἰς τὸ ταμεῖόν σου
  choice: ingia katika chumba chako cha ndani
  rationale: ταμεῖον ni chumba cha ndani kilichotumiwa kwa faragha au kuhifadhia vitu; “chumba cha ndani” huhifadhi wazo la mahali pa faragha bila kuibana maana kuwa ghala pekee.
- source_word: κλείσας τὴν θύραν σου
  choice: funga mlango wako, kisha
  rationale: Kitenzi kishirikishi cha aoristi kinaonyesha tendo linalotangulia amri kuu ya kusali; “kisha” huweka mfuatano huo wazi kwa Kiswahili asilia.
- source_word: πρόσευξαι τῷ πατρί σου
  choice: usali kwa Baba yako
  rationale: Huhifadhi amri na jina la kimahusiano “Baba” bila kuongeza “wa mbinguni,” ambalo halimo katika mstari huu.
- source_word: τῷ ἐν τῷ κρυπτῷ
  choice: aliye sirini
  rationale: Usemi huu huhifadhi hali ya kufichika bila kuamua kwamba ni mahali halisi tu au kutokuonekana tu.
- source_word: ὁ βλέπων ἐν τῷ κρυπτῷ
  choice: aonaye sirini
  rationale: Huhifadhi urudiaji wa ἐν τῷ κρυπτῷ na mkazo wa kuona kwa Baba katika hali ya siri.
- source_word: ἀποδώσει σοι
  choice: atakuthawabisha
  rationale: Katika muktadha huu ἀποδίδωμι ina maana chanya ya kutoa malipo; “atakuthawabisha” ni ya kawaida, huku tanbihi ikihifadhi uwezekano wa “atakulipa.”
theological_decisions:
- issue: Maana ya usemi unaorudiwa ἐν τῷ κρυπτῷ
  choice: “sirini” limetumiwa kwa kuwapo kwa Baba na kwa kuona kwake.
  alternative: “mahali pa siri,” “kwa faragha,” au “aonaye yaliyofanywa kwa siri”
  rationale: Urudiaji huo unasisitiza tofauti kati ya ibada ya siri na maonyesho ya hadharani. Tafsiri hii haiamui kimya kimya kama usemi huo ni wa mahali pekee au wa namna ya tendo.
- issue: Jina πατήρ kwa Mungu
  choice: Baba
  alternative: Baba wa mbinguni
  rationale: Mstari unasema “Baba yako” bila kuongeza “wa mbinguni”; jina la kimahusiano limehifadhiwa bila upanuzi wa kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. “Kusali” limetumiwa kwa naturalness ya kawaida; sentensi imepangwa kwa mtiririko wazi huku urudiaji wa “sirini” ukihifadhiwa.
