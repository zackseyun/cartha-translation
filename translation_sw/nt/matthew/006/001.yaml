  verdict: revise
  source_fidelity: 'The draft accurately represents the warning, the broad SBLGNT reading δικαιοσύνην, the human audience, divine reward, and the plural ''mbingu.'' However, ''ili wawaone'' reverses the Greek passive sense: it says, in effect, that the people will see them, rather than that the disciples seek to be seen by people.'
  naturalness: Most of the wording is clear, dignified Standard East African Swahili. 'Kwa kusudi la kuonekana na watu' is both natural and unambiguously conveys the intended-display purpose.
  terminology: '''Haki yenu'' can represent δικαιοσύνην broadly, and the footnote appropriately records ''matendo ... ya haki'' and the almsgiving variant. ''Thawabu,'' ''Baba yenu,'' and ''mbingu'' are suitable and consistent with the source.'
  issues:
  - severity: high
    issue: The purpose clause 'ili wawaone' has the wrong grammatical direction.
    rationale: Greek πρὸς τὸ θεαθῆναι αὐτοῖς means 'for the purpose of being seen by them.' The draft's active wording makes people the ones who see, and leaves the object referent unclear, rather than expressing the disciples' purpose of being seen.
  revised_text: Lakini jihadharini msitende haki yenu[a] mbele ya watu kwa kusudi la kuonekana na watu; la sivyo, hamna thawabu kutoka kwa Baba yenu aliye katika mbingu.[b]
