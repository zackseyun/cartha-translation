id: MAT.6.1
reference: Matthew 6:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Προσέχετε ⸀δὲ τὴν ⸀δικαιοσύνην ὑμῶν μὴ ποιεῖν ἔμπροσθεν τῶν ἀνθρώπων πρὸς τὸ θεαθῆναι αὐτοῖς· εἰ δὲ μή γε, μισθὸν οὐκ ἔχετε παρὰ τῷ πατρὶ ὑμῶν τῷ ἐν τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/001.yaml
  text: But be careful not to practice your righteousness before people in order to be seen by them[a]; otherwise[b], you have no reward from your Father in the heavens.
translation:
  language: sw
  text: Lakini jihadharini msitende haki yenu[a] mbele ya watu kwa kusudi la kuonekana na watu; la sivyo, hamna thawabu kutoka kwa Baba yenu aliye katika mbingu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “matendo yenu ya haki.” Baadhi ya hati za kale zinasoma “utoaji wenu wa sadaka.”
    reason: textual_variant
  - marker: b
    text: Kigiriki hutumia umbo la wingi, “katika mbingu”; kwa kawaida pia inaweza kutafsiriwa “mbinguni.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσέχετε
  choice: jihadharini
  rationale: Amri ya wakati uliopo kwa wingi inataka uangalifu unaoendelea. “Jihadharini” ni onyo la kawaida na lenye uzito katika Kiswahili.
- source_word: δὲ
  choice: Lakini
  rationale: Neno hili linaonyesha mpito wenye utofautishaji kutoka mafundisho yaliyotangulia hadi onyo hili.
- source_word: δικαιοσύνην
  choice: haki yenu
  rationale: Hili ndilo neno la msingi katika matini ya SBLGNT, na hapa linaweza kumaanisha kwa upana mwenendo au matendo ya haki. Tafsiri hii haifungi maana kwenye kutoa sadaka pekee.
- source_word: μὴ ποιεῖν
  choice: msitende
  rationale: Kitenzi hiki kinaeleza jambo ambalo wanafunzi wanapaswa kuepuka kufanya. “Kutenda haki” ni usemi wenye hadhi na unaoeleweka katika Kiswahili.
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: mbele ya watu
  rationale: Inawahusu wanadamu kwa jumla kama watazamaji, wala si wanaume pekee.
- source_word: πρὸς τὸ θεαθῆναι αὐτοῖς
  choice: ili wawaone
  rationale: Muundo wa Kigiriki unaonyesha kusudi. Kiswahili cha kutenda “ili wawaone” ni cha kawaida na kinahifadhi nia ya kufanya jambo ili kuonekana, ingawa kinabadilisha kauli tendwa ya Kigiriki kuwa kauli tendi ya kawaida zaidi katika Kiswahili.
- source_word: εἰ δὲ μή γε
  choice: la sivyo
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaowasilisha sharti na matokeo yake kwa ufupi.
- source_word: μισθὸν
  choice: thawabu
  rationale: Katika muktadha wa malipo yanayotoka kwa Mungu kwa ajili ya mwenendo, “thawabu” ni ya kawaida na haileti wazo finyu la mshahara wa kazi.
- source_word: παρὰ τῷ πατρὶ ὑμῶν
  choice: kutoka kwa Baba yenu
  rationale: παρά pamoja na hali ya dative inaweza kueleza ukaribu au chanzo. Katika muktadha huu wa thawabu, “kutoka kwa” huonyesha Baba kuwa chanzo chake.
- source_word: τῷ ἐν τοῖς οὐρανοῖς
  choice: aliye katika mbingu
  rationale: Kigiriki kina umbo la wingi, “mbingu.” Usemi huu unalihifadhi wazi huku ukiendelea kueleweka katika Kiswahili.
theological_decisions:
- issue: Upana wa maana ya δικαιοσύνην katika mstari huu
  choice: “haki” kwa maana pana ya mwenendo au matendo ya haki
  alternative: “utoaji wa sadaka” au “matendo ya haki”
  rationale: SBLGNT inasoma δικαιοσύνην, ambalo kwa kawaida lina maana pana kuliko utoaji wa sadaka. Muktadha unaofuata unazungumzia sadaka, lakini maana hiyo nyembamba haijaingizwa katika matini kuu; imeonyeshwa katika tanbihi pamoja na tofauti ya hati.
- issue: Maana ya ἀνθρώπων
  choice: watu
  alternative: wanaume
  rationale: Wanaotajwa ni watazamaji wa kibinadamu kwa jumla, si watu wa jinsia ya kiume pekee.
- issue: Umbo la τοῖς οὐρανοῖς
  choice: katika mbingu
  alternative: mbinguni
  rationale: Mathayo anatumia umbo la wingi. Kulihifadhi kunaakisi maneno na mtindo wa Kigiriki bila kuongeza dai jingine la kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Jihadharini,” “kutenda haki,” na “thawabu” vinafaa kwa mafundisho ya kidini bila kuwa vya kizamani. Muundo wa kusudi umewekwa kwa kauli tendi ya kawaida katika Kiswahili ili sentensi isikike kwa urahisi, huku nia ya kutaka kuonekana ikibaki wazi.
