base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/032.yaml
  text: For the Gentiles eagerly seek all these things; for your heavenly Father knows that you need all these things.
translation:
  language: sw
  text: Kwa maana watu wa mataifa[a] huyatafuta[b] mambo haya yote; kwa maana Baba yenu wa mbinguni anajua kwamba mnahitaji mambo hayo yote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mataifa,” au “wapagani.” Neno la Kigiriki linaweza kumaanisha mataifa kwa ujumla, lakini hapa huenda linawarejelea watu walio nje ya jumuiya ya agano.
    reason: alternative_reading
  - marker: b
    text: Au, “huyafuatilia kwa bidii.” Kitenzi cha Kigiriki kinaweza kudokeza kutafuta kwa dhati au kwa kuendelea.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἔθνη
  choice: watu wa mataifa
  rationale: Katika muktadha huu, neno hili linawatofautisha wanafunzi wa Yesu na watu walio nje ya jumuiya ya agano. “Watu wa mataifa” ni Kiswahili cha kawaida kinachohifadhi maana hiyo bila kuongeza dharau inayoweza kusikika katika “wapagani.”
- source_word: ἐπιζητοῦσιν
  choice: huyatafuta kwa bidii
  rationale: Kitenzi hiki kinaweza kuonyesha kutafuta kwa dhati au kwa kuendelea. “Huyatafuta kwa bidii” huwasilisha uzito huo kwa Kiswahili cha asili bila kuufanya kuwa mkali kupita kiasi.
- source_word: ὁ πατὴρ ὑμῶν ὁ οὐράνιος
  choice: Baba yenu wa mbinguni
  rationale: Hili ni tamko la kawaida na lenye heshima linalohifadhi umilikaji wa “yenu” na sifa ya Baba kuwa wa mbinguni.
- source_word: οἶδεν
  choice: anajua
  rationale: Ingawa umbo la Kigiriki ni timilifu, hapa lina maana ya wakati wa sasa; “anajua” ni tafsiri sahihi na ya kawaida.
- source_word: χρῄζετε
  choice: mnahitaji
  rationale: “Mnahitaji” huwasilisha maana moja kwa moja kwa Kiswahili cha sasa na kudumisha nafsi ya pili wingi.
- source_word: πάντα γὰρ ταῦτα ... τούτων ἁπάντων
  choice: mambo haya yote ... mambo hayo yote
  rationale: Marudio ya chanzo yamehifadhiwa kwa ajili ya msisitizo. “Haya” katika sehemu ya kwanza na “hayo” katika ya pili yanafuata uhusiano wa kawaida wa Kiswahili baada ya kurejelea mambo yaliyotangulia.
- source_word: γὰρ ... γὰρ
  choice: Kwa maana ... kwa maana
  rationale: Viunganishi vyote viwili vimehifadhiwa ili kuonyesha mtiririko wa maelezo uliopo katika Kigiriki.
theological_decisions:
- issue: Rejeleo la τὰ ἔθνη katika mafundisho ya Yesu
  choice: watu wa mataifa
  alternative: mataifa; wapagani
  rationale: Chaguo hili linahifadhi tofauti ya kihistoria kati ya wanafunzi wa Yesu na watu walio nje ya jumuiya ya agano, bila kudokeza hukumu ya jumla juu ya kila asiye Myahudi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi na chenye heshima. Muundo wa “Baba yenu wa mbinguni” ni wa kawaida na unaeleweka kwa urahisi. Marudio na viunganishi vya maelezo vimehifadhiwa kwa uaminifu kwa mtiririko wa chanzo.
