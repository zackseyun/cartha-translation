  yaml_path: translation/nt/matthew/006/012.yaml
  text: And forgive us our debts[b][a], as we also have forgiven our debtors.
translation:
  language: sw
  text: Na utusamehe madeni yetu[a], kama nasi tumewasamehe[b] wadaiwa wetu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “makosa yetu” au “dhambi zetu”; neno la Kigiriki kwa maana halisi ni “madeni” na hapa yaelekea linarejelea dhambi au makosa.
    reason: lexical_alternative
  - marker: b
    text: Au “tuliwasamehe.” Aoristi ya Kigiriki inaweza kutafsiriwa kwa wakati uliopita sahili; “tumewasamehe” huonyesha kwa Kiswahili tendo lililokamilika lenye umuhimu kwa hali ya sasa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφες
  choice: utusamehe
  rationale: Katika ombi linalohusu makosa ya kimaadili, ἀφίημι humaanisha kusamehe. Umbo la amri limetafsiriwa kwa hali ya kutaka yenye kiambishi cha nafsi ‘tu-’, ambacho ni cha kawaida katika sala ya Kiswahili.
- source_word: τὰ ὀφειλήματα ἡμῶν
  choice: madeni yetu
  rationale: ‘Madeni’ huhifadhi sitiari ya kitu kinachodaiwa na pia uhusiano wa kimsamiati na ‘wadeni’ mwishoni mwa mstari.
- source_word: ὡς
  choice: kama
  rationale: ‘Kama’ huonyesha ulinganisho bila kuamua zaidi aina au msingi wa uhusiano kati ya msamaha wa Mungu unaoombwa na msamaha ambao waombaji wametoa.
- source_word: καὶ ἡμεῖς
  choice: nasi
  rationale: ‘Nasi’ huwasilisha kiunganishi καὶ pamoja na msisitizo wa kiwakilishi ἡμεῖς kwa Kiswahili cha kawaida na kifupi.
- source_word: ἀφήκαμεν
  choice: tumewasamehe
  rationale: Wakati timilifu wa Kiswahili huonyesha tendo lililokamilika lenye umuhimu kwa hali ya sasa. Hii ni tafsiri ya kawaida ya aoristi katika muktadha huu, huku uwezekano wa wakati uliopita sahili ukitajwa katika tanbihi.
- source_word: τοῖς ὀφειλέταις ἡμῶν
  choice: wadeni wetu
  rationale: ‘Wadeni wetu’ huhifadhi nomino inayohusiana moja kwa moja na ‘madeni yetu,’ na hivyo kudumisha mshikamano wa sitiari ya Kigiriki.
theological_decisions:
- issue: Sitiari ya kimaadili katika ὀφειλήματα
  choice: Kuhifadhi ‘madeni’ katika matini kuu kama sitiari ya dhambi au makosa mbele za Mungu.
  alternative: ‘makosa’ au ‘dhambi’
  rationale: Kigiriki kinatumia lugha ya deni na mdaiwa. Kutaja ‘madeni’ hakufuti maana ya kimaadili, lakini huepuka kuondoa sitiari halisi ya chanzo.
- issue: Uhusiano unaoonyeshwa na ὡς
  choice: Kutumia ‘kama’ bila kufafanua ikiwa msamaha wa binadamu ni sharti, kipimo, au ushahidi wa msamaha wa Mungu.
  alternative: ‘kwa sababu nasi’ au ‘kwa kadiri nasi’
  rationale: Chanzo kinatoa ulinganisho kwa ὡς lakini hakifafanui uhusiano huo kwa maneno ya ziada; tafsiri inapaswa kuhifadhi mvutano huo wa kiteolojia.
- issue: Nuansi ya wakati katika ἀφήκαμεν
  choice: Kutumia ‘tumewasamehe,’ tendo lililokamilika lenye umuhimu wa sasa.
  alternative: ‘tuliwasamehe’
  rationale: Aoristi inaweza kutafsiriwa kwa wakati uliopita sahili, lakini timilifu ya Kiswahili ni ya asili katika sala hii na huonyesha msamaha uliokwisha kutolewa bila kudai kwamba Kigiriki kina wakati timilifu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni mfupi na unaofaa kusomwa kama sala. ‘Madeni/wadeni’ huhifadhi uradidi wa kimakusudi wa chanzo, na ‘nasi’ hudumisha msisitizo wa upande wa waombaji.
