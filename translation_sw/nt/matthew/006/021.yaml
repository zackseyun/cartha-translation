  text: ὅπου γάρ ἐστιν ὁ θησαυρός ⸀σου, ἐκεῖ ἔσται καὶ ἡ καρδία ⸁σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/021.yaml
  text: For where your treasure is[a], there your heart will be also.
translation:
  language: sw
  text: Kwa maana hazina yako ilipo, ndipo moyo wako utakapokuwa pia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa maana hazina yako ilipo, ndipo moyo wako ulipo pia.” Baadhi ya tafsiri hutumia wakati wa sasa ili kuonyesha kanuni ya kudumu, lakini kitenzi cha Kigiriki kiko katika wakati ujao (“utakapokuwa”).
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπου
  choice: ilipo
  rationale: Kiambishi cha mahali -po pamoja na kitenzi ‘iko’ kinatambulisha kishazi cha uhusiano wa mahali kwa Kiswahili cha kawaida na kuhifadhi maana ya ‘mahali ambapo.’
- source_word: γάρ
  choice: Kwa maana
  rationale: Inaonyesha kuwa kauli hii inaeleza sababu ya fundisho lililotangulia kuhusu kujiwekea hazina.
- source_word: θησαυρός
  choice: hazina
  rationale: ‘Hazina’ ni neno la kawaida linalohifadhi maana halisi ya mali iliyowekwa pamoja na nguvu yake ya sitiari katika muktadha.
- source_word: σου
  choice: yako / wako
  rationale: Kiwakilishi cha umilikaji kimetafsiriwa kulingana na ngeli za nomino ‘hazina’ na ‘moyo,’ huku nafsi ya pili umoja ikihifadhiwa.
- source_word: ἐκεῖ
  choice: ndipo
  rationale: ‘Ndipo’ linahusianisha kwa ufupi na kwa mkazo mahali palipotajwa na ‘ilipo,’ hivyo kuhifadhi muundo wa Kigiriki ‘mahali... hapo.’
- source_word: ἔσται
  choice: utakapokuwa
  rationale: Huhifadhi wazi wakati ujao wa kitenzi cha Kigiriki na kuunganika kiasili na rejeo la mahali katika ‘ndipo.’
- source_word: καρδία
  choice: moyo
  rationale: ‘Moyo’ ni tafsiri ya kawaida na pana, inayoweza kujumuisha tamaa, uaminifu, nia na mwelekeo wa ndani bila kufupisha maana kuwa hisia pekee.
- source_word: καὶ
  choice: pia
  rationale: Linahifadhi maana ya nyongeza inayounganisha mahali pa moyo na mahali pa hazina.
theological_decisions:
- issue: Nguvu ya wakati ya ἔσται katika msemo wenye sura ya hekima
  choice: 'Kuhifadhi wakati ujao wazi: ‘utakapokuwa’'
  alternative: 'Kutumia wakati wa sasa: ‘ulipo’'
  rationale: Kitenzi cha Kigiriki kiko katika wakati ujao. Kukihifadhi huepuka kuifanya kauli iwe maelezo tuli tu, huku kukiacha kifungu kionyeshe pia kwamba moyo utaelekezwa mahali hazina ilipo bila kulazimisha hitimisho pana zaidi la kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ‘ilipo ... ndipo ... utakapokuwa’ ni wa asili, unaeleweka kwa urahisi, na huhifadhi uwiano na msisitizo wa sentensi ya Kigiriki.
