  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: θησαυρίζετε δὲ ὑμῖν θησαυροὺς ἐν οὐρανῷ, ὅπου οὔτε σὴς οὔτε βρῶσις ἀφανίζει, καὶ ὅπου κλέπται οὐ διορύσσουσιν οὐδὲ κλέπτουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/020.yaml
  text: But store up for yourselves treasures in heaven[a], where neither moth nor decay destroys[b], and where thieves do not break in and steal.
translation:
  language: sw
  text: Lakini jiwekeeni hazina mbinguni, ambako nondo wala uozo[a] haviharibu, na ambako wezi hawavunji na kuingia[b] wala hawaibi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kutu.” Neno la Kigiriki linaweza kumaanisha kwa upana zaidi uozo, uharibifu unaoteketeza, au kutu.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “hawachimbi kupitia.” Huenda hii inarejelea wezi waliokuwa wakichimba au kutoboa kuta za nyumba ili kuingia.
    reason: cultural_note
lexical_decisions:
- source_word: θησαυρίζετε
  choice: jiwekeeni hazina
  rationale: Kauli ya amri ya wakati uliopo inahimiza tendo linaloendelea. Usemi huu ni wa kawaida na unadumisha picha ya kukusanya na kuhifadhi hazina.
- source_word: δὲ
  choice: Lakini
  rationale: Inaonyesha tofauti na katazo la mstari uliotangulia kuhusu kujiwekea hazina duniani.
- source_word: ὑμῖν
  choice: -ji-...-eni (jiwekeeni)
  rationale: Muundo wa kujirejelea unaonyesha kuwa wanajiwekea wenyewe, sawa na dativu ya manufaa katika Kigiriki.
- source_word: θησαυροὺς
  choice: hazina
  rationale: Katika Kiswahili, “hazina” hutumika kwa umbo lilelile kwa umoja na wingi; hapa muktadha unaonyesha wingi wa vitu vya thamani.
- source_word: ἐν οὐρανῷ
  choice: mbinguni
  rationale: Ni usemi wa kawaida wa Kiswahili unaohifadhi maana ya mahali bila kufafanua sitiari.
- source_word: σὴς
  choice: nondo
  rationale: Ni mdudu anayeharibu nguo na mali iliyohifadhiwa, na ndiyo maana ya kawaida ya neno la Kigiriki.
- source_word: βρῶσις
  choice: uharibifu unaokula vitu
  rationale: Neno linaweza kumaanisha kula au uharibifu unaoteketeza. Tafsiri hii inahifadhi upana wake kuliko “kutu” pekee na bado inaeleweka katika muktadha.
- source_word: ἀφανίζει
  choice: haviharibu
  rationale: Inaeleza kusababisha kitu kitoweke au kuangamia; “kuharibu” ni wazi na inafaa kwa visababishi vyote viwili.
- source_word: κλέπται
  choice: wezi
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya nomino ya wingi.
- source_word: διορύσσουσιν
  choice: hawavunji na kuingia
  rationale: Kitenzi kihalisi ni kuchimba au kutoboa ukuta ili kuingia. Usemi huu unaeleza kitendo hicho kwa Kiswahili cha sasa, huku maelezo ya kihistoria yakitolewa katika tanbihi.
- source_word: κλέπτουσιν
  choice: hawaibi
  rationale: Ni tafsiri ya moja kwa moja, rahisi, na inayodumisha ulinganifu wa vitenzi.
theological_decisions:
- issue: Maana ya “hazina mbinguni”
  choice: Sitiari “hazina mbinguni” imedumishwa bila maelezo ya ziada.
  alternative: thawabu za mbinguni; utajiri wa kiroho
  rationale: Kufafanua sitiari ndani ya matini kungeingiza mtazamo maalumu kuhusu thawabu au sifa ambao mstari wenyewe hautamki wazi.
- issue: Upeo wa βρῶσις
  choice: Imetafsiriwa kwa maana pana ya uharibifu unaokula vitu.
  alternative: kutu; kuoza
  rationale: Hii haifungi maana kwenye kutu ya metali pekee, bali inadumisha wazo la uharibifu unaoteketeza mali ya duniani.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa moja kwa moja na unaeleweka kwa wasomaji wa kawaida; sitiari na utofauti na mstari uliotangulia vimedumishwa.
