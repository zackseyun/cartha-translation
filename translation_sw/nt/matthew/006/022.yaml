  text: Ὁ λύχνος τοῦ σώματός ἐστιν ὁ ὀφθαλμός. ἐὰν οὖν ⸂ᾖ ὁ ὀφθαλμός σου ἁπλοῦς⸃, ὅλον τὸ σῶμά σου φωτεινὸν ἔσται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/022.yaml
  text: The eye is the lamp of the body. Therefore[a], if your eye is healthy, your whole body will be full of light.
translation:
  language: sw
  text: Jicho ni taa ya mwili. Kwa hiyo, ikiwa jicho lako ni timamu[a], mwili wako wote utakuwa na nuru.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “moja,” “safi,” au “lenye hali nzuri.” Neno la Kigiriki linaweza pia kuwa na maana ya kutogawanyika au, katika baadhi ya miktadha, kuwa karimu.
    reason: lexical_alternative
lexical_decisions:
- source_word: λύχνος
  choice: taa
  rationale: Neno hili humaanisha taa inayotoa mwanga, si nuru kwa ujumla; hivyo “taa” inadumisha mfano halisi wa jicho kuwa chanzo cha mwanga kwa mwili.
- source_word: σῶμα
  choice: mwili
  rationale: Hili ndilo neno la kawaida la Kiswahili na linadumisha taswira ya mwili iliyomo katika mstari huu.
- source_word: ὀφθαλμός
  choice: jicho
  rationale: Tafsiri ya moja kwa moja inafaa kwa taswira ya kimwili na pia kwa maana pana ya mfano huo.
- source_word: ἐὰν οὖν
  choice: Kwa hiyo, ikiwa
  rationale: “Kwa hiyo” inadumisha uhusiano wa kimantiki unaoonyeshwa na οὖν, na “ikiwa” inaonyesha sharti la ἐάν kwa Kiswahili cha kawaida.
- source_word: ἁπλοῦς
  choice: zima
  rationale: Katika muktadha wa kuona na kuangaziwa kwa mwili, “zima” hueleweka kuwa jicho linalofanya kazi ipasavyo. Neno hilo la Kigiriki lina maana nyingine zinazowezekana, ambazo zimehifadhiwa katika tanbihi.
- source_word: ὅλον
  choice: wote
  rationale: “Mwili wako wote” ni usemi wa kawaida unaodumisha maana ya ujumla kamili.
- source_word: φωτεινὸν
  choice: na nuru
  rationale: Usemi “utakuwa na nuru” ni wa asili katika Kiswahili na unadumisha taswira ya mwili mzima kuangaziwa.
- source_word: ἔσται
  choice: utakuwa
  rationale: Wakati ujao ulio wazi katika Kigiriki umedumishwa.
theological_decisions:
- issue: Maana ya ἁπλοῦς katika mfano wa jicho
  choice: Kutafsiri “zima” katika matini kuu
  alternative: “moja,” “safi,” “lenye hali nzuri,” au, katika miktadha mingine, “karimu”
  rationale: Muktadha wa karibu unahusu jicho kama taa ya mwili na unalitofautisha na jicho baya katika mstari unaofuata. “Zima” huunganisha neno hilo na utendaji mzuri wa kuona bila kulazimisha maana maalumu ya kitheolojia. Maana nyingine halisi zinazowezekana zimewekwa katika tanbihi ili kuhifadhi utata wa Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo ni mfupi na wa asili; taswira za “taa,” “mwili,” “jicho,” na “nuru” zimedumishwa.
