  text: ἐὰν γὰρ ἀφῆτε τοῖς ἀνθρώποις τὰ παραπτώματα αὐτῶν, ἀφήσει καὶ ὑμῖν ὁ πατὴρ ὑμῶν ὁ οὐράνιος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/014.yaml
  text: For if you forgive people their trespasses[b][a], your heavenly Father will also forgive you.
translation:
  language: sw
  text: Kwa maana mkiwasamehe watu makosa yao, Baba yenu wa mbinguni atawasamehe ninyi pia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐὰν γὰρ
  choice: Kwa maana mki-
  rationale: γάρ inaunganisha mstari huu na sala iliyotangulia kwa kutoa sababu, hivyo imetafsiriwa “Kwa maana.” ἐάν pamoja na hali tegemezi ya kitenzi inaonyesha sharti, ambalo Kiswahili hulieleza kwa kiambishi “-ki-” katika “mkiwasamehe.”
- source_word: ἀφῆτε
  choice: mkiwasamehe
  rationale: Katika muktadha wa kosa la kimaadili kati ya watu, ἀφίημι humaanisha kusamehe. Mzizi huohuo wa Kiswahili umetumiwa pia kwa ἀφήσει ili kuhifadhi ulinganifu wa vitenzi.
- source_word: τοῖς ἀνθρώποις
  choice: watu
  rationale: ἄνθρωποι inawahusu wanadamu kwa ujumla, si wanaume pekee; “watu” ni tafsiri ya kawaida na isiyoegemea jinsia.
- source_word: τὰ παραπτώματα αὐτῶν
  choice: makosa yao
  rationale: παράπτωμα hurejelea kosa, kujikwaa kimaadili, au kuvuka mpaka unaofaa. “Makosa yao” ni lugha ya sasa, ya kawaida, na huhifadhi maana ya kimaadili na kimahusiano bila kuifanya kuwa nzito isivyo lazima.
- source_word: ἀφήσει καὶ ὑμῖν
  choice: atawasamehe ninyi pia
  rationale: Wakati ujao wa ἀφίημι umetafsiriwa kwa mzizi uleule “samehe.” “Pia” huwakilisha καί na kuonyesha ulinganifu kati ya kuwasamehe wengine na kusamehewa na Baba; “ninyi” huweka wazi msisitizo wa ὑμῖν.
- source_word: ὁ πατὴρ ὑμῶν ὁ οὐράνιος
  choice: Baba yenu wa mbinguni
  rationale: Hii ni tafsiri ya kawaida, yenye heshima, ya muundo wa Kigiriki unaomaanisha Baba yenu aliye wa mbinguni; pia inafaa matumizi ya Mathayo.
theological_decisions:
- issue: Uhusiano wa sharti kati ya kuwasamehe watu na kusamehewa na Mungu
  choice: 'Kauli imetafsiriwa moja kwa moja kama sharti halisi: “mkiwasamehe ... atawasamehe.”'
  alternative: Kuitafsiri ama kana kwamba msamaha wa binadamu unanunua msamaha wa Mungu, ama kana kwamba kuwasamehe wengine ni ushahidi tu wa msamaha wa Mungu uliotangulia.
  rationale: Kigiriki kinatoa kauli ya sharti bila kueleza hapa mfumo mpana wa kiteolojia. Tafsiri inahifadhi mvutano huo badala ya kuutatua kwa mtazamo wa dhehebu fulani.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Kwa maana” huhifadhi uhusiano wa ufafanuzi na yaliyotangulia; “makosa” kinaeleweka kwa wasomaji wa kawaida; “Baba yenu wa mbinguni” ni usemi wa asili na wa heshima.
