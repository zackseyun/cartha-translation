  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὅπως μὴ φανῇς τοῖς ἀνθρώποις νηστεύων ἀλλὰ τῷ πατρί σου τῷ ἐν τῷ ⸀κρυφαίῳ· καὶ ὁ πατήρ σου ὁ βλέπων ἐν τῷ ⸁κρυφαίῳ ἀποδώσει σοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/018.yaml
  text: so that you may not appear to men to be fasting[a], but to your Father who is in secret[b]; and your Father who sees in secret will reward you.
translation:
  language: sw
  text: ili usionekane na watu kuwa unafunga, bali uonekane na Baba yako aliye sirini; na Baba yako aonaye sirini atakuzawadia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅπως
  choice: ili
  rationale: Huanzisha kusudi la tendo linalotajwa katika muktadha; “ili” ni ya kawaida na huhifadhi maana hiyo.
- source_word: μὴ φανῇς
  choice: usionekane
  rationale: Kitenzi cha hali ya kutendwa pamoja na ukanushi kinaeleza kutoonekana au kutotambulika mbele ya watazamaji.
- source_word: τοῖς ἀνθρώποις
  choice: na watu
  rationale: Hapa ἄνθρωποι inawahusu watazamaji wote wa kibinadamu, si wanaume pekee; “watu” hutoa maana hiyo kwa Kiswahili cha kawaida.
- source_word: νηστεύων
  choice: kuwa unafunga
  rationale: Kirai hiki kinaonyesha shughuli ambayo mtu angeonekana akiifanya, huku hali ya tendo linaloendelea ikihifadhiwa.
- source_word: ἀλλὰ τῷ πατρί σου
  choice: bali na Baba yako
  rationale: “Bali” huhifadhi ulinganisho wa μὴ…ἀλλά kati ya kuonekana na watu na kuonekana na Baba. Kitenzi “usionekane” kinaeleweka pia katika sehemu ya pili bila kurudiwa.
- source_word: τῷ ἐν τῷ κρυφαίῳ
  choice: aliye sirini
  rationale: Huhifadhi wazo la Baba kuwapo katika hali au eneo lisiloonekana bila kulifanya kuwa mahali maalumu kupita ilivyo katika Kigiriki.
- source_word: ὁ βλέπων ἐν τῷ κρυφαίῳ
  choice: aonaye sirini
  rationale: Tafsiri fupi inafuata muundo wa Kigiriki na kudumisha urudiaji wa “sirini” bila kuongeza wazi kitu kinachoonekana.
- source_word: ἀποδώσει σοι
  choice: atakulipa
  rationale: Katika muktadha huu ἀποδίδωμι ina maana ya kutoa malipo yanayolingana; “atakulipa” ni ya asili na haibainishi aina ya malipo.
theological_decisions:
- issue: Rejeo la jumla la ἀνθρώποις
  choice: watu
  alternative: wanaume
  rationale: Muktadha unawahusu watazamaji wa kibinadamu kwa jumla, wala hauwalengi wanaume pekee.
- issue: Maana ya κρυφαίῳ katika sehemu zote mbili
  choice: sirini
  alternative: mahali pa siri
  rationale: “Sirini” huhifadhi uhusiano wa kimaneno kati ya kuwapo kwa Baba kusikoonekana na kuona kwake, bila kulazimisha tafsiri ya mahali halisi maalumu.
- issue: Ellipsisi katika μὴ φανῇς…ἀλλὰ τῷ πατρί σου
  choice: Kitenzi cha kuonekana hakikurudiwa baada ya “bali,” lakini kinaeleweka katika ulinganisho.
  alternative: bali uonekane na Baba yako
  rationale: Muundo mfupi huhifadhi mvutano na ellipsisi ya Kigiriki badala ya kuongeza kitenzi ambacho hakijaandikwa wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Baba” limeandikwa kwa herufi kubwa kama namna ya kumrejelea Mungu; muundo wa sentensi umehifadhi ulinganisho wa chanzo bila kuwa mzito kupita kiasi.
