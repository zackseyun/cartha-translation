  text: σοῦ δὲ ποιοῦντος ἐλεημοσύνην μὴ γνώτω ἡ ἀριστερά σου τί ποιεῖ ἡ δεξιά σου,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/003.yaml
  text: But when you give to the needy[a], do not let your left hand know what your right hand is doing,
translation:
  language: sw
  text: Lakini wewe unapowapa wenye uhitaji[a], mkono wako wa kushoto usijue kile ambacho mkono wako wa kulia unafanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “unapotoa sadaka kwa maskini”; neno la Kigiriki linamaanisha kutoa msaada wa huruma kwa wahitaji.
    reason: lexical_alternative
lexical_decisions:
- source_word: σοῦ δὲ ποιοῦντος
  choice: Lakini wewe unapowapa
  rationale: Muundo huu unaonyesha tofauti na maelekezo yaliyotangulia. Kiswahili cha kawaida hutumia “Lakini wewe unapo…”; pamoja na ἐλεημοσύνην, kitenzi ποιέω hapa kinahusu kutoa msaada.
- source_word: ἐλεημοσύνην
  choice: wenye uhitaji
  rationale: Neno hili humaanisha kutoa msaada wa huruma, hasa kwa maskini. “Kuwapa wenye uhitaji” ni lugha ya sasa na inayoeleweka, huku tanbihi ikihifadhi tafsiri ya karibu zaidi ya muundo wa Kigiriki.
- source_word: μὴ γνώτω
  choice: usijue
  rationale: Kauli ya kukataza katika nafsi ya tatu imetafsiriwa kwa muundo wa asili wa Kiswahili. Hii inadumisha uhuishaji wa mkono wa kushoto bila kuongeza wazo lisilokuwamo.
- source_word: ἡ ἀριστερά σου
  choice: mkono wako wa kushoto
  rationale: Tafsiri ya moja kwa moja inahifadhi taswira na mlingano wa usemi.
- source_word: τί ποιεῖ ἡ δεξιά σου
  choice: kile ambacho mkono wako wa kulia unafanya
  rationale: Muundo huu unaonyesha tendo linaloendelea na kudumisha ulinganifu wa mikono miwili.
theological_decisions:
- issue: Maana ya usemi kuhusu mkono wa kushoto na mkono wa kulia
  choice: Taswira imehifadhiwa kama msisitizo wenye nguvu wa kutoa bila kujionyesha.
  alternative: Kuufafanua tu kuwa amri ya unyenyekevu kwa ujumla, au kuwa katazo lisilo na tofauti dhidi ya kila utoaji unaoonekana hadharani.
  rationale: Kigiriki kinatumia uhuishaji na usemi uliotiwa chumvi kwa kusudi la kusisitiza. Kuhifadhi taswira huepuka kuamua kimya-kimya ikiwa mstari huu unakataza kila aina ya utoaji wa hadharani.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi, na inayoeleweka kwa wasomaji wa kawaida. Taswira ya mikono imehifadhiwa.
