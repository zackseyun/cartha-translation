  text: ζητεῖτε δὲ πρῶτον τὴν ⸀βασιλείαν καὶ τὴν δικαιοσύνην αὐτοῦ, καὶ ταῦτα πάντα προστεθήσεται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/033.yaml
  text: But seek first his kingdom and his righteousness[a], and all these things will be added to you.
translation:
  language: sw
  text: Lakini utafuteni kwanza ufalme wake na haki yake[a], na hayo yote mtaongezewa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “uadilifu wake.” Neno la Kigiriki linaweza kumaanisha kuwa sawa mbele za Mungu, mwenendo unaolingana na mapenzi yake, au kutenda kwa haki.
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητεῖτε
  choice: utafuteni
  rationale: Kitenzi cha kuamuru katika wakati wa sasa na wingi kinatoa mwito wa kuendelea kutafuta kwa bidii; “utafuteni” ni la kawaida na la moja kwa moja katika Kiswahili.
- source_word: δὲ
  choice: Lakini
  rationale: Kiunganishi hiki kinaonyesha utofauti na kuhangaikia mahitaji ya maisha kulikokatazwa katika muktadha uliotangulia.
- source_word: πρῶτον
  choice: kwanza
  rationale: Kinahifadhi maana ya kutanguliza jambo hili bila kuongeza ufafanuzi usio katika maandishi.
- source_word: βασιλείαν
  choice: ufalme
  rationale: “Ufalme” ni tafsiri iliyozoeleka na inaweza kujumuisha utawala wa kifalme wa Mungu pamoja na eneo au mpangilio unaotawaliwa naye.
- source_word: δικαιοσύνην
  choice: haki
  rationale: Katika Kiswahili, “haki” inaweza kubeba maana pana ya kuwa sawa mbele za Mungu, kuishi sawasawa na mapenzi yake, na kutenda kwa uadilifu; hivyo haifungwi tu katika maana ya kimahakama au kijamii.
- source_word: αὐτοῦ
  choice: wake
  rationale: Kiwakilishi kinahifadhiwa kama kilivyo katika Kigiriki; muktadha unaonyesha kuwa kinamrejelea Mungu/Baba.
- source_word: ταῦτα πάντα
  choice: hayo yote
  rationale: Usemi huu unarejelea chakula, kinywaji, na mavazi yaliyotajwa katika muktadha wa karibu.
- source_word: προστεθήσεται
  choice: mtaongezewa
  rationale: Kauli ya kutendwa ya wakati ujao inahifadhiwa, pamoja na wazo kwamba mahitaji hayo yataongezwa juu ya jambo kuu linalotafutwa.
- source_word: ὑμῖν
  choice: m-...-wa
  rationale: Yambwa ya nafsi ya pili wingi imejumuishwa kiasili katika muundo wa kitenzi “mtaongezewa.”
theological_decisions:
- issue: Maana ya δικαιοσύνη
  choice: haki
  alternative: uadilifu
  rationale: “Haki” ndiyo istilahi pana na iliyozoeleka katika lugha ya Biblia ya Kiswahili, ikiruhusu maana za uhusiano ulio sawa na Mungu, mwenendo unaolingana na mapenzi yake, na haki kwa wengine. “Uadilifu” ni mbadala unaoweza kusisitiza tabia nyofu lakini unaweza kupunguza upana wa neno la Kigiriki.
- issue: Mrejelewa wa αὐτοῦ
  choice: wake
  alternative: wa Mungu
  rationale: Kuhifadhi kiwakilishi kunafuata muundo wa Kigiriki na hakuhitaji kutaja mrejelewa waziwazi, kwa kuwa muktadha tayari unamtambulisha kuwa Mungu/Baba.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo wa mstari umewekwa karibu na Kigiriki huku ukisomeka kiasili; “mtaongezewa” huepuka kuongeza mtendaji ambaye hajasemwa wazi katika kauli ya Kigiriki.
