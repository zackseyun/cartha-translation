  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Οὐδεὶς δύναται δυσὶ κυρίοις δουλεύειν· ἢ γὰρ τὸν ἕνα μισήσει καὶ τὸν ἕτερον ἀγαπήσει, ἢ ἑνὸς ἀνθέξεται καὶ τοῦ ἑτέρου καταφρονήσει. οὐ δύνασθε θεῷ δουλεύειν καὶ μαμωνᾷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/024.yaml
  text: No one is able to serve two masters[a], for either he will hate the one and love the other, or he will be devoted to one and despise the other. You are not able to serve God and mammon.
translation:
  language: sw
  text: Hakuna mtu awezaye kutumikia mabwana wawili; kwa maana ama atamchukia mmoja na kumpenda mwingine, ama atashikamana na mmoja na kumdharau mwingine. Hamwezi kumtumikia Mungu na Mamona.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mali” au “fedha.” Kigiriki kimetumia neno la mkopo “Mamona,” ambalo hapa linaweza kuwasilisha utajiri kama bwana anayeshindana na Mungu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐδεὶς
  choice: Hakuna mtu
  rationale: Hutoa ukanushi wa jumla kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: δύναται / δύνασθε
  choice: awezaye / Hamwezi
  rationale: Huhifadhi msisitizo wa uwezo au kutoweza katika mwanzo na mwisho wa msemo.
- source_word: δυσὶ κυρίοις
  choice: mabwana wawili
  rationale: Katika taswira ya utumwa na utumishi, κύριοι humaanisha wenye mamlaka juu ya watumishi; “mabwana” ni ya asili zaidi hapa kuliko cheo cha kimungu “Bwana.”
- source_word: δουλεύειν
  choice: kuwatumikia / kumtumikia
  rationale: Kitenzi kina wazo la kutumika chini ya bwana; “kutumikia” kinaeleweka kwa urahisi huku “mabwana” ikihifadhi uhusiano wa mamlaka.
- source_word: μισήσει
  choice: atamchukia
  rationale: Huhifadhi nguvu ya kitenzi na ulinganifu wake wa moja kwa moja na “kumpenda.”
- source_word: ἀγαπήσει
  choice: kumpenda
  rationale: Ni tafsiri ya kawaida na wazi ya ἀγαπάω katika upinzani huu.
- source_word: ἑνὸς ἀνθέξεται
  choice: atashikamana na mmoja
  rationale: Huwasilisha maana ya kumng’ang’ania mmoja kwa uthabiti au kuwa mwaminifu kwake bila kufafanua kupita chanzo.
- source_word: καταφρονήσει
  choice: kumdharau
  rationale: Hutoa maana ya kumwona mwingine kuwa hafai au wa chini na huhifadhi nguvu ya upinzani.
- source_word: θεῷ
  choice: Mungu
  rationale: Ni tafsiri ya kawaida ya θεός kama mhusika anayepokea utumishi.
- source_word: μαμωνᾷ
  choice: Mamona
  rationale: Huhifadhi neno la mkopo na nguvu yake ya kimtindo kama bwana anayeshindana na Mungu; maana ya mali au fedha inaelezwa katika tanbihi.
theological_decisions:
- issue: Maana ya κύριος katika muktadha usio cheo cha kimungu
  choice: mabwana
  alternative: Mabwana Wakuu
  rationale: Wingi pamoja na kitenzi cha kutumikia unaonyesha uhusiano wa bwana na mtumishi, si matumizi ya cheo cha kimungu.
- issue: Uwasilishaji wa μαμωνᾶς
  choice: Mamona
  alternative: mali au fedha
  rationale: Kulihifadhi neno la mkopo kunadumisha mvutano wa msemo unaoweka Mungu na Mamona kama mabwana washindani; maana zake za kawaida zimehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo “awezaye” unadumisha uzito wa msemo bila kuwa wa kizamani kupita kiasi. Alama ya tanbihi imewekwa baada ya “Mamona,” neno linaloelezwa.
