  text: μὴ οὖν ὁμοιωθῆτε αὐτοῖς, οἶδεν γὰρ ⸀ὁ πατὴρ ὑμῶν ὧν χρείαν ἔχετε πρὸ τοῦ ὑμᾶς αἰτῆσαι αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/008.yaml
  text: Therefore[a], do not become like them, for your Father knows what you need before you ask him.
translation:
  language: sw
  text: Kwa hiyo, msiwe kama wao[a], kwa maana Baba yenu anajua mnachohitaji kabla hamjamwomba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, «msifanane nao»; kwa kufuata umbo la maneno kwa karibu zaidi, «msifanywe kama wao».
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ οὖν
  choice: Kwa hiyo, msiwe
  rationale: «Kwa hiyo» linaendeleza hitimisho linalotokana na onyo lililotangulia, huku «msiwe» likitoa katazo la moja kwa moja na la kawaida katika Kiswahili.
- source_word: ὁμοιωθῆτε
  choice: msiwe kama
  rationale: Ingawa umbo la Kigiriki ni aoristi tendwa tegemezi, «msiwe kama» ni Kiswahili cha kawaida kinachoeleza kwa usahihi katazo la kufuata mfano wao bila kuwa kigumu.
- source_word: αὐτοῖς
  choice: wao
  rationale: Kiwakilishi hiki kinawarejelea watu wa mataifa waliotajwa katika muktadha uliotangulia; hakuna haja ya kuongeza jina lao hapa.
- source_word: οἶδεν
  choice: anajua
  rationale: οἶδα lina umbo la wakati timilifu lakini hapa lina maana ya wakati wa sasa, yaani «anajua».
- source_word: ὁ πατὴρ ὑμῶν
  choice: Baba yenu
  rationale: Tafsiri inadumisha maneno ya Kigiriki bila kuongeza «wa mbinguni», ambayo hayapo katika mstari huu.
- source_word: ὧν χρείαν ἔχετε
  choice: mnachohitaji
  rationale: Hii ni njia fupi, wazi na ya asili ya kueleza vitu ambavyo wasikilizaji wana uhitaji navyo.
- source_word: πρὸ τοῦ ὑμᾶς αἰτῆσαι αὐτόν
  choice: kabla hamjamwomba
  rationale: «Kabla hamjamwomba» linaonyesha kwa kawaida kwamba Baba anajua mahitaji yao kabla ya tendo lao la kumwomba.
theological_decisions:
- issue: Ujuzi wa Mungu kabla ya sala
  choice: Kauli imetafsiriwa moja kwa moja kuwa Baba anajua mahitaji yao kabla hawajamwomba.
  alternative: Kufafanua kwa nyongeza kwamba sala ni kwa ajili ya uhusiano, si kumpa Mungu habari, au kutumia maneno ya kimafundisho kuhusu upeo wa ujuzi wake.
  rationale: Mstari unathibitisha ujuzi wa Baba wa awali bila kueleza kwa nini waamini bado wanapaswa kusali. Tafsiri inadumisha mvutano huo wa kiteolojia bila kuutatua kwa maelezo yasiyomo katika maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi na chenye hadhi. «Kwa hiyo» linaweka wazi uhusiano wa kimantiki na mstari uliotangulia; «Baba yenu» linadumisha urahisi na ukaribu wa usemi wa asili.
