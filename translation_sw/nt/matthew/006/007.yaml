  text: Προσευχόμενοι δὲ μὴ βατταλογήσητε ὥσπερ οἱ ἐθνικοί, δοκοῦσιν γὰρ ὅτι ἐν τῇ πολυλογίᾳ αὐτῶν εἰσακουσθήσονται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/007.yaml
  text: And when you pray[a], do not heap up empty words like the Gentiles[b], for they think that they will be heard because of their many words.
translation:
  language: sw
  text: Na mnaposali, msirundike maneno matupu kama watu wa mataifa[a], kwa maana wanadhani kwamba watasikilizwa kwa sababu ya maneno yao mengi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kama wapagani.” Kigiriki kinarejelea watu wa mataifa, yaani wasio Wayahudi na walio nje ya watu wa agano.
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσευχόμενοι δὲ
  choice: Nanyi mnaposali
  rationale: Kirai kishirikishi kinatanguliza hali ya amri kwa Kiswahili cha kawaida; “nanyi” linaendeleza mafundisho yaliyotangulia bila kusisitiza utofauti usiokuwapo.
- source_word: μὴ βατταλογήσητε
  choice: msirundike maneno matupu
  rationale: Kitenzi hiki adimu kinaelekea kukemea usemi mwingi usio na maana au wa kimazoea, si kila kurudia maneno kwa unyofu. Tafsiri hii inabeba wazo la wingi na utupu wa maneno.
- source_word: ὥσπερ οἱ ἐθνικοί
  choice: kama watu wa mataifa
  rationale: Katika muktadha huu, οἱ ἐθνικοί ni watu wa mataifa yaliyo nje ya watu wa agano. Usemi huu ni wazi na huepuka kufanya tafsiri ya kidini iliyo finyu zaidi kama “wapagani.”
- source_word: δοκοῦσιν
  choice: wao hudhani
  rationale: Neno hili linaonyesha dhana au imani yao kuhusu namna sala inavyosikilizwa.
- source_word: ἐν τῇ πολυλογίᾳ αὐτῶν
  choice: kwa sababu ya maneno yao mengi
  rationale: Kirai kinaonyesha msingi wanaoudhania kuwa sababu ya kusikilizwa, yaani wingi wa maneno yao.
- source_word: εἰσακουσθήσονται
  choice: watasikilizwa
  rationale: Kauli tendwa huhifadhi maana ya kusikiwa au kupewa usikivu bila kuingiza dhana yenye nguvu zaidi ya kwamba sala zao lazima zitajibiwa.
theological_decisions:
- issue: Ikiwa Yesu anakataza kurudia maneno yote katika sala au usemi mwingi ulio mtupu
  choice: msirundike maneno matupu
  alternative: msipayuke; msirudie-rudie maneno yasiyo na maana
  rationale: Chaguo hili linahifadhi upana wa kitenzi adimu huku likiepuka kudokeza kwamba kila sala inayorudiwa kwa unyofu imekatazwa. Lawama inalenga maneno matupu na mengi yanayotumiwa kana kwamba ndiyo yanayolazimisha kusikilizwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Msirundike maneno matupu” ni tamathali inayoeleweka inayohifadhi wazo la usemi mwingi usio na maana. Alama ya tanbihi [a] imewekwa mara moja katika matini kuu.
