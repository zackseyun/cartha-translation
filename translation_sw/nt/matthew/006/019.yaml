  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Μὴ θησαυρίζετε ὑμῖν θησαυροὺς ἐπὶ τῆς γῆς, ὅπου σὴς καὶ βρῶσις ἀφανίζει, καὶ ὅπου κλέπται διορύσσουσιν καὶ κλέπτουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/019.yaml
  text: Do not store up for yourselves treasures on earth[a], where moth and decay destroy[b], and where thieves break in and steal.
translation:
  language: sw
  text: Msijiwekee hazina duniani, ambako nondo na uozo[a] huharibu, na ambako wezi huvunja[b] na kuiba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kutu”; neno la Kigiriki linaweza kumaanisha kwa upana zaidi uharibifu unaokula au kuteketeza kitu, si kutu ya metali pekee.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “huchimba au kupenya kupitia”; huenda ikirejelea wezi waliopenya kwa kuchimba au kuvunja kuta za matofali ya udongo.
    reason: cultural_note
lexical_decisions:
- source_word: Μὴ θησαυρίζετε
  choice: Msijiwekee
  rationale: Kitenzi cha kukataza katika wingi kinaeleza kutokusanya au kutunza mali kwa faida yenu wenyewe; kiambishi -ji- kinajumuisha maana ya ὑμῖν kwa Kiswahili cha kawaida.
- source_word: ὑμῖν
  choice: -ji- katika “Msijiwekee”
  rationale: Hapa kiwakilishi kina maana ya kujirejelea, yaani kujiwekea wenyewe; muundo huu ni wa asili na huepuka kurudia “kwa ajili yenu wenyewe.”
- source_word: θησαυροὺς
  choice: hazina
  rationale: “Hazina” huhifadhi maana pana ya vitu vyenye thamani, si fedha peke yake, na ina uhusiano wa wazi na wazo la kujiwekea.
- source_word: ἐπὶ τῆς γῆς
  choice: duniani
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha mahali na kudumisha utofautishaji na mbinguni katika mstari unaofuata.
- source_word: σὴς
  choice: nondo
  rationale: Nondo huharibu nguo na vitu vingine vilivyohifadhiwa; hili ndilo neno la kawaida na sahihi katika Kiswahili.
- source_word: βρῶσις
  choice: kuoza
  rationale: Neno la Kigiriki lina wazo pana la kuliwa, kuharibika au kuteketea. “Kuoza” linaonyesha kuharibika polepole bila kuifanya maana ihusu kutu ya metali pekee.
- source_word: ἀφανίζει
  choice: huharibu
  rationale: Kitenzi kina maana ya kusababisha kitu kitoweke au kiharibike; “huharibu” kinaeleweka kwa urahisi pamoja na nondo na kuoza.
- source_word: κλέπται
  choice: wezi
  rationale: Hili ni neno la kawaida na la moja kwa moja kwa watu wanaoiba.
- source_word: διορύσσουσιν
  choice: hubomoa
  rationale: Kihalisi ni kuchimba kupitia kitu, labda ukuta wa nyumba. “Hubomoa” kinaonyesha kwa ufupi kuvunja kizuizi ili kuingia, huku maelezo ya kihalisi yakihifadhiwa katika tanbihi.
- source_word: κλέπτουσιν
  choice: kuiba
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja ya kitenzi cha wizi.
theological_decisions:
- issue: Upeo wa γῆ na utofautishaji na mbingu
  choice: duniani
  alternative: juu ya dunia
  rationale: “Duniani” ni ya asili katika Kiswahili na huhifadhi eneo la kidunia linalotofautishwa na mbinguni bila kuongeza tofauti ya kiteolojia isiyosemwa na maandishi.
- issue: Maana ya βρῶσις
  choice: kuoza
  alternative: kutu
  rationale: “Kutu” ni tafsiri ya kimapokeo inayowezekana, lakini hufanya maana ionekane kuwa ya metali pekee. “Kuoza” huhifadhi wazo pana la kuharibika au kuteketea, na uwezekano wa “kutu” umeonyeshwa katika tanbihi.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. “Msijiwekee” huunganisha kwa asili tendo la kuhifadhi na maana ya kujinufaisha. Tanbihi zimewekwa baada ya maneno yanayohusika moja kwa moja: [a] baada ya “kuoza” na [b] baada ya “hubomoa”.'
