base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/010.yaml
  text: May your kingdom come; may your will be done[a], as in heaven, so also on earth.
translation:
  language: sw
  text: Ufalme wako uje; mapenzi yako yatimizwe[a], kama mbinguni, vivyo hivyo duniani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, yawezekana: “Ufalme wako uje; mapenzi yako yatimizwe, kama mbinguni, vivyo hivyo duniani,” huku maneno “kama mbinguni, vivyo hivyo duniani” yakieleweka kuwa yanahusu maombi yote mawili.'
    reason: Usomaji mbadala kuhusu wigo wa kirai cha ulinganisho.
lexical_decisions:
- source_word: ἐλθέτω
  choice: na uje
  rationale: Ni kauli ya ombi katika nafsi ya tatu. Muundo “na uje” unaonyesha ombi linaloelekezwa kwa Mungu kwa Kiswahili cha kawaida cha sala, bila kuifanya kuwa amri kali.
- source_word: βασιλεία
  choice: ufalme
  rationale: Neno linaweza kumaanisha ufalme au utawala wa kifalme. “Ufalme” ni neno la kawaida na linalofaa katika muktadha wa Mathayo, huku likidokeza pia kutawala kwa Mungu.
- source_word: γενηθήτω
  choice: na yatimizwe
  rationale: Ni kauli tendwa ya ombi. Ikiwa pamoja na “mapenzi,” “yatimizwe” huonyesha kwa kawaida kwamba yanayokusudiwa na Mungu yafanyike, bila kulazimisha maana finyu ya kutenda tu.
- source_word: θέλημα
  choice: mapenzi
  rationale: “Mapenzi” huonyesha kile ambacho Mungu anakitaka au anakusudia, na ni neno la asili katika Kiswahili cha sala.
- source_word: ὡς
  choice: kama
  rationale: “Kama” huanzisha ulinganisho kwa ufupi na kwa kawaida, sawa na kazi ya neno la Kigiriki.
- source_word: ἐν οὐρανῷ
  choice: mbinguni
  rationale: “Mbinguni” ni namna ya kawaida ya kutaja eneo la mbinguni katika ulinganisho huu.
- source_word: ἐπὶ γῆς
  choice: duniani
  rationale: “Duniani” ni Kiswahili cha kawaida kinacholingana na tofauti ya mbingu na dunia iliyopo katika kifungu.
- source_word: καὶ
  choice: vivyo hivyo
  rationale: Katika muundo huu wa ulinganisho, neno hilo hukamilisha maana ya “kama ... vivyo hivyo ...”; tafsiri hii huweka uhusiano huo wazi bila kuongeza wazo jipya.
theological_decisions:
- issue: Wigo wa kirai ὡς ἐν οὐρανῷ καὶ ἐπὶ γῆς
  choice: Katika matini kuu, “kama mbinguni, vivyo hivyo duniani” kimeunganishwa moja kwa moja na ombi la pili, “mapenzi yako na yatimizwe.”
  alternative: 'Kirai hicho kinaweza kueleweka kuwa kinahusu maombi yote mawili: kuja kwa ufalme na kutimizwa kwa mapenzi ya Mungu.'
  rationale: Uhusiano wa karibu zaidi wa kisarufi ni pamoja na ombi la pili, lakini alama za uakifishaji katika matoleo ya Kigiriki ni za wahariri na sintaksia hairuhusu kufunga kabisa uwezekano mpana. Tanbihi inalinda utata huo wa kweli.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya sala. Muundo “na uje / na yatimizwe” unaweka wazi nguvu ya ombi la nafsi ya tatu. Mpangilio wa chanzo—mbinguni kisha duniani—umehifadhiwa, na tanbihi imewekwa kwenye ombi la pili kama katika safu ya ushauri ya Kiingereza.
