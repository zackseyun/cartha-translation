  text: καὶ περὶ ἐνδύματος τί μεριμνᾶτε; καταμάθετε τὰ κρίνα τοῦ ἀγροῦ πῶς ⸂αὐξάνουσιν· οὐ κοπιῶσιν οὐδὲ νήθουσιν⸃·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/028.yaml
  text: 'And why are you anxious about clothing? Consider the lilies of the field[a], how they grow: they do not labor[c][b], nor do they spin.'
translation:
  language: sw
  text: 'Na kwa nini mnahangaikia mavazi? Yatazameni kwa makini[b] mayungiyungi ya shambani[c], jinsi yanavyokua: hayafanyi kazi kwa taabu, wala hayasokoti.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Au “Jifunzeni kutokana na” au “Yachunguzeni.”
    reason: lexical_alternative
  - marker: c
    text: Baadhi huelewa “mayungiyungi” hapa kwa maana pana zaidi ya “maua ya porini.”
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ ἐνδύματος
  choice: mavazi
  rationale: Ingawa ἔνδυμα iko katika umoja, hapa inataja mavazi kwa ujumla kama mahitaji ya maisha; “mavazi” ni ya kawaida na ya asili katika Kiswahili.
- source_word: τί μεριμνᾶτε
  choice: kwa nini mnahangaikia
  rationale: μεριμνάω hapa ni kuwa na wasiwasi au mahangaiko kuhusu mahitaji ya kimwili. “Mnahangaikia” huhifadhi uzito wa wasiwasi na swali la sababu linaloonyeshwa na τί.
- source_word: καταμάθετε
  choice: yatazameni kwa makini
  rationale: Kitenzi hiki cha amri kinadai uchunguzi wenye uangalifu unaoleta ufahamu. Kauli hii ni wazi na ya kawaida katika Kiswahili.
- source_word: τὰ κρίνα τοῦ ἀγροῦ
  choice: mayungiyungi ya shambani
  rationale: κρίνα kimsingi ni maua aina ya yungiyungi, huku τοῦ ἀγροῦ ikionyesha yanayoota mashambani au maeneo ya wazi. Tafsiri pana zaidi “maua ya porini” imehifadhiwa katika tanbihi.
- source_word: πῶς αὐξάνουσιν
  choice: jinsi yanavyokua
  rationale: αὐξάνω hapa hueleza ukuaji wa kawaida wa mimea; “yanavyokua” ni sahihi na ya asili.
- source_word: οὐ κοπιῶσιν
  choice: hayafanyi kazi kwa taabu
  rationale: κοπιάω humaanisha kufanya kazi kwa bidii au kwa taabu. Kauli hii hudhihirisha maana hiyo kuliko “hayafanyi kazi” peke yake.
- source_word: οὐδὲ νήθουσιν
  choice: wala hayasokoti
  rationale: νήθω ni kusokota uzi. “Hayasokoti” ni fupi, sahihi, na huhifadhi usambamba wa sentensi ya Kigiriki.
theological_decisions:
- issue: Maana ya μεριμνάω katika mafundisho ya Yesu kuhusu mahitaji ya maisha
  choice: mnahangaikia
  alternative: mna wasiwasi kuhusu
  rationale: “Mnahangaikia” hueleza wasiwasi unaomsumbua mtu bila kugeuza mstari kuwa katazo la kila aina ya kufikiri au kupanga kuhusu mavazi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye heshima lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa swali na usambamba wa vitenzi umehifadhiwa. Alama za tanbihi [b] na [c] zimewekwa moja kwa moja baada ya maneno yanayohusika.
