  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: μὴ οὖν μεριμνήσητε εἰς τὴν αὔριον, ἡ γὰρ αὔριον μεριμνήσει ⸀αὑτῆς· ἀρκετὸν τῇ ἡμέρᾳ ἡ κακία αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/034.yaml
  text: Therefore do not worry about tomorrow[a], for tomorrow will worry about itself. Each day has enough trouble of its own.
translation:
  language: sw
  text: Kwa hiyo, msihangaike kuhusu kesho, kwa maana kesho itajihangaikia yenyewe. Kila siku ina taabu zake za kutosha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kila siku ina uovu wake wa kutosha.” Neno la Kigiriki linaweza kumaanisha “uovu,” lakini hapa yaelekea linarejelea taabu au shida ya siku hiyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: μεριμνήσητε
  choice: msiwe na wasiwasi
  rationale: Katika muktadha wa Mathayo 6:25–34, kitenzi hiki kinamaanisha kuwa na mahangaiko au wasiwasi. Kauli hii ni ya kawaida, wazi, na yenye hadhi katika Kiswahili cha Afrika Mashariki.
- source_word: εἰς τὴν αὔριον
  choice: kuhusu kesho
  rationale: Kirai hiki kinaonyesha jambo ambalo wasiwasi unaelekezwa kwalo; ‘kuhusu kesho’ huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: ἡ αὔριον
  choice: kesho
  rationale: Neno ‘kesho’ limefanywa kana kwamba ni mhusika katika sentensi, kama ilivyo katika Kigiriki.
- source_word: μεριμνήσει αὑτῆς
  choice: itajisumbukia yenyewe
  rationale: Huhifadhi uhusishaji wa kesho na tendo la kujishughulisha na yenyewe, huku ikitoa Kiswahili cha asili. ‘Itakuwa na wasiwasi juu yake yenyewe’ kingekuwa kizito na kisicho cha kawaida.
- source_word: ἀρκετὸν τῇ ἡμέρᾳ
  choice: Kila siku ina ... za kutosha
  rationale: Muundo huu wa Kiswahili huwasilisha wazo la kwamba kila siku ina kiwango cha kutosha cha mzigo wake, na unaonyesha vizuri maana ya mgawanyo kwa kila siku.
- source_word: ἡ κακία αὐτῆς
  choice: taabu zake
  rationale: Katika muktadha wa mahangaiko ya kila siku, κακία inaelekea kumaanisha taabu, shida, au dhiki kuliko uovu wa kimaadili. ‘Zake’ huonyesha kuwa taabu hizo ni za siku hiyo yenyewe.
theological_decisions:
- issue: Maana ya κακία katika kauli kuhusu wasiwasi
  choice: taabu
  alternative: uovu
  rationale: Muktadha unazungumzia mzigo na mahangaiko ya siku, hivyo ‘taabu’ huwasilisha maana inayokusudiwa bila kuifunga kauli katika dhana ya uovu wa kimaadili. Hata hivyo, maana halisi ya ‘uovu’ inatajwa katika tanbihi ili kuhifadhi upana wa neno la Kigiriki.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Msiwe na wasiwasi’ ni wazi kwa wasomaji wa kawaida; ‘kesho itajisumbukia yenyewe’ huhifadhi tashihisi ya Kigiriki kwa lugha ya asili. Alama ya tanbihi imewekwa baada ya sentensi inayohusiana moja kwa moja na κακία.
