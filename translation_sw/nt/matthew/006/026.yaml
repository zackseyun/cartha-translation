  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐμβλέψατε εἰς τὰ πετεινὰ τοῦ οὐρανοῦ ὅτι οὐ σπείρουσιν οὐδὲ θερίζουσιν οὐδὲ συνάγουσιν εἰς ἀποθήκας, καὶ ὁ πατὴρ ὑμῶν ὁ οὐράνιος τρέφει αὐτά· οὐχ ὑμεῖς μᾶλλον διαφέρετε αὐτῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/026.yaml
  text: Look at the birds of the sky[a], that they do not sow or reap or gather into barns, and your heavenly Father feeds them[b]. Are you not of much more value than they are?
translation:
  language: sw
  text: Waangalieni ndege wa angani:[a] hawapandi mbegu, wala hawavuni, wala hawakusanyi katika maghala; lakini Baba yenu wa mbinguni huwalisha. Je, ninyi si wa thamani kubwa zaidi kuliko wao?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ndege wa mbinguni”; kwa mapokeo, “ndege wa hewani.”
    reason: lexical_alternative
  - marker: b
    text: Au “Je, ninyi si wa thamani zaidi kuliko wao?”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμβλέψατε
  choice: Waangalieni
  rationale: Amri hii inaelekeza wasikilizaji kuwatazama ndege kwa makini; “waangalieni” ni ya kawaida, wazi, na huhifadhi nguvu ya kauli ya kuamuru.
- source_word: πετεινὰ τοῦ οὐρανοῦ
  choice: ndege wa angani
  rationale: πετεινά ni ndege au viumbe warukao, na τοῦ οὐρανοῦ hapa huelekea kumaanisha anga linaloonekana. “Ndege wa angani” ni Kiswahili cha kawaida na cha heshima.
- source_word: ὅτι
  choice: ':'
  rationale: Katika muktadha huu ὅτι inatambulisha jambo la kuzingatiwa kuhusu ndege. Nukta mbili huleta uhusiano huo kwa Kiswahili cha asili bila kulazimisha maana ya kisababishi pekee.
- source_word: σπείρουσιν ... θερίζουσιν ... συνάγουσιν
  choice: hawapandi mbegu, wala hawavuni, wala hawakusanyi
  rationale: Maneno haya huhifadhi mlolongo wa shughuli za kilimo na urudiaji wa ukanushi katika Kigiriki.
- source_word: εἰς ἀποθήκας
  choice: mazao ghalani
  rationale: ἀποθήκαι ni mahali pa kuhifadhia mazao. Kuongeza “mazao” huweka wazi kitu kinachokusanywa, ambacho kimeachwa kudokezwa katika Kigiriki, na “ghalani” ni sawa ya kawaida katika mazingira ya kilimo.
- source_word: ὁ πατὴρ ὑμῶν ὁ οὐράνιος
  choice: Baba yenu wa mbinguni
  rationale: Huhifadhi uhusiano wa “Baba” na sifa ya kuwa wa mbinguni kwa muundo wa kawaida wa Kiswahili.
- source_word: τρέφει
  choice: huwalisha
  rationale: Kitenzi hiki hapa humaanisha kuwapa chakula; “huwalisha” ni sawa ya moja kwa moja na ya asili.
- source_word: οὐχ ὑμεῖς μᾶλλον διαφέρετε αὐτῶν;
  choice: Je, ninyi si wa thamani kubwa zaidi kuliko wao?
  rationale: Swali linatarajia jibu la ndiyo na linaonyesha kwamba wasikilizaji wana thamani inayowazidi ndege. “Thamani kubwa zaidi” huhifadhi nguvu ya ulinganisho bila kueleza sababu ya thamani hiyo.
theological_decisions:
- issue: Thamani ya wanadamu ikilinganishwa na ndege katika hoja ya Yesu
  choice: Aya inasema kwamba wasikilizaji wa Yesu wana thamani kubwa zaidi kuliko ndege, bila kutaja msingi wa kiteolojia wa tofauti hiyo.
  alternative: Kueleza kwamba thamani hiyo inatokana hasa na wanadamu kuumbwa kwa mfano wa Mungu au na uhusiano wa agano.
  rationale: Maandishi yanathibitisha ulinganisho wa thamani lakini hayatoi sababu yake katika aya hii; tafsiri haipaswi kuingiza ufafanuzi wa kimafundisho ambao haujasemwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Mfuatano wa sentensi umewekwa wa kawaida kwa Kiswahili huku picha ya kilimo na swali la balagha vikihifadhiwa.
