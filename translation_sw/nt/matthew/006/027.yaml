  text: τίς δὲ ἐξ ὑμῶν μεριμνῶν δύναται προσθεῖναι ἐπὶ τὴν ἡλικίαν αὐτοῦ πῆχυν ἕνα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/027.yaml
  text: And which of you[a], by being anxious, can add one cubit to his stature?
translation:
  language: sw
  text: Ni nani kati yenu ambaye, kwa kuwa na wasiwasi, anaweza kuongeza dhiraa moja katika muda wa maisha yake?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuongeza dhiraa moja katika kimo chake.” Neno la Kigiriki linaweza kumaanisha ‘umri/kipindi cha maisha’ au ‘kimo.’
    reason: alternative_reading
lexical_decisions:
- source_word: τίς δὲ ἐξ ὑμῶν
  choice: Ni nani kati yenu
  rationale: Hii ndiyo njia ya kawaida na ya asili ya Kiswahili ya kuuliza ‘nani miongoni mwenu.’ δέ ni kiunganishi chepesi katika muktadha huu, hivyo si lazima kutafsiriwa kwa ‘lakini.’
- source_word: μεριμνῶν
  choice: kwa kuwa na wasiwasi
  rationale: Kitenzi μεριμνάω hapa kinamaanisha kuwa na wasiwasi au kuhangaika. Muundo ‘kwa kuwa na wasiwasi’ unaonyesha kwamba wasiwasi ndio njia inayodhaniwa ya kufanikisha jambo hilo.
- source_word: δύναται προσθεῖναι
  choice: anaweza kuongeza
  rationale: Tafsiri hii inaonyesha uwezo unaoulizwa na inadumisha picha halisi ya kuongeza kitu.
- source_word: ἐπὶ τὴν ἡλικίαν αὐτοῦ
  choice: kwenye urefu wa maisha yake
  rationale: ἡλικία inaweza kumaanisha umri au muda wa maisha, na pia kimo. ‘Urefu wa maisha yake’ inafaa katika hoja kuhusu wasiwasi na maisha huku ikidumisha picha ya maisha kama kitu kinachoweza kupimwa kwa urefu.
- source_word: πῆχυν ἕνα
  choice: dhiraa moja
  rationale: πῆχυς ni kipimo cha urefu kinachoitwa dhiraa. Kudumisha kipimo hicho kunahifadhi picha halisi na mvutano wa usemi wa Kigiriki badala ya kuubadili kuwa maelezo ya jumla.
- source_word: αὐτοῦ
  choice: yake
  rationale: Kiwakilishi hiki kinamrejelea kila mtu anayehusishwa na swali. Kiswahili ‘yake’ ni cha kawaida na hakilazimishi jinsia ya mhusika.
theological_decisions:
- issue: Maana ya ἡλικία katika usemi huu
  choice: urefu wa maisha
  alternative: kimo
  rationale: Maana ya muda au urefu wa maisha inalingana vizuri na hoja pana kuhusu uhai na kutoweza kwa wasiwasi kuuongeza. Hata hivyo, maana ya ‘kimo’ inawezekana kisarufi na kileksika, hasa kwa sababu dhiraa ni kipimo cha urefu; kwa hiyo imehifadhiwa katika tanbihi badala ya kuondolewa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. ‘Dhiraa’ inadumishwa kama kipimo cha kale kwa sababu ni muhimu kwa picha ya mstari; utata wa ‘urefu wa maisha’ na ‘kimo’ umehifadhiwa kwa tanbihi.
