  text: σὺ δὲ νηστεύων ἄλειψαί σου τὴν κεφαλὴν καὶ τὸ πρόσωπόν σου νίψαι,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/017.yaml
  text: But you[a], when you fast, anoint your head and wash your face[b],
translation:
  language: sw
  text: Lakini wewe, unapofunga, jipake mafuta kichwani[a] na unawe uso wako[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “paka mafuta kichwani.” Kitenzi cha Kigiriki kinaweza kumaanisha kupaka mafuta kama sehemu ya kujitunza kwa kawaida.
    reason: lexical_alternative
  - marker: b
    text: Yaani, dumisha mwonekano wako wa kawaida badala ya kuwafanya wengine waone wazi kwamba unafunga.
    reason: cultural_note
lexical_decisions:
- source_word: σὺ δὲ
  choice: Lakini wewe
  rationale: Kiwakilishi kilichosisitizwa pamoja na δέ kinaonyesha tofauti ya moja kwa moja kati ya mwanafunzi na wanafiki waliotajwa kabla yake.
- source_word: νηστεύων
  choice: unapofunga
  rationale: Kirai hiki cha hali ya kuendelea kinafanya kazi ya wakati; ‘unapofunga’ ni Kiswahili cha kawaida na kinadumisha wazo la wakati mtu anapokuwa katika mfungo.
- source_word: ἄλειψαί σου τὴν κεφαλήν
  choice: jipake mafuta kichwani
  rationale: ἀλείφω hapa inaelekea kumaanisha kupaka mafuta kama sehemu ya kujitunza kwa kawaida. ‘Jipake mafuta kichwani’ ni ya asili katika Kiswahili na haidokezi kwa lazima tendo maalumu la kidini.
- source_word: καὶ
  choice: na
  rationale: Inaunganisha maagizo mawili kwa urahisi.
- source_word: τὸ πρόσωπόν σου νίψαι
  choice: unawe uso wako
  rationale: νίπτω humaanisha kuosha sehemu ya mwili; ‘unawe uso wako’ ni agizo la wazi na la kawaida katika muktadha huu.
theological_decisions:
- issue: Maana ya maagizo kuhusu mwonekano wakati wa kufunga
  choice: Yesu anamwagiza mwanafunzi ajitunze kwa kawaida wakati wa kufunga, badala ya kuonyesha mfungo wake kwa watu.
  alternative: Tendo la kidini la kujipaka mafuta linaagizwa, au kufunga hadharani kwenyewe kunakatazwa.
  rationale: Muktadha wa karibu unatofautisha kuharibu sura kwa makusudi na kudumisha mwonekano wa kawaida. Tafsiri haifanyi tendo hili kuwa ibada maalumu wala haisemi kwamba kila mfungo unaoonekana na wengine umekatazwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. ‘Lakini wewe’ huhifadhi msisitizo wa umoja na tofauti na wanafiki; ‘jipake mafuta kichwani’ huwasilisha desturi ya kujitunza bila kutumia neno linaloweza kusikika kuwa la kiibada pekee.
