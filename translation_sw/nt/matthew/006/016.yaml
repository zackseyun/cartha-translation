id: MAT.6.16
reference: Matthew 6:16
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ὅταν δὲ νηστεύητε, μὴ γίνεσθε ⸀ὡς οἱ ὑποκριταὶ σκυθρωποί, ἀφανίζουσιν γὰρ τὰ πρόσωπα αὐτῶν ὅπως φανῶσιν τοῖς ἀνθρώποις νηστεύοντες· ἀμὴν λέγω ⸀ὑμῖν, ἀπέχουσιν τὸν μισθὸν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/016.yaml
  text: And whenever you fast[a], do not become gloomy like the hypocrites, for they disfigure their faces so that they may appear to people to be fasting. Truly I say to you, they have received their reward in full.
translation:
  language: sw
  text: Na kila mnapofunga, msiwe wenye huzuni kama wanafiki, kwa maana wao huharibu nyuso zao ili watu waone kwamba wanafunga. Amin, nawaambia, wamekwisha kupokea thawabu yao yote.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὅταν δὲ νηστεύητε
  choice: Na kila mnapofunga
  rationale: “Kila mnapofunga” huonyesha tendo linalorudiwa au hali isiyo na wakati mmoja maalumu; “Na” huunganisha fundisho hili na mafundisho yaliyotangulia.
- source_word: μὴ γίνεσθε ... σκυθρωποί
  choice: msiwe na nyuso za huzuni
  rationale: Kiswahili hiki cha kawaida huwasilisha hali ya kujifanya mwenye huzuni inayoonekana usoni bila kudokeza huzuni ya ndani pekee.
- source_word: ὡς οἱ ὑποκριταί
  choice: kama wanafiki
  rationale: Ni ulinganisho wa moja kwa moja na neno la kawaida la Kiswahili kwa watu wanaoonyesha nje hali isiyolingana na ukweli wao.
- source_word: ἀφανίζουσιν ... τὰ πρόσωπα αὐτῶν
  choice: huharibu sura za nyuso zao
  rationale: Huhifadhi picha halisi ya kubadili au kuharibu mwonekano wa uso ili kufunga kwao kutambuliwe, bila kuamua hasa walitumia njia gani.
- source_word: ὅπως φανῶσιν τοῖς ἀνθρώποις νηστεύοντες
  choice: ili watu waone kwamba wanafunga
  rationale: Huwasilisha kusudi la tendo na maana ya jumla ya ἄνθρωποι kama watu; pia ni Kiswahili cha asili kuliko muundo wa moja kwa moja wa ‘waonekane kwa watu kuwa wanafunga.’
- source_word: ἀμὴν λέγω ὑμῖν
  choice: Amin, nawaambia
  rationale: Huhifadhi neno la mkazo ἀμήν na mfumo wa tamko lenye mamlaka unaotumiwa na Yesu.
- source_word: ἀπέχουσιν τὸν μισθὸν αὐτῶν
  choice: wamekwisha kupokea thawabu yao yote
  rationale: Huwasilisha nahau ya kibiashara ya kupokea malipo kikamilifu, ikiwa na maana kwamba hakuna madai mengine yaliyobaki.
theological_decisions:
- issue: Maana wakilishi ya τοῖς ἀνθρώποις
  choice: watu
  alternative: wanaume; wanadamu
  rationale: Katika muktadha huu ἄνθρωποι humaanisha watu kwa ujumla, si wanaume pekee; ‘watu’ ni sahihi na ya kawaida katika Kiswahili cha sasa.
- issue: Nguvu ya nahau ἀπέχουσιν τὸν μισθὸν αὐτῶν
  choice: wamekwisha kupokea thawabu yao yote
  alternative: wana thawabu yao; wamepokea thawabu yao
  rationale: Tafsiri iliyochaguliwa huhifadhi wazo la malipo kupokewa kikamilifu bila kuongeza maelezo ya kimadhehebu kuhusu namna ya thawabu ya Mungu.
- issue: Jinsi wanafiki walivyobadili nyuso zao
  choice: huharibu sura za nyuso zao
  alternative: huziacha nyuso zao bila kutunzwa; huzifanya nyuso zao zisivutie
  rationale: Kitenzi kinaweza kuhusisha kuharibu, kuficha, au kufanya mwonekano usitambulike. Tafsiri hii huhifadhi ukali na utata wa picha badala ya kubainisha mbinu ambayo andiko halitaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imetungwa kwa uwazi kwa msomaji wa kawaida, huku ‘Amin’ na taswira ya nyuso zikihifadhi uzito na ladha ya maandishi ya Kigiriki.
