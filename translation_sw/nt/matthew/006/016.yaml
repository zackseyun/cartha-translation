review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the iterative temporal clause, the comparison with hypocrites, their purpose of being seen by people as fasting, and the idiom of receiving a reward in full. However, “sura za nyuso zao” is redundant and unidiomatic in Swahili; πρόσωπα means “faces,” not “the appearance of their faces.”
  naturalness: Most of the rendering is clear Standard East African Swahili. “Waharibu nyuso zao” is more direct and natural than “huharibu sura za nyuso zao.” “Msiwe wenye huzuni” gives a natural equivalent for becoming/being gloomy without awkwardly duplicating the following reference to faces.
  terminology: “Wanafiki,” “kufunga,” “Amin, nawaambia,” and “thawabu” are appropriate formal biblical terms. “Watu” correctly represents τοῖς ἀνθρώποις in its general sense. No footnote is needed in Swahili, since this rendering has no unresolved lexical ambiguity requiring explanation.
  issues:
  - severity: medium
    issue: Redundant expression “huharibu sura za nyuso zao”
    rationale: The Greek has simply “they disfigure their faces” (τὰ πρόσωπα αὐτῶν). In Swahili, “sura za nyuso” is a pleonastic and unnatural construction; it may blur the concrete reference to their faces.
  - severity: low
    issue: “msiwe na nyuso za huzuni” is less direct
    rationale: Although understandable, the phrase shifts from the Greek adjective describing the persons’ gloomy demeanor to a possessive description of faces. “Msiwe wenye huzuni” is more idiomatic while the next clause retains the explicit reference to faces.
  revised_text: Na kila mnapofunga, msiwe wenye huzuni kama wanafiki, kwa maana wao huharibu nyuso zao ili watu waone kwamba wanafunga. Amin, nawaambia, wamekwisha kupokea thawabu yao yote.
  revised_footnotes: []
