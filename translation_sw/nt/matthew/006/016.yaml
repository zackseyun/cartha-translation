- from: Na kila mnapofunga, msiwe na nyuso za huzuni kama wanafiki, kwa maana wao huharibu sura za nyuso zao ili watu waone kwamba wanafunga. Amin, nawaambia, wamekwisha kupokea thawabu yao yote.
  to: Na kila mnapofunga, msiwe wenye huzuni kama wanafiki, kwa maana wao huharibu nyuso zao ili watu waone kwamba wanafunga. Amin, nawaambia, wamekwisha kupokea thawabu yao yote.
  rationale: The revision removes the redundant “sura za” and uses a more idiomatic expression for the gloomy demeanor prohibited in the first clause. It preserves the source’s purpose clause, the general sense of “people,” and the full-payment force of ἀπέχουσιν τὸν μισθὸν αὐτῶν.
