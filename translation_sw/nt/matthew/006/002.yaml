id: MAT.6.2
reference: Matthew 6:2
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ὅταν οὖν ποιῇς ἐλεημοσύνην, μὴ σαλπίσῃς ἔμπροσθέν σου, ὥσπερ οἱ ὑποκριταὶ ποιοῦσιν ἐν ταῖς συναγωγαῖς καὶ ἐν ταῖς ῥύμαις, ὅπως δοξασθῶσιν ὑπὸ τῶν ἀνθρώπων· ἀμὴν λέγω ὑμῖν, ἀπέχουσιν τὸν μισθὸν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/002.yaml
  text: Therefore[a], whenever you give alms, do not sound a trumpet before you, as the hypocrites do in the synagogues and in the streets, so that they may be glorified by people. Truly I say to you[e][d][c][b], they have received their reward in full.
translation:
  language: sw
  text: Kwa hiyo, kila unapotoa msaada kwa wahitaji[a], usipige tarumbeta mbele yako[b], kama wanafiki wanavyofanya katika masinagogi na mitaani, ili watukuzwe na watu[c]. Kweli nawaambia, wamekwisha kupokea thawabu yao yote[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “unapowapa wahitaji” au “unapofanya matendo ya rehema.” Kirai cha Kigiriki kinarejelea utoaji wa msaada wa hisani.
    reason: lexical_alternative
  - marker: b
    text: Au “usitangaze jambo hilo kwa tarumbeta.” Kigiriki kinasema kihalisi “usipige tarumbeta”; huenda huu ni usemi wa kutia chumvi au wa kisitiari.
    reason: lexical_alternative
  - marker: c
    text: Au “ili wasifiwe” au “waheshimiwe na watu.” Kitenzi cha Kigiriki kinasema kihalisi “watukuzwe.”
    reason: lexical_alternative
  - marker: d
    text: 'Maneno “wamekwisha kupokea thawabu yao yote” yanatokana na nahau ya kibiashara: tayari wamepokea kikamilifu thawabu watakayopata.'
    reason: cultural_note
lexical_decisions:
- source_word: Ὅταν οὖν
  choice: Kwa hiyo, kila unapotoa
  rationale: “Kwa hiyo” huhifadhi uhusiano wa οὖν na yaliyotangulia, na “kila unapo-” huonyesha hali ya jumla au inayoweza kurudiwa ya ὅταν pamoja na hali tegemezi.
- source_word: ποιῇς ἐλεημοσύνην
  choice: unapotoa msaada kwa wahitaji
  rationale: Kirai hiki humaanisha kutoa msaada wa hisani, hasa kwa maskini au wahitaji. Tafsiri hii ni ya kawaida na wazi zaidi kwa wasomaji wa Kiswahili cha sasa kuliko “kutoa sadaka” peke yake, ambalo linaweza kueleweka kwa upana zaidi.
- source_word: μὴ σαλπίσῃς ἔμπροσθέν σου
  choice: usipige tarumbeta mbele yako
  rationale: Huhifadhi picha halisi na yenye nguvu ya kupiga tarumbeta bila kuamua kimya kimya ikiwa ni sitiari, chuku, au tendo halisi.
- source_word: οἱ ὑποκριταὶ
  choice: wanafiki
  rationale: Ni neno sanifu na linaloeleweka kwa watu wanaoonyesha uchaji ili waonekane, bila kuingiza maelezo yasiyomo katika matini.
- source_word: ἐν ταῖς συναγωγαῖς καὶ ἐν ταῖς ῥύμαις
  choice: katika masinagogi na mitaani
  rationale: “Masinagogi” hutaja kwa usahihi mahali pa mikutano ya Kiyahudi; “mitaani” ni Kiswahili cha kawaida kwa maeneo ya wazi ya umma yanayokusudiwa hapa.
- source_word: ὅπως δοξασθῶσιν ὑπὸ τῶν ἀνθρώπων
  choice: ili watukuzwe na watu
  rationale: “Ili” huonyesha kusudi, “watukuzwe” huhifadhi nguvu ya δοξάζω, na “watu” huwakilisha matumizi ya kijumla ya ἀνθρώπων bila kuyafanya kuwa ya wanaume pekee.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: Kweli nawaambia
  rationale: Ni fomula ya Kiswahili iliyo ya asili na yenye uzito, inayohifadhi uthibitisho wa ἀμήν na usemi wa moja kwa moja wa Yesu.
- source_word: ἀπέχουσιν τὸν μισθὸν αὐτῶν
  choice: wamekwisha kupokea thawabu yao yote
  rationale: ἀπέχουσιν ni nahau ya kibiashara ya kupokea malipo kikamilifu; “yote” huonyesha kwamba hakuna thawabu nyingine iliyobaki.
theological_decisions:
- issue: Nguvu ya δοξασθῶσιν
  choice: watukuzwe na watu
  alternative: wasifiwe na watu / waheshimiwe na watu
  rationale: “Watukuzwe” huhifadhi usemi wenye nguvu wa Kigiriki na mkazo wa kutafuta sifa ya wanadamu, bila kuupunguza kuwa pongezi za kawaida.
- issue: Maana ya kijumla ya ἀνθρώπων
  choice: watu
  alternative: wanadamu / wengine
  rationale: Neno hilo linawahusu watazamaji wa kibinadamu kwa jumla, si wanaume pekee.
- issue: Ukamilifu wa thawabu katika ἀπέχουσιν
  choice: wamekwisha kupokea thawabu yao yote
  alternative: wana thawabu yao / wamepokea thawabu yao
  rationale: Tafsiri iliyochaguliwa huonyesha nahau ya kupokea malipo kikamilifu na inadumisha onyo kwamba sifa ya hadharani ndiyo thawabu yao yote, bila kuongeza dai la kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa kawaida kwa msomaji wa leo, huku picha ya tarumbeta, neno “wanafiki,” na nguvu ya “watukuzwe” vikihifadhiwa. Alama zote za tanbihi [a]–[d] zimewekwa katika matini kuu.
