  text: καὶ μὴ εἰσενέγκῃς ἡμᾶς εἰς πειρασμόν, ἀλλὰ ῥῦσαι ἡμᾶς ἀπὸ τοῦ ⸀πονηροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/013.yaml
  text: And do not lead us into temptation[b][a], but deliver us from evil.
translation:
  language: sw
  text: Wala usituingize katika majaribu[a], bali utuokoe kutoka kwa yule mwovu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “katika kujaribiwa” au “katika kipindi cha kupimwa.” Neno la Kigiriki linaweza kumaanisha kishawishi cha kutenda dhambi au jaribu linalompima mtu.
    reason: lexical_alternative
  - marker: b
    text: Au “utuokoe kutoka katika uovu.” Maneno ya Kigiriki yanaweza kueleweka kuwa yanamtaja “yule mwovu” au uovu kwa ujumla.
    reason: alternative_reading
lexical_decisions:
- source_word: μὴ εἰσενέγκῃς
  choice: usituingize
  rationale: Kitenzi hiki kina maana ya kuingiza au kupeleka ndani. Katika ombi la sala, “usituingize” huhifadhi usemi wa moja kwa moja wa Kigiriki bila kuufafanua kuwa “usiruhusu tuingie.”
- source_word: πειρασμόν
  choice: majaribu
  rationale: Neno hili linaweza kumaanisha kishawishi cha kutenda dhambi au hali ya kupimwa na kujaribiwa. “Majaribu” ni neno la kawaida la Kiswahili lenye uwezo wa kubeba maana hizo kulingana na muktadha; tanbihi inaweka wazi upana huo.
- source_word: ῥῦσαι
  choice: utuokoe
  rationale: Kitenzi kinaomba hatua ya Mungu ya kuwaokoa au kuwatoa watu katika hatari. “Utuokoe” ni cha asili, cha heshima, na wazi katika Kiswahili cha sala.
- source_word: τοῦ πονηροῦ
  choice: kutoka kwa yule mwovu
  rationale: Kivumishi chenye kibainishi kinaweza kuwa cha kiume, “yule mwovu,” au cha kijinsia kisicho na uhai, “uovu.” Matini kuu inachagua maana ya mtu binafsi, huku tanbihi ikihifadhi uwezekano wa “uovu.”
theological_decisions:
- issue: Maana ya τοῦ πονηροῦ
  choice: yule mwovu
  alternative: uovu
  rationale: Muundo wa Kigiriki una utata wa kweli kati ya adui mwovu binafsi na uovu kwa ujumla. Maana ya mtu binafsi inafaa katika muktadha wa majaribu, lakini maana isiyo ya mtu haiwezi kuondolewa; kwa hiyo imewekwa katika tanbihi.
- issue: Uhusiano wa Mungu na majaribu
  choice: usituingize katika majaribu
  alternative: usiruhusu tuingie katika majaribu
  rationale: Matini ya Kigiriki ina ombi la moja kwa moja la “kutokuingiza,” si ufafanuzi wa “kutokuruhusu.” Tafsiri inahifadhi mvutano huo bila kuongeza ufafanuzi wa kiteolojia ambao haujasemwa wazi katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa sala ulio wa asili na wa heshima. “Wala” linaunganisha ombi hili na yaliyotangulia; “usituingize” na “utuokoe” ni wazi kwa wasomaji wa kawaida. Alama za tanbihi zimewekwa mara tu baada ya vifungu vinavyohusika.
