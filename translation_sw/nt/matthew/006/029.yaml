id: MAT.6.29
reference: Matthew 6:29
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ὅτι οὐδὲ Σολομὼν ἐν πάσῃ τῇ δόξῃ αὐτοῦ περιεβάλετο ὡς ἓν τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/029.yaml
  text: But I tell you that not even Solomon in all his glory was clothed like one of these[a].
translation:
  language: sw
  text: Lakini ninawaambia kwamba hata Sulemani katika fahari yake yote hakuvikwa kama mojawapo ya maua haya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika utukufu wake wote.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: Lakini ninawaambia
  rationale: Kitenzi λέγω pamoja na ὑμῖν humaanisha kwa kawaida ‘ninawaambia’; δέ inaonyesha utofautishaji wa kiasi na maelezo yaliyotangulia.
- source_word: οὐδὲ
  choice: hata ... hakuvikwa
  rationale: 'Muundo huu wa Kiswahili unawasilisha msisitizo wa kukanusha wa οὐδέ: ‘not even.’'
- source_word: Σολομὼν
  choice: Sulemani
  rationale: Hili ndilo umbo la jina lililozoeleka katika Kiswahili cha Biblia.
- source_word: ἐν πάσῃ τῇ δόξῃ αὐτοῦ
  choice: katika fahari yake yote
  rationale: Katika muktadha huu δόξα ni fahari au uzuri wa kifalme, si utukufu wa kimungu.
- source_word: περιεβάλετο
  choice: hakuvikwa
  rationale: Umbo hili la περιβάλλω katika muktadha linahusu kuvikwa au kupambwa kwa mavazi; ‘kuvikwa’ pia hudumisha ulinganisho na maua katika mistari inayozunguka.
- source_word: ὡς ἓν τούτων
  choice: kama mojawapo ya maua haya
  rationale: ἓν huhifadhi ulinganisho na ua moja, huku ‘maua’ ikifafanua kirejelewa kilicho wazi katika muktadha wa karibu ili Kiswahili kiwe cha asili.
theological_decisions:
- issue: Maana ya δόξα kuhusu Sulemani
  choice: fahari
  alternative: utukufu
  rationale: Muktadha unazungumzia adhama na mapambo ya kifalme ya Sulemani. ‘Fahari’ huepuka kudokeza kwamba hapa ni utukufu wa kimungu, bila kupunguza nguvu ya ulinganisho.
- issue: Nguvu inayomvika Sulemani katika περιεβάλετο
  choice: hakuvikwa
  alternative: hakujivika
  rationale: Umbo la Kigiriki linaweza kueleweka kimofolojia kama la kati au tendwa. Tafsiri ya tendwa ni ya asili katika muktadha na haiamui ni nani aliyemvika, hivyo haiingizi dai la kiteolojia lisilosemwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Fahari’ ni neno linaloeleweka kwa urahisi na linafaa kwa adhama ya kifalme; tanbihi huhifadhi tafsiri mbadala ya jadi ‘utukufu.’
