source:
  edition: SBLGNT
  text: Τοῦ δὲ ⸀Ἰησοῦ χριστοῦ ἡ ⸀γένεσις οὕτως ἦν. ⸀μνηστευθείσης τῆς μητρὸς αὐτοῦ Μαρίας τῷ Ἰωσήφ, πρὶν ἢ συνελθεῖν αὐτοὺς εὑρέθη ἐν γαστρὶ ἔχουσα ἐκ πνεύματος ἁγίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/018.yaml
  text: 'The birth of Jesus the Messiah happened in this way: when his mother Mary had been betrothed to Joseph[a], before they came together[c][b], she was found to be pregnant from the Holy Spirit.'
translation:
  language: sw
  text: 'Kuzaliwa kwa Yesu Masihi kulikuwa hivi: Maria, mama yake, alikuwa amechumbiwa na Yosefu[a]. Kabla hawajaishi pamoja[b], alibainika kuwa alikuwa mjamzito kutoka kwa Roho Mtakatifu[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Uchumba huo ulikuwa ahadi rasmi ya ndoa iliyotambuliwa kisheria, yenye uzito mkubwa kuliko uchumba wa kawaida wa siku hizi.
    reason: cultural_note
  - marker: b
    text: Au “kabla hawajaungana.” Usemi huo unaweza kumaanisha kabla hawajaishi kama mume na mke, kutia ndani kabla ya muungano wa kimwili katika ndoa.
    reason: lexical_alternative
  - marker: c
    text: Au “kwa Roho Mtakatifu.” Kigiriki huonyesha Roho Mtakatifu kuwa chanzo cha mimba hiyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: γένεσις
  choice: kuzaliwa
  rationale: Katika muktadha huu neno hilo linaanzisha simulizi la kuzaliwa kwa Yesu; “kuzaliwa” ni la kawaida na linafaa kwa yanayofuata.
- source_word: Ἰησοῦ χριστοῦ
  choice: Yesu Masihi
  rationale: Χριστός hapa ni cheo kinachomaanisha Masihi, si jina la ukoo.
- source_word: οὕτως ἦν
  choice: kulikuwa hivi
  rationale: Usemi huu unaanzisha maelezo ya jinsi tukio lilivyotokea kwa Kiswahili cha kawaida.
- source_word: μνηστευθείσης
  choice: alikuwa ameposwa
  rationale: “Kuposa” huonyesha ahadi rasmi ya ndoa, ingawa uzito wake wa kisheria katika mazingira ya wakati huo unafafanuliwa katika tanbihi.
- source_word: πρὶν ἢ συνελθεῖν αὐτούς
  choice: kabla hawajaanza kuishi pamoja
  rationale: Huhifadhi usemi wenye staha na kutaja muungano wao bila kuufanya useme wazi zaidi kuliko Kigiriki; maana inayoweza kuhusisha kukamilishwa kwa ndoa imeonyeshwa katika tanbihi.
- source_word: εὑρέθη
  choice: iligundulika kwamba
  rationale: Huhifadhi wazo la hali yake kujulikana bila kumtaja aliyegundua.
- source_word: ἐν γαστρὶ ἔχουσα
  choice: alikuwa mjamzito
  rationale: Ni Kiswahili cha sasa na cha kawaida kwa nahau ya Kigiriki ya kuwa na mimba.
- source_word: ἐκ πνεύματος ἁγίου
  choice: kwa uweza wa Roho Mtakatifu
  rationale: Katika Kiswahili, “kwa uweza wa” huwasilisha kwa kawaida kwamba Roho Mtakatifu ndiye chanzo cha mimba, bila kudokeza uhusiano wa kimwili.
theological_decisions:
- issue: Tafsiri ya Χριστός
  choice: Masihi
  alternative: Kristo
  rationale: Neno hili linafanya kazi kama cheo katika utangulizi huu wa simulizi; “Masihi” hudumisha maana yake.
- issue: Mrejelewa wa πνεύματος ἁγίου
  choice: Roho Mtakatifu
  alternative: roho takatifu
  rationale: Katika simulizi la Mathayo, kirai hiki kinamrejelea Roho Mtakatifu wa Mungu; kutokuwapo kwa kibainishi katika Kigiriki hakulazimishi maana isiyo maalumu.
- issue: Maana ya συνελθεῖν
  choice: kuanza kuishi pamoja
  alternative: kufanya tendo la ndoa
  rationale: Kigiriki kina usemi mpana wenye staha unaoweza kujumuisha kuanza maisha ya ndoa na kukamilisha muungano wa ndoa; matini haipaswi kufinywa kimya kimya kuwa maana moja tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. “Ameposwa” huhifadhi mazingira rasmi ya ndoa; tanbihi huzuia neno hilo kueleweka kama uchumba wa kisasa usio na uzito wa kisheria. Alama zote za tanbihi zimo katika matini kuu.
