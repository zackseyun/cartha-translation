  text: καὶ οὐκ ἐγίνωσκεν αὐτὴν ἕως οὗ ἔτεκεν ⸀υἱόν· καὶ ἐκάλεσεν τὸ ὄνομα αὐτοῦ Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/025.yaml
  text: And he did not know her until she gave birth to a son[c][b][a], and he called his name Jesus.
translation:
  language: sw
  text: Na hakushiriki naye tendo la ndoa[a] mpaka[b] alipojifungua mwana. Naye akamwita Yesu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki kinasema kihalisi, “hakumjua.” Hapa “kujua” ni tafsida ya kushiriki tendo la ndoa.
    reason: lexical_alternative
  - marker: b
    text: Neno “mpaka” linaonyesha yaliyokuwa kweli hadi kuzaliwa kwa Yesu; lenyewe haliamui kilichotokea baadaye.
    reason: alternative_reading
  - marker: c
    text: Kihalisi, “akaliita jina lake Yesu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγίνωσκεν
  choice: hakushiriki naye tendo la ndoa
  rationale: Katika muktadha huu, γινώσκω (‘kujua’) ni tafsida ya kushiriki tendo la ndoa. Kiswahili cha moja kwa moja kinaeleweka kwa urahisi zaidi kuliko ‘hakumjua,’ ambalo linaweza kueleweka tu kuwa hakumfahamu.
- source_word: ἕως οὗ
  choice: mpaka
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa kikomo cha wakati kinachotajwa hapa, bila kuamua lenyewe kilichotokea baadaye.
- source_word: ἔτεκεν
  choice: alipojifungua
  rationale: Ni usemi wa kawaida na wa sasa wa Kiswahili kwa tendo la kuzaa mtoto.
- source_word: υἱόν
  choice: mwana
  rationale: Nomino hii haina kibainishi katika Kigiriki; ‘mwana’ huhifadhi maana bila kuongeza msisitizo usiotajwa wazi.
- source_word: ἐκάλεσεν τὸ ὄνομα αὐτοῦ Ἰησοῦν
  choice: akamwita Yesu
  rationale: Huu ni usemi wa kawaida wa Kiswahili wa kumpa mtoto jina, huku maana ya kirai cha Kigiriki ikihifadhiwa.
- source_word: Ἰησοῦν
  choice: Yesu
  rationale: ‘Yesu’ ndiyo namna sanifu ya jina hili katika Agano Jipya la Kiswahili.
theological_decisions:
- issue: Kama neno ‘mpaka’ linaashiria uhusiano wa ndoa baada ya kuzaliwa kwa Yesu
  choice: Kutafsiri ἕως οὗ kwa ‘mpaka’ bila kusema kama tendo la ndoa lilitokea au halikutokea baadaye.
  alternative: Baadhi ya wasomaji huona kwamba maisha ya kawaida ya ndoa yalianza baadaye; wengine husema kirai hiki hakidokezi mabadiliko yoyote baada ya wakati uliotajwa.
  rationale: Kirai cha Kigiriki kinaeleza yaliyokuwa kweli hadi kuzaliwa kwa mtoto, lakini chenyewe hakiamui yaliyotokea baadaye. Tafsiri inaacha mvutano huo kama ulivyo katika chanzo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Tafsida ya Kigiriki imeelezwa wazi katika matini kuu ili kuepuka maana potovu ya ‘hakumjua’; muundo wa Kigiriki umehifadhiwa katika tanbihi. Sentensi imegawanywa mara mbili kwa usomaji wa kawaida.
