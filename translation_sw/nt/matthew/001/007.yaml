  text: Σολομὼν δὲ ἐγέννησεν τὸν Ῥοβοάμ, Ῥοβοὰμ δὲ ἐγέννησεν τὸν Ἀβιά, Ἀβιὰ δὲ ἐγέννησεν τὸν ⸂Ἀσάφ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/007.yaml
  text: Solomon fathered Rehoboam[a], Rehoboam fathered Abijah, and Abijah fathered Asaph.
translation:
  language: sw
  text: Sulemani alimzaa Rehoboamu, Rehoboamu alimzaa Abiya, naye Abiya alimzaa Asafu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati zinasoma “Asa,” sawa na jina la mfalme wa Yuda anayetajwa katika 1 Wafalme 15 na 2 Mambo ya Nyakati 14–16; matini ya Kiyunani hapa inasoma “Asafu.”
    reason: textual_variant
lexical_decisions:
- source_word: ἐγέννησεν
  choice: akamzaa
  rationale: Katika orodha ya ukoo, kitenzi hiki kinaonyesha kwamba mwanamume alikuwa baba au babu katika mstari wa uzao. “Akamzaa” ni kifupi, cha asili katika Kiswahili, na kinafaa kwa mtiririko wa nasaba.
- source_word: δὲ
  choice: akamzaa / naye
  rationale: Hapa δέ ni kiunganishi chepesi kinachoendeleza orodha, si neno la kuonyesha upinzani. Mfululizo wa vitenzi vyenye kiambishi “aka-” unaendeleza simulizi kwa kawaida, na “naye” katika kishazi cha mwisho huonyesha wazi mwendelezo huo bila kurudia viunganishi visivyo vya lazima.
- source_word: Σολομών
  choice: Sulemani
  rationale: Hili ndilo umbo la kawaida la jina hili katika Biblia za Kiswahili na linatambulika kwa urahisi.
- source_word: Ῥοβοάμ
  choice: Rehoboamu
  rationale: Umbo la kawaida la jina hili katika matumizi ya Biblia ya Kiswahili, likihifadhi utambulisho wake na mwendelezo na Agano la Kale.
- source_word: Ἀβιά
  choice: Abiya
  rationale: Umbo la Kiswahili linalotambulika la jina la mfalme wa Yuda, linalodumisha mwendelezo na Agano la Kale.
- source_word: Ἀσάφ
  choice: Asafu
  rationale: Matini ya Kiyunani iliyotolewa inasoma Ἀσάφ; kwa hiyo jina “Asafu” limehifadhiwa katika matini kuu badala ya kulisawazisha kimya kimya na “Asa.”
theological_decisions:
- issue: Iwapo jina Ἀσάφ lisawazishwe na orodha ya wafalme wa Agano la Kale kwa kutafsiriwa “Asa”
  choice: Kuhifadhi “Asafu” katika matini kuu
  alternative: Kutumia “Asa,” jina la mfalme wa Yuda katika 1 Wafalme 15 na 2 Mambo ya Nyakati 14–16
  rationale: Ushahidi wa lugha ya asili uliotolewa unasoma Ἀσάφ. Kuhifadhi “Asafu” kunaheshimu matini chanzo na huepuka kutatua kimya kimya tofauti ya kimatini na ya kinasaba; usomaji “Asa” umeelezwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mtindo ni mfupi na wa asili kwa orodha ya ukoo; majina yanafuata maumbo yanayotambulika katika matumizi ya Biblia ya Kiswahili. Tanbihi imewekwa baada ya “Asafu,” neno linalohusika moja kwa moja na tofauti ya kimatini.
