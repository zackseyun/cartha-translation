id: MAT.1.12
reference: Matthew 1:12
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Μετὰ δὲ τὴν μετοικεσίαν Βαβυλῶνος Ἰεχονίας ἐγέννησεν τὸν Σαλαθιήλ, Σαλαθιὴλ δὲ ἐγέννησεν τὸν Ζοροβαβέλ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/012.yaml
  text: After the deportation to Babylon[a], Jeconiah fathered Shealtiel, and Shealtiel fathered Zerubbabel.
translation:
  language: sw
  text: Baada ya kuhamishwa kwa watu kwenda Babeli[a], Yekonia akamzaa Shealtieli, naye Shealtieli akamzaa Zerubabeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “baada ya uhamisho kwenda Babeli.” Neno la Kigiriki linarejelea kuondolewa kwa lazima kwa watu na kupelekwa uhamishoni Babeli.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ
  choice: Baada ya
  rationale: μετά pamoja na nomino katika hali ya accusative huonyesha mfuatano wa wakati. δέ ni kiunganishi chepesi ambacho kinaweza kudokezwa kwa kawaida katika Kiswahili bila kutafsiriwa kwa neno tofauti.
- source_word: τὴν μετοικεσίαν Βαβυλῶνος
  choice: kuhamishwa kwa watu kwenda Babeli
  rationale: μετοικεσία hurejelea kuondolewa kwa watu na kupelekwa uhamishoni. Usemi huu unaonyesha kwamba hawakuhama kwa hiari, huku ukibaki wazi na wa kawaida katika Kiswahili.
- source_word: Ἰεχονίας
  choice: Yekonia
  rationale: Hili ni umbo la jina linalotambulika katika matumizi ya Biblia za Kiswahili na linawakilisha Ἰεχονίας kwa kawaida.
- source_word: ἐγέννησεν
  choice: akamzaa
  rationale: Katika nasaba, γεννάω humaanisha kuwa baba au chanzo cha ukoo wa mtu. ‘Akamzaa’ ni kifupi, cha kawaida, na kinaendeleza fomula ya nasaba bila kulazimisha kwamba kila kiungo lazima kiwe kizazi cha moja kwa moja.
- source_word: Σαλαθιήλ
  choice: Shealtieli
  rationale: Umbo hili linafuata jina la Kiebrania linalotambulika na kulirekebisha kwa matamshi na tahajia ya Kiswahili.
- source_word: δὲ
  choice: naye
  rationale: Katika kifungu cha pili δέ huunganisha hatua zinazofuatana za nasaba; ‘naye’ ni kiunganishi cha asili kinachomtaja tena mhusika.
- source_word: Ζοροβαβέλ
  choice: Zerubabeli
  rationale: Hili ni umbo la kawaida na linalotambulika katika mapokeo ya Biblia ya Kiswahili.
theological_decisions:
- issue: Maana ya γεννάω katika nasaba
  choice: Kutumia ‘akamzaa’ kama fomula ya mfuatano wa ukoo bila kudai wazi kwamba kila uhusiano ni wa mzazi na mtoto wa moja kwa moja.
  alternative: akawa baba ya; akamzaa moja kwa moja
  rationale: Nasaba za kale zinaweza kutumia lugha ya kuzaa kwa mfuatano wa ukoo hata pale vizazi fulani vinapofupishwa. Tafsiri inadumisha lugha ya chanzo huku isiongeze dai ambalo muundo wa nasaba haulazimishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa heshima, wa sasa, na unaoeleweka. ‘Kuhamishwa kwa watu’ huweka wazi hali ya kulazimishwa bila kutumia lugha nzito ya kiutawala. Majina yamewasilishwa kwa maumbo yanayotambulika katika Kiswahili.
