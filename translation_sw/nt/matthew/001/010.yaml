  text: Ἑζεκίας δὲ ἐγέννησεν τὸν Μανασσῆ, Μανασσῆς δὲ ἐγέννησεν τὸν ⸂Ἀμώς, Ἀμὼς⸃ δὲ ἐγέννησεν τὸν Ἰωσίαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/010.yaml
  text: Hezekiah fathered Manasseh[a], Manasseh fathered Amos, and Amos fathered Josiah.
translation:
  language: sw
  text: Hezekia akamzaa Manase, Manase akamzaa Amosi[a], naye Amosi akamzaa Yosia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya tafsiri hutumia “Amoni” hapa ili kulinganisha jina hili na la mfalme wa Yuda katika 2 Wafalme 21; matini ya Kigiriki ya Mathayo inasoma “Amosi.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγέννησεν
  choice: akamzaa
  rationale: Katika orodha hii ya ukoo, kitenzi γεννάω kinaonyesha kwamba mwanamume alimzaa au alikuwa babu wa ukoo wa mtu anayetajwa. “Akamzaa” ni usemi mfupi, wa kawaida na wenye hadhi katika Kiswahili cha Biblia, nao unadumisha mtiririko wa nasaba.
- source_word: Ἑζεκίας
  choice: Hezekia
  rationale: Jina limetolewa kwa umbo linalotambulika katika matumizi ya kawaida ya Biblia za Kiswahili.
- source_word: Μανασσῆς
  choice: Manase
  rationale: Jina limetolewa kwa umbo la kawaida la Kiswahili linalotambulika kwa mfalme huyu.
- source_word: Ἀμώς
  choice: Amosi
  rationale: SBLGNT inasoma Ἀμώς, yaani Amosi, si Ἀμών, yaani Amoni. Kwa hiyo matini kuu inafuata moja kwa moja ushahidi wa Kigiriki, huku tofauti ya jina la mfalme katika Wafalme na Mambo ya Nyakati ikielezwa katika tanbihi.
- source_word: Ἰωσίας
  choice: Yosia
  rationale: Jina limetolewa kwa umbo la kawaida na linalotambulika katika Kiswahili.
- source_word: δέ
  choice: naye
  rationale: Katika mfululizo huu wa nasaba, δέ ni kiunganishi kinachoendeleza orodha. Mara mbili za kwanza zinaakisiwa na mpangilio na alama za uandishi; ya mwisho imetafsiriwa “naye” ili sentensi itiririke kiasili.
theological_decisions:
- issue: Tofauti kati ya jina katika matini ya Kigiriki ya Mathayo na jina la mfalme wa Yuda katika Agano la Kale
  choice: Kutumia “Amosi” katika matini kuu kwa kufuata Ἀμώς ya Kigiriki
  alternative: Kutumia “Amoni” ili kulinganisha nasaba na jina lililo katika 2 Wafalme 21 na 2 Mambo ya Nyakati 33
  rationale: Kipaumbele kinapewa matini ya lugha ya asili badala ya kuisawazisha kimya na simulizi la Agano la Kale. Kwa kuwa matini iliyotolewa inasoma Ἀμώς, tofauti halisi inadumishwa na mbadala unaelezwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko mfupi wa nasaba na lugha ya sasa yenye hadhi. “Akamzaa” imetumiwa badala ya maelezo marefu kama “akawa baba yake.” Alama ya tanbihi [a] imewekwa mara tu baada ya “Manase,” kama katika safu ya Kiingereza iliyotolewa, ingawa tanbihi yenyewe inaeleza jina linalofuata, “Amosi.”
