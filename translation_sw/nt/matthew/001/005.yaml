source:
  edition: SBLGNT
  text: Σαλμὼν δὲ ἐγέννησεν τὸν ⸂Βόες ἐκ τῆς Ῥαχάβ, Βόες⸃ δὲ ἐγέννησεν τὸν ⸂Ἰωβὴδ ἐκ τῆς Ῥούθ, Ἰωβὴδ⸃ δὲ ἐγέννησεν τὸν Ἰεσσαί,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/005.yaml
  text: Salmon fathered Boaz by Rahab[a], and Boaz fathered Obed by Ruth, and Obed fathered Jesse,
translation:
  language: sw
  text: Salmoni akamzaa Boazi kwa Rahabu[a], Boazi akamzaa Obedi kwa Ruthu, naye Obedi akamzaa Yese,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kutoka kwa Rahabu” na “kutoka kwa Ruthu.” Kigiriki hutumia ἐκ pamoja na jina la kila mama.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγέννησεν
  choice: akamzaa
  rationale: Katika nasaba hii kitenzi kinaonyesha uzazi au ukoo kupitia baba. “Akamzaa” ni kauli ya kawaida katika nasaba za Biblia za Kiswahili na huhifadhi mwelekeo wa ukoo wa upande wa baba.
- source_word: ἐκ
  choice: kwa
  rationale: Kikiwa na jina la mama, ἐκ huonyesha chanzo cha uzazi au upande wa mama. “Kwa Rahabu” na “kwa Ruthu” ni vifungu vifupi vinavyotaja wazi akina mama bila kuongeza maelezo yasiyomo katika Kigiriki.
- source_word: δὲ
  choice: aka- / naye
  rationale: Hapa δέ ni kiunganishi hafifu kinachoendeleza mfululizo, si cha upinzani. Mfululizo wa vitenzi vyenye “aka-” na “naye” unaleta mtiririko wa asili wa Kiswahili.
- source_word: Σαλμὼν
  choice: Salmon
  rationale: Jina limetolewa kwa umbo linalotambulika katika matumizi ya Biblia ya Kiswahili.
- source_word: Βόες
  choice: Boazi
  rationale: Umbo la kawaida la Kiswahili la mhusika wa Agano la Kale huhifadhi utambulisho wake katika sehemu zote za Biblia.
- source_word: Ῥαχάβ
  choice: Rahabu
  rationale: Umbo la kawaida la Kiswahili la jina hili hudumisha uhusiano na mhusika wa Agano la Kale.
- source_word: Ἰωβὴδ
  choice: Obedi
  rationale: Umbo la kawaida la Kiswahili la jina la Agano la Kale hutumiwa badala ya unukuzi wa moja kwa moja wa umbo la Kigiriki.
- source_word: Ῥούθ
  choice: Ruthu
  rationale: Umbo hili linafuata matumizi ya kawaida ya jina la mhusika na kitabu cha Agano la Kale katika Kiswahili.
- source_word: Ἰεσσαί
  choice: Yese
  rationale: Umbo la kawaida la Kiswahili hudumisha utambulisho wa mhusika huyu katika Agano la Kale na Agano Jipya.
theological_decisions:
- issue: Mfumo wa nasaba na kutajwa kwa akina mama
  choice: Kutaja wazi Rahabu na Ruthu kwa “kwa” huku mfumo wa ukoo wa upande wa baba ukihifadhiwa kwa “akamzaa.”
  alternative: Kutumia “alikuwa baba yake” bila muundo unaoonyesha wazi nafasi ya mama, au kutafsiri ἐκ moja kwa moja kuwa “kutoka kwa.”
  rationale: Kigiriki kinawataja akina mama kwa namna isiyo ya kawaida katika nasaba hii kwa ἐκ pamoja na hali ya umilikaji. Tafsiri inapaswa kuhifadhi kutajwa huko bila kufifisha ukoo wa upande wa baba wala kuamua zaidi ya maandishi yanavyosema.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Muundo wa “akamzaa” unafaa kwa mfululizo wa nasaba; “naye” kabla ya kipashio cha mwisho husaidia mtiririko bila kuipa δέ maana ya upinzani.
