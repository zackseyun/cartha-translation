  text: Ἰακὼβ δὲ ἐγέννησεν τὸν Ἰωσὴφ τὸν ἄνδρα Μαρίας, ἐξ ἧς ἐγεννήθη Ἰησοῦς ὁ λεγόμενος χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/016.yaml
  text: And Jacob fathered Joseph[a], the husband of Mary, from whom Jesus was born[b], who is called the Messiah.
translation:
  language: sw
  text: Yakobo akamzaa Yosefu, mume wa Maria, ambaye kwake Yesu alizaliwa, aitwaye Masihi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Kristo.”
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: na (imewakilishwa kwa mtiririko wa “akamzaa”)
  rationale: δέ inaendeleza nasaba kwa upole. Katika Kiswahili, kiambishi cha mfululizo “aka-” kinaendeleza simulizi kwa kawaida bila kuleta wazo la upinzani.
- source_word: ἐγέννησεν
  choice: akamzaa
  rationale: Katika muktadha wa nasaba, γεννάω humaanisha kuwa baba wa mtu au kumzaa katika ukoo. “Akamzaa” ni usemi mfupi, wa kawaida katika nasaba za Kiswahili, usio wa kizamani.
- source_word: τὸν ἄνδρα Μαρίας
  choice: mume wa Maria
  rationale: ἀνήρ pamoja na kirai “wa Maria” ina maana ya uhusiano wa ndoa; “mume” huiweka wazi kwa Kiswahili cha kawaida.
- source_word: ἐξ ἧς ἐγεννήθη
  choice: Maria alimzaa
  rationale: Kiwakilishi cha Kigiriki ni cha kike, umoja, na kinamrejelea Maria peke yake. Kwa kuwa Kiswahili hakionyeshi jinsia katika “ambaye/naye,” kurudia jina “Maria” na kutumia “alimzaa” kunaondoa utata wa rejeleo na kueleza kwa kawaida kwamba Yesu alizaliwa kutoka kwake, bila kumtaja Yosefu kuwa baba aliyemzaa Yesu.
- source_word: ὁ λεγόμενος
  choice: aitwaye
  rationale: “Aitwaye” ni njia ya kawaida na yenye hadhi ya kutafsiri usemi wa utambulisho “anayeitwa.”
- source_word: χριστός
  choice: Masihi
  rationale: Hapa χριστός inafanya kazi kama cheo katika usemi “aitwaye,” si kama sehemu ya jina. “Masihi” huhifadhi maana ya cheo cha Mtiwa-Mafuta.
theological_decisions:
- issue: Mabadiliko kutoka kwa Yosefu kuzaliwa katika mstari wa baba hadi kuzaliwa kwa Yesu kutoka kwa Maria
  choice: Yakobo anasemwa kumzaa Yosefu, lakini Maria ndiye anayetajwa kumzaa Yesu
  alternative: Yakobo akamzaa Yosefu ... ambaye kwake Yesu alizaliwa
  rationale: Kigiriki kinabadilika kwa makusudi kutoka ἐγέννησεν ya kauli tendi hadi ἐγεννήθη ya kauli tendwa pamoja na ἐξ ἧς ya kike. Kiswahili cha kawaida kinahitaji kulifanya rejeleo kwa Maria liwe wazi; tafsiri haidai kwamba Yosefu alimzaa Yesu.
- issue: Tafsiri ya Χριστός katika usemi wa utambulisho wa Yesu
  choice: Masihi
  alternative: Kristo
  rationale: Katika ὁ λεγόμενος χριστός neno hilo ni cheo kinachotambulisha Yesu. “Masihi” huwasilisha maana ya cheo, huku “Kristo” ikitolewa kama tafsiri nyingine inayojulikana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imegawanywa baada ya “Maria” ili kuzuia utata wa kiwakilishi, kwa kuwa viwakilishi vya Kiswahili havionyeshi jinsia kama ἧς ya Kigiriki. Muundo wa nasaba “akamzaa” umehifadhiwa, na tofauti muhimu kabla ya kuzaliwa kwa Yesu imewekwa wazi.
