  text: Ἰωσὴφ δὲ ὁ ἀνὴρ αὐτῆς, δίκαιος ὢν καὶ μὴ θέλων αὐτὴν ⸀δειγματίσαι, ἐβουλήθη λάθρᾳ ἀπολῦσαι αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/019.yaml
  text: And Joseph[a], her husband, being a righteous man and not wanting to expose her to public disgrace[c][b], intended to divorce her quietly.
translation:
  language: sw
  text: Naye Yosefu, mume wake[a], akiwa mtu mwadilifu na bila kutaka kumwaibisha hadharani[b], alikusudia kumtaliki kwa siri[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mchumba wake.” Kigiriki kinasema “mwanamume/mume wake,” kikionyesha hali ya kisheria yenye kufunga ya uchumba wa Kiyahudi.
    reason: lexical_alternative
  - marker: b
    text: Au, “kumfanya kuwa mfano” au “kumfedhehesha hadharani.”
    reason: lexical_alternative
  - marker: c
    text: Au, “kumwacha kwa siri.” Katika muktadha huu, jambo hilo linamaanisha talaka rasmi wakati wa uchumba.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνὴρ αὐτῆς
  choice: mume wake
  rationale: Katika muktadha huu ἀνήρ ina maana ya mume, kwa kuwa uchumba wa Kiyahudi ulikuwa kifungo cha kisheria na kuuvunja kulihitaji talaka. Kiswahili ‘mume wake’ kinaonyesha uzito huo wa kisheria; hatua ya uhusiano inaelezwa katika tanbihi.
- source_word: δίκαιος
  choice: mtu mwadilifu
  rationale: ‘Mwadilifu’ huonyesha tabia inayofaa mbele za Mungu na katika mwenendo bila kuamua kama mkazo ni ushikaji wa sheria, huruma, au yote mawili.
- source_word: δειγματίσαι
  choice: kumwaibisha hadharani
  rationale: Kitenzi hiki humaanisha kumweka mtu wazi ili aonewe aibu. Tafsiri hii inaonyesha wazi hali ya hadharani na fedheha iliyodokezwa na muktadha.
- source_word: ἐβουλήθη
  choice: alikusudia
  rationale: βούλομαι huonyesha nia iliyofikiriwa au azimio; ‘alikusudia’ ni ya kawaida na haifanyi uamuzi uonekane kuwa tayari umetekelezwa.
- source_word: λάθρᾳ
  choice: kwa siri
  rationale: Neno hili humaanisha kwa namna iliyofichika au ya faragha. ‘Kwa siri’ linaendeleza tofauti na kumwaibisha hadharani.
- source_word: ἀπολῦσαι
  choice: kumtaliki
  rationale: Katika uchumba huu wenye nguvu ya kisheria, ἀπολύω humaanisha kuvunja rasmi kifungo hicho. ‘Kumtaliki’ huwasilisha nguvu ya kisheria kuliko ‘kumwacha’.
- source_word: δὲ
  choice: Naye
  rationale: δὲ ni kiunganishi chepesi kinachoendeleza simulizi; ‘Naye’ ni cha asili katika usimulizi wa Kiswahili.
- source_word: ὢν καὶ μὴ θέλων
  choice: kwa kuwa alikuwa ... na hakutaka
  rationale: Muundo huu unaweka hali na nia ya Yosefu kama msingi wa kusudi lake. Kiswahili hiki ni wazi na kinaendeleza uhusiano wa vipashio vyote viwili bila kufafanua zaidi namna ambavyo uadilifu wake ulihusiana na huruma yake.
theological_decisions:
- issue: Maana ya Yosefu kuitwa δίκαιος
  choice: ‘Mtu mwadilifu’ bila kueleza kama uadilifu huo hasa ni ushikaji wa sheria, huruma, au yote mawili.
  alternative: ‘Mtu mwenye haki’ au ufafanuzi unaosisitiza huruma pekee.
  rationale: Kigiriki kinaunganisha uadilifu wa Yosefu na kutotaka kwake kumwaibisha Maria. Tafsiri inadumisha mvutano huo wa kimaadili badala ya kuufungamanisha na tafsiri moja ya kiteolojia.
- issue: Hali ya kisheria ya Yosefu na Maria
  choice: ‘Mume wake’ na ‘kumtaliki’ katika matini kuu.
  alternative: ‘Mchumba wake’ na ‘kuvunja uchumba,’ au tafsiri ya moja kwa moja zaidi ‘mtu wake’ na ‘kumwacha.’
  rationale: Maneno ya Kigiriki pamoja na mazingira ya uchumba wa Kiyahudi wa karne ya kwanza yanaonyesha kifungo cha kisheria kilichohitaji kuvunjwa rasmi. Istilahi za matini kuu zinaonyesha jambo hilo, huku tanbihi zikihifadhi maelezo na njia mbadala.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni nyepesi kusomeka, huku ‘mwadilifu,’ ‘hadharani,’ na ‘kumtaliki’ zikihifadhi uzito wa kimaadili na kisheria wa matini ya Kigiriki.
