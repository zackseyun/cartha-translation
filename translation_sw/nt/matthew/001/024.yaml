source:
  edition: SBLGNT
  text: ⸀ἐγερθεὶς δὲ ὁ Ἰωσὴφ ἀπὸ τοῦ ὕπνου ἐποίησεν ὡς προσέταξεν αὐτῷ ὁ ἄγγελος κυρίου καὶ παρέλαβεν τὴν γυναῖκα αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/024.yaml
  text: Then Joseph[a], having awakened from sleep, did as the angel of the Lord commanded him and took his wife.
translation:
  language: sw
  text: Kisha Yosefu, alipoamka kutoka usingizini, alifanya kama malaika wa Bwana alivyomwamuru, akamchukua mke wake[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akampokea mke wake” au “akamchukua mke wake nyumbani kwake.” Kitenzi cha Kigiriki kinaweza kuwa na maana ya kumchukua mtu na kumwingiza katika nyumba yake.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγερθεὶς ... ἀπὸ τοῦ ὕπνου
  choice: alipoamka kutoka usingizini
  rationale: Kifungu hiki kinaonyesha tendo la kuamka lililotangulia kutii kwa Yosefu. Muundo wa “alipoamka” ni wa kawaida katika Kiswahili na unadumisha mfuatano huo.
- source_word: δὲ
  choice: Kisha
  rationale: Hapa δέ inaendeleza simulizi badala ya kuonyesha upinzani mkali; “Kisha” inaleta mtiririko wa kawaida wa simulizi.
- source_word: ἐποίησεν ὡς
  choice: alifanya kama ... alivyomwamuru
  rationale: Muundo huu unaonyesha kwamba tendo la Yosefu lilipatana na amri aliyopewa, kwa Kiswahili cha kawaida na wazi.
- source_word: προσέταξεν
  choice: alivyomwamuru
  rationale: Kitenzi hiki kina maana ya kutoa agizo lenye mamlaka; “amuru” kinadumisha uzito huo.
- source_word: ὁ ἄγγελος κυρίου
  choice: malaika wa Bwana
  rationale: Hili ni tafsiri ya moja kwa moja na ya kawaida ya usemi wa kibiblia, huku κύριος ikitafsiriwa “Bwana.”
- source_word: παρέλαβεν
  choice: akamchukua
  rationale: παραλαμβάνω inaweza kumaanisha kumchukua au kumpokea mtu kwake. “Akamchukua” ni fupi na ya moja kwa moja, huku tanbihi ikihifadhi maana nyingine inayowezekana ya kumkaribisha nyumbani kwake.
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: mke wake
  rationale: Katika muktadha wa kisheria na kindoa wa kifungu hiki, γυνή humaanisha “mke,” bila kudokeza kwamba ndoa ilikuwa tayari imetimilizwa kimwili.
theological_decisions:
- issue: Maana ya γυνή kabla ya kutimilizwa kwa ndoa kimwili
  choice: mke wake
  alternative: mwanamke wake
  rationale: Muktadha wa Mathayo unamweka Maria ndani ya uhusiano halali wa kindoa na Yosefu, ingawa mstari unaofuata unabainisha kwamba hawakuwa wameanza mahusiano ya kimwili. “Mke wake” huhifadhi mfumo huo wa kijamii na kisheria bila kuongeza dai kuhusu kutimilizwa kwa ndoa.
- issue: Tafsiri ya κύριος katika ἄγγελος κυρίου
  choice: malaika wa Bwana
  alternative: malaika wa Yahwe
  rationale: “Bwana” hudumisha usemi wa kibiblia uliozoeleka na kutafsiri κύριος kama ilivyo katika chanzo cha Kigiriki bila kuingiza jina la Mungu ambalo halipo wazi katika maandishi hayo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa simulizi ni wa asili, na tanbihi inalinda upana wa maana ya παραλαμβάνω.
