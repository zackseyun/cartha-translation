base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/023.yaml
  text: Behold[a], the virgin will conceive and bear a son, and they will call his name Immanuel—which is translated[d][c][b], 'God with us.'
translation:
  language: sw
  text: “Tazama, bikira[a] atachukua mimba na kuzaa mwana, nao watamwita[b] kwa jina la Imanueli[c]”—ambalo, likitafsiriwa[d], maana yake ni, “Mungu pamoja nasi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mwanamke kijana.” Hata hivyo, katika muktadha wa Mathayo, neno la Kigiriki παρθένος na simulizi linalozunguka kuzaliwa kwa Yesu yanaunga mkono tafsiri “bikira.”
    reason: lexical_alternative
  - marker: b
    text: 'Kigiriki: “wataita”; hii ni kauli ya wingi ambayo haitaji wazi ni nani watakaofanya hivyo.'
    reason: lexical_alternative
  - marker: c
    text: Pia huandikwa “Emanueli.”
    reason: lexical_alternative
  - marker: d
    text: Au, “ambalo tafsiri yake ni.”
    reason: previous_rendering
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Tazama
  rationale: Ni neno la kuelekeza fikira linalodumisha uzito wa kinabii wa nukuu, huku likiwa wazi na la kawaida katika Kiswahili cha maandiko.
- source_word: παρθένος
  choice: bikira
  rationale: Katika muktadha wa Mathayo na simulizi linalozunguka kuzaliwa kwa Yesu, neno hili linamaanisha mwanamke ambaye hajawahi kufanya ngono. Pia linafuata neno la Kigiriki katika Septuajinti ambalo Mathayo analinukuu.
- source_word: ἐν γαστρὶ ἕξει
  choice: atachukua mimba
  rationale: Ni Kiswahili cha kawaida kwa nahau ya Kigiriki inayomaanisha kihalisi ‘atakuwa na mimba tumboni,’ na kinadumisha wakati ujao.
- source_word: τέξεται
  choice: kuzaa
  rationale: Hutoa kwa ufupi na kwa kawaida tendo la kujifungua linaloelezwa na kitenzi cha Kigiriki.
- source_word: υἱόν
  choice: mwana
  rationale: Ni tafsiri ya moja kwa moja yenye hadhi inayofaa muktadha wa kinabii; hapa inamaanisha mtoto wa kiume.
- source_word: καλέσουσιν
  choice: nao watamwita
  rationale: Inadumisha nafsi ya tatu wingi ya Kigiriki bila kuigeuza kuwa kauli tendwa; mtendaji anaachwa bila kutajwa wazi kama katika chanzo.
- source_word: τὸ ὄνομα αὐτοῦ
  choice: kwa jina la
  rationale: Ni muundo wa asili wa Kiswahili unaowasilisha kitendo cha kumpa au kumwita mtu jina bila kunakili kwa ugumu nahau ya Kigiriki.
- source_word: Ἐμμανουήλ
  choice: Imanueli
  rationale: Ni namna ya kawaida ya kuandika jina hili katika Kiswahili na inaendana na ufafanuzi wa maana yake unaofuata.
- source_word: μεθερμηνευόμενον
  choice: jina ambalo likitafsiriwa ni
  rationale: Ni Kiswahili wazi na cha kawaida kinachodumisha kazi ya kishazi cha Kigiriki ya kumfafanulia msomaji maana ya jina.
- source_word: Μεθ’ ἡμῶν ὁ θεός
  choice: Mungu pamoja nasi
  rationale: Inawasilisha moja kwa moja maana ya jina bila kuongeza ufafanuzi wa kiteolojia ambao haupo katika mstari.
theological_decisions:
- issue: Maana ya παρθένος katika mstari unaohusu kuchukuliwa mimba kwa njia ya ajabu
  choice: bikira
  alternative: mwanamke kijana
  rationale: Matumizi ya Mathayo ya παρθένος na muktadha wa karibu wa Mathayo 1 yanaunga mkono wazi maana ‘bikira.’ Mjadala unaohusu neno la Kiebrania katika Isaya 7:14 unatambuliwa katika tanbihi bila kudhoofisha maana ya Kigiriki katika muktadha huu.
- issue: Nguvu ya ufafanuzi wa jina Imanueli
  choice: Mungu pamoja nasi
  alternative: Mungu yuko pamoja nasi
  rationale: Muundo uliochaguliwa unafuata kwa karibu maneno ya Kigiriki na kudumisha uzito wake wa kiteolojia bila kupanua mstari kuwa maelezo ya fundisho la kupata mwili.
- issue: Mtendaji asiyeainishwa katika καλέσουσιν
  choice: nao watamwita
  alternative: ataitwa
  rationale: Kauli tendi ya wingi inadumishwa ili kuhifadhi kutotajwa wazi kwa wale watakaomwita jina hilo, badala ya kuibadili kimya kuwa kauli tendwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wa heshima na wenye uzito wa kinabii. ‘Tazama’ na ‘mwana’ hudumisha hadhi ya nukuu, huku ‘atachukua mimba’ na ‘jina ambalo likitafsiriwa ni’ vikihakikisha sentensi inaeleweka kwa wasomaji wa kawaida. Alama zote za tanbihi zimewekwa katika matini kuu.
