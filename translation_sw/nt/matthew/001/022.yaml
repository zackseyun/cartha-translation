  text: All this happened so that what was spoken by the Lord through the prophet might be fulfilled[a], saying,
translation:
  language: sw
  text: 'Haya yote yalitukia[a] ili litimie neno lililonenwa na Bwana kwa njia ya nabii aliyesema:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Jambo hili lote lilitukia.” Kirai cha Kigiriki τοῦτο δὲ ὅλον kinakazia ukamilifu wa matukio yote yaliyoelezwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο δὲ ὅλον
  choice: Haya yote
  rationale: Ingawa τοῦτο ni umoja wa kisarufi, inarejelea kwa pamoja matukio yaliyotangulia. “Haya yote” ni Kiswahili cha kawaida kinachohifadhi msisitizo wa ὅλον juu ya ujumla wa matukio hayo. δέ hapa inaendeleza simulizi bila kuhitaji neno tofauti la kuianzishia sentensi.
- source_word: γέγονεν
  choice: yalitukia
  rationale: Kitenzi hiki ni timilifu cha γίνομαι. Katika simulizi, “yalitukia” kinaeleza kwa kawaida kwamba matukio hayo yalitokea, huku muktadha ukionyesha umuhimu wa matokeo yake.
- source_word: ἵνα
  choice: ili
  rationale: “Ili” linaweza kuonyesha kusudi au matokeo yanayokusudiwa, na hivyo haliondoi mvutano uliopo katika muundo wa Kigiriki.
- source_word: πληρωθῇ
  choice: litimie
  rationale: Hifadhi dhamira ya kutimia kwa neno la kinabii na hali ya kutendwa ya Kigiriki kwa muundo wa Kiswahili unaosomeka kwa kawaida.
- source_word: τὸ ῥηθὲν
  choice: neno lililonenwa
  rationale: Kirai hiki kilichofanywa nomino humaanisha kile kilichosemwa. “Neno lililonenwa” ni cha heshima, cha kawaida katika muktadha wa unabii, na huhifadhi uundaji wa kutendwa.
- source_word: ὑπὸ κυρίου
  choice: na Bwana
  rationale: Huonyesha Bwana kuwa msemaji wa mwisho bila kuongeza neno “Mungu,” ambalo halipo katika Kigiriki.
- source_word: διὰ τοῦ προφήτου
  choice: kwa njia ya nabii
  rationale: διά pamoja na jenitivi huonyesha chombo au wakala wa kati; “kwa njia ya nabii” hutofautisha kwa wazi Bwana kama chanzo na nabii kama mpitishaji.
- source_word: λέγοντος
  choice: aliyesema
  rationale: Kishiriki hiki kinaafikiana kisarufi na “nabii” na kinaanzisha nukuu ya mstari unaofuata. “Aliyesema” huonyesha wazi uhusiano huo.
theological_decisions:
- issue: Uwakala katika usemi wa kinabii
  choice: “lililonenwa na Bwana kwa njia ya nabii”
  alternative: “lililonenwa na nabii kutoka kwa Bwana”
  rationale: Muundo uliochaguliwa huhifadhi tofauti ya Kigiriki kati ya Bwana kama msemaji mkuu na nabii kama mpitishaji, bila kupanua mstari kuwa maelezo kamili ya fundisho la uvuvio.
- issue: Mfumo wa kutimia kwa unabii
  choice: “ili litimie”
  alternative: “na hivyo likatimia”
  rationale: ἵνα pamoja na hali tegemezi inaweza kubeba kusudi na/au matokeo. “Ili litimie” huhifadhi mwelekeo huo bila kuamua kupita kiasi kama mkazo ni kusudi la Mungu au matokeo ya kisimulizi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Yalitukia” ni cha asili katika simulizi; “neno lililonenwa” na “kwa njia ya nabii” huhifadhi uzito wa mtindo wa kinabii bila kuwa wa kizamani.
