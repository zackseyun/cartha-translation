id: MAT.1.15
reference: Matthew 1:15
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἐλιοὺδ δὲ ἐγέννησεν τὸν Ἐλεάζαρ, Ἐλεάζαρ δὲ ἐγέννησεν τὸν Ματθάν, Ματθὰν δὲ ἐγέννησεν τὸν Ἰακώβ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/015.yaml
  text: Eliud fathered Eleazar, and Eleazar fathered Matthan, and Matthan fathered Jacob.
translation:
  language: sw
  text: Eliudi akamzaa Eleazari, Eleazari akamzaa Mathani, naye Mathani akamzaa Yakobo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐλιοὺδ
  choice: Eliudi
  rationale: Jina limetoholewa kwa tahajia inayofaa Kiswahili na kupokea irabu ya mwisho kwa matamshi ya kawaida.
- source_word: δὲ
  choice: aka- / naye
  rationale: Katika ukoo huu, δέ ni kiunganishi hafifu kinachoendeleza orodha. Mfuatano wa vitenzi vya aka- unatoa mtiririko wa asili, huku 'naye' katika kishazi cha mwisho ikiweka wazi badiliko la mhusika bila kusisitiza utofautishaji.
- source_word: ἐγέννησεν
  choice: akamzaa
  rationale: Katika nasaba, γεννάω humtaja mwanaume kuwa mzazi au babu wa ukoo. 'Akamzaa' ni usemi mfupi, wa kawaida katika nasaba za Biblia, na hauongezi maelezo yasiyokuwapo katika Kigiriki.
- source_word: τὸν
  choice: haikutafsiriwa kando
  rationale: Nakala ya Kigiriki hutumia kibainishi kuonyesha yambwa kabla ya jina la mtu; Kiswahili hakihitaji kibainishi hicho, na alama ya yambwa '-m-' katika 'akamzaa' huonyesha uhusiano wa kisarufi.
- source_word: Ἐλεάζαρ
  choice: Eleazari
  rationale: Jina limetoholewa kwa umbo linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: Ματθάν
  choice: Mathani
  rationale: Jina limetoholewa kwa tahajia ya Kiswahili inayotofautisha Ματθάν na jina Mathayo.
- source_word: Ἰακώβ
  choice: Yakobo
  rationale: Jina limetoholewa kwa umbo la kibiblia lililozoeleka katika Kiswahili.
theological_decisions:
- issue: Maana ya γεννάω katika nasaba
  choice: akamzaa
  alternative: akawa baba ya / akamzaa katika ukoo
  rationale: Neno linaweza kutumiwa katika nasaba hata pale ambapo vizazi vya kati vimeachwa. Tafsiri fupi 'akamzaa' huhifadhi namna ya usemi wa chanzo bila kudai kwa maelezo kwamba kila uhusiano lazima uwe wa baba na mwana wa moja kwa moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi, na yenye mdundo wa nasaba. Hakuna tanbihi zinazohitajika katika mstari huu.
