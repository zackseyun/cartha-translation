  text: Ζοροβαβὲλ δὲ ἐγέννησεν τὸν Ἀβιούδ, Ἀβιοὺδ δὲ ἐγέννησεν τὸν Ἐλιακίμ, Ἐλιακὶμ δὲ ἐγέννησεν τὸν Ἀζώρ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/013.yaml
  text: Zerubbabel fathered Abiud[a], Abiud fathered Eliakim, and Eliakim fathered Azor.
translation:
  language: sw
  text: Zerubabeli akamzaa Abiudi[a], Abiudi akamzaa Eliakimu, Eliakimu akamzaa Azori.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akawa baba wa”; katika nasaba za Biblia, kitenzi hiki kinachorudiwa kinaweza kuonyesha ukoo kwa kufupisha baadhi ya vizazi.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ζοροβαβέλ
  choice: Zerubabeli
  rationale: Jina limetoholewa kwa umbo lililozoeleka katika Kiswahili cha Biblia na kupewa irabu ya mwisho inayorahisisha matamshi ya Kiswahili.
- source_word: δέ
  choice: aka- / naye
  rationale: Katika mfululizo huu δέ ni kiunganishi chepesi kinachoendeleza orodha, si alama ya upinzani. Mfuatano wa vitenzi vya aka- na neno “naye” katika kishazi cha mwisho huleta mtiririko wa kawaida wa Kiswahili.
- source_word: ἐγέννησεν
  choice: akamzaa
  rationale: Katika nasaba kitenzi hiki humtaja mwanaume kuwa mzazi au kiungo cha ukoo. “Akamzaa” ni usemi mfupi, wa kawaida katika nasaba za Kiswahili, unaofuata kwa karibu fomula ya Kigiriki bila kuibadili kuwa maelezo mapana ya ukoo.
- source_word: Ἀβιούδ
  choice: Abiudi
  rationale: Jina limetoholewa kwa tahajia na matamshi yanayofaa Kiswahili, bila kulitafsiri maana yake.
- source_word: Ἐλιακίμ
  choice: Eliakimu
  rationale: Jina limetoholewa kwa umbo linalotambulika katika matumizi ya Biblia ya Kiswahili na linaloakisi umbo la Kigiriki.
- source_word: Ἀζώρ
  choice: Azori
  rationale: Jina limetoholewa kwa mfumo wa sauti wa Kiswahili, bila alama za kitaalamu zisizo za lazima.
theological_decisions:
- issue: Maana ya γεννάω katika nasaba ambayo huenda imefupisha vizazi
  choice: akamzaa
  alternative: akawa baba ya / alikuwa babu wa ukoo wa
  rationale: “Akamzaa” huhifadhi fomula ya moja kwa moja ya nasaba katika Kigiriki, lakini tanbihi inaeleza kuwa nasaba za Biblia zinaweza kufupisha mfululizo wa vizazi. Hivyo tafsiri haisuluhishi kimya kimya iwapo kila kiungo ni cha kizazi kinachofuatana mara moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa “akamzaa” ni wa kawaida na wenye kueleweka katika usimulizi wa nasaba; majina yametoholewa kwa maumbo yanayosomeka kwa urahisi katika Kiswahili.
