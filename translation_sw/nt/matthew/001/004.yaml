  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἀρὰμ δὲ ἐγέννησεν τὸν Ἀμιναδάβ, Ἀμιναδὰβ δὲ ἐγέννησεν τὸν Ναασσών, Ναασσὼν δὲ ἐγέννησεν τὸν Σαλμών,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/004.yaml
  text: Aram fathered Amminadab[a], and Amminadab fathered Nahshon, and Nahshon fathered Salmon.
translation:
  language: sw
  text: Aramu[a] akamzaa Aminadabu, Aminadabu akamzaa Nashoni, naye Nashoni akamzaa Salmoni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ramu.” Maandishi ya Kigiriki yana Aramu (Ἀράμ), ilhali “Ramu” hufuata umbo la jina hilo katika nasaba ya Kiebrania.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀρὰμ
  choice: Aramu
  rationale: Jina limenukuliwa kutoka umbo la Kigiriki Ἀράμ na kupewa irabu ya mwisho kwa mujibu wa matamshi ya kawaida ya Kiswahili; umbo mbadala “Ramu,” linalofuata jina la Kiebrania, limehifadhiwa katika tanbihi.
- source_word: δὲ
  choice: akamzaa / naye
  rationale: Katika orodha hii δέ ni kiunganishi kinachoendeleza mfululizo, si alama ya upinzani. Mtiririko huo unaonyeshwa kwa mfuatano wa vitenzi na kwa “naye” katika kifungu cha mwisho ili Kiswahili kisikike kwa uhalisi.
- source_word: ἐγέννησεν
  choice: akamzaa
  rationale: Katika nasaba, γεννάω humtaja baba kama chanzo cha ukoo. “Akamzaa” ni usemi mfupi, wa kawaida na unaotambulika katika nasaba za Kiswahili, bila kutumia lugha ya kizamani.
- source_word: Ἀμιναδάβ
  choice: Aminadabu
  rationale: Unukuzi huu unafuata muundo wa jina la Kigiriki na kanuni za kifonolojia za Kiswahili, huku ukiendelea kutambulika katika mapokeo ya majina ya Biblia.
- source_word: Ναασσών
  choice: Nashoni
  rationale: “Nashoni” ni umbo la Kiswahili linalotambulika na linalolingana na jina la nasaba ya Kiebrania linalowakilishwa na Ναασσών.
- source_word: Σαλμών
  choice: Salmoni
  rationale: Jina limetoholewa kuwa “Salmoni” kwa matamshi ya kawaida ya Kiswahili na kwa utambulisho wake katika nasaba ya Biblia.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na rahisi kusomeka. Muundo wa nasaba umehifadhiwa kwa marudio ya “akamzaa,” huku “naye” ikitumiwa kuleta mtiririko wa kawaida bila kuipa δέ maana ya upinzani.
