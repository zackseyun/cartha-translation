lexical_decisions:
- source_word: ἐγέννησεν
  choice: akamzaa
  rationale: Katika nasaba, kitenzi hiki humaanisha kwamba mwanamume alimzaa au alikuwa baba wa mtu aliyetajwa. “Akamzaa” ni Kiswahili cha kawaida na huhifadhi mtiririko mfupi wa nasaba.
- source_word: τὸν Δαυὶδ τὸν βασιλέα
  choice: Mfalme Daudi
  rationale: Muundo huu wa kawaida wa Kiswahili unatambulisha wazi hadhi ya Daudi kuwa mfalme, kama kifungu chenye kibainishi katika Kigiriki.
- source_word: ἐκ τῆς τοῦ Οὐρίου
  choice: kwa mke wa Uria
  rationale: Kigiriki kina usemi wa mkato, kihalisi “kutoka kwa [mwanamke] wa Uria,” ambapo neno “mke” linaeleweka. Tafsiri hii ni ya kawaida katika Kiswahili, haitaji jina la Bathsheba, na huhifadhi uhusiano wake na Uria.
- source_word: Ἰεσσαί
  choice: Yese
  rationale: Hili ndilo umbo la jina linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: Δαυίδ
  choice: Daudi
  rationale: Hili ndilo umbo la jina linalotumika kwa kawaida katika Kiswahili.
- source_word: Σολομῶνα
  choice: Sulemani
  rationale: Hili ndilo umbo la jina linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: Οὐρίου
  choice: Uria
  rationale: Hili ndilo umbo la jina linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: δέ
  choice: —
  rationale: Hiki ni kiunganishi hafifu katika mfululizo wa nasaba. Hakihitaji kutafsiriwa moja kwa moja kwa sababu mfululizo unaeleweka kwa urahisi katika Kiswahili bila kiunganishi hicho.
theological_decisions:
- issue: Rejeo la Mathayo lisilotaja moja kwa moja jina la Bathsheba
  choice: Kuhifadhi usemi “kwa mke wa Uria” bila kuongeza jina la Bathsheba.
  alternative: kwa Bathsheba; kwa yule aliyekuwa mke wa Uria
  rationale: Kigiriki kinamtambulisha mwanamke kwa uhusiano wake na Uria. Kuhifadhi usemi huo hudumisha mwangwi wa simulizi na uzito wake wa kimaadili bila kufafanua kimadhehebu au kuondoa mvutano wa kifasihi.
