  text: Ἰούδας δὲ ἐγέννησεν τὸν Φαρὲς καὶ τὸν Ζάρα ἐκ τῆς Θαμάρ, Φαρὲς δὲ ἐγέννησεν τὸν Ἑσρώμ, Ἑσρὼμ δὲ ἐγέννησεν τὸν Ἀράμ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/003.yaml
  text: Judah fathered Perez and Zerah by Tamar[a], Perez fathered Hezron, and Hezron fathered Aram.
translation:
  language: sw
  text: Yuda akamzaa Peresi na Zera kutoka kwa Tamari;[a] Peresi akamzaa Hezroni, naye Hezroni akamzaa Aramu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya tafsiri zina “Ramu” baadaye katika mstari huu, zikifuata namna tofauti ya kuandika au mapokeo tofauti; matini ya Kigiriki hapa inasomeka “Aramu.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰούδας
  choice: Yuda
  rationale: Katika nasaba hii jina linamtaja babu wa taifa la Yuda; umbo la kawaida la Kiswahili la jina hilo ni “Yuda”.
- source_word: δὲ
  choice: aka- / naye
  rationale: Hapa δέ ni kiunganishi hafifu kinachoendeleza mfululizo wa nasaba, si kionyesha tofauti kali. Muundo wa masimulizi wenye “aka-” na “naye” ni wa asili katika Kiswahili.
- source_word: ἐγέννησεν
  choice: akamzaa
  rationale: Katika nasaba, γεννάω humaanisha kuwa baba au kuzaa katika ukoo. “Akamzaa” ni fupi, ya kawaida, na huhifadhi uhusiano wa moja kwa moja wa kifamilia.
- source_word: Φαρὲς
  choice: Peresi
  rationale: Umbo hili linapatana na jina la Kiebrania פֶּרֶץ na matumizi yaliyozoeleka katika Biblia za Kiswahili.
- source_word: Ζάρα
  choice: Zera
  rationale: Umbo hili linaendeleza jina la Kiebrania זֶרַח kwa namna inayotambulika katika Kiswahili.
- source_word: ἐκ τῆς Θαμάρ
  choice: kwa Tamari
  rationale: ἐκ pamoja na jina la mama huonyesha kwamba Tamari ndiye aliyewazaa watoto hao. “Kwa Tamari” ni muundo mfupi wa nasaba unaohifadhi kutajwa kwa mama bila kuongeza maelezo yasiyomo.
- source_word: Θαμάρ
  choice: Tamari
  rationale: Hili ni umbo la kawaida la Kiswahili la jina hili la kibiblia.
- source_word: Ἑσρώμ
  choice: Hezroni
  rationale: Jina hili linapatana na Kiebrania חֶצְרוֹן na kudumisha mwendelezo na majina ya Agano la Kale katika Kiswahili.
- source_word: Ἀράμ
  choice: Aramu
  rationale: Matini ya Kigiriki iliyotolewa inasomeka Ἀράμ, hivyo tafsiri inafuata moja kwa moja umbo “Aramu” badala ya kulipatanisha kimya na mapokeo yenye “Ramu”.
theological_decisions:
- issue: Iwapo jina la mwisho lipatanishwe na umbo linalojulikana katika nasaba ya Agano la Kale
  choice: Aramu
  alternative: Ramu
  rationale: Kipaumbele kimetolewa kwa matini ya Kigiriki ya SBLGNT, ambayo ina Ἀράμ. Umbo “Ramu” limehifadhiwa katika tanbihi kwa sababu wasomaji wanaweza kulifahamu kutoka Ruthu 4:19 au mapokeo mengine ya tafsiri.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini wa sasa. Muundo wa “akamzaa” umetumiwa kwa ufupi na mtiririko wa kawaida wa nasaba; “naye” huonyesha kuendelea kwa mlolongo bila kuleta wazo la upinzani.
