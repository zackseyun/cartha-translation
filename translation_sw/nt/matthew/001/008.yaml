id: MAT.1.8
reference: Matthew 1:8
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἀσὰφ⸃ δὲ ἐγέννησεν τὸν Ἰωσαφάτ, Ἰωσαφὰτ δὲ ἐγέννησεν τὸν Ἰωράμ, Ἰωρὰμ δὲ ἐγέννησεν τὸν Ὀζίαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/008.yaml
  text: Asaph fathered Jehoshaphat[a], Jehoshaphat fathered Joram, and Joram fathered Uzziah.
translation:
  language: sw
  text: Asafu akamzaa Yehoshafati[a], Yehoshafati akamzaa Yoramu, naye Yoramu akamzaa Uzia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati zina “Asa” badala ya “Asafu”; “Asa” pia ndilo jina la mfalme wa Yuda katika nasaba ya Agano la Kale.
    reason: textual_variant
lexical_decisions:
- source_word: Ἀσὰφ
  choice: Asafu
  rationale: Jina la Kigiriki lililo katika matini limetoholewa moja kwa moja kuwa “Asafu”; tofauti ya “Asa,” inayolingana na nasaba ya Agano la Kale, imewekwa katika tanbihi badala ya kusahihishwa kimya katika matini kuu.
- source_word: δὲ
  choice: aka- / naye
  rationale: Hapa δέ ni kiunganishi hafifu cha kuendeleza nasaba, si cha kuonyesha upinzani. Muundo wa Kiswahili wenye mfululizo wa aka- na “naye” unasomeka kwa kawaida huku ukihifadhi viungo vya nasaba.
- source_word: ἐγέννησεν
  choice: akamzaa
  rationale: Katika nasaba, kitenzi hiki kinaonyesha uhusiano wa baba katika mstari wa ukoo. “Akamzaa” ni kifupi, cha kawaida, na chenye hadhi katika Kiswahili cha Biblia.
- source_word: Ἰωσαφάτ
  choice: Yehoshafati
  rationale: Ni umbo la kawaida la Kiswahili la jina la mfalme wa Yuda, linalotambulika katika muktadha wa Agano la Kale.
- source_word: Ἰωράμ
  choice: Yoramu
  rationale: Umbo hili linafuata kwa karibu jina fupi la Kigiriki Ἰωράμ na matumizi ya kawaida ya majina ya kibiblia katika Kiswahili.
- source_word: Ὀζίαν
  choice: Uzia
  rationale: Ni umbo la kawaida na linalotambulika katika Kiswahili kwa jina la mfalme wa Yuda, badala ya utohozi wa karibu zaidi wa Kigiriki “Ozia.”
theological_decisions:
- issue: Namna ya kutafsiri mfululizo wa δὲ na ἐγέννησεν katika nasaba
  choice: Kutumia “akamzaa” kwa kila kiungo, pamoja na “naye” kabla ya kiungo cha mwisho.
  alternative: Kurudia “na ... akamzaa” katika kila kishazi.
  rationale: Uamuzi huu unafanya Kiswahili kisomeke kwa kawaida bila kuondoa kiungo chochote cha baba na mwana katika nasaba.
- issue: Iwapo Ἀσὰφ ipatanishwe na jina la kihistoria Asa katika matini kuu
  choice: Kuweka “Asafu” katika matini kuu na “Asa” katika tanbihi.
  alternative: Kutumia “Asa” katika matini kuu kwa kuipatanisha na nasaba ya Agano la Kale.
  rationale: Matini kuu inafuata umbo lililopo katika matini ya Kigiriki iliyotolewa, huku tanbihi ikihifadhi kwa uwazi tofauti ya hati na ulinganifu wake na nasaba ya Agano la Kale.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi, na rahisi kueleweka. Majina yametolewa kwa maumbo yanayotambulika katika matumizi ya Biblia ya Kiswahili, isipokuwa Asafu, ambapo umbo la matini ya Kigiriki limehifadhiwa kwa uwazi.
