  text: Πᾶσαι οὖν αἱ γενεαὶ ἀπὸ Ἀβραὰμ ἕως Δαυὶδ γενεαὶ δεκατέσσαρες, καὶ ἀπὸ Δαυὶδ ἕως τῆς μετοικεσίας Βαβυλῶνος γενεαὶ δεκατέσσαρες, καὶ ἀπὸ τῆς μετοικεσίας Βαβυλῶνος ἕως τοῦ χριστοῦ γενεαὶ δεκατέσσαρες.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/017.yaml
  text: So all the generations from Abraham to David were fourteen generations[a], and from David to the exile to Babylon fourteen generations[b], and from the exile to Babylon to the Messiah fourteen generations.
translation:
  language: sw
  text: Kwa hiyo, vizazi vyote tangu Abrahamu hadi Daudi ni vizazi kumi na vinne; tangu Daudi hadi kuhamishwa kwenda Babeli, vizazi kumi na vinne; na tangu kuhamishwa kwenda Babeli hadi Masihi[a], vizazi kumi na vinne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kristo.” Neno la Kigiriki Χριστός ni cheo chenye maana ya “Mtiwa-Mafuta.”
    reason: alternative_rendering
lexical_decisions:
- source_word: Πᾶσαι οὖν αἱ γενεαὶ
  choice: Kwa hiyo, jumla ya vizazi
  rationale: οὖν inaonyesha hitimisho au muhtasari, hivyo imetafsiriwa “Kwa hiyo.” “Jumla ya vizazi” huwasilisha Πᾶσαι αἱ γενεαὶ kwa Kiswahili cha kawaida bila kurudia kwa namna isiyo ya asili.
- source_word: γενεαὶ
  choice: vizazi
  rationale: Katika nasaba hii γενεά humaanisha vizazi vinavyofuatana, si watu wa kipindi kimoja tu.
- source_word: ἀπὸ ... ἕως
  choice: tangu ... hadi
  rationale: Muundo huu unaonyesha kipindi kati ya ncha mbili katika nasaba; “tangu ... hadi” ni wa kawaida na sahihi katika Kiswahili.
- source_word: μετοικεσίας Βαβυλῶνος
  choice: kuhamishwa kwenda Babeli
  rationale: μετοικεσία huelekeza kwenye kuondolewa kwa watu na kupelekwa uhamishoni. Kauli hii inahifadhi tendo la kulazimishwa kuhama pamoja na mahali walikopelekwa.
- source_word: τοῦ χριστοῦ
  choice: Masihi
  rationale: χριστός hapa ina kiambishi cha utambulisho na inatumika kama cheo katika kilele cha nasaba; “Masihi” hutafsiri maana ya cheo hicho badala ya kukitumia kama jina tu.
- source_word: γενεαὶ δεκατέσσαρες
  choice: vizazi kumi na vinne
  rationale: Kirai hiki kimerudiwa katika sehemu zote tatu ili kudumisha mpangilio na msisitizo wa chanzo.
theological_decisions:
- issue: Tafsiri ya Χριστός
  choice: Masihi
  alternative: Kristo
  rationale: Katika muktadha huu neno ni cheo cha yule aliyetiwa mafuta na ndiye kilele cha nasaba. “Masihi” hudhihirisha maana hiyo, huku tanbihi ikitaja tafsiri nyingine iliyozoeleka.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sehemu tatu na marudio ya “vizazi kumi na vinne” yamehifadhiwa, huku sehemu ya kwanza ikitumia “jumla” kuwasilisha wazi Πᾶσαι.
