id: MAT.1.9
reference: Matthew 1:9
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ὀζίας δὲ ἐγέννησεν τὸν Ἰωαθάμ, Ἰωαθὰμ δὲ ἐγέννησεν τὸν Ἀχάζ, Ἀχὰζ δὲ ἐγέννησεν τὸν Ἑζεκίαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/009.yaml
  text: Uzziah fathered Jotham[a], and Jotham fathered Ahaz, and Ahaz fathered Hezekiah,
translation:
  language: sw
  text: Uzia akamzaa Yothamu[a], Yothamu naye akamzaa Ahazi, na Ahazi akamzaa Hezekia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki ἐγέννησεν lina maana ya “alimzaa” au “alikuwa baba wa”; hapa “akamzaa” limetumiwa ili kudumisha mtindo mfupi unaorudiwa katika nasaba.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὀζίας
  choice: Uzia
  rationale: Jina limetolewa kwa umbo linalotumika kwa kawaida katika Biblia za Kiswahili na linalolingana na jina la mfalme huyo katika Agano la Kale.
- source_word: δὲ
  choice: naye / na
  rationale: Katika orodha hii δέ ni kiunganishi chepesi kinachoendeleza mfuatano. Kiswahili cha sasa hutumia “naye” au “na” kwa mtiririko wa kawaida bila kukipa uzito usio katika Kigiriki.
- source_word: ἐγέννησεν
  choice: akamzaa
  rationale: Katika nasaba, γεννάω huonyesha uhusiano wa uzazi kwa upande wa baba. “Akamzaa” ni usemi mfupi, wa kawaida na wenye hadhi katika Kiswahili, nao unadumisha urudiaji wa kimtindo wa nasaba.
- source_word: Ἰωαθάμ
  choice: Yothamu
  rationale: Hili ni umbo la kawaida la Kiswahili la jina la mfalme huyo wa Yuda.
- source_word: Ἀχάζ
  choice: Ahazi
  rationale: Hili ni umbo la kawaida la Kiswahili la jina hili la kibiblia.
- source_word: Ἑζεκίαν
  choice: Hezekia
  rationale: Hili ni umbo la kawaida la Kiswahili la jina la mfalme huyo wa Yuda.
theological_decisions:
- issue: Maana ya γεννάω katika nasaba
  choice: akamzaa
  alternative: alikuwa baba wa; alikuwa babu wa/mtangulizi wa ukoo wa
  rationale: Matini inatumia kanuni ileile ya nasaba kuonyesha mfuatano wa upande wa baba. “Akamzaa” huhifadhi maana ya wazi na mdundo wa kifungu bila kupanua kimafafanuzi kuwa uhusiano wa jumla wa ukoo, ingawa nasaba za kibiblia wakati mwingine zinaweza kuruka vizazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Majina yametolewa kwa maumbo yaliyozoeleka katika matumizi ya Biblia ya Kiswahili. Muundo wa kurudiwa wa nasaba umehifadhiwa, huku “naye” na “na” zikitumiwa kuleta mtiririko wa kawaida.
