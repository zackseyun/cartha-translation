  text: The book of the genealogy of Jesus the Messiah[a], the son of David[b], the son of Abraham.
translation:
  language: sw
  text: Kitabu cha nasaba[a] ya Yesu Masihi[b], mwana wa Daudi, mwana wa Abrahamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kitabu cha asili” au “kitabu cha kuzaliwa.” Neno la Kigiriki linaweza kuwa na maana pana ya asili au kuzaliwa, ingawa “nasaba” hufaa zaidi kwa orodha ya vizazi inayofuata.
    reason: alternative_reading
  - marker: b
    text: Au, “Kristo.” Neno la Kigiriki Χριστός ni cheo chenye maana ya “Mtiwa-Mafuta.”
    reason: alternative_reading
lexical_decisions:
- source_word: Βίβλος
  choice: Kitabu
  rationale: Neno hili linaweza kumaanisha kitabu, hati-kunjo, au kumbukumbu iliyoandikwa. Hapa linafanya kazi kama kichwa cha sehemu, na “Kitabu” kinadumisha mtindo rasmi na mwangwi wa maandiko.
- source_word: γενέσεως
  choice: cha ukoo
  rationale: Neno γένεσις linaweza kumaanisha asili, kuzaliwa, au ukoo. Kwa kuwa mara moja linafuatwa na orodha ya vizazi, “ukoo” ndilo chaguo linalofaa zaidi, huku maana pana ikihifadhiwa katika tanbihi.
- source_word: Ἰησοῦ
  choice: Yesu
  rationale: Jina limetolewa kwa umbo lake la kawaida katika Kiswahili.
- source_word: χριστοῦ
  choice: Masihi
  rationale: Χριστός hapa ni cheo cha Mtiwa-Mafuta, si jina la ukoo. “Masihi” huhifadhi mazingira yake ya Kiyahudi na ya kifalme.
- source_word: υἱοῦ Δαυὶδ
  choice: mwana wa Daudi
  rationale: Ingawa υἱός hapa humaanisha pia mzao, “mwana wa Daudi” huhifadhi usemi wa nasaba pamoja na uzito wake wa kifalme na wa kimasihi.
- source_word: υἱοῦ Ἀβραάμ
  choice: mwana wa Abrahamu
  rationale: Usemi halisi “mwana wa Abrahamu” huhifadhi mtindo wa nasaba na uhusiano wa agano; katika muktadha unamaanisha mzao.
theological_decisions:
- issue: Jinsi ya kutafsiri Χριστός
  choice: Masihi
  alternative: Kristo
  rationale: Neno hili linatumika kama cheo kinachomtambulisha Yesu kuwa Mtiwa-Mafuta aliyeahidiwa. “Masihi” huonyesha wazi zaidi cheo hicho; umbo la kimapokeo “Kristo” limeonyeshwa katika tanbihi.
- issue: Maana ya γενέσεως katika kichwa
  choice: ukoo
  alternative: asili au kuzaliwa
  rationale: Muktadha wa karibu ni orodha ya nasaba, hivyo “ukoo” unafaa katika maandishi makuu. Hata hivyo, uwezekano wa mwangwi mpana wa asili au kuzaliwa haujaondolewa, bali umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na wa kimaandiko lakini unaoeleweka kwa msomaji wa kawaida. Usemi “mwana wa” umehifadhiwa badala ya “mzao wa” ili kutunza muundo wa nasaba na uzito wa vyeo vya kibiblia.
