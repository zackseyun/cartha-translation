  text: τέξεται δὲ υἱὸν καὶ καλέσεις τὸ ὄνομα αὐτοῦ Ἰησοῦν, αὐτὸς γὰρ σώσει τὸν λαὸν αὐτοῦ ἀπὸ τῶν ἁμαρτιῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/021.yaml
  text: She will bear a son[a], and you shall call his name Jesus, for he will save his people from their sins.
translation:
  language: sw
  text: Atazaa mwana wa kiume[a], nawe utampa jina la Yesu, kwa maana yeye ndiye atakayewaokoa watu wake kutoka katika dhambi zao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jina Yesu ni umbo la Kigiriki linalohusiana na Yeshua, umbo fupi la jina la Kiebrania Yehoshua (Yoshua), na linahusishwa na wazo kwamba “Yahwe anaokoa.” Maelezo ya Mathayo, “kwa maana yeye ndiye atakayewaokoa,” yanaakisi mchezo huo wa maneno.
    reason: lexical_alternative
lexical_decisions:
- source_word: τέξεται
  choice: Atazaa
  rationale: Kitenzi hiki cha wakati ujao katika muktadha wa uzazi kinatafsiriwa kwa Kiswahili cha kawaida kama “atazaa,” kikihifadhi nguvu ya utabiri.
- source_word: δὲ
  choice: —
  rationale: δὲ ni kiunganishi hafifu; hakihitaji kutajwa wazi hapa kwa sababu sentensi ya Kiswahili inaendelea kwa kawaida bila “lakini” au “basi.”
- source_word: υἱὸν
  choice: mwana
  rationale: Katika taarifa hii ya kuzaliwa, “mwana” ni tafsiri ya kawaida na sahihi ya mwana wa kiume.
- source_word: καλέσεις τὸ ὄνομα αὐτοῦ
  choice: utamwita jina lake
  rationale: Hifadhi muundo wa Kiyunani wenye asili ya Kisemiti wa kumwita mtu jina, huku ukiendelea kueleweka katika Kiswahili.
- source_word: Ἰησοῦν
  choice: Yesu
  rationale: Hili ndilo umbo la kawaida la jina la mhusika wa Agano Jipya katika Kiswahili; tanbihi inaeleza uhusiano wake na maana ya kuokoa.
- source_word: αὐτὸς
  choice: yeye ndiye
  rationale: Muundo huu unaonyesha msisitizo wa kiwakilishi αὐτός kwamba mtoto huyu ndiye atakayefanya tendo la kuokoa, bila kuongeza maelezo ya kimafundisho.
- source_word: γὰρ
  choice: kwa maana
  rationale: Huanzisha sababu ya kupewa jina hilo na ni kiunganishi cha kawaida, chenye hadhi, katika Kiswahili.
- source_word: σώσει
  choice: atakayewaokoa
  rationale: “Kuokoa” linaonyesha moja kwa moja ukombozi kutoka katika dhambi na linadumisha uhusiano wa kimaana na jina Yesu.
- source_word: τὸν λαὸν αὐτοῦ
  choice: watu wake
  rationale: Hifadhi uhusiano wa umiliki bila kuufanya useme wazi Israeli pekee au wanadamu wote, jambo ambalo kifungu hiki hakifafanui.
- source_word: ἀπὸ τῶν ἁμαρτιῶν αὐτῶν
  choice: kutoka katika dhambi zao
  rationale: “Kutoka katika” huonyesha kutenganishwa au kuondolewa kunakobebwa na ἀπό, na wingi “dhambi” umehifadhiwa.
theological_decisions:
- issue: Msisitizo wa αὐτός kuhusu kazi ya Yesu ya kuokoa
  choice: yeye ndiye atakayewaokoa
  alternative: atawaokoa
  rationale: Kiyunani kinaweka kiwakilishi wazi na kwa msisitizo. “Yeye ndiye” kinahifadhi uzito huo kwamba Yesu mwenyewe ndiye mtendaji wa wokovu bila kufafanua zaidi ya maandishi.
- issue: Upeo wa maana ya “watu wake”
  choice: watu wake
  alternative: watu wake Israeli; watu wote walio wake
  rationale: Muktadha wa karibu una asili ya Kiyahudi na ya agano, lakini mstari huu hauufafanui zaidi upeo wa usemi huo. Tafsiri inaacha jambo hilo kwa muktadha mpana badala ya kuliamua ndani ya mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “utamwita jina lake” umechaguliwa ili kuhifadhi kauli ya kutaja jina ya maandishi ya asili; “yeye ndiye” huhifadhi msisitizo wa αὐτός.
