  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ταῦτα δὲ αὐτοῦ ἐνθυμηθέντος ἰδοὺ ἄγγελος κυρίου κατ’ ὄναρ ἐφάνη αὐτῷ λέγων· Ἰωσὴφ υἱὸς Δαυίδ, μὴ φοβηθῇς παραλαβεῖν ⸀Μαρίαν τὴν γυναῖκά σου, τὸ γὰρ ἐν αὐτῇ γεννηθὲν ἐκ πνεύματός ἐστιν ἁγίου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/020.yaml
  text: But as he was considering these things, behold, an angel of the Lord appeared to him in a dream, saying, “Joseph, son of David, do not be afraid to take Mary as your wife, for what has been conceived in her is from the Holy Spirit.”
translation:
  language: sw
  text: Lakini alipokuwa akiyatafakari mambo hayo, tazama, malaika wa Bwana alimtokea katika ndoto, akisema, “Yosefu, mwana wa Daudi, usiogope kumchukua Maria kuwa mke wako,[a] kwa maana kile kilichotungwa ndani yake kimetokana na Roho Mtakatifu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kumchukua Maria, mke wako.” Usemi wa Kigiriki unamaanisha kumpokea nyumbani mwako katika ndoa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνθυμηθέντος
  choice: alipokuwa akiyatafakari
  rationale: Huwasilisha tafakari ya ndani inayoendelea bila kudokeza kwamba Yosefu alikuwa tayari amefikia uamuzi wa mwisho.
- source_word: ἰδοὺ
  choice: tazama
  rationale: Imehifadhiwa kama kiashiria cha msisitizo na mgeuko wa ghafla katika simulizi.
- source_word: ἄγγελος κυρίου
  choice: malaika wa Bwana
  rationale: Kutokuwapo kwa kibainishi mbele ya ἄγγελος hakulazimishi utambulisho maalumu wa 'Malaika wa Bwana'; Kiswahili kwa kawaida hakihitaji kibainishi kisicho dhahiri.
- source_word: κατ’ ὄναρ
  choice: katika ndoto
  rationale: Ni usemi wa kawaida na wa asili wa Kiswahili kwa tukio lililotokea ndani ya ndoto.
- source_word: ἐφάνη
  choice: alimtokea
  rationale: Ni tafsiri ya kawaida ya kuonekana kwa namna ya ufunuo, huku kiambishi cha mtendewa kikimtaja Yosefu.
- source_word: υἱὸς Δαυίδ
  choice: mwana wa Daudi
  rationale: Huhifadhi maana ya ukoo wa Daudi pamoja na mwangwi wake wa Kimasihi.
- source_word: μὴ φοβηθῇς
  choice: usiogope
  rationale: Ni katazo la moja kwa moja, la kawaida, na lenye maana sawa katika Kiswahili.
- source_word: παραλαβεῖν Μαρίαν τὴν γυναῖκά σου
  choice: kumchukua Maria kuwa mke wako
  rationale: Huwasilisha kwa Kiswahili cha kawaida tendo la kumpokea Maria katika nyumba na maisha ya ndoa, ingawa Kigiriki pia kinaweza kueleweka kwa karibu zaidi kama 'kumchukua Maria, mke wako.'
- source_word: τὸ ἐν αὐτῇ γεννηθὲν
  choice: mimba iliyo ndani yake
  rationale: Katika muktadha huu wa kabla ya kuzaliwa, Kiswahili cha kawaida hutumia 'mimba'; usemi huu haumlazimishi msomaji kuelewa kuwa kinachorejelewa ni mchakato tu badala ya mtoto aliyepo tumboni.
- source_word: ἐκ πνεύματός ἐστιν ἁγίου
  choice: imetokana na Roho Mtakatifu
  rationale: Huhifadhi ἐκ kama chanzo au asili na kumtambulisha Roho Mtakatifu kwa lugha ya kawaida ya Kiswahili.
theological_decisions:
- issue: Maana ya κυρίου katika ἄγγελος κυρίου
  choice: Bwana
  alternative: BWANA/YHWH au utambulisho maalumu wa 'Malaika wa Bwana'
  rationale: Kifungu kimetafsiriwa moja kwa moja bila kuingiza kwa lazima utambulisho wa kiteofania usioelezwa wazi na muundo wa Kigiriki.
- issue: Rejeo la πνεύματός ... ἁγίου
  choice: Roho Mtakatifu
  alternative: roho takatifu au nguvu ya Roho Mtakatifu
  rationale: Katika simulizi la Mathayo, usemi huu unaonyesha chanzo cha kimungu kinachotambulishwa kama Roho Mtakatifu, si nguvu isiyo na nafsi wala roho fulani isiyojulikana.
- issue: Hali ya ndoa katika παραλαβεῖν Μαρίαν τὴν γυναῖκά σου
  choice: kumchukua Maria kuwa mke wako
  alternative: kumchukua Maria, mke wako
  rationale: Chaguo kuu ni la asili katika Kiswahili na linaonyesha kumpokea katika maisha ya ndoa; tanbihi huhifadhi uwezekano wa muundo wa karibu zaidi, ambao unamwita Maria tayari 'mke wako' katika muktadha wa uchumba wa kisheria.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la Maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. 'Tazama' limehifadhiwa kwa msisitizo wa ἰδοὺ; tanbihi imewekwa mara baada ya kirai kinachohusika.
