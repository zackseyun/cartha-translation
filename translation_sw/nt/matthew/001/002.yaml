source:
  edition: SBLGNT
  text: Ἀβραὰμ ἐγέννησεν τὸν Ἰσαάκ, Ἰσαὰκ δὲ ἐγέννησεν τὸν Ἰακώβ, Ἰακὼβ δὲ ἐγέννησεν τὸν Ἰούδαν καὶ τοὺς ἀδελφοὺς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/002.yaml
  text: Abraham fathered Isaac[a], and Isaac fathered Jacob, and Jacob fathered Judah and his brothers,
translation:
  language: sw
  text: Abrahamu akamzaa Isaka, Isaka naye akamzaa Yakobo, Yakobo naye akamzaa Yuda na ndugu zake wa kiume.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγέννησεν
  choice: akamzaa
  rationale: Katika nasaba, γεννάω humaanisha kuwa baba wa mtu au kuendeleza ukoo kupitia mwana. “Akamzaa” ni usemi wa kawaida na wenye hadhi katika Kiswahili cha Biblia; unahifadhi nguvu ya upande wa baba bila kulazimisha kwamba kila kiungo cha nasaba lazima kiwe kizazi cha moja kwa moja.
- source_word: δὲ
  choice: naye
  rationale: Hapa δέ ni kiunganishi hafifu kinachoendeleza mfululizo, si alama ya upinzani. “Naye” huleta mtiririko wa asili na kuonyesha mhusika anayefuata.
- source_word: Ἰούδαν
  choice: Yuda
  rationale: Huyu ni Yuda mwana wa Yakobo, mkuu wa ukoo wa kale; “Yuda” ndilo umbo la kawaida la jina hili katika Kiswahili.
- source_word: ἀδελφοὺς αὐτοῦ
  choice: ndugu zake wa kiume
  rationale: Kirai hiki kinawahusu wana wengine wa Yakobo. Kuongeza “wa kiume” huondoa utata wa neno la Kiswahili “ndugu,” ambalo peke yake linaweza kumaanisha kaka, dada, au jamaa mwingine.
- source_word: Ἀβραὰμ / Ἰσαάκ / Ἰακώβ
  choice: Abrahamu / Isaka / Yakobo
  rationale: Majina yametolewa kwa maumbo yaliyozoeleka katika Kiswahili sanifu cha Biblia.
theological_decisions:
- issue: Tafsiri ya kitenzi cha nasaba
  choice: Kutumia “akamzaa” katika mfululizo wote
  alternative: Kutumia “akawa baba ya” au “alimzaa”
  rationale: “Akamzaa” ni fupi, ya asili, na hudumisha mfuatano wa nasaba wa Kigiriki. Haiongezi dai kwamba nasaba haiwezi kuruka kizazi, kwa kuwa lugha ya nasaba inaweza kumtaja babu kama aliyemzaa mzao wake.
- issue: Utambulisho wa ndugu za Yuda
  choice: “ndugu zake wa kiume”
  alternative: “ndugu zake”
  rationale: Kigiriki kinatumia umbo la kiume na muktadha unawahusu wana wengine wa Yakobo. Tafsiri iliyochaguliwa inalinda umahususi huo bila kubadili maana kuwa jamaa kwa jumla.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa “akamzaa” unafaa mfululizo wa simulizi ya nasaba, huku “naye” ukiepuka urudiaji mzito wa “na.”
