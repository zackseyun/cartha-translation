id: MAT.1.14
reference: Matthew 1:14
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἀζὼρ δὲ ἐγέννησεν τὸν Σαδώκ, Σαδὼκ δὲ ἐγέννησεν τὸν Ἀχίμ, Ἀχὶμ δὲ ἐγέννησεν τὸν Ἐλιούδ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/014.yaml
  text: Azor fathered Zadok, Zadok fathered Achim, and Achim fathered Eliud.
translation:
  language: sw
  text: Azori akamzaa Sadoki, Sadoki akamzaa Akimu, naye Akimu akamzaa Eliudi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀζώρ
  choice: Azori
  rationale: Jina limetoholewa kwa tahajia na matamshi yanayoeleweka katika Kiswahili, kwa kuzingatia umbo la Kigiriki.
- source_word: δέ
  choice: aka- / naye
  rationale: Katika nasaba, δέ ni kiunganishi cha kuendeleza mfululizo. Kiambishi simulizi “aka-” huunganisha hatua kwa kawaida katika Kiswahili, huku “naye” katika kishazi cha mwisho kikidumisha wazi uhusiano wa mfululizo bila kurudia viunganishi visivyo vya lazima.
- source_word: ἐγέννησεν
  choice: akamzaa
  rationale: Katika muktadha wa nasaba, kitenzi hiki hueleza kuzaa au kuwa baba wa mtu. “Akamzaa” ni kifupi, cha kawaida, na hudumisha muundo wa moja kwa moja wa maandishi ya Kigiriki bila kutumia lugha ya kizamani.
- source_word: τὸν
  choice: (hakijatafsiriwa kando)
  rationale: Nakala ya Kigiriki hutumia kibainishi cha yambwa kabla ya majina, lakini Kiswahili hakihitaji kibainishi hicho pamoja na majina ya watu katika muundo huu.
- source_word: Σαδώκ
  choice: Sadoki
  rationale: Jina limetoholewa moja kwa moja kutoka umbo la Kigiriki kwa tahajia inayofaa Kiswahili.
- source_word: Ἀχίμ
  choice: Akimu
  rationale: Jina limetoholewa kutoka umbo la Kigiriki kwa tahajia na matamshi ya Kiswahili.
- source_word: Ἐλιούδ
  choice: Eliudi
  rationale: Jina limetoholewa kutoka umbo la Kigiriki kwa tahajia na matamshi ya Kiswahili.
theological_decisions:
- issue: Maana ya ἐγέννησεν katika nasaba
  choice: akamzaa
  alternative: akawa baba yake / akamzaa katika ukoo
  rationale: “Akamzaa” huhifadhi usemi wa moja kwa moja wa chanzo bila kuamua kimyakimya ikiwa kila kiungo lazima kiwe cha baba na mwana wa kizazi kinachofuatana mara moja; nasaba za kale zinaweza kutumia lugha ya kuzaa kwa uhusiano mpana wa ukoo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa maandiko. Muundo wa kurudiwa wa nasaba umehifadhiwa, huku “naye” ikifanya kishazi cha mwisho kisomeke kwa urahisi.
