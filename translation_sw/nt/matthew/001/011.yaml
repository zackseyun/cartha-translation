  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἰωσίας δὲ ἐγέννησεν τὸν Ἰεχονίαν καὶ τοὺς ἀδελφοὺς αὐτοῦ ἐπὶ τῆς μετοικεσίας Βαβυλῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/011.yaml
  text: Josiah fathered Jeconiah and his brothers at the time of the deportation to Babylon[a].
translation:
  language: sw
  text: Yosia akamzaa Yekonia na ndugu zake wakati wa kuhamishwa kwa lazima kwenda Babeli.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakati wa uhamisho kwenda Babeli.” Neno la Kigiriki linaweza kumaanisha kuhamishwa kwa lazima au uhamisho; “kuhamishwa kwa lazima” hukazia kwamba watu waliondolewa kwa nguvu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγέννησεν
  choice: akamzaa
  rationale: Katika nasaba, kitenzi γεννάω kinaonyesha uhusiano wa uzazi au ukoo kutoka kwa upande wa baba. “Akamzaa” ni usemi mfupi, wa kawaida katika nasaba za Kiswahili, na hauondoi uwezekano wa ufupishaji wa vizazi.
- source_word: Ἰεχονίαν
  choice: Yekonia
  rationale: Jina limetoholewa kwa tahajia inayosomeka kwa urahisi katika Kiswahili huku likifuata umbo la Kigiriki Ἰεχονίας.
- source_word: ἀδελφοὺς αὐτοῦ
  choice: ndugu zake
  rationale: “Ndugu zake” ni usemi wa asili katika Kiswahili. Ingawa “ndugu” peke yake inaweza kujumuisha jinsia zote, muktadha na umbo la Kigiriki la kiume wingi huelekeza kwa ndugu wa kiume.
- source_word: ἐπὶ τῆς μετοικεσίας Βαβυλῶνος
  choice: wakati wa kuhamishwa kwa lazima kwenda Babeli
  rationale: μετοικεσία humaanisha kuondolewa au kuhamishwa, hasa uhamisho wa kulazimishwa. “Wakati wa” huonyesha matumizi ya muda ya ἐπί pamoja na genitivi, na “kwenda Babeli” huonyesha mahali walikopelekwa.
- source_word: δὲ
  choice: '[halijatafsiriwa kwa neno tofauti]'
  rationale: δέ ni kiunganishi hafifu katika mfululizo wa nasaba. Muendelezo unaonyeshwa kiasili na “aka-” katika “akamzaa,” hivyo neno jingine la kiunganishi halihitajiki.
theological_decisions:
- issue: Ufupishaji wa vizazi katika nasaba ya Mathayo
  choice: Kutafsiri kauli ya nasaba kama ilivyo bila kutatua maswali ya kihistoria ndani ya matini kuu
  alternative: Kufafanua γεννάω waziwazi kuwa uhusiano wa babu na mzao badala ya ubaba wa moja kwa moja
  rationale: Nasaba inaweza kuruka vizazi, lakini tafsiri inapaswa kudumisha fomula ya Kigiriki. “Akamzaa” inaakisi kauli ya chanzo bila kuongeza maelezo ya kuoanisha historia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa “aka-” unafaa mfululizo wa masimulizi ya nasaba. “Kuhamishwa kwa lazima” ni wazi kwa msomaji wa kawaida na huhifadhi uzito wa kihistoria wa tukio.
