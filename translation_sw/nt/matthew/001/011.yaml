  naturalness: The text is clear, idiomatic Standard East African Swahili, with the narrative/genealogical aka- form sounding natural. “Kuhamishwa kwa lazima” is readily understandable and suitably dignified.
  terminology: Yosia, Yekonia, Babeli, and the genealogical expression are appropriate. The note accurately presents “uhamisho” as a viable less-specific alternative and explains the main wording’s emphasis on coercion. “Ndugu zake” is the natural Swahili rendering in this context; although Swahili does not overtly mark the masculine plural here, the source’s reference is not distorted.
