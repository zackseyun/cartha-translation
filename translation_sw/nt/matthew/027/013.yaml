  text: Then Pilate says to him[a], “Do you not hear how many things they are testifying against you?”
translation:
  language: sw
  text: Ndipo Pilato akamwambia, “Je, husikii mambo mangapi wanayotoa ushahidi dhidi yako[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “wanavyokushuhudia” au “wanavyoshuhudia dhidi yako.” Kitenzi cha Kigiriki kina maana ya kutoa ushahidi dhidi ya mtu, hasa katika mazingira ya kisheria.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Ndipo
  rationale: Ni kiunganishi cha wakati kinachoendeleza mfululizo wa simulizi kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: λέγει αὐτῷ ὁ Πιλᾶτος
  choice: Pilato akamwambia
  rationale: Muundo wa Kiswahili wenye kiambishi -ka- unaonyesha tukio linalofuata kwa uhai wa kisimulizi; kiambishi -mw- kinahifadhi maana ya ‘kwake’ bila kulazimika kutaja Yesu badala ya kiwakilishi.
- source_word: Οὐκ ἀκούεις
  choice: Je, husikii
  rationale: Inahifadhi swali hasi na maana ya msingi ya kusikia; ‘Je’ hufanya swali lisomeke kwa uwazi katika rejesta rasmi ya kawaida.
- source_word: πόσα
  choice: mambo mengi
  rationale: Neuta ya wingi inarejelea wingi wa mambo yanayosemwa. Kiswahili hiki ni cha asili zaidi kuliko ‘ni mambo mangapi’ katika muundo huu, huku kikihifadhi msisitizo wa wingi bila kuongeza neno ‘mashtaka.’
- source_word: καταμαρτυροῦσιν σου
  choice: wanayotoa ushahidi dhidi yako
  rationale: Inahifadhi maana ya kisheria ya kutoa ushahidi unaompinga mtu. ‘Dhidi yako’ huweka wazi nguvu ya uadui iliyomo katika kitenzi pamoja na nomino ya Kigiriki.
