translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa urahisi. Wakati uliopo wa kihistoria wa Kigiriki umetolewa kwa muundo wa kisimulizi ‘akamwambia,’ ambao ni wa asili katika Kiswahili na unaendeleza tukio kwa uhai.
