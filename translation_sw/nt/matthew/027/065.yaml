  yaml_path: translation/nt/matthew/027/065.yaml
  text: Pilate said to them[a], “You have a guard. Go[b], make it secure as you know how.”
translation:
  language: sw
  text: Pilato akawaambia[a], “Mna kikosi cha walinzi. Nendeni[b], mkalilinde kadiri mjuavyo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Chukueni kikosi cha walinzi,” au labda “Mna kikosi chenu wenyewe cha walinzi.” Kigiriki kinaweza kumaanisha kwamba Pilato aliwapa walinzi au kwamba alirejelea walinzi waliokuwa tayari wanapatikana kwao.
