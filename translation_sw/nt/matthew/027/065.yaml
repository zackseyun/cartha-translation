lexical_decisions:
- source_word: ἔφη
  choice: akawaambia
  rationale: Kitenzi cha kawaida cha kusimulia usemi; hapa muundo huu wa Kiswahili unaunganisha kwa kawaida msemaji na walengwa wa maneno yake.
- source_word: αὐτοῖς
  choice: -waambia
  rationale: Kiambishi -wa- kinaonyesha kwamba Pilato alisema maneno hayo kwao.
- source_word: Ἔχετε
  choice: Mna
  rationale: Huhifadhi maana ya moja kwa moja ya kitenzi cha wakati uliopo, huku muktadha ukiruhusu kisikike ama kama kuwapa walinzi ama kama kutaja walinzi waliokuwa tayari wanapatikana.
- source_word: κουστωδίαν
  choice: kikosi cha walinzi
  rationale: Neno la mkopo kutoka Kilatini linaashiria walinzi waliowekwa zamu; “kikosi cha walinzi” huepuka kueleweka kama mtu mmoja tu.
- source_word: ὑπάγετε
  choice: Nendeni
  rationale: Amri ya kuondoka au kuelekea kufanya jambo fulani; “Nendeni” ni fupi na ya kawaida.
- source_word: ἀσφαλίσασθε
  choice: mkalifanye kaburi kuwa salama
  rationale: Hutoa maana ya kulifanya kaburi lisifikiwe au kuvurugwa kwa urahisi. Nomino “kaburi” imetajwa wazi kwa kuwa kiwakilishi kisicho na rejeo la kisarufi kingekuwa kigumu katika Kiswahili.
- source_word: ὡς οἴδατε
  choice: kadiri mjuavyo
  rationale: Huhifadhi wazo la kutenda kulingana na ujuzi au uwezo wao bila kulipanua kuwa “kwa uwezo wenu wote.”
theological_decisions:
- issue: Ikiwa Ἔχετε κουστωδίαν inamaanisha Pilato aliwapa walinzi Waroma au alirejelea walinzi ambao viongozi tayari walikuwa nao
  choice: Mna kikosi cha walinzi
  alternative: Chukueni kikosi cha walinzi; au Mna kikosi chenu wenyewe cha walinzi
  rationale: Muundo wa Kigiriki unaweza kueleweka kama ruhusa au agizo la kuchukua walinzi, au kama taarifa kwamba walinzi tayari walipatikana. Tafsiri kuu inahifadhi hali hiyo ya kutokuwa na uhakika, na tanbihi inaonyesha uwezekano mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. “Kikosi cha walinzi” kinafafanua kwamba κουστωδίαν ni kundi la walinzi, na “kaburi” limerudiwa kwa uwazi wa kawaida wa Kiswahili.
