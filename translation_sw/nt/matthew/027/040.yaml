base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/040.yaml
  text: and saying[a], “You who would destroy the temple and build it in three days, save yourself! If you are the Son of God, come down from the cross.”
translation:
  language: sw
  text: wakisema, “Wewe unayebomoa hekalu na kulijenga[a] kwa siku tatu, jiokoe mwenyewe! Ikiwa wewe ni Mwana wa Mungu, shuka kutoka msalabani.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kulijenga upya.” Kitenzi cha Kigiriki chenyewe ni “kujenga,” ingawa muktadha wa dhihaka unaweza kudokeza kujenga upya.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: wakisema
  rationale: Kirai endelevu cha kishiriki kinaunganisha kitendo hiki na simulizi lililotangulia bila kutaja upya wahusika.
- source_word: Ὁ καταλύων
  choice: Wewe unayelibomoa
  rationale: Kifungu chenye kibainishi na kishiriki kinatumika kama mwito wa moja kwa moja katika dhihaka; muundo huu unahifadhi hilo kwa Kiswahili cha kawaida.
- source_word: καταλύω
  choice: libomoa
  rationale: Kwa jengo kama hekalu, ‘kubomoa’ huonyesha kuvunja au kuangusha jengo kwa usahihi na kwa lugha ya kawaida.
- source_word: ναός
  choice: hekalu
  rationale: Ingawa neno linaweza kumaanisha hasa patakatifu pa ndani, katika dhihaka hii ‘hekalu’ ndilo neno la kawaida na linaloeleweka vizuri.
- source_word: ἐν τρισὶν ἡμέραις
  choice: kwa siku tatu
  rationale: Ni usemi wa kawaida wa Kiswahili unaodumisha kipindi cha siku tatu bila kukifafanua zaidi ya chanzo.
- source_word: οἰκοδομῶν
  choice: kulijenga
  rationale: Kitenzi cha Kigiriki ni ‘kujenga’; kiwakilishi ‘-li-’ kinarejelea hekalu. Maana ya ‘kulijenga upya’ inawezekana kutokana na muktadha lakini haijawekwa wazi katika kitenzi chenyewe.
- source_word: σῶσον σεαυτόν
  choice: jiokoe mwenyewe
  rationale: Amri pamoja na kiwakilishi rejeshi imetafsiriwa moja kwa moja, ikihifadhi changamoto ya kejeli.
- source_word: εἰ υἱὸς εἶ τοῦ θεοῦ
  choice: Ikiwa wewe ni Mwana wa Mungu
  rationale: Inahifadhi sharti la dhihaka na cheo cha Kikristo bila kupunguza wala kupanua maana yake.
- source_word: κατάβηθι ἀπὸ τοῦ σταυροῦ
  choice: shuka kutoka msalabani
  rationale: Inawakilisha amri ya kushuka na kihusishi kinachoonyesha kuondoka pale msalabani.
theological_decisions:
- issue: Tafsiri ya cheo υἱὸς τοῦ θεοῦ katika muktadha wa dhihaka
  choice: Mwana wa Mungu
  alternative: Mwana wa Mungu wewe / mwana wa Mungu
  rationale: Cheo kinahifadhiwa moja kwa moja na kwa herufi kubwa kulingana na rejeo lake kwa Yesu, huku maneno yakiendelea kuwa changamoto inayotolewa na wenye kumdhihaki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa dhihaka umehifadhiwa kwa maneno ya moja kwa moja; hakuna ufafanuzi wa kimadhehebu ulioongezwa.
