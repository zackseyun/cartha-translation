  text: καὶ οὐκ ἀπεκρίθη αὐτῷ πρὸς οὐδὲ ἓν ῥῆμα, ὥστε θαυμάζειν τὸν ἡγεμόνα λίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/014.yaml
  text: And he did not answer him with even one word[b][a], so that the governor was greatly amazed.
translation:
  language: sw
  text: Naye hakumjibu hata neno moja[a], hivyo gavana akashangaa sana.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hakumjibu hata kwa neno moja.”
    reason: lexical_alternative
  - marker: b
    text: Au, “hivyo gavana alistaajabu sana.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἀπεκρίθη αὐτῷ
  choice: hakumjibu
  rationale: Kitenzi ‘kumjibu’ ni cha kawaida na cha moja kwa moja katika Kiswahili, nacho kinabeba maana ya kutompa jibu mtu aliyetajwa kwa kiwakilishi αὐτῷ.
- source_word: πρὸς οὐδὲ ἓν ῥῆμα
  choice: hata neno moja
  rationale: Kauli hii inahifadhi msisitizo wa οὐδὲ ἕν kwamba Yesu hakutoa jibu lolote kabisa, huku ‘neno’ likitoa maana ya kawaida ya ῥῆμα katika muktadha huu.
- source_word: ὥστε
  choice: hata
  rationale: Katika muundo ‘hata ... akashangaa,’ neno hili linaonyesha matokeo ya ukimya wa Yesu kwa njia ya asili katika Kiswahili.
- source_word: θαυμάζειν
  choice: akashangaa
  rationale: ‘Akashangaa’ linaeleza mwitikio uliotokana na kutopata jibu, bila kuongeza sababu au aina ya mshangao.
- source_word: τὸν ἡγεμόνα
  choice: gavana
  rationale: Katika mazingira ya utawala wa Kirumi, ἡγεμών humaanisha gavana, hapa akiwa Pilato.
- source_word: λίαν
  choice: sana
  rationale: ‘Sana’ ni kielezi cha kawaida kinachohifadhi kiwango kikubwa cha mshangao kinachoonyeshwa na λίαν.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. ‘Lakini’ linaunganisha mstari na muktadha uliotangulia, ambapo Pilato anamtaka Yesu ajibu mashtaka.
