lexical_decisions:
- source_word: ἐλθόντες
  choice: Walipofika
  rationale: Kitenzi tegemezi cha wakati uliopita kinaelezwa kwa kishazi cha wakati kinachosikika kwa kawaida katika simulizi la Kiswahili.
- source_word: τόπον
  choice: mahali
  rationale: Neno hili humaanisha mahali; Kiswahili hakihitaji kibainishi kinacholingana moja kwa moja na a/the.
- source_word: λεγόμενον
  choice: paitwapo
  rationale: Katika muktadha wa jina la mahali, maana ni kuitwa au kujulikana kwa jina fulani; umbo hili ni la asili na lenye hadhi.
- source_word: Γολγοθᾶ
  choice: Golgotha
  rationale: Jina la mahali limetoholewa kwa herufi za Kiswahili badala ya kutafsiriwa.
- source_word: ὅ ἐστιν
  choice: maana yake
  rationale: Kauli hii inafafanua maana ya jina Golgotha kwa wasomaji, si tu utambulisho wa mahali.
- source_word: Κρανίου Τόπος
  choice: Mahali pa Fuvu la Kichwa
  rationale: Tafsiri hii huhifadhi vipashio vya Kigiriki vya 'mahali' na 'fuvu la kichwa' bila kuongeza kwa lazima uhusiano wa umilikaji usioelezwa.
- source_word: λεγόμενος
  choice: imeelezwa ndani ya kishazi 'maana yake'
  rationale: Kurudia 'paitwapo' ndani ya ufafanuzi kungekuwa kuzito kwa Kiswahili; maana ya utajo imebebwa kwa kawaida na kishazi cha ufafanuzi.
