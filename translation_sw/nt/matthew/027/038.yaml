  text: Then two robbers are crucified with him[a], one on the right and one on the left.
translation:
  language: sw
  text: 'Ndipo wanyang’anyi wawili[a] wakasulubiwa pamoja naye: mmoja upande wa kulia na mmoja upande wa kushoto.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “majambazi”; neno la Kigiriki linaweza kumaanisha wanyang’anyi wanaotumia nguvu na, katika baadhi ya mazingira, linaweza pia kuhusishwa na shughuli za uasi.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Ndipo
  rationale: Kielezi hiki kinaonyesha tukio linalofuata katika mfululizo wa simulizi; “Ndipo” ni cha asili na kifupi katika Kiswahili.
- source_word: σταυροῦνται
  choice: wakasulubiwa
  rationale: Ni kitenzi cha wakati uliopo, hali ya kutendwa, kilichotumiwa katika simulizi. Kiswahili hutumia kwa kawaida wakati wa mfululizo wa matukio (“waka-”), huku hali ya kutendwa ikihifadhiwa.
- source_word: σὺν αὐτῷ
  choice: pamoja naye
  rationale: σύν pamoja na hali ya dative huonyesha kuwa waliambatana naye katika kusulubiwa; “pamoja naye” ni wazi na ya asili.
- source_word: δύο λῃσταί
  choice: wanyang’anyi wawili
  rationale: λῃστής humaanisha mnyang’anyi au jambazi, mara nyingi mwenye kutumia nguvu. “Wanyang’anyi” ni tafsiri pana isiyolazimisha maana maalumu ya kisiasa.
- source_word: εἷς ἐκ δεξιῶν
  choice: mmoja upande wake wa kulia
  rationale: Ni usemi wa nafasi unaomaanisha mmoja alikuwa upande wa kulia wa Yesu; kiwakilishi “wake” kinaweka uhusiano huo wazi kwa Kiswahili cha kawaida.
- source_word: καὶ εἷς ἐξ εὐωνύμων
  choice: na mwingine upande wake wa kushoto
  rationale: Ingawa Kigiriki hurudia εἷς (“mmoja”), Kiswahili cha asili hutumia “mwingine” kwa mtu wa pili katika jozi; maana ya nafasi upande wa kushoto imehifadhiwa.
theological_decisions:
- issue: Utambulisho wa λῃσταί
  choice: wanyang’anyi
  alternative: majambazi; waasi
  rationale: Neno hilo linaweza kumaanisha wanyang’anyi au majambazi wenye kutumia nguvu, na katika baadhi ya mazingira linaweza kuhusishwa na uasi. Hata hivyo, mstari huu peke yake hauthibitishi maana hiyo nyembamba ya kisiasa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa “waka-” unatoa mwendelezo wa asili wa simulizi, na “wakasulubiwa” ni istilahi ya kawaida na sahihi ya kibiblia.
