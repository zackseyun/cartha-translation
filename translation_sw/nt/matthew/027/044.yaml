  text: In the same way[b][a], even the robbers who had been crucified with him were insulting him.
translation:
  language: sw
  text: Vivyo hivyo[a], hata wale wanyang’anyi waliosulubiwa pamoja naye walikuwa wakimtukana[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Walifanya jambo lilelile.” Maana yake ni kwamba wao pia walimtukana kwa namna ileile.
    reason: lexical_alternative
  - marker: b
    text: Au, “walikuwa wakimkashifu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ δ’ αὐτὸ
  choice: Vivyo hivyo
  rationale: Kirai hiki kinatumika kiadverbia na kurejelea aina ileile ya dhihaka iliyoelezwa katika mistari iliyotangulia. “Vivyo hivyo” ni Kiswahili cha kawaida na cha asili.
- source_word: καὶ
  choice: hata
  rationale: Katika muktadha huu καί ina nguvu ya kusisitiza kwamba wanyang’anyi pia walijiunga na wengine; “hata” huonyesha msisitizo huo.
- source_word: λῃσταὶ
  choice: wanyang’anyi
  rationale: Neno hili humaanisha wanyang’anyi au majambazi. “Wanyang’anyi” ni wazi na haliongezi dhana ya kisiasa isiyothibitishwa na mstari.
- source_word: οἱ συσταυρωθέντες σὺν αὐτῷ
  choice: wale ... waliosulubiwa pamoja naye
  rationale: Kirai kishirikishi kinawatambulisha wanyang’anyi kuwa watu waliosulubiwa kando ya Yesu, huku kikihifadhi hali ya kutendwa.
- source_word: ὠνείδιζον
  choice: walikuwa wakimtukana
  rationale: Muundo wa wakati usiotimilika unaonyesha tendo lililokuwa likiendelea. “Walikuwa wakimtukana” ni ya kawaida na hudumisha maana hiyo.
- source_word: αὐτόν
  choice: -m- katika “wakimtukana”
  rationale: Kiambishi cha yambwa kinamrejelea Yesu moja kwa moja.
theological_decisions:
- issue: Iwapo simulizi lioanishwe na maelezo ya Luka kuhusu mmoja wa wahalifu kusema tofauti
  choice: Kauli ya Mathayo imetafsiriwa kwa wingi bila kuwekewa sifa ya kupunguza maana yake.
  alternative: Kupunguza nguvu ya wingi ili kupatanisha waziwazi na simulizi la Luka.
  rationale: Kigiriki kinatumia nomino ya wingi na kitenzi cha wingi. Tafsiri inapaswa kuhifadhi kauli ya Mathayo na mvutano uliopo kati ya masimulizi bila kuutatua kimyakimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Muundo “walikuwa wakimtukana” umechaguliwa kuonyesha tendo lililoendelea.
