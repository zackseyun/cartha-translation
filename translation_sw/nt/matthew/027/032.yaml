id: MAT.27.32
reference: Matthew 27:32
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἐξερχόμενοι δὲ εὗρον ἄνθρωπον Κυρηναῖον ὀνόματι Σίμωνα· τοῦτον ἠγγάρευσαν ἵνα ἄρῃ τὸν σταυρὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/032.yaml
  text: And as they were going out[a], they found a man of Cyrene named Simon[b]. They compelled him to carry his cross.
translation:
  language: sw
  text: Nao walipokuwa wakitoka, walimkuta mtu mmoja wa Kurene aitwaye Simoni. Wakamshurutisha[a] aubebe msalaba wake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakamtilazimisha” au “wakamtwaa kwa lazima awatumikie.” Kitenzi cha Kigiriki kinahusu huduma ya lazima iliyowekwa na wenye mamlaka.
    reason: lexical_alternative
  - marker: b
    text: Yaani, msalaba wa Yesu.
    reason: referent_clarification
lexical_decisions:
- source_word: Ἐξερχόμενοι
  choice: walipokuwa wakitoka
  rationale: Kauli ya kushiriki ya wakati uliopo inaonyesha tendo lililokuwa likiendelea wakati wa tendo kuu; muundo huu wa Kiswahili unaonyesha uhusiano huo wa wakati kwa njia ya kawaida.
- source_word: δὲ
  choice: Nao
  rationale: Hapa δέ ni kiunganishi chepesi kinachoendeleza simulizi, si alama ya upinzani mkali. “Nao” hudumisha mtiririko wa simulizi na kuwaunganisha wahusika na muktadha uliotangulia.
- source_word: εὗρον
  choice: walimkuta
  rationale: Kitenzi hiki hapa kinamaanisha kukutana na au kumpata mtu mahali walipokuwa wakipita; “walimkuta” ni Kiswahili cha kawaida na sahihi katika muktadha huu.
- source_word: ἄνθρωπον Κυρηναῖον
  choice: mtu mmoja wa Kurene
  rationale: Κυρηναῖον humtambulisha mtu kwa asili au uhusiano wake na mji wa Kurene. “Wa Kurene” ni muundo mfupi na wa kawaida wa Kiswahili.
- source_word: ὀνόματι Σίμωνα
  choice: aitwaye Simoni
  rationale: Huu ni msemo wa Kigiriki unaomaanisha kwamba jina la mtu huyo lilikuwa Simoni; “aitwaye Simoni” ni tafsiri ya asili na yenye hadhi.
- source_word: τοῦτον
  choice: -m- katika “wakamshurutisha”
  rationale: Kiambishi cha yambwa “-m-” humrejelea wazi Simoni aliyetajwa bila kurudia “mtu huyu,” jambo ambalo lingesikika zito katika Kiswahili.
- source_word: ἠγγάρευσαν
  choice: wakamshurutisha
  rationale: ἀγγαρεύω huhusu kumlazimisha mtu kutoa huduma kwa mamlaka. “Kumshurutisha” huhifadhi maana ya ulazima na matumizi ya nguvu ya mamlaka.
- source_word: ἵνα ἄρῃ
  choice: aubebe
  rationale: ἵνα pamoja na kitenzi cha dhamira huonyesha kusudi, na αἴρω katika msafara huu humaanisha kuinua na kubeba. Muundo “wakamshurutisha aubebe” unaonyesha kusudi hilo kwa Kiswahili cha kawaida.
- source_word: τὸν σταυρὸν
  choice: msalaba
  rationale: σταυρός humaanisha “msalaba.” Chanzo hakibainishi kwa lazima kwamba ni boriti ya msalaba pekee, kwa hiyo neno pana la kawaida limehifadhiwa.
- source_word: αὐτοῦ
  choice: wake
  rationale: Kiwakilishi cha Kigiriki kimehifadhiwa kama kiwakilishi badala ya kubadilishwa kuwa jina “Yesu.” Muktadha unaonyesha kwamba ni msalaba wa Yesu, ingawa Kiswahili, kama Kigiriki, kinaweza kuhitaji muktadha ili kutambua mrejelewa.
theological_decisions:
- issue: Mrejelewa wa αὐτοῦ (“wake”)
  choice: Kuhifadhi kiwakilishi “wake,” huku muktadha ukionyesha kwamba msalaba ni wa Yesu.
  alternative: Kusema wazi “msalaba wa Yesu.”
  rationale: Katika simulizi, Yesu ndiye aliyehukumiwa na Simoni analazimishwa kubeba msalaba wake. Kutumia “wake” huhifadhi muundo wa chanzo na kutatua uwezekano wa mkanganyiko katika tanbihi badala ya kuingiza jina lisilo katika aya yenyewe.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Wa Kurene” na “aitwaye Simoni” ni miundo inayoeleweka kwa urahisi. Alama za tanbihi zimewekwa baada ya maneno yanayohusika moja kwa moja: [a] baada ya “wakamshurutisha” na [b] baada ya “msalaba wake.”'
