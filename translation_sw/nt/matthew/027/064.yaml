id: MAT.27.64
reference: Matthew 27:64
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: κέλευσον οὖν ἀσφαλισθῆναι τὸν τάφον ἕως τῆς τρίτης ἡμέρας, μήποτε ἐλθόντες οἱ μαθηταὶ ⸀αὐτοῦ κλέψωσιν αὐτὸν καὶ εἴπωσιν τῷ λαῷ· Ἠγέρθη ἀπὸ τῶν νεκρῶν, καὶ ἔσται ἡ ἐσχάτη πλάνη χείρων τῆς πρώτης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/064.yaml
  text: Therefore[a], order the tomb to be secured until the third day, lest his disciples come and steal him and say to the people[b], ‘He has been raised from the dead,’ and the last deception will be worse than the first.
translation:
  language: sw
  text: Kwa hiyo, amuru kaburi lifanywe salama mpaka siku ya tatu, wanafunzi wake wasije wakaja[a] wakamwiba na kuwaambia watu, ‘Amefufuliwa kutoka kwa wafu,’ na udanganyifu wa mwisho utakuwa mbaya kuliko ule wa kwanza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Baadhi ya hati za kale zinaongeza “usiku” baada ya “wakaja”: “wanafunzi wake wasije wakaja usiku na kumwiba.” Hapa imefuatwa matini fupi.'
    reason: textual_variant
lexical_decisions:
- source_word: κέλευσον
  choice: amuru
  rationale: Ni amri ya moja kwa moja inayomtaka Pilato atoe agizo rasmi na la uamuzi.
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Inaonyesha hitimisho linalotokana na maelezo ya mstari uliotangulia.
- source_word: ἀσφαλισθῆναι
  choice: lilindwe kwa usalama
  rationale: Huwasilisha wazo pana la kulifanya kaburi kuwa salama bila kulifungamanisha na njia moja tu, kama ulinzi wa askari.
- source_word: τὸν τάφον
  choice: kaburi
  rationale: Neno la kawaida na la asili katika Kiswahili kwa mahali alipozikwa Yesu.
- source_word: ἕως τῆς τρίτης ἡμέρας
  choice: mpaka siku ya tatu
  rationale: Ni usemi wa kawaida unaohifadhi uhusiano na utabiri wa siku ya tatu.
- source_word: μήποτε
  choice: wasije
  rationale: Huonyesha uwezekano unaohofiwa ambao agizo hilo linakusudiwa kuuzuia.
- source_word: ἐλθόντες οἱ μαθηταὶ αὐτοῦ
  choice: wanafunzi wake wakaja
  rationale: Hutoa kishiriki cha Kigiriki kwa mtiririko wa kawaida wa Kiswahili bila kuongeza ‘usiku,’ ambayo haimo katika matini hii.
- source_word: κλέψωσιν αὐτόν
  choice: wakamwiba
  rationale: Huhifadhi kiwakilishi cha kibinafsi ‘yeye’ kilichomo katika Kigiriki badala ya kukibadili waziwazi kuwa ‘mwili wake.’
- source_word: εἴπωσιν τῷ λαῷ
  choice: kuwaambia watu
  rationale: λαός humaanisha watu kwa ujumla, si lazima umati uliokusanyika wakati huo.
- source_word: Ἠγέρθη
  choice: Amefufuliwa
  rationale: Huhifadhi hali ya kutendwa ya kitenzi cha Kigiriki na kutomwongeza wazi mtendaji ambaye hajatajwa.
- source_word: ἀπὸ τῶν νεκρῶν
  choice: kutoka kwa wafu
  rationale: Ni namna ya kawaida ya Kiswahili ya kueleza ufufuo kutoka miongoni mwa waliokufa.
- source_word: ἡ ἐσχάτη πλάνη
  choice: udanganyifu huu wa mwisho
  rationale: πλάνη hapa ni dai linalotajwa na wapinzani kuwa la kupotosha; ‘huu’ huunganisha kwa kawaida na dai lililonukuliwa.
theological_decisions:
- issue: Kauli kuhusu ufufuo katika usemi ulioripotiwa
  choice: Amefufuliwa kutoka kwa wafu
  alternative: Amefufuka kutoka kwa wafu
  rationale: Kigiriki kina kitenzi cha hali ya kutendwa. ‘Amefufuliwa’ huhifadhi hali hiyo na kuacha mtendaji akiwa hakutajwa, kama ilivyo katika chanzo.
- issue: Kirejeleo cha αὐτόν katika tendo la wizi
  choice: wakamwiba
  alternative: wakaiba mwili wake
  rationale: Chanzo kinasema ‘yeye,’ si ‘mwili wake.’ Tafsiri iliyochaguliwa huhifadhi usemi huo bila kufafanua zaidi ya matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ‘wasije ... wakaja’ ni wa kawaida katika usemi wa tahadhari. Alama ya tanbihi [a] imewekwa baada ya ‘watu’ ili isikatishe kwa namna nzito mfululizo wa vitendo, ingawa tanbihi yenyewe inahusu kirai ‘wakaja.’
