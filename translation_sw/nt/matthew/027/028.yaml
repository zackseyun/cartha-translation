  yaml_path: translation/nt/matthew/027/028.yaml
  text: And after stripping him[a], they put a scarlet cloak on him,
translation:
  language: sw
  text: Nao, baada ya kumvua nguo, wakamvika joho la rangi ya skarleti,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “vazi la nje la rangi ya skarleti.” Neno la Kigiriki linaweza kurejelea kwa upana zaidi joho au vazi la nje.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Nao
  rationale: Inaendeleza simulizi kwa njia ya kawaida huku ikihifadhi kiunganishi cha Kigiriki.
- source_word: ἐκδύσαντες αὐτόν
  choice: baada ya kumvua nguo
  rationale: Kitenzi hiki humaanisha kumvua mtu mavazi; muundo huu unaonyesha kwa kawaida kwamba tendo hilo lilitangulia tendo kuu.
- source_word: χλαμύδα
  choice: joho
  rationale: Neno hilo humaanisha vazi la nje au joho, mara nyingi joho fupi lililovaliwa na askari au maofisa; ‘joho’ ni la asili na haliongezi maana ya kifalme isiyoelezwa moja kwa moja.
- source_word: κοκκίνην
  choice: jekundu
  rationale: Hueleza rangi nyekundu angavu; ‘jekundu’ ni wazi na la kawaida katika Kiswahili cha sasa.
- source_word: περιέθηκαν αὐτῷ
  choice: wakamvika
  rationale: Katika muktadha huu humaanisha kuweka vazi juu ya mtu; ‘wakamvika’ hutoa tendo hilo kwa Kiswahili cha kawaida na fasaha.
theological_decisions:
- issue: Aina ya vazi katika tukio la kumdhihaki Yesu
  choice: joho jekundu
  alternative: vazi la nje jekundu
  rationale: ‘Joho’ linahifadhi maana ya aina ya vazi la Kigiriki bila kulifanya moja kwa moja kuwa vazi rasmi la kifalme; tanbihi inadumisha upana wa kimaana wa neno hilo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Wakamvika’ ni cha asili zaidi kuliko tafsiri halisi ya ‘wakaliweka kumzunguka,’ huku ‘joho’ likihifadhi taswira ya vazi la nje.
