  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: περὶ δὲ τὴν ἐνάτην ὥραν ⸀ἀνεβόησεν ὁ Ἰησοῦς φωνῇ μεγάλῃ λέγων· ⸂Ἠλὶ ἠλὶ⸃ λεμὰ σαβαχθάνι; τοῦτ’ ἔστιν· Θεέ μου θεέ μου, ἱνατί με ἐγκατέλιπες;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/046.yaml
  text: About the ninth hour Jesus cried out with a loud voice[a], saying, “Eli, Eli, lema sabachthani?” that is, “My God, my God[b], why have you forsaken me?”
translation:
  language: sw
  text: Karibu saa tisa, Yesu akalia kwa sauti kubwa[a], akisema, “Eli, Eli, lema sabakhthani?” yaani, “Mungu wangu, Mungu wangu, kwa nini umeniacha?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maneno haya yana mwangwi wa Zaburi 22:1.
    reason: cross_reference
  - marker: b
    text: Au, “kwa nini uliniacha?” Kitenzi cha Kigiriki kiko katika wakati uliopita usioonyesha kwa lazima kama matokeo yanaendelea; “umeniacha” limetumiwa hapa kwa sababu linaonyesha kwa kawaida nguvu ya kilio hiki katika Kiswahili.
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ δὲ τὴν ἐνάτην ὥραν
  choice: Karibu saa tisa
  rationale: περί pamoja na wakati huonyesha makadirio, ‘karibu.’ δέ ni kiunganishi chepesi ambacho hakihitaji kutafsiriwa kwa neno tofauti hapa. ‘Saa tisa’ ni usemi wa kawaida wa Kiswahili cha Afrika Mashariki na katika mfumo huu ni karibu saa 9 alasiri kwa hesabu ya saa za kimataifa.
- source_word: ἀνεβόησεν ... φωνῇ μεγάλῃ
  choice: akalia kwa sauti kubwa
  rationale: Kitenzi kinaonyesha kilio au mwito wenye nguvu, na φωνῇ μεγάλῃ husisitiza ukubwa wa sauti. Usemi huu ni wa asili, wenye hadhi, na unahifadhi msisitizo bila urudiaji usio wa kawaida katika Kiswahili.
- source_word: λέγων
  choice: akisema
  rationale: Hutambulisha maneno yaliyomo katika kilio, huku kikihifadhi kwa ufasaha muundo wa kishiriki cha Kigiriki.
- source_word: Ἠλὶ ἠλὶ λεμὰ σαβαχθάνι
  choice: Eli, Eli, lema sabakthani?
  rationale: Mathayo anahifadhi kwanza kilio cha Kisemiti kabla ya kutoa maana yake. Tahajia ‘sabakthani’ inawakilisha sauti ya χ kwa namna inayosomeka kwa wasomaji wa Kiswahili.
- source_word: τοῦτ’ ἔστιν
  choice: Yaani
  rationale: Huu ni utangulizi wa tafsiri au ufafanuzi. ‘Yaani’ ni wa kawaida, mfupi, na wenye hadhi katika Kiswahili cha sasa.
- source_word: Θεέ μου θεέ μου
  choice: Mungu wangu, Mungu wangu
  rationale: Inahifadhi mwito wa moja kwa moja na urudiaji, pamoja na mwangwi wa Zaburi 22:1.
- source_word: ἱνατί
  choice: kwa nini
  rationale: Ni njia ya kawaida na ya moja kwa moja ya kuuliza sababu katika Kiswahili.
- source_word: ἐγκατέλιπες
  choice: umeniacha
  rationale: Wakati timilifu wa Kiswahili huwasilisha kwa kawaida matokeo yanayoendelea kuhisiwa katika kilio hiki. ‘Kuniacha’ ni wazi na cha kawaida, bila kuongeza ufafanuzi wa kitheolojia.
theological_decisions:
- issue: Uhusiano wa kilio cha Yesu na Zaburi 22:1
  choice: Maneno yametafsiriwa kama kilio halisi huku yakihifadhi mwangwi wa Zaburi na mvutano wa kitheolojia.
  alternative: Kuyafanya hasa kuwa ishara ya kunukuu Zaburi, au kuyafafanua kwa namna inayolegeza maana ya kuachwa.
  rationale: Kigiriki kinatoa kilio na tafsiri yake bila maelezo ya ziada. Tafsiri haipaswi kupunguza uzito wa kilio wala kulazimisha maelezo fulani ya kimafundisho.
- issue: Kuhifadhi kilio cha Kisemiti katika matini kuu
  choice: Maneno ya Kisemiti yamehifadhiwa kwa unukuzi, kisha maana yake ikatolewa.
  alternative: Kutoa maana ya Kiswahili pekee.
  rationale: Mathayo mwenyewe anahifadhi kilio cha awali na kisha kukitafsiri. Kufanya hivyo pia huhifadhi undani wa simulizi unaohusiana na jinsi waliokuwa karibu walivyolisikia neno ‘Eli.’
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, wazi, na yenye hadhi. Muundo wa Kisemiti umehifadhiwa kwa sababu ni sehemu ya simulizi la Mathayo, huku tafsiri yake ikitolewa mara moja kwa msomaji.
