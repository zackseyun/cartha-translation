    issue: The Semitic cry is spelled “sabakthani.”
    rationale: The Greek text has σαβαχθάνι (with χθ). “Sabakhthani” more accurately and transparently reflects this sequence in a Swahili-readable transliteration. This matters because Matthew deliberately preserves the wording before translating it.
  - severity: low
    issue: “Yaani” is punctuated as a new sentence after the quoted cry.
    rationale: τοῦτ’ ἔστιν introduces the immediately following explanation. Lower-case “yaani” after a comma more naturally links the explanatory translation to the preserved cry.
