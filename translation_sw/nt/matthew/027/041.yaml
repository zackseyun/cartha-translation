  yaml_path: translation/nt/matthew/027/041.yaml
  text: Likewise[a], the chief priests also, mocking him with the scribes and elders, were saying,
translation:
  language: sw
  text: Vivyo hivyo[a], makuhani wakuu pia, pamoja na waandishi na wazee, walikuwa wakimdhihaki, wakisema,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kadhalika.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμοίως
  choice: Vivyo hivyo
  rationale: Inaonyesha kwamba dhihaka hii ilifanana na dhihaka iliyotangulia, kwa lugha ya kawaida na yenye heshima.
- source_word: καὶ
  choice: pia
  rationale: 'Hutoa maana ya nyongeza: makuhani wakuu walijiunga na waliokuwa wakimdhihaki Yesu.'
- source_word: ἀρχιερεῖς
  choice: makuhani wakuu
  rationale: Hili ndilo neno la kawaida kwa viongozi wakuu wa kikuhani, wala halidokezi kwamba kulikuwa na makuhani wakuu wengi wenye cheo kilekile cha kuhani mkuu.
- source_word: ἐμπαίζοντες
  choice: walimdhihaki
  rationale: Kitenzi hiki huonyesha kejeli na dharau; kiwakilishi cha yambwa kinamrejelea Yesu kutokana na muktadha.
- source_word: μετὰ
  choice: pamoja na
  rationale: Hueleza ushirika wa waandishi na wazee katika tendo hilo, si kuwapo kwao tu karibu.
- source_word: γραμματέων
  choice: waandishi
  rationale: Ni tafsiri ya moja kwa moja na iliyozoeleka kwa wataalamu wa Maandiko katika simulizi za Injili.
- source_word: πρεσβυτέρων
  choice: wazee
  rationale: Katika muktadha huu ni viongozi waliotambuliwa katika jamii, si watu wenye umri mkubwa tu.
- source_word: ἔλεγον
  choice: wakisema
  rationale: Huhifadhi uhusiano wa dhihaka na maneno yanayofuata; muundo huu wa Kiswahili ni wa asili na unaweza kuonyesha usemi uliokuwa ukiendelea.
theological_decisions:
- issue: Utambulisho wa walioshiriki katika dhihaka
  choice: Makuhani wakuu, waandishi na wazee wanaonyeshwa wakishiriki pamoja katika kumdhihaki Yesu.
  alternative: Makuhani wakuu peke yao walidhihaki huku waandishi na wazee wakiwa tu pamoja nao.
  rationale: Muundo wa μετὰ pamoja na hali ya umilikishi unaonyesha kwa kawaida ushirika katika tendo, ingawa Kiswahili kinaacha sentensi ikiwa fupi bila kuongeza maelezo ya kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Mpangilio ‘walimdhihaki wakisema’ ni wa asili zaidi kuliko kuiga moja kwa moja kishiriki cha Kigiriki, huku ukiendeleza tendo kuelekea maneno ya aya inayofuata.
