  text: καὶ ἰδοὺ τὸ καταπέτασμα τοῦ ναοῦ ἐσχίσθη ⸂ἀπ’ ἄνωθεν ἕως κάτω εἰς δύο⸃, καὶ ἡ γῆ ἐσείσθη, καὶ αἱ πέτραι ἐσχίσθησαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/051.yaml
  text: And behold[a], the curtain of the temple was torn in two from top to bottom, and the earth shook, and the rocks were split.
translation:
  language: sw
  text: Na tazama, pazia la patakatifu[a] likachanika kutoka juu mpaka chini, likawa vipande viwili; dunia ikatikisika, na miamba ikapasuka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “pazia la hekalu.” Neno la Kigiriki linaweza kumaanisha pazia la ndani katika patakatifu pa hekalu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: tazama
  rationale: Neno hili la kuvuta fikira linahifadhi msisitizo wa ghafla na uzito wa simulizi kwa Kiswahili cha kawaida.
- source_word: καταπέτασμα τοῦ ναοῦ
  choice: pazia la patakatifu
  rationale: καταπέτασμα ni pazia la hekalu, na ναός hapa humaanisha hasa patakatifu ndani ya hekalu; tafsiri hii ni sahihi na huepuka kudokeza pazia lolote la jengo lote.
- source_word: ἐσχίσθη ἀπ’ ἄνωθεν ἕως κάτω εἰς δύο
  choice: likapasuka vipande viwili kutoka juu mpaka chini
  rationale: Huhifadhi hali ya kutotajwa kwa mtendaji, matokeo ya kuwa sehemu mbili, na mwelekeo wa mpasuko.
- source_word: ἡ γῆ ἐσείσθη
  choice: dunia ikatikisika
  rationale: “Dunia” huhifadhi uwezekano wa maana pana kuliko “ardhi,” huku kitenzi hiki kikiwa usemi wa kawaida wa Kiswahili kwa tukio la tetemeko.
- source_word: αἱ πέτραι ἐσχίσθησαν
  choice: miamba ikapasuka
  rationale: “Miamba” inafaa kwa mawe makubwa katika muktadha wa tetemeko, na “ikapasuka” huakisi kitenzi kilekile σχίζω bila kuwa isiyo ya kawaida kwa Kiswahili.
theological_decisions:
- issue: Maana ya ishara ya pazia la hekalu
  choice: Kusimulia tukio moja kwa moja bila kulifafanua kitheolojia katika aya
  alternative: Kulieleza kuwa ishara ya kufunguliwa kwa njia ya kumkaribia Mungu au hukumu juu ya mfumo wa hekalu
  rationale: Aya yenyewe inataja tukio na ishara zilizoandamana nalo lakini haifafanui maana yake; tafsiri inahifadhi mvutano huo bila kuingiza fundisho la mfasiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya simulizi lakini kinachoeleweka kwa wasomaji wa kawaida. “Na tazama” huhifadhi mfululizo wa καί na msisitizo wa ἰδού; alama ya nuktamkato husaidia mtiririko bila kuondoa uhusiano wa matukio.
