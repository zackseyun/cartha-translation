id: MAT.27.11
reference: Matthew 27:11
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ὁ δὲ Ἰησοῦς ⸀ἐστάθη ἔμπροσθεν τοῦ ἡγεμόνος· καὶ ἐπηρώτησεν αὐτὸν ὁ ἡγεμὼν λέγων· Σὺ εἶ ὁ βασιλεὺς τῶν Ἰουδαίων; ὁ δὲ Ἰησοῦς ⸀ἔφη· Σὺ λέγεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/011.yaml
  text: Jesus stood before the governor[a], and the governor questioned him, saying, “Are you the King of the Jews?” And Jesus said[b], “You say so.”
translation:
  language: sw
  text: Yesu akasimama mbele ya gavana, naye gavana akamwuliza, “Je, wewe ndiye Mfalme wa Wayahudi?” Yesu akasema, “Wewe ndivyo unavyosema.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ni kama unavyosema,” au “Wewe ndiye unayesema.” Jibu la Yesu ni fupi na lenye udokezo katika Kigiriki.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐστάθη
  choice: akasimama
  rationale: Kitenzi hiki kina maana ya kusimama au kuwa amesimama; “akasimama” ni cha kawaida katika simulizi na hakiingizi wazo lisilo wazi kwamba alilazimishwa kusimama.
- source_word: ἔμπροσθεν
  choice: mbele ya
  rationale: Ni tafsiri fupi na ya kawaida inayofaa mazingira rasmi ya hukumu.
- source_word: ἡγεμών / ἡγεμόνος
  choice: gavana
  rationale: Hili ni neno linaloeleweka kwa urahisi kwa mtawala wa Kirumi katika muktadha huu; “mtawala” ni pana mno na “prefekti” ni la kitaalamu zaidi.
- source_word: ἐπηρώτησεν
  choice: akamwuliza
  rationale: Katika Kiswahili, “akamwuliza” huonyesha tendo la kuuliza swali kwa kawaida; uzito wa mazingira ya kisheria unaeleweka kutokana na muktadha bila kutumia neno lenye nguvu zaidi kama “akamhoji.”
- source_word: λέγων
  choice: —
  rationale: Kirai kishirikishi cha Kigiriki kimewasilishwa kwa njia ya kawaida ya Kiswahili kwa kuingiza maneno ya swali moja kwa moja baada ya “akamwuliza,” bila kuongeza “akisema” isiyo lazima.
- source_word: βασιλεὺς
  choice: Mfalme
  rationale: “Mfalme” ndiyo tafsiri ya moja kwa moja; herufi kubwa inaonyesha kuwa hapa linatumika kama cheo mahususi katika swali kuhusu Yesu.
- source_word: τῶν Ἰουδαίων
  choice: wa Wayahudi
  rationale: Hii ndiyo tafsiri ya kawaida na inayoeleweka zaidi katika shtaka la kisiasa la simulizi hili.
- source_word: ἔφη
  choice: akasema
  rationale: Ni kisawe cha moja kwa moja na hakiongezi maelezo zaidi ya kitendo cha kusema.
- source_word: Σὺ λέγεις
  choice: Wewe wasema hivyo
  rationale: Muundo huu mfupi unahifadhi jibu la tahadhari na lenye udokezo la Kigiriki bila kulifanya kuwa uthibitisho wa moja kwa moja usio na utata.
theological_decisions:
- issue: Maana ya jibu la Yesu Σὺ λέγεις
  choice: 'Jibu la tahadhari lenye uthibitisho usio wa moja kwa moja: “Wewe wasema hivyo.”'
  alternative: 'Uthibitisho wa moja kwa moja zaidi: “Ni kama usemavyo.”'
  rationale: Kigiriki hakikatai dai hilo, lakini pia hakiliweki kwa maneno ya Yesu mwenyewe kama tamko la wazi lisilo na masharti. Tafsiri iliyochaguliwa inahifadhi mvutano huo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya simulizi la kisheria lakini kinachoeleweka kwa wasomaji wa kawaida. “Wasema” ni mtindo wa kifasihi unaofaa jibu hili fupi; alama ya tanbihi imewekwa baada ya jibu linalohusika.
