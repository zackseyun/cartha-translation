  text: Ἄλλους ἔσωσεν, ἑαυτὸν οὐ δύναται σῶσαι· ⸀βασιλεὺς Ἰσραήλ ἐστιν, καταβάτω νῦν ἀπὸ τοῦ σταυροῦ καὶ πιστεύσομεν ἐπ’ ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/042.yaml
  text: He saved others; he cannot save himself. He is the King of Israel; let him come down now from the cross[a], and we will believe in him.
translation:
  language: sw
  text: Aliwaokoa wengine, lakini hawezi kujiokoa mwenyewe. Yeye ni Mfalme wa Israeli; na ashuke sasa kutoka msalabani,[a] nasi tutamwamini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ikiwa yeye ni Mfalme wa Israeli, na ashuke sasa kutoka msalabani, nasi tutamwamini.” Baadhi ya tafsiri huonyesha dhihaka kwa kuweka maana ya sharti wazi, lakini Kigiriki hapa kinataja cheo hicho moja kwa moja.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἄλλους ἔσωσεν
  choice: Aliwaokoa wengine
  rationale: Kitenzi σῴζω kina maana pana ya kuokoa au kukomboa; “aliwaokoa” huhifadhi maana hiyo na ulinganifu wa dhihaka kati ya wengine na yeye mwenyewe.
- source_word: ἑαυτὸν οὐ δύναται σῶσαι
  choice: hawezi kujiokoa mwenyewe
  rationale: Hutafsiri moja kwa moja kutoweza pamoja na kitenzi cha kujirejelea, huku “mwenyewe” ikisisitiza tofauti iliyomo katika dhihaka.
- source_word: βασιλεὺς Ἰσραήλ ἐστιν
  choice: Yeye ni Mfalme wa Israeli
  rationale: Kigiriki kinatoa dai hili moja kwa moja bila neno la sharti; tafsiri inalihifadhi kama kauli ya dhihaka bila kuongeza “ikiwa.”
- source_word: καταβάτω νῦν ἀπὸ τοῦ σταυροῦ
  choice: na ashuke sasa kutoka msalabani
  rationale: Amri ya nafsi ya tatu inaonyesha changamoto ya dhihaka; “ashuke sasa” ni Kiswahili cha kawaida na huhifadhi uharaka wa νῦν.
- source_word: πιστεύσομεν ἐπ’ αὐτόν
  choice: nasi tutamwamini
  rationale: πιστεύω ἐπί hapa huelekeza imani kwa mtu; “tutamwamini” ni usemi wa kawaida wa Kiswahili unaodumisha maana hiyo katika muktadha.
theological_decisions:
- issue: Kauli ya kifalme inayotumiwa kumdhihaki Yesu
  choice: Yeye ni Mfalme wa Israeli
  alternative: Ikiwa yeye ni Mfalme wa Israeli
  rationale: Matini ya Kigiriki ina kishazi cha moja kwa moja, si sentensi yenye sharti lililotajwa wazi. Tafsiri haiingizi “ikiwa,” hivyo inadumisha mvutano wa kauli ya dhihaka kama ilivyoandikwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa kawaida kwa wasomaji wengi, huku ukihifadhi urudiaji wa mzizi wa “okoa,” ukali wa dhihaka, na dai la kifalme lisilo na sharti la wazi.
