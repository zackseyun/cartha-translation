source:
  edition: SBLGNT
  text: ἰδὼν δὲ ὁ Πιλᾶτος ὅτι οὐδὲν ὠφελεῖ ἀλλὰ μᾶλλον θόρυβος γίνεται λαβὼν ὕδωρ ἀπενίψατο τὰς χεῖρας ⸀ἀπέναντι τοῦ ὄχλου λέγων· Ἀθῷός εἰμι ἀπὸ τοῦ ⸀αἵματος τούτου· ὑμεῖς ὄψεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/024.yaml
  text: So when Pilate saw that he was gaining nothing[a], but rather that a riot was developing, he took water and washed his hands before the crowd, saying, “I am innocent of this blood[c][b]; you yourselves will see to it.”
translation:
  language: sw
  text: Basi Pilato alipoona kwamba hakuwa akifanikisha lolote, bali ghasia zilikuwa zikianza[a], alichukua maji, akanawa mikono mbele ya umati, akisema, “Mimi sina hatia ya damu hii[b]; ninyi wenyewe mtalishughulikia jambo hilo.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “makelele yalikuwa yakizuka” au “vurugu zilikuwa zikitokea.”
    reason: lexical_alternative
  - marker: b
    text: Kigiriki husema kihalisi, “Mimi sina hatia kutoka na damu hii.” Msemo huu unamaanisha kutowajibika kwa kifo cha mtu.
    reason: lexical_alternative
  - marker: c
    text: Kihalisi, “ninyi mtaona”; kwa muktadha, “ninyi wenyewe shughulikieni jambo hilo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν δὲ ὁ Πιλᾶτος
  choice: Basi Pilato alipoona
  rationale: Kirai shirikishi cha wakati uliopita pamoja na δέ kinaendeleza simulizi. “Basi ... alipoona” ni mtiririko wa kawaida wa Kiswahili bila kuifanya δέ kuwa pingamizi kali.
- source_word: οὐδὲν ὠφελεῖ
  choice: hakuwa akifanikisha lolote
  rationale: Maana katika muktadha ni kwamba juhudi za Pilato hazikuwa na matokeo. Kauli hii ni ya asili kwa Kiswahili na haiongezi kitu maalumu alichokuwa akijaribu kufanya.
- source_word: ἀλλὰ μᾶλλον θόρυβος γίνεται
  choice: bali ghasia zilikuwa zikianza
  rationale: θόρυβος inaweza kumaanisha ghasia, makelele, au vurugu za umati; γίνεται hapa inaonyesha hali iliyokuwa ikitokea, si tukio lililokwisha.
- source_word: λαβὼν ὕδωρ
  choice: alichukua maji
  rationale: Kitendo cha kirai shirikishi kinatangulia tendo kuu; kimetolewa kwa kitenzi kamili ili simulizi lisomeke kwa urahisi.
- source_word: ἀπενίψατο τὰς χεῖρας
  choice: akanawa mikono
  rationale: Hii ndiyo njia ya kawaida na sahihi ya Kiswahili ya kueleza kuosha mikono, huku ishara ya tendo hilo ikibaki wazi.
- source_word: ἀπέναντι τοῦ ὄχλου
  choice: mbele ya umati
  rationale: Inaonyesha kwamba tendo lilifanywa hadharani, watu wakiwa mashahidi wake.
- source_word: Ἀθῷός εἰμι
  choice: Mimi sina hatia
  rationale: ἀθῷος inaonyesha kutokuwa na hatia au lawama. Kiwakilishi “Mimi” kinadumisha msisitizo wa tamko la Pilato.
- source_word: ἀπὸ τοῦ αἵματος τούτου
  choice: ya damu hii
  rationale: Neno la Kigiriki linasema “damu hii” bila kuongeza “ya mtu huyu.” Kiswahili hiki kinahifadhi taswira ya damu na dai la kutowajibika kwa kifo.
- source_word: ὑμεῖς ὄψεσθε
  choice: ninyi wenyewe mtalishughulikia jambo hilo
  rationale: Kauli hii, iliyo kihalisi “ninyi mtaona,” hutumiwa hapa kumwachia mtu mwingine jambo na wajibu wake. “Ninyi wenyewe” huhifadhi msisitizo wa ὑμεῖς.
theological_decisions:
- issue: Dai la Pilato kwamba hana hatia
  choice: 'Maneno yametolewa kama dai la Pilato mwenyewe: “Mimi sina hatia ya damu hii.”'
  alternative: “Mimi siwajibiki kwa kifo hiki.”
  rationale: Kutaja “damu” kunafuata matini ya Kigiriki na kuhifadhi mvutano wa kimaadili wa simulizi. Tafsiri haithibitishi kwamba dai la Pilato ni la kweli wala hailikanushi kwa maelezo ya ziada.
- issue: Uwajibikaji katika ὑμεῖς ὄψεσθε
  choice: “ninyi wenyewe mtalishughulikia jambo hilo”
  alternative: “ninyi wenyewe mtaona”
  rationale: Kauli ya Kiswahili inaonyesha matumizi ya kimuktadha ya msemo huo bila kufafanua zaidi kiwango au aina ya hatia ya umati.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. “Umati,” “ghasia,” na “sina hatia” vinaeleweka kwa wasomaji wa kawaida huku vikidumisha mazingira ya hadhara na ya kisheria. Muundo wa sentensi unafuata mwendo wa simulizi la Kigiriki bila kuwa mgumu kupita kiasi.
