  text: On the next day[a], which is after the day of Preparation, the chief priests and the Pharisees gathered before Pilate
translation:
  language: sw
  text: Siku iliyofuata[a], yaani siku baada ya Siku ya Maandalizi, makuhani wakuu na Mafarisayo walikusanyika mbele ya Pilato.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ambayo ni baada ya Maandalizi.” Neno la Kigiriki linaweza kumaanisha siku ya maandalizi kabla ya Sabato; kulitafsiri kuwa “Ijumaa” kungeongeza ufafanuzi kuliko unavyohitajiwa na maandishi ya chanzo.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῇ δὲ ἐπαύριον
  choice: Siku iliyofuata
  rationale: Hutoa mwendelezo wa wakati kwa Kiswahili cha kawaida bila kuongeza neno la wakati lisilokuwapo wazi katika chanzo; δέ ni kiunganishi hafifu kisichohitaji kutafsiriwa kando hapa.
- source_word: ἥτις ἐστὶν μετὰ τὴν παρασκευήν
  choice: yaani, baada ya Siku ya Maandalizi
  rationale: Neno ἥτις linaanzisha maelezo yanayofafanua siku iliyotajwa. “Yaani” huonyesha kazi hiyo kwa uwazi na kwa lugha ya kawaida.
- source_word: παρασκευήν
  choice: Siku ya Maandalizi
  rationale: Katika muktadha wa Kiyahudi neno hili kwa kawaida hutaja siku ya kujiandaa kabla ya Sabato. Tafsiri hii huhifadhi istilahi ya kalenda ya chanzo bila kuifasiri moja kwa moja kuwa Ijumaa.
- source_word: συνήχθησαν
  choice: walikusanyika
  rationale: Umbo la kitenzi hapa lina maana isiyoelekezwa kwa mtendwa, yaani walikuja pamoja; “walikusanyika” ni sahihi na ya asili.
- source_word: οἱ ἀρχιερεῖς
  choice: viongozi wa makuhani
  rationale: Wingi huu unarejelea wenye mamlaka wakuu wa kikuhani, si lazima watu kadhaa waliokuwa kila mmoja kuhani mkuu. Usemi huu unaepuka utata wa “makuhani wakuu” katika Kiswahili.
- source_word: οἱ Φαρισαῖοι
  choice: Mafarisayo
  rationale: Hili ndilo jina la kawaida la Kiswahili kwa kundi hili la Kiyahudi.
- source_word: πρὸς Πιλᾶτον
  choice: mbele ya Pilato
  rationale: πρός pamoja na mtu baada ya kitenzi cha kukusanyika inaweza kuonyesha kufika au kuonekana mbele yake; usemi huu unafaa muktadha wa mamlaka ya Pilato.
- source_word: Πιλᾶτον
  choice: Pilato
  rationale: Hili ndilo umbo la kawaida la jina Πιλᾶτος katika Biblia za Kiswahili.
