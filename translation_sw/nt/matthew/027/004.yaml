  text: λέγων· Ἥμαρτον παραδοὺς αἷμα ⸀ἀθῷον. οἱ δὲ εἶπαν· Τί πρὸς ἡμᾶς; σὺ ⸀ὄψῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/004.yaml
  text: saying, “I have sinned by betraying innocent blood.” But they said, “What is that to us? You will see to it.”
translation:
  language: sw
  text: akisema, “Nimetenda dhambi kwa kuisaliti damu isiyo na hatia.”[a] Lakini wao wakasema, “Hilo linatuhusu nini? Lishughulikie mwenyewe.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata muundo wa Kigiriki kwa karibu zaidi, “baada ya kuisaliti damu isiyo na hatia.”
    reason: lexical_alternative
  - marker: b
    text: Kwa maneno halisi zaidi, “Wewe utaona”; hapa ni usemi wa kumwachia mtu jukumu lote.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἥμαρτον
  choice: Nimetenda dhambi
  rationale: Kauli ya wakati uliopita inaungama tendo lililofanyika huku ikionyesha hatia inayomkabili msemaji sasa; Kiswahili cha wakati timilifu kinafaa katika ungamo hili.
- source_word: παραδοὺς
  choice: kwa kuisaliti
  rationale: Kishirikishi hiki kinaeleza tendo lililokuwa msingi wa dhambi. Katika muktadha wa Yuda kumtoa Yesu kwa maadui zake, ‘kuisaliti’ huwasilisha maana kwa uwazi kuliko ‘kukabidhi,’ bila kuongeza mhusika ambaye Kigiriki hakumtaji wazi hapa.
- source_word: αἷμα ἀθῷον
  choice: damu isiyo na hatia
  rationale: Hii inadumisha tamathali fupi ya kimaandiko na uzito wake wa kisheria na kimaadili, bila kuibadili kuwa ‘mtu asiye na hatia’ au kumtaja Yesu moja kwa moja.
- source_word: Τί πρὸς ἡμᾶς;
  choice: Hilo linatuhusu nini?
  rationale: Ni usemi wa kawaida wa Kiswahili unaowasilisha swali la dharau linalokataa kuhusika au kuwajibika.
- source_word: σὺ ὄψῃ
  choice: Lishughulikie mwenyewe
  rationale: 'Ingawa umbo la Kigiriki ni la wakati ujao, hapa lina nguvu ya amri ya kumfukuza mtu: ashughulikie jambo hilo kama jukumu lake mwenyewe. Kiswahili hiki kinahifadhi ukali wa jibu bila kutoa maana ya kuona kwa macho.'
theological_decisions:
- issue: Kama mtendwa wa ‘damu isiyo na hatia’ atajwe wazi kuwa Yesu au mtu asiye na hatia
  choice: 'Kuacha rejeleo likiwa halijatajwa wazi: ‘damu isiyo na hatia’'
  alternative: ‘damu ya mtu asiye na hatia’ au kumtaja Yesu moja kwa moja
  rationale: Kigiriki kinatumia tamathali ‘damu isiyo na hatia’ bila kumtaja mhusika wazi. Tafsiri inadumisha ufupi huo na haiongezi ufafanuzi wa kitheolojia au kisimulizi usio katika maneno ya mstari.
- issue: Nguvu ya usemi σὺ ὄψῃ
  choice: 'Kuutafsiri kama amri ya kumwachia Yuda jukumu: ‘Lishughulikie mwenyewe’'
  alternative: ‘Wewe utaona’
  rationale: Umbo ni la wakati ujao, lakini katika muktadha huu ni usemi wa kumfukuza na kukataa wajibu. Tanbihi inahifadhi umbo la karibu zaidi na maneno ya Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. ‘Nimetenda dhambi’ ni ungamo la moja kwa moja; ‘Lishughulikie mwenyewe’ ni jibu kali na la kukataa wajibu. Tamathali ya kimaandiko ‘damu isiyo na hatia’ imehifadhiwa licha ya kutokuwa usemi wa kawaida kabisa katika mazungumzo ya kila siku.
