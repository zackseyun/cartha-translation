  text: Κατὰ δὲ ἑορτὴν εἰώθει ὁ ἡγεμὼν ἀπολύειν ἕνα τῷ ὄχλῳ δέσμιον ὃν ἤθελον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/015.yaml
  text: At the feast the governor was accustomed to release to the crowd one prisoner[a], whom they wanted.
translation:
  language: sw
  text: Wakati wa sikukuu, gavana alikuwa na desturi ya kuwaachia umati mfungwa mmoja waliyemtaka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κατὰ δὲ ἑορτὴν
  choice: Wakati wa sikukuu
  rationale: κατά pamoja na nomino katika hali ya accusative ina maana ya wakati, yaani ‘wakati wa sikukuu.’ δέ ni kiunganishi chepesi cha simulizi na hakihitaji kutafsiriwa kwa neno tofauti hapa.
- source_word: ἑορτὴν
  choice: sikukuu
  rationale: ἑορτή humaanisha sikukuu au tamasha la kidini; ‘sikukuu’ ni Kiswahili cha kawaida na kinafaa katika muktadha wa Pasaka.
- source_word: εἰώθει
  choice: alikuwa na desturi
  rationale: Umbo hili linaonyesha jambo lililofanywa kwa mazoea wakati uliopita; ‘alikuwa na desturi’ linahifadhi wazi maana hiyo.
- source_word: ὁ ἡγεμὼν
  choice: gavana
  rationale: Katika muktadha huu ἡγεμών ni mtawala wa jimbo kwa mamlaka ya Roma; ‘gavana’ ni neno wazi na la kawaida.
- source_word: ἀπολύειν
  choice: kuwaachia
  rationale: ἀπολύω hapa ni kumwachilia mtu kutoka kifungoni. Muundo ‘kuwaachia umati’ unaonyesha pia yule anayenufaika na kuachiliwa huko.
- source_word: ἕνα
  choice: mmoja
  rationale: ἕνα hutaja idadi ya wafungwa walioachiliwa—mmoja.
- source_word: τῷ ὄχλῳ
  choice: umati
  rationale: Dative inaonyesha umati ambao kwa ajili yake au kwa ombi lake mfungwa aliachiliwa; ‘kuwaachia umati’ ni muundo wa asili wa Kiswahili.
- source_word: δέσμιον
  choice: mfungwa
  rationale: δέσμιος ni mtu aliyefungwa au aliye kizuizini; ‘mfungwa’ ni sawa ya moja kwa moja katika muktadha huu.
- source_word: ὃν ἤθελον
  choice: waliyemtaka
  rationale: Kishazi hiki kinamtambulisha mfungwa mmoja aliyechaguliwa na umati. Muundo huu huhifadhi umoja wa kiwakilishi na maana ya uchaguzi wao.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi na chenye hadhi. Tafsiri inahifadhi maana ya desturi ya wakati uliopita bila kuongeza ‘sasa’ isiyopo wazi katika chanzo. Tanbihi ya Kiingereza kuhusu ‘feast/festival’ haikuhitajika kwa kuwa ‘sikukuu’ inashughulikia maana zote mbili kwa kawaida.
