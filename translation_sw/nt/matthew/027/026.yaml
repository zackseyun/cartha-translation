  yaml_path: translation/nt/matthew/027/026.yaml
  text: Then he released Barabbas to them[a], but after flogging Jesus, he handed him over to be crucified.
translation:
  language: sw
  text: Ndipo akawaachilia Baraba, lakini baada ya kumpiga Yesu kwa mijeledi[a], akamkabidhi ili asulubiwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “baada ya kumcharaza Yesu.” Kitenzi cha Kigiriki kinarejelea adhabu ya Kirumi ya kumpiga mtu kwa mijeledi.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Ndipo
  rationale: Inaonyesha hatua inayofuata katika simulizi kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: ἀπέλυσεν αὐτοῖς τὸν Βαραββᾶν
  choice: akawafungulia Baraba
  rationale: Katika muktadha huu wa hukumu, ἀπολύω ni kumwachilia mfungwa; kiambishi -wa- kinadumisha watu waliokuwa wapokeaji au wanufaika wa kuachiliwa kwake.
- source_word: τὸν δὲ Ἰησοῦν
  choice: lakini ... Yesu
  rationale: Neno δέ linaonyesha tofauti kati ya kuachiliwa kwa Baraba na alivyotendewa Yesu.
- source_word: φραγελλώσας
  choice: baada ya kumpiga Yesu mijeledi
  rationale: Kauli hii ya wakati uliopita inaonyesha tendo lililotangulia kukabidhiwa kwake. 'Kumpiga mijeledi' ni usemi wazi wa adhabu ya Kirumi inayotajwa.
- source_word: παρέδωκεν
  choice: akamkabidhi
  rationale: Linadumisha maana ya kumtia Yesu mikononi mwa wengine ili watekeleze hukumu iliyotajwa.
- source_word: ἵνα σταυρωθῇ
  choice: ili asulubiwe
  rationale: Muundo huu unadumisha kusudi au matokeo yaliyokusudiwa na kauli tendwa ya Kigiriki.
theological_decisions:
- issue: Mpangilio na uwakala katika hukumu ya Yesu
  choice: Kupigwa kwa Yesu mijeledi kunatangulia Pilato kumkabidhi ili asulubiwe.
  alternative: Pilato alimkabidhi Yesu, kisha Yesu akapigwa mijeledi.
  rationale: Kitenzi-shirikishi cha wakati uliopita φραγελλώσας kwa kawaida huonyesha tendo lililotangulia kitenzi kikuu παρέδωκεν; tafsiri haiongezi maelezo ya ziada kuhusu utaratibu wa Kirumi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi na chenye hadhi. Alama ya tanbihi imewekwa baada ya maneno yanayohusika moja kwa moja, yaani “kumpiga Yesu mijeledi,” badala ya baada ya kutajwa kwa Baraba.
