base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/034.yaml
  text: They gave him wine mixed with gall to drink[a], but after tasting it, he was unwilling to drink.
translation:
  language: sw
  text: Wakampa divai iliyochanganywa na nyongo ili anywe[a]; lakini baada ya kuionja, hakutaka kuinywa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki χολή linaweza kumaanisha “nyongo” au, kwa upana zaidi, kitu kichungu. Tafsiri imetumia “nyongo” ili kuhifadhi matumizi ya neno ya Mathayo; linganisha Marko 15:23, ambako simulizi linalohusiana linataja manemane.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδωκαν αὐτῷ
  choice: Wakampa
  rationale: Kitenzi hiki kinawakilisha moja kwa moja tendo la kumpa, huku kiambishi -m- kikionyesha kuwa Yesu ndiye aliyepewa.
- source_word: πιεῖν
  choice: ili anywe
  rationale: Infinitivu inaonyesha kusudi la kumpa divai; muundo wa Kiswahili wenye 'ili' ni wa kawaida na unaeleweka.
- source_word: οἶνον
  choice: divai
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa kinywaji kinachotajwa na οἶνος.
- source_word: μετὰ χολῆς μεμιγμένον
  choice: iliyochanganywa na nyongo
  rationale: μεμιγμένον inaeleza divai kuwa imechanganywa, na χολή linaweza kumaanisha nyongo halisi au kitu kichungu. 'Nyongo' huhifadhi taswira na upekee wa neno la Mathayo.
- source_word: καὶ γευσάμενος
  choice: lakini baada ya kuionja
  rationale: γευσάμενος ni 'baada ya kuonja'; 'lakini' huwasilisha kwa kawaida tofauti ya kimasimulizi kati ya kuionja na kutokunywa.
- source_word: οὐκ ἠθέλησεν πιεῖν
  choice: hakutaka kuinywa
  rationale: Tafsiri hii huhifadhi maana ya kutokuwa na nia ya kunywa bila kuongeza nguvu ya tafsiri kama 'alikataa'.
theological_decisions:
- issue: Maana ya χολή katika simulizi la mateso na mwangwi wake wa Kimaandiko
  choice: nyongo
  alternative: kitu kichungu
  rationale: χոլή linaweza kutaja nyongo au, kwa upana zaidi, kitu kichungu. 'Nyongo' huhifadhi upekee wa msamiati wa Mathayo na mwangwi unaowezekana wa Kimaandiko bila kuamua kimya kimya kwamba ilikuwa dutu gani hasa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo ni wa kawaida kwa wasomaji wengi, huku 'nyongo' ikihifadhi utata wa neno la Kigiriki. Alama ya tanbihi [a] imewekwa mara tu baada ya kirai kinachohusika.
