  text: And sitting there[a], they kept watch over him.
translation:
  language: sw
  text: Nao, wakiwa wameketi pale, walikuwa wakimlinda.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nao, baada ya kuketi pale, waliendelea kumlinda.”
