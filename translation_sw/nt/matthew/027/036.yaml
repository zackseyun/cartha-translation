lexical_decisions:
- source_word: καὶ
  choice: Nao
  rationale: Kiunganishi rahisi kinaendeleza simulizi bila kuongeza maana ya wakati ambayo haijaelezwa wazi.
- source_word: καθήμενοι
  choice: wakaketi
  rationale: Kitenzi hiki cha hali ya kushiriki huonyesha kwamba walikuwa wameketi; katika Kiswahili, mfuatano 'wakaketi ... na' ni wa kawaida na unahifadhi tendo linaloandamana na tendo kuu.
- source_word: ἐτήρουν
  choice: kuendelea kumlinda
  rationale: Kauli ya wakati usiotimilika huonyesha tendo lililoendelea; 'kuendelea kumlinda' hudhihirisha hali hiyo na inafaa katika muktadha wa askari waliokuwa wakimwangalia Yesu.
- source_word: αὐτὸν
  choice: -m-
  rationale: Kiambishi cha yambwa katika 'kumlinda' kinamrejelea Yesu kwa njia ya kawaida ya Kiswahili.
- source_word: ἐκεῖ
  choice: pale
  rationale: Kielezi hiki cha mahali kinaonyesha eneo la tukio; 'pale' ni cha asili katika Kiswahili na kinaambatana vizuri na 'wakaketi'.
theological_decisions: []
