  text: But Jesus cried out again with a loud voice and gave up his spirit[a].
translation:
  language: sw
  text: Lakini Yesu akalia tena kwa sauti kubwa, akaiachia roho yake[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akakata roho.” Kigiriki kinasema kihalisi, “akaiachia roho,” nahau yenye maana ya kufa.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Lakini
  rationale: Kiunganishi hiki kinaendeleza simulizi huku kikionyesha tofauti ndogo na tukio lililotangulia; “Lakini” linafaa katika mgeuko huu wa simulizi.
- source_word: πάλιν
  choice: tena
  rationale: Neno hili linaonyesha kurudiwa kwa tendo kwa uwazi na kwa Kiswahili cha kawaida.
- source_word: κράξας
  choice: akapaza sauti
  rationale: Kitenzi κράζω kinaashiria kilio au sauti yenye nguvu; “akapaza sauti” ni usemi wa asili unaodumisha wazo la sauti kubwa na uhusiano wake na kitenzi kikuu.
- source_word: φωνῇ μεγάλῃ
  choice: kwa sauti kubwa
  rationale: Kirai hiki kinaeleza namna ya kupaza sauti na kinahifadhi msisitizo wa ukubwa wa sauti kwa Kiswahili cha kawaida.
- source_word: ἀφῆκεν
  choice: akaitoa
  rationale: Katika muungano na τὸ πνεῦμα, kitenzi kina maana ya kuiachilia au kuitoa roho wakati wa kufa. “Akaitoa” kinadumisha picha ya chanzo bila kuifanya kuwa maelezo ya kawaida tu ya kifo.
- source_word: τὸ πνεῦμα
  choice: roho yake
  rationale: Ingawa Kigiriki kinasema kihalisi “roho,” Kiswahili huhitaji kiwakilishi cha umilikaji ili usemi uwe wazi na wa asili. “Roho” pia huhifadhi upana wa πνεῦμα kuliko “pumzi.”
theological_decisions:
- issue: Tafsiri ya nahau ya kifo ἀφῆκεν τὸ πνεῦμα
  choice: akaitoa roho yake
  alternative: akakata roho
  rationale: “Akaitoa roho yake” inadumisha maneno na uzito wa kitheolojia wa πνεῦμα, pamoja na picha ya kuiachilia. “Akakata roho” ni nahau ya kawaida ya Kiswahili yenye maana ya kufa, lakini huondoa picha hiyo na uhusiano wa moja kwa moja na neno “roho.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa vitenzi mfululizo unafuata mtiririko wa simulizi. Marudio ya “sauti” yamehifadhiwa kwa sababu yanalingana na κράξας φωνῇ μεγάλῃ na yanaeleweka kwa Kiswahili, ingawa yanaweza kusikika yenye msisitizo.
