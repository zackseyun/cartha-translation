  yaml_path: translation/nt/matthew/027/031.yaml
  text: And when they had mocked him[a], they stripped the cloak off him and put his own clothes on him, and led him away to crucify him.
translation:
  language: sw
  text: Walipokwisha kumdhihaki, walimvua lile joho[a], wakamvika nguo zake, kisha wakampeleka ili wamsulubishe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “vazi la nje.” Neno la Kigiriki χλαμύς linamaanisha joho au vazi la nje, ambalo mara nyingi lilivaliwa na mwanajeshi au ofisa; hapa ndilo vazi walilomvika Yesu kwa dhihaka kana kwamba ni mfalme.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνέπαιξαν
  choice: kumdhihaki
  rationale: Kitenzi hiki humaanisha kumfanyia mtu dhihaka kwa dharau; ‘kumdhihaki’ kinadumisha uzito na ukatili wa tendo hilo.
- source_word: χλαμύδα
  choice: joho
  rationale: χλαμύς ni vazi la nje kama joho, mara nyingi likihusishwa na wanajeshi au maofisa. ‘Joho’ ni neno la kawaida na linalofaa katika muktadha wa vazi la kifalme la dhihaka.
- source_word: ἐξέδυσαν αὐτὸν τὴν χλαμύδα
  choice: walimvua lile joho
  rationale: ἐκδύω ina nguvu ya kuvua au kumwondolea mtu vazi. Muundo huu wa Kiswahili ni wa kawaida na unaonyesha kwamba waliliondoa joho mwilini mwake.
- source_word: ἐνέδυσαν αὐτὸν τὰ ἱμάτια αὐτοῦ
  choice: wakamvika nguo zake mwenyewe
  rationale: ἐνδύω humaanisha kumvika mtu, na ἱμάτια ni nguo kwa ujumla. ‘Mwenyewe’ inaonyesha wazi umilikaji na tofauti kati ya nguo zake na joho la dhihaka.
- source_word: ἀπήγαγον
  choice: wakampeleka
  rationale: ἀπάγω humaanisha kumwongoza au kumpeleka mtu kutoka mahali fulani; hapa ni tendo la askari kumpeleka mfungwa.
- source_word: εἰς τὸ σταυρῶσαι
  choice: ili wamsulubishe
  rationale: Muundo wa εἰς pamoja na kitenzi-jina chenye kibainishi unaonyesha kusudi. ‘Ili wamsulubishe’ ni tafsiri ya moja kwa moja na ya kawaida katika Kiswahili.
