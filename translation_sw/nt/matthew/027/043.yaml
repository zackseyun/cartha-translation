  yaml_path: translation/nt/matthew/027/043.yaml
  text: He has trusted in God[a]; let God rescue him now, if he wants him, for he said[b], ‘I am the Son of God.’
translation:
  language: sw
  text: Amemtumaini Mungu; Mungu amwokoe sasa, ikiwa anamtaka[a], kwa maana alisema[b], “Mimi ni Mwana wa Mungu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ikiwa anapendezwa naye.” Maneno haya yana mwangwi wa Zaburi 22:8, ambako kibali cha Mungu kinasisitizwa.
    reason: alternative_reading
  - marker: b
    text: Dhihaka hii ina mwangwi wa karibu wa Zaburi 22:8, na hivyo inaunganisha kudhihakiwa kwa Yesu na mwenye haki anayeteseka katika zaburi hiyo.
    reason: cross_reference
lexical_decisions:
- source_word: πέποιθεν
  choice: amemtumaini
  rationale: Kauli ya wakati timilifu inaonyesha hali ya kudumu iliyotokana na tendo la kutumaini; “amemtumaini” inadumisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: ἐπὶ τὸν θεόν
  choice: Mungu
  rationale: Pamoja na πέποιθεν, kirai hiki humtaja yule ambaye tumaini limeelekezwa kwake; “amemtumaini Mungu” ni usemi wa asili wa Kiswahili.
- source_word: ῥυσάσθω
  choice: na amwokoe
  rationale: Amri ya nafsi ya tatu hapa ni changamoto ya dhihaka kwamba Mungu amtoe Yesu katika hatari. “Na amwokoe” ni wazi na ya asili.
- source_word: νῦν
  choice: sasa
  rationale: Neno hili linasisitiza uharaka wa changamoto ya wenye kumdhihaki.
- source_word: εἰ θέλει αὐτόν
  choice: ikiwa anamtaka
  rationale: θέλω kwa kawaida humaanisha kutaka au kutamani. Tafsiri hii hudumisha maana ya moja kwa moja, huku maana inayoweza kuwa ya kupendezwa naye kutokana na Zaburi 22:8 ikiwekwa katika tanbihi.
- source_word: εἶπεν γὰρ
  choice: kwa maana alisema
  rationale: Kitenzi cha aoristi kinatafsiriwa kwa wakati uliopita, na γάρ hutoa sababu ya changamoto yao.
- source_word: Θεοῦ εἰμι υἱός
  choice: Mimi ni Mwana wa Mungu
  rationale: Katika muktadha wa Mathayo, usemi huu ni cheo kinachomtambulisha Yesu, si dai la jumla kwamba yeye ni mwana mmoja miongoni mwa wengi.
theological_decisions:
- issue: Tafsiri ya usemi wa Kikristo Θεοῦ εἰμι υἱός
  choice: Mimi ni Mwana wa Mungu
  alternative: Mimi ni mwana wa Mungu
  rationale: Herufi kubwa katika “Mwana” huonyesha matumizi ya cheo katika simulizi la Mathayo bila kuongeza ufafanuzi wa kimadhehebu usiomo katika matini.
- issue: Iwapo θέλει αὐτόν itafsiriwe kwa lugha yenye maana dhahiri ya kibali cha Mungu
  choice: ikiwa anamtaka
  alternative: ikiwa anapendezwa naye
  rationale: Maana ya kawaida ya θέλω ni “kutaka.” Hata hivyo, mwangwi wa Zaburi 22:8 unaweza kuleta maana ya kupendezwa naye; uwezekano huo umehifadhiwa katika tanbihi badala ya kuamuliwa kimya kimya katika matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “Mungu na amwokoe” unamweka wazi Mungu kuwa mtendaji wa ῥυσάσθω na kudumisha sauti ya changamoto ya dhihaka.
