id: MAT.27.9
reference: Matthew 27:9
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: τότε ἐπληρώθη τὸ ῥηθὲν διὰ Ἰερεμίου τοῦ προφήτου λέγοντος· Καὶ ἔλαβον τὰ τριάκοντα ἀργύρια, τὴν τιμὴν τοῦ τετιμημένου ὃν ἐτιμήσαντο ἀπὸ υἱῶν Ἰσραήλ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/009.yaml
  text: Then what was spoken through Jeremiah the prophet was fulfilled[a], saying, ‘And they took the thirty pieces of silver, the price of the one who had been valued[b], whom they valued from among the sons of Israel,’
translation:
  language: sw
  text: Ndipo likatimizwa neno lililonenwa kupitia nabii Yeremia[a], akisema, “Nao wakachukua vipande thelathini vya fedha, bei ya yule aliyekadiriwa thamani[b], ambaye baadhi ya wana wa Israeli walimkadiri thamani,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mathayo anahusisha neno hili la kinabii na Yeremia. Maneno yake yanafanana zaidi na Zekaria 11:12–13. Wafafanuzi wametoa maelezo mbalimbali, kutia ndani kwamba ni nukuu iliyounganisha maneno ya manabii kadhaa, ni rejeo kwa mkusanyo wa unabii uliohusishwa na Yeremia, au ni tatizo katika uenezaji wa maandishi.
    reason: textual_variant
  - marker: b
    text: Au, “ambaye walimkadiri thamani kutoka miongoni mwa wana wa Israeli.” Kirai cha Kigiriki ni kigumu; tafsiri “baadhi ya wana wa Israeli” inaonyesha maana inayowezekana ya kuchukua sehemu kutoka katika kundi.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Ndipo
  rationale: Huonyesha hatua inayofuata katika simulizi kwa njia fupi na ya kawaida katika Kiswahili.
- source_word: ἐπληρώθη τὸ ῥηθὲν
  choice: likatimizwa neno lililonenwa
  rationale: Inahifadhi kauli tendwa na mtindo wa Mathayo wa kutaja utimilifu wa neno la kinabii.
- source_word: διὰ Ἰερεμίου τοῦ προφήτου
  choice: kupitia nabii Yeremia
  rationale: ‘Kupitia’ linaonyesha kwamba nabii alikuwa njia ambayo ujumbe ulitamkwa, kulingana na διά pamoja na umilikishi.
- source_word: λέγοντος
  choice: akisema
  rationale: Ni utangulizi wa kawaida na wa asili wa manukuu, huku ukihusishwa na nabii Yeremia.
- source_word: ἔλαβον
  choice: wakachukua
  rationale: Muktadha unaunga mkono nafsi ya tatu wingi; ‘kuchukua’ ndiyo maana ya moja kwa moja hapa.
- source_word: τὰ τριάκοντα ἀργύρια
  choice: vipande thelathini vya fedha
  rationale: Inaonyesha fedha iliyotumika kama malipo bila kudai aina maalumu ya sarafu ambayo Kigiriki hakitaji.
- source_word: τὴν τιμὴν τοῦ τετιμημένου
  choice: bei ya yule aliyethaminiwa
  rationale: ‘Bei’ linafaa katika muktadha wa malipo, na ‘aliyethaminiwa’ linahifadhi maana ya kauli tendwa ya kitenzi τιμάω.
- source_word: ὃν ἐτιμήσαντο ἀπὸ υἱῶν Ἰσραήλ
  choice: ambaye baadhi ya wana wa Israeli walimwekea thamani
  rationale: Kiswahili hiki kinaeleweka na kinaakisi uwezekano wa maana ya sehemu katika ἀπό, huku kikihifadhi uhusiano wa kimsamiati kati ya ‘aliyethaminiwa’ na ‘walimwekea thamani’.
theological_decisions:
- issue: Mathayo anahusisha neno hili la kinabii na Yeremia, ingawa maneno yake yanafanana zaidi na Zekaria 11:12–13.
  choice: Jina ‘nabii Yeremia’ limehifadhiwa katika andiko kuu bila kulisawazisha.
  alternative: Kubadili jina kuwa ‘Zekaria,’ kuliacha, au kueleza andiko kuu kama nukuu iliyounganishwa.
  rationale: SBLGNT inamtaja Yeremia waziwazi. Tafsiri inapaswa kuwasilisha ushahidi huo na kuacha mvutano wa kihistoria na kimatini uelezwe katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo wa utimilifu wa kinabii na marudio ya wazo la kuthamini/kumwekea thamani yamehifadhiwa bila kufanya kirai kigumu cha mwisho kiwe na uhakika kuliko Kigiriki.
