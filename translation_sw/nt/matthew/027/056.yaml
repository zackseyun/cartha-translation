  text: among whom were Mary Magdalene[a], and Mary the mother of James and Joseph, and the mother of the sons of Zebedee.
translation:
  language: sw
  text: Miongoni mwao walikuwapo Maria Magdalene, Maria, mama wa Yakobo na Yosefu,[a] na mama wa wana wa Zebedayo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati za kale zina “Yose” badala ya “Yosefu.”
    reason: textual_variant
lexical_decisions:
- source_word: ἐν αἷς
  choice: Miongoni mwao
  rationale: Kirai hiki kinarejelea kundi la wanawake waliotajwa katika mstari uliotangulia; “miongoni mwao” ni Kiswahili cha kawaida kinachoonyesha kuwa wanawake hawa walikuwa sehemu ya kundi hilo.
- source_word: ἦν
  choice: walikuwapo
  rationale: Ingawa kitenzi cha Kigiriki kiko katika umoja, kinatumika kwa maana ya kuwapo na kufuatiwa na orodha ya wanawake; Kiswahili hutumia ngeli ya watu katika wingi.
- source_word: Μαρία ἡ Μαγδαληνὴ
  choice: Maria Magdalene
  rationale: Hili ndilo umbo lililozoeleka katika Kiswahili kwa jina na utambulisho wa Maria wa Magdala.
- source_word: Μαρία ἡ τοῦ Ἰακώβου καὶ Ἰωσὴφ μήτηρ
  choice: Maria mama yao Yakobo na Yosefu
  rationale: Genitivi hizo zinamtambulisha Maria kwa kutaja wanawe wawili. Muundo huu ni wa asili na wazi katika Kiswahili.
- source_word: Ἰακώβου
  choice: Yakobo
  rationale: “Yakobo” ni umbo la kawaida la jina Ἰάκωβος katika tafsiri za Kiswahili za Agano Jipya.
- source_word: Ἰωσὴφ
  choice: Yosefu
  rationale: SBLGNT inasoma Ἰωσήφ hapa, ambalo kwa kawaida hutafsiriwa “Yosefu”; tofauti ya “Yose” imehifadhiwa katika tanbihi.
- source_word: ἡ μήτηρ τῶν υἱῶν Ζεβεδαίου
  choice: mama yao wana wa Zebedayo
  rationale: Muundo huu unaonyesha wazi uhusiano uliomo katika genitivi ya Kigiriki huku ukibaki wa kawaida na wenye heshima katika Kiswahili.
- source_word: Ζεβεδαίου
  choice: Zebedayo
  rationale: “Zebedayo” ni umbo la jina Ζεβεδαῖος lililozoeleka katika Kiswahili.
