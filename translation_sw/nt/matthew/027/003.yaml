  text: Τότε ἰδὼν Ἰούδας ὁ ⸀παραδιδοὺς αὐτὸν ὅτι κατεκρίθη μεταμεληθεὶς ⸀ἔστρεψεν τὰ τριάκοντα ἀργύρια τοῖς ἀρχιερεῦσιν ⸀καὶ πρεσβυτέροις
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/003.yaml
  text: Then Judas[a], who had betrayed him, seeing that he had been condemned[b], regretted it and returned the thirty pieces of silver to the chief priests and elders.
translation:
  language: sw
  text: Kisha Yuda, aliyemsaliti, alipoona kwamba Yesu alikuwa amehukumiwa, alijuta akawarudishia makuhani wakuu na wazee vipande thelathini vya fedha.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: Kisha
  rationale: Kiashiria cha wakati kinachoendeleza mfululizo wa matukio kwa Kiswahili cha kawaida.
- source_word: ἰδὼν
  choice: alipoona
  rationale: Kishiriki cha aoristi kinaeleweka hapa kwa maana ya wakati; muundo huu ni wa asili na unaonyesha kuwa tendo la kuona lilitangulia kujuta na kurudisha fedha.
- source_word: Ἰούδας
  choice: Yuda
  rationale: Umbo la jina linalotumika kwa kawaida katika Biblia za Kiswahili.
- source_word: ὁ παραδιδοὺς αὐτόν
  choice: aliyekuwa amemsaliti
  rationale: Kishiriki chenye kibainishi kinamtambulisha Yuda kwa tendo lake; 'amsaliti' huwasilisha maana ya kimuktadha ya kumkabidhi Yesu kwa maadui, huku wakati timilifu ukionyesha tendo lililokwisha kutokea.
- source_word: ὅτι κατεκρίθη
  choice: kwamba Yesu alikuwa amehukumiwa
  rationale: ὅτι hutambulisha maudhui ya alichoona Yuda, na aoristi tendwa huonyesha hukumu iliyotolewa dhidi ya Yesu. Jina 'Yesu' linaondoa utata wa kiwakilishi unaoweza kutokea katika Kiswahili.
- source_word: μεταμεληθεὶς
  choice: alijuta
  rationale: '''Alijuta'' huonyesha majuto bila kudai kwa lazima toba kamili ya kiroho, hivyo inalinda tofauti ya kimaana kati ya μεταμέλομαι na μετανοέω.'
- source_word: ἔστρεψεν
  choice: aliwarudishia
  rationale: Katika muktadha wa fedha na wapokeaji, kitenzi kina maana ya kurudisha kitu kwa wahusika waliokitoa.
- source_word: τὰ τριάκοντα ἀργύρια
  choice: vile vipande thelathini vya fedha
  rationale: ἀργύρια ni fedha katika vipande vilivyotumika kama pesa; 'vipande vya fedha' ni sahihi, kinaeleweka, na kinahifadhi mwangwi wa kifungu cha awali katika Mathayo 26:15.
- source_word: τοῖς ἀρχιερεῦσιν καὶ πρεσβυτέροις
  choice: makuhani wakuu na wazee
  rationale: Haya ni majina ya kawaida ya Kiswahili kwa makundi haya mawili ya viongozi wa Kiyahudi.
theological_decisions:
- issue: Maana ya μεταμεληθεὶς kuhusu mwitikio wa Yuda
  choice: alijuta
  alternative: alitubu; alibadili nia
  rationale: Neno la Kigiriki linaeleza majuto au kujisikia vibaya kuhusu tendo, lakini halitatui moja kwa moja hali ya kiroho ya Yuda. 'Alijuta' huepuka kuingiza dai lenye nguvu zaidi la kitheolojia.
- issue: Kirejeleo cha kiwakilishi katika ὅτι κατεκρίθη
  choice: kwamba Yesu alikuwa amehukumiwa
  alternative: kwamba alikuwa amehukumiwa
  rationale: Kigiriki hutumia kiwakilishi kinachoeleweka kumrejelea Yesu. Kutaja 'Yesu' kwa Kiswahili kunazuia msomaji kudhani kuwa Yuda ndiye aliyehukumiwa, bila kubadili maana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini cha kawaida na kinachoeleweka. Sentensi imepangwa kwa mtiririko wa asili wa Kiswahili; hakuna alama za tanbihi kwa kuwa matini hii haihitaji mbadala wa lazima wa uchapishaji.
