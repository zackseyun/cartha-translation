  text: and placed it in his own new tomb[a], which he had cut into the rock. And after rolling a large stone to the entrance of the tomb, he went away.
translation:
  language: sw
  text: Akauweka katika kaburi lake jipya, ambalo alikuwa amelichonga mwambani. Kisha akavingirisha jiwe kubwa hadi kwenye mwingilio[a] wa kaburi, akaondoka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwenye mlango wa kaburi.” Neno la Kigiriki linaweza kumaanisha “mlango” au “mwingilio”; “mwingilio” umetumiwa hapa kwa sababu ya kaburi lililochongwa mwambani.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθηκεν αὐτό
  choice: akauweka
  rationale: Kitenzi τίθημι kinaeleza kuuweka mwili wa Yesu kaburini. Kiambishi cha yambwa “-u-” kinarejelea mwili uliotajwa katika muktadha bila kuongeza nomino ambayo haijarudiwa katika Kigiriki.
- source_word: καινῷ αὐτοῦ μνημείῳ
  choice: kaburi lake jipya
  rationale: μνημεῖον hapa ni kaburi la kuchongwa mwambani, na καινός ni “jipya”; tafsiri haiongezi wazo la “ambalo halijawahi kutumiwa,” ingawa huenda hilo likadokezwa na muktadha.
- source_word: ἐλατόμησεν ἐν τῇ πέτρᾳ
  choice: alikuwa amelichonga mwambani
  rationale: λατομέω humaanisha kuchonga au kutoboa mwamba. Muundo huu wa wakati unaonyesha kwa kawaida kwamba kaburi lilikuwa limekwisha chongwa kabla ya maziko.
- source_word: προσκυλίσας λίθον μέγαν
  choice: akavingirisha jiwe kubwa
  rationale: Kitenzi kishirikishi cha wakati uliopita kinaonyesha tendo lililotangulia kuondoka kwake; “akavingirisha” huwasilisha tendo hilo na mfuatano wa simulizi kwa Kiswahili cha kawaida.
- source_word: τῇ θύρᾳ τοῦ μνημείου
  choice: hadi kwenye mwingilio wa kaburi
  rationale: θύρα linaweza kumaanisha mlango au mwingilio. “Mwingilio” unaweka wazi kwamba kinachozungumziwa ni uwazi wa kaburi lililochongwa mwambani, si lazima mlango wenye bawaba.
- source_word: ἀπῆλθεν
  choice: akaondoka
  rationale: ἀπέρχομαι hapa inaeleza kuondoka kwa urahisi; “akaondoka” ni ya asili na inaendeleza mfuatano wa simulizi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wazi na wenye heshima. Muundo wa “aka-” unahifadhi mfuatano wa matendo, huku “mwambani” ikieleza kwa ufupi mazingira ya kaburi lililochongwa ndani ya mwamba.
