lexical_decisions:
- source_word: λαβὼν
  choice: akauchukua
  rationale: Kitenzi-shirikishi cha aoristi kinaonyesha tendo lililotangulia tendo kuu. Muundo wa Kiswahili wenye vitenzi vinavyofuatana, “akauchukua ... na kuufunga,” unasimulia mfuatano huo kwa kawaida.
- source_word: σῶμα
  choice: mwili
  rationale: Maana ya moja kwa moja ni “mwili.” Hakuna kimilikishi cha wazi katika Kigiriki, kwa hiyo tafsiri haiongezi “wake.”
- source_word: ἐνετύλιξεν
  choice: kuufunga
  rationale: ἐντυλίσσω humaanisha kufunga kwa kuzungushia au kukunja ndani ya kitu. “Kuufunga kwa kitambaa” ni usemi wa kawaida wa Kiswahili katika muktadha huu.
- source_word: αὐτὸ
  choice: -u- katika “kuufunga”
  rationale: Kiwakilishi cha Kigiriki ni cha jinsia ya kati na kinarejelea kisarufi σῶμα. Kiswahili hukirejelea “mwili” kwa kiambishi cha ngeli ya M-MI, -u-, bila kuleta utofauti wa Kiingereza kati ya “it” na “him.”
- source_word: σινδόνι
  choice: kwa kitambaa ... cha kitani
  rationale: σινδών ni kitambaa cha kitani na katika muktadha wa maziko kinaweza kuwa sanda. Tafsiri kuu inabaki pana zaidi, huku tanbihi ikitoa maana maalumu inayowezekana.
- source_word: καθαρᾷ
  choice: safi
  rationale: Katika muktadha huu καθαρός hueleza kitambaa kuwa kisafi; “safi” ni ya kawaida na inayofaa kuliko “takatifu” au “halisi.”
- source_word: καὶ ... ὁ Ἰωσὴφ
  choice: Naye Yosefu
  rationale: “Naye” hudumisha mwendelezo wa simulizi unaoletwa na καί na kumweka Yosefu kama mhusika wa tendo bila kuongeza wazo la muda lisilosemwa wazi.
