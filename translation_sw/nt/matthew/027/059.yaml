  text: Naye Yosefu akauchukua mwili, akauviringisha katika kitambaa safi cha kitani[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “katika sanda safi ya kitani.” Neno la Kigiriki linaweza kumaanisha kitambaa cha kitani kilichotumiwa kama sanda ya maziko.
