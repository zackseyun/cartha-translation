base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/049.yaml
  text: But the rest said[a], “Leave him alone[b]. Let us see whether Elijah is coming to save him.”
translation:
  language: sw
  text: Lakini wale waliobaki wakasema[a], “Mwache[b]. Tuone kama Eliya anakuja kumwokoa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Lakini wengine wakasema.”
    reason: λοιποί inaweza kutafsiriwa “wengine”; “wale waliobaki” huonyesha kwa wazi zaidi maana ya kundi lililobaki kinyume na msemaji au watendaji waliotangulia.
  - marker: b
    text: Au, “Acha; tuone kama Eliya atakuja kumwokoa.”
    reason: Amri ya Kigiriki haina mtendwa uliotajwa wazi; inaweza kueleweka kama kumwacha Yesu au kuacha tendo lililokuwa likifanywa. Wakati wa sasa wa “anakuja” unaweza pia kutolewa kwa maana ya wakati ujao katika Kiswahili.
lexical_decisions:
- source_word: οἱ δὲ λοιποὶ
  choice: Lakini wale wengine
  rationale: Huhifadhi utofautishaji unaoletwa na δέ na maana ya λοιποί kama watu wengine waliobaki tofauti na msemaji au watendaji waliotangulia.
- source_word: ἔλεγον
  choice: wakasema
  rationale: Ingawa hali ya kitenzi cha Kigiriki inaweza kuonyesha usemi ulioendelea au uliorudiwa, “wakasema” ni simulizi la kawaida la Kiswahili bila kuzidisha kipengele hicho.
- source_word: Ἄφες
  choice: Mwache
  rationale: Amri ya umoja inaeleweka katika muktadha kuwa ni kumwacha Yesu bila kuingiliwa, ili waone kitakachotokea.
- source_word: ἴδωμεν
  choice: Tuone
  rationale: Hii ni kauli ya kujihimiza katika nafsi ya kwanza wingi; “Tuone” ni tafsiri ya moja kwa moja na ya asili.
- source_word: εἰ ἔρχεται
  choice: kama ... anakuja
  rationale: εἰ inaanzisha swali lisilo la moja kwa moja, na wakati wa sasa wa ἔρχεται umehifadhiwa kwa “anakuja,” jambo linalodumisha uharaka wa tukio.
- source_word: Ἠλίας
  choice: Eliya
  rationale: Hili ndilo umbo la kawaida la jina la nabii huyo katika Kiswahili cha Biblia.
- source_word: σώσων αὐτόν
  choice: kumwokoa
  rationale: Kitenzi kishirikishi cha wakati ujao kinaonyesha kusudi la kuja kwa Eliya; “kumwokoa” huhifadhi uhusiano wa kimsamiati na σῴζω na hapa humaanisha kumtoa katika kifo.
theological_decisions:
- issue: Dokezo la kitheolojia la σῴζω katika muktadha wa kusulubiwa
  choice: kumwokoa
  alternative: kumwokoa kutoka hatarini / kumkomboa
  rationale: Katika usemi wa watazamaji, maana ya karibu ni kuondolewa msalabani au kuokolewa na kifo. “Kumwokoa” huhifadhi pia kejeli ya simulizi bila kuifanya kauli hii kuwa ufafanuzi wa wokovu wa milele.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa asili katika simulizi, huku wakati wa sasa wa ἔρχεται na utata mdogo wa Ἄφες vikihifadhiwa katika matini na tanbihi.
