  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ πλέξαντες στέφανον ἐξ ἀκανθῶν ἐπέθηκαν ἐπὶ ⸂τῆς κεφαλῆς⸃ αὐτοῦ καὶ κάλαμον ⸂ἐν τῇ δεξιᾷ⸃ αὐτοῦ, καὶ γονυπετήσαντες ἔμπροσθεν αὐτοῦ ⸀ἐνέπαιξαν αὐτῷ λέγοντες· Χαῖρε, ⸀βασιλεῦ τῶν Ἰουδαίων,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/029.yaml
  text: And after weaving a crown of thorns[a], they put it on his head, and a reed in his right hand; and kneeling before him, they mocked him, saying, “Hail, King of the Jews!”
translation:
  language: sw
  text: Nao, baada ya kusokota taji la miiba, wakaliweka kichwani mwake, wakaweka pia mwanzi katika mkono wake wa kulia. Kisha wakapiga magoti mbele yake na kumdhihaki wakisema, “Salamu, Mfalme wa Wayahudi![a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Mfalme wa watu wa Yudea.” Neno la Kigiriki Ἰουδαίων linaweza kumaanisha Wayahudi au watu wa Yudea; hapa limetumiwa katika cheo cha kifalme walichomtaja Yesu nacho kwa kejeli.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλέξαντες
  choice: baada ya kusokota
  rationale: Huwasilisha kitendo cha awali cha aoristi kwa Kiswahili cha kawaida na kuonyesha kwamba walitengeneza taji kwa kusokota miiba pamoja.
- source_word: στέφανον ἐξ ἀκανθῶν
  choice: taji la miiba
  rationale: “Taji” linafaa katika mazingira ya kejeli ya kifalme, na “la miiba” linaonyesha nyenzo iliyotumiwa bila kuongeza maelezo yasiyokuwamo.
- source_word: ἐπέθηκαν ἐπὶ τῆς κεφαλῆς αὐτοῦ
  choice: wakaliweka kichwani mwake
  rationale: Ni usemi wa kawaida wa Kiswahili unaohifadhi kitendo na mahali taji lilipowekwa.
- source_word: κάλαμον
  choice: mwanzi
  rationale: Hutaja kitu halisi bila kukitafsiri moja kwa moja kuwa fimbo ya kifalme, ingawa ndicho kilichoigizwa katika kejeli hiyo.
- source_word: ἐν τῇ δεξιᾷ αὐτοῦ
  choice: katika mkono wake wa kulia
  rationale: Hutoa wazi mahali mwanzi ulipowekwa na kuhifadhi taswira ya maigizo ya kifalme.
- source_word: γονυπετήσαντες ἔμπροσθεν αὐτοῦ
  choice: wakapiga magoti mbele yake
  rationale: Ni Kiswahili cha asili kinachoonyesha mkao wa heshima waliouigiza kwa dhihaka.
- source_word: ἐνέπαιξαν αὐτῷ
  choice: kumdhihaki
  rationale: “Kudhihaki” linaonyesha kejeli yenye dharau na linafaa kwa usajili wenye hadhi wa simulizi.
- source_word: Χαῖρε
  choice: Salamu
  rationale: Katika muktadha huu ni salamu rasmi ya kumtukuza mfalme kwa kejeli; “Salamu” ni ya kawaida na haibadilishi usemi kuwa amri ya kufurahi.
- source_word: βασιλεῦ τῶν Ἰουδαίων
  choice: Mfalme wa Wayahudi
  rationale: Hili ndilo jina la kifalme linalotumiwa kwa kejeli katika simulizi. “Wayahudi” linaonyesha vizuri maana pana ya kikabila na kidini katika muktadha huu, huku uwezekano wa maana ya kieneo ukihifadhiwa katika tanbihi.
theological_decisions:
- issue: Kuhifadhi kejeli ya salamu ya kifalme bila kudhoofisha cheo cha Yesu
  choice: “Salamu, Mfalme wa Wayahudi!”
  alternative: “U salama, Mfalme wa Wayahudi!”
  rationale: “Salamu” huhifadhi namna ya kumwamkia mfalme kwa kejeli katika Kiswahili cha sasa, bila kuingiza ufafanuzi wa moja kwa moja kwamba walikuwa wakijifanya kumpa heshima.
- issue: Maana ya Ἰουδαίων katika cheo
  choice: Wayahudi
  alternative: watu wa Yudea
  rationale: Katika cheo hiki cha mashtaka na kejeli, neno linaelekea kumaanisha jamii pana ya Wayahudi, lakini maana ya kieneo ya watu wa Yudea inawezekana na imeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo unafuata mfuatano wa matendo katika Kigiriki huku ukitumia viunganishi vya kawaida vya Kiswahili. Alama ya tanbihi imewekwa baada ya kirai kinachohusika, “Mfalme wa Wayahudi.”
