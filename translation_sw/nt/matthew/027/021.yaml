  text: ἀποκριθεὶς δὲ ὁ ἡγεμὼν εἶπεν αὐτοῖς· Τίνα θέλετε ἀπὸ τῶν δύο ἀπολύσω ὑμῖν; οἱ δὲ εἶπαν· ⸀Τὸν Βαραββᾶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/021.yaml
  text: But the governor answered them, “Which of the two do you want me to release for you?” And they said, “Barabbas.”
translation:
  language: sw
  text: Lakini gavana akawajibu, “Ni yupi kati ya hao wawili mnayetaka nimfungulie?” Nao wakasema, “Baraba.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ ἡγεμὼν εἶπεν αὐτοῖς
  choice: Lakini gavana akawajibu
  rationale: Muundo wa Kigiriki wa kishiriki pamoja na kitenzi cha kusema unaunganishwa kwa Kiswahili cha asili kuwa ‘akawajibu’; δέ imetafsiriwa ‘Lakini’ ili kuonyesha geuko dogo katika mazungumzo.
- source_word: Τίνα ... ἀπὸ τῶν δύο
  choice: Ni yupi kati ya hao wawili
  rationale: Swali linataka wachague mtu mmoja kati ya watu wawili waliotajwa; muundo huu ni wa kawaida na wazi katika Kiswahili.
- source_word: θέλετε
  choice: mnayetaka
  rationale: θέλω hapa huonyesha matakwa au uchaguzi, hivyo ‘kutaka’ ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: ἀπολύσω ὑμῖν
  choice: niwafungulie
  rationale: Katika muktadha wa kisheria ἀπολύω humaanisha kumwachilia mtu huru; kiambishi ‘-wa-’ kinamrejelea yule atakayefunguliwa, na ‘-lie’ kinaonyesha tendo kufanywa kwa ajili ya umati.
- source_word: οἱ δὲ εἶπαν
  choice: Nao wakasema
  rationale: δέ hapa inaendeleza simulizi na kuleta jibu la umati bila ulazima wa kusisitiza upinzani.
- source_word: Τὸν Βαραββᾶν
  choice: Baraba
  rationale: Jina limetolewa kwa umbo lililozoeleka katika tafsiri za Kiswahili, bila kuwakilisha kibainishi cha hali ya kushutumiwa cha Kigiriki.
