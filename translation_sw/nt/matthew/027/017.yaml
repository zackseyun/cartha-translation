  text: συνηγμένων οὖν αὐτῶν εἶπεν αὐτοῖς ὁ Πιλᾶτος· Τίνα θέλετε ἀπολύσω ὑμῖν, ⸂Ἰησοῦν τὸν⸃ Βαραββᾶν ἢ Ἰησοῦν τὸν λεγόμενον χριστόν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/017.yaml
  text: 'So when they had gathered together[a], Pilate said to them, “Which one do you want me to release to you: Jesus Barabbas[b], or Jesus who is called Messiah?”'
translation:
  language: sw
  text: 'Basi, walipokuwa wamekusanyika, Pilato aliwaambia, “Mnataka nimwachilie yupi: Yesu Baraba[a], au Yesu anayeitwa Masihi[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati zina ‘Baraba’ tu badala ya ‘Yesu Baraba.’
    reason: textual_variant
  - marker: b
    text: Au, ‘Kristo.’ Neno la Kigiriki ni Christos; hapa limetafsiriwa ‘Masihi’ kwa sababu linatumika kama cheo.
    reason: alternative_reading
lexical_decisions:
- source_word: συνηγμένων
  choice: baada ya wao kukusanyika
  rationale: Kirai hiki cha Kigiriki kinaonyesha tendo la kukusanyika lililokamilika kabla ya Pilato kuuliza. Tafsiri hii ni ya kawaida katika Kiswahili na inadumisha uhusiano huo wa wakati.
- source_word: οὖν
  choice: Basi
  rationale: Neno hili linaendeleza simulizi na kuunganisha swali la Pilato na yaliyotangulia bila kuongeza uzito wa kimantiki usio lazima.
- source_word: Τίνα θέλετε
  choice: Mnataka ... yupi
  rationale: Muundo huu unaeleza kwa kawaida uchaguzi kati ya watu wawili na kuhifadhi maana ya θέλω ya kutaka au kupendelea.
- source_word: ἀπολύσω ὑμῖν
  choice: niwafungulie
  rationale: Katika muktadha wa mfungwa, kitenzi hiki humaanisha kumweka huru. ‘Niwafungulie’ ni usemi wa Kiswahili unaofaa kwa tendo la mamlaka kumwachilia mfungwa, huku kiambishi ‘-wa-’ kikidokeza kwamba anaachiliwa kwa ajili yao.
- source_word: Ἰησοῦν τὸν Βαραββᾶν
  choice: Yesu Baraba
  rationale: Toleo la SBLGNT lina jina Ἰησοῦν, hivyo limetafsiriwa wazi ili kuhifadhi ulinganisho wa watu wawili wanaoitwa Yesu.
- source_word: Ἰησοῦν τὸν λεγόμενον χριστόν
  choice: Yesu anayeitwa Masihi
  rationale: λεγόμενον ni ‘anayeitwa,’ bila dharau inayoweza kudokezwa na ‘anayedaiwa kuwa.’ Hapa χριστός ni cheo, kwa hiyo limetafsiriwa ‘Masihi.’
theological_decisions:
- issue: Tafsiri ya χριστός
  choice: Masihi
  alternative: Kristo
  rationale: Katika kirai ‘anayeitwa χριστός,’ neno hilo linafanya kazi wazi kama cheo. ‘Masihi’ huwasilisha maana ya cheo hicho, huku ‘Kristo’ ikihifadhiwa katika tanbihi kama tafsiri nyingine iliyozoeleka.
- issue: Kuwekwa kwa jina ‘Yesu’ kabla ya Baraba
  choice: Yesu Baraba katika matini kuu
  alternative: Baraba pekee
  rationale: Matini ya msingi iliyotolewa, SBLGNT, ina Ἰησοῦν kabla ya Βαραββᾶν. Tofauti ya hati zinazoliacha jina hilo imehifadhiwa katika tanbihi bila kuificha tofauti ya kimatini.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa swali ni mwepesi kueleweka katika usomaji wa hadhara. Alama za tanbihi zimewekwa mara tu baada ya maneno yanayohusika.
