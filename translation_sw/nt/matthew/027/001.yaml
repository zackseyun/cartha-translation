id: MAT.27.1
reference: Matthew 27:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Πρωΐας δὲ γενομένης συμβούλιον ἔλαβον πάντες οἱ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι τοῦ λαοῦ κατὰ τοῦ Ἰησοῦ ὥστε θανατῶσαι αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/001.yaml
  text: When morning came[b][a], all the chief priests and the elders of the people took counsel against Jesus so as to put him to death.
translation:
  language: sw
  text: Asubuhi ilipofika[a], makuhani wakuu wote na wazee wote wa watu walifanya mashauriano[b] dhidi ya Yesu ili wamuue.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kulipopambazuka.”
    reason: lexical_alternative
  - marker: b
    text: Au, “walishauriana.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρωΐας δὲ γενομένης
  choice: Asubuhi ilipofika
  rationale: Kirai huru cha kijeni kinaonyesha mpito wa wakati. Tafsiri hii ni ya kawaida katika Kiswahili na inahifadhi maana ya kufika kwa asubuhi; δέ inaeleweka katika mpito wa simulizi bila kutafsiriwa kwa neno tofauti.
- source_word: συμβούλιον ἔλαβον
  choice: walifanya mashauriano
  rationale: Nahau hii inaeleza kukutana na kujadiliana ili kuamua hatua. ‘Walifanya mashauriano’ inahifadhi uzito wa kikao cha viongozi bila kuongeza wazo la njama ambalo halijasemwa wazi katika nahau yenyewe.
- source_word: πάντες
  choice: wote
  rationale: Neno hili linasisitiza ujumla wa viongozi waliotajwa na limehifadhiwa wazi.
- source_word: οἱ ἀρχιερεῖς
  choice: makuhani wakuu
  rationale: Hili ni jina la kawaida la kundi la viongozi wa kikuhani huko Yerusalemu; halimaanishi kwamba wote walishikilia kwa wakati mmoja cheo kimoja cha kuhani mkuu.
- source_word: οἱ πρεσβύτεροι τοῦ λαοῦ
  choice: wazee wa watu
  rationale: Tafsiri hii inahifadhi cheo rasmi cha viongozi hao na uhusiano wa kijeni katika Kiswahili cha kawaida.
- source_word: κατὰ τοῦ Ἰησοῦ
  choice: dhidi ya Yesu
  rationale: Katika muktadha huu wa uhasama, κατά pamoja na kijeni huonyesha upinzani, si kuzungumza tu kumhusu Yesu.
- source_word: ὥστε
  choice: ili
  rationale: Pamoja na kitenzi-jina kinachofuata, neno hili hapa linaonyesha kusudi au matokeo yaliyokusudiwa. ‘Ili’ ni ya asili na wazi katika Kiswahili.
- source_word: θανατῶσαι αὐτόν
  choice: wamuue
  rationale: Kitenzi cha Kigiriki kina maana ya kusababisha mtu afe au kumtia mtu kifo. ‘Wamuue’ ni wazi na hakiongezi maelezo mahususi ya utaratibu wa kisheria ambayo ‘wamhukumu auawe’ yangeweza kuingiza.
theological_decisions:
- issue: Aina ya hatua ya viongozi dhidi ya Yesu
  choice: 'Kuonyesha mashauriano ya uhasama yenye kusudi la kumuua Yesu: ‘walifanya mashauriano dhidi ya Yesu ili wamuue.’'
  alternative: Kutafsiri kwa udhaifu zaidi kuwa ‘walishauriana kuhusu Yesu,’ au kwa nguvu zaidi kuwa ‘walipanga njama dhidi ya Yesu.’
  rationale: κατά inaonyesha wazi uhasama, na ὥστε θανατῶσαι αὐτόν inaonyesha kusudi la kifo. Hata hivyo, ‘walifanya mashauriano’ haiongezi dhana maalumu ya njama zaidi ya ushahidi wa maneno ya Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imeundwa kwa mtiririko wa kawaida, huku ikihifadhi ‘wote,’ uhasama wa ‘dhidi ya Yesu,’ na kusudi la kumuua.
