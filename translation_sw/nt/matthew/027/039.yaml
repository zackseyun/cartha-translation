lexical_decisions:
- source_word: οἱ δὲ
  choice: Nao waliokuwa
  rationale: δέ ni kiunganishi chepesi cha kuendeleza simulizi; “Nao” ni cha kawaida katika Kiswahili. Kihusishi chenye kibainishi kinawakilishwa na muundo “waliokuwa ...” unaowataja watu hao.
- source_word: παραπορευόμενοι
  choice: wakipita
  rationale: Huwataja watu waliokuwa wakipita mahali pa kusulubiwa na huhifadhi hali ya tendo lililokuwa likiendelea.
- source_word: ἐβλασφήμουν
  choice: walikuwa wakimkufuru
  rationale: Kauli ya wakati usiotimilika inaonyesha tendo lililoendelea. “Kumkufuru” huhifadhi uzito wa kitenzi cha Kigiriki, ingawa katika muktadha huu kinaweza pia kumaanisha kumtukana au kumsema vibaya mtu; maana hiyo mbadala imeelezwa katika tanbihi.
- source_word: αὐτὸν
  choice: -m- katika “wakimkufuru”
  rationale: Kiambishi cha yambwa kinamrejelea Yesu kwa njia ya kawaida ya kisarufi katika Kiswahili.
- source_word: κινοῦντες
  choice: huku wakitikisa
  rationale: Muundo huu unaonyesha kuwa ishara hiyo ilifanyika wakati uleule walipokuwa wakimkufuru.
- source_word: τὰς κεφαλὰς αὐτῶν
  choice: vichwa vyao
  rationale: Wingi wa Kigiriki umehifadhiwa kwa namna ya asili katika Kiswahili.
theological_decisions:
- issue: Maana ya βλασφημέω inapoelekezwa kwa Yesu katika simulizi la mateso
  choice: Kuhifadhi neno lenye uzito “wakimkufuru” katika matini kuu
  alternative: wakimtukana; wakimsema vibaya
  rationale: Kitenzi cha Kigiriki kina nguvu kuliko dhihaka ya kawaida, lakini si lazima kila mara kimaanishe maneno dhidi ya Mungu pekee. Tafsiri kuu huhifadhi uzito na mvutano wa usemi wa Mathayo bila kuamua kimadhehebu maana yake ya kitheolojia; tanbihi huonyesha upana wake wa kileksika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “walikuwa wakimkufuru” umechaguliwa ili kuonyesha tendo lililoendelea, na “huku wakitikisa” huunganisha kwa uwazi kitendo na ishara iliyokifuatana nacho. Alama zote za tanbihi zimewekwa katika matini kuu.
