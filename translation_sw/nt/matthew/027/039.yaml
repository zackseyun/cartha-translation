    text: Au, “walikuwa wakimkufuru.” Kitenzi cha Kigiriki kinaweza kumaanisha kumsema mtu kwa matusi au kumkashifu, na si kufuru kwa maana finyu ya kusema dhidi ya Mungu tu.
