base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/045.yaml
  text: From the sixth hour darkness came over all the land until the ninth hour[a][b].
translation:
  language: sw
  text: Kuanzia saa sita mchana, giza likatanda juu ya nchi yote hadi saa tisa alasiri[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika hesabu ya saa ya Kiyahudi na Kirumi, saa ya sita ni takriban adhuhuri, na saa ya tisa ni takriban saa tisa alasiri (3:00 alasiri).
    reason: cultural_note
  - marker: b
    text: Au, “juu ya dunia yote.” Neno la Kigiriki linaweza kumaanisha “nchi” au “dunia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ δὲ
  choice: Tangu
  rationale: ἀπό huonyesha mwanzo wa kipindi, na δέ ni kiunganishi hafifu ambacho si lazima kitafsiriwe kwa neno tofauti katika Kiswahili; “Tangu” huleta mtiririko wa kawaida.
- source_word: ἕκτης ὥρας
  choice: saa sita
  rationale: Huhifadhi namna ya asili ya kutaja wakati. Katika mfumo wa nyakati unaotumiwa hapa, saa sita ni takriban adhuhuri; ufafanuzi umetolewa katika tanbihi ili kuepuka mkanganyiko na mfumo wa kawaida wa saa za Kiswahili.
- source_word: σκότος
  choice: giza
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya hali ya kukosekana kwa nuru, na huhifadhi uzito wa tukio.
- source_word: ἐγένετο
  choice: likaenea
  rationale: Katika muktadha huu kitenzi kinaonyesha kuanza na kutokea kwa hali; “likaenea juu ya” ni Kiswahili cha kawaida kinachoeleza giza kuifunika eneo.
- source_word: ἐπὶ πᾶσαν τὴν γῆν
  choice: juu ya nchi yote
  rationale: γῆ inaweza kumaanisha nchi/eneo au dunia. “Nchi yote” huhifadhi uwezekano wa kurejelea eneo la simulizi bila kulazimisha maana ya ulimwengu mzima.
- source_word: ἕως ὥρας ἐνάτης
  choice: mpaka saa tisa
  rationale: Huhifadhi namna ya asili ya kutaja wakati; saa tisa ni takriban saa tatu alasiri katika mfumo wa kisasa, kama tanbihi inavyoeleza.
theological_decisions:
- issue: Upeo wa γῆ katika simulizi la giza
  choice: nchi
  alternative: dunia
  rationale: Nomino γῆ ina maana pana na inaweza kumaanisha nchi/eneo au dunia. “Nchi” inafaa kwa mazingira ya karibu ya simulizi bila kuamua kwamba giza lilikuwa la ulimwengu mzima; uwezekano wa “dunia” umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Usemi wa saa katika matini kuu umehifadhi muundo wa chanzo, huku tanbihi ikifafanua ulinganifu wake ili kuzuia mkanganyiko wa mfumo wa saa wa Kiswahili.
