  yaml_path: translation/nt/matthew/027/055.yaml
  text: There were many women there[a], watching from a distance, who had followed Jesus from Galilee[b], serving him.
translation:
  language: sw
  text: Huko kulikuwa na wanawake wengi waliokuwa wakitazama kwa mbali[a], waliomfuata Yesu kutoka Galilaya wakimhudumia[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakiangalia kutoka mbali.”
    reason: lexical_alternative
  - marker: b
    text: Au, “wakimtumikia.” Kitenzi cha Kigiriki kinaweza kumaanisha kutoa huduma au msaada wa vitendo.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦσαν δὲ ἐκεῖ
  choice: Kulikuwa na ... huko
  rationale: Muundo huu wa kawaida wa Kiswahili unaeleza kuwapo kwao mahali pale. δέ ni kiunganishi hafifu, hivyo hakijalazimishwa kuwa ‘lakini’ kana kwamba kuna utofautishaji mkali.
- source_word: γυναῖκες πολλαὶ
  choice: wanawake wengi
  rationale: Tafsiri ya moja kwa moja inayohifadhi wingi na jinsia ya kundi linalotajwa.
- source_word: ἀπὸ μακρόθεν θεωροῦσαι
  choice: wakitazama kwa mbali
  rationale: Kitenzi θεωρέω hapa kinaonyesha kutazama kwa makini au kwa muda, na kirai ἀπὸ μακρόθεν kinaonyesha umbali wao na tukio.
- source_word: αἵτινες ἠκολούθησαν τῷ Ἰησοῦ ἀπὸ τῆς Γαλιλαίας
  choice: Walikuwa wamemfuata Yesu kutoka Galilaya
  rationale: Kauli hii inawatambulisha wanawake hao kwa tendo lililotangulia tukio la sasa. ‘Walikuwa wamemfuata’ huonyesha kwa kawaida mfuatano huo wa wakati katika Kiswahili.
- source_word: διακονοῦσαι αὐτῷ
  choice: wakimhudumia
  rationale: διακονέω inaweza kumaanisha kutoa huduma, msaada, au mahitaji ya vitendo. ‘Wakimhudumia’ ni lugha ya kawaida isiyobana maana kuwa kazi ya nyumbani wala cheo rasmi cha kidini.
theological_decisions:
- issue: Maana ya διακονοῦσαι kuhusu jukumu la wanawake
  choice: wakimhudumia
  alternative: wakimtumikia
  rationale: Chaguo hili linahifadhi wazo pana la kuwapa Yesu huduma na msaada wa vitendo bila kuingiza dhana ya baadaye ya wadhifa rasmi wa kanisa.
- issue: Uhusiano wa wakati wa kuwafuata kwao Yesu na tukio la kusulubiwa
  choice: Walikuwa wamemfuata Yesu kutoka Galilaya
  alternative: Walimfuata Yesu kutoka Galilaya
  rationale: Wakati timilifu wa zamani katika Kiswahili unaonyesha wazi kuwa kufuata kwao kulianza kabla ya tukio ambalo sasa walikuwa wakilitazama, bila kubadili kiini cha taarifa ya Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Sentensi ya Kigiriki imegawanywa mara mbili ili kuepuka mfululizo mzito wa vishazi huku uhusiano wa mawazo ukihifadhiwa.
