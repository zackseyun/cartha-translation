  text: For he knew that they had handed him over because of envy[a].
translation:
  language: sw
  text: Kwa maana alijua kwamba walikuwa wamemkabidhi kwa sababu ya husuda[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa husuda” au “kwa sababu ya wivu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾔδει
  choice: alijua
  rationale: Kitenzi hiki huonyesha kujua au kufahamu; “alijua” ni tafsiri ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Kiunganishi hiki kinaeleza sababu ya kauli iliyotangulia; “Kwa maana” kinahifadhi uhusiano huo wa kimantiki kwa lugha ya asili.
- source_word: ὅτι
  choice: kwamba
  rationale: Hapa ὅτι kinaanzisha maudhui ya jambo ambalo Pilato alijua, wala si sababu nyingine.
- source_word: διὰ φθόνον
  choice: kwa sababu ya husuda
  rationale: διά pamoja na nomino katika hali ya akusativi huonyesha sababu. φθόνος ni husuda, yaani kutopendezwa na hali njema au hadhi ya mwingine.
- source_word: παρέδωκαν
  choice: walikuwa wamemkabidhi
  rationale: παραδίδωμι hapa humaanisha kumkabidhi mtu kwa mamlaka. Wakati timilifu wa zamani katika Kiswahili unaonyesha kuwa tendo hilo lilikuwa limetangulia kujua kwa Pilato.
- source_word: αὐτόν
  choice: -m- katika “wamemkabidhi”
  rationale: Kiwakilishi hiki kinamrejelea Yesu na kimewakilishwa kwa kiambishi cha yambwa cha ngeli ya mtu katika kitenzi.
theological_decisions:
- issue: Sababu iliyowasukuma waliomshtaki Yesu
  choice: Pilato alitambua kwamba walimkabidhi Yesu kwa sababu ya husuda.
  alternative: Pilato alitambua kwamba walimkabidhi Yesu kwa sababu ya wivu.
  rationale: φθόνος hutaja husuda au wivu dhidi ya hadhi au mafanikio ya mwingine. “Husuda” inalinda uzito wa kimaadili na kisaikolojia bila kuongeza maelezo ya kitheolojia yasiyomo katika mstari.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. “Husuda” limetumiwa katika maandishi, huku “wivu” likitolewa kama mbadala ulio wazi zaidi katika tanbihi.
