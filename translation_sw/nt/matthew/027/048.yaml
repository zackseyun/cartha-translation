  text: καὶ εὐθέως δραμὼν εἷς ἐξ αὐτῶν καὶ λαβὼν σπόγγον πλήσας τε ὄξους καὶ περιθεὶς καλάμῳ ἐπότιζεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/048.yaml
  text: And immediately one of them ran[a], took a sponge, filled it with sour wine, put it on a reed[b], and gave him a drink.
translation:
  language: sw
  text: Mara moja, mmoja wao akakimbia, akachukua sifongo, akaijaza divai siki[a], akaiweka juu ya mwanzi, kisha akawa akimnywesha Yesu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “siki.” Neno la Kigiriki linaweza kumaanisha divai siki au siki ya divai.'
    reason: lexical_alternative
  - marker: b
    text: 'Au: “akamnywesha Yesu.” Umbo la kitenzi cha Kigiriki linaweza kuonyesha tendo lililokuwa likiendelea.'
    reason: aspectual_alternative
lexical_decisions:
- source_word: εὐθέως
  choice: Mara moja
  rationale: Ni kauli ya kawaida ya Kiswahili inayoonyesha kwamba tendo lilifanyika bila kukawia.
- source_word: δραμὼν
  choice: akakimbia
  rationale: Huwasilisha kitenzi-shirikishi cha wakati uliopita kama tendo la simulizi, kwa Kiswahili cha kawaida na kwa kudumisha haraka ya tukio.
- source_word: εἷς ἐξ αὐτῶν
  choice: mmoja wao
  rationale: Ni usemi wa kawaida unaohifadhi maana kwamba mtu mmoja kutoka katika kundi hilo ndiye aliyetenda.
- source_word: λαβὼν σπόγγον
  choice: akachukua sifongo
  rationale: Hutoa mfuatano wa tendo kwa uwazi; “sifongo” ndilo neno la kawaida kwa σπόγγος.
- source_word: πλήσας τε ὄξους
  choice: akaijaza divai siki
  rationale: ὄξος ni divai iliyokuwa na uchachu mkali au iliyokaribia siki; “divai siki” hudumisha asili yake kama kinywaji bila kuifanya tu kuwa siki ya chakula.
- source_word: περιθεὶς καλάμῳ
  choice: akaiweka juu ya mwanzi
  rationale: “Mwanzi” ni linganifu la moja kwa moja la κάλαμος katika muktadha huu, na usemi unaonyesha kwamba sifongo iliwekwa kwenye mwanzi.
- source_word: ἐπότιζεν αὐτόν
  choice: akawa akimnywesha Yesu
  rationale: Muundo huu unaakisi hali endelevu ya kitenzi cha Kigiriki cha wakati usiotimilika na unaonyesha kusababisha anywe. Jina “Yesu” limetumiwa badala ya kiwakilishi ili sentensi iwe wazi katika Kiswahili.
theological_decisions:
- issue: Aina ya kinywaji alichopewa Yesu
  choice: divai siki
  alternative: siki
  rationale: ὄξος inaweza kumaanisha divai iliyogeuka kuwa kali na siki, au siki ya divai. “Divai siki” huepuka picha ya kisasa ya siki ya kupikia pekee, huku tanbihi ikihifadhi uwezekano mwingine wa kileksika.
- issue: Hali ya tendo la kumnywesha Yesu
  choice: akawa akimnywesha Yesu
  alternative: akamnywesha Yesu
  rationale: Kitenzi ἐπότιζεν kiko katika wakati usiotimilika na kinaweza kuonyesha tendo lililokuwa likiendelea. Tafsiri haiongezi kwa uhakika kwamba Yesu alikunywa, bali inaeleza tendo la mtu huyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya simulizi. Mfuatano wa vitenzi vya “aka-” unawasilisha kwa urahisi mlolongo wa matendo ya Kigiriki; “akawa akimnywesha” hutofautisha tendo kuu lenye hali endelevu.
