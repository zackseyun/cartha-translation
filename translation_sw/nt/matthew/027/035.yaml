  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: σταυρώσαντες δὲ αὐτὸν διεμερίσαντο τὰ ἱμάτια αὐτοῦ βάλλοντες κλῆρον,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/035.yaml
  text: And after they crucified him[a], they divided his garments by casting lots.
translation:
  language: sw
  text: Baada ya kumsulubisha[a], wakagawana mavazi yake kwa kupiga kura.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa muundo rasmi zaidi, “Walipokwisha kumsulubisha, wakagawana mavazi yake, wakipiga kura.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σταυρώσαντες
  choice: Baada ya kumsulubisha
  rationale: Kirai tegemezi cha wakati uliopita kinaonyesha kwamba kusulubisha kulitokea kabla ya kugawana mavazi; muundo huu ni wa asili katika Kiswahili na huhifadhi mfuatano huo.
- source_word: δὲ
  choice: waka-
  rationale: Kiunganishi hiki ni cha mpito mpole katika simulizi. Katika Kiswahili, kiambishi simulizi waka- kinaendeleza mtiririko kwa kawaida bila kukazia mno uhusiano.
- source_word: διεμερίσαντο
  choice: wakagawana
  rationale: Kitenzi hiki humaanisha kugawa kitu miongoni mwa wahusika. 'Kugawana' kinaonyesha kwa kawaida kwamba waligawa mavazi hayo wao kwa wao.
- source_word: τὰ ἱμάτια αὐτοῦ
  choice: mavazi yake
  rationale: '''Mavazi'' ni neno la sasa, lenye heshima na pana vya kutosha kuwakilisha ἱμάτια bila kuyawekea maana mahsusi ya mavazi ya nje pekee.'
- source_word: βάλλοντες κλῆρον
  choice: kwa kupiga kura
  rationale: Kirai hiki kinaeleza njia waliyotumia kugawana mavazi. 'Kupiga kura' ni usemi wa kawaida wa Kiswahili kwa desturi ya kuamua mgao kwa kura, huku umoja wa κλῆρον ukiwakilishwa kwa usemi wa kawaida.
theological_decisions:
- issue: Uhusiano wa βάλλοντες κλῆρον na διεμερίσαντο
  choice: 'Kirai kimetafsiriwa kama njia ya kugawana: ''wakagawana mavazi yake kwa kupiga kura.'''
  alternative: '''wakagawana mavazi yake, wakipiga kura'''
  rationale: Kisifa cha Kigiriki kinaeleza kwa kawaida namna mgawanyo ulivyofanywa. 'Kwa kupiga kura' huweka uhusiano huo wazi bila kuongeza maudhui ya kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo wa simulizi umetunzwa bila kutumia lugha ya kizamani.
