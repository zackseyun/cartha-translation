  source_fidelity: “Baada ya kumsulubisha, wakagawana mavazi yake kwa kupiga kura” accurately represents the aorist participle’s prior action, the narrative continuation, the division of his garments, and the means expressed by βάλλοντες κλῆρον. “Kupiga kura” is the established Kiswahili idiom in biblical and narrative context for determining a share by lot, despite its also having a modern electoral sense.
