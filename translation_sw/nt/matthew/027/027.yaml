id: MAT.27.27
reference: Matthew 27:27
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Τότε οἱ στρατιῶται τοῦ ἡγεμόνος παραλαβόντες τὸν Ἰησοῦν εἰς τὸ πραιτώριον συνήγαγον ἐπ’ αὐτὸν ὅλην τὴν σπεῖραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/027.yaml
  text: Then the governor’s soldiers took Jesus into the praetorium and gathered the whole cohort around him[a][b].
translation:
  language: sw
  text: Kisha askari wa gavana wakamchukua Yesu na kumpeleka ndani ya praetorio[a], wakakusanya kikosi kizima cha askari kumzunguka[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “makao makuu ya gavana.” Neno la Kigiriki linamaanisha makao rasmi au makao makuu ya kijeshi ya gavana wa Kirumi.
    reason: lexical_alternative
  - marker: b
    text: “Kikosi” hapa hutafsiri istilahi ya kijeshi ya Kirumi inayoweza kumaanisha kitengo cha askari; si lazima idokeze kwamba kila askari wa kikosi kamili alikuwapo hapo.
    reason: cultural_note
lexical_decisions:
- source_word: Τότε
  choice: Kisha
  rationale: Kiunganishi hiki kinaendeleza mfuatano wa matukio kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: στρατιῶται τοῦ ἡγεμόνος
  choice: askari wa gavana
  rationale: Muundo huu wa kawaida wa Kiswahili unaonyesha uhusiano wa askari hao na gavana wa Kirumi bila kudokeza lazima kwamba walikuwa mali yake binafsi.
- source_word: ἡγεμόνος
  choice: gavana
  rationale: Katika muktadha huu neno linamtaja mtawala wa jimbo wa Kirumi; “gavana” ni wazi na halibani maana kuwa cheo maalumu zaidi ya neno la Kigiriki.
- source_word: παραλαβόντες τὸν Ἰησοῦν εἰς τὸ πραιτώριον
  choice: wakamchukua Yesu na kumpeleka ndani ya praetorio
  rationale: Hueleza kwa Kiswahili cha kawaida kwamba askari walimchukua Yesu pamoja nao na kuingia naye ndani; “praetorio” huhifadhi istilahi ya kihistoria ya mahali hapo.
- source_word: συνήγαγον ἐπ’ αὐτὸν
  choice: wakakusanya ... kumzunguka
  rationale: Hutoa picha ya askari kukusanyika kuelekea kwa Yesu na kuwa kumzunguka, maana inayofaa zaidi katika tukio hili.
- source_word: ὅλην τὴν σπεῖραν
  choice: kikosi kizima cha askari
  rationale: “Kikosi” ni neno la kijeshi linaloeleweka kwa wasomaji wa kawaida, na “kizima” linaakisi ὅλην; maelezo ya chini yanafafanua istilahi ya Kirumi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa vitenzi mfululizo ni wa asili katika masimulizi ya Kiswahili. Istilahi ya kihistoria “praetorio” imehifadhiwa na kufafanuliwa katika tanbihi; “kikosi cha askari” ni wazi zaidi kwa msomaji wa kawaida kuliko unukuzi wa istilahi ya Kilatini.
