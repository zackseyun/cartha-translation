  text: καὶ ἐν τῷ κατηγορεῖσθαι αὐτὸν ὑπὸ τῶν ἀρχιερέων ⸀καὶ πρεσβυτέρων οὐδὲν ἀπεκρίνατο.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/012.yaml
  text: And while he was being accused by the chief priests and elders[a], he answered nothing.
translation:
  language: sw
  text: Na alipokuwa akishtakiwa na makuhani wakuu na wazee, hakujibu chochote.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hakutoa jibu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ κατηγορεῖσθαι
  choice: alipokuwa akishtakiwa
  rationale: Muundo wa ἐν pamoja na kitenzi-jina chenye kibainishi huonyesha jambo lililokuwa likitendeka wakati huohuo; Kiswahili hiki kinahifadhi hali ya kuendelea na ya kutendwa.
- source_word: κατηγορεῖσθαι
  choice: akishtakiwa
  rationale: Hali ya kutendwa inaonyesha kuwa mashtaka yalikuwa yakiletwa dhidi yake; ‘kushtakiwa’ ni neno la kawaida na linalofaa katika muktadha wa kisheria.
- source_word: ὑπὸ τῶν ἀρχιερέων καὶ πρεσβυτέρων
  choice: na makuhani wakuu na wazee
  rationale: ‘Makuhani wakuu’ hurejelea viongozi wa ukuhani, na ‘wazee’ linahifadhi jina la kundi la viongozi bila kuongeza ufafanuzi usiotajwa.
- source_word: οὐδὲν
  choice: chochote
  rationale: Pamoja na ukanushi katika ‘hakujibu,’ neno hili linatoa maana ya moja kwa moja ya ‘hakujibu chochote.’
- source_word: ἀπεκρίνατο
  choice: hakujibu
  rationale: Kitenzi hiki kinamaanisha kujibu; muundo huu ni wa asili katika Kiswahili na unahifadhi taarifa ya moja kwa moja kuhusu ukimya wake.
- source_word: καὶ
  choice: Na
  rationale: Kiunganishi hiki kinaendeleza simulizi bila kuingiza mkazo wa upinzani ambao hauko wazi katika Kigiriki.
theological_decisions:
- issue: Ukimya wa Yesu mbele ya washtaki wake
  choice: Kutoa taarifa hiyo kama maelezo ya moja kwa moja ya simulizi bila kuongeza lugha ya utimilifu wa unabii.
  alternative: Kutafsiri kwa namna inayosisitiza mwangwi wa Isaya 53, kwa mfano, ‘hakutoa jibu.’
  rationale: Mstari unasimulia ukimya wa Yesu chini ya mashtaka. Ingawa jambo hili linaweza kuhusishwa na mada za kinabii mahali pengine, mstari wenyewe hautaji wazi utimilifu, hivyo tafsiri haipaswi kuongeza tafsiri ya kitheolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Alipokuwa akishtakiwa’ ni cha asili na kinadumisha tendo linaloendelea; ‘makuhani wakuu na wazee’ ni istilahi zinazoeleweka katika muktadha wa kibiblia.
