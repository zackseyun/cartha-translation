  text: εἶχον δὲ τότε δέσμιον ἐπίσημον λεγόμενον ⸀Ἰησοῦν Βαραββᾶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/016.yaml
  text: At that time they had a notorious prisoner called Jesus Barabbas[a].
translation:
  language: sw
  text: Wakati huo walikuwa na mfungwa mmoja mwenye sifa mbaya, aliyeitwa Yesu Baraba[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati zinasoma “Baraba” pekee, bila “Yesu.”
    reason: textual_variant
lexical_decisions:
- source_word: εἶχον
  choice: walikuwa na
  rationale: Kauli ya wakati uliopita yenye kiima cha wingi kisichotajwa inaonyesha kwamba wenye mamlaka walikuwa wakimshikilia mfungwa huyo; “walikuwa na” huhifadhi wazo hilo bila kukitaja kiima ambacho Kigiriki hakikitaji.
- source_word: δὲ
  choice: haijatafsiriwa kwa neno tofauti
  rationale: Ni kiunganishi hafifu cha simulizi. Katika Kiswahili mtiririko ni wa kawaida bila kuongeza “basi” au “na,” na maana ya muda tayari inaonyeshwa na τότε.
- source_word: τότε
  choice: wakati huo
  rationale: Huhifadhi rejeo la wazi la wakati kwa Kiswahili cha kawaida na fasaha.
- source_word: δέσμιον
  choice: mfungwa mmoja
  rationale: “Mfungwa” ni neno la kawaida kwa mtu aliye chini ya ulinzi katika mazingira ya hukumu; “mmoja” hufanya muundo wa Kiswahili kuwa wa kawaida bila kubadili maana.
- source_word: ἐπίσημον
  choice: mwenye sifa mbaya
  rationale: Katika muktadha wa mfungwa, neno hili linaelekea kumaanisha mtu aliyejulikana sana kwa ubaya. Usemi huu ni wa asili zaidi kuliko “mashuhuri” na huepuka maana chanya.
- source_word: λεγόμενον
  choice: aliyeitwa
  rationale: Hutambulisha jina au namna mtu alivyoitwa kwa njia ya moja kwa moja.
- source_word: Ἰησοῦν Βαραββᾶν
  choice: Yesu Baraba
  rationale: Matini ya SBLGNT ina jina Yesu kabla ya Baraba, hivyo limetafsiriwa katika matini kuu. Tofauti ya hati zinazoliacha jina Yesu imewekwa katika tanbihi.
theological_decisions:
- issue: Muundo wa jina kamili la Baraba katika tofauti za matini
  choice: 'Kujumuisha “Yesu” katika matini kuu: “Yesu Baraba.”'
  alternative: Kusoma “Baraba” pekee bila “Yesu.”
  rationale: Matini chanzo iliyotolewa, SBLGNT, inasoma Ἰησοῦν Βαραββᾶν. Tofauti muhimu ya kihati haijaamuliwa kimya kimya bali imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Mwenye sifa mbaya” linaeleweka kwa urahisi na linaonyesha uwezekano mkubwa wa maana hasi ya ἐπίσημον katika muktadha huu. Alama ya tanbihi [a] imewekwa mara tu baada ya jina.
