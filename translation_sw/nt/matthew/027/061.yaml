  text: Mary Magdalene and the other Mary were there, sitting opposite the tomb.
translation:
  language: sw
  text: Maria Magdalene na Maria yule mwingine walikuwa pale, wakiwa wameketi mkabala na kaburi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦν ... ἐκεῖ
  choice: walikuwa pale
  rationale: Ingawa kitenzi ἦν kiko katika umoja kwa muundo wa Kigiriki, kinatanguliza wahusika wawili waliounganishwa; Kiswahili cha kawaida hutumia wingi, “walikuwa pale,” ili kutoa maana kwa ufasaha.
- source_word: δὲ
  choice: (hakijatafsiriwa kwa neno maalumu)
  rationale: Hapa δέ ni kiunganishi hafifu cha mwendelezo wa simulizi. Mfuatano wa Kiswahili unaeleweka bila kuongeza “basi,” “na,” au “lakini,” ambazo zingeweza kuipa nguvu isiyokusudiwa.
- source_word: Μαριὰμ ἡ Μαγδαληνὴ
  choice: Mariamu Magdalene
  rationale: “Mariamu” ni umbo la kawaida la jina hili katika Kiswahili cha Biblia, na “Magdalene” linamtambulisha kwa uhusiano wake na Magdala.
- source_word: ἡ ἄλλη Μαρία
  choice: yule Mariamu mwingine
  rationale: Neno ἄλλη linamtofautisha Mariamu huyu na Mariamu Magdalene aliyetajwa kwanza; “yule ... mwingine” ni wazi na ya kawaida katika Kiswahili.
- source_word: καθήμεναι
  choice: wakiwa wameketi
  rationale: Kirai hiki kinaonyesha hali au mkao wao wakati huo. “Wakiwa wameketi” huhifadhi uhusiano wake na kitenzi kikuu na maana inayoendelea.
- source_word: ἀπέναντι
  choice: kuelekeana na
  rationale: Neno hili linaonyesha kuwa walikuwa upande wa mbele wa kaburi, wakilikabili. “Kuelekeana na” ni lugha ya sasa na yenye heshima, bila kudai umbali maalumu.
- source_word: τοῦ τάφου
  choice: kaburi
  rationale: Katika muktadha huu τάφος ni mahali alipozikwa Yesu; “kaburi” ndilo neno la kawaida na sahihi katika Kiswahili.
