  text: καὶ ῥίψας τὰ ἀργύρια ⸂εἰς τὸν ναὸν⸃ ἀνεχώρησεν, καὶ ἀπελθὼν ἀπήγξατο.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/005.yaml
  text: And throwing the silver into the temple[a], he departed[b], and went and hanged himself.
translation:
  language: sw
  text: Akazitupa zile fedha ndani ya hekalu[a], akaondoka[b], kisha akaenda akajinyonga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ndani ya patakatifu pa hekalu”; neno la Kigiriki hapa mara nyingi humaanisha hasa jengo takatifu la hekalu, si eneo lote la hekalu.
    reason: lexical_alternative
  - marker: b
    text: Au, “akaondoka, akaenda zake na kujinyonga.”
    reason: previous_rendering
lexical_decisions:
- source_word: ῥίψας
  choice: akazitupa
  rationale: Kitenzi cha mfululizo chenye kiambishi aka- kinaonyesha tendo lililotangulia tendo la kuondoka kwa njia ya kawaida katika simulizi la Kiswahili, bila kulazimika kuongeza neno ‘baada ya’.
- source_word: τὰ ἀργύρια
  choice: zile fedha
  rationale: Huhifadhi maana ya msingi ya ‘fedha’ na urejeleaji wa malipo yaliyokwisha tajwa, bila kuongeza waziwazi kwamba zilikuwa sarafu.
- source_word: εἰς τὸν ναὸν
  choice: ndani ya hekalu
  rationale: Ni tafsiri ya kawaida na inayoeleweka; maana mahususi zaidi ya naos kama patakatifu pa hekalu imehifadhiwa katika tanbihi.
- source_word: ἀνεχώρησεν
  choice: akaondoka
  rationale: Hutoa maana ya kuondoka au kujiondoa kwa lugha ya kawaida, yenye hadhi, na inayofaa simulizi.
- source_word: ἀπελθὼν
  choice: kisha akaenda
  rationale: Inahifadhi tendo la pili la kwenda lililo tofauti na kuondoka, huku ikiepuka urudiaji usio wa kawaida wa ‘akaondoka, akaenda zake’ katika matini kuu.
- source_word: ἀπήγξατο
  choice: akajinyonga
  rationale: Kauli ya kujitendea inaonyesha kwamba alijifanyia tendo hilo; katika muktadha huu maana ya kawaida ni kujiua kwa kujinyonga.
theological_decisions:
- issue: Maana mahususi ya ναός ikilinganishwa na eneo lote la hekalu
  choice: ‘hekalu’ katika matini kuu, huku maana ya ‘patakatifu pa hekalu’ ikielezwa katika tanbihi
  alternative: ‘patakatifu pa hekalu’
  rationale: Hii inadumisha usomaji wa kawaida na wa asili katika Kiswahili bila kupoteza utofauti wa kimsamiati kati ya ναός na neno linaloweza kumaanisha eneo lote la hekalu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mfuatano wa aka- unafaa simulizi na unaweka wazi hatua zinazofuatana; ‘kisha’ husaidia kutofautisha vitenzi viwili vya kuondoka/kwenda bila kufanya sentensi iwe nzito.
