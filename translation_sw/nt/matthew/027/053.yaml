source:
  edition: SBLGNT
  text: καὶ ἐξελθόντες ἐκ τῶν μνημείων μετὰ τὴν ἔγερσιν αὐτοῦ εἰσῆλθον εἰς τὴν ἁγίαν πόλιν καὶ ἐνεφανίσθησαν πολλοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/053.yaml
  text: And coming out of the tombs after his resurrection[c][b][a], they entered the holy city and appeared to many.
translation:
  language: sw
  text: Nao walipotoka makaburini baada ya kufufuka kwake,[a] waliingia katika mji mtakatifu[b] na kuwatokea watu wengi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au kwa kuweka wazi zaidi anayerejelewa: “baada ya Yesu kufufuka.” Kigiriki kinasema kihalisi “baada ya kufufuka kwake” na kinaweka maneno hayo baada ya “makaburini” kabla ya “waliingia.”'
    reason: alternative_reading
  - marker: b
    text: “Mji mtakatifu” ni Yerusalemu.
    reason: cross_reference
lexical_decisions:
- source_word: ἐξελθόντες
  choice: walipotoka
  rationale: Kitenzi kishirikishi cha aoristi kimetafsiriwa kwa kishazi cha wakati cha Kiswahili. Hii ni lugha ya kawaida na inaonyesha uhusiano wake na kitenzi kikuu bila uzito usio wa lazima.
- source_word: μνημείων
  choice: makaburini
  rationale: Neno hili humaanisha mahali pa maziko au makaburi; muktadha wa mstari uliotangulia unaunga mkono ‘makaburini’.
- source_word: μετὰ τὴν ἔγερσιν αὐτοῦ
  choice: baada ya kufufuka kwake
  rationale: μετά pamoja na hali ya accusative ina maana ya wakati, ‘baada ya.’ Kauli ‘kufufuka kwake’ inadumisha umbo la nomino la ἔγερσις na rejeo la αὐτοῦ kwa Yesu kulingana na muktadha.
- source_word: εἰσῆλθον
  choice: waliingia
  rationale: Ni kitenzi rahisi cha simulizi katika aoristi; ‘waliingia’ ni tafsiri fupi na ya kawaida.
- source_word: τὴν ἁγίαν πόλιν
  choice: mji mtakatifu
  rationale: Hii inadumisha nahau ya kibiblia inayorejelea Yerusalemu bila kuongeza ufafanuzi katika matini kuu.
- source_word: ἐνεφανίσθησαν
  choice: kuwatokea
  rationale: Katika muktadha huu kitenzi kinaonyesha kuonekana kwa wengine. ‘Kuwatokea’ ni Kiswahili cha kawaida na huhifadhi maana ya kujidhihirisha mbele yao.
- source_word: πολλοῖς
  choice: watu wengi
  rationale: Ingawa Kigiriki kinasema kihalisi ‘wengi,’ kuongeza ‘watu’ kunafanya rejeo liwe wazi na la kawaida katika Kiswahili bila kubadili maana.
theological_decisions:
- issue: Uhusiano wa ‘kutoka makaburini’ na kirai cha wakati ‘baada ya kufufuka kwake’
  choice: 'Matini inaunganisha ‘baada ya kufufuka kwake’ na kutoka kwao makaburini: ‘walipotoka makaburini baada ya kufufuka kwake.’'
  alternative: Inawezekana kutafsiri kwa mtiririko laini zaidi, ‘Baada ya kufufuka kwake, walitoka makaburini, wakaingia...’; wengine huhusianisha kufunguliwa kwa makaburi na kifo cha Yesu katika mstari uliotangulia lakini kutoka kwa watakatifu na wakati baada ya ufufuo wake.
  rationale: Mpangilio wa Kigiriki unaweka μετὰ τὴν ἔγερσιν αὐτοῦ ndani ya kishazi shirikishi kabla ya kitenzi kikuu. Tafsiri inadumisha mlolongo huo bila kuamua kimyakimya maswali ya mpangilio yanayotokana na mstari uliotangulia.
- issue: Rejeo la kiwakilishi αὐτοῦ (‘kwake’)
  choice: Kimeachwa kama ‘kwake’ katika matini kuu, kikirejelea Yesu kwa muktadha.
  alternative: ‘Baada ya Yesu kufufuka’ lingeweka rejeo wazi zaidi.
  rationale: Kigiriki kina kiwakilishi, si jina Yesu. Kiswahili kinaweza kuhifadhi umbo hilo bila kufanya sentensi isieleweke.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ‘walipotoka ... waliingia’ ni wa kawaida katika simulizi na unadumisha utegemezi wa kishazi shirikishi. Alama zote za tanbihi zilizotolewa zinaonekana katika matini kuu.
