  text: λέγοντες· Κύριε, ἐμνήσθημεν ὅτι ἐκεῖνος ὁ πλάνος εἶπεν ἔτι ζῶν· Μετὰ τρεῖς ἡμέρας ἐγείρομαι·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/063.yaml
  text: saying[a], “Lord, we remember that that deceiver said while he was still alive[b], ‘After three days I rise.’”
translation:
  language: sw
  text: wakisema, “Bwana, tumekumbuka kwamba yule mdanganyifu alisema alipokuwa bado hai, ‘Baada ya siku tatu nitafufuka[a].’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Baada ya siku tatu nitafufuliwa.” Kigiriki kimetumia umbo la wakati uliopo, kwa maana halisi, “nafufuka” au “ninafufuliwa.”
    reason: alternative_reading
lexical_decisions:
- source_word: λέγοντες
  choice: wakisema
  rationale: Kitenzi-shirikishi cha wakati uliopo kinaunganisha moja kwa moja usemi huu na tendo la mstari uliotangulia; ‘wakisema’ ni ya kawaida na huhifadhi muundo huo.
- source_word: Κύριε
  choice: Bwana
  rationale: Ni mwito wa heshima kwa Pilato. ‘Bwana’ hudumisha maana ya κύριος bila kudai kwamba hapa neno hilo linamtaja Mungu.
- source_word: ἐμνήσθημεν
  choice: tumekumbuka
  rationale: Kauli ya aoristi inaonyesha kukumbuka jambo ambalo sasa wanalileta mbele ya Pilato; ‘tumekumbuka’ ni ya asili katika Kiswahili na hudumisha hali ya tendo lililotimia lenye umuhimu wa sasa.
- source_word: ἐκεῖνος ὁ πλάνος
  choice: yule mdanganyifu
  rationale: ‘Yule’ huhifadhi umbali na dharau ya ἐκεῖνος, na ‘mdanganyifu’ huonyesha mtu anayepotosha au kudanganya.
- source_word: ἔτι ζῶν
  choice: alipokuwa bado hai
  rationale: Hueleza wazi wakati wa kauli hiyo kuhusiana na kifo chake, kwa Kiswahili cha kawaida.
- source_word: Μετὰ τρεῖς ἡμέρας
  choice: Baada ya siku tatu
  rationale: μετά pamoja na hali ya accusative humaanisha kwa kawaida ‘baada ya’; tafsiri hii haioanishi kimakusudi na usemi ‘siku ya tatu.’
- source_word: ἐγείρομαι
  choice: nitafufuka
  rationale: Ingawa Kigiriki kina umbo la wakati uliopo lenye uwezekano wa maana ya kati au tendwa, muktadha wa utabiri wa wakati ujao huhitaji Kiswahili cha wakati ujao. ‘Nitafufuka’ ni usemi wa kawaida unaoweza kueleza kuinuka kutoka kwa wafu bila kulazimisha wazi mtendaji wa nje.
theological_decisions:
- issue: Namna ya kutafsiri utabiri wa Yesu kuhusu kufufuka
  choice: Baada ya siku tatu nitafufuka
  alternative: Baada ya siku tatu nitafufuliwa
  rationale: Umbo ἐγείρομαι linaweza kueleweka kwa maana ya kati/isiyoelekeza mtendaji (‘nitafufuka’) au ya kutendwa (‘nitafufuliwa’). Maandishi makuu yanatumia Kiswahili cha kawaida huku tanbihi ikihifadhi uwezekano wa kutendwa na hali ya umbo la wakati uliopo katika Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wazi kwa wasomaji wa kawaida, huku tanbihi ikihifadhi utata halisi wa ἐγείρομαι.
