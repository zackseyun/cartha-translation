  text: τινὲς δὲ τῶν ἐκεῖ ⸀ἑστηκότων ἀκούσαντες ἔλεγον ὅτι Ἠλίαν φωνεῖ οὗτος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/047.yaml
  text: But some of those standing there[a], when they heard it, were saying[b], “This man is calling Elijah.”
translation:
  language: sw
  text: Lakini baadhi ya wale waliokuwa wamesimama pale, waliposikia hayo, walikuwa wakisema, “Huyu anamwita Eliya.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τινὲς
  choice: baadhi
  rationale: Huonyesha sehemu isiyotajwa kwa idadi ya watu waliokuwapo; ‘baadhi’ ni kifupi na cha kawaida.
- source_word: δὲ
  choice: Lakini
  rationale: Huonyesha badiliko lenye utofautishaji wa kiasi katika simulizi baada ya kilio cha Yesu.
- source_word: τῶν ἐκεῖ ἑστηκότων
  choice: ya wale waliokuwa wamesimama pale
  rationale: Huhifadhi picha ya watu waliokuwa wamesimama mahali hapo badala ya kuifupisha kuwa ‘watazamaji’.
- source_word: ἀκούσαντες
  choice: waliposikia hayo
  rationale: Huwasilisha tendo lililotangulia kauli yao; ‘hayo’ humrejelea Yesu aliyosema katika mstari uliotangulia bila kuyafafanua zaidi.
- source_word: ἔλεγον
  choice: walikuwa wakisema
  rationale: Huhifadhi hali endelevu au inayoweza kuwa ya kurudiwa ya wakati usiotimilifu wa Kigiriki.
- source_word: ὅτι
  choice: alama za usemi wa moja kwa moja
  rationale: Ingawa ὅτι huanzisha taarifa, usemi wa moja kwa moja ni wa asili katika Kiswahili na unaendana na muundo wa simulizi.
- source_word: Ἠλίαν
  choice: Eliya
  rationale: Hili ndilo umbo la kawaida la jina la nabii huyo katika Kiswahili.
- source_word: φωνεῖ
  choice: anamwita
  rationale: Kitenzi chenye yambwa mtu kinaweza kumaanisha kumwita au kumwomba aje; ‘anamwita’ kinafuata Kigiriki kwa karibu bila kuamua zaidi kusudi la mwito.
- source_word: οὗτος
  choice: Huyu
  rationale: Huhifadhi nguvu ya kiashiria cha Kigiriki kwa njia ya kawaida na fupi katika Kiswahili.
theological_decisions:
- issue: Ikiwa kauli ya waliokuwa pale idokeze kwamba Yesu alimwita Eliya kweli au kwamba wao walidhani hivyo
  choice: 'Kauli imewasilishwa kama maneno ya waliokuwa pale: “Huyu anamwita Eliya.”'
  alternative: Huyu anamwomba Eliya aje.
  rationale: Kigiriki kinaripoti walivyofasiri kilio cha Yesu bila kuthibitisha kuwa tafsiri yao ilikuwa sahihi. Tafsiri hii huhifadhi mvutano na kejeli ya kisimulizi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ‘walikuwa wakisema’ umetumiwa kwa makusudi kuhifadhi hali ya ἔλεγον; ‘Huyu’ ni wa asili zaidi kuliko ‘Mtu huyu’ na huhifadhi kiashiria οὗτος.
