id: MAT.27.22
reference: Matthew 27:22
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: λέγει αὐτοῖς ὁ Πιλᾶτος· Τί οὖν ποιήσω Ἰησοῦν τὸν λεγόμενον χριστόν; ⸀λέγουσιν πάντες· Σταυρωθήτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/022.yaml
  text: Pilate said to them[a], “What then should I do with Jesus who is called Messiah?” They all said, “Let him be crucified.”
translation:
  language: sw
  text: Pilato akawaambia, “Basi, nimfanye nini Yesu anayeitwa Masihi[a]?” Wote wakasema, “Asulubiwe.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kristo.”
    reason: Tafsiri nyingine ya Χριστός inayohifadhi umbo la jadi badala ya kuonyesha moja kwa moja maana ya cheo hicho.
lexical_decisions:
- source_word: Τί οὖν ποιήσω
  choice: Basi, nimfanye nini
  rationale: Kauli hii ni swali la kutafakari hatua ya kuchukua; “nimfanye nini” ni Kiswahili cha kawaida kinachowasilisha nguvu ya swali hilo, huku “basi” ikionyesha hitimisho au mwendelezo wa οὖν.
- source_word: Ἰησοῦν
  choice: Yesu
  rationale: Jina la mtu limetolewa kwa umbo lake lililozoeleka katika Kiswahili.
- source_word: τὸν λεγόμενον χριστόν
  choice: anayeitwa Masihi[a]
  rationale: “Anayeitwa” huhifadhi maana ya kirai elezi cha hali ya kutendwa, na “Masihi” hutafsiri Χριστός kama cheo chenye maana ya yule aliyetiwa mafuta, si kama jina la pili.
- source_word: λέγουσιν πάντες
  choice: Wote wakasema
  rationale: Wakati uliopo wa kisimulizi umetolewa kwa wakati uliopita wa kisimulizi unaosikika kwa kawaida katika Kiswahili; “wote” huhifadhi nguvu ya πάντες.
- source_word: Σταυρωθήτω
  choice: Asulubiwe
  rationale: Huhifadhi amri ya nafsi ya tatu pamoja na hali ya kutendwa ya kitenzi cha Kigiriki.
theological_decisions:
- issue: Tafsiri ya Χριστός
  choice: Masihi
  alternative: Kristo
  rationale: Katika kirai hiki neno hilo linafanya kazi kama cheo cha Yesu. “Masihi” huonyesha wazi maana ya cheo hicho, huku “Kristo” likitolewa katika tanbihi kama umbo jingine la jadi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Asulubiwe” ni kifupi, cha asili, na huhifadhi msisitizo mkali wa jibu la umati.
