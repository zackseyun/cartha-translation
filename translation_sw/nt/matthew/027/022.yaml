  source_fidelity: “Pilato akawaambia” faithfully renders the narrative speech introduction; “Basi, nimfanye nini Yesu anayeitwa Masihi?” preserves the deliberative force of Τί οὖν ποιήσω, the inferential οὖν, the object Yesu, and the attributive passive sense of τὸν λεγόμενον. “Wote wakasema” retains the collective πάντες, and “Asulubiwe” accurately retains the third-person passive imperative force of Σταυρωθήτω.
  naturalness: The Swahili is clear, idiomatic Standard East African Swahili, and appropriately concise for the crowd’s emphatic response. The narrative past is natural in Swahili despite the Greek historical presents.
  terminology: “Masihi” appropriately renders Χριστός as a title in this setting. The footnote’s “Kristo” supplies the established traditional alternative without obscuring the title’s meaning in the main text. “Asulubiwe” is the suitable established term for crucifixion and preserves the passive form.
