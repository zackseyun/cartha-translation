  text: διὸ ἐκλήθη ὁ ἀγρὸς ἐκεῖνος Ἀγρὸς Αἵματος ἕως τῆς σήμερον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/008.yaml
  text: Therefore that field has been called Field of Blood to this day.
translation:
  language: sw
  text: Kwa hiyo, shamba hilo limeitwa Shamba la Damu mpaka leo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὸ
  choice: Kwa hiyo
  rationale: Huonyesha hitimisho au matokeo yanayotokana na maelezo yaliyotangulia kuhusu kununuliwa na kupewa jina kwa shamba; ni kiunganishi cha kawaida na wazi katika Kiswahili.
- source_word: ἐκλήθη
  choice: limeitwa
  rationale: Ni aoristi tendwa ya καλέω, ‘liliitwa/lilipewa jina.’ Muundo ‘limeitwa’ unaendana kwa kawaida na ‘mpaka leo’ na kuonyesha jina lililoanza kutumiwa zamani na kuendelea kutambulika.
- source_word: ὁ ἀγρὸς ἐκεῖνος
  choice: shamba hilo
  rationale: ἀγρός hapa ni ‘shamba,’ na ἐκεῖνος limetafsiriwa kwa muundo wa kawaida wa Kiswahili ‘hilo.’ Kurudia ‘shamba’ kunadumisha uhusiano na jina linalofuata.
- source_word: Ἀγρὸς Αἵματος
  choice: Shamba la Damu
  rationale: Ni jina la mahali lenye ἀγρός na αἵματος katika hali ya umilikishi. ‘Shamba la Damu’ ni tafsiri wazi na ya asili inayohifadhi muundo na uzito wa jina hilo.
- source_word: αἵματος
  choice: Damu
  rationale: Ni umoja wa hali ya umilikishi wa αἷμα na ni sehemu ya jina la mahali ‘Shamba la Damu.’
- source_word: ἕως τῆς σήμερον
  choice: mpaka leo
  rationale: Ni usemi wa wakati unaomaanisha kwamba jina hilo liliendelea kutumiwa hadi wakati wa mwandishi; ‘mpaka leo’ ni Kiswahili cha kawaida, kifupi na sahihi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni fupi na ya kawaida; marudio ya neno ‘shamba’ yamehifadhiwa ili kuonyesha uhusiano kati ya eneo hilo na jina lake.
