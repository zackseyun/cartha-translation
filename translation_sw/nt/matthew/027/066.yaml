  text: So they went and secured the tomb by sealing the stone with the guard.
translation:
  language: sw
  text: Basi wakaenda wakalilinda kaburi kwa kulitia jiwe muhuri pamoja na walinzi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakiwa pamoja na walinzi”; huenda pia, “kwa kulitia jiwe muhuri na kuweka walinzi.” Maneno ya Kigiriki ni mafupi na yanaweza kuonyesha kuwapo au kushiriki kwa walinzi badala ya tendo jingine lililotajwa wazi.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ πορευθέντες
  choice: Basi wakaenda
  rationale: Kishirikishi cha Kigiriki kinaambatana na kitenzi kikuu, hivyo kimetafsiriwa kwa kitenzi kamili. “Basi” linaendeleza simulizi kwa kawaida bila kusisitiza tofauti isiyokuwapo.
- source_word: ἠσφαλίσαντο
  choice: wakalilinda
  rationale: Kitenzi hiki humaanisha kufanya kitu kiwe salama au kukihakikishia ulinzi. Katika muktadha huu, “kulilinda” ni lugha ya kawaida inayoonyesha hatua za kuzuia kaburi kuingiliwa.
- source_word: τὸν τάφον
  choice: kaburi
  rationale: Neno hili linamaanisha mahali Yesu alipokuwa amezikwa; “kaburi” ni neno la kawaida na lililo wazi katika Kiswahili cha sasa.
- source_word: σφραγίσαντες
  choice: kwa kulitia ... muhuri
  rationale: Kishirikishi hiki kinaeleza namna au tendo lililoambatana na kulilinda kaburi. Muundo “kwa kulitia ... muhuri” unaonyesha kwa kawaida njia iliyotumiwa.
- source_word: τὸν λίθον
  choice: jiwe
  rationale: Maandishi yanasema tu “jiwe”; hayataji wazi katika mstari huu kuwa ni jiwe la mlangoni, hivyo hakuna maelezo yaliyoongezwa.
- source_word: μετὰ τῆς κουστωδίας
  choice: pamoja na walinzi
  rationale: κουστωδία ni kikosi cha ulinzi, na μετά pamoja na hali ya umilikishi kwa kawaida huonyesha uandamani. Tafsiri hii haibainishi zaidi ya maandishi kama walinzi waliwekwa hapo wakati huo au walikuwapo na kushiriki katika kulitia jiwe muhuri.
theological_decisions:
- issue: Uhusiano wa μετὰ τῆς κουστωδίας na tendo la kulinda kaburi
  choice: Maneno “pamoja na walinzi” yameachwa yakionyesha ushiriki au kuwapo kwa walinzi bila kueleza utaratibu kamili.
  alternative: Wakalilinda kaburi kwa kulitia jiwe muhuri na kuweka walinzi.
  rationale: Kigiriki ni kifupi na kinaweza kuonyesha uandamani badala ya tendo jingine lililotajwa wazi. Tafsiri haiongezi dai kwamba walinzi waliwekwa wakati huo, wala haisemi walikuwa watazamaji tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa sasa na wenye staha. “Walinzi” limetumiwa badala ya neno la kale au la kiufundi; wingi unaonyesha kikosi cha ulinzi. Koma kabla ya “pamoja na walinzi” husaidia kuacha uhusiano wa kifungu hicho ukiwa na uwazi uleule wa kiasi uliomo katika Kigiriki.
