base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/037.yaml
  text: 'And they placed above his head the charge against him[a], written: “This is Jesus[b], the King of the Jews.”'
translation:
  language: sw
  text: 'Nao wakaweka juu ya kichwa chake shtaka dhidi yake[a], lililoandikwa: “Huyu ni Yesu, Mfalme wa Wayahudi[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “tuhuma dhidi yake.” Neno la Kigiriki hapa lina maana ya kisheria.
    reason: lexical_alternative
  - marker: b
    text: Au “Watu wa Yudea.” Neno la Kigiriki linaweza kumaanisha “Wayahudi” au “Watu wa Yudea,” kutegemea muktadha.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπέθηκαν
  choice: wakaweka
  rationale: Kitenzi hiki kinaeleza tendo halisi la kuweka maandishi mahali fulani; “wakaweka” ni la kawaida na wazi katika Kiswahili.
- source_word: ἐπάνω τῆς κεφαλῆς αὐτοῦ
  choice: juu ya kichwa chake
  rationale: Kirai hiki kinaonyesha mahali palipo juu ya kichwa, si kwamba kitu kiliwekwa moja kwa moja kichwani.
- source_word: τὴν αἰτίαν αὐτοῦ
  choice: shtaka dhidi yake
  rationale: Katika muktadha huu wa kisheria, αἰτία humaanisha shtaka au mashtaka yaliyotolewa kuwa msingi wa hukumu.
- source_word: γεγραμμένην
  choice: lililoandikwa
  rationale: Huhifadhi maana ya hali ya shtaka hilo kuwa limeandikwa, kwa Kiswahili cha kawaida na cha asili.
- source_word: Οὗτός ἐστιν
  choice: Huyu ni
  rationale: Hii ndiyo tafsiri ya moja kwa moja na ya kawaida ya kiwakilishi cha kuonyesha pamoja na kitenzi kishirikishi.
- source_word: Ἰησοῦς
  choice: Yesu
  rationale: Jina limetolewa kwa umbo lake la kawaida katika Kiswahili.
- source_word: ὁ βασιλεὺς τῶν Ἰουδαίων
  choice: Mfalme wa Wayahudi
  rationale: Huhifadhi cheo cha kifalme kilicho katika maandishi ya shtaka na ni usemi ulio wazi katika Kiswahili.
- source_word: Ἰουδαίων
  choice: Wayahudi
  rationale: Katika kauli hii ya kisiasa na kifalme, neno hili kwa kawaida linarejelea taifa la Wayahudi; maana mbadala ya “Watu wa Yudea” imehifadhiwa katika tanbihi.
theological_decisions:
- issue: Maneno ya kisheria katika maandishi ya kusulubiwa
  choice: shtaka dhidi yake
  alternative: mashtaka dhidi yake
  rationale: Umoja wa Kigiriki umehifadhiwa, na “shtaka” linaonyesha maana ya kisheria bila kuongeza tafsiri ya kiteolojia.
- issue: Maana ya Ἰουδαίων katika cheo
  choice: Wayahudi
  alternative: Watu wa Yudea
  rationale: “Wayahudi” ndilo rejeleo linalofaa zaidi katika cheo hiki cha kifalme na kisiasa, huku uwezekano wa maana ya kijiografia ukitajwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umefuata Kigiriki kwa ukaribu bila kuwa mgumu; alama zote za tanbihi zimewekwa katika matini kuu.
