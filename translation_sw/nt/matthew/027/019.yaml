source:
  edition: SBLGNT
  text: Καθημένου δὲ αὐτοῦ ἐπὶ τοῦ βήματος ἀπέστειλεν πρὸς αὐτὸν ἡ γυνὴ αὐτοῦ λέγουσα· Μηδὲν σοὶ καὶ τῷ δικαίῳ ἐκείνῳ, πολλὰ γὰρ ἔπαθον σήμερον κατ’ ὄναρ δι’ αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/019.yaml
  text: While he was sitting on the judgment seat[a], his wife sent word to him, saying, “Have nothing to do with that righteous man[b], for I have suffered greatly today in a dream because of him.”
translation:
  language: sw
  text: Alipokuwa ameketi kwenye kiti cha hukumu, mke wake alimtumia ujumbe akisema, “Usiwe na jambo lolote la kufanya na mtu huyo mwenye haki[a], kwa maana leo niliteseka sana katika ndoto kwa sababu yake.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtu huyo asiye na hatia.” Neno la Kiyunani linaweza kumaanisha “mwenye haki,” “mwadilifu,” au, katika muktadha wa kisheria, “asiye na hatia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Καθημένου δὲ αὐτοῦ
  choice: Alipokuwa ameketi
  rationale: Muundo wa genitivi kamili wenye kitenzi-ushiriki cha wakati wa sasa unaonyesha jambo lililokuwa likiendelea wakati tendo jingine lilipotokea; Kiswahili hiki ni cha asili na huhifadhi uhusiano huo wa wakati.
- source_word: ἐπὶ τοῦ βήματος
  choice: kwenye kiti cha hukumu
  rationale: Katika mazingira haya ya kisheria, βῆμα ni kiti rasmi ambako mtawala aliketi kutoa hukumu, si jukwaa la kawaida tu.
- source_word: ἀπέστειλεν πρὸς αὐτὸν
  choice: alimtumia ujumbe
  rationale: Kauli hii inadokeza kwamba mawasiliano yalipelekwa kwake, labda kwa mjumbe, bila kulazimisha namna mahususi ya kuyapeleka.
- source_word: ἡ γυνὴ αὐτοῦ
  choice: mke wake
  rationale: Katika uhusiano huu na Pilato, γυνή humaanisha wazi ‘mke,’ si ‘mwanamke’ kwa ujumla.
- source_word: λέγουσα
  choice: akisema
  rationale: Kitenzi-ushiriki kinaanzisha yaliyomo katika ujumbe na kinaunganishwa kwa kawaida katika Kiswahili kwa ‘akisema.’
- source_word: Μηδὲν σοὶ καὶ τῷ δικαίῳ ἐκείνῳ
  choice: Usijihusishe kamwe na mtu huyo mwenye haki
  rationale: Nahau hii ya Kiyunani ni onyo la kutokuwa na jambo lolote la kufanya naye. ‘Usijihusishe kamwe’ hutoa onyo hilo kwa Kiswahili cha kawaida, huku ‘mwenye haki’ ikihifadhi maana pana ya δίκαιος.
- source_word: τῷ δικαίῳ ἐκείνῳ
  choice: mtu huyo mwenye haki
  rationale: δίκαιος inaweza kumaanisha mwenye haki, mwadilifu, au asiye na hatia katika muktadha wa kisheria. ‘Mwenye haki’ huhifadhi uzito wa kimaadili na pia hufaa katika simulizi la kesi.
- source_word: πολλὰ ... ἔπαθον
  choice: nimeteseka sana
  rationale: Nahau πολλὰ πάσχω hueleza mateso makubwa; kauli timilifu ya Kiswahili inaonyesha yaliyotokea leo na athari yake inayoendelea katika onyo hili la haraka.
- source_word: σήμερον
  choice: leo
  rationale: Hili ndilo neno la kawaida na la moja kwa moja la Kiswahili kwa wakati unaotajwa.
- source_word: κατ’ ὄναρ
  choice: katika ndoto
  rationale: Ni usemi wa kawaida unaorejelea jambo lililopatikana au kuonwa katika ndoto.
- source_word: δι’ αὐτόν
  choice: kwa sababu yake
  rationale: διά pamoja na akusativi huonyesha sababu; ‘kwa sababu yake’ ni tafsiri ya moja kwa moja na ya kawaida.
theological_decisions:
- issue: Tafsiri ya δίκαιος ikimhusu Yesu
  choice: mtu huyo mwenye haki
  alternative: mtu huyo asiye na hatia
  rationale: ‘Mwenye haki’ huhifadhi maana ya kimaadili ya δίκαιος na mguso wake wa kimahakama bila kuifupisha kuwa tamko la kutokuwa na hatia tu. Hata hivyo, ‘asiye na hatia’ ni uwezekano halisi katika mazingira ya kesi, hivyo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umewekwa wazi kwa wasomaji wa kawaida huku ukihifadhi mazingira ya kimahakama, nguvu ya onyo, na wigo wa maana wa δίκαιος.
