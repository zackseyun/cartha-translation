  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ὁ δὲ ἑκατόνταρχος καὶ οἱ μετ’ αὐτοῦ τηροῦντες τὸν Ἰησοῦν ἰδόντες τὸν σεισμὸν καὶ τὰ ⸀γενόμενα ἐφοβήθησαν σφόδρα λέγοντες· Ἀληθῶς ⸂θεοῦ υἱὸς⸃ ἦν οὗτος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/054.yaml
  text: When the centurion and those with him who were guarding Jesus saw the earthquake and the things that had happened[a], they were greatly afraid and said[c][b], “Truly this was the Son of God.”
translation:
  language: sw
  text: Mkuu wa askari mia na wale waliokuwa pamoja naye wakimlinda Yesu walipoona tetemeko la ardhi na mambo yaliyotokea, waliogopa sana, wakasema, “Hakika huyu alikuwa Mwana wa Mungu.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Inaweza pia kutafsiriwa, “mwana wa Mungu.” Usemi wa Kigiriki θεοῦ υἱός hauna kibainishi; hapa umetafsiriwa kama cheo, kulingana na jinsi Mathayo anavyomtambulisha Yesu.
    reason: alternative_reading
lexical_decisions:
- source_word: ἑκατόνταρχος
  choice: mkuu wa askari mia
  rationale: Hutambulisha kwa uwazi cheo cha ofisa wa jeshi la Roma aliyekuwa na mamlaka juu ya kikosi cha askari mia, bila kutegemea istilahi isiyoeleweka kwa wasomaji wengi.
- source_word: τηροῦντες
  choice: wakimlinda
  rationale: Katika mazingira ya mahali pa kunyongwa, kitenzi hiki kina maana ya kumweka Yesu chini ya ulinzi au uangalizi wa askari, si kumtazama tu.
- source_word: ἰδόντες
  choice: walipoona
  rationale: Kauli tegemezi ya wakati huwasilisha kwa Kiswahili cha kawaida uhusiano wa tendo hili na kitendo kikuu.
- source_word: σεισμόν
  choice: tetemeko la ardhi
  rationale: Hii ndiyo maana ya kawaida ya σεισμός katika muktadha huu.
- source_word: τὰ γενόμενα
  choice: mambo yaliyotokea
  rationale: Kauli pana ya wingi inahusu matukio yaliyowazunguka, wala si tetemeko la ardhi pekee.
- source_word: ἐφοβήθησαν σφόδρα
  choice: waliogopa sana
  rationale: Tafsiri ya kawaida na yenye nguvu inayohifadhi kiongezi σφόδρα.
- source_word: Ἀληθῶς
  choice: Hakika
  rationale: Huonyesha uthibitisho wenye uzito bila kuamua kiwango cha ufahamu wa kitheolojia wa wasemaji.
- source_word: θεοῦ υἱὸς
  choice: Mwana wa Mungu
  rationale: Muktadha wa Injili ya Mathayo unaunga mkono kuelewa maneno haya kama cheo cha Yesu. Kwa kuwa Kigiriki hakina kibainishi hapa na Kiswahili hakina mfumo wa vibainishi sawa na wa Kiingereza, uwezekano wa maana isiyo dhahiri kabisa umeelezwa katika tanbihi.
- source_word: οὗτος
  choice: huyu
  rationale: Huhifadhi kiwakilishi cha kuonyesha na uzito wa usemi wa moja kwa moja.
theological_decisions:
- issue: Maana ya θεοῦ υἱὸς katika ungamo la mkuu wa askari mia
  choice: Mwana wa Mungu
  alternative: mwana wa mungu / mwana wa Mungu
  rationale: Katika Mathayo, ‘Mwana wa Mungu’ ni cheo muhimu kinachotumiwa kumhusu Yesu, hivyo tafsiri kuu inatumia herufi kubwa kuonyesha usomaji huo. Hata hivyo, muundo wa Kigiriki hauna kibainishi, kwa hiyo tanbihi inahifadhi uwezekano wa usomaji usio dhahiri kama cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imewekwa kwa mtiririko wa kawaida wa Kiswahili huku ikihifadhi kundi la mkuu wa askari na wale waliokuwa pamoja naye, matukio waliyoona, hofu yao kubwa, na ungamo lao la pamoja.
