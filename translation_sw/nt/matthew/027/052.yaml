  text: καὶ τὰ μνημεῖα ἀνεῴχθησαν καὶ πολλὰ σώματα τῶν κεκοιμημένων ἁγίων ⸀ἠγέρθησαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/052.yaml
  text: And the tombs were opened[a], and many bodies of the saints who had fallen asleep were raised,
translation:
  language: sw
  text: Na makaburi yakafunguliwa, na miili mingi ya watakatifu waliokuwa wamelala usingizi[a] ikafufuliwa,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Kulala usingizi” ni nahau ya kawaida inayomaanisha “kufa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Na
  rationale: Kiunganishi cha kawaida kinachohifadhi uratibu wa simulizi bila kuongeza maana maalumu ya wakati.
- source_word: τὰ μνημεῖα
  choice: makaburi
  rationale: Neno hili humaanisha mahali pa kuzikia; “makaburi” ni Kiswahili cha kawaida na cha asili katika muktadha huu.
- source_word: ἀνεῴχθησαν
  choice: yakafunguliwa
  rationale: Huhifadhi hali ya kutendwa ya kitenzi bila kueleza namna makaburi yalivyofunguliwa.
- source_word: πολλὰ σώματα
  choice: miili mingi
  rationale: Tafsiri ya moja kwa moja na isiyo kali ya σῶμα; haiongezi maana ya “maiti.”
- source_word: τῶν κεκοιμημένων
  choice: waliokuwa wamelala usingizi
  rationale: Huhifadhi nahau ya kulala inayotumiwa kwa kufa, badala ya kuibadilisha moja kwa moja kuwa “waliokufa.”
- source_word: ἁγίων
  choice: watakatifu
  rationale: Neno la kawaida la Agano Jipya kwa watu watakatifu wa Mungu, bila kubainisha zaidi utambulisho wao.
- source_word: ἠγέρθησαν
  choice: ikafufuliwa
  rationale: Katika muktadha wa wafu, “kufufuliwa” ni Kiswahili cha kawaida kwa tendo la kuinuliwa kutoka kwa wafu, bila kubainisha aina au hali ya ufufuo.
theological_decisions:
- issue: Asili ya tukio linaloelezwa na ἠγέρθησαν
  choice: ikafufuliwa
  alternative: ikahuishwa; ikainuliwa
  rationale: “Ikafufuliwa” huwasilisha maana ya kitenzi katika muktadha wa kifo, lakini haisuluhishi kwa kulazimisha ikiwa huu ulikuwa ufufuo wa kudumu au kurudishwa kwa maisha ya duniani.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa “miili ... ikafufuliwa” unafuata upatanisho wa kisarufi wa nomino “miili,” huku nahau ya chanzo ikihifadhiwa na kufafanuliwa katika tanbihi.
