  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ὀψίας δὲ γενομένης ἦλθεν ἄνθρωπος πλούσιος ἀπὸ Ἁριμαθαίας, τοὔνομα Ἰωσήφ, ὃς καὶ αὐτὸς ⸀ἐμαθητεύθη τῷ Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/057.yaml
  text: When evening had come[a], a rich man from Arimathea came, named Joseph[b], who himself also had become a disciple of Jesus.
translation:
  language: sw
  text: Ilipofika jioni, akaja mtu tajiri kutoka Arimathaya, aliyeitwa Yosefu, ambaye naye alikuwa amekuwa mwanafunzi wa Yesu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ambaye naye alikuwa amefanywa mwanafunzi na Yesu,” au “ambaye naye alikuwa mwanafunzi wa Yesu.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ὀψίας δὲ γενομένης
  choice: Ilipofika jioni
  rationale: Kirai huru cha hali ya umilikishi kinaonyesha wakati na mpito wa simulizi. ‘Ilipofika jioni’ ni Kiswahili cha kawaida na huhifadhi wazo la jioni kuwadia bila kuongeza neno lisilokuwapo katika chanzo.
- source_word: ἦλθεν
  choice: akaja
  rationale: Ni kitenzi rahisi cha simulizi kinachoeleza kuja kwa Yosefu; ‘akaja’ huunganika kwa kawaida na sentensi iliyotangulia ya wakati.
- source_word: ἄνθρωπος πλούσιος
  choice: mtu mmoja tajiri
  rationale: ‘Mtu tajiri’ ndilo maana ya moja kwa moja; ‘mmoja’ hapa hutenda kazi ya kutambulisha mhusika asiyeainishwa, si kusisitiza idadi.
- source_word: ἀπὸ Ἁριμαθαίας
  choice: kutoka Arimathaya
  rationale: ἀπό huonyesha mahali alikotoka; ‘kutoka Arimathaya’ ni wazi na ya kawaida.
- source_word: τοὔνομα Ἰωσήφ
  choice: aliyeitwa Yosefu
  rationale: Kirai hiki kinamtambulisha mtu kwa jina. ‘Aliyeitwa Yosefu’ ni cha asili katika Kiswahili na huhifadhi kazi hiyo ya utambulisho.
- source_word: ὃς καὶ αὐτὸς
  choice: ambaye yeye pia
  rationale: '‘Pia’ huhifadhi nguvu ya καί, na ‘yeye’ huhifadhi msisitizo wa αὐτός: Yosefu mwenyewe alikuwa miongoni mwa wanafunzi.'
- source_word: ἐμαθητεύθη τῷ Ἰησοῦ
  choice: alikuwa amekuwa mwanafunzi wa Yesu
  rationale: Kauli tendwa ya μαθητεύω inaweza kueleza kufanywa au kuwa mwanafunzi. Tafsiri hii inaonyesha hali iliyotokea kabla ya tukio hili bila kudai kwa namna mahususi jinsi alivyofanywa mwanafunzi.
theological_decisions:
- issue: Maana ya ἐμαθητεύθη kuhusiana na Yesu
  choice: alikuwa amekuwa mwanafunzi wa Yesu
  alternative: alikuwa amefanywa mwanafunzi na Yesu; alikuwa pia mwanafunzi wa Yesu
  rationale: Kauli tendwa inaweza kueleweka kuwa Yosefu aliingia katika uanafunzi au alifanywa mwanafunzi. Matini humtambulisha kama aliyekuwa miongoni mwa wanafunzi wa Yesu bila kulazimisha dai mahususi kuhusu njia au mtendaji wa kufanywa kwake mwanafunzi; tanbihi huhifadhi uwezekano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya simulizi. Mpangilio umefanywa wa asili kwa msomaji wa kawaida huku msisitizo wa ‘yeye pia’ na uwezekano wa maana ya kauli tendwa ukihifadhiwa.
