  text: Οἱ δὲ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι ἔπεισαν τοὺς ὄχλους ἵνα αἰτήσωνται τὸν Βαραββᾶν τὸν δὲ Ἰησοῦν ἀπολέσωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/020.yaml
  text: But the chief priests and the elders persuaded the crowds to ask for Barabbas[a], but to destroy Jesus.
translation:
  language: sw
  text: Lakini wakuu wa makuhani na wazee waliwashawishi makundi ya watu wamwombe Baraba, lakini wamwangamize Yesu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yesu auawe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Lakini
  rationale: Kiunganishi hiki kinaonyesha tofauti na hatua iliyotangulia katika simulizi; “Lakini” kinaifanya tofauti hiyo iwe wazi na ya kawaida katika Kiswahili.
- source_word: ἀρχιερεῖς
  choice: viongozi wa makuhani
  rationale: Wingi huu unarejelea uongozi mkuu wa kikuhani huko Yerusalemu, si kuhani mkuu mmoja. “Viongozi wa makuhani” ni wazi kwa msomaji wa kawaida.
- source_word: πρεσβύτεροι
  choice: wazee
  rationale: Katika muktadha huu neno hilo linamaanisha viongozi wa Kiyahudi waliotambuliwa; “wazee” huhifadhi maana yake ya kihistoria na kitaasisi.
- source_word: ἔπεισαν
  choice: waliwashawishi
  rationale: Kitenzi kinaeleza kitendo kilichokamilika cha kuwavuta watu wakubali kuchukua hatua iliyotajwa.
- source_word: τοὺς ὄχλους
  choice: watu waliokusanyika
  rationale: Usemi huu wa kawaida unaonyesha makundi ya watu yaliyokuwa yamekusanyika bila kutumia neno la kizamani; pia unawezesha vitenzi vya wingi vinavyofuata.
- source_word: ἵνα αἰτήσωνται τὸν Βαραββᾶν
  choice: waombe wapewe Baraba
  rationale: Baada ya kitenzi cha kushawishi, ἵνα huleta jambo waliloshawishiwa kufanya. “Waombe wapewe Baraba” huwasilisha kwa Kiswahili cha kawaida ombi la kumchagua au kumpata Baraba bila kuongeza wazi kwamba aachiliwe.
- source_word: τὸν δὲ Ἰησοῦν
  choice: lakini ... Yesu
  rationale: δέ ya pili inaweka tofauti dhahiri kati ya kile walichotakiwa kuomba kuhusu Baraba na kile walichotakiwa kumfanyia Yesu.
- source_word: ἀπολέσωσιν
  choice: wamwangamize
  rationale: Kitenzi hiki humaanisha kusababisha mtu apotee au aangamie. “Wamwangamize” huhifadhi upana na nguvu ya neno la Kigiriki kuliko kulifanya moja kwa moja kuwa istilahi maalumu ya hukumu ya kifo.
theological_decisions:
- issue: Maana ya ἀπολέσωσιν katika muktadha wa hukumu na kuuawa
  choice: wamwangamize Yesu
  alternative: wamuue Yesu / Yesu auawe
  rationale: Neno la Kigiriki ni pana kuliko istilahi ya moja kwa moja ya kutekeleza hukumu ya kifo. Tafsiri kuu huhifadhi nguvu hiyo ya kileksia, huku tanbihi ikifafanua maana inayokusudiwa katika muktadha huu bila kuficha uwezekano wa tafsiri nyembamba zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umetanguliza uwazi wa kawaida kwa msomaji wa leo huku ukihifadhi tofauti kati ya Baraba na Yesu na upana wa kitenzi ἀπόλλυμι.
