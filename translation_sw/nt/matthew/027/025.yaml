  yaml_path: translation/nt/matthew/027/025.yaml
  text: And all the people answered[a], “His blood be on us and on our children.”
translation:
  language: sw
  text: Nao watu wote wakajibu[a], “Damu yake na iwe juu yetu na juu ya watoto wetu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, watu waliokuwa wamekusanyika na kusema katika tukio hili; maneno haya hayapaswi kueleweka kuwa yanawahusisha Wayahudi wote wa kila kizazi na hatia ya kudumu.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: wakajibu
  rationale: Kirai cha Kigiriki ‘alipojibu, alisema’ kinafanya kazi kama utangulizi wa jibu; Kiswahili cha kawaida hukitoa kwa ufupi kama ‘wakajibu.’ Wingi unafuata kiima cha pamoja, ‘watu wote.’
- source_word: πᾶς ὁ λαὸς
  choice: watu wote
  rationale: Muundo huu una maana ya jumla ya watu waliokusanyika katika tukio. ‘Watu wote’ huhifadhi maana ya λαός bila kuibadili moja kwa moja kuwa ‘umati’ wala kuipanua iwahusu Wayahudi wote wa kila kizazi.
- source_word: Τὸ αἷμα αὐτοῦ
  choice: Damu yake
  rationale: Huu ndio usemi mfupi na wa kawaida wa Kiswahili. Katika muktadha wa hukumu, damu inadokeza wajibu wa kifo chake, lakini tafsiri kuu haifafanui dokezo hilo ili ihifadhi taswira ya chanzo.
- source_word: ἐφ’ ἡμᾶς
  choice: na iwe juu yetu
  rationale: Kigiriki hakitaji kitenzi waziwazi; ‘na iwe’ huwasilisha nguvu ya kauli ya kujitwika au kukubali matokeo, huku ‘juu yetu’ ikihifadhi taswira ya usemi wa chanzo.
- source_word: ἐπὶ τὰ τέκνα ἡμῶν
  choice: na juu ya watoto wetu
  rationale: ‘Watoto’ ndiyo maana ya kawaida ya τέκνα. Kurudia ‘juu ya’ huhifadhi ulinganifu na msisitizo wa Kigiriki bila kupanua maana kuwa ‘vizazi vyetu vyote.’
theological_decisions:
- issue: Uwezekano wa kuisoma πᾶς ὁ λαὸς kwa mtazamo wa chuki dhidi ya Wayahudi
  choice: 'Kutafsiri kama kauli ya pamoja ya watu waliokusanyika katika tukio: ‘watu wote,’ na kuongeza tanbihi ya ufafanuzi.'
  alternative: ‘umati wote,’ au kuifanya kauli iwahusu Wayahudi wote katika kila kizazi
  rationale: Simulizi linataja watu waliokuwa wamekusanyika katika tukio hilo. Tafsiri haipaswi kupunguza nguvu ya usemi wa pamoja wala kuingiza dai la hatia ya kudumu ya kikabila au ya vizazi vyote ambalo mstari wenyewe haulitamki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Nao’ huunganisha mstari na simulizi lililotangulia; ‘na iwe juu yetu’ huhifadhi uzito wa kauli na taswira ya Kigiriki bila kuongeza ufafanuzi wa kimadhehebu.
