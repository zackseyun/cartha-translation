  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὁ ⸀δὲ ἔφη· Τί γὰρ κακὸν ἐποίησεν; οἱ δὲ περισσῶς ἔκραζον λέγοντες· Σταυρωθήτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/023.yaml
  text: But he said[a], “What evil has he done?” But they cried out all the more, saying[b], “Let him be crucified.”
translation:
  language: sw
  text: Lakini yeye akasema[a], “Kwani, amefanya uovu gani?” Lakini wao wakazidi kupiga kelele, wakisema[b], “Asulubiwe!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au kwa lugha ya kawaida zaidi, “Mbona, amefanya kosa gani?”
    reason: lexical_alternative
  - marker: b
    text: Au, “Msulubishe!” Kigiriki kinasema kwa hali ya kutendwa, kihalisi, “Asulubiwe.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἔφη
  choice: akasema
  rationale: Kitenzi cha wakati uliopita hapa kinaanzisha tu maneno ya Pilato katika simulizi; “akasema” ni tafsiri ya kawaida na ya asili katika Kiswahili.
- source_word: Τί γὰρ κακὸν ἐποίησεν;
  choice: Kwani, amefanya uovu gani?
  rationale: “Kwani” linaonyesha changamoto iliyomo katika τί γάρ bila kuifanya γάρ kuwa sababu rasmi; swali linabaki la asili katika Kiswahili.
- source_word: κακὸν
  choice: uovu
  rationale: “Uovu” linahifadhi uzito wa kimaadili wa κακόν kwa uwazi zaidi kuliko “kosa,” ingawa “kosa” ni mbadala wa kawaida zaidi.
- source_word: περισσῶς
  choice: wakazidi
  rationale: “Wakazidi” linaonyesha kuongezeka kwa msisitizo wa umati bila kuongeza kwa lazima wazo la sauti kuwa kubwa zaidi, ambalo halijasemwa wazi katika neno lenyewe.
- source_word: ἔκραζον
  choice: kupiga kelele
  rationale: Kirai hiki kinaeleza mwito wenye nguvu wa umati; pamoja na “wakazidi,” kinaonyesha mwendelezo na kuongezeka kwa kitendo cha kitenzi cha wakati usiotimilika.
- source_word: λέγοντες
  choice: wakisema
  rationale: Kitenzi hiki kinaonyesha kwamba maneno yao yalitamkwa wakati huohuo walipokuwa wakipiga kelele.
- source_word: Σταυρωθήτω
  choice: Asulubiwe!
  rationale: Hii ni amri ya nafsi ya tatu katika hali ya kutendwa, na “Asulubiwe” huhifadhi hali hiyo kwa ufupi na kwa Kiswahili cha asili.
- source_word: ὁ δὲ ... οἱ δὲ
  choice: Lakini yeye ... Lakini wao ...
  rationale: Kurudia “Lakini” kunahifadhi utofautishaji kati ya swali la Pilato na jibu la umati; viwakilishi vinaweka wahusika wazi.
theological_decisions:
- issue: Jinsi ya kutafsiri dai la umati kuhusu kusulubiwa
  choice: Asulubiwe!
  alternative: Msulubishe!
  rationale: Kigiriki kina amri katika hali ya kutendwa. “Asulubiwe” kinahifadhi muundo huo bila kumtaja wazi mtendaji wala kuingiza ufafanuzi wa kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya usomaji wa Biblia. “Asulubiwe” ni neno linaloeleweka katika muktadha wa Biblia na pia linahifadhi kwa usahihi amri ya kutendwa. Alama za tanbihi [a] na [b] zimewekwa katika matini kuu.
