  text: And after spitting on him[b][a], they took the reed and kept striking his head.
translation:
  language: sw
  text: Nao, baada ya kumtemea mate, wakachukua ule mwanzi, wakampiga-piga kichwani.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walikuwa wakimpiga kichwani.” Kitenzi cha Kigiriki cha wakati usiotimilika kinaweza kusisitiza tendo lililorudiwa au lililoendelea.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kigiriki κάλαμος linaweza kumaanisha “mwanzi” au, kwa upanuzi wa maana, fimbo iliyofanana na mwanzi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμπτύσαντες εἰς αὐτόν
  choice: baada ya kumtemea mate
  rationale: Kirai hiki kinaonyesha tendo lililotangulia matendo makuu; ‘kumtemea mate’ ni Kiswahili cha kawaida na cha moja kwa moja kwa kumtemea mtu.
- source_word: ἔλαβον
  choice: wakachukua
  rationale: Kitenzi hiki kinatafsiri maana ya kawaida ya λαμβάνω na kuendeleza mfuatano wa masimulizi kwa njia ya asili katika Kiswahili.
- source_word: τὸν κάλαμον
  choice: ule mwanzi
  rationale: ‘Mwanzi’ huhifadhi maana ya msingi ya κάλαμος na uhusiano na mwanzi uliotajwa awali katika tukio hili; ‘ule’ unaonyesha kitu hicho kilichojulikana tayari.
- source_word: ἔτυπτον
  choice: kuendelea kumpiga
  rationale: Kauli ya wakati usiotimilika ya Kigiriki inaweza kuonyesha tendo lililoendelea au kurudiwa; ‘kuendelea kumpiga’ huonyesha hali hiyo wazi.
- source_word: εἰς τὴν κεφαλὴν αὐτοῦ
  choice: kichwani
  rationale: Katika muktadha huu εἰς huonyesha sehemu iliyolengwa na mapigo; ‘kichwani’ ni usemi wa asili wa Kiswahili.
theological_decisions:
- issue: Kuonyesha dhihaka na ukatili waliofanyiwa Yesu
  choice: Kutaja matendo hayo moja kwa moja na kuhifadhi hali ya mapigo yaliyoendelea au kurudiwa.
  alternative: 'Kutumia usemi rasmi zaidi: ‘na walipokwisha kumtemea mate, walichukua mwanzi na walikuwa wakimpiga kichwani.’'
  rationale: Aya ni simulizi la unyanyasaji; tafsiri haipaswi kupunguza wala kuongeza ukatili, bali kuwasilisha wazi matendo na hali ya kitenzi cha Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo wa ‘Nao ... waka-’ unadumisha mtiririko wa simulizi, huku ‘kuendelea kumpiga’ ikihifadhi hali ya tendo la Kigiriki bila kuongeza maelezo.
