revisions:
- from: Lakini makuhani wakuu wakavichukua vile vipande vya fedha na kusema, “Hairuhusiwi kuviweka katika hazina ya Hekalu[a], kwa sababu ni malipo ya damu[b].”
  to: Lakini baada ya makuhani wakuu kuvichukua vile vipande vya fedha, wakasema, “Hairuhusiwi kuviweka katika hazina ya Hekalu[a], kwa sababu ni bei ya damu[b].”
  rationale: Marekebisho yanasawazisha uhusiano wa λαβόντες na εἶπαν kwa muundo wa Kiswahili wa “Baada ya ... wakasema.” “Bei ya damu” inatafsiri τιμή αἵματός kwa karibu zaidi, huku tanbihi ikihifadhi usemi mbadala wa kawaida. Tanbihi ya hazina imefafanuliwa ili kulinda maana ya istilahi ya Kigiriki.
