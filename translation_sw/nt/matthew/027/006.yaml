review_pass:
  verdict: revise
  source_fidelity: 'Tafsiri inafuata maana ya Kigiriki kwa ujumla: makuhani wakuu wanachukua fedha hizo, wanakataa kuziweka katika hazina ya Hekalu, na wanatoa sababu kwamba ni bei inayohusishwa na damu. Hata hivyo, muundo wa “wakavichukua ... na kusema” hauwakilishi kwa usahihi mfuatano wa kitenzi kishirikishi λαβόντες na kitenzi kikuu εἶπαν kwa Kiswahili sanifu.'
  naturalness: “Hairuhusiwi” na “hazina ya Hekalu” ni vya kawaida na vinafaa kwa rejista ya kifasihi ya kisasa. Muundo wa sentensi unahitaji kusawazishwa; “Baada ya ... wakasema” unasikika wa asili. “Bei ya damu” huhifadhi τιμή kwa karibu zaidi na huepuka utata unaoweza kutokea katika “malipo ya damu.”
  terminology: “Makuhani wakuu” ni sawa kwa ἀρχιερεῖς, na “hazina ya Hekalu” hufikisha κορβανᾶν vizuri. “Bei ya damu” ni ulinganifu wa karibu wa τιμὴ αἵματός; tanbihi inaweza kutoa usemi wa kawaida “fedha za damu.” Tanbihi ya korbani inapaswa kutaja umbo la neno kama istilahi ya hazina takatifu, bila kulichanganya na maana ya kawaida ya Kiswahili ya “korbani.”
