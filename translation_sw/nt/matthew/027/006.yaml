    issue: Muundo wa vitenzi haulingani
    rationale: Kauli “makuhani wakuu wakavichukua ... na kusema” huchanganya kitenzi cha simulizi chenye -ka- na kitenzi-jina “kusema.” Kigiriki kina kishirikishi λαβόντες kikifuatiwa na kitenzi kikuu εἶπαν; “Baada ya ... wakasema” hutoa mfuatano huo kwa Kiswahili asilia.
  - severity: low
    issue: “Malipo ya damu” ina utata wa kisemantiki
    rationale: Inaweza kusikika kama fidia au malipo yanayotokana na damu. “Bei ya damu” hufuata τιμή (“bei/thamani”) kwa karibu na huhifadhi usemi wenye ukali wa asili.
  - severity: low
    issue: Tanbihi ya korbani inahitaji ufafanuzi sahihi zaidi wa istilahi
    rationale: Kumtaja “korbani” pekee kunaweza kusababisha msomaji aihusishe na dhabihu. Tanbihi inapaswa kueleza kwamba ni istilahi ya Kigiriki inayorejelea hazina au fedha takatifu za Hekalu.
