  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οἱ δὲ ἀρχιερεῖς λαβόντες τὰ ἀργύρια εἶπαν· Οὐκ ἔξεστιν βαλεῖν αὐτὰ εἰς τὸν κορβανᾶν, ἐπεὶ τιμὴ αἵματός ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/006.yaml
  text: But the chief priests[a], taking the silver pieces, said, “It is not lawful to put them into the temple treasury[b], since they are the price of blood.”
translation:
  language: sw
  text: Lakini baada ya makuhani wakuu kuvichukua vile vipande vya fedha, wakasema, “Hairuhusiwi kuviweka katika hazina ya Hekalu[a], kwa sababu ni bei ya damu[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kigiriki: korbana; istilahi inayorejelea hazina ya Hekalu au fedha takatifu.'
    reason: lexical_alternative
  - marker: b
    text: Au “fedha za damu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρχιερεῖς
  choice: makuhani wakuu
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa viongozi wakuu wa kikuhani wanaotajwa kwa wingi katika Injili.
- source_word: λαβόντες
  choice: wakavichukua
  rationale: Muundo wa masimulizi wenye ‘waka-’ unatoa kwa kawaida tendo linalofuatana na kauli yao bila kulazimisha tafsiri nzito ya kishazi tegemezi.
- source_word: τὰ ἀργύρια
  choice: vile vipande vya fedha
  rationale: Hurejelea malipo ya fedha yaliyotajwa katika muktadha; ‘vipande vya fedha’ huhifadhi maana halisi bila kudai aina maalumu ya sarafu.
- source_word: Οὐκ ἔξεστιν
  choice: Hairuhusiwi
  rationale: Huonyesha kutokubalika kwa jambo hilo kwa mujibu wa sheria au taratibu za kidini, kwa Kiswahili cha sasa na cha kawaida.
- source_word: βαλεῖν
  choice: kuviweka
  rationale: Katika muktadha wa hazina, maana ya kawaida ni kuweka humo, si lazima kutupa kwa nguvu.
- source_word: κορβανᾶν
  choice: hazina ya Hekalu
  rationale: Neno hili hurejelea hazina au fedha takatifu za Hekalu; tafsiri hii hueleweka moja kwa moja kwa msomaji wa sasa.
- source_word: ἐπεὶ
  choice: kwa sababu
  rationale: Huanzisha wazi sababu ya katazo lililotajwa.
- source_word: τιμὴ αἵματός
  choice: malipo ya damu
  rationale: Huhifadhi kwa ukaribu taswira na mkazo wa Kigiriki huku ikibaki ya asili katika Kiswahili; maana ya fedha zilizolipwa ili mtu auawe inaelezwa katika tanbihi.
theological_decisions:
- issue: Jinsi ya kutafsiri κορβανᾶν bila kupoteza mazingira yake ya kidini
  choice: hazina ya Hekalu
  alternative: korbani
  rationale: Kutafsiri maana yake kunafanya mstari ueleweke kwa urahisi, huku tanbihi ikihifadhi umbo la neno la Kigiriki na wazo la fedha takatifu.
- issue: Jinsi ya kuhifadhi mkazo wa τιμὴ αἵματός
  choice: malipo ya damu
  alternative: fedha za kumwaga damu
  rationale: ‘Malipo ya damu’ hubaki karibu na muundo halisi wa Kigiriki na hauondoi kwa ufafanuzi mwingi mvutano wa usemi huo; tanbihi hutoa maana mbadala ya kawaida.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa urahisi. ‘Hekalu’ limeandikwa kwa herufi kubwa kwa kuwa hapa linarejelea Hekalu la Yerusalemu. Viambishi vya ngeli katika ‘wakavichukua’ na ‘kuviweka’ vinaelekeza kwa ‘vipande vya fedha.’
