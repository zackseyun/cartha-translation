  yaml_path: translation/nt/matthew/027/010.yaml
  text: and they gave them for the potter's field[b][a], just as the Lord directed me.
translation:
  language: sw
  text: na wakazitoa kwa ajili ya shamba la mfinyanzi, kama vile Bwana alivyonielekeza[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alivyoniamuru” au “alivyonipa maagizo.”
    reason: lexical_alternative
  - marker: b
    text: Mathayo anahifadhi usemi wa nafsi ya kwanza, “mimi” (ulio katika kiambishi -ni-), katika dondoo au dokezo hili la kinabii badala ya kuubadili ili ulingane na muktadha wa simulizi.
    reason: cross_reference
lexical_decisions:
- source_word: ἔδωκαν
  choice: wakazitoa
  rationale: Kitenzi hiki kinahifadhi maana ya msingi ya ‘walitoa/walitoa kitu,’ huku kiambishi -zi- kikirejelea fedha zilizotajwa katika muktadha. ‘Walilipa’ kingekuwa ufafanuzi wa ziada.
- source_word: αὐτὰ
  choice: -zi- katika ‘wakazitoa’
  rationale: Kiwakilishi cha wingi kinarejelea vipande vya fedha. Kiswahili cha kawaida huonyesha rejeo hilo kwa kiambishi cha yambwa ndani ya kitenzi badala ya kiwakilishi huru.
- source_word: εἰς τὸν ἀγρὸν
  choice: kwa ajili ya shamba
  rationale: Ingawa εἰς mara nyingi humaanisha ‘ndani ya’ au ‘kwenda,’ hapa inaonyesha kusudi la kutolewa kwa fedha kuhusiana na shamba. Tafsiri hii ni ya kawaida bila kuongeza moja kwa moja kitenzi ‘kununua.’
- source_word: τοῦ κεραμέως
  choice: la mfinyanzi
  rationale: Muundo wa ‘shamba la mfinyanzi’ unawakilisha hali ya umilikishi ya Kigiriki kwa Kiswahili cha kawaida.
- source_word: καθὰ
  choice: kama vile
  rationale: Maneno haya yanaonyesha ulinganifu wa jinsi jambo lilivyofanywa na agizo lililotolewa.
- source_word: συνέταξέν
  choice: alivyonielekeza
  rationale: συντάσσω inaweza kumaanisha kuamuru, kuelekeza, au kutoa maagizo. ‘Alivyonielekeza’ ni ya asili na huhifadhi wazo la maelekezo yenye mamlaka; visawe vimetajwa katika tanbihi.
- source_word: μοι
  choice: -ni- katika ‘alivyonielekeza’
  rationale: Kiambishi cha yambwa -ni- kinahifadhi nafsi ya kwanza ‘mimi’ iliyo wazi katika Kigiriki, bila kuilinganisha kimyakimya na muktadha wa simulizi.
- source_word: κύριος
  choice: Bwana
  rationale: Hili ndilo neno la kawaida, lenye hadhi, kwa κύριος katika muktadha huu.
theological_decisions:
- issue: Mrejelewa wa nafsi ya kwanza katika dondoo/dokezo la kinabii
  choice: Kuhifadhi nafsi ya kwanza katika ‘alivyonielekeza.’
  alternative: Kulainisha usemi ili ulingane moja kwa moja na wahusika wa simulizi au na maneno ya vifungu vya Agano la Kale vinavyodokezwa.
  rationale: Nakala ya Kigiriki ina μοι (‘mimi/kwangu’). Tafsiri inahifadhi mvutano huo bila kujaribu kutatua ndani ya mstari namna Mathayo anavyotumia dondoo hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima, na inayoeleweka kwa urahisi. Muundo ‘wakazitoa kwa ajili ya’ huepuka kuongeza wazi wazo la ununuzi ambalo linaeleweka kutokana na muktadha lakini halitajwi moja kwa moja na kitenzi cha Kigiriki.
