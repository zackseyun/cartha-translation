  text: He went to Pilate and asked for the body of Jesus[a]. Then Pilate ordered it to be given to him.
translation:
  language: sw
  text: Huyu alimwendea Pilato, akaomba mwili wa Yesu. Ndipo Pilato akaamuru mwili huo ukabidhiwe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mwili huo utolewe.”
    reason: Kitenzi cha Kigiriki kinaweza kumaanisha kutoa au kukabidhi katika muktadha huu.
lexical_decisions:
- source_word: οὗτος
  choice: Huyu
  rationale: Kiwakilishi hiki kinamrejelea Yosefu wa Arimathea aliyetajwa katika mstari uliotangulia; “Huyu” hudumisha rejeo hilo wazi na kwa mtiririko wa kawaida wa masimulizi.
- source_word: προσελθὼν τῷ Πιλάτῳ
  choice: alimwendea Pilato
  rationale: Muundo huu unaonyesha Yosefu akimkaribia Pilato kabla ya kutoa ombi; “alimwendea” ni Kiswahili cha kawaida na chenye heshima katika simulizi.
- source_word: ᾐτήσατο τὸ σῶμα τοῦ Ἰησοῦ
  choice: kuomba apewe mwili wa Yesu
  rationale: Kitenzi αἰτέω pamoja na kitu kinachoombwa kina maana ya kuomba kitu; “kuomba apewe” huonyesha kwa kawaida kwamba Yosefu alitaka mwili ukabidhiwe kwake.
- source_word: σῶμα
  choice: mwili
  rationale: “Mwili” ndilo neno la moja kwa moja na lenye heshima; muktadha unaonyesha kuwa ni mwili wa Yesu aliyekufa bila kulazimisha neno kali zaidi kama “maiti.”
- source_word: τότε
  choice: Ndipo
  rationale: “Ndipo” huonyesha kwa kawaida tukio lililofuata baada ya ombi la Yosefu.
- source_word: ἐκέλευσεν
  choice: akaamuru
  rationale: κελεύω humaanisha kutoa amri; “akaamuru” ni fupi, ya kawaida, na inafaa mamlaka ya Pilato.
- source_word: ἀποδοθῆναι
  choice: mwili huo utolewe
  rationale: Kauli tendwa ya ἀποδίδωμι hapa inaonyesha kwamba Pilato aliagiza mwili utolewe au ukabidhiwe. Kurudia “mwili huo” huondoa utata wa kiwakilishi katika Kiswahili bila kumtaja mpokeaji ambaye Kigiriki hakumtaji wazi.
