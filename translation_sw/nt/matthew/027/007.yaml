  text: συμβούλιον δὲ λαβόντες ἠγόρασαν ἐξ αὐτῶν τὸν Ἀγρὸν τοῦ Κεραμέως εἰς ταφὴν τοῖς ξένοις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/007.yaml
  text: So after taking counsel[b][a], they bought the Potter’s Field with them as a burial place for foreigners.
translation:
  language: sw
  text: Basi, baada ya kushauriana, walitumia fedha hizo[a] kununua Shamba la Mfinyanzi liwe mahali pa kuzikia wageni[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki husema kihalisi “kutokana nazo,” kikirejelea sarafu za fedha zilizotajwa katika muktadha uliotangulia.
    reason: lexical_alternative
  - marker: b
    text: Au “watu wa kigeni” au “watu wasio wenyeji.”
    reason: lexical_alternative
lexical_decisions:
- source_word: συμβούλιον ... λαβόντες
  choice: baada ya kushauriana
  rationale: Nahau hii ina maana halisi ya kufanya mashauriano; tafsiri hii ni ya kawaida katika Kiswahili na inadumisha tendo lililotangulia ununuzi.
- source_word: δὲ
  choice: Basi
  rationale: Hapa δέ inaendeleza simulizi na kuonyesha hatua iliyofuata, si upinzani mkali.
- source_word: ἠγόρασαν
  choice: kununua
  rationale: Kitenzi ἀγοράζω hapa kinamaanisha moja kwa moja kununua; muundo wa Kiswahili unaunganisha tendo hilo kwa kawaida na matumizi ya fedha.
- source_word: ἐξ αὐτῶν
  choice: walitumia fedha hizo
  rationale: Kiwakilishi cha wingi kinarejelea sarafu za fedha zilizotajwa katika muktadha uliotangulia. Kiswahili cha kawaida huhitaji kurejesha rejeleo hilo kwa uwazi; tanbihi inahifadhi usemi halisi wa Kigiriki.
- source_word: τὸν Ἀγρὸν τοῦ Κεραμέως
  choice: Shamba la Mfinyanzi
  rationale: Hii inadumisha uhusiano wa umilikaji katika usemi wa Kigiriki na inasomeka kama jina la mahali linalotambulika katika simulizi.
- source_word: εἰς ταφὴν
  choice: liwe mahali pa kuwazika
  rationale: εἰς pamoja na ταφή inaonyesha kusudi la shamba; muundo huu unaeleza matumizi yaliyokusudiwa kwa Kiswahili cha kawaida.
- source_word: τοῖς ξένοις
  choice: wageni
  rationale: ξένοις inaweza kumaanisha watu wa kigeni, wasio wenyeji, au wageni. 'Wageni' huhifadhi upana huo bila kuamua kupita kiasi.
theological_decisions:
- issue: Kirejelewa cha αὐτῶν
  choice: Kimefafanuliwa katika matini kuwa fedha hizo, yaani sarafu za fedha zilizotajwa kabla.
  alternative: Kudumisha usemi wa moja kwa moja zaidi, 'kutokana nazo' au 'kwa hizo.'
  rationale: Muktadha wa karibu unaonyesha wazi kuwa kiwakilishi kinarejelea sarafu za fedha alizorudisha Yuda. Ufafanuzi huu unafanya Kiswahili kiwe wazi bila kubadili maana, huku tanbihi ikitaja usemi halisi.
- issue: Maana ya ξένοις
  choice: wageni
  alternative: watu wa kigeni; watu wasio wenyeji
  rationale: '''Wageni'' huhifadhi utata halisi wa neno la Kigiriki, ambalo linaweza kuelekea kwa watu wa kigeni au kwa wasio wenyeji, bila kuingiza maana finyu isiyolazimishwa na aya.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. 'Basi' inaendeleza simulizi kwa ulaini; 'Shamba la Mfinyanzi' limetumiwa kama jina la mahali. Alama zote za tanbihi zimewekwa katika matini.
