  text: And after binding him[b][a], they led him away and handed him over to Pilate the governor.
translation:
  language: sw
  text: Nao, baada ya kumfunga[a], walimpeleka na kumkabidhi[b] Pilato, gavana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walipokwisha kumfunga.”
    reason: lexical_alternative
  - marker: b
    text: Au, “wakamtia mikononi mwa Pilato, gavana.”
