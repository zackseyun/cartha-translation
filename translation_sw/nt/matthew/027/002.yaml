lexical_decisions:
- source_word: δήσαντες
  choice: baada ya kumfunga
  rationale: Kirai hiki kinaonyesha kwamba kitendo cha kumfunga kilitangulia vitendo vikuu, huku kikihifadhi maana halisi ya kumtia katika kifungo.
- source_word: ἀπήγαγον
  choice: walimwondoa
  rationale: Kitenzi hiki humaanisha kumwongoza au kumpeleka mtu kutoka mahali fulani. “Walimwondoa” ni Kiswahili cha kawaida kinachoeleza kupelekwa kwake chini ya ulinzi bila kuongeza mahali ambapo halikutajwa.
- source_word: παρέδωκαν
  choice: wakamkabidhi
  rationale: Hapa maana ni kumweka Yesu chini ya mamlaka au ulinzi wa Pilato. “Kumkabidhi” ni wazi katika muktadha wa kisheria na bado kinahifadhi mwangwi mpana wa kitenzi katika simulizi la mateso.
- source_word: Πιλάτῳ
  choice: Pilato
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili.
- source_word: ἡγεμόνι
  choice: gavana
  rationale: Neno la Kigiriki humaanisha mtawala au afisa mwenye mamlaka. “Gavana” linaeleweka kwa urahisi na halibainishi cheo cha kihistoria kwa usahihi unaozidi neno la chanzo.
- source_word: καὶ δήσαντες αὐτὸν
  choice: Nao baada ya kumfunga
  rationale: “Nao” linaendeleza mtiririko wa simulizi, na kiambishi cha yambwa katika “kumfunga” kinawakilisha αὐτόν kwa kawaida katika Kiswahili.
theological_decisions:
- issue: Maana ya παραδίδωμι katika simulizi la mateso
  choice: wakamkabidhi
  alternative: wakamtoa
  rationale: “Wakamkabidhi” huweka mbele maana ya papo hapo ya kumweka Yesu chini ya mamlaka ya Pilato bila kufuta uzito mpana wa neno katika simulizi la mateso. “Wakamtoa” linawezekana, lakini halionyeshi kwa uwazi sawa uhamisho wa mamlaka au ulinzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa sentensi unafuata mfululizo wa vitendo katika Kigiriki bila kuwa mgumu; “gavana” limetumiwa badala ya cheo maalumu zaidi ili kutobainisha zaidi ya chanzo.
