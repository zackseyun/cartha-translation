  text: καὶ ἐὰν ἀκουσθῇ τοῦτο ⸀ἐπὶ τοῦ ἡγεμόνος, ἡμεῖς πείσομεν ⸀αὐτὸν καὶ ὑμᾶς ἀμερίμνους ποιήσομεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/014.yaml
  text: And if this is heard by the governor, we will persuade him and keep you out of trouble.
translation:
  language: sw
  text: Na jambo hili likifika masikioni mwa gavana,[a] sisi tutamshawishi na kuwaepusha ninyi na matatizo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “jambo hili likijulikana kwa gavana.”
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “kuwafanya msiwe na wasiwasi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκουσθῇ
  choice: likifika masikioni
  rationale: Kauli hii ya kutendwa ya ἀκούω inamaanisha jambo hilo kujulikana au kusikiwa. Nahau ya Kiswahili “kufika masikioni” inaeleza maana hiyo kwa lugha ya kawaida huku ikidumisha taswira ya kusikia.
- source_word: ἐπὶ τοῦ ἡγεμόνος
  choice: mwa gavana
  rationale: Pamoja na “likifika masikioni,” muundo huu unaonyesha kwamba taarifa hiyo inaweza kumfikia gavana. Tafsiri hii ni ya asili katika Kiswahili na haifanyi gavana kuwa mtendaji wa kitenzi.
- source_word: ἡγεμόνος
  choice: gavana
  rationale: Katika muktadha huu wa utawala wa Roma, ἡγεμών ni gavana wa jimbo, yaani Pilato; “gavana” ni neno sahihi na linaloeleweka.
- source_word: πείσομεν αὐτόν
  choice: tutamshawishi
  rationale: Hii inatafsiri moja kwa moja maana ya πείθω, bila kubainisha jambo ambalo watamshawishi akubali, kwa kuwa maandishi asilia hayalisemi wazi.
- source_word: ἀμερίμνους
  choice: kuwaepusha ninyi na matatizo
  rationale: Ingawa ἀμερίμνους kwa msingi ni “bila wasiwasi,” katika muktadha huu wasiwasi unatokana na uwezekano wa walinzi kuadhibiwa. “Kuwaepusha na matatizo” huwasilisha maana ya kimuktadha kwa Kiswahili cha kawaida.
- source_word: ποιήσομεν
  choice: kuwaepusha
  rationale: ποιέω pamoja na kivumishi cha hali humaanisha kuwafanya wawe katika hali fulani. “Kuwaepusha” ni ulinganifu wa asili wa matokeo hayo katika kishazi hiki.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa simulizi la Biblia. “Likifika masikioni” ni nahau inayoeleweka kwa urahisi; kiwakilishi “ninyi” kimewekwa ili kudhihirisha utofautishaji wa ἡμεῖς na ὑμᾶς katika maandishi asilia.
