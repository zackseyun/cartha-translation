  yaml_path: translation/nt/matthew/028/012.yaml
  text: And after gathering with the elders and taking counsel[a], they gave a considerable sum of silver to the soldiers,
translation:
  language: sw
  text: Baada ya kukutana na wazee na kushauriana, waliwapa askari kiasi kikubwa cha fedha[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “fedha nyingi.” Neno la Kigiriki linaweza kumaanisha fedha ya thamani ya fedha au sarafu za fedha.
    reason: lexical_alternative
lexical_decisions:
- source_word: συναχθέντες
  choice: baada ya kukusanyika
  rationale: Kitenzi kishirikishi cha wakati uliopita kinaonyesha kukusanyika kwao kabla ya tendo kuu; usemi huu ni wa kawaida na unahifadhi mfuatano huo.
- source_word: μετὰ τῶν πρεσβυτέρων
  choice: pamoja na wazee
  rationale: μετά pamoja na hali ya umilikishi huonyesha ushirika; “wazee” ndilo neno la kawaida kwa viongozi hawa katika muktadha huu.
- source_word: συμβούλιόν τε λαβόντες
  choice: na kufanya shauri
  rationale: Nahau συμβούλιον λαμβάνω humaanisha kujadiliana na kufikia shauri au mpango, si kupokea ushauri tu. “Kufanya shauri” ni ya asili na haiongezi maelezo yasiyokuwapo.
- source_word: ἀργύρια
  choice: fedha
  rationale: Wingi huu unaweza kumaanisha fedha kama mali au pesa ya fedha. Neno “fedha” linahifadhi maana hiyo bila kudai kwamba zilikuwa sarafu hasa.
- source_word: ἱκανὰ
  choice: kiasi kikubwa
  rationale: Katika muktadha huu neno linaeleza wingi mkubwa wa malipo. “Kiasi kikubwa” huwasilisha kuwa malipo yalikuwa mengi badala ya maana finyu ya “kutosha.”
- source_word: ἔδωκαν
  choice: waliwapa
  rationale: Ni tafsiri ya moja kwa moja ya tendo kuu la kutoa, huku kiambishi cha yambwa kikirejelea askari.
- source_word: τοῖς στρατιώταις
  choice: askari
  rationale: στρατιώταις humaanisha askari. Ingawa walikuwa wakifanya kazi ya ulinzi, tafsiri haibadili utambulisho wao kuwa “walinzi.”
theological_decisions:
- issue: Utambulisho wa kiima kisichotajwa wazi
  choice: “wali-” inawarejelea viongozi wa makuhani wanaoendelea kutoka mstari uliotangulia
  alternative: kundi lisilotajwa
  rationale: Vitenzi vya Kigiriki vina kiima cha wingi wa kiume kinachoendelea kutoka Mathayo 28:11, ambako viongozi wa makuhani ndio wahusika. Tafsiri haiongezi jina lao kwa sababu mstari huu wa Kigiriki haulirudii.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka. Alama ya tanbihi imewekwa baada ya “fedha,” jambo linalolingana na neno linalofafanuliwa.
