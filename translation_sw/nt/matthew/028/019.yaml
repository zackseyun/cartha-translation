  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: πορευθέντες ⸀οὖν μαθητεύσατε πάντα τὰ ἔθνη, ⸀βαπτίζοντες αὐτοὺς εἰς τὸ ὄνομα τοῦ πατρὸς καὶ τοῦ υἱοῦ καὶ τοῦ ἁγίου πνεύματος,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/019.yaml
  text: Therefore[a], go and make disciples of all the nations, baptizing them into the name of the Father and of the Son and of the Holy Spirit,
translation:
  language: sw
  text: Kwa hiyo, nendeni mkawafanye watu wa mataifa yote kuwa wanafunzi, mkiwabatiza katika jina[a] la Baba na la Mwana na la Roho Mtakatifu,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa jina.” Kiyunani kina kihusishi chenye maana ya msingi ya “kuingia katika,” ambacho hapa huenda kikasisitiza kuingia katika uhusiano au kutambulishwa na jina hilo.
    reason: alternative_reading
lexical_decisions:
- source_word: πορευθέντες
  choice: nendeni
  rationale: Ingawa kimuundo ni kitenzi-shirikishi cha wakati uliopita (‘baada ya kwenda’), hapa kinaambatana na agizo kuu na kwa Kiswahili cha kawaida nguvu yake ya agizo inaelezwa vizuri kwa ‘nendeni.’
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Inaonyesha hitimisho linalotokana na tangazo la mamlaka ya Yesu katika mstari uliotangulia.
- source_word: μαθητεύσατε
  choice: mkawafanye … kuwa wanafunzi
  rationale: Kitenzi kina maana ya kusababisha watu wawe wanafunzi. Muundo huu ni wa kawaida na unahifadhi nguvu ya kisababishi.
- source_word: πάντα τὰ ἔθνη
  choice: watu wa mataifa yote
  rationale: ‘Mataifa yote’ huhifadhi upeo wa ulimwengu mzima, huku ‘watu wa’ ikifanya wazi kwamba kiwakilishi αὐτούς na tendo la kubatizwa vinawahusu watu wa mataifa hayo, si mataifa kama taasisi.
- source_word: βαπτίζοντες
  choice: mkiwabatiza
  rationale: Huhifadhi uhusiano wa kitenzi-shirikishi na agizo la kuwafanya wanafunzi bila kuamua kimadhehebu namna maalumu ya ubatizo.
- source_word: εἰς τὸ ὄνομα
  choice: katika jina
  rationale: ‘Katika’ ndilo chaguo la asili la Kiswahili linaloweza kuhifadhi wazo la kuingizwa katika uhusiano au utambulisho unaodokezwa na εἰς; tanbihi inataja tafsiri nyingine ya kawaida.
- source_word: τοῦ πατρὸς
  choice: Baba
  rationale: Katika fomula hii, ni cheo cha kimungu; herufi kubwa inaonyesha rejeo hilo.
- source_word: τοῦ υἱοῦ
  choice: Mwana
  rationale: Ni cheo cha kimungu katika mfuatano huu, si jina la kawaida la uhusiano wa kifamilia.
- source_word: τοῦ ἁγίου πνεύματος
  choice: Roho Mtakatifu
  rationale: Hili ndilo jina la kawaida na la sasa la Kiswahili kwa rejeo hili la kimungu.
theological_decisions:
- issue: Tafsiri ya kihusishi εἰς katika fomula ya ubatizo
  choice: katika jina
  alternative: kwa jina
  rationale: ‘Katika jina’ hukaribia maana ya msingi ya εἰς na inaweza kudokeza kuingia katika uhusiano au utambulisho, bila kuingiza nadharia kamili kuhusu athari za sakramenti. ‘Kwa jina’ ni tafsiri ya kawaida na inayowezekana, hivyo imetajwa katika tanbihi.
- issue: Jina moja likifuatiwa na Baba, Mwana na Roho Mtakatifu
  choice: jina la Baba na la Mwana na la Roho Mtakatifu
  alternative: majina ya Baba, Mwana na Roho Mtakatifu
  rationale: Maandishi ya Kiyunani yana ‘jina’ katika umoja na viambajengo vitatu vilivyounganishwa. Tafsiri inadumisha umoja huo na haitumii ‘majina,’ ambayo ingebadili idadi ya nomino.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. ‘Watu wa mataifa yote’ huepuka Kiswahili kisicho cha kawaida cha kuyafanya mataifa yenyewe kuwa wanafunzi na hufuata rejeo la kiwakilishi cha Kiyunani. Alama ya tanbihi imewekwa baada ya ‘jina,’ mahali panapohusika moja kwa moja.
