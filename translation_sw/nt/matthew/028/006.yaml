  yaml_path: translation/nt/matthew/028/006.yaml
  text: He is not here[a], for he has been raised, just as he said. Come[b], see the place where he was lying.
translation:
  language: sw
  text: Hayupo hapa, kwa maana amefufuliwa[a], kama alivyosema. Njoni, tazameni mahali alipokuwa amelala[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “amefufuka.” Kitenzi cha Kigiriki ni cha hali ya kutendwa (“amefufuliwa”), ingawa kwa kawaida pia hutafsiriwa kwa hali ya kutenda.
    reason: alternative_reading
  - marker: b
    text: Au, “mahali alipolala” au “mahali alipokuwa amelazwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἔστιν ὧδε
  choice: Hayupo hapa
  rationale: Kauli hii ya mahali inaelezwa kwa Kiswahili cha kawaida kwa ‘Hayupo hapa’; kiwakilishi cha nafsi kinaeleweka kutokana na muktadha.
- source_word: ἠγέρθη
  choice: amefufuliwa
  rationale: Kitenzi cha Kigiriki ni cha hali ya kutendwa. ‘Amefufuliwa’ kinahifadhi hali hiyo na kinaonyesha tendo lililokamilika lenye matokeo ya sasa.
- source_word: γὰρ
  choice: kwa maana
  rationale: Kiunganishi hiki kinatoa sababu ya kutokuwapo kwake hapo; ‘kwa maana’ kinafaa katika lugha ya heshima na iliyo wazi.
- source_word: καθὼς εἶπεν
  choice: kama alivyosema
  rationale: Tafsiri hii inaonyesha kwamba tukio limetokea sawasawa na alivyokuwa amesema, bila kuongeza maelezo yasiyomo katika matini.
- source_word: δεῦτε
  choice: Njoni
  rationale: Ni mwaliko au mwito unaoelekezwa kwa watu zaidi ya mmoja; ‘Njoni’ ni amri ya kawaida na ya moja kwa moja.
- source_word: ἴδετε
  choice: mpatazame
  rationale: Amri hii inawaita waangalie mahali hapo kwa makusudi. ‘Mpatazame’ ni ya kawaida na yenye heshima kuliko mtindo wa kizamani.
- source_word: τὸν τόπον
  choice: mahali
  rationale: Neno hili linarejelea sehemu halisi ndani ya kaburi; ‘mahali’ ni tafsiri ya asili na inayoeleweka.
- source_word: ὅπου ἔκειτο
  choice: alipokuwa amelala
  rationale: Kitenzi kina maana ya kuwa katika hali ya kulala au kuwekwa. Tafsiri hii inadumisha hali inayoendelea iliyodokezwa na wakati wa kitenzi bila kulazimisha maana ya tukio la kuwekwa.
theological_decisions:
- issue: Hali na mtendaji katika kauli ya ufufuo
  choice: amefufuliwa
  alternative: amefufuka
  rationale: Kigiriki ἠγέρθη ni cha hali ya kutendwa. ‘Amefufuliwa’ kinahifadhi muundo huo na hakiwekei matini upendeleo wa hali ya kutenda, huku ‘amefufuka’ kikiwa tafsiri mbadala ya kawaida.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Hayupo’ na ‘Njoni’ ni miundo ya kawaida inayoeleweka kwa urahisi; ‘amefufuliwa’ limechaguliwa ili kuhifadhi hali ya kutendwa ya matini chanzo.
