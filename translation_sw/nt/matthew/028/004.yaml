  text: ἀπὸ δὲ τοῦ φόβου αὐτοῦ ἐσείσθησαν οἱ τηροῦντες καὶ ἐγενήθησαν ⸀ὡς νεκροί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/004.yaml
  text: And from fear of him the guards shook and became like dead men[a].
translation:
  language: sw
  text: Kwa kumwogopa huyo, walinzi wakatetemeka, wakawa kama wafu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa sababu walimwogopa huyo, walinzi walitikisika.”
    reason: Njia nyingine ya kuonyesha kwamba ἀπό ina maana ya sababu na kwamba ἐσείσθησαν inaweza kutafsiriwa ‘walitikisika.’
lexical_decisions:
- source_word: ἀπὸ
  choice: kwa
  rationale: Pamoja na nomino ya hofu, ἀπό inaonyesha sababu au chanzo cha mwitikio. ‘Kwa’ ni ya kawaida katika Kiswahili na inawasilisha uhusiano huo wa kisababishi.
- source_word: δὲ
  choice: muundo wa masimulizi wenye ‘waka-’
  rationale: δέ ni kiunganishi chepesi cha masimulizi. Katika Kiswahili, mfululizo wa vitenzi vya ‘waka-’ unaendeleza simulizi kwa kawaida bila kulazimisha ‘lakini,’ ambalo lingeongeza mkazo wa utofautishaji.
- source_word: φόβου αὐτοῦ
  choice: kumwogopa huyo
  rationale: Hii inawasilisha kwa lugha ya kawaida hofu ambayo sababu au mlengwa wake ni yule kiumbe wa mbinguni aliyetajwa katika muktadha uliotangulia. ‘Huyo’ hudumisha rejeo la kiwakilishi bila kuongeza jina lisilomo katika mstari.
- source_word: ἐσείσθησαν
  choice: wakatetemeka
  rationale: Kitenzi hiki kinaweza kumaanisha ‘walitikiswa’ au, kwa mwitikio wa mwili unaosababishwa na hofu, ‘walitetemeka.’ ‘Wakatetemeka’ ni wazi, hai, na ya kawaida katika Kiswahili.
- source_word: οἱ τηροῦντες
  choice: walinzi
  rationale: Kwa neno moja la kawaida, ‘walinzi’ linawasilisha maana ya wale waliokuwa wakilinda kaburi katika muktadha huu.
- source_word: ἐγενήθησαν
  choice: wakawa
  rationale: ‘Wakawa’ linaonyesha badiliko la hali, sawa na maana ya γίνομαι hapa, badala ya kueleza tu kwamba walikuwa katika hali hiyo.
- source_word: ὡς νεκροί
  choice: kama wafu
  rationale: '‘Kama’ hudumisha ulinganisho wa ὡς: hawasemwi kuwa walikufa kweli, bali walikuwa kama watu waliokufa. ‘Wafu’ ni usemi mfupi na wa kawaida unaolingana na wingi wa kiume katika muktadha.'
theological_decisions:
- issue: Rejeo la αὐτοῦ (‘huyo’)
  choice: Kiwakilishi kinamrejelea mjumbe wa mbinguni aliyeelezwa katika mstari uliotangulia.
  alternative: Kinaweza kueleweka kwa upana zaidi kuwa kinarejelea tukio lote la mbinguni.
  rationale: Rejeo la karibu zaidi katika muktadha ni yule mjumbe ambaye sura yake imeelezwa. Hata hivyo, tafsiri haitaji wazi ‘malaika,’ hivyo haifungi kabisa uwezekano mpana wa kimuktadha.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa ‘waka-’ huendeleza kwa ulaini mfululizo wa masimulizi, na ‘huyo’ hufanya rejeo la kiwakilishi lieleweke bila kuingiza ufafanuzi ndani ya matini.
