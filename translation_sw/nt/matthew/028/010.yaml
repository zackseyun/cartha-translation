id: MAT.28.10
reference: Matthew 28:10
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: τότε λέγει αὐταῖς ὁ Ἰησοῦς· Μὴ φοβεῖσθε· ὑπάγετε ἀπαγγείλατε τοῖς ἀδελφοῖς μου ἵνα ἀπέλθωσιν εἰς τὴν Γαλιλαίαν, κἀκεῖ με ὄψονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/010.yaml
  text: Then Jesus said to them[a], “Do not be afraid. Go, tell my brothers to go to Galilee[c][b], and there they will see me.”
translation:
  language: sw
  text: Ndipo Yesu akawaambia, “Msiogope. Nendeni mkawaambie ndugu zangu[a] waende Galilaya; huko wataniona.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hapa “ndugu zangu” inawarejelea wanafunzi wa Yesu. Neno la Kigiriki ni la kiume katika wingi.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Ndipo
  rationale: Inaonyesha hatua inayofuata katika simulizi kwa njia ya kawaida na yenye hadhi katika Kiswahili.
- source_word: λέγει αὐταῖς
  choice: Yesu akawaambia
  rationale: Wakati uliopo wa kihistoria wa Kigiriki umetafsiriwa kwa mtindo wa simulizi wa Kiswahili; kiambishi -wa- kinarejelea wanawake waliotajwa katika muktadha bila kuwaongeza kwa jina.
- source_word: Μὴ φοβεῖσθε
  choice: Msiogope
  rationale: Ni katazo la kawaida, wazi, na la moja kwa moja katika Kiswahili cha sasa.
- source_word: ὑπάγετε ἀπαγγείλατε
  choice: Nendeni mkawaambie
  rationale: Mfuatano huu wa vitenzi unaonyesha kwenda na kisha kufikisha ujumbe; ni wa asili zaidi kuliko kutumia neno rasmi kama ‘ripoti’.
- source_word: τοῖς ἀδελφοῖς μου
  choice: ndugu zangu
  rationale: Huhifadhi lugha ya kifamilia ya Yesu badala ya kuibadili katika matini kuwa ‘wanafunzi wangu’; tanbihi inaeleza rejeo la kimuktadha na umbo la kiume la Kigiriki.
- source_word: ἵνα ἀπέλθωσιν εἰς τὴν Γαλιλαίαν
  choice: waende Galilaya
  rationale: Hapa ἵνα pamoja na hali tegemezi inaeleza yaliyomo katika agizo lililofikishwa; muundo huu ni wa kawaida na wazi katika Kiswahili.
- source_word: κἀκεῖ με ὄψονται
  choice: huko wataniona
  rationale: ‘Huko’ hurejelea Galilaya, na ‘wataniona’ huhifadhi maana ya kawaida ya kuona bila kuibana kuwa ‘watakutana nami’.
theological_decisions:
- issue: Rejeo la ‘ndugu zangu’
  choice: Kubakiza ‘ndugu zangu’ katika matini na kueleza katika tanbihi kuwa muktadha unawarejelea wanafunzi wa Yesu.
  alternative: Kutafsiri moja kwa moja ‘wanafunzi wangu.’
  rationale: Neno la kifamilia lina uzito wa kiteolojia na wa kihusiano ambao ungepotea likibadilishwa kuwa ‘wanafunzi’; hata hivyo, muktadha unaonyesha kuwa wanafunzi ndio wanaokusudiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi, na chenye hadhi. Muundo ‘Nendeni mkawaambie … waende’ ni wa kawaida katika usemi wa Kiswahili na huhifadhi agizo lisilo la moja kwa moja la Kigiriki.
