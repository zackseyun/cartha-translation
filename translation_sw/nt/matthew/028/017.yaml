  text: And when they saw him[a], they worshiped him, but some doubted.
translation:
  language: sw
  text: Walipomwona, walimwabudu, lakini baadhi yao walikuwa na shaka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “walisita” au “waliyumba.” Neno la Kigiriki linaweza kumaanisha kutokuwa na uhakika badala ya kutokuamini kabisa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: Walipomwona
  rationale: Kitenzi kishirikishi cha wakati uliopita kimetafsiriwa kwa kishazi cha wakati ili kuonyesha kwa Kiswahili cha kawaida kwamba tendo la kumwona lilitangulia na kuhusiana moja kwa moja na matendo yaliyofuata.
- source_word: προσεκύνησαν
  choice: walimwabudu
  rationale: Katika muktadha wa Yesu aliyefufuka, neno hili lina uzito wa ibada, ingawa pia linaweza kumaanisha kusujudu au kutoa heshima kuu.
- source_word: οἱ δὲ
  choice: lakini baadhi yao
  rationale: Muundo huu unaonyesha utofauti ndani ya kundi lililotajwa; ‘baadhi yao’ huweka wazi kwa Kiswahili kwamba si lazima wote walioona walikuwa na shaka.
- source_word: ἐδίστασαν
  choice: waliona shaka
  rationale: Usemi huu unahifadhi maana ya kuwa na shaka huku tanbihi ikionyesha kwamba neno la Kigiriki linaweza pia kumaanisha kusita au kuyumba, si lazima kutokuamini kabisa.
theological_decisions:
- issue: Maana ya προσκυνέω kuelekezwa kwa Yesu aliyefufuka
  choice: walimwabudu
  alternative: walimsujudia; walimpa heshima kuu
  rationale: Muktadha wa baada ya ufufuo unaunga mkono maana ya ibada bila kufuta uwezekano wa tendo la kimwili la kusujudu lililomo katika neno hilo.
- issue: Kiwango cha shaka katika ἐδίστασαν
  choice: waliona shaka
  alternative: walisita; waliyumba
  rationale: Tafsiri kuu inaweka wazi hali ya shaka, lakini tanbihi inalinda utata halisi wa neno, ambalo linaweza kueleza kusita au kutokuwa na uhakika badala ya kutokuamini kabisa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Waliona shaka’ ni usemi unaoeleweka na unaodumisha tofauti kati ya ibada ya kundi na kusita kwa baadhi yao.
