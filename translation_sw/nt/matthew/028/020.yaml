  text: διδάσκοντες αὐτοὺς τηρεῖν πάντα ὅσα ἐνετειλάμην ὑμῖν· καὶ ἰδοὺ ἐγὼ μεθ’ ὑμῶν εἰμι πάσας τὰς ἡμέρας ἕως τῆς συντελείας τοῦ ⸀αἰῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/020.yaml
  text: teaching them to keep all that I commanded you. And behold[a], I am with you all the days, until the end of the age.
translation:
  language: sw
  text: mkiwafundisha kuyashika yote niliyowaamuru. Na tazama, mimi niko pamoja nanyi siku zote, mpaka mwisho wa enzi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mpaka enzi itakapofikia mwisho wake.” Kwa mapokeo, “mpaka mwisho wa dunia.” Kigiriki kinazungumzia enzi kufikia kikomo chake, si hasa mwisho wa ulimwengu wa kimwili.
    reason: alternative_reading
lexical_decisions:
- source_word: διδάσκοντες
  choice: mkiwafundisha
  rationale: Kitenzi endelevu kinaonyesha namna inayoendelea ya kuwafanya wanafunzi iliyotajwa katika mstari uliotangulia; “mkiwafundisha” ni ya kawaida na huhifadhi uhusiano huo.
- source_word: τηρεῖν
  choice: kushika
  rationale: Hapa neno lina maana ya kuyatunza na kuyatii maagizo. “Kushika” huhifadhi upana huo bila kuifanya maana iwe kutii kwa nje tu.
- source_word: πάντα ὅσα
  choice: yote
  rationale: “Yote” ni usemi mfupi na wa asili unaohifadhi upeo kamili wa mambo yaliyoamriwa.
- source_word: ἐνετειλάμην
  choice: niliyowaamuru
  rationale: Huhifadhi mamlaka iliyo katika kitenzi cha Kigiriki na kuonyesha wazi kwamba Yesu ndiye aliyetoa maagizo hayo.
- source_word: ἰδοὺ
  choice: tazama
  rationale: Ni alama ya usemi inayovuta fikira kwa mkazo na ina sauti yenye heshima inayofaa muktadha.
- source_word: μεθ’ ὑμῶν εἰμι
  choice: mimi niko pamoja nanyi
  rationale: Hueleza moja kwa moja uwepo wa Yesu pamoja na wanafunzi; kiwakilishi “mimi” huhifadhi mkazo wa ἐγώ.
- source_word: πάσας τὰς ἡμέρας
  choice: siku zote
  rationale: Huhifadhi wazo halisi la ‘siku zote’ pamoja na maana ya uwepo wa kudumu siku kwa siku.
- source_word: συντελείας
  choice: itakapofikia mwisho wake
  rationale: Usemi huu wa asili unaonyesha kufikishwa kwa enzi kwenye kikomo au utimilifu wake, si kusitishwa kwa ghafula tu.
- source_word: αἰῶνος
  choice: enzi hii
  rationale: “Enzi” huwakilisha kipindi au zama, si ulimwengu wa kimwili. “Hii” huifanya rejea kwa enzi ya sasa iwe wazi katika Kiswahili.
theological_decisions:
- issue: Kirai cha wakati ἕως τῆς συντελείας τοῦ αἰῶνος
  choice: mpaka enzi hii itakapofikia mwisho wake
  alternative: mpaka mwisho wa enzi hii; kwa mapokeo, mpaka mwisho wa dunia
  rationale: Tafsiri hii huhifadhi maana ya enzi kufikia kikomo au utimilifu wake na haidai kwamba neno la Kigiriki linamaanisha hasa kuangamizwa kwa ulimwengu wa kimwili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Tazama” huhifadhi mkazo wa kifasihi bila kutumia msamiati wa kizamani; “enzi hii itakapofikia mwisho wake” ni wazi kwa msomaji wa kawaida huku ikihifadhi maana ya kieskatolojia.
