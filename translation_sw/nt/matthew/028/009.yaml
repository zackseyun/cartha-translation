base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/009.yaml
  text: And behold[a], Jesus met them, saying, “Greetings!” And they came up, took hold of his feet[b], and worshiped him.
translation:
  language: sw
  text: Na tazama, Yesu akakutana nao na kusema, “Salamu![a]” Nao wakamkaribia, wakashika miguu yake, wakamwabudu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Furahini!” Neno la Kigiriki χαίρετε kwa maana halisi ni amri ya wingi, lakini katika muktadha huu linatumika kama salamu.
    reason: lexical_alternative
  - marker: b
    text: Au “kumsujudia” au “kumtolea heshima.” Neno la Kigiriki προσεκύνησαν linaweza kumaanisha kusujudu au kutoa heshima; hapa huenda lina maana nzito zaidi ya kuabudu kwa sababu ya muktadha wa ufufuo.
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: tazama
  rationale: Inahifadhi dhima ya neno la kuvuta usikivu na uchangamfu wa simulizi bila kuliondoa.
- source_word: ὑπήντησεν
  choice: akakutana nao
  rationale: Hutoa maana ya Yesu kukutana na wale wanawake njiani kwa Kiswahili cha kawaida, bila kuongeza mwelekeo usioelezwa wazi na kitenzi.
- source_word: Χαίρετε
  choice: Salamu!
  rationale: Ingawa kimaumbo ni amri ya wingi inayoweza kumaanisha “Furahini,” hapa linatumika kama salamu; “Salamu!” huhifadhi matumizi hayo ya kijamii.
- source_word: προσελθοῦσαι
  choice: wakamkaribia
  rationale: Inaonyesha mwendo wao kuelekea kwa Yesu kabla ya matendo yanayofuata na ni usemi wa kawaida wa Kiswahili.
- source_word: ἐκράτησαν αὐτοῦ τοὺς πόδας
  choice: wakashika miguu yake
  rationale: Inahifadhi mguso halisi na maana ya kushika kwa uthabiti bila kutumia neno lenye ukali usio wa lazima kama “kukamata.”
- source_word: προσεκύνησαν αὐτῷ
  choice: kumwabudu
  rationale: Katika muktadha wa ufufuo, neno hili linaweza kuwa na uzito wa ibada; tafsiri hii inafaa huku uwezekano wa kusujudu au kutoa heshima ukihifadhiwa katika tanbihi.
theological_decisions:
- issue: Maana ya προσκυνέω ikielekezwa kwa Yesu aliyefufuka
  choice: kumwabudu
  alternative: kumsujudia / kumpa heshima
  rationale: Muktadha wa baada ya ufufuo na namna Mathayo anavyomwasilisha Yesu vinaunga mkono maana ya ibada. Hata hivyo, kwa kuwa kitenzi chenyewe pia kinaweza kueleza kusujudu au kutoa heshima, maana hiyo mbadala haijafichwa bali imeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo wa vitenzi vinavyofuatana unadumisha kasi ya simulizi. Viashiria vya tanbihi vimewekwa moja kwa moja baada ya maneno vinayoyafafanua.
