  text: Πορευομένων δὲ αὐτῶν ἰδού τινες τῆς κουστωδίας ἐλθόντες εἰς τὴν πόλιν ἀπήγγειλαν τοῖς ἀρχιερεῦσιν ἅπαντα τὰ γενόμενα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/011.yaml
  text: While they were going[a], behold[b], some of the guard came into the city and reported to the chief priests everything that had happened.
translation:
  language: sw
  text: Walipokuwa wakienda[a], tazama[b], baadhi ya walinzi wakaingia mjini, wakawapa makuhani wakuu habari za yote yaliyotokea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Walipokuwa njiani.” Kigiriki kinatumia muundo unaoweka wakati wa tukio linalofuata.
    reason: lexical_alternative
  - marker: b
    text: Neno “Tazama” linatafsiri neno la Kigiriki ἰδού, linalovuta uangalifu kwenye tukio jipya la ghafla au muhimu katika simulizi.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πορευομένων δὲ αὐτῶν
  choice: Walipokuwa wakienda
  rationale: Muundo wa genitivi huru unaweka wakati wa tukio linalofuata. Tafsiri hii ni ya kawaida kwa Kiswahili na haiongezi mahali walipokuwa wakienda.
- source_word: ἰδού
  choice: tazama
  rationale: Neno hili linahifadhi ishara ya kuvuta uangalifu na kuonyesha tukio jipya la ghafla au muhimu katika simulizi.
- source_word: τινες τῆς κουστωδίας
  choice: baadhi ya walinzi
  rationale: κουστωδία ni kikosi cha walinzi kilichowekwa kaburini; usemi huu ni wazi na wa kawaida katika Kiswahili.
- source_word: ἐλθόντες εἰς τὴν πόλιν
  choice: waliingia mjini
  rationale: Kitenzi kishirikishi cha aoristi kinatangulia tendo kuu. Kiswahili cha asili huwasilisha tendo hili kama tendo lililofuatana, bila kulazimisha mtazamo wa ‘kuja’ au ‘kwenda’ ambao muktadha wa Kiswahili hauhitaji.
- source_word: ἀπήγγειλαν
  choice: kuwaeleza
  rationale: Kitenzi kina maana ya kupeleka taarifa. ‘Kuwaeleza’ kinaonyesha walengwa wa taarifa kwa lugha ya kawaida na yenye heshima.
- source_word: τοῖς ἀρχιερεῦσιν
  choice: makuhani wakuu
  rationale: Hili ndilo neno sanifu la Kiswahili kwa viongozi hawa wa ukuhani katika mazingira ya Kiyahudi ya kipindi hicho.
- source_word: ἅπαντα τὰ γενόμενα
  choice: kila jambo lililokuwa limetokea
  rationale: ‘Kila jambo’ linahifadhi msisitizo wa ujumla wa ἅπαντα, na ‘lililokuwa limetokea’ linaonyesha kuwa matukio hayo yalitangulia taarifa.
