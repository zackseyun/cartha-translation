translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Tazama’ limehifadhiwa kama kiashiria cha kisimulizi; ‘walinzi’ huepuka usemi mzito wa ‘kikosi cha ulinzi.’
