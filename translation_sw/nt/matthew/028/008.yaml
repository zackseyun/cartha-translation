  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ⸀ἀπελθοῦσαι ταχὺ ἀπὸ τοῦ μνημείου μετὰ φόβου καὶ χαρᾶς μεγάλης ἔδραμον ἀπαγγεῖλαι τοῖς μαθηταῖς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/008.yaml
  text: And leaving the tomb quickly[a], with fear and great joy, they ran to report to his disciples.
translation:
  language: sw
  text: Nao wakaondoka kaburini upesi, wakiwa na hofu[a] na furaha kubwa, wakakimbia kwenda kuwaambia wanafunzi wake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kicho.” Neno la Kigiriki lililotafsiriwa “hofu” linaweza pia kumaanisha kicho cha heshima katika muktadha huu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπελθοῦσαι
  choice: wakaondoka
  rationale: Kitenzi hiki cha wakati uliopita kinawaeleza wanawake wakiondoka mahali pale. “Wakaondoka” ni Kiswahili cha kawaida na kinaunganisha tendo hili kwa ufasaha na matendo yanayofuata.
- source_word: ταχὺ
  choice: upesi
  rationale: Neno hili linaonyesha kwamba waliondoka bila kukawia. “Upesi” ni la asili na lenye hadhi katika simulizi.
- source_word: ἀπὸ τοῦ μνημείου
  choice: kaburini
  rationale: Katika muktadha huu μνημεῖον ni mahali Yesu alipozikwa. “Kaburini” linaonyesha kwa kawaida mahali walikotoka bila kuongeza maelezo yasiyomo katika Kigiriki.
- source_word: μετὰ φόβου καὶ χαρᾶς μεγάλης
  choice: wakiwa na hofu na furaha kubwa
  rationale: Muundo huu unaonyesha hali mbili zilizowaandama kwa pamoja. Tafsiri inadumisha mvutano wa φόβος na χαρὰ μεγάλη badala ya kuufanya φόβος kuwa mshangao wa heshima pekee.
- source_word: ἔδραμον
  choice: wakakimbia
  rationale: Maana ya moja kwa moja ya τρέχω ni kukimbia. “Wakakimbia” inadumisha mwendo halisi na uharaka wa tukio.
- source_word: ἀπαγγεῖλαι
  choice: kwenda kuwaambia
  rationale: 'Kitenzi-jina hiki kinaonyesha kusudi la kukimbia kwao: kuwapelekea wanafunzi taarifa. “Kwenda kuwaambia” ni cha kawaida katika Kiswahili na hakiongezi kiwakilishi cha kitu ambacho hakijaelezwa moja kwa moja katika Kigiriki.'
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: wanafunzi wake
  rationale: “Wanafunzi” ndilo neno linalotambulika kwa μαθηταί katika simulizi za Injili, na “wake” linamrejelea Yesu kulingana na muktadha.
theological_decisions:
- issue: Mvutano wa hisia katika mwitikio wa wanawake
  choice: wakiwa na hofu na furaha kubwa
  alternative: wakiwa na kicho na furaha kubwa
  rationale: φόβος inaweza kumaanisha hofu au kicho katika muktadha huu. Maandishi yanaweka hisia hiyo pamoja na furaha kubwa; kwa hiyo “hofu” inadumisha mvutano huo, huku tanbihi ikionyesha maana nyingine inayowezekana bila kuamua kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio wa sentensi ni wa kawaida katika simulizi; “Nao” huunganisha mstari huu na tukio lililotangulia, na mfululizo wa “waka-” hudumisha mwendo wa matendo.
