base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/003.yaml
  text: His appearance was like lightning[a], and his clothing white as snow.
translation:
  language: sw
  text: Mwonekano wake ulikuwa kama umeme[a], na mavazi yake yalikuwa meupe kama theluji.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sura” au “umbo” badala ya “mwonekano.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: haijatafsiriwa moja kwa moja
  rationale: Ni kiunganishi hafifu cha masimulizi; mfuatano wa sentensi ni wa asili kwa Kiswahili bila kukiongeza.
- source_word: εἰδέα
  choice: mwonekano
  rationale: Neno hili linamaanisha sura au jinsi kitu kinavyoonekana kwa nje; “mwonekano” ni la kawaida na sahihi katika Kiswahili cha sasa.
- source_word: ὡς ἀστραπή
  choice: kama umeme
  rationale: Linahifadhi tashbihi ya Kigiriki na kueleza mng'ao wa mwonekano bila kuongeza maelezo yasiyokuwamo.
- source_word: ἔνδυμα
  choice: mavazi
  rationale: Ni neno la jumla kwa kile kinachovaliwa, bila kubainisha vazi la aina fulani.
- source_word: λευκόν
  choice: meupe
  rationale: Linatoa maana ya moja kwa moja ya rangi nyeupe bila kuongeza kiwango cha mng'ao kisichotajwa wazi.
- source_word: ὡς χιών
  choice: kama theluji
  rationale: Linahifadhi tashbihi ya pili, inayolinganisha weupe wa mavazi na theluji.
theological_decisions:
- issue: Kirejelewa cha αὐτοῦ
  choice: Viwakilishi vinamrejelea malaika aliyetajwa katika muktadha wa karibu.
  alternative: Msomaji anaweza kudhani vinamrejelea Yesu kwa sababu ya muktadha mpana wa ufufuo.
  rationale: Kirejelewa cha karibu katika mstari wa 2 ni malaika wa Bwana. Tafsiri inadumisha kiwakilishi badala ya kuingiza nomino isiyokuwamo katika mstari huu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya kawaida, ya sasa na yenye heshima. Muundo wenye “yalikuwa” katika sehemu ya pili umetumiwa kwa uwazi na mtiririko wa kawaida.
