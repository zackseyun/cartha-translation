  text: οἱ δὲ λαβόντες ⸀τὰ ἀργύρια ἐποίησαν ὡς ἐδιδάχθησαν. Καὶ διεφημίσθη ὁ λόγος οὗτος παρὰ Ἰουδαίοις μέχρι τῆς σήμερον ⸀ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/015.yaml
  text: So they took the silver and did as they had been instructed[a]. And this story has been spread among the Jews to this day.
translation:
  language: sw
  text: Basi wakazipokea zile fedha, wakafanya kama walivyoagizwa. Habari hii[a] ikaenea miongoni mwa Wayahudi mpaka leo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Taarifa hii” au “simulizi hili.” Neno la Kigiriki λόγος linaweza kumaanisha “neno,” “taarifa,” “simulizi,” au “habari,” kutegemea muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβόντες
  choice: wakazipokea
  rationale: Katika muktadha uliotangulia, walinzi walipewa fedha; kwa hiyo ‘wakazipokea’ huonyesha kwa kawaida tendo la kupokea walichopewa, bila kuondoa mfuatano wa matendo wa kishirikishi cha wakati uliopita.
- source_word: τὰ ἀργύρια
  choice: zile fedha
  rationale: ἀργύρια inaweza kumaanisha fedha kama metali au pesa. ‘Zile fedha’ ni Kiswahili cha kawaida kinachorejelea malipo yaliyotajwa katika mstari uliotangulia bila kuongeza kwamba yalikuwa sarafu.
- source_word: ἐποίησαν
  choice: kufanya
  rationale: ποιέω hapa ni kitenzi cha kawaida cha kutenda au kutekeleza; ‘kufanya’ hudumisha uhusiano wa moja kwa moja na maagizo waliyopokea.
- source_word: ὡς ἐδιδάχθησαν
  choice: kama walivyoagizwa
  rationale: Ingawa διδάσκω kwa msingi ni kufundisha, katika muktadha huu waliambiwa watamke nini; ‘walivyoagizwa’ huwasilisha maana hiyo ya maelekezo kwa Kiswahili cha kawaida.
- source_word: διεφημίσθη
  choice: ikaenea
  rationale: Kitenzi hiki huonyesha habari kusambazwa kwa mapana. ‘Ikaenea’ ni usemi wa asili na huonyesha kuanza na kuendelea kwa usambazaji wake.
- source_word: ὁ λόγος οὗτος
  choice: Habari hii
  rationale: λόγος hapa ni taarifa au simulizi lililosambazwa, si ‘neno’ tu. ‘Habari hii’ ni pana vya kutosha kuhifadhi uwezekano wa taarifa au simulizi.
- source_word: παρὰ Ἰουδαίοις
  choice: miongoni mwa Wayahudi
  rationale: παρά pamoja na dativu hapa humaanisha ndani ya jamii au miongoni mwa watu; tafsiri hii ni ya moja kwa moja na haiongezi dai nje ya mazingira ya simulizi.
- source_word: μέχρι τῆς σήμερον ἡμέρας
  choice: mpaka leo
  rationale: Huu ni msemo wa kawaida unaoonyesha kwamba habari hiyo iliendelea kujulikana hadi wakati wa mwandishi.
theological_decisions:
- issue: Kutafsiri Ἰουδαίοις katika simulizi linaloweza kueleweka vibaya kama hukumu dhidi ya Wayahudi wote
  choice: miongoni mwa Wayahudi
  alternative: miongoni mwa watu wa Uyahudi; miongoni mwa Wayudea
  rationale: ‘Miongoni mwa Wayahudi’ ndilo chaguo la kawaida la kileksika na hapa linaeleza eneo la kijamii ambamo habari ilisambaa. Halipanui kauli hiyo kuwa hukumu ya kitheolojia dhidi ya Wayahudi wote; ‘Wayudea’ lingeweka mkazo wa kieneo ambao si lazima katika mstari huu.
- issue: Asili ya ὁ λόγος οὗτος kama taarifa inayosambazwa
  choice: Habari hii
  alternative: Taarifa hii; simulizi hili
  rationale: ‘Habari’ huhifadhi upana wa λόγος na haikati shauri ikiwa mwandishi anaiita taarifa, simulizi, au usemi. Maelezo ya chini yanataja machaguo halali.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Basi’ na viambishi vya mfululizo ‘waka-/ika-’ vinaendeleza mtiririko wa simulizi. Alama ya tanbihi imewekwa baada ya ‘leo’ kwa sababu inaeleza kirai ‘Habari hii.’
