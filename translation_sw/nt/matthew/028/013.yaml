  text: saying[a], “Say[b], ‘His disciples came by night and stole him while we were sleeping.’”
translation:
  language: sw
  text: wakisema, “Semeni, ‘Wanafunzi wake walikuja usiku[a] wakamwiba[b] tulipokuwa tumelala.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakati wa usiku.” Neno la Kigiriki νυκτός linaonyesha wakati walipokuja.
    reason: lexical_alternative
  - marker: b
    text: Kigiriki kinasema “yeye,” si “mwili wake.” Katika muktadha huu, kiambishi cha yambwa “-mw-” katika “wakamwiba” kinamrejelea Yesu.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: wakisema
  rationale: Kitenzi-shirikishi cha wakati wa sasa kinaanzisha maneno ya agizo; “wakisema” ni simulizi la kawaida na huhifadhi uhusiano wake na muktadha uliotangulia.
- source_word: Εἴπατε
  choice: Semeni
  rationale: Ni amri ya nafsi ya pili wingi; “Semeni” huhifadhi agizo la moja kwa moja bila kuongeza maneno.
- source_word: ὅτι
  choice: alama za nukuu
  rationale: Neno hili linaanzisha yaliyomo katika taarifa; katika Kiswahili cha kawaida kazi yake inaonyeshwa kwa nukuu ya moja kwa moja.
- source_word: Οἱ μαθηταὶ αὐτοῦ
  choice: Wanafunzi wake
  rationale: Huu ni muundo wa umilikaji unaomhusu Yesu; Kiswahili hutumia kwa kawaida “wanafunzi wake.”
- source_word: νυκτὸς
  choice: usiku
  rationale: Hii ni hali ya wakati iliyo katika umbo la genitivi; “usiku” ni tafsiri fupi na ya kawaida. “Wakati wa usiku” pia inawezekana.
- source_word: ἐλθόντες
  choice: walikuja
  rationale: Kitenzi-shirikishi kinaonyesha tendo lililotangulia wizi; Kiswahili cha kawaida hulitoa kama kitenzi kamili katika mfuatano wa matendo.
- source_word: ἔκλεψαν
  choice: wakamwiba
  rationale: Huhifadhi maana ya kuiba, huku kiambishi “-mw-” kikirejelea mtu aliyetajwa, yaani Yesu.
- source_word: αὐτὸν
  choice: -mw- katika “wakamwiba”
  rationale: Kiwakilishi cha Kigiriki kinamaanisha “yeye,” si “mwili wake”; kiambishi cha yambwa cha Kiswahili huhifadhi rejeo hilo la mtu.
- source_word: ἡμῶν κοιμωμένων
  choice: tulipokuwa tumelala
  rationale: Muundo wa genitivi huru unaonyesha hali iliyokuwa ikiendelea wakati wa tendo; tafsiri hii ni wazi na ya asili katika Kiswahili.
theological_decisions:
- issue: Kirejelewa cha αὐτόν katika taarifa iliyotungwa
  choice: Kuhifadhi rejeo la mtu kwa “wakamwiba,” si kulipanua kuwa “waliuiba mwili wake.”
  alternative: waliuiba mwili wake
  rationale: Maandishi ya Kigiriki yanatumia kiwakilishi cha mtu, αὐτόν. Kutaja “mwili wake” kungeongeza ufafanuzi usio katika chanzo; muktadha unamtambulisha anayerejelewa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa simulizi ni wa kawaida na unaeleweka kwa urahisi; nukuu zilizopachikwa zinahifadhi agizo la kusema taarifa iliyotungwa.
