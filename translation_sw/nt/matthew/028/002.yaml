  text: καὶ ἰδοὺ σεισμὸς ἐγένετο μέγας· ἄγγελος γὰρ κυρίου καταβὰς ἐξ οὐρανοῦ ⸀καὶ προσελθὼν ἀπεκύλισε τὸν ⸀λίθον καὶ ἐκάθητο ἐπάνω αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/002.yaml
  text: And behold, there was a great earthquake, for an angel of the Lord had come down from heaven and came up and rolled away the stone and was sitting on it.
translation:
  language: sw
  text: Na tazama, kukawa na tetemeko kubwa la ardhi; kwa maana malaika wa Bwana alishuka kutoka mbinguni, akakaribia, akalivingirisha jiwe, akawa ameketi juu yake.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: tazama
  rationale: Kihisishi cha simulizi kinachovuta usikivu kwa tukio la kushangaza; ‘tazama’ ni cha kawaida, kifupi, na chenye hadhi katika Kiswahili cha Biblia.
- source_word: σεισμὸς ... μέγας
  choice: tetemeko kubwa la ardhi
  rationale: Hutoa wazi maana ya σεισμός katika muktadha huu, huku ikihifadhi mkazo wa μέγας.
- source_word: ἄγγελος ... κυρίου
  choice: malaika wa Bwana
  rationale: Tafsiri ya moja kwa moja na iliyozoeleka ya kirai hicho, bila kuamua zaidi ikiwa κύριος hapa ni jina la Mungu au cheo.
- source_word: καταβὰς ἐξ οὐρανοῦ
  choice: alishuka kutoka mbinguni
  rationale: Huwasilisha kwa kawaida tendo la kushuka kutoka mbinguni; umbo la wakati uliopita linaendana na γάρ inayotoa sababu ya tetemeko.
- source_word: προσελθὼν
  choice: akaja
  rationale: Katika mfuatano huu neno linaonyesha kusogea au kuja karibu na jiwe; ‘akaja’ ni la asili katika Kiswahili na haliongezi kitu kisichotajwa wazi.
- source_word: ἀπεκύλισε
  choice: akalivingirisha
  rationale: Huhifadhi taswira ya kuliondoa jiwe kwa kuliviringisha.
- source_word: ἐκάθητο ἐπάνω αὐτοῦ
  choice: akalikalia
  rationale: Kiswahili cha kawaida cha kusema kwamba aliketi juu ya jiwe; kiambishi ‘-li-’ kinaweka rejeo kwa jiwe bila utata.
theological_decisions:
- issue: Uhusiano kati ya tetemeko na kushuka kwa malaika
  choice: kwa maana malaika wa Bwana alishuka
  alternative: kisha malaika wa Bwana akashuka
  rationale: γάρ inaonyesha sababu au maelezo, si mfuatano wa matukio tu; hivyo ‘kwa maana’ huhifadhi uhusiano huo.
- issue: Wakati wa kushuka kwa malaika
  choice: alishuka ... akaja, akalivingirisha ... akalikalia
  alternative: alikuwa ameshuka ... akaja, akalivingirisha ... alikuwa ameketi
  rationale: Kigiriki kina aoristi kwa kushuka, kuja, na kuviringisha, kisha hali inayoendelea kwa kuketi. Kiswahili hiki kinawasilisha mfuatano kwa urahisi bila kulazimisha pluperfect ya Kiingereza, huku ‘akalikalia’ ikionyesha kuketi juu ya jiwe katika tukio hilo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa ‘Na tazama’ umehifadhi ishara ya ghafla ya simulizi; vitenzi vya mfululizo vinatoa usimulizi wa kawaida na unaoeleweka.
