  text: Οἱ δὲ ἕνδεκα μαθηταὶ ἐπορεύθησαν εἰς τὴν Γαλιλαίαν εἰς τὸ ὄρος οὗ ἐτάξατο αὐτοῖς ὁ Ἰησοῦς,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/016.yaml
  text: The eleven disciples went to Galilee[a], to the mountain where Jesus had directed them,
translation:
  language: sw
  text: Wanafunzi kumi na mmoja wakaenda Galilaya, kwenye mlima ambao Yesu alikuwa amewaelekeza waende.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alikuwa amewapangia.” Kitenzi cha Kigiriki kinaweza kumaanisha kupanga, kuteua, au kuelekeza.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: (hakutafsiriwa kwa neno maalumu)
  rationale: Ni kiunganishi hafifu cha kuendeleza simulizi. Mtiririko wa Kiswahili unaonekana kwa muundo wa sentensi bila kulazimisha tofauti yenye nguvu kama ‘lakini’.
- source_word: ἕνδεκα μαθηταὶ
  choice: wale wanafunzi kumi na mmoja
  rationale: ‘Wanafunzi’ ni istilahi ya kawaida ya Injili kwa wafuasi wanaojifunza kwa Yesu; ‘kumi na mmoja’ linahifadhi idadi mahsusi baada ya Yuda kutokuwapo.
- source_word: ἐπορεύθησαν
  choice: wakaenda
  rationale: Kitenzi hiki kinaeleza kwenda au kusafiri. ‘Wakaenda’ ni cha kawaida katika simulizi na kinaendeleza mfululizo wa matukio bila kuongeza uzito wa ‘wakasafiri’.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: Galilaya
  rationale: Katika Kiswahili, mwendo kuelekea eneo unaeleweka baada ya ‘wakaenda’ bila kulazimika kuongeza kihusishi.
- source_word: εἰς τὸ ὄρος
  choice: kwenye mlima
  rationale: ὄρος hapa ni mlima maalumu unaofafanuliwa na kishazi kinachofuata; ‘mlima’ linahifadhi maana ya msingi na mwangwi wa matumizi ya Mathayo.
- source_word: οὗ
  choice: ambao
  rationale: Kiwakilishi hiki kinarejelea mahali, yaani mlima; muundo ‘mlima ambao’ ni wa kawaida kwa kuwa kishazi kinachofuata kinaeleza walikoelekezwa waende.
- source_word: ἐτάξατο
  choice: alikuwa amewaelekeza waende
  rationale: τάσσω inaweza kumaanisha kupanga, kuteua, kuagiza, au kuelekeza. Katika muktadha huu Yesu alikuwa ametaja mahali pa kukutana. ‘Amewaelekeza waende’ ni Kiswahili cha kawaida na hakiongezi wazo la uteuzi rasmi.
- source_word: αὐτοῖς
  choice: wa- katika ‘amewaelekeza’
  rationale: Kiwakilishi cha wingi kinawakilishwa kiasili na kiambishi cha yambwa ‘-wa-’.
- source_word: ὁ Ἰησοῦς
  choice: Yesu
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
theological_decisions:
- issue: Namna Yesu alivyobainisha mahali pa kukutana
  choice: alikuwa amewaelekeza waende
  alternative: alikuwa amewateulia
  rationale: Kauli iliyochaguliwa inaonyesha kwamba Yesu alikuwa amebainisha mahali hapo mapema, bila kuingiza dhana ya uteuzi rasmi au muundo wa mamlaka ambao muktadha haulazimishi. Tanbihi inahifadhi uwezekano mwingine wa kitenzi cha Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa ‘wakaenda’ unafaa simulizi, na tanbihi inalinda upana wa maana ya ἐτάξατο.
