  text: καὶ προσελθὼν ὁ Ἰησοῦς ἐλάλησεν αὐτοῖς λέγων· Ἐδόθη μοι πᾶσα ἐξουσία ἐν οὐρανῷ καὶ ἐπὶ ⸀τῆς γῆς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/018.yaml
  text: And Jesus came near and spoke to them[a], saying[b], “All authority in heaven and on earth has been given to me.”
translation:
  language: sw
  text: Yesu akawakaribia, akasema nao, akawaambia, “Nimepewa[a] mamlaka[b] yote mbinguni na duniani.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Nilipewa.” Wakati uliopita wa Kigiriki unaweza kutafsiriwa kwa namna hii iliyo ya moja kwa moja zaidi; “Nimepewa” katika matini kuu huonyesha tendo lililotimia ambalo matokeo yake yanaendelea hadi sasa.
    reason: lexical_alternative
  - marker: b
    text: Au “nguvu.” Hata hivyo, neno la Kigiriki ἐξουσία humaanisha hasa mamlaka, haki, au utawala halali, wala si nguvu tupu.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν
  choice: akawakaribia
  rationale: Kitenzi hiki kinaonyesha Yesu akisogea karibu na wanafunzi kabla ya kusema; “akawakaribia” ni cha kawaida na huhifadhi maana ya mwendo kuelekea kwao.
- source_word: ἐλάλησεν αὐτοῖς λέγων
  choice: akazungumza nao akisema
  rationale: Tafsiri hii inahifadhi tendo la kuzungumza nao na kirai kinachoanzisha maneno ya moja kwa moja, bila kubadili αὐτοῖς kuwa tu kiambishi cha kauli.
- source_word: Ἐδόθη μοι
  choice: Nimepewa
  rationale: 'Hali tendwa imehifadhiwa. Wakati timilifu wa Kiswahili unaonyesha tendo lililokamilika ambalo matokeo yake yanaendelea kuwapo: sasa Yesu anayo mamlaka hiyo.'
- source_word: πᾶσα ἐξουσία
  choice: mamlaka yote
  rationale: Kwa nomino dhahania ya umoja, πᾶσα inaonyesha ujumla. “Mamlaka” hueleza haki au uwezo halali wa kutawala kuliko nguvu za kutenda jambo tu.
- source_word: ἐν οὐρανῷ καὶ ἐπὶ τῆς γῆς
  choice: mbinguni na duniani
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaohifadhi maeneo yote mawili na wazo la mamlaka ya ulimwengu mzima.
theological_decisions:
- issue: Namna Yesu alivyo na mamlaka yote
  choice: Nimepewa mamlaka yote mbinguni na duniani
  alternative: Nilipewa mamlaka yote mbinguni na duniani
  rationale: Hali tendwa ya Kigiriki imehifadhiwa badala ya kuifanya kauli ya umiliki wa asili usiotaja kupewa. “Nimepewa” huonyesha tendo lililotimia pamoja na matokeo yake ya sasa, bila kutaja wazi mtoaji ambaye kifungu hiki hakimwambui kwa jina.
- issue: Maana ya ἐξουσία
  choice: mamlaka
  alternative: nguvu
  rationale: Neno hili linasisitiza haki na uhalali wa kutawala, si uwezo au nguvu tupu. Hivyo “mamlaka” huhifadhi vizuri zaidi madai ya utawala wa Yesu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo “akazungumza nao akisema” ni rasmi kidogo, lakini umechaguliwa ili kuhifadhi vitenzi vyote viwili vya Kigiriki na utangulizi wa maneno ya moja kwa moja.
