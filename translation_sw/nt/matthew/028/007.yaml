source:
  edition: SBLGNT
  text: καὶ ταχὺ πορευθεῖσαι εἴπατε τοῖς μαθηταῖς αὐτοῦ ὅτι Ἠγέρθη ἀπὸ τῶν νεκρῶν, καὶ ἰδοὺ προάγει ὑμᾶς εἰς τὴν Γαλιλαίαν, ἐκεῖ αὐτὸν ὄψεσθε· ἰδοὺ εἶπον ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/007.yaml
  text: And go quickly and tell his disciples, ‘He has been raised from the dead, and look, he is going ahead of you into Galilee. There you will see him.’ Look, I have told you.
translation:
  language: sw
  text: Nendeni upesi mkawaambie wanafunzi wake, ‘Amefufuliwa kutoka kwa wafu, na tazameni, anawatangulia kwenda Galilaya. Mtamwona huko.’ Tazameni, nimewaambia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταχὺ πορευθεῖσαι
  choice: Nendeni upesi
  rationale: Kitenzi cha Kigiriki ni amri kwa wanawake wengi; Kiswahili hiki ni cha asili na kinahifadhi dharura ya agizo.
- source_word: Ἠγέρθη ἀπὸ τῶν νεκρῶν
  choice: Amefufuliwa kutoka kwa wafu
  rationale: Muundo wa kutendwa unahifadhiwa bila kumtaja wazi mtendaji ambaye maandishi ya Kigiriki hayamtaji.
- source_word: ἰδοὺ
  choice: tazameni
  rationale: Neno hili la kuvuta fikira limetafsiriwa katika sehemu zote mbili ili kuhifadhi msisitizo wa kurudiwa.
- source_word: προάγει ὑμᾶς
  choice: anawatangulia kwenda
  rationale: Hueleza kwamba Yesu anakwenda mbele yao, si tu kwamba atafika mapema.
- source_word: ἐκεῖ αὐτὸν ὄψεσθε
  choice: Mtamwona huko
  rationale: Mpangilio huu ni wa kawaida katika Kiswahili na unahifadhi ahadi ya kumwona huko Galilaya.
theological_decisions:
- issue: Mtendaji wa ufufuo katika Ἠγέρθη
  choice: Amefufuliwa
  alternative: Amefufuka
  rationale: Muundo wa kutendwa wa Kigiriki umehifadhiwa, hivyo tafsiri haiongezi wala kuondoa dokezo la mtendaji wa kimungu.
- issue: Maana ya προάγει
  choice: anawatangulia kwenda Galilaya
  alternative: anakwenda mbele yenu hadi Galilaya
  rationale: Chaguo hili linadumisha wazo la Yesu kuwa mbele yao bila kuamua zaidi ikiwa mkazo uko katika kuongoza au kufika mapema.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Amri ya wingi kwa wanawake inaonyeshwa kwa umbo la kawaida lisilo na jinsia katika Kiswahili. Marudio ya ‘tazameni’ yanahifadhi msisitizo wa ἰδοὺ mara mbili.
