  text: ἀποκριθεὶς δὲ ὁ ἄγγελος εἶπεν ταῖς γυναιξίν· Μὴ φοβεῖσθε ὑμεῖς, οἶδα γὰρ ὅτι Ἰησοῦν τὸν ἐσταυρωμένον ζητεῖτε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/005.yaml
  text: But the angel answered and said to the women[a], “Do not be afraid[b]; for I know that you are seeking Jesus who has been crucified.”
translation:
  language: sw
  text: Lakini malaika akajibu na kuwaambia wale wanawake, “Ninyi msiogope[a], kwa maana ninajua kwamba mnamtafuta Yesu aliyesulubiwa[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kigiriki kinataja wazi “ninyi” kwa msisitizo: faraja hii inaelekezwa hasa kwa wanawake hao.'
    reason: lexical_alternative
  - marker: b
    text: Au, “Yesu, yule aliyesulubiwa.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ
  choice: Lakini ... akajibu
  rationale: δὲ inaleta mpito wenye utofautishaji mdogo, huku ἀποκριθεὶς ikihifadhiwa kwa ‘akajibu’ kama sehemu ya mtindo wa simulizi unaotanguliza maneno yanayofuata.
- source_word: ὁ ἄγγελος
  choice: malaika
  rationale: Katika muktadha wa ufufuo, neno hili linamtaja kiumbe wa kimalaika, si mjumbe wa kawaida wa kibinadamu.
- source_word: εἶπεν ταῖς γυναιξίν
  choice: akawaambia wale wanawake
  rationale: ‘Akawaambia’ ni utangulizi wa kawaida na wa asili wa usemi katika Kiswahili; ‘wale wanawake’ huwatambulisha wanawake waliokwisha tajwa katika simulizi.
- source_word: Μὴ φοβεῖσθε ὑμεῖς
  choice: Ninyi msiogope
  rationale: Kuweka ‘ninyi’ wazi kabla ya kitenzi kunahifadhi msisitizo wa kiwakilishi ὑμεῖς kwa Kiswahili cha asili na kuelekeza faraja hasa kwa wanawake hao.
- source_word: οἶδα γὰρ ὅτι
  choice: kwa maana ninajua kwamba
  rationale: γὰρ inatoa sababu ya faraja, na ὅτι inaanzisha maudhui ya kile malaika anachojua.
- source_word: Ἰησοῦν ... ζητεῖτε
  choice: mnamtafuta Yesu
  rationale: Wakati uliopo wa ζητεῖτε unaeleza kitendo kinachoendelea; ‘mnamtafuta’ ni usemi wa kawaida wa Kiswahili katika muktadha huu.
- source_word: τὸν ἐσταυρωμένον
  choice: aliyesulubiwa
  rationale: Umbo la uhusiano la kutendwa linahifadhi kwamba Yesu ndiye aliyepokea tendo la kusulubiwa, huku likieleza kwa lugha ya asili sifa inayomtambulisha hapa.
theological_decisions:
- issue: Msisitizo wa kiwakilishi ὑμεῖς katika faraja ya malaika
  choice: Ninyi msiogope
  alternative: Msiogope
  rationale: ‘Ninyi’ linahifadhi msisitizo wa Kigiriki bila kuongeza wazi kundi linalolinganishwa nao; hivyo uwezekano wa utofautishaji unabaki bila kufafanuliwa kupita maandishi.
- issue: Nguvu ya hali timilifu katika τὸν ἐσταυρωμένον
  choice: Yesu aliyesulubiwa
  alternative: Yesu, yule aliyesulubiwa
  rationale: Kiswahili hakihitaji kuonyesha kwa umbo tofauti kila maana ya hali timilifu ya Kigiriki. Tafsiri iliyochaguliwa huhifadhi tendo lililokamilika na utambulisho wa Yesu bila kuongeza maelezo ya kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ‘akajibu na kuwaambia’ unahifadhi fomula ya simulizi ya Kigiriki bila kuwa mgumu; ‘Ninyi msiogope’ ni wa asili na pia huhifadhi msisitizo wa kiwakilishi.
