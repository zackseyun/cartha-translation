  text: Ὀψὲ δὲ σαββάτων, τῇ ἐπιφωσκούσῃ εἰς μίαν σαββάτων, ἦλθεν ⸀Μαριὰμ ἡ Μαγδαληνὴ καὶ ἡ ἄλλη Μαρία θεωρῆσαι τὸν τάφον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/001.yaml
  text: After the Sabbath[a], as it was dawning toward the first day of the week, Mary Magdalene and the other Mary came to look at the tomb.
translation:
  language: sw
  text: Baada ya Sabato[a], siku ya kwanza ya juma ilipokuwa inaanza kupambazuka, Maria Magdalene na Maria yule mwingine walikuja kulitazama kaburi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mwishoni mwa Sabato, siku ya kwanza ya juma ilipokuwa inaanza kupambazuka.” Msemo wa Kigiriki wa mwanzo unaweza kueleweka kuwa “baada ya Sabato” au “mwishoni mwa Sabato.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ὀψὲ δὲ σαββάτων
  choice: Baada ya Sabato
  rationale: ὀψέ pamoja na hali ya umilikishi inaweza kumaanisha wakati baada ya tukio. Katika muktadha huu inaeleweka vizuri kama baada ya Sabato kumalizika. σαββάτων ni umbo la wingi lakini hapa limetumika kiidioma kumaanisha Sabato moja; δέ haihitaji kiunganishi kizito katika Kiswahili.
- source_word: τῇ ἐπιφωσκούσῃ
  choice: kulipokuwa kukipambazuka
  rationale: Kitenzi ἐπιφώσκω hapa kinaelekea kuonyesha kuanza kwa mwanga wa asubuhi. Tafsiri hii ni ya kawaida na yenye kueleweka katika Kiswahili.
- source_word: εἰς μίαν σαββάτων
  choice: kuelekea siku ya kwanza ya juma
  rationale: μίαν σαββάτων ni msemo wa Kisemiti unaomaanisha siku ya kwanza ya juma, na εἰς inaonyeshwa kwa ‘kuelekea’ katika uhusiano wake na kupambazuka.
- source_word: ἦλθεν
  choice: walikuja
  rationale: Ingawa kitenzi cha Kigiriki kiko katika umoja kwa sababu ya mtindo wa kisarufi unaohusiana na kiima cha kwanza, Kiswahili hutumia wingi kwa kawaida kwa kiima ambatano cha Maria wawili.
- source_word: Μαριὰμ ἡ Μαγδαληνὴ
  choice: Maria Magdalene
  rationale: Majina yametolewa kwa maumbo yaliyozoeleka katika Kiswahili cha Biblia na matumizi ya kawaida.
- source_word: ἡ ἄλλη Μαρία
  choice: yule Maria mwingine
  rationale: ἄλλη humaanisha mwingine; ‘yule Maria mwingine’ hutofautisha kwa njia ya kawaida mwanamke huyu na Maria Magdalene.
- source_word: θεωρῆσαι
  choice: kulitazama
  rationale: θεωρέω huonyesha kutazama au kuangalia kwa makusudi. ‘Kulitazama’ huhifadhi maana hiyo bila kuongeza wazo la ukaguzi rasmi.
- source_word: τὸν τάφον
  choice: kaburi
  rationale: τάφος hapa ni mahali alipokuwa amezikwa Yesu; ‘kaburi’ ndilo neno la kawaida na wazi katika Kiswahili.
theological_decisions:
- issue: Wakati unaoonyeshwa mwanzoni mwa simulizi la ufufuo
  choice: Mstari umetafsiriwa kuwa baada ya Sabato, kulipokuwa kukipambazuka kuelekea siku ya kwanza ya juma.
  alternative: Mwanzo unaweza pia kueleweka kuwa ‘Mwishoni mwa Sabato, kulipokuwa kukipambazuka kuelekea siku ya kwanza ya juma.’
  rationale: 'Msemo wa Kigiriki ὀψὲ σαββάτων una utata halisi: unaweza kueleweka kuwa baada ya Sabato au mwishoni mwa Sabato. Maana ya ‘baada ya Sabato’ inafaa vizuri pamoja na ishara inayofuata ya mapambazuko, lakini uwezekano mwingine umehifadhiwa katika tanbihi badala ya kufutwa.'
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ‘kulipokuwa kukipambazuka’ ni wa kawaida katika usimulizi na huhifadhi hali ya tendo lililokuwa linaanza. Alama ya tanbihi [a] imewekwa mara tu baada ya ‘Sabato’.
