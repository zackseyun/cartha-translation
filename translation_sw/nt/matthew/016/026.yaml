  text: τί γὰρ ⸀ὠφεληθήσεται ἄνθρωπος ἐὰν τὸν κόσμον ὅλον κερδήσῃ τὴν δὲ ψυχὴν αὐτοῦ ζημιωθῇ; ἢ τί δώσει ἄνθρωπος ἀντάλλαγμα τῆς ψυχῆς αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/026.yaml
  text: For what will it profit a man if he gains the whole world but forfeits his life? Or what will a man give in exchange for his life?[a]
translation:
  language: sw
  text: Kwa maana, mtu atafaidika nini akiupata ulimwengu wote lakini akapoteza uhai wake? Au mtu atatoa nini badala ya uhai wake?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nafsi yake” katika sehemu zote mbili ambako imetafsiriwa “uhai wake.” Neno la Kigiriki ψυχή linaweza kumaanisha “uhai,” “nafsi,” au “mtu mwenyewe,” kutegemea muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γὰρ
  choice: Kwa maana, ... nini
  rationale: “Nini” hudumisha swali la balagha, huku “kwa maana” ikihifadhi nguvu ya γάρ ya kuunganisha kauli hii na mafundisho yaliyotangulia.
- source_word: ὠφεληθήσεται
  choice: atafaidika
  rationale: Kitenzi hiki huonyesha kupata manufaa au faida. “Atafaidika nini” ni Kiswahili cha kawaida na chenye nguvu inayofaa katika swali hili.
- source_word: ἄνθρωπος
  choice: mtu
  rationale: Katika muktadha huu neno la umoja linamtaja mwanadamu yeyote kwa ujumla; “mtu” ni sawia na ya kawaida katika Kiswahili.
- source_word: τὸν κόσμον ὅλον
  choice: ulimwengu wote
  rationale: Huhifadhi maana ya κόσμος pamoja na msisitizo wa ὅλον kwamba hakuna sehemu inayoachwa.
- source_word: κερδήσῃ
  choice: akiupata
  rationale: Hutoa maana ya kupata au kujipatia kitu chenye thamani. Katika Kiswahili, “akiupata ulimwengu wote” ni ya asili na hudumisha taswira ya faida bila kurudia mzizi wa “faida” kwa namna nzito.
- source_word: τὴν ... ψυχὴν αὐτοῦ
  choice: uhai wake
  rationale: ψυχή hapa linaweza kumaanisha uhai, nafsi, au mtu mwenyewe. “Uhai wake” hueleweka wazi katika mlinganisho wa kupata ulimwengu na kupoteza kile chenye thamani kuu, huku “nafsi yake” ikihifadhiwa katika tanbihi.
- source_word: ζημιωθῇ
  choice: akaupoteza
  rationale: Kitenzi kina maana ya kupata hasara, kunyimwa, au kupoteza. “Akaupoteza” ni cha kawaida katika Kiswahili na huonyesha kwa uwazi hasara inayokinzana na kuupata ulimwengu.
- source_word: ἀντάλλαγμα
  choice: badala ya
  rationale: Neno hili hutaja kitu kinachotolewa ili kupata kingine kwa kubadilishana. “Atatoa nini badala ya” ni usemi wa kawaida usioingiza wazo finyu la fidia ambalo si lazima katika mstari huu.
theological_decisions:
- issue: Maana ya ψυχή katika kauli kuhusu hasara ya mwisho
  choice: uhai
  alternative: nafsi
  rationale: Muktadha hauwalazimishi wasomaji kuelewa ψυχή kama sehemu isiyo ya kimwili iliyotenganishwa na mwili; linaweza kumaanisha uhai au mtu mwenyewe katika thamani yake yote. “Uhai” huacha upana huo katika matini kuu, na “nafsi” linawekwa katika tanbihi ili kuhifadhi maana mbadala ya kweli na mvutano wa kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi na inayoeleweka kwa urahisi. Muundo wa maswali mawili ya balagha na uhusiano wao na mafundisho yaliyotangulia umehifadhiwa.
