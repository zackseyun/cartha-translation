  text: ἀποκριθεὶς δὲ Σίμων Πέτρος εἶπεν· Σὺ εἶ ὁ χριστὸς ὁ υἱὸς τοῦ θεοῦ τοῦ ζῶντος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/016.yaml
  text: Simon Peter answered[a], “You are the Messiah, the Son of the living God.”
translation:
  language: sw
  text: Simoni Petro akajibu, “Wewe ndiye Masihi,[a] Mwana wa Mungu aliye hai.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kristo.” Cheo cha Kigiriki Χριστός kinaweza kutafsiriwa “Kristo”; hapa kimetafsiriwa “Masihi” ili kuhifadhi maana yake kama cheo na mazingira ya Kiyahudi kuhusu Masihi.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ... εἶπεν
  choice: akajibu
  rationale: Muundo huu wa Kigiriki huanzisha jibu katika simulizi. ‘Akajibu’ ni Kiswahili cha kawaida na huepuka tafsiri nzito yenye kurudia ‘akajibu akasema.’ Kiunganishi δέ hakihitaji neno tofauti hapa; mtiririko wa simulizi unaonyeshwa na ‘aka-’.
- source_word: Σίμων Πέτρος
  choice: Simoni Petro
  rationale: Majina yametoholewa kwa namna iliyozoeleka katika Kiswahili cha Biblia.
- source_word: Σὺ εἶ
  choice: Wewe ndiye
  rationale: Kiwakilishi cha wazi Σὺ kina mkazo. ‘Wewe ndiye’ huhifadhi mkazo huo na utambulisho unaotolewa na sentensi.
- source_word: ὁ χριστὸς
  choice: Masihi
  rationale: Χριστός hapa ni cheo cha kimasiya, si sehemu ya jina la mtu. ‘Masihi’ huhifadhi maana ya cheo na mazingira ya Kiyahudi.
- source_word: ὁ υἱὸς
  choice: Mwana
  rationale: Nomino yenye kibainishi inatumiwa kama cheo mahususi. Kiswahili hakihitaji kibainishi tofauti; herufi kubwa inaonyesha matumizi ya cheo katika ungamo hili.
- source_word: τοῦ θεοῦ τοῦ ζῶντος
  choice: wa Mungu aliye hai
  rationale: Huhifadhi uhusiano wa kiuana na sifa ya Mungu kama aliye hai kwa Kiswahili cha asili na wazi.
theological_decisions:
- issue: Kutafsiri Χριστός kama cheo au kama umbo linalofanana na jina
  choice: Masihi
  alternative: Kristo
  rationale: Katika ungamo la Petro, Χριστός inafanya kazi wazi kama cheo. ‘Masihi’ huwasilisha maana hiyo moja kwa moja; ‘Kristo’ imehifadhiwa katika tanbihi kama tafsiri mbadala iliyozoeleka.
- issue: Nguvu ya usemi ‘Mwana wa Mungu’
  choice: Mwana wa Mungu aliye hai
  alternative: —
  rationale: Tafsiri inadumisha maneno ya kiungamo na hadhi ya cheo katika Kigiriki bila kuyaongezea ufafanuzi wa baadaye au kuyapunguza.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Muundo ‘akajibu’ unafaa simulizi, na ‘Wewe ndiye’ huhifadhi mkazo wa kiwakilishi cha Kigiriki.
