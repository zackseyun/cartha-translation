  text: ⸂ἀποκριθεὶς δὲ⸃ ὁ Ἰησοῦς εἶπεν αὐτῷ· Μακάριος εἶ, Σίμων Βαριωνᾶ, ὅτι σὰρξ καὶ αἷμα οὐκ ἀπεκάλυψέν σοι ἀλλ’ ὁ πατήρ μου ὁ ἐν τοῖς οὐρανοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/017.yaml
  text: And Jesus answered him[a], “Blessed are you, Simon Bar-Jonah, because flesh and blood did not reveal this to you[c][b], but my Father who is in heaven did.”
translation:
  language: sw
  text: Naye Yesu akamjibu, “Heri yako, Simoni Bar-Yona[a], kwa sababu mwili na damu[b] havikukufunulia jambo hili, bali Baba yangu aliye mbinguni[c] ndiye aliyekufunulia.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Simoni mwana wa Yona.” Kigiriki kinahifadhi umbo la Kiaramu la kutaja mtu kwa jina la baba yake, hapa limenakiliwa kwa sauti kama “Bar-Yona.”
    reason: lexical_alternative
  - marker: b
    text: Kwa maana halisi, “mwili na damu”; hii ni nahau inayomaanisha wanadamu au chanzo cha kibinadamu tu.
    reason: cultural_note
  - marker: c
    text: Kwa tafsiri ya karibu, “aliye katika mbingu”; “aliye mbinguni” ni usemi wa kawaida wa Kiswahili.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ... εἶπεν αὐτῷ
  choice: Naye Yesu akamjibu
  rationale: Muundo wa kirai tegemezi pamoja na kitenzi kikuu una maana ya ‘akajibu na kusema.’ Kiswahili cha kawaida huwasilisha maana hiyo kwa ufupi kwa ‘akamjibu,’ huku ‘Naye’ ikiendeleza simulizi na kuwakilisha δέ.
- source_word: Μακάριος
  choice: Heri yako
  rationale: ‘Heri yako’ ni usemi wa asili na wenye hadhi katika Kiswahili unaobeba maana ya hali ya kubarikiwa au kupendelewa, si hisia ya furaha tu.
- source_word: Σίμων Βαριωνᾶ
  choice: Simoni Bar-Yona
  rationale: Jina Σίμων limewasilishwa kwa umbo la Kiswahili ‘Simoni,’ na Βαριωνᾶ limenukuliwa kwa sauti kama ‘Bar-Yona’ ili kuhifadhi umbo la Kiaramu la jina la ukoo; maana yake imeelezwa katika tanbihi.
- source_word: ὅτι
  choice: kwa sababu
  rationale: Hapa ὅτι inatoa sababu ya Yesu kutamka heri, hivyo ‘kwa sababu’ huonyesha uhusiano huo wazi.
- source_word: σὰρξ καὶ αἷμα
  choice: mwili na damu
  rationale: Tafsiri hii inahifadhi nahau halisi inayotaja chanzo cha kibinadamu bila kuibana kuwa mawazo ya Petro mwenyewe au mafundisho ya mtu mwingine pekee.
- source_word: ἀπεκάλυψέν σοι
  choice: havikukufunulia jambo hili
  rationale: ‘Kufunulia’ huhifadhi wazo la kufichua jambo lililokuwa halijulikani. ‘Jambo hili’ limewekwa wazi kutokana na muktadha, kwa kuwa kitu kinachofunuliwa hakitajwi moja kwa moja katika Kigiriki.
- source_word: ἀλλ’ ὁ πατήρ μου
  choice: bali Baba yangu
  rationale: ‘Bali’ huonyesha kwa nguvu utofauti kati ya chanzo cha kibinadamu na Baba kama chanzo cha ufunuo.
- source_word: ὁ ἐν τοῖς οὐρανοῖς
  choice: aliye mbinguni
  rationale: Ingawa Kigiriki kina umbo la wingi, ‘aliye mbinguni’ ni usemi wa kawaida wa Kiswahili na huhifadhi maelezo yanayomhusu Baba.
theological_decisions:
- issue: Chanzo cha ungamo la Petro
  choice: Nahau ‘mwili na damu’ imehifadhiwa ili kuondoa chanzo cha kibinadamu kwa upana na kuhusisha ufunuo huo na Baba.
  alternative: Kutafsiri moja kwa moja kuwa ‘mwanadamu’ au kuufafanua kuwa uwezo wa Petro wa kufikiri au mwalimu fulani wa kibinadamu.
  rationale: Andiko linatofautisha chanzo cha kibinadamu na ufunuo wa Baba, lakini halibainishi zaidi kama linakusudia fikira za Petro mwenyewe, mwalimu wa kibinadamu, au mamlaka nyingine ya kibinadamu. Tafsiri haipaswi kuondoa upana huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. ‘Heri yako’ na ‘bali’ hudumisha uzito wa kauli ya Yesu, huku nahau ‘mwili na damu’ ikihifadhiwa na kufafanuliwa kwa tanbihi.
