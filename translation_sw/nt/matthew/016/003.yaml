  text: καὶ πρωΐ· Σήμερον χειμών, πυρράζει γὰρ στυγνάζων ὁ οὐρανός. ⸀τὸ μὲν πρόσωπον τοῦ οὐρανοῦ γινώσκετε διακρίνειν, τὰ δὲ σημεῖα τῶν καιρῶν οὐ δύνασθε.⸃
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/003.yaml
  text: And in the morning[a], ‘Today, stormy weather, for the sky is red and overcast.’ You know how to discern the appearance of the sky[b], but you are not able to discern the signs of the times.
translation:
  language: sw
  text: Asubuhi mnasema, “Leo kutakuwa na hali mbaya ya hewa, kwa maana anga ni jekundu na lina sura ya kutisha.” Mnajua kutambua mwonekano wa anga, lakini hamwezi kutambua ishara za nyakati.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati za kale hazina sehemu ya mwisho ya mstari wa 2 wala mstari wa 3.
    reason: textual_variant
  - marker: b
    text: “Ishara za nyakati” zinaweza kurejelea umuhimu wa wakati huo mbele za Mungu, kutia ndani kazi za Yesu za Kimasihi.
    reason: alternative_reading
lexical_decisions:
- source_word: πρωΐ
  choice: asubuhi
  rationale: Ni kielezi cha wakati; “asubuhi” ni usemi wa kawaida na sahihi katika Kiswahili.
- source_word: χειμών
  choice: dhoruba
  rationale: Katika muktadha huu neno hilo linamaanisha hali mbaya ya hewa, si majira ya baridi.
- source_word: πυρράζει
  choice: ni jekundu
  rationale: Hueleza rangi nyekundu ya anga na kudumisha picha ya utabiri wa hali ya hewa.
- source_word: στυγνάζων
  choice: limetanda giza
  rationale: Hueleza anga lenye sura ya huzuni, giza, au tishio; tafsiri hii ni ya asili katika muktadha wa dhoruba bila kuongeza moja kwa moja kwamba kuna mawingu.
- source_word: πρόσωπον τοῦ οὐρανοῦ
  choice: sura ya anga
  rationale: “Sura” hudumisha sitiari ya uso huku ikieleweka kuwa ni mwonekano wa anga.
- source_word: γινώσκετε διακρίνειν
  choice: mnajua kutambua
  rationale: Muundo huu unaonyesha uwezo uliopatikana wa kuchunguza na kufasiri tofauti.
- source_word: σημεῖα
  choice: ishara
  rationale: Ni neno la kawaida linalobeba maana ya dalili pamoja na umuhimu wa ufunuo.
- source_word: καιρῶν
  choice: nyakati
  rationale: Hapa linarejelea vipindi au majira yenye umuhimu, si majira ya hali ya hewa pekee.
- source_word: οὐ δύνασθε
  choice: hamwezi kutambua
  rationale: Hueleza kutoweza; kurudia “kutambua” kunafanya utofauti wa vifungu viwili uwe wazi.
theological_decisions:
- issue: Maana ya “ishara za nyakati”
  choice: Kudumisha msemo mpana “ishara za nyakati” bila kuufanya urejelee ishara za mwisho wa dunia peke yake.
  alternative: “ishara za wakati huu” au “ishara za zama za Masihi”
  rationale: Msemo wa Kigiriki unaweza kujumuisha umuhimu wa wakati uliopo, kazi za Yesu za Kimasihi, na matarajio ya nyakati za mwisho. Tafsiri haifungi maana katika mojawapo tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Sura ya anga” inadumisha picha ya Kigiriki bila kuwa ngumu, na “limetanda giza” huepuka kuongeza mawingu ambayo hayatajwi waziwazi.
