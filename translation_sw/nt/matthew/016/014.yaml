base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/014.yaml
  text: And they said[a], “Some say John the Baptist, others Elijah, and others Jeremiah or one of the prophets.”
translation:
  language: sw
  text: Nao wakasema, “Wengine husema kwamba wewe ni Yohana Mbatizaji, wengine Eliya, na wengine Yeremia au mmoja wa manabii.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ εἶπαν
  choice: Nao wakasema
  rationale: δέ imewasilishwa kwa kiunganishi cha kawaida “Nao” ili kuendeleza simulizi bila kusisitiza upinzani; εἶπαν ni “wakasema” katika usemi huu wa taarifa.
- source_word: Οἱ μὲν
  choice: Wengine husema
  rationale: μέν inaanzisha kundi la kwanza katika mgawanyo unaoendelezwa na ἄλλοι na ἕτεροι. Kiswahili cha kawaida hutumia “Wengine husema,” huku kile kinachosemwa kuhusu Yesu kikieleweka kutokana na swali lililotangulia.
- source_word: Ἰωάννην τὸν βαπτιστήν
  choice: Yohana Mbatizaji
  rationale: “Mbatizaji” ni jina la kawaida na linaloeleweka kwa βαπτιστής, likimtambulisha Yohana kwa kazi yake ya kubatiza.
- source_word: ἄλλοι δὲ
  choice: wengine
  rationale: Hii inaendeleza orodha ya makundi; kurudia kiunganishi cha utofautishaji si lazima katika Kiswahili.
- source_word: Ἠλίαν
  choice: Eliya
  rationale: Hili ndilo umbo la kawaida la jina la nabii huyo katika Kiswahili.
- source_word: ἕτεροι δὲ
  choice: na wengine
  rationale: ἕτεροι inaonyesha kundi jingine katika mfuatano; “na wengine” ni ya asili na haiingizi msisitizo wa ziada.
- source_word: Ἰερεμίαν
  choice: Yeremia
  rationale: Hili ndilo umbo la kawaida la jina hilo katika Kiswahili.
- source_word: ἢ ἕνα τῶν προφητῶν
  choice: au mmoja wa manabii
  rationale: ἤ inaonyesha uwezekano mwingine wa utambulisho. Neno “wengine” halijaongezwa baada ya “manabii,” kwa kuwa halipo wazi katika Kigiriki.
theological_decisions:
- issue: Kitu kinachodokezwa katika majina ya utambulisho
  choice: 'Maandishi yanaacha kirai “kwamba wewe ni” kikiwa kimedokezwa: “Wengine husema Yohana Mbatizaji...”'
  alternative: “Wengine husema kwamba wewe ni Yohana Mbatizaji...”
  rationale: Kigiriki kinatoa majina kwa mkato, na swali lililotangulia linaonyesha wazi kuwa yanamhusu Yesu. Tanbihi inatoa namna iliyo wazi zaidi bila kuondoa mkato wa maandishi ya chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa orodha ni mwepesi kusomeka, huku mkato wa Kigiriki ukihifadhiwa katika maandishi makuu na kufafanuliwa katika tanbihi.
