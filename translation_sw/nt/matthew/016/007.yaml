  text: οἱ δὲ διελογίζοντο ἐν ἑαυτοῖς λέγοντες ὅτι Ἄρτους οὐκ ἐλάβομεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/007.yaml
  text: And they were discussing among themselves[a], saying, “We did not bring bread.”
translation:
  language: sw
  text: Nao walikuwa wakijadiliana wao kwa wao, wakisema, “Hatukuleta mikate[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Hatukuchukua mikate pamoja nasi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διελογίζοντο
  choice: walikuwa wakijadiliana
  rationale: Wakati usiotimilika unaonyesha mazungumzo yaliyokuwa yakiendelea; ‘walikuwa wakijadiliana’ ni Kiswahili cha kawaida kinachoonyesha hali hiyo.
- source_word: ἐν ἑαυτοῖς
  choice: wao kwa wao
  rationale: Kirai hiki kinaonyesha kwamba walizungumza ndani ya kundi lao wenyewe, si hadharani.
- source_word: λέγοντες
  choice: wakisema
  rationale: Hutambulisha maneno yaliyokuwa kiini cha majadiliano yao.
- source_word: ὅτι
  choice: —
  rationale: Katika muktadha huu ὅτι hutambulisha yaliyosemwa; alama za kunukuu hufanya kazi hiyo kwa Kiswahili bila kulazimisha maana ya ‘kwa sababu’.
- source_word: Ἄρτους
  choice: mikate
  rationale: Wingi wa neno la Kigiriki umehifadhiwa kwa ‘mikate,’ yaani mikate iliyokusudiwa kuwa chakula cha safari.
- source_word: οὐκ ἐλάβομεν
  choice: hatukuleta
  rationale: Katika muktadha wa kusafiri, λαμβάνω humaanisha kuchukua kitu ili kiende pamoja na mtu; ‘hatukuleta’ ni usemi wa asili kwa mtazamo wa mahali walikofika, huku tafsiri ya karibu zaidi ikiwekwa katika tanbihi.
- source_word: οἱ δὲ
  choice: Nao
  rationale: δέ ni kiunganishi hafifu cha kuendeleza simulizi; ‘Nao’ kinaendeleza mtiririko bila kusisitiza utofautishaji.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya simulizi. Muundo ‘walikuwa wakijadiliana’ umehifadhi mwendelezo wa tendo, na ‘wao kwa wao’ ni wa kawaida na unaoeleweka kwa urahisi.
