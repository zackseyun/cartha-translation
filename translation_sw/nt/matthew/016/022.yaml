  text: καὶ προσλαβόμενος αὐτὸν ὁ Πέτρος ἤρξατο ἐπιτιμᾶν αὐτῷ λέγων· Ἵλεώς σοι, κύριε· οὐ μὴ ἔσται σοι τοῦτο.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/022.yaml
  text: And Peter took him aside and began to rebuke him[a], saying, “Far be it from you, Lord; this will certainly not happen to you.”
translation:
  language: sw
  text: Petro akamchukua Yesu kando, akaanza kumkemea, akisema, “Hasha, Bwana![a] Jambo hili halitakupata kamwe.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Hilo na liwe mbali nawe, Bwana,” au “Mungu apishe mbali, Bwana.” Msemo wa Kigiriki umefupishwa na ni wa kiidioma.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσλαβόμενος
  choice: akamchukua Yesu kando
  rationale: Katika muktadha huu, umbo la kati linaonyesha kwamba Petro alimvuta Yesu pembeni ili azungumze naye faraghani. Jina “Yesu” limetumiwa badala ya kiwakilishi ili sentensi iwe wazi na ya kawaida kwa Kiswahili.
- source_word: ἤρξατο ἐπιτιμᾶν
  choice: akaanza kumkemea
  rationale: Muundo wa ἄρχομαι pamoja na kitenzi-jina unaonyesha mwanzo wa tendo, na ἐπιτιμάω humaanisha kukemea au kukaripia kwa nguvu.
- source_word: Ἵλεώς σοι
  choice: Hasha
  rationale: Huu ni msemo wa Kigiriki uliofupishwa na wenye maana ya kukataa kwa nguvu kwamba jambo hilo limpate Yesu. “Hasha” ni msemo wa Kiswahili unaowasilisha pingamizi hilo bila kuingiza wazi jina la Mungu, ambalo halipo katika maneno ya Kigiriki.
- source_word: κύριε
  choice: Bwana
  rationale: “Bwana” huhifadhi maana ya kawaida ya κύριος, heshima ya Petro kwa Yesu, na uzito wa neno hili katika Injili.
- source_word: οὐ μὴ ἔσται σοι τοῦτο
  choice: Jambo hili halitakupata kamwe
  rationale: οὐ μή pamoja na wakati ujao ni ukanushi wenye mkazo mkubwa. “Halitakupata kamwe” ni Kiswahili cha kawaida kinachohifadhi mkazo huo na maana ya σοι.
theological_decisions:
- issue: Kuwasilisha pingamizi la Petro bila kuongeza teolojia isiyotajwa wazi
  choice: Hasha, Bwana! Jambo hili halitakupata kamwe.
  alternative: Mungu apishe mbali, Bwana! Jambo hili halitakupata kamwe.
  rationale: Ἵλεώς σοι ni msemo wenye utata na uliofupishwa. “Hasha” huhifadhi nguvu ya pingamizi la Petro bila kuongeza jina la Mungu, huku tanbihi ikihifadhi tafsiri mbadala inayofanya ombi la rehema au ulinzi wa Mungu kuwa wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Hasha” ni neno fupi lakini linaloeleweka katika sajili ya kibiblia na linafaa kwa pingamizi kali la Petro; tanbihi inaeleza usemi mgumu wa Kigiriki.
