id: MAT.16.13
reference: Matthew 16:13
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἐλθὼν δὲ ὁ Ἰησοῦς εἰς τὰ μέρη Καισαρείας τῆς Φιλίππου ἠρώτα τοὺς μαθητὰς αὐτοῦ λέγων· ⸀Τίνα λέγουσιν οἱ ἄνθρωποι εἶναι τὸν υἱὸν τοῦ ἀνθρώπου;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/013.yaml
  text: When Jesus came into the region of Caesarea Philippi[a], he was asking his disciples, saying[b], “Who do people say the Son of Man is?”
translation:
  language: sw
  text: Yesu alipofika katika eneo la Kaisaria Filipi, aliwauliza wanafunzi wake, “Watu wanasema Mwana wa Adamu[a] ni nani?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Mwana wa Adamu” ni jina ambalo Yesu alilitumia mara nyingi kujitaja; wengine hutafsiri “Mwanadamu.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐλθὼν δὲ ὁ Ἰησοῦς
  choice: Yesu alipofika
  rationale: Kirai tegemezi cha wakati kinaonyesha kuingia kwa tukio jipya. Kiswahili cha masimulizi hakihitaji kutafsiri δέ kwa kiunganishi tofauti hapa.
- source_word: εἰς τὰ μέρη Καισαρείας τῆς Φιλίππου
  choice: katika eneo la Kaisaria Filipi
  rationale: μέρη hapa humaanisha eneo au wilaya inayozunguka mahali hapo, si ‘sehemu’ halisi; ‘Kaisaria Filipi’ ni namna ya kawaida ya kuandika jina hilo kwa Kiswahili.
- source_word: ἠρώτα τοὺς μαθητὰς αὐτοῦ
  choice: aliwauliza wanafunzi wake
  rationale: ‘Wanafunzi’ ni tafsiri iliyozoeleka ya μαθηταί. Ingawa ἠρώτα ni wakati usiotimilifu, ‘alikuwa akiwauliza’ ni nzito katika Kiswahili; wakati uliopita rahisi huwasilisha tendo hilo kwa kawaida bila kuongeza maana nyingine.
- source_word: λέγων
  choice: aliwauliza … “…”
  rationale: Katika Kiswahili, yaliyosemwa yanaweza kufuata moja kwa moja baada ya kitenzi ‘uliza’; kutafsiri λέγων kwa ‘akisema’ kungekuwa marudio yasiyo ya kawaida.
- source_word: Τίνα λέγουσιν οἱ ἄνθρωποι εἶναι
  choice: Watu wanasema … ni nani?
  rationale: ἄνθρωποι inawahusu watu kwa ujumla, si wanaume pekee. Muundo huu wa swali ni wa kawaida na huhifadhi maana ya usemi usio wa moja kwa moja.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  rationale: Hili ni jina la kujitaja analotumia Yesu mara nyingi. Linahifadhi mwangwi wa maandiko na uzito wa usemi wa Kigiriki bila kuufafanua kupita kiasi.
theological_decisions:
- issue: Tafsiri ya ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  alternative: Mwanadamu
  rationale: ‘Mwana wa Adamu’ huhifadhi muundo wa jina hili, matumizi yake ya kujitaja kwa Yesu, na mwangwi unaowezekana wa Danieli 7. ‘Mwanadamu’ ni fupi na ya kawaida zaidi, lakini inaweza kuficha hali ya usemi huo kama jina maalumu na kupunguza utata wake wa kimakusudi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imeundwa kwa mtiririko wa kawaida wa simulizi; marudio ya Kigiriki λέγων hayajaigwa kwa namna ngumu, na jina la kitheolojia ‘Mwana wa Adamu’ limehifadhiwa.
