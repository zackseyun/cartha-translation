  text: ὁ δὲ στραφεὶς εἶπεν τῷ Πέτρῳ· Ὕπαγε ὀπίσω μου, Σατανᾶ· σκάνδαλον ⸂εἶ ἐμοῦ⸃, ὅτι οὐ φρονεῖς τὰ τοῦ θεοῦ ἀλλὰ τὰ τῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/023.yaml
  text: But he turned and said to Peter[a], “Go behind me, Satan! You are a stumbling block to me, because you are not setting your mind on the things of God[b], but on the things of men.”
translation:
  language: sw
  text: Lakini Yesu akageuka na kumwambia Petro, “Nenda nyuma yangu, Shetani![a] Wewe ni kikwazo kwangu, kwa sababu huyawazii mambo ya Mungu, bali mambo ya wanadamu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa usemi wa jadi zaidi, “Rudi nyuma yangu, Shetani!”
    reason: Mbadala wa usemi wa jadi unaohifadhi maana ya mahali ya ὀπίσω μου bila kufafanua mapema kwamba Petro aondoke mbele ya Yesu.
lexical_decisions:
- source_word: στραφεὶς
  choice: akageuka
  rationale: Kitenzi hiki kinaonyesha kugeuka kwa Yesu kabla ya kusema; “akageuka” ni Kiswahili cha kawaida na kinaakisi matumizi ya kitenzi hiki yasiyo ya kutendwa katika muktadha huu.
- source_word: Ὕπαγε ὀπίσω μου
  choice: Nenda nyuma yangu
  rationale: Tafsiri hii inadumisha maana ya mwendo katika ὕπαγε na maana ya mahali katika ὀπίσω μου. Pia inaacha wazi ikiwa Yesu anamwamuru Petro aondoke mbele yake au arudi mahali pa mfuasi nyuma yake.
- source_word: Σατανᾶ
  choice: Shetani
  rationale: Hili ni jina au cheo cha moja kwa moja katika hali ya kumwita mtu. “Shetani” huhifadhi ukali na mwangwi wa kibiblia bila kuamua ikiwa Petro anatambulishwa na Shetani mwenyewe au anatenda kama mpinzani.
- source_word: σκάνδαλον
  choice: kikwazo
  rationale: Katika muktadha huu neno lina picha ya kitu kinachomfanya mtu ajikwae au kinachomzuia. “Kikwazo” ni cha asili katika Kiswahili na kinaonyesha kwamba Petro anajaribu kuzuia njia ya Yesu.
- source_word: ἐμοῦ
  choice: kwangu
  rationale: Pamoja na σκάνδαλον, umbo hili linaonyesha mtu anayeathiriwa na kikwazo; “kwangu” ni wazi na la kawaida katika Kiswahili.
- source_word: φρονεῖς
  choice: mawazo yako hayaelekei
  rationale: φρονέω hapa huhusu mwelekeo wa fikira na msimamo wa ndani, si wazo la muda mfupi tu. Kauli hii ya Kiswahili inaonyesha mwelekeo huo.
- source_word: τὰ τοῦ θεοῦ
  choice: mambo ya Mungu
  rationale: Tafsiri hii inadumisha muundo mpana wa Kigiriki bila kuubana kuwa “mapenzi,” “masilahi,” au tafsiri nyingine maalumu zaidi.
- source_word: τὰ τῶν ἀνθρώπων
  choice: mambo ya wanadamu
  rationale: ἀνθρώπων hapa inawahusu wanadamu kwa ujumla katika utofautishaji na Mungu. “Wanadamu” ni sahihi, ya asili, na inadumisha maana ya jumla ya chanzo.
theological_decisions:
- issue: Nguvu ya Yesu kumwita Petro “Shetani”
  choice: Kuhifadhi jina “Shetani” kama kauli ya moja kwa moja kwa Petro bila kufafanua uhusiano wake na Shetani.
  alternative: Kutafsiri “mpinzani,” au kueleza kwamba Yesu anamzungumzia Shetani anayetenda kupitia Petro.
  rationale: Kigiriki kina ukali na utata wa kitheolojia. Tafsiri haipaswi kuamua ikiwa Petro anaitwa Shetani, anafananishwa naye, au anatenda kama chombo cha upinzani wake.
- issue: Maana ya “nyuma yangu”
  choice: Kuhifadhi usemi wa mahali, “Nenda nyuma yangu.”
  alternative: “Ondoka mbele yangu” au “Ondoka kwangu.”
  rationale: Usemi unaweza kuwa karipio la kuondoka njiani mwa Yesu na pia unaweza kudokeza nafasi inayofaa ya Petro kama mfuasi anayekwenda nyuma ya Yesu. Tafsiri kuu inahifadhi uwezekano huo.
- issue: Utofautishaji kati ya mambo ya Mungu na mambo ya wanadamu
  choice: “mambo ya Mungu” na “mambo ya wanadamu.”
  alternative: “mapenzi ya Mungu” na “masilahi ya kibinadamu.”
  rationale: Misemo mipana ya Kigiriki inahifadhiwa ili kutoingiza ufafanuzi maalumu kuliko maandishi yenyewe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Jina “Yesu” limetajwa badala ya kiwakilishi pekee ili rejeo liwe wazi katika aya inayosomwa peke yake. Sentensi inadumisha ukali wa karipio na utofautishaji wa kimawazo bila kutumia istilahi nzito za kitaalamu.
