  text: ὃς γὰρ ⸀ἐὰν θέλῃ τὴν ψυχὴν αὐτοῦ σῶσαι ἀπολέσει αὐτήν· ὃς δ’ ἂν ἀπολέσῃ τὴν ψυχὴν αὐτοῦ ἕνεκεν ἐμοῦ εὑρήσει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/025.yaml
  text: For whoever wants to save his life will lose it[a], but whoever loses his life for my sake will find it.
translation:
  language: sw
  text: Kwa maana yeyote anayetaka kuokoa uhai wake ataupoteza[a], lakini yeyote atakayeupoteza uhai wake kwa ajili yangu ataupata.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nafsi” kila linapotokea katika aya hii; neno la Kigiriki psychē linaweza kumaanisha “uhai,” “nafsi,” au “mtu mwenyewe,” kutegemea muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς γὰρ ἐὰν / ὃς δ’ ἂν
  choice: Kwa maana yeyote ... lakini yeyote
  rationale: Muundo wa masharti usio na mhusika maalumu umefasiriwa kwa Kiswahili cha kawaida kuwa “yeyote.” “Kwa maana” linaendeleza uhusiano wa γάρ na kauli iliyotangulia, na “lakini” linaonyesha utofauti unaoletwa na δέ.
- source_word: θέλῃ
  choice: anayetaka
  rationale: θέλω hapa huonyesha nia au kutaka; “anayetaka” ni usemi wa kawaida na wa moja kwa moja.
- source_word: ψυχὴν
  choice: uhai
  rationale: Katika muktadha huu ψυχή ni uhai wa mtu unaoweza kuokolewa, kupotezwa na kupatikana. “Uhai” huhifadhi fumbo la kauli bila kuifupisha maana kuwa roho isiyo ya mwili pekee; “nafsi” imeonyeshwa katika tanbihi kama tafsiri nyingine halali.
- source_word: σῶσαι
  choice: kuokoa
  rationale: “Kuokoa” linaonyesha vizuri maana ya σῴζω na kudumisha mkabala wake na “kupoteza.”
- source_word: ἀπολέσει / ἀπολέσῃ
  choice: ataupoteza / atakayeupoteza
  rationale: Kitenzi cha kwanza kimehifadhiwa katika wakati ujao, na cha pili kimewasilishwa katika muundo wa sharti la jumla unaosikika kiasili katika Kiswahili.
- source_word: ἕνεκεν ἐμοῦ
  choice: kwa ajili yangu
  rationale: Usemi huu unaonyesha sababu au kujitoa kwa Yesu kwa njia fupi na ya kawaida katika Kiswahili.
- source_word: εὑρήσει
  choice: ataupata
  rationale: “Ataupata” ni tafsiri ya moja kwa moja ya εὑρήσει na huhifadhi fumbo la kupoteza uhai na kisha kuupata.
- source_word: αὐτοῦ / αὐτήν
  choice: wake / -u-
  rationale: “Wake” na kiambishi cha ngeli “-u-” vinarejelea “uhai” kwa uwazi na kwa sarufi ya kawaida ya Kiswahili bila kuongeza jinsia ambayo Kiswahili haihitaji hapa.
theological_decisions:
- issue: Maana ya ψυχή katika fumbo la uanafunzi
  choice: uhai
  alternative: nafsi
  rationale: Muktadha wa kumfuata Yesu na uwezekano wa kufa unaunga mkono “uhai,” huku upana halisi wa ψυχή ukihifadhiwa kwa tanbihi badala ya kuamuliwa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi; muundo ni wa kawaida kwa wasomaji wengi huku ukihifadhi ulinganifu wa kuokoa, kupoteza na kupata.
