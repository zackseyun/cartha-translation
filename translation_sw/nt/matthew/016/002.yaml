  text: ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς· ⸂Ὀψίας γενομένης λέγετε· Εὐδία, πυρράζει γὰρ ὁ οὐρανός·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/002.yaml
  text: But he answered and said to them[a], “When evening comes, you say, ‘Fair weather, for the sky is red.’
translation:
  language: sw
  text: Lakini akawajibu, akasema, “Jioni inapofika, mnasema, ‘Hali ya hewa itakuwa nzuri, kwa maana anga ni jekundu.’[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mbingu ni nyekundu.” Katika muktadha huu, neno la Kigiriki linaweza kumaanisha “anga” au “mbingu,” lakini msemo kuhusu hali ya hewa unaelekea wazi kwa “anga.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: akawajibu, akasema
  rationale: Inahifadhi kauli ya Kigiriki yenye vitenzi viwili, yaani ‘alijibu na kusema,’ kwa Kiswahili cha simulizi kilicho wazi na chenye heshima.
- source_word: Ὀψίας γενομένης
  choice: Jioni inapofika
  rationale: Kirai hiki ni genitivi huru kinachoonyesha wakati; tafsiri hii ni ya kawaida na inaendeleza maana ya tukio linalotumiwa kama ishara.
- source_word: λέγετε
  choice: mnasema
  rationale: Wakati wa sasa unaonyesha kauli ya mazoea au inayorudiwa.
- source_word: Εὐδία
  choice: Hali ya hewa itakuwa nzuri
  rationale: Neno hili linamaanisha hali nzuri au tulivu ya hewa; wakati ujao unafaa kwa utabiri unaotokana na rangi ya anga jioni.
- source_word: πυρράζει
  choice: ni jekundu
  rationale: Kitenzi kinaeleza kuonekana kwa rangi nyekundu; Kiswahili hiki ni kifupi na cha kawaida katika muktadha wa anga.
- source_word: οὐρανός
  choice: anga
  rationale: Katika msemo huu wa hali ya hewa, neno linarejelea anga linaloonekana, ingawa kwa matumizi mengine linaweza kumaanisha mbingu.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Muundo wa Kigiriki ‘akawajibu, akasema’ umehifadhiwa, huku msemo wa hali ya hewa ukitolewa kwa lugha ya kawaida.
