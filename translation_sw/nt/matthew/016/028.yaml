  text: ἀμὴν λέγω ὑμῖν ⸀ὅτι εἰσίν τινες ⸂τῶν ὧδε ἑστώτων⸃ οἵτινες οὐ μὴ γεύσωνται θανάτου ἕως ἂν ἴδωσιν τὸν υἱὸν τοῦ ἀνθρώπου ἐρχόμενον ἐν τῇ βασιλείᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/028.yaml
  text: Truly I tell you[c][b][a], there are some standing here who will certainly not taste death until they see the Son of Man coming in his kingdom.
translation:
  language: sw
  text: Kweli ninawaambia, baadhi ya watu waliosimama hapa hawataonja kifo kamwe[a] mpaka watakapomwona Mwana wa Adamu akija katika ufalme wake.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hawataonja kifo kwa vyovyote”; Kiyunani kina ukanushaji wenye mkazo.
    reason: lexical_alternative
  - marker: b
    text: Kauli “Mwana wa Adamu akija katika ufalme wake” inaweza kumaanisha kugeuka sura, kufufuka na kutukuzwa kwake, hukumu ya Yerusalemu, au kuja kwake kwa mwisho; andiko lenyewe halitaji kwa dhahiri ni tukio gani.
    reason: alternative_reading
  - marker: c
    text: Au, “katika utawala wake” au “katika mamlaka yake ya kifalme.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: Kweli
  rationale: Katika mwanzo wa kauli, neno hili ni uthibitisho mzito wa ukweli. “Kweli” huwasilisha nguvu hiyo kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: λέγω ὑμῖν
  choice: ninawaambia
  rationale: Huhifadhi wakati wa sasa, usemi wa moja kwa moja, na wingi wa wanaoambiwa kwa Kiswahili cha asili.
- source_word: εἰσίν τινες τῶν ὧδε ἑστώτων
  choice: baadhi ya watu waliosimama hapa
  rationale: Huwasilisha maana ya sehemu ya kundi lililokuwapo bila muundo mzito wa neno kwa neno.
- source_word: οὐ μὴ γεύσωνται
  choice: hawataonja ... kamwe
  rationale: Muundo wa Kiyunani una ukanushaji wenye mkazo. “Kamwe” hudumisha mkazo huo bila kubadili sitiari ya kuonja.
- source_word: γεύσωνται θανάτου
  choice: kuonja kifo
  rationale: Huhifadhi sitiari dhahiri ya Kiyunani, ambayo inaeleweka katika lugha ya kibiblia ya Kiswahili.
- source_word: ἕως ἂν ἴδωσιν
  choice: mpaka watakapomwona
  rationale: Ni usemi wa kawaida wa Kiswahili kwa tendo la wakati ujao linaloweka mpaka wa muda.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  rationale: Huhifadhi cheo maalumu cha Yesu na mwangwi wake wa kibiblia na wa kiapokaliptiki.
- source_word: ἐρχόμενον
  choice: akija
  rationale: Huwakilisha moja kwa moja participio inayomfafanua Mwana wa Adamu, bila kuongeza wazo lisilokuwamo kama “kwa nguvu.”
- source_word: ἐν τῇ βασιλείᾳ αὐτοῦ
  choice: katika ufalme wake
  rationale: “Ufalme” huhifadhi istilahi na taswira ya βασιλεία huku ikiacha wazi kama mkazo ni eneo la kifalme au utawala wa kifalme.
theological_decisions:
- issue: Tukio linalomaanishwa na kuja kwa Mwana wa Adamu katika ufalme wake
  choice: Kutafsiri kauli moja kwa moja bila kutaja tukio fulani
  alternative: Kugeuka sura; ufufuo na kutukuzwa; Pentekoste; hukumu ya Yerusalemu; au kuja kwa mwisho
  rationale: Kiyunani hakitambulishi tukio hilo kwa usahihi. Tafsiri inapaswa kuhifadhi utata na mvutano wa kitheolojia badala ya kuamua maana kwa niaba ya msomaji.
- issue: Maana ya βασιλεία
  choice: ufalme
  alternative: utawala au mamlaka ya kifalme
  rationale: Maana zote zinawezekana. “Ufalme” huhifadhi taswira pana ya neno bila kuifinya kuwa dhana ya utawala pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa kawaida kwa wasomaji wengi, huku sitiari “kuonja kifo,” cheo “Mwana wa Adamu,” ukanushaji wenye mkazo, na utata wa “ufalme” vikihifadhiwa.
