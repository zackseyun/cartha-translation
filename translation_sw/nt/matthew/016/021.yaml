id: MAT.16.21
reference: Matthew 16:21
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἀπὸ τότε ἤρξατο ⸂ὁ Ἰησοῦς⸃ δεικνύειν τοῖς μαθηταῖς αὐτοῦ ὅτι δεῖ αὐτὸν ⸂εἰς Ἱεροσόλυμα ἀπελθεῖν⸃ καὶ πολλὰ παθεῖν ἀπὸ τῶν πρεσβυτέρων καὶ ἀρχιερέων καὶ γραμματέων καὶ ἀποκτανθῆναι καὶ τῇ τρίτῃ ἡμέρᾳ ἐγερθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/021.yaml
  text: From that time Jesus began to show his disciples that he must go to Jerusalem and suffer many things from the elders and chief priests and scribes[a], and be killed[c][b], and on the third day be raised.
translation:
  language: sw
  text: Tangu wakati huo Yesu alianza kuwaonyesha wanafunzi wake kwamba ni lazima aende Yerusalemu, apate mateso mengi[a] kutoka kwa wazee, wakuu wa makuhani, na waandishi wa sheria, auawe[b], na siku ya tatu afufuliwe[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ateseke sana.” Kwa maana ya moja kwa moja, Kigiriki husema “ateseke mambo mengi,” kikisisitiza aina mbalimbali za mateso.
    reason: lexical_alternative
  - marker: b
    text: Au, “auawe mikononi mwa wazee, wakuu wa makuhani, na waandishi wa sheria.”
    reason: alternative_reading
  - marker: c
    text: 'Au, “afufuke.” Kigiriki kinatumia kauli tendwa: “afufuliwe.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ τότε
  choice: Tangu wakati huo
  rationale: Inaashiria mwanzo wa hatua mpya katika simulizi na mafundisho ya Yesu, huku ikihifadhi maana ya wakati.
- source_word: ἤρξατο
  choice: alianza
  rationale: Ni tafsiri ya kawaida na ya asili inayoonyesha mwanzo wa tendo linaloendelea.
- source_word: δεικνύειν
  choice: kuwaonyesha
  rationale: Inahifadhi maana ya msingi ya kuonyesha au kuweka wazi bila kuibadili moja kwa moja kuwa ‘kuwaeleza.’
- source_word: δεῖ
  choice: ni lazima
  rationale: Inaonyesha ulazima kwa nguvu, bila kufafanua chanzo chake zaidi ya inavyosema sentensi ya Kigiriki.
- source_word: εἰς Ἱεροσόλυμα ἀπελθεῖν
  choice: aende Yerusalemu
  rationale: Ni Kiswahili cha kawaida kwa mwendo kuelekea mahali fulani na hakiongezi dhana isiyohitajika ya kuondoka.
- source_word: πολλὰ παθεῖν
  choice: apate mateso mengi
  rationale: Inawasilisha wingi wa mateso kwa Kiswahili cha asili zaidi kuliko tafsiri sisisi ‘ateseke mambo mengi.’
- source_word: ἀπὸ τῶν πρεσβυτέρων καὶ ἀρχιερέων καὶ γραμματέων
  choice: kutoka kwa wazee, wakuu wa makuhani, na waandishi wa sheria
  rationale: ‘Kutoka kwa’ inadumisha uhusiano wa chanzo au wahusika unaoonyeshwa na ἀπό; majina ya makundi hayo yanatolewa kwa lugha inayoeleweka kwa wasomaji wa sasa.
- source_word: πρεσβυτέρων
  choice: wazee
  rationale: Ni istilahi ya kawaida ya kundi hili la uongozi wa Kiyahudi.
- source_word: ἀρχιερέων
  choice: wakuu wa makuhani
  rationale: Wingi huu unarejelea kundi la viongozi wa kikuhani, si makuhani wakuu wengi waliokuwa wakishika cheo hicho kwa wakati mmoja.
- source_word: γραμματέων
  choice: waandishi wa sheria
  rationale: ‘Waandishi’ hudumisha maana ya msingi, na ‘wa sheria’ hufafanua kazi yao katika muktadha huu bila kutumia istilahi ya kimadhehebu.
- source_word: ἀποκτανθῆναι
  choice: auawe
  rationale: Ni tafsiri ya moja kwa moja na ya asili ya kauli tendwa ya kuuawa.
- source_word: τῇ τρίτῃ ἡμέρᾳ ἐγερθῆναι
  choice: siku ya tatu afufuliwe
  rationale: Inadumisha wakati pamoja na kauli tendwa ya Kigiriki na ni Kiswahili cha kawaida katika muktadha wa ufufuo.
theological_decisions:
- issue: Nguvu ya δεῖ katika utabiri wa mateso ya Yesu
  choice: ni lazima
  alternative: hana budi; inampasa
  rationale: Kigiriki kinaonyesha ulazima lakini katika kishazi hiki hakisemi wazi kama chanzo chake ni amri ya Mungu, utimilifu wa Maandiko, au jambo jingine. Tafsiri haiongezi ufafanuzi wa kiteolojia usiotajwa.
- issue: Kauli ya ἐγερθῆναι
  choice: afufuliwe
  alternative: afufuke
  rationale: Kitenzi cha Kigiriki kiko katika kauli tendwa. ‘Afufuliwe’ inadumisha muundo huo na haimtaji mtendaji ambaye hakutajwa wazi katika sentensi.
- issue: Uhusiano wa viongozi na kuuawa kwa Yesu
  choice: Kishazi ‘kutoka kwa wazee, wakuu wa makuhani, na waandishi wa sheria’ kimeunganishwa wazi na mateso; tanbihi inaonyesha uwezekano wa kukielewa pia kuhusu kuuawa.
  alternative: auawe mikononi mwa wazee, wakuu wa makuhani, na waandishi wa sheria
  rationale: Kisarufi, ἀπό inafuata moja kwa moja ‘kupata mateso mengi,’ huku kauli tendwa ‘auawe’ ikiwa haina mtendaji aliyetajwa. Tafsiri kuu haipanui kimya kimya upeo wa kishazi, lakini tanbihi inadumisha uelewa unaowezekana katika muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaosomeka kwa urahisi. ‘Ni lazima’ na ‘afufuliwe’ zinahifadhi uzito na mvutano wa kiteolojia wa Kigiriki; ‘waandishi wa sheria’ huwasaidia wasomaji wa kawaida kuelewa kundi linalokusudiwa.
