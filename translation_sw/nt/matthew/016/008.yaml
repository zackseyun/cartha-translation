  text: γνοὺς δὲ ὁ Ἰησοῦς ⸀εἶπεν· Τί διαλογίζεσθε ἐν ἑαυτοῖς, ὀλιγόπιστοι, ὅτι ἄρτους οὐκ ⸀ἐλάβετε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/008.yaml
  text: But Jesus[a], knowing this, said, “Why are you discussing among yourselves, you of little faith, that you have no bread?”
translation:
  language: sw
  text: Lakini Yesu, akijua hayo, akasema, “Kwa nini mnajadiliana miongoni mwenu, enyi wenye imani haba, kwamba hamkuchukua mikate?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γνοὺς
  choice: akijua hayo
  rationale: Kitenzi-jina cha wakati uliopita kinaonyesha kwamba Yesu alitambua jambo hilo kabla ya kusema; “hayo” linaelekeza kwa mjadala uliotangulia ambao kiwakilishi chake hakikutajwa wazi katika Kigiriki.
- source_word: δὲ
  choice: Lakini
  rationale: 'Huonyesha mpito wenye utofautishaji wa kiasi: wanafunzi wanajadiliana, lakini Yesu anatambua na kuwajibu.'
- source_word: εἶπεν
  choice: akasema
  rationale: Hili ndilo neno la kawaida la masimulizi kwa λέγω; swali lenyewe linafuata katika usemi wa moja kwa moja.
- source_word: Τί
  choice: Kwa nini
  rationale: Katika muundo huu, neno hilo linauliza sababu ya mjadala wao, si tu yaliyomo katika mjadala.
- source_word: διαλογίζεσθε
  choice: mnajadiliana
  rationale: Linaonyesha wanafunzi wakibadilishana mawazo wao kwa wao; “mnajadiliana” ni Kiswahili cha sasa na cha kawaida.
- source_word: ἐν ἑαυτοῖς
  choice: ninyi kwa ninyi
  rationale: Ingawa msemo unaweza pia kumaanisha ndani ya nafsi zao, muktadha unaonyesha mazungumzo kati ya wanafunzi.
- source_word: ὀλιγόπιστοι
  choice: enyi wenye imani haba
  rationale: Huhifadhi karipio la moja kwa moja kuhusu upungufu wa imani bila kulipanua kuwa tamko pana la kimafundisho.
- source_word: ὅτι
  choice: kwamba
  rationale: 'Linaanzisha yaliyomo katika mjadala wao: kwamba hawakuleta mikate.'
- source_word: ἄρτους
  choice: mikate
  rationale: Nomino iko katika wingi na hapa inafaa kutafsiriwa kwa wingi wa kawaida wa Kiswahili.
- source_word: οὐκ ἐλάβετε
  choice: hamkuleta
  rationale: Kimsingi ἐλάβετε ni “mlichukua,” lakini katika muktadha wa safari maana yake ni kutokuchukua mikate pamoja nao, yaani kutokuileta. “Hamkuleta” huwasilisha maana hiyo kwa kawaida bila kuigeuza kuwa hali tu ya kutokuwa na chakula.
theological_decisions:
- issue: Nguvu ya karipio ὀλιγόπιστοι
  choice: enyi wenye imani haba
  alternative: enyi wenye imani ndogo
  rationale: “Imani haba” ni ya heshima na inasomeka kwa kawaida huku ikihifadhi karipio la Yesu kuhusu kutotosha kwa imani yao katika hali hii; haisemi kwamba hawana imani kabisa.
- issue: Uhusiano wa ὅτι na mjadala wao
  choice: kwamba hamkuleta mikate
  alternative: kwa sababu hamkuleta mikate
  rationale: “Kwamba” linaonyesha mada au maudhui ya mjadala wao. “Kwa sababu” lingeweza kueleweka kuwa ukosefu wa mikate ndio sababu tu ya kujadiliana, na hivyo kupunguza utata wa kimuundo wa Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa swali umefanywa wa kawaida bila kuondoa ukali wa karipio. Hakuna tanbihi iliyohitajika kwa kuwa “hamkuleta mikate” inawakilisha kwa uwazi maana ya kimuktadha ya οὐκ ἐλάβετε.
