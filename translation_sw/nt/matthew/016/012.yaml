  text: τότε συνῆκαν ὅτι οὐκ εἶπεν προσέχειν ἀπὸ τῆς ζύμης ⸂τῶν ἄρτων⸃ ἀλλὰ ἀπὸ τῆς διδαχῆς τῶν Φαρισαίων καὶ Σαδδουκαίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/012.yaml
  text: Then they understood that he had not said to beware of the leaven of bread[a], but of the teaching of the Pharisees and Sadducees.
translation:
  language: sw
  text: Ndipo wakaelewa kwamba hakuwa amesema wajihadhari na chachu ya mkate[a], bali na mafundisho ya Mafarisayo na Masadukayo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ya mikate.” Kigiriki kina nomino ya wingi hapa.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Ndipo
  rationale: Huonyesha wakati ambapo wanafunzi hatimaye walipata kuelewa, kwa Kiswahili cha kawaida na cha simulizi.
- source_word: συνῆκαν
  choice: wakaelewa
  rationale: Huwasilisha tendo la kufikia ufahamu bila kuongeza wazo lisilomo katika chanzo.
- source_word: οὐκ εἶπεν
  choice: hakuwa amesema
  rationale: 'Wakati timilifu unaendana na mtiririko wa simulizi: ndipo walipoelewa maana ya kauli aliyokuwa ametoa awali.'
- source_word: προσέχειν
  choice: wajihadhari na
  rationale: Katika muktadha wa onyo, kitenzi hiki humaanisha kuwa macho au kujilinda dhidi ya jambo.
- source_word: ἀπὸ τῆς ζύμης
  choice: na chachu
  rationale: ‘Chachu’ ni neno la kawaida la Kiswahili kwa ζύμη na linahifadhi picha ya sitiari iliyotumiwa katika muktadha.
- source_word: τῶν ἄρτων
  choice: ya mikate
  rationale: Huhifadhi wingi wa nomino ya Kigiriki; tanbihi inaeleza uwezekano wa tafsiri ya jumla ‘ya mkate.’
- source_word: ἀλλὰ
  choice: bali
  rationale: Huonyesha kwa wazi utofauti kati ya maana halisi iliyodhaniwa na maana iliyokusudiwa.
- source_word: διδαχῆς
  choice: mafundisho
  rationale: Ni Kiswahili cha sasa, kinachoeleweka, na huonyesha yaliyofundishwa bila kutumia istilahi nzito ya kidini.
- source_word: Φαρισαίων
  choice: Mafarisayo
  rationale: Ni umbo la kawaida la Kiswahili la jina la kundi hili.
- source_word: Σαδδουκαίων
  choice: Masadukayo
  rationale: Ni umbo la kawaida la Kiswahili la jina la kundi hili.
theological_decisions:
- issue: Nguvu ya kisitiari ya ‘chachu’
  choice: 'Kuhifadhi ‘chachu’ na kuifafanua kwa kiwango ambacho aya yenyewe inafanya: kuwa inahusu mafundisho ya Mafarisayo na Masadukayo.'
  alternative: Kuongeza katika matini maneno kama ‘unafiki’ au ‘mafundisho potovu.’
  rationale: Aya inafafanua chachu kuwa mafundisho, lakini hapa haitaji moja kwa moja sifa nyingine ya kimaadili; tafsiri haipaswi kuingiza ufafanuzi kutoka vifungu sambamba.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Ndipo wakaelewa’ ni mtiririko wa kawaida wa simulizi; ‘wajihadhari’ huhifadhi uzito wa onyo. Alama ya tanbihi [a] imewekwa katika matini kuu.
