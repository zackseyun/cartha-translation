  text: τότε ⸀διεστείλατο τοῖς ⸀μαθηταῖς ἵνα μηδενὶ εἴπωσιν ὅτι αὐτός ⸀ἐστιν ὁ χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/020.yaml
  text: Then he strictly instructed the disciples to tell no one that he is the Messiah[a].
translation:
  language: sw
  text: Kisha akawaagiza kwa ukali wanafunzi wasimwambie mtu yeyote kwamba yeye ndiye Masihi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kristo.” Neno la Kigiriki Χριστός ni cheo chenye maana ya “Mtiwa-Mafuta.”
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: Kisha
  rationale: Kielezi hiki kinaonyesha hatua inayofuata katika simulizi; “Kisha” ni tafsiri fupi na ya kawaida.
- source_word: διεστείλατο
  choice: akawaagiza kwa ukali
  rationale: Kitenzi hiki hapa kinaeleza agizo lenye msisitizo. Kauli hii huhifadhi uzito wa amri bila kudokeza tu hatari kama ambavyo “alionya” ingeweza kufanya.
- source_word: τοῖς μαθηταῖς
  choice: wanafunzi
  rationale: Nomino yenye kibainishi inarejelea kundi la wanafunzi wa Yesu linalojulikana tayari katika muktadha; Kiswahili hakihitaji kibainishi tofauti.
- source_word: ἵνα μηδενὶ εἴπωσιν
  choice: wasimwambie mtu yeyote
  rationale: Muundo wa ἵνα pamoja na hali tegemezi unaeleza yaliyomo katika agizo. “Wasimwambie mtu yeyote” ni Kiswahili cha kawaida kinachoonyesha katazo hilo wazi.
- source_word: ὅτι αὐτός ἐστιν
  choice: kwamba yeye ndiye
  rationale: “Kwamba” hutambulisha ujumbe ambao hawakupaswa kusema, huku “yeye ndiye” ikihifadhi kiwakilishi kilicho wazi na muundo wa utambulisho wa Kigiriki kwa njia ya kawaida katika Kiswahili.
- source_word: ὁ χριστός
  choice: Masihi
  rationale: Χριστός hapa ni cheo cha yule aliyetiwa mafuta, si jina binafsi. “Masihi” ni neno la kawaida la Kiswahili linalohifadhi maana ya cheo hicho.
theological_decisions:
- issue: Tafsiri ya Χριστός kama cheo
  choice: Masihi
  alternative: Kristo
  rationale: Katika muktadha huu Χριστός hutumiwa kama cheo kinachomtambulisha yule aliyetiwa mafuta. “Masihi” huonyesha wazi maana hiyo, huku tanbihi ikihifadhi tafsiri mbadala iliyozoeleka.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Akawaagiza kwa ukali” ni wazi kwa wasomaji wa kawaida na huhifadhi nguvu ya agizo; “yeye ndiye Masihi” ni muundo wa asili unaosisitiza utambulisho bila kuongeza fundisho lisilokuwapo katika chanzo.
