translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Swali la kukemea limehifadhiwa kwa ‘Je, bado…,’ na ‘wala’ inadumisha muundo hasi sambamba. Alama zote za tanbihi zimewekwa katika maandishi.
