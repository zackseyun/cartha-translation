  yaml_path: translation/nt/matthew/016/009.yaml
  text: Do you still not understand[a], nor do you remember the five loaves for the five thousand[b], and how many baskets you gathered?
translation:
  language: sw
  text: Je, bado hamwelewi[a], wala hamkumbuki ile mikate mitano kwa ajili ya wale elfu tano, na mlkusanya vikapu vingapi?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hamjaelewa bado.”
    reason: lexical_alternative
  - marker: b
    text: Au, “mlichukua vikapu vingapi?”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὔπω
  choice: bado ham-
  rationale: Katika swali la kukemea, muundo huu wa Kiswahili unaonyesha kwa kawaida kwamba hadi wakati huo bado hawajaelewa; maana mbadala ya karibu ni ‘hamjaelewa bado.’
- source_word: νοεῖτε
  choice: mnaelewa
  rationale: Kitenzi hiki hapa kinahusu kufahamu maana ya matukio yaliyotangulia, si kuona au kutambua kwa hisi tu.
- source_word: οὐδὲ
  choice: wala
  rationale: ‘Wala’ huunganisha kwa kawaida vifungu viwili hasi katika Kiswahili na kuhifadhi usambamba wa swali.
- source_word: μνημονεύετε
  choice: mnakumbuka
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kukumbuka tukio la awali.
- source_word: τοὺς πέντε ἄρτους
  choice: ile mikate mitano
  rationale: ‘Mikate’ ni namna ya kawaida ya kutaja mikate iliyohusika katika simulizi hili; ‘ile’ inaelekeza kwenye tukio linalojulikana tayari.
- source_word: τῶν πεντακισχιλίων
  choice: ya wale elfu tano
  rationale: Huhifadhi uhusiano wa Kigiriki kwa njia ya asili huku ikirejelea tukio la kuwalisha wale watu elfu tano bila kuongeza nomino isiyotajwa wazi katika mstari.
- source_word: πόσους κοφίνους
  choice: vikapu vingapi
  rationale: Huhifadhi swali kuhusu idadi ya vikapu halisi vilivyohusika.
- source_word: ἐλάβετε
  choice: mlivyokusanya
  rationale: Ingawa λαμβάνω kwa msingi ni ‘chukua’ au ‘pokea,’ katika muktadha wa masalio ya chakula ‘kusanya’ huwasilisha tendo kwa Kiswahili cha kawaida; maana ya karibu zaidi na umbo la kitenzi imetolewa katika tanbihi.
