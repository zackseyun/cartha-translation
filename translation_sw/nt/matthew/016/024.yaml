source:
  edition: SBLGNT
  text: Τότε ὁ Ἰησοῦς εἶπεν τοῖς μαθηταῖς αὐτοῦ· Εἴ τις θέλει ὀπίσω μου ἐλθεῖν, ἀπαρνησάσθω ἑαυτὸν καὶ ἀράτω τὸν σταυρὸν αὐτοῦ καὶ ἀκολουθείτω μοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/024.yaml
  text: Then Jesus said to his disciples[a], “If anyone wants to come after me, let him deny himself and take up his cross and follow me.”
translation:
  language: sw
  text: Ndipo Yesu akawaambia wanafunzi wake, “Mtu yeyote akitaka kuja nyuma yangu, na ajikane mwenyewe, ajitwike msalaba wake, na anifuate.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: Ndipo
  rationale: Kiashiria hiki cha wakati kinaunganisha kauli hii na tukio lililotangulia; “Ndipo” ni cha asili katika simulizi na huhifadhi mfuatano huo.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: wanafunzi wake
  rationale: “Wanafunzi” ni neno la kawaida na sahihi katika muktadha wa Injili, likihifadhi uhusiano wa mwalimu na wale wanaojifunza kwake na kumfuata.
- source_word: Εἴ τις θέλει
  choice: Mtu yeyote akitaka
  rationale: Muundo huu unaonyesha sharti pamoja na hiari. “Mtu yeyote” huhifadhi wigo wa ujumla bila kuingiza jinsia, kwa kuwa Kiswahili hakilazimishi umbo la kiume hapa.
- source_word: ὀπίσω μου ἐλθεῖν
  choice: kuja nyuma yangu
  rationale: Tafsiri hii huhifadhi taswira ya kuwa nyuma ya Yesu na pia haitangulizi kitenzi cha mwisho ἀκολουθείτω kwa kukitafsiri tayari kuwa “kunifuata.”
- source_word: ἀπαρνησάσθω ἑαυτὸν
  choice: ajikane mwenyewe
  rationale: Kauli ya utegemezi ya Kiswahili hutoa amri ya nafsi ya tatu kwa ufasaha. “Ajikane mwenyewe” huhifadhi wazo la kujikana kwa dhati bila kulipanua kuwa fundisho lisilosemwa wazi katika mstari.
- source_word: ἀράτω τὸν σταυρὸν αὐτοῦ
  choice: auchukue msalaba wake
  rationale: “Auchukue” huonyesha kuunyanyua ili kuubeba, na “msalaba wake” huhifadhi gharama binafsi inayodokezwa na kiwakilishi cha Kigiriki.
- source_word: ἀκολουθείτω μοι
  choice: anifuate
  rationale: Kauli ya utegemezi huwasilisha amri kwa kawaida katika Kiswahili. Muktadha wa uanafunzi unadokeza mwendelezo uliomo katika amri ya wakati uliopo ya Kigiriki bila kuongeza neno kama “aendelee.”
theological_decisions:
- issue: Umoja wa kiwakilishi na matumizi ya kiume kwa maana wakilishi katika Kigiriki
  choice: 'Kutumia “mtu yeyote” na vitenzi vya ngeli ya mtu: “akitaka… ajikane… auchukue… anifuate”'
  alternative: Kutaja kwa wazi umbo la kiume, kama “mwanamume yeyote… yeye mwenyewe”
  rationale: Kigiriki kina maumbo ya umoja yaliyo ya kiume kisarufi lakini yanatumika hapa kwa maana wakilishi. Kiswahili sanifu huonyesha umoja na wigo wa ujumla kwa “mtu yeyote” bila kuweka jinsia; hivyo maana ya wote wanaohusika pamoja na umoja wa kisarufi vinahifadhiwa.
- issue: Uhusiano kati ya “kuja nyuma yangu” na “anifuate”
  choice: Kuhifadhi semi zote mbili tofauti
  alternative: Kutafsiri ya kwanza kuwa “akitaka kunifuata”
  rationale: Kigiriki hutumia kwanza taswira ya kuja nyuma ya Yesu, kisha amri ya wazi ya kumfuata. Kuhifadhi tofauti hiyo huepuka kufuta urudiaji wenye maana na mvutano wa picha ya uanafunzi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa amri za nafsi ya tatu umetolewa kwa kauli ya utegemezi, ambayo ni wa kawaida na unaoeleweka. Hakuna tanbihi inayohitajika, kwa sababu Kiswahili huwasilisha kwa asili umoja wa maana wakilishi bila mgongano wa jinsia unaojitokeza katika Kiingereza.
