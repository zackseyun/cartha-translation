  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· Ὁρᾶτε καὶ προσέχετε ἀπὸ τῆς ζύμης τῶν Φαρισαίων καὶ Σαδδουκαίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/006.yaml
  text: But Jesus said to them[a], “Watch out and beware of the leaven of the Pharisees and Sadducees.”
translation:
  language: sw
  text: Lakini Yesu akawaambia, “Angalieni na jihadharini na chachu[a] ya Mafarisayo na Masadukayo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hamira.” Hapa chachu imetumiwa kisitiari; Yesu anaifafanua baadaye katika muktadha huu kuhusiana na mafundisho ya Mafarisayo na Masadukayo.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Lakini
  rationale: Kiunganishi hiki kinaonyesha badiliko lenye utofautishaji mdogo kutoka kwa yaliyotangulia; ‘Lakini’ kinafaa katika mtiririko wa habari.
- source_word: εἶπεν αὐτοῖς
  choice: akawaambia
  rationale: Hii ni namna ya kawaida na ya asili ya Kiswahili ya kusema kwamba Yesu alisema maneno hayo kwao.
- source_word: Ὁρᾶτε
  choice: Angalieni
  rationale: Hapa kitenzi cha kuona kimetumiwa kama onyo la kuwa macho, si amri ya kutazama kitu kwa macho tu.
- source_word: προσέχετε
  choice: jihadharini
  rationale: Kitenzi hiki kinaimarisha onyo. Kuyaweka maneno ‘Angalieni, jihadharini’ kunahifadhi urudiaji wa msisitizo uliopo katika Kigiriki huku kukiwa kwa asili katika Kiswahili.
- source_word: ἀπὸ
  choice: na
  rationale: Pamoja na kitenzi ‘jihadharini,’ Kiswahili kwa kawaida hutumia ‘na’ kutaja jambo la kuepukwa.
- source_word: ζύμης
  choice: chachu
  rationale: ‘Chachu’ ni neno la kawaida la Kiswahili linalohifadhi picha ya kitu kinachochachusha donge na pia linaweza kubeba maana ya sitiari bila kuifafanua mapema.
- source_word: Φαρισαίων
  choice: Mafarisayo
  rationale: Hili ndilo umbo la kawaida la Kiswahili la jina la kundi hili.
- source_word: Σαδδουκαίων
  choice: Masadukayo
  rationale: Hili ndilo umbo la kawaida la Kiswahili la jina la kundi hili.
theological_decisions:
- issue: Nguvu ya kisitiari ya ζύμη
  choice: Kuhifadhi ‘chachu’ kama sitiari bila kuifafanua katika mstari wenyewe.
  alternative: mafundisho au ushawishi
  rationale: Katika muktadha unaofuata Yesu anaeleza sitiari hiyo, lakini mstari huu wenyewe unasema ‘chachu.’ Kuihifadhi huzuia kuleta ufafanuzi wa baadaye mapema na kuhifadhi mvutano wa simulizi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ‘Angalieni, jihadharini’ ni onyo la moja kwa moja linalohifadhi msisitizo wa vitenzi viwili vya Kigiriki.
