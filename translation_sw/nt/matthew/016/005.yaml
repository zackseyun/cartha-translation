  yaml_path: translation/nt/matthew/016/005.yaml
  text: And when the disciples came to the other side[a], they had forgotten to take bread.
translation:
  language: sw
  text: Wanafunzi walipofika ng’ambo, walikuwa wamesahau kuchukua mikate.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλθόντες
  choice: walipofika
  rationale: Kitenzi kishirikishi cha wakati uliopita kimetafsiriwa kwa kishazi cha wakati, ili kuonyesha kwamba kufika kulitangulia hali inayosimuliwa katika kitenzi kikuu.
- source_word: οἱ μαθηταὶ
  choice: wanafunzi
  rationale: Hili ndilo neno la kawaida na linalofaa katika Injili kwa wale waliomfuata na kufundishwa na Yesu.
- source_word: εἰς τὸ πέραν
  choice: ng’ambo
  rationale: Ni usemi wa asili wa Kiswahili unaomaanisha upande mwingine wa ziwa katika muktadha huu.
- source_word: ἐπελάθοντο
  choice: walikuwa wamesahau
  rationale: Muundo huu unaonyesha kwa kawaida kwamba kusahau kulitokea kabla ya wanafunzi kufika ng’ambo.
- source_word: ἄρτους
  choice: mikate
  rationale: Umoja wa Kigiriki ni wa wingi, hivyo “mikate” huhifadhi idadi ya matini chanzi na ni ya kawaida katika Kiswahili.
- source_word: λαβεῖν
  choice: kuchukua
  rationale: Kitenzi hiki kinakamilisha maana ya “wamesahau” na kuakisi moja kwa moja wazo la kuchukua mikate pamoja nao.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na rahisi kueleweka. “Ng’ambo” limetumiwa badala ya usemi mrefu “upande mwingine,” na wingi halisi wa “mikate” umehifadhiwa bila kuhitaji tanbihi.
