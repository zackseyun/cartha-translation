  text: κἀγὼ δέ σοι λέγω ὅτι σὺ εἶ Πέτρος, καὶ ἐπὶ ταύτῃ τῇ πέτρᾳ οἰκοδομήσω μου τὴν ἐκκλησίαν, καὶ πύλαι ᾅδου οὐ κατισχύσουσιν αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/018.yaml
  text: And I also say to you that you are Peter[a], and on this rock I will build my church[b], and the gates of Hades will not prevail against it.
translation:
  language: sw
  text: Nami nakuambia kwamba wewe ni Petro, na juu ya mwamba huu[a] nitalijenga kanisa langu, wala milango ya Kuzimu[b] hazitalishinda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika Kigiriki kuna mchezo wa maneno kati ya jina Petro (Petros) na “mwamba” (petra). “Mwamba huu” unaweza kueleweka kuwa Petro, ungamo lake, au Petro akiwa muungamaji na mwakilishi wa mitume.
    reason: alternative_reading
  - marker: b
    text: 'Kigiriki: Hades, yaani ulimwengu wa wafu. Kwa mapokeo hutafsiriwa “Jahannamu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ δέ
  choice: Nami
  rationale: Muundo huu unaendeleza jibu la Yesu kwa Petro na kudumisha msisitizo wa κἀγώ bila kufanya δέ kuwa tofauti kali.
- source_word: σοι λέγω
  choice: nakuambia
  rationale: Ni Kiswahili cha kawaida na chenye hadhi kwa utangulizi wa kauli ya moja kwa moja, kikionyesha wazi anayesemeshwa.
- source_word: Πέτρος
  choice: Petro
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili; tanbihi inaeleza mchezo wa maneno wa Kigiriki ambao hauwezi kuhifadhiwa kikamilifu kwa kutumia “mwamba.”
- source_word: ἐπὶ ταύτῃ τῇ πέτρᾳ
  choice: juu ya mwamba huu
  rationale: Huhifadhi taswira ya msingi wa jengo na nguvu ya kiashiria ταύτῃ, bila kuamua anayerejelewa na “mwamba huu.”
- source_word: οἰκοδομήσω
  choice: nitalijenga
  rationale: Huhifadhi sitiari halisi ya kujenga na hutumia kiambishi cha yambwa kinachorejelea “kanisa.”
- source_word: μου τὴν ἐκκλησίαν
  choice: kanisa langu
  rationale: “Kanisa” ni neno la kawaida la Kiswahili kwa jumuiya ya waumini katika muktadha huu, nalo huhifadhi umilikaji ulio katika μου.
- source_word: πύλαι ᾅδου
  choice: milango ya Kuzimu
  rationale: “Kuzimu” hurejelea makao au ulimwengu wa wafu na huepuka kuchanganya ᾅδης na Gehena au adhabu ya mwisho; “milango” huhifadhi taswira ya Kigiriki.
- source_word: οὐ κατισχύσουσιν αὐτῆς
  choice: haitalishinda
  rationale: Kitenzi hiki kinaonyesha kutoweza kulishinda au kulizidi nguvu kanisa; umbo la Kiswahili ni la asili na hudumisha maana ya upinzani.
theological_decisions:
- issue: Kirejelewa cha “mwamba huu” (πέτρα)
  choice: Maneno “mwamba huu” yameachwa bila kubainisha kirejelewa chake.
  alternative: Kumtambua Petro peke yake, ungamo la Petro peke yake, au Petro katika nafasi yake ya muungamaji na mwakilishi wa mitume.
  rationale: Kigiriki kina mchezo wa maneno kati ya Πέτρος na πέτρα, lakini hakitoi ufafanuzi wa moja kwa moja unaomaliza mjadala wa kirejelewa. Tafsiri inadumisha utata na mvutano huo wa kiteolojia.
- issue: Maana ya ᾅδης
  choice: Kuzimu
  alternative: Jahannamu; ulimwengu wa wafu
  rationale: Katika mstari huu ᾅδης ni makao au ulimwengu wa wafu, si lazima mahali pa adhabu ya mwisho. “Kuzimu” ni neno la Kiswahili linalodumisha tofauti hiyo, huku tanbihi ikifafanua maana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Nami nakuambia” ni usemi wa asili unaodumisha mwitikio wa Yesu; “kanisa langu” linaeleweka kwa wasomaji wa kawaida. Tanbihi zimewekwa moja kwa moja baada ya “mwamba huu” na “Kuzimu,” ambako maelezo yake yanahusika.
