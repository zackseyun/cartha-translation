  text: Wala hamkumbuki mikate saba ya wale elfu nne, na vikapu vikubwa vingapi mlikusanya?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐδὲ
  choice: Wala
  rationale: Katika mwendelezo wa maswali ya Yesu, neno hili linaongeza jambo jingine ambalo wanafunzi hawakulifikiria; “Wala” huhifadhi uhusiano huo wa kukanusha kwa Kiswahili cha asili.
- source_word: τοὺς ἑπτὰ ἄρτους
  choice: mikate saba
  rationale: ἄρτοι hapa ni mikate iliyotumiwa kuwalisha watu; “mikate saba” ni tafsiri ya kawaida na halisi.
- source_word: τῶν τετρακισχιλίων
  choice: kwa ajili ya wale elfu nne
  rationale: Genitivi inaunganisha mikate na tukio la kuwalisha watu elfu nne; muundo huu unaeleza uhusiano huo kwa uwazi bila kudai kwamba mikate ilikuwa mali yao.
- source_word: πόσας
  choice: vingapi
  rationale: Ni kivumishi cha kuuliza kinachopatana na “vikapu” katika Kiswahili.
- source_word: σπυρίδας
  choice: vikapu vikubwa
  rationale: σπυρίς hurejelea aina kubwa ya kikapu na hutofautishwa na κόφινος katika masimulizi ya kulisha watu; “vikapu vikubwa” huhifadhi tofauti hiyo.
- source_word: ἐλάβετε
  choice: mlitwaa
  rationale: Katika muktadha wa kukusanya masazo, “mlitwaa” hutoa kwa ufupi maana ya kuvichukua au kuvikusanya vikapu vilivyojaa.
