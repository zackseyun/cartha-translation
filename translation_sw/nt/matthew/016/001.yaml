id: MAT.16.1
reference: Matthew 16:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ προσελθόντες οἱ Φαρισαῖοι καὶ Σαδδουκαῖοι πειράζοντες ἐπηρώτησαν αὐτὸν σημεῖον ἐκ τοῦ οὐρανοῦ ἐπιδεῖξαι αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/001.yaml
  text: And the Pharisees and Sadducees came and[a], testing him, asked him to show them a sign from heaven.
translation:
  language: sw
  text: Mafarisayo na Masadukayo wakamjia Yesu, wakimjaribu[a], wakamwomba awaonyeshe ishara kutoka mbinguni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakimtahini,” au, “wakijaribu kumtega.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθόντες
  choice: wakamjia Yesu
  rationale: Kitenzi hiki kinaonyesha kuwa walimkaribia. Kutaja Yesu kwa jina kunafanya kiwakilishi cha Kigiriki kiwe wazi na sentensi iwe ya kawaida katika Kiswahili.
- source_word: Φαρισαῖοι
  choice: Mafarisayo
  rationale: Hili ndilo jina lililozoeleka katika tafsiri za Biblia za Kiswahili kwa kundi hili la Kiyahudi.
- source_word: Σαδδουκαῖοι
  choice: Masadukayo
  rationale: Hili ndilo jina lililozoeleka katika tafsiri za Biblia za Kiswahili kwa kundi hili la Kiyahudi.
- source_word: πειράζοντες
  choice: wakimjaribu
  rationale: Neno hili linahifadhi maana ya kumtia mtu katika jaribio au kumtahini na, katika muktadha huu, linaweza pia kudokeza nia ya kumtega bila kuifanya tafsiri kuu iwe fafanuzi kupita kiasi.
- source_word: ἐπηρώτησαν
  choice: wakamwomba
  rationale: Katika muundo unaofuatwa na kitenzi-jina ἐπιδεῖξαι, maana ni kumwomba afanye jambo. Kiswahili cha kawaida hutumia 'kumwomba' badala ya 'kumuuliza aonyeshe.'
- source_word: σημεῖον
  choice: ishara
  rationale: Tafsiri hii inahifadhi neno la jumla la Kigiriki bila kuongeza moja kwa moja kwamba ishara hiyo ni muujiza, ingawa muktadha unaweza kudokeza hivyo.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: kutoka mbinguni
  rationale: Hii ni njia ya kawaida na wazi ya kuonyesha chanzo au asili ya ishara.
- source_word: ἐπιδεῖξαι
  choice: awaonyeshe
  rationale: Hutoa kwa kawaida maana ya kuwaonyesha au kuwadhihirishia jambo waliloomba.
theological_decisions:
- issue: Nia yenye uhasama katika ombi la Mafarisayo na Masadukayo
  choice: wakimjaribu
  alternative: wakimshawishi; wakijaribu kumtega
  rationale: '''Wakimjaribu'' huhifadhi upana wa πειράζοντες na mvutano wa simulizi. Haifanyi nia yao kuwa ya kawaida tu, wala haisemi wazi zaidi ya Kigiriki kwamba walikuwa wakimtega.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa vitenzi vinavyofuatana kwa 'waka-' unaendeleza mtiririko wa simulizi. 'Mbinguni' hapa ni usemi wa kawaida wa Kiswahili kwa chanzo cha kimbingu.
