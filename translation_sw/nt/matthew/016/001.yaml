  source_fidelity: 'Tafsiri inawakilisha vipashio vyote vya Kigiriki kwa uaminifu: makundi yote mawili yanamjia Yesu, tendo lao linaelezwa kwa participle ya uhasama/majaribio, na wanamwomba awaonyeshe ishara yenye chanzo cha mbinguni. "Wakamwomba awaonyeshe" ni uwasilishaji sahihi na wa kawaida wa ἐπηρώτησαν ... ἐπιδεῖξαι αὐτοῖς.'
