  text: μέλλει γὰρ ὁ υἱὸς τοῦ ἀνθρώπου ἔρχεσθαι ἐν τῇ δόξῃ τοῦ πατρὸς αὐτοῦ μετὰ τῶν ἀγγέλων αὐτοῦ, καὶ τότε ἀποδώσει ἑκάστῳ κατὰ τὴν πρᾶξιν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/027.yaml
  text: For the Son of Man is about to come in the glory of his Father with his angels[b][a], and then he will repay each one according to his deed.
translation:
  language: sw
  text: Kwa maana Mwana wa Adamu anakaribia kuja[a] katika utukufu wa Baba yake pamoja na malaika zake; ndipo atamlipa kila mtu kulingana na tendo lake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “atakuja” au “anakwenda kuja.” Kigiriki hutumia usemi wenye wazo la tukio linalokaribia.
    reason: lexical_alternative
  - marker: b
    text: Au, “kulingana na aliyoyafanya.” Kigiriki kina nomino ya umoja, “tendo,” inayotumiwa kwa maana ya mwenendo au matendo ya kila mtu mmoja mmoja.
    reason: lexical_alternative
lexical_decisions:
- source_word: μέλλει
  choice: yu karibu
  rationale: Pamoja na kitenzi-jina ‘kuja,’ usemi huu unahifadhi maana ya tukio linalokaribia au lililo mbele, badala ya kuufanya kuwa wakati ujao wa kawaida tu.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Kiunganishi hiki kinatoa sababu ya kauli iliyotangulia; ‘Kwa maana’ ni cha kawaida na chenye hadhi katika Kiswahili.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  rationale: Huu ni usemi uliozoeleka katika tafsiri za Biblia na unadumisha mwangwi wake wa kimaandiko.
- source_word: ἔρχεσθαι
  choice: kuja
  rationale: Ni kijalizo cha μέλλει na tafsiri ya moja kwa moja, ya kawaida, ya kitenzi hiki.
- source_word: ἐν τῇ δόξῃ τοῦ πατρὸς αὐτοῦ
  choice: katika utukufu wa Baba yake
  rationale: ‘Katika’ inadumisha ἐν na kuonyesha mazingira au udhihirisho wa utukufu ambamo kuja huko kutatokea.
- source_word: μετὰ τῶν ἀγγέλων αὐτοῦ
  choice: pamoja na malaika zake
  rationale: Huwasilisha wazi maana ya kuandamana iliyo katika μετά pamoja na umilikaji wa malaika hao.
- source_word: καὶ τότε
  choice: ndipo
  rationale: '‘Ndipo’ huonyesha kwa asili mfuatano wa wakati: kwanza kuja, kisha kulipa.'
- source_word: ἀποδώσει
  choice: atakapomlipa
  rationale: ‘Kulipa’ huonyesha kumpa mtu kinachomstahili katika hukumu bila kuamua mapema kama matokeo ni thawabu au adhabu.
- source_word: ἑκάστῳ
  choice: kila mtu
  rationale: Huwakilisha nguvu ya mgawanyo ya umoja wa Kigiriki kwa Kiswahili cha kawaida.
- source_word: κατὰ τὴν πρᾶξιν αὐτοῦ
  choice: kulingana na tendo lake
  rationale: ‘Tendo’ linadumisha umoja wa πρᾶξις, huku muktadha ukiruhusu lieleweke kwa maana ya matendo au mwenendo wa kila mtu.
theological_decisions:
- issue: Nguvu ya kieskatolojia ya μέλλει kuhusu kuja kwa Mwana wa Adamu
  choice: Kudumisha wazo la ukaribu kwa ‘yu karibu kuja.’
  alternative: ‘atakuja’ au ‘anakuja’
  rationale: Kigiriki kina μέλλω pamoja na kitenzi-jina, ambacho huongeza wazo la jambo lililo karibu au linalotarajiwa. Tafsiri haiondoi mvutano huo ili kutatua mjadala wa wakati wa kutimia kwake.
- issue: Hukumu kulingana na tendo
  choice: ‘atakamplipa kila mtu kulingana na tendo lake’
  alternative: ‘atampa kila mtu thawabu kulingana na aliyoyafanya’ au ‘atamlipa kila mtu kulingana na matendo yake’
  rationale: Kauli inadumisha ulipaji wa mtu mmoja mmoja bila kuingiza mfumo mpana wa kimafundisho. ‘Kulipa’ haifungi matokeo kuwa thawabu pekee, na ‘tendo’ linahifadhi umoja wa Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Yu karibu’ limetumiwa badala ya ‘yuko karibu’ kwa kuwa kinachokaribia ni kitendo cha kuja, si umbali wa mahali. Alama za tanbihi zimewekwa mara baada ya vifungu vinavyohusika.
