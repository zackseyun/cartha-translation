base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/011.yaml
  text: How do you not understand that I did not speak to you about bread? But beware of the leaven of the Pharisees and Sadducees[a][b].
translation:
  language: sw
  text: Imekuwaje hamwelewi kwamba sikusema nanyi kuhusu mikate? Lakini jihadharini na chachu ya Mafarisayo na Masadukayo.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Jilindeni dhidi ya chachu ya Mafarisayo na Masadukayo.”
    reason: lexical_alternative
  - marker: b
    text: “Chachu” ni sitiari hapa; katika mstari unaofuata inaelezwa kuwa mafundisho ya Mafarisayo na Masadukayo.
    reason: cross_reference
lexical_decisions:
- source_word: πῶς οὐ νοεῖτε
  choice: Imekuwaje hamwelewi
  rationale: Kauli hii ni swali la kukemea kuhusu kushindwa kuelewa. “Imekuwaje hamwelewi” ni Kiswahili cha kawaida kinachodumisha nguvu ya πῶς bila kuibadili kuwa swali la sababu pekee.
- source_word: ὅτι οὐ περὶ ἄρτων εἶπον ὑμῖν
  choice: kwamba sikuwa nikisema nanyi kuhusu mikate
  rationale: “Kuhusu mikate” hudumisha wingi wa ἄρτων na inafaa katika muktadha wa mikate iliyotajwa. “Sikuwa nikisema nanyi” huwasilisha kwa kawaida kwamba maneno ya Yesu hayakuhusu mikate.
- source_word: προσέχετε
  choice: jihadharini
  rationale: Kitenzi hiki hapa ni amri ya kuonya, si mwito wa kusikiliza tu. “Jihadharini” huonyesha wazi tahadhari dhidi ya hatari.
- source_word: δὲ
  choice: Lakini
  rationale: δὲ inaleta badiliko lenye utofautishaji kutoka katika kutokuelewa kwao hadi kwenye onyo halisi; “Lakini” huonyesha uhusiano huo kwa njia ya kawaida.
- source_word: ἀπὸ τῆς ζύμης
  choice: na chachu
  rationale: Pamoja na προσέχετε, ἀπό hutaja kitu ambacho mtu anapaswa kujilinda nacho. Kiswahili kwa kawaida husema “jihadharini na.” “Chachu” huhifadhi sitiari ya ζύμη na inaeleweka kwa wasomaji wa sasa.
- source_word: τῶν Φαρισαίων καὶ Σαδδουκαίων
  choice: ya Mafarisayo na Masadukayo
  rationale: Haya ndiyo majina ya kawaida ya Kiswahili kwa makundi haya ya Kiyahudi. Muundo wa “ya” unaonyesha chachu inayohusishwa nao au iliyo tabia yao.
theological_decisions:
- issue: Maana ya kisitiari ya “chachu”
  choice: Kudumisha sitiari “chachu” katika mstari wenyewe bila kuibadili kuwa “mafundisho.”
  alternative: Lakini jihadharini na mafundisho ya Mafarisayo na Masadukayo.
  rationale: Mstari unaofuata unaeleza sitiari hiyo kuwa mafundisho yao, lakini mstari huu wenyewe unasema ζύμη, “chachu.” Kuidumisha kunahifadhi namna hoja ya simulizi inavyofunuliwa na hakutangulizi ufafanuzi wa mstari unaofuata.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini kinachoeleweka kwa urahisi. “Imekuwaje hamwelewi” huhifadhi swali la kukemea kwa usemi wa kawaida; “jihadharini” huwasilisha onyo kwa uwazi. Sitiari ya “chachu” imehifadhiwa.
