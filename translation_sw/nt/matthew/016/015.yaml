  text: Anawaambia, “Lakini ninyi mnasema mimi ni nani?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει αὐτοῖς
  choice: Anawaambia
  rationale: Kauli hii ya wakati uliopo inahifadhi uhai wa wakati uliopo wa kihistoria katika Kigiriki, huku kiambishi -wa- kikionyesha wazi kuwa anasema kwao.
- source_word: Ὑμεῖς δὲ
  choice: Lakini ninyi
  rationale: δὲ inaonyesha tofauti na maoni ya watu wengine yaliyotajwa kabla, na kiwakilishi cha wazi Ὑμεῖς kinasisitiza wanafunzi wenyewe; Kiswahili cha “Lakini ninyi” kinahifadhi yote mawili kwa kawaida.
- source_word: τίνα με λέγετε εἶναι
  choice: mnasema mimi ni nani?
  rationale: Kigiriki kimetumia muundo wa yambwa pamoja na kitenzi-jina, ambao kwa Kiswahili cha kawaida unaelezwa vizuri kwa kishazi “mimi ni nani.” Muundo huu unahifadhi swali kuhusu utambulisho wa Yesu bila kulifafanua zaidi.
theological_decisions:
- issue: Msisitizo wa jibu la wanafunzi wenyewe
  choice: Lakini ninyi mnasema mimi ni nani?
  alternative: Nanyi, mnasema mimi ni nani?
  rationale: “Lakini” inaonyesha wazi tofauti kati ya maoni ya watu na jibu la wanafunzi, huku “ninyi” ikihifadhi msisitizo wa kiwakilishi cha Kigiriki bila kuingiza ungamo la kiteolojia ambalo bado halijatolewa katika mstari huu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na ya kawaida. Wakati uliopo wa kihistoria umehifadhiwa kwa “Anawaambia.” Hakuna tanbihi iliyohitajika kwa sababu Kiswahili kinaweza kuwasilisha kwa kawaida muundo wa Kigiriki kama “mimi ni nani” bila kupoteza maana.
