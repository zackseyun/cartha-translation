  text: Γενεὰ πονηρὰ καὶ μοιχαλὶς σημεῖον ἐπιζητεῖ, καὶ σημεῖον οὐ δοθήσεται αὐτῇ εἰ μὴ τὸ σημεῖον ⸀Ἰωνᾶ. καὶ καταλιπὼν αὐτοὺς ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/004.yaml
  text: An evil and adulterous generation seeks a sign[a], and no sign will be given to it except the sign of Jonah. And leaving them[b], he went away.
translation:
  language: sw
  text: Kizazi kiovu na kizinzi[a] hutafuta ishara, wala hakitapewa ishara isipokuwa ishara ya Yona.[b] Akawaacha, akaenda zake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kisicho mwaminifu.” Kigiriki kinasema “kizinzi,” huenda kikirejelea lugha ya kinabii kuhusu watu kutokuwa waaminifu kwa Mungu.
    reason: lexical_alternative
  - marker: b
    text: Mathayo 12:39–40 hurejelea siku tatu mchana na usiku za Yona na kuhusisha mfano huo na Mwana wa Adamu.
    reason: cross_reference
lexical_decisions:
- source_word: Γενεὰ
  choice: kizazi
  rationale: Neno hili kwa kawaida humaanisha kizazi au kundi la watu wa wakati mmoja. “Kizazi” linadumisha maana iliyozoeleka katika Mathayo bila kufafanua kupita kiasi.
- source_word: πονηρὰ
  choice: kiovu
  rationale: Hili ni neno la moja kwa moja na la kawaida linaloonyesha uovu wa kimaadili.
- source_word: μοιχαλὶς
  choice: kizinzi
  rationale: Linahifadhi sitiari kali ya uzinzi katika Kigiriki, huku likiacha wazi mwangwi unaowezekana wa lugha ya kinabii kuhusu kutokuwa mwaminifu kwa Mungu.
- source_word: σημεῖον
  choice: ishara
  rationale: “Ishara” ni tafsiri ya moja kwa moja; kuongeza “ya kimiujiza” kungefafanua zaidi ya yale yanayosemwa wazi katika Kigiriki.
- source_word: ἐπιζητεῖ
  choice: hutafuta
  rationale: Kitenzi kinaweza kumaanisha kutafuta kwa bidii au kudai. “Hutafuta” ni cha kawaida na kinaacha muktadha uonyeshe uhasama wa ombi hilo.
- source_word: δοθήσεται
  choice: hakitapewa
  rationale: Hii inadumisha hali ya kutendwa ya kitenzi cha Kigiriki na upatanisho wa kisarufi na “kizazi.”
- source_word: εἰ μὴ
  choice: isipokuwa
  rationale: Kirai hiki kinaonyesha kwamba ishara ya Yona ndiyo pekee iliyoondolewa katika katazo hilo.
- source_word: τὸ σημεῖον Ἰωνᾶ
  choice: ishara ya Yona
  rationale: Muundo huu wa moja kwa moja unahifadhi ufupi na uwezekano wa maana zaidi ya moja bila kuingiza maelezo kutoka kifungu kingine katika matini kuu.
- source_word: καταλιπὼν αὐτοὺς
  choice: akawaacha
  rationale: Tafsiri hii ya kawaida inawakilisha tendo lililotangulia kuondoka kwake.
- source_word: ἀπῆλθεν
  choice: akaondoka
  rationale: Ni usemi wa sasa, wazi na wa asili unaoonyesha kwamba Yesu alitoka mahali walipokuwa.
theological_decisions:
- issue: Maana ya “kizazi kizinzi”
  choice: Sitiari ya uzinzi imedumishwa katika matini kuu.
  alternative: “Kizazi kisicho mwaminifu”
  rationale: Huenda lugha hii ina mwangwi wa manabii kuhusu kutokuwa mwaminifu kwa agano, lakini Kigiriki kinatumia sitiari ya uzinzi. Kuitunza kunadumisha ukali na mvutano wa kiteolojia bila kuifungia katika ufafanuzi mmoja.
- issue: Maana ya “ishara ya Yona”
  choice: Kirai kimeachwa kwa tafsiri ya moja kwa moja bila kukifafanua katika matini kuu.
  alternative: Kukitaja wazi kuwa ishara ya kifo na ufufuo wa Yesu
  rationale: Mathayo 12:39–40 inatoa ufafanuzi zaidi, lakini mstari huu wenyewe unaacha kirai hicho kifupi. Maelezo hayo hayapaswi kuingizwa moja kwa moja katika matini.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaoeleweka kwa urahisi. “Kizinzi” kimedumisha sitiari ya matini chanzi; tanbihi inatoa maana mbadala ya kutokuwa mwaminifu. Alama za tanbihi [a] na [b] zimewekwa moja kwa moja baada ya maneno yanayohusika.
