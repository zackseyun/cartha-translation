id: MAT.16.19
reference: Matthew 16:19
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ⸀δώσω σοι τὰς ⸀κλεῖδας τῆς βασιλείας τῶν οὐρανῶν, καὶ ὃ ⸀ἐὰν δήσῃς ἐπὶ τῆς γῆς ἔσται δεδεμένον ἐν τοῖς οὐρανοῖς, καὶ ὃ ⸁ἐὰν λύσῃς ἐπὶ τῆς γῆς ἔσται λελυμένον ἐν τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/019.yaml
  text: I will give you the keys of the kingdom of heaven[a], and whatever you bind on earth will have been bound in heaven[c][b], and whatever you loose on earth will have been loosed in heaven.
translation:
  language: sw
  text: Nitakupa funguo za ufalme wa mbinguni[a]. Chochote utakachofunga duniani kitakuwa kimefungwa mbinguni[b][c], na chochote utakachofungua duniani kitakuwa kimefunguliwa mbinguni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa kufuata maneno ya Kigiriki kwa karibu zaidi, “ufalme wa mbingu.” Mathayo hutumia usemi huu mara nyingi.
    reason: lexical_alternative
  - marker: b
    text: Tafsiri nyingine husema “kitafungwa … kitafunguliwa.” Muundo wa Kigiriki unaweza kueleweka kwa usahihi zaidi kuwa “kitakuwa kimefungwa … kitakuwa kimefunguliwa.”
    reason: alternative_reading
  - marker: c
    text: Maneno “kufunga” na “kufungua” yanaweza kuwa na maana ya kukataza na kuruhusu, au kuweka wajibu au kuuondoa; hata hivyo, tafsiri imehifadhi sitiari ya Kigiriki.
    reason: cultural_note
lexical_decisions:
- source_word: δώσω σοι
  choice: Nitakupa
  rationale: Kitenzi cha wakati ujao pamoja na yambwa isiyo ya moja kwa moja kinatafsiriwa kwa muundo wa kawaida na wa moja kwa moja wa Kiswahili.
- source_word: κλεῖδας
  choice: funguo
  rationale: Wingi halisi umehifadhiwa, pamoja na sitiari yake, bila kuifafanua kuwa mfumo fulani wa mamlaka.
- source_word: βασιλείας τῶν οὐρανῶν
  choice: ufalme wa mbinguni
  rationale: Huu ni usemi wa kawaida, wa asili na unaoeleweka katika Kiswahili kwa tamko la Mathayo; wingi wa Kigiriki umetajwa katika tanbihi.
- source_word: ὃ ἐὰν
  choice: chochote utakacho-
  rationale: Muundo huu unaonyesha jambo lolote bila kulibainisha; ‘chochote’ ni wa asili katika Kiswahili na unahifadhi upana huo.
- source_word: δήσῃς
  choice: utakachofunga
  rationale: ‘Funga’ inahifadhi sitiari ya Kigiriki na uzito wake wa kimamlaka bila kuiwekea tafsiri finyu.
- source_word: ἐπὶ τῆς γῆς
  choice: duniani
  rationale: Huu ndio usemi mfupi na wa kawaida wa Kiswahili unaolingana na utofautishaji wa duniani na mbinguni.
- source_word: ἔσται δεδεμένον
  choice: kitakuwa kimefungwa
  rationale: Muundo wa ‘kitakuwa’ pamoja na hali timilifu ‘kimefungwa’ unaonyesha hali ya wakati ujao inayotokana na tendo lililokwisha kutendwa, sawasawa na kitenzi cha kuwa cha wakati ujao pamoja na participio timilifu ya kutendwa katika Kigiriki.
- source_word: λύσῃς
  choice: utakachofungua
  rationale: ‘Fungua’ ni jozi ya asili ya ‘funga’ katika Kiswahili na inahifadhi sitiari bila kuibadili moja kwa moja kuwa ‘ruhusu.’
- source_word: ἔσται λελυμένον
  choice: kitakuwa kimefunguliwa
  rationale: Muundo wa wakati ujao timilifu unalingana na ἔσται pamoja na participio timilifu ya kutendwa na kudumisha ulinganifu wa vifungu viwili.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: mbinguni
  rationale: Ni locative ya kawaida ya Kiswahili kwa mahali pa kimbingu na inafanya utofautishaji na ‘duniani’ kuwa wazi.
theological_decisions:
- issue: Hali ya vitenzi katika kauli ya kufunga na kufungua na maana yake ya kitheolojia
  choice: kitakuwa kimefungwa / kitakuwa kimefunguliwa
  alternative: kitafungwa / kitafunguliwa
  rationale: Kigiriki ἔσται pamoja na participio timilifu ya kutendwa kinaweza kuonyesha hali ya wakati ujao inayotokana na jambo lililokwisha kutendwa. Tafsiri hii inahifadhi nguvu hiyo ya kisarufi na uwezekano kwamba tendo la duniani linalingana na uamuzi wa mbinguni, bila kulazimisha fundisho maalumu kuhusu mamlaka ya kanisa.
- issue: Maana ya funguo za ufalme wa mbinguni
  choice: Sitiari ya ‘funguo’ imehifadhiwa bila ufafanuzi ndani ya matini.
  alternative: mamlaka ya kuingiza na kuzuia; mamlaka ya uwakili
  rationale: Funguo huenda zinaashiria mamlaka, lakini mstari wenyewe unatumia picha hiyo. Kuihifadhi huepuka kuingiza mfumo maalumu wa kikanisa ambao haujaelezwa wazi hapa.
- issue: Maana ya kufunga na kufungua
  choice: Maneno ya kisitiari ‘funga’ na ‘fungua’ yamehifadhiwa.
  alternative: kataza na ruhusu; weka na ondoa wajibu
  rationale: Maneno hayo yanaweza kuwa na matumizi ya kimamlaka au kisheria, lakini matini haiwekei hapa maana moja pekee. Tanbihi inaeleza uwezekano huo bila kuufanya kuwa tafsiri pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaosomeka kwa urahisi. ‘Nitakupa,’ ‘duniani,’ na ‘mbinguni’ ni miundo ya kawaida; wakati huohuo ‘kitakuwa kimefungwa/kimefunguliwa’ umechaguliwa ili kuhifadhi kwa kadiri inayowezekana hali timilifu ya Kigiriki bila kufanya sentensi kuwa ya kigeni. Sitiari na utata halisi wa kifungu zimehifadhiwa.
