  text: εἰς ὃ καὶ προσευχόμεθα πάντοτε περὶ ὑμῶν, ἵνα ὑμᾶς ἀξιώσῃ τῆς κλήσεως ὁ θεὸς ἡμῶν καὶ πληρώσῃ πᾶσαν εὐδοκίαν ἀγαθωσύνης καὶ ἔργον πίστεως ἐν δυνάμει,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/011.yaml
  text: To this end also we always pray for you[a], that our God may count you worthy of the calling and may fulfill every good resolve and work of faith with power[c][b],
translation:
  language: sw
  text: Kwa kusudi hilo pia tunawaombea daima, ili Mungu wetu awahesabu kuwa wastahili wa mwito[a], na atimize kila azimio jema[b] na kila kazi ya imani[c] kwa nguvu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “awafanye wastahili wa mwito.” Kitenzi cha Kigiriki kinaweza kumaanisha ama “kuwahesabu/kuwaona kuwa wanastahili” ama “kuwafanya wastahili.”
    reason: alternative_reading
  - marker: b
    text: Au, “kila kusudi la wema” au “kila azimio la kutenda mema.”
    reason: lexical_alternative
  - marker: c
    text: “Kazi ya imani” inaweza pia kueleweka kuwa “kazi inayotokana na imani”; neno “imani” linaweza pia kutafsiriwa “uaminifu” katika muktadha huu.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ὃ
  choice: Kwa kusudi hilo
  rationale: Ni kishazi cha kurejelea yaliyoelezwa kabla na kinaonyesha lengo; tafsiri hii ni ya asili katika Kiswahili na inadumisha maana ya kusudi.
- source_word: καὶ
  choice: pia
  rationale: Inaonyesha nyongeza au mkazo bila kuongeza maana isiyokuwapo katika chanzo.
- source_word: προσευχόμεθα πάντοτε περὶ ὑμῶν
  choice: tunawaombea daima
  rationale: Wakati wa sasa pamoja na πάντοτε unaonyesha tendo la kawaida linaloendelea; ‘kuwaombea’ ni usemi wa kawaida wa Kiswahili.
- source_word: ἵνα
  choice: ili
  rationale: Inaweza kutambulisha kusudi pamoja na maudhui ya sala; ‘ili’ inadumisha nguvu hiyo kwa Kiswahili cha kawaida.
- source_word: ἀξιώσῃ
  choice: awahesabu kuwa mnastahili
  rationale: Inatanguliza maana ya kutathmini au kuona kuwa wanastahili, huku uwezekano wa maana ya ‘kuwafanya wastahili’ ukihifadhiwa katika tanbihi.
- source_word: τῆς κλήσεως
  choice: mwito
  rationale: Kigiriki hakina kiwakilishi cha kumiliki; ‘mwito’ huepuka kuongeza ‘wake’ au ‘wenu’ isiyosemwa wazi.
- source_word: ὁ θεὸς ἡμῶν
  choice: Mungu wetu
  rationale: Kiwakilishi cha kumiliki kipo wazi katika chanzo na kimehifadhiwa.
- source_word: πληρώσῃ
  choice: atimize
  rationale: Neno hili linafaa kwa azimio na kazi, na linaonyesha kuvifikisha kwenye utimilifu.
- source_word: πᾶσαν εὐδοκίαν ἀγαθωσύνης
  choice: kila azimio jema
  rationale: ‘Azimio’ linaonyesha kusudi au nia iliyokusudiwa kuliko hisia ya kupendezwa tu; ‘jema’ linawasilisha ἀγαθωσύνης kwa Kiswahili cha asili.
- source_word: ἔργον πίστεως
  choice: kila kazi ya imani
  rationale: 'Muundo ‘ya imani’ unaacha wazi uhusiano wa kisarufi kama ulivyo katika Kigiriki: inaweza kuwa kazi inayotokana na imani au kazi yenye sifa ya uaminifu.'
- source_word: ἐν δυνάμει
  choice: kwa nguvu
  rationale: Inaonyesha nguvu ambayo kwayo Mungu hutimiza; imewekwa karibu na kitenzi kwa uwazi wa Kiswahili bila kufunga kabisa upeo wake wa maana.
theological_decisions:
- issue: Maana ya ἀξιώσῃ kuhusiana na mwito wa Mungu
  choice: awahesabu kuwa mnastahili mwito
  alternative: awafanye mustahili mwito
  rationale: Tafsiri kuu inadumisha maana ya Mungu kuwaona au kuwahesabu kuwa wanastahili bila kudai kwamba wanajipatia ustahili wao; maana nyingine halali ya kitenzi imehifadhiwa katika tanbihi.
- issue: Maana ya πίστις katika ἔργον πίστεως
  choice: imani
  alternative: uaminifu
  rationale: ‘Imani’ ni tafsiri ya msingi ya πίστις hapa, lakini muktadha unaweza pia kuruhusu wazo la uaminifu. Muundo wa sentensi na tanbihi vinahifadhi mvutano huo.
- issue: Uhusiano wa ἐν δυνάμει na vipashio vya sentensi
  choice: kwa nguvu atimize
  alternative: atimize ... kwa nguvu
  rationale: Kigiriki kinaweka kishazi hiki mwishoni, ambako kinaweza kusikika kwa upana. Kiswahili kinakiweka karibu na ‘atimize’ kwa ufasaha, bila kubainisha nguvu hiyo kuwa ya wanadamu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imetungwa kwa mtiririko wa kawaida wa Kiswahili huku ikihifadhi uradidi wa ‘kila,’ kutokuwepo kwa kiwakilishi cha kumiliki baada ya ‘mwito,’ na utata halali wa ‘kazi ya imani.’
