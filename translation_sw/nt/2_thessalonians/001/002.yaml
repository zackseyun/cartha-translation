  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a].
translation:
  language: sw
  text: Neema na amani ziwe kwenu kutoka kwa Mungu Baba na kwa Bwana Yesu Masihi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yesu Kristo.” Cheo cha Kigiriki Χριστός kinaweza kutafsiriwa “Kristo” au “Masihi”; hapa “Masihi” huhifadhi maana ya cheo hicho.
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις
  choice: Neema
  rationale: Katika salamu za Paulo, neno hili ni baraka yenye uzito wa kiteolojia; “neema” ni tafsiri ya kawaida na yenye kueleweka katika Kiswahili cha Biblia.
- source_word: ὑμῖν
  choice: ziwe kwenu
  rationale: Muundo huu wa Kiswahili huwasilisha kwa kawaida baraka inayoelekezwa kwa wapokeaji, huku kitenzi cha wingi kikirejelea “neema na amani.”
- source_word: εἰρήνη
  choice: amani
  rationale: Huhifadhi maana ya msingi pamoja na mwangwi wa hali ya ukamilifu na ustawi.
- source_word: ἀπὸ
  choice: kutoka kwa
  rationale: Huonyesha chanzo cha neema na amani kwa njia ya kawaida katika Kiswahili.
- source_word: θεοῦ πατρὸς
  choice: Mungu Baba yetu
  rationale: Ingawa SBLGNT haina kiwakilishi ἡμῶν hapa, “Baba yetu” ni muundo wa asili wa Kiswahili unaowasilisha uhusiano uliokusudiwa katika salamu hii ya Paulo; “Mungu Baba” peke yake pia ingewezekana lakini ni pungufu kidogo katika muktadha huu.
- source_word: κυρίου
  choice: Bwana
  rationale: Ni tafsiri sanifu inayohifadhi hadhi ya cheo cha κύριος katika Agano Jipya.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesu Masihi
  rationale: “Masihi” huwasilisha maana ya cheo Χριστός kwa Kiswahili cha kawaida; hakuna haja ya kuongeza kibainishi tofauti kama cha Kiingereza kwa sababu muundo “Yesu Masihi” ni wa asili.
theological_decisions:
- issue: Kuongeza “yetu” baada ya “Baba” ingawa haipo wazi katika matini iliyochapishwa ya Kigiriki
  choice: Mungu Baba yetu
  alternative: Mungu Baba
  rationale: Kigiriki kina θεοῦ πατρὸς bila ἡμῶν. Hata hivyo, salamu za Paulo na matumizi ya kawaida ya Kiswahili yanaunga mkono “Baba yetu” kama uwasilishaji wa uhusiano uliodokezwa. Kwa kuwa hili ni ongezeko la maana lililo wazi, linatambuliwa katika maelezo ya uamuzi badala ya kudai kuwa neno hilo limo katika matini.
- issue: Uwasilishaji wa Χριστός kama cheo
  choice: Masihi
  alternative: Kristo
  rationale: “Masihi” huhifadhi maana ya cheo, yaani Mtiwa-Mafuta, bila kukifanya kiwe jina tu. “Kristo” ni mbadala wa kimapokeo na umetajwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo wa baraka “Neema na amani ziwe kwenu” ni wa kawaida na unaeleweka. Kiunganishi “kwa” kimerudiwa kabla ya “Bwana Yesu Masihi” ili kuonyesha kwa uwazi kwamba wote wawili wanatajwa kuwa chanzo cha baraka.
