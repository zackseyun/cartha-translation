  text: since it is just before God to repay affliction to those who afflict you[a]
translation:
  language: sw
  text: Kwa kuwa ni haki kwa Mungu kuwalipa mateso wale wanaowatesa ninyi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ikiwa kweli ni haki kwa Mungu kuwalipa mateso wale wanaowatesa ninyi.”
    reason: Mbadala huu huhifadhi kwa uwazi zaidi muundo wa masharti wa εἴπερ.
lexical_decisions:
- source_word: εἴπερ
  choice: Kwa kuwa
  rationale: Katika muktadha huu neno hilo linatanguliza jambo ambalo Paulo analichukulia kuwa kweli, si sharti lenye shaka. Hata hivyo, maana ya moja kwa moja ya masharti imehifadhiwa katika tanbihi.
- source_word: δίκαιον
  choice: ni haki
  rationale: Usemi huu unaeleza kwamba malipo ya Mungu ni ya adili na yanalingana na hukumu yake; “ni haki” ni wa kawaida na wenye uzito unaofaa katika Kiswahili.
- source_word: παρὰ θεῷ
  choice: mbele za Mungu
  rationale: Huwasilisha tathmini kwa kipimo cha Mungu—yaani, jambo hilo ni la haki machoni pake—bila kudokeza tu mahali alipo.
- source_word: ἀνταποδοῦναι
  choice: kuwalipa
  rationale: Kitenzi hiki huonyesha kumpa mtu kinacholingana na alichotenda. “Kuwalipa” ni cha kawaida na kinafaa katika muktadha wa hukumu.
- source_word: τοῖς θλίβουσιν ὑμᾶς
  choice: wale wanaowatesa ninyi
  rationale: “Kuwatesa” huonyesha kusababisha dhiki au mateso makali, na pia huhifadhi uhusiano wa kimaana na θλῖψιν. Kiwakilishi “ninyi” kimewekwa wazi kwa msisitizo na uwazi.
- source_word: θλῖψιν
  choice: mateso
  rationale: “Mateso” hueleweka kwa urahisi na huhifadhi mwangwi wa kitenzi “wanaowatesa,” hivyo kuonyesha ulinganifu wa malipo uliomo katika Kigiriki.
theological_decisions:
- issue: Hali na wakati wa malipo ya Mungu
  choice: Aya inasema kwa ujumla kwamba ni haki kwa Mungu kuwalipa wanaowatesa waamini kwa mateso.
  alternative: Kuyafafanua mateso hayo kuwa hukumu ya mwisho pekee, au kuwa pia hukumu za kihistoria za sasa.
  rationale: Kifungu hiki kinathibitisha haki ya malipo ya Mungu lakini hakielezi kikamilifu wakati wala namna yatakavyotekelezwa; tafsiri haijaingiza mpangilio mwembamba wa kimafundisho.
- issue: Nguvu ya εἴπερ
  choice: 'Kauli ya sababu inayowasilisha jambo linalodhaniwa kuwa kweli: “Kwa kuwa.”'
  alternative: 'Kauli ya masharti: “ikiwa kweli.”'
  rationale: Katika hoja ya Paulo, sharti hili lina nguvu ya balagha na linachukuliwa kuwa la kweli. Kwa kuwa muundo wa masharti ni uwezekano halisi wa kileksia, umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Ulinganifu wa “mateso … wanaowatesa” umehifadhiwa ili kuakisi mchezo wa maneno wa θλῖψιν/θλίβουσιν bila kutumia msamiati usio wa kawaida.
