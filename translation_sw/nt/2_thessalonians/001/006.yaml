  naturalness: “Kwa kuwa ni haki kwa Mungu ...” is natural, formal Standard East African Swahili. The retained pairing “mateso ... wanaowatesa” clearly reflects the Greek wordplay and is readily intelligible.
  terminology: “Haki,” “kuwalipa,” “mateso,” and “kuwatesa” are suitable judicial and pastoral-register choices. “Kwa Mungu” appropriately expresses the evaluative idiom without implying a physical location or adding theological specificity.
