  yaml_path: translation/nt/2_thessalonians/001/008.yaml
  text: in flaming fire[a], inflicting vengeance on those who do not know God and on those who do not obey the gospel of our Lord Jesus[b],
translation:
  language: sw
  text: katika mwali wa moto[a], akitekeleza kisasi dhidi ya wale wasiomjua Mungu na wale wasioitii injili ya Bwana wetu Yesu,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika moto uwakao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν φλογὶ πυρός
  choice: katika mwali wa moto
  rationale: Hutafsiri kwa njia ya asili muundo wa Kigiriki na kudumisha taswira dhahiri ya moto; kirai hiki kinaendeleza maelezo ya kufunuliwa kwa Bwana katika mstari uliotangulia.
- source_word: διδόντος ἐκδίκησιν
  choice: akiwalipiza kisasi
  rationale: Ingawa διδόντος kihalisi ni ‘akitoa,’ pamoja na ἐκδίκησιν huunda wazo la kutekeleza malipo ya hukumu. ‘Akiwalipiza kisasi’ ni Kiswahili cha kawaida chenye nguvu inayolingana na chanzo.
- source_word: τοῖς μὴ εἰδόσι θεὸν
  choice: wale wasiomjua Mungu
  rationale: οἶδα ina maana ya hali ya sasa ya kumjua; tafsiri hii ni ya kawaida na haiongezi sababu ya kutomjua.
- source_word: τοῖς μὴ ὑπακούουσιν
  choice: wale wasioitii
  rationale: Huhifadhi maana ya kutotii au kutoisikiliza kwa utii bila kuongeza wazo la kukataa kwa makusudi ambalo halijaelezwa wazi.
- source_word: τῷ εὐαγγελίῳ
  choice: injili
  rationale: ‘Injili’ ni neno la kawaida na linalotambulika katika Kiswahili kwa εὐαγγέλιον, hasa katika maandishi ya Paulo.
- source_word: τοῦ κυρίου ἡμῶν Ἰησοῦ
  choice: ya Bwana wetu Yesu
  rationale: Huhifadhi cheo κύριος, umilikaji wa kirai cha Kigiriki, na mpangilio wa asili wa Kiswahili.
theological_decisions:
- issue: Asili ya ἐκδίκησις katika hukumu ya Mungu
  choice: kisasi
  alternative: malipo ya haki
  rationale: ‘Kisasi’ huhifadhi ukali na nguvu ya neno la chanzo. Katika muktadha huu ni kisasi cha hukumu ya Mungu, si hasira ya kibinafsi ya mwanadamu; tafsiri haisitiri mvutano huo wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa kishiriki ‘akiwalipiza’ unaunganisha aya hii na kufunuliwa kwa Bwana katika aya iliyotangulia. Alama ya tanbihi [a] imewekwa katika matini.
