review_pass:
  verdict: revise
  source_fidelity: Rasimu inafuata maana ya jumla ya Kigiriki, ikiwemo msisitizo wa “sisi wenyewe,” msingi wa kujivunia, na tendo endelevu la kustahimili. Hata hivyo, “hata” huongeza wazo la ‘even’ lisilo wazi katika αὐτοὺς ἡμᾶς, na “dhiki zote” kisarufi inaweza kufanya “zote” ihusiane na dhiki pekee badala ya mateso na dhiki zote mbili.
  naturalness: “Tunajivunia ninyi miongoni mwa makanisa ya Mungu” ni usemi wa asili zaidi katika Kiswahili Sanifu kuliko “tunajisifu juu yenu miongoni mwa makusanyiko.” “Makanisa” pia ni istilahi ya kawaida na inayoeleweka kwa ἐκκλησίαις katika muktadha huu.
  terminology: “Makanisa ya Mungu” huhifadhi ἐκκλησίαις τοῦ θεοῦ kwa matumizi ya kawaida ya Kiswahili bila kudokeza majengo. “Uvumilivu,” “imani,” “mateso,” na “dhiki” zinafaa; tanbihi ya “uaminifu” kwa πίστις inahifadhi utata halali wa neno.
  issues:
  - severity: low
    issue: Neno “hata” limeongezwa katika “hata sisi wenyewe.”
    rationale: Kigiriki kina msisitizo αὐτοὺς ἡμᾶς, ‘sisi wenyewe,’ lakini hakina lazima chembe ya ‘hata/even’ katika sentensi hii.
  - severity: medium
    issue: “Makusanyiko ya Mungu” si istilahi ya kawaida zaidi kwa ἐκκλησίαις katika Kiswahili cha Biblia.
    rationale: Ingawa inawezekana kimsamiati, “makanisa ya Mungu” ni ya asili, inatambulika mara moja, na huwakilisha jumuiya zilizoitwa makanisa katika matumizi ya Agano Jipya.
  - severity: medium
    issue: “Mateso na dhiki zote” huacha wigo wa “zote” ukiwa haueleweki.
    rationale: Katika Kiswahili, “zote” hapa huelekea kuhusishwa na “dhiki” iliyo karibu. Kurudia “yote/zote” kwa nomino zote mbili huonyesha kwa wazi πᾶσιν inayotawala orodha nzima.
  revised_text: Hivyo sisi wenyewe tunajivunia ninyi miongoni mwa makanisa ya Mungu kwa sababu ya uvumilivu wenu na imani[a] yenu katika mateso yenu yote na dhiki zenu zote mnazostahimili.
