- from: Hivyo hata sisi wenyewe tunajisifu juu yenu miongoni mwa makusanyiko ya Mungu kwa sababu ya uvumilivu na imani[a] yenu katika mateso na dhiki zote mnazostahimili.
  to: Hivyo sisi wenyewe tunajivunia ninyi miongoni mwa makanisa ya Mungu kwa sababu ya uvumilivu wenu na imani[a] yenu katika mateso yenu yote na dhiki zenu zote mnazostahimili.
  rationale: Marekebisho yanaondoa nyongeza isiyo ya lazima ya “hata,” yanatumia istilahi ya kawaida “makanisa ya Mungu,” na yanaweka wazi kwamba uvumilivu na imani vinaonekana katika mateso yote na dhiki zote wanazostahimili. Tanbihi inadumisha uwezekano wa “uaminifu” bila kuamua maana moja kwa lazima.
