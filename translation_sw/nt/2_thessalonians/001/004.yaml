  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὥστε ⸂αὐτοὺς ἡμᾶς⸃ ἐν ὑμῖν ⸀ἐγκαυχᾶσθαι ἐν ταῖς ἐκκλησίαις τοῦ θεοῦ ὑπὲρ τῆς ὑπομονῆς ὑμῶν καὶ πίστεως ἐν πᾶσιν τοῖς διωγμοῖς ὑμῶν καὶ ταῖς θλίψεσιν αἷς ἀνέχεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/004.yaml
  text: so that we ourselves boast about you among the churches of God because of your perseverance and faith in all your persecutions and afflictions that you are enduring,[a]
translation:
  language: sw
  text: Hivyo sisi wenyewe tunajivunia ninyi miongoni mwa makanisa ya Mungu kwa sababu ya uvumilivu wenu na imani[a] yenu katika mateso yenu yote na dhiki zenu zote mnazostahimili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uaminifu”; neno la Kigiriki πίστις linaweza kumaanisha imani au uaminifu thabiti, hasa katika mazingira ya mateso.
    reason: alternative_reading
lexical_decisions:
- source_word: ὥστε
  choice: Hivyo
  rationale: Inaonyesha matokeo ya ongezeko lililotajwa katika muktadha uliotangulia kwa Kiswahili cha kawaida.
- source_word: αὐτοὺς ἡμᾶς
  choice: hata sisi wenyewe
  rationale: Inahifadhi msisitizo wa kiwakilishi cha Kigiriki na wazo kwamba Paulo na wenzake ndio wanaofanya hivyo.
- source_word: ἐν ὑμῖν
  choice: juu yenu
  rationale: Pamoja na kitenzi cha kujisifu, kirai hiki kinawaonyesha wasomaji kuwa sababu au jambo linalohusu kujisifu huko.
- source_word: ἐγκαυχᾶσθαι
  choice: tunajisifu
  rationale: Ni tafsiri ya moja kwa moja inayohifadhi nguvu ya usemi bila kuupunguza kuwa kufurahia tu.
- source_word: ἐν ταῖς ἐκκλησίαις τοῦ θεοῦ
  choice: miongoni mwa makusanyiko ya Mungu
  rationale: Inaonyesha jumuiya nyingi ambamo kujisifu huko kunafanyika; 'makusanyiko' huhifadhi maana ya msingi ya ἐκκλησίαις bila kuashiria majengo.
- source_word: ὑπὲρ
  choice: kwa sababu ya
  rationale: Katika muktadha huu inatambulisha msingi wa kujisifu.
- source_word: ὑπομονῆς
  choice: uvumilivu
  rationale: Huonyesha kustahimili kwa uthabiti chini ya shinikizo na ni neno linaloeleweka kwa urahisi.
- source_word: πίστεως
  choice: imani
  rationale: Ni tafsiri pana na ya kawaida ya πίστις; uwezekano wa maana ya uaminifu umehifadhiwa katika tanbihi.
- source_word: ἐν πᾶσιν τοῖς διωγμοῖς ὑμῶν καὶ ταῖς θλίψεσιν
  choice: katika mateso na dhiki zote
  rationale: Inahifadhi hali ambamo uvumilivu na imani vinaonekana, huku ikitofautisha upinzani wa kuwatesa na mashinikizo mapana.
- source_word: διωγμοῖς
  choice: mateso
  rationale: Katika matumizi ya Agano Jipya humaanisha kuonewa au kuteswa kwa uhasama; 'mateso' ni neno la kawaida katika Kiswahili cha Biblia na muktadha unazuia kuchanganywa na maumivu ya jumla.
- source_word: θλίψεσιν
  choice: dhiki
  rationale: Huonyesha mashinikizo, taabu, au hali ngumu kwa lugha fupi na yenye uzito unaofaa.
- source_word: αἷς ἀνέχεσθε
  choice: mnazostahimili
  rationale: Inahifadhi tendo linaloendelea la kuvumilia mateso na dhiki hizo.
theological_decisions:
- issue: Maana ya πίστις katika mazingira ya mateso ambapo 'imani' na 'uaminifu' zote zinawezekana
  choice: imani
  alternative: uaminifu
  rationale: Neno πίστις linaweza kumaanisha imani au uaminifu thabiti. Maandishi makuu yanatumia 'imani' kama maana pana, na tanbihi inalinda uwezekano halisi wa 'uaminifu' bila kuamua kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo unabaki karibu na mantiki ya Kigiriki lakini unasomeka kwa kawaida. 'Makusanyiko ya Mungu' limetumiwa kwa ἐκκλησίαις ili kuonyesha jumuiya za waumini, si majengo; alama ya tanbihi [a] imewekwa mara moja baada ya 'imani'.
