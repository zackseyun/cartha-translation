base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/009.yaml
  text: These will pay the penalty of eternal destruction[a], away from the presence of the Lord and from the glory of his might,
translation:
  language: sw
  text: Hao wataadhibiwa kwa maangamizi ya milele[a], mbali na uwepo wa Bwana na mbali na utukufu wa nguvu zake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au yawezekana, “maangamizi yanayotokana na uwepo wa Bwana na utukufu wa nguvu zake.” Kihusishi cha Kigiriki kinaweza kueleweka kuwa kinaonyesha ama kutenganishwa (“mbali na”) ama chanzo (“kinachotokana na”).
    reason: alternative_reading
lexical_decisions:
- source_word: οἵτινες
  choice: Hao
  rationale: Inarejelea watu waliotajwa katika mstari uliotangulia na ina nguvu ya kurejelea kwa kawaida katika Kiswahili.
- source_word: δίκην τίσουσιν
  choice: wataadhibiwa kwa
  rationale: Kirai hiki kinaonyesha kupokea adhabu ya hukumu. Muundo huu ni wa kawaida katika Kiswahili na unadumisha maana ya kisheria bila kuwa mgumu.
- source_word: ὄλεθρον
  choice: maangamizi
  rationale: Neno hili linawasilisha uzito wa ὄλεθρος katika muktadha wa hukumu bila kufafanua namna hasa ya adhabu ya mwisho.
- source_word: αἰώνιον
  choice: ya milele
  rationale: Katika muktadha huu wa hukumu ya mwisho, linaonyesha hali yenye kudumu na ya mwisho.
- source_word: ἀπὸ προσώπου τοῦ κυρίου
  choice: mbali na uwepo wa Bwana
  rationale: ἀπό imeeleweka hapa kuwa ya kutenganishwa au kuondolewa; πρόσωπον katika kirai hiki hutafsiriwa kwa Kiswahili cha kawaida kama uwepo badala ya uso.
- source_word: καὶ ἀπὸ τῆς δόξης τῆς ἰσχύος αὐτοῦ
  choice: na utukufu wa nguvu zake
  rationale: δόξα ni utukufu, na ἰσχύς ni nguvu. Muundo huu unasomeka kwa kawaida na kudumisha wazo la utukufu unaodhihirisha nguvu zake.
theological_decisions:
- issue: Maana ya ἀπό kuhusiana na hukumu ya mwisho
  choice: 'Kutenganishwa: “mbali na uwepo wa Bwana”'
  alternative: 'Chanzo: maangamizi yanayotoka katika uwepo wa Bwana na katika utukufu wa nguvu zake'
  rationale: ἀπό inaweza kuonyesha kutenganishwa au chanzo. Maandishi makuu yanatumia maana yenye nguvu kimuktadha ya kutengwa na uwepo wa Bwana, huku uwezekano mwingine wa kisarufi ukihifadhiwa katika tanbihi.
- issue: Maana ya “maangamizi ya milele”
  choice: Kirai kimetafsiriwa bila kufafanua namna hasa ya adhabu
  alternative: Kukieleza wazi kuwa kuangamizwa kabisa au kuwa mateso ya milele yenye fahamu
  rationale: Kirai cha Kigiriki kinataja adhabu lakini hakitatui chenyewe mjadala mpana kuhusu hali hasa ya adhabu ya mwisho; tafsiri haiongezi hitimisho la kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Maangamizi ya milele” huhifadhi uzito na mvutano wa kifungu bila kuingiza ufafanuzi wa kimadhehebu; tanbihi huhifadhi utata halisi wa ἀπό.
