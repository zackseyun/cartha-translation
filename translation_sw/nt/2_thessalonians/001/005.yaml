  text: ἔνδειγμα τῆς δικαίας κρίσεως τοῦ θεοῦ, εἰς τὸ καταξιωθῆναι ὑμᾶς τῆς βασιλείας τοῦ θεοῦ, ὑπὲρ ἧς καὶ πάσχετε,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/005.yaml
  text: This is evidence of the righteous judgment of God[a], so that you may be counted worthy of the kingdom of God, for which you are also suffering[c][b],
translation:
  language: sw
  text: Huu ni ushahidi wa hukumu ya Mungu iliyo ya haki[a], ili mhesabiwe kuwa mnastahili ufalme wa Mungu[b], ambao pia mnateseka kwa ajili yake[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ishara” au “uthibitisho” wa hukumu ya Mungu iliyo ya haki.
    reason: lexical_alternative
  - marker: b
    text: Au, “ili mhesabiwe kuwa mnastahili” au “na matokeo yake mhesabiwe kuwa mnastahili.” Muundo wa Kigiriki unaweza kuonyesha kusudi au matokeo.
    reason: alternative_reading
  - marker: c
    text: Au, “kwa ajili ya ufalme huo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔνδειγμα
  choice: ushahidi
  rationale: Neno hili humaanisha jambo linaloonyesha au kuthibitisha uhalisi fulani. “Ushahidi” ni la kawaida na hudumisha nguvu ya kimantiki bila kulifanya kuwa uthibitisho usioweza kupingwa. “Huu ni” limeongezwa kwa kuwa Kigiriki ni kipande kisicho na kitenzi kinachotegemea mstari uliotangulia.
- source_word: δικαίας κρίσεως
  choice: hukumu ya Mungu iliyo ya haki
  rationale: Muundo huu unaonyesha kwamba hukumu ya Mungu ina sifa ya haki. Tafsiri hii ni ya asili katika Kiswahili na inahifadhi uzito wa kimaadili wa δίκαιος.
- source_word: εἰς τὸ καταξιωθῆναι
  choice: ili mhesabiwe kuwa mnastahili
  rationale: Muundo wa εἰς pamoja na kitenzi-jina unaweza kuonyesha kusudi au matokeo. Kauli tendwa ya καταξιόω inamaanisha kuhesabiwa au kuonwa kuwa mtu anastahili, si kufanywa mwenye kustahili kwa asili.
- source_word: βασιλείας τοῦ θεοῦ
  choice: ufalme wa Mungu
  rationale: Hii ni tafsiri ya kawaida, wazi, na yenye kuhifadhi usemi wa kibiblia wa kirai hiki.
- source_word: ὑπὲρ ἧς
  choice: ambao kwa ajili yake
  rationale: ὑπέρ pamoja na hali ya umilikaji inaweza kumaanisha “kwa ajili ya” au “kwa niaba ya.” Hapa inahusianisha mateso yao na ufalme bila kufafanua zaidi ya maandishi.
- source_word: καὶ πάσχετε
  choice: pia mnateseka
  rationale: Wakati uliopo unaonyesha mateso yanayoendelea, na καί imetafsiriwa “pia” ili kudumisha uhusiano wake na dhiki zilizotajwa kabla.
theological_decisions:
- issue: Uhusiano wa mateso na kuhesabiwa kustahili ufalme
  choice: Mateso yao yanahusishwa na ushahidi wa hukumu ya Mungu iliyo ya haki, kwa kusudi au matokeo ya wao kuhesabiwa kuwa wanastahili ufalme.
  alternative: Mateso yao yanawapatia au yanawanunulia haki ya kuingia katika ufalme.
  rationale: Kauli tendwa καταξιωθῆναι humaanisha “kuhesabiwa/kuonwa kuwa anastahili,” si lazima kupata kustahili kwa malipo. Tafsiri inadumisha mvutano wa kifungu bila kuingiza fundisho kwamba mateso yenyewe ni malipo yanayonunua kuingia katika ufalme.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Mpangilio umefanywa kuwa wa asili katika Kiswahili huku utegemezi wa mstari uliotangulia na utata wa kusudi au matokeo ukihifadhiwa.
