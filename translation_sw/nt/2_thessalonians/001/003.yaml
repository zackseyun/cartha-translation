  text: Εὐχαριστεῖν ὀφείλομεν τῷ θεῷ πάντοτε περὶ ὑμῶν, ἀδελφοί, καθὼς ἄξιόν ἐστιν, ὅτι ὑπεραυξάνει ἡ πίστις ὑμῶν καὶ πλεονάζει ἡ ἀγάπη ἑνὸς ἑκάστου πάντων ὑμῶν εἰς ἀλλήλους,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/003.yaml
  text: We ought always to give thanks to God for you[a], brothers, as is fitting, because your faith is growing abundantly and the love of each and every one of you for one another is increasing[c][b],
translation:
  language: sw
  text: Inatupasa kumshukuru Mungu sikuzote kwa ajili yenu, ndugu[a], kama inavyostahili, kwa sababu imani yenu[b] inakua sana, na upendo ambao kila mmoja wenu anao kwa wenzake unazidi kuongezeka[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki lililotafsiriwa “ndugu” ni la wingi wa kiume, lakini linaweza kutumiwa kulihutubia kusanyiko lote, yaani ndugu wa kiume na wa kike.
    reason: lexical_alternative
  - marker: b
    text: Au “uaminifu wenu” au “kumtumaini kwenu.” Neno la Kigiriki linaweza kumaanisha imani, kumtumaini, au uaminifu; hapa “imani” ndiyo tafsiri ya kawaida zaidi.
    reason: alternative_reading
  - marker: c
    text: Kihalisi, “upendo wa kila mmoja wa ninyi nyote kwa wengine”; Kigiriki kinasisitiza kwamba hakuna yeyote anayeachwa nje.
    reason: source_emphasis
lexical_decisions:
- source_word: Εὐχαριστεῖν ὀφείλομεν
  choice: Inatupasa kumshukuru
  rationale: Muundo huu unaonyesha wajibu wa kimaadili au jambo linalofaa kufanywa, bila kuufanya kuwa amri kali isiyo na tofauti.
- source_word: πάντοτε περὶ ὑμῶν
  choice: sikuzote kwa ajili yenu
  rationale: Katika kauli ya shukrani, περί pamoja na watu hueleza wale ambao shukrani zinatolewa kwa habari yao; ‘kwa ajili yenu’ ni ya kawaida na wazi katika Kiswahili.
- source_word: ἀδελφοί
  choice: ndugu
  rationale: ‘Ndugu’ ni neno la kawaida la Kiswahili linaloweza kutumiwa kwa jumuiya nzima, huku tanbihi ikieleza kwamba neno la Kigiriki ni umbo la wingi la kiume.
- source_word: καθὼς ἄξιόν ἐστιν
  choice: kama inavyostahili
  rationale: Huhifadhi maana ya kufaa au kuwa jambo la haki, kwa lugha yenye hadhi na inayoeleweka.
- source_word: ὑπεραυξάνει ἡ πίστις ὑμῶν
  choice: imani yenu inakua sana
  rationale: Kitenzi changamani kina nguvu ya ukuaji mkubwa, si ongezeko la kawaida tu; ‘inakua sana’ ni ya asili katika Kiswahili.
- source_word: πλεονάζει ἡ ἀγάπη
  choice: upendo ... unazidi kuongezeka
  rationale: Hutoa wazo la upendo unaoongezeka kwa wingi na pia huhifadhi hali endelevu ya vitenzi vya wakati wa sasa.
- source_word: ἑνὸς ἑκάστου πάντων ὑμῶν εἰς ἀλλήλους
  choice: wa kila mmoja wenu kwa mwenzake
  rationale: Ni Kiswahili cha kawaida kinachohifadhi mgawanyo wa ‘kila mmoja’ na uhusiano wa kurudiana wa ἀλλήλους; msisitizo wa maneno ya Kigiriki umeelezwa katika tanbihi.
theological_decisions:
- issue: Maana ya πίστις
  choice: imani
  alternative: uaminifu; kumtumaini Mungu
  rationale: Katika muktadha huu, ‘imani’ ndiyo maana ya kawaida zaidi, lakini neno la Kigiriki linaweza pia kuhusisha wazo la uaminifu au tumaini; uwezekano huo haujafutwa bali umehifadhiwa katika tanbihi.
- issue: Wanaorejelewa na ἀδελφοί
  choice: ndugu
  alternative: ndugu wa kiume; ndugu wa kiume na wa kike
  rationale: Neno la Kigiriki ni la kiume kwa umbo, lakini katika salamu kwa kusanyiko linaweza kuhusisha waumini wote. ‘Ndugu’ hufanya kazi kwa kawaida katika Kiswahili, na tanbihi huhifadhi taarifa ya umbo la Kigiriki.
- issue: Nguvu ya kifungu ἑνὸς ἑκάστου πάντων ὑμῶν
  choice: kila mmoja wenu
  alternative: kila mmoja wenu nyote
  rationale: Kigiriki kina msisitizo wa ziada unaoweza kutafsiriwa kihalisi kwa namna nzito. Matini kuu imetumia Kiswahili cha asili, huku tanbihi ikihifadhi msisitizo huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi, na rahisi kusomeka. ‘Inatupasa’ inadumisha sauti ya wajibu wa kichungaji, na vitenzi ‘inakua sana’ na ‘unazidi kuongezeka’ vinatofautisha nguvu za vitenzi viwili vya Kigiriki bila kufanya sentensi kuwa nzito.
