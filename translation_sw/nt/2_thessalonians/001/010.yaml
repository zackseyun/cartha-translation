  edition: SBLGNT
  text: ὅταν ἔλθῃ ἐνδοξασθῆναι ἐν τοῖς ἁγίοις αὐτοῦ καὶ θαυμασθῆναι ἐν πᾶσιν τοῖς πιστεύσασιν, ὅτι ἐπιστεύθη τὸ μαρτύριον ἡμῶν ἐφ’ ὑμᾶς, ἐν τῇ ἡμέρᾳ ἐκείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/010.yaml
  text: on that day when he comes to be glorified among his saints and to be marveled at among all who have believed[b][a], because our testimony to you was believed.
translation:
  language: sw
  text: siku ile atakapokuja ili atukuzwe miongoni mwa watakatifu wake[a] na astaajabiwe miongoni mwa wote walioamini, kwa sababu ushuhuda wetu kwenu uliaminiwa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ndani ya watakatifu wake.” Kihusishi cha Kigiriki kinaweza kumaanisha kwamba atatukuzwa miongoni mwa watu wake watakatifu au kwamba utukufu wake utaonyeshwa ndani yao.
    reason: lexical_alternative
  - marker: b
    text: 'Au sentensi inaweza kupangwa hivi: “atakapokuja ili atukuzwe miongoni mwa watakatifu wake na astaajabiwe miongoni mwa wote walioamini—kwa sababu ushuhuda wetu kwenu uliaminiwa—siku ile.”'
    reason: previous_rendering
lexical_decisions:
- source_word: ὅταν ἔλθῃ
  choice: atakapokuja
  rationale: Muundo huu wa Kiswahili unaonyesha tukio maalumu la wakati ujao na unasomeka kwa kawaida.
- source_word: ἐνδοξασθῆναι
  choice: ili atukuzwe
  rationale: Kauli ya kutendwa pamoja na “ili” huhifadhi kusudi au matokeo ya kuja kwake na maana ya kupewa au kuonyeshwa utukufu.
- source_word: ἐν τοῖς ἁγίοις αὐτοῦ
  choice: miongoni mwa watakatifu wake
  rationale: “Miongoni mwa” ni Kiswahili cha kawaida kwa mazingira ya kundi, huku uwezekano wa maana “ndani ya” ukihifadhiwa katika tanbihi.
- source_word: θαυμασθῆναι
  choice: kustaajabiwa
  rationale: Neno hili linaonyesha mshangao wenye kuvutiwa na linadumisha ulinganifu wa kauli ya kutendwa na “atukuzwe.”
- source_word: ἐν πᾶσιν τοῖς πιστεύσασιν
  choice: miongoni mwa wote walioamini
  rationale: Huhifadhi nguvu ya kitenzi cha kishiriki na ulinganifu wa vifungu viwili vinavyoanza na ἐν.
- source_word: ὅτι
  choice: kwa sababu
  rationale: 'Hueleza uhusiano wa kisababishi: wasomaji wanahesabiwa miongoni mwa walioamini kwa kuwa waliamini ushuhuda.'
- source_word: ἐπιστεύθη
  choice: uliaminiwa
  rationale: Huhifadhi kauli ya kutendwa ya Kigiriki, ambapo ushuhuda ndio kiima.
- source_word: τὸ μαρτύριον ἡμῶν
  choice: ushuhuda wetu
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida kwa ushuhuda au tangazo la kitume.
- source_word: ἐφ’ ὑμᾶς
  choice: kwenu
  rationale: Hueleza kwa kawaida mwelekeo wa ushuhuda kwa wasomaji bila kuufanya kuwa ushuhuda unaowahusu.
- source_word: ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: siku ile
  rationale: Ni usemi wa kawaida wa wakati katika Kiswahili na unahifadhi uzito wa tukio la mwisho.
theological_decisions:
- issue: Maana ya “watakatifu wake” na nguvu ya kihusishi ἐν
  choice: “miongoni mwa watakatifu wake,” likiwaelekeza kwa watu watakatifu wa Kristo
  alternative: “ndani ya watakatifu wake,” likisisitiza kwamba utukufu wake unaonyeshwa ndani yao
  rationale: Muktadha unaunganisha watakatifu na wote walioamini. “Miongoni mwa” ni ya kawaida na haiamui kabisa namna utukufu wake unavyodhihirishwa; maana nyingine imewekwa katika tanbihi.
- issue: Maana ya πιστεύσασιν na ἐπιστεύθη kuhusu tangazo la kitume
  choice: 'Lugha ya kawaida ya kuamini: “wote walioamini” na “ushuhuda wetu ... uliaminiwa”'
  alternative: Kutumia “waliomtumaini” au “ulipokelewa kwa imani”
  rationale: Tafsiri iliyochaguliwa inadumisha uhusiano wa kimsamiati kati ya matumizi hayo mawili bila kuingiza ufafanuzi wa kimadhehebu.
- issue: Mahali pa kifungu “siku ile” katika sentensi
  choice: Kimewekwa mwanzoni ili kiweke fremu ya tukio lote
  alternative: Kukiweka mwishoni kwa kufuata mpangilio wa Kigiriki kwa karibu zaidi
  rationale: Mpangilio wa mwanzoni ni wa kawaida zaidi katika Kiswahili, ilhali tanbihi inahifadhi uwezekano wa mpangilio wa karibu na chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Watakatifu” limetumiwa kwa maana ya watu wa Mungu, na sintaksia imepangwa kwa ufasaha wa Kiswahili huku utata halisi wa ἐν ukihifadhiwa kwa tanbihi.
