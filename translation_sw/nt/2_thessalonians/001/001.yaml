source:
  edition: SBLGNT
  text: Παῦλος καὶ Σιλουανὸς καὶ Τιμόθεος τῇ ἐκκλησίᾳ Θεσσαλονικέων ἐν θεῷ πατρὶ ἡμῶν καὶ κυρίῳ Ἰησοῦ Χριστῷ·
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/001.yaml
  text: 'Paul and Silvanus and Timothy[b][a], to the church of the Thessalonians in God our Father and the Lord Jesus the Messiah:'
translation:
  language: sw
  text: 'Paulo, Silwano na Timotheo, kwa kanisa la Wathesalonike lililo katika Mungu Baba yetu na Bwana Yesu Masiya[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Bwana Yesu Kristo.” Neno la Kigiriki Χριστός linaweza kutafsiriwa “Masiya” au, kwa desturi, “Kristo.”
    reason: alternative_reading
lexical_decisions:
- source_word: Παῦλος
  choice: Paulo
  rationale: Umbo la kawaida la jina hili katika Kiswahili cha Biblia.
- source_word: Σιλουανὸς
  choice: Silwano
  rationale: Hufuata moja kwa moja jina Σιλουανός katika matini ya Kigiriki badala ya kulioanisha na umbo fupi ‘Sila’ katika Matendo.
- source_word: Τιμόθεος
  choice: Timotheo
  rationale: Umbo la kawaida la jina Τιμόθεος katika Kiswahili.
- source_word: ἐκκλησίᾳ
  choice: kanisa
  rationale: Katika barua za Paulo neno hili humaanisha jumuiya ya waamini; ‘kanisa’ ni neno la kawaida na linaloeleweka kwa urahisi.
- source_word: Θεσσαλονικέων
  choice: la Wathesalonike
  rationale: Huhifadhi rejeleo la Kigiriki kwa watu wa Thesalonike, si kulibadili kuwa kauli ya mahali pekee.
- source_word: ἐν
  choice: lililo katika
  rationale: Huhifadhi usemi wa Paulo kuhusu kanisa kuwa ‘katika’ Mungu na Bwana Yesu bila kuamua kama maana ni umoja, msingi, au kuwa mali yao.
- source_word: θεῷ πατρὶ ἡμῶν
  choice: Mungu Baba yetu
  rationale: Huhifadhi kiwakilishi ἡμῶν, ‘yetu,’ na kutoa Kiswahili cha asili na chenye heshima.
- source_word: κυρίῳ
  choice: Bwana
  rationale: Ni tafsiri ya kawaida ya κύριος kama cheo cha Yesu katika Agano Jipya.
- source_word: Χριστῷ
  choice: Masiya
  rationale: Hutafsiri nguvu ya cheo cha Χριστός badala ya kukichukulia tu kama sehemu ya jina; ‘Kristo’ imehifadhiwa katika tanbihi kama umbo la jadi.
theological_decisions:
- issue: Tafsiri ya Χριστῷ katika Ἰησοῦ Χριστῷ
  choice: Masiya
  alternative: Kristo
  rationale: Katika salamu hii Χριστός bado inaweza kusikika kama cheo cha Yesu. ‘Masiya’ huonyesha maana hiyo, huku ‘Kristo’ likitajwa kama umbo la jadi.
- issue: Uhusiano unaoelezwa na ἐν θεῷ πατρὶ ἡμῶν καὶ κυρίῳ Ἰησοῦ Χριστῷ
  choice: lililo katika Mungu Baba yetu na Bwana Yesu Masiya
  alternative: lililo la Mungu Baba yetu na Bwana Yesu Masiya
  rationale: ‘Katika’ huhifadhi ufupi na mvutano wa kitheolojia wa ἐν bila kuamua kwa ziada kwamba kanisa ni mali yao, limewekwa ndani yao, au limeunganishwa nao kwa namna fulani.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa salamu ya barua ulio wa sasa, wa heshima, na unaoeleweka. ‘Lililo’ limeongezwa kwa ulaini wa kisintaksia huku ‘katika’ ikihifadhiwa ili kutoifafanua kupita kiasi ἐν ya Kigiriki.
