  yaml_path: translation/nt/2_thessalonians/001/007.yaml
  text: and to you who are being afflicted[a], relief with us at the revelation of the Lord Jesus from heaven with his mighty angels.
translation:
  language: sw
  text: na kuwapa ninyi mnaoteswa pumziko pamoja nasi, wakati wa kufunuliwa kwa Bwana Yesu kutoka mbinguni pamoja na malaika wake wenye nguvu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa karibu zaidi na muundo wa Kigiriki, “pamoja na malaika wa nguvu zake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: θλιβομένοις
  choice: mnaoteswa
  rationale: Kitenzi hiki katika hali ya kutendwa na wakati wa sasa kinaonyesha watu wanaoendelea kupatwa na mateso au dhiki; “mnaoteswa” huhifadhi hali hiyo ya kutendwa kwa lugha ya kawaida.
- source_word: ἄνεσιν
  choice: pumziko
  rationale: Katika muktadha huu neno lina maana ya kuondolewa kwa shinikizo na dhiki. “Pumziko” linafaa kama kinyume cha mateso, bila kulifanya kuwa utulivu wa ndani tu.
- source_word: μεθ’ ἡμῶν
  choice: pamoja nasi
  rationale: Huhifadhi maana ya ushirika, yaani waamini hao watapata pumziko lilelile pamoja na Paulo na wenzake.
- source_word: ἐν τῇ ἀποκαλύψει
  choice: wakati wa kufunuliwa
  rationale: Kirai hiki kinataja wakati ambapo pumziko litatolewa. Tafsiri hii huhifadhi wazo la ufunuo huku ikieleweka kwa urahisi katika Kiswahili.
- source_word: ἀποκαλύψει
  choice: kufunuliwa
  rationale: Neno linaonyesha kuwekwa wazi au kuonekana kwa yule aliyekuwa amefichika; “kufunuliwa” huhifadhi uzito wa tukio hilo la wakati ujao.
- source_word: κυρίου
  choice: Bwana
  rationale: “Bwana” ni tafsiri ya kawaida na yenye hadhi ya κύριος kama cheo cha Yesu katika Agano Jipya.
- source_word: ἀπ’ οὐρανοῦ
  choice: kutoka mbinguni
  rationale: Huhifadhi wazi maana ya chanzo au mahali anapotoka.
- source_word: μετ’ ἀγγέλων δυνάμεως αὐτοῦ
  choice: pamoja na malaika wa nguvu zake
  rationale: Muundo huu unafuata kwa karibu kirai cha Kigiriki na kuacha wazi iwapo malaika hao wanaelezwa kuwa wenye nguvu au kuwa wanahusishwa na nguvu zake; tafsiri laini zaidi imetolewa katika tanbihi.
theological_decisions:
- issue: Maana ya kirai cha umilikaji ἀγγέλων δυνάμεως αὐτοῦ
  choice: pamoja na malaika wa nguvu zake
  alternative: pamoja na malaika wake wenye nguvu
  rationale: Kigiriki kina muundo mfupi unaoweza kueleweka kwa namna ya sifa, “malaika wake wenye nguvu,” au kama malaika wanaohusishwa na nguvu zake. Matini kuu huhifadhi muundo na mvutano huo; tanbihi inatoa usemi wa kawaida zaidi.
- issue: Nguvu ya wakati katika ἐν τῇ ἀποκαλύψει
  choice: wakati wa kufunuliwa kwa Bwana Yesu
  alternative: Bwana Yesu atakapofunuliwa
  rationale: Kirai kinaunganisha pumziko lililoahidiwa na tukio la kufunuliwa kwa Yesu. Muundo wa nomino umehifadhiwa bila kupoteza maana ya wakati.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Mwanzo wa mstari umeachwa ukiendeleza kisarufi hoja ya mstari uliotangulia. Tanbihi imewekwa baada ya kirai kinachohusika moja kwa moja.
