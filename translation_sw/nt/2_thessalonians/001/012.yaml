id: 2TH.1.12
reference: 2 Thessalonians 1:12
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὅπως ἐνδοξασθῇ τὸ ὄνομα τοῦ κυρίου ἡμῶν Ἰησοῦ ἐν ὑμῖν, καὶ ὑμεῖς ἐν αὐτῷ, κατὰ τὴν χάριν τοῦ θεοῦ ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/012.yaml
  text: so that the name of our Lord Jesus may be glorified in you[a], and you in him[c][b], according to the grace of our God and the Lord Jesus the Messiah.
translation:
  language: sw
  text: ili jina la Bwana wetu Yesu litukuzwe ndani yenu[a], nanyi mtukuzwe ndani yake, kulingana na neema ya Mungu wetu na Bwana Yesu Masihi[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “miongoni mwenu.” Kihusishi cha Kigiriki kinaweza kuwa na maana ya “ndani yenu” au “miongoni mwenu” katika muktadha huu.
    reason: lexical_alternative
  - marker: b
    text: Au, “Kristo” badala ya “Masihi.” Cheo cha Kigiriki ni Χριστός (Christos).
    reason: alternative_reading
  - marker: c
    text: Usemi wa mwisho unaweza kueleweka kuwa unaunganisha kwa karibu “Mungu wetu” na “Bwana Yesu Masihi” kama maelezo yanayomhusu mmoja, au kuwa unawataja kwa kutofautisha “Mungu wetu” na “Bwana Yesu Masihi.” Tafsiri inadumisha ufupi wa Kigiriki bila kulazimisha upande mmoja.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπως
  choice: ili
  rationale: Inaonyesha kusudi au matokeo yanayotarajiwa kutokana na sala iliyotangulia, kwa Kiswahili cha kawaida na cha moja kwa moja.
- source_word: ἐνδοξασθῇ
  choice: litukuzwe
  rationale: Kitenzi cha hali ya kutendwa kinahifadhi wazo la kupewa utukufu au heshima kuu bila kulifanya kuwa maelezo marefu.
- source_word: τὸ ὄνομα
  choice: jina
  rationale: Neno la asili limehifadhiwa; katika matumizi ya kibiblia linaweza pia kuwakilisha utambulisho na sifa ya mtu.
- source_word: τοῦ κυρίου ἡμῶν Ἰησοῦ
  choice: la Bwana wetu Yesu
  rationale: Mpangilio huu ni wa kawaida katika Kiswahili na unahifadhi cheo, umilikaji, na jina.
- source_word: ἐν ὑμῖν
  choice: ndani yenu
  rationale: Hufuata kwa karibu muundo wa Kigiriki, huku uwezekano wa maana ya kijamii, ‘miongoni mwenu,’ ukielezwa katika tanbihi.
- source_word: καὶ ὑμεῖς ἐν αὐτῷ
  choice: nanyi mtukuzwe ndani yake
  rationale: Kitenzi kilichodokezwa katika kishazi sambamba kimetajwa ili Kiswahili kiwe wazi na cha asili. ‘Yake’ inamrejelea kwa uwezekano mkubwa Bwana Yesu.
- source_word: κατὰ τὴν χάριν
  choice: kulingana na neema
  rationale: Inahifadhi wazo la jambo kutendeka kwa kadiri au kwa msingi wa neema bila kulazimisha maana ya chombo pekee.
- source_word: χάριν
  choice: neema
  rationale: Hili ni neno la Kiswahili lililozoeleka na linalofaa kwa χάρις katika muktadha wa Paulo.
- source_word: Χριστοῦ
  choice: Masihi
  rationale: Hapa Χριστός linatumika kama cheo; ‘Masihi’ huwasilisha maana ya cheo hicho badala ya kukiacha bila tafsiri.
- source_word: τοῦ θεοῦ ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ
  choice: ya Mungu wetu na Bwana Yesu Masihi
  rationale: Usemi umeachwa kuwa mfupi kama wa Kigiriki, bila kuongeza maneno yanayolazimisha uamuzi kuhusu kama vyeo hivyo vinamrejelea mmoja au vinataja warejelewa wawili.
theological_decisions:
- issue: Tafsiri ya Χριστοῦ
  choice: Masihi
  alternative: Kristo
  rationale: Neno hilo linafanya kazi kama cheo katika usemi huu; ‘Masihi’ huonyesha maana yake, huku ‘Kristo’ ikitajwa kama namna nyingine iliyozoeleka.
- issue: Mrejelewa wa αὐτῷ
  choice: ndani yake, yaani kwa uwezekano mkubwa ndani ya Bwana Yesu
  alternative: ndani ya jina hilo
  rationale: Muundo wa kutukuzana na matumizi ya Paulo ya kuwa ‘ndani’ ya Bwana yanaunga mkono mrejelewa wa kiume, ingawa uwezekano wa kisarufi wa kulirejelea ‘jina’ unatambuliwa.
- issue: Nguvu ya usemi wa mwisho wenye vivumishi vya umilikaji
  choice: ya Mungu wetu na Bwana Yesu Masihi
  alternative: ya Mungu wetu na ya Bwana Yesu Masihi
  rationale: Muundo mfupi wa Kigiriki unaunganisha kwa karibu ‘Mungu wetu’ na ‘Bwana Yesu Masihi.’ Tafsiri haiongezi ‘ya’ ya pili, ambayo ingesisitiza zaidi warejelewa wawili, wala haiongezi ufafanuzi unaolazimisha kwamba vyeo vyote vinamhusu mrejelewa mmoja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. ‘Litukuzwe’ na ‘neema’ ni istilahi za kibiblia zilizozoeleka. Kishazi sambamba kimepewa kitenzi ‘mtukuzwe’ kwa uwazi wa Kiswahili, bila kubadili uhusiano wa pande mbili uliomo katika Kigiriki.
