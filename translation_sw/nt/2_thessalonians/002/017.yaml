translation:
  language: sw
  text: aifariji mioyo yenu na kuifanya imara katika kila tendo na neno jema.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “aitie moyo”; neno la Kigiriki linaweza pia kumaanisha “kufariji” au “kuhimiza.”
    reason: lexical_alternative
  - marker: b
    text: Au “kuifanya thabiti” au “kuithibitisha” katika kila tendo na neno jema.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακαλέσαι
  choice: aitie moyo
  rationale: Katika ombi hili, kitenzi kinaweza kumaanisha kutia moyo, kufariji, au kuhimiza. “Aitie moyo” kinabeba maana pana na pia kinaendeleza wazo la faraja ya milele katika mstari wa 16.
- source_word: καρδίας
  choice: mioyo
  rationale: “Mioyo” linahifadhi sitiari ya kibiblia kuhusu utu wa ndani bila kuipunguza iwe hisia au akili pekee.
- source_word: στηρίξαι
  choice: kuwaimarisha
  rationale: Kitenzi hiki humaanisha kufanya imara, kuthibitisha, au kuimarisha. “Kuwaimarisha” ni cha kawaida na wazi katika Kiswahili, huku kikidumisha maana ya kufanywa thabiti.
- source_word: ἐν παντὶ
  choice: katika kila
  rationale: Kifungu hiki kinaonyesha eneo au nyanja ambamo kuimarishwa kunatokea.
- source_word: ἔργῳ
  choice: tendo
  rationale: “Tendo” linaonyesha jambo linalofanywa na linaungana kwa kawaida na “neno” katika jozi hii.
- source_word: λόγῳ
  choice: neno
  rationale: Katika ulinganifu na “tendo,” hapa linaelekea kumaanisha usemi au jambo linalosemwa; “neno” linahifadhi ufupi wa maandishi ya chanzo.
- source_word: ἀγαθῷ
  choice: jema
  rationale: Kivumishi hiki kinaeleweka kuwa kinahusu “tendo” na “neno” pia. Umbo “jema” linafaa kisarufi kwa nomino zote mbili.
- source_word: ὑμῶν
  choice: yenu
  rationale: 'Ni kiwakilishi cha nafsi ya pili wingi kinachotegemea “mioyo”: “mioyo yenu.”'
- source_word: καὶ
  choice: na
  rationale: Kiunganishi hiki kinaunganisha vitenzi viwili vya ombi na pia nomino mbili zinazooanishwa.
theological_decisions:
- issue: Iwapo καρδία litafsiriwe kwa maana ya kisaikolojia iliyo wazi zaidi
  choice: mioyo
  alternative: utu wenu wa ndani; akili zenu
  rationale: Tafsiri inadumisha sitiari ya kibiblia na upana wake badala ya kuifungia katika hisia au fikra pekee.
- issue: Iwapo στηρίξαι litafsiriwe kwa neno rasmi zaidi linalomaanisha kufanya thabiti
  choice: kuwaimarisha
  alternative: kuwafanya imara; kuwathibitisha
  rationale: “Kuwaimarisha” ni Kiswahili cha sasa na cha kawaida, huku kikihifadhi maana ya kuwafanya wawe thabiti katika mwenendo na usemi mwema.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa urahisi. Umoja wa vitenzi “aitie” na “kuwaimarisha” unafuata wahusika wawili wa mstari wa 16 wanaotazamwa kwa pamoja kama chanzo cha tendo hilo; “mioyo yenu” inarejelewa kwa ngeli ya mi-/i-.
