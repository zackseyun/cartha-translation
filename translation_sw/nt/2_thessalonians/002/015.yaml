  to: Kwa hiyo basi, ndugu[a], simameni imara, na yashikeni mapokeo mliyofundishwa, iwe kwa mazungumzo au kwa barua yetu.
  rationale: The revision corrects the plural imperative and object agreement for κρατεῖτε by replacing “mshike sana” with “yashikeni kwa uthabiti.” It also renders the oral sense of διὰ λόγου more naturally in Swahili while retaining the source’s contrast with “barua yetu.” The rendering “mapokeo” and the qualified footnote concerning ἀδελφοί are retained.
  reviewer_model: gpt-5.6-terra
