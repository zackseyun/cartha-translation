review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the inferential force, the two imperatives, the handed-down character of παραδόσεις, and the contrast between oral and written apostolic instruction. However, “mshike” is not the plural imperative required for κρατεῖτε and therefore needs correction.
  naturalness: “Kwa hiyo basi” is a natural rendering of the strengthened inference ἄρα οὖν. “Simameni imara” and “yashikeni kwa uthabiti” form a clear, idiomatic pair in Standard East African Swahili. “Kwa mazungumzo” naturally conveys the oral sense of διὰ λόγου in contrast with a letter.
  terminology: “Mapokeo” accurately retains the sense of teachings handed down, without deciding later theological questions. “Ndugu” is a natural congregational address in Swahili; the footnote appropriately notes the formally masculine Greek expression and its probable whole-congregation reference.
  issues:
  - severity: high
    issue: “mshike sana” is not the appropriate plural imperative for κρατεῖτε.
    rationale: The addressees are plural. The plural imperative is “shikeni”; with the plural object “mapokeo,” “yashikeni” is both grammatically explicit and natural. The current form risks being read as a polite singular imperative and does not faithfully reproduce the Greek plural command.
  - severity: low
    issue: “kwa maneno” is less precise for the singular λόγου in its oral-versus-written contrast.
    rationale: Although understandable, “kwa mazungumzo” more idiomatically denotes communication delivered orally and avoids suggesting merely a plurality of isolated words.
  revised_text: Kwa hiyo basi, ndugu[a], simameni imara, na yashikeni mapokeo mliyofundishwa, iwe kwa mazungumzo au kwa barua yetu.
  revised_footnotes:
  - marker: a
    text: Umbo la Kigiriki ni la kiume, “ndugu,” lakini huenda linawahusu ndugu wa kiume na wa kike, yaani kusanyiko lote.
    reason: lexical_alternative
  revision_rationale: The revision corrects the plural imperative and object agreement for κρατεῖτε by replacing “mshike sana” with “yashikeni kwa uthabiti.” It also renders the oral sense of διὰ λόγου more naturally in Swahili while retaining the source’s contrast with “barua yetu.” The rendering “mapokeo” and the qualified footnote concerning ἀδελφοί are retained.
