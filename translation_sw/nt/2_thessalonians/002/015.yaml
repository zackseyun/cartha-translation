source:
  edition: SBLGNT
  text: ἄρα οὖν, ἀδελφοί, στήκετε, καὶ κρατεῖτε τὰς παραδόσεις ἃς ἐδιδάχθητε εἴτε διὰ λόγου εἴτε δι’ ἐπιστολῆς ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/015.yaml
  text: So then[a], brothers, stand firm and hold fast to the traditions that you were taught, whether by word or by our letter.
translation:
  language: sw
  text: Kwa hiyo basi, ndugu[a], simameni imara, na yashikeni mapokeo mliyofundishwa, iwe kwa mazungumzo au kwa barua yetu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Umbo la Kigiriki ni la kiume, “ndugu,” lakini huenda linawahusu ndugu wa kiume na wa kike, yaani kusanyiko lote.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα οὖν
  choice: Kwa hiyo
  rationale: Huonyesha hitimisho linalotokana na hoja iliyotangulia; ni usemi wa kawaida wa Kiswahili unaobeba nguvu ya kimantiki ya chembe hizi mbili bila kuwa mzito.
- source_word: ἀδελφοί
  choice: ndugu
  rationale: Neno la Kiswahili “ndugu” linafaa kama mwito kwa waumini na halilazimishi kubainisha jinsia; katika muktadha huu linaweza kulihusu kusanyiko lote, kama matumizi ya kawaida ya Paulo.
- source_word: στήκετε
  choice: simameni imara
  rationale: Kauli ya amri inaagiza uthabiti unaoendelea. “Simameni imara” ni ya asili na inadumisha taswira ya kusimama.
- source_word: κρατεῖτε
  choice: mshike sana
  rationale: Kitenzi kina maana ya kushikilia kwa nguvu au kuendelea kufuata. “Mshike sana” huhifadhi mkazo wa amri bila kuifanya kuwa maelezo marefu.
- source_word: παραδόσεις
  choice: mapokeo
  rationale: “Mapokeo” huonyesha mambo yaliyopokezwa kutoka kwa wengine, hivyo huhifadhi maana ya msingi ya παράδοσις na uhusiano wake na ufundishaji wa mdomo na wa maandishi.
- source_word: ἐδιδάχθητε
  choice: mliyofundishwa
  rationale: 'Huhifadhi hali ya kutendwa: Wathesalonike walikuwa wapokeaji wa mafundisho hayo.'
- source_word: διὰ λόγου
  choice: kwa maneno
  rationale: Katika utofautishaji na barua, λόγος hapa ni ujumbe uliotolewa kwa kusema. “Kwa maneno” ni fasaha na huonyesha njia ya mdomo bila kuongeza maelezo yasiyokuwamo.
- source_word: δι’ ἐπιστολῆς ἡμῶν
  choice: kwa barua yetu
  rationale: Huhifadhi utofautishaji kati ya mawasiliano ya mdomo na ya maandishi pamoja na kiwakilishi cha umilikaji ἡμῶν.
theological_decisions:
- issue: Maana ya παράδοσις katika mjadala kuhusu mapokeo ya kitume
  choice: mapokeo
  alternative: mafundisho; maagizo
  rationale: Neno la Kigiriki linamaanisha mambo yaliyokabidhiwa au kupokezwa, na mstari huu unataja njia ya mdomo na ya barua. “Mapokeo” huhifadhi maana hiyo bila kuamua madai ya baadaye ya kimadhehebu kuhusu upeo au mamlaka ya mapokeo.
- issue: Wanaorejelewa na ἀδελφοί katika kusanyiko lenye wanaume na wanawake
  choice: ndugu, pamoja na tanbihi inayofafanua kusanyiko lote
  alternative: ndugu wa kiume na wa kike
  rationale: “Ndugu” ni neno la kawaida na lenye heshima katika Kiswahili kwa waumini, huku tanbihi ikibainisha kwamba umbo la Kigiriki ni la kiume lakini huenda linawahusu wote katika kusanyiko.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa amri mbili na tofauti kati ya ujumbe wa mdomo na barua umehifadhiwa.
