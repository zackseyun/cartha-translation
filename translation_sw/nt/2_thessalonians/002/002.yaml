  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἰς τὸ μὴ ταχέως σαλευθῆναι ὑμᾶς ἀπὸ τοῦ νοὸς ⸀μηδὲ θροεῖσθαι μήτε διὰ πνεύματος μήτε διὰ λόγου μήτε δι’ ἐπιστολῆς ὡς δι’ ἡμῶν, ὡς ὅτι ἐνέστηκεν ἡ ἡμέρα τοῦ ⸀κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/002.yaml
  text: that you not be quickly shaken from your mind or alarmed[a], either by a spirit or by a message or by a letter as if from us[b], to the effect that the day of the Lord has come.
translation:
  language: sw
  text: ili msitikishwe upesi na kuondolewa katika utulivu wa akili zenu, wala msifadhaishwe, iwe kwa roho, kwa ujumbe, au kwa barua vinavyodaiwa kuwa vimetoka kwetu, ikisema kwamba siku ya Bwana imefika.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “tamko la kiroho” au “ufunuo wa kinabii.”
    reason: lexical_alternative
  - marker: b
    text: Au, “ipo sasa.” Kauli timilifu ya Kigiriki inaweza kumaanisha kwamba inadaiwa siku ya Bwana tayari imefika na sasa ipo.
    reason: alternative_reading
lexical_decisions:
- source_word: ταχέως
  choice: upesi
  rationale: Inaonyesha kwamba waamini wasiruhusu kuvurugwa kwa haraka; hapa si maana ya tukio kutokea karibuni.
- source_word: σαλευθῆναι ὑμᾶς ἀπὸ τοῦ νοὸς
  choice: msitikisike upesi na kuacha msimamo wenu wa akili
  rationale: ‘Msitikisike’ inahifadhi sitiari ya kutikiswa, na sehemu ya pili inaeleza nahau ya Kigiriki inayohusu kuondolewa katika hali thabiti ya kufikiri.
- source_word: θροεῖσθαι
  choice: msifadhaike
  rationale: Kitenzi kinaonyesha kushtushwa au kutiwa hofu; ‘msifadhaike’ ni cha kawaida na hakizidishi kiwango cha hisia.
- source_word: πνεύματος
  choice: roho
  rationale: Tafsiri hii inabaki karibu na nomino ya Kigiriki bila kuamua kimya-kimya kwamba ni Roho Mtakatifu au tamko la kinabii; uwezekano wa tamko la kiroho umewekwa katika tanbihi.
- source_word: λόγου
  choice: ujumbe
  rationale: Katika mfululizo huu unaotofautisha roho, mawasiliano ya mdomo, na barua, ‘ujumbe’ huwasilisha maana vizuri kuliko ‘neno’ pekee.
- source_word: ἐπιστολῆς ὡς δι’ ἡμῶν
  choice: barua inayodaiwa kuwa imetoka kwetu
  rationale: Inaonyesha kwamba barua hiyo ilihusishwa na Paulo na wenzake, bila kudai kwamba kweli ilitoka kwao.
- source_word: ὡς ὅτι
  choice: ikisema kwamba
  rationale: Hutambulisha maudhui ya madai kwa Kiswahili cha kawaida na huepuka kurudia muundo wa ‘kana kwamba’.
- source_word: ἐνέστηκεν
  choice: imekwisha kuja
  rationale: Kauli timilifu ya Kigiriki inawasilisha dai kwamba siku hiyo tayari imefika na hali yake ipo sasa; ‘imekwisha’ huonyesha wazi maana ya ‘tayari’.
- source_word: ἡ ἡμέρα τοῦ κυρίου
  choice: siku ya Bwana
  rationale: Ni usemi wa kieskatolojia uliozoeleka, si jina la siku ya ibada ya kila juma.
theological_decisions:
- issue: Maana ya ἐνέστηκεν katika dai kuhusu siku ya Bwana
  choice: imekwisha kuja
  alternative: ipo sasa; tayari imefika
  rationale: Kauli timilifu inaweza kuonyesha kufika ambako kumeleta hali ya sasa. Tafsiri kuu inaeleza dai kwamba siku hiyo tayari imekuja, huku tanbihi ikihifadhi maana ya moja kwa moja ya kuwapo sasa.
- issue: Maana ya πνεύματος katika vyanzo vitatu vinavyodaiwa
  choice: roho
  alternative: tamko la kiroho; ufunuo wa kinabii; Roho
  rationale: Kutokuwapo kwa kibainishi na muktadha wa ujumbe na barua kunaweza kuelekeza kwenye ufunuo au tamko linalodaiwa kuwa la kiroho, lakini tafsiri kuu haifungi uwezekano huo wala kuitambulisha moja kwa moja kuwa Roho Mtakatifu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo unaendelea kisarufi kutoka ombi la mstari uliotangulia. ‘Msimamo wenu wa akili’ unaweka wazi nahau ya Kigiriki bila kuondoa sitiari ya kutikiswa; ‘inayodaiwa’ inaonyesha uhusishaji wa uongo wa barua kwa waandishi.
