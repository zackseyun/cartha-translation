lexical_decisions:
- source_word: μνημονεύετε
  choice: hamkumbuki
  rationale: Kitenzi hiki kinauliza kwa njia ya balagha kama wasomaji wanakumbuka mafundisho ya awali. Kauli ya sasa ya Kiswahili ni ya kawaida na inalingana na hali ya sasa katika Kigiriki.
- source_word: ἔτι
  choice: bado
  rationale: Neno hili linaonyesha kwamba wakati wa mafundisho hayo Paulo alikuwa angali pamoja nao.
- source_word: ὢν πρὸς ὑμᾶς
  choice: nilipokuwa bado pamoja nanyi
  rationale: Muundo huu unaonyesha kipindi ambacho Paulo alikuwapo binafsi kati yao; kishazi cha wakati ni cha asili katika Kiswahili.
- source_word: ταῦτα
  choice: mambo haya
  rationale: Huhifadhi wingi wa kiwakilishi na kuelekeza kwenye mambo yaliyotajwa katika muktadha.
- source_word: ἔλεγον
  choice: nilikuwa nikiwaambia
  rationale: Muundo huu unaonyesha tendo lililokuwa likiendelea au kurudiwa zamani, kama hali isiyotimilifu ya kitenzi cha Kigiriki.
- source_word: οὐ ... ὅτι
  choice: Je, hamkumbuki kwamba ...?
  rationale: Huhifadhi swali la balagha lenye ukanushi pamoja na kishazi kinachoeleza jambo la kukumbukwa.
