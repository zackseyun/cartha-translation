  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἐρωτῶμεν δὲ ὑμᾶς, ἀδελφοί, ὑπὲρ τῆς παρουσίας τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ καὶ ἡμῶν ἐπισυναγωγῆς ἐπ’ αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/001.yaml
  text: We ask you[a], brothers, concerning the coming of our Lord Jesus the Messiah and our gathering together to him[b],
translation:
  language: sw
  text: Ndugu, tunawaomba kuhusu kuja kwa Bwana wetu Yesu Masihi[a] na kukusanywa kwetu pamoja kwake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yesu Kristo.” Neno la Kigiriki Χριστός limetafsiriwa “Masihi” hapa ili kuhifadhi maana yake kama cheo.
    reason: alternative_reading
  - marker: b
    text: Kigiriki kinaunganisha “kuja” kwa Bwana na “kukusanywa kwetu” kwake bila kufafanua wazi uhusiano wao wa wakati au wa kimantiki.
    reason: theological_ambiguity
lexical_decisions:
- source_word: Ἐρωτῶμεν
  choice: tunawaomba
  rationale: Katika muktadha huu kitenzi kinaanzisha ombi la kichungaji, si amri; “tunawaomba” ni Kiswahili cha kawaida chenye uzito wa upole unaofaa.
- source_word: δὲ
  choice: Basi
  rationale: δέ inaashiria mpito kwenda kwenye mada mpya inayohusiana na yaliyotangulia; “Basi” huleta mpito huo kwa kawaida bila kudokeza utofauti mkali.
- source_word: ἀδελφοί
  choice: ndugu
  rationale: “Ndugu” ni neno la kawaida la Kiswahili la kuwaita waamini na linaweza kujumuisha wanaume na wanawake bila kulazimisha ufafanuzi usio katika neno la Kigiriki.
- source_word: ὑπὲρ
  choice: kuhusu
  rationale: Hapa ὑπέρ hutambulisha jambo linalozungumziwa, si manufaa; “kuhusu” ni wazi na ya asili.
- source_word: παρουσίας
  choice: kuja
  rationale: Katika muktadha wa kieskatolojia παρουσία hurejelea ujio wa Bwana wa wakati ujao; “kuja” ni fasiri ya kawaida na inayoeleweka.
- source_word: κυρίου
  choice: Bwana
  rationale: “Bwana” huhifadhi wazo la mamlaka na uzito wa kitheolojia wa κύριος katika Agano Jipya.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesu Masihi
  rationale: Χριστός hapa ina nguvu ya cheo; “Masihi” huhifadhi maana yake badala ya kuitumia tu kama sehemu ya jina.
- source_word: ἐπισυναγωγῆς
  choice: kukusanywa ... pamoja
  rationale: Muundo huu huhifadhi maana ya kukusanyika pamoja iliyo katika nomino changamano bila kuingiza dhana ya taasisi.
- source_word: ἐπ’ αὐτόν
  choice: kwake
  rationale: Hueleza mwelekeo wa kukusanywa kwa waamini kwenda kwa Kristo kwa Kiswahili kifupi na cha kawaida.
theological_decisions:
- issue: Ufasiri wa Χριστοῦ katika cheo cha Kikristo
  choice: Masihi
  alternative: Kristo
  rationale: Katika kifungu hiki Χριστός bado inaonekana kama cheo; “Masihi” huwasilisha maana hiyo, huku “Kristo” ikihifadhiwa katika tanbihi kama namna iliyozoeleka.
- issue: Upeo wa ἀδελφοί
  choice: ndugu
  alternative: ndugu wanaume na wanawake
  rationale: “Ndugu” katika matumizi ya kawaida ya Kiswahili inaweza kulitaja kusanyiko lote na hivyo huhifadhi namna ya Paulo ya kuwaita wasomaji bila kuongeza maneno katika matini.
- issue: Uhusiano kati ya kuja kwa Bwana na kukusanywa kwetu kwake
  choice: Matukio hayo mawili yameunganishwa tu kwa “na”
  alternative: kukusanywa kwetu wakati wa kuja kwake
  rationale: Kigiriki hakifafanui wazi uhusiano wa wakati au wa kimantiki kati yake; tafsiri haipaswi kuingiza mpangilio maalumu wa kieskatolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mpangilio umefanywa kuwa wa kawaida kwa Kiswahili huku uratibu na utata halisi wa Kigiriki vikihifadhiwa.
