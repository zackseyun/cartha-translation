  text: so that all may be judged who did not believe the truth but took pleasure in unrighteousness[a].
translation:
  language: sw
  text: ili wote ambao hawakuamini ile kweli, bali walifurahia udhalimu, wahukumiwe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wahukumiwe adhabu.” Kitenzi cha Kigiriki kinaweza kudokeza hukumu mbaya katika muktadha huu, ingawa maana yake ya msingi zaidi ni “wahukumiwe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: ili
  rationale: Huunganisha kifungu hiki na kilichotangulia kwa kuonyesha kusudi au matokeo, bila kulazimisha mojawapo.
- source_word: κριθῶσιν
  choice: wahukumiwe
  rationale: Kitenzi hiki kwa msingi humaanisha kuhukumiwa au kuamuliwa katika muktadha wa kimahakama. Muktadha unaonyesha hukumu isiyofaa, lakini tafsiri kuu haiingizi moja kwa moja maana yenye nguvu zaidi ya 'waadhibiwe kuwa na hatia.'
- source_word: πάντες
  choice: wote
  rationale: Huwakilisha kwa ufupi na kwa kawaida maana ya jumla ya πάντες.
- source_word: οἱ μὴ πιστεύσαντες
  choice: ambao hawakuiamini
  rationale: Muundo wa kirai cha Kigiriki unawataja wale ambao hawakuamini. Katika Kiswahili, 'ambao hawakuiamini' huungana kwa kawaida na 'wote,' huku kiambishi -i- kikirejelea 'kweli.'
- source_word: τῇ ἀληθείᾳ
  choice: kweli
  rationale: Baada ya kuamini, Kiswahili cha kawaida hutumia 'kuamini kweli' au 'kuiamini kweli.' Hapa 'kweli' inaelekea kurejelea kweli maalumu ya ujumbe wa injili.
- source_word: ἀλλὰ
  choice: bali
  rationale: Huonyesha utofautishaji mkali kati ya kutoiamini kweli na kufurahia udhalimu.
- source_word: εὐδοκήσαντες
  choice: walifurahia
  rationale: Huhifadhi wazo la kupendezwa au kupata furaha katika jambo, si kulikubali kiakili tu.
- source_word: τῇ ἀδικίᾳ
  choice: udhalimu
  rationale: Neno hili linabeba maana pana ya kutokuwa na haki au uadilifu na lina register ya kimaadili inayofaa muktadha wa Paulo.
theological_decisions:
- issue: Ikiwa κριθῶσιν itafsiriwe kama kuhukumiwa kwa maana pana au kuadhibiwa kuwa na hatia
  choice: wahukumiwe
  alternative: waadhibiwe kuwa na hatia
  rationale: Muktadha unaonyesha wazi hukumu mbaya, lakini κρίνω yenyewe ni pana zaidi. Tafsiri kuu inadumisha mvutano huo, huku tanbihi ikitaja maana mbadala inayowezekana katika muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima, na rahisi kueleweka. 'Bali' inadumisha utofautishaji mkali, na 'udhalimu' huhifadhi uzito wa kimaadili wa ἀδικία bila kuufanya kuwa 'kutenda mabaya' tu.
