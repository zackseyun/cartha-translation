base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/007.yaml
  text: For the mystery of lawlessness is already at work[b][a]; only the one who now restrains will do so until he is out of the way.
translation:
  language: sw
  text: Kwa maana fumbo la uasi dhidi ya sheria tayari linafanya kazi; ila yule anayezuia kwa sasa ataendelea kuzuia mpaka asiwepo tena katikati.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “yule anayeshikilia kwa sasa”; Kigiriki hakimtambulishi anayefanya tendo hilo la kuzuia.
    reason: alternative_reading
lexical_decisions:
- source_word: μυστήριον
  choice: fumbo
  rationale: Neno “fumbo” linadumisha wazo la jambo lililofichika ambalo sasa linafanya kazi, bila kulifanya kuwa kitendawili tu.
- source_word: ἐνεργεῖται
  choice: tayari linafanya kazi
  rationale: Kauli hii ya kawaida inaonyesha kwamba utendaji huo unaendelea sasa na ulianza tayari.
- source_word: ἀνομίας
  choice: uasi dhidi ya sheria
  rationale: Hii inaonyesha maana ya kutotii au kupinga sheria na pia inadumisha uhusiano wake na uasi unaozungumziwa katika muktadha.
- source_word: μόνον
  choice: ila
  rationale: Katika sentensi hii neno hilo linaingiza sharti au kikomo kwa kauli iliyotangulia; “ila” ni ya asili na wazi kwa Kiswahili.
- source_word: ὁ κατέχων
  choice: yule anayezuia
  rationale: Inadumisha muundo wa kirai cha Kigiriki na haimtambulishi anayezuilia, ambaye hatajwi wazi katika mstari huu.
- source_word: ἄρτι
  choice: sasa
  rationale: Inaonyesha wakati wa sasa wa tendo la kuzuia kwa njia fupi na ya kawaida.
- source_word: ἕως ἐκ μέσου γένηται
  choice: mpaka atakapokuwa hayupo tena katikati
  rationale: Kauli hii inalenga hali ya kutokuwapo tena katikati bila kutaja wazi kwamba mtu mwingine ndiye aliyemwondoa.
theological_decisions:
- issue: Utambulisho wa ὁ κατέχων (“yule anayezuia”)
  choice: Kutafsiri kwa ujumla kuwa “yule anayezuia sasa” bila kumtambulisha.
  alternative: Dola ya Roma, serikali ya kibinadamu, Roho Mtakatifu, kiumbe wa kimalaika, Paulo, au mahubiri ya kitume.
  rationale: Kigiriki kinamtaja anayefanya tendo la kuzuia lakini hakimtambulishi katika mstari huu; tafsiri inapaswa kudumisha utata huo wa kimakusudi.
- issue: Mtendaji katika ἕως ἐκ μέσου γένηται
  choice: Kutumia “mpaka atakapokuwa hayupo tena katikati.”
  alternative: “Mpaka atakapoondolewa” au “mpaka atakapoondoshwa.”
  rationale: Kigiriki hakisemi wazi ni nani anayesababisha kuondoka huko. Tafsiri iliyochaguliwa inaonyesha hali inayotokea bila kuongeza mtendaji asiyeelezwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo unaepuka kumtambulisha anayezuilia au kutaja mtendaji wa kuondolewa kwake.
