  text: And now you know what is restraining him[b][a], so that he may be revealed in his own time.
translation:
  language: sw
  text: Na sasa mnajua kile kinachomzuia[a], ili afunuliwe kwa wakati wake mwenyewe.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kile kinachomshikilia.” Kigiriki kinatumia usemi wa jinsia ya kati na hakitambulishi hapa nguvu inayomzuia.
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa wakati wake uliowekwa.” Usemi wa Kigiriki unaweza kumaanisha wakati unaofaa au uliowekwa.
    reason: alternative_reading
lexical_decisions:
- source_word: κατέχον
  choice: kile kinachomzuia
  rationale: Muundo wa Kigiriki τὸ κατέχον ni wa jinsia ya kati na hautambulishi nguvu au mhusika anayemzuia. “Kile kinachomzuia” ni Kiswahili cha kawaida kinachohifadhi kutotajwa kwa utambulisho huo.
- source_word: οἴδατε
  choice: mnajua
  rationale: Kitenzi hiki kina umbo la wakati timilifu lakini maana ya sasa; “mnajua” huwasilisha kwa kawaida rejeo la Paulo kwa mafundisho waliyopewa tayari.
- source_word: εἰς τὸ ἀποκαλυφθῆναι
  choice: ili afunuliwe
  rationale: Muundo wa εἰς pamoja na kitenzi-jina unaonyesha kusudi au matokeo. “Ili afunuliwe” ni wazi na huhifadhi hali ya kutendwa.
- source_word: ἐν τῷ ἑαυτοῦ καιρῷ
  choice: kwa wakati wake mwenyewe
  rationale: καιρός ni wakati unaofaa au uliowekwa, huku ἑαυτοῦ ikisisitiza kuwa ni wakati wake huyo mhusika. Tafsiri kuu inaacha wazi zaidi ikiwa wakati huo umewekwa rasmi.
- source_word: νῦν
  choice: sasa
  rationale: Ni kielezi cha wakati kinachotafsiriwa kwa kawaida kuwa “sasa”.
- source_word: αὐτόν
  choice: -m- / a- katika “kinachomzuia” na “afunuliwe”
  rationale: Kiwakilishi cha kiume kinarejelea mtu aliyetajwa kabla; viambishi vya Kiswahili vinadumisha rejeo hilo bila kumtambulisha zaidi.
theological_decisions:
- issue: Utambulisho wa kile au yule anayemzuia
  choice: 'Kutafsiri bila kutambulisha nguvu au mhusika: “kile kinachomzuia.”'
  alternative: Serikali ya Roma; Roho Mtakatifu; nguvu ya kimalaika; au amri/majaliwa ya Mungu.
  rationale: Aya yenyewe haitambui kizuizi hicho, na umbo la Kigiriki la jinsia ya kati haliruhusu kuingiza kwa lazima tafsiri yoyote ya kimadhehebu.
- issue: Maana ya καιρός katika muktadha wa matukio ya mwisho
  choice: “wakati wake mwenyewe”
  alternative: “wakati wake uliowekwa” au “wakati unaomfaa”
  rationale: καιρός inaweza kumaanisha wakati unaofaa au uliowekwa, lakini tafsiri kuu yenye upana zaidi inahifadhi hali ya kutobainishwa kikamilifu katika chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Kile kinachomzuia” ni cha kawaida na huepuka kumtaja kwa kubuni anayemzuia. Mpangilio wa alama za tanbihi umewekwa kulingana na maneno yanayofafanuliwa.
