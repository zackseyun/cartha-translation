  text: whose coming is according to the working of Satan[b][a], with all power and signs and wonders of falsehood.
translation:
  language: sw
  text: ambaye kuja kwake ni kwa kadiri ya utendaji wa Shetani[a], kwa nguvu zote na ishara na maajabu ya uongo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ambaye kuwapo kwake au kuwasili kwake ni kwa kadiri ya utendaji wa Shetani.”
    reason: lexical_alternative
  - marker: b
    text: 'Kwa tafsiri ya karibu zaidi: “katika nguvu zote na ishara na maajabu ya uongo”; pia yaweza kueleweka kuwa “maajabu yenye kudanganya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗ
  choice: ambaye ... kwake
  rationale: Kiwakilishi hiki cha uhusiano katika hali ya umilikaji kinamrejelea yule asiye na sheria wa mstari uliotangulia; muundo huu unaunganisha sentensi kwa Kiswahili cha asili huku ukihifadhi uhusiano huo.
- source_word: παρουσία
  choice: kuja
  rationale: Katika muktadha huu wa matukio ya mwisho, neno hili linaashiria kuwasili au kujitokeza kwa mhusika, si kuwapo tu.
- source_word: κατ’ ἐνέργειαν
  choice: kwa mujibu wa utendaji
  rationale: Kauli hii inaonyesha kwamba namna ya kuja kwake inalingana na shughuli yenye nguvu ya Shetani, bila kuibana kuwa sababu pekee.
- source_word: τοῦ Σατανᾶ
  choice: wa Shetani
  rationale: Jina la kawaida la Agano Jipya linatumiwa; hali ya umilikaji inaonyesha kwamba utendaji huo ni wake au unatoka kwake.
- source_word: ἐν πάσῃ δυνάμει
  choice: kukiambatana na kila aina ya nguvu
  rationale: ἐν hapa inaonyesha hali au mambo yanayoandamana na kuja huko; πάσῃ inaweza kueleweka kwa upana kuwa kila aina ya nguvu.
- source_word: σημείοις
  choice: ishara
  rationale: Hili ndilo neno la kawaida kwa matendo au matukio yenye maana ya kuashiria au kuthibitisha jambo.
- source_word: τέρασιν
  choice: maajabu
  rationale: Neno hili linaeleza matukio ya ajabu yanayostaajabisha na linaendana kwa kawaida na 'ishara'.
- source_word: ψεύδους
  choice: ya uongo
  rationale: Hali ya umilikaji inaonyesha uongo unaozitambulisha ishara na maajabu, na huenda ikahusu orodha nzima; tafsiri hii haikati kauli kwamba matukio hayo ni hila tupu.
theological_decisions:
- issue: Asili ya nguvu, ishara na maajabu ya kishetani
  choice: Kauli 'ya uongo' inaacha wazi ikiwa matukio hayo ni bandia kabisa au yana nguvu halisi lakini yanatumiwa kudanganya.
  alternative: Kuyaita moja kwa moja miujiza bandia, au kuthibitisha kwamba ni miujiza halisi ya Shetani.
  rationale: Kigiriki kinahusisha kuja kwa huyo mtu na utendaji wa Shetani na ψεύδους, lakini hakitoi ufafanuzi kamili wa asili ya matukio hayo; hivyo mvutano wa kiteolojia unahifadhiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa orodha na utata wa ψεύδους umehifadhiwa bila kuingiza msimamo wa dhehebu.
