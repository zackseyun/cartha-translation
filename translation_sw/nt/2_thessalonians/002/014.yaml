  text: to which he called you through our gospel[b][a], for obtaining the glory of our Lord Jesus the Messiah.
translation:
  language: sw
  text: Kwa kusudi hilo Mungu aliwaita kwa njia ya injili yetu, ili mpate utukufu wa Bwana wetu Yesu Masihi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa usemi wa kimapokeo, “Yesu Kristo.” Kirai “ili mpate utukufu” kinaweza pia kutafsiriwa “ili kuupata utukufu,” “ili kuumiliki utukufu,” au “ili kushiriki utukufu” wa Bwana wetu Yesu Masihi.
    reason: Mbadala wa kimapokeo wa Χριστός na wigo wa kimaana wa περιποίησις.
lexical_decisions:
- source_word: εἰς ὃ
  choice: Kwa jambo hilo
  rationale: Kirai hiki kinaelekeza nyuma kwenye wokovu na utakaso wa mstari uliotangulia bila kulazimisha rejeo moja finyu; pia kinaweza kuonyesha lengo ambalo Mungu aliwaitia.
- source_word: ἐκάλεσεν ὑμᾶς
  choice: Mungu aliwaita
  rationale: Kitenzi cha Kigiriki hakitaji mtendaji wazi katika mstari huu, lakini mtendaji anayeeleweka kutokana na muktadha ni Mungu. “Aliwaita” huhifadhi uzito wa mwito wa wokovu bila kuufafanua kwa mfumo fulani wa kiteolojia.
- source_word: διὰ τοῦ εὐαγγελίου ἡμῶν
  choice: kupitia injili tuliyowahubiria
  rationale: διά pamoja na jenitivi huonyesha njia au chombo. Maelezo “tuliyowahubiria” yanafafanua kwa Kiswahili cha kawaida kwamba “injili yetu” ni injili iliyohubiriwa na mitume, si injili tofauti iliyokuwa mali yao.
- source_word: εἰς περιποίησιν δόξης
  choice: ili mpate utukufu
  rationale: περιποίησις inaweza kumaanisha kupata, kujipatia, au kuwa na milki. “Ili mpate” ni ya asili na huhifadhi lengo la kirai bila kuamua kupita kiasi kati ya kupata utukufu na kushiriki ndani yake.
- source_word: τοῦ κυρίου ἡμῶν
  choice: wa Bwana wetu
  rationale: “Bwana” ni tafsiri ya kawaida, yenye heshima na uzito unaofaa kwa κύριος katika muktadha huu.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesu Masihi
  rationale: Χριστός hapa inaendelea kuwa cheo chenye maana ya Masihi; Kiswahili hakihitaji kibainishi kinacholingana na “the” ya Kiingereza kabla ya cheo hiki.
theological_decisions:
- issue: Asili ya mwito wa Mungu katika wokovu
  choice: aliwaita
  alternative: aliwaalika; aliwaita kwa mwito wenye matokeo yasiyozuilika
  rationale: Tafsiri inahifadhi usemi wa Paulo bila kuufanya mwito kuwa mwaliko tu wala kuingiza fundisho maalumu kuhusu jinsi mwito huo unavyofanya kazi.
- issue: Maana ya εἰς περιποίησιν δόξης
  choice: ili mpate utukufu
  alternative: ili umiliki utukufu; ili mshiriki utukufu
  rationale: Neno περιποίησις lina wigo wa kupata au kumiliki. Main text inatumia Kiswahili cha kawaida, huku tanbihi ikihifadhi uwezekano wa maana ya kushiriki utukufu.
- issue: Tafsiri ya Χριστοῦ
  choice: Masihi
  alternative: Kristo
  rationale: “Masihi” huonyesha wazi maana ya cheo cha Kigiriki; umbo la kimapokeo “Kristo” linahifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imefanywa ya asili kwa wasomaji wa kawaida huku ikihifadhi mwelekeo wa hoja ya Kigiriki, mwito wa Mungu kupitia injili, na kutokuwa na uhakika kamili kuhusu nuances za περιποίησις.
