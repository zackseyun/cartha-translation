id: 2TH.2.4
reference: 2 Thessalonians 2:4
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὁ ἀντικείμενος καὶ ὑπεραιρόμενος ἐπὶ πάντα λεγόμενον θεὸν ἢ σέβασμα, ὥστε αὐτὸν εἰς τὸν ναὸν τοῦ ⸀θεοῦ καθίσαι ἀποδεικνύντα ἑαυτὸν ὅτι ἔστιν θεός.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/004.yaml
  text: the one who opposes and exalts himself over every so-called god or object of worship[a], so that he takes his seat in the temple of God[b], displaying himself as being God.
translation:
  language: sw
  text: yule anayepinga na kujiinua juu ya kila kinachoitwa mungu au kitu kinachoabudiwa, hata akaketi katika hekalu la Mungu[a], akijionyesha kuwa yeye ni Mungu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “patakatifu pa Mungu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “akijionyesha kuwa yeye ni mungu.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ἀντικείμενος
  choice: yule anayepinga
  rationale: Kirai cha kisifa chenye kibainishi kimetumiwa kama nomino; tafsiri hii huhifadhi maana ya upinzani unaoendelea bila kuingiza cheo maalumu kisichotajwa wazi katika Kigiriki.
- source_word: ὑπεραιρόμενος
  choice: kujiinua juu ya
  rationale: Umbo hili linaonyesha kujikweza mwenyewe; ‘kujiinua juu ya’ ni Kiswahili cha kawaida kinachohifadhi nguvu ya kujirejelea na wazo la kujifanya mkuu kuliko wengine.
- source_word: ἐπὶ πάντα λεγόμενον θεὸν
  choice: juu ya kila anayeitwa mungu
  rationale: ἐπί pamoja na hali ya ushtaki baada ya kitenzi cha kujiinua huonyesha kuwa juu kuliko. ‘Anayeitwa mungu’ huhifadhi wazo la designation bila kuthibitisha kwamba huyo ni mungu kweli.
- source_word: ἢ σέβασμα
  choice: au kitu kinachoabudiwa
  rationale: σέβασμα ni kitu chochote kinachopewa heshima ya kidini, si lazima kiwe mungu; uchaguzi huu ni wazi na mpana katika Kiswahili cha sasa.
- source_word: ὥστε ... καθίσαι
  choice: hata akaketi
  rationale: Muundo unaonyesha matokeo yanayofikia kilele. ‘Hata akaketi’ ni wa asili katika Kiswahili na huwasilisha hatua ya kuketi kama tokeo la kujiinua kwake.
- source_word: εἰς τὸν ναὸν τοῦ θεοῦ
  choice: katika hekalu la Mungu
  rationale: Ingawa εἰς kwa kawaida huashiria kuingia au kuelekea ndani, pamoja na καθίσαι hapa Kiswahili cha kawaida hutumia ‘katika’. ναός inaweza kumaanisha hekalu, hasa sehemu yake takatifu; ‘hekalu la Mungu’ ni wazi bila kubana tafsiri kuwa jengo halisi au mfano.
- source_word: ἀποδεικνύντα ἑαυτὸν
  choice: akijionyesha
  rationale: Kitenzi kinaonyesha kujidhihirisha au kujionyesha kuwa kitu fulani, bila kulazimisha maana ya kutoa tamko rasmi kwa maneno.
- source_word: ὅτι ἔστιν θεός
  choice: kuwa yeye ni Mungu
  rationale: Katika muktadha wa kuketi katika hekalu la Mungu, ‘Mungu’ huonyesha vizuri kilele cha dai la kufuru. Hata hivyo, kwa kuwa θεός haina kibainishi, uwezekano wa ‘mungu’ umehifadhiwa katika tanbihi.
theological_decisions:
- issue: Ikiwa θεός ya mwisho itafsiriwe ‘Mungu’ au ‘mungu’
  choice: Mungu
  alternative: mungu
  rationale: Mhusika anaketi katika hekalu la Mungu na kujionyesha kwa dai kuu la kimungu; ‘Mungu’ huhifadhi nguvu ya dai hilo bila kuthibitisha kuwa yeye kweli ni Mungu. Kwa kuwa nomino ya Kigiriki haina kibainishi, ‘mungu’ bado inawezekana na imewekwa katika tanbihi.
- issue: Ikiwa ναός itafsiriwe ‘hekalu’ au ‘patakatifu’
  choice: hekalu la Mungu
  alternative: patakatifu pa Mungu
  rationale: ναός inaweza kuelekeza hasa sehemu takatifu ya hekalu, lakini ‘hekalu la Mungu’ ni wazi na la kawaida zaidi, na halisuluhishi kimyakimya mjadala wa ikiwa picha hii ni ya mahali halisi au ya kiishara.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi huhifadhi mlolongo wa Kigiriki na mvutano wa kiteolojia bila kuingiza tafsiri ya kimadhehebu.
