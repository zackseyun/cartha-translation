  text: Ἡμεῖς δὲ ὀφείλομεν εὐχαριστεῖν τῷ θεῷ πάντοτε περὶ ὑμῶν, ἀδελφοὶ ἠγαπημένοι ὑπὸ κυρίου, ὅτι εἵλατο ὑμᾶς ὁ θεὸς ⸀ἀπαρχὴν εἰς σωτηρίαν ἐν ἁγιασμῷ πνεύματος καὶ πίστει ἀληθείας,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/013.yaml
  text: But we ought always to give thanks to God for you[a], brothers beloved by the Lord, because God chose you as firstfruits for salvation through sanctification by the Spirit and faith in the truth[b],
translation:
  language: sw
  text: Lakini sisi tunapaswa kumshukuru Mungu daima kwa ajili yenu, ndugu[b] mnaopendwa na Bwana, kwa sababu Mungu aliwachagua ninyi kuwa malimbuko[a] kwa wokovu, kupitia kutakaswa na Roho na imani katika kweli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati zina, “tangu mwanzo,” badala ya “kuwa malimbuko.” Maandishi makuu yanafuata usomaji ἀπαρχήν (“malimbuko”); usomaji mwingine ni ἀπ’ ἀρχῆς (“tangu mwanzo”).
    reason: textual_variant
  - marker: b
    text: Neno “ndugu” limetafsiri nomino ya Kigiriki ya wingi wa kiume ἀδελφοί; katika mwito huu linaweza kujumuisha jumuiya nzima ya waamini, wanaume na wanawake.
    reason: cultural_note
lexical_decisions:
- source_word: Ἡμεῖς δὲ
  choice: Lakini sisi
  rationale: δὲ inaonyesha utofautishaji na maelezo yaliyotangulia, huku kiwakilishi cha wazi Ἡμεῖς kikisisitiza wahusika; “Lakini sisi” huhifadhi yote mawili kwa Kiswahili cha kawaida.
- source_word: ὀφείλομεν
  choice: tunapaswa
  rationale: Huonyesha wajibu unaofaa wa kimaadili bila kuufanya kuwa amri ya kulazimisha kupita kiasi.
- source_word: εὐχαριστεῖν τῷ θεῷ πάντοτε περὶ ὑμῶν
  choice: kumshukuru Mungu daima kwa ajili yenu
  rationale: Ni usemi wa asili katika Kiswahili unaohifadhi tendo la kumshukuru Mungu na sababu inayowahusu wapokeaji.
- source_word: ἀδελφοὶ ἠγαπημένοι ὑπὸ κυρίου
  choice: ndugu mnaopendwa na Bwana
  rationale: “Ndugu” ni mwito wa kawaida wa jumuiya na unaweza kuwahusu waamini wote; umbo la kutendwa katika ἠγαπημένοι na mtendaji ὑπὸ κυρίου vinahifadhiwa wazi.
- source_word: εἵλατο ὑμᾶς ὁ θεὸς
  choice: Mungu aliwachagua ninyi
  rationale: “Aliwachagua” hutoa maana ya moja kwa moja ya αἱρέομαι bila kuongeza mfumo maalumu wa kimadhehebu; “ninyi” huhifadhi msisitizo wa ὑμᾶς.
- source_word: ἀπαρχὴν
  choice: kuwa malimbuko
  rationale: Hufuata usomaji wa SBLGNT ἀπαρχήν na kudumisha taswira ya sehemu ya kwanza ya mavuno inayowekwa wakfu, badala ya kuingiza usomaji tofauti ἀπ’ ἀρχῆς.
- source_word: εἰς σωτηρίαν
  choice: kwa ajili ya wokovu
  rationale: Huwasilisha lengo au matokeo yanayoonyeshwa na εἰς bila kufafanua zaidi ya maandishi.
- source_word: ἐν ἁγιασμῷ πνεύματος
  choice: kupitia kutakaswa na Roho
  rationale: “Kupitia” huwasilisha maana ya njia; “kutakaswa” ni lugha inayoeleweka ya kuwekwa katika hali ya utakatifu. Muktadha wa wokovu wa Paulo unaelekeza πνεύματος kwa Roho Mtakatifu.
- source_word: καὶ πίστει ἀληθείας
  choice: na kuiamini kweli
  rationale: Huchukua genitivi ἀληθείας kama lengo la πίστις na kuieleza kwa Kiswahili cha kawaida bila kupoteza maana ya imani katika kweli.
theological_decisions:
- issue: Maana ya πνεύματος katika ἐν ἁγιασμῷ πνεύματος
  choice: Roho Mtakatifu, ikionyeshwa kwa “Roho” yenye herufi kubwa
  alternative: roho ya mwanadamu
  rationale: Katika muktadha huu wa wokovu, tendo la kutakasa linaeleweka kwa kawaida kuwa kazi ya Roho Mtakatifu. Tafsiri haiongezi neno “Mtakatifu,” lakini herufi kubwa inaonyesha uamuzi huu wa kimuktadha.
- issue: Maana ya εἵλατο ὑμᾶς ὁ θεὸς
  choice: Mungu aliwachagua ninyi
  alternative: Mungu aliwateua / aliwachukua kuwa wake
  rationale: Tafsiri inahifadhi kauli ya wazi ya Mungu kuchagua bila kuamua maswali ya kimadhehebu kuhusu namna, wakati, au masharti ya uchaguzi huo.
- issue: Uhusiano wa ἁγιασμῷ πνεύματος na πίστει ἀληθείας
  choice: 'njia mbili zilizounganishwa: kutakaswa na Roho na kuiamini kweli'
  alternative: vipengele viwili vya mazingira ambamo wokovu unatimizwa
  rationale: καὶ huunganisha virai hivyo kwa usawa, huku ἐν ikiruhusu wazo la njia au mazingira. “Kupitia” ni ya asili katika Kiswahili lakini haikusudii kuweka mpangilio wa kimantiki au wa wakati kati yake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya maandiko bila kuwa kizito. “Malimbuko” limehifadhiwa kwa sababu ni taswira muhimu ya chanzo, na tofauti ya hati imeelezwa katika tanbihi. Alama zote za tanbihi zimewekwa katika maandishi makuu.
