  footnotes:
  - marker: a
    text: Au, “kwa roho ya kinywa chake.” Neno la Kigiriki linaweza kumaanisha “pumzi” au “roho”; “pumzi” inafaa zaidi katika tamathali hii.
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa udhihirisho wa kuwapo kwake.” Katika muktadha huu “kuja” ndiyo maana ya kawaida ya παρουσία, ingawa neno hilo pia linaweza kumaanisha “kuwapo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκαλυφθήσεται
  choice: atakapofunuliwa
  rationale: Kitenzi cha wakati ujao katika hali ya kutendwa kinaonyesha kwamba yule mwasi atawekwa wazi; “atakapofunuliwa” huhifadhi hali hiyo na inafaa katika muktadha wa ufunuo wa mambo ya mwisho.
- source_word: ὁ ἄνομος
  choice: yule mwasi wa sheria
  rationale: Kivumishi chenye kibainishi kimetumiwa kama nomino. Tafsiri hii inamtaja mhusika anayejulikana katika muktadha bila kuongeza neno “mtu,” ambalo halipo wazi katika mstari huu.
- source_word: ὁ κύριος Ἰησοῦς
  choice: Bwana Yesu
  rationale: Huhifadhi jina na cheo cha kawaida cha Agano Jipya kwa Kiswahili.
- source_word: ἀνελεῖ
  choice: atamwua
  rationale: Katika muktadha huu kitenzi kina maana ya kumuua au kumwangamiza mtu; “atamwua” ni wazi, cha sasa, na hakipunguzi nguvu ya kauli.
- source_word: τῷ πνεύματι τοῦ στόματος αὐτοῦ
  choice: kwa pumzi ya kinywa chake
  rationale: πνεῦμα inaweza kumaanisha “pumzi” au “roho”; katika tamathali hii “pumzi ya kinywa” ndiyo maana ya kawaida zaidi na inaendana na taswira ya hukumu ya kinabii.
- source_word: καταργήσει
  choice: kumfanya kuwa si kitu
  rationale: Kitenzi kina wazo la kubatilisha, kuondoa nguvu, au kukomesha kabisa. Kauli hii huhifadhi wazo la kufanywa asiwe na athari bila kulazimisha maana ya kuangamizwa kabisa.
- source_word: τῇ ἐπιφανείᾳ
  choice: kwa udhihirisho
  rationale: ἐπιφάνεια humaanisha kuonekana au kujidhihirisha wazi; “udhihirisho” ni wa asili na wenye hadhi katika muundo huu.
- source_word: τῆς παρουσίας αὐτοῦ
  choice: wa kuja kwake
  rationale: Katika muktadha wa mambo ya mwisho, παρουσία kwa kawaida humaanisha kuja au kuwasili kwa Kristo, ingawa maana ya “kuwapo” pia iko katika upeo wa neno.
theological_decisions:
- issue: Utambulisho na maelezo ya mpinzani wa nyakati za mwisho
  choice: yule mwasi wa sheria
  alternative: yule mtu wa uasi dhidi ya sheria
  rationale: Mstari huu una ὁ ἄνομος, si usemi mpana wa mistari inayouzunguka. Tafsiri iliyochaguliwa inafuata maneno ya mstari huu bila kuingiza jina kamili kutoka katika muktadha wa karibu.
- issue: Njia ambayo Bwana Yesu anamshinda mpinzani
  choice: kwa pumzi ya kinywa chake
  alternative: kwa roho ya kinywa chake
  rationale: “Pumzi” ndiyo maana inayofaa zaidi katika tamathali hii, lakini “roho” inawezekana kileksika, hivyo imehifadhiwa katika tanbihi.
- issue: Matokeo ya udhihirisho wa kuja kwa Yesu
  choice: kumfanya kuwa si kitu
  alternative: kumwangamiza
  rationale: Uchaguzi huu huhifadhi wigo wa καταργέω wa kubatilisha au kuondoa nguvu, bila kuamua kimya-kimya kwamba neno lenyewe linamaanisha kuangamiza kabisa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi mbili zimetumiwa ili kuepuka kishazi kirefu na kizito, huku uhusiano wa mawazo ya Kigiriki ukihifadhiwa. Alama za tanbihi zimewekwa moja kwa moja baada ya maneno ambayo zinafafanua.
