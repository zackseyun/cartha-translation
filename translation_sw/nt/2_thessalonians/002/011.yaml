lexical_decisions:
- source_word: διὰ τοῦτο
  choice: kwa sababu hiyo
  rationale: Kauli hii inaonyesha sababu inayorejelea kukataa kwao kuupenda ukweli katika muktadha uliotangulia; haitafsiriwi tu kama hitimisho la kawaida.
- source_word: πέμπει αὐτοῖς
  choice: anawapelekea
  rationale: Kitenzi cha wakati uliopo na Mungu kama mtendaji kimehifadhiwa moja kwa moja. ‘Anawapelekea’ ni Kiswahili cha kawaida kinachobeba maana ya kuwatumia kitu bila kuigeuza kuwa ruhusa tu.
- source_word: ἐνέργειαν πλάνης
  choice: utendaji wa upotovu
  rationale: ‘Utendaji’ huhifadhi wazo la nguvu au shughuli inayofanya kazi, huku ‘wa upotovu’ ikihifadhi muundo wa nomino mbili na utata wa iwapo ni utendaji unaopotosha au utendaji wenye sifa ya upotovu.
- source_word: εἰς τὸ πιστεῦσαι
  choice: ili waamini
  rationale: Muundo huu wa Kiswahili unaacha wazi mchanganyiko wa kusudi na matokeo uliomo katika Kigiriki bila kuulazimisha upande mmoja.
- source_word: τῷ ψεύδει
  choice: ule uongo
  rationale: ‘Ule’ huhifadhi umahususi wa kibainishi cha Kigiriki na kuonyesha uongo maalumu unaohusiana na udanganyifu unaozungumziwa katika muktadha.
theological_decisions:
- issue: Utendaji wa Mungu katika hukumu inayowafanya watu kuwa wagumu
  choice: Mungu anawapelekea utendaji wa upotovu
  alternative: Mungu anaruhusu utendaji wa upotovu uwajie
  rationale: Kigiriki kinamtaja Mungu moja kwa moja kuwa ndiye mtendaji wa ‘anawapelekea.’ Tafsiri haidhoofishi kauli hii iwe ruhusa tu, bali inadumisha mvutano wa kiteolojia kati ya hukumu ya Mungu na kukataa kwa binadamu ukweli.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Utendaji wa upotovu’ si tamko la mazungumzo ya kila siku, lakini limetumiwa kwa uwazi wa kimuundo ili kuhifadhi nomino mbili za Kigiriki na utata wake; tanbihi inatoa mbadala wa kawaida zaidi.
