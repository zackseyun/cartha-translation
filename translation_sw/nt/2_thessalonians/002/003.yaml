  text: μή τις ὑμᾶς ἐξαπατήσῃ κατὰ μηδένα τρόπον· ὅτι ἐὰν μὴ ἔλθῃ ἡ ἀποστασία πρῶτον καὶ ἀποκαλυφθῇ ὁ ἄνθρωπος τῆς ⸀ἀνομίας, ὁ υἱὸς τῆς ἀπωλείας,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/003.yaml
  text: Let no one deceive you in any way[a], because that day will not come unless the rebellion comes first and the man of lawlessness is revealed[b], the son of destruction.
translation:
  language: sw
  text: Mtu yeyote asiwadanganye kwa njia yoyote, kwa sababu siku hiyo haitakuja isipokuwa uasi[a] utokee kwanza na mtu wa uasi dhidi ya sheria afunuliwe[b], mwana wa maangamizi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “uasi wa imani” au “kuiacha imani.” Neno la Kigiriki linaweza kumaanisha uasi mkubwa; mara nyingi hueleweka kuwa kuiacha imani.
    reason: alternative_reading
  - marker: b
    text: Baadhi ya hati zina “mtu wa dhambi” badala ya “mtu wa uasi dhidi ya sheria.”
    reason: textual_variant
lexical_decisions:
- source_word: ἐξαπατήσῃ
  choice: asiwadanganye
  rationale: Kitenzi hiki humaanisha kudanganya au kupotosha. “Asiwadanganye” ni onyo la kawaida na la moja kwa moja katika Kiswahili cha sasa.
- source_word: κατὰ μηδένα τρόπον
  choice: kwa njia yoyote
  rationale: Kirai hiki kinakazia kwamba wasikubali kudanganywa kwa namna yoyote.
- source_word: ὅτι
  choice: kwa sababu
  rationale: Hapa ὅτι inatanguliza sababu ya onyo lililotolewa.
- source_word: ἐὰν μὴ ἔλθῃ
  choice: haitakuja mpaka ... utokee
  rationale: Muundo huu unaonyesha sharti la matukio kutangulia. “Siku hiyo” imetajwa wazi kutokana na muktadha wa mstari uliotangulia ili sentensi iwe kamili na wazi kwa Kiswahili.
- source_word: ἀποστασία
  choice: uasi
  rationale: Neno hili linaweza kumaanisha uasi, kujitenga, au kuiacha imani. “Uasi” huhifadhi maana pana bila kulazimisha mapema tafsiri kwamba ni kuiacha dini pekee.
- source_word: πρῶτον
  choice: kwanza
  rationale: 'Neno hili linaonyesha mpangilio wa matukio: uasi na kufunuliwa kwa mtu huyo lazima vitangulie.'
- source_word: ἀποκαλυφθῇ
  choice: afunuliwe
  rationale: Kauli tendwa inaonyesha kwamba mtu huyo atawekwa wazi au atadhihirishwa; “afunuliwe” pia huhifadhi ladha ya ufunuo wa mambo ya mwisho.
- source_word: ὁ ἄνθρωπος τῆς ἀνομίας
  choice: mtu wa uasi-sheria
  rationale: Ufasiri huu unafuata neno ἀνομία katika SBLGNT na kudumisha wazo la kukataa au kuvunja sheria. “Mtu” inafaa kwa umoja wa kiume unaorejelea mtu mahususi.
- source_word: ὁ υἱὸς τῆς ἀπωλείας
  choice: mwana wa maangamizi
  rationale: Huu ni msemo wenye muundo wa Kisemiti unaoweza kumtaja mtu anayehusishwa na maangamizi au aliyeelekea kuangamia. Tafsiri hii huhifadhi umbo na mvutano wa msemo wa Kigiriki.
theological_decisions:
- issue: Kutaja wazi kiima kilichodokezwa cha “haitakuja”
  choice: “siku hiyo” imetajwa wazi katika maandishi
  alternative: 'Kuacha sentensi ikiwa na pengo kama Kigiriki: “kwa sababu, uasi usipotokea kwanza...”'
  rationale: Muktadha wa 2:2 unaonyesha kwamba kinachozungumziwa ni siku ya Bwana. Kukitaja kunaleta Kiswahili cha kawaida bila kuongeza dai jipya la kitheolojia.
- issue: Maana ya ἀποστασία
  choice: uasi
  alternative: kuiacha imani; kujitenga
  rationale: Neno linaweza kueleza uasi kwa upana au kuasi imani hasa. Maandishi makuu yanatumia neno pana, huku tanbihi ikihifadhi uwezekano wa maana ya kidini.
- issue: Tofauti ya maandishi katika τῆς ἀνομίας
  choice: mtu wa uasi-sheria
  alternative: mtu wa dhambi
  rationale: Maandishi yaliyotolewa ya SBLGNT yana ἀνομίας, “uasi-sheria.” Tofauti inayojulikana ya “dhambi” imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imetengenezwa kwa mtiririko wa kawaida, lakini misemo muhimu “mtu wa uasi-sheria” na “mwana wa maangamizi” imehifadhi ukaribu na muundo wa Kigiriki ili kutoondoa utata au mvutano wa kitheolojia.
