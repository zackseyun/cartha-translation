translation:
  language: sw
  text: na kwa kila udanganyifu wa uovu[a] kwa wale wanaopotea[b], kwa sababu hawakupokea[c] upendo kwa ajili ya kweli ili waokolewe.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kila udanganyifu wa udhalimu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “miongoni mwa wale wanaopotea.”
    reason: lexical_alternative
  - marker: c
    text: Au, “hawakukubali” au “hawakukaribisha upendo kwa ajili ya kweli.”
    reason: lexical_alternative
  - marker: d
    text: Au, “kwa wokovu wao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπάτῃ
  choice: udanganyifu
  rationale: Neno hili huonyesha tendo au njia ya kupotosha. “Udanganyifu” ni Kiswahili cha kawaida kinachofaa katika muktadha huu kuliko “udanganyo wa akili,” ambalo lingeweza kuelekeza zaidi kwenye hali ya ndani ya mtu.
- source_word: ἀδικίας
  choice: wa uovu
  rationale: Hapa hali ya umilikaji inaeleza tabia ya udanganyifu huo. “Uovu” huhifadhi uzito wa kimaadili wa ἀδικία bila kuubana kwenye dhana ya kutotenda haki kwa watu pekee.
- source_word: τοῖς ἀπολλυμένοις
  choice: kwa wale wanaopotea
  rationale: “Kwa wale” huhifadhi uwezekano wa dativu kueleza walengwa au wale wanaopatwa na udanganyifu. Kitenzi endelevu “wanaopotea” huonyesha hali inayoendelea bila kuwataja kwa namna iliyoamuliwa tayari kuwa “waliohukumiwa.”
- source_word: ἀνθ’ ὧν
  choice: kwa sababu
  rationale: Katika muktadha huu kirai kina nguvu ya kisababishi. “Kwa sababu” ni cha kawaida na huonyesha uhusiano huo wazi.
- source_word: τὴν ἀγάπην τῆς ἀληθείας
  choice: kuipenda kweli
  rationale: Kiswahili hiki cha kawaida huwasilisha maana inayowezekana zaidi ya kupenda au kuikumbatia kweli, na huepuka “upendo wa kweli,” ambalo kwa kawaida lingeeleweka kuwa upendo wa dhati badala ya upendo kwa kweli.
- source_word: ἐδέξαντο
  choice: hawakukubali
  rationale: δέχομαι inaweza kumaanisha kupokea, kukubali, au kukaribisha. “Hawakukubali” huonyesha wazi kukataa kwao kwa hiari na hufuatana vizuri na “kuipenda kweli.”
- source_word: εἰς τὸ σωθῆναι αὐτούς
  choice: ili waokolewe
  rationale: Muundo wa εἰς pamoja na kitenzi-jina huweza kueleza kusudi au matokeo. “Ili waokolewe” ni kifupi, cha kawaida, na huhifadhi mwelekeo huo bila kubainisha zaidi ya maandishi.
theological_decisions:
- issue: Iwapo “wale wanaopotea” waelezwe kama kundi lililokwisha kuamuliwa kuangamia au kama watu walio katika hali inayoendelea.
  choice: wale wanaopotea
  alternative: wale waliohukumiwa kuangamia
  rationale: Kivumishi-tendo cha wakati wa sasa ἀπολλυμένοις huonyesha hali inayoendelea. Tafsiri hii huepuka kuingiza mfumo maalumu wa kisoteriolojia.
- issue: Iwapo τὴν ἀγάπην τῆς ἀληθείας ni upendo kwa kweli au upendo unaotoka kwa kweli.
  choice: kuipenda kweli
  alternative: upendo wa ile kweli
  rationale: Muktadha unaunga mkono kwa nguvu maana ya kuipenda na kuikumbatia kweli. Hata hivyo, tanbihi inaonyesha umbo la karibu zaidi na muundo wa Kigiriki badala ya kudai kuwa muundo huo hauna utata wowote.
- issue: Iwapo εἰς τὸ σωθῆναι αὐτούς huonyesha kusudi au matokeo.
  choice: ili waokolewe
  alternative: hata waokolewe
  rationale: “Ili” huhifadhi usomaji wa kusudi unaofaa zaidi, bila kufafanua utaratibu wa wokovu au kuondoa kabisa uwezekano wa kivuli cha matokeo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imehifadhiwa kama mwendelezo wa aya iliyotangulia kwa kuanza na “na.” “Kuipenda kweli” ni ya asili zaidi kuliko “upendo wa kweli,” ambalo lingeweza kueleweka vibaya kuwa ‘genuine love.’
