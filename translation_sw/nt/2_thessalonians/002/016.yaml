  text: Αὐτὸς δὲ ὁ κύριος ἡμῶν Ἰησοῦς Χριστὸς καὶ ⸀θεὸς ⸀ὁ πατὴρ ἡμῶν, ὁ ἀγαπήσας ἡμᾶς καὶ δοὺς παράκλησιν αἰωνίαν καὶ ἐλπίδα ἀγαθὴν ἐν χάριτι,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/016.yaml
  text: May our Lord Jesus the Messiah himself[a], and God our Father, who loved us and gave us eternal encouragement and good hope by grace,
translation:
  language: sw
  text: Basi, Bwana wetu Yesu Masihi mwenyewe, na Mungu Baba yetu, ambaye alitupenda na kutupa faraja ya milele[a] na tumaini jema kwa neema,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “utiaji moyo.” Neno la Kigiriki παράκλησις linaweza kumaanisha faraja, utiaji moyo, au faraja ya kutuliza.
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτὸς
  choice: mwenyewe
  rationale: Huhifadhi msisitizo wa kiwakilishi hiki juu ya utendaji wa Bwana Yesu Masihi katika ombi hili.
- source_word: δὲ
  choice: Basi
  rationale: Hutambulisha kwa upole mpito unaoingia katika ombi la baraka, bila kuonyesha upinzani mkali.
- source_word: κύριος
  choice: Bwana
  rationale: Ni tafsiri ya kawaida na yenye hadhi ya cheo hiki cha Yesu.
- source_word: Ἰησοῦς Χριστὸς
  choice: Yesu Masihi
  rationale: Χριστός hapa lina nguvu ya cheo; “Masihi” huwasilisha maana yake kwa uwazi katika Kiswahili.
- source_word: θεὸς ὁ πατὴρ ἡμῶν
  choice: Mungu Baba yetu
  rationale: Huhifadhi kwa lugha ya kawaida utambulisho wa Mungu kuwa Baba yetu.
- source_word: ὁ ἀγαπήσας
  choice: ambaye alitupenda
  rationale: Kishiriki cha wakati uliopita kimetafsiriwa kwa kishazi tegemezi cha kawaida, bila kuongeza ufafanuzi wa mhusika wake.
- source_word: δοὺς
  choice: na kutupa
  rationale: Huunganisha tendo la kutoa na tendo la kupenda kwa mtiririko wa asili wa Kiswahili.
- source_word: παράκλησιν
  choice: faraja
  rationale: Neno hili linaweza kumaanisha faraja, kutiwa moyo, au kufarijiwa; “faraja” ni fupi, ya kawaida, na inafaa muktadha.
- source_word: αἰωνίαν
  choice: ya milele
  rationale: Huwasilisha kudumu kwa faraja bila kupanua maana.
- source_word: ἐλπίδα ἀγαθὴν
  choice: tumaini jema
  rationale: Huhifadhi kivumishi chanya cha Kigiriki kwa usemi wa asili wa Kiswahili.
- source_word: ἐν χάριτι
  choice: kwa neema
  rationale: Huwasilisha neema kama msingi au njia ambayo faraja na tumaini vilitolewa.
theological_decisions:
- issue: Uhusiano wa vishiriki vya umoja “aliyependa … na kutoa …” na wahusika waliounganishwa, yaani Bwana Yesu Masihi na Mungu Baba yetu
  choice: Muundo wa umoja umehifadhiwa kwa kishazi kimoja, “ambaye alitupenda na kutupa,” bila kufafanua zaidi mhusika wake.
  alternative: Kukifanya kishazi hicho kimrejelee Mungu Baba pekee, au kukipanua ili kiseme wazi kwamba wote wawili walipenda na kutoa.
  rationale: Kigiriki kina wahusika wawili waliounganishwa kisha vishiriki vya umoja. Tafsiri haipaswi kuondoa utata huo wala kulazimisha hitimisho la kiteolojia lisilosemwa wazi na sintaksia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imeachwa ikiendelea kwa koma kwa sababu ombi linakamilishwa katika mstari unaofuata.
