  text: For you yourselves know how you ought to imitate us[a], because we did not behave disorderly among you.
translation:
  language: sw
  text: Kwa maana ninyi wenyewe mnajua jinsi mnavyopaswa kutuiga, kwa sababu hatukuishi kwa namna isiyo na utaratibu[a] miongoni mwenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa maana maalumu zaidi katika muktadha huu, “hatukuwa wavivu miongoni mwenu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοὶ
  choice: ninyi wenyewe
  rationale: Kiima cha kusisitiza kinaonyesha kwamba Wathesalonike wenyewe tayari wanajua; “ninyi wenyewe” huhifadhi msisitizo huo.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Kiunganishi hiki kinatoa sababu au maelezo ya himizo lililotangulia.
- source_word: οἴδατε
  choice: mnajua
  rationale: Ingawa umbo la Kigiriki ni kamilifu, hapa lina maana ya wakati uliopo.
- source_word: πῶς δεῖ μιμεῖσθαι ἡμᾶς
  choice: jinsi inavyowapasa kutuiga
  rationale: Huhifadhi wazo la namna ya kuiga pamoja na wajibu unaoonyeshwa na δεῖ, kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: ὅτι
  choice: kwa sababu
  rationale: Hapa linaanzisha msingi unaoeleza kwa nini wanajua jinsi ya kuwaiga Paulo na wenzake.
- source_word: οὐκ ἠτακτήσαμεν
  choice: hatukuishi bila utaratibu
  rationale: ἀτακτέω inaeleza mwenendo usio na utaratibu au nidhamu. Tafsiri hii haibani maana iwe uvivu pekee, ingawa muktadha unahusisha kutofanya kazi.
- source_word: ἐν ὑμῖν
  choice: miongoni mwenu
  rationale: Hueleza mwenendo wao walipokuwa katikati ya waumini wa Thesalonike.
theological_decisions:
- issue: Maana ya ἀτακτέω katika muktadha huu
  choice: Maelezo mapana ya kuishi bila utaratibu au nidhamu
  alternative: Hatutakuwa wavivu miongoni mwenu / hatukukaa bila kufanya kazi miongoni mwenu
  rationale: Sura hii inahusisha uvivu na kukataa kufanya kazi, lakini maana ya kimsingi ya kitenzi ni pana zaidi. Matini kuu huhifadhi upana huo, huku tanbihi ikitoa maana maalumu inayowezekana katika muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Jinsi inavyowapasa” ni ya asili kuliko muundo wa neno kwa neno wa “ni lazima,” na “kuishi bila utaratibu” huhifadhi upana wa maana bila kutumia usemi mgumu au wa kidhehebu.
