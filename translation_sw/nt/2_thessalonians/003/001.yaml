  text: Τὸ λοιπὸν προσεύχεσθε, ἀδελφοί, περὶ ἡμῶν, ἵνα ὁ λόγος τοῦ κυρίου τρέχῃ καὶ δοξάζηται καθὼς καὶ πρὸς ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/001.yaml
  text: Finally[a], brothers, pray for us, that the word of the Lord may spread rapidly and be honored, just as it was among you[b],
translation:
  language: sw
  text: Hatimaye, ndugu[a], mtuombee, ili neno la Bwana lienee kwa haraka na liheshimiwe, kama ilivyokuwa pia kwenu,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki kinasema “ndugu” kwa umbo la kiume la wingi; huenda neno hilo linawahutubia waumini wote katika kusanyiko kwa uwakilishi.
    reason: lexical_alternative
  - marker: b
    text: Kwa tafsiri ya karibu zaidi, “likimbie na litukuzwe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὸ λοιπὸν
  choice: Hatimaye
  rationale: Ni kiashiria cha mpito kinachoanzisha sehemu ya mwisho ya barua; “Hatimaye” ni ya kawaida na ya asili katika Kiswahili.
- source_word: προσεύχεσθε ... περὶ ἡμῶν
  choice: mtuombee
  rationale: Muundo huu wa Kiswahili unatoa ombi la wingi la kuwaombea waandishi kwa lugha fupi na ya kawaida.
- source_word: ἀδελφοί
  choice: ndugu
  rationale: “Ndugu” ni tafsiri ya kawaida ya mwito huu na inaweza kulitaja kusanyiko lote bila kuongeza maneno yasiyokuwamo wazi katika Kigiriki.
- source_word: ὁ λόγος τοῦ κυρίου
  choice: neno la Bwana
  rationale: Inahifadhi nahau ya kibiblia na uhusiano wa kimilikishi wa kifungu cha Kigiriki; hapa “neno” ni ujumbe unaotangazwa.
- source_word: τρέχῃ
  choice: lienee kwa haraka
  rationale: Kitenzi kina maana halisi ya “kukimbia,” lakini hapa ni sitiari ya maendeleo ya haraka ya ujumbe; tafsiri hii inawasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: δοξάζηται
  choice: liheshimiwe
  rationale: Katika muktadha wa neno kupokewa, kitenzi hiki cha kutendwa kinaweza kueleza kupewa heshima inayostahili. “Liheshimiwe” ni ya asili kwa neno au ujumbe, huku tafsiri ya karibu zaidi ikiwekwa katika tanbihi.
- source_word: καθὼς καὶ πρὸς ὑμᾶς
  choice: kama ilivyokuwa kwenu pia
  rationale: Inahifadhi ulinganisho, wazo la “pia,” na rejeo kwa yale yaliyokuwa tayari yametokea miongoni mwa Wathesalonike kwa Kiswahili kinachoeleweka.
theological_decisions:
- issue: Upeo wa ἀδελφοί katika mwito kwa kusanyiko
  choice: ndugu
  alternative: ndugu wa kiume na wa kike
  rationale: Neno “ndugu” linaweza kutumika kwa kusanyiko kwa ujumla katika Kiswahili. Tanbihi inaweka wazi kwamba mwito wa Kigiriki unaweza kuwawakilisha waumini wote bila kupanua matini kuu.
- issue: Sitiari ya τρέχῃ kuhusu maendeleo ya ujumbe
  choice: lienee kwa haraka
  alternative: likimbie
  rationale: Tafsiri ya ulinganifu mwafaka inawasilisha kwa uwazi wazo la kusonga kwa haraka kwa neno la Bwana, huku picha halisi ya Kigiriki ikihifadhiwa katika tanbihi.
- issue: Maana ya δοξάζηται inapohusishwa na neno la Bwana
  choice: liheshimiwe
  alternative: litukuzwe
  rationale: “Liheshimiwe” linaeleza neno kupokewa na kupewa heshima. “Litukuzwe” ni tafsiri ya karibu zaidi ya umbo la Kigiriki na imeonyeshwa katika tanbihi ili kutoficha mvutano wa kileksika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Sitiari mbili za Kigiriki zimewasilishwa kwa maana yake katika matini kuu na kuhifadhiwa kwa ukaribu zaidi katika tanbihi.
