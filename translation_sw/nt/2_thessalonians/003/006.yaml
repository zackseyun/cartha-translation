  text: Παραγγέλλομεν δὲ ὑμῖν, ἀδελφοί, ἐν ὀνόματι τοῦ κυρίου ⸀ἡμῶν Ἰησοῦ Χριστοῦ στέλλεσθαι ὑμᾶς ἀπὸ παντὸς ἀδελφοῦ ἀτάκτως περιπατοῦντος καὶ μὴ κατὰ τὴν παράδοσιν ἣν ⸀παρελάβοσαν παρ’ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/006.yaml
  text: We command you[a], brothers, in the name of our Lord Jesus the Messiah[e][d][c][b], to keep away from every brother who is walking disorderly and not according to the tradition that they received from us.
translation:
  language: sw
  text: Tunawaagiza ninyi, ndugu[a], kwa jina la Bwana wetu Yesu Masihi[b], mjitenge na[c] kila ndugu anayeishi bila utaratibu[d] na asiyefuata mapokeo waliyoyapokea kutoka kwetu.[e]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki limetumia umbo la wingi la kiume; Paulo analielekeza kanisa lote.
    reason: lexical_alternative
  - marker: b
    text: “Masihi” pia huweza kutafsiriwa “Kristo.”
    reason: alternative_reading
  - marker: c
    text: Au “mkae mbali na”; maana yake ni kujiepusha na ushirika wa karibu.
    reason: lexical_alternative
  - marker: d
    text: Au “anayeenenda bila utaratibu.” Katika muktadha huu, kutofanya kazi ni sehemu ya mwenendo huo, lakini neno la Kigiriki lina maana pana kuliko uvivu pekee.
    reason: lexical_alternative
  - marker: e
    text: Baadhi ya hati zina maneno yenye maana “ambayo mlipokea kutoka kwetu” au “ambayo alipokea kutoka kwetu,” yakifanya sarufi ilingane kwa urahisi zaidi na “kila ndugu.” Matini iliyochapishwa ina “ambayo waliyapokea kutoka kwetu.”
    reason: textual_variant
lexical_decisions:
- source_word: Παραγγέλλομεν δὲ ὑμῖν
  choice: Basi, tunawaagiza ninyi
  rationale: Παραγγέλλομεν ni agizo lenye mamlaka, hivyo “tunawaagiza” linafaa kuliko neno dhaifu kama “tunawasihi.” δέ ni kiunganishi cha mpito na limetafsiriwa kwa “Basi,” bila kuingiza maana ya wakati.
- source_word: ἀδελφοί / παντὸς ἀδελφοῦ
  choice: ndugu / kila ndugu
  rationale: “Ndugu” huhifadhi lugha ya kifamilia ya jumuiya ya waamini na katika Kiswahili inaweza kuwahusu wanaume na wanawake bila kubadili umbo la chanzo kimakusudi.
- source_word: ἐν ὀνόματι τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: kwa jina la Bwana wetu Yesu Masihi
  rationale: “Kwa jina la” huhifadhi nahau na uzito wa mamlaka ya msemaji. Χριστός hapa ni cheo cha Yesu, kwa hiyo “Masihi” linaonyesha maana ya Mtiwa-Mafuta; “Kristo” limewekwa kama namna nyingine iliyozoeleka.
- source_word: στέλλεσθαι ὑμᾶς ἀπό
  choice: mkae mbali na
  rationale: Kauli hii ina maana ya kujiondoa au kuepuka ushirika wa karibu. “Mkae mbali na” ni ya kawaida na yenye nguvu ya kinidhamu, lakini haiongezi wazo la kufukuzwa rasmi ambalo mstari wenyewe halisemi wazi.
- source_word: ἀτάκτως περιπατοῦντος
  choice: anayeishi bila utaratibu
  rationale: περιπατέω hutumia mfano wa kutembea kumaanisha mwenendo wa maisha. Tafsiri hii hutoa maana hiyo kwa Kiswahili cha sasa. “Bila utaratibu” huhifadhi upana wa ἀτάκτως kuliko “kwa uvivu,” ingawa uvivu ni sehemu muhimu ya muktadha unaofuata.
- source_word: μὴ κατὰ τὴν παράδοσιν
  choice: bila kufuata mapokeo
  rationale: παράδοσις ni jambo lililokabidhiwa na kupokelewa. “Mapokeo” ni tafsiri ya moja kwa moja; muktadha unaonyesha kuwa ni mapokeo ya kitume, si lazima desturi za baadaye.
- source_word: ἣν παρελάβοσαν παρ’ ἡμῶν
  choice: ambayo wao waliyapokea kutoka kwetu
  rationale: παρελάβοσαν katika matini iliyochapishwa ni nafsi ya tatu wingi. Kiwakilishi “wao” kinaweka wazi wingi huo hata baada ya “kila ndugu” ya umoja, na tanbihi inaeleza tofauti za hati.
theological_decisions:
- issue: Jinsi ya kutafsiri cheo Χριστός
  choice: Masihi
  alternative: Kristo
  rationale: Katika kishazi hiki Χριστός linafanya kazi kama cheo. “Masihi” huonyesha maana hiyo wazi, huku tanbihi ikitambua “Kristo” kama tafsiri iliyozoeleka.
- issue: Upeo wa kujitenga unaoamriwa na στέλλεσθαι ὑμᾶς ἀπό
  choice: mkae mbali na
  alternative: mjitenge na
  rationale: Tafsiri iliyochaguliwa huhifadhi agizo la kupunguza ushirika wa karibu bila kulifanya moja kwa moja kuwa hukumu rasmi ya kumfukuza mtu katika kanisa.
- issue: Maana ya ἀτάκτως katika muktadha
  choice: bila utaratibu
  alternative: kwa uvivu
  rationale: Mistari inayofuata inahusisha tabia hii na kutofanya kazi, lakini neno lenyewe linaweza kumaanisha mwenendo usio na utaratibu au nidhamu kwa upana zaidi. Tafsiri kuu haifungi maana mapema kuwa uvivu pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Lugha ya agizo imehifadhiwa bila kuwa ya kisheria kupita kiasi. “Mapokeo” na “Masihi” ni maneno ya kiteolojia yanayoeleweka, nayo yamefafanuliwa kwa tanbihi pale ambapo kuna tafsiri nyingine ya kawaida.
