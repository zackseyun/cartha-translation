base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/008.yaml
  text: nor did we eat bread from anyone free of charge[a], but with labor and hardship, working night and day so as not to burden any of you.
translation:
  language: sw
  text: wala hatukula mkate wa mtu yeyote bila kulipia[a], bali tulifanya kazi kwa kazi ngumu na taabu usiku na mchana, ili tusimlemee yeyote kati yenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wala hatukula mkate wa mtu yeyote bure.” Kigiriki kinadumisha neno “mkate” kihalisi, ingawa linaweza kurejelea chakula au msaada wa mahitaji kwa upana zaidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: δωρεὰν
  choice: bila kulipia
  rationale: Kielezi hiki kinaonyesha kupokea kitu bure au bila gharama; ‘bila kulipia’ ni Kiswahili cha kawaida na kinahifadhi maana ya kiuchumi katika muktadha.
- source_word: ἄρτον
  choice: mkate
  rationale: Neno hili humaanisha ‘mkate’ moja kwa moja, ingawa hapa linaweza kuwakilisha chakula au msaada wa kimwili kwa upana zaidi. Kulihifadhi kunadumisha usemi halisi wa Kigiriki.
- source_word: παρά τινος
  choice: wa mtu yeyote
  rationale: παρά pamoja na hali ya umilikishi huonyesha chanzo; muundo wa Kiswahili ‘mkate wa mtu yeyote’ unasikika kwa kawaida na unalingana na nahau ya Kigiriki ya kula mkate wa mtu.
- source_word: ἐν κόπῳ καὶ μόχθῳ
  choice: kwa taabu na jasho
  rationale: Maneno haya yanasisitiza kwa pamoja kazi ngumu na mashaka yanayoambatana nayo. ‘Taabu na jasho’ ni usemi wa sasa, wenye hadhi na unaoeleweka kwa urahisi.
- source_word: νυκτὸς καὶ ἡμέρας
  choice: usiku na mchana
  rationale: Hii ni nahau ya wakati inayoonyesha juhudi katika mzunguko wote wa usiku na mchana; tafsiri hii ni ya kawaida na ya moja kwa moja.
- source_word: ἐργαζόμενοι
  choice: tulifanya kazi
  rationale: Kishiriki hiki kinaeleza walichofanya Paulo na wenzake ili kujitegemeza. Kitenzi kikamilifu huleta sentensi ya Kiswahili iliyo wazi bila kubadili uhusiano wa kimantiki.
- source_word: πρὸς τὸ μὴ ἐπιβαρῆσαί
  choice: ili tusimlemee
  rationale: Muundo huu unaonyesha kusudi, na ἐπιβαρέω hapa ni kumtwika mtu mzigo wa kifedha au wa mahitaji ya kimwili.
- source_word: τινα ὑμῶν
  choice: yeyote kati yenu
  rationale: 'Muundo huu unahifadhi maana ya kila mmoja kwa kutenganisha: hakuna hata mmoja wao ambaye angelemewa.'
- source_word: οὐδὲ ... ἀλλ’
  choice: wala ... bali
  rationale: Jozi hii ya viunganishi inadumisha utofautishaji mkali kati ya kutokula bure na kufanya kazi kwa bidii.
