  text: καὶ μὴ ὡς ἐχθρὸν ἡγεῖσθε, ἀλλὰ νουθετεῖτε ὡς ἀδελφόν.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/015.yaml
  text: And do not regard him as an enemy[b][a], but admonish him as a brother.
translation:
  language: sw
  text: Wala msimhesabu kuwa adui, bali mwonyeni kama ndugu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hapa “ndugu” humaanisha mwamini mwenzao, yaani mshiriki wa jumuiya ya waamini.
    reason: cultural_note
lexical_decisions:
- source_word: καὶ μὴ ... ἀλλὰ
  choice: Wala msi... bali...
  rationale: Muundo huu unaendeleza wazo la mstari uliotangulia na kuweka tofauti iliyo wazi kati ya kumwona mtu kuwa adui na kumwonya kama ndugu.
- source_word: ἡγεῖσθε
  choice: msimhesabu kuwa
  rationale: Kitenzi hiki hapa kina maana ya kumchukulia au kumwona mtu kuwa wa kundi fulani. ‘Msimhesabu kuwa’ ni Kiswahili cha kawaida kinachohifadhi maana hiyo ya tathmini.
- source_word: ἐχθρόν
  choice: adui
  rationale: ‘Adui’ ni neno la moja kwa moja na la kawaida kwa mtu anayechukuliwa kuwa mpinzani au mwenye uhasama.
- source_word: νουθετεῖτε
  choice: mwonyeni
  rationale: Katika muktadha huu, kitenzi kinaonyesha onyo lenye kusudi la kumrekebisha mtu. ‘Mwonyeni’ ni cha asili na kina nguvu ya kichungaji na kirekebishaji kuliko ‘mfundisheni.’
- source_word: ὡς
  choice: kama
  rationale: Katika vifungu vyote viwili, ὡς huonyesha namna au hadhi ambayo mtu anapaswa kuchukuliwa; ‘kama’ ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: ἀδελφόν
  choice: ndugu
  rationale: ‘Ndugu’ huhifadhi istilahi ya uhusiano wa kifamilia na, katika muktadha huu, humaanisha mshiriki mwenzake wa jumuiya ya waamini bila kulazimisha jinsia katika Kiswahili.
theological_decisions:
- issue: Mtazamo wa kinidhamu kwa mwamini asiyetii
  choice: Mtu huyo asichukuliwe kuwa adui, bali aonywe huku akiendelea kutambuliwa kama ndugu katika jumuiya ya waamini.
  alternative: Kauli hii inaweza kueleweka kwa upana kuwa ushauri kuhusu migogoro ya kawaida baina ya watu.
  rationale: Muktadha wa 2 Wathesalonike 3:14–15 unahusu nidhamu ndani ya jumuiya. Neno ‘ndugu’ linadumisha uhusiano wa kijumuiya huku onyo na hatua ya kinidhamu vikibaki na uzito wake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. ‘Wala ... bali ...’ huhifadhi mwendelezo na utofautishaji wa maandishi ya Kigiriki; ‘mwonyeni’ huepuka neno zito lisilo la kawaida huku ikihifadhi kusudi la kurekebisha.
