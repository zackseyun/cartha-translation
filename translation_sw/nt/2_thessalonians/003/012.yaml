base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/012.yaml
  text: To such people we command and urge in the Lord Jesus the Messiah that[a], working quietly[c][b], they should eat their own bread.
translation:
  language: sw
  text: Watu kama hao tunawaamuru na pia kuwasihi katika Bwana Yesu Masihi kwamba, wakifanya kazi kwa utulivu, wale mkate wao wenyewe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Mkate wao wenyewe” hapa ni chakula au riziki wanayoipata kwa kufanya kazi wenyewe.
    reason: idiom_clarification
lexical_decisions:
- source_word: τοῖς δὲ τοιούτοις
  choice: Nao watu kama hao
  rationale: “Watu kama hao” hurejelea wale waliotajwa katika muktadha kuwa wanaishi bila utaratibu na hawafanyi kazi. “Nao” huonyesha mpito mwepesi wa δέ bila kuifanya kuwa pingamizi kali.
- source_word: παραγγέλλομεν καὶ παρακαλοῦμεν
  choice: tunawaamuru na kuwasihi
  rationale: 'Vitenzi vyote viwili vimehifadhiwa: cha kwanza kinaonyesha mamlaka ya agizo, na cha pili ombi la dhati la kichungaji.'
- source_word: ἐν κυρίῳ Ἰησοῦ Χριστῷ
  choice: katika Bwana Yesu Masihi
  rationale: “Katika” huhifadhi upana wa ἐν, unaoweza kuonyesha mazingira ya uhusiano pamoja na mamlaka. “Masihi” hutafsiri Χριστός kama cheo chenye maana hai katika kifungu hiki.
- source_word: μετὰ ἡσυχίας ἐργαζόμενοι
  choice: wafanye kazi kwa utulivu
  rationale: Hii ni Kiswahili cha kawaida kinachoonyesha kufanya kazi kwa mwenendo mtulivu na usiovuruga wengine, kinyume na uvivu wenye kuingilia mambo ya watu.
- source_word: τὸν ἑαυτῶν ἄρτον ἐσθίωσιν
  choice: kula mkate wao wenyewe
  rationale: “Mkate” huhifadhi taswira halisi ya ἄρτος, huku katika muktadha ikimaanisha pia chakula au riziki ambayo mtu huipata kwa kazi yake mwenyewe.
theological_decisions:
- issue: Jinsi ya kutafsiri Χριστός
  choice: Masihi
  alternative: Kristo
  rationale: Hapa Χριστός inafanya kazi kama cheo cha Yesu, kwa hiyo “Masihi” huweka wazi maana ya cheo hicho badala ya kukifanya kionekane kama sehemu ya jina tu.
- issue: Nguvu ya maagizo ya kitume
  choice: Kuhifadhi “tunawaamuru” na “kuwasihi”
  alternative: Kuyajumlisha katika kitenzi kimoja kama “tunawaagiza”
  rationale: Maneno mawili ya Kigiriki yanaunganisha mamlaka na ombi la dhati; kuyahifadhi huepuka kudhoofisha upande wowote.
- issue: Maana ya ἐν κυρίῳ
  choice: katika Bwana
  alternative: kwa mamlaka ya Bwana
  rationale: “Katika Bwana” huhifadhi uwezekano mpana wa maana—uhusiano, mazingira, na mamlaka—bila kuibana ἐν kuwa chombo au mamlaka pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni nyepesi kusomeka lakini inadumisha mamlaka ya agizo, ombi la dhati, na taswira ya “mkate” iliyomo katika Kigiriki.
