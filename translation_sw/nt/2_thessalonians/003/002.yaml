review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the purpose clause, the two descriptors for the hostile people, and the elliptical statement that faith is not possessed by all. However, “tuokolewe na watu” can naturally be read as being saved by those people, whereas ἀπό marks deliverance away from them.
  naturalness: The register is clear Standard East African Swahili. Adding “kutoka kwa” removes a consequential ambiguity and is idiomatic. “Watu wapotovu na waovu” is a defensible contextual rendering, though the lexical alternative should more accurately represent the range of ἄτοπος.
  terminology: “Imani” appropriately renders πίστις, with “waaminifu” retained as an alternative. “Waovu” is suitable for πονηρῶν. The footnote for ἄτοπος should avoid presenting “wasio na akili” as though the word denotes intellectual incapacity; its range is better represented by “wasiofaa,” “wasio wa kawaida,” or “wasio na mantiki.”
  issues:
  - severity: medium
    issue: Ambiguous use of na after tuokolewe
    rationale: In Kiswahili, “tuokolewe na watu” may mean “that we may be saved by people.” The Greek ἀπὸ τῶν ... ἀνθρώπων means deliverance from these people, so “kutoka kwa watu” is needed.
  - severity: low
    issue: Lexical-alternative footnote for ἄτοπος is imprecise
    rationale: “Wasio na akili” can imply lack of intelligence, which is not the primary force of ἄτοπος. A note referring to what is improper, out of place, or unreasonable better preserves its lexical ambiguity.
