base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/002.yaml
  text: and that we may be delivered from wicked and evil men[b][a], for not all have faith.
translation:
  language: sw
  text: na ili tuokolewe kutoka kwa watu wapotovu na waovu,[a] kwa maana si wote walio na imani.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watu wasiofaa na waovu.” Neno la Kigiriki linaweza kumaanisha “wasiofaa,” “wasio wa kawaida,” au “wasio na mantiki”; katika muktadha huu linawarejelea wapinzani wenye mwenendo uliopotoka.
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa maana si wote walio waaminifu.” Kigiriki kinasema kihalisi, “kwa maana imani si ya wote.”
    reason: alternative_reading
lexical_decisions:
- source_word: ῥυσθῶμεν
  choice: tuokolewe
  rationale: 'Kitenzi cha kutendwa katika hali tegemezi baada ya ἵνα kinaonyesha kusudi: waombaji waombe ili Paulo na wenzake waokolewe kutoka mikononi mwa wapinzani.'
- source_word: ἀτόπων
  choice: wapotovu
  rationale: Neno hili linaweza kumaanisha wasiofaa, wapuuzi, au wasio na akili; hapa, likiambatana na πονηρῶν, linaeleza watu waliokengeuka katika mwenendo bila kurudia tu maana ya ‘waovu.’
- source_word: πονηρῶν
  choice: waovu
  rationale: Hili ni neno la kawaida la kimaadili linalomaanisha waovu au wabaya.
- source_word: ἀνθρώπων
  choice: watu
  rationale: Katika Kiswahili, ‘watu’ ndilo neno la kawaida na sahihi kwa wingi wa ἄνθρωπος; halilazimishi jinsia ambayo muktadha wa mstari huu hauibainishi wazi.
- source_word: πίστις
  choice: imani
  rationale: ‘Imani’ ndiyo maana inayofaa zaidi katika muktadha wa watu wanaoupinga ujumbe, huku uwezekano wa maana ya ‘uaminifu’ ukihifadhiwa katika tanbihi.
- source_word: οὐ γὰρ πάντων ἡ πίστις
  choice: kwa maana si wote walio na imani
  rationale: Kigiriki kinasema kwa ufupi, ‘kwa maana imani si ya wote.’ Kiswahili hiki kinaeleza nahau hiyo kwa kawaida bila kuifanya iwe dai pana zaidi kuliko maandishi.
theological_decisions:
- issue: Maana ya πίστις katika kishazi chenye uwezekano wa tafsiri zaidi ya moja
  choice: imani
  alternative: uaminifu
  rationale: Muktadha wa upinzani dhidi ya kazi ya mitume unaelekea kumaanisha kwamba si wote wanaoamini. Hata hivyo, kwa kuwa πίστις pia linaweza kumaanisha uaminifu, uwezekano huo umeonyeshwa katika tanbihi badala ya kuondolewa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ‘na ili’ unahifadhi mwendelezo wa ombi kutoka mstari uliotangulia. ‘Watu wapotovu na waovu’ ni wa kawaida kueleweka na pia unatofautisha vivuli vya maana vya vivumishi viwili vya Kigiriki.
