  text: ὁ δὲ κύριος κατευθύναι ὑμῶν τὰς καρδίας εἰς τὴν ἀγάπην τοῦ θεοῦ καὶ εἰς τὴν ὑπομονὴν τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/005.yaml
  text: May the Lord direct your hearts into the love of God and into the steadfastness of Messiah[a][b][c].
translation:
  language: sw
  text: Bwana aielekeze mioyo yenu katika upendo wa Mungu[a] na katika ustahimilivu wa Masihi[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika upendo kwa Mungu.” Maneno ya Kigiriki yanaweza pia kumaanisha “katika upendo ambao Mungu anao.”
    reason: alternative_reading
  - marker: b
    text: Au, “katika ustahimilivu wa Masihi mwenyewe,” au “katika ustahimilivu kwa Masihi.”
    reason: alternative_reading
  - marker: c
    text: 'Kigiriki: “Kristo”; hapa limetafsiriwa “Masihi” kwa sababu neno hilo linatumika kama cheo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: Bwana
  rationale: Ni tafsiri ya kawaida na yenye uzito wa cheo cha kimungu/kikristolojia, bila kulazimisha zaidi utambulisho wa anayerejelewa kuliko mstari unavyofanya.
- source_word: κατευθύναι
  choice: aielekeze
  rationale: Hali tegemezi ya Kiswahili inaonyesha ombi au sala (‘na aielekeze’ kwa maana ya ‘may ... direct’), huku kitenzi kikihifadhi wazo la kuongoza kuelekea mahali au lengo fulani.
- source_word: καρδίας
  choice: mioyo
  rationale: Inahifadhi sitiari ya kibiblia kuhusu kitovu cha fikira, mapenzi, na maamuzi ya ndani, badala ya kuifafanua kwa neno moja finyu kama ‘akili’.
- source_word: ἀγάπην
  choice: upendo
  rationale: Ni kisawe cha kawaida, wazi, na sahihi cha ἀγάπη katika Kiswahili cha sasa.
- source_word: τοῦ θεοῦ
  choice: wa Mungu
  rationale: Muundo huu wa kimilikishi unaweza kusomeka kama upendo wa Mungu mwenyewe au upendo unaomwelekea Mungu; hivyo hauamui kimya kimya utata wa genitivi ya Kigiriki.
- source_word: ὑπομονὴν
  choice: ustahimilivu
  rationale: Neno hili linaonyesha kudumu na kuvumilia chini ya shinikizo kwa uthabiti, jambo lililo kiini cha ὑπομονή, kwa uwazi zaidi kuliko ‘subira’ peke yake.
- source_word: τοῦ Χριστοῦ
  choice: wa Masihi
  rationale: ‘Masihi’ hutafsiri maana ya cheo Χριστός. Muundo ‘wa Masihi’ pia huhifadhi kwa kadiri inayowezekana utata kati ya ustahimilivu wake mwenyewe na ustahimilivu unaomwelekea au unaohusiana naye.
theological_decisions:
- issue: Utata wa genitivi katika τὴν ἀγάπην τοῦ θεοῦ
  choice: upendo wa Mungu
  alternative: upendo kwa Mungu; upendo ambao Mungu anao
  rationale: Kigiriki kinaweza kumaanisha upendo wa Mungu kwa watu, upendo wa watu kwa Mungu, au kushiriki katika upendo wenye sifa ya kimungu. Matini kuu inadumisha mvutano huo, na tanbihi inaonyesha uwezekano muhimu.
- issue: Utata wa genitivi katika τὴν ὑπομονὴν τοῦ Χριστοῦ
  choice: ustahimilivu wa Masihi
  alternative: ustahimilivu wa Masihi mwenyewe; ustahimilivu kwa ajili ya Masihi
  rationale: Genitivi inaweza kuwa ya mtendaji, ya mlengwa, au ya sifa. Tafsiri kuu haichagui tafsiri moja ya kiteolojia bila ushahidi wa kutosha.
- issue: Tafsiri ya Χριστοῦ
  choice: Masihi
  alternative: Kristo
  rationale: Hapa Χριστός inafanya kazi kama cheo; ‘Masihi’ huwasilisha maana ya cheo hicho badala ya kukitohhoa tu kama jina.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi fupi inadumisha muundo wa sala ya Kigiriki na sitiari ya ‘kuielekeza mioyo’ bila kuibadilisha kuwa maelezo ya kifafanuzi. Viashiria vyote vya tanbihi vimewekwa katika matini kuu.
