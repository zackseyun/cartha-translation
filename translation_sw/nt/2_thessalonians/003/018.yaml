translation:
  language: sw
  text: Neema ya Bwana wetu Yesu Kristo iwe pamoja nanyi nyote.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χάρις
  choice: neema
  rationale: Neno “neema” ni tafsiri ya kawaida na yenye upana unaofaa kwa χάρις katika baraka za Paulo; linaeleza wema na fadhili zinazotolewa bila kustahiliwa.
- source_word: κυρίου
  choice: Bwana
  rationale: “Bwana” linaonyesha mamlaka na heshima ya κύριος na ni jina la cheo linalotumika kwa Yesu katika muktadha huu.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesu Kristo
  rationale: “Yesu” ni umbo lililozoeleka la jina Ἰησοῦς, na “Kristo” ni umbo la kawaida la Kiswahili la Χριστός. Katika salamu hii ya kimfumo, “Yesu Kristo” ni ya asili, yenye heshima, na bado hutambulisha cheo chake kinachomaanisha Mtiwa-Mafuta.
- source_word: μετὰ πάντων ὑμῶν
  choice: iwe pamoja nanyi nyote
  rationale: μετά pamoja na hali milikishi humaanisha “pamoja na.” Kitenzi “iwe” kinaongezwa kwa sababu sentensi ya Kigiriki haina kitenzi kilichoandikwa lakini ina maana ya baraka au ombi. “Nanyi nyote” huhifadhi msisitizo kwamba jumuiya nzima inahusika.
theological_decisions:
- issue: Jinsi ya kutafsiri Χριστοῦ katika baraka ya mwisho
  choice: Kristo
  alternative: Masihi
  rationale: “Kristo” ndilo umbo lililozoeleka zaidi katika Kiswahili kwa jina hili la cheo na husikika kwa urahisi katika kauli “Bwana wetu Yesu Kristo.” “Masihi” pia hutoa maana ya cheo hicho, yaani Mtiwa-Mafuta, lakini ingeweza kufanya baraka hii ya kimfumo isikike isiyo ya kawaida bila kuongeza usahihi wa lazima hapa.
- issue: Kitenzi kisichoandikwa katika sentensi ya Kigiriki
  choice: iwe
  alternative: iko
  rationale: Sentensi ya Kigiriki ni kauli ya baraka isiyo na kitenzi kilichoandikwa. “Iwe” huhifadhi nguvu ya ombi/baraka, badala ya kuifanya kuwa taarifa tu ya hali iliyopo kwa kutumia “iko.”
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; sentensi ni fupi, ya heshima, na ya kawaida katika baraka ya mwisho ya barua. Hakuna tanbihi iliyoongezwa kwa sababu maelezo yaliyotolewa hayatoi usomaji mbadala wa Kigiriki unaoweza kuthibitishwa, na mbadala wa Kiingereza uliotajwa unarudia maneno yale yale.
