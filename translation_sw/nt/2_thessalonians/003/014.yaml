base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/014.yaml
  text: And if anyone does not obey our word through this letter[a], take note of that person; do not associate with him[d][c][b], so that he may be ashamed.
translation:
  language: sw
  text: Na ikiwa mtu yeyote hatii neno letu kwa njia ya barua hii[a], mtieni alama mtu huyo[b], wala msichangamane naye[c], ili aaibike[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika barua hii.” Usemi wa Kigiriki unaweza kuonyesha njia ambayo maagizo yanawafikia.
    reason: lexical_alternative
  - marker: b
    text: Au, “mtambueni” au “mwekeni kwenye kumbukumbu.”
    reason: lexical_alternative
  - marker: c
    text: Au, “msiwe na ushirika naye.”
    reason: lexical_alternative
  - marker: d
    text: Kusudi ni kumrekebisha; linganisha mstari wa 15, ambako bado anapaswa kuonywa “kama ndugu.”
    reason: cross_reference
lexical_decisions:
- source_word: ὑπακούει
  choice: hatatii
  rationale: Kitenzi ‘kutii’ kinaonyesha kuitikia kwa utii maagizo yenye mamlaka na kinafaa katika muktadha huu wa maonyo.
- source_word: τῷ λόγῳ ἡμῶν
  choice: neno letu
  rationale: ‘Neno letu’ linahifadhi usemi wa Kigiriki huku likirejelea ujumbe au maagizo ya mitume, si tamko moja tu.
- source_word: διὰ τῆς ἐπιστολῆς
  choice: lililo katika barua hii
  rationale: Usemi huu unaeleweka kwa kawaida kuwa neno linalowasilishwa katika au kwa njia ya barua iliyopo; tanbihi huhifadhi uwezekano wa maana ya chombo au njia.
- source_word: σημειοῦσθε
  choice: mtambueni
  rationale: Amri hii inataka jumuiya imtambue au imweke alama mtu asiyetii. ‘Mtambueni’ ni ya sasa na haiongezi ukali usiotajwa.
- source_word: τοῦτον
  choice: mtu huyo
  rationale: Kiwakilishi elekezi kinamrejelea wazi mtu aliyetajwa katika sharti.
- source_word: μὴ συναναμίγνυσθαι αὐτῷ
  choice: wala msishirikiane naye
  rationale: ‘Kushirikiana naye’ huwasilisha wazo la kutokuchangamana au kutokuwa na ushirika wa kawaida naye bila kulifanya kuwa istilahi rasmi ya kisheria ya kanisa.
- source_word: ἐντραπῇ
  choice: aone aibu
  rationale: Usemi huu wa kawaida unaonyesha kufikia hali ya kuona aibu; unaacha kusudi la marekebisho bila kuifanya fedheha kuwa lengo lenyewe.
- source_word: τις
  choice: mtu yeyote
  rationale: Huhifadhi upeo wa jumla wa kiwakilishi kisichobainisha mtu.
- source_word: αὐτῷ
  choice: naye
  rationale: Kiwakilishi hiki kinamrejelea mtu huyo kwa njia ya kawaida na isiyo na utata katika Kiswahili.
theological_decisions:
- issue: Asili ya hatua iliyoamriwa na μὴ συναναμίγνυσθαι αὐτῷ
  choice: Kujitenga kwa namna fulani na mtu huyo katika mahusiano ya jumuiya kwa kusudi la kumrekebisha.
  alternative: Kutengwa rasmi kabisa na kanisa, au kuepukwa kwa kawaida tu bila maana yoyote ya kijumuiya.
  rationale: Mstari wa 15 bado unamtaja kama ndugu anayepaswa kuonywa. Tafsiri inaacha kiwango halisi cha hatua kikiwa wazi na haiingizi mfumo wa baadaye wa sheria za kanisa.
- issue: Nguvu ya ἐντραπῇ
  choice: Aibu yenye kusudi la marekebisho.
  alternative: Kufedheheshwa hadharani kama lengo lenyewe.
  rationale: Kishazi cha kusudi pamoja na mstari unaofuata kinaelekeza kwenye hatua ya kurekebisha, ingawa maandiko hayasemi wazi matokeo ya mwisho kama toba.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Wala msishirikiane naye’ ni amri ya wazi isiyoingiza istilahi maalumu ya dhehebu. Alama zote za tanbihi zimewekwa katika matini kuu.
