  yaml_path: translation/nt/2_thessalonians/003/013.yaml
  text: But as for you[a], brothers, do not grow weary in doing good.
translation:
  language: sw
  text: Lakini ninyi, ndugu[a], msichoke kutenda mema.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki hutumia umbo la kiume la wingi, “ndugu wa kiume”; lakini neno hilo linaweza kutumiwa kulihutubia jumuiya yote ya waamini, wanaume na wanawake.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς δέ
  choice: Lakini ninyi
  rationale: δέ inaonyesha utofauti na wale waliotajwa kabla, na ὑμεῖς iliyotangulizwa ina mkazo. “Lakini ninyi” huhifadhi utofauti na mkazo huo kwa Kiswahili cha kawaida.
- source_word: ἀδελφοί
  choice: ndugu
  rationale: Neno la Kiswahili “ndugu” linafaa kama namna ya kulihutubia kundi la waamini na linaweza kuwahusu wanaume na wanawake; tanbihi inaeleza kwamba umbo la Kigiriki ni la kiume kwa wingi.
- source_word: μὴ ἐγκακήσητε
  choice: msichoke
  rationale: Muundo wenye μή ni katazo. ἐγκακέω hapa ni kuchoka au kukata tamaa katika kuendelea na tendo fulani; “msichoke” ni ya asili na inaendana na tendo linaloendelea.
- source_word: καλοποιοῦντες
  choice: kutenda mema
  rationale: Kitenzi-shirikishi cha wakati uliopo kinaonyesha shughuli inayoendelea ambamo hawapaswi kuchoka. “Kutenda mema” ni usemi wa sasa, wazi na wenye hadhi.
theological_decisions:
- issue: Maana ya ἀδελφοί katika hotuba kwa kusanyiko
  choice: ndugu, pamoja na tanbihi kuhusu umbo la Kigiriki
  alternative: ndugu wa kiume na wa kike
  rationale: ἀδελφοί ni umbo la kiume kwa wingi lakini katika hotuba za Paulo mara nyingi hulihusu kusanyiko lote. “Ndugu” kwa Kiswahili huhifadhi lugha ya kifamilia bila kulazimisha jinsia, huku tanbihi ikihifadhi taarifa ya umbo la chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; sentensi ni fupi, ya kawaida na yenye hadhi. “Msichoke kutenda mema” huhifadhi katazo na wazo la kudumu katika kufanya yaliyo mema.
