  yaml_path: translation/nt/2_thessalonians/003/009.yaml
  text: not because we do not have the right, but in order to give ourselves to you as an example for you to imitate us.
translation:
  language: sw
  text: Si kwa sababu hatuna haki[a], bali ili tuwape mfano katika sisi wenyewe, ili mtuige.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mamlaka” au “uwezo.” Katika muktadha huu, neno hilo linaelekea kumaanisha dai au stahili halali.
    reason: lexical_alternative
  - marker: b
    text: Au “kielelezo” au “muundo wa kufuatwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξουσίαν
  choice: haki
  rationale: Katika muktadha wa kufanya kazi ili kutowalemea wengine, neno hili linaonyesha dai halali la kupata msaada, si nguvu tu wala mamlaka kwa maana pana.
- source_word: ἑαυτοὺς
  choice: tujiweke
  rationale: Kitenzi cha kujirejelea kinahifadhi wazo la Paulo na wenzake kujifanya wao wenyewe kuwa mfano mbele ya waumini.
- source_word: τύπον
  choice: mfano
  rationale: Hapa neno linamaanisha kielelezo cha mwenendo kinachopaswa kuigwa; “mfano” ni neno la kawaida, wazi, na lenye hadhi katika Kiswahili.
- source_word: δῶμεν
  choice: tujiweke
  rationale: Ingawa maana ya msingi ni “kutoa,” muundo wa Kigiriki wa kujitoa wenyewe kuwa mfano unaelezwa kwa Kiswahili cha kawaida zaidi kwa “tujiweke kuwa mfano,” bila kupoteza picha ya kujifanya kielelezo.
- source_word: εἰς τὸ μιμεῖσθαι
  choice: mpate kutuiga
  rationale: Muundo huu unaonyesha kusudi; “mpate kutuiga” ni wa asili katika Kiswahili na hudumisha lengo la mfano huo.
- source_word: οὐχ ὅτι οὐκ
  choice: Si kwa sababu hatuna
  rationale: Muundo huu unakanusha sababu inayoweza kudhaniwa na kuandaa utofautishaji unaofuata.
- source_word: ἀλλ’ ἵνα
  choice: bali ili
  rationale: Kauli hii inaonyesha kusudi chanya linalotofautishwa na sababu iliyokanushwa.
theological_decisions:
- issue: Maana ya dai la Paulo katika ἐξουσίαν
  choice: Paulo na wenzake walikuwa na haki halali ya kupata msaada, lakini hawakuitumia katika hali hii.
  alternative: Neno linaweza kueleweka kwa upana kuwa mamlaka au uwezo wa kitume.
  rationale: Muktadha wa karibu unahusu wao kufanya kazi ili wasiwe mzigo kwa wengine. Tafsiri “haki” inadumisha dai halali bila kulipanua kuwa fundisho pana lisilotajwa wazi hapa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Bali ili” huweka wazi utofautishaji na kusudi; “mpate kutuiga” ni ya moja kwa moja na inaeleweka kwa wasomaji wa kawaida.
