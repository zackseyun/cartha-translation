translation:
  language: sw
  text: 'Kwa maana hata tulipokuwa pamoja nanyi, tuliendelea kuwaagiza hivi: Ikiwa mtu hataki kufanya kazi[b], wala asile.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “basi asile.”
    reason: lexical_alternative
  - marker: b
    text: Kigiriki kinasema “hataki kufanya kazi,” kikimaanisha kutotaka, si kutokuwa na uwezo.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Kwa maana hata
  rationale: Huhifadhi uhusiano wa kutoa sababu wa γάρ na msisitizo wa καί kwa Kiswahili cha kawaida.
- source_word: ὅτε ἦμεν πρὸς ὑμᾶς
  choice: tulipokuwa pamoja nanyi
  rationale: πρός ikitumiwa kuhusu watu hapa humaanisha kuwa katika ushirika au uwepo wao; usemi huu ni wa asili katika Kiswahili.
- source_word: τοῦτο
  choice: hivi
  rationale: Kielezi hiki kinaelekeza mbele kwenye yaliyomo katika agizo bila kuongeza nomino isiyokuwapo katika Kigiriki.
- source_word: παρηγγέλλομεν
  choice: tuliendelea kuwaagiza
  rationale: Huhifadhi hali ya tendo linaloendelea au kurudiwa inayoonyeshwa na wakati usiotimilifu, huku ‘kuwaagiza’ ikibeba nguvu ya amri.
- source_word: ὅτι
  choice: ':'
  rationale: Hapa ὅτι inatanguliza yaliyomo katika agizo; nukta mbili hufanya kazi hiyo kwa Kiswahili cha asili.
- source_word: εἴ τις
  choice: Ikiwa mtu
  rationale: Ni sharti lisilomtaja mtu maalumu na lina upeo wa jumla.
- source_word: οὐ θέλει ἐργάζεσθαι
  choice: hataki kufanya kazi
  rationale: θέλει inahusu utashi au nia, si kutokuwa na uwezo; tafsiri hii inalinda tofauti hiyo.
- source_word: μηδὲ ἐσθιέτω
  choice: basi asile
  rationale: Huhifadhi matokeo ya sharti na nguvu ya amri ya nafsi ya tatu; ‘basi’ huonyesha uhusiano huo kwa uwazi wa asili.
theological_decisions:
- issue: Kauli hii inamhusu asiyeweza kufanya kazi au asiyetaka kufanya kazi
  choice: ‘Ikiwa mtu hataki kufanya kazi’—inahusu kutotaka, si kutoweza.
  alternative: Ikiwa mtu hawezi kufanya kazi
  rationale: Kitenzi θέλει kinaeleza utashi. Kukitafsiri kama kutokuwa na uwezo kungepanua kauli dhidi ya wasio na uwezo na kuficha lengo lake kuhusu kutotaka kufanya kazi.
- issue: Namna ya kuwasilisha nafsi ya umoja yenye maana ya jumla
  choice: ‘mtu ... asile’
  alternative: watu ... wasile
  rationale: Kigiriki kina τις isiyobainisha jinsia na amri ya nafsi ya tatu umoja. Kiswahili ‘mtu ... asile’ huhifadhi umoja na maana ya kumwakilisha yeyote bila kulazimisha jinsia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Tuliendelea kuwaagiza’ huhifadhi hali ya tendo la wakati usiotimilifu; ‘hataki’ ni ya kawaida na inaweka wazi suala la utashi. Alama zote za tanbihi zimewekwa baada ya sentensi ili zisiuvuruge mtiririko.
