  text: Αὐτὸς δὲ ὁ κύριος τῆς εἰρήνης δῴη ὑμῖν τὴν εἰρήνην διὰ παντὸς ἐν παντὶ τρόπῳ. ὁ κύριος μετὰ πάντων ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/016.yaml
  text: May the Lord of peace himself give you peace at all times in every way[b][a]. The Lord be with all of you.
translation:
  language: sw
  text: Bwana wa amani mwenyewe awape amani sikuzote kwa kila njia.[a][b] Bwana awe pamoja nanyi nyote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakati wote” badala ya “sikuzote.”
    reason: lexical_alternative
  - marker: b
    text: Au “kwa kila namna” badala ya “kwa kila njia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτὸς
  choice: mwenyewe
  rationale: Matumizi ya msisitizo ya αὐτός yanamkazia Bwana binafsi; “mwenyewe” ni ya kawaida na huhifadhi mkazo huo.
- source_word: δὲ
  choice: haijatafsiriwa kwa neno la pekee
  rationale: Hapa δέ ni kiunganishi hafifu cha mpito. Katika Kiswahili, kuanza moja kwa moja na baraka ni kwa asili zaidi kuliko kuongeza “basi” au “lakini,” ambavyo vinaweza kuipa nguvu isiyokusudiwa.
- source_word: κύριος
  choice: Bwana
  rationale: Huhifadhi cheo cha κύριος bila kuongeza utambulisho ambao mstari wenyewe hautaji wazi.
- source_word: τῆς εἰρήνης
  choice: wa amani
  rationale: Huhifadhi muundo wa kimahusiano wa Kigiriki katika usemi wa kawaida wa Kiswahili, “Bwana wa amani,” bila kuufafanua kama “anayetoa amani.”
- source_word: δῴη
  choice: na awape
  rationale: Optativi ya dua au baraka imewakilishwa kwa muundo wa matamanio “na awape,” si kama taarifa ya jambo linalotokea.
- source_word: τὴν εἰρήνην
  choice: amani
  rationale: Kiswahili cha kawaida hakihitaji kiashiria cha uainishaji hapa; “awape amani” ni wazi na cha asili.
- source_word: διὰ παντὸς
  choice: sikuzote
  rationale: Huwasilisha udumifu wa wakati kwa lugha ya kawaida; “wakati wote” pia inawezekana.
- source_word: ἐν παντὶ τρόπῳ
  choice: kwa kila njia
  rationale: Huhifadhi upana wa τρόπος kama namna au hali bila kuibadili kuwa wazo maalumu zaidi la vyombo au mbinu.
- source_word: μετὰ πάντων ὑμῶν
  choice: pamoja nanyi nyote
  rationale: Huhifadhi maana ya uwepo pamoja na ujumuishi wa πάντων, kwa mtindo wa kawaida wa baraka katika Kiswahili.
theological_decisions:
- issue: Mrejelewa wa “Bwana” katika baraka
  choice: Kubaki na “Bwana” bila kuongeza “Yesu”
  alternative: “Bwana Yesu” au rejeo la jumla kwa Mungu
  rationale: Kigiriki kinasema ὁ κύριος pekee. Muktadha wa Paulo unaweza kuelekeza kwa Bwana Yesu, lakini tafsiri haipaswi kutaja kwa uwazi zaidi ya maandishi.
- issue: Nguvu ya kishazi cha mwisho
  choice: “Bwana awe pamoja nanyi nyote” kama ombi la baraka
  alternative: “Bwana yuko pamoja nanyi nyote” kama taarifa
  rationale: Ingawa Kigiriki hakina kitenzi kilichoandikwa wazi, muktadha ni wa baraka au ombi; “awe” huonyesha nguvu hiyo badala ya kuifanya taarifa ya habari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima lakini kinachoeleweka kwa urahisi. Muundo wa dua “na awape” na baraka “awe pamoja nanyi” ni wa asili katika usomaji wa maandiko. Alama za tanbihi zimepangwa kufuata vifungu vinavyohusika.
