  text: And we have confidence in the Lord about you, that you are doing and will do what we command.
translation:
  language: sw
  text: Lakini tuna uhakika katika Bwana kuhusu ninyi kwamba mnayafanya na mtayafanya yale tunayowaagiza.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πεποίθαμεν
  choice: tuna uhakika
  rationale: Huwasilisha hali ya sasa ya kuwa na imani thabiti bila kutumia tamko kali lisilo la lazima.
- source_word: ἐν κυρίῳ
  choice: katika Bwana
  rationale: Hudumisha kwa karibu msingi na mazingira ya uhakika huo katika Bwana.
- source_word: ἐφ’ ὑμᾶς
  choice: kuhusu ninyi
  rationale: Huhifadhi maana ya uhakika unaowahusu wasomaji, bila kuufanya uwe uhakika unaotegemea uwezo wao wenyewe.
- source_word: παραγγέλλομεν
  choice: tunayowaagiza
  rationale: Kitenzi hiki kina nguvu ya kutoa maagizo yenye mamlaka; 'kuagiza' ni cha kawaida na chenye hadhi katika Kiswahili.
- source_word: ποιεῖτε καὶ ποιήσετε
  choice: mnayafanya na mtaendelea kuyafanya
  rationale: Hutofautisha tendo la sasa na la wakati ujao; 'mtaendelea' ni ya asili hapa na inaonyesha utekelezaji unaotarajiwa kuendelea.
theological_decisions:
- issue: Msingi wa uhakika wa Paulo
  choice: katika Bwana
  alternative: tunawaamini ninyi katika Bwana
  rationale: Muundo wa Kigiriki unaunganisha uhakika huo na Bwana huku ukiwa kuhusu waamini; tafsiri haipaswi kuhamisha msingi wake kwa uwezo wa wanadamu.
- issue: Nguvu ya παραγγέλλομεν
  choice: tunayowaagiza
  alternative: tunayowaambia
  rationale: ‘Kuagiza’ huhifadhi mamlaka ya kitume bila kuongeza wazo la amri ya kimabavu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imewekwa wazi na ya kawaida kwa wasomaji wengi, huku ikihifadhi msisitizo wa Kigiriki juu ya uhakika ulio katika Bwana na utiifu wa sasa na wa baadaye.
