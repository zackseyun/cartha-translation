  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. 'Wanaishi' linaweka wazi matumizi ya kiidioma ya περιπατέω, huku 'bila utaratibu' likihifadhi upana wa ἀτάκτως. Alama zote za tanbihi zimewekwa katika matini kuu.
