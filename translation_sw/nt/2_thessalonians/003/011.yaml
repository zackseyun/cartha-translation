  text: ἀκούομεν γάρ τινας περιπατοῦντας ἐν ὑμῖν ἀτάκτως, μηδὲν ἐργαζομένους ἀλλὰ περιεργαζομένους·
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/011.yaml
  text: For we hear that some among you are walking disorderly[a], doing no work at all[b], but meddling.
translation:
  language: sw
  text: Kwa maana tunasikia kwamba baadhi yenu wanaishi bila utaratibu[a]; hawafanyi kazi yoyote, bali wanaingilia mambo yasiyowahusu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wanaishi kivivu” au “wanaishi bila nidhamu.” Neno la Kigiriki linaweza kueleza mwenendo usiofuata utaratibu au uvivu unaokiuka matarajio ya jumuiya.
    reason: lexical_alternative
  - marker: b
    text: 'Kigiriki kina mchezo wa maneno: hawafanyi kazi, lakini wanajishughulisha na mambo yasiyowahusu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούομεν
  choice: tunasikia
  rationale: Wakati wa sasa unaonyesha taarifa inayowafikia waandishi au jambo linalojulikana kwao kwa sasa.
- source_word: γάρ
  choice: Kwa maana
  rationale: Kiunganishi hiki kinaeleza sababu ya himizo lililotangulia.
- source_word: τινας ... ἐν ὑμῖν
  choice: baadhi yenu
  rationale: Kauli hii inarejelea watu fulani wasiotajwa majina ndani ya jumuiya ya wasomaji.
- source_word: περιπατοῦντας
  choice: wanaishi
  rationale: Kitenzi hiki kimetumiwa kiidioma kumaanisha mwenendo au namna ya kuishi; Kiswahili cha moja kwa moja 'wanatembea' kingeweza kuficha maana hiyo.
- source_word: ἀτάκτως
  choice: bila utaratibu
  rationale: Huhifadhi maana pana ya mwenendo usio na nidhamu au usiofuata utaratibu unaotarajiwa, bila kuufanya uvivu kuwa maana yake pekee.
- source_word: μηδὲν ἐργαζομένους
  choice: hawafanyi kazi yoyote
  rationale: Huwasilisha kwa kawaida na kwa mkazo kwamba hawafanyi kazi hata kidogo.
- source_word: ἀλλὰ περιεργαζομένους
  choice: bali wanaingilia mambo yasiyowahusu
  rationale: Hutoa maana ya kujishughulisha isivyofaa na mambo ya wengine. Tanbihi inaonyesha mchezo wa maneno wa Kigiriki unaohusisha kufanya kazi.
theological_decisions: []
