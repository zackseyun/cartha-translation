  source_fidelity: 'Matini inawakilisha kwa uaminifu muundo na maana ya Kigiriki: ἀκούομεν γάρ ni “Kwa maana tunasikia,” τινας ἐν ὑμῖν ni “baadhi yenu,” na περιπατοῦντας ἀτάκτως imewasilishwa kwa maana ya mwenendo wa maisha usiofuata utaratibu. Tofauti ya μηδὲν ἐργαζομένους na περιεργαζομένους imedumishwa vizuri kwa “hawafanyi kazi yoyote, bali wanaingilia mambo yasiyowahusu.”'
