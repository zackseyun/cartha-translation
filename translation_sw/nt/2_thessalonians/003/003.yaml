translation:
  language: sw
  text: Lakini Bwana ni mwaminifu; atawaimarisha na kuwalinda dhidi ya yule mwovu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “uovu.” Usemi wa Kigiriki τοῦ πονηροῦ unaweza kueleweka ama kama wa jinsia ya kiume (“yule mwovu”) au kama wa jinsia ya kati (“uovu”).'
    reason: alternative_reading
lexical_decisions:
- source_word: πιστὸς
  choice: mwaminifu
  rationale: Ni kivumishi kinachoeleza kwamba Bwana anategemeka na hutimiza ahadi zake, kinyume na kutokuwa na imani kwa baadhi ya watu katika muktadha uliotangulia.
- source_word: δέ
  choice: Lakini
  rationale: Inaonyesha tofauti na kauli iliyotangulia kwamba si watu wote walio na imani.
- source_word: ὁ κύριος
  choice: Bwana
  rationale: Inahifadhi cheo cha Kigiriki bila kubainisha zaidi mhusika; katika muktadha huu wa Paulo kwa kawaida humrejelea Bwana Yesu.
- source_word: στηρίξει
  choice: atawaimarisha
  rationale: Kitenzi kina maana ya kufanya imara, kuthibitisha, au kuimarisha. 'Atawaimarisha' ni ya kawaida katika Kiswahili na inafaa muktadha wa kichungaji.
- source_word: φυλάξει
  choice: kuwalinda
  rationale: Kinadumisha wazo la ulinzi wenye makusudi na uangalizi.
- source_word: ἀπὸ
  choice: dhidi ya
  rationale: Katika muundo wa Kiswahili, 'kuwalinda dhidi ya' hutoa kwa kawaida maana ya kuzuia hatari iliyotajwa isiwafikie.
- source_word: τοῦ πονηροῦ
  choice: yule mwovu
  rationale: Umbo la Kigiriki linaweza kuwa la kiume, 'yule mwovu,' au la kati, 'uovu.' Tafsiri kuu inachagua maana ya nafsi, huku tanbihi ikihifadhi utata halisi.
theological_decisions:
- issue: Mrejelewa wa τοῦ πονηροῦ
  choice: yule mwovu
  alternative: uovu
  rationale: Kisarufi, usemi wa Kigiriki unaweza kumaanisha nafsi mwovu au uovu kwa ujumla. Maana ya nafsi ina msingi mzuri katika matumizi ya Agano Jipya, lakini maana nyingine imehifadhiwa katika tanbihi ili kutoondoa utata wa matini.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo umegawanywa kwa alama ya nuktamkato ili sentensi isomeke kwa urahisi, huku wakati ujao wa vitenzi vyote viwili na utofautishaji wa δέ vikihifadhiwa.
