  yaml_path: translation/nt/2_thessalonians/003/017.yaml
  text: The greeting is by my own hand—Paul's—which is a sign in every letter[a]; this is how I write.
translation:
  language: sw
  text: Salamu hii imeandikwa kwa mkono wangu mwenyewe—mimi Paulo—ambayo ni ishara katika kila barua[a]; hivi ndivyo ninavyoandika.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Salamu hii imeandikwa kwa mkono wangu mwenyewe—mimi Paulo—ambayo ni ishara katika kila barua; hivyo ninaandika.” Kifungu cha mwisho kinaweza pia kutafsiriwa kwa ukaribu zaidi kuwa, “hivyo ninaandika.”
    reason: Njia nyingine ya kuunda sentensi na maana inayowezekana ya οὕτως γράφω.
lexical_decisions:
- source_word: ἀσπασμὸς
  choice: Salamu hii
  rationale: “Salamu” ni neno la kawaida na lenye hadhi kwa salamu ya kufunga barua; “hii” linaonyesha salamu anayoandika Paulo hapa.
- source_word: τῇ ἐμῇ χειρὶ
  choice: nimeiandika kwa mkono wangu mwenyewe
  rationale: Kirai hiki kinaonyesha kwamba Paulo mwenyewe ameandika sehemu hii kwa mkono wake. Muundo wa kitenzi ni wa asili katika Kiswahili kuliko tafsiri ya neno kwa neno “kwa mkono wangu.”
- source_word: Παύλου
  choice: mimi Paulo
  rationale: Jina linamtambulisha mwandishi kwa msisitizo; “mimi Paulo” ni tamko la kawaida la kujitambulisha katika Kiswahili.
- source_word: σημεῖον
  choice: ishara
  rationale: “Ishara” linaweza kumaanisha alama ya kumtambua au kuthibitisha mwandishi bila kuongeza maelezo yasiyo katika matini.
- source_word: ἐν πάσῃ ἐπιστολῇ
  choice: katika kila barua
  rationale: “Barua” ni neno la sasa na linaloeleweka kwa urahisi kuliko “waraka,” huku “kila” likihifadhi upeo wa πάσῃ.
- source_word: οὕτως γράφω
  choice: hivi ndivyo ninavyoandika
  rationale: Tafsiri hii inahifadhi maana ya namna ya kuandika, lakini haifungi uwezekano wa kuelewa maneno hayo kama rejeo kwa mfano wa maandishi uliopo hapa.
theological_decisions:
- issue: Nguvu ya kauli kuhusu mwandiko wa Paulo kama uthibitisho
  choice: Kauli inawasilisha salamu iliyoandikwa na Paulo mwenyewe kuwa ishara inayopatikana katika kila barua.
  alternative: 'Kifungu cha mwisho kinaweza kueleweka kwa maana nyembamba zaidi: “hivi ninaandika” au “ndivyo ninavyoandika sasa.”'
  rationale: Muktadha wa “ishara katika kila barua” unaunga mkono wazo la alama ya utambulisho, lakini tafsiri ya kifungu cha mwisho inaacha wazi kama Paulo anazungumzia namna yake ya kawaida ya kuandika au mfano huu wa sasa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umewekwa wazi kwa wasomaji wa kawaida bila kupoteza uwezekano wa kisemantiki wa kifungu cha mwisho.
