  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ὃ ⸀ἐὰν αἰτῶμεν λαμβάνομεν ⸀ἀπ’ αὐτοῦ, ὅτι τὰς ἐντολὰς αὐτοῦ τηροῦμεν καὶ τὰ ἀρεστὰ ἐνώπιον αὐτοῦ ποιοῦμεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/022.yaml
  text: And whatever we ask[a], we receive from him, because we keep his commandments and do what is pleasing in his sight.
translation:
  language: sw
  text: Na chochote tunachoomba, tunapokea kutoka kwake, kwa sababu tunazishika amri zake na kufanya yanayompendeza mbele yake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “machoni pake.”
    reason: Mbadala huu unaonyesha maana nyingine ya kawaida ya ἐνώπιον αὐτοῦ.
lexical_decisions:
- source_word: ὃ ἐὰν
  choice: chochote
  rationale: Muundo huu wa kiwakilishi pamoja na ἐάν una maana isiyo na kikomo, ‘chochote’; hili ni tamko la kawaida na la asili katika Kiswahili.
- source_word: αἰτῶμεν
  choice: tunachoomba
  rationale: Katika muktadha wa sala na maombi, αἰτέω humaanisha kuomba; umbo la kitenzi limeunganishwa kwa kawaida na ‘chochote’.
- source_word: λαμβάνομεν
  choice: tunapokea
  rationale: Wakati uliopo hapa unaeleza jambo la kawaida; ‘tunapokea’ huhifadhi maana ya kupokea kutoka kwa chanzo kilichotajwa.
- source_word: ἀπ’ αὐτοῦ
  choice: kutoka kwake
  rationale: ἀπό pamoja na uhusika wa genitivi huonyesha chanzo; ‘kutoka kwake’ ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: ὅτι
  choice: kwa sababu
  rationale: Kiunganishi hiki kinatoa sababu ya kupokea, hivyo uhusiano wa kisababu umehifadhiwa wazi.
- source_word: τὰς ἐντολὰς αὐτοῦ
  choice: amri zake
  rationale: ‘Amri’ ni neno la kawaida na lenye hadhi kwa ἐντολή, nalo hudumisha msamiati wa kimaadili wa Yohana.
- source_word: τηροῦμεν
  choice: tunazishika
  rationale: τηρέω hubeba maana ya kushika, kutunza, au kuzingatia amri; ‘tunazishika’ huhifadhi upana huo kuliko kutafsiri moja kwa moja kuwa ‘tunazitii’.
- source_word: τὰ ἀρεστὰ
  choice: yanayompendeza
  rationale: Kivumishi cha wingi kisicho na nomino kinarejelea mambo yanayompendeza Mungu; Kiswahili kinaweza kuyaeleza kwa kawaida kwa ‘yanayompendeza’ bila kuongeza maelezo yasiyokuwapo.
- source_word: ἐνώπιον αὐτοῦ
  choice: mbele zake
  rationale: Hii huhifadhi taswira ya msingi ya kuwa mbele yake; ‘machoni pake’ ni mbadala wa maana ileile na umetajwa katika tanbihi.
- source_word: ποιοῦμεν
  choice: kufanya
  rationale: ποιέω ni kitenzi cha kawaida chenye maana ya kufanya; tafsiri hii haiongezi wazo la mazoea zaidi ya lililo katika Kigiriki.
theological_decisions:
- issue: Uhusiano kati ya kujibiwa kwa maombi na kushika amri
  choice: 'Uhusiano wa kisababu umehifadhiwa: tunapokea kwa sababu tunazishika amri zake na kufanya yanayompendeza.'
  alternative: Kutumia kauli legevu inayofanya kushika amri kuwa jambo linaloambatana tu na kupokea, bila kuwa sababu iliyotajwa.
  rationale: ὅτι inataja sababu waziwazi. Tafsiri haipaswi kuondoa mvutano huu wa kiteolojia wala kuupanua kuwa kanuni ya moja kwa moja inayodhamini kila ombi bila kuzingatia muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Tunazishika amri zake’ hudumisha usemi wa Kiyohana, na ‘mbele zake’ ni wa kibiblia lakini bado unaeleweka kwa urahisi.
