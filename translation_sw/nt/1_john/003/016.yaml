  text: ἐν τούτῳ ἐγνώκαμεν τὴν ἀγάπην, ὅτι ἐκεῖνος ὑπὲρ ἡμῶν τὴν ψυχὴν αὐτοῦ ἔθηκεν· καὶ ἡμεῖς ὀφείλομεν ὑπὲρ τῶν ἀδελφῶν τὰς ψυχὰς ⸀θεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/016.yaml
  text: 'By this we have come to know love: that he laid down his life for us[b][a], and we ought to lay down our lives for the brothers.'
translation:
  language: sw
  text: 'Kwa hili tumeujua upendo: kwamba yeye aliutoa uhai wake kwa ajili yetu; nasi tunapaswa kuyatoa maisha yetu kwa ajili ya ndugu.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hapa “ndugu” linamaanisha waamini wenzao kwa ujumla, wakiwemo wanawake.
    reason: cultural_note
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: Hivi ndivyo
  rationale: Muundo huu wa Kiswahili unaonyesha njia au msingi ambao kwa huo upendo umetambuliwa, kwa lugha ya kawaida na yenye uzito.
- source_word: ἐγνώκαμεν
  choice: tulivyopata kuujua
  rationale: Huwasilisha hali ya sasa iliyotokana na utambuzi uliotokea, kulingana na nguvu ya wakati timilifu wa Kigiriki.
- source_word: ἀγάπην
  choice: upendo
  rationale: Ni tafsiri ya kawaida, wazi, na ya moja kwa moja ya ἀγάπη katika muktadha huu.
- source_word: ἐκεῖνος
  choice: Yeye
  rationale: Kiwakilishi chenye mkazo kinadumishwa bila kumtaja mhusika moja kwa moja; muktadha wa waraka humtambulisha kuwa Yesu.
- source_word: ὑπὲρ ἡμῶν
  choice: kwa ajili yetu
  rationale: Huhifadhi maana ya tendo lililofanywa kwa manufaa yetu au kwa niaba yetu bila kulazimisha nadharia mahususi ya upatanisho.
- source_word: τὴν ψυχὴν αὐτοῦ ἔθηκεν
  choice: aliutoa uhai wake
  rationale: Katika nahau hii ψυχή humaanisha uhai, na usemi unaeleza kujitoa kwa hiari hadi kufa. 'Aliutoa uhai wake' ni wa asili zaidi katika Kiswahili kuliko tafsiri ya neno kwa neno ya 'kuuweka chini'.
- source_word: ὀφείλομεν
  choice: tunapaswa
  rationale: Hueleza wajibu wa kimaadili kwa lugha ya sasa na inayoeleweka.
- source_word: τῶν ἀδελφῶν
  choice: ndugu
  rationale: Katika Kiswahili 'ndugu' linaweza kuwarejelea waamini wenzao wa kiume na wa kike, huku likilingana na matumizi ya kifamilia ya ἀδελφοί.
- source_word: τὰς ψυχὰς θεῖναι
  choice: kutoa uhai wetu
  rationale: Huhifadhi ulinganifu na tendo la Kristo katika sehemu ya kwanza ya mstari na kutoa maana ya kujitoa kikamilifu.
theological_decisions:
- issue: Mrejelewa wa ἐκεῖνος
  choice: Kiwakilishi 'Yeye' kinadumishwa, huku muktadha ukimtambulisha kuwa Yesu Kristo.
  alternative: Kumtaja wazi 'Yesu' au kutafsiri 'huyo'.
  rationale: Kigiriki hakimtaji Yesu kwa jina katika mstari huu. 'Yeye' huhifadhi mkazo na namna ya usemi wa chanzo bila kuficha mrejelewa wa kikristo unaoonyeshwa na muktadha.
- issue: Upeo wa τῶν ἀδελφῶν
  choice: '''ndugu'' limetumiwa kwa waamini wenzao kwa ujumla.'
  alternative: '''ndugu wa kiume'' au ''ndugu wa kiume na wa kike''.'
  rationale: Ingawa nomino ya Kigiriki ni wingi wa kiume, katika muktadha wa jumuiya inaweza kuwajumuisha waamini wa jinsia zote. Neno la Kiswahili 'ndugu' huhifadhi lugha ya kifamilia na lina upeo huo wa asili; tanbihi inaweka wazi maana ya muktadha.
- issue: Maana ya kutoa uhai
  choice: Usemi unaonyesha kujitoa kwa ajili ya wengine, hata kufikia kufa, bila kufafanua nadharia mahususi ya upatanisho.
  alternative: Kufasiri wazi kuwa ni tendo la badala ya adhabu pekee.
  rationale: ὑπέρ ina uzito wa kutenda kwa ajili au kwa niaba ya wengine, lakini mstari huu peke yake haupaswi kulazimishwa kusema zaidi ya chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo 'Hivi ndivyo' ni wa kawaida na wazi; 'aliutoa uhai wake' huepuka tafsiri ngumu ya nahau ya Kigiriki huku ukihifadhi maana ya kujitoa kwa hiari.
