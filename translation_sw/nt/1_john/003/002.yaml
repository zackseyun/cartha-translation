- from: Wapendwa, sasa sisi ni watoto wa Mungu, lakini bado haijafunuliwa tutakavyokuwa. Tunajua kwamba ikiwa yeye atafunuliwa[a], tutafanana naye[b], kwa sababu tutamwona jinsi alivyo.
  to: Wapendwa, sasa tu watoto wa Mungu, na bado haijafunuliwa tutakavyokuwa. Tunajua kwamba ikiwa atafunuliwa[a], tutafanana naye[b], kwa sababu tutamwona jinsi alivyo.
  rationale: The revision replaces the added adversative with the source’s additive connection, leaves the passive subject unexpressed in the main text to preserve the Greek ambiguity, and narrows the second footnote to the lexical distinction actually conveyed by ὅμοιοι. All other wording is accurate, idiomatic, and appropriately registered.
