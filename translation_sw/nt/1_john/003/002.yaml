  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀγαπητοί, νῦν τέκνα θεοῦ ἐσμεν, καὶ οὔπω ἐφανερώθη τί ἐσόμεθα. ⸀οἴδαμεν ὅτι ἐὰν φανερωθῇ ὅμοιοι αὐτῷ ἐσόμεθα, ὅτι ὀψόμεθα αὐτὸν καθώς ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/002.yaml
  text: Beloved[a], now we are children of God, and what we will be has not yet been revealed. We know that if he is revealed, we will be like him[b], because we will see him as he is.
translation:
  language: sw
  text: Wapendwa, sasa tu watoto wa Mungu, na bado haijafunuliwa tutakavyokuwa. Tunajua kwamba ikiwa atafunuliwa[a], tutafanana naye[b], kwa sababu tutamwona jinsi alivyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ikiwa itafunuliwa,” ikimaanisha tutakavyokuwa; kiima hakijatajwa wazi katika Kigiriki. Muktadha unaunga mkono kumrejelea Kristo. Tafsiri nyingi husema, “atakapotokea,” lakini Kigiriki ni kihalisi zaidi, “ikiwa atafunuliwa,” kwa kutumia kitenzi kilekile kilichotumiwa mapema katika mstari huu.
    reason: alternative_reading
  - marker: b
    text: Neno la Kigiriki humaanisha kufanana au kuwa kama yeye, si kuwa mtu yuleyule.
    reason: lexical_clarity
lexical_decisions:
- source_word: ἀγαπητοί
  choice: Wapendwa
  rationale: Neno la wito kwa wingi linaloonyesha upendo; “Wapendwa” ni la kawaida, lenye heshima, na linadumisha uhusiano wake na lugha ya upendo.
- source_word: νῦν
  choice: sasa
  rationale: Linaonyesha hali ya waamini ya wakati huu ikilinganishwa na hali yao ya baadaye ambayo bado haijafunuliwa.
- source_word: τέκνα θεοῦ
  choice: watoto wa Mungu
  rationale: Linawasilisha uhusiano wa kifamilia bila kuingiza jinsia ambayo haimo katika Kigiriki.
- source_word: οὔπω ἐφανερώθη τί ἐσόμεθα
  choice: bado haijafunuliwa tutakavyokuwa
  rationale: “Haijafunuliwa” huhifadhi wazo la kufanywa dhahiri, huku “tutakavyokuwa” ikiwa Kiswahili cha asili kinachoeleza hali yetu ya baadaye.
- source_word: οἴδαμεν
  choice: Tunajua
  rationale: Ni tafsiri ya moja kwa moja ya kitenzi chenye maana ya hali ya sasa ya kujua.
- source_word: ἐὰν φανερωθῇ
  choice: ikiwa yeye atafunuliwa
  rationale: Huhifadhi muundo wa sharti na kauli tendwa ya Kigiriki, pamoja na mwangwi wa kitenzi kilekile kilichotumiwa awali. Kiwakilishi “yeye” kinamrejelea Kristo kulingana na muktadha, lakini tanbihi inadumisha uwezekano wa kisarufi wa rejeo jingine.
- source_word: ὅμοιοι αὐτῷ
  choice: tutafanana naye
  rationale: Hueleza ufanano wa kweli bila kudokeza kuwa waamini watakuwa yeye au watakuwa sawa naye kwa asili.
- source_word: ὀψόμεθα αὐτὸν
  choice: tutamwona
  rationale: Hutoa kwa kawaida maana ya wakati ujao na kuhifadhi kwamba yeye ndiye atakayeonekana moja kwa moja.
- source_word: καθώς ἐστιν
  choice: jinsi alivyo
  rationale: Huhifadhi maana ya kumwona katika hali yake halisi.
theological_decisions:
- issue: Rejeo la kiima kisichotajwa katika ἐὰν φανερωθῇ
  choice: “ikiwa yeye atafunuliwa,” ambapo “yeye” anamrejelea Kristo
  alternative: “ikiwa itafunuliwa,” yaani hali yetu ya baadaye ikifunuliwa; au tafsiri ya kimafafanuzi “atakapotokea”
  rationale: Muktadha wa kumwona “yeye” na kufanana “naye” unaunga mkono rejeo kwa Kristo. Hata hivyo, kwa kuwa kiima hakitajwi wazi katika Kigiriki, uwezekano mwingine umewekwa katika tanbihi.
- issue: Asili ya kufanana kwa waamini na Kristo wakati ujao
  choice: “tutafanana naye”
  alternative: “tutakuwa kama alivyo”
  rationale: ὅμοιοι huonyesha ufanano, si utambulisho au usawa wa asili; tafsiri hii inadumisha nguvu ya ahadi bila kuzidisha maana.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa ulinganifu bora: unasomeka kwa kawaida huku ukihifadhi sharti, kauli tendwa, marudio ya φανερόω, na utata halisi wa kiima.'
