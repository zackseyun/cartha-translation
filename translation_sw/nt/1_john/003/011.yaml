base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/011.yaml
  text: 'For this is the message that you have heard from the beginning: that we should love one another[a][b].'
translation:
  language: sw
  text: 'Kwa maana huu ndio ujumbe mliousikia tangu mwanzo: kwamba tupendane.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ili tupendane,” au “na tupendane.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ὅτι
  choice: Kwa maana
  rationale: Katika muktadha huu linaanzisha maelezo ya kauli iliyotangulia; “Kwa maana” linaonyesha uhusiano huo kwa Kiswahili cha kawaida.
- source_word: αὕτη ἐστὶν ἡ ἀγγελία
  choice: huu ndio ujumbe
  rationale: Muundo huu ni wa asili katika Kiswahili, unahifadhi msisitizo wa kiwakilishi αὕτη, na kutafsiri ἀγγελία kwa neno linaloeleweka vizuri.
- source_word: ἣν ἠκούσατε
  choice: mliousikia
  rationale: Wakati uliopita wa Kiswahili unaakisi aoristi ya Kigiriki kwa kawaida bila kuongeza kwa lazima maana ya hali inayoendelea.
- source_word: ἀπ’ ἀρχῆς
  choice: tangu mwanzo
  rationale: Hii ni tafsiri ya kawaida na ya asili ya usemi wa Kiyohana, huku ikihifadhi wazo la kuanzia mwanzo.
- source_word: ἵνα ἀγαπῶμεν
  choice: kwamba tupendane
  rationale: “Kwamba” linaonyesha maudhui ya ujumbe, na hali ya utegemezi katika “tupendane” huhifadhi nguvu ya kimaadili na ya kuhimiza ya subjunktivi.
- source_word: ἀλλήλους
  choice: -ane katika “tupendane”
  rationale: Kiambishi cha kutendeana -ane ndicho njia ya asili ya Kiswahili ya kueleza “mmoja na mwenzake,” bila urudiaji usiohitajika.
theological_decisions:
- issue: Nguvu ya ἵνα ἀγαπῶμεν ἀλλήλους
  choice: kwamba tupendane
  alternative: ili tupendane; na tupendane
  rationale: Tafsiri iliyochaguliwa inaonyesha hasa maudhui au msukumo wa kimaadili wa ujumbe. Hata hivyo, ἵνα inaweza pia kusikika kuwa ya kusudi au himizo, kwa hiyo uwezekano huo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Huu ndio ujumbe” na “tupendane” ni miundo ya kawaida, wazi, na inayofaa usomaji wa hadharani. Tofauti ya Kiingereza kati ya “that you have heard” na “which you heard” haihitaji tanbihi ya Kiswahili, kwa kuwa zote hutolewa kwa asili kama “mliousikia.”
