source:
  edition: SBLGNT
  text: καὶ οἴδατε ὅτι ἐκεῖνος ἐφανερώθη ἵνα τὰς ⸀ἁμαρτίας ἄρῃ, καὶ ἁμαρτία ἐν αὐτῷ οὐκ ἔστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/005.yaml
  text: And you know that he appeared in order to take away sins[b][a], and in him there is no sin.
translation:
  language: sw
  text: Nanyi mnajua kwamba yeye alifunuliwa ili aziondoe dhambi[a], na ndani yake hamna dhambi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “azichukue dhambi” au “azibebe na kuziondoa.” Kitenzi cha Kigiriki kinaweza kumaanisha kuondoa, kuchukua, au kubeba kitu na kukipeleka mbali.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴδατε
  choice: mnajua
  rationale: Ingawa umbo lake ni timilifu, οἶδα kwa kawaida lina maana ya wakati wa sasa katika Kigiriki cha Koine; “mnajua” ni Kiswahili cha kawaida na sahihi.
- source_word: ἐκεῖνος
  choice: yeye
  rationale: Katika muktadha huu wa Yohana, kiwakilishi hiki kinamrejelea Yesu Kristo kwa msisitizo. “Yeye” ni cha kawaida na hakiongezi jina lisilokuwamo katika mstari.
- source_word: ἐφανερώθη
  choice: alifunuliwa
  rationale: Huhifadhi maana ya hali tendwa ya φανερόω, yaani kwamba Kristo alidhihirishwa/akaonekana wazi katika historia, huku ikibaki lugha ya asili na yenye hadhi.
- source_word: ἵνα
  choice: ili
  rationale: “Ili” huonyesha wazi kusudi linalotolewa na ἵνα.
- source_word: τὰς ἁμαρτίας
  choice: dhambi
  rationale: Kiswahili kwa kawaida hutumia “dhambi” bila kubainisha umoja au wingi kwa umbo; hapa linaeleweka kama matendo ya dhambi kwa ujumla, sawasawa na wingi wa Kigiriki.
- source_word: ἄρῃ
  choice: aziondoe
  rationale: Hutoa maana kuu ya kuondoa au kutwaa mbali dhambi bila kuamua kimyakimya namna maalumu ya upatanisho. Kiambishi “-zi-” kinarejelea dhambi kama nyingi kimantiki.
- source_word: ἁμαρτία
  choice: dhambi
  rationale: Neno la umoja lisilo na kibainishi linaeleza kutokuwapo kabisa kwa dhambi ndani yake; “dhambi” huhifadhi usemi huo kwa urahisi.
- source_word: ἐν αὐτῷ
  choice: ndani yake
  rationale: Huhifadhi picha ya Kiyohana ya ἐν αὐτῷ na kueleza kwamba dhambi haimo kabisa ndani yake.
theological_decisions:
- issue: Mrejelewa wa ἐκεῖνος
  choice: Kumrejelea Yesu Kristo kwa “yeye”
  alternative: “Huyo” au kuongeza wazi “Yesu Kristo”
  rationale: Muktadha unatambulisha mrejelewa kuwa Kristo, lakini “yeye” huhifadhi muundo wa maandishi bila kuongeza jina ambalo halimo katika mstari.
- issue: Maana ya αἴρω inapohusishwa na dhambi
  choice: kuondoa dhambi
  alternative: kuzibeba au kuzichukua dhambi
  rationale: “Kuondoa” huweka mbele kusudi la kuondolewa kwa dhambi bila kufungamanisha mstari na maelezo mahususi ya namna ya upatanisho. Uwezekano wa maana ya kuzibeba/kuzitwaa mbali umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Nanyi” huunganisha sentensi na yaliyotangulia; “alifunuliwa” huhifadhi hali tendwa ya Kigiriki. Alama ya tanbihi [a] imewekwa mara tu baada ya kishazi kinachohusika.
