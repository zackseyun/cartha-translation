review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the knowledge claim, the completed transition from death into life, love for fellow believers, and continuing residence in death for the person characterized by not loving. However, "tumekwisha" conventionally adds an explicit sense of ‘already/finished’ that the Greek perfect μεταβεβήκαμεν does not require; the perfect’s completed transition with present result is adequately expressed without it.
  naturalness: The register is clear, modern Standard East African Swahili. “Mautini,” “uzimani,” “tunawapenda ndugu,” and “Asiyependa hubaki mautini” are natural and suitably concise. Recasting the transition as “tumetoka mautini, tukaingia uzimani” avoids the added emphasis of “tumekwisha” while reading smoothly.
  terminology: “Mauti” and “uzima” preserve the Greek’s unexpanded theological terms. “Ndugu” is the natural Swahili equivalent and can function inclusively in this context. The footnote should not present “ndugu wa kiume na wa kike” as a straightforward alternative to the Swahili main text, since “ndugu” itself is not grammatically restricted to males in the same way; it should instead explain the masculine grammatical form of the Greek and its likely inclusive reference.
  issues:
  - severity: low
    issue: “Tumekwisha” adds an ‘already/entirely completed’ nuance.
    rationale: μεταβεβήκαμεν is perfect and does mark a completed transition with continuing result, but it does not contain an adverb equivalent to “already.” Removing “kwisha” is more restrained and preserves the source nuance.
  - severity: low
    issue: The footnote’s wording treats “ndugu wa kiume na wa kike” as an ‘Au’ alternative.
    rationale: The main-text Kiswahili term “ndugu” is naturally capable of inclusive reference. The note should explain that the Greek noun is grammatically masculine and likely refers to fellow believers generally, rather than imply that the Swahili wording excludes women.
  revised_text: Tunajua kwamba tumetoka mautini, tukaingia uzimani,[a] kwa sababu tunawapenda ndugu. Asiyependa hubaki mautini.
  revised_footnotes:
  - marker: a
    text: Neno la Kigiriki ni la kiume, “ndugu”; katika muktadha huu huenda linawahusu waamini wote.
    reason: lexical_alternative
  revision_rationale: The revision removes a small temporal overstatement while retaining the completed movement from mauti to uzima. The footnote is reshaped to describe the source-language gender form and likely inclusive referent accurately in idiomatic Swahili. No theological expansion has been introduced.
