  text: ἡμεῖς οἴδαμεν ὅτι μεταβεβήκαμεν ἐκ τοῦ θανάτου εἰς τὴν ζωήν, ὅτι ἀγαπῶμεν τοὺς ἀδελφούς· ὁ μὴ ⸀ἀγαπῶν μένει ἐν τῷ θανάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/014.yaml
  text: We know that we have passed from death into life[a], because we love the brothers. The one who does not love remains in death.
translation:
  language: sw
  text: Tunajua kwamba tumetoka mautini, tukaingia uzimani,[a] kwa sababu tunawapenda ndugu. Asiyependa hubaki mautini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki ni la kiume, “ndugu”; katika muktadha huu huenda linawahusu waamini wote.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴδαμεν
  choice: Tunajua
  rationale: οἶδα ni kitenzi cha hali chenye umbo la wakati timilifu lakini maana ya sasa; “tunajua” ni Kiswahili cha kawaida na sahihi.
- source_word: μεταβεβήκαμεν
  choice: tumekwisha kutoka ... na kuingia
  rationale: Wakati timilifu unaonyesha mpito uliokamilika wenye matokeo yanayoendelea. Muundo huu unaweka wazi mwendo kutoka eneo moja na kuingia jingine.
- source_word: ἐκ τοῦ θανάτου εἰς τὴν ζωήν
  choice: kutoka mautini na kuingia uzimani
  rationale: Huhifadhi nguvu ya vihusishi ἐκ...εἰς, yaani kutoka katika hali au eneo la mauti na kuingia katika uzima, bila kufafanua sitiari zaidi ya maandishi.
- source_word: ἀγαπῶμεν
  choice: tunawapenda
  rationale: Wakati wa sasa unaonyesha tendo endelevu au tabia bainifu; “tunawapenda” ni usemi wa asili katika muktadha huu.
- source_word: τοὺς ἀδελφούς
  choice: ndugu
  rationale: “Ndugu” huhifadhi neno la kifamilia la Kigiriki na kwa kawaida katika Kiswahili linaweza kurejelea waamini wenzake wa kiume na wa kike; tanbihi inaeleza upeo huo.
- source_word: ὁ μὴ ἀγαπῶν
  choice: Asiyependa
  rationale: Kirai hiki cha Kiswahili ni cha kawaida, kifupi, na huhifadhi maana ya jumla ya mtu ambaye kutopenda ni tabia yake.
- source_word: μένει
  choice: hubaki
  rationale: Huonyesha hali inayoendelea na ni lugha inayoeleweka kwa urahisi, huku ikidumisha dhana muhimu ya μένω katika Yohana.
- source_word: ἐν τῷ θανάτῳ
  choice: mautini
  rationale: Umbo la mahali huhifadhi sitiari ya kubaki ndani ya hali au eneo la mauti bila kuongeza tafsiri ya kiteolojia.
theological_decisions:
- issue: Rejeleo na nguvu ya kijinsia ya ἀδελφοί
  choice: Neno “ndugu” limetumiwa katika maandishi, huku tanbihi ikieleza kwamba hapa huenda linawahusu waamini wote.
  alternative: ndugu wa kiume na wa kike; waamini wenzetu
  rationale: Kigiriki kina nomino ya wingi ya kiume, lakini katika muktadha wa jumuiya mara nyingi hujumuisha waamini wa jinsia zote. Kiswahili “ndugu” hudumisha taswira ya kifamilia na linaweza kuwa jumuishi bila kulazimisha ufafanuzi ndani ya mstari.
- issue: Asili ya “mauti” na “uzima”
  choice: Maneno yameachwa kama “mauti” na “uzima” bila upanuzi wa kifafanuzi.
  alternative: mauti ya kiroho na uzima wa milele; milki ya mauti na milki ya uzima
  rationale: Andiko linaeleza mpito mkubwa wa kiteolojia kwa sitiari fupi. Kutoyaongeza maelezo kunahifadhi upana na mvutano wa maneno ya asili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Mautini” na “uzimani” vinahifadhi sitiari ya maeneo mawili, huku “tumekwisha kutoka ... na kuingia” kikionyesha mpito uliokamilika wenye matokeo yanayoendelea.
