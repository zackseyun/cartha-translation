source:
  edition: SBLGNT
  text: πᾶς ὁ μισῶν τὸν ἀδελφὸν αὐτοῦ ἀνθρωποκτόνος ἐστίν, καὶ οἴδατε ὅτι πᾶς ἀνθρωποκτόνος οὐκ ἔχει ζωὴν αἰώνιον ἐν ⸀αὐτῷ μένουσαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/015.yaml
  text: Everyone who hates his brother is a murderer[b][a], and you know that every murderer does not have eternal life remaining in him.
translation:
  language: sw
  text: Kila mtu anayemchukia ndugu yake ni muuaji,[a] nanyi mnajua kwamba hakuna muuaji aliye na uzima wa milele unaokaa ndani yake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika muktadha huu, “ndugu yake” huenda ikamaanisha mwamini mwenzake.
    reason: cultural_note
  - marker: b
    text: Au “unaodumu ndani yake.” Kitenzi cha Kigiriki kina maana ya kukaa au kuendelea kuwamo, na ni neno muhimu linalojirudia katika maandishi ya Yohana.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ὁ μισῶν
  choice: Kila mtu anayemchukia
  rationale: Muundo wenye kivumishi-tendo cha wakati uliopo unaeleza kundi kwa ujumla na hali inayomtambulisha mtu; Kiswahili hiki ni cha kawaida na kinahifadhi maana hiyo.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: ndugu yake
  rationale: “Ndugu” huhifadhi umoja wa neno la Kigiriki na ni la kawaida katika Kiswahili; katika muktadha linaelekea kumaanisha mshiriki mwenzake wa jumuiya ya waamini.
- source_word: ἀνθρωποκτόνος
  choice: muuaji
  rationale: Hili ndilo neno la kawaida na lenye uzito ufaao wa kimaadili kwa mtu anayeua binadamu.
- source_word: οἴδατε
  choice: mnajua
  rationale: Umbo la nafsi ya pili wingi linaonyeshwa wazi na kiambishi “m-” cha Kiswahili.
- source_word: πᾶς ἀνθρωποκτόνος οὐκ ἔχει
  choice: hakuna muuaji aliye na
  rationale: Hii ndiyo njia ya asili ya Kiswahili ya kuwasilisha ukanushaji wa kundi lote bila kuleta utata wa kimantiki.
- source_word: ζωὴν αἰώνιον
  choice: uzima wa milele
  rationale: Ni tafsiri ya kawaida katika Kiswahili inayohifadhi maana ya maisha yasiyo na mwisho pamoja na uzito wake wa kitheolojia.
- source_word: ἐν αὐτῷ μένουσαν
  choice: ukikaa ndani yake
  rationale: “Kukaa” huhifadhi maana ya kuendelea kuwamo ya μένω na pia uhusiano wake na matumizi ya neno hili yanayojirudia katika maandishi ya Yohana.
theological_decisions:
- issue: Wigo wa “ndugu”
  choice: Kuweka “ndugu yake” katika matini kuu na kueleza maana ya kimuktadha katika tanbihi.
  alternative: ndugu yake katika imani; mwamini mwenzake
  rationale: Muktadha unahusu upendo ndani ya jumuiya ya waamini, lakini matini ya Kigiriki yenyewe ina nomino ya umoja; tafsiri haipaswi kufafanua wigo huo kupita kiasi katika matini kuu.
- issue: Maana ya μένω katika Yohana
  choice: ukikaa ndani yake
  alternative: ukidumu ndani yake
  rationale: “Kukaa” ni lugha ya sasa, ya asili, na inadumisha sitiari ya kuendelea kuwamo; “kudumu” ni mbadala halali unaosisitiza mwendelezo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imetumia “nanyi” kuunganisha hoja kwa mtiririko wa kifasihi, na “hakuna muuaji” kwa ukanushaji wa kawaida na usio na utata.
