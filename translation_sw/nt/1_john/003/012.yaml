id: 1JN.3.12
reference: 1 John 3:12
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οὐ καθὼς Κάϊν ἐκ τοῦ πονηροῦ ἦν καὶ ἔσφαξεν τὸν ἀδελφὸν αὐτοῦ· καὶ χάριν τίνος ἔσφαξεν αὐτόν; ὅτι τὰ ἔργα αὐτοῦ πονηρὰ ἦν, τὰ δὲ τοῦ ἀδελφοῦ αὐτοῦ δίκαια.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/012.yaml
  text: not like Cain[a], who was from the evil one and slaughtered his brother. And why did he slaughter him? Because his deeds were evil[b], but those of his brother were righteous.
translation:
  language: sw
  text: Si kama Kaini, aliyekuwa wa yule Mwovu[a] na akamchinja[b] ndugu yake. Kwa nini alimchinja? Kwa sababu matendo yake yalikuwa maovu, lakini yale ya ndugu yake yalikuwa ya haki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uovu.” Usemi wa Kigiriki unaweza kueleweka kwa maana ya jumla, ingawa katika maandishi ya Yohana mara nyingi humrejelea yule Mwovu kama kiumbe binafsi.
    reason: alternative_reading
  - marker: b
    text: Au, “akamwua.” Kitenzi cha Kigiriki kina picha kali zaidi, kihalisi “akamchinja.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ καθὼς Κάϊν
  choice: Si kama Kaini
  rationale: Huhifadhi ulinganisho hasi unaounganisha mstari huu na wito wa kupendana katika muktadha uliotangulia, bila kuongeza kitenzi kisichotajwa hapa.
- source_word: ἐκ τοῦ πονηροῦ
  choice: aliyetokana na yule Mwovu
  rationale: Neno “aliyetokana na” linaonyesha chanzo au asili inayodokezwa na ἐκ; “yule Mwovu” linafuata matumizi ya kawaida ya usemi huu katika maandishi ya Yohana, huku maana ya “uovu” ikihifadhiwa katika tanbihi.
- source_word: ἔσφαξεν
  choice: akamchinja
  rationale: Kitenzi hiki ni chenye nguvu na picha ya ukatili kuliko “akamwua”; “akamchinja” huhifadhi uzito wa σφάζω kwa Kiswahili cha sasa.
- source_word: ἀδελφὸν αὐτοῦ
  choice: ndugu yake
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida; uhusiano wa kindugu ni muhimu katika tofauti ya kimaadili ya mstari huu.
- source_word: χάριν τίνος
  choice: Kwa nini
  rationale: Ni njia ya kawaida na wazi ya Kiswahili ya kuuliza sababu.
- source_word: ὅτι τὰ ἔργα αὐτοῦ πονηρὰ ἦν
  choice: Kwa sababu matendo yake yalikuwa maovu
  rationale: “Matendo” ni Kiswahili cha kawaida kwa ἔργα katika muktadha wa mwenendo wa kimaadili, na “maovu” huhifadhi tofauti na matendo ya haki.
- source_word: τὰ δὲ τοῦ ἀδελφοῦ αὐτοῦ δίκαια
  choice: lakini yale ya ndugu yake yalikuwa ya haki
  rationale: “Yale” huhifadhi kwa njia ya kawaida udondoshaji wa nomino “matendo” katika Kigiriki, huku “ya haki” likidumisha maana ya kimaadili ya δίκαια.
theological_decisions:
- issue: Iwapo τοῦ πονηροῦ inamtaja mtu binafsi au uovu kwa maana ya jumla
  choice: yule Mwovu
  alternative: uovu
  rationale: Katika maandishi ya Yohana, usemi wenye kibainishi mara nyingi humtaja yule Mwovu kama nafsi; hata hivyo, uwezekano wa maana ya jumla haujaondolewa bali umeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “Si kama Kaini” umeachwa ukiunganika na sentensi ya mstari uliotangulia. “Akamchinja” hudumisha ukali wa picha ya asili bila kutumia lugha ya kizamani.
