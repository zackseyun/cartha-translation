  yaml_path: translation/nt/1_john/003/007.yaml
  text: Little children, let no one deceive you. The one who practices righteousness is righteous, just as that one is righteous.
translation:
  language: sw
  text: Watoto wadogo, mtu yeyote asiwadanganye[a]. Anayetenda haki[b] ni mwenye haki, kama vile yule[c] alivyo mwenye haki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtu yeyote asiwapotoshe” au “mtu yeyote asiwapoteze njia.”
    reason: lexical_alternative
  - marker: b
    text: Neno la Kigiriki linaweza pia kutafsiriwa “uadilifu.” Hapa “haki” inamaanisha mwenendo ulionyooka unaolingana na kuwa mwenye haki.
    reason: lexical_alternative
  - marker: c
    text: Kigiriki, “yule.” Huenda zaidi kinamrejelea Kristo, ingawa wengine huelewa kuwa kinamrejelea Mungu.
    reason: alternative_reading
lexical_decisions:
- source_word: τεκνία
  choice: Watoto wadogo
  rationale: Hifadhi ya wingi, hali ya kuitana, na upole wa umbo la kupunguza; katika muktadha huu ni mwito wa kifamilia wenye upendo, si maelezo ya umri pekee.
- source_word: μηδεὶς πλανάτω ὑμᾶς
  choice: mtu yeyote asiwadanganye
  rationale: Ni katazo la moja kwa moja na la kawaida katika Kiswahili. Kitenzi πλανάω kinaweza pia kumaanisha kupotosha au kuongoza katika njia isiyo sahihi.
- source_word: ὁ ποιῶν τὴν δικαιοσύνην
  choice: Anayetenda haki
  rationale: Kitenzi cha wakati uliopo katika muundo huu kinaonyesha mwenendo unaomtambulisha mtu. ‘Kutenda haki’ ni kifupi na cha kawaida, huku kikidumisha uhusiano na ‘mwenye haki.’
- source_word: δίκαιός ἐστιν
  choice: ni mwenye haki
  rationale: Hueleza tabia au hali ya mtu kuwa mwadilifu na hudumisha uhusiano wa kimsamiati na ‘kutenda haki.’
- source_word: καθὼς
  choice: kama vile
  rationale: Huonyesha ulinganisho wa wazi na wa kawaida katika Kiswahili.
- source_word: ἐκεῖνος
  choice: yeye
  rationale: Kiwakilishi hiki ni cha asili katika Kiswahili na hakimtaji wazi mhusika kuwa Kristo au Mungu, hivyo kinaacha rejeo la Kigiriki likiwa wazi kulingana na muktadha.
theological_decisions:
- issue: Mhusika anayerejelewa na ἐκεῖνος
  choice: Kiwakilishi ‘yeye’ kimeachwa katika matini kuu; katika muktadha huenda zaidi kinamrejelea Kristo.
  alternative: Mungu/Baba anaweza kuwa anayerejelewa, au rejeo la kimungu linaweza kuachwa wazi kwa makusudi.
  rationale: Matumizi ya Yohana na muktadha wa kuiga mwenendo yanaelekea kwa Kristo, lakini nomino ya wazi haipo katika Kigiriki. Kutumia ‘yeye’ huepuka kutatua kimya-kimya utata huo wa kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo ‘Watoto wadogo’ unabeba upole wa mwito wa mwandishi; ‘Anayetenda haki’ huonyesha mwenendo wa kawaida bila kuongeza maelezo yasiyopo katika matini.
