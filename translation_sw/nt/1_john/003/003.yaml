  yaml_path: translation/nt/1_john/003/003.yaml
  text: And everyone who has this hope set on him purifies himself[b][a], just as he is pure.
translation:
  language: sw
  text: Na kila mtu mwenye tumaini hili kwake[a] hujitakasa, kama yule[b] alivyo safi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mwenye tumaini hili katika yeye.” Kauli ya Kigiriki inaweza kueleweka kwa njia zote mbili; “kwake” huonyesha kwamba tumaini limeelekezwa kwa huyo mrejelewa.
    reason: lexical_alternative
  - marker: b
    text: Katika muktadha, “yule” huenda zaidi anamrejelea Mwana, yaani Kristo, ingawa Kigiriki kinatumia kiwakilishi bila kumtaja kwa jina.
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶς ὁ ἔχων
  choice: kila mtu aliye na
  rationale: Muundo huu huonyesha kundi kwa ujumla, yaani kila mwenye tumaini hilo; Kiswahili hiki ni cha kawaida na kinadumisha hali ya kudumu inayodokezwa na kitenzi cha wakati wa sasa.
- source_word: ἐλπίδα ταύτην
  choice: tumaini hili
  rationale: Hurejelea moja kwa moja tumaini lililotajwa katika muktadha uliotangulia; hapa ‘tumaini’ ni matarajio yenye uhakika, si tamanio tu.
- source_word: ἐπ’ αὐτῷ
  choice: lililowekwa kwake
  rationale: Hufanya wazi kwamba yeye ndiye mlengwa au msingi wa tumaini, huku ikiepuka kuongeza jina lisilokuwamo katika Kigiriki.
- source_word: ἁγνίζει ἑαυτὸν
  choice: hujitakasa
  rationale: Kitenzi cha kujirejelea kinawakilisha kwa ufupi na kwa kawaida tendo la mtu kujifanya safi kimaadili; ‘hu-’ pia huonyesha mwenendo wa kawaida au unaoendelea.
- source_word: καθὼς
  choice: kama
  rationale: Huonyesha ulinganisho wa moja kwa moja kwa Kiswahili cha kawaida.
- source_word: ἐκεῖνος
  choice: yeye
  rationale: Ni kiwakilishi cha asili katika Kiswahili na hakiongezi jina ‘Kristo’ ambalo halipo wazi katika sentensi ya Kigiriki.
- source_word: ἁγνός
  choice: safi
  rationale: Ni neno la kawaida na lenye heshima kwa usafi wa kimaadili katika muktadha huu; pia linahifadhi uhusiano wa maana na ‘hujitakasa.’
theological_decisions:
- issue: Mrejelewa wa αὐτῷ na ἐκεῖνος
  choice: Viwakilishi vinadumishwa; katika muktadha vinaelekea zaidi kumrejelea Mwana/Kristo.
  alternative: αὐτῷ inaweza kumrejelea Mungu Baba, au viwakilishi vinaweza kuacha kwa makusudi kiasi fulani cha utata kati ya Baba na Mwana.
  rationale: Muktadha wa karibu unaelekeza kwa Kristo, lakini Kigiriki hakitaji jina wala cheo. Kutumia viwakilishi kunahifadhi mvutano huo bila kuufafanua kupita maandishi.
- issue: Kirejeshi cha umoja ἑαυτὸν katika kauli ya kijumla
  choice: hujitakasa
  alternative: anajitakasa mwenyewe
  rationale: Kitenzi cha Kiswahili chenye kiambishi ‘ji-’ hudumisha maana ya kujirejelea bila kulazimisha jinsia ambayo sarufi ya Kiswahili haihitaji hapa; ‘kila mtu’ hubeba maana ya kijumla.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Sentensi inadumisha kiwakilishi badala ya kuingiza jina la mrejelewa, na ‘hujitakasa’ linafaa kwa wazo la mwenendo wa kimaadili unaoendelea.
