id: 1JN.3.8
reference: 1 John 3:8
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὁ ποιῶν τὴν ἁμαρτίαν ἐκ τοῦ διαβόλου ἐστίν, ὅτι ἀπ’ ἀρχῆς ὁ διάβολος ἁμαρτάνει. εἰς τοῦτο ἐφανερώθη ὁ υἱὸς τοῦ θεοῦ ἵνα λύσῃ τὰ ἔργα τοῦ διαβόλου.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/008.yaml
  text: 'The one who practices sin is from the devil[a], because the devil has been sinning from the beginning[d][c][b]. For this purpose the Son of God was revealed: to destroy the works of the devil.'
translation:
  language: sw
  text: 'Anayeendelea kutenda dhambi anatokana na Ibilisi[a], kwa sababu Ibilisi amekuwa akitenda dhambi tangu mwanzo[b]. Kwa kusudi hili Mwana wa Mungu alifunuliwa[c]: ili azivunje kazi za Ibilisi[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ni wa Ibilisi.” Kigiriki hutumia kihalisi neno “kutoka,” likionyesha chanzo au mwelekeo wa kimaadili na kiroho. “Anayeendelea kutenda dhambi” pia yaweza kutafsiriwa “anayetenda dhambi”; muundo wa Kigiriki unaashiria tendo linaloendelea au lililo tabia, si lazima tendo moja lililotengwa.
    reason: lexical_alternative
  - marker: b
    text: “Tangu mwanzo” haifafanui hapa ni mwanzo upi hasa; tafsiri inaacha upana huo wa maana kama ulivyo katika Kigiriki.
    reason: ambiguity_preservation
  - marker: c
    text: Au “alidhihirishwa” au “alitokea.” Kigiriki hukazia kuonekana na kufunuliwa kwa utambulisho na kusudi lake.
    reason: lexical_alternative
  - marker: d
    text: Au “azibatilisha” au “azitengue.” Kitenzi cha Kigiriki humaanisha kihalisi kufungua au kulegeza, na kwa upanuzi kuvunja au kuharibu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ποιῶν τὴν ἁμαρτίαν
  choice: anayeendelea kutenda dhambi
  rationale: Kirai hiki kina kitenzi-unganishi cha wakati wa sasa kinachoonyesha tendo linaloendelea au lililo tabia. Neno “anayeendelea” linaweka wazi nguvu hiyo bila kudai kwamba tendo moja tu ndilo linalomfanya mtu atokane na Ibilisi.
- source_word: ἐκ τοῦ διαβόλου
  choice: anatokana na Ibilisi
  rationale: ἐκ huonyesha chanzo au mwelekeo wa kimaadili na kiroho. “Anatokana na” huhifadhi taswira ya chanzo bila kumaanisha uzazi halisi kutoka kwa Ibilisi.
- source_word: διάβολος
  choice: Ibilisi
  rationale: Hapa διάβολος ni jina linalotambulika la kiumbe binafsi, si maelezo ya jumla tu ya mchongezi.
- source_word: ὅτι ἀπ’ ἀρχῆς
  choice: kwa sababu ... tangu mwanzo
  rationale: ὅτι hutoa sababu, na ἀπ’ ἀρχῆς huacha “mwanzo” ukiwa na upana wake wa kimuktadha bila kuufafanua zaidi ya andiko.
- source_word: ἁμαρτάνει
  choice: amekuwa akitenda dhambi
  rationale: Wakati wa sasa pamoja na “tangu mwanzo” unaonyesha tendo la kudumu kutoka wakati uliopita hadi sasa; muundo huu wa Kiswahili unaonyesha mwendelezo huo.
- source_word: εἰς τοῦτο
  choice: kwa kusudi hili
  rationale: Kirai kinaelekeza mbele kwenye kishazi cha kusudi kinachoanza na ἵνα.
- source_word: ἐφανερώθη
  choice: alifunuliwa
  rationale: Huhifadhi hali tendwa na wazo la kudhihirishwa au kujulikana, badala ya kupunguza maana iwe kuonekana kwa macho tu.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: Mwana wa Mungu
  rationale: Ni tafsiri ya kawaida na sahihi ya cheo hiki cha Kikristo, ikihifadhi wazi uhusiano wa Mwana na Mungu.
- source_word: ἵνα λύσῃ
  choice: ili azivunje
  rationale: λύω kimsingi ni kufungua au kulegeza, na hapa ina maana ya kuvunja, kutengua, au kubatilisha kazi za Ibilisi. “Azivunje” huhifadhi taswira hiyo kwa Kiswahili cha kawaida.
- source_word: τὰ ἔργα τοῦ διαβόλου
  choice: kazi za Ibilisi
  rationale: Huhifadhi wingi na uhusiano wa umilikaji, huku “kazi” ikiwa pana vya kutosha kujumuisha matendo na matokeo yake.
theological_decisions:
- issue: Nguvu ya lugha ya wakati wa sasa kuhusu kutenda dhambi katika maadili ya Yohana
  choice: Tendo linaloendelea au lililo tabia limeonyeshwa kwa “anayeendelea kutenda dhambi” na “amekuwa akitenda dhambi.”
  alternative: Kauli kamili kuhusu tendo lolote moja la dhambi.
  rationale: Muktadha wa 1 Yohana unatambua kwamba waamini hutenda dhambi, huku hapa ukizungumzia mwenendo wenye kuendelea. Tafsiri hii huhifadhi mvutano huo badala ya kuufuta.
- issue: Maana ya “ἐκ τοῦ διαβόλου”
  choice: Chanzo au mwelekeo wa kimaadili na kiroho.
  alternative: Kutokana na Ibilisi kwa uzazi halisi.
  rationale: Lugha hii inaeleza upande au chanzo cha kiroho katika ulinganifu wa Yohana, si kwamba Ibilisi huzaa wanadamu kihalisi.
- issue: Kusudi la kufunuliwa kwa Mwana
  choice: Mwana wa Mungu alifunuliwa ili azivunje kazi za Ibilisi.
  alternative: Mwana alifunuliwa ili azifichue tu kazi za Ibilisi.
  rationale: Muundo wa ἵνα unaonyesha kusudi, na λύσῃ hapa humaanisha kuzivunja au kuzibatilisha kwa uamuzi, si kuzionyesha tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Ibilisi” na “Mwana wa Mungu” ni istilahi zinazotambulika kwa wasomaji wengi. Muundo umechaguliwa kwa uelewekevu huku hali tendwa ya ἐφανερώθη, mwendelezo wa vitenzi vya dhambi, na taswira ya λύω vikihifadhiwa.
