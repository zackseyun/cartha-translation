lexical_decisions:
- source_word: Πᾶς ὁ ποιῶν
  choice: Kila mtu anayetenda
  rationale: Kirai hiki chenye nomino-tendo ya wakati uliopo kina maana ya jumla, yaani kila mtu anayefanya jambo hilo. “Anayetenda” ni Kiswahili cha kawaida na chenye heshima, na hakifanyi kauli hiyo imhusu mwanamume pekee.
- source_word: τὴν ἁμαρτίαν
  choice: dhambi
  rationale: Nomino hii inatumika kwa maana ya jumla. Kiswahili hakihitaji kipambanuzi kinacholingana na kibainishi cha Kigiriki, hivyo “dhambi” huwasilisha maana hiyo kwa ufasaha.
- source_word: καὶ τὴν ἀνομίαν ποιεῖ
  choice: anatenda pia uasi wa sheria
  rationale: Kurudia “anatenda” kunahifadhi usambamba wa vitenzi ποιῶν na ποιεῖ. “Pia” huwasilisha καί, na “uasi wa sheria” huhifadhi uhusiano wa ἀνομία na wazo la sheria bila kuongeza sheria fulani ambayo haikutajwa wazi.
- source_word: ἀνομία
  choice: uasi wa sheria
  rationale: Hili linaonyesha hali au mwenendo wa kutotii sheria kwa makusudi na linahifadhi uzito wa neno la Kigiriki. “Kuvunja sheria” lingeweza kueleweka kwa namna nyembamba zaidi kama tendo moja tu.
- source_word: καὶ ἡ ἁμαρτία ἐστὶν ἡ ἀνομία
  choice: na dhambi ni uasi wa sheria
  rationale: Kauli hii ni ufafanuzi wa moja kwa moja. Tafsiri hiyo inadumisha ulinganisho mkali wa Yohana bila kuugeuza kuwa matokeo tu au kuingiza maelezo ya kiteolojia yasiyosemwa.
theological_decisions:
- issue: Iwapo vitenzi vya wakati uliopo vielezwe kama tendo lolote moja au kama mwenendo wa kawaida au unaoendelea
  choice: anayetenda / anatenda, huku maana ya mwenendo unaoendelea ikifafanuliwa katika tanbihi
  alternative: anayezoea kutenda / huzoea kutenda
  rationale: Wakati uliopo katika muktadha huu unaweza kuonyesha mwenendo wa kawaida au unaoendelea, lakini “anayezoea” ungeifanya maana hiyo kuwa ya wazi zaidi kuliko sarufi ya Kigiriki yenyewe. Matini kuu inabaki ya asili na tanbihi inalinda maana hiyo ya kimuktadha.
- issue: Maana ya ἀνομία katika ufafanuzi wa dhambi
  choice: uasi wa sheria
  alternative: kuvunja sheria
  rationale: “Uasi wa sheria” huhifadhi mvutano wa kileksika na kiteolojia bila kuamua kuwa Yohana anarejelea hasa sheria ya Musa, sheria za kiraia, au mfumo mwingine maalumu wa sheria.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. “Kutenda dhambi” ni usemi wa kawaida wa kibiblia usio wa kizamani sana, na “uasi wa sheria” huhifadhi uzito wa ufafanuzi wa Yohana bila kuufafanua kupita kiasi.
