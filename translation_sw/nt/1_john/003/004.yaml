  text: Kila mtu anayetenda dhambi anatenda pia uasi wa sheria[a], na dhambi ni uasi wa sheria.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Vitenzi vya Kigiriki vya wakati uliopo hapa vinaweza kuonyesha tendo linaloendelea au mwenendo wa kawaida; hivyo pia yaweza kutafsiriwa, “Kila mtu anayezoea kutenda dhambi huzoea pia kutenda uasi wa sheria.”
    reason: lexical_alternative
  - marker: b
    text: “Uasi wa sheria” hutafsiri neno la Kigiriki ἀνομία, ambalo pia laweza kutafsiriwa “kuvunja sheria” au “hali ya kutokuwa na sheria.”
