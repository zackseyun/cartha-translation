  yaml_path: translation/nt/1_john/003/020.yaml
  text: for if our heart condemns us[a], God is greater than our heart[b], and he knows all things.
translation:
  language: sw
  text: Kwa maana, ikiwa mioyo yetu inatuhukumu[a], Mungu ni mkuu kuliko mioyo yetu[b], naye anajua yote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “inatulaumu” au “inatupata na hatia.”
    reason: lexical_alternative
  - marker: b
    text: Kauli “Mungu ni mkuu kuliko mioyo yetu” inaweza kuelekeza kwenye ujuzi wake mpana zaidi wa ukweli kutuhusu, na pia kudokeza mamlaka yake juu ya kujihukumu kwetu.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: kwa maana
  rationale: Katika muktadha, ὅτι ya kwanza inatoa sababu au ufafanuzi wa kauli iliyotangulia; “kwa maana” huwasilisha kazi hiyo kwa Kiswahili cha kawaida.
- source_word: ἐὰν
  choice: ikiwa
  rationale: Pamoja na kitenzi cha hali tegemezi καταγινώσκῃ, neno hili linaanzisha hali ya masharti; “ikiwa” ni tafsiri ya moja kwa moja na ya asili.
- source_word: καταγινώσκῃ
  choice: unatuhukumu
  rationale: Kitenzi hiki kina maana ya kumtambua mtu kuwa na kosa, kumlaumu, au kumhukumu. “Unatuhukumu” huhifadhi taswira ya hukumu ya ndani bila kuigeuza καρδία moja kwa moja kuwa dhamiri.
- source_word: ἡ καρδία ἡμῶν
  choice: moyo wetu
  rationale: Tafsiri halisi na ya kawaida ya kirai hiki; “moyo” huhifadhi taswira pana ya kitovu cha maisha ya ndani badala ya kuifupisha kuwa “dhamiri.”
- source_word: ὅτι
  choice: imewasilishwa kwa mpangilio wa sentensi bila neno la pili la kuunganisha
  rationale: ὅτι ya pili inaweza kueleza msingi au maudhui ya uhakikisho. Kiswahili fasaha hakihitaji kurudia “kwa maana” kabla ya “Mungu ni mkuu,” lakini uhusiano wa kimantiki unabaki wazi.
- source_word: μείζων
  choice: mkuu kuliko
  rationale: “Mkuu kuliko” huhifadhi upana wa ulinganisho bila kuubana kuwa ukuu wa rehema, mamlaka, au ujuzi pekee.
- source_word: ὁ θεὸς
  choice: Mungu
  rationale: Hii ndiyo tafsiri sanifu ya θεός katika muktadha huu.
- source_word: τῆς καρδίας ἡμῶν
  choice: kuliko moyo wetu
  rationale: Umbo la jenitivi baada ya kivumishi cha kulinganisha huwasilishwa kiasili kwa “kuliko,” huku kurudiwa kwa “moyo wetu” kukidumisha ulinganisho wa Kigiriki.
- source_word: γινώσκει πάντα
  choice: anajua kila kitu
  rationale: Huwasilisha upeo kamili wa πάντα kwa Kiswahili cha sasa, cha asili, na chenye heshima.
theological_decisions:
- issue: Maana ya Mungu kuwa “mkuu kuliko moyo wetu”
  choice: Kauli imeachwa pana, huku sentensi inayofuata ikionyesha kwamba ujuzi wa Mungu ni muhimu katika muktadha.
  alternative: Kuifafanua moja kwa moja kuwa Mungu ni mwenye rehema zaidi kuliko dhamiri yetu, kwamba hukumu yake inabatilisha kujihukumu kwetu, au kwamba anajua ukweli wote kutuhusu kuliko tunavyojijua.
  rationale: Kigiriki hakitaji wazi eneo moja tu la ukuu wa Mungu. Kauli “anajua kila kitu” inaelekeza hasa kwenye ujuzi wake, lakini tafsiri haipaswi kuondoa uwezekano wa mamlaka yake au vipengele vingine vya ukuu huo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Moyo” umehifadhiwa badala ya “dhamiri” ili kutafsiri καρδία bila kuifasiri kupita kiasi; “naye” huunganisha kauli ya mwisho kwa mtiririko wa kawaida.
