  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ⸀μὴ θαυμάζετε, ⸀ἀδελφοί, εἰ μισεῖ ὑμᾶς ὁ κόσμος.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/013.yaml
  text: Do not be surprised[a], brothers, if the world hates you.
translation:
  language: sw
  text: Msishangae, ndugu[a], ikiwa ulimwengu unawachukia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki lililotafsiriwa “ndugu” lina umbo la wingi wa kiume, lakini hapa huenda linawaelekea waamini wote, wakiwemo wanawake.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ θαυμάζετε
  choice: Msishangae
  rationale: Kitenzi cha sasa katika hali ya kuamuru pamoja na μή kinatoa katazo. “Msishangae” ni Kiswahili cha kawaida na huwasilisha maana ya kutostaajabu bila kutumia lugha ya kizamani.
- source_word: ἀδελφοί
  choice: ndugu
  rationale: Ni wingi wa mwito wa ἀδελφός. “Ndugu” ni neno la kawaida na lenye heshima kwa jumuiya ya waamini katika Kiswahili; dokezo linaeleza kwamba umbo la Kigiriki ni la kiume lakini huenda linaihusu jumuiya yote, wakiwemo wanawake.
- source_word: εἰ
  choice: ikiwa
  rationale: “Ikiwa” huhifadhi muundo wa sharti wa εἰ na ni wa asili katika sentensi hii bila kuugeuza kuwa uhakika wa “wakati.”
- source_word: μισεῖ
  choice: unawachukia
  rationale: Wakati wa sasa unaonyesha hali ya jumla au inayoendelea. “Unawachukia” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: ὁ κόσμος
  choice: ulimwengu
  rationale: “Ulimwengu” huhifadhi upana wa istilahi ya Kiyohana bila kuingiza ufafanuzi kama “mfumo wa ulimwengu” katika matini.
theological_decisions:
- issue: Mwito wa kiume unaowakilisha kundi katika ἀδελφοί
  choice: Kutumia “ndugu” katika matini na kueleza umbo la Kigiriki katika dokezo
  alternative: ndugu wa kiume; akina ndugu
  rationale: Kiswahili “ndugu” ndilo neno la asili zaidi la mwito kwa jumuiya ya waamini. Dokezo huhifadhi taarifa kwamba Kigiriki kina umbo la kiume huku kikionyesha uwezekano mkubwa kwamba wanawake pia wanahusika.
- issue: Maana ya Kiyohana ya κόσμος
  choice: ulimwengu
  alternative: mfumo wa ulimwengu; jamii inayompinga Mungu
  rationale: “Ulimwengu” huhifadhi uzito na upana wa neno lenyewe, huku muktadha ukibeba maana ya wanadamu au mpangilio unaompinga Mungu; tafsiri haifungi maana kwa ufafanuzi mmoja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Sentensi fupi ya Kigiriki na nguvu ya katazo zimehifadhiwa.
