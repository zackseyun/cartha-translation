lexical_decisions:
- source_word: ἀγαπητοί
  choice: Wapendwa
  rationale: Ni neno la kuwaita watu wengi kwa upendo; linadumisha uhusiano wa wazi na msamiati wa upendo unaotawala katika 1 Yohana.
- source_word: ἐὰν
  choice: ikiwa
  rationale: Linatambulisha sharti pamoja na kitenzi cha hali tegemezi; “ikiwa” ni Kiswahili cha kawaida na sahihi katika muktadha huu.
- source_word: ἡ καρδία
  choice: moyo wetu
  rationale: “Moyo” huhifadhi sitiari ya chanzo kuhusu nafsi ya ndani na utambuzi wa maadili, bila kuibana maana kuwa “dhamiri” pekee.
- source_word: μὴ καταγινώσκῃ ἡμῶν
  choice: hautuhukumu
  rationale: Kitenzi kinaweza kumaanisha kutoa uamuzi dhidi ya mtu, kumlaumu, au kumtia hatiani. “Hautuhukumu” huhifadhi uzito wa kimaadili na kimahakama na kuunganika vizuri na mstari uliotangulia.
- source_word: παρρησίαν
  choice: ujasiri
  rationale: Katika uhusiano na Mungu, neno hili huonyesha uhuru wa kusema au kusimama kwa wazi bila hofu. “Ujasiri” ni wa asili katika Kiswahili na haugeuzi maana kuwa uhakika wa kihisia tu.
- source_word: πρὸς τὸν θεόν
  choice: mbele za Mungu
  rationale: Katika muundo huu, πρός huonyesha uhusiano au msimamo kuelekea Mungu. “Mbele za Mungu” ni tamko la kawaida linalofaa wazo la kuwa katika uwepo wake.
theological_decisions:
- issue: Maana ya kiungo cha ndani kinachotajwa kwa καρδία
  choice: moyo
  alternative: dhamiri
  rationale: “Moyo” huhifadhi lugha ya chanzo na upana wa nafsi ya ndani inayojipima kimaadili; “dhamiri” ingeifanya maana hiyo kuwa finyu zaidi.
- issue: Nuance ya παρρησίαν katika uhusiano na Mungu
  choice: ujasiri mbele za Mungu
  alternative: uhakika mbele za Mungu
  rationale: “Ujasiri” huonyesha hali ya kuwa wazi na bila hofu katika uwepo wa Mungu, huku ikiepuka kudai kiwango fulani cha hisia ya uhakika ambacho neno lenyewe halilazimishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni fupi na ya kawaida, huku “moyo,” “huhukumu,” na “ujasiri mbele za Mungu” vikihifadhi sitiari, uzito wa kimaadili, na mvutano wa kiteolojia wa maandishi ya Kigiriki.
