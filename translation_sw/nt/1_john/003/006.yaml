base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/006.yaml
  text: Everyone who remains in him does not sin[a]; everyone who sins has not seen him nor known him.
translation:
  language: sw
  text: Kila anayedumu ndani yake hatendi dhambi[a]; kila anayetenda dhambi hajamwona wala hajamjua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa maana ya tendo linaloendelea au tabia ya kawaida, “haendelei kutenda dhambi; kila anayeendelea kutenda dhambi.” Maumbo ya wakati uliopo katika Kigiriki yanaweza kueleweka kwa namna hiyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ὁ
  choice: Kila anaye-
  rationale: Muundo huu una maana ya kijumla na unamhusu mtu yeyote aliye katika hali inayotajwa; “kila anaye-” ni wa kawaida na huhifadhi nguvu ya ujumla.
- source_word: ἐν αὐτῷ μένων
  choice: anayekaa ndani yake
  rationale: Kitenzi μένω kinaonyesha kuendelea kukaa au kudumu katika uhusiano. “Kukaa ndani yake” huhifadhi lugha ya asili ya uhusiano bila kuifafanua kupita kiasi.
- source_word: οὐχ ἁμαρτάνει
  choice: hatendi dhambi[a]
  rationale: Hili ni tamko la moja kwa moja linalofuata umbo la Kigiriki. Tanbihi huhifadhi uwezekano wa kuelewa wakati uliopo kama tendo linaloendelea au tabia ya kawaida.
- source_word: ὁ ἁμαρτάνων
  choice: anayetenda dhambi
  rationale: Kirai hiki kinalingana na “hatendi dhambi” na huhifadhi uwiano wa sentensi. Uwezekano wa maana ya tendo linaloendelea umeelezwa katika tanbihi.
- source_word: οὐχ ἑώρακεν
  choice: hajamwona
  rationale: Wakati timilifu wa Kigiriki unaonyesha hali ya sasa inayotokana na kutomwona; “hajamwona” huwasilisha hilo kwa Kiswahili cha kawaida.
- source_word: οὐδὲ ἔγνωκεν
  choice: wala hajamjua
  rationale: “Kumjua” linaweza kuonyesha ufahamu wa kiuhusiano, si taarifa ya kiakili tu. “Wala” huonyesha uhusiano wa kukanusha wa οὐδέ.
- source_word: αὐτῷ / αὐτόν
  choice: yake / -m-
  rationale: Viwakilishi vya Kigiriki havimtaji mhusika kwa jina. Kiswahili kinahifadhi viwakilishi hivyo badala ya kuamua wazi kuwa ni Mungu, Mwana, au Kristo.
theological_decisions:
- issue: Ikiwa mstari unafundisha kwamba waamini hawawezi kamwe kutenda dhambi
  choice: Maneno ya moja kwa moja “hatendi dhambi” na “anayетenda dhambi” yamehifadhiwa, huku tanbihi ikieleza maana inayowezekana ya tendo linaloendelea au tabia ya kudumu.
  alternative: “Haendelei kutenda dhambi ... anayeendelea kutenda dhambi.”
  rationale: Kigiriki hakina neno tofauti linalomaanisha moja kwa moja “kuendelea,” ingawa maumbo ya wakati uliopo yanaweza kuwa na maana hiyo katika muktadha. Tanbihi huhifadhi utata na mvutano na 1 Yohana 1:8–2:2 bila kulegeza dai la kimaadili.
- issue: Mhusika anayerejelewa na “yeye”
  choice: Mhusika hakutajwa wazi; viwakilishi vimehifadhiwa.
  alternative: Kumtaja wazi kuwa Mungu, Mwana, au Kristo.
  rationale: Andiko la Kigiriki linatumia viwakilishi, na muktadha mpana unazungumzia Baba na Mwana. Kutomtaja mhusika kwa jina huepuka kuamua jambo ambalo mstari wenyewe haujaweka wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. “Anayekaa ndani yake” huhifadhi tamathali muhimu ya Yohana bila kutumia lugha ya kizamani.
