source:
  edition: SBLGNT
  text: ἴδετε ποταπὴν ἀγάπην δέδωκεν ἡμῖν ὁ πατὴρ ἵνα τέκνα θεοῦ κληθῶμεν, ⸂καὶ ἐσμέν⸃. διὰ τοῦτο ὁ κόσμος οὐ γινώσκει ⸀ἡμᾶς ὅτι οὐκ ἔγνω αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/001.yaml
  text: See what kind of love the Father has given to us[a], that we should be called children of God—and we are. For this reason the world does not know us[e][d][c][b], because it did not know him.
translation:
  language: sw
  text: Tazameni ni upendo wa namna gani Baba ametupa[a], ili tuitwe watoto wa Mungu—na ndivyo tulivyo.[b] Kwa sababu hiyo, ulimwengu hautujui[c], kwa kuwa haukumjua yeye.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Tazameni ni upendo wa aina gani Baba ametupa.” Kigiriki kinastaajabia namna au ubora wa upendo huo, si ukubwa wake tu.
    reason: lexical_alternative
  - marker: b
    text: Baadhi ya hati hazina maneno “na ndivyo tulivyo.”
    reason: textual_variant
  - marker: c
    text: Au “ulimwengu haututambui.”
    reason: lexical_alternative
  - marker: d
    text: “Yeye” hapa kwa kawaida hueleweka kuwa Baba; wengine huelewa kuwa ni Kristo kwa kuzingatia muktadha mpana wa maandishi ya Yohana.
    reason: alternative_reading
lexical_decisions:
- source_word: ἴδετε
  choice: Tazameni
  rationale: Amri ya wingi inayovuta fikira za wasomaji; ni ya asili na yenye heshima katika Kiswahili cha sasa.
- source_word: ποταπὴν ἀγάπην δέδωκεν ἡμῖν
  choice: jinsi Baba alivyotupenda
  rationale: Kiswahili hiki cha kawaida huonyesha kwa mshangao namna na ubora wa upendo wa Baba. Ingawa muundo halisi ni ‘ametupa upendo wa namna gani,’ tafsiri ya neno kwa neno ingekuwa nzito; dokezo linahifadhi uwezekano huo.
- source_word: ὁ πατὴρ
  choice: Baba
  rationale: Ni cheo kinachomtaja Mungu katika muktadha huu; herufi kubwa inaonyesha rejeleo hilo.
- source_word: ἵνα τέκνα θεοῦ κληθῶμεν
  choice: hata tukaitwa watoto wa Mungu
  rationale: ‘Hata’ huwasilisha matokeo ya ajabu ya upendo huo, huku ‘watoto’ ikihifadhi maana jumuishi ya τέκνα.
- source_word: καὶ ἐσμέν
  choice: na ndivyo tulivyo
  rationale: Huhifadhi uthibitisho wenye mkazo kwamba si jina tu bali hali halisi.
- source_word: διὰ τοῦτο
  choice: Kwa sababu hiyo
  rationale: Huunganisha kwa uwazi sababu na yaliyotangulia.
- source_word: ὁ κόσμος
  choice: ulimwengu
  rationale: Huhifadhi istilahi ya Kiyohane bila kuifasiri moja kwa moja kuwa jamii ya wanadamu iliyo kinyume na Mungu.
- source_word: οὐ γινώσκει ἡμᾶς
  choice: hautujui
  rationale: Ni ulinganifu wa moja kwa moja na ‘haukumjua’; maana mbadala ya ‘haututambui’ imehifadhiwa katika dokezo.
- source_word: ὅτι οὐκ ἔγνω αὐτόν
  choice: kwa kuwa haukumjua yeye
  rationale: Huonyesha uhusiano wa kisababu. ‘Yeye’ huhifadhi kwa kiasi fulani utata wa kiwakilishi cha Kigiriki.
theological_decisions:
- issue: Rejeleo la αὐτόν
  choice: ‘yeye’ linaelekea kumrejelea Baba
  alternative: Linaweza kueleweka kuwa linamrejelea Kristo katika muktadha mpana wa maandishi ya Yohana.
  rationale: Baba ndiye rejeleo la wazi lililo karibu zaidi katika mstari huu, lakini kiwakilishi cha Kigiriki chenyewe hakitaji jina; dokezo linahifadhi uwezekano wa kikristo bila kuamua zaidi ya ushahidi.
- issue: Kuwapo kwa καὶ ἐσμέν
  choice: Kujumuisha ‘na ndivyo tulivyo’ katika matini kuu
  alternative: Baadhi ya hati huliacha fungu hilo.
  rationale: SBLGNT inalijumuisha, na fungu hilo linasisitiza uhalisi wa kuwa watoto wa Mungu; tofauti ya hati imeandikwa katika dokezo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo ‘jinsi Baba alivyotupenda’ umechaguliwa kwa ufasaha, huku umbo la karibu zaidi na Kigiriki likihifadhiwa katika dokezo.
