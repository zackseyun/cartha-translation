lexical_decisions:
- source_word: ἐν τούτῳ
  choice: Kwa hili
  rationale: Huhifadhi nguvu ya kielezi cha Kigiriki na kueleza msingi au njia ya kujua, kwa Kiswahili cha kawaida.
- source_word: γνωσόμεθα
  choice: tutajua
  rationale: Ni tafsiri ya moja kwa moja ya hali ya wakati ujao bila kuongeza dhana ya kuanza kujua.
- source_word: ἐκ τῆς ἀληθείας ἐσμέν
  choice: sisi tunatokana na kweli
  rationale: Huhifadhi wazo la chanzo au asili linalobebwa na ἐκ bila kulifafanua kuwa dai pana zaidi la kimafundisho.
- source_word: ἀληθείας
  choice: kweli
  rationale: Ni tafsiri ya kawaida ya ἀλήθεια na inaacha uzito wake wa kiteolojia bila kuupanua.
- source_word: ἔμπροσθεν αὐτοῦ
  choice: mbele zake
  rationale: Ni usemi wa asili wa Kiswahili unaohifadhi maana ya kuwa mbele au katika uwepo wake.
- source_word: πείσομεν
  choice: tutaituliza
  rationale: Katika muktadha wa moyo mbele za Mungu, kitenzi kinaweza kueleza kuuhakikishia au kuutuliza moyo; uchaguzi huu ni wa asili kwa Kiswahili lakini mbadala wa karibu zaidi na umbo la kitenzi umewekwa katika tanbihi.
- source_word: τὴν καρδίαν ἡμῶν
  choice: mioyo yetu
  rationale: Wingi wa kugawanya ni wa kawaida katika Kiswahili kwa mhusika wa wingi, ingawa Kigiriki kina nomino ya umoja.
theological_decisions:
- issue: Maana ya ἐκ τῆς ἀληθείας katika teolojia ya Yohana
  choice: tunatokana na kweli
  alternative: tu wa kweli; sisi ni wa kweli
  rationale: Tafsiri inahifadhi lugha ya chanzo au asili bila kuamua kimya kimya kwamba kifungu kinamaanisha tu umiliki, ushirika wa kidini, au hadhi fulani mbele za Mungu.
- issue: Maana ya πείσομεν inapohusishwa na moyo
  choice: tutaituliza mioyo yetu
  alternative: tutaisadikisha mioyo yetu; tutaihakikishia mioyo yetu
  rationale: Muktadha unaelekea kwenye utulivu wa ndani mbele za Mungu, lakini tanbihi inadumisha uwezekano wa maana ya moja kwa moja zaidi ya kusadikisha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Kwa hili” na “mbele zake” ni vifupi na vya asili. Wingi “mioyo yetu” umetumiwa kwa ufasaha wa Kiswahili, huku umoja wa Kigiriki ukitajwa katika tanbihi.
