review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately retains the repeated Johannine verb μένει as “hukaa,” preserves the pronoun-based referents rather than inserting “Mungu,” and renders ἐκ τοῦ πνεύματος with a viable source/basis sense. However, “Roho ambaye alitupa” makes Roho grammatically the giver (“the Spirit who gave us”), whereas Greek has Roho as the one given. The relative construction must mark Roho as the object: “Roho aliyotupa.”'
  naturalness: The register is standard, clear East African Swahili. “Kwa hili tunajua” is acceptable Johannine-style formal prose, and the repeated “hukaa” appropriately preserves the deliberate repetition of the Greek. Recasting the opening as “Na yule...” is slightly smoother while retaining the meaning.
  terminology: “Amri,” “hukaa,” and capitalized “Roho” are appropriate and consistent. “Roho aliyotupa” is the idiomatic and grammatically correct form for “the Spirit whom he gave to us”; it does not require adding “Mungu.”
  issues:
  - severity: high
    issue: The relative clause “Roho ambaye alitupa” assigns the action of giving to the Spirit.
    rationale: 'In Swahili, “ambaye” marks Roho as the subject of “alitupa.” In Greek, οὗ is the object of ἔδωκεν: God/he gave the Spirit to us. “Aliyotupa” marks the class-9 noun Roho as the relative object and retains the unstated subject represented by Greek αὐτός.'
  revised_text: 'Na yule anayeshika amri zake hukaa ndani yake, naye yeye hukaa ndani yake. Kwa hili tunajua kwamba yeye hukaa ndani yetu: kutokana na Roho aliyotupa.[a]'
  revised_footnotes:
  - marker: a
    text: Au, “kwa njia ya Roho aliyotupa.” Kihusishi cha Kigiriki kinaweza kuonyesha chanzo au msingi, na pia njia ambayo kupitia hiyo tunajua.
    reason: lexical_alternative
  revision_rationale: 'Revision is required solely to correct the grammatical direction of the final relative clause: the Spirit is given to us, not the giver. The revised wording preserves the Greek pronoun ambiguity, the aorist sense of ἔδωκεν, and the source/basis nuance of ἐκ.'
