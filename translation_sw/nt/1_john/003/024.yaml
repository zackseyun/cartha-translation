  to: 'Na yule anayeshika amri zake hukaa ndani yake, naye yeye hukaa ndani yake. Kwa hili tunajua kwamba yeye hukaa ndani yetu: kutokana na Roho aliyotupa.[a]'
  rationale: 'Revision is required solely to correct the grammatical direction of the final relative clause: the Spirit is given to us, not the giver. The revised wording preserves the Greek pronoun ambiguity, the aorist sense of ἔδωκεν, and the source/basis nuance of ἐκ.'
  reviewer_model: gpt-5.6-terra
