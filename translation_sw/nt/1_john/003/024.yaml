  text: καὶ ὁ τηρῶν τὰς ἐντολὰς αὐτοῦ ἐν αὐτῷ μένει καὶ αὐτὸς ἐν αὐτῷ· καὶ ἐν τούτῳ γινώσκομεν ὅτι μένει ἐν ἡμῖν, ἐκ τοῦ πνεύματος οὗ ἡμῖν ἔδωκεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/024.yaml
  text: 'And the one who keeps his commandments remains in him[a], and he in him[b]. And by this we know that he remains in us: by the Spirit whom he gave to us.'
translation:
  language: sw
  text: 'Na yule anayeshika amri zake hukaa ndani yake, naye yeye hukaa ndani yake. Kwa hili tunajua kwamba yeye hukaa ndani yetu: kutokana na Roho aliyotupa.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa njia ya Roho aliyotupa.” Kihusishi cha Kigiriki kinaweza kuonyesha chanzo au msingi, na pia njia ambayo kupitia hiyo tunajua.
    reason: lexical_alternative
lexical_decisions:
- source_word: τηρῶν
  choice: anayeshika
  rationale: ‘Kushika amri’ ni usemi wa kawaida wa Kiswahili unaojumuisha kuzitii na kuzihifadhi kwa uaminifu, huku ukidumisha taswira ya τηρέω.
- source_word: ἐντολάς
  choice: amri
  rationale: ‘Amri’ ni neno la kawaida na lenye uzito wa kimaadili kwa ἐντολή katika muktadha huu.
- source_word: μένει
  choice: hukaa
  rationale: ‘Hukaa’ linaeleza hali inayoendelea ya kuwa na kudumu katika uhusiano; limetumiwa kwa uthabiti katika matukio yote matatu ya kitenzi hiki.
- source_word: ἐν αὐτῷ
  choice: ndani yake
  rationale: Huhifadhi kiwakilishi cha Kigiriki badala ya kutaja ‘Mungu,’ hivyo halitatui kimya kimya utata wa rejeleo.
- source_word: ἐν τούτῳ γινώσκομεν
  choice: Kwa hili tunajua
  rationale: Usemi huu wa asili unaonyesha msingi au njia ya kujua bila kufafanua kupita maandishi.
- source_word: ἐκ τοῦ πνεύματος
  choice: kutokana na Roho
  rationale: ‘Kutokana na’ huhifadhi hasa wazo la chanzo au msingi katika ἐκ; uwezekano wa maana ya njia umeonyeshwa katika tanbihi.
- source_word: πνεύματος
  choice: Roho
  rationale: Muktadha wa Roho aliyetolewa na Mungu unaelekeza kwa Roho Mtakatifu; herufi kubwa inaonyesha rejeleo hilo bila kuongeza kivumishi kisichopo hapa.
- source_word: οὗ ἡμῖν ἔδωκεν
  choice: ambaye alitupa
  rationale: ‘Ambaye’ humrejelea Roho kama nafsi, na ‘alitupa’ hudumisha tendo la wakati uliopita la ἔδωκεν kwa mpangilio wa asili unaoeleweka katika Kiswahili.
theological_decisions:
- issue: Rejeleo la viwakilishi αὐτῷ / αὐτός / μένει ἐν ἡμῖν
  choice: Viwakilishi vimehifadhiwa kama ‘yake/yeye’ bila kubadilishwa kuwa ‘Mungu.’
  alternative: Kutaja ‘Mungu’ wazi katika kila sehemu.
  rationale: Muktadha unaelekeza kwa Mungu, lakini Kigiriki kinatumia viwakilishi. Kuvihifadhi kunadumisha mvutano na uwezekano wa uhusiano wa sentensi na Kristo katika teolojia pana ya Yohana.
- issue: Utambulisho wa πνεῦμα
  choice: ‘Roho’ kwa herufi kubwa, ikirejelea Roho Mtakatifu.
  alternative: ‘roho’ kwa herufi ndogo.
  rationale: Kauli kwamba Mungu alimtoa kwa waamini na muktadha wa Kiyohana vinaunga mkono rejeleo la Roho wa Mungu.
- issue: Nguvu ya ἐκ katika ἐκ τοῦ πνεύματος
  choice: ‘kutokana na Roho,’ ikisisitiza chanzo au msingi wa kujua.
  alternative: ‘kwa njia ya Roho,’ ikisisitiza chombo au njia.
  rationale: ἐκ inaweza kuonyesha chanzo au msingi, huku katika muktadha huu pia ikikaribia maana ya njia ya utambuzi; tanbihi inahifadhi uwezekano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Urudiaji wa ‘hukaa’ umehifadhiwa kwa sababu ni neno kuu la Kiyohana katika mstari huu. Muundo wa viwakilishi umeachwa kwa makusudi bila kutaja majina ya wahusika ambayo hayapo katika Kigiriki.
