source:
  edition: SBLGNT
  text: ὃς δ’ ἂν ἔχῃ τὸν βίον τοῦ κόσμου καὶ θεωρῇ τὸν ἀδελφὸν αὐτοῦ χρείαν ἔχοντα καὶ κλείσῃ τὰ σπλάγχνα αὐτοῦ ἀπ’ αὐτοῦ, πῶς ἡ ἀγάπη τοῦ θεοῦ μένει ἐν αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/017.yaml
  text: But whoever has the world's goods and sees his brother in need[c][b][a], yet closes his heart against him—how does the love of God remain in him?
translation:
  language: sw
  text: Lakini mtu yeyote aliye na mali za dunia hii, akimwona ndugu yake[a] akiwa na uhitaji, naye akamfunga moyo wake asimhurumie[b], upendo wa Mungu[c] unawezaje kukaa ndani yake?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ndugu, mwanamume au mwanamke”; Kigiriki hutumia neno “ndugu” katika umbo la kiume, ambalo linaweza kumrejelea muumini mwenzake.
    reason: lexical_alternative
  - marker: b
    text: Au “akamnyima huruma yake”; kihalisi, “akafunga sehemu zake za ndani dhidi yake,” nahau ya kuzuia huruma ya moyoni kwa mtu huyo.
    reason: lexical_alternative
  - marker: c
    text: “Upendo wa Mungu” unaweza kumaanisha upendo wa Mungu uliomo ndani yake au upendo wake kwa Mungu.
    reason: alternative_reading
lexical_decisions:
- source_word: βίον τοῦ κόσμου
  choice: mali za dunia hii
  rationale: Katika muktadha huu βίος ina maana ya rasilimali au mali za kumwezesha mtu kuishi, si uhai kwa maana ya jumla. Kauli hii ya Kiswahili inaeleweka kwa urahisi na inaonyesha mali za kimwili.
- source_word: θεωρῇ
  choice: akamwona
  rationale: Kitenzi hiki kinaonyesha kuona au kutazama kwa ufahamu. “Akamwona” ni cha kawaida na kinaonyesha kwamba mtu huyo ametambua hali ya ndugu yake.
- source_word: ἀδελφὸν
  choice: ndugu yake
  rationale: Neno la Kigiriki ni la jinsia ya kiume katika umoja. “Ndugu yake” huhifadhi umbo hilo, huku tanbihi ikieleza kwamba linaweza kumwakilisha muumini mwenzake, mwanamume au mwanamke.
- source_word: χρείαν ἔχοντα
  choice: akiwa na uhitaji
  rationale: Hii ni tafsiri ya asili na ya moja kwa moja ya kishazi chenye maana ya kuwa na hitaji au kukosa mahitaji ya lazima.
- source_word: κλείσῃ τὰ σπλάγχνα αὐτοῦ ἀπ’ αὐτοῦ
  choice: akamfungia moyo wake
  rationale: Kigiriki hutumia taswira ya kufunga sehemu za ndani za mwili, yaani kuzuia huruma ya moyoni. Kauli hii huhifadhi taswira ya kufunga moyo kwa lugha ya kawaida ya Kiswahili.
- source_word: πῶς
  choice: unakaaje
  rationale: Hili huhifadhi swali la balagha la Kigiriki bila kuongeza moja kwa moja neno lenye maana ya kutowezekana.
- source_word: ἡ ἀγάπη τοῦ θεοῦ
  choice: upendo wa Mungu
  rationale: 'Muundo huu huhifadhi utata wa kisarufi: unaweza kueleweka kuwa upendo wa Mungu uliomo ndani ya mtu au upendo wa mtu kwa Mungu.'
- source_word: μένει ἐν αὐτῷ
  choice: unakaa ndani yake
  rationale: μένω ni neno muhimu katika maandishi ya Yohana lenye maana ya kukaa, kudumu, au kubaki. “Unakaa ndani yake” ni la asili na huhifadhi wazo la uwepo unaoendelea.
theological_decisions:
- issue: Maana ya ἡ ἀγάπη τοῦ θεοῦ
  choice: upendo wa Mungu
  alternative: upendo wa Mungu kwake; upendo wake kwa Mungu
  rationale: Kirai cha Kigiriki kinaweza kueleweka kwa njia zote mbili. Tafsiri haichagui moja na kuondoa nyingine, bali huhifadhi mvutano huo wa kiteolojia.
- issue: Uwakilishi wa jinsia katika ἀδελφὸν
  choice: ndugu yake
  alternative: ndugu yake wa kiume au wa kike; muumini mwenzake
  rationale: Neno la chanzo ni la jinsia ya kiume katika umoja. Maana yake pana katika jumuiya ya waumini inaelezwa katika tanbihi bila kubadili umbo la neno katika matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi huhifadhi muundo wa swali la balagha na taswira ya kufunga moyo, huku tanbihi zikifafanua nahau na utata wa kirai bila kuutatua kimadhehebu.
