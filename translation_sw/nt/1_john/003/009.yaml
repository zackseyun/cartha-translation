review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the universal perfect-participle construction, the continuing sense reasonably conveyed by the Greek presents in context, and retains the deliberately unspecified seed metaphor. However, “kuzaliwa na Mungu” can primarily suggest divine agency in Swahili, whereas ἐκ τοῦ θεοῦ marks origin/source. “kutoka kwa Mungu” states this source relation more faithfully and naturally.
  naturalness: The sentence is fluent Standard East African Swahili. Repeating “kutoka kwa Mungu” is clear and idiomatic in this Johannine new-birth context. “Haendelei kutenda dhambi” and “hawezi kuendelea kutenda dhambi” are natural renderings of the contextual ongoing sense.
  terminology: “Dhambi,” “mbegu,” and “kutenda dhambi” are appropriate biblical and contemporary Swahili terms. The metaphor “mbegu yake” is rightly not doctrinally interpreted. The formal alternative in the second note correctly preserves the more literal, potentially absolute wording.
  issues:
  - severity: medium
    issue: “aliyezaliwa na Mungu” for ἐκ τοῦ θεοῦ
    rationale: Although familiar in some church usage, na normally marks accompaniment or agency. The Greek preposition ἐκ explicitly presents God as the source/origin of the birth. “aliyezaliwa kutoka kwa Mungu” more directly preserves that relation without adding interpretation.
