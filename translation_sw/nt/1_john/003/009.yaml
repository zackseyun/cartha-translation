source:
  edition: SBLGNT
  text: πᾶς ὁ γεγεννημένος ἐκ τοῦ θεοῦ ἁμαρτίαν οὐ ποιεῖ, ὅτι σπέρμα αὐτοῦ ἐν αὐτῷ μένει, καὶ οὐ δύναται ἁμαρτάνειν, ὅτι ἐκ τοῦ θεοῦ γεγέννηται.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/009.yaml
  text: Everyone who has been born of God does not practice sin[a], because his seed remains in him; and he is not able to keep sinning[c][b], because he has been born of God.
translation:
  language: sw
  text: Kila mtu aliyezaliwa kutoka kwa Mungu haendelei kutenda dhambi[a], kwa sababu mbegu yake inakaa ndani yake; naye hawezi kuendelea kutenda dhambi[b], kwa sababu amezaliwa kutoka kwa Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata muundo wa maneno kwa karibu zaidi, “hatendi dhambi.” Katika muktadha, maneno ya Kigiriki yanaelekea kumaanisha kuendelea kutenda dhambi au kuwa na mazoea ya dhambi, badala ya tendo moja tu.
    reason: lexical_alternative
  - marker: b
    text: Kwa tafsiri ya moja kwa moja zaidi, “hawezi kutenda dhambi.” Katika muktadha, kitenzi cha Kigiriki kinaweza kuwa na maana ya “hawezi kuendelea kutenda dhambi.”
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶς ὁ γεγεννημένος
  choice: Kila mtu aliyezaliwa
  rationale: Kauli hii inaonyesha kundi lote kwa ujumla, huku ‘aliyezaliwa’ ikihifadhi hali inayotokana na tendo lililokwisha kutokea.
- source_word: ἐκ τοῦ θεοῦ
  choice: na Mungu
  rationale: Katika Kiswahili, ‘kuzaliwa na Mungu’ huonyesha kwamba Mungu ndiye asili na mtendaji wa kuzaliwa huku kwa njia ya kawaida na inayoeleweka.
- source_word: ἁμαρτίαν οὐ ποιεῖ
  choice: haendelei kutenda dhambi
  rationale: Muundo wa Kigiriki unaelekea kueleza mwenendo unaoendelea au wa kawaida, si lazima tendo moja la dhambi. Tafsiri hii inaweka wazi maana hiyo bila kufuta mbadala wa kisarufi ulio katika tanbihi.
- source_word: σπέρμα αὐτοῦ
  choice: mbegu yake
  rationale: Neno halisi ni ‘mbegu.’ Taswira imehifadhiwa kwa sababu rejeleo lake hasa—kama ni neno la Mungu, uzima wake, au kanuni yake ya kuzaa—halijaelezwa wazi katika mstari.
- source_word: ἐν αὐτῷ μένει
  choice: inakaa ndani yake
  rationale: ‘Inakaa’ ni Kiswahili cha sasa na cha kawaida kinachohifadhi wazo la kuendelea kuwapo ndani ya mtu.
- source_word: οὐ δύναται ἁμαρτάνειν
  choice: hawezi kuendelea kutenda dhambi
  rationale: Kitenzi-jina cha wakati wa sasa kinaweza kuonyesha tendo linaloendelea. ‘Kuendelea kutenda dhambi’ huwasilisha uwezekano huo wa kimuktadha bila kudai kwamba mtu hawezi kamwe kufanya tendo moja la dhambi.
- source_word: γεγέννηται
  choice: amezaliwa
  rationale: Kauli hii inaonyesha tendo lililokamilika lenye matokeo yanayoendelea; ‘amezaliwa’ hulifikisha hilo kwa kawaida katika Kiswahili.
theological_decisions:
- issue: Je, mstari unafundisha kutokuwa na dhambi kabisa au kutopatana kwa kuzaliwa na Mungu na mwenendo unaoendelea wa dhambi?
  choice: Matini kuu inasema kwamba aliyezaliwa na Mungu haendelei kutenda dhambi kama mwenendo.
  alternative: Hawezi kufanya dhambi yoyote hata mara moja.
  rationale: Vitenzi vya wakati wa sasa katika muktadha vinaweza kueleza tendo la kawaida au linaloendelea. Tafsiri hii huhifadhi mvutano na 1 Yohana 1:8–2:1; maana rasmi zaidi imehifadhiwa katika tanbihi badala ya kufutwa.
- issue: Maana ya ‘mbegu yake’
  choice: Taswira ya ‘mbegu’ imehifadhiwa bila kufasiriwa.
  alternative: Neno la Mungu, uzima wa Mungu, au asili ya Mungu.
  rationale: Mstari wenyewe hautaji wazi mbegu hiyo ni nini, hivyo tafsiri haipaswi kuingiza ufafanuzi wa kiteolojia usiotajwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. ‘Mbegu yake’ imehifadhiwa kama sitiari yenye utata wa kimakusudi; ‘inakaa ndani yake’ ni ya kawaida kuliko ‘inadumu ndani yake’ na bado huhifadhi maana ya μένω.
