base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/010.yaml
  text: 'By this the children of God and the children of the devil are evident: everyone who does not practice righteousness is not from God[c][b][a], nor is the one who does not love his brother.'
translation:
  language: sw
  text: 'Kwa hili[a] watoto wa Mungu na watoto wa Ibilisi wanajulikana wazi: kila mtu asiyetenda haki[b] hatokani na Mungu, wala yule asiyempenda ndugu yake.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Katika hili” au “Kutokana na hili.” Kirai cha Kiyunani kinaweza kuonyesha msingi ambao kwayo tofauti hii inatambuliwa.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiyunani linaweza kumaanisha “haki” au “uadilifu”; hapa linahusu mwenendo ulio sawa.
    reason: lexical_alternative
  - marker: c
    text: Kiyunani kinasema “ndugu yake” kwa umbo la kiume la umoja; katika muktadha neno hilo linaweza kumaanisha mwamini mwenzake, wa kiume au wa kike.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: Kwa hili
  rationale: Kirai hiki kinaonyesha msingi au njia ambayo tofauti hiyo inatambuliwa. “Kwa hili” ni Kiswahili cha kawaida kinachohifadhi nguvu ya kiashiria bila kuamua kupita kiasi kati ya “katika hili” na “kutokana na hili.”
- source_word: φανερά ἐστιν
  choice: wanadhihirika
  rationale: Kivumishi cha Kiyunani kina maana ya kuwa wazi au kutambulika. “Wanadhihirika” kinaeleza kwamba utambulisho wa makundi hayo unaonekana kwa dalili zinazofuata.
- source_word: τὰ τέκνα
  choice: watoto
  rationale: Neno hili linaonyesha uhusiano wa kifamilia. “Watoto” linahifadhi taswira ya Yohana ya kuwa wa Mungu au wa Ibilisi badala ya kuibadili kuwa kauli ya jumla kuhusu watu.
- source_word: τοῦ διαβόλου
  choice: wa Ibilisi
  rationale: Hapa διάβολος ni jina la kawaida la adui huyo binafsi, si maelezo ya jumla ya mchongezi.
- source_word: πᾶς ὁ μὴ ποιῶν δικαιοσύνην
  choice: kila mtu asiyetenda haki
  rationale: Muundo wa wakati uliopo unaeleza mwenendo wa kawaida, si tendo moja tu. Katika Kiswahili, “asiyetenda haki” kwa kawaida huonyesha tabia au mwenendo huo unaoendelea.
- source_word: οὐκ ἔστιν ἐκ τοῦ θεοῦ
  choice: hatokani na Mungu
  rationale: ἐκ inaonyesha chimbuko au uhusiano wa kuwa upande wa Mungu. “Hatokani na Mungu” ni ya asili na inadumisha lugha ya chanzo bila kuongeza mfumo wa mafundisho.
- source_word: ὁ μὴ ἀγαπῶν τὸν ἀδελφὸν αὐτοῦ
  choice: yule asiyempenda ndugu yake
  rationale: Muundo sambamba wa kishiriki umehifadhiwa kwa “yule asiyempenda.” “Ndugu yake” ni usemi wa kawaida wa Kiswahili; tanbihi inaeleza jinsia ya umbo la Kiyunani na maana pana inayowezekana katika muktadha.
- source_word: καὶ
  choice: wala
  rationale: Baada ya kauli hasi, “wala” linaunganisha kwa kawaida kifungu cha pili na kurudisha kimya kimya wazo la “hatokani na Mungu.”
theological_decisions:
- issue: Lugha ya kifamilia kuhusu utambulisho wa kiroho na kimaadili
  choice: watoto wa Mungu na watoto wa Ibilisi
  alternative: watu walio wa Mungu na watu walio wa Ibilisi
  rationale: Kiyunani kinatumia wazi lugha ya watoto. Kuihifadhi kunadumisha taswira na mvutano wa kiteolojia wa Yohana bila kuilegeza kuwa maelezo ya jumla ya kuwa upande fulani.
- issue: Maana ya δικαιοσύνη katika muktadha wa kimaadili
  choice: haki
  alternative: uadilifu
  rationale: “Haki” ni neno pana la kawaida linaloweza kueleza mwenendo ulio sawa mbele za Mungu na pia haki kwa maana ya kutenda kwa usawa. Muktadha huu unasisitiza mwenendo mwema, lakini upana wa neno la Kiyunani haujafutwa.
- issue: Neno la jinsia ἀδελφός
  choice: ndugu yake
  alternative: ndugu yake wa kiume; mwamini mwenzake
  rationale: Kiyunani kina umbo la kiume la umoja, lakini “ndugu” la Kiswahili halibainishi jinsia bila nyongeza isiyo ya asili. Maandishi makuu yanabaki ya kawaida na tanbihi inahifadhi taarifa ya kisarufi pamoja na uwezekano wa rejeo pana kwa mwamini mwenzao.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi umehifadhi ulinganifu wa vifungu viwili hasi, huku “wala” likifanya kiunganishi hicho kuwa cha asili katika Kiswahili.
