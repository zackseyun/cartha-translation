  text: ⸀Τεκνία, μὴ ἀγαπῶμεν λόγῳ μηδὲ τῇ γλώσσῃ ἀλλὰ ἐν ἔργῳ καὶ ἀληθείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/018.yaml
  text: Little children[a], let us not love in word or with the tongue[b], but in deed and truth.
translation:
  language: sw
  text: Watoto wadogo, tusipende kwa neno wala kwa ulimi[a], bali kwa tendo na kweli[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wala kwa usemi”; Kigiriki kihalisi, “wala kwa ulimi.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa matendo na kwa kweli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τεκνία
  choice: Watoto wadogo
  rationale: Nomino hii ya wito ni wingi wa τεκνίον na hapa imetumiwa kwa upendo. “Watoto wadogo” huhifadhi picha ya kifamilia na upole wa usemi bila kuongeza kimilikishi kama “wangu” ambacho hakipo katika Kigiriki.
- source_word: μὴ ἀγαπῶμεν
  choice: tusipende
  rationale: Muundo wa subjunktivu wa nafsi ya kwanza wingi pamoja na μή ni himizo hasi. “Tusipende” ni njia ya kawaida na fupi ya kuwasilisha himizo hilo katika Kiswahili.
- source_word: λόγῳ
  choice: kwa neno
  rationale: λόγος hapa inahusu usemi wa maneno. Umoja “neno” huhifadhi umbo la chanzo na usambamba wake na “tendo,” ingawa maana yake ni kupenda kwa kusema tu.
- source_word: μηδὲ τῇ γλώσσῃ
  choice: wala kwa ulimi
  rationale: γλῶσσα maana yake ya moja kwa moja ni “ulimi” na hapa ni sitiari ya usemi. Tafsiri hii huhifadhi picha halisi na msisitizo wa kurudia unaopatikana katika chanzo.
- source_word: ἀλλὰ
  choice: bali
  rationale: “Bali” huonyesha kwa wazi tofauti kali kati ya upendo wa maneno tu na upendo unaotekelezwa.
- source_word: ἐν ἔργῳ
  choice: kwa tendo
  rationale: ἔργον inaweza kumaanisha tendo, kazi, au kitendo. “Kwa tendo” huhifadhi umoja wa chanzo na huunda usambamba wa moja kwa moja na “kwa neno.”
- source_word: καὶ ἀληθείᾳ
  choice: na kweli
  rationale: ἀλήθεια ni “kweli.” Tafsiri hii huhifadhi upeo wa maana wa Yohana badala ya kuufupisha kuwa “unyofu” au “uaminifu wa moyo” pekee.
theological_decisions:
- issue: Maana ya ἀληθείᾳ katika kishazi ἐν ἔργῳ καὶ ἀληθείᾳ
  choice: na kweli
  alternative: na kwa unyofu / na kwa uhalisi
  rationale: '“Kweli” huhifadhi uwezekano wa maana mbili zinazohusiana: upendo wa kweli unaodhihirishwa kwa tendo, na upendo unaopatana na kweli ya Mungu. Tafsiri ya “unyofu” ingefinya maana iwe hali ya ndani tu.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Usambamba wa “kwa neno … kwa tendo” na picha ya “ulimi” umehifadhiwa kwa sababu ni sehemu ya nguvu ya balagha ya mstari.
