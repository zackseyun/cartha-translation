  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ αὕτη ἐστὶν ἡ ἐντολὴ αὐτοῦ, ἵνα ⸀πιστεύσωμεν τῷ ὀνόματι τοῦ υἱοῦ αὐτοῦ Ἰησοῦ Χριστοῦ καὶ ἀγαπῶμεν ἀλλήλους, καθὼς ἔδωκεν ἐντολὴν ⸀ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/023.yaml
  text: 'And this is his command: that we believe in the name of his Son Jesus the Messiah and love one another[d][c][b][a], just as he gave us command.'
translation:
  language: sw
  text: 'Na hii ndiyo amri yake: tuamini katika jina la Mwana wake, Yesu Masihi,[a] na tupendane, kama alivyotupa amri.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yesu Kristo.” Neno la Kigiriki Χριστός linamaanisha Masihi, yaani Mtiwa-Mafuta.
    reason: alternative_reading
  - marker: b
    text: Kigiriki pia chaweza kutafsiriwa, “kama alivyotuamuru.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐντολή
  choice: amri
  rationale: “Amri” ni neno la kawaida na lenye hadhi linalohifadhi mamlaka ya agizo; umoja umehifadhiwa katika sehemu zote mbili za mstari.
- source_word: ἵνα πιστεύσωμεν
  choice: tuamini
  rationale: Baada ya “hii ndiyo amri yake,” hali ya utegemezi ya Kiswahili inaeleza yaliyomo katika amri na kuhifadhi nguvu ya kimaagizo ya hali tegemezi ya Kigiriki.
- source_word: πιστεύω τῷ ὀνόματι
  choice: tuamini katika jina
  rationale: Usemi huu unaelekeza imani kwa Yesu kama anavyofunuliwa na jina lake. “Katika jina” huhifadhi picha na msamiati wa Kiyohana bila kuufafanua kupita kiasi.
- source_word: τοῦ υἱοῦ αὐτοῦ
  choice: Mwana wake
  rationale: Huhifadhi uhusiano unaotajwa moja kwa moja katika Kigiriki; herufi kubwa inaonyesha kwamba hapa ni rejeleo la pekee kwa Yesu.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesu Masihi
  rationale: Χριστός hapa inamtambulisha Mwana kwa cheo chake cha Kimasihi, kwa hiyo “Masihi” huhifadhi maana ya cheo badala ya kulifanya neno lionekane kama jina la ukoo.
- source_word: ἀγαπῶμεν ἀλλήλους
  choice: tupendane
  rationale: Kitenzi cha kutendeana “tupendane” ni Kiswahili cha asili kinachowasilisha kwa ufupi maana ya “tupende sisi kwa sisi.”
- source_word: καθὼς ἔδωκεν ἐντολὴν ἡμῖν
  choice: kama alivyotupa amri
  rationale: Huhifadhi muundo wa kutoa amri na kurudia nomino ἐντολή, huku ikiwa ya kawaida katika Kiswahili.
theological_decisions:
- issue: Maana ya Χριστός
  choice: Masihi
  alternative: Kristo
  rationale: Katika muktadha huu Χριστός lina nguvu ya cheo kinachomtambulisha Yesu kuwa Masihi; tanbihi inahifadhi tafsiri ya kimapokeo “Kristo.”
- issue: Nguvu ya πιστεύω τῷ ὀνόματι
  choice: tuamini katika jina
  alternative: tulitumainie jina
  rationale: Tafsiri iliyochaguliwa inadumisha msamiati wa imani wa Yohana na dhana ya jina kama utambulisho na mamlaka iliyofunuliwa, bila kuufanya mstari useme tu kwamba jina fulani ni la kweli.
- issue: Mhusika wa ἔδωκεν
  choice: alivyotupa
  alternative: Mungu alivyotupa
  rationale: Kiwakilishi kisicho na jina kinahifadhi namna Kigiriki kinavyosema na hakiongezi ufafanuzi wa mhusika ambao matini yenyewe haujaurudia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wazi kwa usomaji wa kawaida, huku “katika jina” ukihifadhi usemi muhimu wa Kiyohana. Alama zote za tanbihi zimewekwa mara moja katika matini kuu.
