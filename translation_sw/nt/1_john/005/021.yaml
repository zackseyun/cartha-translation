  text: Τεκνία, φυλάξατε ἑαυτὰ ἀπὸ τῶν ⸀εἰδώλων.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/021.yaml
  text: Little children[a], guard yourselves from idols.
translation:
  language: sw
  text: Enyi watoto wadogo[a], jilindeni na sanamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Watoto” au “Watoto wapendwa.” Neno la Kigiriki ni umbo la udogo lenye sauti ya upendo ambalo Yohana hutumia katika kuwahutubia wasomaji wake.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τεκνία
  choice: Watoto wapendwa
  rationale: Ni wingi wa neno la upendo ambalo Yohana hutumia anapowahutubia wasomaji wake. “Watoto wapendwa” huwasilisha ukaribu na upendo wa kichungaji kwa Kiswahili cha kawaida bila kudokeza kwamba lazima wawe watoto kwa umri.
- source_word: φυλάξατε
  choice: jilindeni
  rationale: Ni amri kwa wingi inayodai uangalifu thabiti. “Jilindeni” ni ya asili katika Kiswahili na, pamoja na kiwakilishi rejeshi kilichomo katika kitenzi, huhifadhi maana ya kujihadhari au kujikinga.
- source_word: ἑαυτὰ
  choice: ji- (katika “jilindeni”)
  rationale: Kiwakilishi rejeshi cha Kigiriki kinawakilishwa kiasili na kiambishi rejeshi “ji-” katika kitenzi cha Kiswahili, badala ya kuongeza “wenyewe” isivyohitajika.
- source_word: ἀπὸ
  choice: na
  rationale: Katika muundo wa Kiswahili “kujilinda na,” neno “na” huonyesha kujitenga au kujikinga dhidi ya kitu kwa njia ya kawaida na wazi.
- source_word: εἰδώλων
  choice: sanamu
  rationale: “Sanamu” ndilo neno la kawaida la Kibiblia na la Kiswahili kwa vitu vinavyoabudiwa kama miungu. Halipanui maana kuwa kila kitu kinachoweza kuchukua nafasi ya Mungu.
theological_decisions:
- issue: Upeo wa “sanamu”
  choice: Kutafsiri kwa neno halisi “sanamu” bila kulipanua
  alternative: “chochote kinachochukua nafasi ya Mungu” au “ibada ya uongo”
  rationale: Kigiriki hutaja sanamu moja kwa moja. Ingawa onyo linaweza kuwa na matumizi mapana kuhusu ibada ya sanamu, tafsiri haipaswi kuingiza ufafanuzi mpana kuliko maneno ya chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha fupi, ya heshima na inayoeleweka kwa wasomaji wa kawaida. Usemi “Watoto wapendwa” unaleta sauti ya upendo bila kutumia umbo lisilo la kawaida la udogo; “jilindeni na sanamu” ni agizo la moja kwa moja na la asili.
