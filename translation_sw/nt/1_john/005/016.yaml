id: 1JN.5.16
reference: 1 John 5:16
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐάν τις ἴδῃ τὸν ἀδελφὸν αὐτοῦ ἁμαρτάνοντα ἁμαρτίαν μὴ πρὸς θάνατον, αἰτήσει, καὶ δώσει αὐτῷ ζωήν, τοῖς ἁμαρτάνουσιν μὴ πρὸς θάνατον. ἔστιν ἁμαρτία πρὸς θάνατον· οὐ περὶ ἐκείνης λέγω ἵνα ἐρωτήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/016.yaml
  text: If anyone sees his brother committing a sin not leading to death[a], he shall ask, and God will give him life—to those committing sins not leading to death. There is sin leading to death[c][b]; I am not saying that he should ask about that.
translation:
  language: sw
  text: Mtu yeyote akimwona ndugu yake akitenda dhambi isiyoelekea kwenye mauti[a], na aombe, naye Mungu atawapa uzima wale wanaotenda dhambi isiyoelekea kwenye mauti. Kuna dhambi inayoelekea kwenye mauti; sisemi kwamba aombe kuhusu hiyo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Mauti” hapa inaweza kueleweka kuwa kifo cha mwili, kifo cha kiroho, au hukumu ya mwisho; Kigiriki hakifafanui.
    reason: alternative_reading
  - marker: b
    text: Kauli ya Kigiriki haisemi moja kwa moja kwamba mtu amekatazwa kuomba; inasema tu kwamba mwandishi hasemi aombe kuhusu dhambi hiyo.
    reason: theological_tension
lexical_decisions:
- source_word: ἀδελφὸν
  choice: ndugu yake
  rationale: Huhifadhi umoja wa kiume wa Kigiriki na matumizi ya neno hilo kumaanisha mwamini mwenzao; katika Kiswahili “ndugu” pia linaweza kueleweka kwa upana kulingana na muktadha.
- source_word: ἁμαρτάνοντα ἁμαρτίαν
  choice: akitenda dhambi
  rationale: Ni Kiswahili cha kawaida kinachowasilisha tendo halisi la kufanya dhambi bila kuiga kwa ukakasi kirai cha Kigiriki chenye mzizi unaorudiwa.
- source_word: μὴ πρὸς θάνατον
  choice: isiyoelekea kwenye mauti
  rationale: “Kuelekea kwenye” huhifadhi wazo la πρός la mwelekeo au matokeo, huku “mauti” likiacha aina ya kifo bila kufafanuliwa.
- source_word: αἰτήσει
  choice: ataomba
  rationale: Huhifadhi hali ya wakati ujao ya kitenzi, na katika muktadha wa kumwomba Mungu “kuomba” ni ya kawaida kuliko “kuuliza.”
- source_word: δώσει αὐτῷ ζωήν
  choice: naye Mungu atampa huyo ndugu uzima
  rationale: Kigiriki hakitaji wazi mtendaji. Muktadha wa maombi unaonyesha Mungu ndiye atoaye uzima; “huyo ndugu” huondoa utata wa viwakilishi vya Kiswahili kuhusu mpokeaji.
- source_word: ζωήν
  choice: uzima
  rationale: Huhifadhi neno pana la Kiyohana bila kulibana kuwa uzima wa kiroho au uzima wa milele.
- source_word: τοῖς ἁμαρτάνουσιν μὴ πρὸς θάνατον
  choice: —yaani, wale wanaotenda dhambi isiyoelekea kwenye mauti
  rationale: Muundo wa ufafanuzi baada ya kistari huhifadhi wingi wa Kigiriki na uhusiano wake mgumu wa kisintaksia bila kuamua zaidi ya maandishi.
- source_word: ἔστιν ἁμαρτία πρὸς θάνατον
  choice: Kuna dhambi inayoelekea kwenye mauti
  rationale: Huhifadhi usemi mfupi na usio na kibainishi wa Kigiriki bila kuamua ikiwa ni tendo moja maalumu au aina ya dhambi.
- source_word: οὐ περὶ ἐκείνης λέγω ἵνα ἐρωτήσῃ
  choice: sisemi kwamba aombe kuhusu hiyo
  rationale: “Aombe” linafaa kwa muktadha wa sala, na “kuhusu hiyo” linawasilisha περὶ ἐκείνης kwa kawaida.
theological_decisions:
- issue: Maana ya “mauti” katika dhambi inayoelekea kwenye mauti
  choice: Kuacha “mauti” bila kufafanua aina yake
  alternative: Kifo cha mwili, mauti ya kiroho au ya milele, au hukumu ya mwisho
  rationale: Mstari wenyewe hausemi ni aina gani ya mauti; kutafsiri kwa upana kunahifadhi utata na mvutano wa kiteolojia wa chanzo.
- issue: Mtendaji wa “atampa uzima”
  choice: Kumtaja Mungu wazi kama mtoaji
  alternative: Kuacha kiwakilishi kisicho wazi au kumchukulia mwombaji kuwa mtoaji
  rationale: Ingawa kiima hakitajwi katika Kigiriki, muktadha wa kumwomba Mungu unaunga mkono kwa nguvu kwamba Mungu ndiye atoaye uzima.
- issue: Nguvu ya kauli ya mwisho kuhusu kuomba
  choice: “Sisemi kwamba aombe kuhusu hiyo”
  alternative: “Nasema asiombe kuhusu hiyo”
  rationale: Kigiriki hakitoi katazo la moja kwa moja; kinakana kwamba mwandishi anatoa agizo hilo. Tafsiri haipaswi kuibadili kuwa marufuku kamili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Mauti” limetumiwa badala ya “kifo” ili kirai “kuelekea kwenye mauti” kisikike cha kimaandiko lakini bado kieleweke. Alama zote za tanbihi [a] na [b] zimewekwa katika matini kuu.
