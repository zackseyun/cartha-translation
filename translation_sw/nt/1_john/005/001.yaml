base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/001.yaml
  text: Everyone who believes that Jesus is the Messiah has been born of God[b][a], and everyone who loves the one who fathered him also loves the one born of him.
translation:
  language: sw
  text: Kila mtu anayeamini kwamba Yesu ndiye Masihi[a] amezaliwa kutoka kwa Mungu[b]; na kila mtu anayempenda yule aliyemzaa, anampenda pia yule aliyezaliwa kutoka kwake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kristo.” Neno la Kigiriki Χριστός ni cheo kinachomaanisha Mtiwa-Mafuta.
    reason: alternative_reading
  - marker: b
    text: 'Kigiriki kinatumia maumbo ya kitenzi kilekile katika sehemu zote tatu: “amezaliwa,” “aliyemzaa,” na “aliyezaliwa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶς ὁ πιστεύων
  choice: Kila mtu anayeamini
  rationale: Muundo huu wa kawaida unaonyesha kundi lote la watu wenye sifa ya kuamini, huku ukihifadhi maana ya jumla ya kirai cha Kigiriki.
- source_word: ὅτι Ἰησοῦς ἐστιν ὁ χριστός
  choice: kwamba Yesu ndiye Masihi
  rationale: ‘Ndiye’ huonyesha kwamba sentensi ni ungamo kuhusu utambulisho wa Yesu, na ‘Masihi’ huhifadhi maana ya Χριστός kama cheo cha Mtiwa-Mafuta aliyeahidiwa.
- source_word: ἐκ τοῦ θεοῦ γεγέννηται
  choice: amezaliwa na Mungu
  rationale: Wakati timilifu wa Kigiriki unaonyesha tendo lililotimia lenye matokeo yanayoendelea. ‘Amezaliwa na Mungu’ ni Kiswahili cha asili kinachohifadhi lugha ya Yohana kuhusu kuzaliwa kutoka kwa Mungu.
- source_word: πᾶς ὁ ἀγαπῶν
  choice: kila mtu anayempenda
  rationale: Huhifadhi maana ya jumla na endelevu ya kishiriki cha wakati uliopo kwa lugha ya kawaida.
- source_word: τὸν γεννήσαντα
  choice: yule aliyezaa
  rationale: Huhifadhi umbo tendaji la γεννάω bila kulibadili moja kwa moja kuwa jina ‘Baba’ au ‘mzazi,’ jambo ambalo lingekuwa ufafanuzi zaidi ya maneno ya chanzo.
- source_word: ἀγαπᾷ καὶ
  choice: anampenda pia
  rationale: ‘Pia’ huunganisha upendo kwa aliyezaa na upendo kwa aliyezaliwa naye bila kuufanya mmoja kuwa sababu ya mwingine.
- source_word: τὸν γεγεννημένον ἐξ αὐτοῦ
  choice: yule aliyezaliwa kutoka kwake
  rationale: Huhifadhi mzizi uleule wa ‘zaa’ na uhusiano wa asili unaoonyeshwa na ἐξ αὐτοῦ. ‘Kutoka kwake’ huepuka utata wa ‘aliyezaliwa naye,’ ambao katika Kiswahili unaweza kueleweka kuwa walizaliwa pamoja.
theological_decisions:
- issue: Lugha ya γεννάω kuhusu kuzaliwa na Mungu
  choice: Kutumia ‘amezaliwa,’ ‘aliyezaa,’ na ‘aliyezaliwa’ ili kuhifadhi mzizi na ulinganifu wa kifungu.
  alternative: Kutumia ‘amefanywa mtoto wa Mungu,’ ‘Baba,’ na ‘mtoto wake.’
  rationale: Chanzo kinarudia maumbo ya kitenzi kimoja na kujenga ulinganifu kati ya Mungu aliyezaa na wale waliozaliwa kutoka kwake. Tafsiri iliyochaguliwa haiingizi fundisho la ziada kuhusu namna au mpangilio wa kuzaliwa huku.
- issue: Cheo ὁ χριστός
  choice: Masihi
  alternative: Kristo
  rationale: Hapa Χριστός ni cheo cha kiungamo kinachomtambulisha Yesu kuwa Mtiwa-Mafuta aliyeahidiwa, si jina tu. Tanbihi huhifadhi tafsiri nyingine iliyozoeleka.
- issue: Yule aliyezaliwa kutoka kwa Mungu ni nani
  choice: 'Kudumisha umoja wa kisarufi: ‘yule aliyezaliwa kutoka kwake.’'
  alternative: ‘Watoto wa Mungu’ au ‘waumini wengine.’
  rationale: Umoja wa Kigiriki unaweza kutumiwa kwa maana ya mtu yeyote aliyezaliwa na Mungu. Kutaja wazi ‘waumini wengine’ au wingi kungeondoa kiasi cha ujumla na mvutano wa kisarufi wa chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Semikoloni inatenganisha madai mawili makuu huku ikionyesha uhusiano wao. Kurudiwa kwa ‘kila mtu’ kunaleta uwazi wa kawaida kwa msomaji bila kubadili maana ya jumla ya Kigiriki.
