  yaml_path: translation/nt/1_john/005/002.yaml
  text: 'By this we know that we love the children of God: when we love God and keep his commandments[a].'
translation:
  language: sw
  text: 'Kwa hili tunajua kwamba tunawapenda watoto wa Mungu: tunapompenda Mungu na kuzishika amri zake[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kutenda amri zake” au “kutii amri zake.” Kitenzi cha Kigiriki hapa kwa maana halisi ni “kufanya/kutenda” (ποιῶμεν), si kitenzi kinachotumiwa kwa kawaida kumaanisha “kushika” (τηρέω).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: Kwa hili
  rationale: Ni usemi wa kawaida unaotambulisha msingi au ishara ambayo kwayo jambo linajulikana; unahifadhi nguvu ya kiwakilishi cha Kigiriki.
- source_word: γινώσκομεν
  choice: tunajua
  rationale: Wakati uliopo unaendana na mtindo wa Yohana wa kueleza utambuzi au ujuzi unaoendelea; Kiswahili cha kawaida na wazi ni “tunajua.”
- source_word: ἀγαπῶμεν
  choice: tunawapenda / tunapompenda
  rationale: Kitenzi ἀγαπάω kimetafsiriwa kwa mzizi uleule wa “penda” katika sehemu zote mbili ili kuhifadhi uhusiano wa msamiati katika mstari.
- source_word: τὰ τέκνα τοῦ θεοῦ
  choice: watoto wa Mungu
  rationale: τέκνα ni wingi unaowajumuisha wote na huonyesha uhusiano wa kifamilia; “watoto wa Mungu” ni tafsiri ya moja kwa moja na ya asili.
- source_word: ὅταν
  choice: tunapo-
  rationale: Muundo huu wa Kiswahili huwasilisha maana ya “wakati/tunapofanya,” huku ukiacha wazi kivuli chake cha kimasharti na cha wakati.
- source_word: τὰς ἐντολὰς αὐτοῦ ποιῶμεν
  choice: kuzishika amri zake
  rationale: “Kuzishika amri” ni usemi wa asili na unaoeleweka kwa Kiswahili kwa maana ya kuzitii au kuzitekeleza. Tanbihi inaonyesha kwamba Kigiriki kimetumia ποιέω, yaani “kufanya/kutenda,” badala ya kitenzi cha kawaida cha “kushika.”
theological_decisions:
- issue: Uhusiano kati ya kuwapenda watoto wa Mungu, kumpenda Mungu, na amri zake
  choice: Mstari unasema kwamba tunatambua upendo wetu kwa watoto wa Mungu tunapompenda Mungu na kuzishika amri zake, bila kufafanua zaidi aina ya uhusiano huo.
  alternative: Kutafsiri maneno hayo kuwa mtihani wa ushahidi pekee, sababu ya upendo kwa wengine, au ufafanuzi kamili wa upendo huo.
  rationale: Kigiriki kinatoa kigezo kwa ufupi bila kuamua wazi kama uhusiano huo ni wa ushahidi, sababu, au ufafanuzi. Tafsiri inahifadhi mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi umehifadhi ufupi na mvutano wa hoja ya Yohana; alama ya tanbihi imewekwa katika matini kuu.
