  text: the Spirit and the water and the blood[a], and the three are for the one.
translation:
  language: sw
  text: Roho, maji na damu, na hawa watatu wanakubaliana.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata muundo wa Kigiriki kwa karibu zaidi, “na hawa watatu wako katika umoja.” Nahau ya Kigiriki hapa huenda ikimaanisha kwamba ushuhuda wao unakubaliana.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ πνεῦμα
  choice: Roho
  rationale: Katika muktadha wa 1 Yohana 5:6–8, neno hili linaelekea kumaanisha Roho Mtakatifu anayeshuhudia. Herufi kubwa inaonyesha rejeo hilo bila kuongeza neno ‘Mtakatifu,’ ambalo halipo katika mstari huu.
- source_word: τὸ ὕδωρ
  choice: maji
  rationale: Huhifadhi taswira halisi ya Kigiriki bila kufafanua maji hayo yanarejelea nini. Kiswahili hakina kibainishi kinacholingana moja kwa moja na τὸ.
- source_word: τὸ αἷμα
  choice: damu
  rationale: Ni tafsiri ya moja kwa moja inayohifadhi taswira ya Kigiriki na kuacha rejeo lake lifafanuliwe na muktadha.
- source_word: οἱ τρεῖς
  choice: hawa watatu
  rationale: Hurejelea kwa pamoja Roho, maji na damu zilizotajwa mara moja kabla. ‘Hawa’ pia huhifadhi kwa kiasi mtindo wa Kigiriki unaowasilisha hao watatu kama mashahidi.
- source_word: εἰς τὸ ἕν εἰσιν
  choice: wanakubaliana
  rationale: Katika muktadha wa ushuhuda, nahau hii inaonyesha kwamba ushuhuda wa hao watatu unaafikiana. Tafsiri hii ni ya kawaida na wazi katika Kiswahili, huku tanbihi ikihifadhi umbo la karibu zaidi na Kigiriki.
theological_decisions:
- issue: Ikiwa εἰς τὸ ἕν εἰσιν inaeleza umoja wa kiasili au makubaliano ya mashahidi
  choice: 'Makubaliano ya ushuhuda: ‘hawa watatu wanakubaliana’'
  alternative: ‘hawa watatu wanaelekea kwenye jambo moja’ au ‘hawa watatu ni kitu kimoja’
  rationale: Muktadha unawataja Roho, maji na damu kuwa mashahidi, kwa hiyo kauli hii inaelekea kueleza kwamba ushuhuda wao unakutana katika jambo moja. Tafsiri kuu haileti dai la umoja wa kiasili ambalo mstari huu haulazimishi, na tanbihi huhifadhi uwezekano wa usomaji wa karibu zaidi na muundo wa Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mpangilio ni mwepesi kusomeka, na maneno ‘maji’ na ‘damu’ hayajafasiriwa zaidi ya yaliyo katika mstari. Alama ya tanbihi imewekwa baada ya kishazi kinachohusika.
