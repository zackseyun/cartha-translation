  text: ὅτι πᾶν τὸ γεγεννημένον ἐκ τοῦ θεοῦ νικᾷ τὸν κόσμον. καὶ αὕτη ἐστὶν ἡ νίκη ἡ νικήσασα τὸν κόσμον, ἡ πίστις ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/004.yaml
  text: 'For everyone who has been born of God overcomes the world[b][a]. And this is the victory that has overcome the world: our faith.'
translation:
  language: sw
  text: 'Kwa maana kila mtu aliyezaliwa na Mungu[a] huushinda ulimwengu. Na huu ndio ushindi ulioushinda ulimwengu: imani yetu.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kila kilichozaliwa na Mungu.” Kigiriki kinatumia muundo wa jinsia ya kati unaojumuisha kundi lote la wale waliozaliwa na Mungu.
    reason: lexical_alternative
  - marker: b
    text: Au, “uaminifu wetu.” Neno la Kigiriki linaweza kumaanisha “imani,” “kumtumaini,” au “uaminifu” katika miktadha mbalimbali; hapa matini kuu imetumia “imani.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: Kwa maana
  rationale: Hutambulisha sababu ya kauli iliyotangulia na ni kiunganishi cha kawaida, cha heshima katika Kiswahili.
- source_word: πᾶν τὸ γεγεννημένον
  choice: kila aliyezaliwa
  rationale: Ingawa muundo wa Kigiriki ni wa jinsia isiyo na uhai katika umoja, hapa unarejelea kwa ujumla watu waliozaliwa na Mungu; tafsiri hii ni ya kawaida kwa Kiswahili huku mbadala wa karibu zaidi na umbo la Kigiriki ukihifadhiwa katika tanbihi.
- source_word: γεγεννημένον
  choice: aliyezaliwa
  rationale: Huonyesha kuzaliwa kulikokamilika ambako matokeo yake yanaendelea; lugha ya kuzaliwa inafaa muktadha wa Yohana kuliko 'aliyezalishwa'.
- source_word: ἐκ τοῦ θεοῦ
  choice: na Mungu
  rationale: Katika usemi wa Kiswahili 'kuzaliwa na Mungu' humtaja Mungu kama asili na mtendaji wa kuzaliwa huku ikibaki ya kawaida na wazi.
- source_word: νικᾷ
  choice: huushinda
  rationale: Huwasilisha tendo la kawaida au linaloendelea la kushinda na kudumisha uhusiano wa kimatamshi na 'ushindi' na 'ulioushinda'.
- source_word: τὸν κόσμον
  choice: ulimwengu
  rationale: Huhifadhi istilahi pana ya Kiyohana bila kuifafanua kupita kiasi kuwa mfumo wa uovu katika matini kuu.
- source_word: αὕτη ἐστὶν ἡ νίκη
  choice: huu ndio ushindi
  rationale: Huhifadhi mkazo wa kiashiria na nomino inayohusiana na kitenzi 'kushinda' kwa Kiswahili cha kawaida.
- source_word: ἡ νικήσασα
  choice: ulioushinda
  rationale: Huhifadhi hali ya tendo lililotimizwa ya aoristi na uhusiano wa mzizi mmoja kati ya 'ushindi' na 'kushinda'.
- source_word: ἡ πίστις ἡμῶν
  choice: imani yetu
  rationale: '''Imani'' ndiyo maana inayofaa zaidi katika muktadha huu; uwezekano wa ''uaminifu wetu'' umehifadhiwa katika tanbihi.'
theological_decisions:
- issue: Rejeleo la πᾶν τὸ γεγεννημένον
  choice: 'la kibinafsi na la kijumla: ''kila aliyezaliwa na Mungu'''
  alternative: '''kila kilichozaliwa na Mungu'''
  rationale: Muktadha unawahusu waamini, lakini umbo la Kigiriki ni la jinsia isiyo na uhai; matini kuu inawasilisha rejeleo la watu kwa Kiswahili cha kawaida na tanbihi inahifadhi umbo mbadala.
- issue: Maana ya πίστις
  choice: imani
  alternative: uaminifu
  rationale: Katika muktadha huu neno linatambulisha imani kuwa ushindi unaoushinda ulimwengu. 'Uaminifu' unawezekana kimsamiati katika baadhi ya miktadha, hivyo umeonyeshwa katika tanbihi bila kuamuliwa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Marudio ya mzizi shinda—'huushinda,' 'ushindi,' 'ulioushinda'—yamehifadhiwa ili kuakisi mchezo wa kimatamshi wa νικᾷ/νίκη/νικήσασα. Alama za tanbihi zimewekwa baada ya vipashio vinavyohusika.
