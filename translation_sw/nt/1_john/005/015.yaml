source:
  edition: SBLGNT
  text: καὶ ἐὰν οἴδαμεν ὅτι ἀκούει ἡμῶν ὃ ⸀ἐὰν αἰτώμεθα, οἴδαμεν ὅτι ἔχομεν τὰ αἰτήματα ἃ ᾐτήκαμεν ⸀ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/015.yaml
  text: And if we know that he hears us in whatever we ask, we know that we have the requests that we have asked from him.
translation:
  language: sw
  text: Na ikiwa tunajua kwamba anatusikia katika lolote tunaloomba[a], tunajua kwamba tunayo yale tuliyomwomba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “chochote tunachoweza kuomba.” Muundo wa Kigiriki unaonyesha maana pana ya “lolote.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούει ἡμῶν
  choice: anatusikia
  rationale: Kitenzi ‘kusikia’ pamoja na kiwakilishi cha mtendwa kinaeleza kwamba Mungu husikia maombi yetu bila kuongeza maana ya kwamba moja kwa moja ‘anatujibu.’
- source_word: ὃ ἐὰν αἰτώμεθα
  choice: katika lolote tunaloomba
  rationale: 'Muundo wa kiwakilishi cha uhusiano pamoja na ἐάν una maana pana na isiyofungwa: ‘lolote tunaloomba.’ ‘Katika’ linaunganisha kifungu hiki kwa kawaida na ‘anatusikia’ huku likihifadhi upana huo.'
- source_word: αἰτώμεθα
  choice: tunaloomba
  rationale: Katika muktadha huu αἰτέω ni kuomba kwa Mungu; ‘kuomba’ ni neno la kawaida na la moja kwa moja katika Kiswahili.
- source_word: ἔχομεν
  choice: tunayo
  rationale: Wakati uliopo wa Kigiriki unasema ‘tunayo’; tafsiri hii haiongezi wazo la ‘tunapokea,’ ambalo halijasemwa moja kwa moja.
- source_word: τὰ αἰτήματα
  choice: yale tuliyomwomba
  rationale: Kiswahili cha kawaida huonyesha vitu vilivyoombwa kwa ‘yale tuliyomwomba.’ Hii ni ya asili zaidi kuliko nomino nzito kama ‘maombi’ au ‘maombi yetu,’ ambazo zinaweza kumaanisha tendo la kusali badala ya vitu vilivyoombwa.
- source_word: ἃ ᾐτήκαμεν
  choice: tuliyomwomba
  rationale: Kauli hii inaonyesha kwamba tendo la kuomba limekamilika na bado lina umuhimu sasa. Kiswahili hutumia wakati uliopita ‘tuliyomwomba’ kwa njia ya kawaida katika muktadha huu.
- source_word: ἀπ’ αὐτοῦ
  choice: -mwomba
  rationale: Kiambishi cha mtendwa ‘-m-’ ndani ya ‘tuliyomwomba’ kinaonyesha kwamba maombi hayo yalielekezwa kwake; Kiswahili cha kawaida hakihitaji kuongeza ‘kutoka kwake.’
- source_word: οἴδαμεν
  choice: tunajua
  rationale: ‘Tunajua’ huhifadhi marudio na msisitizo wa Yohana juu ya ujuzi na uhakika bila kufafanua zaidi ya maandishi.
theological_decisions:
- issue: Ikiwa ἀκούει itafsiriwe kama kusikia au kama kujibu maombi kwa neema.
  choice: anatusikia
  alternative: anatujibu
  rationale: Maandishi yanasema kwamba Mungu husikia, kisha yanatoa hitimisho kwamba tunayo yale tuliyomwomba. ‘Anatujibu’ ingeunganisha hatua hizi mbili na kuongeza maana ambayo kitenzi cha Kigiriki hakisemi wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa asili kwa msomaji wa kawaida huku ukihifadhi marudio ya ‘tunajua,’ wakati uliopo wa ‘tunayo,’ na mvutano wa kitheolojia kati ya Mungu kusikia na waombaji kuwa na yale waliyoomba.
