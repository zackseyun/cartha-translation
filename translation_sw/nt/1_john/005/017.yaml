review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders ἁμαρτία as “dhambi,” preserves the connective “na,” and leaves θάνατον (“kifo”) appropriately unspecified. “isiyoongoza kwenye kifo” conveys the established πρὸς θάνατον idiom without deciding what kind of death is meant. However, “Kila jambo lisilo la haki” unnecessarily recasts the abstract moral noun ἀδικία as a ‘thing/matter’ and is less idiomatic than a direct abstract rendering.
  naturalness: “Kila uovu ni dhambi” is concise, natural Standard East African Swahili, and fits the elevated biblical register. The second clause is already clear and natural.
  terminology: “Uovu” is a suitably broad moral rendering of ἀδικία here; it avoids restricting the term to social injustice or making it merely a generic ‘mistake.’ “Dhambi” and “kifo” are retained consistently. The footnote alternatives are adjusted so that they remain plausible lexical alternatives and do not weaken the moral force of the Greek.
  issues:
  - severity: medium
    issue: The main rendering “Kila jambo lisilo la haki” is overly periphrastic for πᾶσα ἀδικία.
    rationale: The Greek uses an abstract noun, ‘all unrighteousness/wrongdoing.’ Referring to a ‘jambo’ adds a concrete category not present in the source and is less idiomatic in this maxim-like statement.
  - severity: low
    issue: The alternative “Kila kosa ni dhambi” is semantically too weak for ἀδικία.
    rationale: “Kosa” can denote an error or minor fault, whereas ἀδικία denotes moral wrong/unrighteousness.
  - severity: low
    issue: The formal footnote alternative “isiyo ya kufikia kifo” is not natural Swahili.
    rationale: It does not idiomatically express the Greek phrase. A literal-oriented but understandable alternative is preferable.
  revised_text: Kila uovu ni dhambi[a], na kuna dhambi isiyoongoza kwenye kifo[b].
  revised_footnotes:
