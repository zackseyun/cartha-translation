translation:
  language: sw
  text: Kila uovu ni dhambi[a], na kuna dhambi isiyoongoza kwenye kifo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kila lisilo la haki ni dhambi,” au “Kila udhalimu ni dhambi.”
    reason: lexical_alternative
  - marker: b
    text: Au, “isiyoleta kifo”; kwa tafsiri iliyo ya karibu zaidi na muundo wa Kigiriki, “isiyo ya kuelekea kwenye kifo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσα ἀδικία
  choice: Kila jambo lisilo la haki
  rationale: Muundo huu unaonyesha upeo wa πᾶσα na maana pana ya ἀδικία bila kuibana iwe ukosefu wa haki katika jamii pekee. Pia ni Kiswahili cha kawaida na huonyesha kwamba kila aina ya jambo lisilo sawa kimaadili ni dhambi.
- source_word: ἁμαρτία
  choice: dhambi
  rationale: Hili ndilo neno la kawaida na sahihi la Kiswahili kwa ἁμαρτία katika sehemu zote mbili.
- source_word: καὶ
  choice: na
  rationale: Kiunganishi rahisi kinachounganisha kauli ya jumla na ufafanuzi unaofuata.
- source_word: οὐ πρὸς θάνατον
  choice: isiyoongoza kwenye kifo
  rationale: Huhifadhi wazo la mwelekeo au matokeo lililo katika πρὸς θάνατον, huku likibaki wazi na la kueleweka katika Kiswahili cha sasa.
- source_word: θάνατον
  choice: kifo
  rationale: Ni tafsiri ya moja kwa moja ya θάνατος. Hakuna kivumishi cha kufafanua aina ya kifo, kwa hiyo tafsiri haiongezi maana ya kimwili, kiroho, au ya hukumu ya mwisho.
theological_decisions:
- issue: Maana ya “kifo” katika usemi “dhambi isiyoongoza kwenye kifo”
  choice: Kutumia “kifo” bila ufafanuzi wa ziada
  alternative: Kifo cha kimwili, kifo cha kiroho, au hukumu ya mwisho
  rationale: Nakala ya Kigiriki haisemi ni aina gani ya kifo. Tafsiri inadumisha uwazi huo wa kimakusudi badala ya kuamua suala la kitheolojia kwa msomaji.
- issue: Upeo wa ἀδικία katika kauli ya kimaadili
  choice: Kila jambo lisilo la haki
  alternative: Uovu wote; kila kosa; kila dhuluma
  rationale: Chaguo hili linabaki pana kimaadili na kitheolojia. “Dhuluma” ingeweza kueleweka kwa maana finyu ya kijamii au kisheria, na “kosa” linaweza kupunguza uzito wa neno.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wazi kwa msomaji wa kawaida, huku ukihifadhi upeo wa kauli na utata wa neno “kifo.”
