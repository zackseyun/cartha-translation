    text: Au, “Kila lisilo la haki ni dhambi,” au “Kila udhalimu ni dhambi.”
    reason: lexical_alternative
  - marker: b
    text: Au, “isiyoleta kifo”; kwa tafsiri iliyo ya karibu zaidi na muundo wa Kigiriki, “isiyo ya kuelekea kwenye kifo.”
    reason: lexical_alternative
  revision_rationale: The revision replaces the cumbersome concrete expression “jambo lisilo la haki” with the natural abstract moral term “uovu,” which better represents ἀδικία in this context. It retains the draft’s appropriately noninterpretive rendering of ‘death’ and its clear expression that this sin does not lead to death. Footnotes are made semantically and idiomatically safer.
