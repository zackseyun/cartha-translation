  text: We know that we are from God[b][a], and the whole world lies in the evil one.
translation:
  language: sw
  text: Tunajua kwamba sisi tu wa Mungu, na ulimwengu wote uko chini ya yule Mwovu.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa tafsiri iliyo karibu zaidi na muundo wa Kigiriki: “ulimwengu wote umo katika yule Mwovu.”'
    reason: lexical_alternative
  - marker: b
    text: Baadhi wanaweza kuelewa maneno haya kuwa “uko katika uovu”; hata hivyo, katika matumizi ya Yohana, maana ya nafsi—“yule Mwovu”—ina uwezekano mkubwa zaidi.
    reason: alternative_reading
lexical_decisions:
- source_word: οἴδαμεν
  choice: Tunajua
  rationale: Kitenzi hiki kinaonyesha ujuzi wenye uhakika; “tunajua” ni tafsiri ya moja kwa moja na ya kawaida inayodumisha sauti ya uhakikisho.
- source_word: ἐκ τοῦ θεοῦ
  choice: tunatoka kwa Mungu
  rationale: ἐκ inaonyesha chanzo au asili. Kauli hii inadumisha maana hiyo bila kuongeza wazi wazo la kuzaliwa, ambalo halitajwi katika kishazi hiki.
- source_word: ὁ κόσμος ὅλος
  choice: ulimwengu wote
  rationale: Hii ni tafsiri ya kawaida inayohifadhi msisitizo wa ὅλος juu ya ujumla wa ulimwengu unaozungumziwa.
- source_word: ἐν τῷ πονηρῷ
  choice: chini ya mamlaka ya yule Mwovu
  rationale: Katika muktadha wa maandishi ya Yohana, πονηρός inaelekea kumaanisha kiumbe binafsi, yaani yule Mwovu. Kauli “chini ya mamlaka ya” inaeleza kwa Kiswahili cha kawaida hali inayodokezwa na muundo wa Kigiriki, huku tafsiri rasmi zaidi ikiwekwa katika tanbihi.
- source_word: κεῖται
  choice: uko
  rationale: κεῖται inaonyesha hali au mahali ambapo kitu kipo. “Uko” ni ya asili katika Kiswahili, nayo pamoja na “chini ya mamlaka” inaonyesha hali ya ulimwengu kuwa chini ya ushawishi au udhibiti.
theological_decisions:
- issue: Ikiwa τῷ πονηρῷ inamaanisha uovu kwa ujumla au yule Mwovu kama nafsi
  choice: yule Mwovu kama nafsi
  alternative: uovu
  rationale: Matumizi ya Yohana mahali pengine na kivumishi chenye kibainishi yanaunga mkono zaidi maana ya nafsi. Hata hivyo, uwezekano wa maana ya “uovu” umehifadhiwa katika tanbihi.
- issue: Jinsi ya kuwakilisha ἐν τῷ πονηρῷ bila kuifanya sentensi ya Kiswahili kuwa tata
  choice: uko chini ya mamlaka ya yule Mwovu
  alternative: umo katika yule Mwovu
  rationale: Tafsiri kuu inaeleza maana ya hali au kutawaliwa kwa Kiswahili kinachoeleweka, lakini tanbihi inadumisha muundo rasmi zaidi wa Kigiriki na hivyo kuonyesha upeo wa tafsiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Tafsiri inatanguliza uelewekaji wa kawaida huku ikihifadhi katika tanbihi muundo rasmi na utata halisi wa τῷ πονηρῷ.
