id: 1JN.5.5
reference: 1 John 5:5
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: τίς ⸂δέ ἐστιν⸃ ὁ νικῶν τὸν κόσμον εἰ μὴ ὁ πιστεύων ὅτι Ἰησοῦς ἐστιν ὁ υἱὸς τοῦ θεοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/005.yaml
  text: And who is the one who overcomes the world except the one who believes that Jesus is the Son of God?[a]
translation:
  language: sw
  text: Ni nani basi anayeushinda ulimwengu, isipokuwa yule anayeamini kwamba Yesu ni Mwana wa Mungu?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya karibu zaidi, “yeye anayeushinda ... yeye anayeamini.” Kigiriki kinatumia participio za umoja wa kiume kwa maana ya kumwakilisha mtu yeyote.
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς
  choice: ni nani
  rationale: Kiwakilishi cha kuuliza kinaanzisha swali la balagha; “ni nani” ni usemi wa kawaida na wa wazi katika Kiswahili.
- source_word: δέ
  choice: basi
  rationale: Hapa δέ inaunganisha swali hili kwa upole na kauli iliyotangulia, si kuleta utofautishaji mkali. “Basi” hudumisha mwendelezo huo kwa Kiswahili cha asili.
- source_word: ὁ νικῶν
  choice: anayeushinda
  rationale: Kivumishi cha kitenzi cha wakati uliopo chenye kibainishi kina maana ya mtu ambaye kwa tabia hushinda. Umbo hili la Kiswahili linahifadhi nguvu ya kitendo bila kumtaja mwanamume pekee.
- source_word: τὸν κόσμον
  choice: ulimwengu
  rationale: Neno κόσμος limetafsiriwa moja kwa moja kuwa “ulimwengu,” bila kuongeza ufafanuzi wa kitheolojia kama “mfumo wa ulimwengu” ambao haujaelezwa wazi katika matini.
- source_word: εἰ μὴ
  choice: isipokuwa
  rationale: Katika muundo huu wa swali la balagha, εἰ μὴ huonyesha upekee; “isipokuwa” ni tafsiri ya kawaida na sahihi.
- source_word: ὁ πιστεύων
  choice: yule anayeamini
  rationale: Muundo huu huhifadhi maana ya kitendo kinachoendelea au kinachomtambulisha mtu, badala ya kukibadili kuwa nomino tu kama “muumini.”
- source_word: ὅτι
  choice: kwamba
  rationale: Hapa ὅτι inaanzisha maudhui ya imani, si sababu; kwa hiyo “kwamba” ndiyo tafsiri inayofaa.
- source_word: Ἰησοῦς
  choice: Yesu
  rationale: Hili ndilo umbo sanifu la jina hili katika Kiswahili.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: Mwana wa Mungu
  rationale: Tafsiri hii inahifadhi moja kwa moja cheo cha Kikristo na uzito wa kauli kuhusu utambulisho wa Yesu bila kukipanua au kukipunguza.
theological_decisions:
- issue: Maana wakilishi ya ὁ νικῶν na ὁ πιστεύων, ambazo ni participio za umoja wa kiume
  choice: anayeushinda / yule anayeamini
  alternative: yeye anayeushinda / yeye anayeamini
  rationale: Ingawa maumbo ya Kigiriki ni ya kisarufi ya umoja wa kiume, yanatumika kwa maana ya jumla kumwakilisha mtu yeyote mwenye sifa hiyo. Kiswahili hakilazimishi jinsia katika maumbo haya, hivyo tafsiri inahifadhi maana ya jumla bila kuifanya kuwa dhana isiyo na mhusika.
- issue: Ukiri wa Kikristo katika ὁ υἱὸς τοῦ θεοῦ
  choice: Mwana wa Mungu
  alternative: Mwana wake Mungu
  rationale: Matini inatoa kauli kuhusu utambulisho wa Yesu. “Mwana wa Mungu” huhifadhi cheo hicho moja kwa moja bila kuingiza maelezo ya ziada ya kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa swali la balagha umehifadhiwa, na lugha ni rahisi kueleweka bila kupunguza uzito wa kauli ya Kikristo.
