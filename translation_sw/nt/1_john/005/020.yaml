id: 1JN.5.20
reference: 1 John 5:20
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οἴδαμεν δὲ ὅτι ὁ υἱὸς τοῦ θεοῦ ἥκει, καὶ δέδωκεν ἡμῖν διάνοιαν ἵνα ⸀γινώσκωμεν τὸν ἀληθινόν· καὶ ἐσμὲν ἐν τῷ ἀληθινῷ, ἐν τῷ υἱῷ αὐτοῦ Ἰησοῦ Χριστῷ. οὗτός ἐστιν ὁ ἀληθινὸς θεὸς καὶ ζωὴ αἰώνιος.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/020.yaml
  text: And we know that the Son of God has come and has given us understanding so that we may know the True One; and we are in the True One[a], in his Son Jesus the Messiah. This one is the true God and eternal life.
translation:
  language: sw
  text: Nasi tunajua kwamba Mwana wa Mungu amekuja na ametupa ufahamu ili tumjue Yeye aliye wa kweli; nasi tumo katika Yeye aliye wa kweli, katika Mwana wake Yesu Masihi. Huyu[a] ndiye Mungu wa kweli na uzima wa milele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiwakilishi “Huyu” huenda kinamrejelea hasa Yesu Masihi; hata hivyo, wengine hukielewa kuwa kinamrejelea “Yeye aliye wa kweli” (Baba) katika kishazi kilichotangulia.
    reason: alternative_reading
lexical_decisions:
- source_word: οἴδαμεν
  choice: tunajua
  rationale: Umbo οἶδα lina maana ya hali ya sasa ya kuwa na ujuzi thabiti; “tunajua” ni Kiswahili cha kawaida na sahihi.
- source_word: ἥκει
  choice: amekuja
  rationale: Huonyesha kuja ambako kumetimia na kuna matokeo ya sasa; wakati timilifu wa Kiswahili unafaa.
- source_word: δέδωκεν
  choice: ametupa
  rationale: Wakati timilifu wa Kigiriki unaonyesha kipawa kilichotolewa na kinachoendelea kuwa na matokeo.
- source_word: διάνοιαν
  choice: ufahamu
  rationale: Katika muktadha huu ni uwezo wa kuelewa ukweli wa kiroho, si akili kama kiungo au uwezo wa jumla pekee.
- source_word: ἵνα γινώσκωμεν
  choice: ili tumjue
  rationale: “Ili” hudhihirisha kusudi, na kiambishi cha yambwa cha mtu kinaonyesha kwamba anayejulikana ni nafsi.
- source_word: τὸν ἀληθινόν / τῷ ἀληθινῷ
  choice: Yeye aliye wa kweli
  rationale: Kivumishi kimetumiwa kama nomino kumrejelea mtu; kauli hii ni ya asili katika Kiswahili na inadumisha urudiaji wa Kiyohana bila kuamua kimyakimya kama mrejelewa ni Baba au Mwana.
- source_word: ἐσμὲν ἐν
  choice: tumo ndani yake
  rationale: Hudumisha lugha ya uhusiano ya “kuwa ndani ya” bila kuipanua kuwa “kukaa” au “kuunganishwa,” ingawa “ndani yake” hufanya Kiswahili kisomeke kwa kawaida.
- source_word: ἐν τῷ υἱῷ αὐτοῦ
  choice: ndani ya Mwana wake
  rationale: Tafsiri ya moja kwa moja na ya kawaida ya uhusiano wa kimilikishi.
- source_word: Ἰησοῦ Χριστῷ
  choice: Yesu Masihi
  rationale: Χριστός hapa lina nguvu ya cheo; “Masihi” ni istilahi ya kawaida ya Kiswahili na huepuka kulifanya kuwa kana kwamba ni jina la ukoo.
- source_word: οὗτός
  choice: Huyu
  rationale: Kiwakilishi kionyeshi kinawakilisha moja kwa moja nguvu ya οὗτός na kuhifadhi swali la kisarufi kuhusu mtangulizi wake.
- source_word: ὁ ἀληθινὸς θεὸς
  choice: Mungu wa kweli
  rationale: Ni tafsiri ya kawaida na sahihi ya kirai hiki cha kiarifu.
- source_word: ζωὴ αἰώνιος
  choice: uzima wa milele
  rationale: Ni usemi uliozoeleka katika Kiswahili cha Biblia na unafaa katika maandishi ya Kiyohana.
theological_decisions:
- issue: Mtangulizi wa οὗτός katika “οὗτός ἐστιν ὁ ἀληθινὸς θεὸς καὶ ζωὴ αἰώνιος”
  choice: Kutafsiri “Huyu ndiye Mungu wa kweli na uzima wa milele,” huku “Huyu” kwa kawaida akielekea kwa mtangulizi wa karibu, Yesu Masihi.
  alternative: “Huyu” anaweza kumrejelea Yeye aliye wa kweli, yaani Baba, aliyetajwa katika kishazi kilichotangulia.
  rationale: Kiwakilishi cha Kigiriki mara nyingi huelekea kwa mtangulizi wa karibu, lakini muundo wa sentensi umezua uelewa zaidi ya mmoja. Tafsiri ya wazi pamoja na tanbihi hudumisha mvutano huo bila kuulazimisha upande mmoja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Nasi” huhifadhi kiunganishi δέ kwa mtiririko wa kawaida; urudiaji wa “Yeye aliye wa kweli” umehifadhiwa kwa sababu ni wa kimakusudi katika Kigiriki.
