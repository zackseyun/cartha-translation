  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὁ πιστεύων εἰς τὸν υἱὸν τοῦ θεοῦ ἔχει τὴν μαρτυρίαν ἐν ⸀αὑτῷ· ὁ μὴ πιστεύων τῷ θεῷ ψεύστην πεποίηκεν αὐτόν, ὅτι οὐ πεπίστευκεν εἰς τὴν μαρτυρίαν ἣν μεμαρτύρηκεν ὁ θεὸς περὶ τοῦ υἱοῦ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/010.yaml
  text: The one who believes in the Son of God has the testimony in himself[a]; the one who does not believe God has made him a liar[b], because he has not believed the testimony that God has testified about his Son.
translation:
  language: sw
  text: Anayemwamini Mwana wa Mungu ana ushuhuda huo ndani yake mwenyewe[a]. Asiyemwamini Mungu amemfanya kuwa mwongo[b], kwa sababu hajauamini ushuhuda ambao Mungu ametoa kuhusu Mwana wake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati zina “ndani yake” badala ya “ndani yake mwenyewe”; jambo hilo linaweza kueleweka kuwa “ndani ya Mwana” badala ya “ndani ya mwamini mwenyewe.”
    reason: textual_variant
  - marker: b
    text: Au, “amemhesabu kuwa mwongo.” Kwa tafsiri ya karibu zaidi, Kigiriki husema “amemfanya kuwa mwongo,” yaani, kuukataa ushuhuda wa Mungu ni kumtendea Mungu kana kwamba hasemi kweli.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πιστεύων εἰς τὸν υἱὸν τοῦ θεοῦ
  choice: Anayemwamini Mwana wa Mungu
  rationale: Kirai cha Kiswahili kinaonyesha mtu yeyote anayemwelekezea Mwana imani yake, huku kikihifadhi umoja wa jumla wa kishiriki chenye kibainishi katika Kigiriki.
- source_word: τὴν μαρτυρίαν
  choice: ushuhuda huo
  rationale: “Ushuhuda” huhifadhi maana ya taarifa iliyothibitishwa na pia ladha ya kimahakama; “huo” hurejelea ushuhuda uliotajwa katika muktadha.
- source_word: ἐν αὑτῷ
  choice: ndani yake mwenyewe
  rationale: Kiwakilishi cha kujirejelea kinamrejelea mwamini; “mwenyewe” kinaweka wazi nguvu ya αὑτῷ bila kufafanua zaidi ushuhuda huo ni nini.
- source_word: ὁ μὴ πιστεύων τῷ θεῷ
  choice: Asiyemwamini Mungu
  rationale: Hapa maana ni kutokubali kwamba ushuhuda wa Mungu ni wa kweli, si kukataa tu kwamba Mungu yupo. Sentensi inayofuata inaeleza jambo hilo.
- source_word: ψεύστην πεποίηκεν αὐτόν
  choice: amemfanya yeye kuwa mwongo
  rationale: Muundo huu unafuata kwa karibu Kigiriki na wakati timilifu wake, huku “yeye” ikimtambulisha Mungu kuwa ndiye anayetendewa hivyo.
- source_word: οὐ πεπίστευκεν εἰς τὴν μαρτυρίαν
  choice: hajauamini ushuhuda
  rationale: Wakati timilifu unaonyesha kutokuamini kunakoendelea kuwa na matokeo sasa; Kiswahili cha kawaida hakihitaji kihusishi kabla ya “ushuhuda.”
- source_word: ἣν μεμαρτύρηκεν ὁ θεὸς
  choice: ambao Mungu ametoa
  rationale: “Ametoa ushuhuda” ni Kiswahili cha kawaida na huhifadhi uhusiano wa kimaana kati ya nomino μαρτυρία na kitenzi μαρτυρέω bila uradidi mzito.
- source_word: περὶ τοῦ υἱοῦ αὐτοῦ
  choice: kuhusu Mwana wake
  rationale: “Kuhusu” huwasilisha maana ya περί pamoja na hali ya kawaida na yenye heshima katika Kiswahili cha sasa.
theological_decisions:
- issue: Mrejelewa wa “ushuhuda ndani yake mwenyewe”
  choice: Ushuhuda umo ndani ya mwamini mwenyewe.
  alternative: Ushuhuda umo ndani ya Mwana wa Mungu.
  rationale: SBLGNT ina ἐν αὑτῷ, ambayo kwa kawaida humrejelea mwamini aliyetajwa mara moja kabla yake. Tanbihi inahifadhi tofauti ya maandishi bila kuisuluhisha kimafundisho.
- issue: Maana ya “asiyemwamini Mungu”
  choice: Ni kutokubali ushuhuda wa Mungu kuwa wa kweli.
  alternative: Ni kutokuamini kwa jumla kwamba Mungu yupo.
  rationale: Kishazi kinachoanza na ὅτι kinafafanua kutokuamini huko kuwa kutouamini ushuhuda ambao Mungu ametoa kuhusu Mwana wake.
- issue: Maana ya “amemfanya yeye kuwa mwongo”
  choice: Kukataa ushuhuda wa Mungu kunamtendea Mungu kana kwamba ni mwongo.
  alternative: Mtu anaweza kumgeuza Mungu kihalisi awe mwongo.
  rationale: Kauli kali ya Kigiriki imehifadhiwa katika maandishi, huku tanbihi ikieleza nguvu yake ya kimuktadha bila kuidhoofisha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Mpangilio wa tanbihi umesahihishwa ili tanbihi ya tofauti ya maandishi ifuate “ndani yake mwenyewe,” na tanbihi ya usemi “kuwa mwongo” ifuate kirai husika.
