id: 1JN.5.6
reference: 1 John 5:6
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Οὗτός ἐστιν ὁ ἐλθὼν δι’ ὕδατος καὶ αἵματος, Ἰησοῦς Χριστός· οὐκ ἐν τῷ ὕδατι μόνον ἀλλ’ ἐν τῷ ὕδατι καὶ ⸀ἐν τῷ αἵματι· καὶ τὸ πνεῦμά ἐστιν τὸ μαρτυροῦν, ὅτι τὸ πνεῦμά ἐστιν ἡ ἀλήθεια.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/006.yaml
  text: This is the one who came by water and blood—Jesus the Messiah[a]; not by the water only, but by the water and by the blood. And the Spirit is the one testifying[c][b], because the Spirit is the truth.
translation:
  language: sw
  text: Huyu ndiye aliyekuja kwa maji na damu[a]—Yesu Masihi[b]; si kwa maji tu, bali kwa maji na kwa damu. Naye Roho ndiye anayeshuhudia, kwa sababu[c] Roho ndiye kweli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kupitia maji na damu.” Maana ya kifungu hiki inajadiliwa; wengine huona “maji na damu” kuwa ubatizo na kifo cha Yesu, kuzaliwa na kifo chake, au taswira ya kisakramenti. Tafsiri imehifadhi maneno ya Kigiriki bila kuchagua mojawapo ya maoni hayo.
    reason: alternative_reading
  - marker: b
    text: Kigiriki, “Yesu Kristo”; hapa Χριστός limetafsiriwa “Masihi” kwa kuwa linatumika kama cheo.
    reason: lexical_alternative
  - marker: c
    text: Au, “kwamba Roho ndiye kweli.” Kiunganishi kinaweza kutambulisha yaliyomo katika ushuhuda au sababu yake; “kwa sababu” linafaa zaidi katika mtiririko huu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὗτός
  choice: Huyu ndiye
  rationale: Muundo huu unadumisha msisitizo wa kiwakilishi cha kuonyesha na kwa Kiswahili humtambulisha mtu anayezungumziwa kwa njia ya kawaida.
- source_word: ὁ ἐλθὼν
  choice: aliyekuja
  rationale: Kauli hii ya wakati uliopita inatafsiri kishirikishi cha aoristi kwa lugha ya kawaida huku ikirejelea tukio la kihistoria bila kuongeza maelezo ya hali ya tendo.
- source_word: δι’ ὕδατος καὶ αἵματος
  choice: kwa maji na damu
  rationale: Neno «kwa» linaweza kuonyesha njia au hali iliyoambatana na kuja kwake, na linaacha maana ya «maji na damu» wazi kama ilivyo katika Kigiriki.
- source_word: Ἰησοῦς Χριστός
  choice: Yesu Masihi
  rationale: Χριστός lina nguvu ya cheo hapa; «Masihi» ni tafsiri ya kawaida ya cheo hicho katika Kiswahili, bila kuhitaji kibainishi kama ilivyo katika Kiingereza.
- source_word: οὐκ ἐν τῷ ὕδατι μόνον ἀλλ’ ἐν τῷ ὕδατι καὶ ἐν τῷ αἵματι
  choice: si kwa maji tu, bali kwa maji na kwa damu
  rationale: Kurudia «kwa» kunahifadhi msisitizo na ulinganifu wa Kigiriki kwamba si maji peke yake bali maji pamoja na damu.
- source_word: τὸ πνεῦμά
  choice: Roho
  rationale: Muktadha wa ushuhuda wa kimungu unaonyesha Roho Mtakatifu; herufi kubwa inabainisha rejeleo hilo bila kuongeza «Mtakatifu» pasipo kuwapo katika mstari.
- source_word: τὸ μαρτυροῦν
  choice: ndiye anayeshuhudia
  rationale: Muundo huu unahifadhi nguvu ya kishirikishi cha wakati uliopo na kuonyesha ushuhuda unaoendelea.
- source_word: ὅτι
  choice: kwa sababu
  rationale: Hapa ὅτι inaeleweka vizuri kama ikitoa sababu ya ushuhuda wa Roho, ingawa uwezekano wa maana ya «kwamba» umeonyeshwa katika tanbihi.
- source_word: ἡ ἀλήθεια
  choice: ndiye kweli
  rationale: 'Muundo wa «ndiye» unadumisha utambulisho wenye mkazo: Roho ni kweli yenyewe, si kusema tu kwamba Roho ni mkweli.'
theological_decisions:
- issue: Rejeleo la «Roho»
  choice: Roho Mtakatifu
  alternative: roho kwa maana ya jumla
  rationale: Muktadha wa 1 Yohana kuhusu ushuhuda wa kimungu na matumizi ya Kiyohana yanaunga mkono rejeleo la Roho Mtakatifu; tafsiri haiongezi neno «Mtakatifu» katika matini.
- issue: Maana ya «maji na damu»
  choice: Maneno yameachwa bila ufafanuzi wa kimafundisho
  alternative: ubatizo na kifo cha Yesu; kuzaliwa na kifo chake; au taswira ya kisakramenti
  rationale: Kigiriki kinataja maji na damu bila kuvifafanua, kwa hiyo tafsiri inadumisha mvutano na utata wa kweli badala ya kuchagua fasiri moja.
- issue: Tafsiri ya Χριστός
  choice: Masihi
  alternative: Kristo
  rationale: Katika sentensi hii neno linaonekana kuwa cheo kinachomtambulisha Yesu, hivyo «Masihi» linaonyesha wazi nguvu yake ya kicheo.
- issue: Maana ya ὅτι
  choice: kwa sababu
  alternative: kwamba
  rationale: 'Usomaji wa kisababishi unaendana vizuri na mtiririko: Roho anashuhudia kwa sababu Roho ndiye kweli; tanbihi inadumisha usomaji mwingine unaowezekana.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imetumia miundo ya kawaida kama «Huyu ndiye» na «anayeshuhudia», huku ikihifadhi marudio, msisitizo, na utata wa matini ya Kigiriki.
