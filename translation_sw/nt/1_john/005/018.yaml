reference: 1 John 5:18
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Οἴδαμεν ὅτι πᾶς ὁ γεγεννημένος ἐκ τοῦ θεοῦ οὐχ ἁμαρτάνει, ἀλλ’ ὁ γεννηθεὶς ἐκ τοῦ θεοῦ τηρεῖ ⸀αὐτόν, καὶ ὁ πονηρὸς οὐχ ἅπτεται αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/018.yaml
  text: We know that everyone who has been born of God does not keep sinning[a]; rather, the one who was born of God keeps him[c][b], and the evil one does not touch him.
translation:
  language: sw
  text: Tunajua kwamba kila mtu aliyezaliwa na Mungu haendelei kutenda dhambi[a]. Badala yake, yule aliyezaliwa na Mungu humlinda[b], naye Mwovu hamgusi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kauli ya wakati wa sasa hapa inaweza kueleza kutodumu katika kutenda dhambi au kutofanya dhambi kuwa mwenendo wa mtu. Haimaanishi lazima kwamba waamini hawatendi dhambi kamwe; linganisha 1 Yohana 1:8–10; 2:1.
    reason: Kufafanua kwa tahadhari maana inayowezekana ya hali endelevu ya wakati wa sasa na kurejelea muktadha wa barua.
  - marker: b
    text: Au, “hujilinda.” Hata hivyo, wengi humwelewa “yule aliyezaliwa na Mungu” kuwa Yesu, Mwana, ambaye humlinda mwamini.
    reason: Kuhifadhi utata wa anayerejelewa na kirai cha Kigiriki na uwezekano wa maana ya kujirejelea.
  - marker: c
    text: “Kugusa” hapa kunaweza kuwa na maana ya kumkamata mtu ili kumdhuru.
    reason: Kufafanua maana pana ya ἅπτομαι katika muktadha.
lexical_decisions:
- source_word: Οἴδαμεν
  choice: Tunajua
  rationale: Ingawa οἶδα ina umbo la wakati timilifu, hutumika kama hali ya sasa; “tunajua” ni Kiswahili cha kawaida na sahihi.
- source_word: πᾶς ὁ γεγεννημένος ἐκ τοῦ θεοῦ
  choice: kila mtu aliyezaliwa na Mungu
  rationale: πᾶς ὁ pamoja na kivumishi-jina hugawa maana kwa kila mmoja, na γεγεννημένος huonyesha kuzaliwa ambako matokeo yake yanaendelea. Kauli hii pia huhifadhi usemi wa Yohana kuhusu kuzaliwa na Mungu.
- source_word: οὐχ ἁμαρτάνει
  choice: haendelei kutenda dhambi
  rationale: Wakati wa sasa wa Kigiriki hapa unaelekea kueleza mwenendo unaoendelea au wa mazoea. Tafsiri hii haidai kwamba mwamini hatendi dhambi kamwe, jambo ambalo lingekuwa katika mvutano na 1 Yohana 1:8–10 na 2:1.
- source_word: ἀλλ’
  choice: Badala yake
  rationale: Huonyesha utofautishaji wenye nguvu na kuanzisha kauli inayosahihisha au kulinganisha iliyotangulia.
- source_word: ὁ γεννηθεὶς ἐκ τοῦ θεοῦ
  choice: yule aliyezaliwa na Mungu
  rationale: Tafsiri hii haiongezi wazi “Yesu” wala “mwamini,” kwa kuwa kirai cha Kigiriki kinaweza kueleweka kwa njia zote mbili.
- source_word: τηρεῖ αὐτόν
  choice: humlinda
  rationale: τηρέω inaweza kumaanisha kutunza, kulinda, au kuhifadhi. “Humlinda” huleta maana ya ulinzi inayodokezwa na muktadha, huku kiambishi cha yambwa -m- kikihifadhi rejeo la mtu huyo bila kumtaja zaidi.
- source_word: ὁ πονηρὸς
  choice: Mwovu
  rationale: Kibainishi na matumizi ya Yohana yanaonyesha kwamba ni jina la kiumbe binafsi, yaani yule mwovu, wala si uovu kama dhana tu.
- source_word: οὐχ ἅπτεται αὐτοῦ
  choice: hamgusi
  rationale: ἅπτομαι kwa msingi ni “gusa,” lakini katika muktadha huu inaweza kudokeza kumkamata mtu ili kumdhuru. “Hamgusi” huhifadhi picha ya Kigiriki, na tanbihi hufafanua maana inayowezekana.
theological_decisions:
- issue: Maana ya kauli ya wakati wa sasa οὐχ ἁμαρτάνει
  choice: Kauli imetafsiriwa kuwa kukataa kuendelea au kudumu katika kutenda dhambi.
  alternative: Mwamini hatendi dhambi yoyote kabisa.
  rationale: Hii inaakisi hali endelevu ya wakati wa sasa wa Kigiriki na inahifadhi upatanifu na 1 Yohana 1:8–10 na 2:1 bila kuondoa uzito wa kauli hii.
- issue: Anayerejelewa na ὁ γεννηθεὶς ἐκ τοῦ θεοῦ
  choice: Matini kuu inasema kwa uhalisi “yule aliyezaliwa na Mungu,” hivyo haimtaji wazi Yesu wala mwamini.
  alternative: Anaweza kuwa mwamini aliyezaliwa na Mungu; au anaweza kuwa Yesu, Mwana, anayemlinda mwamini.
  rationale: Muundo wa Kigiriki una utata halisi. Matini kuu unauacha wazi, huku tanbihi ikieleza njia kuu mbili za kuuelewa.
- issue: Rejeo la αὐτόν na αὐτοῦ
  choice: Viambishi vya nafsi ya tatu vinamrejelea mtu anayelindwa na asiyeguswa na Mwovu.
  alternative: Ikiwa yule aliyezaliwa na Mungu ni mwamini mwenyewe, τηρεῖ αὐτόν inaweza kueleweka kwa maana ya “hujilinda.”
  rationale: αὐτόν si kiwakilishi cha kujirejelea katika umbo lake, kwa hiyo matini kuu haibadilishwi kuwa “hujilinda”; hata hivyo, muktadha unaweza kuruhusu maana hiyo, nayo imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi fupi na wazi zimetumiwa. “Mwovu” imeandikwa kwa herufi kubwa ili kuonyesha rejeo la kibinafsi, na utata wa kitheolojia katika kirai “yule aliyezaliwa na Mungu” umehifadhiwa badala ya kutatuliwa kimadhehebu.
