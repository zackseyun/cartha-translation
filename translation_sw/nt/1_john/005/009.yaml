base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/009.yaml
  text: 'If we receive the testimony of men[a], the testimony of God is greater[c][b], because this is the testimony of God: that he has testified concerning his Son.'
translation:
  language: sw
  text: 'Ikiwa tunakubali ushuhuda wa wanadamu, ushuhuda wa Mungu ni mkuu zaidi, kwa sababu huu ndio ushuhuda wa Mungu: kwamba ametoa ushuhuda kuhusu Mwana wake.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kifungu cha mwisho kinaweza pia kutafsiriwa, “kwa sababu ametoa ushuhuda kuhusu Mwana wake.”
    reason: alternative_reading
lexical_decisions:
- source_word: μαρτυρίαν / μαρτυρία
  choice: ushuhuda
  rationale: Neno hili linarudiwa mara tatu na lina maana ya ushahidi au taarifa inayothibitisha jambo. “Ushuhuda” ni la kawaida na linaendeleza urudiaji wa Kigiriki.
- source_word: ἀνθρώπων
  choice: wanadamu
  rationale: Hapa neno hilo linawahusu binadamu kwa ujumla, kwa kulinganisha ushuhuda wa kibinadamu na ushuhuda wa Mungu; “wanadamu” linaonyesha tofauti hiyo bila kuufanya usemi uwahusu wanaume pekee.
- source_word: λαμβάνομεν
  choice: tunakubali
  rationale: Katika muktadha wa kupokea ushuhuda kuwa wa kuaminika, “tunakubali” ni Kiswahili cha kawaida na huwasilisha maana ya kupokea ushuhuda, si kuupokea kama kitu cha kimwili.
- source_word: μείζων
  choice: ni mkuu zaidi
  rationale: Tafsiri hii inadumisha ulinganisho wa moja kwa moja kwamba ushuhuda wa Mungu unapita ushuhuda wa wanadamu bila kuongeza namna hasa unavyoupita.
- source_word: αὕτη ἐστὶν ἡ μαρτυρία τοῦ θεοῦ
  choice: huu ndio ushuhuda wa Mungu
  rationale: Muundo huu ni wa asili katika Kiswahili na unahifadhi msisitizo pamoja na kurudiwa kwa neno “ushuhuda.”
- source_word: μεμαρτύρηκεν
  choice: ametoa ushuhuda
  rationale: Kauli hii inaonyesha tendo lililokamilika ambalo umuhimu wake unaendelea. “Ametoa ushuhuda” pia inadumisha uhusiano wa kimsamiati na “ushuhuda.”
- source_word: περὶ τοῦ υἱοῦ αὐτοῦ
  choice: kuhusu Mwana wake
  rationale: “Kuhusu” ni tafsiri ya kawaida ya περί pamoja na jenitivi. “Mwana” linaandikwa kwa herufi kubwa kwa kuwa katika muktadha linamtaja Mwana wa Mungu.
theological_decisions:
- issue: Maana ya jumla ya ἀνθρώπων
  choice: wanadamu
  alternative: watu; wanaume
  rationale: Ingawa umbo la Kigiriki linaweza kutafsiriwa kijadi kuwa “wanaume,” hapa linarejelea ushuhuda wa kibinadamu kwa ujumla, kinyume na ushuhuda wa Mungu. “Wanadamu” linahifadhi tofauti hiyo kwa usahihi.
- issue: Kazi ya ὅτι ya pili
  choice: 'kifungu kinachoeleza yaliyomo katika ushuhuda: “kwamba ametoa ushuhuda kuhusu Mwana wake”'
  alternative: 'kifungu cha sababu: “kwa sababu ametoa ushuhuda kuhusu Mwana wake”'
  rationale: Muundo unaeleweka kwa urahisi zaidi kama ufafanuzi wa ushuhuda wa Mungu ni upi. Hata hivyo, Kigiriki kinaruhusu pia kuuchukua kama sababu, kwa hiyo uwezekano huo umewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Urudiaji wa “ushuhuda” umehifadhiwa kwa sababu ni sehemu ya msisitizo wa mstari. “Tunakubali” limetumiwa badala ya “tunapokea” ili usemi kuhusu ushuhuda usikike wa kawaida katika Kiswahili.
