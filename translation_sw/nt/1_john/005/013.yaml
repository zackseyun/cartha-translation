  text: Ταῦτα ἔγραψα ⸀ὑμῖν ἵνα εἰδῆτε ὅτι ζωὴν ⸂ἔχετε αἰώνιον⸃, ⸂τοῖς πιστεύουσιν⸃ εἰς τὸ ὄνομα τοῦ υἱοῦ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/013.yaml
  text: I have written these things to you who believe in the name of the Son of God[a], so that you may know that you have eternal life.
translation:
  language: sw
  text: Nimewaandikia mambo haya ninyi mnaoamini katika jina la Mwana wa Mungu,[a] ili mjue kwamba mna uzima wa milele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa kufuata kwa karibu zaidi mpangilio wa Kigiriki: “Nimewaandikia mambo haya ili mjue kwamba mna uzima wa milele, ninyi mnaoamini katika jina la Mwana wa Mungu.”'
    reason: Mpangilio wa Kigiriki unaweka kirai kinachowatambulisha waamini baada ya tamko kuhusu uzima wa milele.
lexical_decisions:
- source_word: Ταῦτα
  choice: mambo haya
  rationale: Kiwakilishi cha wingi wa kati kinarejelea yaliyomo katika barua au maelezo yaliyotangulia; “mambo haya” ni Kiswahili cha kawaida na huhifadhi wingi.
- source_word: ἔγραψα
  choice: nimewaandikia
  rationale: Wakati uliopita wa kiuandishi katika barua unaelezwa kwa kawaida kwa timilifu ya Kiswahili; kiambishi “-wa-” kinaingiza pia ὑμῖν kwa ufasaha.
- source_word: ἵνα εἰδῆτε
  choice: ili mjue
  rationale: “Ili” huonyesha kusudi, na “mjue” huhifadhi hali ya utegemezi inayofaa baada yake.
- source_word: ζωὴν αἰώνιον
  choice: uzima wa milele
  rationale: Ni usemi wa kawaida wa kibiblia unaohifadhi wazo la uzima na sifa yake ya kudumu.
- source_word: ἔχετε
  choice: mna
  rationale: Wakati wa sasa unaonyesha kwamba walengwa wana uzima huo sasa, si kwamba wataupata tu baadaye.
- source_word: τοῖς πιστεύουσιν εἰς
  choice: ninyi mnaoamini katika
  rationale: Kirai hiki kinatambulisha walengwa; “kuamini katika” huhifadhi muundo na nahau ya Kiyohana bila kuibadili kuwa maelezo marefu.
- source_word: τὸ ὄνομα
  choice: jina
  rationale: Huhifadhi nahau ya kibiblia inayorejelea nafsi na mamlaka yanayowakilishwa na jina.
- source_word: τοῦ υἱοῦ τοῦ θεοῦ
  choice: Mwana wa Mungu
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya cheo hiki cha Kikristo.
theological_decisions:
- issue: Mahali na uhusiano wa kisintaksia wa τοῖς πιστεύουσιν
  choice: 'Imeunganishwa na ὑμῖν: “ninyi mnaoamini katika jina la Mwana wa Mungu”'
  alternative: 'Iachwe mwishoni kama apposisheni inayorejea walengwa: “ili mjue kwamba mna uzima wa milele—ninyi mnaoamini katika jina la Mwana wa Mungu”'
  rationale: Mpangilio wa Kigiriki unaruhusu kirai hicho kusikika baada ya tamko la uhakikisho, lakini maana yake ya kawaida ni kuwatambulisha wale walioandikiwa. Tafsiri kuu inaweka kirai karibu na “ninyi” kwa Kiswahili cha asili, huku tanbihi ikihifadhi mpangilio na uwezekano wa kisintaksia wa Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Nimewaandikia” ni cha asili katika muktadha wa barua; “uzima wa milele” na “Mwana wa Mungu” huhifadhi istilahi zinazotambulika bila kuongeza msimamo wa kimadhehebu.
