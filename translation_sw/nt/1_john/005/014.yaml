id: 1JN.5.14
reference: 1 John 5:14
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ αὕτη ἐστὶν ἡ παρρησία ἣν ἔχομεν πρὸς αὐτόν, ὅτι ἐάν τι αἰτώμεθα κατὰ τὸ θέλημα αὐτοῦ ἀκούει ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/014.yaml
  text: 'And this is the confidence that we have before him: that if we ask anything according to his will[a], he hears us.'
translation:
  language: sw
  text: 'Na huu ndio ujasiri[a] tulio nao mbele zake: kwamba tukiomba chochote kulingana na mapenzi yake, yeye hutusikia.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uhakika.”
    reason: Neno la Kigiriki linaweza kuonyesha ujasiri wa wazi au uhakika wa kumkaribia Mungu.
lexical_decisions:
- source_word: παρρησία
  choice: ujasiri
  rationale: Katika muktadha wa Yohana, neno hili linaonyesha uhuru na ujasiri wa kumkaribia Mungu kwa kujiamini, si ujasiri wa hadharani tu. ‘Ujasiri’ ni neno la kawaida na lenye uzito unaofaa katika muktadha wa sala.
- source_word: πρὸς αὐτόν
  choice: mbele zake
  rationale: Kirai hiki kinaonyesha kuelekezwa kwake na kuwa katika uwepo wake. ‘Mbele zake’ ni usemi wa asili wa Kiswahili unaofaa kwa kumkaribia Mungu katika sala.
- source_word: ὅτι
  choice: kwamba
  rationale: Hapa neno hili linaanzisha maelezo ya yaliyomo katika ujasiri huo, wala halitoi sababu; kwa hiyo ‘kwamba’ linahifadhi uhusiano huo waziwazi.
- source_word: ἐάν τι αἰτώμεθα
  choice: tukiomba chochote
  rationale: Muundo huu unaeleza sharti la jumla. ‘Tukiomba chochote’ ni wa asili katika Kiswahili na unahifadhi upana wa τι.
- source_word: κατὰ τὸ θέλημα αὐτοῦ
  choice: kulingana na mapenzi yake
  rationale: ‘Kulingana na’ huonyesha kipimo au uwiano unaodokezwa na κατά, huku ‘mapenzi yake’ yakihifadhi uzito wa θέλημα bila kulifafanua kupita kiasi.
- source_word: ἀκούει ἡμῶν
  choice: yeye hutusikia
  rationale: Katika muktadha wa sala, ‘hutusikia’ humaanisha kwamba Mungu anasikia na kuyazingatia maombi. Kiwakilishi ‘yeye’ kinasisitiza mtendaji kama ulivyo mpangilio wa Kigiriki, bila kudai moja kwa moja kwamba ombi lote limetimizwa.
theological_decisions:
- issue: Maana ya Mungu kusikia sala
  choice: yeye hutusikia
  alternative: yeye hutujibu / hutupatia tunachoomba
  rationale: Mstari unasema Mungu husikia maombi yanayolingana na mapenzi yake. Tafsiri haiongezi dai kwamba kila ombi hutimizwa mara moja; hivyo inadumisha tofauti na mvutano kati ya kusikia na kutoa kilichoombwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni rahisi kueleweka kwa msomaji wa kawaida huku ikihifadhi muundo wa maelezo na sharti la maandishi ya Kigiriki.
