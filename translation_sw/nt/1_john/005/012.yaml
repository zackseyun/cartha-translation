  text: ὁ ἔχων τὸν υἱὸν ἔχει τὴν ζωήν· ὁ μὴ ἔχων τὸν υἱὸν τοῦ θεοῦ τὴν ζωὴν οὐκ ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/012.yaml
  text: The one who has the Son has life[a]; the one who does not have the Son of God does not have life.
translation:
  language: sw
  text: Yeye aliye na Mwana ana uzima[a]; yeye asiye na Mwana wa Mungu hana uzima.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uzima wa milele”; katika matumizi ya Yohana, “uzima” hapa ni uzima unaopatikana katika Mwana.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἔχων
  choice: yeye aliye na
  rationale: Kirai cha nomino chenye kitenzi-shirikishi cha wakati wa sasa humaanisha mtu anayejulikana kwa kuwa na Mwana. Muundo huu ni wa kawaida katika Kiswahili na unadumisha umoja wa jumla.
- source_word: τὸν υἱόν
  choice: Mwana
  rationale: Kifungu cha kwanza kinasema tu “Mwana”; kutokiongeza “wa Mungu” kunahifadhi tofauti ya kimakusudi kati ya vifungu viwili vya Kigiriki.
- source_word: ἔχει
  choice: anao
  rationale: “Anao” ni tafsiri ya kawaida ya ἔχει, huku kiambishi -o kikirejelea uzima na kuonyesha kwa uwazi kuwa mtu huyo anao uzima.
- source_word: τὴν ζωήν
  choice: uzima
  rationale: “Uzima” hubeba maana ya ζωή katika matumizi ya Yohana na hufaa zaidi kuliko “maisha” inapozungumziwa hali ya kiroho inayopatikana katika Mwana, bila kuongeza neno “wa milele” lisilopo katika mstari huu.
- source_word: ὁ μὴ ἔχων
  choice: yeye asiye na
  rationale: Muundo huu unakanusha kirai cha mtu kwa njia ya kawaida na yenye ulinganifu na “yeye aliye na.”
- source_word: τὸν υἱὸν τοῦ θεοῦ
  choice: Mwana wa Mungu
  rationale: Huhifadhi wazi cheo kamili cha Kikristo na uhusiano wa nomino tegemezi uliomo katika Kigiriki.
- source_word: οὐκ ἔχει
  choice: hana
  rationale: “Hana” ni ukanushi wa kawaida na mfupi wa “ana,” na unahifadhi upinzani wenye nguvu kati ya vifungu viwili.
theological_decisions:
- issue: Maana ya ζωή katika muktadha wa Yohana
  choice: Kutafsiri ζωή kuwa “uzima” bila kupanua kuwa “uzima wa milele” katika matini kuu.
  alternative: uzima wa milele
  rationale: Katika maandishi ya Yohana, ζωή mara nyingi humaanisha uzima wa milele unaopatikana katika Mwana, lakini mstari huu wenyewe unasema ζωή tu. Tanbihi inaeleza maana hiyo pana bila kuongeza maneno katika matini.
- issue: Umoja wa jumla katika virai ὁ ἔχων na ὁ μὴ ἔχων
  choice: Kutumia “yeye aliye...” na “yeye asiye...” kama marejeo ya mtu yeyote.
  alternative: kila aliye... / yeyote aliye...
  rationale: Muundo huu huhifadhi umoja na ulinganifu wa Kigiriki huku ukieleweka kuwa unawahusu watu wote bila kuingiza tofauti ya kijinsia isiyokusudiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Ulinganifu wa vifungu viwili umehifadhiwa, pamoja na tofauti kati ya “Mwana” na “Mwana wa Mungu.”
