  text: αὕτη γάρ ἐστιν ἡ ἀγάπη τοῦ θεοῦ ἵνα τὰς ἐντολὰς αὐτοῦ τηρῶμεν, καὶ αἱ ἐντολαὶ αὐτοῦ βαρεῖαι οὐκ εἰσίν,
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/003.yaml
  text: 'For this is the love of God: that we keep his commandments[a], and his commandments are not burdensome.'
translation:
  language: sw
  text: 'Kwa maana hivi ndivyo kumpenda Mungu[a] kulivyo: kuzishika amri zake; na amri zake si za kulemea.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “upendo wa Mungu.” Kirai cha Kigiriki kinaweza kumaanisha upendo unaoelekezwa kwa Mungu au upendo wa Mungu kwa waumini, ingawa muktadha wa karibu unapendelea maana ya “kumpenda Mungu.”
    reason: alternative_reading
lexical_decisions:
- source_word: αὕτη
  choice: ni hivi
  rationale: Kiashiria hiki kinaelekeza mbele kwenye maelezo yanayofuata; “ni hivi” ni Kiswahili cha kawaida na chenye uwazi.
- source_word: γάρ
  choice: Kwa maana
  rationale: Kinaonyesha kwamba sentensi hii inatoa msingi au maelezo ya kauli iliyotangulia.
- source_word: ἀγάπη τοῦ θεοῦ
  choice: kumpenda Mungu
  rationale: Muktadha wa mistari ya 2–3 unapendelea maana ya upendo unaoelekezwa kwa Mungu. Muundo wa kitenzi ni wa asili zaidi katika Kiswahili kuliko “upendo kwa Mungu,” huku tanbihi ikihifadhi uwezekano mwingine wa kirai cha Kigiriki.
- source_word: ἵνα
  choice: kwamba
  rationale: Hapa linaanzisha maelezo ya kile ambacho kumpenda Mungu kunahusisha, si kusudi tu.
- source_word: ἐντολάς
  choice: amri
  rationale: “Amri” ni neno la kawaida na lenye uzito unaofaa kwa maagizo yenye mamlaka.
- source_word: τηρῶμεν
  choice: tunazishika
  rationale: Kitenzi hiki katika maandishi ya Yohana humaanisha kuzitunza au kuzifuata amri; “kuzishika” huhifadhi maana hiyo na ni usemi uliozoeleka.
- source_word: βαρεῖαι
  choice: nzito
  rationale: Neno la Kigiriki lina taswira ya uzito na kwa njia ya sitiari humaanisha jambo linalolemea au lililo gumu kubeba; “nzito” huhifadhi taswira hiyo kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Maana ya umilikishi katika ἡ ἀγάπη τοῦ θεοῦ
  choice: Upendo wa waumini kwa Mungu (“kumpenda Mungu”)
  alternative: Upendo wa Mungu kwa waumini; au kirai kinachokusudia maana zote mbili
  rationale: Mstari uliotangulia unaunganisha kumpenda Mungu na kutenda amri zake, na mstari huu unafafanua upendo huo kuwa kuzishika amri zake. Hivyo muktadha unapendelea upendo unaoelekezwa kwa Mungu, lakini tanbihi inahifadhi utata halisi wa muundo wa Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo “nazo amri zake” unaendeleza msisitizo wa Kigiriki bila kuwa mgumu, na “si nzito” huhifadhi sitiari ya chanzo.
