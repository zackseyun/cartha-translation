lexical_decisions:
- source_word: ὅτι
  choice: Kwa maana
  rationale: Katika muktadha huu neno hili linaanzisha maelezo ya dai lililotangulia; “Kwa maana” huonyesha uhusiano huo kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: τρεῖς
  choice: watatu
  rationale: Ni namba ya kawaida; ngeli ya watu imetumiwa kwa sababu kirai kinachofuata kinawasilisha hao watatu kama wanaotoa ushuhuda.
- source_word: εἰσιν
  choice: wako
  rationale: Hapa kitenzi cha kuwapo kinaonyesha kwamba kuna watatu; “wako” kinaendana kiasili na “watatu” bila kuhitaji kuongeza neno lisilo katika chanzo.
- source_word: οἱ μαρτυροῦντες
  choice: wanaoshuhudia
  rationale: Kirai hiki ni kivumishi-ushiriki chenye kibainishi kinachotumika kama nomino, yaani ‘wale wanaoshuhudia.’ “Wanaoshuhudia” huhifadhi tendo la ushuhuda na hali yake ya kuendelea kwa Kiswahili fasaha.
theological_decisions:
- issue: Muundo wa maandishi wa 1 Yohana 5:7 na Comma Johanneum
  choice: 'Kutafsiri maandishi mafupi ya SBLGNT pekee katika mstari mkuu: “Kwa maana wako watatu wanaoshuhudia,”'
  alternative: 'Mapokeo ya baadaye ya Textus Receptus/KJV yanaongeza: “mbinguni: Baba, Neno, na Roho Mtakatifu; na hawa watatu ni mmoja. Na wako watatu wanaoshuhudia duniani ...”'
  rationale: Chanzo cha Kigiriki kilichotolewa kina usomaji mfupi. Nyongeza ndefu ya Utatu haimo katika ushahidi wa mapema zaidi wa hati za Kigiriki wala katika maandishi ya SBLGNT. Kwa hiyo usomaji wa chanzo umewekwa katika mstari mkuu, huku usomaji wa baadaye wenye umuhimu wa kihistoria ukielezwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, rahisi kueleweka na chenye hadhi. Koma imehifadhiwa kwa sababu sentensi inaendelea katika mstari unaofuata.
