  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Baadhi ya hati za baadaye zinaongeza usomaji mrefu ambao mara nyingi huitwa Comma Johanneum: “mbinguni: Baba, Neno, na Roho Mtakatifu; na hawa watatu ni mmoja. Na wako watatu wanaoshuhudia duniani ...” Maneno haya hayamo katika hati za Kigiriki za mapema zaidi wala hayajajumuishwa katika maandishi ya SBLGNT.'
