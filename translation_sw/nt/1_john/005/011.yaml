  yaml_path: translation/nt/1_john/005/011.yaml
  text: 'And this is the testimony: that God has given us eternal life[c][b][a], and this life is in his Son.'
translation:
  language: sw
  text: 'Na huu ndio ushuhuda: kwamba Mungu ametupa[a] uzima wa milele, na uzima huu uko katika Mwana wake.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mungu alitupa uzima wa milele.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μαρτυρία
  choice: ushuhuda
  rationale: Neno hili linaonyesha yaliyotolewa kuwa ushahidi, na linafaa katika muktadha wa Yohana kuliko neno linaloweza kumaanisha shahidi mwenyewe.
- source_word: ὅτι
  choice: ':'
  rationale: Nukta mbili zinaanzisha kwa njia ya kawaida ya Kiswahili maudhui ya ushuhuda unaotajwa, bila kuongeza ufafanuzi usiomo katika Kigiriki.
- source_word: ζωὴν αἰώνιον
  choice: uzima wa milele
  rationale: Huu ndio usemi wa kawaida na wenye hadhi katika Kiswahili kwa dhana ya Kiyohana ya uzima unaotoka kwa Mungu na usio na mwisho.
- source_word: ἔδωκεν
  choice: ametupa
  rationale: Wakati timilifu wa Kiswahili unaonyesha tendo la Mungu lililotimizwa ambalo matokeo yake yanaendelea kuwapo sasa.
- source_word: ὁ θεὸς
  choice: Mungu
  rationale: Ni tafsiri ya moja kwa moja ya mtenda bila kuongeza maelezo.
- source_word: ἡμῖν
  choice: -tu-
  rationale: Kiambishi cha yambwa katika 'ametupa' kinawakilisha kwa kawaida na kwa usahihi maana ya 'sisi' kama wapokeaji.
- source_word: ἐν τῷ υἱῷ αὐτοῦ
  choice: umo ndani ya Mwana wake
  rationale: Huhifadhi kihusishi ἐν na usemi mzito wa Kiyohana kwamba uzima unapatikana katika Mwana, bila kuupunguza kuwa 'kupitia' au 'pamoja na'.
- source_word: υἱῷ
  choice: Mwana
  rationale: Herufi kubwa inaonyesha kuwa hili ni jina la cheo la kiKristo linalomhusu Mwana wa Mungu.
- source_word: αὕτη ... αὕτη ἡ ζωή
  choice: huu ... uzima huu
  rationale: Marudio ya kiashiria yamehifadhiwa ili kuendeleza msisitizo na mshikamano wa sentensi ya Kigiriki.
theological_decisions:
- issue: Nguvu ya wakati wa ἔδωκεν kuhusiana na umilikaji wa sasa wa uzima
  choice: ametupa uzima wa milele
  alternative: alitupa uzima wa milele
  rationale: '''Ametupa'' huwasilisha tendo lililotimizwa pamoja na matokeo yake ya sasa, bila kuingiza mfumo wa mafundisho usiotajwa katika mstari.'
- issue: Maana ya uzima kuwa ἐν τῷ υἱῷ αὐτοῦ
  choice: umo ndani ya Mwana wake
  alternative: uko kwa Mwana wake; unapatikana kupitia Mwana wake
  rationale: Tafsiri hii huhifadhi usemi wa Kigiriki na mvutano wake wa kimahusiano na kilokativu, badala ya kuufafanua kwa namna inayobana maana.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Umo ndani ya Mwana wake' limetumiwa kwa makusudi kuhifadhi usemi wa Kiyohana, ingawa ni mzito kidogo kuliko Kiswahili cha mazungumzo.
