base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/002.yaml
  text: and the life was revealed[a], and we have seen and testify and proclaim to you the eternal life[b], which was with the Father and was revealed to us—
translation:
  language: sw
  text: na uzima ulidhihirishwa[a], nasi tumeuona, tunashuhudia na tunawatangazia uzima wa milele[b], uliokuwa pamoja na Baba na ulidhihirishwa kwetu—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ulionekana” au “ulifunuliwa wazi” kwa neno ἐφανερώθη.
    reason: lexical_alternative
  - marker: b
    text: Kisarufi, usemi “uzima wa milele” umetolewa kama kitu; lakini katika muktadha unamrejelea Mwana binafsi, aliyekuwa pamoja na Baba na kudhihirishwa kwa mitume.
    reason: cross_reference
lexical_decisions:
- source_word: ἡ ζωὴ / τὴν ζωὴν
  choice: uzima
  rationale: Neno “uzima” linahifadhi urudiaji wa ζωὴ na uzito wake kama uhalisi maalumu unaohusishwa na Mwana. Kiswahili hakihitaji kibainishi kinacholingana moja kwa moja na artikeli ya Kigiriki.
- source_word: ἐφανερώθη
  choice: ulidhihirishwa / kudhihirishwa
  rationale: “Kudhihirishwa” linaakisi hali ya kutendwa katika Kigiriki na wazo la kufanywa wazi; pia linafaa kwa uzima unaofunuliwa kwa mashahidi.
- source_word: ἑωράκαμεν
  choice: tumeuona
  rationale: Wakati timilifu wa Kiswahili unaonyesha tendo la kuona lililotimia ambalo umuhimu wake unaendelea, huku kiambishi “u” kikirejelea “uzima.”
- source_word: μαρτυροῦμεν
  choice: tunashuhudia
  rationale: Hili ni neno la kawaida na lenye hadhi linalohifadhi maana ya kutoa ushahidi wa walichokiona.
- source_word: ἀπαγγέλλομεν
  choice: kuwatangazia
  rationale: “Kuwatangazia” linatofautisha tangazo kwa wasikilizaji na tendo la kushuhudia, na linadumisha nguvu ya taarifa ya wazi.
- source_word: ὑμῖν
  choice: ninyi
  rationale: Kiwakilishi kimewekwa wazi baada ya “kuwatangazia” ili kusisitiza walengwa kama inavyofanya Kigiriki.
- source_word: τὴν ζωὴν τὴν αἰώνιον
  choice: uzima wa milele
  rationale: Huu ndio usemi wa asili na unaoeleweka katika Kiswahili kwa uhai usio na mwisho; muktadha unaufanya kuwa uzima maalumu.
- source_word: ἥτις
  choice: uliokuwa
  rationale: Upatanisho wa ngeli unarejelea kisarufi neno “uzima” bila kubadili usemi kuwa kiwakilishi cha mtu na hivyo bila kuondoa mvutano wa kimakusudi wa kifungu.
- source_word: ἦν πρὸς τὸν πατέρα
  choice: ulikuwa pamoja na Baba
  rationale: “Pamoja na Baba” ni Kiswahili cha kawaida kinachoonyesha uhusiano na ukaribu bila kuongeza ufafanuzi wa kimafundisho.
- source_word: τὸν πατέρα
  choice: Baba
  rationale: Herufi kubwa inaonyesha kuwa “Baba” hapa ni cheo cha Mungu.
- source_word: ἡμῖν
  choice: kwetu
  rationale: Hili linaweka wazi wapokeaji wa udhihirisho na kudumisha msisitizo juu ya ushuhuda wa walioona.
theological_decisions:
- issue: Iwapo “uzima” ugeuzwe wazi kuwa rejeleo la mtu
  choice: Kudumisha “uzima” na “uzima wa milele” katika matini kuu
  alternative: Kutumia “yeye” au kumtaja Mwana moja kwa moja
  rationale: Kigiriki kinatumia nomino ζωὴ, si jina la Mwana wala kiwakilishi wazi cha kiume. Tafsiri inadumisha taswira ya Yohana na kuruhusu muktadha kuonyesha rejeleo lake la kibinafsi.
- issue: Jinsi ya kuonyesha kuwako kwake kabla pamoja na Baba
  choice: ulikuwa pamoja na Baba
  alternative: ulikuwa mbele za Baba
  rationale: Usemi huu unathibitisha uhusiano wake na Baba kwa kufuata πρὸς τὸν πατέρα bila kupanua kifungu kwa maelezo ya kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo unadumisha mfululizo wa vitenzi vya ushuhuda na dashibodi ya mwisho inayoonyesha kwamba sentensi inaendelea kutoka mstari uliotangulia na kuelekea unaofuata.
