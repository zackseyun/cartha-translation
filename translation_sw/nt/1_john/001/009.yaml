review_pass:
  verdict: revise
  source_fidelity: 'The conditional opening and the renderings of confession, sins, faithfulness, forgiveness, and cleansing are substantially faithful. However, "kutokana na uovu wote" is not a secure rendering of ἀπὸ πάσης ἀδικίας: kutokana na commonly means "because of/resulting from," rather than the source''s separative "from." The future indicative "atatusamehe" also makes the consequence more unconditionally assertive than the Greek ἵνα + subjunctive construction.'
  naturalness: The draft is generally clear Standard East African Swahili. "Yeye ni mwaminifu na mwenye haki, hata atusamehe ..." is a natural literary-biblical construction that better retains the relation expressed by ἵνα without the stiffness of "ili atusamehe" after the adjectives. "Kututakasa na uovu wote" is idiomatic in this register.
  terminology: '"Kuungama," "dhambi," "mwaminifu," and "mwenye haki" are appropriate. The alternative "mwadilifu" is valid for δίκαιος and should remain footnoted. "Kutakasa" is especially apt for καθαρίζω in this moral-theological context. "Uovu" retains broad moral scope, though it is less formally cognate with "haki" than "udhalimu."'
  issues:
  - severity: medium
    issue: The phrase "kutokana na uovu wote" does not reliably express ἀπὸ πάσης ἀδικίας.
    rationale: 'In contemporary Standard Swahili, "kutokana na" commonly marks cause or derivation ("because of/arising from"). The Greek ἀπό marks separation: cleansing us from all unrighteousness. "Kututakasa na uovu wote" idiomatically conveys removal of moral defilement.'
  - severity: low
    issue: '"Atatusamehe" weakens the dependent/subjunctive force of ἵνα ἀφῇ.'
    rationale: Although the Greek clause can express intended result and does not require a wooden purpose clause in Swahili, the independent future can sound like an unqualified prediction. "Hata atusamehe ... na kututakasa ..." is natural and preserves the dependent result/purpose relationship.
  revised_text: 'Tukiziungama dhambi zetu, yeye ni mwaminifu na mwenye haki[a], hata atusamehe dhambi zetu na kututakasa na uovu wote.


    [a] Au, *mwadilifu*.'
