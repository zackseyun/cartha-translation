  - marker: a
    text: Au, *mwadilifu*.
    reason: Mbadala halali wa kileksika kwa δίκαιος, unaohifadhi maana inayoweza kuelekea haki katika kutenda.
  revision_rationale: Revision corrects the directional meaning of ἀπό and uses a natural dependent Swahili verb form to reflect the Greek ἵνα + subjunctive without over-specifying whether the nuance is purpose or result. No doctrinal interpretation has been added.
