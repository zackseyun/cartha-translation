  text: ἐὰν ὁμολογῶμεν τὰς ἁμαρτίας ἡμῶν, πιστός ἐστιν καὶ δίκαιος ἵνα ἀφῇ ἡμῖν τὰς ἁμαρτίας καὶ καθαρίσῃ ἡμᾶς ἀπὸ πάσης ἀδικίας.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/009.yaml
  text: If we confess our sins[a], he is faithful and righteous to forgive us our sins and to cleanse us from all unrighteousness.
translation:
  language: sw
  text: 'Tukiziungama dhambi zetu, yeye ni mwaminifu na mwenye haki[a], hata atusamehe dhambi zetu na kututakasa na uovu wote.


    [a] Au, *mwadilifu*.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, *mwadilifu*.
    reason: Mbadala halali wa kileksika kwa δίκαιος, unaohifadhi maana inayoweza kuelekea haki katika kutenda.
lexical_decisions:
- source_word: ἐὰν
  choice: Tuki-
  rationale: Kiambishi cha masharti “-ki-” kinahifadhi maana ya sharti bila kudokeza kwamba jambo hilo hutokea kwa kurudiwa kila mara.
- source_word: ὁμολογῶμεν
  choice: tukiziungama
  rationale: “Kuungama” ni neno la kawaida na lenye uzito unaofaa kwa kukiri dhambi kwa wazi.
- source_word: τὰς ἁμαρτίας ἡμῶν
  choice: dhambi zetu
  rationale: Hii ni tafsiri ya moja kwa moja, ya kawaida, ya nomino na kiwakilishi kimilikishi.
- source_word: πιστός
  choice: mwaminifu
  rationale: Neno hili linaonyesha kuwa Mungu hutegemeka na ni thabiti katika tabia na ahadi zake.
- source_word: δίκαιος
  choice: mwenye haki
  rationale: Kauli hii inahifadhi wigo wa tabia ya Mungu iliyo sawa na njema bila kuibana maana katika haki ya kimahakama pekee.
- source_word: ἵνα ἀφῇ
  choice: atatusamehe
  rationale: Katika Kiswahili cha kawaida, kauli hii huonyesha matokeo yanayotokana na uaminifu na haki yake, huku ikiepuka muundo usio wa kawaida wa “ili atusamehe” baada ya vivumishi.
- source_word: ἡμῖν τὰς ἁμαρτίας
  choice: atatusamehe dhambi zetu
  rationale: Muundo huu ni wa kawaida katika Kiswahili na unawakilisha yambwa ya mtu pamoja na yambwa ya jambo linalosamehewa.
- source_word: καθαρίσῃ
  choice: kutusafisha
  rationale: “Kusafisha” huhifadhi taswira ya kuondolewa kwa uchafu wa kimaadili na inaendana na msamaha katika sentensi.
- source_word: ἀπὸ πάσης ἀδικίας
  choice: kutokana na uovu wote
  rationale: “Uovu” ni neno la kawaida lenye wigo mpana wa kutenda yaliyo kinyume cha haki; “kutokana na” huonyesha kwa uwazi kile tunachosafishwa nacho.
theological_decisions:
- issue: Maana ya δίκαιος kuhusiana na msamaha wa Mungu
  choice: mwenye haki
  alternative: mwadilifu
  rationale: “Mwenye haki” huhifadhi wazo pana la tabia ya Mungu iliyo sawa na njema. “Mwadilifu” pia ni tafsiri halali na inaweza kusisitiza haki katika kutenda; kwa hiyo imehifadhiwa katika tanbihi.
- issue: Uhusiano wa ἵνα na uaminifu na haki ya Mungu
  choice: atatusamehe ... na kutusafisha
  alternative: ili atusamehe ... na kutusafisha
  rationale: Muundo wa Kigiriki unaweza kueleweka kwa upande wa kusudi au matokeo. Kiswahili cha moja kwa moja kinaonyesha msamaha na utakaso kama yanayotokana na tabia ya Mungu bila kulazimisha tofauti hiyo ya kisarufi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye heshima lakini kinachoeleweka kwa urahisi. “Kuungama,” “dhambi,” na “mwenye haki” ni maneno yanayotambulika katika muktadha wa kibiblia bila kuwa ya dhehebu fulani.
