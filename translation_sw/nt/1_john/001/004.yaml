lexical_decisions:
- source_word: καὶ
  choice: Nasi
  rationale: Kiunganishi kinaendeleza hoja iliyotangulia; pamoja na ἡμεῖς, “Nasi” huunganisha sentensi na kudokeza msisitizo wa kiwakilishi bila kufanya Kiswahili kuwa kizito.
- source_word: ταῦτα
  choice: mambo haya
  rationale: Huhifadhi wingi wa kiwakilishi cha kuonyesha na kurejelea yaliyomo katika ujumbe unaoandikwa.
- source_word: γράφομεν
  choice: tunawaandikia
  rationale: Wakati uliopo unaeleza tendo la sasa la kuandika. Kitenzi “-andikia” ni cha kawaida katika muktadha wa barua na huweka wazi walengwa wanaodokezwa, ingawa Kigiriki hakina kiwakilishi huru cha yambwa hapa.
- source_word: ἡμεῖς
  choice: nasi
  rationale: Kiwakilishi kilichotajwa wazi katika Kigiriki kina msisitizo; “nasi” huhifadhi uwepo na msisitizo huo kwa Kiswahili cha asili.
- source_word: ἵνα
  choice: ili
  rationale: Huonyesha kusudi au matokeo yanayokusudiwa kwa ufupi na kwa kawaida katika Kiswahili.
- source_word: χαρά
  choice: furaha
  rationale: Hii ndiyo maana ya kawaida na inayofaa katika matumizi ya Yohana.
- source_word: ἡμῶν
  choice: yetu
  rationale: Hufuata moja kwa moja usomaji wa SBLGNT, ἡμῶν, yaani nafsi ya kwanza wingi.
- source_word: ᾖ πεπληρωμένη
  choice: iwe kamili
  rationale: Huonyesha hali ya kufikia utimilifu inayotokana na muundo wa kitenzi kishirikishi pamoja na participio timilifu; ni Kiswahili wazi na cha asili.
theological_decisions:
- issue: Kiwakilishi katika ἡ χαρὰ ἡμῶν
  choice: furaha yetu
  alternative: furaha yenu
  rationale: Maandishi ya Kigiriki yaliyotolewa yanasoma ἡμῶν (“yetu”). Usomaji “yenu” ni tofauti muhimu ya maandishi na kwa hiyo umehifadhiwa katika tanbihi badala ya kuingizwa katika andiko kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Muundo ni mfupi kama Kigiriki, huku “Nasi” ikihifadhi uhusiano na sentensi iliyotangulia na msisitizo wa ἡμεῖς.
