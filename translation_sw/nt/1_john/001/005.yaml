id: 1JN.1.5
reference: 1 John 1:5
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ ἔστιν αὕτη ἡ ἀγγελία ἣν ἀκηκόαμεν ἀπ’ αὐτοῦ καὶ ἀναγγέλλομεν ὑμῖν, ὅτι ὁ θεὸς φῶς ἐστιν καὶ σκοτία ⸂ἐν αὐτῷ οὐκ ἔστιν⸃ οὐδεμία.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/005.yaml
  text: 'And this is the message that we have heard from him and announce to you: that God is light[a], and there is no darkness at all in him.'
translation:
  language: sw
  text: 'Na huu ndio ujumbe tuliousikia kutoka kwake na tunaowatangazia: Mungu ni nuru, wala ndani yake hamna giza lolote.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγγελία
  choice: ujumbe
  rationale: “Ujumbe” ni Kiswahili cha kawaida na cha sasa kinachofaa kwa habari iliyopokewa na kutangazwa; “tangazo” lingeweza kusisitiza zaidi tendo la kutangaza kuliko yaliyomo.
- source_word: ἀκηκόαμεν
  choice: tuliousikia
  rationale: Kauli hii inaonyesha tendo lililokamilika la kusikia ambalo matokeo yake yanaendelea; muundo wa Kiswahili unaunganisha ujumbe na kusikia kwa njia ya asili bila kuongeza maelezo.
- source_word: ἀπ’ αὐτοῦ
  choice: kutoka kwake
  rationale: Inahifadhi kiwakilishi cha Kigiriki bila kukibadili kuwa “Yesu” au “Mwana,” hivyo haiongezi ufafanuzi usiotajwa wazi katika mstari.
- source_word: ἀναγγέλλομεν
  choice: tunaowatangazia
  rationale: “Kutangaza” huwasilisha tendo la kuwajulisha wengine ujumbe uliopokewa na pia hudumisha uhusiano wa kimaana na “ujumbe.”
- source_word: ὁ θεὸς φῶς ἐστιν
  choice: Mungu ni nuru
  rationale: Inahifadhi sitiari ya moja kwa moja na maana ya sifa/asili ya kauli ya Kigiriki, bila kuongeza “nuru ile,” “nuru safi,” au “nuru takatifu.”
- source_word: σκοτία
  choice: giza
  rationale: “Giza” ni neno la kawaida linalohifadhi uwezo wa kueleweka kihalisi na kisitiari katika maandishi ya Yohana.
- source_word: ἐν αὐτῷ
  choice: ndani yake
  rationale: Muundo huu ni wa asili katika Kiswahili na huhifadhi nguvu ya kisitiari ya uwepo wa giza ndani yake bila kuifafanua kupita kiasi.
- source_word: οὐδεμία
  choice: lolote
  rationale: 'Pamoja na “hamna,” neno “lolote” linaonyesha mkazo wa ukanushi kamili: hakuna giza hata kidogo.'
theological_decisions:
- issue: Kauli ya kisitiari “Mungu ni nuru”
  choice: 'Sitiari imehifadhiwa moja kwa moja: “Mungu ni nuru.”'
  alternative: “Mungu ni nuru safi” au “Mungu ni nuru takatifu.”
  rationale: Maandishi ya Kigiriki hayafafanui nuru kuwa usafi au utakatifu pekee. Kuacha sitiari ikiwa wazi huhifadhi upana wake wa kiteolojia na nguvu yake ya kifasihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. “Na huu ndio” huhifadhi mwanzo wa kuunganisha wa Καί; “wala” huleta kwa kawaida ukanushi wa pili wenye mkazo.
