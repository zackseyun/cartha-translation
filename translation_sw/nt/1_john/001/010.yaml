  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐὰν εἴπωμεν ὅτι οὐχ ἡμαρτήκαμεν, ψεύστην ποιοῦμεν αὐτὸν καὶ ὁ λόγος αὐτοῦ οὐκ ἔστιν ἐν ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/010.yaml
  text: If we say that we have not sinned[a], we make him a liar[b], and his word is not in us.
translation:
  language: sw
  text: Tukisema kwamba hatujatenda dhambi[a], tunamfanya kuwa mwongo, na neno lake[b] halimo ndani yetu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hatukutenda dhambi.” Kiyunani kinatumia kitenzi cha wakati timilifu, ambacho hapa kwa kawaida huonyesha tendo la zamani lenye umuhimu wa sasa.
    reason: lexical_alternative
  - marker: b
    text: “Neno lake” pia laweza kutafsiriwa “ujumbe wake.” Neno la Kiyunani λόγος linaweza kuwa na maana mojawapo kati ya hizo; “neno” limehifadhiwa ili kuendeleza msamiati wa Yohana.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν εἴπωμεν
  choice: Tukisema
  rationale: Muundo huu wa masharti unaelezwa kwa Kiswahili cha kawaida kwa ‘Tukisema,’ bila kuongeza maana ya kudai kwa msisitizo.
- source_word: οὐχ ἡμαρτήκαμεν
  choice: hatujatenda dhambi
  rationale: Kauli ya wakati timilifu ya Kiyunani inaonyesha tendo la zamani lenye umuhimu wa sasa. Umbo la Kiswahili ‘hatujatenda’ linaendeleza vizuri uhusiano huo bila kuongeza neno ‘kamwe.’
- source_word: ψεύστην
  choice: mwongo
  rationale: Neno hili ni nomino inayomtaja mtu asemaye uongo; ‘mwongo’ linahifadhi nguvu yake ya moja kwa moja.
- source_word: ποιοῦμεν αὐτὸν
  choice: tunamfanya kuwa
  rationale: Kirai hiki kina maana ya kumweka au kumtangaza mtu kuwa kitu fulani. Kiambishi cha yambwa ‘-m-’ kinawakilisha kiwakilishi ‘yeye’ kwa Kiswahili cha kawaida bila msisitizo usiohitajika.
- source_word: ὁ λόγος αὐτοῦ
  choice: neno lake
  rationale: λόγος linaweza kumaanisha ‘neno’ au ‘ujumbe.’ ‘Neno lake’ linahifadhi msamiati mpana wa Yohana pamoja na uwezekano wa kumaanisha ukweli wa Mungu au ujumbe wake.
- source_word: οὐκ ἔστιν ἐν ἡμῖν
  choice: halimo ndani yetu
  rationale: Tafsiri hii inahifadhi wazo la kuwa ndani yetu bila kuongeza taswira ya kukaa ambayo haijaelezwa wazi katika Kiyunani.
theological_decisions:
- issue: Rejeo la αὐτόν / αὐτοῦ
  choice: Viwakilishi vinamrejelea Mungu kulingana na muktadha, lakini jina ‘Mungu’ halijaingizwa katika matini.
  alternative: Kutaja ‘Mungu’ moja kwa moja badala ya viwakilishi.
  rationale: Muktadha wa 1 Yohana 1:5–10 unaonyesha kwamba ushuhuda unaopingwa ni wa Mungu. Hata hivyo, Kiyunani kinatumia viwakilishi, kwa hiyo tafsiri inavihifadhi ili isifafanue zaidi ya matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni ya moja kwa moja na inaeleweka kwa wasomaji wa kawaida; ‘halimo ndani yetu’ linahifadhi usemi wa ndani unaopatikana katika maandishi ya Yohana.
