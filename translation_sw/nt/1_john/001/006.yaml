  text: ἐὰν εἴπωμεν ὅτι κοινωνίαν ἔχομεν μετ’ αὐτοῦ καὶ ἐν τῷ σκότει περιπατῶμεν, ψευδόμεθα καὶ οὐ ποιοῦμεν τὴν ἀλήθειαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/006.yaml
  text: If we say that we have fellowship with him and yet walk in the darkness[b][a], we are lying and are not practicing the truth.
translation:
  language: sw
  text: Tukisema kwamba tuna ushirika naye, na huku tunaenenda katika giza[a], tunasema uongo, wala hatuitendi kweli[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “gizani.” Kiyunani kina kibainishi, “katika giza hilo,” ambacho katika matumizi ya Yohana kinaweza kukazia giza kama hali inayompinga Mungu.
    reason: lexical_alternative
  - marker: b
    text: Kwa neno kwa neno, “wala hatufanyi kweli.” Huu ni usemi wa Kiyunani unaohusu kweli inayotendwa, si inayosemwa tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν εἴπωμεν
  choice: Tukisema
  rationale: Muundo huu wa masharti ni wa kawaida katika Kiswahili na unadumisha maana ya ‘ikiwa tunasema’ bila kuongeza wazo la kudai.
- source_word: κοινωνίαν ἔχομεν
  choice: tuna ushirika
  rationale: ‘Ushirika’ huonyesha kushiriki uhusiano wa karibu, na muundo wa ‘kuwa na ushirika’ unaakisi vizuri nahau ya Kiyunani.
- source_word: μετ’ αὐτοῦ
  choice: naye
  rationale: Inadumisha kiwakilishi cha Kiyunani badala ya kukibadili waziwazi kuwa ‘Mungu,’ ingawa ndiye anayetajwa katika muktadha.
- source_word: καὶ ἐν τῷ σκότει περιπατῶμεν
  choice: na huku tunaenenda gizani
  rationale: ‘Na huku’ huwasilisha kwa kawaida mvutano wa kimuktadha wa καί, na ‘tunaenenda’ inadumisha sitiari ya mwenendo wa maisha badala ya kuifafanua kuwa dhambi moja kwa moja.
- source_word: ψευδόμεθα
  choice: tunasema uongo
  rationale: Hii ni kauli ya asili na wazi ya Kiswahili inayoonyesha kwamba maneno yetu ni ya uongo; hailegezi nguvu ya kitenzi kuwa hali ya kutokuwa wakweli tu.
- source_word: οὐ ποιοῦμεν τὴν ἀλήθειαν
  choice: wala hatuishi kwa kuifuata kweli
  rationale: Nahau ya Kiyunani ‘kutenda kweli’ si ya kawaida katika Kiswahili. Tafsiri hii hudumisha wazo la kweli inayotekelezwa katika mwenendo, huku tanbihi ikihifadhi umbo halisi zaidi.
theological_decisions:
- issue: Sitiari ya kimaadili na kiroho ya giza
  choice: Kudumisha ‘tunaenenda gizani’
  alternative: tunaishi katika dhambi
  rationale: Katika maandishi ya Yohana, giza linahusisha uovu, uongo, na kutengwa na Mungu. Kudumisha sitiari huepuka kuifungia katika ufafanuzi mmoja tu.
- issue: Kweli kama jambo linalotekelezwa
  choice: hatuishi kwa kuifuata kweli
  alternative: hatuitendi kweli
  rationale: Kifungu hiki kinaunganisha kweli na mwenendo, si kauli sahihi pekee. Tafsiri kuu inaifanya nahau ieleweke kwa Kiswahili bila kuondoa mvutano wake wa kimaadili; umbo la neno kwa neno limetolewa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Tunaenenda’ limetumiwa kwa makusudi ili kuhifadhi sitiari ya kibiblia ya mwenendo wa maisha; muktadha hufanya maana yake ieleweke. Alama zote za tanbihi zimewekwa mahali panapohusika katika matini.
