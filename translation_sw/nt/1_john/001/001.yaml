id: 1JN.1.1
reference: 1 John 1:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ὃ ἦν ἀπ’ ἀρχῆς, ὃ ἀκηκόαμεν, ὃ ἑωράκαμεν τοῖς ὀφθαλμοῖς ἡμῶν, ὃ ἐθεασάμεθα καὶ αἱ χεῖρες ἡμῶν ἐψηλάφησαν, περὶ τοῦ λόγου τῆς ζωῆς—
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/001.yaml
  text: What was from the beginning[a], what we have heard, what we have seen with our eyes, what we looked upon and our hands have touched[b], concerning the word of life—
translation:
  language: sw
  text: Kile kilichokuwako tangu mwanzo[a], kile tulichokisikia, kile tulichokiona kwa macho yetu, kile tulichokitazama, na ambacho mikono yetu ilikigusa, kuhusu neno la uzima[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kile ambacho kilikuwako tangu mwanzo.” Kigiriki kinatumia kiwakilishi cha jinsia ya kati; huenda kinarejelea kwa upana ushuhuda wa mitume kuhusu Mwana badala ya kumtaja moja kwa moja kuwa “Yeye.”
    reason: alternative_reading
  - marker: b
    text: Au, “Neno la uzima.” Usemi huu unaweza kumrejelea Mwana mwenyewe, ukiwa na mwangwi wa makusudi wa Yohana 1:1, au ujumbe unaoleta uzima unaomhusu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὃ / ὃ
  choice: Kile / ambacho
  rationale: Viwakilishi hivi vinadumisha upana wa kiwakilishi cha Kigiriki cha jinsia isiyo ya kiume wala ya kike, badala ya kumtaja mhusika moja kwa moja kuwa “Yeye.”
- source_word: ἦν ἀπ’ ἀρχῆς
  choice: kilichokuwako tangu mwanzo
  rationale: “Tangu mwanzo” linahifadhi kina cha wakati katika usemi wa Kiyohana, huku “kilichokuwako” likifuata hali ya kitenzi cha Kigiriki bila kuongeza maana ya baadaye.
- source_word: ἀκηκόαμεν
  choice: tulichokisikia
  rationale: Kiswahili cha kawaida hutumia wakati uliopita katika kishazi hiki; ushuhuda wenye matokeo yanayoendelea unaeleweka katika muktadha bila usemi mzito usio wa kawaida.
- source_word: ἑωράκαμεν τοῖς ὀφθαλμοῖς ἡμῶν
  choice: tulichokiona kwa macho yetu
  rationale: Maneno “kwa macho yetu” yamehifadhiwa ili kudumisha msisitizo wa Kigiriki juu ya ushuhuda wa waliojionea.
- source_word: ἐθεασάμεθα
  choice: tulichokitazama
  rationale: “Kutazama” linaonyesha kuona kwa makusudi na kwa uangalifu zaidi kuliko kuona kwa muda mfupi tu.
- source_word: αἱ χεῖρες ἡμῶν ἐψηλάφησαν
  choice: mikono yetu ilikigusa
  rationale: Tafsiri hii ni ya asili na inaweka wazi uhalisi wa kugusa kwa mwili bila kudokeza kushika kwa muda mrefu kuliko inavyosema Kigiriki.
- source_word: περὶ
  choice: kuhusu
  rationale: Neno hili linatanguliza mada ya ushuhuda kwa Kiswahili cha sasa, chenye heshima na kinachoeleweka kwa urahisi.
- source_word: τοῦ λόγου τῆς ζωῆς
  choice: neno la uzima
  rationale: “Neno” linahifadhi mwangwi wa matumizi ya Kiyohana na wakati huohuo linaweza kumaanisha ujumbe; herufi ndogo haiondoi kwa kulazimisha utata uliomo katika Kigiriki.
theological_decisions:
- issue: Mrejelewa wa vishazi vya kiwakilishi na wa λόγος
  choice: Kutumia “Kile” na “neno la uzima” bila kumtaja moja kwa moja “Yeye” wala kuandika “Neno” kwa herufi kubwa katika matini kuu.
  alternative: “Yeye aliyekuwako tangu mwanzo” au “Neno la uzima.”
  rationale: Muktadha una ushuhuda wa Kikristo kuhusu Mwana, lakini Kigiriki kinatumia kiwakilishi kisicho cha kiume wala cha kike na hakionyeshi herufi kubwa. Tafsiri hii inadumisha uwezekano wa kumrejelea Mwana pamoja na ujumbe unaomhusu, bila kuamua kimya kimya kati ya maana hizo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Kurudiwa kwa “kile” kunahifadhi mpangilio wenye mkazo wa Kigiriki, huku “ambacho” kikiepuka muundo mzito katika sehemu ya mwisho. Mstari umeachwa ukiendelea kwa alama ya mkato kwa sababu sentensi inaendelea katika mistari inayofuata.
