  naturalness: The Swahili is clear and suitably elevated. A comma before the coordinated final relative clause improves the articulated, cumulative rhythm. The footnote wording can more precisely describe the Greek as using a neuter grammatical relative pronoun, rather than explaining it as neither male nor female.
  terminology: “Neno la uzima” appropriately retains the possible Johannine resonance without forcing capitalization or a solely personal interpretation. “Mwana” and “ushuhuda wa mitume” are appropriate in the explanatory note.
