source:
  edition: SBLGNT
  text: ἐὰν δὲ ἐν τῷ φωτὶ περιπατῶμεν ὡς αὐτός ἐστιν ἐν τῷ φωτί, κοινωνίαν ἔχομεν μετ’ ἀλλήλων καὶ τὸ αἷμα ⸀Ἰησοῦ τοῦ υἱοῦ αὐτοῦ καθαρίζει ἡμᾶς ἀπὸ πάσης ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/007.yaml
  text: But if we walk in the light[a], as he himself is in the light, we have fellowship with one another[b], and the blood of Jesus his Son cleanses us from every sin.
translation:
  language: sw
  text: Lakini tukienenda katika nuru, kama yeye mwenyewe alivyo katika nuru, tuna ushirika sisi kwa sisi[a], na damu ya Yesu, Mwana wake, hututakasa na kila dhambi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mmoja na mwenzake.” Baadhi ya wafasiri huelewa “sisi kwa sisi” kuwa ushirika kati ya waumini na Mungu, lakini usemi wa Kigiriki wa kurejeana unaelekea zaidi kumaanisha ushirika wa waumini wao kwa wao.
    reason: alternative_reading
  - marker: b
    text: Au “dhambi yote.” Kigiriki kinaweza kueleweka kwa maana ya kugawa (“kila dhambi”) au kwa maana ya jumla (“dhambi yote”).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ
  choice: Lakini tuki-
  rationale: “Lakini” inaonyesha utofauti na dai la mstari uliotangulia kuhusu kuenenda gizani, huku kiambishi “-ki-” kikitoa sharti la ἐὰν.
- source_word: ἐν τῷ φωτὶ
  choice: katika nuru
  rationale: Inahifadhi taswira kuu ya Yohana ya nuru kwa lugha ya kawaida na yenye heshima.
- source_word: περιπατῶμεν
  choice: tukienenda
  rationale: “Kuenenda” huhifadhi sitiari ya mwenendo wa maisha badala ya kuifafanua moja kwa moja kuwa “kuishi.”
- source_word: ὡς αὐτός ἐστιν ἐν τῷ φωτί
  choice: kama yeye mwenyewe alivyo katika nuru
  rationale: “Yeye mwenyewe” huonyesha mkazo wa αὐτός, na “kama” huhifadhi ulinganisho bila kuufanya kuwa usawa kamili.
- source_word: κοινωνίαν ἔχομεν
  choice: tuna ushirika
  rationale: “Ushirika” huwasilisha kushiriki pamoja na uhusiano wa karibu bila kuingiza maana maalumu ya kisakramenti.
- source_word: μετ’ ἀλλήλων
  choice: sisi kwa sisi
  rationale: Ni usemi wa kawaida wa Kiswahili unaohifadhi uhusiano wa kutendeana unaoonyeshwa na ἀλλήλων.
- source_word: τὸ αἷμα Ἰησοῦ
  choice: damu ya Yesu
  rationale: Muundo huu huweka “damu” kuwa kiima cha kishazi na huhifadhi uzito wa usemi wa chanzo.
- source_word: τοῦ υἱοῦ αὐτοῦ
  choice: Mwana wake
  rationale: Ni tafsiri ya asili ya umilikaji inayomtambulisha Yesu katika uhusiano wake na Mungu bila kuongeza maelezo.
- source_word: καθαρίζει
  choice: hutusafisha
  rationale: Wakati wa sasa umehifadhiwa; unaweza kuonyesha tendo linaloendelea au la kawaida bila kuongeza maneno kama “huendelea kutusafisha.”
- source_word: ἀπὸ πάσης ἁμαρτίας
  choice: kutoka katika kila dhambi
  rationale: “Kila dhambi” huonyesha kwa uwazi maana ya kugawa ya πάσης, huku uwezekano wa maana ya jumla ukibainishwa katika tanbihi.
theological_decisions:
- issue: Mhusika wa usemi μετ’ ἀλλήλων (“sisi kwa sisi”)
  choice: ushirika wa waumini wao kwa wao
  alternative: ushirika kati ya waumini na Mungu
  rationale: Kiwakilishi cha kutendeana ἀλλήλων kwa kawaida zaidi huelekeza kwenye ushirika wa watu wao kwa wao. Muktadha mpana unazungumzia ushirika na Mungu, lakini maana hiyo haijalazimishwa ndani ya kishazi hiki.
- issue: Nguvu ya wakati wa sasa katika καθαρίζει
  choice: tendo linaloendelea au la kawaida lililoelezwa kwa wakati wa sasa “hutusafisha”
  alternative: tendo la mara moja, au usemi uliofafanuliwa zaidi “huendelea kutusafisha”
  rationale: Wakati wa sasa wa Kigiriki unaweza kudokeza usafishaji unaoendelea, lakini “hutusafisha” huuhifadhi bila kuzidisha tafsiri ya kiaspekti.
- issue: Maana ya πάσης ἁμαρτίας
  choice: kila dhambi
  alternative: dhambi yote
  rationale: Muundo wa Kigiriki unaweza kueleweka kwa kugawa (“kila dhambi”) au kwa ujumla (“dhambi yote”); matini kuu inatumia maana ya kugawa na tanbihi huhifadhi nyingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Kuenenda” limetumiwa kwa makusudi kuhifadhi sitiari ya chanzo, huku sentensi nyingine ikiwa ya kawaida na inayoeleweka. Alama zote za tanbihi zimewekwa katika matini kuu.
