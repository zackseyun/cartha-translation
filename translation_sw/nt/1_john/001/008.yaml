base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/008.yaml
  text: If we say that we have no sin[a], we deceive ourselves, and the truth is not in us.
translation:
  language: sw
  text: Tukisema kwamba hatuna dhambi[a], tunajidanganya wenyewe, na kweli haimo ndani yetu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri yenye ufafanuzi zaidi, “hali ya dhambi”; Kigiriki kinasema kihalisi “dhambi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν εἴπωμεν
  choice: Tukisema
  rationale: Muundo huu wa sharti unatafsiriwa kwa Kiswahili cha kawaida kama “Tukisema,” ukihifadhi hali ya uwezekano bila kuwa mzito.
- source_word: ἁμαρτίαν οὐκ ἔχομεν
  choice: hatuna dhambi
  rationale: “Dhambi” imetumiwa kama nomino ya jumla katika umoja, ikimaanisha kuwapo kwa dhambi, si tendo moja maalumu la dhambi.
- source_word: ἑαυτοὺς πλανῶμεν
  choice: tunajidanganya wenyewe
  rationale: Kitenzi pamoja na kiwakilishi cha kujirejelea kinaonyesha kujidanganya; “wenyewe” kinahifadhi msisitizo wa Kigiriki.
- source_word: ἡ ἀλήθεια
  choice: kweli
  rationale: “Kweli” ni neno la asili na lenye hadhi katika Kiswahili, na linaacha wazi maana pana ya Yohana ya ukweli na uhalisi bila kuifafanua kupita kiasi.
- source_word: οὐκ ἔστιν ἐν ἡμῖν
  choice: haimo ndani yetu
  rationale: Kauli hii inahifadhi wazo la kuwapo kwa ndani linalotolewa na ἐν ἡμῖν, kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Maana ya “dhambi” katika dai la kwamba hatuna dhambi
  choice: “hatuna dhambi,” ikirejelea kuwapo kwa dhambi ndani ya mtu
  alternative: “hatuna hali ya dhambi” au “hatujatenda dhambi”
  rationale: Kigiriki kinasema kihalisi “kuwa na dhambi,” tofauti na kukana matendo ya dhambi katika mstari wa 10. Tafsiri haibadili “dhambi” kuwa hali iliyofafanuliwa zaidi wala tendo la wakati uliopita.
- issue: Maana ya kauli “kweli haimo ndani yetu”
  choice: Imeachwa kuwa “kweli haimo ndani yetu”
  alternative: “kweli ya Mungu haimo ndani yetu” au “hatuishi katika kweli”
  rationale: Kauli fupi ya Kigiriki inaweza kuhusisha ukweli wa Mungu pamoja na ukweli wa ndani au unyoofu. Tafsiri inahifadhi mvutano huo bila kuamua maana moja pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. “Wala” limeunganisha matokeo ya pili kwa mtiririko wa kawaida; “ndani yetu” limehifadhi uzito wa wazo la ndani.
