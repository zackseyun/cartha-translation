  text: ὃ ἑωράκαμεν καὶ ἀκηκόαμεν ἀπαγγέλλομεν ⸀καὶ ὑμῖν, ἵνα καὶ ὑμεῖς κοινωνίαν ἔχητε μεθ’ ἡμῶν· καὶ ἡ κοινωνία δὲ ἡ ἡμετέρα μετὰ τοῦ πατρὸς καὶ μετὰ τοῦ υἱοῦ αὐτοῦ Ἰησοῦ Χριστοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/003.yaml
  text: What we have seen and heard we also proclaim to you[a], so that you too may have fellowship with us; and indeed our fellowship is with the Father and with his Son[b], Jesus the Messiah.
translation:
  language: sw
  text: Kile tulichokiona na kukisikia, tunawatangazia ninyi pia, ili ninyi pia muwe na ushirika[a] nasi. Na ushirika wetu ni pamoja na Baba na pamoja na Mwana wake, Yesu Masihi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ushirika” pia unaweza kutafsiriwa “kushiriki pamoja,” “umoja wa karibu,” au “kuwa na sehemu pamoja”; neno hili linasisitiza maisha na uhusiano unaoshirikiwa.
    reason: lexical_alternative
  - marker: b
    text: Au, “Yesu Kristo.” Neno la Kigiriki Χριστός linaweza kutafsiriwa “Kristo” au “Masihi”; hapa limetafsiriwa “Masihi” ili kuonyesha maana yake kama cheo.
    reason: alternative_reading
lexical_decisions:
- source_word: ὃ
  choice: Kile
  rationale: Kiwakilishi hiki cha umoja wa jinsi ya kati kinarejelea kwa upana kile kilichoonekana na kusikiwa; “kile” ni cha kawaida katika Kiswahili na hakibadili rejeo hilo kuwa mtu moja kwa moja.
- source_word: ἑωράκαμεν καὶ ἀκηκόαμεν
  choice: tulichokiona na kukisikia
  rationale: Muundo huu unaonyesha ushuhuda wa jambo lililoonekana na kusikiwa. Kiswahili cha kawaida hutumia wakati uliopita hapa bila kulazimisha muundo usio wa asili wa wakati timilifu wa Kigiriki.
- source_word: ἀπαγγέλλομεν καὶ ὑμῖν
  choice: tunawatangazia ninyi pia
  rationale: “Tunawatangazia” hudumisha maana ya kutoa taarifa au tangazo kwa msingi wa ushuhuda, na “pia” inawakilisha καὶ iliyo mbele ya ὑμῖν.
- source_word: ἵνα καὶ ὑμεῖς
  choice: ili ninyi pia
  rationale: “Ili” huonyesha kusudi, huku “ninyi pia” ikihifadhi msisitizo wa καὶ ὑμεῖς.
- source_word: κοινωνίαν ἔχητε μεθ’ ἡμῶν
  choice: muwe na ushirika nasi
  rationale: “Ushirika” unajumuisha uhusiano na kushiriki maisha pamoja bila kuufanya msemo huu uwe wa kijamii tu au wa kiibada pekee.
- source_word: καὶ ἡ κοινωνία δὲ ἡ ἡμετέρα
  choice: Na kwa kweli, ushirika wetu
  rationale: “Kwa kweli” huonyesha nguvu ya δέ katika maelezo haya ya kusisitiza, na “ushirika wetu” ni Kiswahili cha asili kwa ἡ κοινωνία ἡ ἡμετέρα.
- source_word: μετὰ τοῦ πατρὸς καὶ μετὰ τοῦ υἱοῦ αὐτοῦ
  choice: pamoja na Baba na pamoja na Mwana wake
  rationale: Kurudia “pamoja na” kunafuata urudiaji wa μετά na kuonyesha wazi ushirika pamoja na Baba na pamoja na Mwana.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesu Masihi
  rationale: Χριστός hapa linaweza kueleweka kama cheo cha Yesu; “Masihi” huwasilisha maana ya cheo hicho badala ya kukiacha kama jina lisilotafsiriwa.
theological_decisions:
- issue: Maana ya κοινωνία
  choice: ushirika
  alternative: umoja; kushiriki pamoja; ushirika wa karibu
  rationale: “Ushirika” huhifadhi kwa pamoja maana za uhusiano, kushiriki, na kuwa na sehemu katika maisha ya pamoja, bila kuamua kwamba neno hilo ni la kijamii tu au la kisakramenti pekee.
- issue: Tafsiri ya Χριστοῦ
  choice: Masihi
  alternative: Kristo
  rationale: Katika muunganiko huu neno linaendelea kubeba maana ya cheo, yaani Mtiwa-Mafuta. “Masihi” huifanya maana hiyo ionekane, huku “Kristo” ikitolewa kama tafsiri mbadala iliyozoeleka.
- issue: Ushirika na Baba na Mwana
  choice: ushirika wetu ni pamoja na Baba na pamoja na Mwana wake
  alternative: tunashirikiana na Baba na Mwana wake
  rationale: Muundo wa nomino hudumisha dai la Kigiriki kwamba ushirika walio nao waamini umeelekezwa kwa Baba na Mwana, bila kufafanua zaidi namna ya ushirika huo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Mpangilio na urudiaji muhimu wa maandishi ya Kigiriki umehifadhiwa pale unapobaki wa asili katika Kiswahili; alama za tanbihi zimewekwa moja kwa moja baada ya maneno yanayohusika.
