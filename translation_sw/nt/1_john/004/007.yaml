base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/007.yaml
  text: Beloved[a], let us love one another, because love is from God, and everyone who loves has been born of God and knows God.
translation:
  language: sw
  text: Wapendwa[a], tupendane, kwa sababu upendo unatoka kwa Mungu, na kila anayependa amezaliwa na Mungu na anamjua Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Marafiki wapendwa.” Kigiriki ni mwito unaomaanisha kihalisi “Wapendwa,” na huhifadhi mwangwi wa maneno ya mzizi wa upendo yanayorudiwa katika aya hii.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: Wapendwa
  rationale: Ni kivumishi cha wingi katika hali ya mwito, kinachotumiwa kama namna ya kuwaita wasomaji kwa upendo. “Wapendwa” ni ya asili na yenye heshima katika Kiswahili, nayo inadumisha uhusiano wa kimsamiati na mzizi wa ἀγαπάω/ἀγάπη unaorudiwa katika aya hii.
- source_word: ἀγαπῶμεν
  choice: tupendane
  rationale: Ni subjunktivu ya wakati uliopo, nafsi ya kwanza wingi, inayotoa himizo. “Tupendane” ni Kiswahili cha kawaida na huunganisha kwa ufasaha tendo la kupenda na maana ya kutendeana iliyomo katika ἀλλήλους, bila kuongeza wazi wazo la “kuendelea” ambalo linadokezwa tu na hali ya kitenzi.
- source_word: ἀλλήλους
  choice: sisi kwa sisi
  rationale: Ni kiwakilishi cha kutendeana. Pamoja na “tupendane,” maneno “sisi kwa sisi” yanahifadhi msisitizo wa wazi wa Kigiriki wa kupendana.
- source_word: ὅτι
  choice: kwa sababu
  rationale: Hutambulisha msingi au sababu ya himizo; “kwa sababu” huwasilisha uhusiano huo wa kisababishi kwa uwazi katika Kiswahili cha sasa.
- source_word: ἡ ἀγάπη
  choice: upendo
  rationale: “Upendo” ndiyo tafsiri ya kawaida na ya moja kwa moja; kibainishi cha Kigiriki kina matumizi ya kijumla, hivyo hakihitaji kielezi cha ziada katika Kiswahili.
- source_word: ἐκ τοῦ θεοῦ ἐστιν
  choice: unatoka kwa Mungu
  rationale: ἐκ huonyesha chanzo au asili. “Unatoka kwa Mungu” ni ya kawaida na huhifadhi dai kwamba Mungu ndiye chanzo cha upendo.
- source_word: πᾶς ὁ ἀγαπῶν
  choice: kila anayependa
  rationale: Kirai hiki cha kishiriki chenye πᾶς hutaja kundi kwa ujumla. “Kila anayependa” ni cha asili na hudumisha nguvu ya usemi wa kijumla.
- source_word: γεγέννηται
  choice: amezaliwa
  rationale: Ni perfektivu pasivu inayosema tendo lililotimia lenye matokeo yanayoendelea. “Amezaliwa” huwasilisha hali hiyo kwa Kiswahili cha kawaida bila kutumia istilahi nzito isiyohitajika.
- source_word: ἐκ τοῦ θεοῦ γεγέννηται
  choice: amezaliwa na Mungu
  rationale: Katika Kiswahili, “amezaliwa na Mungu” huonyesha kwa kawaida Mungu kama chanzo au mtendaji wa kuzaliwa huku. Hufaa zaidi kuliko “amezaliwa kutoka kwa Mungu,” ambalo si la asili, huku likidumisha taswira ya Kiyohana ya kuzaliwa kwa asili ya kimungu.
- source_word: γινώσκει τὸν θεόν
  choice: anamjua Mungu
  rationale: Wakati uliopo huonyesha kumjua kunakoendelea. “Anamjua Mungu” ni tafsiri ya moja kwa moja na ya asili; haisisitizi mwanzo wa kumjua ambao haujaelezwa wazi na umbo la Kigiriki.
theological_decisions:
- issue: Uhusiano kati ya upendo, kuzaliwa na Mungu, na kumjua Mungu
  choice: Aya imetafsiriwa moja kwa moja ikiunganisha kumpenda mwingine na kuwa amezaliwa na Mungu na kumjua Mungu, bila kuingiza mpangilio maalumu wa kimadhehebu kuhusu wokovu.
  alternative: Kuifanya kauli hii kuwa uthibitisho wa kitaalamu wa kuzaliwa upya katika mfumo fulani wa teolojia, au kuichukulia kuwa maadili tu yasiyohusiana na kuzaliwa na Mungu.
  rationale: Kigiriki kinasema kwamba kila anayependa amezaliwa na Mungu na anamjua Mungu. Tafsiri inadumisha uhusiano huo wa kiteolojia bila kuupanua kwa mafundisho ya baadaye wala kuudhoofisha kuwa wito wa kimaadili pekee.
- issue: Kurudiwa kwa mzizi wa maneno ἀγάπη / ἀγαπάω
  choice: “Wapendwa,” “tupendane,” “upendo,” na “anayependa” yametumiwa ili kudumisha mwangwi wa mzizi mmoja wa maana.
  alternative: Kutumia “rafiki wapendwa” au maneno mengine yanayoficha uhusiano wa kimsamiati kati ya mwito na kauli kuhusu upendo.
  rationale: Muundo wa kifasihi na msisitizo wa kiteolojia wa aya hutegemea kurudiwa kwa mzizi ἀγαπ-. Kiswahili kinaweza kuhifadhi mwangwi huo kwa matumizi ya aina mbalimbali za mzizi -pend-.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo ni wa ulinganifu mwafaka: unadumisha kurudiwa kwa mzizi -pend-, nguvu ya himizo, chanzo cha upendo katika Mungu, na hali ya sasa inayotokana na kuzaliwa na Mungu.'
