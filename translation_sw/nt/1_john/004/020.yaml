  text: ἐάν τις εἴπῃ ὅτι Ἀγαπῶ τὸν θεόν, καὶ τὸν ἀδελφὸν αὐτοῦ μισῇ, ψεύστης ἐστίν· ὁ γὰρ μὴ ἀγαπῶν τὸν ἀδελφὸν αὐτοῦ ὃν ἑώρακεν, τὸν θεὸν ὃν οὐχ ἑώρακεν ⸀οὐ δύναται ἀγαπᾶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/020.yaml
  text: If anyone says[a], “I love God,” and hates his brother, he is a liar; for the one who does not love his brother whom he has seen cannot love God whom he has not seen.
translation:
  language: sw
  text: Mtu akisema, “Ninampenda Mungu,” na anamchukia ndugu yake[a], ni mwongo; kwa maana mtu asiyempenda ndugu yake ambaye amemwona hawezi kumpenda Mungu ambaye hajamwona.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ndugu yake, awe wa kiume au wa kike.” Neno la Kigiriki ἀδελφόν ni umoja wa kiume, lakini katika muktadha linaweza kutumiwa kwa maana wakilishi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐάν τις εἴπῃ
  choice: Mtu akisema
  rationale: Muundo wa ‘mtu akisema’ ni wa kawaida katika Kiswahili na huhifadhi sharti la jumla pamoja na maana isiyobainisha mtu fulani.
- source_word: Ἀγαπῶ τὸν θεόν
  choice: Ninampenda Mungu
  rationale: Huhifadhi kitenzi cha wakati wa sasa na urudiaji wa mzizi wa ἀγαπάω katika aya yote.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: ndugu yake
  rationale: ‘Ndugu’ ni neno la kawaida la Kiswahili linaloweza kumaanisha ndugu wa kiume na pia, kulingana na muktadha, mwamini mwenzake; hivyo halilazimishi ufafanuzi wa ziada katika matini kuu.
- source_word: μισῇ
  choice: anamchukia
  rationale: Wakati wa sasa wa Kiswahili unaonyesha hali au mwenendo unaoendelea na unalingana kiasili na subjunktivu ya sasa katika sharti.
- source_word: ψεύστης ἐστίν
  choice: yeye ni mwongo
  rationale: Huhifadhi nomino ya kihabari na hukumu ya moja kwa moja ya Yohana, badala ya kuilegeza kuwa tendo la kusema uongo tu.
- source_word: ὁ γὰρ μὴ ἀγαπῶν
  choice: kwa maana mtu asiyempenda
  rationale: ‘Kwa maana’ huhifadhi kazi ya γάρ ya kutoa sababu, na ‘mtu asiyempenda’ huwasilisha kishiriki chenye kutumiwa kama nomino kwa Kiswahili cha kawaida.
- source_word: ὃν ἑώρακεν
  choice: ambaye amemwona
  rationale: Wakati timilifu ‘amemwona’ huonyesha tendo lililotimia lenye umuhimu wa sasa, sambamba na ἑώρακεν.
- source_word: οὐ δύναται ἀγαπᾶν
  choice: hawezi kumpenda
  rationale: Huhifadhi nguvu ya kutoweza, si ugumu wa kawaida tu, huku ikisomeka kiasili katika Kiswahili.
theological_decisions:
- issue: Maana ya ἀδελφός katika muktadha unaoweza kuwahusu waamini wenzake kwa ujumla
  choice: ndugu yake
  alternative: ndugu yake wa kiume au wa kike; mwamini mwenzake
  rationale: ‘Ndugu’ huhifadhi taswira ya kindugu ya chanzo bila kuamua kimadhehebu kwamba maana yake ni ‘mwamini mwenzake’ pekee. Tanbihi inaweka wazi uwezekano wa matumizi wakilishi katika muktadha.
- issue: Nguvu ya οὐ δύναται ἀγαπᾶν
  choice: hawezi kumpenda Mungu
  alternative: hana uwezo wa kumpenda Mungu
  rationale: ‘Hawezi’ huhifadhi dai kali la kutowezekana katika hoja ya Yohana bila kuongeza maelezo ya kifalsafa kuhusu aina ya kutoweza huko.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa moja kwa moja na unaeleweka kwa wasomaji wa kawaida; urudiaji wa ‘kupenda’ umehifadhiwa ili kuonyesha mshikamano wa hoja ya aya.
