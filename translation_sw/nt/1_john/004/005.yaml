  text: αὐτοὶ ἐκ τοῦ κόσμου εἰσίν· διὰ τοῦτο ἐκ τοῦ κόσμου λαλοῦσιν καὶ ὁ κόσμος αὐτῶν ἀκούει.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/005.yaml
  text: They are from the world[a]; for this reason they speak from the world[b], and the world listens to them.
translation:
  language: sw
  text: Wao wanatokana na ulimwengu[a]. Kwa sababu hiyo, husema kutokana na ulimwengu[b], nao ulimwengu huwasikiliza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wao ni wa ulimwengu.” Kigiriki kinarudia usemi “kutoka katika ulimwengu,” kikisisitiza chanzo au asili.
    reason: lexical_alternative
  - marker: b
    text: “Ulimwengu” hapa ni mpangilio wa wanadamu unaompinga Mungu, si ulimwengu ulioumbwa kwa ujumla.
    reason: cultural_note
lexical_decisions:
- source_word: αὐτοὶ
  choice: Wao
  rationale: Kiwakilishi hiki kinawarejelea manabii wa uongo wanaotajwa katika muktadha na pia kinadumisha mkazo wa kulinganisha wao na “sisi” katika mstari unaofuata.
- source_word: ἐκ τοῦ κόσμου
  choice: wanatokana na ulimwengu
  rationale: Kihusishi ἐκ huonyesha chanzo au asili. “Wanatokana na” kinaeleza wazo hilo kwa Kiswahili cha kawaida bila kudokeza tu kwamba wametoka mahali fulani kimwili.
- source_word: κόσμος
  choice: ulimwengu
  rationale: Neno la kawaida “ulimwengu” linahifadhi mwangwi mpana wa matumizi ya Yohana. Katika muktadha huu linamaanisha mpangilio wa wanadamu unaompinga Mungu, si uumbaji wote kwa ujumla.
- source_word: διὰ τοῦτο
  choice: Kwa sababu hiyo
  rationale: Kirai hiki kinaonyesha wazi uhusiano wa sababu kati ya asili yao na namna wanavyosema.
- source_word: λαλοῦσιν
  choice: husema
  rationale: Wakati wa sasa una maana ya tendo la kawaida au linalojirudia; “husema” huwasilisha maana hiyo kwa Kiswahili cha asili.
- source_word: ἐκ τοῦ κόσμου λαλοῦσιν
  choice: husema kutokana na ulimwengu
  rationale: Tafsiri hii inadumisha urudiaji wa wazo la chanzo lililo katika ἐκ τοῦ κόσμου, ingawa muundo huo una uzito usio wa kawaida kidogo kwa Kiswahili.
- source_word: ὁ κόσμος αὐτῶν ἀκούει
  choice: ulimwengu huwasikiliza
  rationale: Katika muktadha huu ἀκούει haimaanishi kusikia sauti tu, bali kupokea kwa kukubali; “huwasikiliza” huonyesha upokeaji huo.
theological_decisions:
- issue: Maana ya κόσμος katika teolojia ya Yohana
  choice: “Ulimwengu” ni mpangilio wa wanadamu uliotengana na Mungu na unaompinga
  alternative: Ulimwengu wa vitu vilivyoumbwa, au wanadamu kwa maana isiyoegemea upande wowote
  rationale: Muktadha unatofautisha wale wanaotokana na Mungu na wale wanaotokana na ulimwengu. Neno rahisi “ulimwengu” limeachwa katika matini kuu ili kutopanua tafsiri kupita kiasi.
- issue: Nguvu ya mkazo katika αὐτοὶ
  choice: Kutumia “Wao” wazi katika matini kuu
  alternative: Kuacha kiwakilishi hicho na kutegemea kiambishi cha nafsi katika kitenzi
  rationale: Kwa Kiswahili, “Wao” linaonyesha kwa njia ya kawaida utofauti uliopo katika Kigiriki kati yao na “sisi” wa mstari unaofuata, bila kuongeza neno lenye maana ya “wenyewe.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Wanatokana na” na “kutokana na” vimetumiwa ili kuhifadhi msisitizo wa Kigiriki kuhusu chanzo, huku “husema” na “huwasikiliza” vikitoa maana ya kawaida na ya upokeaji kwa lugha inayoeleweka.
