source:
  edition: SBLGNT
  text: θεὸν οὐδεὶς πώποτε τεθέαται· ἐὰν ἀγαπῶμεν ἀλλήλους, ὁ θεὸς ἐν ἡμῖν μένει καὶ ἡ ἀγάπη αὐτοῦ ⸂ἐν ἡμῖν τετελειωμένη ἐστιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/012.yaml
  text: No one has ever seen God[a]; if we love one another, God remains in us[b], and his love is perfected in us.
translation:
  language: sw
  text: Hakuna mtu aliyewahi kumwona Mungu. Tukipendana, Mungu anakaa ndani yetu, na upendo wake[a] umekamilishwa ndani yetu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “upendo wetu kwa Mungu.” Maneno ya Kigiriki yanayotafsiriwa “upendo wake” yanaweza kumaanisha upendo wa Mungu kwetu au upendo wetu unaoelekezwa kwa Mungu; muktadha unaunga mkono zaidi maana ya upendo wa Mungu.
    reason: alternative_reading
  - marker: b
    text: Au, “umefanywa kuwa kamili ndani yetu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τεθέαται
  choice: aliyewahi kumwona
  rationale: Muundo huu unawasilisha wakati timilifu pamoja na πώποτε kwa Kiswahili cha kawaida, bila kuongeza dhana ya kutazama kwa makini isiyohitajika katika muktadha.
- source_word: πώποτε
  choice: aliyewahi
  rationale: Pamoja na ukanushi wa καθείς/οὐδείς, ‘aliyewahi’ huonyesha kwa kawaida maana ya ‘wakati wowote hadi sasa.’
- source_word: ἐὰν ἀγαπῶμεν ἀλλήλους
  choice: Tukipendana
  rationale: Huhifadhi sharti la ἐάν pamoja na hali ya kupendana, kwa usemi mfupi na wa asili katika Kiswahili.
- source_word: μένει
  choice: anakaa
  rationale: ‘Anakaa ndani yetu’ ni usemi wa kawaida unaohifadhi wazo la uwepo unaoendelea, muhimu katika matumizi ya Yohana ya μένω.
- source_word: ἡ ἀγάπη αὐτοῦ
  choice: upendo wake
  rationale: Huhifadhi umbo la Kigiriki na kutaja kwa kawaida upendo wa Mungu; pia linaacha utata halisi wa kiima au yambwa uelezwe katika tanbihi.
- source_word: ἐν ἡμῖν
  choice: ndani yetu
  rationale: Huhifadhi urudiaji wa kirai cha Kigiriki na mada ya Mungu kukaa ndani ya waamini, badala ya kukibadili kuwa ‘miongoni mwetu.’
- source_word: τετελειωμένη ἐστιν
  choice: umekamilishwa
  rationale: Huwasilisha hali iliyotokana na tendo lililokamilika na kudumu, huku ukihifadhi uhusiano wa kimsamiati na τελειόω.
theological_decisions:
- issue: Maana ya ἡ ἀγάπη αὐτοῦ (‘upendo wake’)
  choice: Upendo wa Mungu kwetu umekamilishwa ndani yetu
  alternative: Upendo wetu kwa Mungu umekamilishwa ndani yetu
  rationale: Muktadha wa karibu, hasa mstari wa 10–11, unasisitiza upendo wa Mungu unaotangulia na kutenda. Hata hivyo, umbo la genitivi linaweza pia kueleweka kuwa upendo unaoelekezwa kwa Mungu, hivyo maana hiyo imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. ‘Tukipendana’ ni ya asili kuliko tafsiri ndefu ya sharti, na ‘anakaa ndani yetu’ huhifadhi istilahi muhimu ya Yohana bila kutumia lugha ya kizamani.
