  text: ἀγαπητοί, εἰ οὕτως ὁ θεὸς ἠγάπησεν ἡμᾶς, καὶ ἡμεῖς ὀφείλομεν ἀλλήλους ἀγαπᾶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/011.yaml
  text: Beloved[a], if God so loved us, we also ought to love one another.
translation:
  language: sw
  text: Wapendwa, ikiwa[a] Mungu alitupenda hivi, sisi pia tunapaswa kupendana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa kuwa Mungu alitupenda hivi.” Kigiriki kinatumia muundo wa sharti (“ikiwa”), ambao katika muktadha huu yaelekea huchukulia sharti hilo kuwa la kweli.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγαπητοί
  choice: Wapendwa
  rationale: Ni kivumishi cha wingi kinachotumiwa kama mwito wa moja kwa moja. “Wapendwa” ni mwito wa heshima na upendo, nao unadumisha uhusiano wa kimsamiati na maneno ya kupenda yanayorudiwa katika mstari huu.
- source_word: εἰ
  choice: ikiwa
  rationale: “Ikiwa” linahifadhi muundo wa sharti wa Kigiriki. Katika muktadha, ukweli wa upendo wa Mungu hauwekwi mashakani, lakini muundo huu una nguvu ya hoja ya kusihi.
- source_word: οὕτως
  choice: kwa namna hii
  rationale: Kauli hii inaelekeza hasa kwenye namna ambayo Mungu alionyesha upendo wake katika muktadha uliotangulia, huku isiyofuta kabisa wazo la ukubwa wa upendo huo.
- source_word: ὁ θεὸς
  choice: Mungu
  rationale: Hili ni tafsiri ya kawaida na ya moja kwa moja ya nomino yenye dhima ya kiima.
- source_word: ἠγάπησεν
  choice: alitupenda
  rationale: Kitenzi hiki ni aoristi tendaji; pamoja na kiambishi cha yambwa “-tu-” kinatoa kwa kawaida maana ya “loved us” na kudumisha msamiati mkuu wa upendo.
- source_word: ἡμᾶς
  choice: -tu-
  rationale: Kiwakilishi yambwa cha wingi kimewakilishwa kwa kawaida ndani ya kitenzi cha Kiswahili “alitupenda.”
- source_word: καὶ ἡμεῖς
  choice: sisi pia
  rationale: Kiwakilishi kilichotajwa wazi katika Kigiriki kina mkazo. “Sisi pia” kinahifadhi mkazo huo pamoja na maana ya καί kwa Kiswahili cha kawaida.
- source_word: ὀφείλομεν
  choice: tunapaswa
  rationale: Neno hili linaonyesha wajibu wa kimaadili. “Tunapaswa” linaeleza wajibu huo bila kuugeuza kimyakimya kuwa amri ya moja kwa moja.
- source_word: ἀλλήλους
  choice: -ana
  rationale: Kiambishi cha kutendeana katika “kupendana” kinawakilisha kwa kawaida maana ya “one another” katika Kiswahili.
- source_word: ἀγαπᾶν
  choice: kupendana
  rationale: Muundo wa kitenzi-jina baada ya “tunapaswa” ni wa kawaida; ukiunganishwa na kiambishi cha kutendeana unatafsiri kwa ufupi na kwa usahihi “to love one another.”
theological_decisions:
- issue: Nguvu ya kishazi cha sharti εἰ οὕτως ὁ θεὸς ἠγάπησεν ἡμᾶς
  choice: Kudumisha “ikiwa Mungu alitupenda kwa namna hii”
  alternative: “kwa kuwa Mungu alitupenda kwa namna hii”
  rationale: Muktadha unakubali kuwa Mungu ametupenda, lakini Kigiriki bado kinaiweka hoja katika muundo wa sharti. “Ikiwa” linahifadhi mvutano huo wa balagha badala ya kuufanya wazi kuwa sababu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni rahisi kueleweka kwa wasomaji wa kawaida; “Wapendwa” inadumisha sauti ya upendo ya mwandishi, na “kupendana” ni usemi wa asili wa Kiswahili.
