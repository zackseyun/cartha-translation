  text: καὶ ἡμεῖς τεθεάμεθα καὶ μαρτυροῦμεν ὅτι ὁ πατὴρ ἀπέσταλκεν τὸν υἱὸν σωτῆρα τοῦ κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/014.yaml
  text: And we have seen and testify that the Father has sent the Son as the Savior of the world[a].
translation:
  language: sw
  text: Nasi tumeona na tunashuhudia kwamba Baba amemtuma Mwana kuwa Mwokozi wa ulimwengu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata muundo wa maneno kwa karibu zaidi, “Baba amemtuma Mwana, Mwokozi wa ulimwengu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἡμεῖς
  choice: Nasi
  rationale: Kiunganishi pamoja na kiwakilishi kilichosisitizwa kinaendeleza mtiririko na kutoa msisitizo mdogo kwa mashahidi bila kuzidisha maana.
- source_word: τεθεάμεθα
  choice: tumeona
  rationale: Hali timilifu ya Kigiriki inaonyesha tendo la kuona lililokamilika lenye umuhimu unaoendelea; “tumeona” ni ya kawaida na inadumisha nguvu ya ushuhuda wa waliojionea.
- source_word: μαρτυροῦμεν
  choice: tunashuhudia
  rationale: Wakati wa sasa unaonyesha ushuhuda unaoendelea unaotokana na kile walichokiona.
- source_word: ὅτι
  choice: kwamba
  rationale: Neno hili linatanguliza yaliyomo katika ushuhuda, si sababu.
- source_word: ὁ πατὴρ
  choice: Baba
  rationale: Katika muktadha wa Yohana, hili ni jina la kimahusiano linalomtaja Mungu kuhusiana na Mwana.
- source_word: ἀπέσταλκεν
  choice: amemtuma
  rationale: Muundo wa timilifu unaonyesha kutumwa kulikokamilika ambako umuhimu wake unaendelea; umbo la Kiswahili “ame-” linawasilisha jambo hilo kwa kawaida.
- source_word: τὸν υἱὸν
  choice: Mwana
  rationale: Kigiriki kina kibainishi lakini hakina kiwakilishi cha umilikaji; “Mwana” kinahifadhi jina la kimahusiano bila kuongeza “wake.”
- source_word: σωτῆρα
  choice: Mwokozi
  rationale: “Mwokozi” ni tafsiri ya kawaida, wazi, na inayofaa kwa maana ya σωτήρ katika muktadha huu.
- source_word: τοῦ κόσμου
  choice: wa ulimwengu
  rationale: Inahifadhi uhusiano wa kimilikishi na upana wa κόσμος bila kuufinya kwa hitimisho la kiteolojia.
- source_word: σωτῆρα τοῦ κόσμου
  choice: kuwa Mwokozi wa ulimwengu
  rationale: “Kuwa” linafanya kirai cha uhusiano baada ya “amemtuma Mwana” kisikike kwa kawaida katika Kiswahili huku likihifadhi maana ya nafasi ya Mwana; tafsiri ya karibu zaidi imewekwa katika tanbihi.
theological_decisions:
- issue: Upeo wa usemi “Mwokozi wa ulimwengu”
  choice: Usemi mpana “Mwokozi wa ulimwengu” umehifadhiwa bila kuubana.
  alternative: Mwokozi wa wateule; au Mwokozi anayewezekana wa ulimwengu
  rationale: Maandishi ya Kigiriki yanataja cheo na upeo huo moja kwa moja; tafsiri haipaswi kuingiza nadharia fulani ya wokovu isiyotajwa hapa.
- issue: Lugha ya uhusiano wa Baba na Mwana
  choice: Majina ya kimahusiano “Baba” na “Mwana” yametafsiriwa moja kwa moja.
  alternative: Mungu Baba alimtuma Yesu Kristo
  rationale: Aya yenyewe inatumia majina ya kimahusiano, wala haitumii jina “Yesu” au cheo “Kristo”; kuyapanua kungeongeza maneno yasiyomo katika Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Nasi” ni kifupi na cha kawaida, “tunashuhudia” huhifadhi ushuhuda unaoendelea, na herufi kubwa katika “Baba,” “Mwana,” na “Mwokozi” zinaonyesha matumizi yake kama majina ya kimahusiano na cheo katika muktadha huu.
