  text: ἐν τούτῳ ἐστὶν ἡ ἀγάπη, οὐχ ὅτι ἡμεῖς ⸀ἠγαπήκαμεν τὸν θεόν, ἀλλ’ ὅτι αὐτὸς ἠγάπησεν ἡμᾶς καὶ ἀπέστειλεν τὸν υἱὸν αὐτοῦ ἱλασμὸν περὶ τῶν ἁμαρτιῶν ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/010.yaml
  text: 'In this is love: not that we have loved God, but that he loved us and sent his Son as an atoning sacrifice for our sins.'
translation:
  language: sw
  text: 'Hivi ndivyo upendo ulivyo: si kwamba sisi tumempenda Mungu, bali kwamba yeye alitupenda na akamtuma Mwana wake kuwa dhabihu ya upatanisho kwa ajili ya dhambi zetu.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kipatanisho”; au “dhabihu ya kufidia dhambi.” Neno la Kigiriki ἱλασμός humweleza Mwana kuwa dhabihu inayoshughulikia dhambi zetu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τούτῳ ἐστὶν ἡ ἀγάπη
  choice: Hivi ndivyo upendo ulivyo
  rationale: Kauli hii ya asili inaelekeza mbele kwenye tendo linalofafanua upendo. Tafsiri hii ni ya asili katika Kiswahili na inahifadhi kazi ya muundo huo bila kuifanya kuwa kauli ya sababu.
- source_word: οὐχ ὅτι ... ἀλλ’ ὅτι
  choice: si kwamba ... bali kwamba
  rationale: 'Inahifadhi ulinganisho wa ufafanuzi wa Kigiriki: upendo haujaelezwa kwa tendo letu, bali kwa tendo la Mungu.'
- source_word: ἠγαπήκαμεν
  choice: tumempenda
  rationale: Wakati timilifu wa Kiswahili unaakisi kwa njia ya kawaida hali ya kitenzi cha Kigiriki, tofauti na tendo mahususi la Mungu linalofuata.
- source_word: αὐτὸς ἠγάπησεν ἡμᾶς
  choice: yeye alitupenda
  rationale: Kiwakilishi 'yeye' kinahifadhi msisitizo na ulinganisho kati ya 'sisi' na Mungu; wakati uliopita unaonyesha tendo lake mahususi.
- source_word: ἀπέστειλεν τὸν υἱὸν αὐτοῦ
  choice: akamtuma Mwana wake
  rationale: Ni Kiswahili cha kawaida na sahihi kinachohifadhi lugha ya kutumwa na uhusiano wa Mwana na Mungu.
- source_word: ἱλασμὸν
  choice: dhabihu ya upatanisho
  rationale: Neno hili linaeleza tendo la Mwana la kushughulikia dhambi kwa njia ya dhabihu. 'Dhabihu ya upatanisho' ni wazi kwa msomaji wa kawaida na huepuka kuamua kimya kimya kati ya mitazamo ya kuondoa dhambi na kuondoa ghadhabu.
- source_word: περὶ τῶν ἁμαρτιῶν ἡμῶν
  choice: kwa ajili ya dhambi zetu
  rationale: Katika muktadha wa dhabihu, 'kwa ajili ya' huwasilisha kwa Kiswahili cha asili uhusiano wa dhabihu hiyo na dhambi zetu.
theological_decisions:
- issue: Maana ya ἱλασμός katika muktadha wa upatanisho
  choice: dhabihu ya upatanisho
  alternative: dhabihu ya kufunika dhambi; kipatanisho
  rationale: Chaguo hili linahifadhi msingi wa maana kwamba Mwana alitumwa kama dhabihu inayoshughulikia dhambi, bila kulazimisha neno lenyewe kumaanisha tu kuondolewa kwa ghadhabu au tu kufutwa kwa dhambi. Maana mbadala inaelezwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Muundo wa 'si kwamba ... bali kwamba' huhifadhi mvutano wa asili; 'Mwana' limeandikwa kwa herufi kubwa kulingana na matumizi ya kawaida ya kibiblia.
