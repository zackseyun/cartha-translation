source:
  edition: SBLGNT
  text: Ἀγαπητοί, μὴ παντὶ πνεύματι πιστεύετε, ἀλλὰ δοκιμάζετε τὰ πνεύματα εἰ ἐκ τοῦ θεοῦ ἐστιν, ὅτι πολλοὶ ψευδοπροφῆται ἐξεληλύθασιν εἰς τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/001.yaml
  text: Beloved[a], do not believe every spirit, but test the spirits to see whether they are from God[b], because many false prophets have gone out into the world.
translation:
  language: sw
  text: Wapenzi[a], msiamini kila roho, bali zichunguzeni roho hizo ili kuona kama zinatoka kwa Mungu[b], kwa sababu manabii wengi wa uongo wamekwenda ulimwenguni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ndugu wapendwa.” Neno la Kigiriki, kwa maana halisi, ni namna ya kuwaita watu “wapendwa.”
    reason: lexical_alternative
  - marker: b
    text: Yaani, chunguzeni chanzo cha kiroho kilicho nyuma ya madai ya kinabii; sehemu inayofuata inawataja “manabii wa uongo” kuwa mawakala wa kibinadamu.
    reason: cultural_note
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: Wapenzi
  rationale: Ni neno la kuw خطاب? No. Need valid Swahili. Let's craft fully.
- source_word: παντὶ πνεύματι
  choice: kila roho
  rationale: Inahifadhi lugha ya moja kwa moja kuhusu roho na maana ya jumla, bila kuibana iwe walimu au matamko pekee.
- source_word: πιστεύετε
  choice: msiamini
  rationale: Amri hasi katika muktadha huu inakataza kukubali bila uchunguzi madai yanayotokana na kila roho.
- source_word: δοκιμάζετε τὰ πνεύματα
  choice: zijaribuni hizo roho
  rationale: Kujaribu huonyesha kuchunguza uhalisi au chanzo; kiwakilishi cha ngeli ya roho kinatoa Kiswahili cha kawaida.
- source_word: εἰ ἐκ τοῦ θεοῦ ἐστιν
  choice: ili kuona kama zinatoka kwa Mungu
  rationale: Kirai kinaonyesha uchunguzi wa chanzo; wingi wa Kiswahili hufuata 'roho' zinazojaribiwa.
- source_word: πολλοὶ ψευδοπροφῆται
  choice: manabii wengi wa uongo
  rationale: Ni tafsiri wazi na ya kawaida ya manabii wanaodai kusema kwa Mungu lakini ni wa uongo.
- source_word: ἐξεληλύθασιν εἰς τὸν κόσμον
  choice: wameingia ulimwenguni
  rationale: Wakati timilifu unaonyesha kuwa tayari wametokea na sasa wako hai ulimwenguni; 'wameingia' ni ya asili kuliko tafsiri ya neno kwa neno 'wametoka kwenda ndani ya ulimwengu'.
theological_decisions:
- issue: Rejeleo la 'roho'
  choice: Roho au vyanzo vya kiroho vilivyo nyuma ya madai ya kinabii, vinavyochunguzwa kupitia manabii wa kibinadamu
  alternative: Walimu wa kibinadamu tu, au matamko ya kinabii pekee
  rationale: Andiko linataja 'roho' kisha 'manabii wa uongo,' hivyo linatofautisha chanzo cha kiroho na mawakala wa kibinadamu bila kueleza kikamilifu uhusiano wao. Tafsiri inahifadhi mvutano huo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. 'Wapenzi' huhifadhi joto la salamu na uhusiano wake na upendo. Lugha ya 'roho' imehifadhiwa badala ya kufasiriwa kuwa walimu pekee.
