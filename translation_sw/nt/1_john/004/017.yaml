source:
  edition: SBLGNT
  text: ἐν τούτῳ τετελείωται ἡ ἀγάπη μεθ’ ἡμῶν, ἵνα παρρησίαν ἔχωμεν ἐν τῇ ἡμέρᾳ τῆς κρίσεως, ὅτι καθὼς ἐκεῖνός ἐστιν καὶ ἡμεῖς ἐσμεν ἐν τῷ κόσμῳ τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/017.yaml
  text: By this[a], love has been perfected with us, so that we may have boldness in the day of judgment, because as he is[d][c][b], so also are we in this world.
translation:
  language: sw
  text: Kwa njia hii[a], upendo umekamilishwa kwetu, ili tuwe na ujasiri[b] katika siku ya hukumu, kwa sababu kama yeye alivyo[c], ndivyo tulivyo sisi pia katika ulimwengu huu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Katika hili.” Maneno ya Kigiriki yanaweza kutaja jambo, njia, au hali ambayo upendo unakamilishwa; “kwetu” pia inaweza kutafsiriwa “miongoni mwetu.”
    reason: lexical_alternative
  - marker: b
    text: “Ujasiri” pia inaweza kutafsiriwa “uhakika.”
    reason: lexical_alternative
  - marker: c
    text: Huenda “yeye” anamrejelea Yesu; wengine huelewa kuwa anamrejelea Mungu kwa ujumla.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: Kwa jambo hili
  rationale: Huhifadhi nguvu ya kuonyesha jambo linalotajwa na inaweza kurejelea njia, ushahidi, au hali ambayo upendo unakamilishwa, bila kuamua kwa lazima kama maelezo yako kabla au baada yake.
- source_word: τετελείωται
  choice: umekamilishwa
  rationale: Kauli timilifu tendwa inaonyesha tendo lililofikia utimilifu na matokeo yake yanayoendelea; ‘umekamilishwa’ pia hudumisha uhusiano na wazo la kufikishwa kwenye kusudi lake.
- source_word: ἡ ἀγάπη
  choice: upendo
  rationale: Ni tafsiri ya kawaida, pana, na isiyobana kifungu kuwa upendo wa Mungu pekee au upendo wetu pekee.
- source_word: μεθ’ ἡμῶν
  choice: kwetu
  rationale: Katika Kiswahili, ‘kwetu’ ni ya asili kuliko ‘pamoja nasi’ katika muktadha huu na inaweza kueleza upendo unaofikia ukamilifu katika uhusiano na jumuiya ya waamini; tanbihi huhifadhi uwezekano wa ‘miongoni mwetu.’
- source_word: ἵνα
  choice: ili
  rationale: Huonyesha kusudi au matokeo kwa Kiswahili cha kawaida na wazi.
- source_word: παρρησίαν
  choice: ujasiri
  rationale: Huleta maana ya uhuru wa kusimama bila hofu, ingawa ‘uhakika’ pia inawezekana katika muktadha wa hukumu.
- source_word: ἐν τῇ ἡμέρᾳ τῆς κρίσεως
  choice: katika siku ya hukumu
  rationale: Ni usemi unaoeleweka wa kieskatolojia na hufuata muundo wa Kigiriki kwa karibu.
- source_word: ὅτι
  choice: kwa sababu
  rationale: Huonyesha wazi msingi wa kuwa na ujasiri siku ya hukumu.
- source_word: καθὼς ἐκεῖνός ἐστιν
  choice: kama yeye alivyo
  rationale: Huhifadhi wakati wa sasa na kiwakilishi cha Kigiriki bila kumtaja wazi anayerejelewa.
- source_word: καὶ ἡμεῖς ἐσμεν
  choice: ndivyo tulivyo sisi pia
  rationale: Muundo wa ‘kama... ndivyo...’ huwasilisha kwa Kiswahili ulinganisho wa καθώς...καί huku msisitizo wa ‘sisi’ ukihifadhiwa.
- source_word: ἐν τῷ κόσμῳ τούτῳ
  choice: katika ulimwengu huu
  rationale: Ni tafsiri ya kawaida ya maisha katika mazingira ya sasa ya kibinadamu na haiibadili κόσμος kuwa ‘enzi.’
theological_decisions:
- issue: Anayerejelewa na ‘yeye’ (ἐκεῖνος)
  choice: Kiwakilishi kimeachwa bila jina, huku muktadha ukiashiria Kristo/Mwana.
  alternative: Kumwelewa kuwa Mungu kwa ujumla.
  rationale: Matumizi ya ἐκεῖνος katika 1 Yohana mara nyingi humwelekea Yesu, lakini tafsiri inadumisha kutotajwa kwa jina kulikomo katika Kigiriki na tanbihi inaeleza uwezekano mwingine.
- issue: Maana ya upendo kukamilishwa
  choice: Upendo unafikishwa kwenye utimilifu wake katika uhusiano na waamini, na matokeo yake ni ujasiri siku ya hukumu.
  alternative: Upendo wetu kwa Mungu unakuwa mkamilifu kimaadili, au upendo wa Mungu kwetu peke yake unafikia ukamilifu.
  rationale: Kigiriki hakibani upendo huu kuwa wa upande mmoja tu. Tafsiri huepuka kuingiza fundisho la ukamilifu usio na dosari au kuufanya kuwa upendo wa Mungu pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi unabaki karibu na Kigiriki lakini hutumia ulinganisho wa asili wa Kiswahili, ‘kama... ndivyo...’. ‘Kwetu’ imechaguliwa badala ya ‘pamoja nasi’ ili kuepuka usemi mgumu, huku tanbihi ikihifadhi maana ya ‘miongoni mwetu.’
