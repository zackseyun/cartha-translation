  to: Kwa njia hii[a], upendo umekamilishwa kwetu, ili tuwe na ujasiri[b] katika siku ya hukumu, kwa sababu kama yeye alivyo[c], ndivyo tulivyo sisi pia katika ulimwengu huu.
