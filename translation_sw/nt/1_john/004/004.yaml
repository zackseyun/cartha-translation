id: 1JN.4.4
reference: 1 John 4:4
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὑμεῖς ἐκ τοῦ θεοῦ ἐστε, τεκνία, καὶ νενικήκατε αὐτούς, ὅτι μείζων ἐστὶν ὁ ἐν ὑμῖν ἢ ὁ ἐν τῷ κόσμῳ·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/004.yaml
  text: You are from God[a], little children, and you have overcome them[b], because the one who is in you is greater than the one who is in the world.
translation:
  language: sw
  text: Ninyi ni wa Mungu, watoto wadogo, nanyi mmewashinda[a], kwa sababu aliye ndani yenu ni mkuu kuliko aliye katika ulimwengu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, wapinzani waliotajwa katika mistari iliyotangulia, hasa manabii wa uongo.
    reason: cross_reference
  - marker: b
    text: Inaweza pia kutafsiriwa, “yeye aliye ndani yenu ... yeye aliye katika ulimwengu.” Kigiriki kinawaacha wahusika wote wawili bila kutajwa wazi; muktadha unaelekeza kwa Mungu au Roho wake kwa wa kwanza, na kwa yule mwovu aliye nyuma ya ulimwengu kwa wa pili.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑμεῖς
  choice: Ninyi
  rationale: Kiwakilishi hiki kimewekwa wazi na kina mkazo katika Kigiriki; “Ninyi” kinahifadhi mkazo huo kwa Kiswahili cha kawaida.
- source_word: ἐκ τοῦ θεοῦ
  choice: mmetokana na Mungu
  rationale: ἐκ hapa huonyesha chanzo au asili inayotokana na Mungu. “Mmetokana na Mungu” ni ya asili na inaweka wazi dhana hiyo bila kuipanua.
- source_word: τεκνία
  choice: watoto wadogo
  rationale: Neno hili la upendo ni umbo la udogo la τέκνον; “watoto wadogo” linahifadhi picha ya kifamilia na sauti ya upendo.
- source_word: νενικήκατε
  choice: mmewashinda
  rationale: Kauli timilifu inaonyesha ushindi uliopatikana wenye matokeo yanayoendelea; wakati timilifu wa Kiswahili unaakisi jambo hilo kwa kawaida.
- source_word: αὐτούς
  choice: wao
  rationale: Kiwakilishi kinarejelea waliotajwa katika muktadha bila kuwataja wazi zaidi; “wao” kinahifadhi urejeo huo.
- source_word: ὅτι
  choice: kwa sababu
  rationale: Kiunganishi hiki kinatoa sababu ya wao kuwashinda wapinzani.
- source_word: μείζων
  choice: mkuu kuliko
  rationale: “Mkuu” huhifadhi maana pana ya ulinganisho, badala ya kuifupisha kuwa nguvu pekee.
- source_word: ὁ ἐν ὑμῖν
  choice: aliye ndani yenu
  rationale: Kirai hiki kinamrejelea mtu bila kumtaja wazi; tafsiri hii ni ya kawaida na inahifadhi kutotajwa huko.
- source_word: ὁ ἐν τῷ κόσμῳ
  choice: aliye katika ulimwengu
  rationale: Muundo huu unaakisi kirai kilichotangulia na kuhifadhi utofautishaji wa balagha bila kumtambulisha mhusika moja kwa moja.
- source_word: κόσμῳ
  choice: ulimwengu
  rationale: Hili ndilo neno la msingi la κόσμος na haliongezi ufafanuzi wa kimafundisho katika matini kuu.
theological_decisions:
- issue: Utambulisho wa “aliye ndani yenu” na “aliye katika ulimwengu”
  choice: Wote wameachwa bila kutajwa majina katika matini kuu.
  alternative: Kumtaja wa kwanza kuwa Mungu au Roho wake, na wa pili kuwa yule mwovu.
  rationale: Muktadha unaelekeza kwa Mungu au Roho wake kwa wa kwanza na yule mwovu aliye nyuma ya ulimwengu kwa wa pili, lakini Kigiriki hakitaji majina yao. Tafsiri inahifadhi hali hiyo na mvutano wa kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi na marudio ya “aliye” yanahifadhi ulinganifu wa Kigiriki. Alama zote za tanbihi zimewekwa katika matini kuu.
