  text: The one who does not love has not known God[a], because God is love.
translation:
  language: sw
  text: Yeye asiyependa hajamjua Mungu[a], kwa sababu Mungu ni upendo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yeyote asiyependa hamjui Mungu.” Wakati wa kitenzi cha Kigiriki unaweza kutafsiriwa kwa kauli rahisi zaidi, lakini “hajamjua” hudumisha maana ya kwamba mtu huyo hajafikia hali ya kumjua Mungu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ μὴ ἀγαπῶν
  choice: Yeye asiyependa
  rationale: Kirai chenye kibainishi na kitenzi-shiriki cha wakati uliopo kinamtaja kwa ujumla mtu mwenye sifa ya kutopenda. Muundo huu ni wa kawaida katika Kiswahili na unaendeleza maana ya tabia inayoonekana.
- source_word: ἀγαπῶν
  choice: anapenda
  rationale: Mzizi wa kawaida wa ‘penda’ umetumiwa ili kudumisha uhusiano wa kileksia na ἀγάπη, ‘upendo,’ mwishoni mwa mstari.
- source_word: οὐκ ἔγνω
  choice: hajamjua
  rationale: Kauli hii huonyesha kwamba mtu huyo hajafikia hali ya kumjua Mungu. Wakati timilifu wa Kiswahili unaonyesha tendo lisilotimia pamoja na matokeo yake ya sasa, bila kupunguza ‘kujua’ kuwa ufahamu wa kiakili tu.
- source_word: τὸν θεόν
  choice: Mungu
  rationale: Ni yambwa ya moja kwa moja ya ‘hajamjua’; hili ndilo neno la kawaida na sahihi la Kiswahili.
- source_word: ὅτι
  choice: kwa sababu
  rationale: Hapa kiunganishi kinatoa sababu ya kauli iliyotangulia.
- source_word: ὁ θεὸς
  choice: Mungu
  rationale: Ni kiima cha kauli ya mwisho na limetafsiriwa kwa jina la kawaida la Mungu katika Kiswahili.
- source_word: ἀγάπη
  choice: upendo
  rationale: Nomino dhahania inadumishwa badala ya kugeuzwa kuwa kivumishi, na hivyo huhifadhi uzito wa kauli pamoja na uhusiano wake na ‘asiyependa.’
- source_word: ἐστίν
  choice: ni
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kitenzi kishirikishi cha wakati uliopo.
theological_decisions:
- issue: Maana ya kauli ‘Mungu ni upendo’
  choice: Mungu ni upendo
  alternative: Mungu ni mwenye upendo; Upendo ni Mungu
  rationale: Katika Kigiriki, ‘Mungu’ ndiye kiima na ‘upendo’ ni kiarifu. Tafsiri hii inadumisha uzito wa kauli kuhusu tabia au asili ya Mungu bila kuigeuza kimakosa kuwa ‘Upendo ni Mungu’ wala kuidhoofisha kuwa kivumishi pekee.
- issue: Hali ya kumjua Mungu
  choice: hajamjua Mungu
  alternative: hamjui Mungu; hajamwelewa Mungu
  rationale: Kauli hii inadumisha maana ya kumjua Mungu kwa uhusiano, jambo linalodhihirishwa na mwenendo, na pia inaonyesha kutofikia hali hiyo. Haibadili ‘kujua’ kuwa kuelewa kiakili tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo ‘Yeye asiyependa’ ni wa kawaida lakini pia unadumisha umoja wa jumla wa Kigiriki. Marudio ya mzizi ‘penda/upendo’ yamehifadhiwa makusudi.
