  text: Ἐν τούτῳ γινώσκομεν ὅτι ἐν αὐτῷ μένομεν καὶ αὐτὸς ἐν ἡμῖν, ὅτι ἐκ τοῦ πνεύματος αὐτοῦ δέδωκεν ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/013.yaml
  text: 'By this we know that we remain in him and he in us: because he has given us of his Spirit[a][b][c].'
translation:
  language: sw
  text: 'Kwa hili[a] tunajua kwamba tunakaa ndani yake[b], naye anakaa ndani yetu: kwa sababu ametupa Roho wake[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Katika hili tunajua …” Kirai cha Kigiriki kinaweza kutafsiriwa rasmi zaidi kwa namna hiyo.
    reason: lexical_alternative
  - marker: b
    text: Au “tunadumu ndani yake.” Kitenzi cha Kigiriki μένω ni neno muhimu katika maandishi ya Yohana, likimaanisha kuendelea katika uhusiano wa karibu na Mungu.
    reason: lexical_alternative
  - marker: c
    text: Kihalisi, “ametupa kutoka katika Roho wake.” Muundo huo hukazia kwamba alichotupa kinatoka katika Roho wake; Kiswahili cha kawaida husema “ametupa Roho wake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν τούτῳ
  choice: Kwa hili
  rationale: Katika muktadha huu, kirai hiki kinataja msingi au ushahidi ambao kwa huo waamini wanajua jambo linalofuata. “Kwa hili” ni Kiswahili cha kawaida kinachowasilisha maana hiyo bila kuondoa uwezekano wa tafsiri rasmi zaidi, “Katika hili.”
- source_word: γινώσκομεν
  choice: tunajua
  rationale: Kitenzi cha wakati uliopo kinaeleza ujuzi au uhakika unaoendelea; “tunajua” ni wazi na cha kawaida.
- source_word: ἐν αὐτῷ μένομεν
  choice: tunakaa ndani yake
  rationale: “Kukaa ndani ya” huhifadhi wazo la kuendelea katika uhusiano wa karibu, ambalo ni muhimu katika matumizi ya Yohana ya μένω, na linaeleweka kwa wasomaji wa kawaida.
- source_word: καὶ αὐτὸς ἐν ἡμῖν
  choice: naye anakaa ndani yetu
  rationale: Ingawa Kigiriki hakirudii kitenzi, Kiswahili hukihitaji hapa ili sentensi iwe ya kawaida na wazi. Kurudia “anakaa” kunadumisha ulinganifu wa kukaa kwao ndani yake na kwake ndani yao.
- source_word: ὅτι
  choice: kwa sababu
  rationale: ὅτι ya pili inaeleza msingi wa ujuzi uliotajwa; “kwa sababu” huonyesha kazi hiyo kwa Kiswahili cha asili.
- source_word: ἐκ τοῦ πνεύματος αὐτοῦ
  choice: Roho wake
  rationale: Kiswahili cha kawaida husema kwamba Mungu “ametupa Roho wake.” Nuansi ya ἐκ ya chanzo imehifadhiwa katika tanbihi kwa sababu tafsiri ya neno kwa neno “kutoka katika Roho wake” si ya kawaida na huenda ikadokeza isivyokusudiwa kwamba Roho amegawanywa.
- source_word: δέδωκεν ἡμῖν
  choice: ametupa
  rationale: “Ametupa” huhifadhi hali timilifu ya tendo lililofanyika ambalo matokeo yake yanaendelea, na pia huunganisha kiwakilishi cha yambwa kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Mhusika wa “wake” na utambulisho wa πνεῦμα
  choice: “Roho wake” humrejelea Mungu, na “Roho” huandikwa kwa herufi kubwa kumaanisha Roho Mtakatifu.
  alternative: Kuandika “roho” kwa herufi ndogo kama kipawa au mwelekeo wa kiroho kwa ujumla.
  rationale: Muktadha wa karibu unaonyesha kwamba kukaa kwa Mungu na waamini ndani ya wao kwa wao kunajulikana kwa zawadi ya Roho kutoka kwa Mungu. Herufi kubwa humtambulisha Roho bila kuongeza jina lisilotajwa katika mstari.
- issue: Lugha ya Yohana kuhusu kukaa ndani ya mwingine
  choice: “tunakaa ndani yake, naye anakaa ndani yetu”
  alternative: “tunadumu ndani yake, naye anadumu ndani yetu”
  rationale: Tafsiri hii huhifadhi uhusiano wa pande mbili na mwendelezo unaoonyeshwa na μένω. Kurudia kitenzi katika sehemu ya pili ni jambo la lazima kwa uwazi wa Kiswahili, ingawa Kigiriki kimekiacha kieleweke.
- issue: Nuansi ya ἐκ τοῦ πνεύματος αὐτοῦ
  choice: Maandishi makuu yanasema “ametupa Roho wake,” huku tanbihi ikihifadhi maana rasmi ya “kutoka katika Roho wake.”
  alternative: “ametupa sehemu ya Roho wake”
  rationale: “Sehemu ya” inaweza kudokeza kwamba Roho hugawanyika katika vipande, jambo ambalo Kigiriki hakilazimishi. Tafsiri iliyochaguliwa ni ya kawaida huku tanbihi ikihifadhi nuansi halisi ya chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Muundo wa sentensi umehifadhi ulinganifu wa Kigiriki, lakini kitenzi kilichodokezwa katika kishazi cha pili kimerudiwa ili Kiswahili kiwe wazi na cha asili. Alama zote za tanbihi [a], [b], na [c] zimewekwa katika maandishi makuu.
