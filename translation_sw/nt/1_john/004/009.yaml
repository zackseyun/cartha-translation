base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/009.yaml
  text: 'In this the love of God was revealed among us: that God has sent his one and only Son into the world so that we might live through him[a][b].'
translation:
  language: sw
  text: Katika hili upendo wa Mungu ulifunuliwa miongoni mwetu:[a] kwamba Mungu amemtuma Mwana wake wa pekee ulimwenguni ili tupate kuishi kwa njia yake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ndani yetu.” Usemi wa Kiyunani unaweza kumaanisha kwamba upendo ulifunuliwa ndani ya waamini au miongoni mwetu kama jumuiya.
    reason: lexical_alternative
  - marker: b
    text: 'Tafsiri ya kimapokeo ya “Mwana wake wa pekee”: “Mwana wake wa pekee aliyezaliwa.” Neno la Kiyunani μονογενής hukazia upekee wa Mwana.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: Katika hili
  rationale: Inahifadhi muundo wa Kiyunani unaotanguliza maelezo ya namna upendo ulivyofunuliwa.
- source_word: ἐφανερώθη
  choice: ulifunuliwa
  rationale: Kitenzi hiki kinaonyesha kwamba upendo ulidhihirishwa wazi au ulijulikana; “ulifunuliwa” ni Kiswahili cha sasa na chenye hadhi.
- source_word: ἡ ἀγάπη τοῦ θεοῦ
  choice: upendo wa Mungu
  rationale: Muktadha unaelekeza hasa kwenye upendo unaotoka kwa Mungu na unaoonekana katika kumtuma Mwana.
- source_word: ἐν ἡμῖν
  choice: kati yetu
  rationale: Huwasilisha maana ya kijumuiya ya upendo kudhihirishwa miongoni mwetu, huku uwezekano wa “ndani yetu” ukihifadhiwa katika tanbihi.
- source_word: ὅτι
  choice: kwamba
  rationale: Inatambulisha maelezo ya jambo ambalo kwalo upendo wa Mungu ulifunuliwa.
- source_word: τὸν υἱὸν αὐτοῦ τὸν μονογενῆ
  choice: Mwana wake wa pekee
  rationale: “Wa pekee” huonyesha upekee wa Mwana bila kuingiza moja kwa moja wazo la namna ya kuzaliwa; tafsiri ya kimapokeo imewekwa katika tanbihi.
- source_word: ἀπέσταλκεν
  choice: amemtuma
  rationale: Wakati timilifu wa Kiyunani unaonyesha tendo lililotimizwa lenye umuhimu unaoendelea; wakati timilifu wa Kiswahili unafaa hapa.
- source_word: εἰς τὸν κόσμον
  choice: ulimwenguni
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha kuingia katika ulimwengu ambamo Mwana alitumwa.
- source_word: ἵνα ζήσωμεν
  choice: ili tupate kuishi
  rationale: Huonyesha kusudi la kutumwa kwa Mwana bila kulifanya kuwa matokeo ya lazima.
- source_word: δι’ αὐτοῦ
  choice: kupitia yeye
  rationale: Huonyesha kwamba yeye ndiye njia au wakala ambaye kupitia kwake uzima hupatikana.
theological_decisions:
- issue: Maana ya μονογενής kuhusu Mwana
  choice: Mwana wake wa pekee
  alternative: Mwana wake pekee aliyezaliwa
  rationale: Maandishi yanakazia upekee wa uhusiano wa Mwana na Mungu. Tafsiri kuu haiongezi kwa lazima wazo la tendo la kuzaliwa, lakini tafsiri ya kihistoria imehifadhiwa katika tanbihi.
- issue: Nguvu ya ἐν ἡμῖν
  choice: kati yetu
  alternative: ndani yetu
  rationale: “Kati yetu” huonyesha udhihirisho wa upendo katika jumuiya au miongoni mwa waamini; Kiyunani pia kinaweza kueleweka kuwa “ndani yetu,” hivyo maana hiyo imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo unabaki karibu na Kiyunani bila kuwa mgumu; utata halisi wa “kati yetu/ndani yetu” na historia ya tafsiri ya μονογενής vimehifadhiwa kwa tanbihi.
