id: 1JN.4.18
reference: 1 John 4:18
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: φόβος οὐκ ἔστιν ἐν τῇ ἀγάπῃ, ἀλλ’ ἡ τελεία ἀγάπη ἔξω βάλλει τὸν φόβον, ὅτι ὁ φόβος κόλασιν ἔχει, ὁ δὲ φοβούμενος οὐ τετελείωται ἐν τῇ ἀγάπῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/018.yaml
  text: There is no fear in love[a], but perfect love drives out fear, because fear has punishment[c][b]. But the one who fears has not been perfected in love.
translation:
  language: sw
  text: Hakuna hofu katika upendo, bali upendo mkamilifu[a] huiondoa hofu, kwa sababu hofu ina adhabu.[b] Lakini anayeogopa hajakamilishwa katika upendo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “upendo uliokamilika” au “upendo uliofikia utimilifu wake.”
    reason: lexical_alternative
  - marker: b
    text: Kwa maana halisi, “hofu ina adhabu”; pia yaweza kueleweka, “hofu huhusiana na adhabu” au “hofu huambatana na adhabu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: φόβος / φοβούμενος
  choice: hofu / anayeogopa
  rationale: Maneno haya ya kawaida yanahifadhi urudiaji wa mzizi uleule katika mstari na yanafaa kwa hofu inayohusiana na adhabu.
- source_word: ἀγάπῃ / ἀγάπη
  choice: upendo
  rationale: Ni tafsiri ya kawaida na ya asili ya ἀγάπη, na inahifadhi neno kuu lilelile katika mstari mzima.
- source_word: τελεία
  choice: mkamilifu
  rationale: Linadumisha wazo la upendo uliofikia utimilifu wake na uhusiano wa kimaneno na τετελείωται, bila kuufanya mstari useme tu juu ya ukomavu wa kihisia.
- source_word: ἔξω βάλλει
  choice: huiondoa
  rationale: Ni Kiswahili cha kawaida kinachoonyesha kuondolewa kwa nguvu kwa hofu bila kutumia msemo mzito au usio wa asili.
- source_word: κόλασιν ἔχει
  choice: ina adhabu
  rationale: Inafuata kwa karibu muundo wa Kigiriki, ‘ina adhabu,’ na haifafanui kimya kimya ikiwa hofu huleta adhabu, huitazamia, au huhusiana nayo.
- source_word: τετελείωται
  choice: hajakamilishwa
  rationale: Kauli tendwa ya hali timilifu inahifadhiwa, pamoja na uhusiano wa mzizi na ‘mkamilifu’; inaonyesha hali iliyotokana na kutokufikishwa kwenye utimilifu.
- source_word: ἐν τῇ ἀγάπῃ
  choice: katika upendo
  rationale: Ni usemi mfupi na wa kawaida unaohifadhi wigo wa maana wa kuwa ndani ya mazingira au hali ya upendo.
theological_decisions:
- issue: Maana ya ‘upendo mkamilifu’ na ‘hajakamilishwa’
  choice: upendo mkamilifu / hajakamilishwa katika upendo
  alternative: upendo uliokomaa / hajakomaa katika upendo
  rationale: Uchaguzi huu unahifadhi uhusiano wa τελεία na τετελείωται na mvutano kati ya utimilifu wa upendo na kutokamilishwa kwa mtu katika upendo, bila kuingiza fundisho la kutokuwa na dhambi.
- issue: Uhusiano kati ya hofu na adhabu
  choice: hofu ina adhabu
  alternative: hofu huhusiana na adhabu; hofu huambatana na adhabu
  rationale: Kigiriki hakielezi wazi aina ya uhusiano huo. Tafsiri ya karibu pamoja na tanbihi huhifadhi utata huo badala ya kusema moja kwa moja kwamba hofu husababisha adhabu au ni matarajio yake tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni fupi na wazi. Urudiaji wa ‘hofu’ na ‘upendo’ umehifadhiwa, pamoja na uhusiano wa ‘mkamilifu’ na ‘hajakamilishwa.’
