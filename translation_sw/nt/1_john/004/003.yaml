  text: καὶ πᾶν πνεῦμα ὃ μὴ ὁμολογεῖ ⸀τὸν ⸀Ἰησοῦν ἐκ τοῦ θεοῦ οὐκ ἔστιν· καὶ τοῦτό ἐστιν τὸ τοῦ ἀντιχρίστου, ὃ ἀκηκόατε ὅτι ἔρχεται, καὶ νῦν ἐν τῷ κόσμῳ ἐστὶν ἤδη.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/003.yaml
  text: and every spirit that does not confess Jesus is not from God[a]. And this is the spirit of the antichrist, which you have heard is coming[c][b], and now is already in the world.
translation:
  language: sw
  text: Na kila roho isiyemkiri Yesu haitoki kwa Mungu.[a] Hii ndiyo roho ya mpinga Kristo,[b] ambayo mmesikia kuwa inakuja, na sasa tayari iko ulimwenguni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya nakala za kale zina maneno, “isiyekiri kwamba Yesu Kristo amekuja katika mwili.”
    reason: textual_variant
  - marker: b
    text: Kigiriki kimeacha nomino inayodokezwa; kwa tafsiri ya neno kwa neno zaidi, “hii ni ile ya mpinga Kristo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν πνεῦμα
  choice: kila roho
  rationale: Muundo huu ni wa kugawa mmoja mmoja na katika muktadha unarejelea mvuto au madai ya kiroho yanayopaswa kupimwa, si Roho Mtakatifu.
- source_word: ὁμολογεῖ τὸν Ἰησοῦν
  choice: isiyemkiri Yesu
  rationale: “Kumkiri Yesu” huhifadhi maana ya kukiri wazi na kujihusisha naye; maandishi ya SBLGNT yana usemi huu mfupi bila nyongeza ya “amekuja katika mwili.”
- source_word: ἐκ τοῦ θεοῦ
  choice: haitoki kwa Mungu
  rationale: ἐκ huonyesha chanzo au asili; “kutoka kwa Mungu” ni Kiswahili cha kawaida na sahihi.
- source_word: τοῦτό ἐστιν τὸ τοῦ ἀντιχρίστου
  choice: Hii ndiyo roho ya mpinga Kristo
  rationale: Ingawa Kigiriki hakirudii nomino πνεῦμα, nomino hiyo inaeleweka wazi kutokana na kishazi kilichotangulia. Kuitaja huleta Kiswahili cha asili bila kubadili maana; udondoshaji wa Kigiriki umeelezwa katika tanbihi.
- source_word: ἀντιχρίστου
  choice: mpinga Kristo
  rationale: Neno hili linamtaja anayempinga Kristo; kutenganisha “mpinga Kristo” ni wazi na kueleweka katika Kiswahili cha kawaida.
- source_word: ἀκηκόατε ὅτι ἔρχεται
  choice: ambayo mlisikia kwamba inakuja
  rationale: Kiwakilishi cha Kigiriki ni cha jinsia ya kati na kinaelekea kwenye jambo au roho iliyotajwa, hivyo “ambayo ... inakuja” huepuka kuligeuza bila msingi kuwa mtu wa kiume.
- source_word: ἐν τῷ κόσμῳ
  choice: ulimwenguni
  rationale: Hii ni tafsiri ya kawaida na yenye ufasaha ya mahali kwa κόσμος katika muktadha huu.
- source_word: ἤδη
  choice: tayari
  rationale: Neno hili linasisitiza kwamba uwepo huo umeanza sasa, si wa wakati ujao tu.
theological_decisions:
- issue: Muundo wa maandishi kuhusu ukiri unaokataliwa
  choice: Matini kuu inafuata usomaji mfupi wa SBLGNT, “isiyemkiri Yesu.”
  alternative: “isiyekiri kwamba Yesu Kristo amekuja katika mwili”
  rationale: Ushahidi wa matini muhimu unaunga mkono usomaji mfupi, huku mstari wa 2 tayari ukitoa maudhui ya ukiri huo. Usomaji mrefu umehifadhiwa katika tanbihi.
- issue: Kuweka wazi udondoshaji katika “τὸ τοῦ ἀντιχρίστου”
  choice: Kutaja “roho ya mpinga Kristo” katika matini kuu.
  alternative: 'Tafsiri ya karibu zaidi na umbo la Kigiriki: “hiki ndicho cha mpinga Kristo.”'
  rationale: Kigiriki hakirudii “roho,” lakini neno hilo linaeleweka kutokana na kishazi kilichotangulia. Kuliongeza kunaleta Kiswahili cha kawaida na wazi huku tanbihi ikihifadhi taarifa kuhusu udondoshaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Haitoki kwa Mungu” na “tayari iko ulimwenguni” ni miundo ya sasa na ya kawaida. Viwakilishi vya “roho” vimefuata ngeli ya 9.
