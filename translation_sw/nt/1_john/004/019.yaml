  text: We love because he first loved us[a].
translation:
  language: sw
  text: Sisi tunapenda kwa sababu yeye alitupenda kwanza.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Baadhi ya hati zina: “Sisi tunampenda kwa sababu yeye alitupenda kwanza.”'
    reason: textual_variant
lexical_decisions:
- source_word: ἡμεῖς
  choice: Sisi
  rationale: Kiwakilishi cha wazi katika Kigiriki kina mkazo au ulinganisho; “Sisi” kinahifadhi mkazo huo kwa Kiswahili cha kawaida.
- source_word: ἀγαπῶμεν
  choice: tunapenda
  rationale: Kitenzi cha wakati uliopo, nafsi ya kwanza wingi; “tunapenda” ni tafsiri ya moja kwa moja na hudumisha uhusiano wa msamiati wa upendo katika muktadha.
- source_word: ὅτι
  choice: kwa sababu
  rationale: 'Hapa kiunganishi kinaeleza sababu ya sisi kupenda: upendo wake uliotangulia.'
- source_word: αὐτὸς
  choice: yeye
  rationale: Katika muktadha kinamrejelea Mungu na kina mkazo; “yeye” kinahifadhi mkazo huo kwa njia ya kawaida.
- source_word: πρῶτος
  choice: kwanza
  rationale: Neno linaonyesha kwamba upendo wake ulitangulia na ndio msingi wa upendo wetu.
- source_word: ἠγάπησεν
  choice: alipenda
  rationale: Kitenzi cha aoristi kinaeleza tendo lililotangulia; kwa kuwa kiambishi cha yambwa kinafuata, umbo kamili katika sentensi ni “alitupenda.”
- source_word: ἡμᾶς
  choice: -tu- (katika “alitupenda”)
  rationale: Yambwa “sisi” huwakilishwa kwa kawaida na kiambishi -tu- ndani ya kitenzi cha Kiswahili.
theological_decisions:
- issue: Kama yambwa liongezwe baada ya “tunapenda”
  choice: 'Kuacha yambwa bila kutajwa: “Sisi tunapenda”'
  alternative: “Sisi tunampenda” au “Sisi tunampenda Mungu”
  rationale: 'Matini ya SBLGNT haina yambwa la wazi baada ya ἀγαπῶμεν. Kutoliongeza kunahifadhi upana na utata halisi wa matini: upendo wetu hutokana na upendo wa Mungu uliotangulia.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Mpangilio “Sisi tunapenda” unahifadhi mkazo wa kiwakilishi cha Kigiriki bila kufanya sentensi kuwa nzito.
