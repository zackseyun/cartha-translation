id: 1JN.4.15
reference: 1 John 4:15
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὃς ⸀ἐὰν ὁμολογήσῃ ὅτι ⸀Ἰησοῦς ἐστιν ὁ υἱὸς τοῦ θεοῦ, ὁ θεὸς ἐν αὐτῷ μένει καὶ αὐτὸς ἐν τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/015.yaml
  text: Whoever confesses that Jesus is the Son of God[a], God remains in him, and he in God.
translation:
  language: sw
  text: Yeyote anayekiri kwamba Yesu ni Mwana wa Mungu, Mungu anakaa[a] ndani yake, naye anakaa ndani ya Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “hudumu.” Kitenzi cha Kigiriki menō ni neno muhimu katika maandishi ya Yohana na kinaweza kutafsiriwa “kukaa” au “kudumu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς ἐὰν
  choice: Yeyote anaye-
  rationale: Muundo huu unaonyesha mtu yeyote bila kumwekea kikomo; “yeyote anaye-” ni wa kawaida na huhifadhi maana ya jumla ya kishazi cha Kigiriki.
- source_word: ὁμολογήσῃ
  choice: anayekiri
  rationale: “Kukiri” huonyesha kukubali na kutamka wazi ukweli unaomhusu Yesu, huku ikihifadhi uzito wa neno hili katika muktadha wa Yohana.
- source_word: Ἰησοῦς ἐστιν ὁ υἱὸς τοῦ θεοῦ
  choice: Yesu ni Mwana wa Mungu
  rationale: Huhifadhi kauli ya moja kwa moja na cheo muhimu cha Kikristo “Mwana wa Mungu” bila kukifafanua zaidi ya maandishi.
- source_word: ἐν αὐτῷ μένει
  choice: anakaa ndani yake
  rationale: “Anakaa” ni usemi wa sasa, wa kawaida, unaoweza kueleza kuendelea kuwapo katika uhusiano. Unafaa kwa matumizi muhimu ya μένω katika maandishi ya Yohana.
- source_word: καὶ αὐτὸς ἐν τῷ θεῷ
  choice: naye anakaa ndani ya Mungu
  rationale: Ingawa Kigiriki kinaacha kitenzi katika kishazi cha pili, kukirudia kwa Kiswahili kunafanya sentensi iwe kamili na ya asili huku kukihifadhi ulinganifu wa pande mbili.
theological_decisions:
- issue: Kukaa kwa Mungu ndani ya mtu na mtu ndani ya Mungu
  choice: Mungu anakaa ndani yake, naye anakaa ndani ya Mungu
  alternative: Mungu hudumu ndani yake, naye hudumu ndani ya Mungu
  rationale: Kauli ya pande mbili imehifadhiwa bila kuigeuza kuwa maelezo ya kimfumo au kuipunguza iwe ushirika wa kawaida tu.
- issue: Cheo cha Kristo
  choice: Mwana wa Mungu
  alternative: mwana wa Mungu
  rationale: Herufi kubwa katika “Mwana” inaonyesha kuwa huu ni mtajo maalumu wa Yesu, bila kuongeza madai yasiyosemwa wazi katika Kigiriki.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Yeyote anayekiri” ni rahisi kueleweka, na “anakaa ndani” huhifadhi lugha ya kiuhusiano ya Yohana. Kitenzi kimerudiwa katika kishazi cha pili kwa ufasaha wa Kiswahili.
