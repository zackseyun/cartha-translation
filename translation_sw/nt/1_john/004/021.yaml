  text: καὶ ταύτην τὴν ἐντολὴν ἔχομεν ἀπ’ αὐτοῦ, ἵνα ὁ ἀγαπῶν τὸν θεὸν ἀγαπᾷ καὶ τὸν ἀδελφὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/021.yaml
  text: 'And we have this commandment from him: that the one who loves God should also love his brother[a].'
translation:
  language: sw
  text: 'Na tunayo amri hii kutoka kwake: anayempenda Mungu ampende pia ndugu yake.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki linasema “ndugu yake” kwa umbo la umoja wa kiume, lakini linaweza kutumiwa kiuwakilishi kumaanisha mwamini mwenzake, mwanamume au mwanamke.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐντολήν
  choice: amri
  rationale: “Amri” ni neno la kawaida na lenye uzito wa mamlaka katika Kiswahili, na linafaa kwa matumizi ya kimaadili ya Yohana.
- source_word: ἀπ’ αὐτοῦ
  choice: kutoka kwake
  rationale: Kiwakilishi kimehifadhiwa badala ya kurudia “Mungu”; katika muktadha kinamrejelea Mungu huku mtiririko wa Kigiriki ukibaki wazi.
- source_word: ἵνα
  choice: ':'
  rationale: Katika sentensi hii ἵνα inatambulisha yaliyomo katika amri. Nukta mbili zinaonyesha uhusiano huo kwa Kiswahili cha kawaida bila kuifanya kishazi kuwa cha kusudi.
- source_word: ὁ ἀγαπῶν τὸν θεόν
  choice: anayempenda Mungu
  rationale: Muundo huu wa umoja ni wa asili katika Kiswahili na unawakilisha mtu yeyote anayempenda Mungu bila kuongeza jinsia isiyolazimishwa na sarufi ya Kiswahili.
- source_word: ἀγαπᾷ
  choice: ampende
  rationale: Hali ya kutegemea ya Kiswahili inaonyesha wajibu unaowekwa na amri, sambamba na subjunktivu ya Kigiriki baada ya ἵνα.
- source_word: ἀδελφὸν αὐτοῦ
  choice: ndugu yake
  rationale: “Ndugu yake” ni tafsiri ya kawaida ya Kiswahili inayohifadhi umoja na uhusiano wa karibu; katika Kiswahili “ndugu” inaweza kumaanisha mtu wa kiume au wa kike na, katika muktadha huu, mwamini mwenzake.
- source_word: καὶ
  choice: pia
  rationale: '“Pia” linaonyesha wazi nguvu ya nyongeza ya καί: kumpenda Mungu kunaambatana na kumpenda ndugu.'
- source_word: ἀγαπάω / ἀγαπῶν / ἀγαπᾷ
  choice: penda / anampenda / ampende
  rationale: Mzizi uleule wa Kiswahili umetumiwa kwa uthabiti ili kuhifadhi mshikamano wa mada ya upendo katika Yohana.
theological_decisions:
- issue: Rejeleo la umoja wa kiume katika ἀδελφὸν αὐτοῦ
  choice: ndugu yake
  alternative: ndugu yake wa kiume; mwamini mwenzake
  rationale: Kigiriki kina umbo la umoja wa kiume, lakini linaweza kutumika kiuwakilishi kwa mshiriki wa jumuiya ya waamini. “Ndugu” ni neno la asili la Kiswahili lisilobainisha jinsia, hivyo halifichi umoja wala haliongezi tafsiri ya kimadhehebu; tanbihi inaeleza upana wa matumizi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo “tunayo amri hii” ni wa kawaida na unaonyesha kuwa amri hiyo iko mikononi mwa jumuiya; “ampende” huwasilisha wajibu wa amri kwa uwazi bila kuongeza neno kama “lazima.”
