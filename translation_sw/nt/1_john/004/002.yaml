lexical_decisions:
- source_word: ἐν τούτῳ
  choice: Kwa hili
  rationale: Ni muundo wa kawaida wa Kiswahili unaotambulisha kipimo au njia ya kutambua jambo.
- source_word: γινώσκετε
  choice: mnaitambua
  rationale: Kitenzi hiki kimechukuliwa kuwa kauli elekezi ya wakati wa sasa, si amri; “mnaitambua” pia kinafaa katika muktadha wa kupambanua roho.
- source_word: τὸ πνεῦμα τοῦ θεοῦ
  choice: Roho wa Mungu
  rationale: Umoja wenye kibainishi na muktadha vinaelekeza kwa Roho wa Mungu; herufi kubwa inafuata desturi ya Kiswahili kwa rejeo hili.
- source_word: πᾶν πνεῦμα
  choice: kila roho
  rationale: Hii ni kauli jumuishi inayohusu kila roho au ushawishi wa kiroho unaopimwa.
- source_word: ὁμολογεῖ
  choice: inayokiri
  rationale: “Kukiri” huhifadhi maana ya kukubali na kutangaza wazi.
- source_word: Ἰησοῦν Χριστόν
  choice: Yesu Masihi
  rationale: Χριστός hapa imewasilishwa kama cheo chenye maana, “Masihi,” badala ya kutumiwa kana kwamba ni jina la ukoo.
- source_word: ἐν σαρκὶ
  choice: katika mwili
  rationale: Tafsiri hii hudumisha lugha halisi ya kifungu na uthibitisho wa kuja kwa Yesu katika ubinadamu wa kweli bila kuongeza istilahi za kiteolojia zisizomo katika Kigiriki.
- source_word: ἐληλυθότα
  choice: amekuja
  rationale: Kauli timilifu ya Kiswahili ni ya asili na inaonyesha kuja kulikotimia ambako umuhimu wake unaendelea.
- source_word: ἐκ τοῦ θεοῦ ἐστιν
  choice: inatoka kwa Mungu
  rationale: “Kutoka kwa” huonyesha chanzo au asili kama ἐκ katika Kigiriki.
theological_decisions:
- issue: Ikiwa τὸ πνεῦμα τοῦ θεοῦ inamtaja hasa Roho wa Mungu au roho fulani itokayo kwa Mungu
  choice: Roho wa Mungu
  alternative: roho itokayo kwa Mungu
  rationale: Umoja wenye kibainishi na utofautishaji unaofuata kati yake na “kila roho” unaunga mkono rejeo kwa Roho wa Mungu, bila kuingiza maelezo zaidi ya yaliyomo katika kifungu.
- issue: Nguvu ya kikristo ya ἐν σαρκὶ ἐληλυθότα
  choice: amekuja katika mwili
  alternative: amekuja akiwa mwanadamu
  rationale: Maneno haya yanathibitisha kuja halisi kwa Yesu katika mwili, huku yakihifadhi msamiati wa andiko na kuepuka istilahi za kiufundi za baadaye.
- issue: Uhusiano wa Ἰησοῦν Χριστόν na ἐληλυθότα
  choice: inayokiri kuwa Yesu Masihi amekuja katika mwili
  alternative: inayemkiri Yesu Masihi kuwa ndiye aliyekuja katika mwili
  rationale: Muundo mkuu ni wa asili katika Kiswahili na hudumisha Yesu Masihi kama mhusika wa kuja katika mwili. Tanbihi inaonyesha muundo mwingine unaowezekana wa sintaksia bila kuufanya kuwa uamuzi wa lazima katika matini.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wenye heshima na unaosomeka kwa urahisi. “Kwa hili” na “mnaitambua” vinaweka kauli kama maelezo ya kipimo cha utambuzi, si amri. “Katika mwili” imehifadhiwa kwa sababu ya uzito wake wa kimuktadha na kiteolojia.
