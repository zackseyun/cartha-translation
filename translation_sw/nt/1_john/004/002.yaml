  yaml_path: translation/nt/1_john/004/002.yaml
  text: 'By this you know the Spirit of God: every spirit that confesses Jesus the Messiah having come in the flesh is from God[c][b][a],'
translation:
  language: sw
  text: 'Kwa hili mnaitambua Roho wa Mungu: kila roho inayokiri kwamba Yesu, Masihi, amekuja katika mwili inatoka kwa Mungu.[c][b][a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Yesu Kristo.” Neno la Kigiriki Χριστός ni cheo chenye maana ya “Masihi.”
    reason: lexical_alternative
  - marker: b
    text: Au “Yesu, Masihi, aliyekuja katika mwili.” Kigiriki kinatumia umbo timilifu linalosisitiza kuja kulikotimia na umuhimu wake unaoendelea.
    reason: lexical_alternative
