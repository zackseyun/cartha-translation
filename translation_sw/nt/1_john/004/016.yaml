review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the two perfect verbs, the locative ambiguity of ἐν ἡμῖν, the concise declaration “God is love,” and the reciprocal μένω language. “Tumepata kujua,” however, is less idiomatic for ἐγνώκαμεν in this context; “tumekuja kujua” more naturally conveys coming to know. The revision retains “ndani yetu” and its communal alternative rather than adopting the more interpretive “kwa ajili yetu.”
  naturalness: The revision uses more natural contemporary Standard East African Swahili. “Anayekaa … hukaa” expresses the general, continuing force of the participle and present verbs without the somewhat cumbersome addition of “anayeendelea.”
  terminology: “Upendo,” “Mungu ni upendo,” and “kukaa katika/ndani ya” are appropriate and consistent renderings. The pronoun “yake” naturally remains gender-unspecified in Swahili while retaining the singular representative reference of αὐτῷ.
  issues:
  - severity: low
    issue: “Tumepata kujua” is awkward in this clause.
    rationale: Although understandable, it can suggest obtaining an opportunity or ability to know. “Tumekuja kujua” is a more idiomatic expression of a settled knowledge reached previously and still held.
  - severity: low
    issue: “Anayeendelea kukaa” is unnecessarily heavy.
    rationale: The relative present form “anayekaa,” together with the general-present “hukaa,” adequately conveys the continuing sense of μένω in modern Swahili.
  revised_text: Nasi tumekuja kujua na kuamini upendo ambao Mungu anao ndani yetu.[a] Mungu ni upendo, na anayekaa katika upendo hukaa ndani ya Mungu, naye Mungu hukaa ndani yake.[b]
  revised_footnotes:
  - marker: a
    text: Au, “miongoni mwetu.” Kifungu cha Kigiriki kinaweza kumaanisha upendo uliomo ndani yetu au unaodhihirishwa miongoni mwetu.
    reason: alternative_reading
  - marker: b
    text: Neno “yake” humrejelea mtu anayekaa katika upendo.
    reason: referent_clarification
  revision_rationale: The wording is revised only for idiomatic Swahili and smoother representation of the Greek verbal forms. The first occurrence of ἐν ἡμῖν remains “ndani yetu,” with “miongoni mwetu” retained in a footnote as a viable communal sense. The reciprocal indwelling structure is retained without theological expansion.
