revisions:
- from: Nasi tumepata kujua na kuamini upendo ambao Mungu anao ndani yetu.[a] Mungu ni upendo, na anayeendelea kukaa katika upendo anakaa ndani ya Mungu, na Mungu anakaa ndani yake.[b]
  to: Nasi tumekuja kujua na kuamini upendo ambao Mungu anao ndani yetu.[a] Mungu ni upendo, na anayekaa katika upendo hukaa ndani ya Mungu, naye Mungu hukaa ndani yake.[b]
  rationale: The wording is revised only for idiomatic Swahili and smoother representation of the Greek verbal forms. The first occurrence of ἐν ἡμῖν remains “ndani yetu,” with “miongoni mwetu” retained in a footnote as a viable communal sense. The reciprocal indwelling structure is retained without theological expansion.
  reviewer_model: gpt-5.6-terra
