source:
  edition: SBLGNT
  text: καὶ ἡμεῖς ἐγνώκαμεν καὶ πεπιστεύκαμεν τὴν ἀγάπην ἣν ἔχει ὁ θεὸς ἐν ἡμῖν. Ὁ θεὸς ἀγάπη ἐστίν, καὶ ὁ μένων ἐν τῇ ἀγάπῃ ἐν τῷ θεῷ μένει καὶ ὁ θεὸς ἐν αὐτῷ ⸀μένει.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/016.yaml
  text: And we have come to know and have believed the love that God has for us[a]. God is love, and the one who remains in love remains in God[c][b], and God remains in him.
translation:
  language: sw
  text: Nasi tumekuja kujua na kuamini upendo ambao Mungu anao ndani yetu.[a] Mungu ni upendo, na anayekaa katika upendo hukaa ndani ya Mungu, naye Mungu hukaa ndani yake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “miongoni mwetu.” Kifungu cha Kigiriki kinaweza kumaanisha upendo uliomo ndani yetu au unaodhihirishwa miongoni mwetu.
    reason: alternative_reading
  - marker: b
    text: Neno “yake” humrejelea mtu anayekaa katika upendo.
    reason: referent_clarification
lexical_decisions:
- source_word: ἐγνώκαμεν
  choice: tumepata kujua
  rationale: Wakati timilifu wa Kigiriki unaonyesha kwamba walifikia kumjua na hali hiyo inaendelea; “tumepata kujua” huwasilisha mchakato huo na matokeo yake ya sasa kwa Kiswahili cha kawaida.
- source_word: πεπιστεύκαμεν
  choice: kuamini
  rationale: Kitenzi hiki kiko sambamba na “tumepata kujua”; kisaidizi “tumepata” kinaeleweka kutawala vitenzi vyote viwili, huku “kuamini” kikionyesha imani iliyoimarika na inayoendelea.
- source_word: τὴν ἀγάπην
  choice: upendo
  rationale: “Upendo” ni neno la kawaida, lenye heshima, linalofaa kwa ἀγάπη katika muktadha huu.
- source_word: ἣν ἔχει ὁ θεὸς ἐν ἡμῖν
  choice: ambao Mungu anao ndani yetu
  rationale: Huhifadhi muundo wa kitenzi ἔχει na maana ya msingi ya mahali ya ἐν ἡμῖν bila kuibadili kimya kimya kuwa “kwa ajili yetu”; tanbihi inaonyesha uwezekano wa maana ya kijumuiya.
- source_word: Ὁ θεὸς ἀγάπη ἐστίν
  choice: Mungu ni upendo
  rationale: Hii ni tafsiri ya moja kwa moja na ya asili ya kishazi nomino-arifu.
- source_word: ὁ μένων
  choice: anayeendelea kukaa
  rationale: “Kukaa” huhifadhi wazo kuu la μένω la kudumu katika uhusiano; “anayeendelea” hufanya maana endelevu iwe wazi katika Kiswahili cha sasa.
- source_word: ἐν τῇ ἀγάπῃ
  choice: katika upendo
  rationale: “Katika” huonyesha upendo kama eneo au hali ambamo mtu hudumu, bila kuufanya kuwa hisia ya jumla tu.
- source_word: ἐν τῷ θεῷ μένει
  choice: anakaa ndani ya Mungu
  rationale: Huhifadhi lugha ya kukaa na mada ya kukaa kwa uhusiano ndani ya Mungu.
- source_word: ὁ θεὸς ἐν αὐτῷ μένει
  choice: Mungu anakaa ndani yake
  rationale: “Ndani yake” huakisi kiwakilishi cha umoja na uhusiano wa kukaa kwa pande zote, huku katika Kiswahili kikiweza kumrejelea mtu wa jinsia yoyote.
theological_decisions:
- issue: Maana ya ἐν ἡμῖν katika kishazi cha kwanza
  choice: ndani yetu
  alternative: miongoni mwetu; kwa ajili yetu
  rationale: “Ndani yetu” huhifadhi maana ya mahali iliyo ya moja kwa moja na uwezekano wa upendo kuwa ndani ya waamini. “Miongoni mwetu” pia inawezekana kwa maana ya kijumuiya, hivyo imewekwa katika tanbihi. “Kwa ajili yetu” ni tafsiri ya kifafanuzi zaidi na si maana ya kawaida ya ἐν.
- issue: Nguvu wakilishi ya αὐτῷ
  choice: ndani yake
  alternative: ndani ya mtu huyo
  rationale: Kiwakilishi cha Kigiriki ni umoja wa kiume kwa sababu kinarejelea ὁ μένων, lakini kinatumika kwa uwakilishi. Kiswahili “yake” hakilazimishi jinsia na bado huhifadhi umoja bila kuongeza ufafanuzi usio katika matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Anayeendelea kukaa” limetumiwa badala ya msamiati wa kale ili kuonyesha udumifu wa μένω kwa lugha inayoeleweka kwa wasomaji wa kawaida. Muundo wa kukaa ndani ya Mungu na Mungu kukaa ndani ya mtu umehifadhiwa ili kutobadili mvutano wa kiteolojia wa kukaa kwa pande zote.
