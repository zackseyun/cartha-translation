id: 1JN.4.6
reference: 1 John 4:6
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἡμεῖς ἐκ τοῦ θεοῦ ἐσμεν· ὁ γινώσκων τὸν θεὸν ἀκούει ἡμῶν, ὃς οὐκ ἔστιν ἐκ τοῦ θεοῦ οὐκ ἀκούει ἡμῶν. ἐκ τούτου γινώσκομεν τὸ πνεῦμα τῆς ἀληθείας καὶ τὸ πνεῦμα τῆς πλάνης.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/006.yaml
  text: We are from God[a]. The one who knows God listens to us; whoever is not from God does not listen to us[c][b]. By this we know the Spirit of truth and the spirit of error.
translation:
  language: sw
  text: Sisi tunatokana na Mungu. Anayemjua Mungu hutusikiliza; asiyetokana na Mungu hatusikilizi.[a] Kwa hili tunatambua Roho wa kweli[b][c] na roho ya udanganyifu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “hutusikia” katika sehemu zote mbili; kitenzi cha Kigiriki kinaweza kumaanisha kusikia, lakini hapa huenda kinamaanisha kusikiliza kwa kupokea ushuhuda wetu.
    reason: lexical_alternative
  - marker: b
    text: “Roho wa kweli” pia hupatikana katika Yohana 14:17; 15:26; 16:13.
    reason: cross_reference
  - marker: c
    text: Au “roho ya kweli.” Msemo huo unaweza kueleweka kwa maana ya jumla zaidi, ingawa katika maandishi ya Yohana kwa kawaida humrejelea Roho Mtakatifu.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκ τοῦ θεοῦ
  choice: twatokana na Mungu / anayetokana na Mungu
  rationale: “Kutokana na” huhifadhi wazo la ἐκ la chanzo au asili, badala ya kulifanya kuwa umilikaji tu. Muundo wa kwanza “twatokana” ni wa sasa na unaendana na ἐσμεν.
- source_word: γινώσκων τὸν θεόν
  choice: anayemjua Mungu
  rationale: Huwakilisha kishirikishi cha sasa chenye maana ya jumla na hali ya kudumu, kwa Kiswahili cha kawaida na chenye heshima.
- source_word: ἀκούει ἡμῶν
  choice: hutusikiliza
  rationale: 'Katika muktadha huu kitenzi kinamaanisha zaidi ya kusikia sauti tu: ni kusikiliza kwa kupokea ushuhuda wa mitume. “Hutusikiliza” haliongezi maana kali zaidi ya “hututii.”'
- source_word: ὃς οὐκ ἔστιν ἐκ τοῦ θεοῦ
  choice: asiyetokana na Mungu
  rationale: Hutoa maana ya jumla ya kiwakilishi cha Kigiriki na kudumisha ulinganifu na kauli ya mwanzo kuhusu chanzo au asili.
- source_word: ἐκ τούτου
  choice: kwa jambo hili
  rationale: Ni usemi wa kimahitimisho unaoonyesha kwamba kipimo kinachotangulia ndicho msingi wa utambuzi unaofuata.
- source_word: γινώσκομεν
  choice: tunatambua
  rationale: Muktadha wa kupima roho unaifanya “tunatambua” kuwa ya kawaida na wazi katika Kiswahili. Huhifadhi wazo la kujua kwa kutofautisha, bila kuongeza maelezo yasiyomo katika Kigiriki.
- source_word: τὸ πνεῦμα τῆς ἀληθείας
  choice: Roho wa kweli
  rationale: Katika matumizi ya Yohana, msemo huu kwa kawaida humrejelea Roho Mtakatifu. “Wa kweli” ni usemi wa asili katika Kiswahili na unaweza kumaanisha Roho anayehusishwa na kweli au aliye na sifa ya kweli.
- source_word: τὸ πνεῦμα τῆς πλάνης
  choice: roho ya upotovu
  rationale: πλάνη hujumuisha kosa, udanganyifu, na kupotoka kutoka katika kweli. “Upotovu” huhifadhi upana huo na kuunda ulinganifu wa wazi na “kweli.”
theological_decisions:
- issue: Ikiwa πνεῦμα katika msemo wa kwanza humrejelea Roho Mtakatifu
  choice: Roho wa kweli
  alternative: roho ya kweli
  rationale: Muktadha wa kupima roho katika 1 Yohana 4:1–6 na matumizi mapana ya Yohana yanaunga mkono rejeo kwa Roho Mtakatifu. Herufi kubwa inaonyesha rejeo hilo linalowezekana zaidi, huku tanbihi ikihifadhi uwezekano wa usomaji wa jumla zaidi.
- issue: Ikiwa ἀκούει ἡμῶν ni kusikia tu au kusikiliza kwa kuupokea ushuhuda
  choice: hutusikiliza
  alternative: hutusikia
  rationale: Hoja ya kifungu ni mwitikio kwa mafundisho na ushuhuda wa mitume. “Hutusikiliza” huonyesha upokeaji huo bila kuingiza dhana yenye nguvu zaidi ya utii.
- issue: Utambulisho wa wingi wa nafsi ya kwanza katika “ἡμεῖς” na “ἡμῶν”
  choice: sisi / -tu- bila kuongeza ufafanuzi
  alternative: sisi mitume
  rationale: Muktadha unaelekea kwa ushuhuda wenye mamlaka wa Yohana na wenzake, lakini Kigiriki hakisemi wazi “mitume.” Tafsiri haiongezi jina hilo na hivyo hailazimishi ufafanuzi wa kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Twatokana” ni kifupi cha kifasihi kinachoeleweka na kinasaidia kudumisha mkazo wa “Sisi” pamoja na hali ya sasa ya kauli; sentensi nyingine zimetumia miundo ya kawaida ili mstari ubaki wazi kwa msomaji wa kawaida.
