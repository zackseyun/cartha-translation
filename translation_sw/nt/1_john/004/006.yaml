  terminology: “Roho wa kweli” appropriately retains the likely Johannine reference signaled by capitalization, while the alternative reading is preserved in a footnote. “Roho ya udanganyifu” is natural and contextually precise for τὸ πνεῦμα τῆς πλάνης without specifying the identity of that spirit.
