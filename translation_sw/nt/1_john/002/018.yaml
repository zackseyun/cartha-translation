id: 1JN.2.18
reference: 1 John 2:18
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Παιδία, ἐσχάτη ὥρα ἐστίν, καὶ καθὼς ἠκούσατε ⸀ὅτι ἀντίχριστος ἔρχεται, καὶ νῦν ἀντίχριστοι πολλοὶ γεγόνασιν· ὅθεν γινώσκομεν ὅτι ἐσχάτη ὥρα ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/018.yaml
  text: Children[a], it is the last hour, and just as you heard that antichrist is coming, even now many antichrists have arisen[b]. From this we know that it is the last hour.
translation:
  language: sw
  text: Watoto, ni saa ya mwisho. Kama mlivyosikia kwamba mpinga Kristo anakuja,[a] hata sasa wapinga Kristo wengi wametokea.[b] Kutokana na hili tunajua kwamba ni saa ya mwisho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “yule mpinga Kristo anakuja.” Nomino ya Kigiriki haina kibainishi, lakini katika Kiswahili muktadha unaweza pia kumaanisha mtu maalumu aliyekuwa akitarajiwa.
    reason: alternative_reading
  - marker: b
    text: Au “wamejitokeza” au “wamekuja.” Kitenzi cha Kigiriki kinaonyesha kwamba wapinga Kristo wengi wametokea na sasa wapo.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παιδία
  choice: Watoto
  rationale: Ni wingi wa mwito wa kichungaji wenye hisia ya kifamilia. “Watoto” ni Kiswahili cha kawaida na chenye staha bila kuongeza maana ya udogo kwa kusema “watoto wadogo” au hisia isiyo wazi kwa kusema “watoto wapendwa.”
- source_word: ἐσχάτη ὥρα
  choice: saa ya mwisho
  rationale: Huhifadhi tamathali ya wakati na uzito wake wa kieskatolojia bila kuifanya saa halisi ya dakika sitini wala kufafanua mpango fulani wa nyakati za mwisho.
- source_word: καθὼς ἠκούσατε
  choice: Kama mlivyosikia
  rationale: Huonyesha ulinganifu na mafundisho ambayo wasomaji walikuwa wamekwisha kuyapokea kwa Kiswahili cha asili.
- source_word: ἀντίχριστος
  choice: mpinga Kristo
  rationale: Huhifadhi uhusiano wa wazi na Kristo na ni istilahi inayoeleweka katika Kiswahili. Nomino ya Kigiriki haina kibainishi, hivyo maandishi makuu hayaongezi kwa lazima maana ya mtu mmoja aliyefafanuliwa kikamilifu.
- source_word: ἔρχεται
  choice: anakuja
  rationale: Wakati wa sasa wa Kigiriki unaelekea kwenye ujio unaotarajiwa; “anakuja” huwasilisha maana hiyo kwa kawaida.
- source_word: καὶ νῦν
  choice: hata sasa
  rationale: Huleta mkazo na utofauti kati ya ujio uliotarajiwa na kuwapo tayari kwa wapinga Kristo wengi.
- source_word: ἀντίχριστοι πολλοὶ
  choice: wapinga Kristo wengi
  rationale: Huhifadhi neno lilelile katika wingi na hivyo kudumisha uhusiano wa kimakusudi na umoja uliotangulia.
- source_word: γεγόνασιν
  choice: wametokea
  rationale: Wakati timilifu unaonyesha kwamba wamejitokeza na sasa wapo. “Wametokea” ni ya asili na haidokezi tu tukio lililopita lisilo na matokeo ya sasa.
- source_word: ὅθεν γινώσκομεν
  choice: Kutokana na hili tunajua
  rationale: Huonyesha kwamba kuwapo kwa wapinga Kristo wengi ndilo jambo linalowezesha hitimisho linalofuata.
theological_decisions:
- issue: Maana ya “saa ya mwisho”
  choice: Kuhifadhi usemi wa wakati wenye uzito wa kieskatolojia bila kuufafanua zaidi
  alternative: Kutafsiri kama dakika au wakati mfupi kabisa unaokaribia mara moja, au kama usemi wa kawaida tu wa wakati wa hatari
  rationale: Muktadha unaonyesha hatua ya mwisho yenye umuhimu wa kieskatolojia, lakini tafsiri haipaswi kuamua mpangilio maalumu wa matukio ya mwisho.
- issue: Uhusiano kati ya “mpinga Kristo” wa umoja na “wapinga Kristo wengi”
  choice: Kuhifadhi umoja unaotarajiwa na wingi uliopo sasa bila kuupatanisha kimfumo
  alternative: Kufanya umoja uwe kundi la jumla tu, au kuufafanua wazi kuwa mtu mmoja maalumu
  rationale: Yohana anaweka kwa makusudi kile walichosikia kuhusu mpinga Kristo pamoja na hali ya sasa ya wapinga Kristo wengi; tafsiri inapaswa kuhifadhi mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye staha na kinachoeleweka kwa wasomaji wa kawaida. Sentensi zimegawanywa kwa mtiririko wa asili huku marudio ya “saa ya mwisho” na uhusiano wa “mpinga Kristo/wapinga Kristo” yakihifadhiwa.
