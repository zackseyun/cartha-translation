base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/021.yaml
  text: I have not written to you because you do not know the truth[a], but because you do know it[b], and because no lie is from the truth.
translation:
  language: sw
  text: Sikuwaandikia[a] kwa sababu hamjui kweli, bali kwa sababu mnaijua, na kwa sababu hakuna uongo wowote utokao katika kweli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Sijawaandikia.” Wakati uliopita wa Kigiriki unaweza kutafsiriwa kama wakati sahili uliopita; katika muktadha wa barua, unaweza pia kueleweka kama tendo lililokamilika ambalo wasomaji wamelipokea.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγραψα
  choice: Sikuwaandikia
  rationale: Wakati uliopita wa Kigiriki umetafsiriwa kwa wakati uliopita wa Kiswahili. Katika muktadha wa barua unaweza pia kueleweka kwa mtazamo wa wasomaji kama tendo lililokamilika, yaani ‘Nijawaandikia.’
- source_word: οἴδατε
  choice: mnajua / mnaijua
  rationale: Kitenzi hiki kina maana ya ‘kujua.’ Tofauti kati ya ‘hamjui’ na ‘mnaijua’ inahifadhi msisitizo wa sentensi bila kuongeza maneno yasiyohitajika.
- source_word: ἀλήθεια
  choice: kweli
  rationale: ‘Kweli’ ni neno la kawaida na lenye hadhi linalohifadhi upana wa maana ya Yohana bila kulifafanua kuwa ujumbe au fundisho fulani.
- source_word: πᾶν ψεῦδος
  choice: hakuna uongo wowote
  rationale: Muundo wa Kigiriki ni wa jumla, kihalisi ‘kila uongo ... si.’ Kiswahili cha kawaida huwasilisha ukanushi huo wa jumla kwa ‘hakuna uongo wowote.’
- source_word: ἐκ τῆς ἀληθείας
  choice: utokao katika kweli
  rationale: ἐκ huonyesha chanzo au asili. ‘Utokao katika’ ni wa asili katika Kiswahili na huhifadhi wazo la kutoka kwenye chanzo.
theological_decisions:
- issue: Maana ya ‘kweli’ katika matumizi ya Yohana
  choice: kweli
  alternative: ujumbe wa kweli; kweli ya Injili
  rationale: Aya haitaji waziwazi maana nyembamba zaidi. Kutumia ‘kweli’ kunahifadhi kina na upana wa usemi wa awali bila kuingiza ufafanuzi wa kimadhehebu.
- issue: Uhusiano wa uongo na kweli
  choice: hakuna uongo wowote utokao katika kweli
  alternative: hakuna uongo wowote ulio wa kweli
  rationale: Tafsiri iliyochaguliwa inahifadhi dhana ya chanzo iliyo katika ἐκ, bila kuipanua kuwa kauli tofauti kuhusu nafasi ya uongo ndani ya kweli.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi na inayoeleweka kwa urahisi. Muundo wa urudiaji ‘kwa sababu ... bali kwa sababu ... na kwa sababu’ umehifadhiwa ili kufuata msisitizo wa Kigiriki.
