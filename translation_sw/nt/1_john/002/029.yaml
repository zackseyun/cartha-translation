  yaml_path: translation/nt/1_john/002/029.yaml
  text: If you know that he is righteous[b][a], you know that everyone who practices righteousness has been born of him.
translation:
  language: sw
  text: Kama mnajua kwamba yeye ni mwenye haki[b], mnajua kwamba kila mtu atendaye haki amezaliwa naye[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutoka kwake.” Kirai cha Kigiriki kinaweza kutafsiriwa kwa njia hiyo.
    reason: lexical_alternative
  - marker: b
    text: Kiwakilishi “yeye” kinaweza kumrejelea Mungu Baba au Mwana; katika Kigiriki, anayerejelewa hajatamkwa wazi hapa.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐὰν
  choice: Kama
  rationale: Huanzisha sharti; “Kama” ni ya kawaida na ya moja kwa moja katika Kiswahili cha sasa.
- source_word: εἰδῆτε
  choice: mnajua
  rationale: Kitenzi οἶδα hapa kina maana ya kujua; umbo la sasa linafaa katika kishazi hiki cha sharti.
- source_word: δίκαιός
  choice: mwenye haki
  rationale: Huwasilisha sifa ya uadilifu wa kimaadili na kidini, huku kikidumisha uhusiano na δικαιοσύνη.
- source_word: γινώσκετε
  choice: mnajua
  rationale: Limechukuliwa kuwa kauli elezi, si amri. Kurudia “mnajua” hudumisha ulinganifu wa sentensi, ingawa Kigiriki kimetumia kitenzi tofauti.
- source_word: πᾶς ὁ ποιῶν
  choice: kila mtu anayetenda
  rationale: Kishiriki cha wakati uliopo kinaonyesha mwenendo wa kawaida au unaoendelea; “anayetenda” ni cha asili na hakiongezi dhana isiyoelezwa wazi.
- source_word: τὴν δικαιοσύνην
  choice: yaliyo ya haki
  rationale: Katika muktadha huu ni mwenendo unaolingana na haki; usemi huu wa Kiswahili ni wa asili kuliko nomino nzito “haki” baada ya “kutenda,” na unahifadhi mwangwi wa “mwenye haki.”
- source_word: ἐξ αὐτοῦ
  choice: na yeye
  rationale: Katika usemi wa kuzaliwa, Kiswahili hutumia kwa kawaida “kuzaliwa na” kuonyesha chanzo au mzazi; tanbihi inataja tafsiri mbadala ya karibu zaidi na muundo wa Kigiriki.
- source_word: γεγέννηται
  choice: amezaliwa
  rationale: Huwasilisha hali inayotokana na tendo lililokamilika la kuzaliwa, kwa umbo la kawaida la Kiswahili.
theological_decisions:
- issue: Kirejeleo cha αὐτός katika “δίκαιός ἐστιν ... ἐξ αὐτοῦ”
  choice: Kudumisha kiwakilishi “yeye” bila kumtaja wazi Mungu Baba au Mwana.
  alternative: Kutaja “Mungu Baba” au “Mwana.”
  rationale: Muktadha unaweza kuruhusu mjadala kuhusu anayerejelewa, na mstari wenyewe haumtajii jina. Kiwakilishi kinadumisha utata wa kweli wa maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Mwenye haki” na “yaliyo ya haki” hudumisha uhusiano wa maneno δίκαιος/δικαιοσύνη kwa lugha inayoeleweka. Alama zote za tanbihi zimewekwa katika matini kuu.
