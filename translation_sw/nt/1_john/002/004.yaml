base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/004.yaml
  text: The one who says[a], “I have come to know him,” and does not keep his commandments is a liar[b], and the truth is not in him.
translation:
  language: sw
  text: Yule anayesema[a], “Nimekuja kumjua,” na ambaye hashiki amri zake, ni mwongo, na kweli haimo ndani yake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “Yeyote asemaye.”'
    reason: lexical_alternative
  - marker: b
    text: 'Au: “kweli haimo ndani ya mtu huyo” au “ndani ya mtu wa namna hiyo.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ λέγων
  choice: Yule anayesema
  rationale: Kirai chenye kibainishi na kitenzi-shirikishi kinamtaja kwa ujumla mtu yeyote anayetoa dai hilo; tafsiri hii ni ya asili na yenye heshima katika Kiswahili cha sasa.
- source_word: Ἔγνωκα
  choice: Nimekuja kumjua
  rationale: Wakati timilifu wa Kigiriki unaonyesha hali ya sasa iliyotokana na kuanza kumjua hapo awali; maneno haya yanahifadhi mwelekeo huo wa uhusiano.
- source_word: τὰς ἐντολὰς αὐτοῦ
  choice: amri zake
  rationale: Neno ἐντολή humaanisha amri, na hapa wingi wake unarejelea maagizo ya Mungu bila kuongeza ufafanuzi usio katika matini.
- source_word: μὴ τηρῶν
  choice: hazishiki
  rationale: τηρέω ina maana ya kuzishika au kuzifuata amri. Muundo wa sasa unaonyesha kutokuzishika kama mwenendo, si tukio moja tu.
- source_word: ψεύστης
  choice: mwongo
  rationale: Nomino ya kiarifu inamweleza mtu huyo moja kwa moja kuwa mwongo, sawa na ukali wa matini ya Kigiriki.
- source_word: ἐν τούτῳ ἡ ἀλήθεια οὐκ ἔστιν
  choice: kweli haimo ndani yake
  rationale: Tafsiri hii inahifadhi lugha ya Yohana ya kweli kuwa ‘ndani’ ya mtu, bila kuibana iwe ukweli wa kauli pekee au uaminifu wa tabia pekee.
theological_decisions:
- issue: Kirejelewa cha αὐτόν / αὐτοῦ
  choice: Viwakilishi vya nafsi vimeachwa bila kumtaja moja kwa moja Mungu au Kristo.
  alternative: Kutafsiri waziwazi ‘Mungu’ au ‘Kristo.’
  rationale: Muktadha wa karibu unaelekeza kwa Mungu, lakini lugha ya Yohana huunganisha kwa karibu Mungu na Mwana. Kuhifadhi viwakilishi hakutatui kimya kimya mvutano huo.
- issue: Nguvu ya usemi wa Yohana kuhusu ‘kujua’
  choice: Nimekuja kumjua
  alternative: Ninamjua
  rationale: Tafsiri iliyochaguliwa inaonyesha uhusiano wa sasa uliotokana na kumjua hapo awali, bila kuufanya kuwa ufahamu wa kiakili tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Hazishiki amri zake’ hudumisha picha ya kuzishika amri huku ikieleweka kwa msomaji wa kawaida; ‘ndani yake’ huhifadhi nahau ya asili ya Yohana.
