  text: καὶ ὁ κόσμος παράγεται καὶ ἡ ἐπιθυμία αὐτοῦ, ὁ δὲ ποιῶν τὸ θέλημα τοῦ θεοῦ μένει εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/017.yaml
  text: And the world is passing away[a], along with its desire[b], but the one who does the will of God remains forever.
translation:
  language: sw
  text: Na ulimwengu unapita, pamoja na tamaa yake,[a] lakini mtu anayefanya mapenzi ya Mungu anadumu milele.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ulimwengu unapita, na tamaa yake pia.” Neno la Kigiriki linaweza pia kutafsiriwa “uchu” au “hamu kali”; hapa linahusu kwa upana tamaa potovu ya ulimwengu.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kigiriki linalotafsiriwa “anadumu” pia linaweza kutafsiriwa “anakaa”; ni neno muhimu katika maandishi ya Yohana kwa wazo la kuendelea kuwapo au kubaki.
    reason: lexical_alternative
lexical_decisions:
- source_word: κόσμος
  choice: ulimwengu
  rationale: Ni neno la kawaida na pana katika Kiswahili; katika muktadha wa 1 Yohana 2:15–16 linaeleweka kuwa ulimwengu wa maadili na tamaa unaompinga Mungu, bila kulibana wazi kuwa uumbaji wa kimwili.
- source_word: παράγεται
  choice: unapita
  rationale: Wakati wa sasa unaonyesha hali inayoendelea; “unapita” ni ya asili katika Kiswahili na huonyesha kutodumu kwa ulimwengu.
- source_word: ἐπιθυμία
  choice: tamaa
  rationale: “Tamaa” hubeba maana ya hamu yenye mwelekeo mbaya katika muktadha huu bila kuifanya kuwa tamaa ya kingono pekee.
- source_word: αὐτοῦ
  choice: yake
  rationale: Kiwakilishi kinarejelea “ulimwengu” na kudumisha upana wa usemi wa Kigiriki.
- source_word: ὁ δὲ ποιῶν
  choice: lakini mtu anayefanya
  rationale: Huwakilisha kishiriki chenye kutumiwa kama nomino na kumaanisha mtu anayetambulishwa kwa kutenda, kwa lugha ya sasa na ya asili.
- source_word: θέλημα τοῦ θεοῦ
  choice: mapenzi ya Mungu
  rationale: “Mapenzi ya Mungu” ni usemi wa kawaida, wenye heshima, unaohifadhi wazo la kusudi na matakwa ya Mungu.
- source_word: μένει
  choice: anadumu
  rationale: “Anadumu” huonyesha kuendelea kuwapo na tofauti iliyo wazi dhidi ya ulimwengu unaopita; pia ni ya kawaida kuliko “anakaa” katika sentensi hii.
- source_word: εἰς τὸν αἰῶνα
  choice: milele
  rationale: Ni tafsiri ya kawaida ya nahau hii inayowasilisha kuendelea kusiko na mwisho katika muktadha.
theological_decisions:
- issue: Maana ya κόσμος katika muktadha wa Yohana
  choice: Neno pana “ulimwengu,” likieleweka katika muktadha kuwa mpangilio wa maisha wenye tamaa unaompinga Mungu
  alternative: Uumbaji wa kimwili pekee
  rationale: Mistari 15–16 huufafanua ulimwengu kwa tamaa na majivuno yake. Tafsiri inadumisha neno pana la chanzo badala ya kuingiza ufafanuzi wa kiteolojia moja kwa moja katika maandishi.
- issue: Nguvu ya μένει εἰς τὸν αἰῶνα
  choice: Mtu anayefanya mapenzi ya Mungu anadumu milele
  alternative: Kufafanua usemi huo moja kwa moja kuwa fundisho kamili kuhusu uzima wa milele
  rationale: Kigiriki kinathibitisha kudumu bila kueleza utaratibu wake wa kiteolojia; tafsiri huhifadhi uzito na mvutano huo bila kuongeza maelezo yasiyotajwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Muundo wa kulinganisha ulimwengu unaopita na mtu anayedumu umehifadhiwa; “tamaa” haijabanwa kuwa ya kingono pekee.
