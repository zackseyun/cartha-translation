  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: γράφω ὑμῖν, πατέρες, ὅτι ἐγνώκατε τὸν ἀπ’ ἀρχῆς· γράφω ὑμῖν, νεανίσκοι, ὅτι νενικήκατε τὸν πονηρόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/013.yaml
  text: I write to you[a], fathers, because you have known him who is from the beginning; I write to you, young men, because you have overcome the evil one.
translation:
  language: sw
  text: Ninawaandikia ninyi, akina baba, kwa sababu mmemjua yeye aliye tangu mwanzo; ninawaandikia ninyi, vijana, kwa sababu mmemshinda yule mwovu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γράφω
  choice: ninawaandikia
  rationale: Wakati wa sasa katika muktadha wa barua unaelezwa kwa Kiswahili cha kawaida kwa ‘ninawaandikia’, ukidumisha tendo la mwandishi linaloendelea wakati wa kuandika.
- source_word: πατέρες
  choice: akina baba
  rationale: Huhifadhi maana ya moja kwa moja ya wingi wa ‘baba’ na namna ya kuwaita wahusika, bila kuifasiri kimya kimya kuwa ‘wazee’ au ‘waliokomaa kiroho’.
- source_word: ἐγνώκατε
  choice: mmemjua
  rationale: Kauli timilifu inaonyesha kumjua kulikotokea na ambako matokeo yake yanaendelea; ‘mmemjua’ huwasilisha jambo hilo kwa njia ya kawaida katika Kiswahili.
- source_word: τὸν ἀπ’ ἀρχῆς
  choice: yeye aliye tangu mwanzo
  rationale: Huhifadhi usemi wenye nafsi lakini usiotaja wazi mhusika, pamoja na wazo la kuwapo tangu mwanzo.
- source_word: νεανίσκοι
  choice: vijana
  rationale: Katika Kiswahili sanifu, ‘vijana’ ni namna ya kawaida ya kuwataja vijana wa kiume kulingana na muktadha; haisukumwi kuwa usemi mpana usio na alama ya jinsia kwa makusudi.
- source_word: νενικήκατε
  choice: mmemshinda
  rationale: Huwasilisha ushindi uliopatikana wenye matokeo yanayoendelea, na kiambishi cha yambwa ‘-m-’ kinaonyesha kuwa anayeshindwa ni nafsi.
- source_word: τὸν πονηρόν
  choice: yule mwovu
  rationale: Neno lililotumika kama nomino pamoja na umbo la kiume linaelekea kumaanisha adui mwovu mwenye nafsi, si uovu wa kidhahania.
theological_decisions:
- issue: Mhusika wa ‘yeye aliye tangu mwanzo’
  choice: Usemi umeachwa bila kumtaja mhusika kwa jina
  alternative: Kumtambulisha wazi kuwa Mwana/Masihi au Mungu kwa upana
  rationale: Matumizi ya Yohana yanaelekea sana kwa mhusika mwenye nafsi, huenda Mwana, lakini Kigiriki hakimtaji wazi katika mstari huu. Tafsiri inadumisha utata huo halisi.
- issue: Maana ya ‘yule mwovu’
  choice: Adui mwovu mwenye nafsi
  alternative: Uovu wa kidhahania
  rationale: Kivumishi cha kiume umoja chenye kibainishi, kilichotumika kama nomino, kinaunga mkono zaidi mhusika binafsi; hata hivyo, jina ‘Shetani’ halijaongezwa kwa kuwa halipo katika Kigiriki.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Marudio ya ‘ninawaandikia ninyi’ yamedumishwa ili kuakisi muundo sambamba wa Kigiriki. Hakuna alama ya tanbihi iliyowekwa kwa sababu utata kuhusu mhusika wa ‘yeye aliye tangu mwanzo’ umehifadhiwa moja kwa moja katika matini, na tanbihi ya Kiingereza inaonekana kuwekwa mahali pasipolingana na maudhui yake.
