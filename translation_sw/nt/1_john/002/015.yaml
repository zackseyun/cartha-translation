  text: Μὴ ἀγαπᾶτε τὸν κόσμον μηδὲ τὰ ἐν τῷ κόσμῳ. ἐάν τις ἀγαπᾷ τὸν κόσμον, οὐκ ἔστιν ἡ ἀγάπη τοῦ πατρὸς ἐν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/015.yaml
  text: Do not love the world or the things in the world[a]. If anyone loves the world[c][b], the love of the Father is not in him.
translation:
  language: sw
  text: Msiupende ulimwengu wala vitu vilivyomo ulimwenguni. Mtu akiupenda ulimwengu, upendo wa Baba[a] haumo ndani yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Upendo wa Baba” huenda ukamaanisha “upendo kwa Baba”; maana nyingine inayowezekana, ingawa si yenye uwezekano mkubwa, ni “upendo utokao kwa Baba.”
    reason: alternative_reading
lexical_decisions:
- source_word: Μὴ ἀγαπᾶτε
  choice: Msiupende
  rationale: Hutoa katazo la moja kwa moja na la jumla bila kulazimisha maana ya ‘acheni kuupenda’ kana kwamba tendo hilo tayari linaendelea.
- source_word: τὸν κόσμον
  choice: ulimwengu
  rationale: Ni tafsiri pana na ya kawaida ya κόσμος; katika muktadha huu inarejelea mpangilio wa maisha unaompinga Mungu, lakini tafsiri haiongezi ufafanuzi huo ndani ya mstari.
- source_word: μηδὲ τὰ ἐν τῷ κόσμῳ
  choice: wala vitu vilivyomo ulimwenguni
  rationale: ‘Wala’ huendeleza katazo hasi kwa Kiswahili cha kawaida, na ‘vitu vilivyomo ulimwenguni’ hufuata maana ya kirai cha Kigiriki kwa karibu.
- source_word: ἐάν τις ἀγαπᾷ
  choice: Mtu akiupenda
  rationale: Muundo huu wa Kiswahili huwasilisha sharti la jumla linalomhusu mtu yeyote bila kuwa mzito au usio wa kawaida.
- source_word: ἡ ἀγάπη τοῦ πατρὸς
  choice: upendo wa Baba
  rationale: Huhifadhi muundo na utata wa genitivi ya Kigiriki, ambayo inaweza kumaanisha hasa upendo kwa Baba, au pia kueleweka kuwa upendo utokao kwa Baba.
- source_word: ἐν αὐτῷ
  choice: haumo ndani yake
  rationale: Ni usemi wa asili unaohifadhi wazo la upendo kutokuwamo ndani ya mtu huyo; ‘yake’ kwa kawaida halazimishi jinsia katika Kiswahili.
theological_decisions:
- issue: Maana ya ‘ulimwengu’ katika maadili ya Yohana
  choice: ulimwengu
  alternative: mfumo wa ulimwengu / utaratibu wa kidunia
  rationale: Neno limeachwa pana kama katika Kigiriki. Muktadha unaonyesha kuwa katazo halilengi uumbaji wa Mungu au wanadamu wenyewe, bali yale yanayompinga Mungu; kulipanua ndani ya mstari kungefunga maana mapema mno.
- issue: Maana ya genitivi katika ‘ἡ ἀγάπη τοῦ πατρὸς’
  choice: upendo wa Baba
  alternative: upendo kwa Baba / upendo wa Baba kwa mtu
  rationale: Tofauti kati ya kumpenda ulimwengu na kumpenda Baba inaelekeza zaidi kwenye ‘upendo kwa Baba,’ lakini muundo wa Kigiriki unaweza pia kusomwa kama upendo utokao kwa Baba. Tafsiri kuu na tanbihi zinahifadhi mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. ‘Msiupende’ na ‘akiupenda’ vinatumia kiambishi cha ngeli kinacholingana na ‘ulimwengu.’ ‘Ndani yake’ ni ya kawaida na humrejelea mtu yeyote bila kuhitaji alama ya jinsia.
