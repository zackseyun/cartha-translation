id: 1JN.2.11
reference: 1 John 2:11
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὁ δὲ μισῶν τὸν ἀδελφὸν αὐτοῦ ἐν τῇ σκοτίᾳ ἐστὶν καὶ ἐν τῇ σκοτίᾳ περιπατεῖ, καὶ οὐκ οἶδεν ποῦ ὑπάγει, ὅτι ἡ σκοτία ἐτύφλωσεν τοὺς ὀφθαλμοὺς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/011.yaml
  text: But the one who hates his brother is in the darkness and walks in the darkness[a], and does not know where he is going, because the darkness has blinded his eyes.
translation:
  language: sw
  text: Lakini anayemchukia ndugu yake[a] yuko gizani na anatembea gizani, wala hajui anakokwenda, kwa sababu giza limepofusha macho yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, ndugu wa kiume au wa kike; Kigiriki husema “ndugu wa kiume” na huenda kinamrejelea mwamini mwenzake katika jumuiya ya Kikristo.
    reason: Hufafanua upeo unaowezekana wa ἀδελφός bila kubadilisha neno la matini kuu wala kulazimisha tafsiri ya kimafundisho.
lexical_decisions:
- source_word: μισῶν
  choice: anayemchukia
  rationale: Kauli ya wakati uliopo iliyotumiwa kama nomino inaeleza mtu mwenye msimamo au mwenendo wa kumchukia mwingine; muundo huu ni wa asili katika Kiswahili.
- source_word: ἀδελφὸν
  choice: ndugu yake
  rationale: Neno la Kigiriki ni la umoja wa kiume na hapa huenda linamaanisha mshiriki mwenzake katika jumuiya ya waamini. Kiswahili 'ndugu' huhifadhi picha ya kifamilia na linaweza kutumiwa kwa mwanamume au mwanamke kulingana na muktadha.
- source_word: ἐν τῇ σκοτίᾳ
  choice: gizani
  rationale: Huhifadhi sitiari ya Yohana ya kuwa ndani ya eneo la giza na marudio yake, kwa lugha ya kawaida ya Kiswahili.
- source_word: περιπατεῖ
  choice: anatembea
  rationale: Huhifadhi sitiari ya kutembea inayomaanisha mwenendo wa maisha badala ya kuibadili moja kwa moja kuwa ufafanuzi kama 'anaishi'.
- source_word: οὐκ οἶδεν ποῦ ὑπάγει
  choice: wala hajui anakokwenda
  rationale: Ni Kiswahili cha kawaida kinachohifadhi wazo la mwendo na kutokujua mwelekeo.
- source_word: ἐτύφλωσεν
  choice: limepofusha
  rationale: Huwasilisha tendo lililotokea lenye matokeo yanayoendelea sasa, huku likihifadhi giza kama mtendaji wa kisitiari.
- source_word: τοὺς ὀφθαλμοὺς αὐτοῦ
  choice: macho yake
  rationale: Ni umilikishi wa kawaida wa Kiswahili na huhifadhi picha halisi ya macho.
theological_decisions:
- issue: Maana ya kimaadili na kiroho ya giza katika ulinganifu wa Yohana
  choice: Kutafsiri σκοτία kwa sitiari ya moja kwa moja 'giza/gizani'.
  alternative: uovu; giza la dhambi
  rationale: Sitiari ya Yohana ina kina cha kimaadili na kiteolojia na inahifadhi ulinganifu wake na nuru bila kuifupisha kuwa ufafanuzi mmoja wa kimafundisho.
- issue: Mhusika anayerejelewa na 'ndugu'
  choice: Kutumia 'ndugu yake' katika matini kuu.
  alternative: ndugu yake wa kiume au wa kike; mwamini mwenzake
  rationale: Chanzo kina umoja wa kiume, lakini matumizi yake hapa huenda ni ya kiwakilishi kwa mshiriki mwenza wa jumuiya ya waamini. 'Ndugu' ni la asili katika Kiswahili na halilazimishi jinsia katika umbo lake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Marudio ya 'gizani' yamehifadhiwa kwa kusudi, na 'anatembea' inadumisha picha ya chanzo. Alama ya tanbihi [a] imewekwa katika matini kuu.
