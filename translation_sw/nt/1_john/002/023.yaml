  text: πᾶς ὁ ἀρνούμενος τὸν υἱὸν οὐδὲ τὸν πατέρα ἔχει· ⸂ὁ ὁμολογῶν τὸν υἱὸν καὶ τὸν πατέρα ἔχει⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/023.yaml
  text: Everyone who denies the Son does not have the Father either[a]; whoever confesses the Son has the Father also.
translation:
  language: sw
  text: Kila mtu anayemkana Mwana hana Baba pia[a]; naye anayemkiri Mwana ana Baba pia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Baadhi ya hati za kale hazina: “naye anayemkiri Mwana ana Baba pia.”'
    reason: textual_variant
lexical_decisions:
- source_word: πᾶς ὁ ἀρνούμενος
  choice: Kila mtu anayemkana
  rationale: Kirai hiki cha kisifa chenye kibainishi kina maana ya jumla. “Kila mtu anayemkana” ni Kiswahili cha kawaida kinachohifadhi upeo wa πᾶς na hali ya jumla ya kitenzi cha wakati uliopo.
- source_word: ἀρνούμενος
  choice: anayemkana
  rationale: Katika muktadha wa kukiri imani, ἀρνέομαι humaanisha kukana mtu au utambulisho wake. “Kumkana” ni sahihi na haiongezi maana pana ya kumkataa tu.
- source_word: τὸν υἱὸν
  choice: Mwana
  rationale: Kigiriki kinasema “Mwana” bila kuongeza “wa Mungu.” Herufi kubwa inaonyesha kuwa ni cheo mahususi cha Kikristo bila kuongeza maneno yasiyokuwapo katika chanzo.
- source_word: οὐδὲ τὸν πατέρα ἔχει
  choice: hana Baba pia
  rationale: '“Pia” huendeleza ukanushi kwa njia ya asili katika Kiswahili: anayemkana Mwana, hana Baba pia. “Kuwa na Baba” huhifadhi nahau ya Kiyohana bila kuifafanua kuwa ushirika au umiliki.'
- source_word: ὁ ὁμολογῶν
  choice: anayemkiri
  rationale: ὁμολογέω hapa ni kumkiri Mwana waziwazi. “Anayemkiri” hudumisha ulinganifu na “anayemkana” na ni yenye nguvu kuliko “anayemtambua.”
- source_word: καὶ τὸν πατέρα ἔχει
  choice: anaye Baba pia
  rationale: καί ina nguvu ya kuongezea katika ulinganifu huu. “Pia” huonyesha kwamba anayemkiri Mwana anaye Baba vilevile, huku “anaye Baba” ikihifadhi usemi wa chanzo.
theological_decisions:
- issue: Kifungu cha pili kilichowekwa katika alama za tahariri katika SBLGNT
  choice: 'Kimejumuishwa katika matini kuu: “anayemkiri Mwana anaye Baba pia.”'
  alternative: Kukiondoa kwa sababu hakipo katika baadhi ya hati za kale.
  rationale: SBLGNT imekichapisha kifungu hiki, ingawa inaonyesha tofauti ya matini. Kwa kuwa kipo katika matini ya chanzo iliyotolewa, kinatafsiriwa katika matini kuu; tofauti hiyo inaelezwa katika tanbihi.
- issue: Maana ya kimahusiano ya τὸν πατέρα ἔχει
  choice: Kuhifadhi usemi “anaye/hana Baba” bila kuufafanua zaidi.
  alternative: Kutafsiri “ana ushirika na Baba” au “ni wa Baba.”
  rationale: Usemi wa Kiyohana una uzito mpana wa kiteolojia. Kuuhifadhi huepuka kuufungia katika aina moja tu ya uhusiano na hudumisha mvutano wa matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. “Kumkana/kumkiri” huhifadhi ulinganifu wa kimakusudi wa sentensi, na “Mwana” pamoja na “Baba” zimetumiwa kama vyeo mahususi.
