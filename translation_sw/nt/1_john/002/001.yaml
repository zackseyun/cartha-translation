  text: Τεκνία μου, ταῦτα γράφω ὑμῖν ἵνα μὴ ἁμάρτητε. καὶ ἐάν τις ἁμάρτῃ, παράκλητον ἔχομεν πρὸς τὸν πατέρα Ἰησοῦν Χριστὸν δίκαιον,
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/001.yaml
  text: My little children[a], I write these things to you so that you may not sin. But if anyone does sin[b], we have an advocate with the Father—Jesus the Messiah the Righteous One.
translation:
  language: sw
  text: Watoto wangu, ninawaandikia mambo haya ili msifanye dhambi. Lakini mtu yeyote akifanya dhambi, tunaye mtetezi[a] kwa Baba—Yesu Masihi[b], mwenye haki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki παράκλητος linaweza pia kueleweka kwa upana kuwa “msaidizi,” “mshauri,” au “mfariji.”
    reason: lexical_alternative
  - marker: b
    text: 'Tafsiri ya jadi: “Kristo.” Cheo cha Kigiriki Χριστός kinaweza kumaanisha “Masihi” au kutumiwa kama sehemu ya jina, “Kristo.”'
    reason: alternative_reading
lexical_decisions:
- source_word: Τεκνία μου
  choice: Watoto wangu wadogo
  rationale: Huhifadhi taswira ya kifamilia na upole wa umbo la udogo τεκνία. Ingawa ni namna ya upendo ya kuwaita wasomaji, tafsiri hii haiondoi kwa maelezo maana halisi ya ‘watoto’.
- source_word: ταῦτα γράφω ὑμῖν
  choice: ninawaandikia mambo haya
  rationale: Wakati wa sasa wa γράφω unafaa kutolewa kwa hali ya kuendelea katika barua; ‘mambo haya’ huhifadhi rejeo la jumla la ταῦτα bila kulibainisha kupita kiasi.
- source_word: ἵνα μὴ ἁμάρτητε
  choice: ili msitende dhambi
  rationale: Hutoa wazi kusudi la ἵνα pamoja na hali tegemezi, bila kudai kwamba wasomaji tayari wamefikia kutokuwa na dhambi kabisa.
- source_word: καὶ ἐάν τις ἁμάρτῃ
  choice: Lakini mtu yeyote akitenda dhambi
  rationale: ‘Lakini’ huonyesha tofauti ya kimuktadha kati ya kusudi la kutotenda dhambi na uwezekano wa mtu kutenda dhambi; muundo wa ‘akitenda’ hutoa sharti halisi bila kulifanya kuwa jambo la lazima.
- source_word: παράκλητον
  choice: mtetezi
  rationale: Katika muktadha wa kuwa mbele za Baba, ‘mtetezi’ huwasilisha kazi ya uwakilishi na utetezi ya παράκλητος. Tanbihi huhifadhi upana wa maana unaoweza kujumuisha msaidizi, mshauri, au mfariji.
- source_word: πρὸς τὸν πατέρα
  choice: mbele za Baba
  rationale: Hueleza uwepo wenye mwelekeo kwa Baba na inafaa kwa muktadha wa mtetezi, bila kuifanya πρός kuwa mwendo wa mahali tu.
- source_word: Ἰησοῦν Χριστὸν
  choice: Yesu, Masihi
  rationale: Χριστός hapa inaweza kueleweka kama cheo cha Yesu; ‘Masihi’ huhifadhi maana hiyo. Koma zinaonyesha kwamba ‘Masihi’ ni cheo katika mfuatano wa maelezo.
- source_word: δίκαιον
  choice: yule Mwenye Haki
  rationale: Hutoa kivumishi δίκαιον kama maelezo ya kiapposisheni kuhusu Yesu na kuhifadhi uzito wake wa kikristolojia kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Maana ya Χριστός katika jina na cheo cha Yesu
  choice: Masihi
  alternative: Kristo
  rationale: Muundo wa mstari unaruhusu Χριστός kusikika kama cheo, hivyo ‘Masihi’ imechaguliwa; ‘Kristo,’ ambalo limezoeleka kama sehemu ya jina, limehifadhiwa katika tanbihi.
- issue: Uhusiano kati ya kusudi la kutotenda dhambi na uwezekano wa kutenda dhambi
  choice: Kuhifadhi ‘ili msitende dhambi’ pamoja na ‘akitenda dhambi’
  alternative: Kutafsiri kwa namna inayodai kutowezekana kwa mwamini kutenda dhambi
  rationale: Mstari wenyewe unaweka pamoja wito wa kutotenda dhambi na sharti linalokubali uwezekano wa dhambi; tafsiri haipaswi kuondoa mvutano huo.
- issue: Wajibu wa παράκλητος mbele za Baba
  choice: mtetezi
  alternative: msaidizi, mshauri, au mfariji
  rationale: ‘Mtetezi’ inafaa zaidi kwa uwakilishi wa Yesu mbele za Baba, lakini tanbihi inakiri upana halisi wa neno la Kigiriki.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Watoto wangu wadogo’ huhifadhi upendo wa kichungaji na taswira ya kifamilia; ‘mbele za Baba’ na ‘mtetezi’ hudumisha mwelekeo wa uwakilishi bila kuongeza mfumo maalumu wa kimadhehebu.
