base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/010.yaml
  text: The one who loves his brother remains in the light[a], and there is no cause for stumbling in him.
translation:
  language: sw
  text: Yule anayempenda ndugu yake hubaki katika nuru, na ndani yake hakuna kikwazo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na hakuna kikwazo kwake.” Kirai cha Kigiriki kinaweza kueleweka ama kuwa hakuna kikwazo ndani yake, ama kuwa hakuna kikwazo kwake.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ἀγαπῶν
  choice: Yule anayempenda
  rationale: Kirai cha Kigiriki ni kitenzi-shirikishi chenye kibainishi kinachomtaja mtu kwa ujumla na kuonyesha tendo linaloendelea; “yule anayempenda” ni Kiswahili cha sasa na cha kawaida.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: ndugu yake
  rationale: “Ndugu” hufuata neno la Kigiriki ἀδελφός bila kulipanua wazi kuwa “mwamini mwenzake”; muktadha unaweza kuonyesha uhusiano wa kijumuiya.
- source_word: ἐν τῷ φωτὶ
  choice: katika nuru
  rationale: Inahifadhi taswira ya Yohane ya kuwamo katika nuru na inasikika kwa kawaida katika Kiswahili cha kibiblia cha sasa.
- source_word: μένει
  choice: hubaki
  rationale: Wakati uliopo una nguvu ya hali endelevu au ya kawaida; “hubaki” huhifadhi maana hiyo bila kutumia lugha ya kizamani.
- source_word: σκάνδαλον
  choice: sababu ya kujikwaa
  rationale: Neno linaweza kumaanisha kikwazo, mtego, au kisababishi cha kuanguka; usemi huu huhifadhi sitiari pamoja na maana yake ya kimaadili.
- source_word: ἐν αὐτῷ
  choice: ndani yake
  rationale: Hili ndilo badiliko la moja kwa moja zaidi na kwa kawaida humrejelea mtu anayependa, huku uwezekano wa maana “kwake” ukihifadhiwa katika tanbihi.
- source_word: οὐκ ἔστιν
  choice: hakuna
  rationale: Muundo huu wa kuwapo ndio njia ya kawaida ya Kiswahili ya kueleza ukanushaji wa jambo lililopo.
theological_decisions:
- issue: Maana na rejeo la καὶ σκάνδαλον ἐν αὐτῷ οὐκ ἔστιν
  choice: Ndani ya mtu anayempenda ndugu yake hakuna sababu ya kujikwaa.
  alternative: Hakuna kikwazo kwake.
  rationale: Kirai ἐν αὐτῷ kinaweza kueleweka kuwa “ndani yake” au, kwa upana wa kimuktadha, “kwake.” Tafsiri kuu inahifadhi maana ya ndani bila kuamua ikiwa kujikwaa kunamhusu yeye mwenyewe au watu wengine; tanbihi inadumisha uwezekano mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Taswira za “nuru” na “kujikwaa” zimehifadhiwa, na utata halisi wa kishazi cha mwisho umeonyeshwa katika tanbihi.
