  text: ⸀ὑμεῖς ὃ ἠκούσατε ἀπ’ ἀρχῆς, ἐν ὑμῖν μενέτω· ἐὰν ἐν ὑμῖν μείνῃ ὃ ἀπ’ ἀρχῆς ἠκούσατε, καὶ ὑμεῖς ἐν τῷ υἱῷ καὶ ἐν τῷ πατρὶ μενεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/024.yaml
  text: As for you[a], let what you heard from the beginning remain in you. If what you heard from the beginning remains in you[b], you also will remain in the Son and in the Father.
translation:
  language: sw
  text: Ninyi[a], kile mlichosikia tangu mwanzo, na kidumu ndani yenu. Ikiwa kile mlichosikia tangu mwanzo kitadumu ndani yenu[b], ninyi pia mtadumu ndani ya Mwana na ndani ya Baba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nanyi.” Kiwakilishi hiki kilichotangulizwa huwatia wasomaji mkazo na kuwatofautisha na wale waliotajwa katika muktadha.
    reason: lexical_alternative
  - marker: b
    text: “Kidumu” limetafsiri kutoka kitenzi kilekile cha Kigiriki kinachorudiwa katika aya hii; linaweza pia kutafsiriwa “kikae.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: Nanyi
  rationale: Kiwakilishi kilichotangulizwa kina mkazo na kinaonyesha tofauti na waliotajwa katika muktadha; “Nanyi” huleta mkazo huo kwa Kiswahili cha kawaida.
- source_word: ὃ ἠκούσατε ἀπ’ ἀρχῆς
  choice: yale mliyoyasikia tangu mwanzo
  rationale: “Yale” huhifadhi upana wa kiwakilishi husishi cha Kigiriki bila kukifafanua moja kwa moja kuwa injili au mafundisho; umbo la wingi ni la kawaida kwa Kiswahili linaporejelea mambo yaliyosikiwa.
- source_word: ἀπ’ ἀρχῆς
  choice: tangu mwanzo
  rationale: Ni usemi wa kawaida na wenye hadhi unaohifadhi mwangwi wa usemi wa Kiyohana.
- source_word: ἐν ὑμῖν μενέτω
  choice: na yadumu ndani yenu
  rationale: Agizo hili linataka mwendelezo. “Kudumu” huonyesha kuendelea kuwapo na pia huruhusu mzizi uleule kutumiwa katika aya yote.
- source_word: ἐὰν ἐν ὑμῖν μείνῃ
  choice: Ikiwa ... yatadumu ndani yenu
  rationale: Huhifadhi sharti la ἐάν na kurudia kwa kitenzi μένω kwa lugha ya asili ya Kiswahili.
- source_word: καὶ ὑμεῖς
  choice: nanyi pia
  rationale: Huhifadhi kiwakilishi chenye mkazo pamoja na maana ya nyongeza ya καί.
- source_word: ἐν τῷ υἱῷ καὶ ἐν τῷ πατρὶ
  choice: ndani ya Mwana na ndani ya Baba
  rationale: Kurudia “ndani ya” kunahifadhi ulinganifu wa vifungu viwili vya Kigiriki na uhusiano unaoelezwa.
- source_word: μενεῖτε
  choice: mtadumu
  rationale: Wakati ujao wa Kigiriki umetafsiriwa moja kwa moja, huku uhusiano wa kimsamiati na matumizi ya awali ya μένω ukihifadhiwa.
theological_decisions:
- issue: Asili ya ahadi yenye sharti katika kifungu cha mwisho
  choice: “nanyi pia mtadumu ndani ya Mwana na ndani ya Baba”
  alternative: Kukitafsiri kama agizo, au kukifafanua kwa mfumo maalumu wa kiteolojia kuhusu kudumu katika imani
  rationale: Kigiriki kina wakati ujao wa taarifa ndani ya sentensi yenye sharti. Tafsiri inaacha mvutano huo bila kuingiza hitimisho la kimadhehebu.
- issue: Kirejelewa cha “yale mliyoyasikia tangu mwanzo”
  choice: Kudumisha usemi mpana katika matini kuu
  alternative: “injili” au “ujumbe wa mitume”
  rationale: Muktadha unaelekeza kwenye ujumbe wa awali kuhusu Mwana, lakini Kigiriki hakitaji nomino hiyo waziwazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Yale mliyoyasikia” huepuka kuongeza nomino isiyokuwapo wazi katika Kigiriki, na “kudumu” hudumisha urudiaji muhimu wa μένω katika aya nzima.
