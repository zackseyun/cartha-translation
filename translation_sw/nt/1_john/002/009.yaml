id: 1JN.2.9
reference: 1 John 2:9
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὁ λέγων ἐν τῷ φωτὶ εἶναι καὶ τὸν ἀδελφὸν αὐτοῦ μισῶν ἐν τῇ σκοτίᾳ ἐστὶν ἕως ἄρτι.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/009.yaml
  text: The one who says he is in the light and hates his brother is in the darkness until now[a].
translation:
  language: sw
  text: Anayesema kwamba yuko nuruni na huku anamchukia ndugu yake, bado yuko gizani mpaka sasa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki kina neno la kiume katika umoja, “ndugu wa kiume,” lakini katika muktadha huu wa kimaadili linaweza kutumiwa kiuwakilishi na kumaanisha ndugu wa kiume au wa kike.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λέγων
  choice: Anayesema
  rationale: Kifungu chenye kibainishi na kitenzi-ushiriki kinamtaja mtu wa mfano. “Anayesema” ni muundo wa kawaida wa Kiswahili unaohifadhi maana hiyo na hali ya kitendo kinachoendelea.
- source_word: ἐν τῷ φωτὶ εἶναι
  choice: kwamba yuko nuruni
  rationale: Baada ya kitenzi “kusema,” Kiswahili cha kawaida hutumia kishazi kamili. “Nuruni” huhifadhi taswira ya Yohana ya kuwapo katika mazingira ya nuru ya kiroho na kimaadili.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: ndugu yake
  rationale: “Ndugu” ni tafsiri ya asili na yenye heshima ya ἀδελφός katika muktadha huu. Kiswahili halilazimishi jinsia katika neno hili; tanbihi inaeleza umbo la kiume la Kigiriki bila kuingiza tafsiri finyu ya uhusiano huo katika matini kuu.
- source_word: μισῶν
  choice: huku anamchukia
  rationale: Muundo huu unaonyesha kwamba chuki inaendelea wakati mtu huyo anadai kuwa nuruni, na unahifadhi nguvu ya kitenzi-ushiriki cha wakati wa sasa.
- source_word: ἐν τῇ σκοτίᾳ
  choice: yuko gizani
  rationale: Huhifadhi ulinganifu wa kimafumbo kati ya nuru na giza kwa Kiswahili cha kawaida.
- source_word: ἕως ἄρτι
  choice: mpaka sasa
  rationale: Ni tafsiri ya moja kwa moja ya usemi wa wakati unaoonyesha hali iliyoendelea hadi wakati huu. Neno “bado” linasisitiza mwendelezo huo kwa njia ya kawaida katika Kiswahili.
theological_decisions:
- issue: Upeo wa ἀδελφός katika kauli ya kimaadili yenye mtu mmoja wa mfano
  choice: ndugu yake
  alternative: ndugu yake wa kiume; ndugu mwamini mwenzake
  rationale: “Ndugu yake” huhifadhi neno la uhusiano bila kuamua kimya kimya kwamba linamaanisha muumini mwenzake pekee. Kwa kuwa “ndugu” katika Kiswahili linaweza kumhusu mwanamume au mwanamke, tanbihi inaweka wazi kwamba Kigiriki kimetumia umbo la kiume katika umoja, ambalo linaweza kuwa la uwakilishi katika muktadha huu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Nuruni” na “gizani” zinahifadhi taswira kuu ya Yohana; sentensi imeundwa kwa urahisi ili ieleweke kwa msomaji wa kawaida bila kupoteza mkazo wa hali inayoendelea.
