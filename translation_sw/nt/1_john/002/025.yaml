lexical_decisions:
- source_word: ἐπαγγελία / ἐπηγγείλατο
  choice: ahadi / aliyetuahidi
  rationale: Maneno haya yanahifadhi uhusiano wa wazi kati ya nomino na kitenzi cha mzizi mmoja katika Kigiriki, huku yakisomeka kwa kawaida katika Kiswahili.
- source_word: αὐτός
  choice: yeye mwenyewe
  rationale: Kauli hii inadumisha msisitizo wa kiwakilishi cha Kigiriki bila kutaja wazi kama anayerejelewa ni Baba au Mwana.
- source_word: ἡμῖν
  choice: -tu-
  rationale: Kiambishi cha yambwa katika “aliyetuahidi” ndicho njia ya kawaida na fasaha ya kuonyesha kwamba ahadi ilitolewa kwetu.
- source_word: τὴν ζωὴν τὴν αἰώνιον
  choice: uzima wa milele
  rationale: Hii ni tafsiri ya kawaida na iliyo wazi ya kirai hiki katika matumizi ya Yohana; pia inaonyesha kwamba uzima wa milele ndio yaliyomo katika ahadi.
- source_word: καὶ αὕτη ἐστίν
  choice: Na hii ndiyo
  rationale: Kauli hii huunganisha mstari na yaliyotangulia na kutambulisha ahadi inayofafanuliwa, bila kuongeza maelezo yasiyomo katika matini.
theological_decisions:
- issue: Anayerejelewa na kiwakilishi αὐτός
  choice: yeye mwenyewe
  alternative: Baba; Mwana
  rationale: Matini ya mstari huu haitaji tena wazi anayerejelewa. Tafsiri inadumisha msisitizo na uwazi huo bila kuamua kati ya Baba na Mwana.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Mpangilio “aliyetuahidi yeye mwenyewe” ni wa asili katika Kiswahili na unadumisha msisitizo wa αὐτός.
