  text: ⸀ἔγραψα ὑμῖν, παιδία, ὅτι ἐγνώκατε τὸν πατέρα· ἔγραψα ὑμῖν, πατέρες, ὅτι ἐγνώκατε τὸν ἀπ’ ἀρχῆς· ἔγραψα ὑμῖν, νεανίσκοι, ὅτι ἰσχυροί ἐστε καὶ ὁ λόγος τοῦ θεοῦ ἐν ὑμῖν μένει καὶ νενικήκατε τὸν πονηρόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/014.yaml
  text: I have written to you[a], children, because you have known the Father. I have written to you, fathers, because you have known him who is from the beginning. I have written to you, young men, because you are strong, and the word of God remains in you[c][b], and you have overcome the evil one.
translation:
  language: sw
  text: Nimewaandikia ninyi, watoto, kwa sababu mmemjua Baba. Nimewaandikia ninyi, akina baba, kwa sababu mmemjua yeye aliye tangu mwanzo.[a] Nimewaandikia ninyi, wanaume vijana, kwa sababu mna nguvu, na neno la Mungu linakaa ndani yenu,[b] nanyi mmemshinda yule mwovu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Inaelekea kwamba “yeye aliye tangu mwanzo” ni Mwana aliyekuwako tangu mwanzo, lakini hapa maandishi hayamtaji kwa jina.
    reason: alternative_reading
  - marker: b
    text: Au, “neno la Mungu linadumu ndani yenu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγραψα
  choice: Nimewaandikia
  rationale: Kauli ya wakati uliopita katika muktadha wa barua inaelezwa kwa hali timilifu ya Kiswahili, ikionyesha tendo lililokamilika lenye umuhimu wa sasa na kuhifadhi urudiaji wa kisanaa.
- source_word: παιδία
  choice: watoto
  rationale: Huhifadhi lugha ya kifamilia ya mwandishi bila kuongeza kivumishi cha hisia ambacho hakijasemwa wazi.
- source_word: ἐγνώκατε
  choice: mmemjua
  rationale: Hali timilifu huonyesha kwamba walipata kumjua na uhusiano huo wa kumjua unaendelea.
- source_word: τὸν πατέρα
  choice: Baba
  rationale: Katika matumizi ya Yohana, hili ni jina la cheo linalomhusu Mungu.
- source_word: πατέρες
  choice: akina baba
  rationale: Huhifadhi mwito wa kiume na mpangilio wa makundi matatu bila kuufasiri moja kwa moja kuwa ‘wazee’.
- source_word: τὸν ἀπ’ ἀρχῆς
  choice: yeye aliye tangu mwanzo
  rationale: Huhifadhi mhusika akiwa hajatajwa kwa jina na haiongezi utambulisho wa Kristo ingawa muktadha wa Yohana unaelekea huko.
- source_word: νεανίσκοι
  choice: vijana
  rationale: Katika Kiswahili cha kawaida, ‘vijana’ ni mwito wa asili kwa kundi hili; muktadha wa jozi yake na ‘akina baba’ unabeba rejeleo la wanaume vijana.
- source_word: ἰσχυροί
  choice: mna nguvu
  rationale: Ni usemi wa kawaida na wa moja kwa moja unaofaa nguvu ya kiroho au kimaadili katika muktadha.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: neno la Mungu
  rationale: Huhifadhi usemi wa kibiblia na kuacha wazi ikiwa ni ujumbe wa Mungu kwa jumla au habari njema iliyohubiriwa.
- source_word: μένει
  choice: linakaa ndani yenu
  rationale: ‘Kukaa ndani’ ni Kiswahili cha asili kinachohifadhi wazo la kudumu la neno la msingi la Kiyohana μένω.
- source_word: νενικήκατε
  choice: mmemshinda
  rationale: Hali timilifu huonyesha ushindi uliopatikana ambao matokeo yake yanaendelea.
- source_word: τὸν πονηρόν
  choice: yule mwovu
  rationale: Umbo lenye kibainishi na la kiume linaelekeza kwa mhusika binafsi, si uovu wa kidhahania.
theological_decisions:
- issue: Mhusika wa ‘yeye aliye tangu mwanzo’
  choice: 'Ameachwa bila kutajwa kwa jina: ‘yeye aliye tangu mwanzo’.'
  alternative: Kumtaja wazi kuwa Kristo au Mwana; au kuufasiri kwa jumla kuwa Mungu.
  rationale: Matumizi ya Yohana yanaelekea kwa Mwana aliyekuwako kabla, lakini mstari wenyewe haumtajii jina. Tafsiri huhifadhi mvutano huo.
- issue: Jinsia ya makundi yanayoitwa
  choice: παιδία imetafsiriwa ‘watoto’, πατέρες ‘akina baba’, na νεανίσκοι ‘vijana’.
  alternative: Kuyafanya makundi yote kuwa majina yasiyoonyesha jinsia, au kutafsiri ‘vijana’ kuwa ‘wanaume vijana’.
  rationale: ‘Akina baba’ huhifadhi alama ya kiume iliyo wazi. ‘Vijana’ ni neno la kawaida zaidi katika Kiswahili, na muktadha wa kulinganisha na akina baba unaonyesha kundi la wanaume vijana bila usemi mzito.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Urudiaji wa ‘Nimewaandikia ninyi’ umehifadhiwa kwa ajili ya mkazo wa kisanaa. ‘Linakaa ndani yenu’ ni lugha ya kawaida lakini hudumisha dhana muhimu ya Kiyohana ya kukaa au kudumu.
