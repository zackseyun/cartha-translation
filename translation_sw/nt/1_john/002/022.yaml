  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: τίς ἐστιν ὁ ψεύστης εἰ μὴ ὁ ἀρνούμενος ὅτι Ἰησοῦς οὐκ ἔστιν ὁ χριστός; οὗτός ἐστιν ὁ ἀντίχριστος, ὁ ἀρνούμενος τὸν πατέρα καὶ τὸν υἱόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/022.yaml
  text: 'Who is the liar except the one who denies that Jesus is the Messiah? This is the antichrist: the one who denies the Father and the Son[a][b].'
translation:
  language: sw
  text: Ni nani aliye mwongo isipokuwa yule anayekana kwamba Yesu si Masihi? Huyu ndiye mpinga-Masihi—yule anayemkana Baba na Mwana.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kristo.” Neno la Kigiriki ὁ χριστός ni cheo; hapa limetafsiriwa “Masihi.”
    reason: alternative_reading
  - marker: b
    text: Au, “Mpinga Kristo.” Neno la Kigiriki lina kibainishi, “mpinga-Masihi.” Katika barua za Yohana linaweza kumaanisha mpinzani wa aina inayotambulishwa kwa kumkana Baba na Mwana.
    reason: lexical_alternative
lexical_decisions:
- source_word: ψεύστης
  choice: aliye mwongo
  rationale: Nomino yenye kibainishi inamtambulisha kwa mkazo mtu wa aina inayozungumziwa; muundo huu ni wa kawaida na wenye hadhi katika Kiswahili.
- source_word: ἀρνούμενος
  choice: yule anayekana / anayemkana
  rationale: Kivumishi-endelevu cha Kigiriki kinatumika kama nomino na kinaonyesha tabia bainifu au inayoendelea. 'Anayekana' hutumiwa kabla ya kishazi, na 'anayemkana' kwa yambwa wa mtu.
- source_word: ὅτι Ἰησοῦς οὐκ ἔστιν ὁ χριστός
  choice: kwamba Yesu siye Masihi
  rationale: ὅτι huanzisha maudhui ya kukana, na οὐκ hubaki ndani ya maudhui hayo. 'Siye' inasisitiza utambulisho unaokanwa.
- source_word: ὁ χριστός
  choice: Masihi
  rationale: Hapa Χριστός ni cheo kinachodaiwa kuhusu Yesu, hivyo 'Masihi' huhifadhi maana yake ya kimasiya kuliko kuitumia kama jina tu.
- source_word: ὁ ἀντίχριστος
  choice: mpinga-Masihi
  rationale: Neno la Kiswahili linaonyesha kwa uwazi uhusiano wa kupinga Masihi. 'Ndiye' pamoja na muktadha huwasilisha utambulisho wenye ubainifu wa kibainishi cha Kigiriki bila kulazimisha kuwa ni mtu mmoja tu wa wakati wa mwisho.
- source_word: τὸν πατέρα καὶ τὸν υἱόν
  choice: Baba na Mwana
  rationale: Herufi kubwa zinaonyesha marejeo mahususi kwa Mungu Baba na Mwana katika uhusiano wao, si ubaba na uwana kwa ujumla.
- source_word: οὗτός ἐστιν
  choice: Huyu ndiye
  rationale: Muundo huu unarejelea moja kwa moja mtu aliyefafanuliwa katika sentensi iliyotangulia na kuhifadhi nguvu ya utambulisho.
theological_decisions:
- issue: Tafsiri ya Χριστός katika kauli ya kukiri au kukana utambulisho wa Yesu
  choice: Masihi
  alternative: Kristo
  rationale: Neno hilo linafanya kazi kama cheo hapa. 'Masihi' linaweka wazi dai la kimasiya linalokanwa bila kulifanya neno hilo kuwa jina la kawaida.
- issue: Marejeo ya ἀντίχριστος
  choice: mpinga-Masihi
  alternative: Mpinga Kristo
  rationale: Tafsiri hii ni wazi na inalingana na 'Masihi' katika kishazi cha kwanza. Haibainishi kimabavu kama neno hilo linamaanisha mtu mmoja wa mwisho au aina ya mpinzani; utata huo wa Kiyohana unabaki.
- issue: Uhusiano wa kumkana Baba na Mwana
  choice: yule anayemkana Baba na Mwana
  alternative: anayewakataa Baba na Mwana
  rationale: '''Kumkana'' huhifadhi kitenzi kilekile cha msingi kilichotumiwa kwa kukana dai kuhusu Yesu na kuonyesha kwamba tendo hilo linawahusu wote wawili bila kueleza zaidi ya maandishi.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye hadhi na inayoeleweka kwa wasomaji wa kawaida. Muundo wa swali la balagha na urudiaji wa 'kukana' vimehifadhiwa. Alama zote za tanbihi zimewekwa katika matini kuu.
