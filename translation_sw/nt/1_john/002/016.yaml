id: 1JN.2.16
reference: 1 John 2:16
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὅτι πᾶν τὸ ἐν τῷ κόσμῳ, ἡ ἐπιθυμία τῆς σαρκὸς καὶ ἡ ἐπιθυμία τῶν ὀφθαλμῶν καὶ ἡ ἀλαζονεία τοῦ βίου, οὐκ ἔστιν ἐκ τοῦ πατρός, ἀλλὰ ἐκ τοῦ κόσμου ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/016.yaml
  text: For everything in the world—the desire of the flesh[a], the desire of the eyes, and the pride of life—is not from the Father[c][b], but is from the world.
translation:
  language: sw
  text: Kwa maana kila kilicho ulimwenguni—tamaa ya mwili[a], tamaa ya macho, na majivuno ya maisha[b]—hakitokani na Baba, bali hutokana na ulimwengu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “tamaa ya asili ya dhambi.” Neno la Kigiriki linalotafsiriwa “mwili” linaweza, katika baadhi ya miktadha, kumaanisha hali ya mwanadamu iliyoelekezwa kwenye dhambi. Pia “tamaa” hapa ni hamu kali, si lazima tamaa ya kingono pekee.
    reason: lexical_alternative
  - marker: b
    text: Au, “majivuno kuhusu hali ya maisha.” Kirai hiki kinaweza kujumuisha kujivunia hadhi, mali, au namna ya kuishi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Kwa maana
  rationale: Inaonyesha sababu inayofafanua agizo lililotangulia, kwa Kiswahili cha kawaida na fasaha.
- source_word: πᾶν τὸ ἐν τῷ κόσμῳ
  choice: kila kilicho ulimwenguni
  rationale: Muundo wa umoja usio na jinsia una maana ya ujumla; tafsiri hii huhifadhi upana huo kwa lugha ya asili ya Kiswahili.
- source_word: κόσμῳ / κόσμου
  choice: ulimwengu
  rationale: Huhifadhi neno la msingi bila kulifafanua kupita kiasi kuwa mfumo fulani wa ulimwengu.
- source_word: ἐπιθυμία
  choice: tamaa
  rationale: Katika muktadha huu neno linaonyesha hamu kali yenye mwelekeo mbaya; 'tamaa' si lazima iwe ya kingono pekee.
- source_word: τῆς σαρκὸς
  choice: ya mwili
  rationale: Huhifadhi taswira ya σάρξ na mvutano wake wa kitheolojia bila kuibadili moja kwa moja kuwa 'asili ya dhambi'.
- source_word: τῶν ὀφθαλμῶν
  choice: ya macho
  rationale: Ni ulinganifu wa moja kwa moja unaohifadhi wingi wa Kigiriki na unaoeleweka kwa Kiswahili.
- source_word: ἀλαζονεία τοῦ βίου
  choice: majivuno ya maisha
  rationale: ‘Majivuno’ huonyesha kiburi cha kujionyesha au kujidai; ‘maisha’ huhifadhi upana wa βίος, unaoweza kuhusisha hali, mali, au namna ya kuishi.
- source_word: οὐκ ἔστιν ἐκ τοῦ πατρός
  choice: hakitokani na Baba
  rationale: Hueleza chanzo au asili inayomaanishwa na ἐκ na kudumisha utofautishaji wa sentensi.
- source_word: ἀλλὰ ἐκ τοῦ κόσμου ἐστίν
  choice: bali hutokana na ulimwengu
  rationale: Huhifadhi ulinganifu na tofauti kati ya chanzo chake na Baba au ulimwengu.
theological_decisions:
- issue: Maana ya σάρξ katika orodha yenye hukumu ya kimaadili
  choice: mwili
  alternative: asili ya dhambi
  rationale: ‘Mwili’ huhifadhi istilahi na utata wa chanzo; ‘asili ya dhambi’ ingefunga maana kwenye ufafanuzi mmoja wa kiantropolojia.
- issue: Maana ya κόσμος
  choice: ulimwengu
  alternative: mfumo wa ulimwengu ulioanguka
  rationale: Muktadha unaonyesha ulimwengu unaompinga Baba, lakini maandishi yenyewe hayatumii ufafanuzi huo mpana; hivyo neno la kawaida linahifadhi mvutano huo.
- issue: Upeo wa βίος katika ἀλαζονεία τοῦ βίου
  choice: maisha
  alternative: mali au hali ya maisha
  rationale: βίος inaweza kuelekeza namna au njia za maisha, ikiwemo mali na hadhi. ‘Maisha’ huacha upeo huo wazi, huku tanbihi ikieleza uwezekano wake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa vipengele vitatu umehifadhiwa; ‘hakitokani’ hurejelea kwa pamoja ‘kila kilicho ulimwenguni.’
