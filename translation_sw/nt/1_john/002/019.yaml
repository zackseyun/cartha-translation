base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/019.yaml
  text: They went out from us[a], but they were not of us; for if they had been of us, they would have remained with us[b]. But this happened so that it might be made clear that not all are of us.
translation:
  language: sw
  text: Walitoka miongoni mwetu, lakini hawakuwa wa kwetu; maana kama wangekuwa wa kwetu, wangebaki pamoja nasi.[a] Lakini ilikuwa hivyo ili wadhihirishwe[b] kwamba si wote walio wa kwetu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wangeendelea kuwa pamoja nasi.”
    reason: lexical_alternative
  - marker: b
    text: Au “wafunuliwe” au “wawekwe wazi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξ ἡμῶν
  choice: miongoni mwetu / wa kwetu
  rationale: Katika tukio la kuondoka, “miongoni mwetu” huonyesha walikotoka kwa Kiswahili cha kawaida. Katika marudio yanayohusu utambulisho au uhusiano, “wa kwetu” huhifadhi lugha ya kuwa upande wa jumuiya bila kuifafanua kuwa wokovu au ushirika wa kanisa kwa maneno ya ziada.
- source_word: ἐξῆλθαν
  choice: walitoka
  rationale: Huhifadhi picha ya moja kwa moja ya kuondoka iliyomo katika kitenzi cha Kigiriki, bila kutia ndani tafsiri ya kitheolojia kama “waliasi.”
- source_word: οὐκ ἦσαν ἐξ ἡμῶν
  choice: hawakuwa wa kwetu
  rationale: Ni usemi mfupi na wa asili unaoonyesha kutokuwa sehemu yetu kwa maana ya uhusiano au utambulisho, huku ukibaki karibu na muundo wa chanzo.
- source_word: εἰ γὰρ ἐξ ἡμῶν ἦσαν
  choice: maana kama wangekuwa wa kwetu
  rationale: Muundo wa “kama wangekuwa” unaonyesha sharti lisilotimia, na “wa kwetu” hudumisha lugha ileile ya uhusiano.
- source_word: μεμενήκεισαν ἂν μεθ’ ἡμῶν
  choice: wangebaki pamoja nasi
  rationale: “Wangebaki” huwasilisha matokeo ya sharti lisilotimia na kuhifadhi wazo la μένω la kubaki au kudumu.
- source_word: ἀλλ’ ἵνα φανερωθῶσιν
  choice: Lakini ilikuwa hivyo ili wadhihirishwe
  rationale: “Ilikuwa hivyo” hukamilisha kifungu cha Kiswahili ambacho chanzo kimekiacha kwa ufupi. “Wadhihirishwe” huhifadhi hali ya kutendwa na wingi wa kitenzi, bila kuamua zaidi ni nini hasa kilichofanya jambo hilo litokee.
- source_word: ὅτι οὐκ εἰσὶν πάντες ἐξ ἡμῶν
  choice: kwamba si wote walio wa kwetu
  rationale: Huhifadhi upeo wa “si wote” na usemi wa kijumuiya “wa kwetu,” badala ya kuubadili kuwa dai lililofafanuliwa kwa makundi ya baadaye ya kitheolojia.
theological_decisions:
- issue: Ikiwa usemi “wa kwetu” uamue tofauti kati ya ushirika unaoonekana na hali ya kweli ya kiroho
  choice: Kudumisha usemi wa uhusiano “wa kwetu.”
  alternative: “hawakuwa waamini wa kweli” au “hawakuwa wameokoka kweli”
  rationale: Andiko linatofautisha kuondoka kwao na kuwa kwao sehemu ya “sisi,” lakini halitumii moja kwa moja istilahi hizo za baadaye za kimafundisho. “Wa kwetu” huhifadhi mvutano huo bila kuuingiza msimamo wa dhehebu.
- issue: 'Nguvu ya ἵνα: kusudi au matokeo'
  choice: “ili wadhihirishwe,” ambao unaweza kusomwa kama kusudi au matokeo yaliyokusudiwa
  alternative: “na matokeo yake ikawa kwamba walidhihirishwa”
  rationale: Muundo wa chanzo unaweza kubeba wazo la kusudi huku muktadha ukionyesha pia matokeo. “Ili” unabaki karibu na muundo wa Kigiriki bila kuondoa mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Walitoka miongoni mwetu” ni wazi kwa msomaji wa kawaida, huku “wa kwetu” ukihifadhi uradidi wa kimawazo wa ἐξ ἡμῶν. “Wadhihirishwe” ni rasmi kidogo lakini inafaa kwa sajili ya Biblia na inalinda hali ya kutendwa ya Kigiriki.
