source:
  edition: SBLGNT
  text: καὶ αὐτὸς ἱλασμός ἐστιν περὶ τῶν ἁμαρτιῶν ἡμῶν, οὐ περὶ τῶν ἡμετέρων δὲ μόνον ἀλλὰ καὶ περὶ ὅλου τοῦ κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/002.yaml
  text: And he himself is the atoning sacrifice for our sins[a], and not for ours only but also for the whole world.
translation:
  language: sw
  text: Naye mwenyewe ndiye dhabihu ya upatanisho kwa ajili ya dhambi zetu[a], wala si kwa ajili ya zetu tu, bali pia kwa ajili ya dhambi za ulimwengu wote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “dhabihu ya kutuliza ghadhabu”; wengine huielewa kama “dhabihu ya kuondoa dhambi.”
    reason: Mbadala hizi huhifadhi wigo wa maana unaojadiliwa wa ἱλασμός.
lexical_decisions:
- source_word: αὐτὸς
  choice: yeye mwenyewe
  rationale: Matumizi ya kusisitiza ya αὐτός yanaonyeshwa kwa “yeye mwenyewe,” yakikazia jukumu la Yesu binafsi.
- source_word: ἱλασμός
  choice: dhabihu ya upatanisho
  rationale: Kauli hii ya Kiswahili inaeleweka kwa wasomaji wa kawaida na inadokeza tendo la dhabihu linaloshughulikia dhambi bila kulazimisha maana moja tu kati ya kutuliza ghadhabu na kuondoa hatia.
- source_word: περὶ τῶν ἁμαρτιῶν ἡμῶν
  choice: kwa ajili ya dhambi zetu
  rationale: Katika muundo huu περί inaeleza uhusiano wa ἱλασμός na dhambi; “kwa ajili ya” ni ya kawaida na mwaminifu katika Kiswahili.
- source_word: τῶν ἡμετέρων
  choice: zetu
  rationale: Kivumishi hiki kinasimama badala ya “dhambi zetu,” ambazo zimetajwa tayari; “zetu” huhifadhi ufupisho huo kwa Kiswahili cha kawaida.
- source_word: ὅλου τοῦ κόσμου
  choice: ulimwengu wote
  rationale: Huhifadhi upeo mpana wa ὅλου τοῦ κόσμου bila kuubana kwa mfumo fulani wa kitheolojia.
- source_word: οὐ ... μόνον ἀλλὰ καὶ
  choice: wala si ... tu, bali pia
  rationale: Muundo huu wa Kiswahili huhifadhi ulinganisho wa kukanusha na kuongeza uliopo katika Kigiriki.
theological_decisions:
- issue: Upeo wa “ulimwengu wote”
  choice: Kuhifadhi usemi mpana “ulimwengu wote” bila kuufafanua kwa kuubana.
  alternative: “watu kutoka ulimwenguni kote” au “wateule kote ulimwenguni”
  rationale: Kigiriki hakisemi mipaka hiyo; tafsiri inapaswa kuhifadhi upana na mvutano wa kitheolojia wa maandishi.
- issue: Maana ya ἱλασμός
  choice: Kutumia “dhabihu ya upatanisho” katika maandishi makuu.
  alternative: “dhabihu ya kutuliza ghadhabu” au “dhabihu ya kuondoa hatia ya dhambi”
  rationale: Neno hili lina wigo unaojadiliwa. “Dhabihu ya upatanisho” ni ya kueleweka na huhifadhi kiini cha maana bila kuamua kimya kimya kati ya mitazamo ya kutuliza ghadhabu na kuondoa hatia.
- issue: Kijazilizo cha “kwa ajili ya ulimwengu wote”
  choice: Kurudia “dhambi za” ili maana iwe wazi katika Kiswahili.
  alternative: “bali pia kwa ajili ya ulimwengu wote”
  rationale: Kigiriki kinaacha “dhambi” zikieleweka kutoka kishazi kilichotangulia. Kuzitaja tena katika Kiswahili kunaweka wazi uhusiano huo bila kubadili maana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. “Naye mwenyewe” hudumisha muunganiko na mstari uliotangulia pamoja na msisitizo wa Kigiriki. “Dhabihu ya upatanisho” huepuka istilahi nzito isiyoeleweka kwa urahisi huku ikihifadhi lugha ya dhabihu.
