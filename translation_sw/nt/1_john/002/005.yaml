  text: ὃς δ’ ἂν τηρῇ αὐτοῦ τὸν λόγον, ἀληθῶς ἐν τούτῳ ἡ ἀγάπη τοῦ θεοῦ τετελείωται. ἐν τούτῳ γινώσκομεν ὅτι ἐν αὐτῷ ἐσμεν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/005.yaml
  text: 'But whoever keeps his word[a], truly in him the love of God has been perfected[b]. By this we know that we are in him:'
translation:
  language: sw
  text: 'Lakini yeyote anayelishika neno lake, kwa kweli upendo wa Mungu umekamilishwa katika mtu huyo[a]. Kwa hili tunajua kwamba tuko ndani yake:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi zaidi, “katika huyu” au “katika hili.” Kirai cha Kigiriki kinaweza kumrejelea mtu anayelishika neno lake, au jambo hili kama ushahidi.
    reason: alternative_reading
lexical_decisions:
- source_word: ὃς δ’ ἂν
  choice: Lakini yeyote
  rationale: 'δέ inaendelezwa kama utofautishaji mpole, na kiwakilishi pamoja na ἄν kinaonyesha hali ya jumla: mtu yeyote anayefanya hivyo.'
- source_word: τηρῇ
  choice: anayelishika
  rationale: Kitenzi τηρέω kinaweza kumaanisha kushika, kutunza au kutii. ‘Kulishika’ huhifadhi msamiati mpana wa Yohana bila kuufanya useme utii wa nje tu.
- source_word: αὐτοῦ τὸν λόγον
  choice: neno lake
  rationale: λόγος ni umoja na hapa inarejelea kwa upana neno au ujumbe alioutoa. ‘Neno lake’ ni kifungu cha kawaida, chenye hadhi, na huhifadhi mwangwi wa lugha ya Yohana.
- source_word: ἀληθῶς
  choice: kwa kweli
  rationale: Huhifadhi nguvu ya kielezi kinachosisitiza ukweli wa kauli.
- source_word: ἐν τούτῳ
  choice: ndani ya mtu huyo
  rationale: Katika muktadha wa karibu, τούτῳ inaweza kumrejelea mtu anayelishika neno. Tafsiri hii ni wazi na ya kawaida kwa Kiswahili, huku maana halisi na uwezekano mwingine vikibainishwa katika tanbihi.
- source_word: ἡ ἀγάπη τοῦ θεοῦ
  choice: upendo wa Mungu
  rationale: 'Muundo huu huhifadhi utata wa kirai cha Kigiriki: unaweza kueleweka kuwa upendo utokao kwa Mungu au upendo unaoelekezwa kwa Mungu.'
- source_word: τετελείωται
  choice: umefikia ukamilifu
  rationale: Kauli timilifu ya kutendwa inaonyesha hali ya sasa iliyotokana na tendo lililokamilika. ‘Umefikia ukamilifu’ hutoa kwa Kiswahili cha kawaida wazo la upendo kufikishwa kwenye utimilifu au kusudi lake.
- source_word: ἐν τούτῳ γινώσκομεν
  choice: Kwa hili tunajua
  rationale: Huu ni usemi wa Yohana unaotaja msingi au ushahidi wa kujua; ‘Kwa hili tunajua’ ni wa kawaida na huhifadhi nguvu ya kiashiria.
- source_word: ὅτι ἐν αὐτῷ ἐσμεν
  choice: kwamba tuko ndani yake
  rationale: ‘Ndani yake’ huhifadhi usemi muhimu wa Yohana kuhusu uhusiano na muungano bila kuupanua kwa tafsiri ya kimafundisho.
theological_decisions:
- issue: Maana ya umilikishi katika ἡ ἀγάπη τοῦ θεοῦ
  choice: upendo wa Mungu
  alternative: upendo wa Mungu kwa mwamini; au upendo wa mwamini kwa Mungu
  rationale: Kirai cha Kigiriki kina utata halisi na muktadha wa Yohana unaweza kuruhusu pande zote mbili. Tafsiri kuu haichagui upande mmoja kimafundisho.
- issue: Kirejelewa cha ἐν τούτῳ katika kishazi cha kwanza
  choice: ndani ya mtu huyo
  alternative: katika hili; katika huyu
  rationale: Kiswahili cha neno kwa neno ‘katika hili’ kingekuwa kigumu na huenda kingepotosha. Muktadha wa karibu unaunga mkono mrejeo wa mtu, lakini tanbihi inahifadhi uwezekano wa kurejelea jambo hilo kama ushahidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imehifadhi istilahi kuu za Yohana—‘neno,’ ‘upendo,’ na ‘ndani yake’—bila kuongeza ufafanuzi wa kimadhehebu. Alama ya koloni mwishoni imehifadhiwa kwa kuwa sentensi inaendelea katika mstari unaofuata.
