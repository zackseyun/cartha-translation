translation:
  language: sw
  text: Nawaandikia[a], watoto wadogo, kwa sababu[b] dhambi zenu zimesamehewa kwa ajili ya jina lake[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Ninawaandikia.” Wakati uliopo wa Kigiriki unaweza kutafsiriwa kwa namna ya kawaida “nawaandikia” au, katika muktadha wa barua, “ninawaandikia.”
    reason: lexical_alternative
  - marker: b
