    reason: alternative_reading
lexical_decisions:
- source_word: Γράφω ὑμῖν
  choice: Ninawaandikia ninyi
  rationale: Kitenzi cha wakati uliopo pamoja na ὑμῖν kinaonyesha tendo la kuwaandikia walengwa. Kiswahili hiki ni cha kawaida na kinaweza kuwasilisha tendo linaloendelea wakati barua inaandikwa bila kubadili maana.
- source_word: τεκνία
  choice: watoto wadogo
  rationale: Wito huu wa udogo unaonyesha uhusiano wa kifamilia na upendo, si lazima umri mdogo pekee. “Watoto wadogo” huhifadhi taswira ya Kigiriki bila kuongeza kimilikishi kisichotajwa.
- source_word: ὅτι
  choice: kwa sababu
  rationale: Katika mtiririko huu, ὅτι inaeleweka vizuri zaidi kuwa inatoa sababu ya Yohana kuwaandikia, ingawa inaweza pia kutambulisha maudhui ya anachoandika.
- source_word: ἀφέωνται
  choice: zimesamehewa
  rationale: Hali timilifu ya kutendwa inaonyesha tendo lililokamilika lenye matokeo yanayoendelea. “Zimesamehewa” huhifadhi sauti ya kutendwa na hali hiyo ya kudumu.
- source_word: αἱ ἁμαρτίαι ... ὑμῖν
  choice: dhambi zenu
  rationale: Ingawa Kigiriki kina kibainishi, ὑμῖν pamoja na lugha ya kusamehe huonyesha kuwa dhambi zinazohusika ni za waandikiwa; umilikishi huu ni wa kawaida na wazi katika Kiswahili.
- source_word: διὰ τὸ ὄνομα αὐτοῦ
  choice: kwa ajili ya jina lake
  rationale: διά pamoja na hali ya kushutumiwa huonyesha sababu au msingi. “Kwa ajili ya jina lake” huhifadhi uzito wa kibiblia wa “jina” badala ya kulipunguza kuwa sifa au umaarufu tu.
- source_word: ὄνομα
  choice: jina
  rationale: Neno hili lina maana ya kibinafsi na ya kiagano inayozidi wazo la sifa pekee; “jina” huhifadhi mwangwi huo wa kibiblia.
theological_decisions:
- issue: Anayerejelewa na αὐτοῦ katika “jina lake”
  choice: Kiwakilishi “lake” kimeachwa bila kumtaja mhusika moja kwa moja katika matini kuu.
  alternative: Mungu au Yesu Kristo
  rationale: Mstari huu wenyewe haumtambui wazi anayerejelewa, na muktadha mpana unaweza kufasiriwa kwa njia tofauti. Kutaja jina moja katika matini kuu kungeondoa utata ambao Kigiriki kimeuacha.
- issue: Kazi ya ὅτι
  choice: Imetafsiriwa “kwa sababu,” ikitoa sababu ya kuandika.
  alternative: “kwamba,” ikitambulisha maudhui ya ujumbe
  rationale: Mtiririko wa aya zinazofuata unaunga mkono maana ya sababu, lakini usomaji wa maudhui unawezekana kisarufi na umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wenye heshima na unaosomeka kwa urahisi. “Watoto wadogo” limehifadhiwa kama neno la upendo la kifamilia bila kuongeza “wangu” au “wapendwa,” ambayo hayapo wazi katika Kigiriki. Viwakilishi “ninyi” na “zenu” vinaweka wazi uelekezaji kwa wingi na msisitizo wa waandikiwa.
