lexical_decisions:
- source_word: ἐν τούτῳ
  choice: kwa hili
  rationale: Ni usemi wa Kiyohana unaoonyesha msingi au ushahidi ambao kwa huo jambo linajulikana; “kwa hili” ni Kiswahili cha kawaida na huhifadhi nguvu ya kiashiria.
- source_word: γινώσκομεν
  choice: tunajua
  rationale: Kitenzi cha wakati uliopo kinaonyesha utambuzi au uhakika wa sasa; “tunajua” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: ὅτι ἐγνώκαμεν αὐτόν
  choice: kwamba tumepata kumjua
  rationale: Kauli timilifu ya Kigiriki inaweza kuonyesha kuanza kumjua ambako matokeo yake yanaendelea; “tumepata kumjua” huwasilisha maana hiyo kwa Kiswahili cha asili.
- source_word: αὐτόν
  choice: -mjua
  rationale: Kiambishi cha yambwa “-m-” huhifadhi kiwakilishi cha Kigiriki bila kukitaja wazi kuwa ni Mungu au Kristo, hivyo kutodhibiti utata wa muktadha.
- source_word: ἐὰν
  choice: ikiwa
  rationale: Huanzisha sharti linalotoa kipimo au ushahidi; “ikiwa” ni ya moja kwa moja na yenye hadhi inayofaa.
- source_word: ἐντολάς
  choice: amri
  rationale: “Amri” huhifadhi uzito wa kimaadili na wa agano wa neno hili katika maandishi ya Yohana.
- source_word: τηρῶμεν
  choice: tunazishika
  rationale: “Kushika” hujumuisha kutunza na kutii, na huhifadhi mtindo wa Kiyohana kuliko kuufupisha kuwa utii tu.
theological_decisions:
- issue: Mrejelewa wa αὐτόν (“yeye”)
  choice: Kuhifadhi kiwakilishi katika kiambishi cha yambwa “-m-” bila kutaja jina.
  alternative: Kutaja “Mungu” au “Yesu/Kristo.”
  rationale: Kigiriki kinatumia kiwakilishi, na muktadha wa 1 Yohana unaweka kwa ukaribu kumjua Mungu na uhusiano na Mwana. Kutotaja jina huepuka kuamua zaidi ya mstari wenyewe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umehifadhi uhusiano wa ushahidi kati ya kumjua na kuzishika amri, bila kubainisha kimadhehebu mrejelewa wa kiwakilishi.
