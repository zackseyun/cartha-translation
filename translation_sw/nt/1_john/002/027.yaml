id: 1JN.2.27
reference: 1 John 2:27
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ὑμεῖς τὸ χρῖσμα ὃ ἐλάβετε ἀπ’ αὐτοῦ ⸂μένει ἐν ὑμῖν⸃, καὶ οὐ χρείαν ἔχετε ἵνα τις διδάσκῃ ὑμᾶς· ἀλλ’ ὡς τὸ ⸀αὐτοῦ χρῖσμα διδάσκει ὑμᾶς περὶ πάντων, καὶ ἀληθές ἐστιν καὶ οὐκ ἔστιν ψεῦδος, καὶ καθὼς ἐδίδαξεν ὑμᾶς, ⸀μένετε ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/027.yaml
  text: And as for you[a], the anointing that you received from him remains in you, and you have no need that anyone should teach you. But as his anointing teaches you about all things, and is true and is not a lie, and just as it taught you[b], remain in him.
translation:
  language: sw
  text: Na ninyi, upako mlioupokea kutoka kwake unakaa ndani yenu, wala hamna haja ya mtu yeyote kuwafundisha. Bali, kama upako wake unavyowafundisha kuhusu mambo yote, na ni wa kweli wala si uongo, basi kama ulivyowafundisha, kaeni ndani yake.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, katika baadhi ya hati: “na kama ulivyowafundisha, mnakaa ndani yake.”'
    reason: textual_variant
  - marker: b
    text: Kitenzi kilekile cha Kigiriki kimetafsiriwa “unakaa ndani yenu” na “kaeni ndani yake” katika mstari huu.
    reason: lexical_alternative
lexical_decisions:
- source_word: χρῖσμα
  choice: upako
  rationale: Neno hili linahifadhi sitiari ya Kigiriki bila kulifafanua moja kwa moja kuwa Roho Mtakatifu au ujumbe.
- source_word: ἀπ’ αὐτοῦ
  choice: kutoka kwake
  rationale: Kiwakilishi kinahifadhiwa ili mtajo wake utambuliwe kutokana na muktadha uliotangulia.
- source_word: μένει ἐν ὑμῖν / μένετε ἐν αὐτῷ
  choice: unakaa ndani yenu / kaeni ndani yake
  rationale: ‘Kukaa ndani ya’ ni Kiswahili cha kawaida kinachohifadhi urudiaji wa kitenzi μένω na lugha ya kipekee ya Yohana.
- source_word: οὐ χρείαν ἔχετε ἵνα τις διδάσκῃ ὑμᾶς
  choice: wala hamhitaji mtu yeyote awafundishe
  rationale: Hufuata dai la Kigiriki kwa uwazi bila kulilegeza wala kulipanua kuwa fundisho linalokanusha kila aina ya walimu wa kibinadamu.
- source_word: διδάσκῃ / διδάσκει / ἐδίδαξεν
  choice: awafundishe / unavyowafundisha / ulivyowafundisha
  rationale: Mzizi mmoja wa Kiswahili umetumiwa ili kuhifadhi urudiaji na msisitizo wa matini.
- source_word: περὶ πάντων
  choice: kuhusu mambo yote
  rationale: Huhifadhi upana wa usemi wa Kigiriki bila kuuwekea kikomo cha kifasiri.
- source_word: ἀληθές ἐστιν καὶ οὐκ ἔστιν ψεῦδος
  choice: ni wa kweli wala si uongo
  rationale: Huhifadhi ulinganifu mkali wa Yohana kati ya ukweli na uongo kwa Kiswahili kinachoeleweka.
- source_word: καθὼς ἐδίδαξεν ὑμᾶς
  choice: kama ulivyowafundisha
  rationale: Kiunganishi cha ulinganisho kinahifadhi uhusiano kati ya fundisho la upako na wito unaofuata.
theological_decisions:
- issue: Mtajo wa ‘upako’ (χρῖσμα)
  choice: ‘Upako’ umetumiwa bila kuutambulisha wazi zaidi katika matini kuu.
  alternative: Roho Mtakatifu; ujumbe/injili iliyopokelewa
  rationale: Ingawa katika muktadha huenda neno hili linarejelea uwepo na kazi ya Roho, matini yenyewe hutumia sitiari ya upako; kuitunza huepuka kuingiza ufafanuzi wa kimadhehebu.
- issue: Nguvu ya kauli ‘hamhitaji mtu yeyote awafundishe’
  choice: Kauli imehifadhiwa kama ilivyo bila kulegezwa wala kufanywa dai kamili dhidi ya mafundisho yote ya kibinadamu.
  alternative: Kukanusha walimu wote wa kibinadamu; kukanusha tu hitaji la waasi hao kuwa walimu
  rationale: Tafsiri inalinda mvutano wa matini na kuacha muktadha uongoze ufafanuzi.
- issue: Hali ya kitenzi cha mwisho μένετε
  choice: 'Amri: ‘kaeni ndani yake.’'
  alternative: 'Taarifa: ‘mnakaa ndani yake.’'
  rationale: Matini iliyochapishwa ya SBLGNT inaeleweka kiasili kama amri katika muktadha huu; usomaji wa taarifa katika baadhi ya mashahidi umewekwa katika tanbihi.
- issue: Mtajo wa kiwakilishi katika ἐν αὐτῷ
  choice: ‘ndani yake’ bila kufafanua mtajo katika matini kuu.
  alternative: ndani ya Kristo; ndani ya Mungu; ndani ya upako
  rationale: Kigiriki kina kiwakilishi cha kiume, na tafsiri huhifadhi ukungu wa mtajo badala ya kuutatua kimya kimya.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Upako’ huhifadhi sitiari ya awali; ‘kukaa ndani ya’ huhifadhi msamiati unaorudiwa wa Yohana. Alama zote za tanbihi zimewekwa katika matini kuu.
