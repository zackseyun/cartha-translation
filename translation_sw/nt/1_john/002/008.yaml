  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: πάλιν ἐντολὴν καινὴν γράφω ὑμῖν, ὅ ἐστιν ἀληθὲς ἐν αὐτῷ καὶ ἐν ὑμῖν, ὅτι ἡ σκοτία παράγεται καὶ τὸ φῶς τὸ ἀληθινὸν ἤδη φαίνει.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/008.yaml
  text: Again[a], I am writing to you a new commandment, which is true in him and in you, because the darkness is passing away and the true light is already shining.
translation:
  language: sw
  text: Tena, ninawaandikia amri mpya, jambo ambalo ni la kweli katika yeye[a] na ndani yenu, kwa sababu giza linatoweka, na nuru ya kweli tayari inaangaza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, inaelekea Kristo; au, “katika amri hiyo,” ikiwa kiwakilishi kinarejelea amri.
    reason: alternative_reading
lexical_decisions:
- source_word: πάλιν
  choice: Tena
  rationale: Neno hili linaendeleza na wakati huohuo kutofautisha kauli hii na mstari uliotangulia bila kufafanua kupita kiasi.
- source_word: ἐντολὴν καινὴν
  choice: amri mpya
  rationale: Hii ni tafsiri ya kawaida na ya asili; ‘mpya’ hapa inaweza kuonyesha upya wa namna au sifa, si wakati tu.
- source_word: γράφω ὑμῖν
  choice: ninawaandikia
  rationale: Muundo huu wa sasa ni wa kawaida katika barua na unaeleza tendo la mwandishi kwa wasomaji wake.
- source_word: ὅ ἐστιν ἀληθὲς
  choice: ambayo ni kweli
  rationale: Kiwakilishi cha Kigiriki cha jinsia ya kati kinaweza kurejelea amri au wazo zima lililotangulia; Kiswahili cha kawaida hutumia ‘ambayo’ kwa kurejelea amri.
- source_word: ἐν αὐτῷ καὶ ἐν ὑμῖν
  choice: ndani yake na ndani yenu
  rationale: ‘Ndani yake’ hudumisha taswira ya ἐν na pia huacha wazi kwa kiasi fulani iwapo kiwakilishi kinamrejelea Kristo au amri, huku muktadha ukielekea zaidi kwa Kristo.
- source_word: ἡ σκοτία παράγεται
  choice: giza linapita
  rationale: Kitenzi kinaonyesha mchakato unaoendelea wa giza kupita au kutoweka; ‘linapita’ ni kifupi na huhifadhi picha ya asili.
- source_word: τὸ φῶς τὸ ἀληθινὸν ἤδη φαίνει
  choice: nuru ya kweli tayari inaangaza
  rationale: Tafsiri hii huhifadhi istilahi muhimu ya Kiyohana ‘nuru ya kweli’ na maana ya tendo ambalo tayari linaendelea sasa.
theological_decisions:
- issue: Kirejelewa cha αὐτῷ
  choice: Matini kuu inasema ‘ndani yake,’ huku muktadha ukielekea kumrejelea Kristo.
  alternative: 'Kiwakilishi kinaweza kueleweka kuwa kinarejelea amri: ‘katika amri hiyo.’'
  rationale: Kiwakilishi cha Kigiriki ni cha kiume na kwa kawaida kinaelekea kwa mtu, yaani Kristo katika muktadha wa karibu; hata hivyo, muundo wa kishazi unaruhusu mjadala wa kurejelea amri au jambo lililotajwa, kwa hiyo uwezekano huo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imewekwa wazi na rahisi kusomeka huku ikihifadhi lugha ya Kiyohana kuhusu giza, nuru na ukweli.
