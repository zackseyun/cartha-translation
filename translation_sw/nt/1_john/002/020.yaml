id: 1JN.2.20
reference: 1 John 2:20
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ὑμεῖς χρῖσμα ἔχετε ἀπὸ τοῦ ἁγίου ⸀καὶ οἴδατε ⸀πάντες·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/020.yaml
  text: But you have an anointing from the Holy One[a], and you all know.
translation:
  language: sw
  text: Lakini ninyi mna upako kutoka kwa Aliye Mtakatifu,[a] nanyi nyote mnajua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa mujibu wa usomaji mwingine wa matini, “nanyi mnajua mambo yote.” Usomaji wa SBLGNT unaunga mkono “nanyi nyote mnajua.”
    reason: textual_variant
lexical_decisions:
- source_word: καὶ
  choice: Lakini
  rationale: Ingawa kwa kawaida καί humaanisha “na,” hapa inaonyesha utofauti kati ya wasomaji na wapinga Kristo waliotajwa katika mstari uliotangulia.
- source_word: ὑμεῖς
  choice: ninyi
  rationale: Kiwakilishi hiki kimetajwa wazi kwa ajili ya msisitizo; “ninyi” kinadumisha msisitizo huo katika Kiswahili.
- source_word: χρῖσμα
  choice: upako
  rationale: “Upako” huhifadhi sitiari ya Kigiriki bila kuifafanua moja kwa moja kuwa Roho Mtakatifu au kazi yake.
- source_word: ἔχετε
  choice: mna
  rationale: Hii ni tafsiri ya kawaida na ya asili ya kitenzi cha wakati uliopo kinachoonyesha kuwa nao upako huo.
- source_word: ἀπὸ τοῦ ἁγίου
  choice: kutoka kwa Aliye Mtakatifu
  rationale: Huhifadhi cheo cha Kigiriki bila kuamua kama anayerejelewa ni Baba au Mwana.
- source_word: καὶ
  choice: nanyi
  rationale: Kiunganishi hiki kinaunganisha kuwa kwao na upako na kujua kwao; muundo “nanyi” ni wa asili katika Kiswahili.
- source_word: οἴδατε
  choice: mnajua
  rationale: “Mnajua” ni tafsiri ya moja kwa moja na ya kawaida ya kitenzi kinachoeleza maarifa au ufahamu.
- source_word: πάντες
  choice: nyote
  rationale: 'Kwa matini ya SBLGNT, πάντες ni nomino ya wingi inayowarejelea wasomaji wote: “ninyi nyote,” si “mambo yote.”'
theological_decisions:
- issue: Anayerejelewa na “Aliye Mtakatifu”
  choice: Cheo “Aliye Mtakatifu” kimehifadhiwa bila kumtaja hasa Baba au Mwana.
  alternative: “Mungu Mtakatifu,” “Baba,” au “Yesu Kristo”
  rationale: Matini haitambui wazi anayerejelewa, na kumtaja moja kwa moja kungeondoa utata halisi wa kifungu.
- issue: Maana ya χρῖσμα
  choice: Imetafsiriwa “upako” na sitiari imehifadhiwa.
  alternative: “Roho Mtakatifu,” “upako wa Roho,” au “kipawa cha upako”
  rationale: Ingawa huenda upako huu ukarejelea Roho Mtakatifu au utendaji wake, Kigiriki kinatumia χρῖσμα; tafsiri haipaswi kufafanua zaidi ya matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo “mna upako” umechaguliwa kwa urahisi wa kueleweka huku sitiari ya chanzo ikihifadhiwa.
