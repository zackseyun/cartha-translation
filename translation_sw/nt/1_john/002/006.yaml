base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/006.yaml
  text: The one who says he remains in him ought also to walk just as that one walked[a][b][c].
translation:
  language: sw
  text: Yule anayesema kwamba anakaa ndani yake[a] anapaswa pia kuenenda kama yule alivyoenenda[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “anadumu ndani yake.” Kitenzi cha Kiyunani μένω ni neno muhimu katika maandishi ya Yohana, likimaanisha kuendelea, kubaki, au kudumu katika uhusiano.
    reason: lexical_alternative
  - marker: b
    text: “Yule” hapa anamrejelea Yesu na huhifadhi mkazo wa kiwakilishi-kionyeshi cha Kiyunani; tafsiri nyingine hutumia tu “yeye.”
    reason: alternative_reading
  - marker: c
    text: “Kuenenda” ni sitiari ya kibiblia kuhusu namna ya maisha; yaani, mtu anapaswa kuishi kama Yesu alivyoishi.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ λέγων
  choice: Yule anayesema
  rationale: Kirai hiki chenye participle na kibainishi kinamtaja mtu mmoja wa mfano kwa maana ya jumla. “Yule anayesema” kinahifadhi umoja na muundo wa Kiyunani kwa Kiswahili cha kawaida.
- source_word: ἐν αὐτῷ μένειν
  choice: kwamba anakaa ndani yake
  rationale: Kitenzi μένω ni neno muhimu katika maandishi ya Yohana, likimaanisha kuendelea, kubaki, au kudumu katika uhusiano. “Anakaa ndani yake” kinahifadhi taswira ya ndani na hali ya kuendelea; “kwamba” kinaonyesha kuwa hiki ndicho anachodai msemaji.
- source_word: ὀφείλει
  choice: anapaswa
  rationale: Neno hili linaonyesha wajibu wa kimaadili. “Anapaswa” ni la asili na lenye uzito ufaao bila kulifanya kuwa amri kali kuliko chanzo.
- source_word: καθὼς
  choice: kama
  rationale: '“Kama” linaonyesha ulinganifu wa namna: mwenendo wa mtu unapaswa kulingana na wa yule anayetajwa.'
- source_word: ἐκεῖνος
  choice: yule
  rationale: “Yule” kinahifadhi nguvu ya kiwakilishi-kionyeshi cha ἐκεῖνος badala ya kukifanya kiwakilishi cha kawaida tu. Muktadha unaonyesha kuwa kinamtaja Yesu.
- source_word: περιεπάτησεν ... περιπατεῖν
  choice: alivyoenenda ... kuenenda
  rationale: “Kuenenda” kinahifadhi sitiari ya kibiblia ya kutembea kama namna ya maisha, huku kikieleweka katika Kiswahili sanifu kuwa mwenendo wa mtu.
- source_word: καὶ αὐτὸς
  choice: yeye pia
  rationale: “Yeye pia” kinawasilisha nyongeza pamoja na mkazo wa αὐτός kwa mhusika anayetoa dai hilo.
theological_decisions:
- issue: Mrejelewa wa αὐτῷ na ἐκεῖνος
  choice: Viwakilishi vimetafsiriwa “yake” na “yule,” huku muktadha ukimtambulisha Yesu kuwa mrejelewa.
  alternative: Kutaja “Yesu” moja kwa moja au kutumia herufi kubwa kwa kiwakilishi cha Mungu.
  rationale: Muktadha unaelekeza kwa Yesu, lakini Kiyunani hakitaji jina lake katika mstari huu wala hakitumii mfumo wa herufi kubwa kuashiria uungu. Tafsiri inahifadhi namna ya rejeo ya chanzo, na tanbihi inafafanua mrejelewa.
- issue: Wajibu wa kumwiga Yesu
  choice: “Anapaswa” linaonyesha wajibu wa kimaadili wa kuenenda kwa kufuata mfano wa Yesu.
  alternative: Kutumia “lazima,” ambalo lingeweza kusikika kama sharti kali zaidi.
  rationale: ὀφείλει lina uzito wa wajibu halisi, lakini “anapaswa” linaacha kauli katika kiwango chake cha kimaadili bila kuongeza ufafanuzi wa kimadhehebu.
- issue: Sitiari ya περιπατέω
  choice: Sitiari imehifadhiwa kwa “kuenenda.”
  alternative: Kutafsiri maana moja kwa moja kuwa “kuishi.”
  rationale: Kuhifadhi sitiari kunadumisha uhusiano wake na lugha pana ya kimaadili ya Biblia; tanbihi inaeleza maana yake kwa msomaji wa sasa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa heshima unaoeleweka kwa wasomaji wa kawaida. “Kuenenda” kina ladha ya kibiblia lakini bado ni neno sanifu; kimechaguliwa ili kuhifadhi sitiari ya chanzo, huku tanbihi ikitoa maana yake wazi. Hakuna matumizi ya herufi kubwa za kiwakilishi yaliyoongezwa kwa sababu hayapo katika maandishi ya Kiyunani.
