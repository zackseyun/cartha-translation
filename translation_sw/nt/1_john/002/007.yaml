  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ⸀Ἀγαπητοί, οὐκ ἐντολὴν καινὴν γράφω ὑμῖν, ἀλλ’ ἐντολὴν παλαιὰν ἣν εἴχετε ἀπ’ ἀρχῆς· ἡ ἐντολὴ ἡ παλαιά ἐστιν ὁ λόγος ὃν ⸀ἠκούσατε.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/007.yaml
  text: Beloved[a], I am not writing a new commandment to you, but an old commandment that you have had from the beginning. The old commandment is the message that you heard.
translation:
  language: sw
  text: Wapendwa, siwaandikii amri mpya, bali amri ya zamani ambayo mmekuwa nayo tangu mwanzo. Amri hiyo ya zamani ni ujumbe[a] mliousikia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “neno”: “Amri hiyo ya zamani ni neno mlilolisikia.”'
    reason: Mbadala wa kimsamiati kwa λόγος; “neno” hufuata umbo la Kigiriki kwa karibu zaidi, huku “ujumbe” ukieleza maana yake katika muktadha.
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: Wapendwa
  rationale: Ni kivumishi cha wingi katika hali ya mwito kinachotumiwa kama salamu yenye upendo. “Wapendwa” huhifadhi uhusiano wake na lugha ya kupenda na sauti ya kichungaji ya Yohana.
- source_word: ἐντολήν
  choice: amri
  rationale: “Amri” ni neno la kawaida na lenye uzito katika Kiswahili kwa agizo lenye mamlaka; linafaa pia katika matumizi ya kiteolojia ya Yohana.
- source_word: καινήν
  choice: mpya
  rationale: Hutoa kwa uwazi tofauti ya moja kwa moja na παλαιάν, “ya zamani,” bila kuongeza maana ya “iliyofanywa upya.”
- source_word: γράφω ὑμῖν
  choice: siwaandikii
  rationale: Muundo huu wa wakati wa sasa unaonyesha tendo la kuandika linaloendelea na humtaja kwa kawaida mpokeaji katika Kiswahili.
- source_word: παλαιάν / παλαιά
  choice: ya zamani
  rationale: Huhifadhi tofauti ya moja kwa moja na “mpya” na kueleza kwamba amri hiyo imekuwapo kwa wasomaji tangu mwanzo.
- source_word: εἴχετε
  choice: mmekuwa nayo
  rationale: Wakati usiotimilifu wa Kigiriki unaonyesha kuwa walikuwa nayo kwa kipindi kinachoanzia zamani; “mmekuwa nayo” huwasilisha umiliki huo unaoendelea hadi sasa.
- source_word: ἀπ’ ἀρχῆς
  choice: tangu mwanzo
  rationale: Huhifadhi usemi wa Kiyohana bila kufafanua ni mwanzo gani hasa unaokusudiwa.
- source_word: λόγος
  choice: ujumbe
  rationale: Katika muktadha huu neno hilo linaelekea kumaanisha yaliyotangazwa na kusikiwa. “Ujumbe” huwasilisha maana hiyo kwa uwazi; “neno” limehifadhiwa katika tanbihi kama tafsiri halali ya karibu zaidi na umbo la Kigiriki.
- source_word: ἠκούσατε
  choice: mliousikia
  rationale: Wakati timilifu sahili wa Kigiriki unaelekeza kwenye tendo la awali la kupokea yale yaliyotangazwa; “mliousikia” ni tafsiri ya kawaida na ya moja kwa moja.
theological_decisions:
- issue: Kirejeo cha “tangu mwanzo”
  choice: Usemi umeachwa kuwa “tangu mwanzo” bila kubainisha mwanzo unaokusudiwa.
  alternative: Tangu mwanzo wa maisha yenu ya Kikristo; au tangu mwanzo wa kutangazwa kwa injili.
  rationale: Muktadha unaelekea kwenye mwanzo wa mafundisho ambayo wasomaji waliyasikia, lakini maandishi yenyewe hayafafanui kwa ukamilifu. Tafsiri inahifadhi upana huo.
- issue: Utambulisho wa “amri ya zamani” na λόγος uliosikiwa
  choice: Amri ya zamani imelinganishwa moja kwa moja na “ujumbe” walioutikia.
  alternative: Kupanua kuwa amri hiyo ni ujumbe au neno walilosikia tangu mwanzo.
  rationale: Kigiriki kinalinganisha amri na λόγος bila maelezo ya ziada. Tafsiri haiongezi ufafanuzi kutoka mistari mingine wala kuondoa mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni ya moja kwa moja na ina sauti ya upendo ya mwandishi. “Siwaandikii” na “mmekuwa nayo” ni miundo ya kawaida inayoeleweka kwa wasomaji wa leo.
