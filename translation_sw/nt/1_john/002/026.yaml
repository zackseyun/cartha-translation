translation:
  language: sw
  text: Nimewaandikia mambo haya kuhusu wale wanaowapotosha[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wale wanaowadanganya.” Kitenzi cha Kigiriki kinaweza kumaanisha kudanganya au kupotosha, yaani kumwongoza mtu aache kweli au njia inayofaa.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα
  choice: mambo haya
  rationale: Kiwakilishi cha kuonyesha cha wingi wa kati kinarejelea yaliyotangulia katika maandishi; “mambo haya” ni Kiswahili cha kawaida na wazi.
- source_word: ἔγραψα
  choice: nimewaandikia
  rationale: Wakati uliopita wa Kigiriki unaonyesha tendo lililokamilika lenye umuhimu kwa wasomaji wa sasa; timilifu ya Kiswahili inaleta maana hiyo kwa ufasaha.
- source_word: ὑμῖν
  choice: wa- katika nimewaandikia
  rationale: Kiambishi cha yambwa “wa-” kinawatambulisha wasomaji kama wapokeaji wa maandishi.
- source_word: περὶ
  choice: kuhusu
  rationale: “Kuhusu” hutambulisha mada ya maandishi kwa lugha ya sasa, yenye heshima na iliyo wazi.
- source_word: τῶν πλανώντων ὑμᾶς
  choice: wale wanaojaribu kuwapotosha
  rationale: “Kupotosha” huonyesha kusababisha mtu aondoke katika kweli au njia inayofaa. “Wanaojaribu” huhifadhi uwezekano kwamba tendo limeelekezwa kwa wasomaji bila kudai kwamba tayari limefanikiwa.
- source_word: πλανάω
  choice: kupotosha
  rationale: Kitenzi hiki kinaweza kumaanisha kudanganya au kuongoza mtu apotee; “kupotosha” ni cha kawaida katika Kiswahili na huhifadhi maana ya kumwondoa mtu katika kweli.
theological_decisions:
- issue: Ikiwa πλανώντων inadokeza upotoshaji uliofanikiwa au jaribio la kupotosha
  choice: wale wanaojaribu kuwapotosha
  alternative: wale wanaowapotosha; wale wanaowadanganya
  rationale: Kirai cha Kigiriki kinawatambulisha wapinzani kwa shughuli yao dhidi ya wasomaji, lakini hakilazimishi hitimisho kwamba tayari wamefanikiwa. Tafsiri hii huhifadhi mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi na chenye hadhi. Muundo ni mfupi kama chanzo; kiambishi cha yambwa katika “nimewaandikia” na “kuwapotosha” kinaonyesha wazi kuwa anaongea na kundi la wasomaji.
