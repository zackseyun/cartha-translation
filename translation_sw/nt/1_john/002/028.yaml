  text: Καὶ νῦν, τεκνία, μένετε ἐν αὐτῷ, ἵνα ⸀ἐὰν φανερωθῇ ⸀σχῶμεν παρρησίαν καὶ μὴ αἰσχυνθῶμεν ἀπ’ αὐτοῦ ἐν τῇ παρουσίᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/028.yaml
  text: And now[a], little children, remain in him, so that if he is revealed[c][b], we may have confidence and not shrink away from him in shame at his coming.
translation:
  language: sw
  text: Na sasa, watoto wadogo, dumuni ndani yake, ili, ikiwa atadhihirishwa[a], tupate ujasiri, wala tusirudi nyuma kutoka kwake kwa aibu[b] wakati wa kuja kwake[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tafsiri nyingine: “atakapotokea.” Kitenzi cha Kigiriki kiko katika hali ya kutendwa: “atadhihirishwa.”'
    reason: lexical_alternative
  - marker: b
    text: Au “tusiaibike mbele zake.” Usemi wa Kigiriki unaweza kumaanisha kurudi nyuma kutoka kwake kwa aibu au kuaibika katika uwepo wake.
    reason: alternative_reading
  - marker: c
    text: Au “wakati wa kuwapo kwake.” Katika muktadha huu, neno la Kigiriki mara nyingi humaanisha kuja kwake kwa wakati ujao.
    reason: lexical_alternative
lexical_decisions:
- source_word: τεκνία
  choice: watoto wadogo
  rationale: Hifadhi taswira ya kifamilia na umbo la upendo la neno la Kigiriki bila kuongeza kimilikishi kisichokuwamo katika matini.
- source_word: μένετε ἐν αὐτῷ
  choice: kaeni ndani yake
  rationale: Kaeni huwasilisha mwendelezo unaoamriwa na μένετε, na ndani yake huhifadhi sitiari ya Kiyohana bila kuifafanua kupita kiasi kuwa muungano.
- source_word: φανερωθῇ
  choice: atakapodhihirishwa
  rationale: Dhihirishwa huhifadhi hali ya kutendwa ya kitenzi na inafaa kwa ufunuo wa mtu; muundo wa atakap- ni wa kawaida kwa tukio la wakati ujao linalotazamiwa katika muktadha huu.
- source_word: σχῶμεν παρρησίαν
  choice: tuwe na ujasiri
  rationale: Ujasiri huonyesha uhuru wa kusimama wazi na kwa kujiamini mbele zake, bila kudokeza ukali au ushupavu.
- source_word: αἰσχυνθῶμεν ἀπ’ αὐτοῦ
  choice: tusijitenge naye kwa aibu
  rationale: Tafsiri hii huunganisha wazo la aibu katika kitenzi na mwelekeo wa kutoka au kuwa mbali unaoweza kuonyeshwa na ἀπό, bila kuufanya usemi kuwa hukumu ya mwisho.
- source_word: παρουσίᾳ
  choice: kuja
  rationale: Katika muktadha huu wa wakati wa mwisho, kuja ni tafsiri ya kawaida na inayoeleweka ya παρουσία, huku maana ya msingi ya kuwapo ikihifadhiwa katika tanbihi.
theological_decisions:
- issue: Mhusika wa viwakilishi na kudhihirishwa kwa wakati ujao
  choice: Viwakilishi vinamrejelea Mwana, Yesu Kristo, ambaye atadhihirishwa wakati wa kuja kwake.
  alternative: Kumwelewa mhusika kwa ujumla kuwa Mungu bila kumtaja Mwana hasa.
  rationale: Muktadha wa karibu unazungumzia kukaa ndani ya Mwana na kudhihirishwa kwake. Tafsiri haiongezi jina la Yesu katika mstari, hivyo inadumisha namna ya viwakilishi ya matini.
- issue: Maana ya aibu wakati wa kuja kwake
  choice: Aibu inaelezwa pamoja na kujitenga au kurudi nyuma kutoka kwake.
  alternative: Kuaibika mbele zake, bila wazo la kujitenga.
  rationale: Muunganiko wa αἰσχυνθῶμεν na ἀπ’ αὐτοῦ unaweza kuonyesha kuwa mbali naye kwa aibu, lakini uwezekano wa maana ya kuaibika mbele zake umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa sasa na hadhi inayofaa Maandiko. Istilahi kuu za Kiyohana zimehifadhiwa bila maelezo ya kimadhehebu; tanbihi zinaonyesha tofauti halisi za kileksia na kisintaksia.
