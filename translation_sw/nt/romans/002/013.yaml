  text: οὐ γὰρ οἱ ἀκροαταὶ ⸀νόμου δίκαιοι παρὰ ⸀τῷ θεῷ, ἀλλ’ οἱ ποιηταὶ ⸁νόμου δικαιωθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/013.yaml
  text: For it is not the hearers of the law who are righteous before God[a], but the doers of the law who will be justified.
translation:
  language: sw
  text: Kwa maana si wale wanaoisikia sheria walio waadilifu mbele za Mungu, bali wale wanaoitenda sheria ndio watakaohesabiwa haki.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watakaotangazwa kuwa waadilifu”; pia yaweza kuwa, “watakaothibitishwa kuwa waadilifu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκροαταὶ
  choice: wale wanaoisikia
  rationale: Huhifadhi maana ya watu wanaoisikia sheria na kuunda tofauti ya wazi na wale wanaoitenda, kwa Kiswahili cha kawaida.
- source_word: νόμου
  choice: sheria
  rationale: Katika muktadha huu wa Paulo, nomino hii inarejelea sheria inayozungumziwa; Kiswahili hakihitaji kibainishi sawa na Kiingereza.
- source_word: δίκαιοι
  choice: wenye haki
  rationale: Ni usemi wa kawaida na wenye heshima unaoonyesha hali ya kuwa waadilifu au kukubalika katika hukumu ya Mungu bila kuifanya maana kuwa finyu kupita kiasi.
- source_word: παρὰ τῷ θεῷ
  choice: mbele za Mungu
  rationale: Huwasilisha kwa kawaida wazo la hadhi ya mtu katika tathmini au hukumu ya Mungu.
- source_word: ποιηταὶ
  choice: wale wanaoitenda
  rationale: Ni Kiswahili cha asili kinachohifadhi ulinganifu wa kimantiki na wale wanaoisikia, huku kikieleza kutekeleza sheria kwa vitendo.
- source_word: δικαιωθήσονται
  choice: watakaohesabiwa kuwa wenye haki
  rationale: Huwasilisha kwa uwazi hali ya baadaye na kauli tendwa ya δικαιόω, huku ikihifadhi maana ya kimahakama ya kutambuliwa kuwa mwenye haki.
theological_decisions:
- issue: Kutafsiri δικαιωθήσονται bila kupunguza uzito wake wa kiteolojia au kuamua kimya kimya namna hasa ya kuhesabiwa haki
  choice: watakaohesabiwa kuwa wenye haki
  alternative: watakaotangazwa kuwa wenye haki; watakaothibitishwa kuwa wenye haki
  rationale: Chaguo kuu ni la asili na linaeleweka katika Kiswahili, nalo huhifadhi wazo la hukumu ya Mungu. Tanbihi inaonyesha uwezekano wa msisitizo wa kutangazwa au kuthibitishwa bila kulazimisha fasiri moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa “wale wanaoisikia ... wale wanaoitenda” ni wa kawaida kuliko nomino nzito kama “wasikiaji” na “watendaji,” huku ukihifadhi tofauti ya wazi katika Kigiriki.
