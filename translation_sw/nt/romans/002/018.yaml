lexical_decisions:
- source_word: γινώσκεις
  choice: unayajua
  rationale: Kitenzi cha wakati uliopo kinaonyesha ujuzi wa moja kwa moja; “unayajua” ni Kiswahili cha kawaida na kinapatana na nomino ya ngeli ya wingi “mapenzi.”
- source_word: τὸ θέλημα
  choice: mapenzi yake
  rationale: Ingawa Kigiriki kinasema kihalisi “mapenzi” bila kimilikishi, muktadha unaonyesha kwamba ni mapenzi ya Mungu; “yake” huweka rejeo hilo wazi kwa Kiswahili cha asili.
- source_word: δοκιμάζεις
  choice: kuyakubali
  rationale: Hapa kitenzi kinahusu kuyachunguza na kuyatambua mambo kuwa yanafaa; “kuyakubali” huwasilisha matokeo ya tathmini hiyo bila kuondoa kabisa wazo la kupima.
- source_word: τὰ διαφέροντα
  choice: mambo yaliyo bora
  rationale: Kirai hiki kinaweza kumaanisha kihalisi “mambo yanayotofautiana” au, kwa maana ya kimuktadha, mambo yaliyo bora au yenye umuhimu zaidi. Tafsiri hii inatoa maana inayowezekana zaidi huku tanbihi ikihifadhi utata.
- source_word: κατηχούμενος
  choice: kwa kuwa unafundishwa
  rationale: Kirai cha hali-tendwa kinaweza kueleza msingi wa ujuzi na tathmini iliyotajwa; muundo wa sababu ni wa kawaida na wazi katika Kiswahili.
- source_word: ἐκ τοῦ νόμου
  choice: kutoka katika Sheria
  rationale: “Kutoka katika” huhifadhi wazo la Sheria kuwa chanzo cha mafundisho. Herufi kubwa inaonyesha Sheria ya Musa katika muktadha huu.
theological_decisions:
- issue: Mhusika wa τὸ θέλημα
  choice: mapenzi yake
  alternative: mapenzi
  rationale: Kigiriki hakitaji kimilikishi wazi, lakini muktadha wa mstari uliotangulia unamdokeza Mungu. Tanbihi inahifadhi hali ya maandishi ya asili.
- issue: Maana ya τὰ διαφέροντα
  choice: mambo yaliyo bora
  alternative: mambo yanayotofautiana
  rationale: Kirai kina utata halisi kati ya tofauti yenyewe na ubora unaotambuliwa kwa kupima. Maandishi makuu yanatumia maana ya kimuktadha, na tanbihi inahifadhi maana ya karibu zaidi na umbo la Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo unaendelea kisarufi kutoka muktadha wa Waroma 2:17, kwa hiyo unaishia kwa koma.
