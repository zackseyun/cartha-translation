  yaml_path: translation/nt/romans/002/028.yaml
  text: For a Jew is not one outwardly[a], nor is circumcision outward in the flesh[c][b];
translation:
  language: sw
  text: Kwa maana si yule aliye Myahudi kwa nje[a] ndiye Myahudi, wala tohara si ile ya nje katika mwili[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa kuonekana” au “kwa hali ya nje.”
    reason: lexical_alternative
  - marker: b
    text: “Katika mwili” hapa humaanisha tohara ya kimwili.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰουδαῖος
  choice: Myahudi
  rationale: Katika muktadha huu neno linahusu utambulisho wa agano ndani ya Israeli, si asili ya eneo la Uyahudi pekee.
- source_word: ἐν τῷ φανερῷ
  choice: kwa nje
  rationale: Kauli hii inaonyesha hali ya nje au inayoonekana, kinyume na hali ya ndani inayotajwa katika mstari unaofuata.
- source_word: περιτομή
  choice: tohara
  rationale: Hili ndilo neno la kawaida na sahihi katika Kiswahili kwa ishara ya agano inayozungumziwa hapa.
- source_word: ἐν σαρκί
  choice: katika mwili
  rationale: Hapa σάρξ linamaanisha mwili halisi na tohara ya kimwili; 'katika mwili' ni Kiswahili cha kawaida kuliko tafsiri ya moja kwa moja 'katika nyama'.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Inaendeleza uhusiano wa kutoa sababu au maelezo kuhusu hoja iliyotangulia.
- source_word: οὐδὲ ἡ ἐν τῷ φανερῷ ἐν σαρκὶ περιτομή
  choice: wala tohara si ile ya nje, katika mwili
  rationale: Inahifadhi udondoshaji wa kitenzi katika Kigiriki huku ikieleweka kwa Kiswahili na bila kuamua kupita kiasi maana ambayo mstari wa 29 unakamilisha.
theological_decisions:
- issue: Maana ya utambulisho wa agano katika ‘Myahudi’ na ‘tohara’
  choice: Kauli inatofautisha utambulisho wa nje unaoonekana na uhalisi wa ndani, bila kusema kwamba utambulisho wa Kiyahudi wenyewe umeondolewa.
  alternative: Kusema kwamba Paulo anakataa kabisa utambulisho wa Kiyahudi au anauondoa na kuweka jamii ya kiroho pekee.
  rationale: Muundo wa mstari huu pamoja na mstari wa 29 unaweka tofauti kati ya hali ya nje na ya ndani; tafsiri haipaswi kutatua kimya kimya mvutano huo wa kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Marudio ya ‘Myahudi’ yanawekwa ili sentensi iwe wazi, na ‘kwa nje’ hudumisha ulinganisho na hali ya ndani katika mstari unaofuata.
