id: ROM.2.7
reference: Romans 2:7
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: τοῖς μὲν καθ’ ὑπομονὴν ἔργου ἀγαθοῦ δόξαν καὶ τιμὴν καὶ ἀφθαρσίαν ζητοῦσιν ζωὴν αἰώνιον·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/007.yaml
  text: eternal life to those who by perseverance in doing good seek glory and honor and immortality.
translation:
  language: sw
  text: uzima wa milele kwa wale ambao, kwa kuvumilia katika kutenda mema, wanatafuta utukufu, heshima na kutoharibika.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπομονή
  choice: kuvumilia
  rationale: Huwasilisha ustahimilivu wa kudumu katika mwenendo, kwa lugha ya kawaida na yenye heshima.
- source_word: ἔργου ἀγαθοῦ
  choice: kutenda mema
  rationale: Ingawa muundo wa Kigiriki ni wa umoja, maana yake hapa ni kuendelea kufanya yaliyo mema; kitenzi hiki ni cha asili zaidi kwa Kiswahili kuliko ‘kazi njema’ katika muktadha huu.
- source_word: δόξαν
  choice: utukufu
  rationale: Neno la kawaida la kibiblia kwa δόξα, bila kufafanua mapema chanzo au namna ya utukufu huo.
- source_word: τιμήν
  choice: heshima
  rationale: Hutofautisha τιμή na δόξα huku likidumisha maana ya kuthaminiwa au kupewa hadhi.
- source_word: ἀφθαρσίαν
  choice: kutoharibika
  rationale: Huhifadhi maana pana ya hali isiyopatwa na uharibifu, badala ya kuibana moja kwa moja kuwa ‘kutokufa’.
- source_word: ζωὴν αἰώνιον
  choice: uzima wa milele
  rationale: Ni usemi wa Kiswahili uliozoeleka na wenye maana ya uhai wa enzi ijayo na udumu wake.
theological_decisions:
- issue: Uhusiano kati ya kuvumilia, kutenda mema, kutafuta, na kupewa uzima wa milele
  choice: 'Muundo umeachwa kama kauli ya moja kwa moja: ‘uzima wa milele kwa wale ambao...’'
  alternative: Kuongeza maelezo kama ‘kwa msingi wa’ au ‘kama ushahidi wa imani’
  rationale: Kigiriki hakiongezi ufafanuzi huo. Tafsiri inadumisha mvutano wa hoja ya Paulo katika muktadha bila kuingiza mfumo wa kiteolojia.
- issue: Maana ya ἀφθαρσία
  choice: kutoharibika
  alternative: kutokufa
  rationale: ‘Kutoharibika’ ni pana zaidi na linaakisi neno la chanzo bila kulifanya sawa kabisa na kutokufa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa, fasaha na chenye heshima. Mpangilio unafuata kipande cha sentensi kinachoendelea kutoka Warumi 2:6, kama ilivyo katika chanzo.
