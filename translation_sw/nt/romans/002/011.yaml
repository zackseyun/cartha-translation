lexical_decisions:
- source_word: γάρ
  choice: Kwa maana
  rationale: Inaonyesha kwamba mstari huu unatoa msingi wa kauli iliyotangulia, kwa namna ya kawaida na yenye kueleweka katika Kiswahili.
- source_word: προσωπολημψία
  choice: upendeleo
  rationale: Neno hili humaanisha kumpendelea mtu kwa kuangalia hadhi au mambo ya nje; “upendeleo” ni la kawaida, sahihi, na linafaa katika muktadha wa hukumu.
- source_word: παρὰ τῷ θεῷ
  choice: Mungu hana
  rationale: Ingawa Kigiriki kina muundo wa kuwapo, Kiswahili cha kawaida huwasilisha uhusiano huu kwa uwazi zaidi kwa kusema “Mungu hana,” bila kubadili maana kwamba upendeleo haupo kwa Mungu.
- source_word: οὐ γάρ ἐστιν προσωπολημψία παρὰ τῷ θεῷ
  choice: Kwa maana Mungu hana upendeleo.
  rationale: Muundo huu ni wa asili na wenye hadhi katika Kiswahili. Unahifadhi nguvu ya ufafanuzi ya γάρ na ukweli wa jumla kuhusu kutokuwapo kwa upendeleo kwa Mungu.
theological_decisions:
- issue: Jinsi ya kueleza kutopendelea kwa Mungu
  choice: Mungu hana upendeleo
  alternative: Hakuna upendeleo kwa Mungu
  rationale: Kauli iliyochaguliwa ni ya kawaida zaidi katika Kiswahili na inaeleza tabia ya Mungu bila kuingiza tofauti ya kimadhehebu. Njia mbadala hufuata zaidi muundo wa Kigiriki lakini si ya asili sana katika matumizi ya kawaida.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha fupi, ya sasa, yenye hadhi, na inayoeleweka kwa wasomaji wa kawaida.
