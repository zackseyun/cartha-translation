  yaml_path: translation/nt/romans/002/011.yaml
  text: For there is no partiality with God[a].
translation:
  language: sw
  text: Kwa maana Mungu hana upendeleo[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ubaguzi.”
