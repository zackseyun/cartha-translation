  text: οἵτινες ἐνδείκνυνται τὸ ἔργον τοῦ νόμου γραπτὸν ἐν ταῖς καρδίαις αὐτῶν, συμμαρτυρούσης αὐτῶν τῆς συνειδήσεως καὶ μεταξὺ ἀλλήλων τῶν λογισμῶν κατηγορούντων ἢ καὶ ἀπολογουμένων,
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/015.yaml
  text: They show that the work of the law is written on their hearts[b][a], while their conscience also bears witness and their thoughts accuse or even defend them.
translation:
  language: sw
  text: Wanaonyesha kwamba kazi ya sheria imeandikwa mioyoni mwao,[a] huku dhamiri yao pia ikishuhudia, na mawazo yao yakiwashtaki au hata kuwatetea.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “matakwa ya sheria” au “yale ambayo sheria inataka.”
    reason: lexical_alternative
  - marker: b
    text: Au, “mawazo yao yakishtakiana au hata kuteteana”; Kigiriki huonyesha wazo la urejeleano, yaani mawazo hayo yakiwa miongoni mwao au ya kila moja kwa jingine.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐνδείκνυνται
  choice: wanaonyesha
  rationale: Neno hili ni la kawaida na linaonyesha uthibitisho unaodhihirika bila kulifanya dai la uthibitisho mkali kupita maana ya Kigiriki.
- source_word: τὸ ἔργον τοῦ νόμου
  choice: kazi ya sheria
  rationale: Huhifadhi usemi mfupi wa Kigiriki wenye neno ‘kazi’ katika umoja, badala ya kuufafanua moja kwa moja kuwa matakwa ya sheria.
- source_word: γραπτὸν ἐν ταῖς καρδίαις αὐτῶν
  choice: imeandikwa mioyoni mwao
  rationale: Ni usemi wa asili katika Kiswahili unaohifadhi sitiari ya kuandikwa ndani ya utu wao.
- source_word: συμμαρτυρούσης αὐτῶν τῆς συνειδήσεως
  choice: huku dhamiri yao pia ikishuhudia
  rationale: Hutoa muundo wa Kigiriki kwa Kiswahili fasaha na kuhifadhi wazo la ushahidi unaoambatana na jambo lililotangulia.
- source_word: μεταξὺ ἀλλήλων τῶν λογισμῶν
  choice: mawazo yao
  rationale: Muundo wa Kigiriki umebanwa na una maana ya kuhusiana kwa mawazo hayo. Matini kuu inaweka sentensi wazi, huku maana ya moja kwa jingine ikihifadhiwa katika tanbihi.
- source_word: κατηγορούντων ἢ καὶ ἀπολογουμένων
  choice: yakiwashtaki au hata kuwatetea
  rationale: ‘Kuwatetea’ ni karibu zaidi na ἀπολογουμένων kuliko ‘kuwapa udhuru,’ na ‘hata’ huonyesha mkazo wa καὶ baada ya ἢ.
theological_decisions:
- issue: Je, τὸ ἔργον τοῦ νόμου inamaanisha kwa ujumla ‘kazi ya sheria’ au hasa ‘matakwa ya sheria’?
  choice: kazi ya sheria
  alternative: matakwa ya sheria; yale ambayo sheria inataka
  rationale: Matini kuu inahifadhi usemi wa Kigiriki usiofafanuliwa kikamilifu, hivyo kutoondoa mvutano wa kiteolojia; tafsiri ya kawaida zaidi imewekwa katika tanbihi.
- issue: Je, mawazo yanashitakiana au yanawashitaki na kuwatetea watu wanaozungumziwa?
  choice: mawazo yao yakiwashtaki au hata kuwatetea
  alternative: mawazo yao yakishtakiana au hata kuteteana
  rationale: Chaguo kuu linaonyesha kazi ya mawazo katika kutoa hukumu juu ya watu hao, huku maana ya kurejeleana iliyo katika ἀλλήλων ikihifadhiwa kama uwezekano katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi, kimetumiwa. ‘Mioyoni mwao’ ni usemi wa kawaida wa sitiari hii; ‘dhamiri’ na ‘kuwatetea’ ni maneno yanayoeleweka kwa wasomaji wa kawaida bila kuingiza msimamo wa kimadhehebu.
