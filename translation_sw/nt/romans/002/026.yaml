  text: So then[a], if the uncircumcised man keeps the requirements of the law, will not his uncircumcision be counted as circumcision?
translation:
  language: sw
  text: Kwa hiyo, ikiwa mtu asiye na tohara[a] anashika matakwa ya sheria, je, kutotahiriwa kwake hakutahesabiwa kuwa tohara?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “ikiwa kutotahiriwa kutashika matakwa ya sheria, je, kutotahiriwa kwake hakutahesabiwa kuwa tohara?”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκροβυστία
  choice: mtu ambaye hajatahiriwa / kutotahiriwa kwake
  rationale: Nomino hiyo humaanisha kihalisi hali ya kutotahiriwa, lakini katika sehemu ya kwanza inamwakilisha mtu asiyetahiriwa, kama inavyothibitishwa na αὐτοῦ (‘kwake’). Tafsiri ya pili inahifadhi maana yake halisi ya hali ya kutotahiriwa.
- source_word: δικαιώματα
  choice: matakwa
  rationale: Katika muktadha huu ni mambo ambayo sheria inadai; ‘matakwa’ ni Kiswahili cha kawaida na wazi kisichoongeza msisitizo usio katika kirai chenyewe.
- source_word: νόμου
  choice: ya sheria
  rationale: Muundo wa umilikaji unatafsiriwa kwa kawaida kuwa ‘ya sheria’ na katika muktadha unarejelea sheria inayojadiliwa na Paulo.
- source_word: φυλάσσῃ
  choice: anatimiza
  rationale: Hapa kitenzi kina maana ya kushika au kutii yale yanayodaiwa na sheria. ‘Anatimiza matakwa’ ni usemi wa asili na unaoeleweka katika Kiswahili.
- source_word: λογισθήσεται
  choice: hakutahesabiwa
  rationale: ‘Kuhesabiwa’ huhifadhi taswira ya kuweka jambo katika hesabu au kuliona kuwa na hadhi fulani, bila kutumia lugha ya kizamani.
- source_word: εἰς περιτομήν
  choice: kuwa tohara
  rationale: εἰς hapa huonyesha matokeo au hadhi; ‘kuhesabiwa kuwa tohara’ huwasilisha kuingizwa katika kundi au hadhi ya tohara.
- source_word: οὐχ
  choice: je, ... hakutahesabiwa ...?
  rationale: Chembe hasi inaanzisha swali la balagha linalotarajia jibu la ndiyo; muundo huu wa Kiswahili unahifadhi nguvu hiyo.
