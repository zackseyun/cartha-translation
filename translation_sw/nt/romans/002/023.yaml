  yaml_path: translation/nt/romans/002/023.yaml
  text: You who boast in the law[a], do you dishonor God through your transgression of the law?
translation:
  language: sw
  text: Wewe unayejisifu kwa sheria, je, unamvunjia Mungu heshima kwa kukiuka sheria[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa kuvunja sheria.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν νόμῳ
  choice: kwa sheria
  rationale: Kauli hii ya Kiswahili ni fupi na ya kawaida, na inadumisha wazo la kujisifu kwa msingi wa sheria bila kulifanya kuwa tu kujisifu ‘kuhusu’ sheria.
- source_word: καυχᾶσαι
  choice: unayejisifu
  rationale: ‘Kujisifu’ inadumisha ukali wa lawama ya Paulo na tofauti iliyopo kati ya kujisifu kwa sheria na kutoiishi.
- source_word: διὰ τῆς παραβάσεως τοῦ νόμου
  choice: kwa kukiuka sheria
  rationale: Muundo wa kitenzi unasomeka kwa kawaida katika Kiswahili na unaonyesha wazi kuwa ukiukaji wa sheria ndio njia ambayo Mungu anavunjiwa heshima.
- source_word: τὸν θεὸν
  choice: Mungu
  rationale: Jina ‘Mungu’ hutambulisha rejeleo dhahiri kwa kawaida katika Kiswahili bila kuhitaji kutafsiri kibainishi cha Kigiriki kineno kwa neno.
- source_word: ἀτιμάζεις
  choice: unamvunjia Mungu heshima
  rationale: Usemi huu wa kawaida unaonyesha maana ya kumkosesha Mungu heshima na kuhifadhi nguvu ya swali la lawama.
theological_decisions:
- issue: νόμος katika hoja ya Paulo
  choice: sheria
  alternative: Sheria
  rationale: Muktadha unaelekeza kwenye sheria ya Kiyahudi, lakini herufi ndogo huepuka kuingiza desturi ya kiufundi ya uandishi ambayo haijaonyeshwa moja kwa moja na Kigiriki.
- issue: Uhusiano wa kujisifu na sheria katika ἐν νόμῳ
  choice: kujisifu kwa sheria
  alternative: kujivunia sheria
  rationale: Chaguo hili linahifadhi sauti kali ya καυχᾶσαι na pia halibainishi kupita kiasi ikiwa sheria ni msingi, sababu, au jambo la kujisifia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi, na rahisi kueleweka. Muundo wa swali la balagha umehifadhiwa.
