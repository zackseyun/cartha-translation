  text: δόξα δὲ καὶ τιμὴ καὶ εἰρήνη παντὶ τῷ ἐργαζομένῳ τὸ ἀγαθόν, Ἰουδαίῳ τε πρῶτον καὶ Ἕλληνι·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/010.yaml
  text: but glory and honor and peace to everyone who does good[b][a], to the Jew first and also to the Greek.
translation:
  language: sw
  text: 'lakini utukufu, heshima na amani ni kwa kila mtu atendaye mema[a]: kwa Myahudi kwanza, na pia kwa Mgiriki[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kilicho chema.”
    reason: lexical_alternative
  - marker: b
    text: Neno “Mgiriki” hapa huenda likimaanisha mtu asiye Myahudi kwa upana zaidi, yaani, mtu wa Mataifa.
    reason: cultural_note
lexical_decisions:
- source_word: δόξα
  choice: utukufu
  rationale: Neno hili linahifadhi uzito wa heshima na wazo la thawabu ya mwisho katika muktadha huu.
- source_word: τιμή
  choice: heshima
  rationale: Ni tafsiri ya kawaida na ya asili, na inaendana vizuri na “utukufu” katika orodha ya thawabu.
- source_word: εἰρήνη
  choice: amani
  rationale: Linahifadhi upana wa maana ya kibiblia bila kuamua kimakusudi ikiwa mkazo ni hali njema, upatanisho, au utulivu wa ndani.
- source_word: παντὶ τῷ ἐργαζομένῳ
  choice: kwa kila mtu atendaye
  rationale: Muundo huu unaonyesha mtu anayetambulishwa kwa kuendelea kutenda; “atendaye” ni wa asili, wenye hadhi, na unaohifadhi hali hiyo.
- source_word: τὸ ἀγαθόν
  choice: mema
  rationale: Baada ya kitenzi “kutenda,” “mema” ni Kiswahili cha kawaida na huwasilisha maana ya “lililo jema/mambo mema” bila ugumu.
- source_word: Ἰουδαίῳ
  choice: Myahudi
  rationale: Ni tafsiri ya moja kwa moja ya nomino ya umoja inayotumika kiuwakilishi hapa.
- source_word: πρῶτον
  choice: kwanza
  rationale: Inahifadhi kwa ufupi mpangilio anaoutaja Paulo bila kuongeza maelezo ya kitheolojia.
- source_word: Ἕλληνι
  choice: Mgiriki
  rationale: Inahifadhi neno halisi na jozi ya Paulo ya “Myahudi ... Mgiriki”; maana yake pana katika muktadha imefafanuliwa katika tanbihi.
- source_word: δὲ
  choice: lakini
  rationale: Kiunganishi hiki kinaonyesha tofauti na ghadhabu na dhiki zilizotajwa katika mstari uliotangulia.
theological_decisions:
- issue: Maana ya Ἕλληνι katika ulinganisho wa Paulo wa Myahudi na Mgiriki
  choice: “Mgiriki” katika andiko kuu, pamoja na tanbihi inayoeleza maana pana ya asiye Myahudi.
  alternative: Mtu wa Mataifa
  rationale: Neno la Kigiriki ni “Mgiriki,” lakini katika Waroma jozi hii mara nyingi huwakilisha Wayahudi na wasio Wayahudi kwa ujumla. Uamuzi huu unahifadhi usemi wa chanzo na pia kutunza upana wake wa kimuktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Atendaye” hudumisha mtiririko mfupi wa sentensi na maana ya tabia endelevu; alama zote za tanbihi zimewekwa baada ya maneno yanayohusika.
