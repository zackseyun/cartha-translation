  text: ἀλλ’ ὁ ἐν τῷ κρυπτῷ Ἰουδαῖος, καὶ περιτομὴ καρδίας ἐν πνεύματι οὐ γράμματι, οὗ ὁ ἔπαινος οὐκ ἐξ ἀνθρώπων ἀλλ’ ἐκ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/029.yaml
  text: But the Jew is one inwardly[a], and circumcision is of the heart—by the Spirit, not by the letter—whose praise is not from people but from God.
translation:
  language: sw
  text: Bali Myahudi wa ndani ndiye Myahudi, na tohara ya moyo—katika roho[a], si katika herufi—ambaye sifa yake haitoki kwa watu bali kwa Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “katika Roho,” yaani Roho Mtakatifu. Pia inaweza kumaanisha roho ya mwanadamu au uhalisi wa kiroho wa ndani, kinyume cha herufi iliyoandikwa.'
    reason: Maana ya πνεύματι inabishaniwa; tanbihi huhifadhi usomaji wa Roho Mtakatifu bila kuufanya kuwa uamuzi wa matini kuu.
lexical_decisions:
- source_word: ἐν τῷ κρυπτῷ
  choice: kwa ndani
  rationale: Kirai hiki kinaonyesha hali ya ndani au iliyofichika, kwa kulinganisha na utambulisho wa nje; “kwa ndani” ni Kiswahili cha kawaida na hakidokezi tu kufanya jambo kwa siri.
- source_word: Ἰουδαῖος
  choice: Myahudi
  rationale: Muktadha unahusu utambulisho wa kidini na wa agano, si eneo la Uyahudi pekee.
- source_word: περιτομὴ καρδίας
  choice: tohara ya kweli ni ya moyo
  rationale: Huhifadhi sitiari ya tohara na kuweka wazi tofauti kati ya hali ya moyo na tendo la nje. Neno “ya kweli” limetumiwa kuwasilisha kiima kinachodokezwa katika sentensi ya Kigiriki na kulinganisha na tohara ya nje katika mstari uliotangulia.
- source_word: ἐν πνεύματι
  choice: kwa Roho
  rationale: Katika tofauti ya Paulo kati ya πνεῦμα na γράμμα, Roho Mtakatifu ndiye rejeleo linalowezekana zaidi; “kwa” linaonyesha njia au utendaji kwa Kiswahili cha kawaida. Utata halisi umehifadhiwa katika tanbihi.
- source_word: οὐ γράμματι
  choice: si kwa andiko
  rationale: “Andiko” hapa linaonyesha sheria iliyoandikwa au kanuni ya nje, badala ya herufi moja ya alfabeti, huku likihifadhi utofautishaji wa Paulo kati ya Roho na kilichoandikwa.
- source_word: οὗ ὁ ἔπαινος
  choice: Sifa ya mtu huyo
  rationale: Hufanya rejeleo kwa Myahudi wa ndani lieleweke kwa Kiswahili bila kubadili maana ya kishazi husika.
- source_word: ἐξ ἀνθρώπων
  choice: haitoki kwa watu
  rationale: Wingi huu ni wa jumla na unawahusu wanadamu bila kujali jinsia.
- source_word: ἐκ τοῦ θεοῦ
  choice: kwa Mungu
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya chanzo cha sifa hiyo.
theological_decisions:
- issue: Ikiwa πνεύματι inamaanisha Roho Mtakatifu au roho ya mwanadamu/hali ya kiroho ya ndani
  choice: Roho Mtakatifu
  alternative: roho ya mwanadamu au hali ya ndani ya kiroho
  rationale: Utofautishaji wa Paulo kati ya Roho na andiko unaelekea kumaanisha kazi ya Roho Mtakatifu, lakini umbo la Kigiriki haliondoi kabisa maana ya roho au uhalisi wa ndani; kwa hiyo maana mbadala imewekwa katika tanbihi.
- issue: Maana ya Myahudi wa kweli na tohara ya kweli
  choice: Kutumia “wa kweli” na “ya kweli” kueleza tofauti inayodokezwa kati ya hali ya ndani na ya nje
  alternative: 'Kutafsiri kwa muundo mkavu zaidi: “Myahudi ni yule wa ndani, na tohara ni ya moyo”'
  rationale: Maneno haya hayaanzishi dhehebu au dai jipya, bali yanafanya ulinganisho wa mstari wa 28–29 uwe wa kawaida na unaoeleweka katika Kiswahili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umegawanywa katika sentensi mbili ili kuepuka kishazi kirefu kisicho cha kawaida, huku uhusiano wa hoja ukihifadhiwa. Alama ya tanbihi [a] imewekwa mara moja baada ya “Roho”.
