  yaml_path: translation/nt/romans/002/017.yaml
  text: But if you call yourself a Jew and rely on the law and boast in God[b][a],
translation:
  language: sw
  text: Lakini ikiwa wewe unajiita Myahudi[a], unaitegemea Sheria[b], na unajivunia Mungu,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “unaitwa Myahudi” au “unajulikana kwa jina la Myahudi.”
    reason: lexical_alternative
  - marker: b
    text: Au, “unaegemea Sheria.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ δὲ
  choice: Lakini ikiwa
  rationale: Inahifadhi hali ya sharti ya εἰ na nguvu ya δέ yenye kuendeleza hoja huku ikionyesha utofautishaji wa kiasi.
- source_word: Ἰουδαῖος
  choice: Myahudi
  rationale: Katika Waroma neno hili hasa linataja utambulisho wa kikabila na kidini, si eneo la kijiografia pekee.
- source_word: ἐπονομάζῃ
  choice: unajiita
  rationale: Kauli ya kati inaweza kuwa na maana ya kujitaja au kujitambulisha kwa jina hilo; ‘unajiita’ ni ya kawaida na inahifadhi makali ya usemi wa Paulo.
- source_word: ἐπαναπαύῃ
  choice: unaitegemea
  rationale: Inaeleza kuweka tumaini au uhakika katika sheria, badala ya kupumzika kimwili; ‘unaitegemea’ ni wazi katika Kiswahili cha sasa.
- source_word: νόμῳ
  choice: sheria
  rationale: Muktadha unaelekeza kwenye Sheria ya Musa kama jambo linalotambulika katika agano; Kiswahili hakihitaji kuongeza kibainishi cha Kiingereza ‘the’.
- source_word: καυχᾶσαι
  choice: kujisifu
  rationale: Inahifadhi maana ya Paulo ya kujivunia au kujisifia, bila kuamua mapema ikiwa tendo hilo ni jema au baya katika kila muktadha.
- source_word: ἐν θεῷ
  choice: katika Mungu
  rationale: Inahifadhi kwa karibu muundo wa ἐν na pia mvutano wa maana kati ya kujisifu kwa sababu ya Mungu na kujivunia uhusiano na Mungu.
theological_decisions:
- issue: Maana ya καυχᾶσαι ἐν θεῷ
  choice: kujisifu katika Mungu
  alternative: kujivunia Mungu
  rationale: Muundo wa karibu na Kigiriki umechaguliwa ili kutofuta utata wa ikiwa mtu anajisifu kwa sababu ya Mungu, anajivunia kuwa na Mungu, au anajivunia uhusiano wake na Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umeachwa kama mwanzo wa sentensi ya sharti inayoendelea katika mistari inayofuata. Viambishi vya ngeli katika ‘unaitegemea’ na ‘unaiegemea’ vinarejelea ‘sheria’.
