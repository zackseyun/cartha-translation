  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἢ τοῦ πλούτου τῆς χρηστότητος αὐτοῦ καὶ τῆς ἀνοχῆς καὶ τῆς μακροθυμίας καταφρονεῖς, ἀγνοῶν ὅτι τὸ χρηστὸν τοῦ θεοῦ εἰς μετάνοιάν σε ἄγει;
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/004.yaml
  text: Or do you despise the riches of his kindness and forbearance and patience[a], not knowing that God's kindness is leading you to repentance?
translation:
  language: sw
  text: Au unaudharau utajiri wa wema wake, ustahimilivu wake na uvumilivu wake[a], bila kujua kwamba wema wa Mungu unakuongoza kwenye toba?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “fadhili” katika matukio yote mawili ya “wema.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πλούτου
  choice: wingi
  rationale: Katika Kiswahili, “wingi wa” huwasilisha kwa kawaida sitiari ya utajiri au wingi mkubwa wa sifa hizi bila kuifanya sentensi kuwa nzito.
- source_word: χρηστότητος / τὸ χρηστόν
  choice: wema
  rationale: “Wema” linafaa kwa χρηστότης katika muktadha huu na linaruhusu neno lilelile kutumiwa katika sehemu zote mbili; pia linaweza kubeba maana ya kutenda kwa ukarimu na upole.
- source_word: ἀνοχῆς
  choice: ustahimilivu
  rationale: “Ustahimilivu” unaonyesha Mungu kujizuia kutoa hukumu mara moja, bila maana ya kukubali uovu.
- source_word: μακροθυμίας
  choice: uvumilivu
  rationale: “Uvumilivu” ni neno la sasa na linaloeleweka, nalo huwasilisha subira ya muda mrefu huku likitofautishwa kwa kiasi na ustahimilivu.
- source_word: καταφρονεῖς
  choice: unaudharau
  rationale: “Unaudharau” huhifadhi nguvu ya karipio la kitenzi cha Kigiriki na ni ya kawaida katika Kiswahili sanifu.
- source_word: ἀγνοῶν
  choice: bila kujua
  rationale: Hii huakisi hali ya kutokujua bila kuongeza wazo la kupuuza kimakusudi ambalo kitenzi-shirikishi hakilazimishi.
- source_word: εἰς μετάνοιάν
  choice: kwenye toba
  rationale: “Kwenye toba” huhifadhi mwelekeo wa εἰς na kutumia istilahi ya kawaida ya kibiblia kwa μετάνοια, ambayo ni pana kuliko kubadili mawazo tu.
- source_word: ἄγει
  choice: unakuongoza
  rationale: Wakati wa sasa na mtendwa wa nafsi ya pili umewasilishwa moja kwa moja; usemi huu hauamui kimbele namna au matokeo ya uongozi huo.
theological_decisions:
- issue: Maana ya χρηστότης / χρηστόν kama “wema” au “fadhili.”
  choice: Nimetumia “wema” katika sehemu zote mbili.
  alternative: “Fadhili” katika sehemu zote mbili.
  rationale: “Wema” huhifadhi upana halisi wa neno la Kigiriki na urudiaji wake, huku tanbihi ikionyesha maana ya kimahusiano ya “fadhili” bila kuifunga matini kwa chaguo moja.
- issue: Nguvu ya kauli “unakuongoza kwenye toba.”
  choice: Nimehifadhi kauli ya sasa yenye mwelekeo bila kueleza kama uongozi huo unafikia matokeo kwa lazima.
  alternative: “unakusudia kukuongoza kwenye toba” au “unakuleta kwenye toba.”
  rationale: Kigiriki ἄγει εἰς kinaeleza uongozi kuelekea toba; kuongeza kusudi pekee au matokeo yaliyokamilika kungesuluhisha mvutano wa kiteolojia ambao matini yenyewe hauusuluhishi hapa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imehifadhi swali kali la Paulo, urudiaji wa χρηστότης, na tofauti kati ya ἀνοχή na μακροθυμία kwa maneno yanayoeleweka kwa wasomaji wa kawaida.
