id: ROM.2.1
reference: Romans 2:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Διὸ ἀναπολόγητος εἶ, ὦ ἄνθρωπε πᾶς ὁ κρίνων· ἐν ᾧ γὰρ κρίνεις τὸν ἕτερον, σεαυτὸν κατακρίνεις, τὰ γὰρ αὐτὰ πράσσεις ὁ κρίνων·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/001.yaml
  text: Therefore you are without excuse[a], O man, every one who judges. For in passing judgment on another, you condemn yourself, because you who judge practice the same things.
translation:
  language: sw
  text: Kwa hiyo huna udhuru, ewe mwanadamu[a]—hata uwe nani, wewe unayehukumu. Kwa maana unapomhukumu mwingine, unajihukumu mwenyewe kuwa na hatia, kwa sababu wewe unayehukumu unatenda mambo yaleyale.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ewe mtu.” Kigiriki kimetumia umoja wa kiume, lakini hapa neno hilo linamwakilisha kila mwanadamu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὸ
  choice: Kwa hiyo
  rationale: Inaonyesha hitimisho linalotokana na hoja iliyotangulia kwa Kiswahili cha kawaida na wazi.
- source_word: ἀναπολόγητος
  choice: huna udhuru
  rationale: Inahifadhi maana ya kutokuwa na utetezi halali, huku ikisomeka kwa kawaida katika Kiswahili cha sasa.
- source_word: ὦ ἄνθρωπε
  choice: ewe mwanadamu
  rationale: Inadumisha wito wa moja kwa moja wa Paulo; “mwanadamu” ni neno jumuishi katika Kiswahili ingawa Kigiriki kimetumia umoja wa kiume kwa maana wakilishi.
- source_word: πᾶς ὁ κρίνων
  choice: hata uwe nani, wewe unayehukumu
  rationale: Inatoa wazi nguvu ya ujumla ya πᾶς na kumtambulisha anayesemeshwa, bila tungo ngumu au yenye utata katika Kiswahili.
- source_word: ἐν ᾧ κρίνεις τὸν ἕτερον
  choice: unapomhukumu mwingine
  rationale: Tungo hii ya wakati inadokeza kwamba katika tendo lenyewe la kumhukumu mwingine, mtu anajihukumu; ni ya asili katika Kiswahili bila kuondoa uhusiano huo.
- source_word: κατακρίνεις
  choice: unajihukumu mwenyewe kuwa na hatia
  rationale: 'Inaonyesha nguvu iliyo kubwa kuliko κρίνεις: si kutathmini tu, bali kujitangazia hukumu ya hatia.'
- source_word: τὰ γὰρ αὐτὰ πράσσεις
  choice: kwa sababu ... unatenda mambo yaleyale
  rationale: “Unatenda” huonyesha mwenendo halisi unaoendelea, na “mambo yaleyale” huhifadhi msisitizo wa kufanana kwa matendo.
- source_word: ὁ κρίνων
  choice: wewe unayehukumu
  rationale: Inahifadhi utambulisho wa moja kwa moja wa msemeshwa kama yule anayehukumu.
theological_decisions:
- issue: Wito wa kiume wenye maana wakilishi katika karipio la Paulo
  choice: ewe mwanadamu
  alternative: ewe mtu
  rationale: “Mwanadamu” inadumisha uzito wa wito wa umoja na kwa kawaida inawahusu wanadamu wote; tanbihi inaeleza umbo la Kigiriki bila kuifanya aya iwahusu wanaume peke yao.
- issue: Tofauti kati ya κρίνεις na κατακρίνεις
  choice: kutafsiri κατακρίνεις kuwa “unajihukumu mwenyewe kuwa na hatia”
  alternative: unajihukumu mwenyewe
  rationale: Nyongeza “kuwa na hatia” inaweka wazi nguvu ya kimahakama ya kitenzi cha pili na kuhifadhi ongezeko la ukali kutoka kuhukumu hadi kuhukumu kuwa na hatia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Alama ya mkato mrefu inaweka wazi kwamba “hata uwe nani, wewe unayehukumu” inafafanua msemeshwa. Lugha ni ya moja kwa moja na ya kimahakama bila kuwa ya kitaalamu kupita kiasi.
