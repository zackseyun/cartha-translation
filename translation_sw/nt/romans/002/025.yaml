id: ROM.2.25
reference: Romans 2:25
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Περιτομὴ μὲν γὰρ ὠφελεῖ ἐὰν νόμον πράσσῃς· ἐὰν δὲ παραβάτης νόμου ᾖς, ἡ περιτομή σου ἀκροβυστία γέγονεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/025.yaml
  text: Circumcision indeed is beneficial if you practice the law[a]; but if you are a transgressor of the law[d][c][b], your circumcision has become uncircumcision.
translation:
  language: sw
  text: Kwa maana tohara ina faida ikiwa unaitenda sheria; lakini ikiwa wewe ni mvunjaji wa sheria, tohara yako imekuwa kutotahiriwa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, mtu anapoivunja sheria, tohara yake hupoteza thamani yake kama ishara ya agano; maneno haya hayamaanishi kwamba hali yake ya kimwili imebadilika.
    reason: cultural_note
lexical_decisions:
- source_word: Περιτομὴ
  choice: tohara
  rationale: Neno la kawaida na lenye heshima katika Kiswahili kwa tendo na hali ya kutahiriwa; linahifadhi dhana ya agano na ulinganifu na ἀκροβυστία.
- source_word: μὲν γὰρ
  choice: Kwa maana ... ina faida
  rationale: γάρ inaendeleza hoja kwa kutoa sababu, huku μέν ikiandaa utofautishaji unaofuata kwa δέ; muundo wa Kiswahili unawasilisha kazi hizo kwa kawaida bila kuzidisha viunganishi.
- source_word: ὠφελεῖ
  choice: ina faida
  rationale: Huwasilisha manufaa au thamani halisi kwa lugha ya sasa na iliyo wazi.
- source_word: ἐὰν νόμον πράσσῃς
  choice: ikiwa unaitenda sheria
  rationale: Kitenzi 'kutenda' kinakaribia πράσσω, yaani kufanya au kutekeleza, bila kufasiri mapema kuwa ni 'kushika' sheria.
- source_word: παραβάτης νόμου
  choice: mvunjaji wa sheria
  rationale: Ni usemi wa kawaida unaohifadhi wazo la mtu anayekiuka sheria na uhusiano wa wazi na νόμος.
- source_word: ἡ περιτομή σου
  choice: tohara yako
  rationale: Huhifadhi umilikishi na usemi wa moja kwa moja wa Paulo.
- source_word: ἀκροβυστία
  choice: kutotahiriwa
  rationale: Katika muktadha huu ni hali iliyo kinyume cha tohara kwa maana ya agano, si kiungo cha mwili pekee.
- source_word: γέγονεν
  choice: imekuwa
  rationale: Huhifadhi wazo la mabadiliko lenye hali ya matokeo inayoendelea, kama lilivyo katika wakati timilifu wa Kigiriki.
theological_decisions:
- issue: Je, kishazi cha mwisho kifafanuliwe kuwa tathmini ya hadhi au kihifadhi ugeuzaji mkali wa Paulo?
  choice: tohara yako imekuwa kutotahiriwa
  alternative: tohara yako inahesabiwa kuwa kutotahiriwa
  rationale: Kigiriki γέγονεν kinasema 'imekuwa' kwa nguvu zaidi kuliko 'inahesabiwa'; tafsiri kuu inahifadhi usemi halisi na mvutano wa Paulo bila kuufanya mabadiliko ya kimwili. Tanbihi inaeleza maana yake ya kiagano.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo unahifadhi utofautishaji wa masharti mawili na usemi mkali wa mwisho.
