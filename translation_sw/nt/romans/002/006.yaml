  text: who will repay each one according to his works[a][b].
translation:
  language: sw
  text: ambaye atamlipa kila mtu kulingana na matendo yake.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὃς
  choice: ambaye
  rationale: Kiwakilishi hiki cha uhusiano kinaunganisha kauli moja kwa moja na Mungu aliyetajwa katika muktadha uliotangulia.
- source_word: ἀποδώσει
  choice: atamlipa
  rationale: Kitenzi hiki kina maana ya kumpa mtu kile kinachomstahili katika muktadha wa hukumu; “atamlipa” huhifadhi nguvu ya malipo bila kuifanya iwe thawabu nzuri tu.
- source_word: ἑκάστῳ
  choice: kila mtu
  rationale: Huhifadhi maana ya kugawa kwa mmoja mmoja na ni Kiswahili cha kawaida na wazi.
- source_word: κατὰ
  choice: kulingana na
  rationale: Huonyesha kipimo au msingi ambao malipo yatafuata.
- source_word: τὰ ἔργα
  choice: matendo
  rationale: “Matendo” ni sawia ya kawaida na yenye upana unaofaa kwa ἔργα katika Kiswahili; inaweza kujumuisha mambo ambayo mtu ametenda, mema au mabaya.
- source_word: αὐτοῦ
  choice: yake
  rationale: Kirejeshi “yake” hurejelea kwa kawaida kila mtu bila kulazimisha jinsia katika Kiswahili, huku kikihifadhi umoja wa kigawanyo.
theological_decisions:
- issue: Hukumu kulingana na matendo
  choice: Kudumisha kauli kwamba Mungu atamlipa kila mtu kulingana na matendo yake.
  alternative: Kutafsiri kwa ujumla zaidi kuwa Mungu “atamtendea” au “atampa thawabu” kila mtu.
  rationale: Chanzo kinasema wazi kuhusu malipo yanayolingana na matendo. Tafsiri haipaswi kupunguza wala kuoanisha kimyakimya mvutano huu na mafundisho mengine ya Paulo kuhusu kuhesabiwa haki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, kifupi na chenye hadhi. “Atamlipa” ni cha kawaida lakini kina uzito wa kimahakama katika muktadha; “matendo yake” ni cha asili na hakihitaji tanbihi ya jinsia kwa sababu Kiswahili hakitumii kiwakilishi cha umoja chenye jinsia hapa.
