  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: τοῖς δὲ ἐξ ἐριθείας καὶ ⸀ἀπειθοῦσι τῇ ἀληθείᾳ πειθομένοις δὲ τῇ ἀδικίᾳ ⸂ὀργὴ καὶ θυμός⸃,
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/008.yaml
  text: 'But for those who are self-seeking and disobey the truth[b][a], but obey unrighteousness: wrath and fury.'
translation:
  language: sw
  text: 'Lakini kwa wale wanaosukumwa na tamaa ya kujinufaisha, wasioitii kweli bali wanaoutii udhalimu: ghadhabu na hasira kali.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξ ἐριθείας
  choice: wanaosukumwa na tamaa ya kujinufaisha
  rationale: Kirai kinaonyesha chanzo au msukumo wa matendo. Tafsiri hii inaweka wazi nia ya ubinafsi bila kuibana kuwa ushindani wa kisiasa pekee.
- source_word: ἀπειθοῦσι τῇ ἀληθείᾳ
  choice: wasioitii kweli
  rationale: Kitenzi ἀπειθέω hapa kina nguvu ya kutotii, si kutokuamini tu; muundo huu ni wa kawaida na wazi katika Kiswahili.
- source_word: πειθομένοις δὲ τῇ ἀδικίᾳ
  choice: bali wanaoutii uovu
  rationale: Tafsiri inadumisha ulinganifu na 'wasioitii kweli' na kuonyesha utii unaoelekezwa upande ulio kinyume.
- source_word: ἀδικίᾳ
  choice: uovu
  rationale: Katika muktadha huu neno linamaanisha hali ya kutokuwa sawa mbele za Mungu na kutenda yaliyo mabaya. 'Uovu' ni neno la kawaida, pana, na lenye uzito wa kimaadili; 'udhalimu' lingeweza kueleweka kwa maana finyu zaidi ya ukandamizaji au ukosefu wa haki kwa wengine.
- source_word: ὀργὴ
  choice: ghadhabu
  rationale: Neno hili linahifadhi uzito wa hukumu kuliko 'hasira' ya kawaida.
- source_word: θυμός
  choice: hasira kali
  rationale: Likisimama pamoja na ὀργή, neno hili linaongeza ukali wa usemi; 'hasira kali' ni ya asili na inaeleweka kwa urahisi.
- source_word: implicit verbal ellipsis
  choice: alama ya nukta mbili baada ya 'uovu'
  rationale: Kigiriki hakina kitenzi wazi katika sehemu ya mwisho. Nukta mbili zinahifadhi ufupi huo bila kuongeza 'itawapata' au 'kutakuwa na'.
theological_decisions:
- issue: Maana ya ἀδικία katika muktadha wa hukumu ya Mungu
  choice: uovu
  alternative: udhalimu; kutokuwa na haki
  rationale: '''Uovu'' inahifadhi upana wa upinzani wa kimaadili dhidi ya kweli katika muktadha huu. ''Udhalimu'' au ''kutokuwa na haki'' zinaweza kusisitiza zaidi dhuluma kwa wengine na hivyo kuifanya maana kuwa finyu.'
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Ulinganifu wa 'wasioitii kweli' na 'wanaoutii uovu' umehifadhiwa, pamoja na usemi mfupi usio na kitenzi mwishoni.
