base_translation:
  language: en
  yaml_path: translation/nt/romans/002/002.yaml
  text: And we know that the judgment of God is according to truth against those who practice such things[a].
translation:
  language: sw
  text: Na tunajua kwamba hukumu ya Mungu ni kulingana na ukweli dhidi ya wale wanaotenda mambo kama hayo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa kadiri ya ukweli”; yaani, hukumu ya Mungu inapatana na yaliyo kweli.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴδαμεν
  choice: tunajua
  rationale: Maumbo ya οἶδα yana maana ya wakati wa sasa hapa; “tunajua” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: δέ
  choice: Nasi
  rationale: δέ inaendeleza hoja kuliko kuonyesha upinzani mkali; “Nasi” inaunganisha sentensi hii kwa kawaida na muktadha uliotangulia.
- source_word: κρίμα
  choice: hukumu
  rationale: Neno hili linamaanisha tendo au uamuzi wa Mungu kama hakimu; “hukumu” huhifadhi upana huo bila kulifanya limaanishe tu adhabu.
- source_word: κατὰ ἀλήθειαν
  choice: kulingana na kweli
  rationale: Usemi huu unaonyesha kwamba hukumu ya Mungu inapatana na yaliyo kweli au uhalisi; tafsiri hii huhifadhi vipengele vya usemi wa Kigiriki na uzito wake wa kimaadili na kimahakama.
- source_word: ἐπὶ
  choice: juu ya
  rationale: Katika muktadha wa hukumu inayowafikia watu, “juu ya” ni usemi wa asili wa Kiswahili na huhifadhi mwelekeo wa kihusishi bila kuongeza tafsiri kuliko ilivyo lazima.
- source_word: τὰ τοιαῦτα
  choice: mambo kama hayo
  rationale: Hii ni tafsiri ya kawaida ya Kiswahili inayorejelea matendo ya aina iliyotajwa katika muktadha uliotangulia.
- source_word: πράσσοντας
  choice: wanaotenda
  rationale: Kitenzi hiki kinaeleza mwenendo unaoendelea au wa kawaida; “wanaotenda” ni cha asili na kinaweza kubeba maana hiyo katika muktadha.
theological_decisions:
- issue: Iwapo κατὰ ἀλήθειαν itafsiriwe kwa ufafanuzi zaidi kama “kwa haki” au kwa uwazi zaidi kama “kulingana na kweli.”
  choice: kulingana na kweli
  alternative: kwa haki
  rationale: “Kulingana na kweli” huhifadhi dai la Paulo kwamba hukumu ya Mungu inapatana na ukweli au uhalisi, badala ya kulifupisha kuwa tathmini ya jumla kwamba Mungu huhukumu kwa haki.
- issue: Iwapo κρίμα ifinywe kuwa “adhabu” au ibaki na maana pana ya kimahakama.
  choice: hukumu
  alternative: adhabu
  rationale: Kigiriki hakilazimishi hapa maana ya matokeo ya kuhukumiwa pekee; “hukumu” huhifadhi upana na mvutano wa kifungu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wa heshima na unaoeleweka kwa wasomaji wa kawaida. Usemi “kulingana na kweli” umehifadhiwa kwa uwazi wa kiteolojia; tanbihi inatoa namna nyingine ya kawaida ya kuueleza.
