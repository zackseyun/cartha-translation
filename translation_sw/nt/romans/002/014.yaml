  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὅταν γὰρ ἔθνη τὰ μὴ νόμον ἔχοντα φύσει τὰ τοῦ νόμου ⸀ποιῶσιν, οὗτοι νόμον μὴ ἔχοντες ἑαυτοῖς εἰσιν νόμος·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/014.yaml
  text: For whenever Gentiles[a], who do not have the law, do by nature the things of the law, these, though not having the law[c][b], are a law to themselves.
translation:
  language: sw
  text: Kwa maana, watu wa mataifa[a] wasio na sheria wanapofanya kwa asili[b] mambo ya sheria[c], hao, ingawa hawana sheria, ni sheria kwao wenyewe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mataifa.”
    reason: lexical_alternative
  - marker: b
    text: Au “kwa silika.”
    reason: lexical_alternative
  - marker: c
    text: Yaani, “yale ambayo sheria inadai.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθνη
  choice: watu wa mataifa
  rationale: Katika hoja ya Paulo hapa, neno hili linawatofautisha wasio Wayahudi na Wayahudi walio na Sheria ya Musa. “Watu wa mataifa” ni Kiswahili cha kawaida kinachobeba maana hiyo bila kupoteza uwezekano wa maana pana ya “mataifa.”
- source_word: νόμον / νόμου / νόμος
  choice: sheria
  rationale: 'Neno lilelile limetumiwa kila mahali ili kuhifadhi mwendelezo na mchezo wa maneno wa Paulo: hawana sheria, wanafanya mambo ya sheria, nao ni sheria kwao wenyewe. Herufi ndogo pia huepuka kuingiza ufafanuzi usiokuwamo wazi katika muundo wa Kigiriki, ingawa muktadha unaelekea kwenye Sheria ya Musa.'
- source_word: φύσει
  choice: kwa asili
  rationale: Hii ndiyo tafsiri ya moja kwa moja inayohifadhi uwazi wa kimakusudi kuhusu kama Paulo anamaanisha hali ya kiasili, ufahamu wa ndani, au kutenda kwa kawaida.
- source_word: τὰ τοῦ νόμου ποιῶσιν
  choice: wanafanya mambo ya sheria
  rationale: Muundo huu unaakisi usemi wa Kigiriki na kuhifadhi upana wake. Maelezo laini zaidi, “wanafanya yale ambayo sheria inadai,” yametolewa katika tanbihi.
- source_word: ἑαυτοῖς εἰσιν νόμος
  choice: ni sheria kwao wenyewe
  rationale: Huhifadhi sitiari na mwangwi wa neno “sheria” bila kudokeza kwa nguvu zaidi kwamba wanajitungia sheria wenyewe.
theological_decisions:
- issue: Maana ya φύσει kuhusiana na maarifa ya maadili na dhamiri
  choice: Kuhifadhi usemi mpana “kwa asili” bila kuufafanua zaidi katika matini kuu.
  alternative: “kwa silika” au “kwa ufahamu wao wa kiasili”
  rationale: Neno φύσει pekee halilazimishi hitimisho moja kuhusu chanzo au namna ya ufahamu huo. Tafsiri pana huhifadhi mvutano wa hoja ya Paulo.
- issue: Utambulisho wa νόμος katika mstari huu
  choice: Kutumia “sheria” kwa uthabiti bila kuongeza “ya Musa” katika matini kuu.
  alternative: “Sheria ya Musa” katika marejeo ya kwanza
  rationale: Muktadha unaashiria Sheria ya Musa, lakini kuongeza jina hilo kungeeleza zaidi ya maneno yenyewe na kungevuruga urudiaji wa νόμος katika kishazi cha mwisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Mpangilio umewekwa wa asili na unaosomeka, huku urudiaji wa “sheria” na utata halisi wa “kwa asili” vikihifadhiwa.
