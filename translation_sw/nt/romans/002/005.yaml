id: ROM.2.5
reference: Romans 2:5
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: κατὰ δὲ τὴν σκληρότητά σου καὶ ἀμετανόητον καρδίαν θησαυρίζεις σεαυτῷ ὀργὴν ἐν ἡμέρᾳ ὀργῆς καὶ ⸀ἀποκαλύψεως δικαιοκρισίας τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/005.yaml
  text: But because of your hardness and unrepentant heart, you are storing up wrath for yourself on the day of wrath and the revelation of God’s righteous judgment,
translation:
  language: sw
  text: Lakini kwa sababu ya ugumu wako na moyo wako usiotubu, unajilimbikizia ghadhabu kwa siku ya ghadhabu na ya kufunuliwa kwa hukumu ya haki ya Mungu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “hukumu ya Mungu yenye uadilifu.”'
    reason: Mbadala huu unaonyesha maana ya δικαιοκρισία kwa kutumia “uadilifu” badala ya kirai “ya haki.”
lexical_decisions:
- source_word: κατὰ δὲ
  choice: Lakini kwa sababu ya
  rationale: “Lakini” huhifadhi nguvu ndogo ya upinzani ya δέ, na “kwa sababu ya” huwasilisha kwa Kiswahili cha kawaida uhusiano wa kisababishi unaoonyeshwa na κατά pamoja na hali ya msikilizaji.
- source_word: σκληρότης
  choice: ugumu
  rationale: Neno hili linahifadhi sitiari ya kutokuwa mwepesi kuitikia kiadili; “ukaidi” lingeeleza maana lakini lingeondoa sitiari ya asili.
- source_word: ἀμετανόητον καρδίαν
  choice: moyo wako usiotubu
  rationale: Tafsiri hii inadumisha lugha ya “moyo” na kueleza kutokuwapo kwa toba kwa lugha ya sasa na inayoeleweka.
- source_word: θησαυρίζεις σεαυτῷ
  choice: unajilimbikizia
  rationale: Kitenzi hiki kinaonyesha tendo linaloendelea la kujikusanyia kitu kwa matokeo yatakayompata mhusika mwenyewe, bila kuipa ghadhabu maana chanya ya hazina.
- source_word: ὀργή
  choice: ghadhabu
  rationale: “Ghadhabu” inafaa uzito wa hasira ya Mungu katika muktadha wa hukumu kuliko “hasira” ya kawaida.
- source_word: ἐν ἡμέρᾳ ὀργῆς καὶ ἀποκαλύψεως
  choice: kwa siku ya ghadhabu na ya kufunuliwa
  rationale: “Kwa siku” ni Kiswahili cha kawaida kinachoonyesha kwamba ghadhabu hiyo inakusanywa kwa ajili ya siku hiyo. Muundo wa nomino mbili zilizoratibiwa—ghadhabu na kufunuliwa—umehifadhiwa.
- source_word: δικαιοκρισίας τοῦ θεοῦ
  choice: hukumu ya Mungu iliyo ya haki
  rationale: Tafsiri hii inaonyesha wazi kwamba ni hukumu ya Mungu na kwamba hukumu hiyo ni ya haki, ikihifadhi maana ya neno ambatano δικαιοκρισία.
theological_decisions:
- issue: Iwapo kifungu cha mwisho kigeuzwe kuwa sentensi ya kufafanua wakati, kama “wakati Mungu atakapofunua hukumu yake ya haki.”
  choice: 'Kuhifadhi muundo wa majina: “siku ya ghadhabu na ya kufunuliwa kwa hukumu ya Mungu iliyo ya haki.”'
  alternative: “siku ya ghadhabu, wakati Mungu atakapofunua hukumu yake ya haki.”
  rationale: Kigiriki kina majina yaliyoratibiwa, si kitenzi cha wazi kinachosema Mungu ndiye anayefunua. Muundo wa majina unahifadhi kwa karibu zaidi namna chanzo kilivyo na haumalizi kimya kimya utata huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. “Ghadhabu” na “moyo usiotubu” zinadumisha uzito na taswira za kifungu bila kuingiza msamiati wa dhehebu fulani.
