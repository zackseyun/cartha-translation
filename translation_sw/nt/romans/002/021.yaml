  text: ὁ οὖν διδάσκων ἕτερον σεαυτὸν οὐ διδάσκεις; ὁ κηρύσσων μὴ κλέπτειν κλέπτεις;
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/021.yaml
  text: You, therefore, who teach another, do you not teach yourself? You who proclaim, “Do not steal,” do you steal?
translation:
  language: sw
  text: Basi, wewe unayemfundisha mtu mwingine, je, hujifundishi mwenyewe? Wewe unayehubiri, “Usiibe,” je, unaiba?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: Basi
  rationale: Inaonyesha hitimisho au mwendelezo wa kimantiki kutoka hoja iliyotangulia kwa njia ya kawaida na yenye uzito katika Kiswahili.
- source_word: διδάσκων
  choice: unayemfundisha
  rationale: Kirai rejeshi kinatafsiri kiambishi cha hali kinachotumiwa kama nomino, huku kikihifadhi tendo la kumfundisha mwingine.
- source_word: ἕτερον
  choice: mtu mwingine
  rationale: Kinahifadhi umoja wa neno la Kigiriki na kutoa maana wazi na ya kawaida kuliko ‘mwingine’ peke yake.
- source_word: σεαυτὸν
  choice: mwenyewe
  rationale: Pamoja na kitenzi ‘hujifundishi,’ kinahifadhi msisitizo wa kujirejelea na tofauti kali kati ya mwingine na nafsi ya msemaji.
- source_word: οὐ διδάσκεις;
  choice: je, hujifundishi mwenyewe?
  rationale: Kinadumisha umbo la swali la kukemea na kejeli ya hoja bila kuligeuza kuwa kauli ya moja kwa moja.
- source_word: κηρύσσων
  choice: unayehubiri
  rationale: ‘Kuhubiri’ hapa huwasilisha tangazo la wazi la maadili; ni neno la kawaida la Kiswahili na halihitaji kuongeza mahali au hadhira isiyotajwa.
- source_word: μὴ κλέπτειν
  choice: “Usiibe,”
  rationale: Amri ya moja kwa moja ni ya asili katika Kiswahili na inawasilisha kwa uwazi maudhui ya tangazo.
- source_word: κλέπτεις;
  choice: je, unaiba?
  rationale: Swali rahisi la wakati wa sasa linahifadhi ukali wa moja kwa moja wa swali la Paulo.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo sambamba wa maswali mawili umehifadhiwa ili kudumisha nguvu ya balagha. ‘Wewe’ imetumiwa kwa msisitizo unaolingana na kiwakilishi kilichodokezwa na miundo ya Kigiriki.
