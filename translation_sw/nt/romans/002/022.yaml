translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa maswali mawili ya balagha na usemi wa moja kwa moja umehifadhiwa. “Mahekaluni” linaonyesha mahali panapoibiwa, huku tanbihi ikihifadhi uwezekano wa maana pana wa ἱεροσυλεῖς.
