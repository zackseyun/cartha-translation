base_translation:
  language: en
  yaml_path: translation/nt/romans/002/022.yaml
  text: You who say[a], “Do not commit adultery,” do you commit adultery? You who detest idols, do you rob temples?
translation:
  language: sw
  text: Wewe unayesema, “Usizini,” je, unazini? Wewe unayechukia sanamu, je, unayapora mahekalu?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa maana pana zaidi, “je, unatenda kosa dhidi ya vitu vitakatifu?”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λέγων
  choice: Wewe unayesema
  rationale: Kirai chenye kibainishi na kitenzi-ushiriki kinamtaja mtu wa mfano kwa usemi wa moja kwa moja. “Wewe unayesema” ni Kiswahili cha kawaida kinachohifadhi nguvu ya usemi huo.
- source_word: μὴ μοιχεύειν
  choice: Usizini
  rationale: μή pamoja na kitenzi-jina huonyesha yaliyomo katika katazo. “Usizini” ni katazo la moja kwa moja na la kawaida kwa uzinzi.
- source_word: μοιχεύεις
  choice: je, unazini?
  rationale: Kitenzi cha wakati wa sasa kinatumika katika swali la balagha lenye shtaka la jumla. “Unazini?” huhifadhi hali hiyo kwa Kiswahili cha asili.
- source_word: ὁ βδελυσσόμενος
  choice: Wewe unayechukia
  rationale: βδελύσσομαι huonyesha chuki kali au kinyaa. “Unayechukia” ni ya sasa, wazi na yenye hadhi; katika muktadha huu inaonyesha kukataa kabisa sanamu.
- source_word: τὰ εἴδωλα
  choice: sanamu
  rationale: Katika muktadha wa ibada, εἴδωλα ni sanamu zinazoabudiwa. “Sanamu” ndilo neno la kawaida la Kiswahili; muktadha huonyesha kuwa ni sanamu za ibada.
- source_word: ἱεροσυλεῖς
  choice: je, unaiba mahekaluni?
  rationale: ἱεροσυλέω kwa maana yake mahsusi hurejelea kuiba hekalu au mali ya hekalu. Tafsiri hii huhifadhi picha halisi na kejeli inayohusiana na sanamu; maana pana imewekwa katika tanbihi.
