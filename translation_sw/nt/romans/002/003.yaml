id: ROM.2.3
reference: Romans 2:3
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: λογίζῃ δὲ τοῦτο, ὦ ἄνθρωπε ὁ κρίνων τοὺς τὰ τοιαῦτα πράσσοντας καὶ ποιῶν αὐτά, ὅτι σὺ ἐκφεύξῃ τὸ κρίμα τοῦ θεοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/003.yaml
  text: But do you suppose this[a], O man—you who judge those who practice such things and yet do them yourself—that you will escape the judgment of God?
translation:
  language: sw
  text: Lakini je, wewe unadhani hivi, ee mwanadamu[a]—wewe unayewahukumu wale wanaotenda mambo kama hayo, huku wewe mwenyewe ukiyatenda—kwamba utaiepuka hukumu ya Mungu?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ee mtu.” Katika Kigiriki ni umoja wa kiume, ukimwita mtu mmoja kama mwakilishi wa wanadamu kwa jumla.
    reason: cultural_note
lexical_decisions:
- source_word: λογίζῃ
  choice: unadhani
  rationale: Kitenzi hiki kinaonyesha kufikiri au kukadiria akilini. “Unadhani” ni Kiswahili cha kawaida na kinadumisha nguvu ya swali la balagha linalopinga dhana ya mhusika.
- source_word: ἄνθρωπε
  choice: ee mwanadamu
  rationale: Umoja wa vocative unamwelekea mtu mmoja anayewakilisha wanadamu kwa jumla. “Ee mwanadamu” ni lugha yenye hadhi na inadumisha mtindo wa Paulo wa kumsemesha mhusika moja kwa moja bila kuibana maana kwa jinsia moja.
- source_word: κρίνων
  choice: unayewahukumu
  rationale: “Kuhukumu” ndiyo tafsiri ya moja kwa moja katika muktadha wa kutoa hukumu ya kimaadili; “kuwalaumu” au “kuwahukumia adhabu” kungeongeza maana isiyolazimishwa na neno lenyewe.
- source_word: πράσσοντας
  choice: wanaotenda
  rationale: “Kutenda” huonyesha mwenendo wa kufanya mambo hayo na ni ya kawaida katika Kiswahili. Muktadha, badala ya kitenzi pekee, unaonyesha kuwa si tendo la mara moja tu.
- source_word: ποιῶν
  choice: ukiyatenda
  rationale: Kurudia “kutenda” ni kwa kawaida zaidi katika Kiswahili kuliko kulazimisha tofauti ndogo ya maneno kati ya πράσσω na ποιέω. Kiambishi “-ya-” kinarejelea wazi mambo yaliyotajwa.
- source_word: αὐτά
  choice: mambo kama hayo
  rationale: Kirejeshi kinarejelea “mambo kama hayo.” Katika kishazi cha pili kimewakilishwa na kiambishi cha yambwa katika “ukiyatenda,” huku “wewe mwenyewe” kikionyesha mkazo wa muktadha.
- source_word: ἐκφεύξῃ
  choice: utaiepuka
  rationale: “Kuiepuka” huwasilisha kwa usahihi wazo la kutopatikana na hukumu inayokuja na ni ya asili katika Kiswahili.
- source_word: κρίμα
  choice: hukumu
  rationale: Katika muktadha huu neno linahusu tendo au uamuzi wa Mungu wa kuhukumu kwa maana pana. “Hukumu” huhifadhi upana huo kuliko “adhabu” au “tamko la hatia.”
theological_decisions:
- issue: Nguvu ya κρίμα τοῦ θεοῦ
  choice: hukumu ya Mungu
  alternative: adhabu ya Mungu
  rationale: “Hukumu” huhifadhi maana ya kimahakama bila kuamua mapema kwamba neno linamaanisha adhabu pekee; hivyo mvutano kati ya tendo la kuhukumu, uamuzi, na matokeo yake unabaki wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa swali la balagha na usemi wa moja kwa moja umehifadhiwa. Mistari mirefu imetenganishwa kwa vistari virefu ili shtaka kuu lisomeke wazi.
