lexical_decisions:
- source_word: πέποιθάς
  choice: una hakika
  rationale: Kauli ya hali timilifu inaonyesha uhakika uliokita; “una hakika” ni Kiswahili cha kawaida kinachoendeleza sauti ya mtu kujitumainia.
- source_word: τε
  choice: nawe
  rationale: Kiunganishi hiki kinaendeleza orodha kutoka mstari uliotangulia; “nawe” huunganisha sentensi huku kikidumisha rejeo kwa mhusika wa nafsi ya pili.
- source_word: σεαυτὸν
  choice: wewe mwenyewe
  rationale: Usemi huu unahifadhi msisitizo wa kiwakilishi jirejeshi na hali ya mtu kujiona kuwa na sifa hiyo.
- source_word: ὁδηγὸν
  choice: kiongozi
  rationale: Katika sitiari hii, “kiongozi” humaanisha mtu anayewaongoza wengine njia na ni neno la asili katika Kiswahili.
- source_word: τυφλῶν
  choice: wa vipofu
  rationale: Muundo “kiongozi wa vipofu” unaonyesha kwa kawaida wale wanaoongozwa bila kuongeza maana isiyokuwamo katika Kigiriki.
- source_word: φῶς
  choice: nuru
  rationale: “Nuru” huhifadhi sitiari ya mwanga unaotoa mwongozo au ufahamu na ina hadhi inayofaa maandiko.
- source_word: τῶν ἐν σκότει
  choice: kwa walio gizani
  rationale: Usemi huu unawataja watu walio katika giza na kudumisha sitiari bila kuifafanua kupita kiasi.
