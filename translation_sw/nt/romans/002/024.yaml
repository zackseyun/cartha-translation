  text: For the name of God is blasphemed among the Gentiles because of you[b][a], just as it is written.
translation:
  language: sw
  text: Kwa maana jina la Mungu linatukanwa miongoni mwa Mataifa kwa sababu yenu, kama ilivyoandikwa.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “miongoni mwa mataifa.”'
    reason: lexical_alternative
  - marker: b
    text: Paulo anarejelea Maandiko, hasa Isaya 52:5, pamoja na wazo linalopatikana pia katika Ezekieli 36:20–23.
    reason: cross_reference
lexical_decisions:
- source_word: γὰρ
  choice: Kwa maana
  rationale: Inaonyesha kwamba kauli hii inatoa msingi wa maonyo yaliyotangulia, kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: τὸ ὄνομα τοῦ θεοῦ
  choice: Jina la Mungu
  rationale: Inafuata muundo wa Kigiriki moja kwa moja bila kufafanua ‘jina’ kuwa sifa au heshima pekee.
- source_word: δι’ ὑμᾶς
  choice: kwa sababu yenu
  rationale: διά pamoja na hali ya accusative hapa inaonyesha sababu; tafsiri hii inawasilisha shtaka la Paulo kwa uwazi.
- source_word: βλασφημεῖται
  choice: linakufuriwa
  rationale: Kitenzi hiki kinahifadhi uzito wa kusema kwa dharau au kukosa heshima kuhusu Mungu, na pia hali tendwa ya Kigiriki.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: miongoni mwa watu wa mataifa
  rationale: Katika muktadha wa Paulo, kifungu hiki kinawarejelea watu wasio Wayahudi; ‘watu wa mataifa’ ni wazi na hakikifungi neno hilo kwa mataifa ya kisiasa tu.
- source_word: καθὼς γέγραπται
  choice: kama ilivyoandikwa
  rationale: Ni fomula ya kawaida ya kutambulisha Maandiko; Kiswahili hiki ni cha asili na kinadumisha maana ya καθώς.
