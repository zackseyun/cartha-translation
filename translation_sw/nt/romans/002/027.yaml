  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ κρινεῖ ἡ ἐκ φύσεως ἀκροβυστία τὸν νόμον τελοῦσα σὲ τὸν διὰ γράμματος καὶ περιτομῆς παραβάτην νόμου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/027.yaml
  text: And the uncircumcised person by nature[a], if he fulfills the law, will judge you who, with the letter and circumcision[b], are a transgressor of the law.
translation:
  language: sw
  text: Na yule ambaye hajatahiriwa kwa asili[a], akiitimiza sheria, atakuhukumu wewe ambaye, ukiwa na sheria iliyoandikwa na tohara[b], ni mvunjaji wa sheria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “kutotahiriwa”; yaani, mtu ambaye hajatahiriwa.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “kupitia herufi na tohara.” “Herufi” hapa inaweza kumaanisha sheria katika hali yake ya maandishi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκροβυστία
  choice: mtu ambaye hajatahiriwa
  rationale: Nomino hiyo kihalisi ni hali ya kutotahiriwa, lakini hapa imetumiwa kumaanisha mtu asiyetahiriwa. Tafsiri hii inaweka wazi rejeleo la mtu bila kuongeza utambulisho mpana wa kikabila kama ‘Mataifa.’
- source_word: ἐκ φύσεως
  choice: kwa asili
  rationale: Huhifadhi utofauti kati ya kutotahiriwa kwa hali ya asili na kuwa na tohara, bila kulazimisha maana finyu ya ‘tangu kuzaliwa.’
- source_word: τελοῦσα
  choice: akiitimiza
  rationale: Kishirikishi kinaeleza kutekeleza sheria kwa vitendo na katika muktadha kinaweza kuwa na nguvu ya kimasharti; ‘akiitimiza’ huhifadhi uwezekano huo kwa Kiswahili cha kawaida.
- source_word: νόμον
  choice: sheria
  rationale: Katika muktadha ni sheria ya Musa inayojulikana; Kiswahili hakihitaji kibainishi tofauti ili kuonyesha umaalumu huo.
- source_word: διὰ γράμματος
  choice: una sheria iliyoandikwa
  rationale: γράμμα hapa inaelekea kwenye sheria katika hali yake ya maandishi. Muundo huu ni wa asili katika Kiswahili na huonyesha kile alicho nacho mhusika, huku tanbihi ikihifadhi tafsiri iliyo karibu zaidi na ‘herufi.’
- source_word: περιτομῆς
  choice: tohara
  rationale: ‘Tohara’ ni neno la kawaida, lenye heshima, kwa ishara ya agano ya kutahiriwa.
- source_word: παραβάτην νόμου
  choice: unaivunja sheria
  rationale: Hutoa kwa Kiswahili cha kawaida maana ya mtu anayekiuka sheria huku ikidumisha kutajwa kwa sheria waziwazi.
theological_decisions:
- issue: Iwapo ἀκροβυστία itafsiriwe waziwazi kwa utambulisho wa kikabila kama ‘Mtu wa Mataifa’
  choice: mtu ambaye hajatahiriwa
  alternative: Mtu wa Mataifa
  rationale: Hoja inawahusu Wayahudi na watu wa Mataifa, lakini neno la Kigiriki lenyewe linatofautisha tohara na kutotahiriwa. Tafsiri haiongezi utambulisho wa kikabila usiotajwa moja kwa moja.
- issue: Uhusiano wa διὰ γράμματος καὶ περιτομῆς na kuvunja sheria
  choice: ijapokuwa una sheria iliyoandikwa na tohara
  alternative: kwa njia ya herufi na tohara
  rationale: 'διὰ pamoja na hali ya kimilikishi hapa inaweza kueleza mazingira au vifaa alivyo navyo mwenye kuvunja sheria, na muktadha unaonyesha tofauti ya kimkinzano: anayo maandishi na tohara, lakini bado anaivunja sheria. ‘Ijapokuwa’ huweka wazi mkazo huo bila kudai kuwa maandishi na tohara ndivyo vinavyosababisha uvunjaji.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imepangwa kwa mtiririko wa kawaida wa Kiswahili. ‘Mataifa’ haijaingizwa, ili kutohamisha mkazo wa Paulo kutoka tohara/kutotahiriwa kwenda utambulisho wa kikabila ulio wazi zaidi kuliko maandishi.
