base_translation:
  language: en
  yaml_path: translation/nt/romans/002/012.yaml
  text: For all who sinned apart from the law will also perish apart from the law[c][b][a], and all who sinned under the law will be judged through the law.
translation:
  language: sw
  text: Kwa maana wote waliotenda dhambi pasipo sheria[a] wataangamia pia pasipo sheria; na wote waliotenda dhambi chini ya sheria[b] watahukumiwa kwa njia ya sheria.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “bila sheria”; neno la Kigiriki linaweza pia kumaanisha “kinyume cha sheria.” Vivyo hivyo katika sehemu ya pili ya kishazi hiki.
    reason: lexical_alternative
  - marker: b
    text: 'Kwa tafsiri ya karibu zaidi na muundo wa Kigiriki: “katika sheria,” yaani, ndani ya eneo la mamlaka ya sheria.'
    reason: lexical_alternative
  - marker: c
    text: Au, “kwa sheria.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνόμως
  choice: pasipo sheria
  rationale: Huwasilisha hali ya kuwa bila Sheria ya Musa na kudumisha utofauti na walio chini ya sheria, badala ya kueleza tu mwenendo wa uasi.
- source_word: ἥμαρτον
  choice: waliotenda dhambi
  rationale: Ni Kiswahili cha kawaida na wazi kwa aoristi, bila kuongeza maelezo kuhusu namna au muda wa tendo.
- source_word: ἀπολοῦνται
  choice: wataangamia
  rationale: Hudumisha wazo la mwisho wa hukumu bila kuamua ikiwa neno hilo linamaanisha kuangamizwa kabisa au namna nyingine ya adhabu ya mwisho.
- source_word: ἐν νόμῳ
  choice: chini ya sheria
  rationale: Hueleza kuwa ndani ya mamlaka au eneo la utawala wa sheria, badala ya tafsiri ngumu ya moja kwa moja 'katika sheria.'
- source_word: διὰ νόμου
  choice: kwa njia ya sheria
  rationale: Hudumisha tofauti na ἐν νόμῳ na kuonyesha sheria kuwa njia au msingi unaohusika katika hukumu.
- source_word: κριθήσονται
  choice: watahukumiwa
  rationale: Katika Kiswahili, kitenzi hiki kinaweza kumaanisha kupimwa katika hukumu; hakibadilishwi kuwa 'wataadhibiwa' au 'watalaaniwa,' jambo ambalo lingeongeza hitimisho.
- source_word: Ὅσοι ... καὶ ὅσοι
  choice: wote ... na wote
  rationale: Hudumisha nguvu ya ujumla na ulinganifu wa vifungu viwili.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Huonyesha kwamba mstari huu unatoa msingi wa hoja iliyotangulia.
theological_decisions:
- issue: Rejeo la νόμος
  choice: sheria, ikieleweka hasa kuwa Sheria ya Musa
  alternative: sheria ya maadili kwa maana ya jumla
  rationale: Muktadha wa Waroma 2 unatofautisha watu wa mataifa wasio na Sheria ya Musa na Wayahudi walio chini ya mamlaka yake. Maandishi makuu hayajaongeza neno 'Musa,' ili yasifunge zaidi ya anavyosema Paulo.
- issue: Maana ya ἀπολοῦνται katika hukumu ya mwisho
  choice: wataangamia
  alternative: wataharibiwa kabisa; watahukumiwa; wataadhibiwa milele
  rationale: Neno hili linataja matokeo mazito lakini mstari wenyewe haufafanui hali au utaratibu wake; tafsiri haikatai wala kuthibitisha mfumo maalumu wa mafundisho.
- issue: Nguvu ya κριθήσονται
  choice: watahukumiwa, kwa maana ya kufanyiwa hukumu
  alternative: watalaaniwa
  rationale: κρίνω hapa ni lugha ya kimahakama. Kutafsiri moja kwa moja kuwa kulaaniwa kungetatua mapema swali ambalo neno lenyewe halisemi wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Ulinganifu wa sentensi ya Kigiriki umehifadhiwa. 'Pasipo sheria' na 'chini ya sheria' ni miundo ya kawaida inayoonyesha tofauti ya kimahusiano; 'kwa njia ya sheria' hudumisha tofauti ya kihusishi cha διά.
