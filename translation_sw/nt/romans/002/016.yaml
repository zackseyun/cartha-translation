  text: ἐν ⸂ἡμέρᾳ ὅτε⸃ ⸀κρίνει ὁ θεὸς τὰ κρυπτὰ τῶν ἀνθρώπων κατὰ τὸ εὐαγγέλιόν μου διὰ ⸂Χριστοῦ Ἰησοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/016.yaml
  text: on the day when God judges the secrets of people through Messiah Jesus[a], according to my gospel.
translation:
  language: sw
  text: siku ile Mungu atakapohukumu mambo ya siri ya wanadamu kwa njia ya Masihi Yesu[a], kulingana na injili yangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “Kristo Yesu.”'
    reason: Tafsiri mbadala ya Χριστοῦ Ἰησοῦ kwa kutumia umbo la jadi la cheo hicho.
lexical_decisions:
- source_word: ἐν ἡμέρᾳ ὅτε
  choice: siku ile ... atakapohukumu
  rationale: Muundo huu wa Kiswahili unaonyesha kwa kawaida siku maalumu ya hukumu na tendo la wakati ujao bila kupoteza uhusiano wa wakati uliomo katika Kigiriki.
- source_word: κρίνει
  choice: atakapohukumu
  rationale: Ingawa Kigiriki kina kitenzi cha wakati wa sasa, muktadha unaelekea kwenye hukumu ya wakati ujao; Kiswahili hutumia kwa kawaida muundo wa -taka- katika kishazi hiki cha wakati.
- source_word: τὰ κρυπτὰ
  choice: mambo ya siri
  rationale: Neno hili linaeleza mambo yaliyofichika au yasiyojulikana kwa wengine; 'mambo ya siri' ni wazi na ya kawaida katika Kiswahili cha sasa.
- source_word: τῶν ἀνθρώπων
  choice: ya wanadamu
  rationale: Neno la Kigiriki linawahusu watu wote, si wanaume pekee; 'wanadamu' linahifadhi maana hiyo ya jumla kwa register yenye staha.
- source_word: κατὰ τὸ εὐαγγέλιόν μου
  choice: kulingana na injili yangu
  rationale: Tafsiri hii inadumisha kihusishi κατὰ na kiwakilishi milikishi cha Paulo kwa lugha ya kawaida na sahihi.
- source_word: διὰ Χριστοῦ Ἰησοῦ
  choice: kwa njia ya Masihi Yesu
  rationale: διά pamoja na jenitivi huonyesha njia au uwakala; 'kwa njia ya' linaakisi hilo, huku 'Masihi' likihifadhi nguvu ya Χριστός kama cheo.
theological_decisions:
- issue: Kutafsiri Χριστοῦ kama cheo au kama umbo lililo karibu na jina
  choice: Masihi Yesu
  alternative: Kristo Yesu
  rationale: Katika muktadha huu Χριστός inaweza kusikika kama cheo; 'Masihi' linaweka wazi maana hiyo. Umbo la jadi 'Kristo Yesu' limehifadhiwa katika tanbihi bila kufuta uwezekano huo wa uelewa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye staha na inayoeleweka kwa urahisi. Mpangilio wa kishazi unafuata mtiririko wa Kigiriki kwa kadiri inayobaki ya asili katika Kiswahili.
