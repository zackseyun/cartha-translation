  text: θλῖψις καὶ στενοχωρία, ἐπὶ πᾶσαν ψυχὴν ἀνθρώπου τοῦ κατεργαζομένου τὸ κακόν, Ἰουδαίου τε πρῶτον καὶ Ἕλληνος·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/009.yaml
  text: There will be affliction and distress upon every human soul that does evil[b][a], to the Jew first and also to the Greek.
translation:
  language: sw
  text: Dhiki na taabu zitampata kila mtu atendaye uovu—kwa Myahudi kwanza, na pia kwa Mgiriki.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mtu wa Mataifa”; katika utofautishaji huu wa Myahudi na Mgiriki, “Mgiriki” inaweza kumrejelea asiye Myahudi.
    reason: lexical_alternative
lexical_decisions:
- source_word: θλῖψις
  choice: dhiki
  rationale: Neno hili linaonyesha mateso au hali ngumu sana, na linaungana kwa kawaida na “taabu” bila kufuta tofauti ya maneno hayo mawili.
- source_word: στενοχωρία
  choice: taabu
  rationale: Linawasilisha hali ya kusongwa na huzuni au shida; katika Kiswahili cha kawaida “dhiki na taabu” ni jozi ya maneno yenye uzito na mtiririko wa asili.
- source_word: ἐπὶ πᾶσαν ψυχὴν ἀνθρώπου
  choice: zitampata kila mtu
  rationale: Ingawa muundo wa Kigiriki unasema kihalisi “juu ya kila nafsi ya mwanadamu,” hapa ψυχή pamoja na ἀνθρώπου humaanisha kila mtu. Tafsiri hii ni ya kawaida na haidokezi kwamba hukumu itaipata nafsi pekee bila mwili.
- source_word: τοῦ κατεργαζομένου
  choice: atendaye
  rationale: Kitenzi hiki hueleza mtu anayefanya au kutenda jambo; “atendaye” huhifadhi muundo wa kishiriki na sauti yenye staha.
- source_word: τὸ κακόν
  choice: uovu
  rationale: Nomino hii ya Kigiriki imetumiwa kwa maana ya jumla ya lililo ovu; “uovu” ni tafsiri fupi na ya kawaida.
- source_word: Ἰουδαίου
  choice: Myahudi
  rationale: Katika muktadha wa Waroma, neno hili linamtaja mtu wa jamii ya Kiyahudi, si mkazi wa Uyahudi tu.
- source_word: Ἕλληνος
  choice: Mgiriki
  rationale: Huhifadhi neno halisi na jozi ya Paulo ya Myahudi/Mgiriki; katika muktadha huu Mgiriki anamwakilisha asiye Myahudi.
- source_word: πρῶτον
  choice: kwanza
  rationale: Huhifadhi moja kwa moja wazo la utangulizi au kipaumbele bila kulifafanua zaidi.
theological_decisions:
- issue: Kufanya kitenzi kilichodokezwa katika sentensi ya Kigiriki kiwe wazi kwa Kiswahili
  choice: Dhiki na taabu zitampata...
  alternative: Dhiki na taabu juu ya kila mtu...
  rationale: Kiswahili cha kawaida kinahitaji kiarifu kilicho wazi. “Zitampata” kinaeleza kwamba adhabu hiyo itamjia mtu bila kuongeza fundisho lisilokuwapo katika muktadha.
- issue: Maana ya ψυχή katika usemi πᾶσαν ψυχὴν ἀνθρώπου
  choice: kila mtu
  alternative: kila nafsi ya mwanadamu
  rationale: Usemi mzima ni njia ya kumtaja kila mwanadamu. “Kila mtu” huepuka kuleta bila kukusudia mgawanyo wa nafsi na mwili, huku maana halisi ikielezwa katika uamuzi wa kileksika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye staha na kinachoeleweka kwa wasomaji wa kawaida. Muundo “dhiki na taabu” unadumisha jozi yenye mkazo, na “Myahudi kwanza, na pia Mgiriki” huhifadhi mpangilio na mvutano wa matini ya Kigiriki.
