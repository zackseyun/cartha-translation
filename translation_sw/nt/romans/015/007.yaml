  yaml_path: translation/nt/romans/015/007.yaml
  text: Therefore welcome one another[a], just as the Messiah also welcomed you[c][b], for the glory of God.
translation:
  language: sw
  text: Kwa hiyo, karibishaneni[b], kama vile Masihi[a] naye alivyowakaribisha, kwa utukufu wa Mungu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kristo.”
    reason: alternative_reading
  - marker: b
    text: Au, “pokeaneni.”
    reason: lexical_alternative
  - marker: c
    text: Au, “ili Mungu atukuzwe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὸ
  choice: Kwa hiyo
  rationale: Inaonyesha hitimisho linalotokana na hoja iliyotangulia na ni kiunganishi cha kawaida, cha wazi katika Kiswahili.
- source_word: προσλαμβάνεσθε
  choice: karibishaneni
  rationale: Kauli ya kuamuru pamoja na ἀλλήλους inadai kupokeana kwa hiari na kwa uhusiano wa karibu; ‘karibishaneni’ hudumisha uzito wa kijamii wa tendo hilo.
- source_word: ἀλλήλους
  choice: -aneni (katika ‘karibishaneni’)
  rationale: Kiambishi cha kutendeana -an- huwasilisha maana ya ‘ninyi kwa ninyi’ kwa Kiswahili cha kawaida bila kurudia maneno yasiyohitajika.
- source_word: καθὼς καὶ
  choice: kama vile ... naye
  rationale: ‘Kama vile’ huonyesha ulinganisho, na ‘naye’ huhifadhi nguvu ya nyongeza ya καί.
- source_word: ὁ Χριστὸς
  choice: Masihi
  rationale: Hapa Χριστός yenye kibainishi inafanya kazi kama cheo; ‘Masihi’ huonyesha maana yake ya kimasiya, huku ‘Kristo’ ikitolewa kama mbadala.
- source_word: προσελάβετο
  choice: alivyowakaribisha
  rationale: Mzizi uleule wa Kiswahili umetumiwa kama katika προσλαμβάνεσθε ili kuhifadhi ulinganifu wa makusudi kati ya tendo la waamini na tendo la Masihi.
- source_word: ὑμᾶς
  choice: -wa- (katika ‘alivyowakaribisha’)
  rationale: Kiambishi hiki cha yambwa kinawakilisha nafsi ya pili wingi katika muktadha.
- source_word: εἰς δόξαν τοῦ θεοῦ
  choice: kwa utukufu wa Mungu
  rationale: Kirai hiki ni cha asili katika Kiswahili na kinaweza kubeba wazo la kusudi au matokeo bila kulifunga kwa tafsiri moja tu.
theological_decisions:
- issue: Tafsiri ya Χριστός
  choice: Masihi
  alternative: Kristo
  rationale: Kibainishi na matumizi ya kifungu hiki vinaunga mkono kuelewa neno hilo kama cheo. Mbadala unaojulikana zaidi, ‘Kristo,’ umehifadhiwa katika tanbihi bila kuingiza msimamo wa dhehebu.
- issue: Maana ya προσλαμβάνομαι katika jumuiya ya waamini
  choice: karibishaneni
  alternative: pokeaneni / kubalianeni
  rationale: ‘Karibishaneni’ huonyesha upokeaji wa watu kwa ukarimu na hudumisha ulinganifu na jinsi Masihi alivyowapokea, bila kuifanya kauli iwe kibali cha kila wazo au tendo.
- issue: Nguvu ya εἰς katika εἰς δόξαν τοῦ θεοῦ
  choice: kwa utukufu wa Mungu
  alternative: ili Mungu atukuzwe
  rationale: εἰς inaweza kuonyesha kusudi au matokeo. Matini kuu inadumisha upana huo; tanbihi inaonyesha kwa uwazi zaidi usomaji wa kusudi/matokeo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ‘karibishaneni’ ni wa kawaida na unaeleweka kwa urahisi; ‘naye’ huhifadhi ulinganifu wa kauli bila kufanya sentensi kuwa nzito.
