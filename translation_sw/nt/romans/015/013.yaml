  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς τῆς ἐλπίδος πληρώσαι ὑμᾶς πάσης χαρᾶς καὶ εἰρήνης ἐν τῷ πιστεύειν, εἰς τὸ περισσεύειν ὑμᾶς ἐν τῇ ἐλπίδι ἐν δυνάμει πνεύματος ἁγίου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/013.yaml
  text: May the God of hope fill you with all joy and peace in believing, so that you may abound in hope by the power of the Holy Spirit.
translation:
  language: sw
  text: Mungu wa tumaini awajaze kwa furaha yote na amani katika kuamini, ili mzidi kuwa na tumaini kwa nguvu za Roho Mtakatifu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ θεὸς τῆς ἐλπίδος
  choice: Mungu wa tumaini na
  rationale: “Mungu wa tumaini” huhifadhi muundo wa Kigiriki unaomtaja Mungu kuwa chanzo na msingi wa tumaini. Kiunganishi hafifu δὲ kimetolewa kwa “na” baada ya kirai cha nomino, kwa mtiririko wa kawaida wa Kiswahili bila kukifanya kuwa tofauti kali.
- source_word: πληρώσαι ὑμᾶς
  choice: awajaze ninyi
  rationale: Optativi ya ombi/baraka imetolewa kwa “na awajaze.” Kitenzi “jaza” kinahifadhi taswira ya ujazo; “ninyi” inaweka wazi wingi na msisitizo wa ὑμᾶς.
- source_word: πάσης χαρᾶς καὶ εἰρήνης
  choice: furaha yote na amani
  rationale: Hiki ndicho kilichomo katika ujazo. “Yote” huhifadhi maana pana ya πάσης huku Kiswahili cha sasa kikibaki cha kawaida.
- source_word: ἐν τῷ πιστεύειν
  choice: katika kuamini
  rationale: Muundo huu huhifadhi tendo au hali ya kuamini badala ya kulibadili kuwa nomino “imani,” na unaacha wazi ikiwa ni mazingira au hali ambamo furaha na amani hupatikana.
- source_word: εἰς τὸ περισσεύειν ὑμᾶς
  choice: ili mzidi kuwa na
  rationale: “Ili” hutoa kusudi au matokeo yaliyokusudiwa ya εἰς τὸ pamoja na infinitivi. “Mzidi kuwa na” ni Kiswahili cha kawaida kinachoonyesha wingi unaoongezeka.
- source_word: ἐν τῇ ἐλπίδι
  choice: tumaini
  rationale: Katika muundo “mzidi kuwa na tumaini,” uhusiano wa ἐν τῇ ἐλπίδι umeelezwa kwa Kiswahili cha kawaida huku uhusiano wa kileksia na “Mungu wa tumaini” ukihifadhiwa.
- source_word: ἐν δυνάμει πνεύματος ἁγίου
  choice: kwa nguvu za Roho Mtakatifu
  rationale: “Kwa” huwasilisha maana ya njia au chombo. Kiswahili hutumia kwa kawaida “nguvu za” kuonyesha nguvu zitokazo au zitendazo kupitia Roho Mtakatifu.
theological_decisions:
- issue: Rejeo la πνεύματος ἁγίου
  choice: Roho Mtakatifu
  alternative: roho takatifu
  rationale: Katika muktadha wa Paulo, kirai hiki kinamrejelea Roho wa Mungu. Herufi kubwa zinabainisha rejeo hilo bila kuongeza dai lisilosemwa na aya.
- issue: Maana ya θεὸς τῆς ἐλπίδος
  choice: Mungu wa tumaini
  alternative: Mungu anayetoa tumaini
  rationale: Muundo “wa tumaini” huhifadhi ufupi na upana wa genitivi ya Kigiriki, ambayo inaweza kuonyesha Mungu kuwa chanzo na pia msingi wa tumaini, bila kuifungia katika ufafanuzi mmoja tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa baraka “na awajaze” ni wa kawaida na huhifadhi hali ya ombi ya Kigiriki. Hakuna tanbihi zinazohitajika.
