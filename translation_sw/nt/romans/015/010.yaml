id: ROM.15.10
reference: Romans 15:10
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ πάλιν λέγει· Εὐφράνθητε, ἔθνη, μετὰ τοῦ λαοῦ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/010.yaml
  text: And again he says[a], “Rejoice, Gentiles, with his people.”
translation:
  language: sw
  text: Naye anasema tena, “Furahini, enyi Mataifa, pamoja na watu wake.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Furahini, enyi watu wasio Wayahudi, pamoja na watu wake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: tena
  rationale: Katika kauli ya kutanguliza nukuu nyingine ya Maandiko, “tena” ni tafsiri ya kawaida na ya asili.
- source_word: λέγει
  choice: anasema
  rationale: Wakati uliopo umehifadhiwa kwa kuwa kauli hii huonyesha Maandiko yakisema sasa; kiima kisichotajwa kinaachwa bila kufafanuliwa zaidi.
- source_word: Εὐφράνθητε
  choice: Furahini
  rationale: Kitenzi hiki ni amri kwa wingi yenye maana ya kufurahi; “Furahini” ni ya kawaida, yenye heshima, na huhifadhi nguvu ya amri.
- source_word: ἔθνη
  choice: Mataifa
  rationale: “Mataifa” huhifadhi maana ya msingi ya neno la Kigiriki na, katika muktadha wa Paulo, linaeleweka kuwa watu wasio Wayahudi. Maana hiyo imefafanuliwa katika tanbihi bila kuifunga nukuu kwa tafsiri moja tu.
- source_word: μετὰ τοῦ λαοῦ αὐτοῦ
  choice: pamoja na watu wake
  rationale: “Pamoja na” huonyesha wazi ushirika unaoelezwa na μετά pamoja na hali ya umilikaji katika “watu wake,” bila kuongeza utambulisho ambao haukutajwa moja kwa moja.
- source_word: λαοῦ
  choice: watu
  rationale: “Watu” huhifadhi neno la jumla la Kigiriki na maana yake ya watu wa Mungu bila kulipanua moja kwa moja kuwa “Israeli.”
theological_decisions:
- issue: Maana ya ἔθνη katika nukuu ya Paulo kuhusu umoja wa Wayahudi na wasio Wayahudi
  choice: Mataifa
  alternative: watu wasio Wayahudi
  rationale: “Mataifa” huhifadhi upana na mwangwi wa nukuu ya Agano la Kale, huku muktadha wa Waroma 15 ukielekeza kwa watu wasio Wayahudi. Tanbihi inaweka wazi maana hiyo ya kimuktadha bila kufuta utata halisi wa kileksia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Enyi” limetumiwa kama kiashiria cha mwito wa moja kwa moja kwa kundi, na mpangilio wa sentensi umefanywa wa asili katika Kiswahili huku ukihifadhi kauli ya nukuu katika wakati uliopo.
