  yaml_path: translation/nt/romans/015/011.yaml
  text: 'And again: “Praise the Lord[a], all the nations[b], and let all the peoples praise him.”'
translation:
  language: sw
  text: 'Na tena:


    “Msifuni Bwana[a], enyi mataifa yote[b],

    na watu wote na wamsifu.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “BWANA,” kwa kufuata chanzo cha Kiebrania cha nukuu hii, ambamo jina la Mungu linawakilishwa katika Kigiriki na κύριος (“Bwana”).
    reason: alternative_reading
  - marker: b
    text: Au “watu wote wasio Wayahudi.” Neno la Kigiriki ἔθνη linaweza kumaanisha “mataifa” au watu wasio Wayahudi; hapa nukuu ina maana ya ulimwengu wote, na pia inafaa hoja ya Paulo kuhusu watu wa mataifa.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ πάλιν
  choice: Na tena
  rationale: Kauli hii inaunganisha nukuu hii na mfululizo wa nukuu zilizotangulia; “Na tena” ni ya kawaida katika Kiswahili na inaakisi vipengele vyote viwili vya Kigiriki.
- source_word: Αἰνεῖτε
  choice: Msifuni
  rationale: Ni amri kwa wingi; “Msifuni” ni tafsiri ya moja kwa moja, ya kawaida na yenye hadhi.
- source_word: πάντα τὰ ἔθνη
  choice: enyi mataifa yote
  rationale: Neno ἔθνη linaweza kumaanisha “mataifa” au watu wasio Wayahudi. Katika nukuu hii mwito ni wa ulimwengu wote, hivyo “mataifa yote” huhifadhi maana pana huku tanbihi ikitaja maana nyingine inayofaa hoja ya Paulo.
- source_word: τὸν κύριον
  choice: Bwana
  rationale: Hutafsiri κύριος moja kwa moja katika Agano Jipya. Tanbihi inaonyesha kwamba katika chanzo cha Kiebrania neno hili linawakilisha jina la Mungu.
- source_word: ἐπαινεσάτωσαν
  choice: na wamsifu
  rationale: Muundo huu wa Kiswahili unawasilisha kwa kawaida nguvu ya amri ya nafsi ya tatu ya Kigiriki.
- source_word: αὐτόν
  choice: m- katika “wamsifu”
  rationale: Kiwakilishi cha yambwa kimeambatanishwa na kitenzi kwa mujibu wa sarufi ya Kiswahili na kinamrejelea Bwana.
- source_word: πάντες οἱ λαοί
  choice: watu wote
  rationale: “Watu” huhifadhi tofauti ya kileksia kati ya λαοί na ἔθνη bila kurudia “mataifa,” na inafaa usambamba wa kishairi.
theological_decisions:
- issue: Tafsiri ya κύριος katika nukuu ya Agano la Kale inayomhusu Mungu wa Israeli
  choice: Bwana
  alternative: BWANA
  rationale: Maandishi ya Kigiriki yana κύριος, kwa hiyo “Bwana” ndiyo tafsiri ya moja kwa moja katika matini kuu. “BWANA” imehifadhiwa katika tanbihi ili kuonyesha jina la Mungu lililo katika chanzo cha Kiebrania.
- issue: Tafsiri ya ἔθνη katika muktadha wa hoja ya Paulo kuhusu Wayahudi na watu wa mataifa
  choice: mataifa yote
  alternative: watu wote wa mataifa
  rationale: Nukuu yenyewe ina mwito mpana kwa mataifa yote. Hata hivyo, maana ya watu wasio Wayahudi inafaa muktadha wa Waroma 15, kwa hiyo imehifadhiwa katika tanbihi badala ya kuamuliwa kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio wa mistari umehifadhi usambamba wa kishairi wa nukuu. Kiunganishi “enyi” kinaonyesha wazi kwamba “mataifa yote” ndiyo yanayoamriwa kumsifu Bwana.
