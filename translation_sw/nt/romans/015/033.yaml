  text: ὁ δὲ θεὸς τῆς εἰρήνης μετὰ πάντων ὑμῶν· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/033.yaml
  text: May the God of peace be with all of you. Amen.
translation:
  language: sw
  text: Mungu wa amani awe pamoja nanyi nyote. Amina.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: (hakutafsiriwa kwa neno tofauti)
  rationale: Hapa δέ ni kiunganishi hafifu cha mpito katika baraka ya kuhitimisha. Mfuatano wa Kiswahili unaeleweka vizuri bila kuongeza “sasa,” neno ambalo lingeweza kueleweka kuwa la wakati.
- source_word: θεὸς τῆς εἰρήνης
  choice: Mungu wa amani
  rationale: Hii ni tafsiri ya moja kwa moja ya jina hili la Paulo, na inadumisha uhusiano wa kijenitivi bila ufafanuzi wa ziada.
- source_word: εἰρήνης
  choice: amani
  rationale: “Amani” ni kisawe cha kawaida na cha asili; katika muktadha huu kinaweza kuhusisha pia hali njema na upatanisho bila kulazimisha maana moja tu.
- source_word: μετὰ πάντων ὑμῶν
  choice: na awe pamoja nanyi nyote
  rationale: Kigiriki hakina kitenzi kilichoandikwa wazi. Kiswahili kinaongeza “na awe” ili kuwasilisha kwa kawaida ombi la baraka, huku “nanyi nyote” kikihifadhi wigo jumuishi wa πάντων ὑμῶν.
- source_word: ἀμήν
  choice: Amina
  rationale: “Amina” ni umbo la kawaida la Kiswahili katika hitimisho la kiliturujia na linadumisha uzito wa kukubali na kuthibitisha.
theological_decisions:
- issue: Iwapo kishazi kisicho na kitenzi kitafsiriwe kama taarifa au ombi la baraka
  choice: 'Kimetafsiriwa kama ombi la baraka: “Mungu wa amani na awe pamoja nanyi nyote.”'
  alternative: “Mungu wa amani yuko pamoja nanyi nyote.”
  rationale: Ingawa Kigiriki hakina kitenzi cha hali ya kutakia au kuamuru kilicho wazi, muundo huu katika hitimisho la barua unaeleweka kwa kawaida kuwa sala ya matakwa au baraka. “Na awe” huonyesha kazi hiyo bila kuingiza fundisho la ziada.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo “na awe” unafaa kwa baraka fupi na yenye uzito. Hakuna alama za tanbihi zinazohitajika.
