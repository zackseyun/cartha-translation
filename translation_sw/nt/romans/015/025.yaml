  text: νυνὶ δὲ πορεύομαι εἰς Ἰερουσαλὴμ διακονῶν τοῖς ἁγίοις.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/025.yaml
  text: But now I am going to Jerusalem[a], ministering to the saints.
translation:
  language: sw
  text: Lakini sasa ninaenda Yerusalemu kuwahudumia watakatifu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kuwatumikia watakatifu” au “kuwapelekea watakatifu msaada.” Neno διακονῶν linaweza kumaanisha huduma ya vitendo; hapa huenda linarejelea Paulo kupeleka mchango kwa waumini wa Yerusalemu (linganisha Waroma 15:26).
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: Lakini sasa
  rationale: νυνί huonyesha wakati wa sasa kwa msisitizo, na δέ huleta mpito wenye utofautishaji wa kiasi; “Lakini sasa” huhifadhi maana zote mbili kwa Kiswahili cha kawaida.
- source_word: πορεύομαι
  choice: ninaenda
  rationale: Kitenzi hiki hapa huonyesha mwendo au kusudi la sasa kuelekea mahali fulani. “Ninaenda” ni tafsiri ya moja kwa moja na ya kawaida bila kuongeza wazo lisilokuwamo wazi.
- source_word: εἰς Ἰερουσαλὴμ
  choice: Yerusalemu
  rationale: εἰς pamoja na jina la mji huonyesha mahali safari inakoelekea. Katika Kiswahili, maana ya “kwenda Yerusalemu” iko wazi bila kuhitaji kihusishi cha ziada.
- source_word: διακονῶν
  choice: kuwahudumia
  rationale: Kivumishi-tendo hiki kinaeleza huduma inayohusiana na safari ya Paulo, ama kama kusudi au hali inayoandamana nayo. “Kuwahudumia” huhifadhi maana pana ya kutoa huduma, huku muktadha unaofuata ukidokeza msaada wa vitendo.
- source_word: τοῖς ἁγίοις
  choice: watakatifu
  rationale: Katika matumizi ya Paulo, οἱ ἅγιοι ni waumini waliowekwa wakfu kwa Mungu. “Watakatifu” ni tafsiri fupi, ya kawaida katika lugha ya Biblia, na iliyo karibu na umbo la Kigiriki.
theological_decisions:
- issue: Wanaorejelewa kwa neno “watakatifu”
  choice: Waumini walioko Yerusalemu, hasa wahitaji miongoni mwao kulingana na muktadha wa karibu
  alternative: Watu watakatifu kwa maana pana bila kuainisha kanisa la Yerusalemu
  rationale: Kirai chenyewe kinasema “watakatifu,” na muktadha wa Waroma 15:26 unaonyesha kuwa Paulo alikuwa akipeleka mchango kwa waumini wa Yerusalemu. Maandishi makuu yanahifadhi istilahi ya chanzo badala ya kuingiza ufafanuzi huo moja kwa moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa asili na unaoeleweka kwa wasomaji wa kawaida; “watakatifu” huhifadhi istilahi ya Paulo, na tanbihi huhifadhi upana wa maana ya διακονῶν bila kuamua kimya kimya kama ni huduma kwa ujumla au hasa kupeleka msaada.
