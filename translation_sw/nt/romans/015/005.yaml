id: ROM.15.5
reference: Romans 15:5
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς τῆς ὑπομονῆς καὶ τῆς παρακλήσεως δῴη ὑμῖν τὸ αὐτὸ φρονεῖν ἐν ἀλλήλοις κατὰ ⸂Χριστὸν Ἰησοῦν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/005.yaml
  text: May the God of endurance and encouragement grant you to think the same way toward one another[a], in accordance with Messiah Jesus[b],
translation:
  language: sw
  text: Mungu wa uvumilivu na faraja awajalie kuwa na nia moja miongoni mwenu[a], kulingana na Masihi Yesu[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kufikiri jambo lilelile” au “kuwa na mtazamo mmoja.”
    reason: lexical_alternative
  - marker: b
    text: 'Kigiriki: “kulingana na Masihi Yesu.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δὲ θεὸς
  choice: Mungu ... na
  rationale: δέ ni kiunganishi chepesi kinachoendeleza wazo kutoka mstari uliotangulia; hapa “na” kabla ya ombi la baraka kinatoa mtiririko wa kawaida bila kuingiza tofauti kali.
- source_word: τῆς ὑπομονῆς
  choice: wa uvumilivu
  rationale: “Uvumilivu” huonyesha kustahimili kwa uthabiti chini ya shida, maana inayofaa zaidi hapa kuliko kusubiri tu kwa subira.
- source_word: τῆς παρακλήσεως
  choice: na faraja
  rationale: παράκλησις inaweza kumaanisha faraja, kutia moyo, au himizo. “Faraja” ni neno la kawaida na lenye upana wa kuimarisha moyo katika muktadha huu.
- source_word: δῴη ὑμῖν
  choice: na awajalie
  rationale: Kauli ya kutakia au kuomba inaonyeshwa kwa kawaida na kwa heshima katika Kiswahili kwa “na awajalie.”
- source_word: τὸ αὐτὸ φρονεῖν
  choice: kuwa na nia moja
  rationale: Usemi huu unaeleza kuwa na mtazamo au mwelekeo mmoja; “nia moja” ni Kiswahili cha kawaida bila kudai lazima wakubaliane katika kila jambo.
- source_word: ἐν ἀλλήλοις
  choice: ninyi kwa ninyi
  rationale: Huhifadhi maana ya uhusiano wa pande zote ndani ya jumuiya.
- source_word: κατὰ Χριστὸν Ἰησοῦν
  choice: kwa kumfuata Masihi Yesu
  rationale: κατά inaonyesha kufuata kipimo au kielelezo. “Kwa kumfuata” huwasilisha ulinganifu huo kwa Kiswahili cha asili, huku “Masihi” ikihifadhi maana ya cheo Χριστός.
theological_decisions:
- issue: Tafsiri ya Χριστός
  choice: Masihi Yesu
  alternative: Kristo Yesu
  rationale: Χριστός ni cheo chenye maana ya “Masihi”; kukitafsiri kunahifadhi maana yake badala ya kukifanya kama sehemu ya jina tu.
- issue: Maana ya τὸ αὐτὸ φρονεῖν
  choice: kuwa na nia moja
  alternative: kufikiri sawasawa
  rationale: Maneno yanaelekea kwenye umoja wa mtazamo na mwelekeo miongoni mwa waamini, si lazima usawa kamili wa maoni katika kila jambo.
- issue: Nguvu ya κατὰ Χριστὸν Ἰησοῦν
  choice: kwa kumfuata Masihi Yesu
  alternative: kulingana na Masihi Yesu
  rationale: Tafsiri iliyochaguliwa inaonyesha Yesu Masihi kuwa kipimo au kielelezo cha mtazamo huo, huku tanbihi ikihifadhi muundo wa karibu zaidi na Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa ombi la baraka “na awajalie” unafaa sajili ya maandiko bila kuwa wa kizamani kupita kiasi.
