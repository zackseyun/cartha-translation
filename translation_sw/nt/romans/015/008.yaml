  text: λέγω ⸀γὰρ ⸀Χριστὸν διάκονον ⸀γεγενῆσθαι περιτομῆς ὑπὲρ ἀληθείας θεοῦ, εἰς τὸ βεβαιῶσαι τὰς ἐπαγγελίας τῶν πατέρων,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/008.yaml
  text: For I say that the Messiah has become a servant to the circumcised for the sake of God's truth[a], in order to confirm the promises to the fathers,
translation:
  language: sw
  text: Kwa maana nasema kwamba Masihi amekuwa mtumishi wa waliotahiriwa kwa ajili ya kweli ya Mungu[a], ili kuyathibitisha ahadi walizopewa mababu,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa ajili ya uaminifu wa Mungu,” ikikazia kwamba Mungu ni mwaminifu katika kutimiza ahadi zake za agano.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω γὰρ
  choice: Kwa maana nasema
  rationale: γάρ linaonyesha maelezo yanayounganisha sentensi hii na hoja iliyotangulia, na λέγω limetafsiriwa kwa namna ya moja kwa moja na ya kawaida.
- source_word: Χριστόν
  choice: Masihi
  rationale: Hapa Χριστός linafanya kazi kama cheo katika hoja inayohusu Israeli, tohara, na ahadi kwa mababu.
- source_word: διάκονον
  choice: mtumishi
  rationale: Neno hili linaonyesha mtu anayehudumu; ‘mtumishi’ ni wazi na halileti bila sababu maana ya cheo rasmi cha kanisa.
- source_word: γεγενῆσθαι
  choice: amekuwa
  rationale: Kauli timilifu ya γίνομαι inaonyesha hali iliyotokana na kuwa; ‘amekuwa’ huhifadhi maana hiyo kwa Kiswahili cha kawaida.
- source_word: περιτομῆς
  choice: wa waliotahiriwa
  rationale: Hii ni genitivi inayowarejelea watu wa tohara, yaani Wayahudi; muundo huu huhifadhi uhusiano wa karibu na διάκονον bila kuongeza ufafanuzi ndani ya matini.
- source_word: ὑπὲρ ἀληθείας θεοῦ
  choice: kwa ajili ya kweli ya Mungu
  rationale: ὑπέρ hapa huonyesha kusudi au jambo linalotetewa, huku ἀλήθεια θεοῦ likiweza kumaanisha kweli ya Mungu au uaminifu wake; wazo la pili limehifadhiwa katika tanbihi.
- source_word: εἰς τὸ βεβαιῶσαι
  choice: ili kuyathibitisha
  rationale: Muundo huu unaonyesha kusudi, na βεβαιόω hapa ni kufanya ahadi ziwe thabiti au kuthibitisha uhakika wake.
- source_word: τὰς ἐπαγγελίας τῶν πατέρων
  choice: ahadi walizopewa mababu
  rationale: Genitivi τῶν πατέρων inaeleweka katika muktadha kama ahadi zinazohusiana na mababu wa Israeli; Kiswahili hiki kinaweka wazi kwamba ahadi zilitolewa kwao bila kutumia muundo usio wa kawaida ‘ahadi za mababu’.
theological_decisions:
- issue: Tafsiri ya Χριστός
  choice: Masihi
  alternative: Kristo
  rationale: Muktadha wa Israeli, tohara, na ahadi kwa mababu unaonyesha matumizi ya neno hili kama cheo.
- issue: Maana ya ἀλήθεια θεοῦ
  choice: kweli ya Mungu
  alternative: uaminifu wa Mungu
  rationale: Kirai kinaweza kuonyesha kweli ya Mungu kwa upana au uaminifu wake katika kutimiza ahadi. Matini kuu inahifadhi usemi mpana, na tanbihi inaonyesha maana ya kiagano iliyo dhahiri katika muktadha.
- issue: Uhusiano wa διάκονον na περιτομῆς
  choice: mtumishi wa waliotahiriwa
  alternative: mtumishi kwa waliotahiriwa
  rationale: Genitivi ya Kigiriki imehifadhiwa kwa muundo wa Kiswahili unaoeleweka, huku maana ya huduma kwa watu waliotahiriwa ikibaki wazi katika muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Waliotahiriwa’ ni wazi kuliko usemi wa kimajazi ‘tohara,’ na ‘mababu’ linafaa kwa mababu wa Israeli katika muktadha huu.
