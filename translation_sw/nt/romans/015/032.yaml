  text: so that by God's will I may come to you with joy and be refreshed together with you[a].
translation:
  language: sw
  text: ili kwa mapenzi ya Mungu nije kwenu kwa furaha na nipumzike pamoja nanyi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “niburudike pamoja nanyi.” Kitenzi cha Kigiriki huonyesha pumziko au kuburudishwa kunakoshirikishwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: ili
  rationale: Inaendeleza kishazi cha kusudi kutokana na ombi lililotangulia, kwa Kiswahili cha kawaida na fasaha.
- source_word: ἐν χαρᾷ
  choice: kwa furaha
  rationale: Inaonyesha hali inayoambatana na kuja kwa Paulo huku ikihifadhi dhana ya furaha.
- source_word: ἐλθὼν πρὸς ὑμᾶς
  choice: nije kwenu
  rationale: Kitenzi tegemezi cha Kigiriki kimeunganishwa kwa kawaida na kishazi cha kusudi; ‘kwenu’ inaonyesha kuwa Paulo anatarajia kuwafikia waamini wa Roma.
- source_word: διὰ θελήματος θεοῦ
  choice: kwa mapenzi ya Mungu
  rationale: ‘Kwa’ hapa huwasilisha kwamba kuja kwake kunategemea na kupatana na mapenzi ya Mungu bila kulazimisha ufafanuzi mwembamba wa διά.
- source_word: συναναπαύσωμαι
  choice: nipate kupumzika pamoja nanyi
  rationale: ‘Kupumzika pamoja’ huhifadhi wazo la pumziko au burudiko linaloshirikishwa, lililo katika kiambishi συν-, kwa lugha ya Kiswahili inayoeleweka.
theological_decisions:
- issue: Ushirikiano katika pumziko Paulo analotazamia akiwa na waamini wa Roma
  choice: nipate kupumzika pamoja nanyi
  alternative: niburudishwe pamoja nanyi
  rationale: Tafsiri inadumisha hali ya pamoja katika συναναπαύσωμαι na haimwonyeshi Paulo kama anayetoa huduma tu; hata hivyo, haiongezi kwa lazima wazo la kwamba kila upande ndio chanzo cha burudiko la mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo ‘kwa mapenzi ya Mungu’ ni wa kawaida katika sajili ya kibiblia bila kuwa wa kizamani.
