base_translation:
  language: en
  yaml_path: translation/nt/romans/015/009.yaml
  text: and the Gentiles might glorify God for his mercy[a], as it is written, “Therefore I will praise you among the Gentiles, and sing praise to your name.”
translation:
  language: sw
  text: 'na ili watu wa mataifa wamtukuze Mungu kwa sababu ya rehema yake,[a] kama ilivyoandikwa:


    “Kwahiyo nitakusifu miongoni mwa mataifa,

    na nitaliimbia jina lako sifa.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mataifa wamtukuze Mungu ... miongoni mwa mataifa.” Katika hoja ya Paulo, neno la Kigiriki linawalenga hasa watu wasio Wayahudi, lakini katika nukuu linaweza pia kuwa na maana pana ya “mataifa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθνη
  choice: watu wa mataifa
  rationale: Katika Waroma neno hili mara nyingi linamaanisha watu wasio Wayahudi. “Watu wa mataifa” ni Kiswahili cha kawaida kinachoonyesha maana hiyo bila kutumia istilahi ngumu, huku kikidumisha mwangwi mpana wa “mataifa.”
- source_word: ὑπὲρ ἐλέους
  choice: kwa sababu ya rehema yake
  rationale: ὑπέρ pamoja na genitivi huonyesha sababu au msingi hapa. Kiwakilishi “yake” kinaweka wazi kwa njia ya asili kwamba rehema hiyo ni ya Mungu.
- source_word: δοξάσαι
  choice: ili ... wamtukuze
  rationale: Infinitivi hii inategemea kisintaksia mstari uliotangulia na inaonyesha kusudi au matokeo. “Ili” huunganisha hoja hiyo kwa Kiswahili cha kawaida.
- source_word: καθὼς γέγραπται
  choice: kama ilivyoandikwa
  rationale: Hii ni kauli ya kawaida ya kutanguliza nukuu ya Maandiko, na tafsiri hii ni wazi na yenye hadhi.
- source_word: ἐξομολογήσομαί
  choice: nitakusifu
  rationale: Katika muktadha huu kitenzi kina maana ya kumsifu au kumshukuru Mungu hadharani, si kuungama dhambi. “Nitakusifu” pia kinaendana na ulinganifu wa ψαλῶ.
- source_word: ἐν ἔθνεσι
  choice: miongoni mwa mataifa
  rationale: ἐν pamoja na dativi ina maana ya mahali au kundi, yaani “miongoni mwa.” Katika nukuu, “mataifa” huhifadhi upana wa asili huku hoja ya Paulo ikiwahusu watu wasio Wayahudi.
- source_word: ψαλῶ
  choice: kuliimbia ... sifa
  rationale: ψάλλω hapa humaanisha kuimba sifa. Muundo huu ni wa asili katika Kiswahili na hauzuii maana kwenye kuimba zaburi rasmi pekee.
- source_word: τῷ ὀνόματί σου
  choice: jina lako
  rationale: Dativi inayofuata ψαλῶ inaelekezwa kwa jina la Mungu. “Kuliimbia jina lako sifa” huhifadhi nahau ya kibiblia kwa Kiswahili kinachoeleweka.
theological_decisions:
- issue: Rejeo na nguvu ya kishazi cha mwanzo chenye infinitivi
  choice: 'Kishazi kimetafsiriwa kama mwendelezo wa hoja ya mstari uliotangulia: huduma ya Kristo ina kusudi au matokeo ya watu wa mataifa kumtukuza Mungu kwa rehema yake.'
  alternative: 'Tafsiri ya kipande iliyo karibu zaidi na umbo la Kigiriki: “na watu wa mataifa kumtukuza Mungu kwa rehema.”'
  rationale: Kigiriki cha mstari huu kinategemea kisintaksia Waroma 15:8. Kutumia “ili” kunafanya uhusiano huo ueleweke bila kuongeza dai la kiteolojia lisilokuwamo katika maandishi. Rehema inadumisha utofautishaji wa Paulo kati ya ahadi zilizothibitishwa kwa mababu na rehema inayowafikia watu wa mataifa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Watu wa mataifa” limetumiwa katika kishazi cha Paulo ili kufafanua watu wasio Wayahudi; “mataifa” limedumishwa ndani ya nukuu ili kuhifadhi maana pana ya Zaburi. Alama ya tanbihi [a] imewekwa mara tu baada ya “rehema yake,” kulingana na hoja ya kileksika inayohusu matumizi yote mawili ya ἔθνη/ἔθνεσι.
