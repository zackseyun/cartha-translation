lexical_decisions:
- source_word: ἔχω
  choice: nina
  rationale: Kitenzi hiki kiko katika wakati wa sasa, nafsi ya kwanza umoja. “Nina” ni usemi wa kawaida na wa moja kwa moja katika Kiswahili.
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Huonyesha hitimisho linalotokana na hoja iliyotangulia na hivyo huhifadhi uhusiano wa kimantiki.
- source_word: τὴν καύχησιν
  choice: sababu ya kujisifia
  rationale: Nomino hii inaweza kumaanisha kujisifia au msingi wa kujisifia. Muundo huu ni wa kawaida katika Kiswahili na unafaa kwa dai la Paulo katika muktadha huu bila kulifanya kuwa majivuno yasiyo na mipaka.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: katika Masihi Yesu
  rationale: “Katika” huhifadhi wazo la kuwa ndani ya uhusiano au eneo linalofafanuliwa na Yesu, badala ya kulifanya waziwazi kuwa njia tu. Χριστός imetafsiriwa kama cheo, “Masihi,” huku Ἰησοῦ likibaki jina “Yesu.”
- source_word: τὰ πρὸς τὸν θεόν
  choice: kuhusu mambo yanayomhusu Mungu
  rationale: Usemi huu unahusu mambo yanayohusiana na Mungu. Tafsiri hii huhifadhi upana wake bila kuubana kuwa huduma ya kikuhani pekee.
- source_word: θεόν
  choice: Mungu
  rationale: Hii ndiyo tafsiri ya kawaida ya θεός katika muktadha huu.
theological_decisions:
- issue: Tafsiri ya Χριστός
  choice: Masihi
  alternative: Kristo
  rationale: Hapa Χριστός inafanya kazi kama cheo kilichounganishwa na jina Yesu; kwa hiyo maana ya cheo imetafsiriwa badala ya kunukuliwa tu kwa sauti.
- issue: Maana ya kujisifia kwa Paulo
  choice: Kujisifia kwake kuna msingi katika Masihi Yesu na kunahusu mambo ya Mungu
  alternative: Kuonyesha hali ya jumla ya kujiamini au furaha ya ndani tu
  rationale: Vifungu “katika Masihi Yesu” na “kuhusu mambo yanayomhusu Mungu” vinaweka mipaka ya dai la Paulo. Tafsiri inadumisha mipaka hiyo bila kuongeza maelezo kwamba anamaanisha aina fulani tu ya huduma.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “nina sababu ya kujisifia” ni wa kawaida na unaeleweka kwa urahisi, huku “katika Masihi Yesu” na “mambo yanayomhusu Mungu” vikihifadhi upana na mvutano wa maandishi ya Kigiriki.
