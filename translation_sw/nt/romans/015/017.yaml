  yaml_path: translation/nt/romans/015/017.yaml
  text: Therefore I have reason for boasting in Messiah Jesus in the things pertaining to God[a][b][c].
translation:
  language: sw
  text: Kwa hiyo, nina sababu ya kujisifia[a] katika Masihi Yesu[b] katika mambo yanayomhusu Mungu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
