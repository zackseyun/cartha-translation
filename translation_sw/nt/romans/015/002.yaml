  yaml_path: translation/nt/romans/015/002.yaml
  text: Let each of us please his neighbor for his good[b][a], for building him up.
translation:
  language: sw
  text: Kila mmoja wetu na ampendeze jirani yake kwa faida yake, ili kumjenga.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa ajili ya lililo jema, kwa kusudi la kujenga.” “Kujenga” hutumia sitiari ya ujenzi kumaanisha kumtia mtu nguvu au kumkuza.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος ἡμῶν
  choice: Kila mmoja wetu
  rationale: Huhifadhi mgawanyo wa umoja pamoja na maana ya ‘miongoni mwetu,’ huku ikiwa Kiswahili cha kawaida na cha asili.
- source_word: τῷ πλησίον
  choice: jirani yake
  rationale: Katika muktadha huu πλησίον humaanisha mtu wa karibu au mwenzake katika maana ya kimaadili; ‘jirani yake’ ni wazi na huhifadhi umoja wa sentensi ya Kigiriki.
- source_word: ἀρεσκέτω
  choice: na ampendeze
  rationale: Huhifadhi nguvu ya amri ya nafsi ya tatu bila kuifanya kuwa pendekezo dhaifu; katika muktadha, kupendeza huku kunadhibitiwa na manufaa na kujengwa kwa jirani.
- source_word: εἰς τὸ ἀγαθὸν
  choice: kwa ajili ya mema yake
  rationale: Huonyesha lengo na manufaa kwa jirani, si kujipendekeza au kutosheleza matakwa yake tu.
- source_word: πρὸς οἰκοδομήν
  choice: ili kumjenga
  rationale: Huhifadhi sitiari ya ujenzi kwa maana ya kumtia nguvu na kumkuza mtu mwingine, kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Upeo wa kimaadili wa kumpendeza jirani
  choice: Amri imewekewa mipaka na mema ya jirani na kusudi la kumjenga.
  alternative: Kuielewa kama amri ya kukubaliana na matakwa ya watu bila masharti.
  rationale: Vishazi viwili vya kusudi katika Kigiriki vinaonyesha kwamba kumpendeza jirani kunalenga manufaa yake na kujengwa kwake, si kutafuta kibali cha watu kwa namna isiyo na mipaka.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa ‘na ampendeze’ umetumiwa kuhifadhi amri ya Kigiriki; sitiari ya ‘kujenga’ imehifadhiwa kwa kuwa inaeleweka katika matumizi ya Kikristo na ya kawaida.
