id: ROM.15.27
reference: Romans 15:27
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εὐδόκησαν γάρ, καὶ ὀφειλέται ⸂εἰσὶν αὐτῶν⸃· εἰ γὰρ τοῖς πνευματικοῖς αὐτῶν ἐκοινώνησαν τὰ ἔθνη, ὀφείλουσιν καὶ ἐν τοῖς σαρκικοῖς λειτουργῆσαι αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/027.yaml
  text: For they were pleased to do it[a], and they are indebted to them. For if the Gentiles have shared in their spiritual things[c][b], they also owe it to minister to them in material things.
translation:
  language: sw
  text: Kwa maana walipendezwa kufanya hivyo, tena wana deni kwao. Ikiwa watu wa mataifa[a] wameshiriki katika mambo yao ya kiroho[b], wao pia wana wajibu wa kuwahudumia kwa mambo ya kimwili[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watu wasio Wayahudi.” Kigiriki kinaweza kutafsiriwa kihalisi “mataifa.”
    reason: lexical_alternative
  - marker: b
    text: Au “baraka zao za kiroho.” Kigiriki kinasema “mambo yao ya kiroho.”
    reason: lexical_alternative
  - marker: c
    text: Kihalisi, “mambo ya mwili”; hapa maana yake ni msaada wa mali au wa mahitaji ya mwili, tofauti na mambo ya kiroho.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐδόκησαν
  choice: walipendezwa kufanya hivyo
  rationale: Kitenzi hiki kinaonyesha ridhaa na hiari yao; kirai “kufanya hivyo” kinaelekezwa na muktadha kwa mchango uliotajwa katika mstari uliotangulia.
- source_word: ὀφειλέται εἰσὶν αὐτῶν
  choice: wana deni kwao
  rationale: Huhifadhi picha ya deni na maana ya wajibu wa kimaadili kwa lugha ya kawaida ya Kiswahili.
- source_word: τὰ ἔθνη
  choice: watu wa mataifa
  rationale: Katika muktadha huu wa Paulo, neno hilo linamaanisha watu wasio Wayahudi, si mataifa kama vyombo vya kisiasa.
- source_word: τοῖς πνευματικοῖς αὐτῶν
  choice: katika mambo yao ya kiroho
  rationale: Kivumishi kilichotumiwa kama nomino kimetafsiriwa bila kuongeza nomino kama “baraka,” hivyo upana wa asili unadumishwa.
- source_word: ἐκοινώνησαν
  choice: wameshiriki katika
  rationale: Huonyesha kushiriki au kupata sehemu katika kitu, sambamba na muundo wa Kigiriki.
- source_word: ἐν τοῖς σαρκικοῖς
  choice: kwa mambo ya kimwili
  rationale: Katika muktadha wa mchango wa fedha, kinachokusudiwa ni msaada wa mahitaji ya mwili au mali, si hali ya dhambi.
- source_word: λειτουργῆσαι
  choice: kuwahudumia
  rationale: Huhifadhi wazo la kutoa huduma yenye heshima bila kulifungamanisha na huduma rasmi ya viongozi wa dini.
theological_decisions:
- issue: Maana ya σαρκικοῖς ikilinganishwa na πνευματικοῖς
  choice: mambo ya kimwili
  alternative: mambo ya mwili
  rationale: Muktadha wa mchango kwa waamini wa Yerusalemu unaonyesha msaada wa mali au wa mahitaji ya mwili. Tafsiri hii haichukulii neno hilo kimakosa kuwa linamaanisha dhambi.
- issue: Wanaorejelewa na αὐτῶν / αὐτοῖς
  choice: viwakilishi vya “yao” na “wa-” vimedumishwa, vikirejelea kwa karibu waamini wa Yerusalemu
  alternative: kutaja wazi “waamini wa Kiyahudi” au “Israeli”
  rationale: Muktadha wa karibu ni watakatifu wa Yerusalemu, lakini Kigiriki kinatumia viwakilishi. Kuvihifadhi huepuka kupanua rejeo kimyakimya na hudumisha kiasi cha uwazi kilichopo katika chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Watu wa mataifa” ni usemi wa kawaida wa kibiblia, huku tanbihi ikifafanua maana yake. Muundo wa sentensi umewekwa wazi bila kuondoa ulinganifu wa mambo ya kiroho na mambo ya kimwili.
source_grounding:
  english_pob_role: consult_only
