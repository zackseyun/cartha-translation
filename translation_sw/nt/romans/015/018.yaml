id: ROM.15.18
reference: Romans 15:18
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οὐ γὰρ τολμήσω ⸂τι λαλεῖν⸃ ὧν οὐ κατειργάσατο Χριστὸς δι’ ἐμοῦ εἰς ὑπακοὴν ἐθνῶν, λόγῳ καὶ ἔργῳ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/018.yaml
  text: For I will not dare to speak of anything except what Messiah has accomplished through me for the obedience of the Gentiles[a], by word and deed[b],
translation:
  language: sw
  text: Kwa maana sitathubutu kusema lolote isipokuwa yale ambayo Masihi ameyatenda kupitia kwangu, ili mataifa[a] watii, kwa maneno na matendo,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wasio Wayahudi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τολμήσω
  choice: sitathubutu
  rationale: Kitenzi cha wakati ujao pamoja na οὐ kinaonyesha kwamba Paulo hatajaribu kwa ujasiri kusema zaidi ya yale ambayo Masihi ametenda kupitia kwake.
- source_word: τι λαλεῖν … ὧν οὐ
  choice: kusema jambo lolote … isipokuwa yale ambayo
  rationale: 'Muundo huu una maana ya kuzuia: Paulo atasema tu kuhusu yale ambayo Masihi ametenda kupitia kwake. Neno ‘isipokuwa’ linaifanya tofauti hiyo iwe wazi katika Kiswahili cha kawaida.'
- source_word: κατειργάσατο
  choice: ameyatenda
  rationale: Kitenzi hiki hapa humaanisha kutekeleza au kufanikisha jambo. ‘Ameyatenda’ ni cha asili na kinamtambulisha Masihi kuwa mtendaji mkuu.
- source_word: Χριστὸς
  choice: Masihi
  rationale: Hapa Χριστός inaeleweka kama cheo cha Yesu; ‘Masihi’ huhifadhi maana hiyo ya kimasiya.
- source_word: δι’ ἐμοῦ
  choice: kupitia kwangu
  rationale: 'διά pamoja na hali milikishi huonyesha njia au wakala: Masihi ndiye mtendaji mkuu, naye Paulo ni chombo chake.'
- source_word: εἰς ὑπακοὴν ἐθνῶν
  choice: ili watu wa mataifa wapate kutii
  rationale: Ufasiri huu wa asili unaonyesha lengo au matokeo yaliyokusudiwa, yaani utii miongoni mwa watu wasio Wayahudi, bila kuufanya ‘utii’ uwe na maana finyu zaidi ya ilivyo katika Kigiriki.
- source_word: λόγῳ καὶ ἔργῳ
  choice: kwa maneno na matendo
  rationale: Hali ya kutoa hapa inaonyesha njia iliyotumiwa. Wingi wa Kiswahili, ‘maneno na matendo,’ ni usemi wa kawaida unaohifadhi jozi ya kutangaza na kutenda.
theological_decisions:
- issue: Maana ya Χριστός
  choice: Masihi
  alternative: Kristo
  rationale: Katika muktadha huu neno linaweza kusikika kama cheo cha Yesu, hivyo ‘Masihi’ linaonyesha wazi maana ya cheo hicho bila kuingiza fundisho la dhehebu.
- issue: Maana ya ἐθνῶν
  choice: watu wa mataifa
  alternative: wasio Wayahudi
  rationale: Katika Waroma neno hili mara nyingi linawahusu watu wasio Wayahudi. ‘Watu wa mataifa’ huhifadhi pia maana yake pana ya kileksia, huku tanbihi ikitoa maana ya kimuktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imetungwa kwa mtiririko wa kawaida, huku ikihifadhi mkazo kwamba Masihi ndiye aliyetenda kupitia Paulo. ‘Watu wa mataifa’ huepuka utata wa neno ‘Mataifa’ likitumika peke yake, na ‘kwa maneno na matendo’ ni jozi ya kawaida inayoeleweka kwa urahisi.
