    rationale: The note is not anchored to a meaningful lexical choice and introduces unverifiable textual-critical information. It should be deleted rather than presented as a source-based note.
  - severity: low
    issue: “jambo lolote ... yale ambayo” mixes a singular noun phrase with a plural relative referent.
    rationale: Although comprehensible, “lolote ... yale ambayo” is more idiomatic and better reflects the plural ὧν ('the things which').
  - severity: low
    issue: “watu wa mataifa” is less idiomatic in this Pauline context than “mataifa.”
    rationale: “Mataifa” conventionally bears the contextual sense of Gentiles in Swahili biblical register; the footnote can state “wasio Wayahudi.”
