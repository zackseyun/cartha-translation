  text: τοῦτο οὖν ἐπιτελέσας, καὶ σφραγισάμενος αὐτοῖς τὸν καρπὸν τοῦτον, ἀπελεύσομαι δι’ ὑμῶν ⸀εἰς Σπανίαν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/028.yaml
  text: Therefore[a], when I have completed this and have sealed this fruit to them[c][b], I will go on by way of you to Spain.
translation:
  language: sw
  text: Basi, nitakapokuwa nimekamilisha jambo hili na kulitia tunda hili muhuri kwao[a][b], nitaondoka nikipitia kwenu kwenda Hispania.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na kuwafikishia salama tunda hili.” Kitenzi “kutia muhuri” huenda kinamaanisha kukabidhi kwa usalama au kuthibitisha rasmi kwamba mchango umewafikia waliokusudiwa kuupokea.
    reason: lexical_alternative
  - marker: b
    text: “Tunda hili” ni mchango wa fedha uliokusanywa kutoka kwa waumini wa mataifa kwa ajili ya watakatifu wa Yerusalemu.
    reason: cultural_note
  - marker: c
    text: Au, “kupitia kwenu.” Paulo anamaanisha kupita Roma katika safari yake ya kwenda Hispania.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο οὖν
  choice: Basi ... jambo hili
  rationale: “Basi” linaonyesha hitimisho au hatua inayofuata kutokana na maelezo yaliyotangulia; “jambo hili” linaelekeza kwenye kazi ya kupeleka mchango bila kuifafanua kupita kiasi.
- source_word: ἐπιτελέσας
  choice: nitakapokuwa nimekamilisha
  rationale: Muundo huu unaonyesha kwamba kazi hiyo itakuwa imekamilika kabla ya safari inayotajwa katika kitenzi kikuu cha wakati ujao.
- source_word: σφραγισάμενος
  choice: kulitia muhuri
  rationale: Taswira halisi ya ‘kutia muhuri’ imehifadhiwa ili kutoondoa maana yake ya sitiari, ambayo huenda inahusu kukabidhi, kuthibitisha, au kuhakikisha usalama wa mchango.
- source_word: αὐτοῖς
  choice: kwa ajili yao
  rationale: Kiwakilishi hiki kinawarejelea waumini wa Yerusalemu waliokusudiwa kupokea mchango. “Kwa ajili yao” kinaendana kwa kawaida zaidi na sitiari ya kutia muhuri katika Kiswahili.
- source_word: τὸν καρπὸν τοῦτον
  choice: tunda hili
  rationale: Sitiari ya Paulo ya ‘tunda’ imehifadhiwa; hapa inamaanisha matokeo halisi ya ukarimu wa waumini wa mataifa, yaani mchango wao.
- source_word: ἀπελεύσομαι
  choice: nitaondoka kwenda
  rationale: Inawasilisha kuondoka kwa Paulo na kuendelea kwake kuelekea mahali pengine.
- source_word: δι’ ὑμῶν
  choice: nikipitia kwenu
  rationale: διά pamoja na hali ya umilikaji hapa inaeleza kupita kwa njia ya mahali walipo wasomaji, yaani Roma, bila kulazimisha wazo la msaada wao kuwa maana pekee.
- source_word: εἰς Σπανίαν
  choice: kwenda Hispania
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha mahali safari inakoelekea.
theological_decisions:
- issue: Maana ya sitiari ‘kulitia muhuri tunda hili’ kuhusu mchango wa Yerusalemu
  choice: Kuhifadhi sitiari ya kutia muhuri katika maandishi makuu
  alternative: kuwafikishia salama mchango huu
  rationale: Kuhifadhi sitiari kunabaki karibu na σφραγίζω na kuacha wazi iwapo mkazo ni kukabidhi rasmi, kuthibitisha, au kuhakikisha kuwa wapokeaji wameupata mchango. Tanbihi inafafanua uwezekano huo bila kuufanya kuwa maana pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Sitiari ya awali imehifadhiwa, huku tanbihi zikisaidia kueleza maana inayowezekana.
