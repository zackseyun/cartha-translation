  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imeachwa ikiendelea kwa koma kwa sababu aya hii ni sehemu ya sentensi inayoendelea katika aya inayofuata; marudio ya “kwa kuwa” yanaweka wazi uhusiano wa vishazi bila kuondoa mvutano wa muundo wa Kigiriki.
