  text: νυνὶ δὲ μηκέτι τόπον ἔχων ἐν τοῖς κλίμασι τούτοις, ἐπιποθίαν δὲ ἔχων τοῦ ἐλθεῖν πρὸς ὑμᾶς ἀπὸ ⸀ἱκανῶν ἐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/023.yaml
  text: But now[a], no longer having any place in these regions, but having had a longing for many years to come to you,
translation:
  language: sw
  text: Lakini sasa, kwa kuwa sina tena nafasi[a] katika maeneo haya, na kwa kuwa nimekuwa nikitamani kuja kwenu kwa miaka mingi,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nafasi ya kuendelea kufanya huduma katika maeneo haya”; usemi wa Kigiriki unaweza kumaanisha kwamba hakukuwa tena na wigo wa huduma huko, si kwamba Paulo hakuwa na mahali halisi.
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: Lakini sasa
  rationale: Inaonyesha mgeuko wa hoja pamoja na hali ya Paulo ya wakati huo kwa Kiswahili cha kawaida.
- source_word: μηκέτι
  choice: sina tena
  rationale: Inaonyesha kwamba hali iliyokuwapo hapo awali sasa imekoma.
- source_word: τόπον ἔχων
  choice: kwa kuwa sina ... nafasi
  rationale: “Nafasi” inadumisha upana wa nahau ya Kigiriki, ambayo katika muktadha inaweza kumaanisha fursa au wigo uliobaki wa huduma, si mahali halisi tu.
- source_word: ἐν τοῖς κλίμασι τούτοις
  choice: katika maeneo haya
  rationale: “Maeneo” ni tafsiri ya kawaida ya sehemu pana za kijiografia zinazokusudiwa hapa.
- source_word: ἐπιποθίαν ... ἔχων
  choice: kwa kuwa nimekuwa nikitamani
  rationale: Muundo huu unaonyesha tamaa kubwa iliyoendelea kwa muda, kwa Kiswahili cha asili na kinachoeleweka.
- source_word: τοῦ ἐλθεῖν πρὸς ὑμᾶς
  choice: kuja kwenu
  rationale: Inafuata kwa karibu maana ya kitenzi cha Kigiriki bila kuongeza dhana ya ziara ambayo haijasemwa wazi.
- source_word: ἀπὸ ἱκανῶν ἐτῶν
  choice: kwa miaka mingi
  rationale: Hii ni njia ya kawaida ya Kiswahili ya kueleza muda ulioanzia zamani na kuendelea hadi sasa.
