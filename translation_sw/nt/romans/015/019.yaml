  text: ἐν δυνάμει σημείων καὶ τεράτων, ἐν δυνάμει ⸀πνεύματος· ὥστε με ἀπὸ Ἰερουσαλὴμ καὶ κύκλῳ μέχρι τοῦ Ἰλλυρικοῦ πεπληρωκέναι τὸ εὐαγγέλιον τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/019.yaml
  text: by the power of signs and wonders[a], by the power of the Spirit, so that from Jerusalem and all around as far as Illyricum I have fully proclaimed the gospel of the Messiah[b],
translation:
  language: sw
  text: kwa nguvu za ishara na maajabu, kwa nguvu za Roho[a], hata kwamba kutoka Yerusalemu na maeneo yote yanayoizunguka hadi Iliriko, nimehubiri Injili ya Masihi kikamilifu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Roho Mtakatifu.”
    reason: alternative_reading
  - marker: b
    text: Au, “nimeitimiza Injili ya Masihi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν δυνάμει
  choice: kwa nguvu za
  rationale: Kirai hiki kinachorudiwa kinaonyesha njia au uwezo uliotenda; “kwa nguvu za” ni Kiswahili cha kawaida kinachohifadhi msisitizo wa utendaji wenye nguvu.
- source_word: σημείων καὶ τεράτων
  choice: ishara na maajabu
  rationale: Huu ni muungano wa maneno wa kibiblia unaorejelea matendo yasiyo ya kawaida yanayothibitisha utendaji wa Mungu.
- source_word: πνεύματος
  choice: Roho
  rationale: Katika muktadha huu neno hilo linaelekea kumrejelea Roho Mtakatifu, lakini “Roho” haliongezi kivumishi ambacho hakipo katika matini kuu ya Kigiriki.
- source_word: ὥστε
  choice: hata kwamba
  rationale: Kiunganishi hiki kinaonyesha matokeo ya huduma iliyowezeshwa na nguvu zilizotajwa.
- source_word: ἀπὸ Ἰερουσαλὴμ καὶ κύκλῳ
  choice: kuanzia Yerusalemu na katika maeneo yote ya kandokando
  rationale: κύκλῳ limetumiwa kielezi kuonyesha maeneo yanayozunguka Yerusalemu katika maelezo mapana ya kijiografia.
- source_word: μέχρι τοῦ Ἰλλυρικοῦ
  choice: hadi Iliriko
  rationale: μέχρι huonyesha mpaka wa kijiografia wa huduma ya Paulo.
- source_word: πεπληρωκέναι
  choice: nimeihubiri kikamilifu
  rationale: Katika muunganiko wake na “Injili,” kitenzi hiki kinaweza kumaanisha kuifikisha au kuitangaza Injili kwa ukamilifu katika eneo lote; tafsiri hii ni ya kawaida na inaeleweka katika Kiswahili.
- source_word: τὸ εὐαγγέλιον
  choice: Injili
  rationale: “Injili” ni neno fupi, lililozoeleka, na linaloeleweka katika muktadha wa Paulo.
- source_word: τοῦ Χριστοῦ
  choice: ya Masihi
  rationale: Hapa Χριστός linafanya kazi kama cheo chenye maana, kwa hiyo “Masihi” linaonyesha maana hiyo wazi.
theological_decisions:
- issue: Mrejelewa wa πνεύματος
  choice: Roho, akieleweka kuwa Roho Mtakatifu
  alternative: Roho Mtakatifu; au roho kwa maana ya jumla
  rationale: Muktadha wa ishara, maajabu, na huduma yenye nguvu unaunga mkono rejeo kwa Roho Mtakatifu, huku matini kuu ikiepuka kuongeza “Mtakatifu” moja kwa moja.
- issue: Maana ya πεπληρωκέναι τὸ εὐαγγέλιον
  choice: nimeihubiri kikamilifu Injili
  alternative: nimeitimiza Injili
  rationale: Kirai hicho kinaweza kueleza kuieneza Injili kikamilifu katika eneo lote, lakini maana ya karibu zaidi ya “kutimiza” imehifadhiwa katika tanbihi ili kutoficha mvutano wa kileksika.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Majina “Yerusalemu” na “Iliriko” yametumiwa kwa maumbo yaliyozoeleka; mpangilio wa kijiografia na urudiaji wa “kwa nguvu za” umehifadhiwa.
source_grounding:
  english_pob_role: consult_only
