  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οὕτως δὲ ⸀φιλοτιμούμενον εὐαγγελίζεσθαι οὐχ ὅπου ὠνομάσθη Χριστός, ἵνα μὴ ἐπ’ ἀλλότριον θεμέλιον οἰκοδομῶ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/020.yaml
  text: And in this way I make it my ambition to proclaim the good news[a], not where Messiah has already been named[b], so that I might not build on another's foundation.
translation:
  language: sw
  text: Na nimekuwa nikilenga kutangaza habari njema, si mahali ambapo Masihi[a] alikuwa ametajwa tayari, ili nisijenge juu ya msingi wa mwingine.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kristo.” Neno la Kigiriki Χριστός ni cheo chenye maana ya “Masihi.”
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως δὲ
  choice: Kwa njia hiyo
  rationale: Huunganisha kauli hii na maelezo yaliyotangulia kuhusu huduma ya Paulo; δὲ ni kiunganishi hafifu kisichohitaji kuonyeshwa kwa neno tofauti.
- source_word: φιλοτιμούμενον
  choice: nimefanya kuwa lengo langu
  rationale: Huonyesha azimio na tamaa ya dhati ya Paulo, si amri kwa wahudumu wote.
- source_word: εὐαγγελίζεσθαι
  choice: kutangaza habari njema
  rationale: Huhifadhi maana ya kitenzi cha kutangaza ujumbe mwema kwa lugha ya sasa iliyo wazi.
- source_word: οὐχ ὅπου ὠνομάσθη Χριστός
  choice: si mahali ambapo Masihi amekwisha kutajwa
  rationale: Huhifadhi ukanushi wa mahali na kauli tendwa ya ‘kutajwa’; ‘amekwisha’ huonyesha kwamba kutajwa huko kulitangulia kazi aliyokusudia Paulo.
- source_word: Χριστός
  choice: Masihi
  rationale: Hapa neno linatumika kama cheo cha yule anayetangazwa, kwa hiyo ‘Masihi’ linaweka wazi maana ya cheo hicho.
- source_word: ἵνα μὴ
  choice: ili nisi-
  rationale: Huonyesha kusudi lenye ukanushi kwa njia ya kawaida katika Kiswahili.
- source_word: ἐπ’ ἀλλότριον θεμέλιον
  choice: juu ya msingi wa mtu mwingine
  rationale: Huhifadhi sitiari ya ujenzi na maana ya msingi ulio wa mwingine bila kuongeza jinsia isiyotajwa katika Kigiriki.
- source_word: οἰκοδομῶ
  choice: nijenge
  rationale: Huhifadhi picha halisi ya kujenga inayolingana na ‘msingi’.
theological_decisions:
- issue: Tafsiri ya Χριστός
  choice: Masihi
  alternative: Kristo
  rationale: Katika muktadha huu neno linafanya kazi kama cheo cha yule ambaye hajapata kutangazwa katika maeneo hayo; tanbihi inahifadhi tafsiri ya jadi ‘Kristo’.
- issue: Upeo wa kanuni ya huduma ya Paulo
  choice: Kauli imewasilishwa kama lengo binafsi la Paulo
  alternative: Kuifanya kuwa marufuku kwa wahudumu wote kufanya kazi mahali ambapo Masihi amekwisha kujulikana
  rationale: Kitenzi kinaonyesha azimio la Paulo mwenyewe; tafsiri haibadilishi mkakati wake kuwa amri ya jumla.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa msomaji wa kawaida. Muundo wa sitiari ya ‘kujenga juu ya msingi’ umehifadhiwa.
