  text: ὅσα γὰρ προεγράφη, ⸀εἰς τὴν ἡμετέραν διδασκαλίαν ⸀ἐγράφη, ἵνα διὰ τῆς ὑπομονῆς καὶ διὰ τῆς παρακλήσεως τῶν γραφῶν τὴν ἐλπίδα ἔχωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/004.yaml
  text: For whatever was written beforehand was written for our instruction[b][a], so that through the endurance and through the encouragement of the Scriptures we might have hope.
translation:
  language: sw
  text: Kwa maana yote yaliyoandikwa zamani yaliandikwa kwa ajili ya kutufundisha, ili kwamba kwa uvumilivu na kwa faraja[a] ya Maandiko tupate kuwa na tumaini.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutia moyo kwa Maandiko”; neno la Kigiriki linaweza kumaanisha faraja, kutia moyo, au himizo.
    reason: lexical_alternative
  - marker: b
    text: Au, “ili tuwe na tumaini.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσα
  choice: yote yaliyoandikwa
  rationale: Kiwakilishi cha wingi wa kati kina maana pana ya mambo yote; muundo huu ni wa asili katika Kiswahili na unaungana vizuri na kitenzi cha kuandika.
- source_word: προεγράφη
  choice: yaliyoandikwa zamani
  rationale: Huhifadhi maana ya kuandikwa hapo awali, hapa ikirejelea Maandiko ya zamani, bila kudokeza maana nyingine ya kutangazwa hadharani.
- source_word: εἰς τὴν ἡμετέραν διδασκαλίαν
  choice: ili kutufundisha
  rationale: εἰς pamoja na nomino hii huonyesha kusudi au matokeo; usemi huu ni wa kawaida na unaonyesha lengo la kutupatia mafundisho.
- source_word: ἐγράφη
  choice: yaliandikwa
  rationale: Kurudia mzizi wa 'kuandika' kunadumisha msisitizo wa kimtindo uliomo katika Kigiriki.
- source_word: ἵνα
  choice: kusudi
  rationale: Huonyesha wazi lengo la yaliyoandikwa na kudumisha nguvu ya kusudi katika sentensi.
- source_word: διὰ τῆς ὑπομονῆς
  choice: kwa njia ya uvumilivu
  rationale: ὑπομονή ni kustahimili kwa subira katika shida; 'uvumilivu' ni neno la kawaida, lenye heshima, na linafaa katika muktadha.
- source_word: διὰ τῆς παρακλήσεως τῶν γραφῶν
  choice: kwa njia ya faraja ya Maandiko
  rationale: παράκλησις inaweza kumaanisha faraja, kutia moyo, au himizo. 'Faraja' inafaa katika muktadha wa kudumisha tumaini, huku tanbihi ikihifadhi maana mbadala.
- source_word: τῶν γραφῶν
  choice: ya Maandiko
  rationale: Katika matumizi ya Paulo, γραφαί hurejelea maandiko matakatifu yanayotambuliwa; herufi kubwa inaonyesha rejeleo hilo.
- source_word: τὴν ἐλπίδα
  choice: tumaini
  rationale: Kiswahili cha kawaida hakihitaji kuonyesha kibainishi cha Kigiriki mbele ya nomino hii dhahania.
- source_word: ἔχωμεν
  choice: tuwe na
  rationale: Huwakilisha hali tegemezi baada ya ἵνα kwa Kiswahili cha asili, bila kuongeza kiwango cha shaka kisichokuwamo katika kusudi la Kigiriki.
theological_decisions:
- issue: Jinsi Maandiko yanavyohusiana na uvumilivu, faraja, na tumaini
  choice: Muundo unaweka 'ya Maandiko' pamoja moja kwa moja na 'faraja,' kama mlolongo wa Kigiriki, bila kufafanua kupita kiasi kama uvumilivu pia umetolewa na Maandiko.
  alternative: Kutafsiri wazi kwamba Maandiko ndiyo chanzo cha uvumilivu na faraja zote mbili.
  rationale: Kigiriki kinaruhusu utofauti fulani katika uhusiano wa virai hivi. Tafsiri inahifadhi mpangilio na mvutano huo badala ya kuamua kimafundisho jambo ambalo sentensi hailisemi wazi kabisa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Marudio ya 'yaliyoandikwa' yamehifadhiwa kwa ajili ya msisitizo wa kifungu. 'Maandiko' limetumiwa kama jina linalorejelea maandiko matakatifu.
