reference: Romans 15:29
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οἶδα δὲ ὅτι ἐρχόμενος πρὸς ὑμᾶς ἐν πληρώματι ⸀εὐλογίας Χριστοῦ ἐλεύσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/029.yaml
  text: And I know that when I come to you[a], I will come in the fullness of the blessing of Messiah.
translation:
  language: sw
  text: Nami ninajua kwamba nitakapokuja kwenu, nitakuja katika utimilifu wa baraka ya Masihi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “baraka ya Kristo.”
    reason: Namna mbadala ya kutaja Χριστοῦ kwa neno la Kiswahili lililonakiliwa badala ya kutafsiri cheo hicho kuwa “Masihi.”
lexical_decisions:
- source_word: οἶδα
  choice: ninajua
  rationale: Kitenzi hiki kinaonyesha ujuzi au uhakika wa Paulo; “ninajua” kinahifadhi dai lake la uhakika bila kulilegeza kuwa maoni tu.
- source_word: δὲ
  choice: Nami
  rationale: Hapa δέ ni kiunganishi chepesi kinachoendeleza hoja, si lazima kionyeshe upinzani. “Nami” ni cha asili katika Kiswahili na kinaunganisha sentensi na muktadha.
- source_word: ἐρχόμενος πρὸς ὑμᾶς
  choice: nitakapokuja kwenu
  rationale: Kirai shirikishi kina maana ya wakati kuhusiana na kitenzi kikuu cha wakati ujao. “Nitakapokuja kwenu” kinaeleza uhusiano huo kwa Kiswahili cha kawaida.
- source_word: ἐλεύσομαι
  choice: nitakuja
  rationale: Wakati ujao wa ἔρχομαι unaeleza moja kwa moja kuja kwa Paulo; “nitakuja” ndilo tafsiri ya wazi na ya moja kwa moja.
- source_word: ἐν πληρώματι
  choice: katika utimilifu
  rationale: Tafsiri hii inahifadhi taswira ya πλήρωμα ya ukamilifu au wingi kamili, badala ya kuibadili kuwa maelezo tambarare.
- source_word: εὐλογίας
  choice: wa baraka
  rationale: Nomino ya umoja imehifadhiwa, na muundo wa Kiswahili unaonyesha kwamba utimilifu huo una sifa au maudhui ya baraka.
- source_word: Χριστοῦ
  choice: ya Masihi
  rationale: Χριστός hapa inafanya kazi kama cheo cha kimasiya; “Masihi” huhifadhi maana ya cheo hicho katika Kiswahili.
theological_decisions:
- issue: Tafsiri ya Χριστοῦ
  choice: Masihi
  alternative: Kristo
  rationale: “Masihi” hutafsiri maana ya cheo Χριστός badala ya kukitumia kama jina lililonakiliwa. “Kristo” limetolewa katika tanbihi kama namna mbadala iliyozoeleka bila kubadili dai la kifungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka. Muundo “katika utimilifu wa baraka” umehifadhi sitiari ya Kigiriki ingawa ni wa juu kidogo kuliko usemi wa kila siku.
