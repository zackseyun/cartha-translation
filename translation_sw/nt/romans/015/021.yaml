  text: 'but as it is written: Those who were not told about him will see[b][a], and those who have not heard will understand.'
translation:
  language: sw
  text: 'Lakini, kama ilivyoandikwa: “Wale ambao hawakutangaziwa habari kumhusu wataona,[a][b] na wale ambao hawajasikia wataelewa.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Paulo ananukuu Isaya 52:15. Katika muktadha wa Isaya, kiwakilishi “yeye” kinamrejelea yule mtumishi; Paulo anatumia nukuu hii katika maelezo yake kuhusu kutangaza habari njema.
    reason: cross_reference
  - marker: b
    text: 'Au: “Wale ambao hawakutangaziwa chochote kumhusu wataona ... na wale ambao hawajasikia wataelewa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Lakini
  rationale: Inaonyesha tofauti na kauli iliyotangulia kuhusu lengo la huduma ya Paulo; ‘Lakini’ ni kiunganishi cha kawaida na cha asili hapa.
- source_word: καθὼς γέγραπται
  choice: kama ilivyoandikwa
  rationale: Ni usemi wa kawaida wa kutambulisha nukuu ya Maandiko; unawasilisha hali timilifu ya tendo-tendwa kwa Kiswahili cha kawaida.
- source_word: Οἷς οὐκ ἀνηγγέλη περὶ αὐτοῦ
  choice: Wale ambao hawakuambiwa habari zake
  rationale: Muundo huu wa Kiswahili unawasilisha kwa ufasaha kiwakilishi cha uhusiano katika hali ya yambwa isiyo ya moja kwa moja pamoja na kitenzi cha kutangazwa na kirai ‘kumhusu yeye,’ bila kupanua utambulisho wa anayerejelewa.
- source_word: ὄψονται
  choice: wataona
  rationale: Maana ya moja kwa moja ya kitenzi imehifadhiwa, badala ya kuitafsiri kiufafanuzi kuwa ‘watatambua,’ kwa kuwa mstari unaofuata tayari unataja kuelewa.
- source_word: οἳ οὐκ ἀκηκόασιν
  choice: wale ambao hawajasikia
  rationale: Wakati timilifu wa Kigiriki unaonyesha hali ya sasa inayotokana na kutosikia; ‘hawajasikia’ huwasilisha hilo kwa kawaida.
- source_word: συνήσουσιν
  choice: wataelewa
  rationale: Ni tafsiri ya moja kwa moja, wazi na ya kawaida ya ahadi ya kinabii.
theological_decisions:
- issue: Anayerejelewa na αὐτοῦ (‘yeye’) katika nukuu ya Isaya kama Paulo anavyoitumia
  choice: Kudumisha kiwakilishi katika ‘habari zake’ bila kukipanua kuwa ‘Masihi’ au ‘Kristo.’
  alternative: ‘habari za Masihi’ au ‘habari za Kristo’
  rationale: Andiko la Kigiriki lina kiwakilishi tu. Kukipanua kungesuluhisha kiufafanuzi jambo ambalo nukuu yenyewe huliacha kwa muktadha; tanbihi inaeleza uhusiano wake na mtumishi wa Isaya na matumizi ya Paulo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ‘hawakuambiwa habari zake’ ni wa kawaida kwa wasomaji wengi, huku tanbihi ikihifadhi muundo wa karibu zaidi na Kigiriki. Alama zote za tanbihi zimewekwa katika matini kuu.
