  text: Therefore I also was often hindered from coming to you[a].
translation:
  language: sw
  text: Kwa sababu hiyo pia nilizuiwa mara nyingi kuja kwenu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mara nyingi sana” au “tena na tena”; msemo wa Kigiriki τὰ πολλὰ unaonyesha jambo lililotokea mara kwa mara.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὸ
  choice: Kwa sababu hiyo
  rationale: Huonyesha hitimisho linalotokana na maelezo yaliyotangulia, na hudumisha uhusiano huo wa kimantiki kwa Kiswahili cha kawaida.
- source_word: καὶ
  choice: pia
  rationale: Huongeza hali binafsi ya Paulo kwenye hoja iliyotangulia.
- source_word: ἐνεκοπτόμην
  choice: nilizuiwa
  rationale: Hali ya kitenzi cha wakati uliopita usiotimilika huonyesha kuzuiwa kulikotokea tena na tena au kwa kuendelea, bila kutaja kisichotajwa katika Kigiriki kuhusu aliyemzuia.
- source_word: τὰ πολλὰ
  choice: mara nyingi
  rationale: Ni msemo wa kielezi unaoonyesha kurudiwa mara kwa mara; hapa haumaanishi 'kwa sehemu kubwa.'
- source_word: τοῦ ἐλθεῖν
  choice: kuja
  rationale: Infinitivu yenye kibainishi baada ya kitenzi cha kuzuia hueleza jambo ambalo Paulo alizuiwa kufanya; muundo 'nilizuiwa ... kuja' ni wazi na wa asili katika Kiswahili.
- source_word: πρὸς ὑμᾶς
  choice: kwenu
  rationale: Huonyesha mwendo kuelekea kwa waamini wa Roma; 'kuja kwenu' ni usemi mfupi na wa kawaida.
