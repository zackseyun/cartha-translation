  text: εὐδόκησαν γὰρ Μακεδονία καὶ Ἀχαΐα κοινωνίαν τινὰ ποιήσασθαι εἰς τοὺς πτωχοὺς τῶν ἁγίων τῶν ἐν Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/026.yaml
  text: For Macedonia and Achaia were pleased to make a certain contribution for the poor among the saints in Jerusalem[a].
translation:
  language: sw
  text: Kwa maana Makedonia na Akaya walipendezwa kutoa mchango fulani kwa ajili ya maskini miongoni mwa watakatifu walioko Yerusalemu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kutoa msaada kama ishara ya ushirika”; usemi wa Kigiriki unasisitiza ushirika unaoonyeshwa kwa msaada wa mali.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐδόκησαν
  choice: walipendezwa
  rationale: Kitenzi hiki kinaonyesha uamuzi wa hiari ulioambatana na nia njema; “walipendezwa” huhifadhi mtazamo huo chanya bila kuifanya kuwa amri.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Kiunganishi hiki kinatoa sababu au maelezo ya kauli iliyotangulia.
- source_word: Μακεδονία καὶ Ἀχαΐα
  choice: Makedonia na Akaya
  rationale: Majina ya maeneo yamehifadhiwa kama yalivyo katika Kigiriki, yakitumika kimajazi kuwataja waamini wa huko bila kuongeza waziwazi “makanisa” au “waamini.”
- source_word: κοινωνίαν τινὰ ποιήσασθαι
  choice: kutoa mchango fulani
  rationale: Katika muktadha wa ukusanyaji wa msaada, kirai hiki kinamaanisha ushirika unaoonyeshwa kwa kutoa msaada wa mali. “Fulani” huakisi kutokubainishwa kwa τινά.
- source_word: εἰς τοὺς πτωχοὺς
  choice: kwa ajili ya maskini
  rationale: εἰς inaonyesha walengwa au manufaa ya mchango, na “maskini” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: τῶν ἁγίων
  choice: miongoni mwa watakatifu
  rationale: Hufafanua kwamba maskini hao ni sehemu ya kundi la watakatifu, jina la kawaida la Paulo kwa waamini.
- source_word: τῶν ἐν Ἰερουσαλήμ
  choice: walioko Yerusalemu
  rationale: Kirai hiki kinawatambulisha watakatifu kwa mahali walipo na kinatafsirika kwa kawaida katika Kiswahili.
theological_decisions:
- issue: Tafsiri ya ἅγιοι katika matumizi ya Paulo
  choice: watakatifu
  alternative: watu watakatifu wa Mungu; waamini
  rationale: “Watakatifu” huhifadhi istilahi muhimu ya Paulo kwa jumuiya ya waamini bila kuiwekea maana ya baadaye ya kutangazwa rasmi kuwa mtakatifu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Umoja wa kisarufi katika majina ya maeneo umelegezwa kimajazi kwa kutumia “walipendezwa,” kwa kuwa maeneo hayo yanawakilisha jumuiya za watu.
