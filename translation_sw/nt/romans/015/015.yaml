  text: ⸀τολμηρότερον δὲ ἔγραψα ⸀ὑμῖν ἀπὸ μέρους, ὡς ἐπαναμιμνῄσκων ὑμᾶς, διὰ τὴν χάριν τὴν δοθεῖσάν μοι ⸀ὑπὸ τοῦ θεοῦ
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/015.yaml
  text: But I have written to you rather boldly in part, as reminding you again, because of the grace given to me by God,
translation:
  language: sw
  text: Lakini nimewaandikia kwa ujasiri zaidi kwa sehemu,[a] kama mtu anayewakumbusha tena, kwa sababu ya neema niliyopewa na Mungu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nimewaandikia kwa ujasiri zaidi kuhusu mambo fulani.” Maneno ya Kigiriki yanaweza kumaanisha kwamba Paulo aliandika kwa ujasiri mkubwa zaidi, au kwamba aliandika kwa ujasiri kuhusu mambo fulani.
    reason: lexical_alternative
  - marker: b
    text: Katika muktadha huu, “neema niliyopewa na Mungu” inahusu huduma au utume ambao Mungu alimpa Paulo, si neema kwa maana ya jumla tu.
    reason: cross_reference
lexical_decisions:
- source_word: τολμηρότερον
  choice: kwa ujasiri zaidi
  rationale: Kielezi cha kulinganisha kinaonyesha kiwango kikubwa cha ujasiri; tafsiri hii inadumisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: δὲ
  choice: Lakini
  rationale: Kinaonyesha ugeuko mdogo wa hoja baada ya sifa zilizotangulia.
- source_word: ἔγραψα
  choice: nimewaandikia
  rationale: Kauli ya wakati uliopita katika muktadha wa barua inawasilishwa kwa hali timilifu ya Kiswahili, na kiambishi -wa- kinawakilisha ὑμῖν.
- source_word: ἀπὸ μέρους
  choice: kwa sehemu
  rationale: Inahifadhi uwezekano wa kumaanisha kwa kiasi fulani au kuhusu mambo fulani bila kuamua maana moja kimya kimya.
- source_word: ὡς ἐπαναμιμνῄσκων ὑμᾶς
  choice: kama mtu anayewakumbusha tena
  rationale: Muundo huu unaonyesha namna au kusudi la kuandika, huku 'tena' ikiwakilisha dhana ya kurudia iliyo katika kitenzi ambatani ἐπαναμιμνῄσκω.
- source_word: διὰ τὴν χάριν
  choice: kwa sababu ya neema
  rationale: διά pamoja na hali ya kushutumu huonyesha sababu au msingi; 'neema' ni neno pana linalofaa katika matumizi ya Paulo.
- source_word: τὴν δοθεῖσάν μοι ὑπὸ τοῦ θεοῦ
  choice: niliyopewa na Mungu
  rationale: Kauli tendwa inahifadhi Mungu kama mtendaji anayetoa neema hiyo.
theological_decisions:
- issue: Maana ya χάρις katika muktadha
  choice: neema, huku muktadha ukidokeza utume au huduma aliyopewa Paulo na Mungu
  alternative: kibali cha Mungu kwa maana ya jumla
  rationale: Mistari 15–16 inaunganisha neema hii na huduma ya Paulo kwa watu wa mataifa. Hata hivyo, maandishi makuu yanadumisha neno pana 'neema' badala ya kulibana kuwa 'utume'.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo 'kama mtu anayewakumbusha tena' ni wa asili na unaweka wazi uhusiano wa kishiriki bila kuwa mzito kupita kiasi.
