source:
  edition: SBLGNT
  text: καὶ γὰρ ὁ Χριστὸς οὐχ ἑαυτῷ ἤρεσεν· ἀλλὰ καθὼς γέγραπται· Οἱ ὀνειδισμοὶ τῶν ὀνειδιζόντων σε ἐπέπεσαν ἐπ’ ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/003.yaml
  text: For even the Messiah did not please himself[a], but as it is written, “The reproaches of those who reproached you fell on me.”
translation:
  language: sw
  text: 'Kwa maana hata Masihi[a] hakujipendeza mwenyewe; bali kama ilivyoandikwa: “Matukano ya wale waliokutukana yalinipata.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kristo.”
    reason: Tafsiri nyingine halali ya Χριστός inapotumiwa kama jina lililozoeleka zaidi kuliko cheo.
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Kwa maana hata
  rationale: “Kwa maana” linaunganisha mstari huu na himizo lililotangulia kwa kutoa msingi wake, huku “hata” likisisitiza mfano wa Masihi.
- source_word: ὁ Χριστός
  choice: Masihi
  rationale: Hapa Χριστός linafanya kazi kama cheo cha yule aliyetiwa mafuta, si hasa kama jina; “Masihi” linahifadhi maana hiyo.
- source_word: οὐχ ἑαυτῷ ἤρεσεν
  choice: hakujipendeza mwenyewe
  rationale: Tafsiri hii inahifadhi kwa ufupi wazo la kitenzi ‘kupendeza’ na kiwakilishi rejezi, bila kuongeza kusudi kama ‘hakutafuta’ ambalo halijasemwa wazi katika Kigiriki.
- source_word: ἀλλὰ καθὼς γέγραπται
  choice: bali kama ilivyoandikwa
  rationale: Hii ni kauli ya kawaida ya kutanguliza nukuu ya Maandiko; “ilivyoandikwa” ni Kiswahili cha kawaida kinachowasilisha matokeo yanayoendelea ya hali timilifu γέγραπται.
- source_word: ὀνειδισμοί
  choice: matukano
  rationale: “Matukano” ni neno la sasa na linaloeleweka kwa lugha ya kudhalilisha na kulaumu kwa ukali.
- source_word: τῶν ὀνειδιζόντων σε
  choice: ya wale waliokutukana
  rationale: Muundo huu wa kawaida wa Kiswahili unahifadhi uhusiano wa moja kwa moja na “matukano” na unaonyesha kuwa ‘wewe’ ndiye aliyetukanwa.
- source_word: ἐπέπεσαν ἐπ’ ἐμέ
  choice: yalinipata
  rationale: “Yalinipata” linawasilisha kwa Kiswahili asilia wazo la matukano kumjia na kumwangukia msemaji, bila kulazimisha sitiari isiyo ya kawaida.
theological_decisions:
- issue: Tafsiri ya Χριστός
  choice: Masihi
  alternative: Kristo
  rationale: Kibainishi ὁ na matumizi ya Yesu kama mfano hapa yanaunga mkono maana ya cheo. Tanbihi inahifadhi tafsiri iliyozoeleka “Kristo” bila kuigeuza tofauti ya maandishi.
- issue: Utambulisho wa msemaji katika nukuu ya Maandiko
  choice: Nukuu imeachwa katika nafsi ya kwanza bila kumtaja msemaji kwa ufafanuzi zaidi.
  alternative: Kumtambulisha wazi ‘mimi’ kuwa Masihi/Kristo ndani ya tafsiri
  rationale: Paulo anaitumia Zaburi 69:9 kwa Masihi, lakini maneno ya nukuu yenyewe hayamtaji msemaji; tafsiri inahifadhi mvutano huo badala ya kuuingizia ufafanuzi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni mfupi kama Kigiriki; “matukano ... waliokutukana” unahifadhi urudiaji wa mzizi wa maneno katika nukuu.
