  text: Πέπεισμαι δέ, ἀδελφοί μου, καὶ αὐτὸς ἐγὼ περὶ ὑμῶν, ὅτι καὶ αὐτοὶ μεστοί ἐστε ἀγαθωσύνης, πεπληρωμένοι ⸀πάσης γνώσεως, δυνάμενοι καὶ ⸀ἀλλήλους νουθετεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/014.yaml
  text: And I myself am convinced about you[a], my brothers, that you yourselves also are full of goodness, filled with all knowledge[b], and able also to instruct one another.
translation:
  language: sw
  text: Nami mwenyewe nina hakika juu yenu, ndugu zangu,[a] kwamba ninyi wenyewe pia mmejaa wema, mmejaa maarifa yote, na mnaweza pia kuonyana.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki lililotafsiriwa “ndugu” linaweza kutumiwa kuwaambia waumini wenzake kwa pamoja, wanawake na wanaume.
    reason: lexical_alternative
  - marker: b
    text: Au “kufundishana” au “kuonyana kwa mawaidha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πέπεισμαι
  choice: nina hakika
  rationale: Kauli hii ya hali timilifu inaonyesha usadikisho thabiti unaoendelea; “nina hakika” ni Kiswahili cha kawaida na huhifadhi uhakika wa Paulo.
- source_word: δέ
  choice: Nami
  rationale: Hapa δέ ni kiunganishi cha mpito dhaifu, si upinzani mkali; “Nami” huunganisha sentensi kwa kawaida huku kikisaidia kuonyesha msisitizo wa καὶ αὐτὸς ἐγώ.
- source_word: ἀδελφοί μου
  choice: ndugu zangu
  rationale: “Ndugu” ni neno la kawaida na lenye heshima kwa waumini wenzake na linaweza kujumuisha wanaume na wanawake; umilikaji μου umehifadhiwa kwa “zangu.”
- source_word: καὶ αὐτὸς ἐγὼ
  choice: Nami mwenyewe
  rationale: Muundo huu huhifadhi nguvu ya nyongeza ya καί na msisitizo wa αὐτός pamoja na ἐγώ bila kufanya Kiswahili kuwa kizito.
- source_word: περὶ ὑμῶν
  choice: juu yenu
  rationale: Ni tafsiri ya kawaida ya περί pamoja na jenitivi katika muktadha wa kuwa na hakika kuhusu watu fulani.
- source_word: καὶ αὐτοὶ
  choice: ninyi wenyewe pia
  rationale: “Pia” huhifadhi nguvu ya nyongeza ya καί, na “wenyewe” huhifadhi msisitizo wa αὐτοί.
- source_word: μεστοί ἐστε ἀγαθωσύνης
  choice: mmejaa wema
  rationale: “Mmejaa” huwasilisha maana ya kuwa na kitu kwa wingi, na “wema” huhifadhi maana ya kimaadili ya ἀγαθωσύνη.
- source_word: πεπληρωμένοι πάσης γνώσεως
  choice: mmejazwa maarifa yote
  rationale: Kauli ya hali timilifu imehifadhiwa kwa umbo linaloonyesha hali iliyotokana na kujazwa; “maarifa yote” huacha upana wa πάσης bila kuufafanua kupita kiasi.
- source_word: δυνάμενοι
  choice: mnaweza
  rationale: Hutoa kwa uwazi uwezo unaotokana na sifa zilizotajwa kabla.
- source_word: ἀλλήλους
  choice: ninyi kwa ninyi
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha tendo la pande zote.
- source_word: νουθετεῖν
  choice: kuonyana
  rationale: “Kuonyana” hujumuisha maelekezo yenye kusahihisha, mawaidha, na tahadhari; inahifadhi ukali wa kirekebisho wa kitenzi kuliko “kufundishana” pekee.
theological_decisions:
- issue: Wanaorejelewa na ἀδελφοί katika kusanyiko lenye wanaume na wanawake
  choice: ndugu zangu
  alternative: ndugu zangu wa kiume na wa kike
  rationale: “Ndugu” katika Kiswahili inaweza kutumiwa kwa jumuiya nzima bila kuongeza maneno yasiyopo wazi katika umbo la Kigiriki. Tanbihi inaeleza upeo wake jumuishi.
- issue: Wigo wa maana wa νουθετεῖν
  choice: kuonyana ninyi kwa ninyi
  alternative: kufundishana au kuadilishana ninyi kwa ninyi
  rationale: Kitenzi kinaweza kumaanisha kuweka jambo akilini kwa njia ya maelekezo, mawaidha, au onyo. “Kuonyana” huhifadhi hali yake ya kusahihisha, huku tanbihi ikionyesha maana mbadala.
- issue: Upeo wa πάσης γνώσεως
  choice: maarifa yote
  alternative: maarifa ya kila namna
  rationale: Tafsiri ya moja kwa moja huhifadhi madai mapana ya kifungu bila kuamua ikiwa πάσης humaanisha jumla kamili au kila aina ya maarifa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi huhifadhi marudio na misisitizo ya Kigiriki kwa kiwango kinachosikika kwa kawaida katika Kiswahili.
