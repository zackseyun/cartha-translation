  text: Ὀφείλομεν δὲ ἡμεῖς οἱ δυνατοὶ τὰ ἀσθενήματα τῶν ἀδυνάτων βαστάζειν, καὶ μὴ ἑαυτοῖς ἀρέσκειν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/001.yaml
  text: We who are strong ought to bear the weaknesses of the weak[a], and not please ourselves.
translation:
  language: sw
  text: Sisi tulio na nguvu tunapaswa kuubeba udhaifu wa wale wasio na nguvu[a], wala tusijipendeze wenyewe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mapungufu ya walio dhaifu.” Neno la Kigiriki linaweza kumaanisha udhaifu, mipaka, au mapungufu; hapa huenda linahusu vizuizi au mipaka ya dhamiri iliyojadiliwa katika sura iliyotangulia.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὀφείλομεν
  choice: tunapaswa
  rationale: Inaonyesha wajibu wa kimaadili katika sauti ya himizo bila kufanya usemi kuwa amri kali zaidi ya muundo wa Kigiriki.
- source_word: δὲ
  choice: imewakilishwa kwa mtiririko wa sentensi bila kiunganishi cha wazi
  rationale: δὲ hapa ni kiunganishi hafifu cha mpito; Kiswahili cha sasa hakihitaji lazima neno kama “basi” au “lakini,” ambalo lingeweza kuongeza hitimisho au utofautishaji usio mkali katika chanzo.
- source_word: ἡμεῖς οἱ δυνατοὶ
  choice: sisi tulio na nguvu
  rationale: Huhifadhi msisitizo wa ἡμεῖς na tofauti ya kimuktadha kati ya walio na nguvu na wasio na nguvu, hasa katika masuala ya dhamiri yaliyojadiliwa katika Waroma 14.
- source_word: τὰ ἀσθενήματα
  choice: udhaifu
  rationale: Neno hili pana linaweza kujumuisha udhaifu, mipaka, au mapungufu bila kudokeza moja kwa moja ugonjwa wa mwili au dhambi ya kimaadili.
- source_word: τῶν ἀδυνάτων
  choice: wa wale wasio na nguvu
  rationale: Hudumisha ulinganifu wa maneno na “tulio na nguvu” huku likibainisha kuwa kinachozungumziwa ni watu.
- source_word: βαστάζειν
  choice: kuyabeba
  rationale: Huhifadhi picha ya kubeba mzigo wa mwingine na ni yenye nguvu zaidi kuliko kuvumilia tu.
- source_word: καὶ μὴ ἑαυτοῖς ἀρέσκειν
  choice: wala tusijipendeze wenyewe
  rationale: “Wala” huunganisha katazo kwa kawaida, na “tusijipendeze wenyewe” huhifadhi maana ya kutojitafutia kuridhika kwetu wenyewe.
theological_decisions:
- issue: Maana ya “walio na nguvu” na “wasio na nguvu”
  choice: Maneno yameachwa kama tofauti ya nguvu na ukosefu wa nguvu, huku muktadha ukielekeza hasa kwenye nguvu au uhuru wa dhamiri miongoni mwa waamini.
  alternative: Wenye nguvu na wanyonge katika uwezo wa kijamii au afya ya mwili.
  rationale: Muktadha wa karibu katika Waroma 14 unahusu tofauti kuhusu vyakula na siku. Tafsiri haiongezi neno “dhamiri” katika mstari wenyewe, ili isifunge kabisa upana wa lugha ya Kigiriki.
- issue: Jinsi ya kuelewa βαστάζειν
  choice: “Kuyabeba” kama kuchukua mzigo wa udhaifu wa wengine kwa kuwategemeza na kujizuia kwa ajili yao.
  alternative: “Kuvumilia” kama kustahimili tu tabia au mipaka yao.
  rationale: Picha ya kubeba katika Kigiriki ina maana pana kuliko uvumilivu wa kukereka tu na inaendana na wito wa kutokujipendeza wenyewe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Sisi” imetumiwa kuhifadhi msisitizo wa kiwakilishi cha Kigiriki. Muundo wa “wala tusijipendeze wenyewe” ni wa kawaida katika lugha ya Biblia lakini bado unaeleweka kwa msomaji wa leo.
