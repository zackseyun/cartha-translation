id: ROM.15.31
reference: Romans 15:31
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἵνα ῥυσθῶ ἀπὸ τῶν ἀπειθούντων ἐν τῇ Ἰουδαίᾳ ⸀καὶ ἡ διακονία μου ἡ εἰς Ἰερουσαλὴμ εὐπρόσδεκτος ⸂τοῖς ἁγίοις γένηται⸃,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/031.yaml
  text: so that I may be rescued from those who are disobedient in Judea[a], and that my service for Jerusalem may become acceptable to the saints,
translation:
  language: sw
  text: ili niokolewe kutoka kwa wale wasiotii huko Yudea[a], na ili huduma yangu kwa ajili ya Yerusalemu ipate kukubaliwa na watakatifu,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutoka kwa wale wasioamini huko Yudea.” Neno la Kigiriki linaweza kumaanisha kukataa kuamini na hivyo kutotii.
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: ili ... na ili
  rationale: Inaonyesha makusudi mawili yaliyounganishwa ya ombi la Paulo la kuombewa, huku ikitoa Kiswahili cha kawaida na wazi.
- source_word: ῥυσθῶ
  choice: niokolewe
  rationale: Kitenzi hiki cha hali ya kutendwa kina maana ya kuondolewa au kuokolewa katika hatari; ‘niokolewe’ ni cha kawaida na hakiongezi maelezo yasiyomo.
- source_word: ἀπὸ τῶν ἀπειθούντων
  choice: kutoka kwa wale wasiotii
  rationale: ἀπειθέω inaweza kumaanisha kutotii au kutokuamini kwa kukataa kushawishika. ‘Wasiotii’ huhifadhi upana huo, na maana ya ‘wasioamini’ imewekwa katika tanbihi.
- source_word: ἐν τῇ Ἰουδαίᾳ
  choice: huko Yudea
  rationale: ‘Yudea’ ni jina la kawaida la eneo hilo katika Kiswahili; ‘huko’ linaonyesha mahali kwa mtiririko wa asili.
- source_word: διακονία
  choice: huduma
  rationale: Neno hili linaweza kutaja huduma kwa ujumla na hapa hasa tendo la Paulo la kupeleka mchango; ‘huduma’ huhifadhi maana pana bila kuifanya iwe ya kitaasisi tu.
- source_word: ἡ εἰς Ἰερουσαλήμ
  choice: kwa ajili ya Yerusalemu
  rationale: Kifungu kinaeleza huduma iliyoelekezwa Yerusalemu; ‘kwa ajili ya’ huwasilisha kwa kawaida kusudi au walengwa wa huduma hiyo.
- source_word: εὐπρόσδεκτος
  choice: kukubaliwa
  rationale: Huwasilisha maana ya kupokewa kwa kibali au kuwa yenye kukubalika katika muktadha wa watakatifu kuipokea huduma hiyo.
- source_word: τοῖς ἁγίοις
  choice: na watakatifu
  rationale: ‘Watakatifu’ huhifadhi istilahi ya kawaida ya Paulo kwa waumini. Muundo wa Kiswahili ‘kukubaliwa na’ huonyesha kwa usahihi wahusika wanaoikubali huduma.
- source_word: γένηται
  choice: ipate kukubaliwa
  rationale: ‘Ipate’ hudokeza jambo linalotarajiwa kutokea na hivyo kuhifadhi kwa kiasi nguvu ya γίνομαι ya kuja kuwa, badala ya hali tuli tu.
theological_decisions:
- issue: Maana ya ἀπειθούντων kuhusu wapinzani wa Paulo huko Yudea
  choice: wale wasiotii
  alternative: wale wasioamini
  rationale: Neno la Kigiriki linaweza kuunganisha kukataa kuamini na kutotii. Matini kuu imehifadhi maana pana ya kutotii, huku maana ya kutokuamini ikitolewa katika tanbihi ili kutatua kimabavu utata huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo unahifadhi sentensi tegemezi inayoendelea kutoka muktadha wa mstari uliotangulia.
