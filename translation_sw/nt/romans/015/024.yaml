  text: ὡς ⸀ἂν πορεύωμαι εἰς τὴν ⸀Σπανίαν, ἐλπίζω γὰρ διαπορευόμενος θεάσασθαι ὑμᾶς καὶ ὑφ’ ὑμῶν προπεμφθῆναι ἐκεῖ ἐὰν ὑμῶν πρῶτον ἀπὸ μέρους ἐμπλησθῶ—
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/024.yaml
  text: whenever I go to Spain—for I hope[a], as I pass through, to see you and to be sent on my way there by you[c][b], if first I may be satisfied in part with your company—
translation:
  language: sw
  text: nitakapokwenda Hispania[a]—kwa maana ninatumaini kwamba, nipitapo, nitawaona na kusaidiwa nanyi kuendelea na safari yangu kwenda huko[b], ikiwa kwanza nitatosheka kwa kiasi fulani kwa kuwa pamoja nanyi[c]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakati nitakapokwenda Hispania.” Muundo wa Kigiriki unaonyesha wakati ujao ambao haujaainishwa.
    reason: lexical_alternative
  - marker: b
    text: Au, “kusindikizwa nanyi kwenda huko.” Kitenzi kinaweza kumaanisha kusaidiwa au kuandamana na mtu katika hatua inayofuata ya safari.
    reason: lexical_alternative
  - marker: c
    text: Kigiriki kwa tafsiri sisisi ni “ikiwa kwanza nitajazwa kwa kiasi fulani nanyi.” Huenda kinamaanisha kufurahia ushirika wao kwa muda mfupi kabla ya kuendelea na safari.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς ἂν πορεύωμαι
  choice: nitakapokwenda
  rationale: Muundo huu unaonyesha wakati ujao usioainishwa kwa uhakika. “Nitakapokwenda” ni Kiswahili cha kawaida kinachohifadhi maana ya wakati ujao bila kudokeza safari za mara kwa mara.
- source_word: Σπανίαν
  choice: Hispania
  rationale: Hili ndilo umbo la kawaida la jina la mahali hapo katika Kiswahili cha kibiblia na matumizi mapana ya Kiswahili.
- source_word: ἐλπίζω γὰρ
  choice: kwa maana ninatumaini kwamba
  rationale: “Kwa maana” huhifadhi kazi ya γάρ ya kutoa maelezo, na “ninatumaini” huonyesha matarajio yenye shauku.
- source_word: διαπορευόμενος
  choice: nikipitia huko
  rationale: Huonyesha kwamba Roma ingekuwa njiani kuelekea mahali pengine, bila kuifanya kuwa mwisho wa safari.
- source_word: θεάσασθαι ὑμᾶς
  choice: nitawaona
  rationale: Tafsiri ya moja kwa moja na ya kawaida inayodokeza kukutana nao bila kuongeza maelezo yasiyotajwa.
- source_word: ὑφ’ ὑμῶν προπεμφθῆναι ἐκεῖ
  choice: kusaidiwa nanyi kuendelea na safari yangu kwenda huko
  rationale: Kitenzi kinaweza kuhusisha kuandaliwa, kusaidiwa, au kusindikizwa katika hatua inayofuata ya safari. Wording hii huhifadhi maana pana bila kutaja aina mahususi ya msaada.
- source_word: ἐὰν ... ἐμπλησθῶ
  choice: ikiwa ... nitatosheka
  rationale: “Ikiwa” huhifadhi sharti la wakati ujao, huku “nitatosheka” ikitoa kwa Kiswahili cha asili sitiari ya kujazwa au kuridhishwa.
- source_word: ἀπὸ μέρους
  choice: kwa kiasi fulani
  rationale: Huhifadhi ukomo unaoonyeshwa na usemi wa Kigiriki bila kuamua kama unahusu muda mfupi au kutotosheka kikamilifu.
- source_word: ὑμῶν
  choice: kwa kuwa pamoja nanyi
  rationale: Katika muktadha huu kiwakilishi hicho kinahusu kufurahia uwepo au ushirika wao; usemi huu ni wa kawaida kuliko tafsiri sisisi isiyoeleweka.
theological_decisions:
- issue: Aina ya msaada ambao Paulo alitarajia kutoka kwa waamini wa Roma
  choice: kusaidiwa nanyi kuendelea na safari yangu
  alternative: kusindikizwa nanyi kwenda huko
  rationale: Maandishi hayabainishi kama msaada huo ulikuwa wa fedha, maandalizi, au kusindikizwa. Tafsiri imeacha aina yake wazi.
- issue: Maana ya Paulo kutosheka na Waroma kwa kiasi fulani
  choice: nitatosheka kwa kiasi fulani kwa kuwa pamoja nanyi
  alternative: nijazwe kwa kiasi fulani nanyi
  rationale: Tafsiri iliyochaguliwa ni ya kawaida katika Kiswahili na inadumisha wazo la kuridhishwa pamoja na ukomo wa ἀπὸ μέρους, bila kuamua ikiwa ukomo huo hasa ni wa muda au wa kiwango cha furaha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Sentensi imeachwa na vistari virefu mwanzoni na mwishoni kwa sababu mstari huu ni sehemu ya sentensi inayoendelea katika muktadha. “Hispania” limetumiwa kama jina la kawaida la kibiblia la Spain.
