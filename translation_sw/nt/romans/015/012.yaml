base_translation:
  language: en
  yaml_path: translation/nt/romans/015/012.yaml
  text: And again Isaiah says, “The root of Jesse will be, and the one who rises to rule the Gentiles; in him the Gentiles will hope.”
translation:
  language: sw
  text: Na tena Isaya anasema, “Litakuwapo shina la Yese, na yeye ainukaye kutawala mataifa; mataifa yatamtumaini yeye.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ ῥίζα τοῦ Ἰεσσαί
  choice: shina la Yese
  rationale: Neno ῥίζα kwa kawaida ni ‘mzizi’, lakini katika taswira ya ukoo linaweza kumaanisha chanzo au chipukizi la kifalme. ‘Shina la Yese’ ni usemi wa kibiblia unaoeleweka kwa urahisi na kuhifadhi taswira ya nasaba bila kuifafanua kupita kiasi.
- source_word: ὁ ἀνιστάμενος
  choice: yeye ainukaye
  rationale: Huhifadhi muundo wa kishiriki na wazo la kuinuka au kujitokeza, bila kulibana kuwa rejeo la moja kwa moja la ufufuo.
- source_word: ἄρχειν ἐθνῶν
  choice: kutawala mataifa
  rationale: ἄρχειν hapa ni kutawala; ἐθνῶν inaweza kumaanisha mataifa au watu wa mataifa. ‘Mataifa’ linafaa katika muktadha wa Waroma 15 na hudumisha urudiaji wa neno hilo.
- source_word: ἐπ’ αὐτῷ ... ἐλπιοῦσιν
  choice: yatamtumaini yeye
  rationale: Katika Kiswahili cha kawaida, ‘kumtumaini’ huwasilisha kwa asili tumaini linalowekwa kwa mtu. Kiwakilishi ‘yeye’ kinasisitiza rejeo kama ilivyo katika Kigiriki.
theological_decisions:
- issue: Uhusiano kati ya ‘shina la Yese’ na ‘yeye ainukaye’
  choice: Zimetafsiriwa kama maelezo yanayofuatana kuhusu mtu yuleyule, lakini kwa koma badala ya kuongeza ‘yaani’.
  alternative: ‘Litakuwapo shina la Yese, yaani, yeye atakayeinuka...’
  rationale: Kigiriki kina καί, ‘na’, na hakitumii kiashirio cha ufafanuzi wazi. Tafsiri haipaswi kutatua kimyakimya sintaksia yenye mvutano kwa kuongeza ‘yaani’.
- issue: Ikiwa ἀνιστάμενος inamaanisha ufufuo
  choice: ‘ainukaye’
  alternative: ‘afufukaye’
  rationale: Kitenzi kinaweza kuhusishwa na kuinuka au kujitokeza ili kutawala. Kutafsiri ‘kufufuka’ kungeingiza ufafanuzi mahususi ambao muktadha wa nukuu haulazimishi.
- issue: Utambulisho wa ἐθνῶν kama watu wasio Wayahudi
  choice: ‘mataifa’
  alternative: ‘watu wa Mataifa’
  rationale: ‘Mataifa’ huhifadhi upana wa neno la Kigiriki na mwangwi wa unabii bila kulifanya kuwa istilahi ya kiufafanuzi pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya usomaji wa Maandiko lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa kishairi wa nukuu umehifadhiwa bila kutumia lugha ya kale kupita kiasi.
