id: ROM.15.16
reference: Romans 15:16
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἰς τὸ εἶναί με λειτουργὸν ⸂Χριστοῦ Ἰησοῦ⸃ εἰς τὰ ἔθνη, ἱερουργοῦντα τὸ εὐαγγέλιον τοῦ θεοῦ, ἵνα γένηται ἡ προσφορὰ τῶν ἐθνῶν εὐπρόσδεκτος, ἡγιασμένη ἐν πνεύματι ἁγίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/016.yaml
  text: to be a minister of Messiah Jesus to the Gentiles[a], serving as a priest in the gospel of God, so that the offering of the Gentiles may become acceptable[d][c][b], sanctified by the Holy Spirit.
translation:
  language: sw
  text: ili niwe mhudumu wa Masihi Yesu kwa watu wa mataifa[a], nikiihudumia Injili ya Mungu kwa huduma ya kikuhani[b], ili sadaka ya watu wa mataifa[c] iwe ya kukubalika, ikiwa imetakaswa kwa Roho Mtakatifu[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa mataifa.”
    reason: lexical_alternative
  - marker: b
    text: Au, “nikiihudumia Injili ya Mungu kama kuhani” au “nikifanya huduma ya kikuhani ya Injili ya Mungu.”
    reason: lexical_alternative
  - marker: c
    text: Inaelekea kuwa watu wa mataifa wenyewe ndio wanaotolewa kwa Mungu kama sadaka; maana nyingine inayowezekana ni “sadaka iliyotolewa na watu wa mataifa.”
    reason: alternative_reading
  - marker: d
    text: Au, “katika Roho Mtakatifu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λειτουργὸν
  choice: mhudumu
  rationale: Neno hili linaonyesha mtu anayefanya huduma, hasa huduma yenye muktadha wa kidini. “Mhudumu” ni la kawaida na lenye heshima, huku taswira ya ukuhani ikifafanuliwa na kitenzi kinachofuata.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Masihi Yesu
  rationale: Χριστός hapa lina nguvu ya cheo; “Masihi” linaonyesha maana ya Mtiwa-Mafuta badala ya kulichukulia tu kama jina la kawaida.
- source_word: εἰς τὰ ἔθνη
  choice: kwa watu wa mataifa
  rationale: Katika muktadha wa Waroma, ἔθνη kwa kawaida ni watu wasio Wayahudi. Usemi huu ni wazi kwa msomaji wa Kiswahili, huku “kwa mataifa” likihifadhiwa kama badala ya moja kwa moja zaidi.
- source_word: ἱερουργοῦντα
  choice: nikifanya huduma ya ukuhani
  rationale: Kitenzi hiki kina taswira dhahiri ya kikuhani. Tafsiri hii huihifadhi bila kudai kwamba Paulo alikuwa na cheo rasmi cha ukuhani.
- source_word: τὸ εὐαγγέλιον τοῦ θεοῦ
  choice: Injili ya Mungu
  rationale: “Injili” ni istilahi ya kawaida na inayoeleweka katika Kiswahili cha Kikristo, na muundo “ya Mungu” unahifadhi uhusiano ulio katika Kigiriki.
- source_word: προσφορὰ τῶν ἐθνῶν
  choice: sadaka ya watu wa mataifa
  rationale: Muundo huu unahifadhi utata wa genitivi ya Kigiriki. Muktadha unaelekea kumaanisha watu wa mataifa wenyewe kama sadaka, lakini pia unaweza kueleweka kuwa sadaka inayotolewa nao.
- source_word: εὐπρόσδεκτος
  choice: ya kukubalika
  rationale: Usemi huu ni wa asili katika Kiswahili na unafaa kwa sadaka inayopokelewa kwa kibali na Mungu.
- source_word: ἡγιασμένη
  choice: ikiwa imetakaswa
  rationale: Huu unaonyesha hali iliyotokana na tendo la kutakasa au kuweka wakfu, na unadumisha msamiati wa utakatifu wa Paulo.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: kwa njia ya Roho Mtakatifu
  rationale: Hapa ἐν linaweza kuonyesha njia au mtendaji wa kutakaswa. Uwezekano wa maana ya “katika Roho Mtakatifu” umehifadhiwa katika tanbihi.
theological_decisions:
- issue: Paulo kujieleza kwa lugha ya ukuhani
  choice: Paulo anaeleza huduma yake ya kitume kwa watu wa mataifa kwa taswira ya ukuhani.
  alternative: Kuisoma kama dai la cheo rasmi cha ukuhani, au kuondoa kabisa taswira ya kikuhani.
  rationale: Mchanganyiko wa λειτουργός, ἱερουργέω, na προσφορά unahitaji taswira ya ukuhani ihifadhiwe. Hata hivyo, kifungu kinazungumzia huduma ya Injili na watu wa mataifa kama sadaka, si dhabihu ya upatanisho inayotolewa na Paulo.
- issue: Sadaka ya watu wa mataifa ni nini
  choice: Inaelekea kuwa watu wa mataifa wenyewe wanaotolewa kwa Mungu kama sadaka inayotokana na huduma ya Injili.
  alternative: Sadaka iliyotolewa na watu wa mataifa.
  rationale: Muktadha wa huduma ya Paulo na taswira ya ukuhani unaunga mkono maana ya kwanza, lakini muundo wa Kigiriki unaruhusu maana ya pili; kwa hiyo utata haujaondolewa katika matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Taswira ya ukuhani na utata wa “sadaka ya watu wa mataifa” zimehifadhiwa bila kuingiza cheo cha baadaye cha kikanisa au msimamo wa dhehebu.
