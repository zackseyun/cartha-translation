  text: ἵνα ὁμοθυμαδὸν ἐν ἑνὶ στόματι δοξάζητε τὸν θεὸν καὶ πατέρα τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/006.yaml
  text: so that with one accord and with one mouth you may glorify the God and Father of our Lord Jesus the Messiah[a][b].
translation:
  language: sw
  text: ili kwa moyo mmoja na kwa kinywa kimoja mmtukuze Mungu na Baba wa Bwana wetu Yesu Masihi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au kwa usemi wa kawaida zaidi, “kwa sauti moja.” Kiyunani kinasema “kwa kinywa kimoja,” kikisisitiza sifa inayotolewa kwa umoja.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: ili
  rationale: Huonyesha kusudi au matokeo yanayotokana na himizo lililotangulia, kwa Kiswahili cha kawaida na wazi.
- source_word: ὁμοθυμαδόν
  choice: kwa moyo mmoja
  rationale: Huwasilisha umoja wa nia na kusudi; pia hutofautishwa kwa uwazi na taswira inayofuata ya 'kinywa kimoja.'
- source_word: ἐν ἑνὶ στόματι
  choice: kwa kinywa kimoja
  rationale: Inahifadhi taswira halisi ya Kiyunani ya sifa inayotolewa kwa umoja, badala ya kuibadilisha moja kwa moja kuwa 'kwa sauti moja.'
- source_word: δοξάζητε
  choice: mpate kumtukuza
  rationale: Muundo huu unaendana na hali tegemezi baada ya ἵνα na unaonyesha kusudi; 'kumtukuza' ni neno la kawaida na lenye hadhi katika muktadha wa ibada.
- source_word: τὸν θεὸν καὶ πατέρα
  choice: Mungu na Baba
  rationale: Kifungu kimoja cha Kiyunani kinaunganisha majina hayo kwa karibu, kikimtaja yule yule kuwa Mungu na Baba bila kulazimisha ufafanuzi zaidi.
- source_word: τοῦ κυρίου ἡμῶν
  choice: wa Bwana wetu
  rationale: Huhifadhi cheo κύριος na kiwakilishi cha umiliki kwa njia ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesu Masihi
  rationale: Χριστός ni cheo chenye maana ya Masihi; Kiswahili hakihitaji kiambishi cha ufafanuzi sawa na 'the' ya Kiingereza ili kuonyesha cheo hicho baada ya jina.
theological_decisions:
- issue: Tafsiri ya Χριστοῦ katika Ἰησοῦ Χριστοῦ
  choice: Yesu Masihi
  alternative: Yesu Kristo
  rationale: Neno la Kiyunani Χριστός linatafsiriwa kwa maana ya cheo chake, 'Masihi,' badala ya kunukuliwa tu kama 'Kristo'; hii haitoi tafsiri ya kimadhehebu bali huhifadhi maana ya neno la chanzo.
- issue: Uhusiano wa τὸν θεὸν καὶ πατέρα
  choice: Mungu na Baba wa Bwana wetu Yesu Masihi
  alternative: Mungu, yaani Baba wa Bwana wetu Yesu Masihi
  rationale: Muundo wa chanzo unaweza kueleweka kama usemi mmoja unaomhusisha Mungu na Baba; tafsiri kuu huhifadhi uratibu huo bila kuufanya kwa lazima kuwa maelezo ya 'yaani.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Kwa moyo mmoja' ni usemi wa kawaida unaoonyesha umoja wa nia, huku 'kwa kinywa kimoja' ikihifadhi taswira ya chanzo. Alama ya tanbihi [a] imewekwa katika matini kuu.
