  text: Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί, διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ καὶ διὰ τῆς ἀγάπης τοῦ πνεύματος συναγωνίσασθαί μοι ἐν ταῖς προσευχαῖς ὑπὲρ ἐμοῦ πρὸς τὸν θεόν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/030.yaml
  text: I urge you[a], brothers, through our Lord Jesus the Messiah and through the love of the Spirit, to strive together with me in prayers to God for me[c][b],
translation:
  language: sw
  text: Nawasihi, ndugu[b], kwa Bwana wetu Yesu Masihi[a] na kwa upendo wa Roho[c], mjitahidi pamoja nami katika sala kwa Mungu kwa ajili yangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Kristo.” Neno la Kigiriki Christos ni cheo kinachomaanisha “Mtiwa-Mafuta” au “Masihi.”
    reason: alternative_reading
  - marker: b
    text: Neno la Kigiriki lililotafsiriwa “ndugu” lina umbo la kiume la wingi, lakini huenda linawahusu waamini wote, yaani ndugu wa kiume na wa kike.
    reason: lexical_alternative
  - marker: c
    text: Au “upendo wa Roho mwenyewe” au “upendo unaotokana na Roho.” Muundo wa Kigiriki unaweza kueleweka kwa zaidi ya njia moja.
    reason: alternative_reading
lexical_decisions:
- source_word: Παρακαλῶ
  choice: Nawasihi
  rationale: Kitenzi hiki kinaonyesha ombi la dhati na lenye uzito; “nawasihi” ni Kiswahili cha kawaida, chenye heshima na kinachohifadhi nguvu ya wito wa Paulo.
- source_word: δὲ
  choice: (hakikutafsiriwa kwa neno tofauti)
  rationale: Hapa δέ ni kiunganishi chepesi cha mpito, si tofauti kali wala neno la wakati. Mtiririko wa Kiswahili unaeleweka bila kuongeza “sasa” au “lakini”.
- source_word: ἀδελφοί
  choice: ndugu
  rationale: “Ndugu” ni namna ya kawaida ya kulihutubia jumuiya ya waamini kwa Kiswahili. Neno hili halionyeshi jinsia kwa umbo lake, kwa hiyo tanbihi inaeleza umbo la kiume la Kigiriki na uwezekano wa kuhusisha jumuiya nzima.
- source_word: διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: kwa Bwana wetu Yesu Masihi
  rationale: “Kwa” linaonyesha msingi au njia ya kusihi na pia linaruhusu urudiaji wa διά katika kishazi kinachofuata. Χριστός limetafsiriwa kama cheo “Masihi.”
- source_word: ἀγάπης τοῦ πνεύματος
  choice: upendo wa Roho
  rationale: 'Muundo wa “wa Roho” unahifadhi utata wa genitivi ya Kigiriki: unaweza kuwa upendo wa Roho mwenyewe au upendo unaotokana na Roho.'
- source_word: συναγωνίσασθαί μοι
  choice: mpambane pamoja nami
  rationale: “Mpambane” linahifadhi wazo la jitihada kubwa, na “pamoja nami” linaonyesha wazi kiambishi συν- cha kushiriki juhudi hiyo.
- source_word: ἐν ταῖς προσευχαῖς
  choice: katika sala
  rationale: Hili linafuata kwa karibu maana ya “katika sala” bila kuongeza kimilikishi kisichopo katika Kigiriki.
- source_word: ὑπὲρ ἐμοῦ πρὸς τὸν θεόν
  choice: kwa Mungu kwa ajili yangu
  rationale: “Kwa Mungu” linaonyesha mahali sala zinapoelekezwa, na “kwa ajili yangu” linaonyesha maombezi kwa niaba ya Paulo.
theological_decisions:
- issue: Rejeo la τοῦ πνεύματος
  choice: Roho, yaani Roho Mtakatifu
  alternative: roho ya mwanadamu au roho kwa maana isiyo ya nafsi
  rationale: Katika matumizi ya Paulo, rejeo linalowezekana zaidi ni Roho Mtakatifu. Herufi kubwa inaonyesha hilo, huku muundo wa genitivi ukiachwa wazi.
- issue: Tafsiri ya Χριστοῦ
  choice: Masihi
  alternative: Kristo
  rationale: Χριστός hapa ni cheo cha Yesu kinachomaanisha Mtiwa-Mafuta. “Kristo” limewekwa katika tanbihi kama istilahi ya jadi inayojulikana.
- issue: Wanaohutubiwa kwa ἀδελφοί
  choice: ndugu
  alternative: ndugu wa kiume na wa kike
  rationale: Kigiriki kina umbo la kiume la wingi, lakini huenda kinahutubia jumuiya yote ya waamini. Kiswahili “ndugu” ni la asili na halilazimishi jinsia; tanbihi inahifadhi maelezo ya umbo la chanzo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. “Mpambane pamoja nami” kimetumiwa kudumisha nguvu ya picha ya juhudi ya pamoja, bila kufanya sala ionekane kuwa mapambano ya kimwili. Alama zote za tanbihi zimewekwa karibu na maneno yanayohusika.
