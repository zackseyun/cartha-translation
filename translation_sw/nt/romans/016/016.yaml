id: ROM.16.16
reference: Romans 16:16
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἀσπάσασθε ἀλλήλους ἐν φιλήματι ἁγίῳ. Ἀσπάζονται ὑμᾶς αἱ ἐκκλησίαι ⸀πᾶσαι τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/016.yaml
  text: Greet one another with a holy kiss[b][a]. All the churches of Messiah greet you.
translation:
  language: sw
  text: Salimianeni kwa busu takatifu.[a] Makanisa yote ya Masihi[b] yanawasalimu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Busu takatifu” lilikuwa salamu iliyotambulika katika utamaduni huo, likionyesha upendo safi na ushirika miongoni mwa waumini.
    reason: cultural_note
  - marker: b
    text: Au, “Kristo.”
    reason: translation_alternative
lexical_decisions:
- source_word: Ἀσπάσασθε ἀλλήλους
  choice: Salimianeni
  rationale: Kitenzi cha kuamuru pamoja na kiwakilishi cha kutendeana kimewasilishwa kwa umbo la kutendeana la Kiswahili, linalomaanisha ‘salimuni ninyi kwa ninyi’ kwa ufupi na kwa kawaida.
- source_word: ἐν φιλήματι ἁγίῳ
  choice: kwa busu takatifu
  rationale: ‘Kwa’ linaonyesha namna au njia ya salamu; ‘busu takatifu’ linahifadhi maana ya φίλημα ἅγιον bila kuifanya kuwa amri ya aina nyingine ya salamu.
- source_word: Ἀσπάζονται ὑμᾶς
  choice: yanawasalimu
  rationale: Muundo huu wa sasa unafaa kwa salamu za barua; kiambishi ‘-wa-’ kinaonyesha wazi kwamba wanaosalimiwa ni wengi.
- source_word: αἱ ἐκκλησίαι πᾶσαι
  choice: Makanisa yote
  rationale: 'Huhifadhi msisitizo wa πᾶσαι pamoja na nomino yenye kibainishi: makanisa hayo yote.'
- source_word: τοῦ Χριστοῦ
  choice: ya Masihi
  rationale: Χριστός hapa ni cheo chenye maana ya Mtiwa-Mafuta na pia huonyesha uhusiano au kumilikiwa; ‘ya Masihi’ ni Kiswahili cha kawaida kinachohifadhi maana ya cheo hicho.
theological_decisions:
- issue: Jinsi ya kutafsiri Χριστοῦ
  choice: Masihi
  alternative: Kristo
  rationale: ‘Masihi’ huonyesha wazi maana ya cheo Χριστός katika kirai ‘makanisa ya Masihi’; tanbihi inahifadhi tafsiri ya jadi ‘Kristo’ bila kudai kuwa kuna tofauti ya maandishi ya Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. ‘Salimianeni’ ni cha asili na huunganisha kwa usahihi wazo la kuamuru pamoja na kutendeana. Alama za tanbihi zimewekwa mara tu baada ya maneno yanayofafanuliwa.
