lexical_decisions:
- source_word: οἵτινες
  choice: ambao
  rationale: Inaendeleza kifungu cha maelezo kuhusu Priska na Akila kwa njia ya kawaida katika Kiswahili.
- source_word: ὑπὲρ τῆς ψυχῆς μου
  choice: kwa ajili ya uhai wangu
  rationale: Katika muktadha huu ψυχή humaanisha uhai wa Paulo, si nafsi isiyo ya kimwili.
- source_word: τὸν ἑαυτῶν τράχηλον ὑπέθηκαν
  choice: waliweka shingo zao wenyewe hatarini
  rationale: Inahifadhi picha halisi ya shingo huku ikieleza kwa Kiswahili cha kawaida kwamba walijitia katika hatari ya kufa.
- source_word: οἷς οὐκ ἐγὼ μόνος εὐχαριστῶ ἀλλὰ καὶ
  choice: Si mimi peke yangu ninayewashukuru, bali pia
  rationale: Inahifadhi msisitizo wa kwamba Paulo si yeye pekee anayewashukuru.
- source_word: πᾶσαι αἱ ἐκκλησίαι
  choice: makanisa yote
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya wingi wenye kibainishi.
- source_word: τῶν ἐθνῶν
  choice: ya watu wasio Wayahudi
  rationale: Katika matumizi ya Paulo, ἔθνη hapa huelekea kumaanisha watu wa mataifa mengine kwa kulinganishwa na Wayahudi; usemi huu unaeleweka wazi kwa msomaji wa kawaida.
theological_decisions:
- issue: Maana ya ψυχή katika kauli ya Paulo
  choice: uhai
  alternative: nafsi
  rationale: Muktadha unahusu kujitia katika hatari ya kufa kwa ajili ya Paulo, hivyo maana ya msingi hapa ni uhai wake.
- issue: Maana ya ἐθνῶν
  choice: watu wasio Wayahudi
  alternative: mataifa
  rationale: Hii inadhihirisha wazi tofauti ya Wayahudi na watu wa mataifa mengine katika muktadha wa Waroma bila kuingiza msimamo wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mgawanyo kuwa sentensi mbili unaondoa mfuatano mzito bila kubadili uhusiano wa kisarufi; picha ya “shingo” imehifadhiwa na maana ya hatari imewekwa wazi.
