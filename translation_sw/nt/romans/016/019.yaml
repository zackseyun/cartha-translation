  text: ἡ γὰρ ὑμῶν ὑπακοὴ εἰς πάντας ἀφίκετο· ⸂ἐφ’ ὑμῖν οὖν χαίρω⸃, θέλω δὲ ὑμᾶς ⸀σοφοὺς εἶναι εἰς τὸ ἀγαθόν, ἀκεραίους δὲ εἰς τὸ κακόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/019.yaml
  text: For your obedience has reached everyone[a]. Therefore I rejoice over you, but I want you to be wise in what is good[c][b], and innocent in what is evil.
translation:
  language: sw
  text: Kwa maana utii wenu umeenea kwa watu wote.[a] Kwa hiyo ninawafurahia,[b] lakini nataka muwe wenye hekima katika mema, na wasio na hila katika maovu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “umefika kwa wote,” yaani, habari za utii wenu zimejulikana kwa watu wote.
    reason: lexical_alternative
  - marker: b
    text: Au, “ninafurahi kwa sababu yenu.”
    reason: lexical_alternative
  - marker: c
    text: Au, “bila hatia” au “safi” katika maovu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπακοή
  choice: utii
  rationale: Katika matumizi ya Paulo, neno hili humaanisha kuitikia kwa kutii, si kusikia tu.
- source_word: εἰς πάντας ἀφίκετο
  choice: umeenea kwa watu wote
  rationale: Kigiriki kinasema kihalisi kwamba utii wao ‘umewafikia wote’; katika muktadha, maana ni kwamba habari za utii huo zimejulikana kwa mapana. ‘Umeenea kwa watu wote’ ni Kiswahili cha kawaida kinachohifadhi picha ya kufika bila kudai kila mtu mmoja mmoja.
- source_word: ἐφ’ ὑμῖν ... χαίρω
  choice: ninawafurahia
  rationale: Muundo huu unaweza kueleza watu ambao ndio sababu au jambo la furaha; ‘ninawafurahia’ ni wa asili na huhifadhi mtazamo chanya wa Paulo kwao.
- source_word: σοφοὺς ... εἰς τὸ ἀγαθόν
  choice: na hekima kuhusu mema
  rationale: Hueleza utambuzi wa busara unaoelekezwa kwenye yaliyo mema.
- source_word: ἀκεραίους ... εἰς τὸ κακόν
  choice: bila hila kuhusu maovu
  rationale: ἀκέραιος inaweza kumaanisha safi, isiyochanganywa, isiyo na hila, au isiyo na hatia. ‘Bila hila’ huhifadhi maana ya kutokuchafuliwa na uovu bila kudokeza ujinga au kutokuwa na uelewa.
theological_decisions:
- issue: Upeo wa πάντας katika sifa hii
  choice: watu wote
  alternative: wote; imejulikana kwa wote
  rationale: Kauli ni ya kusifu na ina nguvu ya balagha, ikionyesha sifa iliyoenea sana badala ya dai la kihesabu kuhusu kila mwanadamu.
- issue: Tofauti kati ya σοφούς na ἀκεραίους
  choice: na hekima kuhusu mema, na bila hila kuhusu maovu
  alternative: wenye hekima katika mema, na wasio na hatia katika maovu
  rationale: Huhifadhi mvutano kati ya utambuzi hai wa mema na kutotiwa doa na maovu, bila kugeuza wito huo kuwa fundisho la ujinga au urahisi wa kudanganywa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Mema’ na ‘maovu’ yanadumisha ulinganifu wa vifungu vya Kigiriki; viashiria vya tanbihi vimewekwa baada ya kila sehemu inayohusika.
