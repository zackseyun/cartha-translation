    text: Au, “umefika kwa wote,” yaani, habari za utii wenu zimejulikana kwa watu wote.
    reason: lexical_alternative
  - marker: b
    text: Au, “ninafurahi kwa sababu yenu.”
    reason: lexical_alternative
  - marker: c
    text: Au, “bila hatia” au “safi” katika maovu.
    reason: lexical_alternative
  revision_rationale: 'The revision improves natural Standard East African Swahili and restores the Greek''s balanced syntax: σοφοὺς ... εἰς τὸ ἀγαθόν / ἀκεραίους ... εἰς τὸ κακόν. It retains the broad, rhetorical force of “watu wote,” Paul’s positive rejoicing over the recipients, and the non-doctrinal moral contrast between discernment for good and guilelessness regarding evil. Footnote c is adjusted to match the revised preposition and anchor.'
