revisions:
- from: Kwa maana utii wenu umeenea kwa watu wote.[a] Kwa hiyo ninawafurahia,[b] lakini nataka muwe na hekima kuhusu mema, na bila hila kuhusu maovu.[c]
  to: Kwa maana utii wenu umeenea kwa watu wote.[a] Kwa hiyo ninawafurahia,[b] lakini nataka muwe wenye hekima katika mema, na wasio na hila katika maovu.[c]
  rationale: 'The revision improves natural Standard East African Swahili and restores the Greek''s balanced syntax: σοφοὺς ... εἰς τὸ ἀγαθόν / ἀκεραίους ... εἰς τὸ κακόν. It retains the broad, rhetorical force of “watu wote,” Paul’s positive rejoicing over the recipients, and the non-doctrinal moral contrast between discernment for good and guilelessness regarding evil. Footnote c is adjusted to match the revised preposition and anchor.'
