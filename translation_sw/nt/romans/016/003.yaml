  text: Ἀσπάσασθε Πρίσκαν καὶ Ἀκύλαν τοὺς συνεργούς μου ἐν Χριστῷ Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/003.yaml
  text: Greet Prisca and Aquila[a], my fellow workers in Messiah Jesus[b],
translation:
  language: sw
  text: Wasalimuni Priska[a] na Akila, watenda kazi wenzangu katika Masihi Yesu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Priska ndilo umbo la jina lililo katika mstari huu; Priskila ni umbo linalofahamika zaidi linalotumiwa mahali pengine kumtaja mtu huyu huyu.
    reason: alternative_reading
  - marker: b
    text: Au, “katika Kristo Yesu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάσασθε
  choice: Wasalimuni
  rationale: Ni amri ya wingi inayotumiwa kwa kawaida katika barua kuagiza salamu zifikishwe; “wasalimuni” ni tafsiri fupi na ya kawaida katika Kiswahili.
- source_word: Πρίσκαν
  choice: Priska
  rationale: Jina limeandikwa katika chanzo kama Πρίσκα; “Priska” linahifadhi umbo hilo badala ya umbo linalofahamika zaidi, “Priskila.”
- source_word: Ἀκύλαν
  choice: Akila
  rationale: Hili ni umbo la kawaida la Kiswahili la jina la Kigiriki Ἀκύλας.
- source_word: συνεργούς μου
  choice: watenda kazi wenzangu
  rationale: Usemi huu unaonyesha watu wanaofanya kazi pamoja na Paulo katika huduma au utume mmoja; “watenda kazi wenzangu” ni wa asili na huhifadhi wazo la ushirikiano.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: katika Masihi Yesu
  rationale: Kirai hiki kinaonyesha mazingira au muungano ambamo kazi yao ya pamoja hufanyika. “Masihi” linadhihirisha nguvu ya Χριστός kama cheo, huku tafsiri ya jadi “Kristo” ikiwekwa katika tanbihi.
theological_decisions:
- issue: Tafsiri ya Χριστῷ katika usemi wa Paulo ἐν Χριστῷ Ἰησοῦ
  choice: Masihi
  alternative: Kristo
  rationale: Katika muktadha huu Χριστός bado linaweza kueleweka kama cheo cha Yesu, hivyo “Masihi Yesu” huhifadhi maana hiyo. Kwa kuwa “Kristo Yesu” pia ni usemi uliozoeleka na unaowezekana, umeonyeshwa katika tanbihi bila kuondoa mvutano wa kileksia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. “Wasalimuni” hudumisha amri kwa wasomaji wengi, na “watenda kazi wenzangu” huepuka lugha ya kibiashara au ya kizamani.
