  text: ἀσπάσασθε ⸀Μαριάμ, ἥτις πολλὰ ἐκοπίασεν εἰς ⸀ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/006.yaml
  text: Greet Mary[a], who has worked very hard for you.
translation:
  language: sw
  text: Msalimuni Mariamu[a], ambaye amefanya kazi kwa bidii sana kwa ajili yenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati zina “kwa ajili yetu” au “miongoni mwenu” badala ya “kwa ajili yenu.”
    reason: textual_variant
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Msalimuni
  rationale: Ni amri kwa wingi ya kutoa salamu katika muktadha wa barua; “Msalimuni” ni kauli fupi, ya kawaida na yenye heshima katika Kiswahili.
- source_word: Μαριάμ
  choice: Mariamu
  rationale: “Mariamu” ni umbo la jina hili lililozoeleka katika Kiswahili cha Biblia na linaakisi Μαριάμ kwa uwazi.
- source_word: ἥτις
  choice: ambaye
  rationale: Kiwakilishi hiki kinaanzisha maelezo kuhusu Mariamu; “ambaye” ni tafsiri ya asili bila kulazimisha mkazo wa ziada.
- source_word: πολλὰ
  choice: sana
  rationale: Hapa limetumiwa kielezi kuonyesha kiwango kikubwa cha kazi; pamoja na “kwa bidii,” neno “sana” linawasilisha uzito wake kwa Kiswahili cha kawaida.
- source_word: ἐκοπίασεν
  choice: amefanya kazi kwa bidii
  rationale: Kitenzi κοπιάω humaanisha kufanya kazi inayochosha au kujitahidi sana. Kauli hii ni ya kawaida na inahifadhi dhana ya juhudi kubwa.
- source_word: εἰς ὑμᾶς
  choice: kwa ajili yenu
  rationale: Katika muktadha huu εἰς pamoja na watu inaeleweka kiasili kuwa kazi iliyoelekezwa kwa manufaa yao. Tafsiri hii hufuata usomaji wa SBLGNT, ὑμᾶς.
theological_decisions:
- issue: Tofauti ya matini katika kirai cha mwisho
  choice: kwa ajili yenu
  alternative: kwa ajili yetu; miongoni mwenu
  rationale: Matini ya SBLGNT ina εἰς ὑμᾶς, “kwa ajili yenu.” Baadhi ya hati zina εἰς ἡμᾶς, “kwa ajili yetu,” au ἐν ὑμῖν, “miongoni mwenu.” Matini kuu hufuata chanzo kilichotolewa, huku tofauti hizo zikihifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo “amefanya kazi kwa bidii sana” unasikika wa asili na kuhifadhi nguvu ya κοπιάω pamoja na πολλὰ.
