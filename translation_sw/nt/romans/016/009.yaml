  text: ἀσπάσασθε Οὐρβανὸν τὸν συνεργὸν ἡμῶν ἐν Χριστῷ καὶ Στάχυν τὸν ἀγαπητόν μου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/009.yaml
  text: Greet Urbanus[a], our fellow worker in Messiah, and Stachys, my beloved.
translation:
  language: sw
  text: Wasalimuni Urbano, mfanyakazi mwenzetu katika Masihi[a], na Staki, mpendwa wangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika Kristo.”
    reason: Utoaji mbadala wa Χριστῷ unaotumia umbo la jadi “Kristo” badala ya cheo “Masihi.”
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Wasalimuni
  rationale: Kitenzi cha kuamuru kwa wingi katika orodha ya salamu; ‘wasalimuni’ ni cha kawaida, wazi, na hudumisha maana ya kuwapelekea salamu.
- source_word: Οὐρβανὸν
  choice: Urbano
  rationale: Jina la mtu limetoholewa kwa namna inayosomeka kwa kawaida katika Kiswahili.
- source_word: συνεργὸν ἡμῶν
  choice: mfanyakazi mwenzetu
  rationale: Huwasilisha moja kwa moja wazo la mtu anayefanya kazi pamoja na Paulo na wenzake; kiwakilishi ‘-etu’ kinahifadhi ἡμῶν.
- source_word: ἐν Χριστῷ
  choice: katika Masihi
  rationale: ‘Masihi’ hudumisha matumizi ya Χριστός kama cheo, huku ‘katika’ ikiacha wazi maana pana ya ushirika, muungano, au eneo la utendaji linalohusiana naye.
- source_word: Στάχυν
  choice: Stakisi
  rationale: Jina la mtu limetoholewa kutoka umbo la Kigiriki kwa tahajia inayotamkika kwa Kiswahili.
- source_word: ἀγαπητόν μου
  choice: mpendwa wangu
  rationale: Huhifadhi joto la usemi na maana ya moja kwa moja ya mtu anayependwa na Paulo.
theological_decisions:
- issue: Utoaji wa Χριστῷ katika ἐν Χριστῷ
  choice: Masihi
  alternative: Kristo
  rationale: Katika kifungu hiki Χριστός bado inaweza kusikika kama cheo; ‘Masihi’ huonyesha hilo wazi. ‘Kristo’ ni utoaji wa jadi na wa kawaida, kwa hiyo umetajwa katika tanbihi bila kufuta uwezekano huo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Muundo mfupi wa orodha ya salamu umehifadhiwa, na lugha ya ushirika wa kazi pamoja na upendo wa Paulo imewasilishwa kwa kawaida.
