translation:
  language: sw
  text: kwa Mungu, yeye aliye mwenye hekima peke yake, kwa njia ya Yesu Masihi, utukufu uwe kwake milele. Amina.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mstari huu unahitimisha sifa ya mwisho (Waroma 16:25–27). Kama ilivyoelezwa katika Waroma 16:25, nafasi ambayo sifa hii huwekwa na kuwamo kwake hutofautiana sana katika hati za kale, ingawa imehifadhiwa hapa katika mapokeo ya maandishi mengi ya Kibizanti.
    reason: textual_critical
lexical_decisions:
- source_word: μόνῳ σοφῷ θεῷ
  choice: Mungu aliye peke yake mwenye hekima
  rationale: Muundo huu unaonyesha upekee wa Mungu katika hekima na kuhifadhi uhusiano wa maneno ya Kigiriki bila kutumia Kiswahili kisicho cha kawaida.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: kwa njia ya Yesu Masihi
  rationale: διά pamoja na hali ya umilikishi huonyesha njia au upatanishi; Χριστός hapa ni cheo, hivyo imetafsiriwa 'Masihi'.
- source_word: ᾧ
  choice: kwake
  rationale: Kiwakilishi hiki hakimtaji mhusika moja kwa moja, hivyo 'kwake' kinahifadhi uwezekano wa kisarufi wa kurejelea Mungu au Yesu Masihi badala ya kuamua kimya kimya.
- source_word: εἰς τοὺς αἰῶνας
  choice: milele
  rationale: Hii ni nahau ya Kigiriki yenye maana ya kudumu bila mwisho; 'milele' ni usemi wa kawaida na wenye hadhi katika Kiswahili.
- source_word: Ἀμήν
  choice: Amina
  rationale: Hii ndiyo namna iliyozoeleka katika Kiswahili kwa tamko la Kisemiti linalothibitisha yaliyosemwa.
theological_decisions:
- issue: Mhusika anayerejelewa na ᾧ ('kwake')
  choice: Kuhifadhi rejeleo lisilotajwa wazi kwa kutumia 'kwake'
  alternative: Kusema wazi 'utukufu uwe kwa Mungu' au 'utukufu uwe kwa Yesu Masihi'
  rationale: Kigiriki kina utata mdogo wa kisarufi kuhusu ikiwa kiwakilishi kinamrejelea Mungu au Yesu Kristo; tafsiri haipaswi kuutatua bila msingi wa kutosha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa heshima na unaoeleweka kwa wasomaji wa kawaida. Herufi ndogo mwanzoni inadumisha hali ya mstari huu kuwa mwendelezo wa sentensi ya sifa iliyoanza katika mstari wa 25.
