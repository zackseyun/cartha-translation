- from: Msalimieni Rufo[a], aliyechaguliwa katika Bwana, na mama yake, ambaye ni mama yangu pia.
  to: Msalimieni Rufo[a], mteule katika Bwana, na mama yake na mama yangu.
  rationale: The revision preserves the Greek’s compact appositional description of Rufus and its unexpanded final ellipsis. It also replaces the participial wording with the more source-shaped and idiomatic substantival “mteule,” without determining whether the term denotes divine election or distinguished quality.
