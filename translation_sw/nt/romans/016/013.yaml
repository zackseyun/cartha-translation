  yaml_path: translation/nt/romans/016/013.yaml
  text: Greet Rufus[a], the chosen one in the Lord, and his mother and mine.
translation:
  language: sw
  text: Msalimieni Rufo[a], mteule katika Bwana, na mama yake na mama yangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Rufo, aliyechaguliwa katika Bwana.” Neno la Kigiriki pia linaweza kumaanisha “bora” au “wa kipekee.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Msalimieni
  rationale: Ni amri ya wingi inayowataka wasomaji wamfikishie salamu; huu ndio usemi wa kawaida na mfupi katika salamu za mwisho za Paulo.
- source_word: Ῥοῦφον
  choice: Rufo
  rationale: Jina limetoholewa kwa namna inayofaa fonolojia na matumizi ya kawaida ya Kiswahili.
- source_word: τὸν ἐκλεκτὸν
  choice: aliyechaguliwa
  rationale: Huwasilisha maana ya msingi ya ‘aliyechaguliwa’ bila kutumia istilahi nzito ya kitaalamu; tanbihi inadumisha uwezekano wa maana ya ‘mteule’ au mtu bora/anayeheshimika.
- source_word: ἐν κυρίῳ
  choice: katika Bwana
  rationale: Hudumisha kwa karibu kishazi cha Kigiriki kinachoonyesha uhusiano au nyanja, bila kukibadili kuwa ‘na Bwana,’ jambo ambalo lingefasiri wakala waziwazi.
- source_word: μητέρα αὐτοῦ καὶ ἐμοῦ
  choice: mama yake, ambaye ni mama yangu pia
  rationale: Hufanya udondoshaji wa Kigiriki ueleweke kwa Kiswahili cha kawaida huku ikihifadhi lugha ya Paulo ya undugu na upendo.
theological_decisions:
- issue: Maana ya ἐκλεκτὸν ἐν κυρίῳ
  choice: Rufo anaelezwa kuwa ‘aliyechaguliwa katika Bwana.’
  alternative: ‘Mteule katika Bwana,’ au ‘mtu bora/anayeheshimika katika Bwana.’
  rationale: Kigiriki kinaweza kurejelea kuchaguliwa na Mungu au hadhi ya kuwa mtu bora na wa pekee miongoni mwa walio katika Bwana. Matini kuu na tanbihi hazifungi kauli katika mfumo mmoja mwembamba wa kiteolojia.
- issue: Maana ya μητέρα αὐτοῦ καὶ ἐμοῦ
  choice: Mama ya Rufo alikuwa kama mama kwa Paulo pia, katika maana ya uhusiano na utunzaji.
  alternative: Kwamba alikuwa mama mzazi wa Rufo na Paulo.
  rationale: Muktadha wa salamu binafsi unaunga mkono sana lugha ya kifamilia ya kimahusiano. Tafsiri inahifadhi dai la Paulo bila kulieleza kupita kiasi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. ‘Msalimieni’ linaafikiana na kundi linaloagizwa kumsalimu mtu mmoja; ‘katika Bwana’ huhifadhi tamathali na utata wa chanzo.
