  text: ἀσπάσασθε Φιλόλογον καὶ Ἰουλίαν, Νηρέα καὶ τὴν ἀδελφὴν αὐτοῦ, καὶ Ὀλυμπᾶν καὶ τοὺς σὺν αὐτοῖς πάντας ἁγίους.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/015.yaml
  text: Greet Philologus and Julia[a], Nereus and his sister, and Olympas and all the saints with them.
translation:
  language: sw
  text: Wasalimuni Filologo na Julia[a], Nerea na dada yake, na Olimpa, na watakatifu wote walio pamoja nao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au labda “Juliasi,” ikiwa jina hili linaeleweka kuwa la kiume; kwa kawaida umbo la Kigiriki linaeleweka kuwa jina la kike “Julia.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Wasalimuni
  rationale: Ni amri ya wingi ya kutoa salamu katika muktadha wa barua; “Wasalimuni” ni usemi mfupi na wa kawaida wa Kiswahili.
- source_word: Φιλόλογον
  choice: Filologo
  rationale: Jina la mtu limetoholewa kwa tahajia inayosomeka kwa kawaida katika Kiswahili.
- source_word: Ἰουλίαν
  choice: Julia
  rationale: Umbo hili la Kigiriki linaeleweka kwa kawaida kuwa jina la kike Julia; uwezekano wa jina la kiume umehifadhiwa katika tanbihi.
- source_word: Νηρέα
  choice: Nerea
  rationale: Jina la mtu limetoholewa kwa mfumo unaofaa matamshi na tahajia ya Kiswahili.
- source_word: τὴν ἀδελφὴν αὐτοῦ
  choice: dada yake
  rationale: ἀδελφή humaanisha dada, na αὐτοῦ hapa kwa kawaida humrejelea Nerea; Kiswahili cha asili hutumia “dada yake.”
- source_word: Ὀλυμπᾶν
  choice: Olimpa
  rationale: Jina la mtu limetoholewa moja kwa moja katika umbo linalosomeka kwa Kiswahili.
- source_word: τοὺς σὺν αὐτοῖς
  choice: walio pamoja nao
  rationale: σύν pamoja na hali ya dative huonyesha ushirika; kirai hiki kinawataja watu walio katika kundi lao.
- source_word: πάντας ἁγίους
  choice: watakatifu wote
  rationale: Katika matumizi ya Paulo, ἅγιοι ni waumini waliowekwa wakfu kwa Mungu. “Watakatifu” huhifadhi istilahi ya kawaida ya kibiblia bila kuipanua kwa maelezo ya ziada.
theological_decisions:
- issue: Tafsiri ya ἅγιοι katika orodha ya salamu ya Paulo
  choice: watakatifu
  alternative: watu watakatifu; watu wote wa Mungu
  rationale: Neno hili linawatambulisha waumini wenzake, si kundi lililotangazwa baadaye kuwa watakatifu kwa utaratibu maalumu. “Watakatifu” huhifadhi matumizi ya kawaida ya Paulo na ufupi wa chanzo.
- issue: Jinsia ya jina Ἰουλίαν
  choice: Julia
  alternative: Juliasi
  rationale: Umbo la Kigiriki linaeleweka vizuri zaidi kuwa jina la kike Julia. Kwa kuwa katika historia ya tafsiri wengine wamelichukulia kuwa jina la kiume, uwezekano huo umeonyeshwa katika tanbihi bila kuufanya kuwa tafsiri kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Majina yametoholewa kwa tahajia inayofaa Kiswahili, na mpangilio wa orodha umehifadhiwa kwa karibu huku sentensi ikibaki ya asili.
