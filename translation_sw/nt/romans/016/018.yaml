id: ROM.16.18
reference: Romans 16:18
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οἱ γὰρ τοιοῦτοι τῷ κυρίῳ ⸀ἡμῶν Χριστῷ οὐ δουλεύουσιν ἀλλὰ τῇ ἑαυτῶν κοιλίᾳ, καὶ διὰ τῆς χρηστολογίας καὶ εὐλογίας ἐξαπατῶσι τὰς καρδίας τῶν ἀκάκων.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/018.yaml
  text: For such people do not serve our Lord Messiah[a], but their own belly[c][b], and by smooth talk and flattery they deceive the hearts of the unsuspecting.
translation:
  language: sw
  text: Kwa maana watu kama hao hawamtumikii Bwana wetu Masihi[a], bali tumbo lao wenyewe[b]. Kwa maneno laini na ya kujipendekeza, wao huidanganya mioyo ya watu wasio na hila[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Bwana wetu Kristo.”
    reason: alternative_reading
  - marker: b
    text: Kigiriki ni “tumbo lao wenyewe,” taswira ya tamaa ya kujiridhisha wenyewe.
    reason: lexical_alternative
  - marker: c
    text: Au, “wasiotambua hatari”; pia yaweza kuwa “wasio na hatia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοιοῦτοι
  choice: watu kama hao
  rationale: Hurejelea watu wanaosababisha migawanyiko waliotajwa katika mstari uliotangulia; ni usemi wa kawaida unaohifadhi nguvu ya rejeleo hilo.
- source_word: κυρίῳ ἡμῶν Χριστῷ
  choice: Bwana wetu Masihi
  rationale: Κύριος limetafsiriwa kuwa “Bwana,” na Χριστός kuwa cheo “Masihi.” Jina “Yesu” halijaongezwa kwa kuwa halipo katika maandishi ya Kigiriki.
- source_word: δουλεύουσιν
  choice: hawamtumikii
  rationale: Kitenzi kina wazo la kutumikia au kuwa mtumwa wa mtu. “Kumtumikia” ni cha asili katika Kiswahili na hudumisha ulinganisho kati ya kumtumikia Bwana na kutumikia matumbo yao.
- source_word: κοιλίᾳ
  choice: matumbo yao wenyewe
  rationale: Taswira halisi ya tumbo imehifadhiwa badala ya kubadilishwa moja kwa moja kuwa “tamaa,” hivyo kuacha wazi upana wa sitiari ya Paulo kuhusu kujiridhisha mwenyewe.
- source_word: χρηστολογίας
  choice: maneno laini
  rationale: Neno hili humaanisha usemi mzuri, wenye kuvutia na unaosikika kuwa wa kupendeza; “maneno laini” ni usemi wa sasa unaofaa muktadha wa udanganyifu.
- source_word: εὐλογίας
  choice: ya kujipendekeza
  rationale: Katika muktadha huu, εὐλογία si baraka ya kweli bali usemi wa kusifu au kubembeleza kwa kusudi la kuvutia na kudanganya.
- source_word: ἐξαπατῶσι
  choice: huidanganya
  rationale: Huwasilisha wazi tendo la kuwapotosha kabisa bila kulazimisha kielezi kisicho cha asili katika Kiswahili.
- source_word: καρδίας
  choice: mioyo
  rationale: Huhifadhi sitiari ya kibiblia ya utu wa ndani badala ya kuipunguza kuwa akili pekee.
- source_word: ἀκάκων
  choice: watu wasio na hila
  rationale: Huhifadhi maana ya msingi ya kutokuwa na uovu au hila, huku tanbihi ikionyesha maana nyingine inayowezekana katika muktadha wa kudanganywa.
theological_decisions:
- issue: Jinsi ya kutafsiri Χριστός katika cheo cha Paulo
  choice: Masihi
  alternative: Kristo
  rationale: Χριστός ni cheo kinacholingana na “Masihi,” si lazima sehemu ya jina la kawaida. “Kristo,” namna ya jadi ya kunukuu neno hilo, imehifadhiwa katika tanbihi.
- issue: Maana ya sitiari ya κοιλία
  choice: Kuhifadhi “matumbo” katika matini
  alternative: tamaa zao wenyewe
  rationale: Sitiari ya Paulo inaweza kuashiria hamu ya kujiridhisha kwa upana, si ulafi wa chakula pekee. Kuihifadhi huepuka kufunga maana yake kwa fundisho moja.
- issue: Upeo wa maana ya ἀκάκων
  choice: wasio na hila
  alternative: wasiotambua hatari; wasio na hatia
  rationale: Neno linaweza kueleza kutokuwa na uovu, kutokuwa na hila, au kutoshuku. Matini kuu huhifadhi maana ya kimaadili na tanbihi huonyesha udhaifu wao kwa wadanganyifu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye hadhi na unaoeleweka. Sentensi ya Kigiriki imegawanywa mara mbili ili isomeke kwa urahisi, bila kubadili uhusiano wa hoja. Taswira ya “matumbo” na “mioyo” imehifadhiwa, huku “maneno laini na ya kujipendekeza” yakitoa maana ya usemi wenye kuvutia lakini wa udanganyifu.
