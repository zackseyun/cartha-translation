base_translation:
  language: en
  yaml_path: translation/nt/romans/016/025.yaml
  text: '[A] to him who is able to strengthen you according to my gospel and the preaching of Jesus the Messiah, according to the revelation of the mystery kept secret for long ages,'
translation:
  language: sw
  text: '[a] Kwa yeye awezaye kuwaimarisha kulingana na injili yangu na mahubiri ya Yesu Masihi, kulingana na ufunuo wa siri iliyofichwa kwa enzi nyingi zilizopita,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mistari ya 25–27 ni sifa za kumtukuza Mungu za kumalizia ambazo zinapatikana katika sehemu tofauti katika hati za kale. Katika mapokeo ya hati nyingi za Kibizanti, ziko mwishoni mwa sura ya 14; katika funjo la kale zaidi lililohifadhiwa, ziko baada ya sura ya 15; na katika hati kuu za karne ya nne pamoja na mapokeo ya Kilatini, ziko hapa mwishoni mwa sura ya 16. Baadhi ya hati huzitia katika sehemu zaidi ya moja, ilhali chache huziacha kabisa. Tafsiri nyingi za kisasa huzihifadhi hapa kuwa hitimisho la barua ya Paulo.
    reason: textual_critical
lexical_decisions:
- source_word: στηρίξαι
  choice: kuwaimarisha
  rationale: Kitenzi hiki humaanisha kuwafanya waamini wawe thabiti au imara; “kuwaimarisha” ni cha kawaida na huonyesha tendo la Mungu la kuwathibitisha katika imani.
- source_word: κήρυγμα
  choice: mahubiri
  rationale: Neno hili linamaanisha ujumbe unaotangazwa hadharani. “Mahubiri ya Yesu Masihi” ni Kiswahili cha kawaida na kinaacha wazi iwapo ni mahubiri kuhusu Yesu au yanayotokana naye.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesu Masihi
  rationale: Χριστός hapa ni cheo kinachomaanisha Masihi, si jina la ukoo; “Yesu Masihi” hulitambulisha kwa lugha ya kawaida ya Kiswahili.
- source_word: μυστηρίου
  choice: siri
  rationale: Katika muktadha huu ni kusudi au kweli ya Mungu ambayo haikuwa imefunuliwa hapo awali, si fumbo la kuteguliwa.
- source_word: σεσιγημένου
  choice: iliyonyamaziwa
  rationale: Kauli timilifu tendwa ya σιγάω inaonyesha kwamba siri hiyo haikusemwa wala kufunuliwa kwa kipindi hicho; “iliyonyamaziwa” huhifadhi picha ya msingi ya ukimya bila kuongeza kuwa ilifichwa kwa namna gani.
- source_word: χρόνοις αἰωνίοις
  choice: kwa enzi nyingi zilizopita
  rationale: Katika muktadha huu kirai kinarejelea vipindi virefu vya zamani. Uamuzi huu huepuka tafsiri isiyo ya kawaida “nyakati za milele” na huonyesha muda mrefu uliopita.
theological_decisions:
- issue: Uhusiano wa kimaana katika “κήρυγμα Ἰησοῦ Χριστοῦ”
  choice: mahubiri ya Yesu Masihi
  alternative: mahubiri kuhusu Yesu Masihi
  rationale: Muundo wa Kigiriki unaweza kueleweka kuwa mahubiri kuhusu Yesu Masihi au mahubiri yanayohusishwa naye. Kirai cha Kiswahili “ya Yesu Masihi” huhifadhi uwezekano huo badala ya kuamua kimya kimya.
- issue: Muundo wa sifa unaoendelea hadi mistari 26–27
  choice: Kwake yeye awezaye…
  alternative: Atukuzwe yeye awezaye…
  rationale: Kigiriki hakina kitenzi “atukuzwe” katika mstari huu; sentensi inaendelea hadi hitimisho la sifa katika mstari wa 27. Tafsiri inaacha kishazi hiki wazi ili kuhifadhi muundo huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa mstari umeachwa kama kishazi kinachoendelea kwa sababu sentensi ya Kigiriki inakamilika katika mstari wa 27. Kiashiria [a] kimewekwa mwanzoni ili kuonyesha kwamba tanbihi inahusu mahali pa doxolojia nzima katika mapokeo ya hati.
