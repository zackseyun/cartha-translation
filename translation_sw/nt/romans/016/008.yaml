lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Msalimuni
  rationale: Ni amri ya nafsi ya pili wingi inayotumika kawaida katika barua kuagiza salamu zifikishwe; “Msalimuni” ni tafsiri fupi na ya kawaida katika Kiswahili.
- source_word: Ἀμπλιᾶτον
  choice: Ampliatusi
  rationale: Jina limetoholewa kwa tahajia inayosomeka kiasili katika Kiswahili, huku umbo la SBLGNT Ἀμπλιᾶτον likirejeshwa kwenye umbo la jina lisilo la kisarufi.
- source_word: ἀγαπητόν μου
  choice: mpendwa wangu
  rationale: Huhifadhi kwa ufupi upendo wa Paulo na kiwakilishi cha umilikaji kilicho katika Kigiriki.
- source_word: ἐν κυρίῳ
  choice: katika Bwana
  rationale: Huhifadhi usemi wa Paulo unaoonyesha uhusiano au mazingira ya maisha ndani ya Bwana, bila kuongeza jina “Yesu” ambalo halipo katika mstari huu.
theological_decisions:
- issue: Uhusiano wa upendo wa Paulo na maana ya ἐν κυρίῳ
  choice: “mpendwa wangu katika Bwana” humtambulisha Ampliatusi kuwa mpendwa wa Paulo ndani ya ushirika unaotokana na Bwana.
  alternative: Kuelewa maneno hayo kuwa urafiki wa kawaida tu, au kuhusisha “katika Bwana” na tendo la kusalimu.
  rationale: Mpangilio wa Kigiriki unaunganisha kwa asili τὸν ἀγαπητόν μου ἐν κυρίῳ na Ampliatusi. Tafsiri hii huhifadhi uzito wa kitheolojia bila kuufafanua kupita kiasi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Msalimuni” huonyesha kwamba agizo linaelekezwa kwa watu wengi, na “katika Bwana” huhifadhi usemi wa Paulo bila ufafanuzi wa ziada.
