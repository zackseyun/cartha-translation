  text: ⸀Ἀσπάζεται ὑμᾶς Τιμόθεος ὁ συνεργός μου, καὶ Λούκιος καὶ Ἰάσων καὶ Σωσίπατρος οἱ συγγενεῖς μου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/021.yaml
  text: Timothy[a], my fellow worker, greets you, and so do Lucius and Jason and Sosipater, my kinsmen.
translation:
  language: sw
  text: Timotheo, mfanyakazi mwenzangu, anawasalimu; na Lukio, Yasoni, na Sosipatro, jamaa zangu, pia wanawasalimu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watu wa ukoo wangu” au “Wayahudi wenzangu.” Neno la Kigiriki linaweza kumaanisha watu wenye uhusiano wa kifamilia au uhusiano mpana wa ukoo au kabila.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάζεται
  choice: anawasalimu
  rationale: Katika muktadha wa barua, ἀσπάζομαι humaanisha kusalimu au kutuma salamu. ‘Anawasalimu’ ni ya kawaida katika Kiswahili na inaonyesha kwamba Timotheo ndiye kiima cha kitenzi cha umoja.
- source_word: ὑμᾶς
  choice: -wa-
  rationale: Kiwakilishi hiki ni cha nafsi ya pili wingi; kiambishi ‘-wa-’ katika ‘anawasalimu’ kinawaelekezea wapokeaji wote wa barua.
- source_word: συνεργός
  choice: mfanyakazi mwenzangu
  rationale: Neno hili humaanisha mtu anayefanya kazi pamoja na mwingine. Chaguo hili linaonyesha ushirikiano wa Timotheo na Paulo bila kuleta dhana ya kisasa ya shirika.
- source_word: Λούκιος
  choice: Lukio
  rationale: Jina limetoholewa kwa kufuata matumizi ya kawaida ya majina ya Biblia katika Kiswahili.
- source_word: Ἰάσων
  choice: Yasoni
  rationale: Jina limetoholewa kwa namna inayoeleweka na inayopatana na matamshi ya Kiswahili.
- source_word: Σωσίπατρος
  choice: Sosipatro
  rationale: Chaguo hili linafuata umbo kamili la jina lililo katika aya hii, badala ya umbo fupi ‘Sopatro’ linalojulikana mahali pengine.
- source_word: συγγενεῖς
  choice: jamaa zangu
  rationale: ‘Jamaa’ linaweza kuelekeza kwenye uhusiano wa kifamilia au undugu mpana zaidi. Linahifadhi kiasi cha upeo wa neno la Kigiriki kuliko kulifanya moja kwa moja kuwa ‘watu wa ukoo’ au ‘Wayahudi wenzangu.’
theological_decisions:
- issue: Maana ya συγγενεῖς μου katika matumizi ya Paulo
  choice: jamaa zangu
  alternative: watu wa ukoo wangu; Wayahudi wenzangu
  rationale: Aya haisemi wazi ikiwa Paulo anamaanisha ndugu wa damu au watu wenye uhusiano mpana wa kikabila naye. Tafsiri kuu haifungi maana hiyo, na tanbihi inaonyesha uwezekano huo bila kuamua suala hilo kihistoria au kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kawaida lakini wenye heshima. Muundo ‘vivyo hivyo’ unawakilisha καί inayopanua salamu kwa watu wengine waliotajwa, huku sentensi ikiendelea kwa ufasaha wa Kiswahili.
