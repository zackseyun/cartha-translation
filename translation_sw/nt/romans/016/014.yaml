  text: ἀσπάσασθε Ἀσύγκριτον, Φλέγοντα, ⸂Ἑρμῆν, Πατροβᾶν, Ἑρμᾶν⸃ καὶ τοὺς σὺν αὐτοῖς ἀδελφούς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/014.yaml
  text: Greet Asyncritus[a], Phlegon, Hermes, Patrobas, Hermas, and the brothers with them.
translation:
  language: sw
  text: Wasalimuni Asinkrito, Flegoni, Herme, Patroba, Herma, na ndugu walio pamoja nao.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Wasalimuni
  rationale: Amri ya nafsi ya pili wingi katika orodha ya salamu za mwisho; “wasalimuni” ni usemi wa kawaida, mfupi, na wenye heshima katika Kiswahili.
- source_word: Ἀσύγκριτον
  choice: Asinkrito
  rationale: Jina la mtu limetoholewa kwa tahajia na matamshi yanayofaa Kiswahili.
- source_word: Φλέγοντα
  choice: Flegoni
  rationale: Jina la mtu limetoholewa kwa namna inayohifadhi kwa karibu umbo la Kigiriki huku likisomeka kwa urahisi katika Kiswahili.
- source_word: Ἑρμῆν
  choice: Herme
  rationale: Jina la mtu limetoholewa kutoka Kigiriki na kutofautishwa na Ἑρμᾶν (Herma) linalofuata.
- source_word: Πατροβᾶν
  choice: Patroba
  rationale: Jina la mtu limetoholewa kwa tahajia inayofaa Kiswahili bila kulitafsiri maana yake.
- source_word: Ἑρμᾶν
  choice: Herma
  rationale: Jina la mtu limetoholewa na kuhifadhiwa tofauti na Herme, jina lililotajwa kabla yake.
- source_word: τοὺς σὺν αὐτοῖς ἀδελφούς
  choice: ndugu walio pamoja nao
  rationale: “Ndugu” hutoa ἀδελφούς kwa kawaida katika lugha ya jumuiya ya waamini bila kulazimisha jinsia isiyoelezwa wazi katika Kiswahili; “walio pamoja nao” huonyesha uhusiano wa kundi hilo na watu waliotajwa.
theological_decisions:
- issue: Maana ya ἀδελφούς katika salamu kwa jumuiya
  choice: ndugu
  alternative: waamini wenzao
  rationale: “Ndugu” ni tafsiri ya moja kwa moja na ya kawaida katika Kiswahili cha Kikristo, huku ikihifadhi uwezekano wa kurejelea waamini wanaoshirikiana na wanaume hawa bila kuongeza ufafanuzi ambao maandishi hayatoi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni mfupi kama orodha ya salamu ya Paulo; majina yametoholewa kwa namna inayoweza kutamkwa kwa kawaida katika Kiswahili.
