  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς τῆς εἰρήνης συντρίψει τὸν Σατανᾶν ὑπὸ τοὺς πόδας ὑμῶν ἐν τάχει. ἡ χάρις τοῦ κυρίου ἡμῶν Ἰησοῦ ⸀Χριστοῦ μεθ’ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/020.yaml
  text: And the God of peace will soon crush Satan under your feet[a]. The grace of our Lord Jesus Christ be with you.
translation:
  language: sw
  text: Naye Mungu wa amani atamponda Shetani chini ya miguu yenu hivi karibuni. Neema ya Bwana wetu Yesu Masihi[a] iwe nanyi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa mapokeo, “Yesu Kristo.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δὲ θεὸς τῆς εἰρήνης
  choice: Naye Mungu wa amani
  rationale: “Mungu wa amani” huhifadhi muundo wa jina la kitheolojia la Paulo bila kulipanua kuwa ufafanuzi. “Naye” huonyesha uhusiano wa δέ na yaliyotangulia kwa Kiswahili cha kawaida.
- source_word: συντρίψει
  choice: atamponda
  rationale: Kitenzi cha wakati ujao kinaonyesha tendo la hakika litakalotokea. “Atamponda” linafaa kwa taswira ya kumweka adui chini ya miguu na linaonyesha kushindwa kabisa.
- source_word: τὸν Σατανᾶν
  choice: Shetani
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili cha Biblia na matumizi ya Kikristo; haliongezi ufafanuzi wa maana kama “Adui.”
- source_word: ὑπὸ τοὺς πόδας ὑμῶν
  choice: chini ya miguu yenu
  rationale: Huhifadhi nahau ya ushindi na kutiishwa. “Yenu” huonyesha kwamba Paulo anazungumza na waamini kwa pamoja.
- source_word: ἐν τάχει
  choice: hivi karibuni
  rationale: Katika muktadha huu kifungu kinaeleweka zaidi kuwa kinahusu ukaribu wa wakati. “Hivi karibuni” huepuka kukielekeza tu kwenye kasi ya tendo.
- source_word: ἡ χάρις
  choice: Neema
  rationale: “Neema” ni istilahi ya kawaida na yenye uzito katika baraka za Paulo; si lazima kuongeza kibainishi kisichohitajika katika Kiswahili.
- source_word: τοῦ κυρίου ἡμῶν
  choice: ya Bwana wetu
  rationale: Huhifadhi uhusiano wa kimilikishi wa Kigiriki na namna ya kawaida ya baraka katika Kiswahili.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesu Masihi
  rationale: “Masihi” huwasilisha maana ya cheo Χριστός moja kwa moja, huku “Kristo,” umbo la kimapokeo lililozoeleka, likiwekwa katika tanbihi.
- source_word: μεθ’ ὑμῶν
  choice: iwe nanyi
  rationale: Kigiriki hakitaji kitenzi waziwazi, lakini Kiswahili huhitaji “iwe” ili baraka isomeke kwa kawaida. “Nanyi” ni namna fupi na yenye hadhi ya kusema “pamoja nanyi.”
theological_decisions:
- issue: Jinsi ya kutafsiri Χριστοῦ katika baraka ya kufunga
  choice: Masihi
  alternative: Kristo
  rationale: Katika kifungu hiki Χριστός bado inaweza kusikika kama cheo cha Yesu, kwa hiyo “Masihi” huonyesha maana yake. “Kristo,” ambalo ni umbo la kimapokeo na linaweza kueleweka kama sehemu ya jina, limehifadhiwa katika tanbihi ili kutoficha uwezekano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Sentensi imehifadhi taswira kali ya ushindi, usemi wa pamoja “miguu yenu,” na muundo wa baraka wa Paulo.
