id: ROM.16.2
reference: Romans 16:2
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἵνα ⸂αὐτὴν προσδέξησθε⸃ ἐν κυρίῳ ἀξίως τῶν ἁγίων, καὶ παραστῆτε αὐτῇ ἐν ᾧ ἂν ὑμῶν χρῄζῃ πράγματι, καὶ γὰρ αὐτὴ προστάτις πολλῶν ἐγενήθη καὶ ⸂ἐμοῦ αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/002.yaml
  text: so that you may welcome her in the Lord in a manner worthy of the saints[a], and assist her in whatever matter she may need from you, for she herself has become a patron of many[b], and of myself as well.
translation:
  language: sw
  text: ili mpokee katika Bwana kwa namna inayowafaa watakatifu, na msaidie[a] katika jambo lolote ambalo atahitaji msaada wenu. Kwa maana yeye mwenyewe amekuwa mfadhili wa watu wengi[b], pamoja na mimi mwenyewe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “msimame upande wake.”
    reason: lexical_alternative
  - marker: b
    text: Au, “msaidizi,” “mlinzi,” au “mlezi.” Neno la Kiyunani linaweza kumaanisha mwanamke aliyewasaidia au kuwafadhili wengine.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσδέξησθε
  choice: mpokee
  rationale: Katika muktadha huu kitenzi kinamaanisha kumpokea Foibe kwa ukarimu na kibali katika jumuiya; “mpokee” ni cha kawaida na huhifadhi maana hiyo.
- source_word: ἐν κυρίῳ
  choice: katika Bwana
  rationale: Huhifadhi usemi wa kawaida wa Paulo unaoonyesha ushirika na uhusiano wao katika Bwana.
- source_word: ἀξίως τῶν ἁγίων
  choice: kwa namna inayowastahili watu watakatifu
  rationale: Huwasilisha namna ya kumpokea inayofaa watu wa Mungu, huku “watu watakatifu” ikieleweka kwa urahisi kuliko nomino “watakatifu” pekee.
- source_word: παραστῆτε αὐτῇ
  choice: msaidie
  rationale: Katika muktadha huu maana ni kumsaidia au kusimama upande wake; “msaidie” ni Kiswahili cha asili kisichobainisha isivyofaa aina ya msaada.
- source_word: ἐν ᾧ ἂν ὑμῶν χρῄζῃ πράγματι
  choice: katika jambo lolote ambalo atahitaji msaada wenu
  rationale: “Jambo lolote” huhifadhi upana wa πρᾶγμα, na kifungu kizima kinaeleza kwa Kiswahili cha kawaida kuwa anaweza kuwahitaji katika shughuli yoyote.
- source_word: προστάτις
  choice: mfadhili
  rationale: Neno la Kiyunani linaonyesha mwanamke aliyetoa msaada wenye uzito, huenda wa mali na kijamii; “mfadhili” huhifadhi hadhi na utendaji huo vizuri kuliko “msaidizi” wa jumla.
- source_word: ἐμοῦ αὐτοῦ
  choice: hata mimi mwenyewe pia
  rationale: Huhifadhi msisitizo wa Paulo kwamba yeye binafsi pia alikuwa miongoni mwa waliopokea ufadhili wake.
theological_decisions:
- issue: Jinsi ya kutafsiri προστάτις kuhusu Foibe
  choice: mfadhili
  alternative: msaidizi, mlinzi, au mlezi
  rationale: “Mfadhili” linaonyesha nafasi yake muhimu ya kuwategemeza wengine bila kulifanya neno hili kuwa cheo maalumu cha kanisa. Tanbihi huhifadhi upana wa maana unaowezekana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo ni wa kawaida kwa wasomaji wengi, huku istilahi za Paulo kama “katika Bwana” na dhana ya “watu watakatifu” zikihifadhiwa.
