base_translation:
  language: en
  yaml_path: translation/nt/romans/016/011.yaml
  text: Greet Herodion[a], my kinsman[b]. Greet those of Narcissus who are in the Lord.
translation:
  language: sw
  text: Msalimuni Herodioni, jamaa yangu[a]. Msalimuni watu wa Narkiso[b] walio katika Bwana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ndugu yangu wa ukoo” au “Myahudi mwenzangu”; neno la Kigiriki linaweza kumaanisha mtu wa ukoo wa damu au mtu wa taifa moja na Paulo.
    reason: lexical_alternative
  - marker: b
    text: Huenda inawarejelea watu wa nyumbani au wa kaya ya Narkiso, au watu wa mali yake, ambao ni waamini.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Msalimuni
  rationale: Amri ya wingi ya ἀσπάζομαι katika salamu za barua inaelezwa kwa kawaida na kwa ufupi kwa “Msalimuni.”
- source_word: Ἡρῳδίωνα
  choice: Herodioni
  rationale: Jina la mtu limetoholewa kwa muundo unaofaa matamshi na matumizi ya kawaida ya Kiswahili.
- source_word: συγγενῆ μου
  choice: jamaa yangu
  rationale: “Jamaa” linaweza kumaanisha mtu wa ukoo na pia mtu mwenye uhusiano mpana wa kijamii au wa watu mmoja; hivyo halilazimishi maana finyu ambayo Kigiriki hakijaibainisha.
- source_word: τοὺς ἐκ τῶν Ναρκίσσου
  choice: watu wa Narkiso
  rationale: Kauli hii ya asili inaonyesha watu waliohusishwa na Narkiso bila kutaja wazi “nyumba” au “kaya.” “Watu wa Narkiso” ni ya asili katika Kiswahili huku ikihifadhi upana huo.
- source_word: τοὺς ὄντας ἐν κυρίῳ
  choice: walio katika Bwana
  rationale: Tafsiri hii inadumisha msemo wa Paulo “katika Bwana” na uzito wake wa kiteolojia badala ya kuufafanua kuwa tu waamini au walio mali ya Bwana.
- source_word: κυρίῳ
  choice: Bwana
  rationale: “Bwana” ndiyo tafsiri ya kawaida na yenye heshima ya κύριος katika muktadha huu wa Kikristo.
theological_decisions:
- issue: Maana ya συγγενής katika salamu za Paulo
  choice: jamaa yangu
  alternative: ndugu yangu wa ukoo; Myahudi mwenzangu
  rationale: Neno linaweza kumaanisha mtu wa ukoo wa damu au, katika matumizi ya Paulo, mtu wa taifa lake. “Jamaa yangu” pamoja na tanbihi hudumisha uwezekano wote bila kuamua zaidi ya andiko.
- issue: Utambulisho wa watu waliohusishwa na Narkiso
  choice: watu wa Narkiso
  alternative: watu wa nyumbani mwa Narkiso; watu wa kaya ya Narkiso
  rationale: Kigiriki kinaonyesha uhusiano na Narkiso lakini hakitumii wazi neno “nyumba” au “kaya.” Tafsiri kuu inabaki yenye kiasi, huku maana inayowezekana ya kaya ikielezwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni mfupi kama Kigiriki; msemo wa Paulo “katika Bwana” umehifadhiwa. Alama za tanbihi zimewekwa baada ya vipashio vinavyohusika moja kwa moja.
