review_pass:
  verdict: revise
  source_fidelity: The repeated plural imperative is accurately represented, and “katika Masihi” appropriately preserves ἐν Χριστῷ as a Pauline relational/sphere expression. “Watu wa nyumbani mwa Aristobulo” reasonably conveys those associated with Aristobulus’ household, though “wale wa nyumbani mwa...” more directly reflects the substantival Greek “those [who are] of Aristobulus.” The personal name should be standardized as “Apeli,” rather than “Apele.”
  naturalness: The Swahili is clear and suitably formal. “Wale wa nyumbani mwa Aristobulo” is a slightly more idiomatic and concise way to express the second greeting, avoiding the unnecessary lexical addition “watu.”
  terminology: “Masihi” correctly renders the titular force of Χριστός, and the footnote supplies the familiar alternative “Kristo.” “Aliyekubaliwa” is an acceptable rendering of δόκιμος, expressing commendation without specifying the nature of the testing.
  issues:
  - severity: medium
    issue: Personal name rendered as “Apele.”
    rationale: For Standard East African Swahili biblical usage and a stable transliteration of Ἀπελλῆς, “Apeli” is the appropriate form. “Apele” appears to reflect the Greek accusative ending rather than the conventional Swahili name form.
  - severity: low
    issue: “Watu wa nyumbani mwa Aristobulo” is less direct than necessary.
    rationale: The Greek refers substantivally to “those of Aristobulus.” “Wale wa nyumbani mwa Aristobulo” naturally retains this reference while expressing the likely household association.
  revised_text: Msalimieni Apeli, aliyekubaliwa katika Masihi.[a] Wasalimieni wale wa nyumbani mwa Aristobulo.
  revised_footnotes:
  - marker: a
    text: Au, kwa tafsiri iliyozoeleka zaidi, “katika Kristo.”
    reason: alternative_reading
  revision_rationale: The revision standardizes Apelles’ name as “Apeli” and makes the second clause more direct and idiomatic. It retains “aliyekubaliwa,” “katika Masihi,” the repeated greeting imperative, and the alternative-reading footnote, all of which faithfully preserve the Greek sense and the project’s title policy.
