reference: Romans 16:10
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀσπάσασθε Ἀπελλῆν τὸν δόκιμον ἐν Χριστῷ. ἀσπάσασθε τοὺς ἐκ τῶν Ἀριστοβούλου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/010.yaml
  text: Greet Apelles[a], the approved one in Messiah. Greet those of the household of Aristobulus.
translation:
  language: sw
  text: Msalimieni Apeli, aliyekubaliwa katika Masihi.[a] Wasalimieni wale wa nyumbani mwa Aristobulo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri iliyozoeleka zaidi, “katika Kristo.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Msalimieni / Wasalimieni
  rationale: Kitenzi hiki ni agizo kwa wingi la kufikisha salamu. Miundo hii ni ya kawaida na ya asili katika Kiswahili, huku upatanisho wa ngeli ukifuata yule au wale wanaosalimiwa.
- source_word: Ἀπελλῆν
  choice: Apele
  rationale: Jina la mtu limetoholewa kwa tahajia na matamshi yanayofaa Kiswahili kutoka umbo la Kigiriki Ἀπελλῆς.
- source_word: τὸν δόκιμον
  choice: aliyekubaliwa
  rationale: δόκιμος humweleza mtu aliyejaribiwa na kuonekana kuwa anakubalika. ‘Aliyekubaliwa’ huhifadhi maana ya sifa hiyo bila kuongeza kwa wazi jambo ambalo matini haijasema, kama vile aina mahususi ya uaminifu au jaribu.
- source_word: ἐν Χριστῷ
  choice: katika Masihi
  rationale: ‘Katika’ huhifadhi usemi wa Paulo unaoweza kuonyesha uhusiano au hali ndani ya Masihi, bila kuufafanua kupita kiasi. Χριστός limetafsiriwa kama cheo, ‘Masihi.’
- source_word: τοὺς ἐκ τῶν Ἀριστοβούλου
  choice: watu wa nyumbani mwa Aristobulo
  rationale: Usemi wa Kigiriki unawahusu watu walio katika nyumba au kaya ya Aristobulo, si lazima Aristobulo mwenyewe. Tafsiri hii ni wazi na ya kawaida katika Kiswahili.
theological_decisions:
- issue: Tafsiri ya Χριστῷ katika usemi wa Paulo ἐν Χριστῷ
  choice: katika Masihi
  alternative: katika Kristo
  rationale: ‘Masihi’ hudumisha maana ya cheo cha Mtiwa-Mafuta, na ‘katika’ huhifadhi mvutano wa kitheolojia wa usemi wa Paulo bila kuugeuza kuwa ‘akiwa mwamini.’ Tafsiri ya kimapokeo ‘katika Kristo’ imetolewa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Marudio ya agizo la kusalimia yamehifadhiwa.
