  text: καὶ τὴν κατ’ οἶκον αὐτῶν ἐκκλησίαν. ἀσπάσασθε Ἐπαίνετον τὸν ἀγαπητόν μου, ὅς ἐστιν ἀπαρχὴ τῆς ⸀Ἀσίας εἰς Χριστόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/005.yaml
  text: Also greet the church in their house[a]. Greet Epaenetus, my beloved[c][b], who is the firstfruits of Asia for Messiah.
translation:
  language: sw
  text: Pia, salimuni kanisa lililoko nyumbani mwao[a]. Msalimuni Epaineto, mpendwa wangu, ambaye ni malimbuko ya Asia[b] kwa Masihi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kanisa linalokutana nyumbani mwao.”
    reason: lexical_alternative
  - marker: b
    text: Yaani, jimbo la Kiroma la Asia, si bara la Asia la leo.
    reason: cultural_note
  - marker: c
    text: Au, “ambaye alikuwa mtu wa kwanza katika Asia kumwamini Masihi.”
    reason: alternative_reading
lexical_decisions:
- source_word: κατ’ οἶκον αὐτῶν ἐκκλησίαν
  choice: kanisa lililo nyumbani mwao
  rationale: Huhifadhi kwa ukaribu wazo la kusanyiko la waamini lililohusishwa na nyumba yao bila kutumia istilahi finyu ya kitaalamu; tanbihi inaweka wazi maana inayowezekana ya kukutana humo.
- source_word: ἀσπάσασθε
  choice: lisalimuni / Msalimuni
  rationale: Katika orodha ya salamu za barua, kitenzi hiki humaanisha kuwapelekea au kuwapa watu salamu. Upatanisho wa ngeli umefuatwa kwa ‘kanisa’ na kwa mtu mmoja.
- source_word: Ἐπαίνετον
  choice: Epaineto
  rationale: Jina limetoholewa kwa namna inayoweza kutamkwa kwa kawaida katika Kiswahili huku likibaki karibu na umbo la Kigiriki.
- source_word: ἀγαπητόν μου
  choice: mpendwa wangu
  rationale: Hueleza mapenzi ya karibu ya Paulo kwa lugha ya kawaida, yenye heshima na iliyo karibu na maana ya kivumishi cha Kigiriki.
- source_word: ἀπαρχὴ
  choice: malimbuko
  rationale: Neno hili linahifadhi taswira ya Kigiriki ya sehemu ya kwanza ya mavuno badala ya kuifafanua moja kwa moja kuwa ‘mwongofu wa kwanza.’
- source_word: τῆς Ἀσίας
  choice: ya Asia
  rationale: Hufuata uhusiano wa umilikishi katika Kigiriki. Tanbihi inafafanua kwamba hapa ni jimbo la Kiroma, si bara la kisasa.
- source_word: εἰς Χριστόν
  choice: kwa Masihi
  rationale: ‘Kwa’ huacha wazi uhusiano wa lengo au mwelekeo katika εἰς, na ‘Masihi’ huhifadhi maana ya Χριστός kama cheo katika muktadha huu.
theological_decisions:
- issue: Tafsiri ya Χριστόν
  choice: Masihi
  alternative: Kristo
  rationale: Hapa Χριστός inaweza kueleweka kama cheo. ‘Masihi’ huhifadhi maana ya cheo hicho bila kuongeza ufafanuzi wa kimadhehebu.
- issue: Maana ya ἀπαρχὴ τῆς Ἀσίας εἰς Χριστόν
  choice: malimbuko ya Asia kwa Masihi
  alternative: mtu wa kwanza katika Asia kumwamini Masihi
  rationale: Matini kuu inadumisha sitiari ya Paulo ya ‘malimbuko’ na uhusiano usioelezwa kikamilifu wa εἰς Χριστόν; tanbihi inatoa maana inayowezekana katika muktadha bila kuifanya kuwa tafsiri pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaosomeka kwa urahisi. ‘Malimbuko’ limehifadhiwa kwa sababu ni neno la kibiblia linalobeba sitiari ya ἀπαρχή; tanbihi hulifafanua kwa lugha rahisi. Viashiria vyote vya tanbihi vimewekwa mara moja katika matini kuu karibu na maneno vinayohusu.
