  text: ἀσπάσασθε Ἀνδρόνικον καὶ ⸀Ἰουνίαν τοὺς συγγενεῖς μου καὶ συναιχμαλώτους μου, οἵτινές εἰσιν ἐπίσημοι ἐν τοῖς ἀποστόλοις, οἳ καὶ πρὸ ἐμοῦ ⸀γέγοναν ἐν Χριστῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/007.yaml
  text: Greet Andronicus and Junia[a], my kinsmen and my fellow prisoners. They are notable among the apostles[b], and they were in Messiah before me.
translation:
  language: sw
  text: Wasalimuni Androniko na Yunia[a], jamaa zangu na wafungwa wenzangu. Wao ni mashuhuri miongoni mwa mitume[b], nao walikuwa katika Masihi kabla yangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Yunia: au “Yuniasi,” jina la kiume; hata hivyo, umbo la Kigiriki na matumizi ya kihistoria yanaelekea zaidi kuunga mkono jina la kike Yunia.'
    reason: alternative_reading
  - marker: b
    text: Au, “walijulikana sana na mitume.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Wasalimuni
  rationale: Kitenzi hiki cha agizo katika barua kinamaanisha kuwapa watu salamu; “wasalimuni” ni cha kawaida, cha moja kwa moja, na huhifadhi nguvu ya agizo.
- source_word: Ἀνδρόνικον
  choice: Androniko
  rationale: Jina la mtu limetoholewa kwa namna iliyozoeleka katika Kiswahili.
- source_word: Ἰουνίαν
  choice: Yunia
  rationale: Umbo la Kigiriki linaelekea zaidi kuwa jina la kike Yunia, ambalo linathibitishwa vizuri katika matumizi ya kale; uwezekano wa jina la kiume umewekwa katika tanbihi.
- source_word: συγγενεῖς μου
  choice: jamaa zangu
  rationale: Neno linaweza kumaanisha ndugu wa ukoo au watu wa taifa moja. “Jamaa zangu” huhifadhi kwa kiasi fulani upana huo bila kulazimisha maana moja.
- source_word: συναιχμαλώτους μου
  choice: wafungwa wenzangu
  rationale: Hueleza watu waliofungwa pamoja na msemaji; tafsiri hii ni wazi na ya kawaida katika Kiswahili cha sasa.
- source_word: ἐπίσημοι ἐν τοῖς ἀποστόλοις
  choice: mashuhuri miongoni mwa mitume
  rationale: Hutoa maana ya kuwa wenye kutambulika au kuheshimiwa sana miongoni mwa mitume, huku tanbihi ikihifadhi uwezekano wa kuelewa kuwa walijulikana sana na mitume.
- source_word: πρὸ ἐμοῦ
  choice: kabla yangu
  rationale: Huhifadhi kwa ufupi na kwa kawaida wazo la kutangulia kwa wakati.
- source_word: γέγοναν ἐν Χριστῷ
  choice: walikuwa katika Masihi
  rationale: Huhifadhi nahau ya Paulo “katika Masihi” na huonyesha kwamba hali hiyo ilianza kabla ya Paulo na iliendelea.
theological_decisions:
- issue: Utambulisho na jinsia ya Ἰουνίαν
  choice: Jina limetafsiriwa kama jina la kike, “Yunia.”
  alternative: Linaweza kuchukuliwa kuwa jina la kiume, “Yuniasi.”
  rationale: Ushahidi wa umbo la Kigiriki na matumizi ya kihistoria unaunga mkono zaidi jina la kike. Uwezekano wa kiume, ambao umeathiri historia ya ufasiri, umehifadhiwa katika tanbihi.
- issue: Maana ya ἐπίσημοι ἐν τοῖς ἀποστόλοις
  choice: “mashuhuri miongoni mwa mitume”
  alternative: “walijulikana sana na mitume”
  rationale: Kirai kinaweza kueleweka kuwa Androniko na Yunia walikuwa watu mashuhuri ndani ya kundi pana la mitume, au kwamba walitambuliwa sana na mitume. Matini kuu hufuata usomaji wa moja kwa moja zaidi, na tanbihi huhifadhi utata halisi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. “Masihi” limetumiwa kama cheo cha Χριστός, na “katika Masihi” imehifadhiwa kama nahau ya kitheolojia ya Paulo.
