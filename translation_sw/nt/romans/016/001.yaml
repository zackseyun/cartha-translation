  yaml_path: translation/nt/romans/016/001.yaml
  text: I commend to you Phoebe[a], our sister, who is also a deacon of the church in Cenchreae,
translation:
  language: sw
  text: Ninawapendekezea Fibi, dada yetu, ambaye pia ni shemasi[a] wa kanisa lililoko Kenkrea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mtumishi” au “mhudumu” wa kanisa lililoko Kenkrea. Neno la Kigiriki diakonos linaweza kumaanisha ama mtu mwenye wadhifa wa huduma unaotambulika au, kwa maana pana zaidi, mtu anayehudumu.
    reason: alternative_reading
lexical_decisions:
- source_word: Συνίστημι
  choice: Ninamtambulisha kwenu
  rationale: Katika muktadha wa barua, kitenzi hiki kinamtambulisha mtu kwa njia ya kumpendekeza kwa wasomaji. Usemi huu ni wa kawaida na unaeleweka katika Kiswahili bila kuongeza amri ya kumpokea.
- source_word: δὲ
  choice: hakikutafsiriwa kwa neno tofauti
  rationale: Hapa δέ ni kiunganishi chepesi cha kuhamia kwenye jambo jipya, si upinzani mkali. Mtiririko wa sentensi ya Kiswahili unatosha kuonyesha mpito huo bila kuongeza “basi” au “lakini.”
- source_word: Φοίβην
  choice: Foibe
  rationale: Jina limetoholewa kwa tahajia inayoendana na matamshi ya Kiswahili.
- source_word: τὴν ἀδελφὴν ἡμῶν
  choice: dada yetu
  rationale: Tafsiri ya moja kwa moja inayohifadhi lugha ya kifamilia ya jumuiya ya waamini bila kuongeza “katika imani.”
- source_word: οὖσαν καὶ
  choice: ambaye pia ni
  rationale: Inatoa taarifa ya ziada kuhusu Foibe kwa Kiswahili cha kawaida huku ikihifadhi maana ya nyongeza ya καί.
- source_word: διάκονον
  choice: shemasi
  rationale: Neno la Kigiriki linaweza kumaanisha mtumishi au mhudumu kwa jumla, au mtu mwenye huduma inayotambulika katika kanisa. “Shemasi” huhifadhi uwezekano wa jukumu rasmi au nusu rasmi; maana nyingine zimewekwa katika tanbihi.
- source_word: τῆς ἐκκλησίας
  choice: wa kanisa
  rationale: Katika barua za Paulo, ἐκκλησία kwa kawaida ni kusanyiko la waamini; “kanisa” ni neno sanifu na linaloeleweka wazi.
- source_word: τῆς ἐν Κεγχρεαῖς
  choice: lililoko Kenkrea
  rationale: Kirai hiki kinabainisha mahali kanisa lilipokuwa. “Kenkrea” ni utohozi wa jina la mahali kwa Kiswahili.
theological_decisions:
- issue: Ikiwa διάκονον ni neno la huduma kwa jumla au jina la jukumu la kikanisa
  choice: shemasi
  alternative: mtumishi au mhudumu
  rationale: Muundo “wa kanisa lililoko Kenkrea” unaashiria uhusiano maalumu na kusanyiko hilo, hivyo “shemasi” huhifadhi uwezekano wa jukumu linalotambulika. Hata hivyo, neno lenyewe halilazimishi muundo wowote wa baadaye wa madhehebu, na maana pana zaidi zimehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Alama ya tanbihi imewekwa baada ya “shemasi,” neno linalohitaji ufafanuzi.
