  yaml_path: translation/nt/romans/016/026.yaml
  text: but[a] has now been revealed, and through the prophetic Scriptures made known to all nations, according to the command of the eternal God, to bring about the obedience of faith,
translation:
  language: sw
  text: lakini sasa imefunuliwa[a], na kwa njia ya Maandiko ya kinabii imejulishwa kwa mataifa yote, kwa amri ya Mungu wa milele, ili kuleta utii wa imani,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mstari huu ni mwendelezo wa sifa za kumalizia katika Waroma 16:25–27. Tazama maelezo katika Waroma 16:25 kuhusu mahali pa maneno haya na ushahidi wa hati za kale.
    reason: textual_critical
lexical_decisions:
- source_word: φανερωθέντος
  choice: imefunuliwa
  rationale: Kitenzi hiki kinarejelea “siri” ya mstari wa 25 na kueleza kufunuliwa kwa jambo lililokuwa limefichwa.
- source_word: γραַφῶν προφητικῶν
  choice: Maandiko ya kinabii
  rationale: Katika muktadha huu ni maandiko matakatifu yenye ushuhuda wa kinabii, si maandishi ya kawaida.
- source_word: ἐπιταγήν
  choice: amri
  rationale: Neno hili linaonyesha agizo lenye mamlaka kutoka kwa Mungu kuhusu kujulishwa kwa siri hiyo kwa mataifa yote.
- source_word: ὑπακοὴν πίστεως
  choice: wayatii yanayotokana na imani
  rationale: Muundo wa Kigiriki unaweza kuhusisha utii unaotokana na imani au utii ambao ni imani; tafsiri hii ni ya asili kwa Kiswahili huku ikihifadhi uhusiano wa karibu kati ya imani na utii.
- source_word: ἔθνη
  choice: mataifa
  rationale: Huhifadhi upeo wa ulimwengu mzima wa tangazo, ingawa katika matumizi ya Paulo neno hili pia linaweza kumaanisha watu wasio Wayahudi.
theological_decisions:
- issue: Maana ya ὑπακοὴ πίστεως
  choice: utii unaotokana na imani
  alternative: utii wa imani
  rationale: Kirai cha Kigiriki kina utata wa kimaana. Kiswahili cha moja kwa moja “utii wa imani” si wazi sana; “wayatii yanayotokana na imani” kinaeleweka kwa urahisi bila kutenganisha imani na utii.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Sentensi imeachwa wazi kuendelea hadi mstari wa 27, kama ilivyo katika Kigiriki.
