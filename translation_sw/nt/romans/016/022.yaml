  text: ἀσπάζομαι ὑμᾶς ἐγὼ Τέρτιος ὁ γράψας τὴν ἐπιστολὴν ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/022.yaml
  text: I[a], Tertius, who wrote the letter, greet you in the Lord.
translation:
  language: sw
  text: Mimi[a], Tertio, niliyeandika barua, ninawasalimu katika Bwana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa uwezekano mdogo, “Mimi, Tertio, niliyeandika barua katika Bwana, ninawasalimu.” Katika Kigiriki, maneno “katika Bwana” yanaweza kuhusishwa na “niliyeandika,” lakini kwa kawaida zaidi yanahusishwa na salamu.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσπάζομαι
  choice: ninawasalimu
  rationale: Kitenzi hiki humaanisha kusalimu au kutuma salamu; “ninawasalimu” ni usemi wa kawaida na mfupi unaofaa katika hitimisho la barua.
- source_word: ὑμᾶς
  choice: -wa- (ninawasalimu)
  rationale: Kiambishi cha yambwa -wa- kinaonyesha wazi kuwa wanaosalimiwa ni watu wengi.
- source_word: ἐγὼ Τέρτιος
  choice: Mimi, Tertio
  rationale: Kiwakilishi kilichotajwa wazi pamoja na jina kinamtambulisha msemaji kwa msisitizo; Kiswahili cha “Mimi, Tertio” kinauhifadhi.
- source_word: ὁ γράψας
  choice: niliyeandika
  rationale: Kishazi hiki kinamtambulisha Tertio kuwa yule aliyeandika barua; “niliyeandika” ni cha asili na kinahifadhi tendo lililokamilika.
- source_word: τὴν ἐπιστολήν
  choice: barua hii
  rationale: Ingawa Kigiriki kina kibainishi wala si kionyeshi, katika Kiswahili “barua hii” humrejelea kwa kawaida na kwa uwazi barua inayosomwa sasa.
- source_word: ἐν κυρίῳ
  choice: katika Bwana
  rationale: Huu ni usemi wa kawaida wa Paulo unaoonyesha uhusiano au ushirika ndani ya Bwana; umetafsiriwa bila kuufafanua kupita kiasi.
theological_decisions:
- issue: Kihusishi “katika Bwana” kinahusiana na sehemu gani ya sentensi?
  choice: 'Kimeunganishwa na salamu: Tertio anawasalimu katika Bwana.'
  alternative: 'Kinaweza kuunganishwa na kuandika: Tertio aliandika barua katika Bwana.'
  rationale: Katika muktadha wa salamu za mwisho, uwezekano wa kawaida zaidi ni kwamba usemi huo unaeleza salamu inayotolewa katika ushirika wa Bwana. Tanbihi inahifadhi uwezekano mwingine wa kisarufi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo ni wa kawaida kwa wasomaji wengi, huku “katika Bwana” ikidumisha lugha ya kitheolojia ya chanzo na utata wake wa kisarufi.
