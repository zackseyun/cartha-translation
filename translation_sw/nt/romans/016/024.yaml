  text: The grace of our Lord Jesus Christ be with all of you[b][a]. Amen.
translation:
  language: sw
  text: Neema ya Bwana wetu Yesu Kristo iwe pamoja nanyi nyote.[a] Amina.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati za kale zina maneno haya ya baraka, lakini nyingine hazina; matoleo mengi ya kisasa huyatia katika mabano kama tofauti ya maandishi katika sehemu ya mwisho ya Waroma.
    reason: textual_variant
lexical_decisions:
- source_word: χάρις
  choice: neema
  rationale: Neno la kawaida katika baraka za Paulo; linahifadhi maana ya fadhili na zawadi ya Mungu.
- source_word: κυρίου
  choice: Bwana
  rationale: Katika cheo hiki kinachomhusu Yesu, neno hili linaonyesha ubwana wake na linaendana na matumizi ya kawaida ya Kikristo katika Kiswahili.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesu Kristo
  rationale: “Kristo” ni umbo la jadi na linaloeleweka sana katika Kiswahili kwa Χριστός; hapa mfuatano huu umetumika kama jina-cheo lililozoeleka, huku maana yake ya Masihi ikibainishwa katika tanbihi.
- source_word: μετὰ πάντων ὑμῶν
  choice: pamoja nanyi nyote
  rationale: Ni Kiswahili cha kawaida kinachohifadhi wazo la kuwa pamoja na wasomaji wote bila kumwacha yeyote.
- source_word: Ἀμήν
  choice: Amina
  rationale: Umbo la kawaida la kiliturujia katika Kiswahili kwa tamko la uthibitisho.
theological_decisions:
- issue: Uwasilishaji wa Χριστός katika Ἰησοῦ Χριστοῦ
  choice: Kristo
  alternative: Masihi
  rationale: “Yesu Kristo” ndilo umbo la kawaida, lenye hadhi na linalotambulika mara moja katika Kiswahili. Tanbihi inahifadhi wazi maana ya cheo hicho kuwa “Masihi” bila kulifanya lionekane kuwa jina lisilo na maana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa baraka ulio wa kawaida, wa sasa na wenye hadhi. Alama ya tanbihi imewekwa baada ya sentensi nzima kwa kuwa tofauti ya hati inahusu mstari wote.
