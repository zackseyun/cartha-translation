    issue: “kazi nyingi” kwa πολλὰ ἐκοπίασεν
    rationale: Hapa πολλὰ ni accusative ya kielezi inayosisitiza kiasi/ukubwa wa kufanya kazi kwa Persisi. “Amefanya kazi nyingi” inaweza kumaanisha amefanya kazi mbalimbali au kazi zilizo nyingi; “amefanya kazi kwa bidii sana” huwasilisha maana iliyokusudiwa.
  - severity: low
    issue: “wanawake wanaofanya kazi kwa bidii” kwa τὰς κοπιώσας
    rationale: Jinsia ya kike ipo katika Kigiriki, lakini kuingiza “wanawake” si lazima na huongeza nomino ambayo matini haitumii. Pia “wanaofanya” huipa kauli mwelekeo wa sasa, ilhali muktadha ni pongezi kwa kazi iliyotambulika. “Wale waliofanya kazi kwa bidii” ni mwaminifu na wa kawaida.
  - severity: low
    issue: “huyo mpendwa” kwa τὴν ἀγαπητήν
    rationale: “Huyo” huongeza ladha ya kidokezi ambayo article ya Kigiriki haihitaji. “Mpendwa” baada ya jina hudumisha sifa hiyo bila kuongeza umilikaji au kidokezi.
