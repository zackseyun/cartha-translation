  to: Wasalimuni Trifaina na Trifosa, wale waliofanya kazi kwa bidii katika Bwana.[a] Msalimuni Persisi, mpendwa,[b] ambaye amefanya kazi kwa bidii sana katika Bwana.
  rationale: Marekebisho huhifadhi salamu za amri ya wingi, majina yaliyotoholewa, na “katika Bwana.” Huondoa nyongeza isiyo ya lazima ya “wanawake,” hutumia umbo linalofaa kwa pongezi ya kazi iliyofanywa, na hutafsiri πολλὰ kwa “sana.” Pia “mpendwa” huepuka kuongeza kidokezi au umilikaji usiopo katika Kigiriki.
