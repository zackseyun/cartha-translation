  source_fidelity: Marekebisho yanahitajika ili kudumisha ulinganifu wa κοπιάω katika vifungu vyote viwili na kueleza πολλὰ kama kiwango cha juhudi, si idadi ya kazi. Kishiriki τὰς κοπιώσας kinaweza kutafsiriwa kwa umbo la utimilifu la Kiswahili bila kuongeza neno “wanawake,” ambalo ingawa linaendana na jinsia ya kisarufi na majina, halihitajiki katika matini lengwa.
  naturalness: “Wasalimuni” na “Msalimuni” ni za asili na zenye hadhi inayofaa. “Wale waliofanya kazi kwa bidii” husikika kwa kawaida zaidi kuliko “wanawake wanaofanya kazi kwa bidii” katika orodha hii ya salamu. “Mpendwa” hutoa sifa ya Kigiriki kwa ufasaha bila nguvu ya kidokezi ya “huyo.”
  terminology: “Katika Bwana” ni sahihi na ihifadhiwe. “Kufanya kazi kwa bidii” katika sehemu zote mbili huweka wazi uradidi wa κοπιάω; “sana” hutafsiri πολλὰ kwa usahihi zaidi kuliko “nyingi.”
