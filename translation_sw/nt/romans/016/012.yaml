base_translation:
  language: en
  yaml_path: translation/nt/romans/016/012.yaml
  text: Greet Tryphaena and Tryphosa[a], who have labored in the Lord. Greet Persis, the beloved[b], who has labored much in the Lord.
translation:
  language: sw
  text: Wasalimuni Trifaina na Trifosa, wale waliofanya kazi kwa bidii katika Bwana.[a] Msalimuni Persisi, mpendwa,[b] ambaye amefanya kazi kwa bidii sana katika Bwana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wale wanaofanya kazi kwa bidii katika Bwana” au “waliojitaabisha katika Bwana.”
    reason: lexical_alternative
  - marker: b
    text: Baadhi ya tafsiri husema “mpendwa wangu,” lakini Kigiriki kinasema tu “mpendwa,” bila neno la wazi linalomaanisha “wangu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Wasalimuni / Msalimuni
  rationale: Amri ya wingi katika orodha ya salamu inaelezwa kwa Kiswahili cha kawaida kama “wasalimuni” kwa watu wawili na “msalimuni” kwa mtu mmoja.
- source_word: Τρύφαιναν καὶ Τρυφῶσαν
  choice: Trifaina na Trifosa
  rationale: Majina ya watu yametoholewa kwa tahajia inayosomeka kwa urahisi katika Kiswahili.
- source_word: τὰς κοπιώσας
  choice: wanawake wanaofanya kazi kwa bidii
  rationale: Umbo la kike la wingi linabainisha kwamba Trifaina na Trifosa ni wanawake; kauli hii pia huhifadhi maana ya juhudi kubwa bila kulazimisha wakati uliopita ambao kishiriki chenyewe hakibainishi wazi.
- source_word: κοπιάω
  choice: kufanya kazi kwa bidii / kufanya kazi nyingi
  rationale: Kitenzi kina wazo la kufanya kazi kwa juhudi na kuchoka. Katika sehemu ya pili, “kazi nyingi” huhifadhi msisitizo wa πολλὰ na uhusiano wa kileksika na kauli ya kwanza.
- source_word: ἐν κυρίῳ
  choice: katika Bwana
  rationale: Kauli hii huhifadhi maana pana ya uhusiano na mazingira ya utumishi ndani ya Bwana, badala ya kuifupisha kuwa “kwa ajili ya Bwana” pekee.
- source_word: Περσίδα
  choice: Persisi
  rationale: Jina limetoholewa kwa namna inayolingana na mfumo wa sauti na tahajia ya Kiswahili.
- source_word: τὴν ἀγαπητήν
  choice: huyo mpendwa
  rationale: Kigiriki kina kibainishi na kivumishi bila kiwakilishi cha umilikaji; “huyo mpendwa” ni ya asili kwa Kiswahili na haiongezi “wangu.”
- source_word: ἥτις
  choice: ambaye
  rationale: Kiwakilishi hiki kinaanzisha maelezo kuhusu Persisi kwa Kiswahili cha kawaida.
- source_word: πολλὰ
  choice: nyingi
  rationale: Neno hili linasisitiza ukubwa au wingi wa kazi aliyoifanya Persisi.
- source_word: ἐκοπίασεν
  choice: amefanya kazi
  rationale: Kauli timilifu ya Kiswahili inaeleza kazi yake iliyofanywa na ambayo bado inastahili kutambuliwa katika salamu hizi.
theological_decisions:
- issue: Maana ya ἐν κυρίῳ katika kauli ya huduma ya Paulo
  choice: katika Bwana
  alternative: kwa ajili ya Bwana / katika kumtumikia Bwana
  rationale: “Katika Bwana” huhifadhi uwezekano wa maana ya uhusiano, mazingira, na huduma inayofanywa ndani ya ushirika na Bwana bila kuibana kuwa kusudi pekee.
- issue: Kutafsiri τὴν ἀγαπητήν bila kuongeza umilikaji
  choice: huyo mpendwa
  alternative: mpendwa wangu
  rationale: Matini haina μου (“wangu”); kwa hiyo tafsiri haiongezi ukaribu wa kimilikaji ambao haujaelezwa wazi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Kazi kwa bidii” ni wazi kwa wasomaji wa kawaida, huku “katika Bwana” ikihifadhi msamiati na mvutano wa kiteolojia wa Paulo. Alama zote za tanbihi zimewekwa katika matini kuu.
