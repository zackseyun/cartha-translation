  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀσπάζεται ὑμᾶς Γάϊος ὁ ξένος μου καὶ ⸂ὅλης τῆς ἐκκλησίας⸃. ἀσπάζεται ὑμᾶς Ἔραστος ὁ οἰκονόμος τῆς πόλεως καὶ Κούαρτος ὁ ἀδελφός.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/023.yaml
  text: Gaius[a], my host and the host of the whole church, greets you. Erastus, the city treasurer, greets you, and Quartus, the brother.
translation:
  language: sw
  text: Gayo, mwenyeji wangu na wa kanisa lote, anawasalimu. Erasto, mweka hazina wa jiji[a], anawasalimu; na Kwarto, ndugu, pia anawasalimu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “msimamizi wa jiji.” Neno la Kigiriki linaweza kumaanisha msimamizi wa shughuli za jiji kwa maana pana, ingawa “mweka hazina” huenda likawa cheo kilichokusudiwa hapa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάζεται
  choice: anawasalimu
  rationale: Hii ndiyo maana ya kawaida ya kitenzi hiki katika salamu za mwisho za barua za Paulo; ni ya asili na inaeleweka vizuri katika Kiswahili cha sasa.
- source_word: ξένος
  choice: anayenikaribisha
  rationale: Katika muktadha huu neno hilo humaanisha mtu anayempokea mwingine kwa ukarimu nyumbani kwake. Muundo huu wa kitenzi ni wa asili zaidi kwa Kiswahili kuliko nomino kama “mwenyeji,” ambayo inaweza pia kumaanisha mwenyeji wa eneo.
- source_word: ὅλης τῆς ἐκκλησίας
  choice: kanisa lote
  rationale: ἐκκλησία hapa ni jumuiya ya waamini, na ὅλης inaonyesha upana wa ukarimu wa Gayo. “Kanisa lote” ni tafsiri sanifu na wazi.
- source_word: οἰκονόμος τῆς πόλεως
  choice: mweka hazina wa jiji
  rationale: Katika mazingira ya utawala wa kiraia, οἰκονόμος yaweza kumaanisha afisa aliyesimamia fedha za jiji. “Mweka hazina” ni wazi, huku tanbihi ikihifadhi uwezekano wa maana pana zaidi.
- source_word: ἀδελφός
  choice: ndugu
  rationale: Neno hilo ni la kiume katika umoja na hapa linaelekea kumtambulisha Kwarto kama mwamini mwenzao. “Ndugu” huhifadhi lugha ya kifamilia bila kuongeza kimilikishi kisichopo katika Kigiriki.
theological_decisions:
- issue: Maana ya ἐκκλησία katika salamu hii
  choice: kanisa
  alternative: kusanyiko; jumuiya ya waamini
  rationale: Katika matumizi ya Paulo, neno hili kwa kawaida humaanisha jumuiya ya Wakristo. “Kanisa” ni la kawaida na haliongezi muundo maalumu wa madhehebu.
- issue: Lugha ya kifamilia katika ὁ ἀδελφός
  choice: ndugu
  alternative: ndugu yetu; mwamini mwenzetu
  rationale: “Ndugu” huhifadhi sitiari ya kifamilia na jinsia ya mhusika bila kuongeza “yetu,” ambalo halimo wazi katika matini ya Kigiriki.
- issue: Ukarimu wa Gayo kwa kanisa lote
  choice: anayenikaribisha mimi na kulikaribisha kanisa lote
  alternative: mwenyeji wangu na wa kanisa lote
  rationale: Kigiriki kinaunganisha Paulo na kanisa lote na ξένος. Tafsiri imehifadhi madai hayo bila kufafanua kama Gayo alikaribisha kusanyiko lote kwa pamoja au aliwahudumia washiriki wake kwa upana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa heshima, wa sasa na unaosomeka kwa urahisi. Urudiaji wa “anawasalimu” umehifadhi mwendo wa salamu za Kigiriki, na semikoloni inatenganisha salamu za Erasto na Kwarto kwa uwazi.
