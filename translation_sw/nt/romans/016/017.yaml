  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί, σκοπεῖν τοὺς τὰς διχοστασίας καὶ τὰ σκάνδαλα παρὰ τὴν διδαχὴν ἣν ὑμεῖς ἐμάθετε ποιοῦντας, καὶ ⸀ἐκκλίνετε ἀπ’ αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/017.yaml
  text: I urge you[a], brothers, to watch out for those who cause divisions and stumbling blocks contrary to the teaching that you learned, and turn away from them.
translation:
  language: sw
  text: Nawasihi, ndugu, muwaangalie kwa makini wale wanaosababisha migawanyiko na vikwazo, kinyume na mafundisho mliyojifunza; jiepusheni nao.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Παρακαλῶ
  choice: Nawasihi
  rationale: Kitenzi hiki kinaonyesha ombi la kichungaji lenye uzito; “nawasihi” ni cha kawaida, chenye heshima, na kinahifadhi nguvu ya wito huo.
- source_word: ἀδελφοί
  choice: ndugu
  rationale: “Ndugu” ni neno la kawaida la Kiswahili la kuhutubia waumini na linaweza kuwajumuisha wanaume na wanawake bila kupoteza maana ya uhusiano wa kifamilia.
- source_word: σκοπεῖν
  choice: mwaangalie kwa makini
  rationale: Usemi huu unaonyesha kuwachunguza watu hao kwa uangalifu na tahadhari, si kuwaona tu.
- source_word: διχοστασίας
  choice: migawanyiko
  rationale: Neno hili linaeleza mipasuko na mafarakano yanayovuruga jumuiya.
- source_word: σκάνδαλα
  choice: mambo ya kukwaza
  rationale: Uchaguzi huu unahifadhi taswira ya kusababisha wengine wajikwae, badala ya kuifanya kuwa hisia ya kukasirika tu.
- source_word: παρὰ τὴν διδαχὴν
  choice: kinyume na mafundisho
  rationale: παρά pamoja na hali ya accusative hapa huonyesha kupotoka kutoka au kupingana na kiwango cha mafundisho yaliyopokewa.
- source_word: ἐμάθετε
  choice: mliyojifunza
  rationale: Hii inaonyesha mafundisho ambayo waumini walikuwa wamekwisha kuyapata na kujifunza.
- source_word: ποιοῦντας
  choice: wanaosababisha
  rationale: Katika muktadha huu, participle inaeleza watu wanaotokeza migawanyiko na mambo ya kukwaza.
- source_word: ἐκκλίνετε ἀπ’ αὐτῶν
  choice: jiepusheni nao
  rationale: Amri hii inaeleza kugeuka kutoka kwa watu hao na kutoshirikiana nao; “jiepusheni nao” ni Kiswahili cha asili chenye nguvu ya amri.
theological_decisions:
- issue: Watu wanaorejelewa na ἀδελφοί
  choice: Kutumia “ndugu” katika maandishi makuu
  alternative: “ndugu wa kiume na wa kike”
  rationale: Ingawa umbo la Kigiriki ni la wingi wa kiume, katika matumizi ya Paulo huenda linahutubia kusanyiko lote. Neno “ndugu” katika Kiswahili linaweza kuwajumuisha wote kwa kawaida, hivyo hakuna haja ya kuongeza jinsia ambazo hazikutajwa wazi katika chanzo.
- issue: Maana ya σκάνδαλα
  choice: mambo ya kukwaza
  alternative: vikwazo
  rationale: Tafsiri iliyochaguliwa inahifadhi taswira ya kimaadili au kiroho ya kuwafanya wengine wajikwae, bila kuamua kwa namna finyu aina kamili ya madhara yanayokusudiwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa moja kwa moja na unaeleweka kwa wasomaji wa kawaida; “mambo ya kukwaza” huhifadhi sitiari ya chanzo, huku “mwaangalie kwa makini” ikitoa tahadhari iliyomo katika σκοπεῖν.
