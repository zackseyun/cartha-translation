reference: Romans 9:25
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὡς καὶ ἐν τῷ Ὡσηὲ λέγει· Καλέσω τὸν οὐ λαόν μου λαόν μου καὶ τὴν οὐκ ἠγαπημένην ἠγαπημένην·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/025.yaml
  text: as he also says in Hosea[a], “I will call those who were not my people, ‘my people,’ and her who was not loved[c][b], ‘loved.’”
translation:
  language: sw
  text: Kama asemavyo pia katika Hosea, “Nitawaita wale waliokuwa si watu wangu, ‘watu wangu,’[a] na yule ambaye hakupendwa, ‘aliyependwa.’”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki hutumia maumbo ya umoja katika sehemu zote mbili. Hapa “wale waliokuwa si watu wangu” hutafsiri kwa kawaida maana ya kijumuiya ya neno “watu” katika Kiswahili.
    reason: lexical_alternative
  - marker: b
    text: Nukuu imetoka Hosea 2:23 (mpangilio wa mistari hutofautiana katika baadhi ya mapokeo). Paulo anatumia lugha ya Hosea kuhusu kurejeshwa ili kueleza Mungu anavyowaita watu kuwa watu wake.
    reason: cross_reference
lexical_decisions:
- source_word: ὡς καὶ
  choice: Kama ... pia
  rationale: Inaonyesha kuwa nukuu hii ni ushahidi mwingine unaounga mkono hoja ya Paulo, huku ikisomeka kwa kawaida katika Kiswahili.
- source_word: ἐν τῷ Ὡσηὲ
  choice: katika Hosea
  rationale: Ni namna fupi na ya kawaida ya kutaja maandiko ya kitabu cha Hosea bila kuongeza neno lisilokuwapo moja kwa moja katika Kigiriki.
- source_word: λέγει
  choice: asemavyo
  rationale: Inadumisha usemi wa nafsi moja unaomwelekeza Mungu kama msemaji katika Maandiko na kuungana kwa kawaida na ‘Kama ... pia.’
- source_word: Καλέσω
  choice: Nitawaita
  rationale: Kitenzi καλέω hapa kina wazo la kuwaita au kuwapa utambulisho wa agano; ‘Nitawaita’ huhifadhi usemi huo moja kwa moja.
- source_word: τὸν οὐ λαόν μου
  choice: wale ambao hawakuwa watu wangu
  rationale: Ingawa umbo la Kigiriki ni umoja, ‘watu’ lina maana ya kijumuiya; wingi huu ni wa kawaida katika Kiswahili na unaonyesha hali yao ya awali.
- source_word: λαόν μου
  choice: watu wangu
  rationale: Huhifadhi usemi wa kawaida wa agano na uhusiano wa kumilikiwa na Mungu.
- source_word: τὴν οὐκ ἠγαπημένην
  choice: yule ambaye hakupendwa
  rationale: Huhifadhi umoja na wazo la hali ya kutopendwa; Kiswahili hakilazimishi jinsia ya kike katika kiwakilishi hiki, lakini muktadha wa Hosea unabaki wazi katika tanbihi.
- source_word: ἠγαπημένην
  choice: aliyependwa
  rationale: Huhifadhi umbo la kutendwa na uhusiano wa moja kwa moja na kitenzi ‘kupenda,’ badala ya kutumia jina la cheo lisilo la kawaida.
theological_decisions:
- issue: Nguvu ya kijumuiya au ya mtu mmoja katika nukuu ya Hosea
  choice: Kifungu cha kwanza kimetafsiriwa kwa wingi wa kijumuiya, ‘wale ambao hawakuwa watu wangu,’ huku cha pili kikibaki katika umoja, ‘yule ambaye hakupendwa.’
  alternative: 'Kudumisha umoja mkali katika vifungu vyote viwili: ‘yule ambaye hakuwa watu wangu ... yule ambaye hakupendwa,’ au kutumia majina ya kiishara ‘Si-Watu-Wangu’ na ‘Asiyependwa.’'
  rationale: λαός ni watu kwa maana ya jumuiya, hivyo wingi unasikika kwa kawaida katika Kiswahili. Hata hivyo, umoja wa sehemu ya pili umehifadhiwa ili kutofifisha kabisa muundo na usuli wa Hosea.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa nukuu ni rahisi kueleweka kwa wasomaji wa kawaida, huku tanbihi ikihifadhi umoja wa Kigiriki na usuli wa kinabii.
