  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: τοῦτ’ ἔστιν, οὐ τὰ τέκνα τῆς σαρκὸς ταῦτα τέκνα τοῦ θεοῦ, ἀλλὰ τὰ τέκνα τῆς ἐπαγγελίας λογίζεται εἰς σπέρμα·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/008.yaml
  text: That is[a], it is not the children of the flesh who are the children of God[b], but the children of the promise are counted as offspring.
translation:
  language: sw
  text: Yaani, si watoto wa mwili[a] walio watoto wa Mungu, bali watoto wa ahadi ndio wanaohesabiwa kuwa uzao[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “watoto kwa nasaba ya asili.” Kigiriki: “watoto wa mwili.”'
    reason: lexical_alternative
  - marker: b
    text: Au, “wanahesabiwa kuwa mbegu.” Hapa neno “uzao” limetumika kutafsiri neno la Kigiriki sperma kwa maana ya wazao.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτ’ ἔστιν
  choice: Yaani
  rationale: Hutambulisha ufafanuzi wa Paulo kwa njia fupi na ya kawaida katika Kiswahili.
- source_word: τέκνα
  choice: watoto
  rationale: Ni neno jumuishi kwa jinsia zote na linadumisha urudiaji wa kimakusudi katika sentensi.
- source_word: σάρξ / τὰ τέκνα τῆς σαρκὸς
  choice: mwili / watoto wa mwili
  rationale: Tafsiri hii inahifadhi taswira ya Paulo na tofauti yake na ‘watoto wa ahadi’; hapa ina maana ya nasaba ya kibinadamu, si uovu wa kimaadili.
- source_word: τέκνα τοῦ θεοῦ
  choice: watoto wa Mungu
  rationale: Ni Kiswahili cha asili kinachohifadhi uhusiano wa genitivi na tofauti ya kihoja.
- source_word: ἐπαγγελία / τὰ τέκνα τῆς ἐπαγγελίας
  choice: ahadi / watoto wa ahadi
  rationale: Inahifadhi usemi wa Paulo kuhusu watoto wanaotambulishwa kwa ahadi ya Mungu bila kuufafanua kupita kiasi.
- source_word: λογίζεται
  choice: wanaohesabiwa
  rationale: Huwasilisha maana ya kutambuliwa au kuonwa kuwa, huku ikibakiza nguvu ya sitiari ya kuhesabu.
- source_word: εἰς σπέρμα
  choice: kuwa uzao
  rationale: ‘Uzao’ hueleza σπέρμα katika maana ya wazao na inafaa katika muktadha wa nasaba ya Abrahamu.
theological_decisions:
- issue: Tofauti kati ya wazao wa kimwili na watoto wanaofafanuliwa kwa ahadi ya Mungu
  choice: 'Kuhifadhi tofauti kama ilivyo: watoto wa mwili si kwa msingi huo watoto wa Mungu; watoto wa ahadi wanahesabiwa kuwa uzao.'
  alternative: Kufanya wazi ama mfumo wa pekee wa kihistoria-kijumuiya ama fundisho maalumu la kuchaguliwa kwa mtu mmoja mmoja.
  rationale: Kigiriki kinatoa tofauti hii bila kutatua moja kwa moja mijadala yote mipana ya kiteolojia katika Waroma 9; tafsiri haipaswi kuingiza mfumo wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka. Muundo wa ‘watoto wa mwili’ na ‘watoto wa ahadi’ umehifadhiwa ili kudumisha ulinganifu wa Paulo, huku tanbihi zikifafanua maana ya nasaba.
