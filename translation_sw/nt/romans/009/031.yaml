lexical_decisions:
- source_word: Ἰσραὴλ
  choice: Israeli
  rationale: Jina la kawaida la taifa; limetumiwa hapa kwa maana ya pamoja na kuendelezwa kama nafsi moja, kama lilivyo katika Kigiriki.
- source_word: δὲ
  choice: Lakini
  rationale: Linaonyesha tofauti na kauli iliyotangulia kuhusu watu wa mataifa mengine.
- source_word: διώκων
  choice: akiifuata
  rationale: Linaonyesha jitihada ya kuifuatilia kwa bidii bila kuongeza wazi maana ya concessive ambayo haijasemwa moja kwa moja.
- source_word: νόμον δικαιοσύνης
  choice: sheria ya haki
  rationale: Muundo huu mfupi unahifadhi uhusiano wenye uwezekano wa kufasiriwa kwa njia mbalimbali kati ya sheria na haki, bila kuupanua kuwa ‘sheria inayoleta haki.’
- source_word: δικαιοσύνης
  choice: haki
  rationale: ‘Haki’ ni neno la kawaida la Kiswahili linaloweza kubeba maana za righteousness na justice katika muktadha huu wa Paulo.
- source_word: εἰς νόμον οὐκ ἔφθασεν
  choice: hakuifikia sheria hiyo
  rationale: Kitenzi kinaeleza kutofikia kilichofuatiliwa; ‘sheria hiyo’ linaonyesha kwa kawaida kurejelewa kwa sheria iliyotajwa, huku tanbihi ikihifadhi ugumu wa muundo wa Kigiriki.
theological_decisions:
- issue: Maana ya δικαιοσύνη katika hoja ya Paulo
  choice: haki
  alternative: uadilifu
  rationale: ‘Haki’ linafaa katika mjadala wa Paulo kuhusu kuwa sawa mbele za Mungu na pia halifuti kabisa wazo la justice; ‘uadilifu’ limehifadhiwa kama uwezekano wa kileksika.
- issue: Kitu ambacho Israeli hakukifikia
  choice: sheria hiyo
  alternative: haikuifikia / haikuifikia sheria
  rationale: Kigiriki kimerudia νόμον kwa muundo mfupi na mgumu. Tafsiri kuu inaelewa nomino ya pili kuwa inarejelea sheria inayofuatiliwa, bila kuibadili kwa tafsiri pana zaidi kama ‘lengo la sheria.’
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Israeli imetendewa kama taifa lililowakilishwa kwa nafsi moja, kufuatana na umoja wa kisarufi wa Kigiriki. Alama zote za tanbihi zimewekwa baada ya maneno yanayohusika.
