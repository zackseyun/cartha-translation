  text: But Israel[a], pursuing a law of righteousness[b], did not attain to that law.
translation:
  language: sw
  text: Lakini Israeli, akiifuata sheria ya haki[a], hakuifikia sheria hiyo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sheria ya uadilifu.”
