  yaml_path: translation/nt/romans/009/028.yaml
  text: For the Lord will carry out his word on the earth[c][b][a], finishing it and cutting it short.
translation:
  language: sw
  text: Kwa maana Bwana atalitekeleza neno lake[a] duniani[c], akilikamilisha na kulifupisha[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Bwana atalitekeleza jambo au tamko duniani.”
    reason: lexical_alternative
  - marker: b
    text: “Kulifupisha” kunaweza pia kueleweka kuwa “kulikata kifupi” au, kwa maana inayodokezwa, “kulitekeleza kwa haraka.”
    reason: lexical_alternative
  - marker: c
    text: Wengine hutafsiri ἐπὶ τῆς γῆς kuwa “katika nchi,” wakifuata muktadha wa awali wa maneno ya Isaya; maandishi ya Waroma hapa yanasema “duniani.”
    reason: cross_reference
lexical_decisions:
- source_word: λόγον
  choice: neno lake
  rationale: “Neno” linadumisha maana ya jambo ambalo Bwana amesema au ametangaza na ambalo atalitimiza. Kiwakilishi “lake” kinawekwa kwa kawaida katika Kiswahili kwa kuhusisha neno hilo na Bwana, ambaye ndiye mtendaji.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Kiunganishi hiki kinaonyesha kuwa mstari huu unatoa sababu au ufafanuzi wa kauli iliyotangulia.
- source_word: συντελῶν
  choice: akilikamilisha
  rationale: Kitenzi hiki huonyesha kufikisha jambo kwenye ukamilifu au mwisho wake; muundo wa “aki-” unaonyesha tendo linaloandamana na utekelezaji wa neno.
- source_word: καὶ συντέμνων
  choice: na kulifupisha
  rationale: Tafsiri hii inadumisha taswira ya kukata au kufupisha bila kuamua kimya kimya kwamba maana pekee ni kutenda kwa haraka.
- source_word: ποιήσει
  choice: atalitekeleza
  rationale: Pamoja na λόγον, “kutekeleza” huwasilisha maana ya kufanya litimie jambo lililosemwa au kutangazwa, kwa uwazi zaidi kuliko “kufanya.”
- source_word: κύριος
  choice: Bwana
  rationale: Hili ndilo neno la kawaida, lenye hadhi, kwa kumtaja Mungu katika nukuu hii.
- source_word: ἐπὶ τῆς γῆς
  choice: duniani
  rationale: Katika maandishi ya Kigiriki ya Waroma, kifungu hiki kwa kawaida kina maana ya “juu ya dunia/duniani”; Kiswahili cha kawaida husema “duniani.”
theological_decisions:
- issue: Asili ya tendo la Mungu katika nukuu ya Isaya
  choice: Mstari unasema kwamba Bwana atalifikisha neno lake kwenye utimilifu kwa njia kamili na iliyofupishwa, bila kubainisha mfumo maalumu wa kimadhehebu.
  alternative: Bwana atatekeleza hukumu yake kwa haraka na kwa uamuzi thabiti.
  rationale: Maneno ya Kigiriki yanaweza kuwa na ladha ya hukumu na kasi, lakini tafsiri kuu inadumisha upana na mvutano wa kifungu badala ya kuufanya ufafanuzi mmoja kuwa ndio maana pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Atalitekeleza” ni cha kawaida na kinaeleweka, huku “akilikamilisha na kulifupisha” kikidumisha urudiaji na mvutano wa Kigiriki. Alama zote za tanbihi zimewekwa karibu na maneno yanayohusika.
