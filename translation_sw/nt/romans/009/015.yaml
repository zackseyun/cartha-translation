  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: τῷ ⸂Μωϋσεῖ γὰρ⸃ λέγει· Ἐλεήσω ὃν ἂν ἐλεῶ, καὶ οἰκτιρήσω ὃν ἂν οἰκτίρω.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/015.yaml
  text: For he says to Moses[a], “I will have mercy on whomever I have mercy[b], and I will have compassion on whomever I have compassion.”
translation:
  language: sw
  text: 'Kwa maana anamwambia Musa: “Nitamrehemu yeyote ninayemrehemu,[a] nami nitamhurumia yeyote ninayemhurumia.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “Nitamwonea rehema yeyote ninayemwonea rehema, nami nitamwonea huruma yeyote ninayemwonea huruma.”'
    reason: lexical_alternative
  - marker: b
    text: Dondoo kutoka Kutoka 33:19.
    reason: cross_reference
lexical_decisions:
- source_word: τῷ Μωϋσεῖ
  choice: anamwambia Musa
  rationale: Dative marks Moses as the person addressed. The standard Swahili name is “Musa,” and the object marker -mw- makes the addressee explicit and natural.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Introduces the reason or scriptural support for the preceding statement while preserving Paul’s argumentative connection.
- source_word: λέγει
  choice: anamwambia
  rationale: Preserves the Greek present-tense citation formula and personally identifies the implied speaker as God in the context of the quotation.
- source_word: Ἐλεήσω … ἐλεῶ
  choice: Nitamrehemu … ninayemrehemu
  rationale: “Rehemu” naturally conveys showing mercy. Repeating the same verb preserves the deliberate tautology and the future/present verbal contrast as far as idiomatic Swahili allows.
- source_word: ὃν ἂν
  choice: yeyote
  rationale: Expresses the indefinite object without adding the interpretive idea of choosing, which is not lexically present in this phrase.
- source_word: οἰκτιρήσω … οἰκτίρω
  choice: nitamhurumia … ninayemhurumia
  rationale: “Hurum ia” expresses compassion and remains distinct from “rehemu,” preserving the parallel but non-identical Greek verbs.
theological_decisions:
- issue: Utambulisho wa msemaji katika dondoo
  choice: “anamwambia,” ikimrejelea Mungu anayesema na Musa
  alternative: “Maandiko yanasema kwa Musa” au usemi usiotaja mhusika
  rationale: Kitenzi cha Kigiriki hakina kiima kilichotajwa wazi, lakini muktadha wa Kutoka 33:19 unaonyesha kwamba Mungu ndiye anayesema. Tafsiri ya kibinafsi haiongezi fundisho lisilokuwapo.
- issue: Uhuru wa Mungu katika rehema na huruma
  choice: 'Kudumisha urudiaji: “Nitamrehemu yeyote ninayemrehemu …”'
  alternative: Kufafanua kuwa “nitamrehemu yeyote nitakayemchagua”
  rationale: Neno “chagua” halipo katika Kigiriki. Urudiaji wa chanzo unahifadhi uzito na mvutano wa kitheolojia bila kuamua mabishano ya kiufafanuzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Kwa maana” huhifadhi mtiririko wa hoja; “rehemu” na “hurumia” hudumisha tofauti ya maneno ya Kigiriki. Alama zote za tanbihi zimewekwa katika matini kuu.
