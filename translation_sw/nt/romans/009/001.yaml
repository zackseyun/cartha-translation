  text: Ἀλήθειαν λέγω ἐν Χριστῷ, οὐ ψεύδομαι, συμμαρτυρούσης μοι τῆς συνειδήσεώς μου ἐν πνεύματι ἁγίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/001.yaml
  text: I am telling the truth in Messiah[a]; I am not lying, as my conscience bears witness with me in the Holy Spirit[c][b],
translation:
  language: sw
  text: Nasema kweli katika Masihi[a]; sisemi uongo, dhamiri yangu ikishuhudia pamoja nami katika Roho Mtakatifu[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika Kristo.” Neno la Kigiriki Χριστός linaweza kufanya kazi kama cheo (“Masihi”) au kwa namna inayokaribia jina (“Kristo”); hapa limetafsiriwa kama cheo.
    reason: lexical_alternative
  - marker: b
    text: Au, “huku dhamiri yangu ikishuhudia pamoja nami.”
    reason: lexical_alternative
  - marker: c
    text: Au, labda “katika roho takatifu,” ingawa katika maandishi ya Paulo hapa inaeleweka kwa kawaida zaidi kuwa ni Roho Mtakatifu.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀλήθειαν λέγω
  choice: Ninasema kweli
  rationale: Hii ni nahau ya Kigiriki yenye maana ya kusema kwa kweli; tafsiri hii ni ya moja kwa moja, ya kawaida, na inadumisha uzito wa tamko.
- source_word: ἐν Χριστῷ
  choice: katika Masihi
  rationale: Χριστός ni cheo chenye maana ya Mtiwa-Mafuta; “Masihi” inadumisha nguvu ya cheo hicho, huku “katika” ikihifadhi ἐν bila kuifafanua kupita kiasi.
- source_word: οὐ ψεύδομαι
  choice: sisemi uongo
  rationale: Hii ni kauli ya kawaida na ya wazi ya Kiswahili inayodumisha msisitizo wa Paulo kwamba hasemi uongo.
- source_word: συμμαρτυρούσης
  choice: inashuhudia pamoja nami
  rationale: Kitenzi hiki kina wazo la kutoa ushahidi pamoja na mtu mwingine; usemi huu unadumisha maana ya kiambishi συμ- na kuwasilisha hali inayoandamana na tamko kuu.
- source_word: τῆς συνειδήσεώς μου
  choice: Dhamiri yangu
  rationale: “Dhamiri” ni neno la kawaida la Kiswahili kwa συνείδησις katika muktadha wa maadili na kujitambua kwa ndani.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: katika Roho Mtakatifu
  rationale: Katika matumizi ya Paulo, kirai hiki kinaeleweka kwa kawaida kuwa kinamrejelea Roho Mtakatifu; “katika” inadumisha kihusishi ἐν badala ya kukifasiri moja kwa moja kuwa cha njia au chombo.
theological_decisions:
- issue: Mrejelewa wa πνεύματι ἁγίῳ
  choice: Roho Mtakatifu, yaani Roho wa Mungu
  alternative: roho takatifu, labda roho ya Paulo iliyo katika hali ya utakatifu
  rationale: Matumizi ya Paulo yanaunga mkono kwa nguvu rejeo kwa Roho Mtakatifu, lakini ukosefu wa kibainishi katika Kigiriki unaacha uwezekano mdogo wa usomaji mwingine; uwezekano huo umehifadhiwa katika tanbihi.
- issue: Nguvu ya Χριστός katika ἐν Χριστῷ
  choice: Masihi kama cheo
  alternative: Kristo, kama umbo lililozoeleka zaidi na linaloweza kufanya kazi kama jina
  rationale: Neno la Kigiriki linaweza kutumika kama cheo au kwa namna inayokaribia jina. “Masihi” linaonyesha maana ya cheo bila kuondoa uwezekano wa tafsiri iliyozoeleka “Kristo,” ambayo imetajwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima, na rahisi kueleweka. Sentensi mbili fupi zinadumisha msisitizo wa kiapo cha Paulo, na maneno “inashuhudia pamoja nami” yanahifadhi wazo la ushahidi unaoambatana bila kulainisha mvutano wa kisarufi.
