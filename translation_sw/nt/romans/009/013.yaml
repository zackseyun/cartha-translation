  text: 'Kama ilivyoandikwa: “Nilimpenda Yakobo, lakini nilimchukia[a] Esau.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nilimkataa” au “nilimpenda kidogo.” Nukuu hii ni kutoka Malaki 1:2–3; baadhi huielewa “nilimchukia” hapa kuwa kukataa katika muktadha wa agano au kupenda mmoja kuliko mwingine, wala si lazima iwe hisia ya uhasama.
    reason: lexical_alternative
  - marker: b
