    reason: cross_reference
lexical_decisions:
- source_word: καθὼς
  choice: kama
  rationale: Hutanguliza nukuu ya Maandiko kwa njia fupi na ya kawaida katika Kiswahili; pamoja na ‘ilivyoandikwa’ huonyesha ulinganifu wa καθὼς.
- source_word: γέγραπται
  choice: ilivyoandikwa
  rationale: Kauli timilifu tendwa ni fomula ya kunukuu Maandiko; ‘ilivyoandikwa’ ni usemi wa Kiswahili unaoeleweka na kuhifadhi maana kwamba maandishi hayo yanasimama kama mamlaka.
- source_word: Ἰακώβ
  choice: Yakobo
  rationale: Jina limetolewa kwa umbo la kawaida la kibiblia katika Kiswahili.
- source_word: ἠγάπησα
  choice: Nilimpenda
  rationale: Wakati uliopita unaendana na aoristi ya nukuu na kitenzi ‘penda’ kinatoa maana ya moja kwa moja ya ἀγαπάω.
- source_word: δὲ
  choice: lakini
  rationale: Huonyesha wazi utofautishaji kati ya Yakobo na Esau.
- source_word: Ἠσαῦ
  choice: Esau
  rationale: Jina limetolewa kwa umbo la kawaida la kibiblia katika Kiswahili.
- source_word: ἐμίσησα
  choice: nilimchukia
  rationale: Huhifadhi maana ya moja kwa moja na yenye nguvu ya μισέω bila kuipunguza kwa tafsiri ya kimafundisho; uwezekano wa maana ya kukataa au kupenda kwa kiwango kidogo umewekwa katika tanbihi.
theological_decisions:
- issue: Iwapo kauli ‘nilimchukia’ ipunguzwe makali kwa sababu ya mijadala kuhusu uchaguzi wa Mungu na matumizi ya kiidiomu
  choice: Kudumisha ‘nilimchukia’ katika matini kuu
  alternative: ‘nilimkataa’ au ‘nilimpenda kwa kiwango kidogo’
  rationale: Nukuu ya Kigiriki inatumia μισέω, neno lenye maana ya kawaida ya ‘chukia.’ Matini kuu inahifadhi mvutano wa kiteolojia badala ya kuutatua kimafasiri; tanbihi inaonyesha maelezo mengine yanayowezekana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni mfupi na wa kawaida kwa nukuu ya Maandiko. Viambishi vya yambwa katika ‘nilimpenda’ na ‘nilimchukia’ vinaweka ulinganifu wa vifungu viwili na kutaja majina baada ya vitenzi kunafuata mkazo wa chanzo.
