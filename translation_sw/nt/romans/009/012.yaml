base_translation:
  language: en
  yaml_path: translation/nt/romans/009/012.yaml
  text: not from works but from the One who calls[a], it was said to her[c][b], “The older will serve the younger.”
translation:
  language: sw
  text: si kutokana na matendo, bali kutokana na yule anayeita,[a] aliambiwa, “Mkubwa atamtumikia mdogo.”[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “si kwa msingi wa matendo, bali kwa msingi wa yule anayeita.”
    reason: lexical_alternative
  - marker: b
    text: Nukuu kutoka Mwanzo 25:23.
    reason: cross_reference
  - marker: c
    text: “Mkubwa” na “mdogo” yanaweza pia kutafsiriwa “aliye mkuu zaidi” na “aliye mdogo zaidi”; katika muktadha wa Yakobo na Esau, yanaweza kurejelea tofauti ya umri.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ ἐξ ἔργων
  choice: si kutokana na matendo
  rationale: Kirai hiki kinahifadhi maana ya ἐκ kama chanzo au msingi wa jambo, huku kikibaki kifupi na cha kawaida katika Kiswahili.
- source_word: ἀλλ’ ἐκ τοῦ καλοῦντος
  choice: bali kutokana na yule anayeita
  rationale: Kivumishi-endelevu chenye kibainishi kinawakilishwa kama nomino, “yule anayeita.” Wakati wa sasa wa tendo la kuita umehifadhiwa, bila kumtaja Mungu waziwazi mahali ambapo Kigiriki hakufanyi hivyo.
- source_word: ἐρρέθη αὐτῇ
  choice: aliambiwa
  rationale: Hii ni njia ya kawaida na ya heshima ya kuwasilisha kauli-tendwa ya Kigiriki katika Kiswahili, huku mhusika wa kike akieleweka kutokana na muktadha.
- source_word: ὅτι
  choice: alama za kunukuu
  rationale: Hapa ὅτι inaanzisha usemi wa moja kwa moja; alama za kunukuu zinawasilisha kazi hiyo kwa Kiswahili cha sasa.
- source_word: Ὁ μείζων
  choice: Mkubwa
  rationale: “Mkubwa” linaweza kumaanisha mkubwa kwa umri au aliye mkuu zaidi, hivyo linadumisha upana wa neno la Kigiriki na linafaa kwa muktadha wa Esau na Yakobo.
- source_word: δουλεύσει
  choice: atamtumikia
  rationale: Kitenzi hiki kinaonyesha huduma au hali ya kuwa chini ya mwingine bila kulazimisha hapa maana maalumu ya utumwa wa kumilikiwa.
- source_word: τῷ ἐλάσσονι
  choice: mdogo
  rationale: “Mdogo” linaendana kwa kawaida na “mkubwa” na linaweza kueleweka kwa umri au hadhi, kama ilivyo katika muktadha huu.
theological_decisions:
- issue: Iwapo utofautishaji kati ya matendo na yule anayeita upanuliwe ili kueleza wazi fundisho fulani kuhusu uchaguzi
  choice: 'Utofautishaji umeachwa katika muundo wake mfupi: “si kutokana na matendo, bali kutokana na yule anayeita.”'
  alternative: si kwa sababu ya matendo, bali kwa sababu ya Mungu anayeita
  rationale: Kifungu kinatofautisha matendo na mwito wa Mungu, lakini hakihitaji jina “Mungu” wala hitimisho pana la kimafundisho kuongezwa ndani ya mstari huu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni mfupi kwa kufuata hoja ya Paulo; “mkubwa” na “mdogo” ni maneno ya kawaida yanayodumisha uwezekano wa maana ya umri na ya hadhi.
