- from: 'Kwa maana hili ndilo neno la ahadi: “Wakati huu nitakuja[a], naye Sara atakuwa na mwana.”'
  to: 'Kwa maana hili ndilo neno la ahadi: “Wakati kama huu nitakuja[a], na Sara atakuwa na mwana.”'
  rationale: The revision makes the temporal promise formula idiomatic and unambiguous in Standard East African Swahili, while maintaining the Greek’s “I will come” and avoiding an added specification such as “mwaka ujao.” It also streamlines the coordination and footnote wording without altering meaning.
