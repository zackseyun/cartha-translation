  text: ἐπαγγελίας γὰρ ὁ λόγος οὗτος· Κατὰ τὸν καιρὸν τοῦτον ἐλεύσομαι καὶ ἔσται τῇ Σάρρᾳ υἱός.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/009.yaml
  text: 'For this is the word of promise: “At this time I will come[a], and Sarah will have a son.”'
translation:
  language: sw
  text: 'Kwa maana hili ndilo neno la ahadi: “Wakati kama huu nitakuja[a], na Sara atakuwa na mwana.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nitarudi.” Kigiriki hapa kinasema “nitakuja,” ingawa baadhi ya tafsiri hufuata maneno ya simulizi la Mwanzo linalohusika na kusema “nitarudi.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπαγγελίας
  choice: la ahadi
  rationale: Hii ni hali ya umilikishi inayolifafanua ‘neno’; ‘neno la ahadi’ ni Kiswahili cha kawaida kinachodumisha msisitizo wa Paulo juu ya ahadi ya Mungu.
- source_word: λόγος
  choice: neno
  rationale: Hapa neno hilo linarejelea tamko linalonukuliwa; ‘neno’ ni fupi, lenye hadhi, na haliongezi ufafanuzi usiomo katika chanzo.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Kiunganishi hiki kinaanzisha maelezo ya dai lililotangulia na kudumisha uhusiano wa kimantiki.
- source_word: Κατὰ τὸν καιρὸν τοῦτον
  choice: Wakati huu
  rationale: Kauli hii inaonyesha wakati uliotajwa wa kutimizwa kwa ahadi na inadokeza mwangwi wa simulizi la Mwanzo bila kuongeza neno ‘uliowekwa,’ ambalo halijasemwa wazi.
- source_word: ἐλεύσομαι
  choice: nitakuja
  rationale: Kitenzi cha Kigiriki kinasema moja kwa moja ‘nitakuja’; tafsiri hii inatanguliza maandishi ya Waroma kuliko mapokeo yanayotafsiri msingi wa Mwanzo kuwa ‘nitarudi.’
- source_word: ἔσται τῇ Σάρρᾳ υἱός
  choice: Sara atakuwa na mwana
  rationale: Muundo wa Kigiriki, kihalisi ‘mwana atakuwa kwa Sara,’ ni nahau ya umilikaji; Kiswahili cha kawaida huieleza kwa ‘atakuwa na mwana.’
- source_word: Σάρρᾳ
  choice: Sara
  rationale: Jina limetolewa kwa umbo lake lililozoeleka katika Kiswahili.
- source_word: υἱός
  choice: mwana
  rationale: Nomino hii inamaanisha mwana wa kiume, si mtoto kwa ujumla; ‘mwana’ inadumisha maana hiyo na hadhi ya lugha ya kibiblia.
theological_decisions:
- issue: Nukuu ya ahadi kwa Abrahamu na utendaji wa Mungu
  choice: Ahadi imetolewa kama usemi wa moja kwa moja wa Mungu, ‘nitakuja,’ bila nyongeza ya kifafanuzi.
  alternative: ‘Nitarudi,’ kwa kufuata namna baadhi ya mapokeo yanavyotafsiri msingi wa Mwanzo.
  rationale: Hoja ya Paulo inategemea ahadi ya Mungu kuwa msingi wa kuzaliwa kwa Isaka. ‘Nitakuja’ inadumisha nguvu hiyo ya kitheolojia huku ikifuata kitenzi kilicho katika maandishi ya Kigiriki ya Waroma.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Hili ndilo neno la ahadi’ ni la asili kuliko ufuataji mgumu wa mpangilio wa Kigiriki, huku ‘naye Sara atakuwa na mwana’ ikitoa nahau ya Kigiriki kwa uwazi bila kupanua maana.
