  text: καθὼς γέγραπται· Ἰδοὺ τίθημι ἐν Σιὼν λίθον προσκόμματος καὶ πέτραν σκανδάλου, ⸀καὶ ὁ πιστεύων ἐπ’ αὐτῷ οὐ καταισχυνθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/033.yaml
  text: As it is written[a], “Look, I am laying in Zion a stone of stumbling and a rock of offense[d][c][b], and the one who believes in him will not be put to shame.”
translation:
  language: sw
  text: Kama ilivyoandikwa:[a] “Tazama, ninaweka katika Sayuni jiwe la kujikwaa na mwamba wa kukwaza;[b] naye anayemwamini[c] hataaibishwa.”[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hapa Paulo anaunganisha Isaya 8:14 na Isaya 28:16.
    reason: cross_reference
  - marker: b
    text: Au “mwamba unaosababisha kuanguka.”
    reason: lexical_alternative
  - marker: c
    text: 'Kigiriki kwa maana ya neno kwa neno: “anayemwamini juu yake.” Baadhi ya tafsiri hurejelea jiwe kwa kusema “anayeliamini”; katika muktadha Paulo anaitumia taswira hiyo kumhusu Masihi.'
    reason: alternative_reading
  - marker: d
    text: Au “hatakatishwa tamaa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: Kama ilivyoandikwa
  rationale: Ni kauli ya kawaida ya kutambulisha nukuu ya Maandiko; inahifadhi hali timilifu ya Kigiriki kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: Ἰδοὺ
  choice: Tazama
  rationale: Inahifadhi mwito wa kuelekeza fikira bila kutumia lugha ya kizamani.
- source_word: τίθημι
  choice: ninaweka
  rationale: Inahifadhi wakati uliopo wa kitenzi na inafaa kwa taswira ya kuweka jiwe.
- source_word: ἐν Σιὼν
  choice: katika Sayuni
  rationale: Inawakilisha maana ya mahali ya ἐν kwa njia iliyo wazi na ya kawaida.
- source_word: λίθον προσκόμματος
  choice: jiwe la kujikwaa
  rationale: Inahifadhi muundo na taswira ya jiwe linalosababisha mtu ajikwae.
- source_word: πέτραν σκανδάλου
  choice: mwamba wa kukwaza
  rationale: Inatofautisha πέτρα na λίθος, huku ikionyesha kwamba mwamba huo huwa sababu ya kuanguka au kukwazika.
- source_word: ὁ πιστεύων
  choice: anayemwamini
  rationale: Inatoa maana ya kishiriki chenye kutumika kama nomino kwa Kiswahili asilia, huku umoja wa jumla ukihifadhiwa.
- source_word: ἐπ’ αὐτῷ
  choice: -mwamini
  rationale: Kiswahili kwa kawaida hueleza imani yenye kumwelekea mtu kwa kitenzi 'kumwamini'; kiambishi -mw- kinawasilisha usomaji wa kibinafsi wa kiwakilishi hicho.
- source_word: καταισχυνθήσεται
  choice: hatatahayarishwa
  rationale: Inahifadhi wakati ujao, kauli ya kutendwa, na maana ya kuaibishwa hadharani kuliko tafsiri ya kiufafanuzi kama 'hatakatishwa tamaa'.
theological_decisions:
- issue: Kirejewa cha αὐτῷ katika nukuu iliyounganisha maandiko ya Isaya
  choice: Imetafsiriwa kibinafsi kuwa “anayemwamini,” kwa kuzingatia matumizi ya Paulo ya jiwe au mwamba kama taswira ya Masihi.
  alternative: “anayeliamini,” kikirejelea jiwe kama kitu kisicho mtu.
  rationale: Ingawa kiwakilishi kinaweza kurejelea jiwe katika taswira yenyewe, muktadha wa Waroma 9:32–33 na 10:11 unaitumia nukuu hiyo kumhusu Masihi. Tafsiri ya kibinafsi pia inaendana na jinsia ya kiwakilishi cha Kigiriki bila kuficha uwezekano wa kisarufi wa taswira ya jiwe, ambao umeelezwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inadumisha mtindo wa nukuu ya kinabii, taswira mbili zinazolingana za jiwe na mwamba, pamoja na uzito wa heshima na aibu katika kitenzi cha mwisho. Alama zote za tanbihi zimewekwa katika matini kuu karibu na vifungu vinavyohusika.
