lexical_decisions:
- source_word: διὰ τί
  choice: Kwa nini?
  rationale: Ni swali fupi la sababu linalodumisha nguvu ya hoja ya Paulo kwa Kiswahili cha kawaida.
- source_word: ὅτι
  choice: Kwa sababu
  rationale: Kiunganishi hiki kinatoa sababu ya jibu kwa swali lililotangulia.
- source_word: οὐκ ἐκ πίστεως
  choice: si kwa imani
  rationale: Kiswahili hiki ni cha asili na kinadumisha wazo la imani kuwa msingi au njia, huku uwezekano wa kutafsiri ἐκ kwa uwazi zaidi ukitajwa katika tanbihi.
- source_word: πίστεως
  choice: imani
  rationale: Hili ndilo neno la kawaida katika muktadha wa Paulo wa kulinganisha imani na matendo; muktadha haulazimishi maana ya uaminifu.
- source_word: ἀλλ’ ὡς ἐξ ἔργων
  choice: bali kana kwamba ni kwa matendo
  rationale: Neno “kana kwamba” linahifadhi uzito wa ὡς na halibadili kauli kuwa dai rahisi la “kwa matendo.”
- source_word: ἔργων
  choice: matendo
  rationale: Ni tafsiri ya kawaida na inayoeleweka ya ἔργα katika mjadala wa Paulo kuhusu imani na matendo.
- source_word: προσέκοψαν
  choice: Walijikwaa kwenye
  rationale: Linahifadhi picha halisi ya kugonga kizuizi na kujikwaa, badala ya kuifasiri moja kwa moja kuwa kukataa au kuchukizwa.
- source_word: τῷ λίθῳ τοῦ προσκόμματος
  choice: jiwe la kukwaza
  rationale: Kauli hii ni ya kawaida kwa Kiswahili na inadumisha uhusiano wa kimawazo kati ya kujikwaa na kitu kinachosababisha kujikwaa.
theological_decisions:
- issue: Maana ya πίστις katika ulinganisho wa imani na matendo
  choice: imani
  alternative: tumaini; uaminifu
  rationale: Katika muktadha huu Paulo analinganisha msingi wa imani na ule unaodhaniwa kuwa wa matendo. “Imani” inadumisha istilahi yake bila kuamua maana finyu zaidi isiyolazimishwa na sentensi.
- issue: Nguvu ya ὡς kabla ya ἐξ ἔργων
  choice: kana kwamba ni kwa matendo
  alternative: kwa matendo
  rationale: Tafsiri iliyochaguliwa inadumisha tahadhari au mlinganisho uliomo katika ὡς, badala ya kuufuta na kutoa kauli ya moja kwa moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo mfupi, wenye hadhi na unaoeleweka. Udondoshaji wa kitenzi katika jibu unadumishwa kwa kauli “si kwa imani,” kwa kuwa muktadha wa mstari uliotangulia hutoa tendo linalozungumziwa. Picha halisi ya kujikwaa na jiwe imehifadhiwa.
