  text: Τί οὖν ἐροῦμεν; ὅτι ἔθνη τὰ μὴ διώκοντα δικαιοσύνην κατέλαβεν δικαιοσύνην, δικαιοσύνην δὲ τὴν ἐκ πίστεως·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/030.yaml
  text: What then shall we say? That the Gentiles, who were not pursuing righteousness, attained righteousness—but the righteousness that is from faith.
translation:
  language: sw
  text: Basi, tuseme nini? Kwamba Mataifa[a], ambayo hayakuwa yakifuatilia haki[b], yalipata haki—yaani, haki itokanayo na imani.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watu wa mataifa.” Hapa inamaanisha watu wasio Wayahudi.
    reason: lexical_alternative
  - marker: b
    text: Au “uadilifu.” Neno la Kigiriki δικαιοσύνη, hapa na katika kurudiwa kwake, linaweza kumaanisha haki au uadilifu wa kimaadili na kisheria; katika muktadha wa Paulo linaweza pia kudokeza hali ya kuwa sawa katika uhusiano wa agano.
    reason: lexical_alternative
  - marker: c
    text: Au “haki inayokuja kwa imani”; kwa uwezekano mdogo hapa, “haki itokanayo na uaminifu.”
    reason: alternative_reading
lexical_decisions:
- source_word: Τί οὖν ἐροῦμεν
  choice: Tuseme nini basi?
  rationale: Ni kauli ya mpito inayotumiwa na Paulo. Kiswahili hiki ni cha kawaida na huhifadhi maana ya wakati ujao wa kutafakari bila kuwa kizito.
- source_word: ἔθνη
  choice: watu wa mataifa
  rationale: Katika muktadha huu neno linamaanisha watu wasio Wayahudi kwa kulinganishwa na Israeli. 'Watu wa mataifa' ni wazi na linaepuka neno la kizamani 'Mataifa' likitumika peke yake.
- source_word: τὰ μὴ διώκοντα
  choice: ambao hawakuwa wakifuatilia
  rationale: Muundo huu huonyesha tendo au mwelekeo unaoendelea; 'hawakuwa wakifuatilia' huhifadhi hali hiyo katika Kiswahili cha kawaida.
- source_word: δικαιοσύνην
  choice: haki
  rationale: '''Haki'' ndilo neno la kawaida la Kiswahili lenye upana wa maana unaoweza kujumuisha uadilifu, hali ya kuwa sawa mbele za Mungu, na kutenda kwa haki, bila kuifungia kauli katika fundisho moja.'
- source_word: κατέλαβεν
  choice: waliipata
  rationale: Katika muktadha huu kitenzi kina maana ya kufikia au kupata kitu ambacho hakikuwa kikifuatiliwa. 'Waliipata' ni cha asili na kinaonyesha vizuri kinaya cha hoja.
- source_word: δικαιοσύνην δὲ τὴν ἐκ πίστεως
  choice: lakini haki inayotokana na imani
  rationale: Kurudiwa kwa 'haki' kunabainisha aina ya haki iliyopatikana. 'Lakini' huhifadhi δέ na msisitizo wake wa kubainisha kwa namna iliyo na ugeuko, huku 'inayotokana na' ikihifadhi wazo la ἐκ.
- source_word: πίστεως
  choice: imani
  rationale: '''Imani'' ndilo neno la kawaida na linalofaa hapa; linaweza kujumuisha kumwamini Mungu bila kulazimisha maana ya uaminifu katika matini kuu.'
theological_decisions:
- issue: Maana ya δικαιοσύνη katika hoja ya Paulo
  choice: haki
  alternative: uadilifu; hali ya kukubaliwa kuwa mwenye haki mbele za Mungu; haki ya agano
  rationale: Aya haifafanui kikamilifu namna ya kitheolojia ambayo haki hii hutolewa. 'Haki' huhifadhi upana wa neno la Paulo na haibani maana kuwa fundisho moja tu.
- issue: Maana ya ἐκ πίστεως
  choice: inayotokana na imani
  alternative: inayokuja kwa imani; inayotokana na uaminifu
  rationale: Tafsiri hii huhifadhi wazo la chanzo lililo katika ἐκ bila kuongeza maneno yenye uzito wa kimadhehebu. 'Uaminifu' unabaki uwezekano wa kileksika, ingawa si uwezekano mkuu hapa.
- issue: Kazi ya δέ katika kishazi cha mwisho
  choice: lakini
  alternative: yaani; bila kiunganishi
  rationale: δέ inaweza kueleweka kama ugeuko unaobainisha aina ya haki iliyopatikana. 'Lakini' huhifadhi chembe hiyo na mvutano wa kauli, ingawa usomaji wa kiufafanuzi unawezekana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imehifadhi muundo wa swali na jibu wa Paulo, urudiaji wa 'haki,' pamoja na mvutano wa δέ na ἐκ πίστεως. Alama zote za tanbihi zimewekwa katika matini kuu.
