  text: καὶ καθὼς προείρηκεν Ἠσαΐας· Εἰ μὴ κύριος Σαβαὼθ ἐγκατέλιπεν ἡμῖν σπέρμα, ὡς Σόδομα ἂν ἐγενήθημεν καὶ ὡς Γόμορρα ἂν ὡμοιώθημεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/029.yaml
  text: And just as Isaiah said before[a], “If the Lord of Hosts had not left us offspring[c][b], we would have become like Sodom and been made like Gomorrah.”
translation:
  language: sw
  text: 'Na kama vile Isaya alivyosema hapo awali: “Kama Bwana wa Majeshi asingalituachia uzao,[a][b] tungalikuwa kama Sodoma, na tungalifanywa kuwa kama Gomora.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “mbegu.” Hapa lina maana ya uzao au wazao waliosalia.
    reason: lexical_alternative
  - marker: b
    text: Nukuu kutoka Isaya 1:9.
    reason: cross_reference
lexical_decisions:
- source_word: καθὼς
  choice: Kama vile
  rationale: Huonyesha ulinganisho na mwendelezo wa hoja kwa Kiswahili cha kawaida.
- source_word: προείρηκεν
  choice: alivyosema hapo awali
  rationale: Huhifadhi maana ya kusema kabla bila kuifanya kauli hiyo iwe lazima unabii wa kutabiri.
- source_word: κύριος Σαβαὼθ
  choice: Bwana wa Majeshi
  rationale: Hutafsiri cheo cha Mungu kilichoandikwa kwa unukuzi wa Kiebrania katika Kigiriki na kuhifadhi wazo la majeshi yaliyo chini ya mamlaka yake.
- source_word: ἐγκατέλιπεν
  choice: asingalituachia
  rationale: Katika sentensi hii ya hali isiyotokea, kitenzi kina maana ya kuwaachia au kuwaacha waendelee kuwapo.
- source_word: σπέρμα
  choice: uzao
  rationale: Huhifadhi maana ya ‘mbegu’ inayotumiwa kwa wazao bila kuingiza moja kwa moja istilahi ya kitheolojia ‘mabaki.’
- source_word: ἂν ἐγενήθημεν
  choice: tungalikuwa
  rationale: Huonyesha matokeo yasiyotokea; katika Kiswahili ‘kuwa kama Sodoma’ ni ya asili kuliko tafsiri ngumu ya ‘tungaligeuka kuwa.’
- source_word: ἂν ὡμοιώθημεν
  choice: tungalifanywa kuwa kama
  rationale: Huhifadhi hali ya kutendwa ya ὁμοιόω na kuitofautisha na kitenzi kilichotangulia.
theological_decisions:
- issue: Tafsiri ya cheo κύριος Σαβαώθ katika nukuu ya Agano la Kale
  choice: Bwana wa Majeshi
  alternative: Bwana Sabaothi
  rationale: Maandishi ya Kigiriki yana κύριος pamoja na unukuzi wa cheo cha Kiebrania. Kutafsiri cheo hicho kunatoa maana wazi kwa msomaji wa sasa bila kuondoa hadhi yake.
- issue: Iwapo σπέρμα itafsiriwe kwa istilahi ‘mabaki’
  choice: uzao
  alternative: mabaki
  rationale: Neno lenyewe ni ‘mbegu/uzao’; ingawa muktadha unahusu waliosalia, ‘mabaki’ lingeingiza ufafanuzi wa kitheolojia badala ya kuhifadhi taswira ya neno la chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa ‘-ngali-’ umetumiwa kuonyesha hali isiyotokea katika wakati uliopita. Alama zote za tanbihi zilizoorodheshwa zimo katika maandishi makuu.
