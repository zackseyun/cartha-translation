  text: And not only that[a], but Rebekah also had conceived by one man, our father Isaac.
translation:
  language: sw
  text: Si hayo tu, bali Rebeka pia alipata mimba kwa mwanamume mmoja, Isaka baba yetu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa karibu zaidi, “Rebeka akiwa na utungaji mimba kutoka kwa mmoja, Isaka baba yetu.” Huu ni usemi unaorejelea kupata mimba kwa mwanamume mmoja.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μόνον δέ, ἀλλὰ καί
  choice: Wala si hivyo tu, bali ... naye
  rationale: Muundo huu wa Kiswahili unaonyesha kwa kawaida kuwa Paulo anaongeza hoja nyingine, huku ukihifadhi uwiano wa kisarufi wa maneno ya Kigiriki.
- source_word: Ῥεβέκκα
  choice: Rebeka
  rationale: Hili ndilo umbo la jina linalotumiwa kwa kawaida katika Biblia za Kiswahili.
- source_word: ἐξ ἑνός
  choice: kwa mwanamume mmoja
  rationale: Kigiriki kinasema kihalisi ‘kutoka kwa mmoja’; muktadha unaonyesha kuwa anayekusudiwa ni baba mmoja, hivyo ‘mwanamume’ huweka maana hiyo wazi kwa Kiswahili cha kawaida.
- source_word: κοίτην ἔχουσα
  choice: alipata mimba
  rationale: Usemi huu unaohusisha kitanda au kulala pamoja unatumiwa hapa kwa maana ya kutungwa kwa mimba; tafsiri hii ni ya heshima, ya asili, na inaeleza maana bila kuongeza neno ‘watoto’ lisilosemwa wazi.
- source_word: Ἰσαὰκ τοῦ πατρὸς ἡμῶν
  choice: yaani Isaka baba yetu
  rationale: ‘Yaani’ huonyesha wazi kwa Kiswahili kwamba Isaka ndiye huyo mmoja aliyetajwa, huku ‘baba yetu’ ikihifadhi lugha ya ukoo ya Paulo.
theological_decisions:
- issue: Jinsi ya kueleza usemi wa kutungwa kwa mimba katika hoja ya Paulo kuhusu uteuzi
  choice: Rebeka alipata mimba kwa mwanamume mmoja, yaani Isaka baba yetu
  alternative: Rebeka alikuwa na kitanda kutoka kwa mmoja, Isaka baba yetu
  rationale: Tafsiri iliyochaguliwa huwasilisha maana ya usemi wa Kigiriki kwa uwazi bila kuingiza watoto au mapacha ndani ya mstari huu. Pia huhifadhi hoja kwamba watoto wa Rebeka walikuwa na baba yuleyule.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Wala si hivyo tu’ na ‘bali ... naye’ huendeleza hoja kwa ulaini; ‘alipata mimba’ huepuka tafsiri ngumu au yenye ukali ya usemi wa kitanda.
