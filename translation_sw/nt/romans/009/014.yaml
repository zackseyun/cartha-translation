  text: What then shall we say? Is there injustice with God? Certainly not![a][b]
translation:
  language: sw
  text: Basi tuseme nini? Je, kuna udhalimu kwa Mungu? La hasha![a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutokuwa na haki.”
    reason: lexical_alternative
  - marker: b
    text: 'Kigiriki: “Isitokee kamwe!” Ni kanusho lenye msisitizo mkubwa; pia hutafsiriwa “Hata kidogo!”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί οὖν ἐροῦμεν
  choice: Basi tuseme nini?
  rationale: Ni fomula ya Paulo ya kuhamia kwenye hitimisho au pingamizi linalofuata. Kiswahili hiki ni cha kawaida na kinahifadhi nguvu ya swali la kutafakari.
- source_word: μὴ
  choice: Je, kuna
  rationale: Katika swali hili μή hutarajia jibu hasi. Muundo wa swali la balagha katika Kiswahili unaonyesha matarajio hayo bila kutafsiri chembe hiyo neno kwa neno.
- source_word: ἀδικία
  choice: udhalimu
  rationale: Hapa neno linamaanisha kutokuwa na haki au kutenda isivyo haki. “Udhalimu” ni neno la sasa, lenye uzito wa kimaadili na kisheria; “kutokuwa na haki” limehifadhiwa katika tanbihi kama namna nyingine.
- source_word: παρὰ τῷ θεῷ
  choice: kwa Mungu
  rationale: Kirai hiki humaanisha kwamba jambo hilo lingeweza kuwapo upande wa Mungu au katika matendo yake. “Kwa Mungu” ni kifupi na cha asili katika swali hili.
- source_word: μὴ γένοιτο
  choice: La hasha!
  rationale: Ni kanusho kali la Paulo. “La hasha!” ni usemi wa Kiswahili ulio wazi na wenye msisitizo, huku maana halisi zaidi ikitolewa katika tanbihi.
theological_decisions:
- issue: Kuhifadhi pingamizi la balagha kuhusu uwezekano wa udhalimu kwa Mungu bila kuingiza mfumo fulani wa kiteolojia katika Waroma 9.
  choice: Mstari unauliza kama kuna udhalimu kwa Mungu, kisha unakataa kwa nguvu, bila kuongeza maelezo kuhusu uteuzi, kukataliwa, au haki ya Mungu.
  alternative: Tafsiri yenye ufafanuzi zaidi ingeweza kusema, “Je, Mungu ni dhalimu?”; tafsiri rasmi zaidi ingeweza kutumia “kutokuwa na haki” na “Isitokee kamwe!”
  rationale: Kigiriki kinaweka pingamizi na kulikataa kwa ufupi na kwa nguvu. Tafsiri hii inahifadhi mvutano huo bila kuupanua kidogma.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Basi tuseme nini?” ni mpito wa kawaida wa balagha; “La hasha!” linatunza nguvu ya kanusho bila lugha nzito au ya kizamani kupita kiasi.
