lexical_decisions:
- source_word: ἄρα οὖν
  choice: Basi
  rationale: Neno hili linaonyesha hitimisho linalotokana na hoja iliyotangulia, kwa mtindo wa kawaida na wenye hadhi katika Kiswahili.
- source_word: ὃν θέλει
  choice: yule amtakaye
  rationale: Muundo huu unahifadhi wazo la kuchagua kwa mapenzi yake na urudiaji wa kimakusudi katika vifungu vyote viwili.
- source_word: ἐλεεῖ
  choice: humrehemu
  rationale: Kitenzi hiki kinaeleza tendo la kumwonyesha mtu rehema; ‘humrehemu’ ni kifupi, cha kawaida, na kinaendana na sajili ya kibiblia.
- source_word: ὃν δὲ θέλει
  choice: lakini ... yule amtakaye
  rationale: ‘Lakini’ linaonyesha wazi tofauti inayoletwa na δέ, huku urudiaji wa ‘yule amtakaye’ ukihifadhi ulinganifu wa Kigiriki.
- source_word: σκληρύνει
  choice: humfanya kuwa mkaidi
  rationale: Kitenzi cha Kigiriki ni cha kutenda na kina maana ya kumfanya mtu kuwa mgumu au mkaidi. Tafsiri hii ni wazi katika Kiswahili na haiipunguzi kauli kuwa ruhusa tu.
theological_decisions:
- issue: Mapenzi ya Mungu katika θέλει
  choice: Kauli ya moja kwa moja ‘amtakaye’ imehifadhiwa katika vifungu vyote viwili.
  alternative: Kufafanua kuwa Mungu anaridhia tu au anaruhusu jambo litokee.
  rationale: Kigiriki kinataja moja kwa moja kutaka kwa mtendaji. Tafsiri haipaswi kutatua mvutano kati ya mapenzi ya Mungu na wajibu wa mwanadamu.
- issue: Utendaji katika σκληρύνει
  choice: 'Imetafsiriwa kwa kauli tendaji: ‘humfanya kuwa mkaidi.’'
  alternative: ‘Humruhusu awe mkaidi’ au ‘huacha moyo wake uwe mgumu.’
  rationale: Kitenzi cha Kigiriki ni cha kutenda na kinamhusisha mtendaji moja kwa moja; kukifanya ruhusa tu kungelainisha maana ya chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi, na inayoeleweka kwa wasomaji wa kawaida. Ulinganifu wa vifungu viwili na mvutano wa kiteolojia wa mstari umehifadhiwa.
