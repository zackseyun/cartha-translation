  yaml_path: translation/nt/romans/009/022.yaml
  text: But what if God[a], wanting to display his wrath and make known his power, endured with great patience vessels of wrath prepared for destruction[c][b],
translation:
  language: sw
  text: Lakini ikiwa Mungu,[a] akitaka kuonyesha ghadhabu na kujulisha uwezo wake,[b] alivumilia kwa subira nyingi vyombo vya ghadhabu vilivyotayarishwa kwa ajili ya kuangamizwa,[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Lakini je, ikiwa Mungu.” Kigiriki kinaanza sentensi ya masharti ya kisemi inayoendelea katika mstari unaofuata.
    reason: lexical_alternative
  - marker: b
    text: Au, “nguvu yake.” Kwa maana ya neno kwa neno, usemi wa Kigiriki hurejelea kile kilicho na nguvu au kinachowezekana kwake; hapa unamaanisha uwezo wa Mungu.
    reason: lexical_alternative
  - marker: c
    text: Kauli tendwa “vilivyotayarishwa kwa ajili ya kuangamizwa” haisemi ni nani aliyevitayarisha. Wafafanuzi hutofautiana kuhusu ikiwa Paulo anadokeza tendo la Mungu, kujitia ugumu kwa vyombo vyenyewe, au hali tu ya kuwa tayari kwa hukumu.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰ δὲ
  choice: Lakini itakuwaje ikiwa
  rationale: Huhifadhi masharti yenye nguvu ya kisemi ambayo yanaendelea katika mstari unaofuata, bila kuufanya mstari huu kuwa sentensi kamili ya madai.
- source_word: θέλων
  choice: akitaka
  rationale: Huwakilisha kitenzi-shirikishi cha sasa kinachoonyesha kusudi au nia ya Mungu inayohusiana na tendo kuu.
- source_word: ἐνδείξασθαι
  choice: kuonyesha
  rationale: Ni lugha ya kawaida na yenye heshima kwa udhihirisho wa makusudi wa ghadhabu.
- source_word: τὴν ὀργήν
  choice: ghadhabu yake
  rationale: ‘Ghadhabu’ hubeba maana nzito ya hukumu ya Mungu kuliko ‘hasira’ ya kawaida.
- source_word: γνωρίσαι
  choice: kujulisha
  rationale: Huhifadhi maana ya kusababisha jambo lijulikane.
- source_word: τὸ δυνατὸν αὐτοῦ
  choice: uwezo wake
  rationale: Ni tafsiri ya asili ya Kiswahili kwa kile kilicho katika uwezo au nguvu za Mungu katika muktadha huu.
- source_word: ἤνεγκεν
  choice: alivumilia
  rationale: Pamoja na ‘kwa subira nyingi,’ kitenzi hiki humaanisha kustahimili au kuvumilia kwa subira.
- source_word: ἐν πολλῇ μακροθυμίᾳ
  choice: kwa subira nyingi
  rationale: Hufuata kwa karibu kiwango cha usemi wa Kigiriki huku ikibaki wazi kwa wasomaji wa kisasa.
- source_word: σκεύη
  choice: vyombo
  rationale: Huhifadhi taswira ya mfinyanzi na vyombo katika muktadha wa karibu.
- source_word: σκεύη ὀργῆς
  choice: vyombo vya ghadhabu
  rationale: Huhifadhi muundo mfupi na wenye mvutano bila kufafanua kupita kiasi uhusiano wa ‘ghadhabu’ na ‘vyombo.’
- source_word: κατηρτισμένα
  choice: vilivyotayarishwa
  rationale: Huwakilisha hali ya kuwa tayari iliyotokana na tendo, lakini haimtaji aliyetayarisha.
- source_word: εἰς ἀπώλειαν
  choice: kwa ajili ya kuangamizwa
  rationale: Huonyesha mwelekeo au matokeo yanayokusudiwa bila kutumia neno la kizamani.
theological_decisions:
- issue: Mtendaji anayedokezwa na kauli tendwa κατηρτισμένα
  choice: vilivyotayarishwa, bila kumtaja mtendaji
  alternative: vilivyotayarishwa na Mungu; vilivyojifanya tayari; vilivyofaa kuangamizwa
  rationale: Kigiriki hakimtaji aliyefanya matayarisho. Tafsiri haipaswi kuamua kimya kimya mvutano wa kiteolojia ambao maandishi yenyewe yanaacha wazi.
- issue: Nguvu ya sentensi ya masharti isiyokamilika inayoanza na εἰ
  choice: Lakini itakuwaje ikiwa ...? na kuacha wazo liendelee katika mstari unaofuata
  alternative: Lakini ikiwa ...; au kuibadili iwe kauli kamili katika mstari huu
  rationale: Muundo wa Paulo unaendelea hadi mstari wa 23. Swali la kisemi huhifadhi hali ya pendekezo bila kulifanya dai la moja kwa moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Vyombo’ huhifadhi taswira ya ufinyanzi; ‘ghadhabu’ huhifadhi uzito wa hukumu ya Mungu. Alama zote za tanbihi zimewekwa katika matini kuu.
