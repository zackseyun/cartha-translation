  text: Οὐχ οἷον δὲ ὅτι ἐκπέπτωκεν ὁ λόγος τοῦ θεοῦ. οὐ γὰρ πάντες οἱ ἐξ Ἰσραήλ, οὗτοι Ἰσραήλ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/006.yaml
  text: But it is not as though the word of God has failed[b][a]. For not all those from Israel are Israel.
translation:
  language: sw
  text: Lakini si kana kwamba neno la Mungu limeshindwa. Kwa maana si wote waliotokana na Israeli[a] ambao ni Israeli.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walio wa ukoo wa Israeli.” Neno la Kigiriki linaonyesha asili au ukoo.
    reason: lexical_alternative
  - marker: b
    text: “Israeli” ya pili inatumiwa kwa namna tofauti na ya kwanza. Paulo anatofautisha wale wenye asili katika Israeli na wale wanaoitwa “Israeli”; mstari huu haufafanui kikamilifu upeo wa tofauti hiyo.
    reason: cross_reference
lexical_decisions:
- source_word: Οὐχ οἷον δὲ ὅτι
  choice: Lakini si kwamba
  rationale: Ni usemi wa kawaida wa Kiswahili unaokanusha hitimisho linaloweza kudhaniwa kutokana na maombolezo yaliyotangulia, bila kuufanya mstari kuwa mzito.
- source_word: ἐκπέπτωκεν
  choice: limeshindwa
  rationale: Katika muktadha wa neno la Mungu, kitenzi hiki kina maana ya kutotimia au kukosa matokeo; wakati timilifu wa Kigiriki unaonyesha hali iliyopo inayotokana na jambo lililotokea.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: neno la Mungu
  rationale: Huhifadhi upana wa λόγος, ambalo hapa linaweza kumaanisha neno la Mungu kwa ujumla, hasa neno lake la ahadi, bila kulifasiri moja kwa moja kuwa ‘ahadi.’
- source_word: οὐ γὰρ πάντες
  choice: Kwa maana si wote
  rationale: ‘Kwa maana’ linaonyesha kuwa kauli inayofuata ndiyo maelezo ya kwa nini neno la Mungu halijashindwa.
- source_word: οἱ ἐξ Ἰσραήλ
  choice: waliotokana na Israeli
  rationale: Huwasilisha kwa kawaida dhana ya asili au ukoo iliyo katika ἐξ, na hivyo kuweka wazi tofauti inayofuata bila kuongeza tafsiri ya kiteolojia.
- source_word: οὗτοι Ἰσραήλ
  choice: ambao ni Israeli
  rationale: Hukamilisha kishazi linganishi kilichofupishwa katika Kigiriki na kuhifadhi tofauti ya makusudi kati ya maana mbili za ‘Israeli.’
theological_decisions:
- issue: Maana ya kutajwa kwa ‘Israeli’ mara ya pili
  choice: Maandishi yanaacha ‘Israeli’ ya pili katika maana yake finyu ya agano au kiteolojia bila kufafanua mipaka yake katika mstari wenyewe.
  alternative: Kuitaja wazi kuwa wateule walio ndani ya Israeli ya kikabila, au watu wote wa kweli wa Mungu kwa upana zaidi.
  rationale: Hoja ya Paulo ni kwamba ukoo wa kimwili pekee haukamilishi maana ya ‘Israeli’ katika kusudi la Mungu. Tafsiri inahifadhi mvutano huo na haingizi hitimisho la kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Waliotokana na Israeli’ ni cha asili kuliko tafsiri ya moja kwa moja ‘walio kutoka Israeli’ kwa sababu muktadha unahusu ukoo, si mahali walikotoka. Mpangilio wa alama za tanbihi umewekwa kulingana na mahali husika katika matini.
