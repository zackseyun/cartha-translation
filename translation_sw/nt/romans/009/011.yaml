  text: μήπω γὰρ γεννηθέντων μηδὲ πραξάντων τι ἀγαθὸν ἢ ⸀φαῦλον, ἵνα ἡ κατ’ ἐκλογὴν πρόθεσις τοῦ θεοῦ μένῃ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/011.yaml
  text: For before they had yet been born or had done anything good or bad[a], so that God’s purpose according to election might remain[c][b],
translation:
  language: sw
  text: Kwa maana, kabla hawajazaliwa wala hawajafanya jambo lolote jema au baya[a], ili kusudi la Mungu kulingana na uteuzi[b] lidumu[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “jambo lolote jema au ovu.” Neno la Kigiriki linaweza kumaanisha kilicho kibaya, duni, au ovu kimaadili; “baya” limetumiwa katika tafsiri kuu kwa kuwa linaendana kwa kawaida na “jema.”
    reason: lexical_alternative
  - marker: b
    text: Au “kusudi la Mungu la uteuzi” / “kusudi la Mungu la kuteua.”
    reason: lexical_alternative
  - marker: c
    text: Au “libaki” au “lisimame imara.” Kitenzi cha Kigiriki humaanisha kubaki au kuendelea, na hapa kinaweza pia kuwa na wazo la kusimama imara.
    reason: lexical_alternative
lexical_decisions:
- source_word: μήπω γὰρ γεννηθέντων
  choice: Kwa maana, kabla hawajazaliwa
  rationale: “Kwa maana” huhifadhi uhusiano wa maelezo wa γάρ, na “kabla hawajazaliwa” huwasilisha kwa Kiswahili cha kawaida hali ya kutokuwa wamezaliwa bado katika muundo wa genitivi huru.
- source_word: μηδὲ πραξάντων τι ἀγαθὸν ἢ φαῦλον
  choice: wala kufanya jambo lolote jema au baya
  rationale: “Wala” huendeleza ukanushaji, huku “jema au baya” likihifadhi ulinganifu wa jozi ya maneno ya Kigiriki bila kuongeza uzito wa kimaadili usiolazimishwa na φαῦλον.
- source_word: ἵνα
  choice: ili
  rationale: “Ili” hudumisha maana ya kusudi inayojitokeza kwa kawaida katika sentensi, bila kuamua mabishano mapana ya kitheolojia.
- source_word: ἡ κατ’ ἐκλογὴν πρόθεσις τοῦ θεοῦ
  choice: kusudi la Mungu kulingana na uteuzi
  rationale: Tafsiri hii huweka wazi muundo wa “kusudi la Mungu” na kirai “kulingana na uteuzi,” badala ya kuyeyusha yote kuwa ufafanuzi wa kitheolojia.
- source_word: μένῃ
  choice: lidumu
  rationale: “Lidumu” hutoa maana ya kuendelea kuwapo au kubaki, inayofaa hapa na iliyo ya asili katika Kiswahili.
theological_decisions:
- issue: Nguvu ya ἵνα katika muktadha wa uteuzi
  choice: ili kusudi la Mungu ... lidumu
  alternative: hivyo kusudi la Mungu ... likadumu
  rationale: Muundo wa kusudi ndio usomaji wa kawaida zaidi, lakini tafsiri haiongezi madai kuhusu jinsi kusudi hilo linavyohusiana na uwajibikaji wa mwanadamu.
- issue: Maana ya ἐκλογή
  choice: uteuzi
  alternative: uchaguzi
  rationale: “Uteuzi” hubeba uzito wa neno katika muktadha huu wa Paulo bila kulifanya liwe uchaguzi wa kawaida tu wala kuingiza mfumo fulani wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Sentensi imeachwa ikiwa na koma mwishoni kwa sababu aya hii ni sehemu ya sentensi inayoendelea katika muktadha. Alama za tanbihi zimepangwa kwa mpangilio wa mahali zinapotokea katika maandishi.
