  text: So then[a], it does not depend on the one who wills or the one who runs[b], but on God who shows mercy.
translation:
  language: sw
  text: Basi[a], jambo hilo halitegemei yule anayetaka wala yule anayekimbia[b], bali linamtegemea Mungu anayeonyesha rehema.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa muundo wa karibu zaidi na Kigiriki, “Kwa hiyo si la yule anayetaka wala la yule anayekimbia, bali ni la Mungu anayeonyesha rehema.” Kigiriki hakitaji wazi jambo linalozungumziwa; linaeleweka kutokana na muktadha wa kusudi na rehema ya Mungu.
    reason: lexical_alternative
  - marker: b
    text: “Anayekimbia” huenda ni picha ya mtu anayefanya juhudi au kujitahidi, lakini kitenzi cha Kigiriki kwa maana halisi ni “kukimbia.”
    reason: cultural_note
lexical_decisions:
- source_word: ἄρα οὖν
  choice: Basi
  rationale: Huonyesha hitimisho linalotokana na hoja iliyotangulia kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: οὐ ... οὐδὲ
  choice: halitegemei ... wala
  rationale: Muundo huu wa Kiswahili huwasilisha kwa kawaida na kwa nguvu ukanushaji wa vipengele vyote viwili.
- source_word: τοῦ θέλοντος
  choice: yule anayetaka
  rationale: Huhifadhi maana ya tendo la kutaka bila kulifanya neno hilo liwe istilahi nzito ya kifalsafa kuhusu utashi.
- source_word: τοῦ τρέχοντος
  choice: yule anayekimbia
  rationale: Huhifadhi taswira halisi ya kitenzi τρέχω, huku tanbihi ikieleza maana yake ya kimfano kuhusu juhudi.
- source_word: ἀλλὰ
  choice: bali
  rationale: Huonyesha tofauti kali baada ya ukanushaji kwa mtindo wa kawaida wa Kiswahili.
- source_word: τοῦ ἐλεῶντος θεοῦ
  choice: Mungu anayeonyesha rehema
  rationale: Huhifadhi umbo la kitendo na kumtambulisha Mungu kwa tendo lake la kuonyesha rehema.
- source_word: implied predicate/expression
  choice: jambo hilo halitegemei ... bali linamtegemea
  rationale: Kigiriki kina usemi uliodondoshwa. 'Jambo hilo' hurejelea kwa tahadhari hoja ya muktadha bila kutaja moja kwa moja wokovu, uteuzi, au chaguo la Mungu.
theological_decisions:
- issue: Kiima kilichodokezwa na upeo wa utegemezi
  choice: Kutumia 'jambo hilo halitegemei' bila kulitaja jambo hilo kuwa wokovu, uteuzi, au chaguo la Mungu.
  alternative: Kwa hiyo wokovu hautegemei kutaka au kujitahidi kwa mwanadamu; au, Kwa hiyo chaguo la Mungu halitegemei mapenzi au juhudi za mwanadamu.
  rationale: Kigiriki hakitaji wazi kiima au prediketi inayotawala sentensi. Muktadha unahusu kusudi na rehema ya Mungu, lakini kutolitaja jambo mahususi huhifadhi utata halisi na mvutano wa kitheolojia wa kifungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Taswira ya 'kukimbia' imehifadhiwa, na usemi uliodondoshwa katika Kigiriki umefafanuliwa kwa kiwango cha chini kwa kutumia 'jambo hilo'.
