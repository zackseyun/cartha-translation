  text: ⸂ὦ ἄνθρωπε, μενοῦνγε⸃ σὺ τίς εἶ ὁ ἀνταποκρινόμενος τῷ θεῷ; μὴ ἐρεῖ τὸ πλάσμα τῷ πλάσαντι Τί με ἐποίησας οὕτως;
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/020.yaml
  text: But who are you[a], O man, to answer back to God? Will what is formed say to the one who formed it[d][c][b], “Why did you make me like this?”
translation:
  language: sw
  text: Lakini[a], ee mwanadamu, wewe ni nani hata umjibu Mungu kwa ubishi? Je, kitu kilichofinyangwa kitamwambia[c] aliyekifinyanga, “Kwa nini ulinifanya hivi?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kinyume chake.” Neno la Kigiriki linaweza kufanya nguvu ya kusahihisha ionekane wazi zaidi.
    reason: lexical_alternative
  - marker: b
    text: Kwa maana halisi, “Kwa nini ulinifanya namna hii?”
    reason: lexical_alternative
  - marker: c
    text: 'Muundo wa swali katika Kigiriki unatarajia jibu la kukataa: kitu kilichofinyangwa hakitamwambia hivyo aliyekifinyanga.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μενοῦνγε
  choice: Lakini
  rationale: Kiunganishi hiki kinaimarisha na kusahihisha kidogo pingamizi lililotangulia. “Lakini” ni ya kawaida na huhifadhi mkondo wa upinzani; “Kinyume chake” pia inawezekana lakini ni nzito zaidi.
- source_word: ὦ ἄνθρωπε
  choice: ee mwanadamu
  rationale: Ni mwito wa moja kwa moja kwa mtu mmoja anayewakilisha wanadamu. “Mwanadamu” ni ya asili katika Kiswahili na haiwekei jinsia maana ambayo neno la Kigiriki halilazimishi hapa.
- source_word: σὺ τίς εἶ
  choice: wewe ni nani
  rationale: Hili ni swali la changamoto, si ombi la kutambulishwa. Kutaja “wewe” wazi kunahifadhi msisitizo wa kiwakilishi cha Kigiriki.
- source_word: ὁ ἀνταποκρινόμενος τῷ θεῷ
  choice: hata umjibu Mungu kwa ubishi
  rationale: Kitenzi kinaonyesha kumjibu Mungu kwa kupinga, si kutoa jibu la kawaida. Kirai “kwa ubishi” kinahifadhi ukali huo kwa Kiswahili cha kawaida.
- source_word: μὴ ἐρεῖ
  choice: Je, ... kitamwambia
  rationale: μή pamoja na kitenzi cha wakati ujao huanzisha swali la balagha linalotarajia jibu la kukataa. Muundo wa “Je” ni wa asili, huku tanbihi ikieleza matarajio hayo.
- source_word: τὸ πλάσμα / τῷ πλάσαντι
  choice: kitu kilichofinyangwa / aliyekifinyanga
  rationale: Maneno yanayohusiana katika Kigiriki yamewasilishwa kwa mzizi mmoja wa Kiswahili, yakihifadhi tofauti kati ya kilichofinyangwa na mwenye kukifinyanga, na pia picha ya mfinyanzi katika muktadha.
- source_word: Τί με ἐποίησας οὕτως;
  choice: Kwa nini ulinifanya hivi?
  rationale: Hii ni tafsiri ya kawaida na ya karibu ya swali la Kigiriki. “Hivi” huhifadhi maana ya οὕτως bila kulazimisha maelezo zaidi.
theological_decisions:
- issue: Nguvu ya uwakilishi ya ἄνθρωπε
  choice: ee mwanadamu
  alternative: ee mtu
  rationale: Paulo anamwelekea mtu mmoja kama mwakilishi wa wanadamu mbele za Mungu. “Mwanadamu” huhifadhi ulinganisho wa Mungu na binadamu bila kuufanya mwito huo kuwa wa wanaume pekee.
- issue: Ukali wa karipio la Paulo
  choice: umjibu Mungu kwa ubishi
  alternative: umjibu Mungu
  rationale: Neno la Kigiriki linadokeza jibu la kupinga. Tafsiri hailegezwi kuwa jibu lisiloegemea upande wowote, hivyo mvutano wa Muumba na kilichofinyangwa unabaki.
- issue: Picha ya kilichofinyangwa na mwenye kukifinyanga
  choice: kilichofinyangwa ... aliyekifinyanga
  alternative: kilichoumbwa ... aliyekiumba
  rationale: “Kufinyanga” huhifadhi sitiari halisi inayounganisha mstari huu na mfano wa mfinyanzi na udongo unaofuata, bila kubadili dai la kiteolojia kuwa istilahi pana zaidi ya uumbaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na yenye ukali wa balagha wa kifungu. “Ee” limetumiwa kama mwito wa kifasihi unaoeleweka, na “kufinyanga” kunadumisha picha halisi ya mfinyanzi.
