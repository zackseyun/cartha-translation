base_translation:
  language: en
  yaml_path: translation/nt/romans/009/005.yaml
  text: theirs are the fathers[a], and from them, according to the flesh, is the Messiah, who is over all, God blessed forever[b]. Amen.
translation:
  language: sw
  text: Mababu ni wao, na kutoka kwao Masihi ametoka kwa jinsi ya mwili[a], yeye aliye juu ya wote, Mungu, abarikiwaye milele[b]. Amina.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa habari ya ukoo wake wa kibinadamu.” Kwa tafsiri halisi, “kwa jinsi ya mwili.”
    reason: lexical_alternative
  - marker: b
    text: 'Au, kishazi cha mwisho kikichukuliwa kuwa sifa tofauti kwa Mungu: “Mungu, aliye juu ya wote, na abarikiwe milele. Amina,” badala ya kuwa maelezo kuhusu Masihi.'
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ πατέρες
  choice: mababu
  rationale: Neno hili linarejelea mababu wa Israeli wanaoheshimiwa katika historia ya agano. “Mababu” ni la kawaida na pana kuliko “wahenga wakuu,” huku likidumisha uhusiano wa kihistoria.
- source_word: ἐξ ὧν
  choice: kutoka kwao
  rationale: Kiwakilishi kinawarejelea Waisraeli wenzake Paulo na kinaonyesha asili au ukoo.
- source_word: ὁ χριστός
  choice: Masihi
  rationale: Hapa Χριστός ni cheo kinachohusiana na ahadi za Israeli, si jina tu; kwa hiyo “Masihi” linafaa.
- source_word: τὸ κατὰ σάρκα
  choice: kwa upande wa mwili
  rationale: Usemi huu unaonyesha ukoo wa kibinadamu wa Masihi. Tafsiri inadumisha neno la Paulo bila kulihusisha kimakosa na hali ya dhambi.
- source_word: ὁ ὢν ἐπὶ πάντων
  choice: aliye juu ya wote
  rationale: Kirai participia chenye kibainishi kinaendelea kwa kawaida kumwelezea Masihi na kuonyesha ukuu wake juu ya wote.
- source_word: θεὸς εὐλογητὸς
  choice: Mungu mwenye kuhimidiwa
  rationale: “Mwenye kuhimidiwa” linaonyesha maana ya εὐλογητός katika usemi wa sifa na linafaa kwa sajili ya heshima. Mpangilio huu unaruhusu kishazi kusomwa kama maelezo zaidi kuhusu Masihi.
- source_word: εἰς τοὺς αἰῶνας
  choice: milele
  rationale: Hii ndiyo tafsiri ya kawaida na ya asili ya usemi huu wa kudumu bila mwisho.
- source_word: ἀμήν
  choice: Amina
  rationale: Umbo la kawaida la Kiswahili la tamko hili la uthibitisho limehifadhiwa.
theological_decisions:
- issue: Ikiwa kishazi “ὁ ὢν ἐπὶ πάντων, θεὸς εὐλογητὸς εἰς τοὺς αἰῶνας” kinamwelezea Masihi au kinaanza sifa tofauti kwa Mungu
  choice: 'Kishazi kimechukuliwa kuwa kinaendelea kumwelezea Masihi: “aliye juu ya wote, Mungu mwenye kuhimidiwa milele.”'
  alternative: 'Kukichukua kama sifa tofauti kwa Mungu: “Mungu, aliye juu ya wote, na ahimidiwe milele. Amina.”'
  rationale: Mtiririko wa kisarufi wa Kigiriki, hasa ὁ ὢν baada ya ὁ χριστός, unaelekea kukifanya kishazi hicho kuwa maelezo ya Masihi. Hata hivyo, hati za kale zaidi hazikuwa na uakifishaji wa kisasa, na usomaji wa sifa tofauti una historia ndefu; kwa hiyo umehifadhiwa katika tanbihi badala ya kuondolewa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaosomeka kwa urahisi. “Mababu” linadumisha lugha ya historia ya agano; “kwa upande wa mwili” linahifadhi taswira ya chanzo huku tanbihi ikifafanua maana ya ukoo wa kibinadamu. Alama zote za tanbihi zimewekwa mahali zinapohusika moja kwa moja.
