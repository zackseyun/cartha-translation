  text: οὐδ’ ὅτι εἰσὶν σπέρμα Ἀβραάμ, πάντες τέκνα, ἀλλ’· Ἐν Ἰσαὰκ κληθήσεταί σοι σπέρμα.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/007.yaml
  text: Nor is it the case that because they are Abraham’s offspring[a], they are all children. Rather[c][b], “In Isaac your offspring will be called.”
translation:
  language: sw
  text: Wala si kwamba, kwa kuwa wao ni uzao wa Abrahamu, wote ni watoto. Badala yake, “Katika Isaka uzao wako utaitwa.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Uzao wako utaitwa kupitia Isaka.” Neno “katika” hapa linaweza kueleweka kuwa ukoo unaotambuliwa utaendelea kupitia Isaka.
    reason: lexical_alternative
  - marker: b
    text: “Utaitwa” pia linaweza kueleweka kuwa “utatajwa” au, katika muktadha huu, “utahesabiwa” au “utatambuliwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδ’ ὅτι
  choice: Wala ... kwa sababu hiyo
  rationale: Muundo huu unaendeleza hoja kwa ukanushaji wa ziada na kuonyesha kwamba kuwa uzao wa Abrahamu hakutoshi kuwafanya wote kuwa watoto.
- source_word: σπέρμα Ἀβραάμ
  choice: uzao wa Abrahamu
  rationale: ‘Uzao’ ni neno la kawaida na lenye heshima linaloweza kutumiwa kwa maana ya pamoja ya watoto au vizazi, huku likidumisha uhusiano wa kileksika na nukuu inayofuata.
- source_word: πάντες τέκνα
  choice: si wote ... ni watoto
  rationale: τέκνα ni ‘watoto’ bila kubainisha jinsia; tafsiri haiongezi wazi ‘watoto wa Mungu’ au ‘watoto wa ahadi,’ kwa kuwa hayo yanaelezwa katika muktadha unaofuata.
- source_word: ἀλλ’
  choice: Badala yake
  rationale: Inaonyesha kwa kawaida ugeuzi mkali na usahihishaji katika hoja ya Paulo.
- source_word: Ἐν Ἰσαὰκ
  choice: katika Isaka
  rationale: Hifadhi usemi wa nukuu kwa ukaribu bila kuamua kimya kimya kama ἐν inapaswa kufafanuliwa kuwa ‘kupitia Isaka.’
- source_word: κληθήσεταί
  choice: utaitwa
  rationale: Hifadhi maana ya msingi ya kaλέω na pia utata wa kuitwa, kutajwa, au kuhesabiwa/kuteuliwa katika muktadha wa ukoo.
- source_word: σοι σπέρμα
  choice: uzao wako
  rationale: Dativu σοι imetolewa kwa umilikaji wa kawaida wa Kiswahili, na ‘uzao’ inadumisha maana ya pamoja ya σπέρμα.
theological_decisions:
- issue: Uhusiano wa nasaba ya kimwili na kuwa watoto
  choice: Mstari unatofautisha kuwa uzao wa Abrahamu na kuwa watoto, bila kuongeza hapa aina ya watoto wanaokusudiwa.
  alternative: Kutafsiri moja kwa moja ‘watoto wa Mungu,’ ‘watoto wa agano,’ au ‘watoto wa ahadi.’
  rationale: Maelezo hayo yanaweza kufahamika kutokana na muktadha, lakini hayajasemwa wazi katika mstari huu; kuyaongeza kungeondoa mvutano wa hoja kabla Paulo hajaufafanua.
- issue: Nguvu ya nukuu ya Mwanzo 21:12
  choice: “Uzao wako utaitwa katika Isaka.”
  alternative: “Uzao wako utatokana na Isaka” au “utahesabiwa kupitia Isaka.”
  rationale: Tafsiri ya karibu huhifadhi lugha ya kuitwa na muundo wa ἐν, badala ya kuingiza mapema ufafanuzi wa ukoo au wa kuhesabiwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Uzao’ limetumiwa mara zote mbili ili kudumisha mwangwi wa σπέρμα. Mpangilio umefanywa wa kawaida kwa Kiswahili huku ukanushaji na tofauti ya hoja vikihifadhiwa.
