base_translation:
  language: en
  yaml_path: translation/nt/romans/009/026.yaml
  text: And in the very place where it was said to them[b][a], ‘You are not my people,’ there they will be called sons of the living God.
translation:
  language: sw
  text: Na itakuwa kwamba katika mahali pale pale walipoambiwa[b], “Ninyi si watu wangu,” huko wataitwa wana wa Mungu aliye hai.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watoto wa Mungu aliye hai.” Kigiriki kinasema “wana”; neno hilo linaweza kutumiwa kwa kundi zima la watoto wa Mungu.
    reason: lexical_alternative
  - marker: b
    text: Nukuu au dokezo kutoka Hosea 1:10 (2:1 katika Septuajinti), kwa kutumia lugha ya kurejeshwa kwa agano.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ
  choice: Na
  rationale: Kiunganishi rahisi kinachoendeleza mtiririko kutoka kauli iliyotangulia bila kuongeza maana ya hitimisho.
- source_word: ἔσται
  choice: itakuwa kwamba
  rationale: Wakati ujao umehifadhiwa, na muundo huu wa Kiswahili unatambulisha kwa kawaida jambo litakalotokea.
- source_word: ἐν τῷ τόπῳ οὗ
  choice: mahali pale pale
  rationale: Huhifadhi dhana ya mahali na kusisitiza kwamba mabadiliko yatatokea katika mahali palepale ambapo hukumu ya kwanza ilitamkwa.
- source_word: ἐρρέθη αὐτοῖς
  choice: walipoambiwa
  rationale: Muundo wa kutendwa umehifadhiwa kwa Kiswahili cha kawaida bila kutaja msemaji ambaye Kigiriki hakumtaji wazi.
- source_word: Οὐ λαός μου ὑμεῖς
  choice: Ninyi si watu wangu
  rationale: Huhifadhi usemi wa agano “watu wangu” na mpangilio wa asili wa Kiswahili.
- source_word: ἐκεῖ
  choice: huko
  rationale: Inaonyesha kwa mkazo mahali palepale pa mabadiliko, ikilingana na “mahali pale pale.”
- source_word: κληθήσονται
  choice: wataitwa
  rationale: Huhifadhi wakati ujao na hali ya kutendwa, bila kuongeza wazi kwamba Mungu ndiye mwitaji.
- source_word: υἱοὶ
  choice: wana
  rationale: “Wana” huhifadhi lugha ya uana na mwangwi wa hadhi ya kifamilia au urithi, huku ikiwa ya asili na yenye heshima katika Kiswahili cha Biblia.
- source_word: θεοῦ ζῶντος
  choice: wa Mungu aliye hai
  rationale: Ni tafsiri ya kawaida na sahihi ya kishazi cha Kigiriki, ikihifadhi tofauti ya kibiblia kati ya Mungu aliye hai na miungu isiyo hai.
theological_decisions:
- issue: Maana ya υἱοὶ kama wingi unaowakilisha kundi zima
  choice: wana
  alternative: watoto
  rationale: Kigiriki kimetumia υἱοὶ, si neno la jumla τέκνα. “Wana” huhifadhi kwa kiasi kikubwa uana na mwangwi unaowezekana wa urithi; tanbihi inaonyesha kwamba maana inaweza kuwajumuisha watoto wa Mungu kwa ujumla.
- issue: Utambulisho wa agano katika λαός μου
  choice: watu wangu
  alternative: watu wangu mwenyewe
  rationale: “Watu wangu” ni usemi wa msingi wa agano unaotokana na Hosea; haupaswi kufafanuliwa zaidi kwa namna inayoongeza msisitizo usio wazi katika chanzo.
- issue: Mtendaji asiyeelezwa katika κληθήσονται
  choice: wataitwa
  alternative: Mungu atawaita
  rationale: Hali ya kutendwa katika Kigiriki imeachwa bila mtendaji aliyetajwa. Tafsiri inadumisha uwezekano wa kutendwa kwa kimungu bila kuufanya uwe wazi kuliko chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Urudiaji wa “mahali pale pale ... huko” umehifadhiwa ili kuonyesha ulinganifu na mgeuko wenye mkazo katika chanzo.
