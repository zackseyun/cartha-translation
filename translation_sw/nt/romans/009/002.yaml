  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi, na inayoeleweka kwa wasomaji wa kawaida. Muundo unaendelea moja kwa moja kutoka Waroma 9:1, ndiyo sababu unaanza kwa “kwamba.”
