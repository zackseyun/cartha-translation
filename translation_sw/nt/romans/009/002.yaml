  text: that I have great sorrow and unceasing pain in my heart[a][b][c].
translation:
  language: sw
  text: kwamba nina huzuni kubwa na uchungu usiokoma moyoni mwangu.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “masikitiko makubwa” badala ya “huzuni kubwa.”
    reason: lexical_alternative
  - marker: b
    text: Au “maumivu” badala ya “uchungu.”
    reason: lexical_alternative
  - marker: c
    text: Kigiriki kinasema kihalisi “kwa moyo wangu,” nahau ambayo imetafsiriwa kiasili “moyoni mwangu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: kwamba
  rationale: Katika muktadha huu linaanzisha maudhui ya uthibitisho mzito wa Paulo katika mstari uliotangulia; “kwamba” linafaa kuliko maana ya kisababishi “kwa sababu.”
- source_word: λύπη
  choice: huzuni
  rationale: Neno hili linaeleza masikitiko mazito; “huzuni” ni la kawaida, lenye hadhi, na linaacha “uchungu” kubeba uzito wa nomino ya pili.
- source_word: μοί ἐστιν
  choice: nina
  rationale: Muundo wa Kigiriki wenye kiwakilishi cha yambwa pamoja na εἰμί unaeleza hali anayopitia au kuwa nayo mtu; Kiswahili cha asili hutumia “nina.”
- source_word: μεγάλη
  choice: kubwa
  rationale: Kivumishi hiki kinatia nguvu kiwango cha huzuni kwa njia ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: καὶ
  choice: na
  rationale: Kiunganishi rahisi kinachounganisha maelezo mawili ya huzuni ya ndani.
- source_word: ἀδιάλειπτος
  choice: usiokoma
  rationale: Linaonyesha hali inayoendelea bila kuacha; “usiokoma” huhifadhi nguvu ya usemi huku likiwa la asili katika Kiswahili.
- source_word: ὀδύνη
  choice: uchungu
  rationale: Linaeleza maumivu makali ya ndani. “Uchungu” unafaa kwa hisia nzito za moyoni; “maumivu” ni mbadala wa moja kwa moja zaidi.
- source_word: τῇ καρδίᾳ μου
  choice: moyoni mwangu
  rationale: Huhifadhi sitiari ya kibiblia ya moyo kama kitovu cha maisha ya ndani, kwa muundo wa Kiswahili unaotafsiri kiasili dative ya Kigiriki.
theological_decisions: []
