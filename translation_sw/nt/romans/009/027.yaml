base_translation:
  language: en
  yaml_path: translation/nt/romans/009/027.yaml
  text: But Isaiah cries out concerning Israel[a], “Though the number of the sons of Israel is like the sand of the sea[c][b], only the remnant will be saved.”
translation:
  language: sw
  text: Lakini Isaya anapaza sauti kuhusu Israeli, “Ingawa idadi ya wana wa Israeli[a] ni kama mchanga wa bahari, mabaki tu ndiyo yatakayookolewa.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watoto wa Israeli” au “Waisraeli.” Kigiriki kinasema “wana wa Israeli,” jina la kimapokeo la watu wa agano.
    reason: lexical_alternative
  - marker: b
    text: Au “wataokombolewa.” Maneno haya yanarudia mwangwi wa unabii wa Isaya kuhusu mabaki yatakayosalia. Sehemu ya kwanza pia inaweza kutafsiriwa kwa ukaribu zaidi, “Ikiwa idadi ya wana wa Israeli ni kama mchanga wa bahari.”
    reason: alternative_reading_and_cross_reference
lexical_decisions:
- source_word: δὲ
  choice: Lakini
  rationale: Inaonyesha geuko lenye utofautishaji wa kiasi katika hoja ya Paulo, huku ikiendeleza mtiririko wa maneno.
- source_word: κράζει
  choice: anapaza sauti
  rationale: Inahifadhi nguvu na wakati wa sasa wa kitenzi κράζω kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: ὑπὲρ τοῦ Ἰσραήλ
  choice: kuhusu Israeli
  rationale: Katika muktadha wa kunukuu unabii, ὑπέρ hapa ina maana ya ‘kuhusu’ badala ya ‘kwa niaba ya.’
- source_word: Ἐὰν ᾖ
  choice: Ingawa ... ni
  rationale: Muundo wa masharti una nguvu ya kukubali jambo kabla ya kulinganisha; ‘ingawa’ huonyesha kwa kawaida utofauti kati ya wingi wa Israeli na mabaki yatakayookolewa.
- source_word: ὁ ἀριθμὸς
  choice: idadi
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja ya ἀριθμός.
- source_word: τῶν υἱῶν Ἰσραήλ
  choice: wana wa Israeli
  rationale: Inadumisha usemi rasmi wa agano katika nukuu ya Maandiko bila kuufanya kuwa ‘Waisraeli’ tu.
- source_word: ὡς ἡ ἄμμος τῆς θαλάσσης
  choice: kama mchanga wa bahari
  rationale: Inahifadhi tashbihi ya Maandiko kwa Kiswahili cha asili na kinachotambulika.
- source_word: τὸ ὑπόλειμμα
  choice: mabaki tu
  rationale: ‘Mabaki’ hudumisha dhana ya kinabii ya sehemu iliyosalia; ‘tu’ huweka wazi utofauti unaodokezwa na sentensi bila kubadili rejeleo la umoja wa pamoja.
- source_word: σωθήσεται
  choice: watakaookolewa
  rationale: Inahifadhi uzito wa wokovu katika muktadha wa Waroma, huku kitenzi cha Kiswahili kikikubaliana kiasili na ‘mabaki’ kama kundi la watu.
theological_decisions:
- issue: Maana ya muundo wa masharti Ἐὰν ᾖ katika nukuu ya kinabii
  choice: Maana ya kukubali jambo, ‘Ingawa idadi ... ni ...’
  alternative: Tafsiri ya moja kwa moja ya sharti, ‘Ikiwa idadi ... ni ...’ au yenye msisitizo, ‘Hata ikiwa idadi ... ni ...’
  rationale: Hoja inatofautisha wingi mkubwa wa wana wa Israeli na mabaki yatakayookolewa. ‘Ingawa’ huwasilisha nguvu hiyo kwa Kiswahili bila kutatua zaidi mvutano wa kiteolojia.
- issue: Maana ya σωθήσεται
  choice: watakaookolewa
  alternative: wataokombolewa au watahifadhiwa
  rationale: Katika muktadha wa Paulo, ‘kuokolewa’ ndiyo tafsiri ya kawaida inayodumisha uzito wa wokovu, huku maana ya ukombozi katika unabii wa Isaya ikibaki kuwa uwezekano wa msingi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. ‘Anapaza sauti’ hudumisha nguvu ya usemi wa kinabii; ‘wana wa Israeli’ hudumisha istilahi rasmi ya agano; na maelezo ya chini yanahifadhi tafsiri mbadala halisi bila kuingiza msimamo wa kimadhehebu.
