lexical_decisions:
- source_word: οἵτινές εἰσιν Ἰσραηλῖται
  choice: ambao ni Waisraeli
  rationale: Kauli hii inaendeleza maelezo kuhusu jamaa za Paulo waliotajwa katika mstari uliotangulia. “Waisraeli” huhifadhi jina la kihistoria na la kiagano.
- source_word: ὧν
  choice: walio na
  rationale: Kiwakilishi cha umilikaji kinaonyesha kwamba mapendeleo yanayoorodheshwa ni yao; “walio na” ni ya asili katika Kiswahili na haiongezi wazo lisilokuwamo.
- source_word: υἱοθεσία
  choice: kufanywa wana
  rationale: Huhifadhi picha ya kupewa hadhi ya wana kuliko neno la kawaida “kuasiliwa,” ambalo linaweza kusikika hasa kama utaratibu wa kisheria wa kisasa. Katika muktadha huu ni hadhi ya Israeli kwa ujumla.
- source_word: δόξα
  choice: utukufu
  rationale: Tafsiri ya moja kwa moja inayohifadhi uzito na uwezekano wa kurejelea udhihirisho wa uwepo wa Mungu bila kuufafanua ndani ya matini.
- source_word: διαθῆκαι
  choice: maagano
  rationale: Huhifadhi wingi wa neno la Kigiriki na istilahi ya kawaida ya kibiblia.
- source_word: νομοθεσία
  choice: kutolewa kwa Sheria
  rationale: Nomino hiyo inahusu tendo la kutoa au kuweka Sheria, si Sheria peke yake. Herufi kubwa hutambulisha Sheria ya Musa katika muktadha huu.
- source_word: λατρεία
  choice: ibada
  rationale: Neno hili linaweza kumaanisha ibada au utumishi wa kidini kwa Mungu. “Ibada” ni ya asili na pana vya kutosha bila kuibana kuwa huduma ya Hekalu pekee.
- source_word: ἐπαγγελίαι
  choice: ahadi
  rationale: Huhifadhi wingi wa Kigiriki kwa maana ya ahadi mbalimbali za Mungu kwa Israeli; katika Kiswahili umbo “ahadi” halibadiliki katika wingi.
theological_decisions:
- issue: Maana ya υἱοθεσία kwa Israeli
  choice: kufanywa wana
  alternative: kuasiliwa; hali ya kuwa wana
  rationale: Orodha inahusu mapendeleo ya kihistoria na ya kiagano ya Israeli kama taifa. Tafsiri hii huhifadhi sitiari ya kuwa wana bila kuihamishia kimya-kimya kwenye mafundisho ya wokovu wa mtu mmoja mmoja.
- issue: Kirejelewa cha ἡ δόξα
  choice: utukufu
  alternative: utukufu wa Mungu; uwepo wenye utukufu
  rationale: Inaelekea kurejelea uwepo wa Mungu uliojidhihirisha miongoni mwa Israeli, lakini Kigiriki kinasema tu “utukufu”; hivyo matini kuu inabaki wazi.
- issue: Upeo wa λατρεία
  choice: ibada
  alternative: utumishi wa ibada; huduma ya Hekalu
  rationale: Muktadha unaelekeza kwenye ibada ya Israeli iliyowekwa kwa agano, lakini neno lenyewe halilazimishi kuibana kwa huduma ya kikuhani au ya Hekalu pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wenye heshima na unaosomeka kwa urahisi. Orodha na wingi wa Kigiriki zimehifadhiwa; istilahi zimeepuka ufafanuzi wa kimadhehebu.
