  text: λέγει γὰρ ἡ γραφὴ τῷ Φαραὼ ὅτι Εἰς αὐτὸ τοῦτο ἐξήγειρά σε ὅπως ἐνδείξωμαι ἐν σοὶ τὴν δύναμίν μου, καὶ ὅπως διαγγελῇ τὸ ὄνομά μου ἐν πάσῃ τῇ γῇ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/017.yaml
  text: 'For the Scripture says to Pharaoh[a], “For this very purpose I raised you up: that I might display my power in you[b], and that my name might be proclaimed in all the earth.”'
translation:
  language: sw
  text: Kwa maana Maandiko yanamwambia Farao, “Kwa kusudi hili hasa nilikuinua[a], ili nionyeshe nguvu yangu ndani yako, na ili jina langu[b] litangazwe katika dunia yote.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nilikuhifadhi” au “nilikusimamisha.” Kitenzi cha Kigiriki kinaweza kuwa na maana pana katika muktadha wa nukuu ya Kutoka.
    reason: lexical_alternative
  - marker: b
    text: “Jina langu” hapa linamaanisha pia sifa na utukufu wa Mungu jinsi anavyojifunua, si jina linalotamkwa tu.
    reason: cultural_note
lexical_decisions:
- source_word: λέγει γὰρ ἡ γραφὴ τῷ Φαραώ
  choice: Kwa maana Maandiko yanamwambia Farao
  rationale: ‘Kwa maana’ inadumisha uhusiano wa maelezo wa γάρ. Wakati wa sasa katika ‘yanamwambia’ unahifadhi namna Paulo anavyoyafanya Maandiko yaseme sasa; ‘Maandiko’ ni matumizi ya kawaida na yenye heshima katika Kiswahili.
- source_word: Εἰς αὐτὸ τοῦτο
  choice: Kwa kusudi hili hasa
  rationale: Inadumisha msisitizo wa αὐτὸ na maana ya kusudi kwa Kiswahili cha kawaida.
- source_word: ἐξήγειρά σε
  choice: nilikuinua
  rationale: ‘Nilikuinua’ ni pana vya kutosha kuweza kumaanisha kumleta mbele au kumsimamisha kwa nafasi hii, bila kuamua kimya kimya kwamba ni kumuumba au kumhifadhi tu.
- source_word: ὅπως ἐνδείξωμαι ἐν σοὶ τὴν δύναμίν μου
  choice: ili nionyeshe nguvu zangu ndani yako
  rationale: ‘Ili’ inaonyesha kusudi; ‘nionyeshe’ huwasilisha udhihirisho wa wazi, na ‘ndani yako’ hudumisha ἐν σοὶ badala ya kuibadili kwa tafsiri ya ‘kupitia kwako’.
- source_word: καὶ ὅπως διαγγελῇ τὸ ὄνομά μου
  choice: na ili jina langu litangazwe
  rationale: Kauli tendwa ‘litangazwe’ inadumisha wazo la kutangazwa hadharani bila kutaja mtendaji.
- source_word: ἐν πάσῃ τῇ γῇ
  choice: katika dunia yote
  rationale: ‘Dunia yote’ huonyesha upeo mpana wa γῆ hapa, badala ya maana finyu ya nchi fulani.
theological_decisions:
- issue: Maana ya ἐξήγειρά σε kuhusu Farao na ukuu wa Mungu
  choice: nilikuinua
  alternative: nilikuhifadhi / nilikusimamisha
  rationale: Tafsiri hii inahifadhi dai la Mungu la kumleta au kumsimamisha Farao kwa kusudi hilo, lakini hailazimishi hitimisho finyu kuhusu namna hasa alivyofanya hivyo; mvutano kati ya ukuu wa Mungu na wajibu wa mwanadamu unabaki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imehifadhi muundo wa kusudi mara mbili wa Kigiriki. Alama zote za tanbihi zimo katika matini kuu.
