  text: οὓς καὶ ἐκάλεσεν ἡμᾶς οὐ μόνον ἐξ Ἰουδαίων ἀλλὰ καὶ ἐξ ἐθνῶν;—
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/024.yaml
  text: even us[a], whom he also called[b], not only from the Jews but also from the Gentiles—
translation:
  language: sw
  text: ambao pia aliwaita—yaani sisi[a]—si kutoka miongoni mwa Wayahudi tu, bali pia kutoka miongoni mwa watu wa mataifa[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa kufuata mpangilio wa Kigiriki kwa karibu zaidi: “ambao pia aliwaita, sisi.” Paulo anawatambulisha waliotajwa kuwa vyombo vya rehema kuwa “sisi.”'
    reason: lexical_alternative
  - marker: b
    text: 'Kigiriki: “mataifa”; katika muktadha huu, neno hilo linamaanisha watu wasio Wayahudi, kwa kuwa Paulo anawatofautisha na Wayahudi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὓς ... ἡμᾶς
  choice: ambao ... yaani sisi
  rationale: Kiwakilishi cha uhusiano οὓς kinarejelea waliotajwa katika mstari uliotangulia, huku ἡμᾶς ikiwatambulisha wazi kuwa ni “sisi.” Mpangilio huu unadumisha uhusiano huo na mkazo wa Kigiriki bila kufanya Kiswahili kisicho cha kawaida.
- source_word: καὶ ἐκάλεσεν
  choice: pia aliwaita
  rationale: “Pia” inadumisha nguvu ya kuongezea ya καί, na “aliwaita” ni tafsiri ya kawaida na yenye uzito wa kimuktadha ya καλέω katika maandishi ya Paulo.
- source_word: οὐ μόνον ... ἀλλὰ καὶ
  choice: si ... tu, bali pia
  rationale: Huu ni ulinganifu wa asili wa Kiswahili unaohifadhi muundo wa kusisitiza makundi yote mawili.
- source_word: ἐξ Ἰουδαίων
  choice: kutoka miongoni mwa Wayahudi
  rationale: ἐξ hapa huonyesha chanzo au kundi ambalo walioitwa wametoka; “kutoka miongoni mwa” huwasilisha maana hiyo kwa uwazi.
- source_word: ἐξ ἐθνῶν
  choice: kutoka miongoni mwa watu wa mataifa
  rationale: Katika utofautishaji huu na Wayahudi, ἔθνη ni watu wasio Wayahudi. “Watu wa mataifa” ni usemi unaoeleweka katika Kiswahili na bado unabakiza picha ya msingi ya “mataifa.”
theological_decisions:
- issue: Uhusiano wa walioitwa na vyombo vya rehema vya mstari uliotangulia
  choice: ambao pia aliwaita—yaani sisi
  alternative: sisi ambao pia alituita
  rationale: Chaguo hili linahifadhi utegemezi wa kisarufi kwa mstari uliotangulia na utambulisho wa Paulo wa kundi hilo kuwa “sisi,” bila kuongeza hitimisho la kimafundisho lisilotamkwa.
- issue: Maana ya ἐθνῶν katika utofautishaji wa Wayahudi na wasio Wayahudi
  choice: watu wa mataifa
  alternative: Mataifa; watu wasio Wayahudi
  rationale: Muktadha unaonyesha jamii zisizo za Kiyahudi. Tafsiri hii huhifadhi utofautishaji wa kihistoria na wa watu bila kuufanya kuwa mfumo maalumu wa kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Alama za vistari zinaonyesha kuwa sentensi inaendelea kutoka mstari uliotangulia na kuelekea unaofuata.
