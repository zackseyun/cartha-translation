base_translation:
  language: en
  yaml_path: translation/nt/romans/009/019.yaml
  text: You will say to me then[a], “Why then does he still find fault? For who has resisted his purpose?”
translation:
  language: sw
  text: Basi utaniambia, “Kwa nini basi bado analaumu? Kwa maana ni nani aliyepinga kusudi lake[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mapenzi yake” au “nia yake.” Neno la Kigiriki βούλημα linaweza kumaanisha mapenzi, nia, au kusudi.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐρεῖς
  choice: utaniambia
  rationale: Wakati ujao wa kiashiria umetafsiriwa kama kauli ya kutarajia pingamizi la msomaji; kitenzi ‘-ambia’ pia kinabeba kwa kawaida maana ya kusema kwa mtu.
- source_word: μοι
  choice: -ni- katika ‘utaniambia’
  rationale: Yambwa isiyo ya moja kwa moja imewakilishwa kiasili ndani ya muundo wa kitenzi cha Kiswahili.
- source_word: οὖν ... οὖν
  choice: Basi ... basi
  rationale: 'Chembe zote mbili za uhusiano wa kimantiki zimehifadhiwa: ya kwanza inaanzisha hatua inayofuata ya hoja, na ya pili inasisitiza swali linalotokana nayo.'
- source_word: Τί οὖν ἔτι
  choice: Kwa nini basi bado
  rationale: Katika muktadha huu τί ina nguvu ya kuuliza sababu, huku ἔτι ikihifadhiwa kwa ‘bado’.
- source_word: μέμφεται
  choice: analaumu
  rationale: ‘Kulaumu’ ni tafsiri ya moja kwa moja na ya kawaida ya tendo la kumhesabia mtu kosa.
- source_word: τῷ ... βουλήματι αὐτοῦ
  choice: kusudi lake
  rationale: ‘Kusudi’ linaonyesha nia iliyokusudiwa bila kulazimisha maana mahsusi ya kimadhehebu; uwezekano wa ‘mapenzi yake’ umewekwa katika tanbihi.
- source_word: τίς
  choice: ni nani
  rationale: Muundo huu wa kawaida wa Kiswahili unaanzisha swali la balagha kuhusu mtu anayeweza kupinga.
- source_word: ἀνθέστηκεν
  choice: aliyepinga
  rationale: ‘Kupinga’ huwasilisha maana ya kusimama dhidi ya jambo; umbo la -liye- linaeleza tendo lililotokea na lenye umuhimu kwa hoja ya sasa.
theological_decisions:
- issue: Maana ya βούλημα katika muktadha wa enzi kuu ya Mungu na wajibu wa mwanadamu
  choice: kusudi lake
  alternative: mapenzi yake; nia yake
  rationale: ‘Kusudi’ linaakisi nia iliyokusudiwa ya Mungu huku likiacha wazi mvutano wa kifungu kati ya kusudi la Mungu na lawama kwa mwanadamu. Tanbihi inahifadhi upana wa neno la Kigiriki bila kutatua mjadala wa kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa pingamizi la balagha umehifadhiwa, na sentensi imewekwa kwa mtiririko wa kawaida unaoeleweka kwa wasomaji wa kawaida.
