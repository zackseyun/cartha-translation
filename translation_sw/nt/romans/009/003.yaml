  yaml_path: translation/nt/romans/009/003.yaml
  text: For I could wish that I myself were accursed and cut off from the Messiah for the sake of my brothers[a], my kinsmen according to the flesh[c][b],
translation:
  language: sw
  text: Kwa maana mimi mwenyewe ningeweza kutamani niwe chini ya laana na kutengwa na Masihi[a] kwa ajili ya ndugu zangu[b], jamaa zangu kwa jinsi ya mwili[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “niwe laana mbali na Masihi,” au “niwe chini ya laana, nimetengwa na Masihi.” Usemi wa Kigiriki unaunganisha wazo la kuwa chini ya laana na kutengwa na Masihi.
    reason: lexical_alternative
  - marker: b
    text: 'Kigiriki: “ndugu zangu.” Katika muktadha Paulo anamaanisha Waisraeli wenzake, watu wa taifa lake.'
    reason: cultural_note
  - marker: c
    text: 'Kigiriki: “kwa jinsi ya mwili.” Hapa maana yake ni kwa nasaba ya kuzaliwa au ya kikabila, si “asili ya dhambi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ηὐχόμην
  choice: ningetamani
  rationale: Kauli ya masharti katika Kiswahili inaonyesha tamanio la kudhaniwa au lisilowezekana bila kulifanya kuwa taarifa rahisi ya tendo la wakati uliopita; pia inadumisha uzito wa hisia za Paulo.
- source_word: γὰρ
  choice: kwa maana
  rationale: Inaendeleza uhusiano wa maelezo na hoja iliyotangulia kwa njia ya kawaida katika Kiswahili.
- source_word: ἀνάθεμα
  choice: nilaaniwe
  rationale: Inaonyesha kuwa chini ya laana au kutengwa kwa hukumu, kwa lugha iliyo wazi na yenye uzito bila kutumia istilahi isiyoeleweka kwa urahisi.
- source_word: αὐτὸς ἐγὼ
  choice: mimi mwenyewe
  rationale: Inahifadhi msisitizo maradufu wa Kigiriki juu ya Paulo binafsi.
- source_word: ἀπὸ τοῦ Χριστοῦ
  choice: kutengwa na Masihi
  rationale: ἀπό hapa inaonyesha utengano; ‘kutengwa na’ huwasilisha maana hiyo wazi. Χριστός imetafsiriwa kama cheo, ‘Masihi.’
- source_word: ὑπὲρ
  choice: kwa ajili ya
  rationale: Inaonyesha kwamba tamanio hilo lingekuwa kwa manufaa ya wale anaowataja.
- source_word: τῶν ἀδελφῶν μου
  choice: ndugu zangu
  rationale: ‘Ndugu’ ni neno la kawaida la Kiswahili linaloweza kumaanisha ndugu wa jumuiya au watu wa taifa moja; muktadha unaonyesha Waisraeli wenzake Paulo.
- source_word: τῶν συγγενῶν μου
  choice: jamaa zangu
  rationale: Inaonyesha watu wenye uhusiano wa ukoo na Paulo, hapa kwa maana pana ya watu wa asili yake.
- source_word: κατὰ σάρκα
  choice: kwa ukoo wa kimwili
  rationale: Ni lugha ya kawaida inayoeleza nasaba ya kuzaliwa au ya kikabila, huku ikihifadhi wazo la σάρξ bila kupotosha kuwa ‘asili ya dhambi.’
theological_decisions:
- issue: Ikiwa kauli ya Paulo ni ombi halisi au tamanio la kudhaniwa
  choice: ningetamani
  alternative: niliomba / nilikuwa nikitamani
  rationale: Kauli hii inaonyesha tamanio kali lakini haidai kwa hakika kwamba Paulo aliomba atengwe na Masihi.
- issue: Maana ya Χριστός
  choice: Masihi
  alternative: Kristo
  rationale: Katika muktadha huu neno linaeleweka vizuri kama cheo cha mtiwa-mafuta aliyeahidiwa, si lazima kama jina tu.
- issue: Maana ya σάρξ katika κατὰ σάρκα
  choice: ukoo wa kimwili, yaani nasaba ya kuzaliwa au ya kikabila
  alternative: asili ya dhambi
  rationale: Paulo anaeleza uhusiano wake wa kikabila na Waisraeli, wala si hali yao ya kimaadili.
- issue: Uhusiano wa ἀνάθεμα na ἀπὸ τοῦ Χριστοῦ
  choice: nilaaniwe na kutengwa na Masihi
  alternative: nilaaniwe mbali na Masihi
  rationale: Tafsiri kuu huweka wazi dhana zinazohusiana za laana na utengano, bila kudai kwamba Kigiriki kina viunganishi viwili tofauti; tanbihi huhifadhi uwezekano wa muundo wa karibu zaidi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Ningetamani’ ni ya kawaida kuliko ‘ningeweza kutamani’ na bado hubeba hali ya kudhaniwa. ‘Kwa ukoo wa kimwili’ huwasilisha maana ya kikabila kwa uwazi; tanbihi inadumisha usemi halisi wa Paulo, ‘kwa jinsi ya mwili.’
