  text: ἢ οὐκ ἔχει ἐξουσίαν ὁ κεραμεὺς τοῦ πηλοῦ ἐκ τοῦ αὐτοῦ φυράματος ποιῆσαι ὃ μὲν εἰς τιμὴν σκεῦος ὃ δὲ εἰς ἀτιμίαν;
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/021.yaml
  text: Or does the potter not have authority over the clay[d][c][b][a], to make from the same lump one vessel for honor and another for dishonor?
translation:
  language: sw
  text: Au je, mfinyanzi hana mamlaka juu ya udongo[a], kutengeneza kutoka katika donge lilelile[b] chombo kimoja kwa heshima, na kingine kwa fedheha[c]?[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hana haki juu ya udongo.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kutoka katika fungu lilelile” au “kutoka katika mchanganyiko uleule.”
    reason: lexical_alternative
  - marker: c
    text: Au, “chombo kimoja kwa matumizi ya heshima, na kingine kwa matumizi ya kawaida.”
    reason: alternative_reading
  - marker: d
    text: Taswira hii inakumbusha vifungu vya Agano la Kale kuhusu mfinyanzi na udongo, kama vile Isaya 29:16; 45:9; Yeremia 18:1–6.
    reason: cross_reference
lexical_decisions:
- source_word: ἢ
  choice: Au je
  rationale: Inaendeleza hoja kwa swali la balagha; muundo huu ni wa kawaida na wazi katika Kiswahili.
- source_word: οὐκ ἔχει ἐξουσίαν
  choice: hana mamlaka
  rationale: Mamlaka huonyesha haki ya kuamua na kutenda, si uwezo wa kimwili tu.
- source_word: ὁ κεραμεὺς
  choice: mfinyanzi
  rationale: Ni neno la kawaida na sahihi kwa fundi anayefinyanga vyombo vya udongo.
- source_word: τοῦ πηλοῦ
  choice: juu ya udongo
  rationale: Hukamilisha kwa kawaida maana ya mamlaka inayotumiwa kuhusu udongo.
- source_word: ἐκ τοῦ αὐτοῦ φυράματος
  choice: kutoka katika donge lilelile
  rationale: Donge linaonyesha udongo uliochanganywa kuwa fungu moja na kuhifadhi wazo la chanzo kilekile.
- source_word: ποιῆσαι
  choice: kutengeneza
  rationale: Ni kitenzi cha kawaida kinachoeleza kutengeneza vyombo bila kuongeza maana isiyotajwa.
- source_word: ὃ μὲν ... ὃ δὲ
  choice: chombo kimoja ... na kingine
  rationale: Huonyesha tofauti kati ya vitu viwili kwa Kiswahili cha asili.
- source_word: εἰς τιμὴν
  choice: kwa heshima
  rationale: Huhifadhi moja kwa moja lugha ya heshima bila kuibana kuwa matumizi fulani tu.
- source_word: σκεῦος
  choice: chombo
  rationale: Ni neno sahihi na la kawaida katika taswira ya mfinyanzi.
- source_word: εἰς ἀτιμίαν
  choice: kwa aibu
  rationale: Huhifadhi upinzani wa moja kwa moja kati ya τιμή na ἀτιμία bila kuufasiri mapema kuwa matumizi ya kawaida.
theological_decisions:
- issue: Iwapo ἐξουσία itafsiriwe kama mamlaka, haki, au uwezo katika mjadala kuhusu enzi ya Mungu na wajibu wa mwanadamu
  choice: mamlaka
  alternative: haki; uwezo
  rationale: Mamlaka huhifadhi dhana ya uamuzi halali bila kuifanya aya itoe kauli pana zaidi kuhusu uamuzi wa kimungu au uhuru wa mwanadamu.
- issue: Iwapo εἰς τιμὴν / εἰς ἀτιμίαν zifafanuliwe kama matumizi ya heshima na matumizi ya kawaida
  choice: kwa heshima ... kwa aibu
  alternative: kwa matumizi ya heshima ... kwa matumizi ya kawaida
  rationale: Maandishi ya Kigiriki yanatumia moja kwa moja jozi ya heshima na aibu; tafsiri hii huacha upeo wa sitiari wazi na haiingizi kazi maalumu za vyombo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo wa swali la balagha umehifadhiwa; lugha ya heshima na aibu imeachwa bila kufafanuliwa kidhehebu. Alama zote za tanbihi zimewekwa katika matini kuu.
