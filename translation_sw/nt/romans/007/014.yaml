  source_fidelity: Matini ya Kiswahili inawakilisha kwa uaminifu Οἴδαμεν, νόμος, πνευματικός, σάρκινός, πεπραμένος, na ὑπὸ τὴν ἁμαρτίαν. “Wa mwili” hudumisha lugha ya mwili/flesh na mvutano wake na “ya kiroho,” bila kuingiza tafsiri ya “asili ya dhambi.” “Nimeuzwa chini ya dhambi” huhifadhi sitiari ya hali ya kutiishwa inayotokana na kauli timilifu tendwa.
  naturalness: Kiswahili ni sanifu, cha sasa, na kina mtiririko wa kawaida katika sajili ya tafsiri ya Maandiko. Ingawa “chini ya dhambi” ni usemi wa karibu na Kigiriki kuliko usemi wa mazungumzo, unaeleweka vizuri katika sajili hii na tanbihi hufafanua maana ya kutiishwa.
  terminology: “Sheria,” “ya kiroho,” “wa mwili,” na “dhambi” ni istilahi thabiti na zisizoegemea fundisho fulani. Tanbihi [a] imefungwa ipasavyo kwenye “wa mwili,” na [b] kwenye usemi wa kuuzwa chini ya dhambi. Njia ya ukaguzi ya Kiingereza inaonekana kuwa na kutolingana kwa alama za tanbihi (maudhui ya tanbihi zake a/b hayalingani na mahali zilipo katika sentensi ya Kiingereza), lakini rasimu ya Kiswahili yenyewe ina viambatisho sahihi na maudhui yanayolingana.
  issues:
