    issue: Kutolingana kwa alama za tanbihi katika maandishi ya ukaguzi ya Kiingereza
    rationale: 'Katika English POB, [a] imewekwa baada ya “spiritual” lakini inaeleza “of the flesh,” na [b] imewekwa baada ya “fleshly” lakini inaeleza “sold as a slave.” Hili halipo katika matini ya Kiswahili: [a] iko baada ya “wa mwili” na [b] baada ya “dhambi.”'
  revised_text: Kwa maana tunajua kwamba sheria ni ya kiroho, lakini mimi ni wa mwili[a], nimeuzwa chini ya dhambi[b].
