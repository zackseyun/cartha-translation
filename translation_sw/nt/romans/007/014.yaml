  text: Οἴδαμεν γὰρ ὅτι ὁ νόμος πνευματικός ἐστιν· ἐγὼ δὲ ⸀σάρκινός εἰμι, πεπραμένος ὑπὸ τὴν ἁμαρτίαν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/014.yaml
  text: For we know that the law is spiritual[a], but I am fleshly[b], sold under sin.
translation:
  language: sw
  text: Kwa maana tunajua kwamba sheria ni ya kiroho, lakini mimi ni wa mwili[a], nimeuzwa chini ya dhambi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mimi ni wa kimwili.”
    reason: lexical_alternative
  - marker: b
    text: Au, “nimeuzwa kuwa mtumwa chini ya dhambi,” yaani, chini ya mamlaka ya dhambi.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἴδαμεν
  choice: tunajua
  rationale: Huwasilisha maarifa thabiti yanayoshirikiwa na Paulo na wasomaji wake, kwa Kiswahili cha kawaida na cha moja kwa moja.
- source_word: ὁ νόμος
  choice: sheria
  rationale: Hufuata usemi wa Kigiriki bila kufafanua kupita kiasi katika mstari wenyewe; katika muktadha wa Waroma mara nyingi hurejelea sheria ya Musa.
- source_word: πνευματικός
  choice: ya kiroho
  rationale: Huhifadhi tofauti ya moja kwa moja na σάρκινός na kueleza sifa au hali inayohusiana na roho, bila kulazimisha tafsiri mahsusi ya 'ya Roho'.
- source_word: σάρκινός
  choice: wa mwili
  rationale: Huhifadhi lugha ya mzizi wa σάρξ na tofauti yake na 'ya kiroho,' bila kuingiza ufafanuzi mpana zaidi kama 'mwenye asili ya dhambi'.
- source_word: πεπραμένος
  choice: nimeuzwa
  rationale: Kauli timilifu tendwa inaonyesha hali iliyotokana na kuuzwa; Kiswahili hiki kinadumisha sitiari hiyo kwa ufupi.
- source_word: ὑπὸ τὴν ἁμαρτίαν
  choice: chini ya dhambi
  rationale: Hufuata usemi mfupi wa Kigiriki unaoonyesha kutiishwa, bila kuupanua kimafafanuzi katika matini kuu.
theological_decisions:
- issue: Jinsi ya kutafsiri lugha ya Paulo kuhusu mwili
  choice: Kutumia 'wa mwili' badala ya 'mwenye dhambi' au 'mwenye asili ya dhambi.'
  alternative: mwenye dhambi; mwenye asili ya dhambi; asiye wa kiroho
  rationale: Uamuzi huu huhifadhi tofauti kati ya 'ya kiroho' na 'wa mwili' na hauamui kimya-kimya mjadala kuhusu anthropolojia ya Paulo.
- issue: Nguvu ya sitiari ya kuuzwa chini ya dhambi
  choice: Kudumisha 'nimeuzwa chini ya dhambi' katika matini kuu na kueleza utumwa katika tanbihi.
  alternative: nimeuzwa kuwa mtumwa wa dhambi
  rationale: Kigiriki kina sitiari ya kuuzwa na hali ya kuwa chini ya dhambi; tanbihi hufafanua maana ya utumwa bila kupanua matini kuu kupita kiasi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa moja kwa moja lakini wa asili; 'wa mwili' huhifadhi mvutano wa istilahi za Paulo, na tanbihi zinafafanua mbadala bila kulazimisha fundisho fulani.
