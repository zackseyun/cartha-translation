  text: ὥστε ὁ μὲν νόμος ἅγιος, καὶ ἡ ἐντολὴ ἁγία καὶ δικαία καὶ ἀγαθή.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/012.yaml
  text: So then, the law is holy, and the commandment is holy and righteous and good.
translation:
  language: sw
  text: Kwa hiyo, sheria ni takatifu, na amri ni takatifu, ya haki na njema.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὥστε
  choice: Kwa hiyo
  rationale: Inaonyesha hitimisho linalotokana na hoja iliyotangulia, kwa Kiswahili cha kawaida na chenye nguvu ya kimantiki.
- source_word: νόμος
  choice: sheria
  rationale: Inahifadhi usemi wa Paulo bila kuongeza wazi kuwa ni Sheria ya Musa, ingawa muktadha unaielekeza huko.
- source_word: ἅγιος
  choice: takatifu
  rationale: Ni tafsiri ya kawaida inayobeba maana ya kutengwa kwa ajili ya Mungu na kuwa safi kiadili.
- source_word: ἐντολή
  choice: amri
  rationale: Ni neno la asili na linaloeleweka kwa agizo mahususi lililo ndani ya sheria.
- source_word: δικαία
  choice: ya haki
  rationale: Inatoa tathmini ya kimaadili kwamba amri hiyo ni adilifu na sawa, bila kuifanya amri kuwa nafsi.
- source_word: ἀγαθή
  choice: njema
  rationale: Inahifadhi maana pana ya wema wa kimaadili na manufaa bila ufafanuzi wa ziada.
- source_word: μὲν
  choice: haijatafsiriwa moja kwa moja
  rationale: Msisitizo wake mdogo wa kimjadala unaeleweka katika mtiririko wa sentensi; kuitafsiri wazi kungefanya Kiswahili kisikike kizito bila kuwa na kifungu cha wazi cha kulinganisha.
theological_decisions:
- issue: Je, νόμος itajwe wazi kuwa Sheria ya Musa?
  choice: sheria
  alternative: Sheria ya Musa
  rationale: Muktadha unaweza kumaanisha Sheria ya Musa, lakini mstari wenyewe unasema tu νόμος; tafsiri haipaswi kufunga maana kwa kuongeza maelezo yasiyokuwapo katika kifungu.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Muundo wa sifa umewekwa wa kawaida katika Kiswahili: “takatifu, ya haki na njema.”'
