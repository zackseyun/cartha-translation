  text: For I do not do the good that I want[b][a], but the evil that I do not want—this I practice.
translation:
  language: sw
  text: Kwa maana sitendi jambo jema ninalotaka, bali nafanya jambo ovu nisilotaka—hilo ndilo ninalofanya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θέλω
  choice: -taka
  rationale: Kitenzi “kutaka” ni cha kawaida na huonyesha nia ya mhusika bila kuingiza maana ya kifalsafa isiyolazimishwa na muktadha.
- source_word: ποιῶ
  choice: -tenda
  rationale: “Kutenda” hutoa maana ya kufanya au kutekeleza jambo, na hapa husaidia kutofautisha kwa kiasi na πράσσω huku sentensi ikibaki ya asili katika Kiswahili.
- source_word: ἀγαθόν
  choice: lile jema
  rationale: Nomino ya kivumishi imetafsiriwa kwa “lile jema” ili kuonyesha jambo lililo jema kimaadili na kudumisha ulinganifu na “lile ovu.”
- source_word: κακὸν
  choice: lile ovu
  rationale: “Ovu” huhifadhi uzito wa kimaadili wa neno la Kigiriki, badala ya kulifanya kuwa jambo baya kwa maana dhaifu tu.
- source_word: πράσσω
  choice: -fanya
  rationale: “Kufanya” ni tafsiri pana na ya kawaida ya tendo linalotekelezwa; kutofautishwa kwake na “kutenda” hakupaswi kuchukuliwa kuwa tofauti kali ya maana.
- source_word: τοῦτο
  choice: hilo ndilo
  rationale: 'Muundo huu huhifadhi msisitizo wa kiwakilishi cha Kigiriki: ni ovu hilo hasa analofanya.'
- source_word: οὐ γὰρ
  choice: Kwa maana ... si-
  rationale: “Kwa maana” huhifadhi kazi ya γάρ ya kutoa sababu au ufafanuzi na kuunganisha aya na hoja iliyotangulia.
theological_decisions:
- issue: Iwapo kupunguza ukali wa mgongano wa kimaadili kati ya ἀγαθόν na κακόν
  choice: lile jema / lile ovu
  alternative: jambo sahihi / jambo lisilo sahihi; zuri / baya
  rationale: Maneno ya Kigiriki yana uzito wa moja kwa moja wa kimaadili. Tafsiri hii hudumisha mvutano wa Paulo bila kuugeuza kuwa tofauti dhaifu ya kimatendo tu.
- issue: Iwapo πράσσω inadokeza lazima zoea linalorudiwa
  choice: ninalofanya
  alternative: ninalozoea kulitenda
  rationale: Ingawa πράσσω inaweza kumaanisha kutenda au kufanya kwa vitendo, aya yenyewe hailazimishi wazo la mazoea ya kudumu. “Ninalofanya” huhifadhi upana huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa “lile jema ... lile ovu” unadumisha ulinganifu na uzito wa kimaadili; “hilo ndilo” huhifadhi msisitizo wa τοῦτο.
