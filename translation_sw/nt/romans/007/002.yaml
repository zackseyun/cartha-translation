  text: ἡ γὰρ ὕπανδρος γυνὴ τῷ ζῶντι ἀνδρὶ δέδεται νόμῳ· ἐὰν δὲ ἀποθάνῃ ὁ ἀνήρ, κατήργηται ἀπὸ τοῦ νόμου τοῦ ἀνδρός.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/002.yaml
  text: For a married woman is bound by law to her husband while he lives; but if the husband dies[a], she is released from the law of her husband.
translation:
  language: sw
  text: Kwa maana mwanamke aliyeolewa amefungwa kisheria kwa mumewe wakati angali hai; lakini mumewe akifa, amewekwa huru kutoka katika sheria ya mumewe[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “amefunguliwa kutoka katika sheria ya mumewe”; yaelekea Kigiriki kinamaanisha kifungo cha kisheria kilichomfunga kwa mumewe.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὕπανδρος γυνή
  choice: mwanamke aliyeolewa
  rationale: Hueleza kwa Kiswahili cha kawaida mwanamke aliye katika kifungo cha ndoa, bila kufuata kihalisi usemi usio wa kawaida wa ‘mwanamke aliye chini ya mume.’
- source_word: τῷ ζῶντι ἀνδρί
  choice: kwa mume wake wakati mume huyo angali hai
  rationale: Huhifadhi uhusiano wa mume na mke na kusisitiza kwamba kifungo hudumu wakati mume yu hai.
- source_word: δέδεται
  choice: amefungwa
  rationale: Kauli timilifu tendwa inaonyesha hali ya sasa iliyotokana na kufungwa; ‘amefungwa’ huhifadhi picha hiyo ya kifungo cha kisheria.
- source_word: νόμῳ
  choice: kwa sheria
  rationale: Hapa neno hilo linaelekea kutaja kanuni au kifungo cha kisheria kwa ujumla katika ndoa, si lazima Sheria ya Musa hasa.
- source_word: κατήργηται
  choice: amefunguliwa
  rationale: Katika muktadha wa wajibu wa kisheria, kitenzi humaanisha kwamba nguvu ya kifungo hicho imeondolewa; ‘amefunguliwa’ ni wazi na huhifadhi picha ya kuachiliwa kutoka kifungoni.
- source_word: ἀπὸ τοῦ νόμου τοῦ ἀνδρός
  choice: kutoka katika sheria ya mume
  rationale: Tafsiri hii huhifadhi muundo uliobanwa wa Kigiriki na utata wake wa kiasi; tanbihi hufafanua kuwa maana inayowezekana ni kifungo cha kisheria kilichomhusisha na mumewe.
theological_decisions:
- issue: Iwapo νόμῳ / τοῦ νόμου inamaanisha hasa Sheria ya Musa au kifungo cha jumla cha kisheria cha ndoa
  choice: sheria kama kanuni au kifungo cha ndoa kwa ujumla
  alternative: Sheria ya Musa kama inavyotumika kwa ndoa
  rationale: Muktadha wa karibu ni mfano wa ndoa na kifo, na νόμῳ ya kwanza haina kibainishi; hivyo usemi unaelekea kwenye nguvu ya kisheria ya kifungo cha ndoa bila kukana kwamba wasomaji wanaweza kuihusisha na mjadala mpana kuhusu sheria.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. ‘Angali hai’ ni usemi wa kawaida wenye hadhi; ‘amefunguliwa kutoka katika’ huhifadhi taswira ya Kigiriki ya kuondolewa katika nguvu ya kifungo cha kisheria. Alama ya tanbihi imewekwa baada ya kishazi cha mwisho kinachofafanuliwa.
