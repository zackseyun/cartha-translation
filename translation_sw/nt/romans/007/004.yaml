id: ROM.7.4
reference: Romans 7:4
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ὥστε, ἀδελφοί μου, καὶ ὑμεῖς ἐθανατώθητε τῷ νόμῳ διὰ τοῦ σώματος τοῦ Χριστοῦ, εἰς τὸ γενέσθαι ὑμᾶς ἑτέρῳ, τῷ ἐκ νεκρῶν ἐγερθέντι ἵνα καρποφορήσωμεν τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/004.yaml
  text: So then[a], my brothers, you also were put to death to the law through the body of the Messiah[c][b], so that you might belong to another—to him who was raised from the dead—in order that we might bear fruit for God.
translation:
  language: sw
  text: Basi, ndugu zangu[a], ninyi pia mlifanywa wafu kwa habari ya sheria kwa njia ya mwili wa Masihi[b], ili muwe wa mwingine[c]—yaani, yeye aliyefufuliwa kutoka kwa wafu—kusudi tukazaa matunda kwa ajili ya Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki ni “ndugu” katika umbo la kiume la wingi; katika wito kama huu neno hilo linaweza kuwahusu wanaume na wanawake.
    reason: lexical_alternative
  - marker: b
    text: Kigiriki Χριστοῦ; yaani, “Mtiwa-Mafuta.” Pia inaweza kutafsiriwa “Kristo.”
    reason: lexical_alternative
  - marker: c
    text: Kwa tafsiri ya karibu zaidi, “ili muwe mali ya mwingine.” Usemi huu unaendeleza mfano wa ndoa kutoka mistari iliyotangulia.
    reason: cultural_note
lexical_decisions:
- source_word: Ὥστε
  choice: Basi
  rationale: Huonyesha hitimisho linalotokana na mfano uliotangulia na ni kiunganishi cha kawaida, cha asili katika Kiswahili.
- source_word: ἀδελφοί μου
  choice: ndugu zangu
  rationale: Neno la Kiswahili “ndugu” linafaa katika wito kwa jumuiya na linaweza kuwahusu wanaume na wanawake, huku tanbihi ikieleza umbo la Kigiriki.
- source_word: ἐθανατώθητε τῷ νόμῳ
  choice: mlifanywa wafu kwa upande wa sheria
  rationale: Huhifadhi hali ya kutendwa ya kitenzi cha Kigiriki na uhusiano wa kifo na sheria bila kusema kwa namna ya kufasiri zaidi kwamba sheria ndiyo iliyowaua.
- source_word: διὰ τοῦ σώματος τοῦ Χριστοῦ
  choice: kwa njia ya mwili wa Masihi
  rationale: “Kwa njia ya” huonyesha chombo au njia, na “mwili” huhifadhi taswira halisi ya kifo cha kimwili.
- source_word: Χριστοῦ
  choice: Masihi
  rationale: Hapa Χριστός lina nguvu ya cheo cha Mtiwa-Mafuta; “Masihi” huhifadhi maana hiyo wazi katika Kiswahili.
- source_word: εἰς τὸ γενέσθαι ὑμᾶς ἑτέρῳ
  choice: ili muwe wa mwingine
  rationale: Hufuata kwa karibu usemi wa Kigiriki na kuhifadhi mfano wa ndoa unaoendelea kutoka mistari iliyotangulia.
- source_word: τῷ ἐκ νεκρῶν ἐγερθέντι
  choice: yeye aliyefufuliwa kutoka kwa wafu
  rationale: Huhifadhi kauli ya kutendwa kuhusu ufufuo na kubainisha kwamba “mwingine” ni Masihi.
- source_word: ἵνα καρποφορήσωμεν τῷ θεῷ
  choice: kusudi tumzalie Mungu matunda
  rationale: Huhifadhi kusudi, taswira ya kuzaa matunda, na badiliko la nafsi kutoka “ninyi” kwenda “sisi” lililopo katika Kigiriki.
theological_decisions:
- issue: Maana ya Χριστός katika kifungu hiki
  choice: Masihi
  alternative: Kristo
  rationale: “Masihi” huonyesha wazi cheo cha Mtiwa-Mafuta bila kulifanya neno kuwa jina tu; “Kristo” bado ni tafsiri mbadala inayojulikana.
- issue: Uhusiano wa waamini na sheria katika ἐθανατώθητε τῷ νόμῳ
  choice: mlifanywa wafu kwa upande wa sheria
  alternative: mliifia sheria
  rationale: Chaguo hili hudumisha hali ya kutendwa ya kitenzi na mvutano wa usemi wa Paulo bila kuongeza maelezo kwamba waamini waliikataa sheria kwa tendo lao wenyewe.
- issue: Taswira ya ndoa katika γενέσθαι ὑμᾶς ἑτέρῳ
  choice: ili muwe wa mwingine
  alternative: ili muunganishwe na mwingine
  rationale: Usemi huu huhifadhi wazo la kuwa wa mwenzi mwingine bila kuongeza moja kwa moja dhana ya kuunganishwa, ingawa muktadha wa ndoa unaelekeza maana yake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo “mlifanywa wafu kwa upande wa sheria” ni rasmi kidogo kwa makusudi ili kuhifadhi hali ya kutendwa na kuepuka kudokeza kwamba sheria ndiyo mtendaji. Alama za vistari virefu zinaweka wazi kwamba aliyefufuliwa ndiye “mwingine.”
