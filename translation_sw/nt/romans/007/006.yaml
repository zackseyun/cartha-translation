  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: νυνὶ δὲ κατηργήθημεν ἀπὸ τοῦ νόμου, ἀποθανόντες ἐν ᾧ κατειχόμεθα, ὥστε δουλεύειν ἡμᾶς ἐν καινότητι πνεύματος καὶ οὐ παλαιότητι γράμματος.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/006.yaml
  text: But now we have been released from the law[a], having died to what held us[c][b], so that we serve in newness of the Spirit and not in oldness of the letter.
translation:
  language: sw
  text: Lakini sasa tumewekwa huru kutoka katika sheria, tukiwa tumekufa kwa kile kilichokuwa kimetushikilia,[a] ili tutumikie katika upya wa Roho,[b] wala si katika ukale wa herufi.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “tukiwa tumekufa kwa kile kilichokuwa kimetufunga.”
    reason: lexical_alternative
  - marker: b
    text: Au “katika upya wa roho.”
    reason: alternative_reading
  - marker: c
    text: Au “katika ukale wa kanuni iliyoandikwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατηργήθημεν ἀπὸ τοῦ νόμου
  choice: tumewekwa huru kutoka katika sheria
  rationale: Muundo huu unaonyesha kuondolewa chini ya mamlaka inayofunga ya sheria, si kwamba sheria yenyewe imebatilishwa au imekoma kuwapo.
- source_word: ἀποθανόντες
  choice: kwa kuwa tumekufa
  rationale: Kishiriki hiki kinawahusu ‘sisi’ na kinaonyesha kwamba waamini ndio waliokufa kuhusiana na kile kilichowashikilia.
- source_word: ἐν ᾧ κατειχόμεθα
  choice: kwa kile kilichokuwa kimetushikilia
  rationale: Tafsiri hii ni ya asili katika Kiswahili na inadumisha wazo la kushikiliwa au kufungwa hapo awali bila kulazimisha uchambuzi mmoja wa muundo wenye utata.
- source_word: δουλεύειν
  choice: tutumikie
  rationale: Neno hili linahifadhi maana ya kutoa utumishi, huku muktadha ukibeba pia taswira ya utumwa.
- source_word: καινότητι πνεύματος
  choice: katika upya wa Roho
  rationale: ‘Upya’ huhifadhi nomino dhahania na ulinganifu wake na ‘ukale’; ‘Roho’ inaeleweka zaidi kama Roho Mtakatifu katika mlinganisho wa Paulo kati ya Roho na herufi.
- source_word: παλαιότητι γράμματος
  choice: katika ukale wa herufi
  rationale: Huhifadhi kwa karibu ulinganifu wa Kigiriki kati ya upya na ukale na pia nahau ya Paulo kuhusu ‘herufi,’ bila kuipanua moja kwa moja kuwa sheria iliyoandikwa.
theological_decisions:
- issue: Je, sheria ndiyo iliyokufa, au waamini ndio waliokufa kuhusiana na sheria?
  choice: 'Waamini ndio waliokufa: “kwa kuwa tumekufa kwa kile kilichokuwa kimetushikilia.”'
  alternative: Sheria ilikufa kuhusiana nasi.
  rationale: ἀποθανόντες ni kishiriki cha wingi katika hali ya nomino na kinarejelea kiima kilichodokezwa, ‘sisi.’ Tafsiri inafuata sarufi hiyo.
- issue: Je, πνεύματος inamaanisha Roho Mtakatifu au roho ya mwanadamu?
  choice: 'Roho Mtakatifu: “Roho.”'
  alternative: roho
  rationale: Katika mlinganisho wa Paulo kati ya Roho na herufi na katika muktadha wa agano jipya, Roho Mtakatifu ndiye anayeelekea kurejelewa; hata hivyo, uwezekano wa maana ya jumla zaidi umehifadhiwa katika tanbihi.
- issue: Maana ya γράμματος
  choice: “herufi,” kama nahau ya Paulo
  alternative: “kanuni iliyoandikwa”
  rationale: Tafsiri ya moja kwa moja huhifadhi mvutano wa maneno ya Paulo; tafsiri fafanuzi zaidi imewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ‘upya wa Roho ... ukale wa herufi’ ni rasmi kwa kiasi lakini unahifadhi ulinganifu wa kimakusudi wa Paulo. Alama zote za tanbihi zimewekwa katika matini kuu karibu na vifungu vinavyohusika.
