  text: ἡ γὰρ ἁμαρτία ἀφορμὴν λαβοῦσα διὰ τῆς ἐντολῆς ἐξηπάτησέν με καὶ δι’ αὐτῆς ἀπέκτεινεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/011.yaml
  text: For sin[a], having taken an opportunity through the commandment[b], deceived me and through it killed me.
translation:
  language: sw
  text: Kwa maana dhambi, baada ya kupata fursa[a] kwa njia ya amri, ilinidanganya, na kwa njia ya amri hiyo ikaniua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “baada ya kuchukua fursa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: Kwa maana
  rationale: Inaendeleza nguvu ya ufafanuzi inayounganisha mstari huu na kauli iliyotangulia kwa Kiswahili cha kawaida.
- source_word: ἡ ἁμαρτία
  choice: dhambi
  rationale: Neno la kawaida la Paulo limehifadhiwa, huku dhambi ikibaki mhusika anayetenda vitendo katika sentensi.
- source_word: ἀφορμὴν λαβοῦσα
  choice: baada ya kupata nafasi
  rationale: Huwasilisha tendo la kupata au kutumia mwanya bila kuongeza kwa lazima wazo la unyang’anyi lisilosemwa moja kwa moja na kitenzi λαμβάνω.
- source_word: διὰ τῆς ἐντολῆς
  choice: kupitia amri
  rationale: Inaonyesha kwamba amri ndiyo chombo au njia iliyotumiwa, na inadumisha umoja wa ἐντολή.
- source_word: ἐξηπάτησέν
  choice: ilinidanganya
  rationale: Tafsiri ya wazi na ya sasa ya kitenzi hicho; kiambishi cha mtendwa kinahifadhi με kwa njia ya asili katika Kiswahili.
- source_word: δι’ αὐτῆς
  choice: kupitia amri hiyo
  rationale: Kiwakilishi cha Kigiriki kinarejelea amri. Kurudia nomino kwa ufupi huondoa utata wa kijinsia ambao Kiswahili hakiwezi kuonyesha kwa kiwakilishi kama Kigiriki.
- source_word: ἀπέκτεινεν
  choice: ikaniua
  rationale: Ni usemi wa moja kwa moja na wa kawaida unaohifadhi matokeo makali ya tendo bila kulifanya la kisheria zaidi ya maandishi.
theological_decisions:
- issue: Kiwango cha uhuishaji wa dhambi katika maelezo ya Paulo
  choice: Dhambi imewasilishwa kama mhusika hai anayepata nafasi, anadanganya, na kuua.
  alternative: Kupunguza uhuishaji kwa kuieleza dhambi kama hali au nguvu isiyotenda moja kwa moja.
  rationale: Katika Kigiriki, dhambi ndiyo kiima cha vitendo vyote vitatu. Tafsiri inadumisha mvutano huu wa kisarufi na kiteolojia bila kuongeza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umefanywa wa asili kwa wasomaji wa kawaida huku uhusiano wa kisababishi, matumizi ya amri kama njia, na uhuishaji wa dhambi vikihifadhiwa.
