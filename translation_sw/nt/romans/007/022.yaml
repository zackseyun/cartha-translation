lexical_decisions:
- source_word: συνήδομαι
  choice: naifurahia
  rationale: Kitenzi hiki huonyesha kukubaliana kwa furaha au kupendezwa sana, si kukubali kiakili tu. ‘Naifurahia’ ni Kiswahili cha kawaida kinachohifadhi nguvu hiyo ya kihisia.
- source_word: νόμῳ
  choice: sheria
  rationale: Katika Waroma, νόμος mara nyingi hutumiwa kwa maana yenye uzito ya sheria; ‘sheria’ huhifadhi matumizi hayo yaliyozoeleka na uzito wake wa kiteolojia.
- source_word: τοῦ θεοῦ
  choice: ya Mungu
  rationale: Hii ni namna ya kawaida na iliyo wazi ya kuonyesha uhusiano wa nomino katika Kiswahili.
- source_word: κατὰ
  choice: kwa
  rationale: Hapa κατά huonyesha upande au mtazamo ambao furaha hiyo inahusishwa nao. ‘Kwa’ huhifadhi uhusiano huo bila kuufanya kuwa maelezo marefu.
- source_word: τὸν ἔσω ἄνθρωπον
  choice: utu wangu wa ndani
  rationale: ‘Utu wa ndani’ huhifadhi taswira ya Paulo ya ἔσω ἄνθρωπον kwa Kiswahili cha asili na chenye heshima. ‘Wangu’ hutokana na muktadha wa nafsi ya kwanza, ingawa haijaandikwa moja kwa moja katika Kigiriki; hilo limebainishwa katika tanbihi.
theological_decisions:
- issue: Maana ya kiantropolojia ya ‘mtu wa ndani’
  choice: utu wangu wa ndani
  alternative: mtu wa ndani; nafsi yangu ya ndani
  rationale: Tafsiri hii inaelekeza kwa hali au nafsi ya ndani ya msemaji huku ikihifadhi taswira ya Paulo, bila kuingiza nadharia maalumu kuhusu sehemu zinazounda mwanadamu.
- issue: Uhusiano unaoonyeshwa na κατὰ
  choice: kwa utu wangu wa ndani
  alternative: kulingana na mtu wa ndani
  rationale: ‘Kwa’ ni ya asili zaidi katika Kiswahili na inaweza kuonyesha upande ambao msemaji anaifurahia sheria. Mbadala wa moja kwa moja zaidi umehifadhiwa katika tanbihi ili kutoficha uwezekano wa maana hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Sentensi imehifadhi kiunganishi cha hoja ‘Kwa maana’ na taswira ya ndani ya Paulo bila kuifanya kuwa fundisho maalumu kuhusu maumbile ya mwanadamu.
