translation:
  language: sw
  text: Kwa maana naifurahia sheria ya Mungu kwa utu wangu wa ndani.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kulingana na mtu wa ndani,” au “katika nafsi yangu ya ndani.”
