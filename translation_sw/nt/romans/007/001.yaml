id: ROM.7.1
reference: Romans 7:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἢ ἀγνοεῖτε, ἀδελφοί, γινώσκουσιν γὰρ νόμον λαλῶ, ὅτι ὁ νόμος κυριεύει τοῦ ἀνθρώπου ἐφ’ ὅσον χρόνον ζῇ;
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/001.yaml
  text: Or do you not know[b][a], brothers—for I am speaking to those who know the law—that the law has authority over a person for as long as he lives?
translation:
  language: sw
  text: Au hamjui, ndugu[a]—kwa maana ninasema na watu wanaoijua sheria—kwamba sheria humtawala mtu maadamu yu hai?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ndugu” hapa linawahusu waumini wenzake, wanaume na wanawake.
    reason: cultural_note
  - marker: b
    text: Au, “ina mamlaka juu ya mtu maadamu yu hai.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἢ
  choice: Au
  rationale: Inahifadhi kiunganishi cha hoja kinachounganisha swali hili na mjadala uliotangulia.
- source_word: ἀγνοεῖτε
  choice: hamjui
  rationale: Ni usemi wa kawaida wa Kiswahili katika swali la balagha na unadumisha wito kwa maarifa wanayoshiriki wasikilizaji.
- source_word: ἀδελφοί
  choice: ndugu
  rationale: Katika Kiswahili, “ndugu” ni neno la kawaida lisilobainisha jinsia na linaweza kuwahusu waumini wa kiume na wa kike, huku likidumisha lugha ya kifamilia.
- source_word: γινώσκουσιν γὰρ νόμον λαλῶ
  choice: kwa maana ninasema na watu wanaoijua sheria
  rationale: Inahifadhi maelezo ya katikati yanayoletwa na γάρ na kueleza walengwa kuwa watu wenye kuijua sheria.
- source_word: νόμον / ὁ νόμος
  choice: sheria
  rationale: Haibainishi kuwa ni Sheria ya Musa pekee wala sheria kwa ujumla, hivyo inadumisha upana wa neno la Kigiriki katika muktadha.
- source_word: κυριεύει
  choice: humtawala
  rationale: Kitenzi hiki kinaonyesha utawala au mamlaka juu ya mtu; “humtawala” ni cha moja kwa moja na cha asili katika Kiswahili.
- source_word: τοῦ ἀνθρώπου
  choice: mtu
  rationale: ἄνθρωπος hapa humaanisha binadamu kwa ujumla, si mwanamume peke yake.
- source_word: ἐφ’ ὅσον χρόνον ζῇ
  choice: maadamu yu hai
  rationale: 'Ni usemi wa Kiswahili unaohifadhi kikamilifu maana ya muda: sheria hutawala wakati wote ambao mtu angali hai.'
theological_decisions:
- issue: Upeo wa νόμος katika kauli ya Paulo
  choice: Imetafsiriwa kwa urahisi kuwa “sheria” bila kuufanya upeo wake kuwa mwembamba.
  alternative: “Sheria ya Musa” hasa, au sheria kama kanuni ya jumla ya kisheria.
  rationale: Andiko la Kigiriki halisuluhishi wazi upeo kamili katika mstari huu. Muktadha wa karibu unaielekea Sheria ya Musa, lakini kauli yenyewe ni pana; tafsiri inadumisha mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Mistari mirefu imetenganishwa kwa vistari virefu ili kudumisha maelezo ya katikati ya Paulo.
