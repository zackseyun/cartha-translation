base_translation:
  language: en
  yaml_path: translation/nt/romans/007/021.yaml
  text: 'So I find this law: when I want to do what is good[a], evil lies close at hand.'
translation:
  language: sw
  text: 'Basi, naiona sheria hii[a]: ninapotaka kutenda mema, uovu upo karibu nami.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kanuni” au “utaratibu.”
    reason: Huhifadhi uwezekano kwamba νόμος hapa inamaanisha kanuni au hali inayotawala badala ya Sheria ya Musa.
lexical_decisions:
- source_word: Εὑρίσκω
  choice: naiona
  rationale: Kitenzi cha wakati uliopo kinaonyesha utambuzi unaoendelea; “naiona” ni lugha ya kawaida na hapa humaanisha kutambua jambo kuwa kweli.
- source_word: ἄρα
  choice: Basi
  rationale: Huonyesha hitimisho linalotokana na hoja iliyotangulia kwa Kiswahili cha kawaida.
- source_word: νόμον
  choice: sheria
  rationale: Neno la msingi νόμος limehifadhiwa ili kudumisha mwangwi wa “sheria” na kutofuta utata wa kama hapa linamaanisha sheria au kanuni inayotawala.
- source_word: τῷ θέλοντι ἐμοὶ ποιεῖν τὸ καλὸν
  choice: ninapotaka kutenda mema
  rationale: Muundo wa kidatibu umewekwa kwa Kiswahili cha asili huku nguvu ya kutaka na kutenda mema ikihifadhiwa.
- source_word: τὸ καλὸν
  choice: mema
  rationale: Kivumishi kilichotumiwa kama nomino kimetafsiriwa kwa usemi wa kawaida wa Kiswahili unaomaanisha mambo yaliyo mema.
- source_word: τὸ κακὸν
  choice: uovu
  rationale: Huhifadhi dhana ya uovu kama jambo linalokuwapo, bila kuibana iwe tendo moja baya.
- source_word: παράκειται
  choice: upo karibu nami
  rationale: Huonyesha kuwa uovu uko karibu au tayari kuwapo pamoja na msemaji, kwa lugha ya asili ya Kiswahili.
theological_decisions:
- issue: Kama νόμον inamaanisha Sheria ya Musa au kanuni/mwelekeo unaotawala
  choice: “sheria” katika matini kuu, huku maana ya kanuni ikitajwa katika tanbihi
  alternative: kanuni; utaratibu
  rationale: Kutumia “sheria” huhifadhi msamiati na mvutano wa Paulo bila kuamua kimya-kimya kwamba hapa anamaanisha tu Sheria ya Musa au tu kanuni ya jumla.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Muundo wa sentensi umefanywa wa kawaida bila kuondoa utata wa νόμος.
