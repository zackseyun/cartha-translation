  yaml_path: translation/nt/romans/007/024.yaml
  text: What a wretched man I am! Who will rescue me from this body of death?[a][b]
translation:
  language: sw
  text: Ole wangu! Mimi ni mtu wa taabu! Ni nani atakayeniokoa kutoka katika mwili huu wa mauti?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata mpangilio wa maneno kwa karibu zaidi, “mwili wa mauti haya.”
    reason: lexical_alternative
  - marker: b
    text: Au “atakayeninusuru.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ταλαίπωρος
  choice: mtu wa taabu
  rationale: Kirai hiki kinaeleza hali ya huzuni, dhiki na unyonge mkubwa bila kutumia “maskini,” ambalo katika Kiswahili cha sasa mara nyingi hueleweka kuwa hali ya kukosa mali. “Ole wangu” linahifadhi nguvu ya kilio cha Paulo.
- source_word: ἄνθρωπος
  choice: mtu
  rationale: “Mtu” ni tafsiri ya kawaida na ya asili hapa, na katika kauli ya nafsi ya kwanza inamrejelea Paulo mwenyewe bila kuondoa maana ya kibinadamu ya neno la Kigiriki.
- source_word: τίς
  choice: nani
  rationale: Kiwakilishi hiki cha kuuliza kinatafuta mwokozi mwenye nafsi, kwa hiyo “nani” ndilo chaguo la moja kwa moja.
- source_word: ῥύσεται
  choice: atakayeniokoa
  rationale: Kitenzi hiki humaanisha kuokoa au kunusuru kutoka katika hatari au kifungo. “Atakayeniokoa” ni cha kawaida, wazi, na kinahifadhi wazo la kuondolewa katika hali hiyo.
- source_word: ἐκ
  choice: kutoka katika
  rationale: Kinahifadhi wazo la kutolewa nje ya au kuondolewa kutoka katika hali inayotajwa.
- source_word: σώματος
  choice: mwili
  rationale: Maana halisi ya “mwili” imehifadhiwa, kwa kuwa hakuna msingi wa kuibadili kuwa dhana isiyo halisi.
- source_word: τοῦ θανάτου τούτου
  choice: huu wa mauti
  rationale: Katika “mwili huu wa mauti,” kiashiria “huu” kimewekwa pamoja na “mwili” ili sentensi iwe ya asili kwa Kiswahili huku uhusiano wa mwili na mauti ukihifadhiwa.
theological_decisions:
- issue: Namna ya kutafsiri muundo τοῦ σώματος τοῦ θανάτου τούτου
  choice: mwili huu wa mauti
  alternative: mwili wa mauti haya
  rationale: Chaguo kuu ni la asili zaidi katika Kiswahili na linahifadhi taswira pamoja na mvutano wa kifungu bila kuamua kama “mwili” unapaswa kueleweka kimwili, kimaadili, au kwa namna nyingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Kauli “Ole wangu” inatoa nguvu ya mshangao na uchungu uliomo katika ταλαίπωρος, huku “mtu wa taabu” ikiepuka uwezekano wa kuelewa “maskini” kuwa umaskini wa mali pekee. “Mauti” limetumiwa kwa sajili ya kibiblia iliyoeleweka sana, bila kufanya sentensi kuwa ya kizamani.
