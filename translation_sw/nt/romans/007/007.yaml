  text: Τί οὖν ἐροῦμεν; ὁ νόμος ἁμαρτία; μὴ γένοιτο· ἀλλὰ τὴν ἁμαρτίαν οὐκ ἔγνων εἰ μὴ διὰ νόμου, τήν τε γὰρ ἐπιθυμίαν οὐκ ᾔδειν εἰ μὴ ὁ νόμος ἔλεγεν· Οὐκ ἐπιθυμήσεις·
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/007.yaml
  text: What then shall we say? Is the law sin? May it never be! On the contrary[a], I would not have known sin except through the law. For I would not have known coveting if the law had not said, "You shall not covet."
translation:
  language: sw
  text: Basi, tuseme nini? Je, sheria ni dhambi? La hasha! Lakini singeijua dhambi isipokuwa kwa njia ya sheria. Kwa maana nisingeijua tamaa[a] kama sheria isingesema, “Usitamani.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hamu.” Neno la Kigiriki linaweza kumaanisha hamu au tamaa; amri iliyonukuliwa hapa inaelekeza hasa kwenye kutamani kilicho cha mwingine.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί οὖν ἐροῦμεν
  choice: Basi, tuseme nini?
  rationale: Inadumisha mtindo wa Paulo wa kuhamia hoja inayofuata kwa swali la balagha, kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: ὁ νόμος
  choice: sheria
  rationale: Ni neno la kawaida kwa νόμος katika hoja za Paulo na katika muktadha huu linarejelea Sheria ya Musa.
- source_word: ἁμαρτία
  choice: dhambi
  rationale: Linahifadhi nomino ya Kigiriki na swali kali la kama sheria yenyewe ni dhambi, badala ya kulainisha kuwa kama sheria ni yenye dhambi.
- source_word: μὴ γένοιτο
  choice: La hasha!
  rationale: Kauli hii ya Kiswahili inatoa ukanushaji mkali na wa hadhi unaolingana na nguvu ya msemo wa Paulo.
- source_word: ἀλλὰ
  choice: Lakini
  rationale: Inaonyesha tofauti ya hoja baada ya ukanushaji bila kuongeza wazo lisilosemwa wazi katika Kigiriki.
- source_word: τὴν ἁμαρτίαν οὐκ ἔγνων εἰ μὴ διὰ νόμου
  choice: singaliijua dhambi isipokuwa kwa njia ya sheria
  rationale: Muundo wa masharti unaonyesha kwamba pasipo sheria Paulo asingalijua dhambi; 'kwa njia ya sheria' hudumisha διὰ νόμου.
- source_word: ἐπιθυμίαν
  choice: kutamani
  rationale: Neno hili linaweza kumaanisha hamu kwa upana au tamaa ya kitu cha mwingine; dondoo la amri linalofuata linaelekeza kwenye maana ya kutamani kilichokatazwa, huku Kiswahili 'kutamani' kikidumisha kiasi cha upana wa neno.
- source_word: οὐκ ᾔδειν
  choice: singalijua
  rationale: Hudumisha ulinganifu wa kisemantiki na kauli iliyotangulia kwa Kiswahili cha asili, ingawa Kigiriki kimetumia kitenzi tofauti.
- source_word: Οὐκ ἐπιθυμήσεις
  choice: Usitamani
  rationale: Ni namna fupi, ya moja kwa moja, na ya kawaida ya kutoa katazo la amri katika Kiswahili.
theological_decisions:
- issue: Uhusiano kati ya sheria na dhambi
  choice: Je, sheria ni dhambi? La hasha!
  alternative: Je, sheria ina dhambi?
  rationale: Kigiriki kina nomino ya kiarifu na kinauliza kama sheria inalinganishwa au kutambulishwa na dhambi, si tu kama ina sifa ya kuwa yenye dhambi.
- issue: Jinsi sheria inavyohusiana na kuijua dhambi
  choice: singaliijua dhambi isipokuwa kwa njia ya sheria
  alternative: sikutambua dhambi ila kwa sheria
  rationale: Chaguo hili linahifadhi hali ya masharti inayodokezwa na εἰ μή na haliongezi dai kwamba sheria ndiyo chanzo cha dhambi; ni njia ya kuijua.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'La hasha' limetumiwa kwa ukanushaji wenye nguvu; maumbo 'singaliijua' na 'haingesema' yanawasilisha hali ya masharti kwa ufupi. Alama ya tanbihi [a] imewekwa mara moja katika matini kuu.
