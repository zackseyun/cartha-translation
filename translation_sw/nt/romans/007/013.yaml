    issue: Kifungu cha “ili ionekane kuwa dhambi” kimewekwa baada ya dai kwamba dhambi ilileta kifo, bila kuonyesha kwa uwazi kwamba kuleta kifo kwa njia ya kilicho chema ndiko kunakohusishwa na kusudi hilo.
    rationale: 'Katika Kigiriki, ἵνα φανῇ ἁμαρτία hufuatiwa na participle κατεργαζομένη θάνατον: dhambi inaonekana kuwa dhambi kwa kutokeza kifo kwa njia ya kilicho chema. Marekebisho huweka uhusiano huo wazi bila kulazimisha tafsiri ya kiteolojia.'
  - severity: medium
    issue: “Mbaya kupita kiasi” haitoi maana mahsusi ya ἁμαρτωλός.
    rationale: Kivumishi kinamaanisha “yenye dhambi/sinful,” si ubaya wa jumla. Kauli “yenye dhambi kupita kiasi” huhifadhi urudiaji na mkazo wa nomino-kivumishi wa chanzo.
  revised_text: Basi, je, kile kilicho chema kikawa kifo kwangu? La hasha! Bali dhambi, ili ionekane kuwa dhambi, iliniletea kifo kwa njia ya kile kilicho chema, ili kwa njia ya amri dhambi iwe yenye dhambi kupita kiasi.
