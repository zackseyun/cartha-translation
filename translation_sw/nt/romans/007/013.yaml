  to: Basi, je, kile kilicho chema kikawa kifo kwangu? La hasha! Bali dhambi, ili ionekane kuwa dhambi, iliniletea kifo kwa njia ya kile kilicho chema, ili kwa njia ya amri dhambi iwe yenye dhambi kupita kiasi.
  rationale: Marekebisho yanarejesha uhusiano wa kisintaksia kati ya kusudi la kwanza na tendo la dhambi la kutokeza kifo, yanadumisha kile kilicho chema kama njia badala ya chanzo chenye hatia, na yanatafsiri ἁμαρτωλός kwa istilahi ya “dhambi” badala ya “ubaya” wa jumla. Tanbihi ya rasimu imeondolewa kwa kuwa tafsiri kuu sasa yenyewe huhifadhi mkazo unaohusika.
