id: ROM.7.13
reference: Romans 7:13
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Τὸ οὖν ἀγαθὸν ἐμοὶ ⸀ἐγένετο θάνατος; μὴ γένοιτο· ἀλλὰ ἡ ἁμαρτία, ἵνα φανῇ ἁμαρτία διὰ τοῦ ἀγαθοῦ μοι κατεργαζομένη θάνατον· ἵνα γένηται καθ’ ὑπερβολὴν ἁμαρτωλὸς ἡ ἁμαρτία διὰ τῆς ἐντολῆς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/013.yaml
  text: So then[a], did what is good become death to me? May it never be! Rather, it was sin, so that it might be shown to be sin by producing death in me through what is good[b], in order that through the commandment sin might become exceedingly sinful.
translation:
  language: sw
  text: Basi, je, kile kilicho chema kikawa kifo kwangu? La hasha! Bali dhambi, ili ionekane kuwa dhambi, iliniletea kifo kwa njia ya kile kilicho chema, ili kwa njia ya amri dhambi iwe yenye dhambi kupita kiasi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τὸ ... ἀγαθὸν
  choice: kile kilicho chema
  rationale: Nomino iliyodokezwa na kivumishi cha kati inaonyeshwa kwa Kiswahili cha kawaida huku ikibaki dhana pana, si kitu maalumu kilichotajwa.
- source_word: ἐγένετο θάνατος
  choice: kikawa kifo
  rationale: Hudumisha maana ya kuwa au kugeuka kuwa, badala ya kusema kwa uhuru zaidi kwamba kilisababisha kifo.
- source_word: μὴ γένοιτο
  choice: La hasha!
  rationale: Ni kanusho kali, fupi na lenye hadhi linalolingana na usemi wa Paulo.
- source_word: ἡ ἁμαρτία
  choice: dhambi
  rationale: Hudumisha dhambi kama dhana inayotendeshwa kana kwamba ni mtendaji, bila kuifanya kuwa mtu halisi.
- source_word: ἵνα φανῇ ἁμαρτία
  choice: ili ionekane kuwa dhambi
  rationale: Hudumisha urudiaji wa neno ‘dhambi’ na kusudi au matokeo yanayoelezwa na ἵνα bila kulainisha mkazo wa Paulo.
- source_word: διὰ τοῦ ἀγαθοῦ
  choice: kupitia kile kilicho chema
  rationale: Hudumisha uhusiano wa njia au chombo na kurudia kwa ‘kilicho chema’ kutoka mwanzo wa aya.
- source_word: μοι κατεργαζομένη θάνατον
  choice: iliniletea kifo
  rationale: Hueleza kwa Kiswahili asilia tendo la dhambi la kutokeza kifo kwa msemaji, huku dhambi ikibaki mtendaji.
- source_word: διὰ τῆς ἐντολῆς
  choice: kupitia amri
  rationale: Neno ‘amri’ ni la kawaida na sahihi katika muktadha wa amri ya sheria; ‘kupitia’ hudumisha maana ya διά.
- source_word: καθ’ ὑπερβολὴν ἁμαρτωλὸς
  choice: mbaya kupita kiasi
  rationale: Ni Kiswahili cha asili kinachowasilisha kiwango kisicho na kipimo; tafsiri iliyo karibu zaidi na muundo wa Kigiriki imehifadhiwa katika tanbihi.
theological_decisions:
- issue: Utetezi wa Paulo kuhusu wema wa amri
  choice: Kile kilicho chema hakifanywi chanzo chenye hatia cha kifo; dhambi ndiyo inayoleta kifo kwa kutumia kilicho chema.
  alternative: Tafsiri huru ingeweza kudokeza kwamba amri yenyewe ndiyo chanzo cha kifo kwa maana ya kuwa na hatia ya kimaadili.
  rationale: Kanusho kali na kisha utofautishaji kwa ἀλλὰ ἡ ἁμαρτία huweka wajibu juu ya dhambi, huku amri ikibaki njia ambayo dhambi inafunuliwa.
- issue: Kusudi au matokeo katika vifungu vya ἵνα
  choice: Kutumia ‘ili’ na kuacha wazi uhusiano wa kusudi na matokeo.
  alternative: Kutumia ‘hivyo kwamba’ kungeelekeza zaidi kwenye matokeo pekee.
  rationale: ἵνα inaweza kubeba mwelekeo wa kusudi au matokeo katika muktadha huu; ‘ili’ hudumisha mvutano huo kwa ufupi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Mpangilio wa sentensi umerekebishwa kidogo ili Kiswahili kitiririke, huku dhambi ikibaki mtendaji na kile kilicho chema kikibaki njia iliyotumiwa.
