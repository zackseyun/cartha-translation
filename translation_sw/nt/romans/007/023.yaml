  text: βλέπω δὲ ἕτερον νόμον ἐν τοῖς μέλεσίν μου ἀντιστρατευόμενον τῷ νόμῳ τοῦ νοός μου καὶ αἰχμαλωτίζοντά με ⸀ἐν τῷ νόμῳ τῆς ἁμαρτίας τῷ ὄντι ἐν τοῖς μέλεσίν μου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/023.yaml
  text: But I see another law in my members[b][a], waging war against the law of my mind and taking me captive to the law of sin that is in my members.
translation:
  language: sw
  text: Lakini ninaona sheria nyingine[a] katika viungo vya mwili wangu, ikipigana dhidi ya sheria ya akili yangu na kunifanya mateka chini ya sheria ya dhambi[b] iliyo katika viungo vya mwili wangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno ‘sheria’ katika matumizi yake yanayorudiwa hapa linaweza pia kueleweka kuwa ‘kanuni’ au ‘nguvu’.
    reason: lexical_alternative
  - marker: b
    text: Kwa tafsiri ya karibu, ‘katika sheria ya dhambi’; ‘chini ya sheria ya dhambi’ linaonyesha maana ya kuwekwa chini ya mamlaka yake.
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπω
  choice: ninaona
  rationale: Wakati uliopo na mtazamo wa moja kwa moja wa Paulo vinahifadhiwa kwa kitenzi rahisi na cha kawaida ‘ninaona’.
- source_word: ἕτερον
  choice: nyingine
  rationale: ‘Nyingine’ linaonyesha tofauti na sheria iliyotajwa katika muktadha bila kuongeza tafsiri isiyokuwamo wazi katika neno lenyewe.
- source_word: νόμον / νόμῳ
  choice: sheria
  rationale: Kurudia ‘sheria’ kunahifadhi urudiaji wa kimakusudi wa νόμος na mvutano wa kitheolojia, badala ya kuufafanua kimbele kuwa kanuni au nguvu.
- source_word: ἐν τοῖς μέλεσίν μου
  choice: katika viungo vya mwili wangu
  rationale: Hii ni Kiswahili cha kawaida kinachohifadhi picha halisi ya sehemu za mwili; ‘viungo vyangu’ peke yake kingeweza kueleweka kwa namna pana au isiyo wazi.
- source_word: ἀντιστρατευόμενον
  choice: ikipigana dhidi ya
  rationale: Kauli hii inahifadhi picha ya mapambano ya kivita huku ikibaki ya asili na inayoeleweka katika Kiswahili cha sasa.
- source_word: τοῦ νοός μου
  choice: ya akili yangu
  rationale: ‘Akili’ ni tafsiri ya moja kwa moja na ya kawaida ya νοῦς katika maana ya uwezo wa ndani wa kufikiri na kuamua.
- source_word: αἰχμαλωτίζοντά με
  choice: kunifanya mateka
  rationale: Maneno haya yanaendeleza picha ya vita na kutekwa iliyo katika Kigiriki.
- source_word: ἐν τῷ νόμῳ τῆς ἁμαρτίας
  choice: mateka wa sheria ya dhambi
  rationale: Muundo huu ni wa asili katika Kiswahili na unaeleza kuwa mtu ametekwa na kuwekwa chini ya mamlaka ya sheria hiyo, ingawa ἐν kwa umbo halisi ni ‘katika’.
- source_word: ἁμαρτίας
  choice: dhambi
  rationale: ‘Dhambi’ ni neno la kawaida, wazi, na sahihi katika muktadha huu.
theological_decisions:
- issue: Iwapo νόμος itafsiriwe ‘sheria’ au ifafanuliwe kuwa ‘kanuni/nguvu’.
  choice: Kutumia ‘sheria’ katika kila mahali katika mstari mkuu.
  alternative: Kutumia ‘kanuni’ au ‘nguvu’ katika sehemu moja au zaidi.
  rationale: Urudiaji wa neno moja unahifadhi nguvu ya usemi wa Paulo na mvutano kati ya sheria ya akili na sheria ya dhambi bila kulazimisha mapema ufafanuzi fulani wa kitheolojia.
- issue: Uhusiano unaoelezwa na ἐν katika kutekwa chini ya sheria ya dhambi.
  choice: Kutafsiri kwa Kiswahili cha asili ‘kunifanya mateka wa sheria ya dhambi’.
  alternative: 'Tafsiri ya karibu zaidi na umbo la Kigiriki: ‘kunifanya mateka katika sheria ya dhambi’.'
  rationale: ‘Mateka wa’ linaeleza wazi matokeo ya kutekwa chini ya mamlaka hiyo bila kuondoa picha ya kutekwa; tafsiri halisi zaidi imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. ‘Viungo vya mwili wangu’ kinaepuka utata wa ‘viungo vyangu’, na muundo wa kijeshi wa kupigana na kutekwa umehifadhiwa.
