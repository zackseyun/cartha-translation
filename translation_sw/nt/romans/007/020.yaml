  text: εἰ δὲ ὃ οὐ ⸀θέλω τοῦτο ποιῶ, οὐκέτι ἐγὼ κατεργάζομαι αὐτὸ ἀλλὰ ἡ οἰκοῦσα ἐν ἐμοὶ ἁμαρτία.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/020.yaml
  text: But if I do what I do not want[a], I am no longer the one doing it, but sin dwelling in me.
translation:
  language: sw
  text: Lakini ikiwa ninafanya nisichotaka[a], basi si mimi tena ninayekitenda, bali ni dhambi inayokaa ndani yangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “jambo nisilolitaka.”
    reason: Njia nyingine ya asili ya kuwasilisha muundo wa Kigiriki ὃ οὐ θέλω bila kubadili maana.
lexical_decisions:
- source_word: εἰ δὲ
  choice: Lakini ikiwa
  rationale: Inaendeleza hoja ya masharti huku ikionyesha utofautishaji mdogo kwa Kiswahili cha kawaida.
- source_word: ὃ οὐ θέλω τοῦτο ποιῶ
  choice: ninafanya nisichotaka
  rationale: Inawasilisha kwa lugha ya kawaida muundo wa kufanya jambo ambalo msemaji halitaki, bila kuongeza maelezo yasiyomo katika Kigiriki.
- source_word: οὐκέτι ἐγὼ κατεργάζομαι αὐτό
  choice: basi si mimi tena ninayekitenda
  rationale: ‘Si mimi tena’ huhifadhi mkazo wa kiwakilishi ἐγώ na οὐκέτι; ‘ninayekitenda’ ni ya asili na pia inatofautisha kwa kiasi κατεργάζομαι na ποιῶ iliyotafsiriwa ‘ninafanya.’
- source_word: ἡ οἰκοῦσα ἐν ἐμοὶ ἁμαρτία
  choice: dhambi inayokaa ndani yangu
  rationale: Huhifadhi taswira ya dhambi kama inayokaa ndani ya msemaji, bila kuibadili kuwa ‘asili ya dhambi’ au kufafanua sitiari kupita kiasi.
theological_decisions:
- issue: Kauli inaweza kueleweka kana kwamba inapunguza uwajibikaji wa Paulo au kuifanya dhambi kuwa dhana tu.
  choice: Kuhifadhi utofautishaji wa moja kwa moja kati ya ‘mimi’ na ‘dhambi inayokaa ndani yangu.’
  alternative: Kufafanua kwa maneno ya ziada jinsi nafsi na dhambi vinavyohusiana, au kutafsiri ‘dhambi’ kuwa ‘asili ya dhambi.’
  rationale: Kigiriki chenyewe kinadumisha mvutano huu na kinatumia ἁμαρτία, ‘dhambi’; tafsiri haipaswi kutatua kimadhehebu suala ambalo kifungu hakilifafanui.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Ninayekitenda’ ni fasaha bila kuwa cha kizamani, na ‘dhambi inayokaa ndani yangu’ huhifadhi taswira ya asili.
