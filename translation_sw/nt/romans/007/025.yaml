  text: ⸀χάρις τῷ θεῷ διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν. Ἄρα οὖν αὐτὸς ἐγὼ τῷ μὲν νοῒ δουλεύω νόμῳ θεοῦ, τῇ δὲ σαρκὶ νόμῳ ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/025.yaml
  text: Thanks be to God through Jesus the Messiah our Lord! So then[a], I myself serve the law of God with my mind[c][b], but with my flesh the law of sin.
translation:
  language: sw
  text: Shukrani kwa Mungu kwa njia ya Yesu Masihi[a], Bwana wetu! Basi, mimi mwenyewe, kwa akili yangu naitumikia sheria ya Mungu, lakini kwa mwili wangu[b] naitumikia sheria ya dhambi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Yesu Kristo.” Neno la Kigiriki Χριστός ni cheo chenye maana ya “Masihi.”
    reason: lexical_alternative
  - marker: b
    text: Katika muktadha huu, “mwili” unaweza kumaanisha hali ya kibinadamu iliyo chini ya nguvu ya dhambi; wengine hutafsiri “asili ya dhambi.”
    reason: lexical_alternative
  - marker: c
    text: Au “kanuni ya dhambi.”
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις τῷ θεῷ
  choice: Shukrani kwa Mungu
  rationale: Katika mshangao huu, χάρις pamoja na τῷ θεῷ ni usemi wa kutoa shukrani, si rejeo la moja kwa moja kwa neema kama sifa au kipawa.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: kwa njia ya Yesu Masihi
  rationale: διά pamoja na uhusiano wa umilikaji huonyesha njia au upatanishi; “kwa njia ya” ni Kiswahili cha kawaida na wazi. Masihi huhifadhi Χριστός kama cheo.
- source_word: Ἄρα οὖν
  choice: Basi
  rationale: Chembe hizi mbili zinaanzisha hitimisho la muhtasari. “Basi” huwasilisha nguvu hiyo kwa Kiswahili cha asili bila kurudia maneno yasiyohitajika.
- source_word: αὐτὸς ἐγώ
  choice: mimi mwenyewe
  rationale: Huhifadhi msisitizo wa Kigiriki juu ya nafsi ya msemaji.
- source_word: τῷ μὲν νοῒ ... τῇ δὲ σαρκὶ
  choice: kwa akili yangu ... kwa mwili wangu
  rationale: Muundo sambamba huhifadhi tofauti kati ya νοῦς na σάρξ na kuonyesha nyanja au chombo ambacho huduma hiyo hufanyika.
- source_word: δουλεύω
  choice: naitumikia
  rationale: Kitenzi kinaweza kumaanisha kutumikia kama mtumwa, lakini “naitumikia” ni cha asili katika sentensi hii na bado huonyesha kujitiisha kwa sheria husika.
- source_word: νόμῳ θεοῦ ... νόμῳ ἁμαρτίας
  choice: sheria ya Mungu ... sheria ya dhambi
  rationale: Kurudia “sheria” huhifadhi ulinganifu wa makusudi wa νόμος katika vifungu vyote viwili.
theological_decisions:
- issue: Maana ya σάρξ katika muktadha wenye uzito wa kimaadili
  choice: mwili
  alternative: asili ya dhambi
  rationale: Neno la Kigiriki ni σάρξ, si usemi ulio wazi unaomaanisha tabia ya dhambi. “Mwili” huhifadhi mvutano wa hoja ya Paulo bila kuingiza ufafanuzi mpana wa kiteolojia katika matini.
- issue: Maana ya νόμος katika “νόμος ἁμαρτίας”
  choice: sheria ya dhambi
  alternative: kanuni ya dhambi
  rationale: “Sheria” huhifadhi neno lilelile linalotumiwa katika “sheria ya Mungu”; “kanuni” ni ufafanuzi unaowezekana lakini ungepunguza ulinganifu wa Kigiriki.
- issue: Hadhi ya Χριστός
  choice: Masihi
  alternative: Kristo
  rationale: Katika kifungu hiki Χριστός inaweza kueleweka kama cheo. “Masihi” huonyesha maana hiyo wazi, huku njia ya jadi “Kristo” ikibaki mbadala halali.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo wa sentensi huhifadhi msisitizo wa “mimi mwenyewe,” ulinganifu wa “sheria,” na tofauti kati ya akili na mwili, huku ukitumia “kwa njia ya” na “naitumikia” kwa ufasaha wa kawaida.
