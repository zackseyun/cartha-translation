  text: ὃ γὰρ κατεργάζομαι οὐ γινώσκω· οὐ γὰρ ὃ θέλω τοῦτο πράσσω, ἀλλ’ ὃ μισῶ τοῦτο ποιῶ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/015.yaml
  text: For I do not understand what I am doing, because I do not practice what I want; instead, I do the very thing I hate.
translation:
  language: sw
  text: Kwa maana sielewi ninachofanya; kwa maana sitendi lile ninalotaka, bali ninafanya lile ninalochukia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατεργάζομαι
  choice: ninachofanya
  rationale: Katika muktadha huu kitenzi kinamaanisha kile ambacho Paulo anakitenda au kukifanya; tafsiri hii ni ya kawaida na inaendeleza uhusiano wake na vitenzi vinavyofuata.
- source_word: οὐ γινώσκω
  choice: sielewi
  rationale: Ingawa γινώσκω kwa msingi ni 'kujua', hapa ina maana ya kutoweza kuelewa au kutambua mwenendo wake mwenyewe; 'sielewi' ni Kiswahili cha asili na huhifadhi mvutano wa kauli hiyo.
- source_word: πράσσω
  choice: sitendi
  rationale: Kitenzi hiki kinaashiria kutenda au kufanya kwa vitendo; 'sitendi' kinatofautishwa kwa kiasi na ποιῶ bila kulazimisha tofauti kubwa kuliko iliyopo.
- source_word: ποιῶ
  choice: ninafanya
  rationale: Ni tafsiri ya kawaida ya ποιέω na inafaa kwa jambo lile analolichukia ambalo kwa kweli analifanya.
theological_decisions:
- issue: Utambulisho na hali ya msemaji katika Waroma 7
  choice: Kauli imeachwa katika nafsi ya kwanza bila kueleza ikiwa inamhusu Paulo kabla au baada ya kuamini, Israeli chini ya sheria, au uwakilishi mwingine.
  alternative: Kuongeza maneno yanayofafanua hali ya kiroho ya msemaji.
  rationale: Aya yenyewe haitoi ufafanuzi huo; kuamua kungeondoa mvutano wa kifungu na kuingiza msimamo wa kitheolojia.
- issue: Uhusiano wa γάρ ya pili na sentensi ya kwanza
  choice: Imetafsiriwa tena 'Kwa maana', ikidumisha kazi yake ya kutoa msingi au maelezo.
  alternative: Kutumia 'kwa sababu' na kuunganisha moja kwa moja katika sentensi moja.
  rationale: Kurudia 'Kwa maana' huhifadhi muundo wa Kigiriki na kutoruhusu tafsiri iamue kwa ukali zaidi kama kiunganishi hicho ni sababu ya moja kwa moja au ufafanuzi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi ni rahisi kueleweka lakini unahifadhi marudio, ulinganifu, na mkazo wa maandishi ya Kigiriki.
