  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἄρα οὖν ζῶντος τοῦ ἀνδρὸς μοιχαλὶς χρηματίσει ἐὰν γένηται ἀνδρὶ ἑτέρῳ· ἐὰν δὲ ἀποθάνῃ ὁ ἀνήρ, ἐλευθέρα ἐστὶν ἀπὸ τοῦ νόμου, τοῦ μὴ εἶναι αὐτὴν μοιχαλίδα γενομένην ἀνδρὶ ἑτέρῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/003.yaml
  text: So then[a], while her husband is living, she will be called an adulteress if she belongs to another man. But if the husband dies, she is free from the law[b], so that she is not an adulteress if she belongs to another man.
translation:
  language: sw
  text: Basi, mumewe akiwa hai, ataitwa mzinzi akiolewa na mwanamume mwingine.[a] Lakini mumewe akifa, yuko huru kutoka katika sheria hiyo,[b] hivi kwamba hata akiolewa na mwanamume mwingine si mzinzi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akiwa wa mwanamume mwingine” au “akiunganishwa na mwanamume mwingine.”
    reason: lexical_alternative
  - marker: b
    text: “Sheria” hapa inahusu moja kwa moja kifungo cha kisheria kinachotawala uhusiano wa ndoa.
    reason: cultural_note
lexical_decisions:
- source_word: ἄρα οὖν
  choice: Basi
  rationale: Chembe hizi mbili zinaonyesha hitimisho kutokana na mfano uliotangulia. “Basi” ni kiunganishi cha kawaida na chenye nguvu hiyo katika Kiswahili.
- source_word: ζῶντος τοῦ ἀνδρός
  choice: mumewe akiwa hai
  rationale: Muundo huu unaonyesha hali inayoendelea wakati mmoja; kiambishi “-we” kinaeleweka kutokana na muktadha wa mwanamke aliye katika ndoa.
- source_word: μοιχαλὶς
  choice: mzinzi
  rationale: Neno hili humaanisha hasa mwanamke anayefanya uzinzi. Katika Kiswahili “mzinzi” hutumika kwa jinsia zote na ni neno la moja kwa moja, la kawaida na lenye hadhi.
- source_word: χρηματίσει
  choice: ataitwa
  rationale: Hapa kitenzi kina maana ya kuitwa au kutambuliwa kwa jina fulani; wakati ujao umehifadhiwa.
- source_word: ἐὰν γένηται ἀνδρὶ ἑτέρῳ
  choice: akiolewa na mwanamume mwingine
  rationale: Muundo wa γίνομαι pamoja na dative unaonyesha kuingia katika uhusiano na mwanamume mwingine katika muktadha wa ndoa. “Akiolewa” huwasilisha maana hiyo kwa Kiswahili cha kawaida, huku tanbihi ikihifadhi namna mbadala zisizoeleza wazi ndoa.
- source_word: ἐλευθέρα ἐστὶν ἀπὸ τοῦ νόμου
  choice: yuko huru kutoka katika sheria hiyo
  rationale: Tafsiri hii huhifadhi wazo la kutokuwa tena chini ya kifungo cha sheria inayotajwa. “Hiyo” huonyesha sheria iliyotajwa katika muktadha bila kuipanua kuwa sheria yote kwa ujumla.
- source_word: τοῦ μὴ εἶναι αὐτὴν μοιχαλίδα
  choice: hivi kwamba si mzinzi
  rationale: “Hivi kwamba” huonyesha matokeo ya kuwa huru kutoka katika sheria hiyo bila kulazimisha maana ya kusudi badala ya matokeo.
- source_word: γενομένην ἀνδρὶ ἑτέρῳ
  choice: akiolewa na mwanamume mwingine
  rationale: Kirai hiki kinarudia mabadiliko yale yale ya uhusiano yaliyotajwa mapema; kurudia tafsiri ileile hudumisha uwiano wa hoja.
theological_decisions:
- issue: Upeo wa νόμος katika mfano huu
  choice: sheria hiyo
  alternative: sheria ya ndoa; Sheria kwa maana pana katika mafundisho ya Paulo
  rationale: Muktadha wa karibu unahusu kifungo cha kisheria kati ya mwanamke aliyeolewa na mume wake. “Sheria hiyo” huhifadhi neno la Paulo huku ikielekeza kwa sheria inayozungumziwa bila kuifanya moja kwa moja kuwa kauli kuhusu Sheria ya Musa kwa ujumla.
- issue: Maana ya γένηται ἀνδρὶ ἑτέρῳ
  choice: akiolewa na mwanamume mwingine
  alternative: akiwa wa mwanamume mwingine; akiunganishwa na mwanamume mwingine
  rationale: Muktadha ni wa wazi wa kisheria na wa ndoa, lakini kwa kuwa msemo wa Kigiriki wenyewe si neno la kawaida tu la “kuoa/kuolewa,” tanbihi inahifadhi upana wa usemi huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Sentensi zinahifadhi mtiririko wa hoja ya kisheria bila kuingiza istilahi za dhehebu.
