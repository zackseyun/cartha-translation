  text: οἶδα γὰρ ὅτι οὐκ οἰκεῖ ἐν ἐμοί, τοῦτ’ ἔστιν ἐν τῇ σαρκί μου, ἀγαθόν· τὸ γὰρ θέλειν παράκειταί μοι, τὸ δὲ κατεργάζεσθαι τὸ καλὸν ⸀οὔ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/018.yaml
  text: For I know that nothing good dwells in me—that is[a], in my flesh. For the willing is present with me, but the doing of the good is not.
translation:
  language: sw
  text: Kwa maana najua kwamba ndani yangu, yaani, ndani ya mwili wangu[a], halikai jambo lolote jema. Kwa maana kutaka kupo kwangu, lakini kutenda lililo jema hakupo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “asili yangu ya dhambi” badala ya “mwili wangu.”
    reason: Mbadala huu unaonyesha maana ya kimajazi inayowezekana ya σάρξ katika muktadha huu, huku maandishi makuu yakihifadhi neno halisi zaidi.
lexical_decisions:
- source_word: οἶδα
  choice: najua
  rationale: Kitenzi hiki chenye umbo la wakati timilifu kina maana ya sasa hapa; “najua” ni tafsiri ya kawaida na ya moja kwa moja.
- source_word: οἰκεῖ
  choice: halikai
  rationale: “Kukaa” huhifadhi taswira ya jambo kukaa ndani ya mtu, badala ya kuibadili kuwa kauli isiyo na taswira.
- source_word: ἀγαθόν
  choice: jambo lolote jema
  rationale: Nomino iliyodokezwa na kivumishi hiki, pamoja na ukanushi, huwasilishwa kwa Kiswahili cha kawaida kama “halikai jambo lolote jema.”
- source_word: σάρξ
  choice: mwili
  rationale: “Mwili” huhifadhi neno na mvutano wa maana wa Paulo bila kulifafanua moja kwa moja kuwa asili ya dhambi.
- source_word: θέλειν
  choice: kutaka
  rationale: Kitenzi-jina “kutaka” huakisi infinitivu yenye kiambishi cha kutambulisha na huhifadhi ulinganifu wake na “kutenda.”
- source_word: παράκειταί μοι
  choice: ninako
  rationale: “Ninako” hueleza kuwa kutaka kuko pamoja na msemaji au kunapatikana kwake, kwa Kiswahili kifupi na cha kawaida.
- source_word: κατεργάζεσθαι
  choice: kutenda
  rationale: “Kutenda” linaonyesha utekelezaji halisi na kudumisha ulinganifu wa kisarufi na “kutaka.”
- source_word: τὸ καλόν
  choice: lililo jema
  rationale: Kauli hii huonyesha jambo jema linalopaswa kutendwa bila kuongeza ufafanuzi wa kimaadili usiomo katika chanzo.
- source_word: οὔ
  choice: sina
  rationale: Ukanushi wa mwisho ni wa kidokezo katika Kigiriki. “Sina” hukamilisha wazo kwa ufupi huku ukihifadhi tofauti kati ya kuwa na kutaka na kutokuwa na kutenda.
theological_decisions:
- issue: Maana ya σάρξ katika muktadha wa kimaadili wa Paulo
  choice: mwili
  alternative: asili ya dhambi
  rationale: “Mwili” huacha usemi wa Paulo usimame na kuhifadhi uwezekano na mvutano wa maana zake, badala ya kuingiza ufafanuzi maalumu wa kiteolojia ndani ya mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima, na inaeleweka kwa wasomaji wa kawaida. Muundo sambamba wa “kutaka” na “kutenda” umehifadhiwa, pamoja na ufupi wa ukanushi wa mwisho.
