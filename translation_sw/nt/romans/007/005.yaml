  text: ὅτε γὰρ ἦμεν ἐν τῇ σαρκί, τὰ παθήματα τῶν ἁμαρτιῶν τὰ διὰ τοῦ νόμου ἐνηργεῖτο ἐν τοῖς μέλεσιν ἡμῶν εἰς τὸ καρποφορῆσαι τῷ θανάτῳ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/005.yaml
  text: For when we were in the flesh[a], the sinful passions that came through the law[c][b], were at work in our members to bear fruit for death.
translation:
  language: sw
  text: Kwa maana tulipokuwa katika mwili[a], tamaa za dhambi[b] zilikuwa zikifanya kazi kwa njia ya sheria katika viungo vyetu[c], ili kuzaa matunda ya mauti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika asili yenye dhambi” au “katika hali yetu ya kibinadamu iliyoanguka.”
    reason: alternative_reading
  - marker: b
    text: Kwa maana halisi, “tamaa za dhambi.” Neno linalotafsiriwa “tamaa” hapa linaweza kumaanisha misukumo yenye nguvu.
    reason: lexical_alternative
  - marker: c
    text: “Viungo” hapa hurejelea sehemu za mwili na, kwa upana, uwezo mbalimbali wa mtu unaoweza kutumiwa kama chombo cha kutenda.
    reason: cultural_note
lexical_decisions:
- source_word: σάρξ
  choice: mwili
  rationale: Neno hili linahifadhi taswira ya Paulo ya kuwa “katika mwili” bila kuifasiri moja kwa moja kuwa asili ya dhambi; maana yake pana katika muktadha inaelezwa katika tanbihi.
- source_word: παθήματα τῶν ἁμαρτιῶν
  choice: tamaa za dhambi
  rationale: Katika muktadha huu παθήματα ni misukumo yenye nguvu inayohusiana na dhambi, si mateso. Kiswahili “tamaa za dhambi” ni cha kawaida na kinahifadhi muundo wa Kiyunani, huku tanbihi ikionyesha maana halisi.
- source_word: διὰ τοῦ νόμου
  choice: zilizokuja kupitia sheria
  rationale: Tafsiri hii inadumisha nguvu ya kisababishi au ya njia katika διά bila kuongeza kwa hakika kwamba sheria yenyewe ‘ilichochea’ tamaa, jambo ambalo lingekuwa la kufasiri zaidi.
- source_word: ἐνηργεῖτο
  choice: zilikuwa zikitenda kazi
  rationale: Muundo huu unaonyesha tendo lililokuwa likiendelea wakati uliopita, kulingana na hali ya kitenzi cha Kiyunani.
- source_word: μέλεσιν
  choice: viungo
  rationale: “Viungo” hurejelea sehemu za mwili na inaweza pia kubeba wazo la sehemu hizo kutumiwa kama vyombo vya kutenda.
- source_word: καρποφορῆσαι
  choice: kuzaa matunda
  rationale: Inahifadhi sitiari ya kilimo na uhusiano wake na lugha ya matunda katika muktadha wa karibu.
- source_word: τῷ θανάτῳ
  choice: kwa ajili ya kifo
  rationale: Inahifadhi kwa ufupi uelekeo wa matunda hayo kwa kifo bila kuamua kimyakimya kama hali ya udative inaonyesha faida, uhusiano, au matokeo.
theological_decisions:
- issue: Iwapo ἐν τῇ σαρκί itafsiriwe kwa uwazi kama “katika mwili” au kwa kufasiri kama “katika asili ya dhambi”
  choice: katika mwili
  alternative: katika asili ya dhambi; katika hali yetu ya kibinadamu iliyoanguka
  rationale: “Katika mwili” huhifadhi msamiati na mvutano wa kitheolojia wa Paulo katika utofautishaji wa mwili na Roho. Tanbihi hutoa maana zinazowezekana bila kuifanya mojawapo kuwa tafsiri pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Sentensi inahifadhi sitiari kuu za “mwili,” viungo, na kuzaa matunda, huku ikiepuka lugha ya kimadhehebu.
