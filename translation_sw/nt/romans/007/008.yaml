  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀφορμὴν δὲ λαβοῦσα ἡ ἁμαρτία διὰ τῆς ἐντολῆς κατειργάσατο ἐν ἐμοὶ πᾶσαν ἐπιθυμίαν, χωρὶς γὰρ νόμου ἁμαρτία νεκρά.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/008.yaml
  text: But sin[a], seizing an opportunity through the commandment, produced in me every kind of coveting. For apart from the law[b], sin is dead.
translation:
  language: sw
  text: 'Lakini dhambi, baada ya kuchukua fursa[a] kupitia amri hiyo, ilitokeza ndani yangu kila aina ya tamaa[b]. Kwa maana bila sheria, dhambi imekufa.


    [a] Au “nafasi.”


    [b] Au “kila namna ya kutamani”; katika muktadha huu ni kutamani kilicho cha mwingine.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nafasi.”
    reason: lexical_alternative
  - marker: b
    text: Au “kila namna ya kutamani”; katika muktadha huu ni kutamani kilicho cha mwingine.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφορμήν
  choice: fursa
  rationale: “Fursa” huonyesha nafasi ambayo dhambi iliitumia kwa manufaa yake na kuhifadhi picha ya dhambi kama nguvu inayotenda.
- source_word: λαβοῦσα
  choice: baada ya kupata
  rationale: Muundo huu unaonyesha kwamba tendo la kupata fursa lilitangulia tendo kuu la kutokeza tamaa, kama inavyoelekezwa na kitenzi-shirikishi cha aoristi.
- source_word: ἡ ἁμαρτία
  choice: dhambi
  rationale: “Dhambi” inabaki kuwa kiima kinachotenda, hivyo uhuishaji wa dhambi katika Kigiriki unahifadhiwa.
- source_word: διὰ τῆς ἐντολῆς
  choice: kupitia amri hiyo
  rationale: “Kupitia” huhifadhi wazo la amri kuwa njia ambayo dhambi iliitumia; “hiyo” huonyesha amri mahususi iliyotajwa katika muktadha wa karibu.
- source_word: κατειργάσατο
  choice: ilitokeza
  rationale: Kitenzi hiki huonyesha kusababisha matokeo; “ilitokeza” ni Kiswahili cha kawaida na chenye nguvu inayofaa.
- source_word: πᾶσαν ἐπιθυμίαν
  choice: kila aina ya tamaa
  rationale: “Kila aina” huwasilisha nguvu ya πᾶσαν kwa njia ya kawaida, huku “tamaa” ikiruhusu maana ya hamu kwa ujumla na, katika muktadha huu, kutamani kilicho cha mwingine.
- source_word: χωρὶς γὰρ νόμου
  choice: Kwa maana bila sheria
  rationale: “Kwa maana” huonyesha kazi ya ufafanuzi ya γάρ, na “bila sheria” ni usemi wa kawaida unaobaki karibu na Kigiriki.
- source_word: νεκρά
  choice: imekufa
  rationale: Tafsiri hii inahifadhi tamathali kali ya kifo badala ya kuifasiri kuwa kutotenda tu.
theological_decisions:
- issue: Iwapo uhuishaji wa dhambi na tamathali ya kuwa ‘imekufa’ zipunguzwe au zifafanuliwe kiufasiri
  choice: Kudumisha dhambi kama mtendaji na kusema “dhambi imekufa.”
  alternative: Kutafsiri dhambi kama dhana isiyotenda au kusema “dhambi haitendi.”
  rationale: Kigiriki huiwasilisha dhambi kama nguvu inayotenda na hutumia lugha ya kifo; kuhifadhi picha hizo hakutatui kimya-kimya mvutano wa kitheolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inadumisha uhuishaji wa dhambi bila kuwa nzito kupita kiasi. Alama za tanbihi zimewekwa kwenye maneno yanayohusika moja kwa moja, kwa kuwa mpangilio wa alama katika safu ya mashauriano ya Kiingereza haukulingana na maelezo yake.
