  source_fidelity: 'Tafsiri inafuata Kigiriki kwa uaminifu: nafsi ya kwanza na msisitizo wake wa kiasi (‘Mimi’), hali ya zamani (‘hapo zamani’), kutenganishwa na sheria (‘bila sheria’), muundo wa wakati wa genitive absolute (‘amri ilipokuja’), na dhambi iliyohuishwa (‘ikawa hai tena’) vyote vimehifadhiwa. ‘Tena’ hutoa vizuri kiambishi ἀνα- katika ἀνέζησεν bila kuongeza tafsiri ya kiitikadi.'
