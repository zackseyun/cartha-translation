  text: ἐγὼ δὲ ἔζων χωρὶς νόμου ποτέ· ἐλθούσης δὲ τῆς ἐντολῆς ἡ ἁμαρτία ἀνέζησεν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/009.yaml
  text: I was once alive apart from the law[a], but when the commandment came, sin came to life,
translation:
  language: sw
  text: Mimi hapo zamani nilikuwa hai bila sheria; lakini amri ilipokuja, dhambi ikawa hai tena[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “dhambi ilifufuka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔζων
  choice: nilikuwa hai
  rationale: Imetafsiriwa kwa maana ya hali ya kuwa hai, si ‘niliishi’ tu, ili kudumisha utofautishaji wa uhai na kifo katika muktadha.
- source_word: χωρὶς νόμου
  choice: bila sheria
  rationale: Kauli hii ya kawaida ya Kiswahili inahifadhi maana ya kutengwa na sheria; ‘sheria’ hapa yaweza kurejelea Sheria ya Musa bila kuongeza ufafanuzi ndani ya aya.
- source_word: ποτέ
  choice: hapo zamani
  rationale: Inaonyesha wakati uliopita kwa lugha ya asili na inayoeleweka.
- source_word: ἐλθούσης ... τῆς ἐντολῆς
  choice: amri ilipokuja
  rationale: Muundo wa wakati umetolewa kwa Kiswahili cha kawaida huku ukihifadhi taswira ya kuja kwa amri.
- source_word: ἐντολῆς
  choice: amri
  rationale: Ni neno la kawaida na lenye hadhi linalotofautishwa kwa urahisi na ‘sheria’ katika sentensi hiyo.
- source_word: ἁμαρτία
  choice: dhambi
  rationale: Umoja umehifadhiwa kwa sababu dhambi imewasilishwa kana kwamba ni mtendaji.
- source_word: ἀνέζησεν
  choice: ikawa hai tena
  rationale: Inahifadhi wazo la ἀναζάω la kuingia tena katika hali ya uhai na taswira ya dhambi iliyohuishwa; tanbihi inadokeza tafsiri mbadala yenye nguvu zaidi.
theological_decisions:
- issue: Iwapo kauli ya Paulo ifafanuliwe kuwa habari ya maisha yake mwenyewe, uwakilishi wa Israeli au wa wanadamu kwa jumla
  choice: Nafsi ya kwanza imehifadhiwa bila ufafanuzi wa ziada.
  alternative: Kuitaja wazi kuwa habari ya Paulo binafsi, Israeli, au wanadamu wote.
  rationale: Aya yenyewe haisuluhishi swali hilo la kiufafanuzi, hivyo tafsiri inadumisha utata uliopo katika Kigiriki.
- issue: Taswira ya dhambi kuwa hai tena
  choice: dhambi ikawa hai tena
  alternative: dhambi ilifufuka
  rationale: Chaguo kuu linadumisha uhuishaji wa dhambi bila kulazimisha msamiati wa ufufuo wa wafu; chaguo jingine limewekwa tanbihini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi na inayoeleweka kwa msomaji wa kawaida. Alama ya tanbihi imewekwa baada ya kishazi kinachohusika, yaani tafsiri ya ἀνέζησεν.
