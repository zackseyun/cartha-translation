  text: and I died[b][a], and the commandment that was for life proved to be for death to me.
translation:
  language: sw
  text: Lakini mimi nikafa, na amri hii iliyokuwa kwa ajili ya uzima[a] ikabainika kwangu kuwa kwa ajili ya mauti.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “iliyokusudiwa kuleta uzima.”
    reason: lexical_alternative
  - marker: b
    text: Au, “amri hii yenyewe ikabainika kuwa ya mauti kwangu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέθανον
  choice: nikafa
  rationale: Kitenzi cha wakati uliopita kinaeleza tukio moja kwa kauli ya moja kwa moja; ‘nikafa’ ni Kiswahili cha kawaida na hakiongezi wazo la mchakato.
- source_word: εὑρέθη μοι
  choice: ikabainika kwangu kuwa
  rationale: Muundo huu unaonyesha jambo lililogunduliwa au matokeo yaliyodhihirika katika uzoefu wa msemaji, bila tafsiri ngumu ya neno kwa neno.
- source_word: ἐντολή
  choice: amri
  rationale: ‘Amri’ ni istilahi ya kawaida na sahihi kwa nomino hii ya umoja, bila kuongeza maneno yasiyopo kama ‘ya sheria.’
- source_word: ἡ εἰς ζωὴν
  choice: iliyokuwa kwa ajili ya uzima
  rationale: ‘Kwa ajili ya uzima’ huhifadhi mwelekeo au matokeo yanayoweza kudokezwa na εἰς na pia huandaa ulinganifu na ‘kwa ajili ya mauti.’
- source_word: αὕτη
  choice: ile amri
  rationale: Kiwakilishi cha kuonyesha kinawakilishwa kwa ‘ile,’ ambacho hurejelea amri iliyotajwa huku kikibaki cha asili katika Kiswahili.
- source_word: εἰς θάνατον
  choice: kwa ajili ya mauti
  rationale: Tafsiri hii huhifadhi ulinganifu wa kimakusudi kati ya εἰς ζωήν na εἰς θάνατον na haielezi kupita kiasi namna amri ilivyohusiana na mauti.
theological_decisions:
- issue: Iwapo kutaja wazi kwamba amri ilisababisha au ilileta mauti
  choice: ikabainika kwangu kuwa kwa ajili ya mauti
  alternative: ikaniletea mauti
  rationale: Kauli iliyochaguliwa huhifadhi mvutano wa kifungu na matokeo yaliyodhihirika kwa msemaji, bila kuamua kwa maneno ya ziada aina kamili ya usababisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Mauti’ limetumiwa badala ya ‘kifo’ ili kudumisha ulinganifu wa kifasihi na wa kidhana na ‘uzima,’ huku sentensi ikibaki wazi kwa msomaji wa kawaida.
