  yaml_path: translation/nt/romans/007/016.yaml
  text: But if I do what I do not want, I agree with the law that it is good.
translation:
  language: sw
  text: Lakini ikiwa ninafanya nisichotaka, ninakubaliana na sheria kwamba ni njema.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ δὲ
  choice: Lakini ikiwa
  rationale: Inahifadhi hali ya sharti ya εἰ na maana ya upinzani mpole ya δέ kwa Kiswahili cha kawaida.
- source_word: ὃ … τοῦτο
  choice: nisichotaka
  rationale: Muundo huu wa Kigiriki umeelezwa kwa njia ya kawaida katika Kiswahili bila kupoteza uhusiano kati ya jambo lisilotakiwa na tendo linalofanywa.
- source_word: θέλω
  choice: nataka
  rationale: Neno hili linaeleza wazi tamaa au nia ya ndani inayopingana na tendo.
- source_word: ποιῶ
  choice: ninafanya
  rationale: Wakati wa sasa unaendelezwa kwa kitenzi rahisi na cha kawaida kinachoakisi ποιῶ.
- source_word: σύμφημι
  choice: ninakubaliana na
  rationale: Kifungu hiki kinaonyesha kukiri au kuafiki hukumu ya sheria; muundo huu pia unaendana kwa kawaida na τῷ νόμῳ.
- source_word: τῷ νόμῳ
  choice: sheria
  rationale: Muktadha wa Waroma unaonyesha sheria inayojulikana, bila kulazimisha jina la kipekee au ufafanuzi wa ziada.
- source_word: καλός
  choice: njema
  rationale: ‘Njema’ ni tafsiri ya moja kwa moja inayoonyesha sifa chanya ya kimaadili ya sheria bila kuongeza maana.
theological_decisions:
- issue: Ikiwa kauli ya Paulo inaithibitisha sheria yenyewe kuwa njema
  choice: kwamba ni njema
  alternative: kwamba sheria ni sahihi
  rationale: Tafsiri inahifadhi uthibitisho wa wazi wa uzuri wa sheria na mvutano wa hoja ya Paulo bila kuupanua au kuutatua kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na kinachoeleweka kwa urahisi. Muundo unabaki karibu na sentensi ya Kigiriki huku ukisomeka kwa kawaida.
