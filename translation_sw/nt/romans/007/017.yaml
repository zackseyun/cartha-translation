    reason: Mpangilio mwingine wa maneno unaowezekana unaodumisha msisitizo wa “mimi” katika Kigiriki.
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: Lakini sasa
  rationale: Inaonyesha mpito wenye tofauti na hoja iliyotangulia, huku ikidumisha maana ya wakati na mantiki.
- source_word: οὐκέτι ἐγὼ
  choice: si mimi tena
  rationale: Mpangilio huu wa kawaida wa Kiswahili unadumisha msisitizo wa kiwakilishi ἐγώ na maana ya οὐκέτι, bila kupunguza utofautishaji anaoufanya Paulo.
- source_word: κατεργάζομαι
  choice: ninayelitenda
  rationale: Katika muktadha huu kitenzi kinahusu kutekeleza tendo lililotajwa. “Kutenda” ni cha kawaida lakini chenye uzito unaofaa katika Kiswahili.
- source_word: αὐτό
  choice: jambo hilo
  rationale: Kigiriki kinaelekeza nyuma kwenye tendo lililotajwa. “Jambo hilo” huonyesha rejeo hilo kwa uwazi na kwa Kiswahili cha kawaida.
- source_word: ἡ οἰκοῦσα ἐν ἐμοὶ ἁμαρτία
  choice: dhambi inayokaa ndani yangu
  rationale: Inadumisha taswira ya dhambi kama inayokaa ndani ya mtu na muundo wa kishiriki wa Kigiriki, bila kuongeza ufafanuzi wa kitheolojia.
theological_decisions:
- issue: Utofautishaji mkali kati ya “mimi” na “dhambi inayokaa ndani yangu” unaweza kueleweka kana kwamba msemaji anakwepa wajibu.
  choice: Kudumisha utofautishaji huo wazi kama ulivyo katika Kigiriki.
  alternative: Kufafanua kwa maneno ya ziada kuwa ni pambano la ndani au kusisitiza wajibu wa msemaji.
  rationale: Aya yenyewe inaacha mvutano huu bila kuutatua; tafsiri haipaswi kuingiza ufafanuzi wa kimadhehebu wala kulainisha kauli ya Paulo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Kutenda” na “kukaa ndani” vinaeleweka kwa urahisi huku vikidumisha uzito na taswira ya maandishi ya Kigiriki.
