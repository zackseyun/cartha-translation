lexical_decisions:
- source_word: καὶ
  choice: wala
  rationale: Katika mfululizo huu wa mashtaka, “wala” ni kiunganishi cha kawaida cha Kiswahili kinachoendeleza wazo hasi kutoka muktadha uliotangulia.
- source_word: ὁδὸν
  choice: njia
  rationale: “Njia” huhifadhi taswira ya barabara au mapito na pia maana ya kimethali ya mwenendo au namna ya kuishi.
- source_word: εἰρήνης
  choice: amani
  rationale: “Amani” ndilo neno la kawaida na lililo wazi kwa εἰρήνη; hapa linaonyesha njia yenye sifa ya amani au inayoelekea kwenye amani.
- source_word: ἔγνωσαν
  choice: hawakuijua
  rationale: Wakati uliopita wa Kiswahili unawakilisha kwa kawaida aoristi ya Kigiriki katika kauli hii, huku kiambishi cha yambwa “-i-” kikirejelea “njia.”
