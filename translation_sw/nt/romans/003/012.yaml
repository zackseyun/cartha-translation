  yaml_path: translation/nt/romans/003/012.yaml
  text: All have turned aside[a]; together they have become worthless. There is no one who does what is good[b]; there is not even one.
translation:
  language: sw
  text: Wote wamepotoka; kwa pamoja wamekuwa wasio na manufaa[a]. Hakuna mtu atendaye mema[b]; hakuna hata mmoja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wamekuwa wasiofaa kutumika” / “wameharibika.”
    reason: lexical_alternative
  - marker: b
    text: Au, “atendaye wema”; neno la Kigiriki χρηστότητα pia linaweza kuwa na maana ya “fadhili.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες
  choice: Wote
  rationale: Inahifadhi maana ya jumla ya wingi bila kuongeza nomino isiyokuwapo katika Kigiriki.
- source_word: ἐξέκλιναν
  choice: wamepotoka
  rationale: Ni usemi wa kawaida unaoonyesha kuiacha njia iliyo sawa kimaadili na kuhifadhi hali ya tendo lililokwisha kutokea.
- source_word: ἅμα
  choice: kwa pamoja
  rationale: Inaonyesha hali ya pamoja inayowahusu wote, badala ya kueleweka tu kuwa mambo yalitokea kwa wakati mmoja.
- source_word: ἠχρεώθησαν
  choice: wamekuwa wasiofaa
  rationale: Inahifadhi hali ya matokeo na tathmini kali ya neno la Kigiriki, ambalo linaweza pia kumaanisha kutokuwa na manufaa au kuharibika.
- source_word: ποιῶν
  choice: atendaye
  rationale: Muundo huu wa Kiswahili unawasilisha kwa ufupi tendo la kawaida au linalomtambulisha mtu anayezungumziwa.
- source_word: χρηστότητα
  choice: mema
  rationale: Ni tafsiri ya asili katika muktadha wa maadili; neno la Kigiriki linaweza pia kumaanisha wema au fadhili.
- source_word: οὐκ ἔστιν
  choice: Hakuna mtu
  rationale: Ni Kiswahili cha sasa na cha wazi kinachohifadhi ukanushaji wenye mkazo, huku ‘mtu’ ikiwa mhusika anayedokezwa na muktadha.
- source_word: ἕως ἑνός
  choice: hakuna hata mmoja
  rationale: Inawasilisha kwa Kiswahili sanifu hitimisho la msisitizo kwamba hakuna isipokuwa hata mtu mmoja.
