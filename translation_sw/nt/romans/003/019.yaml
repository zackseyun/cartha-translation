  text: Οἴδαμεν δὲ ὅτι ὅσα ὁ νόμος λέγει τοῖς ἐν τῷ νόμῳ λαλεῖ, ἵνα πᾶν στόμα φραγῇ καὶ ὑπόδικος γένηται πᾶς ὁ κόσμος τῷ θεῷ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/019.yaml
  text: We know that whatever the law says[a], it speaks to those under the law[c][b], so that every mouth may be stopped and the whole world may become accountable to God.
translation:
  language: sw
  text: Tunajua kwamba yote ambayo Sheria inasema, inayasema kwa wale walio chini ya Sheria[a], ili kila kinywa kifungwe[b] na ulimwengu wote uwajibike kwa Mungu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya karibu zaidi, “walio katika Sheria.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kinyamazishwe.”
    reason: lexical_alternative
  - marker: c
    text: Au, “ulimwengu wote uwe chini ya hukumu ya Mungu,” “uwe wa kujibu mbele za Mungu,” au “upatikane na hatia mbele za Mungu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἴδαμεν δὲ
  choice: Tunajua kwamba
  rationale: “Tunajua” huonyesha hali ya sasa ya kujua kwa pamoja. δέ halijatafsiriwa kwa kiunganishi kizito, kwa kuwa hapa lina nguvu ndogo ya kuendeleza hoja na Kiswahili cha muktadha hakihitaji “lakini” wala neno la wakati.
- source_word: ὅσα ὁ νόμος λέγει
  choice: yote ambayo Sheria inasema
  rationale: Huhifadhi upana wa ὅσα na kuonyesha Sheria kama mamlaka inayotambulika, bila kuongeza ufafanuzi usiotajwa katika Kigiriki.
- source_word: τοῖς ἐν τῷ νόμῳ
  choice: kwa wale walio chini ya Sheria
  rationale: Ingawa muundo wa karibu zaidi ni “walio katika Sheria,” “walio chini ya Sheria” ni Kiswahili cha kawaida kinachoonyesha walio ndani ya mamlaka au eneo la utawala wake.
- source_word: λαλεῖ
  choice: inayasema
  rationale: Kitenzi hiki kinarejelea “yote” yaliyotangulia na kinaendelea kuhifadhi taswira ya Sheria inayosema; Kiswahili hakihitaji kulazimisha tofauti ya kimtindo kati ya λέγει na λαλεῖ.
- source_word: ἵνα πᾶν στόμα φραγῇ
  choice: ili kila kinywa kifungwe
  rationale: “Ili” huhifadhi kusudi la ἵνα, na “kila kinywa kifungwe” huhifadhi sitiari halisi ya kunyamazishwa katika mazingira ya hukumu.
- source_word: ὑπόδικος γένηται πᾶς ὁ κόσμος τῷ θεῷ
  choice: ulimwengu wote uwe chini ya hukumu ya Mungu
  rationale: Huhifadhi upeo wa wanadamu wote na nguvu ya kisheria ya ὑπόδικος. “Uwe” linaonyesha kuingia au kuwekwa katika hali hiyo bila kudai wazi hukumu ya mwisho ya kuwa na hatia.
theological_decisions:
- issue: Nguvu ya kisheria ya ὑπόδικος mbele za Mungu
  choice: ulimwengu wote uwe chini ya hukumu ya Mungu
  alternative: ulimwengu wote uwajibike kwa Mungu; ulimwengu wote upatikane na hatia mbele za Mungu
  rationale: Chaguo hili linaonyesha kwamba ulimwengu wote uko chini ya baraza la hukumu la Mungu. Halipunguzi wazo hilo kuwa uwajibikaji wa kawaida tu, wala haliongezi bila lazima tamko lililokamilika la kupatikana na hatia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Sheria” imeandikwa kwa herufi kubwa kuonyesha rejeo maalumu kwa Sheria katika hoja ya Paulo. Sentensi imehifadhi taswira ya kinywa kufungwa na mazingira ya kisheria, huku tanbihi zikihifadhi maana mbadala halisi za vifungu vyenye utata.
