id: ROM.3.1
reference: Romans 3:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Τί οὖν τὸ περισσὸν τοῦ Ἰουδαίου, ἢ τίς ἡ ὠφέλεια τῆς περιτομῆς;
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/001.yaml
  text: What then is the advantage of the Jew? Or what is the benefit of circumcision?[a][b]
translation:
  language: sw
  text: Basi, Myahudi ana faida gani? Au tohara ina manufaa gani?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Tohara ina thamani gani?”
    reason: lexical_alternative
  - marker: b
    text: Neno “Myahudi” hapa limetumiwa kwa umoja kumwakilisha mtu yeyote wa jamii ya Kiyahudi.
    reason: cultural_note
lexical_decisions:
- source_word: Τί οὖν
  choice: Basi, ... gani?
  rationale: “Basi” linaendeleza hitimisho la hoja iliyotangulia, huku muundo wa swali ukihifadhi swali la balagha la Paulo kwa Kiswahili cha kawaida.
- source_word: τὸ περισσὸν
  choice: faida
  rationale: Katika muktadha huu neno hilo linauliza jambo la pekee au lenye kumpa mtu nafasi yenye manufaa; “faida” ni wazi bila kudokeza ubora wa kikabila.
- source_word: τοῦ Ἰουδαίου
  choice: Myahudi ana
  rationale: Umoja umetumiwa kwa maana ya mwakilishi wa kundi zima. Muundo wa “Myahudi ana faida gani?” ni wa asili katika Kiswahili na unahifadhi umoja huo.
- source_word: ἢ τίς
  choice: Au ... gani?
  rationale: Linahifadhi ulinganifu wa swali la pili na la kwanza kwa lugha rahisi na ya kawaida.
- source_word: ἡ ὠφέλεια
  choice: manufaa
  rationale: “Manufaa” linaonyesha kile kinachofaidisha au kusaidia, na pia linadumisha tofauti ndogo ya msamiati na “faida” iliyotumika kwa περισσόν.
- source_word: τῆς περιτομῆς
  choice: tohara
  rationale: Ni istilahi ya kawaida ya Kiswahili kwa tendo hilo na hapa inarejelea tohara kama alama ya utambulisho wa agano.
theological_decisions:
- issue: Iwapo Ἰουδαίου itafsiriwe kwa umoja wa jumla au kwa wingi
  choice: Myahudi
  alternative: Wayahudi / mtu wa Kiyahudi
  rationale: Paulo ametumia nomino ya umoja inayowakilisha kundi. Kutumia “Myahudi” kunahifadhi mtindo huo wa hoja bila kuubadili kuwa kauli ya wingi au ufafanuzi mpana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Maswali mawili ya balagha na tofauti ndogo kati ya περισσόν na ὠφέλεια zimehifadhiwa.
