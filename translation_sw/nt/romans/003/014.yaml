  register: Kiswahili Sanifu cha Afrika Mashariki; tafsiri ni ya asili, wazi, na yenye hadhi. Wingi “vinywa vyao” umetumiwa kwa upatanisho wa kawaida wa Kiswahili huku umoja wa kijumla wa Kigiriki ukihifadhiwa kimaana.
