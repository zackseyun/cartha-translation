  text: whose mouth is full of cursing and bitterness.
translation:
  language: sw
  text: ambao vinywa vyao vimejaa laana na uchungu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὧν
  choice: ambao ... vyao
  rationale: Kiwakilishi rejeshi cha umilikina kinarejelea watu waliotajwa katika muktadha uliotangulia; muundo huu ni wa asili katika Kiswahili.
- source_word: τὸ στόμα
  choice: vinywa
  rationale: Ingawa Kigiriki kina umoja wa kijumla, Kiswahili hutumia wingi kwa kawaida inapozungumzia vinywa vya watu wengi; maana ya kijumla imehifadhiwa.
- source_word: ἀρᾶς
  choice: laana
  rationale: Neno hili humaanisha laana au usemi wa kulaani; “laana” ni fasiri fupi na ya kawaida inayofaa katika muundo “vimejaa.”
- source_word: πικρίας
  choice: uchungu
  rationale: “Uchungu” huhifadhi maana ya msingi ya πικρία na nguvu yake ya kimaadili bila kuibana kuwa hisia pekee au maneno makali pekee.
- source_word: γέμει
  choice: vimejaa
  rationale: Huwasilisha hali ya sasa ya kujaa kwa lugha ya kawaida na yenye hadhi.
theological_decisions: []
