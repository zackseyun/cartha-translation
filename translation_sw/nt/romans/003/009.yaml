  text: Τί οὖν; προεχόμεθα; οὐ πάντως, προῃτιασάμεθα γὰρ Ἰουδαίους τε καὶ Ἕλληνας πάντας ὑφ’ ἁμαρτίαν εἶναι,
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/009.yaml
  text: What then? Are we better? Not at all[a], for we have already charged that both Jews and Greeks are all under sin[b],
translation:
  language: sw
  text: Basi, je, sisi ni bora? La, hata kidogo[a], kwa maana tumekwisha kuwashtaki Wayahudi na Wayunani kwamba wote wako chini ya dhambi[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Je, tuna faida yoyote?”
    reason: alternative_reading
  - marker: b
    text: Au, “wote wako chini ya nguvu za dhambi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί οὖν
  choice: Basi, je?
  rationale: Kauli hii fupi inadumisha kiunganishi cha kimantiki οὖν na mtindo wa Paulo wa kuuliza swali katika hoja yake bila kuongeza maelezo yasiyo katika Kigiriki.
- source_word: προεχόμεθα
  choice: Sisi ni bora zaidi?
  rationale: Kitenzi hiki cha kati kina maana inayobishaniwa. Tafsiri hii ya kawaida inauliza kama Wayahudi wana nafasi bora kuliko wengine, huku maana ya kuwa na faida ikihifadhiwa katika tanbihi.
- source_word: οὐ πάντως
  choice: La, hata kidogo
  rationale: Hii ni njia ya asili na yenye mkazo ya kukataa kabisa katika Kiswahili cha sasa.
- source_word: προῃτιασάμεθα
  choice: tumekwisha kuwashtaki
  rationale: Kitenzi kinamaanisha kutoa shtaka hapo awali. ‘Kuwashtaki’ inadumisha ladha ya kimahakama ya hoja ya Paulo, na ‘tumekwisha’ huonyesha kitendo kilichotangulia.
- source_word: Ἰουδαίους τε καὶ Ἕλληνας
  choice: Wayahudi na Wayunani
  rationale: Hii inadumisha jozi ya makundi iliyo katika matini ya Kigiriki na istilahi ya kawaida ya kibiblia ‘Wayunani.’
- source_word: πάντας
  choice: wote
  rationale: Neno hili linaonyesha ujumla wa Wayahudi na Wayunani bila kuongeza maelezo.
- source_word: ὑφ’ ἁμαρτίαν εἶναι
  choice: wako chini ya dhambi
  rationale: Tafsiri hii ya karibu inadumisha sitiari ya kuwa chini ya utawala au hali ya kutiishwa, bila kufafanua kimyakimya namna dhambi inavyotawala.
theological_decisions:
- issue: Maana ya nafsi ya kwanza wingi katika προεχόμεθα
  choice: 'Swali limeelezwa kama dai la kuwa bora: ‘Sisi ni bora zaidi?’'
  alternative: ‘Je, tuna faida yoyote?’
  rationale: Muktadha wa Waroma 3:1–9 unahusu faida, uwajibikaji, na uwezekano wa Wayahudi kujiona bora. Matini kuu inadumisha swali la ulinganisho wa hali, na tanbihi inahifadhi uwezekano halali wa maana ya ‘faida.’
- issue: Maana ya kuwa ‘chini ya dhambi’
  choice: wako chini ya dhambi
  alternative: wako chini ya nguvu za dhambi
  rationale: Kauli fupi inadumisha sitiari yenye uzito ya Paulo na haiamui zaidi ya matini kama msisitizo ni mamlaka, nguvu, au hali ya kuwajibika kwa dhambi. Tanbihi inatoa ufafanuzi unaowezekana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni mfupi ili kudumisha mwendo wa hoja ya Paulo. ‘Wayunani’ limetumiwa badala ya kulipanua kuwa ‘watu wa mataifa’ kwa sababu matini ya Kigiriki inawataja Ἕλληνας moja kwa moja. Alama zote za tanbihi zimewekwa katika matini kuu.
