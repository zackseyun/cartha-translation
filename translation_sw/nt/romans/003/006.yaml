  text: μὴ γένοιτο· ἐπεὶ πῶς κρινεῖ ὁ θεὸς τὸν κόσμον;
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/006.yaml
  text: Absolutely not! Otherwise[a], how will God judge the world?
translation:
  language: sw
  text: La hasha! Kama sivyo, Mungu atauhukumu ulimwengu jinsi gani?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ γένοιτο
  choice: La hasha!
  rationale: Hii ni kauli ya mkazo inayokataa kabisa hitimisho lililotangulia. “La hasha!” ni nahau ya Kiswahili iliyo wazi, yenye heshima, na inayohifadhi nguvu ya usemi wa Paulo bila kuigeuza kuwa ombi halisi.
- source_word: ἐπεὶ
  choice: Kama sivyo
  rationale: Katika hoja hii, neno hilo linaonyesha matokeo ya kukubali dai lililokataliwa. “Kama sivyo” linaunganisha vizuri kauli ya kukataa na swali la balagha linalofuata.
- source_word: κρινεῖ
  choice: atauhukumu ... jinsi gani?
  rationale: Kitenzi cha Kigiriki kiko katika wakati ujao wa taarifa. “Atauhukumu” kinahifadhi wakati huo, na “jinsi gani?” kinawakilisha πῶς bila kuongeza wazo la kutowezekana.
- source_word: τὸν κόσμον
  choice: ulimwengu
  rationale: Hapa κόσμος ni ulimwengu kama kitu cha hukumu ya Mungu; “ulimwengu” ndiyo tafsiri ya kawaida na pana katika Kiswahili.
theological_decisions:
- issue: Nguvu ya kauli ya Paulo μὴ γένοιτο
  choice: Kukataliwa kwa nguvu kwa hitimisho lililotangulia, kwa kutumia nahau “La hasha!”
  alternative: “Isiwe hivyo kamwe!”
  rationale: Nahau iliyochaguliwa inahifadhi nguvu ya kukataa bila kufanya muundo wa Kigiriki uonekane kama ombi halisi au kuingiza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni fupi na ya asili; swali la balagha na mvutano wa hoja ya Kigiriki vimehifadhiwa.
