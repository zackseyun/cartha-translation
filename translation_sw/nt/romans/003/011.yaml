  yaml_path: translation/nt/romans/003/011.yaml
  text: There is no one who understands[a]; there is no one who seeks God.
translation:
  language: sw
  text: Hakuna anayeelewa; hakuna anayemtafuta Mungu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “anayemtafuta Mungu kwa bidii” au “anayejitahidi kumtafuta Mungu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: συνίων
  choice: anayeelewa
  rationale: Kitenzi hiki kinaonyesha kuelewa au kuwa na ufahamu. ‘Anayeelewa’ ni Kiswahili cha kawaida, cha sasa, na kinahifadhi maana bila kutumia lugha ya kitaalamu.
- source_word: ἐκζητῶν
  choice: anayemtafuta
  rationale: Kitenzi ambatano kinaweza kuwa na mkazo wa kutafuta kwa bidii au kwa makusudi. ‘Anayemtafuta Mungu’ ni usemi wa asili katika Kiswahili; uwezekano wa mkazo zaidi umewekwa katika tanbihi.
- source_word: οὐκ ἔστιν
  choice: Hakuna
  rationale: ‘Hakuna’ huwasilisha kwa kawaida na kwa nguvu ukanushaji wa jumla uliopo katika Kigiriki.
- source_word: ὁ συνίων / ὁ ἐκζητῶν
  choice: anayeelewa / anayemtafuta
  rationale: Vivumishi-jina vya Kigiriki vimetafsiriwa kwa vishazi vya uhusiano, ambavyo ni vya kawaida na wazi katika Kiswahili.
- source_word: τὸν θεόν
  choice: Mungu
  rationale: ‘Mungu’ ni namna ya kawaida ya kumrejelea Mungu katika muktadha huu na inahifadhi rejeo la Kigiriki.
theological_decisions:
- issue: Upeo wa ukanushaji katika mfululizo wa nukuu wa Paulo
  choice: Kurudia kauli kamili ‘Hakuna...; hakuna...’ bila kuilegeza
  alternative: Hakuna anayeelewa kweli; hakuna anayemtafuta Mungu kwa kweli
  rationale: Kigiriki kinatoa ukanushaji wa moja kwa moja na wa jumla; tafsiri haipaswi kuongeza vielezi vinavyofasiri au kupunguza nguvu yake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni fupi, ya heshima, ya sasa, na inayoeleweka kwa wasomaji wa kawaida. Muundo sambamba wa Kigiriki umehifadhiwa.
