  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ποῦ οὖν ἡ καύχησις; ἐξεκλείσθη. διὰ ποίου νόμου; τῶν ἔργων; οὐχί, ἀλλὰ διὰ νόμου πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/027.yaml
  text: Where, then, is boasting? It has been excluded. Through what kind of law? A law of works? No, but through a law of faith.
translation:
  language: sw
  text: Basi, kujisifu kuko wapi? Kumezuiwa. Kwa sheria ya aina gani? Ya matendo? Hapana, bali kwa sheria ya imani.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καύχησις
  choice: kujisifu
  rationale: Nomino hii hapa ina maana ya kujivunia au kujisifu mbele za Mungu; kitenzi-nomino cha Kiswahili ni cha kawaida na kinaeleweka wazi.
- source_word: ἐξεκλείσθη
  choice: kumeondolewa
  rationale: Huwasilisha hali ya kujisifu kuwa imeondolewa au kufungiwa nje, bila kuongeza mhusika ambaye Kigiriki hakumtaji.
- source_word: νόμος
  choice: sheria
  rationale: Hudumisha urudiaji wa neno moja katika maswali na jibu, pamoja na uwezekano wake wa kumaanisha kanuni au msingi unaotawala katika muktadha.
- source_word: ἔργων
  choice: matendo
  rationale: Ni ulinganifu wa kawaida wa Pauline kwa ἔργα na hudumisha tofauti iliyowekwa dhidi ya imani.
- source_word: πίστεως
  choice: imani
  rationale: Huhifadhi nomino ya Kigiriki na mvutano wake wa kitheolojia bila kuibadili kuwa ufafanuzi mpana.
- source_word: διά + genitive
  choice: kwa
  rationale: Katika Kiswahili, “kwa” huwasilisha kwa kawaida njia au msingi unaotajwa hapa, huku ikisomeka kwa ufasaha katika “kwa sheria”.
theological_decisions:
- issue: Maana ya “sheria ya imani”
  choice: sheria ya imani
  alternative: kanuni ya imani
  rationale: Tafsiri ya moja kwa moja hudumisha mchezo wa kimakusudi wa Paulo kuhusu νόμος na hairahisishi mapema iwapo anamaanisha sheria, kanuni, au utaratibu unaotawala.
- issue: Kuondolewa kwa kujisifu
  choice: Kumeondolewa
  alternative: Kumefungiwa nje
  rationale: “Kumeondolewa” ni ya asili zaidi kwa Kiswahili huku ikihifadhi dai thabiti la kauli tendwa; haitaji ni nani aliyekiondoa.
- issue: Uhusiano wa matendo na imani
  choice: Ya matendo? La, bali kwa sheria ya imani.
  alternative: Sheria ya matendo? La, bali kupitia sheria ya imani.
  rationale: Muundo mfupi hudumisha maswali ya balagha na tofauti ya Paulo bila kuingiza maelezo ya kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa maswali mafupi umehifadhiwa ili kuendeleza nguvu ya balagha ya Kigiriki. Hakuna alama za tanbihi kwa kuwa hakuna tanbihi zinazohitajika.
