  text: εἰ ⸀δὲ ἡ ἀλήθεια τοῦ θεοῦ ἐν τῷ ἐμῷ ψεύσματι ἐπερίσσευσεν εἰς τὴν δόξαν αὐτοῦ, τί ἔτι κἀγὼ ὡς ἁμαρτωλὸς κρίνομαι,
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/007.yaml
  text: But if God’s truthfulness has abounded through my lie for his glory, why am I still being judged as a sinner?
translation:
  language: sw
  text: Lakini ikiwa uaminifu wa Mungu[a] umeongezeka kwa njia ya uongo wangu[b] kwa utukufu wake[c], kwa nini mimi bado nahukumiwa kama mwenye dhambi?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kweli ya Mungu” au “ukweli wa Mungu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “katika uongo wangu” au “kwa uongo wangu.”
    reason: lexical_alternative
  - marker: c
    text: Kwa maana halisi, “kwa kuelekea utukufu wake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλήθεια τοῦ θεοῦ
  choice: uaminifu wa Mungu
  rationale: Katika muktadha wa Waroma 3:4–7, neno hili linalinganishwa na uongo wa mwanadamu; “uaminifu wa Mungu” huonyesha kwa Kiswahili sifa ya Mungu ya kuwa wa kweli bila kulifanya kuwa wazo la kinadharia tu.
- source_word: ἐν τῷ ἐμῷ ψεύσματι
  choice: kwa njia ya uongo wangu
  rationale: ἐν inaeleweka hapa kwa maana ya njia au chombo; usemi huu ni wa asili katika Kiswahili na huhifadhi hoja kwamba uongo wa msemaji umekuwa njia ambayo uaminifu wa Mungu umeonekana kwa wingi zaidi.
- source_word: ψεύσματι
  choice: uongo
  rationale: “Uongo” ni neno la moja kwa moja na la kawaida linaloweza kumaanisha kauli au hali ya kutokuwa kweli.
- source_word: ἐπερίσσευσεν
  choice: umeongezeka
  rationale: Kitenzi kinaonyesha kuzidi au kuwa kwa wingi; “umeongezeka” ni wazi kwa msomaji wa kawaida na huhifadhi hali timilifu ya kitendo chenye matokeo yanayoendelea.
- source_word: εἰς τὴν δόξαν αὐτοῦ
  choice: na hivyo kumletea utukufu
  rationale: εἰς inaweza kuonyesha matokeo au kusudi. “Na hivyo kumletea utukufu” huwasilisha kwa Kiswahili uhusiano wa matokeo bila kuamua kwa lazima kwamba ni kusudi pekee.
- source_word: τί ἔτι
  choice: kwa nini ... bado
  rationale: Huhifadhi nguvu ya ἔτι, yaani kuendelea kwa hukumu inayoulizwa katika hoja hii.
- source_word: κἀγὼ
  choice: mimi
  rationale: Kiwakilishi kilichosisitizwa huonyesha wazi mhusika; kidokezo cha nyongeza katika κἀγώ kinaeleweka kutokana na muktadha bila kulazimisha “hata mimi.”
- source_word: κρίνομαι
  choice: nahukumiwa
  rationale: Huhifadhi kauli tendwa na hali ya sasa; katika Kiswahili “nahukumiwa” haibani maana kwa lazima kuwa adhabu ya mwisho.
- source_word: ὡς ἁμαρτωλὸς
  choice: kuwa mwenye dhambi
  rationale: Ni usemi wa Kiswahili unaoeleweka na unaolingana na kutambuliwa au kutendewa kama ἁμαρτωλός.
theological_decisions:
- issue: Je, ἀλήθεια τοῦ θεοῦ limaanishe “kweli ya Mungu” au sifa ya Mungu ya kuwa wa kweli na mwaminifu?
  choice: uaminifu wa Mungu
  alternative: kweli ya Mungu
  rationale: Muktadha unalinganisha Mungu aliye wa kweli na mwanadamu mwongo. “Uaminifu” huonyesha sifa hiyo ya Mungu kwa kawaida katika Kiswahili, huku “kweli ya Mungu” ikiweza kueleweka kama mafundisho au ujumbe unaotoka kwa Mungu.
- issue: Je, εἰς τὴν δόξαν αὐτοῦ linaonyesha kusudi au matokeo?
  choice: na hivyo kumletea utukufu
  alternative: kwa ajili ya utukufu wake
  rationale: Muundo wa Kigiriki unaweza kuhusisha matokeo au mwelekeo wa tendo. Tafsiri iliyochaguliwa huhifadhi mtiririko wa hoja bila kufunga kifungu kwa kusudi pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imehifadhi umbo la hoja ya masharti na swali la balagha. Hakuna alama za tanbihi kwa sababu hakuna tanbihi iliyohitajika katika rasimu ya Kiswahili.
