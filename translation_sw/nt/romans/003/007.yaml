- from: Lakini ikiwa uaminifu wa Mungu umeongezeka kwa njia ya uongo wangu na hivyo kumletea utukufu, kwa nini mimi bado nahukumiwa kuwa mwenye dhambi?
  to: Lakini ikiwa uaminifu wa Mungu[a] umeongezeka kwa njia ya uongo wangu[b] kwa utukufu wake[c], kwa nini mimi bado nahukumiwa kama mwenye dhambi?
