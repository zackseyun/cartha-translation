base_translation:
  language: en
  yaml_path: translation/nt/romans/003/003.yaml
  text: What then? If some were unfaithful[a], will their unfaithfulness nullify God's faithfulness?
translation:
  language: sw
  text: Basi, tuseme nini? Ikiwa baadhi yao hawakuwa waaminifu, je, kutokuwa waaminifu kwao kutaubatilisha uaminifu wa Mungu?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “imani ya Mungu.” Kigiriki kinasema kihalisi “imani ya Mungu,” lakini hapa huenda maana yake ni uaminifu wa Mungu.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γάρ
  choice: Basi, tuseme nini?
  rationale: Ni kiunganishi kifupi cha hoja kinachoanzisha pingamizi au hitimisho; kauli hii ni ya kawaida katika Kiswahili na inaonyesha mgeuko wa hoja.
- source_word: ἠπίστησάν
  choice: hawakuwa waaminifu
  rationale: Ingawa kitenzi hiki kinaweza kumaanisha kutokuamini, hapa ulinganifu wake na ἀπιστία na utofauti wake na πίστις ya Mungu unapendelea maana ya kutokuwa mwaminifu.
- source_word: τινες
  choice: baadhi yao
  rationale: Neno hili linamaanisha watu fulani katika kundi linalozungumziwa; 'baadhi yao' ni Kiswahili cha kawaida na hudumisha muktadha.
- source_word: ἀπιστία
  choice: kutokuwa kwao waaminifu
  rationale: Nomino hii inalingana na ἠπίστησάν na kutofautishwa na uaminifu wa Mungu; tafsiri hii inadumisha ulinganifu wa kimaneno.
- source_word: πίστιν τοῦ θεοῦ
  choice: uaminifu wa Mungu
  rationale: Ingawa muundo wa Kigiriki ni kihalisi 'imani ya Mungu,' katika muktadha huu unaelekea kumaanisha uaminifu au kutegemeka kwa Mungu, hasa ukitofautishwa na kutokuwa waaminifu kwa wanadamu.
- source_word: καταργήσει
  choice: kutaubatilisha
  rationale: Kitenzi hiki hapa kina maana ya kufanya jambo lisiwe na nguvu au lisifanye kazi; 'kubatilisha' kinafaa katika swali la balagha.
theological_decisions:
- issue: Tafsiri ya πίστιν τοῦ θεοῦ katika kifungu cha Paulo chenye tafsiri zinazobishaniwa
  choice: uaminifu wa Mungu
  alternative: imani ya Mungu
  rationale: Utofauti kati ya ἀπιστία ya wanadamu na πίστις ya Mungu unapendelea maana ya uaminifu wa Mungu, lakini tanbihi inahifadhi uwezekano halisi wa tafsiri ya karibu zaidi na umbo la Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo wa swali la balagha na utofauti wa kutokuwa waaminifu kwa wanadamu dhidi ya uaminifu wa Mungu umehifadhiwa.
