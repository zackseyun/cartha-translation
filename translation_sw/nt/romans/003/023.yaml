lexical_decisions:
- source_word: πάντες
  choice: wote
  rationale: Katika muktadha, wingi huu unawahusu wanadamu wote; “wote” ni fasaha na hudumisha dai la Paulo bila kuongeza maneno.
- source_word: γὰρ
  choice: kwa maana
  rationale: “Kwa maana” huonyesha kwa kawaida kwamba kauli hii inaeleza hoja iliyotangulia.
- source_word: ἥμαρτον
  choice: wamefanya dhambi
  rationale: Wakati uliopita wa Kigiriki unajumlisha ukweli wa dhambi ya wanadamu; kauli hii ni ya kawaida katika Kiswahili na huonyesha tendo lenye umuhimu wa sasa.
- source_word: ὑστεροῦνται
  choice: wanapungukiwa
  rationale: Wakati wa sasa unaonyesha hali inayoendelea ya kuwa na upungufu; “wanapungukiwa” pia huhifadhi uwezekano wa maana ya kutofikia au kukosa.
- source_word: δόξης
  choice: utukufu
  rationale: “Utukufu” ndiyo tafsiri iliyozoeleka na inayofaa kwa δόξα hapa, bila kuamua ikiwa ni utukufu wa Mungu mwenyewe, unaotolewa naye, au ambao wanadamu walikusudiwa kuuakisi.
- source_word: τοῦ θεοῦ
  choice: wa Mungu
  rationale: Muundo huu hutafsiri genitivi ya Kigiriki kwa unyoofu na huhifadhi upana wa maana bila kuifafanua kupita kiasi.
theological_decisions:
- issue: Maana ya “utukufu wa Mungu”
  choice: utukufu wa Mungu
  alternative: utukufu unaotoka kwa Mungu; utukufu ambao wanadamu walikusudiwa kuuakisi; kushiriki utukufu wa Mungu
  rationale: Kirai cha Kigiriki ni kifupi na kinaweza kueleweka kwa njia kadhaa zinazohusiana. Tafsiri kuu hudumisha mvutano huo wa kiteolojia badala ya kuchagua maana moja kimyakimya.
