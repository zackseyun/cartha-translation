  text: There is no fear of God before their eyes[a][b].
translation:
  language: sw
  text: Hakuna kumcha Mungu mbele ya macho yao.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Hakuna heshima kwa Mungu mbele ya macho yao.”
    reason: lexical_alternative
  - marker: b
    text: Imenukuliwa kutoka Zaburi 36:1 (LXX 35:2).
    reason: cross_reference
lexical_decisions:
- source_word: οὐκ ἔστιν
  choice: hakuko
  rationale: Muundo huu wa ukanushi unaeleza kwa Kiswahili cha kawaida kwamba hali hiyo haipo, huku ukipatana na nomino ya ngeli ya KU, “kumcha.”
- source_word: φόβος
  choice: kumcha
  rationale: “Kumcha Mungu” ni usemi wa asili na wenye hadhi katika Kiswahili, unaohifadhi maana ya hofu inayomwelekea Mungu na pia unaweza kujumuisha heshima kuu bila kuifafanua kupita kiasi.
- source_word: θεοῦ
  choice: Mungu
  rationale: Katika muundo wa Kiswahili “kumcha Mungu,” Mungu ndiye anayelengwa na hofu hiyo; uhusiano wa genitivi ya Kigiriki unatolewa kwa kawaida bila kihusishi cha ziada.
- source_word: ἀπέναντι
  choice: mbele ya
  rationale: Huhifadhi taswira ya mahali iliyo katika Kigiriki na usemi wa Maandiko, huku ikiwa ya kawaida katika Kiswahili.
- source_word: τῶν ὀφθαλμῶν αὐτῶν
  choice: macho yao
  rationale: Huhifadhi taswira halisi ya “macho” badala ya kuibadili kuwa dhana pana ya kuona au ufahamu.
theological_decisions:
- issue: Maana ya φόβος inapomhusu Mungu
  choice: kumcha Mungu
  alternative: kuwa na heshima kwa Mungu
  rationale: “Kumcha” huhifadhi uzito na upeo wa neno la Kigiriki bila kupunguza maana kuwa heshima pekee; maana ya heshima imetolewa kama uwezekano katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; usemi ni mfupi, wa sasa, na wenye hadhi. Muundo wa kibiblia “mbele ya macho yao” umehifadhiwa kwa sababu ni wazi na unabeba taswira ya chanzo.
