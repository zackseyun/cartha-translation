  yaml_path: translation/nt/romans/003/029.yaml
  text: Or is God the God of the Jews only? Is he not also the God of the Gentiles? Yes[a], of the Gentiles also.
translation:
  language: sw
  text: Au je, Mungu ni Mungu wa Wayahudi tu? Je, yeye si Mungu wa mataifa pia? Ndiyo, wa mataifa pia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watu wasio Wayahudi”; kwa maana ya karibu zaidi na Kigiriki, “mataifa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: Au je
  rationale: Huanzisha hoja nyingine ya balagha katika mtiririko wa Paulo; “Au je” ni ya kawaida katika Kiswahili na hudumisha uhusiano wa hoja.
- source_word: Ἰουδαίων
  choice: Wayahudi
  rationale: Hutaja jamii ya Kiyahudi kwa ujumla; katika muundo “Mungu wa Wayahudi” genitivi ya Kigiriki imewasilishwa kwa Kiswahili cha kawaida.
- source_word: ὁ θεὸς
  choice: Mungu
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa θεός; limerudiwa pale linapohitajika ili sentensi iwe wazi na ya asili.
- source_word: μόνον
  choice: tu
  rationale: Huonyesha upekee unaoulizwa katika swali la balagha kwa lugha fupi na ya kawaida.
- source_word: οὐχὶ
  choice: Je, yeye si ... pia?
  rationale: οὐχί huanzisha swali linalotarajia jibu la ndiyo; muundo huu unahifadhi swali pamoja na matarajio hayo.
- source_word: ἐθνῶν
  choice: watu wa mataifa mengine
  rationale: Katika ulinganisho na Wayahudi, neno hili humaanisha watu wasio Wayahudi. Usemi huu ni wazi kwa wasomaji wa sasa bila kugeuza maana kuwa mataifa ya kisiasa.
- source_word: ναὶ
  choice: Ndiyo
  rationale: Hutoa jibu la moja kwa moja la kukubali, kama ilivyo katika Kigiriki.
- source_word: καὶ
  choice: pia
  rationale: Huongeza watu wa mataifa mengine kando ya Wayahudi na kudumisha mkazo wa ujumuishaji.
theological_decisions:
- issue: Iwapo ἐθνῶν itafsiriwe “watu wa mataifa mengine” au “mataifa”
  choice: watu wa mataifa mengine
  alternative: mataifa
  rationale: Muktadha unalinganisha Wayahudi na wasio Wayahudi, si mataifa kama dola za kisiasa. Tafsiri iliyochaguliwa inaweka wazi tofauti hiyo, huku tanbihi ikihifadhi tafsiri iliyo karibu zaidi na umbo la Kigiriki.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Maswali ya balagha na jibu fupi yamedumishwa; “watu wa mataifa mengine” limetumiwa badala ya istilahi ya kidini isiyoeleweka kwa wasomaji wote.
