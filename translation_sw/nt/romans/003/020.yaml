id: ROM.3.20
reference: Romans 3:20
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: διότι ἐξ ἔργων νόμου οὐ δικαιωθήσεται πᾶσα σὰρξ ἐνώπιον αὐτοῦ, διὰ γὰρ νόμου ἐπίγνωσις ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/020.yaml
  text: because by works of the law no one will be justified before him, for through the law comes the knowledge of sin.
translation:
  language: sw
  text: Kwa maana hakuna mtu atakayehesabiwa kuwa mwadilifu mbele zake kwa matendo ya sheria, kwa sababu kupitia sheria huja utambuzi wa dhambi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξ ἔργων νόμου
  choice: kwa matendo ya sheria
  rationale: Huhifadhi uhusiano wa msingi wa matendo na sheria kwa Kiswahili cha kawaida na cha moja kwa moja.
- source_word: οὐ δικαιωθήσεται
  choice: hakuna mtu atakayehesabiwa kuwa mwadilifu
  rationale: Kitenzi cha wakati ujao cha kutendwa kinawasilishwa kwa lugha ya kimahakama inayoeleweka, bila kukifanya kuwa mabadiliko ya tabia.
- source_word: πᾶσα σὰρξ
  choice: hakuna mtu
  rationale: Katika muktadha huu msemo wa Kisemiti humaanisha kila mwanadamu; 'hakuna mtu' ni wa asili katika Kiswahili na hufuata maana ya jumla ya sentensi.
- source_word: ἐνώπιον αὐτοῦ
  choice: mbele zake
  rationale: Huhifadhi picha ya kusimama mbele ya Mungu bila kuongeza jina ambalo halimo katika mstari huu.
- source_word: ἐπίγνωσις ἁμαρτίας
  choice: utambuzi wa dhambi
  rationale: '''Utambuzi'' huonyesha ufahamu au kujua dhambi kwa wazi, bila kudai kwamba sheria ndiyo chanzo cha dhambi.'
theological_decisions:
- issue: Maana ya kuhesabiwa haki
  choice: kuhesabiwa kuwa mwadilifu
  alternative: kufanywa mwadilifu
  rationale: Muundo wa kutendwa na muktadha wa kimahakama wa Waroma 3 unaunga mkono tamko la kukubaliwa kuwa mwadilifu, huku ukiepuka kuingiza nadharia pana zaidi ya wokovu ndani ya kitenzi kimoja.
- issue: Kazi ya sheria kuhusu dhambi
  choice: kupitia sheria huja utambuzi wa dhambi
  alternative: sheria huleta dhambi
  rationale: Kifungu kinasema sheria ndiyo njia ya kuijua dhambi, si kwamba sheria huiumba au huisababisha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imewekwa wazi kwa msomaji wa kawaida huku ikihifadhi urudiaji wa sababu katika διότι ... γάρ kwa 'Kwa maana ... kwa sababu'.
