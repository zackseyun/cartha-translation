  text: καὶ μὴ καθὼς βλασφημούμεθα καὶ καθώς φασίν τινες ἡμᾶς λέγειν ὅτι Ποιήσωμεν τὰ κακὰ ἵνα ἔλθῃ τὰ ἀγαθά; ὧν τὸ κρίμα ἔνδικόν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/008.yaml
  text: And why not say—as we are slandered and as some claim that we say—“Let us do evil so that good may come”? Their condemnation is just[a][b].
translation:
  language: sw
  text: Na kwa nini tusiseme—kama tunavyosingiziwa na kama wengine wanavyodai kwamba tunasema—“Tufanye maovu ili mema yatokee”? Hukumu yao ni ya haki[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa tafsiri iliyo rasmi zaidi: “Na si—kama tunavyosemewa kwa kashfa na kama wengine wanavyosema kwamba tunasema—‘Tufanye maovu ili mema yatokee’?”'
    reason: lexical_alternative
  - marker: b
    text: “Hukumu yao” inawahusu wale wanaotoa au kuunga mkono shtaka hili na hoja hii.
    reason: alternative_reading
lexical_decisions:
- source_word: βλασφημούμεθα
  choice: tunavyosingiziwa
  rationale: Katika muktadha huu kitenzi kinaonyesha mafundisho ya Paulo yanapotoshwa kwa uhasama, si kumkufuru Mungu moja kwa moja; “kusingiziwa” ni Kiswahili cha kawaida na sahihi kwa wazo hilo.
- source_word: φασίν τινες
  choice: wengine wanavyodai
  rationale: “Wanavyodai” huwasilisha taarifa ya shtaka lenye ubishi; “wengine” ni ya asili zaidi hapa kuliko “baadhi ya watu.”
- source_word: λέγειν
  choice: kwamba tunasema
  rationale: Huwakilisha moja kwa moja kitenzi cha kusema bila kuongeza maana pana ya “kufundisha.”
- source_word: Ποιήσωμεν
  choice: Tufanye
  rationale: Hifadhi ya nafsi ya kwanza wingi yenye maana ya himizo, “na tufanye,” inaelezwa kwa kawaida kwa “Tufanye.”
- source_word: τὰ κακὰ
  choice: maovu
  rationale: Nomino “maovu” huwasilisha kwa ufupi na kwa kawaida mambo yaliyo mabaya kimaadili.
- source_word: ἵνα ἔλθῃ τὰ ἀγαθά
  choice: ili mema yatokee
  rationale: “Ili” huhifadhi maana ya kusudi au matokeo, huku “mema yatokee” ikiwa kauli ya asili inayoakisi wingi wa τὰ ἀγαθά.
- source_word: κρίμα
  choice: Hukumu
  rationale: Neno la Kiyunani linaweza kumaanisha hukumu au uamuzi wa kuhukumu; “hukumu” huhifadhi upana huo wa kimahakama bila kuufanya kwa lazima kuwa “adhabu.”
- source_word: ἔνδικόν
  choice: ni ya haki
  rationale: Huhifadhi uzito wa kimaadili na kimahakama wa ἔνδικον kwa Kiswahili sanifu na chenye hadhi.
- source_word: καὶ μὴ
  choice: Na kwa nini tusiseme
  rationale: Kifungu cha Kiyunani ni cha mkato na kinaendeleza hoja ya mstari uliotangulia. Ujazaji huu unafanya maana iliyodokezwa ieleweke kwa Kiswahili bila kubadili hoja.
theological_decisions:
- issue: Rejeo la kiwakilishi katika ὧν τὸ κρίμα
  choice: “yao” linaachwa katika maandishi makuu na ufafanuzi unawekwa katika tanbihi
  alternative: Kutaja moja kwa moja “hukumu ya watu hao” katika maandishi
  rationale: Kiyunani kina kiwakilishi cha uhusiano ambacho rejeo lake linaeleweka kutokana na muktadha lakini halitajwi upya. Kulihifadhi kama “yao” huepuka kuondoa kwa kimya mvutano wa kisarufi, huku tanbihi ikifafanua rejeo linalowezekana zaidi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ya mkato ya Kiyunani imefafanuliwa kwa kiasi kidogo ili isomeke kwa kawaida; vistari virefu vinatenga shtaka lililoripotiwa. Alama zote za tanbihi zimewekwa katika maandishi makuu.
