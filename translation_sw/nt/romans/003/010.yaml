  yaml_path: translation/nt/romans/003/010.yaml
  text: 'As it is written: “There is no one righteous, not even one.”'
translation:
  language: sw
  text: 'Kama ilivyoandikwa: “Hakuna mwenye haki, hata mmoja.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθὼς
  choice: Kama
  rationale: Pamoja na ‘ilivyoandikwa,’ linaanzisha nukuu ya Maandiko kwa Kiswahili cha kawaida na kuwakilisha maana ya ‘kama vile.’
- source_word: γέγραπται
  choice: ilivyoandikwa
  rationale: Hii ni namna ya kawaida ya Kiswahili ya kutafsiri kauli ya kunukuu Maandiko, huku hali ya matokeo yanayoendelea ya wakati timilifu wa Kigiriki ikidokezwa.
- source_word: ὅτι
  choice: ':'
  rationale: Alama ya nukta mbili huanzisha nukuu kwa njia ya asili kuliko kutafsiri kiunganishi hiki kwa neno ‘kwamba.’
- source_word: Οὐκ ἔστιν
  choice: Hakuna
  rationale: Ni usemi wa kawaida wa Kiswahili unaowasilisha kuwepo kunakokanushwa katika Kigiriki.
- source_word: δίκαιος
  choice: mwenye haki
  rationale: Huhifadhi maana pana ya mtu aliye sawa kimaadili na mbele za Mungu, na ni ya asili zaidi kwa mtu kuliko kivumishi ‘haki’ peke yake.
- source_word: οὐδὲ εἷς
  choice: hata mmoja
  rationale: Huwasilisha mkazo wa Kigiriki kwamba hakuna hata mtu mmoja aliye tofauti na kauli hiyo.
theological_decisions:
- issue: Iwapo kauli itajikita wazi kwa mtu mmoja mmoja au idumishe upeo wake wa jumla na usio na ubaguzi.
  choice: Hakuna mwenye haki
  alternative: Hakuna mtu mwenye haki / Hakuna aliye mwadilifu
  rationale: ‘Hakuna mwenye haki’ ni fupi, ya jumla, na yenye nguvu; haiongezi neno ‘mtu’ lisilosemwa wazi katika Kigiriki, huku ikieleweka kwa kawaida kuwa inawahusu watu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Muundo wa nukuu ni wa kawaida katika maandishi ya kibiblia bila kuwa wa kizamani.
