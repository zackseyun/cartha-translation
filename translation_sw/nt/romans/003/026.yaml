  source_fidelity: 'Msingi wa aya umehifadhiwa vizuri: ἀνοχή ni kujizuia kwa Mungu katika kutoa hukumu, ἔνδειξις ni kuonyesha/udhihirisho, na jozi δίκαιον–δικαιοῦντα imewasilishwa kwa lugha ya haki. Hata hivyo, “kwa uvumilivu” hubadilisha kwa urahisi maana ya ἐν (“katika”) kuwa chombo/mbinu, na “amhesabie haki” katika muundo wa sasa hailingani vizuri na kishirikishi cha sasa δικαιοῦντα. Tanbihi ya c pia haielezi kwa Kiswahili cha asili usomaji mbadala wa genitivi inayobishaniwa.'
  naturalness: 'Marekebisho yanatumia Kiswahili sanifu na cha kisasa: “katika ustahimilivu wa Mungu,” “wakati wa sasa,” na “ndiye anayemhesabia haki” yanasomeka kwa kawaida huku yakidumisha mtindo wa hoja ya Paulo.'
