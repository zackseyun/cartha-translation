base_translation:
  language: en
  yaml_path: translation/nt/romans/003/026.yaml
  text: in God's forbearance[a], for the demonstration of his righteousness at the present time[c][b], so that he might be just and the justifier of the one who has faith in Jesus.
translation:
  language: sw
  text: katika ustahimilivu wa Mungu, ili kuonyesha haki yake[a] wakati wa sasa, kusudi awe mwenye haki na ndiye anayemhesabia haki[b] mtu aliye na imani katika Yesu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uadilifu wake.”
    reason: lexical_alternative
  - marker: b
    text: Au, “anayemtangaza kuwa mwenye haki.”
    reason: lexical_alternative
  - marker: c
    text: Au, “mtu aliye wa imani ya Yesu”; yaweza kumaanisha uaminifu wa Yesu.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνοχῇ
  choice: uvumilivu
  rationale: Neno hili linaonyesha Mungu kujizuia kutoa hukumu mara moja; “uvumilivu” ni la kawaida na lenye heshima katika Kiswahili.
- source_word: ἔνδειξιν
  choice: kuonyesha
  rationale: Kitenzi hiki cha Kiswahili kinawasilisha kwa njia ya asili wazo la kufanya haki ya Mungu ionekane wazi.
- source_word: δικαιοσύνης
  choice: haki
  rationale: “Haki” linaweza kubeba maana za kuwa mwenye haki na kutenda kwa haki, hivyo linafaa katika hoja ya kimahakama ya Paulo.
- source_word: νῦν καιρῷ
  choice: katika wakati huu
  rationale: Kauli hii ni ya kawaida na inadumisha msisitizo wa wakati wa sasa.
- source_word: δίκαιον
  choice: mwenye haki
  rationale: Kauli hii inaeleweka kwa urahisi na inadumisha uhusiano wa kimatamshi na “amhesabie haki.”
- source_word: δικαιοῦντα
  choice: amhesabie haki
  rationale: Hii inawasilisha tendo la Mungu la kumweka mtu katika hali ya kuwa mwenye haki, huku ikidumisha mwangwi wa neno δίκαιον lililotangulia.
- source_word: ἐκ πίστεως Ἰησοῦ
  choice: mtu anayemwamini Yesu
  rationale: Maandishi makuu yanafuata uelewa wa kawaida wa imani inayoelekezwa kwa Yesu; uwezekano wa maana ya uaminifu wa Yesu umehifadhiwa katika tanbihi.
theological_decisions:
- issue: Maana ya ἐκ πίστεως Ἰησοῦ
  choice: mtu anayemwamini Yesu
  alternative: mtu aliye wa uaminifu wa Yesu
  rationale: Muundo wa Kigiriki unaweza kueleweka kuwa imani katika Yesu au uaminifu wa Yesu mwenyewe. Maandishi makuu yanatumia uelewa wa kawaida na unaosomeka kwa urahisi, bila kuficha usomaji mwingine unaowezekana.
- issue: Uhusiano wa δίκαιον na δικαιοῦντα
  choice: mwenye haki na pia amhesabie haki
  alternative: mwadilifu na pia amtangaze kuwa mwenye haki
  rationale: Tafsiri hii inadumisha mvutano wa hoja kwamba Mungu mwenyewe ni mwenye haki na ndiye anayempa mwenye imani hadhi ya haki.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa msomaji wa kawaida. Muundo wa aya umeachwa ukiwa mwendelezo wa sentensi ya aya iliyotangulia, kama ilivyo katika chanzo cha Kigiriki.
