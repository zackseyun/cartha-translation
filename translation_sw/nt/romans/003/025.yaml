base_translation:
  language: en
  yaml_path: translation/nt/romans/003/025.yaml
  text: whom God put forward as an atoning sacrifice[a] through faith in his blood[b], to demonstrate his righteousness[c], because of the passing over of previously committed sins.
translation:
  language: sw
  text: ambaye Mungu alimweka wazi kuwa dhabihu ya upatanisho[a] kwa njia ya imani katika damu yake[b], ili kuonyesha haki yake[c], kwa sababu ya kuacha dhambi zilizotendwa hapo awali zipite bila kuadhibiwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sadaka ya kuondoa ghadhabu”; au “kiti cha rehema,” yaani kifuniko cha dhahabu cha Sanduku la Agano ambacho kilinyunyiziwa damu ya upatanisho.
    reason: lexical_alternative
  - marker: b
    text: Au “kwa njia ya imani, kwa damu yake.” Kishazi hiki kinaweza pia kueleweka kuwa “kwa njia ya imani katika damu yake.”
    reason: alternative_reading
  - marker: c
    text: Au “uadilifu wake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προέθετο
  choice: alimweka wazi
  rationale: Huwasilisha tendo la Mungu la kumweka Kristo mbele ya watu au kumdhihirisha hadharani, bila kulibana kuwa kusudi la ndani tu.
- source_word: ἱλαστήριον
  choice: dhabihu ya upatanisho
  rationale: Ni Kiswahili kinachoeleweka na chenye hadhi kinachohifadhi wigo wa tendo la kufunika au kuondoa dhambi na kurejesha uhusiano, bila kulazimisha tafsiri moja tu ya neno hili lenye mjadala.
- source_word: διὰ πίστεως
  choice: kwa njia ya imani
  rationale: Huhifadhi maana ya njia au namna inayodokezwa na διά pamoja na genitivi, na kutumia istilahi ya kawaida ya Paulo kwa πίστις.
- source_word: ἐν τῷ αὐτοῦ αἵματι
  choice: katika damu yake
  rationale: Ufasiri wa karibu na muundo wa Kigiriki unaohifadhi utata wa iwapo kishazi hiki kinafungamana na imani au kinaonyesha njia ya dhabihu; uwezekano mwingine umeelezwa katika tanbihi.
- source_word: εἰς ἔνδειξιν
  choice: ili kuonyesha
  rationale: Hutoa kwa Kiswahili cha asili nguvu ya kusudi au matokeo ya kishazi cha Kigiriki.
- source_word: δικαιοσύνης
  choice: haki
  rationale: Haki ni istilahi ya kawaida na pana katika Kiswahili kwa δικαιοσύνη, ikiruhusu wazo la unyofu wa Mungu na pia uadilifu wake wa kuhukumu.
- source_word: πάρεσιν
  choice: alikuwa ameachilia bila kuadhibu
  rationale: Hutofautisha πάρεσις na msamaha kamili kwa kuonyesha kwamba dhambi za awali ziliachwa zipite bila adhabu kutekelezwa wakati huo.
- source_word: προγεγονότων ἁμαρτημάτων
  choice: dhambi zilizotendwa hapo awali
  rationale: Huwasilisha wazi maana ya dhambi zilizokwisha kutendwa kabla ya wakati unaozungumziwa.
theological_decisions:
- issue: Maana ya ἱλαστήριον
  choice: dhabihu ya upatanisho
  alternative: sadaka ya kuondoa ghadhabu; kiti cha rehema
  rationale: Maandishi makuu yanatumia lugha inayoeleweka na kuhifadhi nguvu ya kidhabihu, huku tanbihi ikibakiza uwezekano wa msisitizo unaomwelekea Mungu na dokezo la kifuniko cha Sanduku la Agano.
- issue: Uhusiano wa διὰ πίστεως na ἐν τῷ αὐτοῦ αἵματι
  choice: kwa njia ya imani katika damu yake
  alternative: kwa njia ya imani, kwa damu yake
  rationale: Usomaji mkuu unaelewa damu yake kuwa kitu kinachoelekezewa imani, lakini muundo wa Kigiriki unaweza pia kuifanya damu kuwa njia ambayo Mungu alimtoa Kristo; utata huo umehifadhiwa katika tanbihi.
- issue: Wigo wa δικαιοσύνη ya Mungu
  choice: haki yake
  alternative: uadilifu wake
  rationale: Haki ni neno pana linalofaa katika matumizi ya Paulo; uadilifu unaweza kusisitiza zaidi upande wa Mungu kutenda na kuhukumu kwa usawa.
- issue: Maana ya πάρεσις
  choice: kuachilia bila kuadhibu
  alternative: kupitilia mbali
  rationale: Chaguo hili halichanganyi neno hili moja kwa moja na msamaha kamili, bali huhifadhi wazo la Mungu kutotekeleza adhabu ya dhambi za zamani wakati huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inadumisha msamiati wa kibiblia unaotambulika lakini inaepuka istilahi nzito zisizoeleweka kwa wasomaji wa kawaida. Tanbihi huhifadhi tofauti muhimu za kileksika, kisintaksia, na kitheolojia.
