id: ROM.3.5
reference: Romans 3:5
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἰ δὲ ἡ ἀδικία ἡμῶν θεοῦ δικαιοσύνην συνίστησιν, τί ἐροῦμεν; μὴ ἄδικος ὁ θεὸς ὁ ἐπιφέρων τὴν ὀργήν; κατὰ ἄνθρωπον λέγω.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/005.yaml
  text: But if our unrighteousness demonstrates God’s righteousness[a], what shall we say? Is God unjust to inflict wrath? (I am speaking in a human way.)
translation:
  language: sw
  text: Lakini ikiwa udhalimu wetu unaonyesha haki ya Mungu[a], tuseme nini? Je, Mungu anayeleta ghadhabu ni dhalimu? (Ninasema kwa namna ya kibinadamu.)
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “udhalimu wetu unaonyesha uadilifu wa Mungu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδικία
  choice: udhalimu
  rationale: Neno hili linaendeleza tofauti ya kimaadili na kimahusiano kati ya kosa la wanadamu na haki ya Mungu; pia linaweza kumaanisha kutotenda haki.
- source_word: δικαιοσύνη
  choice: haki
  rationale: “Haki” ni neno la kawaida na lenye upana katika Kiswahili, linaloweza kubeba maana za uadilifu na kutenda kwa haki katika hoja ya Paulo.
- source_word: συνίστησιν
  choice: unaonyesha
  rationale: Hapa kitenzi kina maana ya kufanya jambo lionekane wazi au kulithibitisha kwa kulinganisha; “unaonyesha” ni cha asili na kinaeleweka kwa urahisi.
- source_word: μὴ ἄδικος
  choice: Je, Mungu ni dhalimu...?
  rationale: Muundo wa swali unahifadhi pingamizi la balagha huku muktadha na chembe μή zikidokeza jibu la kukataa, bila kuongeza jibu hilo moja kwa moja katika tafsiri.
- source_word: ἐπιφέρων τὴν ὀργήν
  choice: anapoleta ghadhabu
  rationale: “Kuleta ghadhabu” huhifadhi lugha ya chanzo na maana ya hukumu inayotekelezwa bila kuifanya ghadhabu iwe hisia tu.
- source_word: κατὰ ἄνθρωπον λέγω
  choice: Ninasema kwa namna ya kibinadamu
  rationale: Hii inaonyesha kuwa Paulo anatumia namna ya hoja ya kawaida ya wanadamu, huku ikihifadhi tahadhari yake bila kufafanua zaidi ya maandishi.
theological_decisions:
- issue: Swali la Paulo kuhusu haki ya Mungu katika hukumu
  choice: Je, Mungu ni dhalimu anapoleta ghadhabu?
  alternative: Mungu si dhalimu anapoleta ghadhabu, sivyo?
  rationale: Swali la moja kwa moja linaakisi muundo wa Kigiriki na kuhifadhi uzito wa pingamizi; μή hudokeza jibu hasi, lakini tafsiri hailiongezi waziwazi.
- issue: Uhusiano wa ἀδικία na δικαιοσύνη
  choice: udhalimu wetu ... haki ya Mungu
  alternative: kutotenda kwetu haki ... kutenda kwa Mungu kwa haki
  rationale: Chaguo kuu linahifadhi istilahi fupi na pana za kimaadili; tanbihi inaonyesha maana mbadala ya kimahakama bila kuamua kimya-kimya upeo wa maneno hayo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa swali umewekwa wazi na wa kawaida, na sentensi ya mwisho imehifadhiwa kama maelezo ya Paulo ndani ya mabano.
