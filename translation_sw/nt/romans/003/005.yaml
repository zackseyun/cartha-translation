revisions:
- from: Lakini ikiwa udhalimu wetu unaonyesha haki ya Mungu[a], tuseme nini? Je, Mungu ni dhalimu anapoleta ghadhabu? (Ninasema kwa namna ya kibinadamu.)
  to: Lakini ikiwa udhalimu wetu unaonyesha haki ya Mungu[a], tuseme nini? Je, Mungu anayeleta ghadhabu ni dhalimu? (Ninasema kwa namna ya kibinadamu.)
  rationale: The revision preserves the Greek rhetorical question and Paul’s disclaimer, while rendering the participial phrase about wrath without adding a temporal sense. The footnote is narrowed to a genuine lexical alternative for δικαιοσύνη and no longer paraphrases the source clause.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T02:31:15Z'
review_pass:
  verdict: revise
  source_fidelity: The main contrast, “udhalimu wetu ... haki ya Mungu,” suitably represents ἀδικία ... δικαιοσύνη, and “unaonyesha” adequately conveys συνίστησιν. The direct question preserves the rhetorical objection without importing an answer. However, “anapoleta ghadhabu” makes the participial description temporal ('when he brings wrath'); “anayeleta ghadhabu” more directly reflects ὁ ἐπιφέρων τὴν ὀργήν ('the one bringing/inflicting wrath').
  naturalness: The revised wording is idiomatic Standard East African Swahili. “Je, Mungu anayeleta ghadhabu ni dhalimu?” is a natural rhetorical question and avoids the slight temporal implication of “anapoleta.”
  terminology: “Udhalimu” and “haki” are defensible contextual renderings. The existing footnote, however, paraphrases the full clause and changes the focus to God’s action. It should instead supply the lexical alternative “uadilifu” for δικαιοσύνη while retaining the source structure.
  issues:
  - severity: low
    issue: Temporal form in the wrath clause
    rationale: “Anapoleta” means 'when he brings,' whereas Greek has an attributive participle, ὁ ἐπιφέρων, describing God as the one bringing/inflicting wrath.
  - severity: medium
    issue: Footnote does not provide a close lexical alternative
    rationale: The footnote shifts from 'God’s righteousness/justice' to 'that God acts justly' and recasts both sides of the clause. A lexical-alternative note should retain the clause and offer “uadilifu” for δικαιοσύνη.
  revised_text: Lakini ikiwa udhalimu wetu unaonyesha haki ya Mungu[a], tuseme nini? Je, Mungu anayeleta ghadhabu ni dhalimu? (Ninasema kwa namna ya kibinadamu.)
  revised_footnotes:
