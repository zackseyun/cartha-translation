base_translation:
  language: en
  yaml_path: translation/nt/romans/003/022.yaml
  text: And the righteousness of God through faith in Jesus the Messiah[a], for all who believe[b]; for there is no distinction.
translation:
  language: sw
  text: Na haki ya Mungu[a] ni kwa njia ya imani katika Yesu Masihi[b], kwa wote wanaoamini; kwa maana hakuna tofauti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uadilifu wa Mungu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa njia ya uaminifu wa Yesu Masihi.”
    reason: alternative_reading
lexical_decisions:
- source_word: δικαιοσύνη
  choice: haki
  rationale: “Haki” ndilo neno la kawaida na lenye upana unaofaa katika Kiswahili cha Biblia; linaweza kurejelea hali ya kuwa sawa mbele za Mungu na pia utendaji wake wa haki.
- source_word: θεοῦ
  choice: ya Mungu
  rationale: Muundo huu unafuata hali ya umilikishi ya Kigiriki bila kuamua kama haki hiyo ni sifa ya Mungu, tendo lake, au haki anayoitoa.
- source_word: διὰ πίστεως
  choice: kwa njia ya imani
  rationale: Hii inadumisha nomino πίστις na maana yake ya msingi ya imani, huku maana ya uaminifu ikihifadhiwa katika tanbihi kuhusu muundo wote.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesu Masihi
  rationale: “Masihi” hutafsiri Χριστός kama cheo badala ya kukifanya jina la ukoo; Kiswahili hakihitaji kiambishi cha utambulisho kati ya jina na cheo hiki.
- source_word: εἰς πάντας τοὺς πιστεύοντας
  choice: kwa wote wanaoamini
  rationale: Ni Kiswahili cha kawaida kinachohifadhi upeo unaojumuisha wote na nguvu ya hali endelevu ya kitenzi-shirikishi.
- source_word: διαστολή
  choice: tofauti
  rationale: “Tofauti” ni neno la kawaida na wazi katika muktadha wa kutokuwapo kwa mgawanyo wa hadhi.
theological_decisions:
- issue: πίστεως Ἰησοῦ Χριστοῦ
  choice: imani katika Yesu Masihi
  alternative: uaminifu wa Yesu Masihi
  rationale: Muundo wa hali ya umilikishi unaweza kueleweka kwa namna mbili. Matini kuu inatumia usomaji wa kawaida wa kumwelekezea Yesu imani, na tanbihi inadumisha uwezekano wa kurejelea uaminifu wa Yesu.
- issue: δικαιοσύνη θεοῦ
  choice: haki ya Mungu
  alternative: Mungu kutenda kwa haki
  rationale: Muundo mfupi “haki ya Mungu” huhifadhi upana wa Kigiriki na hauamui kimyakimya kati ya tabia au utendaji wa Mungu na haki anayowapa watu. Tanbihi inaonyesha kwa uwazi zaidi maana ya haki kama utendaji wa Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Mpangilio umehifadhi kwa kiasi kikubwa muundo wa Kigiriki, huku kitenzi “ni” kikiongezwa kwa ulaini wa Kiswahili. Alama za tanbihi zimewekwa mara tu baada ya maneno yanayohusika.
