lexical_decisions:
- source_word: δικαιούμενοι
  choice: wakihesabiwa haki
  rationale: Muundo wa ki- unaendeleza sentensi ya mstari uliotangulia na kudumisha hali ya kitenzi tegemezi cha wakati wa sasa katika kauli tendwa. “Kuhesabiwa haki” ni istilahi ya kawaida ya Paulo yenye mwelekeo wa kisheria bila kufafanua kupita kiasi.
- source_word: δωρεὰν
  choice: bure
  rationale: “Bure” linaeleza kwa ufupi kwamba kuhesabiwa haki hakununuliwi wala kustahiliwa, bali hutolewa pasipo malipo.
- source_word: χάριτι
  choice: neema
  rationale: “Neema” ni neno la kawaida na linalofaa katika Kiswahili kwa fadhili na tendo la Mungu lisilostahiliwa na mpokeaji.
- source_word: ἀπολυτρώσεως
  choice: ukombozi
  rationale: “Ukombozi” huhifadhi wazo la kuwekwa huru, pamoja na mwangwi wa gharama ya ukombozi, bila kuongeza maelezo yasiyo wazi katika mstari.
- source_word: Χριστῷ
  choice: Masihi
  rationale: Hapa Χριστός bado lina nguvu ya cheo; “Masihi” linaonyesha maana hiyo moja kwa moja. Umbo la mapokeo “Kristo” limewekwa katika tanbihi.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: ulio katika Masihi Yesu
  rationale: Kirai hiki kinavumisha “ukombozi” na kudumisha uhusiano wa mahali/uhusiano unaoonyeshwa na ἐν bila kuubadili kuwa ufafanuzi mpana zaidi.
theological_decisions:
- issue: Lugha ya Paulo kuhusu kuhesabiwa haki
  choice: wakihesabiwa haki
  alternative: wakitangazwa kuwa wenye haki
  rationale: Chaguo kuu linahifadhi istilahi fupi ya kisheria na hali ya kauli tendwa. Chaguo mbadala linafafanua maana inayowezekana lakini linaweza kusikika kana kwamba linatatua kikamilifu upeo wa δικαιόω.
- issue: Χριστός kama cheo
  choice: Masihi Yesu
  alternative: Kristo Yesu
  rationale: “Masihi” huonyesha wazi cheo cha Yesu katika neno la Kigiriki, huku “Kristo Yesu” likitambuliwa kama umbo lililozoeleka katika mapokeo ya Kiswahili.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo “wakihesabiwa” umeachwa kuwa tegemezi ili kuunganisha mstari huu na hoja ya mstari uliotangulia, kama ilivyo katika Kigiriki.
