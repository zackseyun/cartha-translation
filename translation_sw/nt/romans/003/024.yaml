base_translation:
  language: en
  yaml_path: translation/nt/romans/003/024.yaml
  text: being justified freely by his grace through the redemption that is in Messiah Jesus[b][a],
translation:
  language: sw
  text: wakihesabiwa haki[a] bure kwa neema yake, kwa njia ya ukombozi ulio katika Masihi Yesu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakitangazwa kuwa wenye haki.”
