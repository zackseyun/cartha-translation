  text: since God is one[c][b][a], who will justify the circumcised by faith and the uncircumcised through faith.
translation:
  language: sw
  text: kwa kuwa Mungu ni mmoja,[a] naye atawahesabia haki waliotahiriwa kwa msingi wa imani na wasiotahiriwa kupitia imani.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ikiwa kweli Mungu ni mmoja.”
    reason: alternative_reading
  - marker: b
    text: Kigiriki kinasema kihalisi “tohara” na “kutotahiriwa,” kikimaanisha waliotahiriwa na wasiotahiriwa.
    reason: cultural_note
  - marker: c
    text: Paulo anatumia kauli mbili tofauti, “kwa msingi wa imani” na “kupitia imani”; huenda tofauti hiyo ni ya mtindo tu, wala si utofautishaji mkali.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴπερ
  choice: kwa kuwa
  rationale: Katika hoja hii, kauli hii inaeleweka zaidi kuwa msingi wa hitimisho linalotokana na imani ya pamoja kwamba Mungu ni mmoja, si shaka halisi; tanbihi inahifadhi uwezekano wa maana ya masharti.
- source_word: εἷς ὁ θεός
  choice: Mungu ni mmoja
  rationale: Inahifadhi msisitizo wa Kigiriki juu ya umoja wa Mungu na inasikika kwa kawaida katika Kiswahili.
- source_word: δικαιώσει
  choice: atawahesabia haki
  rationale: Inawasilisha δικαιόω kama kitendo cha Mungu cha kuwatambua au kuwatangaza watu kuwa wenye haki, huku ikihifadhi wakati ujao.
- source_word: περιτομήν
  choice: waliotahiriwa
  rationale: Nomino ya Kigiriki imetumiwa kwa maana ya watu waliotahiriwa, wala si tendo la tohara lenyewe.
- source_word: ἐκ πίστεως
  choice: kwa msingi wa imani
  rationale: Kauli hii inaonyesha imani kuwa msingi wa kuhesabiwa haki na pia inatofautisha ἐκ na διά inayofuata.
- source_word: ἀκροβυστίαν
  choice: wasiotahiriwa
  rationale: Nomino ya Kigiriki imetumiwa kwa maana ya watu wasiotahiriwa; tafsiri hii huepuka kuibadili moja kwa moja kuwa jina la kikabila.
- source_word: διὰ τῆς πίστεως
  choice: kupitia imani
  rationale: Inahifadhi kihusishi tofauti διά bila kulazimisha tofauti kali ya kiteolojia kati yake na ἐκ πίστεως.
- source_word: πίστεως
  choice: imani
  rationale: Hii ndiyo maana ya kawaida na inayofaa katika muktadha huu; hakuna muundo tata wa umilikaji unaohitaji ufafanuzi mwingine.
theological_decisions:
- issue: Ikiwa Paulo anakusudia tofauti ya kiteolojia kati ya ἐκ πίστεως na διὰ τῆς πίστεως
  choice: Kuhifadhi tofauti hiyo kwa ‘kwa msingi wa imani’ na ‘kupitia imani’ bila kudai kuwa ni tofauti ya mafundisho.
  alternative: Kutafsiri kauli zote mbili kwa namna ileile, kama ‘kwa imani,’ au kuziona kama tofauti madhubuti ya msingi dhidi ya njia.
  rationale: Kigiriki kinatumia vihusishi viwili tofauti, lakini muktadha haulazimishi mtafsiri kuvitengenezea tofauti kali ya kiteolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Kuwahesabia haki’ ni lugha inayoeleweka na inadumisha uzito wa kisheria wa δικαιόω. Alama zote za tanbihi zimewekwa katika matini kuu karibu na kauli zinazohusika.
