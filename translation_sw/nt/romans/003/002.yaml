  yaml_path: translation/nt/romans/003/002.yaml
  text: Much in every way. For first of all[a], they were entrusted with the oracles of God.
translation:
  language: sw
  text: Ni kubwa kwa kila namna. Kwa maana, kwanza kabisa, walikabidhiwa maneno ya Mungu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “matamko ya Mungu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πολὺ
  choice: Ni kubwa
  rationale: Neno hili linajibu kwa ufupi swali la mstari uliotangulia kuhusu faida ya Myahudi; “Ni kubwa” ni Kiswahili cha kawaida na huhifadhi maana ya ukubwa wa faida hiyo.
- source_word: κατὰ πάντα τρόπον
  choice: kwa kila namna
  rationale: Nahau hii inaonyesha upana kamili wa dai la Paulo. “Kwa kila namna” ni ya asili na inaeleweka katika Kiswahili cha sasa.
- source_word: πρῶτον μὲν γὰρ
  choice: Kwa maana, kwanza kabisa
  rationale: “Kwa maana” huonyesha kazi ya γὰρ ya kutoa sababu au maelezo, huku “kwanza kabisa” ikitambulisha jambo la kwanza linalotajwa bila kudai kwamba orodha nyingine lazima ifuate mara moja.
- source_word: ἐπιστεύθησαν
  choice: walikabidhiwa
  rationale: Hapa kitenzi hiki katika hali ya kutendwa kina maana ya kupewa kitu kwa amana, si kwamba wao waliamini. “Walikabidhiwa” huwasilisha vizuri wazo la dhamana na uwakili.
- source_word: τὰ λόγια
  choice: maneno
  rationale: Neno hili linamaanisha matamko au ujumbe uliotoka kwa Mungu. “Maneno” ni wazi kwa wasomaji wa kawaida, na maana rasmi zaidi imehifadhiwa katika tanbihi.
- source_word: τοῦ θεοῦ
  choice: ya Mungu
  rationale: Muundo huu unaweza kuonyesha umilikaji au chanzo. “Ya Mungu” ni tafsiri ya moja kwa moja inayohifadhi uwezekano huo bila kuufafanua kupita kiasi.
