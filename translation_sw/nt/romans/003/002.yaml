  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wenye heshima na unaosomeka kwa urahisi. Sentensi ya kwanza imeachwa fupi ili kuhifadhi msisitizo wa Kigiriki; sentensi ya pili inafuata mtiririko wa hoja ya Paulo bila kuongeza utambulisho wa wazi wa kiima ambao unatokana na muktadha.
