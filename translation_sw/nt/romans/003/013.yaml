  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: τάφος ἀνεῳγμένος ὁ λάρυγξ αὐτῶν, ταῖς γλώσσαις αὐτῶν ἐδολιοῦσαν, ἰὸς ἀσπίδων ὑπὸ τὰ χείλη αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/013.yaml
  text: Their throat is an open grave[a]; they deceive with their tongues[c][b]; the venom of asps is under their lips.
translation:
  language: sw
  text: 'Koo lao ni kaburi lililo wazi;

    kwa ndimi zao hudanganya[a];

    sumu ya fira[b] iko chini ya midomo yao.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walikuwa wakidanganya kwa ndimi zao,” ili kusisitiza tendo lililokuwa likiendelea.
    reason: lexical_alternative
  - marker: b
    text: Au kwa ujumla zaidi, “nyoka wenye sumu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τάφος
  choice: kaburi
  rationale: “Kaburi” ni neno la kawaida na lenye hadhi linalohifadhi picha ya kifo na uozo.
- source_word: ἀνεῳγμένος
  choice: lililo wazi
  rationale: Kirai hiki kinaonyesha hali inayotokana na kufunguliwa; “lililo wazi” ni Kiswahili cha kawaida kinachohifadhi maana hiyo bila kuwa kizito.
- source_word: λάρυγξ
  choice: koo
  rationale: “Koo” ndilo neno la kawaida na wazi katika taswira hii ya usemi.
- source_word: ἐδολιοῦσαν
  choice: hudanganya
  rationale: Kauli ya mazoea “hudanganya” inaonyesha udanganyifu unaoendelea au kurudiwa, kama unavyodokezwa na wakati usiotimilika wa Kigiriki.
- source_word: ἰὸς
  choice: sumu
  rationale: Kiswahili hutumia “sumu” kwa dutu yenye madhara, kutia ndani sumu inayoingizwa mwilini kwa kuumwa na nyoka; neno hili ni la kawaida na sahihi katika muktadha.
- source_word: ἀσπίδων
  choice: fira
  rationale: “Fira” huhifadhi rejeo la aina ya nyoka mwenye sumu katika maandishi ya Kigiriki; tanbihi inatoa tafsiri pana zaidi kwa wasomaji wasioufahamu mnyama huyo.
- source_word: ὑπὸ τὰ χείλη αὐτῶν
  choice: chini ya midomo yao
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida inayohifadhi taswira halisi ya sehemu za mwili.
