  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo mfupi, wenye hadhi, na wa kishairi unaolingana na nukuu ya Zaburi. “Hudanganya” ni ya kawaida na inadokeza tabia endelevu bila kufanya sentensi kuwa nzito.
