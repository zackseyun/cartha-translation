lexical_decisions:
- source_word: ὀξεῖς
  choice: myepesi
  rationale: Ingawa neno hilo lina maana ya msingi ya ‘mik ती’ au ‘makali,’ hapa linaeleza miguu iliyo tayari na ya haraka kutenda vurugu; ‘myepesi’ ni usemi wa kawaida wa Kiswahili unaohifadhi dhana ya wepesi wa kitendo.
- source_word: οἱ πόδες
  choice: miguu
  rationale: Tafsiri ya moja kwa moja inayohifadhi taswira ya sehemu ya mwili katika chanzo.
- source_word: αὐτῶν
  choice: yao
  rationale: Kiwakilishi cha umilikaji kinaunganishwa kwa kawaida na ‘miguu’ katika Kiswahili.
- source_word: ἐκχέαι
  choice: kumwaga
  rationale: ‘Kumwaga damu’ ni usemi wa kawaida wa Kiswahili kwa kuua au kufanya vurugu, na pia unabaki karibu na maana halisi ya ‘kumimina/kumwaga.’
- source_word: αἷμα
  choice: damu
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja ya nomino hii.
