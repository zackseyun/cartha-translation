id: ROM.3.31
reference: Romans 3:31
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: νόμον οὖν καταργοῦμεν διὰ τῆς πίστεως; μὴ γένοιτο, ἀλλὰ νόμον ⸀ἱστάνομεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/031.yaml
  text: Do we then nullify the law through faith? May it never be! On the contrary[a], we uphold the law.
translation:
  language: sw
  text: Je, basi, tunaibatilisha Sheria kwa njia ya imani? Hasha! Kinyume chake, tunaithibitisha Sheria.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “tunaifanya Sheria isimame imara.”
    reason: lexical_alternative
lexical_decisions:
- source_word: νόμον
  choice: Sheria
  rationale: Katika hoja ya Waroma, neno hili linarejelea Sheria/Torati kama dhana inayojulikana. Herufi kubwa husaidia kuonyesha rejeo hilo bila kuongeza maelezo yasiyokuwamo katika Kigiriki.
- source_word: οὖν
  choice: Basi
  rationale: “Basi” huonyesha hitimisho la kimantiki kutokana na hoja iliyotangulia na ni la kawaida katika swali la balagha la Kiswahili.
- source_word: καταργοῦμεν
  choice: tunaibatilisha
  rationale: Kitenzi hiki huwasilisha maana ya kuifanya Sheria isiwe na nguvu au uhalali, na kinaepuka wazo finyu zaidi la kuifuta rasmi.
- source_word: διὰ τῆς πίστεως
  choice: kwa njia ya imani
  rationale: Huhifadhi maana ya njia au chombo ya διά pamoja na matumizi ya kawaida ya “imani” kwa πίστις.
- source_word: μὴ γένοιτο
  choice: Hasha!
  rationale: “Hasha!” ni kanusho kali, fupi, la heshima na la kawaida katika Kiswahili, linalolingana na nguvu ya usemi wa Paulo.
- source_word: ἀλλὰ
  choice: Kinyume chake
  rationale: Huonyesha wazi ugeuzaji mkali wa hoja baada ya kanusho.
- source_word: ἱστάνομεν
  choice: tunaithibitisha
  rationale: Katika muktadha huu, “tunaithibitisha” huonyesha kuifanya Sheria isimame kuwa halali na thabiti, bila kudokeza kwamba waamini ndio walioianzisha.
theological_decisions:
- issue: Uhusiano kati ya imani na Sheria
  choice: tunaithibitisha Sheria
  alternative: tunaifanya Sheria isimame imara
  rationale: Tafsiri kuu inaendeleza tofauti kati ya kuibatilisha Sheria na kuithibitisha, bila kuingiza mfumo fulani wa kimadhehebu. Tanbihi huhifadhi taswira na upana wa ἱστάνομεν.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa swali la balagha umehifadhiwa, na “Hasha!” linatoa kanusho lenye nguvu bila kuwa la mazungumzo kupita kiasi.
