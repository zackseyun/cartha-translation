  text: Νυνὶ δὲ χωρὶς νόμου δικαιοσύνη θεοῦ πεφανέρωται, μαρτυρουμένη ὑπὸ τοῦ νόμου καὶ τῶν προφητῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/021.yaml
  text: But now[a], apart from the law, the righteousness of God has been revealed, attested by the Law and the Prophets[c][b],
translation:
  language: sw
  text: Lakini sasa, pasipo Sheria, haki ya Mungu[a][b] imefunuliwa, nayo inashuhudiwa na Sheria pamoja na Manabii[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uadilifu wa Mungu.”
    reason: lexical_alternative
  - marker: b
    text: Au labda, “haki itokayo kwa Mungu.”
    reason: alternative_reading
  - marker: c
    text: Yaani, Maandiko; usemi “Sheria na Manabii” hapa unataja ushuhuda wa Maandiko ya Agano la Kale.
    reason: cross_reference
lexical_decisions:
- source_word: Νυνὶ δὲ
  choice: Lakini sasa
  rationale: Huhifadhi nguvu ya mpito yenye ulinganisho na pia maana ya wakati katika hoja ya Paulo.
- source_word: χωρὶς νόμου
  choice: pasipo Sheria
  rationale: Hueleza kutengwa au kutotegemea Sheria badala ya kukana tu kuwapo kwa sheria; herufi kubwa inaonyesha kwamba katika muktadha Paulo anaizungumzia hasa Sheria ya Musa.
- source_word: δικαιοσύνη
  choice: haki
  rationale: ‘Haki’ ni neno la kawaida na lenye hadhi linaloweza kubeba maana za uadilifu na haki ya Mungu bila kulazimisha maana moja pekee.
- source_word: θεοῦ
  choice: ya Mungu
  rationale: Muundo huu huhifadhi uwazi wa uhusiano wa kimilikishi katika Kigiriki kuliko kuufafanua moja kwa moja kuwa ‘itokayo kwa Mungu.’
- source_word: πεφανέρωται
  choice: imefunuliwa
  rationale: Wakati timilifu wa Kigiriki unaonyesha jambo lililowekwa wazi na ambalo matokeo yake yanaendelea kuwapo; ‘imefunuliwa’ ni ya sasa na ya asili katika Kiswahili.
- source_word: μαρτυρουμένη
  choice: nayo inashuhudiwa
  rationale: Huhifadhi hali ya kutendwa na uhusiano wa kishiriki na ‘haki ya Mungu,’ huku ikisikika kwa kawaida katika Kiswahili.
- source_word: ὑπὸ τοῦ νόμου καὶ τῶν προφητῶν
  choice: na Sheria pamoja na Manabii
  rationale: Inaonyesha ushuhuda unaotolewa na sehemu hizi zinazotambulika za Maandiko, si sheria kwa ujumla na manabii mmoja mmoja tu.
theological_decisions:
- issue: Maana ya muundo wa kimilikishi katika δικαιοσύνη θεοῦ
  choice: haki ya Mungu
  alternative: haki itokayo kwa Mungu
  rationale: Usemi wa Paulo unaweza kuelekeza kwa tabia na tendo la haki la Mungu, na pia kwa haki ambayo hutoka kwake. Matini kuu hudumisha mvutano huo badala ya kuamua tafsiri moja ya kimafundisho.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Lakini sasa’ ni mpito wa wazi; ‘pasipo Sheria’ ni kifupi bila kuongeza wazo la matendo ya sheria lisilotajwa wazi katika mstari. ‘Nayo inashuhudiwa’ huondoa utata wa kisarufi kuhusu kitu kinachoshuhudiwa.
