  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: μὴ γένοιτο· γινέσθω δὲ ὁ θεὸς ἀληθής, πᾶς δὲ ἄνθρωπος ψεύστης, ⸀καθὼς γέγραπται· Ὅπως ἂν δικαιωθῇς ἐν τοῖς λόγοις σου καὶ ⸀νικήσεις ἐν τῷ κρίνεσθαί σε.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/004.yaml
  text: 'May it never be! Rather[a], let God be true, and every person a liar[b], as it is written: “So that you may be justified in your words and prevail when you are judged.”'
translation:
  language: sw
  text: 'Hasha! Bali Mungu awe wa kweli, na kila mwanadamu awe mwongo, kama ilivyoandikwa: “Ili uthibitishwe kuwa wa haki[a] katika maneno yako, na ushinde utakapohukumiwa[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uhesabiwe kuwa wa haki” au “uonekane kuwa wa haki.”
    reason: lexical_alternative
  - marker: b
    text: Au, “utakapohukumu.” Tafsiri hiyo inaakisi kwa karibu zaidi maneno ya Kiebrania ya Zaburi 51:4, ilhali maneno ya Kigiriki katika Waroma kwa kawaida hueleweka kuwa “utakapohukumiwa.”
    reason: alternative_reading
lexical_decisions:
- source_word: μὴ γένοιτο
  choice: Hasha!
  rationale: Nahau hii ya Kiswahili inawasilisha kwa ufupi na kwa nguvu ukataaji mkali wa Paulo.
- source_word: γινέσθω δὲ ὁ θεὸς ἀληθής
  choice: Bali Mungu na aonekane kuwa wa kweli
  rationale: Muundo huu unadumisha nguvu ya agizo la γινέσθω na unaonyesha kwamba ukweli wa Mungu uthibitike wazi, bila kudokeza kwamba hapo awali Mungu hakuwa wa kweli.
- source_word: πᾶς δὲ ἄνθρωπος ψεύστης
  choice: na kila mwanadamu kuwa mwongo
  rationale: “Kila mwanadamu” inaonyesha maana ya jumla ya ἄνθρωπος na nguvu ya distributivu ya πᾶς; “mwongo” ni kisawe cha moja kwa moja cha ψεύστης.
- source_word: καθὼς γέγραπται
  choice: kama ilivyoandikwa
  rationale: Hii ni kauli ya kawaida na ya asili ya kutanguliza nukuu ya Maandiko.
- source_word: δικαιωθῇς
  choice: uthibitishwe kuwa mwenye haki
  rationale: Katika muktadha huu wa Mungu, kitenzi kina maana ya kimahakama ya kuonyeshwa au kuthibitishwa kuwa mwenye haki, si kufanywa mwenye haki kimaadili.
- source_word: ἐν τοῖς λόγοις σου
  choice: katika maneno yako
  rationale: Tafsiri ya moja kwa moja inayofaa muktadha wa nukuu ya Zaburi.
- source_word: νικήσεις
  choice: ushinde
  rationale: Neno hili la kawaida la Kiswahili linawasilisha kufanikiwa au kuwa na ushindi katika muktadha wa hukumu.
- source_word: ἐν τῷ κρίνεσθαί σε
  choice: unapohukumiwa
  rationale: Hii inafuata usomaji wa kawaida wa umbo la Kigiriki kama kauli tendwa, huku usomaji unaoakisi Kiebrania cha Zaburi ukihifadhiwa katika tanbihi.
theological_decisions:
- issue: Maana ya kimahakama ya δικαιωθῇς inaposemwa kuhusu Mungu
  choice: uthibitishwe kuwa mwenye haki
  alternative: uhesabiwe kuwa mwenye haki; uonekane kuwa uko sawa
  rationale: Mstari hauonyeshi kwamba Mungu anafanywa kuwa mwenye haki, bali kwamba maneno yake yanathibitisha kuwa yeye yuko upande wa haki dhidi ya uongo wa wanadamu.
- issue: Kauli tendwa au tendaji katika ἐν τῷ κρίνεσθαί σε
  choice: unapohukumiwa
  alternative: unapohukumu
  rationale: Kigiriki cha Waroma kwa kawaida husomeka kama kauli tendwa, lakini Kiebrania cha Zaburi 51:4 kinaunga mkono tafsiri ya “unapohukumu”; tofauti hiyo imewekwa wazi bila kuifuta.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kimaandiko lakini kinachoeleweka kwa msomaji wa kawaida. “Hasha!” limetumiwa kama ukataaji mkali uliozoeleka; lugha ya kimahakama imehifadhiwa katika nukuu.
