review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the emphatic repudiation, the contrast between God and humanity, and the passive reading of ἐν τῷ κρίνεσθαί σε. However, “Mungu na aonekane kuwa wa kweli” adds an evidential nuance (“be seen/shown”) not stated by γινέσθω and is less direct than the Greek’s imperative force. “Mungu na awe wa kweli” is both closer and natural. The quotation’s δικαιωθῇς is best expressed as God being proved/vindicated as right; the draft's wording is defensible, but “uthibitishwe kuwa wa haki” is smoother and avoids the potentially soteriological resonance of “mwenye haki.”
  naturalness: “Hasha!” and “kama ilivyoandikwa” are idiomatic in a formal biblical register. The revised parallel construction, “Mungu awe wa kweli, na kila mwanadamu awe mwongo,” is more balanced and fluent than mixing “aonekane” with an infinitive “kuwa.” “Utakapohukumiwa” provides a direct, natural future sense matching the quoted aorist subjunctive construction.
  terminology: “Wa kweli” and “mwongo” preserve the intended antithesis. “Uthibitishwe kuwa wa haki” retains the judicial-vindicatory sense of δικαιωθῇς without implying that God is made righteous. The alternative “uonekane kuwa uko sawa” is colloquial and weak for the formal judicial context; “uonekane kuwa wa haki” is preferable. Footnote b correctly notes the Hebrew-based alternative while retaining Romans’ most natural passive Greek reading.
  issues:
  - severity: medium
    issue: “Mungu na aonekane kuwa wa kweli” over-specifies γινέσθω.
    rationale: The Greek calls for God to be regarded/acknowledged as true in the stated contrast; “aonekane” introduces the additional idea of appearing or being visibly demonstrated. “Mungu awe wa kweli” is more formally equivalent and idiomatic.
  - severity: low
    issue: 'The main clause is syntactically uneven: “Mungu na aonekane ... na kila mwanadamu kuwa mwongo.”'
    rationale: Using matching subjunctive predicates (“awe ... awe”) more clearly represents the coordinated Greek imperatival construction.
  - severity: low
    issue: Footnote a’s alternative “uonekane kuwa uko sawa” is too conversational and does not maintain the judicial register.
    rationale: A formal alternative such as “uonekane kuwa wa haki” better conveys vindication in this scriptural citation.
