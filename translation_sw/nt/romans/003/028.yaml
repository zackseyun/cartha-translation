  yaml_path: translation/nt/romans/003/028.yaml
  text: For we conclude that a person is justified by faith apart from works of the law[a][b].
translation:
  language: sw
  text: Kwa maana tunahitimisha kwamba mtu anahesabiwa haki[a] kwa imani, pasipo matendo ya sheria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hutangazwa kuwa mwadilifu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λογιζόμεθα
  choice: tunahitimisha
  rationale: Kitenzi hiki kinaonyesha uamuzi unaotokana na hoja ya Paulo. “Tunahitimisha” ni Kiswahili cha kawaida kinachofaa mtiririko wa hoja.
- source_word: γάρ
  choice: Kwa maana
  rationale: Kiunganishi hiki kinaonyesha kuwa kauli hii inatoa msingi au ufafanuzi wa hoja iliyotangulia.
- source_word: δικαιοῦσθαι
  choice: huhesabiwa kuwa mwadilifu
  rationale: Usemi huu unaweka wazi tendo la Mungu la kumtambua au kumtangaza mtu kuwa mwadilifu, huku ukihifadhi maana ya kisheria ya neno katika hoja ya Paulo.
- source_word: πίστει
  choice: kwa imani
  rationale: Hii ni tafsiri ya kawaida na ya moja kwa moja ya hali ya tendo inayoonyeshwa hapa, bila kufafanua kupita kiasi imani hiyo.
- source_word: ἄνθρωπον
  choice: mtu
  rationale: Ingawa nomino ya Kigiriki ina umbo la kiume kisarufi, hapa inatumiwa kwa maana ya jumla inayomhusu mwanadamu yeyote; “mtu” huwasilisha maana hiyo kwa kawaida.
- source_word: χωρὶς
  choice: pasipo
  rationale: “Pasipo” huonyesha kutengwa au kutohusishwa kwa matendo ya sheria katika msingi wa kuhesabiwa kuwa mwadilifu.
- source_word: ἔργων νόμου
  choice: matendo ya sheria
  rationale: Tafsiri hii huhifadhi usemi muhimu wa Paulo na uhusiano wake wa moja kwa moja na νόμος, bila kuupunguza kuwa matendo mema kwa jumla au juhudi za kimaadili pekee.
theological_decisions:
- issue: Maana ya δικαιοῦσθαι katika matumizi ya Paulo
  choice: huhesabiwa kuwa mwadilifu
  alternative: hutangazwa kuwa mwadilifu
  rationale: Chaguo la matini kuu ni usemi unaoeleweka katika Kiswahili cha Biblia na huhifadhi wazo la hadhi ya uadilifu inayotolewa au kutambuliwa. Tanbihi inaonyesha wazi zaidi maana ya kutangaza bila kulazimisha ufafanuzi mmoja katika matini kuu.
- issue: Maana ya jumla ya ἄνθρωπον
  choice: mtu
  alternative: mwanadamu
  rationale: “Mtu” huonyesha kwa usahihi kwamba Paulo hamkusudii mwanamume pekee, bali mtu yeyote, na hufanya hivyo bila tanbihi isiyohitajika katika Kiswahili.
- issue: Upeo wa ἔργων νόμου
  choice: matendo ya sheria
  alternative: matendo yanayoagizwa na sheria
  rationale: Usemi wa karibu na muundo wa Kigiriki huhifadhi mvutano na uwezekano wa maana katika hoja ya Paulo badala ya kuamua mapema ikiwa anamaanisha amri fulani, juhudi zote za kibinadamu, au alama maalumu za utambulisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo ni mfupi na wa kihoja; “mtu” hutumika kwa maana ya jumla, na usemi wa Paulo “matendo ya sheria” umehifadhiwa bila kuufafanua kupita kiasi.
