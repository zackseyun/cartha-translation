  text: οἱ γὰρ ἄρχοντες οὐκ εἰσὶν φόβος ⸂τῷ ἀγαθῷ ἔργῳ⸃ ἀλλὰ ⸂τῷ κακῷ⸃. θέλεις δὲ μὴ φοβεῖσθαι τὴν ἐξουσίαν; τὸ ἀγαθὸν ποίει, καὶ ἕξεις ἔπαινον ἐξ αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/003.yaml
  text: For rulers are not a terror to good conduct[a], but to bad. But if you do not want to fear the authority, do what is good[c][b], and you will have praise from it.
translation:
  language: sw
  text: Kwa maana watawala si wa kuogopwa kwa sababu ya mwenendo mwema, bali kwa sababu ya mwenendo mbaya.[a] Lakini je, unataka kutoiogopa mamlaka?[b] Tenda mema, nawe utapata sifa kutoka kwa mamlaka hiyo.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa tendo jema … kwa tendo baya.” Kigiriki kinatofautisha yaliyo mema na yaliyo mabaya katika maana ya jumla ya kimaadili.
    reason: lexical_alternative
  - marker: b
    text: 'Au “Je, ungependa kutokuwa na hofu ya mamlaka?” Kigiriki kina muundo wa swali la balagha: “Je, unataka kutoiogopa mamlaka?”'
    reason: lexical_alternative
  - marker: c
    text: Yaani, sifa kutoka kwa mamlaka ya serikali.
    reason: referent_clarification
lexical_decisions:
- source_word: ἄρχοντες
  choice: watawala
  rationale: Neno hili humaanisha watu wanaotawala au kushika madaraka ya utawala; “watawala” linafaa katika muktadha wa serikali bila kubainisha cheo fulani.
- source_word: φόβος
  choice: tisho
  rationale: Hapa ni nomino ya kiarifu yenye maana ya kitu kinachosababisha hofu. “Tisho” linahifadhi nguvu ya usemi wa Kigiriki kwa Kiswahili cha kawaida.
- source_word: τῷ ἀγαθῷ ἔργῳ … τῷ κακῷ
  choice: kwa mwenendo mwema … kwa mwenendo mbaya
  rationale: Ingawa ἔργῳ ni umoja, utofautishaji huu ni wa jumla na wa kimaadili. “Mwenendo” unaonyesha tabia na matendo kwa ujumla, huku ukihifadhi ulinganifu kati ya mema na mabaya.
- source_word: θέλεις δὲ μὴ φοβεῖσθαι
  choice: Je, unataka usiiogope
  rationale: Muundo huu unahifadhi swali la balagha la Kigiriki na maana ya kutaka kutokuwa na hofu, kwa Kiswahili kinachoeleweka.
- source_word: ἐξουσίαν
  choice: mamlaka
  rationale: Umoja wenye kibainishi humrejelea mwenye mamlaka au mamlaka ya serikali kama taasisi. “Mamlaka” huhifadhi upana huo bila kuibana kuwa afisa mmoja.
- source_word: τὸ ἀγαθὸν ποίει
  choice: Tenda mema
  rationale: Kivumishi chenye kibainishi kimetumika kama nomino na kinarejelea yaliyo mema kimaadili. “Tenda mema” ni usemi mfupi na wa kawaida wenye maana hiyo.
- source_word: ἕξεις ἔπαινον ἐξ αὐτῆς
  choice: utapata sifa kutoka kwake
  rationale: “Utapata sifa” ni Kiswahili cha asili kinachowasilisha ἕξεις ἔπαινον, na “kutoka kwake” humrejelea mamlaka iliyotajwa bila kuongeza mhusika mwingine.
theological_decisions:
- issue: Upeo wa kauli kuhusu watawala na kusifiwa kwa mema
  choice: Kauli imetafsiriwa kama maelezo ya kazi ya kawaida ya mamlaka ya serikali, bila kuongeza kwamba kila mtawala hutenda hivyo nyakati zote.
  alternative: Kuitafsiri kama ahadi isiyo na masharti kwamba watawala wote daima huwasifu watendao mema, au kama usemi wa kejeli.
  rationale: Maneno ya mstari yanaeleza jukumu la mamlaka katika muktadha, lakini hayatoi ishara ya kejeli wala hayalazimishi tafsiri kuondoa mvutano unaotokana na matendo halisi ya watawala.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Si tisho” na “mwenendo mwema/mwendo mbaya” ni wazi kwa wasomaji wa kawaida, huku swali la balagha likihifadhiwa badala ya kubadilishwa kimya kuwa sentensi ya sharti.
