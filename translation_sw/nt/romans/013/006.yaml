  text: διὰ τοῦτο γὰρ καὶ φόρους τελεῖτε, λειτουργοὶ γὰρ θεοῦ εἰσιν εἰς αὐτὸ τοῦτο προσκαρτεροῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/006.yaml
  text: For because of this you also pay taxes, for they are God’s ministers, devoting themselves to this very thing.
translation:
  language: sw
  text: Kwa sababu hiyo pia mnalipa kodi, kwa maana wao ni watumishi wa Mungu, wakidumu kujitoa kwa jambo hilohilo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φόρους τελεῖτε
  choice: mnalipa kodi
  rationale: Kitenzi τελεῖτε pamoja na φόρους humaanisha kulipa kodi; huu ni usemi wa kawaida na wazi katika Kiswahili sanifu.
- source_word: λειτουργοὶ θεοῦ
  choice: watumishi wa Mungu
  rationale: Neno λειτουργοί hapa linawahusu wenye mamlaka kama watendaji wa huduma ya umma kwa Mungu; “watumishi” huhifadhi maana pana bila kuingiza cheo maalumu cha kidini.
- source_word: προσκαρτεροῦντες
  choice: wakijitoa daima
  rationale: Huwasilisha wazo la kudumu, kushikamana, na kujitolea kwa shughuli fulani.
- source_word: εἰς αὐτὸ τοῦτο
  choice: kwa kazi hiyo hiyo
  rationale: Hurejelea hasa wajibu uliotajwa katika muktadha, huku ikihifadhi msisitizo wa αὐτὸ τοῦτο.
theological_decisions:
- issue: Hadhi ya wenye mamlaka kama λειτουργοὶ θεοῦ
  choice: wao ni watumishi wa Mungu
  alternative: wao wanamtumikia Mungu
  rationale: Muundo wa nomino katika Kigiriki unasema wao ni watumishi wa Mungu; tafsiri hii huhifadhi dai hilo moja kwa moja bila kulipanua kuwa idhini isiyo na mipaka kwa kila tendo lao.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Wingi wa nafsi ya pili katika “mnalipa” umehifadhiwa, na mtiririko wa sababu unaorudiwa kwa γὰρ umetafsiriwa kwa “Kwa sababu hiyo ... kwa maana” ili usikike kwa kawaida.
