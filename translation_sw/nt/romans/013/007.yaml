base_translation:
  language: en
  yaml_path: translation/nt/romans/013/007.yaml
  text: 'Pay to all what is owed: to the one due tax, tax; to the one due revenue, revenue; to the one due fear, fear; to the one due honor, honor.'
translation:
  language: sw
  text: 'Wapeni watu wote yale mnayopaswa kuwapa: kwa anayepaswa kulipwa kodi, kodi; kwa anayepaswa kulipwa ushuru, ushuru; kwa anayepaswa kuhofiwa, hofu; kwa anayepaswa kuheshimiwa, heshima.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπόδοτε
  choice: Wapeni
  rationale: Kitenzi hiki kina maana ya kutoa au kulipa kile kinachodaiwa; “wapeni” kinafaa kwa vitu vya fedha na wajibu wa hofu na heshima.
- source_word: ὀφειλάς
  choice: wanachostahili
  rationale: Huwakilisha mambo yanayodaiwa au yaliyo wajibu kwa kila mhusika, kwa lugha ya kawaida na yenye kueleweka.
- source_word: φόρον
  choice: kodi
  rationale: Huelekea kumaanisha kodi ya moja kwa moja, hasa kodi iliyotozwa na serikali kwa watu au mali.
- source_word: τέλος
  choice: ushuru
  rationale: Hutofautisha ada au ushuru wa bidhaa na foron, kodi ya moja kwa moja.
- source_word: φόβον
  choice: hofu
  rationale: Hifadhi maana ya msingi ya neno la Kigiriki na mvutano wa kifungu; tafsiri “heshima” ingeondoa uwezekano wa hofu halisi.
- source_word: τιμήν
  choice: heshima
  rationale: Hapa humaanisha hadhi au heshima inayopaswa kutolewa kwa mtu.
theological_decisions:
- issue: Maana ya φόβος katika wajibu kwa wenye mamlaka
  choice: hofu
  alternative: staha
  rationale: “Hofu” inafuata maana ya moja kwa moja ya Kigiriki na haiufanyi usemi kuwa mwito wa staha pekee; tofauti yake na “heshima” mwishoni pia inabaki wazi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kurudia wa Kigiriki umehifadhiwa kwa msisitizo na ulinganifu.
