  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: θεοῦ γὰρ διάκονός ἐστιν σοὶ εἰς τὸ ἀγαθόν. ἐὰν δὲ τὸ κακὸν ποιῇς, φοβοῦ· οὐ γὰρ εἰκῇ τὴν μάχαιραν φορεῖ· θεοῦ γὰρ διάκονός ἐστιν, ἔκδικος εἰς ὀργὴν τῷ τὸ κακὸν πράσσοντι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/004.yaml
  text: For it is God’s servant for your good[a]. But if you do what is evil, be afraid, for it does not bear the sword for nothing. For it is God’s servant[b], an avenger for wrath against the one who practices evil.
translation:
  language: sw
  text: Kwa maana mamlaka hiyo ni mtumishi wa Mungu kwa mema yako. Lakini ukitenda lililo ovu, ogopa, kwa maana haibebi upanga bure[a]. Kwa maana ni mtumishi wa Mungu, mwenye kulipiza kisasi anayeleta ghadhabu juu ya mtu anayetenda uovu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “bila sababu” au “pasipo kusudi.”
    reason: lexical_alternative
  - marker: b
    text: Au “mwenye kulipiza kisasi kwa ajili ya ghadhabu dhidi ya mtu anayetenda uovu.”
    reason: alternative_reading
lexical_decisions:
- source_word: διάκονός
  choice: mtumishi
  rationale: Neno hili humaanisha wakala anayehudumu au kutekeleza agizo. “Mtumishi” ni la kawaida na linafaa kwa mamlaka inayotekeleza wajibu chini ya Mungu bila kulifanya neno kuwa cheo cha kanisa.
- source_word: σοὶ εἰς τὸ ἀγαθόν
  choice: kwa faida yako
  rationale: Muundo huu unaonyesha kusudi au matokeo yenye manufaa kwa mhusika; “kwa faida yako” ni Kiswahili cha asili na hudumisha uhusiano wa σοὶ na τὸ ἀγαθόν.
- source_word: τὸ κακὸν ποιῇς
  choice: ukitenda lililo ovu
  rationale: Kauli hii inahusu ubaya wa kimaadili. “Lililo ovu” hudumisha nguvu hiyo na ni ya hadhi kuliko tafsiri finyu ya madhara.
- source_word: φοβοῦ
  choice: ogopa
  rationale: Amri hii inaelekeza mtu aihofu kazi ya mamlaka ya kuadhibu; “ogopa” ni ya moja kwa moja na ya kawaida.
- source_word: εἰκῇ
  choice: bure
  rationale: “Bure” huonyesha kuwa kubeba upanga si bila kusudi au matokeo, huku tanbihi ikihifadhi maana mbadala ya “bila sababu.”
- source_word: μάχαιραν φορεῖ
  choice: haibebi upanga
  rationale: “Kubeba upanga” huhifadhi picha halisi na ishara ya mamlaka ya kuadhibu; kitenzi cha Kigiriki pia huweza kumaanisha kuubeba kwa kawaida kama alama ya wajibu.
- source_word: ἔκδικος
  choice: mlipizaji wa kisasi
  rationale: Neno hili humtaja mwenye kutekeleza haki ya kulipiza au kisasi. Uchaguzi huu huhifadhi uzito wa kulipiza uliopo katika Kigiriki.
- source_word: εἰς ὀργὴν
  choice: anayeleta ghadhabu
  rationale: Kauli hii ya Kiswahili ni ya asili kuliko “kwa ajili ya ghadhabu” na haibainishi wazi kuwa ghadhabu hiyo ni ya nani, kama vile Kigiriki kisivyosema wazi hapa.
- source_word: τῷ τὸ κακὸν πράσσοντι
  choice: juu ya mtu anayetenda uovu
  rationale: Kirai hiki humweleza mtu kwa mwenendo wake unaoendelea. “Mtu anayetenda uovu” huhifadhi maana hiyo bila kumfupisha kuwa tu “mwovu.”
- source_word: γὰρ
  choice: kwa maana
  rationale: Kiunganishi hiki kinaonyesha maelezo au sababu katika hoja ya Paulo; “kwa maana” hudumisha mtiririko huo.
theological_decisions:
- issue: Uhusiano wa jukumu la mamlaka la kuadhibu na ghadhabu
  choice: Kutafsiri εἰς ὀργὴν kuwa “anayeleta ghadhabu” bila kuongeza “ya Mungu” katika matini kuu.
  alternative: “anayetekeleza ghadhabu ya Mungu” au “anayeleta adhabu”
  rationale: Muktadha huunganisha mamlaka na utumishi kwa Mungu, lakini kirai chenyewe hakirudii wazi neno “Mungu.” Tafsiri iliyochaguliwa huhifadhi uhusiano huo na pia kutobainika kwa mwenye ghadhabu.
- issue: Utambulisho wa διάκονος katika muktadha
  choice: Kumtaja wazi kama “mamlaka hiyo” katika sentensi ya kwanza.
  alternative: “yeye” au “ni mtumishi”
  rationale: Mhusika anatokana na mamlaka inayotajwa katika muktadha wa karibu. Kiswahili huhitaji urejeo ulio wazi zaidi, na uchaguzi huu haubadili jukumu lake la kuwa mtumishi wa Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni wazi kwa wasomaji wa kawaida, huku maneno “mtumishi,” “upanga,” “mlipizaji wa kisasi,” na “ghadhabu” yakihifadhi picha na mvutano wa matini ya Kigiriki.
