  text: διὸ ἀνάγκη ὑποτάσσεσθαι, οὐ μόνον διὰ τὴν ὀργὴν ἀλλὰ καὶ διὰ τὴν συνείδησιν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/005.yaml
  text: Therefore it is necessary to submit[a], not only because of wrath but also because of conscience[b],
translation:
  language: sw
  text: Kwa hiyo, ni lazima kujitiisha[a], si kwa sababu ya ghadhabu[b] tu, bali pia kwa sababu ya dhamiri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuwa chini ya mamlaka.”
    reason: lexical_alternative
  - marker: b
    text: Au, “adhabu.” Kigiriki kinasema “ghadhabu,” ambayo inaweza kumaanisha hatua ya mtawala ya kuadhibu au, kwa maana pana zaidi, ghadhabu ya Mungu inayotekelezwa kupitia mamlaka ya serikali.
    reason: alternative_reading
lexical_decisions:
- source_word: διὸ
  choice: Kwa hiyo
  rationale: Kiunganishi hiki kinaonyesha hitimisho linalotokana na hoja iliyotangulia kuhusu mamlaka zinazotawala.
- source_word: ἀνάγκη
  choice: ni lazima
  rationale: Huwasilisha ulazima kwa lugha ya kawaida na ya moja kwa moja bila kuongeza mhusika ambaye Kigiriki hakimtaji.
- source_word: ὑποτάσσεσθαι
  choice: kujitiisha
  rationale: Kitenzi hiki kinaonyesha kukubali kuwa chini ya mamlaka. ‘Kujitiisha’ ni cha asili katika Kiswahili na hakiongezi wazo la kutii kila amri bila mipaka.
- source_word: οὐ μόνον … ἀλλὰ καὶ
  choice: si … tu, bali pia
  rationale: Muundo huu wa Kiswahili unahifadhi ulinganisho wa sababu mbili ulio katika Kigiriki.
- source_word: διὰ τὴν ὀργὴν
  choice: kwa sababu ya ghadhabu
  rationale: διά pamoja na hali ya kushutumiwa huonyesha sababu, na ‘ghadhabu’ huhifadhi maana ya ὀργή bila kuamua ikiwa ni ghadhabu ya Mungu au hatua ya kuadhibu ya mtawala.
- source_word: διὰ τὴν συνείδησιν
  choice: kwa sababu ya dhamiri
  rationale: ‘Dhamiri’ ni neno la kawaida la Kiswahili kwa συνείδησις na hapa linaonyesha msukumo wa ndani wa kimaadili.
theological_decisions:
- issue: Mhusika wa ghadhabu (ὀργή)
  choice: ghadhabu
  alternative: adhabu; ghadhabu ya Mungu; hatua ya mtawala ya kuadhibu
  rationale: Muktadha unahusisha mamlaka iliyowekwa na Mungu na mtawala anayeadhibu uovu, lakini mstari huu haumtajii wazi mwenye ghadhabu. Tafsiri inadumisha utata huo.
- issue: Nguvu ya ὑποτάσσεσθαι kwa habari ya mamlaka zinazotawala
  choice: kujitiisha
  alternative: kuwa chini ya mamlaka
  rationale: ‘Kujitiisha’ huonyesha msimamo unaodaiwa kwa mamlaka bila kuingiza fundisho pana la utii usio na mipaka.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Muundo mfupi wa sentensi na jozi ‘si … tu, bali pia’ huhifadhi mantiki ya maandishi ya Kigiriki.
