base_translation:
  language: en
  yaml_path: translation/nt/romans/013/008.yaml
  text: Owe no one anything[a], except to love one another; for the one who loves another has fulfilled the law.
translation:
  language: sw
  text: Msiwe na deni lolote kwa mtu yeyote, isipokuwa deni la kupendana; kwa maana anayempenda mwingine[a] ameitimiza sheria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kigiriki: “yule mwingine.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μηδενὶ μηδὲν ὀφείλετε
  choice: Msiwe na deni lolote kwa mtu yeyote
  rationale: Huhifadhi katazo pana la kutodaiwa kitu chochote na mtu yeyote kwa Kiswahili cha kawaida, bila kulipanua kuwa tamko mahsusi kuhusu kila aina ya kukopa.
- source_word: εἰ μὴ τὸ ἀλλήλους ἀγαπᾶν
  choice: isipokuwa la kupendana
  rationale: Muundo huu unaonyesha kwamba kupendana ndilo jukumu pekee linaloendelea, huku kirejeshi “la” kikirejelea deni lililotajwa mwanzoni.
- source_word: ἀγαπᾶν / ἀγαπῶν
  choice: kupendana / anayempenda
  rationale: “Kupenda” ni neno la kawaida, lenye heshima, na linadumisha uhusiano wa kileksika kati ya vitenzi viwili vya Kigiriki.
- source_word: τὸν ἕτερον
  choice: mwingine
  rationale: “Mwingine” ni Kiswahili cha asili kinachowasilisha maana ya mtu aliye tofauti na mhusika bila kuingiza neno “jirani,” ambalo halipo katika kifungu hiki.
- source_word: νόμον πεπλήρωκεν
  choice: ameitimiza sheria
  rationale: Wakati timilifu wa Kigiriki unaonyesha tendo lililotimizwa lenye matokeo yanayoendelea; “ameitimiza” hulihifadhi vizuri, na “sheria” hapa ni ile sheria inayojulikana inayozungumziwa na Paulo.
theological_decisions:
- issue: Upeo wa katazo la kuwa na deni
  choice: Kutoa katazo moja kwa moja la kuwa na deni, bila kulifafanua kuwa marufuku kamili ya kila aina ya kukopa.
  alternative: Kulitafsiri kama marufuku ya moja kwa moja ya ukopaji wote, au kama sitiari tu ya wajibu wa kimaadili.
  rationale: Kigiriki kinatumia lugha halisi ya kudaiwa na kisha kutaja upendo kuwa jambo la pekee linalodaiwa. Tafsiri inadumisha mvutano huo bila kuamua mjadala mpana wa kimaadili.
- issue: Maana ya kutimiza sheria kwa njia ya upendo
  choice: Kudumisha usemi “ameitimiza sheria” bila kueleza zaidi jinsi utimilifu huo unavyohusiana na utii wa sheria.
  alternative: Kufafanua kuwa upendo hubatilisha sheria au kwamba ni sawa na kushika kila amri kikamilifu.
  rationale: Kifungu kinasema kwamba anayempenda mwingine ameitimiza sheria, lakini hakifafanui hapa matokeo yote ya kiteolojia ya kauli hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo wa “deni ... isipokuwa la kupendana” huhifadhi sitiari ya deni na wajibu bila kuwa mgumu.
