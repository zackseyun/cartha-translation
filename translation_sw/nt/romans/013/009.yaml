language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: τὸ γάρ· Οὐ μοιχεύσεις, Οὐ φονεύσεις, Οὐ κλέψεις, Οὐκ ἐπιθυμήσεις, καὶ εἴ τις ἑτέρα ἐντολή, ἐν ⸂τῷ λόγῳ τούτῳ⸃ ἀνακεφαλαιοῦται, ⸂ἐν τῷ⸃· Ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/009.yaml
  text: 'For this: “You shall not commit adultery[a], you shall not murder, you shall not steal, you shall not covet,” and if there is any other commandment[b], it is summed up in this word: “You shall love your neighbor as yourself.”'
translation:
  language: sw
  text: 'Kwa maana, “Usizini, usiue[a], usiibe, usitamani,” na kama kuna amri nyingine yoyote, hizi zote hujumlishwa katika kauli hii[b]: “Mpende jirani yako kama unavyojipenda mwenyewe.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kitenzi cha Kigiriki hapa kinamaanisha kuua mtu kinyume cha sheria, yaani kufanya mauaji, wala si kila aina ya kuondoa uhai.
    reason: lexical_alternative
  - marker: b
    text: Au, “katika neno hili.” Neno la Kigiriki linaweza kumaanisha “neno,” “kauli,” au “usemi” katika muktadha huu.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ γάρ
  choice: Kwa maana amri hizi
  rationale: Kifungu hiki kinatanguliza orodha ya amri inayofafanua kauli iliyotangulia. Neno “amri” limewekwa wazi kwa Kiswahili cha kawaida, ingawa katika Kigiriki linaeleweka kutokana na muktadha.
- source_word: Οὐ μοιχεύσεις
  choice: Usizini
  rationale: Wakati ujao wa Kigiriki umetumiwa kama amri katika nukuu ya Amri Kumi. Kiswahili hutumia umbo la katazo “usi-,” linalohifadhi uzito wa kisheria na uhusiano na Maandiko.
- source_word: Οὐ φονεύσεις
  choice: usiue
  rationale: Hili ndilo tamko la kawaida na lenye hadhi katika nukuu ya Amri Kumi kwa Kiswahili. Katika muktadha huu φονεύω humaanisha kuua mtu kinyume cha sheria; tanbihi inazuia maana kupanuliwa hadi kila aina ya kuondoa uhai.
- source_word: Οὐ κλέψεις
  choice: usiibe
  rationale: Umbo la katazo ni la moja kwa moja, la kawaida, na linalingana na mtindo wa amri nyingine katika orodha.
- source_word: Οὐκ ἐπιθυμήσεις
  choice: usitamani
  rationale: Katika muktadha wa Amri Kumi, “kutamani” hueleza tamaa ya kile kisicho cha mtu, huku ikihifadhi ufupi wa maandishi ya Kigiriki.
- source_word: εἴ τις ἑτέρα ἐντολή
  choice: na kama kuna amri nyingine yoyote
  rationale: “Kama kuna” huhifadhi muundo wa sharti, na “nyingine yoyote” huhifadhi maana isiyoainishwa ya τις pamoja na wigo mpana wa ἑτέρα.
- source_word: ἀνακεφαλαιοῦται
  choice: inajumlishwa
  rationale: Kitenzi hiki humaanisha kukusanya mambo chini ya kichwa au muhtasari mmoja. “Inajumlishwa” ni Kiswahili cha sasa kilicho wazi na kinachofaa hoja ya Paulo.
- source_word: ἐν τῷ λόγῳ τούτῳ
  choice: katika kauli hii
  rationale: λόγος hapa si lazima iwe neno moja, bali tamko linalofuata. “Kauli” huwasilisha maana hiyo kwa uwazi bila kuongeza ufafanuzi wa kimafundisho; “neno” limetolewa kama uwezekano katika tanbihi.
- source_word: Ἀγαπήσεις τὸν πλησίον σου
  choice: Mpende jirani yako
  rationale: Kiswahili hutumia amri ya moja kwa moja kwa njia ya asili. “Jirani” huhifadhi istilahi ya Maandiko na uhusiano wa nukuu na Walawi 19:18.
- source_word: ὡς σεαυτόν
  choice: kama unavyojipenda mwenyewe
  rationale: Kigiriki kinasema kwa ufupi “kama wewe mwenyewe.” Kiswahili hiki huweka wazi kitenzi kinachoeleweka na kutoa ulinganisho wa asili bila kubadili maana.
theological_decisions:
- issue: Namna ya kutafsiri makatazo ya Amri Kumi
  choice: Kutumia maumbo ya katazo “Usizini, usiue, usiibe, usitamani”
  alternative: Kutumia maelezo kama “Hupaswi…”
  rationale: Maumbo ya “usi-” ni amri za moja kwa moja katika Kiswahili na yanadumisha uzito pamoja na mwangwi wa nukuu ya Amri Kumi, ingawa Kigiriki kimetumia wakati ujao kwa maana ya amri.
- issue: Wigo wa λόγος katika ἐν τῷ λόγῳ τούτῳ
  choice: “kauli” yenye maana ya tamko linalojumlisha amri
  alternative: “neno” au “usemi”
  rationale: Paulo anarejelea tamko zima linalofuata, si lazima neno moja pekee. “Kauli” huonyesha jambo hilo bila kuifanya amri ya upendo kuwa maelezo ya kimadhehebu au kuondoa mwangwi wa λόγος; uwezekano wa “neno” umehifadhiwa katika tanbihi.
- issue: Maana ya φονεύω katika katazo
  choice: “usiue,” ikifafanuliwa kuwa mauaji ya mtu kinyume cha sheria
  alternative: “usifanye mauaji”
  rationale: “Usiue” hudumisha muundo unaotambulika wa Amri Kumi kwa Kiswahili, lakini tanbihi inaweka mpaka wa kimaana wa kitenzi cha Kigiriki ili kisieleweke kuwa kinakataza kila aina ya kuondoa uhai.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi, na rahisi kueleweka. Nukuu za amri zimetolewa kwa maumbo mafupi yanayotambulika katika mapokeo ya Maandiko. Alama za tanbihi zimewekwa kwenye maneno yanayohusika, kwa kuwa alama na maelezo katika safu ya ushauri ya Kiingereza zilionekana kutolingana.
