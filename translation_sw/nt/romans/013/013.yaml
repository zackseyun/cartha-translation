  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὡς ἐν ἡμέρᾳ εὐσχημόνως περιπατήσωμεν, μὴ κώμοις καὶ μέθαις, μὴ κοίταις καὶ ἀσελγείαις, μὴ ἔριδι καὶ ζήλῳ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/013.yaml
  text: Let us walk properly as in the daytime[a], not in revelries and drunkenness, not in sexual immorality and sensuality[b], not in strife and jealousy.
translation:
  language: sw
  text: Na tuenende kwa heshima, kama wakati wa mchana—si kwa sherehe za kupindukia na ulevi, si kwa uasherati na ufisadi, wala si kwa ugomvi na wivu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, husuda. Neno la Kigiriki linaweza kumaanisha wivu au husuda; katika orodha hii lina maana hasi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς ἐν ἡμέρᾳ
  choice: kama wakati wa mchana
  rationale: Inahifadhi picha ya mwenendo unaofaa kufanywa wazi mchana na tofauti yake na matendo ya giza katika muktadha, bila kuongeza ufafanuzi wa kitheolojia.
- source_word: εὐσχημόνως
  choice: kwa heshima
  rationale: Kirai hiki kinaeleza mwenendo unaofaa, wa staha na unaokubalika hadharani. “Kwa heshima” ni Kiswahili cha kawaida na chenye hadhi.
- source_word: περιπατήσωμεν
  choice: Na tuenende
  rationale: Hifadhi sitiari ya Paulo ya “kwenda/kuenenda” kama namna ya maisha, huku umbo la himizo la nafsi ya kwanza wingi likiwakilishwa na “na tu-”.
- source_word: κώμοις
  choice: sherehe za kupindukia
  rationale: Neno hilo humaanisha karamu au sherehe zenye vurugu na anasa, mara nyingi zikiandamana na ulevi. Tafsiri hii haifinyangi maana kuwa uasherati pekee.
- source_word: μέθαις
  choice: ulevi
  rationale: Ni neno la kawaida la Kiswahili linaloeleza hali au mazoea ya kulewa.
- source_word: κοίταις
  choice: uasherati
  rationale: Ingawa maana ya msingi ni “vitanda,” hapa limetumiwa kiistiari kuhusu mahusiano au matendo ya ngono yasiyo halali. “Uasherati” huwasilisha maana hiyo kwa uwazi.
- source_word: ἀσελγείαις
  choice: mwenendo usio na kiasi
  rationale: Neno linaashiria mwenendo usio na aibu wala kujizuia, mara nyingi katika mambo ya kingono. Tafsiri hii inalinda upana wake badala ya kuifanya iwe dhambi moja maalumu.
- source_word: ἔριδι
  choice: ugomvi
  rationale: Huwasilisha kwa lugha ya sasa hali ya mzozo, mashindano ya uhasama au mabishano.
- source_word: ζήλῳ
  choice: wivu
  rationale: Katika orodha hii ya maovu, neno lina maana hasi ya husuda au wivu. “Wivu” ni pana na ya kawaida katika Kiswahili.
theological_decisions:
- issue: Sitiari ya mchana na giza katika himizo la kimaadili
  choice: Kudumisha picha hiyo kama “kama wakati wa mchana”
  alternative: kana kwamba ni mchana
  rationale: Mstari unashiriki tofauti ya mchana na usiku katika muktadha, lakini haupaswi kupanuliwa kuwa maelezo kamili ya mafundisho yasiyotajwa wazi hapa.
- issue: Matumizi ya kiistiari ya κοίταις
  choice: uasherati
  alternative: vitanda
  rationale: Tafsiri ya moja kwa moja “vitanda” ingeficha rejeo la wazi la kingono katika matumizi haya. Tafsiri kwa maana inaleta nguvu ya kimaadili ya kirai bila kukibana kuwa tendo moja maalumu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa vipashio vitatu vya kukataza umehifadhiwa kwa “si kwa …, si kwa …, wala si kwa …”. “Na tuenende” inadumisha mtindo wa kibiblia unaoeleweka, huku maneno mengine yakibaki ya kawaida kwa wasomaji wa leo.
