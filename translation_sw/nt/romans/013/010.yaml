  text: ἡ ἀγάπη τῷ πλησίον κακὸν οὐκ ἐργάζεται· πλήρωμα οὖν νόμου ἡ ἀγάπη.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/010.yaml
  text: Love does no harm to a neighbor[b][a]; therefore love is the fulfillment of the law.
translation:
  language: sw
  text: Upendo haumfanyii jirani jambo baya; kwa hiyo, upendo ndio utimilifu wa sheria.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ ἀγάπη
  choice: upendo
  rationale: “Upendo” ni neno la kawaida, la heshima na linaloeleweka kwa ἀγάπη; limerudiwa katika sehemu zote mbili ili kudumisha msisitizo na uhusiano wa kileksika wa Kigiriki.
- source_word: τῷ πλησίον
  choice: jirani
  rationale: Katika muktadha huu πλησίον humaanisha mtu mwingine aliye karibu nasi kwa wajibu wa kimaadili. “Jirani” ni tafsiri ya kawaida na ya asili katika Kiswahili.
- source_word: κακὸν οὐκ ἐργάζεται
  choice: haumfanyii jirani jambo baya
  rationale: Muundo huu unaonyesha kutenda au kusababisha jambo baya kwa mtu. Tafsiri hii ni ya asili katika Kiswahili na inadumisha kwa uwazi wazo la κακόν (“jambo baya/uovu”) badala ya kulifupisha kuwa madhara pekee.
- source_word: πλήρωμα
  choice: utimilifu
  rationale: “Utimilifu” huonyesha kile kinachoifikisha sheria kwenye ukamilifu au kusudi lake, huku ukidumisha muundo wa nomino wa sentensi ya Kigiriki.
- source_word: οὖν
  choice: kwa hiyo
  rationale: Huonyesha hitimisho linalotokana na kauli iliyotangulia kwa njia ya kawaida na wazi katika Kiswahili.
- source_word: νόμου
  choice: wa sheria
  rationale: “Sheria” hapa inarejelea sheria inayotambulika katika hoja ya Paulo; muundo “utimilifu wa sheria” ni wa asili na unaakisi hali ya umilikaji ya Kigiriki.
theological_decisions:
- issue: Uhusiano wa upendo na sheria
  choice: upendo ndio utimilifu wa sheria
  alternative: upendo huitimiliza sheria
  rationale: Kigiriki kina kishazi cha nomino, si kitenzi wazi kinachosema tu kwamba upendo “huitimiliza” sheria. “Ndio utimilifu” hudumisha muundo huo na mvutano wa dai la Paulo bila kufafanua kupita kiasi namna kila amri inavyohusiana na upendo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Hakuna tanbihi iliyohitajika, kwa kuwa maana kuu na muundo wa asili vinaweza kuwasilishwa wazi katika matini.
