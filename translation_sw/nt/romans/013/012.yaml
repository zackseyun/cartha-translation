  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἡ νὺξ προέκοψεν, ἡ δὲ ἡμέρα ἤγγικεν. ⸀ἀποβαλώμεθα οὖν τὰ ἔργα τοῦ σκότους, ⸂ἐνδυσώμεθα δὲ⸃ τὰ ὅπλα τοῦ φωτός.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/012.yaml
  text: The night is far gone[a]; the day has drawn near[b]. Therefore let us cast off the works of darkness and put on the armor of light.
translation:
  language: sw
  text: Usiku umesonga sana[a], na mchana umekaribia. Kwa hiyo, na tuyavue matendo ya giza na tujivike silaha za nuru[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Usiku umeendelea sana.” Kitenzi cha Kigiriki kinaonyesha usiku ukiwa umesonga mbele, yaani, sehemu yake kubwa imepita.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kigiriki linaweza pia kumaanisha “vifaa vya vita vya nuru.”
    reason: lexical_alternative
lexical_decisions:
- source_word: νὺξ
  choice: usiku
  rationale: Neno limetafsiriwa moja kwa moja ili kuhifadhi taswira ya wakati inayotofautishwa na “mchana,” bila kuichanganya mapema na maana ya kimaadili ya giza.
- source_word: προέκοψεν
  choice: umesonga sana
  rationale: Kitenzi kina wazo la kusonga mbele au kuendelea. Katika muktadha wa wakati, kauli hii inaonyesha kwamba sehemu kubwa ya usiku imepita huku ikihifadhi taswira asilia.
- source_word: ἡμέρα
  choice: mchana
  rationale: “Mchana” ni kinyume cha kawaida cha “usiku” katika Kiswahili na huhifadhi taswira ya wakati na maana yake ya kimaadili bila kuifafanua kupita kiasi.
- source_word: ἤγγικεν
  choice: umekaribia
  rationale: Wakati timilifu wa Kigiriki unaonyesha kwamba mchana umekuja karibu na sasa uko karibu; “umekaribia” ni kauli ya kawaida na yenye maana hiyo katika Kiswahili.
- source_word: ἀποβαλώμεθα
  choice: na tuyavue
  rationale: Ni kauli ya kuhimiza tendo la pamoja. “Kuvua” huhifadhi taswira ya kuondoa vazi na kuandaa ulinganifu na “kujivika.”
- source_word: ἔργα
  choice: matendo
  rationale: Katika Kiswahili cha sasa, “matendo” huwasilisha kwa kawaida kazi au mienendo ya kimaadili inayokusudiwa hapa.
- source_word: σκότους
  choice: giza
  rationale: Tafsiri ya moja kwa moja huhifadhi sitiari ya kimaadili na tofauti yake na nuru bila kuibadili kuwa maelezo kama “uovu.”
- source_word: ἐνδυσώμεθα
  choice: kujivika
  rationale: Kitenzi cha kujirejelea huhifadhi picha ya mtu kujivika na kinaendana kwa karibu na tendo la “kuvua.”
- source_word: ὅπλα
  choice: silaha
  rationale: Neno la Kigiriki linaweza kutaja silaha au vifaa vya vita kwa upana. “Silaha” linafaa pamoja na “kujivika” na halilazimishi maana ya silaha za kushambulia pekee.
- source_word: φωτός
  choice: nuru
  rationale: “Nuru” huhifadhi tofauti ya sitiari na “giza” pamoja na maana zake za kimaadili na za wakati ujao.
theological_decisions:
- issue: Sitiari ya nyakati za mwisho ya usiku na mchana
  choice: Taswira halisi ya “usiku” na “mchana” imehifadhiwa, huku maana yake ya kimaadili na ya historia ya wokovu ikiachwa ijitokeze katika muktadha.
  alternative: “Enzi hii ya giza inakaribia kwisha; enzi mpya iko karibu.”
  rationale: Maelezo ya moja kwa moja kuhusu enzi yangeamua maana ambayo maandishi asilia yanaiacha katika sitiari yenye mvutano wa wakati na maadili.
- issue: Maana ya ὅπλα τοῦ φωτός
  choice: silaha za nuru
  alternative: vifaa vya vita vya nuru; mavazi ya vita ya nuru
  rationale: “Silaha” huhifadhi maana pana ya vifaa vya vita na inakubali picha ya kujivika, bila kuamua kwamba vinamaanisha vifaa vya kujikinga au vya kushambulia pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa maandiko. Muundo “na tuyavue … na kujivika” unatoa himizo la pamoja na kuhifadhi ulinganifu wa kuvua na kuvaa. Alama zote za tanbihi zimewekwa mara moja katika sehemu husika ya matini.
