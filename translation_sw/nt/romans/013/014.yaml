  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀλλὰ ἐνδύσασθε τὸν κύριον Ἰησοῦν Χριστόν, καὶ τῆς σαρκὸς πρόνοιαν μὴ ποιεῖσθε εἰς ἐπιθυμίας.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/014.yaml
  text: But put on the Lord Jesus the Messiah[a], and make no provision for the flesh, for its desires.
translation:
  language: sw
  text: Lakini mvaeni Bwana Yesu Masihi, wala msifanye maandalizi kwa ajili ya mwili ili kutimiza tamaa zake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wala msifanye maandalizi kwa ajili ya asili ya dhambi ili kutimiza tamaa zake.” Kigiriki kinasema “mwili,” neno ambalo Paulo mara nyingi hulitumia kurejelea mielekeo ya kibinadamu iliyopotoka, kinyume na maisha yanayoongozwa na Mungu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνδύσασθε
  choice: jivikeni
  rationale: Kauli ya amri inaendeleza taswira ya kuvaa na, kwa njia ya sitiari, humaanisha kujitambulisha na Yesu na kuishi kwa namna inayolingana naye.
- source_word: κύριον
  choice: Bwana
  rationale: Ni cheo cha Yesu hapa na huhifadhi uzito wake wa Kikristo na kiteolojia.
- source_word: Χριστόν
  choice: Masihi
  rationale: Hapa ni cheo, si jina la ukoo; “Masihi” huwasilisha maana ya Χριστός kwa Kiswahili cha kawaida.
- source_word: πρόνοιαν μὴ ποιεῖσθε
  choice: msiupangie ... jinsi
  rationale: Kirai hiki kinakataza kupanga mapema au kuweka mazingira yatakayowezesha tamaa kutimizwa; uundaji huu ni wa asili katika Kiswahili.
- source_word: σάρξ
  choice: mwili
  rationale: “Mwili” huhifadhi istilahi na sitiari ya Paulo bila kuifasiri moja kwa moja kuwa “asili ya dhambi.”
- source_word: εἰς ἐπιθυμίας
  choice: jinsi ya kutimiza tamaa zake
  rationale: Huwasilisha mwelekeo au kusudi la maandalizi yanayokatazwa, huku kiwakilishi “zake” kikirejelea mwili.
theological_decisions:
- issue: Maana ya σάρξ katika muktadha wa maadili wa Paulo
  choice: mwili
  alternative: asili ya dhambi
  rationale: Ingawa hapa neno hilo linahusishwa na tamaa potovu za mwanadamu, “asili ya dhambi” ingefafanua sitiari kwa namna finyu zaidi. Matini kuu huhifadhi mvutano wa istilahi ya Paulo, na tanbihi hutoa maana mbadala.
- issue: Cheo Χριστός
  choice: Masihi
  alternative: Kristo
  rationale: “Masihi” huonyesha wazi kuwa Χριστός ni cheo cha Yesu, huku mpangilio wa Kiswahili “Bwana Yesu, Masihi” ukihifadhi majina na cheo bila kulazimisha makala isiyopo katika Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Jivikeni” huhifadhi taswira ya mavazi; “msiupangie mwili jinsi” huepuka usemi mgumu wa tafsiri neno kwa neno huku ikidumisha wazo la πρόνοια, yaani kupanga au kuandaa mapema.
