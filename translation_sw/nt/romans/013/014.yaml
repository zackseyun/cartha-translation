review_pass:
  verdict: revise
  source_fidelity: Mvaaeni (imperative plural) conveys the clothing metaphor of ἐνδύσασθε more precisely and idiomatically than jivikeni when its direct object is the person of Jesus. The revision retains Bwana, Yesu, Masihi, mwili, the prohibition on advance provision, and the purposive relation to the flesh's desires.
  naturalness: 'The draft''s “msiupangie mwili jinsi ya kutimiza tamaa zake” is understandable but syntactically strained: it can sound as though one is planning something for the body. “Msifanye maandalizi kwa ajili ya mwili ili kutimiza tamaa zake” is clear, contemporary Standard East African Swahili and retains the intended metaphorical force.'
  terminology: “Bwana Yesu Masihi” appropriately renders κύριον Ἰησοῦν Χριστόν, with Masihi preserving the titular meaning of Χριστός. “Mwili” appropriately retains σάρξ without prematurely resolving it as “asili ya dhambi.” The footnote presents that interpretive alternative as an alternative rather than as the main-text meaning.
  issues:
  - severity: medium
    issue: The rendering “jivikeni Bwana Yesu, Masihi” is awkward and the comma separates Yesu from the title Masihi.
    rationale: Jivikeni normally foregrounds clothing oneself and is less natural with a personal direct object. Mvaeni directly and idiomatically renders the metaphorical imperative “put on [the Lord Jesus Messiah].”
  - severity: medium
    issue: “Wala msiupangie mwili jinsi ya kutimiza tamaa zake” is structurally unclear in Swahili.
    rationale: The applicative construction can suggest planning something for the body rather than refusing to make advance provision. A construction with “msifanye maandalizi kwa ajili ya mwili” clearly expresses πρόνοιαν μὴ ποιεῖσθε.
  revised_text: Lakini mvaeni Bwana Yesu Masihi, wala msifanye maandalizi kwa ajili ya mwili ili kutimiza tamaa zake.[a]
