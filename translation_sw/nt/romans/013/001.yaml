  text: Πᾶσα ψυχὴ ἐξουσίαις ὑπερεχούσαις ὑποτασσέσθω, οὐ γὰρ ἔστιν ἐξουσία εἰ μὴ ὑπὸ θεοῦ, αἱ δὲ ⸀οὖσαι ⸀ὑπὸ θεοῦ τεταγμέναι εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/001.yaml
  text: Let every person be subject to the governing authorities[a], for there is no authority except from God[b], and those that exist have been appointed by God.
translation:
  language: sw
  text: Kila mtu ajitiishe kwa mamlaka zinazotawala[a], kwa maana hakuna mamlaka isipokuwa kutoka kwa Mungu, na mamlaka zilizopo zimewekwa[b] na Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mamlaka zilizo juu” au “mamlaka zilizo kuu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “zimepangwa na Mungu” au “zimeamriwa na Mungu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶσα ψυχὴ
  choice: Kila mtu
  rationale: Ingawa kwa neno moja moja ni ‘kila nafsi,’ katika Kiyunani cha Koine msemo huu humaanisha kila mtu. ‘Kila mtu’ ni Kiswahili cha kawaida na huhifadhi maana ya kugawa kwa kila mmoja.
- source_word: ἐξουσίαις ὑπερεχούσαις
  choice: mamlaka zinazotawala
  rationale: ἐξουσίαις humaanisha mamlaka, na ὑπερεχούσαις huzitaja kuwa zilizo juu au katika nafasi ya kutawala. Tafsiri hii ya kimuktadha ni wazi bila kupoteza uwezekano wa maana ya ‘mamlaka zilizo juu.’
- source_word: ὑποτασσέσθω
  choice: ajitiishe
  rationale: Kitenzi hiki ni agizo la kuwa chini ya utaratibu au mamlaka. ‘Ajitiishe’ ni cha asili katika Kiswahili na hakiongezi wazo la kutii kila amri bila masharti, ambalo halijasemwa wazi hapa.
- source_word: οὐ γὰρ ἔστιν ἐξουσία εἰ μὴ ὑπὸ θεοῦ
  choice: kwa maana hakuna mamlaka isipokuwa kutoka kwa Mungu
  rationale: ‘Kutoka kwa Mungu’ huonyesha asili au chanzo cha mamlaka, huku kikihifadhi kwa kawaida maana ya ὑπὸ θεοῦ katika muundo huu.
- source_word: αἱ δὲ οὖσαι
  choice: mamlaka zilizopo
  rationale: Kivumishi-jina hiki cha wingi hurejelea moja kwa moja mamlaka zilizotajwa. Kurudia ‘mamlaka’ huondoa utata wa kisarufi katika Kiswahili.
- source_word: τεταγμέναι
  choice: zimewekwa
  rationale: Hali timilifu tendwa ya τάσσω huonyesha kuwekwa au kupangwa na matokeo yanayoendelea. ‘Zimewekwa’ ni ya kawaida, pana, na huhifadhi wazo la mpangilio wa Mungu bila kudokeza kwamba kila tendo la watawala limekubaliwa naye.
theological_decisions:
- issue: Upeo wa kauli kwamba mamlaka zilizopo zimewekwa na Mungu
  choice: Kusema kwamba mamlaka zinazotawala zatokana na Mungu na kwamba zilizopo zimewekwa naye, bila kuongeza kuwa kila tendo la kila mtawala lina kibali cha Mungu.
  alternative: Kutafsiri kwa namna inayodai kwamba kila utawala na kila tendo lake limeidhinishwa kimaadili na Mungu; au kudhoofisha kauli kana kwamba inahusu wazo dhahania la mamlaka pekee.
  rationale: Kiyunani huzungumzia mamlaka halisi zilizopo na hutumia τεταγμέναι kueleza kuwekwa au kupangwa kwake na Mungu. Tafsiri inapaswa kuhifadhi dai hilo pamoja na mvutano wake wa kiteolojia bila kulipanua zaidi ya mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. ‘Ajitiishe’ na ‘mamlaka zinazotawala’ ni semi za sasa na za asili; tanbihi huhifadhi maana mbadala zilizo halali za ὑπερεχούσαις na τεταγμέναι.
