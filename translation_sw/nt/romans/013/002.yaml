  text: ὥστε ὁ ἀντιτασσόμενος τῇ ἐξουσίᾳ τῇ τοῦ θεοῦ διαταγῇ ἀνθέστηκεν, οἱ δὲ ἀνθεστηκότες ἑαυτοῖς κρίμα λήμψονται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/002.yaml
  text: Therefore[a], the one who resists the authority has opposed the ordinance of God[b], and those who have opposed it will receive judgment on themselves.
translation:
  language: sw
  text: Kwa hiyo, anayepinga mamlaka ameupinga utaratibu uliowekwa na Mungu[a], na wale waliopinga watajipatia hukumu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “agizo la Mungu.”
    reason: lexical_alternative
  - marker: b
    text: “Hukumu” inaweza pia kutafsiriwa “hukumu ya hatia” au “adhabu,” lakini neno la Kigiriki hapa halilazimishi maana kali zaidi ya hukumu ya mwisho.
    reason: alternative_reading
lexical_decisions:
- source_word: ὥστε
  choice: Kwa hiyo
  rationale: Huonyesha hitimisho linalotokana na hoja ya mstari uliotangulia; ni usemi wa kawaida unaohifadhi nguvu ya kimantiki.
- source_word: ὁ ἀντιτασσόμενος
  choice: anayepinga
  rationale: Kirai hiki cha hali ya sasa humaanisha kwa ujumla mtu anayesimama dhidi ya jambo; ‘anayepinga’ ni wazi na cha asili.
- source_word: τῇ ἐξουσίᾳ
  choice: mamlaka
  rationale: Katika muktadha kinarejelea mamlaka ya kutawala iliyotajwa katika Waroma 13:1; umoja na maana pana ya neno la asili zimehifadhiwa.
- source_word: τῇ τοῦ θεοῦ διαταγῇ
  choice: utaratibu uliowekwa na Mungu
  rationale: διαταγή inaweza kumaanisha mpango, agizo, au utaratibu uliowekwa. Tafsiri hii ni ya asili kwa Kiswahili na inaonyesha kwamba Mungu ndiye aliyeuweka.
- source_word: ἀνθέστηκεν
  choice: ameupinga
  rationale: Wakati timilifu huonyesha hatua iliyofanywa ambayo athari yake inaendelea; ‘ameupinga’ huhifadhi maana hiyo na pia uhusiano wa kimatamshi na ‘anayepinga.’
- source_word: οἱ δὲ ἀνθεστηκότες
  choice: na wale walioupinga
  rationale: Hurejelea watu ambao wamechukua msimamo wa kupinga; kiwakilishi ‘-u-’ kinarejelea utaratibu uliowekwa na Mungu bila kuongeza wazo jipya.
- source_word: ἑαυτοῖς
  choice: watajiletea
  rationale: Kirejeshi hiki kinaonyesha kwamba matokeo ya upinzani yanawarudia wapinzani wenyewe; kitenzi cha Kiswahili chenye ‘-ji-’ huwasilisha jambo hilo kwa kawaida.
- source_word: κρίμα
  choice: hukumu
  rationale: Neno linaweza kumaanisha hukumu, uamuzi wa adhabu, au kuhukumiwa. ‘Hukumu’ huhifadhi upana wake bila kulazimisha maana ya hukumu ya mwisho.
- source_word: λήμψονται
  choice: watajiletea
  rationale: Pamoja na ἑαυτοῖς, kitenzi hiki huonyesha kupokea au kujipatia matokeo; ‘watajiletea’ ni Kiswahili cha asili kinachoonyesha matokeo yanayowapata wao wenyewe.
theological_decisions:
- issue: Upeo wa κρίμα
  choice: hukumu
  alternative: adhabu ya kuhukumiwa
  rationale: Mstari unaonya juu ya hukumu itakayowapata wanaopinga, lakini hautaji wazi hukumu ya mwisho au kuangamizwa milele. ‘Hukumu’ huhifadhi uzito na pia kutokubainishwa huko.
- issue: Marejeo ya ἐξουσία
  choice: mamlaka, ikieleweka katika muktadha kuwa mamlaka ya kutawala
  alternative: mamlaka kwa maana pana isiyobainishwa
  rationale: Waroma 13:1 inazungumzia mamlaka zinazotawala. Hata hivyo, kutaja tu ‘mamlaka’ kunahifadhi muundo wa neno la asili na kuacha muktadha uonyeshe aina yake.
- issue: Maana ya διαταγή
  choice: utaratibu uliowekwa na Mungu
  alternative: agizo la Mungu
  rationale: Neno la asili linaweza kueleweka kama mpango au utaratibu uliowekwa, na pia kama agizo. Chaguo kuu linaunganisha mstari huu na kauli ya 13:1 kwamba mamlaka zilizopo zimewekwa na Mungu, bila kuondoa uwezekano wa maana ya ‘agizo.’
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imeweka urudiaji wa mzizi ‘pinga’ ili kuonyesha uhusiano wa karibu wa maneno ya Kigiriki, huku ‘watajiletea’ ikiwasilisha kwa kawaida wazo la matokeo kuwarudia wao wenyewe.
