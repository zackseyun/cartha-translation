  text: Καὶ τοῦτο εἰδότες τὸν καιρόν, ὅτι ὥρα ⸂ἤδη ὑμᾶς⸃ ἐξ ὕπνου ἐγερθῆναι, νῦν γὰρ ἐγγύτερον ἡμῶν ἡ σωτηρία ἢ ὅτε ἐπιστεύσαμεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/011.yaml
  text: And do this[a], knowing the time, that it is already the hour for you to awaken from sleep[b], for now our salvation is nearer than when we believed.
translation:
  language: sw
  text: 'Na fanyeni hivyo, kwa kuwa mnajua wakati: tayari ni saa yenu[a] ya kuamka kutoka usingizini, kwa maana sasa wokovu wetu uko karibu zaidi kuliko ulivyokuwa tulipoamini.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati zina “sisi” badala ya “ninyi” katika maneno “saa yenu ya kuamka kutoka usingizini.”
    reason: textual_variant
  - marker: b
    text: Au “kuliko tulipoamini mara ya kwanza.” Kigiriki kinasema tu “tulipoamini.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ τοῦτο
  choice: Fanyeni hivyo pia
  rationale: Katika muktadha, τοῦτο hurejelea maagizo yaliyotangulia, huku καί ikiendeleza himizo. Tafsiri hii inaweka wazi tendo lililodokezwa na kubaki ya kawaida katika Kiswahili.
- source_word: εἰδότες τὸν καιρόν
  choice: mkijua wakati huu
  rationale: Kitenzi-shirikishi εἰδότες kimehifadhiwa kwa muundo wa ‘mkijua’; ‘wakati huu’ huonyesha wakati maalumu na wenye umuhimu unaokusudiwa na καιρός.
- source_word: ὅτι ὥρα ἤδη ὑμᾶς
  choice: tayari ni saa ya ninyi
  rationale: ‘Tayari’ huhifadhi msisitizo wa ἤδη, na ‘saa’ huhifadhi ukali wa ὥρα. ‘Ninyi’ huonyesha wazi wingi wa nafsi ya pili katika ὑμᾶς na kuwezesha kuonyesha tofauti ya hati katika tanbihi.
- source_word: ἐξ ὕπνου ἐγερθῆναι
  choice: kuamka kutoka usingizini
  rationale: Huhifadhi sitiari ya kutoka katika hali ya usingizi kwa Kiswahili cha sasa na cha kawaida, bila kuieleza kiufafanuzi.
- source_word: νῦν γὰρ
  choice: kwa maana sasa
  rationale: ‘Kwa maana’ huonyesha sababu inayotolewa na γάρ, na ‘sasa’ huhifadhi νῦν.
- source_word: ἐγγύτερον ἡμῶν ἡ σωτηρία
  choice: wokovu wetu uko karibu zaidi
  rationale: ‘Wokovu wetu’ ni usemi wa kawaida unaohifadhi uhusiano wa ἡμῶν na σωτηρία; ‘uko karibu zaidi’ huonyesha ulinganisho wa ἐγγύτερον.
- source_word: ἢ ὅτε ἐπιστεύσαμεν
  choice: kuliko ulivyokuwa tulipoamini
  rationale: Muundo huu hufanya ulinganisho uwe wa kawaida katika Kiswahili, huku ‘tulipoamini’ ikihifadhi unyofu wa Kigiriki bila kuongeza ‘kwa mara ya kwanza.’
theological_decisions:
- issue: Wokovu kusemwa kuwa karibu zaidi sasa kuliko wakati wa kuamini
  choice: wokovu wetu
  alternative: wokovu wetu wa mwisho; ukombozi wetu wakati wa kurudi kwa Bwana
  rationale: Tafsiri haibainishi hatua fulani ya wokovu. Hivyo inadumisha mvutano wa Paulo kati ya wokovu ambao tayari ni wa waamini na utimilifu wake ambao bado unakaribia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imehifadhi sitiari ya usingizi na uzito wa ‘saa’ na ‘wokovu’ bila kuingiza ufafanuzi wa kimadhehebu.
