  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἀλλ’ οὐχ ὡς τὸ παράπτωμα, οὕτως καὶ τὸ χάρισμα· εἰ γὰρ τῷ τοῦ ἑνὸς παραπτώματι οἱ πολλοὶ ἀπέθανον, πολλῷ μᾶλλον ἡ χάρις τοῦ θεοῦ καὶ ἡ δωρεὰ ἐν χάριτι τῇ τοῦ ἑνὸς ἀνθρώπου Ἰησοῦ Χριστοῦ εἰς τοὺς πολλοὺς ἐπερίσσευσεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/015.yaml
  text: But the gift is not like the trespass[a]. For if by the trespass of the one man the many died, much more the grace of God and the gift by the grace of the one man, Jesus the Messiah[b], overflowed to the many.
translation:
  language: sw
  text: Lakini zawadi hiyo si kama lile kosa. Kwa maana, ikiwa kwa kosa la mtu mmoja wale wengi walikufa, basi neema ya Mungu na zawadi iliyokuja kwa neema[a] ya mtu mmoja, Yesu Masiya,[b] viliwajilia wale wengi kwa wingi zaidi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “zawadi iliyo katika neema.”
    reason: lexical_alternative
  - marker: b
    text: Au, “Yesu Kristo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παράπτωμα
  choice: kosa
  rationale: Neno “kosa” linaeleweka kwa urahisi na linadumisha maana ya tendo baya au uvunjaji wa maadili katika ulinganisho wa Adamu na Yesu, bila kutumia istilahi nzito kupita kiasi.
- source_word: χάρισμα
  choice: zawadi
  rationale: “Zawadi” ni Kiswahili cha kawaida na huonyesha wazi tofauti kati ya kosa la mtu na kile ambacho Mungu hutoa kwa neema.
- source_word: οἱ πολλοί / τοὺς πολλούς
  choice: wale wengi
  rationale: “Wale wengi” linahifadhi matumizi ya kibainishi katika Kigiriki na ulinganisho wa Paulo kati ya mtu mmoja na wengi, bila kulifafanua kimakusudi kuwa “wote.”
- source_word: ἡ χάρις τοῦ θεοῦ
  choice: neema ya Mungu
  rationale: Hili ni tumizi la kawaida na lenye hadhi linalohifadhi muundo wa kirai cha Kigiriki.
- source_word: ἡ δωρεὰ ἐν χάριτι
  choice: zawadi iliyokuja kwa neema
  rationale: Hii ni kauli ya asili katika Kiswahili inayowasilisha uhusiano wa zawadi na neema, huku tanbihi ikihifadhi uwezekano wa kutafsiri ἐν kwa namna ya karibu zaidi na “katika.”
- source_word: τοῦ ἑνὸς ἀνθρώπου
  choice: ya mtu mmoja
  rationale: Kauli hii inadumisha kwa uwazi ulinganisho muhimu wa mtu mmoja na wale wengi.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesu Masiya
  rationale: “Masiya” linawasilisha Χριστός kama cheo chenye maana katika ulinganisho huu, badala ya kukifanya kionekane kama jina la ukoo.
- source_word: ἐπερίσσευσεν
  choice: ziliwafikia ... kwa wingi zaidi sana
  rationale: Kauli hii ya Kiswahili inaonyesha nguvu ya wingi unaozidi katika περισσεύω na inapatana na πολλῷ μᾶλλον, huku ikisomeka kwa kawaida.
theological_decisions:
- issue: Upeo unaodokezwa na “wale wengi” katika ulinganisho wa Adamu na Masiya
  choice: Kuhifadhi “wale wengi” bila kubadili kuwa “wote.”
  alternative: Kutafsiri “wote” ili kuweka wazi upeo wa uwakilishi.
  rationale: Aya yenyewe inatumia kwa makusudi ulinganisho wa mtu mmoja na wengi. “Wale wengi” linahifadhi mvutano huo wa maandishi bila kuingiza hitimisho pana la kiteolojia kutoka katika muktadha mzima.
- issue: Uhusiano wa zawadi, neema, na Yesu katika ἡ δωρεὰ ἐν χάριτι τῇ τοῦ ἑνὸς ἀνθρώπου
  choice: “zawadi iliyokuja kwa neema ya mtu mmoja”
  alternative: “zawadi iliyo katika neema ya mtu mmoja”
  rationale: Uundaji wa Kigiriki unaweza kueleweka kwa maana ya njia au uhusiano. Tafsiri kuu ni ya kawaida zaidi katika Kiswahili, na tanbihi inadumisha uwezekano wa tafsiri ya karibu zaidi na muundo wa asili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi, na inayoeleweka kwa wasomaji wa kawaida. Muundo wa “mtu mmoja—wale wengi” umehifadhiwa, na sentensi imeratibiwa kwa viunganishi vya kawaida vya Kiswahili bila kuondoa mkazo wa “zaidi sana.”
