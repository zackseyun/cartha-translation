  terminology: “Zawadi,” “hukumu,” “zawadi ya neema,” “makosa,” na “kuhesabiwa haki” zinadumisha istilahi ya aya na utofautishaji wake wa kimahakama. Tanbihi ya δικαίωμα inahifadhi uwezekano wa maana iliyo halisi zaidi, bila kulazimisha tafsiri moja ya kiteolojia.
