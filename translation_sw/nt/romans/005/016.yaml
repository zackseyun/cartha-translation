  to: Wala zawadi hiyo si kama kile kilichotokana na yule mmoja aliyetenda dhambi[a]. Kwa maana hukumu iliyotokana na kosa moja ilileta hukumu ya adhabu, lakini zawadi ya neema, kutokana na makosa mengi, ilileta kuhesabiwa haki[b].
  rationale: Nimebadili “baada ya makosa mengi” kuwa “kutokana na makosa mengi” ili kutafsiri ἐκ kwa uaminifu. Pia nimeweka “hukumu ya adhabu” kwa κατάκριμα kwa Kiswahili cha sasa kilicho wazi zaidi, na kurekebisha nafasi ya alama ya tanbihi. Marekebisho hayamtaji Adamu wala hayafuti ufupi/utata unaodhibitiwa wa Kigiriki kuhusu yule mmoja.
