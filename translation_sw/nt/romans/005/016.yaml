base_translation:
  language: en
  yaml_path: translation/nt/romans/005/016.yaml
  text: And the gift is not like what came through the one who sinned[a]. For the judgment from one trespass led to condemnation[c][b], but the gracious gift from many trespasses led to justification.
translation:
  language: sw
  text: Wala zawadi hiyo si kama kile kilichotokana na yule mmoja aliyetenda dhambi[a]. Kwa maana hukumu iliyotokana na kosa moja ilileta hukumu ya adhabu, lakini zawadi ya neema, kutokana na makosa mengi, ilileta kuhesabiwa haki[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “si kama kile kilichotokana na mtu mmoja aliyetenda dhambi.”
    reason: lexical_alternative
  - marker: b
    text: Au “ilileta uamuzi wa haki” au “ilileta kuachiliwa huru.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δώρημα
  choice: zawadi
  rationale: Neno hili linamaanisha kitu kilichotolewa kama zawadi; “zawadi” ni la kawaida na haliongezi wazo lisilosemwa wazi.
- source_word: δι’ ἑνὸς ἁμαρτήσαντος
  choice: kile kilichotokana na yule mmoja aliyetenda dhambi
  rationale: Muundo wa Kigiriki umefupishwa. Tafsiri hii inadumisha rejeo kwa mtu mmoja na haifafanui kimya-kimya kwamba ni Adamu.
- source_word: κρίμα
  choice: hukumu
  rationale: Katika muktadha huu ni uamuzi wa kimahakama, unaotofautishwa na adhabu ya kuhukumiwa na kuhesabiwa haki.
- source_word: ἐξ ἑνὸς
  choice: iliyotokana na kosa moja
  rationale: Neno la kiume/kati ἑνός linaweza kueleweka kwa ufupi kama “kutokana na mmoja” au “kutokana na kosa moja”; mlingano na “makosa mengi” unaunga mkono “kosa moja.”
- source_word: κατάκριμα
  choice: adhabu ya kuhukumiwa
  rationale: Huwasilisha matokeo ya uamuzi wa hatia kwa Kiswahili cha kawaida na kudumisha maana ya kimahakama.
- source_word: χάρισμα
  choice: zawadi ya neema
  rationale: Hutofautisha χάρισμα na δώρημα huku ikihifadhi uhusiano wake wa wazi na neema.
- source_word: παραπτωμάτων
  choice: makosa
  rationale: “Makosa” ni neno la kawaida linaloweza kubeba wazo la ukiukaji bila kutumia lugha nzito isiyo ya lazima.
- source_word: δικαίωμα
  choice: kuhesabiwa haki
  rationale: Katika mlingano na κατάκριμα, usemi huu unaonyesha matokeo ya kimahakama yaliyo kinyume cha kuhukumiwa, huku tanbihi ikihifadhi uwezekano wa “uamuzi wa haki” au “kuachiliwa huru.”
theological_decisions:
- issue: Nguvu ya kimahakama ya δικαίωμα ikilinganishwa na κατάκριμα
  choice: kuhesabiwa haki
  alternative: uamuzi wa haki; kuachiliwa huru
  rationale: Muundo wa aya unatofautisha hukumu inayoleta adhabu ya kuhukumiwa na zawadi ya neema inayoleta matokeo ya haki. “Kuhesabiwa haki” ni usemi unaoeleweka katika muktadha wa Paulo, lakini tanbihi inahifadhi maana halisi zaidi ya uamuzi au kuachiliwa.
- issue: Rejeo la ἐξ ἑνὸς
  choice: kutokana na kosa moja
  alternative: kutokana na mmoja
  rationale: Mlingano wa moja na “makosa mengi” unaelekeza kwa kosa moja, lakini Kigiriki chenyewe ni kifupi; tanbihi inahifadhi uwezekano wa rejeo kwa mtu mmoja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa sentensi umeweka wazi mlingano wa kimahakama bila kumtaja Adamu pale ambapo Kigiriki hakumtaji moja kwa moja. Maneno “hukumu,” “adhabu ya kuhukumiwa,” na “kuhesabiwa haki” yanadumisha utofautishaji wa kisheria wa aya.
