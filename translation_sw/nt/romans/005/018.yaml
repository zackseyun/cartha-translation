id: ROM.5.18
reference: Romans 5:18
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἄρα οὖν ὡς δι’ ἑνὸς παραπτώματος εἰς πάντας ἀνθρώπους εἰς κατάκριμα, οὕτως καὶ δι’ ἑνὸς δικαιώματος εἰς πάντας ἀνθρώπους εἰς δικαίωσιν ζωῆς·
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/018.yaml
  text: So then[a], as through one trespass condemnation came to all people, so also through one righteous act justification that brings life came to all people.
translation:
  language: sw
  text: Basi, kama vile kwa kosa moja hukumu ya adhabu iliwafikia watu wote, vivyo hivyo kwa tendo moja la haki[a] kuhesabiwa haki kunakoleta uzima kuliwafikia watu wote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au kwa kufuata muundo wa maneno kwa karibu zaidi, “kwa tendo moja la haki ... hata kuhesabiwa haki kwa uzima.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄρα οὖν
  choice: Basi
  rationale: Neno hili linaonyesha hitimisho linalotokana na hoja iliyotangulia kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: παραπτώματος
  choice: kosa
  rationale: “Kosa” linaonyesha tendo la kukiuka yaliyo sawa bila kulipanua kuwa dhana ya jumla ya dhambi.
- source_word: κατάκριμα
  choice: hukumu ya adhabu
  rationale: Kauli hii inahifadhi maana ya kimahakama ya hukumu inayomtia mtu hatiani na kuhukumu adhabu.
- source_word: δικαιώματος
  choice: tendo la haki
  rationale: Umoja wa neno hilo katika muktadha huu unaelekeza kwenye tendo moja lililo la haki; tafsiri hii ni ya asili na haiongezi ufafanuzi wa kiteolojia usiotajwa wazi.
- source_word: δικαίωσιν ζωῆς
  choice: kuhesabiwa haki kunakoleta uzima
  rationale: Kauli hii inaweka pamoja maana ya kimahakama ya δικαίωσις na matokeo ya uzima, huku tanbihi ikihifadhi muundo halisi zaidi na utata wa uhusiano wa maneno hayo.
- source_word: πάντας ἀνθρώπους
  choice: watu wote
  rationale: Hii ni tafsiri jumuishi na ya kawaida ya Kiswahili inayohifadhi upeo uleule katika pande zote mbili za ulinganisho.
theological_decisions:
- issue: Iwapo kauli ya pili “watu wote” ipunguzwe ili kuepuka kuonekana kuwa na upeo wa ulimwengu wote
  choice: Kudumisha “watu wote” katika sehemu zote mbili
  alternative: wote wanaoamini; wote wanaohesabiwa haki
  rationale: Kigiriki kinarudia πάντας ἀνθρώπους katika pande zote mbili. Kuibana kauli ya pili kungetatua kimakusudi mvutano wa kiteolojia ambao mstari wenyewe hauutatui.
- issue: Uhusiano wa ζωῆς na δικαίωσιν
  choice: kuhesabiwa haki kunakoleta uzima
  alternative: kuhesabiwa haki kwa uzima
  rationale: Tafsiri kuu inatoa Kiswahili kinachoeleweka huku ikihifadhi maana ya kuhesabiwa haki na uzima; tanbihi inatoa muundo halisi zaidi kwa sababu kiambata cha Kigiriki kinaweza kueleweka kwa namna zaidi ya moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Ulinganifu wa kosa moja na tendo moja la haki, pamoja na kurudiwa kwa “watu wote,” umehifadhiwa. Vitenzi vimeongezwa ili kukamilisha sentensi ya Kiswahili kwa sababu Kigiriki kina muundo wa kimkato usio na vitenzi vilivyotamkwa.
