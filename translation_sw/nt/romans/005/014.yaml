    issue: “kosa la Adamu” kwa παράβασις
    rationale: “Kosa” linaweza kumaanisha kosa lolote au makosa ya kawaida, ilhali παράβασις linaonyesha ukiukaji wa mpaka/amri. “Ukiukaji wa Adamu” ni sahihi zaidi na bado unaacha upeo wa kauli ya Paulo wazi.
  - severity: low
    issue: “Adamu huyo”
    rationale: Kigiriki humrejelea Adamu kwa kiwakilishi cha uhusiano; Kiswahili kinaweza kusema “Adamu ni...” kwa uwazi na kwa mtiririko wa kawaida, bila kivumishi cha kuonyesha kisichohitajika.
  - severity: low
    issue: Tafsiri mbadala “kivuli cha jambo litakalokuja” katika tanbihi a
    rationale: Hii ni tafsiri ya kiufafanuzi zaidi ya τύπος. “Mfano” na “muundo” zinatosha kuonyesha mbadala za kileksia; dhana ya kivuli inaweza kusikika kama madai mahsusi ya kinabii.
