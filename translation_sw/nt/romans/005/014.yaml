- from: Lakini mauti ilitawala tangu Adamu mpaka Musa, hata juu ya wale ambao hawakutenda dhambi kwa namna iliyofanana na kosa la Adamu. Adamu huyo ni kielelezo[a] cha yule ajaye.[b]
  to: Lakini mauti ilitawala tangu Adamu mpaka Musa, hata juu ya wale ambao hawakutenda dhambi kwa namna iliyofanana na ukiukaji wa Adamu. Adamu ni kielelezo[a] cha yule ajaye.[b]
  rationale: 'Marekebisho yanaboresha usahihi wa παράβασις kwa “ukiukaji,” huondoa kiashirio kisichohitajika katika sentensi ya pili, na hupunguza ufafanuzi wa tanbihi a ili usizidishe maana ya τύπος. Alama za tanbihi zimehifadhiwa mahali panapoendana na maneno yanayofafanuliwa: a kwa “kielelezo,” b kwa “yule ajaye.”'
