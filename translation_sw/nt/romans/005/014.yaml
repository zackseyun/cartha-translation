  text: ἀλλὰ ἐβασίλευσεν ὁ θάνατος ἀπὸ Ἀδὰμ μέχρι Μωϋσέως καὶ ἐπὶ τοὺς μὴ ἁμαρτήσαντας ἐπὶ τῷ ὁμοιώματι τῆς παραβάσεως Ἀδάμ, ὅς ἐστιν τύπος τοῦ μέλλοντος.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/014.yaml
  text: Yet death reigned from Adam until Moses[a], even over those who did not sin in the likeness of Adam’s transgression[b], who is a type of the coming one.
translation:
  language: sw
  text: Lakini mauti ilitawala tangu Adamu mpaka Musa, hata juu ya wale ambao hawakutenda dhambi kwa namna iliyofanana na ukiukaji wa Adamu. Adamu ni kielelezo[a] cha yule ajaye.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mfano” au “muundo.”
    reason: lexical_alternative
  - marker: b
    text: Yaani, “yule ambaye angekuja.” Katika muktadha, anayerejelewa ni Kristo.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: Lakini
  rationale: Inaonyesha utofautishaji wenye nguvu na kauli iliyotangulia kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: ἐβασίλευσεν ὁ θάνατος
  choice: mauti ilitawala
  rationale: Inahifadhi taswira ya kifalme ambayo Paulo anaitumia kuipa mauti sifa ya mtawala.
- source_word: ἀπὸ Ἀδὰμ μέχρι Μωϋσέως
  choice: tangu Adamu mpaka Musa
  rationale: Inaeleza kwa kawaida na kwa uwazi kipindi chote kinachokusudiwa.
- source_word: καὶ ἐπὶ τοὺς μὴ ἁμαρτήσαντας
  choice: hata juu ya wale ambao hawakutenda dhambi
  rationale: “Hata” inaonyesha jambo la kushangaza kwamba utawala wa mauti uliwafikia pia watu hao; “juu ya” inadumisha wazo la kuwatawala.
- source_word: ἐπὶ τῷ ὁμοιώματι τῆς παραβάσεως Ἀδάμ
  choice: kwa namna iliyofanana na kosa la Adamu
  rationale: 'Ni Kiswahili cha asili kinachohifadhi ulinganisho: dhambi yao haikuwa ya namna iliyofanana na uvunjaji wa amri wa Adamu.'
- source_word: παράβασις
  choice: kosa
  rationale: Katika muktadha huu neno linaonyesha tendo la kuvuka mpaka wa amri; “kosa” linaeleweka kwa urahisi bila kuingiza ufafanuzi mpana katika matini.
- source_word: τύπος
  choice: kielelezo
  rationale: Linawasilisha mtu anayewakilisha au kutangulia mwingine kwa ulinganifu, huku tanbihi ikihifadhi maana mbadala za neno hilo.
- source_word: τοῦ μέλλοντος
  choice: yule ajaye
  rationale: Inadumisha usemi wa Kigiriki bila kutaja Kristo moja kwa moja ndani ya matini, ingawa muktadha unamtambulisha kuwa ndiye anayerejelewa.
theological_decisions:
- issue: Jinsi dhambi za watu kati ya Adamu na Musa zinavyolinganishwa na kosa la Adamu
  choice: hawakutenda dhambi kwa namna iliyofanana na kosa la Adamu
  alternative: hawakutenda dhambi kwa kuiga kosa la Adamu
  rationale: Chaguo hili halifafanui kupita kiasi kama tofauti hiyo ilikuwa kuiga tendo, kuvunja amri iliyotolewa moja kwa moja, au jambo jingine; linahifadhi upana wa ὁμοίωμα.
- issue: Anayerejelewa na “yule ajaye”
  choice: Usemi unabaki “yule ajaye” katika matini, na tanbihi inaeleza kwamba katika muktadha anamrejelea Kristo.
  alternative: Kutafsiri moja kwa moja “Kristo” katika matini
  rationale: Waroma 5:12–21 inaonyesha kwamba Kristo ndiye mwenza wa Adamu katika ulinganisho huu, lakini Kigiriki hakimtaji kwa jina katika mstari huu. Hivyo tafsiri inalinda umbo la matini na kutoa ufafanuzi katika tanbihi.
- issue: Uhusiano wa Adamu na yule ajaye
  choice: Adamu ni “kielelezo” chake.
  alternative: Adamu ni “ishara ya kinabii” au “mfano kamili” wake.
  rationale: “Kielelezo” huhifadhi ulinganifu wa kitipolojia bila kudai kwamba Adamu na Kristo wanafanana katika kila jambo; mistari inayofuata pia inaonyesha tofauti zao.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Mauti ilitawala” inadumisha uhuishaji wa mauti, na sentensi ya pili inamtaja Adamu wazi ili kuondoa utata usio wa lazima wa kiwakilishi cha Kiswahili bila kubadili rejeo la Kigiriki.
