base_translation:
  language: en
  yaml_path: translation/nt/romans/005/008.yaml
  text: But God demonstrates his own love for us in that while we were still sinners[c][b][a], Messiah died for us.
translation:
  language: sw
  text: Lakini Mungu anaonyesha upendo wake mwenyewe kwetu[a] kwa kuwa, tulipokuwa bado wenye dhambi, Masihi[b] alikufa kwa ajili yetu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuelekea kwetu,” badala ya “kwetu” katika kirai “upendo wake mwenyewe kwetu.”
    reason: lexical_alternative
  - marker: b
    text: Kigiriki Christos; kwa mapokeo hutafsiriwa “Kristo.” Hapa limetafsiriwa “Masihi” kama cheo.
    reason: lexical_alternative
  - marker: c
    text: Au, “kwa niaba yetu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: συνίστησιν
  choice: anaonyesha
  rationale: Kitenzi hiki cha wakati uliopo kinaeleza tendo la Mungu la kuudhihirisha upendo wake. ‘Anaonyesha’ ni Kiswahili cha kawaida, wazi, na chenye nguvu ya ushahidi bila kuongeza maana isiyokuwamo.
- source_word: δὲ
  choice: Lakini
  rationale: Kiunganishi hiki kinaonyesha tofauti ya kiasi na hoja iliyotangulia; ‘Lakini’ kinaendeleza mkondo huo wa hoja kwa kawaida.
- source_word: ἑαυτοῦ
  choice: wake mwenyewe
  rationale: Kiwakilishi rejeshi kinasisitiza kwamba ni upendo wa Mungu mwenyewe; ‘wake mwenyewe’ kinahifadhi msisitizo huo.
- source_word: ἀγάπην
  choice: upendo
  rationale: Hili ndilo neno la kawaida na sahihi la Kiswahili kwa ἀγάπη katika muktadha huu.
- source_word: εἰς ἡμᾶς
  choice: kwetu
  rationale: Kirai hiki kinaonyesha mwelekeo wa upendo wa Mungu kuelekea sisi. ‘Kwetu’ ni cha asili na kinahifadhi maana hiyo bila kukichanganya na ὑπὲρ ἡμῶν baadaye katika sentensi.
- source_word: ὅτι
  choice: kwa kuwa
  rationale: Hapa ὅτι kinaanzisha maelezo ya jinsi Mungu anavyoonyesha upendo wake; ‘kwa kuwa’ kinafikisha uhusiano huo wa maelezo kwa Kiswahili cha kawaida.
- source_word: ἔτι ἁμαρτωλῶν ὄντων ἡμῶν
  choice: tulipokuwa bado wenye dhambi
  rationale: Muundo wa genitivi huru una maana ya wakati yenye dokezo la hali inayotazamiwa kuwa kinyume; ‘tulipokuwa bado wenye dhambi’ unahifadhi wakati na nguvu ya ἔτι.
- source_word: Χριστὸς
  choice: Masihi
  rationale: Hapa Χριστός inafanya kazi kama cheo cha kimasiya. ‘Masihi’ hutafsiri cheo hicho badala ya kukitumia tu kama jina.
- source_word: ὑπὲρ ἡμῶν
  choice: kwa ajili yetu
  rationale: Kirai hiki kinaeleza kwamba kifo chake kilikuwa kwa manufaa au kwa niaba yetu. ‘Kwa ajili yetu’ ni pana vya kutosha kutoamua kimya kimya mjadala wa namna hasa ya uwakilishi au ubadala.
- source_word: ἀπέθανεν
  choice: alikufa
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kitenzi hiki cha aoristi.
theological_decisions:
- issue: Jinsi ya kutafsiri Χριστός katika hoja ya Paulo
  choice: Masihi
  alternative: Kristo
  rationale: Katika mstari huu neno linaweza kueleweka kama cheo cha kimasiya. ‘Masihi’ linahifadhi maana ya cheo; tanbihi inataja tafsiri ya kimapokeo ‘Kristo’ bila kuificha.
- issue: Nguvu ya ὑπὲρ ἡμῶν
  choice: kwa ajili yetu
  alternative: kwa niaba yetu
  rationale: Kigiriki kinasema wazi kwamba kifo cha Masihi kilihusiana nasi na kilikuwa kwa manufaa yetu, lakini kirai hiki pekee hakilazimishi ufafanuzi mmoja wa kinadharia kuhusu upatanisho. Tafsiri pana inahifadhi mvutano huo wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Mpangilio unaendeleza tofauti ya ‘Lakini,’ unahifadhi msisitizo wa ‘wake mwenyewe,’ na unatofautisha εἰς ἡμᾶς (‘kwetu’) na ὑπὲρ ἡμῶν (‘kwa ajili yetu’).
