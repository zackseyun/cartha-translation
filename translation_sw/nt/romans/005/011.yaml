  text: οὐ μόνον δέ, ἀλλὰ καὶ καυχώμενοι ἐν τῷ θεῷ διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, δι’ οὗ νῦν τὴν καταλλαγὴν ἐλάβομεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/011.yaml
  text: And not only that[a], but we also boast in God through our Lord Jesus the Messiah[d][c][b], through whom we have now received the reconciliation.
translation:
  language: sw
  text: Wala si hayo tu, bali pia tunajivunia[a] Mungu kwa njia ya Bwana wetu Yesu Masihi[b], ambaye kupitia kwake sasa tumepokea upatanisho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “tunashangilia kwa sababu ya Mungu” au “tunajisifu kwa sababu ya Mungu.”
    reason: lexical_alternative
  - marker: b
    text: 'Kigiriki: Christos; kwa mapokeo, “Kristo.”'
    reason: alternative_reading
lexical_decisions:
- source_word: καυχώμενοι
  choice: tunajivunia
  rationale: Kitenzi hiki huhusu kujisifu au kushangilia kwa kujiamini. Katika muktadha huu, “tunajivunia Mungu” kinahifadhi wazo la Paulo bila kudokeza kujikweza kwa dhambi.
- source_word: ἐν τῷ θεῷ
  choice: Mungu
  rationale: Baada ya “tunajivunia,” Mungu ndiye mlengwa na msingi wa kujivunia huko; Kiswahili hakihitaji kutafsiri ἐν kwa kihusishi tofauti hapa.
- source_word: διὰ τοῦ κυρίου ἡμῶν
  choice: kwa njia ya Bwana wetu
  rationale: “Kwa njia ya” linaonyesha wazi kwamba Bwana Yesu ndiye njia au wakala wa baraka inayotajwa.
- source_word: Χριστοῦ
  choice: Masihi
  rationale: Χριστός ni cheo chenye maana ya Mtiwa-Mafuta; “Masihi” huwasilisha maana hiyo kwa uwazi, badala ya kukifanya kionekane kama jina tu.
- source_word: καταλλαγὴν
  choice: upatanisho
  rationale: Neno hili linaonyesha kurejeshwa kwa uhusiano uliokuwa umevunjika. “Upatanisho” ni neno la kawaida na sahihi katika muktadha huu.
- source_word: ἐλάβομεν
  choice: tumepokea
  rationale: Kitendo cha kupokea kimetimia, na matokeo yake yanamilikiwa sasa; umbo timilifu la Kiswahili linaeleza jambo hilo kwa kawaida.
- source_word: νῦν
  choice: sasa
  rationale: Neno hili limehifadhiwa wazi ili kuonyesha hali ya sasa inayotokana na upatanisho uliopokewa.
theological_decisions:
- issue: Maana ya καυχώμενοι inapomhusu Mungu
  choice: tunajivunia Mungu
  alternative: tunashangilia katika Mungu; tunajisifu kwa sababu ya Mungu
  rationale: “Tunajivunia” huhifadhi nguvu ya kujisifu kwa furaha huku ikionyesha kuwa Mungu, wala si nafsi, ndiye sababu ya fahari hiyo.
- issue: Kutafsiri Χριστοῦ kama cheo
  choice: Masihi
  alternative: Kristo
  rationale: “Masihi” huonyesha wazi cheo na maana ya Χριστός, huku tanbihi ikihifadhi istilahi ya mapokeo “Kristo.”
- issue: Asili ya upatanisho
  choice: tumepokea upatanisho kwa njia ya Yesu Masihi
  alternative: tumefikia upatanisho
  rationale: Kigiriki ἐλάβομεν kinasema kwamba upatanisho umepokewa, si kwamba wanadamu waliutengeneza au waliufikia kwa juhudi zao.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Wala si hivyo tu, bali pia” linaakisi muundo wa hoja ya Paulo kwa lugha ya kawaida. Marudio ya “kwa njia ya” yamehifadhiwa kwa uwazi na ili kufuata msisitizo wa διά katika vifungu vyote viwili.
