id: ROM.5.10
reference: Romans 5:10
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἰ γὰρ ἐχθροὶ ὄντες κατηλλάγημεν τῷ θεῷ διὰ τοῦ θανάτου τοῦ υἱοῦ αὐτοῦ, πολλῷ μᾶλλον καταλλαγέντες σωθησόμεθα ἐν τῇ ζωῇ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/010.yaml
  text: For if[a], while we were enemies, we were reconciled to God through the death of his Son, much more, having been reconciled, will we be saved by his life.
translation:
  language: sw
  text: Kwa maana, ikiwa tulipokuwa maadui tulipatanishwa na Mungu kwa njia ya kifo cha Mwana wake, zaidi sana, baada ya kupatanishwa, tutaokolewa kwa uzima wake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika uzima wake.”
    reason: Huhifadhi uwezekano wa kutafsiri ἐν kwa maana ya mahali au ushirika badala ya maana ya njia.
lexical_decisions:
- source_word: εἰ γὰρ
  choice: Kwa maana ikiwa
  rationale: “Kwa maana” linaendeleza hoja ya Paulo, na “ikiwa” linahifadhi muundo wa sharti wa εἰ bila kuugeuza kuwa kauli ya sababu.
- source_word: ἐχθροὶ ὄντες
  choice: tulipokuwa maadui
  rationale: Linaonyesha hali iliyokuwapo kabla ya upatanisho na kuhifadhi maana ya kimahusiano ya ἐχθροί kwa lugha ya kawaida na ya moja kwa moja.
- source_word: κατηλλάγημεν τῷ θεῷ
  choice: tulipatanishwa na Mungu
  rationale: “Tulipatanishwa” linahifadhi kauli tendwa na wazo la kurejeshwa kwa uhusiano; “na Mungu” ni Kiswahili cha kawaida kwa mhusika ambaye upatanisho unamhusu.
- source_word: διὰ τοῦ θανάτου τοῦ υἱοῦ αὐτοῦ
  choice: kwa njia ya kifo cha Mwana wake
  rationale: “Kwa njia ya” linaonyesha wazi maana ya chombo au njia ya διά pamoja na jenitivi, huku “Mwana wake” likihifadhi jina la uhusiano lililo katika Kigiriki.
- source_word: πολλῷ μᾶλλον
  choice: kwa hakika zaidi sana
  rationale: Linaonyesha nguvu ya hoja ya kutoka jambo kubwa kwenda uhakika mkubwa zaidi, bila kuibadili sentensi kuwa swali lisilowekwa wazi katika Kigiriki.
- source_word: καταλλαγέντες
  choice: baada ya kupatanishwa
  rationale: Linaonyesha kwamba upatanisho umetangulia wokovu wa wakati ujao, kama inavyodokezwa na kishirikishi cha wakati uliopita.
- source_word: σωθησόμεθα
  choice: tutaokolewa
  rationale: Linahifadhi kauli tendwa na mwelekeo wa wakati ujao wa usemi wa Paulo.
- source_word: ἐν τῇ ζωῇ αὐτοῦ
  choice: kwa uzima wake
  rationale: “Kwa” linaweza kuonyesha uzima wake kuwa njia au msingi wa wokovu na linaendeleza ulinganifu na “kwa njia ya kifo”; tanbihi inahifadhi uwezekano wa maana ya mahali au ushirika.
theological_decisions:
- issue: Maana ya ἐν τῇ ζωῇ αὐτοῦ
  choice: kwa uzima wake
  alternative: katika uzima wake
  rationale: Muktadha unaweka kifo cha Mwana sambamba na uzima wake, hivyo maana ya njia au msingi inafaa katika matini kuu. Hata hivyo, ἐν inaweza pia kueleweka kwa maana ya kuwa ndani ya uzima wake au kushiriki katika huo; uwezekano huo umehifadhiwa katika tanbihi bila kuamua mvutano wa kiteolojia kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa hoja ya sharti umehifadhiwa, huku “basi” likisaidia sentensi ndefu isomeke kwa urahisi. “Maadui,” “kupatanishwa,” na “tutaokolewa” ni maneno ya moja kwa moja na yanayoeleweka kwa wasomaji wa kawaida.
