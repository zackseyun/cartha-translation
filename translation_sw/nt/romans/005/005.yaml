  text: ἡ δὲ ἐλπὶς οὐ καταισχύνει· ὅτι ἡ ἀγάπη τοῦ θεοῦ ἐκκέχυται ἐν ταῖς καρδίαις ἡμῶν διὰ πνεύματος ἁγίου τοῦ δοθέντος ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/005.yaml
  text: And hope does not put to shame[a], because the love of God has been poured out in our hearts through the Holy Spirit[b], who was given to us.
translation:
  language: sw
  text: Nalo tumaini halituaibishi[a], kwa sababu upendo wa Mungu[b] umemiminwa mioyoni mwetu kwa njia ya Roho Mtakatifu, ambaye tulipewa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “halitukatishi tamaa.”
    reason: lexical_alternative
  - marker: b
    text: Au, ingawa uwezekano huu ni mdogo, “upendo wetu kwa Mungu.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλπίς
  choice: tumaini
  rationale: Ni tafsiri ya kawaida na ya asili ya nomino hii; kibainishi cha Kigiriki kina maana ya kijumla hapa.
- source_word: δέ
  choice: Nalo
  rationale: Inaonyesha kiunganishi chepesi cha hoja bila kuingiza utofauti mkali usiokuwapo katika muktadha.
- source_word: καταισχύνει
  choice: halituaibishi
  rationale: Inahifadhi wazo kuu la aibu na heshima katika kitenzi cha Kigiriki, huku ikisomeka kwa Kiswahili cha kawaida.
- source_word: ἀγάπη τοῦ θεοῦ
  choice: upendo wa Mungu
  rationale: Inafuata muundo wa genitivi wa Kigiriki na kwa kawaida hueleweka kuwa upendo wa Mungu kwetu, huku uwezekano wa maana nyingine ukihifadhiwa katika tanbihi.
- source_word: ἐκκέχυται
  choice: umemiminwa
  rationale: Kauli timilifu inaonyesha tendo lililotendeka lenye matokeo yanayoendelea; umbo hili la Kiswahili linawasilisha hali hiyo kwa ufupi.
- source_word: ἐν ταῖς καρδίαις ἡμῶν
  choice: mioyoni mwetu
  rationale: Ni usemi wa asili unaowasilisha moja kwa moja mahali pa ndani panapotajwa na Kigiriki.
- source_word: διὰ πνεύματος ἁγίου
  choice: kwa njia ya Roho Mtakatifu
  rationale: διά pamoja na genitivi inaonyesha chombo au mpatanishi; 'kwa njia ya' huwasilisha dhima hiyo wazi.
- source_word: τοῦ δοθέντος ἡμῖν
  choice: ambaye tulipewa
  rationale: Inahifadhi kauli tendwa na kumrejelea Roho Mtakatifu kama nafsi bila kuongeza mtendaji ambaye Kigiriki hakumtaji wazi katika kishazi hiki.
theological_decisions:
- issue: Maana ya genitivi katika ἡ ἀγάπη τοῦ θεοῦ
  choice: upendo wa Mungu, unaoeleweka katika muktadha kuwa upendo wa Mungu kwetu
  alternative: upendo wetu kwa Mungu
  rationale: Kishazi kinachofuata kinasema upendo huo umemiminwa mioyoni mwetu kwa njia ya Roho Mtakatifu, jambo linalounga mkono zaidi maana ya upendo unaotoka kwa Mungu. Hata hivyo, muundo wa genitivi unaweza kubeba maana nyingine, kwa hiyo imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo ni wa asili bila kuondoa picha ya kumimina, maana ya aibu, au utata halisi wa 'upendo wa Mungu'.
