  text: οὐ μόνον δέ, ἀλλὰ καὶ ⸀καυχώμεθα ἐν ταῖς θλίψεσιν, εἰδότες ὅτι ἡ θλῖψις ὑπομονὴν κατεργάζεται,
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/003.yaml
  text: And not only that[a], but we also rejoice in afflictions, knowing that affliction produces endurance[c][b],
translation:
  language: sw
  text: Wala si hivyo tu, bali pia tunafurahi[a] katika dhiki[b], tukijua kwamba dhiki huleta uvumilivu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “tunajivunia” au “tunashangilia.”
    reason: lexical_alternative
  - marker: b
    text: Au “mateso” au “taabu.” Katika Kigiriki, neno hili ni la wingi mara ya kwanza, kisha ni la umoja kama kanuni ya jumla.
    reason: lexical_alternative
  - marker: c
    text: Au “ustahimilivu” au “uthabiti.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καυχώμεθα
  choice: tunafurahi
  rationale: Katika muktadha huu kitenzi kinaonyesha furaha yenye kujiamini kuhusu kazi ya Mungu, si majivuno ya kibinafsi. “Tunafurahi” ni lugha ya kawaida na ya sasa; tanbihi inadumisha maana mbadala za kujivunia au kushangilia.
- source_word: θλίψεσιν / θλῖψις
  choice: dhiki
  rationale: “Dhiki” huwasilisha shinikizo, taabu na mateso yanayokusudiwa na neno la Kigiriki. Umbo lilelile la Kiswahili linaweza kutumiwa kwa wingi katika kishazi cha kwanza na kama hali ya jumla katika kishazi cha pili.
- source_word: ὑπομονήν
  choice: uvumilivu
  rationale: “Uvumilivu” ni neno la kawaida linaloonyesha uwezo wa kuendelea kwa uthabiti chini ya shinikizo.
- source_word: κατεργάζεται
  choice: huleta
  rationale: “Huleta” huonyesha kwa lugha ya kawaida kwamba dhiki hutokeza matokeo hayo, bila kudai kwamba mchakato ni wa papo hapo.
- source_word: εἰδότες
  choice: tukijua
  rationale: Muundo huu wa kitenzi tegemezi unadumisha uhusiano wa karibu wa kishiriki cha Kigiriki na tendo kuu bila kuamua wazi kama uhusiano huo unapaswa kuelezwa kwa ‘kwa sababu’ au ‘kwa kuwa’.
theological_decisions:
- issue: Maana ya καυχώμεθα katika muktadha chanya wa kiroho
  choice: tunafurahi
  alternative: tunajivunia; tunashangilia
  rationale: Chaguo hili linaepuka wazo la majivuno ya kibinafsi huku likihifadhi mwitikio chanya na wenye kujiamini. Tanbihi inaacha wazi upana wa neno la Kigiriki.
- issue: Uhusiano kati ya dhiki na uvumilivu
  choice: dhiki huleta uvumilivu
  alternative: dhiki hutokeza uvumilivu
  rationale: Kauli imedumishwa kama kanuni anayoitoa Paulo, bila kuongeza maelezo kuhusu namna au muda ambao matokeo hayo hutokea.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi na chenye hadhi. “Wala si hivyo tu, bali pia” huhifadhi mwendelezo wa hoja. Alama za tanbihi zimewekwa mara tu baada ya maneno yanayohusika.
