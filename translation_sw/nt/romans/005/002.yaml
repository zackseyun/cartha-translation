  text: δι’ οὗ καὶ τὴν προσαγωγὴν ἐσχήκαμεν τῇ πίστει εἰς τὴν χάριν ταύτην ἐν ᾗ ἑστήκαμεν, καὶ καυχώμεθα ἐπ’ ἐλπίδι τῆς δόξης τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/002.yaml
  text: through whom we also have obtained access by faith into this grace in which we stand[a], and we boast in the hope of the glory of God.
translation:
  language: sw
  text: Kupitia yeye, sisi pia tumepata kuingia kwa imani katika neema hii ambayo ndani yake tunasimama, nasi tunajisifu[a] katika tumaini la utukufu wa Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “tunafurahi” au “tunashangilia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προσαγωγή
  choice: kuingia
  rationale: Katika muktadha huu neno hilo linaonyesha kupewa nafasi ya kuingia katika hali ya neema mbele za Mungu; “kuingia” ni ya asili na inaeleweka kwa urahisi katika Kiswahili.
- source_word: πίστει
  choice: kwa imani
  rationale: Dativu inaeleweka hapa kama njia au chombo cha kuingia, na “kwa imani” ni tafsiri fupi na ya kawaida.
- source_word: χάριν
  choice: neema
  rationale: “Neema” ni istilahi iliyozoeleka katika muktadha wa Paulo na hudumisha maana ya fadhili za Mungu zinazotolewa bila kustahiliwa.
- source_word: ἑστήκαμεν
  choice: tunasimama
  rationale: Kauli timilifu ya Kigiriki inaonyesha hali ya sasa iliyotokana na tendo lililotangulia; “tunasimama” huhifadhi hali hiyo inayoendelea bila kuongeza wazo la kusimama imara.
- source_word: καυχώμεθα
  choice: tunajisifu
  rationale: “Tunajisifu” huhifadhi nguvu na mvutano wa usemi wa Paulo kuliko “tunafurahi,” ingawa katika muktadha huu kujisifu huko ni kwa tumaini linalomwelekea Mungu.
- source_word: ἐπ’ ἐλπίδι
  choice: katika tumaini
  rationale: “Katika tumaini” ni usemi wa asili unaoweza kuonyesha tumaini kama msingi au eneo la kujisifu bila kulazimisha maana moja tu.
- source_word: δόξης τοῦ θεοῦ
  choice: utukufu wa Mungu
  rationale: Hii ni tafsiri ya moja kwa moja ya muundo wa genitivi na inadumisha uzito wa usemi wa Kigiriki.
theological_decisions:
- issue: Kutafsiri καυχώμεθα huku tukihifadhi mvutano wa kitheolojia wa Paulo
  choice: tunajisifu
  alternative: tunafurahi; tunashangilia
  rationale: Kitenzi kinaweza kumaanisha kujisifu, kufurahia, au kushangilia. “Tunajisifu” huhifadhi mshtuko wa kimakusudi na uhusiano wa kileksika na matumizi mengine ya Paulo, bila kuufanya usemi huo kuwa mwepesi kupita kiasi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “ndani yake tunasimama” unahifadhi taswira ya Kigiriki, huku “tumepata kuingia” ukieleza hali iliyopatikana na inayoendelea.
