base_translation:
  language: en
  yaml_path: translation/nt/romans/005/009.yaml
  text: Much more then[a], having now been justified by his blood[c][b], we shall be saved through him from the wrath.
translation:
  language: sw
  text: Basi, kwa kuwa sasa tumehesabiwa haki[a] kwa damu yake[b], zaidi sana tutaokolewa kwa njia yake kutoka katika ghadhabu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “tumetangazwa kuwa waadilifu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kupitia damu yake.”
    reason: lexical_alternative
  - marker: c
    text: Yaani, ghadhabu ya Mungu inayoeleweka kutokana na muktadha.
    reason: cross_reference
lexical_decisions:
- source_word: πολλῷ οὖν μᾶλλον
  choice: Basi ... hakika zaidi
  rationale: “Basi” huhifadhi hitimisho linalotokana na mstari uliotangulia, na “hakika zaidi” huonyesha msisitizo wa hoja ya Paulo kwa Kiswahili cha kawaida.
- source_word: δικαιωθέντες
  choice: kwa kuwa ... tumehesabiwa kuwa waadilifu
  rationale: Huwasilisha tendo lililokamilika kabla ya wokovu wa wakati ujao na kudumisha maana ya kimahakama ya δικαιόω bila kufafanua namna tendo hilo linavyofanyika.
- source_word: νῦν
  choice: sasa
  rationale: Huhifadhi wazi kiashirio cha wakati wa sasa.
- source_word: ἐν τῷ αἵματι αὐτοῦ
  choice: kwa damu yake
  rationale: “Kwa” huonyesha njia au msingi kwa Kiswahili cha asili huku taswira ya damu ikihifadhiwa.
- source_word: σωθησόμεθα
  choice: tutaokolewa
  rationale: Huhifadhi wakati ujao na hali ya kutendwa ya kitenzi cha Kigiriki.
- source_word: δι’ αὐτοῦ
  choice: kupitia yeye
  rationale: Huhifadhi dhana ya uwakala au njia inayobebwa na διά pamoja na hali ya nafsi ya kiwakilishi.
- source_word: ἀπὸ τῆς ὀργῆς
  choice: kutoka katika ghadhabu
  rationale: Huhifadhi maana ya kuokolewa mbali na ghadhabu bila kuongeza wazi kwamba ni ya Mungu, jambo ambalo linaeleweka kutokana na muktadha.
theological_decisions:
- issue: Maana ya δικαιωθέντες
  choice: tumehesabiwa kuwa waadilifu
  alternative: tumepewa haki; tumetangazwa kuwa waadilifu
  rationale: Chaguo hili linaeleweka kwa wasomaji wa sasa na huhifadhi mwelekeo wa kimahakama wa neno bila kuingiza maelezo ya kimadhehebu kuhusu kuhesabiwa haki.
- issue: Rejeo la τῆς ὀργῆς
  choice: ghadhabu
  alternative: ghadhabu ya Mungu
  rationale: Muktadha unaashiria ghadhabu ya Mungu, lakini Kigiriki hakitaji “Mungu” hapa; kwa hiyo neno hilo halijaongezwa katika matini kuu.
- issue: Uhusiano wa damu ya Kristo na kuhesabiwa kuwa waadilifu
  choice: kwa damu yake
  alternative: kupitia damu yake
  rationale: Kirai kinahifadhi damu kama njia au msingi bila kufafanua zaidi nadharia ya upatanisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umewekwa wazi kwa wasomaji wa kawaida, huku wakati ujao wa wokovu, taswira ya damu, na kutotajwa wazi kwa mwenye ghadhabu vikihifadhiwa.
