  text: νόμος δὲ παρεισῆλθεν ἵνα πλεονάσῃ τὸ παράπτωμα· οὗ δὲ ἐπλεόνασεν ἡ ἁμαρτία, ὑπερεπερίσσευσεν ἡ χάρις,
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/020.yaml
  text: The law came in alongside so that the trespass might increase; but where sin increased, grace overflowed all the more,
translation:
  language: sw
  text: Sheria iliingia kwa kuongezea[a] ili kosa[b] liongezeke; lakini mahali dhambi ilipoongezeka, neema ilifurika zaidi sana[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “iliingia pia” au “iliingia sambamba na hayo.” Kigiriki hudokeza kuingia kwa kuongezea jambo lililokuwapo tayari.
    reason: lexical_alternative
  - marker: b
    text: Au, “ukiukaji” au “tendo la kuasi.”
    reason: lexical_alternative
  - marker: c
    text: Au, “neema ilizidi kwa wingi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: νόμος
  choice: Sheria
  rationale: Katika muktadha wa Paulo, nomino yenye kibainishi inaelekea kumaanisha Sheria ya Musa; herufi kubwa inasaidia kuonyesha rejeo hilo maalumu.
- source_word: παρεισῆλθεν
  choice: nayo ikaingia
  rationale: Muundo huu wa Kiswahili unaonyesha kuwa Sheria iliingia pia katika hali iliyokuwapo tayari. Tanbihi inahifadhi maana ya kuingia kando au kwa kuongezea iliyomo katika kiambishi cha Kigiriki para-.
- source_word: ἵνα πλεονάσῃ
  choice: ili ... liongezeke
  rationale: Huhifadhi wazi muundo wa kusudi wa ἵνα pamoja na hali tegemezi, bila kuugeuza kimya kuwa matokeo tu.
- source_word: τὸ παράπτωμα
  choice: kosa
  rationale: Neno hili la kawaida linaeleza tendo la kukiuka lililo katika muktadha wa kosa la Adamu, bila kulifanya kuwa dhana ngumu isiyo ya kawaida.
- source_word: οὗ
  choice: mahali ... ilipo-
  rationale: Ni njia ya kawaida na ya wazi ya Kiswahili ya kutafsiri kielezi cha uhusiano chenye maana ya 'ambapo' au 'mahali ambapo.'
- source_word: ἁμαρτία
  choice: dhambi
  rationale: Hili ndilo neno la kawaida na linalofaa katika matumizi ya Paulo.
- source_word: ὑπερεπερίσσευσεν
  choice: ilifurika zaidi sana
  rationale: Kitenzi hiki chenye nguvu kinamaanisha kuzidi kwa kiwango kikubwa; 'ilifurika zaidi sana' huhifadhi picha ya wingi unaozidi badala ya kusema tu 'iliongezeka.'
- source_word: ἡ χάρις
  choice: neema
  rationale: Hili ndilo neno la kawaida, wazi, na lenye uzito unaofaa kwa χάρις katika muktadha huu.
theological_decisions:
- issue: Ikiwa ἵνα katika kauli kuhusu Sheria na kuongezeka kwa kosa itafsiriwe kama kusudi au ipunguzwe nguvu na kuwa matokeo tu.
  choice: ili kosa liongezeke
  alternative: hivyo kosa likaongezeka; au, na matokeo yake kosa likaongezeka
  rationale: Kigiriki kinatumia ἵνα pamoja na hali tegemezi na kwa kawaida huonyesha kusudi. Tafsiri inahifadhi mvutano huo wa kiteolojia bila kudokeza kwamba Mungu anaipenda dhambi wala kuubadili muundo kuwa matokeo tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa kusudi umehifadhiwa, na picha yenye nguvu ya neema kufurika inawasilisha uzito wa kitenzi cha Kigiriki.
