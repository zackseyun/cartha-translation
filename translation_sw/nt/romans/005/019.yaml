  text: ὥσπερ γὰρ διὰ τῆς παρακοῆς τοῦ ἑνὸς ἀνθρώπου ἁμαρτωλοὶ κατεστάθησαν οἱ πολλοί, οὕτως καὶ διὰ τῆς ὑπακοῆς τοῦ ἑνὸς δίκαιοι κατασταθήσονται οἱ πολλοί.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/019.yaml
  text: For just as through the disobedience of the one man the many were made sinners[c][b][a], so also through the obedience of the one man the many will be made righteous.
translation:
  language: sw
  text: Kwa maana, kama vile kwa kutotii kwa mtu huyo mmoja wale wengi walifanywa wenye dhambi,[a] vivyo hivyo kwa kutii kwa mtu huyo mmoja[b] wale wengi watafanywa wenye haki.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “waliwekwa kuwa wenye dhambi.”
    reason: lexical_alternative
  - marker: b
    text: 'Kigiriki: “kwa kutii kwa huyo mmoja”; neno “mtu” limeongezwa ili kufanya ulinganifu uwe wazi.'
    reason: lexical_alternative
  - marker: c
    text: Au “watawekwa kuwa wenye haki.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακοῆς
  choice: kutotii
  rationale: Neno hili huonyesha kushindwa au kukataa kutii, na linadumisha ulinganifu wa moja kwa moja na ὑπακοή (kutii).
- source_word: τοῦ ἑνὸς ἀνθρώπου
  choice: kwa mtu mmoja
  rationale: Kirai hiki kinamtambulisha mtu mmoja anayezungumziwa katika muktadha, yaani Adamu, bila kuingiza jina lake ndani ya mstari.
- source_word: ἁμαρτωλοὶ
  choice: wenye dhambi
  rationale: Kivumishi hiki kimetumiwa kama jina au kiarifu; “wenye dhambi” ni Kiswahili cha kawaida na kinachoeleweka.
- source_word: κατεστάθησαν
  choice: walifanywa
  rationale: Hapa kitenzi kinaonyesha kuwekwa au kufanywa kuwa na hali fulani. “Walifanywa” ni cha kawaida na kinadumisha ulinganifu na kitenzi cha wakati ujao katika sehemu ya pili.
- source_word: οἱ πολλοί
  choice: hao wengi
  rationale: “Hao wengi” kinawakilisha kundi maalumu linaloonyeshwa na kiarifu cha Kigiriki, badala ya kukifanya kirai kuwa “wengi” kisicho bayana au kukitafsiri kwa kufasiri kuwa “wote.”
- source_word: ὑπακοῆς
  choice: kutii
  rationale: Hili ndilo neno la kawaida linalolingana moja kwa moja na παρακοή (kutotii), hivyo linahifadhi ulinganifu wa Adamu na Kristo.
- source_word: τοῦ ἑνὸς
  choice: kwa huyo mmoja
  rationale: Kigiriki kinasema kihalisi “kwa huyo mmoja” bila kurudia ἀνθρώπου. Kiswahili hiki ni cha asili na kinahifadhi ufupi huo huku kikimtambulisha yule aliyetajwa kwa kulinganishwa.
- source_word: δίκαιοι
  choice: wenye haki
  rationale: “Wenye haki” linawakilisha δίκαιοι kwa uwazi na linadumisha uhusiano wa msamiati wa haki bila kuifanya kauli kuwa tafsiri finyu ya kimafundisho.
- source_word: κατασταθήσονται
  choice: watafanywa
  rationale: Wakati ujao na hali ya kutendwa vimehifadhiwa, pamoja na ulinganifu wake na κατεστάθησαν. Tafsiri hii haibadili kitenzi kuwa “watatangazwa,” ambalo lingekuwa neno la kufasiri zaidi.
theological_decisions:
- issue: 'Upeo wa οἱ πολλοί: iwapo itafsiriwe “hao wengi” au ifasiriwe kuwa “wote.”'
  choice: hao wengi
  alternative: wote; watu wengi
  rationale: Kigiriki kinasema οἱ πολλοί. Tafsiri inahifadhi namna Paulo alivyoliweka kundi hilo bila kuamua kimya kimya upeo wake wa kiteolojia.
- issue: Iwapo κατασταθήσονται δίκαιοι itolewe kama hali ya kuwa wenye haki au kama tangazo la kimahakama.
  choice: watafanywa wenye haki
  alternative: watatangazwa kuwa wenye haki; watawekwa kuwa wenye haki
  rationale: Kigiriki kinatumia καθίστημι pamoja na δίκαιοι, si δικαιόω. “Watafanywa wenye haki” kinafuata maneno hayo na kuacha maana kamili ya kiteolojia bila kuifunga kwa ufafanuzi mmoja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Ulinganifu wa sehemu mbili umehifadhiwa kwa “kama vile … vivyo hivyo,” “kutotii … kutii,” na “walifanywa … watafanywa.”
