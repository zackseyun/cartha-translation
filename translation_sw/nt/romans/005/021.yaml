  text: ἵνα ὥσπερ ἐβασίλευσεν ἡ ἁμαρτία ἐν τῷ θανάτῳ, οὕτως καὶ ἡ χάρις βασιλεύσῃ διὰ δικαιοσύνης εἰς ζωὴν αἰώνιον διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/021.yaml
  text: so that[a], just as sin reigned in death[c][b], so also grace might reign through righteousness to eternal life through Jesus the Messiah our Lord.
translation:
  language: sw
  text: ili, kama vile dhambi ilivyotawala katika mauti, vivyo hivyo neema nayo itawale kwa njia ya haki[a], hata kufikia uzima wa milele kwa njia ya Yesu Masihi[b] Bwana wetu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa njia ya uadilifu.”
    reason: lexical_alternative
  - marker: b
    text: 'Kigiriki: “Yesu Kristo”; hapa neno Χριστός limetafsiriwa “Masihi” kwa kuwa ni cheo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: ili kwamba
  rationale: Inaonyesha kusudi au matokeo na kutawala kitenzi cha utegemezi ‘itawale’ kwa Kiswahili cha kawaida.
- source_word: ἐβασίλευσεν
  choice: ilivyotawala
  rationale: Inadumisha sitiari ya utawala wa kifalme na kuunganika kwa kawaida na muundo ‘kama vile ... vivyo hivyo’.
- source_word: ἐν τῷ θανάτῳ
  choice: katika mauti
  rationale: ‘Katika’ inadumisha maana inayowezekana ya eneo au mazingira ya utawala bila kuibadili waziwazi kuwa njia au chombo.
- source_word: ἡ χάρις
  choice: neema
  rationale: Ni istilahi ya kawaida na yenye kueleweka inayodumisha uhuishaji wa neema kama nguvu inayotawala.
- source_word: βασιλεύσῃ
  choice: itawale
  rationale: Hali ya utegemezi baada ya ἵνα inaonyeshwa kwa muundo wa Kiswahili ‘ili kwamba ... itawale’, huku sitiari ya kifalme ikihifadhiwa.
- source_word: διὰ δικαιοσύνης
  choice: kwa njia ya haki
  rationale: Inaonyesha διά kama njia au chombo; ‘haki’ inadumisha upana wa δικαιοσύνη unaoweza kuhusisha uadilifu na haki ya kimahakama.
- source_word: εἰς ζωὴν αἰώνιον
  choice: hata kufikia uzima wa milele
  rationale: Inaonyesha mwelekeo au matokeo yanayolengwa na εἰς kwa Kiswahili cha asili.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesu Masihi
  rationale: ‘Masihi’ huwasilisha Χριστός kama cheo chenye maana, si kama jina lisilotafsiriwa.
- source_word: τοῦ κυρίου ἡμῶν
  choice: Bwana wetu
  rationale: Tafsiri ya moja kwa moja, ya kawaida na yenye hadhi ya κύριος pamoja na kiwakilishi milikishi.
theological_decisions:
- issue: Maana pana ya δικαιοσύνη katika muktadha wa Paulo
  choice: kwa njia ya haki
  alternative: kwa njia ya uadilifu
  rationale: ‘Haki’ ni istilahi pana na ya kawaida katika tafsiri za kibiblia za Kiswahili; tanbihi inadumisha uwezekano wa kusisitiza uadilifu bila kuufunga usemi katika maana moja.
- issue: Χριστός kama cheo au kama sehemu ya jina
  choice: Yesu Masihi
  alternative: Yesu Kristo
  rationale: Hapa ‘Masihi’ huweka wazi maana ya cheo cha Χριστός, huku ‘Kristo’ ikihifadhiwa kama namna nyingine iliyozoeleka.
- issue: Nguvu ya ἐν katika ἐν τῷ θανάτῳ
  choice: katika mauti
  alternative: kwa njia ya mauti
  rationale: ‘Katika mauti’ inadumisha kwa karibu maana ya mazingira au nyanja; ‘kwa njia ya mauti’ ingeamua kwamba mauti ni chombo, jambo ambalo maandishi ya Kigiriki hayalazimishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo ‘kama vile ... vivyo hivyo’ unadumisha ulinganisho wa Paulo; ‘mauti’ imetumiwa badala ya ‘kifo’ ili kufaa sajili ya kibiblia bila kuwa ya kizamani sana.
