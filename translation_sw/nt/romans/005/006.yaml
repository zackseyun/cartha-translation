  text: ⸂Ἔτι γὰρ⸃ Χριστὸς ὄντων ἡμῶν ἀσθενῶν ⸀ἔτι κατὰ καιρὸν ὑπὲρ ἀσεβῶν ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/006.yaml
  text: For while we were still weak[a], at the right time Messiah died for the ungodly.
translation:
  language: sw
  text: 'Kwa maana, tulipokuwa bado hatuna nguvu, kwa wakati ufaao Masihi alikufa kwa ajili ya wasiomcha Mungu.[a]


    [a] Au, “kwa niaba ya wasiomcha Mungu.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa niaba ya wasiomcha Mungu.”
    reason: Inaonyesha maana mbadala ya ὑπέρ bila kuifanya kuwa ndiyo tafsiri pekee; alama imewekwa baada ya kirai kinachohusika badala ya baada ya “hatuna nguvu.”
lexical_decisions:
- source_word: Χριστὸς
  choice: Masihi
  rationale: Neno la cheo Χριστός limetafsiriwa kuwa “Masihi,” badala ya kutoholewa kuwa “Kristo,” ili kuonyesha maana yake ya cheo katika muktadha huu.
- source_word: ὄντων ἡμῶν ἀσθενῶν
  choice: tulipokuwa bado hatuna nguvu
  rationale: Muundo wa genitivi huru umetolewa kama kishazi cha wakati katika Kiswahili cha kawaida. “Hatuna nguvu” hapa huonyesha kutoweza au kutokuwa na uwezo bila kuufanya udhaifu huu kuwa wa kimwili tu.
- source_word: ἔτι
  choice: bado
  rationale: “Bado” huonyesha hali iliyokuwa ikiendelea. Ingawa ushahidi wa matini una mpangilio wenye kurudiwa kwa ἔτι, matumizi moja ya “bado” yanatoa maana hiyo kwa Kiswahili cha asili bila uradidi usio wa kawaida.
- source_word: κατὰ καιρὸν
  choice: kwa wakati ufaao
  rationale: Usemi huu huonyesha wakati unaofaa au uliowekwa. “Kwa wakati ufaao” ni wazi na hauamui waziwazi zaidi ya matini ikiwa wakati huo ulikuwa umeamuliwa kimungu.
- source_word: ὑπὲρ
  choice: kwa ajili ya
  rationale: “Kwa ajili ya” ni usemi wa kawaida unaobeba maana ya kufa kwa manufaa ya wengine huku ukiacha wazi kiwango kamili cha uwakilishi au ubadala kinachoweza kudokezwa na ὑπέρ.
- source_word: ἀσεβῶν
  choice: wasiomcha Mungu
  rationale: Chaguo hili linaeleza watu wasio na uchaji au heshima kwa Mungu kwa Kiswahili cha sasa na kinachoeleweka, bila kuwadokeza tu watu wanaokana kuwapo kwa Mungu.
- source_word: ἀπέθανεν
  choice: alikufa
  rationale: Kitenzi cha aoristi kimetafsiriwa moja kwa moja kwa wakati uliopita; hakuna upanuzi unaohitajika.
theological_decisions:
- issue: Maana ya kifo cha Masihi iliyoelezwa kwa ὑπὲρ ἀσεβῶν
  choice: kwa ajili ya wasiomcha Mungu
  alternative: kwa niaba ya wasiomcha Mungu
  rationale: “Kwa ajili ya” huonyesha wazi kuwa kifo hicho kilikuwa kwa manufaa ya wasiomcha Mungu, lakini hakilazimishi ufafanuzi mmoja wa kimfumo kuhusu uwakilishi au ubadala. Chaguo la “kwa niaba ya” limetajwa katika tanbihi kama uwezekano wa maana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Sentensi imetumia “hatuna nguvu” kwa hali ya kutoweza na “wasiomcha Mungu” kwa ἀσεβῶν. Alama ya tanbihi imeunganishwa na kirai cha ὑπέρ ambacho tanbihi inakifafanua.
