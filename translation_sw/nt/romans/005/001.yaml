    reason: lexical_alternative
lexical_decisions:
- source_word: Δικαιωθέντες
  choice: tumehesabiwa haki
  rationale: Kitenzi kishirikishi cha wakati uliopita, kauli tendwa, kinaonyesha tendo la kuhesabiwa haki ambalo tayari limetendeka. Kauli hii huhifadhi maana ya kimahakama bila kufafanua kwa namna inayofungamana na msimamo fulani wa kimadhehebu.
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Huonyesha hitimisho linalotokana na hoja iliyotangulia; “Kwa hiyo” ni kiunganishi cha kawaida na wazi katika Kiswahili cha sasa.
- source_word: ἐκ πίστεως
  choice: kwa imani
  rationale: Ingawa ἐκ kimsingi humaanisha “kutoka,” katika muundo huu “kwa imani” ni tafsiri ya kawaida na yenye kueleweka, huku uwezekano wa “kwa msingi wa imani” ukihifadhiwa katika tanbihi.
- source_word: εἰρήνην
  choice: amani
  rationale: Hutafsiri nomino ya Kigiriki moja kwa moja na kuhifadhi upana wa maana ya uhusiano uliorejeshwa na Mungu bila kuibana kuwa hisia ya utulivu wa ndani au kuibadili kuwa “upatanisho.”
- source_word: ἔχομεν
  choice: tuna
  rationale: Nakala iliyotolewa ya SBLGNT ina hali elekezi, “tuna”; usomaji wa hali ya kusihi, “na tuwe,” umeonyeshwa katika tanbihi.
- source_word: πρὸς τὸν θεὸν
  choice: na Mungu
  rationale: Pamoja na “amani,” kifungu hiki kwa Kiswahili cha kawaida ni “amani na Mungu,” kikieleza uhusiano wa amani kati ya waamini na Mungu.
- source_word: κυρίου
  choice: Bwana
  rationale: Ni tafsiri iliyozoeleka, yenye heshima, na inayofaa kwa κύριος katika muktadha huu.
- source_word: Χριστοῦ
  choice: Masihi
  rationale: Χριστός hapa ni cheo; “Masihi” huwasilisha maana yake, huku “Kristo” kama tafsiri ya kimapokeo ikitajwa katika tanbihi.
theological_decisions:
- issue: Maana ya Δικαιωθέντες katika teolojia ya Paulo
  choice: tumehesabiwa haki
  alternative: tumetangazwa kuwa waadilifu; tumefanywa waadilifu
  rationale: Tafsiri hii inaeleza tendo la Mungu la kuhalalisha bila kuipanua aya iwe fomula kamili ya kiteolojia au kuamua mvutano kati ya matokeo ya kimahakama na mabadiliko ya hali.
- issue: Maana ya “amani na Mungu”
  choice: amani na Mungu
  alternative: utulivu wa ndani kutoka kwa Mungu; upatanisho na Mungu
  rationale: Muktadha unaelekeza hasa kwenye uhusiano wa amani na Mungu, lakini neno lenyewe ni “amani.” Hivyo tafsiri haibadili neno hilo kuwa tafsiri finyu zaidi ya “upatanisho” wala kuwa hisia binafsi pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo ni wa kawaida kwa msomaji wa leo, huku istilahi “tumehesabiwa haki” ikihifadhi uzito wa kiteolojia wa maandishi bila maelezo ya kimadhehebu.
