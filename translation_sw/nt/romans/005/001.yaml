base_translation:
  language: en
  yaml_path: translation/nt/romans/005/001.yaml
  text: Therefore[a], since we have been justified by faith, we have peace with God through our Lord Jesus the Messiah[c][b],
translation:
  language: sw
  text: Kwa hiyo, kwa kuwa tumehesabiwa haki kwa imani[b], tuna amani[a] na Mungu kwa njia ya Bwana wetu Yesu Masihi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati zina usomaji, “na tuwe na amani na Mungu.”
    reason: textual_variant
  - marker: b
    text: Au, “kwa msingi wa imani.”
    reason: lexical_alternative
  - marker: c
