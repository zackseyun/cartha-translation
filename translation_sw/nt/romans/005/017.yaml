id: ROM.5.17
reference: Romans 5:17
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἰ γὰρ τῷ τοῦ ἑνὸς παραπτώματι ὁ θάνατος ἐβασίλευσεν διὰ τοῦ ἑνός, πολλῷ μᾶλλον οἱ τὴν περισσείαν τῆς χάριτος καὶ τῆς δωρεᾶς τῆς δικαιοσύνης λαμβάνοντες ἐν ζωῇ βασιλεύσουσιν διὰ τοῦ ἑνὸς Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/017.yaml
  text: For if[a], by the trespass of the one, death reigned through the one, much more will those who receive the abundance of grace and the gift of righteousness reign in life through the one[b], Jesus the Messiah.
translation:
  language: sw
  text: Kwa maana ikiwa, kwa kosa la mtu mmoja, kifo kilitawala kwa njia ya huyo mmoja, basi zaidi sana wale wanaopokea neema tele na zawadi ya haki[a] watatawala katika uzima kwa njia ya huyo mmoja, Yesu Kristo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “zawadi ya uadilifu.”
    reason: lexical_alternative
  - marker: b
    text: Au “Yesu Masihi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παραπτώματι
  choice: kosa
  rationale: Neno “kosa” linaeleza tendo la kukiuka lililofanywa na Adamu bila kutumia istilahi nzito kupita kiasi.
- source_word: ἐβασίλευσεν / βασιλεύσουσιν
  choice: kilitawala / watatawala
  rationale: Muundo huu unadumisha taswira ya kifalme na ulinganifu kati ya kifo kilichotawala na watu watakaotawala.
- source_word: περισσείαν τῆς χάριτος
  choice: neema tele
  rationale: “Neema tele” ni Kiswahili cha asili kinachoonyesha wingi mkubwa wa neema bila kupanua maana.
- source_word: δωρεᾶς τῆς δικαιοσύνης
  choice: zawadi ya haki
  rationale: “Zawadi” hudumisha hali ya kutolewa bure, na “haki” ni tafsiri pana inayofaa kwa δικαιοσύνη katika muktadha huu.
- source_word: λαμβάνοντες
  choice: wanaopokea
  rationale: Kauli hii inawatambulisha watu kwa tendo lao la kupokea na kudumisha hali ya sasa ya kitenzi kishirikishi.
- source_word: ἐν ζωῇ
  choice: katika uzima
  rationale: Tafsiri hii inahifadhi usemi mfupi wa Kigiriki na tofauti yake ya makusudi na kifo.
- source_word: διὰ τοῦ ἑνὸς
  choice: kwa njia ya huyo mmoja
  rationale: “Huyo mmoja” hudumisha msisitizo unaorudiwa kuhusu mtu mmoja na kuunganisha ulinganifu wa Adamu na Yesu.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesu Kristo
  rationale: “Kristo” ni umbo la kawaida na lenye hadhi katika Kiswahili kwa jina-taji hili; maana ya kitaji “Masihi” imehifadhiwa katika tanbihi.
theological_decisions:
- issue: Maana ya δικαιοσύνης katika usemi wa Paulo
  choice: zawadi ya haki
  alternative: zawadi ya uadilifu
  rationale: “Haki” hudumisha upana wa neno hilo katika muktadha wa Adamu, Kristo, na kuhesabiwa haki, bila kulifunga kwa ufafanuzi mmoja; “uadilifu” limehifadhiwa kama uwezekano wa kileksika.
- issue: Jinsi ya kutafsiri Χριστοῦ katika Ἰησοῦ Χριστοῦ
  choice: Yesu Kristo
  alternative: Yesu Masihi
  rationale: Katika mfuatano huu neno hilo linafanya kazi kwa namna inayokaribia jina lililozoeleka, huku “Masihi” likiweka wazi maana yake kama cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Basi” linaweka wazi uhusiano wa sharti na matokeo, na marudio ya “huyo mmoja” yanahifadhi msisitizo wa Kigiriki.
