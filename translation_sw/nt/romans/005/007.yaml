base_translation:
  language: en
  yaml_path: translation/nt/romans/005/007.yaml
  text: For hardly will anyone die for a righteous person[b][a]; though perhaps for a good person someone might even dare to die.
translation:
  language: sw
  text: Kwa maana ni nadra sana mtu kufa kwa ajili ya mtu mwenye haki[a]; lakini huenda mtu akathubutu hata kufa kwa ajili ya mtu mwema.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki kina kivumishi cha umbo la kiume kilichotumiwa kama nomino, lakini hapa kinaweza kumaanisha mtu yeyote mwenye haki.
    reason: lexical_alternative
  - marker: b
    text: Huenda tofauti kati ya “mwenye haki” na “mwema” imekusudiwa, wala si mabadiliko ya mtindo tu.
    reason: alternative_reading
lexical_decisions:
- source_word: μόλις
  choice: ni vigumu sana
  rationale: Kishazi hiki kinaonyesha kwamba jambo hilo hutokea kwa nadra sana au kwa shida; ni Kiswahili cha kawaida kinachosisitiza hali yake isiyo ya kawaida.
- source_word: ὑπὲρ
  choice: kwa ajili ya
  rationale: Katika muktadha huu, kihusishi kinaonyesha kufa kwa manufaa au kwa niaba ya mwingine; 'kwa ajili ya' ni cha asili na hakilazimishi ufafanuzi zaidi ya chanzo.
- source_word: δικαίου
  choice: mtu mwenye haki
  rationale: Kivumishi kimetumiwa kama nomino kumaanisha mtu aliye na sifa ya haki. Tafsiri hii ni ya kijumla kijinsia na inahifadhi tofauti na 'mtu mwema'.
- source_word: ἀποθανεῖται
  choice: mtu kufa
  rationale: Ingawa Kigiriki kina wakati ujao, kauli hii ni ya jumla; muundo wa Kiswahili wenye kitenzi-jina unasikika kwa kawaida na kuwasilisha uwezekano wa tendo hilo bila kubadili hoja.
- source_word: τοῦ ἀγαθοῦ
  choice: mtu mwema
  rationale: Huhifadhi tofauti ya kileksia kati ya mwenye haki na mwema bila kuamua kama 'mwema' hapa ni mfadhili au mtu mwenye fadhili kwa maana maalumu.
- source_word: τάχα
  choice: huenda
  rationale: Huonyesha uwezekano usio na uhakika kwa sauti ya kiasi inayolingana na Kigiriki.
- source_word: καὶ
  choice: hata
  rationale: 'Hapa neno hili linaongeza msisitizo: mtu anaweza kufikia hatua ya kuthubutu kufa.'
- source_word: τολμᾷ
  choice: akathubutu
  rationale: Huwasilisha wazo la kuwa na ujasiri wa kufanya jambo lisilo la kawaida, likiunganishwa kwa kawaida na 'huenda'.
- source_word: ἀποθανεῖν
  choice: kufa
  rationale: Tafsiri ya moja kwa moja inayohifadhi kurudiwa kwa wazo la kifo katika vifungu vyote viwili.
theological_decisions:
- issue: Iwapo kuhifadhi tofauti kati ya δικαίου na ἀγαθοῦ
  choice: 'Kutafsiri kwa maneno tofauti: ''mtu mwenye haki'' na ''mtu mwema.'''
  alternative: Kuyachukulia kama visawe na kutumia neno lilelile au maneno yasiyoonyesha tofauti.
  rationale: Chanzo kinatumia maneno mawili tofauti, na tofauti hiyo huenda ikawa sehemu ya hoja ya Paulo. Tafsiri haipaswi kuifuta wala kuieleza kwa namna ya kidhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Mpangilio unahifadhi ulinganisho na uwezekano wa tahadhari wa chanzo bila kufafanua kupita kiasi tofauti kati ya haki na wema.
