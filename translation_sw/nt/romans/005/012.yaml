id: ROM.5.12
reference: Romans 5:12
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Διὰ τοῦτο ὥσπερ δι’ ἑνὸς ἀνθρώπου ἡ ἁμαρτία εἰς τὸν κόσμον εἰσῆλθεν καὶ διὰ τῆς ἁμαρτίας ὁ θάνατος, καὶ οὕτως εἰς πάντας ἀνθρώπους ὁ θάνατος διῆλθεν ἐφ’ ᾧ πάντες ἥμαρτον—
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/012.yaml
  text: Therefore[a], just as sin entered into the world through one man, and death through sin, so also death spread to all people, because all sinned—
translation:
  language: sw
  text: Kwa hiyo, kama vile dhambi ilivyoingia ulimwenguni kupitia mtu mmoja, na kifo kupitia dhambi, vivyo hivyo kifo kikaenea kwa watu wote, kwa sababu[a] wote walitenda dhambi—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa tafsiri ya kimapokeo zaidi: “Ndani yake wote walitenda dhambi.”'
    reason: Inahifadhi tafsiri ya uwakilishi ya ἐφ’ ᾧ bila kuifanya kuwa tafsiri kuu.
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Kwa hiyo
  rationale: Inaonyesha hitimisho au mpito wa kimantiki kutoka hoja iliyotangulia kwa Kiswahili cha kawaida na fasaha.
- source_word: δι’ ἑνὸς ἀνθρώπου
  choice: kupitia mtu mmoja
  rationale: Neno διά pamoja na hali ya umilikaji huonyesha njia au wakala; “mtu mmoja” hapa linamhusu Adamu na pia linadumisha ulinganisho unaofuata.
- source_word: ἡ ἁμαρτία
  choice: dhambi
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa dhana ya Paulo, bila kuongeza ufafanuzi usiomo katika Kigiriki.
- source_word: εἰς τὸν κόσμον εἰσῆλθεν
  choice: iliingia ulimwenguni
  rationale: Linahifadhi wazo la kuingia ndani ya ulimwengu kwa usemi wa asili wa Kiswahili.
- source_word: διὰ τῆς ἁμαρτίας ὁ θάνατος
  choice: na kifo kupitia dhambi
  rationale: 'Linadumisha muundo sambamba na ufupi wa Kigiriki: dhambi kupitia mtu mmoja, kifo kupitia dhambi.'
- source_word: οὕτως
  choice: vivyo hivyo
  rationale: Linaonyesha ulinganifu na matokeo yanayohusiana na sehemu ya kwanza ya sentensi.
- source_word: εἰς πάντας ἀνθρώπους
  choice: kwa watu wote
  rationale: ἀνθρώπους hapa linawahusu wanadamu wote, si wanaume pekee; “watu wote” ni wazi na jumuishi.
- source_word: ὁ θάνατος διῆλθεν
  choice: kifo kikaenea
  rationale: Kitenzi kinaonyesha mwendo uliofikia wanadamu wote; “kikaenea” huwasilisha wigo huo kwa Kiswahili cha kawaida.
- source_word: ἐφ’ ᾧ
  choice: kwa sababu
  rationale: Katika muktadha huu, usemi huo unaeleweka kwa kawaida kuwa wa kisababishi, huku tafsiri ya kimapokeo ikihifadhiwa katika tanbihi.
- source_word: πάντες ἥμαρτον
  choice: wote walitenda dhambi
  rationale: Wakati uliopita unawakilisha aoristi ya Kigiriki bila kuibadili kuwa hali timilifu.
theological_decisions:
- issue: Maana ya ἐφ’ ᾧ πάντες ἥμαρτον
  choice: 'Maana ya kisababishi: “kwa sababu wote walitenda dhambi”'
  alternative: 'Maana ya uwakilishi au ushirika: “ambaye ndani yake wote walitenda dhambi”'
  rationale: Muundo wa Kigiriki katika muktadha huu unaunga mkono kwa urahisi maana ya kisababishi. Kwa kuwa tafsiri hii ina uzito katika mjadala kuhusu Adamu na wanadamu, maana ya kimapokeo haijaondolewa bali imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Alama ya mwisho ya mstari mrefu imehifadhiwa kwa sababu sentensi na ulinganisho wa Paulo unaendelea katika mistari inayofuata.
