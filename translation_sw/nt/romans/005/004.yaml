  text: ἡ δὲ ὑπομονὴ δοκιμήν, ἡ δὲ δοκιμὴ ἐλπίδα.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/004.yaml
  text: and endurance produces proven character[a], and proven character produces hope.
translation:
  language: sw
  text: na ustahimilivu huleta tabia iliyothibitika[a], na tabia iliyothibitika huleta tumaini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “tabia iliyojaribiwa” au “kukubalika baada ya kujaribiwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπομονή
  choice: ustahimilivu
  rationale: Neno hili linaonyesha uwezo wa kuendelea kusimama imara chini ya taabu; ni la kawaida na linafaa katika mfululizo wa mawazo wa kifungu hiki.
- source_word: δοκιμή
  choice: tabia iliyothibitika
  rationale: Kirai hiki kinaonyesha tabia ambayo imepitia majaribu na kuonekana kuwa halisi, si tabia kwa maana ya jumla tu.
- source_word: ἐλπίς
  choice: tumaini
  rationale: Hili ndilo neno la kawaida na la asili katika Kiswahili; katika muktadha huu linaonyesha tarajio lenye msingi katika Mungu bila kuongeza ufafanuzi usiomo katika mstari.
- source_word: δὲ
  choice: na
  rationale: Hapa neno hili linaunganisha hatua zinazofuatana badala ya kuonyesha tofauti kali.
- source_word: ellipsis of verb (κατεργάζεται supplied from context)
  choice: huleta
  rationale: Kitenzi kilichoachwa katika Kigiriki kimeeleweka kutokana na mstari uliotangulia; “huleta” kinaonyesha matokeo kwa Kiswahili cha kawaida bila kupanua maana kupita kiasi.
theological_decisions:
- issue: Maana ya δοκιμή katika mfululizo wa kukua kupitia taabu
  choice: Tabia ambayo imejaribiwa na kuthibitika kuwa halisi
  alternative: Mchakato wa kujaribiwa, au kukubaliwa baada ya kujaribiwa
  rationale: Katika mfululizo huu δοκιμή ni matokeo ya ustahimilivu. “Tabia iliyothibitika” huhifadhi wazo la sifa iliyoonekana kuwa halisi bila kuingiza dai la ziada la kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kurudia “huleta” umewekwa wazi kwa uelewekaji na kuhifadhi mfululizo wa hatua katika sentensi.
