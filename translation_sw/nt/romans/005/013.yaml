  text: ἄχρι γὰρ νόμου ἁμαρτία ἦν ἐν κόσμῳ, ἁμαρτία δὲ οὐκ ἐλλογεῖται μὴ ὄντος νόμου,
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/013.yaml
  text: For until the law[a], sin was in the world; but sin is not counted where there is no law.
translation:
  language: sw
  text: Kwa maana, kabla ya Sheria, dhambi ilikuwako ulimwenguni; lakini dhambi haihesabiwi[a] wakati Sheria haipo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “haiwekwi katika hesabu ya mtu” au “haichukuliwi kuwa deni la mtu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄχρι γὰρ νόμου
  choice: Kwa maana, hadi Sheria ilipotolewa
  rationale: ἄχρι marks the period extending to the coming of the Mosaic law. Adding “ilipotolewa” makes the temporal expression natural in Swahili while leaving the contextual Mosaic referent implicit in “Sheria.”
- source_word: ἁμαρτία
  choice: dhambi
  rationale: This is the standard Swahili equivalent and preserves the abstract singular, including its possible personified force in Paul’s argument.
- source_word: ἐν κόσμῳ
  choice: ulimwenguni
  rationale: A natural, direct rendering referring to the human world in which sin was present.
- source_word: ἐλλογεῖται
  choice: haihesabiwi
  rationale: This clear, non-technical wording retains the verb’s accounting or reckoning sense without importing a doctrinally loaded term into the main text.
- source_word: μὴ ὄντος νόμου
  choice: wakati hakuna sheria
  rationale: The genitive absolute states absence of law as the condition. “Wakati hakuna sheria” is idiomatic and preserves its temporal or circumstantial force without specifying more than the Greek.
theological_decisions:
- issue: Referent of νόμου
  choice: Sheria, with the Mosaic law implied by context
  alternative: sheria in a wholly generic sense
  rationale: The surrounding contrast between Adam and Moses makes the Mosaic law the likely contextual referent. Capitalizing “Sheria” signals that established referent without adding “ya Musa” to the text.
- issue: Force of ἐλλογεῖται
  choice: haihesabiwi
  alternative: haiwekwi katika hesabu ya mtu; haihesabiwi kuwa juu ya mtu
  rationale: The main wording preserves the accounting and judicial ambiguity while avoiding a technical term that could settle debates about imputation. The footnote supplies fuller accounting alternatives.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. Sentensi ni nyepesi kusomeka huku ikidumisha uhusiano wa kimantiki wa kifungu cha Kigiriki. Alama ya tanbihi imewekwa baada ya neno linalohusika, “haihesabiwi.”
