lexical_decisions:
- source_word: ἐν οἷς
  choice: miongoni mwao
  rationale: Kiwakilishi hiki cha wingi kinawarejelea watu wa mataifa waliotajwa katika mstari uliotangulia; “miongoni mwao” huonyesha kwa kawaida kwamba waamini wa Roma wamejumuishwa katika kundi hilo.
- source_word: ἐστε
  choice: ni
  rationale: Kitenzi cha hali ya sasa kinaonyeshwa kwa kopula ya kawaida ya Kiswahili katika sentensi “Ninyi pia ni miongoni mwao.”
- source_word: καὶ ὑμεῖς
  choice: Ninyi pia
  rationale: Mpangilio huu wa kawaida wa Kiswahili unadumisha msisitizo wa kwamba wasomaji nao wamejumuishwa.
- source_word: κλητοὶ
  choice: mlioitwa
  rationale: “Mlioitwa” huhifadhi maana ya kuitwa bila kuifanya iwe mwaliko wa kawaida tu au kuongeza maelezo ya kitheolojia yasiyosemwa wazi.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesu Masihi
  rationale: Ἰησοῦ ni jina Yesu, na Χριστοῦ imetafsiriwa kama cheo “Masihi” kwa lugha ya kawaida na yenye heshima.
- source_word: κλητοὶ Ἰησοῦ Χριστοῦ
  choice: mlioitwa kuwa wa Yesu Masihi
  rationale: Uhusiano wa kimilikishi uliofupishwa katika Kigiriki unaweza kueleweka kuwa walioitwa wanahusiana na Yesu Masihi au ni wake. “Kuwa wa” ni Kiswahili cha asili kinachowasilisha uwezekano huo, huku tafsiri nyingine zikihifadhiwa katika tanbihi.
theological_decisions:
- issue: Uhusiano wa kimilikishi katika κλητοὶ Ἰησοῦ Χριστοῦ
  choice: mlioitwa kuwa wa Yesu Masihi
  alternative: mlioitwa na Yesu Masihi; kwa karibu zaidi na muundo wa Kigiriki, walioitwa wa Yesu Masihi
  rationale: Kigiriki hakisemi wazi ikiwa Yesu Masihi ndiye mwenye kuita au ikiwa walioitwa ni wake. Matini kuu inatumia uhusiano wa kuwa wake unaofaa muktadha na Kiswahili cha kawaida, lakini tanbihi inadumisha uwezekano wa Yesu kuwa mtendaji na muundo halisi zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Ninyi pia” hudumisha msisitizo wa Kigiriki, na “kuwa wa” huepuka Kiswahili kigumu cha tafsiri neno kwa neno. Alama ya tanbihi imewekwa moja kwa moja baada ya kirai kinachohusika.
