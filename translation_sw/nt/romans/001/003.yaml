  text: kuhusu Mwana wake, aliyetokana na uzao[a] wa Daudi kwa jinsi ya mwili[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mbegu ya Daudi.”
    reason: lexical_alternative
  - marker: b
