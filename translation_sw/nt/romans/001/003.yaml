lexical_decisions:
- source_word: περὶ
  choice: kuhusu
  rationale: Neno hili linatanguliza jambo kuu la Injili iliyotajwa katika mstari uliotangulia; “kuhusu” ni la kawaida, wazi, na linafaa katika sentensi hii.
- source_word: υἱοῦ
  choice: Mwana
  rationale: Rejeleo ni Mwana wa Mungu; herufi kubwa inaonyesha wazi anayerejelewa bila kuongeza dai jipya la kimsamiati.
- source_word: γενομένου
  choice: aliyetokana na
  rationale: Katika muktadha huu kitenzi kinaonyesha asili au nasaba. “Aliyetokana na” ni Kiswahili cha asili kinachohifadhi wazo la kutoka katika ukoo fulani bila kulifanya kuwa maelezo ya kuzaliwa pekee.
- source_word: σπέρματος
  choice: uzao
  rationale: Ingawa maana ya msingi ni “mbegu,” hapa neno linamaanisha nasaba au wazao wa Daudi. “Uzao” linaeleweka kwa urahisi na bado linadumisha mwangwi wa lugha ya kibiblia.
- source_word: Δαυὶδ
  choice: Daudi
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili cha Biblia.
- source_word: κατὰ σάρκα
  choice: kwa jinsi ya mwili
  rationale: Tafsiri hii inadumisha neno lenye uzito wa kitheolojia “mwili” na fumbo lake la msingi, huku tanbihi ikifafanua maana yake katika muktadha huu.
theological_decisions:
- issue: Uhusiano kati ya kuwa kwake Mwana wa Mungu na nasaba yake ya Daudi
  choice: Kudumisha pamoja “Mwana wake” na “aliyetokana na uzao wa Daudi kwa jinsi ya mwili.”
  alternative: “Kwa upande wa ubinadamu wake, alikuwa mzao wa Daudi.”
  rationale: Maandishi yanashikilia pamoja uana wa Mungu na nasaba halisi ya kibinadamu ya Daudi bila kueleza jinsi mambo hayo yanavyohusiana kimetafizikia. Tafsiri haipaswi kuondoa mvutano huo kwa kutumia ufafanuzi wa baadaye.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo unafuata sentensi ndefu inayoendelea kutoka mstari uliotangulia; koma ya mwisho imehifadhiwa kwa sababu wazo linaendelea katika mstari unaofuata.
