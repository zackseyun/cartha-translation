  text: ἐπιποθῶ γὰρ ἰδεῖν ὑμᾶς, ἵνα τι μεταδῶ χάρισμα ὑμῖν πνευματικὸν εἰς τὸ στηριχθῆναι ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/011.yaml
  text: For I long to see you[a], so that I may impart some spiritual gift to you to strengthen you[b],
translation:
  language: sw
  text: Kwa maana ninatamani sana kuwaona, ili niwashirikishe karama fulani ya kiroho[a], ili mkaimarishwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “karama fulani ya Roho.”
    reason: Huhifadhi uwezekano wa kuelewa πνευματικὸν kuwa inarejelea moja kwa moja kwa Roho, bila kuufanya uwe maana pekee katika matini kuu.
lexical_decisions:
- source_word: ἐπιποθῶ
  choice: ninatamani sana
  rationale: Huonyesha hamu kubwa ya Paulo kwa lugha ya kawaida na yenye hadhi; “sana” huhifadhi uzito wa kihisia wa kitenzi.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Hudumisha uhusiano wa maelezo na mstari uliotangulia.
- source_word: ἰδεῖν ὑμᾶς
  choice: kuwaona
  rationale: Hufuata maana ya moja kwa moja ya ‘kuwaona’ bila kuibadili kuwa ‘kuwatembelea,’ ingawa ziara inadokezwa.
- source_word: ἵνα
  choice: ili
  rationale: Huonyesha kusudi kwa Kiswahili cha sasa na cha kawaida.
- source_word: τι
  choice: fulani
  rationale: Huhifadhi kutokuwa mahususi kwa neno la Kigiriki.
- source_word: μεταδῶ
  choice: niwashirikishe
  rationale: Hutoa wazo la kumpa mwingine sehemu katika kitu au kumgawia, si tu kukabidhi; pia huepuka kudokeza kwamba Paulo ndiye chanzo cha karama.
- source_word: χάρισμα
  choice: karama
  rationale: Ni istilahi ya kawaida ya Kiswahili kwa zawadi inayotokana na neema, bila kufafanua kwamba lazima iwe uwezo fulani wa kimiujiza.
- source_word: πνευματικὸν
  choice: ya kiroho
  rationale: Ni tafsiri ya kawaida ya kivumishi na hudumisha uwezekano wa kumaanisha manufaa ya kiroho au karama itokayo kwa Roho.
- source_word: εἰς τὸ στηριχθῆναι ὑμᾶς
  choice: kusudi mpate kuimarishwa
  rationale: Huhifadhi kusudi au matokeo yaliyokusudiwa na pia hali ya kutendwa iliyo wazi katika Kigiriki.
theological_decisions:
- issue: Ikiwa ‘karama ya kiroho’ ni karama maalumu ya kimiujiza au manufaa mapana ya kiroho
  choice: karama fulani ya kiroho
  alternative: karama fulani ya Roho
  rationale: Kirai cha Kigiriki hakilazimishi maana finyu ya karama maalumu. Tafsiri kuu inaacha maana pana wazi, huku tanbihi ikionyesha uwezekano wa uhusiano wa moja kwa moja na Roho.
- issue: Wakala wa kuimarishwa kwa waamini wa Roma
  choice: mpate kuimarishwa
  alternative: ili niwaimarishe
  rationale: Muundo wa Kigiriki ni wa hali ya kutendwa. Kuuhifadhi huepuka kumtaja Paulo peke yake kuwa mwimarishaji na huacha wakala bila kutajwa, kama chanzo kinavyofanya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Ninatamani sana’ ni cha kawaida kuliko usemi wa kizamani, na ‘mpate kuimarishwa’ huhifadhi hali ya kutendwa kwa mtiririko wa asili.
