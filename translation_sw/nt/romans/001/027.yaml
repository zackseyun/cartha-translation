id: ROM.1.27
reference: Romans 1:27
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὁμοίως τε καὶ οἱ ἄρσενες ἀφέντες τὴν φυσικὴν χρῆσιν τῆς θηλείας ἐξεκαύθησαν ἐν τῇ ὀρέξει αὐτῶν εἰς ἀλλήλους, ἄρσενες ἐν ἄρσεσιν τὴν ἀσχημοσύνην κατεργαζόμενοι καὶ τὴν ἀντιμισθίαν ἣν ἔδει τῆς πλάνης αὐτῶν ἐν ⸀ἑαυτοῖς ἀπολαμβάνοντες.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/027.yaml
  text: And likewise the males[a], having abandoned the natural use of the female, were inflamed in their desire for one another[d][c][b], males with males committing indecency and receiving in themselves the due penalty for their error.
translation:
  language: sw
  text: Vivyo hivyo, wanaume pia, baada ya kuacha matumizi ya asili ya mwanamke[a], waliwaka katika tamaa yao wao kwa wao[b], wanaume wakitenda jambo la aibu pamoja na wanaume[c] na wakipokea ndani yao wenyewe malipo yaliyowapasa kwa kosa lao[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mahusiano ya asili na mwanamke.” Kwa karibu zaidi, Kigiriki husema “matumizi ya asili ya mwanamke.”
    reason: lexical_alternative
  - marker: b
    text: Au, “waliwaka kwa hamu yao wao kwa wao.”
    reason: lexical_alternative
  - marker: c
    text: Au, “wakifanya lililo la aibu.”
    reason: lexical_alternative
  - marker: d
    text: Au, “malipo yanayostahili kwa kosa lao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρσενες / θηλείας
  choice: wanaume / mwanamke
  rationale: Maneno haya yanadumisha utofautishaji wa kiume na kike uliomo katika Kigiriki. Kiswahili cha kawaida hutumia “wanaume” na “mwanamke” kwa watu; “madume” na “jike” yangesikika kama lugha ya wanyama na yangekuwa yasiyo ya heshima.
- source_word: ἀφέντες
  choice: baada ya kuacha
  rationale: Muundo huu unaonyesha kwamba tendo la kuacha lilitangulia tendo kuu, kama inavyofanya participio ya Kigiriki.
- source_word: φυσικὴν χρῆσιν τῆς θηλείας
  choice: matumizi ya asili ya mwanamke
  rationale: Hii inafuata kwa karibu neno χρῆσις, “matumizi,” na inadumisha umbo la Kigiriki bila kulibadili kimya kimya kuwa lugha ya mahusiano.
- source_word: ἐξεκαύθησαν ἐν τῇ ὀρέξει αὐτῶν
  choice: waliwaka kwa tamaa yao
  rationale: “Waliwaka” inadumisha taswira ya moto katika kitenzi, na “tamaa” inaweza kuonyesha hamu kali katika muktadha huu bila kuongeza maelezo yasiyomo.
- source_word: εἰς ἀλλήλους
  choice: wao kwa wao
  rationale: Ni usemi wa kawaida wa Kiswahili unaodumisha maana ya urejeshano.
- source_word: ἄρσενες ἐν ἄρσεσιν
  choice: wanaume ... na wanaume
  rationale: Kurudia “wanaume” kunadumisha msisitizo na urudiaji wa Kigiriki; “na” linaonyesha kutenda pamoja na wengine wa kiume.
- source_word: τὴν ἀσχημοσύνην κατεργαζόμενοι
  choice: walitenda ... jambo la aibu
  rationale: Hii inadumisha tathmini ya kimaadili ya nomino ἀσχημοσύνη bila kutaja tendo mahususi zaidi kuliko chanzo.
- source_word: τὴν ἀντιμισθίαν ἣν ἔδει
  choice: malipo yaliyowapasa
  rationale: “Malipo” yanadumisha wazo la jibu au matokeo yanayolingana, na “yaliyowapasa” linawakilisha ἔδει bila kuamua zaidi ikiwa ni adhabu au matokeo.
- source_word: τῆς πλάνης αὐτῶν
  choice: kwa kupotoka kwao
  rationale: “Kupotoka” inadumisha taswira ya kwenda kando iliyomo katika πλάνη na pia maana ya kuwa katika kosa.
- source_word: ἐν ἑαυτοῖς ἀπολαμβάνοντες
  choice: wakipokea ndani yao wenyewe
  rationale: Hii inadumisha nguvu ya kiwakilishi cha kujirejelea na haielezi kwa ziada namna ambayo malipo hayo yalipokelewa.
theological_decisions:
- issue: Iwapo maneno yenye kuonyesha jinsia ya kibiolojia yalainishwe kuwa lugha ya mahusiano
  choice: wanaume ... mwanamke ... wanaume na wanaume
  alternative: waume ... wake ... waume kwa waume
  rationale: Kigiriki kimetumia maneno ya kiume na kike, si jozi ya maneno ya kindoa. Tafsiri inadumisha tofauti hiyo kwa Kiswahili cha heshima na cha kawaida.
- issue: Iwapo tathmini ya kimaadili ifanywe wazi zaidi kuliko chanzo
  choice: jambo la aibu
  alternative: matendo ya ushoga
  rationale: ἀσχημοσύνη tayari linaonyesha tathmini ya aibu, lakini halitoi lebo hiyo ya ziada. Tafsiri inadumisha nguvu ya maadili bila kuongeza istilahi isiyomo katika mstari.
- issue: Iwapo ἀντιμισθία itafsiriwe moja kwa moja kuwa adhabu
  choice: malipo yaliyowapasa
  alternative: adhabu iliyowastahili
  rationale: Neno linaweza kumaanisha malipo yanayolingana au jibu linalostahili. “Malipo” linahifadhi upana huo, huku “yaliyowapasa” likidumisha wazo la ulazima au kufaa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Mgawanyo katika sentensi mbili unaboresha usomaji bila kubadili uhusiano wa mawazo. Maneno “madume” na “jike” yameepukwa kwa sababu kwa watu yanasikika kama lugha ya wanyama, ingawa utofautishaji wa kiume na kike wa chanzo umedumishwa kwa “wanaume” na “mwanamke.”
