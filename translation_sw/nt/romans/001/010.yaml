  text: always in my prayers[a], asking whether somehow, at last, by the will of God I may succeed in coming to you.
translation:
  language: sw
  text: Sikuzote katika sala zangu, nikiomba kwamba kwa njia fulani, hatimaye, kwa mapenzi ya Mungu, nipate kufanikiwa[a] kuja kwenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nifanikishwe” au “nipate safari yenye mafanikio” katika kuweza kuja kwenu.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντοτε
  choice: sikuzote
  rationale: Neno hili linaonyesha desturi ya kudumu au ya mara kwa mara; “sikuzote” ni Kiswahili cha kawaida kinachohifadhi msisitizo wa Paulo.
- source_word: ἐπὶ τῶν προσευχῶν μου
  choice: katika sala zangu
  rationale: Hii ndiyo njia ya kawaida na ya asili katika Kiswahili ya kueleza jambo linalotajwa wakati wa sala.
- source_word: δεόμενος
  choice: nikiomba
  rationale: Kauli hii inaonyesha ombi la dhati; “nikiomba” inaunganika wazi na muktadha wa sala bila kuongeza hisia zisizotajwa moja kwa moja.
- source_word: εἴ πως
  choice: kwamba kwa njia fulani
  rationale: Maneno haya yanahifadhi tumaini lenye kutokuwa na uhakika kuhusu jinsi nafasi hiyo itakavyopatikana.
- source_word: ἤδη ποτὲ
  choice: hatimaye
  rationale: “Hatimaye” huonyesha tumaini la muda mrefu kwamba sasa nafasi ya kwenda kwao huenda ikapatikana.
- source_word: εὐοδωθήσομαι
  choice: nipate kufanikiwa
  rationale: Kitenzi kinaweza kumaanisha kufanikiwa, kufanikishwa, au kuwa na safari yenye mafanikio. Katika muktadha huu, “nipate kufanikiwa” ni wazi na ya asili bila kuifanya maana ya safari kuwa ya lazima.
- source_word: ἐν τῷ θελήματι τοῦ θεοῦ
  choice: kwa mapenzi ya Mungu
  rationale: Kauli hii inaonyesha kwamba mafanikio ya ziara yanategemea mapenzi ya Mungu; “kwa mapenzi ya Mungu” ni usemi wa asili unaohifadhi uhusiano huo.
- source_word: ἐλθεῖν πρὸς ὑμᾶς
  choice: kuja kwenu
  rationale: Tafsiri hii inafuata maana ya moja kwa moja ya kuja kwao bila kuongeza dhana maalumu ya ziara ambayo haijaelezwa wazi katika kitenzi.
