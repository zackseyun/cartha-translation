id: ROM.1.21
reference: Romans 1:21
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: διότι γνόντες τὸν θεὸν οὐχ ὡς θεὸν ἐδόξασαν ἢ ηὐχαρίστησαν, ἀλλὰ ἐματαιώθησαν ἐν τοῖς διαλογισμοῖς αὐτῶν καὶ ἐσκοτίσθη ἡ ἀσύνετος αὐτῶν καρδία·
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/021.yaml
  text: For although they knew God[a], they did not glorify him as God or give thanks, but they became futile in their thinking[b], and their senseless heart was darkened.
translation:
  language: sw
  text: Kwa maana, ingawa walimjua Mungu, hawakumtukuza kama Mungu wala kumshukuru. Badala yake, fikira zao zikawa za ubatili[a], na moyo wao usio na ufahamu ukatiwa giza[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mawazo yao yakawa yasiyo na maana,” “hoja zao zikawa za ubatili,” au “makisio yao yakawa ya ubatili.”
    reason: lexical_alternative
  - marker: b
    text: Kigiriki kimetumia “moyo” katika umoja kwa maana ya pamoja.
    reason: lexical_alternative
lexical_decisions:
- source_word: διότι
  choice: Kwa maana
  rationale: Inaonyesha kuwa sentensi hii inatoa sababu au ufafanuzi wa kauli iliyotangulia, huku ikibaki ya kawaida mwanzoni mwa sentensi ya Kiswahili.
- source_word: γνόντες τὸν θεόν
  choice: ingawa walimjua Mungu
  rationale: 'Kirai kishirikishi kinaeleweka kwa nguvu ya kukubali jambo linalofuatwa na tofauti: licha ya kumjua Mungu, hawakuitikia ipasavyo.'
- source_word: οὐχ ὡς θεὸν ἐδόξασαν
  choice: hawakumtukuza kama Mungu
  rationale: Huhifadhi wazo la kutompa Mungu utukufu unaolingana na cheo na hali yake kuwa Mungu, bila kuongeza ufafanuzi wa kimadhehebu.
- source_word: ἢ ηὐχαρίστησαν
  choice: wala kumshukuru
  rationale: ‘Wala’ huunganisha vitenzi viwili vilivyokanushwa kwa Kiswahili cha kawaida; kiwakilishi cha Mungu kinawekwa wazi ndani ya kitenzi.
- source_word: ἐματαιώθησαν ἐν τοῖς διαλογισμοῖς αὐτῶν
  choice: fikira zao zikawa za ubatili
  rationale: Hutoa kwa Kiswahili cha asili hali ya fikira kuwa tupu, zisizo na maana au zisizofaa. Muundo umegeuzwa kidogo ili kuepuka usemi usio wa kawaida ‘wakawa batili katika fikira zao’.
- source_word: ἐσκοτίσθη
  choice: ukatiwa giza
  rationale: Hudumisha hali ya kutendwa na sitiari ya kutiwa giza kiakili na kimaadili.
- source_word: ἡ ἀσύνετος αὐτῶν καρδία
  choice: moyo wao usio na ufahamu
  rationale: ‘Usio na ufahamu’ huonyesha ukosefu wa kuelewa bila kuufanya kuwa dai la upungufu wa akili tu; umoja wa ‘moyo’ umehifadhiwa.
theological_decisions:
- issue: Nguvu ya kukubali yenye tofauti katika γνόντες
  choice: ingawa walimjua Mungu
  alternative: baada ya kumjua Mungu / walipomjua Mungu
  rationale: Muktadha unasisitiza kwamba kushindwa kwao kumtukuza na kumshukuru Mungu kulitokea licha ya kumjua. Tafsiri hii huhifadhi mvutano huo bila kufafanua zaidi aina au kiwango cha ujuzi wao.
- issue: Umoja wa ‘moyo’ kwa kundi la watu
  choice: moyo wao
  alternative: mioyo yao
  rationale: Umoja wa Kigiriki umehifadhiwa kama matumizi ya pamoja yanayoeleza utu wao wa ndani; haupaswi kuchukuliwa kuwa wanashiriki moyo mmoja kihalisi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Fikira’ na ‘ubatili’ ni maneno yanayoeleweka katika muktadha huu na yanahifadhi uzito wa hoja bila kutumia lugha ya kale kupita kiasi.
