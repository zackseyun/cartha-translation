  text: Οὐ γὰρ ἐπαισχύνομαι τὸ ⸀εὐαγγέλιον, δύναμις γὰρ θεοῦ ἐστιν εἰς σωτηρίαν παντὶ τῷ πιστεύοντι, Ἰουδαίῳ τε πρῶτον καὶ Ἕλληνι·
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/016.yaml
  text: For I am not ashamed of the good news[a], for it is the power of God for salvation to everyone who believes[b], to the Jew first and also to the Greek.
translation:
  language: sw
  text: Kwa maana siionei habari njema[a] aibu, kwa sababu ni nguvu ya Mungu kwa ajili ya wokovu wa kila anayeamini, kwa Myahudi kwanza na pia kwa Myunani[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “injili.”
    reason: lexical_alternative
  - marker: b
    text: Neno “Myunani” hapa linaweza kumaanisha kwa upana zaidi watu wa mataifa, yaani, watu wasio Wayahudi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπαισχύνομαι
  choice: siionei aibu
  rationale: Huwasilisha hali ya kuona aibu au kurudi nyuma kwa sababu ya fedheha, huku ikihifadhi msimamo wa Paulo wa kutoficha ujumbe huo hadharani.
- source_word: εὐαγγέλιον
  choice: habari njema
  rationale: Hutoa maana ya neno la Kigiriki kwa uwazi katika Kiswahili cha sasa; neno la kimapokeo “injili” limetajwa katika tanbihi.
- source_word: δύναμις
  choice: nguvu
  rationale: Ni neno la kawaida na la moja kwa moja linaloonyesha uwezo wa Mungu wenye matokeo ya kuokoa.
- source_word: εἰς σωτηρίαν
  choice: kwa ajili ya wokovu
  rationale: Huhifadhi mwelekeo au kusudi linaloonyeshwa na εἰς bila kuongeza maelezo yasiyokuwamo katika maandishi.
- source_word: παντὶ τῷ πιστεύοντι
  choice: kila anayeamini
  rationale: Huhifadhi maana ya kila mmoja bila ubaguzi na hali ya tendo la kuamini iliyo katika participio ya Kigiriki.
- source_word: Ἰουδαίῳ
  choice: Myahudi
  rationale: Katika ulinganisho huu na Ἕλληνι, maana ya kikabila na kidini ya “Myahudi” ndiyo inayofaa zaidi.
- source_word: πρῶτον
  choice: kwanza
  rationale: Huhifadhi kwa ufupi mpangilio uliotajwa katika historia ya wokovu bila kuufafanua zaidi ya maandishi.
- source_word: Ἕλληνι
  choice: Myunani
  rationale: Huhifadhi neno halisi la Kigiriki katika matini kuu, huku maana yake pana inayoweza kuwahusu watu wasio Wayahudi ikielezwa katika tanbihi.
- source_word: τε ... καί
  choice: na pia
  rationale: Huonyesha kuongezwa kwa Myunani baada ya kutajwa kwa nafasi ya kwanza ya Myahudi kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Maana ya Ἕλληνι katika kauli “kwa Myahudi kwanza na pia kwa Myunani”
  choice: Myunani katika matini kuu, pamoja na tanbihi inayoeleza maana pana ya watu wasio Wayahudi
  alternative: Mtu wa mataifa katika matini kuu
  rationale: Chaguo hili huhifadhi uwazi wa kileksia wa maandishi ya Kigiriki na wakati huohuo kukiri kwamba katika matumizi ya Paulo neno hilo linaweza kuwakilisha kwa upana ulimwengu wa wasio Wayahudi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo unafuata hoja ya Kigiriki kwa karibu lakini unaepuka lugha ya kizamani; marudio ya γάρ yametofautishwa kwa “kwa maana” na “kwa sababu” ili sentensi isomeke kwa kawaida.
