lexical_decisions:
- source_word: ὃ
  choice: ambayo
  rationale: Kiwakilishi hiki cha uhusiano kinarejelea “Injili” katika Waroma 1:1 na kudumisha kiungo cha kisarufi.
- source_word: προεπηγγείλατο
  choice: aliahidi tangu awali
  rationale: Kitenzi kinaunganisha maana ya kutoa ahadi na hali ya kutangulia; kauli hii ni ya kawaida na wazi katika Kiswahili.
- source_word: διὰ
  choice: kupitia
  rationale: Pamoja na uhusika wa genitivi, neno hili huonyesha njia au watendaji ambao Mungu aliwatumia.
- source_word: τῶν προφητῶν αὐτοῦ
  choice: manabii wake
  rationale: Huhifadhi maana ya wajumbe wa kinabii walio wa Mungu.
- source_word: ἐν γραφαῖς ἁγίαις
  choice: katika Maandiko Matakatifu
  rationale: Katika muktadha huu γραφαῖς yanaelekea kumaanisha maandiko yanayotambuliwa kuwa matakatifu, si maandishi ya kawaida.
theological_decisions:
- issue: Iwapo γραφαῖς ἁγίαις itafsiriwe “Maandiko Matakatifu” au “maandishi matakatifu”
  choice: Maandiko Matakatifu
  alternative: maandishi matakatifu
  rationale: Matumizi ya γραφαί katika muktadha wa Paulo kwa kawaida huelekeza kwenye Maandiko yanayotambuliwa, huku tanbihi ikihifadhi uwezekano wa tafsiri ya kijumla zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. “Mungu” imewekwa wazi kama kiima kilichodokezwa na muktadha ili sentensi iwe ya asili kwa Kiswahili.
