base_translation:
  language: en
  yaml_path: translation/nt/romans/001/018.yaml
  text: For the wrath of God is being revealed from heaven against all ungodliness and unrighteousness of people who suppress the truth in unrighteousness[a][b][c][d][e].
translation:
  language: sw
  text: Kwa maana ghadhabu ya Mungu inaendelea kufunuliwa kutoka mbinguni dhidi ya kila kutomcha Mungu na uovu wote wa watu wanaoukandamiza ukweli kwa uovu wao.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “inafunuliwa.”
    reason: lexical_alternative
  - marker: b
    text: “Wanaoukandamiza” pia inaweza kutafsiriwa “wanaoizuia” au “wanaoifinya” katika muktadha huu.
    reason: lexical_alternative
  - marker: c
    text: Au, “wanaoukandamiza ukweli katika uovu wao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀποκαλύπτεται
  choice: inaendelea kufunuliwa
  rationale: Kitenzi cha wakati wa sasa katika kauli tendwa kinaweza kuonyesha tendo linaloendelea; usemi huu unaweka wazi maana hiyo kwa Kiswahili cha kawaida.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Inaonyesha kwamba kauli hii inatoa msingi au maelezo ya yaliyotangulia, huku ikihifadhi mtiririko wa hoja ya Paulo.
- source_word: ὀργὴ θεοῦ
  choice: ghadhabu ya Mungu
  rationale: Tafsiri ya moja kwa moja inayohifadhi wazo la mwitikio binafsi na wa hukumu wa Mungu bila kuugeuza kuwa matokeo yasiyo ya kibinafsi.
- source_word: ἀπ’ οὐρανοῦ
  choice: kutoka mbinguni
  rationale: Inaonyesha chanzo cha ufunuo huo kwa njia ya kawaida na ya moja kwa moja.
- source_word: πᾶσαν ἀσέβειαν
  choice: kutomcha Mungu kote
  rationale: Huwasilisha wazi hali ya kutokuwa na uchaji au heshima inayompasa Mungu; “kote” hudumisha upeo wa πᾶσαν.
- source_word: ἀδικίαν
  choice: uovu wote
  rationale: “Uovu” ni wa kawaida na mpana katika Kiswahili, na hapa huepuka kuifanya ἀδικία kuwa “dhuluma” pekee, kana kwamba inahusu ukosefu wa haki kwa watu tu.
- source_word: ἀνθρώπων
  choice: watu
  rationale: Neno la Kigiriki linawahusu wanadamu kwa ujumla, si wanaume pekee.
- source_word: τῶν ... κατεχόντων
  choice: wanaoukandamiza
  rationale: Katika muktadha huu κατέχω ni kuuzuia au kuufinya ukweli usionekane au usitende kazi; “kukandamiza” hutoa maana hiyo kwa ufupi.
- source_word: τὴν ἀλήθειαν
  choice: ukweli
  rationale: Tafsiri ya moja kwa moja bila kuufafanua au kuupunguza zaidi ya maandiko.
- source_word: ἐν ἀδικίᾳ
  choice: kwa uovu wao
  rationale: Huchukua ἐν kama ikionyesha njia au namna ambayo watu wanaukandamiza ukweli. Kivumishi milikishi “wao” kinaeleweka kutokana na wahusika wa sentensi na hufanya Kiswahili kiwe wazi.
theological_decisions:
- issue: Iwapo ὀργὴ θεοῦ ipunguzwe kuwa matokeo yasiyo ya kibinafsi ya maadili
  choice: “Ghadhabu ya Mungu” inahifadhi mwitikio wa Mungu mwenyewe wa kihukumu.
  alternative: Kuieleza kama mchakato au matokeo ya kimaadili yasiyo ya kibinafsi.
  rationale: Muundo wa Kigiriki na hoja ya Paulo humtaja Mungu kama mwenye ghadhabu; tafsiri haipaswi kulainisha uzito huu wa kiteolojia.
- issue: Uhusiano wa ἐν ἀδικίᾳ na kitendo cha kuuzuia ukweli
  choice: “kwa uovu wao” huonyesha njia au namna.
  alternative: “katika uovu wao” huonyesha mazingira au hali ambamo wanaukandamiza ukweli.
  rationale: Sarufi inaruhusu zaidi ya kivuli kimoja cha maana. Tafsiri kuu inachagua njia inayoeleweka kwa urahisi, na tanbihi inahifadhi uwezekano mwingine.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Kutokuwa na hofu ya Mungu” kimeepukwa kwa kuwa “kutomcha Mungu” ni cha kawaida zaidi na huonyesha wazi mwelekeo wa ἀσέβεια kwa Mungu. Kurudiwa kwa “uovu” kunadumisha kurudiwa kwa ἀδικία katika Kigiriki, ingawa sehemu ya kwanza ina “wote” na ya pili ina “wao” kwa mtiririko wa asili wa Kiswahili.
