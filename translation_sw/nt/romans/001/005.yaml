  text: δι’ οὗ ἐλάβομεν χάριν καὶ ἀποστολὴν εἰς ὑπακοὴν πίστεως ἐν πᾶσιν τοῖς ἔθνεσιν ὑπὲρ τοῦ ὀνόματος αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/005.yaml
  text: Through whom we received grace and apostleship for the obedience of faith among all the nations for the sake of his name[b][a],
translation:
  language: sw
  text: Kwa njia yake tumepokea neema na utume ili kuleta utiifu wa imani[a] miongoni mwa mataifa yote[b], kwa ajili ya jina lake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “utiifu unaotokana na imani,” au “utiifu ambao ni imani.”
    reason: alternative_reading
  - marker: b
    text: Au “watu wote wasio Wayahudi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ οὗ
  choice: Kwa njia yake
  rationale: διά pamoja na hali ya umilikishi huonyesha njia au mpatanishi. Tafsiri hii inaendeleza rejeo kwa Yesu Kristo katika mstari uliotangulia.
- source_word: ἐλάβομεν
  choice: tumepokea
  rationale: Kitenzi kiko katika nafsi ya kwanza wingi. Tafsiri inadumisha wingi wa Kigiriki bila kuamua ikiwa Paulo anajizungumzia kwa wingi au anawahusisha wengine.
- source_word: χάριν
  choice: neema
  rationale: “Neema” ni tafsiri ya kawaida na yenye uzito wa kibiblia kwa χάρις katika maandishi ya Paulo.
- source_word: καὶ ἀποστολήν
  choice: na utume
  rationale: Kigiriki kina nomino mbili zilizounganishwa, hivyo “neema na utume” inazihifadhi kama dhana mbili bila kuzichanganya kuwa “neema ya utume.”
- source_word: εἰς
  choice: ili kuleta
  rationale: Hapa εἰς inaonyesha kusudi au lengo. “Ili kuleta” ni Kiswahili cha kawaida kinachoonyesha kwamba utiifu huo ndio lengo la utume.
- source_word: ὑπακοὴν πίστεως
  choice: utiifu wa imani
  rationale: Muundo huu wa umilikishi unaweza kueleweka kwa njia zaidi ya moja. “Utiifu wa imani” unadumisha ufupi na utata halisi wa Kigiriki.
- source_word: πίστεως
  choice: imani
  rationale: “Imani” ni tafsiri ya kawaida ya πίστις hapa na haiamui kimbele uhusiano wake mahususi na utiifu.
- source_word: ἐν πᾶσιν τοῖς ἔθνεσιν
  choice: miongoni mwa mataifa yote
  rationale: ἔθνη inaweza kumaanisha mataifa kwa ujumla au watu wasio Wayahudi. Maandishi makuu yanadumisha maana pana, huku maana nyingine ikiwekwa katika tanbihi.
- source_word: ὑπὲρ τοῦ ὀνόματος αὐτοῦ
  choice: kwa ajili ya jina lake
  rationale: ὑπέρ hapa huonyesha kusudi, manufaa, au sababu. Kauli hii ya Kiswahili inadumisha uzito wa kibiblia wa kutenda kwa ajili ya jina lake bila kuongeza maelezo yasiyomo katika matini.
theological_decisions:
- issue: Maana ya ὑπακοὴν πίστεως
  choice: utiifu wa imani
  alternative: utiifu unaotokana na imani; utiifu ambao ni imani
  rationale: Muundo wa Kigiriki ni mfupi na unaweza kuonyesha utiifu unaotokana na imani au utiifu unaojumuisha imani yenyewe. Maandishi makuu hayachagui moja ya tafsiri hizo za kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Utume” na “neema” ni istilahi zinazofahamika katika matumizi ya kawaida ya Biblia; sentensi inadumisha muundo wa Paulo bila kuwa nzito kupita kiasi.
