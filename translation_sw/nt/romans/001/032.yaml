  text: οἵτινες τὸ δικαίωμα τοῦ θεοῦ ἐπιγνόντες, ὅτι οἱ τὰ τοιαῦτα πράσσοντες ἄξιοι θανάτου εἰσίν, οὐ μόνον αὐτὰ ποιοῦσιν ἀλλὰ καὶ συνευδοκοῦσιν τοῖς πράσσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/032.yaml
  text: who[a], although they know God's righteous decree—that those who practice such things are worthy of death—not only do them but also approve of those who practice them.
translation:
  language: sw
  text: Nao, ingawa wanaijua agizo la haki la Mungu[a]—kwamba wale wanaotenda mambo kama hayo wanastahili kifo—si tu wanayatenda, bali pia wanawaunga mkono wale wanaoyatenda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “hukumu ya Mungu,” “takwa la Mungu,” au “uamuzi wa Mungu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: Nao
  rationale: Kiwakilishi hiki kinawaeleza watu waliotajwa katika muktadha uliotangulia; “Nao” huunganisha sentensi kwa kawaida katika Kiswahili.
- source_word: δικαίωμα
  choice: hukumu ya haki
  rationale: Katika muktadha huu neno linaonyesha uamuzi wa Mungu ulio wa haki kuhusu hatia na kustahili kifo; tafsiri hii inadumisha maana ya kisheria na ya kimaadili.
- source_word: ἐπιγνόντες
  choice: ingawa wanaijua
  rationale: 'Kirai tegemezi kina maana ya ukinzani katika muktadha: wanaendelea kutenda hayo licha ya kuijua hukumu ya Mungu.'
- source_word: οἱ τὰ τοιαῦτα πράσσοντες
  choice: wale wanaotenda mambo kama hayo
  rationale: “Wanaotenda” huonyesha mwenendo, bila kulazimisha wazo la tendo moja tu.
- source_word: ἄξιοι θανάτου
  choice: wanastahili kufa
  rationale: Ni usemi wa kawaida na wa moja kwa moja unaohifadhi uzito wa hukumu katika Kigiriki.
- source_word: ποιοῦσιν
  choice: wanayatenda
  rationale: Hutafsiri kitenzi kwa lugha ya kawaida huku kikirejelea wazi mambo yaliyotangulia.
- source_word: συνευδοκοῦσιν
  choice: wanawaunga mkono
  rationale: Katika muktadha huu kitenzi kinaonyesha kukubaliana na kuidhinisha matendo ya wengine, si kushiriki tu; “kuwaunga mkono” ni Kiswahili cha kawaida chenye nguvu hiyo.
- source_word: τοῖς πράσσουσιν
  choice: wale wanaoyatenda
  rationale: Huhifadhi urudiaji na maana ya watu wenye mwenendo wa kutenda mambo hayo.
theological_decisions:
- issue: Maana ya ἄξιοι θανάτου (“wanastahili kufa”)
  choice: Kauli imeachwa kama hukumu ya Mungu bila kufafanua aina au upeo wa kifo.
  alternative: Kuitafsiri mahsusi kuwa adhabu ya kifo ya kiraia, au kuwa kifo cha mwisho pekee.
  rationale: Aya yenyewe haisemi kwa undani kifo hicho ni cha aina gani; tafsiri inadumisha uzito na uwazi wa kauli bila kuibana kwa mtazamo mmoja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umewekwa wazi kwa wasomaji wa kawaida, huku uzito wa kisheria na wa kimaadili wa aya ukidumishwa.
