  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ καθὼς οὐκ ἐδοκίμασαν τὸν θεὸν ἔχειν ἐν ἐπιγνώσει, παρέδωκεν αὐτοὺς ὁ θεὸς εἰς ἀδόκιμον νοῦν, ποιεῖν τὰ μὴ καθήκοντα,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/028.yaml
  text: And just as they did not see fit to have God in their knowledge[a], God gave them over to a debased mind, to do what is not fitting[b],
translation:
  language: sw
  text: Na kwa kuwa hawakuona inafaa kumweka Mungu katika ufahamu wao[a], Mungu aliwaacha wafuate mawazo yasiyofaa[b], wakifanya mambo yasiyopasa kufanywa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuendelea kumweka Mungu katika ufahamu wao.”
    reason: lexical_alternative
  - marker: b
    text: Neno “yasiyofaa” linahusiana na “inafaa” lililotumiwa mapema katika mstari huu, hivyo kuhifadhi mchezo wa maneno wa Paulo; au, “akili potovu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: kama vile
  rationale: Muundo huu unahifadhi ulinganisho wa moja kwa moja wa καθὼς bila kuondoa kabisa uwezekano wa maana ya kisababishi katika muktadha.
- source_word: ἐδοκίμασαν
  choice: hawakuona inafaa
  rationale: Huwasilisha tendo la kupima na kukubali kuwa jambo linafaa, na pia huwezesha mwangwi wa neno hilo kuonekana katika ἀδόκιμον.
- source_word: ἔχειν ἐν ἐπιγνώσει
  choice: kumweka Mungu katika ufahamu wao
  rationale: Kauli hii inahifadhi picha ya kuwa na Mungu ndani ya ufahamu wao, badala ya kuifupisha kuwa kumtambua tu; maelezo ya chini yanataja uwezekano wa maana ya kuendelea kumweka humo.
- source_word: παρέδωκεν
  choice: aliwaacha wafuate
  rationale: Ni Kiswahili cha kawaida kinachoonyesha Mungu kuwaacha chini ya mwelekeo huo kama hukumu, huku kikiepuka kauli isiyo ya kawaida ya ‘kuwakabidhi kwa akili.’
- source_word: ἀδόκιμον νοῦν
  choice: akili isiyofaa
  rationale: Huhifadhi maana ya akili ambayo haikubaliki au haifai, pamoja na mchezo wa maneno unaohusisha ἐδοκίμασαν, bila kuingiza istilahi nzito zaidi ya kimafundisho.
- source_word: ποιεῖν
  choice: wafanye
  rationale: Hutoa kwa kawaida kusudi au matokeo yanayofuata tendo la Mungu kuwaacha.
- source_word: τὰ μὴ καθήκοντα
  choice: mambo yasiyopasa kufanywa
  rationale: Huwasilisha mambo yasiyofaa au yasiyo sahihi kufanywa, bila kuongeza mwangwi mwingine wa mzizi wa ‘-faa’ ambao haupo katika maneno ya Kigiriki yenyewe.
theological_decisions:
- issue: Iwapo ἀδόκιμον νοῦν itafsiriwe kwa istilahi nzito kama ‘akili potovu’ au ‘akili iliyokataliwa.’
  choice: akili isiyofaa
  alternative: akili potovu
  rationale: Chaguo hili linatunza maana ya kutofaulu kupimwa au kutokubalika na mchezo wa maneno wa Paulo, bila kuifanya kivumishi hicho kuwa istilahi maalumu ya kimafundisho.
- issue: Iwapo παρέδωκεν ionyeshwe kama tendo la hukumu au kuachana tu.
  choice: Mungu aliwaacha wafuate
  alternative: Mungu aliwakabidhi kwa
  rationale: Kauli iliyochaguliwa inaonyesha wazi tendo la Mungu la kuwaacha waende katika mwelekeo huo, lakini haisuluhishi zaidi ya maandishi mvutano kati ya hukumu ya Mungu na matendo yao wenyewe.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo ‘hawakuona inafaa’ ni wa kawaida na unawezesha mchezo wa maneno wa chanzo kuhifadhiwa; ‘mambo yasiyopasa kufanywa’ ni wazi kwa msomaji wa kawaida.
