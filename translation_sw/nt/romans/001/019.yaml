  text: because what can be known about God is plain among them, for God has made it plain to them.
translation:
  language: sw
  text: kwa sababu kile kinachoweza kujulikana kumhusu Mungu kiko wazi miongoni mwao[a], kwa maana Mungu amekifanya wazi kwao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ndani yao.” Kirai cha Kigiriki ἐν αὐτοῖς kinaweza kumaanisha “miongoni mwao” au “ndani yao.”
