lexical_decisions:
- source_word: διότι
  choice: kwa sababu
  rationale: Huonyesha sababu ya kauli iliyotangulia kwa njia ya kawaida na iliyo wazi katika Kiswahili.
- source_word: τὸ γνωστὸν
  choice: yale yanayoweza kujulikana
  rationale: Kivumishi hiki cha jinsia ya kati chenye kibainishi kimetumika kama nomino; tafsiri hii huhifadhi maana ya mambo yanayoweza kufahamika bila kuyafanya kuwa yale ambayo tayari yanajulikana kikamilifu.
- source_word: τοῦ θεοῦ
  choice: kumhusu Mungu
  rationale: Hutoa kwa Kiswahili cha kawaida maana ya kile kinachoweza kujulikana kuhusu Mungu.
- source_word: φανερόν
  choice: yako wazi
  rationale: Hueleza kwamba jambo hilo ni dhahiri au limefunuliwa wazi, na pia hudumisha uhusiano wa kimaana na ἐφανέρωσεν.
- source_word: ἐν αὐτοῖς
  choice: miongoni mwao
  rationale: Huwakilisha maana ya mahali pa kijamii au hadharani katika kundi lao, huku uwezekano wa maana ya ndani ukihifadhiwa katika tanbihi.
- source_word: ὁ θεὸς γὰρ αὐτοῖς ἐφανέρωσεν
  choice: kwa maana Mungu ameyaweka wazi kwao
  rationale: Huhifadhi uhusiano kati ya φανερόν na ἐφανέρωσεν kwa kurudia wazo la kuweka wazi, katika Kiswahili cha asili na kinachoeleweka.
theological_decisions:
- issue: Maana ya ἐν αὐτοῖς
  choice: miongoni mwao
  alternative: ndani yao / mioyoni mwao
  rationale: Kirai kinaweza kueleza ufunuo ulio wazi miongoni mwa watu au uliomo ndani yao. Matini kuu inatumia maana ya kijamii/hadharani inayolingana na muktadha unaofuata, lakini tanbihi huhifadhi utata halisi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi huhifadhi uhusiano wa sababu na urudiaji wa wazo la kuwa wazi bila kuwa wa kigeni.
