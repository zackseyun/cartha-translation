id: ROM.1.25
reference: Romans 1:25
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οἵτινες μετήλλαξαν τὴν ἀλήθειαν τοῦ θεοῦ ἐν τῷ ψεύδει, καὶ ἐσεβάσθησαν καὶ ἐλάτρευσαν τῇ κτίσει παρὰ τὸν κτίσαντα, ὅς ἐστιν εὐλογητὸς εἰς τοὺς αἰῶνας· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/025.yaml
  text: who exchanged the truth of God for the lie, and revered and served the creation rather than the Creator, who is blessed forever. Amen.
translation:
  language: sw
  text: Wao waliibadilisha kweli ya Mungu kwa uongo, wakauonyesha uumbaji heshima ya ibada na kuutumikia badala ya yeye aliyeumba, ambaye amebarikiwa milele. Amina.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετήλλαξαν
  choice: waliibadilisha ... kwa
  rationale: Kitenzi hiki katika muundo huu kina maana ya kubadilisha kitu kimoja kwa kingine; usemi huu ni wa kawaida na wazi katika Kiswahili.
- source_word: τὴν ἀλήθειαν τοῦ θεοῦ
  choice: kweli ya Mungu
  rationale: Huhifadhi uhusiano wa kirai cha Kigiriki bila kuamua kama ni kweli inayomhusu Mungu au kweli inayotoka kwake.
- source_word: ἐν τῷ ψεύδει
  choice: kwa uongo
  rationale: Hutoa maana ya kitu kilichochukua nafasi ya kweli. Kiswahili hakihitaji kibainishi hapa; 'uongo' bado unaweza kurejelea uongo maalumu unaoelezwa katika muktadha.
- source_word: ἐσεβάσθησαν
  choice: wakakiheshimu
  rationale: Kitenzi kina wazo la kutoa heshima ya kidini au uchaji; 'kukiheshimu' hutofautisha tendo hili na 'kukitumikia' linalofuata bila kulazimisha neno lilelile kwa yote mawili.
- source_word: ἐλάτρευσαν
  choice: w wakakitumikia
  rationale: Inamaanisha kutoa huduma ya kidini; katika maandishi yenyewe kimeunganishwa na kiumbe, hivyo 'kukitumikia' huhifadhi maana na urudiaji wa viwakilishi.
- source_word: τῇ κτίσει
  choice: kiumbe
  rationale: Neno linaweza kumaanisha kilichoumbwa au uumbaji. 'Kiumbe' linaweka wazi utofautishaji wa kifasihi na 'Muumba' bila kuongeza aina fulani ya sanamu.
- source_word: παρὰ τὸν κτίσαντα
  choice: badala ya Muumba
  rationale: παρά katika ulinganisho huu huonyesha uchaguzi wa kiumbe mahali pa aliyekiumba; 'Muumba' ni jina la asili na lenye heshima.
- source_word: εὐλογητὸς
  choice: anastahili kusifiwa
  rationale: Kwa Mungu, neno hili ni kauli ya kumsifu ('blessed be'), si hasa kusema kwamba amepokea baraka kutoka kwa mwingine.
- source_word: εἰς τοὺς αἰῶνας
  choice: milele
  rationale: Ni tafsiri ya kawaida, fupi, na ya asili ya usemi wa kudumu daima.
theological_decisions:
- issue: Kiwango cha heshima kinachoonyeshwa na ἐσεβάσθησαν
  choice: wakakiheshimu
  alternative: wakakiabudu
  rationale: Neno linaweza kuwa na maana ya uchaji wa kidini, lakini kitenzi kinachofuata tayari huonyesha huduma ya kidini. Tafsiri iliyochaguliwa huhifadhi tofauti ya vitenzi na haiongezi ufafanuzi wa kiteolojia usiolazimishwa na neno lenyewe.
- issue: Maana ya κτίσις
  choice: kiumbe
  alternative: vitu vilivyoumbwa / uumbaji
  rationale: Umoja wa jumla wa Kigiriki unaweza kuhusisha kila kilichoumbwa. 'Kiumbe' huhifadhi umoja na utofautishaji wa moja kwa moja dhidi ya Muumba, huku muktadha ukiruhusu maana pana.
- issue: Kauli εὐλογητὸς kuhusu Muumba
  choice: ambaye anastahili kusifiwa milele
  alternative: ambaye amebarikiwa milele
  rationale: Katika kauli ya sifa kwa Mungu, Kiswahili cha 'anastahili kusifiwa' huwasilisha vizuri nguvu ya doksolojia bila kudokeza kwamba Mungu amebarikiwa na aliye juu yake.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa sentensi na jozi ya 'kiumbe/Muumba' huhifadhi msisitizo wa Kigiriki. Hakuna tanbihi zinazohitajika.
