id: ROM.1.30
reference: Romans 1:30
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καταλάλους, θεοστυγεῖς, ὑβριστάς, ὑπερηφάνους, ἀλαζόνας, ἐφευρετὰς κακῶν, γονεῦσιν ἀπειθεῖς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/030.yaml
  text: slanderers[a], hateful to God, insolent, arrogant, boastful, inventors of evil, disobedient to parents,
translation:
  language: sw
  text: wachongezi, wanaomchukia Mungu[a], wajeuri, wenye kiburi, wenye majivuno, wanaobuni maovu, wasiowatii wazazi wao,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wanaochukiwa na Mungu.”
    reason: alternative_reading
lexical_decisions:
- source_word: καταλάλους
  choice: wachongezi
  rationale: Neno hili linamaanisha watu wanaowasema wengine vibaya kwa nia ya kuwaharibia sifa. “Wachongezi” ni neno la Kiswahili cha sasa linalobeba uzito huo wa kimaadili.
- source_word: θεοστυγεῖς
  choice: wanaomchukia Mungu
  rationale: Maana tendaji inaeleweka kwa urahisi kama watu wanaomchukia Mungu na inalingana na orodha ya tabia za wanadamu. Maana tendwa inayowezekana imehifadhiwa katika tanbihi.
- source_word: ὑβριστάς
  choice: wajeuri
  rationale: “Wajeuri” huonyesha kiburi kinachojitokeza kwa kuwatendea wengine kwa dharau au ukatili, bila kulifanya neno lihusu vurugu za kimwili pekee.
- source_word: ὑπερηφάνους
  choice: wenye kiburi
  rationale: Kauli hii inaeleza hali ya kujiona kuwa bora kuliko wengine, na ni ya kawaida na yenye kueleweka katika Kiswahili sanifu.
- source_word: ἀλαζόνας
  choice: wenye majivuno
  rationale: Hutofautisha kujigamba na kiburi cha neno lililotangulia huku ikihifadhi maana ya watu wanaojionyesha na kujisifu.
- source_word: ἐφευρετὰς κακῶν
  choice: wanaobuni maovu
  rationale: Kauli hii inahifadhi picha ya watu wanaotunga au kuvumbua njia mpya za kufanya maovu, kwa lugha ya asili na iliyo wazi.
- source_word: γονεῦσιν ἀπειθεῖς
  choice: wasiowatii wazazi wao
  rationale: Hii inawasilisha kwa uwazi kutokuwa watiifu kwa wazazi na kuhifadhi uhusiano unaoonyeshwa na muundo wa Kigiriki.
theological_decisions:
- issue: Maana ya θεοστυγεῖς
  choice: 'Maana tendaji: “wanaomchukia Mungu”'
  alternative: 'Maana tendwa: “wanaochukiwa na Mungu”'
  rationale: Maana tendaji inafaa zaidi katika mtiririko wa orodha ya maovu, ambamo maneno yanataja mielekeo au matendo ya wanadamu. Hata hivyo, kwa kuwa maana tendwa imejadiliwa kihistoria na inawezekana kisarufi, imehifadhiwa katika tanbihi bila kuondoa mvutano huo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Orodha fupi imehifadhiwa kwa mtiririko wa vifungu sambamba; maneno “wenye kiburi” na “wenye majivuno” yametumiwa kutofautisha istilahi mbili za Kigiriki zilizo karibu kimaana.
