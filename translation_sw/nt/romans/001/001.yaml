id: ROM.1.1
reference: Romans 1:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Παῦλος δοῦλος ⸂Χριστοῦ Ἰησοῦ⸃, κλητὸς ἀπόστολος, ἀφωρισμένος εἰς εὐαγγέλιον θεοῦ
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/001.yaml
  text: Paul[a], a servant of Messiah Jesus, called as an apostle, set apart for the gospel of God[d][c][b],
translation:
  language: sw
  text: Paulo, mtumwa[a] wa Masihi[b] Yesu, aliyeitwa kuwa mtume[c], aliyetengwa kwa ajili ya Injili ya Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, mtumishi.
    reason: lexical_alternative
  - marker: b
    text: Au, Kristo.
    reason: lexical_alternative
  - marker: c
    text: 'Kwa tafsiri ya karibu zaidi na muundo wa Kigiriki: mtume aliyeitwa.'
    reason: alternative_reading
lexical_decisions:
- source_word: Παῦλος
  choice: Paulo
  rationale: Hili ndilo umbo la kawaida la jina hili katika Biblia na Kiswahili sanifu.
- source_word: δοῦλος
  choice: mtumwa
  rationale: Neno hili linaonyesha hali ya kuwa chini ya mamlaka na umiliki wa mwingine kwa nguvu zaidi kuliko “mtumishi,” jambo lenye uzito katika kujitambulisha kwa Paulo hapa.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Masihi Yesu
  rationale: Χριστός limetafsiriwa kama cheo “Masihi,” huku Ἰησοῦ likitolewa kwa jina lake la kawaida la Kiswahili, “Yesu”; mpangilio wa Kigiriki umehifadhiwa.
- source_word: κλητὸς ἀπόστολος
  choice: aliyeitwa kuwa mtume
  rationale: Hii ni Kiswahili cha asili kinachoeleza kwamba Paulo alipokea wito wa kuwa mtume, bila kupanua maana zaidi ya lazima.
- source_word: ἀφωρισμένος
  choice: aliyetengwa
  rationale: Huhifadhi hali ya tendo la kutendwa na maana ya kuwekwa kando kwa kusudi maalumu.
- source_word: εἰς
  choice: kwa ajili ya
  rationale: Katika muktadha huu linaonyesha kusudi au kazi ambayo Paulo alitengwa kuifanya.
- source_word: εὐαγγέλιον θεοῦ
  choice: Injili ya Mungu
  rationale: “Injili” ni istilahi iliyozoeleka na kueleweka katika Kiswahili, nayo “ya Mungu” huhifadhi uhusiano mpana wa kimilikishi au chanzo uliomo katika genitivi ya Kigiriki.
theological_decisions:
- issue: Maana ya δοῦλος katika kujitambulisha kwa Paulo
  choice: mtumwa
  alternative: mtumishi
  rationale: “Mtumwa” huhifadhi kwa uwazi zaidi kujisalimisha kabisa kwa Paulo chini ya mamlaka ya Yesu; “mtumishi” ni mbadala wa kawaida lakini hupunguza wazo la kuwa chini ya umiliki.
- issue: Utoaji wa Χριστός kama cheo
  choice: Masihi Yesu
  alternative: Kristo Yesu
  rationale: Katika fungu hili Χριστός linaweza kusikika kama cheo chenye maana ya Mtiwa-Mafuta; “Masihi” huhifadhi maana hiyo, huku tanbihi ikitambua umbo la jadi “Kristo.”
- issue: Uhusiano wa κλητὸς na ἀπόστολος
  choice: aliyeitwa kuwa mtume
  alternative: mtume aliyeitwa
  rationale: Kiswahili kilichochaguliwa ni cha asili na kinaonyesha wito wa kimungu bila kudai kwamba “aliyeitwa” ni jina tu alilopewa; mbadala wa karibu zaidi na muundo wa Kigiriki umetolewa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wenye heshima lakini unaosomeka kwa urahisi. Virai vitatu vinavyomweleza Paulo vimeunganishwa kwa mtiririko wa kawaida wa Kiswahili, huku maana nzito ya “mtumwa,” cheo “Masihi,” na hali ya kutendwa katika “aliyetengwa” vikihifadhiwa.
source_grounding:
  english_pob_role: consult_only
