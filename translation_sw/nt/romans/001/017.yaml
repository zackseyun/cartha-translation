base_translation:
  language: en
  yaml_path: translation/nt/romans/001/017.yaml
  text: 'For in it the righteousness of God is revealed from faith to faith[d][c][b][a], just as it is written: “The righteous one shall live by faith.”'
translation:
  language: sw
  text: 'Kwa maana ndani yake haki ya Mungu[a] inafunuliwa, kutoka imani hadi imani[b], kama ilivyoandikwa: “Mwenye haki ataishi kwa imani.”[c][d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uadilifu wa Mungu.” Usemi “haki ya Mungu” unaweza pia kumaanisha “haki itokayo kwa Mungu.”
    reason: lexical_alternative
  - marker: b
    text: Usemi wa Kigiriki unaotafsiriwa “kutoka imani hadi imani” ni mgumu na una utata. Tafsiri nyingine ni “kutokana na imani, kwa ajili ya imani,” “kwa imani tangu mwanzo hadi mwisho,” au “kwa njia ya imani, kuelekea imani.”
    reason: alternative_reading
  - marker: c
    text: Au, “Mwenye haki kwa imani ataishi.”
    reason: alternative_reading
  - marker: d
    text: Au, “Lakini mwenye haki ataishi kwa imani.”
    reason: previous_rendering
lexical_decisions:
- source_word: δικαιοσύνη
  choice: haki
  rationale: “Haki” ni neno la kawaida na lenye heshima katika Kiswahili kwa wazo la kuwa sawa mbele za Mungu na pia linaweza kudokeza uadilifu au haki ya Mungu; hivyo halifungi maana ya neno la Kigiriki katika upande mmoja tu.
- source_word: θεοῦ
  choice: ya Mungu
  rationale: Muundo huu unaakisi hali ya umilikishi ya Kigiriki bila kuamua kama ni haki ambayo Mungu mwenyewe anayo au haki inayotoka kwake.
- source_word: ἐν αὐτῷ
  choice: ndani yake
  rationale: Kiwakilishi cha Kigiriki ni cha jinsia ya kati na kwa kawaida kinarejelea injili iliyotajwa katika mstari uliotangulia.
- source_word: ἀποκαλύπτεται
  choice: inafunuliwa
  rationale: Huwakilisha hali ya sasa ya kitenzi cha kutendwa kwa Kiswahili cha kawaida na cha moja kwa moja.
- source_word: ἐκ πίστεως εἰς πίστιν
  choice: kutoka imani hadi imani
  rationale: Tafsiri hii inadumisha vihusishi viwili, urudiaji wa “imani,” na utata halisi wa usemi wa Kigiriki badala ya kuuchanganua kwa mtazamo mmoja.
- source_word: δίκαιος
  choice: mwenye haki
  rationale: Ni usemi wa kawaida wa Kiswahili unaowakilisha kivumishi kilichotumiwa kama nomino bila kuongeza neno “mtu” lisilokuwapo katika Kigiriki.
- source_word: ἐκ πίστεως
  choice: kwa imani
  rationale: Ni tafsiri ya kawaida na inayoeleweka ya namna au msingi wa kuishi, huku tanbihi ikihifadhi uwezekano wa kuunganisha kishazi hiki na “mwenye haki.”
- source_word: ζήσεται
  choice: ataishi
  rationale: Wakati ujao wa kitenzi umehifadhiwa kwa njia ya asili katika Kiswahili.
theological_decisions:
- issue: Maana ya δικαιοσύνη θεοῦ
  choice: haki ya Mungu
  alternative: haki inayotoka kwa Mungu; uadilifu wa Mungu
  rationale: Muundo wa umilikishi wa Kigiriki una utata wa kitheolojia. Tafsiri kuu inauacha wazi badala ya kuamua ikiwa ni sifa ya Mungu au haki anayoitoa.
- issue: Maana ya ἐκ πίστεως εἰς πίστιν
  choice: kutoka imani hadi imani
  alternative: kutokana na imani, kwa ajili ya imani; kwa imani tangu mwanzo hadi mwisho; kwa njia ya imani, kuelekea imani
  rationale: Usemi huu ni mgumu na una tafsiri kadhaa zinazowezekana. Tafsiri kuu inadumisha mwelekeo na urudiaji wa Kigiriki bila kuingiza ufafanuzi fulani katika maandishi.
- issue: Mahali pa kuunganisha ἐκ πίστεως katika nukuu ya Habakuki
  choice: mwenye haki ataishi kwa imani
  alternative: mwenye kuwa na haki kwa imani ataishi
  rationale: Kigiriki kinaruhusu kishazi “kwa imani” kuhusishwa ama na “mwenye haki” ama na “ataishi.” Tafsiri kuu ni ya kawaida na inayoeleweka, huku mbadala ukihifadhiwa katika tanbihi.
- issue: Jukumu la δὲ katika nukuu
  choice: kiunganishi hakijaonyeshwa katika maandishi makuu
  alternative: Lakini mwenye haki ataishi kwa imani
  rationale: Ingawa δὲ inaweza kutafsiriwa “lakini,” hapa nukuu inaunga mkono kauli iliyotangulia, na “lakini” inaweza kuleta wazo la upinzani lisilokusudiwa. Mbadala wa kimuundo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa sasa, wenye heshima, na unaofaa kwa nukuu ya Maandiko. “Kutoka imani hadi imani” ni usemi usio wa kawaida kwa makusudi ili kuhifadhi muundo na utata wa Kigiriki.
