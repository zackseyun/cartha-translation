lexical_decisions:
- source_word: φάσκοντες
  choice: Wakidai
  rationale: Kitenzi kishirikishi cha wakati uliopo kinaonyesha madai yao wenyewe. ‘Wakidai’ ni Kiswahili cha kawaida na kinahifadhi kejeli ya kauli bila kuongeza maana.
- source_word: εἶναι
  choice: kuwa
  rationale: Kinakamilisha φάσκοντες kwa kuonyesha yaliyomo katika dai lao; kimetafsiriwa moja kwa moja kwa hali ya kutenda isiyo na wakati.
- source_word: σοφοὶ
  choice: wenye hekima
  rationale: Usemi huu wa kawaida unaonyesha sifa waliyojidai kuwa nayo na kuhifadhi maana ya tathmini ya σοφοί.
- source_word: ἐμωράνθησαν
  choice: wakawa wapumbavu
  rationale: Muundo huu unaonyesha matokeo ya kuingia katika hali hiyo na kuhifadhi ukali wa ulinganifu wa Paulo kati ya kujidai kuwa wenye hekima na kuwa wapumbavu.
theological_decisions:
- issue: Iwapo ἐμωράνθησαν itafsiriwe kama sifa ya upumbavu au kama jina lenye nguvu zaidi linalowataja wao wenyewe
  choice: wakawa wapumbavu
  alternative: wakawa wapumbavu katika fikira zao / wakafanywa wapumbavu
  rationale: 'Kauli ya Paulo ina ulinganifu mkali na wa kejeli: walidai kuwa wenye hekima, lakini wakawa wapumbavu. Tafsiri hii huhifadhi nguvu ya Kigiriki bila kuamua kimya kimya ikiwa hali hiyo ilisababishwa na wao wenyewe au na mtendaji mwingine.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi na chenye hadhi. ‘Wenye hekima’ ni cha asili zaidi kuliko ‘wenye busara’ katika muktadha huu, na ‘wapumbavu’ kinahifadhi ukali wa kejeli ya kifungu.
