id: ROM.1.9
reference: Romans 1:9
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: μάρτυς γάρ μού ἐστιν ὁ θεός, ᾧ λατρεύω ἐν τῷ πνεύματί μου ἐν τῷ εὐαγγελίῳ τοῦ υἱοῦ αὐτοῦ, ὡς ἀδιαλείπτως μνείαν ὑμῶν ποιοῦμαι
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/009.yaml
  text: For God[a], whom I serve in my spirit in the good news of his Son[d][c][b], is my witness that I continually mention you.
translation:
  language: sw
  text: Kwa maana Mungu, ambaye ninamtumikia kwa roho yangu katika habari njema ya Mwana wake, ni shahidi wangu kwamba ninawataja daima.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μάρτυς
  choice: shahidi
  rationale: Katika kauli hii yenye uzito wa kiapo, neno hili humtaja Mungu kuwa anayethibitisha ukweli wa madai ya Paulo; “shahidi” ni la kawaida na la moja kwa moja.
- source_word: λατρεύω
  choice: ninayemtumikia
  rationale: Kitenzi kinaweza kumaanisha kumwabudu au kumtolea Mungu huduma ya kidini. “Kumtumikia” huhifadhi wazo la huduma yenye ibada bila kulibana kwa maana moja tu.
- source_word: ἐν τῷ πνεύματί μου
  choice: katika roho yangu
  rationale: Tafsiri hii inafuata muundo wa Kigiriki na kuhifadhi uwezekano wa kuelewa ἐν kuwa eneo la ndani au namna ya huduma, bila kulazimisha maana ya chombo.
- source_word: ἐν τῷ εὐαγγελίῳ τοῦ υἱοῦ αὐτοῦ
  choice: katika habari njema ya Mwana wake
  rationale: “Habari njema” ni Kiswahili wazi cha εὐαγγέλιον; “ya Mwana wake” huhifadhi uhusiano wa kimilikishi wa Kigiriki bila kuamua kimya kimya kuwa maana ni “kuhusu Mwana wake.”
- source_word: ἀδιαλείπτως
  choice: daima
  rationale: Hueleza mwendelezo au kurudiwa bila kuacha; “daima” ni fupi, ya asili, na inaeleweka katika muktadha huu.
- source_word: μνείαν ὑμῶν ποιοῦμαι
  choice: ninawataja
  rationale: Nahau hii kwa karibu ni “nafanya kutajwa kwenu.” “Ninawataja” ni Kiswahili cha asili na hakiongezi wazo la kuwakumbuka ambalo halijasemwa wazi.
theological_decisions:
- issue: Ikiwa εὐαγγέλιον itafsiriwe kwa istilahi ya mapokeo “injili” au kwa maana yake wazi
  choice: habari njema
  alternative: injili
  rationale: “Habari njema” huwasilisha maana ya neno kwa wasomaji wa kawaida bila kubadili fundisho la kifungu.
- issue: Uhusiano wa τοῦ υἱοῦ αὐτοῦ na εὐαγγελίῳ
  choice: habari njema ya Mwana wake
  alternative: habari njema kuhusu Mwana wake
  rationale: Muundo wa “ya Mwana wake” huhifadhi utata halisi wa genitivi, ambao unaweza kuonyesha chanzo, umiliki, au maudhui; “kuhusu” ungeamua kuwa ni maudhui pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Mpangilio wa sentensi umehifadhi uhusiano wa kishazi cha Kigiriki huku ukibaki wazi kwa msomaji wa kawaida.
