base_translation:
  language: en
  yaml_path: translation/nt/romans/001/007.yaml
  text: 'To all those in Rome who are beloved by God and called to be saints: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a][b][c].'
translation:
  language: sw
  text: Kwa wote walio Roma, wapendwa wa Mungu, watakatifu walioitwa:[a] Neema na amani ziwe kwenu kutoka kwa Mungu Baba yetu na Bwana Yesu Masihi.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa mapokeo, “walioitwa kuwa watakatifu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “Kristo.”
    reason: lexical_alternative
  - marker: c
    text: Au, “Kwa wote walio Roma, wapendwa wa Mungu, walioitwa watakatifu.”
    reason: previous_rendering
lexical_decisions:
- source_word: πᾶσιν τοῖς οὖσιν ἐν Ῥώμῃ
  choice: Kwa wote walioko Roma
  rationale: Huhifadhi wazo la wote wanaoandikiwa na mahali walipo kwa Kiswahili cha kawaida na fasaha.
- source_word: ἀγαπητοῖς θεοῦ
  choice: wapendwa wa Mungu
  rationale: Huhifadhi umbo la kivumishi na uzito wa uhusiano; katika Kiswahili, muundo huu kwa kawaida humaanisha wale wanaopendwa na Mungu.
- source_word: κλητοῖς ἁγίοις
  choice: walioitwa kuwa watakatifu
  rationale: Ni Kiswahili cha asili kinachoeleza mwito na utakatifu kwa uwazi, ingawa neno la Kigiriki halina kitenzi wazi kinacholingana na “kuwa”; mbadala wa karibu zaidi na umbo umewekwa katika tanbihi.
- source_word: χάρις
  choice: Neema
  rationale: Ni istilahi ya kawaida na yenye uzito wa kitheolojia katika salamu za Paulo.
- source_word: εἰρήνη
  choice: amani
  rationale: Hutoa maana ya moja kwa moja huku ikihifadhi kazi yake kama salamu na maana yake pana ya kitheolojia.
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: Mungu Baba yetu
  rationale: Ni mpangilio wa kawaida wa Kiswahili unaohifadhi uhusiano unaoelezwa katika Kigiriki.
- source_word: κυρίου
  choice: Bwana
  rationale: Huhifadhi cheo na uzito wake wa kikristolojia katika muktadha huu.
- source_word: Χριστοῦ
  choice: Masihi
  rationale: Hutafsiri maana ya cheo hicho badala ya kukinakili tu; “Kristo” limetolewa kama mbadala wa kimapokeo.
theological_decisions:
- issue: Jinsi ya kutafsiri κλητοῖς ἁγίοις bila kuongeza kwa siri dhana isiyo wazi katika Kigiriki
  choice: walioitwa kuwa watakatifu
  alternative: watakatifu walioitwa
  rationale: Tafsiri kuu ni ya asili na inayoeleweka kwa wasomaji wa sasa, huku tanbihi ikihifadhi muundo wa vivumishi viwili na uwezekano kwamba Paulo anawataja kama watakatifu kwa mwito, si tu kama watu wanaoitwa kufikia hali hiyo.
- issue: Jinsi ya kutafsiri Χριστοῦ kama cheo
  choice: Masihi
  alternative: Kristo
  rationale: “Masihi” huwasilisha maana ya cheo cha Χριστός; tanbihi huhifadhi istilahi ya kimapokeo inayojulikana sana katika Kiswahili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa salamu umewekwa wa asili katika Kiswahili; alama zote za tanbihi zimewekwa katika matini kuu.
