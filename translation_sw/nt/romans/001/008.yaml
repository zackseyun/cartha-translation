id: ROM.1.8
reference: Romans 1:8
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Πρῶτον μὲν εὐχαριστῶ τῷ θεῷ μου διὰ Ἰησοῦ Χριστοῦ ⸀περὶ πάντων ὑμῶν, ὅτι ἡ πίστις ὑμῶν καταγγέλλεται ἐν ὅλῳ τῷ κόσμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/008.yaml
  text: First[a], I thank my God through Jesus the Messiah for all of you[b], because your faith is being proclaimed throughout the whole world.
translation:
  language: sw
  text: Kwanza, ninamshukuru Mungu wangu kwa njia ya Yesu Masihi[a] kwa ajili yenu nyote, kwa sababu imani yenu[b] inatangazwa ulimwenguni kote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, Kristo.
    reason: Tafsiri mbadala ya cheo Χριστός.
  - marker: b
    text: Au, uaminifu wenu; pia huenda ikamaanisha tumaini lenu.
    reason: πίστις linaweza kuonyesha imani, uaminifu, au tumaini kulingana na muktadha.
lexical_decisions:
- source_word: Πρῶτον μὲν
  choice: Kwanza
  rationale: Neno hili linafungua hoja ya Paulo. Kiambishi μὲν hakihitaji kutafsiriwa kando katika Kiswahili cha kawaida.
- source_word: εὐχαριστῶ
  choice: ninamshukuru
  rationale: Hueleza moja kwa moja tendo la kutoa shukrani na kuhifadhi sauti binafsi ya Paulo.
- source_word: τῷ θεῷ μου
  choice: Mungu wangu
  rationale: Huhifadhi umilikaji na sauti ya karibu ya ibada iliyo katika Kigiriki.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: kwa njia ya Yesu Masihi
  rationale: διά pamoja na hali ya genitivi huonyesha njia au upatanishi. Masihi hutafsiri maana ya cheo Χριστός badala ya kukinakili tu.
- source_word: περὶ πάντων ὑμῶν
  choice: kwa ajili yenu nyote
  rationale: Katika muktadha wa shukrani, περί huwasilishwa kwa Kiswahili cha kawaida kama ‘kwa ajili ya’.
- source_word: ἡ πίστις ὑμῶν
  choice: imani yenu
  rationale: ‘Imani’ ndiyo tafsiri ya msingi ya πίστις hapa, huku maana zinazowezekana za uaminifu au kutumaini zikihifadhiwa katika tanbihi.
- source_word: καταγγέλλεται
  choice: inatangazwa
  rationale: Huhifadhi kauli tendwa na maana ya jambo linaloenezwa au kujulishwa hadharani.
- source_word: ἐν ὅλῳ τῷ κόσμῳ
  choice: ulimwenguni kote
  rationale: Ni usemi wa asili wa Kiswahili unaohifadhi upeo mpana wa kauli ya Paulo.
theological_decisions:
- issue: Tafsiri ya Χριστοῦ katika διὰ Ἰησοῦ Χριστοῦ
  choice: Yesu Masihi
  alternative: Yesu Kristo
  rationale: ‘Masihi’ huonyesha maana ya cheo cha Χριστός. Umbo la jadi ‘Kristo’ limehifadhiwa katika tanbihi.
- issue: Tafsiri ya πίστις katika ἡ πίστις ὑμῶν
  choice: imani yenu
  alternative: uaminifu wenu; jinsi mnavyotumaini
  rationale: ‘Imani’ inafaa zaidi kwa habari inayosambaa kuhusu mwitikio wa waamini wa Roma, lakini neno la Kigiriki linaweza pia kubeba wazo la uaminifu au kutumaini; uwezekano huo haujaondolewa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Kwa njia ya’ huhifadhi wazo la upatanishi, na ‘ulimwenguni kote’ huwasilisha kwa kawaida upeo wa usemi wa Kigiriki.
