  yaml_path: translation/nt/romans/001/024.yaml
  text: Therefore God gave them over in the desires of their hearts to impurity[a], for the dishonoring of their bodies among themselves.
translation:
  language: sw
  text: Kwa hiyo Mungu aliwakabidhi, katika tamaa za mioyo yao, kwa uchafu, ili miili yao ivunjiwe heshima miongoni mwao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ndani yao wenyewe.”
    reason: alternative_reading
lexical_decisions:
- source_word: Διὸ
  choice: Kwa hiyo
  rationale: Inaonyesha hitimisho linalotokana na hoja iliyotangulia kwa Kiswahili cha kawaida na wazi.
- source_word: παρέδωκεν
  choice: aliwaacha wafuate
  rationale: Katika muktadha huu linaonyesha Mungu kuwaweka chini ya nguvu au mwelekeo wa tamaa zao; usemi huu ni wa asili kwa Kiswahili bila kuongeza ufafanuzi wa kimadhehebu kama ‘aliwaadhibu kwa kuwaacha.’
- source_word: ἐν ταῖς ἐπιθυμίαις τῶν καρδιῶν αὐτῶν
  choice: wafuate tamaa za mioyo yao
  rationale: Huwasilisha tamaa za ndani kuwa mazingira na nguvu inayotawala kule kuachwa, kwa namna inayoeleweka katika Kiswahili cha sasa.
- source_word: ἐπιθυμίαις
  choice: tamaa
  rationale: Ni neno pana linaloweza kutaja hamu mbaya bila kulifunga mapema kwa tamaa ya ngono pekee.
- source_word: καρδιῶν
  choice: mioyo
  rationale: Linahifadhi taswira ya kibiblia ya kitovu cha nia, mawazo, na matamanio ya ndani.
- source_word: εἰς ἀκαθαρσίαν
  choice: na kuingia katika uchafu
  rationale: ‘Uchafu’ unaonyesha hali ya kutokuwa safi kimaadili; ‘kuingia katika’ linaonyesha matokeo au mwelekeo wa παρέδωκεν εἰς kwa Kiswahili kinachoeleweka.
- source_word: τοῦ ἀτιμάζεσθαι
  choice: hata wakaivunjia heshima
  rationale: Kifungu cha matokeo kinawasilisha athari ya kuachwa bila kulazimisha tofauti kati ya kusudi na matokeo; kauli tendi ya pamoja ni ya asili kwa Kiswahili katika muktadha huu.
- source_word: τὰ σώματα αὐτῶν
  choice: miili yao
  rationale: Huhifadhi msisitizo halisi wa Paulo juu ya miili.
- source_word: ἐν αὐτοῖς
  choice: wao kwa wao
  rationale: Huwasilisha maana ya kutendeana iliyo na uwezekano mkubwa katika muktadha, huku tanbihi ikihifadhi uwezekano mwingine wa kisarufi.
theological_decisions:
- issue: Iwapo παρέδωκεν ifafanuliwe wazi kuwa tendo la hukumu au kuachwa kabisa
  choice: aliwaacha wafuate
  alternative: aliwakabidhi; aliwaacha kabisa; aliwahukumu kwa kuwaacha
  rationale: Tafsiri inahifadhi uzito wa tendo la Mungu na uhusiano wake na tamaa zao bila kuongeza mfumo wa kiteolojia usiotajwa moja kwa moja.
- issue: Uhusiano wa τοῦ ἀτιμάζεσθαι na tendo kuu
  choice: hata wakaivunjia heshima
  alternative: kwa kusudi la kuivunjia heshima; na matokeo yake miili yao ikavunjiwa heshima
  rationale: Muundo wa Kigiriki unaweza kuonyesha kusudi au matokeo. ‘Hata’ huhifadhi mvutano huo kwa kiasi kikubwa na kutoa Kiswahili cha asili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Usemi ‘kuivunjia heshima miili yao’ umechaguliwa ili kuhifadhi lugha ya heshima/haidhinishaji ya ἀτιμάζω bila kutumia lugha ya kale au ya kimadhehebu.
