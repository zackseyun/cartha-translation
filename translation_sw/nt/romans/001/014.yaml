  text: I am under obligation both to Greeks and to barbarians[a], both to the wise and to the foolish.
translation:
  language: sw
  text: Nina deni kwa Wagiriki na wasiokuwa Wagiriki[a], kwa wenye hekima na wasio na hekima.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wageni.” Neno la Kigiriki humaanisha watu wasiokuwa Wagiriki katika ulinganisho wa kawaida wa Kigiriki na Wagiriki; si lazima limaanishe watu wakatili au washenzi.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἕλλησίν
  choice: Wagiriki
  rationale: Ni neno la kawaida la Kiswahili kwa kundi la kikabila na kiutamaduni la Wagiriki, nalo linahifadhi upande wa kwanza wa ulinganisho.
- source_word: βαρβάροις
  choice: wasio Wagiriki
  rationale: Katika ulinganisho huu wa kawaida wa ulimwengu wa Kigiriki, neno linawataja watu wasiokuwa Wagiriki, hasa kwa lugha na utamaduni. Tafsiri hii huepuka dhana ya kisasa ya ukatili inayoweza kuletwa na neno 'washenzi'; tanbihi inaonyesha uwezekano wa 'wageni'.
- source_word: σοφοῖς
  choice: wenye hekima
  rationale: Hutoa maana ya moja kwa moja na ya asili, huku ikidumisha ulinganisho na ἀνοήτοις.
- source_word: ἀνοήτοις
  choice: wasio na hekima
  rationale: Inadumisha ulinganifu wa kifasihi na 'wenye hekima' bila kulazimisha maana finyu ya kutosoma; inaweza pia kueleweka kuwa wapumbavu kulingana na muktadha.
- source_word: ὀφειλέτης
  choice: nina wajibu
  rationale: Nomino hiyo kwa msingi humaanisha mdaiwa, lakini hapa inaeleza deni au wajibu wa kimaadili na kitume, si deni la fedha. Kiswahili hiki ni cha kawaida na kinahifadhi uzito wa wajibu.
- source_word: τε ... καὶ / τε ... καὶ
  choice: kwa ... na kwa ... / kwa ... na kwa ...
  rationale: Muundo unaorudiwa unahifadhi jozi mbili zilizosawazishwa za Kigiriki kwa namna ya asili katika Kiswahili.
