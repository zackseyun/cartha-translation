lexical_decisions:
- source_word: πεπληρωμένους
  choice: wakiwa wamejaa
  rationale: Huonyesha hali iliyopo ya kujaa, inayotokana na tendo lililotangulia, huku ikiunganisha kifungu hiki kwa kawaida na muktadha wake.
- source_word: πάσῃ
  choice: kila aina ya
  rationale: Pamoja na nomino dhahania ya umoja, usemi huu unaonyesha upeo mpana kwa Kiswahili cha kawaida.
- source_word: ἀδικίᾳ
  choice: udhalimu
  rationale: Neno hili linabeba maana pana ya kutokuwa sawa kimaadili na kutenda yasiyo haki, si ukosefu wa haki ya kijamii pekee.
- source_word: πονηρίᾳ
  choice: uovu
  rationale: Ni neno la kawaida na pana kwa ubaya wa kimaadili.
- source_word: πλεονεξίᾳ
  choice: uchoyo
  rationale: Huonyesha tamaa ya kujipatia zaidi na kutotaka kuachilia alicho nacho; ni neno linaloeleweka kwa wasomaji wengi.
- source_word: κακίᾳ
  choice: nia mbaya
  rationale: Hutofautisha neno hili na uovu wa jumla wa πονηρία na kuonyesha mwelekeo wa kumtakia mwingine mabaya.
- source_word: μεστοὺς
  choice: wamejaa
  rationale: Hutoa kwa kawaida wazo la kuwa na mambo yaliyotajwa kwa wingi, huku tofauti ndogo na πεπληρωμένους ikidumishwa kwa muundo wa sentensi.
- source_word: φθόνου
  choice: wivu
  rationale: Ni istilahi ya kawaida ya Kiswahili kwa husuda juu ya mema aliyo nayo mwingine.
- source_word: φόνου
  choice: uuaji
  rationale: Katika orodha hii ya maovu, linaonyesha kuua binadamu kwa uovu; 'uuaji' ni la asili na lenye uzito wa kimaadili.
- source_word: ἔριδος
  choice: ugomvi
  rationale: Huonyesha hali ya kushindana kwa mabishano na kuvuruga mahusiano.
- source_word: δόλου
  choice: udanganyifu
  rationale: Huonyesha kutumia hila au uongo kwa kusudi la kumpotosha mwingine.
- source_word: κακοηθείας
  choice: chuki
  rationale: Katika muktadha huu linaonyesha tabia yenye uovu na kumtakia mwingine mabaya; 'chuki' ni fupi na inaeleweka, ingawa maana ya Kigiriki inaweza pia kuelezwa kama roho mbaya.
- source_word: ψιθυριστάς
  choice: wasengenyaji
  rationale: Huonyesha watu wanaosema mabaya juu ya wengine kwa siri au kwa sauti ya chini.
