id: ROM.1.20
reference: Romans 1:20
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: τὰ γὰρ ἀόρατα αὐτοῦ ἀπὸ κτίσεως κόσμου τοῖς ποιήμασιν νοούμενα καθορᾶται, ἥ τε ἀΐδιος αὐτοῦ δύναμις καὶ θειότης, εἰς τὸ εἶναι αὐτοὺς ἀναπολογήτους,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/020.yaml
  text: For his invisible attributes[a], that is, his eternal power and divinity, have been clearly seen since the creation of the world, being understood through what has been made[b], so that they are without excuse.
translation:
  language: sw
  text: Kwa maana, tangu kuumbwa kwa ulimwengu, sifa zake zisizoonekana[a]—yaani, nguvu zake za milele na uungu wake[b]—zinaonekana wazi, zikifahamikana kwa njia ya vitu vilivyoumbwa, hata wao wasiwe na udhuru.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mambo yake yasiyoonekana.”
    reason: lexical_alternative
  - marker: b
    text: Au, “hali yake ya kimungu.” Neno la Kigiriki hapa ni θειότης, si neno lenye nguvu zaidi θεότης.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἀόρατα αὐτοῦ
  choice: sifa zake zisizoonekana
  rationale: Kirai hiki kinataja kwa upana mambo yasiyoonekana kumhusu Mungu. “Sifa zake” ni Kiswahili cha kawaida na kinachofahamika, huku tanbihi ikihifadhi tafsiri halisi zaidi.
- source_word: ἀπὸ κτίσεως κόσμου
  choice: tangu kuumbwa kwa ulimwengu
  rationale: “Tangu” linaonyesha kwamba hali hii imeendelea kuanzia wakati wa uumbaji, kama inavyodokezwa na ἀπό.
- source_word: τοῖς ποιήμασιν
  choice: kupitia vitu vilivyoumbwa
  rationale: Hali ya dativu inaonyesha njia au chombo cha utambuzi. Katika muktadha wa κτίσεως, “vitu vilivyoumbwa” ni ya asili na hudumisha maana ya matokeo ya tendo la kutenda.
- source_word: νοούμενα
  choice: kwa kuwa zinatambuliwa
  rationale: 'Kitenzi hiki kinaonyesha utambuzi wa kiakili: mambo yasiyoonekana yanafahamika kwa kutafakari uumbaji.'
- source_word: καθορᾶται
  choice: zinaonekana wazi
  rationale: “Wazi” linaakisi nguvu ya kitenzi, na wakati wa sasa unaonyesha hali inayoendelea.
- source_word: ἥ τε ἀΐδιος αὐτοῦ δύναμις
  choice: nguvu zake za milele
  rationale: Kirai hiki kinafafanua mojawapo ya sifa zisizoonekana; “za milele” ni lugha ya kawaida na yenye hadhi kwa ἀΐδιος.
- source_word: θειότης
  choice: uungu wake
  rationale: “Uungu” linaeleza sifa au hali ya kuwa wa kimungu bila kutumia tamko lenye nguvu zaidi linaloweza kufuta tofauti kati ya θειότης na θεότης.
- source_word: εἰς τὸ εἶναι αὐτοὺς ἀναπολογήτους
  choice: Kwa hiyo, wao hawana udhuru
  rationale: Hili linaonyesha matokeo ya ufunuo kupitia uumbaji. “Wao” hudumisha kiwakilishi cha wingi kinachowarejelea wanadamu katika muktadha.
theological_decisions:
- issue: Kutafsiri θειότης bila kuongeza nguvu ya neno la Paulo
  choice: uungu wake
  alternative: hali yake ya kimungu
  rationale: θιότης hapa inaeleza ubora au hali ya kimungu. “Uungu wake” ni fupi na ya kawaida, huku tanbihi ikihifadhi uwezekano wa “hali yake ya kimungu” na tofauti ya kileksika na θεότης.
- issue: Uhusiano wa εἰς τὸ na ukosefu wa udhuru
  choice: 'matokeo: “Kwa hiyo, wao hawana udhuru”'
  alternative: 'kusudi: “ili wasiwe na udhuru”'
  rationale: 'Muundo unaweza kuwa na kivuli cha kusudi au matokeo, lakini katika muktadha huu matokeo ndiyo yanayotiririka kwa kawaida zaidi: ufunuo kupitia uumbaji unawaacha bila udhuru.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imegawanywa kwa alama ya kituo kabla ya hitimisho ili iwe rahisi kusomeka, bila kubadili uhusiano wa kimantiki. Alama za tanbihi zimewekwa moja kwa moja baada ya maneno yanayohusika.
