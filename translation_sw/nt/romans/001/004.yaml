  yaml_path: translation/nt/romans/001/004.yaml
  text: and who was declared to be the Son of God in power according to the Spirit of holiness by the resurrection from the dead—Jesus the Messiah our Lord[b][a],
translation:
  language: sw
  text: na alitangazwa kuwa Mwana wa Mungu katika nguvu[a], kwa kadiri ya Roho wa utakatifu[b], kwa ufufuo kutoka kwa wafu—Yesu Masihi, Bwana wetu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “aliteuliwa kuwa” au “alidhihirishwa kuwa Mwana wa Mungu katika nguvu.”
    reason: lexical_alternative
  - marker: b
    text: Au “kwa kadiri ya Roho Mtakatifu”; usemi wa Kigiriki ni “Roho wa utakatifu.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὁρισθέντος
  choice: alidhihirishwa kuwa
  rationale: Kitenzi hiki kinaweza kumaanisha kuweka mipaka, kuamua, kuteua, au kubainisha. “Alidhihirishwa kuwa” ni Kiswahili cha kawaida kinachoonyesha kutambuliwa wazi kwa hali yake bila kudai kwamba alianza kuwa Mwana wa Mungu wakati huo; maana kuu mbadala zimehifadhiwa katika tanbihi.
- source_word: υἱοῦ θεοῦ
  choice: Mwana wa Mungu
  rationale: Hili ndilo tafsiri ya moja kwa moja na ya kawaida ya cheo hiki cha Kikristo.
- source_word: ἐν δυνάμει
  choice: katika nguvu
  rationale: Usemi huu wa karibu na Kigiriki unahifadhi uhusiano wenye utata kati ya nguvu na hali ya kuwa Mwana, badala ya kuugeuza kuwa kielezi kwamba alitangazwa kwa nguvu.
- source_word: κατὰ πνεῦμα ἁγιωσύνης
  choice: kwa kufuata Roho wa utakatifu
  rationale: “Kwa kufuata” hapa huonyesha kipimo, hali, au mpangilio unaoelezwa na κατά, huku “Roho wa utakatifu” ikihifadhi usemi usio wa kawaida wa Kigiriki bila kuamua kabisa kama ni jina la moja kwa moja la Roho Mtakatifu.
- source_word: ἐξ ἀναστάσεως νεκρῶν
  choice: kwa ufufuo kutoka kwa wafu
  rationale: Tafsiri hii inaonyesha ufufuo kuwa msingi au tukio la udhihirisho, na inahifadhi namna ya jumla ya “wafu” katika Kigiriki.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesu Masihi
  rationale: Χριστός inatafsiriwa kama cheo “Masihi,” na mpangilio wa Kiswahili “Yesu Masihi” ni wa kawaida na wenye heshima.
- source_word: κυρίου ἡμῶν
  choice: Bwana wetu
  rationale: “Bwana” huhifadhi maana ya cheo cha κύριος na uzito wake wa Kikristo katika matumizi ya Paulo.
theological_decisions:
- issue: Kama ὁρισθέντος inamaanisha kwamba Yesu alianza kuwa Mwana wa Mungu wakati wa ufufuo
  choice: “alidhihirishwa kuwa Mwana wa Mungu katika nguvu”
  alternative: “aliteuliwa kuwa Mwana wa Mungu katika nguvu” au “alitangazwa kuwa Mwana wa Mungu katika nguvu”
  rationale: Matini kuu haidai kwamba uwana wake ulianza wakati wa ufufuo. Wakati huohuo, haifuti mvutano wa neno la Kigiriki, na tanbihi inahifadhi tafsiri nyingine zinazowezekana.
- issue: Kama πνεῦμα ἁγιωσύνης inamtaja Roho Mtakatifu moja kwa moja
  choice: “Roho wa utakatifu”
  alternative: “Roho Mtakatifu” au “roho yake takatifu”
  rationale: Usemi wa Kigiriki si usemi wa kawaida wa “Roho Mtakatifu” na unaweza kulingana kimakusudi na “kwa jinsi ya mwili” katika mstari wa 3; hivyo tafsiri haiongezi uhakika usiokuwamo wazi katika matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “katika nguvu” na usemi “Roho wa utakatifu” umeachwa kwa ukaribu wa kimakusudi na matini ya Kigiriki ili kuhifadhi utata wake wa kweli; tanbihi zinafafanua bila kulazimisha fasiri ya dhehebu.
