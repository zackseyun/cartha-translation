  text: For this reason God gave them over to dishonorable passions[a], for even their women exchanged natural relations for what is contrary to nature[c][b],
translation:
  language: sw
  text: Kwa sababu hii, Mungu aliwakabidhi kwa tamaa za aibu; kwa maana hata wanawake wao[a] walibadilisha mahusiano ya asili[b] kwa yale yaliyo kinyume na maumbile[c].
