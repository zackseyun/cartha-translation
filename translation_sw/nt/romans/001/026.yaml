lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Kwa sababu hii
  rationale: Kiunganishi hiki cha sababu kinaunganisha mstari huu na hoja iliyotangulia bila kupunguza nguvu yake ya kimantiki.
- source_word: παρέδωκεν αὐτοὺς
  choice: aliwaacha watawaliwe
  rationale: Kiswahili cha moja kwa moja ‘aliwakabidhi katika’ kingekuwa kigumu hapa. Usemi huu unaonyesha kwamba Mungu aliwaacha chini ya nguvu ya tamaa hizo, huku ukihifadhi maana ya hukumu iliyo katika kitenzi.
- source_word: πάθη ἀτιμίας
  choice: tamaa za aibu
  rationale: Huhifadhi tathmini ya kimaadili ya ἀτιμία kwa lugha ya kawaida na yenye staha bila kuongeza maelezo yasiyokuwamo.
- source_word: θήλειαι αὐτῶν
  choice: wanawake wao
  rationale: ‘Wanawake’ ni Kiswahili cha kawaida kwa wanawake wa kibinadamu katika muktadha huu; maana halisi zaidi ya ‘wa kike’ imewekwa katika tanbihi.
- source_word: μετήλλαξαν
  choice: walibadilisha
  rationale: Hutoa wazi wazo la kuacha jambo moja na kuchukua jingine lililo katika kitenzi μεταλλάσσω.
- source_word: τὴν φυσικὴν χρῆσιν
  choice: mahusiano ya asili
  rationale: Muktadha unaonyesha mahusiano ya kingono. Tafsiri hii ni ya kawaida na inayoeleweka, tofauti na ‘matumizi ya asili,’ ambayo ingesikika ngumu au kana kwamba inawafanya watu kuwa vyombo.
- source_word: τὴν παρὰ φύσιν
  choice: yale yaliyo kinyume na maumbile
  rationale: Huhifadhi muundo na nguvu ya usemi wa Kigiriki bila kuufafanua kwa makundi ya kisasa ambayo hayatajwi katika mstari.
theological_decisions:
- issue: Iwapo kupunguza au kuongeza nguvu ya tathmini ya Paulo
  choice: Kuhifadhi maneno ‘tamaa za aibu’ na ‘kinyume na maumbile’ bila ufafanuzi wa ziada.
  alternative: Kutumia maneno laini kama ‘tamaa zisizofaa,’ au kuongeza maelezo makali yanayotaja makundi ya kisasa.
  rationale: Mstari wenyewe una tathmini ya kimaadili, kwa hiyo tafsiri inapaswa kuihifadhi; hata hivyo, haipaswi kuingiza mafundisho au makundi yasiyotajwa katika chanzo.
- issue: Maana ya παρέδωκεν katika tendo la Mungu
  choice: ‘Mungu aliwaacha watawaliwe’
  alternative: ‘Mungu aliwakabidhi’ au ‘Mungu aliwaacha wafuate’
  rationale: Chaguo hili linahifadhi wazo la Mungu kuwaacha chini ya tamaa hizo kama hukumu, bila kuongeza wazi kwamba aliwaamuru wazifuate.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo unabaki karibu na Kigiriki, lakini huepuka misemo isiyo ya kawaida katika Kiswahili.
