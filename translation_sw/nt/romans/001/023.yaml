base_translation:
  language: en
  yaml_path: translation/nt/romans/001/023.yaml
  text: and exchanged the glory of the imperishable God for the likeness of an image of perishable man and birds and four-footed animals and reptiles[a][b][c][d].
translation:
  language: sw
  text: Nao waliubadilisha utukufu wa Mungu asiyeharibika[a] kwa ufanano wa sanamu[b] ya mwanadamu anayeharibika[c], na wa ndege, wanyama wenye miguu minne, na viumbe vitambaavyo[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mungu asiye na uharibifu.”
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “katika ufanano wa sanamu ya mwanadamu anayeharibika, na wa ndege, wanyama wenye miguu minne, na viumbe vitambaavyo.”
    reason: lexical_alternative
  - marker: c
    text: Au, “mwanadamu anayekufa.”
    reason: lexical_alternative
  - marker: d
    text: Au, “wanyama watambaao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤλλαξαν
  choice: waliubadilisha ... kwa
  rationale: Muundo huu unaonyesha kubadilisha kitu kimoja kwa kingine, yaani kuacha utukufu wa Mungu na kuweka sanamu mahali pake, huku ukibaki wa kawaida katika Kiswahili.
- source_word: δόξαν
  choice: utukufu
  rationale: “Utukufu” ndiyo tafsiri ya kawaida na yenye hadhi kwa δόξα katika muktadha wa Mungu.
- source_word: ἀφθάρτου
  choice: asiyeharibika
  rationale: Neno hili linaonyesha kwamba Mungu hashindwi na uharibifu au kuoza, na linadumisha ulinganifu wa moja kwa moja na φθαρτοῦ.
- source_word: ἐν ὁμοιώματι εἰκόνος
  choice: kwa mfano wa sanamu
  rationale: Tafsiri hii inadumisha maneno mawili yanayohusiana na uwakilishi katika Kigiriki—ὁμοίωμα na εἰκών—bila kufanya sentensi ya Kiswahili kuwa nzito kupita kiasi.
- source_word: φθαρτοῦ ἀνθρώπου
  choice: mwanadamu anayeharibika
  rationale: Hii inadumisha umoja wa ἀνθρώπου na upinzani wa kimakusudi kati ya Mungu asiyeharibika na mwanadamu anayeharibika.
- source_word: πετεινῶν
  choice: ndege
  rationale: “Ndege” ni neno la kawaida na sahihi kwa viumbe warukao wanaokusudiwa hapa.
- source_word: τετραπόδων
  choice: wanyama wenye miguu minne
  rationale: Tafsiri hii ni wazi, ya kawaida, na inafuata maana halisi ya neno la Kigiriki.
- source_word: ἑρπετῶν
  choice: viumbe vitambaavyo
  rationale: Neno la Kigiriki linaweza kuwa pana kuliko kundi la kisayansi la reptilia; “viumbe vitambaavyo” linahifadhi upana huo.
theological_decisions:
- issue: Ulinganifu kati ya kutoharibika kwa Mungu na kuharibika kwa mwanadamu
  choice: Mungu asiyeharibika ... mwanadamu anayeharibika
  alternative: Mungu asiyeweza kufa ... mwanadamu anayekufa
  rationale: Tafsiri iliyochaguliwa inahifadhi kwa karibu mzizi na upinzani wa ἀφθάρτου/φθαρτοῦ bila kuufupisha kuwa suala la kufa pekee.
- issue: Aina ya vitu vinavyotajwa katika ἑρπετῶν
  choice: viumbe vitambaavyo
  alternative: reptilia
  rationale: Chaguo hili halifungi maana katika uainishaji wa kisasa wa wanyama na hivyo linahifadhi upana wa lugha ya chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Nao” linaendeleza kiunganishi καί, huku “kwa mfano wa sanamu” kikihifadhi msongamano wa lugha ya taswira katika chanzo. Alama zote za tanbihi zimewekwa moja kwa moja baada ya maneno yanayohusika.
