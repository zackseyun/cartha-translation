  rationale: Neno hili humaanisha watu wasioshikamana na makubaliano au ahadi zao. Tafsiri hii inaeleza wazi kutotegemeka kwao katika mahusiano yenye wajibu.
- source_word: ἀστόργους
  choice: wasio na upendo wa kifamilia
  rationale: Neno hili linakanusha upendo wa asili, hasa ule wa jamaa wa familia; tafsiri ya moja kwa moja huhifadhi maana hiyo mahususi.
- source_word: ἀνελεήμονας
  choice: wasio na huruma
  rationale: Tafsiri hii ya kawaida na iliyo wazi huonyesha ukosefu wa rehema au moyo wa kuwahurumia wengine.
