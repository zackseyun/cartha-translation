id: ROM.1.13
reference: Romans 1:13
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οὐ θέλω δὲ ὑμᾶς ἀγνοεῖν, ἀδελφοί, ὅτι πολλάκις προεθέμην ἐλθεῖν πρὸς ὑμᾶς, καὶ ἐκωλύθην ἄχρι τοῦ δεῦρο, ἵνα τινὰ καρπὸν σχῶ καὶ ἐν ὑμῖν καθὼς καὶ ἐν τοῖς λοιποῖς ἔθνεσιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/013.yaml
  text: I do not want you to be unaware[a], brothers, that I have often planned to come to you—but have been prevented until now—so that I might have some fruit among you also[c][b], just as among the rest of the Gentiles.
translation:
  language: sw
  text: Sitaki mkose kujua, ndugu[a], kwamba mara nyingi nimekusudia kuja kwenu, lakini nimezuiwa mpaka sasa, ili nipate matunda fulani[b] miongoni mwenu pia, kama miongoni mwa watu wengine wa Mataifa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, ndugu wa kiume na wa kike katika imani.
    reason: lexical_alternative
  - marker: b
    text: “Matunda” hapa yanamaanisha matokeo ya huduma ya Paulo miongoni mwao.
    reason: cultural_note
  - marker: c
    text: Au, “mataifa mengine.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ θέλω ... ἀγνοεῖν
  choice: Sitaki mkose kujua
  rationale: Huhifadhi muundo hasi wa kauli ya Paulo kwa Kiswahili cha kawaida na wazi, bila kuongeza kiashiria cha wakati kisichokuwapo katika chanzo.
- source_word: ἀδελφοί
  choice: ndugu
  rationale: Katika Kiswahili, “ndugu” ni mwito wa kawaida usiobainisha jinsia na unaweza kuwajumuisha waumini wanaume na wanawake; tanbihi inaweka wazi matumizi hayo.
- source_word: πολλάκις προεθέμην
  choice: mara nyingi nimekusudia
  rationale: “Nimekusudia” huonyesha nia iliyowekwa mara kadhaa kabla ya wakati wa kuandika, huku ikisalia ya asili na yenye hadhi.
- source_word: ἐκωλύθην
  choice: nimezuiwa
  rationale: Huhifadhi hali ya kutendwa na wazo la kizuizi kilichomzuia Paulo kutekeleza nia yake.
- source_word: ἄχρι τοῦ δεῦρο
  choice: mpaka sasa
  rationale: Ni usemi wa kawaida wa Kiswahili unaowasilisha kikomo cha wakati kwa usahihi.
- source_word: ἵνα τινὰ καρπὸν σχῶ
  choice: ili nipate matunda fulani
  rationale: Huhifadhi sitiari ya kilimo ya καρπός na pia kutokubainishwa kwa τινά, badala ya kuifasiri moja kwa moja kuwa mavuno au matokeo.
- source_word: ἐν ὑμῖν
  choice: miongoni mwenu
  rationale: Huonyesha kwa Kiswahili cha kawaida kwamba matunda hayo yangepatikana katika huduma ya Paulo kati ya jumuiya ya Roma.
- source_word: καθὼς καὶ ἐν τοῖς λοιποῖς ἔθνεσιν
  choice: kama nilivyopata miongoni mwa watu wengine wa mataifa
  rationale: Kitenzi kilichodokezwa na ulinganisho kimewekwa wazi kwa ulaini wa Kiswahili. “Watu wa mataifa” huwasilisha maana ya watu wasio Wayahudi bila kugeuza ἔθνη kuwa mataifa ya kisiasa.
theological_decisions:
- issue: Maana ya καρπός katika kusudi la ziara ya Paulo
  choice: Kuhifadhi “matunda” katika matini na kueleza kwa tanbihi kuwa ni matokeo ya huduma
  alternative: Kutafsiri moja kwa moja “matokeo fulani” au “mavuno fulani”
  rationale: Sitiari ya Paulo inaweza kuhusisha matokeo mbalimbali ya kitume; kuihifadhi huepuka kuibana kuwa uongofu pekee au aina moja ya mafanikio.
- issue: Upeo wa ἔθνη
  choice: watu wengine wa mataifa
  alternative: mataifa mengine
  rationale: Katika muktadha wa utume wa Paulo, neno hilo kwa kawaida humaanisha watu wasio Wayahudi. Hata hivyo, tanbihi inahifadhi uwezekano wa tafsiri ya moja kwa moja “mataifa mengine.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inafuata mwendo wa hoja ya Kigiriki lakini hutumia miundo ya asili ya Kiswahili. Alama zote za tanbihi zimewekwa katika matini kuu karibu na maneno yanayohusika.
