  text: οὕτως τὸ κατ’ ἐμὲ πρόθυμον καὶ ὑμῖν τοῖς ἐν Ῥώμῃ εὐαγγελίσασθαι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/015.yaml
  text: So[a], for my part, I am eager to proclaim the good news also to you who are in Rome.
translation:
  language: sw
  text: Kwa hiyo, kwa upande wangu, nina hamu ya kuwahubiria Habari Njema ninyi pia mlioko Roma.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuwahubiria Injili ninyi pia mlioko Roma.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: Kwa hiyo
  rationale: Katika muktadha huu neno hili linaunganisha hitimisho la maelezo yaliyotangulia na nia ya Paulo; “Kwa hiyo” ni kiunganishi cha kawaida na wazi katika Kiswahili.
- source_word: τὸ κατ’ ἐμὲ πρόθυμον
  choice: kwa upande wangu, nina hamu
  rationale: Kirai cha Kigiriki ni cha kimkato na kinaonyesha utayari wenye moyo wa kufanya jambo. Tafsiri hii ni ya asili katika Kiswahili na inaonyesha ari, si kupatikana tu.
- source_word: καὶ ὑμῖν
  choice: ninyi pia
  rationale: “Pia” inaonyesha kwamba walio Roma wanajumuishwa pamoja na watu wa maeneo mengine ambao Paulo alitamani kuwahubiria.
- source_word: τοῖς ἐν Ῥώμῃ
  choice: mlio Roma
  rationale: Hii inawatambulisha wanaoandikiwa kwa njia fupi, ya kawaida, na iliyo wazi katika Kiswahili.
- source_word: εὐαγγελίσασθαι
  choice: kuwahubiria Habari Njema
  rationale: Kitenzi hiki humaanisha kutangaza habari njema au injili. “Kuhubiri Habari Njema” ni Kiswahili kinachoeleweka na hakifungi tendo hilo katika mahubiri rasmi pekee.
