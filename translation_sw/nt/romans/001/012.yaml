translation:
  language: sw
  text: Yaani, ili mimi na ninyi tutiane moyo miongoni mwenu kwa imani yetu sisi kwa sisi—imani yenu na yangu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτο δέ ἐστιν
  choice: Yaani
  rationale: Hutambulisha ufafanuzi wa kauli iliyotangulia kwa Kiswahili cha kawaida na chenye heshima.
- source_word: συμπαρακληθῆναι
  choice: tutiane moyo
  rationale: Kitenzi hiki kinaonyesha kutiwa moyo kwa pamoja na kwa pande zote. Kiswahili hutumia kiima cha wingi kwa uasilia ili kuonyesha kwamba Paulo na waamini wa Roma wanatiana moyo.
- source_word: ἐν ὑμῖν
  choice: nikiwa miongoni mwenu
  rationale: Huonyesha mahali na ushirika ambamo kutiwa moyo kunatokea, huku muktadha ukidumisha mtazamo wa Paulo wa kwenda kwao.
- source_word: διὰ τῆς ἐν ἀλλήλοις πίστεως
  choice: kwa imani tuliyo nayo sisi kwa sisi
  rationale: Huhifadhi maana ya njia inayotumiwa na ya ushirikiano wa pande zote bila kuifanya imani kuwa wazo la jumla lisilo la mtu.
- source_word: πίστεως
  choice: imani
  rationale: Katika muktadha huu πίστις ni imani ya Paulo na ya waamini, si hasa uaminifu.
- source_word: ὑμῶν τε καὶ ἐμοῦ
  choice: imani yenu na yangu
  rationale: Huweka wazi uwiano kati ya imani yao na ya Paulo na kuondoa utata wa virejeshi katika Kiswahili.
theological_decisions:
- issue: Ikiwa Paulo anazungumzia kuwatia moyo wao pekee au kutiwa moyo kwa pande zote
  choice: Paulo na waamini wa Roma watatiana moyo
  alternative: Paulo hasa ndiye atakayewatia moyo wao
  rationale: Kiambishi cha ushirika katika συμπαρακληθῆναι pamoja na “yenu na yangu” kinaonyesha tendo la pande zote; tafsiri haipaswi kulifanya huduma ya upande mmoja.
- issue: Kiima kinachodokezwa na infinitivu συμπαρακληθῆναι
  choice: Kiima cha wingi kinachojumuisha Paulo na wasomaji, huku “nikiwa” kikihifadhi mtazamo wake wa nafsi ya kwanza
  alternative: 'Paulo peke yake ndiye kiima cha kisarufi: “nitiwe moyo pamoja nanyi”'
  rationale: Infinitivu ya Kigiriki yenyewe haijawekewa alama ya umoja. Muktadha unamhusu Paulo, lakini maana ya kitenzi ni ya pamoja; muundo huu wa Kiswahili huhifadhi mambo yote mawili kwa uasilia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Tutiane moyo” ni usemi wa kawaida unaobeba vizuri maana ya faraja na uimarishaji wa pande zote; mstari wa em hutenganisha ufafanuzi wa mwisho bila kuufanya sentensi kuwa nzito.
