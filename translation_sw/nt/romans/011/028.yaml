  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: κατὰ μὲν τὸ εὐαγγέλιον ἐχθροὶ δι’ ὑμᾶς, κατὰ δὲ τὴν ἐκλογὴν ἀγαπητοὶ διὰ τοὺς πατέρας·
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/028.yaml
  text: With respect to the gospel[a], they are enemies for your sake; but with respect to election[b], they are beloved because of the fathers.
translation:
  language: sw
  text: Kwa habari ya injili, wao ni maadui kwa ajili yenu[a]; lakini kwa habari ya uchaguzi, wao ni wapendwa kwa sababu ya mababu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa sababu yenu.”
    reason: διά pamoja na akuzativi inaweza kuonyesha manufaa (“kwa ajili yenu”) au sababu (“kwa sababu yenu”); muktadha unaruhusu kivuli cha maana zote mbili.
  - marker: b
    text: “Mababu” hapa ni mababu wakuu wa Israeli, hasa Abrahamu, Isaka, na Yakobo.
    reason: Tanbihi inafafanua rejeo la kimuktadha la οἱ πατέρες bila kupanua matini kuu.
lexical_decisions:
- source_word: κατὰ μὲν τὸ εὐαγγέλιον
  choice: Kwa habari ya injili
  rationale: Kirai hiki kinaonyesha upande au msingi wa kuutazamia jambo, huku μὲν...δὲ ikiweka ulinganisho wenye pande mbili. “Kwa habari ya” ni Kiswahili cha kawaida kinachohifadhi muundo huo bila kudokeza mwendo au kipimo.
- source_word: ἐχθροὶ
  choice: adui
  rationale: Kivumishi hiki kimetumika kama kiarifu na kinaeleza hali yao ya kimahusiano. “Adui” huhifadhi nguvu ya neno la Kigiriki; “wenye uhasama” kingepunguza uzito wake, na “wanaochukiwa” kingebadili maana kuwa mtazamo wa Mungu kwao.
- source_word: δι’ ὑμᾶς
  choice: kwa ajili yenu
  rationale: διά pamoja na hali ya akuzativi inaweza kuonyesha sababu au manufaa. “Kwa ajili yenu” inafaa hoja ya Paulo kwamba hali ya sasa ya Israeli imewanufaisha watu wa mataifa, huku tanbihi ikihifadhi uwezekano wa maana ya kisababishi.
- source_word: κατὰ δὲ τὴν ἐκλογὴν
  choice: lakini kwa habari ya uteuzi
  rationale: “Lakini” huonyesha upande wa pili wa μὲν...δὲ, na “kwa habari ya” huonyesha eneo la kuzingatia. “Uteuzi” huhifadhi nomino dhahania ya Kigiriki na wazo la kuchagua bila kuongeza maneno yasiyokuwapo katika matini.
- source_word: ἀγαπητοὶ
  choice: wapendwa
  rationale: Neno hili linaeleza kuwa wao ni watu wanaopendwa. “Wapendwa” huhifadhi umbo la kiarifu na uzito wa uhusiano wa agano, bila kupunguza mvutano uliopo kati ya “adui” na “wapendwa.”
- source_word: διὰ τοὺς πατέρας
  choice: kwa sababu ya mababu
  rationale: διά hapa inaonyesha sababu au msingi. “Mababu” ni tafsiri ya asili ya οἱ πατέρες katika Kiswahili na huhifadhi usemi mfupi wa Paulo, huku tanbihi ikifafanua kwamba katika muktadha huu hasa ni mababu wakuu wa Israeli.
theological_decisions:
- issue: Wanaorejelewa na kiwakilishi kisichotajwa wazi katika sentensi
  choice: “Wao” linarejelea Israeli, yaani Wayahudi, kwa mtazamo wa ujumla katika hoja ya Waroma 9–11.
  alternative: Kurejelea kwa namna finyu Wayahudi wasioamini wa wakati wa Paulo pekee.
  rationale: Muktadha unazungumzia Israeli kwa ujumla, ingawa hali inayozungumziwa inawahusu wengi wao wasioamini wakati huo. Tafsiri haitaji kundi finyu zaidi ya lile linalodokezwa na muktadha.
- issue: Maana ya “adui”
  choice: Inaeleza hali yao kwa habari ya injili, bila kufuta ukweli kwamba wao ni wapendwa kwa habari ya uteuzi.
  alternative: Kumaanisha kwamba Mungu anawachukia kabisa, au kwamba wao wana upinzani wa kijamii tu.
  rationale: Mstari wenyewe unaweka “adui” sambamba na “wapendwa.” Tafsiri inahifadhi pande zote mbili za mvutano huo bila kuufafanua kupita kiasi.
- issue: Maana ya “mababu”
  choice: Mababu wakuu wa Israeli, hasa Abrahamu, Isaka na Yakobo, ambao walipokea ahadi za agano.
  alternative: Mababu wote wa kikabila kwa maana ya jumla.
  rationale: Katika Waroma 9–11, οἱ πατέρες kwa kawaida huwakumbusha wasomaji mababu wakuu na ahadi walizopewa. Matini kuu inabaki na neno pana “mababu,” na tanbihi inatoa ufafanuzi wa kimuktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa “kwa habari ya ... lakini kwa habari ya ...” unahifadhi ulinganisho wa Kigiriki; “adui” na “wapendwa” zinahifadhi mvutano wa kitheolojia wa mstari.
