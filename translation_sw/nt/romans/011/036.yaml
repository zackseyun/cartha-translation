  text: ὅτι ἐξ αὐτοῦ καὶ δι’ αὐτοῦ καὶ εἰς αὐτὸν τὰ πάντα· αὐτῷ ἡ δόξα εἰς τοὺς αἰῶνας, ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/036.yaml
  text: For from him and through him and to him are all things[a]. To him be the glory forever[b]. Amen.
translation:
  language: sw
  text: Kwa maana vitu vyote vinatoka kwake, vinakuwepo kwa njia yake, na vinaelekea kwake. Utukufu ni wake milele. Amina.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: Kwa maana
  rationale: Inaonyesha sababu au msingi wa sifa iliyotangulia na ni usemi wa kawaida wa Kiswahili unaohifadhi nguvu ya kisababishi.
- source_word: ἐξ αὐτοῦ
  choice: vinatoka kwake
  rationale: Hueleza chanzo au asili; muundo huu ni wa asili katika Kiswahili na unaonyesha kwamba vitu vyote vina chanzo chake kwake.
- source_word: δι’ αὐτοῦ
  choice: viko kwa njia yake
  rationale: Huhifadhi wazo la njia au uwakala bila kulibana kuwa tendo la uumbaji pekee.
- source_word: εἰς αὐτὸν
  choice: vinaelekea kwake
  rationale: Huhifadhi maana ya mwelekeo au lengo ya εἰς bila kuamua kimyakimya kwamba maana ni 'kwa ajili yake' pekee.
- source_word: τὰ πάντα
  choice: vitu vyote
  rationale: Ni tafsiri ya kawaida yenye upeo mpana, inayofaa kwa kauli ya Paulo kuhusu jumla ya vilivyopo.
- source_word: αὐτῷ ἡ δόξα
  choice: Utukufu ni wake
  rationale: Ni tamko la sifa la asili na lenye heshima katika Kiswahili; linawasilisha kwamba utukufu unamhusu yeye bila kuingiza maelezo ya ziada.
- source_word: εἰς τοὺς αἰῶνας
  choice: milele
  rationale: Ni nahau ya kawaida ya Kiswahili kwa usemi wa Kigiriki unaomaanisha muda usio na mwisho.
- source_word: ἀμήν
  choice: Amina
  rationale: Umbo lililozoeleka katika matumizi ya Biblia na ibada ya Kiswahili.
theological_decisions:
- issue: Mhusika wa viwakilishi αὐτοῦ/αὐτὸν/αὐτῷ
  choice: Viwakilishi vinadumishwa, vikimrejelea Mungu kulingana na muktadha wa Waroma 11:33–35.
  alternative: Kutaja 'Mungu' moja kwa moja kila mahali.
  rationale: Kutodokeza jina badala ya viwakilishi kunahifadhi nguvu ya balagha ya maandishi na hakupunguzi wala kupanua rejeleo zaidi ya muktadha.
- issue: Maana ya εἰς αὐτόν
  choice: vinaelekea kwake
  alternative: ni kwa ajili yake
  rationale: Kigiriki kinaweza kuonyesha lengo, mwelekeo, au kusudi. 'Vinaelekea kwake' huhifadhi mvutano huo bila kufungia tafsiri katika kusudi pekee.
- issue: Tamko lisilo na kitenzi αὐτῷ ἡ δόξα
  choice: Utukufu ni wake
  alternative: Utukufu na uwe kwake
  rationale: Kigiriki hakina kitenzi kilichoandikwa. Tamko hili ni la asili katika Kiswahili na linaweza kusomwa kama sifa ya hali halisi, huku mbadala ukiwa ombi au matakwa yaliyo wazi zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa vipashio vitatu umehifadhiwa, lakini vitenzi vimetumiwa ili sentensi isikike kwa ufasaha katika Kiswahili.
