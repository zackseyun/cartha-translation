  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ὦ βάθος πλούτου καὶ σοφίας καὶ γνώσεως θεοῦ· ὡς ἀνεξεραύνητα τὰ κρίματα αὐτοῦ καὶ ἀνεξιχνίαστοι αἱ ὁδοὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/033.yaml
  text: Oh[b][a], the depth of the riches and wisdom and knowledge of God! How unsearchable are his judgments and untraceable his ways!
translation:
  language: sw
  text: Ee, kina cha utajiri na hekima na maarifa ya Mungu![a] Jinsi hukumu zake zisivyoweza kuchunguzwa, na njia zake zisivyoweza kufuatiliwa![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ee, kina cha utajiri wa hekima na maarifa ya Mungu!” Muundo wa Kigiriki unaweza kuunganisha “utajiri” kwa karibu zaidi na “hekima” na “maarifa”; matini kuu inachukulia utajiri, hekima, na maarifa yote kuwa ya Mungu.
    reason: alternative_reading
  - marker: b
    text: “Zisivyoweza kufuatiliwa” inatafsiri neno lenye maana ya kutoweza kufuatwa kwa kuchunguza nyayo au mkondo wake. Hivyo inadumisha tofauti ndogo na “zisivyoweza kuchunguzwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὦ
  choice: Lo
  rationale: Kihisishi hiki kinaanzisha mshangao wa ibada. “Lo” ni kifupi, cha heshima, na kinahifadhi nguvu ya mshangao wa Kigiriki.
- source_word: βάθος
  choice: kina
  rationale: Neno hili linaonyesha kina kisichopimika kwa maana ya mfano na linadumisha taswira ya Kigiriki.
- source_word: πλούτου
  choice: utajiri
  rationale: “Utajiri” huhifadhi wazo la wingi mkubwa na uzito wa kitheolojia unaopatikana mara nyingi katika matumizi ya Paulo.
- source_word: σοφίας
  choice: hekima
  rationale: Hili ni neno la kawaida na lililo wazi kwa σοφία, likirejelea hekima ya Mungu katika kusudi na matendo yake.
- source_word: γνώσεως
  choice: maarifa
  rationale: “Maarifa” yanatofautishwa na “hekima,” kama yalivyo maneno mawili tofauti katika chanzo.
- source_word: θεοῦ
  choice: ya Mungu
  rationale: Muundo huu unaruhusu hali ya umilikaji ihusishwe kwa kawaida na utajiri, hekima, na maarifa, huku tanbihi ikihifadhi uwezekano mwingine wa kisintaksia.
- source_word: ὡς
  choice: Jinsi
  rationale: Katika matumizi ya mshangao, “Jinsi” huanzisha kwa kawaida kauli inayosisitiza kiwango kisichoweza kupimika.
- source_word: ἀνεξεραύνητα
  choice: zisivyochunguzika
  rationale: Neno hili linaonyesha jambo lisiloweza kuchunguzwa au kufanyiwa utafiti mpaka lieleweke kikamilifu.
- source_word: κρίματα
  choice: hukumu
  rationale: “Hukumu” linahifadhi upana wa maana ya maamuzi, tathmini, au matamko ya Mungu bila kuibana kuwa amri rasmi pekee.
- source_word: ἀνεξιχνίαστοι
  choice: zisivyoweza kufuatiliwa
  rationale: Kauli hii huhifadhi taswira ya jambo ambalo nyayo au mkondo wake hauwezi kufuatwa, na hivyo kulitofautisha na “zisivyochunguzika.”
- source_word: ὁδοὶ
  choice: njia
  rationale: “Njia” linadumisha sitiari ya mienendo na matendo ya Mungu.
- source_word: αὐτοῦ
  choice: zake
  rationale: Kiwakilishi hiki kinamrejelea Mungu na kurudia umilikaji kama ilivyo katika Kigiriki.
theological_decisions:
- issue: Uhusiano wa “ya Mungu” na “utajiri na hekima na maarifa”
  choice: '“Ya Mungu” inaeleweka kurejelea nomino zote tatu: utajiri, hekima, na maarifa.'
  alternative: “Kina cha utajiri wa hekima na maarifa ya Mungu,” ambapo utajiri unaunganishwa kwa karibu zaidi na hekima na maarifa.
  rationale: Mpangilio wa Kigiriki unaruhusu miunganiko yote miwili. Matini kuu inachukua nomino zote tatu kuwa sifa au mali za Mungu, lakini tanbihi inahifadhi uwezekano mwingine bila kuamua zaidi ya ushahidi wa chanzo.
- issue: Kutofautisha ἀνεξεραύνητα na ἀνεξιχνίαστοι
  choice: Kutumia “zisivyochunguzika” kwa hukumu na “zisivyoweza kufuatiliwa” kwa njia.
  alternative: Kutafsiri zote mbili kwa maneno yanayokaribiana zaidi, kama “zisizoeleweka” au “zisizochunguzika.”
  rationale: 'Kigiriki kinatumia maneno mawili yanayohusiana lakini yenye taswira tofauti: kuchunguza na kufuatilia. Tofauti hiyo imehifadhiwa bila kuifanya kuwa tofauti ya kiufundi ya mafundisho.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye sauti ya heshima na mshangao wa ibada. “Lo” limetumiwa kwa ufupi wa kifasihi unaoeleweka; sentensi ya pili inatumia “Jinsi ... zisivyo-” ili kuhifadhi muundo wa mshangao. Msamiati ni wa sasa na wa kawaida bila kuondoa taswira za chanzo.
