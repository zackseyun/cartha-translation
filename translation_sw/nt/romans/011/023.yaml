id: ROM.11.23
reference: Romans 11:23
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: κἀκεῖνοι δέ, ἐὰν μὴ ⸀ἐπιμένωσι τῇ ἀπιστίᾳ, ἐγκεντρισθήσονται· δυνατὸς γάρ ⸂ἐστιν ὁ θεὸς⸃ πάλιν ἐγκεντρίσαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/023.yaml
  text: And even they[a], if they do not continue in unbelief, will be grafted in[b]; for God is able to graft them in again.
translation:
  language: sw
  text: Nao pia, wasipoendelea katika kutokuamini, watapandikizwa; kwa maana Mungu anaweza kuwapandikiza tena.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κἀκεῖνοι δέ
  choice: Nao pia
  rationale: Huendeleza hoja kwa utofautishaji hafifu na kuhifadhi nguvu ya nyongeza ya καί pamoja na rejeo la ἐκεῖνοι kwa matawi yaliyokatwa.
- source_word: ἐὰν μὴ ἐπιμένωσι
  choice: wasipoendelea
  rationale: Muundo wa sharti unaonyesha hali inayoweza kutimia baadaye, na kitenzi hiki huhifadhi wazo la kudumu au kuendelea katika hali fulani.
- source_word: τῇ ἀπιστίᾳ
  choice: katika kutokuamini
  rationale: Katika muktadha wa Waroma 11, neno hili hasa linamaanisha kutokuamini, kinyume cha kuamini, bila kulipanua kuwa ukosefu wa uaminifu kwa ujumla.
- source_word: ἐγκεντρισθήσονται
  choice: watapandikizwa
  rationale: Kauli ya kutendwa ya wakati ujao inadumisha sitiari ya kupandikiza tawi katika mzeituni; wazo la kurudishwa linaachwa lionyeshwe wazi na πάλιν baadaye.
- source_word: δυνατὸς γάρ ἐστιν ὁ θεὸς
  choice: kwa maana Mungu anaweza
  rationale: Ni Kiswahili cha kawaida na cha wazi kinachohifadhi sababu inayotolewa na msisitizo juu ya uwezo wa Mungu.
- source_word: πάλιν ἐγκεντρίσαι αὐτούς
  choice: kuwapandikiza tena
  rationale: “Tena” hutafsiri πάλιν wazi na kuonyesha urejesho bila kuingiza wazo hilo mapema katika kitenzi cha kwanza.
theological_decisions:
- issue: Maana ya ἀπιστία katika muktadha huu
  choice: kutokuamini
  alternative: kutokuwa waaminifu
  rationale: Hoja ya karibu katika Waroma 11 inatofautisha kuamini na kutokuamini kuhusiana na kubaki au kuingizwa katika mzeituni. Tafsiri hii haiamui zaidi ya kile kinachodaiwa na muktadha.
- issue: Kama urejesho uelezwe katika kitenzi cha kwanza cha kupandikiza
  choice: watapandikizwa
  alternative: watapandikizwa tena
  rationale: Kigiriki kinaweka πάλιν katika kishazi cha pili tu. Mpangilio huu unahifadhiwa, huku maana ya kurejeshwa ikielezwa wazi mwishoni.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. “Kupandikizwa” hudumisha sitiari ya kilimo bila maelezo ya ziada.
