  yaml_path: translation/nt/romans/011/032.yaml
  text: For God has shut up all into disobedience[c][b][a], so that he may show mercy to all.
translation:
  language: sw
  text: Kwa maana Mungu amewafungia[a] wote[c] katika kutotii[b], ili awarehemu wote[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “amewafungia ndani” au “amewazuia wote.”
    reason: lexical_alternative
  - marker: b
    text: “Kutotii” pia kunaweza kutafsiriwa “kutoamini” katika miktadha fulani, lakini hapa maana pana ya kukataa kutii inaelekea kufaa zaidi.
    reason: lexical_alternative
  - marker: c
    text: Kurudiwa kwa neno “wote” kunahifadhi maneno ya Paulo na hakupaswi kubanwa mapema; katika muktadha anazungumzia Wayahudi na watu wa mataifa pamoja.
    reason: alternative_reading
lexical_decisions:
- source_word: συνέκλεισεν
  choice: amewafungia
  rationale: Kitenzi συγκλείω humaanisha kufungia, kuweka ndani, au kuzuia pamoja. “Amewafungia” inadumisha sitiari halisi ya kuwafungia bila kuifanya iwe adhabu ya kifungo gerezani wala kuifafanua kupita kiasi.
- source_word: γὰρ
  choice: Kwa maana
  rationale: γάρ inaleta maelezo yanayounga mstari huu na hoja iliyotangulia; “Kwa maana” ni kiunganishi cha kawaida na chenye heshima katika Kiswahili.
- source_word: τοὺς πάντας
  choice: wote
  rationale: Kirai hiki kimerudiwa mara mbili. “Wote” kinahifadhi upana na ulinganifu wa maneno ya Paulo bila kuamua mapema upeo wake.
- source_word: εἰς ἀπείθειαν
  choice: katika kutotii
  rationale: ἀπείθεια lina wazo la kutotii au kukataa kutii, na wakati mwingine linaweza kumaanisha kutoamini. “Katika kutotii” linafuata muundo wa εἰς na kudumisha maana pana kuliko kutokuamini kiakili tu.
- source_word: ἵνα
  choice: ili
  rationale: ἵνα huonyesha kusudi au matokeo; “ili” ni ya kawaida na wazi katika Kiswahili cha sasa.
- source_word: ἐλεήσῃ
  choice: awarehemu
  rationale: ἐλεάω humaanisha kumrehemu mtu au kumwonyesha huruma. “Awarehemu” ni fupi, ya asili, na inadumisha tendo la Mungu katika hali ya kusudi baada ya ἵνα.
theological_decisions:
- issue: Upeo wa “wote” katika vishazi vyote viwili
  choice: Kutafsiri τοὺς πάντας kuwa “wote” mara zote mbili, bila kuubana wala kuupanua upeo wake katika tafsiri.
  alternative: “watu wote,” “kila mtu,” au “Wayahudi na watu wa mataifa”
  rationale: Kigiriki kinarudia kirai kilekile chenye upana katika vishazi vyote viwili. Muktadha unawahusu Wayahudi na watu wa mataifa pamoja, lakini tafsiri inapaswa kuhifadhi mvutano wa kiteolojia wa maneno hayo badala ya kuamua mjadala kuhusu wokovu wa wote au upeo mwingine.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inadumisha sitiari ya kufungia, marudio ya “wote,” na uhusiano wa kusudi kwa kutumia “ili,” huku ikibaki rahisi kueleweka kwa msomaji wa kawaida.
