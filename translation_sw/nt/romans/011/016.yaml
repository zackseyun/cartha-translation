base_translation:
  language: en
  yaml_path: translation/nt/romans/011/016.yaml
  text: If the firstfruits are holy[a], so is the whole batch of dough; and if the root is holy, so are the branches.
translation:
  language: sw
  text: Ikiwa malimbuko ni matakatifu, donge lote[a] pia ni takatifu; na ikiwa mzizi ni mtakatifu, matawi nayo ni matakatifu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mchanganyiko wa unga.” Neno la Kigiriki φύραμα linamaanisha donge au mchanganyiko wa unga uliokandwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπαρχὴ
  choice: sehemu ya kwanza ya unga
  rationale: Katika picha hii ya unga, usemi huu unaeleweka kwa urahisi kama sehemu ya kwanza inayotengwa kuwa toleo. Unahifadhi uhusiano kati ya sehemu ya kwanza na donge lote bila kutumia neno lisilo wazi kwa wasomaji wengi.
- source_word: ἁγία
  choice: takatifu / mtakatifu / matakatifu
  rationale: Neno “takatifu” linahifadhi dhana ya kibiblia bila kuamua kama utakatifu hapa ni wa agano, wa kuwekwa wakfu, au wa wokovu. Upatanisho wa kisarufi hubadilika kulingana na nomino ya Kiswahili.
- source_word: φύραμα
  choice: donge lote
  rationale: Neno hili linamaanisha kiasi au mchanganyiko wa unga uliokandwa. “Donge lote” ni picha ya kawaida na wazi katika Kiswahili, huku “lote” likidhihirisha ulinganisho na sehemu ya kwanza.
- source_word: ῥίζα
  choice: mzizi
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya mfano wa mmea.
- source_word: κλάδοι
  choice: matawi
  rationale: Ni neno la kawaida la Kiswahili na linaendana na mfano wa mzeituni katika muktadha unaofuata.
- source_word: εἰ δὲ ... καὶ ...; καὶ εἰ ... καὶ ...
  choice: Ikiwa ... pia ...; na ikiwa ... nayo ...
  rationale: Muundo huu unawasilisha masharti na ulinganifu wa Kigiriki kwa Kiswahili cha asili. Vitenzi na vivumishi vinatajwa wazi ili sentensi iwe rahisi kueleweka, bila kuongeza kiashiria cha wakati ambacho hakipo katika chanzo.
theological_decisions:
- issue: Maana ya utakatifu unaotoka kwa sehemu ya kwanza au mzizi na kuhusishwa na donge au matawi
  choice: Kutumia “takatifu” bila kufafanua aina au namna ya utakatifu huo
  alternative: Kusema “imewekwa wakfu” au kueleza kuwa ni utakatifu wa agano au wa wokovu
  rationale: Mstari unaonyesha uhusiano wa kiuwakilishi kati ya sehemu na kitu kizima, lakini hausemi wazi kama utakatifu huo ni wa agano, wa kuwekwa wakfu, au wa wokovu. Tafsiri haipaswi kutatua mvutano huo wa kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Marudio ya “ni takatifu” yamehifadhiwa ili mantiki ya sentensi iwe wazi; maumbo ya kivumishi yamepatana kisarufi na nomino husika.
