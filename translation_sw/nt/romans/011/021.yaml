  yaml_path: translation/nt/romans/011/021.yaml
  text: For if God did not spare the natural branches[a], neither will he spare you.
translation:
  language: sw
  text: Kwa maana, ikiwa Mungu hakuyahurumia matawi ya asili[a], hata wewe hatakuhurumia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “matawi ya kiasili”; kihalisi, “matawi kulingana na asili.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ γὰρ
  choice: Kwa maana, ikiwa
  rationale: Inaendeleza hoja kwa kiunganishi cha sababu γάρ na kuhifadhi sharti la εἰ kwa Kiswahili cha kawaida.
- source_word: ὁ θεὸς
  choice: Mungu
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja ya θεός kama kiima.
- source_word: τῶν κατὰ φύσιν κλάδων
  choice: matawi ya asili
  rationale: Inahifadhi sitiari ya matawi na maana ya κατὰ φύσιν, yaani yaliyo ya kiasili katika mzeituni unaozungumziwa, bila kumtaja Israeli moja kwa moja ndani ya tafsiri.
- source_word: οὐκ ἐφείσατο
  choice: hakuyahurumia
  rationale: Katika muktadha huu φείδομαι ni kutomhifadhi mtu na madhara; 'hakuyahurumia' ni usemi wa asili wa Kiswahili unaohifadhi ukali na ulinganifu wa vitenzi katika vifungu vyote viwili.
- source_word: οὐδὲ σοῦ φείσεται
  choice: hata wewe hatakuhurumia
  rationale: οὐδέ inaendeleza ukanushaji kwa msisitizo, na σοῦ ni nafsi ya pili umoja; 'wewe' huweka wazi kwamba onyo linaelekezwa kwa mtu mmoja anayewakilisha anayesemeshwa.
theological_decisions:
- issue: Mhusika anayewakilishwa na “matawi ya asili” katika sitiari ya mzeituni
  choice: Sitiari imehifadhiwa bila kumfafanua mhusika katika matini kuu.
  alternative: Kutafsiri wazi kuwa matawi hayo ni Israeli wa asili.
  rationale: Muktadha unaelekeza kwa Israeli, lakini Paulo hapa anatumia sitiari. Tafsiri haipaswi kuondoa sitiari au kuongeza ufafanuzi ambao hauko wazi katika maneno ya aya.
- issue: Uzito wa onyo linaloelekezwa kwa “wewe”
  choice: Onyo la moja kwa moja limehifadhiwa bila nyongeza za kimafundisho.
  alternative: Kulifafanua kwa mtazamo fulani kuhusu kudumu katika wokovu, kuanguka, au uteuzi wa mtu binafsi dhidi ya kundi.
  rationale: Kigiriki kinatoa onyo halisi kwa nafsi ya pili umoja, lakini hakitatui peke yake mijadala hiyo mipana ya kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Matawi ya asili' ni kifupi na cha kawaida; tanbihi huhifadhi muundo halisi zaidi wa Kigiriki. Umoja wa 'wewe' umewekwa wazi, na ulinganifu wa 'hakuyahurumia ... hatakuhurumia' umehifadhiwa.
