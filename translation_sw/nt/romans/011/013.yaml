  text: Ὑμῖν ⸀δὲ λέγω τοῖς ἔθνεσιν. ἐφ’ ὅσον μὲν ⸀οὖν εἰμι ἐγὼ ἐθνῶν ἀπόστολος, τὴν διακονίαν μου δοξάζω,
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/013.yaml
  text: I am speaking to you Gentiles[a]. Inasmuch, then, as I am an apostle to the Gentiles, I magnify my ministry[b],
translation:
  language: sw
  text: Ninawaambia ninyi, watu wa mataifa[a]. Basi, kwa kuwa mimi ni mtume kwa watu wa mataifa, naitukuza huduma yangu[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mataifa.” Neno la Kigiriki linaweza pia kutafsiriwa “mataifa”; hapa linamaanisha watu wasio Wayahudi. Vivyo hivyo katika sehemu inayofuata ya mstari huu.
    reason: lexical_alternative
  - marker: b
    text: Au, “naiheshimu sana huduma yangu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑμῖν δὲ λέγω τοῖς ἔθνεσιν
  choice: Lakini nasema nanyi, ninyi watu wa mataifa
  rationale: Muundo huu unahifadhi mpito wa δέ, usemi wa moja kwa moja wa λέγω, na walengwa waliofafanuliwa na τοῖς ἔθνεσιν. ‘Watu wa mataifa’ ni Kiswahili cha kawaida kinachoonyesha watu wasio Wayahudi bila kugeuza maana kuwa mataifa ya kisiasa.
- source_word: ἐφ’ ὅσον μὲν οὖν
  choice: Basi, kwa kuwa
  rationale: Katika muktadha huu kirai kinaanzisha msingi wa kauli ya Paulo, huku chembe μὲν οὖν zikionyesha mwendelezo na msisitizo mdogo. Kiswahili hiki ni cha asili na huhifadhi uhusiano wa kimantiki.
- source_word: εἰμι ἐγὼ ἐθνῶν ἀπόστολος
  choice: mimi ni mtume kwa watu wa mataifa
  rationale: ‘Mtume’ huhifadhi maana ya wajibu maalumu wa kitume, na ‘kwa watu wa mataifa’ huonyesha kwamba utume wake umeelekezwa kwao.
- source_word: τὴν διακονίαν μου
  choice: huduma yangu
  rationale: ‘Huduma’ huwasilisha kazi na wajibu wa Paulo bila kuifanya iwe cheo au shughuli ya kidhehebu.
- source_word: δοξάζω
  choice: naitukuza
  rationale: Kitenzi hiki huhifadhi wazo la kuipa huduma heshima na uzito. Tanbihi inatoa mbadala wa kimuktadha ‘naiheshimu sana’ ili kuzuia dhana kwamba Paulo anajitukuza mwenyewe.
theological_decisions:
- issue: Maana ya Paulo kuitukuza huduma yake
  choice: Paulo anaipa huduma yake heshima na uzito, si kujitukuza mwenyewe.
  alternative: Paulo anaiheshimu sana huduma yake.
  rationale: Yambwa ya δοξάζω ni ‘huduma yangu,’ na muktadha unaelekeza kwenye umuhimu wa utume huo katika kusudi la Mungu, si kujikweza kwa Paulo.
- issue: Rejeleo la ἔθνη / ἐθνῶν
  choice: watu wa mataifa
  alternative: Mataifa
  rationale: Katika Waroma 9–11, neno hilo huonyesha hasa watu wasio Wayahudi kwa kulinganishwa na Israeli. ‘Watu wa mataifa’ hudumisha tofauti hiyo bila kuashiria hasa dola za kisiasa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Watu wa mataifa’ limetumiwa badala ya istilahi nzito zaidi, na ‘naitukuza’ limehifadhi nguvu ya usemi wa Kigiriki huku tanbihi ikifafanua maana ya kimuktadha.
