  text: For the gifts and the calling of God are irrevocable[a].
translation:
  language: sw
  text: Kwa maana karama na mwito wa Mungu hazibatilishwi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Mungu hajutii karama zake wala mwito wake,” au “hazirudishwi.” Tafsiri za zamani wakati mwingine husema “bila majuto.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμεταμέλητα
  choice: havibatilishwi
  rationale: Kivumishi hiki humaanisha visivyosababisha majuto au visivyorudishwa. Katika muktadha wa karama na mwito wa Mungu, “havibatilishwi” linaeleza kwa Kiswahili cha kawaida kwamba Mungu havifuti wala kuviondoa, bila kupanua maana hadi kusema tu kwamba havibadiliki.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Kiunganishi hiki kinatoa sababu au ufafanuzi wa kauli iliyotangulia; “Kwa maana” huhifadhi uhusiano huo kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: τὰ χαρίσματα
  choice: karama
  rationale: χάρισμα ni zawadi inayotolewa kwa neema. “Karama” ni neno la kawaida katika Kiswahili cha kibiblia na huhifadhi wingi bila kuongeza ufafanuzi wa kimadhehebu.
- source_word: ἡ κλῆσις
  choice: mwito
  rationale: “Mwito” huhifadhi uzito wa κλῆσις kama tendo la Mungu la kuita, bila kulazimisha tafsiri kuhusu namna au matokeo ya mwito huo.
- source_word: τοῦ θεοῦ
  choice: wa Mungu
  rationale: Muundo huu humtambulisha Mungu kuwa chanzo au mwenye karama na mwito; “wa Mungu” huhifadhi upana wa uhusiano wa hali ya kumiliki katika Kigiriki.
theological_decisions:
- issue: Upeo wa “karama na mwito wa Mungu” katika muktadha
  choice: Kuacha kirai hicho bila kubainisha katika tafsiri ikiwa kinahusu hasa mapendeleo na mwito wa Israeli au kanuni pana kuhusu karama na mwito wa Mungu.
  alternative: Kukifafanua moja kwa moja kuwa kinahusu Israeli katika Waroma 9–11, au kukifanya kanuni ya jumla kuhusu waamini wote.
  rationale: Muktadha wa karibu unahusu sana Israeli, lakini mstari wenyewe hautaji wazi mhusika wa karama na mwito. Tafsiri inapaswa kuhifadhi usemi wa Paulo na mvutano wake wa kiteolojia.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Upatanisho wa kisarufi wa “havibatilishwi” unafuata nomino mbili za ngeli ya I-ZI: karama na mwito.'
