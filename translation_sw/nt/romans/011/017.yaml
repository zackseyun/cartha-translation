  text: Εἰ δέ τινες τῶν κλάδων ἐξεκλάσθησαν, σὺ δὲ ἀγριέλαιος ὢν ἐνεκεντρίσθης ἐν αὐτοῖς καὶ συγκοινωνὸς τῆς ⸀ῥίζης τῆς πιότητος τῆς ἐλαίας ἐγένου,
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/017.yaml
  text: But if some of the branches were broken off[a], and you, although being a wild olive tree, were grafted in among them and became a fellow sharer in the root, in the richness of the olive tree[b],
translation:
  language: sw
  text: Lakini ikiwa baadhi ya matawi yalivunjwa, nawe, ingawa wewe ni mzeituni wa mwitu, ulipandikizwa kati yao[a] na ukawa mshiriki pamoja nao katika mzizi, katika utajiri wa mzeituni[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ulipandikizwa kati ya matawi hayo.”
    reason: lexical_alternative
  - marker: b
    text: Au, “ukawa mshiriki wa mzizi na utajiri wa mzeituni”; kijadi, “mzizi na unono wa mzeituni.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ δέ
  choice: Lakini ikiwa
  rationale: Huhifadhi sharti linaloletwa na εἰ pamoja na tofauti nyepesi ya δέ kwa Kiswahili cha kawaida.
- source_word: τινες τῶν κλάδων
  choice: baadhi ya matawi
  rationale: Huwakilisha τινες na hali ya sehemu katika τῶν κλάδων kwa usemi wa kawaida na sahihi.
- source_word: ἐξεκλάσθησαν
  choice: yalivunjwa
  rationale: Kitenzi hiki cha kutendwa huhifadhi picha ya matawi kuondolewa kwa kuvunjwa, badala ya tafsiri pana ya kukatwa.
- source_word: ἀγριέλαιος ὢν
  choice: ingawa ulikuwa mzeituni wa mwituni
  rationale: Huhifadhi maana ya kukubali hali inayotofautiana na tendo linalofuata, pamoja na sitiari halisi ya mzeituni wa mwituni.
- source_word: ἐνεκεντρίσθης ἐν αὐτοῖς
  choice: ulipandikizwa kati yao
  rationale: ‘Kupandikizwa’ ni istilahi inayoeleweka ya kuingiza chipukizi au tawi katika mti mwingine; ‘kati yao’ hurejelea matawi yaliyobaki.
- source_word: συγκοινωνὸς
  choice: mshiriki pamoja nao
  rationale: Hutoa wazi wazo la ushirika wa pamoja lililo katika kiambishi συν-, bila kutumia neno la kale au lisilo la kawaida.
- source_word: τῆς ῥίζης τῆς πιότητος τῆς ἐλαίας
  choice: katika mzizi, katika utajiri wa mzeituni
  rationale: Huhifadhi msongamano na mvutano wa viambajengo vya Kigiriki huku ‘utajiri’ ukieleza wingi wenye lishe wa πιότης kwa lugha ya sasa.
- source_word: ἐγένου
  choice: ukawa
  rationale: Huonyesha kuingia katika hali mpya kwa njia fupi na ya kawaida katika Kiswahili.
theological_decisions:
- issue: Utambulisho wa ἀγριέλαιος katika sitiari
  choice: mzeituni wa mwituni
  alternative: chipukizi la mzeituni wa mwituni; mtu wa Mataifa
  rationale: Tafsiri inadumisha sitiari ya kilimo ambayo hoja ya Paulo inaitegemea, bila kumtambulisha mhusika moja kwa moja kwa ufafanuzi wa kitheolojia.
- issue: Uhusiano wa mzizi na utajiri
  choice: ukawa mshiriki pamoja nao katika mzizi, katika utajiri wa mzeituni
  alternative: ukawa mshiriki wa mzizi wenye rutuba wa mzeituni; ukawa mshiriki wa mzizi na unono wa mzeituni
  rationale: Kigiriki kina mfululizo wenye kubana wa viambajengo vya umilikaji. Muundo uliochaguliwa hauamui kimya-kimya kwamba ‘utajiri’ ni kivumishi cha mzizi wala kwamba mzizi na utajiri ni vitu viwili vilivyo sawa kabisa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Sentensi imeachwa ikiwa na koma mwishoni kwa sababu mstari huu unaendelea moja kwa moja katika aya inayofuata. Alama [a] imewekwa baada ya kishazi kinachohusika na mbadala wake ili tanbihi isomeke kwa uwazi.
