  text: Or who has first given to him[b][a], and it will be repaid to him?
translation:
  language: sw
  text: Au ni nani aliyempa kwanza[a], naye atalipwa?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliyempa kabla.”
    reason: lexical_alternative
  - marker: b
    text: Maana yake ni kwamba hakuna mtu aliyempa Mungu kwa namna ambayo ingemfanya Mungu awe na deni la kumlipa.
    reason: cross_reference
lexical_decisions:
- source_word: ἢ
  choice: Au
  rationale: Huanzisha swali jingine la balagha katika mfululizo; “Au” ni kiunganishi kifupi na cha kawaida katika Kiswahili.
- source_word: τίς
  choice: ni nani
  rationale: Kiwakilishi hiki cha kuuliza kinamrejelea mtu, na “ni nani” huunda swali la kawaida la Kiswahili.
- source_word: προέδωκεν
  choice: aliyempa kwanza
  rationale: Kitenzi hiki kina wazo la kumpa mtu kabla au kuwa wa kwanza kumpa. “Aliyempa kwanza” huhifadhi wazo la kutangulia katika kutoa bila kufanya sentensi kuwa nzito.
- source_word: αὐτῷ
  choice: -m- katika “aliyempa”
  rationale: Kiambishi cha yambwa humrejelea Mungu kutokana na muktadha, huku kikihifadhi matumizi ya kiwakilishi badala ya kuingiza jina “Mungu” katika mstari.
- source_word: καὶ
  choice: na- katika “naye”
  rationale: Huunganisha vifungu viwili kama ilivyo katika Kigiriki na wakati huohuo huonyesha kwamba mhusika wa kifungu cha pili ni yule aliyedaiwa kutoa kwanza.
- source_word: ἀνταποδοθήσεται
  choice: atalipwa
  rationale: Kauli tendwa ya wakati ujao ina maana ya kulipwa au kurudishiwa kwa badala. “Atalipwa” ni ya kawaida na hudumisha wazo la malipo ya deni bila kumtaja anayelipa.
- source_word: αὐτῷ
  choice: -ye katika “naye” na kiima cha “atalipwa”
  rationale: Kiswahili huwasilisha mpokeaji wa malipo kwa kawaida kama kiima cha kauli tendwa; muundo huu unamrejelea mtu yuleyule na kutokeza ulinganifu wa swali.
theological_decisions:
- issue: Mrejelewa wa αὐτῷ ya kwanza
  choice: Kiwakilishi kimedumishwa katika kiambishi “-m-,” kikimrejelea Mungu kwa mujibu wa muktadha.
  alternative: Kutaja wazi “Mungu” kwa ajili ya ufafanuzi.
  rationale: Kigiriki kinatumia kiwakilishi, si jina “Mungu.” Kukidumisha huacha muundo wa matini intact huku muktadha ukifanya mrejelewa aeleweke.
- issue: Wazo la προέδωκεν kuhusu kumweka Mungu chini ya deni
  choice: Neno “kwanza” limedumishwa ili kuonyesha kutoa kabla ya Mungu na hivyo kudai malipo.
  alternative: Kutafsiri “aliyempa” bila “kwanza.”
  rationale: Swali la balagha linakana kwamba mtu yeyote alitangulia kumpa Mungu kwa namna ambayo ingemfanya Mungu awe na wajibu wa kumlipa. “Kwanza” huhifadhi nguvu hiyo bila kuiongeza moja kwa moja ndani ya matini.
- issue: Kauli tendwa ya ἀνταποδοθήσεται
  choice: Imetafsiriwa “atalipwa,” bila kumtaja wazi Mungu kuwa ndiye anayelipa.
  alternative: “Naye atarudishiwa hicho” au “Mungu atamlipa.”
  rationale: Muundo wa Kiswahili ni wa kawaida na huhifadhi kauli tendwa pamoja na wazo la malipo, bila kuongeza kiima kisichotajwa katika Kigiriki.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa msomaji wa kawaida. Muundo wa swali la balagha na kiwakilishi kinachomrejelea Mungu vimedumishwa; “atalipwa” ni wa asili zaidi katika Kiswahili kuliko kauli isiyo na kiima kama “kitalipwa kwake.”
