  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ⸀καθὼς γέγραπται· Ἔδωκεν αὐτοῖς ὁ θεὸς πνεῦμα κατανύξεως, ὀφθαλμοὺς τοῦ μὴ βλέπειν καὶ ὦτα τοῦ μὴ ἀκούειν, ἕως τῆς σήμερον ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/008.yaml
  text: 'just as it is written: “God gave them a spirit of stupor[a], eyes not to see and ears not to hear, until this very day.”'
translation:
  language: sw
  text: 'Kama ilivyoandikwa: “Mungu aliwapa roho ya ganzi[a], macho yasione na masikio yasisikie, hadi leo hii.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “roho ya usingizi mzito.” Kirai hiki kinaakisi Isaya 29:10, ingawa neno la Kigiriki lililotumiwa hapa lina maana ya hali ya ganzi, butwaa, au kufifishwa kwa ufahamu.
    reason: alternative_reading
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: kama ilivyoandikwa
  rationale: Ni fomula ya kawaida ya kutambulisha nukuu ya Maandiko; inawasilisha καθώς kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: Ἔδωκεν αὐτοῖς ὁ θεὸς
  choice: Mungu aliwapa
  rationale: Kitenzi cha wakati uliopita na Mungu kama mtendaji vimehifadhiwa moja kwa moja bila kugeuza tendo hilo kuwa kuruhusu tu.
- source_word: πνεῦμα κατανύξεως
  choice: roho ya butwaa
  rationale: ‘Butwaa’ huonyesha hali ya kupigwa na ganzi ya fahamu au kutoweza kuitikia ipasavyo, na hivyo kukaribia maana ya κατάνυξις kuliko ‘usingizi’ pekee. ‘Roho’ inahifadhi πνεῦμα na pia utata wa kirai cha Kigiriki.
- source_word: ὀφθαλμοὺς τοῦ μὴ βλέπειν
  choice: macho yasione
  rationale: Muundo mfupi wa Kiswahili wenye hali tegemezi unahifadhi mtindo wa kinukuu na uwezekano wa kusudi au matokeo uliomo katika τοῦ μὴ pamoja na kitenzi-jina.
- source_word: ὦτα τοῦ μὴ ἀκούειν
  choice: masikio yasisikie
  rationale: Unadumisha ulinganifu na ‘macho yasione’ na maana ya msingi ya ἀκούω, yaani kusikia.
- source_word: ἕως τῆς σήμερον ἡμέρας
  choice: hadi leo hii
  rationale: Ni usemi wa asili wa Kiswahili unaohifadhi mpaka wa wakati pamoja na msisitizo wa ‘siku hii ya leo.’
theological_decisions:
- issue: Utendaji wa Mungu katika kufanya watu wasiweze kuitikia kiroho
  choice: Mungu aliwapa roho ya butwaa
  alternative: Mungu aliwaruhusu wawe na roho ya butwaa
  rationale: Kigiriki kinamtaja Mungu waziwazi kuwa mtendaji wa Ἔδωκεν. Tafsiri hailegezi hilo kuwa ruhusa tu, wala haiongezi mfumo wa kiteolojia usiotajwa na mstari.
- issue: Kusudi au matokeo katika τοῦ μὴ + infinitive
  choice: macho yasione na masikio yasisikie
  alternative: macho ambayo hayaoni na masikio ambayo hayasikii
  rationale: Hali tegemezi inaacha wazi mvutano wa kisarufi kati ya kusudi na matokeo, badala ya kuufanya kuwa maelezo ya hali tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko mfupi na wa heshima unaofaa nukuu ya Maandiko. ‘Hadi leo hii’ ni ya sasa na ya kawaida bila kupoteza msisitizo; ‘butwaa’ ni neno linaloeleweka kwa wasomaji wa kawaida huku tanbihi ikihifadhi mwangwi wa ‘usingizi mzito.’
