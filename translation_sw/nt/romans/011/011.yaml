base_translation:
  language: en
  yaml_path: translation/nt/romans/011/011.yaml
  text: So I say[a], they did not stumble so as to fall, did they? May it never be! Rather, by their trespass salvation has come to the Gentiles[d][c][b], to make them jealous.
translation:
  language: sw
  text: 'Basi, nasema: Hawakujikwaa ili waanguke, sivyo?[a] La hasha! Bali, kwa kosa lao[b] wokovu umewafikia watu wa Mataifa[c], ili kuwatia wivu.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ili wapate kuanguka.” Kigiriki hutofautisha “kujikwaa” na “kuanguka,” na swali hili la balagha linatarajia jibu la “hapana.”
    reason: lexical_alternative
  - marker: b
    text: Au “kwa uasi wao.”
    reason: lexical_alternative
  - marker: c
    text: Kigiriki ni “mataifa”; katika muktadha huu maana yake ni watu wasio Wayahudi.
    reason: lexical_alternative
  - marker: d
    text: Au “ili kuwachochea wivu”; huenda maana ikatia ndani kuwafanya watamani wokovu huohuo.
    reason: alternative_reading
lexical_decisions:
- source_word: Λέγω οὖν
  choice: Basi nasema
  rationale: Kauli hii inaanzisha swali la balagha na kuhifadhi nguvu ya hitimisho ya οὖν kwa Kiswahili cha kawaida.
- source_word: μὴ ἔπταισαν
  choice: Hawakujikwaa ... sivyo?
  rationale: Muundo wa swali la balagha wenye μή unatarajia jibu hasi; swali mkia la Kiswahili linaonyesha matarajio hayo.
- source_word: ἵνα πέσωσιν
  choice: ili waanguke
  rationale: Huhifadhi uhusiano wa kusudi au matokeo bila kuongeza wazo la kuanguka kabisa au pasipo kurejea, na hutofautisha kujikwaa na kuanguka.
- source_word: μὴ γένοιτο
  choice: La hasha!
  rationale: Ni kanusho kali, la sasa na lenye hadhi, linalowasilisha mkazo wa kauli ya Paulo.
- source_word: τῷ αὐτῶν παραπτώματι
  choice: kwa kosa lao
  rationale: ‘Kosa’ linaeleza hatua potovu au uasi wa kimaadili kwa lugha inayoeleweka; ‘kwa’ huhifadhi maana ya njia au sababu.
- source_word: ἡ σωτηρία
  choice: wokovu
  rationale: Hili ndilo neno la kawaida lenye uzito wa kisoteriolojia katika muktadha wa Waroma.
- source_word: τοῖς ἔθνεσιν
  choice: watu wa mataifa
  rationale: Katika utofautishaji wa Wayahudi na wasio Wayahudi, kifungu hiki kinaeleweka kwa urahisi kuwa watu wasio Wayahudi huku kikihifadhi taswira ya ‘mataifa.’
- source_word: εἰς τὸ παραζηλῶσαι αὐτούς
  choice: ili kuwafanya wawe na wivu
  rationale: Huhifadhi kusudi au matokeo na maana ya msingi ya kuamsha wivu bila kuamua kimya kimya kama wivu huo ni hasi tu au unachochea kuiga.
theological_decisions:
- issue: Iwapo kujikwaa kwa Israeli ni anguko la mwisho lisiloweza kurekebishwa
  choice: Kujikwaa na kuanguka yametafsiriwa kwa vitenzi tofauti, bila kuongeza ‘kabisa’ au ‘bila matumaini.’
  alternative: Kufafanua kuwa walianguka kabisa, au kwamba hawakuanguka pasipo uwezekano wa kurejea.
  rationale: Nakala ya Kigiriki inatofautisha πταίω na πίπτω na inakanusha swali hilo kwa nguvu; tafsiri inahifadhi mvutano huo bila kuufumbua kidhehebu.
- issue: Maana ya lugha ya wivu katika mpango wa wokovu
  choice: ‘Kuwafanya wawe na wivu’
  alternative: ‘Kuwachochea watamani wokovu huohuo’ au ‘kuwachokoza kwa wivu’
  rationale: παραζηλόω inaweza kueleza wivu na pia msukumo wa kutaka baraka ileile. Maandishi makuu yanahifadhi maana pana; tanbihi inaeleza uwezekano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘La hasha!’ linahifadhi kanusho kali la Paulo; ‘watu wa mataifa’ ni wazi zaidi kwa wasomaji wa kawaida kuliko istilahi nzito, huku tanbihi ikifafanua maana ya kimuktadha.
