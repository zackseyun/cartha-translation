  text: οὐκ ἀπώσατο ὁ θεὸς τὸν λαὸν αὐτοῦ ὃν προέγνω. ἢ οὐκ οἴδατε ἐν Ἠλίᾳ τί λέγει ἡ γραφή, ὡς ἐντυγχάνει τῷ θεῷ κατὰ τοῦ ⸀Ἰσραήλ;
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/002.yaml
  text: God has not rejected his people[a], whom he foreknew. Or do you not know what the Scripture says in the passage about Elijah[c][b], how he appeals to God against Israel?
translation:
  language: sw
  text: Mungu hakuwakataa watu wake aliowajua tangu awali.[a] Au hamjui Maandiko yanasema nini katika sehemu inayomhusu Eliya,[b] jinsi Eliya anavyomwomba Mungu dhidi ya Israeli?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliowajua kabla.” Wengine hulielewa neno la Kigiriki kwa maana yenye nguvu zaidi ya “aliowachagua tangu awali,” lakini tafsiri hapa haiondoi mvutano huo wa kitheolojia.
    reason: alternative_reading
  - marker: b
    text: Kigiriki, “katika Eliya,” yaani katika sehemu ya Maandiko inayomhusu Eliya.
    reason: lexical_alternative
  - marker: c
    text: Au, “jinsi anavyomsihi Mungu dhidi ya Israeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπώσατο
  choice: hakuwakataa
  rationale: Kitenzi hiki katika muktadha huu humaanisha kukataa au kutupilia mbali. ‘Hakuwakataa’ ni Kiswahili cha kawaida na hudumisha ukanushaji wa Paulo kwamba Mungu amewakataa watu wake.
- source_word: λαὸν αὐτοῦ
  choice: watu wake
  rationale: Huhifadhi maana ya watu walio wake Mungu bila kuongeza ‘Israeli’ katika kishazi cha kwanza, kwa kuwa jina hilo linatajwa wazi mwishoni mwa aya.
- source_word: προέγνω
  choice: aliowajua tangu awali
  rationale: Hutoa maana ya msingi ya kuwajua kabla au tangu awali, bila kuingiza moja kwa moja tafsiri yenye nguvu zaidi ya ‘aliowachagua tangu awali.’
- source_word: ἢ οὐκ οἴδατε
  choice: Au hamjui
  rationale: Ni namna ya asili ya Kiswahili ya kuanzisha swali la balagha la Paulo.
- source_word: ἐν Ἠλίᾳ
  choice: katika habari ya Eliya
  rationale: Kirai hiki ni nahau inayorejelea sehemu ya Maandiko inayomhusu Eliya, si kuwa ndani ya Eliya.
- source_word: ἡ γραφή
  choice: Maandiko
  rationale: Katika matumizi ya Paulo, neno hili hurejelea Maandiko matakatifu; wingi ‘Maandiko’ ni matumizi ya kawaida na yanayoeleweka katika Kiswahili.
- source_word: ὡς ἐντυγχάνει τῷ θεῷ
  choice: jinsi anavyomwomba Mungu
  rationale: Kitenzi kinaweza kumaanisha kuomba, kusihi, au kutoa ombi. ‘Anavyomwomba Mungu’ kinafaa pamoja na kirai kinachofuata, ‘dhidi ya Israeli,’ bila kudokeza maombezi yenye kuwatakia mema.
- source_word: κατὰ τοῦ Ἰσραήλ
  choice: dhidi ya Israeli
  rationale: κατά pamoja na hali ya umilikaji hapa ina maana ya kupinga; jina la Israeli limehifadhiwa.
theological_decisions:
- issue: Maana ya προέγνω kuhusiana na uchaguzi wa Mungu
  choice: aliowajua tangu awali
  alternative: aliowajua kabla; aliowapenda tangu awali; aliowachagua tangu awali
  rationale: Tafsiri hii huhifadhi maana ya kileksika na mvutano wa kitheolojia bila kuamua kwamba kitenzi chenyewe lazima kimaanishe uchaguzi wa awali.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Katika habari ya Eliya’ imechaguliwa badala ya tafsiri ya neno kwa neno ‘katika Eliya,’ ambayo ingekuwa tata kwa msomaji wa kawaida.
