  text: ἐρεῖς οὖν· Ἐξεκλάσθησαν κλάδοι ἵνα ἐγὼ ἐγκεντρισθῶ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/019.yaml
  text: You will say then, “Branches were broken off so that I might be grafted in.”
translation:
  language: sw
  text: Basi utasema, “Matawi yalivunjwa ili mimi nipandikizwe.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐρεῖς
  choice: utasema
  rationale: Ni kitenzi cha wakati ujao, nafsi ya pili umoja; kinadumisha usemi wa moja kwa moja kwa msemaji anayefikiriwa katika hoja ya Paulo.
- source_word: οὖν
  choice: basi
  rationale: Kiunganishi hiki kinaonyesha hitimisho au hatua inayofuata katika hoja; “basi” ni Kiswahili cha kawaida na chenye heshima katika muktadha huu.
- source_word: Ἐξεκλάσθησαν
  choice: yalivunjwa
  rationale: Umbo la kutendwa linahifadhi picha ya matawi kuondolewa kwa kuvunjwa katika mfano wa mzeituni.
- source_word: κλάδοι
  choice: matawi
  rationale: Tafsiri ya moja kwa moja inayodumisha mfano wa mzeituni.
- source_word: ἵνα
  choice: ili
  rationale: Huanzisha kusudi au matokeo yanayodaiwa na msemaji; “ili” ni ya asili na haiongezi ufafanuzi wa kitheolojia.
- source_word: ἐγὼ
  choice: mimi
  rationale: Kiwakilishi kimetajwa wazi na kwa mkazo katika Kigiriki; “mimi” kinahifadhi mkazo huo.
- source_word: ἐγκεντρισθῶ
  choice: nipandikizwe
  rationale: Umbo la kutendwa linadumishwa. Katika muktadha wa mti, “kupandikizwa” ni istilahi ya kawaida ya kuingiza tawi katika mti mwingine.
theological_decisions:
- issue: Kumtambulisha msemaji kuwa ni mpinzani au mshiriki wa mazungumzo anayefikiriwa
  choice: 'Kudumisha nafsi ya pili ya moja kwa moja: “utasema”'
  alternative: “Mtu anaweza kusema” au “huenda ukasema”
  rationale: Kigiriki kinasema moja kwa moja “utasema”; maelezo kwamba huyu ni msemaji anayefikiriwa yanaeleweka katika muktadha na hayapaswi kuongezwa ndani ya aya.
- issue: Kufanya kishazi cha kusudi kiwe tamko la wazi kuhusu nia ya Mungu
  choice: “ili mimi nipandikizwe”
  alternative: “kusudi la Mungu lilikuwa mimi nipandikizwe”
  rationale: Aya inawasilisha dai la msemaji katika hoja, si lazima uthibitisho wa Paulo kuhusu nia ya Mungu; tafsiri inadumisha mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Kupandikizwa” hutumika kwa tawi kuunganishwa na mti na kinaeleweka ndani ya mfano wa kilimo. Hakuna tanbihi zinazohitajika.
