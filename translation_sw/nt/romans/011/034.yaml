  text: Τίς γὰρ ἔγνω νοῦν κυρίου; ἢ τίς σύμβουλος αὐτοῦ ἐγένετο;
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/034.yaml
  text: For who has known the mind of the Lord? Or who has become his counselor?[a]
translation:
  language: sw
  text: Kwa maana, ni nani aliyeijua nia ya Bwana? Au ni nani aliyekuwa mshauri wake?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Paulo anaakisi Isaya 40:13, ambapo matini ya Kigiriki vilevile huuliza ni nani aliyeijua nia ya Bwana au aliyekuwa mshauri wake.
    reason: cross_reference
lexical_decisions:
- source_word: Τίς
  choice: ni nani
  rationale: Kiwakilishi cha kuuliza kinachoanzisha swali la balagha; “ni nani” ni Kiswahili cha kawaida na hudumisha nguvu ya swali.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Huunganisha mstari huu na hoja iliyotangulia kwa kutoa msingi au maelezo, bila kufafanua zaidi ya Kigiriki.
- source_word: ἔγνω
  choice: aliyeijua
  rationale: Kitenzi γινώσκω hapa kinamaanisha kujua. Muundo huu wa Kiswahili unafaa katika swali la balagha na hauongezi maana ya ‘kuelewa’ isiyoelezwa wazi.
- source_word: νοῦν
  choice: nia
  rationale: Katika muktadha huu νοῦς yahusu fikira, kusudi, au mtazamo wa ndani. “Nia” ni ya asili katika Kiswahili na huwasilisha wazo la kusudi la Bwana bila kulifanya kuwa uwezo wa kiakili pekee.
- source_word: κυρίου
  choice: Bwana
  rationale: Hufuata maana ya κύριος katika maandishi ya Agano Jipya na mwangwi wake wa Isaya bila kuingiza moja kwa moja jina la Mungu katika matini kuu.
- source_word: ἢ
  choice: Au
  rationale: Hudumisha kiunganishi cha kutenganisha na muundo sambamba wa maswali mawili ya balagha.
- source_word: σύμβουλος
  choice: mshauri
  rationale: Ni neno la kawaida, lenye hadhi, kwa mtu anayetoa shauri; ni sawa moja kwa moja na maana ya nomino ya Kigiriki.
- source_word: αὐτοῦ
  choice: wake
  rationale: Kiwakilishi milikishi cha kawaida kinachorejelea Bwana na kuonyesha uhusiano unaoelezwa na hali ya umilikishi ya Kigiriki.
- source_word: ἐγένετο
  choice: aliyekuwa
  rationale: Katika Kiswahili, “aliyekuwa mshauri wake” huonyesha kwa kawaida mtu aliyefikia au kushika nafasi hiyo. Tafsiri “aliyekuwa” ni nyepesi kuliko “aliyefanyika” huku ikihifadhi dai la swali la balagha.
theological_decisions:
- issue: Anayerejelewa na “Bwana” katika nukuu yenye mwangwi wa Isaya
  choice: Imetafsiriwa “Bwana” bila kuibana maana zaidi ya matini; katika muktadha inamrejelea Mungu.
  alternative: Kutumia umbo linalowakilisha wazi zaidi jina la Mungu kwa msingi wa Isaya 40:13.
  rationale: Matini ya Kigiriki ina κυρίου, na Paulo anaakisi mapokeo ya Kigiriki ya Isaya. “Bwana” huhifadhi maneno ya Agano Jipya na uzito wa kidini bila kuingiza ufafanuzi wa ziada katika matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa maswali ya balagha na mwangwi wa Maandiko umehifadhiwa; “nia ya Bwana” ni ya asili kuliko “akili ya Bwana” katika muktadha huu na hubeba maana ya fikira au kusudi.
