  text: καὶ αὕτη αὐτοῖς ἡ παρ’ ἐμοῦ διαθήκη, ὅταν ἀφέλωμαι τὰς ἁμαρτίας αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/027.yaml
  text: And this will be my covenant with them[a], when I take away their sins.
translation:
  language: sw
  text: Na hili ndilo litakuwa agano langu nao[a], nitakapoondoa dhambi zao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya karibu zaidi na muundo wa Kigiriki, “agano litokalo kwangu kwao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διαθήκη
  choice: agano
  rationale: Katika muktadha wa Paulo na dondoo la Maandiko, neno hili linamaanisha ahadi ya Mungu yenye kumfunga; “agano” huhifadhi uzito huo na mwangwi wa Agano la Kale.
- source_word: ἡ παρ’ ἐμοῦ διαθήκη
  choice: agano langu
  rationale: Ingawa muundo huo unaweza kutafsiriwa kihalisi kuwa “agano litokalo kwangu,” Kiswahili cha kawaida na fasaha hutumia “agano langu” kuonyesha kuwa chanzo chake ni Mungu.
- source_word: αὐτοῖς
  choice: nao
  rationale: Kisarufi ni “kwao,” lakini katika Kiswahili agano hufanywa “na” watu; “nao” huwasilisha uhusiano wa agano kwa kawaida bila kupoteza walengwa wake.
- source_word: ὅταν
  choice: nitakapo-
  rationale: Kiambishi hiki cha wakati kinaonyesha wakati ambapo ahadi itatimizwa, si matukio yanayojirudia bila kikomo.
- source_word: ἀφέλωμαι
  choice: nitaondoa
  rationale: “Kuondoa” ni Kiswahili cha kawaida kinachoeleza kuondolewa kwa dhambi na kuhifadhi maana ya kitenzi cha Kigiriki.
- source_word: ἁμαρτίας
  choice: dhambi
  rationale: “Dhambi” ndilo neno la kawaida la Kiswahili kwa dhana hii ya kimaadili na kitheolojia; umbo lake linaweza kutumiwa kwa maana ya wingi kulingana na muktadha.
- source_word: καὶ αὕτη
  choice: Na hili ndilo litakuwa
  rationale: Kifungu cha Kigiriki hakina kitenzi kilichoandikwa wazi, lakini muktadha wa ahadi ya kinabii unaruhusu kukamilisha kwa “litakuwa,” huku “ndilo” likihifadhi msisitizo wa αὕτη.
theological_decisions:
- issue: Maana ya διαθήκη katika dondoo la Paulo la ahadi ya kinabii
  choice: agano
  alternative: wasia
  rationale: “Agano” huhifadhi muktadha wa ahadi ya Mungu kwa Israeli na huepuka kuingiza maana ya hati ya mwisho ya urithi.
- issue: Nguvu ya wakati katika ὅταν ἀφέλωμαι
  choice: nitakapoondoa dhambi zao
  alternative: kila nitakapoondoa dhambi zao
  rationale: Muktadha unaeleza utimilifu wa ahadi katika historia ya wokovu, wala si tendo linalorudiwa mara nyingi; tafsiri hii huhifadhi uhakika wa kinabii bila kubainisha wakati zaidi ya maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, fasaha na chenye hadhi. “Nao” ni ya kawaida katika usemi wa kufanya agano na watu; tanbihi huhifadhi muundo usio wa kawaida wa Kigiriki unaosisitiza chanzo cha agano.
