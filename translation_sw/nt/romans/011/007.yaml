  text: τί οὖν; ὃ ἐπιζητεῖ Ἰσραήλ, τοῦτο οὐκ ἐπέτυχεν, ἡ δὲ ἐκλογὴ ἐπέτυχεν· οἱ δὲ λοιποὶ ἐπωρώθησαν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/007.yaml
  text: What then? Israel did not obtain what it seeks[a], but the elect obtained it, and the rest were hardened[b],
translation:
  language: sw
  text: Basi, tuseme nini? Israeli haikupata kile inachokitafuta, lakini wateule[a] walikipata; nao wengine walifanywa wagumu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uteuzi ulipata kile hicho.” Neno la Kigiriki kwa maana halisi ni “uteuzi” au “chaguo,” lakini hapa yaelekea linawakilisha watu waliochaguliwa.
    reason: lexical_alternative
  - marker: b
    text: Au, “walifanywa kuwa sugu.” Kitenzi hiki kinaweza kumaanisha kufanywa wagumu au kutokuwa na hisia za kiroho.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί οὖν
  choice: Basi, tuseme nini?
  rationale: Hutoa kwa Kiswahili cha kawaida nguvu ya swali la kimantiki linalotanguliza hitimisho kutokana na hoja iliyotangulia.
- source_word: ὃ ἐπιζητεῖ Ἰσραήλ
  choice: kile inachokitafuta Israeli
  rationale: Kitenzi cha wakati uliopo kinaonyesha utafutaji unaoendelea; Israeli inaeleweka hapa kwa maana ya pamoja.
- source_word: τοῦτο οὐκ ἐπέτυχεν
  choice: haikupata
  rationale: ‘Kupata’ huonyesha kufikia kitu kilichotafutwa na huruhusu urudiaji wa kitenzi katika kishazi kinachofuata.
- source_word: ἡ δὲ ἐκλογὴ
  choice: wateule
  rationale: Ingawa nomino hiyo kihalisi ni ‘uteuzi,’ hapa inaonekana kuwakilisha watu walioteuliwa, wanaotofautishwa na ‘wengine.’
- source_word: ἐπέτυχεν
  choice: walikipata
  rationale: Hurudia maana ya kitenzi kilichotangulia na kiambishi ‘-ki-’ hurejelea kile kilichotafutwa.
- source_word: οἱ δὲ λοιποὶ
  choice: nao wengine
  rationale: Huwataja waliobaki kwa kulinganisha na wateule kwa lugha ya asili na iliyo wazi.
- source_word: ἐπωρώθησαν
  choice: walifanywa wagumu
  rationale: Huhifadhi hali ya kutendwa na sitiari ya ugumu bila kutaja mtendaji ambaye Kigiriki hakumtaji.
theological_decisions:
- issue: Maana ya ἡ ἐκλογὴ
  choice: wateule
  alternative: uteuzi
  rationale: Muktadha unatofautisha kundi la watu na ‘wengine’; tanbihi huhifadhi maana halisi ya nomino na uwezekano wa kuisoma hivyo.
- issue: Mtendaji katika ἐπωρώθησαν
  choice: walifanywa wagumu
  alternative: walipofushwa mioyo / wakawa sugu
  rationale: Kauli ya kutendwa inadumishwa bila kuamua kimya kimya ikiwa mtendaji ni Mungu, wao wenyewe, au jambo jingine; hivyo mvutano wa kiteolojia wa kifungu unabaki.
