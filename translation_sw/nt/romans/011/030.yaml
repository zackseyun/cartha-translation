  text: ὥσπερ ⸀γὰρ ὑμεῖς ποτε ἠπειθήσατε τῷ θεῷ, νῦν δὲ ἠλεήθητε τῇ τούτων ἀπειθείᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/030.yaml
  text: For just as you once were disobedient to God[a], but now have received mercy because of their disobedience,
translation:
  language: sw
  text: Kwa maana, kama vile ninyi zamani hamkumtii Mungu,[a] lakini sasa mmehurumiwa kwa sababu ya kutokutii kwao,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “hamkumwamini Mungu”; vivyo hivyo, “kutokutii kwao” inaweza kuwa “kutokuamini kwao.” Maneno ya Kigiriki yanaweza kuwa na maana zote mbili katika muktadha huu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: Kwa maana kama vile
  rationale: “Kwa maana” huhifadhi kazi ya γάρ ya kutoa ufafanuzi, na “kama vile” huhifadhi ulinganisho wa ὥσπερ kwa Kiswahili cha kawaida.
- source_word: ὑμεῖς
  choice: ninyi
  rationale: Ni kiwakilishi cha nafsi ya pili wingi. “Ninyi” huonyesha wingi na msisitizo uliopo katika Kigiriki bila kuongeza wazi kwamba ni watu wa mataifa.
- source_word: ποτε
  choice: wakati fulani
  rationale: Huonyesha hali ya zamani na kuleta utofautishaji wa wazi na νῦν, “sasa.”
- source_word: ἠπειθήσατε τῷ θεῷ
  choice: mlivyokataa kumtii Mungu
  rationale: Kitenzi ἀπειθέω kinaweza kumaanisha kutotii au kutokuamini. “Kukataa kumtii” ni usemi wa asili unaohifadhi mwelekeo wa uasi dhidi ya Mungu bila kuufanya kuwa ukosefu wa imani wa kiakili pekee.
- source_word: νῦν δὲ
  choice: lakini sasa
  rationale: Huonyesha utofautishaji wenye nguvu kati ya hali yao ya zamani na kupokea rehema sasa.
- source_word: ἠλεήθητε
  choice: mmepokea rehema
  rationale: Huwasilisha hali tendwa ya ἐλεάω kwa Kiswahili cha kawaida, huku mkazo ukiwa juu ya rehema waliyopewa.
- source_word: τῇ τούτων ἀπειθείᾳ
  choice: kwa sababu ya kutokutii kwao
  rationale: Dative inaweza kueleweka kwa maana ya sababu au njia. “Kwa sababu ya” hutoa uhusiano huo kwa uwazi bila kufafanua kupita kiasi namna tendo hilo lilivyokuwa njia; τούτων inarejelea kundi lililotajwa katika muktadha na hutafsiriwa kwa kawaida “kwao.”
theological_decisions:
- issue: Maana ya ἀπειθέω / ἀπείθεια katika hoja ya Paulo kuhusu wokovu
  choice: kukataa kumtii / kutokutii
  alternative: kutokuamini
  rationale: Maneno haya yanaweza kuhusisha kutotii na kutokuamini. Tafsiri hii hudumisha uhusiano wa kileksika kati ya kitenzi na nomino na huepuka kuyafanya maneno ya Paulo yahusu ufahamu wa kiakili pekee. Tanbihi huhifadhi maana mbadala halisi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi umehifadhi ulinganisho unaoendelea katika aya inayofuata, na istilahi “rehema” imetumiwa kwa usahihi wa kimuktadha.
