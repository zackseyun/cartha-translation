  yaml_path: translation/nt/romans/011/015.yaml
  text: For if their rejection means reconciliation for the world[b][a], what will their acceptance mean if not life from the dead?
translation:
  language: sw
  text: Kwa maana, ikiwa kukataliwa kwao ni upatanisho wa ulimwengu, basi kukubaliwa kwao kutakuwa nini, kama si uzima kutoka kwa wafu?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Uzima kutoka kwa wafu” unaweza kumaanisha kwa mfano kufanywa upya kwa kiroho kwa namna ya ajabu, au hasa ufufuo; Paulo anaacha usemi huu ukiwa mfupi na wenye maana pana.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποβολὴ
  choice: kukataliwa
  rationale: Nomino hii inaonyesha kuwekwa kando au kukataliwa kwao, na inatofautishwa moja kwa moja na πρόσλημψις.
- source_word: καταλλαγὴ
  choice: upatanisho
  rationale: Hili ni neno la kawaida na lenye hadhi kwa kurejeshwa kwa uhusiano, likihifadhi matumizi ya Paulo bila kulipanua.
- source_word: κόσμου
  choice: ulimwengu
  rationale: Inahifadhi upana wa κόσμος bila kuibana katika matini kuwa Mataifa pekee.
- source_word: πρόσλημψις
  choice: kukubaliwa
  rationale: Linaunda ulinganifu wa wazi na wa asili dhidi ya 'kukataliwa' na linaweza kumaanisha kupokewa tena.
- source_word: ζωὴ ἐκ νεκρῶν
  choice: uzima kutoka kwa wafu
  rationale: Tafsiri ya karibu na ya kawaida inayohifadhi usemi mfupi na wenye maana pana bila kuamua ikiwa ni uamsho wa kiroho au ufufuo.
- source_word: εἰ μὴ
  choice: kama si
  rationale: Katika swali hili la balagha, usemi huu unaonyesha jibu linalotarajiwa kwa msisitizo.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Inaonyesha uhusiano wa hoja hii na yaliyotangulia kwa namna ya kawaida katika Kiswahili cha kibiblia cha sasa.
theological_decisions:
- issue: Maana ya 'uzima kutoka kwa wafu'
  choice: Kuacha usemi ukiwa wazi kama ulivyo katika Kiyunani
  alternative: Kuufafanua kuwa uamsho mkubwa wa kiroho au ufufuo wa mwisho
  rationale: Maneno ya Paulo ni mafupi na yenye mvutano wa kieskatolojia; tafsiri haipaswi kuamua maana ambayo matini yenyewe haijaifafanua.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Kukataliwa/kukubaliwa' huhifadhi ulinganifu wa maneno ya Kiyunani; 'uzima kutoka kwa wafu' huhifadhi utata halisi wa usemi.
