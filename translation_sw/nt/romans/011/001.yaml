id: ROM.11.1
reference: Romans 11:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Λέγω οὖν, μὴ ἀπώσατο ὁ θεὸς τὸν λαὸν αὐτοῦ; μὴ γένοιτο· καὶ γὰρ ἐγὼ Ἰσραηλίτης εἰμί, ἐκ σπέρματος Ἀβραάμ, φυλῆς Βενιαμίν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/001.yaml
  text: So I ask[a], has God rejected his people? May it never be! For I myself am an Israelite, from the offspring of Abraham[c][b], of the tribe of Benjamin.
translation:
  language: sw
  text: Basi ninauliza, je, Mungu amewakataa watu wake?[a] La hasha![b] Kwa maana mimi mwenyewe ni Mwisraeli, mzao wa Abrahamu,[c] wa kabila la Benyamini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “amewatupilia mbali watu wake?”
    reason: lexical_alternative
  - marker: b
    text: Kigiriki kina usemi wenye nguvu wa kukataa, unaoweza pia kutafsiriwa, “Isiwe hivyo kamwe!”
    reason: lexical_alternative
  - marker: c
    text: Kihalisi, “wa mbegu ya Abrahamu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγω οὖν
  choice: Basi ninauliza
  rationale: Kauli hii inaanzisha swali la balagha na kuendeleza hoja iliyotangulia; “Basi ninauliza” ni ya asili katika Kiswahili na inadumisha nguvu ya kimantiki ya οὖν.
- source_word: μὴ ἀπώσατο
  choice: amewakataa
  rationale: Kitenzi kina maana ya kukataa au kuwatupilia mbali, na swali lenye μή linatarajia jibu hasi. “Amewakataa” ni wazi bila kuongeza wazo la ‘kabisa’ au ‘milele’ lisilosemwa katika Kigiriki.
- source_word: ὁ θεὸς
  choice: Mungu
  rationale: Hili ndilo neno la kawaida na linalofaa kwa θεός katika muktadha huu.
- source_word: τὸν λαὸν αὐτοῦ
  choice: watu wake
  rationale: Linadumisha maana ya umiliki na uhusiano wa watu hao na Mungu bila kufafanua zaidi ya matini.
- source_word: μὴ γένοιτο
  choice: La hasha!
  rationale: Ni kauli thabiti ya kukataa katika Kiswahili, yenye nguvu kuliko jibu rahisi la ‘hapana,’ na inafaa kwa matumizi ya Paulo.
- source_word: καὶ γὰρ ἐγὼ
  choice: Kwa maana mimi mwenyewe
  rationale: “Kwa maana” huonyesha sababu, nayo “mimi mwenyewe” hudumisha msisitizo wa ἐγώ, Paulo akijitolea kama ushahidi.
- source_word: Ἰσραηλίτης
  choice: Mwisraeli
  rationale: Ni kitambulisho cha kawaida cha kikabila na cha watu wa agano katika Kiswahili.
- source_word: ἐκ σπέρματος Ἀβραάμ
  choice: mzao wa Abrahamu
  rationale: σπέρμα kwa msingi ni ‘mbegu,’ lakini hapa humaanisha uzao au mzao. “Mzao” ni Kiswahili cha asili na huwasilisha kwa usahihi uhusiano wa nasaba.
- source_word: φυλῆς Βενιαμίν
  choice: wa kabila la Benyamini
  rationale: Ni namna ya kawaida na wazi ya kuonyesha ukoo wa kikabila.
theological_decisions:
- issue: Ikiwa swali la Paulo lidokeze kukataliwa kabisa au milele kwa Israeli ya kikabila
  choice: je, Mungu amewakataa watu wake?
  alternative: je, Mungu amewakataa kabisa watu wake? / je, Mungu amewatupilia mbali milele watu wake?
  rationale: Matini ya Kigiriki haina kielezi kinachomaanisha ‘kabisa’ au ‘milele.’ Tafsiri inaacha upeo wa swali uelezwe na muktadha unaofuata badala ya kuingiza hitimisho la kiteolojia katika mstari huu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. “La hasha” limetumiwa kudumisha nguvu ya usemi wa Paulo; tanbihi inaonyesha umbo la karibu zaidi na Kigiriki. Alama zote za tanbihi [a], [b], na [c] zimewekwa katika matini kuu.
