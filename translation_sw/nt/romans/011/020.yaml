base_translation:
  language: en
  yaml_path: translation/nt/romans/011/020.yaml
  text: 'Quite right: they were broken off because of unbelief[a], but you stand by faith. Do not be arrogant[d][c][b], but fear.'
translation:
  language: sw
  text: Ni kweli kabisa:[a] wao walivunjwa kwa sababu ya kutokuamini, lakini wewe unasimama kwa imani.[b] Usiwe na majivuno,[c] bali ogopa.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Vema,” au “Hiyo ni kweli.”
    reason: lexical_alternative
  - marker: b
    text: Au “kwa kumtumaini Mungu.” Neno la Kigiriki pistis limetafsiriwa “imani” katika matini kuu.
    reason: alternative_reading
  - marker: c
    text: Au “Usijione kuwa bora,” au “usiwaze kwa majivuno.”
    reason: lexical_alternative
  - marker: d
    text: Yaani, uwe na hofu yenye unyenyekevu, heshima na tahadhari mbele za Mungu, badala ya kujiamini kwa kiburi.
    reason: lexical_alternative
lexical_decisions:
- source_word: καλῶς
  choice: Ni kweli kabisa
  rationale: Katika muktadha huu ni jibu la kukubali kauli iliyotangulia. Kauli hii ya Kiswahili inaonyesha ukubali huo kwa uwazi na kwa njia ya kawaida.
- source_word: ἀπιστίᾳ
  choice: kwa sababu ya kutokuamini
  rationale: Datibu hapa inaonyesha sababu au njia; katika muktadha, matawi yalivunjwa kwa sababu ya kutokuamini. Pia inadumisha utofauti na πίστει.
- source_word: ἐξεκλάσθησαν
  choice: walivunjwa
  rationale: Inadumisha mfano wa matawi ya mzeituni katika muktadha. Kiswahili hakihitaji kuongeza “wakaondolewa,” kwa kuwa wazo la kutengwa linaeleweka katika mfano huo.
- source_word: πίστει
  choice: kwa imani
  rationale: Inadumisha istilahi ya kawaida ya Paulo na utofauti wake na kutokuamini; datibu inaonyesha msingi au njia ya kusimama.
- source_word: ἕστηκας
  choice: unasimama
  rationale: Wakati timilifu wa Kigiriki unaeleza hali iliyopo inayotokana na tendo lililotangulia. “Unasimama” ni ya kawaida na inadumisha hali hiyo bila kufafanua kupita kiasi.
- source_word: ὑψηλὰ φρόνει
  choice: Usijivune
  rationale: Nahau hii inakataza kujifikiria kwa majivuno au kujiona kuwa bora. “Usijivune” ni fupi, ya kawaida, na inafikisha onyo dhidi ya kiburi.
- source_word: φοβοῦ
  choice: ogopa
  rationale: Amri hii inadumisha ukali na mvutano wa maandishi. Muktadha unaonyesha hofu yenye unyenyekevu na tahadhari mbele za Mungu, bila kuipunguza kuwa heshima tu.
theological_decisions:
- issue: Maana ya πίστει ikilinganishwa na ἀπιστίᾳ
  choice: kwa imani
  alternative: kwa kumtumaini Mungu
  rationale: Utofauti na kutokuamini unaelekeza kwenye mwitikio wa imani. “Imani” inadumisha istilahi pana ya Paulo, huku maelezo ya chini yakitaja uwezekano wa kueleza kama kumtumaini Mungu.
- issue: Nguvu ya φοβοῦ
  choice: ogopa
  alternative: uwe na hofu yenye heshima
  rationale: Tafsiri fupi inadumisha onyo kali dhidi ya kujiamini kwa kiburi. Maelezo ya chini yanafafanua aina ya hofu bila kuondoa mvutano wa kitheolojia katika matini kuu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi fupi na amri ya moja kwa moja zinadumisha mkazo wa Kigiriki; msamiati unaeleweka kwa wasomaji wa kawaida bila kuingiza msimamo wa dhehebu.
