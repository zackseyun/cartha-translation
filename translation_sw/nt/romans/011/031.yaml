  text: οὕτως καὶ οὗτοι νῦν ἠπείθησαν τῷ ὑμετέρῳ ἐλέει ἵνα καὶ αὐτοὶ ⸀νῦν ἐλεηθῶσιν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/031.yaml
  text: So also these now have been disobedient[a], so that by the mercy shown to you they also may now receive mercy.
translation:
  language: sw
  text: Vivyo hivyo, hawa nao sasa wamekuwa wasiotii, ili kwa rehema mliyoonyeshwa wao pia sasa waonyeshwe rehema.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως καὶ οὗτοι
  choice: Vivyo hivyo, hawa nao
  rationale: Inahifadhi ulinganisho na kauli iliyotangulia pamoja na nguvu ya kiwakilishi kinachowaelekeza Waisraeli katika muktadha.
- source_word: νῦν ἠπείθησαν
  choice: sasa wamekataa kutii
  rationale: Neno ἀπειθέω linaweza kuhusisha kutokuamini na kutotii; tafsiri hii haifungi maana katika kutokuamini kwa akili pekee, na ‘wamekataa’ inaonyesha hali yao ya sasa.
- source_word: τῷ ὑμετέρῳ ἐλέει
  choice: kwa rehema mliyoonyeshwa
  rationale: Inaeleza kwa Kiswahili cha kawaida kwamba rehema inayozungumziwa ni ile waliyopewa wasomaji na Mungu, huku tanbihi ikihifadhi uwezekano wa kusoma kirai hicho kwa uhalisi zaidi kama ‘kwa rehema yenu.’
- source_word: ἵνα
  choice: ili
  rationale: Inaonyesha kusudi au matokeo yaliyokusudiwa kwa lugha ya kawaida bila kuamua kupita kiasi kati ya dhana hizo mbili.
- source_word: καὶ αὐτοὶ νῦν ἐλεηθῶσιν
  choice: wao pia sasa waonyeshwe rehema
  rationale: Inahifadhi msisitizo wa αὐτοὶ, νῦν ya pili, na hali ya kutendwa inayoonyesha kwamba rehema wanapewa na mwingine, ambaye katika muktadha ni Mungu.
theological_decisions:
- issue: Ikiwa ‘rehema yenu’ ni rehema inayotolewa na waamini wa Mataifa au rehema waliyopewa na Mungu
  choice: rehema mliyoonyeshwa
  alternative: rehema yenu
  rationale: Mtiririko wa Waroma 11:30–32 unalinganisha makundi yaliyokataa kutii kisha yakapokea rehema ya Mungu. Tafsiri kuu inaakisi muktadha huo, lakini tanbihi inahifadhi mkato na uwezekano wa kisarufi wa Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Hawa nao’ ni wazi lakini si kizito; urudiaji wa ‘sasa’ umehifadhiwa kwa sababu unatokea mara mbili katika matini iliyotolewa na una umuhimu katika hoja ya Paulo.
