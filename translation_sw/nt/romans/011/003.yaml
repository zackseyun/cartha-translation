  text: Κύριε, τοὺς προφήτας σου ἀπέκτειναν, ⸀τὰ θυσιαστήριά σου κατέσκαψαν, κἀγὼ ὑπελείφθην μόνος, καὶ ζητοῦσιν τὴν ψυχήν μου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/003.yaml
  text: Lord[a], they killed your prophets, they tore down your altars, and I alone was left, and they are seeking my life.
translation:
  language: sw
  text: “Bwana, waliwaua manabii wako, wakabomoa madhabahu zako, nami peke yangu niliachwa, nao wanatafuta uhai wangu[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa karibu zaidi na neno kwa neno, “wanaitafuta nafsi yangu”; hapa nahau ya Kigiriki inamaanisha “wanatafuta uhai wangu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Κύριε
  choice: Bwana
  rationale: Ni hali ya mwito ya κύριος katika kumwambia Mungu moja kwa moja. “Bwana” ni tafsiri ya kawaida, yenye heshima na iliyo wazi katika Kiswahili cha Biblia.
- source_word: ἀπέκτειναν
  choice: waliwaua
  rationale: Kitenzi hiki humaanisha kuua. “Waliwaua” ni cha moja kwa moja na hakiongezi kwa lazima wazo maalumu la mauaji ya jinai ambalo halimo wazi katika neno lenyewe.
- source_word: τὰ θυσιαστήριά σου
  choice: madhabahu zako
  rationale: θυσιαστήριον ni madhabahu, hasa mahali pa kutoa dhabihu. “Madhabahu” tayari lina maana hiyo kwa Kiswahili bila kulazimika kuongeza “za dhabihu.”
- source_word: κατέσκαψαν
  choice: wakabomoa
  rationale: Neno hili linaonyesha kubomoa au kuangusha kabisa. Kwa madhabahu, “wakabomoa” ni la kawaida na linahifadhi tendo halisi la uharibifu.
- source_word: κἀγὼ ὑπελείφθην μόνος
  choice: nami peke yangu nikasalia
  rationale: Kauli hii inasisitiza kwamba, kwa mtazamo wa Eliya, yeye ndiye pekee aliyebaki. “Nikasalia” ni Kiswahili cha asili kinachowasilisha matokeo ya kauli tendwa ya Kigiriki bila kudokeza tu hali ya upweke wa kihisia.
- source_word: ζητοῦσιν τὴν ψυχήν μου
  choice: wanatafuta uhai wangu
  rationale: Katika usemi huu ψυχή humaanisha uhai wa mtu, na ζητοῦσιν inaonyesha jitihada inayoendelea. Tafsiri hii inahifadhi nahau kwa kiasi kinachoeleweka bila kuitafsiri kwa ziada kuwa “wanajaribu kuniua.”
theological_decisions:
- issue: Maana ya ψυχή katika usemi wa tishio
  choice: uhai wangu
  alternative: nafsi yangu
  rationale: Muktadha unahusu watu wanaotaka kuondoa uhai wa Eliya, si mafundisho kuhusu sehemu isiyo ya mwili ya mwanadamu. “Uhai wangu” hutoa maana ya nahau bila kuingiza msimamo wa ziada kuhusu asili ya mwanadamu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa nukuu umehifadhi mfululizo wa malalamiko ya Eliya, huku “nami peke yangu” kikibeba msisitizo wa μόνος kwa namna ya asili.
