  yaml_path: translation/nt/romans/011/005.yaml
  text: So then, in the present time also, a remnant has come to be according to the election of grace.
translation:
  language: sw
  text: Basi, vivyo hivyo, wakati huu pia, kumekuwapo mabaki kulingana na uteuzi wa neema.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kulingana na uteuzi wenye neema,” au “kulingana na uteuzi kwa neema.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως οὖν καὶ
  choice: Basi vivyo hivyo ... pia
  rationale: “Basi” linaonyesha hitimisho kutokana na mfano wa Eliya uliotangulia, “vivyo hivyo” linadumisha ulinganisho, na “pia” linawakilisha καί.
- source_word: ἐν τῷ νῦν καιρῷ
  choice: wakati huu
  rationale: Ni Kiswahili cha kawaida kinachoonyesha kipindi cha sasa kwa kulinganisha na siku za Eliya.
- source_word: λεῖμμα
  choice: baki
  rationale: “Baki” linaeleza kikundi kidogo kilichosalia na linafaa katika muktadha wa kibiblia, bila kuongeza wazi mhusika anayekihifadhi.
- source_word: κατ’ ἐκλογὴν χάριτος
  choice: kulingana na uteuzi wa neema
  rationale: Muundo huu unadumisha nomino zote mbili na uhusiano wao wenye uwezekano wa kueleweka kama sifa, msingi, au chanzo, bila kuubana kwa tafsiri moja.
- source_word: γέγονεν
  choice: limekuwapo
  rationale: Wakati timilifu wa γίνομαι unaonyesha hali ya sasa iliyotokana na kutokea kwake; “limekuwapo” ni ya asili kwa Kiswahili na haibadili kitenzi kuwa tu “lipo” au “limesalia.”
theological_decisions:
- issue: Tafsiri ya ἐκλογή katika muktadha wa Paulo wenye mijadala ya kimafundisho
  choice: uteuzi
  alternative: uchaguzi
  rationale: “Uteuzi” linabeba uzito wa tendo la kuchagua katika muktadha huu bila kuingiza mfumo maalumu wa kimadhehebu.
- issue: Uhusiano wa χάριτος na ἐκλογή katika κατ’ ἐκλογὴν χάριτος
  choice: uteuzi wa neema
  alternative: uteuzi kwa neema
  rationale: “Wa neema” linahifadhi ufupi na utata halisi wa muundo wa Kigiriki kuhusu kama neema ni sifa, msingi, au chanzo cha uteuzi; tanbihi inatoa mbadala wa kimaana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. “Baki” na “uteuzi wa neema” yanadumisha msamiati na mvutano wa kitheolojia wa kifungu.
