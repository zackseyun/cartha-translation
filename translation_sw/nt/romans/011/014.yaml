  text: if somehow I may provoke my own people to jealousy and save some of them[a].
translation:
  language: sw
  text: ili kwa namna fulani niwatie wivu watu wa taifa langu[a] na kuwaokoa baadhi yao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki, “mwili wangu,” yaani watu wa taifa la Paulo, Wayahudi wenzake.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ πως
  choice: kwa namna fulani
  rationale: Kirai hiki kinahifadhi tumaini au kusudi la Paulo lisilo na uhakika kamili, kwa Kiswahili cha kawaida na bila kutumia usemi wa kizamani.
- source_word: παραζηλώσω
  choice: niwatie wivu
  rationale: Kitenzi hiki humaanisha kuamsha wivu; hapa kinaendeleza wazo la Waisraeli kuchochewa na kuingizwa kwa watu wa mataifa katika muktadha unaozunguka.
- source_word: μου τὴν σάρκα
  choice: watu wa taifa langu
  rationale: Neno kwa neno ni ‘mwili wangu,’ lakini katika muktadha huu ni nahau inayowarejelea ndugu wa Paulo wa asili, yaani Wayahudi wenzake. Tafsiri hii ni wazi na ya kawaida, huku tanbihi ikihifadhi picha halisi ya Kigiriki.
- source_word: σώσω
  choice: kuwaokoa
  rationale: Kitenzi hiki kina uzito wa wokovu katika matumizi ya Paulo; ‘kuwaokoa’ ndilo neno la kawaida na lenye uwazi wa kiteolojia.
- source_word: τινὰς ἐξ αὐτῶν
  choice: baadhi yao
  rationale: Usemi huu unaonyesha sehemu ya kundi lililotajwa, na ‘baadhi yao’ ni tafsiri fupi na ya kawaida katika Kiswahili.
theological_decisions:
- issue: Maana ya σάρξ Paulo anapowarejelea watu wa kabila lake
  choice: watu wa taifa langu
  alternative: mwili wangu; jamaa zangu wa asili; Wayahudi wenzangu
  rationale: Hapa σάρξ haimaanishi asili ya dhambi, bali undugu wa asili na wa kikabila. Matini kuu inaeleza maana ya nahau kwa Kiswahili cha kawaida, na tanbihi inaonyesha usemi halisi na rejeleo lake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ‘ili kwa namna fulani’ unaendana na sentensi inayotangulia katika muktadha na kuhifadhi hali ya kusudi lenye tumaini lisilo hakika.
