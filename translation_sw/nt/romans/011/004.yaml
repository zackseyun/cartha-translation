  text: ἀλλὰ τί λέγει αὐτῷ ὁ χρηματισμός; Κατέλιπον ἐμαυτῷ ἑπτακισχιλίους ἄνδρας, οἵτινες οὐκ ἔκαμψαν γόνυ τῇ Βάαλ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/004.yaml
  text: But what does the divine response say to him? “I have kept for myself seven thousand men[b][a], who have not bent the knee to Baal.”
translation:
  language: sw
  text: Lakini jibu la Mungu[a] linamwambia nini? “Nimebakiza kwa ajili yangu wanaume elfu saba, ambao hawakumpigia Baali goti.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “jibu kutoka kwa Mungu,” “neno la Mungu,” au “ujumbe wa kimungu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: χρηματισμός
  choice: jibu la Mungu
  rationale: Katika muktadha huu neno hilo linamaanisha jibu lenye mamlaka lililotolewa na Mungu kwa Eliya. ‘Jibu la Mungu’ ni la kawaida na linaeleweka wazi katika Kiswahili.
- source_word: Κατέλιπον
  choice: Nimejiwekea
  rationale: Kauli hii inaonyesha tendo la Mungu la kuwaacha au kuwahifadhi watu hawa kwa ajili yake mwenyewe, pamoja na matokeo yanayoendelea. ‘Nimejiwekea’ huunganisha kitenzi hicho na ἐμαυτῷ kwa Kiswahili cha kawaida.
- source_word: ἐμαυτῷ
  choice: -ji- katika ‘Nimejiwekea’
  rationale: Kirejeshi hiki kinaonyesha kwamba Mungu aliwahifadhi kwa ajili yake mwenyewe; maana hiyo imewasilishwa kwa kiambishi cha kujirejelea ‘-ji-’.
- source_word: ἑπτακισχιλίους ἄνδρας
  choice: wanaume elfu saba
  rationale: Neno ἄνδρας ni mahsusi kwa wanaume, kwa hiyo jinsia iliyo katika matini ya Kigiriki imehifadhiwa.
- source_word: οἵτινες
  choice: ambao
  rationale: ‘Ambao’ huanzisha kwa kawaida maelezo yanayowatambulisha hao wanaume elfu saba.
- source_word: οὐκ ἔκαμψαν γόνυ
  choice: hawajampigia ... goti
  rationale: Usemi huu huhifadhi picha ya kupiga goti na, katika muktadha, unaonyesha ibada au kujisalimisha kwa Baali.
- source_word: τῇ Βάαλ
  choice: Baali
  rationale: Jina la mungu huyo limetoholewa kwa umbo lililozoeleka katika Kiswahili; kiambishi cha yambwa katika ‘hawajampigia’ kinaonyesha anayeelekezewa tendo hilo.
theological_decisions:
- issue: Kuweka wazi kwamba mwenye kutoa jibu ni Mungu
  choice: jibu la Mungu
  alternative: jibu; ujumbe wa kimungu
  rationale: Muktadha na chanzo cha Agano la Kale vinaonyesha kwamba Mungu ndiye anayemjibu Eliya. Tafsiri hii inaweka wazi maana ya χρηματισμός bila kuongeza fundisho lisilokuwamo katika matini.
- issue: Jinsi ya kutafsiri jinsia ya ἄνδρας
  choice: wanaume
  alternative: watu
  rationale: Matini ya Kigiriki inatumia nomino mahsusi ya kiume, hivyo tafsiri haiibadilishi kuwa neno lisiloonyesha jinsia.
- issue: Wakati wa vitenzi katika nukuu
  choice: Nimejiwekea ... hawajampigia
  alternative: Nilijiwekea ... hawakumpigia
  rationale: Kauli timilifu ya Kiswahili huonyesha tendo lililotimizwa pamoja na hali yake inayoendelea katika hoja ya Paulo kuhusu mabaki, huku tanbihi ikihifadhi uwezekano wa tafsiri ya wakati uliopita.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. ‘Kumpigia Baali goti’ huhifadhi picha halisi ya Kigiriki na maana yake ya ibada.
