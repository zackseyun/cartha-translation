  text: σκοτισθήτωσαν οἱ ὀφθαλμοὶ αὐτῶν τοῦ μὴ βλέπειν, καὶ τὸν νῶτον αὐτῶν διὰ παντὸς σύγκαμψον.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/010.yaml
  text: Let their eyes be darkened so that they may not see[b][a], and bend their back continually.
translation:
  language: sw
  text: Macho yao yatiwe giza ili wasione, nawe uinamishe migongo yao daima.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakati wote.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σκοτισθήτωσαν
  choice: na yatiwe giza
  rationale: Kauli ya kutendwa ya amri kwa nafsi ya tatu ina nguvu ya ombi la hukumu; usemi huu unahifadhi taswira halisi ya giza bila kuifasiri moja kwa moja kuwa upofu.
- source_word: οἱ ὀφθαλμοὶ αὐτῶν
  choice: macho yao
  rationale: Ni kirai cha umilikaji cha moja kwa moja, na taswira ya kiungo cha mwili ni muhimu katika sitiari.
- source_word: τοῦ μὴ βλέπειν
  choice: ili wasione
  rationale: Kiswahili hiki cha kawaida kinahifadhi uwezekano wa kusudi au matokeo katika muundo wa Kigiriki bila kulazimisha mojawapo.
- source_word: τὸν νῶτον αὐτῶν
  choice: migongo yao
  rationale: Ingawa Kigiriki kina umoja wa mgawanyo, Kiswahili cha kawaida hutumia wingi kwa kundi la watu, huku taswira ya kimwili ikibaki wazi.
- source_word: διὰ παντός
  choice: daima
  rationale: Hueleza hali ya kudumu au isiyokoma katika muktadha huu bila kuongeza kwa lazima wazo lenye nguvu zaidi la 'milele'.
- source_word: σύγκαμψον
  choice: uikunjishe
  rationale: Amri hii inaelekezwa kwa Mungu katika nukuu na ina kitu cha moja kwa moja, mgongo; 'kukunja' huhifadhi picha ya kuwafanya wawe wameinama.
theological_decisions:
- issue: Nukuu ya laana na utendaji wa Mungu
  choice: 'Kudumisha nguvu ya ombi/amri: “Macho yao na yatiwe giza ... nawe uikunjishe migongo yao.”'
  alternative: 'Kuitafsiri kama taarifa ya utabiri au kama matokeo yasiyo na mtendaji: “macho yao yatatiwa giza.”'
  rationale: Muundo wa Kigiriki unahifadhi ombi kali la hukumu katika nukuu ya Maandiko. Tafsiri haipaswi kupunguza ukali huo wala kuongeza ufafanuzi wa kiteolojia usiomo katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Na yatiwe” na “uikunjishe” huhifadhi mtindo wa ombi la hukumu; “migongo yao” ni ya kawaida zaidi kwa Kiswahili kuliko umoja wa mgawanyo wa Kigiriki.
