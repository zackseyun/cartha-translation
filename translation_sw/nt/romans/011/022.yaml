id: ROM.11.22
reference: Romans 11:22
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἴδε οὖν χρηστότητα καὶ ἀποτομίαν θεοῦ· ἐπὶ μὲν τοὺς πεσόντας ⸀ἀποτομία, ἐπὶ δὲ σὲ ⸂χρηστότης θεοῦ⸃, ἐὰν ⸀ἐπιμένῃς τῇ χρηστότητι, ἐπεὶ καὶ σὺ ἐκκοπήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/022.yaml
  text: 'Consider[a], then, the kindness and severity of God: severity toward those who have fallen, but God''s kindness toward you, if you continue in his kindness[b]; otherwise you too will be cut off.'
translation:
  language: sw
  text: 'Basi, tazama wema na ukali wa Mungu: ukali kwa wale walioanguka, lakini wema wa Mungu kwako, ikiwa utaendelea katika wema wake; la sivyo, wewe pia utakatwa.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “utaondolewa.” Kitenzi cha Kigiriki humaanisha kihalisi “kukatwa”; “kuondolewa” ni njia nyingine ya kueleza matokeo hayo katika mfano wa mzeituni.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἴδε
  choice: tazama
  rationale: Kitenzi cha amri kinamwita msomaji aangalie na kutafakari kwa makini; “tazama” ni cha kawaida na chenye uzito katika Kiswahili cha Biblia.
- source_word: χρηστότητα / χρηστότης
  choice: wema
  rationale: Neno hili linaweza kumaanisha wema, fadhili, au ukarimu. “Wema” linasikika kwa kawaida katika marudio ya sentensi hii na linadumisha tofauti na “ukali” bila kupunguza hali ya Mungu ya kuwatendea watu kwa fadhili.
- source_word: ἀποτομίαν / ἀποτομία
  choice: ukali
  rationale: Neno linaonyesha ukali au hatua isiyolegezwa katika hukumu; “ukali” ni sawia, wazi, na haliongezi maana kuliko Kigiriki.
- source_word: ἐπὶ μὲν τοὺς πεσόντας
  choice: kwa wale walioanguka
  rationale: “Kwa” linaonyesha kuelekezwa kwa ukali kwa kundi hilo, na “walioanguka” linahifadhi hali inayotokana na kuanguka katika mfano wa mzeituni.
- source_word: ἐπὶ δὲ σὲ
  choice: kwako
  rationale: Linadumisha ulinganifu na kishazi kilichotangulia na kueleza kwamba wema wa Mungu unaelekezwa kwa mtu anayeambiwa.
- source_word: ἐὰν ἐπιμένῃς τῇ χρηστότητι
  choice: ikiwa utaendelea katika wema wake
  rationale: “Utaendelea” linafikisha maana ya kuendelea au kudumu, huku “katika wema wake” likihifadhi wazo la kuendelea ndani ya eneo la wema wa Mungu.
- source_word: ἐπεὶ
  choice: la sivyo
  rationale: Katika muktadha huu linaanzisha matokeo hasi yasipotimizwa masharti yaliyotajwa; “la sivyo” linaeleza mantiki hiyo kwa Kiswahili cha kawaida.
- source_word: ἐκκοπήσῃ
  choice: utakatwa
  rationale: Hii ni kauli tendwa ya wakati ujao ya “kukata”; tafsiri hiyo inahifadhi nguvu ya kitenzi na inafaa kwa mfano wa mti unaozunguka kifungu.
theological_decisions:
- issue: Onyo lenye sharti kuhusu wema na hukumu ya Mungu
  choice: 'Sharti na onyo yamehifadhiwa moja kwa moja: ikiwa mtu ataendelea katika wema wa Mungu; la sivyo, yeye pia atakatwa.'
  alternative: Kulifanya onyo kuwa dhahania tu, au kulifasiri kwa namna inayokamilisha mjadala wa kidhehebu kuhusu kudumu au kuanguka kutoka katika imani.
  rationale: Kigiriki kinatoa sharti na onyo halisi lakini hakisuluhishi hapa ikiwa matumizi yake ni ya mtu mmoja mmoja au ya jumuiya, wala mjadala mpana kuhusu kudumu katika imani. Tafsiri inadumisha mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi na chenye heshima. Muundo wa tofauti kati ya wema na ukali umehifadhiwa, pamoja na onyo la moja kwa moja katika nafsi ya pili umoja.
