id: ROM.11.9
reference: Romans 11:9
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ Δαυὶδ λέγει· Γενηθήτω ἡ τράπεζα αὐτῶν εἰς παγίδα καὶ εἰς θήραν καὶ εἰς σκάνδαλον καὶ εἰς ἀνταπόδομα αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/009.yaml
  text: And David says[b][a], “Let their table become a snare and a trap and a stumbling block and a retribution to them,”
translation:
  language: sw
  text: Naye Daudi anasema, “Meza yao na iwe mtego, na tanzi, na kikwazo, na malipo kwao,”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δαυὶδ
  choice: Daudi
  rationale: Hili ndilo umbo la kawaida la jina hili katika Biblia na Kiswahili sanifu.
- source_word: λέγει
  choice: anasema
  rationale: Wakati uliopo wa Kigiriki umehifadhiwa kama wakati uliopo wa kifasihi unaotambulisha nukuu.
- source_word: Γενηθήτω
  choice: na iwe
  rationale: Huonyesha agizo au ombi la hali ya kutokea bila kulifanya kuwa utabiri tu.
- source_word: τράπεζα
  choice: meza
  rationale: Neno halisi na taswira yake ya kitu halisi zimehifadhiwa bila kulipanua kuwa karamu au riziki.
- source_word: παγίδα
  choice: mtego
  rationale: Ni neno la kawaida linalowasilisha kifaa au hali ya kunasa.
- source_word: θήραν
  choice: tanzi
  rationale: Katika mfuatano huu ni neno la pili linalohusu kunasa; 'tanzi' huhifadhi ukaribu wa maana huku likitofautishwa na 'mtego'.
- source_word: σκάνδαλον
  choice: kikwazo
  rationale: Huhifadhi taswira ya kitu kinachosababisha mtu ajikwae au aanguke, si hisia ya kukerwa tu.
- source_word: ἀνταπόδομα
  choice: malipo
  rationale: Huonyesha kile kinachorudishwa kwa mtu kulingana na matendo yake, huku muktadha ukibeba maana ya adhabu bila kuiongeza moja kwa moja katika neno.
- source_word: αὐτοῖς
  choice: kwao
  rationale: Huwasilisha kwa njia ya kawaida ya Kiswahili kwamba malipo hayo yanawahusu na yanawarudia wao.
theological_decisions:
- issue: Nukuu ya laana kutoka Zaburi 69:22
  choice: 'Kuhifadhi nguvu ya ombi/agizo: “Meza yao na iwe...”'
  alternative: “Meza yao itakuwa...” au “Meza yao na iweze kuwa...”
  rationale: Γενηθήτω ni amri ya nafsi ya tatu yenye nguvu ya ombi la hukumu; kuifanya utabiri kungepunguza mvutano na ukali wa maandishi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa orodha umehifadhi urudiaji wa καὶ bila kuwa mzito kupita kiasi.
