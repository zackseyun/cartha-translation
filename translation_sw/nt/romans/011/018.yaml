id: ROM.11.18
reference: Romans 11:18
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: μὴ κατακαυχῶ τῶν κλάδων· εἰ δὲ κατακαυχᾶσαι, οὐ σὺ τὴν ῥίζαν βαστάζεις ἀλλὰ ἡ ῥίζα σέ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/018.yaml
  text: do not boast over the branches[a]. But if you do boast, it is not you who support the root[b], but the root supports you.
translation:
  language: sw
  text: usijisifu dhidi ya yale matawi.[a] Lakini ikiwa unajisifu, si wewe unayeutegemeza mzizi,[b] bali mzizi ndio unaokutegemeza wewe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “usijisifu juu ya yale matawi.”
    reason: lexical_alternative
  - marker: b
    text: Au, “si wewe unayeubeba mzizi, bali mzizi ndio unaokubeba wewe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατακαυχῶ / κατακαυχᾶσαι
  choice: jisifu dhidi ya / ikiwa unajisifu
  rationale: Kitenzi hiki kinaonyesha kujisifu kwa namna ya kujiinua juu ya wengine au dhidi yao. “Jisifu dhidi ya” ni wazi katika Kiswahili na huhifadhi uhusiano wa upinzani unaodokezwa; katika tukio la pili muundo wa sharti umehifadhiwa.
- source_word: κλάδων
  choice: yale matawi
  rationale: “Yale” yanaonyesha matawi maalumu yaliyotajwa katika mfano wa mzeituni katika muktadha, bila kuyaainisha zaidi.
- source_word: ῥίζαν / ῥίζα
  choice: mzizi
  rationale: Neno limetafsiriwa kwa namna ileile katika sehemu zote mbili ili kuhifadhi mfano na urudiaji wa Kigiriki.
- source_word: βαστάζεις
  choice: tegemeza
  rationale: Katika mfano huu kitenzi kinamaanisha kubeba kwa kutoa msaada unaodumisha. “Tegemeza” huhifadhi picha hiyo na kueleza utegemezi kwa Kiswahili cha kawaida.
- source_word: οὐ σὺ ... ἀλλὰ ἡ ῥίζα σέ
  choice: si wewe unayeutegemeza mzizi, bali mzizi ndio unaokutegemeza wewe
  rationale: Muundo huu huhifadhi mkazo wa utofautishaji kati ya “wewe” na “mzizi,” pamoja na mgeuzo wa utegemezi.
- source_word: μὴ
  choice: usi-
  rationale: Umbo la kukataza “usijisifu” ni la moja kwa moja na la kawaida, bila kulazimisha maana ya kuendelea kwa tendo.
theological_decisions:
- issue: Nguvu ya mfano wa mzizi na matawi katika picha ya Paulo ya mzeituni
  choice: Kuhifadhi mfano bila kutaja wazi mzizi au matawi yanawakilisha nani
  alternative: Kutafsiri mzizi waziwazi kuwa mababu, Abrahamu, au ahadi za agano
  rationale: Maandishi ya Kigiriki yanatoa mfano bila ufafanuzi huo. Kuongeza utambulisho maalumu kungeingiza maelezo ya mfasiri katika tafsiri na kuondoa uwazi wa kitheolojia unaoachwa na muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo wa sharti, mkazo wa viwakilishi, na mfano wa kilimo vimehifadhiwa.
