id: ROM.11.25
reference: Romans 11:25
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Οὐ γὰρ θέλω ὑμᾶς ἀγνοεῖν, ἀδελφοί, τὸ μυστήριον τοῦτο, ἵνα μὴ ⸀ἦτε ἑαυτοῖς φρόνιμοι, ὅτι πώρωσις ἀπὸ μέρους τῷ Ἰσραὴλ γέγονεν ἄχρι οὗ τὸ πλήρωμα τῶν ἐθνῶν εἰσέλθῃ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/025.yaml
  text: 'For I do not want you to be unaware[a], brothers, of this mystery, so that you may not be wise in your own sight: a partial hardening has come upon Israel until the fullness of the Gentiles has come in[b],'
translation:
  language: sw
  text: 'Kwa maana sitaki, ndugu[a], msijue fumbo hili, ili msijione wenye hekima: ugumu wa moyo umewapata Israeli kwa sehemu, mpaka utimilifu wa watu wa mataifa utakapoingia[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki lina umbo la wingi wa kiume, “ndugu,” lakini linaweza kutumiwa kulihutubia kundi lenye wanaume na wanawake.
    reason: lexical_alternative
  - marker: b
    text: Au, “mpaka idadi kamili ya watu wa mataifa itakapoingia.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγνοεῖν
  choice: mkose kujua
  rationale: Huwasilisha kwa Kiswahili cha kawaida kauli ya Paulo ya kutotaka wasomaji wasiwe na habari au ufahamu, bila kutumia neno lenye dharau.
- source_word: ἀδελφοί
  choice: ndugu
  rationale: Neno la Kiswahili 'ndugu' ni mwito wa kawaida na wenye heshima kwa waumini, na linaweza kutaja kundi lenye wanaume na wanawake bila kupotosha maana ya muktadha.
- source_word: μυστήριον
  choice: fumbo
  rationale: Katika Paulo ni kusudi la Mungu lililokuwa limefichwa na sasa linafunuliwa; 'fumbo' huhifadhi uzito huo wa kitheolojia kuliko 'siri' peke yake.
- source_word: ἵνα μὴ ἦτε ἑαυτοῖς φρόνιμοι
  choice: ili msijione kuwa wenye hekima
  rationale: Ni usemi wa asili wa Kiswahili unaobeba onyo dhidi ya kujiona wenye busara kwa makadirio yao wenyewe.
- source_word: πώρωσις
  choice: ugumu
  rationale: Hueleza hali ya kufanywa au kuwa wagumu kiroho bila kuongeza kwa wazi mhusika anayesababisha hali hiyo.
- source_word: ἀπὸ μέρους
  choice: kwa sehemu
  rationale: Huhifadhi uwezekano kwamba ugumu unahusu sehemu ya Israeli, bila kuamua kimyakimya kuwa ni wa muda tu.
- source_word: τῷ Ἰσραήλ ... γέγονεν
  choice: umewapata Israeli
  rationale: Kauli hii ya Kiswahili huonyesha tukio lililotokea na hali yake inayoendelea, kulingana na nguvu ya wakati timilifu wa Kigiriki.
- source_word: πλήρωμα
  choice: utimilifu
  rationale: Huhifadhi upana wa maana ya πλήρωμα bila kuamua ikiwa ni idadi kamili, kuingizwa kikamilifu, au ukamilisho wa kieskatolojia.
- source_word: τῶν ἐθνῶν
  choice: wa watu wa mataifa
  rationale: Katika utofautishaji na Israeli, msemo huu huonyesha watu wasio Wayahudi kwa Kiswahili kinachoeleweka, huku ukidumisha uhusiano wa neno hilo na 'mataifa'.
- source_word: εἰσέλθῃ
  choice: utakapoingia
  rationale: Huhifadhi taswira ya kuingia na kuonyesha kikomo kinachotajwa baada ya 'mpaka,' bila kutaja wazi wanaingia wapi.
theological_decisions:
- issue: Maana ya 'utimilifu wa watu wa mataifa'
  choice: Utumizi wa 'utimilifu' katika matini kuu bila kufafanua aina ya utimilifu
  alternative: idadi kamili ya watu wa mataifa
  rationale: Kirai hicho kinaweza kumaanisha idadi kamili, kuingizwa kikamilifu, au ukamilisho mwingine wa mpango wa Mungu. Tafsiri kuu inadumisha mvutano huo, na tanbihi inatoa uwezekano wa kawaida.
- issue: Upeo wa ἀδελφοί
  choice: ndugu
  alternative: ndugu wa kiume na wa kike
  rationale: Ingawa umbo la Kigiriki ni wingi wa kiume, Paulo anaelekea kulihutubia kusanyiko lenye wanaume na wanawake. 'Ndugu' ni neno la kawaida la Kiswahili linaloweza kujumuisha wote; tanbihi inaweka jambo hilo wazi.
- issue: Upeo wa ugumu wa Israeli
  choice: kwa sehemu
  alternative: kwa kiasi fulani
  rationale: Kirai ἀπὸ μέρους kinaelekea kueleza kiwango au upeo wa ugumu, si lazima muda wake. Tafsiri haifanyi ugumu huo kuwa wa Israeli wote wala kuamua zaidi ya matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Mpangilio umefanywa wa asili kwa Kiswahili huku uhusiano wa sababu, kusudi, hali ya Israeli, na kikomo cha 'mpaka' ukihifadhiwa.
