reference: Romans 11:24
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἰ γὰρ σὺ ἐκ τῆς κατὰ φύσιν ἐξεκόπης ἀγριελαίου καὶ παρὰ φύσιν ἐνεκεντρίσθης εἰς καλλιέλαιον, πόσῳ μᾶλλον οὗτοι οἱ κατὰ φύσιν ἐγκεντρισθήσονται τῇ ἰδίᾳ ἐλαίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/024.yaml
  text: For if you were cut from what is by nature a wild olive tree and[a], contrary to nature, were grafted into a cultivated olive tree, how much more will these, the natural branches[b], be grafted into their own olive tree.
translation:
  language: sw
  text: Kwa maana, ikiwa wewe ulikatwa kutoka katika mzeituni wa mwituni kwa asili, na ukapandikizwa, kinyume cha asili, katika mzeituni uliolimwa, je, hawa walio wa asili[a] watapandikizwa zaidi sana katika mzeituni wao wenyewe?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “hawa, matawi ya asili.” Kigiriki husema kihalisi “hawa walio kwa asili”; neno “matawi” linadokezwa na sitiari ya mizeituni katika muktadha.
    reason: lexical_alternative
  - marker: b
    text: Au “watapandikizwa tena katika mzeituni wao wenyewe.” Wazo la kurudi linadokezwa na muktadha, ingawa maana ya “tena” haijaelezwa wazi katika kitenzi cha Kigiriki.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεκόπης
  choice: ulikatwa kutoka
  rationale: Kitenzi kina maana ya kukata kutoka au kuondoa kwa kukata; uchaguzi huu unahifadhi taswira ya kilimo bila kukichanganya na kuvunjwa kwa matawi.
- source_word: ἀγριελαίου
  choice: mzeituni wa mwituni
  rationale: Neno linamaanisha mzeituni usiopandwa au wa porini; “wa mwituni” ni Kiswahili cha kawaida kinachotofautisha mti huo na mzeituni uliopandwa.
- source_word: παρὰ φύσιν
  choice: kinyume cha asili
  rationale: Huhifadhi moja kwa moja utofautishaji wa Paulo kati ya jambo lililo kwa asili na lililo kinyume cha asili.
- source_word: ἐνεκεντρίσθης
  choice: ukapandikizwa
  rationale: “Kupandikiza” ndilo neno linalofaa kwa kuingiza kitawi katika mti mwingine; hali tendwa ya Kigiriki imehifadhiwa.
- source_word: καλλιέλαιον
  choice: mzeituni uliopandwa
  rationale: Hueleza mzeituni uliolimwa au kufugwa, tofauti na mzeituni wa mwituni, bila kutumia sifa ya kimadili kama “mzuri.”
- source_word: πόσῳ μᾶλλον
  choice: si zaidi sana
  rationale: Muundo huu wa swali la balagha unawasilisha hoja ya kutoka jambo gumu zaidi kwenda lililo rahisi zaidi kwa Kiswahili cha kawaida.
- source_word: οὗτοι οἱ κατὰ φύσιν
  choice: hawa, ambao ni matawi ya asili
  rationale: “Matawi” hayajasemwa wazi katika fungu hili la Kigiriki, lakini yanadokezwa kwa nguvu na sitiari ya mzeituni katika muktadha; yameongezwa kwa uwazi na kuwekewa tanbihi.
- source_word: ἐγκεντρισθήσονται
  choice: watapandikizwa
  rationale: Huhifadhi wakati ujao na hali tendwa; wazo la kurudishwa linaeleweka katika muktadha lakini halijaingizwa ndani ya kitenzi.
- source_word: τῇ ἰδίᾳ ἐλαίᾳ
  choice: katika mzeituni wao wenyewe
  rationale: “Katika” inafaa kwa taswira ya kupandikiza ndani ya mti, na “wao wenyewe” huhifadhi mkazo wa ἰδίᾳ kuhusu kuwa kwao.
theological_decisions:
- issue: Kama kutaja wazi kwamba “hawa” ni Israeli au Wayahudi
  choice: 'Kudumisha rejeo lisilotajwa kwa jina katika matini kuu: “hawa, ambao ni matawi ya asili.”'
  alternative: “Wayahudi hawa” au “Waisraeli hawa.”
  rationale: Muktadha wa Waroma 11 unatambulisha wanaorejelewa, lakini Kigiriki cha mstari huu hakitumii jina la kikabila. Kudumisha sitiari huepuka kuongeza zaidi ya yale yaliyosemwa.
- issue: Kama kuongeza “matawi” ingawa halipo wazi katika Kigiriki
  choice: Kuongeza “matawi” kwa ajili ya uwazi, huku tanbihi ikieleza nyongeza hiyo.
  alternative: “hawa walio wa asili.”
  rationale: Sitiari ya matawi yanayokatwa na kupandikizwa inatawala muktadha wa karibu. Nyongeza hii ni ndogo na huifanya sentensi ieleweke kwa msomaji wa kawaida bila kuamua utambulisho wao kwa jina.
- issue: Kama kutafsiri kitenzi cha mwisho kuwa “watapandikizwa tena”
  choice: Kutumia “watapandikizwa” katika matini kuu.
  alternative: “watapandikizwa tena” au “watapandikizwa kurudi.”
  rationale: Kurudi kunadokezwa wazi na muktadha na maneno “mzeituni wao wenyewe,” lakini kiambishi chenye maana ya “tena” hakipo katika kitenzi cha Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imehifadhi hoja ya balagha na sitiari ya kilimo. Kifungu “ambao kwa asili ulikuwa sehemu yake” kinafafanua uhusiano wa κατὰ φύσιν na mzeituni wa mwituni kwa namna ya kawaida katika Kiswahili bila kugeuza maana ya msingi.
