  text: εἰ δὲ χάριτι, οὐκέτι ἐξ ἔργων, ἐπεὶ ἡ χάρις οὐκέτι γίνεται ⸀χάρις.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/006.yaml
  text: But if by grace, it is no longer from works; otherwise grace no longer becomes grace.
translation:
  language: sw
  text: Lakini ikiwa ni kwa neema, basi si kwa matendo tena; la sivyo, neema haiwi neema tena.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χάριτι
  choice: kwa neema
  rationale: 'Inaonyesha msingi au njia ya uchaguzi uliotajwa katika muktadha: ni kwa neema.'
- source_word: ἐξ ἔργων
  choice: kwa matendo
  rationale: Kiswahili cha kawaida kinachoonyesha kuwa matendo si msingi au chanzo; ‘kutokana na matendo’ ni sahihi pia lakini si cha asili sana hapa.
- source_word: γίνεται
  choice: haiwi
  rationale: Huhifadhi maana ya kitenzi ‘kuwa/kufanyika’ bila kulazimisha tafsiri ya kiufundi; katika Kiswahili ‘haiwi neema’ ni ya kawaida na wazi.
theological_decisions:
- issue: Uhusiano kati ya neema na matendo
  choice: basi si kwa matendo tena
  alternative: basi haitokani na matendo tena
  rationale: Huhifadhi upinzani mkali wa Paulo kati ya msingi wa neema na msingi wa matendo bila kuongeza maelezo ya kimadhehebu.
- issue: Nguvu ya kauli ya mwisho
  choice: neema haiwi neema tena
  alternative: neema si neema tena
  rationale: ‘Haiwi’ inawakilisha γίνεται kwa uwazi na kuhifadhi muundo wa hoja kwamba kuchanganya msingi huo na matendo kungeondoa tabia ya neema kuwa neema.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni fupi na ya kimantiki, ikihifadhi marudio ya ‘tena’ na mvutano wa hoja ya Kigiriki.
