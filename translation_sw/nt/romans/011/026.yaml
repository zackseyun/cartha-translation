base_translation:
  language: en
  yaml_path: translation/nt/romans/011/026.yaml
  text: 'And in this way all Israel will be saved[a], just as it is written: “The Deliverer will come from Zion[c][b]; he will turn away ungodliness from Jacob.”'
translation:
  language: sw
  text: 'Na kwa njia hii Israeli wote[b] wataokolewa[a], kama ilivyoandikwa: “Mkombozi atakuja kutoka Sayuni;[c] ataondoa kutomcha Mungu kutoka kwa Yakobo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Na hivyo Israeli wote wataokolewa.” Neno la Kigiriki οὕτως linaweza kumaanisha “hivyo,” lakini hapa huenda linaonyesha njia au namna iliyoelezwa katika mistari iliyotangulia.
    reason: lexical_alternative
  - marker: b
    text: Maana ya “Israeli wote” inabishaniwa. Tafsiri inadumisha maneno ya Kigiriki bila kuamua kama Paulo anamaanisha Israeli ya kikabila kwa ujumla, mabaki yanayoamini, au watu wote wa Mungu.
    reason: alternative_reading
  - marker: c
    text: Baadhi hutafsiri ἐκ Σιὼν kuwa “kutoka ndani ya Sayuni.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: kwa njia hii
  rationale: Inaonyesha namna au mchakato uliotangulia katika muktadha, huku ikihifadhi uwezekano wa kutafsiriwa ‘hivyo.’
- source_word: πᾶς Ἰσραήλ
  choice: Israeli wote
  rationale: Huhifadhi maneno ya Kigiriki bila kuamua kama yanamaanisha Israeli ya kikabila kwa ujumla, mabaki ya waaminio, au watu wote wa Mungu.
- source_word: σωθήσεται
  choice: wataokolewa
  rationale: Wakati ujao wa kutendwa wa σῴζω una uzito wa wokovu katika muktadha wa Paulo.
- source_word: καθὼς γέγραπται
  choice: kama ilivyoandikwa
  rationale: Ni usemi wa kawaida na wa asili wa Kiswahili wa kuanzisha nukuu ya Maandiko.
- source_word: Ἥξει
  choice: atakuja
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida inayofaa mtindo wa unabii.
- source_word: ἐκ Σιὼν
  choice: kutoka Sayuni
  rationale: Huwakilisha chanzo kinachoonyeshwa na ἐκ kwa Kiswahili cha kawaida.
- source_word: ὁ ῥυόμενος
  choice: Mkombozi
  rationale: Hutoa uzito wa kishazi nomino kinachomtaja yule anayeokoa au kukomboa.
- source_word: ἀποστρέψει
  choice: ataondoa
  rationale: Katika muundo ἀποστρέψει ... ἀπό, Kiswahili ‘ataondoa ... katika’ huwasilisha kwa ufasaha wazo la kuyaondoa maovu mbali na Yakobo bila kudai kwamba Mungu mwenyewe ndiye anayeyaacha.
- source_word: ἀσεβείας
  choice: kutomcha Mungu
  rationale: Ni lugha ya sasa na inayoeleweka kwa hali ya kukosa uchaji na uaminifu kwa Mungu; wingi wa Kigiriki unaweza kuhusisha matendo ya aina hiyo.
- source_word: ἀπὸ Ἰακώβ
  choice: katika Yakobo
  rationale: Kwa kitenzi ‘ataondoa,’ ‘katika Yakobo’ ni muundo wa asili wa Kiswahili unaoonyesha kuyaondoa mambo hayo kutoka miongoni mwa watu wanaoitwa Yakobo.
theological_decisions:
- issue: Rejeo la ‘Israeli wote’
  choice: Maneno ‘Israeli wote’ yameachwa bila ufafanuzi wa kimafundisho.
  alternative: Israeli yote ya kikabila; mabaki yaliyoamini ndani ya Israeli; au watu wote wa Mungu pamoja na watu wa mataifa
  rationale: Kigiriki hakisuluhishi moja kwa moja mjadala huo; tafsiri inahifadhi mvutano wa kifasiri.
- issue: Utambulisho wa ‘Mkombozi’
  choice: ‘Mkombozi’ limeandikwa kwa herufi kubwa kama jina la cheo.
  alternative: mkombozi
  rationale: Katika muktadha Paulo anatumia nukuu hii kwa namna ya Kimasihi; herufi kubwa huonyesha matumizi ya cheo bila kuongeza jina lisilokuwamo katika maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo wa kinabii umehifadhiwa bila kuingiza msimamo wa dhehebu.
