id: ROM.11.12
reference: Romans 11:12
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἰ δὲ τὸ παράπτωμα αὐτῶν πλοῦτος κόσμου καὶ τὸ ἥττημα αὐτῶν πλοῦτος ἐθνῶν, πόσῳ μᾶλλον τὸ πλήρωμα αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/012.yaml
  text: If their trespass means riches for the world[a], and their loss means riches for the Gentiles[b], how much more will their fullness mean?
translation:
  language: sw
  text: Lakini ikiwa kosa lao limeleta utajiri kwa ulimwengu, na hasara yao[a] imeleta utajiri kwa watu wa Mataifa, je, utimilifu wao[b] utaleta utajiri zaidi kwa kiasi gani!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kushindwa kwao” au “kupungua kwao.”
    reason: lexical_alternative
  - marker: b
    text: Au “idadi yao kamili” au “kuingizwa kwao kikamilifu.”
    reason: alternative_reading
lexical_decisions:
- source_word: παράπτωμα
  choice: kosa
  rationale: Neno “kosa” linaonyesha hatua potovu au uvunjaji wenye uzito wa kimaadili bila kufafanua kupita kiasi aina ya kosa.
- source_word: πλοῦτος
  choice: utajiri
  rationale: “Utajiri” huhifadhi sitiari ya wingi wa baraka inayotumika katika hoja ya Paulo.
- source_word: κόσμου
  choice: ulimwengu
  rationale: “Ulimwengu” ni tafsiri pana na ya kawaida, bila kuufupisha moja kwa moja kuwa wanadamu wote.
- source_word: ἥττημα
  choice: hasara
  rationale: Neno la Kigiriki linaweza kumaanisha hasara, kushindwa, au kupungua. “Hasara” ni pana kiasi cha kutolazimisha maana moja, huku maana nyingine zikitajwa katika tanbihi.
- source_word: ἐθνῶν
  choice: watu wa mataifa
  rationale: Katika muktadha huu neno linawatofautisha wasio Wayahudi na Israeli; “watu wa mataifa” ni Kiswahili cha kawaida kinachoweka tofauti hiyo wazi.
- source_word: πόσῳ μᾶλλον
  choice: mkubwa zaidi kiasi gani
  rationale: Muundo huu unawasilisha hoja ya kutoka jambo dogo kwenda jambo kubwa zaidi kwa Kiswahili cha asili.
- source_word: πλήρωμα
  choice: utimilifu
  rationale: “Utimilifu” huhifadhi upana wa neno la Kigiriki, ambalo linaweza kuwa na maana ya idadi kamili, kuingizwa kikamilifu, au hali ya kutimia.
theological_decisions:
- issue: Maana ya τὸ πλήρωμα αὐτῶν (“utimilifu wao”)
  choice: utimilifu wao
  alternative: idadi yao kamili; kuingizwa kwao kikamilifu; kurejeshwa kwao kikamilifu
  rationale: Kauli ya Paulo ni fupi na inaweza kueleweka kwa namna ya kiidadi au ya hali. Tafsiri kuu haiamui mjadala huo, na tanbihi inaonyesha maana kuu zinazowezekana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Vitenzi “limeleta” na “imeleta” vinaweka wazi uhusiano unaodokezwa na vifungu nomino vya Kigiriki; kifungu cha mwisho pia kinakamilisha ellipsisi kwa kurudia wazo la utajiri. Alama za tanbihi zimewekwa moja kwa moja baada ya maneno yanayohusika.
