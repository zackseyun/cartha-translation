  text: ὅτι οὓς προέγνω, καὶ προώρισεν συμμόρφους τῆς εἰκόνος τοῦ υἱοῦ αὐτοῦ, εἰς τὸ εἶναι αὐτὸν πρωτότοκον ἐν πολλοῖς ἀδελφοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/029.yaml
  text: For those whom he foreknew[a], he also predestined to be conformed to the image of his Son[b], so that he might be the firstborn among many brothers.
translation:
  language: sw
  text: Kwa maana wale aliowajua tangu awali[a], aliwaamulia tangu awali wafananishwe na mfano wa Mwana wake, ili yeye awe mzaliwa wa kwanza miongoni mwa ndugu wengi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliowajua mapema.” Wengine huelewa “aliowajua” hapa katika maana ya uhusiano, yaani, “aliowaelekezea upendeleo wake tangu awali.”
    reason: alternative_reading
  - marker: b
    text: Neno la Kigiriki limetumika katika umbo la kisarufi la kiume, lakini katika familia ya Mungu linaweza kuwahusu wanaume na wanawake.
    reason: cultural_note
lexical_decisions:
- source_word: ὅτι
  choice: Kwa maana
  rationale: Huonyesha kuwa kauli hii inatoa msingi au maelezo ya kauli iliyotangulia.
- source_word: προέγνω
  choice: aliowajua tangu awali
  rationale: Huhifadhi maana ya msingi ya kujua kabla bila kuamua kama kujua huku ni ufahamu wa mapema tu au uhusiano wa pekee uliowekwa mapema.
- source_word: προώρισεν
  choice: aliwachagulia tangu awali
  rationale: Huwasilisha tendo la kuwawekea watu kusudi au hatima mapema; muundo huu ni wa kawaida zaidi katika Kiswahili kuliko istilahi nzito, huku wazo la uamuzi wa awali likibaki wazi.
- source_word: συμμόρφους
  choice: wafananishwe
  rationale: Huonyesha kufanywa wawe na umbo au kufanana, na hivyo huhifadhi maana ya mabadiliko kuelekea mfano wa Mwana.
- source_word: εἰκόνος
  choice: mfano
  rationale: Ni neno la kawaida la Kiswahili kwa εἰκών katika muktadha wa kufanana na Mwana na linahifadhi mwangwi wa kibiblia wa sura au mfano.
- source_word: υἱοῦ
  choice: Mwana
  rationale: Huhifadhi moja kwa moja cheo cha uhusiano kilicho wazi katika Kigiriki.
- source_word: εἰς τὸ εἶναι
  choice: ili ... awe
  rationale: Huonyesha kusudi, bila kuondoa kabisa uwezekano wa kueleweka pia kama matokeo.
- source_word: πρωτότοκον
  choice: mzaliwa wa kwanza
  rationale: Huhifadhi sitiari ya Kigiriki na maana zake za uzaliwa wa kwanza na ukuu, bila kuibadili kuwa ufafanuzi pekee wa cheo.
- source_word: ἀδελφοῖς
  choice: ndugu
  rationale: Katika Kiswahili, 'ndugu' ni tafsiri ya kawaida ya ἀδελφοί na inaweza kuwahusu wanaume pamoja na wanawake; tanbihi inaeleza umbo la kisarufi la Kigiriki.
theological_decisions:
- issue: Ikiwa προέγνω ifafanuliwe kwa namna inayotatua mjadala wa maarifa ya awali na uteuzi.
  choice: aliowajua tangu awali
  alternative: aliowapenda au kuwaweka katika uhusiano naye tangu awali
  rationale: Tafsiri inafuata maana ya wazi ya kitenzi na kuacha wazi uzito wake wa kiuhusiano na kiteolojia badala ya kuingiza msimamo wa dhehebu.
- issue: Ikiwa προώρισεν itafsiriwe kwa istilahi ya kiteolojia au kwa usemi wa Kiswahili wa kawaida.
  choice: aliwachagulia tangu awali
  alternative: aliwaamulia tangu awali / aliwawekea hatima tangu awali
  rationale: Usemi uliochaguliwa unaonyesha uamuzi wa Mungu wa mapema wenye lengo maalumu bila kudokeza kwamba watu hawana nafasi yoyote ya kuitikia, jambo ambalo neno lenyewe halifafanui hapa.
- issue: Ikiwa ἀδελφοῖς ionyeshwe kama ya kiume pekee.
  choice: ndugu
  alternative: ndugu wa kiume
  rationale: Kigiriki kina umbo la wingi wa kiume, lakini katika muktadha wa familia ya Mungu linaweza kujumuisha wanaume na wanawake; neno la Kiswahili 'ndugu' huwasilisha maana hiyo kwa kawaida.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imehifadhi msururu wa hoja wa Paulo, lakini imetumia miundo inayoeleweka kwa msomaji wa kawaida. 'Mzaliwa wa kwanza' imeachwa kama sitiari ya kibiblia, na tanbihi zimewekwa baada ya maneno yanayohusika.
