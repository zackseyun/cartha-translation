base_translation:
  language: en
  yaml_path: translation/nt/romans/008/030.yaml
  text: And those whom he predestined[a], he also called; and those whom he called, he also justified; and those whom he justified[b], he also glorified.
translation:
  language: sw
  text: Na wale aliowaamulia tangu awali[a], hao pia aliwaita; na wale aliowaita, hao pia aliwahesabia haki; na wale aliowahesabia haki, hao pia aliwatukuza[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “aliwapangia tangu awali.”
    reason: lexical_alternative
  - marker: b
    text: 'Kigiriki: “aliwatukuza.” Wengine huelewa wakati uliopita hapa kuwa unazungumzia utukufu wa wakati ujao ulio hakika sana hivi kwamba unaelezwa kana kwamba tayari umetimia.'
    reason: alternative_reading
lexical_decisions:
- source_word: προώρισεν
  choice: aliwaamulia tangu awali
  rationale: Kitenzi hiki humaanisha kuamua au kupanga mapema. “Aliwaamulia tangu awali” kinaonyesha uamuzi wa kabla bila kukibadili kuwa kitenzi cha kuchagua wala kuingiza mfumo fulani wa kimadhehebu.
- source_word: ἐκάλεσεν
  choice: aliwaita
  rationale: “Aliwaita” ni tafsiri ya kawaida na ya moja kwa moja, nayo inadumisha mfuatano wa hoja ya Paulo bila2 bila kufafanua zaidi namna ya mwito huo.
- source_word: ἐδικαίωσεν
  choice: aliwahesabia haki
  rationale: Katika matumizi ya Paulo, kitenzi hiki mara nyingi kina maana ya kimahakama ya kumtangaza au kumwona mtu kuwa mwenye haki. “Aliwahesabia haki” ni usemi unaoeleweka na wenye uzito unaofaa katika Kiswahili.
- source_word: ἐδόξασεν
  choice: aliwatukuza
  rationale: Umbo la Kigiriki ni wakati uliopita (aoristi). Tafsiri ya wakati uliopita inadumisha mfuatano wa balagha wa Paulo na haibadili kimya kimya tendo hili kuwa la wakati ujao.
- source_word: οὓς ... τούτους
  choice: wale ... hao
  rationale: Muundo unaorudiwa unaonyesha kwamba kundi lilelile linafuatwa katika kila hatua. “Wale ... hao” ni muundo wa asili wa Kiswahili unaohifadhi msisitizo huo.
- source_word: καὶ
  choice: pia
  rationale: Hapa καί ina nguvu ya kuongeza hatua moja kwa nyingine; “pia” linaonyesha wazi mwendelezo huo.
- source_word: δὲ
  choice: na
  rationale: δέ ni kiunganishi hafifu katika muktadha huu, si alama ya upinzani mkali; “na” linaendana na mtiririko wa sentensi.
theological_decisions:
- issue: Ikiwa προώρισεν ilainishwe ili kuepuka maana zinazobishaniwa kimadhehebu
  choice: aliwaamulia tangu awali
  alternative: aliwapangia tangu awali
  rationale: Kigiriki chenyewe kinaeleza uamuzi wa kabla. Tafsiri inadumisha wazo hilo lakini haiongezi maelezo yanayoamua mabishano ya kitheolojia yaliyo nje ya mstari huu.
- issue: Ikiwa ἐδόξασεν itafsiriwe kwa wakati uliopita au ujao
  choice: aliwatukuza
  alternative: atawatukuza
  rationale: Kigiriki kina aoristi elekezi, kwa hiyo matini kuu inadumisha wakati uliopita. Kwa kuwa wengine huona tendo hilo kuwa utukufu wa baadaye unaosemwa kwa uhakika kana kwamba tayari umetimia, uwezekano huo umewekwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Marudio ya “wale ... hao pia” yamehifadhiwa ili kuonyesha mnyororo wenye msisitizo katika Kigiriki. Tanbihi [b] imewekwa baada ya “aliwatukuza,” neno linalohusika moja kwa moja.
