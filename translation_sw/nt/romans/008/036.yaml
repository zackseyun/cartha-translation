  text: καθὼς γέγραπται ὅτι Ἕνεκεν σοῦ θανατούμεθα ὅλην τὴν ἡμέραν, ἐλογίσθημεν ὡς πρόβατα σφαγῆς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/036.yaml
  text: 'Just as it is written: “For your sake we are being put to death all day long[a]; we were counted as sheep for slaughter.”'
translation:
  language: sw
  text: 'Kama ilivyoandikwa: “Kwa ajili yako tunauawa siku nzima; tulihesabiwa kama kondoo wa kuchinjwa.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: Kama ilivyoandikwa
  rationale: Ni njia ya kawaida na yenye heshima ya kuanzisha nukuu ya Maandiko, huku ikihifadhi maana ya kulinganisha ya καθὼς na hali yenye kudumu ya γέγραπται.
- source_word: Ἕνεκεν σοῦ
  choice: Kwa ajili yako
  rationale: Inahifadhi sababu na usemi wa moja kwa moja kwa Mungu bila kuongeza ufafanuzi.
- source_word: θανατούμεθα
  choice: tunauawa
  rationale: Kauli ya kutendwa katika wakati wa sasa inaonyesha tendo linaloendelea la kuuawa; ‘tunauawa’ ni ya asili na wazi katika Kiswahili.
- source_word: ὅλην τὴν ἡμέραν
  choice: mchana kutwa
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha muda wote wa siku na hali ya kuendelea.
- source_word: ἐλογίσθημεν
  choice: tumehesabiwa
  rationale: Inadumisha wazo la kuhesabiwa au kuonwa kuwa kitu fulani, na kauli timilifu ya Kiswahili inaonyesha hali inayotokana na tendo hilo.
- source_word: ὡς πρόβατα σφαγῆς
  choice: kuwa kama kondoo wa kuchinjwa
  rationale: Inahifadhi ulinganisho na taswira ya kondoo waliokusudiwa kuchinjwa bila kuibana kuwa dhabihu kwa maana maalumu.
theological_decisions:
- issue: Nukuu ya Zaburi 44:22 katika muktadha wa mateso
  choice: Kudumisha maana ya pamoja na inayoendelea ya watu wanaotendewa kama waliokusudiwa kufa.
  alternative: Kutafsiri kwa namna inayotaja hasa kuuawa kwa ajili ya imani.
  rationale: Kigiriki kinanukuu ombolezo hilo moja kwa moja bila kulifungamanisha na aina moja tu ya kifo; tafsiri haipaswi kuongeza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi na chenye hadhi. ‘Mchana kutwa’ ni usemi wa kawaida na wenye nguvu; ‘kondoo wa kuchinjwa’ huhifadhi taswira ya chanzo.
