id: ROM.8.13
reference: Romans 8:13
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἰ γὰρ κατὰ σάρκα ζῆτε μέλλετε ἀποθνῄσκειν, εἰ δὲ πνεύματι τὰς πράξεις τοῦ σώματος θανατοῦτε, ζήσεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/013.yaml
  text: For if you live according to the flesh[a], you are about to die; but if by the Spirit you put to death the deeds of the body, you will live.
translation:
  language: sw
  text: Kwa maana, mkiishi kwa kufuata mwili[a], mnakwenda kufa; lakini kama kwa Roho mkiyaua matendo ya mwili, mtaishi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno “mwili” hapa hutumiwa katika muktadha wa kimaadili, kinyume cha maisha yanayoongozwa na Roho; halimaanishi tu mwili wa kimwili.
    reason: semantic_note
lexical_decisions:
- source_word: γὰρ
  choice: Kwa maana
  rationale: Inaendeleza nguvu ya ufafanuzi inayounganisha sentensi hii na hoja iliyotangulia.
- source_word: κατὰ σάρκα
  choice: kwa kufuata mwili
  rationale: Inahifadhi sitiari ya Paulo na maana ya κατά bila kuifasiri moja kwa moja kuwa ‘asili ya dhambi’; tanbihi inaeleza muundo wa karibu zaidi na Kigiriki.
- source_word: ζῆτε
  choice: mkiishi
  rationale: Huwakilisha hali ya sharti pamoja na tendo la kuishi linaloendelea.
- source_word: μέλλετε ἀποθνῄσκειν
  choice: mnakwenda kufa
  rationale: Ni Kiswahili cha sasa na cha kawaida kinachoonyesha matarajio ya kifo yaliyomo katika μέλλω pamoja na kitenzi-jina, bila kulazimisha maana ya muda wa papo hapo.
- source_word: πνεύματι
  choice: kwa Roho
  rationale: Kiambishi cha njia kinawakilishwa na ‘kwa’; muktadha wa Waroma 8 unaelekeza kwa Roho Mtakatifu, hivyo herufi kubwa imetumiwa.
- source_word: τὰς πράξεις τοῦ σώματος
  choice: matendo ya mwili
  rationale: Tafsiri hii ni ya moja kwa moja, ya kawaida, na inadumisha uhusiano wa kimilikishi wa Kigiriki.
- source_word: θανατοῦτε
  choice: mnayaua
  rationale: Huwasilisha sitiari yenye nguvu ya kuyafanya matendo ya mwili yafe kwa lugha ya Kiswahili iliyo wazi na ya sasa.
- source_word: ζήσεσθε
  choice: mtaishi
  rationale: Huwakilisha kwa usahihi wakati ujao wa Kigiriki.
theological_decisions:
- issue: Ikiwa πνεύματι inamaanisha Roho Mtakatifu au roho ya mwanadamu
  choice: Roho Mtakatifu
  alternative: roho ya mwanadamu, au ‘roho’ kwa makusudi bila kubainisha
  rationale: Mfululizo wa hoja katika Waroma 8 unamtambulisha Roho wa Mungu kuwa ndiye anayewawezesha waamini; herufi kubwa inaonyesha usomaji huo bila kuongeza jina ‘Mtakatifu’ lisilomo wazi katika aya.
- issue: Maana ya σάρξ katika tofauti ya kimaadili ya Paulo
  choice: mwili, kama sitiari iliyohifadhiwa
  alternative: asili ya dhambi
  rationale: Neno ‘mwili’ huhifadhi picha na mvutano wa istilahi za Paulo, hasa kwa kuwa ‘mwili’ pia hutokea katika τὸ σῶμα ndani ya aya; tanbihi huzuia msomaji kulielewa kama tishu za mwili peke yake bila kufunga maana katika mfumo mmoja wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa ‘mkiishi … mnakwenda kufa’ ni wa asili katika Kiswahili na unadumisha tofauti kati ya hali ya sasa na matokeo yanayotarajiwa; ‘mnayaua matendo’ huhifadhi sitiari kali ya Kigiriki.
