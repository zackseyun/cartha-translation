id: ROM.8.11
reference: Romans 8:11
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἰ δὲ τὸ πνεῦμα τοῦ ἐγείραντος ⸀τὸν Ἰησοῦν ἐκ νεκρῶν οἰκεῖ ἐν ὑμῖν, ὁ ἐγείρας ⸂ἐκ νεκρῶν Χριστὸν Ἰησοῦν⸃ ζῳοποιήσει καὶ τὰ θνητὰ σώματα ὑμῶν διὰ ⸂τὸ ἐνοικοῦν αὐτοῦ πνεῦμα⸃ ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/011.yaml
  text: And if the Spirit of the one who raised Jesus from the dead dwells in you[b][a], the one who raised Messiah Jesus from the dead will also give life to your mortal bodies through his Spirit dwelling in you.
translation:
  language: sw
  text: Lakini ikiwa Roho wa yule aliyemfufua Yesu kutoka kwa wafu anakaa ndani yenu, yule aliyemfufua Masihi Yesu[b] kutoka kwa wafu atazipa uhai pia miili yenu yenye kufa, kwa sababu ya Roho wake anayekaa ndani yenu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa njia ya Roho wake anayekaa ndani yenu.”
    reason: alternative_reading
  - marker: b
    text: 'Kigiriki: “Kristo Yesu”; hapa imetafsiriwa “Masihi Yesu” kwa sababu Χριστός ina nguvu ya cheo, yaani Mtiwa-Mafuta.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεῦμα
  choice: Roho
  rationale: Katika hoja ya Paulo, neno hili linamtaja Roho wa Mungu; herufi kubwa hutofautisha rejeo hili na roho ya mwanadamu.
- source_word: ἐγείραντος / ἐγείρας
  choice: aliyemfufua
  rationale: “Kufufua” ndilo neno la kawaida na la wazi la Kiswahili kwa tendo la Mungu la kumwinua Yesu kutoka kwa wafu.
- source_word: ἐκ νεκρῶν
  choice: kutoka kwa wafu
  rationale: Kauli hii ni ya kawaida katika Kiswahili cha Biblia na inadumisha maana ya kufufuliwa kutoka miongoni mwa wafu bila kuipanua.
- source_word: οἰκεῖ / ἐνοικοῦν
  choice: anakaa ndani yenu / anayekaa ndani yenu
  rationale: “Kukaa ndani” ni lugha ya kawaida inayoonyesha uwepo wa kudumu na kuhifadhi mwangwi wa kitenzi hicho katika sehemu zote mbili za aya.
- source_word: Χριστὸν Ἰησοῦν
  choice: Masihi Yesu
  rationale: “Masihi” huhifadhi nguvu ya Χριστός kama cheo cha Mtiwa-Mafuta badala ya kuifanya ionekane kama jina la ukoo.
- source_word: ζῳοποιήσει
  choice: ataipa uhai
  rationale: Kauli hii ya Kiswahili ni wazi, ya asili, na inadumisha ahadi ya wakati ujao ya kuifanya miili iwe hai.
- source_word: θνητὰ σώματα
  choice: miili yenu yenye kufa
  rationale: Hii inadumisha uhalisi wa mwili na hali yake ya kutoweza kuepuka kifo, bila kuigeuza kuwa usemi unaomaanisha tu miili iliyo wagonjwa au inayodhoofika sasa.
- source_word: διὰ τὸ ἐνοικοῦν αὐτοῦ πνεῦμα
  choice: kwa sababu ya Roho wake anayekaa ndani yenu
  rationale: διά pamoja na kishamirisho cha accusative katika matini iliyotolewa huelekea kuonyesha sababu; tafsiri hii inafuata sarufi ya matini kuu huku usomaji wa chombo ukihifadhiwa katika tanbihi.
theological_decisions:
- issue: Nguvu ya διὰ pamoja na accusative katika kishazi cha mwisho
  choice: kwa sababu ya Roho wake anayekaa ndani yenu
  alternative: kwa njia ya Roho wake anayekaa ndani yenu
  rationale: Matini iliyotolewa ina διά pamoja na accusative, ambayo kwa kawaida huonyesha sababu. Kwa kuwa tofauti ya kisarufi inaweza kuathiri jinsi tendo la kutoa uhai linavyoeleweka, matini kuu haibadili sababu kuwa chombo, lakini njia nyingine imeonyeshwa wazi katika tanbihi.
- issue: Nguvu ya cheo katika Χριστὸν Ἰησοῦν
  choice: Masihi Yesu
  alternative: Kristo Yesu
  rationale: “Masihi” huonyesha wazi kuwa Χριστός ni cheo cha Mtiwa-Mafuta. “Kristo Yesu” ni umbo lililozoeleka zaidi katika mapokeo mengi ya Kiswahili, hivyo limewekwa kama uwezekano wa kileksika katika tanbihi bila kuingiza msimamo wa dhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye heshima lakini kinachoeleweka kwa msomaji wa kawaida. Mpangilio wa sentensi umehifadhi uhusiano wa sharti na matokeo. “Anakaa ndani yenu” imetumiwa badala ya msamiati mzito wa kitaalamu, na “miili yenu yenye kufa” inadumisha maana halisi ya miili iliyo chini ya kifo.
