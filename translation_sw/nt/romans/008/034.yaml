  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: τίς ὁ ⸀κατακρινῶν; ⸀Χριστὸς ὁ ἀποθανών, μᾶλλον ⸀δὲ ⸀ἐγερθείς, ὅς ⸀καί ἐστιν ἐν δεξιᾷ τοῦ θεοῦ, ὃς καὶ ἐντυγχάνει ὑπὲρ ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/034.yaml
  text: Who is the one condemning? Messiah Jesus is the one who died—more than that[a], who was raised—who is also at the right hand of God[d][c][b], who also intercedes for us.
translation:
  language: sw
  text: Ni nani anayetoa hukumu ya hatia? Masihi[a] ndiye aliyekufa—zaidi ya hayo, ndiye aliyefufuliwa[b]—ambaye pia yuko katika mkono wa kuume wa Mungu[c], ambaye pia anatuombea[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Kristo.”
    reason: lexical_alternative
  - marker: b
    text: 'Kigiriki kimetumia kauli ya kutendwa: “aliyefufuliwa”; si “aliyefufuka.”'
    reason: alternative_reading
  - marker: c
    text: “Mkono wa kuume wa Mungu” ni usemi wa kibiblia unaoonyesha nafasi ya heshima na mamlaka kuu.
    reason: cultural_note
  - marker: d
    text: Au, “anaingilia kati kwa ajili yetu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατακρινῶν
  choice: anayetoa hukumu ya hatia
  rationale: Kirai hiki kinaonyesha tendo la kuhukumu na kutangaza hatia, si kuhukumu kwa maana pana tu. Muundo wa kishiriki chenye kibainishi umetafsiriwa kama mtu anayefanya tendo hilo, huku kitu kinachohukumiwa kikibaki bila kutajwa kama ilivyo katika Kigiriki.
- source_word: Χριστός
  choice: Masihi
  rationale: Hapa Χριστός limetumiwa kama cheo chenye maana ya Mpakwa-Mafuta. 'Masihi' huhifadhi maana hiyo badala ya kulitumia kama jina tu. Neno 'Yesu' halijaongezwa kwa sababu halimo katika matini ya Kigiriki ya aya hii.
- source_word: ἀποθανών
  choice: aliyekufa
  rationale: Kishiriki cha wakati uliopita kimetolewa kwa kishazi rahisi cha Kiswahili kinachoonyesha tukio la kihistoria.
- source_word: μᾶλλον δὲ
  choice: naam, zaidi ya hayo
  rationale: Usemi huu unaendeleza hoja kwa msisitizo kutoka kifo cha Masihi hadi kufufuliwa kwake, bila kuonyesha kwamba kifo kinakanushwa.
- source_word: ἐγερθείς
  choice: aliyefufuliwa
  rationale: Muundo wa kutendwa umehifadhiwa, hivyo aya inasema kwamba Masihi alifufuliwa badala ya kuubadili usemi kuwa wa kutenda.
- source_word: ἐν δεξιᾷ τοῦ θεοῦ
  choice: yuko mkono wa kuume wa Mungu
  rationale: Huu ni usemi wa kibiblia unaohifadhi picha ya asili na kueleza nafasi ya heshima na mamlaka karibu na Mungu.
- source_word: ἐντυγχάνει
  choice: anatuombea
  rationale: Katika muktadha huu kitenzi kina maana ya kuingilia kati kwa ajili ya wengine; 'anatuombea' ni Kiswahili cha kawaida na chenye uzito unaofaa.
- source_word: ὑπὲρ ἡμῶν
  choice: anatuombea
  rationale: Kiambishi cha yambwa '-tu-' pamoja na kitenzi 'ombea' kinaeleza kwa kawaida kwamba tendo hilo linafanywa kwa ajili yetu.
theological_decisions:
- issue: Χριστός kama cheo cha kimasiya
  choice: Masihi
  alternative: Kristo
  rationale: Tafsiri inahifadhi maana ya cheo 'Mpakwa-Mafuta' katika hoja ya Paulo. 'Kristo' limewekwa kama tafsiri mbadala inayojulikana.
- issue: Kauli ya ἐγερθείς
  choice: aliyefufuliwa
  alternative: aliyefufuka
  rationale: Kauli ya kutendwa ya Kigiriki imehifadhiwa ili kutobadili namna matini inavyowasilisha ufufuo kama tendo lililotendwa kwa Masihi.
- issue: Kumtaja Yesu katika aya
  choice: Masihi
  alternative: Masihi Yesu
  rationale: Matini ya SBLGNT iliyotolewa ina Χριστός pekee, bila Ἰησοῦς; kwa hiyo jina 'Yesu' halijaongezwa licha ya kuwepo katika safu ya ushauri ya Kiingereza.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa swali la balagha na mfululizo wa vishazi kuhusu Masihi umehifadhiwa. Alama za vistari virefu zinaonyesha msisitizo wa mpito kutoka kifo hadi kufufuliwa.
