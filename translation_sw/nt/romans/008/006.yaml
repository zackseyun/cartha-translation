  text: Kwa maana nia ya mwili[a] ni kifo, lakini nia ya Roho[b] ni uzima na amani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “asili ya dhambi.”
    reason: lexical_alternative
  - marker: b
