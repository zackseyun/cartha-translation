lexical_decisions:
- source_word: γὰρ
  choice: Kwa maana
  rationale: Inaonyesha kwamba kauli hii inafafanua hoja iliyotangulia kwa Kiswahili cha kawaida na chenye heshima.
- source_word: φρόνημα
  choice: mtazamo
  rationale: Neno hili linaonyesha mwelekeo au namna ya kudumu ya kufikiri, si tendo la akili pekee.
- source_word: σάρξ
  choice: mwili
  rationale: Linahifadhi istilahi kuu ya Paulo na mvutano wake wa kitheolojia bila kuifasiri moja kwa moja kuwa asili ya dhambi.
- source_word: θάνατος
  choice: kifo
  rationale: Ni tafsiri ya moja kwa moja inayohifadhi uzito wa kimwili na wa kitheolojia wa neno.
- source_word: πνεῦμα
  choice: Roho
  rationale: Muktadha wa Warumi 8 unaelekeza hasa kwa Roho Mtakatifu, huku uwezekano wa maana ya roho ukitajwa katika tanbihi.
- source_word: ζωή
  choice: uzima
  rationale: Ni neno la kawaida la kibiblia linalofaa katika ulinganisho huu na kifo.
- source_word: εἰρήνη
  choice: amani
  rationale: Ni tafsiri ya kawaida inayohifadhi upana wa maana ya kifungu.
theological_decisions:
- issue: Ikiwa πνεῦμα inamaanisha Roho Mtakatifu au roho ya mwanadamu
  choice: Roho Mtakatifu
  alternative: roho ya mwanadamu au roho kwa maana ya jumla
  rationale: Katika muktadha wa karibu wa Warumi 8, Paulo anarudia kumtaja Roho kama mtendaji wa kimungu anayeleta uzima; matumizi ya herufi kubwa yanaonyesha uamuzi huo bila kuficha uwezekano mwingine.
- issue: Ikiwa σάρξ itafsiriwe moja kwa moja au ifafanuliwe kiuhakiki
  choice: mwili
  alternative: asili ya dhambi
  rationale: “Mwili” huhifadhi msamiati na mvutano wa hoja ya Paulo; “asili ya dhambi” ni tafsiri ya maana inayowezekana lakini finyu zaidi, hivyo imewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo mfupi na ulinganifu wa kifo dhidi ya uzima na amani umehifadhiwa.
