  text: The Spirit himself testifies with our spirit that we are God's children[a][b][c].
translation:
  language: sw
  text: Roho mwenyewe hushuhudia pamoja na roho zetu kwamba sisi ni watoto wa Mungu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Roho mwenyewe hutoa ushahidi pamoja na roho zetu kwamba sisi ni watoto wa Mungu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸ τὸ πνεῦμα
  choice: Roho mwenyewe
  rationale: Muundo wenye αὐτό unasisitiza mhusika. Kiswahili hutumia kwa kawaida ‘mwenyewe’ kuonyesha msisitizo huo na utendaji binafsi wa Roho.
- source_word: συμμαρτυρεῖ
  choice: hushuhudia pamoja na
  rationale: Kitenzi kina maana ya kutoa ushuhuda pamoja na au sambamba na mwingine; tafsiri hii inadumisha kiambishi συν- na ni ya kawaida katika Kiswahili.
- source_word: τῷ πνεύματι ἡμῶν
  choice: pamoja na roho zetu
  rationale: 'Dativi inaeleweka vizuri kama ushirika au uandamani: Roho hushuhudia pamoja na roho zetu, si kwa roho zetu tu.'
- source_word: ὅτι ἐσμὲν
  choice: kwamba sisi ni
  rationale: ὅτι huanzisha yaliyomo katika ushuhuda. ‘Sisi’ inaweka wazi nafsi ya wingi bila kuongeza dai jipya.
- source_word: τέκνα θεοῦ
  choice: watoto wa Mungu
  rationale: τέκνα ni watoto bila kuwabainisha kuwa wana wa kiume; muundo huu ni wa asili, wazi, na unahifadhi uhusiano wa kifamilia.
theological_decisions:
- issue: Uhusiano unaoonyeshwa na συμμαρτυρεῖ na τῷ πνεύματι ἡμῶν
  choice: Roho hushuhudia pamoja na roho zetu
  alternative: Roho huzishuhudia roho zetu
  rationale: Maana ya ushuhuda wa pamoja inadumisha kwa uwazi nguvu ya kiambishi συν- na uchanganuzi wa dativi kama uandamani, huku tanbihi ikihifadhi uwezekano wa kuielewa kama ushuhuda unaoelekezwa kwa roho zetu.
- issue: Lugha binafsi kwa πνεῦμα
  choice: Roho mwenyewe
  alternative: Roho yenyewe
  rationale: Ingawa πνεῦμα ni nomino ya jinsia ya kati katika Kigiriki, Kiswahili hakihitaji kuiga jinsia hiyo ya kisarufi. ‘Mwenyewe’ ni lugha ya kawaida kwa mtendaji binafsi na inadumisha msisitizo wa αὐτό.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Hushuhudia pamoja na’ ni wazi kwa msomaji wa kawaida na huhifadhi kwa karibu maana ya Kigiriki. Umbo la wingi ‘roho zetu’ linapatana na ‘sisi’ na ni la asili zaidi kuliko ‘roho yetu’ katika muktadha huu.
