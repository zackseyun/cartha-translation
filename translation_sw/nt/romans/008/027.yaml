  yaml_path: translation/nt/romans/008/027.yaml
  text: And he who searches hearts knows what the mindset of the Spirit is, because he intercedes for the saints according to God.
translation:
  language: sw
  text: Naye anayechunguza mioyo anajua nia ya Roho ni nini, kwa sababu huwaombea watakatifu kwa kadiri ya Mungu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kulingana na mapenzi ya Mungu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐραυνῶν
  choice: anayechunguza
  rationale: Neno hili linaonyesha uchunguzi wa ndani wenye makini; “anayechunguza mioyo” ni Kiswahili cha kawaida na chenye heshima.
- source_word: καρδίας
  choice: mioyo
  rationale: Huhifadhi sitiari ya kibiblia ya καρδία bila kuifafanua kupita kiasi kuwa akili au nafsi za ndani.
- source_word: τί τὸ φρόνημα
  choice: nia ... ni nini
  rationale: Katika muktadha huu φρόνημα ni mwelekeo wa fikira au kusudi la ndani; “nia” ni ya asili zaidi kwa Kiswahili kuliko tafsiri nzito ya “mtazamo wa akili.”
- source_word: τοῦ πνεύματος
  choice: ya Roho
  rationale: Muktadha wa Waroma 8 unaonyesha Roho Mtakatifu, hivyo herufi kubwa inafaa.
- source_word: ἐντυγχάνει
  choice: huwaombea
  rationale: Huonyesha tendo la kusihi kwa niaba ya wengine katika muktadha wa sala, kwa lugha inayoeleweka kwa urahisi.
- source_word: ὑπὲρ ἁγίων
  choice: watakatifu
  rationale: “Huwaombea watakatifu” huwasilisha ὑπέρ pamoja na jina katika hali ya umilikishi kwa Kiswahili cha asili, huku ikidumisha istilahi ya kawaida ya Paulo.
- source_word: κατὰ θεὸν
  choice: kulingana na Mungu
  rationale: Hufuata kwa karibu usemi mfupi wa Kigiriki bila kuongeza wazi neno “mapenzi,” ambalo halimo katika matini.
theological_decisions:
- issue: Iwapo κατὰ θεὸν ifafanuliwe kuwa “kulingana na mapenzi ya Mungu”
  choice: kulingana na Mungu
  alternative: kulingana na mapenzi ya Mungu
  rationale: Huenda maana inayokusudiwa ni kupatana na mapenzi ya Mungu, lakini Kigiriki hakitaji “mapenzi” waziwazi. Matini kuu inadumisha ufupi na mvutano wa asili, na tanbihi inatoa ufafanuzi unaowezekana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umewekwa wazi kwa msomaji wa kawaida bila kupoteza sitiari ya “mioyo,” utambulisho wa “Roho,” au ufupi wenye utata wa κατὰ θεὸν.
