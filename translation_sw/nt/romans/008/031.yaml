  text: Τί οὖν ἐροῦμεν πρὸς ταῦτα; εἰ ὁ θεὸς ὑπὲρ ἡμῶν, τίς καθ’ ἡμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/031.yaml
  text: What then shall we say to these things? If God is for us[b][a], who is against us?
translation:
  language: sw
  text: Basi, tuseme nini kuhusu mambo haya?[a] Ikiwa Mungu yuko upande wetu,[b] ni nani aliye dhidi yetu?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Basi, tuseme nini kwa mambo haya?”
    reason: lexical_alternative
  - marker: b
    text: Au, “Kwa kuwa Mungu yuko upande wetu, ni nani aliye dhidi yetu?”
    reason: alternative_reading
lexical_decisions:
- source_word: Τί οὖν ἐροῦμεν
  choice: Basi, tuseme nini
  rationale: Muundo huu wa Kiswahili unaonyesha hitimisho linalotokana na hoja iliyotangulia na kuhifadhi swali la kimjadala la Kigiriki kwa lugha ya kawaida na yenye hadhi.
- source_word: πρὸς ταῦτα
  choice: kuhusu mambo haya
  rationale: Katika muktadha huu πρὸς yaonyesha kile ambacho maneno yanarejelea. ‘Kuhusu mambo haya’ ni ya asili zaidi katika Kiswahili kuliko tafsiri ya neno kwa neno ‘kwa mambo haya’.
- source_word: εἰ
  choice: Ikiwa
  rationale: ‘Ikiwa’ huhifadhi umbo la sharti la Kigiriki bila kudokeza kwamba Paulo ana shaka; muktadha huupa usemi nguvu ya hoja inayodhani jambo hilo kuwa kweli.
- source_word: ὁ θεὸς ὑπὲρ ἡμῶν
  choice: Mungu yuko upande wetu
  rationale: Hapa ὑπέρ huonyesha kuwa Mungu anawatetea au anawaunga mkono walio wake. ‘Yuko upande wetu’ ni wazi na ya kawaida, na huepuka maana isiyo kamili ya ‘kwa ajili yetu’ katika sentensi hii.
- source_word: τίς καθ’ ἡμῶν
  choice: ni nani aliye dhidi yetu?
  rationale: κατά pamoja na hali ya genitivi huonyesha upinzani. ‘Aliye dhidi yetu’ huhifadhi changamoto ya swali la kimjadala, bila kudai kwamba hakuna mpinzani yeyote aliyepo.
theological_decisions:
- issue: Nguvu ya sharti katika εἰ ὁ θεὸς ὑπὲρ ἡμῶν
  choice: Ikiwa Mungu yuko upande wetu
  alternative: Kwa kuwa Mungu yuko upande wetu
  rationale: Neno εἰ kwa kawaida ni ‘ikiwa,’ kwa hiyo tafsiri kuu huhifadhi muundo wa Kigiriki na mvutano wa kimjadala. Hata hivyo, muktadha unaonyesha kuwa hali hii inachukuliwa kuwa ya kweli, jambo linaloweza kuelezwa kwa ‘kwa kuwa’.
- issue: Maana ya swali τίς καθ’ ἡμῶν
  choice: ni nani aliye dhidi yetu?
  alternative: ni nani anayeweza kutushinda?
  rationale: Tafsiri kuu haiongezi wazo la ‘kuweza kutushinda,’ ambalo halisemwi wazi katika Kigiriki. Swali linatangaza kwa ushindi kwamba hakuna upinzani unaoweza kubatilisha kusudi la Mungu, bila kukana kuwapo kwa wapinzani.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa sasa, wenye hadhi na unaoeleweka kwa wasomaji wa kawaida. ‘Basi’ huunganisha mstari na hoja iliyotangulia, na ‘yuko upande wetu’ huwasilisha kwa uwazi nguvu ya ὑπὲρ ἡμῶν.
