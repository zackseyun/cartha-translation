  text: For all who are led by the Spirit of God[a], these are sons of God.
translation:
  language: sw
  text: Kwa maana wote wanaoongozwa na Roho wa Mungu, hao ndio wana wa Mungu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watoto wa Mungu.” “Wana” huhifadhi neno la Kigiriki na mwangwi wa kufanywa wana na kupokea urithi katika muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσοι
  choice: wote wanao-
  rationale: Muundo huu wa Kiswahili unaonyesha kundi lote linalotajwa—‘wote ambao’—kwa lugha ya kawaida bila kupunguza maana ya ujumla.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Inaendeleza uhusiano wa maelezo na hoja iliyotangulia katika muktadha.
- source_word: πνεύματι θεοῦ
  choice: na Roho wa Mungu
  rationale: ‘Na’ pamoja na kitenzi cha kutendwa huonyesha mtendaji wa kuongoza; ‘Roho wa Mungu’ huhifadhi usemi wa Paulo na rejeleo la Mungu.
- source_word: ἄγονται
  choice: wanaongozwa
  rationale: Huhifadhi hali ya kutendwa na maana endelevu ya wakati wa sasa bila kulazimisha neno la ziada.
- source_word: οὗτοι
  choice: hao ndio
  rationale: Huhifadhi msisitizo wa kiwakilishi demonstrativi katika Kigiriki kwa Kiswahili cha kawaida.
- source_word: υἱοί
  choice: wana
  rationale: ‘Wana’ ni neno la asili na lenye hadhi katika Kiswahili; linaweza kurejelea watoto wa jinsia zote huku likihifadhi mwangwi wa uwana, kufanywa wana, na urithi katika muktadha.
- source_word: θεοῦ
  choice: wa Mungu
  rationale: Hutoa kwa uwazi uhusiano wa umilikaji katika sehemu zote mbili na kuhifadhi urudiaji wa ‘Mungu’.
theological_decisions:
- issue: Jinsi ya kutafsiri υἱοί θεοῦ bila kupoteza maana ya uwana na urithi wala kuwabagua wanawake.
  choice: wana wa Mungu
  alternative: watoto wa Mungu
  rationale: Kigiriki kina υἱοί, neno lenye mwangwi wa kufanywa wana na urithi katika Warumi 8. Kiswahili ‘wana’ linaweza kujumuisha wa kiume na wa kike na kwa hiyo huhifadhi kwa kiasi kizuri uwazi wa asili pamoja na maana ya muktadha; mbadala unaelezwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye hadhi na inayoeleweka kwa urahisi. ‘Hao ndio’ huhifadhi msisitizo wa Kigiriki, na ‘wanaongozwa na’ ni muundo wa kawaida wa hali ya kutendwa.
