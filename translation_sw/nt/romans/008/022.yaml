  yaml_path: translation/nt/romans/008/022.yaml
  text: For we know that the whole creation groans together and suffers labor pains together until now[a][b].
translation:
  language: sw
  text: Kwa maana tunajua kwamba uumbaji wote unaugua pamoja na kuwa katika utungu wa kuzaa pamoja mpaka sasa[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “uumbaji mzima”; inawezekana pia “kila kitu kilichoumbwa,” ingawa maana pana ya uumbaji kwa ujumla inaelekea zaidi hapa.
    reason: lexical_alternative
  - marker: b
    text: Usemi “kuwa katika utungu wa kuzaa pamoja” unaleta taswira ya uchungu wa kujifungua, hivyo unaweza kudokeza si mateso tu bali pia mateso yanayoelekea kwenye maisha mapya.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴδαμεν
  choice: tunajua
  rationale: 'Ingawa kitenzi hiki ni timilifu kwa umbo, kwa kawaida kina maana ya hali ya sasa: ujuzi wa pamoja ulio thabiti.'
- source_word: γὰρ
  choice: Kwa maana
  rationale: Kiunganishi hiki kinaendeleza maelezo ya hoja iliyotangulia kwa Kiswahili cha kawaida na chenye heshima.
- source_word: πᾶσα ἡ κτίσις
  choice: uumbaji wote
  rationale: Muundo wenye kibainishi unaelekea kuwa wa kijumla, yaani uumbaji kwa ujumla, badala ya kila kiumbe kimoja kimoja; pia unafaa upeo mpana wa muktadha.
- source_word: συστενάζει
  choice: unaugua pamoja
  rationale: Neno hili linaonyesha kuugua kwa pamoja; “pamoja” linahifadhi maana ya kiambishi συν- na hali ya pamoja ya mateso ya uumbaji.
- source_word: συνωδίνει
  choice: unaendelea kupata uchungu wa kuzaa pamoja
  rationale: Kitenzi hiki kinataja hasa uchungu wa kujifungua, si mateso kwa ujumla. “Unaendelea” husaidia kuonyesha tendo linalodumu hadi sasa, na “pamoja” linahifadhi kiambishi συν-.
- source_word: ἄχρι τοῦ νῦν
  choice: mpaka sasa
  rationale: Ni usemi wa kawaida wa Kiswahili unaohifadhi maana ya hali inayoendelea kufikia wakati wa sasa.
theological_decisions:
- issue: Iwapo κτίσις litafsiriwe “uumbaji” au “kiumbe/kila kitu kilichoumbwa.”
  choice: uumbaji
  alternative: kila kiumbe; vitu vyote vilivyoumbwa
  rationale: Katika Waroma 8:19–23, Paulo anauwasilisha kwa lugha ya kibinadamu utaratibu mpana wa vitu vilivyoumbwa ukiwa umetiishwa chini ya ubatili na ukingojea kuwekwa huru. “Uumbaji” huhifadhi upeo huo bila kuufanya kuwa orodha ya viumbe mmoja mmoja.
- issue: Iwapo συνωδίνει ielezwe kama mateso ya kawaida au uchungu wa kuzaa.
  choice: uchungu wa kuzaa
  alternative: kuteseka
  rationale: Neno la Kigiriki lina taswira mahususi ya uchungu wa kujifungua. Tafsiri hiyo huhifadhi maumivu na pia uwezekano wa maisha mapya unaodokezwa na taswira, bila kuufanya udokezo huo kuwa kauli ya wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Marudio ya “pamoja” yamehifadhiwa kwa makusudi ili kuonyesha viambishi συν- katika vitenzi vyote viwili vya Kigiriki; “uchungu wa kuzaa” ni wa kueleweka kwa wasomaji wa kawaida na huhifadhi taswira ya asili.
