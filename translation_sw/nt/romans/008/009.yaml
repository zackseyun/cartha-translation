  text: Ὑμεῖς δὲ οὐκ ἐστὲ ἐν σαρκὶ ἀλλὰ ἐν πνεύματι, εἴπερ πνεῦμα θεοῦ οἰκεῖ ἐν ὑμῖν. εἰ δέ τις πνεῦμα Χριστοῦ οὐκ ἔχει, οὗτος οὐκ ἔστιν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/009.yaml
  text: But you are not in the flesh but in the Spirit[a], if indeed the Spirit of God dwells in you. But if anyone does not have the Spirit of Messiah[c][b], he does not belong to him.
translation:
  language: sw
  text: Lakini ninyi hamko katika mwili, bali katika Roho,[a] ikiwa kweli Roho wa Mungu anakaa ndani yenu. Lakini mtu yeyote asipokuwa na Roho wa Masihi,[b] huyo si wake.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “katika roho.” Hata hivyo, muktadha unaonyesha Roho wa Mungu.
    reason: lexical_alternative
  - marker: b
    text: Au “Roho wa Kristo.”
    reason: lexical_alternative
  - marker: c
    text: Yaani, “si mali yake” au “si wa kwake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σάρξ
  choice: mwili
  rationale: Neno la Paulo limehifadhiwa badala ya kufasiriwa moja kwa moja kuwa hali ya dhambi; katika muktadha huu linaonyesha nyanja au hali ya maisha inayopingana na kuwa katika Roho.
- source_word: πνεῦμα
  choice: Roho
  rationale: Herufi kubwa imetumiwa kwa sababu muktadha unamtambulisha kuwa Roho wa Mungu na Roho wa Masihi.
- source_word: οἰκεῖ
  choice: anakaa ndani
  rationale: Kauli hii ni ya kawaida katika Kiswahili na huhifadhi wazo la uwepo wa kudumu ndani ya waamini.
- source_word: Χριστοῦ
  choice: Masihi
  rationale: Χριστός imetafsiriwa kama cheo, Masihi, badala ya kuhamishwa tu kuwa Kristo.
- source_word: οὐκ ἔστιν αὐτοῦ
  choice: huyo si wake
  rationale: Hii huhifadhi kwa ukaribu nahau ya umilikaji ya Kigiriki na pia kutomfafanua zaidi mwenye kurejelewa na kiwakilishi.
- source_word: εἴπερ
  choice: ikiwa kweli
  rationale: Huhifadhi umbo la sharti pamoja na hisia ya jambo linalodhaniwa kuwa kweli katika hoja.
- source_word: Ὑμεῖς
  choice: ninyi
  rationale: Kiwakilishi cha wazi na chenye mkazo katika Kigiriki kimehifadhiwa ili kuonyesha utofautishaji.
- source_word: οὗτος
  choice: huyo
  rationale: Kiwakilishi hiki huhifadhi nguvu ya kumrejelea mtu aliyetajwa bila kuongeza jinsia isiyohitajika katika Kiswahili.
theological_decisions:
- issue: Tofauti ya Paulo kati ya kuwa “katika mwili” na kuwa “katika Roho”
  choice: Lugha ya nyanja au hali ya kuwepo inayohusishwa na kukaa kwa Roho ndani ya mtu, huku neno “mwili” likihifadhiwa
  alternative: Kufafanua “mwili” kuwa asili ya dhambi au tamaa za dhambi
  rationale: Tafsiri inahifadhi istilahi na mvutano wa kiteolojia wa Paulo bila kuubana kuwa mfumo fulani wa kisaikolojia au kimadhehebu.
- issue: Anayerejelewa na “wake” katika “huyo si wake”
  choice: Kiwakilishi kimeachwa bila kufafanuliwa; kwa sarufi ya karibu kinaweza kumrejelea Masihi
  alternative: Kusema wazi “si wa Masihi” au “si wa Mungu”
  rationale: Kigiriki kinatumia kiwakilishi, na kukihifadhi huepuka kuamua wazi jambo ambalo maandishi yenyewe hayalisemi wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “katika mwili ... katika Roho” umehifadhiwa kwa sababu ni muhimu kwa hoja ya Paulo, ingawa si usemi wa kawaida kabisa wa kila siku. Alama zote za tanbihi zimewekwa baada ya vipashio vinavyohusika.
