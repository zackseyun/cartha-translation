id: ROM.8.17
reference: Romans 8:17
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἰ δὲ τέκνα, καὶ κληρονόμοι· κληρονόμοι μὲν θεοῦ, συγκληρονόμοι δὲ Χριστοῦ, εἴπερ συμπάσχομεν ἵνα καὶ συνδοξασθῶμεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/017.yaml
  text: and if children[a], then heirs also—heirs of God and fellow heirs with Messiah, if indeed we suffer with him so that we may also be glorified with him.
translation:
  language: sw
  text: Na ikiwa sisi ni watoto, basi sisi pia ni warithi—warithi wa Mungu na warithi pamoja na Masihi—ikiwa kweli tunateseka pamoja naye, ili pia tutukuzwe pamoja naye.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τέκνα
  choice: watoto
  rationale: Nomino hii ya wingi haibainishi jinsia na hapa inaonyesha hadhi ya kifamilia; “watoto” ni ya kawaida na sahihi katika hoja ya urithi.
- source_word: κληρονόμοι
  choice: warithi
  rationale: Ni neno la kawaida la kisheria na kifamilia kwa watu wanaopokea urithi.
- source_word: θεοῦ
  choice: wa Mungu
  rationale: Muundo huu unawasilisha moja kwa moja uhusiano wa genitivi katika kirai “warithi wa Mungu” bila kuamua zaidi ikiwa Mungu ndiye chanzo au ndiye anayehusishwa na urithi.
- source_word: συγκληρονόμοι
  choice: warithi pamoja na
  rationale: Kiambishi συν- kinaonyesha kushiriki urithi; “warithi pamoja na” ni Kiswahili cha kawaida kinachohifadhi wazo hilo.
- source_word: Χριστοῦ
  choice: Masihi
  rationale: Χριστός ni cheo cha mtiwa-mafuta, na hapa hadhi yake ya kifalme inafaa hoja ya urithi.
- source_word: εἴπερ
  choice: ikiwa kweli
  rationale: Huhifadhi hali halisi ya sharti pamoja na msisitizo wa usemi, bila kuilegeza kuwa “kwa kuwa” wala kuifanya ionekane kuwa shaka tupu.
- source_word: συμπάσχομεν
  choice: tunateseka pamoja naye
  rationale: Hufanya wazi maana ya συν- ya kushiriki mateso; mhusika anayeonyeshwa na “naye” ni Masihi katika muktadha.
- source_word: ἵνα
  choice: ili
  rationale: Huonyesha kusudi au matokeo kwa Kiswahili fasaha bila kulazimisha utenganisho ambao Kigiriki hakiufanyi.
- source_word: συνδοξασθῶμεν
  choice: tutukuzwe pamoja naye
  rationale: Kauli tendwa inahifadhiwa katika “tutukuzwe,” na “pamoja naye” inaonyesha ushirika unaowakilishwa na συν-.
theological_decisions:
- issue: Ikiwa εἴπερ συμπάσχομεν inaweka mateso kuwa sharti linalostahili thawabu au inaeleza mtindo unaotarajiwa wa kushiriki na Masihi
  choice: “ikiwa kweli tunateseka pamoja naye”
  alternative: “kwa kuwa tunateseka pamoja naye” au tafsiri inayodokeza kwamba mateso yanastahilisha kutukuzwa
  rationale: Kigiriki kina nguvu halisi ya sharti, lakini hakisemi kwamba mateso ndiyo yanayonunua au kustahilisha urithi. Tafsiri inaacha mvutano huo ulivyo.
- issue: Maana ya genitivi katika κληρονόμοι θεοῦ
  choice: “warithi wa Mungu”
  alternative: Kufafanua kuwa Mungu pekee ndiye mtoaji wa urithi au kwamba Mungu mwenyewe ndiye urithi
  rationale: Kirai cha Kigiriki ni kifupi na kinaweza kubeba zaidi ya uhusiano mmoja; tafsiri ya moja kwa moja haifungi maana kwa ufafanuzi mmoja wa kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Marudio ya “pamoja naye” yamehifadhiwa kwa sababu yanaonyesha ulinganifu muhimu kati ya kushiriki mateso na kushiriki kutukuzwa. Tanbihi ya Kiingereza haikutumiwa kwa kuwa mahali pa alama yake na maandishi yake havilingani, na haitokani na tofauti halisi katika ushahidi wa chanzo uliotolewa.
