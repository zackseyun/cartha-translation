id: ROM.8.32
reference: Romans 8:32
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὅς γε τοῦ ἰδίου υἱοῦ οὐκ ἐφείσατο, ἀλλὰ ὑπὲρ ἡμῶν πάντων παρέδωκεν αὐτόν, πῶς οὐχὶ καὶ σὺν αὐτῷ τὰ πάντα ἡμῖν χαρίσεται;
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/032.yaml
  text: He indeed did not spare his own Son[c][b][a], but gave him over for us all—how will he not also with him graciously give us all things?
translation:
  language: sw
  text: Yeye ambaye hakumwachilia hata Mwana wake mwenyewe, bali alimtoa[a] kwa ajili yetu sisi sote[b], atakosaje pia kutujalia[c] vitu vyote pamoja naye?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alimkabidhi.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa niaba yetu sisi sote.”
    reason: alternative_reading
  - marker: c
    text: Au, “kutupa bure.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅς γε
  choice: Yeye ambaye
  rationale: Muundo huu unarejelea Mungu aliyetajwa katika muktadha uliotangulia; mkazo wa γε unaonekana katika swali zima la hoja bila kulazimisha kielezi kisicho cha kawaida.
- source_word: τοῦ ἰδίου υἱοῦ
  choice: Mwana wake mwenyewe
  rationale: Neno ἰδίου linasisitiza uhusiano wa pekee na umilikaji; herufi kubwa inaonyesha kuwa anayerejelewa ni Yesu.
- source_word: οὐκ ἐφείσατο
  choice: hakumwachilia hata
  rationale: Hii ni nahau ya Kiswahili inayoonyesha kwamba Mungu hakujizuia kumtoa Mwana wake; neno “hata” linabeba mkazo wa γε na wa hoja nzima.
- source_word: ὑπὲρ ἡμῶν πάντων
  choice: kwa ajili yetu sisi sote
  rationale: Inahifadhi maana ya tendo lililofanywa kwa manufaa au kwa niaba yetu bila kulibana kuwa istilahi maalumu ya kiitikadi.
- source_word: παρέδωκεν αὐτόν
  choice: alimtoa
  rationale: Katika muktadha huu kitenzi kina maana ya kumtoa au kumkabidhi kwenye mateso na kifo; “alimtoa” ni fasaha na kizito kwa kiasi kinachofaa.
- source_word: πῶς οὐχὶ καὶ
  choice: atakosaje ... pia
  rationale: Muundo huu wa swali la balagha huhifadhi hoja yenye uhakika kutoka zawadi kuu zaidi kwenda zawadi nyingine.
- source_word: σὺν αὐτῷ
  choice: pamoja naye
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya wazo la kupokea mambo yote pamoja na Mwana.
- source_word: τὰ πάντα
  choice: vitu vyote
  rationale: Inahifadhi upana wa usemi wa Paulo bila kuufafanua zaidi ya maandishi.
- source_word: ἡμῖν χαρίσεται
  choice: kutukirimia
  rationale: “Kukirimia” huonyesha kutoa kwa neema na bila kudai malipo, hivyo huhifadhi kidokezo cha χάρις kilichomo katika χαρίσεται.
theological_decisions:
- issue: Ikiwa ὑπὲρ ἡμῶν πάντων ielezwe kuwa ni badala yetu au kwa manufaa/niaba yetu
  choice: kwa ajili yetu sisi sote
  alternative: kwa niaba yetu sisi sote
  rationale: Kigiriki kinaonyesha wazi tendo kwa manufaa au niaba yetu na kinaweza kuwa na mwangwi wa dhabihu, lakini mstari huu pekee haulazimishi istilahi finyu zaidi ya upatanisho.
- issue: Upeo wa τὰ πάντα
  choice: vitu vyote
  alternative: kila kitu
  rationale: Usemi mpana umeachwa kama ulivyo ili muktadha uamue upeo wake; haujafasiriwa kuwa ahadi ya kila kitu ambacho mtu anaweza kutamani.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa swali la balagha umehifadhiwa. “Kutukirimia” ni neno la heshima linalobeba wazo la kutoa kwa neema; tanbihi inatoa usemi rahisi zaidi.
