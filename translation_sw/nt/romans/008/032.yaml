  to: Yeye ambaye hakumwachilia hata Mwana wake mwenyewe, bali alimtoa[a] kwa ajili yetu sisi sote[b], atakosaje pia kutujalia[c] vitu vyote pamoja naye?
  rationale: Marekebisho yanabadilisha “kutukirimia” kuwa “kutujalia,” ambayo ni tafsiri ya asili zaidi ya χαρίσεται katika muktadha wa kumpa mtu kwa neema. Tanbihi zimepangwa upya ili zifungamane wazi na παρέδωκεν, ὑπὲρ ἡμῶν πάντων, na χαρίσεται. Maana, upeo wa “vitu vyote,” na utata wa ὑπέρ vimehifadhiwa.
