  text: ὅτι καὶ αὐτὴ ἡ κτίσις ἐλευθερωθήσεται ἀπὸ τῆς δουλείας τῆς φθορᾶς εἰς τὴν ἐλευθερίαν τῆς δόξης τῶν τέκνων τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/021.yaml
  text: because creation itself also will be set free from slavery to decay into the freedom of the glory of the children of God[a].
translation:
  language: sw
  text: kwa sababu uumbaji wenyewe pia utawekwa huru kutoka katika utumwa wa uharibifu na kuingia katika uhuru wa utukufu wa watoto wa Mungu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uhuru mtukufu wa watoto wa Mungu.”
    reason: Tafsiri mbadala inayowasilisha τῆς δόξης kwa namna ya kivumishi, ilhali tafsiri kuu huhifadhi mfuatano wa Kigiriki.
lexical_decisions:
- source_word: ὅτι
  choice: kwa sababu
  rationale: Kiunganishi hiki kinaeleweka hapa kuwa cha sababu, kikieleza msingi wa tumaini lililotajwa katika muktadha uliotangulia.
- source_word: καὶ αὐτὴ ἡ κτίσις
  choice: uumbaji wenyewe pia
  rationale: “Pia” huhifadhi maana ya nyongeza ya καί, na “wenyewe” huhifadhi msisitizo wa αὐτή. Katika muktadha huu κτίσις ni uumbaji kwa ujumla.
- source_word: ἐλευθερωθήσεται
  choice: utawekwa huru
  rationale: 'Huhifadhi wakati ujao na kauli tendwa: uumbaji ndio unaopokea tendo la kuwekwa huru.'
- source_word: ἀπὸ τῆς δουλείας τῆς φθορᾶς
  choice: kutoka katika utumwa wa kuharibika
  rationale: “Utumwa” hudumisha nguvu ya sitiari ya δουλεία, na “kuharibika” huonyesha hali ya kuweza kuoza, kudhoofika na kupotea inayokusudiwa na φθορά katika muktadha wa uumbaji.
- source_word: εἰς τὴν ἐλευθερίαν
  choice: na kuingia katika uhuru
  rationale: Muundo huu unaonyesha mwendo kutoka hali moja hadi nyingine unaoletwa na εἰς, huku ukisomeka kwa kawaida katika Kiswahili.
- source_word: τῆς δόξης τῶν τέκνων τοῦ θεοῦ
  choice: wa utukufu wa watoto wa Mungu
  rationale: Huhifadhi mfuatano wa viambishi milikishi katika Kigiriki na kuepuka kuamua kimya kimya kama utukufu unaeleza sifa ya uhuru au ni hali ambayo watoto wa Mungu wanashiriki.
theological_decisions:
- issue: Jinsi ya kutafsiri mfuatano τὴν ἐλευθερίαν τῆς δόξης τῶν τέκνων τοῦ θεοῦ
  choice: uhuru wa utukufu wa watoto wa Mungu
  alternative: uhuru wenye utukufu wa watoto wa Mungu
  rationale: Tafsiri iliyochaguliwa hudumisha utata halisi wa uhusiano wa viambishi katika Kigiriki. Tafsiri mbadala ni ya kawaida zaidi lakini hufanya δόξης kuwa kivumishi na hivyo kuufafanua uhusiano huo zaidi ya maandishi ya asili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. “Uumbaji” limetumiwa kwa maana ya mpangilio wote ulioumbwa; sentensi imeachwa ikianza na “kwa sababu” ili kudumisha uhusiano wake wa kisarufi na mstari uliotangulia.
