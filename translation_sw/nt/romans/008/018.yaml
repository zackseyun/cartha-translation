  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Λογίζομαι γὰρ ὅτι οὐκ ἄξια τὰ παθήματα τοῦ νῦν καιροῦ πρὸς τὴν μέλλουσαν δόξαν ἀποκαλυφθῆναι εἰς ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/018.yaml
  text: For I consider that the sufferings of the present time are not worthy to be compared with the coming glory that is to be revealed to us[a].
translation:
  language: sw
  text: Kwa maana ninahesabu kwamba mateso ya wakati huu hayastahili kulinganishwa na utukufu unaokuja utakaofunuliwa kwetu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ndani yetu.”
    reason: alternative_reading
lexical_decisions:
- source_word: Λογίζομαι
  choice: ninaona
  rationale: Katika muktadha huu linaonyesha uamuzi uliofikiwa kwa kufikiri, si hisia tu; ‘ninaona’ ni Kiswahili cha kawaida na chenye uzito unaofaa.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Inaunganisha kauli hii na iliyotangulia kwa kutoa msingi au ufafanuzi.
- source_word: οὐκ ἄξια ... πρὸς
  choice: hayalingani na
  rationale: Muundo huu unaonyesha kutokuwapo kwa ulinganifu wa thamani; tafsiri hii ni ya asili katika Kiswahili na haiashirii kwamba mateso hayawezi hata kutajwa kwa kulinganishwa.
- source_word: τὰ παθήματα
  choice: mateso
  rationale: Neno hili linamaanisha mambo ya kuumiza yanayovumiliwa au kupitiwa.
- source_word: τοῦ νῦν καιροῦ
  choice: ya wakati huu
  rationale: Huhifadhi maana ya kipindi cha sasa bila kuongeza dhana ya ‘enzi’ ambayo haijalazimishwa na kirai chenyewe.
- source_word: τὴν μέλλουσαν δόξαν
  choice: utukufu unaokuja
  rationale: Huhifadhi wazi mwelekeo wa baadaye uliomo katika μέλλουσαν.
- source_word: ἀποκαλυφθῆναι
  choice: ambao utafunuliwa
  rationale: Huhifadhi hali ya kutendwa na matarajio ya ufunuo wa baadaye.
- source_word: εἰς ἡμᾶς
  choice: kwetu
  rationale: Ni tafsiri ya asili ya kuelekea au kuhusiana nasi, huku uwezekano wa maana ‘ndani yetu’ ukihifadhiwa katika tanbihi.
theological_decisions:
- issue: Maana ya εἰς ἡμᾶς kuhusu kufunuliwa kwa utukufu
  choice: kwetu
  alternative: ndani yetu
  rationale: Kirai kinaweza kueleweka kuwa utukufu utafunuliwa kwa waamini au ndani yao. Maandishi makuu yanatumia ‘kwetu’ kwa ufasaha, na tanbihi inadumisha uwezekano wa ushiriki wa ndani bila kuamua suala hilo kidogma.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. ‘Hayalingani na’ hutoa ulinganisho wa thamani kwa ufasaha; alama [a] imewekwa katika maandishi makuu.
