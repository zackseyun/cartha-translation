- from: Kwa maana ninaona kwamba mateso ya wakati huu hayalingani na utukufu unaokuja, ambao utafunuliwa kwetu[a].
  to: Kwa maana ninahesabu kwamba mateso ya wakati huu hayastahili kulinganishwa na utukufu unaokuja utakaofunuliwa kwetu[a].
  rationale: 'The revision strengthens fidelity to Λογίζομαι and the comparative force of οὐκ ἄξια ... πρὸς, corrects the noun-class concord for utukufu, and preserves both future elements: glory is coming and will be revealed. The footnote continues to preserve the interpretively significant alternative for εἰς ἡμᾶς without deciding it doctrinally.'
  reviewer_model: gpt-5.6-terra
