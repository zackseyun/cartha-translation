  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οὐ μόνον δέ, ἀλλὰ ⸂καὶ αὐτοὶ⸃ τὴν ἀπαρχὴν τοῦ πνεύματος ἔχοντες ⸂ἡμεῖς καὶ⸃ αὐτοὶ ἐν ἑαυτοῖς στενάζομεν, υἱοθεσίαν ἀπεκδεχόμενοι τὴν ἀπολύτρωσιν τοῦ σώματος ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/023.yaml
  text: And not only that[a], but we ourselves also, who have the firstfruits of the Spirit, even we ourselves groan within ourselves[c][b], eagerly awaiting adoption as sons—the redemption of our bodies.
translation:
  language: sw
  text: Wala si hivyo tu, bali sisi wenyewe pia, tulio na malimbuko ya Roho[a], sisi wenyewe tunaugua ndani yetu, huku tukingojea kwa hamu kuasiliwa kuwa wana[b]—yaani, ukombozi wa miili yetu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, yawezekana, “Roho mwenyewe kama malimbuko.”
    reason: alternative_reading
  - marker: b
    text: Au kwa ufupi, “kuasiliwa.” Neno la Kigiriki linajumuisha wazo la uwana.
    reason: lexical_alternative
  - marker: c
    text: 'Kigiriki: “mwili wetu,” umoja ukitumiwa kwa maana ya mwili wa kila mmoja wetu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μόνον δέ, ἀλλὰ
  choice: Wala si hivyo tu, bali
  rationale: Inaendeleza utofautishaji wa Paulo kutoka mstari uliotangulia kwa Kiswahili cha kawaida huku ikihifadhi mkazo wa muundo wa Kigiriki.
- source_word: καὶ αὐτοὶ / ἡμεῖς καὶ αὐτοὶ
  choice: sisi wenyewe pia ... sisi wenyewe
  rationale: Inahifadhi urudiaji wenye mkazo kwamba waamini pia wanashiriki katika kuugua.
- source_word: τὴν ἀπαρχὴν τοῦ πνεύματος
  choice: malimbuko ya Roho
  rationale: Neno “malimbuko” linahifadhi picha ya sehemu ya kwanza ya mavuno na muundo huu hauamui kimya kimya ikiwa Roho ndiye malimbuko au ndiye chanzo chake.
- source_word: ἔχοντες
  choice: tulio na
  rationale: Kishazi hiki cha uhusiano ni cha asili katika Kiswahili na kinawakilisha vizuri hali inayoelezwa na kitenzi-shirikishi cha Kigiriki.
- source_word: ἐν ἑαυτοῖς
  choice: ndani yetu
  rationale: Inaonyesha wazi kuwa kuugua huko ni kwa ndani bila kuongeza ufafanuzi usiomo katika matini.
- source_word: στενάζομεν
  choice: tunaugua
  rationale: Kinahifadhi uhusiano wa kitenzi hiki na kuugua kwa uumbaji katika muktadha wa karibu.
- source_word: υἱοθεσίαν
  choice: kuasiliwa kuwa wana
  rationale: Inaonyesha tendo la kuingizwa katika hadhi ya wana na kuhifadhi picha ya uwana na urithi iliyomo katika neno la Kigiriki.
- source_word: ἀπεκδεχόμενοι
  choice: huku tukingojea kwa hamu
  rationale: Inaeleza kungoja kwa matarajio makubwa kwa Kiswahili cha asili.
- source_word: τὴν ἀπολύτρωσιν
  choice: ukombozi
  rationale: Linahifadhi istilahi ya Paulo na uzito wake wa wokovu wa wakati ujao.
- source_word: τοῦ σώματος ἡμῶν
  choice: wa miili yetu
  rationale: Ingawa Kigiriki kina umoja unaotumiwa kwa maana ya kugawa kwa kila mmoja, wingi ni wa asili na wazi zaidi katika Kiswahili.
theological_decisions:
- issue: Jinsi ya kutafsiri υἱοθεσίαν bila kupoteza picha ya uwana na urithi wala kuwatoa wanawake katika kundi linalorejelewa
  choice: kuasiliwa kuwa wana
  alternative: kuasiliwa
  rationale: Neno la Kigiriki lina wazo la kupewa hadhi ya mwana. Tafsiri kuu inahifadhi wazo hilo, huku tanbihi ikifafanua kwamba wote walio wa Kristo, wanawake kwa wanaume, wanahusika.
- issue: Ikiwa τὴν ἀπαρχὴν τοῦ πνεύματος inamaanisha malimbuko yanayotoka kwa Roho au Roho mwenyewe akiwa malimbuko
  choice: malimbuko ya Roho
  alternative: Roho aliye malimbuko
  rationale: Muundo wa Kigiriki unaweza kueleweka kwa njia zote mbili. Matini kuu inahifadhi muundo wenye uwezekano zaidi ya mmoja, na tanbihi inataja wazi usomaji mwingine.
- issue: Uhusiano kati ya kuasiliwa na ukombozi wa mwili
  choice: kuasiliwa kuwa wana—yaani, ukombozi wa miili yetu
  alternative: kuasiliwa kuwa wana, na ukombozi wa miili yetu
  rationale: Kigiriki kinaweka ukombozi wa mwili kwa namna ya ufafanuzi wa kuasiliwa kunakongojewa, si kama jambo la pili lisilohusiana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye heshima lakini kinachoeleweka kwa wasomaji wa kawaida. Urudiaji wa “sisi wenyewe” umehifadhiwa kwa sababu ni mkazo wa makusudi katika Kigiriki. “Malimbuko,” “kuugua,” na “ukombozi” hudumisha picha na msamiati wa muktadha wa Paulo.
