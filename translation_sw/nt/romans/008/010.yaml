  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἰ δὲ Χριστὸς ἐν ὑμῖν, τὸ μὲν σῶμα νεκρὸν διὰ ἁμαρτίαν, τὸ δὲ πνεῦμα ζωὴ διὰ δικαιοσύνην.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/010.yaml
  text: But if the Messiah is in you[a], the body is dead because of sin[c][b], but the spirit is life because of righteousness.
translation:
  language: sw
  text: Lakini ikiwa Masihi yumo ndani yenu, mwili ni mfu[b] kwa sababu ya dhambi, lakini roho[a] ni uzima kwa sababu ya haki.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Roho ni uzima.” Neno la Kigiriki linaweza kumaanisha ama roho ya mwanadamu iliyohuishwa na Mungu, ama Roho Mtakatifu.
    reason: alternative_reading
  - marker: b
    text: Au, “mwili uko chini ya mauti” au “mwili unaweza kufa.”
    reason: lexical_alternative
  - marker: c
    text: Au, “kwa sababu ya uadilifu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστὸς
  choice: Masihi
  rationale: Neno hili limetumiwa kama cheo; “Masihi” linadumisha maana ya Mpakwa-Mafuta kwa Kiswahili cha kawaida na chenye heshima.
- source_word: σῶμα
  choice: mwili
  rationale: Neno la Kigiriki linamaanisha mwili, na linahifadhi utofautishaji wake na πνεῦμα bila kulichanganya na σάρξ (“mwili wa dhambi/nyama”).
- source_word: νεκρὸν
  choice: mfu
  rationale: “Mfu” linafuata maana ya moja kwa moja ya kivumishi cha Kigiriki, huku uwezekano wa maana ya kuwa chini ya mauti ukielezwa katika tanbihi.
- source_word: διὰ ἁμαρτίαν
  choice: kwa sababu ya dhambi
  rationale: διά pamoja na hali ya accusative hapa inaonyesha sababu; usemi huu ni wa kawaida na unaweka wazi uhusiano wa kisababishi.
- source_word: πνεῦμα
  choice: roho
  rationale: Kiswahili hakiwezi kuonyesha kwa herufi kubwa tofauti ya “roho” na “Roho” katikati ya sentensi kwa uthabiti wa kimatamshi; “roho” linaacha wazi kama anayelengwa ni roho ya mwanadamu iliyohuishwa au Roho Mtakatifu.
- source_word: ζωὴ
  choice: ni uzima
  rationale: ζωή ni nomino “uzima,” si kivumishi “hai”; tafsiri hii inadumisha usemi mfupi na mkali wa Paulo.
- source_word: διὰ δικαιοσύνην
  choice: kwa sababu ya haki
  rationale: “Haki” ni neno la kawaida la Kiswahili kwa δικαιοσύνη na linaweza kubeba maana zinazohusiana za uadilifu na haki ya hukumu; nguvu ya kisababishi ya διά imedumishwa.
theological_decisions:
- issue: Anayerejelewa na πνεῦμα
  choice: roho
  alternative: Roho Mtakatifu
  rationale: Muktadha unaweza kueleweka kuwa unataja roho ya mwamini iliyohuishwa na Mungu au Roho Mtakatifu mwenyewe. Matini kuu haifungi uwezekano wowote, na tanbihi inadumisha mvutano huo.
- issue: Maana ya νεκρὸν inapohusishwa na σῶμα
  choice: mwili ni mfu
  alternative: mwili uko chini ya mauti / mwili unaweza kufa
  rationale: Ingawa Paulo huenda anasisitiza hali ya mwili kuwa wa kufa kwa sababu ya dhambi, neno lenyewe ni “mfu.” Tafsiri kuu inafuata umbo kali la chanzo, na tanbihi inaonyesha maana pana inayowezekana.
- issue: Maana ya δικαιοσύνη
  choice: haki
  alternative: uadilifu
  rationale: “Haki” linafaa katika muktadha wa Paulo bila kuamua kimbele ikiwa msisitizo ni hadhi ya kuwa sawa mbele za Mungu, mwenendo wa uadilifu, au tendo la Mungu la haki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaoeleweka kwa urahisi. Muundo “roho ni uzima” umehifadhiwa licha ya kuwa mkali kidogo kwa Kiswahili, kwa sababu unaakisi nomino na ufupi wa Kigiriki. Alama za tanbihi zimewekwa moja kwa moja baada ya maneno yanayohusika.
