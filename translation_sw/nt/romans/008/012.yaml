  text: So then[a], brothers, we are debtors—not to the flesh[b], to live according to the flesh.
translation:
  language: sw
  text: Kwa hiyo, ndugu[a], tuna wajibu; lakini si wajibu kwa mwili[b] wa kuishi kwa kufuata mwili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki ni “ndugu” katika wingi; hapa ni namna ya kuhitubia jumuiya yote ya waamini, wanaume na wanawake.
    reason: lexical_alternative
  - marker: b
    text: “Mwili” hapa haumaanishi tu mwili wa kibinadamu, bali hali au mwelekeo wa kibinadamu ulioanguka katika dhambi. Inaweza pia kufafanuliwa kuwa “asili ya dhambi,” ingawa ufafanuzi huo hupunguza upeo wa neno la Kigiriki.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄρα οὖν
  choice: Kwa hiyo
  rationale: Kiunganishi hiki kinaonyesha hitimisho linalotokana na hoja iliyotangulia; “Kwa hiyo” ni cha kawaida na cha asili katika Kiswahili sanifu.
- source_word: ἀδελφοί
  choice: ndugu
  rationale: “Ndugu” ni namna ya kawaida ya kulihutubia jumuiya ya waamini kwa Kiswahili na inaweza kuwajumuisha wanaume na wanawake; tanbihi inaweka wazi upana huo.
- source_word: ὀφειλέται ἐσμέν
  choice: sisi tuna deni
  rationale: Huhifadhi sitiari ya wadaiwa katika ὀφειλέται huku ikieleweka hapa kuwa wajibu, si lazima deni la fedha.
- source_word: σάρξ / σαρκί
  choice: mwili
  rationale: Huhifadhi neno kuu la Paulo na utofautishaji wake kati ya σάρξ na Roho bila kulifasiri moja kwa moja kuwa “asili ya dhambi.” Tanbihi inaeleza maana ya kitamathali katika muktadha.
- source_word: τοῦ κατὰ σάρκα ζῆν
  choice: la kuishi kwa kufuata mwili
  rationale: Muundo huu unaonyesha jambo ambalo deni hilo lingedai, huku “kwa kufuata mwili” ikihifadhi maana ya kuishi kulingana na kiwango au mwelekeo wa mwili.
theological_decisions:
- issue: Iwapo σάρξ katika utofautishaji huu wa Paulo itafsiriwe kwa ufafanuzi
  choice: mwili
  alternative: asili ya dhambi
  rationale: Matini kuu inahifadhi msamiati na mvutano wa kiteolojia wa Paulo badala ya kuamua maana yote kwa ufafanuzi mmoja. Tanbihi inaonyesha kuwa hapa “mwili” umetumiwa kwa maana pana ya hali au mwelekeo wa kibinadamu ulioanguka katika dhambi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Tamko “sisi tuna deni” linasisitiza mhusika na kuhifadhi sitiari ya Kigiriki; vistari vinatenga kwa uwazi upande unaokanushwa.
