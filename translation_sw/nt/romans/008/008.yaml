  text: οἱ δὲ ἐν σαρκὶ ὄντες θεῷ ἀρέσαι οὐ δύνανται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/008.yaml
  text: Those who are in the flesh cannot please God[a].
translation:
  language: sw
  text: Lakini wale walio katika mwili[a] hawawezi kumpendeza Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “katika asili ya dhambi.” Kigiriki kinasema “katika mwili,” neno muhimu katika hoja ya Paulo katika muktadha huu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ... ὄντες
  choice: wale walio
  rationale: Kifungu chenye kibainishi na kitenzi-shirikishi kinarejelea kundi la watu na hali yao ya sasa; “wale walio” ni Kiswahili cha kawaida na sahihi.
- source_word: δὲ
  choice: Lakini
  rationale: Kiunganishi hiki kinaendeleza hoja huku kikionyesha utofauti na hali iliyoelezwa katika muktadha uliotangulia.
- source_word: ἐν σαρκὶ
  choice: katika mwili
  rationale: Tafsiri hii inadumisha taswira na uzito wa neno la Paulo σάρξ bila kulifafanua moja kwa moja kuwa “asili ya dhambi.”
- source_word: θεῷ ἀρέσαι
  choice: kumpendeza Mungu
  rationale: Muundo huu ni wa kawaida katika Kiswahili na unawasilisha kwa usahihi maana ya kumfanyia Mungu yanayompendeza.
- source_word: οὐ δύνανται
  choice: hawawezi
  rationale: Hii ni tafsiri fupi na ya kawaida ya ukanushaji wa uwezo.
theological_decisions:
- issue: Tafsiri ya σάρξ katika muktadha wa hoja ya Paulo
  choice: katika mwili
  alternative: katika asili ya dhambi
  rationale: Neno “mwili” linahifadhi istilahi na mvutano wa kitheolojia wa maandishi ya Kigiriki; maana ya kimafumbo inawekwa katika tanbihi badala ya kuamuliwa kimya kimya ndani ya mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. “Lakini” imetumiwa kuonyesha utofauti wa δὲ na muktadha uliotangulia.
