  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: διότι τὸ φρόνημα τῆς σαρκὸς ἔχθρα εἰς θεόν, τῷ γὰρ νόμῳ τοῦ θεοῦ οὐχ ὑποτάσσεται, οὐδὲ γὰρ δύναται·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/007.yaml
  text: because the mindset of the flesh is hostility toward God[a], for it does not submit to the law of God[b], for it is not even able.
translation:
  language: sw
  text: kwa sababu nia ya mwili[a] ni uadui dhidi ya Mungu; kwa maana haitii sheria ya Mungu, kwa maana haiwezi hata kuitii.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nia ya asili ya dhambi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διότι
  choice: kwa sababu
  rationale: Inaonyesha sababu ya kauli iliyotangulia na kuhifadhi nguvu ya kisababishi kwa Kiswahili cha kawaida.
- source_word: φρόνημα
  choice: nia
  rationale: Hapa neno hili linamaanisha mwelekeo au msimamo wa ndani wa mawazo, si akili peke yake; “nia” ni fupi, yenye hadhi, na inaeleweka katika muktadha huu.
- source_word: σάρξ
  choice: mwili
  rationale: Inahifadhi taswira ya msingi ya Paulo bila kuifasiri moja kwa moja kuwa “asili ya dhambi”; maana hiyo ya kifasiri imewekwa katika tanbihi.
- source_word: ἔχθρα
  choice: uadui
  rationale: Nomino “uadui” inalingana na muundo wa Kigiriki na kuonyesha hali ya upinzani dhidi ya Mungu.
- source_word: εἰς θεόν
  choice: dhidi ya Mungu
  rationale: Katika muundo unaohusiana na “uadui,” “dhidi ya Mungu” ni Kiswahili cha kawaida na kinaonyesha wazi anayeelekezewa uadui huo.
- source_word: ὑποτάσσεται
  choice: haiitii
  rationale: Katika uhusiano na sheria, “kutii” ni lugha ya asili ya Kiswahili inayowasilisha kujitiisha chini ya mamlaka yake.
- source_word: νόμῳ τοῦ θεοῦ
  choice: sheria ya Mungu
  rationale: Ni tafsiri ya moja kwa moja ya muundo wa umilikaji na inadumisha uzito wa kauli ya chanzo.
- source_word: οὐδὲ γὰρ δύναται
  choice: kwa sababu hata haiwezi kuitii
  rationale: “Haiwezi” huhifadhi kauli ya uwezo, si ya kutotaka tu; “hata” huonyesha msisitizo wa οὐδέ, na “kwa sababu” huakisi γάρ.
theological_decisions:
- issue: Iwapo σάρξ itafsiriwe kifasiri kama “asili ya dhambi” au ihifadhiwe kama “mwili”
  choice: “mwili” katika andiko kuu, pamoja na mbadala wa kifasiri katika tanbihi
  alternative: asili ya dhambi
  rationale: Muktadha unaonyesha matumizi ya kisitiari yanayohusu mwelekeo wa mwanadamu ulio kinyume na Mungu, lakini “mwili” huhifadhi istilahi na taswira ya chanzo bila kufunga maana yake mapema.
- issue: Iwapo kishazi cha mwisho kielezwe kama kutotaka au kutoweza
  choice: 'kauli ya wazi ya kutoweza: “hata haiwezi kuitii”'
  alternative: haitaki kuitii
  rationale: δύναται huhusu uwezo. Tafsiri inadumisha mvutano wa kiteolojia wa andiko bila kuongeza mfumo wa mafundisho usiotajwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa nomino “ni uadui” umehifadhiwa kwa uaminifu kwa Kigiriki, huku “haiitii” na “haiwezi kuitii” zikitoa mtiririko wa kawaida na rejeo lililo wazi.
