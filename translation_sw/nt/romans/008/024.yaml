  text: τῇ γὰρ ἐλπίδι ἐσώθημεν· ἐλπὶς δὲ βλεπομένη οὐκ ἔστιν ἐλπίς, ὃ γὰρ βλέπει ⸀τίς ἐλπίζει;
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/024.yaml
  text: For in hope we were saved[a]. But hope that is seen is not hope[b], for who hopes for what he sees?
translation:
  language: sw
  text: Kwa maana tuliokolewa katika tumaini[a]. Lakini tumaini linaloonekana si tumaini[b], kwa maana ni nani hutumainia kile anachokiona?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “tuliokolewa kwa tumaini.”
    reason: alternative_reading
  - marker: b
    text: Yaani, tumaini huhusu kile ambacho bado hakijaonekana.
    reason: cross_reference
lexical_decisions:
- source_word: τῇ ἐλπίδι
  choice: katika tumaini
  rationale: 'Dativu inaeleweka vizuri kama ikionyesha hali au mazingira ambamo wokovu unamilikiwa: wokovu ni halisi lakini utimilifu wake bado unatumainiwa. Hili huepuka kudokeza kwamba tumaini ndilo sababu inayotenda wokovu.'
- source_word: ἐσώθημεν
  choice: tuliokolewa
  rationale: Huhifadhi kauli tendwa na wakati uliopita wa aoristi kwa Kiswahili cha kawaida bila kuongeza maana isiyo wazi katika umbo la Kigiriki.
- source_word: ἐλπὶς ... βλεπομένη
  choice: tumaini linaloonekana
  rationale: Kishazi rejeshi ni cha asili katika Kiswahili na huhifadhi ulinganisho wa Paulo kati ya tumaini na kuona.
- source_word: οὐκ ἔστιν ἐλπίς
  choice: si tumaini
  rationale: Huhifadhi usemi wa moja kwa moja wa Kigiriki na kusikika kwa kawaida katika Kiswahili.
- source_word: ὃ ... βλέπει
  choice: kile anachokiona
  rationale: Kiwakilishi cha Kigiriki kinarejelea kitu kinachoonekana; muundo huu ni wazi na wa kawaida katika Kiswahili.
- source_word: τίς ἐλπίζει
  choice: ni nani anayekitumaini
  rationale: Huhifadhi swali la balagha na hali ya jumla ya kauli bila kuifanya ihusu jinsia fulani.
theological_decisions:
- issue: Uhusiano wa wokovu na tumaini katika τῇ ἐλπίδι ἐσώθημεν
  choice: katika tumaini tuliokolewa
  alternative: kwa tumaini tuliokolewa
  rationale: Chaguo kuu huhifadhi mvutano wa wokovu ambao tayari ni halisi lakini bado unasubiri utimilifu unaoonekana, bila kulifanya tumaini kuwa sababu tendaji ya wokovu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wazi kwa wasomaji wa kawaida huku ukihifadhi urudiaji wa neno “tumaini” na mvutano wa kitheolojia wa kifungu.
