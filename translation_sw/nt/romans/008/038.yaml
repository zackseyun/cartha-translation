  text: πέπεισμαι γὰρ ὅτι οὔτε θάνατος οὔτε ζωὴ οὔτε ἄγγελοι οὔτε ἀρχαὶ οὔτε ⸂ἐνεστῶτα οὔτε μέλλοντα οὔτε δυνάμεις⸃
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/038.yaml
  text: For I am convinced that neither death nor life[a], nor angels nor rulers, nor things present nor things to come, nor powers,
translation:
  language: sw
  text: Kwa maana nimesadiki kwamba wala mauti wala uzima, wala malaika wala watawala[a], wala mambo yaliyopo sasa wala yatakayokuja, wala nguvu,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wenye mamlaka”; huenda ikimaanisha watawala au mamlaka za ulimwengu wa kiroho.
    reason: lexical_alternative
lexical_decisions:
- source_word: πέπεισμαι
  choice: nimesadiki
  rationale: Kauli ya timilifu inaeleza usadikisho uliothibitika na unaoendelea; “nimesadiki” ni ya kawaida, yenye heshima, na huhifadhi hali hiyo.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Huunganisha mstari huu na uliotangulia kwa kutoa maelezo au msingi wa kauli hiyo.
- source_word: οὔτε ... οὔτε
  choice: wala ... wala
  rationale: Urudiaji wa “wala” huhifadhi muundo wa ukanushi na mdundo wa orodha ya Kigiriki kwa Kiswahili cha asili.
- source_word: θάνατος
  choice: mauti
  rationale: Ni tafsiri ya moja kwa moja inayofaa sajili ya Maandiko na inalingana kwa ufasaha na “uzima.”
- source_word: ζωή
  choice: uzima
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida, ikiwa kinyume cha “mauti.”
- source_word: ἄγγελοι
  choice: malaika
  rationale: Ingawa neno linaweza kumaanisha wajumbe, muktadha wa mambo ya ulimwengu wa kiroho unapendelea “malaika.”
- source_word: ἀρχαὶ
  choice: watawala
  rationale: Neno linaweza kutaja wenye mamlaka ya kutawala, wakiwemo watawala wa kiroho; “watawala” huhifadhi upana huo bila kulifanya istilahi ya mfumo fulani wa teolojia.
- source_word: ἐνεστῶτα
  choice: mambo yaliyopo sasa
  rationale: Kirai hiki huonyesha hali au mambo ya wakati wa sasa na kinaeleweka kwa urahisi katika Kiswahili cha leo.
- source_word: μέλλοντα
  choice: yatakayokuja
  rationale: Huhifadhi ulinganifu na “mambo yaliyopo sasa” huku kikirejelea mambo ya wakati ujao kwa lugha ya kawaida.
- source_word: δυνάμεις
  choice: nguvu
  rationale: Huhifadhi utata wa Kigiriki kati ya nguvu zisizo na nafsi na mamlaka au viumbe vyenye uwezo.
theological_decisions:
- issue: Kama ἀρχαὶ na δυνάμεις yatafsiriwe kama majina maalumu ya viumbe vya kiroho
  choice: “watawala” na “nguvu” zimetumiwa kwa maana pana katika matini kuu
  alternative: “falme” na “mamlaka,” au maneno yanayotaja wazi watawala wa kiroho
  rationale: Muktadha huenda unahusisha mamlaka za ulimwengu wa kiroho, lakini maneno ya Kigiriki yana upeo mpana. Tafsiri hii haiamui zaidi ya ushahidi wa matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa orodha na koma ya mwisho vimehifadhiwa kwa sababu sentensi inaendelea katika mstari unaofuata.
