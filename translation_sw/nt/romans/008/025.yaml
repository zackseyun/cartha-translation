- from: Lakini ikiwa tunatumainia kile tusichokiona, tunakingojea kwa saburi na ustahimilivu.[a][b]
  to: Lakini ikiwa tunatumaini kile tusichokiona, tunakingojea[a] kwa uvumilivu.[b]
