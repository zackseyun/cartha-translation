review_pass:
  verdict: revise
  source_fidelity: The conditional contrast, the unspecified unseen object, ongoing hope, and enduring expectation are retained. Replacing the two-term rendering of ὑπομονή with “uvumilivu” avoids expanding one Greek noun into two coordinated qualities. “Tunakingojea” appropriately retains the object implied by the relative clause and the expectant-waiting sense of ἀπεκδεχόμεθα.
  naturalness: “Lakini ikiwa tunatumaini kile tusichokiona, tunakingojea kwa uvumilivu” is idiomatic, current Standard East African Swahili. “Kutumaini” is more direct here than “kutumainia,” which can carry a stronger sense of relying or placing trust in someone or something.
  terminology: “Uvumilivu” is a natural, sufficiently broad equivalent for ὑπομονή in this context. The alternative “saburi” is properly confined to a footnote, since it can underrepresent the steadfast-endurance nuance. Footnote anchors are moved to the words they explain.
  issues:
  - severity: medium
    issue: “kwa saburi na ustahimilivu” renders one Greek noun with two coordinated nouns.
    rationale: Although explanatory, the doublet adds a distinct lexical element not explicitly present in δι’ ὑπομονῆς. “Kwa uvumilivu” conveys patient steadfastness without expansion.
  - severity: low
    issue: “tunatumainia” may suggest reliance/trust rather than simply hoping for an expected object.
    rationale: The direct verb “tunatumaini” more naturally represents ἐλπίζομεν with the relative-clause object in this sentence.
  - severity: medium
    issue: The existing footnote markers are both placed at the sentence end and do not anchor the specific expressions they explain.
    rationale: The eager-awaiting note belongs with “tunakingojea,” and the lexical alternative for ὑπομονή belongs with “uvumilivu.”
  revised_text: Lakini ikiwa tunatumaini kile tusichokiona, tunakingojea[a] kwa uvumilivu.[b]
  revised_footnotes:
  - marker: a
    text: Kitenzi hiki kinaweza pia kutafsiriwa “tunakingojea kwa hamu.”
    reason: lexical_alternative
  - marker: b
    text: Au “kwa saburi.”
    reason: lexical_alternative
  revision_rationale: The revision preserves the Greek wording’s restraint about the hoped-for object, its present-tense conditional construction, and the sense of awaiting through steadfast endurance. It removes an unnecessary doublet, uses more idiomatic verbal phrasing, and aligns each note with its relevant term.
