  text: εἰ δὲ ὃ οὐ βλέπομεν ἐλπίζομεν, δι’ ὑπομονῆς ἀπεκδεχόμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/025.yaml
  text: But if we hope for what we do not see[b][a], we wait for it with patient endurance.
translation:
  language: sw
  text: Lakini ikiwa tunatumaini kile tusichokiona, tunakingojea[a] kwa uvumilivu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kitenzi hiki kinaweza pia kutafsiriwa “tunakingojea kwa hamu.”
    reason: lexical_alternative
  - marker: b
    text: Au “kwa saburi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: Lakini ikiwa
  rationale: Inahifadhi maana ya sharti katika εἰ na nguvu ya δέ ya kuendeleza hoja kwa utofauti mdogo.
- source_word: ὃ οὐ βλέπομεν
  choice: kile tusichokiona
  rationale: Ni Kiswahili cha kawaida kinachohifadhi kiwakilishi cha kitu na hali ya sasa ya ‘kutokiona,’ bila kuongeza wazo la kutoweza kuona.
- source_word: ἐλπίζομεν
  choice: tunatumainia
  rationale: Kitenzi hiki kinaeleza tumaini linaloelekezwa kwa kitu kinachotazamiwa, na kinahifadhi hali ya sasa.
- source_word: δι’ ὑπομονῆς
  choice: kwa saburi na ustahimilivu
  rationale: ὑπομονή hujumuisha kungoja kwa saburi pamoja na kudumu imara katika kuchelewa au shida; jozi hii ni wazi na ya asili kwa wasomaji wa Kiswahili.
- source_word: ἀπεκδεχόμεθα
  choice: tunakingojea
  rationale: Inawasilisha kungoja kitu kilichotajwa; maana ya matarajio yenye hamu imehifadhiwa katika tanbihi bila kuifanya sentensi kuu kuwa nzito.
theological_decisions:
- issue: Tumaini la Kikristo kuhusiana na utimilifu wa baadaye usioonekana
  choice: Kitu kinachotumainiwa kimeachwa kama ‘kile tusichokiona.’
  alternative: Kukitaja wazi kuwa wokovu, ukombozi, au ufufuo.
  rationale: Muktadha unasaidia kutambua kinachorejelewa, lakini mstari wenyewe haukitaji kwa jina. Tafsiri haiongezi ufafanuzi wa kiteolojia usio katika kishazi cha Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Saburi na ustahimilivu’ linaonyesha upana wa ὑπομονή kwa lugha inayoeleweka; tanbihi zote zimewekewa alama katika matini kuu.
