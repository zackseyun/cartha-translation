source:
  edition: SBLGNT
  text: τὸ γὰρ ἀδύνατον τοῦ νόμου, ἐν ᾧ ἠσθένει διὰ τῆς σαρκός, ὁ θεὸς τὸν ἑαυτοῦ υἱὸν πέμψας ἐν ὁμοιώματι σαρκὸς ἁμαρτίας καὶ περὶ ἁμαρτίας κατέκρινε τὴν ἁμαρτίαν ἐν τῇ σαρκί,
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/003.yaml
  text: For what the law could not do[a], in that it was weak through the flesh, God did by sending his own Son in the likeness of sinful flesh and for sin; he condemned sin in the flesh[d][c][b],
translation:
  language: sw
  text: Kwa maana, jambo ambalo sheria haikuweza kulifanya[a], kwa kuwa ilikuwa dhaifu kwa njia ya mwili[b], Mungu alilifanya kwa kumtuma Mwana wake mwenyewe katika mfano wa mwili wenye dhambi[c] na kwa ajili ya dhambi[d]; aliihukumu dhambi katika mwili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa tafsiri ya karibu zaidi na muundo wa Kigiriki: “kutoweza kwa sheria.”'
    reason: lexical_alternative
  - marker: b
    text: “Mwili” hapa huenda unamaanisha ubinadamu katika udhaifu wake; baadhi ya tafsiri hutumia usemi wa kufasiri zaidi, “asili ya dhambi,” katika mazingira fulani.
    reason: lexical_alternative
  - marker: c
    text: “Katika mfano wa mwili wenye dhambi” huthibitisha ubinadamu halisi wa Mwana, huku ikitofautisha kwa uangalifu Mwana mwenyewe na dhambi.
    reason: cultural_note
  - marker: d
    text: Au “kama dhabihu ya dhambi.” Usemi wa Kigiriki “kwa ajili ya dhambi” unaweza kuwa na maana ya kidhabihu.
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ ἀδύνατον τοῦ νόμου
  choice: jambo ambalo sheria haikuweza kulifanya
  rationale: Muundo huu wa Kiswahili unaeleza kwa kawaida kutoweza kwa sheria, huku ukiendeleza maana ya usemi wa Kigiriki usio na nafsi.
- source_word: ἐν ᾧ ἠσθένει διὰ τῆς σαρκός
  choice: kwa kuwa ilikuwa dhaifu kwa sababu ya mwili
  rationale: Kifungu hiki kinaeleza sababu ya sheria kutoweza kutimiza jambo hilo. ‘Mwili’ huhifadhi taswira na upana wa σάρξ bila kuibadili moja kwa moja kuwa ‘asili ya dhambi.’
- source_word: τὸν ἑαυτοῦ υἱόν
  choice: Mwana wake mwenyewe
  rationale: ‘Mwenyewe’ huhifadhi mkazo wa ἑαυτοῦ kuhusu uhusiano wa Mungu na Mwana.
- source_word: ἐν ὁμοιώματι σαρκὸς ἁμαρτίας
  choice: katika mfano wa mwili wenye dhambi
  rationale: Tafsiri hii huhifadhi ‘mfano’ pamoja na uhusiano wa karibu kati ya mwili na dhambi katika usemi wa Kigiriki, bila kusema kwamba Mwana mwenyewe alikuwa mwenye dhambi.
- source_word: περὶ ἁμαρτίας
  choice: kwa ajili ya dhambi
  rationale: Huu ni usemi mpana na wa karibu na Kigiriki unaohifadhi uwezekano wa maana ya dhabihu bila kuilazimisha katika matini kuu.
- source_word: κατέκρινε τὴν ἁμαρτίαν
  choice: aliihukumu dhambi
  rationale: ‘Aliihukumu’ huhifadhi nguvu ya kimahakama ya kitenzi κατέκρινε.
- source_word: ἐν τῇ σαρκί
  choice: katika mwili
  rationale: Kigiriki hakitaji wazi ‘mwili wake’; tafsiri hii huhifadhi ufupi na utata huo.
theological_decisions:
- issue: Maana ya σάρξ katika aya hii
  choice: Imetafsiriwa ‘mwili’ katika sehemu zote mbili.
  alternative: ‘asili ya dhambi’ au ‘ubinadamu dhaifu’
  rationale: ‘Mwili’ huhifadhi matumizi yenye tabaka nyingi ya Paulo na uhusiano kati ya udhaifu wa kibinadamu na kuja kwa Mwana katika mwili, bila kuingiza ufafanuzi wa kimadhehebu.
- issue: Maana ya περὶ ἁμαρτίας
  choice: kwa ajili ya dhambi
  alternative: kama dhabihu ya dhambi
  rationale: Usemi wa Kigiriki unaweza kuwa wa jumla au kuwa na maana ya kidhabihu kutokana na matumizi ya Maandiko ya Kigiriki. Matini kuu inahifadhi upana huo, na maana ya kidhabihu imeonyeshwa katika tanbihi.
- issue: Nguvu ya Kikristo ya ‘katika mfano wa mwili wenye dhambi’
  choice: Neno ‘mfano’ limehifadhiwa, huku Mwana akitajwa kuwa alikuja katika mwili unaohusishwa na hali ya dhambi ya wanadamu.
  alternative: Ufafanuzi unaosema moja kwa moja ama kwamba ulikuwa mwili wa dhambi ama kwamba ulikuwa mwonekano tu wa mwili
  rationale: Usemi wa Kigiriki unathibitisha kuhusika halisi kwa Mwana katika ubinadamu, huku ukiepuka kumhusisha yeye binafsi na dhambi. Tafsiri haipaswi kuondoa mvutano huo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wenye heshima na unaosomeka kwa urahisi. Sentensi inafuata hoja ya Kigiriki lakini inaongeza ‘Mungu alilifanya,’ ambalo limeeleweka kutokana na kinyume kati ya kutoweza kwa sheria na tendo la Mungu. Alama za tanbihi zimepangwa kulingana na mahali zinapohusika katika matini.
