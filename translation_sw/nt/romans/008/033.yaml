  text: Who will bring a charge against God's chosen ones? It is God who justifies[a][b][c].
translation:
  language: sw
  text: Ni nani atakayewashtaki wale waliochaguliwa na Mungu?[a][b] Mungu ndiye anayewahesabia haki.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “wateule wa Mungu.”'
    reason: lexical_alternative
  - marker: b
    text: 'Au: “Ni nani atakayewalaumu wale waliochaguliwa na Mungu?”'
    reason: lexical_alternative
  - marker: c
    text: 'Kirai “anayewahesabia haki” kina maana ya kimahakama: Mungu ndiye anayewatangaza kuwa wenye haki.'
    reason: cultural_note
lexical_decisions:
- source_word: τίς
  choice: Ni nani
  rationale: Kiwakilishi cha kuuliza kinaanzisha swali la balagha; “Ni nani” ni usemi wa kawaida na wa moja kwa moja katika Kiswahili.
- source_word: ἐγκαλέσει
  choice: atakayewashtaki
  rationale: Kitenzi hiki kina maana ya kisheria ya kuleta shtaka; “kuwashtaki” huhifadhi mazingira ya mahakama kwa lugha ya sasa.
- source_word: κατὰ
  choice: -wa- (yule anayeshtakiwa)
  rationale: Maana ya “dhidi ya” imewasilishwa kiasili ndani ya muundo wa kitenzi “kuwashtaki,” bila kulazimisha kirai kisicho cha kawaida.
- source_word: ἐκλεκτῶν θεοῦ
  choice: wale waliochaguliwa na Mungu
  rationale: Kivumishi kilichotumika kama nomino kinaonyesha watu ambao Mungu amewachagua; muundo huu ni wazi na hauegemei istilahi ya kidhehebu.
- source_word: θεὸς
  choice: Mungu ndiye
  rationale: “Ndiye” huonyesha msisitizo wa nomino θεός iliyotangulizwa katika kishazi kifupi cha Kigiriki.
- source_word: ὁ δικαιῶν
  choice: anayewahesabia haki
  rationale: Kirai hiki humtambulisha Mungu kuwa yule anayewatangaza kuwa wenye haki; “kuhesabia haki” huhifadhi maana ya kimahakama iliyo muhimu hapa.
theological_decisions:
- issue: Kutafsiri ἐκλεκτῶν bila kuingiza mfumo wa baadaye wa mafundisho
  choice: wale waliochaguliwa na Mungu
  alternative: wateule wa Mungu
  rationale: Tafsiri iliyochaguliwa inaeleza wazi kwamba Mungu ndiye anayechagua, huku ikiepuka kutegemea neno la kitaalamu linaloweza kubeba maana za ziada za kimadhehebu.
- issue: Kuhifadhi msisitizo na maana ya kimahakama ya θεὸς ὁ δικαιῶν
  choice: Mungu ndiye anayewahesabia haki
  alternative: Mungu ndiye anayewatangaza kuwa wenye haki
  rationale: Muundo wa “ndiye” huhifadhi msisitizo wa Kigiriki, na “kuwahesabia haki” huendeleza taswira ya mahakama bila kufanya kishazi kuwa maelezo marefu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa swali la balagha na taswira ya kisheria zimehifadhiwa.
