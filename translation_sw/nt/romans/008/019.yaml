  text: Kwa maana uumbaji unasubiri kwa hamu kubwa kufunuliwa kwa wana wa Mungu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watoto wa Mungu.” Kigiriki kinasema “wana,” neno ambalo pia linaweza kusisitiza hadhi ya uana na urithi.
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: Kwa maana
  rationale: Inaendeleza uhusiano wa maelezo na kauli iliyotangulia kwa Kiswahili cha kawaida.
- source_word: ἀποκαραδοκία
  choice: kwa hamu kubwa
  rationale: Nomino hii huonyesha matarajio makali; imetafsiriwa kama kirai kielezi kinachoandamana na “unangoja” ili sentensi iwe ya asili katika Kiswahili.
- source_word: κτίσεως
  choice: uumbaji wote
  rationale: Katika muktadha huu neno linamaanisha kwa ujumla vitu vilivyoumbwa, si kiumbe kimoja; “wote” huweka wazi maana hiyo ya jumla.
- source_word: ἀποκάλυψιν
  choice: kufunuliwa
  rationale: Huhifadhi wazo la hali au utambulisho uliofichika kuwekwa wazi wakati ujao.
- source_word: υἱῶν
  choice: wana
  rationale: Hufuata nomino ya Kigiriki iliyo katika wingi wa kiume na pia huhifadhi mwangwi unaowezekana wa hadhi ya kifamilia na urithi; Kiswahili “wana” linaweza kutumiwa kwa maana pana zaidi kulingana na muktadha.
- source_word: θεοῦ
  choice: wa Mungu
  rationale: Ni tafsiri ya kawaida ya uhusiano unaoonyeshwa na hali milikishi ya Kigiriki.
- source_word: ἀπεκδέχεται
  choice: unangoja
  rationale: Huonyesha kusubiri jambo la wakati ujao; uzito wa matarajio tayari umeonyeshwa na “kwa hamu kubwa,” hivyo huepuka kurudia maana.
theological_decisions:
- issue: Ikiwa υἱῶν θεοῦ itafsiriwe kwa namna ya kijinsia kama “wana wa Mungu” au kwa namna jumuishi zaidi kama “watoto wa Mungu.”
  choice: wana wa Mungu
  alternative: watoto wa Mungu
  rationale: “Wana” hufuata umbo la kiume la Kigiriki na huhifadhi uwezekano wa mkazo juu ya hadhi ya kifamilia na urithi katika hoja ya Paulo. Tanbihi inatoa mbadala halali wa maana jumuishi bila kufuta mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “unangoja kwa hamu kubwa” ni wa asili na unaonyesha nguvu ya ἀποκαραδοκία bila kuwa mzito kupita kiasi.
