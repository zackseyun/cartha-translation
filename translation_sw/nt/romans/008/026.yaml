  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ὡσαύτως δὲ καὶ τὸ πνεῦμα συναντιλαμβάνεται ⸂τῇ ἀσθενείᾳ⸃ ἡμῶν· τὸ γὰρ τί ⸀προσευξώμεθα καθὸ δεῖ οὐκ οἴδαμεν, ἀλλὰ αὐτὸ τὸ πνεῦμα ⸀ὑπερεντυγχάνει στεναγμοῖς ἀλαλήτοις,
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/026.yaml
  text: Likewise[a], the Spirit also helps in our weakness. For we do not know what we should pray for as we ought, but the Spirit himself intercedes with inexpressible groanings[b],
translation:
  language: sw
  text: Vivyo hivyo, Roho naye hutusaidia katika udhaifu wetu. Kwa maana hatujui jambo tunalopaswa kuombea kama itupasavyo, lakini Roho mwenyewe hutuombea kwa miguno isiyoweza kutamkwa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa miguno isiyoweza kuelezwa kwa maneno,” au “kwa miguno isiyo ya maneno.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡσαύτως δὲ καὶ
  choice: Vivyo hivyo, Roho naye
  rationale: “Vivyo hivyo” linaendeleza uhusiano na hoja iliyotangulia; “naye” linawakilisha pia καί kwa Kiswahili cha kawaida.
- source_word: συναντιλαμβάνεται
  choice: hutusaidia katika
  rationale: Kitenzi kina wazo la kuja kusaidia na kubeba pamoja mzigo; “hutusaidia katika” ni cha asili na kinaendana na kirai kinachofuata.
- source_word: τῇ ἀσθενείᾳ ἡμῶν
  choice: udhaifu wetu
  rationale: Umoja wa Kigiriki umehifadhiwa na haubanwi kuwa udhaifu wa kimwili au wa kiroho pekee.
- source_word: τὸ γὰρ τί προσευξώμεθα καθὸ δεῖ
  choice: tunachopaswa kuomba jinsi itupasavyo
  rationale: 'Huhifadhi yote mawili: jambo la kuomba na namna inayofaa ya kuomba, bila kuyaunganisha kuwa wazo moja.'
- source_word: αὐτὸ τὸ πνεῦμα
  choice: Roho mwenyewe
  rationale: Muundo wa msisitizo unaonyesha kuwa Roho ndiye binafsi anayefanya tendo hilo; “mwenyewe” ni ya kawaida kwa nafsi katika Kiswahili.
- source_word: ὑπερεντυγχάνει
  choice: hutuombea
  rationale: Hutoa kwa ufupi maana ya kuingilia kati kwa niaba yetu; kiambishi “-tu-” kinaweka wazi walengwa wanaodokezwa na muktadha.
- source_word: στεναγμοῖς ἀλαλήτοις
  choice: kwa kuugua kusikoweza kusemwa
  rationale: ἀλάλητος inaweza kumaanisha kusikosemwa, kusiko kwa maneno, au kusikoweza kuonyeshwa kwa maneno. Tafsiri hii inadumisha kutosemeka bila kuamua kwa lazima kama ni kimya kabisa.
theological_decisions:
- issue: Kama Roho aonyeshwe kwa lugha ya nafsi au kama kitu kisicho na nafsi kwa sababu πνεῦμα ni nomino ya jinsia ya kati
  choice: Roho mwenyewe
  alternative: Roho yenyewe; Roho
  rationale: Jinsia ya kisarufi ya Kigiriki haiamui kutokuwa nafsi, na muktadha unamwonyesha Roho akisaidia na kuombea. Kiswahili cha asili hutumia “mwenyewe” kwa mtendaji wa binafsi.
- issue: Kama kuugua kunatoka kwa waamini au kwa Roho
  choice: Kirai kimeunganishwa na tendo la Roho la kutuombea
  alternative: Kukitafsiri wazi kuwa ni kuugua kwa waamini
  rationale: Kisarufi, “kwa kuugua” kinaeleza ὑπερεντυγχάνει na αὐτὸ τὸ πνεῦμα ndiyo kiima. Tafsiri haiongezi maelezo yanayozidi maandishi kuhusu chanzo au namna ya kuugua huko.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Jinsi itupasavyo” ni rasmi kwa kiasi lakini inaeleweka na huhifadhi utofauti kati ya tunachoomba na namna ifaayo ya kuomba.
