  text: ἵνα τὸ δικαίωμα τοῦ νόμου πληρωθῇ ἐν ἡμῖν τοῖς μὴ κατὰ σάρκα περιπατοῦσιν ἀλλὰ κατὰ πνεῦμα·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/004.yaml
  text: so that the righteous requirement of the law might be fulfilled in us[c][b][a], who do not walk according to the flesh but according to the Spirit.
translation:
  language: sw
  text: ili takwa la haki la Sheria[a] litimizwe ndani yetu, sisi ambao hatuenendi kwa kufuata mwili[b], bali kwa kufuata Roho[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “takwa la Sheria.”
    reason: lexical_alternative
  - marker: b
    text: “Mwili” hapa unamaanisha hali ya kibinadamu iliyoanguka au maisha yanayoelekezwa mbali na Mungu; wengine hutafsiri “asili ya dhambi.”
    reason: lexical_alternative
  - marker: c
    text: Au “roho”; katika muktadha wa Waroma 8, huenda hapa inamrejelea Roho Mtakatifu.
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: ili
  rationale: Huwasilisha kusudi au matokeo yanayokusudiwa kwa lugha ya kawaida na ya moja kwa moja.
- source_word: δικαίωμα
  choice: takwa la haki
  rationale: Huhifadhi pamoja maana ya jambo linalotakiwa na Sheria na sifa yake ya kuwa la haki, badala ya kulifanya kuwa amri moja mahususi.
- source_word: νόμος
  choice: Sheria
  rationale: Ni istilahi ya kawaida katika muktadha wa Paulo kwa Sheria; herufi kubwa inasaidia kuonyesha matumizi hayo maalumu.
- source_word: πληρωθῇ
  choice: litimizwe
  rationale: Huhifadhi kauli tendwa na maana ya kutimizwa katika kishazi cha kusudi.
- source_word: ἐν ἡμῖν
  choice: ndani yetu
  rationale: Hufuata kwa karibu ἐν ἡμῖν bila kuongeza wazo lenye nguvu zaidi kwamba jambo hilo linatimizwa ‘na sisi.’
- source_word: περιπατοῦσιν
  choice: tusioenenda
  rationale: ‘Kuenenda’ huhifadhi sitiari ya Paulo ya mwenendo wa maisha huku ikibaki lugha yenye heshima na inayoeleweka.
- source_word: σάρξ
  choice: mwili
  rationale: Huhifadhi neno pana la Paulo bila kulifasiri moja kwa moja kuwa ‘asili ya dhambi’; maana yake ya kimuktadha imefafanuliwa katika tanbihi.
- source_word: πνεῦμα
  choice: Roho
  rationale: Muktadha wa Waroma 8 unaelekeza zaidi kwa Roho Mtakatifu, ingawa uwezekano wa kusoma ‘roho’ umehifadhiwa katika tanbihi.
- source_word: κατὰ σάρκα ... κατὰ πνεῦμα
  choice: kwa kufuata mwili ... kwa kufuata Roho
  rationale: ‘Kwa kufuata’ ni Kiswahili cha kawaida kinachoonyesha mwenendo unaoongozwa au kupangwa kulingana na kila upande wa utofautishaji.
theological_decisions:
- issue: Ikiwa πνεῦμα inamaanisha roho ya mwanadamu au Roho Mtakatifu
  choice: Roho
  alternative: roho
  rationale: Muktadha wa karibu wa Waroma 8 unasisitiza sana kazi na eneo la Roho Mtakatifu; hata hivyo, umbo la Kigiriki pekee haliondoi kabisa usomaji wa ‘roho,’ kwa hiyo umeonyeshwa katika tanbihi.
- issue: Ikiwa ἐν ἡμῖν inamaanisha kutimizwa na sisi, ndani yetu, au miongoni mwetu
  choice: ndani yetu
  alternative: na sisi; miongoni mwetu
  rationale: Huhifadhi kihusishi ἐν kwa karibu na huepuka kuingiza dai la wazi kuhusu utendaji wa wanadamu ambalo kifungu hakisemi moja kwa moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Kuenenda’ limetumiwa kwa maana ya mwenendo wa maisha ili kuhifadhi sitiari ya Kigiriki; ‘kwa kufuata’ hufanya utofautishaji huo uwe wazi kwa msomaji wa kawaida.
