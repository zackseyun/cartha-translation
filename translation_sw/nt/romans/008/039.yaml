  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οὔτε ὕψωμα οὔτε βάθος οὔτε τις κτίσις ἑτέρα δυνήσεται ἡμᾶς χωρίσαι ἀπὸ τῆς ἀγάπης τοῦ θεοῦ τῆς ἐν Χριστῷ Ἰησοῦ τῷ κυρίῳ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/039.yaml
  text: nor height nor depth nor any other created thing will be able to separate us from the love of God that is in Messiah Jesus our Lord[a][b][c].
translation:
  language: sw
  text: wala urefu, wala kina, wala kitu kingine chochote kilichoumbwa[a], kitaweza kututenga na upendo wa Mungu ulio katika Masihi Yesu Bwana wetu[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kitu kingine chochote katika uumbaji” au “kiumbe kingine chochote.”
    reason: lexical_alternative
  - marker: b
    text: “Masihi Yesu” kwa kawaida hutafsiriwa “Kristo Yesu.”
    reason: lexical_alternative
  - marker: c
    text: Hapa “upendo wa Mungu” huenda ikimaanisha upendo wa Mungu kwetu.
    reason: alternative_reading
lexical_decisions:
- source_word: ὕψωμα
  choice: kilicho juu
  rationale: Katika jozi yake na βάθος, neno hili linaeleweka kwa maana ya anga au kiwango cha juu. ‘Kilicho juu’ ni Kiswahili cha kawaida na hudumisha ulinganifu wa balagha.
- source_word: βάθος
  choice: kilicho chini
  rationale: Likioanishwa na ὕψωμα, linaonyesha upande wa chini au kina. ‘Kilicho chini’ huunda jozi ya asili na ‘kilicho juu’ bila kulazimisha maana ya ‘kuzimu.’
- source_word: κτίσις ἑτέρα
  choice: kitu kingine chochote kilichoumbwa
  rationale: κτίσις inaweza kumaanisha kiumbe au kitu kilichoumbwa; muundo huu unasisitiza kwamba hakuna chochote katika uumbaji kinachoweza kutenga, huku ἑτέρα na τις zikionyeshwa kwa ‘kingine chochote.’
- source_word: δυνήσεται
  choice: kitaweza
  rationale: Huhifadhi uwezo unaoelezwa katika wakati ujao.
- source_word: χωρίσαι
  choice: kututenga
  rationale: ‘Kutenga’ ni tafsiri ya moja kwa moja na ya kawaida kwa wazo la kuwatenganisha watu na upendo wa Mungu.
- source_word: ἀγάπης τοῦ θεοῦ
  choice: upendo wa Mungu
  rationale: Huhifadhi muundo wa jenitivi wa Kigiriki na kutokufafanua kimyakimya mwelekeo wake, ingawa muktadha unaelekea kumaanisha upendo wa Mungu kwetu.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: katika Masihi Yesu
  rationale: Χριστός ni cheo kinachomaanisha Masihi; ‘katika’ huhifadhi ἐν na usemi wa Paulo wa kuwa ndani ya Masihi.
- source_word: κυρίῳ ἡμῶν
  choice: Bwana wetu
  rationale: Ni tafsiri iliyo wazi, yenye hadhi, na iliyozoeleka ya κύριος katika muktadha huu.
theological_decisions:
- issue: Maana ya jenitivi katika ‘upendo wa Mungu’
  choice: Muundo wa ‘upendo wa Mungu’ umehifadhiwa katika matini; kwa muktadha unaelekea kumaanisha upendo wa Mungu kwetu.
  alternative: Upendo wetu kwa Mungu, au usemi mpana unaoweza kubeba maana zote mbili.
  rationale: Waroma 8:31–39 hukazia matendo na uaminifu wa Mungu kwa watu wake. Hata hivyo, muundo wa Kigiriki haujaelezwa zaidi katika matini kuu, hivyo tanbihi inaelekeza maana inayowezekana zaidi bila kufuta kabisa utata wa kisarufi.
- issue: Tafsiri ya Χριστός
  choice: Masihi
  alternative: Kristo
  rationale: Neno la Kigiriki ni cheo, na ‘Masihi’ huwasilisha maana yake wazi; tanbihi inataja umbo la jadi ‘Kristo.’
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa ‘wala ... wala ...’ umeendeleza mfululizo wa balagha wa Kigiriki. ‘Kilicho juu/kilicho chini’ kimetumiwa badala ya nomino nzito ili mstari usomeke kwa urahisi kwa wasomaji wa kawaida.
