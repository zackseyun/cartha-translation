base_translation:
  language: en
  yaml_path: translation/nt/romans/008/015.yaml
  text: For you did not receive a spirit of slavery leading back into fear[a], but you received the Spirit of adoption as sons, by whom we cry[c][b], “Abba! Father!”
translation:
  language: sw
  text: Kwa maana hamkupokea roho ya utumwa ya kuwarudisha tena katika hofu, bali mlipokea Roho wa kufanywa kuwa wana[b]; ndani ya Roho huyo[c] tunapaza sauti, “Abba! Baba!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Kihalisi zaidi, “kufanywa kuwa wana”; usemi huu unahusu kupewa hadhi na haki za mwana, kutia ndani urithi. Au, “roho wa kufanywa kuwa wana.”
    reason: lexical_alternative
  - marker: c
    text: Au, “kwa njia ya Roho huyo.” Kigiriki kinasema kihalisi, “ndani yake,” na kiwakilishi chake kinaafikiana kisarufi na neno “roho.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεῦμα δουλείας
  choice: roho ya utumwa
  rationale: Neno “utumwa” linadumisha picha ya hali ya mtumwa na tofauti yake na kufanywa kuwa wana. Herufi ndogo katika “roho” inaacha wazi ikiwa hapa ni hali au nguvu inayotawala, bila kuitambulisha moja kwa moja kuwa Roho Mtakatifu.
- source_word: πάλιν εἰς φόβον
  choice: ili mrudi tena katika hofu
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaohifadhi wazo la πάλιν la kurudia au kurudi na mwelekeo wa εἰς φόβον kuelekea katika hofu.
- source_word: πνεῦμα υἱοθεσίας
  choice: Roho wa kufanywa kuwa wana
  rationale: Muktadha wa Waroma 8 unaelekeza kwa Roho Mtakatifu, huku “kufanywa kuwa wana” ikihifadhi hali ya kisheria na urithi inayodokezwa na υἱοθεσία. Tanbihi inadumisha uwezekano wa kuelewa muundo huu kwa namna isiyomtaja Roho Mtakatifu waziwazi.
- source_word: υἱοθεσίας
  choice: kufanywa kuwa wana
  rationale: Tafsiri hii inahifadhi kipengele cha “wana” katika neno la Kigiriki na maana ya kupewa hadhi ya mwana na haki za urithi, badala ya kutumia tu neno pana “kuasiliwa.”
- source_word: ἐν ᾧ
  choice: ndani ya Roho huyo
  rationale: Hii inafuata kwa karibu maana ya msingi ya “ndani yake” na inamtaja Roho kwa njia ya kawaida zaidi katika Kiswahili. Uwezekano wa maana ya kiutendaji, “kwa njia ya Roho huyo,” umewekwa katika tanbihi.
- source_word: κράζομεν
  choice: tunapaza sauti
  rationale: Usemi huu unaonyesha mwito wenye nguvu na wa wazi kuliko “tunasema,” bila kulazimisha kwamba ni kilio cha huzuni.
- source_word: Αββα ὁ πατήρ
  choice: Abba! Baba!
  rationale: “Abba” imenukuliwa kwa sauti yake, na ὁ πατήρ imetafsiriwa “Baba.” Alama za mshangao zinaonyesha nguvu ya mwito huo bila kuondoa maneno yote mawili.
theological_decisions:
- issue: Ikiwa πνεῦμα υἱοθεσίας imtaje wazi Roho Mtakatifu au ibaki kama “roho” isiyoainishwa
  choice: Roho wa kufanywa kuwa wana
  alternative: roho ya kufanywa kuwa wana
  rationale: Muktadha wa karibu unamtambulisha Roho wa Mungu kama mhusika binafsi, hasa kwa mwito unaofuata kwa Baba; hata hivyo, muundo wa sentensi unalinganisha “roho ya utumwa” na “roho ya kufanywa kuwa wana.” Herufi kubwa katika matini kuu inafuata muktadha, na tanbihi inahifadhi usomaji usioainishwa wazi.
- issue: Maana ya ἐν ᾧ kuwa ya mahali/ushirika au ya kiutendaji
  choice: ndani ya Roho huyo
  alternative: kwa njia ya Roho huyo
  rationale: Kigiriki kinasema kihalisi “ndani yake,” lakini katika muktadha kinaweza kueleza pia njia au uwezo unaotolewa na Roho. Matini kuu huhifadhi muundo wa asili kwa kadiri Kiswahili kinavyoruhusu, na tanbihi inaonyesha maana nyingine halali.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wa heshima na unaosomeka kwa urahisi. “Kufanywa kuwa wana” limetumiwa badala ya istilahi nzito ya kisheria ili maana ya hadhi ya mwana na urithi ibaki wazi. “Tunapaza sauti” hudumisha nguvu ya κράζομεν. Matini haiongezi “Mtakatifu,” ingawa herufi kubwa katika “Roho” inaonyesha rejeo linalowezekana sana katika muktadha.
