  text: But in all these things we overwhelmingly conquer through the one who loved us[a][b].
translation:
  language: sw
  text: Lakini katika mambo haya yote tunashinda, na zaidi ya kushinda, kwa njia ya yule aliyetupenda.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Huenda akimaanishwa Kristo, kulingana na muktadha wa karibu.
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλ’
  choice: Lakini
  rationale: Huonyesha utofauti wenye nguvu na dhiki zilizotajwa kabla, kwa Kiswahili cha kawaida na chenye heshima.
- source_word: ἐν τούτοις πᾶσιν
  choice: katika mambo haya yote
  rationale: Hufuata kwa karibu muundo wa Kigiriki na kurejelea mambo magumu yaliyoorodheshwa katika mstari uliotangulia.
- source_word: ὑπερνικῶμεν
  choice: tunashinda kabisa
  rationale: Kitenzi hiki kinaimarisha maana ya kushinda; “kabisa” huwasilisha ushindi mkubwa na wa hakika huku kikihifadhi umbo la kitenzi.
- source_word: διὰ
  choice: kwa njia ya
  rationale: Pamoja na kishazi kinachofuata, hapa kwa kawaida huonyesha njia au mhusika ambaye kupitia kwake ushindi unapatikana.
- source_word: τοῦ ἀγαπήσαντος ἡμᾶς
  choice: yule aliyetupenda
  rationale: Huhifadhi umbo la kirai cha Kigiriki bila kumtaja wazi mhusika ambaye maandishi yenyewe hayamtaji kwa jina.
theological_decisions:
- issue: Utambulisho wa “yule aliyetupenda”
  choice: Mhusika hakutajwa kwa jina katika matini kuu.
  alternative: Kumtaja kuwa Kristo, au Mungu katika Kristo.
  rationale: Muktadha wa karibu unaelekeza sana kwa Kristo, lakini Kigiriki cha mstari huu hakitaji jina; tafsiri inahifadhi hali hiyo huku tanbihi ikitoa ufafanuzi wa kimuktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, rahisi kueleweka na chenye hadhi. “Tunashinda kabisa” ni cha kiasili zaidi kuliko tafsiri ya neno kwa neno kama “sisi ni zaidi ya washindi,” na hudumisha nguvu ya ὑπερνικῶμεν.
