  text: Therefore[b][a], there is now no condemnation for those in Messiah Jesus.
translation:
  language: sw
  text: Kwa hiyo, sasa hakuna hukumu ya adhabu kwa wale walio katika Masihi[b] Yesu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Baadhi ya hati za baadaye zinaongeza: “ambao hawaenendi kwa kufuata mwili.” Hati za kale zaidi za Kigiriki zinaunga mkono maneno mafupi yaliyo katika mstari huu.'
    reason: textual_variant
  - marker: b
