    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐδὲν
  choice: hakuna
  rationale: 'Pamoja na κατάκριμα, neno hili linatoa ukanushaji kamili na wa asili kwa Kiswahili: “hakuna hukumu ya adhabu.”'
- source_word: ἄρα
  choice: Kwa hiyo
  rationale: Linaonyesha hitimisho linalotokana na hoja iliyotangulia katika Waroma.
- source_word: νῦν
  choice: sasa
  rationale: Limehifadhiwa wazi kwa sababu Paulo anasisitiza hali ya sasa inayotokana na tendo la Mungu katika Masihi.
- source_word: κατάκριμα
  choice: hukumu ya adhabu
  rationale: Kifungu hiki kinaonyesha hukumu mbaya ya kimahakama, si hisia ya hatia tu; pia ni wazi zaidi kuliko “hukumu” peke yake, ambalo linaweza kuwa na maana pana au isiyo hasi.
- source_word: τοῖς ἐν Χριστῷ Ἰησοῦ
  choice: kwa wale walio katika Masihi Yesu
  rationale: Muundo huu ni wa kawaida kwa Kiswahili huku ukihifadhi usemi wa Paulo wa kuwa “katika” Masihi, bila kuufafanua kwa namna inayopunguza wingi wa maana zake.
- source_word: Χριστῷ
  choice: Masihi
  rationale: Cheo hicho kimetafsiriwa kwa maana yake badala ya kutoholewa tu, kwa kuwa maana yake ya kimasihi bado ni hai katika muktadha huu.
- source_word: Ἰησοῦ
  choice: Yesu
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
theological_decisions:
- issue: Maana ya usemi “katika Masihi Yesu”
  choice: Kuhifadhi “katika” kama usemi unaowatambulisha wale walio wa Masihi na walioshirikishwa naye.
  alternative: Kutafsiri kwa maana nyepesi kama “kwa sababu ya Masihi Yesu.”
  rationale: Matumizi ya ἐν hapa katika maandishi ya Paulo yana maana pana ya uhusiano na ushirika na Masihi. Kuyahifadhi moja kwa moja huepuka kufunga mvutano huo wa kiteolojia kwa ufafanuzi mmoja.
- issue: Nguvu ya kimahakama ya κατάκριμα
  choice: hukumu ya adhabu
  alternative: hukumu
  rationale: “Hukumu ya adhabu” inaweka wazi kwamba kinachokanushwa ni hukumu mbaya yenye matokeo ya kuadhibiwa, bila kuifanya kuwa hisia binafsi ya hatia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. “Kwa hiyo” hudumisha uhusiano wa kimantiki, na “walio katika” huhifadhi kwa makusudi lugha ya Paulo ya ushirika na Masihi.
