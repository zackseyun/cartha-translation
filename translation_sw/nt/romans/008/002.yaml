  source_fidelity: 'Tafsiri inafuata kwa uaminifu SBLGNT: inahifadhi urudiaji wa νόμος kama “sheria,” genitivi “Roho wa uzima,” mahali/ushirika wa “katika Masihi Yesu,” na tendo la aoristi lenye matokeo ya sasa katika “imekuweka huru.” Kiambishi -ku- hulingana na σε (wewe), na tanbihi b hutaja kwa usahihi usomaji wa “mimi.”'
