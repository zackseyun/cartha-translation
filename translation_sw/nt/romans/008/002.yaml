id: ROM.8.2
reference: Romans 8:2
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὁ γὰρ νόμος τοῦ πνεύματος τῆς ζωῆς ἐν Χριστῷ Ἰησοῦ ἠλευθέρωσέν ⸀σε ἀπὸ τοῦ νόμου τῆς ἁμαρτίας καὶ τοῦ θανάτου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/002.yaml
  text: For the law of the Spirit of life in Messiah Jesus has set you free from the law of sin and death[a][b][c].
translation:
  language: sw
  text: Kwa maana sheria ya Roho wa uzima katika Masihi Yesu imekuweka huru kutoka katika sheria ya dhambi na mauti.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au “kanuni”: “kanuni ya Roho wa uzima.”'
    reason: lexical_alternative
  - marker: b
    text: Baadhi ya hati za kale zinasema “meniweka huru” badala ya “imekuweka huru.”
    reason: textual_variant
  - marker: c
    text: 'Tafsiri ya jadi: “katika Kristo Yesu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: νόμος
  choice: sheria
  rationale: Neno lilelile limetumiwa katika sehemu zote mbili ili kuhifadhi urudiaji na mvutano wa sitiari ya Paulo; “kanuni” linawezekana lakini linafinya maana mapema.
- source_word: πνεύματος
  choice: Roho
  rationale: Muktadha wa Waroma 8 unaelekeza kwa Roho Mtakatifu kama atoaye uzima; herufi kubwa inabainisha rejeo hilo bila kuongeza maneno yasiyomo.
- source_word: ζωῆς
  choice: uzima
  rationale: “Uzima” ni neno la kawaida na lenye hadhi katika Kiswahili cha Biblia, na linahifadhi muundo mfupi “Roho wa uzima.”
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: katika Masihi Yesu
  rationale: “Katika” huhifadhi lugha ya Paulo kuhusu kuwamo ndani ya Masihi; Χριστός limetafsiriwa kama cheo “Masihi.”
- source_word: ἠλευθέρωσέν
  choice: imekuweka huru
  rationale: Kauli hii ni ya asili katika Kiswahili na huonyesha tendo lililotimizwa lenye matokeo yanayoendelea.
- source_word: σε
  choice: -ku- (wewe)
  rationale: Imelifuata somo lililochapishwa la nafsi ya pili umoja σε; tofauti ya “mimi” imehifadhiwa katika tanbihi.
- source_word: ἁμαρτίας
  choice: dhambi
  rationale: Tafsiri ya kawaida inayoweza kuonyesha dhambi kama hali na pia kama nguvu inayotawala katika hoja ya Paulo.
- source_word: θανάτου
  choice: mauti
  rationale: “Mauti” ni neno la Kiswahili sanifu lenye hadhi linalofaa jozi ya kifungu “dhambi na mauti.”
theological_decisions:
- issue: Ikiwa πνεύματος inamrejelea Roho Mtakatifu au roho/kanuni ya kiroho
  choice: Roho Mtakatifu (“Roho” kwa herufi kubwa)
  alternative: roho ya mwanadamu au kanuni ya kiroho
  rationale: Katika Waroma 8, utofautishaji kati ya mwili, dhambi, mauti na Roho atoaye uzima unaunga mkono zaidi rejeo kwa Roho wa Mungu.
- issue: Maana ya ἐν Χριστῷ Ἰησοῦ
  choice: katika Masihi Yesu
  alternative: katika Kristo Yesu
  rationale: Muundo wa “katika” umehifadhiwa ili kutofuta mvutano wa lugha ya Paulo kuhusu ushirika au kuwamo ndani ya Masihi; tanbihi inatoa istilahi ya jadi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umerahisishwa kwa usomaji wa kawaida huku urudiaji wa “sheria,” lugha ya “katika,” na utata halisi wa sitiari vikihifadhiwa.
