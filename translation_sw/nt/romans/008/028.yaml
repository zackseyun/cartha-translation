  - severity: medium
    issue: Footnote a renders the explicit-God variant as “Mungu hufanya mambo yote yashirikiane.”
    rationale: The variant presents God as the subject of συνεργεῖ, best represented as God making/working all things together for good. “Yashirikiane” can suggest that the things themselves cooperate, which is less precise.
