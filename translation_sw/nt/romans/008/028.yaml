  text: Οἴδαμεν δὲ ὅτι τοῖς ἀγαπῶσι τὸν θεὸν πάντα ⸀συνεργεῖ εἰς ἀγαθόν, τοῖς κατὰ πρόθεσιν κλητοῖς οὖσιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/028.yaml
  text: And we know that for those who love God, all things work together for good—for those who are called according to purpose.
translation:
  language: sw
  text: Na tunajua kwamba kwa wale wanaompenda Mungu, mambo yote hufanya kazi pamoja kuleta mema[a], kwa wale walioitwa kulingana na kusudi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati husoma, “Mungu hufanya mambo yote yafanye kazi pamoja kuleta mema.”
    reason: textual_variant
  - marker: b
    text: Au, “kulingana na kusudi lake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἴδαμεν
  choice: tunajua
  rationale: Wakati wa sasa unaonyesha maarifa thabiti; “tunajua” ni Kiswahili cha kawaida na cha moja kwa moja.
- source_word: δὲ
  choice: Nasi
  rationale: Kiunganishi hiki ni mpito mwororo unaoendeleza hoja. “Nasi” kinaunganisha sentensi na muktadha bila kuingiza utofauti mkali.
- source_word: τοῖς ἀγαπῶσι τὸν θεόν
  choice: kwa wale wanaompenda Mungu
  rationale: “Kwa” huwasilisha dativu kwa njia ya asili na kulitaja wazi kundi linalohusika.
- source_word: πάντα
  choice: mambo yote
  rationale: Huhifadhi upana wa wingi wa jinsia ya kati bila kuufupisha kuwa dhana finyu.
- source_word: συνεργεῖ
  choice: hufanya kazi pamoja
  rationale: Hufuata maandishi yenye πάντα kama kiima na haisemi wazi kwamba Mungu ndiye kiima, jambo ambalo maandishi ya SBLGNT hayafanyi.
- source_word: εἰς ἀγαθόν
  choice: kuleta mema
  rationale: Hutoa kwa Kiswahili cha asili wazo la matokeo au mwelekeo kuelekea mema bila kulazimisha maana ya manufaa ya muda mfupi.
- source_word: τοῖς κατὰ πρόθεσιν κλητοῖς οὖσιν
  choice: yaani, kwa wale walioitwa kulingana na kusudi
  rationale: “Yaani” linaonyesha kwamba kundi hili linafafanua wale wanaompenda Mungu; muundo unabaki karibu na kirai cha Kigiriki bila kuongeza kimilikishi kisichotajwa wazi.
- source_word: πρόθεσιν
  choice: kusudi
  rationale: Katika muktadha huu neno linaashiria nia au mpango uliokusudiwa; “kusudi” ni fasiri fupi na wazi.
- source_word: κλητοῖς
  choice: walioitwa
  rationale: Huhifadhi istilahi ya Paulo ya kuitwa bila kufafanua kupita kiasi namna au matokeo ya mwito huo.
theological_decisions:
- issue: Kiima kisichotajwa wazi cha συνεργεῖ
  choice: Mambo yote hufanya kazi pamoja kuleta mema
  alternative: Mungu hufanya mambo yote yashirikiane kuleta mema
  rationale: Maandishi yaliyotolewa yanasoma πάντα συνεργεῖ bila θεός kama kiima kilichotajwa wazi. Toleo kuu linafuata ushahidi huo, huku usomaji unaomtaja Mungu wazi ukihifadhiwa katika tanbihi.
- issue: Iwapo kuongeza kimilikishi katika κατὰ πρόθεσιν
  choice: kulingana na kusudi
  alternative: kulingana na kusudi lake
  rationale: Muktadha unaelekeza kwenye kusudi la Mungu, lakini Kigiriki hakina kimilikishi kilichotajwa wazi. Toleo kuu linahifadhi utata huo, na fasiri ya kimuktadha inawekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Hufanya kazi pamoja kuleta mema” ni wazi kwa wasomaji wa kawaida, huku tanbihi zikihifadhi tofauti ya maandishi na uwezekano wa kimilikishi.
