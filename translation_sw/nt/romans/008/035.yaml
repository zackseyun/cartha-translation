id: ROM.8.35
reference: Romans 8:35
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: τίς ἡμᾶς χωρίσει ἀπὸ τῆς ἀγάπης τοῦ Χριστοῦ; θλῖψις ἢ στενοχωρία ἢ διωγμὸς ἢ λιμὸς ἢ γυμνότης ἢ κίνδυνος ἢ μάχαιρα;
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/035.yaml
  text: Who will separate us from the Messiah’s love? Will trouble or distress or persecution or famine or nakedness or danger or sword?[a]
translation:
  language: sw
  text: Ni nani atakayetutenga na upendo wa Masihi? Je, ni taabu, au dhiki, au mnyanyaso, au njaa, au kukosa mavazi, au hatari, au upanga?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “upendo wetu kwa Masihi.” Muundo wa Kigiriki unaweza kueleweka hivyo, ingawa muktadha unapendelea maana ya “upendo wa Masihi kwetu.”
    reason: alternative_reading
lexical_decisions:
- source_word: τίς
  choice: Ni nani
  rationale: Huhifadhi swali la balagha linalomhusu mtendaji; katika Kiswahili muundo huu ni wa kawaida hata kabla ya orodha ya hali na vitisho.
- source_word: χωρίσει
  choice: atakayetutenga
  rationale: Huwasilisha kitenzi cha wakati ujao na wazo la kutenganisha kwa namna ya asili katika Kiswahili.
- source_word: ἀγάπης
  choice: upendo
  rationale: Ni kisawe cha kawaida, wazi, na chenye hadhi cha ἀγάπη.
- source_word: τοῦ Χριστοῦ
  choice: wa Masihi
  rationale: Χριστός ni cheo; “Masihi” huhifadhi maana hiyo. Muundo wa “upendo wa Masihi” pia huhifadhi kwa kiasi fulani uwezekano wa mahusiano tofauti ya kijenitivi.
- source_word: θλῖψις
  choice: taabu
  rationale: Ni neno pana na la kawaida kwa hali ya shida au mateso makali.
- source_word: στενοχωρία
  choice: dhiki
  rationale: Hueleza hali ya kubanwa na kusongwa, huku likitofautishwa kwa kiasi na “taabu.”
- source_word: διωγμός
  choice: mateso
  rationale: Katika muktadha huu humaanisha mateso yanayosababishwa na wanaowafuatilia au kuwaonea waamini; ni usemi wa kawaida wa Kibiblia katika Kiswahili.
- source_word: λιμός
  choice: njaa
  rationale: Huonyesha ukosefu mkubwa wa chakula, si hisia ya kutaka kula tu.
- source_word: γυμνότης
  choice: kukosa mavazi
  rationale: Huwasilisha hapa hali ya kutokuwa na nguo au umaskini uliokithiri kwa lugha ya asili na iliyo wazi kuliko “uchi.”
- source_word: κίνδυνος
  choice: hatari
  rationale: Ni kisawe cha moja kwa moja na cha sasa.
- source_word: μάχαιρα
  choice: upanga
  rationale: Huhifadhi picha halisi ya silaha na tishio la kuuawa kwa nguvu.
theological_decisions:
- issue: Nguvu ya kijenitivi katika τοῦ Χριστοῦ
  choice: upendo wa Masihi, unaoeleweka hasa kuwa upendo wa Masihi kwetu
  alternative: upendo wetu kwa Masihi
  rationale: Muktadha wa Waroma 8:31–39 unapendelea upendo wa Masihi kwa waamini, lakini sarufi inaweza pia kuruhusu maana ya upendo wetu kwake. Maana mbadala imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, kinachoeleweka na chenye hadhi. Orodha ya vitisho imehifadhiwa kwa mfuatano wa Kigiriki, pamoja na urudiaji wa “au” ili kudumisha nguvu ya swali la balagha.
