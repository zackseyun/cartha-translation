  text: τῇ γὰρ ματαιότητι ἡ κτίσις ὑπετάγη, οὐχ ἑκοῦσα ἀλλὰ διὰ τὸν ὑποτάξαντα, ⸀ἐφ’ ἑλπίδι
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/020.yaml
  text: For the creation was subjected to futility[a], not willingly, but because of the one who subjected it[c][b], in hope
translation:
  language: sw
  text: Kwa maana uumbaji uliwekwa chini ya ubatili[a], si kwa hiari yake, bali kwa sababu ya yule aliyeuweka chini[b], katika tumaini[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hali ya kutofikia kusudi,” “hali ya bure,” au “hali ya kufadhaika.”
    reason: lexical_alternative
  - marker: b
    text: Kigiriki hakimtambulishi wazi “yule aliyeuweka chini.”
    reason: alternative_reading
  - marker: c
    text: Au, “kwa tumaini.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ματαιότητι
  choice: ubatili
  rationale: Neno hili linaeleza hali ya uumbaji kushindwa kufikia kusudi lake, si uovu wa kimaadili. “Ubatili” ni fupi na huhifadhi upana wa maana ya hali ya bure, kuvurugika, au kutofikia lengo.
- source_word: κτίσις
  choice: uumbaji
  rationale: Katika muktadha wa Waroma 8:19–22, neno hili linarejelea kwa ujumla vitu vilivyoumbwa, hasa ulimwengu usio wa kibinadamu, wala si kiumbe kimoja.
- source_word: ὑπετάγη
  choice: ulitiishwa chini ya
  rationale: Kauli tendwa ya Kigiriki inaonyesha kwamba uumbaji uliwekwa chini ya hali hiyo na mwingine; tafsiri hii huhifadhi nguvu hiyo ya kauli tendwa.
- source_word: οὐχ ἑκοῦσα
  choice: si kwa hiari yake
  rationale: Kauli hii inaonyesha kuwa uumbaji haukuchagua hali hiyo wenyewe, huku ikitumia Kiswahili cha kawaida na wazi.
- source_word: διὰ τὸν ὑποτάξαντα
  choice: kwa sababu ya yule aliyeutiisha
  rationale: διά pamoja na hali ya kushutumu inaeleweka hapa kwa maana ya sababu. “Yule” huhifadhi rejeleo la mtu bila kumtambulisha zaidi ya maandishi ya Kigiriki.
- source_word: ἐφ’ ἑλπίδι
  choice: katika tumaini
  rationale: Kauli hii fupi huhifadhi mwelekeo wa kutazamia wakati ujao na haielezi kupita kiasi uhusiano wake wa kisarufi na kishazi kilichotangulia.
theological_decisions:
- issue: Utambulisho wa “yule aliyeutiisha” uumbaji
  choice: Mhusika ameachwa bila kutajwa kwa jina katika matini kuu.
  alternative: Anaweza kueleweka kuwa Mungu; wengine huhusisha kutiishwa huku na kuanguka kwa Adamu, na pendekezo lisilo na uwezekano mkubwa ni Shetani.
  rationale: Kigiriki hakimtambulishi wazi mhusika huyo katika mstari huu. Tafsiri inapaswa kuhifadhi tahadhari na mvutano huo badala ya kuamua suala la kiufafanuzi ndani ya matini.
- issue: Uhusiano wa ἐφ’ ἑλπίδι na kishazi kilichotangulia
  choice: “katika tumaini” imewekwa mwishoni kama ilivyo katika Kigiriki.
  alternative: “kwa tumaini” au “akiwa na tumaini,” ambazo zinaweza kufanya uhusiano wa kisarufi kuwa mahususi zaidi.
  rationale: Mpangilio huu huhifadhi kwa kadiri iwezekanavyo ufupi na uwezekano wa kauli hiyo kueleza mazingira au msingi wa kutiishwa bila kumhusisha wazi mwenye tumaini.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Uumbaji” na “ulitiishwa” huhifadhi istilahi na kauli tendwa ya Paulo; maelezo ya chini yanafafanua ubadala bila kuingiza hitimisho la kimadhehebu.
