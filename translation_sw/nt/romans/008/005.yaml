id: ROM.8.5
reference: Romans 8:5
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οἱ γὰρ κατὰ σάρκα ὄντες τὰ τῆς σαρκὸς φρονοῦσιν, οἱ δὲ κατὰ πνεῦμα τὰ τοῦ πνεύματος.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/005.yaml
  text: For those who live according to the flesh set their minds on the things of the flesh, but those who live according to the Spirit, on the things of the Spirit.
translation:
  language: sw
  text: Kwa maana wale wanaoishi kwa kufuata mwili huelekeza mawazo yao kwenye mambo ya mwili, lakini wale wanaoishi kwa kufuata Roho huelekeza mawazo yao kwenye mambo ya Roho.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατὰ σάρκα ὄντες
  choice: wanaoishi kwa kufuata mwili
  rationale: Ingawa kwa karibu ni ‘walio kwa kadiri ya mwili,’ katika muktadha huu hali hiyo inaelezwa kwa Kiswahili cha kawaida kama mwenendo wa maisha unaoongozwa na mwili. ‘Mwili’ linadumisha neno na mvutano wa Paulo bila kulibadili moja kwa moja kuwa ‘asili ya dhambi.’
- source_word: φρονοῦσιν
  choice: huelekeza mawazo yao kwenye
  rationale: Kitenzi hiki kinahusu mwelekeo, nia, na mtazamo wa fikra, si tendo la kufikiri tu; usemi huu unawasilisha maana hiyo kwa Kiswahili cha sasa.
- source_word: κατὰ πνεῦμα
  choice: kwa kufuata Roho
  rationale: ‘Roho’ limeandikwa kwa herufi kubwa kwa sababu muktadha wa Waroma 8 unaelekeza kwa Roho wa Mungu; ‘kwa kufuata’ huonyesha maisha yanayoelekezwa kulingana naye.
- source_word: τὰ τοῦ πνεύματος
  choice: mambo ya Roho
  rationale: Muundo mpana wa Kigiriki unadumishwa bila kuubana kuwa matendo, matamanio, au mafundisho pekee.
theological_decisions:
- issue: Maana ya σάρξ katika tofauti na πνεῦμα
  choice: mwili
  alternative: asili ya dhambi
  rationale: ‘Mwili’ huhifadhi msamiati na upana wa sitiari ya Paulo, pamoja na mvutano wake wa kitheolojia, bila kuingiza tafsiri finyu ya kimadhehebu.
- issue: Utambulisho wa πνεῦμα
  choice: Roho
  alternative: roho
  rationale: Muktadha wa karibu katika Waroma 8 unaunga mkono rejeo kwa Roho wa Mungu, ingawa Kigiriki chenyewe hakitumii tofauti ya herufi kubwa na ndogo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya kawaida lakini yenye heshima. Ulinganifu wa vipashio vya sentensi umehifadhiwa, na kitenzi kimerudiwa katika kishazi cha pili ili sentensi iwe wazi na ya asili kwa msomaji wa kisasa.
