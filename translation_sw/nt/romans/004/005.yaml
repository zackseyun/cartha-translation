  text: τῷ δὲ μὴ ἐργαζομένῳ, πιστεύοντι δὲ ἐπὶ τὸν δικαιοῦντα τὸν ἀσεβῆ, λογίζεται ἡ πίστις αὐτοῦ εἰς δικαιοσύνην,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/005.yaml
  text: But to the one not working[a], but believing in the one who justifies the ungodly[d][c][b], his faith is counted as righteousness.
translation:
  language: sw
  text: Lakini kwa yule asiyefanya kazi, bali anamwamini[a] yule anayemhesabia haki[b] mtu asiye na uchaji wa Mungu, imani yake huhesabiwa[c] kuwa haki.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “anamtumaini.”
    reason: lexical_alternative
  - marker: b
    text: Au, “anayemtangaza kuwa mwenye haki.”
    reason: lexical_alternative
  - marker: c
    text: Au, “huandikwa katika hesabu.”
    reason: lexical_alternative
  - marker: d
    text: Au, “uadilifu”; katika miktadha mingine ya Paulo, neno la Kigiriki linaweza pia kumaanisha “haki” kwa maana ya justice.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῷ ... μὴ ἐργαζομένῳ
  choice: kwa mtu ambaye hafanyi kazi
  rationale: Muundo huu unawakilisha kirai nomino cha Kigiriki na kudumisha tofauti kati ya kutenda kazi na kuamini, bila kudai kwamba Paulo anashutumu kila aina ya kazi.
- source_word: πιστεύοντι δὲ ἐπὶ
  choice: bali anamwamini
  rationale: Kitenzi “anamwamini” ni cha kawaida na cha asili katika Kiswahili, na hapa kinadokeza pia kumtegemea Mungu.
- source_word: τὸν δικαιοῦντα
  choice: yule anayemhesabia haki
  rationale: “Kumhesabia haki” ni usemi unaoeleweka katika mjadala wa Paulo na huhifadhi uzito wa kimahakama wa δικαιόω bila kuamua kimadhehebu namna tendo hilo linavyofanya kazi.
- source_word: τὸν ἀσεβῆ
  choice: mtu asiyemcha Mungu
  rationale: Huu ni usemi wa Kiswahili wa kawaida unaoonyesha kutokuwa na uchaji kwa Mungu, badala ya kuelekeza maana hasa kwenye uovu wa jumla.
- source_word: λογίζεται
  choice: huhesabiwa
  rationale: “Huhesabiwa” huhifadhi picha ya kuweka kitu katika hesabu na inafaa kwa kauli tendwa ya Kigiriki.
- source_word: ἡ πίστις αὐτοῦ
  choice: imani yake
  rationale: “Imani” ni tafsiri ya kawaida ya πίστις, na muktadha wa kitenzi “anamwamini” unaunga mkono maana ya kuamini kuliko uaminifu.
- source_word: εἰς δικαιοσύνην
  choice: kuwa haki
  rationale: Katika muundo λογίζεται ... εἰς, maneno haya yanaonyesha kile ambacho imani inahesabiwa kuwa; “kuwa haki” ni ya asili na wazi katika Kiswahili.
- source_word: δικαιοσύνην
  choice: haki
  rationale: “Haki” hudumisha uhusiano wa kimsamiati na “kumhesabia haki” na inaweza kubeba maana ya hali iliyo sawa pamoja na wazo la haki ya hukumu.
theological_decisions:
- issue: Maana ya δικαιοῦντα katika hoja ya Paulo kuhusu kuhesabiwa haki
  choice: anayemhesabia haki
  alternative: anayemtangaza kuwa mwenye haki
  rationale: Tafsiri kuu inadumisha istilahi muhimu ya Paulo na uzito wake wa kimahakama bila kuamua ikiwa maana yake inapaswa kufafanuliwa tu kama tangazo au kwa mfumo mpana zaidi wa kitheolojia.
- issue: Maana ya πίστις na πιστεύω
  choice: imani / kuamini
  alternative: tumaini / kutumaini
  rationale: Muktadha unatofautisha kutenda kazi na kumwamini Mungu, hivyo “imani” na “kuamini” zinafaa; hata hivyo, wazo la kumtegemea au kumtumaini Mungu ni sehemu halisi ya muundo wa πιστεύω ἐπί na limehifadhiwa katika tanbihi.
- issue: Uhusiano wa λογίζεται na δικαιοσύνην
  choice: imani yake huhesabiwa kuwa haki
  alternative: imani yake huwekwa katika hesabu kuwa haki
  rationale: Kauli hii huhifadhi lugha ya kuhesabu bila kufafanua kwa mfumo maalumu wa kimadhehebu jinsi imani na haki vinavyohusiana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa msomaji wa kawaida. Marudio ya mzizi “haki” katika “anamhesabia haki” na “kuwa haki” yamehifadhiwa ili kuonyesha uhusiano wa maneno muhimu katika hoja ya Paulo.
