id: ROM.4.10
reference: Romans 4:10
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: πῶς οὖν ἐλογίσθη; ἐν περιτομῇ ὄντι ἢ ἐν ἀκροβυστίᾳ; οὐκ ἐν περιτομῇ ἀλλ’ ἐν ἀκροβυστίᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/010.yaml
  text: How then was it counted? While he was circumcised[a], or uncircumcised? Not while circumcised, but while uncircumcised.
translation:
  language: sw
  text: Basi, ilihesabiwaje? Je, wakati alipokuwa ametahiriwa, au wakati alipokuwa hajatahiriwa? Si alipokuwa ametahiriwa, bali alipokuwa hajatahiriwa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πῶς οὖν
  choice: Basi, ilihesabiwaje kwake?
  rationale: “Basi” linaonyesha mwendelezo wa hoja na hitimisho la kimantiki; “ilihesabiwaje kwake” ni Kiswahili cha kawaida kinachodumisha wazo la λογίζομαι katika muktadha wa Waroma 4.
- source_word: ἐν περιτομῇ ὄντι
  choice: alipokuwa ametahiriwa
  rationale: Ingawa Kigiriki kinatumia nomino “tohara” pamoja na kitenzi cha hali, Kiswahili cha asili huieleza hali hiyo kwa “alipokuwa ametahiriwa,” huku kikidumisha maana ya wakati au hali.
- source_word: ἐν ἀκροβυστίᾳ
  choice: alipokuwa hajatahiriwa
  rationale: Katika muktadha huu neno linamaanisha hali ya kutotahiriwa. Muundo huu unaweka wazi ulinganifu na “alipokuwa ametahiriwa.”
- source_word: οὐκ ... ἀλλ’
  choice: Si ... bali ...
  rationale: Huu ni muundo wa kawaida wa Kiswahili unaodumisha mkazo wa ukanushaji na utofautishaji wa Kigiriki.
theological_decisions:
- issue: Kitu kilichohesabiwa kwa Abrahamu hakitajwi wazi katika mstari huu.
  choice: Kiwakilishi kisicho na mtajo maalumu katika “ilihesabiwaje kwake”
  alternative: “Haki ilihesabiwaje kwake?”
  rationale: Kigiriki hakirudii nomino inayohusika; kutaja “haki” wazi kungeondoa utegemezi wa mstari huu kwa muktadha uliotangulia na kuongeza neno lisilopo hapa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Maswali ya balagha na ulinganifu wa “ametahiriwa/hajatahiriwa” yamedumishwa kwa uwazi.
