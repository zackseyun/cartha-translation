  yaml_path: translation/nt/romans/004/015.yaml
  text: For the law produces wrath[a], but where there is no law[b], neither is there transgression.
translation:
  language: sw
  text: Kwa maana sheria huleta ghadhabu,[a] lakini pasipo sheria, wala hakuna uvunjaji wa sheria.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Sheria huleta ghadhabu.”
    reason: Huonyesha uwezekano wa kuelewa νόμος kwa maana mahsusi ya Sheria ya Musa.
  - marker: b
    text: Au, “ukiukaji.”
    reason: Neno la Kigiriki παράβασις linaweza kutafsiriwa “ukiukaji”; hasa hudokeza kukiuka mpaka au amri iliyowekwa.
lexical_decisions:
- source_word: νόμος
  choice: sheria
  rationale: Neno “sheria” linahifadhi upana wa istilahi ya Paulo bila kuifungamanisha moja kwa moja na Sheria ya Musa pekee; muktadha bado unaweza kuhusisha Sheria hiyo.
- source_word: ὀργή
  choice: ghadhabu
  rationale: “Ghadhabu” lina uzito wa kimahakama na kitheolojia unaofaa katika hoja ya Paulo kuliko “hasira” ya kawaida.
- source_word: κατεργάζεται
  choice: huleta
  rationale: “Huleta” ni Kiswahili cha kawaida na cha wazi kinachoonyesha kwamba sheria husababisha matokeo hayo, bila kudai kuwa ghadhabu yenyewe ni sehemu ya sheria.
- source_word: οὗ δὲ
  choice: lakini pasipo
  rationale: Kauli hii inaonyesha tofauti ya upole kati ya matokeo ya kuwapo kwa sheria na hali ya kutokuwapo kwake; “pasipo” ni ya asili zaidi hapa kuliko tafsiri ya neno kwa neno “mahali ambapo hakuna.”
- source_word: παράβασις
  choice: uvunjaji wa sheria
  rationale: Kirai hiki kinaonyesha kuvuka mpaka au kukiuka amri iliyowekwa, maana mahsusi ya παράβασις katika muktadha huu.
theological_decisions:
- issue: Upeo wa νόμος katika hoja ya Paulo
  choice: sheria
  alternative: Sheria
  rationale: Herufi ndogo na kutotaja “Sheria ya Musa” kunahifadhi kanuni pana ya hoja bila kuondoa uwezekano kwamba Sheria ya Musa imo katika mandharinyuma.
- issue: Mhusika wa ὀργή
  choice: ghadhabu
  alternative: ghadhabu ya Mungu
  rationale: Nakala ya Kigiriki haitaji wazi kwamba ni ghadhabu ya Mungu, ingawa muktadha wa Waroma unaweza kuielekeza hivyo; tafsiri haiongezi mhusika na hivyo inahifadhi hali hiyo ya kutotajwa wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umefanywa wa asili kwa msomaji wa kawaida huku ulinganifu wa vifungu viwili na utata halisi kuhusu upeo wa “sheria” vikihifadhiwa.
