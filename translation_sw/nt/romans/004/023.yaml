lexical_decisions:
- source_word: ἐγράφη
  choice: hayakuandikwa
  rationale: Kauli tendwa inadumisha maana ya jambo lililoandikwa katika Maandiko; wingi unapatana kisarufi na neno lililowekwa wazi, “maneno,” kwa Kiswahili cha kawaida.
- source_word: δὲ
  choice: Lakini
  rationale: Kiunganishi hiki kinaendeleza hoja kwa kuonyesha tofauti kati ya Abrahamu peke yake na wale wengine wanaohusishwa katika mstari unaofuata.
- source_word: δι’ αὐτὸν μόνον
  choice: kwa ajili yake peke yake
  rationale: Huhifadhi maana ya kwamba yaliyoandikwa hayakumhusu Abrahamu tu, bila kuongeza ufafanuzi wa kiteolojia.
- source_word: ὅτι ἐλογίσθη αὐτῷ
  choice: maneno “ilihesabiwa kwake”
  rationale: Muundo wa kunukuu unatoa Kiswahili cha asili na unaonyesha wazi kwamba haya ndiyo yaliyomo katika yaliyoandikwa, huku ukidumisha kauli tendwa na sitiari ya kuhesabu.
theological_decisions:
- issue: Maana ya λογίζομαι katika hoja ya Paulo kuhusu kuhesabiwa haki
  choice: ilihesabiwa kwake
  alternative: iliwekwa katika hesabu yake
  rationale: “Ilihesabiwa kwake” inadumisha picha ya kihasibu na hali ya kauli tendwa bila kubainisha zaidi ni kwa namna gani kuhesabiwa huko kunafanya kazi kiteolojia.
- issue: Kitu kisichotajwa wazi ambacho kilihesabiwa
  choice: Kudumisha kiwakilishi kisicho na jina katika “ilihesabiwa kwake”
  alternative: kuongeza “haki” kama kiima
  rationale: Kigiriki hakitaji tena nomino katika mstari huu; kutoiingiza “haki” moja kwa moja kunahifadhi utegemezi wa muktadha na kutoongeza maneno yasiyopo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Neno “maneno” limewekwa wazi ili sentensi ya kunukuu yaliyomo katika maandishi isikike kawaida kwa Kiswahili. Koma ya mwisho inadumisha mwendelezo wa sentensi hadi mstari unaofuata.
