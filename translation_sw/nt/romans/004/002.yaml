base_translation:
  language: en
  yaml_path: translation/nt/romans/004/002.yaml
  text: For if Abraham was justified by works[b][a], he has a boast—but not before God.
translation:
  language: sw
  text: Kwa maana ikiwa Abrahamu alihesabiwa haki[a] kwa matendo, ana sababu ya kujisifu[b]—lakini si mbele za Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “alitangazwa kuwa mwenye haki.”'
    reason: lexical_alternative
  - marker: b
    text: 'Au: “ana jambo la kujivunia.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ γὰρ
  choice: Kwa maana ikiwa
  rationale: “Kwa maana” hudumisha uhusiano wa hoja unaoonyeshwa na γάρ, na “ikiwa” huhifadhi sharti la εἰ bila kulifafanua kuwa jambo halisi au lisilowezekana.
- source_word: Ἀβραὰμ
  choice: Abrahamu
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili cha Biblia.
- source_word: ἐξ ἔργων
  choice: kwa matendo
  rationale: “Kwa matendo” ni usemi mfupi na wa kawaida unaoonyesha matendo kuwa msingi au njia inayodaiwa ya kuhesabiwa haki.
- source_word: ἐδικαιώθη
  choice: alihesabiwa haki
  rationale: Usemi huu wa kawaida katika Kiswahili huhifadhi maana ya kimahakama ya kitenzi cha kutendwa; tafsiri mbadala ya ‘alitangazwa kuwa mwenye haki’ imewekwa katika tanbihi.
- source_word: ἔχει καύχημα
  choice: ana sababu ya kujisifu
  rationale: Hutoa kwa Kiswahili cha kawaida maana ya kuwa na msingi wa kujisifu, huku tanbihi ikihifadhi uwezekano wa kutafsiri kwa namna iliyo karibu zaidi na nomino ya Kigiriki.
- source_word: ἀλλ’ οὐ πρὸς θεόν
  choice: lakini si mbele za Mungu
  rationale: “Mbele za Mungu” ni usemi wa asili unaohifadhi tofauti kati ya kujisifu na tathmini au msimamo wa mtu mbele ya Mungu.
theological_decisions:
- issue: Iwapo sharti linapaswa kuonyeshwa kuwa hali halisi au dhana tu
  choice: ikiwa Abrahamu alihesabiwa haki kwa matendo
  alternative: ikiwa kwa kweli Abrahamu alihesabiwa haki kwa matendo; kama Abrahamu angalihesabiwa haki kwa matendo
  rationale: Muundo wa sharti wa Kigiriki umetafsiriwa moja kwa moja bila kuongeza maneno yanayoamua mapema kama dai hilo ni la kweli au ni kinyume cha uhalisi. Hivyo mvutano wa hoja ya Paulo unabaki wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imehifadhi ufupi na mtiririko wa hoja ya Paulo bila kuingiza ufafanuzi wa kimadhehebu.
