base_translation:
  language: en
  yaml_path: translation/nt/romans/004/003.yaml
  text: For what does the Scripture say? Abraham believed God[b][a], and it was counted to him as righteousness.
translation:
  language: sw
  text: Kwa maana Maandiko yanasema nini? “Abrahamu alimwamini Mungu, na imani hiyo ikahesabiwa kwake[a] kuwa haki.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ilihesabiwa kwake” au “iliwekwa katika hesabu yake.”
    reason: lexical_alternative
  - marker: b
    text: Neno la Kigiriki linalotafsiriwa “haki” linaweza pia kumaanisha “uadilifu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γραφή
  choice: Maandiko
  rationale: Katika matumizi ya Paulo, neno hili humaanisha maandishi matakatifu yenye mamlaka. “Maandiko” ni usemi wa kawaida na wenye heshima katika Kiswahili cha Biblia.
- source_word: Ἐπίστευσεν
  choice: alimwamini
  rationale: Huwasilisha moja kwa moja tendo la Abrahamu la kukubali kuwa Mungu alisema kweli, bila kuongeza ufafanuzi wa kimadhehebu.
- source_word: τῷ θεῷ
  choice: Mungu
  rationale: Dativi baada ya πιστεύω hapa inaonyesha kwamba Abrahamu alimwamini Mungu, yaani alikubali neno lake kuwa la kweli; si kauli ya jumla tu kwamba aliamini kuwapo kwa Mungu.
- source_word: ἐλογίσθη
  choice: likahesabiwa kwake
  rationale: “Kuhesabiwa” huhifadhi hali ya kutendwa ya kitenzi na maana ya kuweka jambo katika hesabu ya mtu, kwa lugha ya kawaida na yenye uzito.
- source_word: εἰς δικαιοσύνην
  choice: kuwa haki
  rationale: Kirai hiki kwa kawaida humaanisha kwamba jambo hilo lilihesabiwa kuwa haki. “Haki” huhifadhi upana wa δικαιοσύνη katika muktadha wa Paulo.
theological_decisions:
- issue: Maana ya δικαιοσύνη katika muktadha wa Paulo kuhusu kuhesabiwa haki
  choice: haki
  alternative: uadilifu
  rationale: “Haki” ndilo neno pana na lililozoeleka zaidi katika Kiswahili cha Biblia kwa δικαιοσύνη; linaweza kubeba vipengele vya hali iliyo sawa mbele za Mungu na mwenendo ulionyooka bila kulazimisha tafsiri moja tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mpangilio wa swali umefanywa wa kawaida kwa Kiswahili, huku nukuu na hali ya kutendwa ya kitenzi cha Kigiriki vikihifadhiwa.
