  text: καθάπερ καὶ Δαυὶδ λέγει τὸν μακαρισμὸν τοῦ ἀνθρώπου ᾧ ὁ θεὸς λογίζεται δικαιοσύνην χωρὶς ἔργων·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/006.yaml
  text: Just as David also speaks of the blessedness of the man to whom God credits righteousness apart from works:[a][b][c]
translation:
  language: sw
  text: Kama vile Daudi pia anavyosema kuhusu heri ya mtu ambaye Mungu humhesabia haki pasipo matendo:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Mungu humhesabu kuwa mwenye haki.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καθάπερ καὶ
  choice: Kama vile ... pia
  rationale: Muundo huu unaonyesha ulinganisho na hoja iliyotangulia, huku “pia” ikimtaja Daudi kama shahidi wa ziada.
- source_word: λέγει τὸν μακαρισμόν
  choice: anavyosema kuhusu heri
  rationale: “Heri” ni Kiswahili cha kawaida na chenye hadhi kinachoeleza hali au tangazo la kubarikiwa, na pia kinaandaa nukuu ya Zaburi inayofuata.
- source_word: τοῦ ἀνθρώπου
  choice: ya mtu
  rationale: “Mtu” huhifadhi umoja wa Kigiriki na kwa kawaida katika Kiswahili inaweza kumwakilisha mwanadamu yeyote bila kuzuia maana kwa wanaume pekee.
- source_word: λογίζεται δικαιοσύνην
  choice: humhesabia haki
  rationale: “Humhesabia” huhifadhi taswira ya kuweka katika hesabu; “haki” ndilo neno la kawaida la Kiswahili kwa δικαιοσύνη katika muktadha huu.
- source_word: χωρὶς ἔργων
  choice: pasipo matendo
  rationale: Kauli hii huhifadhi tofauti anayoweka Paulo kati ya kuhesabiwa haki na matendo, bila kuongeza maelezo kuhusu aina ya matendo.
theological_decisions:
- issue: Maana ya λογίζεται δικαιοσύνην
  choice: humhesabia haki
  alternative: humwekea katika hesabu kuwa ana haki
  rationale: Chaguo kuu ni fupi, la asili, na huhifadhi lugha ya kihesabu bila kuingiza istilahi nzito ya kimadhehebu.
- issue: Upeo wa ἀνθρώπου
  choice: mtu
  alternative: mwanadamu
  rationale: “Mtu” huhifadhi umoja na maana wakilishi ya neno la Kigiriki; katika Kiswahili si lazima lieleweke kuwa linamhusu mwanamume pekee.
- issue: δικαιοσύνη kama haki au uadilifu
  choice: haki
  alternative: uadilifu
  rationale: “Haki” hufaa zaidi kwa hoja ya Paulo kuhusu Mungu kumhesabia mtu δικαιοσύνη, huku ikiacha wazi mvutano kati ya hadhi ya kuwa sawa mbele za Mungu na sifa ya uadilifu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imehifadhi muundo wa ulinganisho wa Kigiriki, lakini imetumia “heri” na “humhesabia haki” kwa ufasaha wa kawaida wa Kiswahili.
