base_translation:
  language: en
  yaml_path: translation/nt/romans/004/014.yaml
  text: For if those who are of the law are heirs[c][b][a], faith has been emptied and the promise has been nullified.
translation:
  language: sw
  text: Kwa maana ikiwa wale walio wa sheria ndio warithi, imani imefanywa kuwa bure[a], na ahadi imebatilishwa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “imani imeondolewa maana yake.”
    reason: lexical_alternative
  - marker: b
    text: Au, “ahadi imefanywa isiwe na nguvu” au “imefanywa isiwe na matokeo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ἐκ νόμου
  choice: walio wa sheria
  rationale: Inahifadhi usemi mfupi wa Paulo unaowatambulisha watu kwa uhusiano wao na sheria, bila kuufafanua kupita kiasi kuwa ni wale wanaoishika sheria.
- source_word: κληρονόμοι
  choice: warithi
  rationale: Ni neno la kawaida na lenye heshima katika muktadha wa urithi na ahadi.
- source_word: κεκένωται
  choice: imefanywa kuwa bure
  rationale: Inaonyesha hali iliyotokea na inayoendelea, huku ikihifadhi wazo la imani kuondolewa maana au nguvu yake.
- source_word: πίστις
  choice: imani
  rationale: Katika hoja ya Waroma 4, neno hili linatofautishwa na sheria kama msingi wa kupokea urithi; “imani” ni tafsiri ya kawaida na iliyo wazi.
- source_word: κατήργηται
  choice: imebatilishwa
  rationale: Inaeleza kwamba ahadi imeondolewa nguvu au ufanisi wake bila kudokeza kwamba imeangamizwa kabisa.
- source_word: ἐπαγγελία
  choice: ahadi
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya ahadi mahususi inayozungumziwa katika muktadha.
theological_decisions:
- issue: Maana ya πίστις inapowekwa kinyume na νόμος
  choice: imani
  alternative: uaminifu; kutumaini
  rationale: “Imani” inadumisha mstari wa hoja ya Paulo kuhusu urithi unaopatikana kwa imani badala ya kwa sheria, bila kuingiza ufafanuzi wa kimadhehebu.
- issue: Utambulisho wa οἱ ἐκ νόμου
  choice: walio wa sheria
  alternative: wanaoitegemea sheria; wanaoishi kwa sheria
  rationale: Tafsiri hii inadumisha utata halisi wa usemi wa Kigiriki kuhusu watu wanaofafanuliwa kwa uhusiano wao na sheria, badala ya kuamua kwa niaba ya msomaji aina kamili ya uhusiano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “walio wa sheria” umeachwa kwa makusudi ili kuhifadhi ufupi na utata wa usemi wa Paulo; “ndio warithi” huwasilisha msisitizo wa kisharti kwa Kiswahili cha kawaida.
