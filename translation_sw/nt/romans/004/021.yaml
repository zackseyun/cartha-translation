lexical_decisions:
- source_word: πληροφορηθεὶς
  choice: akiwa amesadiki kabisa
  rationale: Kirai hiki kinaonyesha kuwa Abrahamu alikuwa na uhakika kamili. “Amesadiki kabisa” ni Kiswahili cha sasa, cha kawaida, na kinahifadhi nguvu ya neno la Kigiriki.
- source_word: ὅτι
  choice: kwamba
  rationale: Linaanzisha jambo ambalo Abrahamu alilisadiki.
- source_word: ὃ
  choice: kile
  rationale: Kiwakilishi hiki kinarejelea jambo lililoahidiwa na kinaungana kwa kawaida na “alichoahidi … kukifanya.”
- source_word: ἐπήγγελται
  choice: alichoahidi
  rationale: Wakati timilifu wa Kigiriki unaonyesha ahadi iliyotolewa na ambayo bado ina nguvu. Muundo wa Kiswahili unaweka tendo hilo kabla ya uwezo wa kulitimiza bila kulazimisha tofauti ya wakati isiyo ya kawaida.
- source_word: δυνατός ἐστιν
  choice: anaweza
  rationale: Huhifadhi wakati wa sasa wa Kigiriki, unaosisitiza uwezo wa kudumu wa Mungu, na ni wa kawaida katika Kiswahili.
- source_word: καὶ
  choice: pia
  rationale: Linaonyesha kwamba yule aliyeahidi pia ana uwezo wa kutekeleza ahadi hiyo.
- source_word: ποιῆσαι
  choice: kukifanya
  rationale: Huhifadhi maana pana ya ποιέω huku kiambishi “-ki-” kikirejelea kwa wazi “kile” kilichoahidiwa.
theological_decisions:
- issue: Mtendaji asiye tajwa wazi wa kuahidi na kuwa na uwezo
  choice: Kuacha mtendaji bila kutajwa kwa jina, kama ilivyo katika Kigiriki, kwa kutumia “alichoahidi” na “anaweza.”
  alternative: 'Kutaja wazi: “kwamba kile Mungu alichoahidi, anaweza pia kukifanya.”'
  rationale: Muktadha unamtambulisha mtendaji kuwa Mungu, lakini mstari wenyewe hautaji jina lake. Muundo huu unahifadhi hali hiyo huku ukiendelea kueleweka katika muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa sentensi umehifadhi mshiriki wa Kigiriki kama kishazi tegemezi na umeacha jina la Mungu lisitajwe wazi kama katika chanzo.
