- issue: Maana ya τῷ ἐκ πίστεως Ἀβραάμ
  choice: wale wenye imani ya Abrahamu
  alternative: wale wanaoshiriki imani ya Abrahamu
  rationale: Chaguo kuu haliongezi dhana ya ‘kushiriki’ ambayo haijasemwa wazi, na linaacha wazi uhusiano unaoonyeshwa na ‘imani ya Abrahamu’.
- issue: Umoja wa τῷ katika makundi mawili
  choice: wale
  alternative: yule
  rationale: Umoja wa Kigiriki umetumiwa kwa maana ya pamoja; Kiswahili cha wingi huwasilisha rejeo la kundi bila kubadili upeo wa ahadi.
translation_notes:
