lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Kwa sababu hiyo
  rationale: Inaendeleza hoja ya Paulo kwa namna ya kawaida katika Kiswahili.
- source_word: ἐκ πίστεως
  choice: hupatikana kwa imani
  rationale: Kitenzi hakitajwi wazi katika Kigiriki; ‘hupatikana’ kinakamilisha sentensi kwa Kiswahili huku ‘kwa imani’ kikihifadhi msingi au njia inayokusudiwa.
- source_word: ἵνα κατὰ χάριν
  choice: ili iwe kwa neema
  rationale: Inahifadhi kishazi cha kusudi na uhusiano wa moja kwa moja kati ya imani na neema bila kuongeza ufafanuzi wa kimadhehebu.
- source_word: βεβαίαν τὴν ἐπαγγελίαν
  choice: ahadi hiyo iwe ya hakika
  rationale: ‘Ya hakika’ huonyesha kwamba ahadi ni thabiti na yenye kutegemewa.
- source_word: παντὶ τῷ σπέρματι
  choice: kwa wazao wote
  rationale: σπέρμα limetumiwa kwa maana ya pamoja kuhusu wazao wa Abrahamu; ‘wazao’ ni wazi na la kawaida.
- source_word: οὐ τῷ ἐκ τοῦ νόμου μόνον
  choice: si kwa wale wa sheria tu
  rationale: Umoja wa Kigiriki una maana ya kundi; wingi wa Kiswahili unaifanya maana hiyo ieleweke kwa kawaida.
- source_word: τῷ ἐκ πίστεως Ἀβραάμ
  choice: kwa wale wenye imani ya Abrahamu
  rationale: Inahifadhi muundo uliobanwa wa Kigiriki na sintofahamu ya ‘imani ya Abrahamu’ bila kuongeza wazi kwamba wanaishiriki au kuiiga.
- source_word: πατὴρ πάντων ἡμῶν
  choice: baba yetu sote
  rationale: Ni tafsiri ya karibu, ya asili, na yenye hadhi ya usemi wa kifamilia wa Paulo.
