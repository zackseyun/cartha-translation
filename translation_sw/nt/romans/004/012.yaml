id: ROM.4.12
reference: Romans 4:12
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ πατέρα περιτομῆς τοῖς οὐκ ἐκ περιτομῆς μόνον ἀλλὰ καὶ τοῖς στοιχοῦσιν τοῖς ἴχνεσιν τῆς ⸂ἐν ἀκροβυστίᾳ πίστεως⸃ τοῦ πατρὸς ἡμῶν Ἀβραάμ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/012.yaml
  text: and the father of circumcision to those who are not merely circumcised[d][c][b][a], but who also walk in the footsteps of the faith that our father Abraham had while uncircumcised.
translation:
  language: sw
  text: tena awe baba wa wale waliotahiriwa[a]—yaani, wale ambao si kwamba wametahiriwa tu, bali pia wanafuata nyayo za imani ambayo baba yetu Abrahamu alikuwa nayo alipokuwa hajatahiriwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “baba wa tohara.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πατέρα περιτομῆς
  choice: baba wa wale waliotahiriwa
  rationale: Ingawa muundo wa Kigiriki ni kihalisi ‘baba wa tohara,’ muktadha unaonyesha kuwa Abrahamu ni baba wa watu waliotahiriwa, si baba wa tendo la tohara. Kiswahili hiki ni cha kawaida na wazi.
- source_word: οὐκ ἐκ περιτομῆς μόνον
  choice: ambao si kwamba wametahiriwa tu
  rationale: Huu ni uwasilishaji wa kawaida wa Kiswahili unaohifadhi tofauti kati ya kuwa na tohara ya nje pekee na kuambatanisha tohara hiyo na imani kama ya Abrahamu.
- source_word: στοιχοῦσιν τοῖς ἴχνεσιν
  choice: wanafuata nyayo
  rationale: Kitenzi na nomino kwa pamoja vinaonyesha kwenda kwa kufuata alama za hatua za mwingine. ‘Kufuata nyayo’ ni nahau ya kawaida ya Kiswahili na inahifadhi taswira ya Kigiriki.
- source_word: πίστεως
  choice: imani
  rationale: Katika hoja hii neno linahusu kumwamini Mungu kwa Abrahamu, hivyo ‘imani’ linafaa kuliko ‘uaminifu.’
- source_word: ἐν ἀκροβυστίᾳ
  choice: alipokuwa hajatahiriwa
  rationale: Muundo huu wa wakati ni wa kawaida katika Kiswahili na unaeleza hali ya Abrahamu alipokuwa na imani kabla ya kutahiriwa.
- source_word: τοῦ πατρὸς ἡμῶν Ἀβραάμ
  choice: baba yetu Abrahamu
  rationale: Uhusiano wa kijamii na wa hoja unaohusika katika ‘baba yetu’ umehifadhiwa bila kufafanuliwa kupita kiasi.
theological_decisions:
- issue: Je, Abrahamu anaitwa baba wa wote waliotahiriwa bila sharti, au wa wale ambao tohara yao inaambatana na imani kama yake?
  choice: Abrahamu ni baba wa wale waliotahiriwa ambao pia wanafuata nyayo za imani yake.
  alternative: Abrahamu ni baba wa kila mtu aliyetahiriwa bila sharti.
  rationale: 'Muundo ‘si kwamba ... tu, bali pia’ unaweka sifa kwa kundi la waliotahiriwa: tohara pekee haitoshi katika dai hili la ubaba.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. ‘Kufuata nyayo’ huhifadhi sitiari ya chanzo bila kuwa ngumu. Alama ya dashibodi inasaidia kuonyesha kuwa maneno yanayofuata yanafafanua ni watu gani waliotahiriwa wanaokusudiwa.
