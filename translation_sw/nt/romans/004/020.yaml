  text: εἰς δὲ τὴν ἐπαγγελίαν τοῦ θεοῦ οὐ διεκρίθη τῇ ἀπιστίᾳ ἀλλὰ ἐνεδυναμώθη τῇ πίστει, δοὺς δόξαν τῷ θεῷ
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/020.yaml
  text: Yet regarding the promise of God[a], he did not waver in unbelief, but was strengthened in faith[b], giving glory to God.
translation:
  language: sw
  text: Lakini kuhusu ahadi ya Mungu, hakusitasita kwa kutokuamini,[a] bali alitiwa nguvu katika imani,[b] huku akimpa Mungu utukufu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hakutilia shaka kwa sababu ya kutokuamini.”
    reason: lexical_alternative
  - marker: b
    text: Au, “alitiwa nguvu kwa njia ya imani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς δὲ τὴν ἐπαγγελίαν τοῦ θεοῦ
  choice: Lakini kuhusu ahadi ya Mungu
  rationale: εἰς pamoja na nomino katika hali ya accusative ina maana ya rejea, ‘kuhusu’; δέ inaonyesha utofautishaji wa kiasi na mtiririko wa hoja.
- source_word: οὐ διεκρίθη
  choice: hakusitasita
  rationale: Katika muktadha huu διακρίνω inaonyesha kuyumba au kusitasita kwa ndani, si uchunguzi wa kiakili tu.
- source_word: τῇ ἀπιστίᾳ
  choice: kwa kutokuamini
  rationale: Dative inaweza kueleza sababu au namna. Kiswahili hiki ni cha kawaida na kinaacha uhusiano wake na kusitasita wazi bila kuufanya kuwa wa kiakili pekee.
- source_word: ἐνεδυναμώθη
  choice: alitiwa nguvu
  rationale: Huhifadhi hali ya kutendwa ya kitenzi, bila kutaja wazi mtendaji ambaye Kigiriki hakumtaji hapa.
- source_word: τῇ πίστει
  choice: katika imani
  rationale: Huhifadhi uwezekano wa dative kueleza eneo au hali ya kutiwa nguvu; maana ya chombo, ‘kwa njia ya imani,’ imewekwa katika tanbihi.
- source_word: δοὺς δόξαν τῷ θεῷ
  choice: huku akimpa Mungu utukufu
  rationale: Muundo wa ‘huku’ unaonyesha tendo linaloandamana na kutiwa nguvu na kuhifadhi mtiririko wa participle ya Kigiriki.
theological_decisions:
- issue: Ikiwa mwitikio wa Abrahamu uelezwe kuwa shaka ya kiakili tu au kusitasita/kuyumba kwa upana zaidi
  choice: hakusitasita kwa kutokuamini
  alternative: hakutilia shaka kwa sababu ya kutokuamini
  rationale: ‘Hakusitasita’ huakisi kwa upana zaidi διακρίνω katika muktadha na huhifadhi utofauti na kutiwa nguvu katika imani bila kupunguza jambo lote kuwa shaka ya kiakili.
- issue: Jinsi ya kuelewa dative katika τῇ πίστει
  choice: katika imani
  alternative: kwa njia ya imani
  rationale: ‘Katika imani’ huhifadhi usambamba wa dhana na kutokuamini na haiamui kimya kimya kwamba imani ndiyo chombo; uwezekano huo umetajwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Hakusitasita’ ni cha kawaida na kinaeleweka, huku ‘alitiwa nguvu’ ikihifadhi hali ya kutendwa. Alama zote za tanbihi zimewekwa katika matini kuu.
