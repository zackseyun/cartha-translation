  text: Μακάριοι ὧν ἀφέθησαν αἱ ἀνομίαι καὶ ὧν ἐπεκαλύφθησαν αἱ ἁμαρτίαι,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/007.yaml
  text: Blessed are those whose lawless deeds have been forgiven[a], and whose sins have been covered.
translation:
  language: sw
  text: 'Heri wale ambao matendo yao ya kukiuka sheria yamesamehewa,[a]

    na ambao dhambi zao zimefunikwa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “maovu yao yamesamehewa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Μακάριοι
  choice: Heri
  rationale: ‘Heri’ ni usemi wa kawaida na wenye hadhi katika Kiswahili kwa tamko la hali ya kubarikiwa na Mungu; haupunguzi maana kuwa hisia ya furaha tu.
- source_word: ἀφέθησαν
  choice: yamesamehewa
  rationale: Kauli tendwa inaonyesha kwamba matendo hayo yameondolewa kwa msamaha; umbo hili pia linaonyesha tendo lililotimizwa lenye matokeo yanayoendelea.
- source_word: ἀνομίαι
  choice: matendo ya kuasi sheria
  rationale: Huhifadhi wazo la kuvunja au kuasi sheria badala ya kutumia neno la jumla tu kama ‘maovu,’ huku likieleweka kwa wasomaji wa sasa.
- source_word: ἐπεκαλύφθησαν
  choice: zimefunikwa
  rationale: Huhifadhi sitiari ya kufunika iliyo katika nukuu ya Zaburi, bila kuibadili moja kwa moja kuwa maelezo ya kitheolojia.
- source_word: ἁμαρτίαι
  choice: dhambi
  rationale: Ni tafsiri ya kawaida, wazi, na ya moja kwa moja ya neno hili katika muktadha huu.
theological_decisions:
- issue: Uhusiano kati ya ἀνομίαι na ἁμαρτίαι
  choice: Kutofautisha ‘matendo ya kuasi sheria’ na ‘dhambi’
  alternative: Kutafsiri maneno yote mawili kwa neno moja la jumla, ‘dhambi’
  rationale: Paulo anahifadhi ulinganifu wa kishairi wa Zaburi kwa kutumia maneno mawili yanayohusiana lakini yasiyofanana kabisa. Kuyatofautisha huhifadhi matini bila kulazimisha tofauti kali ya kimafundisho.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio wa mistari huhifadhi ulinganifu wa kishairi; ‘Heri’ linaendelezwa kwa vipashio vyote viwili.
