id: ROM.4.9
reference: Romans 4:9
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ὁ μακαρισμὸς οὖν οὗτος ἐπὶ τὴν περιτομὴν ἢ καὶ ἐπὶ τὴν ἀκροβυστίαν; λέγομεν ⸀γάρ· Ἐλογίσθη τῷ Ἀβραὰμ ἡ πίστις εἰς δικαιοσύνην.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/009.yaml
  text: Is this blessing[a], then, for the circumcised, or also for the uncircumcised? For we say, “Faith was counted to Abraham as righteousness.”
translation:
  language: sw
  text: Je, basi, baraka hii ni kwa waliotahiriwa tu, au pia kwa wasiotahiriwa? Kwa maana tunasema, “Imani ya Abrahamu ilihesabiwa kuwa haki.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “uadilifu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μακαρισμός
  choice: baraka
  rationale: Katika muktadha huu neno hilo linarejelea hali ya kubarikiwa iliyotangazwa katika Waroma 4:6–8; “baraka” ni ya kawaida, wazi, na yenye hadhi katika Kiswahili.
- source_word: περιτομή
  choice: waliotahiriwa
  rationale: Ingawa nomino ya Kigiriki kwa msingi ni “tohara,” hapa inawakilisha kwa njia ya metonimia watu wenye tohara; tafsiri hii inaweka rejeo hilo wazi.
- source_word: ἀκροβυστία
  choice: wasiotahiriwa
  rationale: Kama ilivyo kwa περιτομή, nomino hii hapa inawakilisha kundi la watu; “wasiotahiriwa” huwasilisha ulinganisho wa Paulo kwa Kiswahili cha asili.
- source_word: πίστις
  choice: imani
  rationale: “Imani” ndiyo tafsiri ya kawaida na inayofaa katika nukuu hii kuhusu Abrahamu, bila kuipanua kuwa uaminifu au kuifafanua kidoktrini.
- source_word: ἐλογίσθη
  choice: ilihesabiwa
  rationale: Kitenzi hiki kinahifadhi dhana ya kuhesabu au kuweka katika hesabu iliyo katika λογίζομαι na kinaeleweka kwa wasomaji wa kawaida.
- source_word: δικαιοσύνη
  choice: haki
  rationale: Katika hoja hii ya Paulo, “haki” huwasilisha δικαιοσύνη kwa ufupi na kwa lugha ya kawaida; maana mbadala inayohusiana na uadilifu imehifadhiwa katika tanbihi.
- source_word: εἰς δικαιοσύνην
  choice: kuwa haki
  rationale: Muundo huu wa Kiswahili huwasilisha kwa kawaida wazo kwamba imani ya Abrahamu ilihesabiwa katika uhusiano na haki, bila kuongeza mfumo wa kiteolojia ambao mstari wenyewe hauuelezi.
theological_decisions:
- issue: Kauli ya Paulo kuhusu imani ya Abrahamu na haki
  choice: Imani ya Abrahamu ilihesabiwa kuwa haki.
  alternative: Imani ya Abrahamu ilihesabiwa kwa ajili ya haki.
  rationale: Chaguo hili linadumisha mkazo wa nukuu na mvutano wake wa kiteolojia bila kueleza zaidi jinsi imani na haki vinavyohusiana au kuingiza mfumo fulani wa kimadhehebu.
- issue: Walengwa wa baraka
  choice: kwa waliotahiriwa tu, au pia kwa wasiotahiriwa
  alternative: juu ya tohara, au pia juu ya kutotahiriwa
  rationale: Nomino za Kigiriki zinafanya kazi kimetonimia kwa makundi ya watu. “Tu” huonyesha nguvu ya swali linalotofautisha kama baraka ni ya kundi la kwanza pekee au pia la pili, bila kubadili jibu linalodokezwa na hoja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ya swali imetungwa kwa urahisi wa kusomwa, huku maneno muhimu ya hoja ya Paulo—baraka, imani, kuhesabiwa, na haki—yakihifadhiwa.
