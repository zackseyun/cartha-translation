lexical_decisions:
- source_word: παρεδόθη
  choice: alitolewa
  rationale: Kauli ya kutendwa inadumisha umbo la Kigiriki na uwezekano wa Mungu kueleweka kuwa mtendaji bila kutajwa; pia ni Kiswahili cha kawaida katika muktadha wa kutolewa auawe.
- source_word: διὰ τὰ παραπτώματα ἡμῶν
  choice: kwa sababu ya makosa yetu
  rationale: διά pamoja na hali ya kushutumiwa hapa kwa kawaida huonyesha sababu; tafsiri hii inaweka wazi kuwa makosa yetu ndiyo yaliyohusiana kisababishi na kutolewa kwake.
- source_word: παραπτώματα
  choice: makosa
  rationale: Neno hili linaeleweka kwa wasomaji wa kawaida na linaonyesha matendo ya kukiuka lililo sawa, bila kulipanua moja kwa moja kuwa neno la jumla zaidi, ‘dhambi.’
- source_word: ἠγέρθη
  choice: alifufuliwa
  rationale: Kauli ya kutendwa inaakisi Kigiriki na inadokeza tendo la Mungu bila kuongeza mtendaji katika maandishi.
- source_word: διὰ τὴν δικαίωσιν ἡμῶν
  choice: ili tuhesabiwe kuwa wenye haki
  rationale: Tafsiri ya kusudi/matokeo inatoa kwa Kiswahili cha kawaida maana ya mbele ya ‘kwa ajili ya kuhesabiwa kwetu haki,’ huku uwezekano wa maana ya kisababishi ukihifadhiwa katika tanbihi.
- source_word: δικαίωσιν
  choice: kuhesabiwa kuwa wenye haki
  rationale: Usemi huu wa kawaida unahifadhi nguvu ya kimahakama ya δικαίωσις—uamuzi wa kukubaliwa kuwa mwenye haki—kwa uwazi zaidi kuliko nomino ya kitaalamu ‘kuhesabiwa haki’ peke yake.
theological_decisions:
- issue: Ikiwa διὰ τὴν δικαίωσιν ἡμῶν inaonyesha kusudi/matokeo (‘ili tuhesabiwe kuwa wenye haki’) au sababu (‘kwa sababu tulihesabiwa kuwa wenye haki’).
  choice: ili tuhesabiwe kuwa wenye haki
  alternative: kwa sababu tulihesabiwa kuwa wenye haki
  rationale: Usomaji wa kusudi/matokeo unaendana vizuri na ulinganifu wa kifo na ufufuo wa Kristo katika kazi ya wokovu, lakini sarufi inaweza pia kuruhusu usomaji wa sababu; kwa hiyo huo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa moja kwa moja na unaeleweka kwa wasomaji wa kawaida; kauli za kutendwa zimehifadhiwa pale zinapobeba uzito wa maandishi ya Kigiriki.
