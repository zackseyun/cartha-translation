  text: Basi, tuseme kwamba Abrahamu, babu yetu kwa nasaba ya kimwili[a], amepata nini?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “babu yetu kwa upande wa mwili,” yaani, babu yetu kwa ukoo wa asili.
    reason: lexical_alternative
  - marker: b
    text: 'Wengine huunganisha maneno “kwa nasaba ya kimwili” na “amepata”: “Abrahamu amepata nini kwa uwezo wa kibinadamu?” au “kwa mtazamo wa kibinadamu?”'
    reason: alternative_reading
lexical_decisions:
- source_word: Τί οὖν ἐροῦμεν
  choice: Basi, tuseme ... nini?
  rationale: Inahifadhi mpito wa hoja na swali la kimajadiliano la Paulo kwa Kiswahili cha kawaida.
- source_word: εὑρηκέναι
  choice: amepata
  rationale: Wakati timilifu wa Kigiriki unaonyesha jambo ambalo Abrahamu amefikia au amepata, na ‘amepata’ haliongezi ufafanuzi usio katika matini.
- source_word: Ἀβραὰμ
  choice: Abrahamu
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili cha Biblia.
- source_word: προπάτορα
  choice: babu
  rationale: ‘Babu’ ni neno la kawaida na lenye hadhi linaloweza kumaanisha babu wa ukoo au mhenga; katika muktadha huu linaonyesha Abrahamu kama baba wa ukoo.
- source_word: ἡμῶν
  choice: yetu
  rationale: Kiwakilishi kimehifadhiwa ili kuonyesha Paulo kujihusisha pamoja na wasomaji wake na Abrahamu.
- source_word: κατὰ σάρκα
  choice: wa kimwili
  rationale: Katika usomaji mkuu, kifungu hiki kinaeleza uhusiano wa ukoo wa asili, si hali ya dhambi. Umbo hili ni la kawaida zaidi kuliko tafsiri neno kwa neno ‘kwa jinsi ya mwili’.
theological_decisions:
- issue: Kifungu κατὰ σάρκα kinahusiana na sehemu gani ya sentensi?
  choice: Kimeunganishwa na ‘babu yetu,’ hivyo kinamaanisha babu kwa ukoo wa kimwili.
  alternative: Kinaweza kuunganishwa na ‘amepata,’ yaani, Abrahamu alipata nini kwa uwezo wa kibinadamu au kwa mtazamo wa kibinadamu.
  rationale: Mtiririko wa maneno unaunga mkono kukielewa kama maelezo ya uhusiano wa Abrahamu na watu wake, lakini mpangilio wa Kigiriki unaruhusu usomaji mwingine; kwa hiyo utata huo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi, na inayoeleweka kwa msomaji wa kawaida. Mpangilio wa swali umefanywa wa asili katika Kiswahili huku maana na utata halisi wa Kigiriki vikihifadhiwa.
