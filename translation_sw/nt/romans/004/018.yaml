review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately conveys the principal contrast of παρ’ ἐλπίδα and ἐπ’ ἐλπίδι, Abraham''s becoming father of many nations, and the collective sense of σπέρμα. However, the word order in the Scripture quotation reverses the predicate and subject: “Ndivyo utakavyokuwa uzao wako” can mean that Abraham will become his offspring, rather than that his offspring will be so. The quotation must be corrected.'
  naturalness: Most of the draft is clear Standard East African Swahili. “Kinyume na tumaini, aliamini katika tumaini” is deliberately parallel and preserves Paul's paradox well. “Kama ilivyosemwa” is more idiomatic and direct than “kulingana na yale yaliyokuwa yamesemwa,” while retaining the reference to the prior scriptural utterance.
  terminology: “Mataifa mengi,” “uzao wako,” and “baba” are appropriate and preserve the Genesis-oriented covenantal register. The footnote alternative “mbegu yako” correctly represents the literal collective image without imposing a theological interpretation.
  issues:
  - severity: high
    issue: The quoted clause has reversed Swahili word order.
    rationale: Οὕτως ἔσται τὸ σπέρμα σου means “So shall your offspring be.” The draft's “Ndivyo utakavyokuwa uzao wako” makes “you” the grammatical subject. “Ndivyo uzao wako utakavyokuwa” correctly makes “uzao wako” the subject.
  - severity: low
    issue: The rendering of κατὰ τὸ εἰρημένον is unnecessarily cumbersome.
    rationale: “Kama ilivyosemwa” is natural modern Swahili and faithfully conveys “according to what had been spoken/said,” without changing the sense.
