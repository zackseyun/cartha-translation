  text: ὃς παρ’ ἐλπίδα ἐπ’ ἐλπίδι ἐπίστευσεν εἰς τὸ γενέσθαι αὐτὸν πατέρα πολλῶν ἐθνῶν κατὰ τὸ εἰρημένον· Οὕτως ἔσται τὸ σπέρμα σου·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/018.yaml
  text: 'who[a], against hope, believed in hope, so that he might become the father of many nations[c][b], according to what had been spoken: “So shall your offspring be.”'
translation:
  language: sw
  text: 'Yeye, kinyume na tumaini[a], aliamini katika tumaini, ili awe baba wa mataifa mengi[c], kama ilivyosemwa: “Ndivyo uzao wako utakavyokuwa[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “zaidi ya tumaini” au “kinyume na matarajio.”
    reason: lexical_alternative
  - marker: b
    text: Au “mbegu yako,” ikihifadhi picha ya umoja yenye maana ya kijumla katika Kigiriki.
    reason: lexical_alternative
  - marker: c
    text: Imenukuliwa kutoka Mwanzo 15:5; linganisha Mwanzo 17:5.
    reason: cross_reference
lexical_decisions:
- source_word: παρ’ ἐλπίδα
  choice: kinyume na tumaini
  rationale: Huhifadhi mkazo wa kitendawili kwamba hali ya kawaida haikutoa msingi wa kutumaini, bila kueleza zaidi ya Kigiriki.
- source_word: ἐπ’ ἐλπίδι
  choice: akiwa na tumaini
  rationale: Ni Kiswahili cha kawaida kinachoendeleza utofauti wa balagha kati ya kutokuwa na msingi wa kibinadamu wa kutumaini na kuamini kwa tumaini.
- source_word: ἐπίστευσεν
  choice: aliamini
  rationale: Huwakilisha moja kwa moja kitenzi πιστεύω na kudumisha msamiati wa Paulo kuhusu kuamini bila kuongeza ufafanuzi wa kimadhehebu.
- source_word: εἰς τὸ γενέσθαι αὐτὸν
  choice: ili awe
  rationale: Huhifadhi maana tarajiwa ya kusudi au matokeo katika muundo mfupi na wa kawaida wa Kiswahili, bila kuamua kabisa kati ya kusudi na matokeo.
- source_word: πατέρα πολλῶν ἐθνῶν
  choice: baba wa mataifa mengi
  rationale: “Mataifa” linafaa kwa mwangwi wa ahadi ya Mwanzo na halibani maana kuwa watu wasio Wayahudi pekee.
- source_word: κατὰ τὸ εἰρημένον
  choice: kulingana na yale yaliyokuwa yamesemwa
  rationale: Huonyesha kuwa maneno hayo yalikwisha kusemwa na bado yana mamlaka, huku yakidumisha mtindo wenye heshima.
- source_word: Οὕτως ἔσται
  choice: Ndivyo utakavyokuwa
  rationale: Hutoa usemi wa asili wa Kiswahili wenye uzito wa nukuu ya Maandiko.
- source_word: τὸ σπέρμα σου
  choice: uzao wako
  rationale: “Uzao” ni wa kawaida na huhifadhi picha ya nomino ya umoja yenye maana ya kijumla vizuri kuliko “wazao.”
theological_decisions:
- issue: Maana ya ἐθνῶν katika ahadi kwa Abrahamu
  choice: mataifa
  alternative: watu wa mataifa; watu wengi
  rationale: Muktadha unarejelea ahadi ya Mwanzo kuhusu mataifa mengi; “mataifa” huhifadhi upeo huo bila kuingiza mapema utofauti maalumu wa Wayahudi na watu wa mataifa.
- issue: Uhusiano wa kuamini na kuwa baba wa mataifa mengi
  choice: ili awe
  alternative: na matokeo yake akawa
  rationale: Muundo εἰς τό pamoja na kitenzi-jina unaweza kuonyesha kusudi au matokeo. “Ili awe” huhifadhi mwelekeo wa ahadi bila kufunga kabisa mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mpangilio umehifadhi kitendawili cha tumaini, na “uzao” umetumiwa ili kudumisha picha ya kijumla ya σπέρμα. Alama zote za tanbihi zimewekwa katika maandishi karibu na vifungu vinavyohusika.
