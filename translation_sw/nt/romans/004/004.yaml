  text: τῷ δὲ ἐργαζομένῳ ὁ μισθὸς οὐ λογίζεται κατὰ χάριν ἀλλὰ κατὰ ὀφείλημα·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/004.yaml
  text: To the one who works[a], the wages are not credited as a gift[b], but as an obligation.
translation:
  language: sw
  text: Lakini kwa mtu anayefanya kazi, ujira hauhesabiwi kama zawadi[a], bali kama malipo yanayodaiwa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hauhesabiwi kwa neema.”
    reason: lexical_alternative
  - marker: b
    text: Kwa neno halisi, “bali kwa deni”; yaani, kama kitu kinachopaswa kulipwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐργαζομένῳ
  choice: mtu anayefanya kazi
  rationale: Kivumishi-tendo chenye kibainishi kinamtaja kwa ujumla mtu anayefanya kazi; usemi huu ni wa kawaida na unaeleweka vizuri katika Kiswahili.
- source_word: μισθὸς
  choice: ujira
  rationale: Katika muktadha wa kazi na malipo, “ujira” huonyesha malipo yanayopatikana kwa kufanya kazi kwa usahihi zaidi kuliko “thawabu.”
- source_word: λογίζεται
  choice: hauhesabiwi
  rationale: Neno hili lina maana ya kuhesabu au kuweka katika hesabu. “Hauhesabiwi” inadumisha sitiari ya kihasibu ya Paulo na ni Kiswahili cha kawaida.
- source_word: κατὰ χάριν
  choice: kuwa zawadi
  rationale: Katika utofautishaji kati ya ujira uliopatikana kwa kazi na malipo yasiyodaiwa, “kuwa zawadi” huwasilisha maana ya kitu kinachotolewa kwa neema bila kudaiwa.
- source_word: ὀφείλημα
  choice: kile anachodaiwa
  rationale: Neno hili humaanisha deni au kitu kinachopaswa kulipwa. Usemi huu unaonyesha wazi kwamba ujira ni haki ya mfanyakazi, si zawadi.
- source_word: δὲ
  choice: Lakini
  rationale: Kiunganishi hiki kinaendeleza hoja kwa kuonyesha utofauti na kauli iliyotangulia; “Lakini” kinadumisha uhusiano huo bila kuongeza wazo la wakati.
theological_decisions:
- issue: Maana ya χάρις katika utofautishaji wa kazi na ujira
  choice: kuwa zawadi
  alternative: kwa neema
  rationale: Muktadha unatofautisha malipo yanayodaiwa kwa kazi na kitu kinachotolewa bila kudaiwa. “Kuwa zawadi” huifanya maana hiyo iwe wazi huku tanbihi ikihifadhi tafsiri ya karibu zaidi na umbo la Kigiriki, “kwa neema.”
- issue: Maana ya ὀφείλημα
  choice: kile anachodaiwa
  alternative: deni
  rationale: Tafsiri hii inadumisha hoja kwamba ujira ni kitu kinachopaswa kulipwa, bila kuifanya sentensi ya Kiswahili kuwa ngumu. “Deni” linabaki kuwa badala halali ya karibu zaidi na neno la Kigiriki.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inadumisha sitiari ya kazi, ujira na hesabu, huku ikitumia “kile anachodaiwa” kwa uwazi wa kawaida.
