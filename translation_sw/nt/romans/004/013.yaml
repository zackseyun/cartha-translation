  text: Οὐ γὰρ διὰ νόμου ἡ ἐπαγγελία τῷ Ἀβραὰμ ἢ τῷ σπέρματι αὐτοῦ, τὸ κληρονόμον αὐτὸν ⸀εἶναι κόσμου, ἀλλὰ διὰ δικαιοσύνης πίστεως·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/013.yaml
  text: For the promise to Abraham or to his offspring that he would be heir of the world was not through the law[d][c][b][a], but through the righteousness of faith.
translation:
  language: sw
  text: Kwa maana ahadi kwa Abrahamu, au kwa uzao wake[a], ya kwamba yeye angekuwa mrithi wa ulimwengu haikuja kwa njia ya sheria, bali kwa njia ya haki[c] ya imani[d][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mbegu” au “wazao.” Neno la Kigiriki liko katika umoja lakini linaweza kutumiwa kwa maana ya kijumla.
    reason: lexical_alternative
  - marker: b
    text: Au “kwa njia ya haki inayopatikana kwa imani” au “kwa njia ya haki itokanayo na imani.”
    reason: alternative_reading
  - marker: c
    text: Neno “haki” linaweza pia kutafsiriwa “uadilifu,” kutegemea muktadha.
    reason: lexical_alternative
  - marker: d
    text: Neno “imani” linaweza pia kutafsiriwa “uaminifu” au “tumaini,” kutegemea muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπαγγελία
  choice: ahadi
  rationale: Ni neno la kawaida na lenye hadhi kwa ahadi ya Mungu, na linahifadhi uzito wa agano katika hoja ya Paulo.
- source_word: σπέρματι
  choice: uzao
  rationale: Neno la Kigiriki liko katika umoja lakini linaweza kutaja kundi; “uzao” linahifadhi umoja huo wa kijumla bila kulazimisha maana kuwa mtu mmoja au vizazi vingi.
- source_word: κληρονόμον ... κόσμου
  choice: mrithi wa ulimwengu
  rationale: Linahifadhi wazi lugha ya urithi na upeo mpana wa κόσμος bila kuupunguza.
- source_word: διὰ νόμου
  choice: kupitia sheria
  rationale: Linawakilisha njia au msingi unaokanushwa na Paulo. “Sheria” katika muktadha inaweza kueleweka hasa kuwa Sheria ya Musa, ingawa Kigiriki hakina kibainishi hapa.
- source_word: δικαιοσύνης
  choice: haki
  rationale: “Haki” ni tafsiri ya kawaida na ya asili ya δικαιοσύνη katika Kiswahili cha kibiblia na inaweza kubeba maana ya hali ya kuwa sawa mbele za Mungu bila kuibana kuwa uadilifu wa kijamii pekee.
- source_word: πίστεως
  choice: imani
  rationale: “Imani” ndiyo chaguo la kawaida katika muktadha huu wa tofauti kati ya sheria na imani; uwezekano wa “uaminifu” au “kumtumaini” umehifadhiwa katika tanbihi.
- source_word: διὰ δικαιοσύνης πίστεως
  choice: kupitia haki ya imani
  rationale: Muundo huu unahifadhi ufupi na uhusiano wa kijenitivi wa Kigiriki bila kuamua kimyakimya kama haki hiyo hutokana na imani, hupatikana kwa imani, au ina sifa ya imani.
theological_decisions:
- issue: Uhusiano katika δικαιοσύνης πίστεως
  choice: haki ya imani
  alternative: haki inayopatikana kwa imani; haki itokanayo na imani
  rationale: Kigiriki kina muundo mfupi unaoweza kufafanuliwa kwa njia kadhaa zinazokaribiana. Tafsiri kuu inadumisha mvutano huo badala ya kuweka wazi uhusiano ambao Paulo hakuueleza moja kwa moja hapa.
- issue: Rejeo la νόμου lisilo na kibainishi
  choice: sheria
  alternative: Sheria ya Musa
  rationale: Muktadha wa Waroma unaelekeza kwa nguvu kwenye Sheria ya Musa, lakini maandishi yenyewe yanasema νόμου bila kibainishi; kwa hiyo tafsiri kuu haiongezi “ya Musa.”
- issue: Upeo wa σπέρματι
  choice: uzao wake
  alternative: mzao wake; wazao wake
  rationale: “Uzao” unaweza kuwa wa kijumla na pia huhifadhi umbo la umoja, hivyo haumalizi mapema uwezekano wa neno hilo kuelekezwa kwa mmoja au wengi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inafuata mantiki ya Kigiriki lakini imepangwa kwa mtiririko wa kawaida wa Kiswahili. “Abrahamu,” “uzao,” “mrithi,” “ulimwengu,” “sheria,” “haki,” na “imani” ni istilahi zinazoeleweka kwa wasomaji wa kawaida na hazifungwi kwa dhehebu fulani.
