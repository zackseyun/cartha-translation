  yaml_path: translation/nt/romans/004/022.yaml
  text: Therefore it was counted to him as righteousness[a][b].
translation:
  language: sw
  text: Kwa hiyo, hilo likahesabiwa kwake kuwa haki[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “likawekwa katika hesabu yake kuwa haki.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διό
  choice: Kwa hiyo
  rationale: Inaonyesha hitimisho linalotokana na hoja iliyotangulia kwa Kiswahili cha kawaida na wazi.
- source_word: ἐλογίσθη
  choice: likahesabiwa
  rationale: Kauli tendwa inadumisha muundo wa Kigiriki na taswira ya kuhesabu au kuweka katika hesabu iliyo muhimu katika Waroma 4.
- source_word: αὐτῷ
  choice: kwake
  rationale: Huwasilisha kwa kawaida yule anayepokea hesabu hiyo, yaani Abrahamu katika muktadha.
- source_word: εἰς
  choice: kuwa
  rationale: Katika muundo huu, “kuwa” huonyesha hadhi au matokeo yanayohesabiwa bila kuongeza ufafanuzi wa kiteolojia.
- source_word: δικαιοσύνην
  choice: haki
  rationale: “Haki” ndilo neno la kawaida la Kiswahili kwa δικαιοσύνη katika matumizi haya ya Paulo na linaweza kubeba maana ya hali ya kuwa sawa mbele za Mungu bila kuifafanua kupita maandiko.
theological_decisions:
- issue: Kudumisha lugha ya Paulo ya kuhesabu bila kuingiza mfumo wa mafundisho usiotajwa wazi
  choice: hilo likahesabiwa kwake kuwa haki
  alternative: hilo likawekwa katika hesabu yake kuwa haki
  rationale: Tafsiri hii inadumisha sitiari ya kihesabu na kauli tendwa huku ikiacha wazi namna hasa ambavyo kuhesabiwa huko kunahusiana na haki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Kiwakilishi “hilo” hurejelea jambo lililotangulia katika muktadha; kitenzi “likahesabiwa” kinakubaliana nacho na kuhifadhi mtiririko wa simulizi.
