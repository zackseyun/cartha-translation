  text: καθὼς γέγραπται ὅτι Πατέρα πολλῶν ἐθνῶν τέθεικά σε), κατέναντι οὗ ἐπίστευσεν θεοῦ τοῦ ζῳοποιοῦντος τοὺς νεκροὺς καὶ καλοῦντος τὰ μὴ ὄντα ὡς ὄντα·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/017.yaml
  text: as it is written[a], "I have made you the father of many nations"—in the presence of the God in whom he believed[b], who gives life to the dead and calls the things that are not as though they were.
translation:
  language: sw
  text: 'kama ilivyoandikwa: “Nimekuweka kuwa baba wa mataifa mengi[a]”—mbele za Mungu ambaye Abrahamu alimwamini, Mungu ambaye huwapa wafu uzima na huyaita vitu visivyokuwako kana kwamba viko.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno “mataifa” hapa linaweza pia kueleweka kuwa “watu wa Mataifa,” lakini katika nukuu hii kutoka kitabu cha Mwanzo maana pana zaidi inaelekea kufaa.
    reason: lexical_alternative
  - marker: b
    text: Au, kwa ufafanuzi zaidi, “anayevita vitu visivyokuwako viwepo.”
    reason: alternative_reading
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: kama ilivyoandikwa
  rationale: Ni mtindo wa kawaida wa kunukuu Maandiko; pia unaonyesha kwamba yaliyoandikwa yanaendelea kuwa na mamlaka.
- source_word: Πατέρα πολλῶν ἐθνῶν
  choice: baba wa mataifa mengi
  rationale: Katika nukuu hii kutoka Mwanzo, ἔθνη ina maana pana ya mataifa au makundi ya watu, si lazima watu wa Mataifa kwa kulinganishwa na Wayahudi.
- source_word: τέθεικά σε
  choice: Nimekuweka kuwa
  rationale: 'Huwasilisha vizuri hali timilifu ya kitenzi: Mungu amemweka Abrahamu katika nafasi hiyo yenye matokeo yanayoendelea.'
- source_word: κατέναντι
  choice: mbele za
  rationale: Huhifadhi maana ya kuwa mbele au machoni pa Mungu kwa Kiswahili cha kawaida na chenye heshima.
- source_word: οὗ ἐπίστευσεν
  choice: ambaye Abrahamu alimwamini
  rationale: Jina Abrahamu limetajwa wazi ili kuondoa utata wa viwakilishi katika Kiswahili bila kubadili mhusika anayeonyeshwa na muktadha.
- source_word: ζῳοποιοῦντος τοὺς νεκρούς
  choice: anayewapa wafu uzima
  rationale: Ni usemi wa asili unaohifadhi picha ya Mungu kama mwenye kuwapa uzima wale waliokufa.
- source_word: καλοῦντος
  choice: kuyaita
  rationale: Maana ya msingi ya ‘kuita’ imehifadhiwa badala ya kuingiza moja kwa moja tafsiri ya ‘kuumba’ au ‘kuleta katika uwepo.’
- source_word: τὰ μὴ ὄντα ὡς ὄντα
  choice: mambo yasiyokuwako kana kwamba yanakuwako
  rationale: Hufuata kwa karibu muundo wa Kigiriki na kuhifadhi uwazi wake wa kitafsiri; maana ya kuleta vitu katika uwepo imewekwa katika tanbihi kama uwezekano wa ufafanuzi.
theological_decisions:
- issue: Ikiwa kishazi cha mwisho kitafsiriwe moja kwa moja kama kauli kuhusu Mungu kuumba kutoka pasipo kitu.
  choice: kuyaita mambo yasiyokuwako kana kwamba yanakuwako
  alternative: kuyaita yawepo mambo yasiyokuwako
  rationale: Kigiriki kinaweza kudokeza uwezo wa Mungu wa kuumba, lakini usemi wake ni mfupi na unaweza kueleweka kwa upana zaidi. Tafsiri kuu haiamui mvutano huo kimyakimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa nukuu ni wa kawaida katika lugha ya Biblia, huku kishazi kigumu cha mwisho kikibaki karibu na Kigiriki. Jina ‘Abrahamu’ limewekwa wazi katika kishazi cha imani ili kuepusha utata wa kisarufi wa Kiswahili.
