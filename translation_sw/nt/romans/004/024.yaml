    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ καὶ
  choice: bali pia
  rationale: 'Inahifadhi nguvu ya kupinga na kuongeza: Paulo anatofautisha na yaliyotangulia huku akipanua matumizi yake yatuhusu sisi pia.'
- source_word: δι’ ἡμᾶς
  choice: kwa ajili yetu
  rationale: Katika muktadha huu διά pamoja na hali ya accusative inaonyesha wale waliokuwa wanakusudiwa au kuzingatiwa na yaliyoandikwa.
- source_word: οἷς μέλλει λογίζεσθαι
  choice: ambao hilo litahesabiwa kwao
  rationale: Muundo huu unahifadhi mwelekeo wa wakati ujao wa μέλλει na sitiari ya kuingiza katika hesabu ya λογίζεσθαι. Kiwakilishi “hilo” kinadumisha kitu kilichoachwa wazi katika Kigiriki, huku “kwao” kikionyesha dative ya wapokeaji.
- source_word: τοῖς πιστεύουσιν ἐπὶ
  choice: sisi tunaomwamini
  rationale: Kitenzi chenye ἐπί kinaeleza imani au tumaini linaloelekezwa kwa mtu. “Kumwamini” ni Kiswahili cha kawaida na kinachofaa katika muktadha huu.
- source_word: τὸν ἐγείραντα
  choice: yeye aliyemfufua
  rationale: Inahifadhi kishiriki chenye kazi ya nomino, kikimtaja Mungu kwa tendo lake bila kuongeza jina lisilotajwa hapa.
- source_word: Ἰησοῦν τὸν κύριον ἡμῶν
  choice: Yesu, Bwana wetu
  rationale: Jina limetoholewa kwa matumizi ya kawaida, na κύριος limetafsiriwa “Bwana”; koma linaonyesha kuwa “Bwana wetu” linamfafanua Yesu.
- source_word: ἐκ νεκρῶν
  choice: kutoka kwa wafu
  rationale: Hii ni kauli ya kawaida na sahihi ya Kiswahili kwa lugha ya ufufuo, ikihifadhi wazo la kutoka miongoni mwa waliokufa.
theological_decisions:
- issue: Kitu kisichotajwa wazi cha λογίζεσθαι
  choice: Kutumia “hilo” bila kulitaja kuwa haki
  alternative: “haki itahesabiwa kwao” au “watahesabiwa kuwa wenye haki”
  rationale: Kigiriki kinaacha kitu kinachohesabiwa wazi kwa sababu kinachukuliwa kutoka muktadha uliotangulia. “Hilo” hufanya sentensi ieleweke katika Kiswahili bila kuingiza moja kwa moja nomino “haki” ndani ya aya.
- issue: Mhusika anayemfufua Yesu
  choice: Kumwacha kama “yeye aliyemfufua”
  alternative: Kumtaja wazi kuwa Mungu
  rationale: Muktadha humtambulisha kuwa Mungu, lakini aya yenyewe inatumia kishiriki badala ya jina. Tafsiri inadumisha namna hiyo ya usemi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Hilo litahesabiwa kwao” ni rasmi kidogo lakini kinatunza sitiari ya kihasibu na hali ya kutotajwa wazi kwa kitu kinachohesabiwa katika Kigiriki. “Yaani” linafafanua urudiaji wa “sisi” kwa njia ya kawaida bila kubadili maana.
