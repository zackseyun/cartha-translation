base_translation:
  language: en
  yaml_path: translation/nt/romans/004/019.yaml
  text: And without weakening in faith[b][a], he considered his own body as good as dead—since he was about a hundred years old—and the deadness of Sarah’s womb.
translation:
  language: sw
  text: Naye, bila kudhoofika katika imani, aliutafakari[a] mwili wake mwenyewe uliokuwa kama umekufa—kwa kuwa alikuwa na umri wa karibu miaka mia moja—na hali ya tumbo la uzazi la Sara kuwa kama limekufa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kulingana na mapokeo mengine ya maandishi: “hakutafakari mwili wake mwenyewe, uliokuwa kama umekufa.”'
    reason: textual_variant
  - marker: b
    text: Au “utasa” kwa usemi “hali ya tumbo la uzazi la Sara kuwa kama limekufa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσθενήσας
  choice: kudhoofika
  rationale: Kitenzi hiki kinaonyesha kupungua nguvu; muundo “bila kudhoofika” unahifadhi uhusiano wa kishiriki na imani kwa Kiswahili cha kawaida.
- source_word: πίστει
  choice: katika imani
  rationale: Hapa πίστει inaeleza eneo au hali ambayo Abrahamu hakudhoofika, yaani kumtumaini Mungu na ahadi yake.
- source_word: κατενόησεν
  choice: aliutafakari
  rationale: Neno hili linaonyesha kuangalia jambo kwa makini na kulitambua; “aliutafakari” halimaanishi kwamba Abrahamu alipuuza ukweli wa hali yake.
- source_word: νενεκρωμένον
  choice: uliokuwa kama umekufa
  rationale: Hali inayokusudiwa si kifo halisi cha mwili wote, bali kutokuwa na uwezo wa kuzaa; “kama umekufa” huhifadhi taswira ya kifo bila kupotosha maana.
- source_word: ἑκατονταετής που ὑπάρχων
  choice: kwa kuwa alikuwa na umri wa karibu miaka mia moja
  rationale: πού huonyesha ukadiriaji, hivyo “karibu” inafaa; kifungu kinaeleza sababu ya mwili wake kuonekana kama umekufa kwa habari ya uzazi.
- source_word: νέκρωσιν
  choice: hali ya kufa
  rationale: Uamuzi huu unahifadhi lugha ya kifo inayolingana na νενεκρωμένον, badala ya kuibadili moja kwa moja kuwa utasa.
- source_word: μήτρας Σάρρας
  choice: tumbo la uzazi la Sara
  rationale: Huu ni usemi wa kawaida na wazi kwa μήτρα, huku ukihifadhi picha halisi ya kiungo cha uzazi.
theological_decisions:
- issue: Iwapo lugha ya kifo kuhusu uwezo wa uzazi ilainishwe kuwa “utasa”
  choice: Kudumisha taswira ya kifo katika “mwili ... kama umekufa” na “hali ya kufa ya tumbo la uzazi.”
  alternative: Mwili wake haukuwa na uwezo wa kuzaa, na Sara alikuwa tasa.
  rationale: Paulo anatumia maneno yanayohusiana na kifo kwa mwili wa Abrahamu na tumbo la uzazi la Sara; kuyahifadhi kunaonyesha uzito wa hali isiyowezekana ambayo ahadi ya Mungu ilikabili.
- issue: Tofauti ya maandishi kuhusu kuwepo kwa μὴ kabla ya κατενόησεν
  choice: Maandishi makuu yanafuata SBLGNT yenye “aliutafakari.”
  alternative: “Hakuutafakari mwili wake mwenyewe uliokuwa kama umekufa.”
  rationale: SBLGNT iliyotolewa ina μὴ pamoja na ἀσθενήσας, si pamoja na κατενόησεν; mapokeo mengine ya maandishi yana usomaji hasi katika kitenzi kikuu, nao umeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Lugha ya kifo imehifadhiwa kwa makusudi, na tofauti ya maandishi pamoja na mbadala wa kileksika zimewekwa katika tanbihi.
