  yaml_path: translation/nt/romans/004/008.yaml
  text: Blessed is the man against whom the Lord will never count sin[a][b].
translation:
  language: sw
  text: Heri mtu ambaye Bwana hatamhesabia kamwe dhambi[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Heri mwanadamu ambaye Bwana hatamhesabia dhambi.”
    reason: lexical_alternative
  - marker: b
    text: Au, “Heri mtu ambaye kwa hakika Bwana hatamhesabia dhambi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριος
  choice: Heri
  rationale: Neno hili la kawaida katika lugha ya Biblia linaonyesha hali ya kubarikiwa na Mungu, bila kulifanya kuwa hisia ya furaha tu.
- source_word: ἀνήρ
  choice: mtu
  rationale: Ingawa Kigiriki kina nomino ya kiume katika umoja, hapa imetumiwa kiwakilishi kwa mwanadamu yeyote. Kiswahili cha kawaida hutumia “mtu” kwa maana hiyo bila kuifanya kauli iwe ya wanaume pekee.
- source_word: οὗ
  choice: ambaye ... hatamhesabia
  rationale: Muundo huu wa Kiswahili unaonyesha kwa kawaida kwamba dhambi haitahesabiwa dhidi ya mtu huyo.
- source_word: οὐ μὴ
  choice: hatamhesabia kamwe
  rationale: “Kamwe” pamoja na umbo la ukanushi wa wakati ujao huwasilisha mkazo mkubwa wa ukanushi katika Kigiriki.
- source_word: λογίσηται
  choice: hesabia
  rationale: “Hesabia” ni neno la kawaida linalodumisha sitiari ya uhasibu iliyo muhimu katika muktadha wa Waroma 4.
- source_word: κύριος
  choice: Bwana
  rationale: Hili ndilo neno la kawaida na lenye hadhi katika Kiswahili kwa κύριος, hasa katika nukuu ya Maandiko.
- source_word: ἁμαρτίαν
  choice: dhambi
  rationale: Umoja usio na kibainishi umehifadhiwa kama dhana ya dhambi kwa ujumla, kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Lugha ya kiume yenye maana ya uwakilishi
  choice: Kutumia “mtu” katika matini kuu
  alternative: “mwanamume”
  rationale: Katika muktadha huu ἀνήρ haisemi wanaume pekee bali inamwakilisha mtu yeyote. “Mtu” huhifadhi umoja na maana pana kwa njia ya asili katika Kiswahili.
- issue: Mkazo wa kutohesabiwa dhambi
  choice: “hatamhesabia kamwe dhambi”
  alternative: “kwa hakika hatamhesabia dhambi”
  rationale: “Kamwe” huonyesha ukanushi wenye nguvu wa οὐ μή bila kuufanya usemi kuwa istilahi maalumu ya kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi, na inayoeleweka kwa urahisi. Muundo umehifadhi sitiari ya kuhesabu huku ukitanguliza mtiririko wa kawaida wa Kiswahili.
