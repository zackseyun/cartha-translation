  to: Naye alipokea ishara ya tohara, muhuri wa haki ya imani yake aliyokuwa nayo alipokuwa hajatahiriwa,[a] ili awe baba wa wote wanaoamini wakiwa hawajatahiriwa,[b] ili haki ihesabiwe kwao pia.[c]
  rationale: Marekebisho yanarudisha «haki ya imani» badala ya uhusiano wa kisababishi uliowekwa wazi, yanatumia istilahi ya kawaida ya Paulo katika Kiswahili, na yanahifadhi muundo wa mwisho kwamba haki ihesabiwe kwa waamini wasiotahiriwa. Marudio ya kusudi katika εἰς τὸ ... εἰς τὸ yanawakilishwa kwa «ili ... ili». Alama za tanbihi zimewekwa kwenye vifungu vinavyohusika na maana zake za kileksika.
