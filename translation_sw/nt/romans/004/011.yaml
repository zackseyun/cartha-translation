  text: καὶ σημεῖον ἔλαβεν περιτομῆς, σφραγῖδα τῆς δικαιοσύνης τῆς πίστεως τῆς ἐν τῇ ἀκροβυστίᾳ, εἰς τὸ εἶναι αὐτὸν πατέρα πάντων τῶν πιστευόντων δι’ ἀκροβυστίας, εἰς τὸ ⸀λογισθῆναι αὐτοῖς τὴν δικαιοσύνην,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/011.yaml
  text: And he received the sign of circumcision as a seal of the righteousness of the faith that he had while uncircumcised[a], so that he might be the father of all who believe while uncircumcised, so that righteousness might be counted to them also[c][b],
translation:
  language: sw
  text: Naye alipokea ishara ya tohara, muhuri wa haki ya imani yake aliyokuwa nayo alipokuwa hajatahiriwa,[a] ili awe baba wa wote wanaoamini wakiwa hawajatahiriwa,[b] ili haki ihesabiwe kwao pia.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “katika kutotahiriwa”; yaani, alipokuwa hajatahiriwa.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “kwa njia ya kutotahiriwa”; yaani, wakiwa hawajatahiriwa.
    reason: lexical_alternative
  - marker: c
    text: Au, “haki iwekwe katika hesabu yao” au “haki itambuliwe kwao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σημεῖον
  choice: ishara
  rationale: “Ishara” ni neno la kawaida na wazi linalohifadhi maana ya tohara kuwa dalili ya nje.
- source_word: περιτομή
  choice: tohara
  rationale: Hili ndilo neno sanifu la Kiswahili kwa desturi inayozungumziwa katika hoja ya Paulo.
- source_word: σφραγίς
  choice: muhuri
  rationale: “Muhuri” huhifadhi sitiari ya uthibitisho badala ya kuifafanua kupita kiasi.
- source_word: δικαιοσύνη
  choice: uadilifu
  rationale: “Uadilifu” huwasilisha hali ya kuwa sawa au kukubalika kwa haki katika muktadha huu, bila kuamua kimadhehebu namna hali hiyo inavyopatikana.
- source_word: πίστις
  choice: imani
  rationale: “Imani” ni tafsiri ya kawaida na yenye upana unaofaa hapa.
- source_word: ἐν τῇ ἀκροβυστίᾳ
  choice: alipokuwa hajatahiriwa
  rationale: Kauli hii ya asili inaeleza hali ya Abrahamu wakati alipokuwa na imani; tafsiri hii ni ya asili katika Kiswahili.
- source_word: πατέρα πάντων τῶν πιστευόντων
  choice: baba wa wote wanaoamini
  rationale: Huhifadhi lugha ya Paulo kuhusu Abrahamu kuwa baba mwakilishi kwa waamini.
- source_word: δι’ ἀκροβυστίας
  choice: wakiwa hawajatahiriwa
  rationale: Katika muktadha huu kifungu kinaonyesha hali ya waamini, si kwamba kutotahiriwa ni chombo kinachosababisha imani.
- source_word: λογισθῆναι
  choice: wahesabiwe kuwa na
  rationale: Huhifadhi picha ya kuhesabu au kuweka katika hesabu huku ikitoa sentensi ya Kiswahili iliyo wazi.
- source_word: καί
  choice: pia
  rationale: “Pia” huonyesha wazi kwamba waamini wasiotahiriwa nao wanajumuishwa.
theological_decisions:
- issue: Uhusiano wa tohara na uadilifu
  choice: Tohara imeelezwa kuwa ishara na muhuri wa uadilifu unaohusishwa na imani ambayo Abrahamu tayari alikuwa nayo kabla ya kutahiriwa.
  alternative: Kauli ingeweza kutafsiriwa kwa namna inayodokeza kwamba tohara ndiyo iliyompatia uadilifu.
  rationale: Mpangilio wa Kigiriki unaonyesha tohara kama uthibitisho uliofuata uadilifu wa imani katika hali ya kutotahiriwa; tafsiri inadumisha mpangilio huo bila kuingiza mfumo wa baadaye wa kisakramenti.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inadumisha marudio ya kusudi katika εἰς τὸ ... εἰς τὸ kwa kutumia “ili ... kusudi,” huku ikiepuka lugha nzito isiyo ya kawaida.
