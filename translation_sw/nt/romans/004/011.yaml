  verdict: revise
  source_fidelity: Marekebisho yanahitajika ili kuhifadhi kwa karibu zaidi mnyororo wa Kigiriki «σφραγῖδα τῆς δικαιοσύνης τῆς πίστεως» na usemi wa uhasibu katika «λογισθῆναι αὐτοῖς τὴν δικαιοσύνην». Rasimu ya awali ya «uadilifu unaotokana na imani» hufanya uhusiano wa genitivi kuwa wa kisababishi, na «wahesabiwe kuwa na uadilifu» hubadilisha kidogo uadilifu unaohesabiwa kwao kuwa hali yao ya kumilikiwa.
  naturalness: Matini iliyorekebishwa ni Kiswahili sanifu, cha sasa, na husomeka kwa mtiririko wa heshima. «Haki ya imani yake» inaweka wazi kwamba kishazi «aliyokuwa nayo» kinarejelea imani ya Abrahamu, si haki.
  terminology: «Haki» ni istilahi iliyozoeleka zaidi katika Kiswahili cha kibiblia kwa δικαιοσύνη katika hoja ya Paulo; «muhuri», «ishara», «tohara», na «imani» zinahifadhi sitiari na istilahi za chanzo. «Haki ihesabiwe kwao» hudumisha lugha ya λογίζομαι bila kuingiza tafsiri ya kimadhehebu.
  issues:
  - severity: medium
    issue: «uadilifu unaotokana na imani»
    rationale: Kigiriki kina «haki/uadilifu wa imani», si kauli ya wazi ya kwamba haki ‘inatokana na’ imani. Kauli ya rasimu inatafsiri uhusiano wa maneno kwa upana zaidi kuliko chanzo.
  - severity: medium
    issue: «wahesabiwe kuwa na uadilifu»
    rationale: Chanzo husema kwamba uadilifu wenyewe uhesabiwe kwao. Kauli iliyopo hubadilisha muundo huo kuwa kuhesabiwa kuwa na sifa au mali ya uadilifu.
  - severity: low
    issue: Matumizi ya «uadilifu» kwa δικαιοσύνη
    rationale: Ingawa linaweza kueleweka, «uadilifu» mara nyingi hudokeza zaidi tabia ya maadili. «Haki» ni istilahi ya kawaida na inayofaa zaidi kwa matumizi ya Paulo hapa.
