  text: πρὸς δὲ τὸν Ἰσραὴλ λέγει· Ὅλην τὴν ἡμέραν ἐξεπέτασα τὰς χεῖράς μου πρὸς λαὸν ἀπειθοῦντα καὶ ἀντιλέγοντα.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/021.yaml
  text: But concerning Israel he says[c][b][a], “All day long I have stretched out my hands to a disobedient and opposing people.”
translation:
  language: sw
  text: Lakini kuhusu Israeli anasema[a], “Siku nzima nimenyoosha mikono yangu kuelekea watu wasiotii[b] na wanaopinga[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Lakini kwa Israeli anasema.” Muundo wa Kigiriki unaweza kueleweka kuwa maneno yanaelekezwa kwa Israeli au yanasemwa kuhusu Israeli.
    reason: alternative_reading
  - marker: b
    text: “Wasiotii” pia inaweza kuwa na maana ya “wasioamini” au “wanaokataa kushawishika.”
    reason: lexical_alternative
  - marker: c
    text: Au, “wanaosema kinyume” au “wanaobisha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς δὲ τὸν Ἰσραὴλ
  choice: Lakini kuhusu Israeli
  rationale: Kifungu hiki kinaweza kutambulisha jambo linalosemwa kuhusu Israeli; Kiswahili hiki ni cha kawaida, huku uwezekano wa maana ‘kwa Israeli’ ukihifadhiwa katika tanbihi.
- source_word: λέγει
  choice: anasema
  rationale: Wakati uliopo umehifadhiwa kama mtindo hai wa kutambulisha nukuu. Kiima hakijatajwa wazi katika Kigiriki, hivyo hakijaongezwa kwa jina.
- source_word: Ὅλην τὴν ἡμέραν
  choice: Mchana kutwa
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha muda wote wa siku bila kutumia lugha nzito au ya kizamani.
- source_word: ἐξεπέτασα τὰς χεῖράς μου
  choice: nimewanyoshea mikono yangu
  rationale: Huhifadhi taswira ya mikono iliyonyoshwa kuelekea watu hao na kuonyesha mwito au kusihi kunakoendelea kuwa na uzito katika nukuu.
- source_word: πρὸς λαὸν
  choice: watu
  rationale: Katika Kiswahili, kiambishi cha mtendewa katika ‘nimewanyoshea’ huonyesha mwelekeo kwa kawaida; ‘watu’ huhifadhi maana ya λαός bila kuifanya kuwa taifa la kisiasa.
- source_word: ἀπειθοῦντα
  choice: wasiotii
  rationale: Neno hili linaonyesha kutokutii na pia kukataa kusadiki au kushawishika; ‘wasiotii’ huhifadhi uzito wa kimaadili na wa hiari, na maana nyingine imeelezwa katika tanbihi.
- source_word: ἀντιλέγοντα
  choice: wanaopinga
  rationale: Huwasilisha upinzani wenye kutamka au kusema dhidi ya jambo kwa Kiswahili cha sasa; maana mahususi zaidi ya ‘wanaosema kinyume’ imehifadhiwa katika tanbihi.
theological_decisions:
- issue: Jinsi mwitikio wa Israeli kwa Mungu unavyoelezwa
  choice: wasiotii na wanaopinga
  alternative: wasiotaka kuamini na wanaosema kinyume
  rationale: 'Tafsiri huhifadhi pande zote mbili za kauli: kukataa kutii au kushawishika, na upinzani wa wazi. Haiongezi hitimisho kuhusu hali pana ya Israeli zaidi ya nukuu yenyewe.'
- issue: Kiima cha ‘anasema’
  choice: kiima kimeachwa bila kutajwa kwa jina
  alternative: Mungu anasema
  rationale: Muktadha unaelekeza kwa Mungu kama msemaji wa nukuu, lakini Kigiriki cha mstari huu kina kiima kilichodokezwa tu; kutokitaja kwa jina huhifadhi muundo na kiasi cha uwazi cha chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Mchana kutwa’ ni usemi unaoeleweka kwa urahisi; muundo wa nukuu umewekwa wazi bila kuondoa utata halisi wa πρὸς δὲ τὸν Ἰσραήλ.
