  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀλλὰ τί λέγει; Ἐγγύς σου τὸ ῥῆμά ἐστιν, ἐν τῷ στόματί σου καὶ ἐν τῇ καρδίᾳ σου, τοῦτ’ ἔστιν τὸ ῥῆμα τῆς πίστεως ὃ κηρύσσομεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/008.yaml
  text: But what does it say? “The word is near you[a], in your mouth and in your heart” — that is[b], the word of faith that we proclaim.
translation:
  language: sw
  text: Lakini inasema nini? “Neno liko karibu nawe, kinywani mwako na moyoni mwako.”[a] Hilo ndilo neno la imani[b] tunalolitangaza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Paulo anarudia maneno ya Kumbukumbu la Torati 30:14 na kuyatumia kwa ujumbe wa imani anaoutangaza.
    reason: cross_reference
  - marker: b
    text: Au “neno la kutumaini.” Katika miktadha mingine neno la Kigiriki πίστις linaweza pia kumaanisha “uaminifu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Lakini
  rationale: Kiunganishi hiki kinaendeleza utofautishaji wa hoja iliyotangulia kwa njia ya kawaida na iliyo wazi katika Kiswahili.
- source_word: τί λέγει
  choice: inasema nini?
  rationale: Muundo huu huhifadhi nafsi isiyotajwa wazi katika Kigiriki bila kuongeza neno ‘Maandiko’; muktadha ndio unaobainisha kinachosema.
- source_word: Ἐγγύς σου
  choice: liko karibu nawe
  rationale: Hutoa maana ya ukaribu wa mahali au wa kimafumbo na kuendeleza muundo mfupi wa dondoo.
- source_word: τὸ ῥῆμά
  choice: Neno
  rationale: ‘Neno’ huhifadhi uhusiano wa kileksia na kutokea kwa pili kwa ῥῆμα, huku maelezo ya Paulo yakifafanua kuwa ni ujumbe unaotangazwa.
- source_word: ἐν τῷ στόματί σου
  choice: kinywani mwako
  rationale: Tafsiri ya moja kwa moja inayohifadhi taswira ya kiungo cha mwili katika dondoo.
- source_word: ἐν τῇ καρδίᾳ σου
  choice: moyoni mwako
  rationale: ‘Moyo’ ni tafsiri ya kawaida ya καρδία na huhifadhi maana ya ndani ya fikira na msimamo bila kuifafanua kupita kiasi.
- source_word: τοῦτ’ ἔστιν
  choice: Yaani, hilo ni
  rationale: ‘Yaani’ hutambulisha ufafanuzi wa Paulo kwa Kiswahili cha kawaida; ‘hilo ni’ huonyesha wazi kwamba anafafanua neno lililonukuliwa.
- source_word: τὸ ῥῆμα τῆς πίστεως
  choice: neno la imani
  rationale: Huhifadhi kurudiwa kwa ῥῆμα kama ‘neno’ na ufupi wenye uwezekano wa maana zaidi ya moja wa kiambishi cha Kigiriki katika ‘la imani’.
- source_word: πίστεως
  choice: imani
  rationale: ‘Imani’ ndiyo maana ya kawaida hapa; uwezekano wa ‘kutumaini’ au ‘uaminifu’ unawekwa katika tanbihi bila kuamua kimya kimya aina ya uhusiano katika kirai.
- source_word: ὃ κηρύσσομεν
  choice: tunalolitangaza
  rationale: Kitenzi hiki huwasilisha tendo la kutangaza ujumbe hadharani na kwa uwazi, bila kukifungia katika mazingira ya mahubiri ya ibadani pekee.
theological_decisions:
- issue: Maana ya πίστις katika τὸ ῥῆμα τῆς πίστεως
  choice: imani
  alternative: kutumaini; uaminifu
  rationale: Katika muktadha huu Paulo analitaja neno linalohusiana na imani, lakini muundo wa Kigiriki hauainishi wazi kama imani ndiyo yaliyomo, mwitikio unaotakiwa, au sifa ya ujumbe. ‘Neno la imani’ huhifadhi mvutano huo, na tanbihi hutaja maana nyingine za kileksia.
- issue: Uhusiano wa dondoo na Kumbukumbu la Torati 30:14
  choice: Kuhifadhi maneno ya dondoo na kueleza mwangwi wake katika tanbihi
  alternative: Kuingiza jina la Maandiko au Kumbukumbu la Torati katika matini kuu
  rationale: Kigiriki hakitaji kitabu kwa jina katika mstari huu. Tanbihi humsaidia msomaji kutambua dondoo bila kuongeza maelezo ndani ya matini.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Kinywani mwako’ na ‘moyoni mwako’ huhifadhi taswira ya dondoo; ‘tunalolitangaza’ ni wazi kwa wasomaji wa kawaida na huhifadhi wazo la tangazo la hadharani.
