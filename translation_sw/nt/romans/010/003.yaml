  text: ἀγνοοῦντες γὰρ τὴν τοῦ θεοῦ δικαιοσύνην, καὶ τὴν ⸀ἰδίαν ζητοῦντες στῆσαι, τῇ δικαιοσύνῃ τοῦ θεοῦ οὐχ ὑπετάγησαν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/003.yaml
  text: For[a], being ignorant of the righteousness of God and seeking to establish their own[b], they did not submit to the righteousness of God.
translation:
  language: sw
  text: Kwa maana, kwa kutokujua haki ya Mungu[a][b], na wakitafuta kuisimamisha haki yao wenyewe, hawakujitiisha kwa haki ya Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uadilifu.” Katika matumizi ya Paulo, neno hili linaweza kumaanisha haki, uadilifu, au njia ya Mungu ya kuwaweka watu sawa naye.
    reason: lexical_alternative
  - marker: b
    text: “Haki ya Mungu” inaweza pia kueleweka kuwa “haki inayotoka kwa Mungu” au “uadilifu wa Mungu.” Muundo wa Kigiriki unaruhusu zaidi ya maana moja inayokaribiana.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγνοοῦντες
  choice: kwa kuwa hawakuijua
  rationale: Muundo huu unaonyesha hali ya kisababishi inayofafanua kushindwa kwao, huku ukidumisha maana ya kutokujua au kutotambua bila kuifanya moja kwa moja kuwa kukataa kwa makusudi.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Kiunganishi hiki kinaonyesha kuwa mstari huu unaeleza sababu ya kauli iliyotangulia; “Kwa maana” ni ya kawaida na yenye hadhi katika Kiswahili.
- source_word: δικαιοσύνην / δικαιοσύνῃ
  choice: haki
  rationale: “Haki” ndilo neno la kawaida la Kiswahili linaloweza kubeba maana za righteousness na justice. Katika muktadha huu linaweza pia kuhusisha hali ya kukubaliwa kuwa sawa mbele za Mungu na njia yake ya kuwaweka watu sawa naye.
- source_word: τοῦ θεοῦ
  choice: ya Mungu
  rationale: “Ya Mungu” inadumisha kwa kiasi kikubwa utata wa hali ya umilikaji au chanzo katika Kigiriki, bila kulazimisha tafsiri ya “inayotoka kwa Mungu” wala “uadilifu wa Mungu” pekee.
- source_word: ἰδίαν
  choice: haki yao wenyewe
  rationale: Ingawa nomino “haki” imeachwa katika Kigiriki kwa sababu inaeleweka kutokana na kishazi kilichotangulia, kuirudia hapa kunafanya Kiswahili kiwe wazi na cha kawaida.
- source_word: ζητοῦντες
  choice: wakitafuta
  rationale: Hii inadumisha nguvu ya kitenzi cha wakati unaoendelea na ulinganifu wake na ἀγνοοῦντες, bila kuongeza nia isiyotajwa.
- source_word: στῆσαι
  choice: kuithibitisha
  rationale: Katika muktadha huu, kitenzi kina maana ya kuisimamisha au kuifanya ikubalike kama msingi halali. “Kuithibitisha” ni Kiswahili cha kawaida kinachowasilisha wazo la establish bila taswira ngumu ya “kuisimamisha.”
- source_word: ὑπετάγησαν
  choice: hawakujitiisha
  rationale: Ingawa umbo la Kigiriki ni la kutendwa, lina maana inayokaribia ya kati hapa. “Hawakujitiisha” ni ya kawaida na huonyesha kutokubali kuwa chini ya haki ya Mungu.
theological_decisions:
- issue: Maana ya “haki ya Mungu” katika matumizi ya Paulo
  choice: Maneno “haki ya Mungu” yamedumishwa bila kuamua kama yanamaanisha hasa haki iliyo sifa ya Mungu, haki inayotoka kwa Mungu, au tendo/njia yake ya wokovu inayowaweka watu sawa naye.
  alternative: haki inayotoka kwa Mungu; uadilifu wa Mungu; tendo la Mungu la haki katika kuokoa
  rationale: Muundo wa Kigiriki unaweza kubeba maana hizi zinazohusiana. Tafsiri kuu inadumisha mvutano huo wa kiteolojia badala ya kuchagua ufafanuzi mmoja wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Kuithibitisha haki yao wenyewe” limechaguliwa badala ya tafsiri ya neno kwa neno “kuisimamisha,” ambayo ingesikika ngumu katika Kiswahili. Alama zote za tanbihi zimewekwa baada ya kishazi cha kwanza “haki ya Mungu,” ambacho ndicho kinachohitaji ufafanuzi wa kileksika na wa kisarufi.
