id: ROM.10.12
reference: Romans 10:12
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οὐ γάρ ἐστιν διαστολὴ Ἰουδαίου τε καὶ Ἕλληνος, ὁ γὰρ αὐτὸς κύριος πάντων, πλουτῶν εἰς πάντας τοὺς ἐπικαλουμένους αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/012.yaml
  text: For there is no distinction between Jew and Greek[a], for the same Lord is Lord of all[b], being rich toward all who call on him.
translation:
  language: sw
  text: Kwa maana hakuna tofauti kati ya Myahudi na Mgiriki[a], kwa kuwa Bwana yuleyule ni Bwana wa wote[b], naye ni tajiri kwa wote wanaomwitia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kigiriki: “Mgiriki.” Hapa jozi ya “Myahudi na Mgiriki” inatumika kuonyesha Myahudi na asiye Myahudi. Tafsiri nyingine husema “Mataifa.”'
    reason: lexical_alternative
  - marker: b
    text: Au, “Bwana yuleyule ni juu ya wote.”
    reason: alternative_reading
lexical_decisions:
- source_word: διαστολή
  choice: tofauti
  rationale: Neno hili linaonyesha kutokuwepo kwa utenganisho au ubaguzi kati ya makundi haya katika muktadha; “tofauti” ni ya kawaida na haisemi zaidi ya chanzo.
- source_word: Ἰουδαίου ... Ἕλληνος
  choice: Myahudi ... Mgiriki
  rationale: Huhifadhi maneno halisi ya Kigiriki, huku tanbihi ikieleza kwamba jozi hii hapa inawakilisha tofauti ya Myahudi na asiye Myahudi.
- source_word: ὁ ... αὐτὸς κύριος πάντων
  choice: Bwana yuleyule ni Bwana wa wote
  rationale: Kurudia “Bwana” kunafanya kiarifu kilichodokezwa katika kishazi cha Kigiriki kuwa wazi kwa Kiswahili, na “wa wote” huhifadhi πάντων bila kuamua kimya kimya kati ya maana ya umiliki na mamlaka.
- source_word: κύριος
  choice: Bwana
  rationale: “Bwana” ni tafsiri ya kawaida ya cheo hiki cha Kikristo na huhifadhi uzito wake katika muktadha wa Waroma 10.
- source_word: πλουτῶν εἰς πάντας
  choice: ni mwingi wa ukarimu kwa wote
  rationale: Kiswahili cha moja kwa moja kama “akiwa tajiri kuelekea wote” si cha kawaida. Usemi huu huwasilisha wingi wa utoaji unaodokezwa na sitiari ya utajiri pamoja na mwelekeo wake kwa walengwa.
- source_word: τοὺς ἐπικαλουμένους αὐτόν
  choice: wote wanaomwitia
  rationale: “Kumwitia” ni usemi wa kawaida wa kibiblia na wa sasa kwa kumwomba au kumlingana Bwana kwa imani, na unaendana na mstari unaofuata.
theological_decisions:
- issue: Anayerejelewa na “Bwana”
  choice: Maandishi yanaacha cheo “Bwana” kisimame bila kuongeza jina; katika muktadha wa Waroma 10:9–13 kinaelekea kwa Yesu aliyekiriwa kuwa Bwana na pia kinahifadhi mwangwi wa andiko kuhusu kumwitia Bwana.
  alternative: Kuchukulia “Bwana” kuwa rejeo la jumla kwa Mungu bila kulihusisha wazi na Kristo.
  rationale: Kutotaja jina ndani ya tafsiri huhifadhi maneno ya chanzo na mvutano wake wa kikristolojia badala ya kuumaliza kwa ufafanuzi.
- issue: Upeo wa “wote”
  choice: “Wote” wanafaidika bila tofauti ya kikundi, lakini kishazi “wanaomwitia” kinabainisha wanaokusudiwa.
  alternative: Kuisoma “wote” kama kauli isiyo na sharti kuhusu kila mtu.
  rationale: Muundo wa Kigiriki unaunganisha πάντας moja kwa moja na τοὺς ἐπικαλουμένους αὐτόν; tafsiri huhifadhi upana wa mwaliko na sifa hiyo kwa pamoja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Ni mwingi wa ukarimu” huepuka tafsiri ngumu isiyo ya kawaida ya sitiari ya πλουτῶν, lakini huhifadhi wazo la wingi wa neema au utoaji bila kuongeza kitu kinachotolewa.
