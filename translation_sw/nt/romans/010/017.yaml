  yaml_path: translation/nt/romans/010/017.yaml
  text: So faith comes from hearing[a], and hearing through the word of Messiah.
translation:
  language: sw
  text: Basi, imani hutokana na kusikia, na kusikia hupatikana kwa njia ya neno la Masihi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “neno kuhusu Masihi” au “ujumbe unaomhusu Masihi.” Uhusiano wa umilikishi katika Kigiriki unaweza kueleweka kwa njia zaidi ya moja.
    reason: alternative_reading
lexical_decisions:
- source_word: ἄρα
  choice: Basi
  rationale: Ni kiunganishi cha hitimisho kinachounganisha mstari huu na hoja iliyotangulia; “Basi” ni ya kawaida na huhifadhi uhusiano huo wa kimantiki.
- source_word: πίστις
  choice: imani
  rationale: Katika muktadha wa Waroma 10:14–16, neno hili linaelekea kumaanisha mwitikio wa kumwamini Mungu baada ya kusikia ujumbe unaotangazwa.
- source_word: ἐξ ἀκοῆς
  choice: hutokana na kusikia
  rationale: ἐκ/ἐξ huonyesha chanzo; “hutokana na” hudokeza asili, huku “kusikia” kikihifadhi maana ya tendo au matokeo ya kusikia.
- source_word: ἡ δὲ ἀκοὴ
  choice: na kusikia
  rationale: δέ hapa inaendeleza hoja bila kuonyesha upinzani mkali, kwa hiyo “na” inafaa. Kurudia “kusikia” kunadumisha uhusiano wa maneno katika Kigiriki.
- source_word: διὰ ῥήματος
  choice: huja kwa njia ya neno
  rationale: διά pamoja na umilikishi huonyesha njia au chombo; “kwa njia ya” huitofautisha na ἐξ ya kishazi cha kwanza. “Neno” huhifadhi maana ya ῥῆμα kama neno au tamko lililonenwa.
- source_word: Χριστοῦ
  choice: la Masihi
  rationale: Χριστός limetafsiriwa kama cheo “Masihi.” Muundo “neno la Masihi” huhifadhi kwa kiasi kikubwa utata wa umilikishi wa Kigiriki.
theological_decisions:
- issue: Maana ya πίστις katika muktadha huu
  choice: imani
  alternative: tumaini au uaminifu
  rationale: Muktadha unazungumzia mwitikio wa mtu kwa ujumbe uliotangazwa; “imani” huwasilisha maana hiyo bila kulazimisha maana maalumu ya “uaminifu.”
- issue: Uhusiano wa Χριστοῦ na ῥήματος
  choice: neno la Masihi
  alternative: neno kuhusu Masihi / ujumbe unaomhusu Masihi
  rationale: Umilikishi wa Kigiriki unaweza kueleweka kuwa neno linalotoka kwa Masihi au neno linalomhusu Masihi. Tafsiri kuu inahifadhi muundo mpana, na tanbihi inaonyesha uwezekano mwingine.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wa heshima na unaoeleweka kwa wasomaji wa kawaida. Tofauti ya “hutokana na” na “kwa njia ya” inadumisha tofauti kati ya ἐξ na διά bila kufanya sentensi kuwa nzito.
