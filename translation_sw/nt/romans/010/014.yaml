id: ROM.10.14
reference: Romans 10:14
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Πῶς οὖν ⸀ἐπικαλέσωνται εἰς ὃν οὐκ ἐπίστευσαν; πῶς δὲ ⸀πιστεύσωσιν οὗ οὐκ ἤκουσαν; πῶς δὲ ⸀ἀκούσωσιν χωρὶς κηρύσσοντος;
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/014.yaml
  text: How then will they call on him in whom they have not believed? And how will they believe in him of whom they have not heard? And how will they hear without someone preaching?[a]
translation:
  language: sw
  text: Basi, watamwitiaje yule ambaye hawajamwamini? Nao watamwaminije yule ambaye hawajasikia habari zake?[a] Nao watasikiaje bila mtu kuhubiri?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nao watamwaminije yule ambaye hawajamsikia?”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πῶς οὖν
  choice: Basi, watamwitiaje
  rationale: “Basi” linahifadhi nguvu ya hitimisho ya οὖν, huku muundo wa “-je” ukitoa swali la balagha kwa Kiswahili cha kawaida.
- source_word: ἐπικαλέσωνται
  choice: watamwitiaje
  rationale: “Kumwitia” hapa ni kumwomba au kumwita Bwana ili kupata msaada/wokovu; wakati ujao unaonyesha vizuri nguvu ya subjunctive katika mfululizo huu wa maswali.
- source_word: εἰς ὃν οὐκ ἐπίστευσαν
  choice: yule ambaye hawajamwamini
  rationale: Kiswahili hakihitaji kuiga kihusishi εἰς neno kwa neno. “Kumwamini” ni usemi wa asili unaohifadhi mtu kama mlengwa wa imani.
- source_word: πιστεύσωσιν
  choice: watamwaminije
  rationale: “Kumwamini” huhifadhi lugha ya πιστεύω na uhusiano wa moja kwa moja na Kristo bila kuongeza ufafanuzi wa kiteolojia.
- source_word: οὗ οὐκ ἤκουσαν
  choice: yule ambaye hawajamsikia
  rationale: Hili linabaki karibu na uwezekano wa Kigiriki kwamba hawajamsikia yeye mwenyewe, huku tanbihi ikihifadhi uwezekano wa maana ya kusikia habari zinazomhusu.
- source_word: ἀκούσωσιν
  choice: watasikiaje
  rationale: “Kusikia” ndiyo maana ya msingi na inadumisha mnyororo wa hoja unaorudia tendo la kusikia.
- source_word: χωρὶς κηρύσσοντος
  choice: bila mtu kuhubiri
  rationale: Muundo huu unaonyesha tendo la kutangaza badala ya kudokeza cheo rasmi cha “mhubiri,” na ni wa kawaida katika Kiswahili.
theological_decisions:
- issue: Lugha ya πιστεύω / imani
  choice: kumwamini
  alternative: kumtumaini
  rationale: “Kumwamini” ndiyo tafsiri ya kawaida ya kitenzi πιστεύω na huhifadhi mnyororo wa msamiati wa Paulo bila kuamua kwa lazima kati ya kukubali kuwa kweli na kumtumaini binafsi.
- issue: Mhusika wa kusikia katika οὗ οὐκ ἤκουσαν
  choice: yule ambaye hawajamsikia
  alternative: yule ambaye hawajasikia habari zake
  rationale: Kiwakilishi cha Kigiriki katika hali ya genitive kinaweza kumaanisha kumsikia yeye au kusikia habari zinazomhusu. Matini kuu inahifadhi tafsiri iliyo karibu zaidi na muundo wa chanzo; tanbihi inaonyesha maana nyingine halali.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Maswali matatu ya balagha na mfululizo wa kuita, kuamini, kusikia, na kuhubiri vimehifadhiwa. “Mtu kuhubiri” huepuka kuingiza wazo la cheo rasmi lisilolazimishwa na participle ya Kigiriki.
