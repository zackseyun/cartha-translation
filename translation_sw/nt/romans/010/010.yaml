  yaml_path: translation/nt/romans/010/010.yaml
  text: For with the heart one believes unto righteousness[a], and with the mouth one confesses unto salvation.
translation:
  language: sw
  text: Kwa maana mtu huamini kwa moyo hata kupata haki[a], na hukiri kwa kinywa hata kupata wokovu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uadilifu.” Neno la Kigiriki δικαιοσύνη lina wigo unaoweza kujumuisha haki au uadilifu; katika maandishi ya Paulo, “haki” ndilo chaguo la kawaida.
    reason: lexical_alternative
lexical_decisions:
- source_word: καρδίᾳ
  choice: kwa moyo
  rationale: Dative hii inaonyesha moyo kama kitovu cha utu wa ndani na chombo cha kuamini; “kwa moyo” ni Kiswahili cha kawaida na kinadumisha ulinganifu na “kwa kinywa.”
- source_word: γὰρ
  choice: Kwa maana
  rationale: Kiunganishi hiki kinaeleza kauli iliyotangulia; “kwa maana” kinaonyesha uhusiano huo bila kuufafanua kupita kiasi.
- source_word: πιστεύεται
  choice: mtu huamini
  rationale: Umbo hili lina maana ya jumla. “Mtu huamini” ni la kawaida katika Kiswahili na linawasilisha tendo linalomhusu yeyote bila kulifanya kuwa kauli ya mtu maalumu.
- source_word: εἰς δικαιοσύνην
  choice: hata kupata haki
  rationale: εἰς inaonyesha mwelekeo au matokeo. “Hata kupata haki” ni ya asili katika Kiswahili na haibainishi kwa nguvu kupita kiasi jinsi kuamini kunavyohusiana na haki.
- source_word: δικαιοσύνην
  choice: haki
  rationale: “Haki” ndilo neno la kawaida la Kiswahili kwa δικαιοσύνη katika muktadha wa Paulo, nalo linaweza kubeba maana za kuwa sawa mbele za Mungu na kutenda yaliyo ya haki.
- source_word: στόματι
  choice: kwa kinywa
  rationale: Dative hii ni sambamba na καρδίᾳ na inaonyesha ungamo la nje kwa kusema; “kwa kinywa” huhifadhi ulinganifu wa sentensi.
- source_word: δὲ
  choice: na
  rationale: Hapa δέ inaunganisha vipengele viwili vinavyokamilishana, si vinavyopingana; “na” ni kiunganishi cha asili zaidi.
- source_word: ὁμολογεῖται
  choice: hukiri
  rationale: Katika muktadha wa mstari wa 9, kitenzi hiki kinamaanisha kukiri kwa wazi kwamba Yesu ni Bwana. “Hukiri” kinadumisha nguvu hiyo kuliko “hukubali.”
- source_word: εἰς σωτηρίαν
  choice: hata kupata wokovu
  rationale: Maneno haya ni sambamba na εἰς δικαιοσύνην na yanaonyesha mwelekeo au matokeo; tafsiri hii inadumisha ulinganifu huo.
- source_word: σωτηρίαν
  choice: wokovu
  rationale: “Wokovu” ni neno la kawaida na linalofaa kwa maana ya kisoteriolojia ya Paulo, bila kuifupisha kuwa ukombozi wa hali fulani tu.
theological_decisions:
- issue: Uhusiano wa kuamini na kukiri na haki na wokovu
  choice: 'Kudumisha kauli mbili sambamba: kuamini kwa moyo ni hata kupata haki, na kukiri kwa kinywa ni hata kupata wokovu.'
  alternative: Kufafanua kukiri kuwa ushahidi tu wa wokovu, au kuwa tendo la ziada linaloustahili wokovu.
  rationale: Kigiriki kina vifungu viwili sambamba vyenye εἰς. Tafsiri haipaswi kutatua mjadala kuhusu mpangilio wa wokovu au kugeuza kukiri kuwa kazi yenye kustahili malipo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo “mtu huamini … hukiri” ni wa kawaida na unahifadhi maana ya jumla pamoja na ulinganifu wa moyo na kinywa.
