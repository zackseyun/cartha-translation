id: ROM.10.18
reference: Romans 10:18
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἀλλὰ λέγω, μὴ οὐκ ἤκουσαν; μενοῦνγε· Εἰς πᾶσαν τὴν γῆν ἐξῆλθεν ὁ φθόγγος αὐτῶν, καὶ εἰς τὰ πέρατα τῆς οἰκουμένης τὰ ῥήματα αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/018.yaml
  text: 'But I ask[a], did they not hear? Indeed they did: “Their voice has gone out into all the earth[c][b], and their words to the ends of the inhabited world.”'
translation:
  language: sw
  text: 'Lakini nauliza: Je, hawakusikia? Naam, walisikia:


    “Sauti yao[a] imeenea duniani kote,[c]

    na maneno yao yamefika

    hadi miisho ya ulimwengu unaokaliwa.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mlio wao.”
    reason: lexical_alternative
  - marker: b
    text: Au kwa ufupi “ulimwengu”; Kigiriki ni “ulimwengu unaokaliwa.”
    reason: lexical_alternative
  - marker: c
    text: Paulo ananukuu Zaburi 19:4 na kutumia lugha yake kuhusu kuenea kwa ujumbe.
    reason: cross_reference
lexical_decisions:
- source_word: μὴ οὐκ ἤκουσαν
  choice: Je, hawakusikia?
  rationale: Muundo wa maswali wenye kanusho maradufu unatarajia jibu la ndiyo. Kiswahili cha kawaida huonyesha nguvu hiyo kwa swali hili la balagha.
- source_word: μενοῦνγε
  choice: Naam, walisikia
  rationale: Chembe hii ni jibu la mkazo linalothibitisha kwamba kwa kweli walisikia; kurudia kitenzi kunafanya maana iwe wazi na ya kawaida kwa Kiswahili.
- source_word: φθόγγος
  choice: Sauti
  rationale: Neno hili humaanisha sauti inayosikika. “Sauti” huhifadhi ushairi na ulinganifu wake na “maneno,” bila kuamua wazi msemaji ni nani.
- source_word: γῆ
  choice: duniani kote
  rationale: Katika nukuu hii yenye upeo wa ulimwengu mzima, “duniani kote” hutoa maana ya πᾶσαν τὴν γῆν kwa Kiswahili cha kawaida kuliko wazo la eneo maalumu.
- source_word: ἐξῆλθεν
  choice: imeenea
  rationale: Ingawa kitenzi cha Kigiriki kihalisi ni “ilitoka,” katika muktadha wa sauti inayofika kila mahali, “imeenea” ni Kiswahili cha asili na huonyesha matokeo yanayoendelea.
- source_word: πέρατα
  choice: miisho
  rationale: “Miisho” huhifadhi taswira ya kishairi ya sehemu za mbali kabisa na ulinganifu wa mistari hiyo miwili.
- source_word: οἰκουμένης
  choice: ulimwengu unaokaliwa
  rationale: Tafsiri hii huhifadhi kwa uwazi maana ya οἰκουμένη kuwa ulimwengu wenye wakazi, ingawa “ulimwengu” peke yake pia ingewezekana.
- source_word: ῥήματα
  choice: maneno
  rationale: “Maneno” ni tafsiri ya moja kwa moja na hudumisha ulinganifu na “sauti”; “ujumbe” ungeongeza ufafanuzi usiolazimishwa na Kigiriki.
theological_decisions:
- issue: Kirejeleo cha viwakilishi katika “sauti yao” na “maneno yao”
  choice: Kuhifadhi viwakilishi bila kutaja wanaorejelewa
  alternative: Kufafanua kuwa ni mbingu za Zaburi 19 au wahubiri/mitume katika matumizi ya Paulo
  rationale: Paulo ananukuu Zaburi 19:4 na kutumia lugha yake katika hoja yake. Kutotaja kirejeleo moja kwa moja huhifadhi utata na mvutano wa kimuktadha uliopo katika maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio wa mistari umehifadhi ulinganifu wa kishairi wa nukuu. “Naam” linafaa kwa jibu la mkazo bila kuwa la kizamani kupita kiasi.
