  text: For everyone who calls on the name of the Lord will be saved[a][b].
translation:
  language: sw
  text: Kwa maana kila mtu atakayeliitia jina la Bwana ataokolewa.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Paulo ananukuu Yoeli 2:32. Katika Yoeli, anayerejelewa ni YHWH (‘BWANA’); hapa muktadha unaonyesha kwamba Paulo anayatumia maneno hayo kumhusu Yesu.
    reason: cross_reference
  - marker: b
    text: Au, ‘yeyote atakayemwita.’ Usemi wa Kigiriki una maana ya kumwita au kumsihi Bwana kwa kulitaja jina lake.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶς ... ὃς ἂν
  choice: kila mtu atakaye-
  rationale: Muundo huu una maana ya jumla, ‘kila mtu ambaye’ au ‘yeyote.’ ‘Kila mtu atakaye-’ ni Kiswahili cha kawaida kinachoonyesha wazi kwamba ahadi inamhusu mtu yeyote bila kuashiria wanaume pekee.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Kiunganishi hiki kinatoa msingi wa Kimaandiko au ufafanuzi wa dai lililotangulia; ‘Kwa maana’ kinahifadhi uhusiano huo kwa lugha yenye heshima na ya kawaida.
- source_word: ἐπικαλέσηται
  choice: atakaliliitia
  rationale: Kitenzi hiki pamoja na ‘jina’ humaanisha kumwita au kumwomba Bwana kwa kutaja jina lake, kwa ombi, sala, au ungamo. ‘Kuliitia jina’ huhifadhi nahau ya kibiblia na maana ya kumwelekea Bwana kwa msaada.
- source_word: τὸ ὄνομα
  choice: jina
  rationale: Tafsiri ya moja kwa moja inadumisha usemi wa kibiblia unaohusu utambulisho na mamlaka ya yule anayeitwa.
- source_word: κυρίου
  choice: Bwana
  rationale: Maandishi ya Kigiriki yanasema ‘Bwana.’ Tafsiri haiongezi ‘Yesu’ katika mstari, ingawa muktadha wa Waroma 10 unaonyesha kuwa Paulo anatumia maneno haya kumhusu Yesu.
- source_word: σωθήσεται
  choice: ataokolewa
  rationale: Wakati ujao wa kutendwa unaonyesha wokovu atakaopokea mtu huyo. ‘Ataokolewa’ ni usemi wazi na wa kawaida katika muktadha wa wokovu wa Paulo.
theological_decisions:
- issue: Anayerejelewa kwa neno ‘Bwana’ katika nukuu ya Yoeli
  choice: Kudumisha ‘Bwana’ katika mstari bila kuongeza ‘Yesu,’ huku tanbihi ikieleza matumizi ya Paulo katika muktadha.
  alternative: BWANA; Bwana Yesu
  rationale: Kigiriki kina κυρίου, yaani ‘Bwana.’ Katika Yoeli anayerejelewa ni YHWH, na katika muktadha wa Waroma 10 Paulo anaitumia nukuu hii kumhusu Yesu. Kutodokeza zaidi katika mstari kunahifadhi maneno na mvutano wa kimuktadha wa chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Muundo ‘kuliitia jina la Bwana’ umehifadhiwa kwa sababu ni nahau muhimu ya kibiblia, huku tanbihi ikifafanua maana yake.
