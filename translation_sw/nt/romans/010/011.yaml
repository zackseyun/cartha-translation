lexical_decisions:
- source_word: λέγει
  choice: yanasema
  rationale: Wakati wa sasa katika kauli ya kunukuu umehifadhiwa kwa usemi wa kawaida wa Kiswahili; kitenzi kimepatana na nomino ya ngeli ya wingi ‘Maandiko’.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Kiunganishi hiki kinaonyesha kuwa nukuu hiyo inatoa msingi wa kauli iliyotangulia katika hoja ya Paulo.
- source_word: ἡ γραφή
  choice: Maandiko
  rationale: Katika kauli hii ya kunukuu, neno hilo linamaanisha Maandiko matakatifu; ‘Maandiko’ ni istilahi ya kawaida, yenye heshima, katika Kiswahili cha Biblia.
- source_word: Πᾶς ὁ πιστεύων
  choice: Kila mtu anayeamini
  rationale: Muundo huu una maana ya jumla na unamhusu yeyote anayeamini, si wanaume peke yao.
- source_word: πιστεύων
  choice: anayeamini
  rationale: Hili ni neno la kawaida na sahihi kwa tendo la kuamini, huku uelekeo wa imani kwa mtu ukionyeshwa na kiambishi cha yambwa katika ‘anayemwamini’.
- source_word: ἐπ’ αὐτῷ
  choice: -m- katika ‘anayemwamini’
  rationale: Kiswahili huonyesha kwa kawaida imani au utegemezi unaoelekezwa kwa mtu kwa kusema ‘kumwamini’; kiwakilishi hakijapanuliwa kwa jina ili kuhifadhi umbo la nukuu.
- source_word: καταισχυνθήσεται
  choice: hatatahayarishwa
  rationale: Hii huhifadhi wakati ujao na hali ya kutendwa, na inaonyesha kuaibishwa au kuvunjwa heshima hadharani badala ya hisia ya ndani pekee.
theological_decisions:
- issue: Maana ya kijumla ya Πᾶς ὁ πιστεύων
  choice: Kila mtu anayeamini
  alternative: Yeyote anayeamini
  rationale: Umoja wa kiume katika Kigiriki ni wa uwakilishi na hauwahusu wanaume pekee; tafsiri hii inaonyesha upeo wa wote bila kubadili maana.
- issue: Mrejelewa wa αὐτῷ
  choice: Kiwakilishi cha nafsi katika ‘anayemwamini’
  alternative: anayemwamini yeye
  rationale: Muktadha unaonyesha mrejelewa, lakini jina lake halijaingizwa ndani ya nukuu; hivyo utata wa kiwakilishi katika umbo la sentensi umehifadhiwa.
- issue: Nguvu ya kauli tendwa katika καταισχυνθήσεται
  choice: hatatahayarishwa
  alternative: hataaibika
  rationale: Kauli tendwa imehifadhiwa ili kuonyesha kutowekwa katika hali ya aibu au fedheha, bila kuifanya iwe hisia ya ndani tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Kwa maana’ huhifadhi mtiririko wa hoja; ‘Maandiko yanasema’ ni kauli asilia ya kunukuu maandiko matakatifu. Hakuna tanbihi iliyoongezwa kwa sababu ‘hatatahayarishwa’ huhifadhi vizuri kauli tendwa ya Kigiriki bila kuhitaji mbadala katika uchapishaji huu.
