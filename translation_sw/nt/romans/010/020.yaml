  text: Ἠσαΐας δὲ ἀποτολμᾷ καὶ λέγει· Εὑρέθην ⸀ἐν τοῖς ἐμὲ μὴ ζητοῦσιν, ἐμφανὴς ⸀ἐγενόμην τοῖς ἐμὲ μὴ ἐπερωτῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/020.yaml
  text: But Isaiah is very bold and says[a], “I was found by those who were not seeking me[b]; I became manifest to those who were not asking for me.”
translation:
  language: sw
  text: Lakini Isaya anathubutu kusema, “Nilipatikana[a] na wale ambao hawakuwa wakinitafuta; nikadhihirika[b] kwa wale ambao hawakuwa wakiniulizia.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nilipatikana miongoni mwa wale ambao hawakuwa wakinitafuta.”
    reason: lexical_alternative
  - marker: b
    text: Au, “nilikuwa dhahiri kwa wale ambao hawakuwa wakiniulizia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποτολμᾷ
  choice: ananena kwa ujasiri mkubwa
  rationale: Kitenzi hiki huonyesha kuthubutu au kusema kwa ujasiri; usemi huu ni wa asili katika Kiswahili na unaendeleza hali ya wakati uliopo katika utangulizi wa nukuu.
- source_word: Εὑρέθην
  choice: Nilipatikana
  rationale: Huhifadhi kauli tendwa ya nafsi ya kwanza na rejeleo la Mungu ndani ya nukuu.
- source_word: ἐν τοῖς ἐμὲ μὴ ζητοῦσιν
  choice: na wale ambao hawakuwa wakinitafuta
  rationale: Ingawa ἐν kimsingi inaweza kumaanisha ‘miongoni mwa,’ hapa inaeleweka kwa urahisi kama ikiwataja wale waliompata Mungu; uwezekano wa ‘miongoni mwa’ umehifadhiwa katika tanbihi.
- source_word: ζητοῦσιν
  choice: wakinitafuta
  rationale: ‘Kutafuta’ ni neno la kawaida, lenye hadhi, na huhifadhi uzito wa ζητέω.
- source_word: ἐμφανὴς ἐγενόμην
  choice: nilijidhihirisha
  rationale: Huwasilisha kwa Kiswahili cha asili wazo la kuonekana wazi au kuwa dhahiri bila kulifanya kuwa kauli ya jumla tu ya kujulikana.
- source_word: ἐπερωτῶσιν
  choice: wakiniulizia
  rationale: Huhifadhi maana ya kuuliza au kutaka habari kumhusu mtu, na huepuka kuingiza maana maalumu zaidi ya ‘kuniitia.’
- source_word: δὲ
  choice: Lakini
  rationale: Huonyesha tofauti na hoja au nukuu inayotangulia.
- source_word: Ἠσαΐας
  choice: Isaya
  rationale: Hili ndilo umbo la kawaida la jina hili katika Biblia na Kiswahili sanifu.
theological_decisions:
- issue: Jinsi ya kutafsiri kujidhihirisha kwa Mungu katika nukuu ya Isaya
  choice: nilijidhihirisha kwa wale ambao hawakuwa wakiniulizia
  alternative: nilikuwa dhahiri kwa wale ambao hawakuwa wakiniulizia
  rationale: ‘Nilijidhihirisha’ ni Kiswahili cha asili kinachoeleza ufunuo au kuonekana wazi kwa Mungu. Tanbihi huhifadhi umbo la karibu zaidi na muundo wa Kigiriki bila kufuta mvutano kati ya kujitokeza kwa Mungu na kutomtafuta kwa wanadamu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Ananena kwa ujasiri mkubwa’ linafaa kwa utangulizi rasmi wa nukuu ya kinabii; ‘wakiniulizia’ ni wazi kwa wasomaji wa kawaida bila kuingiza istilahi ya kimadhehebu.
