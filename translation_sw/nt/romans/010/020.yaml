  rationale: The revision more transparently renders the two Greek verbs introducing the citation and replaces the interpretive reflexive “nilijidhihirisha” with “nikadhihirika,” which corresponds closely to ἐμφανὴς ἐγενόμην. Footnote content is retained, with anchors moved to their relevant expressions.
