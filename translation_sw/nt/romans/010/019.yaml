  text: ἀλλὰ λέγω, μὴ ⸂Ἰσραὴλ οὐκ ἔγνω⸃; πρῶτος Μωϋσῆς λέγει· Ἐγὼ παραζηλώσω ὑμᾶς ἐπ’ οὐκ ἔθνει, ἐπ’ ἔθνει ἀσυνέτῳ παροργιῶ ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/019.yaml
  text: But I ask[a], did Israel not know? First Moses says, “I will make you jealous by what is not a nation[b]; by a nation without understanding I will provoke you to anger.”
translation:
  language: sw
  text: Lakini nauliza, je, Israeli hawakujua?[a] Kwanza Musa anasema, “Nitawatia wivu kwa watu wasio taifa[b]; kwa taifa lisilo na ufahamu nitawakasirisha.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “hawakuelewa?” Kitenzi cha Kiyunani kinaweza kumaanisha kujua au kuelewa; hapa huenda kinahusu kufahamu maana ya ujumbe waliousikia.
    reason: lexical_alternative
  - marker: b
    text: Nukuu kutoka Kumbukumbu la Torati 32:21. “Watu wasio taifa” huenda kinamaanisha watu wanaoonwa kuwa si taifa halisi, yaani, watu wa mataifa mengine.
    reason: cross_reference
lexical_decisions:
- source_word: μὴ Ἰσραὴλ οὐκ ἔγνω
  choice: je, Israeli hawakujua?
  rationale: “Kujua” linaakisi γινώσκω moja kwa moja na kuhifadhi uwezekano wa maana ya kuelewa; matumizi ya wingi yanaonyesha kuwa “Israeli” hapa ni watu wa Israeli.
- source_word: πρῶτος
  choice: Kwanza
  rationale: Linahifadhi kazi ya kielezi inayomtaja Musa kama shahidi wa kwanza katika mfululizo wa ushahidi wa Maandiko.
- source_word: Μωϋσῆς
  choice: Musa
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
- source_word: παραζηλώσω
  choice: Nitawatia wivu
  rationale: Ni usemi wa kawaida wa Kiswahili unaohifadhi maana sababishi ya kuwafanya wawe na wivu.
- source_word: ἐπ’ οὐκ ἔθνει
  choice: kwa kile ambacho si taifa
  rationale: Linahifadhi umoja na ukali wa usemi wa nukuu bila kumtambulisha anayerejelewa ndani ya matini.
- source_word: ἔθνει ἀσυνέτῳ
  choice: kwa taifa lisilo na ufahamu
  rationale: Linawakilisha kwa karibu ukosefu wa ufahamu unaoonyeshwa na ἀσύνετος bila kuufanya moja kwa moja kuwa hukumu pana ya upumbavu.
- source_word: παροργιῶ
  choice: nitawachochea mkasirike
  rationale: Linahifadhi maana sababishi ya kuchochea hasira na linaendana na wingi wa ὑμᾶς.
- source_word: ὑμᾶς
  choice: -wa- / m- (wingi)
  rationale: Viwakilishi vilivyomo katika vitenzi vinaonyesha wazi nafsi ya pili wingi.
theological_decisions:
- issue: Anayerejelewa na “kile ambacho si taifa” na “taifa lisilo na ufahamu”
  choice: Kuhifadhi maneno ya nukuu bila kumtaja anayerejelewa katika matini kuu.
  alternative: Kuyataja moja kwa moja mataifa mengine au watu ambao Israeli hawaoni kuwa taifa halisi.
  rationale: Paulo ananukuu Kumbukumbu la Torati 32:21; kudumisha usemi wa Maandiko kunahifadhi mvutano wa kitheolojia na kuepuka kuingiza ufafanuzi katika matini.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa swali la balagha umehifadhiwa, huku nukuu ikibaki karibu na taswira na ulinganifu wa Kiyunani.
