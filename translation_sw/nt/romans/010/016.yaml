id: ROM.10.16
reference: Romans 10:16
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀλλ’ οὐ πάντες ὑπήκουσαν τῷ εὐαγγελίῳ· Ἠσαΐας γὰρ λέγει· Κύριε, τίς ἐπίστευσεν τῇ ἀκοῇ ἡμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/016.yaml
  text: But not all obeyed the good news[a]. For Isaiah says, “Lord[b], who has believed our message?”
translation:
  language: sw
  text: Lakini si wote waliotii habari njema[a]. Kwa maana Isaya anasema, “Bwana, ni nani aliyeamini ujumbe wetu[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “injili.”
    reason: lexical_alternative
  - marker: b
    text: Au, “taarifa yetu”; neno kwa neno, “kusikia kwetu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Lakini
  rationale: Kiunganishi hiki kinaonyesha tofauti na hoja iliyotangulia kwa njia fupi na ya kawaida katika Kiswahili.
- source_word: οὐ πάντες
  choice: si wote
  rationale: 'Inahifadhi ukanushi wa sehemu: Paulo hasemi kwamba hakuna aliyetii, bali kwamba si wote waliotii.'
- source_word: ὑπήκουσαν
  choice: waliotii
  rationale: Kitenzi ὑπακούω kina maana ya kutii, si kusikia tu; tafsiri hii inadumisha uzito wa mwitikio unaodaiwa na habari njema.
- source_word: τῷ εὐαγγελίῳ
  choice: habari njema
  rationale: Hii ni maana ya moja kwa moja na inayoeleweka ya εὐαγγέλιον katika Kiswahili cha sasa; neno la kawaida la kimapokeo “injili” limetolewa katika tanbihi.
- source_word: Ἠσαΐας
  choice: Isaya
  rationale: Hili ndilo umbo la kawaida la jina la nabii katika Kiswahili.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Inaonyesha kwamba dondoo la Isaya linatoa msingi wa kauli iliyotangulia.
- source_word: λέγει
  choice: anasema
  rationale: Wakati wa sasa umehifadhiwa, kama ilivyo katika Kigiriki kinachowasilisha Maandiko yakisema sasa.
- source_word: Κύριε
  choice: Bwana
  rationale: Ni tafsiri ya kawaida, yenye heshima na ya moja kwa moja ya vocative κύριε.
- source_word: τίς
  choice: ni nani
  rationale: Ni namna ya kawaida ya kuuliza swali hili katika Kiswahili.
- source_word: ἐπίστευσεν
  choice: aliyeamini
  rationale: Katika swali hili la balagha, umbo hili la wakati uliopita linawasilisha kwa kawaida tendo la kuitikia ujumbe kwa imani.
- source_word: τῇ ἀκοῇ ἡμῶν
  choice: ujumbe wetu
  rationale: ἀκοή hapa inaweza kumaanisha jambo lililosikiwa, yaani taarifa au ujumbe uliotangazwa. “Ujumbe wetu” ni wazi kwa msomaji wa sasa huku maana nyingine zikionyeshwa katika tanbihi.
theological_decisions:
- issue: Aina ya mwitikio unaodaiwa na habari njema katika ὑπήκουσαν τῷ εὐαγγελίῳ
  choice: waliotii habari njema
  alternative: waliozisikiliza habari njema; waliozikubali habari njema
  rationale: Kigiriki kinatumia kitenzi cha kutii. Tafsiri hii inadumisha uhusiano anaouweka Paulo kati ya imani na mwitikio wa utii bila kuingiza mfumo fulani wa kimadhehebu kuhusu wokovu.
- issue: Maana ya ἀκοή katika dondoo la Isaya
  choice: ujumbe wetu
  alternative: taarifa yetu; kusikia kwetu
  rationale: Neno linaweza kumaanisha tendo la kusikia au yaliyosikiwa. Katika muktadha huu, maana ya ujumbe au taarifa ndiyo ya kawaida zaidi, lakini tanbihi inadumisha uwazi kuhusu upana wa neno la Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “si wote waliotii” umechaguliwa ili kuzuia kauli hiyo isieleweke kuwa hakuna mtu hata mmoja aliyetii. Alama za tanbihi zimewekwa baada ya maneno yanayohusika moja kwa moja.
