id: ROM.10.6
reference: Romans 10:6
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἡ δὲ ἐκ πίστεως δικαιοσύνη οὕτως λέγει· Μὴ εἴπῃς ἐν τῇ καρδίᾳ σου· Τίς ἀναβήσεται εἰς τὸν οὐρανόν; τοῦτ’ ἔστιν Χριστὸν καταγαγεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/006.yaml
  text: 'But the righteousness from faith speaks in this way: “Do not say in your heart[a], ‘Who will ascend into heaven?’” (that is[c][b], to bring Messiah down).'
translation:
  language: sw
  text: 'Lakini haki itokanayo na imani[a] husema hivi: “Usiseme moyoni mwako, ‘Ni nani atakayepanda kwenda mbinguni?’”[c] (yaani, kumshusha Masihi[b]).'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki linaweza kumaanisha “haki” au “uadilifu”; hapa “haki” huhifadhi upana huo wa maana.
    reason: lexical_alternative
  - marker: b
    text: 'Kigiriki: “Kristo”; limetafsiriwa “Masihi” hapa kwa sababu Χριστός linatumika kama cheo.'
    reason: lexical_alternative
  - marker: c
    text: Paulo anarejelea Kumbukumbu la Torati 30:12 na kuyatumia maneno hayo kumhusu Masihi.
    reason: cross_reference
lexical_decisions:
- source_word: δικαιοσύνη
  choice: haki
  rationale: ‘Haki’ ndilo neno la kawaida la Kiswahili linaloweza kubeba maana ya uadilifu ulio sawa mbele za Mungu na pia wazo la haki/uhak न्याय, hivyo linafaa kwa upana wa neno la Paulo katika muktadha huu.
- source_word: ἐκ πίστεως
  choice: itokanayo na imani
  rationale: Huwakilisha kwa uwazi wazo la chanzo katika ἐκ na kuhifadhi tofauti ya Paulo kati ya haki itokanayo na imani na haki inayotegemea sheria.
- source_word: οὕτως λέγει
  choice: husema hivi
  rationale: Ni Kiswahili cha sasa na cha asili kinachohifadhi wakati wa sasa na uhaishaji wa ‘haki’ kama msemaji.
- source_word: Μὴ εἴπῃς ἐν τῇ καρδίᾳ σου
  choice: Usiseme moyoni mwako
  rationale: Tafsiri ya karibu na ya kawaida inayohifadhi maana ya kusema ndani yako, katika kitovu cha fikira na nia.
- source_word: Τίς ἀναβήσεται εἰς τὸν οὐρανόν;
  choice: Ni nani atakayepanda kwenda mbinguni?
  rationale: ‘Atakayepanda kwenda’ huonyesha wazi mwendo wa juu unaodokezwa na ἀναβήσεται na kuelekea kunakoonyeshwa na εἰς.
- source_word: Χριστόν
  choice: Masihi
  rationale: Hapa Χριστός inafanya kazi kama cheo katika ufafanuzi wa Paulo wa Maandiko; ‘Masihi’ huhifadhi maana ya cheo hicho.
- source_word: καταγαγεῖν
  choice: kumshusha
  rationale: Kitenzi hiki cha Kiswahili kinaeleza kwa ufupi na kwa kawaida kumleta mtu kutoka juu kwenda chini.
theological_decisions:
- issue: Uhaishaji wa ‘haki itokanayo na imani’
  choice: Haki imehifadhiwa kama kiima kinachosema.
  alternative: ‘Hivi ndivyo inavyosemwa kuhusu haki itokanayo na imani.’
  rationale: Sarufi ya Kigiriki inaweka δικαιοσύνη kuwa kiima cha λέγει; kuhifadhi uhaishaji kunadumisha mtindo wa hoja ya Paulo.
- issue: Tafsiri ya Χριστός
  choice: Masihi
  alternative: Kristo
  rationale: Katika hoja hii inayotumia Maandiko, neno hilo linaonekana hasa kama cheo, si kama jina tu; ‘Masihi’ huwasilisha maana hiyo bila kuongeza fundisho la dhehebu.
- issue: Uhusiano wa swali na kifungu cha maelezo
  choice: ‘Yaani, kumshusha Masihi’ imeachwa kama ufafanuzi wa Paulo ndani ya mabano.
  alternative: Kuunganisha ufafanuzi huo moja kwa moja na swali bila mabano.
  rationale: Mabano yanaonyesha vizuri kwamba Paulo anafafanua maana ya kuuliza ni nani atakayepanda mbinguni, bila kuondoa mkazo au mvutano wa usemi wake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kimaandiko lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Itokanayo’ na ‘moyoni mwako’ huhifadhi muundo na mwangwi wa Maandiko bila kufanya sentensi kuwa nzito; ‘husema hivi’ ni ya asili zaidi kuliko ‘hunena kwa namna hii.’
