base_translation:
  language: en
  yaml_path: translation/nt/romans/010/007.yaml
  text: or[a], “Who will descend into the abyss?” (that is[b], to bring Messiah up from the dead).
translation:
  language: sw
  text: au, “Ni nani atakayeshuka kilindini[a]?” (yaani, kumleta Masihi[b] juu kutoka kwa wafu).
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kina kisichopimika.” Paulo anadokeza Kumbukumbu la Torati 30:13, lakini hapa anatumia “kilindi” na kuyahusisha maneno hayo na kumleta Masihi kutoka kwa wafu.
    reason: lexical_alternative
  - marker: b
    text: Kigiriki “Kristo”; limetafsiriwa “Masihi” hapa kwa sababu Χριστός linatumika kama cheo.
    reason: alternative_reading
lexical_decisions:
- source_word: ἤ
  choice: au
  rationale: Huanzisha upande wa pili wa maswali yanayotofautishwa; “au” ni tafsiri fupi na ya kawaida inayolingana na mtiririko wa Kigiriki.
- source_word: Τίς
  choice: Ni nani
  rationale: Hifadhi swali la moja kwa moja na la balagha kwa Kiswahili cha kawaida.
- source_word: καταβήσεται
  choice: atakayeshuka
  rationale: Huwasilisha tendo la wakati ujao na kudumisha picha ya mwendo wa kuelekea chini.
- source_word: εἰς τὴν ἄβυσσον
  choice: kilindini
  rationale: “Kilindi” huhifadhi wazo la kina kisichopimika bila kulifafanua kimadhehebu kuwa kaburi, kuzimu, au makao ya wafu.
- source_word: τοῦτ’ ἔστιν
  choice: yaani
  rationale: Ni kauli ya kawaida ya Kiswahili ya kuanzisha ufafanuzi, sawa na fomula ya Kigiriki.
- source_word: Χριστόν
  choice: Masihi
  rationale: Χριστός inafanya kazi hapa kama cheo cha Mtiwa-Mafuta, hivyo “Masihi” huhifadhi maana ya cheo badala ya kulitumia kama jina lililotoholewa.
- source_word: ἐκ νεκρῶν
  choice: kutoka kwa wafu
  rationale: Ni usemi wa kawaida na sahihi unaohifadhi rejeo la kutoka miongoni mwa waliokufa.
- source_word: ἀναγαγεῖν
  choice: kumleta ... juu
  rationale: Hudumisha picha ya kimahali ya ἀνάγω inayolingana na “kushuka”; “kumfufua” lingeweka wazi zaidi istilahi ya ufufuo kuliko kitenzi chenyewe.
theological_decisions:
- issue: Tafsiri ya Χριστός
  choice: Masihi
  alternative: Kristo
  rationale: Katika mstari huu neno hilo lina nguvu ya cheo. “Masihi” huonyesha maana ya Mtiwa-Mafuta bila kuligeuza kimyakimya kuwa jina.
- issue: Maana ya ἄβυσσος katika ufafanuzi wa Paulo
  choice: Kudumisha “kilindi” bila kukifafanua zaidi
  alternative: shimo lisilo na mwisho; makao ya wafu; kuzimu
  rationale: Paulo anatumia lugha ya picha inayorejelea Kumbukumbu la Torati 30 na kuihusisha na kumleta Masihi kutoka kwa wafu. “Kilindi” huhifadhi dokezo na mvutano huo bila kuufungia katika tafsiri moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Muundo wa swali la balagha na picha zinazokinzana za kushuka na kuletwa juu zimehifadhiwa.
