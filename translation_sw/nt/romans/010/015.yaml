  text: πῶς δὲ ⸀κηρύξωσιν ἐὰν μὴ ἀποσταλῶσιν; ⸀καθὼς γέγραπται· Ὡς ὡραῖοι οἱ πόδες τῶν ⸀εὐαγγελιζομένων ⸀τὰ ἀγαθά.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/015.yaml
  text: And how are they to proclaim unless they are sent? As it is written[b][a], “How beautiful are the feet of those who bring good news of good things!”
translation:
  language: sw
  text: 'Na watawezaje kutangaza wasipotumwa? Kama ilivyoandikwa: “Jinsi miguu ya wale wanaoleta habari njema za mambo mema ilivyo mizuri!”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Jinsi miguu ... inavyopendeza!” Neno la Kiyunani linaweza kumaanisha uzuri, na pia kudokeza kuwasili kwa mjumbe kunakokaribishwa au kunakofaa kwa wakati.
    reason: lexical_alternative
lexical_decisions:
- source_word: κηρύξωσιν
  choice: kutangaza
  rationale: Kitenzi hiki humaanisha kutoa tangazo hadharani. ‘Kutangaza’ kinahifadhi maana pana bila kuiwekea mipaka ya mahubiri rasmi.
- source_word: ἀποσταλῶσιν
  choice: hawajatumwa
  rationale: Hii ni hali ya kutendwa na inaonyesha kwamba wajumbe hutumwa na mwingine; tafsiri hii ni ya moja kwa moja na ya kawaida.
- source_word: καθὼς γέγραπται
  choice: Kama ilivyoandikwa
  rationale: Ni kauli ya kawaida ya kuanzisha nukuu ya Maandiko.
- source_word: ὡραῖοι
  choice: mizuri
  rationale: Neno linaweza kueleza uzuri au kupendeza kwa kuwasili kwa wakati unaofaa. ‘Mizuri’ huhifadhi taswira ya nukuu, huku kidokezo cha chini kikionyesha maana nyingine zinazowezekana.
- source_word: πόδες
  choice: miguu
  rationale: Taswira halisi ya miguu ya wajumbe imehifadhiwa badala ya kufafanuliwa katika matini kuu.
- source_word: εὐαγγελιζομένων
  choice: wale wanaoleta habari njema
  rationale: Kirai hiki kinaeleza kutangaza habari njema; ‘kuleta habari njema’ kinaafikiana na taswira ya wajumbe wanaowasili.
- source_word: τὰ ἀγαθά
  choice: za mambo mema
  rationale: Kirai cha Kiyunani kinamaanisha kihalisi ‘mambo mema’; tafsiri hii haikifanyi kuwa marudio tu ya ‘habari njema’.
theological_decisions:
- issue: Uhusiano wa nukuu kuhusu wajumbe na utangazaji wa injili
  choice: Kuhifadhi taswira ya wajumbe wanaotumwa na kutangaza habari njema bila kuifungamanisha na mahubiri ya viongozi waliowekwa rasmi pekee.
  alternative: Kutafsiri kwa maneno yanayoelekeza hasa kwenye kuhubiri injili katika huduma rasmi.
  rationale: Mtiririko wa hoja ya Paulo unahusu kutumwa na kutangaza, lakini nukuu yenyewe inashangilia kuwasili kwa wanaoleta habari njema. Tafsiri haiongezi cheo maalumu cha kikanisa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa swali na taswira ya miguu umehifadhiwa; lugha ya kitaalamu ya kikanisa imeepukwa.
