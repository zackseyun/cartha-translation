  source_fidelity: 'Tafsiri inawakilisha kwa uaminifu vipashio vya Kigiriki: mwito Ἀδελφοί umehifadhiwa kwa “Ndugu”; εὐδοκία τῆς ἐμῆς καρδίας kwa “hamu ya moyo wangu”; δέησις πρὸς τὸν θεὸν ὑπὲρ αὐτῶν kwa “ombi langu kwa Mungu kwa ajili yao”; na εἰς σωτηρίαν kwa “kwamba waokolewe.” Kiwakilishi “yao” kinadumisha utegemezi wa muktadha wa awali bila kuingiza “Israeli” katika matini. Utoaji wa εἰς σωτηρίαν kwa kishazi cha lengo ni sahihi na hauongezi msimamo wa kiteolojia.'
