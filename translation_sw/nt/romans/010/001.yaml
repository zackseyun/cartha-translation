  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἀδελφοί, ἡ μὲν εὐδοκία τῆς ἐμῆς καρδίας καὶ ἡ ⸀δέησις πρὸς τὸν θεὸν ὑπὲρ ⸀αὐτῶν εἰς σωτηρίαν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/001.yaml
  text: Brothers[a], the desire of my heart and my prayer to God for them is for their salvation.
translation:
  language: sw
  text: Ndugu[a], hamu ya moyo wangu na ombi langu kwa Mungu kwa ajili yao ni kwamba waokolewe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki liko katika wingi wa kiume, lakini linaweza kuelekezwa kwa kundi lenye wanaume na wanawake.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδελφοί
  choice: Ndugu
  rationale: Ni mwito wa kawaida na wenye heshima katika Kiswahili kwa washiriki wa jumuiya. Tofauti na Kigiriki, nomino ya Kiswahili “ndugu” haionyeshi jinsia, kwa hiyo inaweza kuwahusu wanaume na wanawake bila kupoteza maana ya mwito huo.
- source_word: εὐδοκία
  choice: hamu
  rationale: Katika muktadha huu neno linaonyesha jambo ambalo Paulo analitamani kwa dhati. “Hamu” ni ya kawaida na huepuka maana hasi ambayo “tamaa” inaweza kuwa nayo.
- source_word: τῆς ἐμῆς καρδίας
  choice: ya moyo wangu
  rationale: Inahifadhi uhusiano wa kimilikishi wa Kigiriki kwa njia ya kawaida katika Kiswahili.
- source_word: δέησις
  choice: ombi
  rationale: Neno hili ni ombi la dhati linaloelekezwa kwa Mungu. “Ombi” linatunza wazo la kusihi kwa uwazi zaidi kuliko neno pana “sala.”
- source_word: πρὸς τὸν θεόν
  choice: kwa Mungu
  rationale: Katika kishazi “ombi langu kwa Mungu,” kihusishi hiki kinaonyesha anayeelekezewa ombi kwa Kiswahili cha kawaida.
- source_word: ὑπὲρ αὐτῶν
  choice: kwa ajili yao
  rationale: Hutoa maana ya kuwaombea au kutafuta mema yao bila kuingiza jina la kundi ambalo Kigiriki hulitaja kwa kiwakilishi tu.
- source_word: εἰς σωτηρίαν
  choice: ni kwamba waokolewe
  rationale: εἰς inaonyesha lengo la hamu na ombi. Muundo huu ni wa asili katika Kiswahili na unaonyesha kwamba wokovu unaokusudiwa ni wao.
- source_word: μὲν
  choice: haijatafsiriwa kwa neno maalumu
  rationale: Hapa μόριο hiki kina kazi nyepesi ya kimtindo na hakifuatiwi na δέ iliyo wazi katika mstari huu. Kukitafsiri kwa neno maalumu kungefanya sentensi iwe nzito bila kuongeza maana muhimu.
theological_decisions:
- issue: Mwito wenye umbo la wingi wa kiume Ἀδελφοί
  choice: Ndugu
  alternative: Ndugu wa kiume na wa kike
  rationale: Kigiriki kimetumia umbo la wingi wa kiume ambalo kwa kawaida lingeweza kulihusu kusanyiko lenye wanaume na wanawake. Kiswahili hakina umbo la kijinsia linalolingana nalo katika neno “ndugu”; kwa hiyo “Ndugu” ndilo chaguo la kawaida na sahihi, huku ufafanuzi wa upeo wake ukitolewa katika tanbihi.
- issue: Lengo la ombi katika εἰς σωτηρίαν
  choice: kwamba waokolewe
  alternative: kwa ajili ya wokovu wao
  rationale: Chaguo hili linaeleza lengo la ombi bila kubainisha zaidi namna au wakati wa wokovu, hivyo haliondoi mvutano wa kiteolojia wa muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Ulinganifu wa “hamu ... na ombi ...” umehifadhiwa, na kiwakilishi “yao” kimeachwa ili kutotaja wazi kundi ambalo katika Kigiriki linategemea muktadha uliotangulia.
