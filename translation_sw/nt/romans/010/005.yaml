  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Μωϋσῆς γὰρ γράφει ⸂ὅτι τὴν δικαιοσύνην τὴν ἐκ ⸀τοῦ νόμου⸃ ὁ ⸀ποιήσας ἄνθρωπος ζήσεται ἐν ⸀αὐτῇ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/005.yaml
  text: 'For Moses writes about the righteousness that is from the law: the man who does these things will live by them[a][b][c].'
translation:
  language: sw
  text: 'Kwa maana Musa anaandika kuhusu haki itokayo katika Sheria: “Mtu atendaye hayo ataishi kwa hiyo.”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uadilifu” badala ya “haki.”
    reason: lexical_alternative
  - marker: b
    text: Au, “ataishi katika hiyo.” Kigiriki kina kiwakilishi cha umoja; Paulo hapa ananukuu Walawi 18:5, ambako mwangwi wake unahusu maagizo yanayotendwa.
    reason: alternative_reading
lexical_decisions:
- source_word: γὰρ
  choice: Kwa maana
  rationale: Huonyesha uhusiano wa maelezo na hoja iliyotangulia; ni kiunganishi cha kawaida na cha asili katika Kiswahili.
- source_word: γράφει
  choice: anaandika
  rationale: Wakati uliopo katika utangulizi wa nukuu umehifadhiwa na unaonyesha ushuhuda wa Maandiko unaoendelea.
- source_word: δικαιοσύνην
  choice: haki
  rationale: Katika Kiswahili, “haki” hubeba kwa ufupi maana za kuwa sawa mbele za Mungu na uadilifu; hapa inadumisha uhusiano na tofauti ya Paulo kati ya haki itokayo katika Sheria na haki itokayo katika imani.
- source_word: τὴν ἐκ τοῦ νόμου
  choice: itokayo katika Sheria
  rationale: “Itokayo” huhifadhi wazo la chanzo katika ἐκ, na “Sheria” humaanisha Sheria ya Musa katika muktadha huu.
- source_word: ὁ ποιήσας ἄνθρωπος
  choice: Mtu anayefanya
  rationale: ἄνθρωπος hapa humwakilisha mwanadamu yeyote, si mwanamume pekee; “mtu” ni sahihi kijinsia na ya kawaida katika Kiswahili. Kauli ya wakati uliopo huwasilisha kanuni ya jumla ya kutenda.
- source_word: ζήσεται
  choice: ataishi
  rationale: Huhifadhi kauli ya wakati ujao na mwangwi wa Walawi 18:5.
- source_word: ἐν αὐτῇ
  choice: kwa hayo
  rationale: Huwasilisha kwa Kiswahili maana ya kuishi kwa kuyatenda mambo yanayotakiwa, huku tafsiri ya karibu zaidi “ndani yake” ikihifadhiwa katika tanbihi.
theological_decisions:
- issue: Maana ya δικαιοσύνη katika tofauti ya Paulo
  choice: haki
  alternative: uadilifu
  rationale: “Haki” ni neno la kawaida la kitheolojia katika Kiswahili na huunganisha kifungu hiki na hoja ya Paulo kuhusu haki na imani bila kuifungia maana katika tabia ya kimaadili pekee.
- issue: Nguvu ya uwakilishi ya ἄνθρωπος
  choice: mtu
  alternative: mwanadamu
  rationale: Ingawa nomino ya Kigiriki ni ya umoja na kimaumbo ya kiume, hapa inamhusu mtu yeyote. Kiswahili “mtu” huhifadhi umoja na maana jumuishi bila kuingiza dai kwamba ni mwanamume tu.
- issue: Maana ya ἐν αὐτῇ katika mwangwi wa Walawi 18:5
  choice: kwa hayo
  alternative: ndani yake
  rationale: “Kwa hayo” huonyesha uhusiano kati ya kutenda yanayoagizwa na kuishi, kama katika muktadha wa Walawi 18:5. Hata hivyo, umbo la Kigiriki ni la umoja, kwa hiyo tafsiri rasmi zaidi imeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imewekwa kwa mtindo wa kawaida wa nukuu ya Maandiko. “Sheria” imeandikwa kwa herufi kubwa ili kuonyesha Sheria ya Musa inayojulikana katika muktadha.
