reference: Romans 10:9
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὅτι ἐὰν ⸀ὁμολογήσῃς ἐν τῷ στόματί ⸀σου κύριον Ἰησοῦν, καὶ πιστεύσῃς ἐν τῇ καρδίᾳ σου ὅτι ὁ θεὸς αὐτὸν ἤγειρεν ἐκ νεκρῶν, σωθήσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/009.yaml
  text: because if you confess with your mouth that Jesus is Lord[a], and believe in your heart that God raised him from the dead, you will be saved.
translation:
  language: sw
  text: kwa sababu ukikiri kwa kinywa chako kwamba Yesu ni Bwana[a], na kuamini moyoni mwako kwamba Mungu alimfufua kutoka kwa wafu, utaokolewa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ukimkiri Yesu kuwa Bwana.” Kirai cha Kigiriki κύριον Ἰησοῦν kinaweza pia kutafsiriwa kwa muundo huu mfupi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: kwa sababu
  rationale: Katika muktadha huu neno hili linaeleza msingi wa kauli iliyotangulia; “kwa sababu” linaonyesha uhusiano huo wa kisababu kwa Kiswahili cha kawaida.
- source_word: ἐὰν
  choice: uki-
  rationale: Muundo wa masharti wa Kiswahili “ukikiri ... na kuamini” unawakilisha kwa kawaida ἐὰν pamoja na vitenzi vya hali tegemezi.
- source_word: ὁμολογήσῃς
  choice: ukikiri
  rationale: “Kukiri” huhifadhi maana ya kutamka wazi na kukubali hadharani ukweli au utii, bila kuongeza maelezo yasiyomo katika maandishi.
- source_word: ἐν τῷ στόματί σου
  choice: kwa kinywa chako
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaoonyesha chombo cha kukiri kwa maneno, huku ukidumisha taswira ya chanzo.
- source_word: κύριον Ἰησοῦν
  choice: kwamba Yesu ni Bwana
  rationale: Muundo huu unaweka wazi maudhui ya ungamo na kuhifadhi “Bwana” kama cheo cha κύριος.
- source_word: πιστεύσῃς
  choice: kuamini
  rationale: “Kuamini” ni tafsiri ya moja kwa moja na ya kawaida inapofuatwa na maudhui yanayoaminiwa.
- source_word: ἐν τῇ καρδίᾳ σου
  choice: moyoni mwako
  rationale: Usemi huu huhifadhi maana ya usadikisho wa ndani na ni wa asili katika Kiswahili.
- source_word: ὁ θεὸς αὐτὸν ἤγειρεν
  choice: Mungu alimfufua
  rationale: Wakati uliopita wa “alimfufua” unawakilisha aoristi, na kiambishi “-m-” kinarejelea Yesu kwa uwazi.
- source_word: ἐκ νεκρῶν
  choice: kutoka kwa wafu
  rationale: Huu ni usemi wa kibiblia unaoeleweka kwa ufufuo kutoka miongoni mwa waliokufa, bila kuubadili kuwa “kutoka mautini,” ambao ungepunguza rejeo la watu wafu.
- source_word: σωθήσῃ
  choice: utaokolewa
  rationale: Huu ni wakati ujao wa hali ya kutendwa na huhifadhi maana ya wokovu katika muktadha wa Paulo.
theological_decisions:
- issue: Tafsiri ya κύριος katika ungamo
  choice: Bwana
  alternative: Mkuu
  rationale: “Bwana” huhifadhi mamlaka ya cheo hiki pamoja na mwangwi wake wa Kimaandiko katika muktadha, bila kuifinya kuwa maana ya “Mkuu” pekee.
- issue: Muundo wa ungamo κύριον Ἰησοῦν
  choice: kwamba Yesu ni Bwana
  alternative: Yesu kuwa Bwana
  rationale: Muundo uliochaguliwa unaonyesha wazi kwamba huu ndio ujumbe unaokiriwa; tanbihi inadumisha uwezekano wa muundo mfupi zaidi.
- issue: Nguvu ya kisoteriolojia ya σωθήσῃ
  choice: utaokolewa
  alternative: utaokoswa
  rationale: “Utaokolewa” ni Kiswahili cha sasa, chenye hadhi, na kinadumisha maana pana ya wokovu bila kuongeza maelezo ya kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi umehifadhi uhusiano wa kisababu na sharti, huku “moyoni mwako” ikitumiwa badala ya muundo mzito “katika moyo wako.”
