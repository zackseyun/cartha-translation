  text: τέλος γὰρ νόμου Χριστὸς εἰς δικαιοσύνην παντὶ τῷ πιστεύοντι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/004.yaml
  text: For Messiah is the end of the law for righteousness to everyone who believes[a][b].
translation:
  language: sw
  text: Kwa maana Masihi ndiye mwisho[a] wa Sheria, kwa ajili ya haki[b] kwa kila anayeamini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “lengo,” “kilele,” au “utimilifu.” Neno la Kigiriki lililotafsiriwa “mwisho” linaweza kumaanisha kukoma, lengo, au kufikia kilele.
    reason: alternative_reading
  - marker: b
    text: Au, “uadilifu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τέλος
  choice: mwisho
  rationale: Neno “mwisho” linahifadhi ufupi na utata halisi wa τέλος, ambalo linaweza kuonyesha kukoma, lengo, au kilele; maana mbadala zimeelezwa katika tanbihi.
- source_word: νόμου
  choice: Sheria
  rationale: Katika muktadha wa hoja ya Paulo kuhusu Israeli, neno hili linarejelea Sheria ya Musa kama jambo linalojulikana; herufi kubwa husaidia kuonyesha rejeo hilo.
- source_word: Χριστὸς
  choice: Masihi
  rationale: Hapa Χριστός linafanya kazi kama cheo kinachomhusisha Yesu na Sheria na tumaini la agano la Israeli, hivyo “Masihi” linaonyesha maana ya cheo hicho waziwazi.
- source_word: εἰς δικαιοσύνην
  choice: ili kuleta haki
  rationale: εἰς linaweza kuonyesha kusudi au matokeo. Usemi huu ni wa kawaida katika Kiswahili na unahifadhi mwelekeo huo bila kuamua kama ni kusudi pekee au matokeo pekee.
- source_word: δικαιοσύνην
  choice: haki
  rationale: “Haki” ndilo neno la kawaida na pana la Kiswahili kwa δικαιοσύνη katika muktadha huu; linaweza kuhusisha hali ya kuwa sawa mbele za Mungu na wazo la kutenda yaliyo ya haki.
- source_word: παντὶ τῷ πιστεύοντι
  choice: kwa kila anayeamini
  rationale: Tafsiri hii inahifadhi hali ya kushiriki ya πιστεύοντι na inasisitiza bila ubaguzi kwamba dai hilo linamhusu kila mwenye kuamini.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Kiunganishi hiki kinaonyesha kuwa mstari huu unatoa sababu au ufafanuzi wa hoja iliyotangulia.
theological_decisions:
- issue: Maana ya τέλος νόμου kuhusu Sheria ya Musa
  choice: “mwisho” katika maandishi makuu
  alternative: “lengo,” “kilele,” au “utimilifu”
  rationale: τέλος linaweza kuwa na maana ya kukoma na pia ya lengo au kilele. Kutumia “mwisho” na kuweka maana nyingine katika tanbihi kunahifadhi mvutano huo badala ya kuutatua kimadhehebu.
- issue: Tafsiri ya Χριστός
  choice: Masihi
  alternative: Kristo
  rationale: Muktadha unasisitiza cheo cha Yesu katika uhusiano na Israeli, Sheria, na ahadi za agano; kwa hiyo maana ya cheo imewekwa wazi.
- issue: Tafsiri ya δικαιοσύνη
  choice: haki
  alternative: uadilifu
  rationale: “Haki” ni tafsiri ya kawaida yenye upana unaofaa katika matumizi ya Paulo. “Uadilifu” umetajwa katika tanbihi kwa kuwa unaweza kuonyesha upande mwingine wa maana ya neno hilo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni fupi na inasomeka kwa urahisi; “Sheria” limetumiwa kama rejeo la Sheria ya Musa. Tanbihi zinahifadhi utata wa τέλος na upana wa δικαιοσύνη.
