- from: Kwa maana Masihi ndiye mwisho[a] wa Sheria, ili kuleta haki[b] kwa kila anayeamini.
  to: Kwa maana Masihi ndiye mwisho[a] wa Sheria, kwa ajili ya haki[b] kwa kila anayeamini.
  rationale: The revision removes the added verb “kuleta” and avoids making εἰς exclusively purposive. It retains the deliberate ambiguity of τέλος through the existing footnote and keeps “haki” as a broad, natural Swahili rendering of δικαιοσύνη while giving “uadilifu” as an alternative without an overly restrictive explanation.
  reviewer_model: gpt-5.6-terra
