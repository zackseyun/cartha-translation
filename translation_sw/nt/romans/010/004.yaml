review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders γάρ, Χριστός, τέλος, νόμου, and the universal participial phrase. However, “ili kuleta haki” recasts εἰς δικαιοσύνην as an explicit purpose infinitive and adds the causative verb “kuleta,” which is not present in the Greek. A more closely corresponding Swahili phrase should retain the compressed relation of righteousness being for every believer.
  naturalness: The revised sentence is formal but clear, natural Standard East African Swahili appropriate to a biblical translation. “Kwa ajili ya haki kwa kila anayeamini” preserves the compact structure without adding a theological mechanism such as being declared righteous.
  terminology: “Masihi,” “Sheria,” “mwisho,” and “haki” are suitable. The τέλος footnote properly preserves the major lexical ambiguity. The δικαιοσύνη footnote should offer “uadilifu” without reducing the term to ethical conduct, since in this Pauline context it can denote righteousness/status as well as justice.
  issues:
  - severity: medium
    issue: “ili kuleta haki” adds a causative-purpose formulation.
    rationale: The Greek has εἰς δικαιοσύνην, not a verb meaning “bring.” The draft wording narrows the purpose/result ambiguity and makes Messiah explicitly the agent who brings righteousness.
  - severity: low
    issue: Footnote b explains δικαιοσύνη too narrowly as ethical action.
    rationale: “Kutenda yaliyo ya haki” does not adequately preserve the Pauline range of δικαιοσύνη, which may include righteousness or right standing as well as justice.
  revised_text: Kwa maana Masihi ndiye mwisho[a] wa Sheria, kwa ajili ya haki[b] kwa kila anayeamini.
  revised_footnotes:
  - marker: a
    text: Au, “lengo,” “kilele,” au “utimilifu.” Neno la Kigiriki lililotafsiriwa “mwisho” linaweza kumaanisha kukoma, lengo, au kufikia kilele.
    reason: alternative_reading
  - marker: b
    text: Au, “uadilifu.”
    reason: lexical_alternative
  revision_rationale: The revision removes the added verb “kuleta” and avoids making εἰς exclusively purposive. It retains the deliberate ambiguity of τέλος through the existing footnote and keeps “haki” as a broad, natural Swahili rendering of δικαιοσύνη while giving “uadilifu” as an alternative without an overly restrictive explanation.
