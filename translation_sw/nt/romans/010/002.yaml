  text: For I testify about them that they have zeal for God[a], but not according to knowledge[b],
translation:
  language: sw
  text: Kwa maana ninatoa ushahidi juu yao kwamba wana bidii kwa ajili ya Mungu[a], lakini si kulingana na ujuzi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wana bidii ya Mungu”; muundo wa Kigiriki unaweza kutafsiriwa hivyo kwa karibu zaidi, lakini hapa yaelekea unamaanisha bidii inayoelekezwa kwa Mungu.
    reason: lexical_alternative
  - marker: b
    text: Au “si kwa ujuzi kamili,” au “bidii hiyo haitegemei ujuzi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μαρτυρῶ
  choice: ninawashuhudia
  rationale: Kitenzi hiki kinahifadhi nguvu ya Paulo kutoa ushuhuda kuhusu wao; muundo wenye kiambishi -wa- unasomeka kwa kawaida katika Kiswahili kama kuwashuhudia kuhusu hali yao.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Inaonyesha kuwa kauli hii inaeleza au kuthibitisha hoja ya mstari uliotangulia.
- source_word: αὐτοῖς
  choice: -wa- katika “ninawashuhudia”
  rationale: Dativu hapa inawahusu watu ambao Paulo anawatolea ushuhuda, si wapokeaji wa ujumbe tu.
- source_word: ζῆλον
  choice: bidii
  rationale: “Bidii” ni neno la kawaida na lenye heshima linaloonyesha juhudi na shauku kubwa ya kidini bila kuzidisha maana.
- source_word: θεοῦ
  choice: kwa ajili ya Mungu
  rationale: 'Inaonyesha uwezekano mkubwa wa genitivi ya kitu kinachoelekezewa: bidii yao inaelekezwa kwa Mungu. Tanbihi inahifadhi uwezekano wa tafsiri ya karibu zaidi na muundo wa Kigiriki.'
- source_word: ἔχουσιν
  choice: wana
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja ya wakati uliopo.
- source_word: ἀλλ’
  choice: lakini
  rationale: Inabainisha wazi tofauti kati ya kuwepo kwa bidii na ukosefu wa ujuzi unaofaa.
- source_word: οὐ κατ’ ἐπίγνωσιν
  choice: si kulingana na ujuzi
  rationale: Inahifadhi kwa kiasi kikubwa muundo wa κατά pamoja na maana ya ujuzi, bila kuamua kimyakimya kuwa ni “ujuzi kamili” au “ujuzi wa kweli.”
theological_decisions:
- issue: Asili na mwelekeo wa bidii ya Israeli
  choice: Bidii yao inaelekezwa kwa Mungu, lakini hailingani na ujuzi.
  alternative: Wana bidii ya Mungu, au wana bidii ya kidini bila kutaja inakoelekezwa.
  rationale: 'Muktadha unapendelea kuelewa ζῆλον θεοῦ kuwa bidii inayoelekezwa kwa Mungu. Tafsiri hii inahifadhi mvutano wa andiko: Paulo anakubali unyofu na nguvu ya bidii yao, huku akikataa kwamba bidii hiyo inaongozwa na ujuzi unaofaa.'
- issue: Kiwango au aina ya ἐπίγνωσις
  choice: ujuzi
  alternative: ujuzi kamili; ujuzi wa kweli
  rationale: “Ujuzi” hauongezi kivumishi ambacho hakipo wazi katika Kigiriki. Tanbihi inaonyesha vivuli vya maana vinavyowezekana bila kuvitia katika matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Bidii” ni rahisi kueleweka kuliko maneno ya juu zaidi kama “ari,” na “si kulingana na ujuzi” huhifadhi ukaribu na muundo wa Kigiriki pamoja na utata wake halisi.
