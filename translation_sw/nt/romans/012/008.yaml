id: ROM.12.8
reference: Romans 12:8
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἴτε ὁ παρακαλῶν ἐν τῇ παρακλήσει, ὁ μεταδιδοὺς ἐν ἁπλότητι, ὁ προϊστάμενος ἐν σπουδῇ, ὁ ἐλεῶν ἐν ἱλαρότητι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/008.yaml
  text: if exhorting[a], in exhortation; the one who shares, with generosity; the one who leads, with diligence; the one who shows mercy[e][d][c][b], with cheerfulness.
translation:
  language: sw
  text: ikiwa ni kuhimiza[a], na ahimize; anayeshiriki alivyo navyo, afanye hivyo kwa ukarimu[b]; anayeongoza, kwa bidii[c]; anayewatendea wengine rehema, kwa moyo wa furaha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ikiwa ni kutia moyo, na atie moyo.” Maneno ya Kigiriki yanayohusiana hapa yanaweza kumaanisha kuhimiza, kusihi, au kutia moyo.
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa unyofu” au “kwa moyo mmoja.” Neno la Kigiriki linaweza kueleza ukarimu au moyo usio na hila wala nia zilizogawanyika.
    reason: lexical_alternative
  - marker: c
    text: Au, “kwa ari” au “kwa juhudi ya dhati.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴτε ὁ παρακαλῶν ἐν τῇ παρακλήσει
  choice: ikiwa ni kuhimiza, na ahimize
  rationale: Muundo huu unaendeleza orodha iliyodondosha kitenzi kutoka mstari uliotangulia. 'Kuhimiza' ni ya asili katika Kiswahili na inaweza kujumuisha kusihi na kutia moyo, huku urudiaji ukidumisha uhusiano wa maneno ya Kigiriki παρακαλέω/παράκλησις bila kufanya sentensi kuwa nzito.
- source_word: ὁ μεταδιδοὺς
  choice: anayeshiriki alivyo navyo
  rationale: μεταδίδωμι inaonyesha kumpa mwingine sehemu ya mali au rasilimali za mtu; usemi huu unaweka wazi maana hiyo ya kushirikisha bila kuibana kuwa mchango rasmi.
- source_word: ἐν ἁπλότητι
  choice: kwa ukarimu
  rationale: Katika muktadha wa kushiriki mali, ἁπλότης inaelekea kumaanisha ukarimu, ingawa msingi wake wa unyofu au moyo usiogawanyika unabaki kuwa mbadala halali.
- source_word: ὁ προϊστάμενος
  choice: anayeongoza
  rationale: Neno hili linaweza kuashiria kuongoza, kusimamia, au kuwa mbele ya wengine. 'Anayeongoza' ni pana na halilazimishi cheo maalumu cha kanisa.
- source_word: ἐν σπουδῇ
  choice: kwa bidii
  rationale: σπουδή hubeba wazo la bidii, juhudi ya dhati, au ari. 'Kwa bidii' ni ya kawaida na inafaa wajibu wa uongozi.
- source_word: ὁ ἐλεῶν
  choice: anayewatendea wengine rehema
  rationale: Kishiriki hiki ni cha kitendo; 'kuwatendea wengine rehema' kinaonyesha rehema inayotekelezwa, si hisia pekee.
- source_word: ἐν ἱλαρότητι
  choice: kwa moyo wa furaha
  rationale: ἱλαρότης ni furaha au utayari wa moyo katika kutenda. Usemi huu ni wa asili na unasisitiza namna rehema inavyotolewa.
theological_decisions:
- issue: Upeo wa ὁ προϊστάμενος
  choice: anayeongoza
  alternative: anayesimamia; anayetawala; mwenye kusimamia kusanyiko
  rationale: Orodha inataja utendaji wa vipawa kwa lugha pana, bila kulitaja wazi jukumu rasmi la kanisa. Tafsiri pana huepuka kuingiza mfumo fulani wa uongozi wa dhehebu.
- issue: Maana ya ἁπλότης katika kushiriki mali
  choice: kwa ukarimu
  alternative: kwa unyofu; kwa moyo mmoja; bila hila
  rationale: Uhusiano wake wa moja kwa moja na kushiriki mali unaunga mkono maana ya ukarimu, lakini tanbihi inadumisha uwezekano wa msisitizo juu ya unyofu wa nia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa masharti umewekwa kwa namna ya asili ya Kiswahili huku ufupi wa orodha ya Paulo ukihifadhiwa. Maneno ya kitaalamu ya ofisi za kanisa yameepukwa.
