  text: ἔχοντες δὲ χαρίσματα κατὰ τὴν χάριν τὴν δοθεῖσαν ἡμῖν διάφορα, εἴτε προφητείαν κατὰ τὴν ἀναλογίαν τῆς πίστεως,
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/006.yaml
  text: 'But having gifts that differ according to the grace given to us: if prophecy[a], in proportion to faith;'
translation:
  language: sw
  text: 'Tukiwa na karama zinazotofautiana kwa kadiri ya neema tuliyopewa: ikiwa ni unabii, kwa kadiri ya imani[a];'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa kadiri ya kiwango cha imani yake”; pia, “kwa kupatana na imani.” Kirai cha Kigiriki kinaweza kumaanisha kiwango cha imani alichopewa nabii, au kupatana na maudhui ya imani ya Kikristo.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔχοντες δὲ
  choice: Nasi tuna
  rationale: Kirai hiki kinaendeleza mtiririko wa mawaidha kutoka mstari uliotangulia. “Nasi tuna” ni Kiswahili cha kawaida kinachohifadhi uhusiano huo bila kulazimisha tofauti kali ambayo δέ haihitaji.
- source_word: χαρίσματα
  choice: karama
  rationale: “Karama” ni neno la kawaida na linaloeleweka katika Kiswahili kwa vipawa vinavyotolewa kwa neema katika muktadha wa Paulo.
- source_word: κατὰ τὴν χάριν τὴν δοθεῖσαν ἡμῖν
  choice: kulingana na neema tuliyopewa
  rationale: “Kulingana na” huonyesha uwiano au ulinganifu unaoletwa na κατά, na “neema tuliyopewa” huhifadhi wazi wazo la neema iliyotolewa.
- source_word: διάφορα
  choice: mbalimbali
  rationale: Neno hili linaonyesha tofauti na utofauti wa karama kwa lugha ya asili na iliyo wazi.
- source_word: εἴτε προφητείαν
  choice: Ikiwa karama ya mtu ni kutoa unabii
  rationale: Muundo wa Kigiriki ni wa mkato. Kukamilisha kishazi kwa namna hii hutoa Kiswahili cha kawaida huku muktadha wa karama ukibaki wazi.
- source_word: κατὰ τὴν ἀναλογίαν τῆς πίστεως
  choice: kulingana na imani
  rationale: Tafsiri hii pana huhifadhi uwezekano wa kuelewa πίστεως kuwa imani ya msemaji au jumla ya imani ya Kikristo, bila kuamua maana moja kimya kimya.
theological_decisions:
- issue: Maana ya κατὰ τὴν ἀναλογίαν τῆς πίστεως
  choice: kulingana na imani
  alternative: kulingana na kiwango cha imani ya mtu; au kupatana na imani
  rationale: Kirai cha Kigiriki kinaweza kuonyesha uwiano na imani aliyo nayo msemaji au upatanifu na maudhui ya imani ya Kikristo. Matini kuu imeachwa pana, na fasiri kuu zimewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa Kigiriki uliokatika umekamilishwa kwa kiasi ili usomeke kwa urahisi, bila kuondoa utata wa kitheolojia katika kirai cha mwisho.
