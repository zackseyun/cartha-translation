  text: so we[a], though many, are one body in Messiah, and individually members of one another.
translation:
  language: sw
  text: Vivyo hivyo, sisi tulio wengi ni mwili mmoja katika Masihi,[a] na kila mmoja wetu ni kiungo cha wenzake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “katika Kristo.” Neno la Kigiriki Χριστός linaweza kutafsiriwa kwa namna zote mbili; hapa limetafsiriwa “Masihi” ili kuhifadhi maana yake kama cheo.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως
  choice: Vivyo hivyo
  rationale: Inaunganisha kauli hii na mfano wa mwili na viungo katika mstari uliotangulia, huku ikihifadhi maana ya ulinganisho.
- source_word: οἱ πολλοὶ
  choice: sisi tulio wengi
  rationale: Muktadha unaonyesha kuwa Paulo anajihusisha pamoja na waamini anaowazungumzia; tafsiri hii ni ya asili na inahifadhi wingi wao.
- source_word: ἓν σῶμά
  choice: mwili mmoja
  rationale: Inahifadhi moja kwa moja sitiari ya mwili na kusisitiza umoja.
- source_word: ἐν Χριστῷ
  choice: katika Masihi
  rationale: “Masihi” inahifadhi maana ya cheo Χριστός, na “katika” inatunza lugha ya Paulo ya kuwa katika Masihi bila kuifafanua kupita kiasi.
- source_word: τὸ δὲ καθ’ εἷς
  choice: na kila mmoja wetu
  rationale: Inatoa kwa Kiswahili cha kawaida nguvu ya mgawanyo ya msemo wa Kigiriki, yaani kuwatazama mmoja mmoja.
- source_word: ἀλλήλων
  choice: cha wengine
  rationale: Inaonyesha uhusiano wa pande zote kati ya watu wa kundi hilo, bila kuufanya umiliki wa upande mmoja.
- source_word: μέλη
  choice: kiungo
  rationale: “Kiungo” hudumisha picha halisi ya sehemu ya mwili na pia hueleweka katika matumizi ya kijumuiya.
theological_decisions:
- issue: Tafsiri ya Χριστῷ katika ἐν Χριστῷ
  choice: katika Masihi
  alternative: katika Kristo
  rationale: Χριστός ni cheo chenye maana ya Masihi. Tafsiri kuu inadhihirisha maana hiyo ya cheo, huku tanbihi ikihifadhi namna nyingine iliyozoeleka sana katika Kiswahili.
- issue: Maana ya kuwa viungo vya ἀλλήλων
  choice: kila mmoja wetu ni kiungo cha wengine
  alternative: kila mmoja wetu ni kiungo cha mwenzake
  rationale: Uwingi wa “wengine” unaonyesha wazi zaidi uhusiano wa kila mtu na wengine wote katika mwili mmoja; haisuluhishi sitiari kwa kuibadili kuwa kauli ya ushirika tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni mfupi na wa kawaida, huku sitiari ya mwili na viungo pamoja na uhusiano wa pande zote vikihifadhiwa.
