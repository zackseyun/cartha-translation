  text: sharing in the needs of the saints[b][a], pursuing hospitality.
translation:
  language: sw
  text: Washirikini watakatifu katika mahitaji yao; tafuteni kwa bidii kuwakaribisha wageni.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “fuatilieni ukaribishaji wageni.” Neno la Kigiriki linaweza pia kumaanisha kuwapenda na kuwakaribisha wageni.
    reason: lexical_alternative
lexical_decisions:
- source_word: χρείαις
  choice: mahitaji
  rationale: Neno hili linamaanisha mahitaji ya vitendo au vitu vya lazima; “mahitaji” ni Kiswahili cha kawaida na cha wazi katika muktadha huu.
- source_word: ἁγίων
  choice: watakatifu
  rationale: Katika matumizi ya Paulo, neno hili huwarejelea waumini kama watu waliowekwa wakfu kwa Mungu. “Watakatifu” huhifadhi istilahi na utambulisho huo bila kuugeuza kuwa maelezo marefu.
- source_word: κοινωνοῦντες
  choice: shirikini
  rationale: Kitenzi hiki kinaweza kumaanisha kushiriki au kuchangia. Pamoja na “mahitaji,” “shirikini mahitaji” hudokeza kujihusisha kwa vitendo katika kuyatimiza, huku kikihifadhi wazo pana kuliko kutoa fedha pekee.
- source_word: φιλοξενίαν
  choice: kuwakaribisha wageni
  rationale: Ingawa “ukarimu” ni tafsiri inayowezekana, usemi huu unaweka wazi kipengele cha neno la Kigiriki cha kuwapokea na kuwajali watu wasiokuwa wa nyumbani.
- source_word: διώκοντες
  choice: tafuteni kwa bidii nafasi za
  rationale: διώκω ina nguvu ya kufuatilia au kutafuta kwa juhudi. Usemi huu unaonyesha kwamba ukaribishaji usiwe wa kusubiri tu, bali utafutwe kwa makusudi.
theological_decisions:
- issue: Wanaorejelewa na “watakatifu”
  choice: waumini, yaani watu wa Mungu waliowekwa wakfu kwake
  alternative: watakatifu waliotangazwa rasmi katika maana ya baadaye ya kikanisa
  rationale: Katika matumizi ya Paulo, “watakatifu” huwarejelea Wakristo kwa ujumla, si kundi maalumu lililotangazwa baadaye.
- issue: Upeo wa κοινωνοῦντες katika mahitaji
  choice: kushiriki kwa vitendo katika kuyatimiza mahitaji
  alternative: kuchangia mali au fedha pekee
  rationale: Muktadha unahusisha msaada wa vitendo, lakini kitenzi cha Kigiriki ni kipana kiasi cha kutozuiwa kwenye mchango wa kifedha pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Amri za wingi “shirikini” na “tafuteni” zinaendeleza nguvu ya vishirikishi vya Kigiriki vinavyotumika kama mawaidha katika muktadha. Tafsiri imeweka wazi maana ya ukarimu kwa wageni bila kupunguza msisitizo wa kufuatilia tendo hilo kwa bidii.
