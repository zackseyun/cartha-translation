revisions:
- from: Shirikini mahitaji ya watakatifu; tafuteni kwa bidii nafasi za kuwakaribisha wageni.[a]
  to: Washirikini watakatifu katika mahitaji yao; tafuteni kwa bidii kuwakaribisha wageni.[a]
  rationale: 'The revision repairs the first clause’s Swahili syntax and makes its relational sense explicit: believers are to participate with the saints in addressing their needs. It retains the active force of διώκοντες and the stranger-welcoming sense of φιλοξενία, while offering a narrower and more faithful footnote alternative.'
  reviewer_model: gpt-5.6-terra
