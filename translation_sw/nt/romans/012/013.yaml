review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly identifies the two coordinated participial exhortations: practical participation in the saints’ needs and active pursuit of hospitality. However, “Shirikini mahitaji ya watakatifu” lacks the required/idiomatic relational construction in Swahili and can be understood as sharing the needs themselves, rather than sharing with the saints in meeting their needs.'
  naturalness: “Tafuteni kwa bidii nafasi za kuwakaribisha wageni” is clear and natural. The first clause needs revision for standard, unambiguous Swahili. “Washirikini watakatifu katika mahitaji yao” naturally conveys active solidarity and assistance without restricting the action to financial donations.
  terminology: “Watakatifu” appropriately retains Paul’s corporate term for believers. “Kuwakaribisha wageni” accurately brings out φιλοξενία’s welcome-of-strangers dimension. The footnote’s “ukarimu” is broader than φιλοξενία and should be replaced with a genuine lexical alternative.
  issues:
  - severity: medium
    issue: The phrase “Shirikini mahitaji ya watakatifu” is grammatically and semantically awkward.
    rationale: With “mahitaji” as a direct object, “shiriki” can suggest dividing or sharing needs. The Greek κοινωνοῦντες with the dative needs is better represented by sharing with the saints in their needs, expressed by “Washirikini watakatifu katika mahitaji yao.”
  - severity: low
    issue: The footnote’s alternative “fuatilieni ukarimu kwa bidii” is too broad and less idiomatic.
    rationale: “Ukarimu” can refer to generosity generally, whereas φιλοξενία specifically concerns hospitality/welcoming strangers. “Ukaribishaji wageni” is a closer alternative.
  revised_text: Washirikini watakatifu katika mahitaji yao; tafuteni kwa bidii kuwakaribisha wageni.[a]
  revised_footnotes:
  - marker: a
    text: Au, “fuatilieni ukaribishaji wageni.” Neno la Kigiriki linaweza pia kumaanisha kuwapenda na kuwakaribisha wageni.
    reason: lexical_alternative
  revision_rationale: 'The revision repairs the first clause’s Swahili syntax and makes its relational sense explicit: believers are to participate with the saints in addressing their needs. It retains the active force of διώκοντες and the stranger-welcoming sense of φιλοξενία, while offering a narrower and more faithful footnote alternative.'
