  text: μὴ ἑαυτοὺς ἐκδικοῦντες, ἀγαπητοί, ἀλλὰ δότε τόπον τῇ ὀργῇ, γέγραπται γάρ· Ἐμοὶ ἐκδίκησις, ἐγὼ ἀνταποδώσω, λέγει κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/019.yaml
  text: 'Do not avenge yourselves[a], beloved, but give place to wrath, for it is written: “Vengeance is mine; I will repay[b], says the Lord.”'
translation:
  language: sw
  text: 'Wapendwa, msijilipizie kisasi, bali ipeni ghadhabu nafasi[a], kwa maana imeandikwa: “Kisasi ni changu; mimi nitalipa[b], asema Bwana.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “iachieni ghadhabu nafasi,” yaelekea ikimaanisha ghadhabu ya Mungu kwa kuzingatia nukuu inayofuata.
    reason: lexical_alternative
  - marker: b
    text: Au, “mimi nitalipiza.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ἑαυτοὺς ἐκδικοῦντες
  choice: msijilipizie kisasi
  rationale: Kauli hii ina nguvu ya amri katika muktadha. “Kujilipizia kisasi” ni Kiswahili cha kawaida kinachohifadhi maana ya tendo kuelekezwa kwa niaba ya nafsi zenu.
- source_word: ἀγαπητοί
  choice: Wapendwa
  rationale: Huhifadhi mwito wa upendo na uzito wa kitheolojia kwa lugha ya asili na yenye heshima.
- source_word: ἀλλὰ δότε τόπον τῇ ὀργῇ
  choice: bali ipisheni ghadhabu
  rationale: “Ipisheni” hudumisha sitiari ya kutoa nafasi bila kuongeza wazi kwamba ni ghadhabu ya Mungu; nukuu inayofuata inaelekeza kwa maana hiyo.
- source_word: γέγραπται γάρ
  choice: kwa maana imeandikwa
  rationale: Ni namna ya kawaida ya Kiswahili ya kuingiza nukuu ya Maandiko na huonyesha hali endelevu ya yaliyoandikwa.
- source_word: Ἐμοὶ ἐκδίκησις
  choice: Kisasi ni changu
  rationale: Huwakilisha uhusiano wa umilikaji unaoonyeshwa na dative ἐμοί, kwa usemi mfupi na wenye nguvu.
- source_word: ἐγὼ ἀνταποδώσω
  choice: mimi nitalipa
  rationale: “Nitalipa” ni tafsiri ya moja kwa moja na ya kawaida katika muktadha wa Mungu kutoa malipo ya haki; “mimi” huhifadhi msisitizo wa kiwakilishi cha Kigiriki.
- source_word: λέγει κύριος
  choice: asema Bwana
  rationale: Ni fomula ya kinabii iliyo ya asili katika Kiswahili na huhifadhi jina la cheo κύριος kama “Bwana.”
theological_decisions:
- issue: Rejeo la τῇ ὀργῇ (“ghadhabu”)
  choice: Kuhifadhi usemi mfupi “ipisheni ghadhabu” katika matini kuu, huku tanbihi ikieleza kwamba muktadha unaelekea kwa ghadhabu ya Mungu.
  alternative: Kutafsiri wazi “iachieni nafasi ghadhabu ya Mungu,” au kuelewa kuwa ni ghadhabu ya binadamu kwa ujumla.
  rationale: Nukuu inayofuata kutoka Kumbukumbu la Torati 32:35 inaweka kisasi mikononi mwa Mungu, hivyo huenda ghadhabu ya Mungu ndiyo inayokusudiwa. Hata hivyo, Kigiriki hakisemi wazi “ya Mungu,” kwa hiyo matini kuu haiongezi ufafanuzi huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mpangilio unaanza na “Wapendwa” ili mwito usikike kwa kawaida katika Kiswahili. Usemi “ipisheni ghadhabu” unahifadhi sitiari na utata wa chanzo bila kuingiza ufafanuzi wa kimadhehebu.
