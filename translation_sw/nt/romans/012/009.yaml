id: ROM.12.9
reference: Romans 12:9
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἡ ἀγάπη ἀνυπόκριτος. ἀποστυγοῦντες τὸ πονηρόν, κολλώμενοι τῷ ἀγαθῷ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/009.yaml
  text: Let love be without hypocrisy[a]. Abhor what is evil; cling to what is good.
translation:
  language: sw
  text: Upendo usiwe na unafiki.[a] Chukieni kabisa yaliyo mabaya; shikamaneni na yaliyo mema.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Upendo uwe wa kweli.” Kigiriki kinasema kihalisi, “Upendo usio na unafiki.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγάπη
  choice: upendo
  rationale: Hili ndilo neno la kawaida na la asili katika Kiswahili cha sasa kwa upendo wa kimaadili unaokusudiwa hapa.
- source_word: ἀνυπόκριτος
  choice: usiwe na unafiki
  rationale: Linahifadhi maana halisi ya kutokuwa wa kujifanya. Kitenzi kimeongezwa ili sentensi isiyo na kitenzi katika Kigiriki iwe himizo la kawaida katika Kiswahili.
- source_word: ἀποστυγοῦντες
  choice: chukieni kabisa
  rationale: Kitenzi hiki kinaonyesha chuki au kuchukizwa kwa nguvu sana; 'kabisa' kinahifadhi uzito huo kwa lugha ya sasa.
- source_word: τὸ πονηρόν
  choice: yaliyo mabaya
  rationale: Kivumishi cha Kigiriki kilichotumiwa kama nomino kinaashiria kwa upana mambo yaliyo maovu; umbo hili ni la kawaida na linaendana na 'yaliyo mema'.
- source_word: κολλώμενοι
  choice: shikamaneni na
  rationale: Linawasilisha wazo la kushikilia kwa karibu na kwa uthabiti, bila kutumia lugha ya kizamani.
- source_word: τῷ ἀγαθῷ
  choice: yaliyo mema
  rationale: Linahifadhi kundi pana la mambo mema na ulinganifu wake na 'yaliyo mabaya'.
theological_decisions:
- issue: Nguvu ya kishazi kisicho na kitenzi na vivumishi-tendo katika muktadha wa mawaidha
  choice: 'Kutafsiri kama mfululizo wa mahimizo: ''Upendo usiwe ... Chukieni ... shikamaneni ...'''
  alternative: 'Tafsiri ya karibu zaidi na umbo la Kigiriki: ''Upendo usio na unafiki, mkichukia kabisa yaliyo mabaya, mkishikamana na yaliyo mema.'''
  rationale: Muktadha wa Waroma 12 ni mfululizo wa mahimizo. Umbo la kuamuru linawasilisha kazi ya vipashio hivyo kwa Kiswahili cha asili bila kuondoa mvutano wa kishazi kifupi cha kwanza.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Chukieni kabisa' ni wazi zaidi kwa wasomaji wa kawaida kuliko neno la juu au la kizamani, huku 'shikamaneni' likidumisha picha ya kushikilia kwa uthabiti.
