  yaml_path: translation/nt/romans/012/014.yaml
  text: Bless those who persecute you[a]; bless and do not curse.
translation:
  language: sw
  text: Wabarikini wale wanaowatesa[a]; wabarikini, wala msilaani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wale wanaowafuatilia.” Kitenzi cha Kigiriki kinaweza kumaanisha “kufuatilia,” lakini hapa huenda kinamaanisha mateso ya uadui.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Wabarikini / barikini
  rationale: Kitenzi hiki ni amri kwa wingi. ‘Barikini’ ni tafsiri ya kawaida na yenye hadhi inayobeba maana ya kuwatakia au kuwaombea wengine mema. Urudiaji umehifadhiwa ili kudumisha msisitizo wa Paulo.
- source_word: τοὺς διώκοντας
  choice: wale wanaowatesa
  rationale: Kirai hiki cha kisifa chenye kibainishi kinatumika kama nomino, yaani ‘wale wanaotesa.’ Ingawa διώκω pia inaweza kumaanisha ‘fuatilia,’ katika muktadha huu inaelekea kueleza mateso ya uadui. Kiambishi ‘-wa-’ kinaweka wazi walengwa wanaodokezwa na muktadha.
- source_word: καὶ
  choice: wala
  rationale: Katika muundo hasi wa Kiswahili, ‘wala’ huunganisha kwa kawaida amri chanya inayorudiwa na katazo linalofuata, huku ikihifadhi uhusiano wa καὶ katika sentensi.
- source_word: μὴ καταρᾶσθε
  choice: msilaani
  rationale: Ni katazo la amri kwa wingi. ‘Msilaani’ ni Kiswahili cha moja kwa moja na cha kawaida, na kinahifadhi utofautishaji ulio wazi kati ya kubariki na kulaani.
theological_decisions:
- issue: Upeo wa maana ya διώκω katika muktadha
  choice: Imetafsiriwa kuwa mateso ya uadui
  alternative: wale wanaowafuatilia
  rationale: Ingawa διώκω inaweza kumaanisha ‘fuatilia,’ matumizi yake katika mazingira ya kimaadili ya Agano Jipya na utofautishaji wa kubariki na kulaani vinaunga mkono maana ya ‘tesa.’ Tanbihi inahifadhi uwezekano mpana wa kileksika bila kuufanya kuwa maana kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, fasaha na chenye hadhi. Muundo wa amri kwa wingi na urudiaji wa ‘barikini’ umehifadhiwa; ‘wala’ limetumiwa kwa uunganishi wa asili wa Kiswahili katika katazo.
