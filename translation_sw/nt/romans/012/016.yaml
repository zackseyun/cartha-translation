  text: τὸ αὐτὸ εἰς ἀλλήλους φρονοῦντες, μὴ τὰ ὑψηλὰ φρονοῦντες ἀλλὰ τοῖς ταπεινοῖς συναπαγόμενοι. μὴ γίνεσθε φρόνιμοι παρ’ ἑαυτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/016.yaml
  text: Be of the same mind toward one another[a]; do not set your mind on high things, but associate with the lowly[b]. Do not become wise in your own sight.
translation:
  language: sw
  text: Iweni na nia moja ninyi kwa ninyi. Msiweke nia zenu katika mambo ya juu[a], bali ambataneni na watu wa hali ya chini[b]. Msije mkajiona kuwa wenye hekima.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “msitamani makuu,” au, “msiwe na kiburi.”
    reason: lexical_alternative
  - marker: b
    text: Au, “ambataneni na wanyenyekevu.” Kigiriki kinaweza kumaanisha watu wa hali ya chini au mambo ya hali ya chini.
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ αὐτὸ εἰς ἀλλήλους φρονοῦντες
  choice: Muwe na nia moja ninyi kwa ninyi
  rationale: Kirai hiki kinaeleza mwelekeo wa pamoja na upatano katika mahusiano ya waumini, si lazima kuwa na mawazo yanayofanana katika kila jambo.
- source_word: μὴ τὰ ὑψηλὰ φρονοῦντες
  choice: Msiweke nia zenu katika mambo ya juu
  rationale: Tafsiri hii inahifadhi taswira ya Kigiriki ya kuyaelekeza mawazo kwenye ‘mambo ya juu’ bila kuamua ikiwa maana kuu ni kiburi, hadhi ya juu, au tamaa ya makuu.
- source_word: τοῖς ταπεινοῖς συναπαγόμενοι
  choice: shirikianeni na watu wa hali ya chini
  rationale: Katika muktadha wa mahusiano ya jumuiya, kitenzi kinaweza kueleza kuandamana au kushirikiana na watu wa hadhi ya chini. Tafsiri kuu ni ya asili katika Kiswahili, huku tanbihi ikihifadhi uwezekano wa kurejelea mambo au shughuli za hali ya chini.
- source_word: μὴ γίνεσθε φρόνιμοι παρ’ ἑαυτοῖς
  choice: Msije mkajiona kuwa wenye hekima
  rationale: ‘Msije mkajiona’ linaonyesha onyo dhidi ya kufikia hali ya kujihesabu kuwa na hekima, na kwa Kiswahili cha kawaida linawasilisha vizuri maana ya kuwa mwenye hekima kwa kadiri ya maoni yako mwenyewe.
theological_decisions:
- issue: Maana ya τὰ ὑψηλά na τοῖς ταπεινοῖς katika himizo la unyenyekevu wa kijamii
  choice: Kutoyaelekeza mawazo kwenye mambo ya juu, bali kushirikiana na watu wa hali ya chini
  alternative: Msijivune, bali ambataneni na wanyenyekevu; au msitamani makuu, bali kubalini shughuli za hali ya chini
  rationale: Kigiriki kinaweza kukazia kiburi cha ndani, kutafuta hadhi ya juu, au namna ya kuhusiana na watu wa hadhi ya chini. Isitoshe, τοῖς ταπεινοῖς inaweza kuwa watu au mambo. Maandishi na tanbihi kwa pamoja yanahifadhi mvutano huo bila kuufungamanisha na fundisho finyu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Nia moja’ ni nahau ya kawaida ya upatano; ‘mambo ya juu’ huhifadhi taswira na upana wa chanzo; tanbihi zinaeleza utata ambao hauwezi kuhifadhiwa kikamilifu katika sarufi ya Kiswahili.
