  yaml_path: translation/nt/romans/012/015.yaml
  text: Rejoice with those who rejoice[a]; weep with those who weep.
translation:
  language: sw
  text: Furahini pamoja na wanaofurahi; lieni pamoja na wanaolia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χαίρειν
  choice: Furahini
  rationale: Kitenzi-jina cha wakati uliopo kimetumiwa kwa nguvu ya amri katika mfululizo huu wa mausia. “Furahini” ni amri ya wingi iliyo ya kawaida na inayohifadhi maana ya kuwa na furaha.
- source_word: μετὰ
  choice: pamoja na
  rationale: Ikiwa na umbo la jenitivi, μετά huonyesha ushirika au kuambatana. “Pamoja na” huwasilisha kwa asili wito wa kushiriki hali ya wengine.
- source_word: χαιρόντων
  choice: wanaofurahi
  rationale: Kivumishi-tendo cha wakati uliopo, wingi, kimetumiwa kama nomino. “Wanaofurahi” ni Kiswahili cha kawaida na huhifadhi maana ya jumla ya watu hao.
- source_word: κλαίειν
  choice: lieni
  rationale: Kama χαίρειν, kitenzi-jina hiki kina nguvu ya amri. “Lieni” hulingana moja kwa moja na κλαίω na kuhifadhi usambamba wa sentensi bila kupanua maana kuwa maombolezo kwa ujumla.
- source_word: κλαιόντων
  choice: wanaolia
  rationale: Kivumishi-tendo cha wakati uliopo kimetumiwa kama nomino baada ya μετά. “Wanaolia” ni wazi, cha kawaida, na kinalingana kimuundo na “wanaofurahi.”
theological_decisions:
- issue: Nguvu ya amri ya vitenzi-jina katika mfululizo wa mausia
  choice: 'Kutafsiri vitenzi-jina vyote viwili kwa amri za wingi: “Furahini ...; lieni ...”'
  alternative: “Kufurahi pamoja na wanaofurahi; kulia pamoja na wanaolia.”
  rationale: Ingawa Kigiriki kimetumia vitenzi-jina, muktadha wa Waroma 12:9–21 ni wa mausia, hivyo miundo hii hufanya kazi kama maagizo. Amri za Kiswahili huwasilisha kazi hiyo ya usemi kwa kawaida bila kuongeza fundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Usambamba mfupi wa Kigiriki umehifadhiwa; “pamoja na” hurudiwa ili kuonyesha wazi ushirika katika furaha na huzuni.
