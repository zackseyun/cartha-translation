review_pass:
  verdict: revise
  source_fidelity: The draft faithfully conveys the exhortation, God's mercies, embodied sacrificial presentation, holiness, and what pleases God. However, “ndugu zangu” adds the possessive “my,” which is absent from ἀδελφοί. “Mtoe miili yenu” more directly represents the infinitive παραστῆσαι than “itoeni ... iwe.”
  naturalness: The revised wording is idiomatic Standard East African Swahili. “Mtoe miili yenu kuwa dhabihu iliyo hai” is a natural sacrificial expression, and “ibada yenu ya busara” is a clear modern rendering while the footnote retains the lexical range.
  terminology: “Rehema za Mungu,” “miili,” “dhabihu iliyo hai,” “takatifu,” “ya kumpendeza Mungu,” and “ibada” are appropriate and preserve the passage's religious and sacrificial register. The alternatives for λογικὴν λατρείαν are retained without deciding the debated sense.
  issues:
  - severity: medium
    issue: “ndugu zangu” includes “zangu” (“my”).
    rationale: The Greek vocative ἀδελφοί is simply “brothers”; it has no possessive pronoun. The added possessive is common in some Swahili biblical styles but is not warranted by this source text.
  - severity: low
    issue: “Itoeni miili yenu iwe dhabihu” is less direct than necessary.
    rationale: “Mtoe miili yenu kuwa dhabihu” naturally expresses presenting the bodies as a sacrifice and more closely follows the construction of the Greek.
  - severity: low
    issue: The footnote alternative “huduma yenu ya kiakili” is somewhat stiff in current Swahili.
    rationale: “Huduma yenu ya kimantiki” is more natural for the rational/reasoned alternative, while the explanatory sentence can preserve the wider semantic possibilities.
  revised_text: Kwa hiyo, ndugu[a], nawasihi kwa rehema za Mungu mtoe miili yenu kuwa dhabihu iliyo hai, takatifu, na ya kumpendeza Mungu—ibada yenu ya busara[b].
