id: ROM.12.1
reference: Romans 12:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Παρακαλῶ οὖν ὑμᾶς, ἀδελφοί, διὰ τῶν οἰκτιρμῶν τοῦ θεοῦ παραστῆσαι τὰ σώματα ὑμῶν θυσίαν ζῶσαν ἁγίαν ⸂εὐάρεστον τῷ θεῷ⸃, τὴν λογικὴν λατρείαν ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/001.yaml
  text: Therefore I urge you[a], brothers, by the mercies of God, to present your bodies as a living sacrifice[b], holy and pleasing to God—your reasonable worship.
translation:
  language: sw
  text: Kwa hiyo, ndugu[a], nawasihi kwa rehema za Mungu mtoe miili yenu kuwa dhabihu iliyo hai, takatifu, na ya kumpendeza Mungu—ibada yenu ya busara[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki linasema kihalisi “ndugu wa kiume,” lakini mara nyingi hutumiwa kulihutubia kundi lenye wanaume na wanawake.
    reason: alternative_reading
  - marker: b
    text: Au “ibada yenu ya kiroho” au “huduma yenu ya kimantiki.” Kirai cha Kigiriki kinaweza kumaanisha ibada au huduma yenye kufikiriwa, ya busara, inayofaa, au ya kiroho.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: nawasihi
  rationale: Kitenzi hiki hapa kinaonyesha wito wa dhati na wenye uzito, si ombi la kawaida tu. “Nawasihi” ni Kiswahili cha sasa na huhifadhi nguvu hiyo.
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Kiunganishi hiki kinaonyesha hitimisho linalotokana na hoja ya sura 1–11; “Kwa hiyo” huhifadhi uhusiano huo wa kimantiki.
- source_word: ἀδελφοί
  choice: ndugu zangu
  rationale: “Ndugu zangu” ni namna ya kawaida na yenye heshima ya kulihutubia kundi katika Kiswahili. Neno la Kigiriki lina umbo la kiume lakini katika muktadha huu linaweza kujumuisha waamini wa kiume na wa kike; jambo hilo limeelezwa katika tanbihi.
- source_word: διὰ τῶν οἰκτιρμῶν τοῦ θεοῦ
  choice: kwa rehema za Mungu
  rationale: “Kwa” huonyesha msingi wa himizo la Paulo, na “rehema” huhifadhi wingi wa οἰκτιρμῶν bila kufanya usemi kuwa mzito.
- source_word: παραστῆσαι
  choice: itoeni
  rationale: Katika muktadha wa dhabihu, neno hili lina maana ya kutoa au kuwasilisha mbele za Mungu. “Itoeni” ni la kawaida katika Kiswahili na huendeleza picha ya dhabihu.
- source_word: τὰ σώματα ὑμῶν
  choice: miili yenu
  rationale: Tafsiri hii huhifadhi neno halisi “miili” badala ya kulipanua kimya kimya kuwa “nafsi zenu” au “wenyewe.”
- source_word: θυσίαν ζῶσαν
  choice: iwe dhabihu iliyo hai
  rationale: Muundo huu ni wa asili katika Kiswahili na huhifadhi taswira yenye mvutano ya dhabihu ambayo, tofauti na dhabihu iliyochinjwa, iko hai.
- source_word: ἁγίαν
  choice: takatifu
  rationale: “Takatifu” ni neno la kawaida linaloonyesha kuwa dhabihu hiyo imetengwa kwa ajili ya Mungu.
- source_word: εὐάρεστον τῷ θεῷ
  choice: ya kumpendeza Mungu
  rationale: Usemi huu unaeleza kwamba dhabihu hiyo inampendeza Mungu, si kwamba inakubalika kwa kiwango cha chini tu.
- source_word: λογικὴν
  choice: inayofaa
  rationale: λογικός linaweza kudokeza jambo la kiakili, lenye sababu, linalofaa, au la kiroho. “Inayofaa” ni Kiswahili cha kawaida kinachotoa wazo la ibada inayolingana na rehema za Mungu bila kulazimisha maana moja; uwezekano mwingine umewekwa katika tanbihi.
- source_word: λατρείαν
  choice: ibada
  rationale: λατρεία ni huduma ya kidini au ibada inayotolewa kwa Mungu. “Ibada” huwasilisha wazi mwelekeo wake kwa Mungu, huku taswira ya dhabihu ikihifadhi wazo la huduma takatifu.
theological_decisions:
- issue: Maana ya ἀδελφοί katika barua iliyoelekezwa kwa jumuiya yenye wanaume na wanawake
  choice: ndugu zangu
  alternative: ndugu zangu wa kiume na wa kike
  rationale: Kiswahili “ndugu” lenyewe linaweza kutaja wanaume na wanawake kwa kawaida. Tanbihi inaweka wazi kwamba Kigiriki kina umbo linalomaanisha kihalisi “ndugu wa kiume” lakini mara nyingi hutumiwa kwa kundi lenye jinsia zote.
- issue: Maana ya λογικὴν λατρείαν
  choice: ibada yenu inayofaa
  alternative: ibada yenu ya kiroho; huduma yenu ya kiakili
  rationale: 'Kirai hiki kina utata halisi: kinaweza kueleweka kuwa ibada yenye kufikiriwa, inayopatana na akili, inayofaa, au ya kiroho. Tafsiri kuu inatumia usemi wa kawaida usiofunga mjadala, na tanbihi inahifadhi maana mbadala.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa sentensi umefanywa kuwa wa asili kwa kutumia “itoeni ... iwe,” huku istilahi kuu za dhabihu, utakatifu, rehema na ibada zikihifadhiwa.
