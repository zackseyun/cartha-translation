lexical_decisions:
- source_word: σπουδῇ
  choice: katika bidii
  rationale: Neno hili huonyesha bidii, ari, au juhudi ya dhati. “Katika bidii” linaendana vizuri na katazo la kulegea na linaeleweka katika Kiswahili cha sasa.
- source_word: ὀκνηροί
  choice: msilegee
  rationale: Ingawa neno hilo linaweza kutafsiriwa “msiwe wavivu,” “msilegee” huwasilisha kwa njia ya kawaida uzito wa kutokuwa wazito, wazembe, au wenye kusita katika bidii.
- source_word: πνεύματι
  choice: kwa roho
  rationale: Kigiriki hakisemi wazi ikiwa ni roho ya mtu au Roho Mtakatifu. “Kwa roho” linaacha kiwango fulani cha uwezekano huo, huku herufi ndogo ikifuata maana inayowezekana zaidi ya roho au hali ya ndani ya mwamini.
- source_word: ζέοντες
  choice: muwake
  rationale: Kitenzi hiki humaanisha kihalisi kuchemka na hapa ni sitiari ya kuwa na ari kali. “Muwake” huhifadhi picha hiyo kwa Kiswahili kifupi na chenye nguvu.
- source_word: κυρίῳ
  choice: Bwana
  rationale: “Bwana” ndilo neno la kawaida la Kiswahili kwa cheo κύριος katika muktadha huu wa Paulo, bila kulazimisha ufafanuzi zaidi wa rejeo lake.
- source_word: δουλεύοντες
  choice: mtumikieni
  rationale: Kitenzi kinaweza kuwa na maana ya kutumikia kama mtumwa, lakini katika himizo hili “mtumikieni” huwasilisha kwa kawaida ibada, utiifu, na kujitoa kwa Bwana.
theological_decisions:
- issue: Rejeo la πνεύματι katika τῷ πνεύματι ζέοντες
  choice: roho ya mwamini au hali yake ya ndani
  alternative: Roho Mtakatifu
  rationale: Mfuatano wa mahimizo ya kimaadili unaunga mkono maana ya ari ya ndani ya mwamini, lakini umbo la Kigiriki halitambulishi rejeo hilo waziwazi. Kwa hiyo maana ya Roho Mtakatifu imehifadhiwa katika tanbihi badala ya kuondolewa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Vipashio vitatu vifupi vinahifadhi mpangilio na nguvu ya mahimizo ya Kigiriki; “muwake” pia huhifadhi sitiari ya ζέοντες.
