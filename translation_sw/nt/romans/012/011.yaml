review_pass:
  verdict: revise
  source_fidelity: 'The three parallel exhortations and the reference to serving the Lord are retained. However, “muwake kwa roho” is not an idiomatic rendering of τῷ πνεύματι ζέοντες: kwa normally suggests agency (“by means of”), whereas the Greek dative here expresses the sphere/respect in which one is fervent. “Muwe na ari rohoni” conveys the metaphorical ardour naturally, while retaining the likely human-spirit sense. “Katika bidii, msiwe wavivu” clearly represents σπουδῇ μὴ ὀκνηροί without the less direct shift in “msilegee.”'
  naturalness: “Msilegee katika bidii” is understandable but less direct and somewhat awkward as a rendering of “not lazy/slothful.” “Muwake kwa roho” is especially unnatural in standard East African Swahili, where it can imply being set alight by a spirit. The revised wording is clear, current, and appropriately exhortative.
  terminology: “Bidii,” “rohoni,” “Bwana,” and “mtumikieni” are suitable established terms. The lower-case main-text “rohoni” reflects the likely reference without denying the alternate Holy-Spirit reading, which is retained in the footnote.
  issues:
  - severity: medium
    issue: The phrase “muwake kwa roho” uses an unsuitable preposition and an awkward idiom.
    rationale: τῷ πνεύματι is not naturally expressed by kwa in this context. “Kwa roho” can be read instrumentally, changing the relation from fervency in/with respect to one’s spirit to being made fervent by a spirit.
  - severity: low
    issue: “Msilegee katika bidii” is less precise than the source contrast.
    rationale: ὀκνηροί directly denotes being lazy, sluggish, or slothful. “Msiwe wavivu” states the quality directly and works naturally when the prepositional phrase is placed first.
