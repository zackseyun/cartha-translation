lexical_decisions:
- source_word: εἴτε
  choice: ikiwa
  rationale: Katika orodha hii fupi ya karama na utendaji wake, “ikiwa” hudumisha muundo wa masharti uliodokezwa na muktadha.
- source_word: διακονίαν
  choice: huduma
  rationale: “Huduma” ni neno pana linaloweza kumaanisha kutumikia au huduma ya kiroho bila kulifanya moja kwa moja kuwa cheo rasmi cha kanisa.
- source_word: ἐν τῇ διακονίᾳ
  choice: katika kuhudumu
  rationale: Kiswahili cha kawaida hutumia kitenzi-jina “kuhudumu” kwa hali hii. Tafsiri inadumisha wazo la kujikita katika utendaji wa huduma, ingawa Kigiriki kinarudia nomino ileile.
- source_word: ὁ διδάσκων
  choice: mtu anafundisha
  rationale: Muundo huu unahifadhi mkazo wa kishiriki cha wakati uliopo juu ya mtu anayefanya kazi ya kufundisha, bila kukigeuza lazima kuwa cheo rasmi cha “mwalimu.”
- source_word: διδασκαλίᾳ
  choice: kufundisha
  rationale: “Kufundisha” huonyesha moja kwa moja shughuli inayotajwa hapa na ni ya kawaida zaidi kuliko istilahi nyembamba kama “fundisho” au “mafundisho.”
theological_decisions:
- issue: Iwapo διακονία itafsiriwe kwa istilahi yenye maana rasmi ya kikanisa
  choice: huduma
  alternative: utumishi
  rationale: “Huduma” huhifadhi upana wa neno la Kigiriki na haikulazimishi aya kuzungumzia wadhifa rasmi wa kanisa.
- issue: Iwapo ὁ διδάσκων itafsiriwe kama cheo rasmi
  choice: mtu anafundisha
  alternative: mwalimu
  rationale: Kigiriki kinamtaja mtu kwa tendo analolifanya; tafsiri kuu inadumisha mkazo huo wa kiutendaji bila kukataa uwezekano kwamba mtu huyo anaweza kuitwa mwalimu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo mfupi na wenye heshima. Muundo wa sentensi umeachwa kwa kiasi fulani bila kitenzi kikuu ili kuhifadhi ufupi na ulinganifu wa orodha ya Kigiriki; muktadha wa aya iliyotangulia hutoa wito unaodokezwa wa kutumia kila karama katika kazi yake.
