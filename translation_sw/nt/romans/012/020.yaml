  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ⸂ἀλλὰ ἐὰν⸃ πεινᾷ ὁ ἐχθρός σου, ψώμιζε αὐτόν· ἐὰν διψᾷ, πότιζε αὐτόν· τοῦτο γὰρ ποιῶν ἄνθρακας πυρὸς σωρεύσεις ἐπὶ τὴν κεφαλὴν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/020.yaml
  text: But if your enemy is hungry[a], feed him; if he is thirsty, give him something to drink; for by doing this you will heap burning coals on his head.
translation:
  language: sw
  text: Lakini adui yako akiwa na njaa, mpe chakula; akiwa na kiu, mpe kitu cha kunywa; kwa maana kwa kufanya hivyo utamlundikia makaa ya moto[a] juu ya kichwa chake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “makaa yanayowaka.” Huenda taswira hii inadokeza aibu inayoongoza kwenye toba, maumivu ya dhamiri, au hukumu inayokuja; sitiari ya Kigiriki imehifadhiwa katika andiko kuu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ ἐὰν
  choice: Lakini ... akiwa
  rationale: “Lakini” huhifadhi utofautishaji wa ἀλλά na agizo lililotangulia la kutolipiza kisasi; “akiwa” huwasilisha sharti la ἐάν kwa Kiswahili cha kawaida.
- source_word: πεινᾷ ὁ ἐχθρός σου
  choice: adui yako akiwa na njaa
  rationale: Huhifadhi “adui yako” katika umoja na kueleza hali ya njaa kwa lugha ya kawaida na ya sasa.
- source_word: ψώμιζε αὐτόν
  choice: mpe chakula
  rationale: ψωμίζω humaanisha kumpa mtu chakula; tafsiri hii ni wazi na haiongezi maana isiyokuwapo katika Kigiriki.
- source_word: ἐὰν διψᾷ
  choice: akiwa na kiu
  rationale: Ni namna ya kawaida ya Kiswahili ya kueleza sharti na hali ya kuwa na kiu.
- source_word: πότιζε αὐτόν
  choice: mpe kitu cha kunywa
  rationale: Huhifadhi maana ya kumpa kinywaji bila kuifanya iwe maji pekee, jambo ambalo Kigiriki hakisemi.
- source_word: τοῦτο γὰρ ποιῶν
  choice: kwa maana kwa kufanya hivyo
  rationale: “Kwa maana” huonyesha uhusiano wa maelezo wa γάρ, na “kwa kufanya hivyo” huhifadhi dhana ya njia au tendo katika kishiriki ποιῶν.
- source_word: ἄνθρακας πυρὸς
  choice: makaa ya moto
  rationale: Ni usemi wa asili wa Kiswahili kwa makaa yanayowaka au yenye moto, na huhifadhi taswira halisi ya Kigiriki.
- source_word: σωρεύσεις
  choice: utamlundikia
  rationale: Kitenzi hiki huhifadhi wazo la kukusanya au kurundika kitu juu ya mtu na pia wakati ujao wa σωρεύσεις.
- source_word: ἐπὶ τὴν κεφαλὴν αὐτοῦ
  choice: juu ya kichwa chake
  rationale: Ni tafsiri ya moja kwa moja inayohifadhi taswira ya mahali iliyo katika Kigiriki.
theological_decisions:
- issue: Maana ya sitiari ya kumlundikia adui makaa ya moto juu ya kichwa
  choice: Sitiari imehifadhiwa katika andiko kuu bila kufasiriwa.
  alternative: Kuitafsiri moja kwa moja kuwa aibu inayoleta toba, maumivu ya dhamiri, au hukumu inayokuja.
  rationale: Maana kamili ya taswira hii inabishaniwa. Kuihifadhi huacha mvutano wa kifasiri wa Kigiriki bila kuamua kimya kimya kati ya toba, usadikisho wa dhamiri, na hukumu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa kawaida kwa wasomaji wengi, huku umoja wa “adui yako” na sitiari ya mwisho vikihifadhiwa.
