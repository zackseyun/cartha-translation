id: ROM.12.3
reference: Romans 12:3
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Λέγω γὰρ διὰ τῆς χάριτος τῆς δοθείσης μοι παντὶ τῷ ὄντι ἐν ὑμῖν μὴ ὑπερφρονεῖν παρ’ ὃ δεῖ φρονεῖν, ἀλλὰ φρονεῖν εἰς τὸ σωφρονεῖν, ἑκάστῳ ὡς ὁ θεὸς ἐμέρισεν μέτρον πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/003.yaml
  text: For by the grace given to me I say to everyone among you not to think of himself more highly than he ought to think, but to think with sound judgment, as God has apportioned to each a measure of faith.
translation:
  language: sw
  text: Kwa maana, kwa neema niliyopewa, ninamwambia kila mmoja aliye miongoni mwenu asijione kuwa wa maana kuliko inavyompasa, bali afikiri kwa kiasi[a], kadiri Mungu alivyomgawia kila mmoja kipimo cha imani.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “bali afikiri kwa akili timamu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kile kipimo cha imani”; yawezekana pia, “kipimo cha uaminifu” au “kipimo cha tumaini.” Usemi wa Kigiriki unataja kipimo kinachohusiana na imani bila kubainisha maana yake hasa.
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τῆς χάριτος τῆς δοθείσης μοι
  choice: kwa neema niliyopewa
  rationale: Katika muundo huu, διά pamoja na jenitivi huonyesha njia au msingi. Tafsiri hii ni ya kawaida katika Kiswahili na inadokeza mamlaka ya Paulo aliyopewa bila kufafanua zaidi ya maandishi.
- source_word: παντὶ τῷ ὄντι ἐν ὑμῖν
  choice: kila mmoja aliye miongoni mwenu
  rationale: Inahifadhi maana ya kila mtu mmoja mmoja ndani ya jumuiya inayozungumziwa.
- source_word: μὴ ὑπερφρονεῖν παρ’ ὃ δεῖ φρονεῖν
  choice: asijione kuwa mkuu kuliko inavyompasa kujiona
  rationale: Inawasilisha kujikadiria kupita kiasi na kuhifadhi kadiri iwezekanavyo urudiaji wa mzizi wa wazo la kufikiri katika Kigiriki.
- source_word: ἀλλὰ φρονεῖν εἰς τὸ σωφρονεῖν
  choice: bali ajifikirie kwa busara
  rationale: Ni Kiswahili cha asili kinachounganisha kujitathmini na akili timamu, bila kupunguza σωφρονεῖν kuwa unyenyekevu pekee.
- source_word: ἑκάστῳ ὡς ὁ θεὸς ἐμέρισεν
  choice: kadiri Mungu alivyomgawia kila mmoja
  rationale: μερίζω ina wazo la kugawa sehemu; 'kadiri' linaunganisha kujitathmini kwa busara na mgawo wa Mungu bila kulazimisha uhusiano wa kifasiri ulio mwembamba.
- source_word: μέτρον πίστεως
  choice: kipimo cha imani
  rationale: Inahifadhi usemi mpana wa Kigiriki na kutobainisha kama ni kiasi, kiwango, au kipimo kinachohusiana na imani.
theological_decisions:
- issue: Maana ya μέτρον πίστεως
  choice: kipimo cha imani
  alternative: kipimo cha uaminifu/utumainifu; au kile kipimo cha imani
  rationale: Muktadha unaofuata unahusu karama mbalimbali, lakini usemi wenyewe haulazimishi maana moja kama imani iokoayo, uwezo wa huduma, au kiwango cha kawaida. Tafsiri inaacha mvutano huo wazi.
- issue: Uhusiano wa σωφρονεῖν na kujitathmini
  choice: ajifikirie kwa busara
  alternative: afikiri ili awe na kiasi/akili timamu
  rationale: Tafsiri kuu inaleta maana ya hukumu yenye kiasi na akili timamu bila kuifanya kuwa fundisho mahususi la unyenyekevu pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa umoja wa kila mmoja umehifadhiwa. Alama zote za tanbihi zimewekwa katika matini kuu.
