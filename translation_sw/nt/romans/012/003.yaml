  to: Kwa maana, kwa neema niliyopewa, ninamwambia kila mmoja aliye miongoni mwenu asijione kuwa wa maana kuliko inavyompasa, bali afikiri kwa kiasi[a], kadiri Mungu alivyomgawia kila mmoja kipimo cha imani.[b]
