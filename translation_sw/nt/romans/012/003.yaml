    rationale: Kigiriki hurudia φρονεῖν lakini hakisemi ἑαυτόν katika sehemu hii; σωφρονεῖν huelekea kwenye fikira zenye kiasi, utimamu, na busara.
  - severity: medium
    issue: 'Tanbihi b ina mbadala usio kamili kisarufi: “kipimo cha kumtumaini.”'
    rationale: Kumtumaini kwa kawaida huhitaji yambwa anayejulikana. Mbadala wa nomino “kipimo cha tumaini” huepuka kuongeza yambwa ambaye hayumo katika Kigiriki.
