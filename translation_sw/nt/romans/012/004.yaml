  text: καθάπερ γὰρ ἐν ἑνὶ σώματι ⸂πολλὰ μέλη⸃ ἔχομεν, τὰ δὲ μέλη πάντα οὐ τὴν αὐτὴν ἔχει πρᾶξιν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/004.yaml
  text: For just as in one body we have many members[a], but the members do not all have the same function[b],
translation:
  language: sw
  text: Kwa maana, kama vile katika mwili mmoja tuna viungo vingi[a], lakini si viungo vyote vina kazi ileile[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sehemu nyingi za mwili.”
    reason: lexical_alternative
  - marker: b
    text: Au “shughuli ileile.” Neno la Kigiriki linaweza kumaanisha shughuli au kazi; hapa “kazi” inafaa katika sitiari ya mwili na muktadha wa tofauti za utendaji.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθάπερ
  choice: kama vile
  rationale: Huanzisha ulinganisho unaokamilishwa katika mstari unaofuata; ni usemi wa kawaida na wa wazi katika Kiswahili.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Huhifadhi uhusiano wa maelezo na himizo lililotangulia.
- source_word: ἐν ἑνὶ σώματι
  choice: katika mwili mmoja
  rationale: Huhifadhi moja kwa moja taswira ya mwili mmoja bila kutaja kanisa kabla ya wakati wake katika hoja.
- source_word: πολλὰ μέλη
  choice: viungo vingi
  rationale: “Viungo” ni neno la kawaida kwa sehemu za mwili na linafaa pia katika matumizi ya sitiari ya jumuiya.
- source_word: ἔχομεν
  choice: tuna
  rationale: Hutoa moja kwa moja maana ya kitenzi cha wakati uliopo na nafsi ya kwanza wingi.
- source_word: τὰ δὲ μέλη πάντα ... οὐ
  choice: lakini si viungo vyote
  rationale: Mpangilio huu wa Kiswahili unaonyesha kwamba ukanushi unahusu kuwa vyote vina kazi moja, si kwamba hakuna kiungo chenye kazi hiyo.
- source_word: τὴν αὐτὴν ἔχει πρᾶξιν
  choice: vina kazi ileile
  rationale: Katika sitiari ya mwili, “kazi” huwasilisha kwa lugha ya kawaida maana ya shughuli au dhima inayotekelezwa bila kuifanya kuwa istilahi ya kiufundi.
theological_decisions:
- issue: Nguvu ya kikanisa ya sitiari ya mwili
  choice: Kutafsiri tu “mwili mmoja” na “viungo vingi” bila kulitaja kanisa waziwazi katika mstari huu.
  alternative: “mwili mmoja, yaani kanisa”
  rationale: Mstari huu unaweka ulinganisho, huku matumizi yake kwa jumuiya ya waamini yakifafanuliwa katika mstari unaofuata. Hivyo maendeleo ya hoja ya Paulo yanahifadhiwa.
- issue: Maana ya πρᾶξις katika tofauti za viungo
  choice: kazi
  alternative: shughuli; dhima
  rationale: Neno la Kigiriki linaweza kumaanisha shughuli au kazi inayotekelezwa. “Kazi” linafaa kwa viungo vya mwili na haliongezi mpangilio maalumu wa nyadhifa za kanisa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na heshima. Muundo wa ulinganisho umeachwa wazi ili ukamilishwe na mstari unaofuata. Alama zote za tanbihi zimewekwa katika matini kuu.
