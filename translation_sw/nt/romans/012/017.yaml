  yaml_path: translation/nt/romans/012/017.yaml
  text: Repaying no one evil for evil[a], but taking thought for what is good in the sight of all people.
translation:
  language: sw
  text: Msimlipe mtu yeyote uovu kwa uovu; bali fikirieni mapema yaliyo mema[a] mbele ya watu wote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “yaliyo ya heshima” au “yaliyo adhimu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδενὶ
  choice: mtu yeyote
  rationale: 'Pamoja na kikanushi cha sentensi, usemi huu unaonyesha upeo wa jumla: kutomlipa mtu yeyote.'
- source_word: κακὸν ἀντὶ κακοῦ
  choice: uovu kwa uovu
  rationale: Unadumisha nguvu ya kimaadili ya κακόν na wazo la kulipiza kwa kutoa uovu badala ya uovu uliotendwa.
- source_word: ἀποδιδόντες
  choice: Msimlipe
  rationale: Ingawa ni hali ya kushiriki katika Kigiriki, katika muktadha huu ina nguvu ya agizo; 'kulipa' huwasilisha tendo la kurudisha alichotendewa mtu.
- source_word: προνοούμενοι
  choice: Jitahidini kufanya
  rationale: Huwasilisha wazo la kufikiria mapema na kuchukua hatua kwa uangalifu, kwa Kiswahili cha kawaida na chenye mtiririko wa asili.
- source_word: καλὰ
  choice: yaliyo mema
  rationale: Ni chaguo pana linalohifadhi maana ya wema wa kimaadili bila kuifungia katika sifa au mwonekano wa kijamii pekee.
- source_word: ἐνώπιον πάντων ἀνθρώπων
  choice: machoni pa watu wote
  rationale: Huhifadhi taswira ya kuwa mbele ya macho ya wote na maana ya uwazi na uwajibikaji wa hadharani; ἀνθρώπων ni ya kijumla, hivyo 'watu' inafaa.
theological_decisions:
- issue: Maana ya kimaadili na kijamii ya καλά katika mazingira ya hadharani
  choice: yaliyo mema
  alternative: yaliyo ya heshima au yaliyo bora
  rationale: Neno linaweza kuhusisha wema wa kimaadili pamoja na kile kinachoonekana kuwa cha heshima. Matini kuu inatumia maana pana, huku tanbihi ikihifadhi vivuli vingine halali vya maana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa maagizo ya wingi unafuata muktadha wa kuwasihi waamini, na usemi 'machoni pa watu wote' unadumisha taswira ya Kigiriki bila kuwa mgumu kueleweka.
