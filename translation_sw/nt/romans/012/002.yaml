source:
  edition: SBLGNT
  text: καὶ μὴ ⸀συσχηματίζεσθε τῷ αἰῶνι τούτῳ, ἀλλὰ ⸀μεταμορφοῦσθε τῇ ἀνακαινώσει τοῦ ⸀νοός, εἰς τὸ δοκιμάζειν ὑμᾶς τί τὸ θέλημα τοῦ θεοῦ, τὸ ἀγαθὸν καὶ εὐάρεστον καὶ τέλειον.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/002.yaml
  text: And do not be conformed to this age[a], but be transformed by the renewing of your mind[c][b], so that you may discern what the will of God is—the good and pleasing and perfect.
translation:
  language: sw
  text: Wala msijifananishe na enzi hii[a], bali mgeuzwe kwa kufanywa upya kwa akili zenu, ili mpate kupambanua mapenzi ya Mungu—mema, yanayopendeza[c], na makamilifu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “dunia hii.” Neno la Kigiriki αἰών humaanisha hasa “enzi,” yaani kipindi au mpangilio wa sasa.
    reason: lexical_alternative
  - marker: b
    text: Au, “ili mpate kuyajaribu na kuyakubali mapenzi ya Mungu.” Kitenzi cha Kigiriki kinaweza kuhusisha kujaribu na kutambua kuwa jambo limekubalika.
    reason: lexical_alternative
  - marker: c
    text: “Yanayopendeza” huenda yakamaanisha yanayompendeza Mungu; pia neno hili linaweza kutafsiriwa “yanayokubalika.”
    reason: lexical_alternative
lexical_decisions:
- source_word: συσχηματίζεσθε
  choice: msijifananishe
  rationale: Kitenzi hiki kinakataa kujipatia au kupokea umbo la nje linalolingana na kielelezo fulani. “Msijifananishe” ni Kiswahili cha sasa kinachoeleweka na kinahifadhi tofauti na badiliko la ndani linalofuata.
- source_word: αἰῶνι τούτῳ
  choice: enzi hii
  rationale: αἰών hapa inaelekeza kwenye kipindi na mpangilio wa sasa, si ulimwengu ulioumbwa kwa ujumla; kwa hiyo “enzi hii” ni sahihi kuliko “dunia hii.”
- source_word: μεταμορφοῦσθε
  choice: mbadilishwe
  rationale: Hali ya kutendwa imehifadhiwa, nayo inaonyesha badiliko kubwa la hali au umbo, kinyume na kujifananisha kwa nje.
- source_word: τῇ ἀνακαινώσει τοῦ νοός
  choice: kwa kufanywa upya kwa akili zenu
  rationale: Dativu imetafsiriwa kama njia ya badiliko. “Akili zenu” huwasilisha νοῦς kama uwezo wa kufikiri na kupambanua kimaadili; umilikishi umewekwa wazi kwa sababu ya muktadha wa watu wengi wanaoambiwa.
- source_word: εἰς τὸ δοκιμάζειν
  choice: ili mpate kupambanua
  rationale: Muundo unaonyesha kusudi au matokeo. “Kupambanua” huwasilisha kutathmini na kutambua lililo sahihi bila kudokeza kwamba mwanadamu anaihukumu nia ya Mungu.
- source_word: τὸ ἀγαθὸν καὶ εὐάρεστον καὶ τέλειον
  choice: yaliyo mema, yanayopendeza, na makamilifu
  rationale: Vivumishi vitatu vinaeleza “mapenzi ya Mungu.” Upatanisho wa kisarufi wa Kiswahili umetumika kwa “mapenzi,” huku mpangilio na uzito wa sifa hizo ukihifadhiwa.
theological_decisions:
- issue: Maana ya αἰών katika tofauti ya kimaadili
  choice: enzi hii
  alternative: dunia hii
  rationale: “Enzi hii” huhifadhi mtazamo wa Paulo kuhusu kipindi na mpangilio wa sasa bila kuifanya dunia iliyoumbwa yenyewe kuwa kitu kinachokataliwa.
- issue: Nguvu ya δοκιμάζειν kuhusu mapenzi ya Mungu
  choice: kupambanua
  alternative: kuyajaribu na kuyakubali kuwa yanafaa
  rationale: Neno linaweza kuhusisha kujaribu, kutambua, na kukubali kilicho thabiti. “Kupambanua” ni la kawaida na haliondoi kabisa upeo huo; maana pana imeonyeshwa katika tanbihi.
- issue: Mhusika anayependezwa katika εὐάρεστον
  choice: yanayopendeza
  alternative: yanayompendeza Mungu
  rationale: Kigiriki hakitaji wazi mhusika anayependezwa. Tafsiri kuu imeacha uwezekano huo wazi badala ya kuamua kimya kwamba ni Mungu, ingawa hilo linawezekana katika muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Wala” linaendeleza uhusiano wa aya na agizo lililotangulia. Lugha imewekwa wazi kwa wasomaji wa kawaida huku hali ya kutendwa katika “mbadilishwe,” tofauti ya umbo la nje na badiliko la ndani, na utata halisi wa “yanayopendeza” vikihifadhiwa.
