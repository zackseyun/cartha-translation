review_pass:
  verdict: revise
  source_fidelity: The draft conveys both paired exhortations, but “shindaneni kutangulizana” can be heard as competing to get ahead of one another. προηγούμενοι in this context calls believers to take the initiative in according honor to others. The revision makes the direction of that initiative explicit while retaining the emphatic, reciprocal force reflected in the English audit trail’s “outdo one another.”
  naturalness: “Katika kuwaheshimu wenzenu, shindaneni kuwatanguliza” is clear, idiomatic Standard East African Swahili. It avoids the potentially self-advancing sense of “kutangulizana.”
  terminology: “Upendo wa kindugu” appropriately renders φιλαδελφία. “Wapendeni wenzenu kwa upendo wa dhati” naturally communicates φιλόστοργοι as warm, heartfelt familial affection. “Kuwaheshimu” and “kuwatanguliza” accurately express honor and taking the lead in giving it.
  issues:
  - severity: medium
    issue: “Shindaneni kutangulizana” is directionally ambiguous.
    rationale: Without an explicit object, it may suggest that each person should strive to go ahead of the other, whereas the Greek context concerns taking the lead in honoring fellow believers.
  revised_text: Katika upendo wa kindugu, wapendeni wenzenu kwa upendo wa dhati; katika kuwaheshimu wenzenu, shindaneni kuwatanguliza.
