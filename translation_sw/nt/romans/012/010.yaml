  yaml_path: translation/nt/romans/012/010.yaml
  text: In brotherly love, be affectionate toward one another; in honor, outdo one another.
translation:
  language: sw
  text: Katika upendo wa kindugu, wapendeni wenzenu kwa upendo wa dhati; katika kuwaheshimu wenzenu, shindaneni kuwatanguliza.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φιλαδελφίᾳ
  choice: upendo wa kindugu
  rationale: Neno hili humaanisha upendo wa ndugu na dada, na hapa linahusu uhusiano wa waamini kama familia.
- source_word: φιλόστοργοι
  choice: pendaneni kwa moyo
  rationale: Huwasilisha upendo wenye uchangamfu na mshikamano wa kifamilia kwa Kiswahili cha kawaida bila kurudia tu neno “kindugu.”
- source_word: τιμῇ
  choice: katika kuheshimiana
  rationale: “Heshima” ndio maana ya msingi; umbo la kutendeana linaendana na ἀλλήλους na muktadha wa wajibu wa kila mmoja kwa mwenzake.
- source_word: προηγούμενοι
  choice: shindaneni kutangulizana
  rationale: Kitenzi kinaweza kumaanisha kwenda mbele, kuongoza, au kumpa mwingine nafasi ya kwanza. Tafsiri hii inadumisha nguvu ya wazo la “outdo” huku ikieleza kwamba ushindani huo ni wa kuwapa wengine heshima kwanza.
theological_decisions:
- issue: Maana ya προηγούμενοι katika agizo kuhusu heshima
  choice: shindaneni kutangulizana
  alternative: mpeni kila mmoja mwenzake nafasi ya kwanza katika heshima
  rationale: Chaguo hili halifanyi mstari kuwa agizo la kujitafutia heshima, bali huhifadhi msukumo wake wa bidii na ushindani mwema katika kuwaheshimu wengine.
