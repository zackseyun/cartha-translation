  yaml_path: translation/nt/romans/012/018.yaml
  text: If possible[a], as far as it depends on you, live at peace with all people.
translation:
  language: sw
  text: Ikiwezekana[a], kwa kadiri inavyowategemea ninyi, ishini kwa amani na watu wote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ikiwa inawezekana, kwa upande wenu, kaeni kwa amani na watu wote.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δυνατόν
  choice: Ikiwezekana
  rationale: Ni usemi wa kawaida wa Kiswahili unaohifadhi sharti la uwezekano bila kulifanya agizo hili kuwa ahadi kwamba amani itapatikana kila mara.
- source_word: τὸ ἐξ ὑμῶν
  choice: kwa kadiri inavyowategemea ninyi
  rationale: Unabainisha sehemu iliyo ndani ya uwezo na wajibu wa wasomaji, huku ukitambua kwamba mwitikio wa wengine hauwategemei wao.
- source_word: μετὰ πάντων ἀνθρώπων
  choice: na watu wote
  rationale: Neno ἀνθρώπων linawahusu wanadamu kwa ujumla, si wanaume pekee; “watu wote” ni la kawaida na sahihi katika Kiswahili.
- source_word: εἰρηνεύοντες
  choice: ishini kwa amani
  rationale: Ingawa ni kitenzi shiriki katika Kigiriki, katika muktadha huu kina nguvu ya agizo; “ishini” pia huonyesha mwenendo unaoendelea, si hali ya muda mfupi tu.
theological_decisions:
- issue: Upeo na kikomo cha himizo
  choice: Waumini wanahimizwa kuishi kwa amani na kila mtu, lakini wajibu wao unawekewa mpaka wa kile kilicho ndani ya uwezo wao.
  alternative: Kuamuru amani bila masharti, au kudokeza kwamba waumini wakitenda sawa lazima amani ipatikane daima.
  rationale: Misemo εἰ δυνατόν na τὸ ἐξ ὑμῶν inadumisha mvutano kati ya wito wa amani kwa wote na ukweli kwamba kuifikia amani hakutegemei upande mmoja pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Wingi wa “ninyi” umewekwa wazi ili kuonyesha kwamba ὑμῶν ni ya wingi.
