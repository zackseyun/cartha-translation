  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: τῇ ἐλπίδι χαίροντες, τῇ θλίψει ὑπομένοντες, τῇ προσευχῇ προσκαρτεροῦντες,
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/012.yaml
  text: rejoicing in hope[a], enduring in affliction, persisting in prayer[b],
translation:
  language: sw
  text: Mkifurahi katika tumaini, mkivumilia katika dhiki[a], mkidumu katika sala[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “katika taabu”; neno la Kigiriki linaweza kumaanisha shinikizo kali, shida, au mateso.
    reason: lexical_alternative
  - marker: b
    text: Au “mkijitoa kwa sala”; neno la Kigiriki linasisitiza kuendelea kwa uthabiti na kujitoa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλπίδι
  choice: katika tumaini
  rationale: Nomino hii humaanisha tumaini au tarajio. Kirai hiki cha Kiswahili ni cha kawaida na kinadumisha uhusiano wa tumaini na furaha bila kuongeza kibainishi kisichohitajika.
- source_word: χαίροντες
  choice: mkifurahi
  rationale: Umbo la kitenzi cha kuendelea limetafsiriwa kwa muundo wa ‘mki-’, unaofaa katika mfululizo huu wa mawaidha na kuonyesha hali au tendo linaloendelea.
- source_word: θλίψει
  choice: katika dhiki
  rationale: ‘Dhiki’ huwasilisha shinikizo, taabu, au mateso mazito kwa lugha fupi, ya kawaida, na yenye uzito unaolingana na neno la Kigiriki.
- source_word: ὑπομένοντες
  choice: mkivumilia
  rationale: ‘Kuvumilia’ huonyesha kustahimili kwa uthabiti chini ya hali ngumu, huku kukidumisha umbo sambamba la vitenzi katika mstari.
- source_word: προσευχῇ
  choice: katika sala
  rationale: ‘Sala’ ni neno la kawaida la Kiswahili kwa tendo la kumwomba Mungu; kirai ‘katika sala’ kinafuata muundo wa vifungu vingine vya mstari.
- source_word: προσκαρτεροῦντες
  choice: mkidumu
  rationale: ‘Kudumu’ huonyesha kuendelea kwa uthabiti na kujitoa, bila kupunguza maana kuwa kurudia tendo pekee.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo mfupi, wenye heshima na unaoeleweka. Muundo wa ‘mki-’ umetumiwa mara tatu kuhifadhi mfuatano na usambamba wa vihusishi vya Kigiriki. Alama za tanbihi zimewekwa baada ya maneno yanayohusika; mpangilio huu unasahihisha kutolingana kwa alama na maelezo katika safu ya Kiingereza.
