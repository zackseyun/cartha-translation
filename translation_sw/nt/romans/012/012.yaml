  source_fidelity: 'Tafsiri inafuata kwa uaminifu mfululizo wa virai vya dativu na vishiriki vya wakati wa sasa: furaha inayohusishwa na tumaini, ustahimilivu katikati ya dhiki, na kudumu kwa uthabiti katika sala. Muundo wa “mki-” unaweka vizuri usambamba wa kimawaidha wa matendo yanayoendelea, bila kuongeza maana ya mafundisho.'
