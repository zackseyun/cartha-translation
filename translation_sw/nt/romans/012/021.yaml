  text: Do not be overcome by evil[a], but overcome evil with good.
translation:
  language: sw
  text: Usishindwe na uovu[a], bali ushinde uovu kwa wema.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Usikubali kushindwa na kilicho kiovu, bali ushinde kilicho kiovu kwa kilicho chema.” Kigiriki kinatumia vivumishi vya jinsia ya kati vilivyotumiwa kama nomino; vinaweza kutafsiriwa kama dhana (“uovu,” “wema”) au kama “kilicho kiovu” na “kilicho chema.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ νικῶ
  choice: Usishindwe
  rationale: Kitenzi hiki ni agizo la kukataza katika hali ya kutendwa, nafsi ya pili umoja. “Usishindwe” ni Kiswahili cha kawaida na huhifadhi picha ya kushindwa au kutawaliwa.
- source_word: ὑπὸ τοῦ κακοῦ
  choice: na uovu
  rationale: ὑπό pamoja na hali ya jenitivi huonyesha mtendaji au kisababishi katika sentensi ya kutendwa. “Na uovu” ni ya asili katika Kiswahili na huhifadhi maana pana ya kimaadili ya τοῦ κακοῦ.
- source_word: ἀλλὰ νίκα
  choice: bali ushinde
  rationale: ἀλλά huleta ulinganisho mkali, na νίκα ni agizo la hali ya kutenda, nafsi ya pili umoja. “Ushinde” huhifadhi uhusiano wa kileksia na “usishindwe” na nguvu ya agizo.
- source_word: ἐν τῷ ἀγαθῷ
  choice: kwa wema
  rationale: ἐν pamoja na dativu hapa inaonyesha njia au chombo. “Kwa wema” ni usemi wa kawaida unaoonyesha kwamba wema ndio njia ya kuushinda uovu.
- source_word: τὸ κακόν
  choice: uovu
  rationale: Kivumishi hiki cha jinsia ya kati kilichotumiwa kama nomino kinaweza kumaanisha “uovu” au “kilicho kiovu.” “Uovu” hudumisha ufupi na ulinganisho wa kimaadili na “wema.”
theological_decisions:
- issue: Iwapo κακός/ἀγαθός zitafsiriwe kama dhana za kimaadili au zibinafsishwe kuwa viumbe binafsi
  choice: 'Dhana za kimaadili: “uovu” na “wema”'
  alternative: “kilicho kiovu” na “kilicho chema,” au kumfanya mwovu kuwa nafsi kama “yule mwovu”
  rationale: Maumbo ya Kigiriki ya jinsia ya kati yanaunga mkono maana dhahania au ya sifa, na muktadha unahusu mwitikio wa kimaadili kwa matendo mabaya. Hakuna ulazima wa kisintaksia wa kumrejelea Shetani au nafsi nyingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Muundo mfupi wa kinzani na marudio ya mzizi -shind- huhifadhi nguvu ya balagha ya Kigiriki.
