  yaml_path: translation/nt/romans/014/001.yaml
  text: Receive the one who is weak in faith[b][a], not for disputes over opinions.
translation:
  language: sw
  text: Mpokeeni[a] mtu aliye dhaifu katika imani, si kwa kusudi la kubishania maoni.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mkaribisheni.” Kitenzi cha Kigiriki kinaweza kumaanisha kumpokea mtu katika kundi au ushirika.
    reason: lexical_alternative
  - marker: b
    text: Au, “si kwa ajili ya kuyahukumu mawazo yanayobishaniwa,” au “si kwa ajili ya mabishano kuhusu hoja.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσθενοῦντα
  choice: mtu aliye dhaifu
  rationale: Kitenzi-shirikishi chenye kibainishi kimetumiwa kama nomino. Tafsiri hii inadumisha wazo la udhaifu bila kuongeza ‘dhamiri,’ ambalo halipo wazi katika mstari huu.
- source_word: τῇ πίστει
  choice: katika imani
  rationale: Hapa hali ya udhaifu inaelezwa kuwa katika eneo au upande wa imani. ‘Katika imani’ haifanyi neno hilo limaanishe moja kwa moja mfumo maalumu wa mafundisho.
- source_word: προσλαμβάνεσθε
  choice: Mpokeeni
  rationale: Amri hii ya wingi inahusu kumchukua mtu kwenu na kumkubali katika ushirika. ‘Mpokeeni’ ni pana na yenye hadhi; ‘Mkaribisheni’ ni mbadala wa kawaida.
- source_word: μὴ εἰς
  choice: lakini si kwa ajili ya
  rationale: Muundo huu unaonyesha kusudi au matokeo yasiyofaa ambayo yanapaswa kuepukwa.
- source_word: διακρίσεις
  choice: kubishana
  rationale: Katika muktadha huu neno linaashiria kutoa hukumu au kutofautisha mawazo kwa njia inayoleta mabishano, si kufanya tofauti isiyo na ugomvi.
- source_word: διαλογισμῶν
  choice: maoni
  rationale: Neno linaweza kumaanisha mawazo, hoja, au maoni yanayojadiliwa. ‘Maoni’ ni lugha ya sasa inayoeleweka, huku tanbihi ikihifadhi uwezekano mwingine.
- source_word: δὲ
  choice: lakini
  rationale: Kiunganishi hiki kinaonyesha mpito wenye tofauti ndogo na agizo lililotangulia katika muktadha; ‘lakini’ pia huunganisha kwa kawaida agizo kuu na katazo linalofuata.
theological_decisions:
- issue: Maana ya πίστις
  choice: imani
  alternative: tumaini; uaminifu
  rationale: Muktadha unahusu udhaifu wa mwamini katika msimamo au usadikisho kuhusu mambo yanayobishaniwa. ‘Imani’ inadumisha upana wa neno la Kigiriki bila kulifanya liwe ‘dhamiri’ au mfumo rasmi wa mafundisho.
- issue: Maana ya kifungu διακρίσεις διαλογισμῶν
  choice: kubishana kuhusu maoni
  alternative: kuyahukumu mawazo yanayobishaniwa; mabishano kuhusu hoja
  rationale: Uhusiano kati ya nomino hizi mbili unaweza kueleweka kwa zaidi ya njia moja. Matini kuu inatoa maana inayofaa katika Kiswahili cha sasa, na tanbihi inadumisha utata huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi, na inayoeleweka kwa wasomaji wa kawaida. Uwingi wa amri umehifadhiwa katika ‘Mpokeeni,’ na ufafanuzi wa ziada kama ‘dhamiri’ umeepukwa.
