  text: Μηκέτι οὖν ἀλλήλους κρίνωμεν· ἀλλὰ τοῦτο κρίνατε μᾶλλον, τὸ μὴ τιθέναι πρόσκομμα τῷ ἀδελφῷ ἢ σκάνδαλον.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/013.yaml
  text: 'Therefore, let us no longer judge one another, but rather decide this: not to put a stumbling block or an offense before a brother.'
translation:
  language: sw
  text: 'Kwa hiyo, tusiendelee kuhukumiana, bali, badala yake, amueni hili: msitie kikwazo au mtego katika njia ya ndugu.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ndugu au dada”; Kigiriki kinasema “ndugu” katika umoja, likimaanisha hapa mwamini mwenzao.
    reason: alternative_reading
  - marker: b
    text: Au, “sababu ya kuanguka.” Hapa “mtego” ni kitu kinachomfanya mwingine aanguke katika dhambi, si jambo linaloumiza hisia tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μηκέτι
  choice: tusiendelee
  rationale: Huonyesha kukoma kwa tendo lililokuwa likiendelea, na pamoja na hali ya kuhimiza ya kitenzi hutoa wito wa asili kwa Kiswahili.
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Huhifadhi uhusiano wa kimantiki na hoja iliyotangulia.
- source_word: ἀλλήλους
  choice: kuhumiana
  rationale: Neno la kurejeana linaelezwa kwa njia fupi na ya kawaida katika Kiswahili.
- source_word: κρίνωμεν
  choice: tusiendelee kuhukumiana
  rationale: Huhifadhi wito wa pamoja na maana ya kutoa hukumu juu ya wengine bila kuibana kuwa hukumu ya mwisho ya kuadhibu.
- source_word: ἀλλὰ τοῦτο κρίνατε μᾶλλον
  choice: bali afadhali amueni jambo hili
  rationale: ‘Amueni’ huonyesha matumizi ya pili ya κρίνω kama kufanya uamuzi kuhusu mwenendo binafsi, huku ‘afadhali’ ikiwakilisha μᾶλλον.
- source_word: τὸ μὴ τιθέναι
  choice: kutoweka
  rationale: Hutoa kwa ufupi maudhui ya uamuzi unaotakiwa.
- source_word: πρόσκομμα
  choice: kikwazo
  rationale: Huhifadhi picha ya kitu kinachomfanya mwingine ajikwae katika mwenendo wa kiroho au kimaadili.
- source_word: τῷ ἀδελφῷ
  choice: mbele ya ndugu
  rationale: Hufuata umoja wa kiume wa Kigiriki na picha ya kuweka kitu katika njia ya mwamini mwingine.
- source_word: ἢ
  choice: au
  rationale: Huhifadhi kiunganishi cha uchaguzi cha Kigiriki bila kulazimisha tofauti kali kati ya maneno yanayokaribiana.
- source_word: σκάνδαλον
  choice: mtego
  rationale: Katika muktadha huu ni kitu kinachomnasa au kumwangusha mwingine katika dhambi, si jambo linaloumiza hisia tu; pia linatofautishwa kwa kiasi na ‘kikwazo.’
theological_decisions:
- issue: Maana ya ἀδελφῷ katika umoja unaowakilisha kundi
  choice: ndugu
  alternative: ndugu wa kiume au wa kike; mwamini mwenzako
  rationale: Maandishi makuu yanahifadhi umoja wa kiume wa chanzo, huku tanbihi ikifafanua kuwa katika muktadha huu anamrejelea mwamini mwenzao kwa ujumla.
- issue: Nguvu ya kimaadili ya σκάνδαλον
  choice: mtego
  alternative: sababu ya kuanguka; kitu cha kumkwaza
  rationale: ‘Mtego’ hudokeza kitu kinachomwingiza mwingine katika dhambi, si kukera hisia pekee, bila kufuta ukaribu wake wa kimaana na πρόσκομμα.
- issue: Urudiaji wa κρίνω
  choice: kuhukumiana ... amueni
  alternative: kuhukumiana ... hukumuni
  rationale: 'Tofauti ya Kiswahili huweka wazi ugeuzi wa balagha: waache kuwahukumu wengine, wafanye uamuzi kuhusu mwenendo wao wenyewe.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo unahifadhi mantiki ya mstari, wito wa pamoja, umoja wa ‘ndugu,’ na tofauti ya kimuktadha kati ya kuhukumu wengine na kuamua mwenendo unaofaa.
