  text: ἐάν τε γὰρ ζῶμεν, τῷ κυρίῳ ζῶμεν, ἐάν τε ἀποθνῄσκωμεν, τῷ κυρίῳ ἀποθνῄσκομεν. ἐάν τε οὖν ζῶμεν ἐάν τε ἀποθνῄσκωμεν, τοῦ κυρίου ἐσμέν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/008.yaml
  text: For if we live[a], we live to the Lord, and if we die, we die to the Lord. So then, whether we live or whether we die[b], we are the Lord’s.
translation:
  language: sw
  text: Kwa maana, tukiishi[a], tunaishi kwa Bwana; na tukifa, tunakufa kwa Bwana. Basi, tukiishi au tukifa, sisi ni wa Bwana[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa ajili ya Bwana” katika vifungu vinavyorudiwa, “tunaishi kwa Bwana” na “tunakufa kwa Bwana.” Dativu ya Kigiriki inaweza kuonyesha uhusiano, mwelekeo, au manufaa; “kwa Bwana” imechaguliwa ili kuhifadhi upana huo wa maana.
    reason: lexical_alternative
  - marker: b
    text: Au, “sisi ni mali ya Bwana.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐάν τε γὰρ
  choice: Kwa maana tukiishi
  rationale: “Kwa maana” huhifadhi kazi ya γάρ ya kueleza hoja iliyotangulia, nayo “tukiishi” huwasilisha hali inayowekwa na ἐάν τε kwa Kiswahili cha kawaida.
- source_word: ζῶμεν / ζῶμεν
  choice: tukiishi / tunaishi
  rationale: Tofauti kati ya kisharti katika sentensi tegemezi na taarifa katika sentensi kuu inaonyeshwa kiasili kwa “tukiishi” na “tunaishi.”
- source_word: τῷ κυρίῳ
  choice: kwa ajili ya Bwana
  rationale: Usemi huu ni wa kawaida na wazi kwa Kiswahili, ukionyesha kwamba maisha na kifo vinaelekezwa kwa Bwana. Tanbihi huhifadhi upana wa dativu ya Kigiriki, ambayo inaweza pia kueleza uhusiano au manufaa.
- source_word: κύριος
  choice: Bwana
  rationale: “Bwana” ni tafsiri ya kawaida yenye heshima na uzito wa kitheolojia, bila kufafanua zaidi ya maandishi kuhusu mhusika anayerejelewa.
- source_word: ἀποθνῄσκωμεν / ἀποθνῄσκομεν
  choice: tukifa / tunakufa
  rationale: Maneno haya yanaonyesha kifo kwa ujumla; Kiswahili hutofautisha kiasili kisharti “tukifa” na taarifa kuu “tunakufa.”
- source_word: οὖν
  choice: Basi
  rationale: “Basi” huonyesha hitimisho linalotokana na vipashio vilivyotangulia kwa mtindo wa asili na wenye hadhi.
- source_word: τοῦ κυρίου ἐσμέν
  choice: sisi ni wa Bwana
  rationale: Muundo huu mfupi na wa kawaida huhifadhi umilikaji wa genitivi na kusisitiza kuwa sisi ni wake Bwana.
theological_decisions:
- issue: Mhusika na maana ya κύριος
  choice: Jina la cheo “Bwana” limehifadhiwa bila kumtaja mhusika kwa ufafanuzi zaidi.
  alternative: “Mtawala” au kumtaja moja kwa moja Yesu Kristo.
  rationale: Muktadha wa karibu unaelekea kwa Kristo, lakini Kigiriki chenyewe kinasema tu “Bwana”; tafsiri haipaswi kuondoa mwangwi mpana wa cheo hicho.
- issue: Maana ya kuishi na kufa τῷ κυρίῳ
  choice: “kwa ajili ya Bwana,” huku tanbihi ikieleza upana wa uhusiano unaoweza kudokezwa.
  alternative: “kwa Bwana” au “kumwelekea Bwana.”
  rationale: Dativu inaweza kuonyesha uhusiano, mwelekeo, au manufaa. Tafsiri kuu ni Kiswahili cha asili, lakini tanbihi inazuia maana isifinywe kuwa huduma au kusudi pekee.
- issue: Nguvu ya τοῦ κυρίου ἐσμέν
  choice: “sisi ni wa Bwana.”
  alternative: “sisi ni mali ya Bwana” au “tunamilikiwa na Bwana.”
  rationale: Muundo uliochaguliwa huhifadhi kwa ufupi maana ya kuwa wake Bwana bila kuifanya kuwa lugha kali zaidi ya umilikaji kuliko ilivyo lazima.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wazi, na wenye hadhi. Mlingano wa vipashio “tukiishi/tukifa” na marudio ya “kwa ajili ya Bwana” umehifadhiwa ili kuonyesha muundo wa hoja ya Kigiriki.
