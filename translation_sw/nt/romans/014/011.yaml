base_translation:
  language: en
  yaml_path: translation/nt/romans/014/011.yaml
  text: 'For it is written: “As I live[a], says the Lord, every knee will bow to me, and every tongue will confess to God.”'
translation:
  language: sw
  text: 'Kwa maana imeandikwa: “Kama niishivyo, asema Bwana, kila goti litainama mbele yangu, na kila ulimi utamkiri Mungu[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “atamtambua Mungu waziwazi” au “atamsifu Mungu.” Kitenzi cha Kigiriki kinaweza kuwa na maana ya kukiri, kutambua waziwazi, au kusifu kulingana na muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: γέγραπται
  choice: imeandikwa
  rationale: Ni usemi wa kawaida wa Kiswahili wa kutanguliza nukuu ya Maandiko, na unadumisha hali ya mamlaka ya yaliyoandikwa.
- source_word: Ζῶ ἐγώ
  choice: Kama niishivyo
  rationale: Unadumisha muundo na uzito wa tamko la kiapo la Kigiriki kwa Kiswahili fasaha cha kibiblia.
- source_word: κύριος
  choice: Bwana
  rationale: Ni tafsiri ya moja kwa moja ya κύριος; haiingizi jina la Mungu ambalo halipo wazi katika maandishi ya Kigiriki.
- source_word: ἐμοὶ κάμψει πᾶν γόνυ
  choice: kila goti litapiga magoti mbele yangu
  rationale: Ni usemi wa kawaida na unaoeleweka katika Kiswahili unaohifadhi taswira ya kila goti kuinama kwa unyenyekevu, ingawa ‘mbele yangu’ huwasilisha dative kwa njia ya kiidioma.
- source_word: πᾶσα γλῶσσα
  choice: kila ulimi
  rationale: Unahifadhi taswira halisi ya kiungo cha mwili na mwangwi wake wa kimaandiko badala ya kuibadili kuwa ‘kila mtu.’
- source_word: ἐξομολογήσεται
  choice: utamkiri
  rationale: Kitenzi hiki kinaweza kumaanisha kukiri, kutambua wazi, au kusifu. ‘Utamkiri’ kinahifadhi maana kuu ya kukiri hadharani, huku tanbihi ikihifadhi upana wa maana.
- source_word: τῷ θεῷ
  choice: Mungu
  rationale: Muundo ‘kumkiri Mungu’ huwasilisha dative ya Kigiriki kwa njia ya kawaida ya Kiswahili kupitia kiambishi cha yambwa katika kitenzi.
theological_decisions:
- issue: Uhusiano kati ya “Bwana,” “mbele yangu,” na “Mungu” ndani ya nukuu
  choice: Kudumisha mfuatano “asema Bwana ... mbele yangu ... atamkiri Mungu” bila kusawazisha viwakilishi na marejeo.
  alternative: Kubadili mwisho kuwa “atanikiri” au kueleza wazi ndani ya tafsiri kwamba Bwana hapa anatambulishwa na Mungu.
  rationale: Maandishi yenyewe yanahama kutoka usemi wa nafsi ya kwanza wa Bwana kwenda kwa “Mungu.” Tafsiri inapaswa kuhifadhi mvutano huo wa maandishi bila kuamua kimyakimya hitimisho la kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo “Kama niishivyo” umehifadhiwa kwa sababu ya uzito wake wa kiapo, na “litapiga magoti mbele yangu” limetumiwa kama tamathali ya asili ya Kiswahili.
