  text: καλὸν τὸ μὴ φαγεῖν κρέα μηδὲ πιεῖν οἶνον μηδὲ ἐν ᾧ ὁ ἀδελφός σου προσκόπτει ⸂ἢ σκανδαλίζεται ἢ ἀσθενεῖ⸃·
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/021.yaml
  text: It is good not to eat meat or drink wine or do anything by which your brother stumbles or is offended or is weakened[a].
translation:
  language: sw
  text: Ni vizuri kutokula nyama wala kunywa divai wala kufanya jambo lolote ambalo linamfanya ndugu yako ajikwae, akwazike, au adhoofike.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika muktadha, “ndugu yako” anaweza kumaanisha ndugu wa kiume au wa kike—yaani, mwamini mwenzako.
    reason: lexical_alternative
lexical_decisions:
- source_word: καλὸν
  choice: Ni vizuri
  rationale: Hutathmini mwenendo huu kuwa unaofaa na wa kusifiwa kimaadili; ni usemi wa kawaida na wenye hadhi katika Kiswahili.
- source_word: τὸ μὴ φαγεῖν κρέα
  choice: kutokula nyama
  rationale: Huhifadhi muundo wa tendo lililokanushwa, huku κρέα ikieleweka kiasili kuwa nyama ya chakula.
- source_word: μηδὲ πιεῖν οἶνον
  choice: wala kunywa divai
  rationale: ‘Wala’ huunganisha kwa usahihi tendo la pili la kujizuia.
- source_word: μηδὲ ἐν ᾧ
  choice: wala kufanya jambo lolote ambalo
  rationale: Kirai cha Kigiriki kina udondoshaji wa neno la tendo; ‘kufanya jambo lolote ambalo’ hukamilisha maana inayodokezwa kwa Kiswahili cha kawaida bila kuibana kwa tendo fulani.
- source_word: ὁ ἀδελφός σου
  choice: ndugu yako
  rationale: ‘Ndugu’ ni kisawe cha kawaida cha ἀδελφός na, kwa umbo hili, ‘yako’ hahitaji kuonyesha jinsia; muktadha unaonyesha mwamini mwenzako.
- source_word: προσκόπτει
  choice: ajikwae
  rationale: Huhifadhi sitiari ya kugonga kikwazo na kuanguka, hapa ikiwa na maana ya madhara ya kiroho au kimaadili.
- source_word: σκανδαλίζεται
  choice: akosewe
  rationale: Hutofautisha kitenzi hiki na προσκόπτει na kuonyesha kuathiriwa au kutiwa katika hali ya kukwazwa; maana yake ina mwingiliano wa kweli na ‘ajikwae’.
- source_word: ἀσθενεῖ
  choice: adhoofike
  rationale: Huonyesha kuwa dhaifu au kudhoofishwa katika muktadha wa dhamiri na imani bila kuongeza neno ‘kiroho’ lisilosemwa wazi.
theological_decisions:
- issue: Maana wakilishi ya ἀδελφός
  choice: ndugu yako
  alternative: mwamini mwenzako
  rationale: Kigiriki kina nomino ya umoja yenye umbo la kiume, lakini ‘ndugu’ la Kiswahili linaweza kumrejelea kaka au dada. Tanbihi inaweka wazi maana pana ya kimuktadha bila kubadili usemi wa kifamilia wa Paulo.
- issue: Uhusiano kati ya προσκόπτει na σκανδαλίζεται
  choice: ajikwae, akosewe
  alternative: ajikwae, asababishwe kujikwaa
  rationale: Vitenzi vina maana zinazokaribiana lakini si lazima zifanane kabisa. Tafsiri hii huhifadhi tofauti fulani bila kuficha mwingiliano na mvutano wa lugha ya chanzo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa ‘wala ... wala ...’ huakisi mfululizo wa μηδέ; sentensi inabaki rahisi kueleweka huku ikihifadhi sitiari na tofauti za vitenzi vya Kigiriki.
