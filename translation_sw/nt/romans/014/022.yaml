base_translation:
  language: en
  yaml_path: translation/nt/romans/014/022.yaml
  text: The faith that you have[a], keep to yourself before God[b]. Blessed is the one who does not judge himself by what he approves.
translation:
  language: sw
  text: Imani uliyo nayo[a], iweke kwa nafsi yako mbele za Mungu. Heri mtu asiyejihukumu[b] kwa jambo analolikubali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Usadikisho ulio nao, uweke kwa nafsi yako mbele za Mungu.” Neno la Kigiriki πίστις kwa kawaida hutafsiriwa “imani,” lakini hapa linaweza kumaanisha usadikisho binafsi kuhusu mambo yanayobishaniwa.
    reason: lexical_alternative
  - marker: b
    text: Au, “Heri mtu asiyejitia hatiani kwa jambo analolikubali.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστιν
  choice: imani
  rationale: Hufuata tafsiri ya msingi ya πίστις, huku muktadha ukionyesha kuwa hapa ni imani au usadikisho wa mtu kuhusu mambo yanayobishaniwa.
- source_word: κατὰ σεαυτὸν
  choice: jiwekee mwenyewe
  rationale: Kauli hii ya Kiswahili inaonyesha kwamba mtu asiwalazimishe wengine msimamo wake, bali aubaki nao yeye mwenyewe; pia inahifadhi nguvu ya amri ἔχε.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: mbele za Mungu
  rationale: Ni usemi wa kawaida na wenye hadhi unaohifadhi wazo la kuwajibika katika uwepo wa Mungu.
- source_word: μακάριος
  choice: Heri
  rationale: ‘Heri’ ni neno la kawaida katika lugha ya Biblia ya Kiswahili na linabeba uzito wa kimaadili na wa kiroho, si hisia ya furaha tu.
- source_word: κρίνων ἑαυτὸν
  choice: asiyejihukumu
  rationale: ‘Kujihukumu’ inadumisha upana wa κρίνω kati ya kujipima kwa hukumu na kujitia hatiani; maana kali zaidi imewekwa katika tanbihi.
- source_word: ἐν ᾧ δοκιμάζει
  choice: kwa jambo analolikubali
  rationale: δοκιμάζει hapa ni kukubali jambo baada ya kulipima; ‘kwa jambo’ huonyesha kuwa jambo hilo ndilo msingi au njia ya kujihukumu.
theological_decisions:
- issue: Maana ya πίστις katika muktadha wa mambo yanayobishaniwa
  choice: imani inayoeleweka kimuktadha kuwa usadikisho binafsi mbele za Mungu kuhusu jambo husika
  alternative: imani ya jumla kwa Mungu; uaminifu; usadikisho
  rationale: Muktadha wa Waroma 14 unahusu mazoea yanayobishaniwa na dhamiri. Neno ‘imani’ linadumisha istilahi kuu bila kuifanya iwe imani iokoayo hasa, na maana ya ‘usadikisho’ imehifadhiwa katika tanbihi.
- issue: Nguvu ya κρίνων ἑαυτὸν
  choice: kujisitiri katika maana pana ya ‘kujihukumu’
  alternative: kujitia hatiani
  rationale: Kitenzi κρίνω kinaweza kumaanisha kuhukumu au kutia hatiani. Tafsiri kuu inahifadhi upana huo, huku tanbihi ikionyesha maana kali inayowezekana katika muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imeweka tofauti kati ya ‘jiwekee mwenyewe’ na ‘mbele za Mungu’ badala ya kuziunganisha kuwa usemi mmoja. ‘Heri’ na ‘mbele za Mungu’ ni misemo inayoeleweka kwa wasomaji wa kawaida bila kuwa ya dhehebu fulani.
