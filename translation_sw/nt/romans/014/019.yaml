base_translation:
  language: en
  yaml_path: translation/nt/romans/014/019.yaml
  text: So then[a], let us pursue what makes for peace and what builds up one another.
translation:
  language: sw
  text: Kwa hiyo, tufuatilie mambo yanayoleta amani na mambo yanayojenga na kuimarisha mmoja na mwingine.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄρα οὖν
  choice: Kwa hiyo
  rationale: Chembe hizi mbili zinatoa hitimisho kutokana na hoja iliyotangulia; “Kwa hiyo” ni ya kawaida na yenye hadhi katika Kiswahili.
- source_word: τὰ τῆς εἰρήνης
  choice: mambo yanayoleta amani
  rationale: Muundo huu unamaanisha mambo yanayohusu au kuendeleza amani; tafsiri hii ni wazi bila kuwa ngumu.
- source_word: διώκωμεν
  choice: na tufuatilie
  rationale: Kiima cha pamoja na hali ya kuhimiza vinatoa mwito wa kuendelea kutenda kwa bidii; “tufuatilie” huhifadhi nguvu ya kitenzi bila kudokeza mateso.
- source_word: τὰ τῆς οἰκοδομῆς
  choice: yale yanayojengana
  rationale: Neno lina picha ya kujenga kwa maana ya kuimarisha watu; “yanayojengana” huhifadhi sitiari hiyo kwa Kiswahili cha kawaida.
- source_word: τῆς εἰς ἀλλήλους
  choice: -ana katika “yanayojengana”
  rationale: Kiambishi cha kutendeana “-ana” kinaonyesha wazi kujengana kwa pande zote ndani ya jumuiya.
theological_decisions:
- issue: Upeo wa kujengana katika jumuiya
  choice: Waumini wanahimizwa kwa pamoja kutafuta amani na kujengana.
  alternative: Kulichukulia hasa kuwa himizo la kila mtu kujiboresha mwenyewe.
  rationale: Hali ya kuhimiza katika nafsi ya kwanza wingi pamoja na ἀλλήλους inaonyesha tendo la pamoja na la kutendeana; tafsiri haiongezi msimamo wa dhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imehifadhi urudiaji wa mawazo mawili ya Kigiriki kwa “mambo ... na yale ...”, huku ikitumia muundo wa asili wa Kiswahili.
