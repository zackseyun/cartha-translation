- from: Kwa hiyo, na tufuatilie mambo yanayoleta amani na yale yanayojengana.
  to: Kwa hiyo, tufuatilie mambo yanayoleta amani na mambo yanayojenga na kuimarisha mmoja na mwingine.
  rationale: The revision retains the draft’s clear idiomatic rendering of ‘what makes for peace’ and the energetic communal exhortation ‘tufuatilie.’ It replaces the ambiguous and grammatically misdirected “yanayojengana” with wording that explicitly identifies peace-promoting and mutually strengthening matters, faithfully representing τὰ τῆς οἰκοδομῆς τῆς εἰς ἀλλήλους without imposing a theological interpretation.
