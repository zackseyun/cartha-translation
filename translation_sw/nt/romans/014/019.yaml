review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly conveys the inferential conclusion, the hortatory plural, pursuit of peace, and the communal orientation. However, “yanayojengana” is not an accurate or natural rendering of τὰ τῆς οἰκοδομῆς τῆς εἰς ἀλλήλους: it makes the plural ‘things’ themselves reciprocal agents (‘things that build one another’) rather than expressing matters that contribute to the mutual building up of people.'
  naturalness: “Kwa hiyo, na tufuatilie” is understandable but slightly awkward because ‘kwa hiyo’ already supplies the inferential transition and ‘na’ is unnecessary. “Tujitahidi kufuata” is less direct than διώκωμεν; “tufuatilie” is suitable once the redundant conjunction is removed. “mambo yanayojenga na kuimarisha mmoja na mwingine” is natural modern Standard East African Swahili and clearly carries the reciprocal communal sense.
  terminology: Amani is appropriate for εἰρήνη. “Kujenga na kuimarisha” retains the construction/edification metaphor while making its intended interpersonal sense clear. “Mmoja na mwingine” is a standard reciprocal expression and avoids the grammatical ambiguity of the draft’s -ana form.
  issues:
  - severity: medium
    issue: “yanayojengana” mislocates the reciprocal action.
    rationale: The Greek refers to ‘the things of building up for one another,’ not to things that build one another. In Swahili, the reciprocal suffix on this relative verb naturally predicates reciprocal building of the antecedent mambo/yale, creating an unintended sense.
  - severity: low
    issue: The conjunction ‘na’ after ‘Kwa hiyo’ is stylistically redundant.
    rationale: The paired inferential particles are adequately rendered by ‘Kwa hiyo’; beginning the exhortation directly with ‘tufuatilie’ is smoother and retains the conclusion-plus-exhortation force.
  revised_text: Kwa hiyo, tufuatilie mambo yanayoleta amani na mambo yanayojenga na kuimarisha mmoja na mwingine.
  revised_footnotes: []
  revision_rationale: The revision retains the draft’s clear idiomatic rendering of ‘what makes for peace’ and the energetic communal exhortation ‘tufuatilie.’ It replaces the ambiguous and grammatically misdirected “yanayojengana” with wording that explicitly identifies peace-promoting and mutually strengthening matters, faithfully representing τὰ τῆς οἰκοδομῆς τῆς εἰς ἀλλήλους without imposing a theological interpretation.
