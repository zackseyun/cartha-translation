base_translation:
  language: en
  yaml_path: translation/nt/romans/014/004.yaml
  text: Who are you to judge another's household servant? He stands or falls before his own lord[a], and he will be made to stand[c][b], for the Lord is able to make him stand.
translation:
  language: sw
  text: Wewe ni nani hata umhukumu mtumwa wa nyumbani wa mtu mwingine? Mbele ya bwana wake mwenyewe yeye husimama au huanguka. Lakini atasimamishwa[a], kwa maana Bwana anaweza kumsimamisha.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, atafanywa asimame; umbo la Kigiriki ni la kutendwa na linaonyesha kwamba mwingine ndiye anayemsimamisha.
    reason: translation_clarity
  - marker: b
    text: Baadhi huelewa “Bwana” hapa kuwa bwana wa mtumwa katika mfano; hata hivyo, huenda Paulo anamrejelea Bwana katika maana ya kitheolojia.
    reason: alternative_reading
lexical_decisions:
- source_word: σὺ τίς εἶ ὁ κρίνων
  choice: Wewe ni nani hata umhukumu
  rationale: Kauli hii ya Kiswahili inahifadhi msisitizo wa σὺ na changamoto ya balagha, huku ikisomeka kwa kawaida.
- source_word: ἀλλότριον οἰκέτην
  choice: mtumishi wa nyumbani wa mtu mwingine
  rationale: οἰκέτης humaanisha mtumishi wa nyumba na katika mazingira ya kale angeweza kuwa mtumwa; 'mtumishi wa nyumbani' ni ya asili na yenye heshima katika Kiswahili, huku tanbihi ikihifadhi hali ya kijamii inayowezekana.
- source_word: τῷ ἰδίῳ κυρίῳ
  choice: mbele ya bwana wake mwenyewe
  rationale: Dative inaonyesha kwamba kusimama au kuanguka kwake kunahusu hukumu ya bwana wake. 'Mbele ya' huwasilisha uwajibikaji huo kwa uwazi.
- source_word: στήκει ἢ πίπτει
  choice: husimama au huanguka
  rationale: Inahifadhi jozi ya sitiari na hali ya sasa bila kuifafanua kupita kiasi.
- source_word: σταθήσεται
  choice: atasimamishwa
  rationale: Inahifadhi umbo la wakati ujao lisilotenda na hivyo kudokeza mtendaji anayemsimamisha, ambaye anatajwa katika kishazi kinachofuata.
- source_word: δυνατεῖ γὰρ ὁ κύριος στῆσαι αὐτόν
  choice: kwa maana Bwana anaweza kumsimamisha
  rationale: Inahifadhi sababu inayoletwa na γάρ, uwezo wa Bwana, na urudiaji wa mzizi wa 'kusimama'.
theological_decisions:
- issue: Mhusika anayerejelewa na ὁ κύριος katika kishazi cha mwisho
  choice: Bwana, katika maana ya kitheolojia
  alternative: bwana wake ndani ya mfano wa mtumishi wa nyumbani
  rationale: Matumizi yenye kibainishi na muktadha wa Paulo yanaelekea kumrejelea Bwana wa mwamini, huku mwangwi wa mfano wa bwana wa nyumbani ukiendelea. Herufi kubwa inaonyesha usomaji unaowezekana zaidi, na tanbihi inahifadhi utata halisi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Bwana' limeandikwa kwa herufi ndogo kwa bwana wa nyumbani na kwa herufi kubwa katika kishazi cha mwisho ili kuonyesha usomaji wa kitheolojia unaowezekana zaidi. Alama zote za tanbihi zimo katika matini.
