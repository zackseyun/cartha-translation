  text: οἶδα καὶ πέπεισμαι ἐν κυρίῳ Ἰησοῦ ὅτι οὐδὲν κοινὸν δι’ ⸀ἑαυτοῦ· εἰ μὴ τῷ λογιζομένῳ τι κοινὸν εἶναι, ἐκείνῳ κοινόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/014.yaml
  text: I know and am persuaded in the Lord Jesus that nothing is unclean in itself; except that to the one who considers anything to be unclean[a], to that person it is unclean.
translation:
  language: sw
  text: Ninajua, nami nimesadiki katika Bwana Yesu kwamba hakuna kitu kilicho najisi kwa asili yake; ila kwa mtu anayekiona kitu chochote kuwa najisi[a], kitu hicho ni najisi kwake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “cha kawaida.” Katika muktadha huu, neno la Kigiriki huweza kurejelea kitu kinachochukuliwa kuwa najisi kiibada au kisicho kitakatifu.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἶδα
  choice: Ninajua
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kitenzi cha kujua.
- source_word: πέπεισμαι
  choice: nimesadiki
  rationale: Wakati timilifu unaonyesha usadikisho thabiti uliofikiwa na unaoendelea.
- source_word: ἐν κυρίῳ Ἰησοῦ
  choice: katika Bwana Yesu
  rationale: Inahifadhi kihusishi ἐν na kutofafanua kupita kiasi kama maana ni ‘kwa njia ya’ au ‘katika ushirika na’ Bwana Yesu.
- source_word: κοινόν
  choice: najisi
  rationale: Katika muktadha wa vyakula na usafi wa kidini, κοινός hurejelea kitu kinachoonwa kuwa najisi au kisichofaa kidini, si tu kitu cha kawaida.
- source_word: δι’ ἑαυτοῦ
  choice: kwa asili yake
  rationale: Ni Kiswahili cha kawaida kinachoeleza kwamba kitu si najisi ndani yake chenyewe; hakidai kuwa hali hiyo inasababishwa na kitu kingine.
- source_word: τῷ λογιζομένῳ
  choice: kwa mtu anayekiona
  rationale: Huwasilisha tendo la kukihesabu au kukichukulia kitu kuwa na hali fulani kwa lugha ya kawaida.
- source_word: τι
  choice: kitu fulani
  rationale: Inahifadhi hali isiyo maalumu ya kiwakilishi katika kauli hii ya jumla.
- source_word: ἐκείνῳ κοινόν
  choice: kwake huyo ni najisi
  rationale: Inahifadhi msisitizo wa kiwakilishi ἐκείνῳ kwamba hali hiyo inamhusu mtu huyo hasa.
theological_decisions:
- issue: Maana ya κοινός kuhusiana na chakula na usafi wa kidini
  choice: najisi
  alternative: cha kawaida
  rationale: Hoja ya Paulo ni kwamba hakuna kitu kilicho najisi kwa asili yake, lakini dhamiri ya mtu anayekiona hivyo inafanya kiwe najisi kwake. ‘Najisi’ huwasilisha muktadha wa usafi wa kidini bila kudai unajisi wa kiasili; maana halisi zaidi imehifadhiwa katika tanbihi.
- issue: Uhusiano unaoonyeshwa na ἐν κυρίῳ Ἰησοῦ
  choice: katika Bwana Yesu
  alternative: kwa Bwana Yesu
  rationale: Muundo wa Kigiriki unaweza kuhusisha mamlaka, ushirika, au nafasi ya Paulo ndani ya Bwana. Tafsiri ya ‘katika’ inalinda upana huo badala ya kuufanya useme chanzo pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. ‘Nimesadiki’ huhifadhi uzito wa usadikisho uliothibitika; ‘kwa asili yake’ ni ya kawaida kuliko tafsiri kavu ya ‘kupitia chenyewe.’
