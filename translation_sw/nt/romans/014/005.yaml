  text: Ὃς ⸀μὲν κρίνει ἡμέραν παρ’ ἡμέραν, ὃς δὲ κρίνει πᾶσαν ἡμέραν· ἕκαστος ἐν τῷ ἰδίῳ νοῒ πληροφορείσθω·
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/005.yaml
  text: One person judges one day above another day[a], while another judges every day alike[c][b]. Let each one be fully convinced in his own mind.
translation:
  language: sw
  text: Mtu mmoja huona siku moja kuwa muhimu kuliko nyingine[a], lakini mwingine huona kila siku kuwa sawa[b]. Kila mmoja na awe na uhakika kamili katika akili yake mwenyewe[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mtu mmoja huitathmini siku moja kuwa bora kuliko nyingine.”
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “kila siku”; katika muktadha maana inayodokezwa ni kwamba siku zote ni sawa.
    reason: lexical_alternative
  - marker: c
    text: Au, “na asadikishwe kabisa” au “na awe na hakika kabisa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίνει
  choice: huona ... kuwa muhimu / huona ... kuwa sawa
  rationale: Katika muktadha huu kitenzi kinaonyesha kufanya tathmini au kutofautisha, si kuhukumu kwa maana ya kulaani. Muundo huu ni wa kawaida katika Kiswahili na unaweka wazi ulinganisho.
- source_word: ἡμέραν παρ’ ἡμέραν
  choice: siku moja kuwa muhimu kuliko nyingine
  rationale: παρά inaonyesha ulinganisho kati ya siku. Tafsiri haibainishi kuwa ni Sabato, sikukuu, au siku za kufunga, kwa kuwa Kigiriki hakufanyi hivyo.
- source_word: πᾶσαν ἡμέραν
  choice: kila siku kuwa sawa
  rationale: Kihalisi ni ‘kila siku’; neno ‘sawa’ linaeleza utofauti unaodokezwa na kishazi cha kwanza bila kuongeza aina maalumu ya siku.
- source_word: ἕκαστος
  choice: kila mmoja
  rationale: Huhifadhi maana ya umoja inayogawa wajibu kwa kila mtu, na ni Kiswahili cha kawaida chenye maana jumuishi.
- source_word: ἐν τῷ ἰδίῳ νοῒ
  choice: katika akili yake mwenyewe
  rationale: νοῦς hapa ni akili au ufahamu ambamo mtu hufikia msimamo. ‘Yake mwenyewe’ huhifadhi msisitizo wa Kigiriki.
- source_word: πληροφορείσθω
  choice: na awe na uhakika kamili
  rationale: Amri hii inaonyesha kusadikishwa au kuwa na uhakika timilifu kuhusu msimamo wa mtu; haimaanishi tu kuwa na maoni ya muda.
theological_decisions:
- issue: Aina ya siku zinazozungumziwa
  choice: 'Kuacha rejeo kuwa la jumla: ‘siku’'
  alternative: Kuzitaja kuwa Sabato, sikukuu za Kiyahudi, au siku za kufunga
  rationale: Paulo hataji aina ya siku. Kutobainisha kunahifadhi upana na utata halisi wa andiko.
- issue: Maana ya πᾶσαν ἡμέραν katika utofauti wa hoja
  choice: ‘kila siku kuwa sawa’
  alternative: ‘kila siku’ pekee
  rationale: ‘Kuwa sawa’ ni maana inayodokezwa na ulinganisho, lakini inawekwa katika tanbihi kuwa si maneno tofauti yaliyo wazi katika Kigiriki.
- issue: Uhakika wa dhamiri binafsi
  choice: ‘katika akili yake mwenyewe’
  alternative: ‘katika dhamiri yake’
  rationale: Andiko lina νοῦς, ‘akili/ufahamu,’ si neno la kawaida la Kigiriki kwa ‘dhamiri’; kwa hiyo tafsiri haibadilishi dhana hiyo kuwa dhamiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Sentensi inaweka ulinganisho wazi kwa msomaji wa kawaida, huku tanbihi zikihifadhi ukaribu na muundo wa Kigiriki na maana mbadala.
