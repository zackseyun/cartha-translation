id: ROM.14.6
reference: Romans 14:6
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὁ φρονῶν τὴν ἡμέραν κυρίῳ ⸀φρονεῖ. καὶ ὁ ἐσθίων κυρίῳ ἐσθίει, εὐχαριστεῖ γὰρ τῷ θεῷ· καὶ ὁ μὴ ἐσθίων κυρίῳ οὐκ ἐσθίει, καὶ εὐχαριστεῖ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/006.yaml
  text: The one who observes the day[a], observes it for the Lord. And the one who eats, eats for the Lord, for he gives thanks to God; and the one who does not eat, does not eat for the Lord, and he gives thanks to God.
translation:
  language: sw
  text: Anayeizingatia siku hiyo[a], huizingatia kwa ajili ya Bwana. Naye anayekula, anakula kwa ajili ya Bwana, kwa maana anamshukuru Mungu; na asiyekula, hali kwa ajili ya Bwana, naye anamshukuru Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Anayeipa siku hiyo umuhimu”; kitenzi cha Kigiriki kinaweza kumaanisha kuelekeza fikira kwenye jambo au kulipa uzito. Hapa huenda kinamaanisha kuizingatia siku.
    reason: lexical_alternative
lexical_decisions:
- source_word: φρονῶν / φρονεῖ
  choice: anayeiadhimisha / anaiadhimisha
  rationale: Katika muktadha wa kuipa siku fulani umuhimu wa kiutendaji, “kuadhimisha” huwasilisha kitendo cha kuitunza au kuizingatia siku hiyo, huku tanbihi ikihifadhi upana wa kitenzi cha Kigiriki.
- source_word: ἡμέραν
  choice: siku hiyo
  rationale: Kiambishi cha kuonyesha umaalumu katika Kigiriki kinaelekeza kwenye siku inayozungumziwa katika muktadha, bila kubainisha kuwa ni Sabato, sikukuu, au siku ya kufunga.
- source_word: κυρίῳ
  choice: kwa ajili ya Bwana
  rationale: Dativu inaonyesha mwelekeo au kusudi la tendo; “kwa ajili ya Bwana” ni Kiswahili cha kawaida na hudumisha kwamba tendo linafanywa kwa kumwelekea Bwana.
- source_word: ἐσθίων / ἐσθίει
  choice: anayekula / anakula
  rationale: Wakati uliopo unaonyesha desturi au mwenendo wa kawaida katika suala la chakula linalojadiliwa.
- source_word: εὐχαριστεῖ
  choice: anamshukuru
  rationale: Huwasilisha tendo la kutoa shukrani moja kwa moja kwa Mungu kwa Kiswahili cha asili.
- source_word: θεῷ
  choice: Mungu
  rationale: Kiambishi cha yambwa katika “anamshukuru Mungu” huonyesha kwa kawaida anayeelekezewa shukrani bila kuhitaji kihusishi.
- source_word: ὁ μὴ ἐσθίων
  choice: asiyekula
  rationale: Tafsiri hii inaakisi moja kwa moja muundo hasi wa Kigiriki na kudumisha ulinganifu na “anayekula.”
theological_decisions:
- issue: Maana ya kuadhimisha “siku hiyo”
  choice: Rejeo la jumla kwa kuitunza au kuipa umuhimu siku fulani katika mjadala wa Waroma 14
  alternative: Rejeo mahsusi kwa Sabato, sikukuu za Kiyahudi, au siku za kufunga
  rationale: Maneno ya Paulo hayataji aina ya siku; tafsiri haipaswi kuingiza utambulisho mwembamba wa kimadhehebu au wa kihistoria.
- issue: Anayerejelewa na κύριος
  choice: Bwana
  alternative: Mungu
  rationale: Tafsiri inadumisha neno “Bwana,” ambalo katika muktadha wa Paulo kwa kawaida humrejelea Bwana Yesu, huku shukrani ikielekezwa wazi kwa Mungu; haitatui kimya kimya utofauti huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Ulinganifu wa anayekula na asiyekula umehifadhiwa, na sentensi haibainishi siku wala aina ya chakula zaidi ya maandishi ya Kigiriki.
