lexical_decisions:
- source_word: ἄρα
  choice: Basi
  rationale: Huonyesha hitimisho linalotokana na hoja iliyotangulia; ni la kawaida na wazi katika Kiswahili cha sasa.
- source_word: ἕκαστος ἡμῶν
  choice: kila mmoja wetu
  rationale: Huhifadhi maana ya mgawanyo wa kila mtu mmoja mmoja ndani ya kundi linalosemwa kwa ἡμῶν.
- source_word: περὶ ἑαυτοῦ
  choice: habari zake mwenyewe
  rationale: Katika muundo wa Kiswahili, kirai hiki pamoja na λόγον δώσει kinaeleza kwamba kila mtu atatoa hesabu inayomhusu yeye mwenyewe; 'mwenyewe' huhifadhi msisitizo wa kiwakilishi rejeshi.
- source_word: λόγον
  choice: habari
  rationale: Katika nahau λόγον δώσει, 'kutoa habari' ni usemi wa Kiswahili unaoeleweka kwa maana ya kueleza au kuwajibika kuhusu matendo; huepuka tafsiri halisi isiyo ya kawaida ya 'neno'.
- source_word: δώσει
  choice: atatoa
  rationale: Ni kitenzi cha wakati ujao kinacholingana moja kwa moja na future active indicative ya δίδωμι na kinakamilisha nahau 'atatoa habari'.
theological_decisions:
- issue: Kiwakilishi rejeshi cha umoja katika kauli inayomhusu kila mtu
  choice: habari zake mwenyewe
  alternative: habari zao wenyewe / atajieleza mwenyewe
  rationale: Huhifadhi uwasilishaji wa Kigiriki wa kila mtu mmoja mmoja bila kuifanya kauli kuwa ya wingi, huku ikitumika kwa watu wote bila kuingiza msimamo wa kimadhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Kutoa habari zake mwenyewe' ni ya asili zaidi kuliko 'kutoa hesabu kuhusu nafsi yake,' huku ikihifadhi wazo la uwajibikaji wa kila mtu binafsi.
