  text: So then[a], each of us will give an account of himself.
translation:
  language: sw
  text: Basi[a], kila mmoja wetu atatoa hesabu kuhusu yeye mwenyewe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Kwa hiyo.”
