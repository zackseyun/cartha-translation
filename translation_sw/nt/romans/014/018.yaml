  text: ὁ γὰρ ἐν ⸀τούτῳ δουλεύων τῷ Χριστῷ εὐάρεστος τῷ θεῷ καὶ δόκιμος τοῖς ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/018.yaml
  text: For the one who serves the Messiah in this way is pleasing to God and approved by men.
translation:
  language: sw
  text: Kwa maana anayemtumikia Kristo kwa njia hii humpendeza Mungu na hukubaliwa na watu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: kwa njia hii
  rationale: Huhifadhi rejeo la namna ya kumtumikia Kristo katika muktadha uliotangulia, kwa Kiswahili cha kawaida na cha asili.
- source_word: δουλεύων τῷ Χριστῷ
  choice: anayemtumikia Kristo
  rationale: Kitenzi ‘kumtumikia’ kinaonyesha huduma na utiifu unaoelekezwa kwa Kristo bila kuongeza wazo lisilokuwamo katika maandishi.
- source_word: εὐάρεστος τῷ θεῷ
  choice: humpendeza Mungu
  rationale: Ni usemi wa asili wa Kiswahili unaowasilisha kuwa mtu huyo anakubalika na kumpa Mungu furaha.
- source_word: δόκιμος τοῖς ἀνθρώποις
  choice: kukubaliwa na watu
  rationale: ‘Kukubaliwa’ huwasilisha maana ya kuonekana kuwa amethibitishwa au kustahili baada ya kupimwa; ‘watu’ ni tafsiri jumuishi na ya kawaida ya ἀνθρώποις.
theological_decisions:
- issue: Rejeo la ἐν τούτῳ (‘katika hili/kwa njia hii’)
  choice: kwa njia hii
  alternative: katika jambo hili
  rationale: Uchaguzi unaunganisha mstari na mwenendo ulioelezwa katika muktadha bila kufafanua kupita kiasi ni jambo gani hasa, hivyo huhifadhi upeo wa rejeo.
- issue: Jina Χριστός
  choice: Kristo
  alternative: Masihi
  rationale: ‘Kristo’ ndilo jina la cheo lililozoeleka katika tafsiri za Agano Jipya za Kiswahili na hapa linafuata moja kwa moja neno la Kigiriki Χριστός, bila kuondoa maana yake ya Kimasihi.
- issue: Maana ya δόκιμος mbele ya watu
  choice: kukubaliwa na watu
  alternative: kuthibitishwa kuwa anafaa na watu
  rationale: ‘Kukubaliwa’ ni fasaha na hakudai kwamba watu ndio wanaotoa hukumu ya mwisho ya kiroho; huonyesha tathmini nzuri ya kijamii inayotajwa na Paulo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Muundo umewekwa kwa sentensi moja fupi, ukihifadhi uhusiano wa sababu unaoletwa na γάρ (‘Kwa maana’).
