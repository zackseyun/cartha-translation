  text: ὁ δὲ διακρινόμενος ἐὰν φάγῃ κατακέκριται, ὅτι οὐκ ἐκ πίστεως· πᾶν δὲ ὃ οὐκ ἐκ πίστεως ἁμαρτία ⸀ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/023.yaml
  text: But the one who doubts is condemned if he eats[a], because it is not from faith; and everything that is not from faith is sin.
translation:
  language: sw
  text: Lakini mtu mwenye mashaka akila, amehukumiwa, kwa sababu kitendo chake hakitokani na imani;[a] na kila jambo lisilotokana na imani ni dhambi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa sababu kitendo chake hakitokani na usadikisho.” Kigiriki kinasema “kutokana na imani,” jambo linaloweza kujumuisha maana ya kutenda kwa usadikisho thabiti mbele za Mungu.
    reason: lexical_alternative
lexical_decisions:
- source_word: διακρινόμενος
  choice: mwenye mashaka
  rationale: Katika muktadha wa mashaka kuhusu vyakula, neno hili linaonyesha kusitasita moyoni, si kubishana na wengine.
- source_word: ἐὰν φάγῃ
  choice: akila
  rationale: Muundo huu wa Kiswahili unaonyesha sharti kwa njia ya kawaida na ya sasa.
- source_word: κατακέκριται
  choice: amehukumiwa
  rationale: Huhifadhi hali inayotokana na tendo bila kumtaja anayehukumu, kwa kuwa Kigiriki hakumtaji wazi.
- source_word: ὅτι
  choice: kwa sababu
  rationale: Huonyesha wazi sababu ya hukumu.
- source_word: ἐκ πίστεως
  choice: kwa imani / kutokana na imani
  rationale: ‘Imani’ huhifadhi msamiati wa Paulo, huku miundo miwili ya Kiswahili ikilingana na matumizi yake katika vifungu viwili vya sentensi.
- source_word: πᾶν ... ὃ
  choice: kila jambo lisilo...
  rationale: Ni Kiswahili cha kawaida kinachohifadhi upeo mpana wa usemi wa Kigiriki.
- source_word: ἁμαρτία ἐστίν
  choice: ni dhambi
  rationale: Huhifadhi kauli ya moja kwa moja na yenye uzito kuliko ‘ni jambo la dhambi.’
theological_decisions:
- issue: Maana ya πίστις katika muktadha wa maadili
  choice: imani
  alternative: usadikisho; uhakika wa moyoni
  rationale: ‘Imani’ huhifadhi istilahi pana ya Paulo, bila kuifinya iwe maoni binafsi tu; tanbihi inaeleza maana ya kutenda kwa usadikisho thabiti mbele za Mungu.
- issue: Upeo wa hukumu katika κατακέκριται
  choice: amehukumiwa
  alternative: amejihukumu; amehukumiwa na Mungu
  rationale: Kigiriki hakimtaji anayetoa hukumu. Tafsiri ya kutendwa huhifadhi uwezekano huo bila kuamua kwamba ni dhamiri, Mungu, au vyote viwili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. ‘Mwenye mashaka’ ni usemi wa kawaida unaoonyesha kusitasita kwa ndani; ‘amehukumiwa’ huhifadhi hali ya kitenzi timilifu na kutomtaja mhukumu.
