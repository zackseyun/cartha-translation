review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the inward doubting (ὁ διακρινόμενος), the conditional eating, the unspecified passive condemnation (κατακέκριται), and the concluding categorical statement. However, “hakula kwa imani” shifts the Greek's present causal idea into a completed past act and makes the phrasing less coherent with the conditional clause. The source says that the eating is not ‘from faith,’ not specifically that he ‘did not eat by faith.’
  naturalness: “Mwenye mashaka akila” is understandable, but “Mtu mwenye mashaka akila” reads more naturally and makes the conditional relation clear. “Kwa sababu kitendo chake hakitokani na imani” is idiomatic modern Standard East African Swahili and accurately states the reason without an awkward tense shift.
  terminology: “Imani,” “amehukumiwa,” and “dhambi” are appropriate and preserve the theological vocabulary and the Greek passive's ambiguity. The footnote's alternative should correspond to the revised main-text wording; “usadikisho” is suitable in this context, while retaining ‘imani’ in the text.
  issues:
  - severity: medium
    issue: The phrase “kwa sababu hakula kwa imani” uses a past-negative verb and can imply that he failed to eat in faith, rather than that his action does not arise from faith.
    rationale: ὅτι οὐκ ἐκ πίστεως is a causal statement about the basis/source of the action. Recasting it as “kitendo chake hakitokani na imani” preserves this force and avoids an unnecessary past-tense interpretation.
  - severity: low
    issue: The footnote alternative is worded as though it modifies a completed event (“tendo hilo halitokani”), while the main text currently says “hakula.”
    rationale: Aligning both with the source-oriented expression ‘does not proceed from faith’ improves internal consistency.
  revised_text: Lakini mtu mwenye mashaka akila, amehukumiwa, kwa sababu kitendo chake hakitokani na imani;[a] na kila jambo lisilotokana na imani ni dhambi.
  revised_footnotes:
  - marker: a
    text: Au, “kwa sababu kitendo chake hakitokani na usadikisho.” Kigiriki kinasema “kutokana na imani,” jambo linaloweza kujumuisha maana ya kutenda kwa usadikisho thabiti mbele za Mungu.
    reason: lexical_alternative
  revision_rationale: Revision is limited to the causal clause and its footnote. It retains the source's ambiguity about the condemning agent, its conditional force, and Paul’s term “faith,” while expressing ἐκ πίστεως naturally as an action’s source in Kiswahili.
