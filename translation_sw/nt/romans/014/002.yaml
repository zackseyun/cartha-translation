id: ROM.14.2
reference: Romans 14:2
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὃς μὲν πιστεύει φαγεῖν πάντα, ὁ δὲ ἀσθενῶν λάχανα ἐσθίει.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/002.yaml
  text: One person believes he may eat anything[b][a], but the one who is weak eats vegetables.
translation:
  language: sw
  text: Mtu mmoja anaamini kwamba anaweza kula kila kitu[a], lakini aliye dhaifu[b] hula mboga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “amesadikishwa kwamba anaweza kula vitu vyote.”
    reason: lexical_alternative
  - marker: b
    text: Katika muktadha, “aliye dhaifu” humaanisha aliye dhaifu katika imani au dhamiri kuhusu desturi za chakula (tazama Rum. 14:1).
    reason: cross_reference
lexical_decisions:
- source_word: ὃς μὲν
  choice: Mtu mmoja
  rationale: Huanzisha upande wa kwanza wa ulinganisho; usemi huu ni wa kawaida na huhifadhi umoja bila kusisitiza jinsia.
- source_word: πιστεύει
  choice: anaamini
  rationale: Pamoja na kitenzi-jina kinachofuata, neno hili linaeleza imani au usadikisho wa mtu kuhusu chakula; ‘anaamini’ huhifadhi uhusiano wa kileksika na dhana ya imani.
- source_word: φαγεῖν πάντα
  choice: kwamba anaweza kula kila kitu
  rationale: Hueleza maudhui ya imani hiyo. ‘Anaweza’ hapa huwasilisha ruhusa inayodokezwa na muktadha wa desturi za chakula, huku ‘kila kitu’ ikihifadhi upana wa πάντα.
- source_word: ὁ δὲ
  choice: lakini aliye
  rationale: Huonyesha upande wa pili unaokinzana na wa kwanza kwa Kiswahili cha kawaida.
- source_word: ἀσθενῶν
  choice: dhaifu
  rationale: Ni kivumishi-tendo kinachotumiwa kama nomino kumtaja mtu aliye dhaifu; tafsiri haiongezi ‘katika imani’ ndani ya mstari huu.
- source_word: λάχανα
  choice: mboga
  rationale: Ni neno la kawaida la Kiswahili kwa mazao ya bustani au vegetables na ni wazi kwa wasomaji wa sasa.
- source_word: ἐσθίει
  choice: hula
  rationale: Hutoa hali ya kawaida au desturi ya kula. Neno ‘tu’ halijaongezwa kwa sababu upekee unadokezwa na ulinganisho lakini haujasemwa wazi katika Kigiriki.
theological_decisions:
- issue: Maana ya udhaifu katika ἀσθενῶν
  choice: aliye dhaifu
  alternative: aliye dhaifu katika imani
  rationale: Warumi 14:1 huonyesha kuwa ni udhaifu wa imani au dhamiri kuhusu mambo yanayobishaniwa, lakini mstari wa 2 wenyewe unasema tu ‘aliye dhaifu.’ Tafsiri huhifadhi ufupi na mvutano wa maandishi, na tanbihi hutoa ufafanuzi wa kimuktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa urahisi. Alama za tanbihi zimewekwa mara baada ya vifungu vinavyohusika.
