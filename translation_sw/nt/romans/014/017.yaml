  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οὐ γάρ ἐστιν ἡ βασιλεία τοῦ θεοῦ βρῶσις καὶ πόσις, ἀλλὰ δικαιοσύνη καὶ εἰρήνη καὶ χαρὰ ἐν πνεύματι ἁγίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/017.yaml
  text: For the kingdom of God is not eating and drinking[a], but righteousness and peace and joy in the Holy Spirit.
translation:
  language: sw
  text: Kwa maana ufalme wa Mungu si kula na kunywa, bali ni haki[a], amani na furaha katika Roho Mtakatifu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uadilifu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: βασιλεία
  choice: ufalme
  rationale: “Ufalme” ni tafsiri ya kawaida na pana ya βασιλεία katika Kiswahili, nayo inafaa katika utofautishaji wa Paulo kati ya kile ambacho ufalme wa Mungu siyo na kile ambacho ndio.
- source_word: βρῶσις καὶ πόσις
  choice: kula na kunywa
  rationale: Nomino hizi mbili zinaweza kutaja chakula na kinywaji au shughuli za kula na kunywa. Muktadha na ulinganifu wake vinaungwa vizuri kwa vitenzi-jina vya Kiswahili “kula na kunywa.”
- source_word: δικαιοσύνη
  choice: haki
  rationale: “Haki” ni neno la kawaida la kibiblia katika Kiswahili na huhifadhi upana wa maana unaoweza kujumuisha kuwa sawa na kutenda yaliyo sawa. “Uadilifu” limehifadhiwa kama uwezekano katika tanbihi.
- source_word: εἰρήνη
  choice: amani
  rationale: “Amani” huwasilisha kwa kawaida hali ya mapatano na mahusiano mema inayokusudiwa katika muktadha.
- source_word: χαρά
  choice: furaha
  rationale: “Furaha” ni tafsiri ya kawaida, ya asili na yenye uzito unaofaa kwa χαρά.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: katika Roho Mtakatifu
  rationale: Tafsiri hii huhifadhi kihusishi ἐν na uwezekano wake wa kuonyesha mazingira au njia, huku ikitambua kuwa katika matumizi ya Paulo kifungu hiki humrejelea Roho Mtakatifu.
- source_word: γάρ
  choice: Kwa maana
  rationale: “Kwa maana” huonyesha kwa ufasaha uhusiano wa maelezo na hoja iliyotangulia.
theological_decisions:
- issue: Maana ya δικαιοσύνη katika kifungu cha Paulo
  choice: haki
  alternative: uadilifu
  rationale: “Haki” hudumisha istilahi ya kawaida ya Paulo na pia ina upana wa kimaana unaogusa hali na matendo yaliyo sawa. Tanbihi inahifadhi “uadilifu” bila kulazimisha maana moja pekee.
- issue: Uhusiano unaoonyeshwa na ἐν katika ἐν πνεύματι ἁγίῳ
  choice: katika Roho Mtakatifu
  alternative: kwa Roho Mtakatifu
  rationale: “Katika” huhifadhi utata halisi wa Kigiriki kati ya mazingira na njia; “kwa” ingeuelekeza usemi zaidi upande wa utendaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo wa sentensi huhifadhi ulinganifu wa Kigiriki bila kuwa mgumu.
