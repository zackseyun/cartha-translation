  text: εἰς τοῦτο γὰρ ⸀Χριστὸς ⸀ἀπέθανεν καὶ ἔζησεν ἵνα καὶ νεκρῶν καὶ ζώντων κυριεύσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/009.yaml
  text: For to this end Messiah died and lived again[a], so that he might rule over both the dead and the living.
translation:
  language: sw
  text: Kwa maana, ni kwa kusudi hili Masihi alikufa na akawa hai tena[a], ili awatawale wafu na walio hai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akawa hai” au “aliishi.” Kigiriki kinasema kihalisi “alikufa na akaishi”; muktadha unaonyesha maisha baada ya kufa.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς τοῦτο
  choice: kwa kusudi hili
  rationale: Kirai hiki kinaonyesha lengo au kusudi; tafsiri hii ni ya kawaida katika Kiswahili na inadumisha nguvu yake ya kusudi.
- source_word: γὰρ
  choice: kwa maana
  rationale: Hutoa maelezo yanayounga mkono kauli iliyotangulia na kudumisha mtiririko wa hoja ya Paulo.
- source_word: Χριστὸς
  choice: Masihi
  rationale: Neno hili linatumika hapa kama cheo cha Yesu katika kazi yake ya ukombozi; “Masihi” huwasilisha maana ya cheo hicho moja kwa moja.
- source_word: ἀπέθανεν
  choice: alikufa
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kitenzi hiki.
- source_word: ἔζησεν
  choice: akawa hai tena
  rationale: Ingawa kwa umbo lake kitenzi ni “aliishi/akawa hai,” kuunganishwa kwake na “alikufa” kunaonyesha maisha baada ya kifo. “Tena” huwasilisha dokezo hilo bila kutumia kitenzi mahsusi zaidi cha kufufuka; tanbihi inadumisha mbadala wa karibu zaidi na umbo la Kigiriki.
- source_word: ἵνα
  choice: ili
  rationale: Huanzisha kishazi cha kusudi kwa Kiswahili cha kawaida na fasaha.
- source_word: νεκρῶν
  choice: wafu
  rationale: Nomino hii ya wingi inarejelea watu waliokufa na inatofautishwa moja kwa moja na walio hai.
- source_word: ζώντων
  choice: walio hai
  rationale: Kirai hiki cha kawaida kinaonyesha watu wanaoishi na kudumisha ulinganifu na “wafu.”
- source_word: κυριεύσῃ
  choice: awatawale
  rationale: Kitenzi hiki kinamaanisha kutawala au kuwa na mamlaka juu ya wengine. “Awatawale” huhifadhi hali yake ya kitenzi na mada ya mamlaka bila kuigeuza kuwa cheo.
theological_decisions:
- issue: Maana ya ἔζησεν baada ya ἀπέθανεν
  choice: akawa hai tena
  alternative: aliishi; akawa hai; alifufuka
  rationale: Mfuatano wa “alikufa” na “akawa hai,” pamoja na kutajwa kwa wafu na walio hai, unaelekeza kwenye maisha ya baada ya kifo. Tafsiri haichagui neno mahsusi zaidi “alifufuka,” ambalo halipo wazi katika kitenzi chenyewe.
- issue: Jinsi ya kuwasilisha κυριεύσῃ
  choice: ili awatawale wafu na walio hai
  alternative: ili awe Bwana wa wafu na walio hai
  rationale: “Awatawale” hufuata hali ya kitenzi katika Kigiriki na kuonyesha mamlaka ya Masihi juu ya makundi yote mawili bila kuondoa uzito wa dai hilo au kulibadili kuwa cheo cha nomino.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mpangilio wa “kwa maana, kwa kusudi hili” unadumisha uhusiano wa maelezo na kusudi katika Kigiriki, huku sentensi ikibaki wazi kwa msomaji wa kawaida.
