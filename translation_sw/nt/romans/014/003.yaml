id: ROM.14.3
reference: Romans 14:3
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὁ ἐσθίων τὸν μὴ ἐσθίοντα μὴ ἐξουθενείτω, ⸂ὁ δὲ⸃ μὴ ἐσθίων τὸν ἐσθίοντα μὴ κρινέτω, ὁ θεὸς γὰρ αὐτὸν προσελάβετο.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/003.yaml
  text: The one who eats must not despise the one who does not eat[a], and the one who does not eat must not judge the one who eats[c][b], for God has welcomed him.
translation:
  language: sw
  text: Anayekula asimdharau yule asiyekula,[a] naye asiyekula asimhukumu anayekula,[b] kwa maana Mungu amemkaribisha.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “asimwone kuwa hafai.”
    reason: lexical_alternative
  - marker: b
    text: Au “asitoe hukumu dhidi ya anayekula.”
    reason: lexical_alternative
  - marker: c
    text: Au “amempokea” au “amemkubali.” Kitenzi hiki pia kina wazo la kumkaribisha mtu katika ushirika.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἐσθίων
  choice: anayekula
  rationale: Kishiriki chenye kibainishi kinamtaja mtu anayejulikana kwa tendo la kula; “anayekula” ni Kiswahili cha kawaida na kinahifadhi muundo huo.
- source_word: τὸν μὴ ἐσθίοντα
  choice: yule asiyekula
  rationale: Huhifadhi utofautishaji wa moja kwa moja kati ya anayekula na asiyekula bila kuongeza kwamba anaacha vyakula fulani tu.
- source_word: ἐξουθενείτω
  choice: asimdharau
  rationale: “Kudharau” huonyesha kumwona mwingine kuwa hafai au hana thamani, na hubeba uzito wa katazo la Kigiriki.
- source_word: ὁ δὲ μὴ ἐσθίων
  choice: naye asiyekula
  rationale: “Naye” huendeleza sentensi huku ikiweka wazi tofauti na uwiano wa makatazo haya mawili.
- source_word: κρινέτω
  choice: asimhukumu
  rationale: “Kuhukumu” ni pana vya kutosha kuonyesha kutoa hukumu dhidi ya mwingine bila kuibana maana kuwa kumtia hatiani tu.
- source_word: γὰρ
  choice: kwa maana
  rationale: Huonyesha sababu ya makatazo yaliyotangulia kwa mtiririko wa asili wa Kiswahili.
- source_word: αὐτὸν
  choice: amem-
  rationale: Kiambishi cha yambwa cha nafsi ya tatu umoja kinahifadhi rejeo la umoja bila kulifafanua kupita kiasi.
- source_word: προσελάβετο
  choice: amemkaribisha
  rationale: Kitenzi hiki hapa kina maana ya kumpokea mtu kwa ukarimu na katika ushirika; “amemkaribisha” huonyesha upande huo wa uhusiano kuliko “amemkubali” pekee.
theological_decisions:
- issue: Upeo wa tofauti kati ya kula na kutokula
  choice: Kutaja kwa ujumla kula na kutokula
  alternative: Kufafanua kuwa ni kula vyakula vyote dhidi ya kujiepusha na vyakula fulani
  rationale: Muktadha unahusu tofauti za mazoea ya chakula, lakini mstari wenyewe hautaji aina ya chakula wala sababu ya kutokula.
- issue: Rejeo la αὐτὸν katika “Mungu amemkaribisha”
  choice: Kuhifadhi rejeo la mtu mmoja kwa kiambishi “-m-” bila kuongeza jina
  alternative: Kusema “Mungu amemkaribisha mtu huyo” au kufafanua kuwa ni anayekula
  rationale: Kisarufi, mtangulizi wa karibu ni anayekula, lakini hoja ya pande mbili inaweza kutumika kwa mwamini yeyote anayehusika. Muundo wa Kiswahili huhifadhi rejeo hilo bila kulitatua zaidi ya Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa pande mbili umehifadhiwa, na maneno mafupi “anayekula/asiyekula” yanaeleweka kwa urahisi. Alama zote za tanbihi zimewekwa katika matini kuu karibu na maneno yanayohusika.
