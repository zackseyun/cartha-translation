  text: εἰ ⸀γὰρ διὰ βρῶμα ὁ ἀδελφός σου λυπεῖται, οὐκέτι κατὰ ἀγάπην περιπατεῖς. μὴ τῷ βρώματί σου ἐκεῖνον ἀπόλλυε ὑπὲρ οὗ Χριστὸς ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/015.yaml
  text: For if your brother is grieved because of food[a], you are no longer walking according to love[c][b]. Do not destroy that one with your food—the one for whom Messiah died.
translation:
  language: sw
  text: Kwa maana, ikiwa ndugu yako[a] anahuzunishwa kwa sababu ya chakula, huenendi tena kulingana na upendo. Kwa chakula chako usimwangamize[b] yule ambaye Masihi[c] alikufa kwa ajili yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ndugu” hapa inaweza pia kurejelea dada, yaani mwamini mwenzako.
    reason: lexical_alternative
  - marker: b
    text: Au, “usimharibu” au “usimsababishe aangamie.” Kitenzi cha Kigiriki ni kikali na kinaweza kuashiria madhara makubwa ya kiroho; aya yenyewe haielezi kwa undani athari mahususi za kiteolojia.
    reason: alternative_reading
  - marker: c
    text: 'Kigiriki: Χριστός; limetafsiriwa “Masihi” hapa kwa sababu linatumika kama cheo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βρῶμα / βρώματι
  choice: chakula / kwa chakula chako
  rationale: Neno hili linamaanisha chakula kwa ujumla, si nyama pekee. Muundo “kwa chakula chako” unaonyesha njia au kisababishi cha madhara.
- source_word: ἀδελφός
  choice: ndugu
  rationale: “Ndugu” ni la kawaida na lenye heshima katika Kiswahili kwa mshiriki wa jumuiya ya waumini; tanbihi inaeleza kuwa linaweza kumhusu mwanamume au mwanamke.
- source_word: λυπεῖται
  choice: anahuzunishwa
  rationale: Huhifadhi wazo la kusababishiwa huzuni au maumivu ya moyoni bila kufafanua kupita kiasi aina ya madhara.
- source_word: κατὰ ἀγάπην
  choice: kulingana na upendo
  rationale: Hufuata maana ya κατὰ na kuonyesha upendo kuwa kipimo cha mwenendo.
- source_word: περιπατεῖς
  choice: huenendi
  rationale: Huhifadhi sitiari ya Paulo ya kutembea kama mwenendo wa maisha, kwa lugha ya kibiblia inayoeleweka.
- source_word: ἀπόλλυε
  choice: usimwangamize
  rationale: Huhifadhi ukali wa onyo bila kuamua kama maana mahususi ni uharibifu wa kiroho, kuharibika kabisa, au kuangamia milele.
- source_word: ὑπὲρ οὗ
  choice: kwa ajili yake
  rationale: Ni usemi wa asili unaohifadhi maana ya kutenda kwa niaba au kwa faida ya mtu.
- source_word: Χριστός
  choice: Masihi
  rationale: Neno hili linafanya kazi kama cheo, hivyo “Masihi” huwasilisha maana yake badala ya kulitohosha tu.
- source_word: ἀπέθανεν
  choice: alikufa
  rationale: Hutoa maana ya kitenzi kwa usahihi na kwa Kiswahili cha kawaida.
- source_word: ἐκεῖνον
  choice: huyo
  rationale: Kiwakilishi hiki cha kuonyesha huhifadhi msisitizo juu ya mtu anayezungumziwa.
- source_word: εἰ γὰρ
  choice: Kwa maana ikiwa
  rationale: Huhifadhi uhusiano wa hoja unaoletwa na γάρ pamoja na muundo wa sharti wa εἰ.
theological_decisions:
- issue: Nguvu ya ἀπόλλυε kuhusu mwamini aliye dhaifu
  choice: usimwangamize
  alternative: usimharibu; usimsababishe aangamie
  rationale: Kitenzi ni kikali, lakini aya yenyewe haisuluhishi ikiwa kinamaanisha madhara makubwa ya kiroho au kuangamia kwa mwisho; tafsiri inadumisha mvutano huo.
- issue: Mhusika anayerejelewa na ἀδελφός
  choice: ndugu
  alternative: ndugu yako wa kiume au wa kike; mwamini mwenzako
  rationale: Neno la Kigiriki ni la umoja wa kiume, lakini linaweza kutumiwa kiuwakilishi kwa mwamini mwenza; tanbihi inaweka wazi upana huo.
- issue: Utoaji wa Χριστός
  choice: Masihi
  alternative: Kristo
  rationale: Hapa neno linafanya kazi kama cheo; “Masihi” huonyesha maana ya cheo hicho wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Sitiari ya mwenendo kama kutembea imehifadhiwa kwa “huenendi,” huku sentensi nyingine zikiwa za asili na wazi.
