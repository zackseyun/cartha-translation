  text: Kwa hiyo, msiruhusu jema lenu lisemwe kuwa ovu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “litukanwe” au “likashifiwe.” Kitenzi cha Kigiriki kinaweza kumaanisha kusema kwa dharau au kwa kashfa.
