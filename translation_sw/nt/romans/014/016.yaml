lexical_decisions:
- source_word: μὴ ... βλασφημείσθω
  choice: msiruhusu ... yasemwe kuwa maovu
  rationale: μή pamoja na kauli-agizi ya sasa ya kutendwa huleta katazo. Muundo huu wa Kiswahili unaonyesha jambo lisiruhusiwe kutokea na kuhifadhi wazo la kusema vibaya juu ya yaliyo mema.
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Inaonyesha hitimisho linalotokana na hoja iliyotangulia.
- source_word: ὑμῶν
  choice: yenu
  rationale: Kiwakilishi hiki kinaonyesha kwamba mema hayo yanawahusu wasomaji kwa pamoja.
- source_word: τὸ ἀγαθόν
  choice: mema
  rationale: Kivumishi cha Kigiriki kimetumika kama nomino kwa maana ya 'lililo jema' au 'mema.' 'Mema yenu' ni ya asili katika Kiswahili na haibani rejeo kuwa uhuru au fursa fulani.
theological_decisions:
- issue: Rejeo la τὸ ἀγαθόν ('mema yenu')
  choice: Limeachwa kwa upana kuwa 'mema yenu.'
  alternative: uhuru wenu; fursa yenu; ushuhuda au mafundisho yenu mema
  rationale: Kigiriki hakitaji kwa wazi jambo moja maalumu. Tafsiri pana huhifadhi utata halisi na mvutano wa kichungaji katika muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye hadhi na inayoeleweka kwa wasomaji wa kawaida. Wingi katika 'msiruhusu' na 'yenu' unahifadhi ὑμῶν ya wingi.
