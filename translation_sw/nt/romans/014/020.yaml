  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: μὴ ἕνεκεν βρώματος κατάλυε τὸ ἔργον τοῦ θεοῦ. πάντα μὲν καθαρά, ἀλλὰ κακὸν τῷ ἀνθρώπῳ τῷ διὰ προσκόμματος ἐσθίοντι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/020.yaml
  text: Do not[a], for the sake of food, tear down the work of God. All things are indeed clean[b], but it is evil for the person who eats in a way that causes stumbling.
translation:
  language: sw
  text: Kwa ajili ya chakula, usibomoe kazi ya Mungu. Kwa kweli, vitu vyote ni safi[a], lakini ni jambo baya kwa mtu anayekula na hivyo kumkwaza mwingine[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa muktadha, inaweza pia kutafsiriwa, “vyakula vyote ni safi.” Kigiriki kinasema kwa upana, “vitu vyote ni safi.”
    reason: lexical_alternative
  - marker: b
    text: Au, “lakini ni jambo baya kwa mtu anayekula kwa kikwazo.” Kirai cha Kigiriki kinahusisha kula na kikwazo; katika muktadha, maana yake inaeleweka hasa kuwa kula kunakomkwaza mwingine.
    reason: ambiguity
lexical_decisions:
- source_word: ἕνεκεν βρώματος
  choice: kwa sababu ya chakula
  rationale: Kirai hiki kinaonyesha sababu au kichocheo; tafsiri hii ni ya kawaida katika Kiswahili na inaweka wazi kwamba chakula hakipaswi kuwa sababu ya kuharibu kazi ya Mungu.
- source_word: κατάλυε
  choice: usibomoe
  rationale: Kitenzi hiki kina picha ya kuvunja au kubomoa kile kilichojengwa; ‘usibomoe’ huhifadhi sitiari hiyo na nguvu ya katazo la wakati uliopo.
- source_word: τὸ ἔργον τοῦ θεοῦ
  choice: kazi ya Mungu
  rationale: Tafsiri ya moja kwa moja huhifadhi upana wa maana, bila kuamua kama inamhusu hasa mwamini mmoja au jumuiya nzima.
- source_word: πάντα μὲν καθαρά
  choice: Kwa kweli, vitu vyote ni safi
  rationale: ‘Vitu vyote’ huhifadhi upana wa πάντα, huku muktadha ukionyesha kwamba vyakula vinahusika; ‘safi’ huhifadhi lugha ya utakaso badala ya kuifasiri kuwa ‘vinaruhusiwa.’
- source_word: κακὸν
  choice: ni jambo baya
  rationale: Huwasilisha tathmini ya kimaadili kwa Kiswahili cha kawaida na chenye heshima; ‘uovu’ hapa ingesikika kama sifa ya kitu au mtu kuliko hukumu juu ya tendo.
- source_word: τῷ ἀνθρώπῳ
  choice: kwa mtu
  rationale: ἄνθρωπος hapa ni jina la jumla linalomrejelea mwanadamu yeyote; ‘mtu’ ni sahihi, asilia, na haliongezi jinsia isiyolengwa na hoja.
- source_word: διὰ προσκόμματος ἐσθίοντι
  choice: anayekula kwa njia inayomkwaza mwingine
  rationale: Kirai cha Kigiriki kinaweza kueleweka kuhusu kula kunakohusiana na kikwazo au kunakosababisha kukwaza. Tafsiri kuu inaonyesha maana inayofaa katika muktadha, huku tanbihi ikihifadhi utata huo.
theological_decisions:
- issue: Upeo wa kauli ‘vitu vyote ni safi’
  choice: Kudumisha ‘vitu vyote’ na ‘safi,’ huku muktadha wa chakula ukielekeza maana.
  alternative: ‘Vyakula vyote ni safi’ au ‘vitu vyote vinaruhusiwa.’
  rationale: Kigiriki hakitaji ‘vyakula’ moja kwa moja na kinatumia lugha ya usafi. Tafsiri hii haipanui wala kupunguza kwa siri dai la Paulo kuhusu sheria za chakula na uhuru wa mwamini.
- issue: Maana ya διὰ προσκόμματος katika tendo la kula
  choice: 'Tafsiri kuu: kula kwa njia inayomkwaza mwingine.'
  alternative: Kula huku mtu mwenyewe akijikwaa au akiwa na dhamiri iliyokwazika.
  rationale: Muktadha wa sura unasisitiza kutomwangusha mwamini mwingine, lakini muundo wa Kigiriki ni mfupi na unaweza kufasiriwa kwa namna zaidi ya moja; tanbihi inahifadhi uwezekano huo.
- issue: Uwakilishi wa ἄνθρωπος
  choice: ‘mtu’
  alternative: ‘mwanamume’
  rationale: Ingawa umbo la Kigiriki ni la umoja wa kisarufi, ἄνθρωπος hapa ni la jumla. ‘Mtu’ huwasilisha rejeo hilo kwa usahihi katika Kiswahili bila kuingiza tofauti ya kijinsia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Usibomoe’ huhifadhi picha ya ujenzi; ‘anayemkwaza mwingine’ ni ya kawaida na inayoeleweka, huku tanbihi ikihifadhi utata halisi wa Kigiriki.
