  yaml_path: translation/nt/romans/014/007.yaml
  text: For none of us lives for himself[a], and none dies for himself.
translation:
  language: sw
  text: Kwa maana hakuna hata mmoja wetu anayeishi kwa ajili yake mwenyewe[a], wala hakuna hata mmoja wetu anayekufa kwa ajili yake mwenyewe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwake mwenyewe.” Kiwakilishi rejeshi cha Kigiriki katika hali ya dativu kinaweza kutafsiriwa kwa karibu zaidi hivi, lakini hapa huenda kinamaanisha kwamba mtu mwenyewe si lengo kuu la kuishi au kufa.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐδεὶς
  choice: hakuna hata mmoja
  rationale: Huwasilisha kwa uwazi ukanushaji wa jumla na, pamoja na ἡμῶν, huunda maana ya “hakuna hata mmoja wetu.”
- source_word: γὰρ
  choice: kwa maana
  rationale: Huonyesha kwamba mstari huu unatoa maelezo au msingi wa kauli iliyotangulia.
- source_word: ἡμῶν
  choice: wetu
  rationale: Ni umilikishi wa sehemu unaoungana na “mmoja” katika usemi wa kawaida wa Kiswahili, “hakuna hata mmoja wetu.”
- source_word: ἑαυτῷ
  choice: kwa ajili yake mwenyewe
  rationale: Huonyesha kwamba mtu mwenyewe si lengo kuu la kuishi au kufa, huku tanbihi ikihifadhi uwezekano wa tafsiri ya karibu zaidi na muundo wa Kigiriki.
- source_word: ζῇ
  choice: anayeishi
  rationale: Wakati wa sasa unafaa kwa ukweli wa jumla anaoutoa Paulo.
- source_word: καὶ
  choice: wala
  rationale: Katika kishazi cha pili kilichokanushwa, “wala” ni kiunganishi cha asili cha Kiswahili kinachohifadhi usambamba wa sentensi.
- source_word: ἀποθνῄσκει
  choice: anayekufa
  rationale: Wakati wa sasa huwasilisha kauli ya jumla na kudumisha usambamba na “anayeishi.”
theological_decisions:
- issue: Maana ya ἑαυτῷ katika vishazi vyote viwili
  choice: kwa ajili yake mwenyewe
  alternative: kwake mwenyewe
  rationale: Muktadha wa mstari unaofuata unaelekeza kwenye mwelekeo au lengo la kuishi na kufa—si kwa nafsi bali kwa Bwana. Chaguo hili linaonyesha maana hiyo bila kuongeza lugha ya kimadhehebu, huku tanbihi ikihifadhi tafsiri mbadala.
- issue: Urejezi wa umoja wa kiume katika Kigiriki
  choice: yake mwenyewe
  alternative: wao wenyewe
  rationale: Kiswahili halilazimishi jinsia katika kiwakilishi hiki. Umoja umehifadhiwa kwa kila mtu mmoja mmoja bila kuingiza utofautishaji wa jinsia usio wa lazima.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. “Hakuna hata mmoja wetu” huweka msisitizo wa ukanushaji, na “wala” huunda usambamba wa asili kati ya kuishi na kufa.
