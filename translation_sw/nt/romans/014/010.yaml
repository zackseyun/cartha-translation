id: ROM.14.10
reference: Romans 14:10
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Σὺ δὲ τί κρίνεις τὸν ἀδελφόν σου; ἢ καὶ σὺ τί ἐξουθενεῖς τὸν ἀδελφόν σου; πάντες γὰρ παραστησόμεθα τῷ βήματι τοῦ ⸀θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/010.yaml
  text: But you[a], why do you judge your brother? Or you also, why do you despise your brother? For we will all stand before the judgment seat of God[b],
translation:
  language: sw
  text: Lakini wewe, kwa nini unamhukumu ndugu yako?[a] Au wewe pia, kwa nini unamdharau ndugu yako? Kwa maana sisi sote tutasimama mbele ya kiti cha hukumu cha Mungu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ndugu yako, mwanamume au mwanamke”; Kigiriki, “ndugu yako.”
    reason: lexical_alternative
  - marker: b
    text: Baadhi ya hati zinasoma “kiti cha hukumu cha Kristo.”
    reason: textual_variant
lexical_decisions:
- source_word: Σὺ δὲ
  choice: Lakini wewe
  rationale: Inahifadhi nguvu ya upinzani ya δέ na msisitizo wa kiwakilishi σύ kwa Kiswahili cha kawaida.
- source_word: τί κρίνεις
  choice: kwa nini unamhukumu
  rationale: Katika swali hili la balagha, τί ina maana ya ‘kwa nini’; ‘unamhukumu’ huhifadhi maana ya κρίνω bila kuibana kuwa hukumu ya mwisho ya hatia.
- source_word: τὸν ἀδελφόν σου
  choice: ndugu yako
  rationale: ‘Ndugu’ ni tafsiri ya moja kwa moja na ya kawaida ya ἀδελφός; katika muktadha inaweza kumaanisha muumini mwenzako, wa kiume au wa kike.
- source_word: ἢ καὶ σὺ
  choice: Au wewe pia
  rationale: Inahifadhi kiunganishi ἤ, nguvu ya nyongeza ya καί, na msisitizo wa σύ.
- source_word: τί ἐξουθενεῖς
  choice: kwa nini unamdharau
  rationale: ‘Unamdharau’ huonyesha kumwona mtu kuwa hafai au hana thamani, sawasawa na ἐξουθενέω.
- source_word: πάντες γὰρ
  choice: Kwa maana sisi sote
  rationale: ‘Kwa maana’ huonyesha kazi ya ufafanuzi ya γάρ, na ‘sisi sote’ humjumuisha Paulo pamoja na wasomaji wake.
- source_word: παραστησόμεθα
  choice: tutasimama mbele ya
  rationale: Huhifadhi taswira ya mtu kusimama mbele ya mamlaka ya hukumu.
- source_word: τῷ βήματι
  choice: kiti cha hukumu
  rationale: βῆμα hapa ni kiti au baraza la hakimu; ‘kiti cha hukumu’ ni usemi wazi unaohifadhi taswira ya mahakama.
- source_word: τοῦ θεοῦ
  choice: cha Mungu
  rationale: Inatafsiri moja kwa moja uhusiano wa genitivi katika maandishi ya SBLGNT.
theological_decisions:
- issue: Utambulisho wa mwenye kiti cha hukumu ambacho wote watasimama mbele yake
  choice: Mungu
  alternative: Kristo
  rationale: Maandishi yaliyotolewa ya SBLGNT yanasoma τοῦ θεοῦ, ‘cha Mungu.’ Tofauti ya ‘cha Kristo’ katika baadhi ya hati imehifadhiwa katika tanbihi badala ya kuingizwa katika maandishi makuu au kupatanishwa kimya na 2 Wakorintho 5:10.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa maswali ya balagha na urudiaji wa ‘wewe’ umehifadhiwa ili kudumisha msisitizo wa maandishi ya Kigiriki.
