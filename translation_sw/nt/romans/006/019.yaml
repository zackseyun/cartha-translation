  - severity: medium
    issue: '"Utakaso" kwa ἁγιασμόν'
    rationale: '"Utakaso" kwa kawaida hueleweka kama kutakaswa au kusafishwa; ἁγιασμός hapa huelekea kwenye hali/matokeo ya utakatifu. "Utakatifu" huepuka kubana maana kuwa usafishaji.'
