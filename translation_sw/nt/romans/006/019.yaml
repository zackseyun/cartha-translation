id: ROM.6.19
reference: Romans 6:19
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀνθρώπινον λέγω διὰ τὴν ἀσθένειαν τῆς σαρκὸς ὑμῶν· ὥσπερ γὰρ παρεστήσατε τὰ μέλη ὑμῶν δοῦλα τῇ ἀκαθαρσίᾳ καὶ τῇ ἀνομίᾳ εἰς τὴν ἀνομίαν, οὕτως νῦν παραστήσατε τὰ μέλη ὑμῶν δοῦλα τῇ δικαιοσύνῃ εἰς ἁγιασμόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/019.yaml
  text: I am speaking in human terms because of the weakness of your flesh[a]. For just as you presented your members as servants to impurity and to lawlessness, leading to lawlessness, so now present your members as servants to righteousness[b], leading to sanctification.
translation:
  language: sw
  text: Ninasema kwa lugha ya kibinadamu kwa sababu ya udhaifu wa mwili wenu[a]. Kwa maana, kama mlivyovitoa viungo vyenu kuwa watumwa wa uchafu na wa uasi, na hivyo kuendelea katika uasi, vivyo hivyo sasa vitoeni viungo vyenu kuwa watumwa wa uadilifu[b], na hivyo kufikia utakatifu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au kwa tafsiri yenye kufafanua zaidi, “asili yenu ya dhambi”; lakini Kigiriki kinasema “mwili wenu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “haki.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνθρώπινον λέγω
  choice: Ninasema kwa namna ya kibinadamu
  rationale: Hii inadumisha nahau ya Paulo ya kusema kwa kiwango kinachoeleweka kwa wanadamu bila kuifafanua kwa lazima kuwa ‘mfano’.
- source_word: ἀσθένειαν
  choice: udhaifu
  rationale: ‘Udhaifu’ ni pana na inaweza kuhusisha upungufu wa kibinadamu bila kuubana kuwa udhaifu wa kimwili pekee.
- source_word: σάρξ
  choice: mwili
  rationale: ‘Mwili’ huhifadhi upana wa neno la Kigiriki kuliko tafsiri ya kimafundisho ya ‘asili ya dhambi’; uwezekano huo umeelezwa katika tanbihi.
- source_word: παρεστήσατε / παραστήσατε
  choice: mlivyovitoa / vitoeni
  rationale: Kitenzi kilekile cha Kiswahili kimetumiwa katika kauli ya wakati uliopita na agizo la sasa ili kudumisha ulinganifu wa Paulo.
- source_word: μέλη
  choice: viungo vya miili yenu
  rationale: Usemi huu unaeleweka wazi katika Kiswahili cha sasa na unaonyesha kwamba Paulo anazungumzia sehemu na uwezo wa mwili.
- source_word: δοῦλα
  choice: watumwa
  rationale: ‘Watumwa’ huhifadhi nguvu ya sitiari ya utumwa, umiliki, na utiifu inayotawala hoja ya Waroma 6.
- source_word: ἀκαθαρσίᾳ
  choice: uchafu
  rationale: ‘Uchafu’ ni neno la kawaida linaloweza kubeba maana ya kimaadili katika muktadha huu.
- source_word: ἀνομίᾳ / ἀνομίαν
  choice: utovu wa sheria / utovu wa sheria
  rationale: Kurudia usemi uleule kunahifadhi marudio ya Kigiriki na mwendo kutoka katika utovu wa sheria hadi matokeo yaleyale.
- source_word: εἰς τὴν ἀνομίαν
  choice: hata matokeo yake yakawa utovu wa sheria
  rationale: Hii inaonyesha mwelekeo au matokeo yanayobebwa na εἰς kwa Kiswahili cha kawaida.
- source_word: δικαιοσύνῃ
  choice: haki
  rationale: ‘Haki’ ni tafsiri pana na iliyozoeleka ya δικαιοσύνη; maana ya uadilifu wa kimaadili imehifadhiwa katika tanbihi.
- source_word: ἁγιασμόν
  choice: utakaso
  rationale: ‘Utakaso’ huonyesha mchakato au matokeo ya kuwekwa wakfu na kufanywa watakatifu, sambamba na mwendo wa hoja.
theological_decisions:
- issue: Maana ya σάρξ katika ‘udhaifu wa mwili wenu’
  choice: mwili
  alternative: asili yenu ya dhambi
  rationale: Kigiriki kinaacha usemi huu ukiwa mpana, ukihusu hali dhaifu ya kibinadamu yenye mwili; maandishi makuu hayalazimishi tafsiri finyu ya kimafundisho.
- issue: Maana ya δικαιοσύνη katika muktadha huu wa Paulo
  choice: haki
  alternative: uadilifu
  rationale: ‘Haki’ inadumisha upana wa neno, huku muktadha wa kimaadili ukiruhusu pia ‘uadilifu’; uwezekano huo umeonyeshwa badala ya kuuficha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa ulinganifu kati ya mwenendo wa zamani na agizo la sasa umehifadhiwa, pamoja na marudio ya ‘utovu wa sheria’ na sitiari yenye nguvu ya utumwa.
