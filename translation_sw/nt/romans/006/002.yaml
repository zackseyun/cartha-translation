revisions:
- from: Hasha! Sisi tulioifia dhambi, tutaendeleaje kuishi ndani yake?[a]
  to: Hasha! Sisi ambao tulikufa kwa dhambi, tunawezaje kuendelea kuishi ndani yake?[a]
  rationale: The revision replaces only the potentially misleading “tulioifia dhambi” with “tulikufa kwa dhambi,” a standard and comprehensible way to preserve Paul’s direct metaphor of death in relation to sin. It also changes “tutaendeleaje” to “tunawezaje kuendelea” for clear, natural rhetorical-question syntax in contemporary Standard East African Swahili, without reducing the force of the Greek future or ἔτι.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T02:32:07Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the emphatic repudiation, the inclusive first-person relative clause, the death-to-sin metaphor, and the rhetorical question. However, “tulioifia dhambi” can naturally be understood as ‘we died for sin’ or ‘we died because of sin,’ rather than death with respect to sin; it does not safely convey the Greek dative relation.
  naturalness: “Hasha!” is acceptable Standard East African Swahili, particularly in a formal biblical register. The proposed revision uses the more idiomatic construction “tulikufa kwa dhambi,” while retaining the metaphor without explanatory paraphrase.
  terminology: “Dhambi” and “kuishi ndani yake” appropriately retain sin as the antecedent and as the sphere in which one lives. “Tunawezaje kuendelea kuishi” naturally expresses the rhetorical future force and ἔτι (‘still/any longer’).
  issues:
  - severity: medium
    issue: “tulioifia dhambi” is semantically and idiomatically unsafe.
    rationale: The object-marked applicative form may suggest dying for the benefit of sin or dying as a result of sin. Greek ἀπεθάνομεν τῇ ἁμαρτίᾳ means dying with reference to sin, conventionally and adequately rendered in Swahili here as “tulikufa kwa dhambi.”
  revised_text: Hasha! Sisi ambao tulikufa kwa dhambi, tunawezaje kuendelea kuishi ndani yake?[a]
