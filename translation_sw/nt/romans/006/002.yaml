  text: μὴ γένοιτο· οἵτινες ἀπεθάνομεν τῇ ἁμαρτίᾳ, πῶς ἔτι ζήσομεν ἐν αὐτῇ;
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/002.yaml
  text: Absolutely not! We who died to sin—how can we still live in it?[a]
translation:
  language: sw
  text: Hasha! Sisi ambao tulikufa kwa dhambi, tunawezaje kuendelea kuishi ndani yake?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Isiwe kamwe!”; huu ni usemi mkali wa kukataa kabisa.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ γένοιτο
  choice: Hasha!
  rationale: Ni usemi wa Kiswahili unaokataa wazo kwa nguvu na kwa ufupi, sawasawa na nguvu ya usemi wa Paulo.
- source_word: οἵτινες
  choice: Sisi tulio
  rationale: Inadumisha nafsi ya kwanza wingi inayowajumuisha Paulo na waamini anaowazungumzia.
- source_word: ἀπεθάνομεν τῇ ἁμαρτίᾳ
  choice: tulioifia dhambi
  rationale: Inahifadhi sitiari ya kufa kuhusiana na dhambi bila kuigeuza kuwa maelezo ya kiitikadi; kiambishi cha yambwa katika “tulioifia” kinaelekeza uhusiano huo kwa dhambi.
- source_word: πῶς ἔτι
  choice: tutaendeleaje
  rationale: Inaonyesha swali la mshangao pamoja na wazo la kuendelea kufanya jambo hilo tena.
- source_word: ζήσομεν
  choice: kuishi
  rationale: Pamoja na “tutaendeleaje,” linawasilisha nguvu ya future ya Kigiriki katika swali la balagha kwa Kiswahili cha kawaida.
- source_word: ἐν αὐτῇ
  choice: ndani yake
  rationale: Kiwakilishi kinarejelea dhambi na kudumisha taswira yake kama eneo au hali ambamo mtu anaishi.
theological_decisions:
- issue: Je, “tulioifia dhambi” inaeleza kuimarika kwa maadili au kuvunjika kwa uhusiano na utawala wa dhambi?
  choice: Sitiari ya moja kwa moja “tulioifia dhambi” imehifadhiwa bila kufafanuliwa zaidi.
  alternative: tulioiacha dhambi; tuliokufa ganzi kwa dhambi
  rationale: Kigiriki kinatumia sitiari ya kifo moja kwa moja. Kuihifadhi kunadumisha mvutano wa kiteolojia na hakulazimishi tafsiri maalumu kuhusu namna utakaso unavyotokea.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Hasha” ni kifupi na chenye nguvu; tanbihi inatoa namna nyingine iliyo wazi zaidi.
