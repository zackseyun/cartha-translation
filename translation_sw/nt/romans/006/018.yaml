  yaml_path: translation/nt/romans/006/018.yaml
  text: And having been freed from sin[b][a], you were enslaved to righteousness.
translation:
  language: sw
  text: Nanyi, baada ya kuwekwa huru kutoka katika dhambi, mlifanywa watumwa wa uadilifu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “haki.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλευθερωθέντες
  choice: mlipokwisha kuwekwa huru
  rationale: Kirai hiki kinaonyesha tendo lililokamilika ambalo walitendewa; tafsiri hii inahifadhi hali ya kutendwa na uhusiano wake na kitenzi kikuu.
- source_word: δὲ
  choice: Lakini
  rationale: Kiunganishi hiki kinaonyesha mpito wenye utofautishaji mdogo katika hoja ya Paulo; “Lakini” ni ya kawaida na inafaa katika muktadha huu.
- source_word: ἁμαρτίας
  choice: dhambi
  rationale: Umoja wenye kibainishi humwonyesha dhambi kama nguvu inayotawala, huku neno “dhambi” likihifadhi pia maana yake ya kawaida.
- source_word: ἐδουλώθητε
  choice: mlifanywa watumwa
  rationale: Kitenzi cha hali ya kutendwa kinaonyesha kuwa walioandikiwa waliwekwa chini ya utawala mpya; “mlifanywa watumwa” kinahifadhi kwa uwazi sitiari kali ya utumwa.
- source_word: δικαιοσύνῃ
  choice: haki
  rationale: Katika Kiswahili, “haki” linaweza kubeba maana za mwenendo ulionyooka na uadilifu/justice, hivyo linafaa kwa upana wa maana wa δικαιοσύνη hapa.
theological_decisions:
- issue: Uwasilishaji wa sitiari ya δουλόω
  choice: mlifanywa watumwa wa haki
  alternative: mkawa watumishi wa haki
  rationale: Hoja ya Waroma 6 inategemea badiliko la bwana anayetawala. “Watumwa” huhifadhi ukali wa sitiari na hali ya kufungwa chini ya mamlaka, bila kuilegeza kuwa huduma ya hiari.
- issue: Maana ya δικαιοσύνη
  choice: haki
  alternative: uadilifu
  rationale: “Haki” ndilo neno pana na la kawaida katika lugha ya kibiblia ya Kiswahili, na halifungi kirai hiki kwenye maana ya maadili binafsi au haki ya kijamii pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo unaendeleza hali ya kutendwa katika vitenzi vyote viwili na kuhifadhi sitiari ya utumwa.
