review_pass:
  verdict: revise
  source_fidelity: The draft preserves the two passive actions and the governing metaphor of transfer from sin to righteousness. However, δέ is a mild connective here, so “Lakini” introduces a stronger adversative contrast than the Greek requires. Also, “haki” can naturally be read primarily as justice or a legal right in contemporary Swahili; “uadilifu” better represents Paul’s δικαιοσύνη here while retaining the alternative in a note.
  naturalness: “Nanyi, baada ya kuwekwa huru kutoka katika dhambi, mlifanywa watumwa wa uadilifu” is idiomatic Standard East African Swahili. It clearly expresses the completed prior passive action and retains the direct, solemn register of the verse.
  terminology: “Watumwa” faithfully retains the force of ἐδουλώθητε and should not be softened to “watumishi.” “Uadilifu” is the more precise primary equivalent for δικαιοσύνη in this context; “haki” is retained as a valid lexical alternative.
  issues:
  - severity: medium
    issue: “Lakini” overstates δέ.
    rationale: The Greek δέ continues the argument with a mild connection rather than necessarily setting up a sharp contrast. “Nanyi” supplies a natural connective without adding an adversative force.
  - severity: medium
    issue: “Haki” is too broad as the unqualified primary rendering of δικαιοσύνῃ.
    rationale: Although “haki” can be used in biblical Swahili, it commonly foregrounds justice, entitlement, or legal right. “Uadilifu” more readily conveys the righteousness dimension intended by the primary translation, while a note can preserve “haki/justice” as an alternative.
  revised_text: Nanyi, baada ya kuwekwa huru kutoka katika dhambi, mlifanywa watumwa wa uadilifu.[a]
  revised_footnotes:
  - marker: a
    text: Au “haki.”
    reason: lexical_alternative
  revision_rationale: The revision moderates the connective to reflect δέ, keeps both verbs passive, maintains the slavery metaphor, and uses “uadilifu” as the primary rendering of δικαιοσύνη while preserving “haki” as a lexical alternative.
