  text: Εἰ γὰρ σύμφυτοι γεγόναμεν τῷ ὁμοιώματι τοῦ θανάτου αὐτοῦ, ἀλλὰ καὶ τῆς ἀναστάσεως ἐσόμεθα·
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/005.yaml
  text: For if we have become united with him in the likeness of his death[b][a], we will certainly also be united with him in the likeness of his resurrection.
translation:
  language: sw
  text: Kwa maana, ikiwa tumeunganishwa naye katika mfano wa kifo chake[a], hakika tutaunganishwa naye pia katika mfano wa ufufuo wake[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “tumekua pamoja naye katika mfano wa kifo chake.”
    reason: lexical_alternative
  - marker: b
    text: 'Kigiriki: “bali pia tutakuwa wa ufufuo”; kiarifu cha kuunganishwa kinaeleweka kutoka kishazi cha kwanza.'
    reason: alternative_reading
lexical_decisions:
- source_word: σύμφυτοι
  choice: tumeunganishwa naye
  rationale: Neno hili linaweza kueleza kukua pamoja au kuwa katika muungano wa karibu. Kauli hii ya Kiswahili inaonyesha ushirika wa kweli na Kristo bila kulazimisha picha ya mimea.
- source_word: γεγόναμεν
  choice: tumeunganishwa
  rationale: Wakati timilifu wa Kigiriki unaonyesha jambo lililotokea lenye matokeo yanayoendelea sasa; umbo la Kiswahili lenye kiambishi -me- linadumisha maana hiyo kwa kawaida.
- source_word: τῷ ὁμοιώματι
  choice: katika mfano
  rationale: Hifadhi lugha ya kufanana na hali ya kidatibu bila kuamua kwa undani namna ushirika huo unavyofanya kazi.
- source_word: τοῦ θανάτου αὐτοῦ
  choice: wa kifo chake
  rationale: Ni uwasilishaji wa moja kwa moja wa muundo wa umilikishi wa Kigiriki.
- source_word: ἀλλὰ καὶ
  choice: hakika ... pia
  rationale: Hutoa msisitizo wa sehemu ya pili na uhusiano wake wenye nguvu na sharti la kwanza kwa Kiswahili cha kawaida.
- source_word: τῆς ἀναστάσεως
  choice: katika mfano wa ufufuo wake
  rationale: Maneno “katika mfano” na “wake” yameendelezwa kutoka kishazi cha kwanza ili kufanya mlingano uliofichwa katika Kigiriki uwe wazi kwa msomaji.
- source_word: ἐσόμεθα
  choice: tutaunganishwa naye
  rationale: Kigiriki kinasema kihalisi “tutakuwa,” huku kiarifu kutoka kishazi cha kwanza kikieleweka; kukirudia kunatoa sentensi kamili na ya kawaida katika Kiswahili.
theological_decisions:
- issue: Iwapo lugha ya muungano wa Paulo ifafanuliwe kuwa ya kisakramenti, ya kifumbo, au ya sitiari
  choice: Kudumisha “tumeunganishwa naye katika mfano wa kifo chake ... katika mfano wa ufufuo wake” bila kuongeza ufafanuzi mwembamba wa kimafundisho.
  alternative: Tumekua pamoja naye; tumeunganishwa na kielelezo cha kifo chake; tumeshiriki kifo na ufufuo wake.
  rationale: Aya inaeleza ushirika halisi na Kristo huku ikitumia neno “mfano.” Tafsiri inadumisha mvutano huo badala ya kuamua namna hasa ushirika huo unavyotokea.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Mpangilio umewekwa wa asili kadiri unavyowezekana, huku virai vilivyoachwa katika Kigiriki vikikamilishwa kwa uwazi wa Kiswahili.
