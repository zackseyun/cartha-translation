  text: Τί οὖν ἐροῦμεν; ⸀ἐπιμένωμεν τῇ ἁμαρτίᾳ, ἵνα ἡ χάρις πλεονάσῃ;
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/001.yaml
  text: What then shall we say? Should we continue in sin so that grace may increase?[a][b]
translation:
  language: sw
  text: Basi, tuseme nini? Je, tuendelee katika dhambi ili neema izidi?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Je, tudumu katika dhambi ...?”
    reason: lexical_alternative
  - marker: b
    text: Au, “ili neema iongezeke.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί οὖν
  choice: Basi, ... nini?
  rationale: “Basi” linaendeleza hoja ya Paulo kwa kuonyesha hitimisho au swali linalotokana na yaliyotangulia, kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: ἐροῦμεν
  choice: tuseme
  rationale: Huwasilisha swali la kujadiliana kuhusu jambo la kusema, na katika muundo “tuseme nini?” ni Kiswahili cha asili.
- source_word: ἐπιμένωμεν
  choice: tuendelee
  rationale: Wakati wa sasa wa hali tegemezi unauliza kuhusu kuendelea na mwenendo fulani; “tuendelee” ni wazi na wa kawaida, huku “tudumu” likibaki mbadala unaowezekana.
- source_word: τῇ ἁμαρτίᾳ
  choice: katika dhambi
  rationale: Huhifadhi wazo la kubaki katika eneo au mwenendo wa dhambi bila kulibadili kuwa dhambi fulani mahsusi.
- source_word: ἵνα
  choice: ili
  rationale: Huonyesha kusudi au matokeo yanayopendekezwa katika swali la Paulo kwa ufupi na kwa uwazi.
- source_word: ἡ χάρις
  choice: neema
  rationale: Ni istilahi ya Kiswahili iliyozoeleka na sahihi kwa χάρις hapa, ikirejelea fadhili ya Mungu katika hoja ya Paulo.
- source_word: πλεονάσῃ
  choice: izidi
  rationale: Huwasilisha ongezeko la kiasi au kiwango kwa Kiswahili cha sasa; “iongezeke” ni mbadala ulio wazi zaidi lakini wenye uzito mdogo wa wingi.
theological_decisions:
- issue: Iwapo swali la Paulo lielezwe kama ruhusa, wajibu, au utabiri tu
  choice: 'Swali la kimakusudi kuhusu mwenendo: “Je, tuendelee katika dhambi”'
  alternative: “Je, tudumu katika dhambi” au “Je, tutaendelea katika dhambi”
  rationale: Hali tegemezi ya Kigiriki inauliza kuhusu mwenendo unaopendekezwa. “Je, tuendelee” huhifadhi nguvu ya swali hilo bila kulifanya kuwa ruhusa, amri, au utabiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa swali la balagha na mvutano wa hoja umehifadhiwa.
