  text: μηδὲ παριστάνετε τὰ μέλη ὑμῶν ὅπλα ἀδικίας τῇ ἁμαρτίᾳ, ἀλλὰ παραστήσατε ἑαυτοὺς τῷ θεῷ ⸀ὡσεὶ ἐκ νεκρῶν ζῶντας καὶ τὰ μέλη ὑμῶν ὅπλα δικαιοσύνης τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/013.yaml
  text: And do not present your members to sin as weapons of unrighteousness[a], but present yourselves to God as alive from the dead[b], and your members to God as weapons of righteousness.
translation:
  language: sw
  text: Wala msivikabidhi viungo vya miili yenu kwa dhambi kuwa silaha za uovu[a]. Badala yake, jitoeni wenyewe kwa Mungu kama watu walio hai kutoka mautini, na vikabidhini viungo vya miili yenu kwa Mungu kuwa silaha za haki[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “vifaa” badala ya “silaha.”
    reason: lexical_alternative
  - marker: b
    text: Au “uadilifu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παριστάνετε / παραστήσατε
  choice: msivitoe / jitoeni / vitoeni
  rationale: Kitenzi “kutoa” kinaeleza kujiweka au kuweka viungo vya mwili tayari vitumiwe na mwingine. Kurudiwa kwake kunadumisha mlingano wa amri za Kigiriki, huku umbo la kujirejelea “jitoeni” likitumiwa kwa ἑαυτούς.
- source_word: μέλη
  choice: viungo vya miili yenu
  rationale: Hii inaonyesha wazi kuwa Paulo anazungumzia sehemu za mwili zinazotumiwa katika matendo, na inaepuka uwezekano wa “viungo vyenu” kueleweka kama wanachama wa kundi.
- source_word: ὅπλα
  choice: silaha
  rationale: “Silaha” inadumisha taswira ya mapambano iliyo katika neno la Kigiriki; maana pana zaidi ya vifaa imewekwa katika tanbihi.
- source_word: ἀδικίας
  choice: uovu
  rationale: “Uovu” ni lugha ya kawaida na yenye upana wa kimaadili unaofaa katika muktadha huu. Haifungi neno hilo kwenye maana ya ukosefu wa haki ya kijamii pekee.
- source_word: ἁμαρτίᾳ
  choice: dhambi
  rationale: Tafsiri ya moja kwa moja “dhambi” inadumisha namna Paulo anavyoitaja dhambi kana kwamba ni nguvu inayoweza kutumiwa viungo vya mtu, bila kuongeza ufafanuzi huo katika matini.
- source_word: ὡσεὶ ἐκ νεκρῶν ζῶντας
  choice: kama watu walio hai kutoka kwa wafu
  rationale: Kauli hii inadumisha nguvu ya kulinganisha ya ὡσεὶ pamoja na taswira ya kutoka mautini kuingia uzimani, bila kuamua kimya kimya kama inamaanisha ufufuo wa kiroho, wa kimwili, au yote mawili.
- source_word: δικαιοσύνης
  choice: haki
  rationale: “Haki” ni neno la kawaida la Kiswahili kwa δικαιοσύνη na linaweza kubeba wigo wake wa kimaadili na wa kitheolojia; “uadilifu” umetajwa kama uwezekano mwingine katika tanbihi.
theological_decisions:
- issue: Ulinganisho wa dhambi na Mungu kama pande mbili zinazodai matumizi ya mtu
  choice: Mahusiano ya dativu yametafsiriwa moja kwa moja kuwa “kwa dhambi” na “kwa Mungu.”
  alternative: “katika kuitumikia dhambi” na “katika kumtumikia Mungu”
  rationale: Matini ya Kigiriki inadokeza kujikabidhi na utii, lakini haiongezi wazi neno “kutumikia.” Tafsiri inaacha nguvu hiyo ipatikane katika muktadha bila kuifafanua kupita kiasi.
- issue: Maana ya “walio hai kutoka kwa wafu”
  choice: Taswira ya kutoka kwa wafu imedumishwa bila kuongezwa “waliofufuliwa.”
  alternative: “kama watu waliofufuliwa kutoka kwa wafu”
  rationale: “Waliofufuliwa” ingefanya tendo la Mungu kuwa wazi zaidi, lakini ὡσεὶ ἐκ νεκρῶν ζῶντας yenyewe inaacha muundo huo kwa ufupi na kwa ulinganisho. Tafsiri inadumisha mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaoeleweka. “Viungo vya miili yenu” ni wazi zaidi kwa msomaji wa kawaida kuliko “viungo vyenu,” na urudiaji wa “vitoeni/jitoeni” unalinda muundo wa balagha wa mstari.
