id: ROM.6.22
reference: Romans 6:22
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: νυνὶ δέ, ἐλευθερωθέντες ἀπὸ τῆς ἁμαρτίας δουλωθέντες δὲ τῷ θεῷ, ἔχετε τὸν καρπὸν ὑμῶν εἰς ἁγιασμόν, τὸ δὲ τέλος ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/022.yaml
  text: But now[a], having been freed from sin and enslaved to God, you have your fruit unto sanctification, and the end[c][b], eternal life.
translation:
  language: sw
  text: Lakini sasa, baada ya kuwekwa huru kutoka katika dhambi na kufanywa watumwa wa Mungu, mna tunda lenu linaloleta utakaso[a], na mwisho[b] ni uzima wa milele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “utakatifu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “matokeo yake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δέ
  choice: Lakini sasa
  rationale: Inahifadhi utofautishaji wenye nguvu na hali ya awali huku ikiwa ya kawaida katika Kiswahili.
- source_word: ἐλευθερωθέντες ἀπὸ τῆς ἁμαρτίας
  choice: baada ya kuwekwa huru kutoka katika dhambi
  rationale: Muundo wa kutendwa unahifadhi kwamba waamini walipokea tendo la kukombolewa, na ‘dhambi’ ya umoja inabaki kama nguvu au utawala.
- source_word: δουλωθέντες δὲ τῷ θεῷ
  choice: na kufanywa watumwa wa Mungu
  rationale: Inadumisha sitiari kali ya utumwa na uhusiano wa mwenye watumwa unaokusudiwa katika hoja ya Waroma 6, bila kuupunguza kuwa utumishi wa hiari tu.
- source_word: ἔχετε τὸν καρπὸν ὑμῶν
  choice: mna tunda lenu
  rationale: Inahifadhi sitiari ya tunda na usemi wa moja kwa moja wa kuwa nalo badala ya kuufasiri kuwa faida pekee.
- source_word: εἰς ἁγιασμόν
  choice: linaloleta utakaso
  rationale: ‘Linaloleta’ linaonyesha mwelekeo kuelekea matokeo unaowasilishwa na εἰς, huku ‘utakaso’ ukihifadhi maana ya mchakato au hali ya kutakaswa.
- source_word: τὸ δὲ τέλος
  choice: na mwisho wake
  rationale: ‘Mwisho’ ni ulinganifu wa karibu wa τέλος na katika muktadha huu unaeleweka kuwa matokeo ya mwisho.
- source_word: ζωὴν αἰώνιον
  choice: uzima wa milele
  rationale: Huu ni usemi wa kawaida, wazi, na sahihi wa Kiswahili kwa dhana hii.
theological_decisions:
- issue: Sitiari ya utumwa kuhusiana na Mungu
  choice: kufanywa watumwa wa Mungu
  alternative: kuwekwa katika utumishi wa Mungu
  rationale: Paulo analinganisha wazi utumwa wa zamani kwa dhambi na utumwa mpya kwa Mungu; kupunguza sitiari hiyo kungedhoofisha hoja yake.
- issue: Maana ya ἁγιασμός
  choice: utakaso
  alternative: utakatifu
  rationale: ‘Utakaso’ huhifadhi kwa urahisi zaidi wazo la mchakato au matokeo, lakini ‘utakatifu’ pia ni maana halali na umewekwa katika tanbihi.
- issue: Maana ya τέλος
  choice: mwisho wake
  alternative: matokeo yake
  rationale: Neno linaweza kutaja mwisho au tokeo la mwisho; tafsiri kuu inafuata umbo la karibu zaidi, huku tanbihi ikihifadhi maana mbadala.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima, na inayoeleweka kwa wasomaji wa kawaida. Sitiari za ‘watumwa’ na ‘tunda’ zimehifadhiwa kwa sababu ni muhimu kwa muundo wa hoja ya sura hii.
