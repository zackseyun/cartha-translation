id: ROM.6.9
reference: Romans 6:9
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἰδότες ὅτι Χριστὸς ἐγερθεὶς ἐκ νεκρῶν οὐκέτι ἀποθνῄσκει, θάνατος αὐτοῦ οὐκέτι κυριεύει·
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/009.yaml
  text: knowing that the Messiah[a], having been raised from the dead, no longer dies; death no longer rules over him.
translation:
  language: sw
  text: tukijua kwamba Masihi[a], baada ya kufufuliwa kutoka kwa wafu, hafi tena; kifo hakimtawali tena.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Kristo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδότες
  choice: tukijua kwamba
  rationale: Huhifadhi umbo la kitenzi kishirikishi na kuunganisha sentensi hii na hoja inayotangulia bila kubainisha kupita kiasi ikiwa maana ni sababu au msingi.
- source_word: Χριστὸς
  choice: Masihi
  rationale: Katika muktadha huu neno hilo linafanya kazi kama cheo chenye maana; “Masihi” ni neno la kawaida la Kiswahili linalohifadhi dhana ya aliyetiwa mafuta.
- source_word: ἐγερθεὶς
  choice: baada ya kufufuliwa
  rationale: Huhifadhi hali tendwa na kuonyesha kwamba kufufuliwa kulitangulia ukweli kwamba hafi tena.
- source_word: ἐκ νεκρῶν
  choice: kutoka kwa wafu
  rationale: Ni usemi wa asili wa Kiswahili unaowasilisha kufufuliwa kutoka miongoni mwa waliokufa.
- source_word: οὐκέτι
  choice: tena
  rationale: Katika tungo hasi “hafi tena” na “hakimtawali tena,” neno hili huwasilisha kwa kawaida na kwa mkazo hali ambayo haitatokea tena.
- source_word: ἀποθνῄσκει
  choice: hafi
  rationale: Wakati wa sasa unaeleza ukweli wa kudumu kwamba Masihi hayuko tena chini ya kifo; wakati wa sasa wa Kiswahili unafaa.
- source_word: θάνατος
  choice: kifo
  rationale: Tafsiri ya moja kwa moja inayohifadhi kifo kama mhusika wa kisarufi katika tamathali ya Paulo.
- source_word: κυριεύει
  choice: hakimtawali
  rationale: “Kutawala” huwasilisha mamlaka au ubwana wa kifo kwa lugha ya sasa na yenye uzito.
theological_decisions:
- issue: Uwasilishaji wa Χριστός katika hoja ya Paulo
  choice: Masihi
  alternative: Kristo
  rationale: Neno limetafsiriwa kama cheo chenye maana badala ya kuchukuliwa tu kama sehemu ya jina; tanbihi huhifadhi tafsiri mbadala iliyozoeleka.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa kishirikishi umehifadhiwa kwa “tukijua,” huku sentensi za mwisho zikiwa fupi na zenye mkazo kama katika Kigiriki.
