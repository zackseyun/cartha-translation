  text: Μὴ οὖν βασιλευέτω ἡ ἁμαρτία ἐν τῷ θνητῷ ὑμῶν σώματι εἰς τὸ ⸀ὑπακούειν ταῖς ἐπιθυμίαις αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/012.yaml
  text: Therefore[a], do not let sin reign in your mortal body, so that you obey its desires.
translation:
  language: sw
  text: Kwa hiyo, msiache dhambi itawale katika miili yenu ya kufa, hata mkazitii tamaa zake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au labda, “hata mkazitii tamaa za dhambi.”
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Huonyesha hitimisho linalotokana na hoja iliyotangulia na ni kiunganishi cha kawaida, wazi katika Kiswahili.
- source_word: βασιλευέτω
  choice: msiache ... itawale
  rationale: Huhifadhi nguvu ya katazo la wakati wa sasa na taswira ya dhambi kuwa mtawala, huku ikisikika kiasili kwa Kiswahili.
- source_word: ἡ ἁμαρτία
  choice: dhambi
  rationale: Ni tafsiri ya moja kwa moja; kuambatanishwa na ‘itawale’ huhifadhi uhuishaji wa dhambi kama nguvu inayotawala.
- source_word: ἐν τῷ θνητῷ ὑμῶν σώματι
  choice: katika miili yenu inayokufa
  rationale: Kiswahili hutumia wingi kwa kawaida kwa kundi la watu, kwa kuwa kila mmoja ana mwili wake; ‘inayokufa’ huwasilisha hali ya kuwa chini ya mauti bila kudokeza kwamba mwili unaendelea kufa wakati huo pekee.
- source_word: εἰς τὸ ὑπακούειν
  choice: hata mkazitii
  rationale: Huwasilisha matokeo yanayokusudiwa au yanayotokea kutokana na utawala wa dhambi, huku ikihifadhi uhusiano wa kimantiki bila kuamua kabisa kati ya kusudi na matokeo.
- source_word: ταῖς ἐπιθυμίαις
  choice: tamaa
  rationale: Ni neno pana linalofaa katika muktadha wa maadili bila kufupisha maana kuwa tamaa ya ngono pekee.
- source_word: αὐτοῦ
  choice: zake
  rationale: Kisarufi linaelekezwa kwa urahisi zaidi kwa ‘mwili’; katika Kiswahili, upatanisho wa ‘tamaa zake’ pia huacha uwezekano wa msomaji kulihusisha kimuktadha na dhambi, hivyo tanbihi inaeleza utata huo.
theological_decisions:
- issue: Je, dhambi inaonyeshwa kama matendo tu au kama nguvu inayotawala?
  choice: Taswira ya dhambi kama mtawala imehifadhiwa kwa ‘msiache dhambi itawale.’
  alternative: Kufafanua dhambi kuwa tabia au matendo mabaya yanayochukua udhibiti.
  rationale: Kitenzi cha Kigiriki kina taswira ya kifalme na kinaihuisha dhambi; tafsiri haipaswi kuiondoa wala kuongeza mfumo mpana wa kimafundisho.
- issue: Kirejelewa cha αὐτοῦ (‘zake’)
  choice: Katika matini kuu, ‘tamaa zake’ zimeeleweka hasa kuwa tamaa za mwili unaokufa.
  alternative: Kuzielewa kuwa tamaa za dhambi.
  rationale: Kiwakilishi cha Kigiriki ni umoja wa kiume/kati na kwa kawaida kinaafikiana na σώματι, nomino ya kati, si ἁμαρτία, nomino ya kike. Hata hivyo, uhusiano wa kimawazo na dhambi unawezekana katika muktadha na umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Wingi ‘miili yenu inayokufa’ ni wa kiasili kwa wasikilizaji wengi na huhifadhi maana ya kila mtu kuwa na mwili wake. Alama [a] imewekwa baada ya kishazi kinachohusika.
