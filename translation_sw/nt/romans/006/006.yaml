  yaml_path: translation/nt/romans/006/006.yaml
  text: knowing this[a], that our old self was crucified with him, so that the body of sin might be rendered powerless, so that we should no longer be enslaved to sin[c][b],
translation:
  language: sw
  text: 'Tunajua hili: utu wetu wa kale[a] ulisulubishwa pamoja naye, ili mwili wa dhambi upokonywe nguvu[b], kusudi tusiwe tena watumwa wa dhambi[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa karibu zaidi na umbo la Kigiriki, “mtu wetu wa kale”; au, “nafsi yetu ya kale.”
    reason: lexical_alternative
  - marker: b
    text: Au, “ubatilishwe” au “ufanywe usiwe na nguvu.”
    reason: lexical_alternative
  - marker: c
    text: Au, “tusiitumikie tena dhambi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο γινώσκοντες
  choice: Tunajua hili
  rationale: Kauli hii inaendeleza hoja iliyotangulia. Kiswahili cha sasa hutumia sentensi kamili kwa ufasaha, huku “hili” likihifadhi rejeo la τοῦτο.
- source_word: ὁ παλαιὸς ἡμῶν ἄνθρωπος
  choice: utu wetu wa kale
  rationale: “Utu wetu wa kale” ni usemi wa kawaida na mpana unaoeleza hali yetu ya zamani bila kudokeza kwamba wanaume pekee ndio wanaohusika. Tanbihi inahifadhi tafsiri iliyo karibu zaidi na umbo la neno ἄνθρωπος.
- source_word: συνεσταυρώθη
  choice: ulisulubishwa pamoja naye
  rationale: “Pamoja naye” linaonyesha wazi kiambishi συν-, yaani kushiriki kusulubishwa kwake, bila kutumia usemi mgumu usio wa kawaida.
- source_word: καταργηθῇ
  choice: upokonywe nguvu
  rationale: Chaguo hili linaonyesha kuondolewa kwa uwezo au utendaji wa kitu, bila kulazimisha maana kali zaidi ya kuangamizwa kabisa.
- source_word: τὸ σῶμα τῆς ἁμαρτίας
  choice: mwili wa dhambi
  rationale: Muundo wa kimilikishi wa Kigiriki umehifadhiwa, hivyo tafsiri haisuluhishi kimya-kimya iwapo ni mwili unaotawaliwa na dhambi au mwili unaohusiana na dhambi kwa namna nyingine.
- source_word: τοῦ μηκέτι δουλεύειν ἡμᾶς τῇ ἁμαρτίᾳ
  choice: kusudi tusiwe tena watumwa wa dhambi
  rationale: δουλεύω ina taswira ya utumwa au utumishi chini ya bwana. “Watumwa wa dhambi” linahifadhi uzito wa taswira hiyo kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Maana ya usemi ὁ παλαιὸς ἡμῶν ἄνθρωπος
  choice: utu wetu wa kale
  alternative: mtu wetu wa kale; nafsi yetu ya kale
  rationale: Chaguo kuu ni la asili katika Kiswahili na linahusu hali ya zamani ya wanadamu kwa ujumla. Tanbihi inahifadhi umbo halisi zaidi bila kufanya usemi huo uwahusu wanaume pekee.
- issue: Nguvu ya καταργηθῇ kuhusiana na mwili wa dhambi
  choice: upokonywe nguvu
  alternative: ubatilishwe; uondolewe
  rationale: Tafsiri hii inaonyesha kwamba uwezo wa mwili wa dhambi kufanya kazi umevunjwa, lakini haidai kwa lazima kwamba mwili huo umeangamizwa kabisa.
- issue: Taswira ya δουλεύειν
  choice: tusiwe tena watumwa wa dhambi
  alternative: tusiitumikie tena dhambi
  rationale: Maana zote mbili zinawezekana, lakini chaguo kuu linahifadhi kwa nguvu zaidi taswira ya dhambi kama bwana anayewatawala watumwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi umefanywa wa asili kwa Kiswahili huku taswira za kusulubishwa pamoja, mwili wa dhambi, na utumwa kwa dhambi zikihifadhiwa.
