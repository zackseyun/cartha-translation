translation:
  language: sw
  text: Kwa maana aliyekufa amehesabiwa haki mbali na dhambi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “amewekwa huru kutoka katika dhambi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ... ἀποθανὼν
  choice: aliyekufa
  rationale: Kirai chenye kibainishi na kitenzi-shirikishi kinamtaja mtu yeyote anayehusika; ‘aliyekufa’ ni ya asili, fupi, na haiwekei jinsia isiyohitajika.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Kiunganishi hiki kinatoa sababu au ufafanuzi wa kauli iliyotangulia; ‘Kwa maana’ huonyesha uhusiano huo kwa Kiswahili sanifu.
- source_word: δεδικαίωται
  choice: amehesabiwa kuwa hana hatia
  rationale: Wakati timilifu wa hali ya kutendwa unaonyesha uamuzi uliofanywa wenye matokeo yanayoendelea. Tafsiri hii inadumisha maana ya kimahakama ya δικαιόω bila kuifupisha kuwa ukombozi pekee.
- source_word: ἀπὸ τῆς ἁμαρτίας
  choice: na kuondolewa chini ya dhambi
  rationale: ἀπό huonyesha kutenganishwa au kuondolewa kutoka katika dai au mamlaka ya dhambi. Katika Kiswahili, nyongeza hii huifanya taswira ya kisheria ieleweke bila kupoteza wazo la kuachiliwa kutoka utawala wa dhambi.
theological_decisions:
- issue: Je, δεδικαίωται ielezwe kwa maana ya kimahakama (‘amehesabiwa haki/ameondolewa hatia’) au kwa maana ya kuachiliwa (‘amewekwa huru’)?
  choice: amehesabiwa kuwa hana hatia na kuondolewa chini ya dhambi
  alternative: amehesabiwa haki mbali na dhambi; amewekwa huru kutoka katika dhambi
  rationale: Muktadha wa Waroma 6 unasisitiza kuondolewa katika utawala wa dhambi, lakini Paulo ametumia δικαιόω, neno lenye uzito wa kimahakama. Kauli kuu inadumisha hukumu ya kutokuwa na hatia pamoja na matokeo ya kutenganishwa na dai la dhambi; tanbihi huhifadhi njia fupi mbadala.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Aliyekufa’ ni jumuishi; lugha ya kimahakama na wazo la kuachiliwa vimedumishwa bila kuamua mvutano wa kimaana upande mmoja tu.
