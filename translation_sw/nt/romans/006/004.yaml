id: ROM.6.4
reference: Romans 6:4
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: συνετάφημεν οὖν αὐτῷ διὰ τοῦ βαπτίσματος εἰς τὸν θάνατον, ἵνα ὥσπερ ἠγέρθη Χριστὸς ἐκ νεκρῶν διὰ τῆς δόξης τοῦ πατρός, οὕτως καὶ ἡμεῖς ἐν καινότητι ζωῆς περιπατήσωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/004.yaml
  text: Therefore we were buried with him through baptism into death[a], so that just as Messiah was raised from the dead through the glory of the Father, so also we might walk in newness of life.
translation:
  language: sw
  text: Kwa hiyo, tulizikwa pamoja naye katika kifo kwa njia ya ubatizo, ili kama vile Masihi[a] alivyofufuliwa kutoka kwa wafu kwa njia ya utukufu wa Baba, vivyo hivyo sisi pia tuenende katika upya wa uzima.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, Kristo.
    reason: Namna nyingine iliyozoeleka ya kutafsiri Χριστός.
lexical_decisions:
- source_word: συνετάφημεν
  choice: tulizikwa pamoja naye
  rationale: Kauli ya kutendwa ya wakati uliopita inaonyesha tendo lililotimia; kiambishi συν- kinaelezwa kwa kawaida kwa “pamoja naye.”
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Inaonyesha hitimisho linalotokana na hoja iliyotangulia na kuhifadhi mtiririko wa mantiki ya Paulo.
- source_word: διὰ τοῦ βαπτίσματος
  choice: kwa njia ya ubatizo
  rationale: διά pamoja na hali ya umilikaji ina maana ya chombo au njia; tafsiri hii huhifadhi maana hiyo bila kuamua msimamo fulani wa kimadhehebu kuhusu ubatizo.
- source_word: εἰς τὸν θάνατον
  choice: kuingia katika kifo
  rationale: “Kuingia katika” huhifadhi mwelekeo wa εἰς na wazo la kuingizwa katika kifo, badala ya kuwa karibu nacho tu.
- source_word: ἵνα
  choice: ili
  rationale: Huonyesha kusudi kwa Kiswahili cha kawaida na wazi.
- source_word: Χριστὸς
  choice: Masihi
  rationale: Huhifadhi maana ya cheo cha Χριστός, yaani Mtiwa-Mafuta; namna mbadala iliyozoeleka imeonyeshwa katika tanbihi.
- source_word: ἐκ νεκρῶν
  choice: kutoka kwa wafu
  rationale: Ni usemi wa kawaida unaoonyesha kufufuliwa kutoka miongoni mwa walio katika hali ya kifo.
- source_word: διὰ τῆς δόξης τοῦ πατρός
  choice: kwa njia ya utukufu wa Baba
  rationale: Huhifadhi maana ya chombo katika διά na uzito mpana wa δόξα bila kuifupisha kuwa “nguvu” pekee.
- source_word: περιπατήσωμεν
  choice: tuenende
  rationale: Huhifadhi sitiari ya kutembea kama mwenendo wa maisha na pia nguvu ya kusudi ya hali tegemezi chini ya ἵνα.
- source_word: ἐν καινότητι ζωῆς
  choice: katika upya wa uzima
  rationale: Huhifadhi usemi wa dhahania wa Paulo na tofauti yake na parafrasi rahisi ya “maisha mapya.”
theological_decisions:
- issue: Iwapo διὰ τοῦ βαπτίσματος itafsiriwe kwa namna inayodokeza fundisho maalumu kuhusu sakramenti
  choice: kwa njia ya ubatizo
  alternative: kwa ubatizo
  rationale: Uamuzi huu huhifadhi maana ya kisarufi ya chombo au njia bila kuingiza hitimisho la kimadhehebu kuhusu jinsi ubatizo unavyohusiana na kuunganishwa na Masihi.
- issue: Namna ya kuwakilisha Χριστός katika muktadha huu
  choice: Masihi
  alternative: Kristo
  rationale: “Masihi” huonyesha wazi cheo cha Mtiwa-Mafuta, huku “Kristo” ikihifadhiwa katika tanbihi kama namna nyingine iliyozoeleka sana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Tuenende katika upya wa uzima” huhifadhi sitiari na msamiati wa chanzo, ingawa ni wa mtindo wa juu kidogo kuliko mazungumzo ya kila siku.
