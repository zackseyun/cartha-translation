  text: If we died with Messiah[a], we believe that we will also live with him.
translation:
  language: sw
  text: Na ikiwa tulikufa pamoja na Masihi[a], tunaamini kwamba pia tutaishi pamoja naye.
  philosophy: optimal-equivalence
  footnotes:
