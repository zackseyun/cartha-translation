lexical_decisions:
- source_word: εἰ δὲ
  choice: Lakini ikiwa
  rationale: εἰ huanzisha sharti, na δέ huendeleza hoja kwa mguso wa utofautishaji; “Lakini ikiwa” huhifadhi kiunganishi hicho kwa Kiswahili cha kawaida.
- source_word: ἀπεθάνομεν
  choice: tulikufa
  rationale: Wakati aoristi unaelekeza kwenye tukio lililokwisha kutajwa; wakati uliopita sahili ni wa moja kwa moja na wa asili.
- source_word: σὺν Χριστῷ
  choice: pamoja na Masihi
  rationale: σύν huonyesha ushirika, na Χριστός hapa ni cheo; “Masihi” huhifadhi maana ya cheo badala ya kukifanya kuwa jina.
- source_word: πιστεύομεν
  choice: tunaamini
  rationale: Hii ndiyo tafsiri ya moja kwa moja ya πιστεύομεν na inaeleza msimamo wa imani wa sasa.
- source_word: ὅτι
  choice: kwamba
  rationale: ὅτι huanzisha maudhui ya kile kinachoaminiwa; “kwamba” huweka uhusiano huo wazi.
- source_word: καὶ
  choice: pia
  rationale: καί huunganisha uhai wa baadaye na kufa pamoja na Masihi kulikotajwa awali.
- source_word: συζήσομεν αὐτῷ
  choice: tutaishi pamoja naye
  rationale: Kitenzi συζάω chenye αὐτῷ hueleza kuishi pamoja naye; tafsiri hii huhifadhi wazo la ushirika bila kuongeza maelezo yasiyosemwa wazi.
theological_decisions:
- issue: Tafsiri ya Χριστῷ
  choice: Masihi
  alternative: Kristo
  rationale: Neno la Kigiriki ni cheo kinachomaanisha Mtiwa-Mafuta; “Masihi” huhifadhi wazi matumizi hayo ya kicheo. Tanbihi inatoa namna nyingine iliyozoeleka.
- issue: Maana ya maisha ya baadaye katika συζήσομεν αὐτῷ
  choice: tutaishi pamoja naye
  alternative: tutafufuka na kuishi pamoja naye
  rationale: Kauli ya Kigiriki inataja maisha ya pamoja ya baadaye bila kufafanua hapa utaratibu wake; tafsiri haiongezi ufafanuzi wa kiteolojia usiotajwa moja kwa moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. “Pamoja na” limetumiwa kwa pande zote mbili ili kudhihirisha ulinganifu wa kufa na kuishi na Masihi.
