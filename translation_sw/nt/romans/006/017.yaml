id: ROM.6.17
reference: Romans 6:17
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: χάρις δὲ τῷ θεῷ ὅτι ἦτε δοῦλοι τῆς ἁμαρτίας ὑπηκούσατε δὲ ἐκ καρδίας εἰς ὃν παρεδόθητε τύπον διδαχῆς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/017.yaml
  text: But thanks be to God that[a], though you were servants of sin[b], you obeyed from the heart the pattern of teaching to which you were handed over.
translation:
  language: sw
  text: Lakini Mungu ashukuriwe kwamba, ingawa mlikuwa watumwa wa dhambi, mlitii kwa moyo ule muundo wa mafundisho[a] ambao mlikabidhiwa kwake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kielelezo cha mafundisho” au “kiwango cha mafundisho.”
    reason: lexical_alternative
  - marker: b
    text: Au, “ambao mlikabidhiwa ndani yake.”
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις δὲ τῷ θεῷ
  choice: Lakini Mungu ashukuriwe
  rationale: Huu ni msemo wa kumshukuru Mungu, si matumizi ya ‘neema’ kama sifa ya jumla. Kauli hii ni ya asili na yenye hadhi katika Kiswahili.
- source_word: δοῦλοι τῆς ἁμαρτίας
  choice: watumwa wa dhambi
  rationale: ‘Watumwa’ huhifadhi picha ya kumilikiwa na kutawaliwa ambayo ni muhimu katika hoja ya Waroma 6; ‘watumishi’ ingepunguza nguvu ya sitiari hiyo.
- source_word: ὑπηκούσατε
  choice: mlitii
  rationale: Kitenzi kinaonyesha kutii, si kusikia tu, na umbo hili linawasilisha tendo hilo moja kwa moja.
- source_word: ἐκ καρδίας
  choice: kwa moyo wote
  rationale: Kauli hii ya kawaida ya Kiswahili huhifadhi maana ya utii wa ndani, wa hiari na wa dhati, bila kuifanya kuwa maelezo marefu.
- source_word: τύπον διδαχῆς
  choice: kielelezo cha mafundisho
  rationale: ‘Kielelezo’ huwasilisha wazo la τύπος kama mfano, muundo au kiwango kinachoongoza, huku ‘mafundisho’ likiwakilisha διδαχή kwa lugha iliyo wazi.
- source_word: παρεδόθητε
  choice: mlikabidhiwa
  rationale: 'Umbo la kutendwa limehifadhiwa: waamini ndio waliokabidhiwa, badala ya kubadili picha hiyo na kusema mafundisho yalikabidhiwa kwao.'
- source_word: εἰς ὃν
  choice: ambacho ... kwake
  rationale: Muundo huu unaonyesha kuelekezwa kwao kwenye kielelezo hicho na kuunganika kiasili na ‘mlikabidhiwa,’ huku tanbihi ikihifadhi uwezekano wa maana halisi zaidi ya ‘ndani yake.’
theological_decisions:
- issue: Iwapo δοῦλοι ilainishwe kuwa ‘watumishi’ au itafsiriwe ‘watumwa’
  choice: watumwa wa dhambi
  alternative: watumishi wa dhambi
  rationale: Muktadha unasisitiza utawala na utumwa wa dhambi, kisha unalinganisha hali hiyo na utumwa wa haki. ‘Watumwa’ huhifadhi uzito wa picha hiyo bila kuingiza msimamo wa kimadhehebu.
- issue: Iwapo sentensi ibadilishwe ili mafundisho ndiyo yakabidhiwe kwa waamini
  choice: kielelezo cha mafundisho ambacho mlikabidhiwa kwake
  alternative: mafundisho mliyokabidhiwa
  rationale: Kiyunani kinawaonyesha waamini kuwa ndio waliokabidhiwa kwa kielelezo cha mafundisho. Tafsiri imehifadhi umbo hilo lisilo la kawaida na mvutano wake wa kitheolojia badala ya kulisawazisha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye hadhi na unaoeleweka. ‘Mungu ashukuriwe’ ina sauti ya shukrani ya Paulo; ‘kwa moyo wote’ ni msemo wa kawaida unaobeba utii wa dhati. Muundo usio wa kawaida wa waamini kukabidhiwa kwa mafundisho umehifadhiwa kwa makusudi.
