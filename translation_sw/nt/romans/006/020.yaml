  text: Ὅτε γὰρ δοῦλοι ἦτε τῆς ἁμαρτίας, ἐλεύθεροι ἦτε τῇ δικαιοσύνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/020.yaml
  text: For when you were servants of sin[b][a], you were free in regard to righteousness.
translation:
  language: sw
  text: Kwa maana, mlipokuwa watumwa wa dhambi, mlikuwa huru kwa habari ya haki.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mlikuwa huru kwa habari ya uadilifu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλοι
  choice: watumwa
  rationale: Neno hili linahifadhi maana ya kuwa chini ya mamlaka ya bwana mwingine na linafaa kwa utofautishaji wa Paulo kati ya utumwa wa dhambi na utumwa unaotajwa katika muktadha.
- source_word: ἁμαρτίας
  choice: wa dhambi
  rationale: 'Hii ni tafsiri ya kawaida ya hali ya umilikaji au mamlaka katika kirai δοῦλοι τῆς ἁμαρτίας: walikuwa watumwa walio chini ya dhambi.'
- source_word: ἐλεύθεροι
  choice: huru
  rationale: 'Linahifadhi ukinzani mkali na wenye kejeli wa Paulo: walipokuwa watumwa wa dhambi, hawakuwa chini ya madai ya haki.'
- source_word: τῇ δικαιοσύνῃ
  choice: kuhusiana na haki
  rationale: Dativu inaeleweka kwa kawaida kama ya uhusiano au heshima; usemi huu unahifadhi maana hiyo bila kudokeza kwamba haki yenyewe ni bwana mwonevu.
- source_word: δικαιοσύνῃ
  choice: haki
  rationale: Katika Kiswahili, “haki” linaweza kueleza uadilifu au hali ya kuwa sawa mbele za Mungu na pia linaacha upana wa maana wa δικαιοσύνη katika hoja ya Paulo.
- source_word: γὰρ
  choice: kwa maana
  rationale: Inaonyesha kuwa mstari huu unatoa maelezo yanayounga mkono hoja iliyotangulia.
theological_decisions:
- issue: Jinsi ya kueleza uhusiano wao na haki katika ukinzani wa Paulo
  choice: mlikuwa huru kuhusiana na haki
  alternative: mlikuwa huru mbali na haki
  rationale: Tafsiri hii inahifadhi mvutano wa usemi wa Kigiriki na haifanyi haki ionekane kana kwamba yenyewe ilikuwa utumwa mbaya; pia hailegezi ukali wa hali yao ya zamani.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Watumwa” ni wazi kwa wasomaji wa kawaida, na “kuhusiana na haki” ni usemi wa asili unaohifadhi dativu ya uhusiano. Alama ya tanbihi [a] imewekwa katika matini kuu.
