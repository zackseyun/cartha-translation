  text: ἢ ἀγνοεῖτε ὅτι ὅσοι ἐβαπτίσθημεν εἰς Χριστὸν Ἰησοῦν εἰς τὸν θάνατον αὐτοῦ ἐβαπτίσθημεν;
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/003.yaml
  text: Or do you not know that all of us who were baptized into Messiah Jesus were baptized into his death?[a]
translation:
  language: sw
  text: Au hamjui kwamba sisi sote tuliobatizwa katika Masihi Yesu[a] tulibatizwa katika kifo chake?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “Kristo Yesu.” Kigiriki: Christos Iēsous.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: Au
  rationale: Inahifadhi mpito wa hoja ya Paulo na kuunganisha swali hili na yaliyotangulia.
- source_word: ἀγνοεῖτε
  choice: hamjui
  rationale: Ni usemi wa kawaida wa Kiswahili kwa swali la balagha linalowakumbusha wasomaji jambo wanalopaswa kulijua.
- source_word: ὅσοι
  choice: sisi sote
  rationale: Pamoja na kitenzi cha nafsi ya kwanza wingi, tafsiri hii inaonyesha kwa kawaida upeo jumuishi wa wale waliobatizwa.
- source_word: ἐβαπτίσθημεν
  choice: tuliobatizwa
  rationale: Inawakilisha moja kwa moja kitenzi cha wakati uliopita na hali ya kutendwa bila kuongeza ufafanuzi wa kimadhehebu kuhusu ubatizo.
- source_word: εἰς
  choice: katika
  rationale: Katika Kiswahili, “kubatizwa katika” ni usemi wa asili unaohifadhi wazo la kuingizwa au kuhusishwa kwa karibu bila kufafanua utaratibu wake wa kitheolojia.
- source_word: Χριστὸν Ἰησοῦν
  choice: Masihi Yesu
  rationale: “Masihi” linaonyesha maana ya cheo cha Χριστός; tanbihi inatoa namna nyingine iliyozoeleka, “Kristo Yesu.”
- source_word: θάνατον
  choice: kifo
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya θάνατος.
- source_word: αὐτοῦ
  choice: chake
  rationale: Kiwakilishi cha umilikaji kinarejelea kifo cha Masihi Yesu kwa kawaida na kwa uwazi.
theological_decisions:
- issue: Iwapo εἰς katika lugha ya ubatizo ifafanuliwe kuwa ufanisi wa kisakramenti, utambulisho wa kiishara, au muungano wa agano.
  choice: Matumizi yote mawili yametafsiriwa kwa “katika.”
  alternative: “kuingia katika” au “kwa kuhusishwa na”
  rationale: “Katika” linahifadhi wazo pana la kuingizwa au kuhusishwa na Masihi Yesu na kifo chake, bila kuamua kwa niaba ya maelezo fulani ya kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Swali la balagha limehifadhiwa, na sentensi haijaongezewa maelezo ya kimadhehebu.
