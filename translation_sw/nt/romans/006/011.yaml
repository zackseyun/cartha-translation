  text: οὕτως καὶ ὑμεῖς λογίζεσθε ἑαυτοὺς ⸂εἶναι νεκροὺς μὲν⸃ τῇ ἁμαρτίᾳ ζῶντας δὲ τῷ θεῷ ἐν Χριστῷ ⸀Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/011.yaml
  text: So also you[c][b][a], consider yourselves to be dead to sin but alive to God in Messiah Jesus.
translation:
  language: sw
  text: Vivyo hivyo ninyi pia, jihesabuni kuwa wafu kwa dhambi, bali kuwa hai kwa Mungu katika Masihi Yesu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως καὶ
  choice: Vivyo hivyo ... pia
  rationale: Inaendeleza hitimisho kutoka hoja iliyotangulia kwa Kiswahili cha kawaida, huku ikihifadhi nguvu ya ‘hivyo pia’.
- source_word: λογίζεσθε
  choice: jihesabuni
  rationale: Kitenzi hiki kina maana ya kujiona au kujihesabu kuwa katika hali fulani. ‘Jihesabuni’ kinahifadhi wazo la kukadiria jambo kuwa kweli na pia hali ya amri.
- source_word: ἑαυτοὺς
  choice: ji- katika ‘jihesabuni’
  rationale: Kirejeshi cha Kigiriki kinawakilishwa kwa kiambishi cha kujirejelea ‘ji-’, ambacho ni cha asili katika Kiswahili.
- source_word: εἶναι
  choice: kuwa
  rationale: Kitenzi-jina cha Kigiriki kimehifadhiwa wazi katika muundo ‘jihesabuni kuwa’.
- source_word: νεκροὺς μὲν τῇ ἁμαρτίᾳ
  choice: wafu kwa dhambi
  rationale: ‘Kwa dhambi’ kinaonyesha uhusiano na dhambi bila kuufafanua kupita kiasi; utofautishaji wa μέν ... δέ unaonyeshwa kwa ‘lakini’.
- source_word: ζῶντας δὲ τῷ θεῷ
  choice: walio hai kwa Mungu
  rationale: Kinadumisha ulinganifu wa ‘wafu ... walio hai’ na uhusiano wa dativu kwa Mungu bila kuugeuza kuwa maelezo ya ziada.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: katika Masihi Yesu
  rationale: ‘Katika’ linahifadhi ἐν na lugha ya Paulo kuhusu kuwa ndani ya Masihi; ‘Masihi’ linawasilisha Χριστός kama cheo.
theological_decisions:
- issue: Kutafsiri Χριστῷ kama cheo au kama jina lililozoeleka
  choice: Masihi
  alternative: Kristo
  rationale: Katika kifungu hiki neno bado lina uzito wa cheo; ‘Masihi’ huonyesha maana hiyo bila kuingiza msimamo wa kimadhehebu.
- issue: Nguvu ya ἐν Χριστῷ Ἰησοῦ
  choice: katika Masihi Yesu
  alternative: kwa njia ya Masihi Yesu
  rationale: ‘Katika’ huhifadhi uwezekano mpana wa maana ya ἐν na lugha ya muungano au mazingira ya kuwamo ndani ya Masihi, badala ya kuibana kuwa chombo pekee.
- issue: Maana ya kuwa ‘wafu kwa dhambi’ na ‘hai kwa Mungu’
  choice: Kudumisha kauli ya picha bila kuifafanua
  alternative: Kufafanua kuwa hawatawaliwi tena na dhambi na wanaishi kwa ajili ya Mungu
  rationale: Chanzo kinatumia utofautishaji wenye nguvu wa kifo na uhai; tafsiri haipaswi kutatua kimya kimya upeo wa kitheolojia wa picha hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni mfupi kama Kigiriki. ‘Jihesabuni’ ni amri kwa wingi na ni ya asili zaidi kuliko kuongeza kiwakilishi tofauti ‘wenyewe’. Hakuna tanbihi iliyohitajika kwa kuwa chaguo kuu linaeleweka na mbadala muhimu zimeandikwa katika maamuzi ya kileksika na kitheolojia.
