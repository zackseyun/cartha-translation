id: ROM.6.14
reference: Romans 6:14
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἁμαρτία γὰρ ὑμῶν οὐ κυριεύσει, οὐ γάρ ἐστε ὑπὸ νόμον ἀλλὰ ὑπὸ χάριν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/014.yaml
  text: For sin will not rule over you[b][a], because you are not under the law but under grace.
translation:
  language: sw
  text: Kwa maana dhambi haitawatawala[a], kwa sababu hamko chini ya sheria[b], bali chini ya neema.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “haitakuwa na mamlaka juu yenu.”
    reason: lexical_alternative
  - marker: b
    text: Tafsiri halisi ni “chini ya sheria,” yaani chini ya mamlaka au utawala wa sheria.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἁμαρτία
  choice: dhambi
  rationale: Neno la kawaida la Kiswahili kwa dhambi; linabaki bila herufi kubwa huku kitenzi kikihifadhi taswira yake kama nguvu inayotawala.
- source_word: κυριεύσει
  choice: haitawatawala
  rationale: Huwasilisha maana ya kutumia mamlaka au ubwana juu ya watu kwa lugha ya kawaida na yenye hadhi.
- source_word: ὑπὸ νόμον
  choice: chini ya sheria
  rationale: Huhifadhi tamathali ya Kigiriki ya kuwa chini ya mamlaka au utawala wa sheria bila kufafanua zaidi ya maandishi.
- source_word: χάριν
  choice: neema
  rationale: Ni istilahi ya kawaida na inayofaa katika maandiko ya Paulo kwa χάρις, hasa katika utofautishaji wake na sheria.
- source_word: γὰρ ... γάρ
  choice: Kwa maana ... kwa sababu
  rationale: ‘Kwa maana’ huunganisha aya na hoja iliyotangulia, na ‘kwa sababu’ huonyesha kwamba kishazi cha pili kinaeleza msingi wa kauli ya kwanza.
theological_decisions:
- issue: Iwapo kuifanya nafsi ya dhambi ionekane wazi zaidi
  choice: Kutumia ‘dhambi haitawatawala’ bila kuandika ‘Dhambi’ kwa herufi kubwa.
  alternative: ‘Dhambi haitakuwa na mamlaka juu yenu.’
  rationale: Kigiriki huipa dhambi taswira ya mtawala kupitia kitenzi, lakini hakihitaji herufi kubwa wala ufafanuzi wa ziada wa kimafundisho.
- issue: Maana ya kuwa ‘chini ya sheria’
  choice: Kuhifadhi usemi ‘chini ya sheria’.
  alternative: ‘Chini ya mamlaka ya sheria.’
  rationale: Usemi wa moja kwa moja huhifadhi upana na mvutano wa lugha ya Paulo; tanbihi inaeleza maana ya kimamlaka bila kuibana ndani ya tafsiri kuu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Haitawatawala’ ni ya asili na inaeleweka kwa urahisi; viwakilishi vya wingi vinawakilisha ὑμῶν na ἐστε. Alama zote za tanbihi zimewekwa mara moja katika maandishi makuu karibu na maneno yanayohusika.
