id: ROM.6.16
reference: Romans 6:16
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οὐκ οἴδατε ὅτι ᾧ παριστάνετε ἑαυτοὺς δούλους εἰς ὑπακοήν, δοῦλοί ἐστε ᾧ ὑπακούετε, ἤτοι ἁμαρτίας εἰς θάνατον ἢ ὑπακοῆς εἰς δικαιοσύνην;
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/016.yaml
  text: Do you not know that if you present yourselves as servants for obedience[a], you are servants of the one whom you obey—either of sin leading to death, or of obedience leading to righteousness?
translation:
  language: sw
  text: Je, hamjui kwamba mkijitoa wenyewe kwa mtu kuwa watumwa ili kumtii, ninyi ni watumwa wa yule mnayemtii—ama wa dhambi inayoongoza kwenye kifo, au wa utii unaoongoza kwenye haki[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, uadilifu.
    reason: lexical_alternative
lexical_decisions:
- source_word: παριστάνετε ἑαυτούς
  choice: mkijitoa wenyewe
  rationale: “Kujitoa wenyewe” huonyesha mtu kujiweka kwa hiari chini ya mamlaka ya mwingine, huku ikisomeka kwa kawaida katika Kiswahili cha sasa.
- source_word: δούλους / δοῦλοί
  choice: watumwa
  rationale: “Watumwa” huhifadhi hali ya kuwa chini ya umiliki na mamlaka ya mwingine, ambayo ni muhimu katika mfano wa Paulo.
- source_word: εἰς ὑπακοήν
  choice: ili kumtii
  rationale: Kifungu hiki huonyesha kusudi la kujitoa; muundo wa kitenzi ni wa kawaida zaidi katika Kiswahili kuliko nomino dhahania katika sehemu hii.
- source_word: ᾧ ὑπακούετε
  choice: yule mnayemtii
  rationale: Huhifadhi uhusiano na mwenye mamlaka anayepokea utii bila kuongeza neno “bwana,” ambalo halipo wazi katika Kigiriki.
- source_word: ἁμαρτίας
  choice: dhambi
  rationale: Tafsiri ya moja kwa moja hudumisha uhuishaji wa dhambi unaotokana na picha ya utumwa bila kuongeza maelezo ya kitafsiri kama “nguvu ya dhambi.”
- source_word: εἰς θάνατον
  choice: inayoongoza kwenye kifo
  rationale: Huonyesha kwa uwazi mwelekeo au matokeo yanayobebwa na εἰς katika Kiswahili cha kawaida.
- source_word: ὑπακοῆς
  choice: utii
  rationale: Nomino “utii” huhifadhi ulinganifu wa Paulo kati ya dhambi na utii kama mamlaka mbili zinazotofautiana.
- source_word: δικαιοσύνην
  choice: haki
  rationale: “Haki” ni istilahi pana na iliyozoeleka katika Kiswahili cha Biblia kwa δικαιοσύνη; inaweza kubeba maana ya hali ya kuwa sawa mbele za Mungu na mwenendo ulionyooka, huku “uadilifu” ukihifadhiwa kama mbadala.
theological_decisions:
- issue: Maana ya δικαιοσύνη katika ulinganisho wa Paulo
  choice: haki
  alternative: uadilifu
  rationale: Muktadha unalinganisha utumwa wa dhambi unaoelekea kifoni na utii unaoelekea kwenye δικαιοσύνη. “Haki” hudumisha upana wa istilahi ya Paulo bila kuifunga kwa haki ya kijamii au tabia njema pekee; “uadilifu” ni mbadala halali wa kileksika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa swali la balagha na picha kali ya utumwa vimehifadhiwa; sentensi imepangwa ili isomeke kwa urahisi bila kuondoa ulinganifu wa dhambi/kifo na utii/haki.
