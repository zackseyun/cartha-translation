  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: τὰ γὰρ ὀψώνια τῆς ἁμαρτίας θάνατος, τὸ δὲ χάρισμα τοῦ θεοῦ ζωὴ αἰώνιος ἐν Χριστῷ Ἰησοῦ τῷ κυρίῳ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/023.yaml
  text: For the wages of sin is death[b][a], but the gift of God is eternal life in Messiah Jesus our Lord.
translation:
  language: sw
  text: Kwa maana mshahara wa dhambi ni mauti, lakini zawadi[a] ya Mungu ni uzima wa milele katika Masihi Yesu, Bwana wetu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “zawadi ya neema.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀψώνια
  choice: mshahara
  rationale: Neno hili linaonyesha malipo yanayopatikana au kulipwa; “mshahara” linahifadhi vizuri tofauti kati ya kile ambacho dhambi hulipa na zawadi ambayo Mungu hutoa.
- source_word: ἁμαρτίας
  choice: wa dhambi
  rationale: 'Muundo huu unahifadhi uhusiano wa karibu wa Kigiriki: mshahara unaohusishwa na dhambi au unaolipwa na dhambi, bila kuufafanua kupita kiasi.'
- source_word: θάνατος
  choice: mauti
  rationale: “Mauti” ni neno la kawaida katika sajili ya kibiblia ya Kiswahili na linahifadhi uzito wa maana ya kimwili na ya kiteolojia bila kubainisha aina ya kifo.
- source_word: χάρισμα
  choice: zawadi
  rationale: “Zawadi” ni wazi kwa wasomaji wa kawaida na hudumisha tofauti na “mshahara”; kipengele cha neema kimetajwa katika tanbihi.
- source_word: ζωὴ αἰώνιος
  choice: uzima wa milele
  rationale: Huu ni usemi wa kawaida, sahihi na wenye kueleweka unaowasilisha maisha yasiyo na mwisho pamoja na uzito wake wa kiteolojia.
- source_word: ἐν
  choice: katika
  rationale: “Katika” linahifadhi usemi wa Paulo kuhusu kuwa ndani ya Masihi bila kuubana kuwa njia au sababu tu.
- source_word: Χριστῷ
  choice: Masihi
  rationale: Hapa Χριστός lina nguvu ya cheo; “Masihi” linaonyesha wazi maana hiyo badala ya kulifanya jina lisiloelezwa.
- source_word: κυρίῳ
  choice: Bwana
  rationale: “Bwana” linahifadhi matumizi ya ungamo la Kikristo la awali na uzito wa kiteolojia wa κύριος.
theological_decisions:
- issue: Nguvu ya ἐν Χριστῷ Ἰησοῦ
  choice: katika Masihi Yesu
  alternative: kwa njia ya Masihi Yesu
  rationale: Kigiriki kinaelekea kuonyesha mazingira au umoja na Masihi, si utendaji wa chombo pekee. “Katika” linahifadhi upana na mvutano huo.
- issue: Maana ya θάνατος
  choice: mauti bila ufafanuzi zaidi
  alternative: mauti ya kiroho au mauti ya milele
  rationale: Aya yenyewe haisemi wazi aina ya mauti; kuongeza sifa kungetatua kimyakimya jambo ambalo maandishi yameliacha pana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Mauti” hutoa sajili ya kibiblia inayofahamika, huku sentensi nzima ikibaki rahisi kwa msomaji wa kawaida.
