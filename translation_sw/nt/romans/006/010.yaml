base_translation:
  language: en
  yaml_path: translation/nt/romans/006/010.yaml
  text: For the death he died[a], he died to sin once for all; but the life he lives, he lives to God.
translation:
  language: sw
  text: Kwa maana, kifo alichokufa[a], alikufa kwa dhambi mara moja tu; lakini uhai anaouishi, anauishi kwa Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “alipokufa,” au “kufa kwake.” Pia, “alikufa kwa ajili ya dhambi” au “alikufa kuhusiana na dhambi.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὃ
  choice: kifo alichokufa
  rationale: Kiwakilishi cha uhusiano cha jinsia isiyo na uhai kinatumiwa hapa kwa namna ya kiidioma kurejelea tukio la kufa; tafsiri hii inadumisha mkazo na ulinganifu wa Kigiriki kwa Kiswahili cha kawaida.
- source_word: γάρ
  choice: Kwa maana
  rationale: Kiunganishi hiki kinaanzisha maelezo ya kauli iliyotangulia; “Kwa maana” kinaonyesha uhusiano huo wazi.
- source_word: ἀπέθανεν
  choice: alikufa / aliifia
  rationale: Wakati aoristi unaeleza tendo lililokamilika; wakati uliopita wa Kiswahili unafaa katika muktadha huu.
- source_word: τῇ ἁμαρτίᾳ
  choice: aliifia dhambi
  rationale: Kauli “kuifia dhambi” inadumisha uhusiano unaoonyeshwa na dativu na inalingana na matumizi ya Paulo katika muktadha, bila kuamua kimyakimya kuwa maana pekee ni “kwa ajili ya dhambi.”
- source_word: ἐφάπαξ
  choice: mara moja kwa wakati wote
  rationale: Kirai hiki kinaonyesha tendo moja lisilorudiwa lenye matokeo ya kudumu.
- source_word: ὃ δὲ ζῇ
  choice: lakini uhai alio nao
  rationale: Tafsiri hii inadumisha ulinganifu wa kifasihi na sehemu ya kwanza huku ikiwa ya asili na inayoeleweka katika Kiswahili.
- source_word: δὲ
  choice: lakini
  rationale: Kiunganishi kinaonyesha tofauti kati ya kufa na kuishi.
- source_word: τῷ θεῷ
  choice: kwa Mungu
  rationale: Dativu inaonyesha mwelekeo au uhusiano wa maisha yake na Mungu, sambamba na “aliifia dhambi.”
theological_decisions:
- issue: Iwapo τῇ ἁμαρτίᾳ itafsiriwe kwa namna inayoweza kudokeza kuwa Kristo alikuwa na dhambi binafsi.
  choice: aliifia dhambi
  alternative: alikufa kwa ajili ya dhambi; alikufa kuhusiana na dhambi
  rationale: “Aliifia dhambi” inadumisha tofauti ya Paulo kati ya kufa kwa dhambi na kuishi kwa Mungu bila kudokeza dhambi binafsi ndani ya Kristo wala kufungia maana katika tafsiri moja ya dativu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo wa kifo/uhai na dhambi/Mungu umehifadhiwa kadiri inavyowezekana.
