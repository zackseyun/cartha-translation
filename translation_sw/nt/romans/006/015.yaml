base_translation:
  language: en
  yaml_path: translation/nt/romans/006/015.yaml
  text: What then? Should we sin because we are not under law but under grace? May it never be![a][b]
translation:
  language: sw
  text: Basi, je, tufanye dhambi kwa sababu hatuko chini ya sheria bali chini ya neema? La hasha![a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Je, tutende dhambi?”
    reason: lexical_alternative
  - marker: b
    text: Au, “Kamwe!”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί οὖν
  choice: Basi, tuseme nini?
  rationale: Ni mpito wa hoja ulio wa kawaida katika Kiswahili. Ingawa neno kwa neno ni ‘Basi, nini?’, usemi huu unaeleza swali la Paulo kwa uwazi bila kuongeza hitimisho la kitheolojia.
- source_word: ἁμαρτήσωμεν
  choice: Je, tutende dhambi
  rationale: Kauli tegemezi ya nafsi ya kwanza wingi ina matumizi ya kujadiliana hapa. ‘Je, tutende dhambi’ huwasilisha pendekezo la balagha kwa Kiswahili cha sasa; njia nyingine ni ‘Je, tuendelee kutenda dhambi?’ lakini ‘tuendelee’ haipo wazi katika kitenzi hiki.
- source_word: ὅτι
  choice: kwa sababu
  rationale: 'Huonyesha msingi unaodaiwa wa pendekezo hilo: kutenda dhambi kwa sababu waamini hawako chini ya sheria bali chini ya neema.'
- source_word: ὑπὸ νόμον
  choice: chini ya sheria
  rationale: Huhifadhi sitiari ya kuwa chini ya mamlaka ya sheria bila kuibainisha moja kwa moja kuwa Sheria ya Musa. Kiswahili kwa kawaida huhitaji ‘ya’ katika kirai hiki.
- source_word: ὑπὸ χάριν
  choice: chini ya neema
  rationale: ‘Neema’ ni tafsiri iliyozoeleka na sahihi ya χάρις katika muktadha huu, na huhifadhi ulinganisho wa Paulo kati ya sheria na neema.
- source_word: μὴ γένοιτο
  choice: La hasha!
  rationale: Ni usemi mfupi, wenye hadhi na msisitizo mkubwa wa kukataa kabisa, unaolingana na nguvu ya nahau ya Kigiriki.
theological_decisions:
- issue: Upeo wa νόμος katika ulinganisho wa Paulo
  choice: sheria
  alternative: Sheria ya Musa
  rationale: Kigiriki hakitaji kwa uwazi ‘Sheria ya Musa’. Tafsiri ‘sheria’ huhifadhi upana na mvutano wa usemi wa Paulo badala ya kuamua tafsiri yake ya kitheolojia ndani ya aya.
- issue: Nguvu ya swali ἁμαρτήσωμεν
  choice: Je, tutende dhambi
  alternative: Je, tuendelee kutenda dhambi
  rationale: Kitenzi ni cha wakati timilifu wa Kigiriki katika hali tegemezi ya kujadiliana, tofauti na usemi wa kuendelea kutenda dhambi katika 6:1. Kwa hiyo neno ‘tuendelee’ halijaingizwa katika matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘La hasha’ limetumiwa kama ukataaji mkali lakini unaoeleweka; ‘chini ya sheria’ na ‘chini ya neema’ huhifadhi sitiari na ulinganisho wa Kigiriki.
