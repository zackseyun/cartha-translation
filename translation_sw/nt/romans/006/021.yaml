reference: Romans 6:21
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: τίνα οὖν καρπὸν εἴχετε τότε ἐφ’ οἷς νῦν ἐπαισχύνεσθε; τὸ γὰρ τέλος ἐκείνων θάνατος·
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/021.yaml
  text: So what fruit did you have then from the things of which you are now ashamed? For the end of those things is death[a].
translation:
  language: sw
  text: Basi, wakati ule mlikuwa mkipata tunda gani kutokana na mambo ambayo sasa mnayaonea aibu? Kwa maana mwisho wa mambo hayo ni kifo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “matokeo” badala ya “mwisho.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τίνα
  choice: gani
  rationale: Katika swali la balagha, “gani” linauliza tunda au matokeo waliyokuwa nayo bila kufafanua jibu mapema.
- source_word: καρπὸν
  choice: tunda
  rationale: “Tunda” linahifadhi sitiari ya Paulo ya matokeo yanayozalishwa, badala ya kuibadili kuwa neno la moja kwa moja kama “faida” au “matokeo.”
- source_word: εἴχετε
  choice: mlipata
  rationale: Katika muktadha huu, “mlipata” ni Kiswahili cha kawaida kinachoeleza walichovuna kutokana na mwenendo wao wa zamani; kinaendana pia na sitiari ya tunda.
- source_word: τότε
  choice: wakati ule
  rationale: Linaonyesha wazi tofauti ya wakati kati ya hali yao ya zamani na “sasa.”
- source_word: ἐφ’ οἷς
  choice: kutokana na mambo ambayo
  rationale: 'Linaeleza uhusiano unaowezekana zaidi: tunda lilitokana na mambo au matendo yao ya zamani, huku likitaja kwa kawaida kiwakilishi kilichodokezwa.'
- source_word: νῦν
  choice: sasa
  rationale: Linadumisha tofauti ya moja kwa moja na “wakati ule.”
- source_word: ἐπαισχύνεσθε
  choice: mnayaonea aibu
  rationale: Ni usemi wa kawaida wenye uzito wa kimaadili unaofaa zaidi kuliko wazo dhaifu la kufedheheka tu.
- source_word: τέλος
  choice: mwisho
  rationale: “Mwisho” huhifadhi maana ya kikomo na pia huweza kumaanisha matokeo ya mwisho, bila kuamua kimafasiri upande mmoja tu.
- source_word: ἐκείνων
  choice: mambo hayo
  rationale: Linarejelea kwa uwazi mambo yaliyotajwa katika swali lililotangulia.
- source_word: θάνατος
  choice: kifo
  rationale: Ni tafsiri ya moja kwa moja, ya kawaida, na yenye uzito unaolingana na onyo la Paulo.
theological_decisions:
- issue: Iwapo τέλος itafsiriwe “mwisho” au kwa ufafanuzi zaidi “matokeo”
  choice: mwisho
  alternative: matokeo
  rationale: “Mwisho” huhifadhi kwa pamoja wazo la kikomo cha njia yao ya zamani na matokeo yake, hivyo haliondoi mvutano wa maana uliomo katika neno la Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa swali la balagha na sitiari ya “tunda” vimehifadhiwa; “wakati ule” na “sasa” zinatokeza tofauti ya nyakati kwa uwazi.
