  yaml_path: translation/nt/1_thessalonians/001/009.yaml
  text: For they themselves report about us what kind of reception we had among you[a], and how you turned to God from idols to serve the living and true God[c][b],
translation:
  language: sw
  text: Kwa maana wao wenyewe wanatoa taarifa kuhusu sisi, namna tulivyowajia,[a] na jinsi mlivyomgeukia Mungu huku mkiziacha sanamu, ili mumtumikie Mungu aliye hai na wa kweli.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “namna kuja kwetu kwenu kulivyokuwa.” Neno la Kigiriki kwa maana halisi ni “kuingia” au “kuja,” na hapa linaweza kujumuisha namna na matokeo ya kuwasili kwa Paulo na wenzake.
    reason: lexical_alternative
  - marker: b
    text: Kauli “Mungu aliye hai na wa kweli” inamtofautisha Mungu na sanamu zisizo na uhai; linganisha Yeremia 10:10.
    reason: cross_reference
lexical_decisions:
- source_word: αὐτοὶ
  choice: wao wenyewe
  rationale: 'Inahifadhi msisitizo wa kiwakilishi: watu hao wenyewe ndio wanaoeneza taarifa hiyo bila Paulo kuhitaji kuwaambia.'
- source_word: ἀπαγγέλλουσιν
  choice: wanaeleza habari
  rationale: Wakati uliopo unaonyesha tendo linaloendelea la kusimulia au kuripoti habari; usemi huu ni wa kawaida na wenye heshima katika Kiswahili.
- source_word: ὁποίαν εἴσοδον ἔσχομεν πρὸς ὑμᾶς
  choice: jinsi tulivyopokewa tulipokuja kwenu
  rationale: εἴσοδος kimsingi ni kuingia au kuja, lakini hapa inahusu namna kuwasili kwa wahubiri kulivyokuwa na jinsi walivyopokelewa. Tafsiri hii huwasilisha maana ya muktadha bila kuficha maana halisi, ambayo imewekwa katika tanbihi.
- source_word: πῶς ἐπεστρέψατε πρὸς τὸν θεὸν ἀπὸ τῶν εἰδώλων
  choice: jinsi mlivyomgeukia Mungu na kuziacha sanamu
  rationale: 'Inadumisha sitiari ya kugeuka na pande zake mbili: kuelekea kwa Mungu na kutoka kwa sanamu. Muundo wa Kiswahili unaweka wazi mwendo huo bila kutumia istilahi ya kimfumo ya kidini.'
- source_word: εἰδώλων
  choice: sanamu
  rationale: Ni neno la kawaida la Kiswahili kwa vitu au miungu inayoabudiwa kinyume na Mungu wa kweli.
- source_word: δουλεύειν
  choice: kumtumikia
  rationale: Katika muktadha wa uaminifu wa kidini, kitenzi kinaeleza huduma ya kujitoa. 'Kumtumikia' ni sahihi na ya asili kuliko kuingiza moja kwa moja lugha kali ya utumwa.
- source_word: θεῷ ζῶντι καὶ ἀληθινῷ
  choice: Mungu aliye hai na wa kweli
  rationale: Inahifadhi sifa zote mbili na utofauti kati ya Mungu aliye hai na halisi na sanamu zisizo na uhai.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Inaonyesha kuwa mstari huu unatoa msingi au maelezo ya kauli iliyotangulia.
theological_decisions:
- issue: Lugha ya uongofu katika ἐπεστρέψατε
  choice: mlivyomgeukia Mungu na kuziacha sanamu
  alternative: mlivyoongolewa kwa Mungu kutoka kwa sanamu
  rationale: Muundo tendaji wa Kigiriki na sitiari ya kugeuka vimehifadhiwa. Tafsiri haifanyi uamuzi wa ziada kuhusu namna tendo la Mungu na mwitikio wa binadamu vinavyohusiana katika uongofu.
- issue: Nguvu ya δουλεύειν inapomhusu Mungu
  choice: kumtumikia
  alternative: kuwa watumwa wa Mungu; kumwabudu
  rationale: '''Kumtumikia'' hudumisha wazo la utii na kujitoa bila kupunguza maana kuwa ibada pekee wala kulazimisha taswira ya utumwa katika matini kuu.'
- issue: Tofauti kati ya Mungu na sanamu katika ζῶντι καὶ ἀληθινῷ
  choice: Mungu aliye hai na wa kweli
  alternative: Mungu mwenye uhai na wa kweli
  rationale: Sifa hizi zinaonyesha utofauti wa kitheolojia na sanamu zisizo hai na zisizo Mungu wa kweli, bila kuongeza maelezo yasiyomo katika sentensi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo umeepuka tafsiri ya neno kwa neno isiyo ya kawaida, huku ukiweka tanbihi kwa maana halisi ya εἴσοδος. Alama zote za tanbihi zilizotolewa zinaonekana katika matini kuu.
