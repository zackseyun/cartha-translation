  text: καὶ ἀναμένειν τὸν υἱὸν αὐτοῦ ἐκ τῶν οὐρανῶν, ὃν ἤγειρεν ἐκ τῶν νεκρῶν, Ἰησοῦν τὸν ῥυόμενον ἡμᾶς ⸀ἐκ τῆς ὀργῆς τῆς ἐρχομένης.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/010.yaml
  text: and to wait for his Son from heaven[a], whom he raised from the dead—Jesus, who rescues us from the coming wrath.
translation:
  language: sw
  text: na kumngojea Mwana wake atokaye mbinguni, ambaye alimfufua kutoka kwa wafu—Yesu, anayetuokoa kutoka katika ghadhabu inayokuja.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ghadhabu itakayokuja.”
    reason: Njia nyingine ya asili ya kuwasilisha kishazi cha Kigiriki τῆς ἐρχομένης; “inayokuja” hudumisha zaidi umbo la wakati uliopo, huku “itakayokuja” ikifanya mwelekeo wa wakati ujao uwe wazi zaidi.
lexical_decisions:
- source_word: ἀναμένειν
  choice: kumngojea
  rationale: Kitenzi hiki kinaonyesha kusubiri kwa matarajio. “Kumngojea” ni Kiswahili cha kawaida na kinaendeleza kisarufi maelezo ya kugeuka kwao kwa Mungu katika mstari wa 9.
- source_word: τὸν υἱὸν αὐτοῦ
  choice: Mwana wake
  rationale: Tafsiri ya moja kwa moja inayohifadhi cheo cha uhusiano cha Kristo. Herufi kubwa katika “Mwana” inaonyesha matumizi yake kama cheo bila kuongeza ufafanuzi wa kimadhehebu.
- source_word: ἐκ τῶν οὐρανῶν
  choice: kutoka mbinguni
  rationale: Ingawa Kigiriki kina wingi, “mbinguni” ndiyo namna ya asili ya Kiswahili katika muktadha huu na inawasilisha maana bila usemi mgumu.
- source_word: ὃν ἤγειρεν ἐκ τῶν νεκρῶν
  choice: ambaye alimfufua kutoka kwa wafu
  rationale: Usemi huu unahifadhi tendo la Mungu la kumfufua Yesu na maana ya kutoka miongoni mwa waliokufa, kwa lugha inayoeleweka.
- source_word: Ἰησοῦν
  choice: Yesu
  rationale: Jina limetolewa kwa umbo lake la kawaida katika Kiswahili.
- source_word: τὸν ῥυόμενον
  choice: anayetuokoa
  rationale: Kauli ya wakati uliopo imetolewa kwa kishazi rejeshi cha wakati uliopo, ikimtambulisha Yesu kwa tendo lake la kuokoa bila kulifanya waziwazi kuwa tukio la wakati ujao pekee.
- source_word: ἐκ τῆς ὀργῆς
  choice: kutoka katika ghadhabu
  rationale: “Ghadhabu” huhifadhi uzito na upekee wa ὀργή kuliko neno pana zaidi “hukumu”; “kutoka katika” huonyesha kuondolewa au kuokolewa kutoka humo.
- source_word: τῆς ἐρχομένης
  choice: inayokuja
  rationale: Huhifadhi kauli endelevu ya Kigiriki kuhusu ghadhabu inayokaribia, bila kufafanua zaidi wakati au namna yake.
theological_decisions:
- issue: Maana mahususi ya “ghadhabu inayokuja”
  choice: Kudumisha “ghadhabu inayokuja” bila kuitambulisha moja kwa moja kuwa dhiki ya nyakati za mwisho, hukumu ya mwisho, au aina nyingine mahususi ya ghadhabu ya Mungu.
  alternative: “hukumu inayokuja,” au ufafanuzi unaoiweka katika mpangilio fulani wa matukio ya mwisho
  rationale: Mstari wenyewe hautoi ufafanuzi mwembamba wa ghadhabu hii. Tafsiri inadumisha uzito na mvutano wa usemi wa Kigiriki bila kuingiza mfumo maalumu wa kieskatolojia.
- issue: Nguvu ya kauli ya wakati uliopo katika ῥυόμενον
  choice: “anayetuokoa”
  alternative: “atakayetuokoa”
  rationale: Ingawa ghadhabu inaelezwa kuwa inakuja na hivyo muktadha una mwelekeo wa wakati ujao, umbo la Kigiriki linamtambulisha Yesu kama yule anayeokoa; halisemi moja kwa moja tu “atakayetuokoa.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi unahifadhi mfululizo wa hoja kutoka mstari uliotangulia, na vistari virefu vinamtaja Yesu kwa msisitizo kama ufafanuzi wa “Mwana wake.”
