  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὥστε γενέσθαι ὑμᾶς ⸀τύπον πᾶσιν τοῖς πιστεύουσιν ἐν τῇ Μακεδονίᾳ καὶ ⸀ἐν τῇ Ἀχαΐᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/007.yaml
  text: so that you became an example to all the believers in Macedonia and in Achaia[a].
translation:
  language: sw
  text: hivyo mkawa mfano kwa waamini wote katika Makedonia na Akaya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kielelezo” au “kiolezo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: hivyo
  rationale: Linaonyesha matokeo ya kupokea ujumbe na kufuata mfano uliotajwa katika mstari uliotangulia; “hivyo” ni la kawaida na linaunganisha sentensi kwa ufasaha.
- source_word: γενέσθαι
  choice: mkawa
  rationale: 'Kitenzi hiki katika muundo wa matokeo kinaelezwa kwa Kiswahili cha kawaida kama tendo lililotokea: “mkawa.”'
- source_word: ὑμᾶς
  choice: m- (katika “mkawa”)
  rationale: Kiambishi cha nafsi ya pili wingi katika kitenzi kinaonyesha “ninyi” kwa kawaida bila kulazimika kutumia kiwakilishi huru.
- source_word: τύπον
  choice: mfano
  rationale: Hapa neno linamaanisha kielelezo kinachoweza kufuatwa; “mfano” ni wazi na la kawaida katika Kiswahili, huku maana mbadala zikihifadhiwa katika tanbihi.
- source_word: πᾶσιν τοῖς πιστεύουσιν
  choice: kwa waamini wote
  rationale: Kirai nomino-kitenzi kinawataja watu wanaoamini; “waamini wote” ni kifupi, cha kawaida, na “kwa” linaonyesha watu ambao Wathesalonike walikuwa mfano kwao.
- source_word: ἐν τῇ Μακεδονίᾳ
  choice: katika Makedonia
  rationale: Kirai cha mahali kinataja eneo la Makedonia moja kwa moja.
- source_word: καὶ ἐν τῇ Ἀχαΐᾳ
  choice: na Akaya
  rationale: Linaunganisha eneo la pili. Katika Kiswahili, “katika” linaweza kutawala majina yote mawili bila kurudiwa, jambo linalofanya sentensi iwe ya kawaida huku uhusiano wa mahali ukibaki wazi.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye staha na inayoeleweka kwa urahisi. Muundo wa matokeo na wazo la kuwa kielelezo kwa waamini wengine vimehifadhiwa bila kuongeza tafsiri ya kimadhehebu.
