  source_fidelity: 'Tafsiri inawasilisha kwa uaminifu vipengele vya Kigiriki: εὐχαριστοῦμεν τῷ θεῷ (“tunamshukuru Mungu”), πάντοτε (“Daima”), περὶ πάντων ὑμῶν (“kwa ajili yenu nyote”), μνείαν ποιούμενοι (“tukiwataja”), ἐπὶ τῶν προσευχῶν ἡμῶν (“katika sala zetu”), na ἀδιαλείπτως (“bila kukoma”). Mpangilio wa ''Daima'' na ''bila kukoma'' unadumisha msisitizo wa matendo ya kudumu, na tanbihi inahifadhi utata halali wa upeo wa ἀδιαλείπτως.'
