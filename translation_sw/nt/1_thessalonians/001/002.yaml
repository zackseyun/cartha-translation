  text: Εὐχαριστοῦμεν τῷ θεῷ πάντοτε περὶ πάντων ὑμῶν ⸀μνείαν ποιούμενοι ἐπὶ τῶν προσευχῶν ἡμῶν, ἀδιαλείπτως
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/002.yaml
  text: We always give thanks to God for all of you[a], making mention of you in our prayers unceasingly,
translation:
  language: sw
  text: Daima tunamshukuru Mungu kwa ajili yenu nyote, tukiwataja katika sala zetu bila kukoma[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno “bila kukoma” linaweza kueleza hasa kuwataja katika sala, au tendo lote la kumshukuru Mungu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐχαριστοῦμεν
  choice: tunamshukuru
  rationale: Kitenzi cha wakati uliopo, nafsi ya kwanza wingi. “Tunamshukuru” ni usemi wa kawaida wa Kiswahili unaoonyesha wazi kwamba shukrani zinaelekezwa kwa Mungu.
- source_word: τῷ θεῷ
  choice: Mungu
  rationale: Yambwa inayopokea shukrani; muundo wa Kiswahili “tunamshukuru Mungu” huwasilisha maana hiyo kiasili bila kuhitaji kihusishi.
- source_word: πάντοτε
  choice: Daima
  rationale: Neno hili linaonyesha mwendelezo wa kutoa shukrani na ni la kawaida, lenye hadhi, na linaloeleweka katika Kiswahili cha kisasa.
- source_word: περὶ πάντων ὑμῶν
  choice: kwa ajili yenu nyote
  rationale: Huhifadhi wazo la kuwahusu waamini pamoja na msisitizo jumuishi wa πάντων, “nyote.”
- source_word: μνείαν ποιούμενοι
  choice: tukiwataja
  rationale: Huwasilisha nahau ya Kigiriki ya “kufanya kutajwa” kwa Kiswahili cha kawaida, huku kitu kinachotajwa—waamini—kikiwekwa wazi kutokana na muktadha.
- source_word: ἐπὶ τῶν προσευχῶν ἡμῶν
  choice: katika sala zetu
  rationale: Ni tafsiri ya kawaida na ya kiasili ya tendo linalofanyika wakati wa sala.
- source_word: ἀδιαλείπτως
  choice: bila kukoma
  rationale: Huhifadhi nguvu ya wazo la udumifu wa tendo. Mahali pake mwishoni pia hudumisha uwezekano wa kulihusisha ama na kuwataja katika sala ama na kutoa shukrani kwa ujumla.
