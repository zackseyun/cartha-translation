  text: καὶ ὑμεῖς μιμηταὶ ἡμῶν ἐγενήθητε καὶ τοῦ κυρίου, δεξάμενοι τὸν λόγον ἐν θλίψει πολλῇ μετὰ χαρᾶς πνεύματος ἁγίου,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/006.yaml
  text: And you became imitators of us and of the Lord[a], having received the word in much affliction with joy of the Holy Spirit,
translation:
  language: sw
  text: Nanyi mkawa waigaji wetu na wa Bwana, mkiwa mmelipokea neno katika dhiki kubwa, pamoja na furaha ya Roho Mtakatifu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “furaha itokayo kwa Roho Mtakatifu,” yaani, furaha inayotolewa na Roho Mtakatifu.
    reason: lexical_alternative
lexical_decisions:
- source_word: μιμηταὶ
  choice: waigaji
  rationale: Neno hili linaonyesha watu wanaofuata kielelezo kwa kuiga; “waigaji” huhifadhi wazi lugha ya Paulo kuhusu kuiga kuliko “wafuasi.”
- source_word: ἐγενήθητε
  choice: mkawa
  rationale: 'Huwakilisha mabadiliko ya hali: Wathesalonike walikuja kuwa waigaji.'
- source_word: τοῦ κυρίου
  choice: wa Bwana
  rationale: Huhifadhi cheo cha Kikristo “Bwana,” ambacho hapa kinamrejelea Yesu.
- source_word: δεξάμενοι
  choice: mlipolipokea
  rationale: Kishiriki cha wakati uliopita kinaeleza mazingira ya wao kuwa waigaji; muundo huu ni wa kawaida katika Kiswahili na hauongezi uhusiano wa sababu usioelezwa wazi.
- source_word: τὸν λόγον
  choice: neno
  rationale: Huhifadhi msamiati wa Paulo kuhusu ujumbe uliotangazwa, bila kuufafanua kupita kiasi kuwa “ujumbe wa Injili.”
- source_word: ἐν θλίψει πολλῇ
  choice: katika dhiki nyingi
  rationale: “Dhiki” huwasilisha mateso, shida na shinikizo kubwa bila kulazimisha maana maalumu ya kieskatolojia.
- source_word: μετὰ χαρᾶς
  choice: pamoja na furaha
  rationale: Ni tafsiri ya kawaida ya kirai hiki na inaonyesha kuwa kupokea neno katika dhiki kuliambatana na furaha.
- source_word: πνεύματος ἁγίου
  choice: ya Roho Mtakatifu
  rationale: Huhifadhi uhusiano wa kimilikishi usiofafanuliwa katika Kigiriki, huku tanbihi ikionyesha uwezekano kwamba Roho Mtakatifu ndiye chanzo cha furaha hiyo.
theological_decisions:
- issue: Uhusiano wa kimilikishi katika χαρᾶς πνεύματος ἁγίου
  choice: furaha ya Roho Mtakatifu
  alternative: furaha itokayo kwa Roho Mtakatifu / furaha inayotolewa na Roho Mtakatifu
  rationale: Muundo wa matini kuu huhifadhi utata halisi wa kimilikishi cha Kigiriki badala ya kuamua kimya kimya kuwa ni cha chanzo; tanbihi inaeleza maana inayowezekana sana katika muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo “mlipolipokea” umetumiwa badala ya kishiriki kizito kisicho cha kawaida katika Kiswahili.
