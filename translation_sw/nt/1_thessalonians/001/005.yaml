id: 1TH.1.5
reference: 1 Thessalonians 1:5
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὅτι τὸ εὐαγγέλιον ἡμῶν οὐκ ἐγενήθη εἰς ὑμᾶς ἐν λόγῳ μόνον ἀλλὰ καὶ ἐν δυνάμει καὶ ἐν πνεύματι ἁγίῳ ⸀καὶ πληροφορίᾳ πολλῇ, καθὼς οἴδατε οἷοι ἐγενήθημεν ⸀ἐν ὑμῖν δι’ ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/005.yaml
  text: because our gospel did not come to you in word only[a], but also in power and in the Holy Spirit and with great conviction[b], just as you know what kind of men we proved to be among you for your sake.
translation:
  language: sw
  text: kwa sababu injili yetu haikuwafikia kwa maneno tu, bali pia kwa nguvu, kwa Roho Mtakatifu, na kwa uhakika tele[a], kama mnavyojua tulivyokuwa[b] miongoni mwenu kwa ajili yenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa usadikisho mkubwa” au “kwa yakini kamili.”
    reason: lexical_alternative
  - marker: b
    text: Au “tulithibitika kuwa watu wa namna gani miongoni mwenu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐαγγέλιον
  choice: injili
  rationale: “Injili” ni istilahi ya kawaida na inayoeleweka katika Kiswahili kwa habari njema ya ujumbe wa kitume.
- source_word: ἐγενήθη εἰς ὑμᾶς
  choice: haikuwafikia
  rationale: Muundo huu unaeleza kufika kwa injili kwa Wathesalonike; “haikuwafikia” ni Kiswahili cha asili kinachohifadhi mwelekeo wa εἰς ὑμᾶς.
- source_word: ἐν λόγῳ μόνον
  choice: kwa maneno tu
  rationale: Hutofautisha utangazaji wa maneno pekee na nguvu na utendaji ulioambatana nao.
- source_word: ἐν δυνάμει
  choice: kwa nguvu
  rationale: Huhifadhi maana ya δύναμις na urudiaji wa muundo wa virai vinavyoanza kwa ἐν kwa njia ya kawaida katika Kiswahili.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: kwa Roho Mtakatifu
  rationale: Katika muktadha huu kifungu kinamrejelea Roho Mtakatifu, wala si hali ya kiroho au roho ya kibinadamu.
- source_word: πληροφορίᾳ πολλῇ
  choice: kwa uhakika mkubwa
  rationale: “Uhakika mkubwa” huwasilisha wingi au ukamilifu wa yakini bila kubainisha kimya kimya ikiwa uhakika huo ulikuwa wa wahubiri, wasikilizaji, au namna ujumbe ulivyofika.
- source_word: καθὼς οἴδατε
  choice: Kama mnavyojua
  rationale: Ni usemi wa asili unaohifadhi uthibitisho unaotegemea maarifa ya wasomaji wenyewe.
- source_word: οἷοι ἐγενήθημεν
  choice: tulithibitika kuwa watu wa namna gani
  rationale: Hueleza tabia au aina ya watu ambayo Paulo na wenzake walionekana kuwa katika mwenendo wao, badala ya mabadiliko ya hali pekee.
- source_word: ἐν ὑμῖν
  choice: miongoni mwenu
  rationale: Hueleza kuwapo na mwenendo wao katikati ya jumuiya ya Wathesalonike.
- source_word: δι’ ὑμᾶς
  choice: kwa ajili yenu
  rationale: Huwasilisha kwa kawaida maana ya manufaa au kusudi katika muktadha huu.
theological_decisions:
- issue: Kirejeleo cha πνεύματι ἁγίῳ
  choice: Roho Mtakatifu
  alternative: roho takatifu au nguvu ya kiroho
  rationale: Matumizi ya Paulo na tofauti kati ya maneno pekee na utendaji wenye nguvu yanaunga mkono kumrejelea Roho Mtakatifu.
- issue: Mhusika wa πληροφορίᾳ πολλῇ
  choice: kwa uhakika mkubwa
  alternative: kwa usadikisho mkubwa; kwa yakini kamili
  rationale: Kigiriki hakimtaji wazi mwenye uhakika huo; tafsiri hii inaacha uwezekano huo wazi badala ya kuuhusisha moja kwa moja na wahubiri au waamini.
- issue: Maana ya οἷοι ἐγενήθημεν
  choice: tulithibitika kuwa watu wa namna gani
  alternative: tulikuwa watu wa namna gani; tulivyojiendesha
  rationale: Chaguo hili huhifadhi wazo la sifa na mwenendo ulioonekana miongoni mwao bila kupunguza kifungu kuwa mwenendo pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi umegawanywa mara mbili kwa usomaji wazi, huku uhusiano wa hoja ukidumishwa. “Watu” halazimishi jinsia kisarufi, lakini katika muktadha humrejelea Paulo na waandamani wake.
