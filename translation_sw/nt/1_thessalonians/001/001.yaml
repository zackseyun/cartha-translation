base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/001.yaml
  text: 'Paul and Silvanus and Timothy[b][a], to the church of the Thessalonians in God the Father and the Lord Jesus the Messiah: grace to you and peace.'
translation:
  language: sw
  text: 'Paulo, Silwano na Timotheo, kwa kanisa[b] la Wathesalonike lililo katika Mungu Baba na Bwana Yesu Masihi[a]: Neema na amani ziwe kwenu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yesu Kristo.” Cheo cha Kigiriki Χριστός kimetafsiriwa hapa kuwa “Masihi” ili kuhifadhi maana yake; tafsiri nyingi hukinakili kuwa “Kristo.”
    reason: alternative_reading
  - marker: b
    text: Au, “kusanyiko.” Neno la Kigiriki ἐκκλησία hurejelea jumuiya ya watu waliokusanyika.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παῦλος
  choice: Paulo
  rationale: Umbo la kawaida la Kiswahili la jina Παῦλος.
- source_word: Σιλουανὸς
  choice: Silwano
  rationale: Hufuata moja kwa moja umbo la Kigiriki Σιλουανός badala ya kutumia jina linalohusiana nalo, Sila, ambalo huwakilisha umbo tofauti la Kigiriki.
- source_word: Τιμόθεος
  choice: Timotheo
  rationale: Umbo la kawaida la Kiswahili la jina Τιμόθεος.
- source_word: ἐκκλησίᾳ
  choice: kanisa
  rationale: Katika muktadha huu wa barua, “kanisa” ni neno la kawaida na linaloeleweka kwa jumuiya iliyokusanyika; “kusanyiko” pia linawezekana lakini si la kawaida sana hapa.
- source_word: Θεσσαλονικέων
  choice: Wathesalonike
  rationale: Hurejelea watu wa Thesalonike, si mahali pekee; “kanisa la Wathesalonike” ni usemi mfupi na wa kawaida.
- source_word: ἐν
  choice: katika
  rationale: Hudumisha lugha ya Paulo kuhusu uhusiano au mazingira ya kuwepo kwa kanisa bila kuifafanua kupita kiasi kuwa “linalomilikiwa na” au “linalokusanyika ndani ya.”
- source_word: θεῷ πατρὶ
  choice: Mungu Baba
  rationale: Kigiriki hakina kiwakilishi “wetu”; “Mungu Baba” huhifadhi muundo wa ufafanuzi bila kuongeza umilikaji.
- source_word: κυρίῳ
  choice: Bwana
  rationale: “Bwana” ndilo neno la kawaida na lenye hadhi kwa κύριος katika matumizi ya Agano Jipya.
- source_word: Ἰησοῦ Χριστῷ
  choice: Yesu Masihi
  rationale: “Masihi” hutafsiri maana ya cheo Χριστός badala ya kukinakili tu kama “Kristo”; hapa cheo hicho bado kinaonekana wazi pamoja na “Bwana.”
- source_word: χάρις
  choice: neema
  rationale: Neno la kawaida kwa χάρις katika salamu za Paulo, likihifadhi maana yake ya kitheolojia na ya kibarua.
- source_word: εἰρήνη
  choice: amani
  rationale: Tafsiri ya kawaida ya εἰρήνη, ikihifadhi mwangwi wa salamu za Kigiriki na Kiyahudi.
- source_word: χάρις ὑμῖν καὶ εἰρήνη
  choice: Neema na amani iwe kwenu
  rationale: Ni salamu ya asili na yenye hadhi katika Kiswahili; inaeleza wazi kwamba neema na amani zinawaelekea wapokeaji, ingawa mpangilio wa maneno umebadilishwa kidogo kwa ufasaha.
theological_decisions:
- issue: Tafsiri ya Χριστός katika salamu
  choice: Masihi
  alternative: Kristo
  rationale: “Masihi” huhifadhi maana ya cheo cha Χριστός. “Kristo” ni umbo lililozoeleka sana, lakini ni unukuzi wa jina kuliko tafsiri ya maana ya cheo hicho.
- issue: Uhusiano unaoelezwa na ἐν θεῷ πατρὶ καὶ κυρίῳ Ἰησοῦ Χριστῷ
  choice: kanisa lililo “katika” Mungu Baba na Bwana Yesu Masihi
  alternative: kanisa linalomilikiwa na Mungu Baba na Bwana Yesu Masihi
  rationale: “Katika” huhifadhi upana na mvutano wa kitheolojia wa ἐν bila kuamua kwamba maana yake ni umilikaji, mahali pa kusanyiko, au muungano pekee. Pia hudumisha uhusiano sambamba na Baba na Bwana Yesu.
translation_notes:
  register: 'Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo “lililo katika” umeongezwa kwa ulazima wa kisarufi wa Kiswahili ili kuunganisha kanisa na kishazi cha ἐν, bila kuongeza maana mpya. Majina yametolewa kwa maumbo yaliyozoeleka katika Kiswahili: Paulo, Silwano na Timotheo.'
