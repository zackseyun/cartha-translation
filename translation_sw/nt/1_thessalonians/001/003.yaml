  to: tukikumbuka kazi yenu ya imani[a], kazi yenu ngumu ya upendo, na uvumilivu wenu wa tumaini katika Bwana wetu Yesu Masihi[b] mbele za Mungu wetu, ambaye ni Baba yetu,
  rationale: The revision makes the final appositional phrase explicit and idiomatic in Swahili without treating God and Father as separate referents. It also corrects the footnote’s description of the Greek term and lightly regularizes the lexical alternative for πίστις. The verse’s syntactic continuation and its source-level ambiguities remain intact.
