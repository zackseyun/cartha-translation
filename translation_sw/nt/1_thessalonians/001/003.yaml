id: 1TH.1.3
reference: 1 Thessalonians 1:3
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: μνημονεύοντες ὑμῶν τοῦ ἔργου τῆς πίστεως καὶ τοῦ κόπου τῆς ἀγάπης καὶ τῆς ὑπομονῆς τῆς ἐλπίδος τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ ἔμπροσθεν τοῦ θεοῦ καὶ πατρὸς ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/003.yaml
  text: remembering your work of faith and labor of love and steadfastness of hope in our Lord Jesus the Messiah before our God and Father[b][a],
translation:
  language: sw
  text: tukikumbuka kazi yenu ya imani[a], kazi yenu ngumu ya upendo, na uvumilivu wenu wa tumaini katika Bwana wetu Yesu Masihi[b] mbele za Mungu wetu, ambaye ni Baba yetu,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “uaminifu” au “kutumaini” badala ya “imani.”
    reason: lexical_alternative
  - marker: b
    text: Neno la Kiyunani Χριστός; hapa limetafsiriwa “Masihi” kwa sababu linatumika kama cheo.
    reason: alternative_reading
lexical_decisions:
- source_word: μνημονεύοντες
  choice: tukikumbuka
  rationale: Kitenzi-shirikishi cha wakati uliopo kinaendeleza wazo la mstari uliotangulia; “tukikumbuka” ni cha kawaida na hudumisha tendo linaloendelea.
- source_word: ἔργου
  choice: kazi
  rationale: “Kazi” ni tafsiri ya moja kwa moja na huhifadhi mpangilio wa balagha wa kazi, kazi ngumu, na uvumilivu.
- source_word: πίστεως
  choice: imani
  rationale: “Imani” ndiyo maana inayofaa zaidi hapa, huku uwezekano wa “uaminifu” au “kumtumaini” ukihifadhiwa katika tanbihi.
- source_word: κόπου
  choice: kazi ngumu
  rationale: κόπος hudokeza kazi yenye kuchosha na juhudi kubwa; “kazi ngumu” hutoa uzito huo kwa Kiswahili cha kawaida.
- source_word: ἀγάπης
  choice: upendo
  rationale: “Upendo” ni tafsiri ya kawaida na ya wazi ya ἀγάπη.
- source_word: ὑπομονῆς
  choice: uvumilivu
  rationale: Neno hili humaanisha kudumu kwa subira chini ya shinikizo; “uvumilivu” ni la kawaida na linaeleweka vizuri.
- source_word: ἐλπίδος
  choice: tumaini
  rationale: “Tumaini” hutoa maana ya matarajio yenye uhakika katika matumizi ya Paulo.
- source_word: τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: katika Bwana wetu Yesu Masihi
  rationale: Kirai hiki kinaeleweka zaidi kuwa kitu au eneo la tumaini. “Masihi” huhifadhi Χριστός kama cheo, si jina tu.
- source_word: ἔμπροσθεν
  choice: mbele za
  rationale: “Mbele za” hueleza kwa ufupi hali ya kuwa katika uwepo wa Mungu.
- source_word: τοῦ θεοῦ καὶ πατρὸς ἡμῶν
  choice: Mungu aliye Baba yetu
  rationale: Muundo huu unaonyesha kwamba Mungu ndiye Baba yetu na huepuka Kiswahili kisicho cha kawaida cha “Mungu na Baba yetu.”
theological_decisions:
- issue: Maana ya Χριστοῦ
  choice: Masihi
  alternative: Kristo
  rationale: Χριστός linafanya kazi kama cheo hapa; “Masihi” huwasilisha maana hiyo, huku “Kristo” likitajwa kama namna iliyozoeleka.
- issue: Maana ya πίστεως katika τῆς πίστεως
  choice: imani
  alternative: uaminifu au kumtumaini
  rationale: Katika muktadha huu, “imani” ndiyo chaguo linalowezekana zaidi, lakini neno la Kiyunani linaweza pia kuwa na wazo la uaminifu au kutumaini; tanbihi hudumisha uwezekano huo.
- issue: Uhusiano wa viambishi katika “kazi ya imani,” “kazi ngumu ya upendo,” na “uvumilivu wa tumaini”
  choice: miundo ya moja kwa moja yenye “ya/wa”
  alternative: kazi inayotokana na imani, kazi ngumu inayosukumwa na upendo, na uvumilivu unaotokana na tumaini
  rationale: Kiyunani hakisemi wazi kama imani, upendo, na tumaini ndivyo vyanzo, sifa, au misingi ya mambo hayo. Miundo ya moja kwa moja hudumisha utata huo badala ya kuufafanua kimya kimya.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa vipashio vitatu vya Paulo umehifadhiwa, pamoja na hali ya sentensi inayoendelea kutoka mstari uliotangulia.
