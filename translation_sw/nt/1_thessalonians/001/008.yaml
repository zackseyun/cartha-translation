  to: Kwa maana neno la Bwana limevuma kutoka kwenu, si katika Makedonia na Akaya tu, bali imani yenu kwa Mungu imeenea kila mahali, hivyo hatuna haja ya kusema chochote.
  rationale: The revision removes an added intensifier while preserving the auditory metaphor of ἐξήχηται, and it clarifies the result expressed by ὥστε. It retains the draft’s accurate and natural renderings of the locations, faith terminology, and the movement image of ἐξελήλυθεν.
