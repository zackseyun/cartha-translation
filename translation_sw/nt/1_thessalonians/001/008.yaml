id: 1TH.1.8
reference: 1 Thessalonians 1:8
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀφ’ ὑμῶν γὰρ ἐξήχηται ὁ λόγος τοῦ κυρίου οὐ μόνον ἐν τῇ Μακεδονίᾳ ⸀καὶ Ἀχαΐᾳ, ⸀ἀλλ’ ἐν παντὶ τόπῳ ἡ πίστις ὑμῶν ἡ πρὸς τὸν θεὸν ἐξελήλυθεν, ὥστε μὴ χρείαν ⸂ἔχειν ἡμᾶς⸃ λαλεῖν τι·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/008.yaml
  text: For from you the word of the Lord has sounded forth[a], not only in Macedonia and Achaia, but in every place your faith toward God has gone out, so that we have no need to say anything.
translation:
  language: sw
  text: Kwa maana neno la Bwana limevuma kutoka kwenu, si katika Makedonia na Akaya tu, bali imani yenu kwa Mungu imeenea kila mahali, hivyo hatuna haja ya kusema chochote.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξήχηται
  choice: limesikika kwa nguvu
  rationale: Kitenzi hiki kina picha ya sauti inayovuma au kusikika kutoka mahali fulani. Tafsiri hii inadumisha picha hiyo na matokeo yanayoendelea ya wakati timilifu, bila kutumia usemi usio wa kawaida.
- source_word: ὁ λόγος τοῦ κυρίου
  choice: neno la Bwana
  rationale: Huu ni usemi wa kawaida na wenye hadhi katika Kiswahili cha Biblia, nao unadumisha uwazi wa muundo wa Kigiriki kuhusu neno linalotoka kwa Bwana au linalomhusu Bwana.
- source_word: Μακεδονίᾳ καὶ Ἀχαΐᾳ
  choice: Makedonia na Akaya
  rationale: Majina ya maeneo yametoholewa kwa namna iliyozoeleka katika Kiswahili.
- source_word: ἀλλ’ ἐν παντὶ τόπῳ
  choice: bali ... kila mahali
  rationale: ‘Kila mahali’ ni Kiswahili cha kawaida kinachowasilisha kwa usahihi maana distributivu ya παντὶ τόπῳ.
- source_word: ἡ πίστις ὑμῶν ἡ πρὸς τὸν θεόν
  choice: imani yenu kwa Mungu
  rationale: ‘Imani ... kwa Mungu’ inadumisha mwelekeo unaoonyeshwa na πρὸς na ni usemi wa asili katika Kiswahili; hapa maana ni mwitikio wao wa kumwamini Mungu.
- source_word: ἐξελήλυθεν
  choice: imeenea
  rationale: Ingawa kitenzi cha Kigiriki kihalisi kina wazo la ‘kwenda nje,’ katika muktadha huu Kiswahili ‘imeenea’ huonyesha kwa uwazi kwamba habari ya imani yao imefika sehemu nyingi.
- source_word: ὥστε μὴ χρείαν ἔχειν ἡμᾶς
  choice: hata hatuna haja
  rationale: Huu ni usemi wa asili unaowasilisha matokeo yanayotambulishwa na ὥστε pamoja na kutokuwapo kwa uhitaji.
- source_word: λαλεῖν τι
  choice: kusema chochote
  rationale: Ni tafsiri ya kawaida na sahihi ya Kiswahili; ‘kunena kitu’ ingekuwa ngumu bila kuongeza maana.
theological_decisions:
- issue: Maana ya πίστις
  choice: imani
  alternative: uaminifu; tumaini
  rationale: Katika muktadha huu neno hilo linaelekea kumaanisha mwitikio wa Wathesalonike wa kumwamini Mungu, si hasa sifa yao ya kuwa waaminifu. ‘Imani’ pia inadumisha istilahi pana ya Paulo bila kuingiza tafsiri ya kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo umefanywa wa asili kwa Kiswahili huku picha ya sauti katika ἐξήχηται, majina ya maeneo, na mtiririko wa hoja vikidumishwa.
