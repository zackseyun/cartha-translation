lexical_decisions:
- source_word: ἀποκτεινάντων
  choice: walimwua
  rationale: Kitenzi hiki humaanisha kuua au kusababisha mtu auawe. “Walimwua” ni Kiswahili cha kawaida na hakiongezi wazo la nia ya mauaji ambalo halijaelezwa wazi katika neno la Kigiriki.
- source_word: κύριον
  choice: Bwana
  rationale: “Bwana” ni tafsiri ya kawaida ya κύριος na hapa ni cheo cha Kikristo kinachomhusu Yesu.
- source_word: Ἰησοῦν
  choice: Yesu
  rationale: Jina limetolewa kwa umbo lake la kawaida katika Kiswahili.
- source_word: προφήτας
  choice: manabii
  rationale: Ni tafsiri ya kawaida ya προφήτας na katika muktadha huu inarejelea safu inayotambulika ya manabii wa Mungu.
- source_word: ἐκδιωξάντων
  choice: wakatufukuza
  rationale: Kitenzi hiki kina maana mahususi ya kuwafukuza watu au kuwaondoa mahali, si tu kuwatesa kwa maana pana.
- source_word: θεῷ μὴ ἀρεσκόντων
  choice: Hawampendezi Mungu
  rationale: Kauli hii inaonyesha hali inayoendelea ya kutompendeza Mungu na ni ya kawaida, wazi na yenye nguvu katika Kiswahili.
- source_word: πᾶσιν ἀνθρώποις ἐναντίων
  choice: ni wenye uadui kwa watu wote
  rationale: Usemi huu huhifadhi maana ya upinzani au uhasama bila kuubadili kuwa dai jingine lisilomo katika maandishi.
- source_word: τῶν ... ἀποκτεινάντων ... ἐκδιωξάντων ... ἀρεσκόντων ... ἐναντίων
  choice: ambao ... walimwua ... wakatufukuza. Hawampendezi ... ni wenye uadui ...
  rationale: “Ambao” linaendeleza kisarufi kundi lililotajwa katika mstari uliotangulia. Sentensi imegawanywa baada ya “wakatufukuza” ili mfululizo huo mrefu uwe wa kawaida na rahisi kueleweka katika Kiswahili bila kubadili wahusika.
- source_word: καὶ
  choice: pia / na / nao
  rationale: “Pia” linaonyesha nyongeza katika shtaka la kwanza, huku “na” na “nao” yakidumisha mfululizo wa hoja kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Kundi linaloelezwa na mfululizo wa vishirikishi
  choice: “Ambao” linaendeleza maelezo ya kundi lililotajwa katika 2:14, bila kuyafanya kuwa hukumu ya Wayahudi wote wa kila wakati na kila mahali.
  alternative: Kuchukulia mstari huu kuwa hukumu ya jumla dhidi ya Wayahudi wote katika nyakati zote.
  rationale: Muundo wa Kigiriki unaunganisha moja kwa moja maelezo haya na rejeleo la mstari uliotangulia. Tafsiri inahifadhi muunganiko huo bila kuongeza maneno yanayopanua dai kuliko rejeleo lake la kifasihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. “Wakatufukuza” linaendeleza simulizi, na sentensi fupi inayofuata hulinda uwazi wa mfululizo wa mashtaka.
