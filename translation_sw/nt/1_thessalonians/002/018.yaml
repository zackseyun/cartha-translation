  text: ⸀διότι ἠθελήσαμεν ἐλθεῖν πρὸς ὑμᾶς, ἐγὼ μὲν Παῦλος καὶ ἅπαξ καὶ δίς, καὶ ἐνέκοψεν ἡμᾶς ὁ Σατανᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/018.yaml
  text: Because we wanted to come to you—I[a], Paul, again and again—but Satan hindered us.
translation:
  language: sw
  text: Kwa maana tulitaka kuja kwenu—mimi, Paulo, nilitaka kuja zaidi ya mara moja[a]—lakini Shetani alituzuia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “mara moja na mara mbili,” usemi unaomaanisha “zaidi ya mara moja.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διότι
  choice: Kwa maana
  rationale: Inaonyesha sababu au ufafanuzi wa kauli iliyotangulia kwa njia ya kawaida na yenye heshima katika Kiswahili.
- source_word: ἠθελήσαμεν
  choice: tulitaka
  rationale: Inawasilisha kwa uwazi nia au hamu iliyomo katika θέλω, huku ikidumisha wingi wa kitenzi.
- source_word: ἐλθεῖν πρὸς ὑμᾶς
  choice: kuja kwenu
  rationale: Inahifadhi mwendo kuelekea kwa Wathesalonike bila kuongeza wazi maana ya ‘kuwatembelea’ au ‘kurudi.’
- source_word: ἐγὼ μὲν Παῦλος
  choice: mimi, Paulo
  rationale: Inamtenga Paulo na ‘sisi’ ya sentensi kwa msisitizo wa kawaida wa Kiswahili, bila kulazimisha kiunganishi kisicho na mwenzi wa wazi.
- source_word: καὶ ἅπαξ καὶ δίς
  choice: zaidi ya mara moja
  rationale: Ni usemi wenye maana halisi ya ‘mara moja na mara mbili’; tafsiri hii inaeleza kwa kawaida kwamba Paulo alijaribu zaidi ya mara moja bila kudai idadi isiyowekwa na matini.
- source_word: ἐνέκοψεν
  choice: alituzuia
  rationale: Inaonyesha kuingiliwa au kuzuiwa kwa safari; haiongezi maelezo kuhusu namna ambavyo kizuizi hicho kilitokea.
- source_word: ὁ Σατανᾶς
  choice: Shetani
  rationale: Ni jina la kawaida la Kiswahili linalotambulika kwa rejeleo hili la kibinafsi.
theological_decisions:
- issue: Utendaji wa Shetani katika kuzuia safari ya Paulo
  choice: lakini Shetani alituzuia
  alternative: lakini Mpinzani alituzuia
  rationale: Matini inamtaja Shetani moja kwa moja kuwa mtendaji. Tafsiri inadumisha utendaji huo wa kibinafsi bila kuugeuza kuwa hali isiyo na mhusika wala kueleza jinsi ulivyohusiana na mamlaka ya Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Mistari mirefu inatenga msisitizo wa ‘mimi, Paulo,’ na alama [a] imewekwa baada ya usemi unaofafanuliwa.
