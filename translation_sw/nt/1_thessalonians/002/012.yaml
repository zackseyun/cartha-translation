base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/012.yaml
  text: encouraging[a], comforting, and urging you to walk worthily of God[c][b], who calls you into his own kingdom and glory.
translation:
  language: sw
  text: tukiwa tunawahimiza, tunawafariji, na tunawasihi sana muishi kwa namna inayomstahili Mungu,[a] ambaye anawaita kuingia katika ufalme na utukufu wake mwenyewe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtembee kwa namna inayomstahili Mungu.” “Kutembea” ni sitiari ya kibiblia inayomaanisha namna ya kuishi au mwenendo wa mtu.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακαλοῦντες
  choice: tukiwa tunawahimiza
  rationale: Kitenzi hiki kinaonyesha tendo endelevu la kuhimiza au kutia moyo. “Kuwahimiza” ni cha kawaida na kinafaa katika muktadha wa malezi ya kiroho.
- source_word: παραμυθούμενοι
  choice: tunawafariji
  rationale: Neno hili hueleza kusema kwa upole ili kufariji au kutia moyo; “tunawafariji” linadumisha tofauti yake na παρακαλοῦντες.
- source_word: μαρτυρόμενοι
  choice: kuwasihi sana
  rationale: Katika muktadha huu lina maana ya kusisitiza au kutoa wito mzito. “Kuwasihi sana” linaonyesha uzito huo bila kuleta maana isiyo wazi ya kutoa ushahidi.
- source_word: εἰς τὸ περιπατεῖν ὑμᾶς
  choice: muishi
  rationale: Ingawa kwa neno ni “mtembee,” hapa kutembea ni sitiari ya mwenendo wa maisha. Kiswahili cha kawaida hutumia “kuishi” kwa uwazi na uasilia zaidi.
- source_word: ἀξίως τοῦ θεοῦ
  choice: kwa namna inayomstahili Mungu
  rationale: Hii ni tafsiri ya asili ya Kiswahili ya wazo la kuishi kwa ustahili unaolingana na Mungu, bila kudokeza kwamba wanadamu wanajipatia kustahili mbele zake.
- source_word: τοῦ καλοῦντος ὑμᾶς
  choice: ambaye anawaita
  rationale: Kauli ya wakati wa sasa inadumishwa ili kuonyesha wito wa Mungu bila kuamua kimafundisho wakati au namna yake.
- source_word: εἰς τὴν ἑαυτοῦ βασιλείαν καὶ δόξαν
  choice: kuingia katika ufalme na utukufu wake mwenyewe
  rationale: “Kuingia katika” huwasilisha εἰς kwa kawaida, na “wake mwenyewe” huhifadhi msisitizo wa ἑαυτοῦ. Ufalme na utukufu vinaachwa vikiwa sambamba kama katika Kigiriki.
theological_decisions:
- issue: Iwapo kuhifadhi sitiari ya περιπατεῖν au kueleza maana yake kama mwenendo wa maisha
  choice: muishi
  alternative: mtembee
  rationale: Katika Kiswahili cha sasa, “mtembee kwa namna inayomstahili Mungu” kinaweza kueleweka kwanza kama kutembea kimwili. “Muishi” huwasilisha wazi maana ya kimaadili ya sitiari bila kuongeza fundisho.
- issue: Nguvu na wakati wa wito wa Mungu katika τοῦ καλοῦντος ὑμᾶς
  choice: ambaye anawaita
  alternative: ambaye aliwaita
  rationale: Wakati wa sasa wa kishiriki cha Kigiriki umehifadhiwa; tafsiri haifungamani na msimamo fulani kuhusu taratibu za wito wa Mungu.
- issue: Uhusiano wa βασιλείαν na δόξαν
  choice: ufalme na utukufu wake mwenyewe
  alternative: ufalme wake mwenyewe na utukufu wake
  rationale: Nomino zote mbili zimeachwa chini ya umilikaji mmoja kama katika chanzo, bila kuzichanganya wala kufafanua namna ya kushiriki katika kila moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Msururu wa vitenzi vitatu umehifadhiwa kwa mtiririko wa kawaida; “sana” huonyesha uzito wa μαρτυρόμενοι. Alama ya tanbihi [a] imewekwa baada ya kishazi kinachoifafanua.
