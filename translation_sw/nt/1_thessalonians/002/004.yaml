  to: Lakini, kama vile tumekubaliwa na Mungu kukabidhiwa Injili, ndivyo tunavyosema—si kama wenye kuwapendeza wanadamu, bali Mungu[a], ambaye huipima mioyo yetu.
  rationale: Revised only the opening perfect passive to focus on God’s approval, the contextual force of δεδοκιμάσμεθα, rather than explicitly unpacking the evaluative process. The entrustment construction, compressed contrast, ongoing testing, and existing footnote are retained.
