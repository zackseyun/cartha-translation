id: 1TH.2.4
reference: 1 Thessalonians 2:4
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀλλὰ καθὼς δεδοκιμάσμεθα ὑπὸ τοῦ θεοῦ πιστευθῆναι τὸ εὐαγγέλιον οὕτως λαλοῦμεν, οὐχ ὡς ἀνθρώποις ἀρέσκοντες ἀλλὰ ⸀θεῷ τῷ δοκιμάζοντι τὰς καρδίας ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/004.yaml
  text: But just as we have been approved by God to be entrusted with the gospel[a], so we speak—not as pleasing people, but God, who tests our hearts.
translation:
  language: sw
  text: Lakini, kama vile tumekubaliwa na Mungu kukabidhiwa Injili, ndivyo tunavyosema—si kama wenye kuwapendeza wanadamu, bali Mungu[a], ambaye huipima mioyo yetu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa lugha ya kawaida zaidi, “si ili kuwapendeza wanadamu, bali ili kumpendeza Mungu.” Kigiriki kinataja wazi “kupendeza” katika sehemu ya kwanza tu ya utofautishaji huo.
    reason: lexical_alternative
lexical_decisions:
- source_word: δεδοκιμάσμεθα
  choice: tulivyopimwa na kukubaliwa
  rationale: Kitenzi hiki kinajumuisha kupimwa na matokeo ya kukubaliwa. Kauli timilifu ya Kigiriki inaonyesha tathmini iliyofanyika na matokeo yake yanayoendelea.
- source_word: πιστευθῆναι
  choice: ili tukabidhiwe
  rationale: Kauli tendwa hapa ina maana ya kupewa injili kama amana, si kuiamini. Muundo huu wa Kiswahili ni wa kawaida na unaweka wazi wajibu waliokabidhiwa.
- source_word: τὸ εὐαγγέλιον
  choice: injili
  rationale: “Injili” ni neno lililozoeleka katika Kiswahili cha Biblia na linahifadhi uzito wa matumizi ya Paulo; “habari njema” pia ingewezekana.
- source_word: οὕτως λαλοῦμεν
  choice: ndivyo tunavyosema
  rationale: Muundo wa “kama vile ... ndivyo” unahifadhi uhusiano wa moja kwa moja kati ya kukubaliwa na Mungu na jinsi wanavyosema.
- source_word: οὐχ ὡς ἀνθρώποις ἀρέσκοντες
  choice: si kama wenye kuwapendeza wanadamu
  rationale: Hii inafuata muundo wa kirai cha Kigiriki na kuhifadhi tofauti kati ya kutafuta kibali cha wanadamu na cha Mungu.
- source_word: ἀλλὰ θεῷ
  choice: bali Mungu
  rationale: Kigiriki hakirudii wazi kirai cha “kupendeza” katika nusu ya pili. Tafsiri hii inahifadhi ufupi huo, huku maana iliyo wazi zaidi ikitolewa katika tanbihi.
- source_word: τῷ δοκιμάζοντι
  choice: ambaye huipima
  rationale: “Huipima” inaonyesha uchunguzi wa Mungu unaoendelea na inadumisha uhusiano wa kimsamiati na δεδοκιμάσμεθα mapema katika mstari.
- source_word: τὰς καρδίας ἡμῶν
  choice: mioyo yetu
  rationale: “Mioyo” linahifadhi taswira ya kibiblia ya utu wa ndani bila kuipunguza kuwa akili au hisia pekee.
theological_decisions:
- issue: Tofauti iliyofupishwa kati ya kuwapendeza wanadamu na kumpendeza Mungu
  choice: si kama wenye kuwapendeza wanadamu, bali Mungu
  alternative: si ili kuwapendeza wanadamu, bali ili kumpendeza Mungu
  rationale: Kigiriki kinataja wazi tendo la kupendeza katika sehemu ya kwanza tu na kuliacha lieleweke katika sehemu ya pili. Matini kuu inahifadhi mkazo na ufupi huo bila kuficha maana; tanbihi inatoa usemi wa kawaida zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo “kama vile ... ndivyo” unahifadhi mantiki ya sentensi, na “tulivyopimwa na kukubaliwa” hufafanua kwa ufupi maana mbili zinazokusanywa na kitenzi kimoja cha Kigiriki.
