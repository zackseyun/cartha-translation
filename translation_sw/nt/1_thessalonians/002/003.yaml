translation:
  language: sw
  text: Kwa maana himizo letu halitokani na kosa wala uchafu wa kimaadili, wala halifanywi kwa hila.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wito wetu,” “mawaidha yetu,” au “kutia moyo kwetu.” Neno la Kigiriki παράκλησις linaweza kumaanisha wito, himizo, mawaidha, au kutia moyo, kutegemea muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: παράκλησις
  choice: wito
  rationale: Katika muktadha huu neno hilo linamaanisha mwito wa dhati unaowahimiza wasikilizaji; “wito” ni la kawaida na lenye upana unaofaa, bila kulifanya kuwa faraja tu.
- source_word: πλάνης
  choice: upotovu
  rationale: Hapa ἐκ inaonyesha chanzo. “Upotovu” linaweza kumaanisha kosa au udanganyifu unaopotosha, huku likitofautishwa na δόλος, ambayo inaonyesha hila ya makusudi kwa wazi zaidi.
- source_word: ἀκαθαρσίας
  choice: uchafu
  rationale: “Uchafu” huhifadhi maana pana ya kasoro ya kimaadili bila kuibana iwe uasherati pekee, jambo ambalo mstari wenyewe haulibainishi.
- source_word: δόλῳ
  choice: hila
  rationale: “Kwa hila” linaeleza namna ya kutenda na linadokeza ujanja au udanganyifu wa makusudi.
- source_word: ἐκ ... ἐξ ... ἐν
  choice: hautokani na ... wala ... wala hautolewi kwa ...
  rationale: Muundo huu unatofautisha chanzo kinachoonyeshwa na ἐκ/ἐξ na namna inayoonyeshwa na ἐν, huku ukibaki wa asili katika Kiswahili.
- source_word: γὰρ
  choice: Kwa maana
  rationale: “Kwa maana” huunganisha mstari huu na maelezo yaliyotangulia na kuonyesha kuwa sababu au ufafanuzi unafuata.
theological_decisions:
- issue: Upeo wa ἀκαθαρσία katika kanusho la Paulo
  choice: Kutafsiri kwa upana kuwa “uchafu” bila kubainisha uasherati katika matini kuu.
  alternative: uchafu wa kingono
  rationale: Ingawa neno hilo linaweza kuwa na maana ya kingono katika baadhi ya miktadha, hapa halitajwi kwa namna hiyo wazi; tafsiri pana haiongezi shtaka ambalo Kigiriki hakilibainishi.
- issue: Tofauti kati ya πλάνη na δόλος
  choice: Kutumia “upotovu” kwa πλάνη na “hila” kwa δόλος.
  alternative: Kutafsiri yote mawili kwa maneno yanayomaanisha udanganyifu
  rationale: Uteuzi huu unahifadhi mvutano wa kimatamshi kati ya chanzo kilicho potovu au chenye kosa na namna ya kutenda kwa ujanja wa makusudi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Marudio ya kitenzi katika “wala hautolewi kwa hila” yanahifadhi tofauti ya viambishi vya Kigiriki kati ya chanzo (ἐκ/ἐξ) na namna (ἐν) kwa mtiririko wa kawaida wa Kiswahili.
