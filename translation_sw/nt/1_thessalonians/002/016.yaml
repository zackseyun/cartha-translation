base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/016.yaml
  text: by hindering us from speaking to the Gentiles so that they may be saved[a], so as always to fill up the measure of their sins[b]. But wrath has come upon them at last.
translation:
  language: sw
  text: kwa kutuzuia tusiwaambie Mataifa ili waokolewe, na hivyo wao huendelea kujaza kipimo cha dhambi zao. Lakini ghadhabu[b] imewafikia hatimaye[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au “kabisa,” “kikamilifu,” au “hadi mwisho” badala ya “hatimaye” (Kigiriki: εἰς τέλος).'
    reason: lexical_alternative
  - marker: b
    text: Huenda “ghadhabu” inamaanisha hukumu ya Mungu, lakini Paulo hasemi hapa wazi kama anamaanisha hukumu ya kihistoria iliyopo, hukumu ya mwisho, au zote mbili.
    reason: alternative_reading
lexical_decisions:
- source_word: κωλυόντων
  choice: kwa kutuzuia
  rationale: Kauli endelevu ya kitenzi-jina inaendeleza maelezo yaliyotangulia na kuonyesha tendo la kuwazuia waandishi.
- source_word: τοῖς ἔθνεσιν
  choice: watu wa mataifa
  rationale: Hapa neno hilo linawarejelea watu wasio Wayahudi, si mataifa kama vitengo vya kisiasa.
- source_word: λαλῆσαι
  choice: tusizungumze na
  rationale: Hili ni tafsiri ya moja kwa moja na ya kawaida ya kusema na watu fulani; kusudi la kiinjili linaonekana katika kishazi kinachofuata bila kuongeza neno kama ‘kuhubiri.’
- source_word: ἵνα σωθῶσιν
  choice: ili waokolewe
  rationale: Inahifadhi kishazi cha kusudi na hali tendwa ya kitenzi cha Kigiriki.
- source_word: εἰς τὸ ἀναπληρῶσαι
  choice: na hivyo ... kujaza
  rationale: Inaonyesha matokeo au mwelekeo wa tendo bila kudai kwamba kusudi lao la makusudi lilikuwa kukamilisha dhambi zao.
- source_word: ἀναπληρῶσαι
  choice: kujaza kipimo cha
  rationale: Inaeleza kwa Kiswahili sanifu taswira ya dhambi kufikia ujazo wake, huku neno ‘kipimo’ likifanya nahau ieleweke.
- source_word: πάντοτε
  choice: daima
  rationale: Inahifadhi wazo la mwenendo unaoendelea au unaorudiwa.
- source_word: ἔφθασεν
  choice: imewafikia
  rationale: Wakati timilifu wa Kiswahili unaonyesha tendo lililotokea lenye umuhimu wa sasa; ‘kuwafikia’ pia linaendana kawaida na ἐπ’ αὐτούς.
- source_word: ὀργή
  choice: ghadhabu
  rationale: Neno hili lina uzito unaofaa na linaacha wazi kwamba muktadha unaelekea kwenye ghadhabu au hukumu ya Mungu.
- source_word: εἰς τέλος
  choice: hatimaye
  rationale: Ni usemi wa kawaida wa Kiswahili unaoweza kuonyesha kilele cha muda; uwezekano wa maana ‘kabisa’ au ‘hadi mwisho’ umehifadhiwa katika tanbihi.
theological_decisions:
- issue: Rejeleo na maana kamili ya ‘ghadhabu’
  choice: Neno ‘ghadhabu’ limeachwa bila kufafanua aina au wakati wa hukumu.
  alternative: Hukumu mahususi ya kihistoria; hukumu ya mwisho; au hukumu inayohusisha sasa na wakati ujao.
  rationale: Kifungu kinaashiria kwa nguvu ghadhabu ya Mungu lakini hakitaji wazi tukio gani au kama hukumu ya sasa na ya mwisho zote zinahusika.
- issue: Nguvu ya εἰς τὸ ἀναπληρῶσαι
  choice: ‘na hivyo’ inaonyesha matokeo au mwelekeo bila kuufanya kuwa kusudi lao la makusudi.
  alternative: ‘ili wajaze,’ ambayo ingeweza kueleweka kama kusudi lao wenyewe.
  rationale: Muundo wa Kigiriki unaweza kueleza matokeo katika muktadha huu; tafsiri haipaswi kudai nia ambayo kifungu hakisemi wazi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Watu wa mataifa’ ni wazi zaidi kwa wasomaji wa kawaida kuliko kutumia ‘Mataifa’ peke yake kwa maana ya watu wasio Wayahudi. Alama zote za tanbihi zimewekwa katika matini.
