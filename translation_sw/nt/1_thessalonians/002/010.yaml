  text: ὑμεῖς μάρτυρες καὶ ὁ θεός, ὡς ὁσίως καὶ δικαίως καὶ ἀμέμπτως ὑμῖν τοῖς πιστεύουσιν ἐγενήθημεν,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/010.yaml
  text: You are witnesses[a], and God also, how devoutly and righteously and blamelessly we behaved toward you who believe[b],
translation:
  language: sw
  text: Ninyi ni mashahidi, na Mungu pia, jinsi tulivyoishi kwa utauwa, kwa uadilifu, na bila lawama kwenu ninyi mnaoamini.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑμεῖς μάρτυρες καὶ ὁ θεός
  choice: Ninyi ni mashahidi, na Mungu pia
  rationale: Muundo huu huhifadhi msisitizo wa kiwakilishi ὑμεῖς na wito wa Paulo kwa Wathesalonike kwanza, kisha kwa Mungu, kama mashahidi.
- source_word: ὡς
  choice: jinsi
  rationale: Katika muktadha huu ὡς huanzisha namna ambavyo Paulo na wenzake waliishi.
- source_word: ὁσίως
  choice: kwa utauwa
  rationale: Neno hili linaeleza mwenendo unaolingana na uchaji na wajibu kwa Mungu; ‘kwa utauwa’ ni la sasa na huhifadhi mwelekeo huo kwa Mungu.
- source_word: δικαίως
  choice: kwa uadilifu
  rationale: Hueleza mwenendo ulio sawa kimaadili; ‘kwa uadilifu’ ni Kiswahili cha kawaida na chenye heshima.
- source_word: ἀμέμπτως
  choice: bila lawama
  rationale: Hueleza mwenendo ambao haukutoa msingi halali wa kulaumiwa, bila kudai ukamilifu usio na dhambi.
- source_word: ὑμῖν
  choice: mbele yenu
  rationale: Datibu inaonyesha watu ambao mwenendo huo ulidhihirishwa kuhusiana nao. ‘Mbele yenu’ ni ya asili kwa Kiswahili na haibani maana kuwa matendo yaliwalenga wao tu.
- source_word: τοῖς πιστεύουσιν
  choice: ninyi mnaoamini
  rationale: Kirai shirikishi cha wakati wa sasa kinawatambulisha wasikilizaji kwa kitendo chao cha kuamini; muundo huu huhifadhi nguvu ya kitenzi.
- source_word: ἐγενήθημεν
  choice: tulivyoishi
  rationale: Pamoja na vielezi vya namna, γίνομαι hapa hueleza jinsi wamishonari walivyoenenda au kuishi; ‘tulivyoishi’ ni ya asili na pana vya kutosha kwa mwenendo wao.
theological_decisions:
- issue: Sifa tatu za kimaadili za mwenendo wa mitume
  choice: Sifa hizo zinaeleza mwenendo halisi wa wamishonari mbele za Mungu na waamini, bila kufafanuliwa kuwa dai la kutokuwa na dhambi kabisa.
  alternative: Kuzichukulia kama utetezi wa balagha tu, au kama dai la ukamilifu wa kimaadili usio na dhambi.
  rationale: Aya inatoa wito mzito kwa mashahidi wa kibinadamu na wa kimungu kuhusu uadilifu wa mwenendo wao. ‘Bila lawama’ huhifadhi dai la kutostahili mashtaka halali bila kutatua zaidi mvutano wa kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa msomaji wa kawaida. Mfuatano wa vielezi vitatu umehifadhiwa kwa miundo sawia ili kuakisi msisitizo wa Kigiriki.
