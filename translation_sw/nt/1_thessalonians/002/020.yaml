lexical_decisions:
- source_word: ὑμεῖς
  choice: ninyi
  rationale: Kiwakilishi cha nafsi ya pili wingi kimetajwa wazi kwa msisitizo; “ninyi” huhifadhi msisitizo huo kwa Kiswahili cha kawaida.
- source_word: γάρ
  choice: Kwa maana
  rationale: Kiunganishi hiki kinaeleza sababu ya kauli iliyotangulia; “kwa maana” huhifadhi uhusiano huo wa kimantiki kwa lugha ya asili.
- source_word: ἐστε
  choice: ndio
  rationale: Muundo wa Kiswahili “ninyi ndio” huwasilisha kitenzi kishirikishi pamoja na msisitizo wa sentensi ya Kigiriki kwa namna ya kawaida.
- source_word: ἡ δόξα ἡμῶν
  choice: utukufu wetu
  rationale: “Utukufu” huhifadhi maana kuu na uzito wa δόξα, huku muktadha ukiruhusu pia wazo la fahari au heshima.
- source_word: καὶ ἡ χαρά
  choice: na furaha yetu
  rationale: χαρά ni furaha au shangwe; “furaha” ndiyo nomino ya moja kwa moja na ya kawaida. Kivumishi kimilikishi “yetu” kimerudiwa ili sentensi iwe wazi na ya asili kwa Kiswahili.
theological_decisions:
- issue: Maana ya δόξα katika kauli ya Paulo kuhusu watu
  choice: utukufu
  alternative: fahari au heshima
  rationale: “Utukufu” huhifadhi upana wa neno la Kigiriki na nguvu yake ya balagha bila kuifanya kauli iwe majivuno ya kibinafsi. Tanbihi inahifadhi maana nyingine halali katika muktadha huu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo “ninyi ndio” umetumiwa kuonyesha msisitizo wa kiwakilishi kilichotajwa wazi katika Kigiriki.
