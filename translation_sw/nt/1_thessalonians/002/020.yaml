  text: For you are our glory and joy[a].
translation:
  language: sw
  text: Kwa maana ninyi ndio utukufu wetu na furaha yetu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “fahari” au “heshima” badala ya “utukufu.”
