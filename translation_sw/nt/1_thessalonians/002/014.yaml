  terminology: “Makanisa ya Mungu,” “Masihi Yesu,” na “Wayahudi” zinafaa. “Yudea” ni jina sahihi la mahali; tanbihi ihifadhi mbadala wa ‘watu wa Yudea’ kwa Ἰουδαίων bila kudhoofisha maana kuu.
