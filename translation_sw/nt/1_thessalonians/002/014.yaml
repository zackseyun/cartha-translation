  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὑμεῖς γὰρ μιμηταὶ ἐγενήθητε, ἀδελφοί, τῶν ἐκκλησιῶν τοῦ θεοῦ τῶν οὐσῶν ἐν τῇ Ἰουδαίᾳ ἐν Χριστῷ Ἰησοῦ, ὅτι τὰ αὐτὰ ἐπάθετε καὶ ὑμεῖς ὑπὸ τῶν ἰδίων συμφυλετῶν καθὼς καὶ αὐτοὶ ὑπὸ τῶν Ἰουδαίων
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/014.yaml
  text: For you became imitators[a], brothers, of the churches of God that are in Judea in Messiah Jesus, because you also suffered the same things from your own countrymen[c][b], just as they did from the Jews.
translation:
  language: sw
  text: Kwa maana ninyi, ndugu, mkawa waigaji wa makanisa ya Mungu yaliyoko Yudea katika Masihi Yesu, kwa sababu ninyi pia mlipatwa na mateso yaleyale kutoka kwa watu wa kwenu wenyewe, kama vile wao walivyopata kutoka kwa Wayahudi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watu wa Yudea.” Neno la Kigiriki linaweza kumaanisha Wayahudi au watu wa eneo la Yudea, kutegemea muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: μιμηταὶ ἐγενήθητε
  choice: mlianza kuyaiga
  rationale: Muundo huu unaonyesha kuingia katika hali ya kuwa waigaji, si kuwa hivyo tu; Kiswahili cha kitenzi kinaeleweka kwa urahisi kuliko nomino nzito ya moja kwa moja.
- source_word: ἀδελφοί
  choice: ndugu
  rationale: “Ndugu” ni mwito wa kawaida wa Kiswahili unaoweza kulihusu kusanyiko lote bila kulazimisha jinsia isiyokusudiwa na muktadha.
- source_word: ἐκκλησιῶν τοῦ θεοῦ
  choice: makanisa ya Mungu
  rationale: Hili ndilo neno la kawaida na lenye hadhi katika barua za Agano Jipya kwa makusanyiko ya waamini.
- source_word: τῶν οὐσῶν ἐν τῇ Ἰουδαίᾳ
  choice: yaliyo katika Uyahudi
  rationale: Huhifadhi utambulisho wa kijiografia wa makanisa kwa lugha ya kawaida ya Kiswahili.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: ndani ya Masihi Yesu
  rationale: “Masihi” huhifadhi maana ya cheo Χριστός, huku “ndani ya” ikidumisha uhusiano wa ἐν badala ya kuufanya tu utambulisho wa jina.
- source_word: τὰ αὐτὰ ἐπάθετε
  choice: mliteswa vivyo hivyo
  rationale: Huwasilisha kwa Kiswahili cha asili kwamba walipatwa na mateso yanayolingana, bila kudai kuwa kila tukio lilikuwa sawa kabisa.
- source_word: τῶν ἰδίων συμφυλετῶν
  choice: watu wa taifa lenu wenyewe
  rationale: συμφυλέται huonyesha watu wa kundi au taifa moja; tafsiri hii huepuka maana finyu ya uraia pekee na huhifadhi msisitizo wa ἰδίων.
- source_word: τῶν Ἰουδαίων
  choice: Wayahudi
  rationale: Hii ndiyo maana ya kawaida ya neno hapa, lakini uwezekano wa maana ya “watu wa Uyahudi” umehifadhiwa katika tanbihi kwa sababu Ἰουδαῖοι inaweza kuwa ya kikabila-dini au ya kijiografia.
theological_decisions:
- issue: Kutafsiri Χριστῷ kama cheo au kama sehemu ya jina
  choice: Masihi Yesu
  alternative: Kristo Yesu
  rationale: Cheo “Masihi” huhifadhi maana ya Χριστός bila kubadili dai la Kikristo la kifungu.
- issue: Upeo wa neno τῶν Ἰουδαίων
  choice: Wayahudi
  alternative: watu wa Uyahudi
  rationale: Maandishi yanataja waliowatesa makanisa hayo, wala hayasemi Wayahudi wote bila ubaguzi. Tafsiri kuu inadumisha maana ya kawaida, na tanbihi inalinda uwezekano wa maana ya kijiografia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imeundwa kwa mtiririko wa kawaida huku ikihifadhi ulinganisho kati ya mateso ya Wathesalonike na yale ya makanisa ya Uyahudi.
