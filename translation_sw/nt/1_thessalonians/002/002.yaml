source:
  edition: SBLGNT
  text: ἀλλὰ προπαθόντες καὶ ὑβρισθέντες καθὼς οἴδατε ἐν Φιλίπποις ἐπαρρησιασάμεθα ἐν τῷ θεῷ ἡμῶν λαλῆσαι πρὸς ὑμᾶς τὸ εὐαγγέλιον τοῦ θεοῦ ἐν πολλῷ ἀγῶνι.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/002.yaml
  text: But after we had already suffered and been shamefully mistreated[a], as you know, in Philippi[c][b], we were bold in our God to speak the gospel of God to you amid much conflict.
translation:
  language: sw
  text: Lakini baada ya kuteseka na kutendewa vibaya kwa fedheha[a] huko Filipi, kama mjuavyo, tulikuwa na ujasiri katika Mungu wetu kuisema injili ya Mungu kwenu[b] katika mapambano makubwa.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutendewa kwa dharau,” “kutukanwa,” au “kunyanyaswa.” Kitenzi cha Kigiriki kinadokeza kutendewa kwa jeuri au kiburi kwa namna inayovunja heshima, mara nyingi hadharani.
    reason: lexical_alternative
  - marker: b
    text: Au, “tulisema kwa ujasiri katika Mungu wetu.” Kitenzi cha Kigiriki chenyewe kinaweza kujumuisha tendo la kusema kwa ujasiri; tafsiri kuu imetenganisha ujasiri na tendo la kusema ili kuonyesha muundo unaofuata katika Kigiriki.
    reason: lexical_alternative
  - marker: c
    text: Au, “katika pambano kali” au “huku tukikabili upinzani mkubwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Lakini
  rationale: Inaonyesha utofautishaji wenye nguvu na wazo lililotangulia kwa njia ya kawaida katika Kiswahili.
- source_word: προπαθόντες
  choice: baada ya kuwa tumekwisha kuteseka
  rationale: Inaonyesha kwamba mateso yalitangulia tendo kuu na inadokeza maana ya προ- bila kutumia muundo mgumu usio wa kawaida.
- source_word: ὑβρισθέντες
  choice: kutendewa vibaya kwa fedheha
  rationale: Inajumuisha kutendewa vibaya pamoja na kudharauliwa au kuvunjiwa heshima, si kutukanwa kwa maneno tu.
- source_word: καθὼς οἴδατε
  choice: kama mjuavyo
  rationale: Ni kauli ya kawaida na yenye heshima inayowakumbusha wasomaji jambo wanalolijua.
- source_word: ἐν Φιλίπποις
  choice: huko Filipi
  rationale: Jina la mahali limetolewa kwa umbo linalotumika katika Kiswahili; 'huko' linafaa kwa tukio la mahali pengine linalokumbukwa.
- source_word: ἐπαρρησιασάμεθα
  choice: tulikuwa na ujasiri
  rationale: Inaonyesha ujasiri au uhuru wa kusema, huku kitenzi-jina kinachofuata kikibainisha tendo la kuwaambia.
- source_word: ἐν τῷ θεῷ ἡμῶν
  choice: katika Mungu wetu
  rationale: Inahifadhi kwa makusudi maana pana ya uhusiano, mazingira, au msingi wa ujasiri huo badala ya kuifanya iwe sababu ya kiutendaji pekee.
- source_word: λαλῆσαι πρὸς ὑμᾶς
  choice: kuwaambia
  rationale: Ni Kiswahili cha asili kinachoonyesha kusema ujumbe kwa watu fulani bila kuongeza wazo lisilomo katika kitenzi.
- source_word: τὸ εὐαγγέλιον τοῦ θεοῦ
  choice: injili ya Mungu
  rationale: Inahifadhi kirai cha Paulo na uhusiano mpana wa nomino tegemezi bila kuamua kama maana hasa ni chanzo, umiliki, au habari inayomhusu Mungu.
- source_word: ἐν πολλῷ ἀγῶνι
  choice: katikati ya mapambano makubwa
  rationale: Inahifadhi wigo wa ἀγών unaoweza kumaanisha pambano, juhudi kali, au hali ya upinzani.
theological_decisions:
- issue: Maana ya ἐν τῷ θεῷ ἡμῶν
  choice: katika Mungu wetu
  alternative: kwa msaada wa Mungu wetu; kwa kumtegemea Mungu wetu
  rationale: Muundo huu unahifadhi uwezekano kwamba Mungu ndiye mazingira ya kiuhusiano au msingi wa ujasiri wao, bila kuufanya usemi huo uwe wa chombo au sababu pekee.
- issue: Uhusiano katika τὸ εὐαγγέλιον τοῦ θεοῦ
  choice: injili ya Mungu
  alternative: Habari Njema kutoka kwa Mungu; Habari Njema inayomhusu Mungu
  rationale: Muundo wa 'ya Mungu' unahifadhi utata halisi wa kirai cha Kigiriki badala ya kuamua bila ulazima aina moja tu ya uhusiano.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wa heshima, na unaoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi unafuata mtiririko wa hoja ya Kigiriki, huku tanbihi zikihifadhi mbadala muhimu za kileksika na utata wa maana.
