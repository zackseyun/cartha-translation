id: 1TH.2.13
reference: 1 Thessalonians 2:13
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ⸀Καὶ διὰ τοῦτο καὶ ἡμεῖς εὐχαριστοῦμεν τῷ θεῷ ἀδιαλείπτως, ὅτι παραλαβόντες λόγον ἀκοῆς παρ’ ἡμῶν τοῦ θεοῦ ἐδέξασθε οὐ λόγον ἀνθρώπων ἀλλὰ καθὼς ⸂ἀληθῶς ἐστὶν⸃ λόγον θεοῦ, ὃς καὶ ἐνεργεῖται ἐν ὑμῖν τοῖς πιστεύουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/013.yaml
  text: And because of this we also thank God continually[a], that when you received the word of God that you heard from us, you accepted it not as the word of men but, as it truly is, the word of God[c][b], which is also at work in you who believe.
translation:
  language: sw
  text: Na kwa sababu hiyo, sisi pia tunamshukuru Mungu bila kukoma, kwa kuwa mlipopokea neno la Mungu mlilosikia kutoka kwetu[a], mlilikubali si kama neno la wanadamu, bali kama neno la Mungu, kama lilivyo kweli, ambalo[b] pia linafanya kazi ndani yenu ninyi mnaoamini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ujumbe wa Mungu mliousikia kutoka kwetu.” Muundo wa Kigiriki umebanwa na unaweza kufunguliwa kwa njia zaidi ya moja katika Kiswahili.
    reason: lexical_alternative
  - marker: b
    text: 'Kiwakilishi hiki kinaweza pia kueleweka kuwa kinamrejelea Mungu: “ambaye pia anafanya kazi ndani yenu ninyi mnaoamini.”'
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: kwa sababu hiyo
  rationale: Inahifadhi uhusiano wa kisababishi na muktadha uliotangulia, badala ya kuufanya kuwa hitimisho tu.
- source_word: εὐχαριστοῦμεν ... ἀδιαλείπτως
  choice: tunamshukuru Mungu bila kukoma
  rationale: Ni Kiswahili cha kawaida na chenye heshima kinachoonyesha tendo la shukrani linaloendelea au kurudiwa daima.
- source_word: παραλαβόντες
  choice: mlipopokea
  rationale: Kishiriki cha Kigiriki kimewasilishwa kwa kishazi cha wakati kinachosomika kwa kawaida katika Kiswahili na kuhifadhi wazo la kupokea kile kilichowasilishwa.
- source_word: λόγον ἀκοῆς παρ’ ἡμῶν τοῦ θεοῦ
  choice: neno la Mungu mlilosikia kutoka kwetu
  rationale: Muundo uliobanwa wa Kigiriki umefunguliwa kwa Kiswahili cha kawaida huku 'neno la Mungu' na kusikiwa kwake kutoka kwa mitume vikihifadhiwa.
- source_word: ἐδέξασθε
  choice: mlilikubali
  rationale: 'Inaonyesha zaidi ya kusikia au kupokea tu: ujumbe ulipokelewa kwa kukubaliwa, jambo linalofaa katika utofautishaji unaofuata.'
- source_word: οὐ λόγον ἀνθρώπων
  choice: si kama neno la wanadamu
  rationale: '''Wanadamu'' ni jumuishi na la sasa, na huhifadhi utofautishaji kati ya neno lenye asili ya kibinadamu na neno la Mungu.'
- source_word: ἀλλὰ καθὼς ἀληθῶς ἐστὶν
  choice: bali kama lilivyo kweli
  rationale: Inahifadhi dai la kusisitiza kwamba utambulisho wa ujumbe kuwa neno la Mungu ni wa kweli, bila kulipanua kitheolojia.
- source_word: λόγον θεοῦ
  choice: neno la Mungu
  rationale: Kurudia usemi huendeleza uzito wa kitheolojia na utofautishaji wa balagha uliomo katika Kigiriki.
- source_word: ἐνεργεῖται
  choice: linafanya kazi
  rationale: Ni usemi wa asili unaoonyesha nguvu tendaji inayoendelea bila kulazimisha uamuzi kati ya vivuli vya maana vya kati na vya kutendwa.
- source_word: τοῖς πιστεύουσιν
  choice: ndani yenu ninyi mnaoamini
  rationale: Inahifadhi sifa ya kuendelea ya imani na kuweka wazi kwamba kazi hiyo iko ndani ya waamini.
theological_decisions:
- issue: Kirejelewa cha kiwakilishi ὃς
  choice: 'Kishazi kinarejelea ''neno la Mungu'': ''ambalo pia linafanya kazi.'''
  alternative: 'Kinaweza kueleweka kuwa kinamrejelea Mungu: ''ambaye pia anafanya kazi.'''
  rationale: λόγος ('neno') ndilo jina lililo karibu zaidi na linapatana kisarufi na kiwakilishi cha Kigiriki; hata hivyo, θεός ('Mungu') pia linawezekana kisarufi na kimaana, kwa hiyo uwezekano huo umehifadhiwa katika tanbihi.
- issue: Maana ya 'neno la Mungu' katika mahubiri ya mitume
  choice: neno la Mungu
  alternative: ujumbe wa Mungu
  rationale: Tafsiri ya moja kwa moja huhifadhi utofautishaji wa kifungu kati ya neno la wanadamu na neno la Mungu bila kuingiza dai pana zaidi kuhusu uvuvio ambalo mstari wenyewe haulielezi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi hudumisha marudio ya 'neno la Mungu' kwa msisitizo, hutumia 'wanadamu' kwa maana jumuishi, na inaweka wazi tofauti kati ya kupokea ujumbe na kuukubali.
