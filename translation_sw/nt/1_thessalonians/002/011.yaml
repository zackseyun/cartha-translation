translation:
  language: sw
  text: kama mnavyojua[a], tulishughulika na kila mmoja wenu kama baba anavyowatendea watoto wake mwenyewe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata muundo wa Kigiriki kwa karibu zaidi, “kama mnavyojua jinsi [tulivyowatendea] kila mmoja wenu, kama baba watoto wake mwenyewe.” Kifungu cha Kigiriki kina udondoshaji wa kitenzi na hutegemea sentensi inayokizunguka ili maana yake kamili ipatikane.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθάπερ
  choice: kama
  rationale: Huanzisha ulinganisho kwa kurejelea yale ambayo Wathesalonike wanayajua kuhusu mwenendo wa mitume; “kama” ni ya asili na huhifadhi nguvu ya ulinganisho.
- source_word: οἴδατε
  choice: mnavyojua
  rationale: Ingawa umbo la Kigiriki ni timilifu, kitenzi hiki kwa kawaida kina maana ya wakati wa sasa, “mnajua.” Muundo “mnavyojua” unaungana kwa kawaida na ulinganisho.
- source_word: ὡς (ya kwanza)
  choice: -vyo- katika “mnavyojua”
  rationale: ὡς ya kwanza huanzisha maudhui au namna ya jambo wanalolijua. Kiswahili huieleza kwa kawaida ndani ya muundo “mnavyojua,” bila kuongeza kiunganishi kizito.
- source_word: ἕνα ἕκαστον ὑμῶν
  choice: kila mmoja wenu
  rationale: Huhifadhi msisitizo wa Kigiriki kwamba kila mtu alihudumiwa binafsi.
- source_word: ὡς (ya pili)
  choice: kama ... anavyo-
  rationale: Huonyesha ulinganisho kati ya mwenendo wa mitume na ule wa baba kwa watoto wake.
- source_word: πατὴρ
  choice: baba
  rationale: Nomino isiyo na kibainishi imetumiwa kwa sifa katika ulinganisho; Kiswahili hakihitaji kibainishi kisicho dhahiri.
- source_word: τέκνα
  choice: watoto
  rationale: Ni neno pana la ukoo lisilowahusu wana wa kiume pekee.
- source_word: ἑαυτοῦ
  choice: wake mwenyewe
  rationale: 'Huhifadhi msisitizo wa kiwakilishi rejeshi: si watoto kwa ujumla, bali watoto wa baba huyo mwenyewe.'
- source_word: '[wazo la kitenzi lililoachwa na kutegemea muktadha]'
  choice: tulishughulika na ... anavyoshughulika na
  rationale: Kifungu cha Kigiriki ni duaradufu na hutegemea sentensi inayokizunguka. “Tulishughulika na” ni pana vya kutosha kubeba tendo la kichungaji lililodokezwa bila kulibana kuwa tendo moja tu kati ya kuonya, kutia moyo, na kusihi.
theological_decisions:
- issue: Kuweka wazi tendo la kitenzi lililodokezwa katika kifungu cha Kigiriki chenye udondoshaji
  choice: 'Kutumia kitenzi kipana kilichoongezwa: “tulishughulika na kila mmoja wenu”'
  alternative: Kuacha kifungu kikiwa karibu na muundo wake uliokatika, au kuweka kitenzi mahususi kama “tulimsihi kila mmoja wenu”
  rationale: Kigiriki hakitoi sentensi kamili hapa bila kutegemea muktadha unaofuata. Kitenzi kipana huhifadhi ulinganisho na matendo mbalimbali yanayoelezwa katika sentensi pana bila kuchagua kimya kimya tendo moja pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Tafsiri imetumia muundo wa kawaida wa Kiswahili huku tanbihi ikihifadhi udondoshaji na utata halisi wa kisintaksia wa Kigiriki.
