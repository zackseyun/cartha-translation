lexical_decisions:
- source_word: ζητοῦντες
  choice: hatukutafuta
  rationale: Kitenzi hiki ni hali ya kuendelea inayowahusu wahusika wanaoeleweka kutokana na sentensi inayozunguka. Kiswahili hutumia umbo la kitenzi kamili ili kuunganisha kishazi hiki kwa kawaida na muktadha uliotangulia, bila kuongeza nia isiyotajwa.
- source_word: ἐξ ἀνθρώπων
  choice: kutoka kwa watu
  rationale: ἄνθρωποι hapa inawahusu wanadamu kwa ujumla, si wanaume pekee; “watu” ni Kiswahili cha kawaida na jumuishi.
- source_word: δόξαν
  choice: utukufu
  rationale: “Utukufu” hudumisha uhusiano wa kileksia na maana ya kawaida ya δόξα katika Agano Jipya, huku muktadha wa “kutoka kwa watu” ukionyesha kuwa hapa ni sifa au heshima inayotolewa na wanadamu.
- source_word: οὔτε ... οὔτε ... οὔτε
  choice: wala ... kutoka kwenu wala kutoka kwa wengine
  rationale: “Wala” huendeleza ukanushaji wa muktadha uliotangulia na pia huhifadhi mpangilio wa vishazi hasi katika Kiswahili cha asili.
- source_word: ἀφ’ ὑμῶν
  choice: kutoka kwenu
  rationale: Huhifadhi rejeo la moja kwa moja la nafsi ya pili wingi kwa waamini wa Thesalonike.
- source_word: ἀπ’ ἄλλων
  choice: kutoka kwa wengine
  rationale: Ni tafsiri fupi na ya kawaida ya rejeo kwa watu wengine mbali na Wathesalonike.
theological_decisions:
- issue: Asili ya δόξα inayotafutwa
  choice: utukufu kutoka kwa wanadamu, yaani heshima au sifa yao
  alternative: heshima ya kibinadamu; sifa ya kibinadamu
  rationale: Kirai ἐξ ἀνθρώπων kinaonyesha wazi kwamba kinachozungumziwa ni kukubaliwa au kuheshimiwa na wanadamu, si utukufu unaotoka kwa Mungu. Neno kuu linabaki “utukufu,” na tanbihi inadokeza maana nyingine zinazowezekana katika muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umehifadhi utegemezi wa kishazi kwa muktadha unaotangulia, kama ilivyo katika Kigiriki.
