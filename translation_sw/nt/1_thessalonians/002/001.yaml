  text: Αὐτοὶ γὰρ οἴδατε, ἀδελφοί, τὴν εἴσοδον ἡμῶν τὴν πρὸς ὑμᾶς ὅτι οὐ κενὴ γέγονεν,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/001.yaml
  text: For you yourselves know[a], brothers, that our coming to you was not in vain,
translation:
  language: sw
  text: Kwa maana ninyi wenyewe mnajua, ndugu[a], kwamba kuja kwetu kwenu hakukuwa bure.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ndugu wa kiume na wa kike”; Kigiriki kina neno lenye maana ya “ndugu wa kiume” katika umbo la wingi wa kiume, ambalo mara nyingi hutumiwa kuiambia jumuiya nzima ya waumini.
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτοὶ
  choice: ninyi wenyewe
  rationale: Kiima cha msisitizo kimehifadhiwa ili kuonyesha kwamba Wathesalonike wenyewe walikuwa na ufahamu wa moja kwa moja kuhusu ziara hiyo.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Kiunganishi hiki kinaunganisha kauli na hoja iliyotangulia kwa kutoa msingi wake; “Kwa maana” ni cha kawaida na kinahifadhi mtiririko wa hoja.
- source_word: οἴδατε
  choice: mnajua
  rationale: Ingawa umbo la Kigiriki ni timilifu, kitenzi hiki kwa kawaida kina maana ya wakati uliopo, yaani “kujua.”
- source_word: ἀδελφοί
  choice: ndugu
  rationale: “Ndugu” ni neno la kawaida la Kiswahili linaloweza kutumiwa kuwaambia waumini wa kiume na wa kike; tanbihi inaweka wazi upeo huo na umbo la Kigiriki.
- source_word: τὴν εἴσοδον ἡμῶν τὴν πρὸς ὑμᾶς
  choice: kuja kwetu kwenu
  rationale: Katika muktadha huu εἴσοδος ni kuwasili au kuja kwa Paulo na wenzake. “Kuja kwetu kwenu” huhifadhi mwelekeo wa πρὸς ὑμᾶς bila kuwa kauli ngumu isiyo ya kawaida.
- source_word: ὅτι
  choice: kwamba
  rationale: Hapa ὅτι inaanzisha yaliyomo katika jambo wanalolijua.
- source_word: οὐ κενὴ γέγονεν
  choice: hakukuwa bure
  rationale: κενός hapa inaweza kumaanisha tupu, isiyo na matokeo, au bure. Kauli hii ya Kiswahili ni ya asili na inaacha wazi kama mkazo ni kutokuwa bila matokeo, kusudi, au umuhimu.
theological_decisions:
- issue: Upeo wa ἀδελφοί katika salamu kwa jumuiya yenye wanaume na wanawake
  choice: ndugu
  alternative: ndugu wa kiume na wa kike
  rationale: Kiswahili “ndugu” kwa asili linaweza kujumuisha jinsia zote, huku Kigiriki kikitumia umbo la wingi la kiume. Tanbihi huhifadhi taarifa hiyo bila kufanya mstari mkuu kuwa mzito.
- issue: Maana ya οὐ κενὴ γέγονεν
  choice: hakukuwa bure
  alternative: hakukuwa bila matokeo
  rationale: “Bure” huhifadhi upana wa κενή na mvutano wake wa kimuktadha badala ya kuamua kwamba Paulo anazungumzia matokeo pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Ninyi wenyewe” inaleta msisitizo wa asili; “kuja kwetu kwenu” ni wazi na huhifadhi mwelekeo wa kishazi cha Kigiriki.
