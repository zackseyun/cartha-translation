  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἡμεῖς δέ, ἀδελφοί, ἀπορφανισθέντες ἀφ’ ὑμῶν πρὸς καιρὸν ὥρας, προσώπῳ οὐ καρδίᾳ, περισσοτέρως ἐσπουδάσαμεν τὸ πρόσωπον ὑμῶν ἰδεῖν ἐν πολλῇ ἐπιθυμίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/017.yaml
  text: But we[a], brothers, having been torn away from you for a short time—in person, not in heart—were all the more eager, with great longing[b], to see your face.
translation:
  language: sw
  text: Lakini sisi, ndugu[a], baada ya kutenganishwa nanyi[b] kwa muda mfupi—kimwili, si moyoni—tulijitahidi zaidi kuwaona ana kwa ana, kwa shauku kubwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ndugu” hapa yaelekea inalihusu kusanyiko lote la waamini, wanawake na wanaume.
    reason: cultural_note
  - marker: b
    text: Kwa maana ya karibu zaidi, “baada ya kufanywa yatima kwa kutengwa nanyi.” Kitenzi cha Kigiriki hutumia taswira yenye nguvu ya kufiwa au kufanywa yatima kueleza maumivu ya kutengana.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἡμεῖς δέ
  choice: Lakini sisi
  rationale: δέ inaonyesha utofautishaji mdogo na habari iliyotangulia, huku Ἡμεῖς ikisisitiza wahusika; “Lakini sisi” huhifadhi yote mawili kwa Kiswahili cha kawaida.
- source_word: ἀδελφοί
  choice: ndugu
  rationale: “Ndugu” ni mwito wa kawaida na wenye hadhi katika Kiswahili, na unaweza kulihusu kusanyiko lote bila kulazimisha jinsia ambayo neno la Kiswahili halibainishi.
- source_word: ἀπορφανισθέντες ἀφ’ ὑμῶν
  choice: tulipotenganishwa nanyi
  rationale: Kitenzi cha Kigiriki kina taswira kali ya kufiwa au kuachwa yatima. Tafsiri kuu inaonyesha kutenganishwa kulikowapata, huku tanbihi ikihifadhi taswira hiyo ya asili.
- source_word: πρὸς καιρὸν ὥρας
  choice: kwa muda mfupi
  rationale: Huu ni usemi unaomaanisha kipindi kifupi, si lazima saa moja halisi.
- source_word: προσώπῳ οὐ καρδίᾳ
  choice: kwa uso, si kwa moyo
  rationale: Utoaji huu huhifadhi sitiari na ulinganifu wa Kigiriki kati ya kutokuwapo kimwili na upendo wa moyoni; “kwa uso” pia inaunganika na “kuuona uso wenu” baadaye katika mstari.
- source_word: περισσοτέρως ἐσπουδάσαμεν
  choice: tulizidi sana kufanya bidii
  rationale: περισσοτέρως huongeza kiwango, na σπουδάζω inaweza kueleza hamu yenye juhudi. Usemi huu unahifadhi nguvu na kipengele cha kujitahidi.
- source_word: τὸ πρόσωπον ὑμῶν ἰδεῖν
  choice: kuuona uso wenu
  rationale: Huhifadhi usemi halisi na wa binafsi wa Kigiriki badala ya kuufupisha kuwa “kuwaona.”
- source_word: ἐν πολλῇ ἐπιθυμίᾳ
  choice: kwa shauku kubwa
  rationale: Katika muktadha huu ἐπιθυμία ni hamu kubwa ya upendo, si tamaa mbaya; “shauku kubwa” ni ya asili na yenye nguvu katika Kiswahili.
theological_decisions:
- issue: Wigo wa mwito ἀδελφοί
  choice: ndugu
  alternative: ndugu wa kiume; ndugu wa kiume na wa kike
  rationale: Neno la Kigiriki lina umbo la wingi wa kiume, lakini katika matumizi ya Paulo mara nyingi hulihusu kusanyiko lote. “Ndugu” katika Kiswahili huhifadhi mwito wa kifamilia na inaweza kuwa jumuishi bila kuongeza maneno yasiyopo katika chanzo.
- issue: Taswira ya ἀπορφανισθέντες
  choice: tulipotenganishwa nanyi, pamoja na tanbihi kuhusu kuachwa yatima
  alternative: tulipoachwa yatima mbali nanyi
  rationale: Tafsiri ya moja kwa moja inaweza kudokeza isivyofaa kwamba Wathesalonike walikuwa wazazi wa Paulo. Maandishi makuu yanatoa maana ya kutenganishwa, na tanbihi inalinda taswira kali ya majonzi iliyo katika Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa “kwa uso, si kwa moyo” umehifadhiwa kwa makusudi ili kutunza sitiari, ulinganifu, na mwangwi wa “kuuona uso wenu.”
