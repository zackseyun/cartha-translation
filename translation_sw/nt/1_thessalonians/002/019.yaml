  text: τίς γὰρ ἡμῶν ἐλπὶς ἢ χαρὰ ἢ στέφανος καυχήσεως— ἢ οὐχὶ καὶ ὑμεῖς— ἔμπροσθεν τοῦ κυρίου ἡμῶν Ἰησοῦ ἐν τῇ αὐτοῦ παρουσίᾳ;
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/019.yaml
  text: For what is our hope or joy or crown of boasting—is it not indeed you?—before our Lord Jesus at his coming[a].
translation:
  language: sw
  text: Kwa maana, tumaini letu, au furaha yetu, au taji letu la kujivunia ni nini—je, si ninyi pia—mbele ya Bwana wetu Yesu wakati wa kuja kwake[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakati wa kuwapo kwake” au “wakati wa kuwasili kwake.” Neno la Kigiriki παρουσία linaweza kumaanisha kuwapo au kuwasili; katika muktadha huu linarejelea kuja kwa Bwana Yesu wakati ujao.
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς
  choice: ni nini
  rationale: Ingawa neno hili linaweza kumaanisha ‘nani’ au ‘nini,’ nomino zinazotangulia—tumaini, furaha na taji—zinafanya ‘ni nini’ iwe ya asili zaidi katika Kiswahili; utambulisho wa jibu kuwa wasomaji unafuata katika swali la balagha.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Hudumisha uhusiano wa maelezo na muktadha unaotangulia badala ya kuuacha.
- source_word: ἐλπίς
  choice: tumaini
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja ya matarajio yenye uhakika katika matumizi ya Paulo.
- source_word: χαρά
  choice: furaha
  rationale: Ni tafsiri ya asili na ya moja kwa moja inayohifadhi nguvu ya kihisia.
- source_word: στέφανος καυχήσεως
  choice: taji letu la kujivunia
  rationale: ‘Taji’ linaeleweka kwa kawaida kama ishara ya heshima au ushindi, na ‘la kujivunia’ linahifadhi uhusiano wa καυχήσεως bila kulibadili kuwa ‘furaha.’ Kiwakilishi ‘letu’ kinarudiwa kwa uwazi na urari wa sentensi ya Kiswahili.
- source_word: οὐχὶ καὶ ὑμεῖς
  choice: Je, si ninyi pia
  rationale: Muundo huu unatarajia jibu la kukubali. ‘Si’ huhifadhi msisitizo wa swali, na ‘pia’ huhifadhi καί bila kulazimisha maana yake kuwa kielezi cha msisitizo pekee.
- source_word: ἔμπροσθεν
  choice: mbele za
  rationale: Ni usemi wa Kiswahili wa kawaida unaoonyesha kuwa katika uwepo wa mtu.
- source_word: κυρίου
  choice: Bwana
  rationale: Ni tafsiri sanifu ya κύριος katika ungamo la Agano Jipya kuhusu Yesu.
- source_word: παρουσία
  choice: kuja
  rationale: Katika muktadha huu wa wakati ujao, neno linaelekeza kwenye kuja au kuwasili kwa Bwana Yesu; ‘kuja’ ni wazi na ya kawaida, huku upana wa maana ukihifadhiwa katika tanbihi.
theological_decisions:
- issue: Tafsiri ya παρουσίᾳ katika muktadha wa matukio ya mwisho
  choice: wakati wa kuja kwake
  alternative: wakati wa kuwapo kwake; wakati wa kuwasili kwake
  rationale: Muktadha unaelekeza kwenye tukio la wakati ujao la Bwana Yesu, kwa hiyo ‘kuja kwake’ huwasilisha maana hiyo kwa Kiswahili cha kawaida. Hata hivyo, kwa kuwa παρουσία linaweza pia kumaanisha kuwapo au kuwasili, maana hizo hazijaondolewa bali zimehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa maswali mawili umechaguliwa ili sentensi iwe ya asili huku ukihifadhi swali la balagha, orodha yenye msisitizo, na uhusiano wake na muktadha uliotangulia.
