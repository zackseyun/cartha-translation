  text: οὕτως ὁμειρόμενοι ὑμῶν εὐδοκοῦμεν μεταδοῦναι ὑμῖν οὐ μόνον τὸ εὐαγγέλιον τοῦ θεοῦ ἀλλὰ καὶ τὰς ἑαυτῶν ψυχάς, διότι ἀγαπητοὶ ἡμῖν ⸀ἐγενήθητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/008.yaml
  text: So[a], longing for you in this way, we were pleased to share with you not only the gospel of God but also our own lives[b], because you had become dear to us.
translation:
  language: sw
  text: Hivyo, kwa kuwa tuliwatamani sana[a], tulifurahi kuwapa si Injili ya Mungu tu, bali pia maisha yetu wenyewe[b], kwa sababu mlikuja kuwa wapendwa kwetu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa kuwa tulikuwa na upendo mwingi kwenu” au “tukiwatamani sana.” Kitenzi cha Kigiriki hapa ni adimu na huonyesha shauku yenye upendo wa kina.
    reason: lexical_alternative
  - marker: b
    text: Au, “nafsi zetu wenyewe” au “sisi wenyewe kabisa”; hapa “maisha” yanaonyesha kwamba walijitoa wenyewe kwa upendo na kwa kujinyima.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: Kwa hiyo
  rationale: Inaunganisha kauli hii na mfano uliotangulia wa mlezi anayewatunza watoto wake; Kiswahili hiki kinaonyesha mwendelezo wa hoja kwa kawaida.
- source_word: ὁμειρόμενοι ὑμῶν
  choice: kwa kuwa tuliwatamani sana
  rationale: Kitenzi hiki adimu kinaonyesha shauku na upendo wenye nguvu. Muundo wa sababu unaeleza kwa kawaida uhusiano wake na kitendo kikuu bila kupunguza hisia zake.
- source_word: εὐδοκοῦμεν
  choice: tulipendezwa
  rationale: Hueleza ridhaa ya hiari yenye furaha, wala si kukubali tu.
- source_word: μεταδοῦναι ὑμῖν
  choice: kuwashirikisha
  rationale: Hutoa maana ya kuwapa wengine sehemu ya kile kilicho chako na inafaa kwa Injili pamoja na maisha ya wahudumu.
- source_word: τὸ εὐαγγέλιον τοῦ θεοῦ
  choice: Injili ya Mungu
  rationale: Ni usemi wa Kikristo unaoeleweka na huhifadhi kwa uwazi uhusiano wa nomino katika Kigiriki.
- source_word: τὰς ἑαυτῶν ψυχάς
  choice: maisha yetu wenyewe
  rationale: Katika muktadha huu ψυχαί ni maisha au nafsi zao kwa maana ya kujitoa wao wenyewe, si maelezo ya mgawanyo wa mwili na roho. 'Wenyewe' huhifadhi mkazo wa ἑαυτῶν.
- source_word: διότι
  choice: kwa sababu
  rationale: Huonyesha wazi sababu ya kujitoa kwao.
- source_word: ἀγαπητοὶ ἡμῖν ἐγενήθητε
  choice: mlikuwa wapendwa kwetu
  rationale: Huhifadhi hali ya uhusiano wenye upendo na joto la kauli hiyo kwa Kiswahili cha heshima na cha kawaida.
theological_decisions:
- issue: Maana ya ψυχάς katika kujieleza kwa Paulo na wenzake
  choice: maisha yetu wenyewe
  alternative: nafsi zetu wenyewe; sisi wenyewe kabisa
  rationale: Muktadha unahusu kujitoa kwa wahudumu katika upendo, si fundisho maalumu kuhusu sehemu zisizoonekana za mwanadamu. 'Maisha' huwasilisha kujitoa huko bila kuingiza maana finyu ya kianthropolojia.
- issue: Nguvu ya ἀγαπητοί
  choice: wapendwa kwetu
  alternative: tuliowapenda; mlio wapenzi kwetu
  rationale: Tafsiri hii huhifadhi upendo wa karibu unaoelekezwa kwa Wathesalonike bila kuifanya kauli iwe istilahi maalumu ya kiteolojia.
- issue: Uhusiano wa ὁμειρόμενοι na kitenzi kikuu
  choice: kwa kuwa tuliwatamani sana
  alternative: tukiwatamani sana; kwa kuwa tulikuwa na upendo mwingi kwenu
  rationale: Kirai kishirikishi cha Kigiriki kinaweza kueleweka kama hali inayoambatana au kama msingi wa tendo. Tafsiri ya kisababu ni ya asili katika Kiswahili, huku tanbihi ikihifadhi uwezekano wa maana ya shauku/upendo wa kina.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo unabaki karibu na mtiririko wa Kigiriki lakini huepuka lugha ngumu au ya kizamani.
