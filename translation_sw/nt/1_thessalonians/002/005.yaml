  text: οὔτε γάρ ποτε ἐν λόγῳ κολακείας ἐγενήθημεν, καθὼς οἴδατε, οὔτε ⸀ἐν προφάσει πλεονεξίας, θεὸς μάρτυς,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/005.yaml
  text: For we never came with flattering speech[a], as you know[b], nor with a pretext for greed—God is witness.
translation:
  language: sw
  text: Kwa maana hatukuwahi kuja kwa maneno ya kujikomba[a], kama mnavyojua, wala kwa kisingizio cha uchoyo[b]—Mungu ni shahidi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa kujikomba”; kihalisi, “katika usemi wa kujikomba.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa kifuniko cha uchoyo” au “kwa kujifanya ili kuficha uchoyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὔτε γάρ ποτε
  choice: Kwa maana hatukuwahi
  rationale: γάρ inaendeleza utetezi wa mstari uliotangulia, hivyo imetafsiriwa “Kwa maana.” Muungano wa οὔτε na ποτε unatoa ukanushaji wa wakati wote, unaoelezwa kwa Kiswahili cha kawaida kuwa “hatukuwahi.”
- source_word: ἐν λόγῳ κολακείας
  choice: kwa maneno ya kujipendekeza
  rationale: λόγος hapa ni usemi au maneno, si neno moja tu; κολακεία ni usemi wa kumsifu au kumpendeza mtu kwa nia isiyo ya kweli. “Maneno ya kujipendekeza” ni ya asili katika Kiswahili na yanadumisha wazo la njia iliyotumiwa.
- source_word: ἐγενήθημεν
  choice: kuja
  rationale: Katika muktadha wa ziara ya wamisionari, kitenzi kinaeleza jinsi Paulo na wenzake walivyokuja au walivyojitokeza miongoni mwa Wathesalonike. “Kuja” kinafaa kwa muktadha bila kulazimisha maana ya kawaida ya “kuwa.”
- source_word: καθὼς οἴδατε
  choice: kama mnavyojua
  rationale: Hii inadumisha wito wa moja kwa moja kwa ufahamu wa wasomaji wenyewe na ni Kiswahili cha kawaida na chenye hadhi.
- source_word: ἐν προφάσει πλεονεξίας
  choice: kwa kisingizio cha tamaa ya mali
  rationale: πρόφασις ni kisingizio, kujifanya, au kifuniko cha nia halisi; πλεονεξία ni tamaa ya kujipatia zaidi, mara nyingi mali. “Kisingizio cha tamaa ya mali” ni wazi, huku tanbihi ikihifadhi uwezekano wa wazo la kifuniko au kujifanya.
- source_word: θεὸς μάρτυς
  choice: Mungu ni shahidi
  rationale: Kauli hii fupi inadumisha ombi zito kwa Mungu kama shahidi. Hakuna kiwakilishi cha umilikaji katika Kigiriki, kwa hiyo hakijaongezwa “wetu.”
theological_decisions:
- issue: Asili ya jambo ambalo Paulo analikana kuhusu mbinu na nia zao
  choice: Mstari unakanusha maneno ya kujipendekeza na tamaa ya kujipatia mali iliyofichwa kwa kisingizio.
  alternative: Kuufanya mstari kuwa lawama pana dhidi ya ufasaha wote, au kuuhusisha na unyonyaji wa fedha pekee.
  rationale: Kigiriki kinataja hasa κολακεία na πλεονεξία. Tafsiri haikatai ufasaha wote wala kuifunga tamaa hiyo kwa fedha pekee, ingawa mali inaonekana kuwa sehemu kuu ya maana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Hatukuwahi kuja” ni usemi wa kawaida unaofaa muktadha wa ziara; “tamaa ya mali” inaeleweka kwa urahisi kuliko nomino dhahania nzito, huku tanbihi ikidumisha upana wa πλεονεξία.
