base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/007.yaml
  text: though we could have been a burden as apostles of the Messiah[a], yet we became gentle among you[c][b], as a nursing mother cherishes her own children.
translation:
  language: sw
  text: Ingawa, kama mitume wa Masihi[b], tungeweza kuwa na uzito[a], tukawa wapole miongoni mwenu, kama mama anayenyonyesha[c] anavyowatunza watoto wake mwenyewe kwa wororo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “tungeweza kutumia mamlaka yetu” au “tungeweza kudai mambo.” Kigiriki husema kihalisi “tungeweza kuwa na uzito.”
    reason: lexical_alternative
  - marker: b
    text: 'Tafsiri ya jadi: “Kristo.”'
    reason: alternative_reading
  - marker: c
    text: Au “mlezi anayenyonyesha” au “mwanamke anayenyonyesha mtoto asiye wake.” Taswira ni ya utunzaji wa kimama wenye wororo.
    reason: lexical_alternative
lexical_decisions:
- source_word: δυνάμενοι
  choice: ingawa tungeweza
  rationale: Kirai cha hali kina maana ya kukubali jambo linalowezekana kabla ya kulinganisha na ἀλλά; Kiswahili cha kawaida hutumia “ingawa tungeweza”.
- source_word: ἐν βάρει εἶναι
  choice: kuwa mzigo kwenu
  rationale: Nahau hiyo kihalisi inahusu kuwa na uzito, lakini katika muktadha inaonyesha kuwawekea wengine uzito kwa madai au mamlaka. “Kuwa mzigo kwenu” ni ya asili na haifungi maana kwenye msaada wa fedha pekee.
- source_word: ὡς Χριστοῦ ἀπόστολοι
  choice: kama mitume wa Masihi
  rationale: Χριστοῦ inatumika kama cheo; “Masihi” huhifadhi maana ya cheo cha Mtiwa-Mafuta, na umilikaji wa Kigiriki unasikika kiasili kama “wa Masihi”.
- source_word: ἀλλὰ ἐγενήθημεν
  choice: lakini tulikuwa
  rationale: Ingawa ἐγενήθημεν kihalisi inaweza kuwa “tukawa,” hapa Kiswahili cha kawaida hutumia “tulikuwa” kueleza mwenendo wao kwa kulinganisha na walichoweza kudai.
- source_word: ἤπιοι
  choice: wapole
  rationale: “Wapole” huwasilisha upole na ulaini wa tabia unaokusudiwa na ἤπιοι.
- source_word: ἐν μέσῳ ὑμῶν
  choice: kati yenu
  rationale: Hii ni tafsiri ya kawaida na ya moja kwa moja ya mahali na uhusiano unaoonyeshwa na kirai hicho.
- source_word: ὡς ἐὰν τροφὸς
  choice: kama mama anayenyonyesha
  rationale: τροφός humaanisha mwanamke anayenyonyesha na kulea; uchaguzi huu unaweka wazi taswira ya utunzaji wa kimama bila kuleta maana ya kliniki ya “muuguzi.”
- source_word: θάλπῃ
  choice: anavyowatunza kwa upendo
  rationale: Kitenzi hiki kihalisi huhusisha kupasha joto na kwa upanuzi kutunza kwa wororo; “kuwatunza kwa upendo” huwasilisha utunzaji huo wenye huruma.
- source_word: τὰ ἑαυτῆς τέκνα
  choice: watoto wake mwenyewe
  rationale: “Watoto” ni tafsiri ya kawaida ya τέκνα, na “wake mwenyewe” huhifadhi msisitizo wa ἑαυτῆς.
theological_decisions:
- issue: Tafsiri ya Χριστοῦ
  choice: Masihi
  alternative: Kristo
  rationale: Katika kirai hiki neno hilo linafanya kazi kama cheo. “Masihi” huonyesha wazi maana hiyo; tafsiri ya jadi “Kristo” imehifadhiwa katika tanbihi.
- issue: Maana ya mamlaka katika ἐν βάρει εἶναι
  choice: kuwa mzigo kwenu
  alternative: kutumia mamlaka yetu / kuwatolea madai
  rationale: Maandishi yana sitiari ya “uzito” inayoweza kujumuisha kutumia hadhi ya kitume au kuweka madai, bila kubainisha mzigo wa kifedha pekee. Tafsiri kuu inaacha upana huo, na tanbihi inataja uwezekano mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni ya kawaida kwa wasomaji wengi huku ikihifadhi sitiari ya mzigo, cheo “Masihi,” na taswira ya utunzaji wa kimama. Alama zote za tanbihi zimewekwa katika maandishi.
