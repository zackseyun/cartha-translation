base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/009.yaml
  text: 'For you remember[a], brothers, our labor and hardship: working night and day so as not to burden any of you, we proclaimed to you the gospel of God.'
translation:
  language: sw
  text: 'Kwa maana mnakumbuka, ndugu[a], juhudi na taabu zetu: tukifanya kazi usiku na mchana ili tusimlemee yeyote kati yenu, tuliwatangazia Injili ya Mungu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ndugu wa kiume na wa kike”; Kigiriki kina “ndugu,” neno ambalo hapa huenda likalihusu kusanyiko lote.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μνημονεύετε
  choice: mnakumbuka
  rationale: Kitenzi hiki ni cha wakati uliopo, nafsi ya pili wingi, na katika muktadha huu ni taarifa, si amri.
- source_word: ἀδελφοί
  choice: ndugu
  rationale: Neno la Kiswahili “ndugu” ni la kawaida na lenye heshima; linaweza kutaja waumini wa kiume au kusanyiko lote bila kuongeza maneno yasiyokuwamo wazi katika Kigiriki.
- source_word: τὸν κόπον ἡμῶν καὶ τὸν μόχθον
  choice: taabu na jasho letu
  rationale: Jozi hii ya Kiswahili huonyesha kazi ngumu pamoja na uchovu na shida zake, huku ikisomeka kwa kawaida.
- source_word: νυκτὸς καὶ ἡμέρας ἐργαζόμενοι
  choice: Tulifanya kazi usiku na mchana
  rationale: Hii huhifadhi wazo la juhudi endelevu na huweka kishiriki cha Kigiriki katika sentensi ya kawaida ya Kiswahili.
- source_word: πρὸς τὸ μὴ ἐπιβαρῆσαί τινα ὑμῶν
  choice: ili tusimlemee yeyote kati yenu
  rationale: “Ili” huonyesha kusudi la muundo wa Kigiriki; “kumlemea” huhifadhi maana pana ya kuwa mzigo wa kifedha au wa kimatendo.
- source_word: ἐκηρύξαμεν εἰς ὑμᾶς
  choice: huku tukiwatangazia
  rationale: “Kutangaza” huhifadhi maana ya kutoa ujumbe hadharani, na “huku” huonyesha kwamba kutangaza kulifanyika sambamba na kufanya kazi.
- source_word: τὸ εὐαγγέλιον τοῦ θεοῦ
  choice: Injili ya Mungu
  rationale: Ni usemi wa kawaida wa Kikristo katika Kiswahili na huhifadhi hali ya umilikishi yenye uwezekano wa kumaanisha chanzo, milki, au maudhui bila kuifafanua kupita kiasi.
theological_decisions:
- issue: Ujumuishi wa ἀδελφοί
  choice: ndugu katika matini kuu
  alternative: ndugu wanaume na wanawake
  rationale: “Ndugu” huhifadhi namna ya moja kwa moja ya mwito na kwa Kiswahili inaweza kulihusu kusanyiko lote. Tanbihi inaweka wazi uwezekano huo bila kupanua matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo umegawanywa katika sentensi mbili ili kutoa mtiririko wa asili bila kupoteza uhusiano wa kimantiki wa Kigiriki.
