  yaml_path: translation/nt/1_thessalonians/003/002.yaml
  text: and we sent Timothy[a], our brother and God's fellow worker in the gospel of the Messiah, to strengthen you and to encourage you concerning your faith[b],
translation:
  language: sw
  text: Nasi tulimtuma Timotheo, ndugu yetu na mfanyakazi mwenza wa Mungu[a] katika injili ya Masihi[b], ili awaimarishe na awatie moyo kuhusu imani yenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mfanyakazi pamoja na Mungu.” Baadhi ya hati za kale zina usomaji tofauti hapa, kama vile “mtumishi wa Mungu.”
    reason: alternative_reading
  - marker: b
    text: Kigiriki “Kristo”; hapa limetafsiriwa “Masihi” kwa sababu maana ya cheo inaonekana wazi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέμψαμεν
  choice: tukamtuma
  rationale: Kauli ya wakati uliopita inasimuliwa kwa kitenzi cha kawaida cha Kiswahili; kiambishi cha yambwa -m- humrejelea Timotheo kwa njia ya asili.
- source_word: Τιμόθεον
  choice: Timotheo
  rationale: Hili ndilo umbo la kawaida la jina hili katika Biblia za Kiswahili.
- source_word: ἀδελφὸν ἡμῶν
  choice: ndugu yetu
  rationale: Huhifadhi taswira ya kifamilia ya Kigiriki na uhusiano wa waamini bila kuongeza ufafanuzi usio katika matini.
- source_word: συνεργὸν τοῦ θεοῦ
  choice: mfanyakazi mwenza wa Mungu
  rationale: Huhifadhi usemi wenye nguvu wa matini ya SBLGNT na uhusiano unaoonyeshwa na genitivi bila kuupunguza kuwa 'mtumishi.'
- source_word: ἐν τῷ εὐαγγελίῳ τοῦ Χριστοῦ
  choice: katika injili ya Masihi
  rationale: ‘Katika’ huonyesha eneo au shughuli ya kazi; ‘ya Masihi’ huhifadhi utata wa genitivi bila kuamua kimya kimya kama injili inamhusu Masihi au inatoka kwake.
- source_word: Χριστοῦ
  choice: Masihi
  rationale: Hapa Χριστός ina nguvu ya cheo; ‘Masihi’ huwasilisha maana hiyo moja kwa moja katika Kiswahili.
- source_word: εἰς τὸ στηρίξαι
  choice: ili awaimarishe
  rationale: Muundo wa εἰς pamoja na kitenzi-jina unaonyesha kusudi; ‘ili’ ni muundo wa kawaida na wazi wa Kiswahili.
- source_word: παρακαλέσαι
  choice: kuwatia moyo
  rationale: Katika muktadha wa kuwasaidia waamini chini ya shinikizo, usemi huu unawasilisha maana ya kuhimiza na kuwatia nguvu bila kuibana kuwa faraja pekee.
- source_word: ὑπὲρ τῆς πίστεως ὑμῶν
  choice: kuhusu imani yenu
  rationale: Huhifadhi maana inayowezekana ya ὑπέρ kama ‘kuhusu’; uwezekano wa ‘kwa ajili ya’ umeonyeshwa katika tanbihi.
- source_word: πίστεως
  choice: imani
  rationale: Katika muktadha huu neno linarejelea kumwamini Mungu na kusimama katika imani, hivyo ‘imani’ ndiyo tafsiri ya kawaida na pana.
theological_decisions:
- issue: Tafsiri ya συνεργὸν τοῦ θεοῦ
  choice: mfanyakazi mwenza wa Mungu
  alternative: mfanyakazi pamoja na Mungu; mtumishi wa Mungu
  rationale: Matini ya SBLGNT ina συνεργὸν τοῦ θεοῦ, usemi ambao haupaswi kudhoofishwa kwa sababu ya mvutano wake wa kiteolojia. Tanbihi inaonyesha uwezekano wa kisintaksia na tofauti za nakala.
- issue: Tafsiri ya Χριστοῦ katika εὐαγγελίῳ τοῦ Χριστοῦ
  choice: Masihi
  alternative: Kristo
  rationale: Katika kirai hiki neno linaonekana kufanya kazi kama cheo. ‘Masihi’ huonyesha maana hiyo; ‘Kristo’ limetolewa katika tanbihi kama umbo la mapokeo linalojulikana.
- issue: Maana ya ὑπὲρ τῆς πίστεως ὑμῶν
  choice: kuhusu imani yenu
  alternative: kwa ajili ya imani yenu
  rationale: Ὑπέρ pamoja na genitivi inaweza kueleza jambo linalohusika au manufaa/kusudi. Matini kuu inatumia maana inayofaa kwa kutia moyo, huku tanbihi ikihifadhi uwezekano mwingine.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inafuata mtiririko wa kawaida wa Kiswahili huku ikihifadhi uratibu na mvutano wa matini ya Kigiriki. Viashirio vyote vya tanbihi vimewekwa baada ya kirai husika kwa pamoja mwishoni mwa aya.
