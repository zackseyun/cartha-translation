source:
  edition: SBLGNT
  text: διὰ τοῦτο παρεκλήθημεν, ἀδελφοί, ἐφ’ ὑμῖν ἐπὶ πάσῃ τῇ ⸂ἀνάγκῃ καὶ θλίψει⸃ ἡμῶν διὰ τῆς ὑμῶν πίστεως,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/007.yaml
  text: For this reason[a], brothers, concerning you, in all our distress and affliction[b], we were comforted through your faith.
translation:
  language: sw
  text: Kwa sababu hiyo, ndugu[a], tulifarijiwa kuhusu ninyi katika taabu na dhiki zetu zote, kwa njia ya imani yenu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ndugu” ni namna ya kawaida ya Paulo ya kuliita kusanyiko, na hapa inaweza kuwahusisha waamini wote.
    reason: cultural_note
  - marker: b
    text: Au “uaminifu wenu.” Neno la Kigiriki pistis linaweza kumaanisha imani, tumaini, au uaminifu; hapa huenda linahusisha pia uthabiti wao katika kuendelea kuamini.
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Kwa sababu hiyo
  rationale: Inaunganisha mstari huu na habari iliyotangulia kwa kuonyesha sababu, kama ilivyo katika Kigiriki.
- source_word: παρεκλήθημεν
  choice: tulipata faraja
  rationale: Katika muktadha huu kitenzi kinaeleza kutiwa moyo na kufarijiwa baada ya habari ya Timotheo; usemi huu ni wa kawaida na wa asili katika Kiswahili.
- source_word: ἀδελφοί
  choice: ndugu
  rationale: Neno hili la kawaida la Kiswahili linafaa kama namna ya Paulo ya kuliita kusanyiko na linaweza kuwahusisha waamini wote bila kulazimisha jinsia katika tafsiri.
- source_word: ἐφ’ ὑμῖν
  choice: kuhusu ninyi
  rationale: Inaonyesha kwamba Wathesalonike ndio waliokuwa habari au jambo lililowaletea faraja Paulo na wenzake, bila kudokeza kuwa wao ndio waliosababisha taabu hizo.
- source_word: ἐπὶ πάσῃ τῇ ἀνάγκῃ καὶ θλίψει ἡμῶν
  choice: katikati ya taabu na dhiki zetu zote
  rationale: Inaonyesha mazingira ya shinikizo na mateso ambamo faraja ilipatikana, huku ikihifadhi nomino zote mbili za Kigiriki.
- source_word: ἀνάγκῃ
  choice: taabu
  rationale: Hapa neno linamaanisha hali ngumu au shinikizo, si lazima au uhitaji kwa maana finyu.
- source_word: θλίψει
  choice: dhiki
  rationale: Ni neno la Kiswahili linalofaa kwa mateso, shinikizo, au hali ya kuonewa inayodokezwa na θλῖψις.
- source_word: διὰ τῆς ὑμῶν πίστεως
  choice: kwa imani yenu
  rationale: Muundo huu unaonyesha imani yao kuwa njia au msingi wa faraja, kwa Kiswahili cha asili na kifupi.
- source_word: πίστεως
  choice: imani
  rationale: Hii ndiyo maana ya msingi hapa, ingawa katika muktadha imani hiyo pia inahusisha kudumu kwa uthabiti; uwezekano huo umehifadhiwa katika tanbihi.
theological_decisions:
- issue: Maana ya πίστις katika muktadha unaoweza kusisitiza uthabiti
  choice: imani
  alternative: uaminifu
  rationale: Paulo anarejelea kuendelea kwa Wathesalonike kuamini, jambo linalohusisha pia uthabiti. Tafsiri kuu inahifadhi maana ya kawaida ya 'imani,' na tanbihi inaonyesha maana nyingine inayowezekana bila kuamua zaidi ya ushahidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Mpangilio unaweka “kuhusu ninyi” karibu na taarifa ya faraja ili isieleweke kuwa Wathesalonike ndio chanzo cha taabu na dhiki.
