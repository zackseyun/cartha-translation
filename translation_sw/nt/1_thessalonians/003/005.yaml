  text: διὰ τοῦτο κἀγὼ μηκέτι στέγων ἔπεμψα εἰς τὸ γνῶναι τὴν πίστιν ὑμῶν, μή πως ἐπείρασεν ὑμᾶς ὁ πειράζων καὶ εἰς κενὸν γένηται ὁ κόπος ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/005.yaml
  text: For this reason[a], when I could bear it no longer, I sent to learn about your faith[b], lest somehow the tempter had tempted you and our labor might be in vain.
translation:
  language: sw
  text: Kwa sababu hiyo, nami, niliposhindwa kuvumilia tena, nilituma ili nipate kujua habari za imani yenu,[a] nisije nikakuta kwamba kwa namna fulani mjaribu amewajaribu na taabu yetu ikawa bure.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uaminifu wenu.” Neno la Kigiriki linaweza pia kudokeza imani kwa maana ya kumtumaini, kulingana na muktadha.
    reason: alternative_reading
  - marker: b
    text: Yaani, taabu yetu isizae matunda au isiwe na manufaa.
    reason: lexical_clarification
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Kwa sababu hiyo
  rationale: Inaonyesha sababu inayorejelea maelezo yaliyotangulia kwa Kiswahili cha kawaida na wazi.
- source_word: κἀγὼ
  choice: mimi pia
  rationale: Huwakilisha wazi καί pamoja na msisitizo wa kiwakilishi ἐγώ, bila kuifanya sentensi kuwa nzito.
- source_word: μηκέτι στέγων
  choice: nilipokuwa siwezi kuvumilia tena
  rationale: Ni usemi wa asili unaoonyesha kwamba uwezo wa kuendelea kustahimili ulikuwa umefikia kikomo.
- source_word: ἔπεμψα
  choice: nilituma mtu
  rationale: Kitenzi cha Kigiriki hakitaji mtumwa ndani ya mstari huu; 'mtu' huweka yambwa bila kumtaja Timotheo moja kwa moja kutoka muktadha.
- source_word: εἰς τὸ γνῶναι τὴν πίστιν ὑμῶν
  choice: ili nijue hali ya imani yenu
  rationale: '''Hali ya'' huleta kwa Kiswahili maana ya kuchunguza jinsi imani yao ilivyokuwa, bila kubadili πίστις kuwa dhana nyingine.'
- source_word: μή πως
  choice: nisije nikakuta kwamba kwa namna fulani
  rationale: Huwasilisha hofu au wasiwasi uliomo katika kishazi cha Kigiriki kwa lugha ya Kiswahili inayoeleweka.
- source_word: ἐπείρασεν ὑμᾶς ὁ πειράζων
  choice: mjaribu alikuwa amewajaribu
  rationale: Hudumisha urudiaji wa mzizi kati ya tendo la kujaribu na yule anayejaribu, pamoja na mtazamo wa tendo linalohofiwa kuwa lilikuwa limetokea.
- source_word: εἰς κενὸν γένηται ὁ κόπος ἡμῶν
  choice: taabu yetu ikawa bure
  rationale: '''Taabu'' huhifadhi wazo la kazi yenye uchovu katika κόπος, na ''ikawa bure'' ni Kiswahili cha asili kwa kazi kutofikia kusudi lake.'
theological_decisions:
- issue: Maana ya πίστις katika τὴν πίστιν ὑμῶν
  choice: imani yenu
  alternative: uaminifu wenu; tumaini lenu
  rationale: '''Imani'' ndiyo maana inayofaa zaidi katika muktadha wa kuendelea kuitikia Injili, lakini neno la Kigiriki linaweza kujumuisha vivuli vya kuamini au kuwa mwaminifu; uwezekano huo umehifadhiwa katika tanbihi.'
- issue: Utambulisho wa ὁ πειράζων
  choice: mjaribu
  alternative: yule anayejaribu; Shetani
  rationale: Maandishi yanatumia jina la maelezo badala ya jina maalumu. 'Mjaribu' huhifadhi namna hiyo ya usemi bila kumwingiza 'Shetani' moja kwa moja katika matini.
- issue: Uhusiano wa vitenzi baada ya μή πως
  choice: alikuwa amewajaribu ... ikawa bure
  alternative: huenda akawa amewajaribu ... taabu yetu ikawa bure
  rationale: Muundo unaonyesha hofu ya Paulo kwamba jaribu huenda tayari lilitokea na kwamba matokeo yake yangesababisha kazi yao kuwa bure; tafsiri haithibitishi kuwa hilo lilitokea.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Sentensi imehifadhi wasiwasi wa Paulo na urudiaji wa 'mjaribu ... amewajaribu.' Alama zote za tanbihi zimewekwa katika matini kuu.
