  text: night and day praying most earnestly to see your face and to supply what is lacking in your faith,[a]
translation:
  language: sw
  text: Usiku na mchana tunaomba kwa bidii kubwa sana ili tuweze kuwaona ana kwa ana na kuziba mapungufu katika imani yenu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kile kinachokosekana katika imani yenu.” Maneno ya Kigiriki yanaweza pia kueleweka kwa upana zaidi kuwa kuimarisha au kukamilisha yale ambayo bado yanahitaji kuongezewa katika imani yenu.
    reason: lexical_alternative
lexical_decisions:
- source_word: νυκτὸς καὶ ἡμέρας
  choice: Usiku na mchana
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha tendo la kuendelea au kurudiwa mara kwa mara.
- source_word: ὑπερεκπερισσοῦ
  choice: kwa bidii sana
  rationale: Huwasilisha nguvu ya kielezi hiki cha kusisitiza kwa Kiswahili cha asili bila kuwa kizito.
- source_word: δεόμενοι
  choice: tunaomba
  rationale: Ingawa umbo la Kigiriki ni participio, muktadha wa sentensi pana unaruhusu kitenzi hiki kutolewa kwa umbo la kawaida la Kiswahili; maana yake ni kutoa dua au ombi la dhati.
- source_word: εἰς τὸ ἰδεῖν
  choice: ili tuwaone
  rationale: Muundo huu unaonyesha kusudi; “ili” huweka kusudi hilo wazi na kwa lugha ya kawaida.
- source_word: ὑμῶν τὸ πρόσωπον
  choice: tuwaone uso kwa uso
  rationale: Badala ya tafsiri ngumu ya neno kwa neno “kuona uso wenu,” usemi huu wa Kiswahili huhifadhi picha ya uso na maana ya kukutana binafsi.
- source_word: καταρτίσαι
  choice: kukamilisha
  rationale: Kitenzi kina wigo wa kuweka sawa, kurekebisha, kuandaa, au kukamilisha. Hapa “kukamilisha” kinaendana na mambo yanayopungua huku tanbihi ikihifadhi wigo mpana.
- source_word: τὰ ὑστερήματα
  choice: yale yanayopungua
  rationale: Huwakilisha wingi wa Kigiriki na kueleza mambo ambayo bado hayajatimia au yanahitaji kuongezewa.
- source_word: τῆς πίστεως ὑμῶν
  choice: katika imani yenu
  rationale: “Imani” ndiyo maana inayofaa zaidi hapa, na “katika” huonyesha maeneo ya imani yanayohitaji kuimarishwa bila kudokeza kwamba hawana imani kabisa.
theological_decisions:
- issue: Maana ya πίστις
  choice: imani
  alternative: uaminifu; tumaini/kuamini
  rationale: Katika muktadha huu neno linahusu imani au kumtumaini Mungu ambako bado kunahitaji kuimarishwa, si hasa mwenendo wa uaminifu.
- issue: Nguvu ya καταρτίσαι pamoja na τὰ ὑστερήματα
  choice: kukamilisha yale yanayopungua
  alternative: kuongeza yaliyo pungufu; kuimarisha yale ambayo bado ni dhaifu
  rationale: Tafsiri kuu huhifadhi wazo la upungufu na ukamilishaji, huku tanbihi ikikubali kwamba maneno hayo yanaweza kueleweka kwa upana kama kuimarisha au kutimiza kinachohitajika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Uso kwa uso” ni cha asili kuliko “kuona uso wenu” na huhifadhi maana ya kukutana binafsi. Alama ya tanbihi [a] imewekwa katika matini kuu.
