lexical_decisions:
- source_word: Διὸ
  choice: Kwa hiyo
  rationale: Inaonyesha hitimisho linalotokana na habari iliyotangulia na ni kiunganishi cha kawaida katika Kiswahili cha sasa.
- source_word: μηκέτι στέγοντες
  choice: tuliposhindwa kuvumilia zaidi
  rationale: Muundo huu unaeleza kufikia kikomo cha kustahimili hali ya wasiwasi; tafsiri hii ni ya kawaida na inahifadhi maana ya kutoweza kuendelea kuvumilia.
- source_word: εὐδοκήσαμεν
  choice: tuliona ni vyema
  rationale: Kitenzi kinaweza kuonyesha kuridhia, kuwa tayari, au kufanya uamuzi unaoonekana mwema. Chaguo hili linahifadhi wazo la uamuzi wa hiari bila kulifanya kuwa furaha ya kihisia.
- source_word: καταλειφθῆναι
  choice: kuachwa
  rationale: Inahifadhi hali tendwa ya kitenzi cha Kigiriki; neno linalolingana na 'nyuma' halihitajiki ili maana ieleweke.
- source_word: ἐν Ἀθήναις
  choice: huko Athene
  rationale: Ni usemi wa mahali ulio wa kawaida kwa jina la mji katika Kiswahili.
- source_word: μόνοι
  choice: peke yetu
  rationale: Inahifadhi wingi wa kisarufi na kueleza kwamba wasemaji waliachwa bila wale waliokuwa pamoja nao.
theological_decisions:
- issue: Rejeleo la nafsi ya kwanza wingi na mvutano wake na muktadha mpana
  choice: Kudumisha wingi katika “tuliposhindwa,” “tuliona,” na “peke yetu.”
  alternative: Kutafsiri kwa umoja, kama “niliona ni vyema nibaki peke yangu,” kwa kudhani kwamba Paulo anajirejelea tu.
  rationale: Nakala ya Kigiriki ina maumbo ya wingi, εὐδοκήσαμεν na μόνοι. Tafsiri haipaswi kuamua kama huu ni wingi wa kiuandishi au unawahusu washiriki kadhaa wa kundi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Tuliona ni vyema” ni cha asili zaidi kuliko tafsiri sisisi ya kupendezwa, huku “kuachwa peke yetu” kikihifadhi hali tendwa na wingi wa maandishi ya Kigiriki.
