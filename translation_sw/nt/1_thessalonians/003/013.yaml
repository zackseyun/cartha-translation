source:
  edition: SBLGNT
  text: εἰς τὸ στηρίξαι ὑμῶν τὰς καρδίας ἀμέμπτους ἐν ἁγιωσύνῃ ἔμπροσθεν τοῦ θεοῦ καὶ πατρὸς ἡμῶν ἐν τῇ παρουσίᾳ τοῦ κυρίου ἡμῶν ⸀Ἰησοῦ μετὰ πάντων τῶν ἁγίων ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/013.yaml
  text: so that he may establish your hearts blameless in holiness before our God and Father at the coming of our Lord Jesus with all his holy ones[a].
translation:
  language: sw
  text: ili aimarishe mioyo yenu, isiwe na lawama katika utakatifu mbele za Mungu wetu na Baba yetu, wakati Bwana wetu Yesu atakapokuja pamoja na watakatifu wake wote[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “pamoja na wote walio watakatifu kwake.” Neno la Kigiriki linalotafsiriwa “watakatifu” linaweza kurejelea watu watakatifu, malaika, au wote wawili katika muktadha huu.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰς τὸ στηρίξαι
  choice: ili aifanye ... kuwa thabiti
  rationale: Muundo huu unaonyesha kusudi au matokeo yanayotokana na mstari uliotangulia, huku ukitoa maana ya kuimarisha na kufanya kuwa imara kwa Kiswahili cha kawaida.
- source_word: καρδίας
  choice: mioyo
  rationale: “Mioyo” huhifadhi taswira ya asili na hapa humaanisha utu wa ndani, si hisia peke yake.
- source_word: ἀμέμπτους
  choice: isiyo na lawama
  rationale: Usemi huu unaonyesha hali ya kutokuwa na sababu halali ya kulaumiwa na unaeleweka kwa urahisi.
- source_word: ἐν ἁγιωσύνῃ
  choice: katika utakatifu
  rationale: Huhifadhi utakatifu kama hali au sifa bila kuugeuza kuwa tendo pekee.
- source_word: ἔμπροσθεν
  choice: mbele za
  rationale: Hutoa maana ya kusimama machoni au katika uwepo wa Mungu kwa lugha ya kawaida ya Kiswahili.
- source_word: τοῦ θεοῦ καὶ πατρὸς ἡμῶν
  choice: Mungu wetu na Baba yetu
  rationale: Huhifadhi vyeo vyote viwili vikimrejelea yuleyule na kuonyesha uhusiano wake nasi.
- source_word: παρουσίᾳ
  choice: wakati wa kuja
  rationale: Katika muktadha huu wa wakati ujao, neno linarejelea kuwasili au kuja kwa Bwana.
- source_word: κυρίου ἡμῶν Ἰησοῦ
  choice: Bwana wetu Yesu
  rationale: Hufuata namna ya kawaida ya kutaja cheo na jina katika Kiswahili cha Agano Jipya.
- source_word: μετὰ πάντων τῶν ἁγίων αὐτοῦ
  choice: pamoja na wale wote walio watakatifu wake
  rationale: Usemi huu mpana huepuka kuamua kimya-kimya kama wanaorejelewa ni watu watakatifu, malaika, au wote wawili.
theological_decisions:
- issue: Wanaorejelewa na πάντων τῶν ἁγίων αὐτοῦ
  choice: wale wote walio watakatifu wake
  alternative: watakatifu wake wote; malaika wake wote
  rationale: Neno la Kigiriki ἅγιοι halibainishi hapa ikiwa ni waamini waliotukuzwa, malaika, au makundi yote mawili. Tafsiri kuu inadumisha upana huo, na tanbihi inaueleza.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo “wale wote walio watakatifu wake” umechaguliwa ili kuhifadhi utata halisi wa rejeleo.
