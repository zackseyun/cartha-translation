  yaml_path: translation/nt/1_thessalonians/003/011.yaml
  text: May our God and Father himself[a], and our Lord Jesus[b], direct our way to you.
translation:
  language: sw
  text: Mungu na Baba yetu mwenyewe[a], na Bwana wetu Yesu, ainyoshe njia yetu ya kuja kwenu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki kinatumia kitenzi cha umoja katika ombi hili ingawa wahusika waliounganishwa ni “Mungu na Baba yetu” na “Bwana wetu Yesu.”
    reason: cross_reference
  - marker: b
    text: Au, “aifanye njia yetu ya kuja kwenu iwe nyoofu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτὸς
  choice: mwenyewe
  rationale: Huhifadhi msisitizo wa αὐτός kwamba Mungu na Baba ndiye binafsi anayelengwa katika ombi.
- source_word: δὲ
  choice: haijatafsiriwa kwa neno maalumu
  rationale: Hapa δέ ni kiunganishi hafifu cha mpito. Kiswahili cha sasa hakihitaji kuongeza “sasa” au “lakini,” ambavyo vingetia maana ya wakati au upinzani isiyokusudiwa.
- source_word: ὁ θεὸς καὶ πατὴρ ἡμῶν
  choice: Mungu na Baba yetu
  rationale: Huwaunganisha majina yote mawili yakimtaja mhusika mmoja na kufuata kwa karibu mpangilio wa Kigiriki.
- source_word: ὁ κύριος ἡμῶν Ἰησοῦς
  choice: Bwana wetu Yesu
  rationale: Huhifadhi cheo κύριος, kiwakilishi cha umilikaji ἡμῶν, na jina Ἰησοῦς bila kuongeza “Kristo,” ambalo halimo katika kifungu hiki.
- source_word: κατευθύναι
  choice: na ainyoshe
  rationale: Optative ya aoristi inaonyesha ombi au tamanio. “Ainyoshe” huhifadhi taswira ya kufanya njia iwe nyoofu na, katika muktadha, maana ya kufungua au kuelekeza safari.
- source_word: τὴν ὁδὸν ἡμῶν
  choice: njia yetu ya kuja
  rationale: “Njia yetu” huhifadhi taswira ya ὁδός, huku “ya kuja” ikifanya mwelekeo wa safari kuelekea kwa wasomaji uwe wa kawaida na wazi kwa Kiswahili.
- source_word: πρὸς ὑμᾶς
  choice: kwenu
  rationale: Hutoa kwa kawaida mwelekeo wa πρός pamoja na accusative kuelekea kwa waamini wa Thesalonike.
theological_decisions:
- issue: 'Kitenzi cha umoja pamoja na wahusika wawili walioratibiwa: “Mungu na Baba yetu” na “Bwana wetu Yesu”'
  choice: Wahusika wote wawili wametajwa wazi, kisha ombi moja la umoja “na ainyoshe” limetumiwa.
  alternative: Kutumia muundo wa wingi “na wainyoshe,” au kuunda sentensi upya ili kitenzi kionekane kumhusu Mungu peke yake.
  rationale: Kigiriki kinawaweka Baba na Bwana Yesu pamoja kama wahusika wa kitenzi kimoja cha umoja. Muundo wa Kiswahili umehifadhi hali hiyo isiyo ya kawaida na uzito wake wa kiteolojia bila kuifafanua zaidi ya andiko.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo “pamoja na” unaonyesha kuwa Mungu na Baba yetu na Bwana wetu Yesu ni wahusika walioratibiwa, huku kitenzi cha umoja kikihifadhi sifa muhimu ya sarufi ya Kigiriki.
