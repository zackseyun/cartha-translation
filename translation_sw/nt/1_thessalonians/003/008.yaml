  text: For now we live[b][a], if you stand firm in the Lord.
translation:
  language: sw
  text: Kwa maana[b] sasa tunaishi[a], ikiwa mnasimama imara katika Bwana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Tunaishi” huenda ni usemi wa balagha unaomaanisha kwamba Paulo na wenzake wamepata moyo au nguvu mpya, wala si kwamba wanasema tu kuhusu kuendelea kuwa hai kimwili.
    reason: lexical_alternative
  - marker: b
    text: Kiunganishi cha mwanzo kinaweza pia kueleweka “kwa sababu”; katika Kiswahili maana hiyo inaweza pia kuachwa idokezwe na muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Kwa maana
  rationale: Katika muktadha, kiunganishi hiki kinaeleza sababu au msingi wa faraja iliyotajwa kabla; “kwa maana” ni ya kawaida na huhifadhi nguvu hiyo ya ufafanuzi.
- source_word: νῦν
  choice: sasa
  rationale: Neno la wakati limetafsiriwa moja kwa moja ili kusisitiza hali ya sasa ya Paulo na wenzake.
- source_word: ζῶμεν
  choice: tunaishi
  rationale: Tafsiri ya moja kwa moja inahifadhi usemi wa Paulo wenye nguvu ya balagha bila kuufafanua kupita kiasi kuwa furaha, faraja, au uhai wa kimwili pekee.
- source_word: ἐὰν
  choice: ikiwa
  rationale: Huhifadhi muundo wa sharti wa Kigiriki kwa lugha ya Kiswahili iliyo wazi na yenye hadhi.
- source_word: ὑμεῖς
  choice: mna-
  rationale: Nafsi ya pili wingi imeonyeshwa katika kitenzi cha Kiswahili; inawalenga waumini wa Thesalonike bila kulazimisha msisitizo wa ziada kwa kutumia “ninyi.”
- source_word: στήκετε
  choice: mnasimama imara
  rationale: Huwasilisha hali inayoendelea ya kuwa thabiti na ni usemi wa asili wa Kiswahili kwa ustahimilivu katika imani.
- source_word: ἐν κυρίῳ
  choice: katika Bwana
  rationale: Huhifadhi usemi mpana wa Paulo kuhusu kudumu ndani ya uhusiano au eneo la Bwana bila kuubana kuwa fundisho maalumu.
theological_decisions:
- issue: Nguvu ya usemi “sasa tunaishi”
  choice: Usemi halisi umehifadhiwa huku ukieleweka katika muktadha kuwa wa balagha kuhusu kupata moyo na nguvu mpya.
  alternative: “Sasa tumepata uhai mpya” au dai la karibu kuwa maisha yao ya kimwili yanawategemea Wathesalonike.
  rationale: Kigiriki kinasema moja kwa moja “tunaishi,” lakini muktadha unaonyesha nguvu ya kichungaji na kihisia. Kutunza usemi huo huacha mvutano wake bila kuufafanua kupita kiasi.
- issue: Maana ya “katika Bwana”
  choice: Kudumu imara ndani ya uhusiano na Bwana, huku upana wa usemi ukihifadhiwa.
  alternative: “katika umoja na Bwana” au “waaminifu kwa Bwana.”
  rationale: “Katika Bwana” ni usemi mpana wa Paulo wenye maana nyingi za kiteolojia; tafsiri hii haubani kuwa msimamo wa dhehebu fulani.
- issue: Sharti linaloletwa na ἐὰν
  choice: Muundo wa sharti umehifadhiwa kwa “ikiwa.”
  alternative: 'Kuufanya usemi wa uhakika: “kwa kuwa mnasimama imara.”'
  rationale: Muundo wa Kigiriki ni wa sharti, na ni muhimu kutougeuza kimya kimya kuwa taarifa ya sababu iliyotimia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa sasa, wenye hadhi na unaoeleweka kwa msomaji wa kawaida. “Mnasimama imara” ni wa asili kuliko muundo mzito zaidi, huku “katika Bwana” ikihifadhi nahau ya Paulo.
