id: 1TH.3.12
reference: 1 Thessalonians 3:12
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὑμᾶς δὲ ὁ κύριος πλεονάσαι καὶ περισσεύσαι τῇ ἀγάπῃ εἰς ἀλλήλους καὶ εἰς πάντας, καθάπερ καὶ ἡμεῖς εἰς ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/012.yaml
  text: And may the Lord cause you to increase and abound in love for one another and for all[a], just as we also do for you[b],
translation:
  language: sw
  text: Bwana awafanye muongezeke na kufurika katika upendo kwa ninyi kwa ninyi na kwa wote[a], kama vile sisi pia tunavyowapenda ninyi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuelekeana na kuelekea wote.”
    reason: lexical_alternative
  - marker: b
    text: Kishazi cha mwisho katika Kigiriki kina kitenzi kilichodondoshwa; kwa maana ya moja kwa moja ni, “kama vile sisi pia kwenu.” Maana yake huchukuliwa kutoka kishazi kilichotangulia.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ κύριος
  choice: Bwana
  rationale: Huhifadhi cheo cha kawaida cha κύριος bila kubainisha katika tafsiri kama kinamrejelea Kristo hasa au Mungu kwa ujumla.
- source_word: πλεονάσαι
  choice: awafanye muongezeke
  rationale: Kauli ya kutakia katika Kigiriki ina Bwana kama mtendaji na ‘ninyi’ kama waathiriwa; muundo huu wa Kiswahili unaonyesha maana hiyo ya kusababisha ongezeko.
- source_word: περισσεύσαι
  choice: na kuzidi sana
  rationale: Hutofautisha kitenzi hiki na πλεονάσαι na kuhifadhi msisitizo wa wingi mkubwa kwa Kiswahili cha kawaida.
- source_word: τῇ ἀγάπῃ
  choice: katika upendo
  rationale: Dativi inaonyesha eneo au jambo ambamo ongezeko linatokea; ‘katika upendo’ ni wazi na hudumisha neno la msingi ‘upendo.’
- source_word: εἰς ἀλλήλους
  choice: kwa ninyi kwa ninyi
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha upendo unaoelekezwa kwa kila mmoja ndani ya jumuiya.
- source_word: καὶ εἰς πάντας
  choice: na kwa wote
  rationale: Huhifadhi upana usiobainishwa wa πάντας bila kuufinya kuwa waamini pekee au kuupanua kwa ufafanuzi kuwa watu wote.
- source_word: καθάπερ καὶ ἡμεῖς εἰς ὑμᾶς
  choice: kama vile sisi pia tulivyo kwenu
  rationale: Huhifadhi kadiri iwezekanavyo udondoshaji wa maneno katika Kigiriki; ‘tulivyo’ hurejeza wazo la kuwa na upendo mwingi bila kulirudia lote.
- source_word: δὲ
  choice: na
  rationale: Hapa δέ ni kiunganishi cha mpito mwororo katika ombi, si utofautishaji mkali.
theological_decisions:
- issue: Mrejelewa wa ‘Bwana’
  choice: Cheo ‘Bwana’ kimeachwa bila ufafanuzi zaidi.
  alternative: Kumtaja Kristo waziwazi, au kusema Mungu.
  rationale: κύριος pekee yake haikulazimishi tafsiri kupanua jina la mrejelewa; hivyo utata halisi wa kifungu unahifadhiwa.
- issue: Upeo wa πάντας
  choice: ‘wote’ limeachwa pana.
  alternative: ‘watu wote’ au ‘waamini wote.’
  rationale: Ingawa muktadha unaweza kudokeza upendo unaovuka jumuiya ya waamini, neno la Kigiriki lenyewe halibainishi kundi; tafsiri hailifinyi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa kutakia ‘na awafanye’ unaendana na ombi la Paulo; jozi ‘muongezeke na kuzidi sana’ huhifadhi vitenzi viwili na msisitizo wake bila kutumia lugha nzito.
