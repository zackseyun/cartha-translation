  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἄρτι δὲ ἐλθόντος Τιμοθέου πρὸς ἡμᾶς ἀφ’ ὑμῶν καὶ εὐαγγελισαμένου ἡμῖν τὴν πίστιν καὶ τὴν ἀγάπην ὑμῶν, καὶ ὅτι ἔχετε μνείαν ἡμῶν ἀγαθὴν πάντοτε ἐπιποθοῦντες ἡμᾶς ἰδεῖν καθάπερ καὶ ἡμεῖς ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/006.yaml
  text: But now that Timothy has come to us from you and has brought us the good news of your faith and love[a], and that you always have a good remembrance of us, longing to see us just as we also long to see you,
translation:
  language: sw
  text: Lakini sasa Timotheo amekuja kwetu kutoka kwenu na ametuletea habari njema kuhusu imani yenu na upendo wenu[a], na kwamba sikuzote mnatukumbuka kwa wema na mnatamani sana kutuona, kama sisi pia tunavyotamani kuwaona ninyi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “uaminifu wenu.” Neno la Kigiriki pistis linaweza kumaanisha imani, tumaini, au uaminifu; maandishi makuu yametumia “imani.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἄρτι
  choice: sasa
  rationale: Huonyesha hatua ya sasa katika simulizi na ujio wa karibuni wa Timotheo; “sasa” ni ya kawaida na huunganisha vizuri na mabadiliko kutoka wasiwasi kwenda faraja.
- source_word: δὲ
  choice: Lakini
  rationale: Huonyesha badiliko lenye tofauti ndogo na hali ya wasiwasi iliyotajwa kabla.
- source_word: ἐλθόντος Τιμοθέου πρὸς ἡμᾶς ἀφ’ ὑμῶν
  choice: Timotheo amerudi kwetu kutoka kwenu
  rationale: Muundo wa genitive absolute umegeuzwa kuwa kishazi kamili cha Kiswahili. “Amerudi” huonyesha kwa kawaida kwamba Timotheo alitumwa na Paulo kisha akaja tena kwake kutoka kwa Wathesalonike.
- source_word: εὐαγγελισαμένου
  choice: kutuletea habari njema
  rationale: Katika muktadha huu kitenzi kinamaanisha kutoa taarifa nzuri, huku “habari njema” kikihifadhi mwangwi wa kawaida wa lugha ya injili bila kudai kwamba Timotheo alikuwa akiwahubiria Paulo na wenzake.
- source_word: τὴν πίστιν
  choice: imani
  rationale: “Imani” ndilo chaguo la msingi kwa πίστις na hapa linaelekea kumaanisha kuendelea kwao kumwamini Mungu; maana inayowezekana ya uaminifu imehifadhiwa katika tanbihi.
- source_word: τὴν ἀγάπην
  choice: upendo
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja ya ἀγάπη katika muktadha huu.
- source_word: μνείαν ἡμῶν ἀγαθὴν
  choice: mnatukumbuka kwa wema
  rationale: Hutoa Kiswahili cha asili kwa wazo la kuwa na kumbukumbu au fikira njema kuhusu Paulo na wenzake, bila kulifanya kuwa dai kuhusu kuwataja katika sala.
- source_word: πάντοτε
  choice: sikuzote
  rationale: Huwasilisha maana ya kuendelea ya πάντοτε kwa Kiswahili cha kawaida.
- source_word: ἐπιποθοῦντες ἡμᾶς ἰδεῖν
  choice: mnatamani sana kutuona
  rationale: “Mnatamani sana” huhifadhi nguvu na hisia ya hamu iliyomo katika ἐπιποθέω.
- source_word: καθάπερ καὶ ἡμεῖς ὑμᾶς
  choice: kama vile sisi pia tunavyotamani kuwaona ninyi
  rationale: Kitenzi kilichoachwa kueleweka katika Kigiriki kimerudiwa kwa uwazi wa Kiswahili, huku ulinganisho wa pande zote ukihifadhiwa.
theological_decisions:
- issue: Maana ya πίστις ambapo “imani” na “uaminifu” zote zinawezekana
  choice: imani yenu
  alternative: uaminifu wenu
  rationale: Muktadha unaelekea kurejelea kuendelea kwa Wathesalonike katika kumwamini Mungu na habari njema, lakini πίστις pia linaweza kubeba dhana ya uthabiti au uaminifu; hivyo maana hiyo haijaondolewa bali imewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imegawanywa kwa mtiririko wa kawaida wa Kiswahili, lakini mahusiano yote ya kishazi katika Kigiriki yamehifadhiwa. “Pia ametueleza” limewekwa wazi kama kiunganishi cha taarifa ya pili iliyobebwa na καὶ ὅτι.
