  to: Lakini sasa Timotheo amekuja kwetu kutoka kwenu na ametuletea habari njema kuhusu imani yenu na upendo wenu[a], na kwamba sikuzote mnatukumbuka kwa wema na mnatamani sana kutuona, kama sisi pia tunavyotamani kuwaona ninyi.
