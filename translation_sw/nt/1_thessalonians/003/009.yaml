  text: τίνα γὰρ εὐχαριστίαν δυνάμεθα τῷ θεῷ ἀνταποδοῦναι περὶ ὑμῶν ἐπὶ πάσῃ τῇ χαρᾷ ᾗ χαίρομεν δι’ ὑμᾶς ἔμπροσθεν τοῦ θεοῦ ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/009.yaml
  text: For what thanksgiving can we repay to God concerning you[a], for all the joy with which we rejoice because of you before our God,
translation:
  language: sw
  text: Kwa maana, ni shukrani gani tunaweza kumrudishia Mungu kuwahusu ninyi[a], kwa ajili ya furaha yote tunayoifurahia kwa sababu yenu mbele za Mungu wetu?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa usemi wa kawaida zaidi, “Tunawezaje kumshukuru Mungu vya kutosha kuwahusu ninyi...?” Kigiriki, kwa tafsiri ya karibu zaidi, kinasema, “Ni shukrani gani tunaweza kumrudishia Mungu kuwahusu ninyi...?”
    reason: lexical_alternative
lexical_decisions:
- source_word: τίνα ... εὐχαριστίαν
  choice: ni shukrani gani
  rationale: Huhifadhi swali la balagha na umbo la nomino, huku likionyesha kutotosha kwa shukrani zao.
- source_word: δυνάμεθα
  choice: tunayoweza
  rationale: Ni Kiswahili cha kawaida kinachohifadhi maana ya uwezo katika swali la balagha.
- source_word: ἀνταποδοῦναι
  choice: kumrudishia
  rationale: Huhifadhi wazo la kutoa kitu kwa kuitikia au kwa malipo, bila kudokeza kwamba Mungu ana deni linaloweza kulipwa kihalisi.
- source_word: περὶ ὑμῶν
  choice: kwa ajili yenu
  rationale: Katika muktadha wa kumshukuru Mungu, usemi huu ni wa asili na unaonyesha kwamba wao ndio sababu au mada ya shukrani.
- source_word: ἐπὶ πάσῃ τῇ χαρᾷ
  choice: kwa sababu ya furaha yote
  rationale: Huwakilisha msingi au sababu ya shukrani kwa Kiswahili cha wazi.
- source_word: ᾗ χαίρομεν
  choice: tunayofurahi
  rationale: Huhifadhi mwangwi wa maneno ya asili kati ya nomino ‘furaha’ na kitenzi ‘kufurahi’.
- source_word: δι’ ὑμᾶς
  choice: kwa ajili yenu
  rationale: Hutoa maana ya kisababishi ya διά pamoja na accusative kwa usemi wa kawaida wa Kiswahili; muktadha huonyesha kuwa wao ndio chanzo cha furaha.
- source_word: ἔμπροσθεν τοῦ θεοῦ ἡμῶν
  choice: mbele za Mungu wetu
  rationale: Huhifadhi sitiari ya mahali inayomaanisha kuwapo mbele ya Mungu, kwa usemi wa kibiblia unaoeleweka na wenye heshima.
theological_decisions:
- issue: Nguvu ya balagha ya kumrudishia Mungu shukrani
  choice: Kuhifadhi sitiari ya ‘kumrudishia’ katika swali la balagha
  alternative: ‘Tunawezaje kumshukuru Mungu vya kutosha kwa ajili yenu?’
  rationale: Kitenzi ἀνταποδοῦναι kina maana ya kutoa kwa kurudisha au kuitikia. Swali la balagha linaonyesha kutotosha kwa shukrani zao, si kwamba wanaweza kumlipa Mungu kwa muamala.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Tafsiri inadumisha swali moja la balagha, urudiaji wa ‘furaha/tunayofurahi,’ na sitiari ya kumrudishia Mungu shukrani. Alama ya tanbihi [a] imewekwa katika matini.
