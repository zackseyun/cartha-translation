  yaml_path: translation/nt/1_thessalonians/003/003.yaml
  text: so that no one would be shaken by these afflictions[c][b][a]. For you yourselves know that we are appointed for this.
translation:
  language: sw
  text: ili mtu yeyote asitikiswe[a] na dhiki hizi[b]. Kwa maana ninyi wenyewe mnajua kwamba tumewekwa kwa ajili ya haya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “asifadhaishwe” au “asivurugwe.” Kitenzi hiki adimu kinaweza pia kumaanisha “adanganywe” au “ashawishwe kwa maneno ya kubembeleza” katika miktadha mingine.
    reason: lexical_alternative
  - marker: b
    text: Au “mateso haya.”
    reason: lexical_alternative
  - marker: c
    text: Au “tumepangiwa haya” au “tumekusudiwa haya.”
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ μηδένα σαίνεσθαι
  choice: ili mtu yeyote asitikiswe
  rationale: Muundo wa nomino-kitenzi wenye τὸ unaonyesha kusudi au matokeo yanayoungana na mstari uliotangulia. Kitenzi adimu σαίνεσθαι hapa kinaelekea kumaanisha kutikiswa, kufadhaishwa, au kuvurugwa na mateso; “asitikiswe” ni ya kawaida, fupi, na inafaa katika muktadha wa kichungaji.
- source_word: ἐν ταῖς θλίψεσιν ταύταις
  choice: na dhiki hizi
  rationale: θλῖψις huonyesha dhiki, shinikizo, au mateso. Ingawa ἐν kwa kawaida ni “katika,” pamoja na “asitikisiwe” Kiswahili cha kawaida hutumia “na” kuonyesha kinachosababisha hali hiyo.
- source_word: αὐτοὶ
  choice: ninyi wenyewe
  rationale: Kiwakilishi hiki kina msisitizo; “ninyi wenyewe” kinauhifadhi wazi.
- source_word: γὰρ
  choice: Kwa maana
  rationale: γάρ inatoa msingi au maelezo ya kauli iliyotangulia; “Kwa maana” ni kiunganishi cha kawaida na chenye hadhi.
- source_word: οἴδατε
  choice: mnajua
  rationale: Ingawa οἶδα ina umbo la wakati timilifu, hutumika kwa maana ya wakati wa sasa; “mnajua” ndiyo tafsiri ya kawaida.
- source_word: εἰς τοῦτο
  choice: kuyapata hayo
  rationale: Kiwakilishi hicho kinaelekeza nyuma kwenye dhiki zilizotajwa. Kiswahili kinahitaji uhusiano huo uwe wazi; “hayo” hurejelea mambo hayo bila kuongeza fundisho lisilosemwa.
- source_word: κείμεθα
  choice: tumewekwa
  rationale: κεῖμαι kimsingi ni kuwekwa au kuwa katika hali fulani, na hapa huonyesha kwamba hali hiyo imepangwa au imekusudiwa. “Tumewekwa” huhifadhi picha na hali ya kutendewa bila kusisitiza mno wazo la majaaliwa.
theological_decisions:
- issue: Uhusiano wa waamini na mateso katika εἰς τοῦτο κείμεθα
  choice: tumewekwa kuyapata hayo
  alternative: tumekusudiwa kuyapata hayo; tumeteuliwa kuyapata hayo
  rationale: Kauli inafundisha kwamba dhiki ni sehemu inayotarajiwa katika maisha ya waamini, lakini haielezi kwa undani namna ya uteuzi au majaaliwa. Tafsiri hii huhifadhi uzito wa mpango wa Mungu huku ikiepuka kuingiza mfumo maalumu wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni rahisi kueleweka kwa msomaji wa kawaida; “dhiki” huhifadhi uzito wa lugha ya Paulo, na “ninyi wenyewe” huhifadhi msisitizo wa Kigiriki.
