  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ γὰρ ὅτε πρὸς ὑμᾶς ἦμεν, προελέγομεν ὑμῖν ὅτι μέλλομεν θλίβεσθαι, καθὼς καὶ ἐγένετο καὶ οἴδατε.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/004.yaml
  text: For even when we were with you[a], we kept telling you beforehand that we were going to suffer affliction, just as it also happened, and you know it.
translation:
  language: sw
  text: Kwa maana hata tulipokuwa pamoja nanyi, tuliendelea kuwaambia mapema kwamba tungepatwa na mateso,[a] kama ilivyotokea, nanyi mnajua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “tungeonewa” au “tungepatwa na dhiki.” Kitenzi cha Kigiriki kinaweza kumaanisha kupatwa na shinikizo, taabu, au utesaji.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Kwa maana hata
  rationale: “Kwa maana” linaonyesha uhusiano wa maelezo unaoletwa na γάρ, huku “hata” likihifadhi msisitizo wa καί kwa Kiswahili cha kawaida.
- source_word: ὅτε πρὸς ὑμᾶς ἦμεν
  choice: tulipokuwa pamoja nanyi
  rationale: Kirai hiki humaanisha kuwa mbele yao au katika ushirika nao; “pamoja nanyi” ni cha asili na kinafaa muktadha wa uhusiano.
- source_word: προελέγομεν ὑμῖν
  choice: tuliendelea kuwaambia mapema
  rationale: Wakati usiotimilifu wa kitenzi unaonyesha tendo lililoendelea au kurudiwa, na προ- linaonyesha kwamba walikuwa wakisema jambo hilo kabla halijatokea.
- source_word: ὅτι μέλλομεν θλίβεσθαι
  choice: kwamba tungepatwa na mateso
  rationale: μέλλομεν huonyesha jambo lililokuwa linatarajiwa kutokea; “tungepatwa” hutoa maana hiyo kwa kawaida. “Mateso” linaweza kujumuisha dhiki, taabu, na utesaji bila kulifunga kwa aina moja tu.
- source_word: καθὼς καὶ ἐγένετο
  choice: kama ilivyotokea pia
  rationale: “Kama” linaonyesha ulinganifu kati ya taarifa ya mapema na kutimia kwake, na “pia” linawakilisha καί bila kufanya sentensi kuwa nzito.
- source_word: καὶ οἴδατε
  choice: nanyi mnajua
  rationale: Kigiriki hakitaji yambwa wazi. Kiswahili kinaweza kuliacha jambo linalojulikana lieleweke kutoka muktadha bila kulazimisha kiwakilishi.
theological_decisions:
- issue: Aina ya mateso yanayoelezwa na θλίβεσθαι
  choice: mateso kwa maana pana, yanayoweza kujumuisha utesaji
  alternative: utesaji hasa, au dhiki yenye maana maalumu ya kieskatolojia
  rationale: Muktadha unahusisha upinzani na taabu, lakini kitenzi chenyewe kina wigo mpana wa shinikizo, dhiki, au mateso. Tafsiri haipaswi kuibana iwe utesaji pekee wala kuipa maana maalumu ya kieskatolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Tuliendelea kuwaambia mapema” huhifadhi hali ya tendo la kurudiwa; “tungepatwa na mateso” ni wazi kwa wasomaji wa kawaida huku kikihifadhi upana wa neno la Kigiriki.
