lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Wasalimuni
  rationale: Kitenzi hiki ni agizo la moja kwa moja kwa watu wengi. “Wasalimuni” ni Kiswahili cha kawaida na chenye ufupi kinacholeta maana ya kuwasilisha salamu kwa wengine.
- source_word: ἀδελφοὺς
  choice: ndugu
  rationale: “Ndugu” linaweza kuwakilisha umbo la Kigiriki la wingi na, katika Kiswahili, linaweza pia kutumiwa kwa jumuiya nzima ya waamini bila kulazimisha jinsia ambayo neno lenyewe katika muktadha linaweza kuijumuisha.
- source_word: πάντας
  choice: wote
  rationale: “Wote” linahifadhi msisitizo kwamba hakuna yeyote katika kundi anayepaswa kuachwa bila kusalimiwa.
- source_word: ἐν φιλήματι ἁγίῳ
  choice: kwa busu takatifu
  rationale: “Kwa” linaonyesha namna au ishara ya salamu; “busu” linatafsiri φίλημα moja kwa moja, na “takatifu” linahifadhi sifa ya ἁγίῳ bila kuifafanua kupita kiasi.
theological_decisions:
- issue: Upeo wa ἀδελφοί katika خطاب kwa kusanyiko
  choice: ndugu
  alternative: ndugu wa kiume na wa kike
  rationale: Ingawa umbo la Kigiriki ni la kiume kwa sarufi, linaweza kurejelea jumuiya yote ya waamini. Neno la Kiswahili “ndugu” huhifadhi uhusiano wa kifamilia na utata huu wa kimuktadha; tanbihi inaweka wazi uwezekano wa maana jumuishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, fasaha na chenye heshima. Muundo ni mfupi kama agizo la Kigiriki, huku tanbihi zikihifadhi upeo wa kijinsia wa ἀδελφοί na maelezo ya kitamaduni kuhusu busu takatifu.
