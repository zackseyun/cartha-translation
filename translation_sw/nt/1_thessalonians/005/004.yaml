  text: ὑμεῖς δέ, ἀδελφοί, οὐκ ἐστὲ ἐν σκότει, ἵνα ἡ ἡμέρα ὑμᾶς ὡς ⸀κλέπτης καταλάβῃ,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/004.yaml
  text: But you[a], brothers, are not in darkness[b], so that the day would overtake you like a thief.
translation:
  language: sw
  text: Lakini ninyi, ndugu[a], hamko gizani, hata siku hiyo[b] iwafikie kama mwizi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hapa, “ndugu” inaweza kuwajumuisha waumini wa kiume na wa kike.
    reason: lexical_alternative
  - marker: b
    text: Katika muktadha wa karibu, hii ni siku ya Bwana.
    reason: cross_reference
lexical_decisions:
- source_word: ὑμεῖς δέ
  choice: Lakini ninyi
  rationale: δέ inaonyesha tofauti na watu waliotajwa kabla, na kiwakilishi cha wazi ὑμεῖς kina mkazo; “Lakini ninyi” kinahifadhi yote mawili kwa Kiswahili cha kawaida.
- source_word: ἀδελφοί
  choice: ndugu
  rationale: “Ndugu” ni mwito wa kawaida wa Kiswahili unaoweza kuwahusu waumini wa kiume na wa kike, huku ukidumisha lugha ya uhusiano wa kifamilia.
- source_word: ἐν σκότει
  choice: gizani
  rationale: “Gizani” kinahifadhi taswira ya giza na maana yake ya kiroho katika muktadha bila kuifafanua kupita kiasi.
- source_word: ἵνα
  choice: hata
  rationale: Katika muundo huu hasi, “hamko gizani, hata…” linaonyesha matokeo ambayo hali yao haielekei kuyaleta, bila kulazimisha tofauti kati ya kusudi na matokeo.
- source_word: ἡ ἡμέρα
  choice: siku hiyo
  rationale: Nomino yenye kibainishi inarejelea siku maalumu iliyokwisha tajwa katika muktadha; “siku hiyo” ni ya asili kwa Kiswahili na haiongezi jina kamili katika matini.
- source_word: ὡς κλέπτης
  choice: kama mwizi
  rationale: Hiki ni kilinganishi cha moja kwa moja, cha asili, kinachohifadhi taswira ya kuja kusikotarajiwa.
- source_word: καταλάβῃ
  choice: iwafikie
  rationale: Katika muktadha huu kitenzi kina wazo la kuwapata au kuwafikia kwa ghafula. “Iwafikie” kinahifadhi kitendo cha siku hiyo kuwajia bila kuongeza wazi maneno “kwa kushtukiza.”
theological_decisions:
- issue: Mwito ἀδελφοί kwa kusanyiko lenye wanaume na wanawake
  choice: ndugu
  alternative: ndugu wa kiume na wa kike
  rationale: Kwa Kiswahili, “ndugu” lenyewe hutumika kwa jinsia zote na ni la asili zaidi kuliko kupanua matini. Tanbihi inaweka wazi upeo huo jumuishi.
- issue: Kirejeleo cha kieskatolojia cha ἡ ἡμέρα
  choice: siku hiyo
  alternative: siku ya Bwana
  rationale: Muktadha wa karibu unaonyesha kuwa ni siku ya Bwana, lakini Kigiriki cha mstari huu kinasema tu “siku.” Kwa hiyo matini haiongezi kirai kamili; tanbihi inafafanua kirejeleo chake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo umehifadhi tofauti ya “Lakini ninyi,” taswira za giza na mwizi, na utata mdogo wa ἵνα bila kuwa wa kikale au mgumu.
