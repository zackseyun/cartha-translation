  text: ἡμεῖς δὲ ἡμέρας ὄντες νήφωμεν, ἐνδυσάμενοι θώρακα πίστεως καὶ ἀγάπης καὶ περικεφαλαίαν ἐλπίδα σωτηρίας·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/008.yaml
  text: But since we are of the day[a], let us be sober, having put on the breastplate of faith and love[b], and the hope of salvation as a helmet.
translation:
  language: sw
  text: Lakini sisi tulio wa mchana, tuwe wenye kiasi, tukiwa tumevaa dirii ya imani[a] na upendo, na kofia ya chuma, yaani tumaini la wokovu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uaminifu.” Neno la Kigiriki πίστις linaweza kumaanisha imani, kutumaini, au uaminifu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς δὲ
  choice: Lakini sisi
  rationale: δέ inaonyesha utofautishaji na wale waliotajwa katika muktadha uliotangulia; “Lakini sisi” ni ya kawaida na huhifadhi mkazo wa ἡμεῖς.
- source_word: ἡμέρας ὄντες
  choice: tulio wa mchana
  rationale: Huhifadhi sitiari ya kuwa wa mchana, yaani kuwa katika upande au eneo la mchana, bila kuibadili kuwa maelezo ya wakati tu.
- source_word: νήφωμεν
  choice: tuwe na kiasi
  rationale: Kitenzi kinaweza kumaanisha kutolewa na ulevi au kuwa macho na kujitawala. “Tuwe na kiasi” huhifadhi mwangwi wa kutolewa huku kikieleweka pia kwa maana ya kujitawala.
- source_word: ἐνδυσάμενοι
  choice: tukiwa tumevaa
  rationale: Huwakilisha hali inayoandamana na himizo la kuwa na kiasi na kudumisha picha ya kuvaa silaha.
- source_word: θώρακα
  choice: dirii
  rationale: Ni neno la Kiswahili linalofaa kwa silaha inayokinga kifua na huhifadhi wazi sitiari ya kijeshi.
- source_word: πίστεως
  choice: imani
  rationale: Katika muungano wa imani, upendo na tumaini, “imani” ndiyo maana inayofaa zaidi; uwezekano wa “uaminifu” umehifadhiwa katika tanbihi.
- source_word: ἀγάπης
  choice: upendo
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja ya ἀγάπη katika muktadha wa sifa za Kikristo.
- source_word: περικεφαλαίαν
  choice: kofia ya chuma
  rationale: Ni usemi wa kawaida wa Kiswahili kwa kofia ya kinga ya kijeshi na huendeleza picha ya silaha.
- source_word: ἐλπίδα σωτηρίας
  choice: tumaini la wokovu
  rationale: Huhifadhi uhusiano mpana wa genitivi kati ya tumaini na wokovu bila kuamua kupita kiasi ikiwa wokovu ndio lengo au sifa ya tumaini hilo.
theological_decisions:
- issue: Maana ya πίστις katika sitiari ya dirii
  choice: imani
  alternative: uaminifu
  rationale: Muungano wake na upendo na tumaini unaunga mkono “imani” kama sifa, lakini πίστις pia inaweza kumaanisha “uaminifu”; maana hiyo mbadala imeonyeshwa katika tanbihi.
- issue: Nguvu ya ἡμέρας ὄντες
  choice: tulio wa mchana
  alternative: tunaomilikiwa na mchana
  rationale: Chaguo kuu huhifadhi sitiari na wazo la kuwa upande wa mchana bila kuongeza maelezo ya kitheolojia yasiyotajwa moja kwa moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Dirii” na “kofia ya chuma” zinadumisha sitiari ya kijeshi; muundo wa sentensi umewekwa wa asili bila kuondoa mvutano wa kisemantiki wa νήφωμεν na πίστις.
