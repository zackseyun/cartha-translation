translation:
  language: sw
  text: Kwa hiyo basi, tusilale kama wengine, bali tuwe macho[a] na tuwe na kiasi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “tukeshe” au “tuwe waangalifu.” Kitenzi cha Kigiriki kinaweza kusisitiza kuwa macho au kuwa waangalifu.
    reason: lexical_alternative
  - marker: b
    text: Au, “tuwe timamu” au “tujizuie.” Kitenzi cha Kigiriki kina maana ya kutokuwa mlevi na, kwa upanuzi, kuwa na akili timamu, kuwa makini, na kujitawala.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα οὖν
  choice: Kwa hiyo basi
  rationale: Viunganishi hivi viwili vinaonyesha hitimisho lenye mkazo kutokana na yaliyotangulia. “Kwa hiyo basi” ni Kiswahili cha kawaida kinachohifadhi mpito huo wa kimantiki na wa kuhimiza.
- source_word: μὴ καθεύδωμεν
  choice: tusilale
  rationale: Hii ni kauli ya kuhimiza iliyo katika nafsi ya kwanza wingi pamoja na ukanushaji. “Tusilale” huhifadhi picha ya usingizi, ambayo katika muktadha inatumika kwa maana ya kiroho na kimaadili.
- source_word: ὡς οἱ λοιποί
  choice: kama wengine
  rationale: Kirai hiki kinawarejelea watu wengine walio tofauti na waamini wanaozungumziwa. “Kama wengine” ni wazi na ya kawaida bila kuongeza maelezo yasiyomo katika matini.
- source_word: ἀλλὰ
  choice: bali
  rationale: “Bali” huonyesha kwa uwazi tofauti kati ya kulala na kukesha huku ikifaa kwa mtindo wenye hadhi wa maandiko.
- source_word: γρηγορῶμεν
  choice: tukeshe
  rationale: Kitenzi hiki kinaweza kumaanisha kuwa macho au kuwa mwangalifu. “Tukeshe” huhifadhi upinzani wa moja kwa moja na “tusilale” na pia kinaweza kubeba wazo la kukaa macho kiroho.
- source_word: νήφωμεν
  choice: tuwe na kiasi
  rationale: Kitenzi νήφω humaanisha kutokuwa mlevi na, kwa upanuzi, kuwa timamu, makini, na mwenye kujizuia. “Tuwe na kiasi” huhifadhi wazo la kiasi na kujitawala bila kulifunga katika maana ya kutokunywa pombe pekee.
theological_decisions:
- issue: Maana ya mfano wa kulala na kukesha
  choice: Kuhifadhi picha ya kulala na kukesha katika matini kuu kama himizo la kimaadili na kiroho.
  alternative: Kufafanua moja kwa moja kuwa ni kutojali kiroho dhidi ya kuwa macho na waangalifu.
  rationale: Muktadha unaonyesha tofauti kati ya watu wa nuru na wengine wanaohusishwa na usiku. Kuhifadhi picha hiyo kunadumisha lugha na mvutano wa Paulo bila kuifafanua kupita kiasi.
- issue: Tafsiri ya νήφω
  choice: tuwe na kiasi
  alternative: tuwe timamu; tujizuie
  rationale: Neno hilo linaweza kuhusisha kutolewa ulevini, utimamu wa akili, na kujizuia. “Tuwe na kiasi” ni pana vya kutosha kuhifadhi maana hizi zinazokaribiana bila kuamua kwamba ni amri kuhusu pombe pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “tusilale … bali tukeshe” ni mfupi, wa kawaida, na unahifadhi ulinganifu wa picha katika Kigiriki. Alama zote za tanbihi zimewekwa mara baada ya maneno yanayohusika.
