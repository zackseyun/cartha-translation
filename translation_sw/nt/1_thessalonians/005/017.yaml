lexical_decisions:
- source_word: ἀδιαλείπτως
  choice: bila kukoma
  rationale: Kirai hiki kinaonyesha tendo linaloendelea kwa kudumu na kwa ustahimilivu. ‘Bila kukoma’ ni Kiswahili cha kawaida na chenye nguvu inayolingana na Kigiriki, bila kulazimisha maana ya kusema sala kila sekunde bila mapumziko.
- source_word: προσεύχεσθε
  choice: Ombeni
  rationale: Ni amri ya nafsi ya pili wingi yenye hali ya tendo linaloendelea. ‘Ombeni’ ni ya asili na inahifadhi wito wa moja kwa moja kwa jumuiya; mwendelezo wa tendo unaonyeshwa na ‘bila kukoma.’
theological_decisions:
- issue: Nguvu ya kiutendaji ya amri
  choice: Wito wa jumla wa kudumu na kustahimili katika sala
  alternative: Sharti la kusema sala mfululizo kila wakati bila hata mapumziko
  rationale: Muundo wa amri pamoja na ἀδιαλείπτως unahimiza maisha ya sala yenye kudumu na kurudiwa kwa uaminifu. Tafsiri inahifadhi nguvu na mvutano wa maneno yenyewe bila kuingiza fasiri finyu ya kimadhehebu au ya kiasketiki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, kifupi, cha heshima, na kinachoeleweka kwa urahisi. Wingi wa amri umehifadhiwa katika ‘Ombeni.’
