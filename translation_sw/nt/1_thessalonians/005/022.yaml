  yaml_path: translation/nt/1_thessalonians/005/022.yaml
  text: Abstain from every kind of evil[a].
translation:
  language: sw
  text: Jiepusheni na kila aina ya uovu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kila namna ya uovu”; kwa mapokeo, “kila mwonekano wa uovu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέχεσθε
  choice: Jiepusheni
  rationale: Kitenzi hiki ni amri ya wakati wa sasa kwa wingi, kikitoa wito wa kuendelea kujitenga na jambo. “Jiepusheni” ni Kiswahili cha kawaida na huhifadhi nguvu ya amri pamoja na wazo la kujitenga.
- source_word: ἀπὸ
  choice: na
  rationale: Pamoja na kitenzi “jiepusheni,” kihusishi “na” huonyesha kwa kawaida kitu kinachopaswa kuepukwa au kuwekwa mbali.
- source_word: παντὸς
  choice: kila
  rationale: Kikiwa pamoja na εἴδους, neno hili lina maana ya kila aina moja moja; “kila” ni chaguo la asili na wazi katika Kiswahili.
- source_word: εἴδους
  choice: aina
  rationale: Katika muktadha huu, neno linaelekea kumaanisha aina au namna, wala si mwonekano wa nje tu. “Aina” ni wazi na halileti wazo lisilokusudiwa la kuepuka tu kile kinachoonekana kuwa kiovu.
- source_word: πονηροῦ
  choice: uovu
  rationale: Hapa ni nomino ya sifa katika hali ya kumilikisha inayokamilisha wazo la “aina ya uovu.” “Uovu” ni tafsiri ya moja kwa moja na ya kawaida.
theological_decisions:
- issue: Maana ya εἴδους katika fungu ἀπὸ παντὸς εἴδους πονηροῦ
  choice: kila aina ya uovu
  alternative: kila namna ya uovu; kwa mapokeo, kila mwonekano wa uovu
  rationale: Katika muktadha huu εἶδος yaelekea zaidi kumaanisha aina au namna ya uovu kuliko kitu kinachoonekana tu kuwa kiovu. Tanbihi inadumisha uwazi kuhusu tafsiri mbadala na ile ya kimapokeo bila kuifanya kuwa maana kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa urahisi. Amri ya wingi “Jiepusheni” inafaa kwa hotuba kwa jumuiya nzima.
