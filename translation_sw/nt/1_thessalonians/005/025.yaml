lexical_decisions:
- source_word: Ἀδελφοί
  choice: Ndugu
  rationale: Nomino ya mwito katika wingi. Katika Kiswahili, “ndugu” ni neno la kawaida na la heshima linaloweza kutumiwa kwa waumini wote, wanaume kwa wanawake, huku tanbihi ikifafanua maana yake katika muktadha huu.
- source_word: προσεύχεσθε
  choice: tuombeeni
  rationale: Kitenzi cha amri katika nafsi ya pili wingi. “Tuombeeni” ni ombi la kawaida na la moja kwa moja kwa kusanyiko waombe kwa ajili ya waandishi; hali endelevu inayoweza kudokezwa na wakati wa sasa wa Kigiriki haijahimizwa wazi katika sentensi hii fupi.
- source_word: περὶ ἡμῶν
  choice: tuombeeni
  rationale: Muundo wa Kiswahili wenye kiambishi cha kutendea huwasilisha kwa kawaida maana ya ‘ombeni kwa ajili yetu’ bila kulazimika kutafsiri περί kwa neno tofauti.
theological_decisions:
- issue: Mwito Ἀδελφοί wenye umbo la kiume katika Kigiriki lakini unaoelekezwa kwa kusanyiko lote
  choice: Ndugu
  alternative: Ndugu wanaume na wanawake
  rationale: “Ndugu” katika Kiswahili ni wa asili, wenye heshima, na unaweza kujumuisha waumini wa jinsia zote. Tanbihi inahifadhi ufafanuzi kwamba kusanyiko lote linaelekea kukusudiwa bila kuingiza maelezo marefu katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, kifupi, cha sasa, na chenye heshima. Muundo “tuombeeni” ni wa kawaida zaidi kuliko “ombeni kwa ajili yetu” na unahifadhi maana ya ombi la maombi.
