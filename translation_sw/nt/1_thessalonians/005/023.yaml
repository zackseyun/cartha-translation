id: 1TH.5.23
reference: 1 Thessalonians 5:23
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Αὐτὸς δὲ ὁ θεὸς τῆς εἰρήνης ἁγιάσαι ὑμᾶς ὁλοτελεῖς, καὶ ὁλόκληρον ὑμῶν τὸ πνεῦμα καὶ ἡ ψυχὴ καὶ τὸ σῶμα ἀμέμπτως ἐν τῇ παρουσίᾳ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ τηρηθείη.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/023.yaml
  text: May the God of peace himself sanctify you completely[b][a], and may your whole spirit and soul and body be kept blameless at the coming of our Lord Jesus the Messiah.
translation:
  language: sw
  text: Mungu wa amani mwenyewe awatakase kabisa, na roho yenu yote, nafsi yenu yote, na mwili wenu wote vihifadhiwe bila lawama wakati wa kuja kwa Bwana wetu Yesu Masihi.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Paulo anataja “roho na nafsi na mwili.” Wafafanuzi hutofautiana kuhusu kama maneno haya yanafundisha kuwa mwanadamu ana sehemu tatu, au yanakazia tu mtu mzima.
    reason: lexical_alternative
  - marker: b
    text: Au, kwa namna iliyozoeleka katika tafsiri nyingi, “Bwana wetu Yesu Kristo.”
    reason: alternative_reading
lexical_decisions:
- source_word: Αὐτὸς δὲ
  choice: mwenyewe
  rationale: Αὐτός inamkazia Mungu mwenyewe kuwa mtendaji. δέ inaonyesha mpito wa mawazo, lakini hapa haihitaji neno tofauti kama “sasa”; alama ya nukta mkato inaonyesha kwa kawaida mpito huo katika Kiswahili.
- source_word: ὁ θεὸς τῆς εἰρήνης
  choice: Mungu wa amani
  rationale: Hifadhi ya moja kwa moja na ya kawaida ya jina hili la Paulo, likimweleza Mungu kuwa mwenye kuhusishwa na amani.
- source_word: ἁγιάσαι ὑμᾶς
  choice: na awatakase
  rationale: Optative ya wakati uliopita inaeleza ombi au dua, si taarifa ya jambo lililotokea. “Takasa” huhifadhi uhusiano wa neno hili na utakatifu.
- source_word: ὁλοτελεῖς
  choice: kabisa
  rationale: Neno linaonyesha ukamilifu wa kutakaswa; matumizi ya kielezi ni ya asili katika Kiswahili.
- source_word: ὁλόκληρον
  choice: vyote kwa ukamilifu
  rationale: Hueleza roho, nafsi na mwili kwa pamoja kuwa kamili au salama katika ujumla wake. “Vyote kwa ukamilifu” hutoa maana hiyo ya pamoja bila kufuta vipengele vitatu vilivyotajwa.
- source_word: τὸ πνεῦμα καὶ ἡ ψυχὴ καὶ τὸ σῶμα
  choice: roho yenu na nafsi yenu na mwili wenu
  rationale: Huhifadhi maneno yote matatu na mpangilio wake, bila kuyafanya mfumo rasmi wa kugawa asili ya mwanadamu.
- source_word: ἀμέμπτως
  choice: bila lawama
  rationale: Hutoa hali ambayo waamini wanapaswa kuhifadhiwa nayo kwa Kiswahili cha kawaida na chenye heshima.
- source_word: ἐν τῇ παρουσίᾳ
  choice: wakati wa kuja kwake
  rationale: Katika muktadha huu παρουσία humaanisha kuja au kuwasili kwa Yesu; “wakati wa kuja kwake” ni wazi na ya asili.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesu Masihi
  rationale: Χριστός ni cheo kinacholingana na “Masihi”; Kiswahili hakihitaji kibainishi tofauti sawa na “the” ya Kiingereza.
theological_decisions:
- issue: Kutajwa kwa roho, nafsi na mwili
  choice: Kuhifadhi vipengele vyote vitatu kama vilivyoandikwa, huku “vyote kwa ukamilifu” ikionyesha ujumla wake.
  alternative: Kuvichukulia kama njia ya kimsemo ya kumaanisha mtu mzima, au kama mgawanyo rasmi wa asili ya mwanadamu katika sehemu tatu.
  rationale: Kigiriki kinavitaja wazi roho, nafsi na mwili, lakini hakielezi hapa ikiwa Paulo anafundisha mfumo maalumu wa sehemu tatu. Tafsiri inahifadhi mvutano huo.
- issue: Tafsiri ya Χριστοῦ
  choice: Masihi
  alternative: Kristo
  rationale: Neno la Kigiriki ni cheo chenye maana ya aliyetiwa mafuta. “Masihi” huonyesha cheo hicho, huku umbo la kimapokeo “Kristo” likitajwa katika tanbihi.
- issue: Uhusiano wa utakaso na kuhifadhiwa
  choice: 'Kuhifadhi maombi mawili yanayomwelekea Mungu: atakase na vihifadhiwe.'
  alternative: Kuyafanya kuwa taarifa au amri kwa waamini.
  rationale: Vitenzi vya Kigiriki ni optative na vinaeleza dua ya Paulo; tafsiri haipaswi kubadili dua hiyo kuwa dai au agizo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa dua umehifadhiwa kwa “na awatakase” na “vihifadhiwe.” “Nafsi” imetumiwa ili kutofautisha ψυχή na πνεῦμα, ingawa neno hilo ni la sajili ya kibiblia. Nukta mkato hutenganisha ombi la kutakaswa na ombi la kuhifadhiwa bila kuvunja sentensi.
