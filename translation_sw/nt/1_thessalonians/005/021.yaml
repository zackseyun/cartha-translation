translation:
  language: sw
  text: Lakini yapimeni mambo yote[a]; lishikeni lililo jema.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kila kitu.” Katika muktadha huu, amri hii inahusu hasa kuyatathmini matamko ya kinabii.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: mambo yote
  rationale: Kirai hiki kinawasilisha kwa Kiswahili wigo mpana wa nomino ya Kiyunani iliyo katika wingi wa kijinsia ya kati, bila kuufupisha waziwazi kuwa unabii pekee.
- source_word: δὲ
  choice: Lakini
  rationale: Neno hili linaonyesha badiliko lenye utofautishaji wa kiasi kutoka maagizo yaliyotangulia; “Lakini” ni la kawaida na linafaa katika muktadha huu.
- source_word: δοκιμάζετε
  choice: yapimeni
  rationale: Kitenzi hiki cha amri kinamaanisha kuchunguza ili kutambua uhalisi au thamani. “Yapimeni” ni lugha ya sasa, inayoeleweka, na hubeba maana ya tathmini badala ya kukubali bila uchunguzi.
- source_word: τὸ καλὸν
  choice: lililo jema
  rationale: Kivumishi cha umoja kilichotumiwa kama nomino kinatafsiriwa kwa kawaida kuwa kitu au jambo lililo jema, bila kukifanya dhana ya kifalsafa.
- source_word: κατέχετε
  choice: shikamaneni na
  rationale: Hii inaonyesha kushikilia kwa uthabiti na kuendelea kufuata kile kilichothibitishwa kuwa chema, kuliko neno hafifu kama “hifadhi.”
theological_decisions:
- issue: Wigo wa πάντα katika muktadha wa unabii na utambuzi
  choice: Imetafsiriwa kwa upana kuwa “mambo yote,” huku tanbihi ikionyesha kwamba muktadha wa karibu unahusisha hasa kuyatathmini matamko ya kinabii.
  alternative: “unabii wote” au “mambo yote yanayosemwa”
  rationale: Ingawa mstari wa 20 unataja unabii, Kiyunani hapa hakina nomino inayoweka kikomo hicho. Tafsiri inahifadhi upana wa maneno yenyewe na kuacha muktadha uongoze matumizi yake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye hadhi na inayoeleweka kwa wasomaji wa kawaida. “Yapimeni” na “shikamaneni” huhifadhi mtiririko wa amri mbili na nguvu ya kuendelea kutenda.
