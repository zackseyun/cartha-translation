  text: Kwa hiyo, tianeni moyo[a] na kujengana, kama vile mnavyofanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “farijianeni” au “himizaneni”; neno la Kigiriki lililotafsiriwa “tianeni moyo” linaweza kuwa na maana ya kutia moyo, kufariji, au kuhimiza kulingana na muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: Kwa hiyo
  rationale: Inaonyesha hitimisho linalotokana na hoja iliyotangulia na ni kiunganishi cha kawaida katika Kiswahili cha sasa.
- source_word: παρακαλεῖτε
  choice: farijianeni
  rationale: Katika muktadha huu wa kuimarishana, neno hili linaweza kuhusisha kutiana moyo, kufariji, au kuhimizana. “Farijianeni” linaendana pia na matumizi ya karibu katika 4:18, huku tanbihi ikihifadhi maana mbadala ya kuhimiza.
- source_word: ἀλλήλους
  choice: -aneni (katika “farijianeni”)
  rationale: Kiambishi cha kutendeana -ana kinaonyesha kwa njia ya kawaida kwamba tendo linafanywa na kila mmoja kwa mwenzake.
- source_word: οἰκοδομεῖτε
  choice: kujengana
  rationale: Linahifadhi sitiari ya ujenzi iliyomo katika Kigiriki na kueleza tendo la kuimarishana kiroho bila kutumia lugha nzito isiyo ya kawaida.
- source_word: εἷς τὸν ἕνα
  choice: -ana (katika “kujengana”)
  rationale: Muundo wa kutendeana unawasilisha maana ya kila mmoja kumjenga mwenzake kwa Kiswahili cha kawaida.
- source_word: καθὼς καὶ ποιεῖτε
  choice: kama vile mnavyofanya sasa
  rationale: Linahifadhi ulinganisho na pongezi kwamba tayari wanaendelea kufanya jambo hilo; “sasa” huweka wazi hali ya tendo linaloendelea katika muktadha.
theological_decisions:
- issue: Upana wa maana ya παρακαλεῖτε
  choice: farijianeni
  alternative: tianeni moyo; himizaneni
  rationale: Kigiriki hakilazimishi maana moja nyembamba. Muktadha unaruhusu faraja na himizo, hivyo maana mbadala imehifadhiwa katika tanbihi badala ya kutatua mvutano huo kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Vitenzi vya kutendeana vinaonyesha kwa njia ya asili msisitizo wa Kigiriki juu ya kila mmoja kumtendea mwenzake.
