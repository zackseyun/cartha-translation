base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/007.yaml
  text: For those who sleep, sleep at night, and those who get drunk, get drunk at night.
translation:
  language: sw
  text: Kwa maana wale wanaolala hulala usiku, na wale wanaolewa hulewa usiku.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γὰρ
  choice: Kwa maana
  rationale: Inaonyesha kuwa sentensi hii inatoa sababu au maelezo ya himizo lililotangulia, kwa Kiswahili cha kawaida na chenye heshima.
- source_word: οἱ καθεύδοντες ... καθεύδουσιν
  choice: wale wanaolala hulala
  rationale: Kirai cha kisifa chenye kibainishi kimetafsiriwa kwa maana ya jumla, huku kurudiwa kwa kitenzi 'kulala' kukihifadhi usambamba wa kimantiki na wa balagha wa Kigiriki.
- source_word: νυκτός
  choice: usiku
  rationale: Hapa umbo la umilikaji linafanya kazi kama kielezi cha wakati; 'usiku' ni tafsiri fupi na ya asili katika Kiswahili.
- source_word: οἱ μεθυσκόμενοι ... μεθύουσιν
  choice: wale wanaolewa hulewa
  rationale: '''Kulewa'' huwasilisha kuingia au kuwa katika hali ya ulevi. Kurudia mzizi huo kunahifadhi usambamba wa asili na kishazi cha kulala.'
- source_word: καί
  choice: na
  rationale: Kiunganishi rahisi kinachounganisha vishazi viwili vinavyolingana.
theological_decisions:
- issue: Iwapo kulala na kulewa vitafsiriwe kihalisi au kama mafumbo ya hali ya kiroho
  choice: Kuhifadhi picha halisi za 'kulala' na 'kulewa' katika matini
  alternative: Kuzifafanua moja kwa moja kuwa kutokuwa macho kiroho na kuishi bila kiasi
  rationale: Katika muktadha, Paulo anatumia tabia zinazohusishwa na usiku kueleza himizo la kiroho. Tafsiri halisi huhifadhi mfano wenyewe bila kuingiza ufafanuzi ndani ya matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi na chenye heshima. Usambamba wa vishazi viwili na marudio ya vitenzi umehifadhiwa.
