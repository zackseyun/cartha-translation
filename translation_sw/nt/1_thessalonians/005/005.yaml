  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: πάντες ⸀γὰρ ὑμεῖς υἱοὶ φωτός ἐστε καὶ υἱοὶ ἡμέρας. οὐκ ἐσμὲν νυκτὸς οὐδὲ σκότους·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/005.yaml
  text: For you are all sons of light and sons of day[a]. We are not of night or of darkness.
translation:
  language: sw
  text: Kwa maana ninyi nyote ni wana wa nuru na wana wa mchana.[a] Sisi si wa usiku wala wa giza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Wana wa nuru” na “wana wa mchana” ni nahau zinazomaanisha watu wenye sifa ya nuru na mchana au walio upande wake; hapa “wana” inawajumuisha waamini wote.
    reason: Ufafanuzi wa nahau na wigo wa kijinsia wa υἱοί.
lexical_decisions:
- source_word: πάντες
  choice: nyote
  rationale: Imewekwa pamoja na “ninyi” kuwa “ninyi nyote,” ili kuhifadhi msisitizo unaowajumuisha wote kwa Kiswahili cha kawaida.
- source_word: γάρ
  choice: Kwa maana
  rationale: Inahifadhi kiunganishi cha maelezo kinachohusisha kauli hii na hoja iliyotangulia.
- source_word: υἱοὶ
  choice: wana
  rationale: “Wana” hudumisha sitiari ya kifamilia ya Kigiriki bila kuwabagua waamini wa kike; katika muktadha huu ina maana ya watu walio na sifa ya kitu fulani au walio upande wake.
- source_word: φωτός
  choice: nuru
  rationale: Inahifadhi sitiari ya nuru na ulinganifu wake na giza.
- source_word: ἡμέρας
  choice: mchana
  rationale: “Mchana” huonyesha kipindi chenye nuru na hutofautiana kwa kawaida na “usiku”; hapa ni ya asili zaidi kuliko “siku” katika jozi hii ya kisitiari.
- source_word: οὐκ ἐσμὲν
  choice: Sisi si
  rationale: Inahifadhi mabadiliko ya nafsi kutoka “ninyi” katika sehemu ya kwanza kwenda nafsi ya kwanza wingi, ambayo inamjumuisha Paulo pamoja na wenzake na waamini.
- source_word: νυκτός
  choice: wa usiku
  rationale: Muundo “si wa usiku” hudumisha wazo la kuwa upande wa usiku au kuwa na tabia yake bila kuongeza ufafanuzi katika matini.
- source_word: σκότους
  choice: wa giza
  rationale: Inahifadhi tofauti kuu ya kisitiari kati ya nuru na giza na inalingana kimuundo na “wa usiku.”
theological_decisions:
- issue: Sitiari ya kifamilia yenye umbo la kiume katika υἱοὶ φωτός / υἱοὶ ἡμέρας
  choice: wana wa nuru na wana wa mchana
  alternative: watoto wa nuru na watoto wa mchana
  rationale: Kigiriki kinatumia υἱοί, “wana,” kama nahau ya watu wenye sifa ya kitu au walio upande wake. Kiswahili “wana” huhifadhi sitiari hiyo na katika wingi kinaweza kuwajumuisha waamini wote; tanbihi inaeleza maana yake ili kuepusha dhana kwamba wanaume pekee ndio wanaokusudiwa.
- issue: Mabadiliko kutoka nafsi ya pili kwenda nafsi ya kwanza wingi
  choice: ninyi nyote ... Sisi si ...
  alternative: ninyi nyote ... Ninyi si ...
  rationale: Matini ya Kigiriki hubadilika kwa makusudi kutoka kuwataja Wathesalonike moja kwa moja hadi kumjumuisha mwandishi na wenzake. Mabadiliko hayo yamehifadhiwa badala ya kusawazishwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo wa kishairi wa nuru/mchana dhidi ya usiku/giza na mabadiliko ya “ninyi” kwenda “sisi” umehifadhiwa.
