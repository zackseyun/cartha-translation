  text: Faithful is the one who calls you[a], who also will do it.
translation:
  language: sw
  text: Anayewaita ni mwaminifu; naye pia atafanya hivyo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Anayewaita ni wa kuaminika; naye pia atafanya hivyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστὸς
  choice: mwaminifu
  rationale: Kivumishi hiki kinaeleza kutegemeka kwa Mungu. “Mwaminifu” ni neno la kawaida, lenye heshima, na linalofaa katika muktadha huu.
- source_word: ὁ καλῶν
  choice: anayewaita
  rationale: Muundo huu unamhusu Mungu kama yule anayewaita waamini. Wakati wa sasa wa kitenzi umehifadhiwa kwa “anayewaita,” na kiambishi -wa- kinaonyesha kwamba ὑμᾶς ni wingi.
- source_word: ὑμᾶς
  choice: -wa- katika “anayewaita”
  rationale: Kiwakilishi hiki ni cha nafsi ya pili wingi; Kiswahili huonyesha maana hiyo ndani ya kitenzi.
- source_word: ὃς
  choice: naye
  rationale: “Naye” linaunganisha kishazi cha pili kwa njia ya asili ya Kiswahili huku likidumisha kwamba yule anayewaita ndiye atakayetenda.
- source_word: καὶ
  choice: pia
  rationale: “Pia” hudumisha msisitizo wa kwamba Mungu si mwitaji tu, bali ndiye pia atakayetimiza jambo hilo.
- source_word: ποιήσει
  choice: atafanya hivyo
  rationale: Kitenzi ni kipana, yaani “kufanya/kutimiza.” “Atafanya hivyo” ni cha asili katika Kiswahili na hurejelea kwa ufupi kazi iliyotajwa katika mstari uliotangulia bila kuibainisha kupita kiasi.
theological_decisions:
- issue: Yambwa isiyotajwa ya ποιήσει
  choice: atafanya hivyo
  alternative: atalitimiza
  rationale: Kigiriki hakitaji yambwa moja kwa moja. Muktadha wa mstari wa 23 unaelekeza kwenye kazi ya Mungu ya kuwatakasa na kuwahifadhi. “Atafanya hivyo” hudumisha ufupi na kutobainishwa kwa yambwa katika Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mpangilio umefanywa wa asili kwa Kiswahili bila kupoteza msisitizo wa uaminifu wa Mungu au hali ya yambwa ambayo haikutajwa wazi katika Kigiriki.
