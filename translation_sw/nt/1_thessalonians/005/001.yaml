  text: Kuhusu nyakati na majira[a], ndugu[b], hamna haja ya kuandikiwa chochote,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Nyakati na majira” ni usemi wenye maneno mawili unaohusu vipindi vya wakati na nyakati maalumu, hasa katika muktadha wa mambo yajayo.
