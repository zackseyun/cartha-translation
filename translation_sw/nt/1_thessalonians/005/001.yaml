lexical_decisions:
- source_word: Περὶ δὲ
  choice: Kuhusu
  rationale: Περὶ hutambulisha mada, na δέ huonyesha mpito katika mazungumzo. “Kuhusu” ni ya kawaida na haiongezi wazo la wakati ambalo halijasemwa wazi katika Kigiriki.
- source_word: τῶν χρόνων καὶ τῶν καιρῶν
  choice: nyakati na majira
  rationale: “Nyakati” huwakilisha χρόνοι, yaani vipindi vya wakati, na “majira” huwakilisha καιροί, yaani nyakati maalumu au zinazofaa. Jozi hii inadumisha tofauti iliyopo katika Kigiriki bila kuifafanua kupita kiasi.
- source_word: ἀδελφοί
  choice: ndugu
  rationale: “Ndugu” ni neno la kawaida na lenye heshima kwa waamini wenzao; katika Kiswahili linaweza kulihusu kusanyiko lote bila kulazimisha jinsia ambayo muktadha wa Kigiriki huenda haukusudii kuwatenga wengine.
- source_word: οὐ χρείαν ἔχετε
  choice: hamna haja
  rationale: Hii ni tafsiri ya asili ya nahau ya Kigiriki inayoonyesha kutokuwapo kwa ulazima.
- source_word: ὑμῖν γράφεσθαι
  choice: kuandikiwa
  rationale: Muundo wa kutendwa katika Kigiriki unaacha mwandishi bila kutajwa. “Kuandikiwa” huhifadhi hali hiyo na huingiza kiwakilishi cha wapokeaji kwa njia ya kawaida ya Kiswahili.
- source_word: γράφεσθαι
  choice: kuandikiwa chochote
  rationale: “Chochote” hukamilisha kwa kawaida katika Kiswahili wazo la kutokuwa na haja ya jambo kuandikwa, bila kumtaja mwandishi ambaye Kigiriki hakumtaji.
theological_decisions:
- issue: Maana ya nyakati na majira katika muktadha wa mambo yajayo
  choice: nyakati na majira
  alternative: vipindi na nyakati zilizowekwa
  rationale: Tafsiri inadumisha jozi ya maneno ya Kigiriki na mvutano wake wa kimaana badala ya kuamua kimbele kwamba kila καιρός ni wakati uliowekwa na Mungu.
- issue: Wanaohusishwa na neno ἀδελφοί
  choice: ndugu
  alternative: ndugu wa kiume
  rationale: Ingawa umbo la Kigiriki ni wingi wa kiume, katika barua hii linaelekea kulihusu kusanyiko lote la waamini. Neno la Kiswahili “ndugu” linaweza kuhifadhi lugha ya kifamilia na maana jumuishi ya muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na rahisi kusomeka. Muundo wa sentensi unabaki wazi kuelekea mstari unaofuata, kama ulivyo katika chanzo.
