  source_fidelity: “Msiyadharau maneno ya kinabii” accurately conveys the second-person plural present prohibition μὴ ἐξουθενεῖτε and represents προφητείας as plural prophetic speech. It retains the force of contemptuous disregard rather than reducing it to mere refusal.
