  text: προφητείας μὴ ἐξουθενεῖτε·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/020.yaml
  text: Do not despise prophecies[a].
translation:
  language: sw
  text: Msiyadharau maneno ya kinabii.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “unabii.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προφητείας
  choice: maneno ya kinabii
  rationale: Nomino hii iko katika wingi na hapa inaelekea kurejelea matamko au jumbe za kinabii, si dhana ya unabii kwa ujumla. “Maneno ya kinabii” ni Kiswahili cha kawaida kinachohifadhi wingi na muktadha wa usemi.
- source_word: μὴ
  choice: Msi-
  rationale: 'Pamoja na amri ya nafsi ya pili wingi, kiambishi hiki kinatoa katazo la kawaida: “msi-,” bila kuongeza mkazo usiokuwapo kama “kamwe.”'
- source_word: ἐξουθενεῖτε
  choice: yadharau
  rationale: Kitenzi kina maana ya kuyaona kuwa hayana thamani au kuyatendea kwa dharau. “Dharau” huhifadhi nguvu hiyo vizuri kuliko “kataa,” ambalo ni finyu zaidi.
theological_decisions:
- issue: Maana ya προφητείας katika kusanyiko la Wakristo wa kwanza
  choice: maneno ya kinabii
  alternative: unabii; jumbe zinazodaiwa kutoka kwa Mungu
  rationale: Tafsiri inahifadhi maana pana ya matamko ya kinabii bila kuyafungamanisha na utaratibu maalumu au msimamo wa kimadhehebu kuhusu kuendelea au kukoma kwa karama hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, kifupi na chenye staha. Muundo wa wingi umehifadhiwa, na katazo limeelekezwa kwa wasomaji wengi kama ilivyo katika Kigiriki.
