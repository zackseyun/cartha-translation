  text: The grace of our Lord Jesus Christ be with you[a].
translation:
  language: sw
  text: Neema ya Bwana wetu Yesu Kristo iwe nanyi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χάρις
  choice: neema
  rationale: Katika baraka za kufunga nyaraka za Paulo, χάρις humaanisha fadhili ya Mungu inayotolewa kwa ukarimu; “neema” ndiyo istilahi ya kawaida, sahihi, na yenye uzito wa kitheolojia katika Kiswahili.
- source_word: κυρίου
  choice: Bwana
  rationale: Κύριος hapa ni cheo cha Yesu; “Bwana” huhifadhi maana na uzito wake wa kitheolojia kwa Kiswahili cha kawaida.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesu Kristo
  rationale: “Yesu” ni umbo la kawaida la jina katika Kiswahili, na “Kristo” ni istilahi iliyokita mizizi kwa Χριστός katika fomula hii ya Kikristo. Ingawa asili yake ni cheo chenye maana ya Masihi, hapa muungano “Yesu Kristo” una tabia ya jina-cheo lililozoeleka.
- source_word: μεθ’ ὑμῶν
  choice: iwe nanyi
  rationale: Kigiriki kina kishazi kisicho na kitenzi, kihalisi “pamoja nanyi.” Kiswahili huongeza “iwe” kwa kawaida ili kutoa baraka au ombi, huku “nanyi” kikihifadhi wingi wa ὑμῶν.
theological_decisions:
- issue: Jinsi ya kutafsiri Χριστοῦ katika fomula ya mwisho ya Paulo
  choice: Kristo
  alternative: Masihi
  rationale: Katika “Bwana wetu Yesu Kristo,” neno hilo linafanya kazi ndani ya fomula iliyokita mizizi na kwa kiasi kikubwa kama jina-cheo. “Kristo” ni la asili zaidi kwa wasomaji wa Kiswahili bila kufuta historia yake ya kimasihi; “Masihi” lingeweza kusisitiza zaidi cheo kuliko matumizi ya muktadha huu yanavyodai.
- issue: Aina ya baraka katika kishazi kisicho na kitenzi
  choice: iwe nanyi
  alternative: na iwe nanyi / na iwe pamoja nanyi
  rationale: Kigiriki hakina kitenzi kilichoandikwa, lakini kinaeleweka kama baraka. Kuongeza “iwe” ni ukamilishaji wa lazima na wa kawaida katika Kiswahili, bila kugeuza baraka kuwa dai la taarifa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya ibada lakini kinachoeleweka kwa urahisi. Sentensi ni fupi na ya kawaida kwa baraka ya kufunga waraka. Hakuna tanbihi iliyoongezwa kwa kuwa ushahidi wa SBLGNT uliotolewa una ὑμῶν, na tanbihi ya Kiingereza iliyorudia sentensi ileile haitoi tofauti halisi ya kutafsiri.
