translation:
  language: sw
  text: na kuwastahi sana mno katika upendo kwa sababu ya kazi yao.[a] Ishini kwa amani ninyi kwa ninyi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuwathamini kwa kiwango cha juu kabisa katika upendo.” Kielezi cha Kigiriki kina mkazo mkubwa usio wa kawaida.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡγεῖσθαι
  choice: kuwastahi
  rationale: Katika muktadha huu kitenzi kina maana ya kuwathamini au kuwaona kuwa wenye heshima, si kuwaongoza. “Kuwastahi” ni lugha ya kawaida yenye hadhi na inaonyesha tathmini chanya.
- source_word: ὑπερεκπερισσοῦ
  choice: sana
  rationale: Kielezi hiki ni cha mkazo usio wa kawaida. “Sana” huleta Kiswahili cha asili; uzito wake wa pekee unaelezwa katika tanbihi bila kutumia tungo nzito isiyo ya kawaida.
- source_word: ἐν ἀγάπῃ
  choice: katika upendo
  rationale: Huhifadhi neno kuu ἀγάπη na muundo wa namna ambayo waamini wanapaswa kuwastahi watu hao.
- source_word: διὰ τὸ ἔργον αὐτῶν
  choice: kwa sababu ya kazi yao
  rationale: διά pamoja na hali ya accusative inaonyesha sababu au msingi wa kuwastahi; tafsiri hii pia huhifadhi nomino halisi “kazi.”
- source_word: εἰρηνεύετε
  choice: Ishini kwa amani
  rationale: Amri ya wakati uliopo inahimiza hali na mwenendo unaoendelea. “Ishini kwa amani” ni ya kawaida na huonyesha jambo la kudumu kuliko wazo la hisia ya muda mfupi.
- source_word: ἐν ἑαυτοῖς
  choice: ninyi kwa ninyi
  rationale: Katika muktadha huu kiwakilishi cha kujirejelea kwa wingi kinahusu amani ndani ya jumuiya. Usemi huu ni wa asili katika Kiswahili na unaweka wazi uhusiano wa pamoja.
- source_word: καὶ
  choice: na
  rationale: Kiunganishi kinaendeleza himizo la mstari uliotangulia; “na” huhifadhi mtiririko huo.
- source_word: αὐτούς
  choice: wa- katika “kuwastahi”
  rationale: Kiwakilishi kinawarejelea wale wanaofanya kazi, kuongoza, na kuonya katika mstari uliotangulia; kiambishi cha yambwa “wa-” ndicho umbo la kawaida la Kiswahili.
