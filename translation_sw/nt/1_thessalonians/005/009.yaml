  yaml_path: translation/nt/1_thessalonians/005/009.yaml
  text: For God did not appoint us for wrath[a], but for obtaining salvation through our Lord Jesus the Messiah[b],
translation:
  language: sw
  text: Kwa maana Mungu hakututeua kwa ajili ya ghadhabu, bali kwa ajili ya kupata wokovu[a] kwa njia ya Bwana wetu Yesu Masihi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa ajili ya kumiliki wokovu,” “kwa ajili ya kujipatia wokovu,” au huenda “kwa ajili ya uhifadhi kwa wokovu.” Neno la Kigiriki περιποίησις lina maana pana kuliko “kupata” pekee.
    reason: lexical_alternative
  - marker: b
    text: Kwa tafsiri ya jadi, “kwa njia ya Bwana wetu Yesu Kristo.” Neno la Kigiriki Χριστός limetafsiriwa hapa “Masihi” ili kuhifadhi maana yake kama cheo.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: Kwa maana
  rationale: Katika muktadha, neno hili linatoa msingi wa himizo lililotangulia; “Kwa maana” linaendeleza mtiririko huo wa sababu kwa Kiswahili cha kawaida.
- source_word: οὐκ ἔθετο ἡμᾶς … εἰς
  choice: hakutuweka ili tupate
  rationale: Muundo huu unaonyesha kuwekwa au kuteuliwa kuelekea matokeo fulani. Tafsiri hii ni ya kawaida kwa Kiswahili na haiongezi msisitizo wa kimafundisho ulio mkali kuliko Kigiriki.
- source_word: ὀργήν
  choice: ghadhabu
  rationale: Katika muktadha huu wa Paulo, neno linaashiria ghadhabu ya hukumu ya Mungu. “Ghadhabu” ni sahihi zaidi kuliko kulibadili moja kwa moja kuwa “hukumu.”
- source_word: περιποίησιν
  choice: tuupate
  rationale: Hapa nomino hiyo inaweza kuonyesha kupata, kujipatia, kumiliki, au kuhifadhiwa. “Tuupate wokovu” ni Kiswahili cha asili na kinaonyesha matokeo yanayokusudiwa, huku upana wa maana ukihifadhiwa katika tanbihi.
- source_word: σωτηρίας
  choice: wokovu
  rationale: “Wokovu” ndilo neno la kawaida na lenye uzito unaofaa katika matumizi ya Paulo, ingawa katika miktadha mingine σωτηρία linaweza kumaanisha ukombozi au kuokolewa.
- source_word: διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: kwa njia ya Bwana wetu Yesu Masihi
  rationale: διά pamoja na hali ya umilikishi huonyesha njia au wakala. “Masihi” linaendeleza maana ya Χριστός kama cheo badala ya kulifanya lionekane tu kama jina la pili.
theological_decisions:
- issue: Iwapo ἔθετο itafsiriwe kwa lugha yenye nguvu zaidi ya kuamuliwa tangu awali
  choice: hakutuweka ili tupate ghadhabu
  alternative: hakutukusudia kwa ajili ya ghadhabu
  rationale: Mstari unasema kusudi au uteuzi wa Mungu kuhusu mwisho wa waamini, lakini haulazimishi mfumo maalumu wa kimadhehebu kuhusu kuamuliwa tangu awali.
- issue: Iwapo Χριστοῦ itafsiriwe kama cheo au kama umbo la jina lililozoeleka
  choice: Masihi
  alternative: Kristo
  rationale: Χριστός bado hubeba maana ya cheo cha Mtiwa-Mafuta hata inapofuata jina Yesu. “Masihi” huhifadhi maana hiyo; “Kristo” limetajwa katika tanbihi kama umbo la jadi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa sentensi umehifadhi ulinganifu kati ya ghadhabu na wokovu bila kufafanua kupita kiasi mhusika au wakati wa ghadhabu.
