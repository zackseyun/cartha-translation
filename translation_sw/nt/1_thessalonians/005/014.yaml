base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/014.yaml
  text: And we urge you[a], brothers, admonish the disorderly, encourage the fainthearted, help the weak[d][c][b], be patient with everyone.
translation:
  language: sw
  text: 'Nasi tunawasihi, ndugu[a]: waonyeni wasio na utaratibu[b], watieni moyo waliovunjika moyo[c], wasaidieni walio dhaifu[d], na muwe na subira kwa watu wote.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ndugu wa kiume na wa kike”; Paulo analihutubia kusanyiko lote.
    reason: alternative_reading
  - marker: b
    text: Au “wavivu” au “wakaidi.”
    reason: lexical_alternative
  - marker: c
    text: Au “wafarijini waliokata tamaa.”
    reason: lexical_alternative
  - marker: d
    text: Au “wategemezeni walio dhaifu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακαλοῦμεν
  choice: tunawasihi
  rationale: Katika muktadha huu wa mawaidha, kitenzi hiki kinaonyesha ombi lenye uzito na msukumo wa kichungaji; “tunawasihi” ni Kiswahili cha sasa na chenye nguvu inayofaa.
- source_word: δέ
  choice: Nasi
  rationale: Hapa δέ inaendeleza na kuhamisha wazo bila kuonyesha upinzani mkali. “Nasi” huunganisha sentensi hii kwa kawaida na mawaidha yaliyotangulia.
- source_word: ἀδελφοί
  choice: ndugu
  rationale: “Ndugu” huhifadhi sitiari ya kifamilia na katika Kiswahili inaweza kulihusu kundi lenye wanaume na wanawake bila kulazimisha jinsia moja.
- source_word: νουθετεῖτε
  choice: waonyeni
  rationale: Kitenzi hiki humaanisha kutoa maonyo au mafundisho ya kurekebisha mwenendo. “Waonyeni” kinaeleweka kwa urahisi na huhifadhi lengo la marekebisho.
- source_word: ἀτάκτους
  choice: wasio na utaratibu
  rationale: Neno hili humaanisha walio nje ya mpangilio au nidhamu. Tafsiri hii huhifadhi upana wake bila kulifungamanisha tu na uvivu.
- source_word: παραμυθεῖσθε
  choice: watieni moyo
  rationale: Kitenzi hiki humaanisha kusema kwa upole ili kufariji, kutuliza, au kuimarisha moyo; “watieni moyo” ni usemi wa kawaida unaofaa katika orodha hii ya maagizo.
- source_word: ὀλιγοψύχους
  choice: waliovunjika moyo
  rationale: Neno hili huwaeleza wenye moyo mdogo, waliokata tamaa, au wasio na ujasiri. “Waliovunjika moyo” ni la asili na huonyesha hali ya kuvunjika moyo bila kudai kwamba ni woga pekee.
- source_word: ἀντέχεσθε
  choice: washikeni
  rationale: Pamoja na nomino katika hali ya genitivi, kitenzi hiki kina wazo la kushikamana na mtu, kumtegemeza, au kumsaidia. “Washikeni” huhifadhi taswira ya kushikamana nao; tanbihi inaeleza maana ya utegemezo.
- source_word: τῶν ἀσθενῶν
  choice: walio dhaifu
  rationale: Neno hili linaweza kueleza udhaifu wa kimwili, kimaadili, au kijamii. “Walio dhaifu” huhifadhi upana huo.
- source_word: μακροθυμεῖτε
  choice: muwe na subira
  rationale: Kitenzi hiki huonyesha uvumilivu wa muda mrefu katika kushughulika na watu. “Muwe na subira” ni Kiswahili cha kawaida na wazi.
- source_word: πρὸς πάντας
  choice: kwa watu wote
  rationale: Kirai hiki hueleza mwelekeo wa tabia kwa kila mtu. “Kwa watu wote” huweka wazi upeo wa agizo hilo.
theological_decisions:
- issue: Ujumuishi wa ἀδελφοί katika hotuba kwa kusanyiko
  choice: Kutumia “ndugu” katika matini kuu na kueleza katika tanbihi kwamba Paulo analihutubia kusanyiko lote.
  alternative: ndugu wa kiume na wa kike
  rationale: Katika matumizi ya kawaida ya Kiswahili, “ndugu” linaweza kuwa la jinsia zote huku likihifadhi lugha ya kifamilia ya chanzo. Tanbihi inaondoa shaka kuhusu walengwa bila kuongeza maneno katika matini kuu.
- issue: Aina ya udhaifu katika τῶν ἀσθενῶν
  choice: Kutafsiri kwa upana kuwa “walio dhaifu.”
  alternative: wagonjwa au walio dhaifu kiroho
  rationale: Muktadha hauainishi udhaifu huo kuwa wa kimwili, kiroho, kimaadili, au kijamii; kwa hiyo tafsiri haipaswi kuamua jambo ambalo chanzo kimeacha wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa maagizo manne umehifadhiwa, pamoja na upana wa maana za ἀτάκτους, ἀντέχεσθε, na ἀσθενῶν.
