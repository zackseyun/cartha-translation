  yaml_path: translation/nt/1_thessalonians/005/027.yaml
  text: I put you under oath before the Lord to have this letter read to all the brothers[a][b].
translation:
  language: sw
  text: Ninawaapisha kwa Bwana[a] kwamba barua hii isomwe kwa ndugu wote.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mbele za Bwana.” Usemi wa Kigiriki unaweza kumaanisha kwamba Paulo anawafunga kwa kiapo kwa kumtaja Bwana kuwa mamlaka ya agizo hilo au shahidi wake.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kigiriki lililotafsiriwa “ndugu” ni la wingi wa kiume, lakini huenda linarejelea kusanyiko lote, pamoja na wanawake.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνορκίζω
  choice: Ninawaapisha
  rationale: Kitenzi hiki humaanisha kuwafunga watu kwa kiapo au kuwaagiza kwa uzito wa kiapo. “Ninawaapisha” huhifadhi nguvu hiyo kwa Kiswahili cha kawaida na cha heshima.
- source_word: τὸν κύριον
  choice: kwa Bwana
  rationale: Katika muundo huu, Bwana ndiye anayeombwa kuwa mamlaka au shahidi wa kiapo. “Kwa Bwana” hufuata kwa karibu zaidi uhusiano huo wa kisarufi, huku uwezekano wa “mbele za Bwana” ukihifadhiwa katika tanbihi.
- source_word: ἀναγνωσθῆναι
  choice: isomwe
  rationale: Hiki ni kitenzi-jina cha kutendwa, “kusomwa.” Katika muktadha wa barua kwa kusanyiko, kusomwa hadharani kunaeleweka bila kulazimika kuongeza neno “kwa sauti.”
- source_word: τὴν ἐπιστολήν
  choice: barua hii
  rationale: Ingawa Kigiriki kina kifungu bainishi, muktadha unaonyesha waraka uliopo unaotumwa; “barua hii” ni ya kawaida na wazi katika Kiswahili cha sasa.
- source_word: πᾶσιν τοῖς ἀδελφοῖς
  choice: kwa ndugu wote
  rationale: “Ndugu” ni tafsiri ya kawaida ya ἀδελφοῖς na kwa Kiswahili inaweza kurejelea wanaume na wanawake. Hivyo inahifadhi lugha ya undugu wa jumuiya bila kuongeza maneno yasiyopo katika Kigiriki.
theological_decisions:
- issue: Uhusiano wa τὸν κύριον na ἐνορκίζω
  choice: kwa Bwana
  alternative: mbele za Bwana
  rationale: Kishazi kinaweza kueleweka kuwa Bwana ndiye anayeombwa kama mamlaka ya kiapo, au kama yule ambaye agizo linatolewa mbele zake. Tafsiri kuu inahifadhi nguvu ya kiapo; tanbihi inaonyesha uwezekano mwingine bila kuumaliza utata.
- issue: Maana ya ἀδελφοῖς katika kusanyiko lenye wanaume na wanawake
  choice: ndugu wote
  alternative: ndugu wote, wanaume kwa wanawake
  rationale: Nomino ya Kigiriki ni wingi wa kiume lakini katika barua za Paulo mara nyingi huhusu jumuiya nzima. Kiswahili “ndugu” tayari kinaweza kuwajumuisha wote, kwa hiyo hakuna haja ya kuongeza ufafanuzi wa kijinsia katika matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka. Muundo wa kutendwa “isomwe” umehifadhiwa, na “Ninawaapisha” unaonyesha uzito wa agizo la Paulo.
