base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/003.yaml
  text: When they say[a], “Peace and security,” then sudden destruction comes upon them, like labor pains upon a pregnant woman[c][b], and they will certainly not escape.
translation:
  language: sw
  text: Wakati watakaposema, “Amani na usalama,”[a] ndipo uharibifu wa ghafula utakapowajia, kama vile uchungu wa kuzaa unavyomjia mwanamke mjamzito;[b] wala hawataepuka kamwe.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno “usalama” pia linaweza kumaanisha “salama.”
    reason: lexical_alternative
  - marker: b
    text: Au “maumivu ya kujifungua.”
    reason: lexical_alternative
  - marker: c
    text: 'Kigiriki kina ukanushaji wenye mkazo: “kwa vyovyote vile hawataepuka.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν λέγωσιν
  choice: Wakati watakaposema
  rationale: Muundo huu unaonyesha tukio la wakati ujao lisiloainishwa kwa tarehe, huku ukihifadhi kiima cha wingi kisichotajwa wazi katika Kigiriki.
- source_word: Εἰρήνη καὶ ἀσφάλεια
  choice: Kuna amani na usalama
  rationale: Kauli ya Kiswahili inahitaji kishazi kamili cha kawaida; “usalama” huhifadhi maana pana ya ἀσφάλεια bila kuibana kuwa kinga ya kimwili pekee.
- source_word: αἰφνίδιος ... ἐφίσταται ὄλεθρος
  choice: uharibifu wa ghafula utakapowajia
  rationale: “Uharibifu” hudumisha uzito wa ὄλεθρος bila kuamua aina au muda wake, na “utakapowajia” huwasilisha maana ya tukio linalowafikia.
- source_word: ἡ ὠδὶν
  choice: uchungu wa kuzaa
  rationale: Hii ni kauli ya kawaida na iliyo wazi katika Kiswahili kwa maumivu yanayohusiana na kujifungua.
- source_word: τῇ ἐν γαστρὶ ἐχούσῃ
  choice: mwanamke mjamzito
  rationale: Ni tafsiri ya asili na yenye kueleweka ya usemi wa Kigiriki unaomaanisha mwenye mtoto tumboni.
- source_word: οὐ μὴ ἐκφύγωσιν
  choice: hakika hawataepuka
  rationale: “Hakika” huonyesha nguvu ya ukanushaji maradufu wa Kigiriki kuhusu wakati ujao kwa Kiswahili cha sasa.
theological_decisions:
- issue: Maana ya ὄλεθρος katika onyo la eskatolojia
  choice: uharibifu
  alternative: maangamizi; maafa
  rationale: Neno hili linaonyesha hukumu kali, lakini mstari wenyewe haufafanui ikiwa ni kutoweka kabisa au aina na muda fulani wa adhabu. “Uharibifu” huhifadhi uzito na pia mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Mpangilio umefanywa wa asili kwa Kiswahili huku ghafla ya hukumu, mfano wa uchungu wa kuzaa, na mkazo wa ukanushaji vikihifadhiwa.
