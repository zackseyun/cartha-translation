  text: αὐτοὶ γὰρ ἀκριβῶς οἴδατε ⸀ὅτι ἡμέρα κυρίου ὡς κλέπτης ἐν νυκτὶ οὕτως ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/002.yaml
  text: For you yourselves know very well that the day of the Lord comes like a thief in the night.
translation:
  language: sw
  text: Kwa maana ninyi wenyewe mnajua vizuri sana kwamba siku ya Bwana huja kama mwizi usiku.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αὐτοὶ
  choice: ninyi wenyewe
  rationale: Kiwakilishi cha kusisitiza kinaimarisha mhusika aliyekwisha kuonyeshwa katika kitenzi; “ninyi wenyewe” huhifadhi msisitizo huo kwa Kiswahili cha kawaida.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Kiunganishi hiki kinatoa sababu au ufafanuzi wa kauli iliyotangulia; “Kwa maana” huhifadhi uhusiano huo wazi.
- source_word: ἀκριβῶς
  choice: vizuri sana
  rationale: Pamoja na kitenzi cha kujua, usemi huu unaeleza ujuzi ulio sahihi na thabiti. “Mnajua vizuri sana” ni wa asili zaidi katika Kiswahili kuliko “mnajua kwa usahihi kabisa.”
- source_word: οἴδατε
  choice: mnajua
  rationale: Hii ndiyo tafsiri ya moja kwa moja na ya kawaida ya kitenzi kinachoonyesha kuwa na maarifa.
- source_word: ὅτι
  choice: kwamba
  rationale: Huanzisha yaliyomo katika jambo wanalolijua; “kwamba” ni kiunganishi cha kawaida katika Kiswahili.
- source_word: ἡμέρα κυρίου
  choice: siku ya Bwana
  rationale: Ni usemi wa kibiblia unaorejelea siku ya mwisho ya kuingilia kati kwa Mungu, wala si siku ya ibada ya kila juma.
- source_word: κυρίου
  choice: Bwana
  rationale: “Bwana” ni tafsiri iliyozoeleka na inayofaa kwa κύριος katika usemi huu wa kibiblia.
- source_word: ὡς κλέπτης ἐν νυκτὶ
  choice: kama mwizi usiku
  rationale: Huhifadhi tashbihi ya ujio usiotarajiwa kwa Kiswahili cha asili; “usiku” huwasilisha ἐν νυκτί bila uzito usio wa lazima.
- source_word: οὕτως
  choice: imewasilishwa katika “kama”
  rationale: οὕτως huunganisha namna ya kuja na tashbihi iliyotangulia. Kiswahili kwa kawaida huwasilisha uhusiano huo moja kwa moja kwa “huja kama mwizi,” bila kuongeza “hivyo.”
- source_word: ἔρχεται
  choice: huja
  rationale: Wakati wa sasa unaeleza kwa uhai tukio la wakati ujao. “Huja” huhifadhi uwasilishaji huo na pia kanuni ya jumla kuhusu namna siku hiyo itakavyofika.
theological_decisions:
- issue: Usemi wa kieskatolojia ἡμέρα κυρίου
  choice: siku ya Bwana
  alternative: siku ya Bwana ya kila juma
  rationale: Muktadha unahusu wakati na kutotarajiwa kwa siku ya kuingilia kati kwa Mungu; hauzungumzii siku ya ibada ya kila juma.
- issue: Nguvu ya tashbihi “kama mwizi usiku”
  choice: Tashbihi imehifadhiwa bila kuipanua
  alternative: Kuifafanua kuwa ujio wa siri au kuhusisha ratiba maalumu ya matukio ya mwisho
  rationale: Andiko linasisitiza hali ya kutotarajiwa kwa ujio. Halitoi hapa maelezo ya mfumo fulani wa matukio ya mwisho, hivyo tafsiri haipaswi kuyaingiza.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Muundo “ninyi wenyewe mnajua vizuri sana” huhifadhi msisitizo wa Kigiriki bila kuwa mgumu; “huja kama mwizi usiku” ni wa asili huku ukidumisha taswira na uhai wa wakati wa sasa.
