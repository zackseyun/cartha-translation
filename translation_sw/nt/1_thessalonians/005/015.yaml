base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/015.yaml
  text: See to it that no one repays evil for evil to anyone[b][a], but always pursue what is good toward one another and toward all people.
translation:
  language: sw
  text: Angalieni kwamba mtu yeyote asije akamlipa mtu yeyote uovu kwa uovu,[a] bali sikuzote fuateni lililo jema kwa ninyi kwa ninyi na kwa watu wote.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Jihadharini, mtu yeyote asije akamlipa mtu yeyote uovu kwa uovu.”
    reason: lexical_alternative
  - marker: b
    text: Inaelekea kwamba maneno “ninyi kwa ninyi … watu wote” yanaanza na waamini wenzao na kisha yanapanua wigo kuwahusu watu wote kwa ujumla.
    reason: cross_reference
lexical_decisions:
- source_word: ὁρᾶτε
  choice: Angalieni kwamba
  rationale: Kitenzi cha amri kwa wingi hapa ni himizo la kuwa macho na kuhakikisha jambo fulani, si kuona kwa macho tu. Kauli hii pia inaonyesha wajibu wa jumuiya.
- source_word: μή τις
  choice: mtu yeyote asi-
  rationale: Pamoja na ὁρᾶτε, maneno haya yanataja jambo linalopaswa kuzuiwa. Muundo wa Kiswahili wenye kitenzi tegemezi hasi unaonyesha katazo hilo kwa kawaida.
- source_word: κακὸν ἀντὶ κακοῦ
  choice: uovu kwa uovu
  rationale: Huu ni usemi wa kulipiza kisasi. Marudio ya neno “uovu” yanadumisha upana wa maana na muundo wa Kigiriki.
- source_word: τινι
  choice: yeyote
  rationale: Kiwakilishi hiki kinamtaja mpokeaji wa malipo bila kumwekea kikomo; “yeyote” hudumisha wigo huo mpana.
- source_word: ἀποδῷ
  choice: asimlipe
  rationale: Kitenzi hiki kina maana ya kumrudishia mtu alichotenda, hasa katika muktadha wa kulipiza kisasi. “Asimlipe” ni kifupi na cha kawaida katika Kiswahili.
- source_word: πάντοτε
  choice: sikuzote
  rationale: Kielezi hiki huonyesha kwamba himizo hilo linatumika wakati wote.
- source_word: τὸ ἀγαθὸν
  choice: lililo jema
  rationale: Kivumishi chenye kibainishi kimetumiwa kama nomino, kikimaanisha jambo au tendo jema. “Lililo jema” hudumisha maana hiyo bila kuibana.
- source_word: διώκετε
  choice: fuateni
  rationale: Hapa kitenzi kinaonyesha kufuatilia kwa juhudi na kwa makusudi, si kupendelea tu. “Fuateni” inadumisha nguvu ya amri hiyo.
- source_word: εἰς ἀλλήλους
  choice: kwa ninyi kwa ninyi
  rationale: Kirai hiki kinaelekeza wema kwa watu wa jumuiya katika mahusiano yao ya pande zote.
- source_word: καὶ εἰς πάντας
  choice: na kwa watu wote
  rationale: Kirai hiki kinapanua mwelekeo wa kutenda mema kwa wote. Neno “watu” limewekwa wazi kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Wigo wa wajibu wa kimaadili wa waamini
  choice: Maneno “ninyi kwa ninyi” yanaweza kutaja mahusiano ndani ya jumuiya, kisha “watu wote” yakapanua wajibu huo kwa watu wengine wote.
  alternative: “Watu wote” inaweza kueleweka kuwa waamini wote pekee.
  rationale: Jozi ya εἰς ἀλλήλους καὶ εἰς πάντας kwa kawaida huonyesha mwendo kutoka kundi la ndani kwenda kundi pana zaidi. Tafsiri inadumisha mpangilio huo, huku tanbihi ikieleza uwezekano bila kuufanya kuwa dai la ziada ndani ya andiko.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi, na inayoeleweka kwa wasomaji wa kawaida. Muundo wa mstari unadumisha himizo la pamoja, marudio ya “uovu kwa uovu,” nguvu ya amri διώκετε, na upanuzi unaowezekana kutoka jumuiya ya waamini kwenda kwa watu wote.
