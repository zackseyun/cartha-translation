  text: ἐν παντὶ εὐχαριστεῖτε· τοῦτο γὰρ θέλημα θεοῦ ἐν Χριστῷ Ἰησοῦ εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/018.yaml
  text: Give thanks in everything[b][a], for this is God's will in Messiah Jesus for you.
translation:
  language: sw
  text: Shukuruni katika kila hali,[a] kwa maana hayo ndiyo mapenzi ya Mungu kwenu katika Masihi Yesu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “katika kila jambo.” Kigiriki husema kihalisi “katika yote,” kikirejelea hali ambamo waamini wanapaswa kushukuru, si lazima kwamba wamshukuru Mungu kwa ajili ya uovu wenyewe.'
    reason: lexical_alternative
  - marker: b
    text: 'Tafsiri ya kimapokeo: “katika Kristo Yesu.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν παντί
  choice: katika kila hali
  rationale: Kirai ἐν pamoja na hali ya udativu kinaonyesha mazingira ambamo waamini wanapaswa kushukuru. Tafsiri hii ni ya asili katika Kiswahili na haidokezi kwamba waamini wanapaswa kushukuru kwa ajili ya uovu wenyewe.
- source_word: εὐχαριστεῖτε
  choice: Shukuruni
  rationale: Ni amri ya wakati wa sasa kwa wingi, inayohimiza tendo la kudumu. “Shukuruni” ni tafsiri ya moja kwa moja na ya kawaida bila kueleza kupita kiasi kipengele cha mwendelezo.
- source_word: τοῦτο
  choice: hayo
  rationale: Kiwakilishi hiki kinaelekeza hasa kwenye tendo lililotajwa la kushukuru. Kiswahili cha asili hutumia “hayo” kurejelea yaliyosemwa, bila kuongeza ufafanuzi usiomo katika Kigiriki.
- source_word: γὰρ
  choice: kwa maana
  rationale: Neno hili linaanzisha sababu au msingi wa amri iliyotangulia.
- source_word: θέλημα θεοῦ
  choice: mapenzi ya Mungu
  rationale: Muundo huu unaonyesha mapenzi yanayotoka kwa Mungu; huu ni usemi wa kawaida, sahihi na wenye heshima katika Kiswahili.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: katika Masihi Yesu
  rationale: Χριστός hapa linaendelea kufanya kazi kama cheo chenye maana ya Masihi. Kihusishi “katika” kimehifadhiwa ili kutobana maana pana ya usemi wa Paulo kuhusu uhusiano na Masihi.
- source_word: εἰς ὑμᾶς
  choice: kwenu
  rationale: Katika muundo huu kirai kinaonyesha mwelekeo au jambo linalowahusu waamini wa Thesalonike. “Kwenu” ni kifupi na cha asili.
theological_decisions:
- issue: Kutafsiri Χριστῷ kama cheo au kutumia umbo la kimapokeo
  choice: Masihi Yesu
  alternative: Kristo Yesu
  rationale: “Masihi” huwasilisha maana ya cheo cha Kigiriki Χριστός badala ya kukifanya jina lisiloelezwa. Umbo la kimapokeo limewekwa katika tanbihi.
- issue: Shukrani katika mazingira yote au kwa ajili ya kila kitu
  choice: katika kila hali
  alternative: kwa ajili ya kila kitu
  rationale: ἐν παντί huonyesha zaidi mazingira ambamo shukrani zinatolewa. Tafsiri iliyochaguliwa haiongezi dai kwamba uovu wenyewe ndio sababu ya kumshukuru Mungu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni fupi na wazi; “katika” limehifadhiwa katika usemi wa Paulo, huku tanbihi zikihifadhi maana mbadala halisi na umbo la kimapokeo.
