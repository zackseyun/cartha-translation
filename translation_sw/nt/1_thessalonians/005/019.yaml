  yaml_path: translation/nt/1_thessalonians/005/019.yaml
  text: Do not quench the Spirit,[a]
translation:
  language: sw
  text: Msimzimishe Roho.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “roho.” Neno la Kigiriki linaweza kumaanisha roho kwa maana ya jumla zaidi, lakini hapa yaelekea linamrejelea Roho Mtakatifu, hasa kwa kuzingatia kutajwa kwa unabii katika mstari unaofuata.
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ πνεῦμα
  choice: Roho
  rationale: Katika muktadha wa maonyo ya Paulo, hasa kwa kuwa unabii umetajwa katika mstari unaofuata, neno hili linaelekea zaidi kumaanisha Roho Mtakatifu. Herufi kubwa inaonyesha maana hiyo katika Kiswahili, ingawa maandishi ya kale ya Kigiriki hayatofautishi maana kwa herufi kubwa na ndogo.
- source_word: μὴ
  choice: Msi-
  rationale: μή pamoja na kitenzi cha amri cha wakati wa sasa huunda katazo; katika Kiswahili wingi unaonyeshwa kwa kiambishi cha nafsi na hali ya kukataza, “msi-”.
- source_word: σβέννυτε
  choice: imzimishe
  rationale: σβέννυμι humaanisha kuzima, hasa moto. “Kumzimisha” huhifadhi sitiari ya kuuzima moto na pia humtendea Roho kama anayerejelewa, badala ya kufafanua sitiari kwa maneno ya ziada.
theological_decisions:
- issue: Anayerejelewa na πνεῦμα
  choice: Roho Mtakatifu
  alternative: roho ya mwanadamu au utendaji/karama ya kiroho
  rationale: Kutajwa kwa unabii mara baada ya katazo hili kunaunga mkono rejeo kwa utendaji wa Roho Mtakatifu katika kusanyiko. Hata hivyo, kwa kuwa neno la Kigiriki linaweza kumaanisha “roho” kwa upana zaidi, uwezekano huo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, kwa mtindo mfupi, wa heshima na unaoeleweka. “Msiimzimishe” ni katazo la moja kwa moja kwa kundi na huhifadhi sitiari ya kuzima moto.
