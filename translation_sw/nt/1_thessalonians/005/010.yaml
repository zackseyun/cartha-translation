  text: who died for us[a], so that whether we are awake or asleep, we may live together with him.
translation:
  language: sw
  text: aliyekufa kwa ajili yetu, ili kwamba iwe tuko macho au tumelala[a], tuishi pamoja naye.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maneno “tuko macho au tumelala” yanaweza pia kueleweka kuwa “tunakesha au tumelala.” Huenda yakarudia wito wa kukesha katika mistari inayozunguka, ingawa hapa yaelekea zaidi kumaanisha kama waamini wako hai au wamekufa.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποθανόντος
  choice: aliyekufa
  rationale: Kirai cha wakati uliopita kinamfafanua Bwana Yesu aliyetajwa katika mstari uliotangulia. Muundo wa kishazi cha uhusiano ni wa asili katika Kiswahili.
- source_word: περὶ ἡμῶν
  choice: kwa ajili yetu
  rationale: Katika muktadha huu, περί pamoja na hali ya umilikishi ina maana ya kutenda kwa manufaa au niaba ya wengine. Tafsiri hii ni ya kawaida bila kuingiza maelezo ya ziada kuhusu namna ya kifo chake.
- source_word: ἵνα
  choice: ili kwamba
  rationale: Inaonyesha kusudi au matokeo yaliyokusudiwa.
- source_word: γρηγορῶμεν
  choice: tuko macho
  rationale: Inahifadhi picha ya kuwa macho, ambayo inaweza kueleweka kama kukesha kiroho au, kwa kulinganishwa na kulala, kuwa bado hai.
- source_word: καθεύδωμεν
  choice: tumelala
  rationale: Inadumisha sitiari ya kulala badala ya kuitafsiri moja kwa moja kuwa kufa; hivyo uhusiano wake na maonyo ya kukesha na pia na waamini waliokufa unabaki wazi.
- source_word: ἅμα σὺν αὐτῷ
  choice: pamoja naye
  rationale: ἅμα na σύν zinaonyesha ushirika wa pamoja naye. Kiswahili hiki kinaeleza maana kamili bila uradidi usio wa lazima.
- source_word: ζήσωμεν
  choice: tuishi
  rationale: Hali tegemezi baada ya ἵνα inaeleza kusudi lililokusudiwa na inatolewa kwa kawaida kwa ‘tuishi.’
theological_decisions:
- issue: Maana ya “tuko macho au tumelala” katika muktadha
  choice: Maandishi makuu yanadumisha sitiari, huku maana inayowezekana zaidi ikiwa waamini walio hai au waliokufa.
  alternative: Maneno hayo yanaweza kuendeleza wito wa kukesha kiroho badala ya kuwa wazembe.
  rationale: Muktadha wa karibu unatumia lugha ya kukesha na kulala kwa maadili, lakini 4:13–15 hutumia kulala kuhusu waamini waliokufa. Ahadi ya kuishi pamoja na Kristo inafaa hasa kwa tofauti ya walio hai na waliokufa; kwa hiyo tafsiri haiondoi mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni rahisi kwa msomaji wa kawaida, na sitiari pamoja na utata halisi wa kifungu zimehifadhiwa.
