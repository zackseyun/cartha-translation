translation:
  language: sw
  text: Tunawaomba, ndugu[a], muwatambue[b] wale wanaofanya kazi kwa bidii miongoni mwenu, wanaowaongoza katika Bwana[c] na kuwaonya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki ni umbo la kiume kwa wingi, “ndugu”; hapa limetumiwa kulihutubia kusanyiko la waumini.
    reason: lexical_alternative
