lexical_decisions:
- source_word: Ἐρωτῶμεν
  choice: Tunawaomba
  rationale: Kitenzi hiki kinaonyesha ombi la kichungaji badala ya amri kali; “tunawaomba” ni cha kawaida na huhifadhi upole wake.
- source_word: δὲ
  choice: (hakikutafsiriwa kwa neno maalumu)
  rationale: δέ ni kiunganishi chepesi cha mpito. Katika Kiswahili mtiririko wa sentensi unaonyesha mpito huo bila kulazimisha “basi,” “lakini,” au neno la wakati lisilokuwapo katika chanzo.
- source_word: ἀδελφοί
  choice: ndugu
  rationale: “Ndugu” ni mwito wa kawaida na wenye heshima kwa waumini; katika Kiswahili unaweza kulihusu kusanyiko lote bila kupotosha matumizi ya Kigiriki.
- source_word: εἰδέναι
  choice: muwatambue
  rationale: Katika muktadha huu εἰδέναι ina maana ya kuwatambua na kuwathamini wanaotumikia, si kujua tu wao ni nani. “Muwatambue” huhifadhi maana hiyo bila kuongeza wazo la utii usiotajwa.
- source_word: κοπιῶντας
  choice: wale wanaofanya kazi kwa bidii
  rationale: κοπιάω husisitiza kazi yenye juhudi na kuchosha. Usemi huu ni wa kawaida zaidi katika Kiswahili cha sasa kuliko “wanaotaabika,” huku ukihifadhi uzito wa kazi hiyo.
- source_word: ἐν ὑμῖν
  choice: miongoni mwenu
  rationale: Hueleza huduma inayofanywa ndani ya jumuiya ya waumini.
- source_word: προϊσταμένους ὑμῶν
  choice: wanaowaongoza
  rationale: Kitenzi hiki kinaweza kumaanisha kuongoza, kusimamia, au kuwajibika kwa wengine. “Wanaowaongoza” huonyesha uongozi bila kuingiza muundo maalumu wa madaraka ya kanisa.
- source_word: ἐν κυρίῳ
  choice: katika Bwana
  rationale: Huhifadhi usemi wa Paulo na kuonyesha kwamba uongozi wao unafanywa katika uhusiano na chini ya mamlaka ya Bwana.
- source_word: νουθετοῦντας
  choice: kuwaonya
  rationale: νουθετέω ni kutoa maelekezo yenye kusahihisha au onyo. “Kuwaonya” ni neno la sasa na linaloeleweka, ingawa linaweza pia kujumuisha mawaidha ya kurekebisha.
theological_decisions:
- issue: Mwito wa kusanyiko ἀδελφοί
  choice: ndugu
  alternative: ndugu wa kiume; akina ndugu
  rationale: Umbo la Kigiriki ni la kiume kwa wingi, lakini katika muktadha huu linatumiwa kulihutubia kusanyiko la waumini. Neno la Kiswahili “ndugu” linaweza kuhifadhi mwito huo huku likiwa la kawaida kwa kundi zima; tanbihi inaweka wazi umbo na matumizi ya chanzo.
- issue: Maana ya εἰδέναι kuhusu watumishi wa kanisa
  choice: muwatambue
  alternative: muwaheshimu; muwakubali; muwajue
  rationale: Wito ni wa kuwatambua ipasavyo wale wanaotumika, lakini maandishi hayasemi wazi “watiini” wala hayadai heshima ya kupita kiasi. “Muwatambue” huhifadhi upana huo.
- issue: Nguvu ya προϊσταμένους ὑμῶν ἐν κυρίῳ
  choice: wanaowaongoza katika Bwana
  alternative: walio juu yenu katika Bwana; wanaowasimamia katika Bwana; wanaowatunza katika Bwana
  rationale: Kirai kinaweza kueleza uongozi au usimamizi wenye wajibu wa utunzaji. Tafsiri kuu inaonyesha mamlaka halisi bila kuamua muundo maalumu wa uongozi wa kanisa; tafsiri ya karibu zaidi imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Sentensi imehifadhi mfuatano wa virai tegemezi vya Kigiriki bila kuwa nzito kupita kiasi. “Katika Bwana” limeachwa kama kirai cha kitheolojia kilicho wazi, na hakuna istilahi ya dhehebu maalumu iliyoingizwa.
