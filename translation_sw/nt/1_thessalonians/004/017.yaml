  text: ἔπειτα ἡμεῖς οἱ ζῶντες οἱ περιλειπόμενοι ἅμα σὺν αὐτοῖς ἁρπαγησόμεθα ἐν νεφέλαις εἰς ἀπάντησιν τοῦ κυρίου εἰς ἀέρα· καὶ οὕτως πάντοτε σὺν κυρίῳ ἐσόμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/017.yaml
  text: Then we who are alive[a], who remain, will be caught up together with them in the clouds to meet the Lord in the air[b]; and so we will always be with the Lord.
translation:
  language: sw
  text: Kisha sisi tulio hai, tutakaokuwa tumebaki, tutanyakuliwa[a] pamoja nao katika mawingu ili kumlaki Bwana hewani[b]; na hivyo tutakuwa pamoja na Bwana daima.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “tutachukuliwa juu kwa ghafula.” Kitenzi cha Kigiriki kinakazia tendo la ghafula na lenye nguvu.
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa ajili ya kukutana na Bwana.” Usemi huu unaweza kumaanisha kwenda kukutana na mtu, lakini mstari wenyewe haufafanui mfululizo mpana wa matukio baada ya mkutano huu.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔπειτα
  choice: Kisha
  rationale: Inaonyesha tukio linalofuata baada ya kufufuliwa kwa waliokufa katika Kristo katika mstari uliotangulia.
- source_word: οἱ ζῶντες οἱ περιλειπόμενοι
  choice: sisi tulio hai, tutakaokuwa tumebaki
  rationale: Inabainisha waamini watakaokuwa bado hai wakati huo bila kudokeza kwamba walinusurika katika hatari fulani.
- source_word: ἅμα σὺν αὐτοῖς
  choice: pamoja nao
  rationale: Inawasilisha kwa kawaida wazo la kuwa pamoja na lile la kushiriki tukio moja na waamini waliofufuliwa.
- source_word: ἁρπαγησόμεθα
  choice: tutanyakuliwa
  rationale: Kitenzi hiki cha wakati ujao katika hali ya kutendwa kinaonyesha kuchukuliwa kwa ghafula na kwa nguvu, bila kuingiza mfumo fulani wa kimadhehebu kuhusu tukio hilo.
- source_word: ἐν νεφέλαις
  choice: katika mawingu
  rationale: Inahifadhi taswira halisi ya mawingu iliyomo katika Kigiriki.
- source_word: εἰς ἀπάντησιν τοῦ κυρίου
  choice: ili kumlaki Bwana
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha kusudi la kwenda kukutana na Bwana bila kuamua mfululizo mpana wa matukio baada ya mkutano huo.
- source_word: εἰς ἀέρα
  choice: hewani
  rationale: Inatoa mahali pa mkutano kwa lugha ya Kiswahili iliyo wazi na ya kawaida.
- source_word: καὶ οὕτως
  choice: na hivyo
  rationale: Inahifadhi wazo la namna au matokeo yanayotokana na mfululizo huo wa matukio.
- source_word: πάντοτε σὺν κυρίῳ ἐσόμεθα
  choice: tutakuwa pamoja na Bwana daima
  rationale: Inahifadhi ahadi ya wakati ujao na msisitizo wa ushirika wa kudumu na Bwana.
theological_decisions:
- issue: Maana ya ἁρπαγησόμεθα katika mstari unaohusishwa na mijadala kuhusu kunyakuliwa kwa waamini
  choice: tutanyakuliwa
  alternative: tutachukuliwa juu kwa ghafula
  rationale: Tafsiri inaonyesha tendo la ghafula na lenye nguvu lililo katika kitenzi cha Kigiriki, lakini haiongezi msimamo kuhusu wakati au mpangilio wa matukio ya mwisho.
- issue: Maana ya εἰς ἀπάντησιν τοῦ κυρίου
  choice: ili kumlaki Bwana
  alternative: kwa ajili ya kukutana na Bwana
  rationale: Usemi huu unasema wazi kwamba wataenda kukutana na Bwana, lakini hauamui ikiwa baada ya hapo wataendelea kuelekea mahali fulani; mstari wenyewe haufafanui hatua hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Kumlaki” ni neno fasaha na linalotambulika katika muktadha wa kwenda kukutana na mtu anayekuja; tanbihi inalifafanua bila kuingiza mpangilio maalumu wa kieskatolojia.
