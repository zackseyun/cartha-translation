  text: τοῦτο γὰρ ὑμῖν λέγομεν ἐν λόγῳ κυρίου, ὅτι ἡμεῖς οἱ ζῶντες οἱ περιλειπόμενοι εἰς τὴν παρουσίαν τοῦ κυρίου οὐ μὴ φθάσωμεν τοὺς κοιμηθέντας·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/015.yaml
  text: 'For this we say to you by a word from the Lord: that we who are living[a], who remain until the coming of the Lord[c][b], will certainly not precede those who have fallen asleep.'
translation:
  language: sw
  text: 'Kwa maana tunawaambia hili kwa neno la Bwana[a]: sisi tulio hai, tutakaosalia mpaka kuja kwa Bwana[b], hakika hatutawatangulia wale waliolala[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa neno kutoka kwa Bwana.” Kigiriki kinaweza kurejelea ama usemi wa Bwana Yesu, ama ufunuo uliotolewa kwa mamlaka ya Bwana.
    reason: alternative_reading
  - marker: b
    text: Au, “kuwasili” au “kuwapo.” Neno la Kigiriki παρουσία linaweza kuwa na maana hizo, na hapa linarejelea kuja kwa Bwana wakati ujao.
    reason: lexical_alternative
  - marker: c
    text: “Wale waliolala” ni sitiari inayowarejelea waamini waliokufa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν λόγῳ κυρίου
  choice: kwa neno la Bwana
  rationale: Usemi huu unaonyesha msingi na mamlaka ya kauli ya Paulo bila kuamua kama ananukuu usemi wa Yesu au anarejelea ufunuo aliopewa kwa mamlaka ya Bwana.
- source_word: παρουσίαν
  choice: kuja
  rationale: Katika muktadha huu wa matukio ya mwisho, neno hili linarejelea kuwasili kwa Bwana; ‘kuja’ ni usemi wa kawaida na wazi katika Kiswahili.
- source_word: οἱ ζῶντες
  choice: sisi tulio hai
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya hali ya wale wanaoendelea kuwa hai.
- source_word: οἱ περιλειπόμενοι
  choice: tutakaosalia
  rationale: Neno hili linawataja wale watakaokuwa wamebaki hai mpaka wakati uliotajwa, bila kuingiza wazo la ziada la kunusurika katika hatari fulani.
- source_word: οὐ μὴ φθάσωμεν
  choice: hakika hatutawatangulia
  rationale: ‘Hakika ... hatuta-’ linaonyesha mkazo mkubwa wa ukanushaji wa Kigiriki, na ‘kuwatangulia’ linatoa maana ya kwenda mbele kabla ya wengine.
- source_word: τοὺς κοιμηθέντας
  choice: wale waliolala usingizi
  rationale: Tafsiri hii inadumisha sitiari ya kulala inayotumiwa kwa waamini waliokufa badala ya kuibadili moja kwa moja kuwa ‘wafu.’
- source_word: κύριος / κυρίου
  choice: Bwana
  rationale: ‘Bwana’ ndiyo tafsiri ya kawaida na yenye hadhi ya κύριος; hapa inamrejelea Yesu.
theological_decisions:
- issue: Asili ya ‘neno la Bwana’ analolitaja Paulo
  choice: Usemi umetafsiriwa bila kuamua njia hususa ambayo neno hilo lilifikishwa kwa Paulo.
  alternative: Kunukuu usemi unaojulikana wa Yesu, au kurejelea ufunuo wa kinabii aliopewa Paulo.
  rationale: Kigiriki kinathibitisha mamlaka ya Bwana lakini hakibainishi wazi ikiwa ni nukuu ya maneno ya Yesu au ufunuo mwingine uliotolewa kwa mamlaka yake.
- issue: Maana ya κοιμηθέντας
  choice: Sitiari ya kulala imedumishwa kwa wale waliokufa.
  alternative: Kutafsiri moja kwa moja ‘wafu.’
  rationale: Paulo mwenyewe anatumia sitiari hii, ambayo inahifadhi mtazamo wa kifungu kuhusu kifo na tumaini la ufufuo bila kuficha kwamba inawahusu waliokufa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo umehifadhi mkazo wa ukanushaji na sitiari ya kulala, huku sentensi ikibaki ya kawaida na yenye mtiririko mzuri.
