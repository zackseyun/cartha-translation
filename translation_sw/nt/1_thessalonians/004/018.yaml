  text: ὥστε παρακαλεῖτε ἀλλήλους ἐν τοῖς λόγοις τούτοις.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/018.yaml
  text: Therefore encourage one another with these words[a].
translation:
  language: sw
  text: Kwa hiyo, farijianeni kwa maneno haya[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “tianeni moyo kwa maneno haya.” Kitenzi hiki kinaweza kumaanisha kutia moyo, kufariji, au kuhimiza; hapa muktadha unasisitiza hasa faraja yenye kuwapa watu uhakikisho.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Kwa hiyo
  rationale: Kiunganishi hiki kinatoa hitimisho linalotokana na mafundisho yaliyotangulia kuhusu kuja kwa Bwana na kufufuliwa kwa waamini.
- source_word: παρακαλεῖτε
  choice: farijianeni
  rationale: Kitenzi kinaweza kumaanisha kutia moyo, kufariji, au kuhimiza. Katika muktadha wa huzuni kuhusu waamini waliokufa na tumaini la kuungana tena, “farijianeni” linaonyesha vizuri kusudi kuu la kuwapa uhakikisho, huku tanbihi ikihifadhi maana nyingine inayowezekana.
- source_word: ἀλλήλους
  choice: -aneni (katika “farijianeni”)
  rationale: Kiambishi cha kutendeana -an- huwasilisha kwa njia ya asili ya Kiswahili tendo la kila mmoja kumfanyia mwenzake.
- source_word: ἐν
  choice: kwa
  rationale: Hapa kihusishi kinaonyesha njia au chombo cha kufarijiana; “kwa maneno haya” ni usemi wa kawaida na wazi wa Kiswahili.
- source_word: τοῖς λόγοις τούτοις
  choice: maneno haya
  rationale: Kirai hiki kinarejelea kauli mahususi ambazo Paulo ametoka kuandika; “maneno haya” ni tafsiri ya moja kwa moja na yenye uwazi.
theological_decisions:
- issue: Nguvu ya kichungaji ya παρακαλεῖτε
  choice: farijianeni
  alternative: tianeni moyo; himizaneni
  rationale: Muktadha unalenga hasa kuwapa waamini faraja kuhusu waliokufa na tumaini la kukutana na Bwana. Hata hivyo, maana pana ya kutiana moyo haijaondolewa, bali imeelezwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye staha na kinachoeleweka kwa urahisi. Muundo wa kutendeana “farijianeni” unahifadhi amri ya wingi na maana ya kila mmoja kumfariji mwenzake.
