base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/014.yaml
  text: For if we believe that Jesus died and rose again[b][a], so also God will bring with him those who have fallen asleep through Jesus.
translation:
  language: sw
  text: Kwa maana ikiwa tunaamini kwamba Yesu alikufa na akafufuka, ndivyo pia Mungu atawaleta pamoja naye wale waliolala[a] kwa njia ya Yesu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wale waliokufa.” Katika muktadha huu, Paulo anatumia “kulala” kama sitiari ya kifo cha waamini.
    reason: lexical_alternative
  - marker: b
    text: Au “wale waliolala katika Yesu.” Kirai “kwa njia ya Yesu” (διὰ τοῦ Ἰησοῦ) kinaweza kueleweka kwa maana ya njia au utendaji, au kwa maana ya uhusiano wa karibu, “katika Yesu.”
    reason: alternative_reading
lexical_decisions:
- source_word: εἰ γὰρ
  choice: Kwa maana, ikiwa
  rationale: Inaonyesha kwamba sentensi hii inatoa msingi wa kauli iliyotangulia, huku ikidumisha muundo wa sharti.
- source_word: πιστεύομεν
  choice: tunaamini
  rationale: Ni tafsiri ya kawaida na ya asili kwa imani ya pamoja inayokiri kifo na ufufuo wa Yesu.
- source_word: ἀπέθανεν καὶ ἀνέστη
  choice: alikufa na akafufuka
  rationale: Vitenzi vya wakati uliopita vinaeleza matukio ya kifo na kufufuka kwa Yesu; “akafufuka” hudumisha hali ya kitenzi kisicho tendwa katika Kigiriki.
- source_word: οὕτως καὶ
  choice: vivyo hivyo pia
  rationale: Inadumisha uhusiano wa kulinganisha kati ya kufufuka kwa Yesu na tendo la Mungu kwa waamini waliokufa.
- source_word: τοὺς κοιμηθέντας
  choice: wale waliolala usingizi
  rationale: Inahifadhi sitiari ya Paulo ya usingizi kwa kifo badala ya kuifafanua moja kwa moja kuwa “waliokufa.”
- source_word: διὰ τοῦ Ἰησοῦ
  choice: kwa njia ya Yesu
  rationale: Hutoa maana ya msingi ya διά pamoja na jenitivi bila kufunga kabisa iwapo wazo kuu ni njia, utendaji, au uhusiano wa karibu na Yesu.
- source_word: ἄξει σὺν αὐτῷ
  choice: atawaleta pamoja naye
  rationale: Inaonyesha tendo la Mungu la kuwaleta na pia maana ya kuandamana iliyo katika σύν; kiwakilishi kinahifadhiwa kama katika Kigiriki.
theological_decisions:
- issue: Sitiari ya κοιμηθέντας kuhusu kifo
  choice: Kudumisha “waliolala usingizi” katika matini kuu
  alternative: wale waliokufa
  rationale: Sitiari hiyo ni muhimu katika muktadha wa huzuni na tumaini la ufufuo; tanbihi inaeleza maana yake bila kuiondoa katika matini.
- issue: Maana na uhusiano wa kisintaksia wa διὰ τοῦ Ἰησοῦ
  choice: kwa njia ya Yesu
  alternative: katika Yesu
  rationale: Kirai hicho kinaweza kueleweka kwa maana ya njia au utendaji, na pia kimetafsiriwa kuwa uhusiano wa karibu “katika Yesu.” Tafsiri kuu inafuata maana ya kawaida ya διά na jenitivi, huku tanbihi ikihifadhi uwezekano mwingine.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wazi kwa msomaji wa kawaida, huku sitiari ya kifo na utata halisi wa kirai cha Kigiriki vikihifadhiwa.
