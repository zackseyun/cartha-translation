  text: For God did not call us for uncleanness[b][a], but in holiness.
translation:
  language: sw
  text: Kwa maana Mungu hakutuita tuishi katika uchafu[a], bali katika utakatifu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutokuwa safi.” Neno la Kigiriki linaweza kumaanisha uchafu wa kimaadili, hasa uchafu wa kingono katika muktadha huu.
    reason: lexical_alternative
  - marker: b
    text: Au, “katika kutakaswa.” Neno la Kigiriki linaweza kumaanisha utakatifu kama hali au kutakaswa kama mchakato wa kufanywa mtakatifu.
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: Kwa maana
  rationale: Inaonyesha kwamba kauli hii ndiyo msingi wa himizo lililotangulia, kwa mtindo wa kawaida na wenye heshima katika Kiswahili.
- source_word: ἐκάλεσεν
  choice: hakutuita
  rationale: Wakati uliopita unaakisiwa kwa kitenzi cha wakati uliopita. Neno “kuita” linadumisha wazo la mwito wa Mungu bila kuingiza ufafanuzi maalumu wa kimadhehebu kuhusu namna mwito huo unavyotenda kazi.
- source_word: ἐπὶ ἀκαθαρσίᾳ
  choice: tuishi katika uchafu
  rationale: Kirai kinaonyesha kusudi au maisha yanayotawaliwa na uchafu. “Tuishi katika” kinafanya uhusiano huo uwe wa asili katika Kiswahili bila kuufanya uchafu kuwa wa kimwili tu.
- source_word: ἀκαθαρσίᾳ
  choice: uchafu
  rationale: “Uchafu” huhifadhi maana pana ya kutokuwa safi kimaadili, huku muktadha wa 4:3–8 ukidokeza hasa uchafu wa kingono.
- source_word: ἐν ἁγιασμῷ
  choice: katika utakatifu
  rationale: Huhifadhi wazo la hali au mazingira ya maisha matakatifu na pia uzito wa kiteolojia wa nomino ya Kigiriki.
- source_word: ἁγιασμῷ
  choice: utakatifu
  rationale: Neno la Kigiriki linaweza kuonyesha hali ya kuwa mtakatifu au tendo la kutakaswa. “Utakatifu” linafaa zaidi katika ulinganifu wa moja kwa moja na “uchafu,” huku maana nyingine ikitolewa katika tanbihi.
theological_decisions:
- issue: Maana ya mwito wa Mungu
  choice: Mwito halisi wa Mungu unaoweka msingi wa maisha matakatifu, bila kufafanua utaratibu wake kwa mfumo maalumu wa kiteolojia
  alternative: Mwaliko wa jumla tu, au mwito wenye matokeo kwa maana maalumu ya kitaalamu
  rationale: Aya inahusianisha wazi mwito wa Mungu na mwenendo mtakatifu, lakini haielezi hapa namna mwito huo unavyotenda kazi. Kwa hiyo “kuita” linahifadhi mvutano huo bila kuongeza fundisho lisilotajwa.
- issue: Hali au mchakato katika ἁγιασμός
  choice: Utakatifu kama hali na mazingira ya maisha
  alternative: Kutakaswa kama mchakato wa kufanywa mtakatifu
  rationale: Ulinganifu na “uchafu” unaelekeza zaidi kwenye hali au mwenendo wa maisha, lakini uwezekano wa mchakato unabaki halali na umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Kirai “tuishi katika” kinaweka wazi kwa njia ya kawaida wazo la maisha yanayoendana na mwito bila kuondoa nomino muhimu “uchafu” na “utakatifu.”
