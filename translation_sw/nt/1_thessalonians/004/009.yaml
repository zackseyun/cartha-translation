id: 1TH.4.9
reference: 1 Thessalonians 4:9
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Περὶ δὲ τῆς φιλαδελφίας οὐ χρείαν ἔχετε γράφειν ὑμῖν, αὐτοὶ γὰρ ὑμεῖς θεοδίδακτοί ἐστε εἰς τὸ ἀγαπᾶν ἀλλήλους·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/009.yaml
  text: Concerning brotherly love, you have no need for anyone to write to you, for you yourselves are taught by God to love one another.
translation:
  language: sw
  text: Kuhusu upendo wa kindugu[a], hamna haja ya mtu yeyote kuwaandikia[b], kwa maana ninyi wenyewe mmefundishwa na Mungu kupendana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, hasa zaidi, upendo kwa waamini wenzenu; neno la Kigiriki linatumia taswira ya watu wa familia moja katika jumuiya ya waamini.
    reason: lexical_alternative
  - marker: b
    text: Kigiriki hakimtaji wazi mtu anayewaandikia; kutokana na muktadha, inaweza pia kutafsiriwa, “hamna haja ya sisi kuwaandikia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ δὲ
  choice: Kuhusu
  rationale: Hutambulisha mada mpya kwa mwendelezo hafifu; Kiswahili cha kawaida hakihitaji kuongeza neno la wakati kama “sasa”.
- source_word: φιλαδελφίας
  choice: upendo wa kindugu
  rationale: Huhifadhi taswira ya kifamilia ya neno la Kigiriki na kuitofautisha na kitenzi ἀγαπᾶν kinachofuata.
- source_word: οὐ χρείαν ἔχετε γράφειν ὑμῖν
  choice: hamna haja ya mtu yeyote kuwaandikia
  rationale: Kiswahili huhitaji mtendaji wa kitenzi kisoukomo aeleweke wazi. “Mtu yeyote” hudumisha kutotajwa kwa mtendaji mahsusi katika Kigiriki badala ya kuingiza “sisi” moja kwa moja.
- source_word: αὐτοὶ γὰρ ὑμεῖς
  choice: kwa maana ninyi wenyewe
  rationale: “Ninyi wenyewe” huhifadhi msisitizo wa viwakilishi viwili vya Kigiriki.
- source_word: θεοδίδακτοί
  choice: mmefundishwa na Mungu
  rationale: Ni usemi wa asili na ulio wazi katika Kiswahili, huku ukihifadhi Mungu kuwa mtendaji wa kufundisha.
- source_word: εἰς τὸ ἀγαπᾶν ἀλλήλους
  choice: kupendana
  rationale: Hutoa kwa ufupi na kiasili maana ya kupenda mtu na mwenzake, bila kuondoa uhusiano wa kimaana na upendo.
theological_decisions:
- issue: Tofauti kati ya φιλαδελφία na ἀγαπᾶν katika mstari mmoja
  choice: Kutafsiri φιλαδελφία kuwa “upendo wa kindugu” na ἀγαπᾶν kuwa “kupendana.”
  alternative: Kutumia “upendo/kupenda” kwa maneno yote mawili bila taswira ya kindugu.
  rationale: 'Uamuzi huu huhifadhi tofauti ya msamiati wa Paulo: kwanza mapenzi ya kifamilia miongoni mwa waamini, kisha tendo pana la kupendana.'
- issue: Mtendaji aliyedokezwa wa γράφειν
  choice: Kusema “mtu yeyote kuwaandikia.”
  alternative: Kusema “sisi kuwaandikia.”
  rationale: Muktadha unaweza kuwadokeza Paulo na wenzake, lakini Kigiriki hakitaji mtendaji wa kitenzi hiki waziwazi; tafsiri iliyochaguliwa huhifadhi kutokuwa mahsusi huku ikiwa ya kawaida katika Kiswahili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Upendo wa kindugu” huhifadhi taswira ya kifamilia lakini tanbihi inafafanua kuwa inawahusu waamini wote, si wanaume pekee.
