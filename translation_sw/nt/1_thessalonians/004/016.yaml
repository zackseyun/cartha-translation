base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/016.yaml
  text: For the Lord himself will descend from heaven with a command[a], with the voice of an archangel, and with the trumpet of God, and the dead in Messiah will rise first[b],
translation:
  language: sw
  text: Kwa maana Bwana mwenyewe atashuka kutoka mbinguni kwa amri[a], kwa sauti ya malaika mkuu, na kwa tarumbeta ya Mungu; nao wafu walio katika Masihi watafufuka kwanza[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa kilio cha kuamuru.” Neno la Kigiriki κέλευσμα linaweza kumaanisha mwito au kilio chenye amri.
    reason: lexical_alternative
  - marker: b
    text: 'Tafsiri iliyozoeleka: “wafu walio katika Kristo watafufuka kwanza.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: Kwa maana
  rationale: Katika muktadha huu kiunganishi kinaanzisha sababu au ufafanuzi wa hakikisho lililotangulia; “Kwa maana” huonyesha uhusiano huo kwa Kiswahili cha kawaida.
- source_word: αὐτὸς ὁ κύριος
  choice: Bwana mwenyewe
  rationale: “Mwenyewe” huhifadhi msisitizo wa kiwakilishi αὐτός, huku κύριος ikitafsiriwa kwa cheo cha kawaida “Bwana.”
- source_word: ἐν κελεύσματι
  choice: kwa amri
  rationale: κέλευσμα ni amri au mwito wenye mamlaka, mara nyingi unaotolewa kwa sauti. “Kwa amri” ni fupi na aminifu; uwezekano wa kilio au mwito wa kuamuru umehifadhiwa katika tanbihi.
- source_word: ἐν φωνῇ ἀρχαγγέλου
  choice: kwa sauti ya malaika mkuu
  rationale: Huhifadhi maana ya φωνή na uhusiano wa kimilikishi wa ἀρχαγγέλου bila kudai kwamba ni malaika mkuu fulani aliyetajwa.
- source_word: ἐν σάλπιγγι θεοῦ
  choice: kwa tarumbeta ya Mungu
  rationale: “Tarumbeta” ni neno la sasa na linaloeleweka kwa σάλπιγξ; “ya Mungu” huhifadhi uhusiano wa kimilikishi wa Kigiriki.
- source_word: καταβήσεται ἀπ’ οὐρανοῦ
  choice: atashuka kutoka mbinguni
  rationale: Hutoa kwa uwazi mwendo wa kushuka na chanzo chake, huku ikidumisha hadhi ya lugha ya kifungu.
- source_word: οἱ νεκροὶ ἐν Χριστῷ
  choice: wafu walio katika Masihi
  rationale: “Wafu” hutoa kivumishi kilichotumika kama nomino, na “walio katika Masihi” huhifadhi usemi wa muungano ἐν Χριστῷ pamoja na maana ya Χριστός kama cheo.
- source_word: ἀναστήσονται πρῶτον
  choice: watafufuka kwanza
  rationale: Kitenzi cha Kiswahili “watafufuka” hueleza ufufuo kwa hali ya kutendeka yenyewe, na “kwanza” huhifadhi mpangilio unaolinganishwa na waumini walio hai katika mstari unaofuata.
theological_decisions:
- issue: Tafsiri ya Χριστῷ katika ἐν Χριστῷ
  choice: katika Masihi
  alternative: katika Kristo
  rationale: Χριστός hapa bado hubeba maana ya cheo cha Mtiwa-Mafuta; “Masihi” huitafsiri maana hiyo. “Kristo,” lililozoeleka sana katika mapokeo ya Kiswahili, limetolewa katika tanbihi bila kulifanya kuwa tafsiri kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo unafuata kwa karibu mfululizo wa vishazi vya Kigiriki lakini unatumia viunganishi na upatanisho wa kawaida wa Kiswahili. Alama zote za tanbihi zimewekwa katika matini kuu.
