id: 1TH.4.1
reference: 1 Thessalonians 4:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Λοιπὸν ⸀οὖν, ἀδελφοί, ἐρωτῶμεν ὑμᾶς καὶ παρακαλοῦμεν ἐν κυρίῳ Ἰησοῦ, ⸀ἵνα καθὼς παρελάβετε παρ’ ἡμῶν τὸ πῶς δεῖ ὑμᾶς περιπατεῖν καὶ ἀρέσκειν θεῷ, ⸂καθὼς καὶ περιπατεῖτε⸃, ἵνα περισσεύητε μᾶλλον.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/001.yaml
  text: Finally then[a], brothers, we ask and urge you in the Lord Jesus that, just as you received from us how you ought to walk and to please God, just as you are also walking, you abound more and more.
translation:
  language: sw
  text: Basi, ndugu[a], tunawaomba na kuwasihi katika Bwana Yesu kwamba, kama mlivyopokea kutoka kwetu jinsi iwapasavyo kuenenda na kumpendeza Mungu—kama vile mnavyoenenda sasa—mzidi kufanya hivyo zaidi na zaidi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki lina maana ya “ndugu”; hapa linawahusu waumini wote, wanaume na wanawake.
    reason: lexical_alternative
lexical_decisions:
- source_word: Λοιπὸν οὖν
  choice: Basi
  rationale: Katika muktadha huu huonyesha mpito kwenda kwenye mawaidha yanayofuata. “Basi” ni ya asili katika Kiswahili na huhifadhi nguvu ya uendelezaji na hitimisho bila kudokeza kwamba barua iko karibu kabisa kumalizika.
- source_word: ἀδελφοί
  choice: ndugu
  rationale: “Ndugu” ni neno la kawaida la Kiswahili linaloweza kuwaita waumini wote, wanaume na wanawake, huku likihifadhi lugha ya uhusiano wa kifamilia.
- source_word: ἐρωτῶμεν ὑμᾶς καὶ παρακαλοῦμεν
  choice: tunawaomba na kuwasihi
  rationale: Jozi hii huhifadhi ombi la upole pamoja na uzito wa himizo; “kuwasihi” ni yenye nguvu zaidi kuliko “kuwatia moyo” katika muktadha huu.
- source_word: ἐν κυρίῳ Ἰησοῦ
  choice: katika Bwana Yesu
  rationale: Huhifadhi kihusishi cha Kigiriki na cheo cha Kristo. Kauli inaweza kuonyesha mazingira na mamlaka ambayo ndani yake ombi hilo linatolewa.
- source_word: καθὼς παρελάβετε παρ’ ἡμῶν
  choice: kama mlivyopokea kutoka kwetu
  rationale: “Kupokea” hudumisha wazo la kupokea mafundisho au mapokeo kutoka kwa mitume bila kulipunguza kuwa kujifunza tu.
- source_word: τὸ πῶς δεῖ ὑμᾶς περιπατεῖν
  choice: jinsi iwapasavyo kuenenda
  rationale: “Kuenenda” huhifadhi sitiari ya Paulo ya kutembea kama mwenendo wa maisha, na “iwapasavyo” huonyesha ulazima wa kimaadili wa δεῖ.
- source_word: καὶ ἀρέσκειν θεῷ
  choice: na kumpendeza Mungu
  rationale: Ni tafsiri ya moja kwa moja, ya asili, na yenye heshima ya infinitivu ya Kigiriki.
- source_word: καθὼς καὶ περιπατεῖτε
  choice: kama vile mnavyoenenda sasa
  rationale: Hutambua wazi kwamba tayari wanaishi kwa namna hiyo. “Sasa” huwasilisha hali inayoendelea ya wakati uliopo bila kubadili maana.
- source_word: ἵνα περισσεύητε μᾶλλον
  choice: mzidi kufanya hivyo zaidi na zaidi
  rationale: Kitenzi περισσεύω hapa kinahimiza maendeleo yanayozidi hali yao ya sasa. “Kufanya hivyo” hurejelea mwenendo wa kumpendeza Mungu kwa Kiswahili cha asili, na “zaidi na zaidi” huhifadhi msisitizo wa μᾶλλον.
theological_decisions:
- issue: Wanaolengwa na neno ἀδελφοί
  choice: ndugu katika matini, pamoja na tanbihi inayofafanua ujumuishi wake
  alternative: ndugu wa kiume na wa kike
  rationale: Nomino ya Kigiriki ina umbo la wingi wa kiume lakini katika muktadha huu inaelekea kulihusu kusanyiko lote. Kiswahili “ndugu” ni cha kijinsia pana; tanbihi huhifadhi taarifa kuhusu umbo la Kigiriki.
- issue: Cheo κύριος kinapotumiwa kwa Yesu
  choice: Bwana
  alternative: Mkuu
  rationale: “Bwana” ni tafsiri ya kawaida, yenye heshima na uzito wa kikristo kwa κύριος, bila kudhoofisha hadhi ya Yesu katika kifungu.
- issue: Sitiari ya περιπατεῖν kuhusu mwenendo wa maisha
  choice: kuenenda
  alternative: kuishi
  rationale: “Kuenenda” huhifadhi sitiari ya chanzo na matumizi yake ya kimaadili, huku muktadha ukiifanya maana yake ya mwenendo wa maisha ieleweke.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umefanywa usomeke kwa kawaida kwa kutumia vistari kutenga kauli ya kutambua mwenendo wao wa sasa, huku marudio na msisitizo wa chanzo yakihifadhiwa.
