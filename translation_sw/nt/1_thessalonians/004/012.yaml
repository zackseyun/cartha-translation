  text: so that you may walk properly before outsiders and have need of nothing[a].
translation:
  language: sw
  text: ili mwenende kwa ustahivu mbele ya walio nje, na msiwe na uhitaji wa kitu chochote.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “msiwe na uhitaji wa mtu yeyote.” Kishazi hiki kinaweza kukazia kutowategemea wengine.
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: ili
  rationale: Huonyesha kusudi au matokeo yanayotokana na mausia yaliyotangulia; “ili” ni ya kawaida na huhifadhi nguvu hiyo.
- source_word: περιπατῆτε
  choice: mwenende
  rationale: Huhifadhi sitiari ya kutembea kwa maana ya mwenendo wa maisha, huku ikiwa lugha yenye heshima na inayoeleweka katika Kiswahili.
- source_word: εὐσχημόνως
  choice: kwa heshima
  rationale: Huonyesha mwenendo unaofaa na wenye kustahili kuheshimiwa mbele ya jamii; ni ya asili zaidi kuliko tafsiri ya neno kwa neno kama “kwa uzuri wa sura.”
- source_word: πρὸς τοὺς ἔξω
  choice: mbele ya walio nje
  rationale: Huhifadhi mtazamo wa kijamii na wa hadharani, pamoja na usemi wa Wakristo wa kwanza kuhusu watu walio nje ya jumuiya, bila kuwawekea jina kali zaidi.
- source_word: μηδενὸς χρείαν ἔχητε
  choice: msiwe na uhitaji wa kitu chochote
  rationale: Hufuata maana ya kawaida ya kisarufi ya kutopungukiwa na kitu, huku muktadha ukidokeza kutojitegemeza isivyofaa kwa wengine.
theological_decisions:
- issue: Maana ya kishazi cha mwisho μηδενὸς χρείαν ἔχητε
  choice: msiwe na uhitaji wa kitu chochote
  alternative: msiwe na uhitaji wa mtu yeyote
  rationale: Kisarufi, maana ya “kitu chochote” ndiyo ya moja kwa moja zaidi. Hata hivyo, muktadha wa kufanya kazi kwa mikono unaruhusu wazo la kutowategemea wengine, kwa hiyo uwezekano huo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Mwenende” huhifadhi sitiari ya Kigiriki bila kufanya sentensi kuwa ngumu; “walio nje” huhifadhi utata wa usemi wa asili badala ya kuufafanua moja kwa moja kuwa “wasioamini.”
