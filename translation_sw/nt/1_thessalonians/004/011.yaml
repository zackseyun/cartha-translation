    rationale: Kwa kawaida “mambo yenu” hutosha kuwasilisha τὰ ἴδια; kuongeza “wenyewe” mahali hapo kunaweza kuonekana kama kurejelea ninyi mnaoshughulika, si ‘mambo yenu binafsi.’ “Kushughulikia mambo yenu” hutafsiri idiomu ya Kigiriki kwa uwazi zaidi.
