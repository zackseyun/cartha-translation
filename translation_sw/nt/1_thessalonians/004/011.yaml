lexical_decisions:
- source_word: φιλοτιμεῖσθαι
  choice: mjitahidi
  rationale: Kitenzi hiki huonyesha kufanya jambo kuwa lengo la heshima na kulifuatilia kwa bidii. “Mjitahidi” ni Kiswahili cha kawaida kinachohifadhi wazo la juhudi, ingawa wazo la ‘kuwa na tamaa kuu’ linafafanuliwa katika tanbihi.
- source_word: ἡσυχάζειν
  choice: kuishi kwa utulivu
  rationale: Katika muktadha huu maana si kunyamaza kabisa, bali kuendesha maisha ya utulivu yasiyo na fujo; tafsiri hii inaeleweka kwa urahisi katika Kiswahili cha sasa.
- source_word: πράσσειν τὰ ἴδια
  choice: kushughulika na mambo yenu wenyewe
  rationale: Kirai hiki kinamaanisha kutunza au kufanya mambo yanayomhusu mtu mwenyewe. Chaguo hili ni la kawaida na halina ukali unaoweza kupatikana katika kauli ya ‘kutazama shughuli zenu wenyewe.’
- source_word: ἐργάζεσθαι
  choice: kufanya kazi
  rationale: Hii ndiyo tafsiri pana, ya kawaida, na ya moja kwa moja ya kitenzi kinachomaanisha kufanya kazi au kutenda kazi.
- source_word: ταῖς χερσὶν ὑμῶν
  choice: kwa mikono yenu wenyewe
  rationale: Umbo la Kiyunani linaonyesha chombo cha kutendea, na kiwakilishi cha umilikaji kinasisitiza kufanya kazi kwa mikono yao wenyewe.
- source_word: καθὼς
  choice: kama
  rationale: Huanzisha ulinganisho na maagizo waliyokuwa wamepewa hapo awali. “Kama” ni ya asili na sahihi katika Kiswahili.
- source_word: παρηγγείλαμεν
  choice: tulivyowaagiza
  rationale: Kitenzi kina nguvu ya kutoa agizo lenye mamlaka. “Waagiza” huhifadhi uzito huo bila kutumia lugha ngumu isiyo ya kawaida.
theological_decisions:
- issue: Nguvu ya kimaadili ya maagizo ya kitume
  choice: tulivyowaagiza
  alternative: tulivyowafundisha; tulivyowaelekeza
  rationale: Tafsiri hii huhifadhi mamlaka halisi ya nasaha ya kitume iliyomo katika παραγγέλλω, bila kuongeza msimamo wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo unaendeleza mfululizo wa vitenzi vya mstari uliotangulia, na koma ya mwisho inaonyesha kwamba sentensi inaendelea katika mstari unaofuata.
