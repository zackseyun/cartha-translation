base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/011.yaml
  text: and to aspire to live quietly[a], to mind your own affairs, and to work with your own hands, just as we commanded you[b],
translation:
  language: sw
  text: na mjitahidi kuishi kwa utulivu,[a] kushughulikia mambo yenu,[b] na kufanya kazi kwa mikono yenu wenyewe, kama tulivyowaagiza,
  philosophy: optimal-equivalence
