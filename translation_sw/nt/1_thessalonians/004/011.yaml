  source_fidelity: 'Tafsiri inafuata mfululizo wa infinitivu za Kigiriki kwa uaminifu: φιλοτιμεῖσθαι inaonyeshwa kwa “mjitahidi,” ἡσυχάζειν kwa “kuishi kwa utulivu,” na ἐργάζεσθαι ... ταῖς χερσὶν ὑμῶν kwa “kufanya kazi kwa mikono yenu wenyewe.” “Tulivyowaagiza” huhifadhi vizuri nguvu ya παρηγγείλαμεν. Marekebisho madogo yanahitajika ili πράσσειν τὰ ἴδια isisomeke kwa utata katika Kiswahili.'
  naturalness: '“Kushughulika na mambo yenu wenyewe” si laini katika Kiswahili Sanifu: “wenyewe” baada ya “mambo yenu” inaweza kusomeka kama kurejelea watendaji, badala ya kusisitiza mambo yao binafsi. “Kushughulikia mambo yenu” ni ya asili, wazi, na tayari huonyesha ‘mambo yao wenyewe’ kupitia umilikaji “yenu.” Tanbihi (a) pia inahitaji mpangilio wa kisarufi ulio wazi zaidi.'
  terminology: 'Istilahi za maadili na mamlaka ya kitume zinafaa: “utulivu,” “mambo yenu,” “kufanya kazi,” na “kuwaagiza” ni za kisasa, zenye heshima, na zisizo na mzigo wa kimadhehebu. “Kwa mikono yenu wenyewe” kwa usahihi huhifadhi msisitizo wa umilikaji katika Kigiriki.'
