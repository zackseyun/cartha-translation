  text: καὶ γὰρ ποιεῖτε αὐτὸ εἰς πάντας τοὺς ἀδελφοὺς τοὺς ἐν ὅλῃ τῇ Μακεδονίᾳ. παρακαλοῦμεν δὲ ὑμᾶς, ἀδελφοί, περισσεύειν μᾶλλον,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/010.yaml
  text: For indeed you are doing this toward all the brothers throughout all Macedonia. But we urge you[a], brothers, to abound still more,
translation:
  language: sw
  text: Kwa maana mnafanya hivyo kwa ndugu[a] wote katika Makedonia yote. Lakini tunawasihi, ndugu, mzidi kufanya hivyo hata zaidi,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ndugu” hapa hurejelea waamini wenzao na yaelekea inajumuisha wanaume na wanawake katika makusanyiko.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Kwa maana
  rationale: Kirai hiki kinaeleza na kusisitiza uthibitisho wa sifa iliyotangulia; “Kwa maana” ni kiunganishi cha kawaida na cha asili katika Kiswahili.
- source_word: ποιεῖτε αὐτὸ
  choice: ndivyo mnavyowatendea
  rationale: Kitenzi cha wakati uliopo kinaonyesha tendo linaloendelea, na “ndivyo” kinarejelea upendo wa kindugu uliotajwa kabla. Muundo huu ni wa asili kwa tendo linaloelekezwa kwa watu.
- source_word: εἰς πάντας τοὺς ἀδελφοὺς
  choice: ndugu wote
  rationale: Katika muktadha huu εἰς huonyesha watu wanaopokea tendo hilo. “Ndugu” huhifadhi taswira ya kifamilia ya jumuiya ya waamini.
- source_word: τοὺς ἐν ὅλῃ τῇ Μακεδονίᾳ
  choice: katika Makedonia yote
  rationale: Tafsiri hii huhifadhi upana wa kijiografia unaoonyeshwa na ὅλῃ bila kuongeza maelezo yasiyokuwapo katika chanzo.
- source_word: παρακαλοῦμεν δὲ ὑμᾶς
  choice: Lakini tunawasihi
  rationale: παρακαλέω hapa ni ombi lenye uzito au himizo; “tunawasihi” ni ya heshima na ya kawaida. “Lakini” huonyesha mpito mdogo kutoka pongezi kwenda himizo zaidi.
- source_word: περισσεύειν μᾶλλον
  choice: mzidi kufanya hivyo hata zaidi
  rationale: περισσεύω huonyesha kuongezeka au kuvuka kiwango cha sasa, na μᾶλλον huongeza ulinganisho. Kiswahili hiki kinaeleweka kwa urahisi na kinarejelea tendo lililotajwa bila kulifafanua zaidi ya chanzo.
theological_decisions:
- issue: Upeo wa ἀδελφούς/ἀδελφοί katika jumuiya ya waamini yenye wanaume na wanawake
  choice: ndugu
  alternative: ndugu wa kiume na wa kike; waamini wenzenu
  rationale: “Ndugu” katika Kiswahili inaweza kutumiwa kwa jumuiya nzima ya kifamilia na huhifadhi lugha ya undugu ya Paulo. Tanbihi inaweka wazi kwamba katika muktadha huu neno hilo huenda linawahusisha waamini wa jinsia zote.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Koma ya mwisho imehifadhiwa kwa sababu sentensi na himizo vinaendelea katika mstari unaofuata.
