  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Οὐ θέλομεν δὲ ὑμᾶς ἀγνοεῖν, ἀδελφοί, περὶ τῶν ⸀κοιμωμένων, ἵνα μὴ λυπῆσθε καθὼς καὶ οἱ λοιποὶ οἱ μὴ ἔχοντες ἐλπίδα.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/013.yaml
  text: But we do not want you to be uninformed[a], brothers, about those who have fallen asleep, so that you may not grieve as the rest do[b], who have no hope.
translation:
  language: sw
  text: Lakini hatupendi, ndugu[b], msiwe bila kujua kuhusu wale waliolala[a], ili msihuzunike kama wale wengine ambao hawana tumaini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Kulala” hapa ni sitiari ambayo Paulo anaitumia kwa waumini waliokufa.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kigiriki lililotafsiriwa “ndugu” lina umbo la wingi wa kiume, lakini hapa linaelekea kuzungumzia kusanyiko lote, wanaume na wanawake.
    reason: cultural_note
lexical_decisions:
- source_word: Οὐ θέλομεν δὲ
  choice: Lakini hatutaki
  rationale: δέ ni kiunganishi chenye mpito au utofautishaji mdogo; “lakini” linaonyesha mpito huo bila kuufanya kuwa mkali kupita kiasi.
- source_word: ὑμᾶς ἀγνοεῖν
  choice: mkose kujua
  rationale: ἀγνοεῖν humaanisha kutokujua au kutokuwa na habari. “Mkose kujua” ni Kiswahili cha sasa kisicho na dharau na kinaendana vizuri na muundo hasi wa sentensi.
- source_word: ἀδελφοί
  choice: ndugu
  rationale: “Ndugu” ndilo neno la kawaida na lenye heshima katika Kiswahili kwa kuzungumzia waumini wenza; katika matumizi ya Kiswahili linaweza kuwahusu wanaume na wanawake, huku tanbihi ikieleza umbo la Kigiriki.
- source_word: περὶ τῶν κοιμωμένων
  choice: kuhusu wale waliolala
  rationale: Tafsiri hii inadumisha sitiari ya kulala badala ya kuibadilisha moja kwa moja kuwa “waliokufa.” Katika muktadha inawahusu waumini waliokufa na inaelekeza kwenye tumaini la ufufuo.
- source_word: ἵνα μὴ λυπῆσθε
  choice: ili msihuzunike
  rationale: ἵνα pamoja na hali tegemezi huonyesha kusudi au matokeo yaliyokusudiwa. “Ili msihuzunike” ni ya kawaida na haimaanishi kwamba huzuni yote imekatazwa; namna ya kuhuzunika ndiyo inayolinganishwa.
- source_word: καθὼς καὶ οἱ λοιποὶ
  choice: kama wale wengine
  rationale: οἱ λοιποί ni watu wengine walio nje ya jumuiya ya waumini katika utofautishaji huu. “Wale wengine” ni wazi na ya asili katika Kiswahili.
- source_word: οἱ μὴ ἔχοντες ἐλπίδα
  choice: ambao hawana tumaini
  rationale: Hii ni tafsiri ya moja kwa moja ya kishazi shirikishi na inadumisha utofautishaji wa Paulo kuhusu tumaini.
theological_decisions:
- issue: Maana ya κοιμωμένων katika muktadha wa mambo ya mwisho
  choice: Kudumisha sitiari kwa kusema “wale waliolala.”
  alternative: wale waliokufa
  rationale: Paulo anatumia kwa makusudi sitiari ya kulala kwa waumini waliokufa katika muktadha wa tumaini la ufufuo. Kudumisha sitiari kunahifadhi uzito wake wa kitheolojia bila kuamua zaidi ya maneno ya chanzo.
- issue: Upeo wa ἀδελφοί
  choice: Kutumia “ndugu” katika matini na kueleza upeo wake katika tanbihi.
  alternative: ndugu wa kiume; ndugu wanaume na wanawake
  rationale: Neno la Kigiriki lina umbo la wingi wa kiume lakini hapa linaelekea kulihutubia kusanyiko lote. “Ndugu” ni usemi wa kawaida wa Kiswahili unaoweza kulihusu kundi lote bila kuongeza maneno yasiyokuwamo wazi katika Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Muundo umewekwa wa kawaida kwa Kiswahili huku sitiari, kusudi la kichungaji, na utofautishaji kuhusu tumaini vikihifadhiwa.
