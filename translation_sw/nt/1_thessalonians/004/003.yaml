  text: 'For this is the will of God: your sanctification—that you abstain from sexual immorality[a][b].'
translation:
  language: sw
  text: 'Kwa maana, mapenzi ya Mungu ni haya: kutakaswa kwenu, yaani kujiepusha na uasherati[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “utakatifu wenu.”
    reason: lexical_alternative
  - marker: b
    text: Kigiriki porneia; neno pana linalomaanisha mwenendo wa kingono usio halali.
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλημα
  choice: mapenzi
  rationale: “Mapenzi” ndilo neno la kawaida na la asili katika Kiswahili kwa kusudi au matakwa ya Mungu yenye mamlaka; hapa halidhoofishi maana kuwa tamaa tu wala halibani maana kuwa azimio lisiloweza kubadilika.
- source_word: ὁ ἁγιασμὸς ὑμῶν
  choice: kutakaswa kwenu
  rationale: “Kutakaswa kwenu” linahifadhi wazo la kutengwa kwa ajili ya Mungu na kuishi maisha matakatifu, huku likiruhusu ἁγιασμός kueleweka kama hali na pia mchakato. “Utakatifu wenu” limetolewa katika tanbihi kama uwezekano halali.
- source_word: ἀπέχεσθαι
  choice: kwamba mjiepushe
  rationale: Kishazi hiki kinafafanua kwa uwazi kile ambacho kutakaswa kwao kunahusisha katika muktadha huu. “Mjiepushe” ni Kiswahili cha sasa na cha kawaida kinachoonyesha kujitenga kwa makusudi.
- source_word: πορνείας
  choice: uasherati
  rationale: “Uasherati” ni istilahi fupi, yenye hadhi, na inayoeleweka kwa mwenendo wa kingono usio halali. Tanbihi inaeleza kwamba neno la Kigiriki lina maana pana kuliko aina moja tu ya dhambi ya ngono.
- source_word: γάρ
  choice: Kwa maana
  rationale: “Kwa maana” linaonyesha kwamba mstari huu unatoa msingi wa maonyo yaliyotangulia, kama γάρ inavyofanya katika mfuatano wa hoja.
theological_decisions:
- issue: Maana ya ἁγιασμός katika himizo la kimaadili
  choice: Imetafsiriwa “kutakaswa kwenu,” na kishazi kinachofuata kinaonyesha sehemu ya maudhui yake ya kimaadili.
  alternative: “utakatifu wenu”
  rationale: Uamuzi huu unahifadhi upana wa neno la Paulo bila kulifanya liwe tu hadhi ya kiroho au tu mchakato wa kimaadili; pia unaacha kishazi kinachofuata kifafanue matumizi yake katika suala la mwenendo wa kingono.
- issue: Upeo wa πορνεία
  choice: Imetafsiriwa kwa upana kuwa “uasherati.”
  alternative: “zinaa” au “mwenendo mpotovu wa kingono”
  rationale: Neno la Kigiriki linaweza kujumuisha mwenendo mbalimbali wa kingono usio halali. “Zinaa” huenda likaeleweka kwa namna nyembamba zaidi, ilhali ufafanuzi mrefu katika matini ungeongeza maelezo yasiyokuwamo moja kwa moja katika neno lenyewe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi unahifadhi uhusiano wa sababu unaoletwa na γάρ na unaonyesha kwamba kishazi cha mwisho kinafafanua “kutakaswa kwenu.”
