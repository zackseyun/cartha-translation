  text: εἰδέναι ἕκαστον ὑμῶν τὸ ἑαυτοῦ σκεῦος κτᾶσθαι ἐν ἁγιασμῷ καὶ τιμῇ,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/004.yaml
  text: that each of you know how to acquire his own vessel in holiness and honor,
translation:
  language: sw
  text: kila mmoja wenu ajue jinsi ya kujipatia chombo chake mwenyewe katika utakatifu na heshima,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Chombo chake mwenyewe” huenda kinamaanisha mwili wake mwenyewe; au huenda kinamaanisha mke. Neno la Kigiriki lililotafsiriwa “kujipatia” linaweza pia kueleweka kuwa “kukimiliki” au “kukidhibiti.”
    reason: Explains the two principal interpretations of σκεῦος and the lexical uncertainty surrounding κτᾶσθαι without resolving either in the main text.
lexical_decisions:
- source_word: εἰδέναι
  choice: ajue jinsi ya
  rationale: Infinitive expressing what is required of each person; this idiomatic Swahili wording conveys practical knowledge or ability.
- source_word: ἕκαστον ὑμῶν
  choice: kila mmoja wenu
  rationale: Direct and natural equivalent preserving the distributive force.
- source_word: τὸ ἑαυτοῦ σκεῦος
  choice: chombo chake mwenyewe
  rationale: Preserves the source metaphor and its genuine ambiguity rather than deciding whether it means one's body or a wife.
- source_word: κτᾶσθαι
  choice: kujipatia
  rationale: Reflects the verb's acquisitive sense, consistent with the audited consultation layer's 'acquire,' while remaining natural in Swahili.
- source_word: ἐν ἁγιασμῷ καὶ τιμῇ
  choice: katika utakatifu na heshima
  rationale: Closely preserves both coordinated ethical-theological nouns and their manner or sphere.
theological_decisions:
- issue: Meaning of σκεῦος
  choice: Retain the metaphor as “chombo chake mwenyewe.”
  alternative: Interpret explicitly as “mwili wake mwenyewe” or as acquiring/taking a wife.
  rationale: The Greek expression is disputed and can be understood with reference to one's body or a wife. The main text should not silently settle that ambiguity.
- issue: Force of κτᾶσθαι
  choice: Render as “kujipatia” (acquire for oneself).
  alternative: “kukimiliki/kukidhibiti” (possess or control).
  rationale: The present infinitive of κτάομαι most directly conveys acquiring or obtaining, though an extended possessive/control sense is possible in context.
translation_notes:
  register: Standard East African Swahili; dignified and accessible. The wording retains the compact syntax and metaphor of the Greek while the footnote makes the unavoidable ambiguity transparent.
