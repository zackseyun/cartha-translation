lexical_decisions:
- source_word: μὴ ἐν πάθει ἐπιθυμίας
  choice: si kwa tamaa yenye nguvu
  rationale: Kirai hiki kinaeleza namna isiyofaa ya kuishi katika muktadha wa maadili ya ngono. Tafsiri hii ni ya kawaida kwa Kiswahili na inabeba wazo la tamaa inayotawala, ingawa nomino mbili za Kigiriki zimewasilishwa kwa nomino na kivumishi.
- source_word: καθάπερ καὶ
  choice: kama walivyo pia
  rationale: Huhifadhi ulinganisho na nguvu ya καὶ, huku kitenzi kinachodokezwa katika Kigiriki kikielezwa kwa Kiswahili cha kawaida.
- source_word: τὰ ἔθνη
  choice: watu wa mataifa
  rationale: Katika matumizi ya Paulo, neno hili mara nyingi humaanisha watu wasio Wayahudi. 'Watu wa mataifa' huhifadhi maana hiyo bila kuongeza dharau inayoweza kudokezwa na neno la kufasiri zaidi kama 'wapagani'.
- source_word: τὰ μὴ εἰδότα τὸν θεόν
  choice: wasiomjua Mungu
  rationale: Kishiriki cha Kigiriki kinaeleza hali inayoendelea ya watu hao; muundo huu ni mfupi, wa asili, na sahihi kwa Kiswahili.
theological_decisions:
- issue: Maana ya πάθει ἐπιθυμίας katika muktadha wa maadili ya ngono
  choice: tamaa yenye nguvu
  alternative: ashiki ya tamaa; tamaa kali ya ngono
  rationale: Chaguo kuu linaonyesha tamaa yenye nguvu na isiyodhibitiwa bila kuifanya tafsiri kuwa ya ufafanuzi kupita kiasi. Tanbihi huhifadhi muundo wa nomino mbili na maana ya kingono inayowezekana katika muktadha.
- issue: Utambulisho wa τὰ ἔθνη
  choice: watu wa mataifa
  alternative: mataifa; wapagani
  rationale: Hili huhifadhi kundi la kikabila na kidini linalotajwa na Paulo. 'Wapagani' lingesisitiza tafsiri ya kidini, ilhali 'mataifa' peke yake linaweza kueleweka kwa upana mno katika Kiswahili cha leo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni kipande kinachoendeleza himizo la mstari uliotangulia; koma ya mwisho imehifadhiwa kwa sababu kifungu kinaendelea.
