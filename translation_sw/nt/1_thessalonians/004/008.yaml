base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/008.yaml
  text: Therefore[a], whoever rejects this rejects not man but God[b], who also gives his Holy Spirit to you.
translation:
  language: sw
  text: Kwa hiyo, anayekataa haya[a] hamkatai mwanadamu, bali anamkataa Mungu, ambaye pia huwapa Roho wake Mtakatifu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “anayepuuza haya.” Kitenzi cha Kiyunani kinaweza kumaanisha kukataa, kupuuza, au kuweka kando.
    reason: lexical_alternative
  - marker: b
    text: Au, “ambaye pia huwapa Roho wake Mtakatifu ndani yenu.” Kihusishi cha Kiyunani ni, kwa maana ya msingi, “ndani ya,” ingawa Kiswahili cha kawaida hapa husema “huwapa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοιγαροῦν
  choice: Kwa hiyo
  rationale: Kiunganishi hiki kinaonyesha hitimisho linalotokana na mausia yaliyotangulia; “Kwa hiyo” ni Kiswahili cha kawaida kinachohifadhi nguvu hiyo ya kimantiki.
- source_word: ὁ ἀθετῶν / ἀθετεῖ
  choice: anayekataa ... hamkatai
  rationale: Kirai chenye participio kina maana ya jumla, yaani mtu yeyote anayefanya hivyo. “Kukataa” kinafaa kwa maana ya kupuuza, kuweka kando, au kukataa maagizo yenye mamlaka, na kinahifadhi urudiaji wa kitenzi katika Kiyunani.
- source_word: οὐκ ἄνθρωπον ... ἀλλὰ τὸν θεόν
  choice: hamkatai mwanadamu, bali anamkataa Mungu
  rationale: “Mwanadamu” hapa ni jina la jumla, si rejeo kwa mwanamume pekee. Muundo huu unahifadhi utofautishaji mkali kati ya mwanadamu na Mungu.
- source_word: τὸν καὶ διδόντα
  choice: ambaye pia huwapa
  rationale: Participio ya wakati wa sasa imetafsiriwa kwa kishazi tegemezi cha kawaida katika Kiswahili. “Pia” linaakisi καί, na “huwapa” linaweza kuonyesha tendo la Mungu linaloendelea au la kawaida bila kulifunga kwa wakati mmoja tu.
- source_word: τὸ πνεῦμα αὐτοῦ τὸ ἅγιον
  choice: Roho wake Mtakatifu
  rationale: Mpangilio huu unamtaja Roho Mtakatifu wa Mungu. Herufi kubwa zinaonyesha kuwa ni jina la rejeo maalumu bila kuongeza maelezo ya kimadhehebu.
- source_word: εἰς ὑμᾶς
  choice: huwapa
  rationale: Kiambishi “-wa-” katika “huwapa” kinaonyesha walengwa wa wingi, yaani “ninyi.” Ingawa εἰς kwa kawaida inaweza kumaanisha “ndani ya,” pamoja na kitenzi “kutoa” Kiswahili cha asili hutumia “kuwapa.”
- source_word: implicit object of ἀθετῶν
  choice: haya
  rationale: Kiyunani hakitaji nomino baada ya participio, lakini muktadha unaelekeza kwenye mausia yaliyotangulia. “Haya” linafanya rejeo hilo lieleweke kwa Kiswahili bila kulibainisha zaidi kuwa “agizo” au “fundisho.”
theological_decisions:
- issue: Rejeo la “Roho wake Mtakatifu”
  choice: Kirai hiki kinamtaja Roho Mtakatifu anayetolewa na Mungu kwa waamini.
  alternative: roho takatifu kama kipawa au mwelekeo usio wa kibinafsi
  rationale: Muundo τὸ πνεῦμα αὐτοῦ τὸ ἅγιον katika muktadha wa Paulo unaelekea kwa Roho Mtakatifu wa Mungu. Tafsiri haiongezi ufafanuzi wa kimafundisho usiotajwa katika mstari.
- issue: Maana ya jumla ya ὁ ἀθετῶν
  choice: “anayekataa” limetumiwa kwa mtu yeyote anayekataa, bila kuhusisha wanaume pekee.
  alternative: “yule anayekataa” au usemi unaoweza kueleweka kuwa wa jinsia ya kiume pekee
  rationale: Umoja wa kiume katika Kiyunani hapa ni wa jumla na wa uwakilishi. Kiswahili “anayekataa” kinahifadhi maana hiyo bila kuweka kikomo cha kijinsia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imehifadhi utofautishaji na urudiaji wa kitenzi katika Kiyunani, huku “haya” likirejelea mausia yaliyotangulia bila kuongeza maelezo yasiyokuwamo wazi katika mstari.
