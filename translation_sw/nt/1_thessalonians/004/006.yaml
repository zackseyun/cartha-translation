base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/006.yaml
  text: that no one should overstep and exploit his brother in this matter[a], because the Lord is an avenger concerning all these things[b], just as we also told you beforehand and solemnly warned you.
translation:
  language: sw
  text: mtu yeyote asivuke mipaka na kumdhulumu ndugu yake katika jambo hili[a], kwa sababu Bwana ndiye anayelipiza kisasi kuhusu mambo haya yote, kama tulivyowaambia hapo awali na kuwaonya kwa uzito.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kumtapeli ndugu yake katika jambo hilo.” Kitenzi cha Kigiriki kinaweza kumaanisha kujinufaisha kwa hasara ya mwingine. Katika muktadha huu, huenda onyo linahusu hasa kosa la kingono, ingawa wengine hulielewa kwa upana zaidi kuwa udanganyifu au dhuluma.
    reason: lexical_alternative
  - marker: b
    text: “Kuwaonya kwa uzito” pia kunaweza kutafsiriwa “kuwashuhudia kwa dhati” au “kuwasisitizia kwa nguvu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ μὴ ὑπερβαίνειν
  choice: mtu yeyote asivuke mipaka
  rationale: Muundo wa Kiswahili unaendeleza himizo la mstari uliotangulia, huku ‘avuke mipaka’ ukihifadhi sitiari ya kuvuka mpaka wa maadili.
- source_word: πλεονεκτεῖν
  choice: kumdhulumu
  rationale: ‘Kumdhulumu’ linaonyesha kujipatia faida kwa gharama ya mwingine bila kulifunga kosa katika udanganyifu wa kifedha pekee; linafaa pia katika muktadha wa maadili ya ngono.
- source_word: ἐν τῷ πράγματι
  choice: katika jambo hili
  rationale: Hifadhi usemi wa jumla wa Kigiriki na kiunganishi chake na mazungumzo ya karibu kuhusu utakatifu wa kingono bila kuongeza ufafanuzi usiotajwa wazi.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: ndugu yake
  rationale: ‘Ndugu’ ni tafsiri ya kawaida na yenye heshima ya ἀδελφός; umbo la ‘yake’ linahifadhi uhusiano wa umoja bila kulazimisha jinsia katika Kiswahili.
- source_word: ἔκδικος κύριος
  choice: Bwana ndiye anayelipiza kisasi
  rationale: Usemi huu unaweka wazi jukumu la Bwana la kutekeleza hukumu dhidi ya kosa na unasikika kwa kawaida kuliko nomino kama ‘mlipiza-kisasi’.
- source_word: περὶ πάντων τούτων
  choice: kwa ajili ya mambo haya yote
  rationale: Huhifadhi upana wa marejeo kwa makosa yote yanayozungumziwa katika muktadha.
- source_word: προείπαμεν
  choice: tulivyowaambia hapo awali
  rationale: Huonyesha kwamba mafundisho hayo yalikuwa yametolewa kabla, bila kuichanganya kitenzi hiki na onyo lenye mkazo linalofuata.
- source_word: διεμαρτυράμεθα
  choice: kuwaonya kwa uzito
  rationale: Huwasilisha nguvu ya ushuhuda au agizo la dhati katika muktadha wa maonyo ya kimaadili.
theological_decisions:
- issue: Kirejelewa cha ‘jambo hili’ na aina ya kosa
  choice: Maneno yanabaki ya jumla, lakini katika muktadha yanaelekea kwenye kosa la kingono linalomdhulumu mwingine.
  alternative: Kuyachukulia kuwa yanahusu hasa udanganyifu wa biashara au dhuluma nyingine ya kijamii.
  rationale: Mistari 3–5 inazungumzia utakaso na uasherati. Hata hivyo, πλεονεκτεῖν na πρᾶγμα zinaweza kueleweka kwa upana zaidi, kwa hiyo tafsiri kuu haiongezi moja kwa moja neno ‘kingono’.
- issue: Maana ya ἀδελφός
  choice: ndugu yake
  alternative: muumini mwenzake
  rationale: ‘Ndugu’ huhifadhi istilahi ya kifamilia ya chanzo na inaweza kumaanisha ndugu wa jumuiya ya waamini; matumizi ya Kiswahili hayalazimishi kutaja jinsia hapa.
- issue: Nguvu ya ἔκδικος κύριος
  choice: Bwana ndiye anayelipiza kisasi
  alternative: Bwana ndiye anayetekeleza haki
  rationale: Tafsiri iliyochaguliwa huhifadhi nguvu ya onyo kuhusu hukumu ya Mungu, ilhali wazo la utekelezaji wa haki linaeleza maana yake bila kuondoa mvutano wa neno ‘kisasi’.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Avuke mipaka’ huhifadhi sitiari ya chanzo; ‘kumdhulumu’ huepuka kuifanya maana kuwa ya kifedha pekee. Alama zote za tanbihi zimewekwa katika matini kuu.
