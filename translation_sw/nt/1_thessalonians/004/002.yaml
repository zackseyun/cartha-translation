lexical_decisions:
- source_word: οἴδατε
  choice: mnajua
  rationale: οἶδα ni umbo la timilifu lenye maana ya wakati wa sasa katika Kiyunani cha Koine; “mnajua” ni Kiswahili cha kawaida na cha moja kwa moja.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Kiunganishi hiki kinaonyesha maelezo au msingi wa kauli iliyotangulia; “Kwa maana” kinahifadhi uhusiano huo wa kimantiki.
- source_word: τίνας παραγγελίας
  choice: maagizo
  rationale: τίνας pamoja na παραγγελίας hurejelea maagizo ambayo wasomaji wanayajua. “Maagizo” ni neno la kawaida linaloweza kubeba pia uzito wa maelekezo yenye mamlaka.
- source_word: ἐδώκαμεν ὑμῖν
  choice: tuliyowapa
  rationale: Muundo huu wa Kiswahili unatafsiri kwa kawaida tendo lililokamilika la kuwapa wasomaji maagizo.
- source_word: διὰ τοῦ κυρίου Ἰησοῦ
  choice: kupitia kwa Bwana Yesu
  rationale: διά pamoja na hali ya genitivi inaweza kuonyesha njia au uwakala. “Kupitia kwa Bwana Yesu” huhifadhi upana huo bila kuufanya wazi kuwa mamlaka pekee.
- source_word: κυρίου
  choice: Bwana
  rationale: “Bwana” ndilo neno la kawaida na lenye heshima kwa κύριος katika Kiswahili cha Biblia.
- source_word: Ἰησοῦ
  choice: Yesu
  rationale: Jina hili limetolewa kwa umbo lake la kawaida katika Kiswahili.
theological_decisions:
- issue: Maana ya διὰ τοῦ κυρίου Ἰησοῦ
  choice: kupitia kwa Bwana Yesu
  alternative: kwa mamlaka ya Bwana Yesu
  rationale: Kirai kinaweza kueleweka kuwa Yesu ndiye njia au wakala ambaye kupitia kwake maagizo yalitolewa, au kwamba yalitolewa kwa mamlaka yake. Matini kuu inadumisha usemi mpana zaidi wa Kiyunani; tanbihi inahifadhi uwezekano wa maana ya mamlaka.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. “Maagizo” limetumiwa badala ya neno kali zaidi “amri” ili kuhifadhi wigo wa παραγγελία, huku mamlaka yake ikibaki katika muktadha.
