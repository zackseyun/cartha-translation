translation:
  language: sw
  text: Kwa maana mnajua ni maagizo gani tuliyowapa kupitia kwa Bwana Yesu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa mamlaka ya Bwana Yesu.”
