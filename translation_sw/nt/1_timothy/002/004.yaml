    text: Au, “anatamani watu wote waokolewe” au “anapenda watu wote waokolewe.” Kitenzi cha Kigiriki kinaweza pia kutafsiriwa kwa namna hizi; “anataka” kimetumiwa ili kutosuluhisha mijadala ya kitheolojia zaidi ya maneno yenyewe.
