lexical_decisions:
- source_word: ὃς
  choice: ambaye
  rationale: Kiwakilishi cha uhusiano kinamrejelea Mungu katika mstari uliotangulia na kuhifadhi muunganiko wa kisintaksia kwa Kiswahili cha kawaida.
- source_word: πάντας ἀνθρώπους
  choice: watu wote
  rationale: Kirai hiki kinawahusu wanadamu kwa ujumla, si wanaume pekee; “watu wote” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: θέλει
  choice: anataka
  rationale: Kitenzi θέλω kinaweza kumaanisha kutaka, kutamani, au kuazimia. “Anataka” ni cha kawaida na hakilazimishi maana maalumu ya kifalsafa kuhusu mapenzi ya Mungu.
- source_word: σωθῆναι
  choice: waokolewe
  rationale: Kitenzi hiki katika kauli tendwa kina maana ya wokovu katika muktadha huu; “waokolewe” ni istilahi iliyo wazi na ya kawaida.
- source_word: εἰς ἐπίγνωσιν ἀληθείας
  choice: kuijua kweli
  rationale: Muundo huu unaeleza kufikia hali ya kuijua kweli. Tafsiri hii ni ya asili katika Kiswahili huku tanbihi ikihifadhi uwezekano wa maana ya ujuzi kamili zaidi.
- source_word: ἐλθεῖν
  choice: wafikie
  rationale: ἔρχομαι pamoja na εἰς huonyesha mwendo wa kufikia hali fulani; “wafikie” huwasilisha nahau hiyo kwa Kiswahili cha asili.
theological_decisions:
- issue: Upeo wa πάντας ἀνθρώπους na kutaka kwa Mungu kuhusu wokovu
  choice: Kutafsiri waziwazi “watu wote” na “anataka,” bila kupunguza upeo kuwa “watu wa kila aina” wala kukipa kitenzi maana ya kiufundi ya azimio lisilobadilika.
  alternative: “watu wa kila aina”; “anaazimia watu wote waokolewe”; “anatamani watu wote waokolewe”
  rationale: Kirai cha Kigiriki kwa kawaida kina upeo wa wote, na θέλει pekee hakisuluhishi mijadala kuhusu namna ya mapenzi ya Mungu. Tafsiri inahifadhi kauli na mvutano wake wa kitheolojia bila kuingiza msimamo wa dhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo unaendelea kisintaksia kutoka mstari uliotangulia; “wafikie kuijua kweli” ni wa kawaida na unaeleweka kwa wasomaji wengi.
