  text: bali kwa matendo mema, kama inavyowafaa wanawake wanaokiri kumcha Mungu[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kile kinachostahili” au “kile kinachofaa.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kujitoa kwa Mungu” au “kumheshimu Mungu.”
    reason: lexical_alternative
