lexical_decisions:
- source_word: ἀλλ’
  choice: bali
  rationale: Inaonyesha tofauti na mapambo ya nje yaliyotajwa katika mstari uliotangulia.
- source_word: ὃ πρέπει
  choice: kile kinachowafaa
  rationale: Usemi huu unaonyesha jambo linalofaa au linalostahili kwa kuzingatia mwenendo.
- source_word: γυναιξὶν
  choice: wanawake
  rationale: Katika muktadha huu wingi huu unawahusu wanawake kwa ujumla, si wake wa ndoa pekee.
- source_word: ἐπαγγελλομέναις
  choice: wanaokiri
  rationale: Kitenzi hiki hapa kina maana ya kutangaza au kukiri wazi msimamo wa kidini, bila kuifanya kuwa nadhiri.
- source_word: θεοσέβειαν
  choice: kumcha Mungu
  rationale: Huwasilisha heshima na uchaji unaoelekezwa kwa Mungu kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: δι’ ἔργων ἀγαθῶν
  choice: kwa matendo mema
  rationale: Inahifadhi maana ya διά pamoja na hali ya kutendwa kupitia matendo mema, huku muktadha ukionyesha kuwa hayo ndiyo mapambo yanayofaa.
theological_decisions:
- issue: Uhusiano wa “matendo mema” na kukiri kumcha Mungu
  choice: Matendo mema yanaonyeshwa kuwa njia au namna inayowafaa wanawake wanaokiri kumcha Mungu.
  alternative: Kuyafanya matendo mema kuwa msingi wa kustahili wokovu mbele za Mungu.
  rationale: Muundo wa sentensi unalinganisha mapambo ya nje na mwenendo unaofaa kwa wanaokiri uchaji; hautoi dai la moja kwa moja kuhusu jinsi wokovu unavyopatikana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Kumcha Mungu” ni usemi unaoeleweka kwa urahisi unaobeba wazo la uchaji na heshima, si hofu tupu. Alama zote za tanbihi zimewekwa katika matini kuu.
