base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/014.yaml
  text: And Adam was not deceived[a], but the woman, having been deceived[b], came to be in transgression.
translation:
  language: sw
  text: Naye Adamu hakudanganywa, bali mwanamke, baada ya kudanganywa[a], akawa katika uasi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “baada ya kudanganywa kabisa.” Kitenzi hiki kinaweza kuwa na mkazo zaidi kuliko kile kilichotumiwa kuhusu Adamu.
    reason: lexical_alternative
  - marker: b
    text: Au, “amekuwa katika uasi” au “akawa katika uasi.” Njeo timilifu ya Kigiriki inaweza kukazia hali iliyotokana na tendo hilo na kuendelea kuwapo.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδὰμ
  choice: Adamu
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili cha Biblia.
- source_word: ἠπατήθη
  choice: hakudanganywa
  rationale: Kauli tendwa ya wakati uliopita imetafsiriwa moja kwa moja; ‘hakupotoshwa’ lingewezekana lakini si la moja kwa moja kama ‘hakudanganywa.’
- source_word: γυνή
  choice: mwanamke
  rationale: Ingawa neno linaweza kumaanisha ‘mke,’ dokezo la simulizi la Mwanzo na ulinganisho na Adamu vinaunga mkono maana ya ‘mwanamke.’
- source_word: ἐξαπατηθεῖσα
  choice: baada ya kudanganywa kabisa
  rationale: Muundo wa kishirikishi unaonyesha jambo lililotangulia tendo kuu. ‘Kabisa’ linaonyesha uwezekano wa nguvu iliyoongezwa katika kitenzi ambatani ἐξαπατάω bila kutumia lugha nzito isiyo ya kawaida.
- source_word: ἐν παραβάσει
  choice: katika uasi
  rationale: Huhifadhi muundo wa nomino na hali inayoelezwa na ἐν, bila kumgeuza mwanamke moja kwa moja kuwa ‘mwasi.’ ‘Uasi’ hapa ni kuvuka au kukiuka amri, si dai pana kuhusu hali ya wanawake.
- source_word: γέγονεν
  choice: akawa
  rationale: Hutoa kwa Kiswahili cha kawaida wazo la kuingia katika hali fulani. Tanbihi huhifadhi uwezekano wa kusisitiza hali iliyoendelea unaotokana na njeo timilifu ya Kigiriki.
- source_word: δὲ
  choice: bali
  rationale: Kiunganishi kinaonyesha utofautishaji wa wazi kati ya Adamu na mwanamke.
- source_word: καὶ
  choice: Naye
  rationale: Huunganisha kauli hii na hoja iliyotangulia kwa mtiririko wa kawaida wa Kiswahili.
theological_decisions:
- issue: Jinsi ya kueleza uhusiano wa mwanamke na uasi bila kuongeza hitimisho pana kuhusu wanawake au kiwango cha hatia.
  choice: mwanamke, baada ya kudanganywa kabisa, akawa katika uasi
  alternative: mwanamke, alipodanganywa, akawa mwasi
  rationale: Tafsiri iliyochaguliwa inafuata kauli ya kihistoria inayodokeza simulizi la Mwanzo na kuhifadhi nomino dhahania ‘uasi.’ Haibadili neno hilo kuwa jina la mtu (‘mwasi’) wala kupanua kauli kuwa fundisho kuhusu asili au hatia ya wanawake kwa ujumla.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima lakini kinachoeleweka kwa msomaji wa kawaida. ‘Bali’ linaweka utofautishaji wazi; ‘baada ya’ linaonyesha uhusiano wa wakati wa kishirikishi; tanbihi zinahifadhi nguvu inayowezekana ya ἐξαπατάω na hali-tokeo ya γέγονεν.
