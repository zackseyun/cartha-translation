id: 1TI.2.15
reference: 1 Timothy 2:15
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: σωθήσεται δὲ διὰ τῆς τεκνογονίας, ἐὰν μείνωσιν ἐν πίστει καὶ ἀγάπῃ καὶ ἁγιασμῷ μετὰ σωφροσύνης.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/015.yaml
  text: Yet she will be saved through childbearing[c][b][a], if they continue in faith and love and holiness with self-control.
translation:
  language: sw
  text: Lakini ataokolewa kwa kuzaa watoto,[a][b][c] ikiwa wataendelea katika imani, upendo na utakatifu pamoja na kujitawala.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa ule uzaaji.” Wengine huelewa hili kuwa rejeo la kuzaliwa kwa mtoto fulani, huenda Masihi; lakini usemi huo pia unaweza kumaanisha kuzaa watoto kwa jumla.
    reason: alternative_reading
  - marker: b
    text: Neno “imani” hapa linaweza pia kueleweka kuwa “uaminifu.”
    reason: lexical_alternative
  - marker: c
    text: Kigiriki hubadilika kutoka umoja (“ataokolewa”) kwenda wingi (“ikiwa wataendelea”).
    reason: lexical_alternative
lexical_decisions:
- source_word: σωθήσεται
  choice: ataokolewa
  rationale: Kitenzi hiki kwa kawaida humaanisha kuokolewa katika matumizi ya Paulo. Tafsiri hii haibani maana kuwa usalama wa kimwili wakati wa kujifungua.
- source_word: δὲ
  choice: Lakini
  rationale: Kiunganishi hiki kinaonyesha utofautishaji au hatua mpya kwa upole; “lakini” ni ya kawaida na wazi katika Kiswahili.
- source_word: διὰ τῆς τεκνογονίας
  choice: kwa kuzaa watoto
  rationale: τεκνογονία humaanisha kuzaa watoto. Usemi huu wa asili katika Kiswahili unaacha wazi jinsi kuzaa kunavyohusiana na kuokolewa; uwezekano wa kumaanisha tukio maalumu la kuzaliwa umewekwa katika tanbihi.
- source_word: ἐὰν
  choice: ikiwa
  rationale: Neno hili linaanzisha sharti; “ikiwa” ni tafsiri ya moja kwa moja na yenye hadhi.
- source_word: μείνωσιν
  choice: wataendelea
  rationale: Hutoa wazo la kudumu au kuendelea katika hali zilizotajwa, na pia huhifadhi wingi wa kitenzi cha Kigiriki.
- source_word: ἐν πίστει
  choice: katika imani
  rationale: “Imani” ndiyo tafsiri ya kawaida ya πίστις; maana inayowezekana ya uaminifu imehifadhiwa katika tanbihi.
- source_word: ἀγάπῃ
  choice: upendo
  rationale: Hii ndiyo tafsiri ya kawaida na ya asili ya ἀγάπη.
- source_word: ἁγιασμῷ
  choice: utakatifu
  rationale: “Utakatifu” ni wazi katika orodha ya sifa na huepuka istilahi ya kitaalamu kupita kiasi ya mchakato wa kutakaswa.
- source_word: μετὰ σωφροσύνης
  choice: pamoja na kiasi
  rationale: Katika muktadha huu σωφροσύνη huonyesha kujitawala na mwenendo wenye busara. “Kiasi” ni usemi wa Kiswahili unaoeleweka na unaofaa katika orodha hii ya maadili.
theological_decisions:
- issue: Kubadilika kutoka umoja ‘ataokolewa’ kwenda wingi ‘wataendelea’
  choice: 'Kuhifadhi badiliko la kisarufi la maandishi: umoja katika kishazi cha kwanza na wingi katika kishazi cha sharti.'
  alternative: Kulainisha kuwa ‘wanawake wataokolewa ... ikiwa wataendelea,’ au kueleza wazi kuwa umoja ni Hawa na wingi ni wanawake kwa jumla.
  rationale: Kigiriki chenyewe hubadilika kutoka umoja kwenda wingi. Kulainisha badiliko hilo kungeficha mvutano muhimu wa kifafanuzi.
- issue: Maana ya ‘ataokolewa kwa kuzaa watoto’
  choice: Kuacha usemi huo bila kubainisha kama wokovu ni wa kiroho au wa mwisho, kama ni kuhifadhiwa wakati wa kujifungua, au kama unahusiana na wito wa kuwa mama.
  alternative: ‘Atalindwa wakati wa kujifungua,’ ‘ataokolewa kwa kuukubali umama,’ au ‘ataokolewa kwa kuzaliwa kwa Masihi.’
  rationale: Usemi wa Kigiriki una utata halisi na hauainishi mojawapo ya maelezo hayo. Tafsiri kuu inapaswa kuhifadhi utata huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Mpangilio wa alama [a][b][c] umechaguliwa ili ulingane na mpangilio wa tanbihi na kila alama inaonekana katika matini kuu.
