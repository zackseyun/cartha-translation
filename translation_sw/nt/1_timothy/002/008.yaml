  text: Βούλομαι οὖν προσεύχεσθαι τοὺς ἄνδρας ἐν παντὶ τόπῳ, ἐπαίροντας ὁσίους χεῖρας χωρὶς ὀργῆς καὶ ⸀διαλογισμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/008.yaml
  text: Therefore I want the men in every place to pray[a], lifting up holy hands without anger or quarreling.
translation:
  language: sw
  text: Kwa hiyo, nataka wanaume wasali kila mahali, wakiinua mikono mitakatifu bila hasira wala mabishano.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “bila hasira wala shaka.” Neno la Kiyunani linaweza kumaanisha mawazo ya ndani au shaka, lakini hapa huenda linarejelea mabishano yenye uhasama katika kusanyiko.
    reason: lexical_alternative
lexical_decisions:
- source_word: Βούλομαι
  choice: nataka
  rationale: Kitenzi hiki huonyesha nia au tamaa; “nataka” ni Kiswahili cha sasa na cha kawaida, huku kikidumisha uzito wa agizo la Paulo.
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Huunganisha agizo hili na hoja iliyotangulia kwa kuonyesha hitimisho au mwendelezo wa kimantiki.
- source_word: προσεύχεσθαι
  choice: wasali
  rationale: Ni tafsiri ya kawaida na ya asili ya tendo la kumwelekea Mungu katika sala; hali tegemezi inafuata “nataka.”
- source_word: τοὺς ἄνδρας
  choice: wanaume
  rationale: ἀνήρ hapa inaelekea kumaanisha wanaume, si watu kwa ujumla wala waume, hasa kwa kuwa muktadha unaofuata unatoa maagizo yanayowataja wanawake kwa namna tofauti.
- source_word: ἐν παντὶ τόπῳ
  choice: kila mahali
  rationale: Kauli hii ya asili katika Kiswahili inadumisha maana ya usambazaji ya “katika kila mahali” bila kuwa nzito.
- source_word: ἐπαίροντας
  choice: wakiinua
  rationale: Hueleza tendo linaloandamana na kusali na hudumisha ishara ya kimwili iliyomo katika maandishi.
- source_word: ὁσίους χεῖρας
  choice: mikono mitakatifu
  rationale: ὅσιος hueleza utakatifu au mwenendo unaokubalika mbele za Mungu; “mitakatifu” ni tafsiri ya moja kwa moja bila kuibadili kuwa kivumishi tofauti kama “safi.”
- source_word: χωρὶς
  choice: bila
  rationale: Huonyesha kutokuwapo kwa mambo yanayotajwa.
- source_word: ὀργῆς
  choice: hasira
  rationale: Ni neno la kawaida na wazi linalofaa muktadha wa mahusiano kuliko “ghadhabu,” ambalo linaweza kusikika zito zaidi.
- source_word: διαλογισμοῦ
  choice: mabishano
  rationale: διαλογισμός inaweza kumaanisha mawazo ya ndani, shaka, au ubishi. Ikiunganishwa na “hasira” katika muktadha wa sala ya kusanyiko, inaelekea zaidi kurejelea ubishi wenye migogoro; uwezekano wa “shaka” umehifadhiwa katika tanbihi.
theological_decisions:
- issue: Rejeo maalumu la kijinsia katika τοὺς ἄνδρας
  choice: wanaume
  alternative: watu; kila mtu; waume
  rationale: Nomino ya Kiyunani hapa ni maalumu kwa wanaume, na muktadha wa karibu unatofautisha maagizo kwa wanaume na kwa wanawake. Kutumia “watu” kungefuta umaalumu huo.
- issue: Maana ya διαλογισμοῦ katika mazingira ya sala
  choice: mabishano
  alternative: ubishi; shaka
  rationale: Uhusiano wake na “hasira” na mazingira ya kusali pamoja unaunga mkono maana ya migogoro ya kimahusiano. Hata hivyo, maana ya “shaka” inawezekana kileksika, hivyo haijaondolewa bali imewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. “Kila mahali” limetumiwa badala ya “katika kila mahali” kwa uasilia; “wala” linaunganisha kwa uwazi mambo mawili yanayopaswa kutokuwapo.
