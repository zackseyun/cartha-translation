lexical_decisions:
- source_word: γὰρ
  choice: Kwa maana
  rationale: Kiunganishi hiki kinatoa sababu au msingi wa maelezo yaliyotangulia bila kuongeza hitimisho lisilotajwa wazi.
- source_word: Ἀδὰμ
  choice: Adamu
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili sanifu.
- source_word: πρῶτος
  choice: kwanza
  rationale: Linaonyesha wazi mfuatano wa wakati kati ya kuumbwa kwa Adamu na kwa Hawa.
- source_word: ἐπλάσθη
  choice: aliumbwa
  rationale: Ni kauli tendwa ya asili na inayoeleweka kwa urahisi, huku ikihifadhi wazo la kupewa umbo katika simulizi la uumbaji; maana mahususi zaidi ya kufinyangwa imeonyeshwa katika tanbihi.
- source_word: εἶτα
  choice: kisha
  rationale: Linaonyesha hatua iliyofuata katika mfuatano wa wakati kwa lugha fupi na yenye hadhi.
- source_word: Εὕα
  choice: Hawa
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili sanifu.
theological_decisions:
- issue: Uhusiano na mpangilio wa uumbaji katika Mwanzo katika muktadha wa mjadala kuhusu huduma na majukumu
  choice: 'Kutafsiri mstari kama taarifa rahisi ya mfuatano wa wakati: Adamu aliumbwa kwanza, kisha Hawa.'
  alternative: Kuingiza katika tafsiri hitimisho kuhusu mamlaka au tofauti za majukumu.
  rationale: Kigiriki chenyewe kinataja mpangilio wa kuumbwa bila kueleza wazi katika mstari huu pekee matokeo ya kiteolojia ya mpangilio huo. Tafsiri haipaswi kuamua mvutano huo kwa kuongeza hitimisho lisilosemwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa, wazi na chenye hadhi. Sentensi imehifadhi ufupi na mfuatano wa moja kwa moja wa Kigiriki.
