  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Παρακαλῶ οὖν πρῶτον πάντων ποιεῖσθαι δεήσεις, προσευχάς, ἐντεύξεις, εὐχαριστίας, ὑπὲρ πάντων ἀνθρώπων,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/001.yaml
  text: Therefore[a], first of all, I urge that petitions, prayers, intercessions, and thanksgivings be made for all people[c][b],
translation:
  language: sw
  text: Kwa hiyo, kwanza kabisa, ninahimiza kwamba maombi ya haja, sala, maombezi na shukrani zifanywe kwa ajili ya[a] watu wote[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa niaba ya.”
    reason: lexical_alternative
  - marker: b
    text: Neno “watu” hapa linatafsiri usemi wa Kigiriki unaomaanisha wanadamu kwa ujumla, si wanaume pekee.
    reason: lexical_alternative
  - marker: c
    text: Baadhi huelewa “watu wote” hapa kuwa “watu wa kila aina”; Kigiriki chenyewe kinasema tu “watu wote.”
    reason: alternative_reading
lexical_decisions:
- source_word: Παρακαλῶ
  choice: ninahimiza
  rationale: Neno hili linaonyesha wito wa dhati na wenye uzito. “Ninahimiza” ni Kiswahili cha sasa kinachoeleweka na kina nguvu kuliko ombi la kawaida.
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Huonyesha hitimisho au mpito unaotokana na yaliyoandikwa kabla yake; “Kwa hiyo” huhifadhi uhusiano huo wa kimantiki.
- source_word: πρῶτον πάντων
  choice: kwanza kabisa
  rationale: Nahau hii inasisitiza kipaumbele, si lazima hatua ya kwanza tu katika orodha ndefu.
- source_word: ποιεῖσθαι
  choice: zitolewe
  rationale: Katika muktadha wa aina hizi za sala, “zitolewe” ni usemi wa kawaida na wenye heshima, bila kuziwekea maana ya ibada maalumu isiyosemwa na Kigiriki.
- source_word: δεήσεις
  choice: maombi ya haja
  rationale: Hurejelea maombi yanayotokana na hitaji fulani. “Maombi ya haja” yanaitofautisha kwa kiasi na neno la jumla linalofuata.
- source_word: προσευχάς
  choice: sala
  rationale: Ni neno la jumla kwa sala; “sala” ni la kawaida, la sasa na linaloeleweka katika Kiswahili sanifu.
- source_word: ἐντεύξεις
  choice: maombezi
  rationale: Katika muktadha huu yanaonyesha kumwendea Mungu kwa ajili ya wengine. “Maombezi” huhifadhi wazo hilo bila kuongeza ufafanuzi wa kimadhehebu.
- source_word: εὐχαριστίας
  choice: shukrani
  rationale: Huhifadhi aina ya nne ya mawasiliano na Mungu katika orodha na ni usemi wa kawaida wa Kiswahili.
- source_word: ὑπὲρ
  choice: kwa ajili ya
  rationale: Pamoja na hali ya umilikishi hapa huonyesha kunufaisha au kuwakilisha wengine. “Kwa ajili ya” ni ya kawaida; maana ya “kwa niaba ya” imeonyeshwa katika tanbihi.
- source_word: πάντων ἀνθρώπων
  choice: watu wote
  rationale: ἀνθρώπων hapa ni usemi wa jumla unaowahusu wanadamu, si wanaume pekee. “Watu wote” ni tafsiri ya moja kwa moja na ya kawaida.
theological_decisions:
- issue: Upeo wa πάντων ἀνθρώπων
  choice: watu wote
  alternative: watu wa kila aina
  rationale: Kigiriki chenyewe kinasema “watu wote.” Tafsiri haipunguzi upeo wake kuwa makundi yote ya watu, ingawa ufafanuzi huo unawezekana na umetajwa katika tanbihi ili kuhifadhi mvutano wa kiteolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Orodha ya maneno manne ya sala imehifadhiwa. “Maombi ya haja” na “sala” zimetumiwa kutofautisha δεήσεις na προσευχάς kwa lugha inayoeleweka, huku “maombezi” yakihifadhi wazo la kumwendea Mungu kwa ajili ya wengine.
