id: 1TI.2.9
reference: 1 Timothy 2:9
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὡσαύτως ⸀καὶ γυναῖκας ἐν καταστολῇ κοσμίῳ μετὰ αἰδοῦς καὶ σωφροσύνης κοσμεῖν ἑαυτάς, μὴ ἐν πλέγμασιν ⸀καὶ ⸀χρυσίῳ ἢ μαργαρίταις ἢ ἱματισμῷ πολυτελεῖ,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/009.yaml
  text: Likewise also[a], women are to adorn themselves in respectable clothing, with modesty and self-control, not with braided hair and gold or pearls or expensive clothing[b],
translation:
  language: sw
  text: Vivyo hivyo, wanawake wajipambe kwa mavazi yanayofaa, kwa staha na kiasi, si kwa nywele zilizosukwa, dhahabu, lulu, au mavazi ya gharama kubwa[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kutajwa kwa “nywele zilizosukwa, dhahabu, lulu, au mavazi ya gharama kubwa” huenda kunalenga mapambo ya kujionyesha kwa anasa, wala si lazima kuwe ni marufuku ya kila matumizi ya misuko au vito katika hali zote.
    reason: cultural_note
lexical_decisions:
- source_word: ὡσαύτως καί
  choice: Vivyo hivyo
  rationale: Kauli hii inaunganisha agizo hili na lililotangulia na kwa Kiswahili hubeba kiunganishi cha nyongeza kwa njia ya asili bila kulazimisha kutafsiri καί kwa neno tofauti.
- source_word: γυναῖκας
  choice: wanawake
  rationale: Muktadha hauna alama za kindoa zinazolazimisha maana ya ‘wake’; wingi huu unawahusu wanawake kwa ujumla.
- source_word: ἐν καταστολῇ κοσμίῳ
  choice: kwa mavazi yanayofaa
  rationale: ‘Mavazi’ huonyesha καταστολή, na ‘yanayofaa’ huwasilisha wazo la κόσμιος la heshima, utaratibu, na ufasaha unaokubalika.
- source_word: μετὰ αἰδοῦς
  choice: kwa staha
  rationale: ‘Staha’ ni neno la kawaida na lenye hadhi linaloonyesha hali ya kujisitiri na kujiepusha na lisilofaa, si sura ya nje pekee.
- source_word: σωφροσύνης
  choice: kiasi
  rationale: Katika muktadha huu ‘kiasi’ huonyesha busara yenye kujizuia na kutotenda kwa kupindukia; tafsiri pana ‘kujitawala’ pia inawezekana.
- source_word: κοσμεῖν ἑαυτάς
  choice: wajipambe
  rationale: Huhifadhi wazo la kujipamba au kujiweka katika hali inayofaa na pia uhusiano wa kitenzi na orodha ya mapambo inayofuata.
- source_word: μὴ ἐν πλέγμασιν
  choice: si kwa nywele zilizosukwa
  rationale: πλέγματα inaelekea kumaanisha mipangilio ya nywele zilizosukwa; usemi huu ni wazi na wa asili kwa Kiswahili.
- source_word: χρυσίῳ
  choice: dhahabu
  rationale: Huhifadhi upana wa neno la Kigiriki bila kulifafanua zaidi kuwa aina fulani ya vito.
- source_word: μαργαρίταις
  choice: lulu
  rationale: Hii ndiyo maana ya kawaida ya neno hilo na sehemu ya orodha ya mapambo ya kifahari.
- source_word: ἱματισμῷ πολυτελεῖ
  choice: mavazi ya gharama kubwa
  rationale: Tafsiri hii ni ya sasa na wazi, na huonyesha gharama au anasa inayodokezwa na πολυτελής.
theological_decisions:
- issue: Ikiwa mstari unawahusu wanawake kwa ujumla au wake pekee
  choice: wanawake kwa ujumla
  alternative: wake
  rationale: γυναῖκας ni wingi usio na viashiria vya kindoa katika muktadha huu wa maagizo ya jumla; ‘wanawake’ haubani maana kuliko chanzo.
- issue: Ikiwa orodha hiyo ni marufuku kamili au inalenga kujionyesha kwa anasa
  choice: Maandishi yahifadhi orodha kama ilivyo, huku tanbihi ikieleza uwezekano mkubwa kwamba lengo ni mapambo ya kujionyesha kwa anasa.
  alternative: Marufuku kamili ya kila matumizi ya nywele zilizosukwa, dhahabu, lulu, au mavazi ya gharama kubwa
  rationale: Muundo unatofautisha kujipamba kwa mavazi yanayofaa, staha, na kiasi na maonyesho ya anasa. Tafsiri haiongezi kizuizi kisichotajwa, lakini pia haiondoi nguvu ya katazo la maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Staha na kiasi’ ni mfuatano mfupi unaoeleweka kwa urahisi; ‘mavazi yanayofaa’ huepuka usemi mzito huku ukihifadhi dhana ya heshima na utaratibu. Alama ya tanbihi [a] imewekwa baada ya orodha nzima inayofafanuliwa.
