  text: ὑπὲρ βασιλέων καὶ πάντων τῶν ἐν ὑπεροχῇ ὄντων, ἵνα ἤρεμον καὶ ἡσύχιον βίον διάγωμεν ἐν πάσῃ εὐσεβείᾳ καὶ σεμνότητι.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/002.yaml
  text: for kings and all who are in high positions[a], so that we may lead a tranquil and quiet life in all godliness and dignity.
translation:
  language: sw
  text: kwa ajili ya wafalme na wote walio katika vyeo vya juu[a], ili tuweze kuishi maisha ya utulivu na ya kimya katika utauwa wote na staha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wote wenye mamlaka.” Kwa maana ya moja kwa moja, “wote walio katika nafasi ya juu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ
  choice: kwa ajili ya
  rationale: Katika muktadha wa maombi na dua katika mstari uliotangulia, kirai hiki kinaonyesha watu wanaoombewa; “kwa ajili ya” ni cha kawaida na wazi katika Kiswahili.
- source_word: βασιλέων
  choice: wafalme
  rationale: Neno la Kigiriki linawataja wafalme hasa. Tafsiri hii inadumisha maana yake ya msingi bila kuipanua kimya kimya iwe watawala wote.
- source_word: πάντων τῶν ἐν ὑπεροχῇ ὄντων
  choice: wote walio katika vyeo vya juu
  rationale: Kirai hiki kinahusu watu walio katika hali ya ukuu au cheo cha juu, na si lazima mamlaka rasmi pekee. Tanbihi inatoa tafsiri mbadala inayosisitiza mamlaka.
- source_word: ἵνα
  choice: ili
  rationale: “Ili” linaonyesha kusudi linalokusudiwa la kuwaombea watu hao.
- source_word: ἤρεμον
  choice: matulivu
  rationale: Neno hili linaonyesha hali ya utulivu na kutosumbuliwa; limetofautishwa na ἡσύχιον badala ya kuyaunganisha maneno hayo mawili.
- source_word: ἡσύχιον
  choice: ya kimya
  rationale: Neno hili linasisitiza ukimya na hali isiyo na makelele au misukosuko. Muundo huu unahifadhi jozi ya vivumishi vya Kigiriki.
- source_word: βίον διάγωμεν
  choice: tuweze kuishi maisha
  rationale: Kitenzi pamoja na βίον kinamaanisha kuendesha au kuishi maisha; usemi huu ni wa asili katika Kiswahili na unaonyesha uwezekano unaokusudiwa.
- source_word: ἐν πάσῃ εὐσεβείᾳ
  choice: kwa uchaji kamili wa Mungu
  rationale: εὐσέβεια ni uchaji unaoelekezwa kwa Mungu na kuonekana katika maisha. “Kamili” hapa huonyesha upeo wa πάσῃ bila kudokeza aina nyingi tofauti za uchaji.
- source_word: σεμνότητι
  choice: heshima
  rationale: Neno hili linamaanisha uzito wa tabia unaostahili kuheshimiwa. “Heshima” ni neno la sasa na linaloeleweka kwa urahisi.
theological_decisions:
- issue: Upeo na kusudi la kuwaombea watawala wa kiraia
  choice: Mstari unaonyesha kuwa wafalme na walio katika vyeo vya juu waombewe ili waamini waishi kwa utulivu, uchaji wa Mungu na heshima.
  alternative: Kutafsiri kwa namna inayosisitiza zaidi utiifu kwa mamlaka, au kuhusisha watu wenye mamlaka rasmi pekee.
  rationale: Kigiriki kinataja wanaoombewa na kusudi la maombi hayo, lakini hakisemi hapa kwamba kila mtawala anaungwa mkono bila masharti. Tafsiri haiingizi msimamo mpana wa kisiasa usiotajwa katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye staha na inayoeleweka kwa wasomaji wa kawaida. Muundo wa mstari umeachwa kama mwendelezo wa mstari uliotangulia. Jozi “matulivu na ya kimya” inadumisha tofauti kati ya vivumishi viwili vya Kigiriki, ingawa ni rasmi kidogo kuliko usemi wa mazungumzo.
