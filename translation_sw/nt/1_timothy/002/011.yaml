translation:
  language: sw
  text: Mwanamke[a] na ajifunze kwa utulivu[b], kwa utii wote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mke”; neno la Kigiriki linaweza kumaanisha “mwanamke” au “mke,” kutegemea muktadha.
    reason: alternative_reading
  - marker: b
    text: Au “kwa ukimya”; neno la Kigiriki linaweza pia kumaanisha utulivu au hali ya amani, wala si lazima kutosema kabisa.
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνὴ
  choice: Mwanamke
  rationale: γυνή inaweza kumaanisha “mwanamke” au “mke” kutegemea muktadha. Hapa “mwanamke” huhifadhi maana ya jumla bila kuingiza hali ya ndoa ambayo haijaelezwa wazi.
- source_word: ἐν ἡσυχίᾳ
  choice: kwa utulivu
  rationale: ἡσυχία inaweza kueleza hali ya utulivu, amani, au kutofanya fujo, wala si lazima ukimya usio na neno lolote. “Kwa utulivu” ni Kiswahili cha kawaida kinachohifadhi upana huo wa maana.
- source_word: μανθανέτω
  choice: na ajifunze
  rationale: Kitenzi hiki ni amri ya nafsi ya tatu umoja. Muundo “na ajifunze” huwasilisha agizo la Kigiriki kwa njia ya kawaida na yenye heshima katika Kiswahili, huku ukidumisha msisitizo chanya kwamba mwanamke ajifunze.
- source_word: ἐν πάσῃ ὑποταγῇ
  choice: huku akijitiisha kikamilifu
  rationale: ὑποταγή hueleza kujitiisha, na πάσῃ huonyesha ukamilifu. Tafsiri hii ni ya asili katika Kiswahili na haiongezi mtu au mamlaka ambayo mwanamke anapaswa kujitiisha kwake, kwa kuwa Kigiriki hakutaji kitu hicho.
theological_decisions:
- issue: Ikiwa ἡσυχία inaamuru ukimya kabisa au mwenendo wa utulivu
  choice: kwa utulivu
  alternative: kwa ukimya
  rationale: Neno hilo linaweza kumaanisha ukimya, lakini pia lina maana ya utulivu au hali ya amani. Tafsiri kuu haifanyi agizo kuwa la kutosema kabisa kuliko Kigiriki kinavyolazimisha, na tanbihi huhifadhi uwezekano mwingine.
- issue: Ikiwa γυνή inamaanisha mwanamke au mke
  choice: Mwanamke
  alternative: Mke
  rationale: Muktadha wa karibu hautaji wazi uhusiano wa ndoa. “Mwanamke” huepuka kuwekea neno mipaka isiyo dhahiri, huku tanbihi ikihifadhi “mke” kama uwezekano wa kimuktadha.
- issue: Mhusika au mamlaka inayolengwa na kujitiisha
  choice: Haikutajwa katika tafsiri
  alternative: Kumtaja mwalimu, mwanamume, au mume kama anayetiikiwa
  rationale: Kirai ἐν πάσῃ ὑποταγῇ hakitaji wazi kitu cha kujitiisha kwake. Tafsiri inaacha mvutano huo wa kimuktadha bila kuingiza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo “na ajifunze” huhifadhi nguvu ya amri bila kuwa mkali kupita kiasi; “huku akijitiisha kikamilifu” ni wa asili kuliko tafsiri neno kwa neno kama “katika utii wote.”
