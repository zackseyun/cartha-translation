  text: εἷς γὰρ θεός, εἷς καὶ μεσίτης θεοῦ καὶ ἀνθρώπων ἄνθρωπος Χριστὸς Ἰησοῦς,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/005.yaml
  text: For there is one God[a], and one mediator between God and men, the man Messiah Jesus[c][b],
translation:
  language: sw
  text: Kwa maana Mungu ni mmoja, na mpatanishi kati ya Mungu na wanadamu ni mmoja—mwanadamu, Masihi Yesu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kristo Yesu.”
    reason: alternative_reading
lexical_decisions:
- source_word: εἷς
  choice: mmoja
  rationale: 'Imetafsiriwa vivyo hivyo katika sehemu zote mbili ili kuhifadhi msisitizo na ulinganifu wa Kigiriki: Mungu mmoja, mpatanishi mmoja.'
- source_word: γὰρ
  choice: Kwa maana
  rationale: Inaonyesha kuwa kauli hii inatoa msingi au maelezo ya maagizo yaliyotangulia.
- source_word: μεσίτης
  choice: mpatanishi
  rationale: Ni neno la kawaida na lenye hadhi kwa mtu aliye katikati ya pande mbili ili kuzipatanisha; linafaa hapa kuliko usemi mpana kama ‘aliye katikati’.
- source_word: θεοῦ καὶ ἀνθρώπων
  choice: kati ya Mungu na wanadamu
  rationale: Ingawa Kigiriki kina miundo ya umilikaji, Kiswahili hutumia kwa kawaida ‘mpatanishi kati ya’. ‘Wanadamu’ ni neno jumuishi kwa watu wote.
- source_word: ἄνθρωπος
  choice: mwanadamu
  rationale: Huhifadhi uhusiano wa wazi wa kileksika na ‘wanadamu’ na kusisitiza ubinadamu halisi wa mpatanishi bila kuongeza madai yasiyosemwa katika mstari.
- source_word: Χριστὸς Ἰησοῦς
  choice: Masihi Yesu
  rationale: Χριστός lina nguvu ya cheo hapa, kwa hiyo limetafsiriwa ‘Masihi’; mpangilio wa chanzo umehifadhiwa.
theological_decisions:
- issue: Uhusiano wa ἀνθρώπων na ἄνθρωπος
  choice: wanadamu … mwanadamu
  alternative: watu … mtu
  rationale: Chaguo hili huhifadhi uhusiano wa maneno ya Kigiriki na mkazo wa kwamba Yesu anashiriki kikamilifu ubinadamu wa wale anaowapatanisha na Mungu.
- issue: Maana ya Χριστός kama cheo
  choice: Masihi Yesu
  alternative: Kristo Yesu
  rationale: ‘Masihi’ hutafsiri maana ya cheo badala ya kukitaja kwa unukuzi pekee; mbadala uliozoeleka umetolewa katika tanbihi.
- issue: Mkazo wa ἄνθρωπος Χριστὸς Ἰησοῦς
  choice: mwanadamu, Masihi Yesu
  alternative: Masihi Yesu aliye mwanadamu
  rationale: Muundo wa kiambatano huhifadhi mkazo wa moja kwa moja wa chanzo juu ya ubinadamu wa mpatanishi bila kuamua zaidi ya yale ambayo mstari unasema kuhusu asili yake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Dashibodi inaonyesha kwa uwazi kuwa ‘mwanadamu, Masihi Yesu’ ni ufafanuzi wa mpatanishi mmoja; koma inaonyesha uambatano bila kufanya ‘Masihi’ ionekane kama jina la ukoo.
