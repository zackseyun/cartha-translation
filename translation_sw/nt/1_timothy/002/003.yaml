  yaml_path: translation/nt/1_timothy/002/003.yaml
  text: This is good and acceptable before God our Savior,
translation:
  language: sw
  text: Jambo hili ni jema na linakubalika mbele za Mungu, Mwokozi wetu,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτο
  choice: Jambo hili
  rationale: Kiwakilishi cha kuonyesha cha umoja wa kati kinarejelea maagizo yaliyotangulia kuhusu maombi. “Jambo hili” huonyesha rejeo hilo kwa Kiswahili cha kawaida bila kulifafanua kupita kiasi.
- source_word: καλὸν
  choice: jema
  rationale: Katika muktadha huu wa maadili, neno hili linaonyesha wema au ufaafu, si uzuri wa sura. “Jema” ni tafsiri ya kawaida na pana.
- source_word: ἀπόδεκτον
  choice: linakubalika
  rationale: Neno hili hueleza jambo linalopokewa kwa kibali. “Linakubalika” huhifadhi maana ya tathmini bila kuongeza wazo lenye nguvu zaidi la kumpendeza.
- source_word: ἐνώπιον
  choice: mbele za
  rationale: Hapa linaonyesha tathmini machoni pa Mungu. “Mbele za” ni usemi wa Kiswahili ulio wazi na wenye hadhi katika muktadha huu.
- source_word: σωτῆρος
  choice: Mwokozi
  rationale: Hili ni jina la cheo muhimu katika nyaraka za kichungaji. “Mwokozi” ndilo neno la kawaida la Kiswahili linalohifadhi dhana ya Mungu anayeokoa.
- source_word: ἡμῶν
  choice: wetu
  rationale: Kiwakilishi hiki cha umilikishi kinahusiana moja kwa moja na “Mwokozi” na kimehifadhiwa wazi.
- source_word: θεοῦ
  choice: Mungu
  rationale: Nomino hii inafafanua “Mwokozi” kwa uhusiano wa apposition, yaani Mungu ndiye Mwokozi wetu. Mpangilio “Mungu, Mwokozi wetu” ni wa asili katika Kiswahili na huhifadhi uhusiano huo.
theological_decisions:
- issue: Uhusiano wa apposition katika τοῦ σωτῆρος ἡμῶν θεοῦ
  choice: Mungu, Mwokozi wetu
  alternative: Mungu Mwokozi wetu
  rationale: Vijenzi vya Kigiriki vinamtambulisha Mungu kuwa Mwokozi wetu. Koma husaidia sentensi ya Kiswahili isomwe kwa uwazi, bila kuingiza dai la kiteolojia lisilozidi yale yaliyomo katika maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, wazi na yenye hadhi. Muundo umehifadhi utegemezi wa mstari huu kwa maagizo yaliyotangulia, pamoja na koma ya mwisho inayoonyesha kwamba sentensi inaendelea.
