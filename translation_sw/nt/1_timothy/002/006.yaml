  language: sw
  text: aliyejitoa mwenyewe kuwa fidia kwa ajili ya wote[a]—huo ndio ushuhuda kwa nyakati zake maalumu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa niaba ya wote.” Neno “wote” linaachwa na upana wake bila kuamua ikiwa maana ni kila mtu mmoja mmoja au watu wa kila aina.
    reason: alternative_reading
  - marker: b
    text: 'Kigiriki ni kifupi: “ushuhuda kwa nyakati zake maalumu.” Huenda kirai hiki kinaeleza kujitoa kwa Kristo; kinaweza pia kumaanisha ushuhuda uliojulikana au uliotolewa katika nyakati zilizokusudiwa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δοὺς
  choice: aliyejitoa
  rationale: Kitenzi kishirikishi cha wakati uliopita kinamhusu “mwanadamu Kristo Yesu” katika mstari uliotangulia. Muundo wa kishazi cha uhusiano ni wa kawaida katika Kiswahili; “alijitoa” pia huunganisha tendo la kutoa na kiwakilishi cha kujirejelea ἑαυτόν kwa ufasaha.
- source_word: ἑαυτὸν
  choice: mwenyewe
  rationale: Neno hili linasisitiza kwamba Kristo alitoa nafsi yake mwenyewe, si kitu kingine.
- source_word: ἀντίλυτρον
  choice: fidia
  rationale: “Fidia” ni neno la kawaida na lenye heshima kwa bei inayotolewa ili kumkomboa mwingine. Linahifadhi wazo la ukombozi na nafasi ya mwingine bila kulipanua kuwa maelezo ya kimafundisho yasiyosemwa wazi katika mstari.
- source_word: ὑπὲρ πάντων
  choice: kwa ajili ya wote
  rationale: “Kwa ajili ya” linaonyesha tendo lililofanywa kwa manufaa au kwa niaba ya wengine, huku “wote” likihifadhi upana wa πάντων bila kuamua mjadala kuhusu upeo wake.
- source_word: τὸ μαρτύριον
  choice: huo ndio ushuhuda
  rationale: Kirai hiki ni cha ufupisho na kinaweza kueleweka kuwa maelezo ya kujitoa kwa Kristo kulikotajwa. “Huo ndio ushuhuda” huweka uhusiano huo wazi kwa Kiswahili cha kawaida bila kubadili “ushuhuda” kuwa wazo jingine.
- source_word: καιροῖς ἰδίοις
  choice: kwa nyakati zake maalumu
  rationale: “Nyakati” linahifadhi wingi wa καιροῖς, na “zake maalumu” linaonyesha nyakati zinazohusika au zilizokusudiwa bila kutaja wazi mhusika ambaye maandishi ya Kigiriki hayamtaji hapa.
theological_decisions:
- issue: Upeo wa πάντων kuhusiana na fidia ya Kristo
  choice: kwa ajili ya wote
  alternative: kwa ajili ya kila mtu; kwa ajili ya watu wa kila aina
  rationale: Maandishi yana lugha pana, lakini mstari huu pekee hauamui ikiwa maana ni kila mtu bila ubaguzi wowote au watu wa kila aina. Tafsiri inahifadhi upana na mvutano huo.
- issue: Nguvu ya uwakilishi katika ἀντίλυτρον
  choice: fidia
  alternative: fidia ya badala; fidia iliyotolewa badala ya wote
  rationale: Kiambishi ἀντί- kinaweza kusisitiza kubadilishana au kuchukua nafasi, lakini kukipanua katika matini kuu kungeweza kuifanya tafsiri kuwa ufafanuzi. “Fidia” linabeba kiini cha ukombozi bila kuzidisha maandishi.
- issue: Uhusiano wa τὸ μαρτύριον na kujitoa kwa Kristo
  choice: huo ndio ushuhuda uliotolewa kwa nyakati zake maalumu
  alternative: ushuhuda kwa nyakati zake maalumu; jambo lililoshuhudiwa kwa nyakati zake maalumu
  rationale: Kigiriki ni kifupi na kinaweza kuchukuliwa kama kirai cha maelezo kinachorejelea kujitoa kwa Kristo. Kiswahili kinahitaji uhusiano ulio wazi zaidi ili kisikike kama kichwa kilichokatika; “ulitolewa” limeongezwa kwa maana inayodokezwa, huku tanbihi ikihifadhi ufupisho na uwezekano mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Aliyejitoa mwenyewe” na “kwa ajili ya wote” ni miundo inayoeleweka kwa wasomaji wa kawaida. Kistari kirefu kinaonyesha kwamba “ushuhuda” unaeleza tendo lililotangulia; tanbihi inaweka wazi ufupisho halisi wa Kigiriki.
