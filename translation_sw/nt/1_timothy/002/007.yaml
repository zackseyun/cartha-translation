  text: εἰς ὃ ἐτέθην ἐγὼ κῆρυξ καὶ ἀπόστολος— ἀλήθειαν ⸀λέγω, οὐ ψεύδομαι— διδάσκαλος ἐθνῶν ἐν πίστει καὶ ἀληθείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/007.yaml
  text: For this I was appointed a herald and an apostle—I am telling the truth[c][b][a]; I am not lying—a teacher of the Gentiles in faith and truth.
translation:
  language: sw
  text: Kwa kusudi hili niliwekwa kuwa mtangazaji na mtume—nasema kweli, sisemi uongo—mwalimu wa watu wasio Wayahudi[a], katika imani[b] na kweli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mwalimu wa mataifa.”
    reason: lexical_alternative
  - marker: b
    text: Au, “katika uaminifu na kweli.”
    reason: alternative_reading
lexical_decisions:
- source_word: εἰς ὃ
  choice: Kwa ajili ya jambo hili
  rationale: Kirai hiki kinaelekeza nyuma kwenye ujumbe na kusudi lililotajwa kabla; tafsiri hii ni ya kawaida katika Kiswahili na inadumisha maana ya kusudi bila kulazimisha rejeo kuwa neno moja tu.
- source_word: ἐτέθην
  choice: niliwekwa
  rationale: Kauli tendwa ya τίθημι hapa ina maana ya kuwekwa au kuteuliwa kwa huduma. ‘Niliwekwa’ inadumisha taswira ya Kigiriki na inasikika kwa kawaida katika muktadha huu.
- source_word: κῆρυξ
  choice: mtangazaji
  rationale: κῆρυξ ni mtu anayetangaza hadharani kwa mamlaka ya mwingine. ‘Mtangazaji’ hueleweka kwa wasomaji wa sasa na huepuka kuifanya kuwa cheo cha kimadhehebu.
- source_word: ἀπόστολος
  choice: mtume
  rationale: Hili ndilo neno la kawaida na sahihi katika Kiswahili kwa cheo cha ἀπόστολος katika kujirejelea kwa Paulo.
- source_word: ἀλήθειαν λέγω, οὐ ψεύδομαι
  choice: nasema kweli, sisemi uongo
  rationale: Tafsiri hii inadumisha msisitizo wa uthibitisho chanya na ukanushaji unaofuata, kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: διδάσκαλος ἐθνῶν
  choice: mwalimu wa watu wa mataifa
  rationale: Katika matumizi ya Paulo, ἔθνη mara nyingi hurejelea watu wasio Wayahudi. ‘Watu wa mataifa’ ni wazi zaidi kwa Kiswahili cha sasa kuliko ‘Mataifa’ peke yake, huku ‘mataifa’ ikihifadhiwa kama uwezekano katika tanbihi.
- source_word: ἐν πίστει καὶ ἀληθείᾳ
  choice: katika imani na kweli
  rationale: ‘Katika’ inadumisha upana wa ἐν, ambao unaweza kueleza mazingira, tabia, au namna ya huduma. ‘Imani’ ndiyo tafsiri ya msingi ya πίστις hapa, bila kuondoa kabisa uwezekano wa ‘uaminifu’.
theological_decisions:
- issue: Maana ya ἐθνῶν katika utume wa Paulo
  choice: watu wa mataifa
  alternative: mataifa
  rationale: Muktadha wa matumizi ya Paulo unaelekea kwa watu wasio Wayahudi, lakini neno la Kigiriki lenyewe linaweza pia kutafsiriwa ‘mataifa’; tanbihi inadumisha upana huo.
- issue: Maana ya πίστις katika ἐν πίστει καὶ ἀληθείᾳ
  choice: imani
  alternative: uaminifu
  rationale: ‘Imani’ inafaa kama maana ya msingi, lakini πίστις inaweza pia kumaanisha uaminifu. Uwezekano huo haujaamuliwa kimyakimya bali umewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi na vistari virefu vinadumisha kauli ya mabano ya Paulo. Tanbihi zote zimewekewa alama katika matini kuu.
