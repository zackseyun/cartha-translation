    text: Au, “mwalimu wa mataifa.”
    reason: lexical_alternative
  - marker: b
    text: Au, “katika uaminifu na kweli.”
    reason: alternative_reading
  revision_rationale: The revision makes the purposive force of εἰς ὃ explicit and replaces an ambiguous Swahili expression for ἐθνῶν with a clear contextual equivalent. It retains the existing ambiguity note for πίστις and preserves the structure and emphasis of the Greek parenthesis.
