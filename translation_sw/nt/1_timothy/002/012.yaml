source:
  edition: SBLGNT
  text: ⸂διδάσκειν δὲ γυναικὶ⸃ οὐκ ἐπιτρέπω, οὐδὲ αὐθεντεῖν ἀνδρός, ἀλλ’ εἶναι ἐν ἡσυχίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/012.yaml
  text: But I do not permit a woman to teach or to exercise authority over a man[a]; instead[c][b], she is to be in quietness.
translation:
  language: sw
  text: Lakini simruhusu mwanamke kufundisha wala kutumia mamlaka juu ya mwanamume[a][b]; bali awe katika utulivu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mke ... mume.” Maneno ya Kigiriki yanaweza kumaanisha ama mwanamke na mwanamume kwa ujumla, ama mke na mume.
    reason: alternative_reading
  - marker: b
    text: Au, “kuwa na mamlaka juu ya”; huenda pia, “kutawala kwa mabavu.” Kitenzi cha Kigiriki ni adimu, na nuansi yake inajadiliwa.
    reason: lexical_alternative
  - marker: c
    text: Au, “katika ukimya.” Neno la Kigiriki linaweza kumaanisha utulivu, hali ya utulivu, au ukimya kulingana na muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: διδάσκειν
  choice: kufundisha
  rationale: Kitenzi-jina hiki kinakamilisha ἐπιτρέπω moja kwa moja; “kufundisha” ni tafsiri ya kawaida na iliyo wazi.
- source_word: δὲ
  choice: Lakini
  rationale: δέ inaonyesha tofauti ya kiasi na maagizo yaliyotangulia; “Lakini” inadumisha mgeuko huo.
- source_word: γυναικί
  choice: mwanamke
  rationale: γυνή inaweza kumaanisha mwanamke au mke. Muktadha mpana wa 2:9–15 unapendelea maana ya jumla, huku maana ya kindoa ikihifadhiwa katika tanbihi.
- source_word: οὐκ ἐπιτρέπω
  choice: simruhusu
  rationale: Kauli ya wakati uliopo imetafsiriwa kwa Kiswahili cha kawaida kama tamko la jumla la kutoruhusu.
- source_word: οὐδὲ
  choice: wala
  rationale: οὐδέ inaunganisha tendo la pili lililokatazwa na la kwanza; “wala” hudumisha uratibu hasi kwa kawaida katika Kiswahili.
- source_word: αὐθεντεῖν
  choice: kuwa na mamlaka juu ya
  rationale: Kitenzi hiki ni adimu na maana yake mahsusi inajadiliwa. Tafsiri hii inadumisha maana ya mamlaka bila kulazimisha dhana hasi ya kutawala kwa mabavu.
- source_word: ἀνδρός
  choice: mwanamume
  rationale: ἀνήρ inaweza kumaanisha mwanamume au mume. Maana ya jumla imewekwa katika matini, na maana ya kindoa imeonyeshwa katika tanbihi.
- source_word: ἀλλ’
  choice: badala yake
  rationale: ἀλλά inaleta hali chanya inayotofautishwa na makatazo yaliyotangulia; “badala yake” huonyesha tofauti hiyo wazi.
- source_word: εἶναι
  choice: anapaswa kuwa
  rationale: Ufafanuzi huu wa kitenzi-jina ni wa kawaida katika Kiswahili na unaonyesha kuwa kifungu cha mwisho kinaeleza hali inayotarajiwa.
- source_word: ἐν ἡσυχίᾳ
  choice: katika utulivu
  rationale: ἡσυχία inaweza kuonyesha utulivu, hali ya kutokuwa na fujo, au ukimya kulingana na muktadha. “Katika utulivu” haidai kimakosa ukimya kabisa.
theological_decisions:
- issue: Maana ya αὐθεντεῖν katika kifungu kinachojadiliwa kuhusu utaratibu wa kusanyiko
  choice: kuwa na mamlaka juu ya
  alternative: kutumia mamlaka juu ya; kutawala kwa mabavu
  rationale: Tafsiri imeepuka kuingiza maana ya matumizi mabaya ya mamlaka ambayo kitenzi chenyewe hakilazimishi, huku tanbihi ikihifadhi uwezekano huo unaojadiliwa.
- issue: Iwapo γυνή / ἀνήρ humaanisha mwanamke/mwanamume au mke/mume
  choice: mwanamke ... mwanamume
  alternative: mke ... mume
  rationale: Majina yote mawili yanaweza kuwa na maana ya jumla au ya kindoa. Muktadha unapendelea maana ya jumla, lakini utata halisi wa kileksika umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imetungwa kwa uwazi kwa wasomaji wa kawaida huku ikidumisha utata wa maneno ya Kigiriki kuhusu jinsia/hali ya ndoa, aina ya mamlaka, na kiwango cha ukimya.
