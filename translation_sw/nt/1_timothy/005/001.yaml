base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/001.yaml
  text: Do not rebuke an older man[a], but appeal to him as a father, and to younger men as brothers,
translation:
  language: sw
  text: Usimkemee mwanamume mzee[a], bali umsihi kama baba; na wanaume vijana, uwahimize kama ndugu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, mzee. Neno la Kigiriki linaweza kumaanisha mwanamume mzee au mzee mwenye cheo kanisani; lakini utofautishaji wa makundi kwa umri katika muktadha huu unapendelea maana ya kwanza.
    reason: alternative_reading
lexical_decisions:
- source_word: Πρεσβυτέρῳ
  choice: mwanamume mwenye umri mkubwa
  rationale: Katika muktadha huu neno hilo linalingana na νεωτέρους (‘wanaume vijana’) na makundi ya wanawake katika mstari unaofuata. Hivyo maana ya umri ndiyo inayowezekana zaidi kuliko cheo cha uongozi wa kanisa. Jinsia ya kiume imehifadhiwa.
- source_word: μὴ ἐπιπλήξῃς
  choice: usimkemee
  rationale: Kitenzi hiki humaanisha kumshutumu au kumkemea mtu kwa maneno. ‘Usimkemee’ ni Kiswahili cha kawaida na chenye uzito unaofaa bila kuongeza wazi kiwango cha ukali.
- source_word: ἀλλὰ παρακάλει
  choice: bali umsihi
  rationale: παρακαλέω inaweza kumaanisha kusihi, kuhimiza, au kutia moyo. Hapa ‘umsihi’ huonyesha njia ya heshima na ya kindugu iliyo kinyume na kukemea.
- source_word: ὡς πατέρα
  choice: kama baba
  rationale: Huhifadhi ulinganisho wa moja kwa moja unaoletwa na ὡς kwa Kiswahili cha asili.
- source_word: νεωτέρους
  choice: wanaume vijana
  rationale: Kivumishi hiki cha wingi wa kiume kimetumiwa kama nomino. Mstari unaofuata unataja wanawake kando, kwa hiyo tafsiri ya kiume inafaa hapa.
- source_word: ὡς ἀδελφούς
  choice: kama ndugu
  rationale: ‘Ndugu’ ni neno la kawaida la Kiswahili kwa uhusiano wa kindugu. Katika muundo huu ‘wanaume vijana’ tayari hufafanua kuwa rejeo ni la kiume, bila kulazimika kutumia usemi mzito kama ‘ndugu wa kiume.’
theological_decisions:
- issue: Ikiwa Πρεσβυτέρῳ humaanisha mwenye umri mkubwa au mzee mwenye cheo kanisani
  choice: mwanamume mwenye umri mkubwa
  alternative: mzee wa kanisa
  rationale: 'Mpangilio wa kifungu unatofautisha makundi kwa umri na jinsia: mwanamume mkubwa kama baba, wanaume vijana kama ndugu, kisha wanawake wakubwa na vijana katika mstari unaofuata. Hilo linaunga mkono maana ya umri, huku uwezekano wa cheo ukihifadhiwa katika tanbihi.'
- issue: Ikiwa ἀδελφούς itafsiriwe kwa maana jumuishi
  choice: ndugu, ikifafanuliwa na ‘wanaume vijana’
  alternative: ndugu wa kiume na wa kike
  rationale: Katika muktadha huu makundi ya wanaume na wanawake yametajwa kando. Kwa hiyo tafsiri jumuishi ingefifisha mpangilio wa asili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaoeleweka kwa urahisi. ‘Mwanamume mwenye umri mkubwa’ huepuka utata wa neno ‘mzee’ katika maandishi makuu, huku tanbihi ikihifadhi maana nyingine inayowezekana. Alama ya nuktamkato baada ya ‘baba’ inaonyesha mwendelezo wa kitenzi ‘umsihi’ kwa kundi la wanaume vijana.
