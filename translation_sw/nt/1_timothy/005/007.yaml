  text: And command these things[b][a], so that they may be above reproach.
translation:
  language: sw
  text: Na uyaagize[a] mambo haya, ili wasiwe[b] na lawama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “uyafundishe” au “uyaelekeze”; kitenzi hiki kina nguvu ya kimamlaka.
    reason: lexical_alternative
  - marker: b
    text: Kigiriki hakitaji wazi ni nani wanaopaswa kutokuwa na lawama. Katika muktadha, huenda ni wale wanaohusika katika maagizo yaliyotangulia, hasa wajane na familia zao.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: Na
  rationale: Kiunganishi rahisi kinaendeleza maagizo yaliyotangulia bila kuongeza msisitizo usiokuwamo katika Kigiriki.
- source_word: ταῦτα
  choice: mambo haya
  rationale: Kiwakilishi hiki cha wingi kinarejelea maagizo yaliyotangulia na yaliyo karibu katika muktadha, bila kuyafafanua zaidi kuliko Kigiriki.
- source_word: παράγγελλε
  choice: uyaagize
  rationale: Kitenzi hiki cha amri kina nguvu ya kimamlaka; “agiza” ni cha kawaida na chenye hadhi katika Kiswahili, huku kiambishi “ya” kikirejelea “mambo haya.”
- source_word: ἵνα
  choice: ili
  rationale: “Ili” linaonyesha kusudi au matokeo kwa njia ya kawaida na wazi katika Kiswahili.
- source_word: ἀνεπίλημπτοι
  choice: wasiwe na lawama
  rationale: Usemi huu unaonyesha hali ya kutokuwa na msingi halali wa kulaumiwa, bila kudokeza ukamilifu usio na kosa lolote.
- source_word: ὦσιν
  choice: wasiwe
  rationale: Hali tegemezi baada ya ἵνα imewakilishwa kwa “ili wasiwe”; ngeli ya wingi imehifadhiwa bila kutaja wazi kundi linalokusudiwa.
theological_decisions:
- issue: Kundi linalorejelewa na kiima cha wingi katika “wasiwe na lawama”
  choice: Kiima kimeachwa bila kutajwa wazi, kama kilivyo katika Kigiriki.
  alternative: Kutaja wajane, familia zao, Timotheo, au jumuiya ya waamini kwa upana zaidi.
  rationale: Kigiriki hakitaji kiima cha wingi. Muktadha wa karibu unaelekeza hasa kwa watu waliozungumziwa katika maagizo yaliyotangulia, hususan wajane na familia zao, lakini kutaja kundi moja katika matini kuu kungeondoa utata halisi wa sentensi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, wazi, na yenye hadhi. Mpangilio “uyaagize mambo haya” ni wa kawaida na unahifadhi nguvu ya amri, huku “wasiwe na lawama” ikihifadhi utata wa kiima cha Kigiriki.
