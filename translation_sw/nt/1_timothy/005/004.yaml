language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἰ δέ τις χήρα τέκνα ἢ ἔκγονα ἔχει, μανθανέτωσαν πρῶτον τὸν ἴδιον οἶκον εὐσεβεῖν καὶ ἀμοιβὰς ἀποδιδόναι τοῖς προγόνοις, τοῦτο γάρ ἐστιν ἀπόδεκτον ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/004.yaml
  text: But if any widow has children or grandchildren[a], let them first learn to show godliness to their own household and to repay their forebears[c][b], for this is acceptable before God.
translation:
  language: sw
  text: Lakini mjane yeyote akiwa na watoto au wajukuu[a], hao wajifunze kwanza kutenda kwa utauwa kwa familia yao wenyewe[b] na kuwarudishia waliowatangulia mema[c], kwa maana jambo hili linakubalika mbele za Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watoto au wazao.” Neno la Kigiriki ἔκγονα linaweza kuwa pana kuliko “wajukuu,” ingawa hapa huenda linarejelea kizazi kinachofuata katika familia.
    reason: lexical_alternative
  - marker: b
    text: Au, “kuonyesha utauwa kwa familia yao wenyewe.” Katika muktadha huu, utauwa huu huonekana katika kuwajibikia familia.
    reason: lexical_alternative
  - marker: c
    text: Au, “wazazi wao” au “babu na nyanya zao.” Kigiriki kinamaanisha waliotangulia katika ukoo.
    reason: lexical_alternative
lexical_decisions:
- source_word: χήρα
  choice: mjane
  rationale: Neno la kawaida la Kiswahili kwa mwanamke ambaye mume wake amekufa; muktadha unawahusu wajane.
- source_word: τέκνα ἢ ἔκγονα
  choice: watoto au wajukuu
  rationale: τέκνα ni watoto, na ἔκγονα inaweza kumaanisha wazao kwa upana, lakini katika muktadha huu inaelekea kumaanisha wajukuu.
- source_word: μανθανέτωσαν
  choice: hao wajifunze
  rationale: Huhifadhi amri ya nafsi ya tatu wingi na kuweka wazi kuwa wahusika ni watoto au wajukuu waliotajwa karibu zaidi.
- source_word: πρῶτον
  choice: kwanza
  rationale: Huonyesha kipaumbele cha wajibu kwa familia.
- source_word: τὸν ἴδιον οἶκον
  choice: familia yao wenyewe
  rationale: οἶκος hapa ni familia au kaya, si jengo tu; 'familia' ni ya kawaida na wazi katika Kiswahili.
- source_word: εὐσεβεῖν
  choice: kuonyesha utauwa kwa kuitunza
  rationale: Huhifadhi maana ya kidini ya utauwa huku ikionyesha kwa kawaida tendo linalokusudiwa katika muktadha, yaani kuwajibikia familia.
- source_word: ἀμοιβὰς ἀποδιδόναι
  choice: kuwalipa ... kwa mema waliyowatendea
  rationale: Kiswahili cha moja kwa moja 'kuwalipa waliowatangulia' kinaweza kusikika kama malipo ya fedha; nyongeza hii ya kimuktadha huonyesha kurudisha wema au malezi waliyopokea.
- source_word: τοῖς προγόνοις
  choice: waliowatangulia
  rationale: Huhifadhi upana wa πρόγονοι, yaani wazazi, babu na nyanya, au vizazi vilivyotangulia, bila kulazimisha rejeo moja.
- source_word: ἀπόδεκτον
  choice: linakubalika
  rationale: Ni ulinganifu wa karibu na wa kawaida unaoonyesha jambo kupokelewa kwa kibali.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: mbele za Mungu
  rationale: Nahau ya kawaida na yenye heshima kwa tendo linalotazamwa au kutathminiwa na Mungu.
theological_decisions:
- issue: Rejeo la amri ya wingi μανθανέτωσαν
  choice: Amri inawaelekea watoto au wajukuu wa mjane.
  alternative: Amri inawaelekea wajane kwa ujumla, huku kukiwa na badiliko la idadi au kiima kilichodokezwa.
  rationale: Kiima cha wingi kilicho karibu zaidi ni τέκνα ἢ ἔκγονα. Hii pia inafaa mantiki ya familia kumtunza mjane na kurudisha mema ya kizazi kilichowatangulia.
- issue: Maana ya εὐσεβεῖν katika utunzaji wa familia
  choice: Kutunza familia kunawasilishwa kama kuonyesha utauwa.
  alternative: Neno linamaanisha tu kutimiza wajibu wa kifamilia bila maana dhahiri ya kidini.
  rationale: εὐσεβεῖν lina maana ya wazi ya uchaji au utauwa, na mwisho wa mstari unaunganisha tendo hili na kile kinachokubalika mbele za Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. 'Hao' huondoa utata wa kiima cha wingi; 'kwa kuitunza' hufanya uhusiano kati ya utauwa na wajibu wa familia uwe wazi bila kuondoa maana ya kidini. Alama zote za tanbihi zimewekwa katika matini kuu kwa mpangilio [a], [b], [c].
