  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἰ δέ τις τῶν ἰδίων καὶ ⸀μάλιστα οἰκείων οὐ ⸀προνοεῖ, τὴν πίστιν ἤρνηται καὶ ἔστιν ἀπίστου χείρων.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/008.yaml
  text: But if anyone does not provide for his own[a], and especially for members of his household[b], he has denied the faith and is worse than an unbeliever.
translation:
  language: sw
  text: Lakini mtu yeyote asipowatunza watu wake[a], na hasa watu wa nyumbani kwake, ameikana imani[b] na ni mbaya kuliko mtu asiyeamini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “jamaa zake”; maneno haya ni mapana kuliko wale wanaoishi katika nyumba moja, huku kirai “watu wa nyumbani kwake” kikibainisha kundi lenye wajibu wa pekee zaidi.
    reason: lexical_alternative
  - marker: b
    text: Au “ameiacha imani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τις
  choice: mtu yeyote
  rationale: Huwakilisha nafsi isiyobainishwa yenye maana ya jumla, bila kuzuia kauli hii kwa wanaume pekee.
- source_word: τῶν ἰδίων
  choice: watu wake mwenyewe
  rationale: Ni kundi pana la walio wake, kama jamaa au wategemezi, na halihusu tu wanaoishi chini ya paa moja; kirai kinachofuata kinabainisha zaidi walio wa nyumbani.
- source_word: μάλιστα
  choice: hasa
  rationale: Hutilia mkazo kundi dogo ndani ya kundi pana na ni usemi wa kawaida wa Kiswahili.
- source_word: οἰκείων
  choice: watu wa nyumbani mwake
  rationale: Hurejelea hasa walio katika nyumba yake au wanaotegemea nyumba hiyo, huku likitofautishwa na kundi pana la 'watu wake mwenyewe.'
- source_word: προνοεῖ
  choice: asipowatunza
  rationale: Katika muktadha huu humaanisha kufikiria mahitaji yao mapema na kuyatimiza kwa msaada wa vitendo; 'kuwatunza' ni pana na ya kawaida, ikijumuisha mahitaji ya kimwili na huduma.
- source_word: τὴν πίστιν
  choice: imani
  rationale: Hapa inarejelea imani ya Kikristo anayokiri mtu, si tu tendo la kuamini kwa ndani.
- source_word: ἤρνηται
  choice: ameikana
  rationale: Huhifadhi uzito wa tendo la kukataa au kujitenga na imani, na hali ya wakati timilifu ya Kigiriki yenye matokeo yanayoendelea.
- source_word: ἀπίστου
  choice: asiyeamini
  rationale: Katika ulinganisho huu humaanisha mtu asiye na imani, badala ya mtu asiyeaminika tu.
- source_word: χείρων
  choice: mbaya kuliko
  rationale: Hutoa ulinganisho wa wazi wa kimaadili kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Uwakilishi wa kijinsia katika muundo wa Kigiriki wa umoja wenye maana ya jumla
  choice: mtu yeyote ... watu wake mwenyewe ... nyumbani mwake
  alternative: mwanaume yeyote ... watu wake mwenyewe; au muundo wa wingi usioonyesha jinsia
  rationale: Maana ya τις ni ya jumla na inawahusu watu wote. Kiswahili kinaweza kudumisha umoja huo kwa 'mtu yeyote' bila kuifanya amri iwahusu wanaume pekee.
- issue: Maana ya πίστις katika τὴν πίστιν ἤρνηται
  choice: imani, yaani imani ya Kikristo inayokiriwa
  alternative: uaminifu au tumaini la mtu binafsi
  rationale: Katika muktadha wa Nyaraka za Kichungaji, kifungu hiki kinaelekea kumaanisha imani inayokiriwa na jumuiya ya Kikristo; mwenendo wa kutowatunza walio wake unaikana kwa vitendo. Neno 'imani' linahifadhi istilahi yenyewe bila kuongeza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Kuwatunza' ni cha asili na kinabeba wazo la msaada wa vitendo; tofauti kati ya kundi pana la walio wake na kundi maalumu la nyumbani imehifadhiwa.
