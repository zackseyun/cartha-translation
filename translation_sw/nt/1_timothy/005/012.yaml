    issue: The words “na hivyo” add an inferential connection not expressed in the Greek text.
    rationale: ἔχουσαι κρίμα begins the extant verse with a participial clause; although it depends syntactically on the preceding context, this verse itself does not contain a term corresponding to “thus.”
  - severity: low
    issue: “Imani yao ya kwanza” can sound like an ordinal ‘first faith’ rather than the former/earlier faith or commitment at issue.
    rationale: “Imani yao ya awali” is more idiomatic in this context and reflects the temporal force of πρώτην without resolving whether πίστις means faith or pledge.
