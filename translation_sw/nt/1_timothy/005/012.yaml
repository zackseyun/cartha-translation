  verdict: revise
  source_fidelity: 'The core sense is well represented: κρίμα is appropriately rendered “hukumu,” ὅτι as “kwa sababu,” and ἠθέτησαν as “wameiweka kando.” However, the added connective “na hivyo” has no counterpart in the Greek text of this verse. Also, “ya awali” more naturally conveys the temporal sense of πρώτην in this context while retaining the disputed referent of πίστις.'
  naturalness: “Wanajiletea hukumu” is idiomatic Standard East African Swahili for incurring judgment. Removing the unnecessary initial connective yields a natural verse-level rendering.
  terminology: “Imani” properly retains the default sense of πίστις in the main text. The footnote should retain the viable contextual alternatives, especially “ahadi” (pledge) and “msimamo/ahadi ya awali” (former commitment), without presenting “wajibu” as though obligation were the lexical meaning.
  issues:
