translation:
  language: sw
  text: wanajiletea hukumu kwa sababu wameiweka kando imani yao ya awali[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ahadi yao ya kwanza” au “msimamo wao wa awali.” Neno la Kigiriki linaweza kumaanisha “imani,” lakini katika muktadha huu wengine hulielewa kuwa ahadi au msimamo waliokuwa wameukubali hapo awali, huenda ukihusiana na kuorodheshwa miongoni mwa wajane.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔχουσαι
  choice: wanajiletea
  rationale: Ingawa kitenzi hiki kwa kawaida humaanisha ‘wakiwa na,’ kinapotumiwa pamoja na κρίμα hapa kinaeleza kujitia chini ya hukumu; ‘wanajiletea hukumu’ ni Kiswahili cha kawaida kinachohifadhi maana hiyo.
- source_word: κρίμα
  choice: hukumu
  rationale: ‘Hukumu’ huhifadhi uzito wa neno bila kulifanya limaanishe moja kwa moja hukumu ya milele au adhabu, jambo ambalo mstari wenyewe hausemi wazi.
- source_word: ὅτι
  choice: kwa sababu
  rationale: Kirai hiki kinatanguliza sababu ya hukumu kwa njia iliyo wazi na ya kawaida katika Kiswahili.
- source_word: τὴν πρώτην πίστιν
  choice: imani yao ya kwanza
  rationale: ‘Imani’ ndiyo maana ya msingi ya πίστις, na ‘ya kwanza’ huhifadhi kwa karibu πρώτην pamoja na uwezekano wa maana ya awali. Kwa kuwa katika muktadha huu kirai hicho kinaweza pia kumaanisha ahadi au wajibu wa awali, uwezekano huo umewekwa katika tanbihi.
- source_word: ἠθέτησαν
  choice: wameiweka kando
  rationale: Kauli hii inaonyesha kukataa au kutotimiza jambo lililokuwa linawafunga, bila kuingiza maana kali zaidi kuliko chanzo.
theological_decisions:
- issue: Maana ya τὴν πρώτην πίστιν katika muktadha
  choice: imani yao ya kwanza
  alternative: ahadi yao ya kwanza; wajibu wao wa awali
  rationale: Neno πίστις kwa msingi humaanisha ‘imani,’ lakini hapa huenda likarejelea ahadi au wajibu wa awali, pengine uliohusiana na kuorodheshwa miongoni mwa wajane. Matini kuu inahifadhi ‘imani,’ huku tanbihi ikihifadhi tafsiri mbadala bila kuamua mjadala kimyakimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ‘wanajiletea hukumu’ ni wa kawaida na unaeleweka, huku ‘wameiweka kando’ ukihifadhi taswira ya kukataa au kupuuza jambo la awali.
