id: 1TI.5.25
reference: 1 Timothy 5:25
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὡσαύτως καὶ τὰ ⸂ἔργα τὰ καλὰ⸃ ⸀πρόδηλα, καὶ τὰ ἄλλως ἔχοντα κρυβῆναι οὐ δύνανται.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/025.yaml
  text: Likewise also[a], good works are evident, and those that are otherwise cannot remain hidden.
translation:
  language: sw
  text: Vivyo hivyo pia, matendo mema yako dhahiri, na yale yasiyo hivyo[a] hayawezi kufichika.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “yale yaliyo tofauti” au “yale yasiyo ya namna hiyo”; baadhi huelewa maneno haya kuwa yanamaanisha hasa matendo mabaya kwa kulinganisha na mstari uliotangulia.
    reason: alternative_reading
lexical_decisions:
- source_word: ὡσαύτως καί
  choice: Vivyo hivyo
  rationale: Kauli hii inaunganisha mstari kwa karibu na ulinganisho wa mstari uliotangulia. Katika Kiswahili, “vivyo hivyo” huwasilisha kwa kawaida nguvu ya ὡσαύτως pamoja na καί bila kuongeza maneno yasiyo ya lazima.
- source_word: ἔργα τὰ καλά
  choice: matendo mema
  rationale: Ni tafsiri ya kawaida na ya wazi inayohifadhi maana ya matendo yenye sifa njema kimaadili.
- source_word: πρόδηλα
  choice: yako dhahiri
  rationale: “Dhahiri” huonyesha kuwa matendo hayo yanaonekana au yanajulikana wazi, na hudumisha utofauti wake na yale yasiyoweza kufichika.
- source_word: τὰ ἄλλως ἔχοντα
  choice: yale yasiyo hivyo
  rationale: Kauli hii fupi huhifadhi kutokuwa wazi kwa Kigiriki kuhusu kama matendo hayo ni mabaya au ni matendo ambayo bado hayajawa dhahiri, badala ya kuingiza neno “mabaya” lisilopo katika matini.
- source_word: κρυβῆναι οὐ δύνανται
  choice: hayawezi kufichika
  rationale: Huwasilisha moja kwa moja kutowezekana kwa matendo hayo kubaki yamefichwa; katika muktadha, mwishowe yataonekana.
theological_decisions:
- issue: Je, τὰ ἄλλως ἔχοντα humaanisha hasa matendo mabaya au kwa upana zaidi matendo yasiyo hivyo/yasiyo dhahiri bado?
  choice: matendo yasiyo hivyo, bila kuyaita moja kwa moja mabaya
  alternative: matendo mabaya
  rationale: Kigiriki hakitumii neno linalomaanisha “mabaya.” Tafsiri “yale yasiyo hivyo” huhifadhi uwezekano wa kuyaelewa kuwa ya aina nyingine au kuwa hayajawa dhahiri, huku muktadha wa mstari uliotangulia ukiruhusu baadhi kuyaona kuwa matendo mabaya.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. “Matendo mema” ni usemi wa kawaida wa kibiblia, na “yale yasiyo hivyo” huhifadhi utata halisi wa matini.
