  text: βούλομαι οὖν νεωτέρας γαμεῖν, τεκνογονεῖν, οἰκοδεσποτεῖν, μηδεμίαν ἀφορμὴν διδόναι τῷ ἀντικειμένῳ λοιδορίας χάριν·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/014.yaml
  text: Therefore I want younger widows to marry[a], to bear children, to manage their households[b], and to give the opponent no opportunity for slander.
translation:
  language: sw
  text: Kwa hiyo, nataka wajane walio vijana waolewe[a], wazae watoto, wasimamie nyumba zao, na wasimpe mpinzani[b] nafasi yoyote ya kutukana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki husema tu “kuoa/kuolewa”; kwa kuwa muktadha unazungumzia wajane vijana, kuolewa tena kunadokezwa.
    reason: lexical_alternative
  - marker: b
    text: Au “adui”; huenda ikimrejelea Shetani.
    reason: alternative_reading
lexical_decisions:
- source_word: βούλομαι
  choice: nataka
  rationale: Huhifadhi nguvu ya kauli ya Paulo kuhusu mapenzi au kusudi lake kwa Kiswahili cha kawaida na cha moja kwa moja.
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Huonyesha hitimisho linalotokana na maelezo yaliyotangulia.
- source_word: νεωτέρας
  choice: wajane vijana
  rationale: Kivumishi chenyewe humaanisha walio vijana, lakini muktadha wa 1 Timotheo 5 unaonyesha wazi kuwa wanaozungumziwa ni wajane.
- source_word: γαμεῖν
  choice: waolewe
  rationale: Kitenzi humaanisha kuingia katika ndoa. Kwa kuwa wanaozungumziwa ni wajane, kuolewa tena kunadokezwa na muktadha lakini hakusemwi wazi katika kitenzi chenyewe.
- source_word: τεκνογονεῖν
  choice: wazae watoto
  rationale: Hutoa maana mahsusi ya kuzaa watoto kwa lugha ya kawaida na iliyo wazi.
- source_word: οἰκοδεσποτεῖν
  choice: wasimamie nyumba zao
  rationale: Huonyesha kuwa na jukumu la kuongoza na kusimamia mambo ya nyumbani bila kuingiza wazo kali lisilo la lazima la kutawala kimabavu.
- source_word: μηδεμίαν ἀφορμὴν διδόναι
  choice: wala wasimpe ... nafasi yoyote
  rationale: Huwasilisha kwa Kiswahili asilia wazo la kutompa mpinzani mwanya au fursa ya kushambulia.
- source_word: τῷ ἀντικειμένῳ
  choice: mpinzani
  rationale: Huhifadhi umoja na kutomtambulisha mhusika kwa uhakika kuwa Shetani, jambo ambalo Kigiriki hakisemi wazi.
- source_word: λοιδορίας χάριν
  choice: ya kutukana
  rationale: Huwasilisha kusudi la usemi wa dharau, shutuma, au matusi dhidi ya waamini; tanbihi inaeleza upana wa maana.
theological_decisions:
- issue: Anayerejelewa na τῷ ἀντικειμένῳ
  choice: mpinzani, bila kumtambulisha kwa uhakika
  alternative: adui, akieleweka kuwa Shetani
  rationale: Kigiriki kinataja tu yule anayepinga. Muktadha unaweza kumaanisha mkosoaji mwenye uhasama, huku uwezekano wa kumrejelea Shetani ukiendelea kuwepo; tanbihi huhifadhi utata huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa sentensi huhifadhi mfuatano wa vitenzi vya Kigiriki huku ukisomeka kwa urahisi. Alama zote za tanbihi zimewekwa katika matini kuu.
