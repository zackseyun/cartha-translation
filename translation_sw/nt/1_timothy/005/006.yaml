  source_fidelity: “Lakini” accurately represents the contrastive δέ. “Yule anayeishi kwa anasa” suitably renders the feminine substantival present participle ἡ ... σπαταλῶσα in its widow-context without adding “mjane” to the verse. “Amekufa, ingawa yu hai” preserves both the perfect-resultant sense of τέθνηκεν and the deliberate paradox with ζῶσα, without defining the metaphor beyond the Greek.
