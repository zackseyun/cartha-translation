  text: ἡ δὲ σπαταλῶσα ζῶσα τέθνηκεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/006.yaml
  text: But she who lives for pleasure is dead even while she lives[a].
translation:
  language: sw
  text: Lakini yule anayeishi kwa anasa amekufa ingawa yu hai.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Lakini yule anayejifurahisha kupita kiasi amekufa ingawa yu hai.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σπαταλῶσα
  choice: anayeishi kwa anasa
  rationale: Kitenzi hiki kinaonyesha maisha ya kujiendekeza katika anasa na starehe, si kufurahia jambo kwa kawaida tu. Kauli hii ya Kiswahili ni ya asili na inahifadhi maana ya mwenendo unaoendelea.
- source_word: ζῶσα
  choice: ingawa yu hai
  rationale: 'Kirai hiki kina nguvu ya kukubali hali inayokinzana na inayofuata: ni hai kimwili, lakini amekufa kwa maana nyingine. ‘Ingawa yu hai’ huonyesha kitendawili hicho kwa uwazi bila kukifafanua kupita kiasi.'
- source_word: τέθνηκεν
  choice: amekufa
  rationale: Wakati timilifu wa Kigiriki unaonyesha tendo la kufa lenye hali inayoendelea. ‘Amekufa’ huhifadhi umbo hilo na pia nguvu ya sitiari katika muktadha.
- source_word: ἡ ... σπαταλῶσα
  choice: yule anayeishi kwa anasa
  rationale: Kifungu cha Kigiriki ni cha jinsia ya kike na kinamtaja mwanamke kwa sifa ya mwenendo wake. Katika muktadha wa wajane, ‘yule’ hurejelea mwanamke kwa kawaida bila kuongeza neno lisilokuwamo wazi katika mstari.
- source_word: δὲ
  choice: Lakini
  rationale: Neno hili linaonyesha utofauti kati ya mwanamke huyu na mjane wa kweli aliyeelezwa katika mstari uliotangulia.
theological_decisions:
- issue: Maana ya ‘amekufa’ huku akiwa hai
  choice: Sitiari ya kifo kisicho cha kimwili, bila kukifafanua zaidi katika tafsiri
  alternative: Amekufa kiroho; amekufa kimaadili; ni kama amekufa kijamii
  rationale: Mgongano wa ‘amekufa’ na ‘ingawa yu hai’ unaonyesha wazi kuwa si kifo cha mwili. Tafsiri inadumisha mvutano huo wa kiteolojia bila kuingiza ufafanuzi maalumu ambao mstari wenyewe hautoi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Yu hai’ ni kifupi cha kawaida na chenye mtiririko mzuri katika usemi huu; ‘anasa’ hapa inaonyesha maisha ya kujifurahisha na kujistarehesha kupita kiasi.
