  text: ἡ δὲ ὄντως χήρα καὶ μεμονωμένη ἤλπικεν ἐπὶ ⸀θεὸν καὶ προσμένει ταῖς δεήσεσιν καὶ ταῖς προσευχαῖς νυκτὸς καὶ ἡμέρας·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/005.yaml
  text: She who is truly a widow[a], and is left all alone[c][b], has set her hope on God and continues in petitions and prayers night and day.
translation:
  language: sw
  text: Lakini mjane wa kweli, aliyebaki peke yake[a], ameweka tumaini lake kwa Mungu[b], naye hudumu katika maombi ya haja na sala[c] usiku na mchana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliye peke yake.” Kauli timilifu ya Kigiriki hueleza hali yake ya kubaki bila msaada wa familia.
    reason: lexical_alternative
  - marker: b
    text: Au, “amemtumainia Mungu.” Kauli timilifu ya Kigiriki inaweza kusisitiza tumaini lililowekwa ambalo linaendelea.
    reason: lexical_alternative
  - marker: c
    text: 'Maneno mawili ya Kigiriki yamehifadhiwa: la kwanza hukazia maombi ya haja maalumu, na la pili ni neno la jumla zaidi kwa sala.'
    reason: lexical_distinction
lexical_decisions:
- source_word: δὲ
  choice: Lakini
  rationale: Kiunganishi hiki kinaonyesha tofauti na hali ya mjane mwenye watoto au wajukuu katika mstari uliotangulia; ‘Lakini’ kinaifanya tofauti hiyo iwe wazi kwa Kiswahili cha kawaida.
- source_word: ὄντως χήρα
  choice: mwanamke aliye mjane kweli
  rationale: ὄντως inamtambulisha mjane anayelingana na hali inayofafanuliwa katika muktadha, si tu kutumia jina la kijamii. Muundo huu pia unaweka wazi jinsia ya mhusika bila Kiswahili kisicho cha kawaida.
- source_word: μεμονωμένη
  choice: ameachwa peke yake
  rationale: Kauli timilifu ya kutendwa inaonyesha kwamba ameachwa na sasa yuko katika hali ya kuwa peke yake, hasa bila watu wa familia wa kumtegemeza.
- source_word: ἤλπικεν ἐπὶ θεόν
  choice: ameweka tumaini lake kwa Mungu
  rationale: Kauli timilifu inaonyesha tumaini lililowekwa na linaloendelea kuwa msimamo wake; ‘kwa Mungu’ humtaja Mungu kuwa msingi wa tumaini hilo.
- source_word: προσμένει
  choice: hudumu
  rationale: Kitenzi cha wakati uliopo kinaonyesha kuendelea na kudumu katika tendo, bila kuongeza dhana isiyokuwamo ya nadhiri au cheo rasmi.
- source_word: ταῖς δεήσεσιν
  choice: maombi ya haja
  rationale: Huyabainisha maombi yenye maombi maalumu au haja, na hivyo kuhifadhi tofauti yake na neno la jumla linalofuata.
- source_word: ταῖς προσευχαῖς
  choice: sala
  rationale: Neno hili ni la jumla kwa tendo la kusali; limehifadhiwa kando na ‘maombi ya haja’ ili kuakisi jozi ya maneno ya Kigiriki.
- source_word: νυκτὸς καὶ ἡμέρας
  choice: usiku na mchana
  rationale: Ni usemi wa kawaida wa Kiswahili unaodokeza desturi inayoendelea na pia unahifadhi mpangilio wa Kigiriki.
theological_decisions:
- issue: Maana ya ‘mjane kweli’
  choice: 'Kauli hiyo inamweleza mjane anayestahili kuitwa hivyo katika mpangilio wa utunzaji unaozungumziwa: hana msaada wa familia, anamwekea Mungu tumaini, na hudumu katika sala.'
  alternative: Kauli hiyo inawahusu wajane wote kwa jumla bila kuwa na maana ya sifa au vigezo katika muktadha.
  rationale: ὄντως pamoja na muktadha wa 1 Timotheo 5:3–16 hutofautisha kundi maalumu la wajane. Tafsiri inadokeza nguvu hiyo ya kimuktadha bila kuingiza utaratibu wa dhehebu fulani.
- issue: Nguvu ya kauli timilifu katika ἤλπικεν
  choice: ‘Ameweka tumaini lake’ huonyesha tendo lililofanyika ambalo matokeo yake yanaendelea.
  alternative: ‘Alitumaini’ lingeweza kueleweka kuwa tendo la wakati uliopita lisilo na athari ya sasa.
  rationale: Kauli timilifu ya Kigiriki inaweza kusisitiza hali thabiti ya sasa iliyotokana na kuweka tumaini kwa Mungu; tafsiri haidai zaidi ya hilo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Maombi ya haja na sala’ ni wazi kwa msomaji wa kawaida na huhifadhi tofauti ya maneno mawili ya Kigiriki. Muundo huepuka msamiati wa kidhehebu na unabaki karibu na mtiririko wa sentensi ya chanzo.
