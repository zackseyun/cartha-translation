  text: Χήρας τίμα τὰς ὄντως χήρας.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/003.yaml
  text: Honor widows who are truly widows[a].
translation:
  language: sw
  text: Waheshimu wajane ambao kweli ni wajane.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Watunze wajane ambao kweli ni wajane.” Katika muktadha huu, kuwaheshimu huenda kunajumuisha kuwasaidia kwa mahitaji yao.
    reason: lexical_alternative
lexical_decisions:
- source_word: Χήρας
  choice: wajane
  rationale: Neno χήρα linamaanisha wanawake ambao waume zao wamekufa; hapa liko katika wingi kama yambwa ya amri.
- source_word: τίμα
  choice: Waheshimu
  rationale: Kitenzi τιμάω kimsingi humaanisha kumheshimu au kumthamini mtu. Katika muktadha huu heshima hiyo yaelekea inahusisha pia msaada wa mahitaji, lakini maana yake haipaswi kufupishwa kuwa msaada wa kifedha pekee.
- source_word: τὰς ὄντως χήρας
  choice: ambao kweli ni wajane
  rationale: Muundo huu unadumisha msisitizo wa Kigiriki unaowatofautisha wajane wanaostahili kuitwa hivyo kwa maana inayofafanuliwa katika mistari inayofuata.
- source_word: ὄντως
  choice: kweli
  rationale: Kielezi hiki huonyesha kwamba tofauti inayowekwa ni halisi, si msisitizo wa kimtindo tu.
theological_decisions:
- issue: Upeo wa maana ya τιμάω katika muktadha
  choice: Maandishi makuu yanatumia “Waheshimu,” yakihifadhi maana pana ya heshima huku yakiruhusu muktadha kujumuisha utunzaji wa mahitaji.
  alternative: Watunze wajane ambao kweli ni wajane.
  rationale: Muktadha wa 1 Timotheo 5 unazungumzia mahitaji ya wajane na wajibu wa kuwasaidia. Hata hivyo, kitenzi cha Kigiriki ni kipana kuliko msaada wa mali pekee, kwa hiyo tafsiri finyu imewekwa katika tanbihi badala ya maandishi makuu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi fupi inadumisha urudiaji wa neno “wajane” uliopo katika Kigiriki bila kutumia msemo mzito au wa kizamani.
