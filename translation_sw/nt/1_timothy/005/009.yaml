  yaml_path: translation/nt/1_timothy/005/009.yaml
  text: Let a widow be enrolled only if she is not less than sixty years old[a], having been the wife of one husband,
translation:
  language: sw
  text: Mjane aandikwe katika orodha ikiwa tu ana umri usiopungua miaka sitini, ambaye amekuwa mke wa mume mmoja.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno kwa neno, “mwanamke wa mwanamume mmoja.” Kauli hii huenda ikarejelea uaminifu au sifa yake katika ndoa; wengine huielewa kuwa aliolewa mara moja tu.
    reason: alternative_reading
lexical_decisions:
- source_word: Χήρα
  choice: Mjane
  rationale: Neno la kawaida la Kiswahili kwa mwanamke ambaye mume wake amekufa; muktadha unahusu wajane wanaostahili kuandikishwa rasmi.
- source_word: καταλεγέσθω
  choice: aandikwe katika orodha
  rationale: Kitenzi hiki hapa kina maana ya kuingizwa katika orodha rasmi. Kauli hii ni ya kawaida na inaonyesha wazi tendo la kiutawala.
- source_word: μὴ ἔλαττον ἐτῶν ἑξήκοντα
  choice: ikiwa tu ana umri usiopungua miaka sitini
  rationale: Kauli hii inaweka umri wa chini unaotakiwa; “ikiwa tu” huhifadhi nguvu ya sharti, na “usiopungua miaka sitini” ni Kiswahili cha kawaida na sahihi.
- source_word: γεγονυῖα
  choice: ana umri
  rationale: Kirai hiki cha hali timilifu kinatumika pamoja na umri kuonyesha kwamba mtu amefikia umri huo; Kiswahili cha kawaida hutumia “ana umri” badala ya tafsiri ya neno kwa neno.
- source_word: ἑνὸς ἀνδρὸς γυνή
  choice: amekuwa mke wa mume mmoja
  rationale: 'Kauli hii huhifadhi kwa kadiri inayowezekana nahau ya Kigiriki na utata wake: inaweza kueleweka kuhusu uaminifu katika ndoa au historia ya kuwa na mume mmoja, bila kulazimisha mojawapo ya maana hizo katika matini kuu.'
theological_decisions:
- issue: Maana ya ἑνὸς ἀνδρὸς γυνή
  choice: Kuhifadhi kauli “amekuwa mke wa mume mmoja” katika matini kuu.
  alternative: “alikuwa mwaminifu kwa mume wake” au “aliolewa mara moja tu”
  rationale: Kigiriki hakiamui wazi ikiwa sharti linahusu hasa sifa ya uaminifu katika ndoa au kuolewa mara moja tu. Tafsiri kuu kwa hiyo haifungi maana kwenye msimamo mmoja, huku tanbihi ikionyesha uwezekano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Aandikwe katika orodha” ni wazi kwa wasomaji wa kawaida, na muundo wa sentensi unabaki karibu na mantiki ya Kigiriki bila kuwa mgumu.
