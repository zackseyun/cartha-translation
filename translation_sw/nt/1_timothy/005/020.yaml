base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/020.yaml
  text: Rebuke those who are sinning before everyone[b][a], so that the rest also may have fear.
translation:
  language: sw
  text: Wale wanaotenda dhambi[a], wakemee mbele ya wote[b], ili wengine pia wawe na hofu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wale wanaoendelea kutenda dhambi”; hali ya kitenzi inaweza kudokeza mwenendo wa dhambi unaoendelea.
    reason: lexical_alternative
  - marker: b
    text: Muktadha wa karibu unaweza kuonyesha kwamba hasa wanaokusudiwa ni wazee wanaotenda dhambi, ingawa mstari wenyewe unasema tu “wale wanaotenda dhambi.”
    reason: cross_reference
lexical_decisions:
- source_word: τοὺς ἁμαρτάνοντας
  choice: wale wanaotenda dhambi
  rationale: Kirai hiki ni kishiriki cha wakati wa sasa kilichotumiwa kama nomino. Tafsiri hii ni ya kawaida katika Kiswahili na haiongezi wazi wazo la kuendelea, ingawa hali ya tendo inaweza kudokeza mwenendo unaoendelea; hilo limewekwa katika tanbihi.
- source_word: ἐνώπιον πάντων
  choice: mbele ya wote
  rationale: Hii inahifadhi muundo na maana ya hadharani ya kirai cha Kigiriki kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: ἔλεγχε
  choice: wakemee
  rationale: Katika muktadha wa nidhamu, kitenzi hiki kinamaanisha kufichua kosa na kulikemea. “Wakemee” kinaeleza tendo la kusahihisha kwa ukali bila kulifanya liwe tu kufichua siri.
- source_word: οἱ λοιποὶ
  choice: wengine
  rationale: Neno hili linawarejelea watu wengine zaidi ya wakosaji. “Wengine” ni la asili zaidi katika Kiswahili hapa kuliko tafsiri halisi “waliosalia.”
- source_word: φόβον ἔχωσιν
  choice: wawe na hofu
  rationale: Hii inahifadhi nahau ya Kigiriki, “kuwa na hofu,” bila kuamua kama ni woga wa adhabu, tahadhari nzito, au hofu yenye staha.
theological_decisions:
- issue: Wale wanaotenda dhambi ni akina nani katika muktadha?
  choice: Andiko kuu linasema kwa ujumla “wale wanaotenda dhambi” bila kuongeza “wazee.”
  alternative: Kwa sababu mstari uliotangulia unazungumzia mashtaka dhidi ya mzee wa kanisa, huenda hapa hasa wanakusudiwa wazee wanaotenda dhambi.
  rationale: Mstari wenyewe hautaji wazi wazee, ingawa muktadha wa karibu unaweza kuwaelekeza wasomaji kwao. Tafsiri haiongezi neno lisilokuwamo, na tanbihi inadumisha uwezekano wa kimuktadha.
- issue: Maana ya hofu
  choice: “Wawe na hofu” imehifadhiwa bila kufafanua aina ya hofu.
  alternative: Inaweza kueleweka kuwa waogope kutenda dhambi au wawe na tahadhari na staha mbele za Mungu.
  rationale: Kirai cha Kigiriki hakiamui kwa uwazi kati ya vivuli hivyo vya maana; tafsiri haipaswi kuondoa mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi na chenye hadhi. Mpangilio wa alama [b][a] umehifadhiwa kama katika matini ya ushauri ya POB ya Kiingereza, na kila alama ina tanbihi inayolingana.
