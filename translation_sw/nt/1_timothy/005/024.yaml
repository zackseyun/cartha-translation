  text: Τινῶν ἀνθρώπων αἱ ἁμαρτίαι πρόδηλοί εἰσιν, προάγουσαι εἰς κρίσιν, τισὶν δὲ καὶ ἐπακολουθοῦσιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/024.yaml
  text: The sins of some people are obvious[a], going before them to judgment[b], but for others they follow after.
translation:
  language: sw
  text: Dhambi za watu fulani ziko wazi[a], nazo zinawatangulia kwenda hukumuni[b], lakini za wengine hufuata baadaye.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Dhambi za watu fulani ni dhahiri.”
    reason: lexical_alternative
  - marker: b
    text: “Hukumu” hapa inaweza kumaanisha tathmini inayofanywa sasa kulingana na muktadha, ingawa maneno haya yanaweza pia kuwa na maana pana ya hukumu ya Mungu.
    reason: alternative_reading
lexical_decisions:
- source_word: Τινῶν ἀνθρώπων αἱ ἁμαρτίαι
  choice: Dhambi za watu fulani
  rationale: Muundo huu unaonyesha wazi kuwa dhambi ni za watu fulani, huku ἀνθρώπων ikitafsiriwa kwa maana yake ya jumla ya wanadamu bila kuingiza jinsia isiyodaiwa na neno lenyewe.
- source_word: πρόδηλοί εἰσιν
  choice: ziko wazi
  rationale: Kauli hii ni Kiswahili cha kawaida na chenye hadhi kinachoeleza kuwa dhambi hizo zinaonekana au zinajulikana wazi.
- source_word: προάγουσαι
  choice: nazo zinawatangulia kwenda
  rationale: Inadumisha taswira ya dhambi zinazotangulia mbele ya watu wanaohusika. Kiwakilishi cha yambwa katika “zinawatangulia” kinaeleweka kutokana na muktadha, kama ilivyo katika Kigiriki.
- source_word: εἰς κρίσιν
  choice: hukumuni
  rationale: Huhifadhi maana ya kuelekea kwenye hukumu bila kuamua ikiwa ni uchunguzi wa sasa wa jumuiya au hukumu pana zaidi ya Mungu.
- source_word: τισὶν δὲ καὶ ἐπακολουθοῦσιν
  choice: lakini za wengine hufuata baadaye
  rationale: “Za wengine” hurejesha kwa kawaida ‘dhambi’ kama kiima, na “hufuata baadaye” huhifadhi tofauti kati ya dhambi zinazoonekana mapema na zile zinazodhihirika baadaye.
theological_decisions:
- issue: Upeo wa κρίσις (hukumu)
  choice: hukumuni
  alternative: katika uchunguzi; kwenye hukumu ya Mungu
  rationale: Muktadha wa karibu unaweza kumaanisha tathmini ya watu katika jumuiya, lakini neno la Kigiriki linaweza pia kuwa na maana pana ya hukumu ya Mungu. Tafsiri haifungi uwezekano wowote.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, ya heshima na inayoeleweka kwa msomaji wa kawaida. Taswira ya dhambi kutangulia au kufuata watu imehifadhiwa kwa namna ya asili katika Kiswahili.
