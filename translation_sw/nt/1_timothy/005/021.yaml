reference: 1 Timothy 5:21
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: διαμαρτύρομαι ἐνώπιον τοῦ θεοῦ καὶ ⸂Χριστοῦ Ἰησοῦ⸃ καὶ τῶν ἐκλεκτῶν ἀγγέλων, ἵνα ταῦτα φυλάξῃς χωρὶς προκρίματος, μηδὲν ποιῶν κατὰ πρόσκλισιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/021.yaml
  text: I solemnly charge you in the presence of God and Messiah Jesus and the chosen angels[a], that you keep these things without prejudice[c][b], doing nothing according to partiality.
translation:
  language: sw
  text: 'Ninakuagiza kwa uzito mbele za Mungu na Masihi Yesu na malaika waliochaguliwa[a]: uyazingatie mambo haya bila kuhukumu mapema[b], wala usifanye chochote kwa upendeleo[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “malaika wateule.”
    reason: lexical_alternative
  - marker: b
    text: Au, “bila hukumu ya awali.”
    reason: lexical_alternative
  - marker: c
    text: Au, “kwa kuegemea upande mmoja.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διαμαρτύρομαι
  choice: Ninakuagiza kwa uzito
  rationale: Kitenzi hiki katika himizo la kiapostoli kinatoa agizo zito na la kiapo, si ushuhuda wa kawaida. Usemi huu unadumisha uzito huo kwa Kiswahili cha sasa.
- source_word: ἐνώπιον
  choice: mbele za
  rationale: Hueleza kuwa agizo linatolewa katika uwepo wa mashahidi wa mbinguni; “mbele za” ni usemi wa kawaida na wenye hadhi katika Kiswahili.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Masihi Yesu
  rationale: Χριστός hapa inadumisha maana yake ya cheo, yaani Masihi, katika mwito huu mzito.
- source_word: ἐκλεκτῶν ἀγγέλων
  choice: malaika waliochaguliwa
  rationale: Inawasilisha moja kwa moja maana ya ἐκλεκτός kwa lugha inayoeleweka kwa urahisi, bila kueleza zaidi namna au kusudi la kuchaguliwa kwao.
- source_word: ταῦτα
  choice: mambo haya
  rationale: Kiwakilishi hiki kinarejelea yale yaliyotangulia bila kuyafafanua zaidi ya maandishi ya Kigiriki.
- source_word: φυλάξῃς
  choice: uyashike
  rationale: Hapa φυλάσσω ina maana ya kuyatunza na kuyatekeleza kwa uaminifu; “uyashike” ni fupi na hudumisha upana huo wa maana.
- source_word: χωρὶς προκρίματος
  choice: bila kuhukumu mapema
  rationale: πρόκριμα ni hukumu inayofanywa kabla ya suala kuchunguzwa kikamilifu. Tafsiri hii inaitofautisha na upendeleo unaotajwa katika kishazi kinachofuata.
- source_word: μηδὲν ποιῶν
  choice: wala usifanye chochote
  rationale: Muundo huu unaunganisha katazo na agizo kuu kwa Kiswahili cha kawaida huku ukidumisha maana ya kutofanya jambo lolote.
- source_word: κατὰ πρόσκλισιν
  choice: kwa upendeleo
  rationale: πρόσκλισις ni kuegemea upande fulani au kumpendelea mtu. “Kwa upendeleo” ni ya asili na wazi katika muktadha wa kushughulikia watu.
theological_decisions:
- issue: Tafsiri ya Χριστός
  choice: Masihi Yesu
  alternative: Kristo Yesu
  rationale: Katika mwito huu Χριστός inaweza kusikika kama cheo chenye maana ya Mtiwa-Mafuta; “Masihi” hudumisha maana hiyo badala ya kutegemea umbo lililotoholewa pekee.
- issue: Maana ya ἐκλεκτῶν ἀγγέλων
  choice: malaika waliochaguliwa
  alternative: malaika wateule
  rationale: Maandishi yanawaita malaika hawa “waliochaguliwa” bila kubainisha msingi, wakati, au kusudi la uchaguzi huo; tafsiri haiongezi ufafanuzi wa kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Ninakuagiza kwa uzito” hudumisha uzito wa agizo; “mbele za” ni rasmi bila kuwa ngumu; na tofauti kati ya kuhukumu mapema na kutenda kwa upendeleo imehifadhiwa.
