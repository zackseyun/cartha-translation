  text: χεῖρας ταχέως μηδενὶ ἐπιτίθει, μηδὲ κοινώνει ἁμαρτίαις ἀλλοτρίαις· σεαυτὸν ἁγνὸν τήρει.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/022.yaml
  text: Do not lay hands on anyone hastily[a], nor share in the sins of others; keep yourself pure.
translation:
  language: sw
  text: Usimwekee mtu yeyote mikono kwa haraka[a], wala usishiriki katika dhambi za wengine; jitunze katika usafi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa maana maalumu zaidi katika muktadha huu, “Usimteue mtu yeyote kwa haraka” au “Usimweke mtu yeyote wakfu mapema mno.” Kigiriki husema kihalisi, “usiweke mikono,” nahau ambayo mara nyingi huhusishwa na kumteua au kumtambua mtu rasmi kwa ajili ya huduma.
    reason: lexical_alternative
lexical_decisions:
- source_word: χεῖρας ... ἐπιτίθει
  choice: mweke ... mikono
  rationale: Huhifadhi nahau ya Kigiriki ya ‘kuweka mikono’ bila kuifupisha kuwa uteuzi au kuwekwa wakfu, ingawa muktadha unaweza kuelekea huko.
- source_word: ταχέως
  choice: kwa haraka
  rationale: Katika onyo hili inaonyesha kutenda mapema au bila uchunguzi wa kutosha, si kasi ya kimwili tu.
- source_word: μηδενὶ
  choice: mtu yeyote
  rationale: Pamoja na ukanushi ‘usi-’, huu ni usemi wa kawaida wa Kiswahili unaohifadhi maana inayomhusu kila mtu.
- source_word: μηδὲ κοινώνει
  choice: wala usishiriki katika
  rationale: Huwasilisha kushiriki au kuhusika katika jambo bila kutumia lugha ya kitaalamu kupita kiasi.
- source_word: ἁμαρτίαις ἀλλοτρίαις
  choice: dhambi za wengine
  rationale: Ni tafsiri wazi na ya kawaida ya dhambi zinazowahusu watu wengine.
- source_word: σεαυτὸν
  choice: ji-
  rationale: Kiambishi rejeshi katika ‘jilinde’ humrejelea mhusika mwenyewe kwa Kiswahili cha kawaida.
- source_word: ἁγνὸν
  choice: safi
  rationale: Hueleza usafi wa kimaadili kwa upana; ‘mwenye kujisitiri’ au usemi unaolenga usafi wa kingono pekee ungefinya maana.
- source_word: τήρει
  choice: jilinde ukiwa
  rationale: Kitenzi hiki kinaonyesha kuendelea kujitunza au kujihifadhi katika hali ya usafi; muundo huu ni wa asili katika Kiswahili.
theological_decisions:
- issue: Maana ya ‘kuweka mikono’ katika muktadha
  choice: Nahau ‘kuweka mikono’ imehifadhiwa bila kutaja moja kwa moja uteuzi au kuwekwa wakfu.
  alternative: Usimteue mtu yeyote kwa haraka; usimweke mtu yeyote wakfu mapema mno.
  rationale: Muktadha wa viongozi wa kanisa unaunga mkono uwezekano wa uteuzi au kutambuliwa kwa huduma, lakini Kigiriki chenyewe kinatumia nahau pana. Tafsiri haipaswi kulazimisha utaratibu maalumu wa kidhehebu.
- issue: Uhusiano kati ya makatazo mawili
  choice: Katazo la pili limeachwa kuwa onyo pana dhidi ya kuhusika katika dhambi za wengine.
  alternative: Kulieleza wazi kuwa mtu anakuwa na hatia kwa kumteua kiongozi haraka.
  rationale: Ukaribu wa vifungu unaweza kudokeza kwamba kumwekea mtu mikono kwa haraka kunamfanya mhusika ashiriki dhambi zake, lakini maandishi hayasemi uhusiano huo moja kwa moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Nahau ya kibiblia ‘kuweka mikono’ imehifadhiwa, huku tanbihi ikifafanua maana yake inayowezekana katika muktadha. Alama [a] imewekwa katika matini kuu.
