  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἅμα δὲ καὶ ἀργαὶ μανθάνουσιν, περιερχόμεναι τὰς οἰκίας, οὐ μόνον δὲ ἀργαὶ ἀλλὰ καὶ φλύαροι καὶ περίεργοι, λαλοῦσαι τὰ μὴ δέοντα.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/013.yaml
  text: At the same time[a], they also learn to be idle, going around from house to house; and not only idle, but also gossips and busybodies[b], saying what they ought not to say.
translation:
  language: sw
  text: Wakati huohuo, wanajifunza pia kuwa wavivu, wakizunguka nyumba kwa nyumba. Si wavivu tu, bali pia ni wapiga porojo[a] na watu wanaojiingiza katika mambo yasiyowahusu[b], wakisema mambo yasiyofaa kusemwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wenye maneno mengi”; neno la Kigiriki linaweza kumaanisha kwa upana zaidi mazungumzo ya kipumbavu au yasiyo na maana, ingawa hapa huenda linajumuisha kusengenya.
    reason: lexical_alternative
  - marker: b
    text: Au, “waingiliaji wa mambo yasiyowahusu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅμα δὲ καὶ
  choice: Wakati huohuo ... pia
  rationale: Huonyesha jambo linalotokea wakati mmoja na pia kuongeza hoja nyingine; mpangilio huu ni wa kawaida katika Kiswahili.
- source_word: ἀργαὶ
  choice: wavivu
  rationale: Hapa neno linamaanisha watu wasiokuwa na shughuli au kazi; limerudiwa katika tafsiri kama lilivyorudiwa katika Kigiriki.
- source_word: μανθάνουσιν
  choice: wanajifunza ... kuwa
  rationale: Katika muktadha huu kitenzi kinaonyesha kujenga mazoea, si kupata mafundisho rasmi.
- source_word: περιερχόμεναι τὰς οἰκίας
  choice: wakizunguka nyumba kwa nyumba
  rationale: Huwasilisha mwendo wa kutoka nyumba moja hadi nyingine kwa Kiswahili cha kawaida.
- source_word: φλύαροι
  choice: wapiga porojo
  rationale: Hujumuisha mazungumzo ya kipumbavu, yasiyo na maana au yasiyo na kiasi; katika muktadha huu yanaweza kujumuisha kusengenya.
- source_word: περίεργοι
  choice: watu wanaojiingiza katika mambo ya wengine
  rationale: Hueleza wazi tabia ya kuingilia isivyofaa mambo yasiyomhusu mtu.
- source_word: λαλοῦσαι
  choice: wakisema
  rationale: Ni tafsiri rahisi na ya moja kwa moja ya kitenzi cha kusema, inayoungana kiasili na kishazi kinachofuata.
- source_word: τὰ μὴ δέοντα
  choice: mambo yasiyowapasa
  rationale: Huhifadhi maana ya mambo yasiyofaa au yasiyopasa kusemwa bila kubana zaidi maana ya asili.
theological_decisions:
- issue: Rejeo la jinsia katika vivumishi na vihusishi vya wingi wa kike
  choice: wanajifunza ... wakizunguka
  alternative: wanawake hao wanajifunza ... wakizunguka
  rationale: Maumbo ya Kigiriki yanawarejelea wajane vijana katika muktadha. Kiswahili hakitofautishi jinsia katika viwakilishi hivi, hivyo rejeo linaachwa litokane na muktadha bila kulibadili kuwa la watu wote kwa ujumla.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imegawanywa mara mbili ili isomeke kwa urahisi, huku urudiaji wa “wavivu” na mfuatano wa hoja za Kigiriki ukihifadhiwa.
