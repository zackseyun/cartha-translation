  text: μηκέτι ὑδροπότει, ἀλλὰ οἴνῳ ὀλίγῳ χρῶ διὰ τὸν ⸀στόμαχον καὶ τὰς πυκνάς σου ἀσθενείας.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/023.yaml
  text: No longer drink only water[a], but use a little wine because of your stomach and your frequent illnesses.
translation:
  language: sw
  text: Usiendelee kunywa maji tu[a], bali tumia divai kidogo kwa sababu ya tumbo lako na magonjwa yako ya mara kwa mara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa karibu zaidi na maneno ya asili, “Usiendelee kuwa mnywaji wa maji.” Maana ni kwamba Timotheo asiendelee kunywa maji pekee.
    reason: lexical_alternative
lexical_decisions:
- source_word: μηκέτι
  choice: Usiendelee
  rationale: Inaonyesha kuacha desturi iliyokuwa ikiendelea; pamoja na kitenzi kinachofuata, muundo huu ni wa kawaida na wazi katika Kiswahili.
- source_word: ὑδροπότει
  choice: kunywa maji tu
  rationale: Kitenzi chenyewe kinamaanisha kunywa maji, lakini utofautishaji na agizo la kutumia divai unaonyesha kwamba maana hapa ni kutokunywa maji pekee. Neno 'tu' linaweka wazi maana hiyo bila kudai kwamba aache maji kabisa.
- source_word: ἀλλὰ
  choice: bali
  rationale: Kiunganishi cha upinzani kinachoanzisha agizo linalotofautiana na desturi iliyotangulia.
- source_word: οἴνῳ ὀλίγῳ
  choice: divai kidogo
  rationale: Huhifadhi nomino halisi 'divai' na kiasi kidogo kinachoelezwa na ὀλίγῳ.
- source_word: χρῶ
  choice: tumia
  rationale: χράομαι humaanisha kutumia kitu; hapa inahusu kutumia au kunywa divai kwa kusudi lililotajwa, bila kuongeza maelezo yasiyomo katika maandishi.
- source_word: διὰ
  choice: kwa ajili ya
  rationale: Ikiwa na hali ya accusative, διά inaonyesha sababu au msingi wa agizo; 'kwa ajili ya' ni usemi wa asili unaofaa hapa.
- source_word: στόμαχον
  choice: tumbo
  rationale: Ni neno la kawaida, wazi na la moja kwa moja kwa kiungo kinachotajwa.
- source_word: πυκνάς
  choice: ya mara kwa mara
  rationale: Huwasilisha kurudiwa mara nyingi kwa hali zinazotajwa.
- source_word: ἀσθενείας
  choice: magonjwa
  rationale: Ingawa neno linaweza pia kumaanisha udhaifu, muktadha wa tumbo na matumizi ya divai unaelekeza kwenye maradhi au matatizo ya kimwili.
theological_decisions:
- issue: Iwapo desturi ya Timotheo ya kunywa maji pekee iwekwe wazi
  choice: Usiendelee kunywa maji tu
  alternative: Usiendelee kunywa maji
  rationale: Upinzani unaofuata, 'bali tumia divai kidogo,' unaonyesha kwamba agizo halikatazi maji kabisa, bali linamwambia asiendelee kunywa maji pekee. 'Tu' huzuia tafsiri potovu bila kuficha muundo halisi wa Kigiriki.
- issue: Iwapo οἶνος itafsiriwe moja kwa moja au ielezwe kwa maneno ya kimatibabu
  choice: divai
  alternative: kinywaji cha dawa
  rationale: Maandishi ya Kigiriki yanataja divai waziwazi. Kutumia neno hilo huhifadhi maana ya chanzo bila kuipunguza au kuipanua kwa sababu za kimadhehebu au kitamaduni; 'kidogo' huhifadhi kiasi kilichowekwa na aya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi na chenye heshima. Muundo wa sentensi unalenga usomaji wa kawaida huku ukihifadhi upinzani, kiasi cha divai, na sababu mbili zilizotajwa katika Kigiriki.
