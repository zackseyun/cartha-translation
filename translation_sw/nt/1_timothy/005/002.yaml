  yaml_path: translation/nt/1_timothy/005/002.yaml
  text: older women as mothers[a], younger women as sisters, in all purity.
translation:
  language: sw
  text: wanawake wenye umri mkubwa kama mama, na wanawake vijana kama dada, katika usafi wote.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa usafi kamili.” Katika muktadha huu, “usafi” unaweza kuwa na maana pana ya usafi wa kimaadili, ukiwa pia na mkazo wa mwenendo safi katika masuala ya kingono.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρεσβυτέρας
  choice: wanawake wenye umri mkubwa
  rationale: Ni kivumishi cha kike kilichotumiwa kama nomino na hapa kinatofautishwa na νεωτέρας; kwa hiyo kinahusu umri, si cheo cha mzee wa kanisa.
- source_word: ὡς
  choice: kama
  rationale: Neno hili linaanzisha ulinganisho na huhifadhi muundo sambamba wa ‘kama mama ... kama dada.’
- source_word: μητέρας
  choice: mama
  rationale: Huhifadhi taswira ya kifamilia bila kuongeza kimilikishi kisichotajwa wazi katika Kigiriki.
- source_word: νεωτέρας
  choice: wanawake vijana
  rationale: Ni kivumishi cha kike kilichotumiwa kama nomino na kinaonyesha wanawake walio na umri mdogo kwa kulinganishwa na kundi la kwanza.
- source_word: ἀδελφὰς
  choice: dada
  rationale: Huhifadhi uhusiano wa kifamilia unaokusudiwa na ni Kiswahili cha kawaida na chenye heshima.
- source_word: ἐν πάσῃ ἁγνείᾳ
  choice: kwa usafi wote
  rationale: ‘Kwa’ huonyesha namna ya kuwatendea, ‘wote’ huakisi πάσῃ, na ‘usafi’ huhifadhi upana wa ἁγνεία bila kuufanya kuwa usafi wa kingono peke yake.
theological_decisions:
- issue: Upeo wa ἁγνεία katika agizo kuhusu wanawake vijana
  choice: kwa usafi wote
  alternative: kwa usafi kamili; kwa kujisitiri kabisa
  rationale: Neno linaweza kumaanisha usafi wa kimaadili kwa upana, huku muktadha ukihusisha kwa nguvu pia kujisitiri na mwenendo unaofaa katika masuala ya kingono. Tafsiri kuu haifungi maana katika upande mmoja tu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na rahisi kueleweka. ‘Wanawake wenye umri mkubwa’ imechaguliwa badala ya ‘wanawake wazee’ ili kueleza tofauti ya umri kwa njia ya kawaida bila kudokeza cheo cha kanisa.
