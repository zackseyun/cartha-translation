revisions:
- from: Ikiwa mwanamke yeyote anayeamini ana wajane[a], na awasaidie mahitaji yao, wala kanisa lisilemeweshwe, ili liweze kuwasaidia wajane walio wajane kweli.
  to: Ikiwa mwanamke yeyote anayeamini ana wajane[a], na awatunze; wala kanisa lisilemeweshwe, ili liweze kuwatunza wajane walio wajane kweli.
  rationale: ‘Awatunze’ replaces the unidiomatic ‘awasaidie mahitaji yao’ and is repeated as ‘kuwatunza’ for lexical and semantic consistency across both occurrences of ἐπαρκέω. It expresses sufficient practical support without over-specifying its form. All other wording, including the feminine subject and the textual-variant footnote, is retained.
  reviewer_model: gpt-5.6-terra
