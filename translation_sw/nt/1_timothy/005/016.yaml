id: 1TI.5.16
reference: 1 Timothy 5:16
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἴ ⸀τις πιστὴ ἔχει χήρας, ⸀ἐπαρκείτω αὐταῖς, καὶ μὴ βαρείσθω ἡ ἐκκλησία, ἵνα ταῖς ὄντως χήραις ἐπαρκέσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/016.yaml
  text: If any believing woman has widows[a], let her provide for them, and let the church not be burdened, so that it may provide for those who are truly widows.
translation:
  language: sw
  text: Ikiwa mwanamke yeyote anayeamini ana wajane[a], na awatunze; wala kanisa lisilemeweshwe, ili liweze kuwatunza wajane walio wajane kweli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati zina maneno “ikiwa mwanamume au mwanamke yeyote anayeamini ana wajane,” au “ikiwa mwamini yeyote ana wajane,” hivyo zikilifanya agizo hili lisimhusu mwanamke pekee.
    reason: textual_variant
lexical_decisions:
- source_word: τις πιστὴ
  choice: mwanamke yeyote anayeamini
  rationale: πιστή ni kivumishi cha kike, umoja, katika matini hii; kwa hiyo mhusika ametajwa wazi kuwa mwanamke. “Anayeamini” hapa inaeleza utambulisho wake kama mwamini.
- source_word: χήρας
  choice: wajane
  rationale: Ni wingi wa χήρα, na muktadha unahusu wajane wanaohitaji msaada wa kimwili.
- source_word: ἐπαρκείτω / ἐπαρκέσῃ
  choice: awasaidie mahitaji yao / liweze kuwasaidia
  rationale: ἐπαρκέω ina maana ya kutoa msaada wa kutosha. Katika sehemu ya kwanza, “awasaidie mahitaji yao” inaweka wazi wajibu wa kimatendo; katika sehemu ya pili, “liweze kuwasaidia” ni ya kawaida na inaendeleza maana ileile bila uzito usio wa lazima.
- source_word: βαρείσθω
  choice: lisilemeweshwe
  rationale: Kitenzi cha hali ya kutendwa kinaonyesha kubebeshwa wajibu mzito, hasa wa kuwahudumia kwa mahitaji.
- source_word: ἡ ἐκκλησία
  choice: kanisa
  rationale: Katika Nyaraka za Kichungaji, ἐκκλησία ni jumuiya ya waamini; “kanisa” ndilo neno la kawaida na linaloeleweka zaidi kwa Kiswahili.
- source_word: ταῖς ὄντως χήραις
  choice: wajane walio wajane kweli
  rationale: Tafsiri hii inadumisha msisitizo na mvutano wa usemi wa Kigiriki, unaowatofautisha wajane walio katika hali halisi ya kuhitaji msaada wa kanisa kulingana na muktadha.
theological_decisions:
- issue: Jinsia ya mhusika katika kifungu cha kwanza
  choice: 'mhusika maalumu wa kike: “mwanamke yeyote anayeamini”'
  alternative: “mwamini yeyote” au “mwanamume au mwanamke yeyote anayeamini” kwa kufuata mapokeo mengine ya matini
  rationale: Matini iliyotolewa ya SBLGNT ina τις πιστή, ambayo kisarufi ni ya kike, umoja. Kwa hiyo jinsia haijaondolewa katika matini kuu; tofauti zinazopanua agizo zimehifadhiwa katika tanbihi.
- issue: Maana ya “wajane kweli”
  choice: kuhifadhi usemi “wajane walio wajane kweli”
  alternative: “wajane wenye uhitaji halisi”
  rationale: Usemi wa moja kwa moja huhifadhi msisitizo wa ὄντως na uhusiano wake na matumizi yale yale katika sura hii, bila kuingiza katika mstari huu masharti yote yanayoelezwa na muktadha mpana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umewekwa wazi kwa msomaji wa kawaida huku ukihifadhi jinsia ya mhusika, urudiaji wa wazo la ἐπαρκέω, na msisitizo wa “wajane kweli.”
