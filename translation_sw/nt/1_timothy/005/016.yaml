    text: Baadhi ya hati zina maneno “ikiwa mwanamume au mwanamke yeyote anayeamini ana wajane,” au “ikiwa mwamini yeyote ana wajane,” hivyo zikilifanya agizo hili lisimhusu mwanamke pekee.
    reason: textual_variant
  revision_rationale: ‘Awatunze’ replaces the unidiomatic ‘awasaidie mahitaji yao’ and is repeated as ‘kuwatunza’ for lexical and semantic consistency across both occurrences of ἐπαρκέω. It expresses sufficient practical support without over-specifying its form. All other wording, including the feminine subject and the textual-variant footnote, is retained.
