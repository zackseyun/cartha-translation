review_pass:
  verdict: revise
  source_fidelity: The draft accurately reflects the SBLGNT reading τις πιστή as a specifically female singular subject, retains χήρας as ‘wajane,’ preserves the purpose clause, and appropriately renders the church as the party not to be burdened. The textual-variant footnote correctly reports broader manuscript readings without importing them into the main text.
  naturalness: '‘Awasaidie mahitaji yao’ is not idiomatic Standard East African Swahili: people are helped or supported, rather than their needs being helped. ‘Awatunze’ naturally conveys the practical, ongoing material support intended by ἐπαρκέω and can be repeated for the church in the purpose clause.'
  terminology: ‘Mwanamke yeyote anayeamini,’ ‘kanisa,’ and ‘wajane walio wajane kweli’ are suitable. The final expression is deliberately repetitive, but it effectively retains the emphatic and contextually defined Greek category without adding interpretive eligibility criteria.
  issues:
  - severity: medium
    issue: Awkward object construction in ‘na awasaidie mahitaji yao’
    rationale: This phrase literally makes ‘their needs’ the object of assistance and is unnatural in Swahili. It weakens the direct sense that the woman herself is to supply support to the widows.
  revised_text: Ikiwa mwanamke yeyote anayeamini ana wajane[a], na awatunze; wala kanisa lisilemeweshwe, ili liweze kuwatunza wajane walio wajane kweli.
  revised_footnotes:
