id: 1TI.5.10
reference: 1 Timothy 5:10
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐν ἔργοις καλοῖς μαρτυρουμένη, εἰ ἐτεκνοτρόφησεν, εἰ ἐξενοδόχησεν, εἰ ἁγίων πόδας ἔνιψεν, εἰ θλιβομένοις ἐπήρκεσεν, εἰ παντὶ ἔργῳ ἀγαθῷ ἐπηκολούθησεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/010.yaml
  text: 'well attested for good works: if she has raised children[a], if she has shown hospitality, if she has washed the feet of the saints, if she has helped those under affliction[c][b], if she has followed every good work.'
translation:
  language: sw
  text: 'anayeshuhudiwa kwa matendo mema: ikiwa amelea watoto, ikiwa amewakaribisha wageni, ikiwa amewaosha watakatifu miguu, ikiwa amewasaidia wenye dhiki, na ikiwa amefuatilia kila tendo jema.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “amejitahidi kufanya kila tendo jema.” Usemi wa Kigiriki unaonyesha kufuatilia mema kwa bidii na kujitoa kuyafanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἔργοις καλοῖς μαρτυρουμένη
  choice: anayeshuhudiwa kwa matendo mema
  rationale: Huhifadhi hali ya kutendewa ya participio μαρτυρουμένη na kuonyesha kwamba sifa yake inathibitishwa na matendo mema yanayoonekana.
- source_word: εἰ
  choice: ikiwa
  rationale: Kurudia 'ikiwa' kunahifadhi muundo wa masharti au vigezo unaotumiwa katika orodha ya Kigiriki.
- source_word: ἐτεκνοτρόφησεν
  choice: amelea watoto
  rationale: Kitenzi kinamaanisha kutunza na kuwalea watoto hadi kukua, bila kusema lazima wawe watoto wake wa kuzaa.
- source_word: ἐξενοδόχησεν
  choice: amewakaribisha wageni
  rationale: Huwasilisha maana mahususi ya kuwapokea wageni au wasafiri nyumbani, huku ikiwa Kiswahili cha kawaida.
- source_word: ἁγίων πόδας ἔνιψεν
  choice: amewaosha watakatifu miguu
  rationale: Huhifadhi tendo halisi la huduma ya unyenyekevu na neno kuu la Paulo kwa watu waliowekwa wakfu kwa Mungu.
- source_word: θλιβομένοις ἐπήρκεσεν
  choice: amewasaidia wenye dhiki
  rationale: Hutoa kwa ufupi wazo la kutoa msaada kwa wanaopatwa na shida, taabu, au mateso bila kulibana kuwa mateso ya kidini pekee.
- source_word: παντὶ ἔργῳ ἀγαθῷ ἐπηκολούθησεν
  choice: amefuata kila tendo jema
  rationale: Huhifadhi kwa karibu sitiari ya 'kufuata' katika ἐπηκολούθησεν na upeo wa παντί, ingawa usemi huo pia una maana ya kujitahidi kwa bidii kufanya mema.
theological_decisions:
- issue: Maana ya ἁγίων
  choice: watakatifu
  alternative: waumini / watu watakatifu wa Mungu
  rationale: Katika matumizi ya Paulo, neno hili kwa kawaida linawarejelea waumini kama watu waliowekwa wakfu kwa Mungu; tafsiri ya moja kwa moja inalinda istilahi hiyo bila kuifanya iwe cheo cha kikundi maalumu.
- issue: Nguvu ya ἐπηκολούθησεν
  choice: amefuata kila tendo jema
  alternative: amejitahidi kufanya kila tendo jema / amejitoa kwa kila tendo jema
  rationale: Tafsiri kuu huhifadhi picha ya kufuata badala ya kuamua kimya kimya kati ya kufuatilia kwa bidii na kujitoa kwa kudumu; tanbihi inaeleza nguvu ya usemi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa orodha na kurudiwa kwa 'ikiwa' umehifadhiwa. Kiunganishi 'na' kabla ya kigezo cha mwisho hufanya orodha isomeke kwa kawaida bila kubadili maana.
