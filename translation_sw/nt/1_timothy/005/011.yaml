  text: νεωτέρας δὲ χήρας παραιτοῦ· ὅταν γὰρ καταστρηνιάσωσιν τοῦ Χριστοῦ, γαμεῖν θέλουσιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/011.yaml
  text: But refuse younger widows[a], for when they become sensual against the Messiah, they desire to marry[c][b],
translation:
  language: sw
  text: Lakini usiwaandikishe wajane vijana[a], kwa maana wanapovutwa na tamaa za kimwili kinyume na Masihi[b][c], hutaka kuolewa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, usiwakubali katika orodha ya wajane inayozungumziwa hapa.
    reason: contextual_clarification
  - marker: b
    text: Kigiriki, “kinyume na Masihi”; huenda maana yake ni kwamba tamaa zao zinapingana na kujitoa kwao au ahadi yao ya awali kwake.
    reason: alternative_reading
  - marker: c
    text: Au, “wanapokuwa wenye kufuata tamaa bila kumjali Masihi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: νεωτέρας χήρας
  choice: wajane walio vijana
  rationale: Inaonyesha tofauti na wajane wenye umri mkubwa wanaotajwa katika muktadha bila kuweka mpaka maalumu wa umri.
- source_word: δὲ
  choice: Lakini
  rationale: Inaonyesha tofauti ya kiasi na maagizo yaliyotangulia kuhusu wajane wanaoweza kuandikishwa.
- source_word: παραιτοῦ
  choice: usiwaandikishe
  rationale: Katika muktadha wa orodha ya wajane, kitenzi kinaelekeza Timotheo kutowakubali kwenye orodha hiyo; tafsiri hii huepuka maana pana ya kuwakataa kama watu.
- source_word: ὅταν γὰρ
  choice: kwa maana ... zinapowavuta
  rationale: Inahifadhi nguvu ya kutoa sababu pamoja na hali inayoweza kutokea kwa ujumla.
- source_word: καταστρηνιάσωσιν
  choice: tamaa zao zinapowavuta
  rationale: Kitenzi hiki adimu hudokeza msukumo wa tamaa au anasa unaomwelekeza mtu mbali na wajibu wa awali; Kiswahili hiki ni wazi na cha kawaida bila kudai kwamba kutaka kuolewa pekee ndilo kosa.
- source_word: τοῦ Χριστοῦ
  choice: kinyume na Masihi
  rationale: Χριστός ni cheo hapa. Uhusiano wa genitivi ni mgumu, hivyo 'kinyume na' huhifadhi mvutano uliopo katika Kigiriki bila kuufafanua kupita kiasi.
- source_word: γαμεῖν θέλουσιν
  choice: hutaka kuolewa
  rationale: Kwa kuwa wahusika ni wajane wanawake, 'kuolewa' ni Kiswahili cha asili kinachoeleza hamu au nia ya kuingia katika ndoa.
theological_decisions:
- issue: Tafsiri ya Χριστοῦ
  choice: Masihi
  alternative: Kristo
  rationale: Χριστός inatumika kama cheo; 'Masihi' huonyesha maana hiyo moja kwa moja, huku tafsiri ya jadi ikitajwa katika tanbihi.
- issue: Maana ya καταστρηνιάω τοῦ Χριστοῦ
  choice: tamaa zao zinawavuta kinyume na Masihi
  alternative: wanakuwa wenye kufuata tamaa bila kumjali Masihi
  rationale: Kauli kuu inahifadhi mvutano wa Kigiriki na haiwakilishi kuolewa tena kana kwamba ndilo kosa lenyewe; kinachosisitizwa ni mgongano wa tamaa na uaminifu au ahadi ya awali kwa Masihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Usiwaandikishe' huifanya miktadha ya orodha iwe wazi bila kudokeza kwamba wajane vijana watengwe na ushirika. Mpangilio wa alama [b][c] umewekwa mahali panapohusika moja kwa moja na kishazi kigumu.
