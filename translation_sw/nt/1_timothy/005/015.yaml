translation:
  language: sw
  text: Kwa maana baadhi yao tayari wamekengeuka na kumfuata Shetani.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa uhalisi zaidi, “wamekengeuka na kwenda nyuma ya Shetani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤδη
  choice: tayari
  rationale: 'Huhifadhi maana ya wakati: jambo hili lilikuwa limekwisha kutokea.'
- source_word: γάρ
  choice: Kwa maana
  rationale: Huonyesha kwamba kauli hii inatoa sababu au ufafanuzi wa agizo lililotangulia.
- source_word: τινες
  choice: baadhi yao
  rationale: Hurejelea idadi isiyotajwa ya watu katika kundi linalozungumziwa; kiwakilishi “yao” kinafanya marejeo hayo yawe ya kawaida katika Kiswahili bila kudai kwamba ni wote.
- source_word: ἐξετράπησαν
  choice: wamekengeuka
  rationale: Huhifadhi taswira ya kuiacha njia iliyofaa, bila kuingiza wazo la kwamba walipotoshwa na mtu mwingine.
- source_word: ὀπίσω
  choice: na kumfuata
  rationale: Katika muundo huu wenye mtu kama yambwa, neno hilo linaonyesha kwenda nyuma ya mtu kwa maana ya kumfuata. Tafsiri hii ni wazi na ya kawaida katika Kiswahili.
- source_word: Σατανᾶ
  choice: Shetani
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili cha Biblia na matumizi ya Kikristo ya Afrika Mashariki.
theological_decisions:
- issue: Iwapo ὀπίσω τοῦ Σατανᾶ itafsiriwe kwa uhalisi kuwa “nyuma ya Shetani” au kimaanisho kuwa “kumfuata Shetani.”
  choice: na kumfuata Shetani
  alternative: nyuma ya Shetani
  rationale: Kirai hicho kinaonyesha kufuata njia au uongozi wa Shetani. “Kumfuata” huwasilisha maana hiyo wazi bila kupunguza uzito wa kauli; tanbihi inahifadhi taswira halisi ya kuwa nyuma yake.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Wamekengeuka” ni neno linaloeleweka linalohifadhi sitiari ya kuiacha njia, huku “kumfuata” kikifafanua kwa kawaida nguvu ya ὀπίσω pamoja na mtu.
