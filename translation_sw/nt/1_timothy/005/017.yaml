  yaml_path: translation/nt/1_timothy/005/017.yaml
  text: Let the elders who lead well be considered worthy of double honor[c][b][a], especially those who labor in word and teaching.
translation:
  language: sw
  text: Wazee wanaoongoza vizuri wahesabiwe kuwa wanastahili heshima maradufu[a], hasa[c] wale wanaofanya kazi kwa bidii katika neno na mafundisho.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “heshima ya aina mbili.” Huenda usemi huu ukajumuisha kuthaminiwa na pia kusaidiwa kwa mahitaji ya kimwili, hasa kwa kuzingatia mstari unaofuata.
    reason: lexical_alternative
  - marker: b
    text: “Katika neno na mafundisho” huenda ikarejelea huduma ya kusema, kama vile kuhubiri au kutangaza ujumbe, pamoja na kufundisha.
    reason: cultural_note
  - marker: c
    text: Au, “yaani,” kwa kuelewa kwamba wazee wanaofanya kazi kwa bidii katika neno na mafundisho ndio wanaofafanuliwa hapa.
    reason: alternative_reading
lexical_decisions:
- source_word: πρεσβύτεροι
  choice: wazee
  rationale: Katika Nyaraka za Kichungaji neno hili linataja viongozi wanaotambuliwa katika kanisa, si wanaume wenye umri mkubwa tu. “Wazee” ni neno la kawaida la Kiswahili katika muktadha huu bila kuingiza muundo maalumu wa baadaye wa kanisa.
- source_word: καλῶς προεστῶτες
  choice: wanaoongoza vizuri
  rationale: Kitenzi προΐστημι hapa kinaonyesha uongozi na usimamizi. “Wanaoongoza vizuri” ni Kiswahili cha asili kinachohifadhi wazo la mamlaka bila ukali unaoweza kudokezwa na “wanaotawala.”
- source_word: διπλῆς τιμῆς
  choice: heshima maradufu
  rationale: Tafsiri hii iliyo karibu na muundo wa Kigiriki inahifadhi uwezekano wa maana ya kuthamini pamoja na msaada wa kimwili, hasa kwa kuzingatia mstari unaofuata.
- source_word: ἀξιούσθωσαν
  choice: na waonwe kuwa wanastahili
  rationale: Kauli ya kutendwa yenye nguvu ya amri inaitaka jumuiya itambue ustahili wao. Muundo huu ni wa kawaida na unaeleweka katika Kiswahili cha sasa.
- source_word: μάλιστα
  choice: hasa
  rationale: Neno hili kwa kawaida linatilia mkazo kundi fulani ndani ya kundi pana. “Hasa” huhifadhi maana hiyo bila kulazimisha tafsiri ya “yaani.”
- source_word: κοπιῶντες
  choice: wale wanaofanya kazi kwa bidii
  rationale: κοπιάω hudokeza juhudi nzito na yenye kuchosha. Usemi huu ni wa kawaida zaidi kwa wasomaji wa Kiswahili kuliko “wanaotaabika,” huku ukihifadhi wazo la kujituma sana.
- source_word: ἐν λόγῳ
  choice: katika kuhubiri
  rationale: Katika muktadha huu λόγος inaelekea kumaanisha huduma ya maneno, hasa kutangaza ujumbe hadharani. “Kuhubiri” ni ya asili katika Kiswahili, ingawa tanbihi inaonyesha upana wa usemi wa Kigiriki.
- source_word: διδασκαλίᾳ
  choice: kufundisha
  rationale: Neno hili linaeleza shughuli ya kutoa mafundisho. “Kufundisha” ni la kawaida, wazi, na lisilo la kitaalamu kupita kiasi.
theological_decisions:
- issue: Maana ya “heshima maradufu” kwa viongozi wa kanisa
  choice: Kuhifadhi usemi mpana “heshima maradufu” katika matini kuu
  alternative: heshima kubwa; malipo maradufu; heshima inayojumuisha msaada wa kimwili
  rationale: Mstari unaofuata unaelekeza pia kwenye msaada wa kimwili, lakini τιμή linaweza kumaanisha kuthamini au kuheshimu. Usemi mpana huhifadhi wigo huo bila kuingiza nadharia maalumu ya madhehebu kuhusu uongozi au malipo.
- issue: Nguvu ya μάλιστα
  choice: hasa
  alternative: yaani
  rationale: “Hasa” huhifadhi uwezekano kwamba wazee wanaofanya kazi kwa bidii katika huduma ya maneno na mafundisho wanatiliwa mkazo miongoni mwa wazee kwa ujumla, bila kufunga mjadala kuhusu kama neno hilo linafafanua wazee wote wanaokusudiwa.
- issue: Maana ya ἐν λόγῳ
  choice: katika kuhubiri
  alternative: katika neno; katika kunena
  rationale: Muktadha unaunga mkono huduma ya maneno kama kuhubiri au kutangaza ujumbe, lakini tanbihi inahifadhi upana wa Kigiriki badala ya kudai kwamba kuhubiri pekee ndiko kunakokusudiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Matini imetumia “wazee” kama istilahi ya viongozi wa kanisa, “heshima maradufu” ili kuhifadhi utata wa maana, na “hasa” ili kutoamua kimya kimya kama μάλιστα ni ya kusisitiza kundi fulani au ya kufafanua kundi lote.
