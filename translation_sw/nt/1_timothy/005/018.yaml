base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/018.yaml
  text: For the Scripture says[a], “You shall not muzzle an ox while it is threshing,” and[b], “The laborer is worthy of his wages.”
translation:
  language: sw
  text: Kwa maana Maandiko yanasema, “Usimfunge kinywa ng’ombe anapopura nafaka,”[a] na, “Mfanyakazi anastahili ujira wake.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “anapokanyaga nafaka.” Neno la Kigiriki linamhusu ng’ombe anayeshiriki katika kupura.
    reason: lexical_alternative
  - marker: b
    text: Au, “malipo yake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει γὰρ ἡ γραφή
  choice: Kwa maana Maandiko yanasema
  rationale: γάρ inaonyesha sababu inayounga mstari huu na uliotangulia, hivyo ‘Kwa maana’ ni ya asili. ἡ γραφή ni Maandiko yenye mamlaka, si maandishi ya kawaida; katika Kiswahili matumizi ya ‘Maandiko yanasema’ ni ya kawaida na yenye heshima.
- source_word: Βοῦν
  choice: ng’ombe
  rationale: βοῦς hapa ni ng’ombe anayetumiwa katika kazi ya kilimo. Kiswahili hakihitaji kubainisha jinsia yake ili kutoa maana ya neno katika muktadha huu.
- source_word: ἀλοῶντα
  choice: anapopura nafaka
  rationale: Kitenzi hiki humaanisha kushiriki katika upuraji; ‘anapopura nafaka’ kinaeleza kwa uwazi tendo la wakati mmoja na katazo la kumfunga kinywa.
- source_word: οὐ φιμώσεις
  choice: Usimfunge kinywa
  rationale: Muundo wa Kigiriki una nguvu ya katazo. ‘Usimfunge kinywa’ ni amri hasi ya kawaida, ya moja kwa moja, na inahifadhi picha halisi ya kumzuia mnyama kula.
- source_word: καί
  choice: na
  rationale: καί inaunganisha nukuu hizo mbili kwa urahisi; ‘na’ ndiyo kiunganishi cha kawaida cha Kiswahili.
- source_word: Ἄξιος ὁ ἐργάτης
  choice: Mfanyakazi anastahili
  rationale: ἐργάτης ni mtu anayefanya kazi. ‘Mfanyakazi’ ni neno la sasa, la kawaida, na linaendeleza kanuni ya jumla bila kuibana kwa aina moja ya kazi.
- source_word: τοῦ μισθοῦ αὐτοῦ
  choice: ujira wake
  rationale: μισθός hapa ni malipo anayopata mtu kwa kazi, hivyo ‘ujira’ linafaa kuliko ‘tuzo.’ ‘Wake’ huhifadhi umoja wa αὐτοῦ kwa namna ya asili katika Kiswahili.
theological_decisions:
- issue: Upeo wa γραφή kuhusiana na kauli zote mbili zilizonukuliwa
  choice: Kauli zote mbili zimewasilishwa moja kwa moja chini ya utangulizi ‘Maandiko yanasema.’
  alternative: Kuchukulia nukuu ya kwanza pekee kuwa Maandiko na ya pili kuwa methali au usemi wa Yesu usio chini ya utangulizi huo.
  rationale: Muundo wa mstari unaziwasilisha nukuu zote mbili baada ya fomula moja ya utangulizi. Tafsiri haiamui zaidi ya hapo suala la kikanoni, bali inahifadhi namna Paulo alivyoziwasilisha.
- issue: Umoja wa αὐτοῦ katika kauli yenye matumizi ya kijumla
  choice: ujira wake
  alternative: ujira wao
  rationale: Kigiriki kina kiwakilishi cha umoja, na Kiswahili ‘wake’ hukihifadhi kwa asili. Kauli bado inaweza kueleweka kama kanuni inayotumika kwa ujumla bila kubadili umoja kuwa wingi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo wa nukuu na mvutano kuhusu upeo wa ‘Maandiko’ umehifadhiwa bila kuingiza msimamo wa kimadhehebu.
