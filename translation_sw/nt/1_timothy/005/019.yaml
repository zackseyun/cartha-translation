base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/019.yaml
  text: Do not accept an accusation against an elder[b][a], except on the basis of two or three witnesses.
translation:
  language: sw
  text: Usikubali shtaka dhidi ya mzee wa kanisa[a], isipokuwa kwa ushahidi wa mashahidi wawili au watatu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mwanaume mzee,” ikiwa πρεσβυτέρου inaeleweka kuwa inahusu umri badala ya nafasi ya mzee wa kanisa.
    reason: alternative_reading
  - marker: b
    text: Maneno haya yanaakisi kanuni ya kisheria ya Agano la Kale kwamba jambo lithibitishwe kwa ushahidi wa “mashahidi wawili au watatu” (taz. Kum. 19:15).
    reason: cross_reference
lexical_decisions:
- source_word: κατὰ πρεσβυτέρου
  choice: dhidi ya mzee wa kanisa
  rationale: Katika muktadha wa Nyaraka za Kichungaji na maagizo yanayozunguka kifungu hiki, πρεσβύτερος inaelekea kumaanisha kiongozi wa kanisa. Neno 'mzee wa kanisa' ni wazi katika Kiswahili, huku maana ya 'mwanamume mzee' ikihifadhiwa katika tanbihi.
- source_word: κατηγορίαν
  choice: shtaka
  rationale: Neno hili linaonyesha tuhuma au dai lenye sura rasmi ya kisheria; 'shtaka' ni neno la kawaida na lenye uzito unaofaa katika Kiswahili.
- source_word: μὴ παραδέχου
  choice: Usikubali
  rationale: Kitenzi kinakataa kupokea au kulichukua shtaka ili lishughulikiwe. 'Usikubali' huwasilisha maana hiyo ya kiutaratibu bila kudokeza kwamba ni marufuku hata kulisikia.
- source_word: ἐκτὸς εἰ μὴ
  choice: isipokuwa
  rationale: Kirai hiki kinaanzisha sharti la pekee, na 'isipokuwa' ni fasiri fupi na ya asili.
- source_word: ἐπὶ δύο ἢ τριῶν μαρτύρων
  choice: kwa ushahidi wa mashahidi wawili au watatu
  rationale: Kirai kinaonyesha msingi wa ushahidi unaohitajika. Tafsiri hii inahifadhi sauti ya kisheria na mwangwi wa kanuni ya Kumbukumbu la Torati 19:15.
theological_decisions:
- issue: Maana ya πρεσβυτέρου katika muktadha wa kanisa
  choice: mzee wa kanisa, yaani kiongozi mwenye nafasi hiyo
  alternative: mwanamume mzee kwa umri
  rationale: Muktadha wa karibu wa 1 Timotheo 5 na matumizi katika Nyaraka za Kichungaji unaunga mkono zaidi maana ya nafasi ya uongozi. Hata hivyo, uwezekano halisi wa maana inayohusu umri umeonyeshwa katika tanbihi badala ya kufichwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. 'Mzee wa kanisa' huepuka utata usio wa lazima katika matini kuu, huku tanbihi ikihifadhi maana mbadala ya umri. Alama zote za tanbihi zimewekwa katika matini kuu.
