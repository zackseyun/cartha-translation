  text: γυναῖκας ὡσαύτως σεμνάς, μὴ διαβόλους, νηφαλίους, πιστὰς ἐν πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/011.yaml
  text: Women likewise must be dignified[a], not slanderers, sober-minded, faithful in all things.
translation:
  language: sw
  text: Vivyo hivyo, wanawake wanapaswa kuwa wenye heshima[a], si wasingiziaji, wenye kiasi, waaminifu katika mambo yote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Vivyo hivyo, wake wanapaswa kuwa wenye heshima...” Neno la Kigiriki γυναῖκας laweza kumaanisha “wanawake” au “wake” katika muktadha huu; matini haisemi wazi “wake zao.”
    reason: alternative_reading
lexical_decisions:
- source_word: γυναῖκας
  choice: wanawake
  rationale: γυνή yaweza kumaanisha “mwanamke” au “mke.” Kwa kuwa hakuna kimilikishi kinachosema “wake zao,” neno pana “wanawake” limetumiwa katika matini, huku uwezekano wa “wake” ukihifadhiwa katika tanbihi.
- source_word: ὡσαύτως
  choice: vivyo hivyo
  rationale: Kauli hii inaonyesha ulinganifu na sifa zilizotangulia na ni ya kawaida katika Kiswahili sanifu.
- source_word: σεμνάς
  choice: wenye heshima
  rationale: Usemi huu unawasilisha uzito wa tabia, staha, na kustahili kuheshimiwa bila kuwa wa kizamani.
- source_word: μὴ διαβόλους
  choice: si wachongezi
  rationale: Hapa διάβολος ni sifa ya mtu anayesema maneno ya uongo yenye kumharibia mwingine jina, si jina maalumu la Ibilisi.
- source_word: νηφαλίους
  choice: wenye kiasi
  rationale: νηφάλιος hueleza kuwa na kiasi, utulivu, na kujizuia; “wenye kiasi” ni usemi mfupi na wa kawaida unaohifadhi wigo huo.
- source_word: πιστὰς
  choice: waaminifu
  rationale: Neno hili linaweza kueleza uaminifu na kutegemeka kwa tabia; “waaminifu” huhifadhi pia uhusiano wake na kundi la maneno ya imani na uaminifu.
- source_word: ἐν πᾶσιν
  choice: katika mambo yote
  rationale: Tafsiri hii huhifadhi upeo mpana wa kirai cha Kigiriki.
theological_decisions:
- issue: Wanaorejelewa na γυναῖκας katika orodha ya sifa
  choice: wanawake
  alternative: wake
  rationale: Kigiriki kinaweza kumaanisha wanawake kwa ujumla au wake katika muktadha huu. Kutokuwapo kwa kimilikishi “zao” na matumizi ya ὡσαύτως vinaunga mkono tafsiri pana katika matini kuu; tanbihi huhifadhi tafsiri nyingine bila kuamua kimya-kimya mjadala kuhusu huduma au wake za mashemasi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa, chenye staha na kinachoeleweka kwa wasomaji wa kawaida. Muundo mfupi wa orodha umehifadhiwa, pamoja na utata halisi wa γυναῖκας.
