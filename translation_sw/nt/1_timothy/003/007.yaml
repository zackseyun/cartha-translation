  text: δεῖ ⸀δὲ καὶ μαρτυρίαν καλὴν ἔχειν ἀπὸ τῶν ἔξωθεν, ἵνα μὴ εἰς ὀνειδισμὸν ἐμπέσῃ καὶ παγίδα τοῦ διαβόλου.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/007.yaml
  text: And he must also have a good testimony from those outside, so that he may not fall into reproach and the devil’s snare.
translation:
  language: sw
  text: Tena, ni lazima awe na sifa njema kutoka kwa watu walio nje,[a] ili asianguke katika fedheha[b] na mtego wa Ibilisi.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, watu walio nje ya jumuiya ya waamini.
    reason: lexical_alternative
  - marker: b
    text: Au “lawama” au “aibu.” Neno la Kigiriki linaweza kumaanisha shutuma, lawama, au fedheha ya hadharani.
    reason: lexical_alternative
  - marker: c
    text: Au “mtego wa mchongezi,” ikiwa neno la Kigiriki διάβολος linaeleweka kwa maana yake ya kawaida; hapa limeeleweka kuwa “Ibilisi.”
    reason: alternative_reading
lexical_decisions:
- source_word: δεῖ
  choice: ni lazima
  rationale: Hueleza ulazima au wajibu wa sifa hii ya mwangalizi; “ni lazima” ni ya kawaida na inahifadhi nguvu ya neno la Kigiriki.
- source_word: δὲ καὶ
  choice: Tena
  rationale: Huunganisha sharti hili na orodha iliyotangulia huku ikiongeza takwa jingine kwa Kiswahili cha asili.
- source_word: μαρτυρίαν καλὴν
  choice: ushuhuda mzuri
  rationale: Inabaki karibu na maana ya ushuhuda au taarifa njema inayotolewa kumhusu mtu, bila kuibadili moja kwa moja kuwa dhana pana zaidi ya sifa.
- source_word: ἔχειν
  choice: awe na
  rationale: Hutoa kwa kawaida wazo la kuwa na au kumiliki, na muundo wa utegemezi unafuata “ni lazima.”
- source_word: ἀπὸ τῶν ἔξωθεν
  choice: kutoka kwa walio nje
  rationale: Inahifadhi usemi wa Kigiriki unaowarejelea watu walio nje ya jumuiya ya waamini bila kuongeza “kanisa” katika matini kuu.
- source_word: ἵνα μὴ
  choice: ili asianguke
  rationale: Huonyesha kusudi au matokeo yanayokusudiwa pamoja na ukanushi kwa Kiswahili wazi.
- source_word: εἰς ὀνειδισμὸν ἐμπέσῃ
  choice: asianguke katika lawama
  rationale: Inahifadhi sitiari ya kuanguka na wazo la kulaumiwa, kushutumiwa, au kuaibishwa hadharani.
- source_word: παγίδα
  choice: mtego
  rationale: Ni neno la kawaida na wazi la Kiswahili kwa kifaa au hila ya kunasa, na linahifadhi sitiari.
- source_word: τοῦ διαβόλου
  choice: wa Ibilisi
  rationale: Huchukua διάβολος kama jina la yule mwovu binafsi na kuonyesha uhusiano wa genitivi kwa muundo wa kawaida wa Kiswahili.
theological_decisions:
- issue: Maana ya τοῦ διαβόλου
  choice: 'Ibilisi kama yule mwovu binafsi: “mtego wa Ibilisi”'
  alternative: “mtego wa mchongezi,” ikiwa διάβολος inaeleweka kwa maana yake ya kawaida ya mchongezi
  rationale: Matumizi yaliyozoeleka katika Agano Jipya, pamoja na kiambishi cha utambulisho katika Kigiriki, yanaunga mkono rejeo kwa Ibilisi; hata hivyo, uwezekano wa maana ya kawaida ya “mchongezi” umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo “walio nje” umehifadhiwa ili kutoingiza ufafanuzi wa ziada katika matini kuu; tanbihi inaeleza rejeo lake. “Ushuhuda mzuri” hudumisha ukaribu na μαρτυρίαν καλὴν huku ikibaki ya kueleweka.
