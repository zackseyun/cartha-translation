  text: holding the mystery of the faith with a clear conscience[a].
translation:
  language: sw
  text: wakiishikilia siri ya imani kwa dhamiri safi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa tafsiri ya karibu zaidi na muundo wa Kigiriki: “katika dhamiri safi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχοντας
  choice: wakiishikilia
  rationale: Kitenzi endelevu kinawarejelea wahudumu waliotajwa katika muktadha uliotangulia. “Wakiishikilia” kinaonyesha kuendelea kuwa nayo na kudumu ndani yake, si kuwa nayo kwa namna ya kinadharia tu.
- source_word: μυστήριον
  choice: siri
  rationale: Katika matumizi ya Paulo, neno hili kwa kawaida humaanisha kweli ya Mungu iliyokuwa imefichwa lakini ikafunuliwa. “Siri” ni ya kawaida na haileti dhana ya kitendawili kama “fumbo” linavyoweza kufanya.
- source_word: τῆς πίστεως
  choice: ya imani
  rationale: Muundo huu unaelekea kumaanisha imani ya Kikristo kama ujumbe au kweli inayoaminiwa. Kiswahili “ya imani” kinahifadhi pia uwezekano wa maana pana ya imani bila kuongeza istilahi ya kimadhehebu.
- source_word: ἐν καθαρᾷ συνειδήσει
  choice: kwa dhamiri safi
  rationale: Huu ni usemi wa kawaida na wenye hadhi katika Kiswahili, unaowasilisha hali ya uadilifu wa ndani. “Kwa” hapa ni ya kiasili zaidi kuliko “katika,” ingawa “katika” linafuata ἐν kwa ukaribu zaidi.
theological_decisions:
- issue: Maana ya τῆς πίστεως
  choice: imani kama maudhui ya ujumbe na imani ya Kikristo
  alternative: tendo la mtu binafsi la kuamini, au uaminifu
  rationale: Katika muktadha wa sifa za wahudumu wa kanisa, usemi huu unaelekea zaidi kwenye kweli ya Kikristo wanayopaswa kuishikilia. Hata hivyo, “imani” limeachwa bila ufafanuzi wa ziada ili kutofunga kabisa upana wa neno la asili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi, na rahisi kueleweka. Usemi “wakiishikilia” unaendeleza kisarufi sentensi ya mstari uliotangulia.
