id: 1TI.3.16
reference: 1 Timothy 3:16
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ὁμολογουμένως μέγα ἐστὶν τὸ τῆς εὐσεβείας μυστήριον· ⸀Ὃς ἐφανερώθη ἐν σαρκί, ἐδικαιώθη ἐν πνεύματι, ὤφθη ἀγγέλοις, ἐκηρύχθη ἐν ἔθνεσιν, ἐπιστεύθη ἐν κόσμῳ, ἀνελήμφθη ἐν δόξῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/016.yaml
  text: 'And undeniably[a], great is the mystery of godliness:

    He was revealed in flesh,

    was vindicated in spirit,

    was seen by angels,

    was proclaimed among the nations,

    was believed on in the world[d][c][b],

    was taken up in glory.'
translation:
  language: sw
  text: 'Na bila shaka, siri ya utauwa ni kuu:


    Yeye[a] alidhihirishwa katika mwili,


    akathibitishwa kuwa mwenye haki katika roho[b],


    akaonekana na malaika,


    akahubiriwa miongoni mwa mataifa[c],


    akaaminiwa ulimwenguni,


    akachukuliwa juu katika utukufu.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati zina “Mungu alidhihirishwa katika mwili” badala ya “Yeye alidhihirishwa katika mwili.” Matini hakiki ya Kigiriki ina “ambaye,” inayowakilishwa hapa na “Yeye.”
    reason: textual_variant
  - marker: b
    text: Au “akathibitishwa kuwa mwenye haki kwa Roho,” au “katika Roho.” Kirai cha Kigiriki ni kifupi na kinaweza kueleza utendaji wa Roho Mtakatifu au nyanja ya maisha ya kiroho.
    reason: alternative_reading
  - marker: c
    text: Au “miongoni mwa watu wasio Wayahudi.”
    reason: lexical_alternative
  - marker: d
    text: Au “akachukuliwa juu kwenda utukufuni.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμολογουμένως
  choice: bila shaka
  rationale: Huonyesha jambo linalokubaliwa waziwazi na wote; kauli hii ni ya kawaida, wazi, na yenye uzito katika Kiswahili cha sasa.
- source_word: τὸ τῆς εὐσεβείας μυστήριον
  choice: siri ya kumcha Mungu
  rationale: “Siri” hudumisha maana ya kweli ya Mungu iliyokuwa imefichwa na sasa imefunuliwa. “Kumcha Mungu” ni lugha ya kawaida inayoeleza uchaji na maisha ya kujitoa kwa Mungu bila kutumia neno lisiloeleweka kwa urahisi kama “utauwa.”
- source_word: Ὃς
  choice: Yeye
  rationale: Hufuata usomaji wa SBLGNT, yaani kiwakilishi cha kiume “ambaye,” na kuendeleza kwa njia ya asili rejeo la kibinafsi kwa Kristo bila kuingiza usomaji tofauti wa “Mungu.”
- source_word: ἐφανερώθη ἐν σαρκί
  choice: alidhihirishwa katika mwili
  rationale: Huhifadhi hali ya kutendwa ya kitenzi na kueleza wazi kujitokeza kwake katika hali halisi ya kibinadamu.
- source_word: ἐδικαιώθη
  choice: akathibitishwa kuwa mwenye haki
  rationale: Katika muktadha huu kitenzi hakimaanishi kufanywa mwenye haki, bali kuonyeshwa au kutangazwa kuwa yuko upande wa haki. Tafsiri hii huepuka maana potovu ya kwamba Kristo alihitaji kuhesabiwa haki kutoka dhambini.
- source_word: ἐν πνεύματι
  choice: katika roho
  rationale: Huhifadhi ufupi na utata wa Kigiriki kuhusu kama ni hali au eneo la maisha ya kiroho, au utendaji wa Roho Mtakatifu.
- source_word: ὤφθη ἀγγέλοις
  choice: akaonekana na malaika
  rationale: Huhifadhi muundo wa kutendwa na maana ya kwamba malaika walimwona; katika muktadha huu ἀγγέλοις inaeleweka vyema kuwa malaika wa mbinguni.
- source_word: ἐκηρύχθη ἐν ἔθνεσιν
  choice: akahubiriwa miongoni mwa mataifa
  rationale: “Kuhubiriwa” huwasilisha tangazo la hadharani, na “mataifa” hudumisha upana wa ἔθνη huku ikiruhusu maana ya watu wasio Wayahudi.
- source_word: ἐπιστεύθη ἐν κόσμῳ
  choice: akaaminiwa ulimwenguni
  rationale: Huhifadhi hali ya kutendwa na kueleza kwamba watu ulimwenguni walimwamini Kristo.
- source_word: ἀνελήμφθη ἐν δόξῃ
  choice: akachukuliwa juu katika utukufu
  rationale: Hueleza kupaa kwake na kuhifadhi kirai cha ἐν, ambacho huonyesha kuingia au kuwapo katika utukufu bila kukifafanua kupita kiasi.
theological_decisions:
- issue: 'Tofauti ya maandishi mwanzoni mwa utenzi: Ὃς dhidi ya θεός au ὅ'
  choice: Yeye alidhihirishwa katika mwili
  alternative: Mungu alidhihirishwa katika mwili; au, ambayo ilidhihirishwa katika mwili
  rationale: SBLGNT inasoma Ὃς (“ambaye”). “Yeye” ni mwendelezo wa asili wa rejeo kwa Kristo. Usomaji wa kihistoria wa “Mungu” umewekwa katika tanbihi badala ya kuingizwa katika matini kuu.
- issue: Rejeo la ἐν πνεύματι
  choice: katika roho
  alternative: kwa Roho; au, katika Roho
  rationale: Kigiriki kinaweza kumaanisha utendaji wa Roho Mtakatifu au eneo/hali ya maisha ya kiroho. Matini kuu haiondoi utata huo kwa kuamua fundisho moja.
- issue: Maana ya kuhesabiwa haki katika ἐδικαιώθη
  choice: akathibitishwa kuwa mwenye haki
  alternative: alihesabiwa haki
  rationale: Hapa maana inayofaa ni kwamba Kristo alionyeshwa hadharani kuwa mwenye haki, si kwamba alifanywa mwenye haki baada ya kuwa asiye na haki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mistari mifupi inahifadhi muundo wa kiungamo au utenzi wa chanzo. Mfululizo wa “aka-” huunganisha matendo kwa mtiririko wa kawaida wa Kiswahili, huku hali ya kutendwa ya vitenzi vya Kigiriki ikidumishwa.
