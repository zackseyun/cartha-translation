lexical_decisions:
- source_word: Πιστὸς ὁ λόγος
  choice: Msemo huu ni wa kuaminika
  rationale: Kauli hii ni fomula inayotambulisha jambo la kutegemewa. “Msemo” huwasilisha λόγος kwa Kiswahili cha kawaida kuliko tafsiri ngumu ya “neno,” huku “wa kuaminika” ikihifadhi maana ya πιστός.
- source_word: εἴ τις
  choice: ikiwa mtu
  rationale: τις ni kiwakilishi kisichobainisha mtu fulani. “Mtu” ni ya kijumla na haiingizi kwa lazima jinsia ambayo kirai hiki chenyewe hakitaji wazi.
- source_word: ἐπισκοπῆς
  choice: kuwa mwangalizi
  rationale: Nomino hiyo inaweza kumaanisha usimamizi au wajibu wa mwangalizi. Kiswahili asilia huhitaji uundaji upya wa kisarufi; “kuwa mwangalizi” huweka wazi wajibu unaotamaniwa bila kuingiza cheo cha baadaye cha kikanisa.
- source_word: ὀρέγεται
  choice: anatamani
  rationale: Kitenzi kina wazo la kujielekeza au kunyoosha nia kuelekea jambo. “Anatamani” ni cha kawaida na kinafaa katika muktadha huu chanya.
- source_word: καλοῦ ἔργου
  choice: kazi njema
  rationale: Tafsiri hii inabaki karibu na maneno ya Kigiriki na kusisitiza kwamba ni kazi, si hadhi tu. καλός pia inaweza kuleta wazo la kazi yenye heshima.
- source_word: ἐπιθυμεῖ
  choice: anatamani
  rationale: Kitenzi humaanisha kutamani au kuwa na hamu ya jambo. Kurudia “anatamani” kunahifadhi usambamba wa sentensi bila kuongeza nguvu isiyokuwamo wazi.
theological_decisions:
- issue: Iwapo ἐπισκοπῆς itafsiriwe kwa istilahi ya cheo cha kanisa cha baadaye
  choice: kuwa mwangalizi
  alternative: kutaka usimamizi; cheo cha askofu
  rationale: Chaguo hili linaonyesha jukumu la uangalizi na uhusiano wake na ἐπίσκοπος katika muktadha unaofuata, bila kuamua kimbele mfumo maalumu wa uongozi wa dhehebu.
- issue: Iwapo τις ya kijumla ibainishwe kuwa mwanamume
  choice: ikiwa mtu
  alternative: ikiwa mwanamume
  rationale: Kiwakilishi hiki chenyewe hakimtaji mwanamume kwa namna ya pekee. “Mtu” huhifadhi ujumla wa sharti bila kutatua masuala yanayojitokeza katika muktadha unaofuata.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa kawaida kwa wasomaji wengi; umeepuka istilahi nzito za dhehebu na umehifadhi urudiaji wa vitenzi vya kutamani katika Kigiriki.
