base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/005.yaml
  text: But if someone does not know how to manage his own household[c][b][a], how will he care for God’s church?
translation:
  language: sw
  text: Lakini ikiwa mtu hajui kuisimamia kaya yake mwenyewe, atalitunzaje kanisa la Mungu?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kusanyiko la Mungu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δέ
  choice: Lakini ikiwa
  rationale: Huhifadhi sharti la εἰ pamoja na utofautishaji wa kiasi wa δέ kwa Kiswahili cha kawaida.
- source_word: τις
  choice: mtu
  rationale: Ni kiwakilishi kisichotaja mtu maalumu; hapa ‘mtu’ ni ya kawaida na haiongezi maana ambayo haimo katika neno lenyewe.
- source_word: τοῦ ἰδίου οἴκου
  choice: nyumba yake mwenyewe
  rationale: Katika muktadha huu οἶκος ni watu wa nyumbani walio chini ya uangalizi wake, si jengo tu. Kiswahili ‘nyumba yake’ kinaweza kubeba maana hiyo ya kaya, huku ‘mwenyewe’ ikihifadhi ἰδίου.
- source_word: προστῆναι
  choice: kuisimamia
  rationale: Hueleza uongozi wenye wajibu katika nyumba bila kuongeza wazo kali la kutawala; pia hutofautisha kitenzi hiki na ἐπιμελήσεται.
- source_word: οὐκ οἶδεν
  choice: hajui
  rationale: Pamoja na kitenzi-jina kinachofuata, ‘hajui kuisimamia’ huwasilisha maana ya kutokujua jinsi ya kufanya jambo.
- source_word: πῶς
  choice: ata- ... -je?
  rationale: Muundo wa swali ‘atalitungaje?’ huhifadhi swali la balagha na mwelekeo wa wakati ujao.
- source_word: ἐκκλησίας θεοῦ
  choice: kanisa la Mungu
  rationale: Ni usemi wa kawaida na wenye hadhi kwa jumuiya ya waumini inayomilikiwa na Mungu; hauhitaji kuingiza kibainishi ambacho hakipo wazi katika Kigiriki.
- source_word: ἐπιμελήσεται
  choice: atalitungaje
  rationale: ‘Kutunza’ huonyesha kujali, kuhudumia, na kushughulikia mahitaji, badala ya usimamizi wa kiutawala tu; hivyo huhifadhi tofauti na προΐστημι.
theological_decisions:
- issue: Uhusiano kati ya usimamizi wa nyumba na uangalizi wa kanisa
  choice: ‘kuisimamia nyumba yake’ dhidi ya ‘kulitunza kanisa la Mungu’
  alternative: Kutumia ‘kuongoza’ au ‘kutawala’ katika kishazi cha kwanza na ‘kulishughulikia’ katika cha pili
  rationale: Kigiriki kimetumia vitenzi viwili tofauti. Tafsiri hii inadumisha mlinganisho wa maeneo hayo mawili bila kupunguza uangalizi wa kanisa kuwa utawala tu.
- issue: Jinsia ya mtendaji asiyeainishwa kwa jina
  choice: ‘mtu’ bila kiwakilishi cha jinsia katika mstari
  alternative: ‘mwanamume’ au muundo wenye ‘yeye’
  rationale: τις ni neno lisiloainisha mtu maalumu, na Kiswahili hakilazimishi kiwakilishi cha jinsia katika sentensi hii. ‘Mtu’ huhifadhi kutokuwa maalumu kwa neno huku muktadha unaozunguka ukibaki kuonyesha sifa za mwangalizi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni mfupi na wa moja kwa moja; ‘atalitungaje’ ni wa kawaida na huhifadhi nguvu ya swali la balagha.
