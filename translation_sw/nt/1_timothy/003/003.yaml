lexical_decisions:
- source_word: πάροινον
  choice: mlevi
  rationale: Neno hili humaanisha mtu aliyezoea kunywa divai kupita kiasi au kulewa. “Mlevi” ni neno fupi na la kawaida katika Kiswahili linaloonyesha tabia ya kudumu, si tendo moja tu la kunywa.
- source_word: πλήκτην
  choice: mjeuri
  rationale: Kimsingi neno hili humtaja mtu anayepiga wengine; katika orodha hii linaonyesha mtu mwenye tabia ya kutumia nguvu na kuumiza. “Mjeuri” linaeleza tabia hiyo kwa lugha ya kawaida, huku tanbihi ikihifadhi maana halisi ya kupiga.
- source_word: ἐπιεικῆ
  choice: mpole
  rationale: Neno hili lina wazo la upole, uvumilivu, na kutokazia haki ya mtu bila huruma. “Mpole” ni tafsiri fupi, ya asili, na inayoeleweka katika orodha ya sifa za kiongozi.
- source_word: ἄμαχον
  choice: asiye mgomvi
  rationale: Neno hili humaanisha mtu asiyeelekea kupigana au kugombana. “Asiye mgomvi” huhifadhi muundo hasi na kueleza wazi tabia inayokataliwa.
- source_word: ἀφιλάργυρον
  choice: wala mwenye kupenda fedha
  rationale: Neno ambatano linakana moja kwa moja kupenda fedha. Tafsiri hii inahifadhi msisitizo juu ya mwelekeo wa moyo, badala ya kuufupisha kuwa tamaa ya faida tu.
