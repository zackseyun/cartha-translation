lexical_decisions:
- source_word: τοῦ ἰδίου οἴκου
  choice: nyumba yake mwenyewe
  rationale: Katika muktadha huu οἶκος ni nyumba kwa maana pana ya familia na wote walio chini ya uangalizi wake; usemi huu wa kawaida wa Kiswahili unahifadhi pia msisitizo wa ἰδίου, ‘yake mwenyewe’.
- source_word: καλῶς
  choice: vizuri
  rationale: Ni kielezi cha kawaida na cha moja kwa moja kinachoonyesha namna inayofaa ya kusimamia.
- source_word: προϊστάμενον
  choice: anayeisimamia
  rationale: Kitenzi hiki kinaonyesha kuongoza kwa mamlaka na kuwajibika kwa nyumba. ‘Kuisimamia’ ni cha sasa na cha asili, bila kuifanya maana iwe kali kupita kiasi.
- source_word: τέκνα ἔχοντα
  choice: akiwa na watoto
  rationale: Hufuata muundo wa kirai cha Kigiriki kwa njia ya asili katika Kiswahili na kuanzisha hali ya watoto inayotajwa baadaye.
- source_word: ἐν ὑποταγῇ
  choice: wanaotii
  rationale: Huwasilisha hali ya kuwa chini ya mamlaka kwa lugha ya kawaida. Kwa kuwa ‘utii’ unaweza kusikika kuwa mwembamba kuliko nomino ὑποταγή, tanbihi inahifadhi mbadala wa karibu zaidi wa ‘kuwa chini ya mamlaka’.
- source_word: μετὰ πάσης σεμνότητος
  choice: kwa heshima yote
  rationale: σεμνότης hubeba wazo la heshima, adabu, na uzito wa mwenendo. Usemi huu unadumisha sauti ya kimaadili na hauamui kimya kimya kama unawahusu watoto hasa au usimamizi wa nyumba kwa ujumla.
theological_decisions:
- issue: Upeo wa lugha ya uongozi wa nyumba
  choice: Aya inaeleza usimamizi wenye kuwajibika wa nyumba ya mtu anayetarajiwa kuwa mwangalizi.
  alternative: Kuitafsiri kama utawala mkali wa kifamilia, au kuondoa kabisa wazo la mamlaka na kubakiza malezi pekee.
  rationale: προΐστημι na ὑποταγή zinaonyesha mamlaka halisi na utaratibu, lakini aya ni sifa ya mwangalizi, si maelezo kamili ya mafundisho kuhusu kila aina ya mamlaka ya kifamilia.
- issue: Kinachohusishwa na ‘kwa heshima yote’
  choice: Kuacha kirai hicho katika nafasi inayohifadhi uwezekano wa kukihusisha na utii wa watoto au usimamizi wa nyumba kwa ujumla.
  alternative: Kukifungamanisha waziwazi ama na watoto pekee ama na baba pekee.
  rationale: Muundo wa Kigiriki haumalizi mjadala wa kisintaksia; tafsiri haipaswi kuondoa utata huu wa kweli.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Nyumba’ imetumiwa kwa maana pana ya kaya/familia, huku ‘kusimamia’ ikibeba uongozi wenye mamlaka na uwajibikaji bila ukali usio lazima. Alama zote za tanbihi zimewekwa katika matini kuu.
