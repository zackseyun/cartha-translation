  text: Διακόνους ὡσαύτως σεμνούς, μὴ διλόγους, μὴ οἴνῳ πολλῷ προσέχοντας, μὴ αἰσχροκερδεῖς,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/008.yaml
  text: Deacons likewise must be dignified[a], not double-tongued, not devoted to much wine, not greedy for shameful gain[c][b],
translation:
  language: sw
  text: Vivyo hivyo, mashemasi wawe watu wenye heshima, wasio na kauli mbili[a], wasiojishughulisha na divai nyingi[b], wala wasio na tamaa ya faida ya aibu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wasiseme jambo moja kwa mtu mmoja na jambo tofauti kwa mwingine.”
    reason: lexical_alternative
  - marker: b
    text: Au, “wasiwe wamezoea sana divai.”
    reason: lexical_alternative
  - marker: c
    text: Au, “wasitafute faida kwa njia za aibu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Διακόνους
  choice: mashemasi
  rationale: Katika muktadha huu neno hilo linataja kundi lenye wajibu unaotambulika kanisani, sambamba na waangalizi waliotajwa kabla; kwa hiyo cheo cha “mashemasi” kinafaa kuliko neno la jumla “watumishi.”
- source_word: ὡσαύτως
  choice: Vivyo hivyo
  rationale: Inaonyesha mwendelezo na masharti yaliyotangulia kwa waangalizi huku ikianzisha kundi jingine linalohusiana nao.
- source_word: σεμνούς
  choice: watu wenye heshima
  rationale: Inaeleza mwenendo wa staha unaostahili kuheshimiwa, bila kudokeza ukali au kukosa furaha.
- source_word: μὴ διλόγους
  choice: wasiwe na kauli mbili
  rationale: Kauli hii inahifadhi picha ya Kigiriki ya kusema kwa namna mbili na kueleza udanganyifu au kutokuwa thabiti katika usemi.
- source_word: μὴ οἴνῳ πολλῷ προσέχοντας
  choice: wasiwe wamejitoa kwa divai nyingi
  rationale: Kitenzi προσέχω hapa kina maana ya kushikamana na kitu au kujitoa kwake. Tafsiri hii inaonyesha mwelekeo wa kudumu bila kuingiza istilahi ya kitabibu ya uraibu, na inahifadhi πολλῷ, “nyingi.”
- source_word: μὴ αἰσχροκερδεῖς
  choice: wasiwe na tamaa ya faida ya aibu
  rationale: Neno hilo linaunganisha hamu ya kupata faida na njia au hali iliyo ya aibu; tafsiri hii inahifadhi uzito wa kimaadili wa neno la Kigiriki.
theological_decisions:
- issue: Istilahi ya wadhifa wa kanisa kwa διάκονος
  choice: Kutafsiri kwa “mashemasi” kama jina la wadhifa
  alternative: watumishi; wahudumu
  rationale: Muktadha unaorodhesha sifa za majukumu yanayotambulika kanisani—waangalizi kwanza, kisha mashemasi. “Mashemasi” huhifadhi umaalumu huo bila kuingiza miundo ya baadaye ya madhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo wa orodha umehifadhiwa, na istilahi zimechaguliwa ili zieleweke kwa wasomaji wa kawaida bila kuondoa ukali wa maadili wa maandishi ya Kigiriki.
