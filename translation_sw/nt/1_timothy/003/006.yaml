  text: He must not be a recent convert[a], so that he may not become puffed up and fall into the judgment of the devil.
translation:
  language: sw
  text: Asiwe mtu aliyeongoka hivi karibuni, asije akajaa majivuno na kuanguka katika hukumu ya Ibilisi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuanguka katika hukumu ileile aliyopata Ibilisi”; pia inaweza kumaanisha, “kuanguka chini ya hukumu inayohusiana na Ibilisi.”
    reason: alternative_reading
lexical_decisions:
- source_word: νεόφυτον
  choice: mtu aliyeongoka hivi karibuni
  rationale: Neno hili kihalisi humaanisha ‘aliyepandwa karibuni,’ lakini hapa limetumiwa kwa mtu aliyeingia katika imani hivi karibuni. Tafsiri hii ni ya kawaida na wazi katika Kiswahili cha sasa.
- source_word: τυφωθεὶς
  choice: akajivuna
  rationale: Kitenzi kinaeleza kujaa majivuno au kiburi. ‘Akajivuna’ huwasilisha maana hiyo kwa lugha ya asili, ingawa sitiari ya kufura haijaendelezwa kihalisi.
- source_word: κρίμα
  choice: hukumu
  rationale: ‘Hukumu’ huhifadhi upana wa neno la Kigiriki, ambalo laweza kumaanisha hukumu kwa ujumla au adhabu ya kuhukumiwa.
- source_word: τοῦ διαβόλου
  choice: ya Ibilisi
  rationale: Muundo huu wa moja kwa moja unahifadhi utata wa kimakusudi katika Kigiriki kuhusu iwapo ni hukumu iliyompata Ibilisi au hukumu inayohusiana naye.
- source_word: ἐμπέσῃ
  choice: kuanguka katika
  rationale: Huhifadhi sitiari ya kuingia katika hali au matokeo hatari na ni usemi unaoeleweka katika Kiswahili.
- source_word: ἵνα μὴ
  choice: asije
  rationale: ‘Asije’ hutoa kwa ufupi na kwa asili wazo la kusudi au matokeo yanayozuiwa.
theological_decisions:
- issue: Maana ya εἰς κρίμα ἐμπέσῃ τοῦ διαβόλου
  choice: kuanguka katika hukumu ya Ibilisi
  alternative: kuanguka katika hukumu ileile aliyopata Ibilisi; au kuanguka chini ya hukumu inayohusiana na Ibilisi
  rationale: Kivumishi-milikishi cha Kigiriki τοῦ διαβόλου kinaweza kueleweka kwa zaidi ya njia moja. Matini kuu haibainishi njia moja pekee, na tanbihi inaonyesha uwezekano huo bila kutatua mvutano wa kiteolojia kimabavu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. ‘Aliyeongoka hivi karibuni’ inaweka wazi muktadha wa imani, huku ‘hukumu ya Ibilisi’ ikihifadhi utata wa matini asilia.
