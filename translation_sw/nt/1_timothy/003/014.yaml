  text: I am writing these things to you[a], hoping to come to you soon,
translation:
  language: sw
  text: Ninakuandikia mambo haya, nikitumaini kuja kwako hivi karibuni,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa haraka” / “baada ya muda mfupi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτά
  choice: mambo haya
  rationale: Kiashiria cha wingi wa kati kinarejelea maagizo yaliyotangulia kama mkusanyo; “mambo haya” huhifadhi wingi huo kwa Kiswahili cha kawaida.
- source_word: σοι
  choice: ninakuandikia
  rationale: Yambwa ya dative pamoja na γράφω imewasilishwa kwa kiambishi cha yambwa -ku- katika kitenzi, njia ya asili ya kusema “kuandika kwako” kwa Kiswahili.
- source_word: γράφω
  choice: Ninakuandikia
  rationale: Wakati wa sasa wa barua unaeleweka kwa hali ya sasa inayoendelea; “ninakuandikia” ni ya kawaida na yenye hadhi.
- source_word: ἐλπίζων
  choice: nikitumaini
  rationale: Kauli shirikishi ya sasa inaonyesha jambo linaloandamana na tendo kuu bila kuongeza kiwango cha uhakika; “nikitumaini” huhifadhi maana hiyo.
- source_word: ἐλθεῖν
  choice: kuja
  rationale: Kitenzi-jina cha ἔρχομαι pamoja na πρὸς σέ kinaonyesha mwendo kuelekea kwa Timotheo; “kuja” ndilo chaguo la asili kwa mtazamo wa mwandishi.
- source_word: πρὸς σὲ
  choice: kwako
  rationale: πρός pamoja na accusative baada ya kitenzi cha mwendo huonyesha kuelekea kwa mtu; “kwako” ni usemi wa kawaida na sahihi.
- source_word: ἐν τάχει
  choice: hivi karibuni
  rationale: Nahau hii inaweza kumaanisha “karibuni” au “kwa haraka”; katika muktadha wa matarajio ya safari, “hivi karibuni” huwasilisha kwa kawaida ukaribu wa wakati.
