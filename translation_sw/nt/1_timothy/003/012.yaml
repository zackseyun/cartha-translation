  text: διάκονοι ἔστωσαν μιᾶς γυναικὸς ἄνδρες, τέκνων καλῶς προϊστάμενοι καὶ τῶν ἰδίων οἴκων·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/012.yaml
  text: Deacons must be husbands of one wife[a], managing their children and their own households well.
translation:
  language: sw
  text: Mashemasi wanapaswa kuwa waume wa mke mmoja[a], wakisimamia vizuri watoto wao na kaya zao wenyewe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wanaume wa mwanamke mmoja.” Kirai hiki huenda kinakazia uaminifu katika ndoa; wengine hukielewa hasa kuwa kinakataza kuwa na wake wengi au kuoa tena.
    reason: alternative_reading
lexical_decisions:
- source_word: διάκονοι
  choice: Mashemasi
  rationale: Katika muktadha huu wa sifa za viongozi wa kanisa, neno hili linataja huduma au cheo kinachotambulika, si watumishi kwa maana ya jumla.
- source_word: ἔστωσαν
  choice: wanapaswa kuwa
  rationale: Kauli ya amri inaonyesha sharti la kawaida; usemi huu ni wa asili katika Kiswahili na unaonyesha wajibu bila kuwa mkavu kupita kiasi.
- source_word: μιᾶς γυναικὸς ἄνδρες
  choice: waume wa mke mmoja
  rationale: Tafsiri hii ya karibu inahifadhi lugha inayowahusu wanaume na pia utata wa kirai cha Kigiriki kuhusu uaminifu wa ndoa, kuwa na mke mmoja, au kuoa tena.
- source_word: τέκνων
  choice: watoto wao
  rationale: Kiwakilishi kimetolewa kwa kawaida kutokana na muktadha na ulinganifu na nyumba zao wenyewe.
- source_word: καλῶς
  choice: vizuri
  rationale: Hiki ndicho kielezi cha kawaida na cha moja kwa moja kinachoonyesha namna ya kuongoza.
- source_word: προϊστάμενοι
  choice: wakiwaongoza
  rationale: Neno linaonyesha kusimamia kwa uwajibikaji. 'Kuongoza' linafaa kwa watoto na nyumba katika Kiswahili cha sasa bila kuleta hisia kali ya utawala.
- source_word: τῶν ἰδίων οἴκων
  choice: nyumba zao wenyewe
  rationale: Hapa 'nyumba' ina maana pana ya kaya, si jengo tu; muundo huu unafuata kwa karibu msisitizo wa Kigiriki juu ya nyumba zao wenyewe.
theological_decisions:
- issue: Maana ya μιᾶς γυναικὸς ἄνδρες katika sifa za wahudumu wa kanisa
  choice: waume wa mke mmoja
  alternative: wanaume wa mwanamke mmoja; waaminifu kwa wake zao; waliooa mara moja tu
  rationale: Kirai cha Kigiriki ni kifupi na kinaweza kueleweka kwa njia kadhaa. Tafsiri ya karibu inalinda mvutano huo badala ya kuamua kama kinamaanisha hasa uaminifu wa ndoa, kutokuwa na wake wengi, au kutooa tena.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. 'Mashemasi' limetumiwa kama jina la huduma inayotambulika kanisani; tanbihi inalinda utata halisi wa kirai kuhusu ndoa.
