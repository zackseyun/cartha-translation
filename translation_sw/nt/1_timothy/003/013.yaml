  text: οἱ γὰρ καλῶς διακονήσαντες βαθμὸν ἑαυτοῖς καλὸν περιποιοῦνται καὶ πολλὴν παρρησίαν ἐν πίστει τῇ ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/013.yaml
  text: For those who have served well obtain for themselves a good standing and great boldness in the faith that is in Messiah Jesus[a][b][c].
translation:
  language: sw
  text: Kwa maana wale waliotumikia vizuri hujipatia hadhi njema na ujasiri mwingi[a] katika imani[b] iliyo katika Masihi[c] Yesu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kuwa na hakika sana”; neno la Kigiriki linaweza kumaanisha ujasiri, kuwa na hakika, au kusema wazi.
    reason: lexical_alternative
  - marker: b
    text: Au “katika uaminifu ulio katika Masihi Yesu.” Neno la Kigiriki πίστις linaweza kumaanisha imani, tumaini, au uaminifu; maandishi makuu yametumia “imani.”
    reason: alternative_reading
  - marker: c
    text: Kigiriki “Kristo”; hapa limetafsiriwa “Masihi” kwa sababu ni cheo.
    reason: lexical_alternative
lexical_decisions:
- source_word: διακονήσαντες
  choice: wametumikia
  rationale: Kitenzi chenyewe humaanisha kutumikia au kuhudumu. “Wametumikia” ni Kiswahili cha kawaida na hakilazimishi cheo cha “mashemasi,” ingawa muktadha unawahusu wahudumu hao.
- source_word: καλῶς
  choice: vizuri
  rationale: Kielezi hiki kinaeleza namna walivyotumikia; “vizuri” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: βαθμὸν ... καλὸν
  choice: heshima nzuri
  rationale: βαθμός inaweza kumaanisha hatua, nafasi, au hadhi. Katika muktadha huu ni hadhi yenye kuheshimika inayopatikana kwa utumishi mzuri; “heshima nzuri” ni ya asili kwa Kiswahili na haidokezi cheo rasmi kupita kiasi.
- source_word: περιποιοῦνται
  choice: hujipatia
  rationale: Kauli ya kati ina maana ya kujipatia; “hujipatia” huhifadhi nguvu hiyo ya kujirejelea.
- source_word: παρρησίαν
  choice: ujasiri
  rationale: Neno linaweza kumaanisha ujasiri, kujiamini, au kusema wazi. “Ujasiri” huhifadhi nguvu ya neno katika muktadha huu.
- source_word: πίστει
  choice: imani
  rationale: “Imani” ndiyo maana inayofaa zaidi hapa, huku uwezekano wa “uaminifu” ukihifadhiwa katika tanbihi.
- source_word: τῇ ἐν Χριστῷ Ἰησοῦ
  choice: iliyo katika Masihi Yesu
  rationale: Kifungu hiki kinaifafanua “imani.” Muundo “imani iliyo katika Masihi Yesu” huhifadhi uhusiano wa kisarufi wa Kigiriki bila kuongeza wazo la muungano lisilotajwa wazi.
- source_word: Χριστῷ
  choice: Masihi
  rationale: Χριστός ni cheo chenye maana ya Masihi; tafsiri hii huhifadhi maana ya cheo hicho.
theological_decisions:
- issue: Maana ya πίστις katika ἐν πίστει τῇ ἐν Χριστῷ Ἰησοῦ
  choice: imani
  alternative: uaminifu
  rationale: Katika muktadha huu “imani” yaelekea kuwa maana kuu, lakini πίστις pia inaweza kumaanisha “uaminifu.” Tanbihi huhifadhi uwezekano huo bila kuamua suala hilo kidogma.
- issue: Uhusiano wa τῇ ἐν Χριστῷ Ἰησοῦ na πίστει
  choice: imani iliyo katika Masihi Yesu
  alternative: imani katika Masihi Yesu
  rationale: Tafsiri kuu hufuata kwa karibu muundo wa kifungu cha Kigiriki, ambapo kirai chenye kibainishi kinaifafanua “imani”; mbadala ulio laini zaidi kwa Kiswahili ungeweza kufupisha muundo huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Sentensi imehifadhi kiunganishi cha sababu “Kwa maana,” kauli ya kujirejelea katika “hujipatia,” na utata halisi wa παρρησία na πίστις kupitia tanbihi.
