reference: 1 Timothy 3:15
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐὰν δὲ βραδύνω, ἵνα εἰδῇς πῶς δεῖ ἐν οἴκῳ θεοῦ ἀναστρέφεσθαι, ἥτις ἐστὶν ἐκκλησία θεοῦ ζῶντος, στῦλος καὶ ἑδραίωμα τῆς ἀληθείας·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/015.yaml
  text: But if I am delayed[a], I write so that you may know how one ought to conduct oneself in the household of God, which is the assembly of the living God[b], the pillar and support of the truth.
translation:
  language: sw
  text: Lakini nikikawia, nakuandikia ili ujue jinsi mtu anavyopaswa kuenenda katika nyumba ya Mungu, ambayo ni kusanyiko[a] la Mungu aliye hai, nguzo na tegemezo[b] la kweli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au kwa tafsiri ya kimapokeo, “kanisa la Mungu aliye hai.”
    reason: lexical_alternative
  - marker: b
    text: Au “nguzo na boma imara la kweli”; pia “msingi” umependekezwa badala ya “tegemezo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: βραδύνω
  choice: nikikawia
  rationale: Kitenzi hiki hapa kinahusu Paulo kuchelewa kufika. “Nikikawia” ni Kiswahili cha kawaida na hakiongezi wazo la uzembe wa kimaadili.
- source_word: ἵνα εἰδῇς
  choice: ili ujue
  rationale: Huhifadhi wazi maana ya kusudi kwa Kiswahili cha asili.
- source_word: δεῖ ... ἀναστρέφεσθαι
  choice: jinsi mtu anavyopaswa kujiendesha
  rationale: Muundo huu unaonyesha wajibu wa mwenendo bila kumtaja mhusika maalumu ambaye Kigiriki hakumtaji wazi.
- source_word: ἐν οἴκῳ θεοῦ
  choice: katika jamaa ya Mungu
  rationale: οἶκος hapa inaelekea kumaanisha watu wa nyumba au familia, si jengo tu, kwa kuwa inaelezwa baadaye kuwa ἐκκλησία. “Jamaa ya Mungu” huwasilisha maana hiyo ya kijamii kwa Kiswahili cha sasa.
- source_word: ἐκκλησία
  choice: kusanyiko
  rationale: Neno hili huonyesha jamii ya watu walioitwa na kukusanyika, bila kuingiza kwanza maana ya jengo au taasisi. Tafsiri ya kimapokeo “kanisa” imehifadhiwa katika tanbihi.
- source_word: θεοῦ ζῶντος
  choice: Mungu aliye hai
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kishazi hiki, ikihifadhi msisitizo wa Mungu kuwa hai.
- source_word: στῦλος
  choice: nguzo
  rationale: Huhifadhi sitiari ya usanifu kwa neno linaloeleweka vizuri katika Kiswahili.
- source_word: ἑδραίωμα
  choice: tegemezo
  rationale: Neno adimu la Kigiriki linaashiria kitu kinachotia uimara au kutoa msaada. “Tegemezo” huhifadhi wazo hilo bila kuamua kimya kimya kuwa maana pekee ni “msingi.”
- source_word: τῆς ἀληθείας
  choice: la kweli
  rationale: Huwasilisha kihusishi na nomino yenye kibainishi kwa Kiswahili cha kawaida, ikirejelea kweli inayojulikana katika muktadha.
theological_decisions:
- issue: Maana ya ἐκκλησία katika muktadha wa watu wa Mungu
  choice: kusanyiko
  alternative: kanisa; jumuiya
  rationale: “Kusanyiko” hutanguliza maana ya watu waliokusanyika badala ya jengo au muundo wa kitaasisi. “Kanisa,” ambalo ni neno la kawaida katika mapokeo ya Kikristo, limewekwa katika tanbihi ili maana hiyo isifichwe.
- issue: Maana ya “nguzo na ἑδραίωμα ya kweli”
  choice: nguzo na tegemezo la kweli
  alternative: nguzo na boma imara la kweli; nguzo na msingi wa kweli
  rationale: Kigiriki kinahusisha maelezo haya na kusanyiko la Mungu aliye hai. “Tegemezo” hudumisha dai hilo kubwa kuhusu kusanyiko bila kulazimisha hitimisho kwamba kusanyiko ndilo chanzo cha kweli; tanbihi huhifadhi uwezekano wa “boma imara” au “msingi.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imetumia “jamaa ya Mungu” ili kuepuka kuelekeza fikira kwenye jengo, na “mtu” kuhifadhi hali ya jumla ya infinitivu ya Kigiriki. Alama zote za tanbihi zimewekwa moja kwa moja baada ya maneno yanayohusika.
