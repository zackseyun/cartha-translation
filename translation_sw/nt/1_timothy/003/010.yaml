  yaml_path: translation/nt/1_timothy/003/010.yaml
  text: And these also must first be tested[a]; then let them serve[b], being beyond reproach.
translation:
  language: sw
  text: Nao hawa pia wachunguzwe kwanza; kisha wahudumu[a], wakiwa hawana lawama.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wahudumu kama mashemasi.” Kitenzi cha Kigiriki humaanisha “kuhudumu,” lakini hapa kinatumika katika muktadha wa sifa za mashemasi.
    reason: lexical_alternative
  - marker: b
    text: Au, “wakiwa bila shtaka.” Hii haimaanishi kwamba hawana dhambi kabisa, bali kwamba hakuna shtaka halali linaloweza kuthibitishwa dhidi yao.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτοι
  choice: hawa pia
  rationale: Inahifadhi nguvu ya kiwakilishi cha kuonyesha pamoja na uhusiano wa nyongeza kwa kundi linalozungumziwa katika muktadha.
- source_word: δοκιμαζέσθωσαν
  choice: wachunguzwe
  rationale: Kitenzi kina maana ya kupima au kuchunguza ili kuthibitisha kufaa. “Wachunguzwe” ni Kiswahili cha kawaida katika muktadha wa kutathmini sifa, bila maana inayoweza kujitokeza ya kujaribiwa kwa majaribu.
- source_word: πρῶτον
  choice: kwanza
  rationale: Inaonyesha kwamba uchunguzi unapaswa kutangulia huduma.
- source_word: εἶτα
  choice: kisha
  rationale: Inaonyesha hatua inayofuata baada ya uchunguzi.
- source_word: διακονείτωσαν
  choice: wahudumu
  rationale: Inatafsiri moja kwa moja wazo la kutumikia au kuhudumu, huku muktadha wa masharti ya mashemasi ukibaki wazi bila kuingiza nomino ambayo haipo katika kifungu hiki.
- source_word: ἀνέγκλητοι
  choice: hawana shtaka la msingi
  rationale: Inaeleza kwamba hakuna shtaka halali linaloweza kuthibitishwa dhidi yao, badala ya kudokeza kutokuwa na dhambi kabisa.
- source_word: ὄντες
  choice: wakiwa
  rationale: Inahifadhi muundo wa hali unaoandamana na huduma yao kwa Kiswahili cha asili.
theological_decisions:
- issue: Kama διακονείτωσαν itafsiriwe kwa maana ya jumla ya kuhudumu au kwa maneno yaliyo wazi zaidi “wahudumu kama mashemasi”
  choice: wahudumu
  alternative: wahudumu kama mashemasi
  rationale: Kitenzi chenyewe humaanisha kuhudumu, ingawa muktadha unahusu mashemasi. Tafsiri hii inahifadhi upana wa kitenzi cha Kigiriki, na tanbihi inaeleza maana yake ya kimuktadha.
- issue: Kama ἀνέγκλητοι inadokeza ukamilifu usio na dhambi au kutokuwapo kwa shtaka halali
  choice: hawana shtaka la msingi
  alternative: hawana lawama
  rationale: Katika orodha ya sifa, neno hili linahusu kutokuwapo kwa shtaka linaloweza kuthibitishwa, si ukamilifu usio na dhambi.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. “Wachunguzwe” linafaa kwa tathmini ya sifa; “wahudumu” ni la kawaida na halibebi vyama vya baadaye vya kikanisa. Muundo wa sentensi unahifadhi mfuatano wa Kigiriki: uchunguzi kwanza, huduma baadaye, pamoja na sharti la kutokuwa na shtaka la msingi.'
