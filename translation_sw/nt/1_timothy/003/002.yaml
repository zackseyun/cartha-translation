  text: δεῖ οὖν τὸν ἐπίσκοπον ἀνεπίλημπτον εἶναι, μιᾶς γυναικὸς ἄνδρα, νηφάλιον, σώφρονα, κόσμιον, φιλόξενον, διδακτικόν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/002.yaml
  text: Therefore an overseer must be above reproach[a], the husband of one wife, sober-minded, self-controlled, respectable, hospitable, able to teach,
translation:
  language: sw
  text: Kwa hiyo, mwangalizi hana budi kuwa mtu asiye na lawama, mume wa mke mmoja[a], mwenye utulivu wa akili, mwenye kujitawala, mwenye mwenendo wa staha, mwenye kukaribisha wageni, na mwenye uwezo wa kufundisha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mwanamume wa mwanamke mmoja”; huenda kirai hiki kinakazia uaminifu katika ndoa, wala si hali ya ndoa pekee.
    reason: alternative_reading
lexical_decisions:
- source_word: δεῖ
  choice: hana budi
  rationale: Inaonyesha ulazima wa sifa hizi, si ushauri tu; ni usemi wa kawaida na wenye hadhi katika Kiswahili.
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Inadumisha uhusiano wa kimantiki na maelezo yaliyotangulia.
- source_word: ἐπίσκοπον
  choice: mwangalizi
  rationale: Inatafsiri cheo kwa maana yake ya msingi bila kuingiza muundo wa baadaye wa madhehebu unaoweza kudokezwa na ‘askofu’.
- source_word: ἀνεπίλημπτον
  choice: mtu asiye na lawama
  rationale: Inaeleza mtu ambaye hakuna shtaka halali linaloweza kuthibitishwa dhidi yake, bila kudokeza kwamba hana dhambi kabisa.
- source_word: μιᾶς γυναικὸς ἄνδρα
  choice: mume wa mke mmoja
  rationale: Inafuata kwa karibu maneno ya Kigiriki yaliyo mahususi kwa mwanamume na kuacha wazi maswali ya kiufafanuzi kuhusu uaminifu, ndoa ya wake wengi, au kuoa tena.
- source_word: νηφάλιον
  choice: mwenye utulivu wa akili
  rationale: Inawasilisha hali ya kuwa makini, mwenye kiasi, na asiyeendeshwa na misukumo; haifungi maana katika kujiepusha na pombe pekee.
- source_word: σώφρονα
  choice: mwenye kujitawala
  rationale: Inaonyesha uwezo wa kudhibiti mawazo na mwenendo kwa uamuzi mzuri, huku ikitofautishwa na νηφάλιον.
- source_word: κόσμιον
  choice: mwenye mwenendo wa staha
  rationale: Inabeba wazo la mwenendo unaofaa, wenye mpangilio na heshima, kwa Kiswahili cha kawaida.
- source_word: φιλόξενον
  choice: mkaribishaji
  rationale: Ni neno fupi na la asili linaloonyesha utayari wa kupokea na kuwahudumia wageni.
- source_word: διδακτικόν
  choice: mwenye uwezo wa kufundisha
  rationale: Inaonyesha ustadi au uwezo wa kufundisha, si utayari pekee.
theological_decisions:
- issue: Maana ya μιᾶς γυναικὸς ἄνδρα katika sifa za mwangalizi
  choice: mume wa mke mmoja
  alternative: mwanamume wa mwanamke mmoja; mwaminifu kwa mke wake
  rationale: Kirai hicho kinaweza kusisitiza uaminifu wa ndoa, kukataza ndoa ya wake wengi, au kuhusishwa na masharti kuhusu kuoa tena. Tafsiri rasmi katika matini kuu inadumisha mvutano huo badala ya kuamua suala hilo kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Orodha imetungwa kwa vifungu sambamba vinavyoeleweka kwa wasomaji wa kawaida; alama ya tanbihi imewekwa mara tu baada ya kirai kinachofafanuliwa.
