  text: ὁ μόνος ἔχων ἀθανασίαν, φῶς οἰκῶν ἀπρόσιτον, ὃν εἶδεν οὐδεὶς ἀνθρώπων οὐδὲ ἰδεῖν δύναται· ᾧ τιμὴ καὶ κράτος αἰώνιον· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/016.yaml
  text: who alone has immortality[a], dwelling in unapproachable light, whom no one among men has seen nor is able to see. To him be honor and eternal dominion[b]. Amen.
translation:
  language: sw
  text: ambaye yeye peke yake ndiye asiyeweza kufa, anayekaa katika nuru isiyoweza kukaribiwa; ambaye hakuna mwanadamu aliyemwona wala anayeweza kumwona.[a] Heshima na enzi ya milele viwe kwake.[b] Amina.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ambaye hakuna mtu yeyote kati ya wanadamu aliyemwona wala anayeweza kumwona.”
    reason: lexical_alternative
  - marker: b
    text: Baadhi huelewa maelezo haya na maneno haya ya sifa kuwa yanamhusu moja kwa moja zaidi Bwana Yesu Masihi katika muktadha mpana, ingawa lugha ya kutoweza kuonekana inaelekeza kwa kawaida zaidi kwa Mungu.
    reason: alternative_reading
lexical_decisions:
- source_word: μόνος ἔχων ἀθανασίαν
  choice: yeye peke yake ndiye asiyeweza kufa
  rationale: Muundo huu wa kawaida wa Kiswahili unadumisha upekee unaosisitizwa na μόνος na maana ya kuwa na hali ya kutokufa, bila kutumia nomino dhahania isiyo ya kawaida katika Kiswahili.
- source_word: φῶς οἰκῶν ἀπρόσιτον
  choice: anayekaa katika nuru isiyoweza kukaribiwa
  rationale: “Anayekaa katika” hudumisha picha ya οἰκῶν, na “isiyoweza kukaribiwa” huonyesha kwamba nuru hiyo haifikiki kwa kuisogelea, si kwamba ni nuru isiyoonekana tu.
- source_word: οὐδεὶς ἀνθρώπων
  choice: hakuna mwanadamu
  rationale: Hutoa maana ya sehemu ya kundi la wanadamu kwa Kiswahili cha kawaida na hujumuisha binadamu wote bila kuingiza tofauti ya jinsia ambayo neno ἄνθρωπος halidai hapa.
- source_word: οὐδὲ ἰδεῖν δύναται
  choice: wala anayeweza kumwona
  rationale: Hudumisha wazi wazo la kutokuwa na uwezo linalotolewa na δύναται, pamoja na uhusiano wake na kitenzi “kumwona.”
- source_word: τιμὴ καὶ κράτος αἰώνιον
  choice: Heshima na mamlaka ya milele viwe kwake
  rationale: “Mamlaka” huwasilisha nguvu ya kutawala inayodokezwa na κράτος katika sifa hii; “viwe” hukamilisha kwa kawaida sentensi ya Kiyunani isiyo na kitenzi kilichotajwa.
- source_word: ἀμήν
  choice: Amina
  rationale: Ni umbo la kawaida la kiliturujia na la kibiblia katika Kiswahili.
theological_decisions:
- issue: Mhusika anayeelezwa na vifungu vya uhusiano na anayeelekezewa sifa
  choice: Matini inaendeleza maelezo ya Mungu aliyetajwa katika muktadha uliotangulia, na sifa inaelekezwa kwake.
  alternative: Baadhi huelewa maelezo haya kuwa yanamhusu moja kwa moja zaidi Bwana Yesu Masihi kutokana na muktadha mpana wa sentensi.
  rationale: Mtungo wa 1 Timotheo 6:15–16 unaendeleza kwa kawaida maelezo ya “Mwenye enzi, aliyebarikiwa na wa pekee,” na lugha ya kutoweza kuonekana inaelekeza zaidi kwa Mungu. Hata hivyo, tafsiri haitaji jina katika aya hii, hivyo haifuti mvutano uliopo katika muktadha mpana.
- issue: Maana ya ἀνθρώπων
  choice: mwanadamu
  alternative: mtu yeyote kati ya wanadamu
  rationale: Katika muktadha huu neno la Kiyunani linawakilisha jamii yote ya binadamu. “Mwanadamu” ni sahihi kijinsia na ni la kawaida zaidi kuliko kuiga moja kwa moja umbo la wingi la Kiyunani.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inadumisha mtindo wa sifa wa kifungu cha Kiyunani, huku ikitumia miundo inayoeleweka kwa wasomaji wa kawaida. Alama [a] imewekwa baada ya kifungu ambacho tanbihi yake inahusu, badala ya baada ya kauli kuhusu kutokufa.
