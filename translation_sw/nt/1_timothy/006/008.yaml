  text: But if we have food and covering[a], we will be content with these.
translation:
  language: sw
  text: Lakini tukiwa na chakula na vitu vya kujisitiri[a], tutaridhika na hayo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mavazi”; neno la Kigiriki linaweza kumaanisha kwa upana zaidi vitu vinavyomfunika mtu, na huenda likajumuisha makao pia.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχοντες
  choice: tukiwa na
  rationale: Kirai cha hali kinaonyesha mazingira au sharti linalohusiana na kitenzi kikuu. “Tukiwa na” ni Kiswahili cha kawaida na hakikazii maana ya sababu kama “kwa kuwa tuna.”
- source_word: δὲ
  choice: Lakini
  rationale: Kiunganishi hiki kinaonyesha utofautishaji wa kiasi na wazo lililotangulia kuhusu faida na kuridhika.
- source_word: διατροφὰς
  choice: chakula
  rationale: Neno hili linamaanisha mahitaji ya kujikimu, hasa chakula; “chakula” ni la kawaida na sahihi katika muktadha huu.
- source_word: σκεπάσματα
  choice: vitu vya kujisitiri
  rationale: Neno la Kigiriki linaweza kumaanisha vitu vinavyomfunika mtu, hasa mavazi, na huenda pia makao. Usemi huu unahifadhi upana huo kuliko “mavazi” pekee.
- source_word: τούτοις
  choice: na hivyo
  rationale: Kiwakilishi hiki kinarejelea mahitaji yaliyotajwa, yaani chakula na vitu vya kujisitiri; “na hivyo” ni usemi wa kawaida wa Kiswahili katika muundo wa kuridhika na kitu.
- source_word: ἀρκεσθησόμεθα
  choice: tutaridhika
  rationale: Umbo hili ni la wakati ujao na linaeleza kuwa na vya kutosha au kuridhika. “Tutaridhika” huhifadhi wakati ujao bila kuligeuza kuwa agizo kama “na turidhike.”
theological_decisions:
- issue: Upeo wa maana ya σκεπάσματα
  choice: vitu vya kujisitiri, ambavyo hasa ni mavazi lakini huenda vikajumuisha makao
  alternative: mavazi pekee; au makao pekee
  rationale: Tafsiri haipaswi kulifinya neno pana la Kigiriki liwe aina moja tu ya hitaji la msingi. Usemi uliochaguliwa unadumisha mvutano huo wa kile kinachomfunika au kumhifadhi mtu.
- issue: Nguvu ya ἀρκεσθησόμεθα
  choice: 'kauli ya wakati ujao: “tutaridhika”'
  alternative: 'himizo: “na turidhike”'
  rationale: Maandishi ya Kigiriki yana umbo la wakati ujao, si amri. Tafsiri kwa hiyo inalihifadhi kama kauli, bila kuingiza himizo moja kwa moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini kinachoeleweka kwa urahisi. “Vitu vya kujisitiri” limetumiwa kuhifadhi upana wa neno la Kigiriki, huku tanbihi ikitoa mbadala wa kawaida zaidi, “mavazi.”
