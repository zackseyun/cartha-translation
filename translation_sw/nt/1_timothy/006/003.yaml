  text: εἴ τις ἑτεροδιδασκαλεῖ καὶ μὴ προσέρχεται ὑγιαίνουσι λόγοις, τοῖς τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, καὶ τῇ κατ’ εὐσέβειαν διδασκαλίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/003.yaml
  text: If anyone teaches a different doctrine and does not agree with sound words[a], those of our Lord Jesus the Messiah, and with the teaching that accords with godliness[b],
translation:
  language: sw
  text: Ikiwa mtu yeyote anafundisha mafundisho tofauti na hakubaliani na maneno yenye afya[a], ya Bwana wetu Yesu Masihi[b], na mafundisho yanayopatana na uchaji wa Mungu,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “maneno ya Bwana wetu Yesu Masihi.”
    reason: lexical_alternative
  - marker: b
    text: 'Kigiriki: “Yesu Kristo.” Neno Χριστός ni cheo chenye maana ya “Masihi.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἑτεροδιδασκαλεῖ
  choice: anafundisha mafundisho tofauti
  rationale: Kitenzi hiki kinamaanisha kufundisha yaliyo tofauti na mafundisho yaliyokubaliwa. Tafsiri hii inaonyesha tofauti hiyo bila kuongeza neno ‘ya uongo,’ ambalo halipo wazi katika kitenzi chenyewe.
- source_word: προσέρχεται
  choice: hashikamani na
  rationale: Ingawa maana ya msingi ni ‘kukaribia,’ hapa kitenzi pamoja na yambwa katika hali ya dative kina wazo la kuyakubali na kujifungamanisha na mafundisho fulani. ‘Hashikamani na’ ni ya asili katika Kiswahili na ina nguvu zaidi kuliko ‘hakubaliani na’ pekee.
- source_word: ὑγιαίνουσι λόγοις
  choice: maneno yenye uzima
  rationale: Tafsiri hii inadumisha sitiari ya afya au hali njema iliyomo katika ὑγιαίνω, huku λόγοις ikitafsiriwa moja kwa moja kuwa ‘maneno.’ ‘Yenye afya’ lingekuwa la moja kwa moja zaidi lakini si la kawaida sana linapotumiwa kuhusu maneno.
- source_word: τοῖς τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: ya Bwana wetu Yesu Masihi
  rationale: Kirai cha umilikaji kinayatambulisha maneno hayo kuwa ya Bwana Yesu au yatokayo kwake. Muundo mfupi ‘ya Bwana wetu’ ni wa kawaida na unaacha upana huo wa uhusiano bila kuufafanua kupita kiasi.
- source_word: Χριστοῦ
  choice: Masihi
  rationale: Χριστός hapa ni cheo chenye maana ya ‘Aliyetiwa Mafuta.’ ‘Masihi’ huhifadhi maana ya cheo hicho badala ya kukitumia kama jina tu.
- source_word: κατ’ εὐσέβειαν
  choice: yanayopatana na maisha ya kumcha Mungu
  rationale: κατά hapa inaonyesha upatano au ulinganifu. Tafsiri hii ni wazi kwa wasomaji wa kawaida na haidai kwa namna isiyo ya lazima kwamba mafundisho hayo ndiyo yanayosababisha uchaji huo.
- source_word: διδασκαλίᾳ
  choice: mafundisho
  rationale: Neno linaweza kumaanisha tendo la kufundisha au yaliyofundishwa. Katika muktadha huu ‘mafundisho’ linaeleweka kwa kawaida kuwa maudhui yanayofundishwa.
- source_word: εὐσέβειαν
  choice: maisha ya kumcha Mungu
  rationale: Kirai hiki kinaeleza kwa Kiswahili cha sasa maisha yenye heshima, uchaji na mwelekeo kwa Mungu. ‘Utauwa’ au ‘uchaji wa Mungu’ pia yanawezekana, lakini yanaweza kuwa ya istilahi zaidi.
theological_decisions:
- issue: Jinsi ya kutafsiri Χριστοῦ katika Ἰησοῦ Χριστοῦ
  choice: Yesu Masihi
  alternative: Yesu Kristo
  rationale: ‘Masihi’ huhifadhi maana ya cheo cha Χριστός katika utambulisho kamili wa Yesu. ‘Kristo,’ ambalo limezoeleka sana kama jina au cheo katika Kiswahili cha kanisa, limeonyeshwa katika tanbihi bila kulifanya kuwa chaguo kuu.
- issue: Uhusiano kati ya mafundisho na εὐσέβεια
  choice: mafundisho yanayopatana na maisha ya kumcha Mungu
  alternative: mafundisho yanayoleta maisha ya kumcha Mungu
  rationale: κατά huonyesha hasa upatano. Chaguo kuu haliongezi dai la kisababishi ambalo linawezekana kimuktadha lakini halijawekwa wazi katika sarufi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa sasa, wenye heshima na unaosomeka kwa urahisi. Sentensi imeachwa na koma mwishoni kwa sababu mstari wa 3 unaendelea kisintaksia katika mstari unaofuata. ‘Maneno yenye uzima’ hudumisha sitiari ya Kigiriki bila kubadili λόγοι kuwa ‘mafundisho.’
