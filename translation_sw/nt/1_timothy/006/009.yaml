id: 1TI.6.9
reference: 1 Timothy 6:9
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οἱ δὲ βουλόμενοι πλουτεῖν ἐμπίπτουσιν εἰς πειρασμὸν καὶ παγίδα καὶ ἐπιθυμίας πολλὰς ἀνοήτους καὶ βλαβεράς, αἵτινες βυθίζουσι τοὺς ἀνθρώπους εἰς ὄλεθρον καὶ ἀπώλειαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/009.yaml
  text: But those who want to be rich fall into temptation[a], a snare, and many foolish and harmful desires[c][b], which plunge people into ruin and destruction.
translation:
  language: sw
  text: Lakini wale wanaotaka kuwa matajiri[a] huanguka katika jaribu, mtego[b], na tamaa nyingi za kipumbavu na zenye kudhuru, ambazo huwazamisha watu[c] katika uharibifu na maangamizi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutajirika.” Kigiriki kinaweza kumaanisha tamaa ya kuwa tajiri, si hali ya kuwa na mali tu.
    reason: lexical_alternative
  - marker: b
    text: Au, “tanzi.”
    reason: lexical_alternative
  - marker: c
    text: Neno la Kigiriki linamaanisha wanadamu kwa ujumla, si wanaume pekee.
    reason: lexical_clarification
lexical_decisions:
- source_word: οἱ δὲ βουλόμενοι
  choice: Lakini wale wanaotaka
  rationale: βούλομαι hapa huonyesha tamaa au nia iliyokita; “wanaotaka” ni Kiswahili cha kawaida kinachohifadhi nguvu ya kishiriki pamoja na kitenzi-jina kinachofuata.
- source_word: πλουτεῖν
  choice: kuwa matajiri
  rationale: Kitenzi hiki kinaweza kumaanisha kuwa au kuwa tajiri; “kuwa matajiri” ni cha asili na hakibani maana kuwa mchakato wa kujipatia utajiri pekee.
- source_word: ἐμπίπτουσιν εἰς
  choice: huanguka katika
  rationale: Huhifadhi sitiari ya kuingia katika hali mbaya bila kukusudia matokeo yake kikamilifu.
- source_word: πειρασμόν
  choice: jaribu
  rationale: Katika onyo hili kuhusu tamaa ya utajiri, neno linaelekea kumaanisha kishawishi cha kutenda mabaya, huku “jaribu” likiwa neno la kawaida la kibiblia linaloweza kubeba maana hiyo.
- source_word: παγίδα
  choice: mtego
  rationale: “Mtego” ni neno la kawaida na wazi kwa kifaa au hali inayomnasa mtu, na huhifadhi sitiari ya Kigiriki.
- source_word: ἐπιθυμίας πολλὰς ἀνοήτους καὶ βλαβεράς
  choice: tamaa nyingi za kipumbavu na zenye kudhuru
  rationale: “Tamaa” huhifadhi maana pana ya hamu kali; “za kipumbavu” na “zenye kudhuru” zinaeleza kwa uwazi kutokuwa na busara na madhara yake.
- source_word: αἵτινες
  choice: ambazo
  rationale: Kiwakilishi hiki kinarejelea “tamaa” na kutambulisha athari yake ya kawaida.
- source_word: βυθίζουσι
  choice: huwazamisha
  rationale: Huhifadhi picha hai ya kusababisha mtu azame, badala ya kupunguza nguvu yake kuwa tu “hupeleka.”
- source_word: τοὺς ἀνθρώπους
  choice: watu
  rationale: ἄνθρωποι hapa inawahusu wanadamu kwa ujumla, si wanaume pekee.
- source_word: ὄλεθρον καὶ ἀπώλειαν
  choice: uharibifu na maangamizi
  rationale: Maneno mawili yanahifadhi mkazo wa jozi ya Kigiriki na uzito wa matokeo, bila kuyafanya yawe istilahi maalumu ya hukumu ya milele.
theological_decisions:
- issue: Je, ὄλεθρον καὶ ἀπώλειαν itafsiriwe kuwa adhabu ya milele hasa?
  choice: uharibifu na maangamizi
  alternative: uharibifu na upotevu wa milele
  rationale: Maneno ya Kigiriki yanaonya kuhusu matokeo mabaya sana, lakini mstari wenyewe hauelezi wazi muda au upeo wake. Tafsiri haiongezi hitimisho maalumu la kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imehifadhi mfululizo na picha hai za “kuanguka,” “mtego,” na “kuzamisha,” huku msamiati ukibaki wazi kwa wasomaji wa kawaida.
