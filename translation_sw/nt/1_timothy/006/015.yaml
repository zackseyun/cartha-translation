  text: ἣν καιροῖς ἰδίοις δείξει ὁ μακάριος καὶ μόνος δυνάστης, ὁ βασιλεὺς τῶν βασιλευόντων καὶ κύριος τῶν κυριευόντων,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/015.yaml
  text: which he will display in his own times—the blessed and only Sovereign[a], the King of those who reign and Lord of those who rule[b],
translation:
  language: sw
  text: ambacho atakakudhihirisha kwa nyakati zake mwenyewe—Mwenye heri, Mtawala pekee,[a] Mfalme wa wale wanaotawala na Bwana wa wale wanaotawala.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Mwenye Enzi pekee.”
    reason: lexical_alternative
  - marker: b
    text: Tafsiri ya kimapokeo ni “Mfalme wa wafalme na Bwana wa mabwana.” Kigiriki kimetumia vishirikishi, kihalisi “Mfalme wa wale wanaotawala na Bwana wa wale wanaotawala.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἣν
  choice: ambako
  rationale: Kiwakilishi hiki cha kike katika Kigiriki kinarejelea ἐπιφάνειαν (‘kutokea’) katika mstari wa 14; ‘ambako’ kinaendeleza rejeo hilo bila kulifanya limrejelee mtu.
- source_word: καιροῖς ἰδίοις
  choice: kwa nyakati alizoziweka yeye mwenyewe
  rationale: Fungu hili linaonyesha nyakati au majira yaliyowekwa kuwa yake; tafsiri hii ni ya asili katika Kiswahili, inadumisha wingi wa Kigiriki, na inaeleza maana ya nyakati alizoziteua bila kuibadili kuwa wakati mmoja.
- source_word: δείξει
  choice: atakufunua
  rationale: Kitenzi hiki humaanisha kuonyesha au kufanya kitu kionekane wazi. Kwa kuwa kinachorejelewa ni kutokea kwake, ‘atakufunua’ ni Kiswahili cha kawaida na chenye nguvu inayofaa.
- source_word: ὁ μακάριος
  choice: yeye aliye mwenye baraka
  rationale: Kivumishi hiki kimetumiwa kama cheo cha Mungu. ‘Mwenye baraka’ ni lugha yenye heshima na pana zaidi kuliko ‘mwenye furaha.’
- source_word: μόνος δυνάστης
  choice: Mtawala pekee
  rationale: δυνάστης ni mwenye mamlaka ya kutawala. ‘Mtawala’ ni wazi na ya sasa, huku ‘pekee’ ikihifadhi upekee unaosisitizwa na μόνος.
- source_word: βασιλεὺς τῶν βασιλευόντων
  choice: Mfalme wa wale wanaotawala
  rationale: Kigiriki kimetumia kitenzi katika umbo la kishirikishi, yaani ‘wale wanaotawala,’ si nomino ‘wafalme.’ Tafsiri hii inadumisha tofauti hiyo.
- source_word: κύριος τῶν κυριευόντων
  choice: Bwana wa wale wenye mamlaka
  rationale: κύριος inadumishwa kuwa ‘Bwana.’ Kishirikishi κυριευόντων huonyesha wale wanaotumia mamlaka; ‘wenye mamlaka’ ni cha asili katika Kiswahili na huepuka urudiaji mzito wa ‘kutawala’ mara mbili.
theological_decisions:
- issue: Utambulisho wa yule atakayefunua kutokea huko
  choice: Mhusika hatajwi kwa jina bali anaachwa atambulishwe na vyeo vilivyomo katika mstari.
  alternative: Kumtaja wazi kuwa Mungu Baba anayefunua kutokea kwa Yesu Kristo.
  rationale: Kigiriki kinamtambulisha mhusika kwa vyeo, si kwa jina maalumu. Tafsiri haiongezi utambulisho wa kimafundisho usiotajwa wazi hapa, ingawa muktadha unaweza kuwaongoza wasomaji kuuelewa hivyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umeunganishwa na mstari wa 14 kwa kuwa mstari wa 15 unaanza katikati ya sentensi. Alama zote za tanbihi [a] na [b] zimewekwa katika matini kuu.
