id: 1TI.6.2
reference: 1 Timothy 6:2
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οἱ δὲ πιστοὺς ἔχοντες δεσπότας μὴ καταφρονείτωσαν, ὅτι ἀδελφοί εἰσιν· ἀλλὰ μᾶλλον δουλευέτωσαν, ὅτι πιστοί εἰσιν καὶ ἀγαπητοὶ οἱ τῆς εὐεργεσίας ἀντιλαμβανόμενοι. Ταῦτα δίδασκε καὶ παρακάλει.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/002.yaml
  text: And those who have believing masters must not despise them because they are brothers[a]; rather, they must serve them all the more, because those who partake of the benefit are believers and beloved[b]. Teach and urge these things.
translation:
  language: sw
  text: Wale walio na mabwana waamini wasiwadharau kwa sababu ni ndugu[a]. Badala yake, wazidi kuwatumikia, kwa sababu wanaopokea manufaa ni waamini na wapendwa[b]. Fundisha na uhimize mambo haya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki kimetumia neno la wingi wa kiume, “ndugu”; katika matumizi ya Kikristo neno hilo linaweza kumaanisha waamini wenzao.
    reason: lexical_alternative
  - marker: b
    text: Kifungu “wanaopokea manufaa” ni kigumu. Yaelekea zaidi kuwa kinawarejelea mabwana waamini kama wanaonufaika na huduma ya watumwa; tafsiri nyingine zinawezekana.
    reason: alternative_reading
lexical_decisions:
- source_word: πιστοὺς
  choice: waamini
  rationale: Katika muktadha huu kivumishi kinawatambulisha mabwana kuwa watu wanaomwamini Kristo, si kuwa tu waaminifu au wenye kutegemeka.
- source_word: δεσπότας
  choice: mabwana
  rationale: Neno hili huonyesha wenye mamlaka juu ya watumwa; “mabwana” ni neno la kawaida na lenye heshima katika Kiswahili bila kuificha hali ya kijamii inayozungumziwa.
- source_word: καταφρονείτωσαν
  choice: wasiwadharau
  rationale: “Kudharau” hubeba maana ya kuwaona wengine kuwa duni na kuwatendea kwa dharau, hivyo linaonyesha nguvu ya katazo.
- source_word: ἀδελφοί
  choice: ndugu
  rationale: “Ndugu” ni neno la kawaida la Kiswahili kwa uhusiano wa kifamilia na pia kwa waamini wenzao; linaweza kutumiwa kwa jinsia zote, huku tanbihi ikitaja umbo la Kigiriki.
- source_word: μᾶλλον δουλευέτωσαν
  choice: wazidi kuwatumikia
  rationale: Tafsiri hii inahifadhi wazo la μᾶλλον, yaani kuongeza bidii ya huduma, na maana ya δουλεύω katika hali ya utumwa bila tungo isiyo ya kawaida.
- source_word: πιστοί
  choice: waamini
  rationale: Hapa neno linatumika kama nomino kwa wale wanaomwamini Kristo.
- source_word: ἀγαπητοὶ
  choice: wapendwa
  rationale: “Wapendwa” huhifadhi uzito wa upendo wa kindugu katika jumuiya ya Kikristo.
- source_word: οἱ τῆς εὐεργεσίας ἀντιλαμβανόμενοι
  choice: wanaopokea manufaa ya huduma hiyo
  rationale: Tungo ya Kigiriki imebanwa na ina utata. Kiswahili hiki kinaeleweka, huku kikionyesha usomaji unaowachukulia mabwana waamini kuwa wanufaika wa huduma; tanbihi inahifadhi ugumu wa kifungu.
- source_word: Ταῦτα δίδασκε καὶ παρακάλει
  choice: Fundisha na kusisitiza mambo haya
  rationale: “Fundisha” na “kusisitiza” zinaonyesha amri endelevu kwa Timotheo; παρακαλέω hapa ina nguvu ya kuhimiza kwa msisitizo.
theological_decisions:
- issue: Maana ya ἀδελφοί katika jumuiya ya waamini
  choice: ndugu
  alternative: ndugu wa kiume; ndugu wa kiume na wa kike
  rationale: Neno la Kiswahili “ndugu” ni la asili na linaweza kumaanisha waamini wenzao bila kulazimisha jinsia, lakini tanbihi inaweka wazi kwamba Kigiriki kimetumia umbo la wingi wa kiume.
- issue: Istilahi ya hadhi ya kijamii katika muktadha wa utumwa
  choice: mabwana ... kuwatumikia
  alternative: wamiliki ... kuwatumikia; mabwana ... kuwa watumwa wao
  rationale: “Mabwana” huakisi δεσπόται, na “kuwatumikia” huwasilisha δουλεύω kwa Kiswahili cha kawaida. Hii haifichi muktadha wa utumwa wala kuongeza nomino “watumwa,” ambayo haitokei katika mstari wenyewe.
- issue: Rejeo la οἱ τῆς εὐεργεσίας ἀντιλαμβανόμενοι
  choice: wanaopokea manufaa ni mabwana waamini
  alternative: watumwa waamini ndio wanaoshiriki katika tendo jema; pande zote mbili zinashiriki manufaa
  rationale: Muktadha na rejeo la karibu vinaunga mkono kuwachukulia mabwana waamini kuwa wanufaika wa huduma iliyoongezwa, lakini kwa kuwa tungo ya Kigiriki ni ngumu na imejadiliwa, tanbihi inakiri uwezekano mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni wazi kwa msomaji wa kawaida, huku ikihifadhi muktadha wa utumwa, uhusiano wa waamini, na utata wa kishazi cha mwisho.
