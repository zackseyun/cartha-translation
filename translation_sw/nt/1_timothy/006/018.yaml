  text: watende mema, wawe matajiri katika matendo mema, wawe wakarimu na tayari kushiriki walivyo navyo,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαθοεργεῖν
  choice: watende mema
  rationale: Kauli hii inaendeleza jambo linaloamriwa katika muktadha. “Watende mema” ni Kiswahili cha kawaida na chenye heshima kinachohifadhi nguvu ya kitenzi bila kubadili maana kuwa nomino.
- source_word: πλουτεῖν
  choice: wawe matajiri
  rationale: Kitenzi kimetumiwa kisitiari pamoja na “katika matendo mema.” Tafsiri hii inadumisha taswira ya utajiri na tofauti iliyokusudiwa na utajiri wa mali katika muktadha unaozunguka.
- source_word: ἐν ἔργοις καλοῖς
  choice: katika matendo mema
  rationale: Kirai hiki kinaonyesha eneo ambamo wanapaswa kuwa matajiri. “Matendo mema” ni usemi wa sasa, unaoeleweka, na unaofaa katika nyaraka za kichungaji.
- source_word: εὐμεταδότους
  choice: wakarimu
  rationale: Kivumishi hiki kinaeleza utayari wa kutoa au kugawa rasilimali. “Wakarimu” kinatoa maana hiyo kwa ufupi na kwa Kiswahili cha kawaida.
- source_word: κοινωνικούς
  choice: tayari kushiriki walivyo navyo
  rationale: Neno hili linaonyesha mwelekeo wa kushiriki na wengine. Kuongeza “walivyo navyo” kunaweka wazi maana ya kushiriki rasilimali katika muktadha, bila kupunguza wazo la utayari.
- source_word: εὐμεταδότους εἶναι, κοινωνικούς
  choice: wawe wakarimu na tayari kushiriki walivyo navyo
  rationale: 'Vivumishi hivi vinahusiana kwa karibu lakini si marudio kamili: cha kwanza kinakazia ukarimu wa kutoa, na cha pili utayari wa kuwashirikisha wengine. Tafsiri inadumisha mawazo yote mawili kwa mtiririko wa asili.'
