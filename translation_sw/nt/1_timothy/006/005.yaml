  yaml_path: translation/nt/1_timothy/006/005.yaml
  text: constant friction among people whose minds are corrupted and who have been deprived of the truth[b][a], imagining that godliness is a means of gain.
translation:
  language: sw
  text: misuguano ya daima[a] kati ya watu ambao akili zao zimeharibika na ambao wamenyimwa kweli, wakidhani kwamba kumcha Mungu ni njia ya kujipatia faida.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mabishano ya daima” au “migogoro isiyokoma.” Neno la Kigiriki linatoa picha ya watu wanaoendelea kusuguana.
    reason: lexical_alternative
  - marker: b
    text: Au “kumcha Mungu ni faida” au “ni chanzo cha faida.” Maana ni kwamba wanauchukulia kumcha Mungu kuwa kitu cha kutumia ili kujipatia manufaa.
    reason: lexical_alternative
lexical_decisions:
- source_word: διαπαρατριβαὶ
  choice: misuguano ya daima
  rationale: Neno hilo linaonyesha hali ya kuendelea kusuguana, na kwa maana ya picha, migogoro au mabishano yasiyokoma. “Misuguano ya daima” inahifadhi picha hiyo kwa Kiswahili cha kawaida.
- source_word: διεφθαρμένων
  choice: zimeharibika
  rationale: Kauli hii inaonyesha hali iliyotokana na kuharibiwa. “Akili zao zimeharibika” ni ya asili katika Kiswahili na inadumisha hukumu ya kimaadili bila kuitia nguvu kupita kiasi.
- source_word: τὸν νοῦν
  choice: akili zao
  rationale: νοῦς hapa inahusu uwezo wa kufikiri na kutambua kwa upande wa kiakili na kimaadili; “akili zao” ni usemi wa kawaida na wazi.
- source_word: ἀπεστερημένων
  choice: wamenyang’anywa
  rationale: Kitenzi kinaweza kumaanisha kunyima au kupokonya. “Wamenyang’anywa kweli” kinaonyesha hasara iliyotokea na hali inayoendelea, huku kikihifadhi nguvu ya usemi wa Kigiriki.
- source_word: τῆς ἀληθείας
  choice: kweli
  rationale: Katika Kiswahili, “kweli” haihitaji kibainishi ili kurejelea kweli mahsusi inayozungumziwa katika muktadha.
- source_word: νομιζόντων
  choice: wakidhani
  rationale: “Wakidhani” huonyesha imani yao potovu bila kulazimisha maelezo ya ziada ndani ya matini.
- source_word: πορισμὸν
  choice: njia ya kujipatia faida
  rationale: Neno hili linaweza kumaanisha faida au njia ya kupata faida. Tafsiri hii inaonyesha wazi kwamba wanatumia uchaji kama chombo cha kujinufaisha.
- source_word: εὐσέβειαν
  choice: kumcha Mungu
  rationale: Katika Nyaraka za Kichungaji, neno hili humaanisha maisha ya uchaji yanayoelekezwa kwa Mungu. “Kumcha Mungu” ni usemi wa asili, wenye heshima, na unaoeleweka kwa wasomaji wa kawaida.
theological_decisions:
- issue: Iwapo εὐσέβεια ionyeshe uchaji wa kweli au dini ya nje tu
  choice: kumcha Mungu
  alternative: dini; uchaji
  rationale: Neno la Kigiriki lenyewe lina maana chanya; kosa liko katika kulitumia kama njia ya faida. Kwa hiyo tafsiri haijalifanya limaanishe ibada ya nje tu.
- issue: Kiwango cha nguvu ya διεφθαρμένων katika kueleza hali ya kimaadili
  choice: akili zao zimeharibika
  alternative: waliopotoka akili; wenye akili zilizofisidika
  rationale: Chaguo hili linahifadhi hukumu kali ya kifungu bila kuingiza istilahi nzito zaidi ya maana ya neno la Kigiriki.
- issue: Aina ya faida inayokusudiwa na πορισμός
  choice: faida, bila kuitaja moja kwa moja kuwa ya mali
  alternative: faida ya mali
  rationale: Muktadha unaelekea kwenye manufaa ya kimwili, lakini neno lenyewe halitaji mali moja kwa moja. Matini inahifadhi upana huo, na tanbihi inaeleza maana inayodokezwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo unaendelea kisarufi kutoka mistari iliyotangulia, kama ilivyo katika chanzo. “Misuguano” huhifadhi picha ya Kigiriki, huku tanbihi ikitoa visawe vya kawaida zaidi.
