source:
  edition: SBLGNT
  text: Ὦ Τιμόθεε, τὴν παραθήκην φύλαξον, ἐκτρεπόμενος τὰς βεβήλους κενοφωνίας καὶ ἀντιθέσεις τῆς ψευδωνύμου γνώσεως,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/020.yaml
  text: O Timothy[a], guard the deposit entrusted to you[b], turning away from the profane empty talk and contradictions of what is falsely called knowledge.
translation:
  language: sw
  text: Ee Timotheo, ilinde amana uliyokabidhiwa. Jiepushe na mazungumzo matupu yasiyo ya utauwa, na hoja pinzani[a] za kile kinachoitwa kwa jina la uongo “maarifa.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “upinzani” au “madai yanayopingana.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kile kinachoitwa ‘maarifa.’”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὦ Τιμόθεε
  choice: Ee Timotheo
  rationale: “Ee” huhifadhi uzito wa mwito wa moja kwa moja unaoletwa na Ὦ, huku ikiwa ya asili na yenye staha katika Kiswahili.
- source_word: παραθήκην
  choice: amana uliyokabidhiwa
  rationale: “Amana” huhifadhi taswira ya kitu kilichowekwa kwa mtu ili akitunze, na “uliyokabidhiwa” huifanya maana hiyo iwe wazi kwa msomaji wa kawaida bila kutaja kwa uhakika yaliyomo katika amana hiyo.
- source_word: φύλαξον
  choice: ilinde
  rationale: Kitenzi hiki kinaonyesha utunzaji wa makini na ulinzi wa kitu kilichokabidhiwa, si kukiweka tu.
- source_word: ἐκτρεπόμενος
  choice: jiepushe na
  rationale: Uchaguzi huu unawasilisha maana ya kugeuka na kuacha kushughulika na mambo yanayotajwa, kwa Kiswahili cha kawaida na cha moja kwa moja.
- source_word: βεβήλους
  choice: yasiyo matakatifu
  rationale: Huhifadhi utofauti kati ya kilicho kitakatifu na kilicho cha kawaida au kisicho na utakatifu, bila kuongeza wazo pana zaidi lisilotajwa moja kwa moja.
- source_word: κενοφωνίας
  choice: maneno matupu
  rationale: Huwasilisha kwa lugha rahisi dhana ya usemi usio na maana au faida, huku ikihifadhi ukali wa tathmini ya mwandishi.
- source_word: ἀντιθέσεις
  choice: madai yanayopingana
  rationale: Neno linaweza kumaanisha upinzani, hoja pinzani, au kauli zinazokinzana. “Madai yanayopingana” linaeleweka kwa urahisi na huhifadhi wazo la kauli zilizowekwa dhidi ya nyingine.
- source_word: τῆς ψευδωνύμου γνώσεως
  choice: ya kile kinachoitwa kwa uongo “maarifa”
  rationale: Huweka wazi kwamba jina “maarifa” linapingwa kuwa si jina la kweli la jambo linalotajwa, bila kubainisha zaidi mafundisho hayo ni nini.
theological_decisions:
- issue: Maana halisi ya παραθήκη katika muktadha
  choice: “amana uliyokabidhiwa,” bila kutaja yaliyomo katika amana hiyo
  alternative: “ujumbe wa Injili,” “mafundisho ya mitume,” au “jukumu la huduma ya Timotheo”
  rationale: Muktadha unaweza kuelekeza kwenye ujumbe au mafundisho ya kitume, lakini mstari wenyewe hauyataji wazi. Tafsiri inadumisha upana na taswira ya neno la Kigiriki.
- issue: Uhusiano wa ἀντιθέσεις na ψευδωνύμου γνώσεως
  choice: “madai yanayopingana … ya kile kinachoitwa kwa uongo ‘maarifa’”
  alternative: Kutafsiri ἀντιθέσεις kama jina rasmi la mfumo maalumu wa mafundisho
  rationale: Muundo wa Kigiriki unaunganisha madai au upinzani huo na kile kinachoitwa kwa uongo maarifa, lakini hautoshi kuthibitisha kwamba “Antitheses” ni jina rasmi la maandishi au mfumo fulani. Tafsiri haingizi utambulisho huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye staha lakini kinachoeleweka kwa wasomaji wa kawaida. “Ee Timotheo” inadumisha uzito wa mwito; “amana” huhifadhi sitiari ya kitu kilichokabidhiwa kwa ulinzi. Alama za tanbihi zimewekwa baada ya vifungu vinavyohusika.
