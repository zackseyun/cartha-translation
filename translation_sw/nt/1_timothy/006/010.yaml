  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ῥίζα γὰρ πάντων τῶν κακῶν ἐστιν ἡ φιλαργυρία, ἧς τινες ὀρεγόμενοι ἀπεπλανήθησαν ἀπὸ τῆς πίστεως καὶ ἑαυτοὺς περιέπειραν ὀδύναις πολλαῖς.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/010.yaml
  text: For the love of money is a root of all kinds of evils[a]; by craving it[c][b], some have wandered away from the faith and pierced themselves with many pains.
translation:
  language: sw
  text: Kwa maana kupenda fedha ni mzizi wa maovu ya kila aina.[a] Watu fulani, kwa kuitamani, wamepotoka na kuiacha imani[b] na wamejidungia maumivu mengi.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kama ilivyotafsiriwa kwa mapokeo, “kupenda fedha ndiyo mzizi wa uovu wote.” Kigiriki kinaelekea zaidi kuruhusu maana ya “mzizi wa maovu ya kila aina,” bila kudokeza kwamba kila uovu una chanzo kimoja tu.
    reason: alternative_reading
  - marker: b
    text: Au “wamepotoka kutoka katika imani.” Hapa “imani” huenda inarejelea imani ya Kikristo kama mafundisho yanayoaminiwa; pia inaweza kueleweka kama imani ya mtu binafsi.
    reason: lexical_alternative
  - marker: c
    text: Au “wamejidungia huzuni nyingi” au “machungu mengi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥίζα
  choice: mzizi
  rationale: Nomino ῥίζα haina kibainishi na ni kiarifu kabla ya kitenzi; Kiswahili hakina kibainishi kisicho dhahiri kama “a,” hivyo wazo la kutokuwa mzizi pekee linaonyeshwa kwa muundo mzima “mzizi wa maovu ya kila aina.”
- source_word: πάντων τῶν κακῶν
  choice: wa maovu ya kila aina
  rationale: Huwasilisha kwa kawaida upana wa wingi wa κακῶν bila kudai kwamba kila uovu bila ubaguzi hutokana na chanzo hiki kimoja.
- source_word: φιλαργυρία
  choice: kupenda fedha
  rationale: Huhifadhi maana ya wazi ya kupenda pesa/fedha badala ya neno pana zaidi “tamaa,” na ni Kiswahili cha kawaida kinachoeleweka.
- source_word: ὀρεγόμενοι
  choice: kwa kuitamani
  rationale: Hutoa wazo la kuelekea kwa hamu kubwa na pia uhusiano wa kisababishi au kimazingira kati ya tamaa hiyo na kupotoka.
- source_word: ἀπεπλανήθησαν ἀπὸ τῆς πίστεως
  choice: wamepotoka na kuiacha imani
  rationale: Muundo huu wa kawaida wa Kiswahili huhifadhi picha ya kuondoka katika njia au msimamo wa awali, huku “imani” ikibaki na uwezekano wa kurejelea imani ya Kikristo.
- source_word: περιέπειραν
  choice: wamejichoma wenyewe
  rationale: Huhifadhi taswira kali ya kujitoboa au kujichoma bila kutumia neno la nadra lisiloeleweka kwa urahisi.
- source_word: ὀδύναις πολλαῖς
  choice: kwa maumivu mengi
  rationale: “Maumivu” yanaweza kujumuisha mateso ya ndani, huzuni, na uchungu, hivyo yanahifadhi upana wa ὀδύνη.
theological_decisions:
- issue: Upeo wa dai kuhusu kupenda fedha na maovu
  choice: Kupenda fedha ni chanzo cha maovu ya kila aina, si lazima chanzo pekee cha kila uovu bila ubaguzi.
  alternative: Kupenda fedha ndiyo mzizi wa uovu wote.
  rationale: Kutokuwapo kwa kibainishi kwa ῥίζα na wingi πάντων τῶν κακῶν huunga mkono tafsiri isiyofanya dai kuwa la jumla kupita kiasi; Kiswahili kinaonyesha hilo kwa “maovu ya kila aina.”
- issue: Maana ya τῆς πίστεως
  choice: “Imani” ya Kikristo, yaani imani inayoungamwa na jumuiya ya waamini.
  alternative: Imani kama tendo la mtu binafsi la kumtumaini Mungu.
  rationale: Kibainishi cha Kigiriki na matumizi katika Nyaraka za Kichungaji yanaelekeza zaidi kwenye maana ya imani ya Kikristo, lakini tanbihi inadumisha uwezekano wa maana ya imani binafsi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa kawaida kwa wasomaji wengi, huku taswira za “mzizi,” “kupotoka,” na “kujichoma” zikihifadhiwa. Alama zote za tanbihi [a], [b], na [c] zimetumika katika matini.
