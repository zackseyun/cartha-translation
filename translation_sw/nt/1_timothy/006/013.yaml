id: 1TI.6.13
reference: 1 Timothy 6:13
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: παραγγέλλω σοι ἐνώπιον τοῦ θεοῦ τοῦ ⸀ζῳογονοῦντος τὰ πάντα καὶ Χριστοῦ Ἰησοῦ τοῦ μαρτυρήσαντος ἐπὶ Ποντίου Πιλάτου τὴν καλὴν ὁμολογίαν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/013.yaml
  text: I charge you before God[a], who gives life to all things, and Messiah Jesus, who testified to the good confession before Pontius Pilate[c][b],
translation:
  language: sw
  text: Ninakuagiza mbele za Mungu[a], anayevipa vitu vyote uhai, na mbele za Masihi Yesu[b], aliyetoa ushuhuda wa ungamo jema mbele ya Pontio Pilato[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “anayevifanya vitu vyote viendelee kuwa hai,” au “anayevihuisha vitu vyote.” Neno la Kigiriki linaweza kusisitiza kuhifadhi uhai au kutoa uhai.
    reason: lexical_alternative
  - marker: b
    text: Au “Kristo Yesu.” Neno la Kigiriki Χριστός ni cheo chenye maana ya “Masihi.”
    reason: alternative_reading
  - marker: c
    text: Au “aliyelishuhudia ungamo jema wakati wa Pontio Pilato,” au “chini ya Pontio Pilato.”
    reason: source_ambiguity
lexical_decisions:
- source_word: παραγγέλλω σοι
  choice: Ninakuagiza
  rationale: Kitenzi hiki kinatoa agizo zito na rasmi kwa mtu mmoja; “ninakuagiza” ni cha kawaida na chenye uzito unaofaa katika Kiswahili.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: mbele za Mungu
  rationale: Kauli hii huhifadhi maana ya kutoa agizo katika uwepo wa Mungu na ina mtindo wa heshima unaoeleweka.
- source_word: ζῳογονοῦντος τὰ πάντα
  choice: anayevipa vitu vyote uhai
  rationale: ζῳογονέω inaweza kumaanisha kutoa uhai, kuhuisha, au kuhifadhi hai. Tafsiri hii ya msingi ni pana na ya asili bila kuifungia maana katika mojawapo tu ya vivuli hivyo.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Masihi Yesu
  rationale: Χριστός ni cheo chenye maana ya Masihi; katika muktadha huu rasmi na wa kiungamo, nguvu yake kama cheo bado iko wazi.
- source_word: μαρτυρήσαντος
  choice: aliyetoa ushuhuda
  rationale: Kauli hii ni ya asili katika Kiswahili na hudumisha wazo la ushuhuda wa wazi, pamoja na ladha ya kimahakama katika muktadha wa Pilato.
- source_word: τὴν καλὴν ὁμολογίαν
  choice: wa ungamo jema
  rationale: “Ungamo” huhifadhi wazo la kukiri au kutangaza wazi, na “jema” hutafsiri καλὴν bila kuondoa uhusiano wake na ungamo la Timotheo katika muktadha unaozunguka.
- source_word: ἐπὶ Ποντίου Πιλάτου
  choice: mbele ya Pontio Pilato
  rationale: Pamoja na kitenzi cha kushuhudia, hii inaeleweka kwa kawaida kama ushuhuda uliotolewa mbele ya Pilato. Maana nyingine inayowezekana ya ἐπί imehifadhiwa katika tanbihi.
theological_decisions:
- issue: Maana ya ζῳογονοῦντος
  choice: anayevipa vitu vyote uhai
  alternative: anayevifanya vitu vyote viendelee kuwa hai; anayevihuisha vitu vyote
  rationale: Neno la Kigiriki linaweza kusisitiza kutoa uhai au kuhifadhi uhai. Tafsiri kuu inabaki pana, na tanbihi inalinda mvutano huo wa kimaana.
- issue: Tafsiri ya Χριστός
  choice: Masihi Yesu
  alternative: Kristo Yesu
  rationale: “Masihi” huonyesha wazi kuwa Χριστός ni cheo, bila kuingiza fundisho la dhehebu fulani.
- issue: Uhusiano wa μαρτυρήσαντος na ὁμολογίαν
  choice: aliyetoa ushuhuda wa ungamo jema
  alternative: aliyelishuhudia ungamo jema
  rationale: Kigiriki kina ὁμολογίαν kama yambwa ya moja kwa moja, lakini Kiswahili cha kawaida huhitaji muundo unaoeleza kutoa ushuhuda. Njia ya karibu zaidi na umbo la Kigiriki imetajwa katika tanbihi.
- issue: Maana ya ἐπὶ Ποντίου Πιλάτου
  choice: mbele ya Pontio Pilato
  alternative: wakati wa Pontio Pilato; chini ya Pontio Pilato
  rationale: Muktadha wa ushuhuda unaunga mkono “mbele ya,” lakini kihusishi ἐπί pamoja na hali ya umilikishi kinaweza pia kuwa na maana ya wakati au utawala; uwezekano huo umetajwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye heshima na uzito wa agizo rasmi lakini kinachoeleweka kwa wasomaji wa kawaida. “Mbele za Mungu” ni usemi wa kawaida wa Kiswahili kwa uwepo wa Mungu; “mbele ya Pontio Pilato” hutofautisha mazingira ya kesi. Sentensi imeachwa na koma kwa sababu mstari unaendelea katika mstari unaofuata.
