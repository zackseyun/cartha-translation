base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/007.yaml
  text: For we brought nothing into the world[a], and we are not able to carry anything out.
translation:
  language: sw
  text: Kwa maana hatukuleta kitu chochote ulimwenguni[a], wala hatuwezi kutoa kitu chochote humo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa kufuata muundo wa Kigiriki kwa ukaribu zaidi: “Kwa maana hatukuleta kitu chochote ulimwenguni, kwa sababu hatuwezi pia kutoa kitu chochote humo.” Kiunganishi cha Kigiriki kinaweza kueleweka kuwa “kwa sababu,” au kuwa kinaanzisha kauli ya pili inayolingana na ya kwanza.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδὲν
  choice: kitu chochote
  rationale: Katika muundo hasi ‘hatukuleta kitu chochote’ ni Kiswahili cha kawaida kinachohifadhi ukanushaji kamili.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Huonyesha msingi au maelezo ya kauli iliyotangulia.
- source_word: εἰσηνέγκαμεν
  choice: hatukuleta
  rationale: Kitenzi εἰσφέρω humaanisha kuleta ndani; pamoja na ‘ulimwenguni’ kinaonyesha kuingia kwetu duniani bila mali.
- source_word: εἰς τὸν κόσμον
  choice: ulimwenguni
  rationale: Hurejelea ulimwengu ambao mwanadamu huingia kwa kuzaliwa; umbo hili ni la asili katika Kiswahili.
- source_word: ὅτι
  choice: wala
  rationale: Katika usemi huu wa vipashio viwili vinavyolingana, ‘wala’ huunganisha kwa kawaida kauli hasi ya pili, huku uwezekano wa maana ya kisababishi ukihifadhiwa katika tanbihi.
- source_word: οὐδὲ
  choice: wala ... kitu chochote
  rationale: Huendeleza ukanushaji wa kauli ya kwanza na kuonyesha kwamba hakuna chochote kinachoweza kutolewa.
- source_word: ἐξενεγκεῖν
  choice: kutoa ... humo
  rationale: Huhifadhi mwelekeo wa kupeleka nje ya ulimwengu; ‘humo’ hutaja tena ulimwengu bila urudiaji mzito.
- source_word: τι
  choice: kitu chochote
  rationale: Chini ya ukanushaji, hili ndilo tamko la kawaida la Kiswahili kwa kiwakilishi kisichobainisha kitu.
- source_word: δυνάμεθα
  choice: hatuwezi
  rationale: Ni tafsiri ya moja kwa moja, ya sasa, na ya kawaida ya δύναμαι katika ukanushaji.
theological_decisions:
- issue: Maana ya ὅτι inayoanzisha kishazi cha pili
  choice: 'Kiunganishi cha kauli ya pili inayolingana: ‘wala’'
  alternative: 'Kishazi cha sababu: ‘kwa sababu hatuwezi pia kutoa kitu chochote humo’'
  rationale: Muktadha una usemi wa kimethali wenye kauli mbili zinazolingana—hakuna kilicholetwa ndani na hakuna kinachoweza kutolewa nje. Hata hivyo, ὅτι inaweza kueleweka kwa maana ya sababu, kwa hiyo uwezekano huo umeonyeshwa katika tanbihi badala ya kuondolewa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Kwa maana’ hudumisha uhusiano na mstari uliotangulia; ‘wala’ huleta uwiano wa kimethali kwa lugha ya kawaida. ‘Humo’ huepuka kurudia ‘ulimwenguni’ huku ikidumisha picha ya kuingia na kutoka.
