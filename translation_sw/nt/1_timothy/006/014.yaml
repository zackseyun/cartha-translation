  text: τηρῆσαί σε τὴν ἐντολὴν ἄσπιλον ἀνεπίλημπτον μέχρι τῆς ἐπιφανείας τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/014.yaml
  text: that you keep the commandment unstained and above reproach until the appearing of our Lord Jesus the Messiah[c][b][a],
translation:
  language: sw
  text: Uishike amri bila doa na bila lawama[b] mpaka atakapotokea Bwana wetu Yesu Masihi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yesu Kristo.” Neno la Kigiriki Χριστός linaweza kutumiwa kama cheo chenye maana ya “Masihi” au kama umbo la jadi linalofanana zaidi na jina, “Kristo.”
    reason: alternative_reading
  - marker: b
    text: Maneno “bila doa na bila lawama” yanaweza kueleweka kuwa yanaieleza amri yenyewe au namna Timotheo anavyopaswa kuishika; usemi wa Kigiriki umebanwa na hauamui uhusiano huo kwa uwazi kabisa.
    reason: lexical_alternative
lexical_decisions:
- source_word: τηρῆσαί
  choice: uishike
  rationale: Kitenzi “kushika” ni cha kawaida katika Kiswahili kwa maana ya kutii na kudumisha uaminifu kwa amri; hapa pia kinaendana na muundo unaotegemea agizo la mstari uliotangulia.
- source_word: τὴν ἐντολὴν
  choice: amri
  rationale: “Amri” ni tafsiri ya moja kwa moja, ya kawaida na yenye uzito unaofaa kwa ἐντολή bila kulazimisha maana finyu ya maagizo yaliyotangulia pekee.
- source_word: ἄσπιλον
  choice: bila doa
  rationale: Neno hili humaanisha kutokuwa na waa au uchafu. “Bila doa” ni usemi wa asili na wenye hadhi katika Kiswahili.
- source_word: ἀνεπίλημπτον
  choice: bila lawama
  rationale: Usemi huu huonyesha hali isiyotoa msingi halali wa kulaumiwa; “bila lawama” ni wazi na wa kawaida.
- source_word: μέχρι τῆς ἐπιφανείας
  choice: mpaka atakapotokea
  rationale: Muundo wa kitenzi ni wa asili zaidi katika Kiswahili kuliko nomino nzito kama “mpaka kutokea kwa,” huku ukihifadhi rejeo la kuonekana kwa Kristo wakati ujao bila kuongeza wazi wazo la “mara ya pili.”
- source_word: τοῦ κυρίου ἡμῶν
  choice: Bwana wetu
  rationale: Huhifadhi cheo cha kikristo κύριος na kiwakilishi cha pamoja “wetu.”
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesu Masihi
  rationale: “Yesu” ni jina, na “Masihi” huwasilisha maana ya cheo Χριστός kwa uwazi katika muktadha huu wa kutokea kwake wakati ujao.
theological_decisions:
- issue: Uhusiano wa ἄσπιλον na ἀνεπίλημπτον na “amri” au kitendo cha kuishika
  choice: Muundo mfupi “uishike amri bila doa na bila lawama”
  alternative: “uishike amri, wewe mwenyewe ukiwa bila doa na bila lawama” au “uilinde amri hiyo iwe bila doa na bila lawama”
  rationale: Vivumishi vya Kigiriki vinakubaliana kisarufi na “amri,” lakini usemi uliobanwa unaweza kueleweka pia kuhusu namna Timotheo anavyoishika. Tafsiri kuu haiongezi maneno yanayolazimisha upande mmoja; tanbihi inaeleza mvutano huo.
- issue: Tafsiri ya Χριστοῦ
  choice: Masihi
  alternative: Kristo
  rationale: Katika kauli hii nzito kuhusu kutokea kwake wakati ujao, maana ya cheo cha Mtiwa-Mafuta bado inasikika. “Masihi” huiweka wazi, huku “Kristo” ikiwa namna ya jadi inayowezekana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kitenzi “mpaka atakapotokea” umechaguliwa kwa uasilia wa Kiswahili, na sentensi imeachwa fupi ili ihifadhi msisitizo wa agizo la Kigiriki.
