id: 1TI.6.1
reference: 1 Timothy 6:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ὅσοι εἰσὶν ὑπὸ ζυγὸν δοῦλοι, τοὺς ἰδίους δεσπότας πάσης τιμῆς ἀξίους ἡγείσθωσαν, ἵνα μὴ τὸ ὄνομα τοῦ θεοῦ καὶ ἡ διδασκαλία βλασφημῆται.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/001.yaml
  text: All who are servants under a yoke should regard their own masters as worthy of all honor[c][b][a], so that the name of God and the teaching may not be slandered.
translation:
  language: sw
  text: Wote walio watumwa chini ya nira[a] na wawahesabu mabwana wao kuwa wanastahili heshima yote, ili jina la Mungu na fundisho[b] visitukanwe.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watumishi”; Kigiriki δοῦλοι. Hapa “watumwa” limetumiwa kwa sababu kirai “chini ya nira” kinaonyesha wazi hali ya utumwa.
    reason: alternative_reading
  - marker: b
    text: Au “doktrini.”
    reason: lexical_alternative
  - marker: c
    text: Au “visemwe kwa dharau.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλοι
  choice: watumwa
  rationale: “Watumwa” huonyesha hali ya utumwa inayowekwa wazi zaidi na kirai “chini ya nira”; “watumishi” kingepunguza uzito wa hali hiyo.
- source_word: ὑπὸ ζυγὸν
  choice: chini ya nira
  rationale: Tafsiri hii inahifadhi sitiari ya kutiishwa na kufungwa iliyomo katika Kigiriki.
- source_word: δεσπότας
  choice: mabwana
  rationale: Katika muktadha huu neno linamaanisha wenye mamlaka juu ya watumwa; “mabwana” ni la kawaida na la kimuktadha kuliko “wamiliki” pekee.
- source_word: ἰδίους
  choice: wao wenyewe
  rationale: Inahifadhi wazo la mabwana wao hususa, si mabwana kwa ujumla.
- source_word: πάσης τιμῆς ἀξίους
  choice: wanastahili heshima yote
  rationale: Huwasilisha kwa Kiswahili cha kawaida wazo la kustahili heshima kamili.
- source_word: ἡγείσθωσαν
  choice: wawahesabu ... kuwa
  rationale: Inaonyesha tathmini au mtazamo unaoamriwa na kitenzi cha Kigiriki.
- source_word: τὸ ὄνομα τοῦ θεοῦ
  choice: jina la Mungu
  rationale: Tafsiri ya moja kwa moja inayohifadhi dhana ya utambulisho na sifa ya Mungu.
- source_word: ἡ διδασκαλία
  choice: mafundisho
  rationale: Ni neno la Kiswahili linaloeleweka kwa urahisi na lisilo na uzito wa istilahi maalumu kuliko “doktrini.”
- source_word: βλασφημῆται
  choice: yasitukanwe
  rationale: “Kutukanwa” linaweza kutumika kwa jina la Mungu na kwa mafundisho, na linaonyesha kunenewa kwa dharau au matusi.
- source_word: Ὅσοι εἰσὶν
  choice: Wote walio
  rationale: Hutoa kwa Kiswahili cha kawaida maana jumuishi ya kirai cha Kigiriki.
theological_decisions:
- issue: Tafsiri ya δοῦλοι katika muktadha nyeti wa kijamii na kimaadili
  choice: watumwa
  alternative: watumishi
  rationale: Kirai “chini ya nira” kinaonyesha wazi hali ya utumwa. Tafsiri inaeleza hali ya kijamii inayodhaniwa na maandishi bila kuidhinisha utumwa.
- issue: Tafsiri ya ἡ διδασκαλία
  choice: mafundisho
  alternative: fundisho au doktrini
  rationale: “Mafundisho” huhifadhi maana ya ujumbe unaofundishwa bila kuingiza kwa lazima maana za baadaye za kitaalamu za kidini.
- issue: Upeo wa βλασφημῆται kwa jina la Mungu na mafundisho
  choice: yasitukanwe
  alternative: yasinenwe vibaya
  rationale: Chaguo hili huhifadhi nguvu ya neno la Kigiriki kwa vitu vyote viwili, bila kulifanya lihusu Mungu peke yake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo unahifadhi sitiari ya nira na hali ya utumwa bila lugha ya kizamani isiyo ya lazima. Alama zote za tanbihi zimewekwa katika matini kuu.
