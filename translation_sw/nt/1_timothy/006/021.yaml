base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/021.yaml
  text: By professing it[a], some have missed the mark concerning the faith[c][b]. Grace be with you.
translation:
  language: sw
  text: Baadhi, kwa kujidai kuwa na ujuzi huo[a], wamekosa shabaha kuhusu imani[b]. Neema iwe nanyi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ambao baadhi yao wanajidai kuwa nao, wamepotoka kuhusu imani.” Kigiriki hutumia kiwakilishi cha uhusiano waziwazi, na kitenzi kinaweza pia kutafsiriwa “wamepotoka” au “wamekosea.”
    reason: lexical_alternative
  - marker: b
    text: “Imani” hapa huenda inamaanisha imani ya Kikristo kama ujumla wa yale yanayoaminiwa, ingawa inaweza pia kueleweka kwa maana pana ya imani binafsi.
    reason: alternative_reading
  - marker: c
    text: “Nanyi” ni wingi katika maandishi ya Kigiriki yaliyotumika hapa.
    reason: textual_variant
lexical_decisions:
- source_word: ἥν
  choice: ujuzi huo
  rationale: Kiwakilishi hiki cha uhusiano, cha kike na umoja, kinarejelea “ujuzi” uliotajwa katika mstari uliotangulia. Kurudia nomino katika Kiswahili kunafanya rejeo liwe wazi na la kawaida bila kubadili maana.
- source_word: ἐπαγγελλόμενοι
  choice: kwa kudai kuwa wanao
  rationale: Katika muktadha huu kitenzi kina maana ya kujitangaza au kudai kuwa na kitu, si kutoa ahadi. Muundo huu unaonyesha kwamba baadhi walidai kuwa na huo unaoitwa ujuzi.
- source_word: ἠστόχησαν
  choice: wamekosa shabaha
  rationale: Tafsiri hii inadumisha taswira ya kutofikia shabaha iliyomo katika kitenzi ἀστοχέω, huku ikibaki wazi kwa msomaji wa Kiswahili.
- source_word: περὶ τὴν πίστιν
  choice: katika mambo ya imani
  rationale: περί pamoja na hali ya accusative hapa huonyesha jambo linalohusika. Usemi huu wa Kiswahili unaeleza uhusiano huo kwa kawaida na unaruhusu “imani” kueleweka kama imani ya Kikristo bila kulazimisha maana hiyo pekee.
- source_word: Ἡ χάρις
  choice: Neema
  rationale: Huu ni usemi wa kawaida wa kufunga barua. Kiswahili hakihitaji kutafsiri kibainishi cha Kigiriki kama neno tofauti.
- source_word: μεθ’ ὑμῶν
  choice: iwe nanyi
  rationale: Kitenzi “iwe” kinakamilisha baraka hiyo kwa Kiswahili cha kawaida, na “nanyi” kinahifadhi nafsi ya pili wingi ya ὑμῶν.
theological_decisions:
- issue: Maana ya “imani” katika onyo
  choice: Usemi unaoelekea kumaanisha imani ya Kikristo kama ujumla wa yale yanayoaminiwa
  alternative: Imani binafsi au kumtumaini Mungu
  rationale: Katika barua za kichungaji na katika muktadha wa mafundisho ya uongo, neno hili mara nyingi humaanisha imani ya Kikristo. Hata hivyo, tafsiri haiongezi neno kama “mafundisho” ambalo lingeondoa kabisa uwezekano wa maana pana.
- issue: Walengwa wa baraka ya mwisho
  choice: 'Nafsi ya pili wingi: “nanyi”'
  alternative: 'Nafsi ya pili umoja: “nawe,” ikimlenga Timotheo peke yake'
  rationale: Maandishi ya msingi yana ὑμῶν, ambalo ni neno la wingi. Hivyo baraka inaweza kumhusisha Timotheo pamoja na jumuiya pana ya waamini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Wamekosa shabaha” huhifadhi taswira ya Kigiriki, na “katika mambo ya imani” hufanya uhusiano wa kisarufi uwe wa kawaida bila kuondoa mvutano wa maana.
