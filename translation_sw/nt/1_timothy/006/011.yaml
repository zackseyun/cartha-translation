  text: Σὺ δέ, ὦ ἄνθρωπε ⸀θεοῦ, ταῦτα φεῦγε· δίωκε δὲ δικαιοσύνην, εὐσέβειαν, πίστιν, ἀγάπην, ὑπομονήν, ⸀πραϋπαθίαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/011.yaml
  text: But you[a], man of God, flee these things; but pursue righteousness, godliness, faith, love, steadfastness[c][b], gentleness.
translation:
  language: sw
  text: Lakini wewe, ee mtu wa Mungu, yakimbie mambo haya; bali ufuatilie haki[a], uchaji wa Mungu, imani[b], upendo, ustahimilivu, na upole[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uadilifu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “uaminifu” au “tumaini.”
    reason: lexical_alternative
  - marker: c
    text: Neno hili adimu la Kigiriki linaweza pia kutafsiriwa “unyenyekevu,” “kujizuia kwa subira,” au “upole wenye subira.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Σὺ δέ
  choice: Lakini wewe
  rationale: Inahifadhi msisitizo wa kiwakilishi na tofauti kubwa kati ya Timotheo na watu waliotajwa kabla yake.
- source_word: ὦ ἄνθρωπε θεοῦ
  choice: ee mtu wa Mungu
  rationale: Inahifadhi mwito wa moja kwa moja na nahau ya kibiblia kwa Kiswahili cha heshima. Ingawa ‘mtu’ si neno lenye jinsia maalumu katika Kiswahili, muktadha unamtaja Timotheo binafsi.
- source_word: ταῦτα φεῦγε
  choice: yakimbie mambo haya
  rationale: Kitenzi hiki kina nguvu kuliko ‘yaepuke’ na kinaonyesha kuendelea kujitenga na maovu yaliyotangulia kutajwa.
- source_word: δίωκε
  choice: fuata
  rationale: 'Kinaweka kinyume cha ‘yakimbie’: si kuacha mabaya tu, bali kuelekeza maisha kwa bidii kwenye fadhila hizi.'
- source_word: δικαιοσύνην
  choice: haki
  rationale: ‘Haki’ ni neno la kawaida na pana linaloweza kuhusisha mwenendo ulio sawa na kuwatendea wengine kwa haki; upana huo umeelezwa katika tanbihi.
- source_word: εὐσέβειαν
  choice: uchaji wa Mungu
  rationale: Inaeleza wazi maisha yenye heshima, ibada, na mwelekeo kwa Mungu bila kutumia neno la kizamani.
- source_word: πίστιν
  choice: imani
  rationale: Ni tafsiri ya kawaida ya πίστις; uwezekano wa maana za uaminifu au kumtumaini Mungu umehifadhiwa katika tanbihi.
- source_word: ἀγάπην
  choice: upendo
  rationale: Ni tafsiri ya kawaida, wazi, na ya asili katika orodha ya fadhila.
- source_word: ὑπομονήν
  choice: ustahimilivu
  rationale: Inaonyesha kudumu imara chini ya shinikizo, badala ya uvumilivu unaoweza kueleweka kama kusubiri tu.
- source_word: πραϋπαθίαν
  choice: upole
  rationale: Ni neno la asili na linaloeleweka kwa urahisi; kwa kuwa neno la Kigiriki ni adimu na linajumuisha pia kujizuia kwa subira, upana wake umewekwa katika tanbihi.
theological_decisions:
- issue: Mwito ὦ ἄνθρωπε θεοῦ
  choice: ee mtu wa Mungu
  alternative: ee mwanadamu wa Mungu
  rationale: ‘Mtu wa Mungu’ ni nahau ya kawaida ya kibiblia na mwito wa moja kwa moja kwa Timotheo. Kiswahili hakihitaji kubuni umbo la kiume ili kuhifadhi anayelengwa katika muktadha.
- issue: Maana pana ya δικαιοσύνη
  choice: haki
  alternative: uadilifu
  rationale: Katika orodha hii neno linaweza kuelekea kwenye maisha yaliyo sawa, lakini pia lina wigo wa kuwatendea wengine kwa haki. Tanbihi inaacha mvutano huo wazi.
- issue: Maana ya πίστις katika orodha ya fadhila
  choice: imani
  alternative: uaminifu au kumtumaini Mungu
  rationale: ‘Imani’ inahifadhi tafsiri ya msingi bila kuamua kimya kimya kama msisitizo hapa ni kuamini, kutumaini, au kuwa mwaminifu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa ‘yakimbie ... bali fuata’ unahifadhi ulinganifu na tofauti ya amri mbili za Kigiriki. Koma kabla ya ‘na upole’ imetumiwa kwa uwazi katika orodha.
