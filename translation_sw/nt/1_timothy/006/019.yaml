base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/019.yaml
  text: storing up for themselves a good foundation for the future[a], so that they may take hold of the life that is truly life.
translation:
  language: sw
  text: wakijiwekea akiba iwe msingi mzuri kwa ajili ya wakati ujao, ili waushike uzima ambao kwa kweli ni uzima.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποθησαυρίζοντας
  choice: wakijiwekea
  rationale: Kitenzi kishirikishi cha wakati uliopo kinaendeleza himizo la mstari uliotangulia. “Wakijiwekea” ni cha asili katika Kiswahili na hudokeza kuweka akiba kwa manufaa ya baadaye, ingawa picha ya hazina imeunganishwa na picha ya msingi katika Kigiriki.
- source_word: ἑαυτοῖς
  choice: wenyewe
  rationale: Kiwakilishi rejeshi kinaonyesha kwamba tendo hilo ni kwa manufaa yao wenyewe; “wenyewe” kinakazia maana hiyo bila uzito usio wa lazima.
- source_word: θεμέλιον καλὸν
  choice: msingi mzuri
  rationale: Huhifadhi moja kwa moja picha ya jengo katika θεμέλιον na maana ya ubora inayobebwa na καλόν.
- source_word: εἰς τὸ μέλλον
  choice: kwa ajili ya wakati ujao
  rationale: Hutoa maana pana ya kile kilicho mbele bila kuongeza waziwazi dhana ya “enzi ijayo,” ingawa muktadha una mwangwi wa mambo ya mwisho.
- source_word: ἵνα
  choice: ili
  rationale: Kiunganishi cha kawaida na cha asili cha Kiswahili kinachoonyesha kusudi.
- source_word: ἐπιλάβωνται
  choice: wapate kushika
  rationale: “Kushika” huhifadhi picha hai ya kuushika au kuunyakua uzima; “wapate” pamoja na hali tegemezi huwasilisha kusudi na uwezekano.
- source_word: τῆς ὄντως ζωῆς
  choice: uzima ulio uzima kweli
  rationale: Huhifadhi nomino ζωή na msisitizo wa ὄντως kwa namna yenye hadhi na inayoeleweka, bila kuifupisha kuwa “uzima halisi” na hivyo kupunguza mvutano wa usemi wa Kigiriki.
theological_decisions:
- issue: Ikiwa εἰς τὸ μέλλον itafsiriwe kwa maana mahsusi ya mambo ya mwisho
  choice: kwa ajili ya wakati ujao
  alternative: kwa ajili ya enzi ijayo
  rationale: Muktadha unaelekeza kwenye uhalisi wa milele, lakini maneno ya Kigiriki yenyewe hayasemi wazi “enzi.” Tafsiri iliyochaguliwa inalinda upana huo.
- issue: Jinsi ya kuwasilisha τῆς ὄντως ζωῆς
  choice: uzima ulio uzima kweli
  alternative: uzima wa kweli
  rationale: Tafsiri iliyochaguliwa huhifadhi kurudiwa kwa dhana ya uzima na msisitizo wa “kweli,” badala ya kuifanya kauli iwe maelezo rahisi tu kuhusu ubora wa uzima.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kishirikishi unaunganisha mstari huu na himizo lililotangulia. Picha za kuweka akiba na kuweka msingi zimehifadhiwa kadiri inavyowezekana bila kufanya sentensi kuwa ngumu au ya kizamani.
