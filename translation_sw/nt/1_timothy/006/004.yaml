base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/004.yaml
  text: he is puffed up[a], understanding nothing, but sick with a craving for controversies and word-battles, from which come envy, strife, slanders, and evil suspicions[c][b],
translation:
  language: sw
  text: amejaa majivuno[a], wala haelewi chochote, bali ana ugonjwa wa kupenda mabishano na vita vya maneno[b]. Kutokana na hayo hutokea husuda, ugomvi, matukano[c], na shuku mbaya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “amekuwa na kiburi.” Neno la Kigiriki kwa maana halisi linatoa picha ya mtu aliyevimba kwa majivuno.
    reason: lexical_alternative
  - marker: b
    text: Au, “ugomvi kuhusu maneno” au “ubishi wa maneno.”
    reason: lexical_alternative
  - marker: c
    text: Hapa “matukano” yanaonyesha usemi wa kuwadhuru au kuwatukana watu; katika miktadha mingine neno la Kigiriki linaweza kumaanisha “makufuru.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τετύφωται
  choice: amejaa majivuno
  rationale: Kitenzi hiki kinaonyesha hali iliyotokana na kuvimba kwa kiburi. “Amejaa majivuno” ni Kiswahili cha kawaida na chenye hadhi, huku tanbihi ikihifadhi picha halisi ya kuvimba.
- source_word: μηδὲν ἐπιστάμενος
  choice: wala haelewi chochote
  rationale: Kauli hii inaonyesha kutokuwa na ufahamu wowote, si ukosefu wa habari tu. “Haelewi chochote” ni ya moja kwa moja na ya asili.
- source_word: νοσῶν
  choice: anaugua kwa kutamani
  rationale: “Anaugua” huhifadhi sitiari ya ugonjwa katika νοσέω, na “kwa kutamani” huonyesha kwamba mabishano ndiyo kitu anachokitamani isivyofaa.
- source_word: περὶ ζητήσεις
  choice: mabishano
  rationale: ζητήσεις hapa ni mijadala yenye ubishi au mabishano ya kubahatisha; “mabishano” hueleweka kwa urahisi katika muktadha huu.
- source_word: λογομαχίας
  choice: vita vya maneno
  rationale: Tafsiri hii huhifadhi nguvu ya neno ambatani λόγος + μάχη na kuonyesha mapambano yanayohusu maneno, bila kuwa nzito.
- source_word: ἐξ ὧν γίνεται
  choice: Kutokana na hayo hutokea
  rationale: Kauli hii inaonyesha wazi kuwa maovu yanayofuata ni matokeo ya mabishano na vita vya maneno.
- source_word: φθόνος
  choice: husuda
  rationale: “Husuda” huonyesha wivu wenye chuki au uchungu dhidi ya mema ya mwingine, sawasawa na φθόνος.
- source_word: ἔρις
  choice: ugomvi
  rationale: “Ugomvi” ni neno la kawaida na wazi kwa hali ya uhasama na mzozo inayomaanishwa na ἔρις.
- source_word: βλασφημίαι
  choice: maneno ya kashfa
  rationale: Katika orodha hii ya maovu ya mahusiano, neno hilo linaelekea kumaanisha usemi wa kuwashushia wengine heshima. “Maneno ya kashfa” pia huacha nafasi kwa upana wa neno la Kigiriki.
- source_word: ὑπόνοιαι πονηραί
  choice: tuhuma mbaya
  rationale: “Tuhuma” huwasilisha dhana ya kuwazia au kumshuku mtu bila msingi, na “mbaya” huhifadhi sifa ya kimaadili ya πονηραί.
theological_decisions:
- issue: Je, βλασφημίαι inahusu kumkufuru Mungu au kuwakashifu watu?
  choice: maneno ya kashfa
  alternative: makufuru
  rationale: Muktadha wa mabishano na ugomvi unaelekeza zaidi kwenye usemi wa kudhalilisha au kukashifu watu. Hata hivyo, tanbihi inadumisha maana nyingine inayowezekana katika miktadha mingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo unabaki kuwa kipande kinachoendeleza sentensi ya mstari uliotangulia, kama ilivyo katika chanzo. Sitiari ya ugonjwa imehifadhiwa kwa “anaugua,” huku misemo isiyo ya kawaida kupita kiasi ikiepukwa.
