  text: ἀγωνίζου τὸν καλὸν ἀγῶνα τῆς πίστεως, ἐπιλαβοῦ τῆς αἰωνίου ζωῆς, εἰς ἣν ἐκλήθης καὶ ὡμολόγησας τὴν καλὴν ὁμολογίαν ἐνώπιον πολλῶν μαρτύρων.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/012.yaml
  text: Fight the good fight of the faith[b][a]; take hold of the eternal life to which you were called and about which you made the good confession before many witnesses.
translation:
  language: sw
  text: Pigana vita vizuri vya imani[a]. Shika uzima wa milele ulioitiwa, nawe ukatoa ungamo jema[b] mbele ya mashahidi wengi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Pigana vita vizuri kwa imani,” au “Pigana vita vizuri kwa ajili ya imani.” Usemi wa Kigiriki unaweza kumaanisha mapambano yanayotawaliwa na imani au mapambano kwa ajili ya imani ya Kikristo.
    reason: alternative_reading
  - marker: b
    text: Inawezekana pia kuelewa kwamba ungamo hilo lilihusu uzima wa milele ambao Timotheo aliitiwa. Kigiriki kinaunganisha mawazo hayo kwa karibu, lakini hakitaji wazi maudhui ya ungamo.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγωνίζου τὸν καλὸν ἀγῶνα
  choice: Pigana vita vizuri
  rationale: Kauli ya amri inaonyesha jitihada inayoendelea. Kiswahili cha “pigana vita” kinahifadhi taswira ya mapambano na nguvu ya muundo wa Kigiriki kwa lugha ya kawaida na yenye hadhi.
- source_word: τῆς πίστεως
  choice: vya imani
  rationale: “Imani” ndilo neno la kawaida kwa πίστις. Kiswahili hakina kibainishi kinacholingana moja kwa moja na “the,” hivyo muundo huu unaacha wazi kama ni mapambano yanayotawaliwa na imani au mapambano kwa ajili ya imani ya Kikristo.
- source_word: ἐπιλαβοῦ
  choice: Shika
  rationale: Amri hii inatoa wito wa kuushika kwa uthabiti na kwa uamuzi uzima unaotajwa; “shika” ni ya asili na inadumisha taswira ya kuutia mkononi.
- source_word: τῆς αἰωνίου ζωῆς
  choice: uzima wa milele
  rationale: Huu ndio usemi wa kawaida, wazi, na wenye hadhi kwa dhana ya maisha yasiyo na mwisho yanayoahidiwa na Mungu.
- source_word: εἰς ἣν ἐκλήθης
  choice: ambao uliitiwa
  rationale: Kiwakilishi kinamrejelea “uzima wa milele,” na muundo huu unadumisha wazo la huo kuwa lengo la mwito bila kueleza zaidi namna ya mwito huo.
- source_word: ὡμολόγησας τὴν καλὴν ὁμολογίαν
  choice: ukatoa ungamo jema
  rationale: “Kutoa ungamo” ni Kiswahili cha asili kuliko kurudia “ukakiri ukiri,” huku “jema” likihifadhi tathmini ya καλός.
- source_word: ἐνώπιον πολλῶν μαρτύρων
  choice: mbele ya mashahidi wengi
  rationale: Tafsiri hii ni fupi, ya kawaida, na inaonyesha kwamba ungamo lilitolewa hadharani katika uwepo wa watu wengi waliolishuhudia.
theological_decisions:
- issue: Maana ya πίστεως katika τὸν καλὸν ἀγῶνα τῆς πίστεως
  choice: “vya imani,” bila kufunga maana kwa upande mmoja
  alternative: “kwa imani” au “kwa ajili ya imani ya Kikristo”
  rationale: Muundo wa Kigiriki unaweza kueleza mapambano yanayotawaliwa na imani au mapambano kwa ajili ya imani ya Kikristo. Kiswahili cha matini kuu kinadumisha uwezekano huo, na tanbihi inaueleza.
- issue: Uhusiano wa ungamo na mwito wa uzima wa milele
  choice: Kishazi cha ungamo kimeunganishwa kwa “nawe” bila kutaja wazi yaliyokuwa maudhui yake
  alternative: “na kuhusu huo ukatoa ungamo jema”
  rationale: Kigiriki kinaunganisha mwito na ungamo kwa karibu, lakini hakisemi wazi kwamba uzima wa milele ndio yaliyokuwa maudhui ya ungamo. Tafsiri kuu haiongezi uhusiano huo, na tanbihi huhifadhi uwezekano mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Maneno “vita,” “uzima wa milele,” “ungamo,” na “mashahidi” yanaeleweka katika matumizi ya kawaida ya Biblia bila kuingiza istilahi za dhehebu fulani. Tanbihi zimewekwa baada ya vifungu vinavyohusika.
