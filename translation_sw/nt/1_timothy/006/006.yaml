  text: Lakini utauwa pamoja na kuridhika ni faida kubwa[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “faida kubwa” au “njia ya kupata faida kubwa.” Neno la Kigiriki linahusiana na faida au kupata faida, likirudia wazo la mstari uliotangulia.
    reason: lexical_alternative
  - marker: b
