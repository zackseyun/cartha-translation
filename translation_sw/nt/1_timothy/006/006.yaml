lexical_decisions:
- source_word: δὲ
  choice: Lakini
  rationale: Kiunganishi hiki kinaonyesha utofauti wa kiasi na wazo la mstari uliotangulia kwamba utauwa ni njia ya kupata faida.
- source_word: πορισμὸς
  choice: faida
  rationale: Neno hili linaweza kumaanisha faida au njia ya kupata faida. “Faida” ni ya asili katika Kiswahili na inadumisha mwangwi wa hoja ya mstari uliotangulia bila kuifanya faida hiyo kuwa mali tu.
- source_word: μέγας
  choice: kubwa
  rationale: Hili ndilo neno la kawaida na la asili linaloonyesha ukubwa au thamani kubwa ya faida inayotajwa.
- source_word: εὐσέβεια
  choice: utauwa
  rationale: “Utauwa” huonyesha maisha ya kumcha na kumheshimu Mungu, na ni neno linalofaa kwa matumizi ya neno hili katika Nyaraka za Kichungaji.
- source_word: μετὰ
  choice: pamoja na
  rationale: 'Hueleza uambatano: utauwa unaoandamana na kuridhika.'
- source_word: αὐταρκείας
  choice: kuridhika
  rationale: Katika muktadha wa mistari inayofuata, neno hili linaelekea kumaanisha kuridhika na mahitaji ya msingi, si kujitegemea bila kumhitaji Mungu.
theological_decisions:
- issue: Maana ya αὐτάρκεια katika muktadha wa Kikristo
  choice: kuridhika
  alternative: kujitosheleza
  rationale: Mistari ya 7–8 inafafanua wazo hilo kwa kuridhika na chakula na mavazi. “Kuridhika” huepuka kudokeza uhuru wa kujitegemea mbali na Mungu.
- issue: Uhusiano kati ya utauwa na faida
  choice: utauwa pamoja na kuridhika wenyewe ni faida kubwa
  alternative: utauwa ukiambatana na kuridhika ni njia ya kupata faida kubwa
  rationale: Muundo wa Kigiriki unaweza kuruhusu maana zote mbili. Tafsiri kuu inadumisha tamko fupi na utofauti na mstari wa 5 bila kuonyesha kana kwamba Paulo anahimiza dini kwa ajili ya manufaa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Utauwa” limetumiwa kama istilahi iliyoeleweka ya maisha yanayoelekezwa kwa Mungu; “kuridhika” ni la kawaida zaidi kuliko nomino nzito kama “utoshelevu.”
