id: 1TI.6.17
reference: 1 Timothy 6:17
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Τοῖς πλουσίοις ἐν τῷ νῦν αἰῶνι παράγγελλε μὴ ὑψηλοφρονεῖν μηδὲ ἠλπικέναι ἐπὶ πλούτου ἀδηλότητι, ἀλλ’ ⸀ἐπὶ ⸀θεῷ τῷ παρέχοντι ἡμῖν πάντα πλουσίως εἰς ἀπόλαυσιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/017.yaml
  text: Command those who are rich in the present age not to be arrogant[a], nor to set their hope on the uncertainty of riches, but on God[b], who richly provides us with everything for enjoyment.
translation:
  language: sw
  text: Waagize wale walio matajiri katika enzi ya sasa[a] wasiwe na kiburi, wala wasiweke tumaini lao katika kutokuwa na uhakika wa utajiri[b], bali wamtumainie Mungu, ambaye hutupatia vitu vyote kwa ukarimu ili tuvifurahie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “katika ulimwengu huu wa sasa.” Neno la Kigiriki linaweza kumaanisha “enzi” au, kwa upanuzi, mpangilio wa ulimwengu wa sasa; “enzi” huhifadhi vizuri zaidi tofauti ya wakati katika mafundisho ya Paulo.
    reason: lexical_alternative
  - marker: b
    text: Au “katika utajiri usio na uhakika.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῖς πλουσίοις
  choice: walio matajiri
  rationale: Kifungu hiki chenye kiambishi bainishi kinawataja watu wenye utajiri. ‘Walio matajiri’ ni Kiswahili cha kawaida na hakifanyi utajiri kuwa utambulisho wao wote.
- source_word: ἐν τῷ νῦν αἰῶνι
  choice: katika enzi hii ya sasa
  rationale: ‘Enzi’ huhifadhi maana ya kipindi au mpangilio wa sasa na mguso wa tofauti ya kieskatolojia, badala ya kuelekeza tu kwenye ulimwengu wa kimaada.
- source_word: παράγγελλε
  choice: Waagize
  rationale: Kitenzi cha amri kina nguvu ya mamlaka; ‘waagize’ ni cha kawaida na chenye uzito unaofaa katika muktadha huu.
- source_word: μὴ ὑψηλοφρονεῖν
  choice: wasiwe na kiburi
  rationale: Huwasilisha wazi hali ya kujiona kuwa juu au kuwa na majivuno.
- source_word: μηδὲ ἠλπικέναι
  choice: wala wasiweke tumaini lao
  rationale: Kauli hii inaonyesha kuweka tumaini kwa uthabiti katika kitu; ‘waweke tumaini lao’ ni usemi wa asili katika Kiswahili.
- source_word: ἐπὶ πλούτου ἀδηλότητι
  choice: katika utajiri usio na uhakika
  rationale: Husawiri utajiri kuwa kitu kisicho na uhakika na kisichotegemeka, huku ikihifadhi uhusiano wa tumaini na kitu chake.
- source_word: ἀλλ’ ἐπὶ θεῷ
  choice: bali kwa Mungu
  rationale: ‘Kwa Mungu’ ni usemi wa kawaida wa Kiswahili kwa Mungu kuwa msingi au mlengwa wa tumaini, na unahifadhi tofauti na utajiri.
- source_word: τῷ παρέχοντι ἡμῖν
  choice: ambaye hutupatia
  rationale: Kirai shiriki humweleza Mungu kuwa mtoaji. ‘Hutupatia’ huonyesha utoaji unaoendelea kwa njia ya kawaida na wazi.
- source_word: πάντα
  choice: vitu vyote
  rationale: Huhifadhi upana wa πάντα bila kuubana kwa mahitaji pekee.
- source_word: πλουσίως
  choice: kwa wingi
  rationale: Ni Kiswahili cha asili kinachoonyesha utoaji mwingi na wa ukarimu; pia kinaendeleza wazo la wingi linalohusiana na utajiri.
- source_word: εἰς ἀπόλαυσιν
  choice: ili tuvifurahie
  rationale: Huwasilisha kusudi au matokeo ya utoaji wa Mungu kwa lugha ya kawaida, na kiwakilishi cha vitu kinarejelea ‘vitu vyote.’
theological_decisions:
- issue: Maana ya αἰών katika muktadha wa kimaadili na kieskatolojia
  choice: enzi
  alternative: ulimwengu
  rationale: ‘Enzi’ huhifadhi tofauti ya wakati inayopatikana katika matumizi ya Paulo na haibani maana kwenye ulimwengu wa kimaada.
- issue: Upana wa utoaji wa Mungu katika πάντα
  choice: vitu vyote
  alternative: vitu vyote tunavyohitaji
  rationale: Andiko lenyewe halibani utoaji huo kwa mahitaji pekee. Tafsiri huhifadhi upana wake bila kuingiza dai kwamba kila tamaa ya mali itatimizwa.
- issue: Kusudi la vitu vinavyotolewa na Mungu
  choice: ili tuvifurahie
  alternative: kwa matumizi yetu
  rationale: ἀπόλαυσις ina maana ya kufurahia; tafsiri haipunguzi kauli hiyo kuwa matumizi ya lazima tu wala kuipanua kuwa ruhusa isiyo na mipaka.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa sentensi huhifadhi mfululizo wa amri na tofauti kati ya kutumainia utajiri na kumtumainia Mungu. Alama zote za tanbihi zimewekwa moja kwa moja baada ya vifungu vinavyohusika.
