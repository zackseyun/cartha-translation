  naturalness: Kiswahili ni cha kawaida na cha hadhi inayofaa. “Wale walio matajiri” na kurudia kitenzi katika “bali wamtumainie Mungu” hufanya sentensi itiririke zaidi na kuondoa utegemezi usio kamili wa “bali kwa Mungu.”
  terminology: “Enzi ya sasa,” “tumaini,” “utajiri,” na “Mungu” ni istilahi sahihi na zinazofaa kwa Kiswahili Sanifu. “Kwa ukarimu” huwasilisha πλουσίως kwa kawaida, bila kubana upeo wa πάντα.
