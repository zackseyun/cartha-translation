  to: Waagize wale walio matajiri katika enzi ya sasa[a] wasiwe na kiburi, wala wasiweke tumaini lao katika kutokuwa na uhakika wa utajiri[b], bali wamtumainie Mungu, ambaye hutupatia vitu vyote kwa ukarimu ili tuvifurahie.
