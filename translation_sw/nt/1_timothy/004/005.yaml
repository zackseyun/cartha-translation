  text: for it is sanctified through the word of God and prayer[a][b].
translation:
  language: sw
  text: kwa maana kinatakaswa kwa njia ya neno la Mungu na sala.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “dua” au “maombi” badala ya “sala.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἁγιάζεται
  choice: kinatakaswa
  rationale: Kitenzi cha wakati uliopo katika hali ya kutendwa; kinarejelea chakula kilichotajwa katika muktadha. ‘Kinatakaswa’ kinahifadhi lugha ya kutenga kuwa kitakatifu bila kuamua zaidi aina ya utakaso.
- source_word: γὰρ
  choice: kwa maana
  rationale: Kiunganishi hiki kinatoa sababu ya maelezo yaliyotangulia; ‘kwa maana’ ni cha kawaida na chenye hadhi katika Kiswahili.
- source_word: διὰ
  choice: kwa njia ya
  rationale: διά pamoja na jenitivi huonyesha njia au chombo; ‘kwa njia ya’ kinadumisha maana hiyo waziwazi.
- source_word: λόγου θεοῦ
  choice: neno la Mungu
  rationale: Tafsiri ya moja kwa moja ya muundo wa jenitivi, huku ikiacha wazi iwapo ni tamko la Maandiko, tamko la Mungu katika uumbaji, au idhini ya Mungu kwa maana pana.
- source_word: ἐντεύξεως
  choice: sala
  rationale: Katika muktadha wa kupokea chakula kwa shukrani, ‘sala’ ni neno la kawaida na pana lisilobana maana kuwa aina moja tu ya ombi. Uwezekano wa ‘dua’ au ‘maombi’ umeonyeshwa katika tanbihi.
theological_decisions:
- issue: Upeo wa lugha ya utakaso katika muktadha
  choice: Kudumisha usemi ‘kinatakaswa’ huku muktadha ukionyesha kuwa kinachorejelewa ni chakula.
  alternative: Kufafanua moja kwa moja kuwa chakula ‘kinawekwa kando kuwa halali kutumiwa.’
  rationale: Mistari 3–4 inahusu vyakula vinavyopokewa kwa shukrani. Tafsiri inadumisha lugha ya ἁγιάζεται bila kuingiza dai maalumu la kisakramenti, kimaadili, au kuhusu wokovu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Kiwakilishi cha ngeli ‘ki-’ katika ‘kinatakaswa’ hurejelea chakula katika muktadha uliotangulia. Tanbihi moja tu imetumiwa kwa sababu ‘kinatakaswa’ tayari ndiyo tafsiri ya asili na ya kawaida ya ἁγιάζεται kwa Kiswahili.
