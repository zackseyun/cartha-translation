  text: Παράγγελλε ταῦτα καὶ δίδασκε.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/011.yaml
  text: Command these things and teach them[a].
translation:
  language: sw
  text: Endelea kuagiza mambo haya na kuyafundisha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Endelea kuelekeza mambo haya na kuyafundisha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Παράγγελλε
  choice: Endelea kuagiza
  rationale: Kitenzi cha wakati wa sasa katika hali ya amri kinaonyesha hatua ya kuendelea, huku “kuagiza” kikihifadhi nguvu ya kutoa agizo lenye mamlaka.
- source_word: ταῦτα
  choice: mambo haya
  rationale: Kiwakilishi hiki cha kuonyesha cha wingi, kisicho na jinsia, kinarejelea mafundisho au maagizo yaliyotangulia; “mambo haya” ni Kiswahili cha kawaida kinachohifadhi wingi huo.
- source_word: καὶ
  choice: na
  rationale: Kiunganishi cha kawaida kinachounganisha amri mbili.
- source_word: δίδασκε
  choice: kuyafundisha
  rationale: Hali ya amri ya wakati wa sasa inadokeza kufundisha kwa kuendelea. Kiambishi “ya” kinarejelea “mambo haya,” kama ambavyo yambwa inaeleweka kutoka ταῦτα katika Kigiriki.
theological_decisions:
- issue: Mamlaka ya kichungaji inayodokezwa na παραγγέλλω
  choice: Kutafsiri kwa nguvu ya kimamlaka kuwa “Endelea kuagiza”
  alternative: “Endelea kuelekeza” au “Toa maagizo kuhusu mambo haya”
  rationale: Παράγγελλε ina nguvu ya kutoa agizo, si kutoa ushauri tu. Tafsiri hii inahifadhi mamlaka ya kauli bila kuongeza madai ya kikanisa yasiyokuwamo katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Endelea” huonyesha dhana ya tendo linaloendelea katika amri zote mbili, bila kufanya sentensi kuwa nzito.
