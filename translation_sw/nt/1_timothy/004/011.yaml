  source_fidelity: “Endelea kuagiza mambo haya na kuyafundisha” accurately renders both present imperatives. “Kuagiza” retains the directive, authoritative force of Παράγγελλε, and “mambo haya” preserves the plural demonstrative ταῦτα. The coordinated infinitives naturally convey the two linked commands, with the ongoing nuance of the present imperatives represented by “Endelea.”
