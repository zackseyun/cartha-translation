review_pass:
  verdict: revise
  source_fidelity: The main contrast and the limited temporal sense of πρὸς ὀλίγον are conveyed well. However, the Greek participle ἐπαγγελίαν ἔχουσα modifies εὐσέβεια (‘godliness’), whereas ‘kwa kuwa kuna ahadi’ leaves the holder of the promise unexpressed and weakens this syntactic connection.
  naturalness: ‘Mazoezi ya mwili’ and ‘kwa muda mfupi’ are natural Standard East African Swahili. ‘Kumcha Mungu’ is idiomatic, though ‘utauwa’ more directly represents εὐσέβεια as a quality or mode of life and permits the feminine grammatical linkage required by the source participle.
  terminology: Use ‘utauwa’ for εὐσέβεια. This established theological term denotes godliness/piety and, unlike the verbal phrase ‘kumcha Mungu,’ accurately carries the source’s predication that it ‘has’ a promise. ‘Ahadi ya uzima’ should remain singular, as in Greek.
  issues:
  - severity: medium
    issue: The phrase ‘kwa kuwa kuna ahadi’ does not explicitly state that godliness has the promise.
    rationale: ἐπαγγελίαν ἔχουσα is a feminine singular participle agreeing with εὐσέβεια. Rendering it as ‘kwa kuwa una ahadi’ maintains the source relationship without supplying doctrinal detail.
  revised_text: Kwa maana mazoezi ya mwili yana faida kwa muda mfupi[a], lakini utawa una faida kwa mambo yote, kwa kuwa una ahadi ya uzima wa sasa na ule ujao.[b]
