revisions:
- from: Kwa maana mazoezi ya mwili yana faida kwa muda mfupi[a], lakini kumcha Mungu kuna faida kwa mambo yote, kwa kuwa kuna ahadi ya uzima wa sasa na ule ujao.[b]
  to: Kwa maana mazoezi ya mwili yana faida kwa muda mfupi[a], lakini utawa una faida kwa mambo yote, kwa kuwa una ahadi ya uzima wa sasa na ule ujao.[b]
  rationale: Revision restores the explicit grammatical relation between εὐσέβεια and ‘having promise.’ ‘Utawa’ is a natural, established Standard East African Swahili equivalent for εὐσέβεια and preserves its nominal quality. The temporal reading of πρὸς ὀλίγον and its stated alternative are retained.
