id: 1TI.4.8
reference: 1 Timothy 4:8
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἡ γὰρ σωματικὴ γυμνασία πρὸς ὀλίγον ἐστὶν ὠφέλιμος, ἡ δὲ εὐσέβεια πρὸς πάντα ὠφέλιμός ἐστιν, ἐπαγγελίαν ἔχουσα ζωῆς τῆς νῦν καὶ τῆς μελλούσης.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/008.yaml
  text: For bodily training is beneficial for a little while[a], but godliness is beneficial for all things[c][b], since it holds promise for the present life and the coming one.
translation:
  language: sw
  text: Kwa maana mazoezi ya mwili yana faida kwa muda mfupi[a], lakini utawa una faida kwa mambo yote, kwa kuwa una ahadi ya uzima wa sasa na ule ujao.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa kiwango kidogo”; Kigiriki kinaweza kumaanisha muda mfupi au kiwango kidogo.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “ukiwa na ahadi ya uzima wa sasa na wa ule ujao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σωματικὴ γυμνασία
  choice: mazoezi ya mwili
  rationale: Ni usemi wa kawaida na wazi unaohifadhi maana ya kujizoeza au kuufunza mwili bila kuifanya dhana kuwa ya michezo pekee.
- source_word: πρὸς ὀλίγον
  choice: kwa muda mfupi
  rationale: Huwasilisha uwezekano mkubwa wa maana ya muda huku tanbihi ikihifadhi uwezekano wa maana ya kiwango kidogo.
- source_word: ὠφέλιμος
  choice: yana/kuna faida
  rationale: Usemi huu ni wa Kiswahili cha kawaida na unatumika kwa ulinganifu katika pande zote mbili za sentensi.
- source_word: εὐσέβεια
  choice: kumcha Mungu
  rationale: Katika muktadha wa Nyaraka za Kichungaji, huu ni mwenendo wa heshima na kujitoa unaomwelekea Mungu; ‘kumcha Mungu’ ni wa kawaida na wenye hadhi katika Kiswahili, bila kudokeza hofu tupu.
- source_word: πρὸς πάντα
  choice: kwa mambo yote
  rationale: Huhifadhi upana wa usemi wa Kigiriki bila kuubana kuwa faida ya kiroho pekee.
- source_word: ἐπαγγελίαν ἔχουσα
  choice: kwa kuwa kuna ahadi
  rationale: Hutoa nguvu ya maelezo ya kishiriki cha Kigiriki kwa Kiswahili cha asili; ahadi inayohusishwa na kumcha Mungu inaelezwa bila kuongeza mhusika asiyeelezwa.
- source_word: ζωῆς τῆς νῦν καὶ τῆς μελλούσης
  choice: uzima wa sasa na ule ujao
  rationale: Huhifadhi ulinganifu wa wakati wa sasa na ujao, pamoja na udondoshaji wa nomino katika sehemu ya pili.
theological_decisions:
- issue: Upeo wa faida ya mazoezi ya mwili
  choice: Mazoezi ya mwili yana faida iliyo na mpaka, yakilinganishwa na faida pana ya kumcha Mungu.
  alternative: Mazoezi ya mwili yana faida kwa kiwango kidogo.
  rationale: πρὸς ὀλίγον inaweza kueleza muda mfupi au kiwango kidogo. Matini kuu inachagua maana ya muda, lakini tanbihi huhifadhi utata halisi; pia tafsiri haisemi kwamba mazoezi ya mwili hayana thamani.
- issue: Uhusiano wa ahadi na uzima
  choice: Kumcha Mungu kunahusishwa na ahadi ya uzima wa sasa na ujao.
  alternative: Kumcha Mungu kwenyewe ndiko kunakoahidi uzima.
  rationale: Muundo wa Kigiriki unasema kwamba εὐσέβεια ‘ina ahadi’ ya uzima; tafsiri inaepuka kufafanua zaidi chanzo, masharti, au namna ya kutimizwa kwa ahadi hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, kinachoeleweka na chenye hadhi. ‘Kumcha Mungu’ limetumiwa kwa εὐσέβεια kama usemi wa kawaida wa maisha yanayomheshimu Mungu. Alama zote za tanbihi katika matini kuu zinalingana na tanbihi.
