  text: ἕως ἔρχομαι πρόσεχε τῇ ἀναγνώσει, τῇ παρακλήσει, τῇ διδασκαλίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/013.yaml
  text: Until I come[a], devote yourself to the public reading, to exhortation, to teaching.
translation:
  language: sw
  text: Mpaka nitakapokuja, jitoe kwa kusoma hadharani[a], kwa kuhimiza, na kwa kufundisha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kusoma Maandiko.” Kigiriki kinasema tu “kusoma,” lakini katika muktadha huenda kinamaanisha kusoma Maandiko hadharani katika kusanyiko.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕως ἔρχομαι
  choice: Mpaka nitakapokuja
  rationale: Kirai hiki kinaonyesha muda ambao Timotheo anapaswa kuendelea na wajibu huu hadi Paulo atakapowasili; Kiswahili hiki pia kinaonyesha maana ya wakati ujao ya ἔρχομαι katika muktadha.
- source_word: πρόσεχε
  choice: jitoe kwa
  rationale: Amri hii inataka uangalifu na bidii ya kudumu, si kutazama kwa muda mfupi tu. ‘Jitoe kwa’ ni ya kawaida na yenye nguvu inayofaa katika maagizo ya kichungaji.
- source_word: τῇ ἀναγνώσει
  choice: kusoma hadharani
  rationale: ἀνάγνωσις kimsingi ni ‘kusoma,’ lakini katika muktadha wa huduma ya kusanyiko kunaelekea kumaanisha usomaji wa hadharani. Tafsiri hii haiongezi wazi kitu kinachosomwa, ambacho hakijatajwa katika Kigiriki.
- source_word: τῇ παρακλήσει
  choice: kuhimiza
  rationale: παράκλησις inaweza kumaanisha kutia moyo, kusihi, au kuhimiza. Katika mfuatano wa maagizo ya huduma, ‘kuhimiza’ huhifadhi maana ya kichungaji yenye mwito wa kuitikia.
- source_word: τῇ διδασκαλίᾳ
  choice: kufundisha
  rationale: Neno hili linahusu tendo au maudhui ya mafundisho. ‘Kufundisha’ ni Kiswahili cha sasa na cha wazi, bila kulifanya neno hili limaanishe mfumo maalumu wa kimadhehebu.
theological_decisions:
- issue: Iwapo kitu kinachosomwa katika ἀνάγνωσις kitajwe wazi kuwa Maandiko
  choice: kusoma hadharani
  alternative: kusoma Maandiko
  rationale: Muktadha wa ibada na huduma unaelekea kuashiria usomaji wa Maandiko mbele ya kusanyiko, lakini Kigiriki chenyewe kinasema tu ‘kusoma.’ Matini kuu inahifadhi kutotajwa kwa kitu hicho huku tanbihi ikieleza maana inayowezekana sana.
- issue: Upana wa maana ya παράκλησις
  choice: kuhimiza
  alternative: kutia moyo
  rationale: Neno la Kigiriki linaweza kubeba pande zote mbili. ‘Kuhimiza’ linafaa zaidi katika mfuatano wa usomaji na ufundishaji, lakini maana ya kutia moyo haikataliwi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Muundo wa vipashio vitatu umehifadhiwa kwa urari wa ‘kusoma… kuhimiza… kufundisha.’
