id: 1TI.4.10
reference: 1 Timothy 4:10
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἰς τοῦτο ⸀γὰρ κοπιῶμεν καὶ ⸀ὀνειδιζόμεθα, ὅτι ἠλπίκαμεν ἐπὶ θεῷ ζῶντι, ὅς ἐστιν σωτὴρ πάντων ἀνθρώπων, μάλιστα πιστῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/010.yaml
  text: For to this end we labor and are reproached[a], because we have put our hope in the living God, who is the Savior of all people[c][b], especially of believers.
translation:
  language: sw
  text: Kwa maana, kwa kusudi hili tunafanya kazi kwa bidii na tunashutumiwa[a], kwa sababu tumeliweka tumaini letu kwa Mungu aliye hai[b], ambaye ni Mwokozi wa watu wote[c], hasa wa waamini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “tunajitaabisha na kutukanwa.”
    reason: lexical_alternative
  - marker: b
    text: Au, “tumemtumainia Mungu aliye hai.”
    reason: lexical_alternative
  - marker: c
    text: Kirai “Mwokozi wa watu wote, hasa wa waamini” kimetafsiriwa kama kilivyoandikwa. Wafafanuzi hutofautiana kuhusu kama hapa “Mwokozi” inasisitiza utunzaji wa Mungu unaowahifadhi watu wote, mpango wake wa wokovu kwa wote, au wokovu unaopokelewa hasa na waamini.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰς τοῦτο
  choice: kwa kusudi hili
  rationale: Kirai hiki kinaonyesha lengo lililotajwa katika muktadha uliotangulia; ‘kwa kusudi hili’ kinaweka wazi nguvu yake ya kusudi kwa Kiswahili cha kawaida.
- source_word: γὰρ
  choice: kwa maana
  rationale: Kiunganishi hiki kinatoa maelezo ya kauli iliyotangulia; ‘kwa maana’ ni cha asili na chenye heshima katika muktadha huu.
- source_word: κοπιῶμεν
  choice: tunafanya kazi kwa bidii
  rationale: Kitenzi kinaashiria kazi ngumu yenye kuchosha; usemi huu unaeleweka kwa urahisi na huhifadhi uzito wa juhudi hiyo.
- source_word: ὀνειδιζόμεθα
  choice: kulaumiwa
  rationale: Kauli tendwa inaonyesha kupokea lawama, shutuma, au fedheha ya maneno. ‘Kulaumiwa’ ni wazi, ingawa ‘kutukanwa’ huonyesha nguvu zaidi ya dhihaka.
- source_word: ἠλπίκαμεν ἐπὶ
  choice: tumeliweka tumaini letu kwa
  rationale: Njeo timilifu inaonyesha tendo lililofanyika ambalo matokeo yake yanaendelea; ‘tumeliweka tumaini letu kwa’ huwasilisha tegemeo lililoamuliwa na linalodumu.
- source_word: θεῷ ζῶντι
  choice: Mungu aliye hai
  rationale: Huu ni usemi wa kawaida wa kibiblia na unahifadhi moja kwa moja sifa ya Mungu kuwa hai.
- source_word: σωτὴρ
  choice: Mwokozi
  rationale: Neno linaweza pia kuwa na maana ya mkombozi au mhifadhi, lakini ‘Mwokozi’ huhifadhi uzito wake wa kitheolojia bila kulazimisha namna maalumu ya kulifasiri hapa.
- source_word: πάντων ἀνθρώπων
  choice: wa watu wote
  rationale: Neno ἀνθρώπων linawahusu wanadamu kwa ujumla; ‘watu wote’ ni Kiswahili cha sasa, jumuishi, na sahihi.
- source_word: μάλιστα
  choice: hasa
  rationale: ‘Hasa’ huhifadhi maana ya upekee au kiwango kilichosisitizwa bila kubadili kirai kuwa ‘yaani’ na hivyo kuondoa mvutano uliomo katika matini.
- source_word: πιστῶν
  choice: waamini
  rationale: Katika muktadha huu neno linawahusu wale wanaoamini; ‘waamini’ ni neno la kawaida na lililo wazi katika Kiswahili cha Kikristo.
theological_decisions:
- issue: Maana ya ‘Mwokozi wa watu wote, hasa wa waamini’
  choice: Kauli pana imehifadhiwa kama ilivyo, huku ‘hasa’ ikionyesha uhusiano wa kipekee na waamini bila kupunguza ‘watu wote’ kuwa aina zote za watu wala kutangaza wokovu wa ulimwengu wote katika tafsiri yenyewe.
  alternative: ‘Mwokozi’ kama mhifadhi wa watu wote na Mwokozi kwa maana ya ukombozi kwa waamini; au usomaji wa wokovu wa wote; au ‘watu wote’ kumaanisha aina zote za watu.
  rationale: Kigiriki chenyewe kinaunganisha upeo wa wote na msisitizo wa waamini. Tafsiri inapaswa kuhifadhi mvutano huo wa kitheolojia badala ya kuutatua kwa mfumo fulani wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umefanywa wa asili kwa msomaji wa kawaida huku ukihifadhi uhusiano wa kusudi, hali endelevu ya tumaini, na mvutano kati ya ‘watu wote’ na ‘hasa wa waamini.’ Alama zote za tanbihi [a], [b], na [c] zimewekwa katika matini kuu.
