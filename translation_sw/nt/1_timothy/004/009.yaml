  text: The saying is trustworthy and worthy of full acceptance,[a]
translation:
  language: sw
  text: Maneno haya ni ya kuaminika na yanastahili kukubaliwa kikamilifu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Kauli hii ni ya kuaminika” au “Ujumbe huu ni wa kuaminika.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστὸς
  choice: ya kuaminika
  rationale: Katika kauli hii ya kawaida ya Nyaraka za Kichungaji, neno hili linaonyesha kwamba maneno hayo ni yenye kutegemewa na yanastahili kuaminiwa. “Ya kuaminika” ni Kiswahili cha kawaida na cha asili katika muktadha huu.
- source_word: ὁ λόγος
  choice: maneno haya
  rationale: Hapa λόγος inarejelea kauli au ujumbe fulani, si lazima “Neno” katika maana pana ya kiteolojia. “Maneno haya” ni usemi wa asili wa Kiswahili unaodumisha rejeo la kauli hiyo bila kulazimisha utambulisho wake.
- source_word: πάσης
  choice: kikamilifu
  rationale: Katika kirai πάσης ἀποδοχῆς, neno hili lina nguvu ya ukamilifu au utimilifu. Kielezi “kikamilifu” huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: ἀποδοχῆς
  choice: kukubaliwa
  rationale: Neno hili humaanisha kupokewa au kukubaliwa. “Kukubaliwa” linaeleweka wazi na linafaa katika muundo wa kirai hiki.
- source_word: ἄξιος
  choice: yanastahili
  rationale: ἄξιος pamoja na uhusiano wa genitivi humaanisha kuwa jambo linastahili au lafaa kupokea kitu fulani. “Yanastahili” ni tafsiri ya moja kwa moja na ya asili.
