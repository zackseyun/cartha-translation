id: 1TI.4.12
reference: 1 Timothy 4:12
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: μηδείς σου τῆς νεότητος καταφρονείτω, ἀλλὰ τύπος γίνου τῶν πιστῶν ἐν λόγῳ, ἐν ἀναστροφῇ, ἐν ⸀ἀγάπῃ, ἐν πίστει, ἐν ἁγνείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/012.yaml
  text: Let no one look down on your youth[a], but be an example for the believers in speech, in conduct, in love, in faith, in purity.
translation:
  language: sw
  text: Mtu yeyote asiudharau ujana wako, bali uwe mfano kwa waamini katika usemi, mwenendo, upendo, imani[a] na usafi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “uaminifu.” Neno la Kigiriki katika muktadha huu linaweza kumaanisha imani au uaminifu.
    reason: alternative_reading
lexical_decisions:
- source_word: μηδείς ... καταφρονείτω
  choice: Mtu yeyote asiudharau
  rationale: Kauli hii ya kukataza imewasilishwa kwa Kiswahili cha kawaida na chenye nguvu; ‘asiudharau’ hubeba wazo la kumwona mtu au hali yake kuwa duni.
- source_word: σου τῆς νεότητος
  choice: ujana wako
  rationale: ‘Ujana wako’ ni usemi mfupi na wa asili unaotaja umri au hali ya kuwa kijana bila kuufanya maana kuwa mahususi kupita kiasi.
- source_word: τύπος γίνου
  choice: uwe mfano
  rationale: τύπος hapa ni kielelezo cha kuigwa, na γίνου ni himizo la kuwa au kujionyesha kuwa hivyo.
- source_word: τῶν πιστῶν
  choice: kwa waamini
  rationale: Kirai hiki kinaonyesha kundi ambalo Timotheo anapaswa kuwa mfano kwake; ‘waamini’ humaanisha watu wanaoamini.
- source_word: ἐν λόγῳ
  choice: katika usemi
  rationale: λόγος katika orodha hii inahusu namna ya kusema; ‘usemi’ huhifadhi muundo mfupi wa orodha.
- source_word: ἐν ἀναστροφῇ
  choice: mwenendo
  rationale: ἀναστροφή humaanisha tabia au njia ya maisha; ‘mwenendo’ ni neno la sasa, lenye heshima na pana.
- source_word: ἐν ἀγάπῃ
  choice: upendo
  rationale: ‘Upendo’ ni tafsiri ya kawaida ya ἀγάπη na hutaja sifa ambayo Timotheo anapaswa kuonyesha.
- source_word: ἐν πίστει
  choice: imani
  rationale: πίστις inaweza kumaanisha imani au uaminifu hapa. ‘Imani’ huhifadhi maana kuu bila kufunga uwezekano mwingine, ambao umewekwa katika tanbihi.
- source_word: ἐν ἁγνείᾳ
  choice: usafi
  rationale: ἁγνεία hurejelea usafi wa kimaadili, unaoweza kujumuisha usafi wa kingono; ‘usafi’ huhifadhi upana huo.
theological_decisions:
- issue: Maana ya πίστις katika orodha ya sifa
  choice: imani
  alternative: uaminifu
  rationale: Muktadha unaweza kueleweka kuwa imani kwa Mungu au sifa ya kuwa mwaminifu. Maandishi makuu yametumia ‘imani,’ huku maana nyingine halisi ikihifadhiwa katika tanbihi bila kuamua mvutano huo kidhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa orodha umehifadhiwa kwa ufupi, huku viunganishi visivyo lazima vikiepukwa ili sentensi isomeke kwa kawaida.
