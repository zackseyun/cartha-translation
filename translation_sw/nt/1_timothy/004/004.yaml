  text: ὅτι πᾶν κτίσμα θεοῦ καλόν, καὶ οὐδὲν ἀπόβλητον μετὰ εὐχαριστίας λαμβανόμενον,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/004.yaml
  text: For every creation of God is good[a], and nothing is to be rejected if it is received with thanksgiving[b],
translation:
  language: sw
  text: Kwa maana kila kitu alichokiumba Mungu ni chema, wala hakuna chochote cha kukataliwa ikiwa kinapokewa kwa shukrani,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: Kwa maana
  rationale: Katika muktadha, kiunganishi hiki kinatoa sababu au ufafanuzi wa kauli iliyotangulia; “Kwa maana” ni ya kawaida na yenye mtiririko mzuri katika Kiswahili.
- source_word: πᾶν κτίσμα θεοῦ
  choice: kila kitu alichokiumba Mungu
  rationale: Muundo huu wa Kiswahili unaonyesha kwa kawaida maana ya kila kitu kilichoumbwa na Mungu. Unahifadhi upana wa κτίσμα bila kuibana iwe viumbe hai pekee au chakula pekee.
- source_word: καλόν
  choice: chema
  rationale: “Chema” ni tafsiri ya moja kwa moja inayopatana na lugha ya kibiblia kuhusu uzuri wa uumbaji wa Mungu.
- source_word: οὐδὲν ἀπόβλητον
  choice: wala hakuna chochote cha kukataliwa
  rationale: Kauli hii huhifadhi ukanushaji kamili na maana ya kivumishi ἀπόβλητον kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: μετὰ εὐχαριστίας
  choice: kwa shukrani
  rationale: Hii ni lugha ya kawaida ya Kiswahili inayoonyesha kupokea huku mtu akimshukuru Mungu.
- source_word: λαμβανόμενον
  choice: ikiwa kinapokewa
  rationale: Kishiriki cha sasa cha kutendwa kinaelezwa kwa kishazi cha sharti, kinachoonyesha mazingira ambayo kitu hicho hakikataliwi bila kuongeza maana isiyokuwamo katika Kigiriki.
theological_decisions:
- issue: Upeo wa κτίσμα katika muktadha wa vyakula na makatazo ya kujinyima
  choice: kila kitu alichokiumba Mungu
  alternative: kila kiumbe cha Mungu; vyakula vyote alivyoumba Mungu
  rationale: Kigiriki ni kipana kuliko “chakula” pekee, ingawa muktadha unahusu vyakula. Tafsiri hii huhifadhi msingi mpana wa uumbaji bila kuingiza ufafanuzi mwembamba katika matini.
- issue: Nguvu ya kisharti ya λαμβανόμενον pamoja na μετὰ εὐχαριστίας
  choice: ikiwa kinapokewa kwa shukrani
  alternative: kinapopokewa kwa shukrani; huku kikipokewa kwa shukrani
  rationale: “Ikiwa” huwasilisha kwa uwazi uhusiano wa kimazingira au kisharti kati ya kutokikataa kitu na kukipokea kwa shukrani, bila kupanua dai la kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. “Kitu alichokiumba Mungu” limetumiwa badala ya “uumbaji wa Mungu,” ambalo katika Kiswahili linaweza kueleweka kuwa uumbaji wote kwa jumla badala ya kila kilichoumbwa.
