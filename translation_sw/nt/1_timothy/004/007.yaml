  text: But reject profane and old-womanish myths[a], and train yourself for godliness.
translation:
  language: sw
  text: Lakini zikatae hadithi zisizo takatifu na za vikongwe[a], bali ujizoeze kwa ajili ya utauwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno, Kigiriki husema ‘hadithi zenye sifa zinazohusishwa na wanawake wazee’; ni usemi wa dharau. Pia inaweza kutafsiriwa ‘ngano za vikongwe.’
    reason: lexical_alternative
lexical_decisions:
- source_word: βεβήλους
  choice: zisizo takatifu
  rationale: Inaendeleza utofauti wa Kigiriki kati ya yaliyo matakatifu na yaliyo ya kawaida au yasiyo na heshima kwa Mungu, bila kupanua maana kuwa kukataa kuwapo kwa Mungu.
- source_word: γραώδεις
  choice: za wanawake wazee
  rationale: Inahifadhi wazi taswira mahususi na ya dharau ya Kigiriki, badala ya kuipunguza kuwa ‘za kipumbavu.’ Tanbihi inaeleza kuwa kivumishi hicho kinamaanisha hadithi zenye sifa zinazohusishwa na wanawake wazee.
- source_word: μύθους
  choice: hadithi
  rationale: ‘Hadithi’ ni neno la kawaida na pana linaloweza kumaanisha masimulizi yaliyotungwa au ya kubuni; muktadha unaonyesha kwamba si masimulizi ya kuaminika. ‘Ngano’ lingeweza kudokeza zaidi aina maalumu ya fasihi ya jadi.
- source_word: παραιτοῦ
  choice: zikatae
  rationale: Amri hii ina maana ya kukataa au kutoshughulika na hadithi hizo. ‘Zikatae’ ni fupi, ya moja kwa moja, na yenye nguvu inayolingana na kauli ya Kigiriki.
- source_word: γύμναζε
  choice: ujizoeze
  rationale: Kitenzi hiki kina taswira ya mazoezi ya mwili. ‘Ujizoeze’ huhifadhi taswira ya kujifunza kwa mazoezi ya mara kwa mara kwa Kiswahili cha kawaida.
- source_word: σεαυτόν
  choice: uji-
  rationale: Kiambishi rejeshi ‘ji’ katika ‘ujizoeze’ kinamrejelea Timotheo mwenyewe na hivyo kuwasilisha maana ya kiwakilishi cha Kigiriki kwa njia ya asili ya Kiswahili.
- source_word: πρὸς εὐσέβειαν
  choice: kuishi kwa kumcha Mungu
  rationale: πρός inaonyesha lengo la mazoezi, na εὐσέβεια hapa ni mwenendo wa maisha wenye heshima na uchaji unaomwelekea Mungu. Kauli hii ni wazi zaidi kwa msomaji wa kawaida kuliko nomino ya kidhahania ‘utauwa,’ bila kuifanya maana kuwa finyu.
- source_word: δὲ … δὲ
  choice: Lakini … nawe
  rationale: ‘Lakini’ inaonyesha tofauti na muktadha uliotangulia, huku ‘nawe’ ikiunganisha amri chanya inayofuata na kusisitiza anayesemeshwa kwa mtiririko wa asili wa Kiswahili.
theological_decisions:
- issue: Jinsi ya kutafsiri usemi wa dharau γραώδεις μύθους
  choice: 'Kuhifadhi rejeo la wazi kwa wanawake wazee katika matini kuu: ‘hadithi … za wanawake wazee.’'
  alternative: ‘Hadithi za kipumbavu’ au ‘ngano za vikongwe.’
  rationale: Kigiriki kina taswira mahususi ya kijinsia na kiumri, yenye dharau. Tafsiri ya jumla kama ‘za kipumbavu’ ingeondoa taswira hiyo, ilhali ‘ngano’ ingeongeza dhana ya aina fulani ya fasihi. Tanbihi inafafanua usemi huo bila kuhalalisha dharau yake.
- issue: Maana ya εὐσέβεια
  choice: ‘kuishi kwa kumcha Mungu’
  alternative: ‘utauwa’ au ‘uchaji Mungu’
  rationale: Neno hilo katika nyaraka za kichungaji linahusu maisha yenye heshima na mwelekeo kwa Mungu, si ibada ya nje pekee. Tafsiri hii inabaki wazi na ya kimatendo bila kuingiza msimamo wa dhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa moja kwa moja na unaeleweka kwa wasomaji wa kawaida. ‘Ujizoeze’ huhifadhi sitiari ya mazoezi, na ‘kuishi kwa kumcha Mungu’ huepuka istilahi nzito bila kupoteza maana ya maisha yanayomwelekea Mungu.
