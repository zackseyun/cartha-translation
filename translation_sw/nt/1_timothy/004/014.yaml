id: 1TI.4.14
reference: 1 Timothy 4:14
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: μὴ ἀμέλει τοῦ ἐν σοὶ χαρίσματος, ὃ ἐδόθη σοι διὰ προφητείας μετὰ ἐπιθέσεως τῶν χειρῶν τοῦ πρεσβυτερίου.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/014.yaml
  text: Do not neglect the gift that is in you[b][a], which was given to you through prophecy with the laying on of the hands of the eldership.
translation:
  language: sw
  text: Usiipuuze karama iliyo ndani yako, ambayo ulipewa kwa njia ya unabii[a], pamoja na kuwekewa mikono na baraza la wazee[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa tamko la kinabii”; usemi huu unaweza kumaanisha kwamba unabii uliandamana na kutolewa kwa karama hiyo au ulikuwa njia ya kuitoa.
    reason: lexical_alternative
  - marker: b
    text: Au “kundi la wazee”; neno la Kigiriki linamaanisha wazee wakiwa kundi.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ἀμέλει
  choice: Usiipuuze
  rationale: Kitenzi hiki kinaonya dhidi ya kutokipa uangalifu unaofaa kitu kilichokabidhiwa. “Usiipuuze” ni Kiswahili cha kawaida, cha moja kwa moja, na kinadumisha katazo la kuendelea.
- source_word: χάρισμα
  choice: karama
  rationale: “Karama” ni neno la kawaida la Kiswahili kwa kipawa kilichotolewa kwa neema. Haliongezi kivumishi kama “ya kiroho,” ambacho hakijaandikwa wazi katika Kigiriki.
- source_word: τοῦ ἐν σοὶ χαρίσματος
  choice: karama iliyo ndani yako
  rationale: Tafsiri hii inadumisha wazo la Kigiriki kwamba karama iko “ndani” ya Timotheo badala ya kulainisha usemi kuwa “karama yako” tu.
- source_word: ἐδόθη σοι
  choice: ambayo ulipewa
  rationale: Kauli tendwa inadumishwa bila kumtaja mtoaji, kwa kuwa Kigiriki hakumtaji wazi.
- source_word: διὰ προφητείας
  choice: kwa njia ya unabii
  rationale: Usemi huu unaonyesha njia au chombo, huku ukiacha wazi kama unabii uliandamana na kutolewa kwa karama hiyo au ulikuwa njia ambayo karama ilitolewa.
- source_word: μετὰ ἐπιθέσεως τῶν χειρῶν
  choice: pamoja na kuwekewa mikono
  rationale: Huu ni usemi wa asili na unaoeleweka kwa tendo la kuweka mikono juu ya mtu; “pamoja na” linaakisi μετὰ bila kulazimisha uhusiano maalumu zaidi.
- source_word: τοῦ πρεσβυτερίου
  choice: baraza la wazee
  rationale: Neno hilo linamaanisha wazee kama kundi. “Baraza la wazee” linaeleweka katika Kiswahili cha sasa na halitumii istilahi yenye maana mahsusi ya dhehebu fulani.
theological_decisions:
- issue: Ikiwa χάρισμα itafsiriwe kwa umahususi wa kiroho au wa huduma
  choice: karama
  alternative: karama ya kiroho
  rationale: Muktadha unaweza kuonyesha karama kwa ajili ya huduma, lakini Kigiriki hakina kivumishi “ya kiroho.” Tafsiri fupi inalinda upana wa matini.
- issue: Uhusiano wa unabii na kutolewa kwa karama
  choice: kwa njia ya unabii
  alternative: kwa tamko la kinabii
  rationale: διά pamoja na hali ya umilikishi inaweza kuonyesha njia au chombo. Tafsiri na tanbihi zinahifadhi uwezekano kwamba unabii uliandamana na tukio hilo au ulihusika kama njia ya kutolewa kwa karama.
- issue: Maana ya πρεσβυτέριον katika muundo wa kanisa
  choice: baraza la wazee
  alternative: kundi la wazee
  rationale: Matini inaonyesha wazee kama kundi lakini haifafanui kwa kina mfumo wao wa uongozi. Chaguo hili linaonyesha uwingi wa pamoja bila kuingiza mfumo wa baadaye wa dhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inadumisha mpangilio na mvutano wa matini ya Kigiriki, huku “karama,” “unabii,” na “baraza la wazee” zikiwa wazi kwa msomaji wa kawaida bila kuingiza msamiati wa dhehebu fulani.
