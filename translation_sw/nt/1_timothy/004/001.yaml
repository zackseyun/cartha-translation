id: 1TI.4.1
reference: 1 Timothy 4:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Τὸ δὲ πνεῦμα ῥητῶς λέγει ὅτι ἐν ὑστέροις καιροῖς ἀποστήσονταί τινες τῆς πίστεως, προσέχοντες πνεύμασι πλάνοις καὶ διδασκαλίαις δαιμονίων
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/001.yaml
  text: The Spirit explicitly says that in later times some will depart from the faith[a], paying attention to deceitful spirits and teachings of demons[c][b],
translation:
  language: sw
  text: Lakini Roho anasema wazi kwamba katika nyakati za baadaye[b] baadhi ya watu wataiacha imani[c], wakisikiliza roho danganyifu[a] na mafundisho ya mashetani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “roho zinazodanganya.”
    reason: lexical_alternative
  - marker: b
    text: Au, “katika nyakati za mwisho.”
    reason: lexical_alternative
  - marker: c
    text: Au, “watajitenga na imani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὸ ... πνεῦμα
  choice: Roho
  rationale: Kibainishi na muktadha wa kinabii katika waraka huu vinaelekeza kwa Roho Mtakatifu. Herufi kubwa inaonyesha rejeo hilo bila kuongeza neno “Mtakatifu,” ambalo halimo wazi katika mstari.
- source_word: δὲ
  choice: Lakini
  rationale: Hapa δέ inaendeleza hoja kwa mpito wenye kiasi fulani cha utofautishaji na maelezo yaliyotangulia. “Lakini” ni ya kawaida na inaweka uhusiano huo wazi.
- source_word: ῥητῶς
  choice: wazi
  rationale: Neno hili linaonyesha kusema kwa namna ya moja kwa moja na isiyo na utata. “Wazi” ni Kiswahili cha sasa na cha kawaida.
- source_word: λέγει
  choice: anasema
  rationale: Wakati uliopo wa kitenzi umehifadhiwa, na upatanisho wa ngeli ya mtu umetumiwa kwa sababu Roho anaeleweka kuwa Roho Mtakatifu.
- source_word: ἐν ὑστέροις καιροῖς
  choice: katika nyakati za baadaye
  rationale: Kirai kinamaanisha vipindi vitakavyofuata wakati wa mwandishi, bila kulazimisha maana ya kiufundi ya siku za mwisho kabisa.
- source_word: ἀποστήσονταί
  choice: wataiacha
  rationale: Kitenzi kinaonyesha kuondoka au kujitenga. “Wataiacha” ni wazi na cha kawaida bila kuingiza hitimisho la kimadhehebu kuhusu hali ya waasi hao.
- source_word: τινες
  choice: baadhi ya watu
  rationale: Hii ni njia ya kawaida ya Kiswahili ya kuwasilisha kiwakilishi cha wingi kisichotaja watu mahususi.
- source_word: τῆς πίστεως
  choice: imani
  rationale: Katika muktadha huu, kirai kinaelekea kumaanisha imani ya Kikristo kama yaliyomo na msingi wa kuamini, si sifa ya uaminifu pekee.
- source_word: προσέχοντες
  choice: wakisikiliza
  rationale: 'Kitenzi kishirikishi kinaonyesha namna inayohusiana na kuiacha imani: kuyapa makini na kuyatii yale yanayotajwa. “Wakisikiliza” ni cha kawaida na hakizidishi maana.'
- source_word: πνεύμασι πλάνοις
  choice: roho danganyifu
  rationale: Kivumishi πλάνοις kinaweza kueleza roho zenye tabia ya kudanganya au kupotosha. “Roho danganyifu” huhifadhi muundo wa kivumishi kwa ufupi.
- source_word: διδασκαλίαις δαιμονίων
  choice: mafundisho ya mashetani
  rationale: 'Kirai kinaweza kuonyesha chanzo au uhusiano: mafundisho yanayotoka kwa mashetani au yanayohusiana nao. Tafsiri hii inaacha uhusiano huo ukiwa mpana kama ulivyo katika Kigiriki.'
theological_decisions:
- issue: Rejeo la “Roho”
  choice: Roho Mtakatifu ndiye anayerejelewa, lakini matini inasema tu “Roho”
  alternative: roho ya kinabii au roho ya mwanadamu
  rationale: Muktadha wa usemi wa kinabii na matumizi ya Paulo yanaunga mkono rejeo kwa Roho Mtakatifu, bila kubainisha njia mahsusi ambayo ujumbe huo ulitolewa.
- issue: Maana ya “imani”
  choice: imani ya Kikristo kama ujumla wa yale yanayoaminiwa
  alternative: imani binafsi au uaminifu
  rationale: Kibainishi cha Kigiriki na muktadha wa mafundisho ya uongo vinaunga mkono maana ya imani kama yaliyomo katika imani ya Kikristo, huku mstari wenyewe usiamue mifumo ya kimadhehebu kuhusu uasi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa msomaji wa kawaida. Alama za tanbihi zimewekwa mara tu baada ya maneno yanayohusika. Muundo wa sentensi umehifadhi uhusiano wa kitenzi kishirikishi na kuiacha imani bila kuufanya kuwa sababu ya lazima.
