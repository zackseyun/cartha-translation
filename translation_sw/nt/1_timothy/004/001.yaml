  source_fidelity: 'Tafsiri inawakilisha vipengele muhimu vya Kigiriki kwa uaminifu: δέ kama mpito (“Lakini”), ῥητῶς (“wazi”), wakati ujao wa ἀποστήσονται, na kishirikishi προσέχοντες. “Roho” yenye herufi kubwa ni uamuzi unaokubalika kwa muktadha bila kuongeza “Mtakatifu” kwenye matini. “Imani” na “mafundisho ya mashetani” pia yanahifadhi maana na upeo wa vifungu vya asili.'
