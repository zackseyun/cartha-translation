id: 1TI.4.6
reference: 1 Timothy 4:6
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ταῦτα ὑποτιθέμενος τοῖς ἀδελφοῖς καλὸς ἔσῃ διάκονος ⸂Χριστοῦ Ἰησοῦ⸃, ἐντρεφόμενος τοῖς λόγοις τῆς πίστεως καὶ τῆς καλῆς διδασκαλίας ᾗ παρηκολούθηκας,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/006.yaml
  text: By putting these things before the brothers[a], you will be a good servant of Messiah Jesus[c][b], being nourished by the words of the faith and of the good teaching that you have followed.
translation:
  language: sw
  text: Ukiwakumbusha ndugu[a] mambo haya, utakuwa mtumishi mwema wa Masihi Yesu[b], huku ukilishwa kwa maneno ya imani[c] na ya mafundisho mazuri ambayo umeyafuata.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki lina umbo la kiume la wingi, lakini linaweza kuwarejelea waamini kwa ujumla, pamoja na wanawake.
    reason: cultural_note
  - marker: b
    text: Au “Kristo Yesu.” Cheo cha Kigiriki Χριστός kinamaanisha Masihi, yaani Mtiwa-Mafuta.
    reason: lexical_alternative
  - marker: c
    text: Au “maneno ya ile imani”; hapa “imani” huenda ikamaanisha maudhui yanayotambuliwa ya imani ya Kikristo.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα
  choice: mambo haya
  rationale: Kiwakilishi hiki cha wingi kinarejelea maonyo na maagizo yaliyotangulia; “mambo haya” ni Kiswahili cha kawaida kinachohifadhi wingi huo.
- source_word: ὑποτιθέμενος
  choice: ukiwaeleza
  rationale: Katika muktadha huu kitenzi kina maana ya kuyaweka mambo mbele ya watu kwa kuwaonyesha au kuwakumbusha. “Ukiwaeleza” ni ya asili katika Kiswahili na haikifanyi kuwa amri rasmi kuliko Kigiriki.
- source_word: τοῖς ἀδελφοῖς
  choice: ndugu
  rationale: “Ndugu” ndilo neno la kawaida la Kiswahili kwa washiriki wa jumuiya ya waamini na halilazimishi jinsia pale ambapo muktadha unaweza kujumuisha wanaume na wanawake.
- source_word: καλὸς
  choice: mwema
  rationale: Kivumishi hiki kinasifu ubora wa utumishi; “mwema” kinaendana kwa kawaida na “mtumishi.”
- source_word: διάκονος
  choice: mtumishi
  rationale: Hapa neno linaeleza kazi ya kumtumikia Yesu, wala halionyeshi wazi cheo rasmi cha kanisa; kwa hiyo “mtumishi” linafaa kuliko “shemasi.”
- source_word: Χριστοῦ Ἰησοῦ
  choice: Masihi Yesu
  rationale: Χριστός ni cheo chenye maana ya Mtiwa-Mafuta, yaani Masihi. “Masihi Yesu” huhifadhi maana ya cheo hicho; namna ya jadi “Kristo Yesu” imewekwa katika tanbihi.
- source_word: ἐντρεφόμενος
  choice: huku ukilishwa
  rationale: Umbo hili linaonyesha kuendelea kupata lishe au kulelewa kwa njia ya maneno hayo. “Kukilishwa” huhifadhi taswira ya lishe na hali ya kupokea inayodokezwa na umbo la Kigiriki.
- source_word: τοῖς λόγοις
  choice: kwa maneno
  rationale: Dative hapa inaweza kuonyesha njia ya kulishwa. “Kwa maneno” huhifadhi neno λόγοις badala ya kulibadili moja kwa moja kuwa “mafundisho.”
- source_word: τῆς πίστεως
  choice: ya imani
  rationale: “Imani” ndiyo maana inayofaa hapa; muktadha unaweza kuelekeza kwenye maudhui ya imani ya Kikristo, lakini tafsiri kuu haifungi kabisa uwezekano wa maana pana zaidi.
- source_word: τῆς καλῆς διδασκαλίας
  choice: ya mafundisho mazuri
  rationale: “Mafundisho” ni sawa la kawaida la διδασκαλία, na “mazuri” huhifadhi tathmini ya καλῆς bila kuibadili kuwa “yenye uzima,” jambo ambalo si neno la Kigiriki hapa.
- source_word: ᾗ παρηκολούθηκας
  choice: ambayo umeyafuata
  rationale: Kiwakilishi cha uhusiano kinarejelea kwa karibu zaidi mafundisho mazuri. Kitenzi kinaweza kumaanisha kufuatilia kwa makini au kushikamana na jambo; “umeyafuata” huhifadhi upana huo.
theological_decisions:
- issue: Tafsiri ya Χριστός
  choice: Masihi Yesu
  alternative: Kristo Yesu
  rationale: Χριστός bado ina nguvu ya cheo katika kifungu hiki. “Masihi” huwasilisha maana yake, huku namna iliyozoeleka “Kristo” ikihifadhiwa katika tanbihi.
- issue: Wanaorejelewa na τοῖς ἀδελφοῖς
  choice: ndugu
  alternative: ndugu wa kiume; au waamini wote
  rationale: Kigiriki kina umbo la kiume la wingi, lakini katika jumuiya za Kikristo neno hilo mara nyingi huwahusu waamini kwa ujumla. Neno la Kiswahili “ndugu” linaweza kuhifadhi upana huo bila kuongeza maneno yasiyokuwapo.
- issue: Maana ya πίστις
  choice: imani
  alternative: imani hiyo, yaani maudhui yanayoaminiwa
  rationale: Kuunganishwa kwake na mafundisho kunaifanya maana ya maudhui ya imani ya Kikristo iwezekane sana, lakini “imani” huhifadhi pia mkazo wa neno lenyewe bila kulipanua ndani ya matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa msomaji wa kawaida. Sentensi inadumisha uhusiano wa vishazi vya Kigiriki bila kuwa nzito kupita kiasi. “Ndugu” limetumiwa kwa upana wake wa kawaida wa Kiswahili, na “Masihi” limechaguliwa ili kuhifadhi maana ya cheo.
