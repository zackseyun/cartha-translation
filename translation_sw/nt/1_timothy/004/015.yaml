translation:
  language: sw
  text: Yafanyie bidii mambo haya; jitoe kikamilifu katika hayo[a], ili maendeleo yako yaonekane wazi kwa wote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, Kigiriki husema, “uwe katika mambo haya.” Usemi huu unaonyesha kujihusisha nayo au kujitoa kikamilifu katika hayo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα
  choice: mambo haya
  rationale: Kiwakilishi hiki cha wingi kinarejelea maagizo yaliyotangulia; “mambo haya” ni Kiswahili cha kawaida na hakiongezi ufafanuzi usiomo katika matini.
- source_word: μελέτα
  choice: yafanyie bidii
  rationale: Kitenzi hiki kinaweza kuhusisha kutafakari, kujishughulisha na jambo, na kulitekeleza kwa mazoea. Katika muktadha huu, “yafanyie bidii” kinaonyesha umakini na utekelezaji wa kudumu bila kukifunga kwenye kutafakari kwa ndani pekee.
- source_word: ἐν τούτοις ἴσθι
  choice: jitoe kabisa kuyafanya
  rationale: Kigiriki halisi ni “uwe katika mambo haya,” nahau inayoonyesha kuzama au kujihusisha kikamilifu. Tafsiri hii inaleta maana hiyo kwa Kiswahili cha kawaida, huku tanbihi ikihifadhi taswira halisi.
- source_word: ἵνα
  choice: ili
  rationale: Kiunganishi cha kusudi au matokeo; “ili” ni cha kawaida na kinaendeleza uhusiano huo kwa uwazi.
- source_word: σου ἡ προκοπή
  choice: maendeleo yako
  rationale: προκοπή humaanisha kusonga mbele au maendeleo. Usemi mpana “maendeleo yako” hauyaminyi kuwa ukuaji wa kiroho pekee wala ustadi wa huduma pekee.
- source_word: φανερὰ ᾖ
  choice: yaonekane wazi
  rationale: Muundo huu unaeleza maendeleo kuwa dhahiri au yanayotambulika hadharani; “yaonekane wazi” ni wa asili na unaweka wazo la kuonekana.
- source_word: πᾶσιν
  choice: kwa wote
  rationale: Dativu ya wingi inawahusu watu wote wanaokusudiwa katika muktadha; “kwa wote” ni fupi na yenye hadhi.
theological_decisions:
- issue: Upeo wa maendeleo ya Timotheo yanayoonekana
  choice: Maendeleo yanaachwa kuwa mapana, yakihusu kutekeleza maagizo yaliyotangulia bila kuyafunga kwenye ukuaji wa kiroho pekee au uwezo wa huduma pekee.
  alternative: Kuyatafsiri hasa kama ukuaji wa kiroho, au hasa kama ufanisi wa huduma.
  rationale: Muktadha unahusisha mafundisho, mwenendo, karama, na kujitoa. Neno pana “maendeleo” linahifadhi upeo na mvutano wa matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Jitoe kabisa kuyafanya” ni nahau ya kawaida inayowasilisha ushiriki wa kina; tanbihi inahifadhi usemi halisi wa Kigiriki.
