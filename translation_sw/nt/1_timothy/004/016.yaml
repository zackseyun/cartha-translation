  text: ἔπεχε σεαυτῷ καὶ τῇ διδασκαλίᾳ· ἐπίμενε αὐτοῖς· τοῦτο γὰρ ποιῶν καὶ σεαυτὸν σώσεις καὶ τοὺς ἀκούοντάς σου.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/016.yaml
  text: Pay close attention to yourself and to the teaching[a]; persist in these things[b]. For by doing this you will save both yourself and those who listen to you.
translation:
  language: sw
  text: Uwe mwangalifu kwa wewe mwenyewe na kwa mafundisho; dumu katika mambo hayo. Kwa maana, kwa kufanya hivyo utajiokoa wewe mwenyewe na wale wanaokusikiliza.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “utajihifadhi wewe mwenyewe na wale wanaokusikiliza.” Neno la Kigiriki linalotafsiriwa “kuokoa” linaweza kutaja kuokoa au kuhifadhi, kulingana na muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπεχε
  choice: Jiangalie sana
  rationale: Kitenzi cha amri kinaonyesha uangalifu wa karibu na unaoendelea; kauli hii ni ya kawaida katika Kiswahili na inahifadhi wazo la kujichunguza kwa makini.
- source_word: σεαυτῷ
  choice: wewe mwenyewe
  rationale: Kiwakilishi cha kujirejelea kinasisitiza kwamba Timotheo anapaswa kuangalia maisha na mwenendo wake mwenyewe.
- source_word: τῇ διδασκαλίᾳ
  choice: mafundisho yako
  rationale: Neno linaweza kumaanisha tendo au maudhui ya kufundisha. Umilikishi unaeleza kwa Kiswahili cha kawaida mafundisho anayotoa Timotheo bila kuyafanya kuwa mafundisho yaliyotungwa naye.
- source_word: ἐπίμενε αὐτοῖς
  choice: dumu katika mambo hayo
  rationale: Kauli hii inaonyesha kuendelea kwa uthabiti; kiwakilishi cha wingi kinarejelea kujitunza na kuyatunza mafundisho kwa pamoja.
- source_word: τοῦτο γὰρ ποιῶν
  choice: Kwa maana kwa kufanya hivyo
  rationale: Muundo huu unaonyesha njia au namna ambavyo matokeo yanayofuata yatatimia.
- source_word: σώσεις
  choice: utajiokoa ... na ...
  rationale: Neno la msingi ni ‘kuokoa’; halijapunguzwa kuwa kuhifadhi tu, hivyo uzito na upana wake wa kitheolojia unabaki.
- source_word: τοὺς ἀκούοντάς σου
  choice: wale wanaokusikiliza
  rationale: Kauli hii ya sasa inaonyesha watu wanaoendelea kumsikiliza Timotheo, hasa wanapopokea mafundisho yake.
theological_decisions:
- issue: Maana ya σώσεις katika himizo kwa mhudumu
  choice: Kuhifadhi ‘utajiokoa’ bila kuibana maana yake kuwa wokovu wa milele pekee au ulinzi wa muda tu
  alternative: ‘utajihifadhi’ au ‘utajiletea wokovu’
  rationale: Andiko linaunganisha kudumu kwa Timotheo katika maisha na mafundisho na kuokolewa kwake pamoja na kwa wasikilizaji wake. Tafsiri haidai kwamba anastahili wokovu kwa matendo yake wala haisemi wazi zaidi ya Kigiriki jinsi uokoaji huo unavyotendeka.
- issue: Uhusiano wa αὐτοῖς na yaliyotangulia
  choice: ‘katika mambo hayo,’ likirejelea kujitunza na mafundisho
  alternative: ‘katika hayo,’ likirejelea nomino zilizotangulia bila kuzifafanua
  rationale: Wingi usio wa kiume unaelekea kujumlisha mambo mawili yaliyotajwa; tafsiri hii inafanya rejeo lieleweke bila kuongeza fundisho jipya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Jiangalie sana’ na ‘dumu’ ni wazi kwa msomaji wa kawaida huku zikihifadhi nguvu ya amri na mwendelezo wake.
