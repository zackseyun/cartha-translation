lexical_decisions:
- source_word: ἐν
  choice: kwa
  rationale: Hapa ἐν inaonyesha njia au chombo kinachohusiana na kauli iliyotangulia; “kwa” ni ya kawaida na yenye maana hiyo katika Kiswahili.
- source_word: ὑποκρίσει
  choice: unafiki
  rationale: “Unafiki” hutoa moja kwa moja maana ya kujifanya kuwa mwema au mnyofu huku hali halisi ikiwa tofauti.
- source_word: ψευδολόγων
  choice: wa waongo
  rationale: Hili ni kundi la maneno ya kumilikisha linalofafanua unafiki kuwa wa watu wenye sifa ya kusema uongo.
- source_word: κεκαυστηριασμένων
  choice: zimetiwa kovu kwa chuma cha moto
  rationale: Kauli hii inadumisha picha ya kitu kilichochomwa au kupigwa chapa kwa chuma cha moto na hali inayotokana na tendo lililokwisha kufanyika, bila kuamua ikiwa mkazo ni alama au kufa ganzi.
- source_word: τὴν ἰδίαν συνείδησιν
  choice: dhamiri zao wenyewe
  rationale: Ingawa nomino ya Kigiriki iko katika umoja kwa maana gaw distributive, wingi ni wa kawaida zaidi katika Kiswahili kwa kurejelea dhamiri ya kila mmoja; “wenyewe” inadumisha mkazo wa ἰδίαν.
theological_decisions:
- issue: Nguvu ya sitiari katika κεκαυστηριασμένων
  choice: “zimetiwa kovu kwa chuma cha moto”
  alternative: “zimepigwa chapa” au “zimeunguzwa na kufanywa zisihisi”
  rationale: Tafsiri inadumisha picha wazi ya chuma cha moto lakini haisemi moja kwa moja kwamba dhamiri zimekufa ganzi kabisa, zimewekewa alama ya umiliki, au hali yao haiwezi kubadilika. Hivyo utata na mvutano wa kifungu cha Kigiriki vinabaki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Dhamiri” ni neno linaloeleweka katika muktadha wa kimaadili; muundo wa wingi “dhamiri zao wenyewe” ni wa asili zaidi kuliko umoja wa Kigiriki unaotumika kwa maana ya kila mmoja.
