  text: wakikataza ndoa na kuwaamuru watu wajiepushe na vyakula ambavyo Mungu aliviumba ili wale wanaoamini na ambao wameijua kweli wavipokee kwa shukrani.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa kufuata umbo la maneno kwa karibu zaidi: “wakikataza kufunga ndoa na kujiepusha na vyakula.” Maana katika muktadha ni kwamba walimu wa uongo waliwaagiza watu wajiepushe na vyakula fulani.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κωλυόντων γαμεῖν
  choice: wakikataza ndoa
  rationale: Muundo huu ni wa kawaida na wenye heshima katika Kiswahili, nao unaonyesha wazi marufuku dhidi ya kufunga ndoa bila kubadili maana ya msingi ya kitenzi na kitenzi-jina cha Kigiriki.
- source_word: ἀπέχεσθαι βρωμάτων
  choice: kuwaamuru watu wajiepushe na vyakula
  rationale: Kitenzi ἀπέχεσθαι chenyewe ni ‘kujiepusha’; muktadha wa mafundisho ya uongo unaonyesha kwamba walimu hao walikuwa wakiwaagiza watu kufanya hivyo. Ufafanuzi huu huepusha sentensi ya Kiswahili kueleweka kimakosa kuwa walikataza watu kujiepusha na vyakula.
- source_word: ἃ ὁ θεὸς ἔκτισεν
  choice: ambavyo Mungu aliviumba
  rationale: ‘Aliviumba’ huhifadhi lugha mahsusi ya uumbaji katika κτίζω, na upatanisho wa kisarufi unarejelea ‘vyakula.’
- source_word: εἰς μετάλημψιν
  choice: ili vipokewe
  rationale: Hutoa wazi maana ya kusudi katika εἰς na wazo la kuvipokea au kuvila vyakula, kwa Kiswahili cha kawaida.
- source_word: μετὰ εὐχαριστίας
  choice: kwa shukrani
  rationale: Ni usemi wa asili wa Kiswahili unaohifadhi wazo la kumpa Mungu shukrani wakati wa kupokea chakula.
- source_word: τοῖς πιστοῖς
  choice: na wale wanaoamini
  rationale: Hapa πιστοῖς inaelekea kumaanisha waamini; ‘wanaoamini’ huonyesha maana hiyo ya kitendo kwa uwazi.
- source_word: ἐπεγνωκόσι τὴν ἀλήθειαν
  choice: na ambao wameijua kweli
  rationale: Wakati timilifu wa Kigiriki unaonyesha hali ya sasa iliyotokana na kuifikia maarifa ya kweli. ‘Wameijua’ ni ya kawaida na huhifadhi hali hiyo bila kuongeza ufafanuzi wa kimadhehebu.
theological_decisions:
- issue: Ikiwa τοῖς πιστοῖς καὶ ἐπεγνωκόσι τὴν ἀλήθειαν inataja kundi moja au makundi mawili
  choice: 'Kundi moja lenye sifa mbili: wale wanaoamini na ambao wameijua kweli'
  alternative: 'Makundi mawili: waamini, na wale walioijua kweli'
  rationale: Kifungu kimoja pamoja na viambajengo vilivyounganishwa kwa καί kinaelekea kueleza watu wale wale kwa sifa mbili. Tafsiri haianzishi makundi mawili bila ulazima wa kisarufi.
- issue: Nguvu inayotawala ἀπέχεσθαι
  choice: Kuweka wazi kwamba walimu hao waliwaamuru watu wajiepushe na vyakula
  alternative: 'Kutafsiri kwa kufuata umbo la maneno moja kwa moja: ‘wakikataza kuoa na kujiepusha na vyakula’'
  rationale: Muundo wa Kigiriki umebanwa na unaweza kuwa tata kwa Kiswahili. Maana ya muktadha ni kuweka sharti la kujiepusha na vyakula, si kukataza kujiepusha; tanbihi huhifadhi taarifa ya umbo halisi zaidi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imeanza kwa herufi ndogo kwa kuwa kifungu hiki kinaendeleza maelezo kutoka mstari uliotangulia. ‘Ndoa,’ ‘vyakula,’ na ‘kwa shukrani’ ni maneno yanayoeleweka kwa wasomaji wa kawaida; muundo unahifadhi uhusiano wa kisarufi na uzito wa kiteolojia wa uumbaji wa Mungu.
