lexical_decisions:
- source_word: τὸ πρότερον ὄντα
  choice: ingawa hapo kwanza nilikuwa
  rationale: Kirai hiki kinamrejelea Paulo na hali yake ya zamani; “hapo kwanza nilikuwa” ni Kiswahili cha asili kinachohifadhi maana ya wakati na nguvu ya kitenzi-shirikishi. “Ingawa” huunganisha kirai hiki kwa kawaida na sentensi iliyotangulia.
- source_word: βλάσφημον
  choice: mtu wa kukufuru
  rationale: Neno limetumika kama nomino inayomweleza mtu. “Mtu wa kukufuru” ni wazi na linaepuka kuifanya maana iwe kitendo kimoja tu cha zamani.
- source_word: διώκτην
  choice: mtesaji
  rationale: Hili ni neno la kawaida na la moja kwa moja kwa mtu anayewatesa wengine kwa sababu ya imani yao.
- source_word: ὑβριστήν
  choice: mtu mwenye jeuri
  rationale: Huwasilisha tabia ya kudhulumu kwa ukali na kwa matusi au ufidhuli, si kiburi tu. Maana mbadala zimewekwa katika tanbihi.
- source_word: ἠλεήθην
  choice: nilionyeshwa rehema
  rationale: Muundo wa kutendwa unahifadhi kwamba rehema ilitendwa kwa Paulo, bila kumtaja mtendaji ambaye Kigiriki hakumtaji wazi hapa.
- source_word: ὅτι
  choice: kwa sababu
  rationale: Huhifadhi uhusiano wa kisababishi au maelezo uliopo katika Kigiriki bila kudai kwamba kutokujua kulistahili rehema.
- source_word: ἀγνοῶν ἐποίησα
  choice: nilitenda bila kujua
  rationale: Huhifadhi kitendo pamoja na hali ya kutokujua kwa Kiswahili cha kawaida, bila kuweka kitu kisichotajwa kama yambwa wa kitenzi.
- source_word: ἐν ἀπιστίᾳ
  choice: katika kutokuamini
  rationale: Katika muktadha huu maana kuu ni ukosefu wa imani; muundo huu pia unadumisha kwa kiasi fulani umbo la kirai cha Kigiriki.
theological_decisions:
- issue: Uhusiano wa ὅτι na rehema aliyoonyeshwa Paulo
  choice: “kwa sababu” linaonyesha kwamba Paulo anataja kutenda bila kujua katika kutokuamini kuwa sababu au maelezo yanayohusiana na kuonyeshwa rehema.
  alternative: Kulitafsiri kama hali ya maelezo tu, bila nguvu ya kisababishi.
  rationale: ὅτι kwa kawaida lina maana ya kisababishi au maelezo hapa. Tafsiri haiongezi kwamba ujinga ulistahili rehema, wala haisuluhishi mvutano wa kiteolojia uliomo katika kauli hiyo.
- issue: Maana ya ἀπιστία
  choice: kutokuamini
  alternative: kutokuwa mwaminifu
  rationale: Muktadha unaelekea zaidi kwenye ukosefu wa imani kuliko kutokuwa mwaminifu kwa agano, lakini maana mbadala halali imeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Orodha ya sifa imewekewa koma kwa mtiririko wa asili; “hapo kwanza” huunganisha mstari huu na muktadha wa mstari uliotangulia.
