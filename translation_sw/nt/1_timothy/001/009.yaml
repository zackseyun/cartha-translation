id: 1TI.1.9
reference: 1 Timothy 1:9
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἰδὼς τοῦτο, ὅτι δικαίῳ νόμος οὐ κεῖται, ἀνόμοις δὲ καὶ ἀνυποτάκτοις, ἀσεβέσι καὶ ἁμαρτωλοῖς, ἀνοσίοις καὶ βεβήλοις, πατρολῴαις καὶ μητρολῴαις, ἀνδροφόνοις,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/009.yaml
  text: 'understanding this: the law is not laid down for a righteous man, but for the lawless and rebellious, the ungodly and sinful, the unholy and profane, those who kill their fathers and those who kill their mothers, murderers,'
translation:
  language: sw
  text: 'akijua hili: sheria haijawekwa kwa ajili ya mtu mwadilifu, bali kwa ajili ya waasi wa sheria na wakaidi, wasiomcha Mungu na wenye dhambi, wasio watakatifu na wanaodharau mambo matakatifu, wanaowaua baba zao na wanaowaua mama zao,[a] na wauaji,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au labda, “wanaowapiga baba zao na wanaowapiga mama zao.” Maneno ya Kigiriki yanaweza kumaanisha kuwashambulia wazazi kwa nguvu, ingawa katika muktadha huu maana ya “kuua” inaelekea kufaa.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς τοῦτο
  choice: tukijua hili
  rationale: Kirai tegemezi kinaendeleza wazo la muktadha na kuhifadhi maana ya kujua au kutambua jambo hili.
- source_word: δικαίῳ
  choice: kwa ajili ya mtu mwadilifu
  rationale: Huhifadhi umoja wa kivumishi cha Kigiriki huku ‘mtu’ ikifanya usemi wa jumla uwe wa kawaida katika Kiswahili.
- source_word: νόμος οὐ κεῖται
  choice: sheria haijawekwa
  rationale: Huhifadhi taswira ya κεῖται ya kuwekwa au kuainishwa, bila kufasiri zaidi kuwa sheria ‘haitumiki.’
- source_word: ἀνόμοις
  choice: waasi wa sheria
  rationale: Hutoa wazi maana ya watu wanaokataa au kuvunja sheria; ‘wasio na sheria’ ingeweza kueleweka tu kuwa hawana sheria.
- source_word: ἀνυποτάκτοις
  choice: wakaidi
  rationale: Neno la kawaida na lenye nguvu kwa watu wanaokataa kutii au kujitiisha.
- source_word: ἀσεβέσι
  choice: wasiomcha Mungu
  rationale: Huwasilisha kwa lugha ya kawaida ukosefu wa uchaji na heshima kwa Mungu.
- source_word: ἁμαρτωλοῖς
  choice: wenye dhambi
  rationale: Huhifadhi kundi la watu katika orodha na ni usemi wa kawaida wa Kiswahili.
- source_word: ἀνοσίοις
  choice: wasio watakatifu
  rationale: Huhifadhi wazo la kutokuwa watakatifu na kulitofautisha na ukosefu wa uchaji katika ἀσεβέσι.
- source_word: βεβήλοις
  choice: wanaodharau mambo matakatifu
  rationale: Hueleza kwa Kiswahili cha kawaida maana ya kuyafanya au kuyachukulia mambo matakatifu kuwa ya kawaida na yasiyo na heshima.
- source_word: πατρολῴαις
  choice: wanaowaua baba zao
  rationale: Katika orodha hii maana ya kuua inaelekea kufaa, lakini uwezekano wa kuwapiga au kuwashambulia kwa nguvu umehifadhiwa katika tanbihi.
- source_word: μητρολῴαις
  choice: wanaowaua mama zao
  rationale: Ni sambamba na πατρολῴαις; maana mbadala ya kuwapiga au kuwashambulia kwa nguvu imehifadhiwa katika tanbihi.
- source_word: ἀνδροφόνοις
  choice: wauaji
  rationale: Ni neno fupi, la kawaida, linalofaa katika orodha hii kwa watu wanaoua wengine kwa uhalifu.
theological_decisions:
- issue: Lugha ya umoja yenye maana ya uwakilishi katika δικαίῳ
  choice: mtu mwadilifu
  alternative: mwadilifu; mwanamume mwadilifu
  rationale: Kigiriki ni umoja wa kiume lakini hapa kina maana ya jumla. ‘Mtu mwadilifu’ huhifadhi umoja bila kudai kwamba rejeo linawahusu wanaume pekee.
- issue: Maana ya πατρολῴαις na μητρολῴαις
  choice: wanaowaua baba zao na wanaowaua mama zao
  alternative: wanaowapiga baba zao na wanaowapiga mama zao
  rationale: Maneno hayo adimu yanaweza kumaanisha kuwashambulia wazazi kwa nguvu au kuwaua. Muktadha wa orodha ya maovu unaunga mkono ‘kuua,’ lakini utata wa kileksika umeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo wa orodha na jozi za maneno umehifadhiwa kadiri ya ufasaha; maneno ya kitaalamu yasiyo ya kawaida yameepukwa.
