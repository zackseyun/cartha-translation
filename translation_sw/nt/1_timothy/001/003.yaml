id: 1TI.1.3
reference: 1 Timothy 1:3
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καθὼς παρεκάλεσά σε προσμεῖναι ἐν Ἐφέσῳ, πορευόμενος εἰς Μακεδονίαν, ἵνα παραγγείλῃς τισὶν μὴ ἑτεροδιδασκαλεῖν
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/003.yaml
  text: Just as I urged you to remain in Ephesus when I was going into Macedonia[a], so that you might instruct certain people not to teach different doctrine,
translation:
  language: sw
  text: Kama nilivyokusihi ubaki Efeso nilipokuwa nikielekea Makedonia, ili uwaagize watu fulani wasifundishe mafundisho tofauti,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καθὼς
  choice: Kama
  rationale: Huanzisha kumbukumbu ya ombi la awali na kudumisha uhusiano wa sentensi unaoendelea katika muktadha.
- source_word: παρεκάλεσά
  choice: nilivyokusihi
  rationale: ‘Kusihi’ huonyesha ombi la dhati bila kulifanya moja kwa moja kuwa amri.
- source_word: προσμεῖναι
  choice: ubaki
  rationale: Hutoa kwa kawaida maana ya kuendelea kukaa mahali fulani.
- source_word: ἐν Ἐφέσῳ
  choice: Efeso
  rationale: Jina la mahali linalotumiwa kwa kawaida katika Kiswahili; kitenzi ‘kubaki’ kinaweza kuchukua mahali bila kihusishi.
- source_word: πορευόμενος εἰς Μακεδονίαν
  choice: nilipokuwa nikielekea Makedonia
  rationale: Hufanya wazi hali ya wakati ya tendo la Paulo la kusafiri, huku ‘kuelekea’ ikihifadhi mwelekeo wa εἰς.
- source_word: ἵνα
  choice: ili
  rationale: Huonyesha kusudi kwa Kiswahili cha kawaida na fasaha.
- source_word: παραγγείλῃς
  choice: uwaagize
  rationale: ‘Kuagiza’ huhifadhi uzito wa maelekezo yenye mamlaka kuliko ‘kufundisha’ au ‘kushauri,’ bila ulazima wa kutumia ‘kuamuru’ yenye ukali zaidi.
- source_word: τισὶν
  choice: watu fulani
  rationale: Hurejelea watu mahususi lakini wasiotajwa majina kwa njia ya kawaida katika Kiswahili.
- source_word: ἑτεροδιδασκαλεῖν
  choice: wasifundishe mafundisho tofauti
  rationale: Huhifadhi wazo la kufundisha fundisho lililo tofauti bila kuongeza moja kwa moja hukumu ya ‘uongo’ ambayo haijatamkwa wazi katika neno lenyewe.
theological_decisions:
- issue: Uzito wa παραγγείλῃς katika mazingira ya kurekebisha mafundisho ya kanisa
  choice: uwaagize
  alternative: uwaamuru
  rationale: Muktadha una mamlaka iliyokabidhiwa kwa Timotheo, hivyo ‘kuagiza’ linaonyesha maelekezo yenye mamlaka. ‘Kuamuru’ linawezekana, lakini linaweza kusikika kali zaidi kuliko inavyohitajika.
- issue: Jinsi ya kutafsiri ἑτεροδιδασκαλεῖν
  choice: wasifundishe mafundisho tofauti
  alternative: wasifundishe mafundisho ya uongo
  rationale: Muundo wa Kigiriki unasisitiza tofauti na kiwango cha mafundisho ya kitume. ‘Ya uongo’ ingefanya hukumu iliyodokezwa na muktadha kuwa sehemu ya wazi ya neno lenyewe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini kinachoeleweka kwa urahisi. Sentensi imeachwa ikiendelea kwa koma kwa sababu mstari wa Kigiriki ni sehemu ya muundo unaoendelea katika mstari unaofuata.
