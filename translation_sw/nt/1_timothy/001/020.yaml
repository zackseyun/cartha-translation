  text: ὧν ἐστιν Ὑμέναιος καὶ Ἀλέξανδρος, οὓς παρέδωκα τῷ Σατανᾷ ἵνα παιδευθῶσι μὴ βλασφημεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/020.yaml
  text: among whom are Hymenaeus and Alexander[b][a], whom I have handed over to Satan so that they may be taught not to blaspheme.
translation:
  language: sw
  text: Miongoni mwao wamo Himenayo na Aleksanda, ambao nimewatia mikononi mwa Shetani[a] ili waadibishwe wasikufuru.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nimewakabidhi kwa Shetani.” Kauli hii huenda ikarejelea hatua kali ya nidhamu yenye kusudi la kuwarekebisha, si hukumu ya mwisho.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kigiriki linaweza pia kutafsiriwa “wafundishwe,” “warekebishwe,” au “wafunzwe”; linahusisha mafunzo yanayotolewa kwa njia ya marekebisho.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧν ἐστιν
  choice: Miongoni mwao wamo
  rationale: Huhifadhi maana ya sehemu ya kundi lililotajwa awali, huku ikiwa Kiswahili cha kawaida na chenye hadhi.
- source_word: Ὑμέναιος καὶ Ἀλέξανδρος
  choice: Himenayo na Aleksanda
  rationale: Majina yamenukuliwa kwa namna iliyozoeleka katika Kiswahili cha Biblia.
- source_word: οὓς παρέδωκα τῷ Σατανᾷ
  choice: ambao nimewakabidhi kwa Shetani
  rationale: ‘Nimewakabidhi’ huhifadhi nguvu ya παραδίδωμι na uhusiano wake na matokeo yanayoendelea, bila kufafanua kimadhehebu namna tendo hilo lilivyotekelezwa.
- source_word: ἵνα παιδευθῶσι
  choice: ili wafundishwe kwa nidhamu
  rationale: Kauli hii huunganisha mafunzo na marekebisho ya kinidhamu, maana zote zilizomo katika παιδεύω katika muktadha huu.
- source_word: μὴ βλασφημεῖν
  choice: wasikufuru
  rationale: ‘Kukufuru’ huhifadhi uzito wa kidini wa βλασφημέω na ni neno linaloeleweka katika Kiswahili sanifu.
theological_decisions:
- issue: Maana ya ‘kuwakabidhi kwa Shetani’
  choice: Maneno yamehifadhiwa kwa ukaribu bila kubainisha utaratibu maalumu; kusudi lake la kurekebisha linaonekana katika kishazi kinachofuata.
  alternative: Kuyafafanua moja kwa moja kuwa kutengwa na ushirika wa kanisa, kupewa mateso ya kimwili kimiujiza, au kuhukumiwa milele.
  rationale: Kishazi cha kusudi kinaonyesha lengo la kinidhamu na kurekebisha, lakini andiko lenyewe halielezi utaratibu wake; hivyo utata na mvutano wa kiteolojia vinahifadhiwa.
- issue: Upeo wa παιδευθῶσι
  choice: wafundishwe kwa nidhamu
  alternative: waadhibiwe; wafundishwe; warekebishwe
  rationale: Tafsiri iliyochaguliwa haipunguzi neno kuwa mafunzo ya kiakili pekee wala kulifanya adhabu tupu; inadumisha wazo la marekebisho yenye kusudi la kufundisha.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Wamo’ hutumiwa kwa watu walio miongoni mwa kundi. Mpangilio wa alama za tanbihi umewekwa karibu na vifungu vinavyohusika, na kila alama iliyo katika tanbihi imo pia katika matini kuu.
