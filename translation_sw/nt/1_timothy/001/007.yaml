  text: θέλοντες εἶναι νομοδιδάσκαλοι, μὴ νοοῦντες μήτε ἃ λέγουσιν μήτε περὶ τίνων διαβεβαιοῦνται.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/007.yaml
  text: wanting to be teachers of the law[b][a], though they understand neither what they are saying nor the things about which they speak so confidently.
translation:
  language: sw
  text: Wakitaka kuwa walimu wa sheria[b], ingawa hawaelewi mambo wanayosema wala mambo wanayoyadai kwa msisitizo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hawaelewi wanayosema wala mambo wanayoyadai kwa uthabiti.”
    reason: lexical_alternative
  - marker: b
    text: Huenda “walimu wa sheria” wakawa wale waliodai kuwa na mamlaka ya kufundisha sheria ya Kiyahudi, yaani Torati.
    reason: cultural_note
lexical_decisions:
- source_word: θέλοντες
  choice: wakitaka
  rationale: Kitenzi-shirikishi cha wakati uliopo kinaonyesha nia yao inayoendelea na kinaunganisha sentensi hii na wahusika wa mstari uliotangulia.
- source_word: εἶναι
  choice: kuwa
  rationale: Hiki ndicho kisawe cha kawaida cha kitenzi-jina kinachokamilisha maana ya θέλοντες.
- source_word: νομοδιδάσκαλοι
  choice: walimu wa sheria
  rationale: Kinahifadhi maana ya nomino ambatani bila kuingiza neno 'Musa' au 'Torati' katika matini kuu.
- source_word: μὴ νοοῦντες
  choice: ingawa hawaelewi
  rationale: 'Muundo wa ''ingawa'' unaonyesha kwa Kiswahili fasaha utofauti uliokusudiwa: wanataka kufundisha, lakini hawana uelewa.'
- source_word: μήτε ... μήτε
  choice: wala ... wala
  rationale: Muundo huu wa Kiswahili unawakilisha ukanushaji sawia wa vipengele viwili.
- source_word: ἃ λέγουσιν
  choice: mambo wanayosema
  rationale: Unarejelea maudhui ya maneno yao kwa lugha ya kawaida na iliyo wazi.
- source_word: περὶ τίνων
  choice: yale
  rationale: Kiwakilishi hiki kinarudisha kwa ufupi mambo wanayoyazungumzia; uhusiano kamili unaonyeshwa na kitenzi kinachofuata.
- source_word: διαβεβαιοῦνται
  choice: wanayoyasisitiza kwa uhakika
  rationale: Kinaonyesha tendo la kutoa madai kwa msisitizo na kujiamini, si kusema tu.
theological_decisions:
- issue: Rejeo la 'sheria' katika νομοδιδάσκαλοι
  choice: walimu wa sheria
  alternative: walimu wa Torati / walimu wa Sheria ya Musa
  rationale: Muktadha huenda ukarejelea Torati ya Kiyahudi, lakini nomino ya Kigiriki haisemi wazi 'Musa' wala 'Torati'; matini kuu inadumisha upana huo, huku tanbihi ikitoa muktadha unaowezekana.
- issue: Uhusiano wa μὴ νοοῦντες na nia yao ya kufundisha
  choice: ingawa hawaelewi
  alternative: bila kuelewa
  rationale: Tafsiri ya concessive inaweka wazi mvutano wa muktadha bila kubadili dai la kifungu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Walimu wa sheria' linaeleweka kwa urahisi huku likihifadhi kutotajwa wazi kwa Torati katika Kigiriki. Alama zote za tanbihi zimo katika matini kuu.
