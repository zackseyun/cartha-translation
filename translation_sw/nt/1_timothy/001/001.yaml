lexical_decisions:
- source_word: Παῦλος
  choice: Paulo
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili cha Biblia.
- source_word: ἀπόστολος
  choice: mtume
  rationale: Neno hili huhifadhi maana ya mtu aliyetumwa kwa mamlaka na pia cheo kinachotambulika katika Agano Jipya.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Masihi Yesu
  rationale: Χριστός hapa bado ina nguvu ya cheo; “Masihi” hutafsiri cheo hicho, huku “Yesu” likihifadhiwa kama jina.
- source_word: κατ’ ἐπιταγὴν
  choice: kwa amri
  rationale: Kirai hiki kinaonyesha kwamba utume wa Paulo unatokana na agizo lenye mamlaka; “kwa amri” ni cha asili na wazi katika Kiswahili.
- source_word: θεοῦ σωτῆρος ἡμῶν
  choice: Mungu Mwokozi wetu
  rationale: Muundo huu unamhusisha Mungu moja kwa moja na jina la cheo “Mwokozi wetu” bila kuongeza maelezo yasiyokuwapo katika Kigiriki.
- source_word: καὶ Χριστοῦ Ἰησοῦ
  choice: na ya Masihi Yesu
  rationale: Kurudia “ya” kunaonyesha kwa Kiswahili kwamba kirai hiki pia kinategemea “amri,” kama ilivyo katika mnyororo wa hali ya umilikaji wa Kigiriki.
- source_word: τῆς ἐλπίδος ἡμῶν
  choice: tumaini letu
  rationale: “Tumaini” huhifadhi maana pana ya ἐλπίς na hapa linatumika kama jina la maelezo linalomtambulisha Masihi Yesu.
theological_decisions:
- issue: Ufasiri wa Χριστός
  choice: Masihi
  alternative: Kristo
  rationale: Katika salamu hii neno hilo linaendelea kufanya kazi kama cheo cha Yesu. “Masihi” hutafsiri cheo hicho; tanbihi inahifadhi “Kristo” kama umbo mbadala lililozoeleka.
- issue: Uhusiano wa “tumaini letu” na Masihi Yesu
  choice: 'Kirai cha maelezo: “Masihi Yesu, tumaini letu”'
  alternative: “Masihi Yesu, ambaye ndiye tumaini letu”
  rationale: Muundo mfupi huhifadhi uhusiano wa moja kwa moja wa Kigiriki bila kuupanua kuwa kishazi cha ufafanuzi.
- issue: Chanzo cha amri
  choice: “Mungu Mwokozi wetu na ya Masihi Yesu”
  alternative: Muundo mfupi usiorudia “ya”
  rationale: Kigiriki huunganisha virai viwili vya hali ya umilikaji chini ya “amri.” Kurudia “ya” kunafanya uhusiano huo uwe wazi na wa kawaida katika Kiswahili bila kubadili maana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. “Mtume,” “Mwokozi,” “Masihi,” na “tumaini” ni maneno yaliyozoeleka katika matumizi ya Kikristo bila kuingiza msimamo maalumu wa dhehebu.
