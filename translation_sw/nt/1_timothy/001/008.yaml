translation:
  language: sw
  text: Lakini tunajua kwamba sheria ni njema ikiwa mtu anaitumia kisheria[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ikiwa mtu anaitumia ipasavyo” au “ikiwa mtu anaitumia kwa halali.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἴδαμεν
  choice: tunajua
  rationale: Umbo οἶδα lina maana ya wakati wa sasa na linaonyesha ujuzi thabiti; “tunajua” ni tafsiri ya kawaida na ya asili.
- source_word: δὲ
  choice: Lakini
  rationale: δέ ni kiunganishi cha mpito chenye uzito mdogo. Katika muktadha huu “Lakini” linaonyesha ulinganisho na matumizi mabaya ya sheria yaliyotangulia bila kuleta neno la wakati lisilokuwamo katika Kigiriki.
- source_word: ὅτι
  choice: kwamba
  rationale: Linaanzisha maudhui ya jambo linalojulikana.
- source_word: καλὸς
  choice: njema
  rationale: Linaeleza sifa chanya ya sheria; “njema” ni ya asili na haibani maana kuwa ya maadili pekee.
- source_word: ὁ νόμος
  choice: sheria
  rationale: Huhifadhi kutotajwa wazi kama ni Sheria ya Musa au sheria kwa maana pana; muktadha ndio unaoongoza upeo wake.
- source_word: ἐάν τις
  choice: ikiwa mtu
  rationale: Ni sharti la jumla katika umoja; “mtu” ni njia ya kawaida ya Kiswahili ya kumrejelea yeyote bila kubadili kuwa wingi.
- source_word: αὐτῷ
  choice: anaitumia
  rationale: Kiwakilishi kinarejelea sheria na kimewasilishwa kwa kiambishi cha yambwa -i- katika kitenzi, kama Kiswahili cha asili kinavyotaka.
- source_word: νομίμως
  choice: kwa halali
  rationale: Huhifadhi wazo la kutenda kulingana na sheria au kanuni inayofaa na, kwa kiasi kinachowezekana katika Kiswahili, uhusiano wa kimatamshi na “sheria.”
- source_word: χρῆται
  choice: anaitumia
  rationale: χράομαι humaanisha kutumia; “anaitumia” ni fupi, wazi, na ya kawaida.
theological_decisions:
- issue: Upeo wa maana ya “sheria”
  choice: sheria
  alternative: Sheria ya Musa; sheria kwa ujumla
  rationale: Ingawa muktadha huenda ukalenga hasa Sheria ya Musa, Kigiriki kinasema tu “sheria.” Tafsiri haiongezi ufafanuzi wa kimafundisho ambao kifungu hakijaweka wazi.
- issue: Maana ya νομίμως
  choice: kwa halali
  alternative: ipasavyo; kwa njia inayokubalika
  rationale: “Kwa halali” huhifadhi uhusiano wa neno hili na sheria, huku tanbihi ikionyesha maana mbadala ya matumizi yanayofaa bila kuamua hasa kiwango au kanuni inayokusudiwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Kiunganishi “Lakini” kimetumika kuwakilisha δέ kama mpito wenye ulinganisho mdogo. Alama ya tanbihi imewekwa baada ya kishazi kinachohusika ili mbadala zake zihusishwe na matumizi ya sheria, si na neno “njema” pekee.
