id: 1TI.1.16
reference: 1 Timothy 1:16
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀλλὰ διὰ τοῦτο ἠλεήθην, ἵνα ἐν ἐμοὶ πρώτῳ ἐνδείξηται ⸂Χριστὸς Ἰησοῦς⸃ τὴν ⸀ἅπασαν μακροθυμίαν, πρὸς ὑποτύπωσιν τῶν μελλόντων πιστεύειν ἐπ’ αὐτῷ εἰς ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/016.yaml
  text: But for this reason I received mercy[a], so that in me, as the foremost[d][c][b], Messiah Jesus might display all his patience as a pattern for those who were going to believe in him for eternal life.
translation:
  language: sw
  text: Lakini kwa sababu hii nilipata rehema, ili kwangu mimi, niliye wa kwanza[a], Masihi[b] Yesu aonyeshe uvumilivu wake wote, ili niwe kielelezo kwa wale watakaomwamini[d] kwa ajili ya uzima wa milele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “niliye mkuu kuliko wote.” Katika muktadha, Paulo anarejelea kauli yake kwamba yeye ni wa kwanza kati ya wenye dhambi (aya ya 15).
    reason: lexical_alternative
  - marker: b
    text: Au, “Kristo Yesu.” Neno la Kigiriki Χριστός ni cheo kinachomaanisha “Masihi,” ingawa pia limezoeleka kutafsiriwa “Kristo.”
    reason: alternative_rendering
  - marker: d
    text: Au, “wale ambao wangemwamini.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠλεήθην
  choice: nilipata rehema
  rationale: Kauli hii ya kawaida ya Kiswahili huhifadhi hali ya kutendwa ya kitenzi bila kumtaja moja kwa moja mtendaji ambaye Kigiriki hakumtaji.
- source_word: πρώτῳ
  choice: niliye wa kwanza
  rationale: Huhifadhi maana ya msingi ya ‘wa kwanza’ na rejeo la muktadha kwa Paulo kama wa kwanza kati ya wenye dhambi, bila kuongeza moja kwa moja neno ‘mbaya zaidi’ katika aya hii.
- source_word: ἐνδείξηται
  choice: aonyeshe
  rationale: Ni usemi wa sasa na unaoeleweka unaowasilisha kusudi la kudhihirisha wazi.
- source_word: Χριστὸς Ἰησοῦς
  choice: Masihi Yesu
  rationale: Χριστός ni cheo chenye maana ya Masihi hapa; tafsiri hii huhifadhi maana ya cheo hicho.
- source_word: ἅπασαν μακροθυμίαν
  choice: uvumilivu wote
  rationale: ‘Uvumilivu’ huonyesha kujizuia kwa subira, huku ‘wote’ ikihifadhi msisitizo wa ἅπασαν.
- source_word: ὑποτύπωσιν
  choice: kielelezo
  rationale: Neno hili linaonyesha mfano au muundo unaowekwa mbele kwa ajili ya wengine.
- source_word: τῶν μελλόντων πιστεύειν
  choice: wale watakaomwamini
  rationale: Wakati ujao wa Kiswahili huwasilisha matarajio ya waamini waliofuata baada ya tukio la Paulo kwa lugha ya kawaida.
- source_word: πιστεύειν ἐπ’ αὐτῷ
  choice: watakaomwamini
  rationale: Kitenzi ‘kumwamini’ ni muundo wa kawaida wa Kiswahili kwa kuamini au kuweka tumaini katika mtu.
- source_word: εἰς ζωὴν αἰώνιον
  choice: kwa uzima wa milele
  rationale: ‘Kwa’ huhifadhi kwa ufupi mwelekeo au lengo la εἰς bila kulazimisha iwapo uzima unaelezwa hasa kama lengo au matokeo.
theological_decisions:
- issue: Tafsiri ya Χριστός
  choice: Masihi Yesu
  alternative: Kristo Yesu
  rationale: ‘Masihi’ huonyesha wazi cheo na maana ya Χριστός; ‘Kristo’ pia ni namna iliyozoeleka katika Kiswahili na imetajwa katika tanbihi.
- issue: Mtendaji wa rehema na mwenye kuonyesha uvumilivu
  choice: Kauli ‘nilipata rehema’ haimtaji mtendaji, huku kishazi cha kusudi kikimtaja Masihi Yesu kuwa ndiye anayeonyesha uvumilivu ndani ya Paulo.
  alternative: Kumtaja Mungu waziwazi kuwa mtendaji wa rehema
  rationale: Kigiriki kimetumia hali ya kutendwa bila kumtaja mtendaji. Tafsiri haiongezi jina lisilokuwapo, wala haifuti nafasi iliyo wazi ya Masihi Yesu katika kishazi kinachofuata.
- issue: Maana ya πρώτῳ
  choice: wa kwanza
  alternative: mkuu kuliko wote / mbaya kuliko wote
  rationale: Muktadha wa aya ya 15 unaelekeza kwa Paulo kama wa kwanza kati ya wenye dhambi, lakini aya hii yenyewe inaweza kusikika pia kwa wazo la kuwa mfano wa kwanza. Tafsiri kuu huhifadhi mvutano huo, na tanbihi hueleza maana ya kimuktadha.
- issue: Uhusiano wa kuamini na uzima wa milele
  choice: watakaomwamini kwa uzima wa milele
  alternative: watakaomwamini na kupata uzima wa milele
  rationale: Muundo wenye ‘kwa’ huhifadhi kwa karibu εἰς na kuepuka kubadili kimya kimya mwelekeo huo kuwa kauli kamili ya matokeo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Masihi,’ ‘rehema,’ na ‘kielelezo’ ni maneno ya kawaida katika sajili ya Biblia; sentensi imeweka karibu muundo wa kusudi wa Kigiriki huku ikiepuka lugha ya kizamani.
