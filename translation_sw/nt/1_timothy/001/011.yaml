    issue: Aspect of “nimekabidhiwa”
    rationale: The Greek ἐπιστεύθην is aorist passive. “Nimekabidhiwa” is perfect and can imply continuing present relevance; “nilikabidhiwa” more directly represents the past commissioning event while retaining the passive sense.
