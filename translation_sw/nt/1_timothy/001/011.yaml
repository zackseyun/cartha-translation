  text: according to the gospel of the glory of the blessed God[a], which was entrusted to me.
translation:
  language: sw
  text: kulingana na injili ya utukufu wa Mungu mwenye heri[a], ambayo nilikabidhiwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa usemi wa kawaida zaidi, “injili tukufu ya Mungu mwenye heri.”
    reason: alternative_reading
lexical_decisions:
- source_word: κατὰ
  choice: kulingana na
  rationale: Katika muktadha huu, κατά pamoja na hali ya accusative huonyesha kiwango au kanuni inayopimia yaliyotangulia; “kulingana na” ni tafsiri ya kawaida na sahihi.
- source_word: εὐαγγέλιον
  choice: injili
  rationale: “Injili” ni neno lililozoeleka na kueleweka katika Kiswahili cha Biblia, nalo linadumisha uzito wa matumizi ya Paulo kuliko usemi wa jumla zaidi “habari njema.”
- source_word: τῆς δόξης
  choice: ya utukufu
  rationale: Muundo wa genitive umehifadhiwa badala ya kugeuzwa kuwa kivumishi “tukufu,” ili kutofunga maana kuwa ya kimaelezo pekee.
- source_word: μακαρίου
  choice: mwenye heri
  rationale: Kwa kurejelea Mungu, “mwenye heri” huonyesha hali yake ya kubarikiwa na ukamilifu bila kudokeza kwamba amebarikiwa na mwingine; “mwenye furaha” lingekuwa jepesi mno.
- source_word: θεοῦ
  choice: Mungu
  rationale: Ni tafsiri ya moja kwa moja ya θεός katika genitive ndani ya kirai hiki.
- source_word: ὃ
  choice: ambayo
  rationale: Kiwakilishi hiki kinarejelea “injili” na kuanzisha kishazi kinachoeleza kile ambacho Paulo alikabidhiwa.
- source_word: ἐπιστεύθην
  choice: nimekabidhiwa
  rationale: Hapa kitenzi katika hali ya passive kina maana ya kukabidhiwa kitu au jukumu, si kuamini. Kiswahili huruhusu kitu kilichokabidhiwa kutangulia katika kishazi hiki.
- source_word: ἐγώ
  choice: ni- katika “nimekabidhiwa”
  rationale: Kiswahili huonyesha nafsi ya kwanza kwa kiambishi cha kitenzi. Mkazo wa kiwakilishi cha Kigiriki haujaongezewa neno lisilo la lazima, kwa kuwa muktadha unamtambulisha Paulo wazi.
theological_decisions:
- issue: Uhusiano wa genitive katika τὸ εὐαγγέλιον τῆς δόξης τοῦ μακαρίου θεοῦ
  choice: injili ya utukufu wa Mungu mwenye heri
  alternative: injili tukufu ya Mungu mwenye heri
  rationale: Tafsiri kuu inadumisha muundo wa Kigiriki “injili ya utukufu,” hivyo inaacha wazi kama utukufu ni maudhui, sifa, au uhusiano mwingine wa injili na Mungu. Tafsiri ya kivumishi, iliyo ya kawaida zaidi, imetolewa katika tanbihi.
- issue: Maana ya ἐπιστεύθην
  choice: nimekabidhiwa
  alternative: niliamini
  rationale: Katika muundo huu wa passive wenye injili kama kitu kinachorejelewa, maana ni kupewa amana au jukumu. Muktadha wa Paulo kuhusu usimamizi wa injili unaunga mkono maana hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Muundo “ya utukufu” umehifadhiwa kwa makusudi ili kudumisha utata halisi wa genitive ya Kigiriki.
