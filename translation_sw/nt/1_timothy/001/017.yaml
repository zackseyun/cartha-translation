id: 1TI.1.17
reference: 1 Timothy 1:17
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: τῷ δὲ βασιλεῖ τῶν αἰώνων, ἀφθάρτῳ, ἀοράτῳ, ⸀μόνῳ θεῷ, τιμὴ καὶ δόξα εἰς τοὺς αἰῶνας τῶν αἰώνων· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/017.yaml
  text: To the King of the ages[a], immortal, invisible, the only God, be honor and glory forever and ever. Amen.
translation:
  language: sw
  text: Na heshima na utukufu viwe kwa Mfalme wa enzi zote, asiyeharibika, asiyeonekana, Mungu wa pekee[a], milele na milele. Amina.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Baadhi ya hati zinasomeka: “Mungu wa pekee mwenye hekima.”'
    reason: textual_variant
lexical_decisions:
- source_word: βασιλεῖ τῶν αἰώνων
  choice: Mfalme wa enzi zote
  rationale: Huhifadhi wazo la enzi au vipindi vyote katika muundo wa Kigiriki, huku ikieleza kwa Kiswahili cha kawaida ukuu wa Mungu katika nyakati zote.
- source_word: ἀφθάρτῳ
  choice: asiyeharibika
  rationale: Hueleza kutopatwa na uharibifu au maangamizi kwa usahihi zaidi kuliko ‘asiyeweza kufa,’ ambalo lingeweza kuelekea zaidi kwenye maana ya ἀθάνατος.
- source_word: ἀοράτῳ
  choice: asiyeonekana
  rationale: Ni tafsiri ya kawaida na iliyo wazi ya sifa ya Mungu kuwa haonekani.
- source_word: μόνῳ θεῷ
  choice: Mungu wa pekee
  rationale: Hufuata moja kwa moja ungamo la maandishi kwamba yeye ndiye Mungu pekee bila kuongeza neno lisilopatikana katika matini teule.
- source_word: τιμὴ καὶ δόξα
  choice: heshima na utukufu
  rationale: Ni jozi ya maneno iliyo sahihi, ya asili, na inayofaa mtindo wa sifa kwa Mungu.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: milele na milele
  rationale: Ni nahau ya Kiswahili inayowasilisha kwa kawaida na kwa nguvu muda usio na mwisho.
- source_word: ἀμήν
  choice: Amina
  rationale: Ni umbo lililozoeleka katika Biblia na ibada za Kiswahili.
- source_word: δὲ
  choice: Na
  rationale: Huwakilisha kwa upole kiunganishi kinachoingiza mwitikio wa sifa bila kuongeza dhana ya wakati kama ‘sasa.’
theological_decisions:
- issue: Kuhifadhi nguvu ya ungamo la Mungu mmoja katika μόνῳ θεῷ
  choice: Mungu wa pekee
  alternative: Mungu peke yake
  rationale: Uteuzi huu unasema wazi kile matini inachosema bila kuongeza ufafanuzi wa kimadhehebu au kutatua kimya kimya mvutano mpana wa kiteolojia.
- issue: Tofauti ya matini yenye σοφῷ (‘mwenye hekima’)
  choice: Neno ‘mwenye hekima’ halijaingizwa katika matini kuu
  alternative: Mungu wa pekee mwenye hekima
  rationale: SBLGNT iliyotolewa haina σοφῷ; lakini usomaji huo una ushahidi wa hati na umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayofaa tamko la sifa. Muundo umegeuzwa kidogo ili ‘heshima na utukufu viwe kwa’ usikike kwa kawaida katika Kiswahili huku ukihifadhi uhusiano wa kisarufi wa Kigiriki.
