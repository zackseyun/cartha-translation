  text: πιστὸς ὁ λόγος καὶ πάσης ἀποδοχῆς ἄξιος, ὅτι Χριστὸς Ἰησοῦς ἦλθεν εἰς τὸν κόσμον ἁμαρτωλοὺς σῶσαι· ὧν πρῶτός εἰμι ἐγώ,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/015.yaml
  text: 'The saying is trustworthy and worthy of full acceptance: that Messiah Jesus came into the world to save sinners[b][a], of whom I am the foremost.'
translation:
  language: sw
  text: 'Usemi huu ni wa kuaminika na unastahili kukubaliwa kikamilifu: Masihi Yesu[a] alikuja ulimwenguni kuwaokoa wenye dhambi, nami ni wa kwanza[b] kati yao.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kristo Yesu.”
    reason: alternative_reading
  - marker: b
    text: Au, “mkuu wao” au “mbaya zaidi kati yao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστὸς ὁ λόγος
  choice: Usemi huu ni wa kuaminika
  rationale: Katika Nyaraka za Kichungaji, kirai hiki ni fomula inayotambulisha kauli ya kutegemewa. “Usemi huu” ni Kiswahili cha sasa na cha kawaida kuliko tafsiri ya moja kwa moja “neno hili” katika muktadha huu.
- source_word: πάσης ἀποδοχῆς ἄξιος
  choice: unastahili kukubaliwa kikamilifu
  rationale: “Kikamilifu” linaonyesha nguvu ya πάσης, huku “kukubaliwa” likiwakilisha ἀποδοχή kwa lugha ya kawaida na yenye hadhi.
- source_word: ὅτι
  choice: ':'
  rationale: Hapa ὅτι inatambulisha yaliyomo katika usemi, si sababu. Katika Kiswahili, nukta mbili zinatambulisha kauli hiyo kwa mtiririko wa asili bila kulazimisha “kwamba” baada ya fomula.
- source_word: Χριστὸς Ἰησοῦς
  choice: Masihi Yesu
  rationale: Χριστός lina maana ya cheo hapa; “Masihi” huhifadhi maana hiyo, huku “Yesu” likibaki jina.
- source_word: ἦλθεν εἰς τὸν κόσμον
  choice: alikuja ulimwenguni
  rationale: Hii ni njia ya asili ya Kiswahili ya kueleza kuja katika ulimwengu, huku ikihifadhi mwangwi wa kitheolojia wa kirai cha Kigiriki.
- source_word: ἁμαρτωλοὺς
  choice: wenye dhambi
  rationale: Kivumishi hiki kimetumiwa kama nomino kwa watu wanaotambulishwa kwa dhambi; “wenye dhambi” ni wazi, cha kawaida, na hakiongezi maelezo yasiyokuwapo.
- source_word: σῶσαι
  choice: kuwaokoa
  rationale: Katika muktadha huu wa wokovu, “kuokoa” ni kitenzi sahihi na kilichozoeleka kwa σῴζω.
- source_word: ὧν πρῶτός εἰμι ἐγώ
  choice: nami ni wa kwanza kati yao
  rationale: “Wa kwanza” huhifadhi taswira ya nafasi au daraja katika πρῶτος bila kuifasiri moja kwa moja kuwa “mbaya zaidi.” “Nami” linaonyesha msisitizo wa ἐγώ kwa Kiswahili cha asili.
theological_decisions:
- issue: Tafsiri ya Χριστός
  choice: Masihi Yesu
  alternative: Kristo Yesu
  rationale: Katika kauli hii Χριστός bado linaeleweka kama cheo. “Masihi” linaweka wazi maana hiyo; “Kristo” linawezekana ikiwa neno hilo litaeleweka kama sehemu ya jina lililozoeleka.
- issue: Maana ya πρῶτος miongoni mwa wenye dhambi
  choice: wa kwanza kati yao
  alternative: mbaya zaidi kati yao / mkuu wao
  rationale: Neno la Kigiriki linaweza kuonyesha wa kwanza kwa daraja au aliye mkuu. Tafsiri kuu inahifadhi utata huo badala ya kuamua kwamba Paulo anamaanisha moja kwa moja “mbaya zaidi.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo ni mfupi na wa kukaririwa, kama fomula ya chanzo; utata wa πρῶτος umehifadhiwa katika maandishi makuu na kufafanuliwa katika tanbihi.
