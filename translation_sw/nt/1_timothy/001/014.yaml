id: 1TI.1.14
reference: 1 Timothy 1:14
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὑπερεπλεόνασεν δὲ ἡ χάρις τοῦ κυρίου ἡμῶν μετὰ πίστεως καὶ ἀγάπης τῆς ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/014.yaml
  text: But the grace of our Lord overflowed all the more[a], with faith and love that are in Messiah Jesus.
translation:
  language: sw
  text: Lakini neema ya Bwana wetu ilifurika kwa wingi sana, pamoja na imani na upendo vilivyo katika Masihi Yesu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kristo Yesu.”
    reason: Tafsiri mbadala ya jina la cheo Χριστός iliyozoeleka katika Kiswahili.
lexical_decisions:
- source_word: ὑπερεπλεόνασεν
  choice: ilifurika kwa wingi sana
  rationale: Kitenzi hiki chenye msisitizo kinaonyesha kuzidi au kuongezeka kupita kiasi. Tafsiri hii inaleta picha ya kufurika na kuhifadhi kiwango chake cha juu kwa Kiswahili cha kawaida.
- source_word: δὲ
  choice: Lakini
  rationale: Kiunganishi hiki kinaonyesha utofauti na maelezo yaliyotangulia kuhusu kutokuamini na dhambi ya Paulo.
- source_word: χάρις
  choice: neema
  rationale: “Neema” ni neno la kawaida na linalofaa katika Kiswahili kwa fadhili ya Mungu inayotolewa bila kustahili.
- source_word: κυρίου
  choice: Bwana
  rationale: “Bwana” ndilo jina la cheo la kawaida la κύριος katika Agano Jipya na linahifadhi uzito wake wa kiungamo.
- source_word: μετὰ
  choice: pamoja na
  rationale: Huhifadhi uhusiano wa kisarufi kwamba neema ilifurika ikiandamana na imani na upendo, bila kulazimisha maelezo ya kisababishi.
- source_word: πίστεως
  choice: imani
  rationale: Katika muktadha huu πίστις ina maana ya moja kwa moja ya imani; si muundo unaobishaniwa wa πίστις Χριστοῦ.
- source_word: ἀγάπης
  choice: upendo
  rationale: “Upendo” ni tafsiri ya kawaida, ya sasa, na inayoeleweka ya ἀγάπη.
- source_word: τῆς ἐν Χριστῷ Ἰησοῦ
  choice: vilivyo katika Masihi Yesu
  rationale: Kiwakilishi cha wingi “vilivyo” kinaonyesha kwamba kirai hiki kinahusiana na imani na upendo kwa pamoja. “Katika” pia huhifadhi kwa makusudi upekee wa usemi wa Paulo.
- source_word: Χριστῷ Ἰησοῦ
  choice: Masihi Yesu
  rationale: Χριστός hapa inadumisha maana yake ya cheo, yaani Masihi, badala ya kuwasilishwa tu kama jina la pili.
theological_decisions:
- issue: Uhusiano wa “pamoja na imani na upendo” na “neema”
  choice: Neema ya Bwana inaelezwa kuwa ilifurika pamoja na imani na upendo vilivyo katika Masihi Yesu.
  alternative: Imani na upendo ni matokeo ambayo neema ilizalisha ndani ya Paulo.
  rationale: Muundo wa Kigiriki unaunganisha kirai cha μετά na neema inayofurika. Tafsiri inahifadhi uhusiano huo bila kukataa uwezekano wa kitheolojia kwamba neema ilizalisha sifa hizo.
- issue: Tafsiri ya Χριστός
  choice: Masihi
  alternative: Kristo
  rationale: “Masihi” huonyesha wazi maana ya cheo cha Kigiriki Χριστός; “Kristo” ni umbo la kimapokeo na limetolewa katika tanbihi kama mbadala unaojulikana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa sasa, wenye heshima na unaosomeka kwa urahisi. Usemi “ilifurika kwa wingi sana” umechaguliwa ili kuhifadhi msisitizo wa kitenzi cha Kigiriki bila kutumia lugha ya kizamani.
