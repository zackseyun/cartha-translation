lexical_decisions:
- source_word: ὧν
  choice: mambo hayo
  rationale: Kiwakilishi hiki cha urejeshi kinarejelea mambo yaliyotangulia katika mstari wa 5. ‘Mambo hayo’ kinaweka rejeo hilo wazi bila kulifafanua kwa namna finyu kupita ushahidi wa muktadha.
- source_word: τινες
  choice: Baadhi yao
  rationale: Kiwakilishi kisichotaja watu mahsusi kinaonyesha sehemu fulani isiyobainishwa; ‘baadhi yao’ ni Kiswahili cha kawaida na hudumisha kutotajwa kwao.
- source_word: ἀστοχήσαντες
  choice: kwa kuwa wamekosa
  rationale: Kitenzi kina wazo la kukosa shabaha au kutofikia lengo. ‘Wamekosa’ kinahifadhi taswira hiyo na kuhusishwa kwa kawaida na ‘mambo hayo.’
- source_word: ἐξετράπησαν
  choice: wamegeukia
  rationale: Umbo hili linaeleza kuacha njia ifaayo na kuelekea upande mwingine. ‘Wamegeukia’ huonyesha mwelekeo huo kwa Kiswahili cha asili.
- source_word: εἰς
  choice: -kia katika ‘wamegeukia’
  rationale: Kihusishi kinaonyesha mwelekeo au matokeo; maana yake imewasilishwa kwa kiambishi tamati cha kitenzi ‘wamegeukia.’
- source_word: ματαιολογίαν
  choice: maneno yasiyo na maana
  rationale: Neno hili hueleza usemi usio na faida, mtupu au usio na maana. Tafsiri hii ni wazi na ya sasa bila kuongeza aina mahsusi ya mafundisho.
theological_decisions:
- issue: Kitu kinachorejelewa na ὧν
  choice: Kinarejelea kwa ujumla mambo yaliyotangulia katika mstari wa 5, yakaitwa ‘mambo hayo.’
  alternative: Kukihusisha kwa namna finyu zaidi na moyo safi, dhamiri njema na imani isiyo na unafiki pekee, au kutafsiri kihalisi zaidi ‘ambayo.’
  rationale: Muundo wa sentensi unategemea muktadha uliotangulia. ‘Mambo hayo’ hudumisha urejeshi huo bila kulazimisha upeo finyu ambao maandishi yenyewe hayauweki wazi kabisa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imehifadhi mlolongo wa kukosa shabaha na kisha kugeukia usemi usiofaa, huku alama zote za tanbihi zikiwekwa katika matini kuu.
