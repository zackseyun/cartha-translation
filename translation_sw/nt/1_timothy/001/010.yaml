  yaml_path: translation/nt/1_timothy/001/010.yaml
  text: the sexually immoral, men who have sex with men,[a] servant traders, liars, perjurers, and whatever else is opposed to sound teaching,
translation:
  language: sw
  text: waasherati, wanaume wanaofanya ngono na wanaume,[a] wafanyabiashara wa watumwa, waongo, waapao kwa uongo, na chochote kingine kinachopingana na mafundisho yenye afya,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wanaume wanaojamiiana na wanaume.” Neno la Kigiriki ἀρσενοκοῖται ni adimu na maana yake kamili inajadiliwa, lakini linarejelea tendo la ngono kati ya wanaume.
    reason: alternative_reading
lexical_decisions:
- source_word: πόρνοις
  choice: waasherati
  rationale: Neno hili kwa upana linamaanisha watu wanaojihusisha na uasherati. “Waasherati” ni neno la kawaida, fupi, na lenye hadhi katika Kiswahili, bila kulibana kwa aina moja tu ya mwenendo wa kingono.
- source_word: ἀρσενοκοίταις
  choice: wanaume wanaofanya ngono na wanaume wenzao
  rationale: Tafsiri hii inaonyesha wazi kwamba neno adimu la Kigiriki linawahusu wanaume na tendo la ngono kati ya wanaume, bila kuingiza dhana ya kisasa ya utambulisho wa mtu. Tanbihi inadumisha tahadhari kuhusu upeo wake unaojadiliwa.
- source_word: ἀνδραποδισταῖς
  choice: wafanyabiashara wa watumwa
  rationale: Neno hili linawahusu wanaowapata, kuwateka, au kuwauza watu kama watumwa. “Wafanyabiashara wa watumwa” linaonyesha wazi biashara ya binadamu katika utumwa, si utekaji wa kawaida tu.
- source_word: ψεύσταις
  choice: waongo
  rationale: Hii ndiyo tafsiri ya kawaida na ya moja kwa moja ya watu wanaosema uongo.
- source_word: ἐπιόρκοις
  choice: waapao kwa uongo
  rationale: Neno linamaanisha watu wanaotoa kiapo cha uongo au kukiuka kiapo. Kirai hiki ni wazi zaidi kwa wasomaji wa kawaida kuliko istilahi ya kisheria.
- source_word: καὶ εἴ τι ἕτερον
  choice: na chochote kingine
  rationale: Kirai hiki kinapanua orodha na kujumuisha jambo jingine lolote la aina hiyo; tafsiri hii ni ya asili katika Kiswahili.
- source_word: τῇ ὑγιαινούσῃ διδασκαλίᾳ
  choice: mafundisho yenye uzima
  rationale: Hifadhi sitiari ya Kigiriki ya mafundisho yaliyo na afya au uzima, kwa Kiswahili cha kawaida na cha kibiblia bila kutumia istilahi nzito mno.
- source_word: ἀντίκειται
  choice: kinachopingana na
  rationale: Hutoa kwa asili maana ya kusimama kinyume cha au kuwa katika upinzani na kitu.
theological_decisions:
- issue: Tafsiri ya ἀρσενοκοίταις katika muktadha wenye mjadala wa kileksika na kiteolojia
  choice: wanaume wanaofanya ngono na wanaume wenzao
  alternative: wanaume wanaojamiiana na wanaume
  rationale: Chaguo kuu linalenga tendo la kingono kati ya wanaume, kama muundo wa neno la Kigiriki unavyoashiria, bila kulifanya kuwa jina la utambulisho wa kisasa. Kwa kuwa neno ni adimu na upeo wake kamili unajadiliwa, tanbihi inatoa namna nyingine ya kulisema na kueleza tahadhari hiyo.
- issue: Sitiari katika τῇ ὑγιαινούσῃ διδασκαλίᾳ
  choice: mafundisho yenye uzima
  alternative: mafundisho sahihi
  rationale: Chaguo kuu linahifadhi sitiari ya afya/uzima iliyomo katika Kigiriki; mbadala ungeeleza maana lakini ungeondoa sitiari hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi, na chenye hadhi. Muundo umehifadhi hali ya orodha inayoendelea kutoka mstari uliotangulia. Alama ya tanbihi [a] imewekwa mara baada ya kirai husika.
