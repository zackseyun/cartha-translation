id: 1TI.1.18
reference: 1 Timothy 1:18
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ταύτην τὴν παραγγελίαν παρατίθεμαί σοι, τέκνον Τιμόθεε, κατὰ τὰς προαγούσας ἐπὶ σὲ προφητείας, ἵνα ⸀στρατεύῃ ἐν αὐταῖς τὴν καλὴν στρατείαν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/018.yaml
  text: This charge I entrust to you[a], child Timothy, in accordance with the prophecies previously made about you, so that by them you may wage the good warfare[c][b],
translation:
  language: sw
  text: Agizo hili nakukabidhi, mwanangu Timotheo, kulingana na maneno ya unabii yaliyotolewa hapo awali kukuhusu[a], ili kwa hayo[b] uendeshe vita vyema[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “juu yako,” kwa maana ya maneno ya unabii yaliyosemwa juu ya Timotheo.
    reason: lexical_alternative
  - marker: b
    text: Au “kupitia hayo” au “ndani yake”; Kigiriki kinaweza kuonyesha njia inayotumiwa au mazingira ambamo jambo linafanyika.
    reason: lexical_alternative
  - marker: c
    text: Tafsiri iliyozoeleka ni “upigane vita vizuri.” Kigiriki kwa maana ya karibu zaidi husema “uendeshe vita vyema,” yaani kampeni au utumishi wa kijeshi ulio mwema.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγγελίαν
  choice: agizo
  rationale: Neno hili huonyesha maelekezo yenye mamlaka. “Agizo” linahifadhi uzito wa wajibu aliokabidhiwa Timotheo bila kuwa gumu kupita kiasi.
- source_word: παρατίθεμαί
  choice: nakukabidhi
  rationale: Kitenzi hiki hapa kina wazo la kuweka jambo chini ya uangalizi na wajibu wa mtu mwingine. “Nakukabidhi” ni usemi wa kawaida na wa heshima unaoonyesha dhamana hiyo.
- source_word: τέκνον
  choice: mwanangu
  rationale: Maana ya msingi ni “mtoto,” lakini hapa ni neno la upendo kwa mtoto wa kiroho. “Mwanangu” ni mwito wa asili katika Kiswahili na halazimishi nadharia zaidi kuhusu uhusiano huo.
- source_word: κατὰ
  choice: kulingana na
  rationale: Kihusishi hiki kinaonyesha kwamba agizo linapatana na au lina msingi katika maneno hayo ya unabii.
- source_word: προαγούσας
  choice: yaliyotolewa hapo awali
  rationale: Kirai hiki huonyesha kwamba maneno hayo ya unabii yalikuwa yametangulia. Tafsiri hii inatoa maana ya wakati kwa Kiswahili cha kawaida.
- source_word: ἐπὶ σὲ
  choice: kukuhusu
  rationale: Katika muktadha huu kirai kinaweza kuonyesha kuwa unabii ulimhusu Timotheo. Uwezekano wa maana ya “juu yako” umehifadhiwa katika tanbihi.
- source_word: προφητείας
  choice: maneno ya unabii
  rationale: Uwingi wa Kigiriki unaonyesha jumbe au matamko ya kinabii. “Maneno ya unabii” hufanya uwingi huo uwe wazi na wa kawaida kwa Kiswahili.
- source_word: στρατεύῃ
  choice: uendeshe
  rationale: Pamoja na “vita,” kitenzi hiki kinaonyesha kushiriki na kuendeleza kampeni ya kijeshi, si pambano moja tu. “Uendeshe vita” linahifadhi upana wa sitiari hiyo.
- source_word: ἐν αὐταῖς
  choice: kwa hayo
  rationale: Kirai kinaweza kueleza njia au mazingira ambamo Timotheo anatekeleza jukumu lake. “Kwa hayo” linaelekea kwenye maana ya njia huku tanbihi ikihifadhi uwezekano mwingine.
- source_word: τὴν καλὴν στρατείαν
  choice: vita vyema
  rationale: Tafsiri hii inadumisha sitiari ya kampeni au utumishi wa kijeshi badala ya kuibana iwe pambano moja tu. “Vyema” huonyesha sifa njema na inayostahili ya vita hivyo.
theological_decisions:
- issue: Jinsi unabii wa awali unavyohusiana na kukabidhiwa kwa Timotheo jukumu
  choice: Maneno ya unabii yaliyomhusu Timotheo yanahusishwa na agizo la Paulo na yanamwongoza au kumwezesha katika kutekeleza jukumu lake.
  alternative: Kusema wazi kwamba unabii huo ulikuwa tendo rasmi la kumweka Timotheo katika cheo, au kwamba ulikuwa faraja ya binafsi tu.
  rationale: Kigiriki kinaunganisha agizo, unabii wa awali, na vita vya Timotheo, lakini hakielezi kikamilifu utaratibu wa kikanisa au wa kisakramenti. Tafsiri haiongezi ufafanuzi huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wa heshima na unaoeleweka kwa wasomaji wa kawaida. “Mwanangu Timotheo” ni mwito wa upendo ulio wa asili katika Kiswahili; sitiari ya kijeshi imehifadhiwa bila kuifanya kuwa ya kishambulizi kupita maandishi ya Kigiriki.
