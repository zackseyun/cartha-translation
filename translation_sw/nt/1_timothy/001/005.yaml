lexical_decisions:
- source_word: τέλος
  choice: lengo
  rationale: Katika muktadha huu neno linaonyesha kusudi linalokusudiwa, si mwisho wa muda.
- source_word: παραγγελίας
  choice: agizo
  rationale: Neno hili linaweza kumaanisha agizo, amri, au maelekezo; “agizo” linaendana na jukumu alilopewa Timotheo katika muktadha wa karibu.
- source_word: ἀγάπη
  choice: upendo
  rationale: Hili ni neno la kawaida na la asili katika Kiswahili kwa dhana hii ya kimaadili na ya mahusiano.
- source_word: ἐκ
  choice: utokao katika
  rationale: Hapa kihusishi kinaonyesha chanzo ambacho upendo unatokea.
- source_word: καθαρᾶς καρδίας
  choice: moyo safi
  rationale: Huhifadhi maana ya ndani na ya kimaadili kwa lugha ya kawaida ya Kiswahili.
- source_word: συνειδήσεως ἀγαθῆς
  choice: dhamiri njema
  rationale: “Njema” inafuata kwa karibu kivumishi cha Kigiriki kuliko tafsiri fasiri kama “dhamiri safi.”
- source_word: πίστεως
  choice: imani
  rationale: “Imani” ndiyo maana inayofaa zaidi hapa, huku uwezekano wa “uaminifu” au “tumaini” ukihifadhiwa katika tanbihi.
- source_word: ἀνυποκρίτου
  choice: isiyo na unafiki
  rationale: Tafsiri hii huhifadhi kwa uwazi umbo na maana ya Kigiriki ya kutokuwa na unafiki.
- source_word: δὲ
  choice: haijaonyeshwa kwa neno tofauti
  rationale: Ni kiunganishi hafifu cha mpito au utofautishaji; kukiacha bila neno maalumu hapa kunatoa Kiswahili cha asili bila kuingiza alama ya wakati.
theological_decisions:
- issue: Maana ya πίστις katika πίστεως ἀνυποκρίτου
  choice: imani
  alternative: uaminifu au tumaini
  rationale: Muktadha unaunga mkono imani ya kweli kama mojawapo ya vyanzo vya upendo, lakini upana wa maana wa πίστις unaruhusu pia uaminifu au tumaini; uwezekano huo umehifadhiwa katika tanbihi.
