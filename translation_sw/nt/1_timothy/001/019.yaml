  yaml_path: translation/nt/1_timothy/001/019.yaml
  text: holding faith and a good conscience[a], which some, having rejected[b], have suffered shipwreck concerning the faith.
translation:
  language: sw
  text: ukiwa na imani na dhamiri njema, ambayo[a] wengine, baada ya kuikataa, wamevunjikiwa na meli katika imani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kisarufi, “ambayo” kwa kawaida inarejelea “dhamiri njema”; lakini wengine huichukulia kuwa inarejelea kwa upana zaidi “imani na dhamiri njema” pamoja.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔχων
  choice: ukiwa na
  rationale: Kirai cha hali kinamrejelea Timotheo, ambaye ndiye anayehimizwa katika mstari uliotangulia; ‘ukiwa na’ ni Kiswahili cha kawaida na huhifadhi wazo la kuendelea kuwa na imani na dhamiri njema.
- source_word: πίστιν
  choice: imani
  rationale: Katika muktadha huu neno linaelekea kumaanisha imani ya Kikristo; ‘imani’ pia huhifadhi uwezekano wa maana ya kumtumaini Mungu.
- source_word: ἀγαθὴν συνείδησιν
  choice: dhamiri njema
  rationale: Tafsiri hii inafuata kivumishi ἀγαθή moja kwa moja bila kuifinya maana kuwa dhamiri isiyosumbuliwa tu.
- source_word: ἥν
  choice: ambayo
  rationale: Kiwakilishi hiki cha umoja wa kike kinarejelea kwa kawaida nomino ya karibu συνείδησιν, ‘dhamiri’; Kiswahili ‘ambayo’ kinaonyesha rejeo hilo.
- source_word: ἀπωσάμενοι
  choice: wameikataa
  rationale: Neno la Kigiriki huonyesha tendo la makusudi la kuisukumia mbali au kuikataa; ‘wameikataa’ ni la asili na wazi katika Kiswahili cha sasa.
- source_word: περὶ τὴν πίστιν
  choice: kwa habari ya imani
  rationale: Kirai hiki huonyesha eneo au jambo ambalo maangamizi hayo yanahusu, bila kulazimisha maana kuwa imani binafsi au mfumo wa mafundisho pekee.
- source_word: ἐναυάγησαν
  choice: wamevunjikiwa na meli
  rationale: Huhifadhi sitiari hai ya ajali ya meli na kueleza kwamba wamepatwa na maangamizi katika jambo la imani.
theological_decisions:
- issue: Rejeo la ἥν
  choice: ‘ambayo’ inarejelea hasa ‘dhamiri njema.’
  alternative: Kukichukulia kiwakilishi hicho kuwa kinajumlisha ‘imani na dhamiri njema’ pamoja.
  rationale: ἥν ni kiwakilishi cha umoja wa kike na kinakubaliana moja kwa moja na συνείδησιν, nomino ya karibu ya umoja wa kike. Hata hivyo, tanbihi inataja uwezekano mpana ili kutatua kimya kimya utata wa kifasiri.
- issue: Maana ya πίστις katika περὶ τὴν πίστιν
  choice: ‘imani,’ bila kuongeza ‘ile.’
  alternative: ‘Imani ya Kikristo’ au ‘mafundisho ya imani.’
  rationale: Ingawa kibainishi cha Kigiriki kinaweza kuelekeza kwenye imani ya Kikristo, kuongeza ufafanuzi huo katika matini kungepunguza upana wa neno na kuamua suala la kifasiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sitiari ya meli imehifadhiwa kwa sababu ni muhimu katika picha ya Kigiriki. Kiunganishi ‘na hivyo’ kimetumiwa kuonyesha matokeo yanayoeleweka katika mfuatano wa sentensi, ingawa hakina neno tofauti linalolingana nacho katika Kigiriki.
