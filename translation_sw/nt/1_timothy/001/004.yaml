lexical_decisions:
- source_word: προσέχειν
  choice: wasisikilize
  rationale: Katika muktadha huu kitenzi kina maana ya kuelekeza fikira au kuzingatia kwa makusudi; “kusikiliza” ni Kiswahili cha kawaida kinachofaa kwa mafundisho, bila kuongeza wazo la kujitoa kabisa.
- source_word: μύθοις
  choice: hadithi za kubuni
  rationale: Huwasilisha dhana ya masimulizi yasiyo na msingi yanayotumiwa katika mafundisho; “ngano” lingeweza kusikika hasa kama hadithi za kimapokeo au za watoto.
- source_word: γενεαλογίαις ἀπεράντοις
  choice: nasaba zisizo na mwisho
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida inayohifadhi nguvu ya dharau ya mijadala ya nasaba isiyokoma.
- source_word: ἐκζητήσεις
  choice: maswali yasiyo na tija
  rationale: Neno linaweza kumaanisha uchunguzi, mabishano, au mijadala ya kukisia. Kauli hii inaonyesha tabia yake isiyozaa matunda huku tanbihi ikihifadhi maana nyingine zinazowezekana.
- source_word: παρέχουσι
  choice: huleta
  rationale: Hutoa kwa kawaida maana ya kusababisha au kutokeza bila kudai kwamba mambo hayo huendeleza maswali yaliyokuwapo tayari.
- source_word: οἰκονομίαν θεοῦ
  choice: usimamizi utokao kwa Mungu
  rationale: “Usimamizi” huhifadhi kiini cha οἰκονομία kama mpangilio au uwakili; “utokao kwa Mungu” huonyesha uwezekano wa θεοῦ kuwa chanzo bila kuufunga usemi kwa maana hiyo pekee, jambo linaloelezwa tanbihini.
- source_word: τὴν ἐν πίστει
  choice: ulio katika imani
  rationale: Muundo huu wa karibu na Kigiriki huhifadhi uwezekano wa ἐν kueleza mazingira, msingi, au namna ambamo usimamizi huo hufanya kazi.
- source_word: πίστει
  choice: imani
  rationale: “Imani” ndiyo tafsiri ya kawaida ya πίστις hapa; tanbihi huhifadhi uwezekano wa maana ya kumtumaini Mungu au uaminifu.
theological_decisions:
- issue: Maana ya οἰκονομίαν θεοῦ
  choice: usimamizi utokao kwa Mungu
  alternative: usimamizi wa Mungu; mpango wa Mungu; uwakili utokao kwa Mungu
  rationale: Usemi unaweza kuelekea kwenye usimamizi au mpango wa Mungu, au jukumu la uwakili analotoa Mungu. Tafsiri kuu haubani kwa mfumo maalumu wa kiteolojia, na tanbihi huweka wazi upana huo.
- issue: Maana ya πίστει katika τὴν ἐν πίστει
  choice: imani
  alternative: kumtumaini Mungu; uaminifu
  rationale: Muktadha hauhitaji kuamua kabisa kati ya imani kama tegemeo, tendo la kumtumaini Mungu, au kivuli cha uaminifu; neno la kawaida “imani” linabaki katika matini na uwezekano mwingine unaonyeshwa tanbihini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi, lakini kinachoeleweka kwa msomaji wa kawaida. Alama za tanbihi zimewekwa mara tu baada ya vifungu vinavyohusika, na kistari cha mwisho kimehifadhiwa kwa kuwa sentensi inaendelea kutoka mstari uliotangulia na kwenda unaofuata.
