    text: Au “ambazo hutokeza mabishano” au “ambazo husababisha uchunguzi.” Neno la Kigiriki linaweza kumaanisha maswali, uchunguzi, au mabishano; hapa muktadha unaonyesha mijadala isiyo na tija.
    reason: lexical_alternative
  - marker: b
    text: Au “usimamizi utokao kwa Mungu,” “mpango wa Mungu,” au “uwakili utokao kwa Mungu.” Neno la Kigiriki linaweza kumaanisha uwakili, usimamizi, au mpango uliopangwa.
