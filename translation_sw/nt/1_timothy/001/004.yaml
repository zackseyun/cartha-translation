  text: wala wasiyazingatie hadithi za kubuni na nasaba zisizo na mwisho, ambazo huleta maswali[a] badala ya usimamizi wa Mungu[b] ulio katika imani[c]—
  philosophy: optimal-equivalence
  footnotes:
