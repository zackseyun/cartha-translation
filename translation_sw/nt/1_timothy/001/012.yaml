  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ⸀Χάριν ἔχω τῷ ἐνδυναμώσαντί με Χριστῷ Ἰησοῦ τῷ κυρίῳ ἡμῶν, ὅτι πιστόν με ἡγήσατο θέμενος εἰς διακονίαν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/012.yaml
  text: I give thanks to Messiah Jesus our Lord[a], who has strengthened me, because he considered me faithful, appointing me to ministry[b],
translation:
  language: sw
  text: Ninamshukuru Masihi Yesu Bwana wetu[a], aliyenitia nguvu, kwa kuwa aliniona kuwa mwaminifu na akaniweka katika huduma[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kristo Yesu.” Cheo cha Kigiriki Χριστός kinaweza kutafsiriwa “Masihi” au kuandikwa kwa umbo la kimapokeo “Kristo.”
    reason: alternative_reading
  - marker: b
    text: Au, “utumishi” au “kwa ajili ya huduma.” Neno la Kigiriki διακονία lina maana pana ya huduma au utumishi.
    reason: lexical_alternative
lexical_decisions:
- source_word: Χάριν ἔχω
  choice: Ninamshukuru
  rationale: Nahau hii ya Kigiriki huonyesha kutoa shukrani. Muundo wa Kiswahili wenye kiambishi cha yambwa unamtaja wazi anayeshukuriwa na unasikika kwa kawaida.
- source_word: ἐνδυναμώσαντί με
  choice: aliyenitia nguvu
  rationale: Huhifadhi wazo la Yesu kumpa Paulo uwezo au nguvu bila kulifungamanisha na aina fulani maalumu ya uwezeshaji.
- source_word: Χριστῷ Ἰησοῦ
  choice: Masihi Yesu
  rationale: Χριστός hapa inafanya kazi kama cheo chenye maana, hivyo “Masihi” huwasilisha maana hiyo badala ya kutumia tu umbo la kimapokeo “Kristo.”
- source_word: τῷ κυρίῳ ἡμῶν
  choice: Bwana wetu
  rationale: “Bwana” ni tafsiri ya kawaida na yenye heshima ya κύριος kama cheo cha Yesu, ikihifadhi wazo la mamlaka.
- source_word: πιστόν
  choice: mwaminifu
  rationale: Neno hili linaweza kumaanisha mwenye uaminifu au anayeaminika; “mwaminifu” linafaa katika muktadha wa kukabidhiwa huduma huku likihifadhi upana huo.
- source_word: ἡγήσατο
  choice: aliniona kuwa
  rationale: Hutoa maana ya kumhesabu au kumchukulia mtu kuwa na sifa fulani kwa Kiswahili cha kawaida, bila kuingiza dhana ya hukumu ya mahakama.
- source_word: θέμενος
  choice: akaniweka
  rationale: Hufuata taswira ya msingi ya Kigiriki ya kuweka au kutenga mtu katika jukumu, na katika muktadha huu huwasilisha uteuzi bila kuingiza cheo maalumu cha kikanisa.
- source_word: εἰς διακονίαν
  choice: katika huduma
  rationale: διακονία lina upana wa huduma au utumishi. “Katika huduma” ni la kawaida na linadumisha uhusiano wa εἰς na jukumu alilopewa Paulo.
theological_decisions:
- issue: Tafsiri ya Χριστός
  choice: Masihi Yesu
  alternative: Kristo Yesu
  rationale: Muktadha unaruhusu cheo hiki kusikika kwa maana yake ya Masihi. Tanbihi inadumisha umbo la kimapokeo bila kufanya mojawapo kuwa dai tofauti la kiteolojia.
- issue: Namna ya kueleza kuwekwa kwa Paulo katika διακονία
  choice: akaniweka katika huduma
  alternative: akaniteua kwa ajili ya utumishi
  rationale: Chaguo kuu linakaa karibu na θέμενος εἰς διακονίαν na halibani huduma kuwa ofisi maalumu ya baadaye ya kanisa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imetumia “Ninamshukuru” na “aliyenitia nguvu” kwa uwazi wa kawaida, huku “Masihi,” “Bwana,” “mwaminifu,” na “huduma” zikidumisha uzito wa lugha ya Agano Jipya. Koma ya mwisho imehifadhiwa kwa sababu aya ya chanzo inaendelea kisintaksia.
