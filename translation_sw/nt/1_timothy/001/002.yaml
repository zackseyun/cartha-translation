  text: Τιμοθέῳ γνησίῳ τέκνῳ ἐν πίστει· χάρις, ἔλεος, εἰρήνη ἀπὸ θεοῦ ⸀πατρὸς καὶ Χριστοῦ Ἰησοῦ τοῦ κυρίου ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/002.yaml
  text: 'To Timothy[a], my true child in the faith: grace, mercy[b], and peace from God the Father and Messiah Jesus our Lord.'
translation:
  language: sw
  text: 'Kwa Timotheo, mwanangu wa kweli katika imani:[a]


    Neema, rehema na amani zitokazo kwa Mungu Baba na Masihi Yesu, Bwana wetu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mwanangu halisi kwa imani.”
    reason: Inahifadhi maana mbadala ya γνησίῳ na uwezekano wa ἐν πίστει kueleza msingi au njia ya uhusiano huo.
lexical_decisions:
- source_word: γνησίῳ τέκνῳ
  choice: mwanangu wa kweli
  rationale: Usemi huu unaonyesha uhusiano wa kweli wa kiroho kati ya Paulo na Timotheo bila kudokeza kuwa ni mwana wa kimwili. Kiambishi cha umilikaji katika “mwanangu” kinawekwa kwa ufasaha wa Kiswahili na kinaeleza uhusiano unaodokezwa na muktadha.
- source_word: ἐν πίστει
  choice: katika imani
  rationale: Inahifadhi uwezekano kwamba imani ndiyo mazingira au msingi wa uhusiano wao wa kiroho, bila kuifanya wazi kuwa ni tendo la kibinafsi la kuamini au mfumo rasmi wa mafundisho.
- source_word: χάρις
  choice: neema
  rationale: Ni tafsiri ya kawaida na sahihi ya neno hili katika salamu za Paulo.
- source_word: ἔλεος
  choice: rehema
  rationale: Ni kisawe cha moja kwa moja kinachohifadhi kipengele hiki tofauti katika salamu ya barua.
- source_word: εἰρήνη
  choice: amani
  rationale: Ni tafsiri ya kawaida inayohifadhi maana kamili ya baraka katika salamu.
- source_word: θεοῦ πατρὸς
  choice: Mungu Baba
  rationale: Huu ni mpangilio wa asili wa Kiswahili kwa kumtaja Mungu kuwa Baba.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Masihi Yesu
  rationale: “Masihi” hutafsiri Χριστός kama cheo, huku “Yesu” ikihifadhiwa kama jina.
- source_word: κυρίου
  choice: Bwana
  rationale: Ni tafsiri iliyozoeleka ya κύριος na inahifadhi uzito wake wa kiteolojia hapa.
theological_decisions:
- issue: Maana ya ἐν πίστει
  choice: katika imani
  alternative: kwa imani
  rationale: “Katika imani” inafaa zaidi kwa wazo la imani kuwa mazingira ya uhusiano wao, lakini tanbihi inahifadhi uwezekano wa kuielewa kama njia au msingi wa uhusiano huo.
- issue: Tafsiri ya Χριστοῦ Ἰησοῦ
  choice: Masihi Yesu
  alternative: Kristo Yesu
  rationale: “Masihi” huweka wazi maana ya cheo cha Χριστός badala ya kukitumia kana kwamba ni jina jingine la Yesu.
- issue: Uhusiano unaoelezwa na τέκνον
  choice: mwanangu
  alternative: mtoto wangu
  rationale: “Mwanangu” ni usemi wa asili na wenye heshima katika Kiswahili kwa mwana wa kiroho; haumaanishi lazima uzao wa kimwili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na rahisi kusomeka. Muundo wa salamu umehifadhiwa, na “zitokazo” limeongezwa ili kuunganisha kwa ufasaha chanzo cha neema, rehema na amani.
