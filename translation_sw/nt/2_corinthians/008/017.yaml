  text: For he accepted the appeal[a], but being more earnest[d][c][b], he went to you of his own accord.
translation:
  language: sw
  text: Kwa maana alikubali ombi hilo, lakini, akiwa na bidii zaidi, aliondoka kwenda kwenu kwa hiari yake mwenyewe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: Kwa maana
  rationale: Katika muktadha huu, neno hili linaeleza sababu ya shukrani iliyotajwa katika mstari uliotangulia; “Kwa maana” linahifadhi nguvu hiyo ya ufafanuzi na kisababishi.
- source_word: τὴν παράκλησιν
  choice: ombi letu
  rationale: Hapa παράκλησις ni ombi au mwito wa Paulo kwa Tito, si hasa faraja. Kiwakilishi “letu” kinawekwa kwa uwazi wa Kiswahili kutokana na muktadha, bila kubadili mhusika wa ombi.
- source_word: ἐδέξατο
  choice: alikubali
  rationale: Neno hili linaonyesha kwamba Tito alipokea ombi hilo kwa ridhaa; “alikubali” ni la kawaida na sahihi katika Kiswahili.
- source_word: σπουδαιότερος
  choice: alikuwa na bidii zaidi
  rationale: Huhifadhi hali ya kulinganisha ya neno la Kigiriki na maana ya juhudi au hamu kubwa zaidi, bila kuamua kwa lazima kati ya bidii na shauku.
- source_word: ὑπάρχων
  choice: kwa kuwa alikuwa
  rationale: Kirai hiki cha sababu kinaonyesha hali iliyokuwapo kwa Tito na huunganika kwa kawaida na sentensi ya Kiswahili.
- source_word: αὐθαίρετος
  choice: kwa hiari yake mwenyewe
  rationale: Huhifadhi maana ya kutenda kwa hiari na kwa msukumo wake mwenyewe, si kwa kulazimishwa.
- source_word: ἐξῆλθεν πρὸς ὑμᾶς
  choice: aliondoka ... kwenda kwenu
  rationale: “Aliondoka” huhifadhi wazo la ἐξῆλθεν la kuondoka au kuanza safari kutoka mahali Paulo alipokuwa, huku “kwenda kwenu” ikionyesha mwelekeo kuelekea kwa Wakorintho.
