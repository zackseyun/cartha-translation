revisions:
- from: Lakini kama mlivyo na wingi katika kila jambo—katika imani, usemi, ujuzi, bidii yote, na upendo unaotoka kwetu na ulio ndani yenu—vivyo hivyo zidini pia katika neema hii[a][b].
  to: Lakini kama mnavyozidi katika kila jambo—katika imani, usemi, ujuzi, bidii yote, na upendo unaotoka kwetu na ulio ndani yenu—vivyo hivyo zidini pia katika neema hii[a][b].
  rationale: The revision replaces only the non-idiomatic expression ‘mlivyo na wingi’ with ‘mnavyozidi.’ This preserves the source’s present-tense verbal parallel and its imagery of abundance, while producing natural Kiswahili. The syntactically difficult phrase about love remains deliberately close to the adopted Greek wording, with the manuscript-related alternative retained in the footnote.
