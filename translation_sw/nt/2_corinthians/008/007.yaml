id: 2CO.8.7
reference: 2 Corinthians 8:7
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀλλ’ ὥσπερ ἐν παντὶ περισσεύετε, πίστει καὶ λόγῳ καὶ γνώσει καὶ πάσῃ σπουδῇ καὶ τῇ ἐξ ⸂ἡμῶν ἐν ὑμῖν⸃ ἀγάπῃ, ἵνα καὶ ἐν ταύτῃ τῇ χάριτι περισσεύητε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/007.yaml
  text: But just as you abound in everything—in faith and speech and knowledge and all diligence and in our love in you—see that you also abound in this grace[a][b].
translation:
  language: sw
  text: Lakini kama mnavyozidi katika kila jambo—katika imani, usemi, ujuzi, bidii yote, na upendo unaotoka kwetu na ulio ndani yenu—vivyo hivyo zidini pia katika neema hii[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au labda, “upendo wenu kwetu.” Kirai cha Kigiriki ni kigumu, na baadhi ya hati zinasoma, “upendo wenu ulio ndani yetu.”
    reason: alternative_reading
  - marker: b
    text: Yaani, kazi hii ya neema ya kutoa kwa ukarimu.
    reason: lexical_alternative
lexical_decisions:
- source_word: περισσεύετε / περισσεύητε
  choice: mlivyo na wingi / zidini
  rationale: Maneno haya yanadumisha wazo la kuwa na wingi katika sifa walizo nazo na kuendelea kuwa na wingi katika utoaji, huku yakisomeka kwa kawaida katika Kiswahili.
- source_word: ἐν παντί
  choice: katika kila jambo
  rationale: Tafsiri hii inadumisha upana wa usemi wa Kigiriki na kuutambulisha orodha inayofuata.
- source_word: πίστει
  choice: imani
  rationale: Hii ndiyo maana ya kawaida katika muktadha wa orodha ya sifa za Kikristo, bila kulazimisha maana ya uaminifu.
- source_word: λόγῳ
  choice: usemi
  rationale: Katika orodha hii neno linaelekea kumaanisha uwezo au karama ya kusema; “usemi” ni fasaha na pana kuliko “neno.”
- source_word: γνώσει
  choice: ujuzi
  rationale: “Ujuzi” ni neno la kawaida la Kiswahili linalofaa katika orodha hii ya sifa.
- source_word: πάσῃ σπουδῇ
  choice: bidii yote
  rationale: Tafsiri hii inadumisha wazo la juhudi yenye uzito na shauku, pamoja na msisitizo wa πάσῃ.
- source_word: τῇ ἐξ ἡμῶν ἐν ὑμῖν ἀγάπῃ
  choice: upendo unaotoka kwetu na ulio ndani yenu
  rationale: Maneno haya yanahifadhi kwa uwazi viunganishi vya usomaji uliopokewa, ingawa kirai chenyewe ni kigumu. Uwezekano mwingine wa tafsiri na tofauti ya hati umewekwa katika tanbihi.
- source_word: χάριτι
  choice: neema
  rationale: “Neema” inadumisha uzito wa kiteolojia wa χάρις; tanbihi inafafanua kwamba hapa neno hilo linahusu kazi ya kutoa kwa ukarimu.
theological_decisions:
- issue: Maana ya χάρις katika muktadha wa mchango kwa ajili ya waamini
  choice: neema
  alternative: kazi ya neema; tendo la ukarimu; zawadi
  rationale: Paulo anatumia neno lenye maana pana ya kiteolojia huku akirejelea tendo halisi la kutoa. Kulihifadhi kama “neema” hakupunguzi utoaji kuwa shughuli ya kifedha tu.
- issue: Ufafanuzi wa τῇ ἐξ ἡμῶν ἐν ὑμῖν ἀγάπῃ
  choice: upendo unaotoka kwetu na ulio ndani yenu
  alternative: upendo wenu kwetu; upendo wenu ulio ndani yetu
  rationale: Kirai cha Kigiriki kina ugumu wa kisarufi na pia tofauti ya usomaji katika hati. Tafsiri kuu inafuata maandishi yaliyotolewa bila kutatua kimya kimya utata huo, na tanbihi inaonyesha uwezekano mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa orodha na taswira ya wingi vimehifadhiwa; kirai kigumu kuhusu upendo hakijarahisishwa kwa namna inayofuta utata wa maandishi.
