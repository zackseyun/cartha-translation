id: 2CO.8.11
reference: 2 Corinthians 8:11
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: νυνὶ δὲ καὶ τὸ ποιῆσαι ἐπιτελέσατε, ὅπως καθάπερ ἡ προθυμία τοῦ θέλειν οὕτως καὶ τὸ ἐπιτελέσαι ἐκ τοῦ ἔχειν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/011.yaml
  text: But now complete the doing of it also[a], so that just as there was the eagerness to will it[b], so also there may be the completion from what you have.
translation:
  language: sw
  text: Lakini sasa ikamilisheni pia kazi hiyo[a], ili kama vile mlivyokuwa na shauku ya kutaka, vivyo hivyo pia muikamilishe kwa kadiri ya kile mlicho nacho[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “malizeni pia kuitekeleza.”
    reason: lexical_alternative
  - marker: b
    text: Kwa maana halisi, “kutokana na kile mlicho nacho”; yaani, kulingana na uwezo wenu wa sasa.
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: Lakini sasa
  rationale: Inaendeleza mpito wenye tofauti ndogo kutoka nia ya awali kwenda utekelezaji wa sasa, huku ikihifadhi maana ya wakati.
- source_word: τὸ ποιῆσαι
  choice: kazi hiyo
  rationale: Infinitivu yenye kibainishi inarejelea tendo mahususi lililotajwa katika muktadha, yaani mchango waliokusudia; Kiswahili cha asili kinahitaji usemi thabiti kuliko tafsiri ya moja kwa moja ‘kufanya kwake’.
- source_word: ἐπιτελέσατε
  choice: ikamilisheni
  rationale: Inaonyesha kuifikisha kazi mwisho na inahifadhi uhusiano wa kitenzi na τὸ ἐπιτελέσαι inayofuata.
- source_word: ὅπως
  choice: ili
  rationale: Inaonyesha kusudi au matokeo yanayokusudiwa kwa njia ya kawaida katika Kiswahili.
- source_word: καθάπερ
  choice: kama vile
  rationale: Inaanzisha ulinganisho kati ya shauku ya kutaka na kukamilisha tendo.
- source_word: ἡ προθυμία τοῦ θέλειν
  choice: mlivyokuwa na shauku ya kutaka
  rationale: ‘Shauku’ huwasilisha utayari wenye hamu, na ‘kutaka’ huhifadhi msisitizo wa hiari bila kuongeza tendo lisilotajwa wazi.
- source_word: οὕτως καὶ
  choice: vivyo hivyo pia
  rationale: Inahifadhi uwiano wa kimuundo kati ya nia ya awali na ukamilishaji unaotakiwa.
- source_word: τὸ ἐπιτελέσαι
  choice: muikamilishe
  rationale: Kitenzi cha Kiswahili ni cha kawaida zaidi hapa kuliko nomino nzito, huku kikirudia wazo la ἐπιτελέω.
- source_word: ἐκ τοῦ ἔχειν
  choice: kwa kadiri ya kile mlicho nacho
  rationale: Inaonyesha kwamba ukamilishaji unatokana na, na unaendana na, mali au uwezo uliopo; tanbihi inahifadhi tafsiri ya karibu zaidi ya muundo wa Kigiriki.
theological_decisions:
- issue: Kutoa kulingana na uwezo uliopo
  choice: Mchango ukamilishwe kwa kadiri ya kile walicho nacho sasa.
  alternative: Wito wa jumla wa kutimiza nia njema bila kuzingatia uwezo wa sasa.
  rationale: Muktadha unahusu mchango wa Wakorintho, na ἐκ τοῦ ἔχειν huweka utoaji katika mipaka ya walicho nacho, bila kudai watoe zaidi ya uwezo wao.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo umefanywa wa asili katika Kiswahili bila kufuta ulinganifu wa nia na utekelezaji uliomo katika Kigiriki.
