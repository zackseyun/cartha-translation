base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/014.yaml
  text: At the present time[a], your abundance is for their need, so that their abundance may also be for your need, in order that there may be equality.
translation:
  language: sw
  text: Kwa wakati huu, ziada yenu iwe kwa ajili ya upungufu wao, ili ziada yao nayo iwe kwa ajili ya upungufu wenu, kusudi kuwepo na usawa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “haki” au “ulinganifu”; neno la Kigiriki humaanisha hapa usawa katika kutimizana mahitaji, si lazima umiliki wa mali unaofanana kabisa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ νῦν καιρῷ
  choice: Kwa wakati huu
  rationale: Kauli hii inaonyesha hali au kipindi cha sasa, si wakati wa kikronolojia tu; tafsiri hii ni ya kawaida na wazi katika Kiswahili.
- source_word: τὸ ὑμῶν περίσσευμα
  choice: ziada yenu
  rationale: περίσσευμα ni kile kilicho zaidi ya mahitaji. “Ziada” inafaa katika muktadha wa mali bila kuifanya ihusu fedha peke yake.
- source_word: εἰς τὸ ἐκείνων ὑστέρημα
  choice: itosheleze upungufu wao
  rationale: ὑστέρημα inaonyesha kile wanachokosa au upungufu wao. Kitenzi “itosheleze” kinaeleza kwa Kiswahili cha kawaida lengo la εἰς katika muktadha huu, yaani kutumia ziada kukidhi upungufu.
- source_word: ἵνα καὶ
  choice: ili ... nayo
  rationale: “Ili” huhifadhi kusudi linaloletwa na ἵνα, na “nayo” huhifadhi maana ya kuhusiana na kurudishiana iliyo katika καί.
- source_word: τὸ ἐκείνων περίσσευμα
  choice: ziada yao
  rationale: Neno lilelile “ziada” limetumiwa kwa περίσσευμα ili kudumisha ulinganifu wa sentensi ya Paulo.
- source_word: γένηται εἰς τὸ ὑμῶν ὑστέρημα
  choice: itosheleze upungufu wenu
  rationale: Tafsiri hii ni ya asili katika Kiswahili na hudumisha wazo kwamba ziada yao inaweza kutumika kukidhi upungufu wa wasomaji, bila kubainisha wakati au namna ya msaada huo.
- source_word: ὅπως γένηται ἰσότης
  choice: kusudi kuwe na usawa
  rationale: “Usawa” ndiyo kisawe cha moja kwa moja cha ἰσότης, huku tanbihi ikifafanua kuwa hapa ni uwiano wa kusaidiana, si lazima usawa kamili wa mali.
theological_decisions:
- issue: Maana ya ἰσότης katika wito wa Paulo kuhusu utoaji
  choice: usawa katika kutoshelezana mahitaji
  alternative: haki au ulinganifu
  rationale: Muktadha unahusu waamini kutumia ziada yao kukidhi upungufu wa wengine kwa namna ya kutegemezana. “Usawa” huhifadhi neno la Kigiriki bila kugeuza mstari huu kuwa nadharia pana ya kijamii wala kudai kwamba wote lazima wawe na mali sawa kabisa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaoeleweka kwa urahisi. Muundo wa kurudiana kati ya “ziada yenu/upungufu wao” na “ziada yao/upungufu wenu” umehifadhiwa.
