  text: τὴν οὖν ἔνδειξιν τῆς ἀγάπης ὑμῶν καὶ ἡμῶν καυχήσεως ὑπὲρ ὑμῶν εἰς αὐτοὺς ⸀ἐνδεικνύμενοι εἰς πρόσωπον τῶν ἐκκλησιῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/024.yaml
  text: Therefore[b][a], show them before the churches the proof of your love and of our boasting about you.
translation:
  language: sw
  text: Kwa hiyo, waonyesheni mbele ya makanisa uthibitisho[a] wa upendo wenu na wa kujisifu kwetu juu yenu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “udhihirisho” au “ushahidi” wa upendo wenu.
    reason: lexical_alternative
  - marker: b
    text: Yaani, kujisifu kwetu kuhusu ninyi.
    reason: clarity
lexical_decisions:
- source_word: ἔνδειξιν
  choice: uthibitisho
  rationale: Neno hili humaanisha jambo linaloonyesha au kuthibitisha kitu wazi; hapa linadai upendo wao uthibitishwe kwa vitendo.
- source_word: ἀγάπης
  choice: upendo
  rationale: Hili ndilo neno la kawaida na la asili kwa ἀγάπη, na hapa ni upendo unaoonyeshwa kwa vitendo.
- source_word: καυχήσεως
  choice: kujisifu
  rationale: Linadumisha nguvu ya kauli ya Paulo kuhusu kusema kwa fahari juu ya Wakorintho, bila kuilegeza kuwa tumaini au ujasiri tu.
- source_word: ὑπὲρ ὑμῶν
  choice: juu yenu
  rationale: Pamoja na καύχησις, kirai hiki kinamaanisha kujisifu kuhusu Wakorintho.
- source_word: εἰς αὐτοὺς
  choice: waonyesheni
  rationale: Kiwakilishi cha watendewa kimeunganishwa kiasili katika kitenzi cha Kiswahili; kinawarejelea ndugu waliotajwa katika muktadha.
- source_word: ἐνδεικνύμενοι
  choice: waonyesheni
  rationale: Ingawa ni umbo la kitenzi-shirikishi, katika muktadha lina nguvu ya amri na linaendeleza himizo la Paulo.
- source_word: εἰς πρόσωπον τῶν ἐκκλησιῶν
  choice: mbele ya makanisa
  rationale: Kirai hiki kinaeleza onyesho la wazi mbele ya makanisa au wawakilishi wao; tafsiri hii ni ya kawaida na yenye heshima katika Kiswahili.
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Kinaonyesha hitimisho au matokeo ya hoja iliyotangulia.
theological_decisions: []
