  source_fidelity: 'Tafsiri inawakilisha kwa uaminifu hoja ya Kigiriki: οὖν kama hitimisho (“Kwa hiyo”), ἐνδεικνύμενοι kwa nguvu ya himizo (“waonyesheni”), εἰς αὐτούς kwa kiambishi cha yambwa, na εἰς πρόσωπον τῶν ἐκκλησιῶν kama onyesho la wazi “mbele ya makanisa.” “Uthibitisho” hutoa maana inayofaa ya ἔνδειξις, na “kujisifu kwetu juu yenu” hudumisha kauli ya Paulo ya καύχησις ὑπὲρ ὑμῶν bila kuibadilisha kuwa fundisho au hisia tofauti.'
