  text: 'as it is written: The one who had much did not have too much[a], and the one who had little did not have too little.'
translation:
  language: sw
  text: 'kama ilivyoandikwa: “Aliyekuwa na vingi hakuwa na ziada[a], na aliyekuwa na vichache hakuwa na upungufu.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa maana ya karibu zaidi na Kutoka 16:18: “Aliyekusanya vingi hakuwa na ziada, na aliyekusanya vichache hakuwa na upungufu.”'
    reason: alternative_reading
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: kama ilivyoandikwa
  rationale: Ni kauli ya kawaida ya kutanguliza nukuu ya Maandiko; hali timilifu ya Kigiriki inaonyesha ushuhuda ulioandikwa unaoendelea kuwa na mamlaka.
- source_word: Ὁ τὸ πολὺ
  choice: Aliyekuwa na vingi
  rationale: Kivumishi cha Kigiriki kimetumiwa kama nomino, yaani ‘yule mwenye vingi.’ Kiswahili hiki ni cha asili na hakiingizi waziwazi kitendo cha kukusanya ambacho hakijatajwa katika nukuu ya Paulo.
- source_word: ἐπλεόνασεν
  choice: hakuwa na ziada
  rationale: 'Kitenzi kinaweza kumaanisha kuwa na wingi au ziada. Katika muktadha huu kinaeleza matokeo: mwenye vingi hakubaki na ziada.'
- source_word: ὁ τὸ ὀλίγον
  choice: aliyekuwa na vichache
  rationale: Huhifadhi ulinganifu na ‘aliyekuwa na vingi’ na maana ya mgawanyo bila kuongeza kitenzi ‘kukusanya.’
- source_word: ἠλαττόνησεν
  choice: hakupungukiwa
  rationale: Hutoa maana ya kutokuwa na upungufu au kutokosa kiasi kinachohitajika, kwa Kiswahili cha kawaida na chenye heshima.
theological_decisions:
- issue: Matumizi ya nukuu ya Kutoka 16:18 katika muktadha wa ukarimu na usawa
  choice: Kauli imetafsiriwa kwa kuonyesha hali au matokeo ya kuwa na vitu, bila kuongeza waziwazi ‘alikusanya.’
  alternative: “Aliyekusanya vingi hakuwa na ziada, na aliyekusanya vichache hakupungukiwa.”
  rationale: Paulo anatumia Maandiko kuunga mkono utoaji unaokidhi mahitaji kwa usawa. Tafsiri hii inahifadhi matumizi hayo ya sasa na wakati huohuo inafuata maneno ya Kigiriki ya nukuu yake, ambayo hayataji wazi kitenzi ‘kukusanya.’
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, fasaha na chenye hadhi. Ulinganifu wa ‘vingi/vichache’ na ‘ziada/hakupungukiwa’ umehifadhiwa bila kufanya sentensi kuwa ngumu.
