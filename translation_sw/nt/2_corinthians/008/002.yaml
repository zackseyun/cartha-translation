base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/002.yaml
  text: that in a severe test of affliction[b][a], the abundance of their joy and their deep poverty overflowed into the wealth of their generosity.
translation:
  language: sw
  text: kwa maana katika jaribu kubwa la dhiki, wingi wa furaha yao na umaskini wao wa kina sana[a] vilifurika hata vikawa utajiri wa ukarimu wao.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tafsiri nyingine: “umaskini wao wa kupindukia” au “umaskini wao ulioshuka mpaka vilindini.”'
    reason: lexical_alternative
  - marker: b
    text: Au “utajiri wa unyofu wao” au “utajiri wa moyo wao usiogawanyika.” Neno la Kigiriki linaweza pia kumaanisha unyofu au kutokuwa na hila; hapa, katika muktadha wa utoaji, huenda linarejelea ukarimu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν πολλῇ δοκιμῇ θλίψεως
  choice: katikati ya jaribu kali la mateso
  rationale: Neno δοκιμή hapa linaonyesha kujaribiwa katika hali ya θλῖψις, yaani mateso au dhiki. Kauli hii inadumisha uhusiano wa maneno hayo na kueleza uzito wa jaribu kwa Kiswahili cha kawaida.
- source_word: ἡ περισσεία τῆς χαρᾶς αὐτῶν
  choice: furaha yao tele
  rationale: Hili linaonyesha wingi wa furaha bila kubadili nomino περισσεία kuwa kitenzi, huku likisomeka kwa kawaida katika Kiswahili.
- source_word: ἡ κατὰ βάθους πτωχεία αὐτῶν
  choice: umaskini wao wa kupindukia
  rationale: Kirai κατὰ βάθους kinatilia mkazo kiwango kikubwa sana cha umaskini. 'Wa kupindukia' ni cha asili na wazi kwa wasomaji wa sasa; taswira halisi ya kina imehifadhiwa katika tanbihi.
- source_word: ἐπερίσσευσεν
  choice: vilifurika na kutokeza
  rationale: Kitenzi περισσεύω kinaonyesha wingi unaofikia matokeo yanayotambulishwa na εἰς. 'Vilifurika na kutokeza' huhifadhi taswira hiyo na kufanya uhusiano wa matokeo uwe wazi.
- source_word: εἰς τὸ πλοῦτος
  choice: na kutokeza utajiri
  rationale: εἰς hapa inaelekea kuonyesha matokeo. Tafsiri hii inawasilisha nguvu hiyo ya kimatokeo kwa Kiswahili cha kawaida.
- source_word: τῆς ἁπλότητος αὐτῶν
  choice: wa ukarimu wao
  rationale: Katika muktadha wa mchango wa mali, ἁπλότης inaelekea kumaanisha ukarimu au kutoa kwa moyo usiogawanyika. 'Ukarimu' huwasilisha maana kuu ya muktadha bila kuondoa maana mbadala, ambazo zimeonyeshwa katika tanbihi.
theological_decisions:
- issue: Maana ya ἁπλότης katika muktadha wa utoaji wa mali
  choice: ukarimu
  alternative: unyofu, moyo mmoja, au kutokuwa na hila
  rationale: Muktadha wa karibu unahusu kuwasaidia watakatifu kwa mali, hivyo maana ya ukarimu ndiyo inayowezekana zaidi. Hata hivyo, maana ya msingi ya unyofu au moyo usiogawanyika haijafutwa bali imeandikwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo unadumisha mvutano wa kushangaza kati ya furaha tele, umaskini mkubwa, na ukarimu wenye utajiri. Alama zote za tanbihi zimewekwa katika matini kuu.
