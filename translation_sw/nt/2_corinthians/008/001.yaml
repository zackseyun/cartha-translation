    text: “Neema ya Mungu” inaweza kurejelea fadhili za Mungu na pia ukarimu unaotokana na fadhili hizo katika makanisa ya Makedonia.
    reason: lexical_alternative
lexical_decisions:
- source_word: Γνωρίζομεν
  choice: tunawajulisha
  rationale: Kitenzi hiki humaanisha kufanya jambo lijulikane au kulieleza. ‘Tunawajulisha’ ni Kiswahili cha sasa na cha heshima, na kinadumisha hali ya wakati uliopo bila kuongeza wazo la ‘tunataka mjue.’
- source_word: δὲ
  choice: haijatafsiriwa kwa neno maalumu
  rationale: Hapa δέ ni kiunganishi chepesi cha kuhamia hoja nyingine, si upinzani mkali. Kiswahili kinaweza kuonyesha mpito huo kwa mtiririko wa sentensi bila kuongeza ‘lakini’ au ‘sasa.’
- source_word: ὑμῖν
  choice: -wa- katika ‘tunawajulisha’
  rationale: Kiambishi cha yambwa ‘-wa-’ kinawakilisha wazi wingi wa ‘ninyi’ katika muundo wa kawaida wa Kiswahili.
- source_word: ἀδελφοί
  choice: Ndugu
  rationale: ‘Ndugu’ ni neno la kawaida la Kiswahili linaloweza kutumiwa kwa waumini wa kiume na wa kike, huku likidumisha lugha ya kifamilia ya Paulo.
- source_word: χάριν
  choice: neema
  rationale: '‘Neema’ ni istilahi ya kawaida ya Kip paulo na inadumisha upana wa maana: fadhili ya Mungu pamoja na matokeo yake katika ukarimu wa waumini.'
- source_word: τοῦ θεοῦ
  choice: ya Mungu
  rationale: Muundo wa umilikaji ‘ya Mungu’ unafuata uhusiano wa kijeni bila kuubana kuwa ‘kutoka kwa Mungu’ pekee.
- source_word: τὴν δεδομένην
  choice: iliyotolewa
  rationale: Kauli tendwa inadumishwa. Kiswahili hakilazimishi kuonyesha kikamilifu tofauti ya participio timilifu, lakini ‘iliyotolewa’ huonyesha tendo lililofanyika na hali yake inayoonekana katika makusanyiko hayo.
- source_word: ἐν
  choice: miongoni mwa
  rationale: Hufikisha neema kuwa ilifanya kazi ndani ya jumuiya hizo, bila kuifanya iwe maelezo ya mahali tu.
- source_word: ἐκκλησίαις
  choice: makusanyiko ya waumini
  rationale: Katika muktadha huu neno hilo linarejelea jumuiya za Wakristo wa mahali mbalimbali. ‘Makusanyiko ya waumini’ ni wazi kwa msomaji wa sasa na huepuka uwezekano wa kueleweka kama majengo.
- source_word: τῆς Μακεδονίας
  choice: ya Makedonia
  rationale: Hufuata moja kwa moja muundo unaoyatambulisha makusanyiko hayo kwa eneo lao.
theological_decisions:
- issue: Maana ya ‘neema ya Mungu’ katika muktadha
  choice: Neema ya Mungu inayofanya kazi miongoni mwa makusanyiko ya Makedonia na kuzaa ukarimu
  alternative: Zawadi ya msaada yenyewe, au kwa upana zaidi fadhili za Mungu kwa makusanyiko hayo
  rationale: Neno χάρις linaweza kuelekeza kwa fadhili ya Mungu na pia kwa matokeo yake halisi katika utoaji. Tafsiri ‘neema ya Mungu’ haifungi maana katika mojawapo tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Sentensi imepangwa kwa mtiririko wa asili wa Kiswahili, na alama zote za tanbihi zimewekwa katika matini kuu.
