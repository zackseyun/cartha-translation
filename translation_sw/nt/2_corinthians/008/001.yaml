  yaml_path: translation/nt/2_corinthians/008/001.yaml
  text: We make known to you[a], brothers, the grace of God that has been given among the churches of Macedonia[b],
translation:
  language: sw
  text: Tunawajulisha, ndugu[a], kuhusu neema ya Mungu iliyotolewa miongoni mwa makanisa ya Makedonia[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika Kigiriki neno hili lina umbo la kiume, “ndugu,” lakini mara nyingi Paulo hulitumia kulihutubia kusanyiko lote, wanaume na wanawake.
    reason: lexical_alternative
