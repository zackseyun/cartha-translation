language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: γινώσκετε γὰρ τὴν χάριν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, ὅτι δι’ ὑμᾶς ἐπτώχευσεν πλούσιος ὤν, ἵνα ὑμεῖς τῇ ἐκείνου πτωχείᾳ πλουτήσητε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/009.yaml
  text: For you know the grace of our Lord Jesus Christ[a], that though he was rich, yet for your sake he became poor[b], so that you by his poverty might become rich.
translation:
  language: sw
  text: 'Kwa maana mnajua neema ya Bwana wetu Yesu Masihi[a]: ingawa alikuwa tajiri, kwa ajili yenu akawa maskini[b], ili ninyi mpate kuwa matajiri kwa umaskini wake.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yesu Kristo.” Neno la Kigiriki Χριστός ni cheo kinachoweza kutafsiriwa “Masihi” au kuandikwa kwa namna iliyozoeleka “Kristo.”
    reason: alternative_reading
  - marker: b
    text: Huenda maneno “tajiri” na “maskini” yametumiwa kisitiari, yakilinganisha utajiri wa Kristo wa awali na kujishusha kwake kwa ajili ya wengine; Paulo hafafanui sitiari hiyo moja kwa moja hapa.
    reason: lexical_alternative
lexical_decisions:
- source_word: γινώσκετε
  choice: mnajua
  rationale: Kitenzi cha wakati wa sasa, nafsi ya pili wingi, kinarejelea maarifa ambayo Wakorintho tayari wanayo; “mnajua” ni Kiswahili cha kawaida na cha moja kwa moja.
- source_word: χάριν
  choice: neema
  rationale: “Neema” huhifadhi maana ya tendo la fadhili la Kristo pamoja na uzito wake wa kitheolojia, huku muktadha wa ukarimu ukiendelea kusikika.
- source_word: κυρίου
  choice: Bwana
  rationale: Ni cheo cha kawaida cha Kiswahili kwa κύριος na huhifadhi maana ya mamlaka na uzito wa kikristo.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesu Masihi
  rationale: Χριστός ni cheo chenye maana ya “Masihi”; kukitafsiri kama “Masihi” kunafanya maana ya cheo hicho ionekane wazi, huku “Kristo” ikitajwa katika tanbihi kama namna iliyozoeleka.
- source_word: δι’ ὑμᾶς
  choice: kwa ajili yenu
  rationale: 'Huwasilisha kwa kawaida nguvu ya manufaa ya διά pamoja na hali ya kushutumiwa: alifanya hivyo kwa manufaa yao.'
- source_word: ἐπτώχευσεν
  choice: akawa maskini
  rationale: Huhifadhi mabadiliko yanayoelezwa na kitenzi bila kufafanua namna ya umaskini zaidi ya Kigiriki.
- source_word: πλούσιος ὤν
  choice: ingawa alikuwa tajiri
  rationale: “Ingawa” huonyesha wazi uhusiano wa kukinzana unaodokezwa na kishazi shiriki.
- source_word: τῇ ἐκείνου πτωχείᾳ
  choice: kwa umaskini wake
  rationale: “Kwa” huonyesha umaskini wake kama njia ambayo kupitia hiyo wao wanakuwa matajiri, bila kuongeza maelezo yasiyokuwamo katika maandishi.
- source_word: πλουτήσητε
  choice: mpate kuwa matajiri
  rationale: Hueleza kusudi la ἵνα na kuhifadhi ulinganifu wa kimakusudi kati ya “akawa maskini” na “kuwa matajiri.”
theological_decisions:
- issue: Maana ya Kristo kuwa “tajiri” na waamini kuwa “matajiri”
  choice: Lugha ya utajiri na umaskini imehifadhiwa katika andiko bila kufafanua aina ya utajiri unaokusudiwa.
  alternative: Kuitaja wazi kuwa utajiri wa Kristo ni utukufu wake kabla ya kufanyika mwili, au kuwa utajiri wa waamini ni baraka za kiroho za wokovu pekee.
  rationale: Kigiriki hakifafanui sitiari hiyo katika mstari huu. Muktadha unahusisha kujitoa kwa Kristo na wito wa ukarimu, lakini tafsiri haipaswi kuifungia kauli hiyo katika maelezo moja ya kimafundisho.
- issue: Χριστός kama cheo
  choice: “Masihi” katika andiko kuu
  alternative: “Kristo” kama umbo la kawaida la jina-cheo
  rationale: “Masihi” huonyesha maana ya cheo cha Kigiriki Χριστός; tanbihi inahifadhi umbo la “Kristo” ambalo limezoeleka sana katika matumizi ya Kikristo ya Kiswahili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi umewekwa wazi bila kuondoa mkazo wa jozi ya “tajiri/maskini.”
