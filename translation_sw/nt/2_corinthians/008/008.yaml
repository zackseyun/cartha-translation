  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Οὐ κατ’ ἐπιταγὴν λέγω ἀλλὰ διὰ τῆς ἑτέρων σπουδῆς καὶ τὸ τῆς ὑμετέρας ἀγάπης γνήσιον δοκιμάζων·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/008.yaml
  text: I am not saying this as a command[b][a], but through the earnestness of others I am also testing the genuineness of your love.
translation:
  language: sw
  text: Sisemi hili kama amri, bali kwa bidii ya wengine ninapima pia uhalisi wa upendo wenu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ninajaribu” au “ninathibitisha” uhalisi wa upendo wenu. Kitenzi cha Kigiriki kinaweza kumaanisha kujaribu, kupima, au kuthibitisha baada ya uchunguzi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιταγή
  choice: amri
  rationale: “Amri” ni neno la kawaida na lenye hadhi linaloonyesha agizo lenye mamlaka, huku likihifadhi tofauti kati ya kulazimisha na utoaji wa hiari.
- source_word: διὰ τῆς ἑτέρων σπουδῆς
  choice: kwa bidii ya wengine
  rationale: “Kwa” hapa huonyesha njia au msingi wa kupima, na “wengine” haiongezi utambulisho ambao haujatajwa wazi katika mstari.
- source_word: σπουδή
  choice: bidii
  rationale: “Bidii” huwasilisha uzito, juhudi, na utayari wa dhati; “hamu” pia inawezekana kulingana na muktadha.
- source_word: ἀγάπη
  choice: upendo
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa ἀγάπη na linafaa kwa upendo unaoonyeshwa kwa utoaji.
- source_word: γνήσιον
  choice: uhalisi
  rationale: “Uhalisi” huonyesha sifa ya kuwa halisi au ya kweli bila kuamua mapema matokeo ya jaribio.
- source_word: δοκιμάζων
  choice: ninaujaribu
  rationale: Kitenzi hiki kinaweza kumaanisha kujaribu, kuchunguza, au kuthibitisha baada ya uchunguzi. “Ninaujaribu” huhifadhi wazo la kuweka uhalisi wa upendo katika kipimo.
- source_word: καί
  choice: pia
  rationale: '“Pia” huhifadhi nguvu ya nyongeza ya καί: kwa kutaja bidii ya wengine, Paulo pia anaujaribu upendo wa Wakorintho.'
- source_word: ὑμετέρας
  choice: wenu
  rationale: “Wenu” huonyesha kuwa Paulo anazungumza na jumuiya ya Wakorintho kwa pamoja.
theological_decisions:
- issue: Msimamo wa Paulo kuhusu utoaji
  choice: Paulo anasema wazi kwamba hasemi kwa namna ya kutoa amri, bali anatumia bidii ya wengine kuujaribu uhalisi wa upendo wa Wakorintho.
  alternative: Kuyachukulia maneno yake kuwa amri iliyolegezwa tu kwa mbinu ya usemi.
  rationale: Kirai οὐ κατ’ ἐπιταγὴν λέγω kinakataa moja kwa moja kusema kwa mamlaka ya amri. Tafsiri inapaswa kuhifadhi mvutano kati ya mamlaka ya kitume na mwitikio wa hiari unaotokana na upendo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umewekwa wazi na wa kawaida kwa wasomaji wengi, huku maana ya njia katika διά na utata wa δοκιμάζων vikihifadhiwa.
