  source_fidelity: 'The draft accurately renders the main contrast: Paul is not speaking by way of a command, and he refers to others’ σπουδή while testing the genuineness of the Corinthians’ love. “Kwa bidii ya wengine” appropriately conveys διά with the genitive and does not identify the unnamed ‘others.’ “Pia” suitably represents καί.'
