  text: συνεπέμψαμεν δὲ μετ’ αὐτοῦ τὸν ἀδελφὸν οὗ ὁ ἔπαινος ἐν τῷ εὐαγγελίῳ διὰ πασῶν τῶν ἐκκλησιῶν—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/018.yaml
  text: And we sent with him the brother whose praise in the gospel is throughout all the churches—[a]
translation:
  language: sw
  text: Na tulimtuma pamoja naye ndugu ambaye anasifiwa kwa habari ya Injili katika makanisa yote—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ambaye anapendekezwa kwa habari ya Injili miongoni mwa makanisa yote.”
    reason: lexical_alternative
lexical_decisions:
- source_word: συνεπέμψαμεν
  choice: tulimtuma pamoja naye
  rationale: Wakati uliopita wa Kigiriki unasimulia tendo lililotimizwa, na kiambishi σύν kinaonyesha kuandamana; usemi huu ni wa kawaida na wazi katika Kiswahili.
- source_word: δὲ
  choice: Nasi
  rationale: δέ ni kiunganishi chepesi kinachoendeleza simulizi, si lazima kionyeshe upinzani; “Nasi” linaunganisha sentensi hii kwa mtiririko wa kawaida.
- source_word: μετ’ αὐτοῦ
  choice: pamoja naye
  rationale: μετά pamoja na jenitivi huonyesha kuandamana; “pamoja naye” linatoa maana hiyo moja kwa moja.
- source_word: τὸν ἀδελφόν
  choice: ndugu
  rationale: Hurejelea ndugu maalumu wa kiume katika imani. Kiswahili hakihitaji kibainishi kinacholingana na “the,” na “ndugu” haliongezi kimakosa neno “yetu.”
- source_word: οὗ ὁ ἔπαινος
  choice: ambaye anasifiwa
  rationale: Ingawa Kigiriki kina muundo wa nomino, Kiswahili cha kawaida hueleza kwa uwazi kwamba huyo ndugu ndiye anayesifiwa, bila kuamua zaidi msingi au aina ya sifa hiyo.
- source_word: ἔπαινος
  choice: anasifiwa
  rationale: ἔπαινος humaanisha sifa au pongezi. Muundo wa kitenzi ni wa asili zaidi katika Kiswahili kuliko “ambaye sifa yake,” lakini unahifadhi kiini cha maana.
- source_word: ἐν τῷ εὐαγγελίῳ
  choice: kwa habari ya Injili
  rationale: Kirai hiki huhifadhi uhusiano mpana wa sifa yake na Injili bila kubainisha kwamba alikuwa mhubiri au mwenye cheo fulani cha huduma.
- source_word: διὰ πασῶν τῶν ἐκκλησιῶν
  choice: katika makanisa yote
  rationale: διά pamoja na jenitivi hapa huonyesha kuenea katika jumla ya makanisa; tafsiri hii ni ya kawaida na inaweza kueleweka kuwa sifa hiyo imeenea miongoni mwa makanisa yote.
- source_word: ἐκκλησιῶν
  choice: makanisa
  rationale: Katika muktadha wa Paulo, neno hili hurejelea jumuiya za waamini za mahali mbalimbali; “makanisa” ndilo neno la kawaida na linaloeleweka wazi.
theological_decisions:
- issue: Utambulisho na hadhi ya ἀδελφός
  choice: “ndugu” akimaanisha mwanamume maalumu, Mkristo mwenzake na mshirika katika safari hii
  alternative: “mwenzetu katika imani” kwa maana ya jumla
  rationale: Umoja wa kiume pamoja na muktadha wa mtu anayesafiri unaelekeza kwa mwanamume maalumu; “ndugu” linahifadhi rejeo hilo bila kuongeza jina au cheo.
- issue: Maana ya ἐν τῷ εὐαγγελίῳ
  choice: “kwa habari ya Injili,” bila kutaja aina maalumu ya huduma
  alternative: “kwa kuhubiri Injili” au “kwa kazi yake ya Injili”
  rationale: Kigiriki hakisemi wazi kwamba sifa hiyo ilitokana na kuhubiri au ofisi fulani ya huduma. Tafsiri pana inalinda utata halisi wa kirai.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. “Injili” limeandikwa kwa herufi kubwa kama jina la ujumbe wa habari njema. Alama ya mwisho ya mstari imehifadhiwa kwa kuwa sentensi inaendelea katika mstari unaofuata.
