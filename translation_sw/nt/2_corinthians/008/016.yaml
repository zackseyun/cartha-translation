  text: Lakini Mungu ashukuriwe, ambaye huweka moyoni mwa Tito bidii ileile kwa ajili yenu,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Χάρις δὲ τῷ θεῷ
  choice: Lakini Mungu ashukuriwe
  rationale: Katika muundo huu χάρις pamoja na τῷ θεῷ huonyesha shukrani kwa Mungu, si neema. δέ inaonyesha mpito wenye utofauti mdogo, unaowakilishwa kwa kawaida na “Lakini”.
- source_word: τῷ διδόντι
  choice: ambaye huweka
  rationale: Ingawa δίδωμι kimsingi ni “kutoa,” pamoja na hali iliyo moyoni Kiswahili cha kawaida hutumia “kuweka moyoni,” huku wakati wa sasa wa kishiriki ukionyeshwa kwa “huweka.”
- source_word: τὴν αὐτὴν σπουδὴν
  choice: bidii ileile
  rationale: σπουδή hapa ni juhudi au hamu ya dhati inayolenga watu wengine. “Bidii” ni neno la kawaida na lenye hadhi, na “ileile” huhifadhi αὐτήν.
- source_word: ὑπὲρ ὑμῶν
  choice: kwa ajili yenu
  rationale: Kirai hiki huonyesha kwamba bidii hiyo imeelekezwa kwa manufaa na kuhusu Wakorintho; “kwa ajili yenu” hudumisha upana huo.
- source_word: ἐν τῇ καρδίᾳ Τίτου
  choice: moyoni mwa Tito
  rationale: Huhifadhi sitiari ya moyo kama makao ya nia ya ndani na ni muundo wa kawaida wa Kiswahili.
