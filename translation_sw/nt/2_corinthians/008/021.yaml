base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/021.yaml
  text: For we take thought for what is good[a], not only before the Lord but also before people.
translation:
  language: sw
  text: Kwa maana tunafikiria kwa uangalifu yaliyo mema[a], si tu mbele za Bwana, bali pia mbele ya watu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “yanayoheshimika” au “yaliyo sawa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προνοοῦμεν
  choice: tunafikiria kwa makini kufanya
  rationale: Kitenzi hiki kina wazo la kufikiria mapema na kuchukua hatua kwa uangalifu. Katika muktadha wa kusimamia mchango kwa uaminifu, usemi huu unaonyesha uangalifu wa makusudi bila kuufanya mstari useme tu ‘tunalenga.’
- source_word: γὰρ
  choice: Kwa maana
  rationale: Kiunganishi hiki kinatoa sababu ya maelezo yaliyotangulia na kuhifadhi mtiririko wa hoja ya Paulo.
- source_word: καλὰ
  choice: yaliyo mema
  rationale: Wingi huu usio na jinsia unaweza kumaanisha mambo au matendo mema, yanayoheshimika, au yaliyo sawa. ‘Yaliyo mema’ huhifadhi upana wa maana; mbadala wa kimuktadha umewekwa katika tanbihi.
- source_word: οὐ μόνον ... ἀλλὰ καὶ
  choice: si ... tu, bali pia
  rationale: Muundo huu wa Kiswahili unaonyesha kwa kawaida na kwa usahihi uwiano wa ‘si tu ... bali pia.’
- source_word: ἐνώπιον
  choice: mbele za / mbele ya
  rationale: Hutoa maana ya kuwa machoni au mbele ya mtu. ‘Mbele za Bwana’ ni usemi wa Kiswahili unaofaa, huku ‘mbele ya watu’ ikiwa ya kawaida katika kishazi cha pili.
- source_word: κυρίου
  choice: Bwana
  rationale: Jina la heshima κύριος limetafsiriwa kwa neno la kawaida la kibiblia ‘Bwana.’
- source_word: ἀνθρώπων
  choice: watu
  rationale: Neno hili linawahusu wanadamu kwa jumla, si wanaume pekee; ‘watu’ ni sahihi na la kawaida katika Kiswahili cha sasa.
theological_decisions:
- issue: Maana ya kimaadili ya καλὰ katika muktadha wa uwajibikaji wa fedha
  choice: yaliyo mema
  alternative: yanayoheshimika; yaliyo sawa
  rationale: Kauli hiyo inaweza kueleza wema kwa upana au mwenendo unaostahili heshima mbele ya Mungu na wanadamu. Tafsiri kuu haifungi maana kwenye sifa ya hadharani pekee, na tanbihi huhifadhi maana nyingine zinazowezekana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Tunafikiria kwa makini kufanya’ ni cha kawaida zaidi kuliko tafsiri ya neno kwa neno kama ‘tunatangulia kufikiri,’ huku kikihifadhi wazo la uangalifu wa makusudi katika mwenendo.
