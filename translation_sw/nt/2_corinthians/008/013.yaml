  text: For I do not mean that there should be relief for others and hardship for you, but equality[a]—
translation:
  language: sw
  text: Kwa maana sikusudii kwamba wengine wapate nafuu, nanyi mpate dhiki, bali iwe kwa usawa[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “haki”; neno la Kigiriki linamaanisha uwiano unaozingatia haki, si lazima kila mtu awe na mali kiasi kilekile.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ γὰρ
  choice: Kwa maana si-
  rationale: γάρ inaunganisha sentensi hii na maelezo yaliyotangulia kwa kutoa ufafanuzi, huku οὐ ikikanusha kusudi linalodhaniwa.
- source_word: ἵνα
  choice: kusudii kwamba
  rationale: Katika muktadha huu ἵνα inafuata wazo lililodokezwa la kusudi. Kiswahili cha kawaida huhitaji kitenzi kama ‘kusudia’ ili kuwasilisha maana hiyo kwa uwazi.
- source_word: ἄλλοις ἄνεσις
  choice: wengine wapate nafuu
  rationale: ἄνεσις hapa ni kuondolewa kwa mzigo au shinikizo katika muktadha wa msaada wa mali; ‘nafuu’ ni ya kawaida na haisemi tu faraja ya kihisia.
- source_word: ὑμῖν θλῖψις
  choice: nanyi mpate dhiki
  rationale: θλῖψις inatofautishwa na ‘nafuu’ na hapa inaonyesha hali ya kubanwa au kutaabika kutokana na utoaji. ‘Dhiki’ huhifadhi uzito wa neno bila kulifunga kwa umaskini pekee.
- source_word: ἀλλ’ ἐξ ἰσότητος
  choice: bali kuwe na usawa
  rationale: ἰσότης inaweza kumaanisha usawa au hali ya kutendeana kwa haki. ‘Usawa’ ni ulinganifu wa moja kwa moja, na ‘kuwe na’ huwasilisha kwa Kiswahili uhusiano wa ἐξ bila tafsiri ngumu ya neno kwa neno.
theological_decisions:
- issue: Maana ya ἰσότης katika habari ya kushirikiana mali
  choice: usawa
  alternative: haki; uwiano wa haki
  rationale: ‘Usawa’ huhifadhi usemi wa Paulo na maana ya msingi ya neno, lakini tanbihi inaeleza kuwa si lazima limaanishe kila mtu kuwa na mali kiasi kilekile. Hivyo tafsiri haisuluhishi kimya kimya mvutano kati ya usawa na haki ya uwiano.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa kulinganisha ‘wengine ... nanyi ...’ umehifadhiwa, na alama ya mkato mwishoni inaonyesha kuwa wazo linaendelea katika mstari unaofuata.
