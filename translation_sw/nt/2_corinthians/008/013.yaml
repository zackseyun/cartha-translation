review_pass:
  verdict: revise
  source_fidelity: Draft accurately represents the explanatory γάρ, the negated intended outcome, the contrast between relief for others and hardship for the Corinthians, and the unfinished continuation signaled by the dash. However, “bali kuwe na usawa” turns ἐξ (“from/out of; on the basis of”) into a separate existential clause somewhat more than necessary. “Bali iwe kwa usawa” retains the intended elliptical construction and makes the basis/manner force clear.
  naturalness: The Swahili is clear, contemporary Standard East African Swahili, and appropriately formal. “Wengine wapate nafuu, nanyi mpate dhiki” is an effective balanced contrast. “Bali iwe kwa usawa” is equally natural and more closely aligned with the Greek phrase.
  terminology: “Nafuu” suitably conveys ἄνεσις in this material-support context, and “dhiki” is an appropriate broad equivalent for θλῖψις. “Usawa” is the best main-text rendering for ἰσότης; the note appropriately preserves the equitable/fairness nuance without requiring identical possessions.
  issues:
  - severity: low
    issue: The phrase “bali kuwe na usawa” does not explicitly reflect the force of ἐξ.
    rationale: Although idiomatic, “kuwe na” recasts the Greek prepositional phrase as an existential statement. “Bali iwe kwa usawa” more naturally preserves the sense that the arrangement is to operate on the basis of equality/equity, while leaving the verse’s continuation open.
