source:
  edition: SBLGNT
  text: καὶ γνώμην ἐν τούτῳ δίδωμι· τοῦτο γὰρ ὑμῖν συμφέρει, οἵτινες οὐ μόνον τὸ ποιῆσαι ἀλλὰ καὶ τὸ θέλειν προενήρξασθε ἀπὸ πέρυσι·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/010.yaml
  text: 'And in this matter I give my judgment: for this is beneficial for you[b][a], who began last year not only to do it but also to will it.'
translation:
  language: sw
  text: 'Na katika jambo hili ninatoa maoni yangu: kwa maana jambo hili lina faida kwenu, ninyi ambao mwaka jana mlianza si kutenda tu, bali pia kuwa na nia ya kutenda.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuwa tayari kutenda.” Kigiriki kinatofautisha nia au utayari na tendo lenyewe.
    reason: lexical_alternative
lexical_decisions:
- source_word: γνώμην
  choice: maoni yangu
  rationale: Katika muktadha huu neno linaonyesha uamuzi au ushauri wa Paulo alioufikiria kwa makini, tofauti na amri ya moja kwa moja. ‘Maoni yangu’ ni Kiswahili cha kawaida na chenye heshima bila kudhoofisha uzito wa pendekezo lake.
- source_word: ἐν τούτῳ
  choice: katika jambo hili
  rationale: Kirai hiki kinaelekeza kwenye jambo mahususi linalozungumziwa, yaani shughuli ya mchango.
- source_word: συμφέρει
  choice: lina faida kwenu
  rationale: Huwasilisha maana ya jambo kuwa lenye manufaa au kufaa kwao, bila kuingiza wazo finyu la faida ya kifedha.
- source_word: τὸ ποιῆσαι
  choice: kutenda
  rationale: Hurejelea utekelezaji halisi wa jambo hilo; kitu kinachotendwa kinaeleweka kutokana na muktadha.
- source_word: τὸ θέλειν
  choice: kuwa na nia ya kutenda
  rationale: Hutofautisha utashi au utayari wa ndani na tendo lenyewe, huku ikitoa Kiswahili cha asili kuliko tafsiri ya moja kwa moja ‘kutaka’ katika muundo huu.
- source_word: προενήρξασθε
  choice: mlianza
  rationale: Maana ya kuanza mapema tayari inaonyeshwa na kirai cha wakati ‘tangu mwaka jana,’ hivyo ‘mlianza’ huepuka urudiaji usio wa lazima.
- source_word: ἀπὸ πέρυσι
  choice: tangu mwaka jana
  rationale: Huhifadhi kwa kawaida zaidi thamani ya ἀπό ya kuanzia wakati uliopita; haikulazimishi sentensi kudai kwamba hatua yenyewe iliendelea bila kukoma.
theological_decisions:
- issue: Nguvu ya kauli ya Paulo kuhusiana na mamlaka yake ya kitume
  choice: Paulo anatoa maoni au ushauri alioufikiria kwa makini, si amri ya moja kwa moja.
  alternative: Paulo anatoa agizo la mamlaka.
  rationale: Muktadha wa karibu unatofautisha amri na γνώμη (2 Kor 8:8, 10). ‘Maoni yangu’ huhifadhi tofauti hiyo bila kuondoa uzito wa ushauri wake wa kitume.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Muundo ‘si ... tu, bali pia ...’ unahifadhi ulinganifu wa Kigiriki, na ‘ninyi ambao’ hudumisha nguvu ya kishazi cha οἵτινες.
