  text: εἰς τὸ παρακαλέσαι ἡμᾶς Τίτον ἵνα καθὼς προενήρξατο οὕτως καὶ ἐπιτελέσῃ εἰς ὑμᾶς καὶ τὴν χάριν ταύτην·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/006.yaml
  text: So we urged Titus that[a], just as he had previously begun, he should also complete among you this act of grace.
translation:
  language: sw
  text: Basi tulimsihi Tito ili, kama alivyoanza hapo awali, vivyo hivyo akamilishe pia miongoni mwenu tendo hili la neema.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kazi hii ya fadhili”; tafsiri ya karibu zaidi ni “neema hii.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακαλέσαι
  choice: tulimsihi
  rationale: Katika muktadha huu, kitenzi kinaonyesha kwamba Paulo na wenzake walimhimiza Tito achukue hatua. ‘Tulimsihi’ lina nguvu inayofaa bila kuwa amri kali.
- source_word: Τίτον
  choice: Tito
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili.
- source_word: καθὼς προενήρξατο
  choice: kama alivyokuwa ameanza hapo awali
  rationale: Kauli hii inahifadhi wazo la kwamba Tito alikuwa tayari ameanzisha kazi hiyo mapema.
- source_word: ἐπιτελέσῃ
  choice: aikamilishe
  rationale: Huwasilisha kusudi la kuifikisha kazi iliyoanzishwa kwenye ukamilifu.
- source_word: εἰς ὑμᾶς
  choice: kati yenu
  rationale: Inaonyesha kazi iliyofanywa miongoni mwa waamini wa Korintho, bila kuibana maana kuwa kwa faida yao tu.
- source_word: χάριν
  choice: tendo hili la neema
  rationale: Katika muktadha wa mchango kwa ajili ya watakatifu, χάρις linahusu tendo halisi la ukarimu huku likidumisha lugha ya neema ya Paulo.
- source_word: καὶ
  choice: pia
  rationale: Neno hili linaonyesha kwamba Tito angekamilisha tendo hilo kama alivyokuwa tayari amelianza.
theological_decisions:
- issue: Maana ya χάρις katika muktadha wa mchango
  choice: tendo hili la neema
  alternative: neema hii; kazi hii ya fadhili; zawadi hii
  rationale: Muktadha unahusu mchango halisi, lakini Paulo anauita χάρις. Tafsiri hii inaweka pamoja tendo la ukarimu na msingi wake wa neema bila kulifanya kuwa neema ya kidhahania tu au zawadi pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umewekwa wazi na wa kawaida huku ukihifadhi uhusiano wa kuanza na kukamilisha, pamoja na mvutano wa maana katika χάρις.
