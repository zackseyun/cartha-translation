  text: begging us with much urging for the grace and the fellowship of this ministry to the saints—[a]
translation:
  language: sw
  text: wakituomba kwa kusihi sana fadhila na ushiriki katika huduma kwa watakatifu—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “neema na ushirika wa huduma kwa watakatifu.”
    reason: χάρις hapa inaweza kumaanisha neema, fadhila, au nafasi ya pekee; κοινωνία inaweza kumaanisha ushirika au kushiriki.
lexical_decisions:
- source_word: μετὰ πολλῆς παρακλήσεως
  choice: kwa bidii nyingi
  rationale: Kirai hiki kinaonyesha namna na nguvu ya ombi. Katika muktadha wa δεόμενοι, παράκλησις ni kusihi kwa dhati, si faraja; tafsiri hii huepuka marudio mazito ya “wakitusihi kwa kusihi sana.”
- source_word: δεόμενοι ἡμῶν
  choice: wakitusihi
  rationale: δέομαι humaanisha kuomba kwa unyenyekevu na kwa nguvu; kiambishi “-tu-” kinawakilisha ἡμῶν, yaani watu walioombwa.
- source_word: τὴν χάριν
  choice: neema
  rationale: “Neema” huhifadhi msamiati muhimu wa Paulo na hapa pia inaweza kubeba maana ya fadhili au nafasi ya upendeleo ya kushiriki katika utoaji.
- source_word: τὴν κοινωνίαν
  choice: ushirika
  rationale: “Ushirika” huhifadhi pande za kushiriki pamoja na uhusiano wa kijumuiya; katika muktadha huu ni kushiriki katika huduma ya msaada.
- source_word: τῆς διακονίας
  choice: wa huduma hii
  rationale: διακονία ni huduma halisi ya kuwasaidia waamini. “Hii” imeongezwa kwa mtiririko wa kawaida wa Kiswahili na huelekeza kwenye huduma inayozungumziwa katika muktadha.
- source_word: τῆς εἰς τοὺς ἁγίους
  choice: kwa watakatifu
  rationale: εἰς hapa huonyesha mwelekeo au manufaa ya huduma kwa ἅγιοι; “watakatifu” huhifadhi istilahi ya Paulo kwa waamini wote.
theological_decisions:
- issue: Maana ya χάρις katika muktadha wa changizo
  choice: neema
  alternative: fadhila / nafasi ya pekee
  rationale: “Neema” huhifadhi mvutano wa kimakusudi kati ya neema ya Mungu na fursa ya kushiriki katika utoaji, bila kuifunga neno hilo kwa maana moja tu.
- issue: Tafsiri ya ἅγιοι
  choice: watakatifu
  alternative: watu watakatifu wa Mungu / waamini
  rationale: Hili ndilo neno la kawaida la Paulo kwa watu wa Mungu kwa ujumla, si tabaka maalumu lililotangazwa baadaye kuwa watakatifu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa kishazi kinachoendelea na alama ya kistari umehifadhiwa kwa kuwa mstari huu unaungana kisarufi na muktadha wake.
