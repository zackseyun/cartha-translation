id: 2CO.8.23
reference: 2 Corinthians 8:23
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἴτε ὑπὲρ Τίτου, κοινωνὸς ἐμὸς καὶ εἰς ὑμᾶς συνεργός· εἴτε ἀδελφοὶ ἡμῶν, ἀπόστολοι ἐκκλησιῶν, δόξα Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/023.yaml
  text: As for Titus[a], he is my partner and fellow worker for you; as for our brothers, they are messengers of the churches[b], the glory of Messiah.
translation:
  language: sw
  text: Kwa habari ya Tito, yeye ni mshirika wangu na mfanyakazi mwenzangu kwa ajili yenu; na kwa habari ya ndugu zetu, wao ni wajumbe wa makanisa[a], utukufu wa Masihi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mitume wa makanisa.” Neno la Kigiriki linaweza kumaanisha wajumbe waliotumwa au mitume kwa maana pana; hapa muktadha unaunga mkono maana ya wawakilishi wa makanisa.
    reason: alternative_reading
  - marker: b
    text: Au, “utukufu wa Kristo.” Neno Χριστός limetafsiriwa hapa kuwa “Masihi” kwa kuwa linatumika kama cheo.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴτε ὑπὲρ Τίτου
  choice: Kwa habari ya Tito
  rationale: Muundo huu ni wa kidondoko na unatanguliza jambo la kwanza kati ya mawili yanayolinganishwa. Kauli hii ni ya kawaida katika Kiswahili na inatoa maana ya ὑπέρ kama ‘kuhusu’ bila kulazimisha tafsiri isiyo ya asili ya εἴτε.
- source_word: κοινωνὸς ἐμὸς
  choice: mshirika wangu
  rationale: κοινωνός humaanisha mtu anayeshiriki pamoja na mwingine; ‘mshirika wangu’ huhifadhi uhusiano na ushirikiano wa huduma kwa lugha ya sasa.
- source_word: εἰς ὑμᾶς συνεργός
  choice: mfanyakazi mwenzangu kwa ajili yenu
  rationale: ‘Mfanyakazi mwenzangu’ hutoa συνεργός kwa uwazi, na ‘kwa ajili yenu’ huonyesha mwelekeo wa huduma kwa Wakorintho bila kuongeza wazo la ‘kwa faida yenu’ ambalo halijasemwa moja kwa moja.
- source_word: ἀδελφοὶ ἡμῶν
  choice: ndugu zetu
  rationale: Katika muktadha huu neno la wingi la kiume linawahusu wale wajumbe wanaume wanaotajwa pamoja na Tito; ‘ndugu zetu’ ni sahihi na ya kawaida.
- source_word: ἀπόστολοι ἐκκλησιῶν
  choice: wajumbe wa makanisa
  rationale: ἀπόστολοι hapa inaelekea kumaanisha watu waliotumwa na makanisa kama wawakilishi wao. ‘Wajumbe’ huepuka kudai bila lazima kwamba walikuwa mitume kwa maana maalumu ya cheo, huku tanbihi ikihifadhi uwezekano huo wa kileksika.
- source_word: δόξα Χριστοῦ
  choice: utukufu wa Masihi
  rationale: Kirai kisicho na kitenzi kinawaeleza ndugu hao kwa kauli ya mlingano. ‘Utukufu wa Masihi’ ni tafsiri ya moja kwa moja inayohifadhi nguvu na ufupi wa Kigiriki, huku Χριστός ikitolewa kama cheo ‘Masihi’.
theological_decisions:
- issue: Maana ya ἀπόστολοι kwa wale ndugu wasiotajwa majina
  choice: wajumbe wa makanisa kwa maana isiyo ya cheo maalumu
  alternative: mitume wa makanisa
  rationale: Muktadha wa ukusanyaji wa msaada na usemi ‘wa makanisa’ unaonyesha watu waliotumwa na makusanyiko kama wawakilishi. Tafsiri hii haingizi dai la ziada kuhusu cheo chao cha kikanisa, lakini tanbihi huhifadhi maana nyingine inayowezekana.
- issue: Jinsi ya kutafsiri Χριστοῦ
  choice: wa Masihi
  alternative: wa Kristo
  rationale: Χριστός hapa inaweza kueleweka kama cheo. ‘Masihi’ hutafsiri cheo hicho badala ya kukinakili kama ‘Kristo,’ huku tanbihi ikionyesha namna nyingine iliyozoeleka.
- issue: Uhusiano wa δόξα Χριστοῦ na ndugu waliotumwa
  choice: 'kauli ya mlingano: wao ni ‘utukufu wa Masihi’'
  alternative: wao humletea Masihi heshima
  rationale: Kigiriki hakina kitenzi wala neno linalomaanisha moja kwa moja ‘heshima.’ Tafsiri ya moja kwa moja huhifadhi taswira na mvutano wa kitheolojia badala ya kuufafanua kuwa tendo la kumpa Masihi heshima.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo sambamba ‘kwa habari ya ... na kwa habari ya ...’ unawakilisha jozi ya εἴτε ... εἴτε kwa mtiririko wa asili. Alama za tanbihi zimewekwa baada ya vifungu vinavyohusika.
