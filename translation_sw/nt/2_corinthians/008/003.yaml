translation:
  language: sw
  text: Kwa maana, nashuhudia kwamba walitoa kadiri ya uwezo wao, na zaidi ya uwezo wao, kwa hiari yao wenyewe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: Kwa maana
  rationale: Hapa neno hili linaanzisha maelezo yanayothibitisha kauli ya mstari uliotangulia; “Kwa maana” linaonyesha uhusiano huo kwa Kiswahili cha kawaida.
- source_word: κατὰ δύναμιν
  choice: kadiri ya uwezo wao
  rationale: κατά pamoja na δύναμις huonyesha kipimo au kiwango; “kadiri ya uwezo wao” linaeleza kutoa kulingana na uwezo waliokuwa nao.
- source_word: μαρτυρῶ
  choice: nashuhudia
  rationale: Kitenzi cha wakati uliopo ni kauli ya Paulo ya kusisitiza ushahidi wake binafsi; “nashuhudia” ni tafsiri ya moja kwa moja na yenye hadhi.
- source_word: καὶ παρὰ δύναμιν
  choice: na hata zaidi ya uwezo wao
  rationale: παρά pamoja na hali ya kushutumiwa huonyesha kuvuka mpaka au kiwango. “Hata” linaakisi msisitizo wa mshangao katika tofauti kati ya uwezo wao na kile walichotoa.
- source_word: αὐθαίρετοι
  choice: kwa hiari yao wenyewe
  rationale: Kivumishi hiki humaanisha kutenda kwa uamuzi au msukumo wa mtu mwenyewe bila kulazimishwa; usemi huu ni wa asili katika Kiswahili na unahifadhi maana hiyo.
theological_decisions:
- issue: Kitenzi kinachodokezwa pamoja na αὐθαίρετοι
  choice: Kudokeza “walitoa” kutokana na muktadha ili sentensi ieleweke kuwa inahusu utoaji wa Wamakedonia kwa hiari.
  alternative: 'Kutafsiri kwa namna ya karibu zaidi na muundo wa Kigiriki: “wakiwa wenye hiari,” ingawa si laini katika Kiswahili.'
  rationale: Kigiriki kina usemi uliodondosha kitenzi, huku αὐθαίρετοι likiwa kivumishi cha kiarifu baada ya kauli ya mabano “nashuhudia.” Muktadha wa mistari ya 2–4 unaonyesha wazi kuwa tendo linalozungumziwa ni kutoa; kulidokeza katika Kiswahili hakupunguzi utata halisi wala kuongeza wazo jipya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo unalenga uwiano bora kati ya uaminifu kwa Kigiriki na usomaji wa kawaida. Hakuna tanbihi iliyoongezwa kwa kuwa chaguo za “uwezo/rasilimali” na “kwa hiari/ kwa kujitakia” hazileti tofauti ya maana inayohitaji kuonyeshwa katika mstari huu.
