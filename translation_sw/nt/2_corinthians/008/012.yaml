  text: εἰ γὰρ ἡ προθυμία πρόκειται, καθὸ ἐὰν ⸀ἔχῃ εὐπρόσδεκτος, οὐ καθὸ οὐκ ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/012.yaml
  text: For if the readiness is present[a], it is acceptable according to what one has[b], not according to what one does not have.
translation:
  language: sw
  text: Kwa maana ikiwa utayari upo[a], unakubalika kulingana na kile mtu alicho nacho[b], si kulingana na kile ambacho hana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nia ya hiari” au “hamu.”
    reason: lexical_alternative
  - marker: b
    text: Kwa maana halisi, “kulingana na chochote ambacho mtu huenda akawa nacho ... si kulingana na kile ambacho hana.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προθυμία
  choice: utayari
  rationale: Neno hili linaonyesha moyo wa hiari ulio tayari na wenye hamu ya kutoa. “Utayari” ni la kawaida na linafaa katika muktadha wa ukarimu uliokusudiwa.
- source_word: πρόκειται
  choice: upo
  rationale: Katika muundo huu, kitenzi kinaonyesha kwamba utayari huo uko au umekuwapo, badala ya maana halisi ya kitu kuwekwa mbele.
- source_word: καθὸ ἐὰν ἔχῃ
  choice: kulingana na kile mtu alicho nacho
  rationale: Kauli hii huweka kipimo kwa mujibu wa uwezo au mali iliyopo. “Mtu” huhifadhi urejeo wa jumla bila kuufanya wa kiume pekee.
- source_word: εὐπρόσδεκτος
  choice: unakubalika
  rationale: Neno hili lina maana ya kukubaliwa au kupokelewa vizuri. Tafsiri haimtaji anayekubali, kwa kuwa maandishi yenyewe hayamtaji wazi.
- source_word: οὐ καθὸ οὐκ ἔχει
  choice: si kulingana na kile ambacho hana
  rationale: Kauli hii huhifadhi ulinganifu na kishazi kilichotangulia na tofauti kati ya kile mtu alicho nacho na kile ambacho hana.
- source_word: εἰ γὰρ
  choice: Kwa maana ikiwa
  rationale: “Kwa maana” huhifadhi uhusiano wa ufafanuzi na yaliyotangulia, huku “ikiwa” ikihifadhi hali ya sharti.
theological_decisions:
- issue: Kigezo na upande unaokubali utayari huo
  choice: Tafsiri inasema tu kwamba utayari unakubalika kwa kadiri ya kile mtu alicho nacho, bila kutaja wazi ni nani anayekubali.
  alternative: “unakubalika kwa Mungu” au “unakubalika kwa jumuiya”
  rationale: εὐπρόσδεκτος hudokeza kukubaliwa, lakini mstari haumtambui wazi anayekubali. Kutomtaja huhifadhi uwazi wenye mipaka na mvutano wa kiteolojia wa maandishi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na heshima. Muundo wa sentensi umehifadhi hoja ya masharti na ulinganifu wa vifungu vya Kigiriki bila kuongeza kwamba kukubalika huko ni mbele za Mungu au mbele ya jumuiya.
