translation:
  language: sw
  text: Tunachukua tahadhari hii, ili mtu yeyote asitulaumu kuhusu mchango huu wa ukarimu[a] tunaousimamia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mchango huu mwingi” au “mchango huu mkubwa.” Neno la Kigiriki linaweza kumaanisha wingi, ukarimu, au bounty ya mchango.
    reason: lexical_alternative
lexical_decisions:
- source_word: στελλόμενοι τοῦτο
  choice: Tunahakikisha jambo hili mapema
  rationale: Kirai hiki kinaonyesha kuchukua hatua za tahadhari ili kuepuka tatizo. Tafsiri hii ni ya asili kwa Kiswahili na inaunganika wazi na kishazi kinachofuata.
- source_word: μή τις ἡμᾶς μωμήσηται
  choice: ili mtu yeyote asitulaumu
  rationale: μή pamoja na hali tegemezi huonyesha kusudi la kuzuia jambo; μωμάομαι ni kulaumu au kupata kosa.
- source_word: ἐν τῇ ἁδρότητι ταύτῃ
  choice: kuhusu sadaka hii kubwa
  rationale: Katika muktadha huu ἁδρότης ni mchango wenye wingi au ukarimu. “Sadaka hii kubwa” hutaja mchango huo kwa lugha ya kawaida bila kupoteza wazo la ukubwa wake.
- source_word: τῇ διακονουμένῃ ὑφ’ ἡμῶν
  choice: tunayoisimamia
  rationale: διακονέω hapa inahusu huduma ya kusimamia na kushughulikia mchango; “tunayoisimamia” ni wazi na ya kawaida katika muktadha wa uwajibikaji wa fedha.
theological_decisions:
- issue: Sababu ya tahadhari ya Paulo katika kushughulikia mchango
  choice: Kuonyesha hatua ya makusudi ya kuzuia lawama katika usimamizi wa sadaka
  alternative: Kueleza tu mipango ya safari bila kusisitiza uwajibikaji
  rationale: Muundo wa Kigiriki unalenga kuzuia mtu yeyote asiwalaumu Paulo na wenzake kuhusu mchango. Tafsiri inadumisha mkazo huu wa uwajibikaji bila kuongeza dai pana la kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. “Sadaka” limetumiwa kwa mchango wa msaada unaozungumziwa katika muktadha, na “kusimamia” linaweka wazi uwajibikaji wa kuushughulikia.
