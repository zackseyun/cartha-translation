source:
  edition: SBLGNT
  text: οὐ μόνον δὲ ἀλλὰ καὶ χειροτονηθεὶς ὑπὸ τῶν ἐκκλησιῶν συνέκδημος ἡμῶν ⸀σὺν τῇ χάριτι ταύτῃ τῇ διακονουμένῃ ὑφ’ ἡμῶν πρὸς τὴν ⸀αὐτοῦ τοῦ κυρίου δόξαν καὶ προθυμίαν ἡμῶν—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/019.yaml
  text: And not only that[d][c][b][a], but he was also appointed by the churches as our traveling companion with this gracious gift that is being administered by us for the glory of the Lord himself and our eagerness—
translation:
  language: sw
  text: Wala si hivyo tu, bali pia alichaguliwa[a] na makanisa kuwa mwandamani wetu safarini katika huduma ya zawadi hii ya neema[b] inayosimamiwa na sisi, kwa ajili ya utukufu wa Bwana mwenyewe[c] na utayari wetu—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “aliteuliwa” na makanisa.
    reason: lexical_alternative
  - marker: b
    text: Au “neema hii”; hapa “zawadi hii ya neema” unaonyesha χάρις katika muktadha wa mchango.
    reason: lexical_alternative
  - marker: c
    text: Au “utukufu wa Bwana wake”; maneno ya Kigiriki yanaweza pia kueleweka kuwa “utukufu wa Bwana.”
    reason: alternative_reading
lexical_decisions:
- source_word: χειροτονηθεὶς
  choice: alichaguliwa
  rationale: Neno hili linaonyesha kwamba makanisa yalimteua mtu huyo. “Alichaguliwa” ni Kiswahili cha kawaida na hakilazimishi wazo la utaratibu maalumu wa kisasa wa kupiga kura.
- source_word: ἐκκλησιῶν
  choice: makanisa
  rationale: Katika matumizi ya Paulo, neno hili kwa kawaida linamaanisha jumuiya za waamini; “makanisa” ni tafsiri ya kawaida na inayoeleweka.
- source_word: συνέκδημος
  choice: mwandamani wetu safarini
  rationale: Huhifadhi maana ya mtu anayesafiri pamoja na wengine kwa lugha ya asili na iliyo wazi.
- source_word: χάριτι
  choice: zawadi hii ya neema
  rationale: Katika muktadha wa mchango, χάρις linahusu zawadi au tendo la ukarimu linalotokana na neema; usemi huu huhifadhi maana halisi ya zawadi na sifa yake ya neema.
- source_word: διακονουμένῃ
  choice: tunayoihudumia
  rationale: Kitenzi kinaeleza huduma ya Paulo na wenzake katika kushughulikia mchango. “Tunayoihudumia” huhifadhi lugha ya huduma bila kudokeza tayari kuwa fedha zinagawanywa.
- source_word: πρὸς
  choice: kwa ajili ya
  rationale: Hapa πρὸς linaonyesha kusudi au lengo la huduma hii.
- source_word: αὐτοῦ τοῦ κυρίου
  choice: Bwana mwenyewe
  rationale: αὐτοῦ limechukuliwa kuwa la kusisitiza na kuhusishwa na τοῦ κυρίου, huku uwezekano mwingine ukihifadhiwa katika tanbihi.
- source_word: κυρίου
  choice: Bwana
  rationale: Hii ndiyo tafsiri ya kawaida na yenye uzito unaofaa kwa κύριος katika muktadha huu.
- source_word: δόξαν
  choice: utukufu
  rationale: “Utukufu” ni tafsiri ya kawaida ya δόξα na inafaa katika kauli hii ya kusudi.
- source_word: προθυμίαν
  choice: utayari
  rationale: Neno hili linaweza kumaanisha ari, nia ya dhati, au utayari. “Utayari” huhifadhi maana bila kuongeza kihusishi kisichotajwa wazi kama “kusaidia”.
theological_decisions:
- issue: Rejeleo na nguvu ya αὐτοῦ katika πρὸς τὴν αὐτοῦ τοῦ κυρίου δόξαν
  choice: “utukufu wa Bwana mwenyewe,” likichukulia αὐτοῦ kuwa la kusisitiza
  alternative: “utukufu wa Bwana wake” au kwa urahisi “utukufu wa Bwana”
  rationale: Muundo wa Kigiriki umebanwa na unaweza kueleweka kwa zaidi ya njia moja. Tafsiri kuu inasisitiza Bwana bila kuingiza kimya kimya mwenye kumiliki asiye wazi, na tanbihi huhifadhi uwezekano mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inadumisha mwendelezo wa mawazo unaoishia kwa alama ya kistari, kama katika chanzo. “Wala si hivyo tu” ni kiunganishi cha kawaida; “mwandamani wetu safarini” huepuka usemi mgumu; “utayari wetu” huhifadhi ufupi na kutokamilika kwa προθυμίαν ἡμῶν bila kuongeza “kusaidia.”
