  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ οὐ καθὼς ἠλπίσαμεν ἀλλ’ ἑαυτοὺς ἔδωκαν πρῶτον τῷ κυρίῳ καὶ ἡμῖν διὰ θελήματος θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/005.yaml
  text: And not as we expected[a], but they gave themselves first to the Lord and to us through the will of God[b],
translation:
  language: sw
  text: Nao si kama tulivyotarajia[a], bali walijitoa wenyewe kwanza kwa Bwana, na kwetu pia, kwa mapenzi ya Mungu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kama tulivyotumaini.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa njia ya mapenzi ya Mungu” au “kulingana na mapenzi ya Mungu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς ἠλπίσαμεν
  choice: kama tulivyotarajia
  rationale: Kitenzi ἐλπίζω kinaweza kumaanisha kutumaini, lakini hapa kinaeleza matarajio ya Paulo na wenzake kuhusu tendo la Wamakedonia. ‘Tulivyotarajia’ ni Kiswahili cha kawaida katika muktadha huu, huku maana mbadala ya ‘tulivyotumaini’ ikihifadhiwa katika tanbihi.
- source_word: ἑαυτοὺς ἔδωκαν
  choice: walijitoa wenyewe
  rationale: Kauli hii inahifadhi msisitizo wa kiwakilishi rejeshi na wazo la kujitoa binafsi, badala ya kuifanya ihusu mchango wa fedha peke yake.
- source_word: πρῶτον
  choice: kwanza
  rationale: ‘Kwanza’ huhifadhi kipaumbele kinachoweza kuwa cha mpangilio wa wakati au cha umuhimu bila kukifafanua kupita kiasi.
- source_word: τῷ κυρίῳ
  choice: kwa Bwana
  rationale: ‘Bwana’ ndiyo tafsiri ya kawaida na yenye heshima ya κύριος katika muktadha huu; kihusishi ‘kwa’ kinaonyesha walikojielekeza katika kujitoa kwao.
- source_word: καὶ ἡμῖν
  choice: na kwetu pia
  rationale: Hii huhifadhi kishazi sambamba cha Kiyunani, huku ‘pia’ kikifanya Kiswahili kisomeke kwa kawaida bila kuweka Paulo na wenzake katika hadhi sawa na Bwana.
- source_word: διὰ θελήματος θεοῦ
  choice: kwa mapenzi ya Mungu
  rationale: Kauli hii ni ya kawaida katika Kiswahili na inaweza kueleweka kuwa tendo hilo lilitokana na mapenzi ya Mungu au lilifanyika kwa kupatana nayo. Tanbihi inahifadhi kwa uwazi maana mbadala ya upatanifu.
theological_decisions:
- issue: Uhusiano kati ya kujitoa kwa Bwana na kujitoa kwa Paulo na wenzake
  choice: Mpangilio ‘kwanza kwa Bwana, na kwetu pia’ unahifadhi kipaumbele cha Bwana na ushirikiano wao na wahudumu wa utume.
  alternative: Maneno hayo yanaweza kueleweka kuwa kujitoa kwa pande mbili, bila daraja jingine lililo wazi zaidi ya neno ‘kwanza’.
  rationale: Tafsiri inafuata mpangilio wa πρῶτον na vihusishi viwili bila kuongeza madai ya kikanisa au ya kimamlaka yasiyosemwa wazi katika matini.
- issue: Nguvu ya διὰ θελήματος θεοῦ
  choice: ‘Kwa mapenzi ya Mungu’ imeachwa na upana wa maana unaoweza kuhusisha chanzo, uwezeshaji, au upatanifu na mapenzi ya Mungu.
  alternative: ‘Kulingana na mapenzi ya Mungu’ husisitiza zaidi upatanifu; ‘kwa njia ya mapenzi ya Mungu’ husisitiza zaidi njia au chanzo.
  rationale: Kiyunani hakilazimishi maana moja pekee, hivyo tafsiri kuu haifungi mvutano huo wa kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Hawakufanya’ huweka wazi muundo wa sentensi katika Kiswahili, kwa kuwa Kiyunani kinaanza kwa kishazi cha ulinganisho kinachotegemea tendo linalofuata. Maneno ‘walijitoa wenyewe’ yanahifadhi msisitizo wa kujitoa binafsi.
