source:
  edition: SBLGNT
  text: συνεπέμψαμεν δὲ αὐτοῖς τὸν ἀδελφὸν ἡμῶν ὃν ἐδοκιμάσαμεν ἐν πολλοῖς πολλάκις σπουδαῖον ὄντα, νυνὶ δὲ πολὺ σπουδαιότερον πεποιθήσει πολλῇ τῇ εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/022.yaml
  text: And we have sent with them our brother[a], whom we have often tested in many matters and found to be diligent, but who is now even more diligent because of his great confidence in you.
translation:
  language: sw
  text: Nasi tumemtuma pamoja nao ndugu yetu, ambaye tumemjaribu mara nyingi katika mambo mengi na kumwona kuwa mwenye bidii, lakini sasa ana bidii zaidi sana kwa sababu ya imani yake kubwa kwenu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “lakini sasa ana bidii zaidi sana kwa sababu ya uhakika wake mkubwa kuwahusu ninyi.” Kirai cha Kigiriki kinaweza kuchukuliwa kwa namna tofauti kidogo, ingawa maana ya jumla ni kwamba bidii yake imeongezeka kuhusiana nanyi.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνεπέμψαμεν
  choice: tumemtuma pamoja nao
  rationale: Kauli ya wakati uliopita inaeleza tendo la kumtuma; kiambishi σύν- kinaonyeshwa kwa ‘pamoja nao.’
- source_word: ἀδελφὸν ἡμῶν
  choice: ndugu yetu
  rationale: Inahifadhi lugha ya kifamilia ya jumuiya ya waamini na rejeo la mwanamume mmoja asiyepewa jina.
- source_word: ἐδοκιμάσαμεν
  choice: tumemjaribu ... na kumwona
  rationale: Neno linaashiria kupima tabia ambako kumethibitisha sifa yake; muundo huu unahifadhi jaribio na matokeo yake.
- source_word: ἐν πολλοῖς πολλάκις
  choice: mara nyingi katika mambo mengi
  rationale: Inahifadhi kwa uwazi wazo la kurudiwa mara nyingi na upana wa mazingira au mambo yaliyohusika.
- source_word: σπουδαῖον ὄντα
  choice: kuwa mwenye bidii
  rationale: ‘Mwenye bidii’ huwasilisha umakini, juhudi, na utayari bila kuifanya sifa hiyo kuwa hisia tu.
- source_word: νυνὶ δὲ πολὺ σπουδαιότερον
  choice: lakini sasa ana bidii zaidi sana
  rationale: Inahifadhi ulinganisho na msisitizo wa πολὺ, huku ikirejelea sifa ileile iliyotajwa awali.
- source_word: πεποιθήσει πολλῇ τῇ εἰς ὑμᾶς
  choice: kwa sababu ya tumaini lake kubwa kwenu
  rationale: Dativu inaeleweka kiasili kama sababu ya kuongezeka kwa bidii yake; ‘kwenu’ huhifadhi mwelekeo wa tumaini hilo kwa Wakorintho.
theological_decisions:
- issue: Mhusika na maana ya πεποιθήσει πολλῇ τῇ εἰς ὑμᾶς
  choice: Tumaini la ndugu huyo kwa Wakorintho ndilo sababu ya bidii yake iliyoongezeka.
  alternative: Huenda ikawa ni tumaini la Paulo kwa Wakorintho, au uhakika/ujasiri wa ndugu huyo katika kushughulika nao.
  rationale: Muundo wa karibu zaidi wa sentensi unaunganisha kirai hiki na ndugu asiyepewa jina na kueleza bidii yake ya sasa; tanbihi inahifadhi uwezekano mdogo wa uelewa tofauti.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wazi kwa msomaji wa kawaida, huku ukihifadhi urudiaji wa ‘mara nyingi ... mambo mengi,’ ulinganisho wa bidii, na utata mdogo wa kirai cha mwisho.
