base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/009.yaml
  text: 'For we rejoice when we are weak and you are strong[a]. And this also is what we pray for: your restoration.'
translation:
  language: sw
  text: 'Kwa maana tunafurahi tunapokuwa dhaifu, nanyi mkiwa na nguvu. Hili pia ndilo tunaloomba: kurejeshwa kwenu katika hali inayofaa.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ukomavu wenu” au “kukamilishwa kwenu.” Neno la Kigiriki linaweza kumaanisha kurejeshwa, kuandaliwa, au kuletwa katika hali inayofaa.
    reason: lexical_alternative
lexical_decisions:
- source_word: χαίρομεν
  choice: tunafurahi
  rationale: Kitenzi cha wakati uliopo kinaonyesha msimamo wa sasa wa Paulo; “tunafurahi” ni Kiswahili cha kawaida chenye uzito unaofaa.
- source_word: γὰρ
  choice: kwa maana
  rationale: Inaendeleza uhusiano wa maelezo na hoja iliyotangulia.
- source_word: ὅταν ἡμεῖς ἀσθενῶμεν
  choice: tunapokuwa dhaifu
  rationale: “Tunapokuwa” huhifadhi maana ya jumla ya wakati, na “dhaifu” haibani udhaifu huo kuwa wa kimwili, kijamii, au wa mamlaka pekee.
- source_word: ὑμεῖς δὲ δυνατοὶ ἦτε
  choice: nanyi mkiwa na nguvu
  rationale: Muundo huu unaonyesha tofauti na udhaifu wa Paulo na wenzake bila kutafsiri nguvu hizo kwa namna finyu.
- source_word: τοῦτο καὶ εὐχόμεθα
  choice: Pia tunaomba jambo hili
  rationale: Huhifadhi maana ya sala na msisitizo wa τοῦτο huku ikisomeka kwa kawaida katika Kiswahili.
- source_word: τὴν ὑμῶν κατάρτισιν
  choice: mrejeshwe katika hali inayofaa
  rationale: Kifungu hiki kinaeleza kurekebishwa au kurudishwa katika hali njema; muundo wa kitenzi ni wa kawaida zaidi kwa wasomaji wa Kiswahili kuliko nomino nzito kama “urekebisho wenu,” huku tanbihi ikihifadhi upana wa neno la Kigiriki.
theological_decisions:
- issue: Maana ya κατάρτισις kuhusiana na lengo la kichungaji la Paulo
  choice: mrejeshwe katika hali inayofaa
  alternative: mkomae; mkamilishwe; muwekwe katika hali inayofaa
  rationale: Muktadha unaelekea kwenye kurekebishwa na kurudishwa katika hali inayofaa, lakini neno lenyewe linaweza pia kumaanisha kuandaliwa au kuletwa kwenye ukamilifu. Tafsiri kuu haingizi fundisho maalumu la ukamilifu, na tanbihi huhifadhi uwezekano mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ya pili imeundwa kwa njia ya kawaida ya Kiswahili, huku tofauti kati ya udhaifu na nguvu pamoja na upana wa κατάρτισις vikihifadhiwa.
