  text: But I hope that you will know that we are not disqualified[a].
translation:
  language: sw
  text: Lakini natumaini kwamba mtajua kwamba sisi si watu waliokataliwa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sisi si watu wasioidhinishwa” au “sisi si watu walioshindwa kipimo.” Neno la Kigiriki hurejelea wale ambao hawakukubalika baada ya kupimwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλπίζω
  choice: natumaini
  rationale: Kitenzi cha wakati wa sasa, nafsi ya kwanza umoja, kinaeleza tumaini la Paulo kuhusu watakachotambua baadaye.
- source_word: δὲ
  choice: Lakini
  rationale: Kiunganishi hiki kinaonyesha utofauti wa kiasi na wazo lililotangulia; “Lakini” ni ya kawaida na ya asili katika muktadha huu.
- source_word: γνώσεσθε
  choice: mtajua
  rationale: Wakati ujao unaeleza ufahamu ambao Wakorintho watakuwa nao; “mtajua” huhifadhi maana hiyo bila kuongeza wazo la mchakato.
- source_word: ὅτι
  choice: kwamba
  rationale: Katika sehemu zote mbili, neno hili linaanzisha kishazi kinachoeleza yaliyomo katika tumaini na ufahamu.
- source_word: ἡμεῖς
  choice: sisi
  rationale: Kiwakilishi kilicho wazi katika Kigiriki kina uzito fulani; kukitaja kama “sisi” kunahifadhi msisitizo huo kwa Kiswahili.
- source_word: οὐκ ἐσμὲν
  choice: hatuja-
  rationale: Ukanushi umeunganishwa kiasili na kitenzi “kataliwa,” bila kuutia nguvu kuliko ulivyo katika Kigiriki.
- source_word: ἀδόκιμοι
  choice: hatujakataliwa katika jaribu
  rationale: Katika muktadha wa kujichunguza na kujaribiwa, neno hili humaanisha kutothibitishwa au kushindwa kustahili baada ya kupimwa. Kauli hii ni ya kawaida zaidi kuliko “hatukukubaliwa” na huepuka maana nzito ya kidoktrini.
theological_decisions:
- issue: Maana ya ἀδόκιμοι katika muktadha wa kupimwa na uhalali wa huduma ya mitume
  choice: hatujakataliwa katika jaribu
  alternative: hatukuthibitishwa; hatushindi jaribu; sisi si watu waliokataliwa
  rationale: Tafsiri inahifadhi picha ya kupimwa na kukataliwa baada ya kutofikia kiwango, bila kuifanya kuwa tamko kuhusu hukumu ya milele au kuingiza maana ya kidhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “sisi hatujakataliwa” unahifadhi kiwakilishi chenye msisitizo, na tanbihi inaweka wazi taswira ya kupimwa iliyomo katika neno la Kigiriki.
