  text: Λοιπόν, ἀδελφοί, χαίρετε, καταρτίζεσθε, παρακαλεῖσθε, τὸ αὐτὸ φρονεῖτε, εἰρηνεύετε, καὶ ὁ θεὸς τῆς ἀγάπης καὶ εἰρήνης ἔσται μεθ’ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/011.yaml
  text: Finally[a], brothers, rejoice, be restored, be encouraged, think the same thing, live in peace[e][d][c][b], and the God of love and peace will be with you.
translation:
  language: sw
  text: Hatimaye[a], ndugu[b], furahini, rejeshweni[c], tiweni moyo[d], fikirini jambo lilelile[e], ishini kwa amani, na Mungu wa upendo na amani atakuwa pamoja nanyi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au “kwa kuhitimisha.” Neno la Kigiriki pia linaweza kutumiwa kama salamu ya kuaga, lakini hapa yaelekea linaendelea na mfululizo wa maagizo: “furahini.”'
    reason: lexical_alternative
  - marker: b
    text: “Ndugu” hapa linahutubia kusanyiko lote, yaani wanaume na wanawake.
    reason: cultural_note
  - marker: c
    text: Au “kamilishweni,” “rekebishweni,” au “jiwekeni sawa.”
    reason: lexical_alternative
  - marker: d
    text: Au “kubalini kutiwa moyo au kuonywa.”
    reason: lexical_alternative
  - marker: e
    text: Kwa maana halisi, “fikirini jambo lilelile”; yaani, “iweni na nia moja.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Λοιπόν
  choice: Hatimaye
  rationale: Ni kiashiria cha hitimisho la barua; “Hatimaye” ni cha kawaida na chenye hadhi katika Kiswahili.
- source_word: ἀδελφοί
  choice: ndugu
  rationale: “Ndugu” huhifadhi lugha ya kifamilia ya Paulo na katika Kiswahili inaweza kulielekea kusanyiko lenye wanaume na wanawake.
- source_word: χαίρετε
  choice: furahini
  rationale: Ingawa neno hili linaweza kuwa salamu ya kuaga, hapa limo katika mfululizo wa maagizo, hivyo maana ya kufurahi inafaa zaidi.
- source_word: καταρτίζεσθε
  choice: rekebishweni
  rationale: Kitenzi kinaweza kumaanisha kurejeshwa, kutengenezwa, au kuletwa katika hali inayofaa. “Rekebishweni” hudumisha wazo hilo bila kudai ukamilifu usio na kasoro.
- source_word: παρακαλεῖσθε
  choice: tiweni moyo
  rationale: Umbo hili linaweza kueleza kupokea faraja, kutiwa moyo, au mawaidha. “Tiweni moyo” ni Kiswahili cha kawaida na huhifadhi hali ya kupokea tendo.
- source_word: τὸ αὐτὸ φρονεῖτε
  choice: fikirini jambo lilelile
  rationale: Tafsiri hii inafuata kwa karibu maana ya “fikirini kitu kilekile,” huku ikihifadhi msisitizo wa umoja wa fikra bila kuufanya kuwa makubaliano kamili katika kila jambo.
- source_word: εἰρηνεύετε
  choice: ishini kwa amani
  rationale: Agizo la wakati uliopo linaashiria mwenendo unaoendelea wa amani ndani ya jumuiya.
- source_word: ὁ θεὸς τῆς ἀγάπης καὶ εἰρήνης
  choice: Mungu wa upendo na amani
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya kirai cha Kigiriki.
- source_word: ἔσται μεθ’ ὑμῶν
  choice: atakuwa pamoja nanyi
  rationale: Huhifadhi ahadi ya wakati ujao na wingi wa “nanyi” katika Kiswahili sanifu.
theological_decisions:
- issue: Nguvu jumuishi ya ἀδελφοί katika kulihutubia kusanyiko
  choice: Kutumia “ndugu” katika matini kuu
  alternative: ndugu wanaume na wanawake
  rationale: Neno la Kigiriki lina umbo la kiume la wingi, lakini katika matumizi haya linawaelekea waumini wote. “Ndugu” la Kiswahili huhifadhi sitiari ya familia na kwa kawaida linaweza kuwajumuisha wote bila kuongeza maneno yasiyokuwapo katika matini.
- issue: Maana ya καταρτίζεσθε katika muktadha wa kurekebishwa kwa kanisa
  choice: rekebishweni
  alternative: kamilishweni; rejeshweni katika hali inayofaa; jiwekeni sawa
  rationale: Chaguo hili huhifadhi wazo la kuletwa katika hali inayofaa na hali ya kutendewa, huku likiepuka kutafsiri kitenzi kama dai la ukamilifu wa kiroho usio na kasoro.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Mfululizo wa vitenzi vya agizo umehifadhiwa, na “nanyi” linaonyesha wazi kuwa Paulo analihutubia kusanyiko kwa wingi.
