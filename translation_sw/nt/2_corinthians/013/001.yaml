id: 2CO.13.1
reference: 2 Corinthians 13:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Τρίτον τοῦτο ἔρχομαι πρὸς ὑμᾶς· ἐπὶ στόματος δύο μαρτύρων καὶ τριῶν σταθήσεται πᾶν ῥῆμα.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/001.yaml
  text: 'This is the third time I am coming to you: “Every matter will be established by the testimony of two witnesses or three.”[a][b]'
translation:
  language: sw
  text: 'Hii ni mara ya tatu ninakuja kwenu: “Kila jambo litathibitishwa kwa ushahidi wa mashahidi wawili au watatu.”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kila neno litathibitishwa kwa kinywa cha mashahidi wawili au watatu.” Kigiriki kinafuata kwa karibu maneno ya Kumbukumbu la Torati 19:15 na kinatumia nahau ya kisheria.
    reason: lexical_alternative
  - marker: b
    text: Dokezo la Kumbukumbu la Torati 19:15.
    reason: cross_reference
lexical_decisions:
- source_word: Τρίτον τοῦτο
  choice: Hii ni mara ya tatu
  rationale: Kirai hiki kinafanya kazi kama kielezi kinachoonyesha kwamba huku ni kuja kwa Paulo kwa mara ya tatu; muundo huu ni wa kawaida na wazi katika Kiswahili.
- source_word: ἔρχομαι πρὸς ὑμᾶς
  choice: ninakuja kwenu
  rationale: Wakati wa sasa hapa una nguvu ya tukio lililo karibu kutokea. ‘Ninakuja kwenu’ huhifadhi ukaribu wa ziara iliyotangazwa bila kuongeza maana ya kuwa tayari njiani.
- source_word: ἐπὶ στόματος
  choice: kwa ushahidi wa
  rationale: Hii ni nahau ya kisheria inayorejelea ushuhuda unaotolewa na mashahidi. Tafsiri ya neno kwa neno, ‘kwa kinywa cha,’ ingekuwa isiyo ya kawaida na ingeweza kuficha maana katika Kiswahili cha sasa.
- source_word: δύο μαρτύρων καὶ τριῶν
  choice: mashahidi wawili au watatu
  rationale: Ingawa Kigiriki kina kiunganishi καί, hapa kimetumiwa katika kanuni maalumu ya kisheria yenye maana ya idadi mbadala, ‘wawili au watatu,’ si jumla ya mashahidi watano.
- source_word: σταθήσεται
  choice: litathibitishwa
  rationale: Katika muktadha wa kisheria, kitenzi hiki humaanisha jambo kuthibitishwa au kusimamishwa kuwa halali. ‘Litathibitishwa’ ni wazi na cha kawaida katika Kiswahili.
- source_word: πᾶν ῥῆμα
  choice: Kila jambo
  rationale: ῥῆμα inaweza kumaanisha neno, kauli, au jambo. Katika nukuu hii ya kisheria, ‘jambo’ huwasilisha maana pana bila kuibana kuwa shtaka pekee.
theological_decisions:
- issue: Matumizi ya kanuni ya kisheria ya Kumbukumbu la Torati katika muktadha wa Paulo
  choice: Kila jambo litathibitishwa
  alternative: Kila neno litathibitishwa; kila shtaka litathibitishwa
  rationale: Tafsiri hii huhifadhi matumizi mapana ya kanuni ya kisheria bila kuifanya ihusu nidhamu ya kanisa pekee, na tanbihi huonyesha tafsiri ya karibu zaidi ya maneno ya Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wenye heshima na unaoeleweka. ‘Kwenu’ ni ya kawaida kwa kueleza kwenda kwa watu; ‘kwa ushahidi wa mashahidi’ huhifadhi maana ya kisheria ingawa kuna urudiaji wa mzizi unaokubalika katika muktadha huu.
