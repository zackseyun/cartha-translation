  text: διὰ τοῦτο ταῦτα ἀπὼν γράφω, ἵνα παρὼν μὴ ἀποτόμως χρήσωμαι κατὰ τὴν ἐξουσίαν ἣν ⸂ὁ κύριος ἔδωκέν μοι⸃, εἰς οἰκοδομὴν καὶ οὐκ εἰς καθαίρεσιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/010.yaml
  text: For this reason I write these things while absent[a], so that when present I may not have to act harshly[b], according to the authority that the Lord gave me for building up and not for tearing down.
translation:
  language: sw
  text: Kwa sababu hiyo, ninawaandikia mambo haya nikiwa mbali, ili nitakapokuwa pamoja nanyi nisilazimike kutenda kwa ukali[a], kwa kutumia mamlaka ambayo Bwana alinipa kwa ajili ya kujenga, wala si kubomoa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nisitumie ukali” au “nisiwashughulikie kwa ukali.”
    reason: lexical_alternative
  - marker: b
    text: 'Au “kwa ajili ya kuimarisha, wala si kuangamiza.” Kigiriki kinatumia sitiari ya ujenzi: “kujenga, wala si kubomoa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Kwa sababu hiyo
  rationale: Kiunganishi hiki kinaonyesha sababu au matokeo yanayohusiana wazi na habari iliyotangulia.
- source_word: ταῦτα ἀπὼν γράφω
  choice: ninawaandikia mambo haya nikiwa mbali
  rationale: “Mambo haya” huhifadhi wingi wa ταῦτα; “ninawaandikia” ni Kiswahili cha kawaida katika muktadha wa barua, huku “nikiwa mbali” kikidumisha utofauti na kuwapo kwake baadaye.
- source_word: ἵνα παρὼν
  choice: ili nitakapokuwa pamoja nanyi
  rationale: “Ili” huonyesha kusudi, na “nitakapokuwa pamoja nanyi” hueleza kwa lugha ya kawaida maana ya kuwapo kwake binafsi miongoni mwa wasomaji.
- source_word: μὴ ἀποτόμως χρήσωμαι
  choice: nisilazimike kutenda kwa ukali
  rationale: ἀποτόμως ina maana ya ukali au namna kali ya kushughulika; “nisilazimike” huonyesha ulazima usiotamaniwa unaodokezwa na muktadha bila kudai kwamba kitenzi chenyewe humaanisha kulazimika.
- source_word: κατὰ τὴν ἐξουσίαν
  choice: kwa kutumia mamlaka
  rationale: Katika muktadha huu κατά linaonyesha kutenda kwa mamlaka aliyopewa; muundo huu ni wazi na wa kawaida katika Kiswahili.
- source_word: ὁ κύριος ἔδωκέν μοι
  choice: Bwana alinipa
  rationale: Huhifadhi cheo “Bwana” bila kufafanua zaidi utambulisho wake kuliko mstari wenyewe, na hutafsiri aoristi kwa wakati uliopita wa kawaida.
- source_word: εἰς οἰκοδομὴν καὶ οὐκ εἰς καθαίρεσιν
  choice: kwa ajili ya kujenga, wala si kubomoa
  rationale: Huhifadhi sitiari ya ujenzi na ulinganifu mkali kati ya kujenga na kubomoa kwa lugha inayoeleweka kwa urahisi.
theological_decisions:
- issue: Anayerejelewa kwa cheo ὁ κύριος
  choice: Bwana
  alternative: Kumtaja wazi kuwa Yesu au Mungu
  rationale: Maandishi ya Kigiriki yana cheo “Bwana” pekee katika mstari huu; tafsiri haiongezi utambulisho wa kidoktrini ambao haujaelezwa moja kwa moja hapa.
- issue: Kusudi la mamlaka ya Paulo
  choice: kwa ajili ya kujenga, wala si kubomoa
  alternative: kwa ajili ya kuimarisha, wala si kuangamiza
  rationale: Chaguo hili huhifadhi sitiari ya ujenzi iliyomo katika οἰκοδομή na καθαίρεσις, huku likiacha wazi jinsi mamlaka hiyo inavyowajenga watu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Tafsiri inatumia sentensi ya kawaida kwa wasomaji wengi, huku ikihifadhi sitiari ya ujenzi na utofauti kati ya Paulo kuwa mbali na kuwa pamoja nao.
