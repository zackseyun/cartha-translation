  to: Kwa maana alisulubiwa katika udhaifu[a], lakini anaishi kwa nguvu za Mungu. Kwa maana sisi nasi tu dhaifu katika yeye, lakini tutaishi pamoja naye kwa nguvu za Mungu kuwahusu ninyi[b][c].
