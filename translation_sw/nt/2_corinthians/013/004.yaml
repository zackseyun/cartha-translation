  - severity: medium
    issue: “Katika kushughulika nanyi” hufinyanga εἰς ὑμᾶς kupita kiasi.
    rationale: Muktadha unaweza kuhusisha huduma ya Paulo kwa Wakorintho, lakini εἰς ὑμᾶς yenyewe huacha wazi mwelekeo, uhusiano, au athari kwao. “Kuwahusu ninyi” huhifadhi upana huu.
