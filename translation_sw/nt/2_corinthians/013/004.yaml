base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/004.yaml
  text: For indeed he was crucified in weakness[a], but he lives by the power of God. For indeed we are weak in him[d][c][b], but we will live with him by the power of God toward you.
translation:
  language: sw
  text: Kwa maana alisulubiwa katika udhaifu[a], lakini anaishi kwa nguvu za Mungu. Kwa maana sisi nasi tu dhaifu katika yeye, lakini tutaishi pamoja naye kwa nguvu za Mungu kuwahusu ninyi[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutokana na udhaifu.” Kihusishi cha Kigiriki ἐξ kwa kawaida huweza kuonyesha chanzo au msingi.
    reason: lexical_alternative
  - marker: b
    text: Kigiriki εἰς ὑμᾶς ni usemi mfupi unaoweza kumaanisha “kuwaelekea ninyi,” “kwa ajili yenu,” au “miongoni mwenu.”
    reason: lexical_alternative
  - marker: c
    text: “Tutaishi pamoja naye” huenda ikarejelea maisha yenye nguvu ya Kristo ambayo Paulo atayadhihirisha katika uhusiano wake na Wakorintho; pia inaweza kuwa na mwangwi mpana wa maisha ya ufufuo.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐσταυρώθη
  choice: alisulubiwa
  rationale: Kitenzi cha kutendwa kinahifadhiwa, na ‘kusulubiwa’ ndilo neno la kawaida na sahihi katika muktadha huu.
- source_word: ἐξ ἀσθενείας
  choice: katika udhaifu
  rationale: Ingawa ἐξ kwa kawaida huonyesha chanzo au msingi, hapa Kiswahili cha ‘katika udhaifu’ ni cha asili zaidi na kinadumisha hali ya unyonge iliyohusishwa na kusulubiwa.
- source_word: ζῇ
  choice: anaishi
  rationale: Kinahifadhi hali ya sasa na maana endelevu ya ζάω.
- source_word: ἐκ δυνάμεως θεοῦ
  choice: kwa nguvu za Mungu
  rationale: ‘Kwa’ huonyesha msingi au njia ya maisha hayo kwa Kiswahili cha kawaida, huku marudio ya kishazi yakihifadhi utofautishaji na udhaifu.
- source_word: ἀσθενοῦμεν
  choice: sisi ni dhaifu
  rationale: Huhifadhi uhusiano wa kileksia na ἀσθένεια bila kuongeza wazo la kutokuwa na uwezo kabisa.
- source_word: ἐν αὐτῷ
  choice: ndani yake
  rationale: Huhifadhi lugha fupi ya Paulo kuhusu kuwa ndani ya Kristo bila kuifafanua kupita kiasi.
- source_word: ζήσομεν
  choice: tutaishi
  rationale: Huhifadhi wakati ujao wa kitenzi na kuacha wazi iwapo unahusu huduma ya kitume itakayodhihirishwa au mwangwi mpana wa maisha ya ufufuo.
- source_word: σὺν αὐτῷ
  choice: pamoja naye
  rationale: Huonyesha ushirika na Kristo kwa njia ya kawaida na wazi katika Kiswahili.
- source_word: εἰς ὑμᾶς
  choice: katika kushughulika nanyi
  rationale: Hutoa kwa Kiswahili asili maana iliyobanwa ya mwelekeo au uhusiano wa maisha yenye nguvu ya Mungu kwa Wakorintho, bila kuyaeleza kama faida yao pekee.
theological_decisions:
- issue: Maana ya udhaifu wa Kristo katika kusulubiwa
  choice: Kauli ‘katika udhaifu’ imehifadhiwa kama fumbo la Paulo linalotofautisha unyonge wa kusulubiwa na nguvu za Mungu.
  alternative: Kauli ingeweza kutafsiriwa ‘kutokana na udhaifu,’ ikisisitiza zaidi chanzo au msingi.
  rationale: Tafsiri haifafanui udhaifu huu kuwa kukosa uungu, kutenda dhambi, au upungufu wa kimaadili; inaacha utofautishaji wa andiko usimame.
- issue: Rejeo la ‘tutaishi pamoja naye’
  choice: Kauli imeachwa iwe pana, huku muktadha wa kushughulika na Wakorintho ukionyeshwa katika mwisho wa mstari.
  alternative: Inaweza kueleweka kuwa inahusu ufufuo wa mwisho pekee, au huduma ya kitume yenye nguvu katika wakati wa karibu pekee.
  rationale: Wakati ujao na lugha ya kuwa pamoja na Kristo vinaweza kugusa matumizi ya nguvu katika huduma na pia mada pana ya maisha ya ufufuo; tafsiri haisuluhishi mvutano huo kimabavu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa msomaji wa kawaida. ‘Viv以 hivyo’ linaonyesha ulinganifu wa καὶ γὰρ ya pili bila kurudia kwa namna nzito. ‘Nguvu za Mungu’ ni matumizi ya kawaida ya Kiswahili kwa δύναμις θεοῦ.
