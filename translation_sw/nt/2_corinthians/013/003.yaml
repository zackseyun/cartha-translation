  yaml_path: translation/nt/2_corinthians/013/003.yaml
  text: since you are seeking proof that Messiah is speaking in me—he is not weak toward you[a], but is powerful in you[b],
translation:
  language: sw
  text: Kwa kuwa mnatafuta uthibitisho kwamba Masihi anazungumza ndani yangu[a]—yeye si dhaifu kwenu, bali ana nguvu ndani yenu[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Masihi anazungumza kupitia kwangu.” Kigiriki kwa karibu zaidi kinasema “Masihi anayezungumza ndani yangu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “ana nguvu miongoni mwenu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ
  choice: Kwa kuwa
  rationale: Kifungu hiki kinaonyesha sababu inayohusiana na onyo la Paulo katika muktadha; “kwa kuwa” ni ya kawaida na huhifadhi maana ya kisababishi.
- source_word: δοκιμήν
  choice: uthibitisho
  rationale: Hapa neno linamaanisha ushahidi unaothibitisha dai, si tendo la kupima tu.
- source_word: ζητεῖτε
  choice: mnatafuta
  rationale: Wakati wa sasa unaonyesha kwamba Wakorintho wanaendelea kudai uthibitisho huo.
- source_word: τοῦ ἐν ἐμοὶ λαλοῦντος Χριστοῦ
  choice: kwamba Masihi anazungumza ndani yangu
  rationale: Muundo wa Kigiriki unaelezwa kwa kawaida kwa kishazi cha maudhui. “Ndani yangu” hudumisha ἐν ἐμοί bila kuamua kimya kimya kwamba maana yake lazima iwe “kupitia kwangu.”
- source_word: Χριστοῦ
  choice: Masihi
  rationale: Χριστός inatumika hapa kama cheo cha yule anayezungumza, hivyo “Masihi” huhifadhi maana ya cheo hicho.
- source_word: εἰς ὑμᾶς
  choice: kwenu
  rationale: Huwasilisha uhusiano na mwelekeo wa nguvu za Masihi kwa wasomaji bila kuongeza ufafanuzi usiomo katika maandishi.
- source_word: οὐκ ἀσθενεῖ
  choice: si dhaifu
  rationale: Tafsiri hii huhifadhi lugha ya udhaifu na tofauti yake ya moja kwa moja na nguvu katika sehemu ya pili.
- source_word: ἀλλὰ δυνατεῖ
  choice: bali ana nguvu
  rationale: Hutoa tofauti ya wazi na “si dhaifu” na kueleza kitenzi adimu δυνατέω kwa Kiswahili cha kawaida.
- source_word: ἐν ὑμῖν
  choice: ndani yenu
  rationale: Ni ulinganifu wa moja kwa moja wa kirai cha Kigiriki na hudumisha uwezekano wa utendaji wa Masihi ndani ya waamini; maana ya “miongoni mwenu” imehifadhiwa katika tanbihi.
theological_decisions:
- issue: Tafsiri ya Χριστοῦ
  choice: Masihi
  alternative: Kristo
  rationale: Katika kishazi hiki neno linaweza kusikika kama cheo, hivyo “Masihi” huhifadhi maana yake wazi bila kulifanya jina tu.
- issue: Maana ya ἐν ἐμοί
  choice: anazungumza ndani yangu
  alternative: anazungumza kupitia kwangu
  rationale: Tafsiri kuu inafuata kihusishi cha Kigiriki kwa karibu na kudumisha mvutano kati ya kuwapo kwa Masihi ndani ya Paulo na Masihi kutumia Paulo kama msemaji wake.
- issue: Maana ya ἐν ὑμῖν
  choice: ana nguvu ndani yenu
  alternative: ana nguvu miongoni mwenu
  rationale: “Ndani yenu” hudumisha muundo wa Kigiriki na uwezekano wa utendaji wa ndani, huku tanbihi ikihifadhi maana ya kijumuiya inayowezekana kwa wingi huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Anazungumza” limechaguliwa badala ya “ananena” ili kuepuka lugha ya kizamani, huku “Masihi,” “uthibitisho,” “dhaifu,” na “nguvu” vikidumisha uzito na tofauti za maandishi ya Kigiriki.
