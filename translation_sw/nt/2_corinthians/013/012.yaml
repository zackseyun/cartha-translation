  yaml_path: translation/nt/2_corinthians/013/012.yaml
  text: Greet one another with a holy kiss[b][a]. All the saints greet you.
translation:
  language: sw
  text: Salimianeni kwa busu takatifu.[a] Watakatifu wote wanawasalimu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa busu lililowekwa wakfu.” Hili lilikuwa busu la salamu lililotambulika kitamaduni na lililoonyesha utakatifu na ushirika wa Kikristo.
    reason: lexical_alternative
  - marker: b
    text: “Watakatifu” hapa ni waamini, yaani watu watakatifu wa Mungu; si tabaka maalumu tu la Wakristo waliotangazwa rasmi kuwa watakatifu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Salimianeni
  rationale: Kitenzi cha amri kwa wingi pamoja na kiwakilishi cha kutendeana kinawasilishwa kwa kawaida na kwa ufupi katika Kiswahili kama “salimianeni.”
- source_word: ἀλλήλους
  choice: -aneni (katika “Salimianeni”)
  rationale: Maana ya kutendeana ya ἀλλήλους imejengwa ndani ya umbo la kitenzi cha Kiswahili, hivyo hakuna haja ya kuongeza “ninyi kwa ninyi.”
- source_word: ἐν ἁγίῳ φιλήματι
  choice: kwa busu takatifu
  rationale: “Kwa” huwasilisha ἐν kwa Kiswahili cha kawaida katika namna ya kusalimiana; “busu” ni maana ya moja kwa moja ya φίλημα, na “takatifu” huhifadhi sifa ya ἁγίῳ.
- source_word: ἀσπάζονται
  choice: wanawasalimu
  rationale: Katika hitimisho la barua, umbo hili lina maana ya kuwatumia walengwa salamu; “wanawasalimu” ni la kawaida na huhifadhi tendo la sasa.
- source_word: ὑμᾶς
  choice: -wa- (katika “wanawasalimu”)
  rationale: Kiwakilishi cha yambwa cha wingi kimejengwa ndani ya kitenzi cha Kiswahili.
- source_word: οἱ ἅγιοι πάντες
  choice: Watakatifu wote
  rationale: “Watakatifu” huhifadhi istilahi ya Paulo kwa waamini kama watu waliowekwa wakfu kwa Mungu, na “wote” huhifadhi πάντες.
theological_decisions:
- issue: Maana ya οἱ ἅγιοι katika salamu ya kijumuiya ya Paulo
  choice: Watakatifu
  alternative: Watu wote watakatifu wa Mungu; waamini wote
  rationale: Katika matumizi ya Paulo, neno hili hutaja waamini kwa ujumla kama watu wa Mungu waliowekwa wakfu, si kundi maalumu tu la watu waliotangazwa baadaye kuwa watakatifu. Tafsiri hii huhifadhi istilahi kuu huku tanbihi ikizuia maana hiyo finyu.
- issue: Asili ya “busu takatifu”
  choice: kwa busu takatifu
  alternative: kwa busu la kiroho; kwa salamu takatifu
  rationale: Maandishi yanataja busu halisi lililotambulika kitamaduni kama salamu ya ushirika mtakatifu. Kulibadili kuwa salamu isiyotaja busu kungeondoa picha halisi na mvutano wa kitamaduni wa chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo mfupi, wa heshima na wa sasa. “Salimianeni” ni la asili kuliko “salimuni ninyi kwa ninyi,” huku “busu takatifu” likihifadhi picha ya chanzo. Alama za tanbihi zimewekwa mara moja katika maandishi na kwa mpangilio wa a, b.
