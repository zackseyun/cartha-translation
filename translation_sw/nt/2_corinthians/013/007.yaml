source:
  edition: SBLGNT
  text: ⸀εὐχόμεθα δὲ πρὸς τὸν θεὸν μὴ ποιῆσαι ὑμᾶς κακὸν μηδέν, οὐχ ἵνα ἡμεῖς δόκιμοι φανῶμεν, ἀλλ’ ἵνα ὑμεῖς τὸ καλὸν ποιῆτε, ἡμεῖς δὲ ὡς ἀδόκιμοι ὦμεν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/007.yaml
  text: We pray to God that you may do nothing wrong—not so that we may appear approved[a], but so that you may do what is right[c][b], even if we may seem disqualified.
translation:
  language: sw
  text: Tunamwomba Mungu kwamba msifanye jambo lolote baya[a]—si ili sisi tuonekane kuwa tumethibitishwa kuwa tunafaa[b], bali ili ninyi mfanye lililo jema, hata kama sisi tuonekane kana kwamba hatujathibitishwa kuwa tunafaa.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uovu wowote.”
    reason: lexical_alternative
  - marker: b
    text: Au, “tumekubalika” au “tumethibitishwa kuwa wa kweli.” Kigiriki humaanisha aliyepimwa na kuthibitishwa kuwa anafaa.
    reason: lexical_alternative
  - marker: c
    text: Au, “hata kama sisi tuwe kama watu ambao hawajakubalika” au “tunaonekana kuwa tumeshindwa kipimo.” Kigiriki kinatofautisha maneno yanayohusiana yenye maana ya “kuthibitishwa kuwa unafaa” na “kutothibitishwa kuwa unafaa.”
    reason: alternative_reading
lexical_decisions:
- source_word: εὐχόμεθα
  choice: tunamwomba
  rationale: Kitenzi hiki hapa kinamaanisha kusali au kuomba kwa Mungu. “Tunamwomba” ni usemi wa kawaida wa Kiswahili na unaendana moja kwa moja na kirai kinachofuata, “Mungu.”
- source_word: πρὸς τὸν θεὸν
  choice: Mungu
  rationale: Pamoja na εὐχόμεθα, πρός inaonyesha anayeelekezewa ombi. Katika Kiswahili, kiambishi cha mtendewa katika “tunamwomba” tayari kinaonyesha maana ya “kwa Mungu,” hivyo “tunamwomba Mungu” ni ya asili zaidi.
- source_word: μὴ ποιῆσαι ὑμᾶς κακὸν μηδέν
  choice: kwamba msifanye jambo lolote baya
  rationale: Muundo wa kitenzi-jina unaeleza maudhui ya ombi. “Jambo lolote baya” huhifadhi msisitizo wa κακὸν μηδέν bila kufanya sentensi iwe nzito.
- source_word: οὐχ ἵνα
  choice: si ili
  rationale: Hutambulisha kusudi ambalo Paulo analikana. “Si ili” huhifadhi maana hiyo ya kusudi kwa Kiswahili cha kawaida.
- source_word: δόκιμοι
  choice: tumethibitishwa kuwa tunafaa
  rationale: δόκιμος humaanisha aliyepimwa na kuthibitishwa kuwa anafaa au amekubalika. Tafsiri hii huhifadhi wazo la kupimwa lililo muhimu katika muktadha na utofauti wake na ἀδόκιμοι.
- source_word: φανῶμεν
  choice: tuonekane
  rationale: Hapa kitenzi kina maana ya kuonekana au kudhihirika kuwa na sifa fulani. “Tuonekane” huhifadhi jambo la jinsi Paulo na wenzake wanavyoweza kutambuliwa.
- source_word: τὸ καλὸν ποιῆτε
  choice: mfanye lililo jema
  rationale: Katika muktadha wa maadili, καλός ni jambo jema au linalofaa. “Mfanye lililo jema” ni wazi, la asili, na huhifadhi nguvu ya kimaadili.
- source_word: ὡς ἀδόκιμοι ὦμεν
  choice: hata kama sisi tutaonekana kuwa hatufai
  rationale: 'ἀδόκιμος ni kinyume cha δόκιμος: kutothibitishwa kuwa unafaa au kushindwa kipimo. Muktadha wa kuonekana kuwa wamekubaliwa unaruhusu maana ya kuhesabiwa au kuonekana kuwa hawafai; tanbihi huhifadhi uwezekano wa tafsiri iliyo karibu zaidi na muundo wa Kigiriki.'
theological_decisions:
- issue: Maana ya Paulo kujieleza kwa maneno ὡς ἀδόκιμοι
  choice: Paulo yuko tayari yeye na wenzake waonekane au wahesabiwe kuwa hawafai, mradi Wakorintho wafanye lililo jema.
  alternative: Paulo na wenzake wawe kama watu ambao hawajathibitishwa kuwa wanafaa, au wawe wameshindwa katika kipimo cha utume.
  rationale: Muktadha unatofautisha δόκιμοι na ἀδόκιμοι kwa habari ya kupimwa na kuthibitishwa. Tafsiri haifanyi ἀδόκιμοι kuwa tamko kuhusu hukumu ya mwisho, wala haiondoi kabisa uwezekano wa maana pana ya kushindwa kipimo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa msomaji wa kawaida. Muundo wa kusudi “si ili … bali ili …” na utofauti wa maneno δόκιμοι/ἀδόκιμοι umehifadhiwa. Hakuna “sasa” iliyoongezwa mwanzoni kwa sababu chanzo hakina neno la wakati lenye maana hiyo.
