  to: Tunamwomba Mungu kwamba msifanye jambo lolote baya[a]—si ili sisi tuonekane kuwa tumethibitishwa kuwa tunafaa[b], bali ili ninyi mfanye lililo jema, hata kama sisi tuonekane kana kwamba hatujathibitishwa kuwa tunafaa.[c]
  rationale: The revision retains the draft’s clear structure and terminology while making the final concessive clause more faithful to the Greek present subjunctive and to ὡς. It also makes the δόκιμοι/ἀδόκιμοι wordplay visible in both the main text and notes, without construing ἀδόκιμοι as a statement about final condemnation.
