reference: 2 Corinthians 13:2
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: προείρηκα καὶ προλέγω ὡς παρὼν τὸ δεύτερον καὶ ἀπὼν ⸀νῦν, τοῖς προημαρτηκόσιν καὶ τοῖς λοιποῖς πᾶσιν, ὅτι ἐὰν ἔλθω εἰς τὸ πάλιν οὐ φείσομαι,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/002.yaml
  text: I have said before[a], and I say beforehand now while absent, as when present the second time, to those who sinned previously and to all the rest, that if I come again, I will not spare them.
translation:
  language: sw
  text: Nimekwisha kusema, nami nasema mapema sasa, nikiwa mbali, kama nilivyosema nilipokuwapo mara ya pili, kwa wale waliotenda dhambi hapo awali na kwa wengine wote, kwamba nikija tena[a], sitawahurumia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa ufafanuzi zaidi, “nikija mara ya tatu.” Kigiriki kinasema kihalisi, “nikija tena,” lakini muktadha wa ziara za Paulo unaashiria ziara nyingine baada ya ile ya pili.
    reason: alternative_reading
lexical_decisions:
- source_word: προείρηκα
  choice: Nimekwisha kusema
  rationale: Kauli ya wakati timilifu inaonyesha kwamba Paulo alisema jambo hilo hapo awali na kwamba linaendelea kuwa na uzito sasa. Tafsiri hii haiongezi waziwazi maana ya ‘kuonya,’ ingawa muktadha unaonyesha onyo.
- source_word: προλέγω
  choice: nawaambia mapema
  rationale: Kitenzi hiki kimsingi ni kusema jambo kabla halijatokea. ‘Nawaambia mapema’ ni Kiswahili cha kawaida kinachohifadhi maana hiyo na pia kuwaunganisha kwa kawaida wale wanaoelekezewa maneno haya.
- source_word: ὡς παρὼν τὸ δεύτερον καὶ ἀπὼν νῦν
  choice: sasa nikiwa mbali—kama nilivyofanya nilipokuwapo mara ya pili
  rationale: Maneno haya yaliyofupishwa yanalinganisha hali ya Paulo ya sasa akiwa mbali na aliyofanya alipokuwapo kwa mara ya pili. ‘Nilivyofanya’ huwasilisha kwa Kiswahili tendo linaloeleweka kutokana na muktadha bila kulifanya kuwa fundisho jipya.
- source_word: τοῖς προημαρτηκόσιν
  choice: wale waliotenda dhambi hapo awali
  rationale: Kirai hiki kinawatambulisha watu ambao dhambi yao ya awali tayari inazungumziwa, bila kuamua ikiwa walikuwa wametubu au la.
- source_word: τοῖς λοιποῖς πᾶσιν
  choice: wengine wote
  rationale: Huhifadhi upana wa πᾶσιν na utofauti kati ya waliotenda dhambi hapo awali na watu wengine wote.
- source_word: ἐὰν ἔλθω εἰς τὸ πάλιν
  choice: nikija tena
  rationale: Hii ndiyo maana ya karibu na ya kawaida ya nahau ya Kigiriki. Maana ya ‘mara ya tatu,’ inayotokana na muktadha wa ziara, imewekwa katika tanbihi badala ya kuingizwa katika matini.
- source_word: οὐ φείσομαι
  choice: sitawaachilia
  rationale: Katika muktadha huu φείδομαι ni kujizuia kutumia ukali au kumwacha mtu bila hatua. ‘Sitawaachilia’ ni ya kawaida na inaonyesha kwamba Paulo hatajiepusha na hatua kali, bila kutaja aina fulani ya nidhamu.
theological_decisions:
- issue: Wigo wa ukali ambao Paulo anautangaza
  choice: Onyo linaelekezwa kwa wale waliotenda dhambi hapo awali na kwa wengine wote; akirudi, Paulo hatawaachilia wale ambao onyo hilo litawahusu.
  alternative: Onyo linaweza kueleweka kuwa linawahusu waliotenda dhambi hapo awali pekee, au kuwa tangazo la jumla la ukali wa kitume bila kutaja hatua maalumu.
  rationale: Muundo wa sentensi unataja makundi yote mawili kabla ya kauli ‘sitawaachilia.’ Tafsiri inadumisha upana huo lakini haiingizi utaratibu maalumu wa nidhamu ya kanisa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mistari mirefu imepangwa kwa vistari ili kufanya kirai cha kulinganisha kisomeke kwa urahisi. ‘Nawaambia mapema’ na ‘sitawaachilia’ ni maneno yanayoeleweka kwa wasomaji wa kawaida bila kupoteza uzito wa onyo.
