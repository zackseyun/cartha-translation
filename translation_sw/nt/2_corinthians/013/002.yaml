  source_fidelity: 'Rasimu inawakilisha kwa jumla mpangilio na maana ya Kigiriki: kauli ya awali yenye athari ya sasa, onyo la mapema, makundi mawili yanayoelekezewa, na tishio la kutowaacha bila ukali. Hata hivyo, “kama nilivyofanya” halisemi wazi tendo linalodokezwa, yaani kusema/kuonya, na “sitawaachilia” kwa kawaida linaweza kusikika kama kutowasamehe badala ya kutowapunguzia ukali (οὐ φείσομαι).'
