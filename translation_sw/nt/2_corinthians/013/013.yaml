  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἡ χάρις τοῦ κυρίου Ἰησοῦ Χριστοῦ καὶ ἡ ἀγάπη τοῦ θεοῦ καὶ ἡ κοινωνία τοῦ ἁγίου πνεύματος μετὰ πάντων ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/013.yaml
  text: The grace of the Lord Jesus Christ[a], and the love of God, and the fellowship of the Holy Spirit[b], be with all of you.
translation:
  language: sw
  text: Neema ya Bwana Yesu Masihi[a], na upendo wa Mungu, na ushirika wa Roho Mtakatifu[b], viwe nanyi nyote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kama ilivyozoeleka, “Yesu Kristo.”
    reason: alternative_reading
  - marker: b
    text: Au “ushirika pamoja na Roho Mtakatifu” au “kushiriki katika Roho Mtakatifu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: neema
  rationale: “Neema” ni neno la kawaida na lenye uzito wa kitheolojia katika baraka za Paulo; linadumisha maana ya fadhili inayotolewa bila kuifanya kuwa “kibali” tu.
- source_word: κυρίου
  choice: Bwana
  rationale: “Bwana” ni tafsiri ya kawaida ya cheo κύριος na inafaa kwa matumizi yake kama cheo cha Yesu hapa.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesu Masihi
  rationale: Χριστοῦ linatumika kama cheo, si kama jina la ukoo; “Masihi” linaonyesha maana ya cheo hicho, huku “Kristo” ikihifadhiwa katika tanbihi kama namna iliyozoeleka.
- source_word: ἀγάπη
  choice: upendo
  rationale: “Upendo” ni neno la kawaida na la asili katika Kiswahili kwa ἀγάπη katika muktadha huu.
- source_word: θεοῦ
  choice: wa Mungu
  rationale: Muundo wa kimilikishi unadumisha uhusiano mpana wa genitivi bila kuufafanua kupita kiasi kuwa “upendo wa Mungu kwenu.”
- source_word: κοινωνία
  choice: ushirika
  rationale: “Ushirika” unadumisha maana ya uhusiano na kushiriki pamoja bila kulazimisha iwapo Roho ndiye chanzo cha ushirika au ndiye anayeshirikiwa.
- source_word: ἁγίου πνεύματος
  choice: Roho Mtakatifu
  rationale: Hii ndiyo tafsiri ya kawaida, ya sasa, na yenye heshima ya jina hili katika Kiswahili.
- source_word: μετὰ πάντων ὑμῶν
  choice: viwe nanyi nyote
  rationale: “Nanyi” linaonyesha kuwapo pamoja, na “nyote” linahifadhi msisitizo wa πάντων. Kitenzi “viwe” kimeongezwa kwa kawaida ya Kiswahili ili kueleza ombi la baraka lililoachwa bila kitenzi katika Kigiriki.
theological_decisions:
- issue: Tafsiri ya Χριστοῦ kama cheo cha Yesu
  choice: Masihi
  alternative: Kristo
  rationale: “Masihi” linatafsiri maana ya cheo Χριστός badala ya kukifanya lionekane kama jina la pili; “Kristo,” lililozoeleka katika mapokeo, limetolewa kama mbadala.
- issue: Maana ya κοινωνία τοῦ ἁγίου πνεύματος
  choice: ushirika wa Roho Mtakatifu
  alternative: ushirika pamoja na Roho Mtakatifu; kushiriki katika Roho Mtakatifu
  rationale: Genitivi ya Kigiriki inaweza kueleza ushirika unaohusiana na Roho, ushirika pamoja naye, au kushiriki katika Roho. Muundo mkuu unabaki mpana, na tanbihi inahifadhi uwezekano huo bila kuamua zaidi ya maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inadumisha mpangilio wa vipengele vitatu wa Kigiriki. Alama zote za tanbihi zimewekwa katika maandishi makuu.
