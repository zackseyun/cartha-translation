  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἑαυτοὺς πειράζετε εἰ ἐστὲ ἐν τῇ πίστει, ἑαυτοὺς δοκιμάζετε· ἢ οὐκ ἐπιγινώσκετε ἑαυτοὺς ὅτι ⸂Ἰησοῦς Χριστὸς⸃ ἐν ⸀ὑμῖν; εἰ μήτι ἀδόκιμοί ἐστε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/005.yaml
  text: Test yourselves to see whether you are in the faith[a]; examine yourselves[c][b]. Or do you not recognize that Jesus the Messiah is in you?—unless indeed you are disqualified.
translation:
  language: sw
  text: Jijaribuni kuona kama mko katika imani[a]; jichunguzeni. Au hamjitambui kwamba Yesu Masihi yuko ndani yenu[b]?—isipokuwa labda mmeshindwa katika jaribio.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Katika imani” inaweza kumaanisha kudumu ndani ya imani ya Kikristo au kuwa na imani ya kweli.
    reason: lexical_alternative
  - marker: b
    text: Au, “miongoni mwenu.”
    reason: alternative_reading
lexical_decisions:
- source_word: πειράζετε
  choice: Jijaribuni
  rationale: Katika muktadha huu kitenzi kinamaanisha kujipima ili kubaini uhalisi, si kushawishiwa kutenda dhambi.
- source_word: ἐν τῇ πίστει
  choice: katika imani
  rationale: Huhifadhi muundo wenye kibainishi na pia mvutano kati ya kuwa ndani ya imani ya Kikristo na kuwa na imani ya kweli.
- source_word: δοκιμάζετε
  choice: jichunguzeni
  rationale: Hutofautisha kitenzi hiki na πειράζετε huku kikitoa maana ya kuchunguza kwa makini ili kuthibitisha uhalisi.
- source_word: ἐπιγινώσκετε ἑαυτούς
  choice: hamjitambui
  rationale: Ni Kiswahili cha asili kinachohifadhi wazo la kujitambua au kutambua jambo kuhusu nafsi zenu katika swali la balagha.
- source_word: Ἰησοῦς Χριστός
  choice: Yesu Masihi
  rationale: Χριστός hapa ina nguvu ya cheo cha Kimasihi; ‘Masihi’ huhifadhi maana hiyo badala ya kuitumia tu kama jina.
- source_word: ἐν ὑμῖν
  choice: yuko ndani yenu
  rationale: Muktadha wa kujichunguza unapendelea uwepo wa Kristo ndani ya waamini, huku uwezekano wa maana ya kijumuiya ‘miongoni mwenu’ ukihifadhiwa katika tanbihi.
- source_word: εἰ μήτι
  choice: isipokuwa, kwa kweli
  rationale: Hutoa hali ya ubaguzi pamoja na msisitizo mdogo wa balagha ulio katika msemo wa Kigiriki.
- source_word: ἀδόκιμοί
  choice: mmeshindwa katika jaribio
  rationale: Hufanya wazi uhusiano wake na vitenzi vya kujaribu na kuchunguza, bila kuingiza dhana nzito ya baadaye ya ‘waliokataliwa’.
theological_decisions:
- issue: Maana ya ἐν τῇ πίστει
  choice: katika imani
  alternative: kuwa na imani ya kweli binafsi
  rationale: Tafsiri haibani maana kuwa ama kudumu ndani ya imani ya Kikristo ama kuwa na imani halisi; tanbihi inaeleza pande zote.
- issue: Uwasilishaji wa Χριστός
  choice: Masihi
  alternative: Kristo
  rationale: Katika kauli hii neno linaweza kusikika kama cheo cha kukiri utambulisho wa Yesu; ‘Masihi’ linaonyesha maana ya cheo hicho.
- issue: Maana ya ἐν ὑμῖν
  choice: ndani yenu
  alternative: miongoni mwenu
  rationale: Kujichunguza kunapendelea uwepo wa Yesu ndani ya watu hao, lakini umbo la wingi na kihusishi vinaweza pia kueleza uwepo wake katikati ya jumuiya.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Amri za wingi ‘jijaribuni’ na ‘jichunguzeni’ zinaendeleza msisitizo wa kujipima; sentensi ya mwisho huhifadhi ukali na hali ya balagha ya Kigiriki.
