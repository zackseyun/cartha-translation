translation:
  language: sw
  text: Kwa maana hatuwezi kufanya lolote dhidi ya kweli, bali kwa upande wa kweli.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa maana hatuwezi kufanya lolote dhidi ya kweli, bali kwa ajili ya kweli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ γὰρ
  choice: Kwa maana ... hatu-
  rationale: γάρ inatoa sababu ya maelezo yaliyotangulia; “Kwa maana” ni kiunganishi cha kawaida na chenye hadhi. οὐ imewasilishwa kwa ukanushi wa kitenzi.
- source_word: δυνάμεθά
  choice: hatuwezi
  rationale: δύναμαι huonyesha uwezo; “hatuwezi” ni usemi wa asili wa Kiswahili unaohifadhi maana ya kutokuwa na uwezo.
- source_word: τι
  choice: lolote
  rationale: Katika kishazi kilichokanushwa, τι ina maana pana ya “lolote.”
- source_word: κατὰ τῆς ἀληθείας
  choice: dhidi ya kweli
  rationale: κατά pamoja na jenitivi ina maana ya kupinga; “dhidi ya kweli” huhifadhi ulinganifu na kishazi kinachofuata bila kuibana “kweli” kuwa kanuni fulani tu.
- source_word: ἀλλὰ
  choice: bali
  rationale: ἀλλά huleta utofautishaji mkali; “bali” linafaa katika muundo huu mfupi wa kupambanisha mawazo.
- source_word: ὑπὲρ τῆς ἀληθείας
  choice: kwa ajili ya kweli
  rationale: ὑπέρ hapa huonyesha kutenda upande wa au kwa manufaa ya kweli. “Kwa ajili ya kweli” huhifadhi kwa ufupi ulinganifu na “dhidi ya kweli.”
theological_decisions:
- issue: Maana ya “kweli” katika kauli hii ya kupambanisha
  choice: “kweli” imeachwa ikiwa na upana wake
  alternative: “kweli ya Injili” au “jambo lililo la kweli”
  rationale: Muktadha unahusisha kweli ya Injili na uhalisi wa Mungu, lakini maneno ya Paulo hayaiwekei mipaka kuwa kauli moja maalumu ya mafundisho.
- issue: Nguvu ya ὑπέρ katika kishazi cha pili
  choice: kwa ajili ya kweli
  alternative: kuunga mkono kweli
  rationale: Tafsiri kuu huhifadhi muundo mfupi na uwezekano wa maana ya kutenda kwa manufaa ya kweli; tanbihi inaweka wazi maana ya kuunga mkono bila kuongeza “tu,” ambalo halipo wazi katika Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa kupambanisha “dhidi ya ... bali kwa ajili ya ...” umehifadhiwa.
