base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/007.yaml
  text: And our hope for you is firm[a], because we know that just as you share in the sufferings, so also you share in the comfort.
translation:
  language: sw
  text: Na tumaini letu kuhusu ninyi ni thabiti, kwa sababu tunajua kwamba kama vile mnavyoshiriki katika mateso, ndivyo pia mnavyoshiriki katika faraja.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kutiwa moyo” badala ya “faraja” (παράκλησις).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλπίς
  choice: tumaini
  rationale: “Tumaini” ni neno la kawaida na wazi linalohifadhi maana ya kutarajia kwa uhakika bila kuifanya istilahi hiyo kuwa na nguvu kupita kiasi.
- source_word: βεβαία
  choice: thabiti
  rationale: “Thabiti” linaonyesha kuwa tumaini la Paulo ni imara na la kutegemewa, kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: ὑπὲρ ὑμῶν
  choice: kwa ajili yenu
  rationale: Katika muktadha huu kirai hicho kinaelekeza tumaini kwa Wakorintho; “kwa ajili yenu” ni cha asili na pia huhifadhi uwezekano wa maana ya kuwahusu au kuwa kwa manufaa yao.
- source_word: εἰδότες
  choice: kwa sababu tunajua
  rationale: Hali ya kushiriki ya Kigiriki inatoa msingi wa uthabiti wa tumaini; muundo wa kisababu unaweka uhusiano huo wazi katika Kiswahili.
- source_word: ὡς ... οὕτως καί
  choice: kama vile ... ndivyo pia
  rationale: Muundo huu huhifadhi ulinganifu wa vipashio viwili katika Kigiriki na unasikika kwa kawaida katika Kiswahili sanifu.
- source_word: κοινωνοί
  choice: mnavyoshiriki
  rationale: Nomino ya Kigiriki humaanisha kuwa washiriki; kuitafsiri kwa kitenzi ni ya asili katika Kiswahili na hufaa kwa sentensi yote.
- source_word: παθημάτων
  choice: mateso
  rationale: “Mateso” ni tafsiri pana na wazi inayolingana na muktadha wa dhiki na kuteseka katika kifungu hiki.
- source_word: παρακλήσεως
  choice: faraja
  rationale: Katika muktadha wa 2 Wakorintho 1, “faraja” hudumisha dhana inayorudiwa ya kutiwa moyo na kufarijiwa, huku ikibaki ya kawaida kwa wasomaji.
- source_word: '[elliptical second clause]'
  choice: mnavyoshiriki
  rationale: Kigiriki hakirudii wazi wazo la kushiriki katika kipashio cha pili; kulirudia kwa Kiswahili hukamilisha sentensi bila kuongeza maana mpya.
