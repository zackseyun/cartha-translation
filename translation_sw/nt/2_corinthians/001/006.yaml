  text: εἴτε δὲ θλιβόμεθα, ὑπὲρ τῆς ὑμῶν παρακλήσεως καὶ σωτηρίας· ⸂εἴτε παρακαλούμεθα, ὑπὲρ τῆς ὑμῶν παρακλήσεως⸃ τῆς ἐνεργουμένης ἐν ὑπομονῇ τῶν αὐτῶν παθημάτων ὧν καὶ ἡμεῖς πάσχομεν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/006.yaml
  text: But if we are afflicted[a], it is for your comfort and salvation; or if we are comforted, it is for your comfort[b], which is at work in enduring the same sufferings that we also suffer.
translation:
  language: sw
  text: Lakini ikiwa tunapata dhiki, ni kwa ajili ya faraja[b] na wokovu wenu; au ikiwa tunafarijiwa, ni kwa ajili ya faraja yenu[a], ambayo hutenda kazi katika kuyavumilia mateso yale yale tunayoyapata sisi pia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Baadhi ya hati hazina maneno: “au ikiwa tunafarijiwa, ni kwa ajili ya faraja yenu.”'
    reason: textual_variant
  - marker: b
    text: Au “utiaji moyo” badala ya “faraja,” na “tunatiwa moyo” badala ya “tunafarijiwa,” kila neno hilo linapotokea katika mstari huu.
    reason: lexical_alternative
lexical_decisions:
- source_word: θλιβόμεθα
  choice: tunapata dhiki
  rationale: Kitenzi hiki cha hali ya kutendwa na wakati uliopo huonyesha kuendelea kukabili shinikizo au taabu. ‘Tunapata dhiki’ ni Kiswahili cha kawaida na chenye hadhi.
- source_word: παρακλήσεως / παρακαλούμεθα
  choice: faraja / tunafarijiwa
  rationale: Katika muktadha huu neno hili linajumuisha kufariji na kutia moyo. Kurudia mzizi wa ‘faraja’ kunadumisha mshikamano wa msamiati wa kifungu.
- source_word: σωτηρίας
  choice: wokovu
  rationale: ‘Wokovu’ ni tafsiri ya moja kwa moja yenye upana wa maana unaofaa matumizi ya Paulo; ‘ukombozi’ ungeweza kueleweka kwa maana finyu zaidi ya kuondolewa katika shida.
- source_word: τῆς ἐνεργουμένης
  choice: ambayo hutenda kazi
  rationale: Kauli hii inaonyesha kwamba faraja ina nguvu inayofanya kazi, si kwamba ipo tu.
- source_word: ἐν ὑπομονῇ
  choice: katika kuyavumilia
  rationale: Muundo huu wa Kiswahili unaonyesha kuwa utendaji wa faraja huonekana katika kustahimili mateso, huku ukihifadhi uhusiano wa karibu na muundo wa Kigiriki.
- source_word: τῶν αὐτῶν παθημάτων
  choice: mateso yale yale
  rationale: Tafsiri hii ni ya moja kwa moja na inasisitiza kwamba Paulo na Wakorintho wanashiriki mateso yanayofanana.
- source_word: ὑπὲρ
  choice: kwa ajili ya
  rationale: Hapa kihusishi kinaonyesha manufaa yanayowaelekea Wakorintho; ‘kwa ajili ya’ huwasilisha maana hiyo wazi.
- source_word: πάσχομεν
  choice: tunayoyapata
  rationale: Katika Kiswahili, ‘kupata mateso’ ni usemi wa asili unaoepuka urudiaji usio wa kawaida wa ‘kuteseka mateso’.
