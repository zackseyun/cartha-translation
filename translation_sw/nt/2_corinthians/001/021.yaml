  yaml_path: translation/nt/2_corinthians/001/021.yaml
  text: But the one who establishes us with you in Messiah[a], and who anointed us, is God.
translation:
  language: sw
  text: Lakini Mungu ndiye anayetufanya imara pamoja nanyi katika Masihi[a], naye aliyetupaka mafuta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika Kristo.” Neno la Kigiriki Christos ni cheo kinachomaanisha “Masihi.”
    reason: alternative_reading
lexical_decisions:
- source_word: βεβαιῶν
  choice: anayetuthibitisha
  rationale: Kitenzi hiki kina maana ya kufanya imara au thabiti. Umbo la wakati wa sasa ‘anayetuthibitisha’ linahifadhi tendo linaloendelea bila kuongeza ufafanuzi usio katika matini.
- source_word: σὺν ὑμῖν
  choice: sisi pamoja nanyi
  rationale: Maneno haya yanaonyesha kwamba Paulo na wenzake wanashiriki pamoja na Wakorintho; kutaja ‘sisi’ kunafanya uhusiano wa kiwakilishi uwe wazi katika Kiswahili.
- source_word: εἰς Χριστόν
  choice: katika Masihi
  rationale: Ingawa εἰς kwa msingi inaweza kumaanisha ‘kuingia ndani ya/kuelekea,’ hapa inaeleza uhusiano au kuunganishwa na Masihi. ‘Katika Masihi’ ni ya asili katika Kiswahili na huhifadhi maana hiyo.
- source_word: χρίσας
  choice: aliyetutia mafuta
  rationale: Huhifadhi picha ya kupaka mafuta iliyo katika χρίω na uhusiano wake wa kimatamshi na Χριστός, bila kuibana kuwa ibada fulani pekee.
- source_word: θεός
  choice: Mungu ndiye
  rationale: θεός iko mwishoni mwa sentensi ya Kigiriki kwa mkazo. Muundo wa Kiswahili ‘Mungu ndiye’ unaweka wazi kwamba Mungu ndiye mtendaji wa matendo yote mawili.
- source_word: Χριστόν
  choice: Masihi
  rationale: Χριστός ni cheo chenye maana ya Mtiwa-Mafuta; ‘Masihi’ huhifadhi maana yake ya Kiebrania na hadhi yake kama cheo.
theological_decisions:
- issue: Nguvu ya εἰς katika εἰς Χριστόν
  choice: Maana ya uhusiano/kuunganishwa, iliyotafsiriwa ‘katika Masihi’
  alternative: ‘kuelekea Masihi’ au ‘ndani ya Masihi’
  rationale: Tafsiri ya moja kwa moja zaidi inaweza kuonyesha mwendo, lakini katika matumizi haya ya Paulo kirai kinaelekea kueleza uhusiano na Masihi. ‘Katika’ ni cha kawaida bila kufafanua zaidi namna ya uhusiano huo.
- issue: Uhusiano kati ya χρίσας na Χριστόν
  choice: ‘Masihi’ na ‘aliyetutia mafuta’
  alternative: ‘Kristo’ na ‘aliyetuweka wakfu’
  rationale: Chaguo hili linahifadhi kwa kiasi kinachowezekana maana ya kutiwa mafuta katika maneno yote mawili, bila kudai aina maalumu ya kuwekwa wakfu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo umebadilishwa kidogo ili mkazo wa θεός uwe wa asili katika Kiswahili, huku ushirika wa ‘sisi pamoja nanyi’ na matendo mawili ya Mungu ukihifadhiwa.
