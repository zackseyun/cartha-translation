  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀλλὰ αὐτοὶ ἐν ἑαυτοῖς τὸ ἀπόκριμα τοῦ θανάτου ἐσχήκαμεν, ἵνα μὴ πεποιθότες ὦμεν ἐφ’ ἑαυτοῖς ἀλλ’ ἐπὶ τῷ θεῷ τῷ ἐγείροντι τοὺς νεκρούς·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/009.yaml
  text: Indeed[a], we ourselves had the sentence of death within ourselves, so that we would not rely on ourselves but on God, who raises the dead.
translation:
  language: sw
  text: Lakini sisi wenyewe, ndani yetu, tulikuwa na hukumu ya kifo[a], ili tusijitegemee wenyewe, bali tumtegemee Mungu, ambaye huwafufua wafu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uamuzi wa kifo.”
    reason: Mbadala wa kileksia kwa τὸ ἀπόκριμα τοῦ θανάτου; usemi huo unaweza kueleweka kama uamuzi au hukumu iliyokwisha kuamuliwa.
lexical_decisions:
- source_word: ἀλλὰ
  choice: Naam
  rationale: Katika muktadha huu neno hilo linaendeleza kwa msisitizo na wakati huohuo linatofautisha kauli hii na iliyotangulia; “Naam” ni ya asili na yenye hadhi katika Kiswahili.
- source_word: αὐτοὶ ἐν ἑαυτοῖς
  choice: sisi wenyewe ... ndani yetu
  rationale: Huhifadhi msisitizo wa αὐτοὶ na maana ya ndani na ya kibinafsi ya ἐν ἑαυτοῖς bila kurudia maneno kwa namna isiyo ya kawaida.
- source_word: τὸ ἀπόκριμα τοῦ θανάτου
  choice: hukumu ya kifo
  rationale: Katika muktadha huu ἀπόκριμα inaelekea kumaanisha uamuzi au matokeo yaliyokwisha kuamuliwa; “hukumu ya kifo” ni wazi na ya kawaida.
- source_word: ἐσχήκαμεν
  choice: tulikuwa na
  rationale: Huwakilisha hali iliyokuwapo kama matokeo ya yaliyotokea, bila kuongeza wazo lisilotajwa wazi la ‘kupokea’.
- source_word: ἵνα μὴ πεποιθότες ὦμεν ἐφ’ ἑαυτοῖς
  choice: kusudi tusijitegemee wenyewe
  rationale: “Kusudi” huonyesha dhamira ya ἵνα, na “kujitegemea” huwasilisha kwa Kiswahili cha kawaida hali ya kuweka tumaini au uhakika ndani ya nafsi.
- source_word: ἀλλ’ ἐπὶ τῷ θεῷ
  choice: bali tumtegemee Mungu
  rationale: Huhifadhi utofautishaji mkali kati ya kujitegemea na kumtegemea Mungu.
- source_word: τῷ ἐγείροντι τοὺς νεκρούς
  choice: ambaye huwafufua wafu
  rationale: “Huwafufua” huonyesha tabia na uwezo wa Mungu unaoelezwa na umbo la sasa la kitenzi, huku “wafu” ikihifadhi usemi mpana wa asili.
theological_decisions:
- issue: Iwapo τοὺς νεκρούς itafsiriwe kama ‘wafu’ au ‘watu waliokufa’
  choice: wafu
  alternative: watu waliokufa
  rationale: “Wafu” ni sahihi, ya asili, na huhifadhi uzito wa usemi kuhusu uwezo wa Mungu wa kufufua bila kuongeza ufafanuzi.
- issue: Iwapo ἀπόκριμα τοῦ θανάτου ielezwe kama hukumu rasmi au hisia ya ndani ya kifo kisichoepukika
  choice: hukumu ya kifo
  alternative: uamuzi wa kifo
  rationale: “Hukumu ya kifo” huhifadhi taswira ya uamuzi uliokwishatolewa huku muktadha wa ‘ndani yetu’ ukiacha wazi kuwa Paulo anaeleza uhakika wao wa ndani, si lazima hukumu ya mahakama ya kibinadamu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umefanywa kuwa wa asili kwa Kiswahili huku msisitizo wa ‘sisi wenyewe,’ kusudi la tukio hilo, na utofautishaji kati ya kujitegemea na kumtegemea Mungu vikihifadhiwa.
