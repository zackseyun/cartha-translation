  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imetumia “hatuwaandikii” na “mnayoyasoma” kwa mtiririko wa kawaida, huku tanbihi ikihifadhi uwezekano wa maana ya muda katika ἕως τέλους.
