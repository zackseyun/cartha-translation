  text: οὐ γὰρ ἄλλα γράφομεν ὑμῖν ἀλλ’ ἢ ἃ ἀναγινώσκετε ἢ καὶ ἐπιγινώσκετε, ἐλπίζω δὲ ⸀ὅτι ἕως τέλους ἐπιγνώσεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/013.yaml
  text: For we are not writing anything else to you except what you read and indeed understand[a], and I hope that you will understand fully to the end,
translation:
  language: sw
  text: Kwa maana hatuwaandikii mambo mengine isipokuwa yale mnayoyasoma au hata kuyaelewa. Nami natumaini kwamba mtayaelewa kikamilifu[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa maana ya karibu zaidi, “mtayaelewa hadi mwisho.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλα
  choice: mambo mengine
  rationale: Nomino ya wingi isiyo na jinsia baada ya kitenzi cha kuandika inaelezwa kwa Kiswahili cha kawaida kama “mambo mengine,” ikikanusha kwamba ujumbe ulioandikwa una maana nyingine iliyofichwa.
- source_word: ἀναγινώσκετε
  choice: mnayoyasoma
  rationale: Wakati uliopo unaonyesha tendo la kusoma barua; umbo hili linaunganisha kwa kawaida “yale” na yaliyomo katika maandishi.
- source_word: ἐπιγινώσκετε
  choice: kuyaelewa
  rationale: Katika muktadha huu kitenzi kinaonyesha kufahamu maana ya yale yanayosomwa. “Kuyaelewa” ni wazi na cha kawaida kuliko “kuyatambua,” bila kulazimisha maana ya maarifa kamili.
- source_word: ἐπιγνώσεσθε
  choice: mtayaelewa
  rationale: Wakati ujao unaendeleza wazo la kuelewa lililotajwa awali; kiwakilishi “-ya-” kinarejelea mambo yaliyoandikwa.
- source_word: ἕως τέλους
  choice: kikamilifu
  rationale: Kirai kinaweza kueleza ukamilifu wa kuelewa katika muktadha huu. Maana yake ya moja kwa moja ya muda, “mpaka mwisho,” imehifadhiwa katika tanbihi ili kutofuta utata huo.
- source_word: οὐ γὰρ ... ἀλλ’ ἢ
  choice: Kwa maana ... si ... isipokuwa
  rationale: Muundo huu wa Kiswahili unahifadhi ukanushaji na upekee wa kauli ya Kigiriki kwa njia ya kawaida na iliyo wazi.
- source_word: ἢ καὶ
  choice: na kwa kweli
  rationale: Katika mfuatano huu chembe hizi zinaweza kusisitiza hatua ya kuelewa pamoja na kusoma. “Na kwa kweli” huwasilisha msisitizo huo kwa Kiswahili cha asili, ingawa muundo wa Kigiriki unaweza pia kusikika kama “au hata.”
