  rationale: The revision replaces the additive and grammatically uneven wording with “au hata,” preserving the repeated alternative particle and possible intensification in the Greek. It retains the draft’s appropriate rendering of full understanding and preserves the more literal temporal sense of ἕως τέλους in the footnote.
  reviewer_model: gpt-5.6-terra
