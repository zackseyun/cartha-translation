id: 2CO.1.17
reference: 2 Corinthians 1:17
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: τοῦτο οὖν ⸀βουλόμενος μήτι ἄρα τῇ ἐλαφρίᾳ ἐχρησάμην; ἢ ἃ βουλεύομαι κατὰ σάρκα βουλεύομαι, ἵνα ᾖ παρ’ ἐμοὶ τὸ Ναὶ ναὶ καὶ τὸ Οὒ οὔ;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/017.yaml
  text: So when I intended this[a], was I acting lightly? Or do I plan what I plan according to the flesh, so that with me there should be both “Yes, yes” and “No[d][c][b], no”?
translation:
  language: sw
  text: Basi, nilipokusudia jambo hili, je, nilitenda kwa kutokuwa thabiti[a]? Au, je, mambo ninayopanga, je, nayapanga kwa kufuata mwili[b], ili kwangu kuwe na “Ndiyo, ndiyo” na “Hapana, hapana”[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa kuyumba-yumba” au “kwa kigeugeu.”
    reason: lexical_alternative
  - marker: b
    text: “Kwa kufuata mwili” hapa yaweza kumaanisha kufuata viwango vya kibinadamu tu au vya kidunia.
    reason: lexical_alternative
  - marker: c
    text: Yaani, kusema kana kwamba “Ndiyo” na “Hapana” zinaweza kusimama pamoja.
    reason: cultural_note
lexical_decisions:
- source_word: βουλόμενος
  choice: nilipokusudia
  rationale: Kitenzi hiki kinarejelea kusudi la Paulo la kusafiri lililotajwa kabla; “nilipokusudia” ni cha asili na huhifadhi wazo la nia iliyofikiriwa.
- source_word: τῇ ἐλαφρίᾳ ἐχρησάμην
  choice: nilitenda kwa kuyumba-yumba
  rationale: Muungano huu unaonyesha kutenda kwa kutokuwa thabiti katika kusudi, si uzito mdogo wa kimwili; usemi huu unaeleweka kwa msomaji wa Kiswahili.
- source_word: ἃ βουλεύομαι ... βουλεύομαι
  choice: mipango ninayofanya ninaifanya
  rationale: Marudio yanahifadhi kwa kiasi msisitizo wa balagha wa Kigiriki bila kufanya Kiswahili kuwa kigumu kupita kiasi.
- source_word: κατὰ σάρκα
  choice: kwa kufuata mwili
  rationale: Huhifadhi neno muhimu la Paulo “mwili” na kutomfungia msomaji katika tafsiri moja ya sitiari hiyo.
- source_word: παρ’ ἐμοὶ
  choice: kwangu kuwe na
  rationale: Huonyesha jambo linalopatikana au kuwa tabia katika mwenendo wa Paulo, huku likifuatana vizuri na ᾖ.
- source_word: τὸ Ναὶ ναὶ καὶ τὸ Οὒ οὔ
  choice: “Ndiyo, ndiyo” na “Hapana, hapana”
  rationale: Marudio ya chanzo yamehifadhiwa kwa sababu yanasisitiza shtaka la kubadilika-badilika au kutoa kauli zinazopingana.
theological_decisions:
- issue: Maana ya σάρξ katika usemi wa Paulo κατὰ σάρκα
  choice: kwa kufuata mwili
  alternative: kwa kufuata viwango vya kibinadamu tu; kwa namna ya kidunia
  rationale: Kuhifadhi “mwili” hudumisha msamiati na mvutano wa kitheolojia wa Paulo; tanbihi inaeleza maana zinazowezekana bila kuamua moja kimyakimya.
- issue: Uhusiano wa “Ndiyo” na “Hapana”
  choice: kauli zote mbili kuwapo kwa wakati mmoja
  alternative: kwamba Paulo hubadilisha “Ndiyo” kuwa “Hapana” kulingana na masilahi yake
  rationale: Muktadha unaashiria shtaka la kutokuwa thabiti, lakini muundo wa Kigiriki unabaki na nafasi ya kueleweka kama kauli zinazopingana; tafsiri haibainishi zaidi ya ushahidi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Maswali ya balagha na marudio ya Kigiriki yamehifadhiwa kwa kadiri inayosikika kawaida. “Kwa wakati mmoja” huweka wazi nguvu ya muktadha, huku tanbihi zikihifadhi njia nyingine za kuelewa maneno muhimu.
