revisions:
- from: Basi, nilipokusudia kufanya hivyo, je, nilitenda kwa kuyumba-yumba[a]? Au je, mipango ninayofanya ninaifanya kwa kufuata mwili[b], ili kwangu kuwe na “Ndiyo, ndiyo” na “Hapana, hapana” kwa wakati mmoja[c]?
  to: Basi, nilipokusudia jambo hili, je, nilitenda kwa kutokuwa thabiti[a]? Au, je, mambo ninayopanga, je, nayapanga kwa kufuata mwili[b], ili kwangu kuwe na “Ndiyo, ndiyo” na “Hapana, hapana”[c]?
  rationale: The revision removes a temporal interpretation absent from the source, improves the naturalness of the repeated planning expression, and uses an idiomatic rendering of the charge of fickleness while preserving the Greek ambiguity and the established rendering of σάρξ.
