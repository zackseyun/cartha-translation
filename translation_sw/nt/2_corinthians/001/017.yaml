review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the two rhetorical questions, the deliberative repetition, the Pauline expression κατὰ σάρκα, and the doubled “Yes”/“No.” However, “kwa wakati mmoja” adds an explicit temporal interpretation not stated in the Greek; the juxtaposition of the two formulas should remain unexpanded in the main text.
  naturalness: “Mipango ninayofanya ninaifanya” is understandable but unnecessarily cumbersome. “Mambo ninayopanga, je, nayapanga...” is more idiomatic Standard East African Swahili while retaining the Greek rhetorical repetition. “Nilipokusudia jambo hili” is also more direct than adding “kufanya hivyo.”
  terminology: “Kwa kufuata mwili” appropriately retains the significant Pauline term σάρξ, with the footnote offering non-exclusive contextual senses. “Kutokuwa thabiti” conveys ἐλαφρίᾳ naturally as instability/fickleness of purpose without suggesting literal lightness.
  issues:
  - severity: medium
    issue: The main text adds “kwa wakati mmoja.”
    rationale: The Greek says that both “Yes, yes” and “No, no” are present with Paul, but does not explicitly say “at the same time.” This explanatory interpretation belongs in a note, if retained at all, rather than in the translation.
  - severity: low
    issue: The repeated planning clause is stylistically heavy.
    rationale: Replacing “mipango ninayofanya ninaifanya” with “mambo ninayopanga, je, nayapanga” is natural Kiswahili and still reflects the rhetorical repetition of βουλεύομαι.
  revised_text: Basi, nilipokusudia jambo hili, je, nilitenda kwa kutokuwa thabiti[a]? Au, je, mambo ninayopanga, je, nayapanga kwa kufuata mwili[b], ili kwangu kuwe na “Ndiyo, ndiyo” na “Hapana, hapana”[c]?
