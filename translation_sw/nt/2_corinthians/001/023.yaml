  text: Ἐγὼ δὲ μάρτυρα τὸν θεὸν ἐπικαλοῦμαι ἐπὶ τὴν ἐμὴν ψυχήν, ὅτι φειδόμενος ὑμῶν οὐκέτι ἦλθον εἰς Κόρινθον.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/023.yaml
  text: But I call God as witness upon my own life[b][a], that to spare you I did not come again to Corinth.
translation:
  language: sw
  text: Lakini mimi ninamwita Mungu kuwa shahidi juu ya nafsi yangu[a] kwamba, kwa kuwahurumia, sikuja tena[b] Korintho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “dhidi ya nafsi yangu mwenyewe”; kwa karibu zaidi, “juu ya nafsi yangu.”
    reason: lexical_alternative
  - marker: b
    text: Au “sikuja tena kamwe Korintho.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐγὼ δὲ
  choice: Lakini mimi
  rationale: Inahifadhi utofautishaji wa δέ na msisitizo wa kiwakilishi ἐγώ kwa Kiswahili cha kawaida.
- source_word: μάρτυρα τὸν θεὸν ἐπικαλοῦμαι
  choice: namwita Mungu awe shahidi
  rationale: Ni usemi wa asili wa Kiswahili unaohifadhi uzito wa kumwomba Mungu athibitishe ukweli wa kauli ya Paulo.
- source_word: ἐπὶ τὴν ἐμὴν ψυχήν
  choice: juu ya maisha yangu
  rationale: ψυχή katika kiapo hiki huhusu nafsi au uhai wa Paulo unaowekwa rehani; 'maisha yangu' inaeleweka kwa urahisi huku tanbihi ikihifadhi maana halisi na uwezekano wa 'dhidi yangu mwenyewe'.
- source_word: ὅτι
  choice: kwamba
  rationale: Inatambulisha maudhui ya ushuhuda anaomwitia Mungu, si sababu tofauti.
- source_word: φειδόμενος ὑμῶν
  choice: ili niwahurumie
  rationale: Inaeleza kusudi au nia ya Paulo ya kuwaepusha na hatua kali; muundo huu ni wa asili katika Kiswahili.
- source_word: οὐκέτι ἦλθον
  choice: sikurudi
  rationale: Katika muktadha wa ziara iliyotarajiwa, 'sikurudi' huwasilisha kwa kawaida kwamba Paulo hakufanya ziara nyingine; tanbihi huhifadhi uwezekano mpana wa οὐκέτι.
- source_word: εἰς Κόρινθον
  choice: Korintho
  rationale: Kwa kitenzi 'kurudi,' Kiswahili hakihitaji kihusishi cha kuelekea kabla ya jina la mji.
theological_decisions:
- issue: Nguvu ya kiapo katika ἐπὶ τὴν ἐμὴν ψυχήν
  choice: juu ya maisha yangu
  alternative: dhidi yangu mwenyewe / juu ya nafsi yangu
  rationale: Tafsiri kuu inaweka wazi kwamba Paulo anaweka uhai wake rehani mbele za Mungu bila kuamua kupita kiasi namna kamili ya adhabu inayodokezwa; tanbihi inadumisha mvutano wa usemi wa asili.
- issue: Maana ya φειδόμενος ὑμῶν
  choice: ili niwahurumie
  alternative: ili niwaepushe / kwa kuwafikiria ninyi
  rationale: Kitenzi φείδομαι kina wazo la kutenda kwa huruma kwa kujizuia kuleta ukali; 'niwahurumie' kinahifadhi nia hiyo bila kutaja adhabu mahususi ambayo maandiko hayasemi wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni rahisi kwa msomaji wa kawaida, lakini uzito wa kiapo na utata wa ἐπὶ τὴν ἐμὴν ψυχήν pamoja na οὐκέτι umehifadhiwa kwa tanbihi.
