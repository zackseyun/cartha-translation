id: 2CO.1.1
reference: 2 Corinthians 1:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Παῦλος ἀπόστολος ⸂Χριστοῦ Ἰησοῦ⸃ διὰ θελήματος θεοῦ καὶ Τιμόθεος ὁ ἀδελφὸς τῇ ἐκκλησίᾳ τοῦ θεοῦ τῇ οὔσῃ ἐν Κορίνθῳ, σὺν τοῖς ἁγίοις πᾶσιν τοῖς οὖσιν ἐν ὅλῃ τῇ Ἀχαΐᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/001.yaml
  text: 'Paul[a], an apostle of Messiah Jesus by the will of God, and Timothy our brother, to the church of God that is in Corinth[b], together with all the saints who are in all Achaia:'
translation:
  language: sw
  text: 'Paulo, mtume wa Masihi Yesu[a] kwa mapenzi ya Mungu, na Timotheo ndugu yetu, kwa kanisa la Mungu lililoko Korintho, pamoja na watakatifu wote walioko katika Akaya yote:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, Kristo Yesu.
    reason: alternative_rendering
lexical_decisions:
- source_word: ἀπόστολος
  choice: mtume
  rationale: “Mtume” ni istilahi ya kawaida na sahihi katika Kiswahili kwa cheo cha Paulo kama aliyetumwa na kupewa mamlaka.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Masihi Yesu
  rationale: Mpangilio wa Kigiriki unaweka Χριστός kabla ya Ἰησοῦ, na hapa neno hilo lina nguvu ya cheo; “Masihi Yesu” hudhihirisha maana ya Mtiwa-Mafuta bila kuibadili kuwa jina tu.
- source_word: διὰ θελήματος θεοῦ
  choice: kwa mapenzi ya Mungu
  rationale: Hii ni tafsiri ya asili ya Kiswahili inayoonyesha kwamba utume wa Paulo unatokana na mapenzi ya Mungu.
- source_word: ὁ ἀδελφὸς
  choice: ndugu yetu
  rationale: Ingawa Kigiriki kinasema kihalisi “yule ndugu/ndugu,” “ndugu yetu” ni Kiswahili cha kawaida katika salamu hii na huweka wazi uhusiano wa Timotheo na jumuiya bila kubadili maana iliyodokezwa.
- source_word: ἐκκλησίᾳ
  choice: kanisa
  rationale: “Kanisa” ni neno lililozoeleka na linalofaa kwa kusanyiko la waamini katika salamu za Paulo.
- source_word: ἁγίοις
  choice: watakatifu
  rationale: “Watakatifu” ni tafsiri iliyozoeleka ya neno la Paulo kwa watu waliowekwa wakfu kwa Mungu, wala haimaanishi tu watu wachache waliotangazwa rasmi kuwa watakatifu.
- source_word: ἐν ὅλῃ τῇ Ἀχαΐᾳ
  choice: katika Akaya yote
  rationale: Inahifadhi upeo wa eneo zima unaoonyeshwa na Kigiriki huku ikibaki wazi na ya kawaida katika Kiswahili.
theological_decisions:
- issue: Tafsiri ya Χριστός katika cheo cha ufunguzi
  choice: Masihi Yesu
  alternative: Kristo Yesu
  rationale: Hapa Χριστός ina nguvu dhahiri ya cheo cha Mtiwa-Mafuta. “Masihi” huweka maana hiyo wazi, huku tafsiri ya jadi “Kristo” ikihifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya barua ya kitume lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi umehifadhi salamu inayoendelea hadi mistari inayofuata; ndiyo sababu umetamatishwa kwa alama ya nukta mbili.
