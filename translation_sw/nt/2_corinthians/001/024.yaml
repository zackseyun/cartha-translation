  text: οὐχ ὅτι κυριεύομεν ὑμῶν τῆς πίστεως, ἀλλὰ συνεργοί ἐσμεν τῆς χαρᾶς ὑμῶν, τῇ γὰρ πίστει ἑστήκατε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/024.yaml
  text: Not that we lord it over your faith[a], but we are fellow workers for your joy[c][b], for you stand firm by faith.
translation:
  language: sw
  text: Si kwamba tunaitawala imani yenu[a], bali sisi ni wafanyakazi wenza kwa ajili ya furaha yenu[b], kwa maana mnasimama imara kwa imani[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kumtumaini kwenu.”
    reason: lexical_alternative
  - marker: b
    text: Kwa karibu zaidi, “wafanyakazi wenza wa furaha yenu.”
    reason: lexical_alternative
  - marker: c
    text: Au, “mnasimama imara katika imani.”
    reason: alternative_reading
lexical_decisions:
- source_word: κυριεύομεν
  choice: tunatawala
  rationale: Kitenzi hiki humaanisha kutumia mamlaka au ubwana juu ya wengine. “Tunatawala” ni Kiswahili cha kawaida na chenye hadhi kinachohifadhi wazo la kudhibiti bila kuongeza maana isiyokuwamo wazi katika neno la Kigiriki.
- source_word: ὑμῶν τῆς πίστεως
  choice: imani yenu
  rationale: Muundo wa kimilikishi unawakilishwa kwa kawaida kama “imani yenu.” “Imani” hudumisha maana pana ya πίστις; “tumaini lenu” au “kumtumaini kwenu” linaweza kueleza upande wa kutegemea lakini ni finyu zaidi hapa.
- source_word: συνεργοί
  choice: wafanyakazi pamoja nanyi
  rationale: Neno linaonyesha kushiriki kazi pamoja na Wakorintho, si kuwatawala. Kuongeza “nanyi” kunafanya uhusiano huo uwe wazi na wa asili katika Kiswahili bila kubadili maana ya msingi.
- source_word: τῆς χαρᾶς ὑμῶν
  choice: kwa ajili ya furaha yenu
  rationale: Ingawa Kigiriki kina umbo la kimilikishi, katika muktadha furaha ya Wakorintho ndiyo lengo au manufaa ya kazi hiyo. “Kwa ajili ya” huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: τῇ γὰρ πίστει
  choice: kwa imani
  rationale: Hali ya dative inaweza kuonyesha njia au msingi. “Kwa imani” huhifadhi tafsiri hiyo kwa ufupi, huku “katika imani” ikibaki uwezekano halali.
- source_word: ἑστήκατε
  choice: mnasimama imara
  rationale: Wakati timilifu wa Kigiriki unaonyesha hali thabiti iliyofikiwa na inayoendelea. “Mnasimama imara” huleta nguvu hiyo kwa Kiswahili cha asili.
theological_decisions:
- issue: Maana ya πίστις katika sehemu zote mbili
  choice: imani
  alternative: kumtumaini / tumaini; katika tukio la pili pia “katika imani”
  rationale: Muktadha unaelekea kwenye msimamo wa kuamini wa Wakorintho, si uaminifu wa Kristo wala maana maalumu ya kidhehebu. “Imani” huhifadhi upana wa neno, na tanbihi zinataja uwezekano wa “tumaini” pamoja na tofauti ya “kwa/katika imani.”
- issue: Uhusiano unaoonyeshwa na συνεργοί
  choice: wafanyakazi pamoja nanyi kwa ajili ya furaha yenu
  alternative: wafanyakazi wenza wa furaha yenu
  rationale: Kigiriki kinaweza kutafsiriwa kwa karibu kama “wafanyakazi wenza wa furaha yenu,” lakini muktadha unalinganisha kutawala na kufanya kazi pamoja na Wakorintho kwa manufaa ya furaha yao. Tafsiri kuu inaweka uhusiano huo wazi bila kudai kwamba waandishi ndiyo chanzo cha furaha yao.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imehifadhi utofauti wa Paulo kati ya kutawala na kufanya kazi pamoja, na viunganishi “bali” na “kwa maana” vinafuata hoja ya Kigiriki kwa uwazi.
