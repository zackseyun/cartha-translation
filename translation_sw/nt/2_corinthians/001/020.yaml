base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/020.yaml
  text: For however many promises of God there are[a], in him is the Yes[c][b]. Therefore also through him is the Amen to God for glory through us.
translation:
  language: sw
  text: Kwa maana, ahadi za Mungu, hata ziwe nyingi kadiri gani, ndani yake ndimo ilipo ile “Ndiyo.”[a] Kwa hiyo, pia kwa njia yake kuna ile “Amina”[b] kwa Mungu, kwa ajili ya utukufu kupitia kwetu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa ufafanuzi zaidi, “ndani yake ahadi hizo zinapata ‘Ndiyo.’”
    reason: alternative_reading
  - marker: b
    text: “Amina” ni neno la uthibitisho lenye maana kama “kweli” au “na iwe hivyo.”
    reason: cultural_note
  - marker: c
    text: Au, “kwa utukufu wa Mungu kupitia kwetu,” ikiwa “kwa ajili ya utukufu” inaeleweka kwa wazi zaidi kuwa inamhusu Mungu kama mlengwa wa sifa.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅσαι
  choice: hata ... ziwe nyingi kadiri gani
  rationale: Inaonyesha jumla isiyo na kikomo—ahadi zote za Mungu, bila kujali idadi yake—kwa Kiswahili cha kawaida.
- source_word: ἐπαγγελίαι θεοῦ
  choice: ahadi za Mungu
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja inayoonyesha kwamba hizi ni ahadi ambazo Mungu ametoa.
- source_word: ἐν αὐτῷ
  choice: ndani yake
  rationale: Inahifadhi usemi mfupi unaomlenga Kristo bila kuongeza moja kwa moja kwamba ahadi ‘zinatimizwa,’ ingawa hilo linaelekea kudokezwa.
- source_word: τὸ Ναί
  choice: ile “Ndiyo”
  rationale: ‘Ile’ inaakisi matumizi ya kibainishi cha Kigiriki na kuonyesha kwamba ‘Ndiyo’ imetumiwa kama nomino yenye mkazo.
- source_word: διὸ καὶ δι’ αὐτοῦ
  choice: Kwa hiyo, pia kupitia kwake
  rationale: Inahifadhi hitimisho la διὸ, nyongeza ya καί, na wazo la Kristo kuwa mpatanishi katika δι’ αὐτοῦ.
- source_word: τὸ Ἀμὴν
  choice: ile “Amina”
  rationale: ‘Amina’ ni umbo lililozoeleka katika Kiswahili na linadumisha mwangwi wa ibada pamoja na ulinganifu na ‘ile Ndiyo.’
- source_word: τῷ θεῷ
  choice: kwa Mungu
  rationale: Inaonyesha Mungu kuwa anayeelekezewa ‘Amina,’ bila kupanua zaidi ya muundo wa Kigiriki.
- source_word: πρὸς δόξαν
  choice: kwa ajili ya utukufu
  rationale: Inahifadhi maana ya kusudi au mwelekeo bila kuamua kimya kimya kama ni lazima isomwe wazi kuwa ‘kwa utukufu wa Mungu.’
- source_word: δι’ ἡμῶν
  choice: kupitia kwetu
  rationale: Inahifadhi upana wa usemi wa Paulo bila kuongeza neno kama ‘huduma.’
theological_decisions:
- issue: Iwapo usemi mfupi wa Paulo ufafanuliwe kuwa kauli ya wazi kuhusu kutimizwa kwa ahadi
  choice: Kuhifadhi usemi ‘ndani yake ndimo ilipo ile Ndiyo’
  alternative: ‘ndani yake ahadi zote zinatimizwa’ au ‘ndani yake zinapata Ndiyo yake’
  rationale: Muktadha unaashiria kutimizwa kwa ahadi katika Kristo, lakini Kigiriki ni kifupi na cha balagha. Tafsiri haipaswi kuondoa mvutano huo kwa kuongeza kitenzi cha ufafanuzi katika matini kuu.
- issue: Uhusiano wa πρὸς δόξαν na τῷ θεῷ
  choice: Kuhifadhi usemi mpana ‘kwa ajili ya utukufu’ katika matini kuu
  alternative: ‘kwa utukufu wa Mungu’ au ‘ili Mungu atukuzwe’
  rationale: Mungu ndiye anayeelekea kuwa mlengwa wa utukufu, lakini muundo wa Kigiriki unaweza kuwasilishwa bila kuufanya uhusiano huo kuwa wazi kuliko ulivyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa kifungu cha kwanza umefanywa wa kawaida kwa Kiswahili huku ufupi wa kiteolojia wa Paulo ukihifadhiwa. Alama za kunukuu zinaonyesha matumizi ya ‘Ndiyo’ na ‘Amina’ kama kauli zilizofanywa nomino.
