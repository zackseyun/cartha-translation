id: 2CO.1.15
reference: 2 Corinthians 1:15
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ ταύτῃ τῇ πεποιθήσει ἐβουλόμην ⸂πρότερον πρὸς ὑμᾶς ἐλθεῖν⸃, ἵνα δευτέραν ⸀χάριν ⸀σχῆτε,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/015.yaml
  text: And with this confidence I intended to come to you first[a], so that you might have a second benefit[b],
translation:
  language: sw
  text: Nikiwa na uhakika huo, nilikusudia kuja kwenu kwanza, ili mpate faida ya pili.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “neema ya pili” au “fadhili ya pili.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πεποιθήσει
  choice: uhakika
  rationale: Neno πεποίθησις lina maana ya uhakika au kujiamini; “uhakika” ni la kawaida na lenye heshima, na linafaa kwa msingi wa kusudi la Paulo.
- source_word: ἐβουλόμην
  choice: nilikusudia
  rationale: Kitenzi βούλομαι kinaonyesha nia au kusudi bila kudai kwamba ulikuwa mpango usioweza kubadilishwa.
- source_word: πρότερον πρὸς ὑμᾶς ἐλθεῖν
  choice: kuja kwenu kwanza
  rationale: πρότερον hapa inaeleweka kwa kawaida kuwa ya kwanza katika mpangilio wa safari, jambo linalofafanuliwa na muktadha unaofuata.
- source_word: δευτέραν χάριν
  choice: neema mara ya pili
  rationale: χάρις huhifadhi wigo wa maana wa neema, fadhili, au faida. “Neema mara ya pili” ni ya moja kwa moja na haiondoi utata wa iwapo Paulo anamaanisha neema/fadhili inayopatikana kupitia ziara nyingine.
- source_word: σχῆτε
  choice: mpate
  rationale: ἔχω katika muktadha huu inaweza kumaanisha kuwa na au kupokea; “mpate” ni Kiswahili cha asili kinachoonyesha kupokea kile kinachotajwa.
theological_decisions:
- issue: Maana ya χάρις katika δευτέραν χάριν
  choice: neema mara ya pili
  alternative: faida ya pili / fadhili ya pili
  rationale: Ingawa muktadha wa safari unaweza kuelekeza kwenye faida au fadhili ya ziara ya Paulo, neno χάρις pia hubeba maana ya neema. Tafsiri kuu inadumisha mvutano huo, huku tanbihi ikitoa maana za kimuktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa asili bila kuficha utata wa χάρις; alama ya tanbihi [a] imewekwa baada ya kirai husika.
