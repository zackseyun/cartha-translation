id: 2CO.1.10
reference: 2 Corinthians 1:10
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὃς ἐκ τηλικούτου θανάτου ἐρρύσατο ἡμᾶς καὶ ⸀ῥύσεται, εἰς ὃν ἠλπίκαμεν ὅτι καὶ ἔτι ῥύσεται,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/010.yaml
  text: who rescued us from so great a death and will rescue us[a], in whom we have hoped that he will indeed rescue us again,
translation:
  language: sw
  text: Yeye alituokoa kutoka katika kifo kikubwa namna hii, naye atatuokoa; tumemtumaini kwamba ataendelea kutuokoa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutoka katika hatari kubwa namna hii ya kufa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τηλικούτου
  choice: kikubwa hivyo
  rationale: Kivumishi hiki cha kuonyesha kinasisitiza ukubwa wa kifo au hatari; ‘kikubwa hivyo’ kinahifadhi msisitizo huo kwa Kiswahili cha kawaida.
- source_word: θανάτου
  choice: kifo
  rationale: Nomino hii kwa maana ya moja kwa moja ni ‘kifo.’ Tafsiri kuu inadumisha taswira ya Kigiriki, huku maana ya hatari ya kufa ikitajwa katika tanbihi.
- source_word: ἐρρύσατο
  choice: alituokoa
  rationale: Kitenzi kinaeleza kuondolewa katika hatari. ‘Alituokoa’ ni cha kawaida, wazi, na chenye nguvu katika Kiswahili.
- source_word: ῥύσεται
  choice: atatuokoa
  rationale: Neno lilelile limetumiwa kwa kitenzi chenye shina moja ili kudumisha mwendelezo wa kileksika na maana dhahiri ya wakati ujao.
- source_word: εἰς ὃν
  choice: tumemtumaini
  rationale: Muundo huu unamtaja Mungu kuwa ndiye mlengwa wa tumaini. Kiswahili huieleza hali hiyo kwa kawaida kwa kitenzi ‘kumtumaini,’ bila kuiga kihalisi kihusishi cha Kigiriki.
- source_word: ἠλπίκαμεν
  choice: tumemtumaini
  rationale: Kauli timilifu inaonyesha tumaini lililowekwa na linaloendelea; ‘tumemtumaini’ huwasilisha hali hiyo kwa ufupi na kwa lugha ya kawaida.
- source_word: καὶ ἔτι
  choice: tena
  rationale: Katika muktadha huu, ‘tena’ huonyesha kuendelea kutarajia wokovu mwingine. Uhakika wa matarajio unaonekana pia katika ‘kwamba atatuokoa.’
theological_decisions:
- issue: Ikiwa θάνατος itafsiriwe moja kwa moja kama ‘kifo’ au ifafanuliwe kama ‘hatari ya kufa’ katika maandishi makuu
  choice: Kudumisha ‘kifo’ katika maandishi makuu
  alternative: ‘hatari kubwa hivyo ya kufa’
  rationale: Kigiriki kinatumia wazi nomino ‘kifo.’ Kudumisha neno hilo kunahifadhi taswira kali na mvutano wa usemi wa Paulo, huku maana inayowezekana ya hatari inayotishia uhai ikielezwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umerahisishwa kwa ufasaha bila kuondoa marudio ya ‘alituokoa/atatuokoa,’ ambayo ni muhimu katika mstari huu.
