id: 2CO.1.3
reference: 2 Corinthians 1:3
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Εὐλογητὸς ὁ θεὸς καὶ πατὴρ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, ὁ πατὴρ τῶν οἰκτιρμῶν καὶ θεὸς πάσης παρακλήσεως,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/003.yaml
  text: Blessed be the God and Father of our Lord Jesus the Messiah[a], the Father of mercies and God of all comfort[d][c][b],
translation:
  language: sw
  text: Ahimidiwe Mungu na Baba wa Bwana wetu Yesu Masihi[a], Baba wa rehema[b] na Mungu wa faraja yote[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yesu Kristo.”
    reason: alternative_reading
  - marker: b
    text: Kwa neno halisi, “Baba wa rehema nyingi”; pia yaweza kueleweka kuwa “Baba mwenye huruma.”
    reason: lexical_alternative
  - marker: c
    text: Au, “kitia-moyo chote” au “faraja yote yenye kutuliza.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐλογητὸς
  choice: Ahimidiwe
  rationale: Katika kauli hii ya sifa kwa Mungu, neno hili linaeleza kwamba Mungu anastahili kusifiwa. “Ahimidiwe” ni usemi wa asili na wenye hadhi katika Kiswahili.
- source_word: ὁ θεὸς καὶ πατὴρ
  choice: Mungu na Baba
  rationale: 'Kifungu kinamtaja mtu mmoja kwa mahusiano mawili: yeye ni Mungu na pia Baba wa Bwana wetu Yesu Masihi.'
- source_word: κυρίου
  choice: Bwana
  rationale: “Bwana” ndilo neno la kawaida la Kiswahili kwa κύριος katika matumizi haya ya Kikristo, na linaweza kubeba maana ya mamlaka na heshima.
- source_word: Χριστοῦ
  choice: Masihi
  rationale: Χριστός ni cheo chenye maana ya Mtiwa-Mafuta; “Masihi” huhifadhi maana yake kama cheo badala ya kukifanya jina la ukoo.
- source_word: οἰκτιρμῶν
  choice: rehema
  rationale: Ingawa Kigiriki kina umbo la wingi, “rehema” ni nomino ya kawaida ya Kiswahili inayoweza kueleza wingi na utajiri wa matendo ya huruma ya Mungu bila lugha isiyo ya asili.
- source_word: πάσης παρακλήσεως
  choice: faraja yote
  rationale: Katika muktadha wa mateso unaofuata, “faraja” linaeleza vizuri msaada unaotuliza na kuimarisha; “yote” huhifadhi upeo wa πάσης.
theological_decisions:
- issue: Jinsi ya kutafsiri cheo Χριστός katika Ἰησοῦ Χριστοῦ
  choice: Yesu Masihi
  alternative: Yesu Kristo
  rationale: “Masihi” huhifadhi wazi maana ya cheo cha yule aliyetiwa mafuta, huku tanbihi ikitaja umbo la jadi “Kristo” bila kuamua kwamba neno hilo ni jina tu.
- issue: Uhusiano katika θεὸς καὶ πατὴρ
  choice: Mungu na Baba wa Bwana wetu
  alternative: Mungu, ambaye pia ni Baba wa Bwana wetu
  rationale: Muundo mfupi unafuata Kigiriki na unaonyesha kwamba “Mungu” na “Baba” humrejelea mtu yuleyule bila kuongeza ufafanuzi usio katika matini.
- issue: Maana pana ya παράκλησις
  choice: faraja
  alternative: kutia moyo au kufariji
  rationale: “Faraja” inafaa zaidi kwa muktadha wa dhiki, lakini tanbihi inadumisha maana nyingine halali ya kuimarisha au kutia moyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na wa sasa. “Ahimidiwe” hudumisha kauli ya sifa; sentensi imebaki fupi na yenye mlingano wa kishairi. Alama zote za tanbihi zimewekwa moja kwa moja baada ya maneno yanayohusika.
