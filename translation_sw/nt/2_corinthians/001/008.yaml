id: 2CO.1.8
reference: 2 Corinthians 1:8
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Οὐ γὰρ θέλομεν ὑμᾶς ἀγνοεῖν, ἀδελφοί, ⸀ὑπὲρ τῆς θλίψεως ἡμῶν τῆς ⸀γενομένης ἐν τῇ Ἀσίᾳ, ὅτι καθ’ ὑπερβολὴν ⸂ὑπὲρ δύναμιν ἐβαρήθημεν⸃, ὥστε ἐξαπορηθῆναι ἡμᾶς καὶ τοῦ ζῆν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/008.yaml
  text: For we do not want you to be unaware[a], brothers, about our affliction that happened in Asia, that we were burdened exceedingly, beyond our strength[c][b], so that we despaired even of life.
translation:
  language: sw
  text: Kwa maana, ndugu[a], hatupendi msijue habari za dhiki yetu iliyotupata huko Asia[b]. Tulilemewa kupita kiasi, zaidi ya nguvu zetu, hata tukakata tamaa ya kuishi.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki lililotafsiriwa “ndugu” lina umbo la wingi wa kiume; katika muktadha huu inaonekana Paulo anaihutubia jumuiya yote ya waamini, wanaume na wanawake.
    reason: cultural_note
  - marker: b
    text: “Asia” hapa ni jimbo la Roma lililokuwa magharibi mwa Asia Ndogo, si bara la Asia la leo.
    reason: cultural_note
  - marker: c
    text: Au “hata tukakata tamaa ya kuendelea kuwa hai.”
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλομεν ... ἀγνοεῖν
  choice: hatutaki mkose kujua
  rationale: Huwasilisha kauli ya hiari ya Paulo na maana ya kutofahamu kwa Kiswahili cha kawaida bila kutumia neno lenye dharau.
- source_word: ἀδελφοί
  choice: ndugu
  rationale: Neno la Kiswahili “ndugu” ni la kawaida katika salamu za kijumuiya na linaweza kuwahusu waamini wa kiume na wa kike, huku tanbihi ikieleza umbo la Kigiriki.
- source_word: ὑπὲρ τῆς θλίψεως ἡμῶν
  choice: kuhusu dhiki
  rationale: “Dhiki” huhifadhi uzito wa θλῖψις kama shida kali au mateso, na ni neno la heshima linaloeleweka kwa urahisi.
- source_word: τῆς γενομένης ἐν τῇ Ἀσίᾳ
  choice: iliyotupata huko Asia
  rationale: Kauli hii ni ya kawaida katika Kiswahili na inaonyesha kwamba dhiki hiyo ilitokea kwa Paulo na wenzake katika eneo lililoitwa Asia.
- source_word: καθ’ ὑπερβολὴν
  choice: kupita kiasi
  rationale: Hutoa msisitizo wa kiwango kisicho cha kawaida na kuunganika kwa asili na kirai kinachofuata.
- source_word: ὑπὲρ δύναμιν
  choice: zaidi ya nguvu zetu
  rationale: Huhifadhi maana ya kuvuka uwezo au nguvu walizokuwa nazo.
- source_word: ἐβαρήθημεν
  choice: tulilemewa
  rationale: Huhifadhi taswira ya kubanwa na uzito wa dhiki pamoja na hali tendwa ya kitenzi.
- source_word: ὥστε ἐξαπορηθῆναι ἡμᾶς καὶ τοῦ ζῆν
  choice: hata tukakata tamaa ya kuishi
  rationale: 'Hueleza matokeo makali ya kulemewa kwao: walifikia kukosa tumaini kuhusu kuendelea kwa uhai wao.'
theological_decisions:
- issue: Maana ya ἀδελφοί katika hotuba kwa jumuiya
  choice: ndugu
  alternative: ndugu wa kiume na wa kike
  rationale: “Ndugu” ni neno la Kiswahili lisilolazimisha jinsia katika wingi na linafaa kwa jumuiya nzima; tanbihi huhifadhi taarifa kwamba umbo la Kigiriki ni la wingi wa kiume.
- issue: Kiwango cha kukata tamaa katika καὶ τοῦ ζῆν
  choice: tukakata tamaa ya kuishi
  alternative: tukakata tamaa hata ya kuendelea kuwa hai
  rationale: Tafsiri kuu huhifadhi uzito wa kauli bila kuamua ikiwa Paulo anamaanisha uhai kama dhana au kuendelea kuishi; mbadala umewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imegawanywa baada ya “Asia” ili kupunguza uzito wa muundo mrefu wa Kigiriki bila kupoteza uhusiano wa sababu na matokeo. “Huko” hufanya rejeo la mahali lisikike kwa asili katika Kiswahili.
