id: 2CO.1.4
reference: 2 Corinthians 1:4
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὁ παρακαλῶν ἡμᾶς ἐπὶ πάσῃ τῇ θλίψει ἡμῶν, εἰς τὸ δύνασθαι ἡμᾶς παρακαλεῖν τοὺς ἐν πάσῃ θλίψει διὰ τῆς παρακλήσεως ἧς παρακαλούμεθα αὐτοὶ ὑπὸ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/004.yaml
  text: who comforts us in all our affliction[a], so that we may be able to comfort those in any affliction through the comfort with which we ourselves are comforted by God.
translation:
  language: sw
  text: ambaye hutufariji katika dhiki zetu zote, ili tuweze kuwafariji wale walio katika dhiki yoyote kwa faraja ambayo sisi wenyewe tunafarijiwa na Mungu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hututia moyo ... kuwatia moyo ... kutiwa moyo”; Kigiriki kinatumia familia ileile ya maneno katika mstari huu wote.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακαλῶν / παρακαλεῖν / παρακλήσεως / παρακαλούμεθα
  choice: hutufariji / kuwafariji / faraja / tunafarijiwa
  rationale: Mzizi mmoja wa Kiswahili umetumiwa kote ili kuhifadhi marudio ya familia moja ya maneno katika Kigiriki. Katika muktadha wa dhiki, ‘fariji/faraja’ huonyesha kutia moyo na kuimarisha kwa kumpa mtu moyo katika mateso, si kutuliza hisia tu.
- source_word: ἐπὶ πάσῃ τῇ θλίψει ἡμῶν
  choice: katika dhiki zetu zote
  rationale: ‘Dhiki’ huhifadhi uzito wa θλῖψις kama mateso, shida au hali ya kubanwa; ‘katika’ ni Kiswahili cha kawaida kwa mazingira ambamo faraja hutolewa.
- source_word: εἰς τὸ δύνασθαι ἡμᾶς
  choice: ili nasi tuweze
  rationale: ‘Ili’ huwasilisha kusudi au matokeo ya muundo wa Kigiriki, na ‘nasi’ huendeleza uhusiano kati ya faraja tunayopokea na tunayowapa wengine.
- source_word: τοὺς ἐν πάσῃ θλίψει
  choice: wale walio katika dhiki yoyote
  rationale: '‘Yoyote’ huwasilisha maana pana na ya kugawa: watu wanaopitia aina yoyote ya dhiki.'
- source_word: αὐτοὶ
  choice: sisi wenyewe
  rationale: Huhifadhi mkazo wa kiwakilishi cha Kigiriki.
- source_word: ὑπὸ τοῦ θεοῦ
  choice: na Mungu
  rationale: Katika sentensi tendwa, ‘na Mungu’ humtambulisha Mungu waziwazi kuwa mtendaji wa faraja.
theological_decisions:
- issue: Upana wa maana ya παρακαλέω / παράκλησις
  choice: fariji / faraja
  alternative: tia moyo / kutiwa moyo
  rationale: Muktadha wa θλῖψις unaelekeza kwenye faraja yenye kuimarisha wakati wa mateso. ‘Fariji/faraja’ hudumisha joto la kichungaji na uhusiano wa maneno unaorudiwa, huku tanbihi ikihifadhi uwezekano wa maana ya ‘kutia moyo.’
- issue: Kusudi au matokeo katika εἰς τὸ δύνασθαι
  choice: ili nasi tuweze
  alternative: hivyo nasi tunaweza
  rationale: Muundo unaweza kuwa na kivuli cha kusudi na matokeo; ‘ili’ huonyesha mtiririko wenye kusudi bila kukataa kwamba uwezo huo pia ni matokeo ya faraja ya Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa kawaida kwa msomaji wa jumla, huku marudio ya ‘fariji/faraja’ yakihifadhi sifa kuu ya maandishi ya Kigiriki.
