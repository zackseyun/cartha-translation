  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὅτι καθὼς περισσεύει τὰ παθήματα τοῦ Χριστοῦ εἰς ἡμᾶς, οὕτως διὰ τοῦ Χριστοῦ περισσεύει καὶ ἡ παράκλησις ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/005.yaml
  text: For just as the sufferings of Christ overflow to us[b][a], so also through Christ our comfort overflows.
translation:
  language: sw
  text: Kwa maana, kama vile mateso ya Kristo[b][a] yanavyotufurika, vivyo hivyo faraja yetu pia inafurika kupitia Kristo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mateso kwa ajili ya Kristo.” Kigiriki kinaweza kumaanisha mateso yaliyo ya Kristo au mateso yanayovumiliwa kwa sababu yake.
    reason: alternative_reading
  - marker: b
    text: “Kristo” pia inaweza kutafsiriwa “Masihi” pale maana ya cheo inaposisitizwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Kwa maana
  rationale: Inaonyesha kuwa mstari huu unaeleza sababu ya kauli iliyotangulia, kwa Kiswahili cha kawaida na chenye uzito wa kisababishi.
- source_word: καθὼς ... οὕτως
  choice: kama vile ... vivyo hivyo
  rationale: Inahifadhi muundo wa ulinganisho wa vipashio viwili katika Kiswahili cha asili.
- source_word: περισσεύει
  choice: inafurika
  rationale: Kitenzi hiki kinawasilisha wingi unaozidi kipimo na kinahifadhi taswira ileile inaporudiwa kwa mateso na faraja.
- source_word: τὰ παθήματα
  choice: mateso
  rationale: Ni tafsiri ya moja kwa moja, ya kawaida, na inayofaa katika muktadha wa taabu zinazovumiliwa.
- source_word: τοῦ Χριστοῦ
  choice: ya Kristo
  rationale: Inahifadhi uhusiano wa kimilikishi usiofafanuliwa kikamilifu katika Kigiriki badala ya kuamua kimya kimya kama ni mateso aliyopata Kristo au mateso yanayovumiliwa kwa ajili yake.
- source_word: εἰς ἡμᾶς
  choice: yanavyotufurika
  rationale: Kiambishi cha yambwa 'tu-' kinaonyesha kwa Kiswahili cha kawaida kwamba mateso hayo yanatujia na kutupata, huku taswira ya kufurika ikidumishwa.
- source_word: διὰ τοῦ Χριστοῦ
  choice: kupitia Kristo
  rationale: Inaonyesha wazi kwamba Kristo ndiye njia ambayo faraja hiyo hutufikia.
- source_word: ἡ παράκλησις ἡμῶν
  choice: faraja yetu
  rationale: Inafuata muundo wa kirai cha Kigiriki na kudumisha tofauti ya kichungaji kati ya mateso na faraja.
theological_decisions:
- issue: Maana ya 'mateso ya Kristo'
  choice: Kuweka 'mateso ya Kristo' bila kufafanua zaidi uhusiano huo
  alternative: mateso kwa ajili ya Kristo
  rationale: Muundo wa Kigiriki unaweza kumaanisha mateso yanayomhusu au yaliyo ya Kristo, au mateso yanayovumiliwa kwa ajili yake. Matini kuu inadumisha mvutano huo, na tanbihi inaonyesha uwezekano mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa 'kama vile ... vivyo hivyo' unadumisha ulinganifu wa Kigiriki, na kurudiwa kwa 'inafurika' kunahifadhi taswira kuu ya mstari.
