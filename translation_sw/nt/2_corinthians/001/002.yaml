base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/002.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a][b].
translation:
  language: sw
  text: Neema na amani ziwe kwenu kutoka kwa Mungu Baba yetu na Bwana[b] Yesu Masihi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au kwa namna ya kimapokeo, “Yesu Kristo.”
    reason: lexical_alternative
  - marker: b
    text: Katika miktadha mingine, neno la Kigiriki linalotafsiriwa “Bwana” linaweza kumaanisha “bwana” au “mwenye mamlaka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: neema
  rationale: “Neema” ni neno la kawaida katika Kiswahili cha Biblia linalohifadhi uzito wa salamu ya Paulo pamoja na maana ya wema wa Mungu unaotolewa bila kustahiliwa.
- source_word: ὑμῖν
  choice: kwenu
  rationale: Hii ndiyo njia ya asili ya kuonyesha walengwa wa baraka au salamu katika Kiswahili; umbo la wingi linawafaa waumini wote wanaoandikiwa.
- source_word: εἰρήνη
  choice: amani
  rationale: “Amani” huhifadhi maana ya moja kwa moja na mwangwi mpana wa kibiblia wa hali njema na upatanisho.
- source_word: ἀπὸ
  choice: kutoka kwa
  rationale: Kirai hiki kinaonyesha chanzo cha neema na amani kwa Kiswahili cha kawaida na wazi.
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: Mungu Baba yetu
  rationale: Muundo huu ni wa asili na wenye heshima katika Kiswahili, na unaonyesha kwamba Mungu ndiye Baba yetu bila kuongeza kiunganishi kisichokuwapo.
- source_word: κυρίου
  choice: Bwana
  rationale: “Bwana” ndilo neno la kawaida na linalofaa zaidi kwa cheo κύριος katika matumizi haya ya Kikristo; linahifadhi hadhi ya juu ya cheo hicho.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesu Masihi
  rationale: “Yesu” ni jina, na “Masihi” hutafsiri maana ya cheo Χριστός badala ya kukinakili tu; katika Kiswahili cheo baada ya jina hakihitaji kiambishi cha Kiingereza ‘the’.
- source_word: '[implied blessing formula]'
  choice: ziwe
  rationale: Ingawa Kigiriki hakina kitenzi kilichoandikwa, Kiswahili cha kawaida huhitaji kitenzi katika salamu hii. “Ziwe” linaonyesha ombi la baraka bila kubadili chanzo au maudhui yake.
theological_decisions:
- issue: Namna ya kutafsiri Χριστοῦ katika salamu ya Paulo
  choice: Masihi
  alternative: Kristo
  rationale: “Masihi” huweka wazi kwamba Χριστός ni cheo chenye maana ya Mtiwa-Mafuta. Tanbihi inahifadhi umbo la kimapokeo “Kristo” bila kulifanya kuwa tafsiri kuu.
- issue: Namna ya kutafsiri κυρίου inapomhusu Yesu
  choice: Bwana
  alternative: Mkuu
  rationale: “Bwana” ndilo chaguo la kawaida la kibiblia na linafaa kwa cheo cha Yesu katika kauli hii ya baraka. “Mkuu” linaweza kueleza mamlaka, lakini halihifadhi vizuri matumizi mapana na uzito wa κύριος hapa.
- issue: Uhusiano wa Mungu Baba na Bwana Yesu kama chanzo
  choice: Kuhifadhi kiunganishi ‘na’ na kirai kimoja cha ‘kutoka kwa’
  alternative: Kurudia ‘kutoka kwa’ kabla ya Bwana Yesu
  rationale: Kigiriki kina ἀπὸ mara moja na kinaunganisha “Mungu Baba yetu” na “Bwana Yesu Masihi” kwa καί. Tafsiri inahifadhi muundo huo bila kufafanua zaidi namna ya uhusiano wao katika kutoa neema na amani.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. Kitenzi “ziwe” kimeongezwa kwa ulaini wa kisarufi wa Kiswahili katika kauli ya baraka; hakiongezi dai jipya. Viashiria vya tanbihi vimewekwa moja kwa moja baada ya maneno vinayohusu, hata ingawa [b] hutokea kabla ya [a] katika sentensi.
