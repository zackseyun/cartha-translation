translation:
  language: sw
  text: ambaye pia alitutia muhuri na kutupa malipo ya awali[a] ya Roho mioyoni mwetu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “amana” au “dhamana” ya Roho.
    reason: lexical_alternative
lexical_decisions:
- source_word: σφραγισάμενος
  choice: alitutia muhuri
  rationale: Huhifadhi sitiari ya kutia muhuri kama alama ya umiliki, uthibitisho au usalama, bila kuifafanua kupita kiasi.
- source_word: δοὺς
  choice: na kutupa
  rationale: Kirai hiki kinaunganishwa kwa kawaida na tendo lililotangulia, huku kikidumisha ulinganifu wa matendo mawili ya Mungu.
- source_word: ἀρραβῶνα
  choice: malipo ya awali
  rationale: Neno hili hurejelea malipo ya kwanza yanayothibitisha kwamba yaliyobaki yatatolewa. ‘Malipo ya awali’ ni lugha ya sasa inayoeleweka na huhifadhi sitiari ya kibiashara.
- source_word: τοῦ πνεύματος
  choice: ya Roho
  rationale: Huhifadhi muundo mfupi wa kimilikishi katika Kigiriki na kutotatua kimya kimya ikiwa malipo hayo ni Roho mwenyewe au yanatokana na Roho.
- source_word: ἐν ταῖς καρδίαις ἡμῶν
  choice: mioyoni mwetu
  rationale: Hutoa kwa kawaida mahali pa ndani na pa kibinafsi panapoelezwa na ἐν pamoja na dative.
- source_word: ὁ καὶ ... καὶ
  choice: ambaye pia ... na
  rationale: ‘Ambaye’ huendeleza kwa kawaida rejeo la Mungu kutoka mstari uliotangulia, na ‘pia ... na’ huhifadhi uhusiano wa matendo mawili.
theological_decisions:
- issue: Maana ya Roho kama ἀρραβών
  choice: malipo ya awali ya Roho
  alternative: amana ya Roho; dhamana ya Roho; arabuni ya Roho
  rationale: Tafsiri kuu huhifadhi picha halisi ya kibiashara badala ya kuibadili kuwa kauli ya kidhahania tu. Muundo ‘ya Roho’ pia huacha wazi uhusiano kamili wa kimahusiano uliopo katika Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Malipo ya awali’ ni wazi kwa wasomaji wa kawaida; ‘muhuri’ huhifadhi sitiari ya chanzo. Alama ya tanbihi imewekwa katika matini kuu.
