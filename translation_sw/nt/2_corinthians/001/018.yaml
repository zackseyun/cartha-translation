  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya karibu zaidi na muundo wa Kigiriki, “Lakini Mungu ni mwaminifu, kwamba ujumbe wetu kwenu si ndiyo na hapana.”
