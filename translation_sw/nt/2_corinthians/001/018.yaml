lexical_decisions:
- source_word: πιστός
  choice: mwaminifu
  rationale: Neno hili linaeleza uaminifu na kutegemeka kwa Mungu, ambavyo vinatumiwa hapa kuthibitisha ukweli wa kauli ya Paulo.
- source_word: δὲ
  choice: kwa hakika
  rationale: Ingawa mara nyingi δέ huonyesha utofautishaji, hapa muundo mzima una nguvu ya uthibitisho wa dhati; “kwa hakika” ni wa asili katika Kiswahili.
- source_word: ὁ θεός
  choice: Mungu
  rationale: Hili ni tafsiri ya moja kwa moja ya kiima.
- source_word: ὅτι
  choice: ':'
  rationale: Alama ya nukta mbili inaunganisha uthibitisho unaotegemea uaminifu wa Mungu na maudhui ya dai linalofuata bila kulazimisha maana ya ‘kwa sababu’.
- source_word: λόγος
  choice: ujumbe
  rationale: Katika muktadha huu λόγος ni kile Paulo na wenzake walichowaambia Wakorintho; “ujumbe” ni wazi na wa kawaida kuliko tafsiri halisi ya “neno.”
- source_word: ἡμῶν
  choice: wetu
  rationale: Ni umilikishi unaoambatana na “ujumbe.”
- source_word: ὁ πρὸς ὑμᾶς
  choice: kwenu
  rationale: Inaonyesha kwamba ujumbe huo ulielekezwa kwa Wakorintho.
- source_word: οὐκ ἔστιν
  choice: si
  rationale: Inahifadhi wakati wa sasa na nguvu ya dai la Paulo kwa Kiswahili cha asili.
- source_word: Ναὶ καὶ Οὔ
  choice: “Ndiyo na Hapana”
  rationale: Inadumisha jozi ya maneno yenye mkazo ambayo inaashiria kutokuwa na msimamo au kujipinga.
theological_decisions:
- issue: Jinsi ya kutafsiri muundo wa uthibitisho πιστὸς δὲ ὁ θεὸς ὅτι
  choice: 'Kwa hakika Mungu ni mwaminifu: ...'
  alternative: Lakini Mungu ni mwaminifu, kwamba ... / Mungu ni mwaminifu, kwa sababu ...
  rationale: Tafsiri hii inaonyesha kwamba Paulo anatumia uaminifu wa Mungu kama msingi wa uthibitisho wake, huku ikiepuka sintaksia ngumu na bila kufanya ὅτι iwe lazima sababu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa uthibitisho umewekwa kwa lugha ya asili, na tanbihi zinahifadhi tafsiri ya karibu zaidi pamoja na upana wa maana ya λόγος.
