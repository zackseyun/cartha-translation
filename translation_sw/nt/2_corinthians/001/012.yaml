language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἡ γὰρ καύχησις ἡμῶν αὕτη ἐστίν, τὸ μαρτύριον τῆς συνειδήσεως ἡμῶν, ὅτι ἐν ⸀ἁγιότητι καὶ εἰλικρινείᾳ ⸀τοῦ θεοῦ, ⸀οὐκ ἐν σοφίᾳ σαρκικῇ ἀλλ’ ἐν χάριτι θεοῦ, ἀνεστράφημεν ἐν τῷ κόσμῳ, περισσοτέρως δὲ πρὸς ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/012.yaml
  text: 'For this is our boast: the testimony of our conscience[a], that we conducted ourselves in the world in holiness and sincerity of God[c][b], not in fleshly wisdom but in the grace of God—and especially toward you.'
translation:
  language: sw
  text: 'Kwa maana hiki ndicho tunachojivunia: ushuhuda wa dhamiri yetu kwamba tuliishi ulimwenguni kwa utakatifu[a] na unyofu utokao kwa Mungu[b], si kwa hekima ya mwili[c], bali kwa neema ya Mungu—na zaidi sana kwenu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati zina “unyofu” badala ya “utakatifu.”
    reason: textual_variant
  - marker: b
    text: Au “unyofu wa kimungu.”
    reason: lexical_alternative
  - marker: c
    text: Au “hekima ya kibinadamu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καύχησις
  choice: jambo tunalojivunia
  rationale: Huwasilisha msingi wa kujivunia kwa namna ya kawaida katika Kiswahili bila kuifanya kauli ionekane kuwa kiburi tupu.
- source_word: μαρτύριον τῆς συνειδήσεως ἡμῶν
  choice: dhamiri yetu inashuhudia
  rationale: Muundo wa kitenzi ni wa asili zaidi katika Kiswahili na huhifadhi wazo la ushuhuda wa ndani wa dhamiri.
- source_word: ἁγιότητι
  choice: utakatifu
  rationale: Hufuata usomaji wa SBLGNT na kuhifadhi uzito wa kimaadili na kidini wa neno hilo.
- source_word: εἰλικρινείᾳ τοῦ θεοῦ
  choice: unyofu utokao kwa Mungu
  rationale: Unyofu ni neno la kawaida na lenye heshima kwa uaminifu usio na hila; 'utokao kwa Mungu' huonyesha uwezekano wa Mungu kuwa chanzo bila kuufanya usemi huo kuwa sifa ya Mungu mwenyewe.
- source_word: σοφίᾳ σαρκικῇ
  choice: hekima ya mwili
  rationale: Huhifadhi wazi kundi la maneno ya σάρξ, badala ya kulainisha kuwa hekima ya kibinadamu au ya kidunia.
- source_word: χάριτι θεοῦ
  choice: neema ya Mungu
  rationale: Ni tafsiri ya kawaida ya Paulo na huhifadhi uzito wa kitheolojia wa χάρις.
- source_word: ἀνεστράφημεν ἐν τῷ κόσμῳ
  choice: tuliishi ulimwenguni
  rationale: Kitenzi hapa hueleza mwenendo wa maisha; 'tuliishi' ni cha asili na kinaeleweka, huku muktadha ukionyesha namna ya mwenendo.
- source_word: περισσοτέρως δὲ πρὸς ὑμᾶς
  choice: na hasa katika uhusiano wetu nanyi
  rationale: Huwasilisha nguvu ya 'zaidi sana/hasa' na maana ya kimahusiano ya πρὸς ὑμᾶς kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Nguvu ya τοῦ θεοῦ katika εἰλικρινείᾳ τοῦ θεοῦ
  choice: unyofu utokao kwa Mungu
  alternative: unyofu wa kimungu; unyofu wa Mungu
  rationale: Genitivi inaweza kuonyesha chanzo au sifa. Tafsiri iliyochaguliwa inaonyesha chanzo kinachowezekana huku tanbihi ikihifadhi uwezekano wa maana ya kisifa; inaepuka kudai kwamba kifungu kinazungumzia unyofu wa Mungu mwenyewe.
- issue: Maana ya σοφίᾳ σαρκικῇ
  choice: hekima ya mwili
  alternative: hekima ya kibinadamu
  rationale: Tafsiri ya moja kwa moja huhifadhi mvutano wa istilahi ya Paulo kuhusu 'mwili'; tanbihi hutoa maana mbadala iliyo wazi zaidi bila kuibadilisha kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo umefanywa wa asili kwa Kiswahili, huku istilahi muhimu kama “utakatifu,” “mwili,” na “neema” zikihifadhiwa. Alama zote za tanbihi zimewekwa mara moja katika maandishi makuu kwa mpangilio wa [a], [b], [c].
