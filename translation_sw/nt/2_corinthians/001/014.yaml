  yaml_path: translation/nt/2_corinthians/001/014.yaml
  text: just as you also came to understand us in part[a], that we are your boast, just as you also are ours[b], in the day of our Lord Jesus.
translation:
  language: sw
  text: kama vile ninyi pia mlivyotuelewa kwa sehemu[a], kwamba sisi ni fahari yenu, kama vile ninyi pia mlivyo fahari yetu[b], katika siku ya Bwana wetu Yesu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa kiasi fulani.”
    reason: lexical_alternative
  - marker: b
    text: Au “sababu ya kujivunia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέγνωτε
  choice: mlivyotuelewa
  rationale: Kitenzi hiki kinaonyesha kwamba Wakorintho walifikia kiwango halisi cha kuwatambua au kuwaelewa Paulo na wenzake; “mlivyotuelewa” ni ya kawaida na haidai uelewa kamili.
- source_word: ἀπὸ μέρους
  choice: kwa sehemu
  rationale: Nahau hii inaonyesha uelewa usio kamili huku ikiacha kiwango chake wazi.
- source_word: καύχημα
  choice: fahari
  rationale: “Fahari” huhifadhi wazo la kujivunia kwa furaha bila kutoa maana hasi ya majivuno; hapa ni jina linalotumiwa kwa pande zote mbili.
- source_word: καθάπερ
  choice: kama vile
  rationale: Huhifadhi ulinganisho wa wazi na wa pande mbili kati ya wahudumu na Wakorintho.
- source_word: ἡμέρᾳ τοῦ κυρίου ἡμῶν Ἰησοῦ
  choice: siku ya Bwana wetu Yesu
  rationale: Huhifadhi usemi wa kieskatolojia na muundo wa uhusiano wa Kigiriki kwa Kiswahili sanifu.
- source_word: κύριος
  choice: Bwana
  rationale: Ni tafsiri ya kawaida na inayofaa ya cheo hiki cha Kikristo katika muktadha huu.
- source_word: καθὼς καὶ
  choice: kama vile
  rationale: Huu ni mwanzo wa ulinganisho unaounganisha mstari huu na kauli iliyotangulia; maana ya nyongeza inapatikana kwa kawaida katika muktadha wa Kiswahili.
theological_decisions:
- issue: Lugha ya Paulo ya καύχημα ya pande mbili
  choice: sisi ni fahari yenu, kama vile ninyi pia mlivyo fahari yetu
  alternative: sisi ndio sababu yenu ya kujivunia, kama vile ninyi mlivyo sababu yetu ya kujivunia
  rationale: “Fahari” huhifadhi ufupi, ulinganifu, na mvutano wa lugha ya Paulo kuhusu kujivunia kwa pande mbili katika siku ya Bwana, bila kuigeuza kuwa madai ya kujitukuza.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa sasa lakini wenye heshima. Muundo wa ulinganisho wa pande mbili umehifadhiwa, na “kwa sehemu” imeachwa bila kufafanua kiwango chake.
