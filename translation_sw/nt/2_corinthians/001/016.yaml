  yaml_path: translation/nt/2_corinthians/001/016.yaml
  text: and through you to pass into Macedonia[a], and again from Macedonia to come to you and by you to be sent on to Judea.
translation:
  language: sw
  text: na kupitia kwenu kwenda Makedonia, kisha kutoka Makedonia kuja kwenu tena, na ninyi kunisaidia kuendelea na safari kwenda Yudea.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na ninyi kunipeleka mbele kwenda Yudea.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ ὑμῶν
  choice: kupitia kwenu
  rationale: διά pamoja na hali ya umilikaji hapa inaonyesha njia ya safari kupitia mahali walipo Wakorintho; “kupitia kwenu” ni ya kawaida na huhifadhi maana hiyo.
- source_word: διελθεῖν εἰς Μακεδονίαν
  choice: kwenda Makedonia
  rationale: Kitenzi kina wazo la kupita au kusafiri kuendelea, lakini Kiswahili “kupitia kwenu kwenda Makedonia” huonyesha kwa kawaida mwendo wa safari bila kurudia neno “kupitia.”
- source_word: πάλιν ἀπὸ Μακεδονίας ἐλθεῖν πρὸς ὑμᾶς
  choice: kisha kutoka Makedonia kuja kwenu tena
  rationale: “Tena” huhifadhi πάλιν na kuonyesha hatua ya pili ya mpango wa safari; “kuja kwenu” haiongezi waziwazi wazo la kurudi ambalo limedokezwa tu na muktadha.
- source_word: ὑφ’ ὑμῶν
  choice: nanyi
  rationale: Muundo huu huhifadhi Wakorintho kama watendaji wa msaada wa safari kwa Kiswahili cha kawaida.
- source_word: προπεμφθῆναι
  choice: kusaidiwa ... kuendelea na safari yangu
  rationale: Katika muktadha wa safari, προπέμπω mara nyingi humaanisha kumwezesha msafiri kuendelea, kwa kumuaga na kumpatia msaada unaohitajika; tafsiri hii ni wazi na ya kawaida kwa wasomaji wa Kiswahili.
- source_word: εἰς τὴν Ἰουδαίαν
  choice: kwenda Yudea
  rationale: εἰς huonyesha mahali safari inakoelekea; “kwenda Yudea” ni usemi wa kawaida wa Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Sentensi imehifadhi mfululizo wa hatua za safari huku ikitumia “kusaidiwa ... kuendelea na safari” kufafanua kwa kawaida maana ya neno la Kiyunani katika muktadha huu.
