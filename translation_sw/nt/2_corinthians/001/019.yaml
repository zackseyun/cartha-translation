  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὁ ⸂τοῦ θεοῦ γὰρ⸃ υἱὸς ⸂Ἰησοῦς Χριστὸς⸃ ὁ ἐν ὑμῖν δι’ ἡμῶν κηρυχθείς, δι’ ἐμοῦ καὶ Σιλουανοῦ καὶ Τιμοθέου, οὐκ ἐγένετο Ναὶ καὶ Οὒ, ἀλλὰ Ναὶ ἐν αὐτῷ γέγονεν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/019.yaml
  text: For the Son of God[a], Jesus the Messiah, who was proclaimed among you through us—through me and Silvanus and Timothy—did not become Yes and No; rather[d][c][b], in him it has become Yes.
translation:
  language: sw
  text: Kwa maana Mwana wa Mungu, Yesu Kristo[a], aliyehubiriwa miongoni mwenu kupitia sisi—kupitia mimi, Silwano na Timotheo—hakuwa “Ndiyo” na “Siyo”; bali ndani yake imekuwa “Ndiyo.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yesu Masihi.”
    reason: lexical_alternative
  - marker: b
    text: 'Kauli ya Kigiriki pia inaweza kueleweka: “hakuwa ‘Ndiyo’ na ‘Siyo’ ... bali ndani yake amekuwa ‘Ndiyo.’”'
    reason: alternative_reading
lexical_decisions:
- source_word: υἱὸς τοῦ θεοῦ
  choice: Mwana wa Mungu
  rationale: Huhifadhi cheo kamili cha Kikristo kwa mpangilio wa kawaida na unaoeleweka katika Kiswahili.
- source_word: Ἰησοῦς Χριστός
  choice: Yesu Kristo
  rationale: Katika muundo huu jina hilo lina matumizi yanayofanana na jina maalumu; “Yesu Kristo” ni Kiswahili sanifu na cha kawaida, huku “Yesu Masihi” likitajwa kama tafsiri mbadala ya maana ya Χριστός.
- source_word: κηρυχθείς
  choice: aliyehubiriwa
  rationale: Kitenzi hiki kinawasilisha tendo la kumtangaza hadharani Kristo na ni cha kawaida katika Kiswahili cha kibiblia bila kuongeza ufafanuzi.
- source_word: δι’ ἡμῶν
  choice: kupitia sisi
  rationale: Huhifadhi maana ya uwakala au njia iliyo katika διά na pia urudiaji wake katika kirai kinachofuata.
- source_word: δι’ ἐμοῦ καὶ Σιλουανοῦ καὶ Τιμοθέου
  choice: kupitia mimi, Silwano na Timotheo
  rationale: Huhifadhi kujitaja kwa Paulo na kuwataja washirika wake, pamoja na wazo lilelile la uwakala.
- source_word: οὐκ ἐγένετο Ναὶ καὶ Οὔ
  choice: hakuwa “Ndiyo” na “Siyo”
  rationale: Huhifadhi usemi wa Paulo wenye mvutano wa kimakusudi badala ya kuufasiri kuwa kutokuwa thabiti au kusitasita.
- source_word: ἀλλὰ Ναὶ ἐν αὐτῷ γέγονεν
  choice: bali ndani yake imekuwa “Ndiyo”
  rationale: Huhifadhi “ndani yake,” tamathali ya “Ndiyo,” na hali timilifu ya γέγονεν bila kuibadili kuwa ufafanuzi wa kiteolojia.
theological_decisions:
- issue: Jinsi ya kutafsiri Χριστός katika Ἰησοῦς Χριστός
  choice: Yesu Kristo
  alternative: Yesu Masihi
  rationale: Muungano huu unatenda kazi kama jina maalumu lililozoeleka. “Kristo” huhifadhi matumizi hayo ya kijina katika Kiswahili, huku tanbihi ikionyesha maana ya cheo “Masihi.”
- issue: Iwapo Ναί na Οὔ zifafanuliwe au zihifadhiwe wazi
  choice: hakuwa “Ndiyo” na “Siyo”; bali ndani yake imekuwa “Ndiyo”
  alternative: hakuwa mwenye kuyumba-yumba, bali mwenye kutegemeka
  rationale: Maneno ya Paulo yana nguvu ya balagha na mvutano wa kiteolojia unaoendelea katika mstari unaofuata; tafsiri haipaswi kuumaliza kwa ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Alama za kunukuu zinabainisha kwamba “Ndiyo” na “Siyo” zimetumiwa kama kauli za kimakusudi, si majibu ya kawaida tu.
