  source_fidelity: 'Tafsiri inafuata kwa uaminifu muundo na maana ya Kigiriki: cheo «Mwana wa Mungu,» jina «Yesu Kristo,» kutangazwa kwake miongoni mwa waumini kwa njia ya Paulo, Silwano, na Timotheo, pamoja na mkabala wa kimakusudi wa «Ndiyo» na «Siyo.» «Hakuwa» ni uwasilishaji wa Kiswahili ulio wazi na wa kiasili wa nahau οὐκ ἐγένετο Ναὶ καὶ Οὔ, bila kuigeuza kuwa tafsiri fafanuzi. «Ndani yake imekuwa ‘Ndiyo’» huhifadhi ἐν αὐτῷ na nguvu ya timilifu γέγονεν bila kuongeza tafsiri ya kiteolojia.'
