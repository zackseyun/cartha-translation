source:
  edition: SBLGNT
  text: συνυπουργούντων καὶ ὑμῶν ὑπὲρ ἡμῶν τῇ δεήσει, ἵνα ἐκ πολλῶν προσώπων τὸ εἰς ἡμᾶς χάρισμα διὰ πολλῶν εὐχαριστηθῇ ὑπὲρ ⸀ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/011.yaml
  text: as you also join in helping us by prayer[c][b][a], so that thanks may be given by many on our behalf for the gracious gift given to us.
translation:
  language: sw
  text: nanyi pia mkiungana kutusaidia kwa maombi, ili shukrani zitolewe na wengi kwa ajili yetu kwa sababu ya zawadi tuliyopewa.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ili, kutoka kwa wengi, shukrani zitolewe kwa ajili yetu kwa sababu ya zawadi tuliyopewa, kupitia wengi.” Muundo wa Kigiriki wenye marejeo mawili kwa “wengi” unaweza kueleweka kwa njia zaidi ya moja.
    reason: alternative_reading
  - marker: b
    text: “Zawadi” pia inaweza kutafsiriwa “zawadi ya neema,” “fadhili,” au “baraka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: συνυπουργούντων
  choice: mkisaidia pamoja nasi
  rationale: Kitenzi hiki kinaonyesha ushiriki wa pamoja katika kutoa msaada; usemi huu unahifadhi nguvu ya kiambishi συν- kwa Kiswahili cha kawaida.
- source_word: τῇ δεήσει
  choice: kwa maombi
  rationale: δέησις ni ombi la dhati; “kwa maombi” ni lugha ya kawaida na pia inaonyesha kwamba maombi ndiyo njia ya kusaidia.
- source_word: ἵνα
  choice: ili
  rationale: Neno hili linaanzisha kusudi au matokeo yanayokusudiwa.
- source_word: ἐκ πολλῶν προσώπων
  choice: watu wengi
  rationale: Ingawa πρόσωπον maana yake ya msingi ni “uso,” hapa wingi wake unatumiwa kwa maana ya watu.
- source_word: τὸ εἰς ἡμᾶς χάρισμα
  choice: neema tuliyopewa
  rationale: χάρισμα ni zawadi au wema unaotolewa kwa neema; katika muktadha huu inahusu fadhili ya Mungu kwa Paulo na wenzake. “Neema tuliyopewa” ni ya asili katika Kiswahili bila kuamua kwa undani namna ya wokovu wao.
- source_word: διὰ πολλῶν
  choice: kwa ajili yetu
  rationale: Muundo wa Kigiriki ni mgumu na uhusiano wa διὰ πολλῶν unaweza kueleweka kwa njia zaidi ya moja. Matini kuu imepewa muundo wa asili, huku maana ya “kupitia wengi” ikihifadhiwa katika tanbihi.
- source_word: εὐχαριστηθῇ
  choice: wamshukuru Mungu
  rationale: Kitenzi tendwa cha Kigiriki kinaeleza utoaji wa shukrani. Kiswahili huhitaji zaidi mtendaji au mpokeaji kuwekwa wazi; Mungu ndiye mpokeaji anayodokezwa na muktadha.
- source_word: ὑπὲρ ἡμῶν
  choice: kwa ajili yetu
  rationale: Hapa ὑπέρ inaonyesha kwamba shukrani hizo zinatolewa kuhusiana na, na kwa manufaa ya, Paulo na wenzake.
theological_decisions:
- issue: Mpokeaji wa shukrani hajatajwa wazi katika Kigiriki
  choice: wamshukuru Mungu
  alternative: shukrani zitolewe
  rationale: Mungu ndiye mpokeaji anayedokezwa katika muktadha, na usemi huu ni wa kawaida katika Kiswahili. Hata hivyo, tanbihi inaonyesha umbo lisilomtaja wazi ili kutunza hali ya matini ya Kigiriki.
- issue: Maana ya χάρισμα katika muktadha
  choice: neema tuliyopewa
  alternative: zawadi tuliyopewa kwa neema
  rationale: Uchaguzi huu unahifadhi wazo la fadhili ya Mungu bila kuifanya χάρισμα kuwa kipawa maalumu cha kiroho au kuifafanua kabisa kuwa ukombozi wao.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imeundwa kwa mtiririko wa kawaida huku ushiriki wa waumini katika maombi, wingi wa wanaoshukuru, na utata wa διὰ πολλῶν vikihifadhiwa. Alama zote za tanbihi zimewekwa katika matini kuu.
