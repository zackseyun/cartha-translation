  text: διὰ τοῦτο παρακεκλήμεθα. Ἐπὶ δὲ τῇ παρακλήσει ⸀ἡμῶν περισσοτέρως μᾶλλον ἐχάρημεν ἐπὶ τῇ χαρᾷ Τίτου, ὅτι ἀναπέπαυται τὸ πνεῦμα αὐτοῦ ἀπὸ πάντων ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/013.yaml
  text: For this reason we have been comforted[a]. And in addition to our comfort, we rejoiced even more abundantly at Titus’s joy[b], because his spirit has been refreshed by all of you.
translation:
  language: sw
  text: Kwa sababu hiyo tumefarijiwa[a]. Tena, zaidi ya faraja yetu, tulifurahi zaidi sana kwa sababu ya furaha ya Tito, kwa kuwa roho yake imeburudishwa na ninyi nyote[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “tumetiwa moyo”; maneno ya Kigiriki hapa yanaweza kumaanisha kufarijiwa au kutiwa moyo.
    reason: lexical_alternative
  - marker: b
    text: Au, “imepata pumziko.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Kwa sababu hiyo
  rationale: Kiunganishi hiki kinaonyesha wazi sababu au hitimisho linalotokana na yaliyotangulia, kwa Kiswahili cha kawaida na cha heshima.
- source_word: παρακεκλήμεθα
  choice: tumefarijiwa
  rationale: Kauli ya kutendwa katika wakati timilifu inaonyesha tendo lililotokea na hali yake inayoendelea; ‘tumefarijiwa’ huhifadhi maana hiyo na inafaa katika muktadha wa kihisia.
- source_word: Ἐπὶ δὲ τῇ παρακλήσει ἡμῶν
  choice: Na zaidi ya faraja yetu
  rationale: Hueleza kwamba furaha iliyofuata iliongezwa juu ya faraja ambayo tayari walikuwa wameipata, badala ya kutafsiri ἐπί kwa namna ngumu na isiyo ya kawaida.
- source_word: παρακλήσει
  choice: faraja
  rationale: Imewekwa katika ulinganifu wa kileksia na ‘tumefarijiwa’; neno la Kigiriki linaweza pia kumaanisha kutiwa moyo, jambo linalobainishwa katika tanbihi.
- source_word: περισσοτέρως μᾶλλον
  choice: kwa wingi zaidi
  rationale: Maneno mawili ya kulinganisha yanatia mkazo kiwango kikubwa cha furaha; Kiswahili hiki huhifadhi msisitizo bila kuwa kigumu kupita kiasi.
- source_word: ἐχάρημεν
  choice: tulifurahi
  rationale: Hutoa kwa kawaida tendo la χαίρω na kuendeleza uhusiano wake wa wazi na ‘furaha’ katika kishazi kinachofuata.
- source_word: ἐπὶ τῇ χαρᾷ Τίτου
  choice: kwa sababu ya furaha ya Tito
  rationale: Katika muktadha huu ἐπί pamoja na dati huonyesha msingi au sababu ya kufurahi kwao; usemi huu ni wa kawaida katika Kiswahili.
- source_word: ἀναπέπαυται
  choice: imeburudishwa
  rationale: Wakati timilifu unaonyesha hali ya sasa iliyotokana na tendo lililotangulia. ‘Imeburudishwa’ hufikisha wazo la kupata utulivu na nguvu mpya katika muktadha wa mahusiano.
- source_word: τὸ πνεῦμα αὐτοῦ
  choice: roho yake
  rationale: Tafsiri ya moja kwa moja huhifadhi lugha ya kianthropolojia ya Kigiriki, ikimaanisha utu au hali ya ndani ya Tito.
- source_word: ἀπὸ πάντων ὑμῶν
  choice: na ninyi nyote
  rationale: Ingawa ἀπό kwa kawaida ni ‘kutoka kwa,’ hapa inaonyesha wale waliosababisha burudisho; ‘na ninyi nyote’ ni usemi asilia wa Kiswahili unaohifadhi chanzo hicho.
theological_decisions:
- issue: Maana ya πνεῦμα inapomhusu Tito
  choice: roho ya kibinadamu / hali yake ya ndani
  alternative: Roho Mtakatifu
  rationale: Kiwakilishi ‘yake’ na muktadha wa mwitikio wa kihisia wa Tito kwa Wakorintho vinaonyesha roho yake mwenyewe, si Roho Mtakatifu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi huhifadhi mfuatano wa hoja ya Kigiriki, huku tanbihi zikihifadhi upana wa maana wa familia ya παρακαλέω na taswira ya ἀναπαύω.
