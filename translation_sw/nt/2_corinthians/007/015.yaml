  text: καὶ τὰ σπλάγχνα αὐτοῦ περισσοτέρως εἰς ὑμᾶς ἐστιν ἀναμιμνῃσκομένου τὴν πάντων ὑμῶν ὑπακοήν, ὡς μετὰ φόβου καὶ τρόμου ἐδέξασθε αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/015.yaml
  text: And his affection for you is even greater as he remembers the obedience of all of you[a], how you received him with fear and trembling.
translation:
  language: sw
  text: Naye anawapenda zaidi anapokumbuka utii wa kila mmoja wenu, jinsi mlivyompokea kwa hofu na kutetemeka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa heshima na kutetemeka”; usemi “hofu na kutetemeka” ni usemi wa Kipaulo unaoeleza mwitikio wa dhati wenye unyenyekevu.
    reason: lexical_alternative
lexical_decisions:
- source_word: σπλάγχνα
  choice: anazidi kuwapenda sana
  rationale: Neno hili kwa maana ya kiistiari hueleza hisia za ndani za upendo. Muundo wa kitenzi ni wa asili katika Kiswahili na, pamoja na περισσοτέρως, unawasilisha kuongezeka kwa upendo huo.
- source_word: περισσοτέρως
  choice: anazidi ... sana
  rationale: Huhifadhi maana ya kulinganisha na kuzidi kwa kiwango cha upendo wa Tito kwa Wakorintho.
- source_word: εἰς ὑμᾶς
  choice: kuwapenda
  rationale: Kiambishi -wa- kinaonyesha kwamba upendo huo unaelekezwa kwa jumuiya ya Wakorintho.
- source_word: ἀναμιμνῃσκομένου
  choice: anapokumbuka
  rationale: Huwasilisha mazingira yanayoambatana na kuongezeka kwa upendo wake na inadumisha maana ya kukumbuka.
- source_word: τὴν πάντων ὑμῶν ὑπακοήν
  choice: utii wa ninyi nyote
  rationale: “Utii” ni tafsiri ya moja kwa moja ya ὑπακοή, na “ninyi nyote” inahifadhi msisitizo kwa jumuiya nzima.
- source_word: μετὰ φόβου καὶ τρόμου
  choice: kwa hofu na kutetemeka
  rationale: Inahifadhi tamathali ya Kipaulo na mvutano wake wa kimaana badala ya kuibadilisha kimyakimya kuwa “heshima” pekee.
- source_word: ἐδέξασθε αὐτόν
  choice: mlivyompokea
  rationale: Huhifadhi maana pana ya kumpokea Tito bila kuamua kupita kiasi kama ilikuwa kumkaribisha au kukubali ujumbe wake.
theological_decisions:
- issue: Maana ya “hofu na kutetemeka” katika kumpokea Tito
  choice: Kauli ya Kipaulo imehifadhiwa kama “kwa hofu na kutetemeka,” huku tanbihi ikionyesha uwezekano wa heshima nzito na mwitikio wa unyenyekevu.
  alternative: “Kwa heshima na kutetemeka” au kuelewa kama woga halisi.
  rationale: Muktadha unaelekea kuonyesha uzito, heshima na unyenyekevu, lakini maneno yenyewe yanaweza kubeba maana ya hofu; hivyo matini kuu inadumisha mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “anazidi kuwapenda sana” ni wa kawaida kwa wasomaji na unaunganisha kwa ufasaha maana za σπλάγχνα na περισσοτέρως bila kupoteza nguvu ya kihisia.
