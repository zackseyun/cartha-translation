  text: ὅτι εἰ καὶ ἐλύπησα ὑμᾶς ἐν τῇ ἐπιστολῇ, οὐ μεταμέλομαι· εἰ καὶ μετεμελόμην (⸀βλέπω ὅτι ἡ ἐπιστολὴ ἐκείνη εἰ καὶ πρὸς ὥραν ἐλύπησεν ὑμᾶς),
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/008.yaml
  text: For even if I grieved you with the letter[a], I do not regret it—though I did regret it, for I see that that letter grieved you[b], though only for a time.
translation:
  language: sw
  text: Kwa maana hata kama niliwahuzunisha kwa barua, sijuti—ingawa nilijuta[a], kwa kuwa ninaona kwamba barua hiyo iliwahuzunisha, ingawa kwa muda mfupi tu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ingawa nilikuwa nikijuta.” Wakati usiotimilifu wa Kigiriki unaweza kusisitiza hali ya kujuta iliyodumu wakati uliopita.
    reason: lexical_alternative
  - marker: b
    text: Kwa tafsiri ya neno kwa neno, “kwa saa moja”; hii ni nahau yenye maana ya “kwa muda mfupi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλύπησα / ἐλύπησεν
  choice: niliwahuzunisha / iliwahuzunisha
  rationale: Kitenzi λυπέω hapa humaanisha kusababisha huzuni au maumivu ya moyo. ‘Kuhuzunisha’ ni Kiswahili cha kawaida kinachohifadhi uzito wa kihisia bila kuongeza wazo la madhara ya kimwili.
- source_word: ἐν τῇ ἐπιστολῇ
  choice: kwa barua hiyo
  rationale: ἐν inaonyesha njia iliyotumiwa; ‘kwa barua hiyo’ ni ya asili katika Kiswahili na inaeleza kwamba barua ndiyo iliyosababisha huzuni.
- source_word: μεταμέλομαι
  choice: sijuti
  rationale: Katika muktadha huu μεταμέλομαι inaeleza kujuta kwa sababu ya athari ya barua, si toba ya kiadili mbele za Mungu. ‘Sijuti’ huhifadhi maana hiyo na kauli ya wakati wa sasa.
- source_word: μετεμελόμην
  choice: nilijuta
  rationale: Wakati usiotimilifu wa Kigiriki unaonyesha hali ya kujuta iliyokuwapo wakati uliopita. ‘Nilijuta’ huleta tofauti iliyo wazi na ‘sijuti’; tanbihi inahifadhi uwezekano wa msisitizo wa hali ya muda uliopita.
- source_word: βλέπω
  choice: ninaona
  rationale: ‘Ninaona’ ni tafsiri ya moja kwa moja na ya kawaida, ikionyesha utambuzi wa Paulo kuhusu athari ya barua.
- source_word: ἡ ἐπιστολὴ ἐκείνη
  choice: barua hiyo
  rationale: ‘Barua hiyo’ hudumisha nguvu ya kiashiria cha ἐκείνη huku ikirejelea kwa kawaida barua iliyotajwa tayari.
- source_word: πρὸς ὥραν
  choice: kwa muda mfupi tu
  rationale: Hii ni nahau inayomaanisha kipindi kifupi, si lazima saa moja kamili. Neno ‘tu’ linaonyesha ufupi wa athari hiyo.
- source_word: ὅτι
  choice: Kwa maana / kwa kuwa
  rationale: Matumizi ya kwanza yanaanzisha maelezo yanayohusiana na kauli iliyotangulia, na matumizi yanayofuata yanaeleza msingi wa kauli ya Paulo. Chaguo hizi mbili ni za kawaida katika Kiswahili na hudumisha uhusiano wa kimantiki.
- source_word: εἰ καὶ
  choice: hata kama / ingawa
  rationale: Miundo hii hudumisha maana ya kukubali jambo licha ya hoja kuu. Utofauti mdogo wa Kiswahili huifanya sentensi isomeke kwa kawaida bila kuondoa marudio ya hoja ya Kigiriki.
theological_decisions:
- issue: Maana ya μεταμέλομαι katika maelezo ya hisia za Paulo
  choice: Imetafsiriwa ‘kujuta,’ si ‘kutubu’
  alternative: kutubu; kusikitika
  rationale: Muktadha unahusu hisia za Paulo kuhusu huzuni iliyosababishwa na barua yake, wala si dai kwamba alitubu dhambi mbele za Mungu. ‘Kujuta’ huepuka kuingiza maana nzito ya kitheolojia ambayo muktadha haulazimishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi unahifadhi mlingano wa ‘sijuti—ingawa nilijuta’ na mvutano wa kihisia wa matini ya Kigiriki. Alama zote za tanbihi zimewekwa mahali zinapohusika moja kwa moja.
