  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ γὰρ ἐλθόντων ἡμῶν εἰς Μακεδονίαν οὐδεμίαν ⸀ἔσχηκεν ἄνεσιν ἡ σὰρξ ἡμῶν, ἀλλ’ ἐν παντὶ θλιβόμενοι— ἔξωθεν μάχαι, ἔσωθεν φόβοι—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/005.yaml
  text: For even when we came into Macedonia[a], our flesh had no rest, but we were afflicted in every way—conflicts on the outside, fears on the inside—
translation:
  language: sw
  text: Kwa maana hata tulipofika Makedonia, sisi wenyewe hatukupata nafuu hata kidogo,[a] bali tulikuwa katika dhiki kwa kila namna—nje migogoro, ndani hofu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “mwili wetu haukupata nafuu.” Kigiriki husema “mwili/flesh wetu,” usemi unaorejelea hali yetu ya kibinadamu yenye mwili, udhaifu, na dhiki.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ γὰρ
  choice: Kwa maana hata
  rationale: Inaendeleza maelezo ya muktadha uliotangulia huku ikihifadhi msisitizo wa γὰρ pamoja na καί kwa Kiswahili cha kawaida.
- source_word: ἐλθόντων ἡμῶν εἰς Μακεδονίαν
  choice: tulipofika Makedonia
  rationale: Muundo wa genitivi huru una maana ya wakati; 'tulipofika' ni wa asili zaidi kwa Kiswahili kuliko tafsiri ya kimuundo ya 'tulipoingia katika.'
- source_word: οὐδεμίαν ἔσχηκεν ἄνεσιν
  choice: haikupata pumziko lolote
  rationale: ἄνεσις huonyesha pumziko au nafuu kutokana na shinikizo; 'pumziko lolote' huhifadhi picha hiyo kwa lugha inayoeleweka.
- source_word: ἡ σὰρξ ἡμῶν
  choice: miili yetu
  rationale: Hapa σάρξ inarejelea maisha ya kibinadamu yenye mwili, udhaifu na dhiki, si asili ya dhambi. 'Miili yetu' huhifadhi maana halisi bila ukakasi wa 'nyama yetu'; maana ya jumla zaidi imeelezwa katika tanbihi.
- source_word: ἀλλ’ ἐν παντὶ θλιβόμενοι
  choice: bali tuliteswa kwa kila namna
  rationale: θλίβω ina wazo la kukandamizwa au kutiwa katika dhiki. 'Tuliteswa' ni nzito lakini ya kawaida, na 'kwa kila namna' huakisi upana wa ἐν παντί.
- source_word: ἔξωθεν μάχαι
  choice: nje kulikuwa na migogoro
  rationale: μάχαι inaweza kumaanisha mapigano au mabishano; 'migogoro' huhifadhi upana wake bila kudai kwamba yalikuwa mapigano ya silaha.
- source_word: ἔσωθεν φόβοι
  choice: ndani kulikuwa na hofu
  rationale: Huhifadhi ulinganifu wa ἔξωθεν/ἔσωθεν na kutofautisha shinikizo la nje na hofu ya ndani.
theological_decisions:
- issue: Tafsiri ya σάρξ
  choice: miili yetu
  alternative: sisi wenyewe / mwili wetu
  rationale: Katika muktadha huu σάρξ haisemi juu ya upotovu wa kimaadili wala 'asili ya dhambi,' bali juu ya hali dhaifu ya wanadamu wenye mwili. Wingi 'miili yetu' ni wa asili kwa Kiswahili kwa sababu mhusika ni 'sisi,' huku tanbihi ikihifadhi uwezekano wa maana pana ya 'sisi wenyewe.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Ulinganifu wa 'nje ... ndani ...' umehifadhiwa, na vistari virefu vinaonyesha mpangilio wenye mkazo wa sentensi ya Kigiriki.
