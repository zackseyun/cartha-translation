  text: οὐ μόνον δὲ ἐν τῇ παρουσίᾳ αὐτοῦ, ἀλλὰ καὶ ἐν τῇ παρακλήσει ᾗ παρεκλήθη ἐφ’ ὑμῖν, ἀναγγέλλων ἡμῖν τὴν ὑμῶν ἐπιπόθησιν, τὸν ὑμῶν ὀδυρμόν, τὸν ὑμῶν ζῆλον ὑπὲρ ἐμοῦ, ὥστε με μᾶλλον χαρῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/007.yaml
  text: and not only by his coming, but also by the comfort with which he was comforted because of you, as he reported to us your longing, your mourning, and your zeal for me, so that I rejoiced even more.
translation:
  language: sw
  text: wala si kwa kuja kwake tu,[a] bali pia kwa faraja aliyopata[b] kwa sababu yenu. Alipotueleza jinsi mlivyokuwa na shauku, jinsi mlivyohuzunika,[c] na jinsi mlivyokuwa na bidii kwa ajili yangu, nilifurahi hata zaidi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kuwapo kwake.”
    reason: lexical_alternative
  - marker: b
    text: Au “utiaji moyo alioupata.”
    reason: lexical_alternative
  - marker: c
    text: Au “jinsi mlivyoomboleza.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παρουσίᾳ
  choice: kuja kwake
  rationale: Katika muktadha wa safari ya Tito, neno hili linaelekea kumaanisha kuwasili au kuja kwake, si dhana ya kinadharia ya kuwapo.
- source_word: παρακλήσει / παρεκλήθη
  choice: faraja / aliyopata
  rationale: “Faraja” inafaa hali ya kihisia ya kifungu. Muundo wa Kiswahili “faraja aliyopata” ni wa kawaida zaidi kuliko kurudia mzizi kwa namna isiyo ya asili; maana ya kupokea faraja imehifadhiwa.
- source_word: ἐφ’ ὑμῖν
  choice: kwa sababu yenu
  rationale: 'Hapa kirai kinaonyesha msingi au sababu ya faraja ya Tito: mwitikio wa Wakorintho ulimfariji.'
- source_word: ἀναγγέλλων
  choice: Alipotueleza
  rationale: Muundo huu unaonyesha kwamba taarifa ya Tito ndiyo iliyomjulisha Paulo hali yao, huku ukisomeka kwa kawaida katika Kiswahili.
- source_word: ἐπιπόθησιν
  choice: jinsi mlivyokuwa na shauku
  rationale: “Shauku” huonyesha hamu kubwa; muundo wa “jinsi mlivyokuwa” huunganisha kwa asili orodha ya nomino za Kigiriki.
- source_word: ὀδυρμόν
  choice: jinsi mlivyohuzunika
  rationale: Kitenzi hiki kinawasilisha huzuni kubwa inayoweza kuonyeshwa kwa maombolezo, bila kuongeza jambo lisilosemwa wazi na muktadha.
- source_word: ζῆλον
  choice: jinsi mlivyokuwa na bidii
  rationale: “Bidii” hapa huonyesha juhudi na moyo wa dhati unaomlenga Paulo; ni lugha ya kawaida kuliko “ari” katika sentensi hii.
- source_word: ὑπὲρ ἐμοῦ
  choice: kwa ajili yangu
  rationale: 'Tafsiri hii inadumisha upana wa kirai: bidii yao ilikuwa kwa upande wa Paulo au kwa manufaa yake.'
- source_word: ὥστε με μᾶλλον χαρῆναι
  choice: nilifurahi hata zaidi
  rationale: Hii inaonyesha matokeo na inadumisha nguvu ya ulinganisho ya μᾶλλον.
