id: 2CO.7.12
reference: 2 Corinthians 7:12
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἄρα εἰ καὶ ἔγραψα ὑμῖν, οὐχ ⸀ἕνεκεν τοῦ ἀδικήσαντος, ⸀οὐδὲ ⸁ἕνεκεν τοῦ ἀδικηθέντος, ἀλλ’ ⸀1ἕνεκεν τοῦ φανερωθῆναι τὴν σπουδὴν ὑμῶν τὴν ὑπὲρ ἡμῶν πρὸς ὑμᾶς ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/012.yaml
  text: So even if I wrote to you[a], it was not because of the one who did wrong, nor because of the one who was wronged[b], but so that your earnestness for us might be made known among you before God.
translation:
  language: sw
  text: Kwa hiyo, ingawa niliwaandikia, sikuandika kwa sababu ya yule aliyetenda kosa, wala kwa sababu ya yule aliyetendewa kosa, bali ili bidii yenu kwa ajili yetu idhihirike miongoni mwenu mbele za Mungu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati zina, “bali ili bidii yetu kwa ajili yenu idhihirike miongoni mwenu mbele za Mungu.”
    reason: textual_variant
lexical_decisions:
- source_word: ἄρα εἰ καὶ
  choice: Kwa hiyo, ingawa
  rationale: “Kwa hiyo” huonyesha hitimisho linalotokana na muktadha uliotangulia, huku “ingawa” ikihifadhi nguvu ya kukubali jambo katika εἰ καὶ kwa Kiswahili cha kawaida.
- source_word: ἔγραψα ὑμῖν
  choice: niliwaandikia
  rationale: Wakati uliopita unaelekeza kwenye barua ya awali ya Paulo; kiambishi cha watendewa “-wa-” kinawakilisha ὑμῖν kwa ufasaha.
- source_word: οὐχ ἕνεκεν
  choice: sikuandika kwa sababu ya
  rationale: Muundo huu huwasilisha sababu au kusudi la ἕνεκεν kwa Kiswahili kinachoeleweka, huku kitenzi “sikuandika” kikirejeshwa ili sentensi iwe wazi.
- source_word: τοῦ ἀδικήσαντος
  choice: yule aliyetenda kosa
  rationale: Huhifadhi wazo la kitenzi katika participio bila kumtambua mhusika au kuainisha kosa zaidi ya maandishi.
- source_word: τοῦ ἀδικηθέντος
  choice: yule aliyetendewa kosa
  rationale: Huhifadhi hali ya kutendwa na usambamba na “yule aliyetenda kosa.”
- source_word: ἀλλ’ ἕνεκεν τοῦ φανερωθῆναι
  choice: bali ili ... idhihirike
  rationale: “Ili” huonyesha kusudi la muundo wa infinitivi, na “idhihirike” huhifadhi maana ya hali ya kutendwa ya φανερωθῆναι.
- source_word: τὴν σπουδὴν ὑμῶν
  choice: bidii yenu
  rationale: “Bidii” ni neno la kawaida na lenye heshima linaloweza kubeba maana ya juhudi ya dhati, hamu, au kujali sana bila kulazimisha hisia moja tu.
- source_word: τὴν ὑπὲρ ἡμῶν
  choice: kwa ajili yetu
  rationale: Huwasilisha mwelekeo wa bidii hiyo kwa Paulo na wenzake bila kuongeza maelezo yasiyokuwamo.
- source_word: πρὸς ὑμᾶς
  choice: miongoni mwenu
  rationale: Katika kifungu hiki kigumu kisintaksia, tafsiri hii hutoa Kiswahili cha asili na kufuata usomaji wa kwamba bidii yao ilidhihirika katika jumuiya yao, huku utata wa kifungu ukikubaliwa.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: mbele za Mungu
  rationale: Ni usemi wa kawaida, wa heshima, unaohifadhi wazo la uwepo na ushuhuda wa Mungu.
theological_decisions:
- issue: Mhusika mwenye bidii na uhusiano wa “πρὸς ὑμᾶς” katika kifungu kigumu
  choice: “bidii yenu kwa ajili yetu idhihirike miongoni mwenu”
  alternative: “bidii yetu kwa ajili yenu idhihirike miongoni mwenu”
  rationale: Maandishi yaliyochapishwa ya SBLGNT yana ὑμῶν (“yenu”) na ὑπὲρ ἡμῶν (“kwa ajili yetu”). Tafsiri kuu hufuata ushahidi huo moja kwa moja; usomaji mwingine muhimu wa hati umehifadhiwa katika tanbihi badala ya kutatua kimya kimya tofauti hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Usambamba wa “aliyetenda kosa / aliyetendewa kosa” umehifadhiwa, na sentensi imeundwa kwa namna inayoeleweka bila kuficha ugumu wa maandishi ya Kigiriki.
