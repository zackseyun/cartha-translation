lexical_decisions:
- source_word: χαίρω
  choice: Ninafurahi
  rationale: Kitenzi cha wakati uliopo kinaonyesha furaha ya Paulo inayoendelea; “ninafurahi” ni Kiswahili cha kawaida na chenye hadhi.
- source_word: ὅτι
  choice: kwamba
  rationale: Hapa ὅτι kwa kawaida huanzisha maudhui ya furaha ya Paulo, ingawa maana ya kisababishi “kwa sababu” pia inawezekana.
- source_word: ἐν παντί
  choice: katika kila jambo
  rationale: Kirai hiki kina upeo mpana; tafsiri hii ni ya asili kwa Kiswahili na haiubani kuwa namna pekee.
- source_word: θαρρῶ
  choice: nina imani
  rationale: Katika muktadha huu θαρρέω inaeleza kujiamini au kuwa na moyo mkuu kwa habari ya Wakorintho; “nina imani” huonyesha hali thabiti ya sasa.
- source_word: ἐν ὑμῖν
  choice: nanyi
  rationale: Muundo huu huhifadhi mwelekeo wa uhusiano wa ἐν kwa watu, huku ukisikika kwa kawaida katika Kiswahili; maana ya “kuwahusu ninyi” inawezekana pia.
