base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/002.yaml
  text: Make room for us[a]. We have wronged no one, corrupted no one[b], taken advantage of no one.
translation:
  language: sw
  text: Tupeni nafasi[a]. Hatujamkosea mtu yeyote, hatujamharibu mtu yeyote[b], wala hatukumtumia mtu yeyote kwa faida yetu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Tupokeeni” au “Tufungulieni mioyo yenu.” Kwa maana halisi, “Tupeni nafasi.” Huenda usemi huu unaendeleza taswira ya mahusiano katika 6:11–13.
    reason: lexical_alternative
  - marker: b
    text: Au “hatujamfisidi mtu yeyote” au “hatukumwangamiza mtu yeyote.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Χωρήσατε
  choice: Tupeni nafasi mioyoni mwenu
  rationale: Kitenzi hiki ni agizo la wingi linalomaanisha kutoa nafasi. Katika muktadha wa 6:11–13, ombi ni la kukubaliwa tena katika mahusiano na mapenzi yao, si la nafasi ya kimwili. Kutaja mioyo kunafanya taswira hiyo ieleweke kwa Kiswahili cha kawaida, huku tanbihi ikihifadhi usemi wa moja kwa moja zaidi.
- source_word: ἡμᾶς
  choice: -tu- (katika “Tupeni”)
  rationale: Kiwakilishi cha nafsi ya kwanza wingi kimewakilishwa kwa kiambishi cha yambwa -tu-, kikimtaja Paulo pamoja na wenzake.
- source_word: οὐδένα
  choice: mtu yeyote
  rationale: Usemi huu umerudiwa katika kila dai ili kuhifadhi msisitizo wa makanusho matatu ya Paulo.
- source_word: ἠδικήσαμεν
  choice: hatujamkosea
  rationale: Kumkosea mtu ni usemi wa asili na mpana unaowasilisha kutenda isivyo haki au kumdhuru bila kubainisha aina fulani ya kosa.
- source_word: ἐφθείραμεν
  choice: hatujamharibu
  rationale: φθείρω inaweza kumaanisha kuharibu, kufisidi, au kuangamiza. “Kumharibu” huhifadhi upana na ukali wa neno bila kulifanya lihusu uharibifu wa kimaadili pekee.
- source_word: ἐπλεονεκτήσαμεν
  choice: hatujamnufaikia ... kwa hila
  rationale: Kitenzi kinaeleza kujipatia faida kwa kumtumia au kumdanganya mwingine. Usemi huu unaeleweka katika Kiswahili cha sasa na hauzuii maana hiyo kwenye udanganyifu wa kifedha pekee.
theological_decisions:
- issue: Asili ya ombi Χωρήσατε ἡμᾶς
  choice: Ombi la Wakorintho kuwapa Paulo na wenzake nafasi katika mioyo na maisha yao
  alternative: Ombi la jumla la kuwapokea au kuwakaribisha
  rationale: Muktadha wa karibu wa 6:11–13 unazungumzia kufunguka kwa moyo na kupanuka kwa mapenzi. Tafsiri kuu inafafanua taswira hiyo kwa Kiswahili cha kawaida, na tanbihi inaonyesha uwezekano wa tafsiri iliyo karibu zaidi na muundo wa Kigiriki.
- issue: Maana ya ἐφθείραμεν
  choice: Hatujamharibu mtu yeyote
  alternative: Hatujamfisidi au kumdanganya mtu yeyote
  rationale: Neno la Kigiriki lina upeo mpana wa kuharibu au kufisidi. Tafsiri haifungi dai la Paulo kwenye uharibifu wa kiroho, kimaadili, au kifedha pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio wa makanusho matatu umehifadhiwa kwa urari wa kisemantiki; “wala” limetumiwa katika dai la mwisho ili kuonyesha kilele cha orodha. Viashiria [a] na [b] vimewekwa katika maandishi makuu.
