  rationale: Revisions clarify that Paul boasts concerning the Corinthians, improve idiomatic Standard East African Swahili, and preserve the source text’s bold openness, superabundant joy, and coexistence of joy with affliction. The alternatives in the footnotes retain the relevant lexical and syntactic possibilities without resolving them dogmatically.
