source:
  edition: SBLGNT
  text: πολλή μοι παρρησία πρὸς ὑμᾶς, πολλή μοι καύχησις ὑπὲρ ὑμῶν· πεπλήρωμαι τῇ παρακλήσει, ὑπερπερισσεύομαι τῇ χαρᾷ ἐπὶ πάσῃ τῇ θλίψει ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/004.yaml
  text: I have great boldness toward you[a], and great boasting on your behalf. I am filled with encouragement[c][b]; I overflow with joy in all our affliction.
translation:
  language: sw
  text: Nina ujasiri mkubwa wa kusema nanyi[a], na ninajisifu sana juu yenu. Nimejaa faraja[b]; furaha yangu inafurika katikati ya mateso yetu yote[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Ninasema nanyi kwa uwazi mkubwa.” Neno la Kigiriki linaweza pia kumaanisha kujiamini au kusema wazi bila woga.
    reason: lexical_alternative
  - marker: b
    text: Au “kutia moyo.” Neno la Kigiriki linajumuisha faraja na kutiwa moyo.
    reason: lexical_alternative
  - marker: c
    text: Au “licha ya mateso yetu yote.” Kigiriki kinaweza kueleweka kuwa furaha inafurika wakati mateso yanaendelea.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρρησία
  choice: ujasiri
  rationale: Neno hili linaweza kumaanisha ujasiri, kujiamini, au kusema kwa uwazi. “Ujasiri” huhifadhi uzito wa neno huku muktadha wa “kwenu” ukionyesha uwazi wa Paulo kwa Wakorintho.
- source_word: πρὸς ὑμᾶς
  choice: kwenu
  rationale: Hueleza mwelekeo wa kimahusiano wa ujasiri wa Paulo kwa Wakorintho na ni Kiswahili cha kawaida.
- source_word: καύχησις
  choice: ninajisifu
  rationale: Kitenzi cha Kiswahili kinatoa sentensi ya kawaida na kudumisha lugha chanya ya Paulo ya kujisifu kuhusu Wakorintho bila kuipunguza kuwa fahari tu.
- source_word: ὑπὲρ ὑμῶν
  choice: kwa ajili yenu
  rationale: Huhifadhi uwezekano wa maana ya kwa niaba au kwa manufaa yao, ingawa katika muktadha inaweza pia kumaanisha kuwahusu.
- source_word: πεπλήρωμαι
  choice: nimejaa
  rationale: Huwasilisha hali ya sasa iliyotokana na tendo lililotangulia, kama inavyoonyeshwa na kauli timilifu ya Kigiriki.
- source_word: παρακλήσει
  choice: faraja
  rationale: Katika muktadha wa mateso na kuwasili kwa Tito, neno linajumuisha kufarijiwa na kutiwa moyo. “Faraja” ni ya kawaida na inafaa kwa hali ya dhiki.
- source_word: ὑπερπερισσεύομαι
  choice: ninafurika
  rationale: Huhifadhi taswira ya wingi unaozidi sana kwa lugha ya asili na yenye nguvu.
- source_word: χαρᾷ
  choice: furaha
  rationale: Ni tafsiri ya moja kwa moja, ya kawaida, na inayolingana na maana ya χαρά.
- source_word: ἐπὶ πάσῃ τῇ θλίψει ἡμῶν
  choice: katikati ya mateso yetu yote
  rationale: Huweka furaha ndani ya mazingira ya mateso yanayoendelea na kulinda mvutano wa maandiko bila kuifanya iwe furaha baada ya mateso.
- source_word: πολλή ... πολλή
  choice: mkubwa ... sana
  rationale: Kiswahili cha kawaida huhitaji miundo tofauti kulingana na nomino na kitenzi. Maneno haya mawili bado yanahifadhi msisitizo wa wingi katika vifungu vyote viwili.
theological_decisions:
- issue: Kutafsiri matumizi chanya ya Paulo ya καύχησις bila kuingiza maana ya majivuno ya dhambi
  choice: ninajisifu sana kwa ajili yenu
  alternative: ninajivunia sana ninyi
  rationale: “Kujisifu” huhifadhi kwa uwazi zaidi msamiati wa Paulo wa kujisifu, huku “kwa ajili yenu” na muktadha vikionyesha kuwa si kujitukuza kwa ubinafsi.
- issue: Kuhifadhi mvutano kati ya furaha na mateso
  choice: katikati ya mateso yetu yote
  alternative: licha ya mateso yetu yote
  rationale: Kigiriki kinaweza kueleweka kuwa furaha inafurika ndani ya mazingira ya dhiki. “Katikati ya” huhifadhi uwepo wa mambo hayo mawili pamoja badala ya kuyafanya mateso kuwa kizuizi kinachoshindwa tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo unaendeleza msisitizo wa Paulo, taswira ya kufurika, na mvutano kati ya furaha na mateso.
