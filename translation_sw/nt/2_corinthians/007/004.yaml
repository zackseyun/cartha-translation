review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Paul's great boldness/openness, his positive boasting concerning the Corinthians, his being filled with comfort/encouragement, and joy overflowing amid shared affliction. However, “kwa ajili yenu” can suggest that Paul boasts for their benefit rather than that his boasting is about/concerning them (ὑπὲρ ὑμῶν in this context).
  naturalness: Most of the Swahili is clear and idiomatic. “Nina ujasiri mkubwa kwenu” is somewhat compressed and less natural than an explicit relational expression involving speaking; “Nina ujasiri mkubwa wa kusema nanyi” communicates the Greek’s characteristic nuance of frank, bold openness. “Furaha yangu inafurika” is also a more natural Swahili realization of overflowing joy than “ninafurika kwa furaha.”
  terminology: “Faraja,” “furaha,” and “mateso” are appropriate standard East African Swahili terms. “Ninajisifu sana juu yenu” retains the Pauline boasting vocabulary while accurately locating its reference in the Corinthians, without importing a doctrinal judgment about it.
  issues:
  - severity: medium
    issue: “kwa ajili yenu” for ὑπὲρ ὑμῶν
    rationale: This phrase normally means “for your sake/on your behalf” and may imply purpose or benefit. In this context Paul’s boasting is most directly concerning the Corinthians. “Juu yenu” is clearer and natural.
  - severity: low
    issue: Idiomatic expression of παρρησία πρὸς ὑμᾶς
    rationale: “Nina ujasiri mkubwa kwenu” is understandable, but it is not the most natural way to express confident, frank openness directed to people. Adding “wa kusema nanyi” makes the relational sense explicit without materially narrowing the semantic range.
  - severity: low
    issue: Expression of overflowing joy
    rationale: “Ninafurika kwa furaha” is intelligible but less idiomatic. “Furaha yangu inafurika” preserves the intensive overflowing image directly.
  revised_text: Nina ujasiri mkubwa wa kusema nanyi[a], na ninajisifu sana juu yenu. Nimejaa faraja[b]; furaha yangu inafurika katikati ya mateso yetu yote[c].
