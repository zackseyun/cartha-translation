base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/009.yaml
  text: Now I rejoice[a], not because you were grieved, but because you were grieved into a change of mind; for you were grieved according to God[c][b], so that you might suffer no loss from us.
translation:
  language: sw
  text: Sasa ninafurahi, si kwa sababu mlisikitishwa, bali kwa sababu mlisikitishwa hata mkafikia toba. Kwa maana mlisikitishwa kwa jinsi inayopatana na Mungu[a], ili msipate hasara yoyote kutokana na sisi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa jinsi ya kimungu” au “kama Mungu atakavyo.”
    reason: lexical_alternative
  - marker: b
    text: Au, “ili msidhuriwe kwa sababu yetu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν χαίρω
  choice: Sasa ninafurahi
  rationale: Huhifadhi mtazamo wa wakati wa sasa na nguvu ya kitenzi cha Paulo kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: ἐλυπήθητε
  choice: mlisikitishwa
  rationale: Huhifadhi hali ya kutendwa ya kitenzi cha Kigiriki na marudio yake, bila kubainisha isivyohitajika ni nani aliyesababisha huzuni hiyo.
- source_word: εἰς μετάνοιαν
  choice: hata mkafikia toba
  rationale: Neno 'hata' pamoja na 'mkafikia' linaonyesha mwendo kuelekea matokeo; 'toba' hubeba maana ya mabadiliko ya nia yenye uzito wa kimaadili na kiroho katika muktadha huu.
- source_word: κατὰ θεόν
  choice: kwa jinsi inayopatana na Mungu
  rationale: Ni usemi wa asili wa Kiswahili unaohifadhi uhusiano wa huzuni hiyo na Mungu bila kuamua kikamilifu ikiwa maana ni kulingana na kiwango chake, mapenzi yake, au namna ya kimungu.
- source_word: ζημιωθῆτε
  choice: msipate hasara yoyote
  rationale: Huwasilisha wazo la kupata hasara bila kulifanya mahsusi kuwa madhara ya kimwili.
- source_word: ἐξ ἡμῶν
  choice: kutokana nasi
  rationale: Huhifadhi maana ya chanzo au kisababishi inayoweza kuwepo katika ἐξ, kwa Kiswahili kinachoeleweka.
theological_decisions:
- issue: Asili ya huzuni katika κατὰ θεόν
  choice: kwa jinsi inayopatana na Mungu
  alternative: kwa jinsi ya kimungu; kama Mungu atakavyo
  rationale: 'Tafsiri hii inadumisha mvutano wa usemi wa Kigiriki: huzuni hiyo ilikuwa katika uhusiano unaofaa na Mungu, lakini maandishi hayasemi kwa uwazi ikiwa yanasisitiza kiwango chake, mapenzi yake, au namna yake.'
- issue: Maana ya μετάνοια katika muktadha huu
  choice: toba
  alternative: mabadiliko ya nia
  rationale: Katika muktadha huu neno lina maana ya kimaadili na kiroho iliyo pana kuliko mabadiliko ya mawazo pekee; 'toba' ni neno la kawaida na sahihi bila kuingiza mafundisho ya dhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi umewekwa wazi kwa wasomaji wa kawaida huku marudio ya ἐλυπήθητε na utata halisi wa κατὰ θεόν na ἐξ ἡμῶν yakihifadhiwa.
