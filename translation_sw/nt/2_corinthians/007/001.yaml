source:
  edition: SBLGNT
  text: ταύτας οὖν ἔχοντες τὰς ἐπαγγελίας, ἀγαπητοί, καθαρίσωμεν ἑαυτοὺς ἀπὸ παντὸς μολυσμοῦ σαρκὸς καὶ πνεύματος, ἐπιτελοῦντες ἁγιωσύνην ἐν φόβῳ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/001.yaml
  text: Therefore[a], since we have these promises, beloved, let us cleanse ourselves from every defilement of flesh and spirit[c][b], bringing holiness to completion in the fear of God.
translation:
  language: sw
  text: Basi, kwa kuwa tuna ahadi hizi, wapenzi, tujitakase na kila unajisi wa mwili na roho[a], tukikamilisha utakatifu[b] katika kumcha Mungu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kila uchafu wa mwili na roho.”
    reason: lexical_alternative
  - marker: b
    text: Au “tukileta utakatifu kwenye ukamilifu.”
    reason: lexical_alternative
  - marker: c
    text: Hapa “kumcha Mungu” kunamaanisha kicho cha heshima kuu mbele ya Mungu, si hofu tupu.
    reason: lexical_clarification
lexical_decisions:
- source_word: ταύτας ... τὰς ἐπαγγελίας
  choice: ahadi hizi
  rationale: “Ahadi” ni tafsiri ya kawaida na sahihi ya ἐπαγγελία katika maandishi ya Paulo; “hizi” hurejelea hakikisho zilizotangulia.
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Huonyesha hitimisho linalotokana na hoja na manukuu yaliyotangulia.
- source_word: ἀγαπητοί
  choice: wapendwa
  rationale: Hifadhi upendo na uzito wa wito wa Paulo kwa wasomaji.
- source_word: καθαρίσωμεν ἑαυτοὺς
  choice: na tujitakase
  rationale: Muundo huu huwasilisha subjunktivu ya kuhimiza, inayomjumuisha Paulo pamoja na wasomaji wake.
- source_word: ἀπὸ παντὸς μολυσμοῦ
  choice: kutokana na kila unajisi
  rationale: “Unajisi” hubeba maana ya uchafu wa kimaadili au kidini na kuendana na muktadha wa utakatifu.
- source_word: σαρκὸς καὶ πνεύματος
  choice: wa mwili na roho
  rationale: Katika mlinganisho huu, σάρξ huonyesha upande wa kimwili wa mtu, si hasa “asili ya dhambi”; “mwili na roho” ni jozi ya asili na inayoeleweka katika Kiswahili.
- source_word: ἐπιτελοῦντες ἁγιωσύνην
  choice: tukiukamilisha utakatifu
  rationale: Huonyesha kuendeleza utakatifu hadi ufikie lengo lake, huku kishiriki kikieleza tendo linaloandamana na kujitakasa.
- source_word: ἐν φόβῳ θεοῦ
  choice: katika kumcha Mungu
  rationale: “Kumcha Mungu” huhifadhi nahau ya kibiblia na uzito wake, bila kuipunguza kuwa heshima tu.
theological_decisions:
- issue: Maana ya σάρξ katika “unajisi wa mwili na roho”
  choice: mwili
  alternative: nyama; asili ya dhambi
  rationale: Kulinganishwa kwake na “roho” kunaelekeza kwenye vipengele vya nje na vya ndani vya mtu mzima. “Asili ya dhambi” ingeongeza ufafanuzi ambao muktadha haulazimishi.
- issue: Nguvu ya καθαρίσωμεν
  choice: na tujitakase
  alternative: tunapaswa kujitakasa
  rationale: Ni himizo la nafsi ya kwanza wingi, si kauli dhaifu ya wajibu; linamjumuisha mwandishi pamoja na wasomaji.
- issue: Maana ya φόβος θεοῦ
  choice: kumcha Mungu
  alternative: kumheshimu Mungu
  rationale: Usemi huu unahusisha hofu yenye kicho na heshima, lakini neno lenye nguvu “kumcha” linahifadhi mvutano wa nahau ya kibiblia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo “na tujitakase” huhifadhi sauti ya himizo la pamoja, na “kumcha Mungu” huhifadhi uzito wa nahau ya kibiblia.
