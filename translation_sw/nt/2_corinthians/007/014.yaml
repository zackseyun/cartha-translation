id: 2CO.7.14
reference: 2 Corinthians 7:14
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὅτι εἴ τι αὐτῷ ὑπὲρ ὑμῶν κεκαύχημαι, οὐ κατῃσχύνθην, ἀλλ’ ὡς πάντα ἐν ἀληθείᾳ ἐλαλήσαμεν ὑμῖν, οὕτως καὶ ἡ καύχησις ἡμῶν ⸀ἡ ἐπὶ Τίτου ἀλήθεια ἐγενήθη.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/014.yaml
  text: For if I have boasted to him at all about you[a], I was not put to shame; rather, just as we spoke everything to you in truth[b], so also our boasting to Titus proved true.
translation:
  language: sw
  text: Kwa maana, ikiwa nimejisifu kwake hata kidogo kuhusu ninyi, sikuaibishwa. Bali, kama tulivyosema nanyi kila jambo kwa kweli, vivyo hivyo kujisifu kwetu kwa Tito[a] kumethibitika kuwa kweli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kujisifu kwetu mbele ya Tito.” Kirai cha Kigiriki kinaweza kumaanisha kujisifu kulikofanyika kwa Tito au mbele yake; muktadha unaonyesha kwamba Paulo alikuwa amejisifu kwake kuhusu Wakorintho.
    reason: lexical_alternative
lexical_decisions:
- source_word: κεκαύχημαι
  choice: nimejisifu
  rationale: Kitenzi hiki kinadumisha nguvu ya kauli ya Paulo ya kujisifu au kujivunia, bila kuifanya iwe tu ‘kuwa na uhakika.’
- source_word: οὐ κατῃσχύνθην
  choice: sikuaibishwa
  rationale: Kauli ya kutendwa inaonyesha kwamba yale Paulo aliyosema hayakumfanya aonekane kuwa amesema uongo, badala ya kueleza hisia ya ndani tu ya kuona aibu.
- source_word: πάντα ἐν ἀληθείᾳ ἐλαλήσαμεν ὑμῖν
  choice: tulivyowaambia mambo yote kwa kweli
  rationale: Tafsiri hii inahifadhi upana wa πάντα na maana ya ἐν ἀληθείᾳ kama namna ya kusema, huku ikiwa ya kawaida katika Kiswahili.
- source_word: ἡ καύχησις ἡμῶν
  choice: kujisifu kwetu
  rationale: Nomino imetafsiriwa kwa mzizi uleule wa Kiswahili uliotumiwa kwa kitenzi κεκαύχημαι ili kuhifadhi uhusiano wa maneno hayo.
- source_word: ἡ ἐπὶ Τίτου
  choice: mbele ya Tito
  rationale: Hii inafuata kwa karibu maana inayowezekana ya ἐπί pamoja na jenitivi na inahifadhi uwezekano wa kuelewa kujisifu huko kuwa kulifanyika mbele ya Tito; muktadha unaonyesha kwamba kulihusu Wakorintho.
- source_word: ἀλήθεια ἐγενήθη
  choice: kumethibitika kuwa kweli
  rationale: Kauli hii ya Kiswahili inaeleza kwa kawaida kwamba kujisifu kwa Paulo kulionekana kupatana na hali halisi.
- source_word: ὅτι
  choice: Kwa maana
  rationale: Kiunganishi hiki kinaanzisha maelezo yanayounga mstari huu na hoja iliyotangulia.
theological_decisions:
- issue: Asili ya ‘kujisifu’ kwa Paulo
  choice: Kumetafsiriwa kama kujisifu kwa maana ya kutoa sifa au kujivunia kwa uhalali, si lazima kiburi cha dhambi.
  alternative: ‘Kujivunia’ au ‘kuwa na uhakika’ ili kupunguza maana hasi.
  rationale: Katika matumizi ya Paulo, καυχάομαι na καύχησις yanaweza kueleza kujisifu au kujivunia kunakothibitishwa kuwa halali. Muktadha, si neno lililolegezwa, unaonyesha kwamba hapa si kiburi cha dhambi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. ‘Hata kidogo’ huwasilisha εἴ τι kwa namna ya kawaida, na ‘mambo yote’ huhifadhi wigo wa πάντα. Alama ya tanbihi [a] imewekwa moja kwa moja baada ya kirai chenye utata.
