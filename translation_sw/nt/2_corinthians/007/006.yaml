  text: ἀλλ’ ὁ παρακαλῶν τοὺς ταπεινοὺς παρεκάλεσεν ἡμᾶς ὁ θεὸς ἐν τῇ παρουσίᾳ Τίτου·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/006.yaml
  text: But God[a], who comforts the humble[b], comforted us by the coming of Titus.
translation:
  language: sw
  text: Lakini Mungu, ambaye huwafariji wanyenyekevu[a], alitufariji kwa kuwasili kwa Tito[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wanyonge” au “waliovunjika moyo.”
    reason: lexical_alternative
  - marker: b
    text: Au “kwa kuwapo kwa Tito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Lakini
  rationale: Kiunganishi hiki kinaonyesha tofauti na dhiki iliyotajwa kabla yake, na “Lakini” ni ya kawaida na wazi katika Kiswahili.
- source_word: ὁ παρακαλῶν
  choice: ambaye huwafariji
  rationale: Kirai hiki kinamtambulisha Mungu kwa tendo lake la kawaida. “Huwafariji” kinafaa katika muktadha wa dhiki na kinadumisha uhusiano wa kileksika na παρεκάλεσεν.
- source_word: τοὺς ταπεινοὺς
  choice: wanyenyekevu
  rationale: Neno hili linaweza kumaanisha watu wanyenyekevu, walio chini, au waliotiwa chini na hali zao. “Wanyenyekevu” linahifadhi maana pana, huku tanbihi ikionyesha maana nyingine zinazowezekana katika muktadha.
- source_word: παρεκάλεσεν
  choice: alitufariji
  rationale: Kitenzi cha wakati uliopita kinaeleza tendo la Mungu kwa Paulo na wenzake na kurudia mzizi wa maana uliotumiwa katika “huwafariji.”
- source_word: ἐν τῇ παρουσίᾳ
  choice: kwa kuwasili kwa
  rationale: παρουσία linaweza kumaanisha kuja, kuwasili, au kuwapo. Katika muktadha huu, kuwasili kwa Tito ndiko kulikowaletea faraja, hivyo tafsiri hii ni ya asili na inaonyesha tukio hilo.
- source_word: Τίτου
  choice: Tito
  rationale: Hili ni umbo la kawaida la jina hili katika Kiswahili.
- source_word: ὁ θεὸς
  choice: Mungu
  rationale: Mungu ndiye kiima dhahiri na ndiye anayefariji; mpangilio wa Kiswahili unaliweka jina hili kwa njia ya kawaida na yenye msisitizo unaofaa.
theological_decisions:
- issue: Maana ya τοὺς ταπεινοὺς katika muktadha
  choice: wanyenyekevu
  alternative: walioshushwa au waliovunjika moyo
  rationale: Neno la Kigiriki linaweza kuelekeza kwenye unyenyekevu, hali ya kuwa chini, au kuvunjika moyo kwa sababu ya mateso. Matini kuu haifungi maana kwenye hali ya kihisia pekee, na tanbihi inadumisha uwezekano mwingine.
- issue: Maana ya παρουσία kuhusu Tito
  choice: kuwasili kwa Tito
  alternative: kuwapo kwa Tito
  rationale: Muktadha unaunga mkono kuja au kuwasili kwa Tito kama njia ambayo Mungu alileta faraja, lakini maana ya “kuwapo” bado inawezekana na imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya sasa, wazi, na yenye hadhi. Muundo “huwafariji … alitufariji” unahifadhi marudio ya kileksika ya Kigiriki bila kufanya sentensi kuwa ngumu.
