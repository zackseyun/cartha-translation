revisions:
- from: Kwa maana tazameni jinsi huzuni hii hii inayopatana na Mungu[a] ilivyozaa ndani yenu bidii kubwa! Naam, kujitetea[b], kukasirika, kuogopa, kutamani sana, kuwa na juhudi, na kutekeleza haki[c]. Kwa kila njia mlijithibitisha kuwa safi katika jambo hilo.
  to: Kwa maana, tazameni jinsi huzuni hii hii ya kimungu[a] ilivyozaa ndani yenu bidii kubwa! Naam, utetezi[b], ghadhabu, hofu, shauku kubwa, juhudi, na hatua ya kutenda haki[c]. Kwa kila njia mlijithibitisha kuwa safi katika jambo hilo.
  rationale: The revision retains the draft’s faithful overall structure while making the sevenfold response a consistent and rhetorically effective noun series. It sharpens indignation and fear, and renders ἐκδίκησις as corrective action for justice without foreclosing its possible punitive sense, which is retained in the footnote. The footnote at “ya kimungu” preserves the more literal and interpretively cautious rendering of κατὰ θεόν.
