id: 2CO.7.11
reference: 2 Corinthians 7:11
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἰδοὺ γὰρ αὐτὸ τοῦτο τὸ κατὰ θεὸν ⸀λυπηθῆναι πόσην κατειργάσατο ὑμῖν σπουδήν, ἀλλὰ ἀπολογίαν, ἀλλὰ ἀγανάκτησιν, ἀλλὰ φόβον, ἀλλὰ ἐπιπόθησιν, ἀλλὰ ζῆλον, ἀλλὰ ἐκδίκησιν· ἐν παντὶ συνεστήσατε ἑαυτοὺς ἁγνοὺς ⸀εἶναι τῷ πράγματι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/011.yaml
  text: 'For see what earnestness this very grief according to God has produced in you: but also a defense[a], but also indignation, but also fear, but also longing, but also zeal, but also vindication[c][b]. In every way you proved yourselves to be pure in the matter.'
translation:
  language: sw
  text: Kwa maana, tazameni jinsi huzuni hii hii ya kimungu[a] ilivyozaa ndani yenu bidii kubwa! Naam, utetezi[b], ghadhabu, hofu, shauku kubwa, juhudi, na hatua ya kutenda haki[c]. Kwa kila njia mlijithibitisha kuwa safi katika jambo hilo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “huzuni hii hii inayopatana na Mungu,” au “huzuni hii hii inayolingana na mapenzi ya Mungu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kujiondolea tuhuma.”
    reason: lexical_alternative
  - marker: c
    text: Au, “adhabu,” “kulipiza kosa,” au “kuhakikisha haki imetendeka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ γὰρ
  choice: Kwa maana tazameni
  rationale: “Kwa maana” linaonyesha uhusiano wa hoja unaoletwa na γάρ, na “tazameni” linadumisha msisitizo wa ἰδού kwa Kiswahili cha sasa.
- source_word: τὸ κατὰ θεὸν λυπηθῆναι
  choice: huzuni hii hii inayopatana na Mungu
  rationale: Kirai hiki kinahifadhi wazo la huzuni inayolingana na Mungu bila kukifafanua moja kwa moja kuwa hisia tu ya kidini au kukiwekea wazi kitu kisichotajwa kama ‘mapenzi ya Mungu.’
- source_word: πόσην κατειργάσατο ὑμῖν σπουδήν
  choice: ilivyozaa ndani yenu bidii kubwa
  rationale: κατεργάζομαι huonyesha kusababisha matokeo, na σπουδή hapa ni bidii au uzito wa mwitikio wao. “Kuzaa ndani yenu” ni usemi wa kawaida wa Kiswahili unaoonyesha matokeo ya ndani.
- source_word: ἀλλὰ
  choice: Naam
  rationale: Marudio ya ἀλλά katika orodha hii yana nguvu ya kuongeza na kusisitiza badala ya kupinga. “Naam” linaanzisha kwa uzito ushahidi unaofuata bila kuunda upinzani usiokusudiwa.
- source_word: ἀπολογίαν
  choice: kujitetea
  rationale: Neno hili linaonyesha kutoa utetezi au kujiondolea tuhuma. Nomino-tendo “kujitetea” ni ya asili katika orodha ya Kiswahili.
- source_word: ἀγανάκτησιν
  choice: kukasirika
  rationale: Linabeba maana ya ghadhabu au kukerwa sana kwa sababu ya kosa, huku mhusika anayelengwa na hasira hiyo akiachwa wazi kama ilivyo katika Kigiriki.
- source_word: φόβον
  choice: kuogopa
  rationale: Tafsiri ya moja kwa moja inadumisha kutotajwa kwa yule au kile walichoogopa.
- source_word: ἐπιπόθησιν
  choice: kutamani sana
  rationale: Inaonyesha shauku kubwa bila kuongeza wazi kwamba walimtamani Paulo, jambo ambalo muktadha unaweza kudokeza lakini Kigiriki hakilitaji.
- source_word: ζῆλον
  choice: kuwa na juhudi
  rationale: Huwasilisha hamasa yenye nguvu ya kuchukua hatua na inasikika kawaida katika Kiswahili, ingawa inabaki karibu kimaanana na “bidii” ya awali.
- source_word: ἐκδίκησιν
  choice: kutekeleza haki
  rationale: Uchaguzi huu unaonyesha hatua ya kurekebisha kosa na kuhakikisha haki imetendeka bila kudokeza lazima kisasi cha kibinafsi. Maana ya adhabu imehifadhiwa katika tanbihi.
- source_word: ἐν παντὶ συνεστήσατε ἑαυτοὺς
  choice: Kwa kila njia mlijithibitisha
  rationale: συνίστημι hapa ina maana ya kuonyesha au kuthibitisha kwa ushahidi, na ἐν παντί inajumlisha vipengele vyote vilivyotajwa.
- source_word: ἁγνοὺς εἶναι τῷ πράγματι
  choice: kuwa safi katika jambo hilo
  rationale: “Safi” hudumisha sitiari ya ἁγνός na kuepuka kuifanya moja kwa moja kuwa tamko pana la kutokuwa na hatia; “katika jambo hilo” linawekea usafi huo mipaka ya suala linalozungumziwa.
theological_decisions:
- issue: Maana ya κατὰ θεόν
  choice: inayopatana na Mungu
  alternative: ya kimungu; inayolingana na mapenzi ya Mungu
  rationale: Tafsiri iliyochaguliwa inadumisha uhusiano na Mungu kama kipimo au mwelekeo wa huzuni hiyo, lakini haifungi kabisa maana katika ufafanuzi mmoja.
- issue: Nguvu ya ἐκδίκησις katika muktadha wa toba
  choice: kutekeleza haki
  alternative: kuadhibu; kulipiza kisasi
  rationale: Muktadha unaonyesha mwitikio thabiti kwa kosa. “Kutekeleza haki” hudumisha hatua ya kurekebisha jambo bila kuhalalisha kisasi cha kibinafsi, huku uwezekano wa maana ya adhabu ukitajwa katika tanbihi.
- issue: Maana ya kuwa ἁγνούς kuhusiana na jambo hilo
  choice: kuwa safi katika jambo hilo
  alternative: kutokuwa na hatia katika jambo hilo
  rationale: “Safi” linafuata neno la Kigiriki kwa karibu na kudumisha mvutano kati ya usafi wa mwenendo wao na kutohusika kwao na kosa, badala ya kuamua kimya kimya kwamba ni tamko la kisheria pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Orodha imeundwa kwa nomino-tendo ili isomeke kwa urahisi huku ikidumisha mfululizo wenye msisitizo wa Kigiriki. Alama zote za tanbihi zimewekwa mara moja katika sehemu husika ya matini.
