review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the inferential and attention-getting opening, the God-related grief, its effect in producing earnest response, and the concluding demonstration of purity in relation to the matter. The listed responses should, however, more consistently reflect the Greek nominal series; ἀγανάκτησις is better represented by “ghadhabu” than the broad infinitive “kukasirika,” and φόβος by “hofu” rather than “kuogopa.”
  naturalness: The present wording is generally clear Standard East African Swahili, but the mixed verbal forms in the central rhetorical list are less balanced and less forceful than a coordinated noun series. “Huzuni hii hii inayopatana na Mungu” is intelligible, though “huzuni hii hii ya kimungu” is more idiomatic while the footnote retains the more literal alternatives.
  terminology: “Bidii,” “utetezi,” “ghadhabu,” “hofu,” “shauku,” “juhudi,” and “hatua ya kutenda haki” provide a clear, dignified sequence. “Hatua ya kutenda haki” preserves the corrective/disciplinary force of ἐκδίκησις without predetermining personal revenge or reducing it solely to vindication.
  issues:
  - severity: medium
    issue: The central list shifts into several infinitives and uses “kukasirika” for ἀγανάκτησις.
    rationale: The Greek is a rhetorically parallel sequence of nouns. A noun series is more natural and emphatic in this context; “ghadhabu” carries moral indignation more precisely than generic anger.
  - severity: low
    issue: “Kuogopa” is verbal whereas φόβον is nominal.
    rationale: “Hofu” maintains both the source form and the balanced list, without specifying the object of fear.
  - severity: medium
    issue: “Kutekeleza haki” can sound like a general administration of justice and does not clearly retain the responsive, corrective action denoted by ἐκδίκησις.
    rationale: “Hatua ya kutenda haki” better communicates decisive action to set the wrong right while preserving the term’s contextual range in the footnote.
  revised_text: Kwa maana, tazameni jinsi huzuni hii hii ya kimungu[a] ilivyozaa ndani yenu bidii kubwa! Naam, utetezi[b], ghadhabu, hofu, shauku kubwa, juhudi, na hatua ya kutenda haki[c]. Kwa kila njia mlijithibitisha kuwa safi katika jambo hilo.
  revised_footnotes:
  - marker: a
    text: Au, “huzuni hii hii inayopatana na Mungu,” au “huzuni hii hii inayolingana na mapenzi ya Mungu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kujiondolea tuhuma.”
    reason: lexical_alternative
  - marker: c
    text: Au, “adhabu,” “kulipiza kosa,” au “kuhakikisha haki imetendeka.”
    reason: lexical_alternative
  revision_rationale: The revision retains the draft’s faithful overall structure while making the sevenfold response a consistent and rhetorically effective noun series. It sharpens indignation and fear, and renders ἐκδίκησις as corrective action for justice without foreclosing its possible punitive sense, which is retained in the footnote. The footnote at “ya kimungu” preserves the more literal and interpretively cautious rendering of κατὰ θεόν.
