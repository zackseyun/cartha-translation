  terminology: “Kuwahukumu” ni sawa kwa κατάκρισις katika muktadha huu. “Mioyo” huhifadhi taswira ya καρδίαις na haibani maana ya kiteolojia. “Tufe pamoja na kuishi pamoja” huhifadhi usawa wa vitenzi na mshikamano wa pamoja bila kuufafanua kama agano, ndoa, au muungano wa kiteolojia.
