  text: ⸂πρὸς κατάκρισιν οὐ⸃ λέγω, προείρηκα γὰρ ὅτι ἐν ταῖς καρδίαις ἡμῶν ἐστε εἰς τὸ συναποθανεῖν καὶ συζῆν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/003.yaml
  text: I do not say this to condemn you[a], for I have said before that you are in our hearts[b], to die together and to live together.
translation:
  language: sw
  text: Sisemi haya ili kuwahukumu[a], kwa maana nimesema hapo awali kwamba ninyi mko mioyoni mwetu, hivi kwamba tufe pamoja na kuishi pamoja.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa ajili ya hukumu” au “kwa kusudi la kuwahukumu.”
    reason: lexical_alternative
  - marker: b
    text: Au “kwa kufa pamoja na kuishi pamoja.” Kigiriki kinasisitiza mshikamano wa pamoja katika kufa na kuishi.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς κατάκρισιν
  choice: ili kuwahukumu
  rationale: Kirai hiki kinaonyesha kusudi au mwelekeo. Tafsiri hii ni ya kawaida katika Kiswahili na inaweka wazi kwamba maneno ya Paulo hayakusudiwi kuwaletea hukumu.
- source_word: λέγω
  choice: Sisemi hivi
  rationale: Kitenzi cha wakati wa sasa kimetafsiriwa moja kwa moja; neno “hivi” linaonyesha kwamba Paulo anarejelea maneno yake yaliyotangulia.
- source_word: προείρηκα
  choice: nimesema kabla
  rationale: Wakati timilifu unaonyesha jambo lililosemwa awali ambalo bado lina umuhimu wakati huu.
- source_word: ἐν ταῖς καρδίαις ἡμῶν ἐστε
  choice: ninyi mko mioyoni mwetu
  rationale: Inahifadhi wingi wa “mioyo” katika Kigiriki na kueleza upendo wa ndani na mshikamano wa Paulo na wenzake kwa Wakorintho.
- source_word: εἰς τὸ συναποθανεῖν καὶ συζῆν
  choice: kufa pamoja na kuishi pamoja
  rationale: Inahifadhi ulinganifu wa vitenzi na msisitizo wa viambishi συν- juu ya kushiriki kwa mshikamano katika kifo na uzima.
theological_decisions:
- issue: Iwapo maneno “kufa pamoja na kuishi pamoja” yaelezwe wazi kuwa muungano wa agano, ndoa, au muungano katika Kristo
  choice: Kuhifadhi lugha ya mshikamano wa kina bila kuingiza aina maalumu ya kiteolojia
  alternative: Kuyatafsiri kama uaminifu wa agano au ushiriki katika Kristo
  rationale: Mstari unaonyesha upendo na mshikamano mkubwa, lakini wenyewe hautaji wazi aina maalumu ya muungano. Tafsiri haipaswi kuamua zaidi ya ushahidi wa matini.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Mioyoni mwetu” ni usemi wa kawaida unaohifadhi picha ya asili; “kufa pamoja na kuishi pamoja” huhifadhi mpangilio na nguvu ya balagha ya Kigiriki.
