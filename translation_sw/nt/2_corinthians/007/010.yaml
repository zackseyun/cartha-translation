  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἡ γὰρ κατὰ θεὸν λύπη μετάνοιαν εἰς σωτηρίαν ἀμεταμέλητον ⸀ἐργάζεται· ἡ δὲ τοῦ κόσμου λύπη θάνατον κατεργάζεται.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/010.yaml
  text: For godly sorrow produces repentance leading to salvation without regret[b][a], but worldly sorrow produces death.
translation:
  language: sw
  text: Kwa maana huzuni ipatanayo na mapenzi ya Mungu[a] huleta toba isiyojutiwa, inayoongoza kwenye wokovu[b]; lakini huzuni ya ulimwengu huleta kifo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi zaidi, “huzuni kulingana na Mungu” au “huzuni inayopatana na Mungu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “toba inayoongoza kwenye wokovu isiyojutiwa.” Katika Kigiriki, “isiyojutiwa” hueleza “toba”; mpangilio wa maneno unaweza pia kuhusishwa na toba pamoja na mwelekeo wake kuelekea wokovu.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ θεὸν
  choice: iliyo sawasawa na Mungu
  rationale: Kirai hiki kinaonyesha huzuni inayolingana na mapenzi au kipimo cha Mungu. Tafsiri hii ni wazi katika Kiswahili na haiongezi maana ya kidhehebu.
- source_word: λύπη
  choice: huzuni
  rationale: ‘Huzuni’ ni neno la kawaida na lenye heshima linalofaa katika vifungu vyote viwili na kuhifadhi ulinganifu.
- source_word: μετάνοιαν
  choice: toba
  rationale: Katika muktadha huu neno linamaanisha badiliko la kimaadili na kiroho, si kubadili mawazo tu; ‘toba’ ndiyo istilahi ya Kiswahili iliyo wazi na iliyozoeleka.
- source_word: εἰς σωτηρίαν
  choice: inayoongoza kwenye wokovu
  rationale: εἰς huonyesha lengo au matokeo. ‘Inayoongoza kwenye wokovu’ huhifadhi mwelekeo huo bila kufafanua kupita kiasi utaratibu wa wokovu.
- source_word: ἀμεταμέλητον
  choice: isiyojutiwa
  rationale: Kivumishi kinaweza kueleweka kuwa kinaeleza toba moja kwa moja au tukio zima la toba inayoongoza kwenye wokovu. Uwekaji huu unafuata uhusiano wa kisarufi unaowezekana zaidi huku tanbihi ikihifadhi utata.
- source_word: ἐργάζεται
  choice: huleta
  rationale: Kitenzi kina maana ya kutokeza au kusababisha matokeo; ‘huleta’ ni cha asili na kinaeleweka kwa urahisi.
- source_word: τοῦ κόσμου
  choice: ya ulimwengu
  rationale: Tafsiri ya karibu na Kigiriki inayohifadhi tofauti na huzuni iliyo sawasawa na Mungu bila kuibana kuwa huzuni ya kibinadamu tu.
- source_word: θάνατον
  choice: kifo
  rationale: Tafsiri ya moja kwa moja inayohifadhi upana wa maana bila kuamua kama ni kifo cha kimwili, kiroho, au cha mwisho.
- source_word: κατεργάζεται
  choice: huleta
  rationale: Ingawa kitenzi hiki kina kiambishi cha mkazo kuliko ἐργάζεται, hapa maana zake zinafanana; kutumia ‘huleta’ katika vifungu vyote huhifadhi ulinganifu wa balagha.
theological_decisions:
- issue: Tofauti kati ya aina mbili za huzuni
  choice: ‘huzuni iliyo sawasawa na Mungu’ dhidi ya ‘huzuni ya ulimwengu,’ bila kufafanua aina ya kifo
  alternative: Kuitafsiri kama huzuni ya kimungu dhidi ya huzuni ya kibinadamu, au kutaja kifo kuwa cha kiroho pekee
  rationale: Paulo anaweka tofauti kati ya huzuni inayolingana na Mungu na ile ya ulimwengu, lakini hafafanui hapa aina ya ‘kifo.’ Tafsiri inapaswa kuhifadhi upana huo.
- issue: Uhusiano wa toba na wokovu
  choice: ‘toba inayoongoza kwenye wokovu’
  alternative: ‘toba kwa ajili ya wokovu’ au ‘toba inayosababisha wokovu’
  rationale: Maneno yanaonyesha wokovu kama lengo au matokeo bila kueleza kwa namna ya kidhehebu jinsi toba inavyohusiana kiutendaji na wokovu.
- issue: Kitu kinachoelezwa na ἀμεταμέλητον
  choice: Katika maandishi makuu, ‘isiyojutiwa’ inaeleza toba; tanbihi inataja uwezekano wa kueleza mchakato mzima unaoongoza kwenye wokovu
  alternative: 'Kuunganisha moja kwa moja na wokovu: ‘kwenye wokovu usiojutiwa’'
  rationale: Kwa Kigiriki, kivumishi ni cha jinsia ya kiume/uke? ἀμεταμέλητον ni akusativi ya kike? Kwa umbo kinaweza kuhusishwa kwa karibu na μετάνοιαν, huku mpangilio wa maneno ukiruhusu upeo mpana zaidi. Tanbihi huhifadhi utata bila kufanya sentensi kuu kuwa nzito.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imehifadhi ulinganifu wa vifungu viwili kwa kutumia ‘huzuni’ na ‘huleta’ katika pande zote. ‘Toba’ na ‘wokovu’ ni maneno ya kawaida ya kibiblia yanayoeleweka na wasomaji wa kawaida.
