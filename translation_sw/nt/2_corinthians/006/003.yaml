  text: μηδεμίαν ἐν μηδενὶ διδόντες προσκοπήν, ἵνα μὴ μωμηθῇ ἡ διακονία,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/003.yaml
  text: giving no cause for stumbling in anything[a], so that the ministry may not be blamed[b],
translation:
  language: sw
  text: Hatutoi sababu yoyote ya kujikwaa katika jambo lolote[a], ili huduma isilaumiwe[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Hatumkwazi mtu yeyote kwa jambo lolote.”
    reason: lexical_alternative
  - marker: b
    text: Au, “ili huduma isipate sifa mbaya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδεμίαν ... προσκοπήν
  choice: sababu yoyote ya kujikwaa
  rationale: Muundo wa kukataa katika Kigiriki unamaanisha kutotoa hata nafasi moja ya kuwa chanzo cha mtu kujikwaa. Tafsiri hii inadumisha sitiari ya kujikwaa bila kuibana iwe hisia ya kukasirika tu.
- source_word: ἐν μηδενί
  choice: katika jambo lolote
  rationale: Kauli hii inaonyesha upeo mpana wa hali au mambo yanayohusika; Kiswahili hiki ni cha kawaida na kinahifadhi maana hiyo pana.
- source_word: διδόντες
  choice: Hatutoi
  rationale: Ingawa ni kishiriki katika Kigiriki kinachoendeleza sentensi ya muktadha, kitenzi kamili kinafanya mstari huu usomeke kwa kawaida katika Kiswahili huku kikihifadhi maana ya 'kutoa'.
- source_word: ἵνα μὴ
  choice: ili ... isi-
  rationale: Muundo huu unaonyesha kusudi au matokeo yanayokusudiwa kwa Kiswahili cha sasa na kilicho wazi.
- source_word: μωμηθῇ
  choice: isilaumiwe
  rationale: Kitenzi hiki cha kutendwa kina maana ya kulaumiwa au kuonekana kuwa na kosa; 'isilaumiwe' ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: ἡ διακονία
  choice: huduma
  rationale: Katika muktadha huu neno linahusu kazi ya huduma ya Paulo na wenzake. 'Huduma' linafikisha maana hiyo bila kuingiza dhana za baadaye za cheo cha kanisa.
theological_decisions:
- issue: Maana ya διακονία katika kujieleza kwa Paulo
  choice: huduma
  alternative: utumishi
  rationale: Muktadha unahusu jinsi Paulo na wenzake wanavyotekeleza kazi waliyopewa na Mungu. 'Huduma' ni ya kawaida na haifanyi neno hilo kuwa jina la cheo maalumu cha kikanisa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imetumia kitenzi kamili kwa ufasaha wa mstari unaosomwa peke yake, huku uhusiano wake na hoja inayoendelea ukibaki wazi. Alama zote za tanbihi zimewekwa katika matini kuu.
