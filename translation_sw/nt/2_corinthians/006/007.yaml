lexical_decisions:
- source_word: λόγῳ ἀληθείας
  choice: neno la kweli
  rationale: Huhifadhi muundo wa Kigiriki na maana pana ya λόγος, ambayo inaweza kurejelea ujumbe wa kweli au kunena yaliyo ya kweli.
- source_word: δυνάμει θεοῦ
  choice: nguvu za Mungu
  rationale: Ni muundo wa kawaida na wa wazi wa Kiswahili unaohifadhi msisitizo wa kwamba nguvu hizo zinatoka kwa Mungu.
- source_word: διὰ
  choice: kwa
  rationale: Pamoja na hali ya umilikishi, διά hapa huonyesha njia au chombo; “kwa” ni ya asili katika Kiswahili na hudumisha mwendelezo wa orodha.
- source_word: ὅπλων
  choice: silaha
  rationale: ὅπλον inaweza kutaja zana za mashambulizi au za kujilinda; “silaha” haifungi taswira katika upande mmoja tu.
- source_word: δικαιοσύνης
  choice: haki
  rationale: “Haki” ndilo neno la kawaida la Kiswahili kwa δικαιοσύνη na linaweza kujumuisha mwenendo ulio sawa, uadilifu, au haki katika maana ya kutenda yaliyo sawa.
- source_word: τῶν δεξιῶν καὶ ἀριστερῶν
  choice: katika mkono wa kulia na katika mkono wa kushoto
  rationale: Vivumishi vya Kigiriki vimetumiwa kama nomino na vinaacha “mikono” ikieleweka. Kutaja mkono katika Kiswahili hufanya taswira iwe wazi bila kuamua kimyakimya ni silaha ipi ya kushambulia au kujilinda.
theological_decisions:
- issue: Maana ya δικαιοσύνη katika usemi wa Paulo
  choice: haki
  alternative: uadilifu
  rationale: “Haki” huhifadhi upana wa neno la Kigiriki bila kulifunga katika maana ya kisheria au ya kimaadili pekee; uwezekano wa maana ya uadilifu umeelezwa katika tanbihi.
- issue: Taswira ya silaha za mkono wa kulia na wa kushoto
  choice: katika mkono wa kulia na katika mkono wa kushoto
  alternative: za upande wa kulia na wa kushoto
  rationale: Tafsiri iliyochaguliwa inaonyesha utayari kamili lakini haibainishi kwamba mkono mmoja ni wa mashambulizi na mwingine wa ulinzi, jambo ambalo halijasemwa wazi katika Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Marudio ya “kwa” yanahifadhi mdundo wa orodha ya Kigiriki, huku “katika mkono” ikifafanua nomino iliyoachwa kudokezwa katika chanzo.
