lexical_decisions:
- source_word: τὴν δὲ αὐτὴν ἀντιμισθίαν
  choice: Nanyi pia, kama jibu hilohilo
  rationale: Kirai hiki kinadai mwitikio unaolingana na ule ambao Paulo na wenzake wamewaonyesha. “Jibu hilohilo” huwasilisha wazo la kubadilishana kwa usawa bila kudokeza malipo ya fedha; δέ ni kiunganishi hafifu kinachobebwa kwa mtiririko wa sentensi.
- source_word: ὡς τέκνοις λέγω
  choice: nasema nanyi kama watoto
  rationale: Huhifadhi wazi jina “watoto” bila kuongeza kimilikishi “wangu,” ambacho hakimo katika Kigiriki, huku lugha ikibaki ya kawaida katika Kiswahili.
- source_word: πλατύνθητε
  choice: fungukeni kabisa
  rationale: Kitenzi hiki kwa maana halisi ni “panuliweni”; katika muktadha kinamaanisha kuwa wazi kwa upendo na kumpokea Paulo. “Fungukeni kabisa” ni ya asili na haiingizi neno “mioyo” moja kwa moja katika matini.
- source_word: καὶ ὑμεῖς
  choice: Nanyi pia
  rationale: 'Huhifadhi msisitizo wa mwitikio wa pande mbili: wao pia wanapaswa kufanya kama Paulo na wenzake walivyofanya.'
theological_decisions:
- issue: Iwapo usemi wa kifamilia ufanywe kuwa wa kimilikishi
  choice: kama watoto
  alternative: kama watoto wangu
  rationale: Paulo anaongea kwa sauti ya mzazi, lakini hakuna kiwakilishi cha kumiliki katika matini ya Kigiriki; tafsiri haiongezi “wangu.”
- issue: Iwapo kutaja moyo kama kitu kinachofunguliwa
  choice: fungukeni kabisa
  alternative: fungulieni mioyo yenu kabisa
  rationale: Muktadha wa mistari 11–12 unaonyesha uwazi wa upendo na upokeaji, lakini mstari huu wenyewe hautaji “mioyo.” Matini kuu huhifadhi sitiari pana, na tanbihi hufafanua maana.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Mpangilio umefanywa kuwa wa asili katika Kiswahili huku uhusiano wa mwitikio, lugha ya kifamilia, na sitiari ya kupanuliwa vikihifadhiwa.
