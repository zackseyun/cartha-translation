  text: Kwa mwitikio unaolingana—nasema kama kwa watoto—nanyi pia fungukeni.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa malipo yanayolingana,” “kwa urejesho unaolingana,” au “kwa kubadilishana sawasawa.”
