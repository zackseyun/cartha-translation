  text: Our mouth has been opened to you[a], Corinthians[b]; our heart has been widened.
translation:
  language: sw
  text: Kinywa chetu kimefunguka kwenu[a], enyi Wakorintho; moyo wetu umepanuka[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, “Tumewaambia kwa uwazi.”
    reason: lexical_alternative
  - marker: b
    text: Au, “moyo wetu umetanuliwa,” au, “moyo wetu uko wazi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: στόμα
  choice: kinywa
  rationale: Neno hili linahifadhi sitiari halisi ya kiungo cha mwili na ulinganifu wake na “moyo” katika kishazi kinachofuata.
- source_word: ἀνέῳγεν
  choice: kimefunguka
  rationale: Kauli hii inaonyesha hali ya sasa iliyotokana na tendo lililotangulia, huku ikihifadhi picha ya kinywa kilicho wazi. Katika muktadha huu maana yake ni kusema kwa uwazi.
- source_word: πρὸς ὑμᾶς
  choice: kwenu
  rationale: “Kwenu” huonyesha kwamba maneno ya Paulo yameelekezwa kwa wasomaji wake na ni usemi wa kawaida wa Kiswahili katika muktadha huu.
- source_word: Κορίνθιοι
  choice: enyi Wakorintho
  rationale: Hii ni kauli ya moja kwa moja ya kuwaita watu wa Korintho; “enyi” huonyesha wazi matumizi ya mwito kwa Kiswahili.
- source_word: καρδία
  choice: moyo
  rationale: “Moyo” ni tafsiri ya kawaida inayoeleweka kama kitovu cha hisia na hali ya ndani, na inadumisha sitiari ya mwili.
- source_word: πεπλάτυνται
  choice: umepanuka
  rationale: Kitenzi hiki huhifadhi picha ya moyo uliopanuliwa na hali inayodumu kutokana na tendo lililotangulia. Kwa Kiswahili, “umepanuka” ni ya asili zaidi kuliko muundo wa moja kwa moja wa kutendwa.
theological_decisions:
- issue: Sitiari za uwazi wa usemi na upana wa upendo wa Paulo
  choice: Kuhifadhi sitiari za “kinywa” kilichofunguka na “moyo” uliopanuka katika matini kuu.
  alternative: Tumewaambia waziwazi, enyi Wakorintho; tumewafungulia mioyo yetu kabisa.
  rationale: Matini ya Kigiriki inatumia picha mbili za mwili kwa makusudi. Kuzihifadhi kunadumisha nguvu ya usemi wa Paulo bila kuficha maana ya msingi; maana ya kimuktadha inaelezwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa kishairi na sitiari za Kigiriki zimehifadhiwa, huku “enyi Wakorintho” ikifanya mwito wa moja kwa moja uwe wa asili kwa Kiswahili.
