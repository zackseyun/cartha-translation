base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/017.yaml
  text: Therefore[a], come out from among them and be separate, says the Lord, and do not touch what is unclean[c][b]; and I will receive you.
translation:
  language: sw
  text: Kwa hiyo, tokeni miongoni mwao, mkatengwe[a], asema Bwana; wala msiguse kitu kilicho najisi[b][c], nami nitawapokea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mjitenge” au “mkawekwe kando.”
    reason: lexical_alternative
  - marker: b
    text: Au, “msiguse chochote kilicho najisi.”
    reason: lexical_alternative
  - marker: c
    text: Paulo anaunga mwangwi wa lugha ya kinabii ya Agano la Kale, hasa Isaya 52:11.
    reason: cross_reference
lexical_decisions:
- source_word: διὸ
  choice: Kwa hiyo
  rationale: Inaonyesha kwamba agizo hili ni hitimisho linalotokana na hoja iliyotangulia.
- source_word: ἐξέλθατε ἐκ μέσου αὐτῶν
  choice: tokeni katikati yao
  rationale: Inahifadhi agizo la kutoka miongoni mwa kundi hilo kwa Kiswahili cha kawaida na cha moja kwa moja.
- source_word: ἀφορίσθητε
  choice: mjitenge
  rationale: Ni agizo la kujitenga au kuwekwa kando. ‘Mjitenge’ ni la kawaida na lenye kueleweka, huku tanbihi ikihifadhi uwezekano wa maana ya kutengwa au kuwekwa kando.
- source_word: λέγει κύριος
  choice: asema Bwana
  rationale: Inahifadhi mtindo wa kauli ya kinabii na kutafsiri κύριος kwa neno la kawaida la Agano Jipya, ‘Bwana.’
- source_word: ἀκαθάρτου μὴ ἅπτεσθε
  choice: Msiguse kitu kilicho najisi
  rationale: Inahifadhi taswira ya kugusa na maana pana ya kitu kisicho safi bila kubainisha kitu fulani ambacho Kigiriki hakijakitaja.
- source_word: κἀγὼ εἰσδέξομαι ὑμᾶς
  choice: nami nitawapokea
  rationale: Inawakilisha καί + ἐγώ kwa ‘nami’ na kuonyesha mapokezi yenye kibali yanayoahidiwa na msemaji.
theological_decisions:
- issue: Tafsiri ya κύριος katika mwangwi wa maandiko ya Agano la Kale
  choice: Bwana
  alternative: BWANA; Mkuu
  rationale: Ingawa maneno haya yana mwangwi wa maandiko yanayomhusu YHWH, maandishi ya Kigiriki ya Agano Jipya yana κύριος. ‘Bwana’ huhifadhi hilo bila kuingiza umbo la jina la Mungu lisiloandikwa hapa.
- issue: Nguvu na upeo wa agizo la ἀφορίσθητε
  choice: mjitenge
  alternative: mkatengwe; mkawekwe kando
  rationale: Tafsiri inaonyesha wito wa kujitenga na ushirika unaotia unajisi, lakini haiongezi dai kwamba waamini waache mawasiliano yote na watu walio nje ya jumuiya yao.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya usemi wa kinabii lakini kinachoeleweka kwa msomaji wa kawaida. ‘Najisi’ limetumiwa kwa sababu linafaa katika muktadha wa usafi wa kidini na maadili; sentensi zimegawanywa ili zisomeke kwa urahisi bila kupoteza muendelezo wa Kigiriki.
