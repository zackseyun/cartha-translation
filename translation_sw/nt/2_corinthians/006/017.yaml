  source_fidelity: The draft accurately conveys the inferential force, departure from the group, the prohibition on touching the unclean, and the promise of favorable reception. However, “mjitenge” is reflexive/active, whereas ἀφορίσθητε is formally a passive imperative. A passive rendering can preserve this without making the command unnatural.
