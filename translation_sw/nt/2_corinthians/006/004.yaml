source:
  edition: SBLGNT
  text: ἀλλ’ ἐν παντὶ ⸀συνιστάνοντες ἑαυτοὺς ὡς θεοῦ διάκονοι· ἐν ὑπομονῇ πολλῇ, ἐν θλίψεσιν, ἐν ἀνάγκαις, ἐν στενοχωρίαις,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/004.yaml
  text: 'but in everything commending ourselves as God''s servants: in great endurance[a], in afflictions, in hardships, in distresses[c][b],'
translation:
  language: sw
  text: 'Lakini katika kila jambo[a] tunajionyesha kuwa watumishi wa Mungu[b]: katika uvumilivu mwingi, katika dhiki, katika shida, katika hali za kubanwa[c],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa kila namna.” Kirai cha Kiyunani kinaweza kumaanisha katika kila hali au kwa kila namna wanavyojithibitisha.
    reason: lexical_alternative
  - marker: b
    text: Au, “wahudumu wa Mungu.” Neno la Kiyunani linakazia huduma, si lazima cheo rasmi.
    reason: lexical_alternative
  - marker: c
    text: Au, “katika taabu.” Neno hili hueleza hali ya kubanwa sana au kukosa nafasi ya kutoka.
    reason: lexical_clarification
lexical_decisions:
- source_word: ἀλλ’
  choice: Lakini
  rationale: Kiunganishi hiki kinaonyesha tofauti na kauli hasi iliyotangulia na kuanzisha maelezo chanya kuhusu mwenendo wa huduma.
- source_word: ἐν παντί
  choice: katika kila jambo
  rationale: Tafsiri hii inadumisha upana wa kirai cha Kiyunani bila kukifungia ama katika mazingira pekee ama katika namna pekee.
- source_word: συνιστάνοντες ἑαυτούς
  choice: tunajionyesha
  rationale: Katika muktadha huu kitenzi kina maana ya kuonyesha au kuthibitisha utambulisho wao kwa mwenendo wao; ‘tunajionyesha’ ni ya kawaida kwa Kiswahili na haidokezi kujisifu tu.
- source_word: ὡς θεοῦ διάκονοι
  choice: kuwa watumishi wa Mungu
  rationale: διάκονοι hukazia watu wanaomtumikia Mungu. ‘Watumishi’ ni wazi na haikulazimishi maana ya cheo rasmi cha kanisa.
- source_word: ἐν ὑπομονῇ πολλῇ
  choice: kwa uvumilivu mwingi
  rationale: ὑπομονή ni ustahimilivu wa kudumu chini ya majaribu. ‘Kwa’ linaonyesha namna wanavyojionyesha, huku ‘mwingi’ likihifadhi nguvu ya πολλῇ.
- source_word: θλίψεσιν
  choice: katika dhiki
  rationale: ‘Dhiki’ huwasilisha shinikizo na mateso mazito yanayokusudiwa na θλῖψις.
- source_word: ἀνάγκαις
  choice: katika shida
  rationale: Katika orodha hii neno linamaanisha hali ngumu na zenye shinikizo, si mahitaji tu; ‘shida’ ni la kawaida na linaloeleweka.
- source_word: στενοχωρίαις
  choice: katika hali za kusongwa
  rationale: στενοχωρία lina picha ya kubanwa au kukosa njia ya kutokea; kirai hiki kinadumisha picha hiyo na kukitofautisha na ‘dhiki’ na ‘shida.’
theological_decisions:
- issue: Maana ya διάκονοι katika muktadha wa huduma
  choice: watumishi wa Mungu
  alternative: wahudumu wa Mungu
  rationale: Neno linawatambulisha Paulo na wenzake kwa kumtumikia Mungu, bila kulazimisha wazo la cheo rasmi cha kikanisa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa orodha umehifadhiwa kwa urahisi wa usomaji; ‘kwa uvumilivu mwingi’ ni ya asili zaidi katika Kiswahili kwa kueleza namna, huku vipengele vya mateso vikitumia ‘katika.’
