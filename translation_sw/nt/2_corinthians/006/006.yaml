lexical_decisions:
- source_word: ἁγνότητι
  choice: usafi
  rationale: Neno hili linaonyesha usafi au kutokuwa na mawaa kimaadili kwa maana pana; “usafi” halifungi maana kwenye usafi wa kingono pekee.
- source_word: γνώσει
  choice: ujuzi
  rationale: “Ujuzi” linahifadhi maana pana ya kuwa na maarifa na ufahamu, ikiwemo katika huduma.
- source_word: μακροθυμίᾳ
  choice: subira
  rationale: “Subira” ni neno la kawaida na lenye heshima kwa uvumilivu wa kudumu mbele ya watu au hali ngumu.
- source_word: χρηστότητι
  choice: fadhili
  rationale: “Fadhili” linaonyesha wema unaodhihirishwa kwa wengine na tabia ya kutenda kwa upole na ukarimu.
- source_word: πνεύματι ἁγίῳ
  choice: Roho Mtakatifu
  rationale: Katika matumizi ya Paulo, kirai hiki kinaelekea zaidi kumrejelea Roho Mtakatifu wa Mungu; herufi kubwa zinaonyesha rejeo hilo.
- source_word: ἀγάπῃ ἀνυποκρίτῳ
  choice: upendo usio na unafiki
  rationale: Tafsiri hii inahifadhi wazi wazo la upendo usio wa kujifanya au wa kinafiki.
- source_word: ἐν
  choice: kwa / katika
  rationale: “Kwa” linafaa kwa sifa na namna ya kutenda katika orodha hii, huku “katika” likiwa la asili zaidi mbele ya “Roho Mtakatifu”; mabadiliko haya madogo yanadumisha maana bila kufanya Kiswahili kuwa kigumu.
theological_decisions:
- issue: Rejeo la πνεύματι ἁγίῳ
  choice: Roho Mtakatifu wa Mungu
  alternative: roho takatifu, yaani mwelekeo au tabia takatifu ya kibinadamu
  rationale: Matumizi ya kawaida ya Paulo na muktadha yanaunga mkono zaidi rejeo kwa Roho Mtakatifu, lakini muundo wa Kigiriki unaweza pia kueleweka kuwa tabia takatifu; uwezekano huo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Marudio ya “kwa” yanahifadhi mdundo wa orodha ya Kigiriki; “katika” limetumiwa kwa njia ya asili mbele ya “Roho Mtakatifu.”
