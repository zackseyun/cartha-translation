base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/010.yaml
  text: as sorrowful[a], yet always rejoicing; as poor, yet making many rich; as having nothing[b], and yet possessing everything.
translation:
  language: sw
  text: kama tukiwa na huzuni, lakini daima tukifurahi; kama tukiwa maskini, lakini tukiwatajirisha wengi[a]; kama tusio na kitu[b], na bado tukimiliki vitu vyote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “tukiwafanya wengi kuwa matajiri.” Katika muktadha huu, huenda utajiri unaokusudiwa si wa mali bali wa kiroho.
    reason: lexical_alternative
  - marker: b
    text: Yaani, hii ni kauli ya fumbo inayotofautisha kutokuwa na kitu kwa nje na kumiliki vitu vyote; matini haibainishi namna ya umiliki huo.
    reason: cross_reference
lexical_decisions:
- source_word: ὡς
  choice: kama
  rationale: Inahifadhi muundo wa ulinganisho unaorudiwa na Paulo, unaoweka hali inayoonekana kando ya uhalisi unaokinzana nayo.
- source_word: λυπούμενοι
  choice: wenye huzuni
  rationale: Ni Kiswahili cha kawaida na chenye heshima kinachoeleza hali ya kuhuzunika bila kubainisha chanzo chake.
- source_word: ἀεὶ δὲ χαίροντες
  choice: lakini daima tukifurahi
  rationale: “Daima” huhifadhi maana ya wakati, huku “lakini” ikionyesha wazi ukinzani wa fumbo; umbo la “tukifurahi” linaendeleza mtiririko wa vishazi.
- source_word: πτωχοὶ
  choice: maskini
  rationale: Ni tafsiri ya moja kwa moja isiyozidisha maana hadi ufukara wa kupindukia.
- source_word: πολλοὺς δὲ πλουτίζοντες
  choice: lakini tukiwatajirisha wengi
  rationale: Kitenzi πλουτίζω humaanisha kuwafanya wengine wawe matajiri; tafsiri hii haibainishi kuwa utajiri huo ni wa mali au wa kiroho.
- source_word: μηδὲν ἔχοντες
  choice: tusio na kitu
  rationale: Ni usemi wa asili unaohifadhi picha ya kutokuwa na chochote.
- source_word: πάντα κατέχοντες
  choice: tukiwa na vitu vyote
  rationale: Katika muktadha huu κατέχω huonyesha kuwa navyo au kuvihodhi; “tukiwa na vitu vyote” huunda ukinzani wa wazi na “tusio na kitu” bila kuueleza kupita kiasi.
theological_decisions:
- issue: Asili ya utajiri na umiliki katika mafumbo ya Paulo
  choice: Lugha ya utajiri na vitu vyote imeachwa bila kielezi kinachosema wazi kuwa ni vya kiroho.
  alternative: Kutafsiri moja kwa moja kuwa “tukiwatajirisha wengi kiroho” na “tukimiliki vitu vyote katika Kristo.”
  rationale: Muktadha unaweza kuelekeza kwenye utajiri wa kina wa kiroho, lakini Kigiriki hakitumii kielezi hicho. Kuacha mvutano huo katika matini kunahifadhi nguvu ya balagha na kuepuka kuingiza ufafanuzi wa kiteolojia ndani ya tafsiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Marudio ya “kama” na ulinganifu wa vishazi yamehifadhiwa ili kuendeleza mtindo wa mafumbo wa orodha ya Paulo.
