reference: 2 Corinthians 6:9
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὡς ἀγνοούμενοι καὶ ἐπιγινωσκόμενοι, ὡς ἀποθνῄσκοντες καὶ ἰδοὺ ζῶμεν, ὡς παιδευόμενοι καὶ μὴ θανατούμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/009.yaml
  text: as unknown and yet well known[a], as dying and behold, we live, as disciplined and not put to death[b],
translation:
  language: sw
  text: kama watu wasiojulikana lakini wanaotambuliwa[a], kama wanaokufa lakini tazama, tunaishi, kama wanaotiwa nidhamu[b] lakini wasiouawa,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wanaojulikana vizuri”; Kigiriki kinaweza kukazia kutambuliwa kwa hakika, si kuwa maarufu tu.
    reason: lexical_alternative
  - marker: b
    text: Au, “wanaoadhibiwa” au “wanaofundishwa kwa kurekebishwa”; neno la Kigiriki linaweza kumaanisha nidhamu ya kurekebisha au mafunzo ya kumlea mtu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: kama
  rationale: Neno hili linadumisha muundo unaorudiwa wa sifa zinazokinzana katika orodha ya Paulo bila kuamua kwamba ni mwonekano wa nje tu.
- source_word: ἀγνοούμενοι
  choice: watu wasiojulikana
  rationale: Hueleza watu ambao wengine hawawajui au hawawatambui; kauli hii ni fupi na inaandaa ukinzani unaofuata.
- source_word: ἐπιγινωσκόμενοι
  choice: wanaotambuliwa
  rationale: Kitenzi hiki kinaweza kumaanisha kutambuliwa au kujulikana kwa hakika. “Wanaotambuliwa” ni cha kawaida na hakikazii umaarufu usiokusudiwa na maandishi.
- source_word: ἀποθνῄσκοντες
  choice: wanaokufa
  rationale: Huhifadhi hali inayoendelea ya kuwa karibu na kifo na ukinzani wake mkali na “tunaishi,” bila kuichanganya na θανατούμενοι baadaye katika mstari.
- source_word: ἰδοὺ
  choice: tazama
  rationale: Huhifadhi mwito wa ghafla wa kuelekeza uangalifu, kwa lugha yenye hadhi na inayoeleweka.
- source_word: ζῶμεν
  choice: tunaishi
  rationale: 'Wakati uliopo na nafsi ya kwanza wingi vinafuata Kigiriki moja kwa moja na kudumisha ukinzani: wanakufa, lakini wanaishi.'
- source_word: παιδευόμενοι
  choice: wanaotiwa nidhamu
  rationale: Kauli hii inaweza kujumuisha kurekebishwa kwa adhabu au kufundishwa kwa malezi; “kutiwa nidhamu” inadumisha upana huo kuliko “kuadhibiwa” pekee.
- source_word: μὴ θανατούμενοι
  choice: wasiouawa
  rationale: Huhifadhi kauli tendwa na tofauti kati ya mateso makali na kutouawa.
theological_decisions:
- issue: Maana ya παιδευόμενοι kuhusiana na mateso
  choice: wanaotiwa nidhamu
  alternative: wanaoadhibiwa; wanaofundishwa kwa kurekebishwa
  rationale: Chaguo hili linaacha wazi kama nidhamu hiyo ni marekebisho yenye maumivu, malezi, au yote mawili. Halidai kwamba mateso ni adhabu ya Mungu, wala haliondoi uwezekano wa malezi ya kiroho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini cha sasa. Kurudiwa kwa “kama” na ulinganifu wa vishazi kumehifadhiwa ili kudumisha mfululizo wa kauli kinzani wa Paulo. “Tazama” limetumiwa kama mwito wa kifasihi unaoeleweka kwa wasomaji wa kawaida.
