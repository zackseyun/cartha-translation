translation:
  language: sw
  text: Hamzuiliwi na sisi[a], bali mnazuiliwa katika hisia zenu wenyewe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Hamzuiliwi ndani yetu, bali mnazuiliwa katika hisia zenu wenyewe.”
    reason: Huhifadhi kwa ukaribu zaidi kihusishi cha Kigiriki “katika,” ingawa “ndani yetu” kinaweza kuwa na utata kidogo katika Kiswahili cha kawaida.
lexical_decisions:
- source_word: στενοχωρεῖσθε
  choice: mnazuiliwa
  rationale: Kitenzi hiki huonyesha kihalisi kubanwa katika nafasi nyembamba na, kwa maana ya mfano, kuzuiwa au kuwekewa mipaka. “Mnazuiliwa” ni Kiswahili cha kawaida kinachowasilisha maana hiyo ya kimahusiano. Neno lilelile limetumiwa katika sehemu zote mbili ili kuhifadhi ulinganifu wa Paulo.
- source_word: ἐν ἡμῖν
  choice: na sisi
  rationale: Ingawa ἐν kwa kawaida humaanisha “katika,” hapa inaonyesha kwamba Paulo na wenzake si chanzo cha kuzuiliwa kwa Wakorintho. “Na sisi” ni ya asili zaidi katika Kiswahili kuliko tafsiri sisisi “ndani yetu,” ambayo inaweza kuwa isiyo wazi.
- source_word: δὲ
  choice: bali
  rationale: Kiunganishi hiki kinaonyesha utofautishaji mkali kati ya Paulo na hali ya ndani ya Wakorintho. “Bali” kinafaa kwa lugha yenye hadhi na ya sasa.
- source_word: ἐν τοῖς σπλάγχνοις ὑμῶν
  choice: na hisia zenu wenyewe
  rationale: σπλάγχνα humaanisha kihalisi viungo vya ndani, lakini kwa mfano humaanisha hisia za ndani au mapenzi ya moyoni. “Hisia zenu wenyewe” hueleweka kwa urahisi na kukazia kwamba kizuizi kiko ndani yao, si kwa Paulo.
- source_word: οὐ
  choice: ham-
  rationale: Kiambishi cha ukanushi “ham-” katika “Hamzuiliwi” kinakanusha moja kwa moja dai la kwanza.
theological_decisions:
- issue: Maana ya mfano ya σπλάγχνα
  choice: Maneno hayo yametafsiriwa kuwa “hisia zenu wenyewe,” yakirejelea uwezo wao wa ndani wa kuitikia kwa upendo na uwazi.
  alternative: Tafsiri yenye sitiari ya mwili, “mioyoni mwenu,” au ya karibu zaidi na umbo la Kigiriki, “katika viungo vyenu vya ndani.”
  rationale: Muktadha unahusu uhusiano na mwitikio wao kwa Paulo. Tafsiri ya hisia za ndani inaonyesha maana ya mfano bila kuifanya kuwa suala la fikra tu au kuingiza fundisho maalumu la dhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kurudiarudia “hamzuiliwi/mnazuiliwa” umehifadhiwa ili kuonyesha ulinganifu wa balagha katika maandishi ya Kigiriki.
