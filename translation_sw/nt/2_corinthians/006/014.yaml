  to: Msifungwe kwa nira isiyolingana na wasioamini.[a] Kwa maana, kuna ushirika gani kati ya uadilifu[b] na uasi wa sheria? Au nuru ina ushirika gani na giza?
  rationale: Marekebisho pekee ni kusafisha muundo wa kwanza ili sitiari ya kufungwa kwa nira na wasioamini iwe wazi na ya kawaida katika Kiswahili. Maana, ulinganifu wa maswali, istilahi kuu, na tanbihi zimehifadhiwa.
