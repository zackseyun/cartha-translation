id: 2CO.6.14
reference: 2 Corinthians 6:14
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Μὴ γίνεσθε ἑτεροζυγοῦντες ἀπίστοις· τίς γὰρ μετοχὴ δικαιοσύνῃ καὶ ἀνομίᾳ, ⸂ἢ τίς⸃ κοινωνία φωτὶ πρὸς σκότος;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/014.yaml
  text: Do not become unequally yoked with unbelievers[b][a]. For what partnership has righteousness with lawlessness? Or what fellowship has light with darkness?
translation:
  language: sw
  text: Msifungwe kwa nira isiyolingana na wasioamini.[a] Kwa maana, kuna ushirika gani kati ya uadilifu[b] na uasi wa sheria? Au nuru ina ushirika gani na giza?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Usemi “nira isiyolingana” unaleta picha ya wanyama wasiopatana waliofungwa chini ya nira moja; linganisha Kumbukumbu la Torati 22:10.
    reason: cross_reference
  - marker: b
    text: Au “haki” badala ya “uadilifu” (δικαιοσύνῃ).
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ γίνεσθε
  choice: Msifungwe
  rationale: Katazo la wakati uliopo linaelezwa kwa Kiswahili cha kawaida ndani ya sitiari ya nira; muundo huu unazuia kuingia au kuendelea katika kifungo hicho bila kulazimisha tofauti kati ya ‘kuwa’ na ‘kuwa/kuja kuwa’.
- source_word: ἑτεροζυγοῦντες
  choice: nira isiyolingana
  rationale: Huhifadhi picha ya wanyama wasiopatana waliofungwa chini ya nira moja, huku ikiwa wazi kwa msomaji wa Kiswahili.
- source_word: ἀπίστοις
  choice: pamoja na wasioamini
  rationale: Neno hili humaanisha watu wasioamini; ‘pamoja na’ huonyesha uhusiano unaodaiwa na sitiari ya kufungwa nira.
- source_word: μετοχὴ
  choice: ushirika
  rationale: Hueleza kushiriki au kuwa na sehemu pamoja. ‘Ushirika’ ni wa asili katika Kiswahili na unafaa kwa swali la kimahusiano.
- source_word: δικαιοσύνῃ
  choice: uadilifu
  rationale: Katika muktadha huu wa kimaadili unaokinzana na ἀνομία, ‘uadilifu’ huwasilisha hali ya kuwa sawa na kutenda yaliyo sawa; ‘haki’ inahifadhiwa kama uwezekano katika tanbihi.
- source_word: ἀνομίᾳ
  choice: uasi wa sheria
  rationale: Huhifadhi maana ya moja kwa moja ya kutokuwa chini ya sheria au kuipuuza, badala ya kuifanya kuwa ‘uovu’ kwa ujumla.
- source_word: κοινωνία
  choice: ushirika
  rationale: Hueleza kushiriki kwa karibu au kuwa na jambo kwa pamoja; kurudia ‘ushirika’ ni wazi na kwa asili katika Kiswahili.
- source_word: φωτὶ
  choice: nuru
  rationale: Tafsiri ya moja kwa moja huhifadhi sitiari ya Paulo na tofauti yake na giza.
- source_word: πρὸς σκότος
  choice: na giza
  rationale: Ingawa πρός mara nyingi humaanisha ‘kuelekea,’ hapa ‘na’ huonyesha kwa Kiswahili uhusiano unaoulizwa kati ya nuru na giza.
theological_decisions:
- issue: Maana ya δικαιοσύνη katika tofauti ya Kipaulo
  choice: uadilifu
  alternative: haki
  rationale: Tofauti ya kimaadili na ἀνομία inapendelea ‘uadilifu’ katika matini kuu, lakini ‘haki’ ni maana halali ya δικαιοσύνη na imehifadhiwa katika tanbihi bila kubana wigo wa neno.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sitiari ya nira imehifadhiwa na kufafanuliwa katika tanbihi; maswali mawili yamewekwa kwa mtiririko wa kawaida bila kuondoa ulinganifu wa hoja.
