  text: τίς δὲ συμφώνησις ⸀Χριστοῦ πρὸς Βελιάρ, ἢ τίς μερὶς πιστῷ μετὰ ἀπίστου;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/015.yaml
  text: And what harmony is there between Messiah and Beliar? Or what share does a believer have with an unbeliever?[a]
translation:
  language: sw
  text: Tena, kuna upatano gani kati ya Masihi na Beliari?[a] Au mwamini ana sehemu gani pamoja na asiyeamini?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Beliari: Kigiriki Βελιάρ; jina hili pia hujulikana kwa umbo la “Beliali.”'
    reason: alternative_reading
lexical_decisions:
- source_word: συμφώνησις
  choice: upatano
  rationale: Neno hili linaonyesha maafikiano au hali ya kupatana; “upatano” ni Kiswahili cha kawaida na huhifadhi wazo la ulinganifu wa kimahusiano.
- source_word: Χριστοῦ
  choice: Masihi
  rationale: Hapa Χριστός inatumiwa kama cheo katika ulinganisho wa kimawazo na Beliari; “Masihi” huhifadhi nguvu hiyo ya cheo.
- source_word: Βελιάρ
  choice: Beliari
  rationale: Ni jina maalumu; “Beliari” ni unukuzi unaofuata umbo la Kigiriki Βελιάρ na unaendana na matamshi ya Kiswahili.
- source_word: μερίς
  choice: sehemu
  rationale: Neno hili humaanisha fungu au sehemu inayoshirikiwa. Katika swali hili, “ana sehemu gani pamoja na” huwasilisha kwa Kiswahili dhana ya kuwa na ushirika au fungu la pamoja bila kuongeza ufafanuzi.
- source_word: πιστῷ
  choice: mwamini
  rationale: Kivumishi hiki kimetumiwa kama nomino kumaanisha mtu anayeamini; “mwamini” ni tafsiri ya kawaida na wazi.
- source_word: ἀπίστου
  choice: asiyeamini
  rationale: Katika utofautishaji na πιστῷ, neno hili humaanisha mtu asiyeamini. “Asiyeamini” huepuka maana nyingine ya kutokuwa mwaminifu.
- source_word: πρὸς
  choice: kati ya ... na ...
  rationale: Pamoja na συμφώνησις, muundo huu wa Kiswahili unaeleza uhusiano wa pande mbili kwa kawaida.
- source_word: μετὰ
  choice: pamoja na
  rationale: Kihusishi hiki kinaonyesha kuhusiana au kushirikiana; “pamoja na” kinafaa katika usemi wa kuwa na sehemu ya pamoja.
- source_word: δὲ
  choice: Tena
  rationale: δὲ inaendeleza mfululizo wa maswali ya balagha. “Tena” huonyesha mwendelezo huo bila kutia mkazo wa upinzani usiokuwapo.
theological_decisions:
- issue: Tafsiri ya Χριστός
  choice: Masihi
  alternative: Kristo
  rationale: Katika ulinganisho huu na Beliari, Χριστός ina nguvu ya cheo; “Masihi” huhifadhi maana hiyo badala ya kuitumia kama jina.
- issue: Utambulisho wa Βελιάρ
  choice: Beliari kama jina maalumu
  alternative: Beliali
  rationale: Matini kuu inahifadhi umbo la Kigiriki kwa unukuzi bila kuongeza utambulisho wa kifafanuzi. Umbo jingine linalojulikana, “Beliali,” limetajwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Maswali mawili ya balagha na ulinganifu wake yamehifadhiwa; lugha ni nyepesi kueleweka bila kuondoa mvutano wa kiteolojia.
