  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Συνεργοῦντες δὲ καὶ παρακαλοῦμεν μὴ εἰς κενὸν τὴν χάριν τοῦ θεοῦ δέξασθαι ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/001.yaml
  text: Working together with him[a], we also urge you not to receive the grace of God in vain.
translation:
  language: sw
  text: Tukifanya kazi pamoja naye[a], tunawasihi pia msiipokee neema ya Mungu bila matokeo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Tukiwa wafanyakazi wenza, tunawasihi pia.” Kirai cha Kigiriki hakimtaji wazi yule ambaye Paulo anafanya kazi pamoja naye, ingawa muktadha unaelekeza kwa Mungu.
    reason: alternative_reading
lexical_decisions:
- source_word: Συνεργοῦντες
  choice: Tukifanya kazi pamoja naye
  rationale: Kirai hiki kinahifadhi nguvu ya kitenzi cha Kigiriki na kueleza kwa Kiswahili sanifu mshirika anayedokezwa. Muktadha wa 5:18–20 unaelekeza kwa Mungu, lakini kwa kuwa kiwakilishi hakipo wazi katika Kigiriki, jambo hilo linaelezwa pia katika tanbihi.
- source_word: δὲ
  choice: —
  rationale: Hiki ni kiunganishi hafifu cha kuendeleza hoja; kimeingizwa katika mtiririko wa sentensi bila neno maalumu ili Kiswahili kisikike kwa kawaida.
- source_word: καὶ
  choice: pia
  rationale: Neno hili linaongeza tendo la kusihi kwenye tendo la kufanya kazi pamoja.
- source_word: παρακαλοῦμεν
  choice: tunawasihi
  rationale: Kitenzi hiki hapa kinaonyesha ombi la dhati au himizo lenye uzito. 'Tunawasihi' ni la sasa, wazi, na lenye heshima.
- source_word: μὴ
  choice: msi-
  rationale: Kikanushi hiki kimeunganishwa na kitenzi cha Kiswahili katika 'msiipokee'.
- source_word: εἰς κενὸν
  choice: bure
  rationale: Nahau hii humaanisha bila matokeo au bila kutimiza kusudi. 'Bure' ni fupi na ya kawaida, ingawa maana yake hapa si kwamba neema haina gharama bali kwamba isiwe bila matokeo.
- source_word: χάριν
  choice: neema
  rationale: '''Neema'' ni istilahi ya Kiswahili iliyozoeleka na yenye uzito unaofaa kwa tendo na fadhili za Mungu katika matumizi ya Paulo.'
- source_word: τοῦ θεοῦ
  choice: ya Mungu
  rationale: 'Hii inawakilisha moja kwa moja uhusiano wa nomino katika Kigiriki: ''neema ya Mungu''.'
- source_word: δέξασθαι
  choice: kuipokea
  rationale: '''Kupokea'' huonyesha kwa kawaida maana ya kukubali au kupewa kitu; kiambishi ''i'' kinarejelea neema.'
- source_word: ὑμᾶς
  choice: -wa- / msi-
  rationale: Wingi wa 'ninyi' umeonyeshwa ndani ya 'tunawasihi' na 'msiipokee', hivyo hakuna haja ya kuongeza kiwakilishi huru.
theological_decisions:
- issue: Mhusika aliyedokezwa katika ‘kufanya kazi pamoja’
  choice: ‘naye,’ ikimrejelea Mungu kulingana na muktadha
  alternative: ‘Tukiwa wafanyakazi wenza’ bila kutaja mshirika, au Paulo na wenzake wakifanya kazi wao kwa wao
  rationale: Kigiriki hakitaji wazi mshirika, lakini muktadha wa huduma ya upatanisho wa Mungu katika 5:18–20 unamfanya Mungu kuwa mhusika anayewezekana zaidi. Tanbihi inadumisha uwazi kuhusu utata halisi wa kisarufi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa kisasa umetumiwa bila kupunguza uzito wa himizo la Paulo; tanbihi inalinda utata wa maandishi ya Kigiriki.
