  text: λέγει γάρ· Καιρῷ δεκτῷ ἐπήκουσά σου καὶ ἐν ἡμέρᾳ σωτηρίας ἐβοήθησά σοι· ἰδοὺ νῦν καιρὸς εὐπρόσδεκτος, ἰδοὺ νῦν ἡμέρα σωτηρίας·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/002.yaml
  text: For he says[a], “At an acceptable time I listened to you, and in a day of salvation I helped you.” Behold, now is the acceptable time; behold[b], now is the day of salvation.
translation:
  language: sw
  text: Kwa maana asema[a], “Katika wakati unaokubalika nilikusikiliza, na katika siku ya wokovu nilikusaidia.” Tazama, sasa ndio wakati unaokubalika sana; tazama[b], sasa ndio siku ya wokovu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa maana anasema.” Wakati uliopo hapa hutumiwa kutambulisha kauli ya Maandiko kama inayosemwa sasa.
    reason: lexical_alternative
  - marker: b
    text: Katika virai hivi, Kigiriki hakitumii makala. Kiswahili pia hakilazimiki kutofautisha kwa namna ileile kati ya “wakati/siku” na “wakati ule/siku ile”; hivyo usemi haukulazimishi “ule/ile” wala “fulani.”
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει γάρ
  choice: Kwa maana yeye asema
  rationale: γάρ inaeleza na kuunganisha kauli hii na ombi la Paulo; λέγει ni utangulizi wa sasa wa nukuu ya Maandiko, huku msemaji wa kimungu akibaki kuwa nafsi.
- source_word: Καιρῷ δεκτῷ
  choice: Wakati unaokubalika
  rationale: καιρός ni wakati ufaao au uliowekwa, na δεκτός ni unaokubalika au wenye kibali. Usemi huu ni wa kawaida na wenye hadhi katika Kiswahili.
- source_word: ἐπήκουσά σου
  choice: nilikusikiliza
  rationale: Kitenzi kina maana ya kusikia au kusikiliza kwa kukubali na kuitikia; ‘nilikusikiliza’ huhifadhi maana hiyo bila kuongeza wazi wazo la ‘nilijibu.’
- source_word: ἐν ἡμέρᾳ σωτηρίας
  choice: katika siku ya wokovu
  rationale: Kirai hakina kibainishi katika Kigiriki, lakini Kiswahili hakihitaji kutofautisha ‘siku fulani’ na ‘siku hiyo’ kwa mfumo wa vibainishi; tafsiri hii inaacha upeo wake wazi.
- source_word: ἐβοήθησά σοι
  choice: nilikusaidia
  rationale: βοηθέω humaanisha kusaidia au kumjia mtu msaada; ‘nilikusaidia’ ni wazi na ya kawaida.
- source_word: ἰδοὺ
  choice: Tazama
  rationale: Ni chembe ya kuvuta usikivu yenye msisitizo. ‘Tazama’ huhifadhi uzito wa balagha bila kuwa ya kizamani kupita kiasi.
- source_word: καιρὸς εὐπρόσδεκτος
  choice: wakati unaokubalika kabisa
  rationale: εὐπρόσδεκτος ina nguvu zaidi ya kukubalika sana au kuwa yenye kibali kikubwa. ‘Kabisa’ hutofautisha neno hili na δεκτός ya awali huku ikihifadhi uhusiano wa msamiati.
- source_word: ἡμέρα σωτηρίας
  choice: siku ya wokovu
  rationale: Tafsiri ya moja kwa moja na ya asili; kutokuwapo kwa kibainishi katika Kigiriki hakulazimishi ‘siku fulani’ katika Kiswahili.
theological_decisions:
- issue: Uhusiano wa usemi usio na kibainishi na iwapo wakati/siku ni maalumu
  choice: Kutumia ‘wakati unaokubalika’ na ‘siku ya wokovu,’ bila kuongeza ‘fulani’ au maelezo ya kipekee.
  alternative: wakati ule unaokubalika / siku ile ya wokovu; au wakati fulani unaokubalika / siku fulani ya wokovu
  rationale: Kigiriki hakina vibainishi katika virai hivi, lakini Kiswahili hakina mfumo sawa wa a/the. Kuongeza ‘ule/ile’ kungefanya umaalumu kuwa wazi kupita chanzo, na ‘fulani’ kungepunguza uzito wa matumizi ya Paulo kwa wakati wa sasa.
- issue: Mhusika wa λέγει ni Maandiko au Mungu anayesema kupitia Maandiko
  choice: ‘yeye asema,’ ikihifadhi mhusika wa nafsi bila kumtaja moja kwa moja.
  alternative: ‘Maandiko yasema’ au ‘imeandikwa’
  rationale: Nukuu yenyewe ina msemaji wa kimungu. Kutumia nafsi huhifadhi muundo wa Kigiriki na ladha ya kitheolojia bila kuongeza jina lisilopo katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Asema’ na ‘tazama’ hudumisha uzito wa nukuu ya Maandiko; ‘unaokubalika kabisa’ huonyesha nguvu ya εὐπρόσδεκτος kwa lugha ya sasa.
