id: 2CO.6.5
reference: 2 Corinthians 6:5
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐν πληγαῖς, ἐν φυλακαῖς, ἐν ἀκαταστασίαις, ἐν κόποις, ἐν ἀγρυπνίαις, ἐν νηστείαις,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/005.yaml
  text: in beatings, in imprisonments, in riots, in labors, in sleepless nights, in fastings,
translation:
  language: sw
  text: katika kupigwa, katika kufungwa gerezani, katika ghasia, katika taabu, katika kukesha, na katika kufunga;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πληγαῖς
  choice: kupigwa
  rationale: Huwasilisha mapigo au vipigo ambavyo Paulo alivumilia, kwa Kiswahili cha kawaida na cha moja kwa moja.
- source_word: φυλακαῖς
  choice: kufungwa gerezani
  rationale: Katika muktadha huu neno linahusu vifungo gerezani, si majengo ya magereza pekee.
- source_word: ἀκαταστασίαις
  choice: ghasia
  rationale: Neno linaweza kumaanisha machafuko, misukosuko, au ghasia; “ghasia” huhifadhi wazo la hali za vurugu bila kudai kwa lazima uasi uliopangwa.
- source_word: κόποις
  choice: taabu
  rationale: Hujumuisha kazi ngumu yenye kuchosha na mateso yanayoambatana nayo; “taabu” ni fupi na ya asili katika orodha hii.
- source_word: ἀγρυπνίαις
  choice: kukesha
  rationale: Huonyesha vipindi vya kutolala au kukaa macho, iwe kwa hiari au kwa kulazimishwa na hali.
- source_word: νηστείαις
  choice: kufunga
  rationale: Tafsiri ya moja kwa moja inayohifadhi uwezekano wa kufunga kwa hiari; muktadha unaweza pia kuruhusu wazo la kukosa chakula, hivyo halifafanuliwi zaidi katika matini.
theological_decisions:
- issue: Maana ya νηστείαις
  choice: kufunga
  alternative: kukosa chakula
  rationale: “Kufunga” ndilo chaguo la kawaida la kileksia, lakini haisemwi wazi hapa ikiwa ni tendo la kiroho la hiari au njaa iliyosababishwa na hali; tafsiri inaacha mvutano huo bila maelezo ya kidhehebu.
- issue: Maana ya ἀγρυπνίαις
  choice: kukesha
  alternative: kukosa usingizi
  rationale: “Kukesha” huhifadhi hali ya kuwa macho bila kuamua ikiwa ilikuwa nidhamu ya hiari au matokeo ya mateso na mazingira.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Muundo wa kurudia “katika” unadumisha mtindo wa orodha ya Kigiriki; “na” imeongezwa kabla ya kipengele cha mwisho kwa mtiririko wa kawaida wa Kiswahili.
