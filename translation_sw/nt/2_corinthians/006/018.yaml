  text: And I will be a Father to you[a], and you will be sons and daughters to me, says the Lord Almighty.
translation:
  language: sw
  text: “Nami nitakuwa Baba kwenu[a], nanyi mtakuwa wana wangu na binti zangu,” asema Bwana Mwenyezi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata muundo wa Kigiriki kwa karibu zaidi, “nitakuwa kwenu Baba, nanyi mtakuwa kwangu wana na binti.” Kigiriki kinatumia msemo wa agano kueleza uhusiano huu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσομαι ὑμῖν εἰς πατέρα
  choice: nitakuwa Baba kwenu
  rationale: Muundo huu wa agano unaeleza uhusiano. Kiswahili cha kawaida hutumia ‘kuwa Baba kwenu,’ huku herufi kubwa ikionyesha kuwa ‘Baba’ hapa ni cheo cha Mungu.
- source_word: ὑμεῖς ἔσεσθέ μοι
  choice: nanyi mtakuwa ... wangu
  rationale: ‘Nanyi’ huhifadhi msisitizo wa kiwakilishi ὑμεῖς na ulinganifu wa pande mbili; ‘wangu’ huwasilisha kwa Kiswahili cha asili uhusiano unaoonyeshwa na μοι.
- source_word: υἱοὺς καὶ θυγατέρας
  choice: wana wangu wa kiume na wa kike
  rationale: Tafsiri hii inahifadhi kutajwa wazi kwa watoto wa kiume na wa kike badala ya kufupisha kuwa ‘watoto,’ na inaunganika kiasili na ‘wangu.’
- source_word: λέγει
  choice: asema
  rationale: Wakati wa sasa wa tamko la kunukuu maandiko umehifadhiwa kwa ‘asema,’ badala ya wakati uliopita.
- source_word: κύριος παντοκράτωρ
  choice: Bwana Mwenyezi
  rationale: ‘Bwana’ ni tafsiri ya kawaida ya cheo κύριος, na ‘Mwenyezi’ ni cheo cha Kiswahili kinachowasilisha παντοκράτωρ kwa ufupi na uzito unaofaa.
theological_decisions:
- issue: Kuwakilisha wazi wana wa kiume na wa kike katika uhusiano wa kifamilia
  choice: wana wangu wa kiume na wa kike
  alternative: watoto wangu
  rationale: Kigiriki kinataja υἱοὺς na θυγατέρας kwa namna ya wazi. ‘Watoto wangu’ ingekuwa laini zaidi, lakini ingeondoa msisitizo huo wa kujumuisha pande zote mbili.
- issue: Kutafsiri κύριος παντοκράτωρ kama cheo cha Mungu
  choice: Bwana Mwenyezi
  alternative: Bwana, Mwenye nguvu zote
  rationale: ‘Bwana Mwenyezi’ ni usemi mfupi, wenye heshima, na wa kawaida katika Kiswahili; haibadilishi παντοκράτωρ kuwa cheo tofauti kama ‘Bwana wa majeshi.’
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wa heshima na unaosomeka hadharani. ‘Nami ... nanyi’ huhifadhi ulinganifu na msisitizo wa sentensi ya Kigiriki.
