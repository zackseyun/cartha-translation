id: 2CO.6.16
reference: 2 Corinthians 6:16
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: τίς δὲ συγκατάθεσις ναῷ θεοῦ μετὰ εἰδώλων; ⸂ἡμεῖς γὰρ ναὸς θεοῦ ἐσμεν⸃ ζῶντος· καθὼς εἶπεν ὁ θεὸς ὅτι Ἐνοικήσω ἐν αὐτοῖς καὶ ἐμπεριπατήσω, καὶ ἔσομαι αὐτῶν θεός, καὶ αὐτοὶ ἔσονταί ⸀μου λαός.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/016.yaml
  text: 'And what agreement has the temple of God with idols? For we are the temple of the living God[a], just as God said: “I will dwell among them and walk among them, and I will be their God[b], and they will be my people.”'
translation:
  language: sw
  text: 'Hekalu la Mungu lina mapatano gani na sanamu? Kwa maana sisi ni hekalu la Mungu aliye hai, kama Mungu alivyosema: “Nitakaa miongoni mwao[a] na kutembea kati yao; nitakuwa Mungu wao, nao watakuwa watu wangu.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Nitakaa ndani yao.” Kihusishi cha Kigiriki kinaweza kumaanisha “ndani ya” au “miongoni mwa”; hapa muktadha wa agano unaohusu jumuiya unapendelea “miongoni mwao.”
    reason: alternative_reading
lexical_decisions:
- source_word: συγκατάθεσις
  choice: mapatano
  rationale: Neno hili humaanisha makubaliano, ridhaa, au uafikiano. “Mapatano” ni Kiswahili cha kawaida na linafaa katika swali kuhusu kutopatana kwa hekalu la Mungu na sanamu.
- source_word: ναῷ / ναὸς
  choice: hekalu
  rationale: ναός hurejelea hekalu au patakatifu penyewe, si eneo lote la hekalu. “Hekalu” ni neno linaloeleweka na linadumisha nguvu ya sitiari ya kidini.
- source_word: εἰδώλων
  choice: sanamu
  rationale: Katika muktadha huu ni sanamu zinazoabudiwa, wala si picha zisizo na maana ya kidini.
- source_word: ζῶντος
  choice: aliye hai
  rationale: Kirai hiki kinamtambulisha Mungu kuwa hai, kwa kumtofautisha na sanamu zisizo na uhai.
- source_word: καθὼς εἶπεν ὁ θεὸς
  choice: kama Mungu alivyosema
  rationale: Huhifadhi uhusiano wa kulinganisha wa καθώς na wakati wa kitenzi εἶπεν kwa Kiswahili cha asili.
- source_word: Ἐνοικήσω ἐν αὐτοῖς
  choice: Nitakaa miongoni mwao
  rationale: Ingawa ἐν inaweza kumaanisha “ndani ya,” muktadha wa jumuiya ya agano na kitenzi kinachofuata unapendelea “miongoni mwao.”
- source_word: ἐμπεριπατήσω
  choice: kutembea kati yao
  rationale: Huhifadhi taswira hai ya Mungu akiwapo na kutembea katikati ya watu wake.
- source_word: ἔσομαι αὐτῶν θεός
  choice: nitakuwa Mungu wao
  rationale: Hii ni namna ya kawaida na ya asili ya kueleza fomula ya uhusiano wa agano kwa Kiswahili.
- source_word: λαός
  choice: watu
  rationale: Katika fomula ya agano, λαός huonyesha watu wa Mungu kwa pamoja.
theological_decisions:
- issue: Taswira ya jumuiya kuwa hekalu
  choice: sisi ni hekalu la Mungu aliye hai
  alternative: sisi ni hekalu moja la Mungu aliye hai
  rationale: ναὸς isiyo na kibainishi iko katika nafasi ya kiarifu na hapa ina maana ya utambulisho wa jumuiya kwa pamoja; kutotumia “moja” huepuka kuingiza maana isiyolazimishwa na Kigiriki.
- issue: Usemi kuhusu Mungu kukaa pamoja na watu wake
  choice: Nitakaa miongoni mwao
  alternative: Nitakaa ndani yao
  rationale: Wingi wa αὐτοῖς, muktadha wa agano wa kijumuiya, na usemi sambamba wa kutembea kati yao unaunga mkono “miongoni mwao,” huku tanbihi ikihifadhi uwezekano halisi wa “ndani yao.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima, na rahisi kueleweka. Mpangilio wa swali umefanywa wa asili kwa Kiswahili bila kupunguza nguvu yake ya balagha. “Nao” hudumisha mwendelezo wenye hadhi wa nukuu.
