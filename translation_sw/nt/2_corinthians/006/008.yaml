  yaml_path: translation/nt/2_corinthians/006/008.yaml
  text: through honor and dishonor[a], through slander and praise; regarded as deceivers and yet true[c][b],
translation:
  language: sw
  text: katika kuheshimiwa na kuaibishwa,[a] katika kusemwa vibaya na kusemwa vizuri; tukionwa kuwa wadanganyifu, lakini tukiwa wa kweli.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “katika utukufu na fedheha.” Neno la Kigiriki linalotafsiriwa “kuheshimiwa” linaweza pia kumaanisha “utukufu,” lakini hapa yaelekea linahusu heshima mbele ya watu.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “kama wadanganyifu na wa kweli.” Maneno haya yanatofautisha jinsi Paulo na wenzake wanavyoonekana na jinsi walivyo kwa kweli.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ
  choice: katika
  rationale: Pamoja na nomino hizi zinazotaja hali zinazokinzana, neno hili linaonyesha mazingira ambamo huduma inaendelea. Kurudia “katika” kunadumisha muundo wa balagha wa Kigiriki na ni kwa asili zaidi kwa Kiswahili kuliko “kupitia” hapa.
- source_word: δόξης
  choice: kuheshimiwa
  rationale: Katika ulinganifu na ἀτιμίας, maana ya kijamii ya kupata heshima mbele ya watu ndiyo inayotawala, si maana ya kitheolojia ya utukufu.
- source_word: ἀτιμίας
  choice: kuaibishwa
  rationale: Neno hili linaonyesha kukosa heshima au kupata fedheha hadharani. “Kuaibishwa” huunda jozi ya asili na “kuheshimiwa” na pia huonyesha kwamba watumishi wanapokea hali hiyo kutoka kwa wengine.
- source_word: δυσφημίας
  choice: kusemwa vibaya
  rationale: Linahusu maneno mabaya au sifa mbaya zinazoenezwa juu ya mtu. Tafsiri hii ni ya kawaida na haidai katika matini kuu kwamba kila taarifa mbaya ni kashfa ya uongo.
- source_word: εὐφημίας
  choice: kusemwa vizuri
  rationale: 'Ni upande chanya wa δυσφημίας: taarifa au sifa njema kuhusu mtu. Ulinganifu wa “kusemwa vibaya na kusemwa vizuri” unahifadhi jozi ya Kigiriki.'
- source_word: ὡς
  choice: tukionwa kuwa
  rationale: 'Hufanya wazi mtazamo wa wengine unaodokezwa katika muktadha bila kuufanya kuwa ukweli: Paulo na wenzake wanaonekana au wanahesabiwa kuwa wadanganyifu.'
- source_word: πλάνοι
  choice: wadanganyifu
  rationale: Katika muktadha huu neno linamaanisha watu wanaodaiwa kuwapotosha wengine, si wazururaji tu. “Wadanganyifu” linaeleza shtaka hilo kwa uwazi.
- source_word: ἀληθεῖς
  choice: wa kweli
  rationale: Kivumishi hiki kinapingana moja kwa moja na πλάνοι na kinaweza kueleza kwamba wao ni waaminifu, wakweli, au halisi. “Wa kweli” kinadumisha upana huo.
theological_decisions:
- issue: Ikiwa kufafanua kwamba jozi ya mwisho inatofautisha mtazamo wa watu na hali halisi
  choice: “tukionwa kuwa wadanganyifu, lakini tu wa kweli”
  alternative: “kama wadanganyifu, na wa kweli”
  rationale: Neno ὡς pamoja na mfululizo wa jozi zinazofuata linaonyesha jinsi watumishi wanavyotazamwa dhidi ya walivyo kwa kweli. “Tukionwa kuwa” linaweka wazi shtaka la wengine, huku “lakini tu wa kweli” likihifadhi dai la Paulo bila kulifanya shtaka kuwa kweli.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Jozi za vitenzi vya kutendwa zinaonyesha wazi hali ya kijamii inayowapata watumishi na kudumisha mwendo wa kishairi wa orodha. Alama zote za tanbihi zilizotolewa zinaonekana katika matini kuu.
