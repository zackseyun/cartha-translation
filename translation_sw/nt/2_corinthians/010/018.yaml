  yaml_path: translation/nt/2_corinthians/010/018.yaml
  text: For it is not the one who commends himself who is approved[a], but the one whom the Lord commends.
translation:
  language: sw
  text: Kwa maana si yule anayejipendekeza ndiye aliyekubaliwa[a], bali ni yule ambaye Bwana anampendekeza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “anayejisifu” ... “ambaye Bwana anamsifu.” Kitenzi kilekile cha Kigiriki kimetumiwa katika sehemu zote mbili.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνιστάνων / συνίστησιν
  choice: anayejisifu / anamsifu
  rationale: Katika muktadha wa kujisifu na kutathminiwa, kitenzi hiki humaanisha kumsifu au kumpendekeza mtu ili akubalike. Kurudia mzizi wa ‘sifu’ kunahifadhi urudiaji wa kitenzi kilekile cha Kigiriki katika sehemu zote mbili.
- source_word: δόκιμος
  choice: aliyekubaliwa
  rationale: Neno hili humtaja mtu aliyethibitishwa kuwa anafaa baada ya kupimwa au kutathminiwa. ‘Aliyekubaliwa’ linaonyesha kwamba kibali halisi hakitokani na kujisifu mwenyewe.
- source_word: κύριος
  choice: Bwana
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa cheo κύριος. Halibainishi katika matini kuu kama anayelengwa ni Bwana Yesu au Mungu.
- source_word: ἑαυτὸν
  choice: mwenyewe
  rationale: ‘Mwenyewe’ linaonyesha wazi kwamba mtu anajisifu binafsi na linafuata muundo wa umoja wa Kigiriki.
- source_word: ὃν
  choice: yule ambaye
  rationale: Muundo huu unaweka wazi ulinganisho wa Kigiriki kati ya anayejisifu mwenyewe na yule anayesifiwa na Bwana.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Kiunganishi hiki kinaonyesha kwamba mstari huu unaeleza au kuthibitisha hoja iliyotangulia.
theological_decisions:
- issue: Anayelengwa na ‘Bwana’ (ὁ κύριος)
  choice: Bwana
  alternative: Bwana Yesu; Mungu
  rationale: Katika maandishi ya Paulo, ‘Bwana’ mara nyingi humrejelea Yesu, lakini mstari wenyewe unasema κύριος tu. Tafsiri inadumisha kutobainishwa huko badala ya kuongeza utambulisho maalumu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa kawaida kwa wasomaji wengi, huku ulinganisho, urudiaji wa kitenzi cha Kigiriki, na kutobainishwa kwa anayelengwa na ‘Bwana’ vikihifadhiwa.
