  naturalness: «Yule anayejipendekeza ... yule ambaye Bwana anampendekeza» ni Kiswahili sanifu, cha sasa, na kinaweka kwa wazi mlinganisho wa Paulo. Kiambishi -ji- tayari huonyesha «mwenyewe», kwa hiyo kuongeza «mwenyewe» si lazima.
  terminology: «Aliyekubaliwa» ni tafsiri inayokubalika ya δόκιμος katika muktadha huu, na «Bwana» huhifadhi kutobainishwa kwa κύριος. «Kujipendekeza / kumpendekeza» huhifadhi uhusiano wa kileksia wa συνιστάνων na συνίστησιν vizuri zaidi kuliko «kujisifu / kumsifu».
