  - severity: low
    issue: Dokezo la chini linaeleza δόκιμος badala ya kutoa mbadala wa kitenzi kinachorudiwa.
    rationale: Dokezo la ukaguzi wa Kiingereza linaangazia mbadala wa συνίστημι na urudiaji wake. Dokezo la Kiswahili linapaswa kuonyesha mbadala huo na kueleza urudiaji kwa usahihi.
