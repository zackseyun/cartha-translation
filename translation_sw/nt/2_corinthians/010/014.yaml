id: 2CO.10.14
reference: 2 Corinthians 10:14
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οὐ γὰρ ὡς μὴ ἐφικνούμενοι εἰς ὑμᾶς ὑπερεκτείνομεν ἑαυτούς, ἄχρι γὰρ καὶ ὑμῶν ἐφθάσαμεν ἐν τῷ εὐαγγελίῳ τοῦ Χριστοῦ—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/014.yaml
  text: For we are not overextending ourselves[a], as though we had not reached you[c][b], for we came even as far as you with the gospel of Messiah—
translation:
  language: sw
  text: Kwa maana hatujitanui kupita mipaka yetu kana kwamba hatukuwafikia ninyi; kwa maana tulifika hata kwenu tukiwa na injili ya Masihi[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kristo.”
    reason: Tafsiri nyingine ya cheo Χριστός inayotumiwa sana katika Kiswahili.
lexical_decisions:
- source_word: ὑπερεκτείνομεν ἑαυτούς
  choice: hatujitanui kupita mipaka yetu
  rationale: Kauli hii inadumisha sitiari ya kujinyoosha au kujitanua kupita mpaka unaofaa, huku ikisomeka kwa njia ya kawaida katika Kiswahili cha sasa.
- source_word: ὡς μὴ ἐφικνούμενοι εἰς ὑμᾶς
  choice: kana kwamba hatukuwafikia ninyi
  rationale: Kirai hiki kinaonyesha hali ya kudhaniwa ambayo ingeifanya huduma ya Paulo ionekane kuwa imevuka mipaka yake. Wakati uliopita unafaa katika muktadha kwa sababu Wakorintho walikuwa tayari wamefikiwa.
- source_word: ἄχρι ... καὶ ὑμῶν
  choice: hata kwenu
  rationale: Neno “hata” linahifadhi msisitizo wa καί kwamba huduma yao ilienea mpaka kwa Wakorintho wenyewe.
- source_word: ἐφθάσαμεν
  choice: tulifika
  rationale: Kitenzi hiki kinaeleza tendo lililotimia la kufika kwao Korintho na kinaepusha kurudia “kuwafikia” kwa namna isiyo ya lazima.
- source_word: ἐν τῷ εὐαγγελίῳ
  choice: tukiwa na injili
  rationale: Hii inaonyesha kwamba walifika wakiwa wameleta na kutangaza injili, na ni ya asili zaidi katika Kiswahili kuliko tafsiri ya moja kwa moja “katika injili”.
- source_word: τοῦ Χριστοῦ
  choice: ya Masihi
  rationale: Χριστός hapa bado inafanya kazi kama cheo cha yule aliyeahidiwa; “Masihi” huhifadhi maana hiyo waziwazi.
theological_decisions:
- issue: Tafsiri ya Χριστοῦ
  choice: Masihi
  alternative: Kristo
  rationale: Katika kirai “injili ya Masihi,” cheo cha kimasiya kinaendelea kuwa na uzito wa maana. “Kristo” pia ni tafsiri ya kawaida, kwa hiyo imetajwa katika tanbihi bila kubadili maana ya msingi.
- issue: Uhusiano wa injili na Masihi katika τοῦ Χριστοῦ
  choice: injili ya Masihi
  alternative: injili kuhusu Masihi
  rationale: Genitivi ya Kigiriki inaweza kuonyesha injili inayomhusu Masihi au iliyo yake. Kiswahili “ya Masihi” kinahifadhi upana huo badala ya kuamua uhusiano mmoja pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sitiari ya kuvuka mipaka imehifadhiwa kwa lugha inayoeleweka, na alama ya mwisho inaonyesha kuwa sentensi inaendelea katika mstari unaofuata.
