  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Οὐ γὰρ τολμῶμεν ἐγκρῖναι ἢ συγκρῖναι ἑαυτούς τισιν τῶν ἑαυτοὺς συνιστανόντων· ἀλλὰ αὐτοὶ ἐν ἑαυτοῖς ἑαυτοὺς μετροῦντες καὶ συγκρίνοντες ἑαυτοὺς ἑαυτοῖς οὐ συνιᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/012.yaml
  text: For we do not dare to classify or compare ourselves with some of those who commend themselves[a]. But when they measure themselves by themselves and compare themselves with themselves[b], they do not understand.
translation:
  language: sw
  text: Kwa maana hatuthubutu kujihesabu kuwa miongoni mwa baadhi ya wale wanaojipa sifa wenyewe[a], wala kujilinganisha nao. Lakini wao wanapojipima kwao wenyewe na kujilinganisha wao kwa wao[b], hawaelewi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kujiweka katika kundi moja na” au “kujiweka katika daraja moja na”; kitenzi cha Kigiriki kina wazo la mtu kujiweka katika kundi lilelile la wengine.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “wakijipima ndani yao wenyewe na kujilinganisha wao wenyewe na wao wenyewe.” Maana yake ni kwamba wanajitumia wao wenyewe kuwa kipimo chao.
    reason: lexical_alternative
lexical_decisions:
- source_word: τολμῶμεν
  choice: hatuthubutu
  rationale: Neno hili linaonyesha kutodiriki au kukataa kufanya jambo kwa majivuno; “hatuthubutu” ni la kawaida na linahifadhi kejeli ya Paulo.
- source_word: ἐγκρῖναι
  choice: kujihesabu kuwa miongoni mwa
  rationale: Katika muktadha huu kitenzi kinamaanisha kujiweka katika kundi au daraja moja na wengine, si kutoa hukumu ya kimaadili.
- source_word: συγκρῖναι / συγκρίνοντες
  choice: kujikilinganisha nao / kujilinganisha wao kwa wao
  rationale: “Kulinganisha” hutoa maana ya kawaida ya kitenzi na kuhifadhi urudiaji wa balagha katika aya.
- source_word: ἑαυτούς τισιν τῶν ἑαυτοὺς συνιστανόντων
  choice: na baadhi ya wale wanaojisifu wenyewe
  rationale: Hapa συνιστάνω ina maana ya kujipendekeza au kujitolea ushuhuda mzuri; “wanaojisifu wenyewe” linaendeleza mada ya kujisifu katika kifungu hiki.
- source_word: ἀλλὰ αὐτοὶ
  choice: Lakini wao
  rationale: Kiwakilishi kimekazwa katika Kigiriki; kutaja “wao” wazi kunahifadhi tofauti kati yao na Paulo pamoja na wenzake.
- source_word: ἐν ἑαυτοῖς
  choice: kwa wao wenyewe
  rationale: Kauli hii inahifadhi uwezekano wa maana ya kujitumia kama kipimo, huku tanbihi ikieleza muundo wa Kigiriki na maana yake katika muktadha.
- source_word: μετροῦντες
  choice: wanapojipima
  rationale: “Kupima” huhifadhi sitiari ya kutumia kipimo katika kujitathmini.
- source_word: ἑαυτοὺς ἑαυτοῖς
  choice: kujikilinganisha wao kwa wao
  rationale: Muundo huu wa Kiswahili huhifadhi msisitizo wa kujilinganisha ndani ya kundi lao wenyewe bila kuufanya mstari kuwa mgumu kupita kiasi.
- source_word: οὐ συνιᾶσιν
  choice: hawaelewi
  rationale: Ni tafsiri ya moja kwa moja, ya kawaida na inayoacha kitu wasichokielewa kuwa cha kudokezwa kama kilivyo katika Kigiriki.
