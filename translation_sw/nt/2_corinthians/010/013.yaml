  text: ἡμεῖς δὲ ⸀οὐκ εἰς τὰ ἄμετρα καυχησόμεθα, ἀλλὰ κατὰ τὸ μέτρον τοῦ κανόνος οὗ ἐμέρισεν ἡμῖν ὁ θεὸς μέτρου, ἐφικέσθαι ἄχρι καὶ ὑμῶν—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/013.yaml
  text: But we will not boast beyond measure[a], but according to the measure of the sphere that God assigned to us—a measure that reaches even to you—
translation:
  language: sw
  text: Lakini sisi hatutajisifu kupita mipaka,[a] bali kwa kadiri ya kipimo cha eneo ambalo Mungu alitugawia—kipimo kinachofika hata kwenu—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “bila kipimo.” Neno la Kigiriki linaonyesha kuvuka kipimo au mipaka inayofaa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄμετρα
  choice: kupita mipaka
  rationale: Katika msemo huu neno hilo linaonyesha kuvuka mipaka inayofaa, huku likihifadhi taswira ya kipimo na mipaka.
- source_word: καυχησόμεθα
  choice: h tutajisifu
  rationale: Kitenzi hiki kinamaanisha kujisifu au kudai sifa katika muktadha wa mabishano; ‘kujisifu’ ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: κατὰ τὸ μέτρον
  choice: kwa kadiri ya
  rationale: Hutoa maana ya kujiweka ndani ya kipimo au mpaka uliowekwa, kwa Kiswahili cha kawaida.
- source_word: κανόνος
  choice: eneo
  rationale: Katika muktadha huu neno linaelekea kumaanisha eneo la huduma lililopimwa au kugawiwa, ingawa pia linaweza kumaanisha kanuni, kiwango, au kifaa cha kupimia.
- source_word: οὗ ἐμέρισεν ἡμῖν ὁ θεὸς μέτρου
  choice: ambalo Mungu alitupimia
  rationale: Huwasilisha wazo la Mungu kuwagawia au kuwawekea eneo lenye kipimo, na pia hudumisha mzizi wa taswira ya kupima.
- source_word: ἐφικέσθαι
  choice: kinachofika
  rationale: Hueleza ukubwa au mweneo wa eneo walilopewa kwa njia ya asili katika Kiswahili.
- source_word: ἄχρι καὶ ὑμῶν
  choice: hata kwenu
  rationale: Huhifadhi maana ya mweneo pamoja na msisitizo wa καί kwamba Wakorintho pia wamo ndani ya eneo hilo.
theological_decisions:
- issue: Maana ya κανών katika dai la Paulo kuhusu huduma
  choice: Eneo la huduma lililopimwa na Mungu na linalowajumuisha Wakorintho
  alternative: Kanuni au kiwango ambacho Paulo anatumia kupimia kujisifu kwake
  rationale: Muktadha wa karibu unasisitiza kipimo, mipaka, ugawaji, na kufika hadi kwa Wakorintho. Hata hivyo, tanbihi inadumisha uwezekano wa maana nyingine za neno hilo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo unahifadhi taswira zinazoingiliana za kipimo, eneo, na kufika, bila kuifanya κανών kuwa istilahi ya kimadhehebu.
