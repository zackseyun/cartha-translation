base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/005.yaml
  text: and every lofty thing raised up against the knowledge of God[a], and taking every thought captive into obedience to Messiah[b],
translation:
  language: sw
  text: na kila kitu kilichoinuka dhidi ya maarifa ya Mungu[a], na tukiteka kila fikira ili imtii Masihi[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kila kitu cha juu” au “kila dai la majivuno” badala ya “kila kitu kilichoinuka.”
    reason: lexical_alternative
  - marker: b
    text: Kigiriki, “Masihi”; kwa mapokeo, “Kristo.”
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶν ὕψωμα
  choice: kila kitu kilichoinuka
  rationale: Huhifadhi picha ya kitu kilichoinuliwa au kujikweza bila kukifasiri kwa upana mdogo kama dai la majivuno pekee. “Kila” huonyesha nguvu ya mgawanyo ya πᾶν.
- source_word: ἐπαιρόμενον
  choice: kilichoinuka
  rationale: Huwasilisha hali ya kuinuliwa katika picha hii, bila kulazimisha maana ya kujikweza yenyewe ambayo umbo la Kigiriki halidai.
- source_word: κατὰ τῆς γνώσεως τοῦ θεοῦ
  choice: dhidi ya maarifa ya Mungu
  rationale: “Maarifa” hufuata γνῶσις, na kirai “ya Mungu” huhifadhi ufupi na uwezekano wa maana wa kirai cha Kigiriki kuliko kukibana kuwa “kumjua Mungu” pekee.
- source_word: αἰχμαλωτίζοντες
  choice: tukiteka
  rationale: Huhifadhi sitiari ya kijeshi ya kuwakamata watu kuwa mateka na pia muundo wa kitenzi tegemezi unaounganisha kifungu hiki na muktadha uliotangulia.
- source_word: πᾶν νόημα
  choice: kila fikira
  rationale: “Fikira” ni neno la kawaida na lenye hadhi kwa wazo au tendo la akili; “kila” huhifadhi matumizi ya mgawanyo ya πᾶν.
- source_word: εἰς τὴν ὑπακοὴν
  choice: ili imtii
  rationale: Hutoa kwa Kiswahili cha kawaida mwelekeo kuelekea hali ya utii unaoonyeshwa na εἰς, bila kutumia kirai kisicho asilia kama “ndani ya utii.”
- source_word: τοῦ Χριστοῦ
  choice: Masihi
  rationale: Χριστός hapa inafanya kazi kama cheo; “Masihi” huhifadhi maana ya cheo hicho badala ya kukitumia tu kama jina lililohamishwa.
theological_decisions:
- issue: Namna ya kutafsiri Χριστοῦ
  choice: Masihi
  alternative: Kristo
  rationale: Katika muktadha huu neno hilo ni cheo cha Yesu. “Masihi” huwasilisha maana ya cheo, huku “Kristo” ikitajwa katika tanbihi kama tafsiri ya kimapokeo.
- issue: Asili ya upinzani katika πᾶν ὕψωμα ἐπαιρόμενον
  choice: kila kitu kilichoinuka
  alternative: kila dai la majivuno linalojiinua
  rationale: Kigiriki kina picha pana ya kitu kilichoinuliwa dhidi ya maarifa ya Mungu. Tafsiri haifungi maana katika madai ya kiburi au hoja pekee.
- issue: Maana ya τοῦ θεοῦ pamoja na γνώσεως
  choice: maarifa ya Mungu
  alternative: kumjua Mungu
  rationale: Kirai cha Kiswahili huhifadhi kwa kiasi fulani uwezekano wa uhusiano wa umilikaji, chanzo, au lengo katika kirai kifupi cha Kigiriki badala ya kuamua kimya kwamba ni tendo la wanadamu la kumjua Mungu tu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa “tukiteka” unaonyesha kwamba kifungu hiki kinaendelea kutoka sentensi iliyotangulia. Alama zote za tanbihi zimewekwa katika matini kuu.
