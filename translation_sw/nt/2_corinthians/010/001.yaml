source:
  edition: SBLGNT
  text: Αὐτὸς δὲ ἐγὼ Παῦλος παρακαλῶ ὑμᾶς διὰ τῆς πραΰτητος καὶ ἐπιεικείας τοῦ Χριστοῦ, ὃς κατὰ πρόσωπον μὲν ταπεινὸς ἐν ὑμῖν, ἀπὼν δὲ θαρρῶ εἰς ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/001.yaml
  text: I myself[a], Paul, appeal to you by the meekness and gentleness of Messiah—I who am humble face to face among you[c][b], but bold toward you when absent.
translation:
  language: sw
  text: Mimi mwenyewe, Paulo, ninawasihi kwa unyenyekevu na upole wa Masihi[a]—mimi ambaye ni mnyenyekevu nikiwa ana kwa ana kati yenu[b][c], lakini nikiwa mbali ninawathubutu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Kristo.” Neno la Kiyunani Χριστός ni cheo chenye maana ya “Masihi.”
    reason: alternative_reading
  - marker: b
    text: Kwa maana halisi, “kulingana na uso”; yaani, “ana kwa ana” au “ninapokuwa pamoja nanyi.”
    reason: lexical_alternative
  - marker: c
    text: “Mnyenyekevu” huenda ni muhtasari wa kejeli wa yale ambayo baadhi ya watu walisema kuhusu Paulo alipokuwapo; pia linaweza kutafsiriwa “wa hali ya chini,” au, kwa tafsiri yenye ufafanuzi zaidi, “mwoga.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτὸς δὲ ἐγὼ Παῦλος
  choice: Mimi mwenyewe, Paulo
  rationale: Kiima kilichosisitizwa pamoja na jina la Paulo kinahifadhiwa kwa mpangilio wa kawaida wa Kiswahili. δέ haijatafsiriwa kwa neno la wakati; hapa inaashiria mpito au tofauti nyepesi ambayo muktadha unaibeba.
- source_word: παρακαλῶ ὑμᾶς
  choice: ninawasihi
  rationale: Kitenzi hiki hapa ni ombi la dhati la kibinafsi, si amri; “ninawasihi” ni cha kawaida na huhifadhi uzito wa ombi.
- source_word: διὰ τῆς πραΰτητος καὶ ἐπιεικείας
  choice: kwa upole na ustahimilivu
  rationale: διά pamoja na umilikishi huonyesha msingi au njia ya ombi. “Upole” huwasilisha πραΰτης, na “ustahimilivu” huonyesha ἐπιείκεια kama tabia ya kutolazimisha haki kwa ukali, huku tofauti ya maneno hayo mawili ikihifadhiwa.
- source_word: τοῦ Χριστοῦ
  choice: wa Masihi
  rationale: Χριστός hapa inafanya kazi kama cheo; “Masihi” hutafsiri maana ya cheo hicho badala ya kukifanya jina tu.
- source_word: κατὰ πρόσωπον
  choice: nikiwa uso kwa uso
  rationale: Usemi halisi “kwa mujibu wa uso” humaanisha kuwapo ana kwa ana hapa, kinyume na kutokuwapo baadaye katika mstari.
- source_word: ταπεινὸς
  choice: mnyenyekevu
  rationale: Neno hili linaweza kumaanisha mnyenyekevu au wa hali ya chini, na huenda linarejelea kwa kejeli madai ya wengine kumhusu Paulo. Tafsiri hii haiongezi maana ya “mwoga.”
- source_word: ἐν ὑμῖν
  choice: kati yenu
  rationale: Inaeleza kuwapo kwa Paulo miongoni mwa Wakorintho.
- source_word: ἀπὼν δὲ θαρρῶ εἰς ὑμᾶς
  choice: lakini nikiwa mbali nina ujasiri kuwaelekea
  rationale: “Nikiwa mbali” huwasilisha hali ya kutokuwapo, “nina ujasiri” hudumisha utofauti wa balagha na “mnyenyekevu,” na “kuwaelekea” huhifadhi mwelekeo mpana wa εἰς bila kuufanya kuwa uhasama moja kwa moja.
theological_decisions:
- issue: Tafsiri ya Χριστοῦ
  choice: Masihi
  alternative: Kristo
  rationale: Neno hilo linafanya kazi kama cheo hapa; “Masihi” huhifadhi maana yake ya Kiyahudi na kimasihi.
- issue: Sauti ya Paulo katika ταπεινὸς
  choice: mnyenyekevu, huku uwezekano wa kejeli ukiachwa wazi
  alternative: mwoga; wa hali ya chini
  rationale: Kiyunani hakionyeshi wazi kuwa haya ni maneno yaliyonukuliwa. Tafsiri haijiamulii ikiwa Paulo anakubali maelezo hayo au anayarudia kwa kejeli.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa asili kwa msomaji wa kawaida, lakini msisitizo wa “Mimi mwenyewe, Paulo,” utofauti kati ya kuwapo na kutokuwapo, na utata wa kejeli katika maelezo ya Paulo vimehifadhiwa.
