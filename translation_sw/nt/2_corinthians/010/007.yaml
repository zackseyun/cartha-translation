reference: 2 Corinthians 10:7
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Τὰ κατὰ πρόσωπον βλέπετε. εἴ τις πέποιθεν ἑαυτῷ Χριστοῦ εἶναι, τοῦτο λογιζέσθω πάλιν ⸀ἐφ’ ἑαυτοῦ ὅτι καθὼς αὐτὸς Χριστοῦ οὕτως καὶ ⸀ἡμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/007.yaml
  text: 'You are looking at outward appearances[a]. If anyone is confident in himself that he belongs to Messiah, let him consider this again within himself: that just as he belongs to Messiah[b], so also do we.'
translation:
  language: sw
  text: Mnatazama mambo kwa sura ya nje.[a] Ikiwa mtu yeyote anajiamini kwamba yeye ni wa Masihi,[b] basi na afikirie tena moyoni mwake kwamba kama yeye alivyo wa Masihi, vivyo hivyo nasi pia ni wa Masihi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya karibu zaidi, “Mnatazama mambo kulingana na mwonekano”; pia yawezekana, “Tazameni yaliyo mbele ya macho yenu.”
    reason: lexical_alternative
  - marker: b
    text: Kigiriki, “ni wa Masihi”; yaani, ni mali ya Masihi au anamhusu.
    reason: alternative_reading
lexical_decisions:
- source_word: Τὰ κατὰ πρόσωπον
  choice: mambo kwa sura ya nje
  rationale: Kirai hiki kinaelekea kumaanisha mambo ya nje au yanavyoonekana kwa macho. Tafsiri hii ni ya kawaida katika Kiswahili na haifungi uwezekano mwingine wa kisarufi.
- source_word: βλέπετε
  choice: Mnatazama
  rationale: Umbo hili linaweza kueleweka kama taarifa au amri. Muktadha wa kukemea unaunga mkono taarifa kwamba wasomaji wanahukumu kwa mwonekano wa nje; utata huo umeonyeshwa katika tanbihi.
- source_word: πέποιθεν ἑαυτῷ
  choice: anajiamini
  rationale: Kitenzi katika hali timilifu kinaonyesha hali thabiti ya kuwa na uhakika, huku kiwakilishi cha kujirejelea kikihifadhi wazo la mtu kuwa na uhakika kuhusu yeye mwenyewe.
- source_word: Χριστοῦ εἶναι
  choice: yeye ni wa Masihi
  rationale: Muundo wa umilikishi unaonyesha kuwa wa Masihi au kumilikiwa naye. 'Masihi' linatafsiri Χριστός kama cheo.
- source_word: λογιζέσθω πάλιν ἐφ’ ἑαυτοῦ
  choice: na afikirie tena moyoni mwake
  rationale: Kauli hii ni mwito wa kutafakari upya ndani ya nafsi. 'Moyoni mwake' ni usemi wa kawaida wa Kiswahili unaowasilisha tafakari ya ndani bila kudokeza kwamba mtu afanye hivyo bila msaada wa wengine.
- source_word: καθὼς αὐτὸς Χριστοῦ οὕτως καὶ ἡμεῖς
  choice: kama yeye alivyo wa Masihi, vivyo hivyo nasi pia ni wa Masihi
  rationale: Tafsiri hii inaweka wazi kitenzi kilichoachwa katika sehemu ya pili ya ulinganisho na kuhifadhi dai la Paulo kwamba wao pia ni wa Masihi.
theological_decisions:
- issue: Tafsiri ya Χριστοῦ
  choice: Masihi
  alternative: Kristo
  rationale: Χριστός linatumika hapa kama cheo cha Mtiwa-Mafuta; 'Masihi' linaonyesha cheo hicho wazi na linaepuka kulifanya kuwa jina tu.
- issue: Maana ya kuwa Χριστοῦ
  choice: kuwa wa Masihi
  alternative: kumfuata Masihi
  rationale: Muundo wa Kigiriki unaonyesha umilikisho au uhusiano wa kuwa wake. 'Kuwa wa Masihi' huhifadhi upana huo bila kuufupisha kuwa ufuasi pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo wa sentensi ya kwanza umetafsiriwa kama taarifa ya kukemea, huku uwezekano wa kuisoma kama amri ukihifadhiwa katika tanbihi.
