  text: τοῦτο λογιζέσθω ὁ τοιοῦτος, ὅτι οἷοί ἐσμεν τῷ λόγῳ δι’ ἐπιστολῶν ἀπόντες, τοιοῦτοι καὶ παρόντες τῷ ἔργῳ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/011.yaml
  text: 'Let such a person consider this: what we are in word by letters when absent[b][a], we are also in deed when present.'
translation:
  language: sw
  text: 'Mtu wa namna hiyo na azingatie jambo hili: jinsi tulivyo katika usemi kwa njia ya barua tukiwa mbali, ndivyo tulivyo pia katika matendo tunapokuwapo.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λογιζέσθω
  choice: na afikirie
  rationale: Amri ya nafsi ya tatu inamtaka mtu huyo alitafakari na kulizingatia jambo hili; usemi huu ni wa kawaida na wenye uzito katika Kiswahili.
- source_word: ὁ τοιοῦτος
  choice: mtu wa namna hiyo
  rationale: Hurejelea kwa umoja mtu mwenye sifa au msimamo uliotajwa katika muktadha, bila kutumia lugha ya kizamani.
- source_word: οἷοί ἐσμεν
  choice: jinsi tulivyo
  rationale: Huhifadhi wazo la hali au tabia ya wasemaji na kuandaa ulinganisho unaorudiwa na τοιοῦτοι.
- source_word: τῷ λόγῳ
  choice: katika maneno yetu
  rationale: Dativu inaonyesha upande au nyanja ya usemi. Wingi wa kawaida wa Kiswahili unaeleza mawasiliano ya barua bila kuifanya λόγος kuwa ujumbe mmoja maalumu.
- source_word: δι’ ἐπιστολῶν
  choice: kupitia barua
  rationale: διά pamoja na jenitivi huonyesha njia au chombo; barua ndizo njia ambayo maneno yao yanawafikia wasomaji.
- source_word: ἀπόντες
  choice: tunapokuwa mbali
  rationale: Kirai cha wakati na hali kinadumisha utofauti na kuwapo kwao baadaye.
- source_word: τοιοῦτοι
  choice: ndivyo tutakavyokuwa pia
  rationale: Hurejelea jinsi walivyoelezwa katika sehemu ya kwanza. Wakati ujao ni wa asili katika Kiswahili kwa onyo kuhusu watakavyokuwa watakapofika, ingawa kitenzi cha Kigiriki ni cha wakati wa sasa.
- source_word: παρόντες
  choice: tunapokuwa pamoja nanyi
  rationale: παρών hapa humaanisha kuwapo uso kwa uso kwa wakorintho; nyongeza ya 'nanyi' huweka maana hiyo wazi kwa Kiswahili cha kawaida.
- source_word: τῷ ἔργῳ
  choice: katika matendo
  rationale: Huhifadhi utofauti wa kibalagha kati ya maneno na matendo, bila kuufanya kuwa fundisho pana lisilosemwa na aya.
theological_decisions:
- issue: Kauli ya Paulo inalinganisha nguvu ya barua zake akiwa mbali na matendo yake atakapokuwapo.
  choice: Kutafsiri kama onyo kwamba atakapofika, matendo yake yatalingana na maneno yake ya barua.
  alternative: Kutafsiri kwa uhuru zaidi kama tishio la adhabu fulani, au kama tofauti tu kati ya mtindo wa kusema na nguvu ya kiroho.
  rationale: Muundo wa Kigiriki unafanya ulinganisho wa moja kwa moja kati ya λόγος na ἔργον, pamoja na kutokuwapo na kuwapo. Tafsiri inadumisha onyo hilo bila kuongeza aina maalumu ya hatua ambayo haijatajwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa ulinganisho 'jinsi ... ndivyo ...' unatoa sentensi ya asili na kuhifadhi ulinganifu wa Kigiriki. Hakuna tanbihi inayohitajika kwa kuwa tofauti za kileksika zinaweza kuwakilishwa wazi katika matini.
