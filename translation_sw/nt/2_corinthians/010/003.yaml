  text: For though we walk in the flesh[a], we do not wage war according to the flesh—
translation:
  language: sw
  text: Kwa maana, ingawa tunaenenda katika mwili[a], hatupigani vita kwa jinsi ya mwili—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa maana, ingawa tunaishi katika mwili, hatupigani vita kwa viwango vya kibinadamu.”
    reason: Mbadala huu unaweka wazi maana ya kimuktadha ya περιπατέω na κατὰ σάρκα, bila kudai kuwa σάρξ hapa ni ‘asili ya dhambi.’
lexical_decisions:
- source_word: ἐν σαρκὶ
  choice: katika mwili
  rationale: Neno σάρξ hapa linaelekea kumaanisha maisha ya kawaida ya kibinadamu katika mwili. Tafsiri hii haileti maana ya ‘asili ya dhambi,’ ambayo haiko wazi katika muktadha huu.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Kiunganishi hiki kinaonyesha kuwa Paulo anaeleza kauli iliyotangulia na kudumisha mtiririko wa hoja.
- source_word: περιπατοῦντες
  choice: ingawa tunaenenda
  rationale: Kitenzi hiki kihalisi kinahusu kutembea lakini mara nyingi humaanisha kuishi au kuendesha maisha. ‘Tunaenenda’ kinahifadhi sitiari, huku ‘ingawa’ kikionyesha tofauti na kishazi kinachofuata.
- source_word: οὐ κατὰ σάρκα
  choice: hatupigani vita kwa jinsi ya mwili
  rationale: κατά hapa huonyesha namna au kiwango kinachoongoza tendo. ‘Kwa jinsi ya mwili’ kinahifadhi kurudiwa kwa σάρξ na kuacha wazi iwapo mkazo ni mbinu za kibinadamu, za kidunia, au zinazoongozwa na mwili.
- source_word: στρατευόμεθα
  choice: hatupigani vita
  rationale: Tafsiri hii inawasilisha vizuri sitiari ya kijeshi ambayo Paulo anatumia kuhusu mapambano ya huduma yake.
theological_decisions:
- issue: Maana ya σάρξ katika sehemu zote mbili
  choice: Kutumia ‘mwili’ katika sehemu zote mbili za mstari
  alternative: ‘tunaishi katika mwili ... kwa viwango vya kibinadamu’ au ‘katika udhaifu wa kibinadamu ... kwa njia ya kidunia’
  rationale: Matumizi ya kwanza yanahusu hali ya kuishi kama mwanadamu mwenye mwili, ilhali la pili linaweza kuonyesha namna au viwango vya kibinadamu. Kurudia ‘mwili’ kunahifadhi mchezo wa maneno na mvutano wa kauli ya Paulo bila kuufasiri kwa maana finyu ya ‘asili ya dhambi.’
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki chenye hadhi ya maandiko lakini kinachoeleweka kwa msomaji wa kawaida. ‘Tunaenenda’ huhifadhi sitiari ya kutembea/kuishi; tanbihi inatoa usemi wa moja kwa moja zaidi. Alama ya mwisho ya mstari (—) imehifadhiwa kwa sababu sentensi inaendelea katika mstari unaofuata.
