source:
  edition: SBLGNT
  text: δέομαι δὲ τὸ μὴ παρὼν θαρρῆσαι τῇ πεποιθήσει ᾗ λογίζομαι τολμῆσαι ἐπί τινας τοὺς λογιζομένους ἡμᾶς ὡς κατὰ σάρκα περιπατοῦντας.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/002.yaml
  text: But I beg that when I am present I may not have to be bold with the confidence by which I consider daring to confront some who regard us as walking according to the flesh[a].
translation:
  language: sw
  text: Lakini nawasihi kwamba nitakapokuwa pamoja nanyi, nisilazimike kuwa jasiri kwa ujasiri ambao ninafikiri kuutumia dhidi ya baadhi ya watu wanaotudhania kuwa tunaenenda kwa jinsi ya mwili[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “tunaishi kwa kufuata viwango vya kibinadamu.”
    reason: Mbadala huu unaonyesha maana ya kiutendaji ya κατὰ σάρκα bila kuondoa neno “mwili” katika matini kuu.
lexical_decisions:
- source_word: δέομαι
  choice: nawasihi
  rationale: Kitenzi hiki ni ombi la dhati lenye uzito kuliko ‘naomba’; ‘nawasihi’ ni Kiswahili cha sasa, cha heshima, na kinafaa kwa wito wa Paulo.
- source_word: τὸ μὴ παρὼν θαρρῆσαι
  choice: kwamba nitakapokuwa pamoja nanyi, nisilazimike kuwa jasiri
  rationale: Muundo huu unaeleza jambo ambalo Paulo anaomba lisihitajike. ‘Nisilazimike’ huweka wazi ulazima unaodokezwa bila kudai kuwa shinikizo linatoka kwa nguvu ya nje.
- source_word: παρὼν
  choice: nitakapokuwa pamoja nanyi
  rationale: Katika muktadha wa kutokuwapo kwake, maana si kuwapo kwa ujumla tu bali kuwa huko pamoja na wasomaji.
- source_word: θαρρῆσαι
  choice: kuwa jasiri
  rationale: Huhifadhi wazo la kutenda kwa ujasiri na uthabiti mbele ya wapinzani.
- source_word: τῇ πεποιθήσει
  choice: kwa ule ujasiri
  rationale: πεποίθησις hapa ni uhakika au moyo wa kujiamini unaomwezesha Paulo kutenda. ‘Ujasiri’ huunganika kwa kawaida na kitendo kinachofuata na huepuka Kiswahili kisicho cha kawaida cha ‘kwa kujiamini.’
- source_word: ᾗ λογίζομαι
  choice: ambao ninakusudia
  rationale: λογίζομαι hapa yaweza kuonyesha uamuzi au nia iliyofikiriwa. ‘Ninakusudia’ huwasilisha mwelekeo huo bila kuugeuza kuwa uhakika wa kwamba Paulo lazima atatenda hivyo.
- source_word: τολμῆσαι ἐπί τινας
  choice: kuutumia dhidi ya baadhi ya watu
  rationale: τολμάω pamoja na ἐπί na watu inaelekeza kitendo cha ujasiri kwa upande wa wapinzani. Tafsiri hii huhifadhi nguvu ya uadui ya ‘dhidi ya’ bila kuongeza kitendo mahususi kama ‘kuwakabili.’
- source_word: τοὺς λογιζομένους
  choice: wanaotudhania
  rationale: Hueleza tathmini au maoni ya watu hao kuhusu Paulo na wenzake; ‘kudhania’ pia hudokeza kuwa Paulo hakubaliani na hukumu yao.
- source_word: κατὰ σάρκα
  choice: kwa kufuata mwili
  rationale: Huhifadhi istilahi muhimu ya Paulo, ‘mwili,’ pamoja na uwezekano wa maana ya viwango au misukumo ya kibinadamu, badala ya kuifasiri moja kwa moja kuwa hali ya dhambi.
- source_word: περιπατοῦντας
  choice: tunaenenda
  rationale: Huhifadhi sitiari ya kawaida ya Paulo ya ‘kutembea/kuenenda’ kwa maana ya mwenendo wa maisha, huku ‘kuenenda’ ikiwa ya heshima na inayoeleweka katika sajili ya Biblia.
theological_decisions:
- issue: Maana ya σάρξ katika κατὰ σάρκα
  choice: kwa kufuata mwili
  alternative: kwa kufuata viwango vya kibinadamu
  rationale: ‘Mwili’ huhifadhi msamiati na mvutano wa kiteolojia wa Paulo. Hapa shtaka linaweza kumaanisha kuongozwa na hali, mitazamo, au viwango vya kibinadamu; ‘asili ya dhambi’ ingefunga maana kupita ushahidi wa muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umefanywa kuwa wa kawaida kwa msomaji wa leo, huku sitiari ya ‘kuenenda’ na istilahi ‘mwili’ zikihifadhiwa kwa sababu ya uzito wake katika lugha ya Paulo.
