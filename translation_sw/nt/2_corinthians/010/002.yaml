  verdict: revise
  source_fidelity: 'Rasimu inafuata maana ya msingi ya sentensi: ombi la Paulo asilazimike kuchukua msimamo wa ujasiri akiwa pamoja nao, dhidi ya watu wanaomhukumu yeye na wenzake. Hata hivyo, “kwa kufuata mwili” huelekeza zaidi kwenye kutii au kufuata mwili, ilhali κατὰ σάρκα ni “kwa jinsi ya / kulingana na mwili,” na hivyo inapaswa kurekebishwa ili kuhifadhi upana wa usemi wa Paulo.'
  naturalness: Kiswahili kwa ujumla ni sanifu na chenye sajili inayofaa. “Ule ujasiri” si lazima; “ujasiri” hutiririka vizuri zaidi. Muundo “ambao ninakusudia kuutumia dhidi ya” unaeleweka, ingawa “ninafikiria kuutumia” huakisi λογίζομαι kwa karibu zaidi bila kudai nia iliyoamuliwa kikamilifu.
  terminology: “Nawasihi,” “kuwa jasiri,” na “tunaenenda” vinafaa. “Kwa jinsi ya mwili” ni usemi wa Kiswahili wa kibiblia ulio wa kawaida zaidi kwa κατὰ σάρκα, huhifadhi istilahi “mwili,” na haubani maana kuwa utii wa mwili au asili ya dhambi. Tanbihi ibaki ikitoa maana mbadala ya kiutendaji.
