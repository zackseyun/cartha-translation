  to: Lakini nawasihi kwamba nitakapokuwa pamoja nanyi, nisilazimike kuwa jasiri kwa ujasiri ambao ninafikiri kuutumia dhidi ya baadhi ya watu wanaotudhania kuwa tunaenenda kwa jinsi ya mwili[a].
  rationale: Marekebisho yanabadilisha “kwa kufuata mwili” kuwa “kwa jinsi ya mwili” ili kuakisi kwa karibu zaidi κατὰ σάρκα na kudumisha utata wake wa ki-Paulo. Pia “ninafikiri” hurejesha kwa usahihi zaidi nguvu ya λογίζομαι. Marekebisho mengine ni madogo ya mtiririko na hayabadili maana ya kifungu.
