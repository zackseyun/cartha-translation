    rationale: “Kufuata” huongeza wazo la kutii au kuongozwa na mwili. Kifungu cha Kigiriki kina maana pana ya mwenendo “kwa jinsi ya/kulingana na mwili.” “Kwa jinsi ya mwili” huhifadhi uaminifu wa kileksia na utata wa kiteolojia.
  - severity: low
    issue: “Ninakusudia” kwa λογίζομαι
    rationale: Neno hili hasa huonyesha tathmini au wazo lililofikiriwa (“ninafikiri/ninahesabu”), si lazima kusudi lililoamuliwa. “Ninafikiri kuutumia” huweka kiwango hicho cha tahadhari.
