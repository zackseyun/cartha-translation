base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/006.yaml
  text: and being ready to punish every act of disobedience[b][a], when your obedience is complete.
translation:
  language: sw
  text: nasi tukiwa tayari kuadhibu kila tendo la kutotii[a], wakati utiifu wenu utakapokuwa kamili[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutekeleza haki dhidi ya kila tendo la kutotii,” au “kulipiza kisasi kwa kila kutotii.” Kitenzi cha Kigiriki kinaweza kumaanisha kutekeleza haki au kulipiza kisasi; hapa huenda kinarejelea adhabu ya kinidhamu.
    reason: lexical_alternative
  - marker: b
    text: Au, “utiifu wenu utakapotimizwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἑτοίμῳ ἔχοντες
  choice: tukiwa tayari
  rationale: Hii ni tafsiri ya asili ya nahau yenye maana ya kuwa katika hali ya utayari; umbo la kushirikisha linaunganisha sentensi na muktadha uliotangulia.
- source_word: ἐκδικῆσαι
  choice: kuadhibu
  rationale: Katika muktadha wa mamlaka ya kitume na kushughulikia uasi, neno hili linaelekea kumaanisha kutekeleza adhabu au haki, si kulipiza kisasi cha binafsi.
- source_word: πᾶσαν παρακοήν
  choice: kila tendo la kutotii
  rationale: Tafsiri hii inaonyesha nguvu ya mgawanyo ya πᾶσαν na maana ya παρακοή kama kutotii au kukataa kutii.
- source_word: ὅταν
  choice: utakapokuwa
  rationale: Muundo huu wa Kiswahili unaonyesha wakati wa baadaye unaotegemea kutimizwa kwa hali fulani, kama ὅταν pamoja na hali tegemezi.
- source_word: πληρωθῇ
  choice: utakapokuwa kamili
  rationale: Kitenzi katika hali ya kutendwa kinaeleza utiifu kufikia ukamilifu au kipimo chake kamili.
- source_word: ὑμῶν ἡ ὑπακοή
  choice: utiifu wenu
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya umilikaji, ikihifadhi maana ya utiifu wa Wakorintho.
theological_decisions:
- issue: Asili ya hatua ambayo Paulo yuko tayari kuchukua dhidi ya kutotii
  choice: adhabu ya kinidhamu kwa kutotii katika jumuiya ya kanisa
  alternative: kulipiza kisasi dhidi ya wapinzani, au hukumu ya Mungu ya mwisho
  rationale: Muktadha wa karibu unahusu mamlaka ya kitume na kurekebisha upinzani. Hata hivyo, tanbihi inadumisha maana mbadala ya kutekeleza haki au kulipiza kisasi iliyomo katika kitenzi cha Kigiriki.
- issue: Uhusiano wa hatua ya Paulo na utiifu wa Wakorintho
  choice: hatua itachukuliwa utiifu wao utakapofikia ukamilifu
  alternative: hatua itachukuliwa tu ikiwa kila mtu binafsi atakuwa mtiifu kikamilifu
  rationale: Sentensi inaweka uhusiano wa wakati au hali bila kufafanua kwa kina maana ya ukamilifu huo; tafsiri haiongezi sharti la kimafundisho lisilotajwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. “Tendo la kutotii” ni wazi kwa msomaji wa kawaida, huku tanbihi zikihifadhi upana wa maana wa maneno ya Kigiriki. Alama zote za tanbihi zimewekwa katika matini kuu.
