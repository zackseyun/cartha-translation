translation:
  language: sw
  text: Lakini anayejisifu ajisifu katika Bwana.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata muundo wa Kigiriki kwa karibu zaidi, “Yule anayejisifu na ajisifu katika Bwana.” Huenda Paulo anarejelea maneno ya Yeremia 9:24 (katika Septuajinti, 9:23).
    reason: cross_reference
lexical_decisions:
- source_word: Ὁ ... καυχώμενος
  choice: anayejisifu
  rationale: Kifungu chenye kibainishi na hali ya kuendelea kimetumiwa kama nomino kwa maana ya jumla. ‘Anayejisifu’ ni Kiswahili cha kawaida, kinachojumuisha mtu yeyote, na kinadumisha uradidi wa kitenzi katika Kigiriki.
- source_word: δὲ
  choice: Lakini
  rationale: Neno hili linaonyesha tofauti nyepesi na hoja iliyotangulia; ‘Lakini’ linaonyesha hapa tofauti kati ya kujisifu kusikofaa na kujisifu kunakofaa.
- source_word: καυχώμενος / καυχάσθω
  choice: anayejisifu / na ajisifu
  rationale: ‘Kujisifu’ linaonyesha wazi maana ya καυχάομαι na makali ya usemi wa Paulo. ‘Na ajisifu’ linadumisha kwa njia ya kawaida ya Kiswahili nguvu ya amri ya nafsi ya tatu katika καυχάσθω.
- source_word: ἐν
  choice: katika
  rationale: Pamoja na ‘kujisifu,’ ‘katika’ linadumisha wazo la mazingira, msingi, au jambo ambalo mtu anajisifia, bila kulifafanua kupita kiasi.
- source_word: κυρίῳ
  choice: Bwana
  rationale: ‘Bwana’ ndilo neno la kawaida la mradi kwa κύριος. Kiswahili hakihitaji kuongeza kibainishi, na tafsiri hii haibainishi kimakusudi ikiwa hapa Paulo anamlenga Mungu au Bwana Yesu.
theological_decisions:
- issue: Anayerejelewa na ‘Bwana’ katika muktadha wa dondoo au mwangwi wa Maandiko
  choice: Bwana
  alternative: Mungu; Bwana Yesu
  rationale: Kigiriki kinasema tu κυρίῳ, huku usemi ukiwa na uwezekano mkubwa wa kurejelea Yeremia 9:24 (LXX 9:23). Kutafsiri ‘Bwana’ kunahifadhi mwangwi huo na pia mvutano wa matumizi ya Paulo bila kuongeza utambulisho ambao mstari wenyewe haujaueleza wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ‘anayejisifu, na ajisifu’ ni wa kueleweka kwa wasomaji wa kawaida na unahifadhi uradidi wa maneno pamoja na nguvu ya amri ya Kigiriki. Alama ya tanbihi [a] imewekwa katika matini kuu.
