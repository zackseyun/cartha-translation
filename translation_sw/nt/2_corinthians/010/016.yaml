base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/016.yaml
  text: to proclaim the good news in the regions beyond you[c][b][a], not to boast in another's sphere about things already prepared.
translation:
  language: sw
  text: ili kutangaza habari njema katika maeneo yaliyo mbali zaidi ya kwenu[a], wala si kujisifu katika uwanja wa mwingine[b] kuhusu mambo yaliyokwisha kuandaliwa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuhubiri injili katika nchi zilizo mbali zaidi ya kwenu.”
    reason: lexical_alternative
  - marker: b
    text: Neno “uwanja” linatafsiri neno la Kigiriki κανών kwa maana ya eneo au upeo wa huduma aliopewa mtu, si “kanuni” ya maadili wala “kanoni” kwa maana yake ya baadaye.
    reason: cultural_note
  - marker: c
    text: Au, “wala si kujisifu katika uwanja wa mwingine kuhusu mambo yaliyokwisha kufanywa.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπερέκεινα ὑμῶν
  choice: maeneo yaliyo mbali zaidi ya kwenu
  rationale: Kirai hiki kinaonyesha maeneo yaliyo ng’ambo ya mahali walipo Wakorintho. Tafsiri hii ni ya asili katika Kiswahili na inadumisha uhusiano wa mahali bila kulazimisha maana ya eneo maalumu lisilotajwa wazi.
- source_word: εὐαγγελίσασθαι
  choice: kutangaza habari njema
  rationale: Kitenzi hiki kinaeleza kusudi la kimisionari la Paulo. ‘Kutangaza habari njema’ ni lugha ya sasa, inayoeleweka kwa urahisi, na inadumisha nguvu ya kitenzi.
- source_word: ἀλλοτρίῳ
  choice: wa mwingine
  rationale: Kivumishi hiki humaanisha kitu kilicho cha mtu mwingine. Muundo huu ni mfupi, jumuishi, na wa moja kwa moja.
- source_word: κανόνι
  choice: uwanja
  rationale: Katika muktadha huu neno hili linamaanisha eneo au upeo wa huduma, si kanuni ya maadili wala ‘kanoni’ kwa maana ya baadaye. ‘Uwanja’ linadumisha sitiari ya eneo la kazi.
- source_word: ἕτοιμα
  choice: mambo yaliyokwisha kuandaliwa
  rationale: Kivumishi hiki kimetumika kama nomino na kwa msingi wake hurejelea mambo yaliyo tayari. Tafsiri hii haibadili kimyakimya maana hiyo kuwa kazi zilizokwisha kufanywa, ingawa muktadha unaweza kuelekea huko.
- source_word: καυχήσασθαι
  choice: kujisifu
  rationale: Neno hili linadumisha msamiati wa Paulo kuhusu kujisifu katika kifungu kinachozunguka na linafaa kwa Kiswahili sanifu.
theological_decisions:
- issue: Maana ya κανών katika muktadha wa huduma ya Paulo
  choice: uwanja wa huduma au kazi ya mtu mwingine
  alternative: kanuni, kipimo, au kanoni
  rationale: Muktadha wa 2 Wakorintho 10:13–15 unahusu mipaka na maeneo ya kazi. ‘Uwanja’ huepuka kuingiza maana ya kanuni ya maadili au kanoni ya Maandiko.
- issue: Rejeo la τὰ ἕτοιμα
  choice: mambo yaliyokwisha kuandaliwa
  alternative: mambo yaliyokwisha kufanywa au kazi iliyokamilishwa na wengine
  rationale: Kigiriki kinasema kwa ufupi ‘mambo yaliyo tayari.’ Tafsiri kuu inadumisha upana huo, huku tanbihi ikionyesha maana inayowezekana katika muktadha wa kazi ya huduma ya wengine.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo wa mstari umeachwa kama mwendelezo wa sentensi ya mistari iliyotangulia. Sitiari ya ‘uwanja’ inadumishwa, huku tanbihi zikieleza upeo wake na utata wa τὰ ἕτοιμα.
