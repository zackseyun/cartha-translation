  text: so that I may not seem as though I were trying to frighten you by my letters[a].
translation:
  language: sw
  text: ili nisionekane kana kwamba ninajaribu kuwatisha kwa barua zangu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kana kwamba ninajaribu kuwatia hofu kupitia barua hizo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα μὴ
  choice: ili nisi-
  rationale: Muundo huu unaendeleza kusudi au matokeo yanayohusiana na muktadha uliotangulia; ‘ili nisi-’ ni Kiswahili cha kawaida kinachohifadhi utegemezi na ukanushi wa kishazi.
- source_word: δόξω
  choice: nisionekane
  rationale: Kitenzi δοκέω hapa kina maana ya ‘kuonekana,’ si ‘kufikiri’; hali ya utegemezi baada ya ἵνα imewakilishwa kwa umbo la ‘nisionekane.’
- source_word: ὡς ἂν
  choice: kana kwamba
  rationale: ‘Kana kwamba’ huonyesha ulinganisho wa jambo linalodhaniwa au kuonekana bila kulithibitisha kuwa kweli.
- source_word: ἐκφοβεῖν
  choice: ninajaribu kuwatisha
  rationale: Kitenzi kina maana ya kusababisha hofu au kuogofya. ‘Kuwatisha’ ni cha moja kwa moja, huku ‘ninajaribu’ kikifanya muundo utegemee kwa kawaida ‘nisionekane kana kwamba.’
- source_word: ὑμᾶς
  choice: -wa-
  rationale: Kiambishi cha yambwa ‘-wa-’ kinawakilisha nafsi ya pili wingi, yaani ‘ninyi.’
- source_word: διὰ τῶν ἐπιστολῶν
  choice: kwa barua zangu
  rationale: διά pamoja na umilikishi huonyesha njia au chombo. Ingawa Kigiriki kinasema kihalisi ‘barua hizo,’ muktadha unaonyesha ni barua za Paulo; ‘barua zangu’ ni ya asili na haibadili rejeleo.
