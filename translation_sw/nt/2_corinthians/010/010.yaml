  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὅτι Αἱ ⸂ἐπιστολαὶ μέν⸃, φησίν, βαρεῖαι καὶ ἰσχυραί, ἡ δὲ παρουσία τοῦ σώματος ἀσθενὴς καὶ ὁ λόγος ἐξουθενημένος.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/010.yaml
  text: For they say[a], “His letters are weighty and strong, but his bodily presence is weak[b], and his speech is despised.”
translation:
  language: sw
  text: Kwa maana wanasema[a], “Barua zake ni nzito na zenye nguvu, lakini anapokuwapo kimwili ni dhaifu, na usemi wake unadharauliwa[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “anasema.” Neno la Kigiriki liko katika umoja, ingawa hapa linaweza kutumiwa kama fomula ya kunukuu maoni ya wakosoaji wa Paulo.
    reason: lexical_alternative
  - marker: b
    text: Au, “unaonekana kuwa hauna maana” au “unadharaulika.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Kwa maana
  rationale: Katika muktadha huu neno hilo linaanzisha sababu au maelezo ya dai lililotangulia; “Kwa maana” ni kiunganishi cha kawaida na chenye hadhi katika Kiswahili.
- source_word: ἐπιστολαὶ
  choice: barua
  rationale: Hurejelea mawasiliano yaliyoandikwa; “barua” ni neno la kawaida la Kiswahili lisilo na sajili ya kidini isiyohitajika.
- source_word: μέν ... δὲ
  choice: ni ... lakini
  rationale: Jozi hii huonyesha utofautishaji, unaotolewa kwa njia ya asili katika Kiswahili kwa “ni ... lakini.”
- source_word: φησίν
  choice: wanasema
  rationale: Ingawa umbo la Kigiriki ni la umoja, linaweza kutumika kama fomula ya kunukuu msemaji mwakilishi; muktadha unaonyesha maoni yaliyoripotiwa ya wakosoaji wa Paulo. Tanbihi inahifadhi umoja wa kisarufi.
- source_word: βαρεῖαι
  choice: nzito
  rationale: “Nzito” huhifadhi sitiari ya uzito na kudokeza uzito wa hoja au athari bila kuongeza tafsiri.
- source_word: ἰσχυραί
  choice: zenye nguvu
  rationale: Hii ni tafsiri ya moja kwa moja inayopatana kiasili na “nzito” katika kueleza barua.
- source_word: παρουσία τοῦ σώματος
  choice: anapokuwapo kimwili
  rationale: Kirai hiki kinaonyesha kuwapo kwa Paulo mwenyewe ana kwa ana, tofauti na barua zake; muundo wa kitenzi ni wa asili zaidi katika Kiswahili kuliko “kuwapo kwake kwa mwili.”
- source_word: ἀσθενὴς
  choice: dhaifu
  rationale: Huhifadhi dai la wakosoaji bila kufafanua iwapo udhaifu unaohusika ni sura, afya, au athari yake kwa wasikilizaji.
- source_word: λόγος
  choice: usemi
  rationale: Katika utofautishaji na barua na kuwapo kimwili, neno hili linahusu namna yake ya kusema au hotuba yake ya mdomo; “usemi” huhifadhi upana huo.
- source_word: ἐξουθενημένος
  choice: unadharauliwa
  rationale: Kauli ya kutendwa inaonyesha kwamba usemi wake unaonekana kuwa si kitu au unashikiliwa kwa dharau, badala ya kutangaza kwamba kwa asili hauna thamani.
theological_decisions:
- issue: Ukosoaji unaoripotiwa usionekane kuwa tathmini ya msimulizi kuhusu Paulo
  choice: 'Maneno yanatolewa kama kauli ya wakosoaji: “wanasema.”'
  alternative: “anasema” au “inasemekana”
  rationale: Muktadha unaonyesha shtaka linaloripotiwa, si uthibitisho kwamba Paulo kwa kweli ni dhaifu au kwamba usemi wake hauna thamani.
- issue: Umoja wa φησίν dhidi ya kundi la wakosoaji katika muktadha
  choice: “wanasema” katika matini, huku “anasema” ikihifadhiwa katika tanbihi
  alternative: Kutumia “anasema” katika matini kuu
  rationale: Hii huwasilisha kwa Kiswahili cha kawaida maoni ya kundi yanayoripotiwa, lakini haiufichi ushahidi halisi wa umbo la umoja katika Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “anapokuwapo kimwili” umetumiwa kwa uasili na uwazi; “unadharauliwa” huhifadhi tathmini ya wakosoaji badala ya kuifanya iwe sifa ya ndani ya usemi.
