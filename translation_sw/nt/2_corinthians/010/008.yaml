  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐάν ⸀τε ⸀γὰρ περισσότερόν τι καυχήσωμαι περὶ τῆς ἐξουσίας ἡμῶν, ἧς ἔδωκεν ὁ ⸀κύριος εἰς οἰκοδομὴν καὶ οὐκ εἰς καθαίρεσιν ὑμῶν, οὐκ αἰσχυνθήσομαι,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/008.yaml
  text: For even if I should boast somewhat more about our authority[a], which the Lord gave for building you up and not for tearing you down[b], I will not be put to shame.
translation:
  language: sw
  text: Maana hata nikijisifu zaidi kidogo kuhusu mamlaka yetu[a], ambayo Bwana alitupa ili kuwajenga, wala si kuwabomoa[b], sitaaibishwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sitaaibika.” Kitenzi cha Kigiriki kinaweza kutafsiriwa kwa namna zote mbili, lakini “sitaaibishwa” huonyesha kwa uwazi zaidi umbo la kutendwa lililotumika hapa.
    reason: lexical_alternative
  - marker: b
    text: Au, “kuwaangamiza.” Kigiriki kinatofautisha “kujenga” na “kubomoa/kuangamiza”; tafsiri iliyochaguliwa inadumisha sitiari ya ujenzi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐάν τε γὰρ
  choice: Maana hata niki-
  rationale: “Maana” huhifadhi nguvu ya ufafanuzi ya γάρ, huku “hata niki-” ikiwasilisha sharti la ἐάν pamoja na msisitizo wa τε kwa Kiswahili cha kawaida.
- source_word: περισσότερόν τι
  choice: zaidi kidogo
  rationale: Huhifadhi ulinganisho wa περισσότερον na upunguzaji usio kamili wa τι bila kufanya kauli iwe kali kupita kiasi.
- source_word: καυχήσωμαι
  choice: nikijisifu
  rationale: Huwasilisha kitenzi cha sharti katika nafsi ya kwanza kwa njia ya asili; “kujisitiri” au “kujisifia” kungeleta maana isiyolengwa hapa.
- source_word: περὶ τῆς ἐξουσίας ἡμῶν
  choice: kuhusu mamlaka yetu
  rationale: ἐξουσία ni mamlaka au haki iliyokabidhiwa, si nguvu tu; “mamlaka” ni neno la kawaida na sahihi katika muktadha huu.
- source_word: ἧς ἔδωκεν ὁ κύριος
  choice: ambayo Bwana alitupa
  rationale: Kiwakilishi kinarejelea mamlaka, na wakati uliopita “alitupa” unaakisi ἔδωκεν kwa kawaida. “Bwana” huhifadhi cheo cha κύριος.
- source_word: εἰς οἰκοδομὴν
  choice: ili kuwajenga
  rationale: Huhifadhi sitiari ya ujenzi huku ikifanya walengwa wanaodokezwa na muktadha kuwa wazi.
- source_word: καὶ οὐκ εἰς καθαίρεσιν ὑμῶν
  choice: wala si kuwaangusha
  rationale: “Kuwaangusha” hudumisha utofautishaji wa kisitiari kati ya kujenga na kubomoa, huku ikiepuka kudai kwamba maana pekee ni maangamizi kamili.
- source_word: οὐκ αἰσχυνθήσομαι
  choice: sitaaibishwa
  rationale: Umbo la kutendwa linaakisiwa moja kwa moja na “sitaaibishwa,” likionyesha kwamba majivuno ya Paulo hayatathibitishwa kuwa ya aibu au matupu.
theological_decisions:
- issue: Asili na kusudi la mamlaka ya kitume
  choice: Mamlaka ya Paulo imetolewa na Bwana kwa kusudi la kuwajenga Wakorintho, si kuwaangusha.
  alternative: Mamlaka hiyo inalenga hasa maangamizi au adhabu ya kanisa.
  rationale: Utofautishaji wa wazi kati ya οἰκοδομή na καθαίρεσις unaonyesha kusudi la kujenga bila kuondoa uwezekano wa matumizi thabiti ya mamlaka. Tafsiri haiupunguzi uzito wa mamlaka wala kuufanya uharibifu kuwa lengo lake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inadumisha muundo wa hoja ya Paulo na sitiari ya kujenga na kuangusha, huku ikisomeka kwa urahisi kwa wasomaji wa kawaida.
