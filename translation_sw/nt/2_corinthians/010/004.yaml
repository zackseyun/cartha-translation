base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/004.yaml
  text: For the weapons of our warfare are not fleshly[c][b][a], but powerful before God for the tearing down of strongholds—tearing down arguments
translation:
  language: sw
  text: Kwa maana silaha za vita vyetu si za mwili[a], bali zina nguvu mbele za Mungu[b] kwa ajili ya kubomoa ngome—tukiangusha hoja[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “si za kibinadamu” au “si za kidunia.”
    reason: lexical_alternative
  - marker: b
    text: Au “zina nguvu kupitia Mungu” au “zina nguvu za kimungu.”
    reason: alternative_reading
  - marker: c
    text: Au “mawazo,” “mawazo ya kimantiki,” au “makisio.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπλα
  choice: silaha
  rationale: Neno hili linadumisha taswira halisi ya kijeshi na ni la kawaida katika Kiswahili cha sasa.
- source_word: στρατείας
  choice: vita
  rationale: “Vita” ni usemi wa kawaida unaowasilisha mapambano ya kijeshi yanayotumiwa hapa kama sitiari.
- source_word: σαρκικὰ
  choice: za mwili
  rationale: Tafsiri hii inadumisha uhusiano wa neno la Kigiriki na “mwili” bila kulifafanua mapema kuwa “za kidunia” au “za dhambi” pekee.
- source_word: δυνατὰ τῷ θεῷ
  choice: zina nguvu kwa Mungu
  rationale: Usemi huu mfupi unadumisha kwa kadiri iwezekanavyo hali iliyobanwa ya dati ya Kigiriki, ambayo inaweza kueleweka kuwa nguvu hiyo inatokana na Mungu au kuwa ni kuu mbele zake.
- source_word: καθαίρεσιν
  choice: kubomoa
  rationale: “Kubomoa” inadumisha taswira ya kuangusha ngome na inaunganika kwa kawaida na kitenzi kinachofuata.
- source_word: ὀχυρωμάτων
  choice: ngome
  rationale: “Ngome” ni neno la kawaida kwa mahali palipoimarishwa kwa ulinzi na linafaa katika matumizi ya kisitiari.
- source_word: λογισμοὺς
  choice: hoja
  rationale: Katika muktadha huu neno linahusu mawazo au mifumo ya kufikiri inayopingana, hivyo “hoja” ni wazi bila kuipanua kupita kiasi.
- source_word: καθαιροῦντες
  choice: tukiziangusha
  rationale: Kitenzi hiki kinaendeleza taswira ya ubomoaji na kinaonyesha kwamba ngome hizo zinahusisha hoja zinazopingana.
theological_decisions:
- issue: Maana ya σαρκικὰ katika utofautishaji wa njia za kibinadamu na nguvu ya Mungu
  choice: za mwili
  alternative: za kidunia; za kibinadamu
  rationale: “Za mwili” inadumisha msamiati na mvutano wa kitheolojia wa Paulo bila kuamua kwamba hapa maana yake ni dhambi tu au ulimwengu tu.
- issue: Nguvu ya dati τῷ θεῷ katika δυνατὰ τῷ θεῷ
  choice: zina nguvu kwa Mungu
  alternative: zina nguvu kupitia Mungu; zina nguvu mbele za Mungu; zina nguvu za kimungu
  rationale: Kigiriki kina usemi uliobanwa. Tafsiri kuu haifungi maana kwa uhusiano mmoja tu, na tanbihi inaonyesha njia kuu za kuuelewa.
- issue: Uhusiano wa λογισμοὺς καθαιροῦντες na kauli iliyotangulia
  choice: —tukiziangusha hoja
  alternative: ; yaani, tunaangusha hoja
  rationale: Mstari wa em unahifadhi mwendelezo mkali wa sentensi ya Kigiriki na kuonyesha kuwa kauli hii inaanza kufafanua kubomolewa kwa ngome, huku sentensi ikiendelea katika mstari unaofuata.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo ni wa kawaida kwa wasomaji wengi, huku taswira ya kijeshi, urudiaji wa wazo la kubomoa, na utata halisi wa “kwa Mungu” vikihifadhiwa. Alama zote za tanbihi zimewekwa moja kwa moja baada ya maneno yanayohusika.
