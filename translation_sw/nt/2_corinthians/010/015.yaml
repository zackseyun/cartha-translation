source:
  edition: SBLGNT
  text: οὐκ εἰς τὰ ἄμετρα καυχώμενοι ἐν ἀλλοτρίοις κόποις, ἐλπίδα δὲ ἔχοντες αὐξανομένης τῆς πίστεως ὑμῶν ἐν ὑμῖν μεγαλυνθῆναι κατὰ τὸν κανόνα ἡμῶν εἰς περισσείαν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/015.yaml
  text: not boasting beyond measure in the labors of others, but having hope that, as your faith is growing among you, we will be enlarged according to our sphere of ministry, unto abundance,
translation:
  language: sw
  text: Bila kujisifu kupita kiasi kwa kazi za wengine, tuna tumaini kwamba, imani yenu inapokua, tupanuliwe miongoni mwenu[b], kufuatana na eneo tulilopangiwa[a], kwa wingi zaidi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kulingana na kipimo tulichopewa” au “kulingana na kanuni/kiwango chetu.” Neno la Kigiriki κανών hapa linamaanisha upeo au eneo la kazi lililopangiwa.
    reason: lexical_alternative
  - marker: b
    text: Kwa karibu zaidi, “tukuzwe” au “tupanuliwe sana.” Katika muktadha, huenda ikamaanisha kupanuka kwa kazi ya Paulo na wenzake; inaweza pia kumaanisha kwamba wao wataheshimiwa zaidi. Maneno “miongoni mwenu” yanaweza pia kuhusishwa na “imani yenu inapokua.”
    reason: alternative_reading
  - marker: c
    text: Au “kwa kiwango kikubwa zaidi” au “kwa upanuzi zaidi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ εἰς τὰ ἄμετρα καυχώμενοι
  choice: Hatujisifii kupita mipaka
  rationale: Kauli hii inadumisha wazo la kujisifu huku ikieleza kwa Kiswahili cha kawaida mfano wa kuvuka kipimo au mipaka inayofaa.
- source_word: ἐν ἀλλοτρίοις κόποις
  choice: kwa kazi ngumu za wengine
  rationale: κόποις ni kazi yenye taabu au juhudi kubwa, na ἀλλοτρίοις inaonyesha kuwa kazi hiyo ni ya watu wengine; Paulo hakudai sifa kwa kazi yao.
- source_word: ἐλπίδα δὲ ἔχοντες
  choice: Badala yake, tuna tumaini kwamba
  rationale: Ujenzi wa nomino ἐλπίδα umehifadhiwa kwa kauli ya asili ya Kiswahili, “tuna tumaini.”
- source_word: αὐξανομένης τῆς πίστεως ὑμῶν
  choice: imani yenu inapozidi kukua
  rationale: Genitivi huru inaelezwa kwa kishazi cha wakati; πίστις hapa ina maana ya imani ya Wakorintho.
- source_word: ἐν ὑμῖν μεγαλυνθῆναι
  choice: kazi yetu itapanuka sana miongoni mwenu
  rationale: Tafsiri hii inaeleza kwa lugha ya kawaida picha ya kupanuliwa kwa shughuli ya kitume katika muktadha wa maeneo ya huduma. “Miongoni mwenu” imeunganishwa na upanuzi huo kulingana na mpangilio wa karibu wa Kigiriki, bila kukataa uwezekano wa kuihusisha na ukuaji wa imani.
- source_word: κατὰ τὸν κανόνα ἡμῶν
  choice: kulingana na eneo tulilopimiwa
  rationale: κανών hapa ni eneo au upeo uliopimwa na kupewa kwa kazi, si ‘kanuni’ wala ‘kanoni’ kwa maana ya baadaye ya kidini.
- source_word: εἰς περισσείαν
  choice: na kufikia mbali zaidi
  rationale: Kauli hii ya mwelekeo inaonyesha ongezeko au upanuzi mkubwa zaidi; Kiswahili hiki kinaunganisha maana hiyo na muktadha wa kwenda kufanya kazi kwingine.
theological_decisions:
- issue: Maana ya μεγαλυνθῆναι kuhusu mamlaka na kazi ya kitume
  choice: Imeelezwa kuwa kazi ya Paulo itapanuka sana, si kwamba Paulo binafsi atajitukuza.
  alternative: Paulo mwenyewe atakuzwa au kuheshimiwa zaidi na Wakorintho.
  rationale: Muktadha wa mistari 13–16 unahusu mipaka ya eneo la kazi, kutodai kazi ya wengine, na kutazamia kufika maeneo ya mbali. Hata hivyo, tanbihi inahifadhi maana ya karibu zaidi ya kitenzi, ‘tutakuzwa.’
- issue: Maana ya κανών
  choice: eneo tulilopimiwa
  alternative: kanuni, kipimo chetu, au eneo letu la huduma
  rationale: Katika muktadha huu neno hilo linaashiria eneo lililopimwa au kugawiwa kwa kazi ya kitume, bila kuingiza maana ya baadaye ya kanoni ya Maandiko.
- issue: Uhusiano wa ἐν ὑμῖν
  choice: Imehusishwa na kupanuka kwa kazi miongoni mwa Wakorintho.
  alternative: Inaweza kuhusishwa na imani inayokua miongoni mwao.
  rationale: Mpangilio wa maneno unaweka ἐν ὑμῖν karibu na μεγαλυνθῆναι, lakini muundo wa Kigiriki unaweza kuruhusu uhusiano mwingine; tanbihi inalinda utata huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Kauli “kazi yetu itapanuka” imechaguliwa badala ya “tutapanuliwa,” ambayo ingekuwa ngumu na isiyo ya kawaida kwa wasomaji wengi; tanbihi huhifadhi umbo la karibu zaidi na utata wa Kigiriki. Sentensi imegawanywa kwa usomaji wazi bila kuvunja hoja ya kifungu.
