  text: ἔκρινα ⸀γὰρ ἐμαυτῷ τοῦτο, τὸ μὴ πάλιν ἐν λύπῃ πρὸς ὑμᾶς ἐλθεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/001.yaml
  text: 'For I decided this for myself: not to come to you again in sorrow[a].'
translation:
  language: sw
  text: 'Kwa maana niliamua hivi moyoni mwangu: nisije kwenu tena katika huzuni[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa huzuni.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκρινα
  choice: niliamua
  rationale: Kitenzi hiki katika muktadha huu kinaonyesha uamuzi wa Paulo uliokuwa umefikiwa baada ya kutafakari; “niliamua” ni Kiswahili cha kawaida na cha moja kwa moja.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Kiunganishi hiki kinaeleza msingi wa maneno yaliyotangulia; “Kwa maana” kinadumisha uhusiano huo wa ufafanuzi.
- source_word: ἐμαυτῷ
  choice: moyoni mwangu
  rationale: Hapa dative ya kujirejelea inaonyesha uamuzi wa ndani na wa binafsi. “Moyoni mwangu” ni usemi wa asili wa Kiswahili bila kudokeza kwamba Paulo alifanya uamuzi kwa manufaa yake.
- source_word: τοῦτο
  choice: hivi
  rationale: Kiwakilishi hiki kinaelekeza mbele kwenye yaliyomo katika uamuzi; “hivi” hufuatiwa kwa kawaida na maelezo baada ya alama ya nukta mbili.
- source_word: τὸ μὴ ... ἐλθεῖν
  choice: nisije
  rationale: Muundo huu unaeleza yaliyomo katika uamuzi. “Nisije” ni wa asili katika Kiswahili na huhifadhi nafsi ya kwanza pamoja na ukanushi.
- source_word: πάλιν
  choice: tena
  rationale: Neno hili linaonyesha kurudiwa kwa tendo; “tena” ndilo chaguo la kawaida na wazi.
- source_word: ἐν λύπῃ
  choice: katika huzuni
  rationale: Tafsiri hii inadumisha kwa karibu muundo wa kihusishi na huacha wazi ikiwa huzuni ilikuwa hali ya Paulo au hali ambayo ziara yake ingeleta.
- source_word: πρὸς ὑμᾶς
  choice: kwenu
  rationale: Pamoja na kitenzi cha kuja, fungu hili huonyesha mwendo kuelekea kwa watu; “kwenu” ni Kiswahili fasaha na cha kawaida.
theological_decisions:
- issue: Maana ya ἐν λύπῃ
  choice: katika huzuni
  alternative: kwa huzuni
  rationale: Kirai cha Kigiriki kinaweza kueleza kuja katika hali ya huzuni au kuja kukiwa na huzuni. Matini kuu inadumisha upana huo kadiri iwezekanavyo, na tanbihi inatoa mbadala wa kiasili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi unadumisha kiunganishi cha ufafanuzi na mpangilio wa uamuzi unaoelezwa baada ya nukta mbili.
