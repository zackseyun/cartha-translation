  text: οὐκ ἔσχηκα ἄνεσιν τῷ πνεύματί μου τῷ μὴ εὑρεῖν με Τίτον τὸν ἀδελφόν μου, ἀλλὰ ἀποταξάμενος αὐτοῖς ἐξῆλθον εἰς Μακεδονίαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/013.yaml
  text: I had no rest in my spirit because I did not find Titus my brother[a], but after taking leave of them[c][b], I went on to Macedonia.
translation:
  language: sw
  text: Sikuwa na utulivu rohoni mwangu kwa sababu sikumkuta Tito, ndugu yangu.[a] Lakini baada ya kuwaaga, niliondoka kwenda Makedonia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ndugu yangu” hapa humaanisha kwamba Tito alikuwa mwamini mwenzake Paulo na mfanyakazi mwenzake katika huduma.
    reason: cultural_note
lexical_decisions:
- source_word: οὐκ ἔσχηκα
  choice: Sikuwa na
  rationale: Ingawa kitenzi cha Kigiriki kiko katika wakati timilifu, muktadha wa simulizi unaeleza hali iliyotangulia kuondoka kwa Paulo; wakati uliopita ni wa kawaida na wazi katika Kiswahili.
- source_word: ἄνεσιν
  choice: utulivu
  rationale: Hapa neno linaeleza kukosa pumziko au faraja ya ndani. “Utulivu” huunda kirai cha asili cha Kiswahili pamoja na “rohoni mwangu” bila kuifanya maana kuwa ya kimwili.
- source_word: τῷ πνεύματί μου
  choice: rohoni mwangu
  rationale: Huhifadhi maana ya eneo au hali ya ndani inayowezekana katika dative ya Kigiriki, bila kuamua kwamba πνεῦμα inamaanisha tu hisia au akili.
- source_word: τῷ μὴ εὑρεῖν με Τίτον
  choice: kwa sababu sikumkuta Tito
  rationale: Kirai cha infinitivu chenye μή kinaonyesha sababu ya Paulo kukosa utulivu. “Sikumkuta” ni tafsiri ya karibu na ya kawaida kuliko kuongeza wazo la kushindwa kumtafuta.
- source_word: τὸν ἀδελφόν μου
  choice: ndugu yangu
  rationale: Huhifadhi picha ya kifamilia ya Paulo. Katika Kiswahili, “ndugu” linaweza kumaanisha pia mwamini mwenzao na mshiriki katika huduma.
- source_word: ἀποταξάμενος αὐτοῖς
  choice: baada ya kuwaaga watu wa huko
  rationale: Kitenzi kinaonyesha kuagana kabla ya kuondoka. “Watu wa huko” linaweka wazi kiwakilishi αὐτοῖς, ambacho katika muktadha kinawarejelea watu wa Troa, bila kuwaingiza katika mstari kwa jina.
- source_word: ἐξῆλθον εἰς Μακεδονίαν
  choice: niliondoka kwenda Makedonia
  rationale: Huwasilisha kwa Kiswahili cha kawaida wazo la kuondoka na kuelekea Makedonia, bila tafsiri ngumu ya neno kwa neno.
theological_decisions:
- issue: Maana ya πνεῦμα katika “τῷ πνεύματί μου”
  choice: rohoni mwangu
  alternative: moyoni mwangu
  rationale: “Rohoni mwangu” hudumisha istilahi ya chanzo na uwezekano wake mpana. “Moyoni mwangu” ingeelekeza zaidi kwenye hisia na hivyo kupunguza utata halisi wa neno.
- issue: Utambulisho wa Tito kama ἀδελφός
  choice: ndugu yangu, pamoja na tanbihi
  alternative: ndugu yangu katika imani na mfanyakazi mwenzangu
  rationale: Matini yenyewe inasema “ndugu yangu.” Ufafanuzi wa uhusiano wa kiimani na huduma unawekwa katika tanbihi badala ya kupanua matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa asili kwa wasomaji wa kawaida, huku sitiari ya “ndugu” na utata wa “roho” vikihifadhiwa. Alama ya tanbihi [a] imewekwa baada ya kirai kinachofafanuliwa.
