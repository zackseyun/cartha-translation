  text: ἵνα μὴ πλεονεκτηθῶμεν ὑπὸ τοῦ Σατανᾶ, οὐ γὰρ αὐτοῦ τὰ νοήματα ἀγνοοῦμεν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/011.yaml
  text: so that we would not be outwitted by Satan[b][a], for we are not ignorant of his schemes.
translation:
  language: sw
  text: ili tusije tukadhulumiwa na Shetani[a], kwa maana tunazifahamu hila zake[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “tusije tukazidiwa ujanja” au “tusije tukatumiwa vibaya.”
    reason: lexical_alternative
  - marker: b
    text: Au “mipango,” “makusudi,” au “mawazo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα μή
  choice: ili ... asije
  rationale: Muundo huu unaonyesha kusudi la kuzuia jambo lisitokee na unasikika kwa kawaida katika Kiswahili.
- source_word: πλεονεκτηθῶμεν
  choice: akatutumia kwa faida yake
  rationale: Kitenzi hiki katika hali ya kutendwa kina wazo la mtu kutumia mwingine vibaya ili ajipatie faida; tafsiri hii haikifungi kwenye udanganyifu wa kiakili pekee.
- source_word: Σατανᾶ
  choice: Shetani
  rationale: Hili ndilo umbo la jina hili lililozoeleka katika Kiswahili.
- source_word: γάρ
  choice: kwa maana
  rationale: Huanzisha sababu inayoeleza sentensi iliyotangulia.
- source_word: νοήματα
  choice: hila
  rationale: Katika muktadha huu ni mawazo au mipango yenye nia mbaya; “hila” linaonyesha mkakati wa udanganyifu bila kubainisha mno namna yake.
- source_word: ἀγνοοῦμεν
  choice: hatukosi kuzijua
  rationale: Litotes ya Kigiriki imehifadhiwa kwa kiasi katika usemi wa Kiswahili unaomaanisha kwamba tunazijua.
