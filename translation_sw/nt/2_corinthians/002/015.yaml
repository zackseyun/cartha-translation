id: 2CO.2.15
reference: 2 Corinthians 2:15
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὅτι Χριστοῦ εὐωδία ἐσμὲν τῷ θεῷ ἐν τοῖς σῳζομένοις καὶ ἐν τοῖς ἀπολλυμένοις,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/015.yaml
  text: For we are the aroma of Messiah to God among those who are being saved and among those who are perishing[b][a],
translation:
  language: sw
  text: Kwa maana sisi ni harufu nzuri ya Masihi kwa Mungu, miongoni mwa wale wanaookolewa na miongoni mwa wale wanaoangamia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “harufu nzuri ya Kristo.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: Kwa maana
  rationale: Inaonyesha kuwa kauli hii inaeleza sababu ya kauli iliyotangulia; “Kwa maana” ni ya kawaida na inahifadhi uhusiano huo wa maelezo.
- source_word: Χριστοῦ
  choice: ya Masihi
  rationale: Genitivi inaonyesha kwamba harufu hiyo ni ya Masihi au inamwakilisha. “Masihi” linahifadhi wazi maana ya cheo cha Χριστός.
- source_word: εὐωδία
  choice: harufu nzuri
  rationale: Neno hili humaanisha harufu yenye kupendeza. “Harufu nzuri” ni Kiswahili cha kawaida kinachohifadhi taswira ya kunusa bila kuongeza maelezo yasiyokuwapo.
- source_word: τῷ θεῷ
  choice: kwa Mungu
  rationale: Dativi inaonyesha uhusiano au mwelekeo wa harufu hiyo kwa Mungu; “kwa Mungu” linafuata muundo wa Kigiriki bila kuamua kuwa maana ni “mbele za Mungu.”
- source_word: ἐν τοῖς σῳζομένοις
  choice: miongoni mwa wale wanaookolewa
  rationale: “Miongoni mwa” linafaa kwa muktadha wa watu, na kitenzi cha wakati uliopo kinaonyesha tendo au hali inayoendelea.
- source_word: ἐν τοῖς ἀπολλυμένοις
  choice: miongoni mwa wale wanaoangamia
  rationale: Urejeaji wa “miongoni mwa” unaakisi urudiaji wa ἐν, na “wanaoangamia” linahifadhi mchakato unaoendelea bila kubainisha namna ya maangamizi.
theological_decisions:
- issue: Hali inayoendelea katika σῳζομένοις na ἀπολλυμένοις
  choice: “wale wanaookolewa” na “wale wanaoangamia”
  alternative: “waliookolewa” na “waliopotea”
  rationale: Vitenzi vya Kigiriki vya wakati uliopo vinaonyesha hali au mchakato unaoendelea. Tafsiri haivibadili kuwa makundi yenye matokeo yaliyokamilika.
- issue: Χριστός kama cheo au umbo lililozoeleka kama jina
  choice: Masihi
  alternative: Kristo
  rationale: Katika muundo huu wa genitivi, maana ya cheo bado inaweza kusikika. “Masihi” huiweka wazi, huku tanbihi ikitaja namna nyingine ya kawaida ya kulitafsiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Urudiaji wa “miongoni mwa” umehifadhiwa ili kuonyesha uwiano wa vifungu viwili vya Kigiriki.
