id: 2CO.2.5
reference: 2 Corinthians 2:5
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Εἰ δέ τις λελύπηκεν, οὐκ ἐμὲ λελύπηκεν, ἀλλὰ ἀπὸ μέρους ἵνα μὴ ἐπιβαρῶ πάντας ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/005.yaml
  text: But if anyone has caused grief[a], he has grieved not me, but in part all of you—to some extent[b], so that I may not overstate it.
translation:
  language: sw
  text: Lakini ikiwa mtu yeyote amesababisha huzuni, hakunihuzunisha mimi, bali amewahuzunisha ninyi nyote kwa kiasi fulani—ili nisije nikawalemesha kupita kiasi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “... bali ninyi nyote kwa sehemu, ili nisije nikawalemesha kupita kiasi.” Kirai “kwa sehemu” kinaweza kuhusishwa na tahadhari ya Paulo ya kutowalemesha wote kupita kiasi.
    reason: lexical_alternative
lexical_decisions:
- source_word: λελύπηκεν
  choice: amesababisha huzuni / hakunihuzunisha
  rationale: Muundo wa wakati timilifu unaonyesha tendo lililotokea ambalo athari yake bado ipo. Maneno haya mawili yanadumisha uhusiano wa kimsamiati wa λυπέω huku yakisomeka kwa kawaida katika Kiswahili.
- source_word: οὐκ ἐμὲ
  choice: hakunihuzunisha mimi
  rationale: Huhifadhi ukanushaji na mkazo wa kiwakilishi cha Kigiriki bila kuongeza maana ya 'mimi binafsi'.
- source_word: ἀπὸ μέρους
  choice: kwa kiasi fulani
  rationale: Kirai hiki kinaweza kuhusishwa na kiwango cha huzuni iliyowapata wote; tafsiri hii ni ya kawaida na huhifadhi hali yake ya kupunguza uzito wa kauli.
- source_word: ἐπιβαρῶ
  choice: nikawatia ... mzigo mzito mno
  rationale: Huhifadhi taswira ya kuweka mzigo na inaonyesha kwamba Paulo hataki kueleza jambo hilo kwa uzito uliopita kiasi.
- source_word: πάντας ὑμᾶς
  choice: ninyi nyote
  rationale: Huhifadhi wazi maana jumuishi ya πάντας na hali ya hotuba inayoelekezwa kwa jumuiya nzima.
theological_decisions:
- issue: Uhusiano wa ἀπὸ μέρους na ἵνα μὴ ἐπιβαρῶ πάντας ὑμᾶς
  choice: kwa kiasi fulani ninyi nyote—nisije nikawatia ninyi nyote mzigo mzito mno
  alternative: kwa sehemu—ili nisiwatie ninyi nyote mzigo
  rationale: 'Sintaksia ya Kigiriki inaweza kueleweka kwa njia zaidi ya moja: Paulo anaweza kuwa anastahili huzuni iliyowapata wote, au anaweza kuwa anasema ''kwa sehemu'' ili asiwalemee wote. Matini kuu inatoa usomaji wa kawaida huku tanbihi ikihifadhi uwezekano mwingine.'
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inadumisha ulinganifu wa maneno yanayotokana na λυπέω na pia taswira ya mzigo katika ἐπιβαρῶ, bila kuficha utata wa muundo wa Kigiriki.
