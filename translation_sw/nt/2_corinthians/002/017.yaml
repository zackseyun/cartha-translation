  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οὐ γάρ ἐσμεν ὡς οἱ ⸀πολλοὶ καπηλεύοντες τὸν λόγον τοῦ θεοῦ, ἀλλ’ ὡς ἐξ εἰλικρινείας, ἀλλ’ ὡς ἐκ θεοῦ ⸀κατέναντι θεοῦ ἐν Χριστῷ λαλοῦμεν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/017.yaml
  text: For we are not like the many[a], peddling the word of God, but as from sincerity, but as from God[f][e][d][c][b], before God we speak in Messiah.
translation:
  language: sw
  text: Kwa maana sisi si kama wale wengi[a] wanaolifanya neno la Mungu kuwa biashara[b], bali tunasema kwa unyofu[c], kama kutoka kwa Mungu, mbele za Mungu[d], katika Masihi[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watu wengi” au “wengine wengi sana.”
    reason: lexical_alternative
  - marker: b
    text: Usemi huu unaweza pia kudokeza kulichanganya au kulipotosha neno ili kupata faida.
    reason: lexical_alternative
  - marker: c
    text: Kwa karibu zaidi, “kutokana na unyofu.”
    reason: lexical_alternative
  - marker: d
    text: Au “machoni pa Mungu” au “katika uwepo wa Mungu.”
    reason: lexical_alternative
  - marker: e
    text: 'Usemi wa jadi: “katika Kristo.”'
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ πολλοί
  choice: wale wengi
  rationale: Huhifadhi muundo wenye kibainishi na utofautishaji wa Paulo bila kuufanya useme kitakwimu kwamba ni watu walio wengi zaidi.
- source_word: καπηλεύοντες
  choice: wanaofanya biashara kwa
  rationale: Huhifadhi picha ya wafanyabiashara wanaotumia ujumbe kwa manufaa yao; tanbihi inaonyesha kuwa kitenzi kinaweza pia kudokeza kuchanganya au kupotosha bidhaa ili kupata faida.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: neno la Mungu
  rationale: Ni tafsiri ya moja kwa moja na inayotambulika ya muundo wa Kigiriki.
- source_word: ἐξ εἰλικρινείας
  choice: kwa unyofu
  rationale: Ni Kiswahili cha asili kinachoeleza kusema kwa moyo safi na bila hila; tanbihi huhifadhi maana ya chanzo inayoweza kutafsiriwa 'kutokana na unyofu'.
- source_word: ἐκ θεοῦ
  choice: kama watu watokao kwa Mungu
  rationale: Hurejesha nguvu ya ὡς na chanzo kinachoonyeshwa na ἐκ kwa Kiswahili kinachoeleweka.
- source_word: κατέναντι θεοῦ
  choice: mbele za Mungu
  rationale: Hueleza uwajibikaji na kusema katika uwepo au machoni pa Mungu bila ufafanuzi wa ziada.
- source_word: ἐν Χριστῷ
  choice: katika Masihi
  rationale: Hutafsiri Χριστός kama cheo cha Mtiwa-Mafuta na kuhifadhi muundo wa Paulo wa kuwa au kutenda 'katika' yeye.
- source_word: λαλοῦμεν
  choice: tunasema
  rationale: Huwakilisha kitenzi cha wakati wa sasa bila kukiongeza nguvu na kukifanya 'tunahubiri'.
theological_decisions:
- issue: Maana ya ἐν Χριστῷ
  choice: katika Masihi
  alternative: katika Kristo
  rationale: Masihi huhifadhi maana ya cheo Χριστός badala ya kukitumia tu kama jina, huku tanbihi ikitoa usemi wa jadi unaojulikana.
- issue: Uhusiano wa ἐξ εἰλικρινείας na ἐκ θεοῦ
  choice: kwa unyofu, kama watu watokao kwa Mungu
  alternative: kama kutokana na unyofu, na kama kutoka kwa Mungu
  rationale: Tafsiri kuu ni ya asili kwa Kiswahili na bado hutenganisha sifa ya unyofu na asili ya utume kutoka kwa Mungu; tanbihi huhifadhi ulinganifu wa karibu zaidi wa vihusishi vya Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imegawanywa baada ya shtaka la kufanya biashara ili kupunguza msongamano bila kupoteza uhusiano wa hoja. 'Mbele za Mungu' ni usemi wa kawaida wa kibiblia lakini bado unaeleweka kwa wasomaji wa leo.
