id: 2CO.2.12
reference: 2 Corinthians 2:12
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἐλθὼν δὲ εἰς τὴν Τρῳάδα εἰς τὸ εὐαγγέλιον τοῦ Χριστοῦ καὶ θύρας μοι ἀνεῳγμένης ἐν κυρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/012.yaml
  text: When I came to Troas for the gospel of Messiah[a], and a door had been opened for me in the Lord[b],
translation:
  language: sw
  text: Nilipofika Troa kwa ajili ya injili ya Masihi[a], na mlango ukiwa umefunguliwa kwa ajili yangu katika Bwana[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “injili ya Kristo.”'
    reason: lexical_alternative
  - marker: b
    text: 'Au: “na mlango ulikuwa wazi kwa ajili yangu katika Bwana.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐλθὼν δὲ
  choice: Nilipofika
  rationale: Kirai tegemezi cha wakati huingiza mazingira ya simulizi; kiunganishi δέ ni mpito hafifu ambao mtiririko wa Kiswahili hauhitaji uutajwe kwa neno tofauti hapa.
- source_word: εἰς τὴν Τρῳάδα
  choice: Troa
  rationale: Jina la mahali limetolewa kwa umbo la Kiswahili linalotumika katika tafsiri za Biblia; kiambishi cha kitenzi 'ku-' tayari kinaonyesha kufika mahali.
- source_word: εἰς τὸ εὐαγγέλιον
  choice: kwa ajili ya injili
  rationale: εἰς inaonyesha kusudi. Tafsiri hii hailiongezi wazo la 'kuhubiri,' ambalo halijasemwa wazi katika Kigiriki.
- source_word: τοῦ Χριστοῦ
  choice: ya Masihi
  rationale: Χριστός hapa inafanya kazi kama cheo cha Mtiwa-Mafuta; 'Masihi' huonyesha maana hiyo huku ikihifadhi uhusiano mpana wa kimilikishi wa genitivi.
- source_word: θύρας
  choice: mlango
  rationale: Taswira halisi ya mlango imehifadhiwa badala ya kufasiri moja kwa moja kuwa 'fursa.'
- source_word: ἀνεῳγμένης
  choice: ukiwa umefunguliwa
  rationale: Kauli timilifu tendwa inaonyesha tendo lililokwisha kutokea na hali inayoendelea kutokana nalo.
- source_word: ἐν κυρίῳ
  choice: katika Bwana
  rationale: Huhifadhi usemi wa Paulo na kutolazimisha maana ya ala, kama 'na Bwana,' ingawa maana hiyo inaweza kueleweka katika muktadha.
theological_decisions:
- issue: Maana ya Χριστοῦ
  choice: Masihi
  alternative: Kristo
  rationale: Katika muktadha huu neno linabeba kwa kawaida cheo cha Mtiwa-Mafuta; 'Masihi' huhifadhi maana hiyo bila kulifanya jina tu.
- issue: Uhusiano wa ἐν κυρίῳ na kufunguliwa kwa mlango
  choice: katika Bwana
  alternative: na Bwana
  rationale: Tafsiri ya moja kwa moja huhifadhi upeo wa maana wa kirai, iwe kinahusu utendaji wa Bwana au fursa iliyo katika uhusiano naye, bila kuamua kimya kimya kati ya uwezekano huo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Sentensi imeachwa ikiendelea kwa koma kwa sababu mstari huu ni sehemu ya sentensi inayokamilishwa katika mstari unaofuata.
