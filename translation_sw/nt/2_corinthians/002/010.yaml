  text: ᾧ δέ τι χαρίζεσθε, κἀγώ· καὶ γὰρ ἐγὼ ⸂ὃ κεχάρισμαι, εἴ τι⸃ κεχάρισμαι, δι’ ὑμᾶς ἐν προσώπῳ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/010.yaml
  text: To anyone whom you forgive anything[a], I do too. For what I have forgiven—if I have forgiven anything—I have forgiven for your sake in the presence of Messiah,
translation:
  language: sw
  text: Lakini mtu yeyote mnayemsamehe jambo lolote, nami pia ninamsamehe. Kwa maana, nilichosamehe—ikiwa nimesamehe jambo lolote—nimekisamehe kwa ajili yenu mbele ya Masihi[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika nafasi ya Masihi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: χαρίζεσθε / κεχάρισμαι
  choice: mnayemsamehe / nilichosamehe / nimekisamehe
  rationale: Katika muktadha wa nidhamu na kumrejesha aliyekosea, kitenzi hiki kinamaanisha kuachilia kosa, hivyo ‘kusamehe’ ndilo neno la kawaida na sahihi zaidi.
- source_word: ᾧ ... τι
  choice: Mtu yeyote ... jambo lolote
  rationale: Muundo huu unaonyesha mtu anayepokea msamaha na jambo lisilotajwa wazi; tafsiri hii inahifadhi upeo wake usiofungwa huku ikisomeka kwa kawaida katika Kiswahili.
- source_word: κἀγώ
  choice: nami pia ninamsamehe
  rationale: Huhifadhi maana ya Paulo kwamba anajiunga na msamaha wa Wakorintho; kitenzi kimerudiwa ili sentensi iwe wazi na ya kawaida kwa Kiswahili.
- source_word: ὃ κεχάρισμαι, εἴ τι κεχάρισμαι
  choice: nilichosamehe—ikiwa nimesamehe jambo lolote—
  rationale: Huhifadhi kauli ya Paulo yenye tahadhari na sehemu ya kati iliyo kama dokezo la pembeni, bila kuondoa mvutano wake.
- source_word: δι’ ὑμᾶς
  choice: kwa ajili yenu
  rationale: Katika muktadha huu διά pamoja na hali ya accusative inaonyesha kusudi au manufaa yanayowalenga Wakorintho.
- source_word: ἐν προσώπῳ Χριστοῦ
  choice: mbele ya Masihi
  rationale: πρόσωπον inaweza kumaanisha uso, uwepo, au nafsi. ‘Mbele ya’ inaeleza kwa lugha ya kawaida tendo linalofanywa katika uwepo na chini ya uangalizi wa Masihi, huku maana nyingine ikiwekwa katika tanbihi.
- source_word: Χριστοῦ
  choice: Masihi
  rationale: Χριστός hapa imehifadhiwa kama cheo cha yule aliyetiwa mafuta, badala ya kutumiwa kama jina tu.
theological_decisions:
- issue: Ikiwa Χριστοῦ itafsiriwe kama cheo au itumike kwa namna ya jina la kimapokeo.
  choice: Masihi
  alternative: Kristo
  rationale: Neno la Kigiriki lina asili na nguvu ya cheo, na hakuna jambo katika mstari huu linalolazimisha litumike kama jina tu.
- issue: Maana ya ἐν προσώπῳ Χριστοῦ.
  choice: mbele ya Masihi
  alternative: katika nafsi ya Masihi
  rationale: Kifungu kinaweza kueleweka kuwa Paulo anasamehe akiwa katika uwepo wa Masihi, au kwa namna inayohusishwa na nafsi/uwakilishi wake. Maandishi makuu yanatumia maana ya kawaida zaidi na tanbihi inalinda uwezekano mwingine.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Marudio ya ‘kusamehe’ na kauli ya masharti yamehifadhiwa ili kutolainisha muundo wa Kigiriki kupita kiasi. Alama ya koma mwishoni imehifadhiwa kwa sababu wazo linaendelea katika mstari unaofuata.
