base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/009.yaml
  text: 'For this is why I also wrote: so that I might know the proof of you[a], whether you are obedient in everything.'
translation:
  language: sw
  text: 'Kwa maana niliandika pia kwa kusudi hili: ili nijue uthibitisho wenu[a], kama mnatii katika mambo yote.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “matokeo ya kujaribiwa kwenu,” au “tabia yenu iliyothibitishwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς τοῦτο γὰρ
  choice: Kwa maana ... kwa kusudi hili
  rationale: Inaonyesha sababu na kusudi la Paulo kwa Kiswahili cha kawaida bila kupoteza nguvu ya γάρ na εἰς τοῦτο.
- source_word: καὶ ἔγραψα
  choice: niliandika pia
  rationale: ‘Pia’ huhifadhi maana ya nyongeza ya καί, na wakati uliopita hutoa aoristi kwa kawaida.
- source_word: ἵνα γνῶ
  choice: ili nijue
  rationale: Huhifadhi kishazi cha kusudi na maana ya kufikia kujua.
- source_word: τὴν δοκιμὴν ὑμῶν
  choice: uthibitisho wenu
  rationale: δοκιμή inaweza kumaanisha jaribio, uthibitisho unaotokana na jaribio, au sifa iliyothibitishwa. ‘Uthibitisho wenu’ huhifadhi ufupi na kiwango cha kutokuwa wazi cha Kigiriki.
- source_word: εἰ εἰς πάντα ὑπήκοοί ἐστε
  choice: kama mnatii katika mambo yote
  rationale: ‘Kama’ hapa huleta swali lisilo la moja kwa moja baada ya ‘nijue,’ huku ‘katika mambo yote’ ikihifadhi upana wa εἰς πάντα.
theological_decisions: []
