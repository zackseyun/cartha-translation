  source_fidelity: 'Tafsiri inafuata kwa uaminifu muundo na maana ya Kigiriki: «Kwa maana» huonyesha γάρ; «pia» huwakilisha καί; «kwa kusudi hili» huhifadhi εἰς τοῦτο; na «ili nijue» huonyesha kusudi katika ἵνα γνῶ. «Uthibitisho wenu» ni tafsiri inayokubalika kwa δοκιμή ὑμῶν na, pamoja na tanbihi, huhifadhi wigo kati ya jaribio, uthibitisho, na tabia iliyojaribiwa. «Kama mnatii katika mambo yote» hutoa vizuri swali lisilo la moja kwa moja la εἰ baada ya «nijue» na upeo wa εἰς πάντα.'
