  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo umewekwa karibu na hoja ya Kigiriki huku tanbihi ikihifadhi upana wa maana ya δοκιμή.
