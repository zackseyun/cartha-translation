  yaml_path: translation/nt/2_corinthians/002/002.yaml
  text: For if I grieve you[a], who is there to make me glad except the one who is grieved by me?
translation:
  language: sw
  text: Kwa maana ikiwa mimi ninawahuzunisha, ni nani anayenifurahisha isipokuwa yule anayehuzunishwa kwa sababu yangu[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “yule anayehuzunishwa nami.” Kirai cha Kigiriki kinaweza kuonyesha chanzo au kisababishi: “nami” au “kwa sababu yangu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: λυπῶ
  choice: ninawahuzunisha
  rationale: Kitenzi hiki huonyesha kusababisha huzuni. Muundo wa Kiswahili ni wa moja kwa moja, wa kawaida, na unadumisha nguvu ya kisababishi pamoja na hali ya wakati uliopo.
- source_word: εὐφραίνων
  choice: anayenifurahisha
  rationale: Kivumishi-jina hiki kinamtaja mtu anayemletea Paulo furaha. Tafsiri hii ni ya asili na inadumisha ulinganifu na ‘ninawahuzunisha.’
- source_word: τίς ὁ εὐφραίνων με
  choice: ni nani anayenifurahisha
  rationale: Muundo huu unawasilisha swali la balagha kwa Kiswahili cha kawaida huku ukihifadhi maana ya kivumishi-jina cha Kigiriki.
- source_word: ὁ λυπούμενος
  choice: yule anayehuzunishwa
  rationale: Kauli tendwa ya Kigiriki na hali yake ya wakati uliopo zimehifadhiwa bila kuibadili kuwa kauli tendwa ya wakati uliopita.
- source_word: ἐξ ἐμοῦ
  choice: kwa sababu yangu
  rationale: Kirai hiki kinaweza kuonyesha chanzo au kisababishi. ‘Kwa sababu yangu’ ni cha asili katika Kiswahili na hakifichi uhusiano wa kisababishi; tafsiri ya karibu zaidi ya wakala imewekwa katika tanbihi.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Huonyesha kuwa sentensi hii inatoa sababu au maelezo yanayounganika na hoja iliyotangulia.
- source_word: ἐγώ
  choice: mimi
  rationale: Kiwakilishi kilichotajwa wazi katika Kigiriki kimehifadhiwa ili kuonyesha msisitizo kwa Paulo kama anayesababisha huzuni.
theological_decisions:
- issue: Uhusiano unaoonyeshwa na ἐξ ἐμοῦ
  choice: kwa sababu yangu
  alternative: nami
  rationale: Kigiriki kinaweza kueleweka kwa upande wa chanzo/kisababishi au kwa kumtaja Paulo kama wakala. Maandishi makuu yanatumia Kiswahili cha asili kinachoonyesha kisababishi, huku tanbihi ikihifadhi uwezekano wa kauli ya wakala bila kulazimisha tofauti ya kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima, na inayoeleweka kwa urahisi. Swali la balagha, kauli tendwa, na mvutano kati ya chanzo na kisababishi vimehifadhiwa.
