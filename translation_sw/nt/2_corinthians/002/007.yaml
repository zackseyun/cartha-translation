base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/007.yaml
  text: so that[a], on the contrary, you should rather forgive and comfort him[b], so that such a person may not be overwhelmed by excessive sorrow.
translation:
  language: sw
  text: Kinyume chake, afadhali mumsamehe[a] na kumfariji, ili mtu huyo asije akalemewa[b] na huzuni kubwa mno.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mumsamehe kwa neema”; kitenzi hiki kinahusiana na kuonyesha neema au fadhili.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “asije akamezwa na huzuni kubwa mno.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοὐναντίον
  choice: Kinyume chake
  rationale: Inaonyesha wazi kugeuzwa kwa hatua iliyotarajiwa na inasikika kwa kawaida katika Kiswahili sanifu.
- source_word: μᾶλλον
  choice: afadhali
  rationale: Inahifadhi wazo la kwamba hatua inayofaa zaidi sasa ni kusamehe na kufariji.
- source_word: χαρίσασθαι
  choice: mumsamehe
  rationale: Katika muktadha wa kumrejesha mtu baada ya kuadhibiwa, maana inayofaa zaidi ni kumsamehe; uhusiano wa kitenzi hiki na neema umeelezwa katika tanbihi.
- source_word: παρακαλέσαι
  choice: kumfariji
  rationale: Muktadha wa huzuni unaunga mkono maana ya kumpa faraja, ingawa kitenzi hicho pia kinaweza kumaanisha kumtia moyo.
- source_word: καταποθῇ
  choice: akalemewa
  rationale: Ni usemi wa kawaida unaowasilisha hali ya huzuni kumshinda mtu, huku sitiari halisi ya ‘kumezwa’ ikihifadhiwa katika tanbihi.
- source_word: ὁ τοιοῦτος
  choice: mtu huyo
  rationale: Inarejelea mtu wa aina iliyotajwa bila kuongeza jinsia au maelezo yasiyokuwamo wazi katika usemi wa Kigiriki.
- source_word: περισσοτέρᾳ λύπῃ
  choice: huzuni kubwa mno
  rationale: Inawasilisha kwa Kiswahili cha kawaida huzuni iliyozidi kiasi au inayoweza kumshinda mtu.
