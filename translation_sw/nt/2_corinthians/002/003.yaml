base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/003.yaml
  text: And I wrote this very thing so that, when I came, I might not have grief from those who ought to make me rejoice, because I was confident about all of you that my joy is the joy of you all.
translation:
  language: sw
  text: Nami niliandika jambo hili hasa ili, nitakapokuja, nisipate huzuni kutoka kwa wale ambao nilipaswa kufurahi kwa sababu yao,[a] nikiwa na hakika kuhusu ninyi nyote kwamba furaha yangu ni ya ninyi nyote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au kwa tafsiri halisi zaidi, “kutoka kwa wale ambao ilinipasa kufurahia kutoka kwao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγραψα
  choice: niliandika
  rationale: Wakati uliopita rahisi unafaa kwa aoristi katika muktadha huu na unaelekeza kwenye maandishi ya awali ya Paulo.
- source_word: τοῦτο αὐτὸ
  choice: jambo hilo hasa
  rationale: Huhifadhi msisitizo wa kirai cha Kigiriki kwa Kiswahili cha kawaida na kinachoeleweka.
- source_word: ἵνα μὴ ἐλθὼν λύπην σχῶ
  choice: ili, nitakapokuja, nisipate huzuni
  rationale: “Ili” huonyesha kusudi, na muundo huu huwasilisha kwa kawaida wazo la kutopata huzuni wakati wa kuja kwake.
- source_word: ἀφ’ ὧν ἔδει με χαίρειν
  choice: kutoka kwa wale ambao walipaswa kunifurahisha
  rationale: Hutoa maana ya kimahusiano kwamba watu hao walipaswa kuwa chanzo cha furaha ya Paulo, huku tanbihi ikihifadhi muundo halisi zaidi.
- source_word: πεποιθὼς ἐπὶ πάντας ὑμᾶς
  choice: nikiwa na hakika kuhusu ninyi nyote
  rationale: Huhifadhi umbo la kishirikishi na hali ya uhakika iliyoendelea bila kulazimisha uhusiano wa sababu ulio wazi zaidi kuliko Kigiriki.
- source_word: ἡ ἐμὴ χαρὰ πάντων ὑμῶν ἐστιν
  choice: furaha yangu ni furaha yenu nyote
  rationale: Huhifadhi muundo na uwezekano wa maana ya furaha inayoshirikiwa na Paulo pamoja na Wakorintho.
