base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/016.yaml
  text: To the one[a], a fragrance from death to death; to the other, a fragrance from life to life[c][b]. And who is sufficient for these things?
translation:
  language: sw
  text: Kwa wengine, ni harufu kutoka katika mauti hadi mauti; lakini kwa wengine, ni harufu kutoka katika uzima hadi uzima.[a][b] Na ni nani anayefaa kwa mambo haya?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “manukato” au “harufu nzuri” katika sehemu zote mbili zenye neno “harufu.”
    reason: lexical_alternative
  - marker: b
    text: Misemo “kutoka katika mauti hadi mauti” na “kutoka katika uzima hadi uzima” inaweza kuonyesha chanzo na matokeo (“kutoka mautini na kuishia mautini” / “kutoka uzimani na kuishia uzimani”), au inaweza kusisitiza tabia ya mauti na ya uzima.
    reason: alternative_reading
  - marker: c
    text: Au “mwenye uwezo wa kutosha” au “mwenye kustahili.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀσμή
  choice: harufu
  rationale: “Harufu” ni neno la kawaida na lisiloamua mapema kama harufu hiyo ni nzuri au mbaya; hivyo linahifadhi taswira ya hisi na tofauti ya athari kwa makundi hayo mawili.
- source_word: ἐκ θανάτου εἰς θάνατον
  choice: kutoka katika mauti hadi mauti
  rationale: Muundo huu unafuata ulinganifu mfupi wa Kigiriki na hauamui kama maneno hayo yanaonyesha chanzo na matokeo au msisitizo wa hali ya mauti.
- source_word: ἐκ ζωῆς εἰς ζωήν
  choice: kutoka katika uzima hadi uzima
  rationale: Muundo unaolingana na “kutoka katika mauti hadi mauti” unahifadhi usawaziko wa kimakusudi wa sentensi ya Kigiriki bila kuibana katika fasiri moja.
- source_word: πρὸς ταῦτα
  choice: kwa mambo haya
  rationale: Tafsiri hii ni ya asili katika Kiswahili na inaonyesha wingi wa ταῦτα, ikielekeza kwenye mambo mazito yaliyotajwa.
- source_word: ἱκανός
  choice: anayetosha
  rationale: “Anayetosha” huhifadhi maana ya kuwa na uwezo au ustahili wa kutosha kukabili wajibu huo na pia sauti ya swali la balagha.
theological_decisions:
- issue: Nguvu ya kifasiri ya misemo “kutoka katika mauti hadi mauti” na “kutoka katika uzima hadi uzima”
  choice: Kudumisha utata wa Kigiriki katika matini kuu.
  alternative: “Kutoka katika mauti na kuishia katika mauti / kutoka katika uzima na kuishia katika uzima,” au “harufu yenye kuleta mauti / harufu yenye kuleta uzima.”
  rationale: Matini haifungii maana kwenye chanzo na matokeo pekee, wala kwenye sifa iliyosisitizwa pekee. Muundo mfupi unadumisha mvutano huo wa kifasiri.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Ulinganifu na ufupi wa Kigiriki umehifadhiwa; “harufu” limetumiwa kwa upana ili lisilazimishe maana chanya au hasi.
