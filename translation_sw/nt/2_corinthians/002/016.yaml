    rationale: Katika swali hili ἱκανός ni kuwa wa kutosha, mwenye uwezo, au anayestahili/kufaa kwa wajibu huo; «mwenye kustahili» ni mbadala wa asili zaidi kuliko kuelekeza «anayefaa» pekee.
