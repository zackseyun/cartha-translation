  - severity: low
    issue: Tanbihi a hutaja «mnuko» kama mbadala wa «harufu».
    rationale: Ὀσμή katika mstari huu hubeba taswira pana inayoweza kuwa na athari ya uzima au mauti. «Mnuko» katika Kiswahili cha kawaida mara nyingi humaanisha harufu nzuri, kwa hiyo huweka chanya ambayo neno la Kigiriki halijaweka.
  - severity: low
