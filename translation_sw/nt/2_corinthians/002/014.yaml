id: 2CO.2.14
reference: 2 Corinthians 2:14
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Τῷ δὲ θεῷ χάρις τῷ πάντοτε θριαμβεύοντι ἡμᾶς ἐν τῷ Χριστῷ καὶ τὴν ὀσμὴν τῆς γνώσεως αὐτοῦ φανεροῦντι δι’ ἡμῶν ἐν παντὶ τόπῳ·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/014.yaml
  text: But thanks be to God[b][a], who always leads us in triumphal procession in the Messiah and makes the fragrance of the knowledge of him known through us in every place.
translation:
  language: sw
  text: Lakini Mungu ashukuriwe! Yeye daima hutuongoza katika maandamano ya ushindi katika Masihi[a], na kupitia kwetu huifanya harufu nzuri[b] ya maarifa ya Mungu ijulikane kila mahali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yeye daima hutushinda katika Masihi.”
    reason: alternative_reading
  - marker: b
    text: Au, “manukato.”
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: ashukuriwe
  rationale: Katika msemo Τῷ δὲ θεῷ χάρις, neno hili linaonyesha shukrani yenye sifa kwa Mungu; “Mungu ashukuriwe” ni Kiswahili cha kawaida na chenye hadhi.
- source_word: θριαμβεύοντι
  choice: hutuongoza katika maandamano ya ushindi
  rationale: Kitenzi hiki kinaibua picha halisi ya maandamano ya ushindi, huku ἡμᾶς ikibaki kuwa yambwa. Maana inayowezekana ya Mungu kutushinda imehifadhiwa katika tanbihi.
- source_word: ἐν τῷ Χριστῷ
  choice: ndani ya Masihi
  rationale: Hapa Χριστός inafanya kazi kama cheo, na kirai kinaonyesha mazingira au muungano unaohusiana na Masihi.
- source_word: ὀσμὴν
  choice: harufu nzuri
  rationale: Chaguo hili linafikisha picha ya harufu yenye kuvutia katika muktadha huu kwa Kiswahili cha sasa; “manukato” limewekwa kama chaguo la kileksika katika tanbihi.
- source_word: γνώσεως αὐτοῦ
  choice: kumjua yeye
  rationale: Muundo huu unaeleza kumjua Mungu kwa njia ya kawaida na inayoeleweka, bila kutumia “ujuzi wake,” ambayo kwa Kiswahili ingeweza kumaanisha ujuzi alio nao Mungu.
- source_word: φανεροῦντι
  choice: huifanya ... ijulikane
  rationale: Hii inawasilisha maana ya kufanya kitu kiwe wazi au kijulikane, huku ikidumisha sitiari ya harufu.
- source_word: δι’ ἡμῶν
  choice: kupitia kwetu
  rationale: διά pamoja na jenitivi inaonyesha chombo au uwakala; “kupitia kwetu” ni usemi wa kawaida wa Kiswahili.
- source_word: ἐν παντὶ τόπῳ
  choice: kila mahali
  rationale: Hii ni tafsiri ya kawaida na ya moja kwa moja ya wazo la “katika kila mahali” katika Kiswahili cha sasa.
theological_decisions:
- issue: Maana ya θριαμβεύω ikiwa na ἡμᾶς kama yambwa
  choice: Mungu anatuongoza katika maandamano ya ushindi ndani ya Masihi.
  alternative: Mungu hutushinda ndani ya Masihi.
  rationale: Maandishi makuu yanahifadhi picha wazi ya maandamano ya ushindi na kuunganika kwake na sitiari inayofuata ya harufu. Kwa kuwa kitenzi kinaweza pia kueleweka kuwa kumshinda na kumwonyesha hadharani mateka, maana hiyo haijaondolewa bali imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Alama za tanbihi [a] na [b] zimewekwa moja kwa moja baada ya maneno yanayohusika.
