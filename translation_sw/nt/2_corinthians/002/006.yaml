lexical_decisions:
- source_word: ἱκανὸν
  choice: inamtosha
  rationale: Kitenzi hiki cha Kiswahili kinaeleza kwa kawaida wazo la kuwa adhabu imefikia kiasi cha kutosha, na kinaakisi ἱκανόν kama wazo kuu la kiarifu.
- source_word: τῷ τοιούτῳ
  choice: mtu huyo
  rationale: Kirai hiki kinamrejelea mkosaji mmoja maalumu katika muktadha. “Mtu huyo” ni cha kawaida na chenye heshima, bila kuongeza maelezo yasiyokuwamo katika Kigiriki.
- source_word: ἐπιτιμία
  choice: adhabu
  rationale: Neno hili linaonyesha hatua halisi ya kinidhamu iliyowekwa na jumuiya; “adhabu” ni wazi zaidi kuliko “karipio,” ambalo lingeweza kueleweka kama maneno tu.
- source_word: ἡ ὑπὸ τῶν πλειόνων
  choice: aliyopewa na walio wengi
  rationale: “Walio wengi” huhifadhi maana ya sehemu kubwa ya kundi bila kulazimisha kwamba ilikuwa kura rasmi; “aliyopewa” huonyesha kwa Kiswahili cha kawaida kwamba adhabu ilitolewa na kundi hilo.
