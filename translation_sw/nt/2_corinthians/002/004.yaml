source:
  edition: SBLGNT
  text: ἐκ γὰρ πολλῆς θλίψεως καὶ συνοχῆς καρδίας ἔγραψα ὑμῖν διὰ πολλῶν δακρύων, οὐχ ἵνα λυπηθῆτε, ἀλλὰ τὴν ἀγάπην ἵνα γνῶτε ἣν ἔχω περισσοτέρως εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/004.yaml
  text: For out of much affliction and anguish of heart I wrote to you through many tears[a], not so that you might be grieved[b], but so that you might know the love that I have especially for you.
translation:
  language: sw
  text: Kwa maana, kwa sababu ya dhiki nyingi na uchungu wa moyo, niliwaandikia kwa machozi mengi, si ili mhuzunike, bali ili mjue upendo mwingi zaidi nilio nao kwenu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “upendo wa pekee nilio nao kwenu.” Kwa Kiyunani, “upendo ... zaidi/ kwa wingi zaidi kwenu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ πολλῆς θλίψεως
  choice: nikiwa katika dhiki nyingi
  rationale: Kiswahili cha asili kinachoonyesha kwamba uandishi ulitokana na hali ya dhiki kubwa, bila kuifinya dhiki hiyo kuwa mateso ya nje pekee.
- source_word: συνοχῆς καρδίας
  choice: uchungu wa moyo
  rationale: Huonyesha msongo na maumivu makali ya ndani kwa lugha ya kawaida, yenye heshima.
- source_word: ἔγραψα ὑμῖν
  choice: niliwaandikia
  rationale: Huhifadhi wakati uliopita wa kitenzi bila kuongeza wazi kwamba ilikuwa barua fulani ya awali.
- source_word: διὰ πολλῶν δακρύων
  choice: huku nikitokwa na machozi mengi
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha mazingira ya uandishi wa Paulo akiwa analia.
- source_word: λυπηθῆτε
  choice: mhuzunike
  rationale: Huwasilisha maana ya kupatwa na huzuni bila kuongeza kiwango kisichotajwa.
- source_word: ἀγάπην
  choice: upendo
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja ya ἀγάπη.
- source_word: γνῶτε
  choice: mjue
  rationale: Huhifadhi sentensi ya kusudi na kutolazimisha tofauti kati ya kujua na kutambua kikamilifu.
- source_word: περισσοτέρως εἰς ὑμᾶς
  choice: kwa wingi sana kwenu
  rationale: Huhifadhi nguvu ya περισσοτέρως kuhusu ukubwa wa upendo wa Paulo, huku tanbihi ikionyesha uwezekano wa maana ya kulinganisha.
theological_decisions:
- issue: Nguvu na uwezekano wa maana ya περισσοτέρως εἰς ὑμᾶς
  choice: upendo nilio nao kwa wingi sana kwenu
  alternative: upendo wa pekee nilio nao kwenu / upendo mkubwa zaidi nilio nao kwenu
  rationale: Maandishi yanaweza kusisitiza wingi wa upendo au kuwa na ladha ya ulinganisho. Matini kuu inahifadhi msisitizo wa kiwango, na tanbihi inalinda utata huo bila kubainisha wanaolinganishwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umegawanywa kwa njia ya kawaida ya Kiswahili huku ukihifadhi msukumo wa kihisia, sentensi mbili za kusudi, na utata wa kifungu cha mwisho.
