  source_fidelity: 'Tafsiri inafuata kwa uaminifu mfuatano na hoja ya Kigiriki: dhiki na msongo wa ndani ni chanzo cha kuandika, machozi mengi yanaandamana na tendo hilo, na vishazi viwili vya kusudi vinahifadhiwa. Hata hivyo, “kwa wingi sana kwenu” si muundo wa kawaida wa Kiswahili kwa upendo na haufikishi vizuri zaidi/ongezeko lililo katika περισσοτέρως.'
  naturalness: “Nikiwa katika dhiki nyingi” na “huku nikitokwa na machozi mengi” zinaeleweka, lakini “kwa sababu ya dhiki nyingi ... niliwaandikia kwa machozi mengi” ni ya moja kwa moja na ya asili zaidi katika Kiswahili Sanifu. “Upendo mwingi zaidi nilio nao kwenu” husikika kiasili na huhifadhi nguvu ya kulinganisha bila kubainisha upande unaolinganishwa.
  terminology: “Dhiki,” “uchungu wa moyo,” “mhuzunike,” na “upendo” zinafaa kwa rejista ya kifungu. “Upendo mwingi zaidi ... kwenu” ni bora kuliko “upendo ... kwa wingi sana kwenu.”
