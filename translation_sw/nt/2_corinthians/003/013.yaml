id: 2CO.3.13
reference: 2 Corinthians 3:13
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ οὐ καθάπερ Μωϋσῆς ἐτίθει κάλυμμα ἐπὶ τὸ πρόσωπον ⸀αὐτοῦ, πρὸς τὸ μὴ ἀτενίσαι τοὺς υἱοὺς Ἰσραὴλ εἰς τὸ τέλος τοῦ καταργουμένου.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/013.yaml
  text: and not like Moses[b][a], who used to put a veil over his face so that the sons of Israel would not gaze at the end of what was fading away.
translation:
  language: sw
  text: wala si kama Musa, aliyekuwa akiweka utaji juu ya uso wake ili wana wa Israeli[b] wasikaze macho kwenye mwisho wa kile kilichokuwa kikitoweka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “lengo au matokeo ya kile kilichokuwa kikiondolewa.”
    reason: alternative_reading
  - marker: b
    text: Kigiriki, “wana wa Israeli”; yaani, Waisraeli.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθάπερ
  choice: kama
  rationale: Neno hili linaendeleza ulinganisho na kauli iliyotangulia; “kama” ni la kawaida na lina nguvu ya ulinganisho katika Kiswahili.
- source_word: ἐτίθει
  choice: aliyekuwa akiweka
  rationale: Kauli ya wakati usiotimilika inaonyesha tendo lililorudiwa au lililokuwa desturi; muundo huu wa Kiswahili unahifadhi hali hiyo.
- source_word: κάλυμμα
  choice: utaji
  rationale: “Utaji” ni kifuniko kinachowekwa usoni na unafaa kwa simulizi la Musa pamoja na sitiari ya Paulo katika muktadha huu.
- source_word: πρόσωπον αὐτοῦ
  choice: uso wake
  rationale: Hii ndiyo maana ya moja kwa moja na ya kawaida ya kirai hiki katika Kiswahili cha sasa.
- source_word: πρὸς τὸ μὴ ἀτενίσαι
  choice: ili ... wasikaze macho
  rationale: Muundo huu unaonyesha kusudi, na “kukaza macho” huhifadhi maana ya kutazama kwa makini au kwa kuendelea iliyo katika ἀτενίζω.
- source_word: τοὺς υἱοὺς Ἰσραήλ
  choice: wana wa Israeli
  rationale: Huhifadhi nahau ya Kigiriki “wana wa Israeli” huku ikieleweka kwa wasomaji wa Kiswahili; maana yake ya kawaida ni Waisraeli.
- source_word: εἰς τὸ τέλος
  choice: kwenye mwisho
  rationale: τέλος inaweza kumaanisha mwisho, lengo, au matokeo. “Mwisho” unafaa zaidi hapa kwa sababu ya utofautishaji kati ya kile kinachopita na kile kinachodumu, huku uwezekano mwingine ukiwekwa katika tanbihi.
- source_word: τοῦ καταργουμένου
  choice: wa kile kilichokuwa kikitoweka
  rationale: Kauli hii inaonyesha kitu kinachoondolewa, kupoteza nguvu, au kufikia mwisho. “Kikitoweka” ni ya asili katika Kiswahili na inaendana na utukufu unaopita bila kuifanya maana kuwa ya kimadhehebu.
theological_decisions:
- issue: Maana ya τέλος τοῦ καταργουμένου
  choice: mwisho wa kile kilichokuwa kikitoweka
  alternative: lengo au matokeo ya kile kilichokuwa kikiondolewa
  rationale: Muktadha wa karibu unatofautisha kile cha muda na kile kinachodumu. Tafsiri kuu inaonyesha kuisha kwake, lakini tanbihi inahifadhi uwezekano halisi kwamba τέλος inaweza kumaanisha lengo au matokeo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo “aliyekuwa akiweka” unaonyesha tendo la mazoea, na “wasikaze macho” ni wa kawaida bila kupunguza uzito wa kitenzi cha Kigiriki. Alama za tanbihi zimewekwa moja kwa moja baada ya vifungu vinavyohusika.
source_grounding:
  english_pob_role: consult_only
