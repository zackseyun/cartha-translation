  text: Ἀρχόμεθα πάλιν ἑαυτοὺς ⸀συνιστάνειν; ⸀ἢ μὴ χρῄζομεν ὥς τινες συστατικῶν ἐπιστολῶν πρὸς ὑμᾶς ἢ ἐξ ⸀ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/001.yaml
  text: Are we beginning again to commend ourselves? Or do we need[a], like some, letters of recommendation to you or from you?
translation:
  language: sw
  text: Je, tunaanza tena kujipendekeza sisi wenyewe? Au je, tunahitaji, kama watu fulani, barua za mapendekezo[a] kwenu au kutoka kwenu?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “barua za utambulisho.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀρχόμεθα
  choice: tun شروع tena?
  rationale: Present middle indicative in a rhetorical question is naturally represented by “tun شروع” (we are beginning), preserving the inceptive force.
- source_word: πάλιν
  choice: tena
  rationale: Naturally and concisely marks repetition.
- source_word: ἑαυτοὺς συνιστάνειν
  choice: kujipendekeza wenyewe
  rationale: The reflexive construction concerns presenting oneself favorably; “kujipendekeza wenyewe” is current, understandable Swahili and retains the potentially critical rhetorical tone.
- source_word: μὴ χρῄζομεν
  choice: Au je, tunahitaji
  rationale: A natural Swahili rhetorical question; the context supplies the expected negative answer without forcing it into the wording.
- source_word: ὥς τινες
  choice: kama watu fulani
  rationale: Preserves the comparison and the indefinite identity of the group.
- source_word: συστατικῶν ἐπιστολῶν
  choice: barua za utambulisho
  rationale: In this context these are letters introducing and endorsing a person; this phrase is clear in modern East African Swahili. A footnote preserves the commendatory nuance.
- source_word: πρὸς ὑμᾶς
  choice: kwenu
  rationale: Expresses the direction or destination of the letters idiomatically.
- source_word: ἢ ἐξ ὑμῶν
  choice: au kutoka kwenu
  rationale: Preserves ἐξ as source and the contrast with letters directed to the Corinthians.
