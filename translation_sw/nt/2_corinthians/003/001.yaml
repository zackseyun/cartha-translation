  to: Je, tunaanza tena kujipendekeza sisi wenyewe? Au je, tunahitaji, kama watu fulani, barua za mapendekezo[a] kwenu au kutoka kwenu?
  rationale: The revision replaces the broader “barua za utambulisho” with “barua za mapendekezo” to represent the commendatory force of συστατικῶν ἐπιστολῶν more precisely. The alternative is retained in a footnote because such letters could also introduce a person. The reflexive expression is adjusted for idiomatic Swahili without changing the rhetorical sense.
