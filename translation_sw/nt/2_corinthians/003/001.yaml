  naturalness: The sentence is generally fluent Standard East African Swahili. “Kujipendekeza wenyewe” is understandable, but “sisi wenyewe” is the more natural explicit form if the reflexive pronoun is retained for emphasis.
  terminology: Use “barua za mapendekezo” for συστατικῶν ἐπιστολῶν. It clearly denotes letters that recommend or endorse someone. “Barua za utambulisho” may be retained as a lexical alternative in the footnote, since letters of recommendation could also function as letters of introduction.
