  text: For if what was being brought to an end came with glory[c][b][a], much more what remains is in glory.
translation:
  language: sw
  text: Kwa maana, ikiwa kile kinachokomeshwa[a] kilikuja kwa utukufu[b], basi zaidi sana kile kinachodumu[c] kiko katika utukufu.
  philosophy: optimal-equivalence
