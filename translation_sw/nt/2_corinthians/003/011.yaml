lexical_decisions:
- source_word: καταργούμενον
  choice: kile kinachoondolewa
  rationale: Kitenzi hiki kinaweza kumaanisha kufanya kitu kisiwe na nguvu, kukiondoa, au kukifikisha mwisho. “Kinachoondolewa” ni cha moja kwa moja, kinaeleweka kwa Kiswahili cha sasa, na hakiongezi wazo la kufifia ambalo halitajwi wazi hapa.
- source_word: διὰ δόξης
  choice: kilikuja kwa njia ya utukufu
  rationale: “Kwa njia ya utukufu” hudumisha maana ya msingi ya διά pamoja na umilikishi, huku “kilikuja” ikifanya sentensi iwe ya kawaida kwa Kiswahili.
- source_word: μένον
  choice: kile kinachodumu
  rationale: “Kinachodumu” huonyesha kuendelea kuwapo na hudumisha tofauti kati ya kilicho cha muda na kile kinachobaki.
- source_word: ἐν δόξῃ
  choice: kiko katika utukufu
  rationale: Tafsiri hii hudumisha kihusishi ἐν na tofauti ya kimakusudi dhidi ya διὰ δόξης.
- source_word: πολλῷ μᾶλλον
  choice: si zaidi sana
  rationale: Muundo huu wa swali la mshangao unawasilisha kwa Kiswahili nguvu ya ulinganisho wa “zaidi sana” inayodokezwa na sentensi ya Kigiriki.
theological_decisions:
- issue: Tofauti kati ya kile kinachoondolewa na kile kinachodumu
  choice: Vitu vinatambuliwa kwa viwakilishi vya jumla, bila kutaja moja kwa moja maagano au huduma.
  alternative: Kutaja wazi agano la kale na agano jipya, au huduma zake.
  rationale: Kigiriki cha mstari huu kinatumia vivumishi-tendo vilivyofanywa nomino katika hali ya kati, wala hakitaji maagano moja kwa moja. Tafsiri inaacha muktadha utoe utambulisho huo.
- issue: Maana ya καταργούμενον
  choice: kinachoondolewa
  alternative: kinachofifia; kinachokomeshwa; kinachobatilishwa
  rationale: “Kinachoondolewa” huhifadhi wazo la kuondolewa au kukoma bila kufanya picha ya kufifia kuwa maana pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa mshangao unaleta ulinganisho wa hoja ya Paulo kwa njia ya kawaida, huku usambamba wa “kwa njia ya utukufu” na “katika utukufu” ukihifadhiwa.
