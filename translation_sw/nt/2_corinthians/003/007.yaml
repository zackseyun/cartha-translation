id: 2CO.3.7
reference: 2 Corinthians 3:7
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Εἰ δὲ ἡ διακονία τοῦ θανάτου ἐν ⸀γράμμασιν ⸀ἐντετυπωμένη λίθοις ἐγενήθη ἐν δόξῃ, ὥστε μὴ δύνασθαι ἀτενίσαι τοὺς υἱοὺς Ἰσραὴλ εἰς τὸ πρόσωπον Μωϋσέως διὰ τὴν δόξαν τοῦ προσώπου αὐτοῦ τὴν καταργουμένην,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/007.yaml
  text: But if the ministry of death[a], engraved in letters on stones, came with glory, so that the sons of Israel were not able to gaze at Moses’ face because of the glory of his face, which was fading away[b],
translation:
  language: sw
  text: Lakini ikiwa huduma ya mauti, iliyokuwa imeandikwa kwa herufi na kuchongwa kwenye mawe, ilikuja kwa utukufu, kiasi kwamba wana wa Israeli[a] hawakuweza kutazama kwa makini uso wa Musa kwa sababu ya utukufu wa uso wake, uliokuwa ukififia[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Waisraeli.”
    reason: lexical_alternative
  - marker: b
    text: Au “uliokuwa ukiondolewa” au “uliokuwa ukifikia mwisho.”
    reason: alternative_reading
lexical_decisions:
- source_word: διακονία τοῦ θανάτου
  choice: huduma ya mauti
  rationale: Muundo huu mfupi unahifadhi usemi mkali wa Paulo na uhusiano wa kisarufi wa Kigiriki bila kuufafanua kuwa huduma ‘iletayo’ mauti.
- source_word: ἐν γράμμασιν ἐντετυπωμένη λίθοις
  choice: iliyokuwa imechongwa kwa herufi kwenye mawe
  rationale: ‘Kuchongwa’ linaonyesha kitu kilichotiwa kwa kudumu, huku ‘mawe’ likihifadhi wingi wa λίθοις bila kuongeza waziwazi neno ‘mbao.’ Katika matini kuu muundo umefupishwa kuwa ‘iliyochongwa’ kwa mtiririko wa kawaida.
- source_word: ἐγενήθη ἐν δόξῃ
  choice: ilikuja kwa utukufu
  rationale: Tafsiri hii inahifadhi nguvu ya kitendo cha ἐγενήθη na kuonyesha kwamba huduma hiyo iliambatana na utukufu.
- source_word: ὥστε μὴ δύνασθαι ἀτενίσαι
  choice: hata ... hawakuweza kuukazia macho
  rationale: ‘Kukazia macho’ huwasilisha kutazama kwa makini au kwa kudumu, na ‘hata’ hapa huonyesha matokeo ya utukufu huo.
- source_word: τοὺς υἱοὺς Ἰσραήλ
  choice: wana wa Israeli
  rationale: Usemi huu unafuata kwa karibu muundo wa Kigiriki na bado unaeleweka katika Kiswahili cha Biblia; ‘Waisraeli’ ni mbadala wa kawaida zaidi.
- source_word: εἰς τὸ πρόσωπον Μωϋσέως
  choice: uso wa Musa
  rationale: Pamoja na kitenzi ‘kuukazia macho,’ huu ndio mpangilio wa kawaida wa Kiswahili huku ukidumisha jambo halisi lililotazamwa.
- source_word: καταργουμένην
  choice: uliokuwa ukififia
  rationale: Katika muktadha wa utukufu unaoonekana usoni mwa Musa, ‘ukififia’ huonyesha kupungua hatua kwa hatua bila kupoteza wazo la hali ya muda.
theological_decisions:
- issue: Ikiwa καταργουμένην lieleweke hasa kama utukufu unaofifia kwa kuonekana au kama kitu kinachoondolewa au kukomeshwa.
  choice: uliokuwa ukififia
  alternative: uliokuwa ukiondolewa; uliokuwa ukifikia mwisho
  rationale: Muktadha wa karibu unazungumzia utukufu uliokuwa usoni mwa Musa, hivyo ‘ukififia’ ni wa kawaida na wa wazi. Tanbihi inadumisha maana pana ya kitenzi na mvutano wa hoja ya Paulo kuhusu hali ya muda ya huduma hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki chenye hadhi ya maandiko lakini kinachoeleweka kwa msomaji wa sasa. ‘Huduma ya mauti’ na ‘wana wa Israeli’ zimehifadhiwa kwa ukaribu na Kigiriki; ‘kuukazia macho’ na ‘ukififia’ zimetumiwa kwa uasilia na uwazi. Koma ya mwisho imehifadhiwa kwa sababu aya hii inaendelea kisarufi katika aya inayofuata.
