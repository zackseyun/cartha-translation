  text: Je, huduma ya Roho haitakuwa na utukufu zaidi?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika utukufu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς οὐχὶ
  choice: Je, ... haitakuwa
  rationale: Muundo huu unatoa swali la balagha linalotarajia jibu la kukubali, huku ukibaki wa kawaida na wazi katika Kiswahili.
- source_word: μᾶλλον
  choice: mwingi zaidi
  rationale: Huonyesha ongezeko katika hoja ya kulinganisha kutoka kilicho kidogo kwenda kilicho kikubwa katika muktadha.
- source_word: ἡ διακονία
  choice: huduma
  rationale: Katika muktadha huu ni kazi au utumishi uliokabidhiwa; “huduma” ni neno la kawaida linalodumisha uhusiano na huduma iliyotajwa katika mstari uliotangulia.
- source_word: τοῦ πνεύματος
  choice: ya Roho
  rationale: Muktadha wa agano na 2 Wakorintho 3:6 unaelekeza kwa Roho Mtakatifu; herufi kubwa inaonyesha rejeo hilo bila kuongeza jina lisilomo katika mstari.
- source_word: ἔσται
  choice: haitakuwa
  rationale: Huhifadhi wakati ujao wa kitenzi pamoja na ukanushi wa swali la balagha.
- source_word: ἐν δόξῃ
  choice: na utukufu
  rationale: Kiswahili cha asili hutumia “na utukufu” kueleza kuwa huduma hiyo inaambatana au imevikwa utukufu; tanbihi inadumisha uwezekano wa tafsiri ya karibu zaidi “katika utukufu.”
theological_decisions:
- issue: Rejeo la πνεύματος
  choice: Roho, yaani Roho Mtakatifu
  alternative: roho kwa maana ya jumla au isiyo ya nafsi
  rationale: Katika muktadha wa karibu, Paulo anatofautisha andiko na Roho atoaye uzima (3:6), hivyo rejeo la Roho Mtakatifu ndilo linalofaa zaidi.
- issue: Maana ya ἐν δόξῃ
  choice: na utukufu
  alternative: katika utukufu; yenye utukufu zaidi
  rationale: “Na utukufu” ni ya kawaida katika Kiswahili na inahifadhi utukufu kama nomino; “katika utukufu” ni ya karibu zaidi na muundo wa Kigiriki lakini si laini sawa katika Kiswahili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Swali la balagha na mlinganisho wa kutoka kidogo kwenda kikubwa vimedumishwa.
