lexical_decisions:
- source_word: Πεποίθησιν
  choice: uhakika
  rationale: “Uhakika” linaonyesha hali thabiti ya kuwa na hakika katika muktadha huu, bila kulifanya neno hilo limaanishe tu hisia binafsi au kubadili kile kinachozungumziwa kuwa kitu cha kutumainiwa.
- source_word: δὲ
  choice: Nasi
  rationale: Kiunganishi hiki ni chepesi na kinaendeleza hoja iliyotangulia; “Nasi” kinaunganisha sentensi kwa Kiswahili cha kawaida huku kikihifadhi nafsi ya wingi katika ἔχομεν.
- source_word: τοιαύτην
  choice: wa namna hii
  rationale: Usemi huu unahifadhi nguvu ya kimaelezo ya kivumishi hicho na unaelekeza kwa aina ya uhakika uliotajwa katika muktadha uliotangulia.
- source_word: ἔχομεν
  choice: tuna
  rationale: Hii ndiyo tafsiri ya moja kwa moja na ya kawaida ya kitenzi “tunao/tunamiliki” katika muundo wa Kiswahili “tuna uhakika.”
- source_word: διὰ τοῦ Χριστοῦ
  choice: kwa njia ya Masihi
  rationale: διά pamoja na hali ya genitivi ina maana ya chombo au upatanishi; “kwa njia ya” linaonyesha kwamba uhakika huo unapatikana kupitia Masihi. “Masihi” linadumisha matumizi ya Χριστός kama cheo.
- source_word: πρὸς τὸν θεόν
  choice: mbele za Mungu
  rationale: Ingawa πρός kimsingi huonyesha mwelekeo “kuelekea,” hapa “mbele za Mungu” ni Kiswahili cha kawaida kinachoeleza uhusiano na msimamo wa mhusika kwa Mungu bila kufuta kabisa maana ya kumwelekea Mungu; maana ya moja kwa moja imehifadhiwa katika tanbihi.
theological_decisions:
- issue: Tafsiri ya Χριστοῦ
  choice: Masihi
  alternative: Kristo
  rationale: Neno hili linafanya kazi kama cheo katika kifungu hiki; kwa hiyo “Masihi” limetumiwa katika maandishi, huku umbo la kimapokeo “Kristo” likitolewa katika tanbihi.
- issue: Mwelekeo wa πρὸς τὸν θεόν
  choice: mbele za Mungu
  alternative: kuelekea kwa Mungu
  rationale: “Mbele za Mungu” ni usemi wa kawaida wa Kiswahili kwa uhakika unaohusiana na Mungu, lakini tanbihi inadumisha maana halisi ya kimwelekeo ili kutosuluhisha kimya kimya upeo wa usemi wa Kigiriki.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo “tuna uhakika wa namna hii” unaunganisha aya na hoja iliyotangulia; “kwa njia ya” linaweka wazi wazo la upatanishi bila kuongeza ufafanuzi wa kimadhehebu.
