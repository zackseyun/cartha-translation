  text: Ninyi ndio barua yetu, iliyoandikwa mioyoni mwetu, inayojulikana na kusomwa na watu wote.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ ἐπιστολὴ ἡμῶν
  choice: barua yetu
  rationale: “Barua” ni neno la kawaida na la sasa kwa ujumbe ulioandikwa, na kiwakilishi cha umilikaji ἡμῶν kinaonyeshwa kwa “yetu.”
- source_word: ὑμεῖς ἐστε
  choice: Ninyi ndio
  rationale: Kiwakilishi wazi ὑμεῖς kina mkazo; “Ninyi ndio” huonyesha mkazo huo kwa Kiswahili cha asili bila kuwa kizito.
- source_word: ἐγγεγραμμένη
  choice: iliyoandikwa
  rationale: Hali timilifu ya tendo lililofanywa inaonyesha barua ambayo imeandikwa na inaendelea kuwa hivyo; “iliyoandikwa” huhifadhi sitiari kwa lugha ya kawaida.
- source_word: ἐν ταῖς καρδίαις ἡμῶν
  choice: mioyoni mwetu
  rationale: “Mioyoni mwetu” ni tafsiri ya asili ya ἐν, ikihifadhi maana ya ndani badala ya kugeuza picha kuwa maandishi yaliyo juu ya moyo.
- source_word: γινωσκομένη
  choice: inayojulikana
  rationale: Kitenzi kinaweza kumaanisha kujulikana au kutambuliwa; “inayojulikana” ni cha kawaida na huhifadhi upana wa msingi wa maana.
- source_word: ἀναγινωσκομένη
  choice: kusomwa
  rationale: Neno hili linamaanisha kusoma na linaendeleza moja kwa moja sitiari ya barua.
- source_word: ὑπὸ πάντων ἀνθρώπων
  choice: na watu wote
  rationale: Katika ujenzi tendwa, “na” humtambulisha mtendaji; ἀνθρώπων hapa ni watu kwa ujumla, si wanaume pekee.
