  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἰ γὰρ ⸂τῇ διακονίᾳ⸃ τῆς κατακρίσεως δόξα, πολλῷ μᾶλλον περισσεύει ἡ διακονία τῆς ⸀δικαιοσύνης δόξῃ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/009.yaml
  text: For if the ministry of condemnation came with glory[a], much more does the ministry of righteousness abound in glory.
translation:
  language: sw
  text: Kwa maana, ikiwa huduma ya hukumu ya hatia ilikuja pamoja na utukufu[a], basi huduma ya haki hufurika zaidi sana kwa utukufu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ilikuwa na utukufu.” Kiyunani hakina kitenzi katika kishazi hiki.
    reason: Kuhifadhi uwazi wa muundo wa Kiyunani usio na kitenzi na tafsiri nyingine inayowezekana.
lexical_decisions:
- source_word: διακονία
  choice: huduma
  rationale: “Huduma” ni neno la kawaida na lenye hadhi linaloweza kueleza utendaji au wajibu wa agano unaolinganishwa na Paulo, bila kuufanya kuwa tendo moja tu la kutumikia.
- source_word: κατάκρισις
  choice: hukumu ya hatia
  rationale: Kirai hiki kinahifadhi maana ya kisheria ya kutolewa hukumu ya kuwa na hatia; “hukumu” peke yake ingeweza kumaanisha uamuzi wowote, si lazima hukumu ya hatia.
- source_word: δόξα
  choice: utukufu
  rationale: “Utukufu” ni tafsiri ya kawaida na inayofaa katika muktadha huu wa hoja ya Paulo kuhusu utukufu unaozidi.
- source_word: πολλῷ μᾶλλον
  choice: inazidi sana
  rationale: Muundo huu wa Kiswahili unatoa msisitizo wa ulinganisho wa Kiyunani kwa njia ya asili, huku ukihusishwa moja kwa moja na kitenzi περισσεύει.
- source_word: περισσεύει
  choice: inazidi sana kuwa na
  rationale: Tafsiri hii inadumisha wakati wa sasa na wazo la kuwa na utukufu kwa wingi unaopita ule wa huduma ya kwanza.
- source_word: δικαιοσύνη
  choice: haki
  rationale: “Haki” ndilo neno la kawaida la Kiswahili linalobeba maana za uadilifu na haki ya kimahakama, hivyo linaacha upana halisi wa neno la Kiyunani bila kulazimisha ufafanuzi mmoja.
theological_decisions:
- issue: Maana ya δικαιοσύνη katika ulinganisho wa huduma mbili
  choice: haki
  alternative: uadilifu; kutendewa haki
  rationale: “Haki” huhifadhi kwa kawaida mvutano kati ya uadilifu na haki ya kimahakama. “Kutendewa haki” kungeifanya maana kuwa ya kuhesabiwa haki pekee, jambo ambalo muundo wa Kiyunani haulazimishi hapa.
- issue: Kitenzi kinachodokezwa katika kishazi cha kwanza kisicho na kitenzi
  choice: ilikuja pamoja na utukufu
  alternative: ilikuwa na utukufu
  rationale: Kiyunani hakitaji kitenzi. Tafsiri kuu inaonyesha utukufu ulioandamana na huduma hiyo bila kudai kwamba huduma yenyewe ndiyo chanzo cha utukufu; tanbihi inahifadhi tafsiri tuli inayowezekana.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi unadumisha hoja ya kulinganisha kutoka huduma ya hukumu ya hatia hadi huduma ya haki, huku “haki” ikihifadhi upana wa δικαιοσύνη.
