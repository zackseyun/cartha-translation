  text: The Lord is the Spirit[a], and where the Spirit of the Lord is, there is freedom.
translation:
  language: sw
  text: Bwana ndiye Roho[a], na mahali alipo Roho wa Bwana, pana uhuru.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maneno “Bwana ndiye Roho” yanaweza kueleweka kama utambulisho wa karibu katika muktadha huu, bila kubainisha kitheolojia jinsi uhusiano huo unavyopaswa kufafanuliwa.
    reason: alternative_reading
lexical_decisions:
- source_word: κύριος
  choice: Bwana
  rationale: Neno hili linafuata matumizi ya kawaida ya kibiblia na uzito wa kitheolojia wa κύριος katika muktadha huu.
- source_word: πνεῦμα
  choice: Roho
  rationale: Herufi kubwa inaonyesha kwamba katika sehemu zote mbili neno hili linamrejelea Roho Mtakatifu, si roho ya mwanadamu wala nguvu isiyo na nafsi.
- source_word: δὲ
  choice: na
  rationale: Chembe ya kwanza haijawekewa neno tofauti kwa kuwa Kiswahili kinaweza kuonyesha mwendelezo wa hoja bila kiunganishi cha mwanzo; ya pili imetafsiriwa kwa 'na' ili kuunganisha sentensi kwa ufasaha.
- source_word: οὗ
  choice: mahali alipo
  rationale: Hii inaonyesha maana ya mahali katika kauli ya jumla kwa Kiswahili cha kawaida na huendana na rejeo la Roho kama mwenye nafsi.
- source_word: ἐλευθερία
  choice: uhuru
  rationale: Hili ndilo neno la kawaida na la kisasa linalohifadhi uzito wa maana ya Kigiriki.
- source_word: ὁ δὲ κύριος τὸ πνεῦμά ἐστιν
  choice: Bwana ndiye Roho
  rationale: Muundo huu unahifadhi kauli ya utambulisho iliyo wazi katika Kigiriki bila kuilegeza kuwa ufanano au kazi pekee.
- source_word: τὸ πνεῦμα κυρίου
  choice: Roho wa Bwana
  rationale: Muundo huu ni wa kawaida katika Kiswahili cha kibiblia na unahifadhi uhusiano wa genitivi wa Kigiriki.
theological_decisions:
- issue: Kauli ya utambulisho katika maneno “Bwana ndiye Roho” ina tafsiri mbalimbali za kitheolojia.
  choice: Kauli imetafsiriwa moja kwa moja kuwa “Bwana ndiye Roho.”
  alternative: Inaweza kueleweka kama utambulisho wa karibu katika muktadha—kwa kazi au kwa agano—bila kuwa usawazisho kamili wa nafsi; pia “Bwana” anaweza kueleweka kuwa Kristo hasa au kurejelea Mungu kwa upana zaidi.
  rationale: Kigiriki kinatoa kauli ya utambulisho moja kwa moja. Tafsiri inapaswa kuhifadhi mvutano huo bila kuingiza ufafanuzi wa kimadhehebu katika matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. “Ndiye” limetumiwa kuonyesha wazi kauli ya utambulisho; “pana uhuru” ni muundo mfupi na wa asili baada ya kishazi cha mahali.
