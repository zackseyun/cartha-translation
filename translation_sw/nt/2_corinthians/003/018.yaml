  text: ἡμεῖς δὲ πάντες ἀνακεκαλυμμένῳ προσώπῳ τὴν δόξαν κυρίου κατοπτριζόμενοι τὴν αὐτὴν εἰκόνα μεταμορφούμεθα ἀπὸ δόξης εἰς δόξαν, καθάπερ ἀπὸ κυρίου πνεύματος.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/018.yaml
  text: And we all[a], with unveiled face, beholding the glory of the Lord as in a mirror, are being transformed into the same image from glory to glory, just as from the Lord[b], the Spirit.
translation:
  language: sw
  text: Lakini sisi sote, tukiwa na uso usiofunikwa, tunautazama utukufu wa Bwana kana kwamba katika kioo,[a] tunabadilishwa kuwa mfano huohuo, kutoka utukufu hadi utukufu, kama vile inavyotoka kwa Bwana, Roho.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “tunauakisi utukufu wa Bwana kama kioo.”
    reason: alternative_reading
  - marker: b
    text: Au, “kutoka kwa Bwana ambaye ni Roho”; au, “kutoka kwa Roho wa Bwana.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνακεκαλυμμένῳ προσώπῳ
  choice: tukiwa na uso usiofunikwa
  rationale: Huwasilisha hali ya sasa inayotokana na kuondolewa kwa kifuniko, huku ikihifadhi umoja wa neno πρόσωπον katika usemi wa pamoja.
- source_word: δόξαν κυρίου
  choice: utukufu wa Bwana
  rationale: Ni tafsiri ya moja kwa moja ya muundo wa umilikaji na inatumia neno la kawaida la kibiblia kwa κύριος.
- source_word: κατοπτριζόμενοι
  choice: tunapoutazama ... kana kwamba katika kioo
  rationale: Katika muktadha huu, maana ya kutazama kwa njia ya kioo inafaa na mwendo kutoka kuuona utukufu hadi kubadilishwa; maana mbadala ya kuakisi imehifadhiwa katika tanbihi.
- source_word: τὴν αὐτὴν εἰκόνα
  choice: tufanane na mfano huohuo
  rationale: Kiswahili huhitaji kuonyesha kwa kawaida lengo la mabadiliko; usemi huu huhifadhi uhusiano na εἰκών bila kubainisha zaidi mfano huo ni wa nani.
- source_word: μεταμορφούμεθα
  choice: tunabadilishwa
  rationale: Huhifadhi hali tendwa na tendo linaloendelea la wakati wa sasa.
- source_word: ἀπὸ δόξης εἰς δόξαν
  choice: kutoka utukufu hadi utukufu
  rationale: Huhifadhi ufupi na mvutano wa usemi wa Kigiriki bila kuongeza wazo la viwango ambalo halijasemwa wazi.
- source_word: καθάπερ
  choice: Haya yanatoka
  rationale: Katika Kiswahili, sentensi mpya yenye kitenzi kilicho wazi huwasilisha kwa kawaida asili ya mabadiliko inayodokezwa na kifungu cha mwisho, ingawa καθάπερ yenyewe kwa kawaida ni ya ulinganisho.
- source_word: ἀπὸ κυρίου πνεύματος
  choice: kwa Bwana, yaani Roho
  rationale: Hujaribu kuhifadhi uhusiano wa maelezo kati ya ‘Bwana’ na ‘Roho’ bila kuufanya kuwa kauli pana zaidi; miundo mingine halali imewekwa katika tanbihi.
- source_word: κύριος
  choice: Bwana
  rationale: Ni tafsiri sanifu na yenye hadhi inayofaa katika sehemu zote mbili za aya.
theological_decisions:
- issue: Maana ya κατοπτριζόμενοι
  choice: kutazama utukufu wa Bwana kana kwamba katika kioo
  alternative: kuakisi utukufu wa Bwana kama kioo
  rationale: Muktadha unaweza kupendelea kutazama kunakoongoza kwenye kubadilishwa, lakini kitenzi kinaweza pia kumaanisha kuakisi; hivyo uwezekano huo haujaondolewa.
- issue: Uhusiano wa κυρίου na πνεύματος katika kifungu cha mwisho
  choice: kwa Bwana, yaani Roho
  alternative: kwa Bwana ambaye ni Roho; au, kwa Roho wa Bwana
  rationale: Kigiriki ni kifupi na kinaweza kufasiriwa kwa njia zaidi ya moja. Tafsiri kuu hudokeza uhusiano wa maelezo, huku tanbihi ikihifadhi uwezekano wa sentensi ya uhusiano au muundo wa umilikaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umewekwa wazi kwa wasomaji wa kawaida bila kuondoa utata halisi wa κατοπτριζόμενοι na ἀπὸ κυρίου πνεύματος.
