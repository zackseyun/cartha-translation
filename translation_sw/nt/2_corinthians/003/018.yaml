  terminology: “utukufu,” “Bwana,” “Roho,” “uso usiofunikwa,” na “mfano huohuo” zinafaa kwa Kiswahili Sanifu cha Afrika Mashariki. “Bwana, Roho” huhifadhi kwa kiasi kinachofaa ukandamizaji na utata wa κυρίου πνεύματος; tanbihi huhifadhi miundo mingine inayowezekana.
