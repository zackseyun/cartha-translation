base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/015.yaml
  text: But to this day[a], whenever Moses is read[b], a veil lies over their heart.
translation:
  language: sw
  text: Lakini mpaka leo, kila wakati Musa[a] anaposomwa, utaji uko juu ya moyo wao[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Musa” hapa humaanisha maandishi ya Musa, hasa sheria.
    reason: cultural_note
  - marker: b
    text: 'Kigiriki: “moyo wao” katika umoja, huenda ikiwa umoja wa kijumla; pia inaweza kutafsiriwa “mioyo yao.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Lakini
  rationale: Inaonyesha utofautishaji na kauli iliyotangulia kwa njia fupi na ya kawaida katika Kiswahili.
- source_word: ἕως σήμερον
  choice: mpaka leo
  rationale: Ni usemi wa kawaida unaoonyesha kwamba hali hiyo imeendelea hadi wakati wa sasa.
- source_word: ἡνίκα ἂν ἀναγινώσκηται
  choice: kila mara ... anaposomwa
  rationale: Muundo huu unaonyesha tukio lisilo na wakati mmoja maalumu na linalojirudia; ‘kila mara’ huhifadhi maana ya ‘wakati wowote/kila wakati ambapo.’
- source_word: Μωϋσῆς
  choice: Musa
  rationale: Jina linahifadhiwa kama lilivyo katika Kigiriki, ambako limetumiwa kimajazi kurejelea maandishi ya Musa, badala ya kuweka ufafanuzi huo moja kwa moja katika matini.
- source_word: κάλυμμα
  choice: utaji
  rationale: ‘Utaji’ hudumisha taswira kuu ya Paulo katika sura hii ya kitu kinachofunika na kuzuia kuona au kufahamu.
- source_word: ἐπὶ τὴν καρδίαν αὐτῶν
  choice: juu ya moyo wao
  rationale: Kigiriki kina ‘moyo’ katika umoja pamoja na kiwakilishi cha wengi; Kiswahili kinaweza kuhifadhi umoja huo wa kijumla bila kuvuruga maana.
- source_word: κεῖται
  choice: umetanda
  rationale: Kitenzi kinaeleza kitu kilichowekwa au kilichoko mahali fulani; ‘umetanda’ ni cha asili kwa utaji unaofunika na huonyesha hali inayoendelea.
theological_decisions:
- issue: Kama ‘Musa’ ifafanuliwe moja kwa moja kuwa sheria au maandishi ya Musa
  choice: Kubakiza ‘Musa’ katika matini kuu kama matumizi ya kimajazi
  alternative: Kutafsiri ‘sheria ya Musa’ au ‘maandishi ya Musa’
  rationale: Kigiriki chenyewe kinasema ‘Musa.’ Kubakiza jina hilo kunahifadhi usemi wa chanzo na kuepuka kuamua kimya kimya upeo kamili wa maandishi yanayokusudiwa; tanbihi hutoa ufafanuzi unaohitajika.
- issue: Kama ‘moyo’ wa umoja ubadilishwe kuwa ‘mioyo’ ya wingi
  choice: Kuhifadhi ‘moyo wao’ kama umoja wa kijumla
  alternative: ‘mioyo yao’
  rationale: Hii huakisi kwa karibu sarufi ya Kigiriki na kudumisha uwezekano wa Paulo kuwatazama watu hao kwa pamoja, bila kukataa maana inayowahusu mmoja mmoja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ‘Musa anaposomwa’ umehifadhiwa kwa makusudi ili kudumisha matumizi ya kimajazi ya chanzo, huku tanbihi ikifafanua maana yake. ‘Utaji umetanda’ ni usemi wa asili unaohifadhi taswira ya kitu kinachokaa juu ya moyo na kuufunika.
