id: 2CO.3.10
reference: 2 Corinthians 3:10
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ γὰρ οὐ δεδόξασται τὸ δεδοξασμένον ἐν τούτῳ τῷ μέρει ⸀εἵνεκεν τῆς ὑπερβαλλούσης δόξης·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/010.yaml
  text: For indeed[a], what had been glorified has not been glorified in this respect, because of the glory that surpasses it.
translation:
  language: sw
  text: Kwa maana, kile kilichotukuzwa hakijatukuzwa katika jambo hili, kwa sababu ya utukufu unaozidi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Kwa maana
  rationale: Muunganiko huu unaendeleza na kusisitiza maelezo yaliyotangulia. “Kwa maana” ni wa kawaida na wa heshima katika Kiswahili, bila kuongeza mkazo kupita kiasi.
- source_word: οὐ δεδόξασται
  choice: hakina utukufu
  rationale: Ingawa Kigiriki kina kitenzi timilifu cha kutendwa, katika muktadha huu kauli ya Kiswahili “hakina utukufu” huwasilisha kwa uwazi ukanushaji wa kulinganisha, huku urudiaji wa mzizi wa wazo la utukufu ukihifadhiwa.
- source_word: τὸ δεδοξασμένον
  choice: kile kilichokuwa kimetukuzwa
  rationale: Kiwakilishi “kile” kinawakilisha kirai nomino cha Kigiriki bila kuongeza jina kama “agano” au “huduma,” na “kilichokuwa kimetukuzwa” huhifadhi hali iliyotangulia ya kupewa utukufu.
- source_word: ἐν τούτῳ τῷ μέρει
  choice: katika jambo hili
  rationale: Kirai hiki kinawekea ukanushaji mpaka wa kulinganisha; hakisemi kwamba kile cha kwanza hakikuwa na utukufu wowote kabisa.
- source_word: εἵνεκεν
  choice: kwa sababu ya
  rationale: Hii ni tafsiri ya kawaida na wazi ya uhusiano wa kisababishi.
- source_word: τῆς ὑπερβαλλούσης δόξης
  choice: utukufu unaokizidi
  rationale: Kitenzi-shiriki kinaonyeshwa kwa muundo wa kitenzi “unaokizidi,” unaoweka wazi nguvu ya kulinganisha; kiambishi “-ki-” kinarejelea kile kilichokuwa kimetukuzwa.
- source_word: δόξα / δεδοξασμένον
  choice: kimetukuzwa ... utukufu
  rationale: Maneno ya mzizi mmoja katika Kigiriki yanawakilishwa kwa maneno ya familia moja ya Kiswahili ili kuhifadhi mchezo wa maneno na mshikamano wa hoja ya Paulo.
theological_decisions:
- issue: Je, Paulo anakataa kabisa kwamba huduma/agano la awali lilikuwa na utukufu, au anakataa kwa njia ya kulinganisha?
  choice: Ukanushaji wa kulinganisha unaowekewa mpaka na “katika jambo hili.”
  alternative: Ukanushaji kamili kwamba huduma ya awali ilikuwa na utukufu halisi.
  rationale: Muktadha mpana wa 2 Wakorintho 3 unatambua utukufu wa huduma ya awali, lakini unasema kwamba utukufu huo umefunikwa na ule unaouzidi. Tafsiri haiongezi wazi “agano” au “huduma,” kwa kuwa Kigiriki hapa hakitaji nomino hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umehifadhi tofauti kati ya kile kilichotukuzwa na utukufu unaokizidi, bila kuingiza istilahi ya kimadhehebu au kufafanua rejeleo lisilotajwa moja kwa moja katika Kigiriki.
