lexical_decisions:
- source_word: οὐχ ὅτι
  choice: Si kwamba
  rationale: Hutanguliza ufafanuzi wenye kuondoa dhana fulani, kwa Kiswahili cha kawaida na bila kuifanya kauli iwe ya kisababishi.
- source_word: ἀφ’ ἑαυτῶν ἱκανοί ἐσμεν
  choice: sisi wenyewe tuna uwezo
  rationale: Huonyesha kwamba uwezo unaozungumziwa si wa asili yetu wenyewe; muundo huu ni wa kawaida na wenye heshima katika Kiswahili.
- source_word: λογίσασθαί τι
  choice: kufikiri jambo lolote
  rationale: Kitenzi kina maana ya kufanya tathmini au hesabu ya kiakili; ‘kufikiri’ kinaeleweka kwa urahisi bila kuingiza maana finyu.
- source_word: ὡς ἐξ αὑτῶν
  choice: kuwa limetokana nasi
  rationale: Huhifadhi wazo la chanzo au asili ya jambo kwa Kiswahili cha asili.
- source_word: ἡ ἱκανότης ἡμῶν
  choice: uwezo wetu
  rationale: ‘Uwezo’ huwasilisha utoshelevu au ustahili unaohitajika na pia hudumisha uhusiano wa kileksia na ἱκανοί kwa kutumia neno lilelile.
- source_word: ἐκ τοῦ θεοῦ
  choice: unatoka kwa Mungu
  rationale: Hutaja Mungu moja kwa moja kuwa chanzo cha uwezo huo.
theological_decisions:
- issue: Upeo wa kauli ya Paulo kuhusu uwezo wa mwanadamu
  choice: Kauli imeachwa kuwa pana kuhusu uwezo usiotokana na nafsi, huku muktadha ukiwa wa huduma.
  alternative: Kuitafsiri moja kwa moja kuwa ‘uwezo wa kufanya huduma ya kitume.’
  rationale: Muktadha unahusu huduma, lakini maneno ya Kigiriki katika mstari huu ni mapana; tafsiri haipaswi kuyafinya kwa kuingiza ‘huduma’ ndani ya matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Marudio ya ‘uwezo’ yanadumisha uhusiano wa maneno ἱκανοί/ἱκανότης. Alama zote za tanbihi zimewekwa katika matini kuu.
