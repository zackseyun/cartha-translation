translation:
  language: sw
  text: Lakini mtu anapomgeukia Bwana, utaji huondolewa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡνίκα δὲ ἐὰν
  choice: Lakini ... anapom-
  rationale: 'Muundo huu unaanzisha hali ya wakati isiyo maalumu: jambo hilo hutokea kila inapokuwa kwamba mtu anamgeukia Bwana. Kiswahili cha kawaida huonyesha maana hiyo kwa muundo wa ‘anapom-’; ‘Lakini’ huhifadhi kiunganishi δέ.'
- source_word: ἐπιστρέψῃ
  choice: anamgeukia
  rationale: Kitenzi kinaonyesha kugeuka kuelekea kwa mtu. ‘Anamgeukia’ huhifadhi picha ya mwelekeo bila kuifafanua kupita kiasi kuwa toba au uongofu.
- source_word: πρὸς κύριον
  choice: Bwana
  rationale: Kiambishi cha mtendewa katika ‘anamgeukia Bwana’ kinaeleza kwa Kiswahili mwelekeo kuelekea kwa Bwana unaowasilishwa na πρός pamoja na hali ya accusative.
- source_word: κύριον
  choice: Bwana
  rationale: Ni tafsiri ya kawaida na yenye heshima ya cheo κύριος; pia huhifadhi uhusiano na dondoo la Kutoka bila kumtambulisha Bwana kwa maelezo ambayo mstari huu hauyasemi wazi.
- source_word: περιαιρεῖται
  choice: huondolewa
  rationale: Huhifadhi kauli tendwa na hali ya kawaida/inayotokea kila sharti linapotimizwa, bila kutaja mtendaji ambaye Kigiriki hakumtaji.
- source_word: τὸ κάλυμμα
  choice: utaji
  rationale: Katika muktadha wa Musa, κάλυμμα ni kitambaa kinachofunika uso; ‘utaji’ ni neno la Kiswahili linalofaa na huhifadhi taswira hiyo vizuri kuliko ‘kifuniko’ cha jumla.
theological_decisions:
- issue: Iwapo kuongeza mtenda aliye wazi kwa kitenzi cha umoja kisicho na nomino ya mtenda
  choice: kila mtu
  alternative: mtu / anapomgeukia Bwana bila kutaja mtenda
  rationale: Kigiriki hakitaji nomino ya mtenda, lakini kina maana ya mtu yeyote katika hali isiyo maalumu. ‘Kila mtu’ huwasilisha maana hiyo kwa Kiswahili cha asili bila kuifanya kauli ihusu kikundi au mtu fulani.
- issue: Utambulisho wa ‘Bwana’ katika muktadha
  choice: Bwana
  alternative: Bwana Kristo / Bwana, yaani Roho
  rationale: Mstari wenyewe unasema κύριον tu. Tafsiri haifafanui kuwa ni Kristo au Roho, hivyo inadumisha mvutano wa kitafsiri uliopo katika muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni fupi na ya kawaida; ‘anamgeukia’ hudumisha sitiari ya kugeuka, na ‘utaji’ hudumisha taswira ya Musa katika muktadha.
