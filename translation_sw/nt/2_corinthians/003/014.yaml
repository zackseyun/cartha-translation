  source_fidelity: 'Matini inafuata kwa uaminifu maana na muundo wa Kigiriki: νοήματα ni “akili,” ἐπωρώθη imewasilishwa kwa kiasi kinachokubalika kama “zikawa ngumu,” na taswira ya κάλυμμα imehifadhiwa kwa “utaji.” “Mpaka leo hii,” “agano la kale,” na hali endelevu ya utaji kubaki bila kuondolewa zinaendana na chanzo. Kishazi cha mwisho kinaacha kirejelea cha huondolewa kikiwa kinadokezwa, kama Kigiriki kinavyofanya, huku kikielekea kwa kawaida kwa “utaji.”'
