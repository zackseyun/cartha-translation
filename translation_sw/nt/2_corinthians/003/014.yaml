id: 2CO.3.14
reference: 2 Corinthians 3:14
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀλλὰ ἐπωρώθη τὰ νοήματα αὐτῶν. ἄχρι γὰρ τῆς σήμερον ⸀ἡμέρας τὸ αὐτὸ κάλυμμα ἐπὶ τῇ ἀναγνώσει τῆς παλαιᾶς διαθήκης μένει μὴ ἀνακαλυπτόμενον, ⸀ὅτι ἐν Χριστῷ καταργεῖται,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/014.yaml
  text: But their minds were hardened[a]. For until this very day, at the reading of the old covenant, the same veil remains, not being lifted[b], because in Messiah it is removed.
translation:
  language: sw
  text: Lakini akili zao zikawa ngumu. Kwa maana mpaka leo hii, agano la kale[a] linaposomwa, utaji uleule unabaki bila kuondolewa, kwa sababu katika Masihi huondolewa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au “testamenti ya kale.” Kigiriki: “agano la kale.”'
    reason: lexical_alternative
  - marker: b
    text: Au “kwa sababu katika Masihi linabatilishwa / linawekwa kando,” yaani, agano la kale. Muundo wa Kigiriki unaweza kurejelea utaji au agano.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπωρώθη
  choice: zikawa ngumu
  rationale: Huwasilisha hali ya akili kuwa sugu au kutoweza kutambua, huku Kiswahili kikibaki cha kawaida na bila kusisitiza uasi wa makusudi kuliko chanzo.
- source_word: νοήματα
  choice: akili
  rationale: Katika muktadha huu neno linahusu uwezo wao wa kufikiri na kuelewa; “akili” ni neno la kawaida na linaloeleweka vizuri.
- source_word: ἄχρι γὰρ τῆς σήμερον ἡμέρας
  choice: Kwa maana mpaka leo hii
  rationale: Huhifadhi kiunganishi cha hoja na msisitizo wa wakati uliopo katika usemi wa Kigiriki.
- source_word: κάλυμμα
  choice: utaji
  rationale: Huhifadhi mfano wa utaji wa Musa katika muktadha unaozunguka mstari huu.
- source_word: ἐπὶ τῇ ἀναγνώσει
  choice: linaposomwa
  rationale: Ni Kiswahili cha asili kinachoeleza wakati wa kusomwa kwa agano la kale bila kuwa kizito.
- source_word: παλαιᾶς διαθήκης
  choice: agano la kale
  rationale: διαθήκη hapa ni “agano”; chaguo hili linatanguliza maana ya chanzo kuliko istilahi ya kimapokeo “Agano la Kale” kama jina la sehemu ya Biblia.
- source_word: μένει
  choice: unabaki
  rationale: Huonyesha kuendelea kuwapo kwa utaji kwa njia rahisi na ya moja kwa moja.
- source_word: μὴ ἀνακαλυπτόμενον
  choice: bila kuondolewa
  rationale: Huhifadhi hali tendwa na picha ya utaji ambao bado haujaondolewa.
- source_word: ἐν Χριστῷ
  choice: katika Masihi
  rationale: Χριστός ni cheo chenye maana ya Masihi; “katika Masihi” huhifadhi maana hiyo na usemi wa Paulo wa kuwa ndani yake.
- source_word: καταργεῖται
  choice: huondolewa
  rationale: Ikiwa kiima kinachodokezwa ni utaji, “huondolewa” ni Kiswahili cha kawaida kinachofaa picha hiyo, huku maana nyingine ikiandikwa katika tanbihi.
theological_decisions:
- issue: Kirejelea cha καταργεῖται
  choice: 'Kiima kinachodokezwa katika matini kuu ni utaji: “katika Masihi huondolewa.”'
  alternative: Huenda kinachobatilishwa au kuwekwa kando ni agano la kale, au sentensi imeachwa na utata kati ya utaji na agano.
  rationale: τὸ ... κάλυμμα (“utaji”) ndicho kirejelea cha karibu zaidi na kinaendana na μὴ ἀνακαλυπτόμενον. Hata hivyo, muundo wa Kigiriki unaweza kueleweka vingine, kwa hiyo utata muhimu umehifadhiwa katika tanbihi badala ya kuamuliwa kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imewekwa wazi kwa msomaji wa kawaida, huku picha ya utaji, msisitizo wa “mpaka leo hii,” na utata wa mwisho wa Kigiriki vikihifadhiwa.
