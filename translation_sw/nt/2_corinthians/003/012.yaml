lexical_decisions:
- source_word: Ἔχοντες
  choice: kwa kuwa tuna
  rationale: Kirai cha kishirikishi kinaeleweka kwa maana ya sababu katika muktadha; tafsiri hii ni ya kawaida katika Kiswahili na inaonyesha msingi wa tendo kuu.
- source_word: οὖν
  choice: kwa hiyo
  rationale: Kiunganishi hiki kinaonyesha hitimisho linalotokana na hoja iliyotangulia.
- source_word: τοιαύτην
  choice: la namna hii
  rationale: Huwasilisha maana ya kitu chenye sifa au aina iliyotajwa katika muktadha uliotangulia.
- source_word: ἐλπίδα
  choice: tumaini
  rationale: Ni tafsiri ya kawaida inayofaa uhakika wenye mwelekeo wa wakati ujao katika hoja ya Paulo.
- source_word: πολλῇ
  choice: mkubwa
  rationale: Kivumishi hiki kinatilia nguvu παρρησίᾳ; 'ujasiri mkubwa' ni usemi wa kawaida wa Kiswahili.
- source_word: παρρησίᾳ
  choice: ujasiri
  rationale: Neno linaweza kumaanisha ujasiri, uwazi, au kusema bila kuficha. 'Ujasiri' linafaa katika muktadha, huku uwezekano mwingine ukihifadhiwa katika tanbihi.
- source_word: χρώμεθα
  choice: tunatenda kwa
  rationale: Kitenzi cha kati pamoja na hali ya dative kina maana ya kutumia au kujiendesha kwa kitu fulani. Usemi huu ni wa asili na hauongezi kwa lazima wazo la kusema ambalo halijaelezwa wazi katika Kigiriki.
