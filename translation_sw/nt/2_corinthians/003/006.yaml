id: 2CO.3.6
reference: 2 Corinthians 3:6
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὃς καὶ ἱκάνωσεν ἡμᾶς διακόνους καινῆς διαθήκης, οὐ γράμματος ἀλλὰ πνεύματος, τὸ γὰρ γράμμα ἀποκτέννει, τὸ δὲ πνεῦμα ζῳοποιεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/006.yaml
  text: who also made us competent as servants of a new covenant[a], not of the letter but of the Spirit; for the letter kills[c][b], but the Spirit gives life.
translation:
  language: sw
  text: Yeye pia alituwezesha kuwa watumishi[b] wa agano jipya, si wa herufi[c] bali wa Roho[a]; kwa maana herufi huua, lakini Roho[a] hutoa uzima.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “roho” katika sehemu zote mbili.
    reason: alternative_reading
  - marker: b
    text: Au “wahudumu.”
    reason: lexical_alternative
  - marker: c
    text: “Herufi” inaweza pia kueleweka kuwa “kanuni iliyoandikwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱκάνωσεν
  choice: alituwezesha
  rationale: Huonyesha kwamba Mungu ndiye aliyewafanya wafae na kuwapa uwezo wa huduma, bila kudokeza tu cheti rasmi au utoshelevu wa kibinadamu.
- source_word: διακόνους
  choice: watumishi
  rationale: Hudumisha maana ya msingi ya watu wanaotumikia na huepuka kuingiza bila lazima wazo la cheo rasmi cha kikanisa.
- source_word: καινῆς διαθήκης
  choice: wa agano jipya
  rationale: Ni Kiswahili cha asili kwa kirai cha Kigiriki kisicho na kibainishi, huku kikidumisha dhana ya agano katika hoja ya Paulo.
- source_word: γράμματος / γράμμα
  choice: herufi
  rationale: Hudumisha sitiari fupi na mkazo wa Paulo katika utofautishaji wake na πνεῦμα; maana pana ya maandishi au kanuni iliyoandikwa imewekwa katika tanbihi.
- source_word: πνεύματος / πνεῦμα
  choice: Roho
  rationale: Katika muktadha wa agano jipya, inaelekea kumrejelea Roho Mtakatifu; hata hivyo, Kigiriki hakitofautishi herufi kubwa na ndogo, hivyo uwezekano wa 'roho' umehifadhiwa katika tanbihi.
- source_word: ἀποκτέννει
  choice: huua
  rationale: Ni neno la moja kwa moja na lenye nguvu linalolingana na kauli hai ya wakati wa sasa katika Kigiriki.
- source_word: ζῳοποιεῖ
  choice: hutoa uzima
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha tendo la kuleta au kutoa uhai bila kuwa mgumu wa kimatamshi.
theological_decisions:
- issue: Iwapo πνεῦμα itafsiriwe “Roho” au “roho”
  choice: Roho
  alternative: roho
  rationale: Muktadha wa agano jipya na tendo la kutoa uzima vinaelekea kumrejelea Roho Mtakatifu. Kwa kuwa maandishi ya Kigiriki hayatoi tofauti ya herufi kubwa na ndogo, uwezekano mwingine umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umewekwa wazi na wa kawaida kwa wasomaji wengi, huku mkazo wa kifasihi wa “herufi huua, lakini Roho hutoa uzima” ukidumishwa. Viashiria vya tanbihi vimewekwa mara tu baada ya maneno yanayohusika.
