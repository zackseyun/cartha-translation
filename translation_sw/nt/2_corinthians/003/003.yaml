source:
  edition: SBLGNT
  text: φανερούμενοι ὅτι ἐστὲ ἐπιστολὴ Χριστοῦ διακονηθεῖσα ὑφ’ ἡμῶν, ἐγγεγραμμένη οὐ μέλανι ἀλλὰ πνεύματι θεοῦ ζῶντος, οὐκ ἐν πλαξὶν λιθίναις ἀλλ’ ἐν πλαξὶν καρδίαις σαρκίναις.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/003.yaml
  text: showing that you are a letter from the Messiah[a], ministered by us, written not with ink but with the Spirit of the living God[d][c][b], not on stone tablets but on tablets of hearts of flesh.
translation:
  language: sw
  text: Ikidhihirika kwamba ninyi ni barua ya Masihi[a], iliyotolewa kwa huduma yetu, iliyoandikwa si kwa wino bali kwa Roho wa Mungu aliye hai, si juu ya vibao vya mawe bali juu ya vibao, yaani mioyo ya nyama[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “barua kutoka kwa Masihi.” Kirai cha Kigiriki kinaweza pia kueleweka kama “barua ya Kristo.” “Masihi” hutafsiri cheo Χριστός, ambacho kwa kawaida hutafsiriwa “Kristo.”
    reason: alternative_reading
  - marker: b
    text: “Mioyo ya nyama” inaakisi taswira ya agano jipya katika Ezekieli 11:19 na 36:26, ikitofautishwa na vibao vya mawe.
    reason: cross_reference
lexical_decisions:
- source_word: φανερούμενοι
  choice: mkidhihirisha
  rationale: Kauli endelevu inayounganisha mstari huu na wazo lililotangulia; inaonyesha kwamba hali yao inafanya jambo hilo lionekane wazi.
- source_word: ἐπιστολὴ
  choice: barua
  rationale: Neno la kawaida na la sasa linalohifadhi sitiari ya Paulo bila lugha ya kizamani.
- source_word: Χριστοῦ
  choice: ya Masihi
  rationale: Masihi huhifadhi maana ya cheo Χριστός, na 'ya' hudumisha uwezekano wa uhusiano wa umilikaji, utunzi, au asili bila kuubana kuwa maana moja tu.
- source_word: διακονηθεῖσα
  choice: iliyohudumiwa nasi
  rationale: Kitenzi cha ukanushi kinawaonyesha Paulo na wenzake kama watumishi waliohusika kuileta au kuiandaa barua hii; 'kuhudumiwa' huhifadhi sitiari isiyo ya kawaida ya Kigiriki kuliko 'kupelekwa'.
- source_word: ἐγγεγραμμένη
  choice: iliyoandikwa
  rationale: Ni tafsiri ya kawaida inayofanya kazi sawasawa katika utofautishaji wa wino na Roho.
- source_word: μέλανι
  choice: wino
  rationale: Kisawe cha moja kwa moja katika sitiari ya uandishi.
- source_word: πνεύματι θεοῦ ζῶντος
  choice: Roho wa Mungu aliye hai
  rationale: Muktadha wa kazi ya Mungu ndani ya watu unaunga mkono kumrejelea Roho wa Mungu, huku kirai 'Mungu aliye hai' kikihifadhi sifa ya Kigiriki.
- source_word: πλαξὶν λιθίναις
  choice: vibao vya mawe
  rationale: Usemi wa asili wa Kiswahili unaohifadhi dokezo la vibao vya Sinai.
- source_word: πλαξὶν καρδίαις σαρκίναις
  choice: vibao—mioyo ya nyama
  rationale: 'Kistari kinaonyesha uhusiano wa ufafanuzi: vibao hivyo ni mioyo yenye nyama, badala ya kudokeza vibao vilivyotengenezwa kwa mioyo.'
theological_decisions:
- issue: Maana ya genitivi Χριστοῦ
  choice: ya Masihi
  alternative: kutoka kwa Masihi; ya Kristo
  rationale: '''Ya'' huhifadhi utata halisi kati ya barua inayomilikiwa au kutungwa na Masihi na barua inayotoka kwake; ''Masihi'' hutafsiri cheo hicho badala ya kukifanya jina tu.'
- issue: Utambulisho wa πνεύματι
  choice: Roho wa Mungu aliye hai
  alternative: roho ya Mungu aliye hai
  rationale: Utofautishaji kati ya wino na utendaji wa Mungu wa kuandika mioyoni, pamoja na muktadha wa agano, unaelekeza kwa Roho wa Mungu.
- issue: Taswira ya καρδίαις σαρκίναις
  choice: mioyo ya nyama
  alternative: mioyo ya kibinadamu; mioyo yenye nyama
  rationale: Usemi wa karibu na Kigiriki unahifadhi mwangwi wa taswira ya agano jipya katika Ezekieli na utofautishaji wake na jiwe.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa sentensi unaendeleza wazo kutoka mstari uliotangulia. Neno 'vibao' limechaguliwa kwa tablets za kuandikia, na kistari kirefu kinafafanua kwamba vibao ni mioyo yenyewe.
