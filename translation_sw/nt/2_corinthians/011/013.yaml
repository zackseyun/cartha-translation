base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/013.yaml
  text: For such men are false apostles[a], deceitful workers, disguising themselves as apostles of Messiah.
translation:
  language: sw
  text: Kwa maana watu kama hao ni mitume wa uongo, watenda kazi wa hila, wakijifanya kuwa mitume wa Masihi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mitume wa Kristo.” Neno la Kigiriki Χριστός linaweza kutafsiriwa “Kristo” linapotumiwa zaidi kama jina; hapa limetafsiriwa “Masihi” ili kuhifadhi maana yake kama cheo.
    reason: alternative_reading
lexical_decisions:
- source_word: γὰρ
  choice: Kwa maana
  rationale: Inaonyesha kwamba kauli hii inafafanua hoja iliyotangulia; “Kwa maana” ni kiunganishi cha kawaida na cha heshima katika Kiswahili.
- source_word: τοιοῦτοι
  choice: watu kama hao
  rationale: Inarejelea kundi lililoelezwa katika muktadha uliotangulia na ni usemi wa asili katika Kiswahili.
- source_word: ψευδαπόστολοι
  choice: mitume wa uongo
  rationale: Inawataja watu wanaodai kwa uongo kuwa mitume; tafsiri hii ni wazi na inaakisi muundo wa neno la Kigiriki.
- source_word: ἐργάται δόλιοι
  choice: watenda kazi wadanganyifu
  rationale: Inahifadhi wazo la watu wanaofanya kazi huku sifa yao ikiwa udanganyifu.
- source_word: μετασχηματιζόμενοι
  choice: wanaojigeuza waonekane kuwa
  rationale: Katika muktadha huu neno linaeleza kubadili sura au namna ya kujionyesha kwa kusudi la kudanganya, si mabadiliko ya ndani.
- source_word: εἰς ἀποστόλους Χριστοῦ
  choice: kuwa mitume wa Masihi
  rationale: Pamoja na kitenzi hiki, εἰς inaonyesha nafasi au utambulisho wanaojifanya kuwa nao; “wa Masihi” huhifadhi uhusiano wa genitivi.
- source_word: Χριστοῦ
  choice: Masihi
  rationale: Hapa Χριστός bado ina nguvu ya cheo cha Mtiwa-Mafuta; “Masihi” huwasilisha maana hiyo kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Uwasilishaji wa Χριστοῦ
  choice: Masihi
  alternative: Kristo
  rationale: Katika kirai “mitume wa Masihi,” cheo kinaonekana kuwa na maana hai ya yule aliyetiwa mafuta. “Kristo” pia ni tafsiri iliyozoeleka, hivyo imeonyeshwa katika tanbihi bila kubadili dai la mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Wanaojigeuza waonekane kuwa” kinaweka wazi kujionyesha kwa udanganyifu bila kudokeza mabadiliko ya ndani. Alama ya tanbihi imewekwa mara moja katika matini baada ya kirai kinachohusika.
