translation:
  language: sw
  text: Nilipora makanisa mengine kwa kupokea msaada ili niwahudumie ninyi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au kwa tafsiri halisi zaidi, “ujira” au “malipo.”
