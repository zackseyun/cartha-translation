lexical_decisions:
- source_word: ἄλλας ἐκκλησίας
  choice: makanisa mengine
  rationale: Katika matumizi ya Paulo, ἐκκλησία hapa hurejelea jumuiya za waamini; “makanisa” ni tafsiri ya kawaida na ya asili katika Kiswahili cha kisasa.
- source_word: ἐσύλησα
  choice: nilipora
  rationale: Kitenzi συλάω ni chenye nguvu, kikimaanisha kupora au kunyang’anya. “Nilipora” linahifadhi ukali wa kejeli na kutia chumvi kwa makusudi bila kulainisha usemi wa Paulo.
- source_word: λαβὼν
  choice: kwa kupokea
  rationale: 'Kirai hiki cha kitenzi kishirikishi kinaeleza jinsi Paulo alivyosema kwamba aliyapora makanisa: kwa kupokea msaada kutoka kwao.'
- source_word: ὀψώνιον
  choice: msaada
  rationale: Neno hili linaweza kumaanisha ujira, malipo, au posho, hasa ya askari. Katika muktadha huu “msaada” linaeleza vyema mahitaji ya kifedha au ya kimwili bila kudokeza moja kwa moja uhusiano rasmi wa ajira; maana halisi zaidi imewekwa katika tanbihi.
- source_word: πρὸς τὴν ὑμῶν διακονίαν
  choice: ili niwahudumie ninyi
  rationale: πρός pamoja na hali ya kushutumiwa huonyesha kusudi au mwelekeo hapa. Tafsiri hii inaweka wazi kwa njia ya asili kwamba msaada huo ulitumika katika huduma ya Paulo kwa Wakorintho.
theological_decisions:
- issue: Nguvu ya balagha ya kauli ya Paulo kuhusu kupokea mali kutoka kwa makanisa mengine
  choice: Kuhifadhi sitiari kali “Nilipora makanisa mengine” kama kejeli au kutia chumvi, si ungamo halisi la wizi.
  alternative: Kulainisha kuwa “Nilipokea msaada kutoka kwa makanisa mengine” au “Niliyanyima makanisa mengine.”
  rationale: Kitenzi cha Kigiriki ni kikali kwa makusudi. Muktadha unaonyesha kwamba Paulo anazungumzia msaada aliopokea, si tendo halisi la uhalifu; lakini kulainisha usemi kungedhoofisha nguvu ya hoja yake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “ili niwahudumie ninyi” ni wa kawaida na unaondoa utata wa mhusika wa huduma, huku “nilipora” likihifadhi mshtuko wa balagha wa maandishi ya Kigiriki.
