base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/020.yaml
  text: For you put up with it if someone enslaves you[a], if someone devours you, if someone takes from you, if someone exalts himself[b], if someone strikes you in the face.
translation:
  language: sw
  text: Kwa maana mnastahimili mtu akiwaweka katika utumwa, mtu akiwameza, mtu akichukua kutoka kwenu, mtu akijikweza, mtu akiwapiga usoni.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνέχεσθε
  choice: mnastahimili
  rationale: Kitenzi cha wakati wa sasa kinaeleza uvumilivu halisi wa Wakorintho kwa viongozi wenye kuwanyanyasa; ‘mnastahimili’ ni Kiswahili cha kawaida na chenye hadhi, huku kikihifadhi sauti ya kejeli.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Inaendeleza uhusiano wa kutoa sababu au maelezo kwa kejeli iliyotangulia.
- source_word: καταδουλοῖ
  choice: akiwafanya watumwa
  rationale: Inahifadhi wazi maana ya kuwatia watu utumwani au chini ya mamlaka kandamizi, bila kulainisha picha ya utumwa.
- source_word: κατεσθίει
  choice: akiwameza
  rationale: Inadumisha sitiari kali ya ulaji wa kinyama unaoonyesha unyonyaji.
- source_word: λαμβάνει
  choice: akichukua mali yenu
  rationale: Kitenzi cha Kigiriki ni kipana, lakini katika muktadha kinaashiria kuchukua kwa unyonyaji. ‘Mali yenu’ huifanya sentensi iwe ya kawaida kwa Kiswahili bila kuifunga kwa pesa pekee.
- source_word: ἐπαίρεται
  choice: akijiinua
  rationale: Inahifadhi maana ya kujikweza au kujifanya mkuu, pamoja na dhana ya kitendo kinachomrejelea mtendaji.
- source_word: εἰς πρόσωπον ὑμᾶς δέρει
  choice: akiwapiga usoni
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja ya kupigwa katika uso, bila kuibana maana iwe kofi tu.
- source_word: εἴ τις
  choice: mtu aki-
  rationale: Muundo huu unaorudiwa unawakilisha sharti lisilo maalumu na kudumisha nguvu ya orodha ya matendo ya unyanyasaji.
theological_decisions:
- issue: Sauti ya kejeli katika kauli ya Paulo
  choice: Kauli imetafsiriwa kama karipio la kejeli kuhusu Wakorintho kuwastahimili watu wenye kuwanyanyasa, bila kuwataja wazi kuwa mitume wa uongo katika mstari wenyewe.
  alternative: Kuwataja wahusika moja kwa moja kuwa mitume wa uongo au walimu wa uongo.
  rationale: Muktadha unaonyesha kejeli na unawahusu wapinzani wanaonyanyasa, lakini mstari wa Kigiriki wenyewe unaorodhesha matendo yao bila kuwapa jina hilo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Marudio ya ‘mtu aki-’ yamedumishwa kwa msisitizo wa kisanaa; ‘au’ kabla ya tendo la mwisho hufanya orodha isomeke kwa kawaida bila kupoteza nguvu yake.
