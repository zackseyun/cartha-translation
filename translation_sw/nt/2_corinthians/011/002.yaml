    reason: lexical_alternative
  - marker: b
    text: 'Au, “kwa Kristo.” Kiyunani: “kwa Masihi.”'
    reason: alternative_rendering
  revision_rationale: The revision makes the protective jealousy and formal betrothal imagery explicit in natural Standard East African Swahili, while preserving the Greek plural addressees and singular collective bridal image. It also improves the formal sense of presenting the community to the Messiah and clarifies the translation-status of “Kristo” in the footnote.
