  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ζηλῶ γὰρ ὑμᾶς θεοῦ ζήλῳ, ἡρμοσάμην γὰρ ὑμᾶς ἑνὶ ἀνδρὶ παρθένον ἁγνὴν παραστῆσαι τῷ Χριστῷ·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/002.yaml
  text: For I am jealous for you with God's jealousy[a], because I betrothed you to one husband[b], to present you as a pure virgin to Messiah.
translation:
  language: sw
  text: Maana nina wivu juu yenu kwa wivu wa Mungu[a], kwa kuwa niliwaahidi kwa ndoa kwa mume mmoja, ili niwawasilishe kwa Masihi[b] kama bikira safi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa wivu wa kimungu.” Kiyunani kinaweza kumaanisha wivu ulio wa Mungu au wivu wenye tabia ya kimungu.
    reason: lexical_alternative
  - marker: b
    text: 'Au, “kwa Kristo.” Kiyunani: “kwa Masihi.”'
    reason: alternative_rendering
lexical_decisions:
- source_word: ζηλῶ
  choice: nina wivu kwa ajili yenu
  rationale: Katika mfano wa uchumba na ndoa, kitenzi hiki kinaonyesha wivu wa ulinzi na wa kudai uaminifu, si husuda ndogo; “kwa ajili yenu” ni Kiswahili cha kawaida kinachoonyesha kwamba Paulo anawajali.
- source_word: θεοῦ ζήλῳ
  choice: kwa wivu wa Mungu
  rationale: Muundo huu unafuata uwezekano wa genitivi ya Kiyunani kumaanisha wivu ulio wa Mungu, huku tanbihi ikihifadhi maana mbadala ya wivu wenye tabia ya kimungu.
- source_word: ἡρμοσάμην
  choice: niliwaposea
  rationale: Kitenzi hiki huhusu kupanga au kuahidi ndoa. “Niliwaposea” kinahifadhi wazo la Paulo kuwaunganisha kwa ahadi ya ndoa na mume mmoja.
- source_word: ἑνὶ ἀνδρὶ
  choice: mume mmoja
  rationale: Ingawa ἀνήρ pia inaweza kumaanisha mwanamume, mfano wa harusi unaifanya “mume” kuwa maana ya wazi zaidi hapa.
- source_word: παρθένον
  choice: bikira
  rationale: Neno hili linadumisha wazi picha ya bibi-arusi na uaminifu usiogawanyika.
- source_word: ἁγνὴν
  choice: safi
  rationale: “Safi” ni neno la sasa na linaloeleweka, na linaweza kubeba maana ya usafi wa maadili katika muktadha huu.
- source_word: παραστῆσαι
  choice: ili niwalete
  rationale: Katika muktadha wa kuletwa mbele ya bwana-arusi, “niwalete” ni ya asili katika Kiswahili na hudumisha kusudi la Paulo la kuwakabidhi au kuwaweka mbele ya Masihi.
- source_word: τῷ Χριστῷ
  choice: kwa Masihi
  rationale: Χριστός hapa humtaja bwana-arusi kwa cheo chake; “Masihi” hudumisha maana hiyo ya cheo, huku “Kristo” ikitolewa kama mbadala katika tanbihi.
theological_decisions:
- issue: Asili ya wivu wa Paulo
  choice: “wivu wa Mungu” umehifadhiwa kuwa wivu unaotokana na Mungu au ulio wake, wenye muktadha wa uaminifu wa agano.
  alternative: “wivu wa kimungu,” yaani wivu wenye sifa au tabia inayompendeza Mungu.
  rationale: Genitivi θεοῦ inaweza kueleweka kwa zaidi ya namna moja. Matini kuu inafuata muundo wa moja kwa moja, na tanbihi inaacha uwezekano mwingine wazi badala ya kuutatua kimya kimya.
- issue: Umoja wa bikira na wingi wa waamini
  choice: Wingi katika “niwalete” umefuatwa na umoja katika “kama bikira safi.”
  alternative: Kuweka yote katika wingi, kama “kama mabikira safi.”
  rationale: Kiyunani kinawaelekezea Wakorintho kwa wingi lakini kinawawasilisha kwa pamoja kama bikira mmoja; mabadiliko hayo ya kisarufi ni sehemu ya mfano wa kanisa kama bibi-arusi mmoja.
- issue: Tafsiri ya Χριστός
  choice: Masihi
  alternative: Kristo
  rationale: Katika mfano huu wa bwana-arusi, neno lina nguvu ya cheo. Hata hivyo, “Kristo” ni uhamishaji wa kawaida wa neno hilo na umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo “niliwaposea mume mmoja” umechaguliwa ili kuhifadhi sitiari rasmi ya uchumba; “kama bikira safi” inadumisha picha ya pamoja ya waamini wengi kama bibi-arusi mmoja.
