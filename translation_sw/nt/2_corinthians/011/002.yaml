revisions:
- from: Maana nina wivu kwa ajili yenu kwa wivu wa Mungu[a], kwa kuwa niliwaposea mume mmoja, ili niwalete kwa Masihi[b] kama bikira safi.
  to: Maana nina wivu juu yenu kwa wivu wa Mungu[a], kwa kuwa niliwaahidi kwa ndoa kwa mume mmoja, ili niwawasilishe kwa Masihi[b] kama bikira safi.
  rationale: The revision makes the protective jealousy and formal betrothal imagery explicit in natural Standard East African Swahili, while preserving the Greek plural addressees and singular collective bridal image. It also improves the formal sense of presenting the community to the Messiah and clarifies the translation-status of “Kristo” in the footnote.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:07:06Z'
review_pass:
  verdict: revise
  source_fidelity: The draft preserves the central marital metaphor, the collective singular image of the Corinthians as one pure virgin, and the rendering of Χριστῷ as “Masihi.” However, “nina wivu kwa ajili yenu” can sound primarily like concern on their behalf rather than protective jealousy over them, and “niliwaposea mume mmoja” is semantically and syntactically awkward in current standard Swahili for Paul’s act of betrothing them.
  naturalness: A more idiomatic and precise formulation is “Nina wivu juu yenu kwa wivu wa Mungu” and “niliwaahidi kwa ndoa kwa mume mmoja.” “Niwawasilishe” better conveys παραστῆσαι than the less formal “niwalete.”
  terminology: “Wivu wa Mungu,” “mume mmoja,” “bikira safi,” and “Masihi” are suitable. The footnote for Masihi should identify “Kristo” as an alternative rendering rather than claim that the Greek word itself literally means “Masihi.”
  issues:
  - severity: medium
    issue: The expression “nina wivu kwa ajili yenu” weakens the relational force of ζηλῶ ὑμᾶς.
    rationale: In this betrothal context, Paul is jealous over the Corinthians in a protective, exclusive sense. “Juu yenu” expresses this more directly and naturally.
  - severity: medium
    issue: “Niliwaposea mume mmoja” is unclear and potentially misleading in modern Swahili.
    rationale: Kuposa commonly concerns marrying/taking a wife or bride-price custom, and this construction does not clearly express that Paul pledged the Corinthians in marriage to one husband. “Niliwaahidi kwa ndoa kwa mume mmoja” retains the betrothal metaphor without importing an unintended sense.
  - severity: low
    issue: “Niwalete” is less exact for παραστῆσαι.
    rationale: “Niwawasilishe” naturally conveys presenting persons before the Messiah and suits the formal register.
  - severity: low
    issue: Footnote b inaccurately frames “Masihi” as the literal meaning of the Greek form Christos.
    rationale: “Masihi” is the chosen Swahili title-equivalent; “Kristo” is a conventional alternative rendering. The note should present this as a translation alternative.
  revised_text: Maana nina wivu juu yenu kwa wivu wa Mungu[a], kwa kuwa niliwaahidi kwa ndoa kwa mume mmoja, ili niwawasilishe kwa Masihi[b] kama bikira safi.
