  source_fidelity: 'Tafsiri inafuata kwa uaminifu muundo na hoja ya Kigiriki: swali la balagha, tamko la Paulo lenye kujitenga kwa kejeli, dai la ulinganisho, na orodha ya taabu. “Masihi” hufuata sera ya kutafsiri Χριστός kama cheo, na tanbihi hutoa “Kristo” kwa uwazi. “Nimekabili mauti mara nyingi” ni ufasiri wa Kiswahili unaokubalika wa usemi wa ajabu ἐν θανάτοις πολλάκις, huku tanbihi ikihifadhi uhalisi wa usemi huo na kutaja maana yake inayowezekana bila kuilazimisha.'
