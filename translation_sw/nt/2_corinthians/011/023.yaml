id: 2CO.11.23
reference: 2 Corinthians 11:23
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: διάκονοι Χριστοῦ εἰσιν; παραφρονῶν λαλῶ, ὑπὲρ ἐγώ· ἐν κόποις περισσοτέρως, ἐν ⸂φυλακαῖς περισσοτέρως, ἐν πληγαῖς ὑπερβαλλόντως⸃, ἐν θανάτοις πολλάκις·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/023.yaml
  text: 'Are they servants of Messiah? I am speaking as if insane: I am more so—in labors more abundantly[a], in imprisonments more abundantly, in beatings beyond measure[b], in deaths often.'
translation:
  language: sw
  text: 'Je, wao ni watumishi wa Masihi[a]? Nasema kama mtu asiye na akili timamu: mimi ni zaidi yao—nimefanya kazi kwa taabu nyingi zaidi, nimefungwa gerezani mara nyingi zaidi, nimepigwa kupita kiasi, na nimekabili mauti mara nyingi[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au “Kristo”: “Je, wao ni watumishi wa Kristo?”'
    reason: alternative_reading
  - marker: b
    text: Kihalisi, “katika mauti mara nyingi”; yaelekea maana yake ni kuwa karibu kufa mara kwa mara au kukabili hatari zinazoweza kuua.
    reason: lexical_alternative
lexical_decisions:
- source_word: διάκονοι
  choice: watumishi
  rationale: Neno hili linaonyesha watu wanaotumikia; “watumishi” ni wazi na halina maana finyu ya cheo rasmi cha kanisa.
- source_word: Χριστοῦ
  choice: Masihi
  rationale: Hapa Χριστός inafanya kazi kama cheo cha yule aliyetiwa mafuta; “Masihi” huonyesha maana hiyo wazi katika Kiswahili.
- source_word: παραφρονῶν λαλῶ
  choice: Nasema kama mtu asiye na akili timamu
  rationale: Kauli hii inadumisha kujitathmini kwa Paulo kwamba majivuno yake yanasikika kama maneno ya mtu asiye na akili, bila kutumia lugha ya mtaani.
- source_word: ὑπὲρ ἐγώ
  choice: mimi ni zaidi yao
  rationale: Kigiriki ni kifupi na kinaacha sehemu ya ulinganisho ikieleweka kutokana na swali lililotangulia; “yao” hufanya ulinganisho huo ueleweke bila kuongeza dai jipya.
- source_word: ἐν κόποις περισσοτέρως
  choice: nimefanya kazi kwa taabu nyingi zaidi
  rationale: κόπος ni kazi yenye kuchosha au taabu; muundo wa kitenzi ni wa asili katika Kiswahili na unahifadhi ulinganisho wa περισσοτέρως.
- source_word: ἐν φυλακαῖς περισσοτέρως
  choice: nimefungwa gerezani mara nyingi zaidi
  rationale: Wingi huu unaelekea kuonyesha matukio ya kufungwa, si majengo pekee; “mara nyingi zaidi” huwasilisha ulinganisho kwa ufasaha.
- source_word: ἐν πληγαῖς ὑπερβαλλόντως
  choice: nimepigwa kupita kiasi
  rationale: πληγαί ni mapigo au vipigo, na ὑπερβαλλόντως huonyesha kiwango kilichopita kawaida.
- source_word: ἐν θανάτοις πολλάκις
  choice: nimekabili mauti mara nyingi
  rationale: Kauli hii huhifadhi picha kali ya kukutana na mauti mara kwa mara, huku tanbihi ikieleza kuwa huenda ikamaanisha kuwa karibu kufa au kukabili hatari zinazoweza kuua.
theological_decisions:
- issue: Tafsiri ya Χριστοῦ
  choice: Masihi
  alternative: Kristo
  rationale: Katika muktadha huu neno hilo linaweza kueleweka kama cheo. “Masihi” huonyesha cheo hicho wazi, huku “Kristo” ikihifadhiwa katika tanbihi kama tafsiri ya kawaida.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Orodha ya mateso imewasilishwa kwa vitenzi ili isikike kwa ufasaha katika Kiswahili, huku marudio, ulinganisho, na nguvu ya balagha ya Kigiriki vikihifadhiwa.
