  text: Why? Because I do not love you? God knows I do.
translation:
  language: sw
  text: Kwa nini? Je, ni kwa sababu siwapendi? Mungu anajua.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki husema tu, “Mungu anajua”; jibu kwa swali la balagha halitamkwi wazi.
    reason: Ufafanuzi wa jibu linalodokezwa katika swali la balagha.
lexical_decisions:
- source_word: διὰ τί
  choice: Kwa nini?
  rationale: Ni swali fupi la kutaka sababu, na linahifadhi nguvu ya swali la balagha.
- source_word: ὅτι
  choice: Je, ni kwa sababu
  rationale: Katika mtiririko huu ὅτι linaanzisha sababu inayodhaniwa katika swali; muundo huu ni wa asili katika Kiswahili.
- source_word: οὐκ ἀγαπῶ ὑμᾶς
  choice: siwapendi
  rationale: Linahifadhi ukanushi, kitenzi 'kupenda,' na yambwa ya wingi kwa usemi wa kawaida na ulio wazi.
- source_word: ὁ θεὸς
  choice: Mungu
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa θεός katika muktadha huu.
- source_word: οἶδεν
  choice: anajua
  rationale: Tafsiri ya moja kwa moja inaacha jibu linalodokezwa bila kulitamka, kama ilivyo katika Kigiriki.
theological_decisions:
- issue: Iwapo jibu chanya linalodokezwa baada ya swali litamkwe wazi
  choice: Mungu anajua.
  alternative: Mungu anajua kwamba ninawapenda.
  rationale: Kigiriki kinasema tu 'Mungu anajua.' Kuacha kauli hiyo fupi kunahifadhi udhahiri wa chanzo pamoja na mvutano wa swali la balagha, bila kuongeza jibu lisilotamkwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni fupi, ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Kiashiria cha swali 'Je' husaidia kufanya mfuatano wa maswali usikike wa asili.
