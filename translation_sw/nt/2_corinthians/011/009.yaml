id: 2CO.11.9
reference: 2 Corinthians 11:9
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ παρὼν πρὸς ὑμᾶς καὶ ὑστερηθεὶς οὐ κατενάρκησα οὐθενός· τὸ γὰρ ὑστέρημά μου προσανεπλήρωσαν οἱ ἀδελφοὶ ἐλθόντες ἀπὸ Μακεδονίας· καὶ ἐν παντὶ ἀβαρῆ ⸂ἐμαυτὸν ὑμῖν⸃ ἐτήρησα καὶ τηρήσω.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/009.yaml
  text: And when I was present with you and was in need[a], I was not a burden to anyone; for the brothers who came from Macedonia supplied what I lacked. And in everything I kept myself from being a burden to you[b], and will keep doing so.
translation:
  language: sw
  text: Nilipokuwa pamoja nanyi na nikawa na uhitaji, sikumlemea mtu yeyote[a]; kwa maana ndugu[b] waliokuja kutoka Makedonia walinipatia kile nilichokosa. Na kwa kila namna nilijilinda nisije nikawa mzigo kwenu, nami nitaendelea kufanya hivyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sikumtwisha mtu yeyote mzigo.” Kitenzi cha Kigiriki kinaweza kumaanisha kumlemea mtu, hasa kuwa mzigo wa kifedha kwake.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kigiriki lililotafsiriwa “ndugu” ni la wingi wa kiume. Wakati mwingine Paulo hulitumia kwa waamini kwa upana zaidi, lakini hapa huenda linarejelea washirika maalumu waliokuja kutoka Makedonia.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρὼν πρὸς ὑμᾶς
  choice: nilipokuwa pamoja nanyi
  rationale: Muundo huu unaonyesha hali ya wakati kwa Kiswahili cha kawaida na kuhifadhi maana ya Paulo kuwapo mwenyewe miongoni mwao.
- source_word: ὑστερηθεὶς
  choice: nikawa na uhitaji
  rationale: Kishiriki hiki kinaonyesha kupungukiwa au kuwa na mahitaji, hasa ya kimwili au kifedha katika muktadha huu.
- source_word: οὐ κατενάρκησα οὐθενός
  choice: sikumlemea mtu yeyote
  rationale: Kitenzi καταναρκάω hapa kinamaanisha kuwa mzigo kwa mtu, hasa wa kifedha. ‘Sikumlemea’ ni usemi wa asili unaohifadhi picha ya uzito bila kuifanya maana kuwa finyu mno.
- source_word: τὸ ὑστέρημά μου
  choice: nilichopungukiwa
  rationale: Nomino hii hutaja upungufu au kile kilichokosekana. Muundo wa Kiswahili unaeleza maana hiyo kwa uwazi bila kuongeza aina mahususi ya msaada.
- source_word: προσανεπλήρωσαν
  choice: walinipatia
  rationale: Kitenzi kinamaanisha kujazia au kutoa kile kilichopungua. Pamoja na ‘nilichopungukiwa,’ ‘walinipatia’ hutoa Kiswahili cha kawaida na maana kamili ya sentensi.
- source_word: οἱ ἀδελφοὶ
  choice: ndugu
  rationale: ‘Ndugu’ ndilo neno la kawaida la Kikristo kwa waamini au washirika. Kwa kuwa umbo la Kigiriki ni wingi wa kiume na huenda hapa linarejelea wanaume maalumu, jambo hilo linafafanuliwa katika tanbihi bila kulazimisha Kiswahili kisicho cha asili.
- source_word: ἐλθόντες ἀπὸ Μακεδονίας
  choice: waliokuja kutoka Makedonia
  rationale: Kishiriki cha Kigiriki kimetolewa kama kishazi rejeshi cha kawaida, huku chanzo cha kijiografia cha msaada kikihifadhiwa.
- source_word: ἐν παντί
  choice: kwa kila namna
  rationale: Kirai hiki kina upeo mpana. ‘Kwa kila namna’ kinafaa zaidi hapa kwa hali ya Paulo ya kuepuka kuwalemea, bila kufafanua njia hizo kupita kiasi.
- source_word: ἀβαρῆ ἐμαυτὸν ὑμῖν
  choice: nilijiepusha kuwa mzigo kwenu
  rationale: Kivumishi ἀβαρής humaanisha kutokuwa wa kulemea, hasa kifedha. Kiswahili kinahitaji upanuzi huu mdogo ili sentensi iwe wazi na ya asili.
- source_word: ἐτήρησα καὶ τηρήσω
  choice: nilijiepusha ... nami nitaendelea kufanya hivyo
  rationale: τηρέω hapa ni kudumisha hali ya kutowalemea. Usemi huu unaonyesha tendo la zamani na azimio la kuendelea nalo wakati ujao.
theological_decisions:
- issue: Upeo wa οἱ ἀδελφοὶ
  choice: ndugu, pamoja na tanbihi kwamba umbo la Kigiriki ni la kiume
  alternative: ndugu wa kiume; ndugu wa kiume na wa kike
  rationale: Umbo la chanzo ni wingi wa kiume na katika muktadha huenda linarejelea washirika maalumu wanaume kutoka Makedonia. Hata hivyo, ‘ndugu’ ni tafsiri ya kawaida na ya asili katika Kiswahili, nayo yenyewe hailazimishi jinsia; tanbihi inadumisha ushahidi wa kisarufi na uwezekano wa kimuktadha bila kuingiza hitimisho la kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa msomaji wa kawaida. Muundo wa sentensi unahifadhi marudio ya wazo la kutokuwa mzigo, ambalo ni muhimu katika hoja ya Paulo.
