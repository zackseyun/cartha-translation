base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/026.yaml
  text: often on journeys[a], in dangers from rivers, in dangers from robbers, in dangers from my own people, in dangers from Gentiles, in dangers in the city, in dangers in the wilderness, in dangers at sea, in dangers among false brothers[b],
translation:
  language: sw
  text: mara nyingi katika safari, katika hatari za mito, katika hatari za wanyang’anyi, katika hatari kutoka kwa watu wangu wenyewe[a], katika hatari kutoka kwa watu wa Mataifa, katika hatari mjini, katika hatari nyikani, katika hatari baharini, katika hatari miongoni mwa ndugu wa uongo[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watu wa asili yangu” au “taifa langu.” Kigiriki kinasema kwa maana halisi “kutoka kwa jamaa/watu [wangu].”
    reason: lexical_alternative
  - marker: b
    text: Au “waumini wa uongo.” Kigiriki kinasema kwa maana halisi “ndugu wa uongo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁδοιπορίαις πολλάκις
  choice: mara nyingi katika safari
  rationale: Kauli hii inaonyesha kusafiri mara kwa mara. Mpangilio huu ni wa kawaida katika Kiswahili na unadumisha muundo wa orodha ya mateso.
- source_word: κινδύνοις
  choice: katika hatari
  rationale: Kurudia kauli hii kunahifadhi mdundo na mrundikano wa hatari katika Kigiriki.
- source_word: ποταμῶν
  choice: za mito
  rationale: Kigiriki hakibainishi ikiwa hatari hizo zilitokana na mafuriko, kuvuka mito, au jambo jingine; tafsiri pana inaacha maana hiyo wazi.
- source_word: λῃστῶν
  choice: za wanyang’anyi
  rationale: Neno hili hurejelea waporaji au majambazi; “wanyang’anyi” ni neno la kawaida na linalofaa katika muktadha wa safari.
- source_word: ἐκ γένους
  choice: kutoka kwa watu wangu mwenyewe
  rationale: Kauli hii inarejelea watu wa asili au jamaa ya Paulo bila kutaja wazi “Wayahudi,” neno ambalo halipo katika Kigiriki.
- source_word: ἐξ ἐθνῶν
  choice: kutoka kwa watu wa Mataifa
  rationale: Katika utofautishaji na watu wa Paulo mwenyewe, kauli hii inamaanisha watu wasio Wayahudi. “Watu wa Mataifa” ni usemi wa kawaida wa kibiblia unaohifadhi utofautishaji huo.
- source_word: ἐν πόλει
  choice: mjini
  rationale: Tafsiri hii ya kawaida inawakilisha mahali pa mjini kwa maana ya jumla, kama ilivyo katika umoja wa Kigiriki.
- source_word: ἐν ἐρημίᾳ
  choice: nyikani
  rationale: Neno la Kigiriki linaweza kumaanisha nyika, jangwa, au sehemu isiyo na watu. “Nyikani” ni pana na linaendana na tofauti kati ya mji na maeneo ya upweke.
- source_word: ἐν θαλάσσῃ
  choice: baharini
  rationale: Huu ndio usemi wa kawaida wa Kiswahili kwa hatari inayotokea baharini.
- source_word: ἐν ψευδαδέλφοις
  choice: miongoni mwa ndugu wa uongo
  rationale: Tafsiri hii inafuata kwa karibu neno ambatano la Kigiriki linalomaanisha “ndugu wa uongo,” huku tanbihi ikieleza maana inayowezekana ya waumini wanaodai kuwa ndugu.
theological_decisions:
- issue: Jinsi ya kutafsiri ψευδαδέλφοις
  choice: miongoni mwa ndugu wa uongo
  alternative: miongoni mwa waumini wa uongo
  rationale: Kigiriki kinatumia nomino ya kiume yenye maana halisi ya “ndugu wa uongo.” Tafsiri kuu inahifadhi umbo hilo bila kupanua jinsia au kuamua kabisa hali yao ya kiroho.
- issue: Jinsi ya kutafsiri ἐξ ἐθνῶν kwa kulinganisha na ἐκ γένους
  choice: kutoka kwa watu wa Mataifa
  alternative: kutoka kwa wasio Wayahudi
  rationale: Muktadha unaweka watu wa Paulo mwenyewe kinyume na mataifa. Tafsiri iliyochaguliwa inadumisha istilahi ya kibiblia bila kuongeza maelezo yasiyokuwapo moja kwa moja katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. Kurudiwa kwa “katika hatari” kumehifadhiwa ili kuonyesha mdundo wa msisitizo katika orodha ya Kigiriki. Alama za tanbihi zimewekwa baada ya vifungu vinavyohusika; tanbihi [a] inahusu “watu wangu mwenyewe,” si “safari.”
