  text: ἐπεὶ πολλοὶ καυχῶνται ⸀κατὰ σάρκα, κἀγὼ καυχήσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/018.yaml
  text: Since many boast according to the flesh[a], I too will boast.
translation:
  language: sw
  text: Kwa kuwa wengi hujisifu kwa jinsi ya mwili[a], mimi pia nitajisifu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa viwango vya kibinadamu,” au “kwa namna ya kibinadamu tu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ
  choice: Kwa kuwa
  rationale: Inaonyesha sababu ya azimio la Paulo katika kishazi kinachofuata, kwa Kiswahili cha kawaida na chenye heshima.
- source_word: πολλοὶ
  choice: wengi
  rationale: Ni tafsiri ya moja kwa moja ya kivumishi cha idadi.
- source_word: καυχῶνται
  choice: hujisifu
  rationale: Inafaa kwa sauti ya kinaya na mabishano katika muktadha, na inadumisha mzizi uleule pamoja na καυχήσομαι.
- source_word: κατὰ σάρκα
  choice: kwa jinsi ya mwili
  rationale: Inahifadhi neno la Paulo ‘mwili’ na mvutano wake wa kitheolojia, huku tanbihi ikieleza maana inayowezekana ya kibinadamu au ya kidunia.
- source_word: σάρκα
  choice: mwili
  rationale: Hapa halimaanishi tu mwili wa kimwili, bali msingi au namna ya kibinadamu; hata hivyo, neno halisi linahifadhiwa ili kutofunga maana kwa tafsiri moja.
- source_word: κἀγὼ
  choice: mimi pia
  rationale: Inabeba msisitizo wa καί + ἐγώ na kuonyesha kwamba Paulo anajibu kwa kufuata kwa kinaya njia ya wapinzani wake.
- source_word: καυχήσομαι
  choice: nitajisifu
  rationale: Ni kitenzi cha wakati ujao na kinahifadhi urudiaji wa kitenzi kilichotumiwa mapema katika aya.
theological_decisions:
- issue: Tafsiri ya σάρξ katika nahau κατὰ σάρκα
  choice: kwa jinsi ya mwili
  alternative: kwa viwango vya kibinadamu; kwa namna ya kibinadamu tu
  rationale: Tafsiri kuu inahifadhi istilahi ya Paulo na utata wake halisi. Tanbihi hutoa maana ya kimuktadha bila kuifanya tafsiri hiyo kuwa ndiyo maana pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. ‘Hujisifu/nitajisifu’ hudumisha urudiaji wa Kigiriki; ‘kwa jinsi ya mwili’ huhifadhi usemi wa chanzo huku tanbihi ikifafanua nahau.
