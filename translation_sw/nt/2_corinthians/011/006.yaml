id: 2CO.11.6
reference: 2 Corinthians 11:6
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἰ δὲ καὶ ἰδιώτης τῷ λόγῳ, ἀλλ’ οὐ τῇ γνώσει, ἀλλ’ ἐν παντὶ ⸀φανερώσαντες ἐν πᾶσιν εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/006.yaml
  text: But even if I am unskilled in speech[a], I am not in knowledge; indeed[c][b], in every way we have made this plain among all to you.
translation:
  language: sw
  text: Lakini hata kama sina ustadi wa kusema[a], si kwamba sina maarifa. Bali kwa kila njia na katika mambo yote tumeliweka hilo wazi kwenu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hata kama sijafunzwa kusema kwa ustadi,” yaani, sina ustadi uliosuguliwa wa balagha.
    reason: lexical_alternative
  - marker: b
    text: Kauli ya Kiyunani imebanwa. Inaweza pia kutafsiriwa, “tumeliweka hilo wazi kwenu kwa kila njia, mbele ya wote,” au “katika kila jambo.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδιώτης τῷ λόγῳ
  choice: sina ustadi wa kusema
  rationale: Katika muktadha huu Paulo anakubali kwamba hana umahiri wa usemi uliosuguliwa au mafunzo rasmi ya balagha, si kwamba hana elimu kwa ujumla. Kauli hii ni ya kawaida na inaweka wazi tofauti na maarifa.
- source_word: γνώσει
  choice: maarifa
  rationale: Neno hili humaanisha maarifa au ufahamu wa jambo. “Maarifa” linahifadhi tofauti kati ya yaliyomo katika ujumbe wa Paulo na ustadi wa kuuwasilisha.
- source_word: φανερώσαντες
  choice: tumeliweka hilo wazi
  rationale: Ingawa kitenzi ni umbo la kitenzi-tegemezi cha wakati uliopita, katika muundo huu kinatoa dai kuu kwamba jambo hilo limedhihirishwa wazi kwa Wakorintho. Kiwakilishi “hilo” kinarejelea maarifa ya Paulo yaliyotajwa kabla.
- source_word: ἐν παντί
  choice: kwa kila njia
  rationale: Kirai hiki kinafanya kazi kama kielezi kinachoonyesha ukamilifu wa namna jambo lilivyowekwa wazi.
- source_word: ἐν πᾶσιν
  choice: katika mambo yote
  rationale: Kirai cha Kiyunani kimebanwa na kinaweza kuelekezwa kwa mambo, mazingira, au watu. Tafsiri hii huhifadhi maana pana bila kuamua kupita kiasi, huku tanbihi ikitaja uwezekano mwingine.
- source_word: εἰς ὑμᾶς
  choice: kwenu
  rationale: Huwaonyesha Wakorintho kuwa ndio walikoelekezwa au waliopokea udhihirisho huo.
theological_decisions:
- issue: Maana ya Paulo kujieleza kuhusu uwezo wake wa kusema
  choice: Paulo anakubali uwezekano kwamba hana ustadi uliosuguliwa wa kusema, lakini si kwamba hana maarifa.
  alternative: Paulo ni mtu asiye na elimu kwa ujumla, au anasema kwa kejeli tu bila kukubali udhaifu wowote.
  rationale: Tofauti ya moja kwa moja kati ya kusema na maarifa inaonyesha kwamba hoja ni mtindo au mafunzo ya usemi, wala si mamlaka, ukweli, au ufahamu wa Paulo.
- issue: Rejeo la kauli ya mwisho iliyobanwa
  choice: Kauli hiyo inaeleza kwamba Paulo na wenzake wameweka maarifa hayo wazi kwa Wakorintho kwa kila njia na katika mambo yote.
  alternative: Kauli hiyo inaweza kumaanisha kwamba wameyaweka wazi kwenu mbele ya watu wote au katika kila hali.
  rationale: Kiyunani ἐν παντὶ … ἐν πᾶσιν εἰς ὑμᾶς kinaweza kueleweka kwa namna kadhaa zinazokaribiana. Tafsiri kuu ni ya asili kwa Kiswahili, na tanbihi huhifadhi utata wa chanzo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. “Maarifa” na “ustadi wa kusema” hudumisha tofauti ya Paulo kati ya yaliyomo katika ujumbe na ustadi wa balagha. Sentensi ya mwisho imepangwa kwa mtiririko wa kawaida wa Kiswahili huku utata wa Kiyunani ukihifadhiwa katika tanbihi.
