lexical_decisions:
- source_word: χωρὶς τῶν παρεκτὸς
  choice: Zaidi ya mambo mengine
  rationale: Kirai hiki kinaonyesha mambo yaliyo kando ya yale ambayo Paulo amekwishaorodhesha, au mambo mengine ambayo hayakutajwa. Tafsiri hii ni ya asili katika Kiswahili na haiamui bila sababu ikiwa ni mateso ya nje pekee.
- source_word: ἐπίστασίς μοι
  choice: ninakabiliwa na shinikizo
  rationale: Nomino inaweza kumaanisha kusongwa au shinikizo linalomjia mtu. Muundo huu unahifadhi nguvu ya dativu μοι, yaani jambo linalomkabili Paulo, bila kuifanya kuwa umati halisi unaomsonga.
- source_word: ἡ καθ’ ἡμέραν
  choice: kila siku
  rationale: Kirai kinaonyesha jambo linalotokea au kuendelea siku baada ya siku; “kila siku” ni Kiswahili cha kawaida na wazi.
- source_word: ἡ μέριμνα
  choice: la kuyajali
  rationale: Neno linaweza kuwa kujali, hangaiko, au wasiwasi. “Kuyajali” linaonyesha uzito wa huduma ya Paulo bila kulihukumu kuwa wasiwasi wenye kosa.
- source_word: πασῶν τῶν ἐκκλησιῶν
  choice: makanisa yote
  rationale: Katika matumizi ya Paulo, ἐκκλησίαι ni jumuiya za waamini. “Makanisa” ni neno lililozoeleka na linaloeleweka katika Kiswahili cha Agano Jipya.
theological_decisions:
- issue: Uzito wa kichungaji katika μέριμνα
  choice: la kuyajali makanisa yote
  alternative: hangaiko/wasiwasi kwa ajili ya makanisa yote
  rationale: Tafsiri inahifadhi kujitoa na uzito wa ndani wa Paulo bila kuingiza hukumu kwamba hisia hiyo ilikuwa wasiwasi wa kimaadili; uwezekano wa “hangaiko” umewekwa katika tanbihi.
- issue: Uhusiano kati ya ἐπίστασις na μέριμνα
  choice: shinikizo la kuyajali makanisa yote
  alternative: 'shinikizo juu yangu: hangaiko kwa ajili ya makanisa yote'
  rationale: Virai hivyo vinaweza kueleweka kwa uhusiano wa ufafanuzi, ambapo kujali makanisa yote ndiko shinikizo la kila siku. Kiswahili hiki kinaonyesha uhusiano huo kwa njia ya kawaida huku tanbihi ikihifadhi uwezekano wa muundo ulio karibu zaidi na wa Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imetungwa kwa mtiririko wa kawaida kwa msomaji wa leo, huku tanbihi zikihifadhi maana mbadala za kirai cha mwanzo, ἐπίστασις, na μέριμνα.
