  text: οὐ μέγα οὖν εἰ καὶ οἱ διάκονοι αὐτοῦ μετασχηματίζονται ὡς διάκονοι δικαιοσύνης, ὧν τὸ τέλος ἔσται κατὰ τὰ ἔργα αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/015.yaml
  text: So it is no great thing if his servants also disguise themselves as servants of righteousness[a], whose end will be according to their works.
translation:
  language: sw
  text: Kwa hiyo, si ajabu ikiwa watumishi wake pia hujifanya kuwa watumishi wa haki[a]; mwisho wao utakuwa kulingana na matendo yao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uadilifu.” Neno la Kigiriki linaweza kumaanisha haki au uadilifu; hapa linahusu kujionyesha kana kwamba wao ni watu wa haki.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μέγα
  choice: si ajabu
  rationale: Hii ni nahau inayomaanisha kwamba jambo hilo halishangazi; tafsiri hii ni ya kawaida na wazi katika Kiswahili cha sasa.
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Inaonyesha hitimisho linalotokana na mstari uliotangulia.
- source_word: διάκονοι
  choice: watumishi
  rationale: Katika muktadha huu ni watu wanaomtumikia Shetani; neno hili huepuka maana chanya ya kiofisi ambayo ingeweza kusikika katika ‘wahudumu.’
- source_word: μετασχηματίζονται
  choice: hujifanya kuwa
  rationale: Kitenzi kinaonyesha kubadili sura au jinsi wanavyojionyesha kwa udanganyifu, si mabadiliko ya ndani.
- source_word: ὡς
  choice: kuwa
  rationale: Pamoja na ‘hujifanya,’ linaonyesha cheo au sura wanayodai kuwa nayo.
- source_word: δικαιοσύνης
  choice: haki
  rationale: ‘Haki’ ndilo neno la kawaida la Kiswahili linaloweza kubeba maana za uadilifu na haki; hapa linahusu kujionyesha kuwa upande wa yaliyo sawa.
- source_word: τὸ τέλος
  choice: mwisho wao
  rationale: Inaeleza matokeo au hatima yao ya mwisho katika muktadha wa hukumu.
- source_word: κατὰ τὰ ἔργα αὐτῶν
  choice: kulingana na matendo yao
  rationale: Ni kauli ya hukumu inayoonyesha kwamba hatima yao italingana na yale waliyotenda; ‘matendo’ ni ya asili zaidi katika Kiswahili kuliko tafsiri halisi ya ‘kazi.’
theological_decisions:
- issue: Maana ya δικαιοσύνη katika kauli ya Paulo
  choice: haki
  alternative: uadilifu
  rationale: ‘Haki’ huhifadhi upana wa neno la Kigiriki, ambalo linaweza kumaanisha uadilifu au haki. Katika muktadha huu, watumishi hao hujionyesha kuwa wanatumikia yaliyo sawa, bila kuthibitisha kwamba kweli ni waadilifu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, wazi na yenye heshima. ‘Si ajabu’ inawasilisha nahau ya Kigiriki kwa kawaida; semikoloni inadumisha uhusiano wa karibu wa vipashio vya sentensi ya asili.
