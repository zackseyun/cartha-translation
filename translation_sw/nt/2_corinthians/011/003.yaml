base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/003.yaml
  text: But I fear that somehow[a], just as the serpent deceived Eve by his cunning[d][c][b], your minds may be corrupted from the sincerity and purity that are toward Messiah.
translation:
  language: sw
  text: Lakini ninaogopa kwamba kwa namna fulani, kama nyoka alivyomdanganya Hawa kwa hila yake, fikira zenu zinaweza kupotoshwa kutoka katika unyofu na usafi wenu kwa Masihi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati za kale hazina maneno “na usafi.” Neno lililotafsiriwa “unyofu” linaweza pia kumaanisha “urahisi” au “moyo usiogawanyika.”
    reason: textual_variant_and_lexical_alternative
lexical_decisions:
- source_word: φοβοῦμαι δὲ μή πως
  choice: Lakini ninaogopa kwamba kwa namna fulani
  rationale: Huwasilisha wasiwasi unaoendelea wa Paulo na muundo unaotambulisha jambo analolihofia kwa Kiswahili cha kawaida.
- source_word: ὁ ὄφις
  choice: nyoka
  rationale: Ni neno la kawaida la Kiswahili na linahifadhi rejeo la simulizi la Mwanzo.
- source_word: ἐξηπάτησεν Εὕαν
  choice: alimdanganya Hawa
  rationale: Kitenzi kinaonyesha udanganyifu; 'Hawa' ni jina la kawaida katika Biblia za Kiswahili.
- source_word: ἐν τῇ πανουργίᾳ αὐτοῦ
  choice: kwa hila yake
  rationale: '''Hila'' huonyesha ujanja wa kudanganya, na ''kwa'' huwasilisha maana ya njia au chombo.'
- source_word: φθαρῇ τὰ νοήματα ὑμῶν
  choice: fikira zenu huenda zikapotoshwa
  rationale: '''Fikira'' zinaweza kumaanisha mawazo au namna ya kufikiri; ''zikapotoshwa'' huhifadhi hali ya kutendwa na madhara yanayohofiwa.'
- source_word: ἀπὸ τῆς ἁπλότητος
  choice: na kuacha unyofu
  rationale: Katika muktadha huu ἁπλότης ni moyo usiogawanyika na wa kweli, si urahisi tu. Muundo 'zikapotoshwa na kuacha' unaeleza kwa Kiswahili uondokaji unaowakilishwa na ἀπό.
- source_word: καὶ τῆς ἁγνότητος
  choice: na usafi wa moyo
  rationale: Huonyesha usafi wa kiadili na wa kujitoa bila kuufinya kuwa usafi wa kingono pekee.
- source_word: τῆς εἰς τὸν Χριστόν
  choice: kwa Masihi
  rationale: Kishazi hiki kinaelekeza unyofu na usafi kwa Χριστός; 'Masihi' huhifadhi matumizi ya cheo.
theological_decisions:
- issue: Tafsiri ya Χριστόν
  choice: Masihi
  alternative: Kristo
  rationale: Χριστός kimsingi ni cheo kinachomaanisha Mtiwa-Mafuta; 'Masihi' huonyesha maana hiyo wazi katika muktadha wa kujitoa kwake.
- issue: Maana ya ἁπλότης
  choice: unyofu
  alternative: urahisi; moyo usiogawanyika
  rationale: '''Unyofu'' huwasilisha uaminifu wa moyo na kujitoa kusikogawanyika bila kuleta dhana hasi ya kutokuwa na maarifa.'
- issue: Kujumuishwa kwa καὶ τῆς ἁγνότητος
  choice: imejumuishwa kama 'na usafi wa moyo'
  alternative: kuondolewa
  rationale: SBLGNT inajumuisha maneno haya, hivyo yamo katika matini kuu; tofauti ya hati imeandikwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. 'Huenda zikapotoshwa na kuacha' ni muundo wa kawaida unaohifadhi wazo la fikira kuondolewa katika kujitoa kwa unyofu na usafi. Alama ya tanbihi [a] imewekwa baada ya sentensi.
