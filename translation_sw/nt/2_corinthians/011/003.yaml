  source_fidelity: 'Rasimu inafuata maana kuu ya Kigiriki: hofu ya Paulo, udanganyifu wa Hawa kwa hila ya nyoka, na hatari ya fikira za wasomaji kuondolewa katika unyofu na usafi unaomhusu Masihi. Hata hivyo, “na kuacha” huongeza tendo ambalo halimo wazi katika kauli ya pasivu φθαρῇ ... ἀπό, na “usafi wa moyo” huongeza “wa moyo” kwa ἁγνότης.'
