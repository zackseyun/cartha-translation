  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Mtawala” limetumiwa badala ya neno la kitaalamu lisilozoeleka; “mji wa Wadamasko” limehifadhi umbo lisilo la kawaida la chanzo, huku tanbihi ikifafanua mbadala wa kawaida.
