base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/032.yaml
  text: In Damascus[a], the ethnarch of King Aretas was guarding the city of the Damascenes in order to seize me,
translation:
  language: sw
  text: Katika Damasko, mtawala wa Mfalme Areta alikuwa akiulinda mji wa Wadamasko[a] ili anikamate,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mji wa Damasko.” Kigiriki kinasema kwa maana halisi zaidi, “mji wa Wadamasko.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν Δαμασκῷ
  choice: Huko Damasko
  rationale: Kirai hiki kinaonyesha mahali. “Huko Damasko” ni usemi wa asili katika Kiswahili na unaunganisha sentensi hii na simulizi linaloendelea.
- source_word: ἐθνάρχης
  choice: mtawala
  rationale: Neno hili humaanisha mtawala wa watu au eneo fulani. “Mtawala” linaeleweka kwa urahisi katika Kiswahili bila kudai cheo maalumu kisichozoeleka.
- source_word: Ἁρέτα τοῦ βασιλέως
  choice: wa Mfalme Areta
  rationale: Hifadhi ya muundo wa umilikaji inaonyesha kwamba mtawala huyo alikuwa chini ya mamlaka au katika utumishi wa Mfalme Areta, bila kufafanua uhusiano huo kupita ushahidi wa Kigiriki.
- source_word: ἐφρούρει
  choice: alikuwa akiulinda
  rationale: Muundo wa wakati uliopita unaoendelea unawakilisha imperfect ya Kigiriki na unaonyesha tendo lililokuwa likiendelea.
- source_word: τὴν πόλιν Δαμασκηνῶν
  choice: mji wa Wadamasko
  rationale: Hili linafuata kwa karibu genitive plural ya Kigiriki, yaani, kwa maana halisi, mji wa watu wa Damasko, huku tanbihi ikitoa tafsiri ya kawaida zaidi.
- source_word: πιάσαι με
  choice: ili anikamate
  rationale: Infinitive inaonyesha kusudi la kulinda mji. “Kukamata” ni pana na sahihi, bila kuingiza rasmi dhana ya kukamatwa kisheria.
