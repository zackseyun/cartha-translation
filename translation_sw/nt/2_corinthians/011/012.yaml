  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ὃ δὲ ποιῶ καὶ ποιήσω, ἵνα ἐκκόψω τὴν ἀφορμὴν τῶν θελόντων ἀφορμήν, ἵνα ἐν ᾧ καυχῶνται εὑρεθῶσιν καθὼς καὶ ἡμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/012.yaml
  text: But what I am doing[a], I will continue to do, in order to cut off the opportunity from those who want an opportunity, so that in what they boast about they may be found to be just as we are.
translation:
  language: sw
  text: Lakini kile ninachofanya, nitaendelea kukifanya, ili niwaondolee nafasi[a] wale wanaotaka nafasi, ili kwamba katika jambo wanalojivunia waonekane kuwa kama sisi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “fursa,” “sababu,” au “kisingizio”; neno la Kigiriki ἀφορμή limetumiwa mara mbili.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὃ δὲ ποιῶ καὶ ποιήσω
  choice: Lakini kile ninachofanya, nitaendelea kukifanya
  rationale: Wakati wa sasa ukifuatwa na wakati ujao unaonyesha tendo la Paulo la sasa na azimio lake la kuendelea nalo. Kiswahili hiki kinaweka wazi maana hiyo kwa njia ya kawaida.
- source_word: ἐκκόψω
  choice: niwanyang’anye
  rationale: Kitenzi hiki kina maana halisi ya kukata au kuondoa, na hapa kimetumiwa kwa njia ya sitiari kuhusu kuwazuia wapinzani wasiwe na nafasi. ‘Niwanyang’anye nafasi’ ni usemi wa asili wa Kiswahili unaohifadhi wazo la kuwaondolea walichotaka.
- source_word: ἀφορμή
  choice: nafasi
  rationale: Neno linaweza kumaanisha nafasi, fursa, sababu ya kujitetea, au kisingizio. ‘Nafasi’ ni tafsiri pana na isiyoamua mapema nia hususa ya wapinzani.
- source_word: τῶν θελόντων ἀφορμήν
  choice: wale wanaotaka nafasi
  rationale: Tafsiri hii inahifadhi urudiaji wenye mkazo wa ἀφορμή na kauli ya moja kwa moja ya Kigiriki.
- source_word: ἐν ᾧ καυχῶνται
  choice: katika jambo wanalojivunia
  rationale: Hii inaonyesha eneo au jambo linalohusika katika kujivuna kwao bila kulibainisha zaidi ya maandishi.
- source_word: εὑρεθῶσιν καθὼς καὶ ἡμεῖς
  choice: waonekane kuwa kama sisi
  rationale: ‘Waonekane kuwa’ huwasilisha wazo la kitenzi cha kutendwa ‘wapatikane/waonekane,’ huku ‘kama sisi’ ikihifadhi ulinganisho na Paulo pamoja na wenzake.
theological_decisions:
- issue: Asili ya ἀφορμή inayotafutwa na wapinzani wa Paulo
  choice: Nafasi
  alternative: Kisingizio; fursa
  rationale: Ingawa muktadha una mabishano makali na unaweza kudokeza ‘kisingizio,’ nomino yenyewe hailazimishi maana hiyo yenye hukumu ya kimaadili. Tafsiri ya ‘nafasi’ huhifadhi upana na mvutano wa maana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Urudiaji wa ‘nafasi’ umehifadhiwa kwa sababu unaakisi urudiaji wa makusudi katika Kigiriki.
