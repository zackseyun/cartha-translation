  text: τίς ἀσθενεῖ, καὶ οὐκ ἀσθενῶ; τίς σκανδαλίζεται καὶ οὐκ ἐγὼ πυροῦμαι;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/029.yaml
  text: Who is weak[a], and I am not weak? Who is caused to stumble, and I do not burn with indignation?
translation:
  language: sw
  text: Ni nani aliye dhaifu, nami nisiwe dhaifu? Ni nani anayekwazwa, nami nisiwake[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki ni “kuwaka.” Hii ni sitiari inayoweza kuonyesha huzuni kali, ari, au ghadhabu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσθενεῖ / ἀσθενῶ
  choice: aliye dhaifu / nisiwe dhaifu
  rationale: Neno ἀσθενέω linaweza kumaanisha udhaifu wa kimwili, kijamii, au kiroho. “Dhaifu” linahifadhi upana huo na kuonyesha jinsi Paulo anavyoshiriki udhaifu wa wengine.
- source_word: σκανδαλίζεται
  choice: anayekwazwa
  rationale: Kauli ya kutendwa inadokeza mtu anayefanywa ajikwae au anayeingizwa katika hatari ya kiroho au kimaadili. “Anayekwazwa” linadumisha sitiari bila kuamua ikiwa matokeo ni kuudhiwa, kutenda dhambi, au kuanguka kiroho.
- source_word: πυροῦμαι
  choice: nisiwake
  rationale: Kitenzi hiki kimsingi humaanisha kuwaka au kutiwa moto, na hapa kimetumiwa kisitiari kuhusu msukosuko mkali wa ndani. “Nisiwake” linahifadhi picha hiyo bila kuamua kwamba hisia inayokusudiwa ni hasira, huzuni, au ari.
- source_word: τίς
  choice: Ni nani
  rationale: τίς linaanzisha maswali ya balagha kuhusu watu; “Ni nani” ni tafsiri ya kawaida na ya moja kwa moja katika Kiswahili.
- source_word: καὶ οὐκ ἐγὼ
  choice: nami nisi-
  rationale: ἐγώ limetajwa wazi kwa mkazo. Muundo wa Kiswahili “nami nisi-” unaonyesha ushiriki binafsi wa Paulo na kuhifadhi nguvu ya swali la balagha kwa lugha ya asili.
theological_decisions:
- issue: Aina ya hisia inayowakilishwa na πυροῦμαι
  choice: Kuhifadhi sitiari ya “kuwaka” bila kutaja hisia mahsusi katika matini kuu.
  alternative: “Nisiwake kwa ghadhabu,” “nisihuzunike sana,” au “nisijazwe ari.”
  rationale: Muktadha unaonyesha mshikamano wa kina wa Paulo na msukosuko wake wa ndani, lakini neno la Kigiriki halilazimishi hisia moja tu. Sitiari inadumisha utata halisi na mvutano wa kichungaji wa kifungu.
- issue: Maana ya σκανδαλίζεται
  choice: Kutumia “anayekwazwa,” huku sitiari ya kujikwaa ikibaki wazi.
  alternative: “Anayeingizwa dhambini” au “anayeanguka kiroho.”
  rationale: Kauli ya Kigiriki inaweza kuelekea kwenye kuudhiwa, kushawishiwa kutenda dhambi, au kuanguka kiroho. Tafsiri kuu haipaswi kuchagua matokeo moja bila ushahidi wa kutosha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Maswali ya balagha yamehifadhiwa, na muundo “nami nisi-” unaonyesha kwa ufupi mshikamano wa Paulo na wengine.
