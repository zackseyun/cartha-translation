  text: ἔστιν ἀλήθεια Χριστοῦ ἐν ἐμοὶ ὅτι ἡ καύχησις αὕτη οὐ φραγήσεται εἰς ἐμὲ ἐν τοῖς κλίμασι τῆς Ἀχαΐας.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/010.yaml
  text: As the truth of Messiah is in me[c][b][a], this boasting of mine will not be silenced in the regions of Achaia.
translation:
  language: sw
  text: Kama kweli ya Masihi ilivyo ndani yangu,[a] huku kujisifu kwangu hakutakomeshwa[b] katika maeneo ya Akaya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kweli ya Kristo.”
    reason: alternative_reading
  - marker: b
    text: Au, “hakutanyamazishwa,” “hakutazuiwa,” au, kwa maana ya moja kwa moja, “hakutafungiwa kwangu.” Usemi wa Kigiriki ni wa kimethali na ni mgumu kutafsiri moja kwa moja.
    reason: lexical_alternative
  - marker: c
    text: Au, “huku kujisifu kwangu hakutanyamazishwa kunihusu.”
    reason: previous_rendering
lexical_decisions:
- source_word: ἀλήθεια Χριστοῦ
  choice: kweli ya Masihi
  rationale: Muundo wa kimilikishi umehifadhiwa kwa namna ya kawaida katika Kiswahili. “Masihi” linaonyesha cheo cha Χριστός bila kulifanya jina la kawaida tu.
- source_word: ἐν ἐμοὶ
  choice: ilivyo ndani yangu
  rationale: Huhifadhi maana ya moja kwa moja na uzito wa kauli ya Paulo bila kufafanua zaidi ya maandishi.
- source_word: ὅτι
  choice: kama vile
  rationale: Katika muundo huu ὅτι linaingiza tamko lenye nguvu inayofanana na kiapo; “kama vile” huwasilisha maana ya “kwa hakika kama” kwa Kiswahili cha asili.
- source_word: καύχησις
  choice: kujisifu
  rationale: Nomino hii inahusu tendo au maudhui ya kujisifu; kitenzi-jina “kujisifu” ni cha kawaida na kinaeleweka vizuri.
- source_word: φραγήσεται
  choice: hakutazuiwa
  rationale: Kitenzi hiki kwa msingi humaanisha kuziba au kuzuia. “Hakutazuiwa” huhifadhi hali ya kutendwa na sitiari bila kuibana kuwa kunyamazishwa pekee.
- source_word: εἰς ἐμὲ
  choice: kwangu
  rationale: Kirai hiki kigumu kimetolewa kwa umilikishi katika “kujisifu kwangu,” njia ya kawaida ya Kiswahili inayobeba wazo la kujisifu kunakomhusu Paulo.
- source_word: ἐν τοῖς κλίμασι τῆς Ἀχαΐας
  choice: katika maeneo ya Akaya
  rationale: “Maeneo” huhifadhi wingi wa κλίμασι na ni neno la kawaida kuliko tafsiri yenye ladha ya kiutawala.
- source_word: Ἀχαΐας
  choice: Akaya
  rationale: Hili ni umbo la Kiswahili linalotumiwa kwa jina la eneo la kale la Achaia.
theological_decisions:
- issue: Tafsiri ya Χριστοῦ
  choice: Masihi
  alternative: Kristo
  rationale: Katika kifungu hiki neno linaweza kusikika kama cheo; “Masihi” huhifadhi maana hiyo. “Kristo” limeonyeshwa katika tanbihi kwa kuwa ni umbo la jadi na pia linawezekana katika muktadha wa Paulo.
- issue: Uhusiano wa ἀλήθεια na Χριστοῦ
  choice: kweli ya Masihi
  alternative: ukweli wa Masihi / kweli inayomhusu Masihi
  rationale: Muundo wa Kigiriki unaweza kueleweka kama kweli iliyo ya Masihi au inayofungamana naye; tafsiri kuu haibainishi kwa lazima aina mahususi ya kimilikishi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa kauli yenye nguvu kama kiapo umehifadhiwa bila kuongeza moja kwa moja maneno “ninaapa.”
