id: 2CO.11.7
reference: 2 Corinthians 11:7
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἢ ἁμαρτίαν ἐποίησα ἐμαυτὸν ταπεινῶν ἵνα ὑμεῖς ὑψωθῆτε, ὅτι δωρεὰν τὸ τοῦ θεοῦ εὐαγγέλιον εὐηγγελισάμην ὑμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/007.yaml
  text: Or did I commit a sin by humbling myself so that you might be exalted[b][a], because I proclaimed the gospel of God to you free of charge?
translation:
  language: sw
  text: Au je, nilitenda dhambi kwa kujinyenyekeza ili ninyi muinuliwe, kwa sababu niliwatangazia Injili ya Mungu bila malipo?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “bure.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἢ
  choice: Au je
  rationale: Hutanguliza swali la balagha linalohusiana na hoja iliyotangulia; muundo huu ni wa kawaida na wenye makali yanayofaa katika Kiswahili.
- source_word: ἁμαρτίαν ἐποίησα
  choice: nilitenda dhambi
  rationale: Ni tafsiri ya asili ya nahau ya Kigiriki, ambayo kwa karibu ni ‘kufanya dhambi’; inadumisha kategoria ya maadili bila kuipunguza kuwa kosa la kawaida.
- source_word: ἐμαυτὸν ταπεινῶν
  choice: kwa kujinyenyekeza
  rationale: Huwakilisha kishirikishi kwa namna ya kielezi na kudumisha maana ya Paulo kujishusha mwenyewe.
- source_word: ἵνα ὑμεῖς ὑψωθῆτε
  choice: ili ninyi muinuliwe
  rationale: Hudumisha kishazi cha kusudi, hali ya kutendwa, na utofautishaji wa hadhi kati ya Paulo kujinyenyekeza na Wakorintho kuinuliwa.
- source_word: ὅτι
  choice: kwa sababu
  rationale: Hueleza msingi wa jambo linalodhaniwa kuwa dhambi kwa muunganisho ulio wazi katika Kiswahili.
- source_word: δωρεὰν
  choice: bila malipo
  rationale: Ni usemi wa sasa, wenye heshima, unaoonyesha kwamba Paulo hakudai malipo kwa huduma hiyo.
- source_word: τὸ τοῦ θεοῦ εὐαγγέλιον
  choice: Injili ya Mungu
  rationale: Hudumisha muundo wa kimilikishi wa Kigiriki na istilahi ya Kibiblia inayotambulika kwa urahisi.
- source_word: εὐηγγελισάμην ὑμῖν
  choice: niliwatangazia
  rationale: Huonyesha tendo la kupeleka tangazo la Injili kwao bila kulifanya liwe tu tendo la kuhubiri katika mazingira rasmi.
theological_decisions:
- issue: Asili ya swali la balagha kuhusu kujinyenyekeza kwa Paulo na kutopokea malipo
  choice: Swali limetafsiriwa moja kwa moja huku kejeli yake ikiachwa ionekane katika muktadha.
  alternative: Kulifafanua kwa kuongeza kwamba Paulo aliacha haki yake ya kitume, au kulilegeza liwe kama ombi la msamaha.
  rationale: Kigiriki huuliza kama kujinyenyekeza kwake na kutangaza Injili bila malipo kulikuwa dhambi. Tafsiri haipaswi kuongeza msimamo wa kimadhehebu kuhusu malipo ya wahudumu wala kuondoa mvutano wa swali.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Ninyi’ imedumishwa kwa msisitizo wa kiwakilishi cha Kigiriki, na ‘muinuliwe’ huhifadhi utofautishaji na ‘kujinyenyekeza.’
