  text: For I consider that I am not in the least inferior to those super-apostles[a].
translation:
  language: sw
  text: Kwa maana nadhani kwamba mimi si duni hata kidogo kuliko mitume hao wakuu sana.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mitume hao mashuhuri sana.” Usemi wa Kigiriki unaweza kueleweka kwa kejeli, yaani “mitume wakuu sana,” au kama rejeo la kawaida kwa mitume walioheshimiwa sana.
    reason: alternative_reading
lexical_decisions:
- source_word: λογίζομαι
  choice: ninaona
  rationale: Hapa kitenzi kina maana ya kufikiri au kukadiria baada ya kutafakari. “Ninaona” ni usemi wa kawaida na wenye hadhi katika Kiswahili, na unaonyesha tathmini ya Paulo.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Kiunganishi hiki kinatoa sababu au ufafanuzi wa kauli iliyotangulia; “kwa maana” kinaendeleza hoja hiyo kwa uwazi.
- source_word: μηδὲν
  choice: hata kidogo
  rationale: Neno hili linatumika kwa mkazo pamoja na kitenzi kisoukomo, likimaanisha kutokuwa duni kwa namna yoyote. “Hata kidogo” linaonyesha mkazo huo kwa Kiswahili cha asili.
- source_word: ὑστερηκέναι
  choice: si duni
  rationale: Kitenzi hiki katika ulinganisho kinaeleza kuwa nyuma au pungufu kwa wengine. “Si duni” ni kifupi, wazi, na cha kawaida katika Kiswahili.
- source_word: τῶν ὑπερλίαν ἀποστόλων
  choice: hao “mitume wakuu kupita kiasi”
  rationale: “Wakuu kupita kiasi” hudumisha maana ya ὑπερλίαν, yaani kwa kiwango kilichozidi mno, huku alama za kunukuu zikidokeza kejeli inayowezekana bila kuifanya kuwa hakika. “Hao” linaelekeza kwa watu wanaozungumziwa katika muktadha.
theological_decisions:
- issue: Ikiwa τῶν ὑπερλίαν ἀποστόλων ni jina la kejeli kwa wapinzani wa Paulo au rejeo la kawaida kwa mitume walioheshimiwa sana
  choice: hao “mitume wakuu kupita kiasi”
  alternative: mitume mashuhuri sana
  rationale: Muktadha unaunga mkono uwezekano mkubwa wa kejeli dhidi ya wapinzani wanaojisifu, lakini maneno yenyewe yanaweza pia kueleweka kama rejeo la moja kwa moja kwa mitume mashuhuri. Tafsiri kuu inadokeza kejeli, na tanbihi inadumisha usomaji mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi, na chenye hadhi. Muundo unaendeleza hoja ya Paulo na kuhifadhi mkazo pamoja na utata wa usemi wake wa mwisho.
