  text: And no wonder[a], for Satan himself disguises himself as an angel of light.
translation:
  language: sw
  text: Wala si ajabu, kwa maana Shetani mwenyewe hujifanya kuwa[a] malaika wa nuru.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hujigeuza kuwa malaika wa nuru.” Kitenzi cha Kigiriki kinaweza kumaanisha kubadili umbo, lakini hapa huenda kinarejelea kujionyesha kwa udanganyifu.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Wala
  rationale: Katika muktadha huu kiunganishi kinaendeleza hoja ya mstari uliotangulia; “Wala” ni ya kawaida na inaendana vizuri na usemi hasi “si ajabu.”
- source_word: οὐ θαῦμα
  choice: si ajabu
  rationale: Ni usemi wa kawaida wa Kiswahili unaowasilisha maana ya kwamba jambo hilo halishangazi.
- source_word: αὐτὸς ... ὁ Σατανᾶς
  choice: Shetani mwenyewe
  rationale: “Mwenyewe” linaonyesha mkazo wa αὐτός, huku jina Shetani likitolewa kwa namna ya kawaida katika Kiswahili.
- source_word: γὰρ
  choice: kwa maana
  rationale: Linaonyesha kwamba kinachofuata ndiyo sababu jambo hilo lisishangaze.
- source_word: μετασχηματίζεται
  choice: hujifanya kuwa
  rationale: Katika muktadha wa udanganyifu, usemi huu unaonyesha kujionyesha kwa sura au hali isiyo yake bila kudai kwamba asili yake hubadilika kweli.
- source_word: εἰς
  choice: kuwa
  rationale: Linaunganisha kitenzi na sura au nafasi anayojionyesha kuwa nayo kwa Kiswahili cha kawaida.
- source_word: ἄγγελον
  choice: malaika
  rationale: Muktadha wa Shetani unaonyesha kiumbe wa ulimwengu wa roho, si mjumbe wa kawaida wa kibinadamu.
- source_word: φωτός
  choice: wa nuru
  rationale: Huhifadhi taswira ya Kigiriki na usemi wa kibiblia bila kuongeza ufafanuzi.
theological_decisions:
- issue: Aina ya badiliko la Shetani
  choice: Kujionyesha kwa udanganyifu kuwa malaika wa nuru
  alternative: Kujigeuza kweli na kuwa malaika wa nuru
  rationale: Muktadha unahusu mitume wa uongo wanaojifanya kuwa kitu ambacho si wao. “Hujifanya kuwa” linaonyesha udanganyifu huo bila kutoa dai la ziada kuhusu badiliko la kiasili, huku tanbihi ikihifadhi uwezekano wa tafsiri iliyo karibu zaidi na umbo la kitenzi cha Kigiriki.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Si ajabu” na “hujifanya kuwa” ni misemo inayoeleweka kwa urahisi, huku “malaika wa nuru” ikihifadhi taswira ya chanzo.
