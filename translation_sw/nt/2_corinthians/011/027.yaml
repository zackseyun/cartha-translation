base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/027.yaml
  text: in labor and hardship[a], in many sleepless nights, in hunger and thirst, in frequent fastings[b], in cold and exposure.
translation:
  language: sw
  text: katika kazi ngumu na taabu, katika kukosa usingizi mara nyingi, katika njaa na kiu, katika kufunga mara kwa mara[a], katika baridi na kukosa mavazi ya kutosha[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “funga za mara kwa mara.” Neno la Kigiriki linaweza kurejelea kufunga kulikorudiwa; mstari hausemi ikiwa kufunga huko kulikuwa kwa hiari au kulisababishwa na mazingira.
    reason: lexical_alternative
  - marker: b
    text: Au, “uchi.” Hapa huenda maana yake ni kutokuwa na mavazi ya kutosha na hivyo kuathiriwa na hali ya hewa.
    reason: lexical_alternative
lexical_decisions:
- source_word: κόπῳ
  choice: kazi ngumu
  rationale: Neno hili linaonyesha kazi inayochosha na inayohitaji juhudi nyingi. ‘Kazi ngumu’ ni Kiswahili cha kawaida kinachohifadhi uzito wa juhudi hizo.
- source_word: μόχθῳ
  choice: taabu
  rationale: Neno hili huongeza wazo la dhiki au usumbufu unaoandamana na kazi. ‘Taabu’ linatofautisha maana yake na κόπος bila kupoteza mkusanyiko wa mateso katika orodha.
- source_word: ἐν ἀγρυπνίαις πολλάκις
  choice: katika kukosa usingizi mara nyingi
  rationale: ἀγρυπνία linaweza kumaanisha hali ya kuwa macho au kukosa usingizi. Tafsiri hii haidai kwamba vipindi hivyo vyote vilikuwa kesha za hiari.
- source_word: ἐν λιμῷ καὶ δίψει
  choice: katika njaa na kiu
  rationale: Maneno haya yanataja hali za kunyimwa chakula na maji. Muundo wa ‘katika’ unadumisha mfululizo wa vifungu vya Kigiriki.
- source_word: ἐν νηστείαις πολλάκις
  choice: katika kufunga mara kwa mara
  rationale: νηστεία humaanisha kufunga, na hapa limetumika kwa wingi pamoja na πολλάκις. Tafsiri haibainishi ikiwa kufunga huko kulikuwa kwa hiari au kulisababishwa na mazingira.
- source_word: ἐν ψύχει
  choice: katika baridi
  rationale: ψῦχος ni baridi kama hali iliyovumiliwa; tafsiri fupi inafaa mtindo wa orodha.
- source_word: γυμνότητι
  choice: kukosa mavazi ya kutosha
  rationale: Katika orodha hii ya mateso, neno linaweza kueleza uchi au hali ya kutokuwa na mavazi ya kutosha na hivyo kuathiriwa na mazingira. Chaguo hili linatoa maana inayowezekana zaidi katika Kiswahili cha sasa, huku ‘uchi’ ukihifadhiwa katika tanbihi.
theological_decisions:
- issue: Maana ya νηστείαις katika orodha ya mateso ya Paulo
  choice: kufunga
  alternative: kukosa chakula au kunyimwa chakula kwa sababu ya mazingira
  rationale: Kwa kuwa λιμός tayari limetaja njaa, ‘kufunga’ linahifadhi tofauti ya msamiati. Hata hivyo, mstari hausemi wazi kama kufunga huko kulikuwa kwa hiari, kwa kusudi la kidini, au kulisababishwa na mazingira; tanbihi inaacha jambo hilo wazi.
- issue: Maana ya γυμνότητι
  choice: kukosa mavazi ya kutosha
  alternative: uchi
  rationale: Katika muktadha wa baridi na mateso, huenda neno hili linamaanisha ukosefu wa mavazi ya kutosha na kuathiriwa na hali ya hewa, si lazima uchi kamili. Tanbihi inahifadhi tafsiri ya moja kwa moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo unaorudia ‘katika’ umehifadhiwa ili kuonyesha mkusanyiko wa mateso katika Kigiriki, huku misemo kama ‘kukosa usingizi’ na ‘kukosa mavazi ya kutosha’ ikiepuka lugha ya kizamani au yenye utata usio wa lazima.
