base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/016.yaml
  text: Again I say[a], let no one think me to be foolish—but if not, then receive me even as foolish, so that I too may boast a little.
translation:
  language: sw
  text: 'Nasema tena: mtu yeyote asidhani kwamba mimi ni mpumbavu[a]—lakini kama sivyo, nikubalini kama mpumbavu, ili nami nijisifu kidogo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtu yeyote asidhani kwamba mimi ni asiye na busara … nikubalini kama asiye na busara.” Neno la Kigiriki ἄφρων linaweza kutumiwa kama sifa (“asiye na busara”) au kama jina (“mpumbavu”).
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάλιν λέγω
  choice: Nasema tena
  rationale: Hutoa kwa ufupi na kwa lugha ya kawaida wazo la Paulo kurudia ombi lake.
- source_word: μή τίς με δόξῃ ἄφρονα εἶναι
  choice: mtu yeyote asidhani kwamba mimi ni mpumbavu
  rationale: Muundo wa kukataza wenye μή na hali tegemezi umetafsiriwa kwa ‘asidhani’; ‘mpumbavu’ huhifadhi lugha kali na ya kejeli ya ἄφρων.
- source_word: εἰ δὲ μή γε
  choice: lakini ikiwa sivyo
  rationale: Kirai hiki kifupi kinaonyesha kwamba, wasipokubali ombi la kwanza, wanapaswa angalau kukubali linalofuata; ‘ikiwa sivyo’ ni ya asili na huhifadhi udokezo huo.
- source_word: κἂν ὡς ἄφρονα δέξασθέ με
  choice: nikubalini hata kama mpumbavu
  rationale: ‘Hata kama’ huhifadhi maana ya kukubali kwa sharti, na ‘nikubalini’ huwasilisha mwito wa Paulo wakubali nafasi yake ya kusema.
- source_word: ἵνα κἀγὼ μικρόν τι καυχήσωμαι
  choice: ili nami nijisifu kidogo
  rationale: ‘Ili’ huonyesha kusudi, ‘nami’ huhifadhi msisitizo wa κἀγώ, na ‘nijisifu’ huacha wazi lugha ya kujisifu badala ya kuilegeza.
theological_decisions:
- issue: Maelezo ya Paulo mwenyewe kwa lugha ya ἄφρων na καυχάομαι
  choice: Kudumisha maneno ‘mpumbavu’ na ‘nijisifu’ pamoja na kejeli yake
  alternative: Kuyalainisha kuwa ‘nasema bila busara’ au ‘nijitetee kidogo’
  rationale: Muktadha unaonyesha Paulo akikubali kwa muda aonekane mpumbavu ili ajisifu kwa kusita; tafsiri haipaswi kuondoa mvutano huo wa balagha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi huhifadhi muundo wa hoja na kejeli ya Paulo bila kuwa ngumu isivyo lazima.
