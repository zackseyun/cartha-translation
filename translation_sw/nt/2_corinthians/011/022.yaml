id: 2CO.11.22
reference: 2 Corinthians 11:22
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἑβραῖοί εἰσιν; κἀγώ. Ἰσραηλῖταί εἰσιν; κἀγώ. σπέρμα Ἀβραάμ εἰσιν; κἀγώ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/022.yaml
  text: Are they Hebrews? So am I[a]. Are they Israelites? So am I. Are they Abraham’s offspring? So am I.
translation:
  language: sw
  text: Je, wao ni Waebrania? Mimi pia. Je, wao ni Waisraeli? Mimi pia. Je, wao ni uzao wa Abrahamu? Mimi pia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mbegu ya Abrahamu.” Kigiriki kinatumia usemi wa umoja wenye maana ya pamoja.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἑβραῖοί
  choice: Waebrania
  rationale: Ni jina la kawaida la kikabila na kidini katika Kiswahili, na linadumisha tofauti yake na “Waisraeli” katika mfululizo wa Paulo.
- source_word: κἀγώ
  choice: Mimi pia
  rationale: Kauli hii fupi na yenye mkazo inawakilisha muungano wa καί + ἐγώ na kudumisha urudiaji wa balagha.
- source_word: Ἰσραηλῖταί
  choice: Waisraeli
  rationale: Neno hili linaonyesha kuwa sehemu ya watu wa Israeli na linatofautishwa na “Waebrania” na “uzao wa Abrahamu.”
- source_word: σπέρμα Ἀβραάμ
  choice: uzao wa Abrahamu
  rationale: “Uzao” ni usemi wa Kiswahili unaoweza kuwa wa pamoja, hivyo unahifadhi wazo la nomino ya umoja yenye maana ya jumla katika Kigiriki.
- source_word: εἰσιν
  choice: wao ni / Mimi pia
  rationale: Kitenzi kimewasilishwa kwa kawaida ndani ya maswali na majibu mafupi, huku muundo wa swali na jibu ukihifadhiwa.
theological_decisions:
- issue: Tofauti nyeti kati ya istilahi za utambulisho wa Kiyahudi
  choice: 'Kuhifadhi majina matatu tofauti: “Waebrania,” “Waisraeli,” na “uzao wa Abrahamu”'
  alternative: Kuyafanya yote kuwa visawe kama “Wayahudi” au “wazao wa Abrahamu”
  rationale: Hoja ya Paulo inategemea madai yanayokaribiana lakini yasiyofanana kabisa kuhusu utambulisho na urithi; kuyaunganisha kungepunguza mkazo wa chanzo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Maswali mafupi na jibu linalorudiwa “Mimi pia” yanahifadhi mtindo mkato na wenye mkazo wa kifungu.
