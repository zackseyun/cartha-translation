base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/031.yaml
  text: The God and Father of the Lord Jesus[a], he who is blessed forever, knows that I am not lying.
translation:
  language: sw
  text: Mungu na Baba wa Bwana Yesu, yeye anayesifiwa milele[a], anajua kwamba sisemi uongo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya karibu zaidi na maneno ya asili, “kwa enzi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ θεὸς καὶ πατὴρ
  choice: Mungu na Baba
  rationale: Kirai hiki kinahifadhi nomino zote mbili chini ya kibainishi kimoja na uzito wa kauli ya Paulo ya kumwita Mungu shahidi.
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: wa Bwana Yesu
  rationale: Jina la cheo κύριος limetafsiriwa kuwa “Bwana,” bila kuongeza “wetu,” ambalo halipo katika maandishi ya Kiyunani.
- source_word: οἶδεν
  choice: anajua
  rationale: Hii ndiyo maana ya moja kwa moja ya kitenzi; ingawa kauli inafanya kazi kama kiapo, haijapanuliwa kuwa “ni shahidi.”
- source_word: ὁ ὢν εὐλογητὸς
  choice: yeye anayebarikiwa
  rationale: Muundo huu unamtambulisha Mungu kwa maelezo ya kidoksolojia na unabaki wa kawaida na wenye heshima katika Kiswahili.
- source_word: εἰς τοὺς αἰῶνας
  choice: milele
  rationale: “Milele” ni usemi wa kawaida wa Kiswahili unaowasilisha vizuri kudumu kwa sifa hii; tafsiri halisi zaidi imeonyeshwa katika tanbihi.
- source_word: ὅτι
  choice: kwamba
  rationale: Hapa ὅτι inaanzisha jambo ambalo Mungu analijua, wala si sababu.
- source_word: οὐ ψεύδομαι
  choice: sisemi uongo
  rationale: Hii ni tafsiri ya asili na ya sasa katika Kiswahili, inayofaa uthibitisho wa Paulo kwamba hasemi uongo.
theological_decisions:
- issue: Uhusiano wa “Mungu na Baba” na “Bwana Yesu”
  choice: Mungu na Baba wa Bwana Yesu
  alternative: Kufafanua kwa maneno mengine ili kupunguza tofauti ya wahusika
  rationale: Tafsiri inahifadhi moja kwa moja tofauti ya kiuhusiano iliyo katika maandishi bila kuiondoa wala kuieleza kwa mtazamo wa kimadhehebu.
- issue: Uambatanisho wa kishazi cha kidoksolojia
  choice: Kukichukulia “yeye anayebarikiwa milele” kuwa maelezo ya ziada yanayomhusu Mungu
  alternative: Kukifungamanisha kama kishazi bainishi cha lazima
  rationale: Kishazi hiki kinafanya kazi kiasili kama kauli ya heshima ya pembeni ndani ya uthibitisho wenye uzito; koma zinasaidia usomaji bila kubadili uhusiano wake na Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Mpangilio wa kishazi umehifadhi uzito wa kauli ya Paulo bila kuwa wa kizamani.
