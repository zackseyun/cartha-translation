translation:
  language: sw
  text: Kwa maana mnawavumilia wapumbavu kwa furaha[a], ninyi mlio na hekima[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mnastahimili wapumbavu kwa furaha.”
    reason: lexical_alternative
  - marker: b
    text: Paulo anasema kwa kejeli; utofautishaji kati ya «wapumbavu» na «wenye hekima» unaonyesha kejeli hiyo.
    reason: cultural_note
lexical_decisions:
- source_word: ἡδέως
  choice: kwa furaha
  rationale: Huonyesha kuvumilia kwa hiari au kwa kupendezwa; katika muktadha huu inadumisha kejeli ya Paulo kwa Kiswahili cha kawaida.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Inaunganisha mstari huu na yaliyotangulia kwa kutoa sababu au ufafanuzi.
- source_word: ἀνέχεσθε
  choice: mnawavumilia
  rationale: Kitenzi hiki humaanisha kustahimili au kuvumilia watu; umbo lenye kiambishi cha watu linafaa kwa τῶν ἀφρόνων.
- source_word: τῶν ἀφρόνων
  choice: wapumbavu
  rationale: Ni watu wasio na busara, na neno hili linahifadhi utofautishaji wa moja kwa moja na 'wenye hekima.'
- source_word: φρόνιμοι
  choice: wenye hekima
  rationale: Linadumisha tofauti ya kimakusudi kati ya wapumbavu na wenye hekima na pia kejeli iliyomo.
- source_word: ὄντες
  choice: mlio
  rationale: Linawakilisha kihusishi cha hali bila kuamua wazi kama maana yake ni sababu ('kwa kuwa') au concessive ('ingawa').
theological_decisions:
- issue: Kejeli ya Paulo kwa Wakorintho
  choice: Kauli imetafsiriwa moja kwa moja, huku utofauti wa 'wapumbavu' na 'wenye hekima' ukibeba kejeli.
  alternative: Kuifanya kejeli iwe wazi zaidi kwa kusema, kwa mfano, 'kwa kuwa mnajiona kuwa wenye hekima sana.'
  rationale: Kigiriki hakisemi moja kwa moja kwamba wanajiona hivyo; kuongeza maneno hayo kungeondoa utata na kuingiza ufafanuzi ndani ya matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio wa sentensi huhifadhi uhusiano wa sababu na kejeli ya Kigiriki bila kuifanya tafsiri kuwa nzito.
