  text: Mara tano nilipokea kutoka kwa Wayahudi mapigo arobaini kasoro moja.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “arobaini kasoro moja”; yaani, mapigo thelathini na tisa.
    reason: lexical_alternative
  - marker: b
    text: Au, “Mara tano nilipewa na Wayahudi mapigo arobaini kasoro moja.” Kigiriki kinawataja Wayahudi kuwa chanzo au watendaji wa adhabu bila kutaja baraza au mamlaka fulani.
