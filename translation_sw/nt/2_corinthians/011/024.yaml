lexical_decisions:
- source_word: ὑπὸ Ἰουδαίων
  choice: kutoka kwa Wayahudi
  rationale: Muundo wa ὑπό pamoja na hali ya kumiliki unaonyesha watendaji au chanzo cha adhabu. ‘Kutoka kwa Wayahudi’ ni Kiswahili cha kawaida na hakiongezi dhana ya baraza au mamlaka maalumu ambayo haijatajwa wazi.
- source_word: πεντάκις
  choice: Mara tano
  rationale: Hii ndiyo maana ya moja kwa moja ya kielezi hiki na inadumisha msisitizo wa tukio kurudiwa.
- source_word: τεσσεράκοντα παρὰ μίαν
  choice: mapigo arobaini kasoro moja
  rationale: Usemi huu una maana halisi ya ‘arobaini kasoro moja.’ Neno ‘mapigo’ linawekwa wazi kutokana na muktadha wa adhabu, huku muundo wa Kigiriki ukihifadhiwa badala ya kubadilishwa moja kwa moja kuwa ‘mapigo thelathini na tisa.’
- source_word: ἔλαβον
  choice: nilipokea
  rationale: Kitenzi λαμβάνω hapa humaanisha kupokea au kupatwa na adhabu. ‘Nilipokea’ kinadumisha picha ya kitenzi cha asili bila kuongeza wazo la kustahimili.
theological_decisions:
- issue: Utambulisho wa waliotekeleza adhabu
  choice: kutoka kwa Wayahudi
  alternative: na Wayahudi; kutoka kwa viongozi wa Kiyahudi
  rationale: Andiko linawataja Wayahudi kama chanzo au watendaji wa adhabu bila kubainisha baraza au mamlaka fulani; kwa hiyo tafsiri haipaswi kuongeza ubainisho huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Mapigo’ linaeleweka kwa urahisi katika muktadha wa adhabu; ‘kasoro moja’ ni usemi wa kawaida unaohifadhi muundo wa asili.
