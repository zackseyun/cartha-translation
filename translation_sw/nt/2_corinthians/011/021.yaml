  text: κατὰ ἀτιμίαν λέγω, ὡς ὅτι ἡμεῖς ⸀ἠσθενήκαμεν· ἐν ᾧ δ’ ἄν τις τολμᾷ, ἐν ἀφροσύνῃ λέγω, τολμῶ κἀγώ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/021.yaml
  text: I say this to our shame[a], as though we had been weak[d][c][b]. Yet in whatever anyone dares to boast—I am speaking foolishly—I also dare.
translation:
  language: sw
  text: Nasema haya kwa aibu yetu[a], kana kwamba sisi tumekuwa dhaifu[b]. Lakini katika jambo lolote ambamo mtu yeyote anathubutu kujisifu[c]—nasema kwa upumbavu[d]—mimi pia nathubutu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nasema haya kwa njia ya fedheha”; kirai cha Kigiriki ni nahau na kinaweza pia kueleweka kuwa “nasema haya kama jambo la aibu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kana kwamba sisi tulikuwa dhaifu.” Paulo anazungumza kwa kejeli katika muktadha wa kujisifu kwake kwa “upumbavu.”
    reason: lexical_alternative
  - marker: c
    text: Kihalisi, “katika jambo lolote ambamo mtu yeyote anathubutu.” Wazo la “kujisifu” limedokezwa na muktadha unaozunguka.
    reason: lexical_alternative
  - marker: d
    text: Au, “nasema kama mpumbavu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ ἀτιμίαν
  choice: kwa aibu yetu
  rationale: Kirai hiki ni nahau yenye maana inayotegemea muktadha. Hapa kinaonyesha fedheha inayodhaniwa kuwa ya Paulo na wenzake kwa kuonekana dhaifu mbele ya wapinzani; tafsiri hii inahifadhi nguvu ya kejeli bila kuwa ngumu kwa Kiswahili.
- source_word: ὡς ὅτι ἡμεῖς ἠσθενήκαμεν
  choice: kana kwamba sisi tulikuwa dhaifu
  rationale: «Kana kwamba» linadumisha hali ya dhana au ukubali wa kejeli, huku «tulikuwa dhaifu» likieleza udhaifu wa hadhi au ujasiri katika mashindano haya ya kujisifu, si lazima ugonjwa wa mwili.
- source_word: ἐν ᾧ δ’ ἄν τις τολμᾷ
  choice: Lakini katika jambo lolote ambalo mtu mwingine anathubutu kujisifu
  rationale: «Katika jambo lolote» linaonyesha eneo au jambo ambalo mtu ana ujasiri. Kitenzi «kujisifu» hakipo wazi katika maneno yenyewe, lakini kimedokezwa sana na muktadha wa karibu na kinafanya Kiswahili kieleweke.
- source_word: ἐν ἀφροσύνῃ λέγω
  choice: nasema kwa upumbavu
  rationale: Tafsiri hii inahifadhi muundo na maana ya kauli ya Paulo ya kujitambua kwamba anatumia mtindo wa mazungumzo ya kipumbavu.
- source_word: τολμῶ κἀγώ
  choice: mimi pia nathubutu
  rationale: Inadumisha urudiaji wa kitenzi τολμάω na mkazo wa κἀγώ; jambo analothubutu kufanya linaeleweka kutoka kwa «kujisifu» katika kishazi kilichotangulia.
theological_decisions:
- issue: Kejeli ya Paulo kuhusu udhaifu wake
  choice: 'Kuitafsiri kama ukubali wa kejeli: «kana kwamba sisi tulikuwa dhaifu»'
  alternative: 'Kuitafsiri kama ungamo la moja kwa moja: «kwa kuwa sisi tulikuwa dhaifu»'
  rationale: Muktadha mpana ni hotuba ya Paulo ya «kipumbavu» inayowalinganisha yeye na wapinzani wanaojisifu. «Kana kwamba» linahifadhi mvutano wa usemi wake bila kudai kwamba anakiri kukosa uhalali wa kitume.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi unadumisha kejeli, vipashio vya pembeni vya Paulo, na urudiaji wa «anathubutu/nathubutu» bila kuleta msimamo wa kimadhehebu.
