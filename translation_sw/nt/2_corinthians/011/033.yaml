translation:
  language: sw
  text: Nami nilishushwa ndani ya kikapu kupitia dirisha lililokuwa ukutani, nikaponyoka mikononi mwake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “niliteremshwa kupitia ukuta ndani ya kikapu cha kamba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: θυρίδος
  choice: dirishani
  rationale: Neno θυρίς humaanisha dirisha au tundu dogo. ‘Dirishani’ ni la kawaida na linaonyesha njia ambayo Paulo alipitia.
- source_word: σαργάνῃ
  choice: kikapu
  rationale: Neno σαργάνη humaanisha chombo kilichosokotwa, huenda kwa kamba au fito. ‘Kikapu’ ni wazi kwa wasomaji wa sasa, huku uwezekano wa kikapu cha kamba ukihifadhiwa katika tanbihi.
- source_word: ἐχαλάσθην
  choice: nilishushwa
  rationale: Kauli tendwa ya χαλάω hapa inaonyesha kushushwa chini, yaelekea kwa kamba. ‘Nilishushwa’ ni ya asili na sahihi katika Kiswahili.
- source_word: διὰ τοῦ τείχους
  choice: katika ukuta
  rationale: Kirai hiki kinaonyesha kupita kwenye tundu lililokuwa katika ukuta. ‘Katika ukuta’ kinaepuka dhana isiyo sahihi ya kupenya moja kwa moja ndani ya ukuta, huku kikihifadhi uhusiano wa dirisha na ukuta.
- source_word: ἐξέφυγον τὰς χεῖρας αὐτοῦ
  choice: nikaponyoka mikononi mwake
  rationale: Hii inahifadhi taswira ya Kigiriki ya kuponyoka katika mikono, yaani kutoka katika uwezo au mtego wa mtu, na ni nahau ya kawaida ya Kiswahili.
