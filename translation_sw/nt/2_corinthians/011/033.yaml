translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umewekwa wa kawaida kwa msomaji huku taswira ya kushushwa kupitia dirisha lililokuwa katika ukuta na kuponyoka mikononi mwa mtawala ikihifadhiwa.
