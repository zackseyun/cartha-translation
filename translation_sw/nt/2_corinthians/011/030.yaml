translation:
  language: sw
  text: Ikiwa ni lazima nijisifu, nitajisifu juu ya mambo ya udhaifu wangu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa usemi wa kawaida zaidi, “nitajisifu kuhusu udhaifu wangu.” Kigiriki kinasema kwa karibu zaidi, “nitajisifu juu ya mambo ya udhaifu wangu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ
  choice: Ikiwa
  rationale: Huhifadhi muundo wa sharti wa Kigiriki bila kuufanya kuwa sababu kwa kutumia ‘kwa kuwa.’
- source_word: καυχᾶσθαι / καυχήσομαι
  choice: kujisifu / nitajisifu
  rationale: ‘Kujisifu’ ni neno la kawaida na la sasa linalobeba maana ya καυχάομαι na kudumisha urudiaji wa kimakusudi katika sentensi.
- source_word: δεῖ
  choice: ni lazima
  rationale: Hueleza ulazima kwa ufupi na kuhifadhi nguvu ya hali inayomlazimisha Paulo katika hoja yake.
- source_word: τὰ τῆς ἀσθενείας μου
  choice: mambo ya udhaifu wangu
  rationale: Huhifadhi wingi wa τὰ na muundo usio wa kawaida wa Kigiriki, unaorejelea mambo yanayohusiana na au kudhihirisha udhaifu wa Paulo.
- source_word: ἀσθενείας
  choice: udhaifu
  rationale: ‘Udhaifu’ ni tafsiri pana na ya kawaida inayofaa mazingira ya hali za kudhalilisha ambazo Paulo amezitaja, bila kuzuia maana kwenye ugonjwa wa mwili.
theological_decisions:
- issue: Asili ya kujisifu kwa Paulo
  choice: Kauli imetafsiriwa kama kujisifu kunakolenga mambo ya udhaifu, huku mvutano wa kimakusudi ukihifadhiwa.
  alternative: Kufafanua moja kwa moja kuwa Paulo anajisifu kuhusu udhaifu wake au mambo yanayothibitisha udhaifu wake.
  rationale: Muundo wa Kigiriki unaweka pamoja kujisifu na udhaifu kwa namna yenye mvutano. Tafsiri haiongezi ufafanuzi wa kimadhehebu wala kuondoa kejeli ya kimuktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi na inayoeleweka. Muundo ‘mambo ya udhaifu wangu’ umehifadhiwa kwa makusudi ili kuakisi usemi usio wa kawaida wa Kigiriki, huku tanbihi ikitoa namna ya kawaida zaidi.
