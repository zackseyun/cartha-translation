  text: τρὶς ἐραβδίσθην, ἅπαξ ἐλιθάσθην, τρὶς ἐναυάγησα, νυχθήμερον ἐν τῷ βυθῷ πεποίηκα·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/025.yaml
  text: Three times I was beaten with rods[a], once I was stoned, three times I was shipwrecked; I have spent a night and a day in the deep.
translation:
  language: sw
  text: Mara tatu nilipigwa kwa fimbo, mara moja nilipigwa kwa mawe, mara tatu nilivunjikiwa na meli; nimepitisha usiku mmoja na mchana mmoja katika kilindi cha bahari.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika bahari kuu” au “katika bahari ya wazi.”
    reason: βυθός kwa maana ya msingi hurejelea kilindi au maji ya kina; katika muktadha huu inaweza pia kueleweka kuwa bahari kuu au bahari ya wazi.
lexical_decisions:
- source_word: τρὶς
  choice: mara tatu
  rationale: Ni tafsiri ya kawaida ya kielezi kinachoonyesha tukio lililorudiwa mara tatu; imetumiwa sawasawa katika sehemu zote mbili.
- source_word: ἐραβδίσθην
  choice: nilipigwa kwa fimbo
  rationale: Kitenzi hiki humaanisha kupigwa kwa fimbo; kutaja chombo cha kupigia kunahifadhi umahususi wa Kigiriki.
- source_word: ἅπαξ
  choice: mara moja
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha tukio moja.
- source_word: ἐλιθάσθην
  choice: nilipigwa mawe
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida kwa tendo la kushambuliwa kwa mawe.
- source_word: ἐναυάγησα
  choice: nilivunjikiwa na meli
  rationale: Usemi huu unaeleza kwa ufupi kwamba Paulo alipatikana katika tukio la meli kuvunjika, bila kuongeza maelezo yasiyokuwamo katika chanzo.
- source_word: νυχθήμερον
  choice: usiku mmoja na mchana mmoja
  rationale: Inahifadhi mpangilio na maana ya kipindi cha usiku na mchana bila kukifanya kwa lazima kuwa saa ishirini na nne kamili.
- source_word: ἐν τῷ βυθῷ
  choice: katika bahari kuu
  rationale: βυθός hapa yaweza kumaanisha eneo la kina la bahari au bahari iliyo wazi. 'Bahari kuu' ni ya asili katika Kiswahili na haidokezi kwa lazima kuwa Paulo alikuwa chini ya maji.
- source_word: πεποίηκα
  choice: nimekaa
  rationale: Pamoja na usemi wa muda, ποιέω humaanisha kutumia au kupitisha muda; hali timilifu ya Kiswahili inadumisha mtazamo wa kukumbuka tukio lililokamilika.
