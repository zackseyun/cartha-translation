translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa orodha unaendeleza msisitizo wa marudio katika Kigiriki, huku maneno yakibaki rahisi kueleweka kwa msomaji wa kawaida.
