review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the major Greek clauses and retains the important ambiguity of κατὰ κύριον. However, its opening relative construction is less idiomatic than standard contemporary Swahili, and “ujasiri” more normally denotes courage than the confident stance denoted by ὑπόστασις in this context.
  naturalness: “Ninalosema, silisemi” is grammatically analyzable if an implicit feminine noun such as neno is supplied, but it is awkward and potentially distracting. “Ninayosema, sisemi” is the natural unmarked Swahili construction. “Kujiamini huku kwa kujisifu” communicates the contextual sense more naturally than “ujasiri huu wa kujisifu.”
  terminology: Bwana appropriately renders κύριον. “Kulingana na Bwana” maintains the source’s unresolved sense of norm, manner, or authority. “Upumbavu” appropriately renders ἀφροσύνη; the wording “kana kwamba kwa upumbavu” is idiomatic while retaining Paul’s rhetorical qualification rather than flatly calling himself a fool.
  issues:
  - severity: medium
    issue: Opening relative clause and resumptive object are awkward
    rationale: “Ninalosema, silisemi” relies on an unstated feminine antecedent to license both relative and object concords. The neuter/content-relative ὃ λαλῶ is more naturally rendered “Ninayosema, sisemi.”
  - severity: medium
    issue: “Ujasiri” is not the best contextual equivalent for ὑπόστασις
    rationale: In contemporary Standard East African Swahili, ujasiri primarily means courage or boldness. Here the Greek concerns a confident stance or basis associated with boasting; “kujiamini” better conveys confidence while the footnote preserves the lexical alternatives.
  revised_text: Ninayosema, sisemi kulingana na Bwana[a], bali kana kwamba kwa upumbavu[b], katika kujiamini huku kwa kujisifu[c].
