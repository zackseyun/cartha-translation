  text: ὃ λαλῶ οὐ ⸂κατὰ κύριον λαλῶ⸃, ἀλλ’ ὡς ἐν ἀφροσύνῃ, ἐν ταύτῃ τῇ ὑποστάσει τῆς καυχήσεως.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/017.yaml
  text: What I am saying[a], I am not saying according to the Lord, but as in foolishness[c][b], in this confidence of boasting.
translation:
  language: sw
  text: Ninayosema, sisemi kulingana na Bwana[a], bali kana kwamba kwa upumbavu[b], katika kujiamini huku kwa kujisifu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sisemi hili kama neno litokalo kwa Bwana,” au, “kwa kipimo cha Bwana.”
    reason: alternative_reading
  - marker: b
    text: Au, “bali kama katika upumbavu,” au, kwa lugha ya kawaida zaidi, “bali kama mpumbavu.”
    reason: lexical_alternative
  - marker: c
    text: Neno la Kigiriki lililotafsiriwa “kujiamini” hapa linaweza pia kumaanisha “jambo,” “msingi,” au “shughuli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ λαλῶ
  choice: Ninalosema
  rationale: Huwasilisha kwa Kiswahili cha kawaida jambo ambalo Paulo analisema sasa, huku ikidumisha maana ya wakati uliopo.
- source_word: κατὰ κύριον
  choice: kulingana na Bwana
  rationale: Huhifadhi wazo la kanuni, namna, au mamlaka inayohusishwa na Bwana bila kuamua kwa lazima ni maana ipi iliyokusudiwa.
- source_word: κύριον
  choice: Bwana
  rationale: Katika muktadha huu neno hili kwa kawaida humrejelea Bwana Yesu; hakuna haja ya kuongeza jina hilo katika matini.
- source_word: ἀλλ’ ὡς ἐν ἀφροσύνῃ
  choice: bali kama katika upumbavu
  rationale: Hufuata kwa karibu namna Paulo anavyokitambulisha kujisifu kwake kama usemi ulio katika hali ya upumbavu, bila kusema moja kwa moja kwamba yeye ni mpumbavu.
- source_word: ἐν ταύτῃ τῇ ὑποστάσει
  choice: katika ujasiri huu
  rationale: Katika muktadha wa kujisifu, 'ujasiri' huonyesha msimamo wa kujiamini, lakini tanbihi huhifadhi uwezekano wa maana kama jambo, msingi, au shughuli.
- source_word: τῆς καυχήσεως
  choice: wa kujisifu
  rationale: Huhifadhi maana ya kitendo ya καύχησις na kuunganisha ujasiri huo na kujisifu kwa Paulo.
theological_decisions:
- issue: Rejeleo na nguvu ya kauli κατὰ κύριον
  choice: Paulo anasema kuwa namna hii ya kujisifu haisemwi kulingana na Bwana.
  alternative: Paulo anaweza kumaanisha kuwa kauli hii haitoki moja kwa moja kwa Bwana, au haifuati kipimo cha Bwana.
  rationale: Tafsiri haikatai uvuvio wala ukweli wa maneno ya Paulo, bali inadumisha mvutano wa kauli ya Kigiriki kuhusu namna, chanzo, au kipimo cha usemi wake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo unabaki karibu na sentensi ya Kigiriki ili kuhifadhi tahadhari ya Paulo na utata wa maneno muhimu, huku tanbihi zikitoa njia nyingine halali za kuyaelewa.
