lexical_decisions:
- source_word: Ὄφελον
  choice: Laiti
  rationale: Chembe hii huonyesha tamanio au ombi lenye msisitizo; “Laiti” ni Kiswahili sanifu na huhifadhi nguvu yake bila kuwa nzito.
- source_word: ἀνείχεσθέ / ἀνέχεσθέ
  choice: mnivumilie / nivumilieni
  rationale: Kitenzi ἀνέχομαι hapa humaanisha kumstahimili mtu kwa subira. Kurudia “vumilia” kunahifadhi ombi lililorudiwa katika Kigiriki.
- source_word: μου
  choice: -ni- (mnivumilie / nivumilieni)
  rationale: Kiwakilishi cha nafsi ya kwanza kimewakilishwa kiasili katika muundo wa kitenzi cha Kiswahili.
- source_word: μικρόν τι
  choice: kidogo
  rationale: Muungano huu una maana ya kiasi kidogo; “kidogo” ni wa kawaida na huhifadhi udunishaji wa jambo katika usemi wa Paulo.
- source_word: ἀφροσύνης
  choice: upumbavu
  rationale: Neno hili humaanisha upumbavu au ukosefu wa busara. “Upumbavu” huhifadhi namna Paulo anavyojishusha kwa kejeli katika hoja yake.
- source_word: ἀλλὰ καὶ
  choice: Naam
  rationale: Katika muktadha huu maneno haya yanarejelea na kutilia nguvu ombi lililotangulia. “Naam” huleta uthibitisho huo kwa Kiswahili cha sasa bila kuongeza wazo jipya.
theological_decisions:
- issue: Paulo kuita anachofanya “upumbavu”
  choice: Usemi wa “upumbavu” umehifadhiwa kama kujishusha kwa kejeli
  alternative: upuuzi kidogo
  rationale: Aya inaanzisha sehemu ambamo Paulo atajisifu kwa njia ya kejeli. Tafsiri haiufifishi mvutano huo wala kuamua kwamba anamaanisha upuuzi halisi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Alama ya mshangao baada ya ombi la kwanza inaonyesha nguvu ya tamanio la Ὄφελον, huku sentensi fupi ya pili ikihifadhi msisitizo wa ombi linalorudiwa.
