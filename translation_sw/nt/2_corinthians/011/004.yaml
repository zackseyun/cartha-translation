  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἰ μὲν γὰρ ὁ ἐρχόμενος ἄλλον Ἰησοῦν κηρύσσει ὃν οὐκ ἐκηρύξαμεν, ἢ πνεῦμα ἕτερον λαμβάνετε ὃ οὐκ ἐλάβετε, ἢ εὐαγγέλιον ἕτερον ὃ οὐκ ἐδέξασθε, καλῶς ⸀ἀνέχεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/004.yaml
  text: For if someone comes and proclaims another Jesus[a], whom we did not proclaim, or if you receive a different spirit, which you did not receive, or a different gospel, which you did not accept[c][b], you put up with it well enough.
translation:
  language: sw
  text: Kwa maana mtu akija na kumhubiri Yesu mwingine ambaye sisi hatukumhubiri, au mkipokea roho tofauti ambayo hamkuipokea, au injili tofauti ambayo hamkuikubali, mnavumilia vizuri tu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maneno haya yanaelekea kuwa ya kejeli: Paulo anawakosoa kwa kuwa tayari mno kuvumilia mambo ya aina hiyo. Yambwa la “mnavumilia” halijatajwa wazi katika Kigiriki; linaweza kurejelea mhubiri, ujumbe wake, au yote mawili.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἐρχόμενος
  choice: mtu akija
  rationale: Kirai chenye kibainishi na kitenzi-jina cha wakati uliopo kinamtaja kwa ujumla mtu anayekuja; “mtu akija” ni Kiswahili cha kawaida na hudumisha hali yake isiyo bainifu.
- source_word: ἄλλον Ἰησοῦν
  choice: Yesu mwingine
  rationale: ἄλλος hapa humaanisha mwingine; usemi huu unaonyesha kwamba mhubiri mpinzani anatumia jina Yesu lakini anamwasilisha kwa namna iliyo tofauti.
- source_word: κηρύσσει / ἐκηρύξαμεν
  choice: kumhubiri / hatukumhubiri
  rationale: κηρύσσω ni kutangaza hadharani kama mhubiri. “Kumhubiri” ni usemi wa asili katika muktadha huu, huku kiambishi cha yambwa kikirejelea Yesu.
- source_word: πνεῦμα ἕτερον
  choice: roho tofauti
  rationale: ἕτερος hukazia utofauti; “roho tofauti” huhifadhi upeo mpana wa neno πνεῦμα bila kuamua ikiwa ni roho fulani, mvuto wa kiroho, au dai kuhusu Roho.
- source_word: λαμβάνετε / ἐλάβετε
  choice: mkipokea / mliyopokea
  rationale: λαμβάνω hapa ni kupokea kitu kinachotolewa au kuwasilishwa. Kurudia “pokea” hudumisha ulinganifu wa vitenzi vya Kigiriki.
- source_word: εὐαγγέλιον ἕτερον
  choice: injili tofauti
  rationale: “Injili” ndilo neno la kawaida la Kip paulo kwa εὐαγγέλιον, na “tofauti” hudokeza habari iliyo tofauti kwa aina au maudhui.
- source_word: ἐδέξασθε
  choice: mliyoikubali
  rationale: δέχομαι inaweza kumaanisha kukaribisha au kukubali. “Kukubali” hutofautisha kitenzi hiki na λαμβάνω, “kupokea,” katika kishazi kilichotangulia.
- source_word: καλῶς ἀνέχεσθε
  choice: mnamvumilia vizuri tu
  rationale: ἀνέχομαι ni kuvumilia au kustahimili. Kiwakilishi cha mtu katika “mnamvumilia” kinaelekea kwa mhubiri anayekuja, jambo linalowezekana kisarufi na kimuktadha; “vizuri tu” hudumisha kejeli ya καλῶς bila kuipanua kupita kiasi.
- source_word: εἰ μὲν γὰρ
  choice: Kwa maana ... akija
  rationale: “Kwa maana” huunganisha hoja na yaliyotangulia, na muundo wa masharti “akija” huwasilisha εἰ kwa Kiswahili cha kawaida bila kutafsiri kila chembe kwa namna ngumu.
theological_decisions:
- issue: Rejeo la “roho tofauti”
  choice: Limeachwa kwa ujumla kuwa “roho tofauti.”
  alternative: Roho Mtakatifu aliyewasilishwa vibaya; roho ya pepo; au mwelekeo au uzoefu tofauti wa kiroho.
  rationale: Kigiriki hakibainishi rejeo hilo, kwa hiyo tafsiri haipaswi kuondoa utata wa kitheolojia uliopo.
- issue: Toni ya καλῶς ἀνέχεσθε
  choice: 'Imetafsiriwa kama karipio la kejeli: “mnamvumilia vizuri tu.”'
  alternative: Pongezi ya moja kwa moja au maelezo yasiyoegemea upande wowote.
  rationale: Muktadha unaonyesha Paulo anawakosoa Wakorintho kwa kuwa tayari mno kuwavumilia walimu wapinzani, si kuwasifu.
- issue: Yambwa la ἀνέχεσθε lisilotajwa wazi
  choice: 'Limewasilishwa kama mhubiri: “mnamvumilia.”'
  alternative: “mnavumilia jambo hilo” au “mnaistahimili hali hiyo.”
  rationale: Kitenzi cha Kigiriki hakitaji yambwa wazi. Mhubiri wa mwanzo wa sentensi ni rejeo linalofaa kimuktadha, lakini tanbihi inadumisha uwezekano wa rejeo pana zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa masharti umewekwa kwa mtiririko wa kawaida wa Kiswahili; istilahi “roho” na “injili” zimeachwa bila ufafanuzi wa kimadhehebu. Alama pekee ya tanbihi [a] imewekwa baada ya kishazi inachofafanua.
