language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οἶδα γὰρ τὴν προθυμίαν ὑμῶν ἣν ὑπὲρ ὑμῶν καυχῶμαι Μακεδόσιν ὅτι Ἀχαΐα παρεσκεύασται ἀπὸ πέρυσι, καὶ ⸀τὸ ὑμῶν ζῆλος ἠρέθισε τοὺς πλείονας.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/002.yaml
  text: 'For I know your eagerness[a], which I boast about to the Macedonians on your behalf: that Achaia has been ready since last year[c][b], and your zeal has stirred up most of them.'
translation:
  language: sw
  text: 'Kwa maana najua utayari wenu[a], ambao ninawajivunia mbele ya Wamakedonia: kwamba Akaya[b] imekuwa tayari tangu mwaka jana, na bidii yenu imewachochea walio wengi[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “moyo wenu wa kujitolea.”
    reason: lexical_alternative
  - marker: b
    text: Yaani, jimbo la Akaya, lililojumuisha Korintho; hapa Paulo anatumia jina la eneo kuwarejelea waumini waliokuwa humo.
    reason: cultural_note
  - marker: c
    text: Au “wengi wao,” yaani, wengi wa Wamakedonia.
    reason: lexical_alternative
lexical_decisions:
- source_word: προθυμίαν
  choice: utayari
  rationale: Neno hili linaonyesha moyo ulio tayari na wenye nia ya kutenda. “Utayari” ni wa kawaida na wenye heshima, huku tanbihi ikidokeza maana ya hiari au shauku.
- source_word: καυχῶμαι
  choice: ninajisifu
  rationale: Huhifadhi nguvu ya usemi wa Paulo badala ya kuupunguza kuwa kujivunia kimoyomoyo tu; muktadha unaonyesha kuwa anawasifu mbele ya wengine.
- source_word: ὑπὲρ ὑμῶν
  choice: kuhusu ninyi
  rationale: Pamoja na καυχῶμαι, kirai hiki kinaonyesha kwamba Paulo anasema kwa fahari juu yao. “Kuhusu ninyi” ni Kiswahili cha asili na hakilazimishi maana finyu ya uwakilishi.
- source_word: Μακεδόσιν
  choice: kwa Wamakedonia
  rationale: Hurejelea watu wa Makedonia ambao Paulo amekuwa akiwaambia habari za waumini wa Akaya, bila kuongeza neno “waumini” lisilosemwa wazi hapa.
- source_word: Ἀχαΐα
  choice: Akaya
  rationale: Jina la eneo linahifadhiwa kama lilivyo katika Kigiriki; hapa eneo linasimama kwa watu wake, hasa waumini waliomo.
- source_word: παρεσκεύασται
  choice: imekuwa tayari
  rationale: Kauli timilifu inaonyesha hali ya sasa iliyotokana na maandalizi ya awali. Kirai hiki kinaungana kwa kawaida na “tangu mwaka jana.”
- source_word: ἀπὸ πέρυσι
  choice: tangu mwaka jana
  rationale: Hii ndiyo njia ya kawaida ya Kiswahili ya kuonyesha hali iliyoanza mwaka uliopita na kuendelea hadi wakati wa sasa.
- source_word: τὸ ὑμῶν ζῆλος
  choice: bidii yenu
  rationale: “Bidii” huwasilisha ari yenye nguvu na ya kuigwa katika muktadha huu, bila kuleta wazo hasi la wivu ambalo ζῆλος linaweza kuwa nalo katika miktadha mingine.
- source_word: ἠρέθισε
  choice: imewachochea
  rationale: Kitenzi kina maana ya kusisimua au kuamsha mtu atende. “Kuwachochea” huhifadhi nguvu hiyo, na muktadha unaifanya ieleweke kwa maana chanya.
- source_word: τοὺς πλείονας
  choice: walio wengi
  rationale: Kirai hiki humaanisha wengi au sehemu kubwa zaidi ya kundi lililotajwa. “Walio wengi” huhifadhi usemi huo bila kudai kwamba ni wote.
theological_decisions:
- issue: Kirejelewa cha “Akaya”
  choice: Jina “Akaya” limehifadhiwa, likisimama kimajazi kwa waumini wa eneo hilo.
  alternative: “Ninyi mmekuwa tayari” au “waumini wa Akaya wamekuwa tayari.”
  rationale: Kigiriki kinataja Ἀχαΐα waziwazi. Kuhifadhi jina la eneo kunatunza upana wa kieneo wa kauli ya Paulo na hakufuti matumizi ya mahali kuwakilisha watu wake.
- issue: Nguvu ya kujisifu kwa Paulo
  choice: “Ninajisifu” imetumiwa moja kwa moja.
  alternative: “Ninajivunia” au “ninawasifu.”
  rationale: καυχῶμαι ni neno lenye nguvu katika hoja za Paulo. Muktadha unaonyesha kujisifu kwake kuhusu utayari wao, hivyo hakuna sababu ya kulainisha usemi huo kwa sababu za kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umewekwa wazi kwa msomaji wa kawaida, huku jina la eneo, nguvu ya “ninajisifu,” na kutokamilika kwa idadi katika “walio wengi” vikihifadhiwa.
