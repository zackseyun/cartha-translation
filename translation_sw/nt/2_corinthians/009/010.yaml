base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/010.yaml
  text: The one who supplies seed to the sower and bread for food will supply and multiply your seed and increase the harvest of your righteousness[a][b].
translation:
  language: sw
  text: Yeye ampaye mpandaji mbegu na mkate wa kula atawapatia na kuzidisha mbegu zenu, na ataongeza mavuno ya haki yenu[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mazao” au “matunda ya haki yenu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “mavuno ya uadilifu wenu.” Neno la Kigiriki δικαιοσύνη linaweza kumaanisha “haki,” “uadilifu,” au, katika miktadha fulani, “haki ya kijamii.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπιχορηγῶν
  choice: anayempa
  rationale: Kitenzi hiki kimewasilishwa kama kishiriki chenye maana ya kutoa au kupatia. Muundo “Yeye anayempa” ni wa kawaida na unaonyesha wazi anayetoa, bila kuongeza wazo la wakati ambalo halipo katika Kigiriki.
- source_word: σπόρον
  choice: mbegu
  rationale: “Mbegu” ndiyo maana ya kawaida katika muktadha wa kupanda na inadumisha taswira ya kilimo.
- source_word: τῷ σπείροντι
  choice: mpandaji
  rationale: Kishiriki hiki kinamtaja mtu anayepanda. “Mpandaji” ni kifupi, wazi, na cha kawaida katika Kiswahili.
- source_word: ἄρτον εἰς βρῶσιν
  choice: mkate wa kula
  rationale: Usemi huu unaonyesha kusudi la mkate na kutofautisha chakula kinacholiwa na mbegu inayopandwa.
- source_word: χορηγήσει
  choice: atawapatia
  rationale: Wakati ujao umehifadhiwa. “Atawapatia” huendeleza wazo la kutoa mahitaji na huunganika kimaana na ἐπιχορηγῶν.
- source_word: πληθυνεῖ
  choice: kuzizidisha
  rationale: Kitenzi kina maana ya kufanya ziwe nyingi au tele. “Kuzizidisha” kinafaa kwa mbegu na kinadumisha taswira ya kilimo.
- source_word: τὸν σπόρον ὑμῶν
  choice: mbegu zenu
  rationale: Tafsiri ya karibu inadumisha mwingiliano wa maana kati ya riziki halisi na uwezo wa Wakorintho wa kutoa kwa ukarimu.
- source_word: αὐξήσει
  choice: ataongeza
  rationale: Kitenzi cha wakati ujao kinaonyesha kuongeza au kukuza; “ataongeza” ni cha asili pamoja na “mavuno.”
- source_word: τὰ γενήματα
  choice: mavuno
  rationale: Neno hili linaweza kumaanisha mazao, matunda, au kile kilichozalishwa. “Mavuno” yanadumisha taswira ya kupanda na kuzaa.
- source_word: δικαιοσύνης
  choice: uadilifu
  rationale: “Uadilifu” hapa hudumisha maana ya mwenendo ulio sawa bila kuifunga kauli kwa baraka za mali au hadhi ya kisheria pekee. Maana mbadala ya “haki” imehifadhiwa katika tanbihi.
theological_decisions:
- issue: Maana ya “mavuno ya uadilifu wenu”
  choice: Taswira ya matokeo yanayotokana na ukarimu wao ulio wa uadilifu, bila kuyawekea mipaka kuwa faida ya mali au hadhi ya kisheria pekee.
  alternative: Baraka za mali zitokanazo na ukarimu; matunda ya uaminifu au haki; ushahidi wa mwenendo wa uadilifu.
  rationale: Muktadha unahusu utoaji wa ukarimu na unatumia taswira ya kilimo. Tafsiri inadumisha upana na mvutano wa kitheolojia wa kauli hiyo badala ya kuamua maana moja tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imewekwa wazi kwa wasomaji wa kawaida huku taswira ya kilimo, wakati ujao wa vitenzi, na utata halisi wa δικαιοσύνη vikihifadhiwa.
