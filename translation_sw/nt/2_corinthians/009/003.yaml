  yaml_path: translation/nt/2_corinthians/009/003.yaml
  text: But I sent the brothers[a], so that our boasting about you might not be emptied in this matter, so that, just as I was saying, you may be prepared[b],
translation:
  language: sw
  text: Lakini niliwatuma ndugu, ili kujivunia kwetu juu yenu kusije kukathibitika kuwa bure katika suala hili, na ili, kama nilivyokuwa nikisema, muwe tayari.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔπεμψα
  choice: nimewatuma
  rationale: Kauli ya aoristi inaweza kueleza tendo lililokamilika ambalo matokeo yake yanahusika katika hali ya sasa; katika muktadha huu Kiswahili cha kawaida hutumia wakati timilifu ‘nimewatuma’ kwa wajumbe waliotumwa na ambao Paulo anawataja kwa wasomaji.
- source_word: τοὺς ἀδελφούς
  choice: hao ndugu
  rationale: Neno la Kigiriki ni wingi wa kiume na katika muktadha linaelekea kuwataja wajumbe maalumu wa kiume; ‘hao ndugu’ ni la kawaida na linaonyesha kuwa tayari wametajwa.
- source_word: τὸ καύχημα ἡμῶν τὸ ὑπὲρ ὑμῶν
  choice: kujisifu kwetu juu yenu
  rationale: ‘Kujisifu’ huhifadhi maana ya καύχημα ya kusema kwa fahari, huku ‘juu yenu’ ikitoa maana ya ὑπὲρ ὑμῶν katika muktadha.
- source_word: κενωθῇ
  choice: kusibainike kuwa bure
  rationale: Katika muktadha huu kitenzi cha ‘kufanywa tupu’ kinamaanisha kujisifu kuthibitika kutokuwa na msingi. Tafsiri hii ni ya kawaida kwa Kiswahili huku ikihifadhi uwezekano wa dai hilo kuonekana bure.
- source_word: ἐν τῷ μέρει τούτῳ
  choice: katika jambo hili
  rationale: μέρος hapa si sehemu ya kitu kimwili bali ni jambo au upande fulani unaozungumziwa, yaani maandalizi ya mchango.
- source_word: καθὼς ἔλεγον
  choice: kama nilivyokuwa nikisema
  rationale: Muundo wa wakati usiotimilifu unaashiria kusema kulikokuwa kukiendelea au kurudiwa; ‘nilivyokuwa nikisema’ huhifadhi dhana hiyo.
- source_word: παρεσκευασμένοι ἦτε
  choice: muwe tayari
  rationale: Muundo wa kiima cha ἵνα pamoja na hali iliyotayarishwa unaonyesha kusudi kwamba Wakorintho wawe katika hali ya utayari; ‘muwe tayari’ ni wazi na asilia.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inahifadhi vifungu viwili vya kusudi vya Kigiriki kwa kutumia ‘ili ... na ili ...’, lakini inaeleza κενωθῇ kwa namna ya kawaida kuliko taswira halisi ya ‘kufanywa tupu’.
