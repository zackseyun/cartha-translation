lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: kama ilivyoandikwa
  rationale: Ni namna ya kawaida na yenye heshima ya Kiswahili ya kuanzisha nukuu ya Maandiko.
- source_word: Ἐσκόρπισεν
  choice: Alitawanya
  rationale: Inahifadhi taswira ya kutawanya kwa upana katika utoaji, badala ya kuibadili moja kwa moja kuwa kitenzi kisicho na taswira cha kugawa.
- source_word: ἔδωκεν
  choice: akawapa
  rationale: Wakati uliopita na kiunganishi cha matukio vinasomeka kwa kawaida katika ushairi wa Kiswahili; kiambishi -wa- kinarejelea maskini waliopewa.
- source_word: τοῖς πένησιν
  choice: maskini
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida kwa watu wenye uwezo mdogo wa kiuchumi.
- source_word: ἡ δικαιοσύνη αὐτοῦ
  choice: haki yake
  rationale: Katika Kiswahili, “haki” hubeba kwa asili maana zinazokaribiana za uadilifu na kutenda yaliyo sawa, hivyo inadumisha upana wa δικαιοσύνη katika muktadha huu.
- source_word: μένει
  choice: inadumu
  rationale: Inaeleza kuendelea kuwapo kwa muda bila mwisho na inafaa mtindo wa kishairi wa nukuu.
- source_word: εἰς τὸν αἰῶνα
  choice: milele
  rationale: Ni usemi wa kawaida wa Kiswahili unaowasilisha maana ya kudumu bila mwisho.
theological_decisions:
- issue: Maana ya δικαιοσύνη katika nukuu hii
  choice: haki
  alternative: uadilifu
  rationale: “Haki” huhifadhi wigo wa neno la Kigiriki, unaoweza kuelekeza katika tabia ya kuwa sawa au tendo la haki. Tanbihi inaonyesha uwezekano wa “uadilifu” bila kuamua kimya-kimya kati ya vipengele hivyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya nukuu ya Maandiko. Mpangilio wa mistari unahifadhi mwendo wa kishairi. Alama ya tanbihi imewekwa baada ya nukuu nzima kwa kuwa inahusu kishazi cha mwisho.
