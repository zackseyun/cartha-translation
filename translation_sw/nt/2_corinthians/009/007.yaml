source:
  edition: SBLGNT
  text: ἕκαστος καθὼς ⸀προῄρηται τῇ καρδίᾳ, μὴ ἐκ λύπης ἢ ἐξ ἀνάγκης· ἱλαρὸν γὰρ δότην ἀγαπᾷ ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/007.yaml
  text: Each one should give as he has decided in his heart[a], not out of grief or compulsion[b], for God loves a cheerful giver.
translation:
  language: sw
  text: Kila mmoja na atoe kama alivyoazimia moyoni mwake, si kwa huzuni[a] wala kwa kulazimishwa, kwa maana Mungu humpenda mtoaji mwenye furaha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “si kwa kusita”; Kigiriki kinasema kwa maana halisi “si kwa huzuni” au “si kwa masikitiko.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος
  choice: Kila mmoja
  rationale: Huhifadhi umoja wa kugawa unaomwelekezea kila mtu binafsi, bila kuifanya kauli iwahusu wanaume pekee.
- source_word: καθὼς
  choice: kama
  rationale: Huonyesha kwamba utoaji ulingane na azimio la ndani la kila mtu; ni usemi wa kawaida na wazi katika Kiswahili.
- source_word: προῄρηται
  choice: alivyoazimia
  rationale: Kitenzi hiki huonyesha uamuzi au kusudi lililowekwa kwa makusudi kabla ya kutoa. “Ameazimia” huhifadhi uzito wa uamuzi huo kuliko usemi wa jumla wa “ameamua” pekee.
- source_word: τῇ καρδίᾳ
  choice: moyoni mwake
  rationale: Huhifadhi taswira ya kibiblia ya moyo kama kitovu cha nia na uamuzi wa ndani. Kiwakilishi cha umoja huendana na “kila mmoja” bila kuashiria jinsia.
- source_word: μὴ ἐκ λύπης
  choice: si kwa huzuni
  rationale: Hufuata maana ya msingi ya λύπη, yaani huzuni au masikitiko, huku dokezo likieleza maana ya kimuktadha ya kutoa kwa kusita.
- source_word: ἢ ἐξ ἀνάγκης
  choice: wala kwa kulazimishwa
  rationale: Katika muktadha wa utoaji, ἀνάγκη hudokeza shinikizo au ulazima unaombana mtu. “Kwa kulazimishwa” ni ya kawaida na wazi kwa wasomaji wa sasa.
- source_word: ἱλαρὸν
  choice: mwenye furaha
  rationale: Huonyesha hali ya moyo ya uchangamfu na utayari wakati wa kutoa, bila kupunguza neno kuwa utayari pekee.
- source_word: δότην
  choice: mtoaji
  rationale: Ni nomino fupi, ya kawaida, na inayolingana moja kwa moja na mtu anayetoa.
- source_word: ἀγαπᾷ
  choice: humpenda
  rationale: Huhifadhi maana ya kawaida ya ἀγαπάω, “kupenda,” badala ya kuibadili kimafafanuzi kuwa “hupendezwa na.”
- source_word: ὁ θεός
  choice: Mungu
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja ya kiima cha sentensi.
theological_decisions:
- issue: Kitenzi cha kutoa kinachodokezwa na muktadha
  choice: Kila mmoja na atoe
  alternative: Kila mmoja kama alivyoazimia
  rationale: Kigiriki hakirudii wazi kitenzi “kutoa” katika kifungu hiki, lakini kinadokezwa na muktadha wa karibu. Kiswahili huhitaji kukiweka ili sentensi iwe kamili na ya kawaida; hali ya kuhimiza imehifadhiwa kwa “na atoe.”
- issue: Maana ya λύπη katika utoaji
  choice: si kwa huzuni
  alternative: si kwa kusita
  rationale: Maandishi makuu yanahifadhi maana ya msingi ya “huzuni,” huku tanbihi ikitaja maana ya kimuktadha ya kutokuwa tayari au kusita. Hivyo mvutano wa kileksika hauondolewi kimya kimya.
- issue: Umoja unaowakilisha watu wote
  choice: Kila mmoja ... moyoni mwake
  alternative: Kila mtu ... moyoni
  rationale: Kiswahili kinaweza kuhifadhi umoja wa Kigiriki kwa namna ya kawaida bila kutumia kiwakilishi chenye jinsia. Kauli inamhusu kila mtu binafsi, si wanaume pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa urahisi. “Alivyoazimia moyoni mwake” huhifadhi lugha ya ndani ya kibiblia, na “kwa kulazimishwa” huepuka mtindo mzito usio wa kawaida. Tanbihi imewekwa baada ya “huzuni,” ambako mbadala wake wa kileksika unahusika moja kwa moja.
