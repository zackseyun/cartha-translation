  yaml_path: translation/nt/2_corinthians/009/015.yaml
  text: Thanks be to God for his indescribable gift[a].
translation:
  language: sw
  text: Shukrani kwa Mungu kwa ajili ya zawadi yake isiyoweza kuelezeka kikamilifu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “zawadi yake isiyoweza kusemwa kwa maneno.” Kivumishi cha Kigiriki kinaweza kumaanisha kitu kisichoweza kuelezwa au kusimuliwa kikamilifu.
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: Shukrani
  rationale: Katika kauli hii ya mshangao yenye τῷ θεῷ, neno hili linaonyesha kumshukuru au kumsifu Mungu, si maana ya kawaida ya “neema.”
- source_word: τῷ θεῷ
  choice: kwa Mungu
  rationale: Hutaja anayepokea shukrani; “Shukrani kwa Mungu” ni kauli ya kawaida, yenye heshima, na iliyo wazi katika Kiswahili.
- source_word: ἐπὶ
  choice: kwa ajili ya
  rationale: Pamoja na hali ya dative hapa, kihusishi kinaonyesha msingi au sababu ya shukrani, yaani zawadi ya Mungu.
- source_word: ἀνεκδιηγήτῳ
  choice: isiyoweza kuelezeka kikamilifu
  rationale: Huhifadhi wazo la kitu kisichoweza kusimuliwa au kufafanuliwa kwa ukamilifu, bila kudokeza kwamba hakiwezi kusemwa kwa namna yoyote.
- source_word: αὐτοῦ
  choice: yake
  rationale: Kiwakilishi kinamrejelea Mungu na kuhifadhi umbo la kiwakilishi la Kigiriki bila kurudia jina lake.
- source_word: δωρεᾷ
  choice: zawadi
  rationale: Neno hili humaanisha kitu kinachotolewa bure; “zawadi” ni la kawaida na halihitaji kuongeza “ya bure,” jambo ambalo lingekuwa la ziada.
theological_decisions:
- issue: Kinachorejelewa na “zawadi yake isiyoweza kuelezeka kikamilifu”
  choice: Kimeachwa kuwa zawadi ya Mungu bila kubainishwa zaidi.
  alternative: Kristo mwenyewe; wokovu au neema katika Kristo; au utoaji wa Mungu unaojumuisha ukarimu wa Wakorintho.
  rationale: Mstari wenyewe hautaji zawadi hiyo ni nini hasa. Muktadha unahusisha neema ya Mungu na ukarimu, huku mapokeo mengi yakiona Kristo akiwa kiini chake. Kutobainisha kunahifadhi upana na mvutano wa kifasiri wa matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Kauli fupi ya shukrani imehifadhiwa, huku “kikamilifu” ikisaidia kuonyesha kwamba maana ni kuwa zawadi hiyo inapita uwezo wa maelezo kamili, si kwamba haiwezi kutajwa kabisa.
