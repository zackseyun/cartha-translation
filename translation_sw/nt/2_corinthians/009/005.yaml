id: 2CO.9.5
reference: 2 Corinthians 9:5
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀναγκαῖον οὖν ἡγησάμην παρακαλέσαι τοὺς ἀδελφοὺς ἵνα προέλθωσιν ⸀εἰς ὑμᾶς καὶ προκαταρτίσωσι τὴν ⸀προεπηγγελμένην εὐλογίαν ὑμῶν, ταύτην ἑτοίμην εἶναι οὕτως ὡς εὐλογίαν καὶ μὴ ὡς πλεονεξίαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/005.yaml
  text: Therefore I considered it necessary to urge the brothers[a] to go to you ahead of us and arrange in advance the generous gift[b] you had promised, so that it would be ready as a generous gift and not as something extorted[c].
translation:
  language: sw
  text: Kwa hiyo, niliona ni lazima niwasihi ndugu[a] watangulie kwenda kwenu na kuitayarisha mapema zawadi ya ukarimu[b] mliyoahidi hapo awali, ili iwe tayari kama zawadi ya ukarimu, wala si kama mchango uliokamuliwa kwa tamaa.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki liko katika umbo la kiume; linaweza kumaanisha “ndugu wa kiume,” au “ndugu wanaume na wanawake” ikiwa kundi la wajumbe lilikuwa mchanganyiko.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “baraka.” Hapa neno hilo linamaanisha mchango wa Wakorintho ulioahidiwa, unaotolewa kama zawadi ya ukarimu.
    reason: lexical_alternative
  - marker: c
    text: Neno la Kigiriki kwa kawaida humaanisha “tamaa ya kupata zaidi” au “uchoyo.” Hapa linaonyesha mchango unaokamuliwa kutoka kwa watoaji kwa tamaa, badala ya kutolewa kama zawadi ya ukarimu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναγκαῖον οὖν ἡγησάμην
  choice: Kwa hiyo, niliona ni lazima
  rationale: Huonyesha hitimisho la Paulo na uamuzi wake kuhusu ulazima wa hatua hiyo bila kudokeza amri ya lazima kupita kiasi.
- source_word: παρακαλέσαι
  choice: niwasihi
  rationale: Katika muktadha huu kitenzi kina maana ya kuomba kwa msisitizo au kuhimiza; “kuwasihi” ni cha kawaida, chenye heshima, na kina uzito unaofaa.
- source_word: τοὺς ἀδελφοὺς
  choice: ndugu
  rationale: Neno la Kiswahili “ndugu” linaweza kutaja waamini au washiriki wenzake wa huduma na halilazimishi maana ya ndugu wa damu; tanbihi inaeleza uwezekano wa kundi kujumuisha wanaume na wanawake.
- source_word: προέλθωσιν εἰς ὑμᾶς
  choice: watangulie kuja kwenu
  rationale: Huonyesha kwamba wajumbe hao wangekwenda kabla ya Paulo na wenzake; Kiswahili hiki ni cha asili na huhifadhi wazo la kutangulia.
- source_word: προκαταρτίσωσι
  choice: kuitayarisha mapema
  rationale: Huonyesha kupanga na kukamilisha mchango kabla ya Paulo kufika, huku “mapema” ikibeba kiambishi cha Kigiriki kinachoonyesha kutangulia.
- source_word: προεπηγγελμένην
  choice: mliyoahidi kabla
  rationale: Huhifadhi wazo kwamba zawadi hiyo ilikuwa imeahidiwa hapo awali kwa mtiririko wa kawaida wa Kiswahili.
- source_word: εὐλογίαν
  choice: zawadi ya ukarimu
  rationale: Katika muktadha wa ukusanyaji wa mchango, neno hili linataja mchango unaotolewa kwa moyo wa ukarimu. Tafsiri hiyo inaeleweka moja kwa moja, huku maana halisi ya “baraka” ikihifadhiwa katika tanbihi.
- source_word: οὕτως ὡς εὐλογίαν
  choice: kama zawadi ya ukarimu
  rationale: Kurudia usemi uleule huhifadhi urudiaji wa makusudi wa εὐλογία na tofauti yake na utoaji wa shuruti.
- source_word: πλεονεξίαν
  choice: kitu kilichotolewa kwa shuruti
  rationale: Kwa kawaida neno hili humaanisha tamaa au uchoyo wa kutaka zaidi; hapa linaitambulisha sadaka kama kitu kinachoweza kuonekana kuwa kimepatikana kwa kuwalazimisha watoaji. Tanbihi huhifadhi upana wa maana ya neno la Kigiriki.
theological_decisions:
- issue: Urejeleo wa kijinsia wa ἀδελφοὺς
  choice: ndugu
  alternative: ndugu wa kiume; ndugu wanaume na wanawake
  rationale: Kiswahili “ndugu” ni cha asili na kinaweza kutumiwa kwa washiriki wenzake wa imani au huduma. Kwa kuwa umbo la Kigiriki ni la kiume lakini utambulisho kamili wa wajumbe haujaelezwa hapa, tanbihi huhifadhi uwezekano huo bila kuamua zaidi ya ushahidi.
- issue: Maana ya εὐλογία katika muktadha wa mchango
  choice: zawadi ya ukarimu
  alternative: baraka
  rationale: Muktadha unaonyesha kwamba εὐλογία ni mchango ulioahidiwa, huku neno hilo likiueleza kama tendo la ukarimu au baraka. Maana ya kifedha imewekwa wazi katika matini, na taswira ya “baraka” imehifadhiwa katika tanbihi.
- issue: Nguvu ya πλεονεξία katika tofauti na εὐλογία
  choice: kitu kilichotolewa kwa shuruti
  alternative: tamaa; uchoyo; kitu kilichodaiwa kwa tamaa
  rationale: Paulo anatofautisha utoaji wa hiari na ukarimu na mchango unaoonekana kukamuliwa kutoka kwa watoaji. Tafsiri kuu inaeleza athari hiyo katika muktadha, bila kufuta maana ya msingi ya tamaa au uchoyo, ambayo imeelezwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imehifadhi muundo wa hoja ya Paulo na urudiaji wa “zawadi ya ukarimu,” huku ikiepuka misamiati mizito isiyo ya kawaida. “Kwa shuruti” ni usemi unaoeleweka katika eneo lote na unaonyesha utoaji usio wa hiari bila kutumia lugha ya mazungumzo mno.
