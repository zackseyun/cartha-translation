  text: μή πως ἐὰν ἔλθωσιν σὺν ἐμοὶ Μακεδόνες καὶ εὕρωσιν ὑμᾶς ἀπαρασκευάστους καταισχυνθῶμεν ἡμεῖς, ἵνα μὴ ⸀λέγωμεν ὑμεῖς, ἐν τῇ ὑποστάσει ⸀ταύτῃ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/004.yaml
  text: lest if any Macedonians come with me and find you unprepared[b][a], we—not to say you—would be put to shame in this matter of confidence.
translation:
  language: sw
  text: Isije ikawa Wamakedonia wakija pamoja nami na kuwakuta hamjajiandaa, nasi—bila kuwataja ninyi[b]—tukaaibishwa katika uhakika huu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika jambo/shughuli hii” au “katika hali hii.” Neno la Kigiriki linaweza kuwa na maana hizo katika muktadha huu, lakini hapa linaelekea kurejelea uhakika wa Paulo kuwahusu Wakorintho.
    reason: lexical_alternative
  - marker: b
    text: Au, “bila hata kuwataja ninyi.” Kwa maneno haya ya pembeni, Paulo anadokeza kwamba Wakorintho pia wangeaibika ikiwa wangekutwa hawajajiandaa.
    reason: alternative_reading
lexical_decisions:
- source_word: μή πως ἐὰν
  choice: Isije ikawa ... wakaja
  rationale: Muundo huu wa Kiswahili unaonyesha hofu kuhusu jambo linaloweza kutokea baadaye na kuhifadhi maana ya tahadhari ya μή πως pamoja na hali ya uwezekano ya ἐάν.
- source_word: ἔλθωσιν σὺν ἐμοὶ Μακεδόνες
  choice: Wamakedonia fulani wakaja pamoja nami
  rationale: Nomino isiyo na kibainishi ina maana isiyobainishwa; “fulani” haidokezi kwamba ni kundi maalumu lililotajwa tayari.
- source_word: εὕρωσιν ὑμᾶς ἀπαρασκευάστους
  choice: kuwakuta hamjajiandaa
  rationale: Hii ni lugha ya kawaida na wazi kwa hali ya kutokuwa tayari, hasa kuhusu mchango uliopaswa kuwa umeandaliwa.
- source_word: καταισχυνθῶμεν
  choice: tukaaibishwa
  rationale: Kauli tendwa ya Kiswahili inadumisha wazo la kuaibishwa mbele ya wengine, si hisia ya ndani pekee.
- source_word: ἡμεῖς
  choice: nasi
  rationale: Kiwakilishi kilichotamkwa wazi katika Kigiriki kina msisitizo; “nasi” pamoja na vifungu vya mikato kinauhifadhi.
- source_word: ἵνα μὴ λέγωμεν ὑμεῖς
  choice: bila kuwataja ninyi
  rationale: Kauli hii ya pembeni inapunguza ukali wa maneno ya Paulo huku ikidokeza kwamba Wakorintho pia wangeaibika.
- source_word: ἐν τῇ ὑποστάσει ταύτῃ
  choice: katika jambo hili tulilokuwa na uhakika nalo
  rationale: Tafsiri hii inaelekeza kwenye uhakika wa Paulo kuhusu utayari wa Wakorintho, bila kuingiza maana ya kifalsafa ya “asili” au “substansi,” na huku ikiacha uwezekano wa maana pana ya jambo au shughuli inayohusika.
theological_decisions:
- issue: Maana ya ὑπόστασις katika muktadha huu usio wa kiufundi
  choice: uhakika wa Paulo kuhusu jambo hili
  alternative: shughuli hii; hali hii
  rationale: Muktadha unahusu uhakika wa Paulo kwamba Wakorintho wangekuwa tayari mbele ya wageni kutoka Makedonia. Hivyo “uhakika” inafaa zaidi, lakini tanbihi inadumisha uwezekano mwingine wa kileksika bila kuingiza maana za baadaye za kifalsafa au kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo “Isije ikawa” unatoa tahadhari kwa kawaida, na vifungu vya mikato vinahifadhi kauli ya pembeni na msisitizo wa Kigiriki.
