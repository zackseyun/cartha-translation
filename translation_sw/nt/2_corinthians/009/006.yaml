  text: Τοῦτο δέ, ὁ σπείρων φειδομένως φειδομένως καὶ θερίσει, καὶ ὁ σπείρων ἐπ’ εὐλογίαις ἐπ’ εὐλογίαις καὶ θερίσει.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/006.yaml
  text: 'This: the one who sows sparingly will also reap sparingly[a], and the one who sows with blessings will also reap with blessings.'
translation:
  language: sw
  text: 'Hili ndilo: anayepanda kwa uchache atavuna pia kwa uchache, naye anayepanda kwa baraka[a] atavuna pia kwa baraka.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa wingi” au “kwa ukarimu.” Kigiriki kimetumia nomino “baraka,” ambayo katika muktadha huu inaweza kueleza kipimo cha ukarimu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτο δέ
  choice: 'Jambo hili ndilo:'
  rationale: Hutanguliza kanuni yenye mkazo. Usemi huu ni wa kawaida na wenye heshima katika Kiswahili, huku ukibeba nguvu ya kuhamisha hoja ya δέ bila kuongeza neno la wakati lisilokuwamo katika Kigiriki.
- source_word: ὁ σπείρων
  choice: anayepanda
  rationale: Kirai tegemezi cha jumla kinawakilisha mtu yeyote anayefanya tendo hilo na kuhifadhi mtindo wa kimethali bila kulazimika kuongeza ‘yeyote’.
- source_word: φειδομένως
  choice: kwa uchache
  rationale: Katika muktadha wa utoaji, neno hili linaonyesha kipimo kidogo au kilichozuiliwa. ‘Kwa uchache’ ni wazi na haliongezi hukumu kali ya tabia kama ‘kwa ubahili’.
- source_word: καὶ θερίσει
  choice: atavuna pia
  rationale: ‘Pia’ huhifadhi ulinganifu wa καί kati ya namna ya kupanda na matokeo ya kuvuna.
- source_word: ἐπ’ εὐλογίαις
  choice: kwa baraka
  rationale: Huhifadhi nomino ya Kigiriki εὐλογία na mwangwi wake wa kitheolojia, huku kirai hicho katika muktadha huu pia kikiweza kueleweka kuwa utoaji wa ukarimu au wa wingi.
- source_word: ἐπ’ εὐλογίαις ... καὶ θερίσει
  choice: anayepanda kwa baraka ... atavuna pia kwa baraka
  rationale: Kurudia ‘kwa baraka’ huhifadhi usambamba na mchezo wa maneno wa Paulo katika kupanda na kuvuna, badala ya kugeuza sehemu moja kuwa matokeo tofauti.
theological_decisions:
- issue: Maana ya εὐλογίαις katika methali ya kupanda na kuvuna
  choice: Kutumia maana ya msingi ‘baraka’ katika sehemu zote mbili
  alternative: kwa wingi; kwa ukarimu
  rationale: Muktadha wa utoaji unaruhusu maana ya kiidioma ‘kwa wingi’ au ‘kwa ukarimu,’ lakini nomino ya Kigiriki pia hubeba dhana halisi ya baraka. Kuihifadhi huendeleza uhusiano wa Paulo kati ya ukarimu na baraka bila kuifanya aya kuwa ahadi ya lazima ya utajiri wa mali.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa msomaji wa kawaida. Usambamba wa kimethali na marudio ya maandishi asilia yamehifadhiwa.
