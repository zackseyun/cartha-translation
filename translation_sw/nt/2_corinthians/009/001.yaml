  text: Περὶ μὲν γὰρ τῆς διακονίας τῆς εἰς τοὺς ἁγίους περισσόν μοί ἐστιν τὸ γράφειν ὑμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/001.yaml
  text: For concerning the ministry to the saints[a], it is superfluous for me to write to you,
translation:
  language: sw
  text: Kwa habari ya huduma kwa ajili ya watakatifu[a], ni jambo lisilo la lazima kwangu kuwaandikia,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa watakatifu.” Kihusishi cha Kigiriki hapa kinaweza kuonyesha mwelekeo au wale wanaonufaika na huduma hiyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ μὲν γὰρ
  choice: Kwa habari ya
  rationale: Περί hutambulisha mada inayozungumziwa, huku μὲν γὰρ ikiunganisha sentensi na muktadha uliotangulia. “Kwa habari ya” ni mpito wa kawaida na wenye heshima katika Kiswahili.
- source_word: διακονίας
  choice: huduma
  rationale: διακονία hapa ni huduma ya vitendo, yaani msaada unaokusanywa kwa waamini wenye uhitaji. “Huduma” huhifadhi hadhi ambayo Paulo anaipa kazi hii bila kuifinya kuwa fedha pekee.
- source_word: τῆς εἰς τοὺς ἁγίους
  choice: kwa ajili ya watakatifu
  rationale: εἰς katika muktadha huu inaweza kuonyesha mwelekeo au walengwa wa huduma. “Kwa ajili ya” ni Kiswahili cha kawaida kinachoonyesha kwamba watakatifu ndio wanufaika, huku tanbihi ikihifadhi uwezekano wa tafsiri ya mwelekeo.
- source_word: ἁγίους
  choice: watakatifu
  rationale: Hili ni jina la kawaida la Paulo kwa waamini waliowekwa wakfu kwa Mungu. “Watakatifu” ni tafsiri fupi, ya jadi, na sahihi ya ἅγιοι.
- source_word: περισσόν
  choice: jambo lisilo la lazima
  rationale: περισσόν hapa humaanisha jambo la ziada au lisilohitajika. Usemi huu ni wa asili na unaoeleweka zaidi katika Kiswahili cha sasa kuliko neno la kifasihi lisilo la kawaida.
- source_word: μοί ἐστιν τὸ γράφειν ὑμῖν
  choice: ni jambo lisilo la lazima kwangu kuwaandikia
  rationale: Muundo huu huhifadhi mhusika wa nafsi ya kwanza na kitendo cha kuwaandikia, kwa Kiswahili cha kawaida, huku ukidumisha msisitizo wa balagha wa Kigiriki.
theological_decisions:
- issue: Maana ya εἰς katika uhusiano wa huduma na watakatifu
  choice: kwa ajili ya watakatifu
  alternative: kwa watakatifu
  rationale: Kihusishi kinaweza kuonyesha wanufaika au mwelekeo. Matini kuu inatumia usemi wa kawaida unaofaa muktadha wa msaada, na tanbihi inahifadhi uwezekano mwingine bila kuamua kupita ushahidi.
translation_notes:
  register: 'Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Tafsiri imetumia ulinganifu mwafaka: inafuata muundo na istilahi za Kigiriki kwa karibu, lakini inaepuka usemi mgumu usio wa kawaida. Alama ya koma ya mwisho imehifadhiwa kwa sababu aya inaendelea katika sentensi inayofuata.'
