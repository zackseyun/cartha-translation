  text: being enriched in every way for all generosity[a], which through us produces thanksgiving to God—
translation:
  language: sw
  text: mkitajirishwa kwa kila namna ili muwe wakarimu kwa kila namna,[a] jambo ambalo, kupitia kwetu, huleta shukrani kwa Mungu—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa ajili ya ukarimu wote.” Katika miktadha mingine, neno la Kigiriki linaweza kumaanisha “unyofu” au “usahili,” lakini hapa muktadha wa utoaji unaunga mkono maana ya “ukarimu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν παντὶ
  choice: kwa kila namna
  rationale: Kirai hiki ni cha maana pana; “kwa kila namna” huonyesha utoshelevu wa pande zote kwa Kiswahili cha kawaida.
- source_word: πλουτιζόμενοι
  choice: mkitajirishwa
  rationale: Huhifadhi hali ya sasa ya kutendewa na kumwacha Mungu akiwa mtendaji anayeeleweka kutokana na muktadha, bila kudokeza mafundisho ya utajiri wa mali.
- source_word: εἰς πᾶσαν ἁπλότητα
  choice: ili mpate kuwa wakarimu kwa kila hali
  rationale: Katika muktadha wa mchango, ἁπλότης humaanisha ukarimu au moyo wa kutoa kwa hiari. Muundo wa “ili” unaonyesha kusudi au matokeo ya kutajirishwa huko.
- source_word: ἥτις
  choice: jambo ambalo
  rationale: Hurejelea ukarimu uliotangulia na kuanzisha matokeo yake kwa njia iliyo wazi na ya kawaida katika Kiswahili.
- source_word: κατεργάζεται
  choice: huleta
  rationale: Kitenzi kinaonyesha kusababisha matokeo; “huleta” ni cha asili na huhifadhi maana hiyo.
- source_word: δι’ ἡμῶν
  choice: kupitia kwetu
  rationale: Huhifadhi wazi dhana ya Paulo na wenzake kuwa njia au mawakala wa kuufikisha mchango.
- source_word: εὐχαριστίαν τῷ θεῷ
  choice: shukrani kwa Mungu
  rationale: Huwakilisha nomino ya Kigiriki na kueleza wazi kwamba Mungu ndiye anayeelekezewa shukrani.
theological_decisions:
- issue: Maana ya ἁπλότης katika muktadha wa mchango
  choice: ukarimu katika kutoa
  alternative: unyofu, usahili, au moyo usiogawanyika
  rationale: Ingawa neno linaweza kuwa na maana hizo katika miktadha mingine, hapa habari ya utoaji na shukrani inayotokana nao inaunga mkono maana ya ukarimu wa vitendo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo unaendeleza sentensi kutoka mstari uliotangulia na unahifadhi kistari cha mwisho kinachoonyesha sentensi inaendelea.
