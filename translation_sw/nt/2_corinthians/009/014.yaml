  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ αὐτῶν δεήσει ὑπὲρ ὑμῶν ἐπιποθούντων ὑμᾶς διὰ τὴν ὑπερβάλλουσαν χάριν τοῦ θεοῦ ἐφ’ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/014.yaml
  text: and in their prayer for you[a], they long for you because of the surpassing grace of God upon you.
translation:
  language: sw
  text: na katika maombi yao kwa ajili yenu[a], wakiwatamani sana kwa sababu ya neema ya Mungu ipitayo kiasi iliyo juu yenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na kwa dua yao kwa ajili yenu, huku wakiwatamani sana.”
    reason: Mbadala huu unaonyesha kwamba δεήσει linaweza kutafsiriwa “dua” na kwamba muundo wa Kigiriki unaweza kusisitiza maombi kama mazingira au njia ya kuonyesha hamu yao.
lexical_decisions:
- source_word: δέησις
  choice: maombi
  rationale: Neno hili humaanisha ombi la dhati au dua. “Maombi” ni Kiswahili cha kawaida na cha heshima kinachofaa kwa maombezi, bila kuwa neno la kitaalamu kupita kiasi.
- source_word: αὐτῶν
  choice: yao
  rationale: Kiwakilishi hiki kinawarejelea waliopokea msaada na kinaonyesha kuwa maombi ni yao.
- source_word: ὑπὲρ ὑμῶν
  choice: kwa ajili yenu
  rationale: Katika muktadha wa maombi, ὑπέρ pamoja na hali ya umilikishi humaanisha kuwaombea wengine au kutenda kwa niaba yao.
- source_word: ἐπιποθούντων
  choice: wanawaonea shauku
  rationale: Kitenzi hiki huonyesha hamu kubwa na ya kudumu yenye upendo. Muundo wa kitenzi kamili unafanya sentensi iwe wazi katika Kiswahili huku ukihifadhi tendo linaloendelea.
- source_word: διὰ
  choice: kwa sababu ya
  rationale: διά pamoja na hali ya kushutumiwa hapa inaonyesha sababu ya wao kuwaonea Wakorintho shauku.
- source_word: ὑπερβάλλουσαν
  choice: iliyo kuu sana
  rationale: Usemi huu unaonyesha kiwango kisicho cha kawaida. “Iliyo kuu sana” ni wa kawaida na wenye heshima, bila kuifanya neema ionekane kuwa kitu cha kiasi kisichodhibitiwa.
- source_word: χάριν
  choice: neema
  rationale: '“Neema” huhifadhi uzito wa kawaida wa χάρις katika maandishi ya Paulo: wema wa Mungu unaotolewa bila kustahili na unaotenda kazi ndani ya watu.'
- source_word: ἐφ’ ὑμῖν
  choice: juu yenu
  rationale: Tafsiri hii huhifadhi taswira ya neema ya Mungu kuwa juu yao, huku ikiruhusu maana pana ya neema inayotenda kazi miongoni mwao.
- source_word: καὶ
  choice: na
  rationale: Ni kiunganishi rahisi kinachounganisha mstari huu na wazo lililotangulia.
theological_decisions:
- issue: Uhusiano wa maombi na kuwaonea shauku katika sarufi
  choice: Wapokeaji wa msaada wanawaombea Wakorintho na pia wanawaonea shauku kwa sababu ya neema ya Mungu iliyo juu yao.
  alternative: 'Kishazi kinaweza kueleweka kuwa maombi ndiyo njia ambayo shauku yao inaonyeshwa: “na kwa dua yao kwa ajili yenu, huku wakiwa na shauku kwa ajili yenu.”'
  rationale: Kigiriki kimebanwa kisarufi, kwa kuwa kitenzi-shirikishi cha hali ya umilikishi kinahusiana na αὐτῶν. Tafsiri kuu inafanya matendo yote mawili yawe wazi bila kuamua zaidi ya maandishi jinsi yanavyohusiana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Wanawaonea shauku” huhifadhi nguvu ya kihisia ya ἐπιποθέω; “neema iliyo kuu sana” ni ya kueleweka kwa wasomaji wa kawaida na huepuka lugha nzito isiyo ya lazima.
