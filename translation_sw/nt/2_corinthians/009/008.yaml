  text: ⸀δυνατεῖ δὲ ὁ θεὸς πᾶσαν χάριν περισσεῦσαι εἰς ὑμᾶς, ἵνα ἐν παντὶ πάντοτε πᾶσαν αὐτάρκειαν ἔχοντες περισσεύητε εἰς πᾶν ἔργον ἀγαθόν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/008.yaml
  text: And God is able to make all grace abound to you[a], so that in everything, at all times, having all sufficiency, you may abound in every good work.
translation:
  language: sw
  text: Naye Mungu anaweza kuwajalia neema yote kwa wingi, ili katika kila jambo na wakati wote, mkiwa na kila mnachohitaji[a], mpate kuzidi katika kila kazi njema.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mkiwa na utoshelevu wote.” Neno la Kigiriki linaweza kumaanisha utoshelevu, hali ya kuwa na yanayotosha, au kuridhika; hapa linahusu Mungu kuwapa wanachohitaji, wala si kujitegemea bila yeye.
    reason: lexical_alternative
lexical_decisions:
- source_word: δυνατεῖ
  choice: anaweza
  rationale: Kitenzi hiki kinaonyesha uwezo wa Mungu; “anaweza” ni Kiswahili cha kawaida kinachohifadhi mkazo juu ya uwezo wake.
- source_word: δὲ
  choice: Naye
  rationale: Hapa δέ ni kiunganishi chepesi, si kinzani kali. “Naye” linaunganisha sentensi hii na hoja iliyotangulia kwa njia ya asili.
- source_word: πᾶσαν χάριν
  choice: neema yote
  rationale: χάρις hapa ni neema ya Mungu kwa maana pana, ikijumuisha kuwajalia waamini mahitaji yanayowawezesha kuwa wakarimu; “neema yote” huhifadhi upana wa neno na msisitizo wa πᾶσαν.
- source_word: περισσεῦσαι εἰς ὑμᾶς
  choice: kuwajalia ... kwa wingi
  rationale: Muundo huu unaonyesha Mungu akisababisha neema iwafikie kwa wingi. “Kuwajalia ... kwa wingi” ni wa asili katika Kiswahili na huhifadhi wazo la utoaji mwingi.
- source_word: ἵνα
  choice: ili
  rationale: “Ili” huonyesha kusudi au matokeo yanayokusudiwa bila kuamua kupita kiasi kati ya vivuli hivyo viwili.
- source_word: ἐν παντὶ πάντοτε
  choice: katika kila jambo na wakati wote
  rationale: Tafsiri hii inaweka wazi urudiaji wenye msisitizo wa maneno ya Kigiriki yenye maana ya ujumla.
- source_word: πᾶσαν αὐτάρκειαν ἔχοντες
  choice: mkiwa na kila mnachohitaji
  rationale: Katika muktadha huu αὐτάρκεια ni kuwa na mahitaji ya kutosha kutokana na utoaji wa Mungu, wala si kujitegemea bila Mungu. Usemi huu ni wa kawaida na unaeleweka wazi kwa wasomaji wa sasa.
- source_word: περισσεύητε
  choice: mpate kuwa na wingi
  rationale: Huhifadhi wazo la kuwa na ziada tele, ingawa Kiswahili huhitaji muundo tofauti na ule uliotumiwa kuhusu neema ya Mungu.
- source_word: εἰς πᾶν ἔργον ἀγαθόν
  choice: kwa ajili ya kila kazi njema
  rationale: Hapa εἰς inaweza kuonyesha mwelekeo au kusudi; “kwa ajili ya” huonyesha kwamba utoaji wa kutosha unawawezesha kufanya kila kazi njema.
theological_decisions:
- issue: Maana ya χάρις katika muktadha wa ukarimu
  choice: Neema kama utoaji wa Mungu kwa upana, unaojumuisha kuwawezesha waamini kuwa wakarimu
  alternative: Fadhili pekee au zawadi ya mali pekee
  rationale: Muktadha unahusu kutoa, lakini χάρις haifai kufupishwa kuwa fedha tu. “Neema yote” huhifadhi maana yake pana ya kitheolojia na matumizi yake ya kimuktadha.
- issue: Maana ya αὐτάρκεια
  choice: Kuwa na kila kinachohitajika, kwa kutegemea utoaji wa Mungu
  alternative: Kutosheka au kujitosheleza kwa uwezo binafsi
  rationale: Hoja ya Paulo inamhusisha Mungu kama chanzo cha utoaji. Tafsiri hii haileti wazo la uhuru wa kifalsafa au kujitegemea bila Mungu.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Tafsiri imetumia ulinganifu mwafaka: imehifadhi msisitizo wa maneno yanayomaanisha “kila/yote” huku ikitoa αὐτάρκεια kwa usemi wa kawaida unaoeleweka. Alama ya tanbihi [a] imewekwa mara baada ya kirai kinachohusika.'
