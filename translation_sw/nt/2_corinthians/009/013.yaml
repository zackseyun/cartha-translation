  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: διὰ τῆς δοκιμῆς τῆς διακονίας ταύτης δοξάζοντες τὸν θεὸν ἐπὶ τῇ ὑποταγῇ τῆς ὁμολογίας ὑμῶν εἰς τὸ εὐαγγέλιον τοῦ Χριστοῦ καὶ ἁπλότητι τῆς κοινωνίας εἰς αὐτοὺς καὶ εἰς πάντας,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/013.yaml
  text: Because of the proof provided by this ministry[a], they glorify God for the obedience of your confession to the gospel of the Messiah and for the generosity of your sharing with them and with everyone[d][c][b],
translation:
  language: sw
  text: Kwa sababu ya uthibitisho unaotolewa na huduma hii, wanamtukuza Mungu kwa ajili ya utiifu unaoambatana na ungamo lenu la Injili ya Masihi[a], na kwa ajili ya ukarimu wenu katika kuwapa wao na watu wote[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Injili ya Kristo.” Neno la Kigiriki Χριστός limetafsiriwa hapa kama “Masihi” ili kuhifadhi maana yake kama cheo.
    reason: alternative_reading
  - marker: b
    text: “Kuwapa” hapa kunatafsiri neno lenye maana ya kushiriki au kuchangia; katika muktadha huu huenda hasa linamaanisha utoaji wa mali kwa ukarimu, si ushirika kwa maana ya jumla tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοκιμῆς
  choice: uthibitisho
  rationale: Katika muktadha huu, huduma ya utoaji ni ushahidi ulioonekana wa imani na upendo wao; “uthibitisho” huonyesha matokeo ya kupimwa kuliko mchakato wa kujaribiwa.
- source_word: διακονίας
  choice: huduma
  rationale: Neno hili linahusu huduma ya msaada iliyopangwa na Paulo; “huduma” huhifadhi maana ya tendo la kuwasaidia wengine na uzito wake wa kiroho.
- source_word: δοξάζοντες τὸν θεὸν
  choice: wanamtukuza Mungu
  rationale: Kauli endelevu ya Kigiriki imewasilishwa kama kitenzi kamili kwa uwazi; “kumtukuza” inalingana kwa karibu na δοξάζω.
- source_word: ὑποταγῇ
  choice: utiifu
  rationale: Hapa neno linaonyesha kujitiisha kunakodhihirishwa kwa matendo katika kuitikia Injili; “utiifu” ni ya kawaida na wazi kwa msomaji wa Kiswahili.
- source_word: ὁμολογίας ὑμῶν
  choice: ungamo lenu
  rationale: Linamaanisha kukiri au kutangaza hadharani imani yao; “ungamo” huhifadhi maana ya tamko la imani.
- source_word: εἰς τὸ εὐαγγέλιον τοῦ Χριστοῦ
  choice: la Injili ya Masihi
  rationale: Muundo mzima umefasiriwa kwa Kiswahili cha asili kama ungamo linalohusu Injili ya Masihi. Χριστός imetafsiriwa kama cheo, “Masihi,” ili kuhifadhi nguvu yake ya kimasihi.
- source_word: ἁπλότητι
  choice: ukarimu
  rationale: Katika muktadha wa mchango wa msaada, neno hili lina maana ya moyo wa kutoa kwa ukunjufu, si urahisi au unyofu pekee.
- source_word: κοινωνίας
  choice: kushiriki
  rationale: Hapa linahusu ushiriki wa mali katika mchango, huku “kushiriki” pia kikihifadhi upana wa neno kuliko “mchango” pekee.
- source_word: εἰς αὐτοὺς καὶ εἰς πάντας
  choice: pamoja nao na pamoja na watu wote
  rationale: Hii ni njia ya asili ya Kiswahili ya kuonyesha walengwa wa kushiriki kwao kwa ukarimu, huku marudio ya uhusiano yakihifadhiwa.
theological_decisions:
- issue: Ufasiri wa Χριστοῦ katika εὐαγγέλιον τοῦ Χριστοῦ
  choice: Injili ya Masihi
  alternative: Injili ya Kristo
  rationale: Χριστός hapa ni cheo; “Masihi” huhifadhi maana ya cheo cha Mtiwa-Mafuta bila kuongeza maelezo ya kimadhehebu.
- issue: Uhusiano wa ὑποταγῇ na ὁμολογίας
  choice: utiifu unaoambatana na ungamo lenu
  alternative: utiifu wa ungamo lenu
  rationale: Genitivi ya Kigiriki inaweza kuwasilishwa rasmi kama “utiifu wa ungamo,” lakini hilo si la kawaida sana kwa Kiswahili. “Unaoambatana na” hufafanua uhusiano bila kudai kwamba ungamo lenyewe ndilo linalotii.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Sentensi inadumisha mtiririko wa hoja ya Paulo na koma ya mwisho kwa kuwa aya ni sehemu ya sentensi ndefu. “Utiifu unaoambatana na ungamo” umetumiwa badala ya muundo mgumu “utiifu wa ungamo,” huku tanbihi zikihifadhi mbadala muhimu wa Χριστός na upeo wa κοινωνία.
