  rationale: The sole necessary textual correction replaces the inadvertently negative finite verb with an idiomatic Swahili construction that faithfully expresses the Greek οὐ μόνον ... ἀλλὰ καί (“not only ... but also”). The rendering of the overflowing and thanksgiving relationship remains deliberately noncommittal, while the alternative footnote presents the explicitly resultative reading.
