    issue: Negative verbal form in “haitimizi tu”
    rationale: The prefix hai- makes the clause negative. In context it communicates ‘does not fulfill only,’ rather than the Greek contrast, ‘is not only supplying ... but also ...’. The construction must be recast.
  - severity: low
    issue: Footnote a is an incomplete alternative phrase
    rationale: “upungufu wa watakatifu” is understandable but less natural as an alternative for “mahitaji.” “vitu wanavyokosa watakatifu” clearly conveys the lexical sense of ὑστερήματα.
