  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὅτι ἡ διακονία τῆς λειτουργίας ταύτης οὐ μόνον ἐστὶν προσαναπληροῦσα τὰ ὑστερήματα τῶν ἁγίων, ἀλλὰ καὶ περισσεύουσα διὰ πολλῶν εὐχαριστιῶν τῷ θεῷ—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/012.yaml
  text: For the ministry of this service is not only supplying the needs of the saints[b][a], but is also overflowing in many thanksgivings to God—
translation:
  language: sw
  text: Kwa maana huduma ya utumishi huu si ya kutimiza tu mahitaji ya watakatifu[a], bali pia inafurika kwa shukrani nyingi kwa Mungu[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “vitu wanavyokosa watakatifu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “na kuzaa shukrani nyingi kwa Mungu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Kwa maana
  rationale: Kishazi hiki kinaeleza sababu au ufafanuzi wa kauli iliyotangulia; “Kwa maana” huhifadhi uhusiano huo kwa Kiswahili cha kawaida.
- source_word: ἡ διακονία τῆς λειτουργίας ταύτης
  choice: huduma ya utumishi huu
  rationale: “Huduma” kwa διακονία na “utumishi” kwa λειτουργία zinahifadhi tofauti ya nomino hizo mbili zinazohusiana bila kufanya usemi kuwa mzito kupita kiasi.
- source_word: προσαναπληροῦσα
  choice: haitimizi tu
  rationale: Kitenzi kina maana ya kujazia au kutosheleza kilichopungua; “kutimiza mahitaji” ni usemi wa asili unaoeleweka katika muktadha wa msaada.
- source_word: τὰ ὑστερήματα
  choice: mahitaji
  rationale: Katika muktadha wa mchango wa kuwasaidia wengine, neno hili hurejelea upungufu au vitu vinavyokosekana; “mahitaji” ni wazi na la kawaida.
- source_word: τῶν ἁγίων
  choice: ya watakatifu
  rationale: Huhifadhi istilahi ya kawaida ya Paulo kwa waumini bila kuibadili kwa tafsiri pana zaidi kama “watu wa Mungu.”
- source_word: περισσεύουσα
  choice: inafurika
  rationale: Huhifadhi picha ya wingi unaozidi kiwango cha kutosha na uhusiano wa kisarufi na “huduma.”
- source_word: διὰ πολλῶν εὐχαριστιῶν τῷ θεῷ
  choice: kwa shukrani nyingi kwa Mungu
  rationale: “Kwa” huacha wazi kiasi fulani ikiwa διά inaonyesha njia, matokeo, au mazingira ya kufurika huko, huku shukrani zikielekezwa kwa Mungu.
theological_decisions:
- issue: Maana ya ἅγιοι katika istilahi ya Paulo
  choice: watakatifu
  alternative: watu wa Mungu; walio watakatifu
  rationale: “Watakatifu” hudumisha istilahi ya Paulo kwa waumini wanaopokea msaada, bila kuingiza wazo la kundi maalumu lililotangazwa kuwa watakatifu baadaye.
- issue: Uhusiano wa διά na “shukrani nyingi”
  choice: kwa shukrani nyingi kwa Mungu
  alternative: na kuzaa shukrani nyingi kwa Mungu; kupitia shukrani nyingi kwa Mungu
  rationale: Kigiriki kinaweza kusisitiza njia au matokeo. Tafsiri kuu huepuka kufunga kabisa maana hiyo, na tanbihi inaonyesha tafsiri ya kimatokeo iliyo wazi zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Mstari unaendeleza sentensi inayofuata, ndiyo maana umehitimishwa kwa kistari kirefu.
