  text: ἡ γὰρ ἀγάπη τοῦ Χριστοῦ συνέχει ἡμᾶς, κρίναντας τοῦτο ⸀ὅτι εἷς ὑπὲρ πάντων ἀπέθανεν· ἄρα οἱ πάντες ἀπέθανον·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/014.yaml
  text: 'For the love of Messiah compels us[a], because we have concluded this: that one died on behalf of all; therefore all died.'
translation:
  language: sw
  text: 'Kwa maana upendo wa Masihi[a] unatusukuma, kwa kuwa tumefikia uamuzi huu: mmoja alikufa kwa ajili ya wote; kwa hiyo wote walikufa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “upendo ambao Masihi anao,” au “upendo kwa Masihi”; muundo wa Kiyunani unaweza kueleweka kwa njia yoyote kati ya hizo.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγάπη
  choice: upendo
  rationale: “Upendo” ni neno la kawaida, la kisasa na lenye heshima kwa ἀγάπη, bila kutumia neno la kizamani au lenye maana finyu.
- source_word: τοῦ Χριστοῦ
  choice: wa Masihi
  rationale: Χριστός ni cheo kinachomaanisha Masihi. Muundo “upendo wa Masihi” unaacha wazi kama ni upendo ambao Masihi anao au upendo unaoelekezwa kwake.
- source_word: συνέχει
  choice: unatusukuma
  rationale: Katika muktadha huu kitenzi kinaonyesha nguvu kubwa ya ndani inayowaongoza na kuwahimiza Paulo na wenzake. “Unatusukuma” ni Kiswahili cha kawaida kisichodokeza udhibiti wa kimitambo.
- source_word: κρίναντας τοῦτο
  choice: kwa kuwa tumefikia uamuzi huu
  rationale: Kirai kishirikishi kinaeleza msingi wa kauli iliyotangulia, na κρίνω hapa ina maana ya kufikia hitimisho baada ya kutathmini.
- source_word: ὅτι
  choice: ':'
  rationale: Katika Kiswahili, alama ya nukta mbili baada ya “uamuzi huu” hutambulisha kwa kawaida na kwa uwazi yaliyomo katika uamuzi huo.
- source_word: εἷς
  choice: mmoja
  rationale: Chanzo kinasema tu “mmoja.” Tafsiri inahifadhi ufupi na mkazo huo bila kuongeza “mtu” au kumtaja Masihi tena.
- source_word: ὑπὲρ πάντων
  choice: kwa ajili ya wote
  rationale: “Kwa ajili ya” huwasilisha tendo lililofanywa kwa niaba au kwa manufaa ya wote bila kulazimisha maana finyu ya “badala ya.”
- source_word: ἄρα
  choice: kwa hiyo
  rationale: Huonyesha wazi hitimisho linalotokana na kauli iliyotangulia.
- source_word: οἱ πάντες
  choice: wote
  rationale: “Wote” ndiyo tafsiri ya kawaida na fupi; kuongeza “watu” kungekuwa ufafanuzi usio lazima.
- source_word: ἀπέθανον
  choice: walikufa
  rationale: Wakati uliopita sahili unafaa kwa kauli hii fupi ya kimantiki na hauongezi maelezo ya kitheolojia yasiyosemwa moja kwa moja.
theological_decisions:
- issue: Maana ya umilikishi katika ἡ ἀγάπη τοῦ Χριστοῦ
  choice: Upendo wa Masihi
  alternative: Upendo wa Masihi kwetu; au upendo wetu kwa Masihi
  rationale: Muundo wa Kiyunani unaweza kumaanisha upendo ambao Masihi anao au upendo unaoelekezwa kwa Masihi. Muundo wa Kiswahili “upendo wa Masihi” unahifadhi utata huo halisi, na tanbihi inaonyesha maana zinazowezekana.
- issue: Maana ya “wote walikufa”
  choice: Wote walikufa
  alternative: Wote walikufa kwa uwakilishi katika Masihi; au waamini wote walikufa pamoja naye
  rationale: Hoja ya Paulo ni fupi na yenye uzito wa kitheolojia. Tafsiri haiifafanui kwa kuamua kimbele upeo wa “wote” au namna ya ushiriki wao katika kifo hicho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imehifadhi mtiririko wa hoja ya chanzo, huku “unatusukuma” na “tumefikia uamuzi huu” zikitoa lugha ya kawaida inayoeleweka kwa wasomaji wengi.
