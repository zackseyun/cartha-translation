id: 2CO.5.11
reference: 2 Corinthians 5:11
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Εἰδότες οὖν τὸν φόβον τοῦ κυρίου ἀνθρώπους πείθομεν, θεῷ δὲ πεφανερώμεθα· ἐλπίζω δὲ καὶ ἐν ταῖς συνειδήσεσιν ὑμῶν πεφανερῶσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/011.yaml
  text: Therefore[a], knowing the fear of the Lord, we persuade people; but we have been made known to God[b], and I hope that we also have been made known in your consciences.
translation:
  language: sw
  text: Kwa hiyo, kwa kuwa tunaijua hofu ya Bwana[a], tunawashawishi watu; lakini tumefunuliwa wazi kwa Mungu[b], nami natumaini kwamba tumefunuliwa wazi pia katika dhamiri zenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kicho kwa Bwana.” Hapa “hofu ya Bwana” inaweza kujumuisha kicho na heshima mbele zake, hasa kwa kuzingatia kiti cha hukumu kilichotajwa katika mstari uliotangulia.
    reason: lexical_alternative
  - marker: b
    text: Tafsiri ya karibu zaidi na muundo wa Kigiriki ni, “tumefunuliwa kwa Mungu ... tumefunuliwa pia katika dhamiri zenu.” Maana yake ni kwamba Paulo na wenzake wako wazi na wanajulikana mbele za Mungu na, anavyotumaini Paulo, katika dhamiri za Wakorintho.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰδότες
  choice: kwa kuwa tunaijua
  rationale: Kitenzi hiki ni participio ya hali timilifu yenye maana ya wakati wa sasa. Muundo wa sababu unafaa muktadha, huku wazo kuu la ‘kujua’ likihifadhiwa.
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Inaonyesha hitimisho linalotokana na habari iliyotangulia, hasa kutajwa kwa kiti cha hukumu katika mstari wa 10.
- source_word: φόβον τοῦ κυρίου
  choice: hofu ya Bwana
  rationale: ‘Hofu’ inadumisha uzito wa neno la Kigiriki na haipunguzi maana yake kuwa heshima tu; inaweza kujumuisha kicho, heshima na kuwajibika mbele za Bwana.
- source_word: ἀνθρώπους
  choice: watu
  rationale: Neno hilo linawahusu wanadamu kwa ujumla, si wanaume peke yao.
- source_word: πείθομεν
  choice: tunawashawishi
  rationale: Hii inawakilisha moja kwa moja kitenzi cha wakati wa sasa bila kukidhoofisha kuwa ‘tunajaribu kuwashawishi.’
- source_word: θεῷ δὲ πεφανερώμεθα
  choice: lakini tumekuwa wazi kwa Mungu
  rationale: Muundo huu wa kawaida wa Kiswahili unaonyesha hali ya Paulo na wenzake kuwa dhahiri kabisa kwa Mungu, huku ukihifadhi matokeo ya kudumu ya hali timilifu.
- source_word: ἐλπίζω
  choice: nami natumaini
  rationale: Inahifadhi tumaini la Paulo lililoelezwa kwa unyenyekevu na pia kiunganishi kinachoendeleza sentensi.
- source_word: ἐν ταῖς συνειδήσεσιν ὑμῶν
  choice: katika dhamiri zenu
  rationale: Wingi wa ‘dhamiri’ umehifadhiwa, kwa kuwa Kigiriki kinaelekeza kwenye utambuzi wa ndani wa wasomaji mmoja mmoja.
- source_word: πεφανερῶσθαι
  choice: tumekuwa wazi
  rationale: Inarudia wazo lilelile la φανερόω na kudumisha maana ya hali iliyokwisha kutokea lakini inayoendelea kuwa na matokeo sasa.
theological_decisions:
- issue: Maana ya ‘hofu ya Bwana’ katika muktadha
  choice: Kuhifadhi neno ‘hofu’
  alternative: kicho kwa Bwana; heshima kwa Bwana
  rationale: Muktadha wa hukumu ya Mungu katika 2 Wakorintho 5:10 unaunga mkono maana nzito inayoweza kujumuisha kicho na kuwajibika. ‘Heshima’ pekee ingeweza kupunguza nguvu ya kifungu.
- issue: Nguvu ya φανερόω kuhusu Mungu na dhamiri za Wakorintho
  choice: tumekuwa wazi kwa Mungu ... katika dhamiri zenu
  alternative: tumefunuliwa kwa Mungu ... katika dhamiri zenu; tumejulikana wazi na Mungu
  rationale: Uamuzi huu unaonyesha kwamba tabia na huduma ya Paulo na wenzake iko wazi kabisa kwa Mungu na, kama anavyotumaini, kwa utambuzi wa ndani wa Wakorintho. Hauongezi madai ya kiteolojia yasiyokuwamo katika maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka. ‘Hofu ya Bwana’ inadumishwa kama msemo wa kibiblia wenye uzito, na ‘tumekuwa wazi’ hutoa Kiswahili cha kawaida zaidi kuliko ‘tumefunuliwa’ bila kuondoa wazo la kuwa dhahiri kabisa.
