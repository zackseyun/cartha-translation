  text: Θαρροῦντες οὖν πάντοτε καὶ εἰδότες ὅτι ἐνδημοῦντες ἐν τῷ σώματι ἐκδημοῦμεν ἀπὸ τοῦ κυρίου,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/006.yaml
  text: Therefore[a], we are always confident and know that while we are at home in the body, we are away from the Lord,
translation:
  language: sw
  text: Kwa hiyo, sikuzote tuna ujasiri, tukijua kwamba tukiwa nyumbani katika mwili, tuko mbali na Bwana.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hatupo pamoja na Bwana.” Kitenzi cha Kigiriki ἐκδημοῦμεν ni kinyume cha “tuko nyumbani” na kinaweza kutafsiriwa “tuko mbali” au “hatupo pamoja na Bwana.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Θαρροῦντες
  choice: tuna ujasiri
  rationale: Kitenzi kishirikishi cha wakati uliopo kinaonyesha hali inayoendelea ya kuwa na moyo mkuu au ujasiri. Muundo wa kitenzi kikuu unasomeka kwa kawaida katika Kiswahili huku ukidumisha maana hiyo.
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Inaonyesha hitimisho linalotokana na hoja iliyotangulia kuhusu uzima wa ufufuo na makao ya mbinguni.
- source_word: πάντοτε
  choice: sikuzote
  rationale: Inaonyesha kuwa ujasiri huo ni wa kudumu.
- source_word: εἰδότες
  choice: tunajua
  rationale: Ni kitenzi kishirikishi chenye maana ya hali ya sasa ya ufahamu uliothibitika; “tunajua” ni ya kawaida na wazi.
- source_word: ἐνδημοῦντες
  choice: maadamu tuko nyumbani
  rationale: Inahifadhi sitiari ya kuwa nyumbani na pia inaonyesha hali inayoendelea wakati wa maisha ya mwilini.
- source_word: ἐν τῷ σώματι
  choice: katika mwili
  rationale: Inataja hali ya sasa ya kuishi kimwili bila kuongeza neno “huu,” ambalo halilazimishwi na Kigiriki.
- source_word: ἐκδημοῦμεν
  choice: tuko mbali
  rationale: Inadumisha utofautishaji wa mahali dhidi ya “tuko nyumbani” kwa lugha ya Kiswahili ya sasa na inayoeleweka.
- source_word: ἀπὸ τοῦ κυρίου
  choice: na Bwana
  rationale: Pamoja na “tuko mbali,” kiunganishi hiki kinaonyesha utengano unaowakilishwa na ἀπό; κύριος limetafsiriwa “Bwana.”
theological_decisions:
- issue: Utofautishaji wa kisitiari kati ya maisha katika mwili na kuwa pamoja na Bwana
  choice: Maisha ya sasa yanaelezwa kuwa “nyumbani katika mwili” na wakati huohuo “mbali na Bwana.”
  alternative: Kusema kwamba waamini wametengwa kabisa na uwepo wote wa Kristo, au kuingiza hapa maneno ya mstari unaofuata kuhusu kutoka katika mwili na kuwa pamoja na Bwana.
  rationale: 'Tafsiri inadumisha mvutano wa mstari wenyewe: Paulo analinganisha maisha ya sasa ya mwilini na kutokuwa bado pamoja na Bwana kwa maana inayokusudiwa hapa, bila kudai kutengwa kabisa na Kristo wala kuingiza maelezo ya mstari wa 8.'
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sitiari ya “nyumbani” imehifadhiwa, na muundo wa vitenzi vikuu umetumiwa ili sentensi iwe ya kawaida na rahisi kueleweka.
