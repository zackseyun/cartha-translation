  verdict: revise
  source_fidelity: The draft accurately conveys the inference (οὖν), continual confidence (πάντοτε), settled knowledge (εἰδότες), and the spatial-home metaphor contrasting embodied existence with being away from the Lord. However, “maadamu” can express a limiting condition (“as long as”) more strongly than the Greek participle, which simply marks the concurrent state.
  naturalness: The wording is generally clear and standard. Recasting the participial relationship as “tukijua kwamba tukiwa...” is natural Swahili and better reflects the Greek syntax without making the clause conditional.
  terminology: “Bwana,” “mwili,” “nyumbani,” and “mbali na” are appropriate and preserve the passage’s metaphorical and theological restraint. The footnote should state the alternative with its complement, rather than the incomplete “hatupo.”
  issues:
  - severity: low
    issue: “maadamu” adds a potentially stronger conditional or duration-limiting nuance.
    rationale: ἐνδημοῦντες means ‘while being at home’/‘being at home’; it does not itself frame the statement as conditional. “Tukiwa” preserves the temporal-concurrent sense.
  - severity: low
    issue: The footnote’s final alternative, “hatupo,” is incomplete in isolation.
    rationale: The alternative should retain the relationship expressed by ἀπὸ τοῦ κυρίου, e.g. “hatupo pamoja na Bwana.”
