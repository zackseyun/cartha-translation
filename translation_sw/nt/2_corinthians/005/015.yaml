  text: καὶ ὑπὲρ πάντων ἀπέθανεν ἵνα οἱ ζῶντες μηκέτι ἑαυτοῖς ζῶσιν ἀλλὰ τῷ ὑπὲρ αὐτῶν ἀποθανόντι καὶ ἐγερθέντι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/015.yaml
  text: And he died for all[a], so that those who live might no longer live for themselves[b], but for the one who died and was raised for them.
translation:
  language: sw
  text: Naye alikufa kwa ajili ya wote[a], ili walio hai wasiishi tena kwa ajili yao wenyewe, bali kwa ajili ya yule aliyekufa na kufufuliwa[b] kwa ajili yao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa niaba ya wote.” Neno la Kigiriki ὑπέρ, lililotumiwa pia mwishoni mwa aya, linaweza kusisitiza manufaa au uwakilishi.
    reason: lexical_alternative
  - marker: b
    text: 'Kigiriki kina hali ya kutendwa: “alifufuliwa”; tafsiri nyingine zinaweza kusema “alifufuka.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ὑπὲρ πάντων ἀπέθανεν
  choice: Naye alikufa kwa ajili ya wote
  rationale: “Naye” linaendeleza hoja na kuonyesha mhusika anayeeleweka kutokana na muktadha. “Kwa ajili ya wote” ni Kiswahili cha kawaida kinachoonyesha tendo lililofanywa kwa manufaa au kwa niaba ya wengine bila kulazimisha nadharia mahususi ya upatanisho.
- source_word: ἵνα
  choice: ili
  rationale: “Ili” linaonyesha kusudi au matokeo yaliyokusudiwa kwa njia ya asili na wazi.
- source_word: οἱ ζῶντες
  choice: walio hai
  rationale: Kishiriki hiki kimetumiwa kama nomino kurejelea watu walio hai; tafsiri hii ni wazi na inaacha muktadha ueleze maana yake ya kiroho au ya kuwepo.
- source_word: μηκέτι ἑαυτοῖς ζῶσιν
  choice: wasiishi tena kwa ajili yao wenyewe
  rationale: “Tena” pamoja na hali ya kukanusha huonyesha kukoma kwa mwenendo wa awali, na “kwa ajili yao wenyewe” huonyesha maisha yanayoelekezwa kwenye maslahi ya nafsi.
- source_word: ἀλλὰ τῷ ὑπὲρ αὐτῶν ἀποθανόντι καὶ ἐγερθέντι
  choice: bali kwa ajili ya yule aliyekufa na kufufuliwa kwa ajili yao
  rationale: 'Muundo huu unaendeleza utofautishaji: wasiishi kwa ajili yao wenyewe, bali kwa ajili ya mwingine. “Yule aliyekufa na kufufuliwa” huhifadhi muundo wa vishiriki na hali ya kutendwa ya ἐγερθέντι.'
- source_word: ὑπὲρ αὐτῶν
  choice: kwa ajili yao
  rationale: Inarudia kwa kawaida maana ya ὑπέρ iliyotumiwa mapema, huku ikihifadhi wazo la manufaa au uwakilishi.
theological_decisions:
- issue: Upeo wa πάντων na αὐτῶν
  choice: wote / wao
  alternative: watu wote bila kizuizi; au wote wanaowakilishwa na Kristo katika muktadha
  rationale: Aya yenyewe hutumia maneno mapana bila kuamua moja kwa moja mijadala ya baadaye kuhusu upeo wa kifo cha Kristo. Tafsiri haibani rejeleo wala kuingiza msimamo wa dhehebu.
- issue: Hali ya ἐγερθέντι
  choice: aliyefufuliwa
  alternative: aliyefufuka
  rationale: “Aliyefufuliwa” huhifadhi hali ya kutendwa ya Kigiriki na hivyo kuacha wazi tendo la Mungu katika ufufuo; “aliyefufuka” ni la kawaida lakini halionyeshi wazi hali hiyo ya kisarufi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Marudio ya “kwa ajili ya” yamehifadhiwa kwa sababu yanaakisi marudio na utofautishaji wa maandishi ya Kigiriki.
