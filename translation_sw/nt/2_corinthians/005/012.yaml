id: 2CO.5.12
reference: 2 Corinthians 5:12
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ⸀οὐ πάλιν ἑαυτοὺς συνιστάνομεν ὑμῖν, ἀλλὰ ἀφορμὴν διδόντες ὑμῖν καυχήματος ὑπὲρ ἡμῶν, ἵνα ἔχητε πρὸς τοὺς ἐν προσώπῳ καυχωμένους καὶ ⸂μὴ ἐν⸃ καρδίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/012.yaml
  text: We are not commending ourselves to you again[a], but giving you an opportunity to boast about us[b], so that you may have an answer for those who boast in outward appearance and not in heart.
translation:
  language: sw
  text: Hatujipendekezi tena kwenu, bali tunawapa nafasi ya kujivunia kutuhusu[a], ili mpate la kuwajibu wale wanaojivunia mambo ya nje, wala si ya moyoni.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nafasi ya kujivunia kwa ajili yetu.”
    reason: lexical_alternative
  - marker: b
    text: Kwa neno halisi, “wanaojivunia kwa uso, wala si kwa moyo,” yaani, wanaojivunia mambo ya nje badala ya hali halisi ya ndani.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνιστάνομεν
  choice: tunajipendekeza
  rationale: Kitenzi hiki hapa kinamaanisha kujitambulisha au kujionyesha kuwa mtu anayestahili kukubaliwa. “Kujipendekeza” ni kifupi na cha kawaida, huku muktadha ukionyesha kwamba Paulo anakataa kujisifu au kujithibitisha mwenyewe.
- source_word: ἀφορμὴν
  choice: nafasi
  rationale: Neno hilo linaweza kumaanisha nafasi, fursa, au msingi wa kutenda jambo. “Nafasi” ni ya asili katika Kiswahili na inaonyesha kwamba Paulo anawapa Wakorintho jambo la kutumia katika majibu yao.
- source_word: καυχήματος
  choice: ya kujivunia
  rationale: “Kujivunia” linahifadhi uhusiano wa kimsamiati na καυχωμένους baadaye katika mstari bila kuashiria lazima majivuno mabaya.
- source_word: ὑπὲρ ἡμῶν
  choice: kwa ajili yetu
  rationale: Kirai hiki kinaweza kueleza kuwatetea au kuwasemea Paulo na wenzake, si kuzungumza tu kuwahusu. Tanbihi inahifadhi uwezekano wa maana ya “kutuhusu.”
- source_word: ἵνα ἔχητε πρὸς
  choice: ili mpate la kuwajibu
  rationale: Nahau hii inadokeza kuwa na jambo la kusema dhidi ya madai ya watu hao. Tafsiri hii ni ya asili na haiongezi maelezo ya jibu lenyewe.
- source_word: ἐν προσώπῳ
  choice: mwonekano wa nje
  rationale: Kwa muktadha huu, “uso” unatumiwa kwa maana ya jambo la nje linaloonekana, tofauti na hali ya moyoni.
- source_word: καυχωμένους
  choice: wanaojivunia
  rationale: Uteuzi huu unadumisha mwangwi wa καυχήματος katika sehemu ya kwanza ya mstari.
- source_word: καρδίᾳ
  choice: yaliyo moyoni
  rationale: “Moyo” huhifadhi taswira ya chanzo na tofauti yake na mwonekano wa nje; “yaliyo” hufanya usemi uwe wa kawaida katika Kiswahili.
- source_word: πάλιν
  choice: tena
  rationale: “Tena” linaonyesha wazi wazo la kurudia ambalo Paulo analikana.
theological_decisions:
- issue: Tofauti kati ya ἐν προσώπῳ na μὴ ἐν καρδίᾳ
  choice: mwonekano wa nje dhidi ya yaliyo moyoni
  alternative: sifa ya hadharani dhidi ya unyofu wa ndani; au uso dhidi ya moyo
  rationale: Tafsiri hii inadumisha tofauti ya kimaadili kati ya mambo ya nje na hali ya ndani bila kuifunga katika fundisho finyu zaidi. Tanbihi inaonyesha umbo halisi la usemi wa Kigiriki.
- issue: Maana ya ὑπὲρ ἡμῶν
  choice: kwa ajili yetu
  alternative: kutuhusu
  rationale: “Kwa ajili yetu” inadumisha uwezekano wa Wakorintho kuwasemea au kuwatetea Paulo na wenzake, huku tanbihi ikihifadhi maana ya mada inayowahusu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. “Mpate la kuwajibu” ni nahau fupi ya asili; “mwonekano wa nje” na “yaliyo moyoni” huhifadhi tofauti ya chanzo huku zikiepuka tafsiri ngumu isiyo ya kawaida.
