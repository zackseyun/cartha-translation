lexical_decisions:
- source_word: καὶ γὰρ
  choice: Kwa maana
  rationale: Kirai hiki kinaunganisha mstari na uliotangulia kwa kutoa maelezo yenye msisitizo wa kiasi. “Kwa maana” ni unganisho la kawaida na la asili katika Kiswahili.
- source_word: ἐν τούτῳ
  choice: katika hili
  rationale: Tafsiri hii inadumisha kutokuwa wazi kwa kiwakilishi cha Kigiriki. Huenda kinarejelea hali ya sasa ya mwili iliyotajwa kabla, lakini mstari haurudii waziwazi neno “hema.”
- source_word: στενάζομεν
  choice: tunaugua
  rationale: “Tunaugua” huonyesha uzito wa ndani na shauku bila kuongeza maana ya kuomboleza ambayo si lazima iwepo hapa.
- source_word: τὸ οἰκητήριον ἡμῶν τὸ ἐξ οὐρανοῦ
  choice: makao yetu yatokayo mbinguni
  rationale: “Makao” yanadumisha taswira ya mahali pa kukaa, na “yatokayo mbinguni” yanahifadhi wazi wazo la asili au chanzo lililo katika ἐξ οὐρανοῦ.
- source_word: ἐπενδύσασθαι
  choice: kujivika
  rationale: Kitenzi hiki kinatumia taswira ya kuvaa vazi, hasa kuvaa juu ya jingine. “Kujivika” ni fupi na ya asili zaidi katika matini kuu, huku maana mahsusi zaidi ikielezwa katika tanbihi.
- source_word: ἐπιποθοῦντες
  choice: tukitamani sana
  rationale: Kirai hiki kinaonyesha hamu kubwa inayoandamana na kuugua; “kutamani sana” ni Kiswahili cha kawaida na hudumisha nguvu ya kitenzi.
theological_decisions:
- issue: Maana ya taswira ya makao na kujivika kutoka mbinguni
  choice: Kudumisha kwa pamoja taswira za makao na vazi bila kubainisha zaidi hali inayokusudiwa.
  alternative: Kutafsiri moja kwa moja kuwa “mwili wa ufufuo” au “nyumba ya mbinguni.”
  rationale: Mstari wenyewe unaunganisha taswira mbili na hauelezi wazi ikiwa unazungumzia hasa mwili wa ufufuo, hali ya kati, au makao ya mwisho ya mbinguni. Tafsiri haipaswi kuondoa mvutano huo wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “kujivika makao” ni taswira iliyochanganyika kwa makusudi ili kudumisha mvutano wa Kigiriki kati ya makao na vazi; tanbihi zinafafanua bila kuubadili kuwa fundisho mahususi.
