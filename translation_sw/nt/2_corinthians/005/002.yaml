  text: For indeed in this we groan[a], longing to put on our dwelling from heaven[b],
translation:
  language: sw
  text: Kwa maana katika hili tunaugua, tukitamani sana kujivika[b] makao yetu yatokayo mbinguni[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “makao yetu ya mbinguni.” Kigiriki kinasema kwa maana ya karibu zaidi “makao yetu yatokayo mbinguni,” kikisisitiza chanzo chake.
    reason: lexical_alternative
  - marker: b
    text: Kitenzi kinaweza kuwa na maana ya “kuvaa juu ya,” kama kuvaa vazi moja juu ya jingine.
