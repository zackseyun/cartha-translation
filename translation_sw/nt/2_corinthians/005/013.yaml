  yaml_path: translation/nt/2_corinthians/005/013.yaml
  text: For if we are out of our minds[a], it is for God; if we are of sound mind[b], it is for you.
translation:
  language: sw
  text: Kwa maana, ikiwa tumerukwa na akili[a], ni kwa ajili ya Mungu; ikiwa tuna akili timamu[b], ni kwa ajili yenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “tumepoteza akili.”
    reason: lexical_alternative
  - marker: b
    text: Au, “tuna kiasi na busara” / “tuko katika hali yetu ya kawaida ya akili.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴτε ... εἴτε
  choice: ikiwa ... ikiwa
  rationale: Urudiaji wa “ikiwa” ni wa asili katika Kiswahili na unahifadhi muundo wa masharti mawili yenye nguvu ya ama...au bila kulazimisha kiunganishi cha ziada.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Kiunganishi hiki kinaonyesha kwamba mstari unatoa sababu au ufafanuzi wa kauli iliyotangulia; “Kwa maana” huhifadhi uhusiano huo kwa mtindo wenye hadhi.
- source_word: ἐξέστημεν
  choice: tumerukwa na akili
  rationale: Kitenzi hiki katika matumizi yasiyo elekezi kinaweza kumaanisha kuwa nje ya akili au kuonekana kama mwenye wazimu. “Tumerukwa na akili” ni usemi wa kawaida unaohifadhi ukali wa tofauti bila kuthibitisha kwamba Paulo alikuwa mwendawazimu kihalisi.
- source_word: θεῷ
  choice: ni kwa ajili ya Mungu
  rationale: Uhusika wa dative ni wa mkato na unaweza kuonyesha rejeleo au manufaa. “Kwa ajili ya Mungu” huonyesha kwamba hali au mwenendo unaotajwa unamhusu au unaelekezwa kwa Mungu, huku ukihifadhi kiasi cha ufinyu wa kauli ya asili.
- source_word: σωφρονοῦμεν
  choice: tuna akili timamu
  rationale: Kitenzi kina maana ya kufikiri kwa utimamu, kuwa mwenye kiasi, au kuwa na busara. “Tuna akili timamu” huleta tofauti ya moja kwa moja na “tumerukwa na akili” na ni Kiswahili cha sasa kinachoeleweka.
- source_word: ὑμῖν
  choice: ni kwa ajili yenu
  rationale: Kama θεῷ, dative hii ya mkato huonyesha rejeleo au manufaa. Tafsiri hii inaeleza kwa kawaida kwamba mwenendo wa Paulo wa utimamu unawanufaisha Wakorintho.
theological_decisions:
- issue: Maana ya maelezo mawili yanayotofautiana kuhusu hali ya Paulo
  choice: Kuhifadhi tofauti kati ya kuonekana kama aliyerukwa na akili na kuwa na akili timamu, bila kudai wazimu halisi.
  alternative: Kuitafsiri kama uzoefu maalumu wa kidini wa hali ya kupagawa, au kama kejeli tupu inayorejelea tu mashtaka ya wengine.
  rationale: Kauli ya Kigiriki ni ya balagha na ya mkato. Tafsiri inahifadhi mvutano wake bila kuingiza fundisho maalumu kuhusu hali ya kiroho wala kuondoa uwezekano wa kwamba wengine walimwona Paulo kuwa asiye na akili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi na chenye hadhi. Muundo mfupi wa Kigiriki umehifadhiwa kwa urudiaji sambamba wa “ikiwa ... ikiwa,” na maneno ya ufafanuzi yamewekewa kiasi ili kutopanua kauli kuliko chanzo.
