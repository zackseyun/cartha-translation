id: 2CO.5.18
reference: 2 Corinthians 5:18
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: τὰ δὲ πάντα ἐκ τοῦ θεοῦ τοῦ καταλλάξαντος ἡμᾶς ἑαυτῷ ⸀διὰ Χριστοῦ καὶ δόντος ἡμῖν τὴν διακονίαν τῆς καταλλαγῆς,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/018.yaml
  text: All these things are from God[a], who reconciled us to himself through Messiah and gave us the ministry of reconciliation[c][b],
translation:
  language: sw
  text: Mambo haya yote yanatoka kwa Mungu[a], ambaye alitupatanisha naye mwenyewe kwa njia ya Masihi[b] na kutupa[c] huduma ya upatanisho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “vitu vyote.” Kirai hiki kinaweza kumaanisha kwa upana kila kitu katika hali hii mpya, au hasa mambo yaliyotajwa katika muktadha uliotangulia.
    reason: lexical_alternative
  - marker: b
    text: 'Kigiriki: “kwa njia ya Kristo.” Hapa Χριστός limetafsiriwa “Masihi” kwa sababu linatumika kama cheo.'
    reason: alternative_reading
  - marker: c
    text: “Tu-” inaweza kuwarejelea waumini kwa upana, ingawa katika muktadha unaozunguka Paulo anasisitiza hasa utume aliokabidhiwa yeye na watendakazi wenzake.
    reason: alternative_reading
lexical_decisions:
- source_word: τὰ δὲ πάντα
  choice: Mambo haya yote
  rationale: Kiwakilishi chenye kibainishi kinaweza kurejelea kwa upana mambo yaliyotangulia katika muktadha, hasa uumbaji mpya na maisha yaliyobadilishwa. Neno δέ linaonyesha mpito hafifu; halihitaji kuongezwa neno zito kama “lakini” katika Kiswahili hapa.
- source_word: ἐκ τοῦ θεοῦ
  choice: yanatoka kwa Mungu
  rationale: ἐκ huonyesha chanzo au asili; usemi huu ni wa kawaida na wazi katika Kiswahili.
- source_word: τοῦ καταλλάξαντος ἡμᾶς ἑαυτῷ
  choice: ambaye alitupatanisha naye mwenyewe
  rationale: Kirai cha kitenzi cha Kigiriki kimetolewa kama kishazi rejeshi cha kawaida katika Kiswahili, huku “naye mwenyewe” kikihifadhi kwamba Mungu ndiye aliyewapatanisha watu na nafsi yake.
- source_word: διὰ Χριστοῦ
  choice: kwa njia ya Masihi
  rationale: διά pamoja na umilikishi huonyesha njia au wakala, na Χριστός hapa inafanya kazi kama cheo kinachohusiana na jukumu lake la upatanisho.
- source_word: δόντος ἡμῖν
  choice: na kutupa
  rationale: Kitenzi hiki cha pili kinashirikiana na kile cha kwanza na kina Mungu kama mtendaji; muundo wa Kiswahili ni mfupi na wa asili.
- source_word: τὴν διακονίαν τῆς καταλλαγῆς
  choice: huduma ya upatanisho
  rationale: διακονία hapa ni huduma au wajibu uliokabidhiwa, na umilikishi τῆς καταλλαγῆς unaeleza maudhui au sifa ya huduma hiyo.
theological_decisions:
- issue: Maana ya Χριστοῦ
  choice: Masihi
  alternative: Kristo
  rationale: Neno la Kigiriki linatumika hapa kama cheo, likisisitiza nafasi yake kama njia ambayo Mungu analeta upatanisho.
- issue: Wigo wa ἡμᾶς na ἡμῖν
  choice: tu- (“sisi”) bila kuufafanua zaidi
  alternative: waumini wote kwa jumla, au Paulo na watendakazi wenzake hasa
  rationale: 'Kigiriki kinaacha wigo ukiwa na mvutano wa kimuktadha: upatanisho unaweza kuwahusu waumini kwa upana, lakini kukabidhiwa kwa huduma kunasisitiza pia utume wa Paulo na wenzake. Tafsiri kuu haisuluhishi jambo hili kimya kimya.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Muundo ni wa karibu na Kigiriki bila kuwa mgumu; “huduma ya upatanisho” huhifadhi istilahi kuu na uhusiano wake wa kiteolojia.
