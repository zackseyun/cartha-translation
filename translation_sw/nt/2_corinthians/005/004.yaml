id: 2CO.5.4
reference: 2 Corinthians 5:4
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ γὰρ οἱ ὄντες ἐν τῷ σκήνει στενάζομεν βαρούμενοι ἐφ’ ᾧ οὐ θέλομεν ἐκδύσασθαι ἀλλ’ ἐπενδύσασθαι, ἵνα καταποθῇ τὸ θνητὸν ὑπὸ τῆς ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/004.yaml
  text: For indeed[a], while we are in this tent, we groan, being burdened, because we do not want to be unclothed but to be further clothed[b], so that what is mortal may be swallowed up by life.
translation:
  language: sw
  text: Kwa maana sisi tulio katika hema hili tunaugua kwa kulemewa, kwa sababu hatutaki kuvuliwa, bali kuvalishwa vazi juu ya tulilo nalo[a], ili kile cha kufa[b] kimezwe na uzima.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuvikwa zaidi.” Kitenzi cha Kigiriki kinaonyesha kuvalishwa vazi la juu ya lile ambalo tayari limevaliwa.
    reason: lexical_alternative
  - marker: b
    text: Au, “hali ya kufa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σκήνει
  choice: hema
  rationale: Neno hili linahifadhi taswira ya Paulo ya maisha ya sasa ya mwili na linaunganisha mstari huu na muktadha unaozunguka.
- source_word: στενάζομεν
  choice: tunaugua
  rationale: ‘Tunaugua’ linaonyesha kwa lugha ya kawaida uzito na hamu kubwa ya wakati ujao iliyo katika kitenzi cha Kigiriki.
- source_word: βαρούμενοι
  choice: kwa kulemewa
  rationale: Linaonyesha hali au sababu inayoandamana na kuugua huku likihifadhi maana ya kutendwa.
- source_word: ἐφ’ ᾧ
  choice: kwa sababu
  rationale: Katika muktadha huu kirai hiki kinaeleweka kwa kawaida kuwa kinatanguliza sababu ya kuugua.
- source_word: ἐκδύσασθαι
  choice: kuvuliwa
  rationale: Linaendeleza sitiari ya mavazi bila kuongeza maelezo ya kimafundisho kuhusu hali inayokusudiwa.
- source_word: ἐπενδύσασθαι
  choice: kuvikwa juu yake
  rationale: Kitenzi ambatano kina wazo la kuvaa vazi jingine juu ya lile lililopo; tafsiri hii inalihifadhi wazi.
- source_word: καταποθῇ
  choice: kimezwe
  rationale: Linaendeleza taswira yenye nguvu ya kitu kushindwa na kuondolewa kabisa.
- source_word: τὸ θνητόν
  choice: kile chenye kufa
  rationale: Kivumishi cha Kigiriki kimetumiwa kama nomino; tafsiri hii inaacha rejeo lake pana kuliko kulifanya dhana dhahania tu.
- source_word: ζωῆς
  choice: uzima
  rationale: ‘Uzima’ ni neno la kawaida na lenye hadhi katika Kiswahili cha Biblia, nalo linatoa utofauti wa wazi na kile chenye kufa.
- source_word: καὶ γὰρ
  choice: Kwa maana
  rationale: Linaunganisha mstari huu na hoja iliyotangulia na kuhifadhi nguvu yake ya kutoa maelezo, bila kufanya Kiswahili kuwa kizito.
theological_decisions:
- issue: Sitiari ya mavazi na hali ya kati
  choice: Kuhifadhi lugha ya ‘kuvuliwa’ na ‘kuvikwa juu yake’ bila kutaja mfumo fulani wa kimafundisho.
  alternative: Kufafanua ‘kuvuliwa’ kuwa kuishi bila mwili, au ‘kuvikwa juu yake’ kuwa mwili wa ufufuo pekee.
  rationale: Kigiriki kinatumia sitiari kuhusu maisha ya mwili na mabadiliko yajayo. Tafsiri inahifadhi utata na mvutano huo badala ya kuamua mjadala ambao mstari wenyewe hauufafanui.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi umefanywa wa kawaida kwa wasomaji wa leo huku taswira za hema, mavazi, kumezwa, na uzima zikihifadhiwa.
