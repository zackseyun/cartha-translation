id: 2CO.5.10
reference: 2 Corinthians 5:10
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: τοὺς γὰρ πάντας ἡμᾶς φανερωθῆναι δεῖ ἔμπροσθεν τοῦ βήματος τοῦ Χριστοῦ, ἵνα κομίσηται ἕκαστος τὰ διὰ τοῦ σώματος πρὸς ἃ ἔπραξεν, εἴτε ἀγαθὸν εἴτε ⸀φαῦλον.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/010.yaml
  text: For we all must be revealed before the judgment seat of Messiah[a], so that each one may receive what is due for what he has done in the body[d][c][b], whether good or bad.
translation:
  language: sw
  text: Kwa maana ni lazima sisi sote tufunuliwe[a] mbele ya kiti cha hukumu cha Masihi,[b] ili kila mmoja apokee yanayomstahili kwa yale aliyotenda akiwa mwilini,[c] yawe mema au mabaya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “tuonekane.” Kitenzi cha Kigiriki kinaweza kumaanisha kuonekana mbele ya kiti hicho au kufunuliwa wazi; maandishi yametumia maana yenye nguvu zaidi ya kuwekwa wazi.
    reason: lexical_alternative
  - marker: b
    text: 'Kigiriki: “Kristo”; hapa limetafsiriwa “Masihi” kwa sababu Χριστός linatumika kama cheo.'
    reason: alternative_reading
  - marker: c
    text: Au, “kwa yale aliyotenda kupitia mwili.” Usemi wa Kigiriki unaweza kueleweka kuwa matendo yaliyofanywa kwa njia ya mwili katika maisha ya mtu.
    reason: lexical_alternative
lexical_decisions:
- source_word: φανερωθῆναι
  choice: tufunuliwe
  rationale: Kitenzi cha kutendwa kinaweza kumaanisha kuonekana wazi au kufichuliwa. “Tufunuliwe” kinahifadhi wazo lenye nguvu zaidi la maisha ya mtu kuwekwa wazi katika mazingira ya hukumu.
- source_word: βήματος
  choice: kiti cha hukumu
  rationale: Katika muktadha huu βῆμα ni jukwaa au kiti cha mamlaka ya kutoa hukumu; usemi huu ni wa kawaida na unaeleweka katika Kiswahili.
- source_word: Χριστοῦ
  choice: cha Masihi
  rationale: Χριστός hapa inafanya kazi kama cheo cha yule aliyetiwa mafuta; “Masihi” kinahifadhi maana hiyo ya cheo.
- source_word: κομίσηται
  choice: apokee yanayomstahili
  rationale: Kitenzi hiki katika muktadha kinaonyesha kupokea matokeo au malipo yanayolingana na matendo, bila kufafanua mapema kama ni thawabu au adhabu.
- source_word: τὰ διὰ τοῦ σώματος πρὸς ἃ ἔπραξεν
  choice: kwa yale aliyotenda akiwa mwilini
  rationale: Tafsiri hii ni ya asili katika Kiswahili na inaonyesha uwajibikaji kwa matendo ya maisha ya kimwili; tanbihi inadumisha uwezekano wa maana ya chombo katika διά, “kupitia mwili.”
- source_word: ἕκαστος
  choice: kila mmoja
  rationale: Inahifadhi msisitizo wa Kigiriki juu ya uwajibikaji wa kila mtu binafsi.
- source_word: ἀγαθὸν ... φαῦλον
  choice: mema au mabaya
  rationale: Jozi hii inatoa utofautishaji mpana wa kimaadili bila kuipa φαῦλον maana kali zaidi ya lazima kama “maovu.”
theological_decisions:
- issue: Asili na upeo wa tukio la hukumu mbele ya Masihi
  choice: Lugha ya hukumu na uwajibikaji wa wote imehifadhiwa bila kubainisha zaidi kundi linalohukumiwa au matokeo ya hukumu hiyo.
  alternative: Kuitafsiri mahsusi kuwa hukumu ya thawabu za waamini pekee, au hukumu ya mwisho ya wanadamu wote.
  rationale: Mstari unasema kwamba sisi sote tutafunuliwa na kila mmoja atapokea yanayolingana na matendo yake, lakini hauamui peke yake mifumo hiyo ya kiteolojia.
- issue: Maana ya φανερωθῆναι
  choice: tufunuliwe
  alternative: tuonekane
  rationale: Maana yenye nguvu ya kuwekwa wazi imehifadhiwa katika maandishi, huku maana nyepesi ya kufika au kuonekana ikitajwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Akiwa mwilini” limetumiwa katika maandishi kwa ufasaha wa kawaida; tanbihi inalinda muundo wa Kigiriki unaoweza kuonyesha mwili kama njia ya kutenda.
