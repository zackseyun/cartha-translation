source:
  edition: SBLGNT
  text: ὡς ὅτι θεὸς ἦν ἐν Χριστῷ κόσμον καταλλάσσων ἑαυτῷ, μὴ λογιζόμενος αὐτοῖς τὰ παραπτώματα αὐτῶν, καὶ θέμενος ἐν ἡμῖν τὸν λόγον τῆς καταλλαγῆς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/019.yaml
  text: namely[a], that God was in Messiah reconciling the world to himself, not counting their trespasses against them[d][c][b], and entrusting to us the message of reconciliation.
translation:
  language: sw
  text: yaani kwamba[a] Mungu alikuwa katika Masihi[b], akiupatanisha ulimwengu na yeye mwenyewe, bila kuwahesabia watu makosa yao, na ametia ndani yetu[c] ujumbe wa upatanisho[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “yaani, Mungu alikuwa katika Masihi akiupatanisha ulimwengu na yeye mwenyewe.”
    reason: alternative_reading
  - marker: b
    text: Muundo wa Kigiriki unaweza pia kueleweka, “Mungu alikuwa akiupatanisha ulimwengu na yeye mwenyewe kupitia Masihi.”
    reason: syntactic_ambiguity
  - marker: c
    text: Au, “miongoni mwetu” au “kwetu.”
    reason: lexical_alternative
  - marker: d
    text: Kihalisi zaidi, “neno la upatanisho.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς ὅτι
  choice: yaani kwamba
  rationale: Kirai hiki kinaanzisha ufafanuzi wa yaliyotangulia. “Yaani kwamba” ni cha kawaida katika Kiswahili na kinahifadhi nguvu yake ya kufafanua.
- source_word: θεὸς ἦν ἐν Χριστῷ
  choice: Mungu alikuwa ndani ya Masihi
  rationale: Tafsiri hii inafuata kwa karibu muundo wa Kigiriki na kuacha wazi mvutano wa maana kati ya kuwapo kwa Mungu ndani ya Masihi na kutenda kwake kupitia Masihi.
- source_word: Χριστῷ
  choice: Masihi
  rationale: Χριστός inatumika hapa kama cheo; “Masihi” huhifadhi maana ya cheo hicho kwa Kiswahili cha sasa.
- source_word: κόσμον
  choice: ulimwengu
  rationale: “Ulimwengu” ni tafsiri pana na ya kawaida, inayoweza kumaanisha wanadamu walio mbali na Mungu bila kuibana kuwa ulimwengu wa kimaumbile pekee.
- source_word: καταλλάσσων
  choice: akiupatanisha
  rationale: Kitenzi endelevu kinawasilisha tendo la Mungu la kuurejesha ulimwengu katika uhusiano wa amani naye, na kinadumisha uhusiano wa msamiati na καταλλαγή mwishoni mwa mstari.
- source_word: ἑαυτῷ
  choice: na yeye mwenyewe
  rationale: Kiwakilishi cha kujirejelea kinaonyesha kuwa upatanisho unaelekezwa kwa Mungu mwenyewe.
- source_word: μὴ λογιζόμενος
  choice: bila kuwahesabia
  rationale: “Kuhesabia” huhifadhi sitiari ya kuweka jambo katika hesabu huku ikieleweka kwa wasomaji wa kawaida.
- source_word: παραπτώματα
  choice: makosa
  rationale: “Makosa” huonyesha matendo ya kukiuka au kukosea katika muktadha wa kuvunjika kwa uhusiano; ni ya asili zaidi kwa Kiswahili kuliko istilahi nzito zaidi.
- source_word: αὐτοῖς ... αὐτῶν
  choice: watu ... yao
  rationale: Kigiriki hutumia viwakilishi vya wingi vinavyowarejelea watu wa ulimwengu. Kutaja “watu” huondoa utata wa kisarufi wa Kiswahili bila kuongeza kundi jipya.
- source_word: καὶ θέμενος
  choice: na akiweka
  rationale: “Akiweka” huhifadhi maana ya msingi ya τίθημι badala ya kuamua moja kwa moja kuwa ni ‘kukabidhi,’ ingawa maana hiyo ya kiutumishi inawezekana katika muktadha.
- source_word: ἐν ἡμῖν
  choice: ndani yetu
  rationale: Huhifadhi ἐν kwa ukaribu na kuacha wazi ikiwa maana ni ndani yetu, miongoni mwetu, au kwetu kama waliokabidhiwa.
- source_word: τὸν λόγον τῆς καταλλαγῆς
  choice: ujumbe wa upatanisho
  rationale: Katika muktadha λόγος ni habari au maudhui yanayotangazwa; “ujumbe” ni wazi katika Kiswahili cha sasa, huku “neno” likibaki kuwa uwezekano halisi.
theological_decisions:
- issue: Maana ya θεὸς ἦν ἐν Χριστῷ
  choice: Mungu alikuwa ndani ya Masihi
  alternative: Katika Masihi, Mungu alikuwa akiupatanisha ulimwengu na yeye mwenyewe; au Mungu alikuwa akiupatanisha ulimwengu na yeye mwenyewe kupitia Masihi
  rationale: Muundo wa Kigiriki unaweza kuhusisha ἐν Χριστῷ na “alikuwa” au na tendo la kupatanisha. Tafsiri kuu inabaki karibu na mpangilio wa chanzo na haibadili kimya kimya ἐν kuwa chombo pekee.
- issue: Cheo Χριστός
  choice: Masihi
  alternative: Kristo
  rationale: Hapa neno lina nguvu ya cheo cha Mtiwa-Mafuta; “Masihi” huonyesha maana hiyo badala ya kulifanya jina lisiloelezwa.
- issue: Maana ya ἐν ἡμῖν
  choice: ndani yetu
  alternative: miongoni mwetu; kwetu
  rationale: Tafsiri ya moja kwa moja huhifadhi uwezekano wa maana ya ndani au ya kijumuiya, huku tanbihi ikionyesha maana ya kukabidhi huduma kwa mitume.
- issue: Uhusiano wa kutowahesabia makosa na upatanisho
  choice: bila kuwahesabia watu makosa yao
  alternative: asiwahesabie makosa yao
  rationale: Kirai kishirikishi kinaeleza namna au hali ya tendo la Mungu la kupatanisha. Muundo wa Kiswahili unadumisha uhusiano huo bila kuufanya kauli tofauti ya kimafundisho.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imehifadhi mlolongo wa vishirikishi vya Kigiriki kwa miundo ya “aki-” ili kuonyesha kwamba Mungu ndiye mtendaji katika kupatanisha, kutowahesabia watu makosa, na kuweka ujumbe. “Ndani ya Masihi” na “ndani yetu” zimeachwa kwa ukaribu wa kimatini, huku tanbihi zikihifadhi tafsiri mbadala za kimuundo na kiidioma.
