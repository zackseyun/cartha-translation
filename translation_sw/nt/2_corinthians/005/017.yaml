base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/017.yaml
  text: So then[a], if anyone is in Messiah, there is a new creation; the old things have passed away; behold[b], new things have come.
translation:
  language: sw
  text: Kwa hiyo[a], ikiwa mtu yeyote yumo ndani ya Masihi, kuna uumbaji mpya; mambo ya zamani yamepita; tazama[b], mambo mapya yamekuja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “yeye ni kiumbe kipya.” Kigiriki hakina kitenzi hapa; kwa tafsiri ya neno kwa neno: “ikiwa mtu yeyote yumo ndani ya Masihi—uumbaji mpya.”'
    reason: alternative_reading
  - marker: b
    text: Tafsiri nyingi husoma, “mambo yote yamekuwa mapya.” Matini ya SBLGNT hapa inasema tu, “mambo mapya yamekuja,” bila neno la wazi linalomaanisha “yote.”
    reason: textual_variant
lexical_decisions:
- source_word: ὥστε
  choice: Kwa hiyo
  rationale: Inaonyesha hitimisho linalotokana na hoja iliyotangulia; ni kiunganishi cha kawaida na chenye hadhi katika Kiswahili.
- source_word: εἴ τις
  choice: ikiwa mtu yeyote
  rationale: Hudumisha sharti lisilombagua mtu na haliingizi umaalumu wa kijinsia usiokuwapo katika Kigiriki.
- source_word: ἐν Χριστῷ
  choice: yumo ndani ya Masihi
  rationale: “Masihi” hutafsiri cheo Χριστός, na “yumo ndani ya” huhifadhi lugha ya Paulo kuhusu kuwa katika umoja na Masihi.
- source_word: καινὴ κτίσις
  choice: kuna uumbaji mpya
  rationale: Kifungu cha Kigiriki hakina kitenzi. “Kuna” hudumisha usemi mpana kuhusu uumbaji mpya bila kuulazimisha kumaanisha mtu binafsi pekee.
- source_word: τὰ ἀρχαῖα
  choice: mambo ya kale
  rationale: Kivumishi cha wingi kisicho na nomino kimetumiwa kama nomino; tafsiri hii huhifadhi wingi na upeo wake mpana.
- source_word: παρῆλθεν
  choice: yamepita
  rationale: Hutoa kwa Kiswahili hali ya mambo ya zamani kuondoka na matokeo yake kuendelea kuwapo katika muktadha.
- source_word: ἰδοὺ
  choice: tazama
  rationale: Ni mwito wa kawaida wa kibiblia wa kuelekeza fikira kwenye matokeo yanayotangazwa.
- source_word: γέγονεν καινά
  choice: mambo mapya yamekuja
  rationale: Huhifadhi wingi wa καινά na matokeo ya sasa ya tendo lililotimia, bila kuongeza neno “yote” lisilokuwapo katika matini ya SBLGNT.
theological_decisions:
- issue: Kutafsiri Χριστῷ kama cheo au kama jina
  choice: ndani ya Masihi
  alternative: katika Kristo
  rationale: Χριστός ni cheo chenye maana ya Masihi; kukitafsiri huhifadhi umuhimu wake wa Kimasihi katika usemi wa Paulo.
- issue: Jinsi ya kueleza kifungu kisicho na kitenzi καινὴ κτίσις
  choice: kuna uumbaji mpya
  alternative: yeye ni kiumbe kipya
  rationale: Kigiriki kinaweza kutangaza uumbaji mpya kwa upana au kueleweka kuwa kinamhusu mtu huyo. Matini kuu haifungi maana katika mtu binafsi pekee, huku usomaji huo ukihifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wazi kwa wasomaji wa kawaida, huku ukihifadhi ufupi, utata halisi wa καινὴ κτίσις, na tofauti ya matini mwishoni mwa mstari.
