  text: Therefore we also make it our ambition[a], whether at home or away, to be pleasing to him.
translation:
  language: sw
  text: Kwa hiyo, pia tunajitahidi kumpendeza, iwe tuko nyumbani au mbali na nyumbani.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa ufafanuzi zaidi kutokana na muktadha, “iwe tuko nyumbani katika mwili au mbali na mwili.”
    reason: alternative_reading
lexical_decisions:
- source_word: διὸ
  choice: Kwa hiyo
  rationale: Inaonyesha hitimisho linalotokana na maelezo yaliyotangulia kuhusu maisha ya sasa katika mwili na kuwa pamoja na Bwana.
- source_word: καὶ
  choice: pia
  rationale: Inadumisha wazo la nyongeza na mwendelezo bila kulitia mkazo kupita kiasi.
- source_word: φιλοτιμούμεθα
  choice: tunafanya kuwa lengo letu
  rationale: Kitenzi kinaonyesha kujitahidi kwa bidii na kwa kusudi; usemi huu ni wa kawaida na unaeleweka katika Kiswahili cha sasa.
- source_word: εἴτε ἐνδημοῦντες εἴτε ἐκδημοῦντες
  choice: iwe tuko nyumbani au mbali na nyumbani
  rationale: Inahifadhi taswira na ufupi wa Kigiriki wa kuwa nyumbani au kutokuwapo nyumbani, huku muktadha ukifafanua kwamba kinachozungumziwa ni mwili.
- source_word: εὐάρεστοι
  choice: kumpendeza
  rationale: Inawasilisha kwa lugha ya kawaida hali ya kukubalika na kuwa wa kupendeza kwake.
- source_word: αὐτῷ
  choice: yeye
  rationale: Kiwakilishi kinarejelea Bwana aliyetajwa katika muktadha; hakibadilishwi kuwa nomino wazi katika matini kuu.
- source_word: εἶναι
  choice: kumpendeza yeye
  rationale: Kiswahili huunganisha wazo la ‘kuwa wa kumpendeza’ kwa kawaida katika kitenzi ‘kumpendeza,’ ambacho kinakamilisha lengo la jitihada hiyo.
theological_decisions:
- issue: Iwapo kufafanua katika matini kuu kinachodokezwa na ‘nyumbani’ na ‘mbali na nyumbani’
  choice: Kuhifadhi usemi mfupi ‘iwe tuko nyumbani au mbali na nyumbani’ katika matini kuu
  alternative: iwe tuko nyumbani katika mwili au mbali na mwili
  rationale: Muktadha wa karibu unaonyesha wazi kwamba Paulo anazungumzia kuwa katika mwili au kuwa mbali nao, lakini mstari huu wenyewe hautaji virai hivyo wazi. Tanbihi inaeleza maana ya kimuktadha bila kuongeza maneno hayo katika matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Usemi ‘tunafanya kuwa lengo letu’ unaonyesha nia thabiti bila kutumia lugha nzito; taswira ya nyumbani na mbali na nyumbani imehifadhiwa.
