base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/001.yaml
  text: For we know that if our earthly tent-house is torn down[a], we have a building from God, a house not made with hands[d][c][b], eternal in the heavens.
translation:
  language: sw
  text: Kwa maana tunajua kwamba ikiwa nyumba yetu ya kidunia, ambayo ni hema, ikibomolewa,[a] tuna jengo litokalo kwa Mungu—nyumba isiyofanywa kwa mikono ya wanadamu,[b] ya milele mbinguni.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, «ikivunjwa» au «ikiharibiwa». Kitenzi cha Kigiriki kinaweza kumaanisha kubomoa jengo au kulivunja hema.
    reason: lexical_alternative
  - marker: b
    text: Kwa tafsiri ya neno kwa neno, «isiyofanywa kwa mikono». Usemi huu unasisitiza kwamba nyumba hiyo ni ya asili ya Mungu, si kazi ya binadamu.
    reason: lexical_alternative
  - marker: c
    text: Kigiriki kinasema «tuna», si «tutakuwa na», na hivyo kinaacha mvutano kati ya kuwa navyo sasa na kutimizwa kwake wakati ujao.
    reason: alternative_reading
lexical_decisions:
- source_word: Οἴδαμεν γὰρ
  choice: Kwa maana tunajua
  rationale: «Tunajua» huonyesha ujuzi thabiti, na «kwa maana» huhifadhi uhusiano wa maelezo na hoja iliyotangulia.
- source_word: ἐὰν ... καταλυθῇ
  choice: ikibomolewa
  rationale: Muundo huu unaonyesha uwezekano wa wakati ujao. «Kubomolewa» hufaa kwa nyumba na pia hudumisha picha ya hema linaloweza kuvunjwa.
- source_word: ἡ ἐπίγειος ἡμῶν οἰκία τοῦ σκήνους
  choice: nyumba yetu ya kidunia, yaani hema hili
  rationale: Tafsiri inadumisha picha zote mbili, nyumba na hema, bila kuzibadilisha moja kwa moja kuwa «mwili». «Yaani» hapa inaweka hema katika apposition na nyumba kwa Kiswahili cha kawaida.
- source_word: οἰκοδομὴν ἐκ θεοῦ
  choice: jengo litokalo kwa Mungu
  rationale: «Jengo» linaeleza οἰκοδομή kama kitu halisi, huku «litokalo kwa Mungu» likihifadhi maana ya asili katika ἐκ θεοῦ bila kuigeuza kuwa umilikaji tu.
- source_word: ἔχομεν
  choice: tuna
  rationale: Wakati uliopo wa Kigiriki umehifadhiwa, badala ya kuubadilisha kuwa «tutakuwa na», ili kutatua mapema mvutano kati ya umilikaji wa sasa na utimilifu wa baadaye.
- source_word: οἰκίαν ἀχειροποίητον
  choice: nyumba isiyofanywa kwa mikono ya wanadamu
  rationale: Usemi huu unaweka wazi kwamba asili yake si kazi ya binadamu na unahifadhi mwangwi wa kibiblia wa ἀχειροποίητος kwa Kiswahili kinachoeleweka.
- source_word: αἰώνιον ἐν τοῖς οὐρανοῖς
  choice: ya milele mbinguni
  rationale: «Ya milele» huonyesha tofauti na makao ya kidunia yanayopita. «Mbinguni» ni usemi wa kawaida wa Kiswahili na umbo lake tayari lina asili ya wingi, hivyo linafaa kwa οὐρανοῖς.
theological_decisions:
- issue: Kirejelewa cha picha za nyumba na hema
  choice: Kudumisha picha za nyumba, hema, na jengo katika andiko kuu
  alternative: Kutafsiri moja kwa moja kuwa «mwili wetu wa kidunia»
  rationale: Paulo anaunganisha kwa makusudi picha za nyumba, hema, jengo, na nyumba isiyofanywa kwa mikono. Kutaja «mwili» moja kwa moja kungetatua maana ya sitiari badala ya kuihifadhi.
- issue: Nguvu ya wakati katika ἔχομεν
  choice: «tuna»
  alternative: «tutakuwa na»
  rationale: Kitenzi cha Kigiriki kiko katika wakati uliopo. Tafsiri inadumisha mvutano wa kiteolojia kati ya kuwa navyo sasa na kutimizwa kwake baadaye.
- issue: Maana ya ἀχειροποίητον
  choice: «isiyofanywa kwa mikono ya wanadamu»
  alternative: «isiyofanywa kwa mikono»
  rationale: Kuongeza «ya wanadamu» kunafanya maana iwe ya asili katika Kiswahili bila kudokeza kwamba nyumba hiyo haikufanywa kabisa; chanzo chake ni Mungu, si kazi ya binadamu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo «yaani hema hili» huepuka kiambatano kisicho cha kawaida kama «nyumba-hema» huku ukihifadhi picha zote mbili za Kigiriki. Alama zote za tanbihi zimewekwa katika andiko kuu.
