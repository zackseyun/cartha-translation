  text: ⸀τὸν μὴ γνόντα ἁμαρτίαν ὑπὲρ ἡμῶν ἁμαρτίαν ἐποίησεν, ἵνα ἡμεῖς γενώμεθα δικαιοσύνη θεοῦ ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/021.yaml
  text: He made the one who did not know sin to be sin for us[b][a], so that in him we might become the righteousness of God.
translation:
  language: sw
  text: Yeye ambaye hakujua dhambi, Mungu alimfanya kuwa dhambi kwa ajili yetu[a], ili katika yeye sisi tupate kuwa haki ya Mungu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuwa dhabihu ya dhambi.” Kigiriki kinasema “dhambi” katika sehemu zote mbili; baadhi ya watu hulielewa matumizi ya pili katika maana ya kidhabihu.
    reason: alternative_reading
  - marker: b
    text: Au, “uadilifu wa Mungu” au “haki itokayo kwa Mungu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸν μὴ γνόντα ἁμαρτίαν
  choice: yeye ambaye hakujua dhambi
  rationale: ‘Hakujua dhambi’ huhifadhi nahau iliyobanwa ya Kigiriki na kutoshiriki kwake Kristo katika dhambi, bila kuipanua moja kwa moja kuwa ‘hakutenda dhambi.’
- source_word: ὑπὲρ ἡμῶν
  choice: kwa ajili yetu
  rationale: Huhifadhi maana pana ya kutenda kwa faida au kwa niaba yetu bila kuamua mapema mtazamo fulani wa upatanisho.
- source_word: ἁμαρτίαν (second occurrence)
  choice: dhambi
  rationale: Neno lilelile la Kigiriki limetumiwa mara zote mbili. Kurudia ‘dhambi’ huhifadhi usemi mkali wa Paulo; maana inayowezekana ya ‘dhabihu ya dhambi’ imewekwa katika tanbihi.
- source_word: ἐποίησεν
  choice: alimfanya kuwa
  rationale: Muundo huu wa Kiswahili unaonyesha tendo la Mungu na kukamilisha kisarufi kirai ‘kuwa dhambi,’ bila kufafanua zaidi namna ya tendo hilo.
- source_word: ἵνα ἡμεῖς γενώμεθα
  choice: ili ... sisi tupate kuwa
  rationale: ‘Ili’ huonyesha kusudi, na ‘tupate kuwa’ huwakilisha hali ya uwezekano/kusudi ya γενώμεθα pamoja na msisitizo wa ἡμεῖς.
- source_word: δικαιοσύνη θεοῦ
  choice: haki ya Mungu
  rationale: ‘Haki’ ni neno la kawaida na lenye heshima kwa δικαιοσύνη. ‘Ya Mungu’ huacha wazi uhusiano wa kimahusiano wa Kigiriki badala ya kuamua kama ni haki inayotoka kwa Mungu, haki yake mwenyewe, au hadhi mbele zake.
- source_word: ἐν αὐτῷ
  choice: ndani yake
  rationale: Huhifadhi usemi muhimu wa Paulo kwa ufupi bila kuupanua kiufafanuzi kuwa ‘katika muungano naye.’
theological_decisions:
- issue: Maana ya ‘alimfanya kuwa dhambi’
  choice: Usemi wa chanzo umehifadhiwa bila kumaanisha kwamba Kristo akawa mwenye dhambi kimaadili.
  alternative: ‘Alimfanya kuwa dhabihu ya dhambi.’
  rationale: Kifungu chenyewe kwanza kinathibitisha kwamba hakujua dhambi. Tafsiri kuu huhifadhi mvutano wa usemi wa Paulo, huku tanbihi ikionyesha uwezekano wa maana ya kidhabihu.
- issue: Maana ya ‘δικαιοσύνη θεοῦ’
  choice: ‘Haki ya Mungu,’ bila kuamua aina ya uhusiano unaoonyeshwa na ‘ya.’
  alternative: ‘Haki itokayo kwa Mungu’ au ‘uadilifu wa Mungu.’
  rationale: Kirai hicho kina maana nyingi zinazojadiliwa. Muundo rasmi huacha wazi ikiwa ni haki ya Mungu mwenyewe, haki inayotoka kwake, au hali ya kuwa sawa mbele zake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Mpangilio umetengenezwa ili Mungu atajwe wazi kama mtendaji wa ἐποίησεν, huku muundo uliobanwa na utata halisi wa Kigiriki vikihifadhiwa.
