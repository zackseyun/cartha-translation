  text: διὰ πίστεως γὰρ περιπατοῦμεν, οὐ διὰ εἴδους—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/007.yaml
  text: For we walk by faith[a], not by sight—
translation:
  language: sw
  text: Kwa maana tunaenenda kwa imani, si kwa kuona[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “si kwa mwonekano” au “si kwa kile kinachoonekana.” Neno la Kigiriki linaweza kumaanisha sura au mwonekano unaoonekana; “kuona” limetumiwa ili kuhifadhi mkabala na “imani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ πίστεως
  choice: kwa imani
  rationale: διά pamoja na hali ya umilikishi huonyesha njia au namna; “kwa imani” ni Kiswahili cha kawaida na huhifadhi mkabala mfupi na “si kwa kuona.”
- source_word: γὰρ
  choice: Kwa maana
  rationale: γάρ inaeleza msingi wa kauli inayotangulia; “kwa maana” huhifadhi uhusiano huo wa maelezo bila kuifanya sentensi kuwa sababu iliyoelezwa kupita kiasi.
- source_word: περιπατοῦμεν
  choice: tunaenenda
  rationale: Kitenzi hiki humaanisha kihalisi kutembea, na kwa njia ya sitiari mwenendo wa maisha. “Tunaenenda” huhifadhi taswira hiyo kwa lugha yenye hadhi na inayoeleweka.
- source_word: οὐ διὰ εἴδους
  choice: si kwa kuona
  rationale: εἶδος inaweza kumaanisha sura inayoonekana, mwonekano, au kile kinachoonekana. “Si kwa kuona” ni kauli fupi ya asili inayohifadhi mkabala na imani, huku uwezekano mwingine ukibainishwa katika tanbihi.
theological_decisions:
- issue: Maana ya πίστις katika mkabala huu wa Paulo
  choice: imani
  alternative: kutumaini; uaminifu
  rationale: Katika mkabala na εἶδος, “imani” inaeleweka zaidi kuwa kumtegemea Mungu pasipo kuongozwa na yanayoonekana. “Uaminifu” unawezekana katika matumizi mengine ya πίστις, lakini hapa si chaguo lenye nguvu zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Tunaenenda” huhifadhi sitiari ya kutembea bila kutumia paraphrase pana kama “tunaishi.” Alama ya mwisho ya mkwaju imehifadhiwa kwa kuwa mstari unaendelea kisintaksia katika muktadha.
