base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/005.yaml
  text: The one who prepared us for this very thing is God[b][a], who gave us the down payment of the Spirit.
translation:
  language: sw
  text: Yeye aliyetutayarisha kwa ajili ya jambo hili hasa ni Mungu, ambaye ametupa malipo ya awali[a] ya Roho[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “dhamana,” “amana,” au “sehemu ya kwanza ya malipo.”
    reason: lexical_alternative
  - marker: b
    text: Kirai hiki kinaweza kumaanisha kwamba Roho mwenyewe ndiye malipo ya awali, au kwamba Mungu ametoa malipo ya awali yanayohakikisha yale ambayo Roho atayakamilisha.
    reason: alternative_reading
lexical_decisions:
- source_word: κατεργασάμενος
  choice: aliyetutayarisha
  rationale: Katika muktadha huu kitenzi kinaeleza kazi ya Mungu ya kuwaandaa waamini kwa hali ya baadaye iliyotajwa katika mistari 1–4; ‘aliyetutayarisha’ ni ya asili na huhifadhi kusudi hilo.
- source_word: εἰς αὐτὸ τοῦτο
  choice: kwa ajili ya jambo hili hili
  rationale: Huhifadhi msisitizo wa Kigiriki unaorejelea jambo lile hasa lililozungumziwa katika muktadha uliotangulia.
- source_word: θεός
  choice: Mungu ndiye
  rationale: Mungu anatambulishwa kwa msisitizo kuwa ndiye aliyetutayarisha.
- source_word: δοὺς
  choice: naye alitupa
  rationale: Kirai shiriki cha aoristi kimetolewa kama kishazi kinachoratibiwa, ambacho ni cha kawaida katika Kiswahili na huonyesha tendo la Mungu la kutoa.
- source_word: ἀρραβῶνα
  choice: amana
  rationale: ‘Amana’ inaweza kuonyesha kitu kilichotolewa kama uthibitisho au dhamana ya yatakayokamilishwa baadaye; tanbihi inafafanua sitiari ya malipo ya kwanza.
- source_word: τοῦ πνεύματος
  choice: ya Roho
  rationale: Muundo wa ‘ya Roho’ huhifadhi uhusiano wa kijeni wa Kigiriki bila kuamua kimyakimya ikiwa Roho mwenyewe ndiye amana au amana hiyo inahusishwa naye kwa namna nyingine.
- source_word: δὲ
  choice: Naye
  rationale: δέ ni kiunganishi chepesi cha kuendeleza hoja. ‘Naye’ huunganisha sentensi na muktadha bila kuingiza wazo la wakati lisilokuwapo katika chanzo.
theological_decisions:
- issue: Maana ya ‘amana ya Roho’
  choice: Main text preserves the phrase ‘amana ya Roho,’ allowing the likely sense that the Holy Spirit himself is the present pledge of future completion.
  alternative: Amana inaweza kueleweka kuwa kitu ambacho Mungu ametoa ili kuhakikisha yale ambayo Roho atayakamilisha.
  rationale: Matumizi mengine ya Paulo yanaelekeza kwa Roho mwenyewe kuwa amana (2 Kor 1:22; Efe 1:13–14), lakini muundo wa kijeni haupaswi kufafanuliwa kupita kiasi katika matini kuu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Jambo hili hili’ huhifadhi msisitizo wa chanzo; ‘amana’ ni fupi na inaeleweka, huku tanbihi zikifafanua sitiari ya kibiashara na utata wa kisarufi.
