  text: ikiwa kweli[a], baada ya kujivika, hatutakutwa uchi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ikiwa kweli, baada ya kuvaa, hatutakutwa bila vazi.”
    reason: Mbadala huu hutumia “kuvaa” badala ya “kujivika” na “bila vazi” badala ya “uchi,” huku ukihifadhi sitiari na bila kuongeza kitu kisichotajwa katika Kigiriki.
lexical_decisions:
- source_word: εἴ γε
  choice: ikiwa kweli
  rationale: Huhifadhi hali ya sharti ya εἰ pamoja na msisitizo wa γε bila kuigeuza kuwa kauli ya uhakika.
- source_word: καὶ
  choice: baada ya
  rationale: Katika muundo huu inaunganisha tendo la kishirikishi na kitenzi cha wakati ujao; Kiswahili cha 'baada ya' kinaonyesha kwa kawaida kwamba kujivika kunatangulia kupatikana.
- source_word: ἐνδυσάμενοι
  choice: kujivika
  rationale: Kishirikishi cha aoristi katika hali ya kati humaanisha kihalisi 'baada ya kujivika'; chaguo hili linadumisha sitiari ya mavazi na sauti ya kati.
- source_word: οὐ
  choice: hatu-
  rationale: Ukanushi umeunganishwa kwa kawaida na kitenzi cha Kiswahili.
- source_word: γυμνοὶ
  choice: uchi
  rationale: Ni tafsiri ya moja kwa moja inayohifadhi sitiari ya Paulo bila kufafanua maana yake ya kiteolojia.
- source_word: εὑρεθησόμεθα
  choice: hatutakutwa
  rationale: Huhifadhi wakati ujao na hali ya kutendwa ya kitenzi, kwa Kiswahili cha kawaida na chenye hadhi.
theological_decisions:
- issue: Maana ya sitiari ya kujivika na kuwa uchi
  choice: Sitiari imehifadhiwa bila kufafanuliwa zaidi.
  alternative: Kuitafsiri 'uchi' kuwa hali ya kutokuwa na mwili, kukosa makao/mwili wa mbinguni, au aibu mbele za Mungu.
  rationale: Aya yenyewe haitaji wazi maana kamili ya sitiari; kuitafsiri moja kwa moja kunahifadhi utata na mvutano wa kiteolojia wa matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Kujivika' ni cha kimaandiko lakini kinaeleweka, na kinahifadhi hali ya kati ya Kigiriki pamoja na picha ya mavazi.
