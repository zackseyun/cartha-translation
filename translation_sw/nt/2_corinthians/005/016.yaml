base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/016.yaml
  text: So from now on we regard no one according to the flesh[a]. Even if we have known Messiah according to the flesh[b], yet now we no longer know him that way.
translation:
  language: sw
  text: Kwa hiyo, tangu sasa hatumtambui mtu yeyote kwa jinsi ya mwili[a]. Hata ikiwa tumemjua Masihi[b] kwa jinsi ya mwili, sasa hatumjui hivyo tena.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa mtazamo wa kibinadamu” au “kwa viwango vya kidunia.” Neno kwa neno ni “kwa jinsi ya mwili.”
    reason: lexical_alternative
  - marker: b
    text: Kigiriki “Christon,” yaani “Masihi”; kwa mapokeo hutafsiriwa pia “Kristo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὥστε
  choice: Kwa hiyo
  rationale: Kiunganishi hiki kinaonyesha hitimisho linalotokana na hoja iliyotangulia; “Kwa hiyo” ni Kiswahili cha kawaida na huhifadhi uhusiano huo wa kimantiki.
- source_word: ἀπὸ τοῦ νῦν
  choice: tangu sasa
  rationale: Ni usemi wa wakati unaoonyesha mabadiliko yanayoanza sasa na kuendelea mbele.
- source_word: οὐδένα
  choice: mtu yeyote (katika sentensi hasi)
  rationale: Pamoja na kitenzi hasi “hatumwangalii,” usemi huu kwa kawaida humaanisha “hakuna mtu.”
- source_word: οἴδαμεν
  choice: hatumwangalii
  rationale: Ingawa kitenzi kwa msingi humaanisha “kujua,” hapa muungano wake na κατὰ σάρκα unaelekea kwenye namna ya kumwona au kumthamini mtu. “Kumwangalia” ni ya asili katika Kiswahili na bado hairuhusu ufafanuzi mmoja tu wa tathmini hiyo.
- source_word: κατὰ σάρκα
  choice: kwa jinsi ya mwili
  rationale: Huhifadhi neno muhimu la Paulo “mwili” na mvutano wake wa kitheolojia, badala ya kulifafanua moja kwa moja kuwa “kwa viwango vya kidunia” au “kwa mtazamo wa kibinadamu.”
- source_word: εἰ καὶ
  choice: Hata ikiwa
  rationale: Huhifadhi umbo la masharti lenye nguvu ya kukubali hoja, bila kulazimisha maana ya “ingawa” kana kwamba jambo hilo limethibitishwa waziwazi.
- source_word: ἐγνώκαμεν
  choice: tulimjua
  rationale: Ni kitenzi cha wakati uliopita kinachoeleza namna ya awali ya kumjua Masihi; Kiswahili rahisi hakihitaji muundo mzito ili kuwasilisha wakati huo.
- source_word: Χριστόν
  choice: Masihi
  rationale: Χριστός ni cheo chenye maana ya Mtiwa-Mafuta; “Masihi” huhifadhi maana ya cheo hicho badala ya kukifanya jina lisiloelezwa.
- source_word: ἀλλὰ νῦν οὐκέτι γινώσκομεν
  choice: sasa hatumjui hivyo tena
  rationale: Huhifadhi tofauti kali kati ya hali ya zamani na ya sasa, huku “hivyo” ikirejelea wazi namna ya kumjua iliyotajwa awali.
theological_decisions:
- issue: Maana ya κατὰ σάρκα kuhusu watu na Masihi
  choice: kwa jinsi ya mwili
  alternative: kwa mtazamo wa kibinadamu; kwa viwango vya kidunia
  rationale: Tafsiri hii huweka wazi istilahi ya Paulo na kutoharakisha kuamua ikiwa anazungumzia mtazamo wa kibinadamu, viwango vya kidunia, au hali ya nje. Haisemi kwamba ubinadamu halisi wa Masihi umekanushwa; kinachobadilika ni namna ya kumjua au kumtazama.
- issue: Maana ya εἰ καὶ
  choice: Hata ikiwa
  alternative: Ingawa; hata kama
  rationale: Muundo wa Kigiriki unaweza kusomwa kwa nguvu ya masharti au ya kukubali ukweli. “Hata ikiwa” huhifadhi kiasi cha utata huo badala ya kuufunga kabisa.
- issue: Uwasilishaji wa Χριστός
  choice: Masihi
  alternative: Kristo
  rationale: Katika muktadha huu neno linafanya kazi kama cheo cha Yesu. “Masihi” huwasilisha maana ya cheo bila kuingiza msimamo wa dhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “kwa jinsi ya mwili” umehifadhiwa kwa makusudi kwa sababu ni istilahi muhimu ya Paulo; tanbihi hutoa maana mbadala zilizo wazi zaidi. “Hatumwangalii” ni ya kawaida zaidi kuliko “hatumhesabu” na inafaa kwa wazo la namna ya kumwona au kumthamini mtu.
