  to: 'Kwa hiyo, sisi ni mabalozi kwa niaba ya Masihi[a], kana kwamba Mungu anawasihi kupitia kwetu. Tunawasihi kwa niaba ya Masihi: mpatanishwe na Mungu.[b]'
