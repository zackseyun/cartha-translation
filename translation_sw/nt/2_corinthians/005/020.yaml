source:
  edition: SBLGNT
  text: ὑπὲρ Χριστοῦ οὖν πρεσβεύομεν ὡς τοῦ θεοῦ παρακαλοῦντος δι’ ἡμῶν· δεόμεθα ὑπὲρ Χριστοῦ, καταλλάγητε τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/020.yaml
  text: 'Therefore[a], we are ambassadors for the Messiah, as though God were appealing through us[b]. We beg you on behalf of the Messiah: be reconciled to God.'
translation:
  language: sw
  text: 'Kwa hiyo, sisi ni mabalozi kwa niaba ya Masihi[a], kana kwamba Mungu anawasihi kupitia kwetu. Tunawasihi kwa niaba ya Masihi: mpatanishwe na Mungu.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kristo.” Neno la Kigiriki Χριστός ni cheo chenye maana ya “Masihi,” yaani, Mtiwa-Mafuta.
    reason: alternative_reading
  - marker: b
    text: Au, “kwa Mungu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ Χριστοῦ
  choice: kwa niaba ya Masihi
  rationale: ὑπέρ pamoja na nomino katika hali ya genitive hapa ina maana ya uwakilishi, ‘kwa ajili ya’ au ‘kwa niaba ya.’ ‘Kwa niaba ya’ inaonyesha wazi kazi ya mabalozi. Χριστός imetafsiriwa ‘Masihi’ ili kuhifadhi maana yake kama cheo.
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Kiunganishi hiki kinaonyesha hitimisho linalotokana na maelezo yaliyotangulia kuhusu upatanisho.
- source_word: πρεσβεύομεν
  choice: sisi ni mabalozi
  rationale: Kitenzi hiki humaanisha kutenda kama balozi au mjumbe rasmi. Usemi huu ni wa kawaida na unaeleweka katika Kiswahili cha sasa.
- source_word: ὡς
  choice: kana kwamba
  rationale: 'Huhifadhi nguvu ya ulinganisho: huduma yao inaelezwa kana kwamba Mungu mwenyewe anatoa wito kupitia kwao.'
- source_word: παρακαλοῦντος
  choice: anatoa wito
  rationale: παρακαλέω hapa ni kusihi, kuhimiza, au kutoa mwito. ‘Anatoa wito’ inafaa kwa muktadha wa mwaliko wa upatanisho bila kufanya sauti iwe kali kupita kiasi.
- source_word: δι’ ἡμῶν
  choice: kupitia kwetu
  rationale: διά pamoja na genitive huonyesha njia au wakala; Mungu ndiye anayetoa wito kwa kuwatumia mitume.
- source_word: δεόμεθα
  choice: Tunawasihi
  rationale: Kitenzi hiki huonyesha ombi la dhati na la haraka. Kiambishi ‘-wa-’ kinaweka wazi walengwa wanaodokezwa na muktadha.
- source_word: καταλλάγητε
  choice: mpatanishwe
  rationale: Umbo la amri la kutendwa limehifadhiwa, hivyo tafsiri haisuluhishi kimyakimya mvutano kati ya tendo la Mungu na wajibu wa wasikilizaji kuitikia.
- source_word: τῷ θεῷ
  choice: na Mungu
  rationale: Baada ya καταλλάσσω, dative huonyesha mhusika ambaye upatanisho unamhusu. ‘Na Mungu’ ndiyo Kiswahili cha kawaida na cha asili kwa uhusiano huo.
theological_decisions:
- issue: Tafsiri ya Χριστοῦ
  choice: Masihi
  alternative: Kristo
  rationale: Neno hili linafanya kazi kama cheo, kwa hiyo ‘Masihi’ huhifadhi maana yake. ‘Kristo’ limetolewa katika tanbihi kwa sababu ni umbo lililozoeleka sana katika mapokeo ya Kikristo ya Kiswahili.
- issue: Sauti na utendaji katika upatanisho
  choice: mpatanishwe na Mungu
  alternative: muwe na upatanisho na Mungu
  rationale: 'Umbo la kutendwa linahifadhi amri ya Kigiriki na mvutano wa kiteolojia: Mungu anatoa wito kupitia wajumbe, lakini wasikilizaji wanaamriwa wapatanishwe. Tafsiri mbadala ya hali ingeweza kufifisha umbo hilo la kutendwa.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Mabalozi,’ ‘kwa niaba ya,’ na ‘tunawasihi’ huwasilisha uwakilishi na uzito wa ombi bila kutumia lugha ya kizamani. Alama zote za tanbihi zimewekwa katika matini kuu.
