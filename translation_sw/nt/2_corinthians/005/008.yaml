  yaml_path: translation/nt/2_corinthians/005/008.yaml
  text: So we are confident and would rather be away from the body and at home with the Lord[a].
translation:
  language: sw
  text: Basi tuna ujasiri, na tunapendelea zaidi kuwa mbali na mwili na kuwa nyumbani pamoja na Bwana.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutokuwapo katika mwili na kuwapo pamoja na Bwana.”
    reason: Mbadala huu unaonyesha maana inayowezekana ya vitenzi vya kisitiari ἐκδημῆσαι na ἐνδημῆσαι kama kutokuwapo na kuwapo.
lexical_decisions:
- source_word: θαρροῦμεν
  choice: tuna ujasiri
  rationale: Kitenzi cha wakati uliopo kinaonyesha ujasiri unaoendelea; usemi huu ni wa kawaida na wenye hadhi katika Kiswahili cha sasa.
- source_word: δὲ
  choice: Kwa hiyo
  rationale: Hapa kiunganishi kinaendeleza hitimisho linalotokana na hoja ya mistari iliyotangulia kuliko kuonyesha upinzani mkali.
- source_word: εὐδοκοῦμεν μᾶλλον
  choice: tungependa zaidi
  rationale: Muungano huu unaonyesha kupendelea hali moja kuliko nyingine. Tafsiri hii huhifadhi maana ya hiari na ulinganisho bila kuongeza maelezo.
- source_word: ἐκδημῆσαι ἐκ τοῦ σώματος
  choice: kuwa mbali na mwili
  rationale: Huhifadhi sitiari ya kuwa ugenini au mbali na makao, huku σώματος ikitafsiriwa moja kwa moja kuwa ‘mwili.’
- source_word: ἐνδημῆσαι πρὸς τὸν κύριον
  choice: kuwa nyumbani pamoja na Bwana
  rationale: Huhifadhi ulinganifu wa kisitiari na ἐκδημῆσαι; ‘pamoja na Bwana’ huonyesha uwepo na ushirika unaokusudiwa na πρός katika muktadha huu.
theological_decisions:
- issue: Iwapo lugha ya Paulo ifafanuliwe wazi kuwa fundisho kuhusu hali baada ya kifo
  choice: Kudumisha sitiari ya kuwa mbali na mwili na kuwa nyumbani pamoja na Bwana
  alternative: Kufafanua kuwa ‘kufa na kwenda mbinguni kuwa pamoja na Bwana’
  rationale: Mstari unaashiria kuwapo pamoja na Bwana baada ya kuondoka mwilini, lakini maneno ‘kufa’ na ‘mbinguni’ hayapo katika Kigiriki. Kutoyaongeza kunahifadhi usahihi na mvutano wa kitheolojia wa maandiko.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima, na kinachoeleweka kwa wasomaji wa kawaida. Sitiari ya makao imehifadhiwa bila kuifanya aya iseme kwa wazi zaidi ya Kigiriki.
