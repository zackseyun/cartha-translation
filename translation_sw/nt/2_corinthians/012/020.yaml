id: 2CO.12.20
reference: 2 Corinthians 12:20
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: φοβοῦμαι γὰρ μή πως ἐλθὼν οὐχ οἵους θέλω εὕρω ὑμᾶς, κἀγὼ εὑρεθῶ ὑμῖν οἷον οὐ θέλετε, μή πως ⸀ἔρις, ⸀ζῆλος, θυμοί, ἐριθεῖαι, καταλαλιαί, ψιθυρισμοί, φυσιώσεις, ἀκαταστασίαι·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/020.yaml
  text: For I fear that perhaps when I come I may find you not as I wish[a], and I may be found by you to be as you do not wish—that perhaps there may be strife, jealousy, outbursts of anger, selfish ambition, slanders, whisperings, conceit, and disorder.
translation:
  language: sw
  text: Maana ninaogopa kwamba huenda nitakapokuja niwakute si vile ninavyotaka, nanyi mkanikuta nikiwa vile msivyotaka; kwamba huenda kukawa na ugomvi, wivu, milipuko ya hasira, tamaa za ubinafsi, maneno ya kashfa, minong'ono[a], majivuno, na machafuko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “masengenyo.”
    reason: Neno la Kigiriki linaweza kumaanisha maneno ya siri ya kuwahusu wengine, yaani masengenyo.
lexical_decisions:
- source_word: φοβοῦμαι
  choice: ninaogopa
  rationale: Kitenzi cha wakati uliopo kinaonyesha hofu au wasiwasi unaoendelea wa Paulo; ‘ninaogopa’ ni cha moja kwa moja na cha kawaida.
- source_word: μή πως
  choice: kwamba huenda
  rationale: Usemi huu, unaorudiwa mara mbili, unaanzisha jambo linalowezekana ambalo Paulo analiogopa bila kulionyesha kuwa hakika.
- source_word: ἐλθὼν
  choice: nitakapokuja
  rationale: Kirai shiriki kinafanya kazi ya wakati katika muktadha huu; ‘nitakapokuja’ kinaonyesha kwa kawaida wakati wa tukio linalotarajiwa.
- source_word: οὐχ οἵους θέλω
  choice: mkiwa vile ninavyotaka
  rationale: Muundo huu unahusu hali au mwenendo ambao Paulo anatumaini kuwakuta nao Wakorintho.
- source_word: εὕρω ὑμᾶς
  choice: nisiwakute
  rationale: Huhifadhi wazo la kuwakuta katika hali fulani ndani ya uwezekano unaoogopwa.
- source_word: κἀγὼ εὑρεθῶ ὑμῖν
  choice: nanyi mkanikuta
  rationale: Muundo tendaji ni wa asili zaidi kwa Kiswahili na unadumisha uwiano wa kitamathali kati ya Paulo kuwakuta wao na wao kumkuta Paulo.
- source_word: οἷον οὐ θέλετε
  choice: nikiwa vile msivyotaka
  rationale: Hukamilisha hali ya kutoridhishana bila kueleza kwa nini hawangemtaka Paulo awe hivyo.
- source_word: ἔρις
  choice: ugomvi
  rationale: Katika orodha hii ya maovu, neno linamaanisha mzozo au hali ya kushindana kwa uadui ndani ya jumuiya.
- source_word: ζῆλος
  choice: wivu
  rationale: Muktadha wa orodha ya maovu unaonyesha maana hasi ya wivu, si bidii njema.
- source_word: θυμοί
  choice: milipuko ya hasira
  rationale: Wingi wa nomino unaonyesha matukio ya hasira inayolipuka, si tu tabia ya kudumu ya kukasirika.
- source_word: ἐριθεῖαι
  choice: tamaa za ubinafsi
  rationale: Hueleza kujitafutia faida au cheo kwa nia ya ubinafsi; wingi unawakilishwa katika ‘tamaa za’.
- source_word: καταλαλιαί
  choice: masingizio
  rationale: Hurejelea maneno ya kuwashushia wengine heshima au kuwanenea mabaya.
- source_word: ψιθυρισμοί
  choice: minong'ono
  rationale: Maana yake ya msingi ni maneno ya siri yanayonong'onezwa, hasa kuhusu wengine; ‘minong'ono’ inadumisha taswira hiyo huku tanbihi ikitoa maana ya kimuktadha.
- source_word: φυσιώσεις
  choice: majivuno
  rationale: Neno linatokana na taswira ya kujivuna au kuvimba kwa kiburi; ‘majivuno’ ni la asili na wazi.
- source_word: ἀκαταστασίαι
  choice: machafuko
  rationale: Hurejelea hali za vurugu, ukosefu wa utaratibu, au misukosuko ndani ya jumuiya.
theological_decisions:
- issue: Hali ya mkutano ambao Paulo anauogopa
  choice: Paulo anaeleza uwezekano wa kutoridhishana na kuwapo kwa maovu ya kijamii katika jumuiya bila kutaja sababu ya kimafundisho.
  alternative: Kufafanua moja kwa moja kwamba Paulo anaogopa kulazimika kutumia ukali wa mamlaka yake ya kitume au kwamba walimu wa uongo ndio hasa chanzo.
  rationale: Aya yenyewe inataja kutoridhishana na orodha ya maovu, lakini haielezi wazi sababu yake ya kina; tafsiri haipaswi kuingiza hitimisho la kimadhehebu au la mfasiri fulani.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi mbili zimetumiwa ili orodha ndefu isomeke kwa urahisi, huku kurudiwa kwa μή πως kukihifadhiwa kwa kurudia ‘ninaogopa kwamba huenda’. Muundo wa pande mbili wa ‘kuwakuta’ na ‘mkanikuta’ umehifadhiwa kwa lugha ya kawaida.
