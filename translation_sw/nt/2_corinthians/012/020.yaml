    rationale: “Masingizio” kwa kawaida ni visingizio au shutuma, ilhali καταλαλιαί hurejelea usemi wa kumsema mtu vibaya au kuharibu sifa yake. “Maneno ya kashfa” ni sahihi zaidi.
