  to: Maana ninaogopa kwamba huenda nitakapokuja niwakute si vile ninavyotaka, nanyi mkanikuta nikiwa vile msivyotaka; kwamba huenda kukawa na ugomvi, wivu, milipuko ya hasira, tamaa za ubinafsi, maneno ya kashfa, minong'ono[a], majivuno, na machafuko.
