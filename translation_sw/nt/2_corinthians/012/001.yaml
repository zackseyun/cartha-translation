  text: Καυχᾶσθαι ⸀δεῖ· οὐ ⸂συμφέρον μέν⸃, ἐλεύσομαι ⸀δὲ εἰς ὀπτασίας καὶ ἀποκαλύψεις κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/001.yaml
  text: Boasting is necessary[a], though it is not beneficial[b]; but I will go on to visions and revelations of the Lord.
translation:
  language: sw
  text: Ni lazima kujisifu, ingawa hakufai; lakini nitaendelea na maono na mafunuo ya Bwana.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutoka kwa Bwana.” Muundo wa Kigiriki unaweza kuonyesha chanzo, lakini “ya Bwana” huhifadhi kwa karibu zaidi maneno na utata wa Kigiriki.
    reason: alternative_reading
lexical_decisions:
- source_word: Καυχᾶσθαι
  choice: Kujisifu
  rationale: Kitenzi-jina hiki kinahifadhi wazo la tendo la kujisifu na kinaingia kwa kawaida katika muundo wa Kiswahili pamoja na ‘ni lazima’.
- source_word: δεῖ
  choice: ni lazima
  rationale: Huwasilisha ulazima unaoonyeshwa na δεῖ bila kuongeza ni nani anayesababisha ulazima huo.
- source_word: οὐ συμφέρον μέν
  choice: hakufai
  rationale: συμφέρον huhusu jambo lenye manufaa au linalofaa. ‘Hakufai’ ni lugha ya sasa, fupi, na ya kawaida, huku muktadha wa kulinganisha ukiendelezwa na ‘lakini’ inayofuata.
- source_word: ἐλεύσομαι δὲ
  choice: lakini nitaendelea na
  rationale: Katika muktadha huu, ἔρχομαι εἰς huonyesha kuhamia mada inayofuata. ‘Nitaendelea na’ ni ya kawaida zaidi kuliko tafsiri halisi ‘nitakuja kwenye’, na ‘lakini’ inawakilisha δέ.
- source_word: εἰς ὀπτασίας
  choice: na maono
  rationale: ὀπτασία humaanisha ono, hasa jambo linaloonekana kwa namna isiyo ya kawaida. ‘Maono’ ni tafsiri iliyo wazi na inayohifadhi wingi.
- source_word: καὶ ἀποκαλύψεις
  choice: na mafunuo
  rationale: ‘Mafunuo’ ni kisawe cha kawaida cha ἀποκαλύψεις na huhifadhi wazo la mambo yaliyofichuliwa.
- source_word: κυρίου
  choice: ya Bwana
  rationale: Muundo wa ‘ya Bwana’ unahifadhi uhusiano mpana wa hali ya umilikishi katika Kigiriki bila kuamua wazi kwamba maono na mafunuo hayo yanatoka kwa Bwana au yanamhusu.
theological_decisions:
- issue: Uhusiano wa κυρίου na ‘maono na mafunuo’
  choice: ya Bwana
  alternative: kutoka kwa Bwana
  rationale: Hali ya umilikishi ya Kigiriki inaweza kuonyesha chanzo au uhusiano mwingine. ‘Ya Bwana’ inahifadhi utata huo, ilhali ‘kutoka kwa Bwana’ ingeamua kwamba Bwana ndiye chanzo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo mfupi ‘hakufai, lakini’ unaonyesha tofauti ya μέν…δέ bila kuleta sentensi nzito; ‘ya Bwana’ inahifadhi utata wa asili.
