id: 2CO.12.10
reference: 2 Corinthians 12:10
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: διὸ εὐδοκῶ ἐν ἀσθενείαις, ἐν ὕβρεσιν, ἐν ἀνάγκαις, ἐν διωγμοῖς ⸀καὶ στενοχωρίαις, ὑπὲρ Χριστοῦ· ὅταν γὰρ ἀσθενῶ, τότε δυνατός εἰμι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/010.yaml
  text: Therefore I delight in weaknesses[a], in insults, in hardships, in persecutions and distresses, for the sake of Messiah; for when I am weak, then I am strong.
translation:
  language: sw
  text: Kwa hiyo, napendezwa na udhaifu, matukano, shida, mateso na dhiki kwa ajili ya Masihi[a]; kwa maana ninapokuwa dhaifu, ndipo ninapokuwa na nguvu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya jadi, “kwa ajili ya Kristo.”
    reason: Huhifadhi tafsiri ya jadi ya Χριστοῦ kama ‘Kristo’ huku matini kuu ikitumia cheo ‘Masihi’.
lexical_decisions:
- source_word: διὸ
  choice: Kwa hiyo
  rationale: Inaonyesha hitimisho linalotokana na hoja iliyotangulia kwa njia ya kawaida na wazi katika Kiswahili.
- source_word: εὐδοκῶ
  choice: napendezwa na
  rationale: Inaonyesha kukubali kwa moyo na kuwa na mtazamo wa kuridhia, bila kuifanya kauli hiyo kuwa kukubali hali kwa shingo upande tu.
- source_word: ἐν ἀσθενείαις
  choice: na udhaifu
  rationale: ‘Udhaifu’ huhifadhi maana pana ya hali ya kutokuwa na uwezo bila kuibana iwe ugonjwa wa mwili pekee; Kiswahili hutumia nomino hii kwa kawaida katika umoja wa kijumla.
- source_word: ἐν ὕβρεσιν
  choice: matukano
  rationale: Neno hili linaeleza fedheha au kutendewa kwa dharau; ‘matukano’ ni la kawaida na linaloeleweka.
- source_word: ἐν ἀνάγκαις
  choice: shida
  rationale: Katika muktadha huu neno linamaanisha hali ngumu na zinazombana mtu, si mahitaji ya kawaida tu.
- source_word: ἐν διωγμοῖς
  choice: mateso
  rationale: Hapa linahusu kuteswa kwa sababu ya uaminifu kwa Masihi; ‘mateso’ ni usemi wa kawaida wa Kiswahili katika muktadha huu.
- source_word: καὶ στενοχωρίαις
  choice: na dhiki
  rationale: ‘Dhiki’ huwasilisha hali ya kubanwa sana au kusongwa na taabu, na kuitofautisha kwa kiasi na ‘shida’ iliyotangulia.
- source_word: ὑπὲρ Χριστοῦ
  choice: kwa ajili ya Masihi
  rationale: ὑπέρ inaonyesha sababu au kusudi la mateso hayo, na Χριστός hapa imehifadhiwa kama cheo ‘Masihi’ badala ya kuichukulia bila shaka kuwa jina.
- source_word: ὅταν γὰρ ἀσθενῶ
  choice: kwa maana ninapokuwa dhaifu
  rationale: Muundo huu huhifadhi sababu inayotolewa na pia maana ya wakati inayojirudia au iliyo ya jumla.
- source_word: τότε δυνατός εἰμι
  choice: ndipo ninapokuwa na nguvu
  rationale: ‘Kuwa na nguvu’ ni kinyume cha kawaida cha ‘kuwa dhaifu’ na huhifadhi fumbo la kauli ya Paulo.
theological_decisions:
- issue: Tafsiri ya Χριστοῦ
  choice: Masihi
  alternative: Kristo
  rationale: Katika kirai hiki neno linaweza kusikika kama cheo cha mtiwa-mafuta; ‘Masihi’ huhifadhi maana hiyo. Tafsiri ya jadi ‘Kristo’ imewekwa katika tanbihi bila kufuta uwezekano huo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Orodha imeundwa kwa nomino fupi za kawaida ili ibaki wazi kwa msomaji wa kawaida, huku utofauti kati ya shida na dhiki ukidumishwa.
