  text: ἔστω δέ, ἐγὼ οὐ κατεβάρησα ὑμᾶς· ἀλλὰ ὑπάρχων πανοῦργος δόλῳ ὑμᾶς ἔλαβον.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/016.yaml
  text: 'But let it be so: I did not burden you[a]. Yet, being crafty[c][b], I took you by deceit.'
translation:
  language: sw
  text: 'Lakini, iwe hivyo: mimi sikuwalemea[a]. Bali, nikiwa mjanja, niliwanasa kwa hila[b][c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Basi, ikubalike hivyo,” au, “Hata ikiwa ni hivyo.” Inaonekana Paulo anakubali hoja hiyo kwa muda kwa kusudi la mjadala.
    reason: lexical_alternative
  - marker: b
    text: Huenda maneno “nikiwa mjanja, niliwanasa kwa hila” ni jinsi Paulo anavyorudia kwa kejeli shtaka lililotolewa dhidi yake, wala si kukiri kwamba alifanya hivyo.
    reason: alternative_reading
  - marker: c
    text: Au, “niliwakamata kwa ujanja,” au, “niliwanyonya kwa udanganyifu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔστω δέ
  choice: Lakini na iwe hivyo
  rationale: Ni kauli ya kukubali hoja kwa muda kwa kusudi la mjadala. Tafsiri hii inadumisha hali ya kukubali bila kuifanya kuwa tamko kwamba shtaka ni la kweli.
- source_word: κατεβάρησα
  choice: sikuwalemea
  rationale: Kitenzi hiki kina picha ya kuweka uzito juu ya mtu; katika muktadha kinahusu hasa kutowadai Wakorintho wamtegemeze Paulo kwa mali au fedha.
- source_word: ὑπάρχων
  choice: kwa kuwa
  rationale: Inawakilisha kirai cha hali kinacholetwa na kitenzi-shirikishi cha Kigiriki bila kuamua wazi ikiwa madai hayo ni ya kweli au ya kejeli.
- source_word: πανοῦργος
  choice: mjanja
  rationale: Neno hili linaonyesha ujanja wenye maana hasi katika shtaka linalorudiwa hapa. ‘Mjanja’ ni la sasa, la kawaida, na linaweza kubeba maana ya hila kulingana na muktadha.
- source_word: δόλῳ
  choice: kwa hila
  rationale: 'Hii inadumisha matumizi ya hali ya namna au chombo: madai ni kwamba Paulo aliwanasa kwa kutumia udanganyifu.'
- source_word: ἔλαβον
  choice: niliwanasa
  rationale: Katika muktadha huu λαμβάνω inaweza kumaanisha kumkamata au kumnasa mtu kwa mbinu. ‘Niliwanasa’ ni ya asili zaidi kwa Kiswahili kuliko ‘niliwachukua’ na inadumisha ukali wa shtaka.
theological_decisions:
- issue: Ikiwa maneno ya Paulo baada ya ἀλλὰ ni kukiri kwake mwenyewe au kurudia shtaka kwa kejeli
  choice: Kauli imetafsiriwa moja kwa moja—‘kwa kuwa mjanja, niliwanasa kwa hila’—huku tanbihi ikieleza uwezekano mkubwa wa kejeli.
  alternative: Lakini mimi, kwa ujanja, niliwadanganya na kujinufaisha kupitia kwenu.
  rationale: Muktadha mpana unaonyesha Paulo akikataa kwamba aliwanyonya Wakorintho. Hata hivyo, kuweka maelezo ya kejeli moja kwa moja katika matini kungeondoa mvutano wa usemi wa Kigiriki; kwa hiyo matini inadumisha shtaka katika umbo lake kali, na tanbihi inasaidia msomaji kulitambua katika muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye hadhi na unaoeleweka kwa urahisi. ‘Sikuwalemea’ inadumisha sitiari ya chanzo huku ikifaa katika muktadha wa mzigo wa mali; ‘niliwanasa kwa hila’ ni usemi wa asili unaohifadhi shtaka kali na kejeli inayowezekana.
