translation:
  language: sw
  text: Kuhusu jambo hili[a], nilimsihi[b] Bwana[c] mara tatu ili liondoke kwangu[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa ajili ya jambo hili” au “Juu ya jambo hili.”
    reason: lexical_alternative
  - marker: b
    text: Au, “nilimwomba kwa bidii” au “nilimwomba kwa unyenyekevu.”
    reason: lexical_alternative
  - marker: c
    text: Kigiriki kinasema tu “Bwana”; Paulo hamtaji Yesu kwa jina waziwazi hapa.
    reason: alternative_reading
  - marker: d
    text: Au, “liniache” au “liende mbali nami.” Kigiriki hakitaji kiima cha kitenzi waziwazi; kinarejelea kile kilichotajwa katika mstari uliotangulia, yaani “mwiba katika mwili” na “mjumbe wa Shetani.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπὲρ τούτου
  choice: Kwa ajili ya jambo hili
  rationale: ὑπέρ pamoja na hali ya umilikaji hapa hutambulisha jambo linalozungumziwa. Usemi huu unaunganisha ombi na mateso yaliyotajwa katika mstari uliotangulia bila kumaanisha ‘kwa niaba ya.’
- source_word: τρὶς
  choice: mara tatu
  rationale: Kielezi hiki humaanisha matukio matatu; ‘mara tatu’ ni Kiswahili cha sasa kilicho wazi na cha kawaida.
- source_word: τὸν κύριον
  choice: Bwana
  rationale: κύριος hapa limetafsiriwa kwa neno la kawaida la kibiblia ‘Bwana.’ Jina Yesu halijaongezwa kwa sababu maandishi ya Kigiriki hayalitaji waziwazi hapa.
- source_word: παρεκάλεσα
  choice: nilimsihi
  rationale: Katika muktadha wa sala, παρακαλέω huonyesha ombi la dhati. ‘Nilimsihi’ ni la asili na lenye uzito, bila kuzidisha nguvu ya neno la Kigiriki.
- source_word: ἵνα
  choice: kwamba
  rationale: ἵνα hapa hutambulisha lengo au maudhui ya ombi. ‘Kwamba’ huunda sentensi ya Kiswahili iliyo wazi na ya kawaida.
- source_word: ἀποστῇ
  choice: liondoke
  rationale: Kitenzi hiki humaanisha kuondoka au kwenda mbali. Kiambishi ‘li-’ kinarejelea ‘jambo hili’ katika tafsiri, huku tanbihi ikihifadhi kwamba kiima cha Kigiriki hakijasemwa wazi.
- source_word: ἀπ’ ἐμοῦ
  choice: kwangu
  rationale: Hueleza kutengwa na Paulo. ‘Kuondoka kwangu’ ni usemi wa asili wa Kiswahili kwa maana ya kuondoka mbali naye.
theological_decisions:
- issue: Anayerejelewa kwa jina ‘Bwana’
  choice: Bwana
  alternative: Bwana Yesu
  rationale: Katika muktadha huu huenda Paulo anamrejelea Yesu, lakini Kigiriki kinasema tu ‘Bwana.’ Tafsiri haiongezi jina ambalo halikutajwa.
- issue: Kiima cha ἀποστῇ
  choice: liondoke
  alternative: aondoke / ule mwiba uondoke / yule mjumbe aondoke
  rationale: Kigiriki kinaacha kiima kieleweke kutokana na muktadha uliotangulia, unaotaja ‘mwiba katika mwili’ na ‘mjumbe wa Shetani.’ Tafsiri kuu inarejelea kwa upana ‘jambo hili,’ na tanbihi inaeleza utata huo badala ya kuamua ikiwa ni mwiba au mjumbe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Mpangilio umefanywa kuwa wa asili kwa Kiswahili huku uhusiano na mstari uliotangulia na utata wa kiima kisichotajwa katika Kigiriki vikihifadhiwa kwa tanbihi.
