  text: τὰ μὲν σημεῖα τοῦ ἀποστόλου κατειργάσθη ἐν ὑμῖν ἐν πάσῃ ⸀ὑπομονῇ, σημείοις ⸀τε καὶ τέρασιν καὶ δυνάμεσιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/012.yaml
  text: Indeed[a], the signs of an apostle were performed among you with all perseverance[b], with signs and wonders and powers.
translation:
  language: sw
  text: Kwa kweli, ishara za mtume[a] zilitendwa miongoni mwenu kwa ustahimilivu wa kila namna, kwa ishara na maajabu na matendo ya nguvu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Usemi huu unaweza pia kueleweka kuwa “ishara za mtume huyo,” yaani Paulo hasa, badala ya alama zinazomtambulisha mtume kwa ujumla.
    reason: alternative_reading
  - marker: b
    text: “Matendo ya nguvu” yanaweza pia kutafsiriwa “miujiza” au “matendo makuu”; neno la Kigiriki linasisitiza matendo yanayodhihirisha nguvu.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ μὲν σημεῖα
  choice: Kwa kweli, ishara
  rationale: μέν inasisitiza dai hilo bila kuwa na δέ iliyoelezwa wazi; “Kwa kweli” huwasilisha msisitizo huo kwa Kiswahili cha kawaida, huku σημεῖα ikibaki “ishara.”
- source_word: τοῦ ἀποστόλου
  choice: za mtume
  rationale: Kiswahili hakina kibainishi kinacholingana moja kwa moja na neno la Kigiriki hapa. “Za mtume” huhifadhi uwezekano wa maana ya ishara zinazomtambulisha mtume kwa ujumla au ishara za mtume anayezungumziwa, yaani Paulo.
- source_word: κατειργάσθη
  choice: zilitendwa
  rationale: Kitenzi cha aoristi tendwa kinaonyesha kwamba ishara hizo zilitekelezwa au kutendeka bila kumtaja mtendaji moja kwa moja. “Zilitendwa” ni cha asili na huhifadhi hali ya kutendwa.
- source_word: ἐν ὑμῖν
  choice: miongoni mwenu
  rationale: Muktadha unahusu huduma iliyofanyika katikati ya jumuiya ya Wakorintho, si tendo la ndani ya kila mmoja wao.
- source_word: ἐν πάσῃ ὑπομονῇ
  choice: kwa uvumilivu wote
  rationale: ὑπομονή ni ustahimilivu thabiti chini ya shida. Tafsiri hii huhifadhi πάσῃ na kuonyesha mazingira au namna ambayo huduma hiyo ilifanywa.
- source_word: σημείοις τε καὶ τέρασιν καὶ δυνάμεσιν
  choice: kwa ishara na maajabu na matendo ya nguvu
  rationale: 'Tafsiri inadumisha vipengele vitatu vya usemi wa Kigiriki: σημεῖα kama “ishara,” τέρατα kama “maajabu,” na δυνάμεις kama “matendo ya nguvu,” bila kuvijumlisha vyote chini ya neno “miujiza.” “Kwa” inaweza kuonyesha ufafanuzi wa ishara zilizotajwa na pia njia ambayo uthibitisho huo ulionekana.'
theological_decisions:
- issue: Maana ya “ishara za mtume”
  choice: Usemi umeachwa uweze kumaanisha alama au uthibitisho unaoonyesha huduma ya kitume, ukijidhihirisha katika uvumilivu na matendo ya kimiujiza.
  alternative: Kuuchukulia usemi huu kuwa unamaanisha miujiza pekee kama alama zinazofafanua utume, au kuwa unamtaja Paulo peke yake kama “yule mtume.”
  rationale: Muundo wa sentensi unaweka “ishara za mtume” kama dai kuu, kisha unalitaja “uvumilivu wote” na ishara, maajabu, na matendo ya nguvu. Tafsiri haifanyi uamuzi wa kimadhehebu kuhusu orodha kamili ya sifa za mtume.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Urudiaji wa “ishara” umehifadhiwa kwa sababu upo katika Kigiriki na unaunganisha dai kuu na ufafanuzi wake. Viunganishi vya “na” vimehifadhiwa ili kuakisi msururu wa asili bila kufanya sentensi kuwa nzito kupita kiasi.
