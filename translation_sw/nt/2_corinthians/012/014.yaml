reference: 2 Corinthians 12:14
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἰδοὺ τρίτον ⸀τοῦτο ἑτοίμως ἔχω ἐλθεῖν πρὸς ὑμᾶς, καὶ οὐ ⸀καταναρκήσω· οὐ γὰρ ζητῶ τὰ ὑμῶν ἀλλὰ ὑμᾶς, οὐ γὰρ ὀφείλει τὰ τέκνα τοῖς γονεῦσιν θησαυρίζειν, ἀλλὰ οἱ γονεῖς τοῖς τέκνοις.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/014.yaml
  text: Look, this is the third time I am ready to come to you, and I will not be a burden to you. For I do not seek what is yours, but you. For children are not obligated to store up for their parents, but parents for their children.
translation:
  language: sw
  text: Tazama, kwa mara hii ya tatu niko tayari kuja kwenu,[a] nami sitakuwa mzigo kwenu.[b] Kwa maana sitafuti vilivyo vyenu, bali ninyi wenyewe. Kwa maana watoto hawana wajibu wa kuwawekea akiba wazazi wao, bali wazazi wana wajibu wa kuwawekea akiba watoto wao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Hii ni mara ya tatu niko tayari kuja kwenu.”
    reason: lexical_alternative
  - marker: b
    text: Kitenzi kilichotafsiriwa “kuwa mzigo” kinaweza kumaanisha kumlemea mtu kwa mahitaji ya mali au fedha.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Tazama
  rationale: Ni neno la kawaida na lenye hadhi la kuvuta usikivu, linalolingana na nguvu ya Ἰδοὺ.
- source_word: τρίτον τοῦτο ἑτοίμως ἔχω ἐλθεῖν
  choice: hii ni mara ya tatu niko tayari kuja kwenu
  rationale: Hutoa Kiswahili cha asili huku likihifadhi kwamba kauli inahusu mara ya tatu ya kuwa tayari kuja, bila kulazimisha hitimisho kuhusu idadi ya ziara zilizotimia.
- source_word: καταναρκήσω
  choice: sitakuwa mzigo kwenu
  rationale: Katika muktadha kitenzi kinaonyesha kutowalemea, hasa kwa mahitaji ya mali au fedha; usemi huu ni wazi na wa kawaida.
- source_word: ζητῶ τὰ ὑμῶν ἀλλὰ ὑμᾶς
  choice: sitafuti mali yenu, bali ninawatafuta ninyi
  rationale: ‘Mali yenu’ huweka wazi tofauti ya kimuktadha kati ya vitu walivyo navyo na watu wenyewe, huku ‘ninyi’ ikisisitiza upande wa pili wa ulinganisho.
- source_word: ὀφείλει
  choice: hawana wajibu ... wanaopaswa
  rationale: Huwasilisha dhana ya wajibu inayopatikana katika kitenzi; sehemu ya pili iliyoachwa kimuktadha katika Kigiriki imeelezwa kwa kawaida katika Kiswahili.
- source_word: θησαυρίζειν
  choice: kuwawekea akiba
  rationale: Katika methali hii, usemi huu wa Kiswahili unaeleza kukusanya au kuhifadhi mali kwa manufaa ya mtu mwingine bila kupoteza maana ya msingi.
- source_word: γονεῦσιν / γονεῖς
  choice: wazazi
  rationale: Neno la Kigiriki linawahusu wazazi kwa ujumla, si baba peke yao.
- source_word: τέκνα / τέκνοις
  choice: watoto
  rationale: Neno la Kigiriki ni la jumla kwa watoto, bila kuwekewa jinsia.
theological_decisions:
- issue: Maana ya kauli ya Paulo kuhusu ‘mara ya tatu’
  choice: Kauli imehusishwa na mara ya tatu ya Paulo kuwa tayari kuja.
  alternative: Kutafsiri kwa namna inayoeleza moja kwa moja kuwa hii lazima iwe ziara yake halisi ya tatu.
  rationale: Muundo wa Kigiriki unalenga utayari wake wa sasa wa kuja kwa mara ya tatu; tafsiri haipaswi kuamua kimya kimya historia ya safari zaidi ya kile mstari wenyewe unachosema.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye hadhi na inayoeleweka kwa wasomaji wa kawaida. ‘Ninawatafuta ninyi’ imetumiwa kuhifadhi msisitizo wa tofauti kati ya mali yao na wao wenyewe.
