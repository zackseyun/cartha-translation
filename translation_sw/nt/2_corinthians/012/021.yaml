review_pass:
  verdict: revise
  source_fidelity: The draft accurately carries forward the fear expressed in the preceding context, preserves the contingency of God's humbling of Paul, and renders the threefold vice list distinctly. However, “waliokuwa wakitenda” changes the aorist ἔπραξαν into an explicitly ongoing/habitual action and attaches somewhat awkwardly after the final item in the list.
  naturalness: The overall register is clear Standard East African Swahili. The closing relative clause is clearer and more idiomatic when it explicitly refers to the listed sins rather than using an imperfect construction that can momentarily appear to modify only “mwenendo usio na haya.”
  terminology: “Mungu wangu,” “kuninyenyekeza,” “kuombolezea,” “uchafu,” “uasherati,” and “mwenendo usio na haya” are suitable, non-sectarian renderings. “Dhambi za” clarifies the object of repentance naturally without narrowing the Greek terms.
  issues:
  - severity: medium
    issue: Aspect and attachment of the final relative clause
    rationale: The Greek ἔπραξαν is aorist and states that the listed conduct was committed/practiced; “waliokuwa wakitenda” supplies an imperfect, ongoing sense. Its plural human subject is also syntactically delayed after the noun list. Recasting the phrase as “dhambi ... walizotenda” preserves the completed-action sense and makes the reference explicit.
  revised_text: Ninaogopa kwamba nitakapokuja tena, huenda Mungu wangu akaninyenyekeza mbele yenu[a], nami nitawaombolezea wengi miongoni mwa wale waliotenda dhambi hapo awali[b] na ambao hawajatubu dhambi za uchafu, uasherati na mwenendo usio na haya walizotenda[c].
