id: 2CO.12.21
reference: 2 Corinthians 12:21
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: μὴ πάλιν ⸂ἐλθόντος μου⸃ ⸀ταπεινώσῃ ⸀με ὁ θεός μου πρὸς ὑμᾶς, καὶ πενθήσω πολλοὺς τῶν προημαρτηκότων καὶ μὴ μετανοησάντων ἐπὶ τῇ ἀκαθαρσίᾳ καὶ πορνείᾳ καὶ ἀσελγείᾳ ᾗ ἔπραξαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/021.yaml
  text: I fear that when I come again[a], my God may humble me before you[d][c][b], and I will mourn over many who have sinned before and have not repented of the impurity and sexual immorality and sensuality that they practiced.
translation:
  language: sw
  text: Ninaogopa kwamba nitakapokuja tena, huenda Mungu wangu akaninyenyekeza mbele yenu[a], nami nitawaombolezea wengi miongoni mwa wale waliotenda dhambi hapo awali[b] na ambao hawajatubu dhambi za uchafu, uasherati na mwenendo usio na haya walizotenda[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akanifedhehesha miongoni mwenu.” Kitenzi cha Kigiriki kinaweza kumaanisha kunyenyekeza, kushusha au kufedhehesha; pia kirai kinachofuata kinaweza kutafsiriwa “miongoni mwenu.”
    reason: lexical_alternative
  - marker: b
    text: Yaani, wengi kati ya wale waliokuwa wametenda dhambi kabla ya wakati huo.
    reason: lexical_alternative
  - marker: c
    text: Au, “ufisadi usio na kiasi.” Neno la Kigiriki linamaanisha mwenendo wa wazi usio na haya wala kujizuia, mara nyingi wa kingono.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ πάλιν ἐλθόντος μου
  choice: Ninaogopa kwamba nitakapokuja tena
  rationale: μή inaendeleza wazo la hofu kutoka mstari uliotangulia. Kiswahili huhitaji kitenzi cha hofu kirudiwe ili sentensi ieleweke kwa kawaida; πάλιν inaonyesha kuja tena.
- source_word: ταπεινώσῃ με ὁ θεός μου
  choice: huenda Mungu wangu akaninyenyekeza
  rationale: ταπεινόω inaweza kumaanisha kunyenyekeza, kushusha au kufedhehesha. ‘Kuninyenyekeza’ huhifadhi upana wa maana bila kulazimisha wazo la fedheha ya hadharani.
- source_word: πρὸς ὑμᾶς
  choice: mbele yenu
  rationale: Katika muktadha wa ziara, kirai hiki kinaonyesha kwamba kunyenyekezwa kwa Paulo kungetokea katika kuwapo kwa Wakorintho. ‘Mbele yenu’ ni Kiswahili cha kawaida, ingawa ‘miongoni mwenu’ pia yawezekana.
- source_word: πενθήσω
  choice: nitawaombolezea
  rationale: πενθέω huonyesha huzuni nzito au kuomboleza. Umbo lenye kiambishi cha watendewa linaonyesha kwamba Paulo atawaombolezea watu hao.
- source_word: πολλοὺς τῶν προημαρτηκότων
  choice: wengi miongoni mwa wale waliotenda dhambi hapo awali
  rationale: Muundo wa Kigiriki unasema ‘wengi kati ya wale’; njeo timilifu ya προαμαρτάνω inaelekeza kwenye dhambi za awali ambazo bado zina umuhimu katika hali ya sasa.
- source_word: μὴ μετανοησάντων
  choice: ambao hawajatubu
  rationale: ‘Hawajatubu’ huonyesha kwamba mpaka wakati unaotazamiwa bado hawajabadili nia na mwenendo wao.
- source_word: ἀκαθαρσίᾳ
  choice: uchafu
  rationale: Neno hili linaonyesha uchafu wa kimaadili na linaachwa kuwa pana kama lilivyo katika Kigiriki.
- source_word: πορνείᾳ
  choice: uasherati
  rationale: ‘Uasherati’ ni neno la kawaida la Kiswahili kwa mwenendo wa kingono usio halali na linafaa kwa maana pana ya πορνεία bila kuibana kuwa tendo moja maalumu.
- source_word: ἀσελγείᾳ
  choice: mwenendo usio na haya
  rationale: ἀσέλγεια hueleza mwenendo usio na kiasi na usiojali aibu, mara nyingi katika mambo ya kingono. Kirai hiki ni wazi kwa wasomaji wa sasa na hakilichanganyi na πορνεία.
- source_word: ᾗ ἔπραξαν
  choice: waliokuwa wakitenda
  rationale: πράσσω inaweza kuonyesha mwenendo uliozoeleka, si tukio moja tu. Umbo hili la Kiswahili linaonyesha matendo yaliyokuwa yakiendelea na linarejelea kwa pamoja maovu matatu yaliyotajwa.
theological_decisions:
- issue: Nguvu ya μή na uhusiano wake na hofu iliyotajwa katika mstari uliotangulia
  choice: 'Wazo la hofu limeelezwa wazi: ‘Ninaogopa kwamba …’'
  alternative: ‘Isije ikawa nitakapokuja tena …’
  rationale: Kigiriki kinaendeleza kitenzi cha kuogopa kutoka 12:20. Kukitaja tena katika Kiswahili kunafafanua sintaksia bila kubadili madai ya Paulo kuwa uhakika.
- issue: Ikiwa ταπεινόω hapa ni kunyenyekezwa au kufedheheshwa
  choice: akaninyenyekeza
  alternative: akanifedhehesha / akanishusha
  rationale: Maana ya msingi ya kushushwa imehifadhiwa huku uwezekano wa fedheha ukitajwa katika tanbihi badala ya kuamuliwa kimyakimya.
- issue: Kutofautisha maovu matatu katika orodha
  choice: uchafu, uasherati na mwenendo usio na haya
  alternative: unajisi, uzinzi na ufisadi
  rationale: Maneno ya Kigiriki yanaingiliana lakini si visawe kamili. Tafsiri inahifadhi vipengele vitatu tofauti bila kuvipa mipaka ya kimadhehebu au kuyafanya yote kumaanisha kosa moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa heshima, wa sasa na unaosomeka kwa kawaida. ‘Nitawaombolezea’ huhifadhi uzito wa kihisia wa πενθέω. Orodha ya maovu imeachwa katika mpangilio wa Kigiriki, na viunganishi vimetumiwa kwa mtiririko wa kawaida wa Kiswahili.
