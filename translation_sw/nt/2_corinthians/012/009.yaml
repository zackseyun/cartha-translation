source:
  edition: SBLGNT
  text: καὶ εἴρηκέν μοι· Ἀρκεῖ σοι ἡ χάρις μου· ἡ γὰρ ⸀δύναμις ἐν ἀσθενείᾳ ⸀τελεῖται. ἥδιστα οὖν μᾶλλον καυχήσομαι ἐν ταῖς ἀσθενείαις ⸀μου, ἵνα ἐπισκηνώσῃ ἐπ’ ἐμὲ ἡ δύναμις τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/009.yaml
  text: And he has said to me[a], “My grace is sufficient for you, for my power is made perfect in weakness.” Therefore I will boast all the more gladly in my weaknesses[d][c][b], so that the power of Messiah may dwell upon me.
translation:
  language: sw
  text: Naye ameniambia, “Neema yangu inakutosha, kwa maana nguvu hukamilishwa katika udhaifu.”[a] Kwa hiyo, nitajisifu kwa furaha kubwa zaidi katika udhaifu wangu, ili nguvu ya Masihi ikae juu yangu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa maana nguvu hufanywa kamilifu katika udhaifu.” Matini ya Kigiriki iliyotumiwa hapa haina “nguvu zangu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “ili nguvu ya Kristo itue juu yangu”; kwa maana halisi zaidi, kitenzi hicho kinaweza kuleta picha ya kupiga hema juu yangu.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴρηκέν
  choice: ameniambia
  rationale: Wakati timilifu wa Kigiriki unaonyesha jambo lililosemwa zamani ambalo bado lina umuhimu; “ameniambia” ni la kawaida na huhifadhi athari hiyo.
- source_word: Ἀρκεῖ σοι
  choice: inakutosha
  rationale: Hii ni kauli ya kawaida ya Kiswahili inayoeleza utoshelevu bila kuwa nzito au ya kitaalamu.
- source_word: χάρις
  choice: neema
  rationale: “Neema” ni istilahi ya kawaida ya kibiblia katika Kiswahili na huhifadhi upana wa maana ya χάρις katika matumizi ya Paulo.
- source_word: δύναμις
  choice: nguvu
  rationale: “Nguvu” hufaa katika sehemu zote mbili za mstari na huhifadhi urudiaji wa neno la Kigiriki.
- source_word: ἀσθενείᾳ / ἀσθενείαις
  choice: udhaifu / udhaifu wangu
  rationale: Umoja katika kauli ya kwanza na wingi wa uzoefu wa Paulo unatambulika katika Kigiriki; hata hivyo, Kiswahili cha kawaida hutumia “udhaifu” kama nomino isiyohesabika, huku “wangu” ikionyesha uzoefu mbalimbali wa Paulo bila usemi mgumu “udhaifu mbalimbali.”
- source_word: τελεῖται
  choice: hukamilishwa
  rationale: Huhifadhi hali ya kutendwa na wazo la kufikishwa kwenye utimilifu wake, bila kudai kwamba nguvu ilikuwa na kasoro ya kimaadili.
- source_word: ἥδιστα ... μᾶλλον
  choice: kwa furaha zaidi
  rationale: Huwasilisha kwa Kiswahili cha kawaida msisitizo wa pamoja wa kufurahia na kulinganisha, bila kurudia kwa namna isiyo ya kawaida.
- source_word: καυχήσομαι
  choice: nitajisifu
  rationale: Huhifadhi fumbo la kimatamshi la Paulo la kujisifu katika udhaifu badala ya kulainisha maana kuwa kujivunia tu.
- source_word: ἐπισκηνώσῃ ἐπ’ ἐμέ
  choice: zipate kukaa juu yangu
  rationale: Huhifadhi picha ya nguvu kukaa au kutanda juu ya Paulo kwa lugha inayoeleweka; maana halisi zaidi ya kupiga hema imeelezwa katika tanbihi.
- source_word: Χριστοῦ
  choice: Masihi
  rationale: Hapa Χριστός inaweza kueleweka kama cheo; “Masihi” huhifadhi maana hiyo badala ya kuitumia kama jina tu.
theological_decisions:
- issue: Iwapo kuongeza kimilikishi katika δύναμις
  choice: nguvu hukamilishwa katika udhaifu
  alternative: nguvu zangu hukamilishwa katika udhaifu
  rationale: Matini ya SBLGNT iliyotolewa haina kimilikishi μου baada ya δύναμις. Kwa hiyo, tafsiri haiongezi “zangu,” ingawa muktadha unaunganisha nguvu hizo na msemaji.
- issue: Maana ya τελεῖται kuhusu nguvu ya Mungu
  choice: hukamilishwa
  alternative: hufanywa kamilifu
  rationale: “Hukamilishwa” huonyesha kufikia utimilifu au kudhihirika kikamilifu bila kutatua kimya kimya mvutano wa kitheolojia kwa kudai kwamba nguvu ya Mungu ilikuwa na upungufu.
- issue: Tafsiri ya Χριστοῦ
  choice: Masihi
  alternative: Kristo
  rationale: “Masihi” huonyesha wazi cheo kinachotokana na Χριστός; “Kristo” ni tafsiri mbadala ya mapokeo na imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Mpangilio wa sentensi umewekwa wa kawaida kwa wasomaji wa leo, huku urudiaji wa “nguvu” na “udhaifu” na fumbo la kujisifu katika udhaifu vikihifadhiwa.
