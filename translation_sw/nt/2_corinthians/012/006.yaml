id: 2CO.12.6
reference: 2 Corinthians 12:6
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐὰν γὰρ θελήσω καυχήσασθαι, οὐκ ἔσομαι ἄφρων, ἀλήθειαν γὰρ ἐρῶ· φείδομαι δέ, μή τις εἰς ἐμὲ λογίσηται ὑπὲρ ὃ βλέπει με ἢ ἀκούει ⸀τι ἐξ ἐμοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/006.yaml
  text: For if I should want to boast[a], I would not be foolish, for I would be speaking the truth. But I refrain, so that no one may reckon me above what he sees in me or hears from me.
translation:
  language: sw
  text: Kwa maana nikitaka kujisifu, sitakuwa mpumbavu, kwa maana nitasema kweli. Lakini najizuia, ili mtu yeyote asinihesabu kuwa zaidi ya vile anavyoniona au anavyosikia chochote kutoka kwangu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θελήσω
  choice: ningetaka
  rationale: Muundo wa ἐὰν pamoja na kitenzi cha hali tegemezi unaonyesha uwezekano wa kudhaniwa; “kama ningetaka” huwasilisha hali hiyo kwa Kiswahili cha kawaida.
- source_word: καυχήσασθαι
  choice: kujisifu
  rationale: Katika muktadha huu neno linahusu Paulo kusema mambo yanayoweza kumpa sifa, huku matumizi yake yakiwa na hali ya kusitasita na kiasi fulani cha kejeli.
- source_word: ἄφρων
  choice: mpumbavu
  rationale: Neno hili linadumisha uhusiano na lugha ya Paulo kuhusu “mpumbavu” katika muktadha wa karibu na linafaa baada ya “singekuwa.”
- source_word: ἀλήθειαν ... ἐρῶ
  choice: ningesema kweli
  rationale: Kauli hii iko ndani ya hali ya kudhaniwa; “ningesema” huonyesha jambo ambalo lingetokea kama Paulo angechagua kujisifu.
- source_word: φείδομαι
  choice: najizuia
  rationale: Hapa kitenzi kinaonyesha kwamba Paulo anajizuia asiendelee kujisifu, wala si kwamba anakataa ukweli wa yale ambayo angeweza kusema.
- source_word: λογίσηται
  choice: asinihesabu kuwa
  rationale: “Kuhesabu kuwa” huhifadhi maana ya kufanya tathmini au kumwona mtu kwa namna fulani, badala ya kuonyesha wazo la kupita tu.
- source_word: ὑπὲρ ὃ
  choice: zaidi ya vile
  rationale: Kifungu hiki huonyesha kuvuka kiwango kinachotegemea yale yanayoonekana au kusikiwa.
- source_word: βλέπει με
  choice: anavyoniona
  rationale: Tafsiri hii inahifadhi Paulo kama yule anayeonekana na kuzingatiwa moja kwa moja.
- source_word: ἀκούει τι ἐξ ἐμοῦ
  choice: anavyosikia chochote kutoka kwangu
  rationale: “Chochote” huwakilisha wazi kipengele kisichobainishwa τι, na “kutoka kwangu” huonyesha chanzo cha yale yanayosikiwa.
theological_decisions:
- issue: Maelezo ya Paulo juu yake mwenyewe na kujizuia kwake kujisifu
  choice: Kauli imetafsiriwa kama hali ya kudhaniwa ambapo Paulo angeweza kusema kweli bila kuwa mpumbavu, lakini anajizuia ili watu wasimkadirie kupita ushahidi wao wenyewe.
  alternative: Kufafanua kwamba kujisifu kwake kungekuwa jambo la haki au jema kwa ujumla; au kwamba kila aina ya kujisifu hapa lazima iwe ya uongo au dhambi.
  rationale: Kiyunani kinashikilia pamoja madai kwamba Paulo angesema kweli na uamuzi wake wa kujizuia. Tafsiri haiondoi mvutano huo kwa kuingiza hitimisho pana la kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. “Kujisifu,” “mpumbavu,” na “najizuia” ni maneno ya kawaida lakini yanadumisha uzito na mfuatano wa hoja ya Paulo. Kipengele τι kimetafsiriwa wazi kwa “chochote,” kwa hiyo hakihitaji tanbihi ya mbadala wa kileksika.
