id: 2CO.12.7
reference: 2 Corinthians 12:7
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ τῇ ὑπερβολῇ τῶν ἀποκαλύψεων. ⸀διὸ ἵνα μὴ ὑπεραίρωμαι, ἐδόθη μοι σκόλοψ τῇ σαρκί, ἄγγελος ⸀Σατανᾶ, ἵνα με κολαφίζῃ, ⸂ἵνα μὴ ὑπεραίρωμαι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/007.yaml
  text: And because of the surpassing greatness of the revelations—so that I might not exalt myself—a thorn in the flesh was given to me[a], a messenger of Satan, so that it might torment me[e][d][c][b], so that I might not exalt myself.
translation:
  language: sw
  text: Na kwa sababu ya ukuu usio na kifani wa mafunuo hayo—ili nisijikweze—nilipewa mwiba katika mwili[a], mjumbe wa Shetani, ili anipige[b][c], ili nisijikweze[d][e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mchokoo katika mwili.” Neno la Kigiriki σκόλοψ linaweza kumaanisha mwiba, kibanzi chenye ncha kali, au mchokoo; picha kamili haijulikani.
    reason: lexical_alternative
  - marker: b
    text: Au, “malaika wa Shetani.” Neno la Kigiriki ἄγγελος linaweza kumaanisha “mjumbe” au “malaika.”
    reason: alternative_reading
  - marker: c
    text: Au, “aniteshe.” Kitenzi cha Kigiriki κολαφίζῃ kimsingi humaanisha kumpiga mtu kwa makonde au kumpiga mara kwa mara.
    reason: lexical_alternative
  - marker: d
    text: Maneno “ili nisijikweze” yanatokea mara mbili katika maandishi ya Kigiriki, na marudio hayo yamehifadhiwa hapa.
    reason: textual_transparency
  - marker: e
    text: 'Muundo mwingine unaowezekana ni: “Na kwa sababu ya ukuu usio na kifani wa mafunuo hayo, ili nisijikweze, nilipewa mwiba katika mwili.”'
    reason: syntactic_alternative
lexical_decisions:
- source_word: ὑπερβολῇ τῶν ἀποκαλύψεων
  choice: ukuu usio na kifani wa mafunuo hayo
  rationale: Huwasilisha kiwango cha kipekee cha mafunuo kwa Kiswahili cha kawaida na chenye hadhi, bila kudokeza idadi pekee.
- source_word: ὑπεραίρωμαι
  choice: nisijikweze
  rationale: Huhifadhi maana ya kujitukuza au kujiinua na pia marudio ya maneno hayo katika Kigiriki.
- source_word: ἐδόθη μοι
  choice: nilipewa
  rationale: Huhifadhi kauli tendwa bila kumtaja mtoaji, ambaye hajatajwa wazi katika mstari.
- source_word: σκόλοψ τῇ σαρκί
  choice: mwiba katika mwili
  rationale: Huhifadhi sitiari na utata wa σκόλοψ; 'katika mwili' ni usemi wa asili unaokaribia dative ya Kigiriki bila kuifasiri kuwa hali fulani maalumu.
- source_word: ἄγγελος Σατανᾶ
  choice: mjumbe wa Shetani
  rationale: '''Mjumbe'' lina upana unaoweza kuhusisha malaika au wakala mwingine, hivyo halitambui asili yake kwa namna ambayo Kigiriki hakilazimishi.'
- source_word: κολαφίζῃ
  choice: anipige
  rationale: Kitenzi kimsingi hudokeza kupiga kwa makonde au kupiga mara kwa mara; 'anipige' huhifadhi picha ya vurugu kuliko neno pana zaidi 'aniteshe'.
theological_decisions:
- issue: Asili ya ‘mwiba katika mwili’
  choice: Sitiari imehifadhiwa bila kutaja ugonjwa, mateso, upinzani, au mashambulizi ya pepo.
  alternative: ugonjwa wa mwili; wapinzani au mateso; mashambulizi ya pepo
  rationale: Mstari hautambulishi mwiba huo kwa usahihi, kwa hiyo tafsiri haifungi maana kwa maelezo moja.
- issue: Aliyetoa mwiba
  choice: Kauli tendwa ‘nilipewa’ imetumiwa bila kumtaja Mungu au Shetani kuwa mtoaji.
  alternative: Mungu alinipa; iliruhusiwa
  rationale: Kigiriki hakimtaji wazi mtendaji, ingawa mstari unaweka pamoja kusudi la kuzuia kujikweza na mjumbe wa Shetani.
- issue: Utambulisho wa ἄγγελος Σατανᾶ
  choice: mjumbe wa Shetani
  alternative: malaika wa Shetani
  rationale: Huhifadhi uwezekano wa kiumbe wa kiroho au wakala mwingine bila kuamua jambo ambalo neno ἄγγελος lenyewe halijamaliza.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mistari mirefu imetenganishwa kwa vistari virefu ili kusudi la ‘ili nisijikweze’ lisomeke wazi huku mpangilio na msisitizo wa Kigiriki vikihifadhiwa. Kiwakilishi cha nafsi katika ‘anipige’ kinafuata ‘mjumbe’; hakiamui ikiwa mjumbe huyo ni malaika au wakala mwingine.
