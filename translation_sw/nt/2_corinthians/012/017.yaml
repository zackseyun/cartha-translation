  text: Did I exploit you through any of those whom I sent to you?[a]
translation:
  language: sw
  text: Je, nilipata faida kwa kuwanyonya kupitia yeyote kati ya wale niliowatuma kwenu?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kujipatia faida kwa gharama yenu,” “kuwatumia vibaya,” au “kuwapunja.” Kitenzi cha Kigiriki kina maana ya kupata faida kwa hasara ya mwingine.
    reason: lexical_alternative
lexical_decisions:
- source_word: μή
  choice: Je, ...?
  rationale: Kihusishi hiki kinaanzisha swali la balagha linalotarajia jibu la kukataa; muundo wa “Je” ni wa kawaida na wa asili katika Kiswahili.
- source_word: τινα ὧν
  choice: yeyote kati ya wale
  rationale: Huhifadhi maana ya mtu yeyote kutoka katika kundi la wale Paulo aliowatuma.
- source_word: ἀπέσταλκα
  choice: niliowatuma
  rationale: Wakati timilifu wa Kigiriki unarejelea watu ambao Paulo alikuwa amewatuma; wakati uliopita katika Kiswahili ni wa asili hapa bila kupoteza hoja.
- source_word: πρὸς ὑμᾶς
  choice: kwenu
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha kwamba wajumbe walitumwa kwa waumini wa Korintho.
- source_word: δι’ αὐτοῦ
  choice: kupitia yeyote kati ya wale
  rationale: Ingawa kiwakilishi cha Kigiriki ni cha umoja, kinahusiana kwa namna ya mgawanyo na “yeyote” katika kundi lililotajwa; Kiswahili hiki huwasilisha uhusiano huo kwa uwazi.
- source_word: ἐπλεονέκτησα
  choice: nilipata faida kwa kuwanyonya
  rationale: Kitenzi kina maana ya kujipatia faida kwa hasara ya mwingine. Usemi huu unabeba pamoja wazo la kujinufaisha na la kuwatendea wengine isivyo haki.
- source_word: ὑμᾶς
  choice: kuwanyonya
  rationale: Kiambishi “-wa-” kinawarejelea waumini wa Korintho kwa wingi kama watendwa wa kitendo kinachokanushwa katika swali.
theological_decisions: []
