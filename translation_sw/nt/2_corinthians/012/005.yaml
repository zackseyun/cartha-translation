base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/005.yaml
  text: On behalf of such a one I will boast[a], but on behalf of myself I will not boast[b], except in my weaknesses.
translation:
  language: sw
  text: Nitajisifu juu ya mtu kama huyo[a], lakini sitajisifu juu yangu mwenyewe, isipokuwa katika udhaifu wangu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Kuhusu mtu kama huyo nitajisifu.” Kihusishi cha Kigiriki kinaweza kutafsiriwa kwa maana ya jumla zaidi, kama “kuhusu” au “kwa habari ya.” Usemi “mtu kama huyo” huhifadhi namna ya Paulo ya kusema kwa njia isiyo ya moja kwa moja.
    reason: lexical_alternative
  - marker: b
    text: Kigiriki ni “katika udhaifu”; “wangu” limeongezwa kwa ajili ya uwazi. “Udhaifu” unaweza kumaanisha unyonge wa kibinadamu, mateso, au hali ambazo ndani yake nguvu za Mungu zinaonekana.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ
  choice: kwa ajili ya
  rationale: Ikiwa na hali ya umilikishi, ὑπέρ hapa humtaja mtu ambaye Paulo anajisifu kwa habari zake au kwa niaba yake. “Kwa ajili ya” huhifadhi maana hiyo ya uhusiano na mtengano wa kimkakati katika usemi wa Paulo; tanbihi inaonyesha uwezekano wa “kuhusu.”
- source_word: τοῦ τοιούτου
  choice: mtu kama huyo
  rationale: Usemi huu ni wa makusudi usio wa moja kwa moja na unaweka umbali. “Mtu kama huyo” ni Kiswahili cha kawaida na hauongezi jinsia ambayo haijawekwa wazi katika Kigiriki.
- source_word: καυχήσομαι
  choice: nitajisifu
  rationale: “Kujisifu” ni kitenzi cha sasa, wazi, na cha kawaida kwa καυχάομαι katika muktadha huu wa Paulo.
- source_word: ἐμαυτοῦ
  choice: yangu mwenyewe
  rationale: Kiwakilishi rejeshi kinamweka Paulo mwenyewe katika ulinganisho wa wazi na “mtu kama huyo.” Muundo huu ni wa asili baada ya “kwa ajili ya.”
- source_word: εἰ μὴ
  choice: isipokuwa
  rationale: Hapa εἰ μή huanzisha jambo linalotengwa, wala si sharti; “isipokuwa” huwasilisha kazi hiyo moja kwa moja.
- source_word: ἐν ταῖς ἀσθενείαις
  choice: katika udhaifu wangu
  rationale: ἀσθένεια linaweza kumaanisha unyonge wa kibinadamu, mateso, au hali zinazoonyesha uwezo wa Mungu. “Udhaifu” ni neno la sasa na pana; “wangu” limeongezwa kwa uwazi wa Kiswahili kwa sababu muktadha unaonyesha kuwa ni udhaifu wa Paulo.
theological_decisions:
- issue: Asili ya kujisifu ambako Paulo anakuruhusu
  choice: Paulo anatofautisha kujisifu kwa ajili ya mtu aliyeelezwa kwa namna ya mbali na kujisifu kwa ajili yake mwenyewe, akiruhusu kujisifu kwake mwenyewe tu katika udhaifu wake.
  alternative: “Mtu kama huyo” anaweza kueleweka kuwa mtu mwingine halisi, au kuwa njia ya Paulo kujitenga kimatamshi na tukio lake mwenyewe; pia “katika udhaifu” lingeweza kusomwa kama kanuni ya jumla.
  rationale: Tafsiri inadumisha umbali wa kimatamshi wa Paulo na mvutano wa kifundisho bila kuamua katika mstari wenyewe kama mhusika wa uzoefu uliotangulia ni Paulo au mtu mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo unaorudiwa “kwa ajili ya” umehifadhiwa ili kuonyesha ulinganifu na utofauti wa sentensi ya Kigiriki.
