  text: τί γάρ ἐστιν ὃ ⸀ἡσσώθητε ὑπὲρ τὰς λοιπὰς ἐκκλησίας, εἰ μὴ ὅτι αὐτὸς ἐγὼ οὐ κατενάρκησα ὑμῶν; χαρίσασθέ μοι τὴν ἀδικίαν ταύτην.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/013.yaml
  text: For in what were you treated as inferior to the rest of the churches[c][b][a], except that I myself did not become a burden to you? Forgive me this wrong.
translation:
  language: sw
  text: Kwa maana, ni katika jambo gani mlifanywa duni kuliko makanisa mengine[a], isipokuwa kwamba mimi mwenyewe sikuwa mzigo kwenu[b]? Nisameheni kosa hili[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mliwekwa katika hali ya chini kuliko makanisa mengine.” Kitenzi cha Kigiriki kinaweza kumaanisha kuwekwa katika hali isiyo na faida au kufanywa duni ikilinganishwa na wengine.
    reason: lexical_alternative
  - marker: b
    text: Yaani, Paulo hakuwalemea kifedha kwa kupokea msaada wao.
    reason: cultural_note
  - marker: c
    text: 'Paulo anasema kwa kejeli: lile linalodaiwa kuwa “kosa” ni kwamba alikataa kuwa mzigo kwao.'
    reason: rhetorical_note
lexical_decisions:
- source_word: ἡσσώθητε
  choice: mlitendewa kama walio duni
  rationale: Kauli tendwa inaonyesha kuwekwa katika hali ya chini au kutendewa kana kwamba ni wa kiwango cha chini; usemi huu huepuka kudokeza kuwa Wakorintho walikuwa duni kiasili.
- source_word: ὑπὲρ τὰς λοιπὰς ἐκκλησίας
  choice: kuliko makanisa mengine
  rationale: Katika muktadha huu ὑπέρ ina nguvu ya ulinganisho, nayo λοιπάς hurejelea makanisa mengine yaliyolinganishwa na kanisa la Korintho.
- source_word: αὐτὸς ἐγὼ
  choice: mimi mwenyewe
  rationale: Huhifadhi msisitizo wa kiwakilishi cha Kigiriki na mkazo binafsi wa Paulo.
- source_word: οὐ κατενάρκησα ὑμῶν
  choice: sikuwa mzigo kwenu
  rationale: Kitenzi hapa humaanisha kujitwika kwa wengine kama mzigo wa kimali au kifedha; tafsiri hii ni ya kawaida na inaendana na muktadha.
- source_word: χαρίσασθέ μοι
  choice: Nisameheni
  rationale: Katika hitimisho hili la kejeli, maana ya kuomba msamaha inafaa kuliko maana ya kutoa kwa neema.
- source_word: τὴν ἀδικίαν ταύτην
  choice: kwa kosa hili
  rationale: Hurejelea lile linalodaiwa kuwa kosa—Paulo kutowalemea—bila kuongeza uzito wa kisheria usiokuwapo katika muktadha.
- source_word: τί γάρ ἐστιν ὃ
  choice: Kwa maana, ni katika jambo gani
  rationale: Huhifadhi uhusiano wa hoja unaoletwa na γάρ na umbo la swali la balagha linalouliza ni kwa upande gani walipungukiwa.
theological_decisions:
- issue: Utetezi wa Paulo wenye kejeli kuhusu msaada wa kifedha
  choice: Kejeli imehifadhiwa kwa kutafsiri kauli moja kwa moja na kumalizia, “Nisameheni kwa kosa hili,” bila kuifafanua ndani ya mstari.
  alternative: Kuongeza maneno ya wazi kama “Nisameheni kwa kosa hili baya sana” au kusema moja kwa moja kwamba Paulo anakejeli.
  rationale: Kigiriki hutokeza kejeli kupitia muktadha na mgongano kati ya kutokuwa mzigo na kuitaja hali hiyo kuwa kosa; tafsiri haipaswi kuongeza maelezo yasiyomo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa swali la balagha na msisitizo wa “mimi mwenyewe” umehifadhiwa; maelezo ya kifedha na kejeli yamewekwa katika tanbihi badala ya kuongezwa katika matini.
