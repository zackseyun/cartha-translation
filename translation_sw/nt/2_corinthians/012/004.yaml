  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὅτι ἡρπάγη εἰς τὸν παράδεισον καὶ ἤκουσεν ἄρρητα ῥήματα ἃ οὐκ ἐξὸν ἀνθρώπῳ λαλῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/004.yaml
  text: that he was caught up into paradise and heard inexpressible words, which a man is not permitted to speak.
translation:
  language: sw
  text: kwamba alinyakuliwa mpaka paradiso na akasikia maneno yasiyoweza kutamkwa, ambayo mwanadamu haruhusiwi kuyasema.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡρπάγη
  choice: alinyakuliwa
  rationale: Kitenzi hiki huhifadhi maana ya kuchukuliwa kwa nguvu au ghafula, na pia hali ya kutendwa iliyo katika Kigiriki.
- source_word: παράδεισον
  choice: paradiso
  rationale: Neno la kawaida la kibiblia katika Kiswahili, linalohifadhi rejeleo la mahali bila kulifafanua zaidi ya chanzo.
- source_word: ἄρρητα ῥήματα
  choice: maneno yasiyoweza kutamkwa
  rationale: Huwasilisha maana ya maneno yasiyosemeka au yasiyoweza kuelezwa, huku sentensi inayofuata ikibaki kueleza tofauti ya kutoruhusiwa kuyasema.
- source_word: ἀνθρώπῳ
  choice: mwanadamu
  rationale: Hapa neno lina maana ya jumla kwa binadamu, si lazima mwanamume kwa jinsia.
- source_word: λαλῆσαι
  choice: kuyasema
  rationale: Kitenzi cha kawaida na cha asili kinachofaa kwa kutamka maneno yaliyosikiwa.
theological_decisions:
- issue: Utambulisho wa aliyenyakuliwa
  choice: alinyakuliwa
  alternative: nilinyakuliwa
  rationale: Hali ya nafsi ya tatu katika chanzo imehifadhiwa; mstari huu haupaswi kutambulisha wazi mtu huyo kuwa Paulo ingawa muktadha unaendelea kwa namna ya nafsi ya tatu.
- issue: Maana ya οὐκ ἐξόν
  choice: mwanadamu haruhusiwi kuyasema
  alternative: si halali kwa mwanadamu kuyasema
  rationale: Tafsiri hii huhifadhi wazo la kutoruhusiwa bila kubainisha chanzo au aina ya katazo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa nafsi ya tatu na mvutano kati ya 'yasiyoweza kutamkwa' na 'haruhusiwi kuyasema' umehifadhiwa.
