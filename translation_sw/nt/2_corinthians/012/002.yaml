  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οἶδα ἄνθρωπον ἐν Χριστῷ πρὸ ἐτῶν δεκατεσσάρων— εἴτε ἐν σώματι οὐκ οἶδα, εἴτε ἐκτὸς τοῦ σώματος οὐκ οἶδα, ὁ θεὸς οἶδεν— ἁρπαγέντα τὸν τοιοῦτον ἕως τρίτου οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/002.yaml
  text: I know a man in Messiah who[a], fourteen years ago—whether in the body I do not know, or outside the body I do not know[c][b], God knows—was caught up to the third heaven.
translation:
  language: sw
  text: Ninamjua mwanamume aliye katika Masihi[a] ambaye, miaka kumi na minne iliyopita—iwapo alikuwa katika mwili, sijui; au iwapo alikuwa nje ya mwili, sijui; Mungu anajua[b]—alinyakuliwa hadi mbingu ya tatu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa usemi wa jadi, “katika Kristo.” Kigiriki ni ἐν Χριστῷ; hapa cheo hicho kimetafsiriwa “Masihi” ili maana yake ibaki wazi.
    reason: alternative_reading
  - marker: b
    text: Paulo hasemi ikiwa tukio hili lilitokea katika mwili au nje ya mwili; anaacha namna ya tukio hilo bila kuamuliwa.
    reason: lexical_alternative
  - marker: c
    text: “Mbingu ya tatu” ni usemi unaohusiana na lugha ya kale ya Kiyahudi kuhusu mbingu. Tafsiri imeuhifadhi badala ya kuamua hapa unamaanisha kiwango gani cha mbingu au paradiso.
    reason: cultural_note
lexical_decisions:
- source_word: οἶδα
  choice: Ninamjua
  rationale: Kitenzi οἶδα kina maana ya wakati wa sasa hapa; umbo lenye kiambishi cha yambwa linafaa kwa mtu anayejulikana.
- source_word: ἄνθρωπον
  choice: mtu mmoja
  rationale: Neno hili linarejelea mtu mahususi; muktadha unaonyesha kuwa ni mwanamume, lakini Kiswahili cha kawaida hutumia “mtu” bila kupoteza rejeleo hilo.
- source_word: ἐν Χριστῷ
  choice: aliye katika Masihi
  rationale: “Katika” huhifadhi lugha ya Paulo ya uhusiano au umoja na Masihi, na “Masihi” huwasilisha maana ya cheo Χριστός.
- source_word: πρὸ ἐτῶν δεκατεσσάρων
  choice: miaka kumi na minne iliyopita
  rationale: Huu ndio usemi wa kawaida wa Kiswahili kwa kipindi kilichopita.
- source_word: εἴτε ἐν σώματι
  choice: iwapo alikuwa katika mwili
  rationale: Huhifadhi uwezekano wa tukio la kimwili bila kuuthibitisha.
- source_word: ἐκτὸς τοῦ σώματος
  choice: nje ya mwili
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida inayodumisha utofauti na “katika mwili.”
- source_word: ὁ θεὸς οἶδεν
  choice: Mungu anajua
  rationale: Hufuata kauli ya Kigiriki bila kuongeza wazo la “Mungu peke yake,” ambalo halijaandikwa wazi.
- source_word: ἁρπαγέντα
  choice: alinyakuliwa
  rationale: Kitenzi hiki hudokeza kuchukuliwa kwa ghafula na kwa nguvu, huku kauli tendwa ikihifadhiwa kwa ufasaha wa Kiswahili.
- source_word: ἕως τρίτου οὐρανοῦ
  choice: hadi mbingu ya tatu
  rationale: “Hadi” huwasilisha kikomo au mahali pa kufikiwa, na usemi “mbingu ya tatu” umehifadhiwa bila kufasiriwa.
theological_decisions:
- issue: Tafsiri ya Χριστῷ katika ἐν Χριστῷ
  choice: katika Masihi
  alternative: katika Kristo
  rationale: “Masihi” huonyesha wazi kuwa Χριστός ni cheo, huku tanbihi ikitaja usemi wa jadi unaofahamika.
- issue: 'Hali ya tukio: katika mwili au nje ya mwili'
  choice: Kutokuwa na uhakika kwa Paulo kumehifadhiwa katika vifungu vyote viwili.
  alternative: Kupaa kwa mwili, au ono/tukio nje ya mwili
  rationale: Andiko linarudia kwamba Paulo hajui na kwamba Mungu anajua; kwa hiyo tafsiri haiamui hali ya tukio.
- issue: Maana ya “mbingu ya tatu”
  choice: Usemi wa asili umehifadhiwa bila kuamua muundo mahususi wa ulimwengu wa mbinguni.
  alternative: mbingu ya juu kabisa; paradiso
  rationale: Usemi huo una historia ya kitamaduni na unaweza kufafanuliwa kwa njia mbalimbali; aya yenyewe haisemi wazi maana yake kamili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inadumisha urudiaji na vipande vya kati vya Kigiriki ili kutokuhakika kwa Paulo kusikike wazi, lakini alama za uandishi zimepangwa kwa usomaji wa kawaida.
