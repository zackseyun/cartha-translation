  text: And I know such a man—whether in the body or apart from the body I do not know[a]; God knows—
translation:
  language: sw
  text: Nami namjua mtu wa namna hiyo—iwe ni katika mwili au bila mwili, sijui[a]; Mungu anajua—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nje ya mwili” badala ya “bila mwili.” Paulo hasemi kama tukio hilo lilikuwa katika mwili au bila mwili.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἶδα
  choice: najua / sijui / anajua
  rationale: Kitenzi cha kawaida cha kueleza kujua. Marudio yake yamehifadhiwa ili kuendeleza msisitizo wa Kigiriki kati ya ufahamu wa Paulo na ufahamu wa Mungu.
- source_word: τὸν τοιοῦτον ἄνθρωπον
  choice: mtu wa namna hiyo
  rationale: Huelekeza kwa mtu maalumu aliyetajwa katika muktadha uliotangulia, huku ikihifadhi namna ya Paulo ya kujirejelea kwa njia isiyo ya moja kwa moja. Kiswahili 'mtu' hakifichi wala hakilazimishi utambulisho wake.
- source_word: εἴτε ... εἴτε
  choice: kama ... au
  rationale: Muundo huu wa Kiswahili unaonyesha uwezekano mbili mbadala bila kuamua ni upi uliotokea.
- source_word: ἐν σώματι
  choice: katika mwili
  rationale: Ni tafsiri ya karibu na ya kawaida katika mlinganisho huu, na haiongezi maelezo kuhusu namna ya tukio.
- source_word: χωρὶς τοῦ σώματος
  choice: nje ya mwili
  rationale: Hueleza kutengwa na mwili kwa Kiswahili cha kawaida. Haidai kwamba tukio hilo kwa hakika lilikuwa la kutoka mwilini, kwa kuwa sentensi nzima huliacha jambo hilo bila uamuzi.
- source_word: οὐκ οἶδα, ὁ θεὸς οἶδεν
  choice: sijui; Mungu anajua
  rationale: Inahifadhi tofauti iliyo wazi kati ya kutokujua kwa msemaji na kujua kwa Mungu.
- source_word: θεὸς
  choice: Mungu
  rationale: Hili ndilo neno la kawaida na lisilo na utata kwa rejeo hili.
theological_decisions:
- issue: Paulo kujirejelea kwa njia isiyo ya moja kwa moja na hali ya tukio
  choice: Kuhifadhi usemi wa nafsi ya tatu, 'mtu wa namna hiyo,' na kutosema kama tukio lilikuwa la kimwili au nje ya mwili.
  alternative: Kumtaja mtu huyo waziwazi kuwa Paulo, au kutafsiri kana kwamba bila shaka alikuwa na tukio la kutoka mwilini.
  rationale: Kigiriki kinadumisha umbali wa kimatamshi na hakiamui kati ya uwepo katika mwili na kuwa nje ya mwili; tafsiri inapaswa kuhifadhi utata huo wa kweli.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. 'Nami namjua' huunganisha aya na muktadha; vistari vinahifadhi muundo wa sentensi ambao unaendelea katika aya inayofuata.
