source:
  edition: SBLGNT
  text: Γέγονα ⸀ἄφρων· ὑμεῖς με ἠναγκάσατε· ἐγὼ γὰρ ὤφειλον ὑφ’ ὑμῶν συνίστασθαι. οὐδὲν γὰρ ὑστέρησα τῶν ὑπερλίαν ἀποστόλων, εἰ καὶ οὐδέν εἰμι·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/011.yaml
  text: I have become a fool; you forced me to it. For I ought to have been commended by you[a], for I fell short in nothing compared with those super-apostles, even if I am nothing.
translation:
  language: sw
  text: Nimekuwa mpumbavu; ninyi ndio mlionilazimisha. Kwa maana nilipaswa kusifiwa na ninyi. Kwa maana sikuwa duni kwa lolote kuliko hao mitume wakuu sana[a], hata kama mimi si kitu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hao mitume mashuhuri zaidi.” Usemi wa Kigiriki una msisitizo mkubwa sana na huenda umetumiwa kwa kejeli katika muktadha huu.
    reason: alternative_reading
lexical_decisions:
- source_word: Γέγονα
  choice: Nimekuwa
  rationale: 'Huhifadhi nguvu ya wakati timilifu wa Kigiriki: hali ya sasa iliyotokana na jambo lililotangulia.'
- source_word: ἄφρων
  choice: mpumbavu
  rationale: Ni nomino ya kawaida na yenye nguvu inayofaa kujieleza kwa Paulo kwa namna ya kejeli katika muktadha wa kujisifu.
- source_word: ὑμεῖς με ἠναγκάσατε
  choice: ninyi ndio mlionilazimisha
  rationale: Muundo wa “ndio” unahifadhi msisitizo wa kiwakilishi ὑμεῖς; jambo alilolazimishwa kufanya linaeleweka kutokana na sentensi iliyotangulia na muktadha.
- source_word: ὤφειλον
  choice: nilipaswa
  rationale: Huonyesha wajibu au jambo lililofaa kutendeka bila kuongeza maana ya lazima ya kisheria.
- source_word: ὑφ’ ὑμῶν συνίστασθαι
  choice: kusifiwa na ninyi
  rationale: Huhifadhi hali ya kutendwa na wakala aliyeonyeshwa wazi; katika muktadha, Wakorintho walipaswa kusema yanayomthibitisha Paulo na kumtetea.
- source_word: οὐδὲν ... ὑστέρησα
  choice: sikuwa duni kwa lolote
  rationale: Ni Kiswahili cha asili kinachowasilisha maana ya kutokuwa nyuma au chini ya wengine kwa jambo lolote.
- source_word: τῶν ὑπερλίαν ἀποστόλων
  choice: hao mitume wakuu sana
  rationale: Huhifadhi msisitizo mkubwa wa ὑπερλίαν na pia huacha wazi kama usemi huo ni wa kejeli au unawahusu mitume walioheshimiwa sana.
- source_word: εἰ καὶ οὐδέν εἰμι
  choice: hata kama mimi si kitu
  rationale: Huhifadhi muundo wa kukubali jambo kwa masharti na kujishusha kwa Paulo bila kuubadili kuwa “mimi si mtu wa maana.”
theological_decisions:
- issue: Nguvu na uwezekano wa kejeli katika τῶν ὑπερλίαν ἀποστόλων
  choice: hao mitume wakuu sana
  alternative: hao mitume mashuhuri zaidi; hao mitume wanaojiona wakuu kupita kiasi
  rationale: Matini ya Kigiriki ina msisitizo mkubwa, na muktadha unaweza kuifanya iwe kejeli, lakini haijumuishi neno linalomaanisha moja kwa moja “wanaojiita” au “wanaojiona.” Tafsiri kuu kwa hiyo haifanyi kejeli hiyo kuwa ya lazima, na tanbihi inaonyesha usomaji mwingine.
- issue: Kauli ya Paulo kwamba yeye si kitu
  choice: hata kama mimi si kitu
  alternative: ingawa mimi si kitu; hata kama mimi si mtu wa maana
  rationale: Tafsiri hii inadumisha mvutano kati ya madai yake kwamba si duni kwa mitume hao na kauli yake ya kujishusha, bila kujaribu kuupatanisha kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Msisitizo wa “ninyi” umeonyeshwa kwa “ninyi ndio,” huku sentensi fupi zikidumisha ukali wa hoja ya Paulo. Usemi “mitume wakuu sana” umeachwa bila alama za kunukuu ili kutolazimisha usomaji wa kejeli katika matini kuu.
