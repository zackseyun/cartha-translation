id: 2CO.12.18
reference: 2 Corinthians 12:18
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: παρεκάλεσα Τίτον καὶ συναπέστειλα τὸν ἀδελφόν· μήτι ἐπλεονέκτησεν ὑμᾶς Τίτος; οὐ τῷ αὐτῷ πνεύματι περιεπατήσαμεν; οὐ τοῖς αὐτοῖς ἴχνεσιν;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/018.yaml
  text: I urged Titus to go and sent the brother with him. Titus did not take advantage of you[a], did he? Did we not walk in the same spirit? Did we not walk in the same footsteps?
translation:
  language: sw
  text: Nilimsihi Tito, kisha nikamtuma huyo ndugu pamoja naye. Je, Tito aliwadhulumu? Je, hatukuishi kwa roho ileile[a]? Je, hatukufuata nyayo zilezile?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa Roho yuleyule”; huenda ikimaanisha Roho Mtakatifu badala ya roho au mwelekeo uleule.
    reason: alternative_reading
lexical_decisions:
- source_word: παρεκάλεσα Τίτον
  choice: Nilimsihi Tito
  rationale: παρακαλέω hapa ni ombi la dhati kuhusu utume wa Tito. “Nilimsihi” ni Kiswahili cha sasa, cha heshima, na hakiongezi waziwazi “aende,” jambo ambalo halijasemwa moja kwa moja katika Kigiriki.
- source_word: συναπέστειλα τὸν ἀδελφόν
  choice: nikamtuma huyo ndugu pamoja naye
  rationale: Kitenzi ambatano συναποστέλλω kinaonyesha kumtuma mwingine pamoja na Tito. “Huyo ndugu” humrejelea mwamini anayejulikana katika muktadha bila kuongeza kimilikishi kisichopo.
- source_word: μήτι ἐπλεονέκτησεν ὑμᾶς Τίτος
  choice: Je, Tito aliwahi kujipatia faida kwa kuwanyonya?
  rationale: μήτι huanzisha swali linalotarajia jibu la kukataa. πλεονεκτέω ni kujipatia faida kwa gharama ya mwingine; “kujipatia faida kwa kuwanyonya” huonyesha maana hiyo, ikiwemo lakini isiyoishia kwenye udanganyifu wa kifedha.
- source_word: τῷ αὐτῷ πνεύματι
  choice: kwa roho ileile
  rationale: Dativu inaweza kueleza namna au nguvu inayowezesha. “Kwa roho ileile” hudumisha uwezekano wa kumaanisha mwelekeo mmoja wa ndani au Roho Mtakatifu, bila kulazimisha mojawapo katika maandishi.
- source_word: περιεπατήσαμεν
  choice: hatukuishi
  rationale: περιπατέω imetumiwa kwa njia ya sitiari kumaanisha mwenendo wa maisha. “Kuishi” ni ya kawaida na wazi katika Kiswahili; taswira ya mwendo inadumishwa mara moja katika kishazi kinachofuata kuhusu nyayo.
- source_word: τοῖς αὐτοῖς ἴχνεσιν
  choice: kufuata nyayo zilezile
  rationale: ἴχνος ni unyayo au alama ya hatua na hapa inaonyesha mtindo uleule wa mwenendo. “Kufuata nyayo zilezile” ni nahau asilia ya Kiswahili inayohifadhi taswira hiyo.
theological_decisions:
- issue: Maana ya τῷ αὐτῷ πνεύματι
  choice: “kwa roho ileile,” bila herufi kubwa na kwa tanbihi ya ufafanuzi
  alternative: “kwa Roho yuleyule,” ikimaanisha Roho Mtakatifu
  rationale: Muktadha unasisitiza uadilifu na mwenendo unaolingana wa Paulo na Tito, hivyo mwelekeo au moyo mmoja unawezekana sana. Hata hivyo, muundo wa Kigiriki unaweza pia kueleweka kuwa Roho Mtakatifu ndiye aliyewaongoza. Tafsiri kuu pamoja na tanbihi huhifadhi mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Maswali mawili ya balagha yamehifadhiwa, na la kwanza limeundwa ili lionyeshe kwamba linatarajia jibu la kukataa. Usemi “kufuata nyayo” huhifadhi sitiari ya Kigiriki kwa namna ya kawaida katika Kiswahili.
