revisions:
- from: Nami kwa furaha kubwa sana nitatumia nilivyo navyo, tena mimi mwenyewe nitatumiwa kabisa kwa ajili ya roho zenu.[a] Ikiwa ninawapenda zaidi, je, nitapendwa kidogo?
  to: Lakini mimi nitafurahi sana kutumia vyote nilivyo navyo, nami mwenyewe nitajitoa kabisa kwa ajili ya nafsi zenu.[a] Ikiwa ninawapenda zaidi, je, ninapendwa kwa kiwango kidogo zaidi?
  rationale: “Nitafurahi sana” huwasilisha ἥδιστα, na “kutumia vyote nilivyo navyo” huendeleza picha ya δαπανήσω bila kuifunga kwenye fedha. “Nitajitoa kabisa” hutafsiri kwa Kiswahili cha asili kujiteketeza/kutumika kwa ukamilifu kunakokusudiwa na ἐκδαπανηθήσομαι. “Nafsi zenu” na tanbihi yake hudumisha upana wa ψυχή. Sehemu ya mwisho sasa hudumisha hali ya sasa ya ἀγαπῶμαι na ulinganisho wa ἧσσον.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:07:35Z'
review_pass:
  verdict: revise
  source_fidelity: Marekebisho yanahitajika katika vipengele viwili. “Nitatumiwa kabisa” kwa kawaida humaanisha mtu atatumiwa na wengine, wala si yeye kuteketezwa katika kujitoa; hivyo haisemi sawasawa picha ya ἐκδαπανηθήσομαι. Pia ἀγαπῶμαι ni wakati wa sasa wa hali ya kutendwa, si wakati ujao. “Roho” katika Kiswahili kwa kawaida huelekea πνεῦμα; “nafsi” hufunika vizuri zaidi upeo wa ψυχή hapa.
  naturalness: Matini iliyorekebishwa ni Kiswahili Sanifu cha asili na huhifadhi nguvu ya utayari wa Paulo. “Nitajitoa kabisa” ni usemi wa kawaida wa kujitolea kwa ukamilifu; ingawa hauhifadhi hali ya kutendwa kisarufi, huepuka maana potofu ya “kutumiwa.”
  terminology: “Nafsi zenu” ni istilahi inayofaa kwa ψυχῶν katika muktadha huu na haichanganyi ψυχή na πνεῦμα. Tanbihi huhifadhi maana mbadala za kileksia bila kufunga maana katika fundisho maalumu.
  issues:
  - severity: medium
    issue: “Mimi mwenyewe nitatumiwa kabisa”
    rationale: Katika matumizi ya kawaida, “kutumiwa” humaanisha kutumiwa na wakala mwingine. Hivyo inaweza kudokeza kwamba wengine wanamtumia Paulo, badala ya kwamba anajitoa/kuteketezwa kwa manufaa yao.
  - severity: medium
    issue: “Je, nitapendwa kidogo?”
    rationale: ἀγαπῶμαι ni present passive (“ninapendwa”), na ἧσσον ni ulinganisho (“kwa kiwango kidogo zaidi”), si kauli ya wakati ujao au “kidogo” pekee.
  - severity: medium
    issue: “Roho zenu” kwa ψυχῶν
    rationale: “Roho” kwa Kiswahili mara nyingi ni roho/spirit, ambapo ψυχή hapa lina upeo wa nafsi, maisha, au mtu mwenyewe. “Nafsi zenu” huepuka kuchanganya istilahi hizi.
