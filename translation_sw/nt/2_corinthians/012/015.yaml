  text: ἐγὼ δὲ ἥδιστα δαπανήσω καὶ ἐκδαπανηθήσομαι ὑπὲρ τῶν ψυχῶν ὑμῶν. ⸀εἰ περισσοτέρως ὑμᾶς ⸀ἀγαπῶν, ἧσσον ἀγαπῶμαι;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/015.yaml
  text: But I will most gladly spend and be spent for your souls. If I love you more abundantly[a], am I loved less?
translation:
  language: sw
  text: Lakini mimi nitafurahi sana kutumia vyote nilivyo navyo, nami mwenyewe nitajitoa kabisa kwa ajili ya nafsi zenu.[a] Ikiwa ninawapenda zaidi, je, ninapendwa kwa kiwango kidogo zaidi?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “maisha yenu” au “ninyi wenyewe” badala ya “nafsi zenu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥδιστα
  choice: kwa furaha kubwa sana
  rationale: Huwasilisha kiwango cha juu cha furaha na utayari wa Paulo kwa Kiswahili cha kawaida, badala ya kuonyesha kukubali tu.
- source_word: δαπανήσω
  choice: nitatumia nilivyo navyo
  rationale: Kitenzi cha Kigiriki kina picha ya kutumia au kugharimia. Kwa kuwa ‘kutumia’ kwa kawaida huhitaji kitu kinachotumiwa katika Kiswahili, ‘nilivyo navyo’ huweka maana iliyoelekezwa na muktadha bila kuibana kuwa fedha pekee.
- source_word: ἐκδαπανηθήσομαι
  choice: mimi mwenyewe nitatumiwa kabisa
  rationale: 'Huhifadhi hali ya kutendwa na msisitizo wa kitenzi: Paulo hatatumia tu alicho nacho, bali yuko tayari yeye mwenyewe kutumiwa mpaka mwisho.'
- source_word: ὑπὲρ
  choice: kwa ajili ya
  rationale: Katika muktadha huu huonyesha manufaa na kusudi la kujitoa kwake kwa ajili ya Wakorintho.
- source_word: τῶν ψυχῶν ὑμῶν
  choice: roho zenu
  rationale: Huhifadhi uzito wa neno ψυχή na lugha ya Paulo ya kuwajali kwa kina, huku tanbihi ikitaja uwezekano wa maana pana ya maisha au nafsi zao wenyewe.
- source_word: εἰ
  choice: Ikiwa
  rationale: Huhifadhi muundo wa sharti na mvutano wa swali la balagha bila kuugeuza moja kwa moja kuwa kauli ya sababu.
- source_word: περισσοτέρως
  choice: zaidi
  rationale: Ni ulinganisho wa kawaida na wenye nguvu katika Kiswahili; katika swali hili ‘zaidi’ hutofautishwa wazi na ‘kidogo.’
- source_word: ἀγαπῶν
  choice: ninawapenda
  rationale: Ingawa ni umbo la kitenzi tegemezi katika Kigiriki, kitenzi kamili ni cha asili zaidi katika sharti la Kiswahili na hudumisha maana yake.
- source_word: ἧσσον
  choice: kidogo
  rationale: Hutoa ulinganisho wa kiwango cha upendo kwa Kiswahili cha kawaida na huunda tofauti ya moja kwa moja na ‘zaidi.’
- source_word: ἀγαπῶμαι
  choice: nitapendwa
  rationale: Huhifadhi hali ya kutendwa. Wakati ujao unafaa na mtiririko wa sentensi ya Kiswahili inayotazama matokeo yanayodokezwa na sharti, bila kubadili hoja ya balagha.
theological_decisions:
- issue: Maana ya ψυχή katika muktadha wa kichungaji wa Paulo
  choice: roho zenu
  alternative: maisha yenu; ninyi wenyewe
  rationale: ‘Roho zenu’ huhifadhi lugha na uzito wa kiroho wa neno la Kigiriki bila kulifanya fundisho maalumu kuhusu sehemu za mwanadamu. Kwa kuwa ψυχή pia laweza kumaanisha maisha au mtu mwenyewe, maana hizo zimehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Marudio ya ‘nitatumia… nitatumiwa’ yamehifadhiwa kwa makusudi ili kuendeleza mchezo wa maneno na picha ya kujitoa iliyomo katika vitenzi viwili vya Kigiriki.
