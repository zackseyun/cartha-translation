  text: ⸀Πάλαι δοκεῖτε ὅτι ὑμῖν ἀπολογούμεθα; ⸀κατέναντι θεοῦ ἐν Χριστῷ λαλοῦμεν. τὰ δὲ πάντα, ἀγαπητοί, ὑπὲρ τῆς ὑμῶν οἰκοδομῆς,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/019.yaml
  text: Have you been thinking all along that we are defending ourselves to you? Before God[a], in Messiah, we are speaking. And everything, beloved[b], is for your building up.
translation:
  language: sw
  text: Je, tangu awali mmekuwa mkidhani kwamba tunajitetea kwenu? Tunasema mbele za Mungu, katika Masihi[a]. Na kila kitu, wapendwa, ni kwa ajili ya kuwajenga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika Kristo.”
    reason: alternative_rendering
lexical_decisions:
- source_word: Πάλαι
  choice: muda wote
  rationale: Katika swali hili neno hilo linaelezea dhana iliyoendelea hadi sasa, si tukio la zamani sana.
- source_word: δοκεῖτε
  choice: mmekuwa mkidhani
  rationale: Muundo huu wa Kiswahili unaonyesha dhana iliyoendelea, huku ukisomwa kwa kawaida pamoja na “muda wote.”
- source_word: ἀπολογούμεθα
  choice: tunajitetea
  rationale: Linahifadhi maana ya kujibu mashtaka au kutetea mwenendo wa mtu bila kutumia istilahi nzito ya kisheria.
- source_word: ὑμῖν
  choice: kwenu
  rationale: Hutoa maana ya kwamba utetezi huo unaelekezewa wasomaji, bila kuichanganya na kauli inayofuata kuhusu kusema mbele za Mungu.
- source_word: κατέναντι θεοῦ
  choice: mbele za Mungu
  rationale: Ni usemi wa kawaida na wenye heshima unaoonyesha kusema katika uwepo wa Mungu na chini ya hukumu yake.
- source_word: ἐν Χριστῷ
  choice: katika Masihi
  rationale: Linadumisha lugha ya kuwa katika uhusiano au umoja na Masihi na kutafsiri Χριστός kama cheo.
- source_word: λαλοῦμεν
  choice: tunasema
  rationale: Ni Kiswahili cha sasa, cha wazi, kinachohifadhi wakati wa sasa wa kitenzi.
- source_word: τὰ δὲ πάντα
  choice: Na kila kitu
  rationale: δέ hapa inaunganisha hoja kwa upole; “kila kitu” kinarejelea jumla ya maneno na matendo ya Paulo katika huduma yake.
- source_word: ἀγαπητοί
  choice: wapendwa
  rationale: Linahifadhi mwito wa upendo na uhusiano wa neno hilo na dhana ya upendo.
- source_word: ὑπὲρ τῆς ὑμῶν οἰκοδομῆς
  choice: ni kwa ajili ya kuwajenga
  rationale: Linahifadhi sitiari ya ujenzi kwa kuimarishwa kiroho kwa lugha rahisi na ya kawaida.
theological_decisions:
- issue: Tafsiri ya Χριστῷ
  choice: Masihi
  alternative: Kristo
  rationale: Katika kifungu hiki Χριστός bado inafanya kazi kama cheo; “Masihi” huonyesha maana hiyo wazi, huku tanbihi ikitaja namna nyingine iliyozoeleka.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Swali la balagha limehifadhiwa, na sentensi fupi zinazofuata zinadumisha mkazo wa maandishi ya Kigiriki.
