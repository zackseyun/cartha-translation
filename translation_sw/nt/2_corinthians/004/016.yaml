id: 2CO.4.16
reference: 2 Corinthians 4:16
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Διὸ οὐκ ⸀ἐγκακοῦμεν, ἀλλ’ εἰ καὶ ὁ ἔξω ἡμῶν ἄνθρωπος διαφθείρεται, ἀλλ’ ὁ ⸂ἔσω ἡμῶν⸃ ἀνακαινοῦται ἡμέρᾳ καὶ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/016.yaml
  text: Therefore we do not lose heart. But even if our outer man is wasting away[a], yet our inner man is being renewed day by day.
translation:
  language: sw
  text: Kwa hiyo hatukati tamaa. Lakini hata kama utu wetu wa nje[a] unachakaa, hata hivyo utu wetu wa ndani unafanywa upya siku baada ya siku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtu wetu wa nje” na “mtu wetu wa ndani.” Kigiriki kinatumia “mtu” kwa maana inayomwakilisha mwanadamu na kinaweka tofauti ya makusudi kati ya maisha ya nje na ya ndani ya mwanadamu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὸ
  choice: Kwa hiyo
  rationale: Inaonyesha hitimisho linalotokana na hoja iliyotangulia na ni usemi wa kawaida, wenye hadhi katika Kiswahili.
- source_word: οὐκ ἐγκακοῦμεν
  choice: hatukati tamaa
  rationale: Inawasilisha maana ya kutovunjika moyo au kutolegea katika ujasiri bila kudokeza tu kuacha tendo fulani.
- source_word: ἀλλ’ εἰ καὶ
  choice: Lakini hata kama
  rationale: Inahifadhi nguvu ya upinzani na hali ya kukubali jambo bila kuondoa kabisa uwezekano wa muundo wa sharti uliopo katika Kigiriki.
- source_word: ὁ ἔξω ἡμῶν ἄνθρωπος
  choice: utu wetu wa nje
  rationale: Jozi ya Kiswahili 'utu wa nje/utu wa ndani' ni ya kueleweka na huhifadhi rejeo kwa maisha ya mwanadamu bila kufanya neno hilo lihusu wanaume pekee; mbadala halisi zaidi umeelezwa katika tanbihi.
- source_word: διαφθείρεται
  choice: unachakaa
  rationale: Kitenzi hiki kinaonyesha mchakato unaoendelea wa kudhoofika au kuharibika; 'unachakaa' ni cha asili katika Kiswahili na hakidokezi kuangamizwa mara moja.
- source_word: ἀλλ’
  choice: hata hivyo
  rationale: Inasisitiza upinzani kati ya kuchakaa kwa nje na kufanywa upya kwa ndani.
- source_word: ὁ ἔσω ἡμῶν
  choice: utu wetu wa ndani
  rationale: Kinadumisha ulinganifu wa makusudi na 'utu wetu wa nje' na hakiongezi mfumo maalumu wa kugawanya mwili na roho.
- source_word: ἀνακαινοῦται
  choice: unafanywa upya
  rationale: Muundo huu unaonyesha tendo linaloendelea kutendwa kwa mhusika, kama ilivyo katika kauli tendwa ya wakati uliopo ya Kigiriki.
- source_word: ἡμέρᾳ καὶ ἡμέρᾳ
  choice: siku baada ya siku
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha kufanyika kwa jambo kwa kuendelea kila siku.
theological_decisions:
- issue: Tofauti kati ya ὁ ἔξω ἄνθρωπος na ὁ ἔσω
  choice: utu wetu wa nje / utu wetu wa ndani
  alternative: mtu wetu wa nje / mtu wetu wa ndani
  rationale: Tafsiri inadumisha tofauti kati ya maisha ya nje yanayochakaa na maisha ya ndani yanayofanywa upya, lakini haifafanui tofauti hiyo kuwa mafundisho kamili ya kugawanya mwili na roho ambayo mstari wenyewe hauyaelezi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Utu wetu wa nje/ndani' ni wa asili zaidi kuliko 'mtu wetu wa nje/ndani,' huku tanbihi ikihifadhi muundo wa moja kwa moja wa Kigiriki. Marudio ya 'Lakini ... hata hivyo' yanahifadhi vipashio viwili vya upinzani katika chanzo.
