id: 2CO.4.14
reference: 2 Corinthians 4:14
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἰδότες ὅτι ὁ ἐγείρας ⸀τὸν Ἰησοῦν καὶ ἡμᾶς ⸀σὺν Ἰησοῦ ἐγερεῖ καὶ παραστήσει σὺν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/014.yaml
  text: because we know that the one who raised Jesus will also raise us with Jesus and will present us with you[a].
translation:
  language: sw
  text: kwa maana tunajua kwamba yule aliyemfufua Yesu atatufufua sisi pia pamoja na Yesu, na atatuleta pamoja nanyi mbele zake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati zina “Bwana Yesu” badala ya “Yesu.”
    reason: textual_variant
lexical_decisions:
- source_word: εἰδότες
  choice: kwa maana tunajua kwamba
  rationale: Kirai kishirikishi kina nguvu ya kueleza sababu katika muktadha; tafsiri hii ni ya kawaida katika Kiswahili na inaunganisha tumaini hili na uvumilivu unaotajwa kabla.
- source_word: ὁ ἐγείρας
  choice: yule aliyemfufua
  rationale: Inahifadhi muundo wa kishirikishi chenye kibainishi na kumrejelea Mungu bila kuongeza jina lisilotajwa wazi katika sentensi.
- source_word: τὸν Ἰησοῦν
  choice: Yesu
  rationale: Inafuata matini kuu ya SBLGNT; usomaji mrefu zaidi umeonyeshwa katika tanbihi.
- source_word: καὶ ἡμᾶς ... ἐγερεῖ
  choice: atatufufua sisi pia
  rationale: Neno “pia” linahifadhi nguvu ya nyongeza ya καί na kuhusianisha ufufuo wa waamini na ufufuo wa Yesu.
- source_word: σὺν Ἰησοῦ
  choice: pamoja na Yesu
  rationale: σύν pamoja na hali ya dative huonyesha ushirika; “pamoja na” huepuka kuipa maana ya chombo kama “kwa njia ya Yesu.”
- source_word: παραστήσει
  choice: atatuleta ... mbele zake
  rationale: Kitenzi kina maana ya kusimamisha au kuwasilisha mbele ya mtu. Kiswahili hiki ni cha asili na kinadokeza kuletwa mbele ya Mungu bila kufafanua kupita kiasi mazingira ya kieskatolojia.
- source_word: σὺν ὑμῖν
  choice: pamoja nanyi
  rationale: Inahifadhi wazo la ushirika wa Paulo na Wakorintho katika kufufuliwa na kuletwa mbele za Mungu.
theological_decisions:
- issue: Tofauti ya matini baada ya ἐγείρας
  choice: Yesu
  alternative: Bwana Yesu
  rationale: Matini kuu ya SBLGNT ina “Yesu.” Usomaji “Bwana Yesu” una ushahidi wa hati kadhaa na umehifadhiwa katika tanbihi bila kuingizwa katika matini kuu.
- issue: Nguvu ya kieskatolojia ya παραστήσει
  choice: atatuleta pamoja nanyi mbele zake
  alternative: atatuonyesha kuwa wenye haki; atatuleta mbele ya kiti cha hukumu cha Kristo
  rationale: Muktadha wa ufufuo unaelekeza kwenye kuletwa kwa Paulo na Wakorintho pamoja mbele ya Mungu wakati ujao. Tafsiri haibainishi zaidi ikiwa ni hukumu, kukubaliwa, au uthibitisho, kwa kuwa Kigiriki hakisemi wazi hapa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Mbele zake” limetumiwa kwa Kiswahili cha asili; kiwakilishi kinamrejelea Mungu, yule aliyemfufua Yesu. Alama ya tanbihi [a] imewekwa katika matini kuu.
