source:
  edition: SBLGNT
  text: ὅτι ὁ θεὸς ὁ εἰπών· Ἐκ σκότους φῶς ⸀λάμψει, ὃς ἔλαμψεν ἐν ταῖς καρδίαις ἡμῶν πρὸς φωτισμὸν τῆς γνώσεως τῆς δόξης τοῦ θεοῦ ἐν προσώπῳ ⸀Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/006.yaml
  text: For God[a], who said[c][b], “Light will shine out of darkness,” has shone in our hearts for the illumination of the knowledge of the glory of God in the face of Messiah.
translation:
  language: sw
  text: Kwa maana Mungu aliyesema, “Nuru itaangaza kutoka gizani,”[c] ndiye aliyeangaza mioyoni mwetu ili kutupa nuru ya kuujua utukufu wa Mungu katika uso wa Masihi.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika Kristo mwenyewe.” Kirai cha Kigiriki kinaweza kueleweka kwa maana hii pana, ingawa “katika uso wa Masihi” huhifadhi taswira ya utukufu wa Mungu unaodhihirika.
    reason: alternative_reading
  - marker: b
    text: Kigiriki Χριστοῦ, ambacho kwa mapokeo hutafsiriwa “Kristo”; hapa kimetafsiriwa “Masihi” kwa sababu kinatumika kama cheo.
    reason: lexical_alternative
  - marker: c
    text: Maneno haya yanatoa mwangwi wa Mwanzo 1:3 na kutumia taswira ya nuru ya uumbaji kueleza kazi ya Mungu ya kujifunua mioyoni mwetu.
    reason: cross_reference
lexical_decisions:
- source_word: ὅτι
  choice: Kwa maana
  rationale: Katika muktadha huu neno linaonyesha sababu ya kauli iliyotangulia; “kwa maana” ni kiunganishi cha kawaida na chenye hadhi katika Kiswahili.
- source_word: ὁ θεὸς ὁ εἰπών
  choice: Mungu aliyesema
  rationale: Kirai cha Kigiriki chenye kivumishi-itenzi kimetolewa kwa kishazi rejeshi cha asili katika Kiswahili.
- source_word: Ἐκ σκότους φῶς λάμψει
  choice: Nuru itaangaza kutoka gizani
  rationale: Huhifadhi kitenzi cha wakati ujao, maana ya ἐκ ya kutoka ndani ya hali fulani, na mwangwi wa simulizi la uumbaji.
- source_word: ὃς ἔλαμψεν
  choice: ndiye aliyeangaza
  rationale: Huhifadhi Mungu mwenyewe kuwa mtendaji wa kitendo cha kuangaza, bila kukigeuza kitenzi hicho kuwa cha kusababisha; “ndiye” huunganisha kwa uwazi na Mungu aliyetajwa mwanzoni.
- source_word: ἐν ταῖς καρδίαις ἡμῶν
  choice: mioyoni mwetu
  rationale: Huhifadhi sitiari ya kibiblia ya moyo kuwa kitovu cha utu wa ndani kwa lugha ya kawaida ya Kiswahili.
- source_word: πρὸς φωτισμὸν τῆς γνώσεως
  choice: ili kutupa nuru ya kuujua
  rationale: Muundo wa kitenzi ni wa asili zaidi kuliko nomino dhahania kama “kwa ajili ya mwangaza wa ujuzi”; unadumisha kusudi la πρὸς na uhusiano kati ya nuru na kujua.
- source_word: τῆς δόξης τοῦ θεοῦ
  choice: utukufu wa Mungu
  rationale: Ni tafsiri ya moja kwa moja, ya kawaida, na yenye uzito unaofaa kwa δόξα.
- source_word: ἐν προσώπῳ Χριστοῦ
  choice: katika uso wa Masihi
  rationale: “Uso” huhifadhi taswira halisi ya πρόσωπον inayofaa muktadha wa nuru na utukufu; “Masihi” huonyesha Χριστός kama cheo.
theological_decisions:
- issue: Tafsiri ya Χριστοῦ
  choice: Masihi
  alternative: Kristo
  rationale: Katika muktadha huu neno linafanya kazi kama cheo cha yule aliyetiwa mafuta; “Masihi” hutafsiri cheo hicho badala ya kukitumia kana kwamba ni jina tu.
- issue: Maana ya ἐν προσώπῳ Χριστοῦ
  choice: katika uso wa Masihi
  alternative: katika nafsi ya Kristo
  rationale: Tafsiri ya “uso” inadumisha taswira ya nuru na udhihirisho wa utukufu wa Mungu. Maana pana ya “nafsi” inawezekana, kwa hiyo imehifadhiwa katika tanbihi bila kuondoa mvutano wa usemi wa Kigiriki.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “ili kutupa nuru ya kuujua” unapunguza udhahania usio wa kawaida wa mnyororo wa nomino bila kupoteza kusudi au taswira ya mwanga. “Katika uso wa Masihi” limeachwa kwa makusudi likiwa na uzito wa kisitiari wa maandishi asilia.
