id: 2CO.4.2
reference: 2 Corinthians 4:2
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀλλὰ ἀπειπάμεθα τὰ κρυπτὰ τῆς αἰσχύνης, μὴ περιπατοῦντες ἐν πανουργίᾳ μηδὲ δολοῦντες τὸν λόγον τοῦ θεοῦ, ἀλλὰ τῇ φανερώσει τῆς ἀληθείας ⸀συνιστάνοντες ἑαυτοὺς πρὸς πᾶσαν συνείδησιν ἀνθρώπων ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/002.yaml
  text: Instead[a], we have renounced the hidden things of shame, not walking in cunning nor falsifying the word of God[b], but by the open display of the truth commending ourselves to every human conscience before God.
translation:
  language: sw
  text: Badala yake, tumeyakataa mambo ya aibu yaliyofichwa. Hatuishi kwa hila, wala hatulipotoshi neno la Mungu.[b] Bali, kwa kuuweka ukweli wazi,[a] tunajidhihirisha kwa dhamiri ya kila mtu mbele ya Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa kuudhihirisha ukweli.” Neno la Kigiriki linasisitiza kuufanya ukweli uonekane au ujulikane wazi, si kuutangaza kwa maneno pekee.
    reason: lexical_alternative
  - marker: b
    text: Au, “wala hatulichakachui neno la Mungu.” Kitenzi cha Kigiriki kinaweza kumaanisha kuharibu kitu kwa kukibadili kwa udanganyifu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπειπάμεθα
  choice: tumeyakataa
  rationale: Kitenzi hiki kinaonyesha kukataa kwa dhati na kwa uamuzi mambo hayo. “Tumeyakataa” ni cha kawaida na chenye uzito unaofaa katika Kiswahili.
- source_word: τὰ κρυπτὰ τῆς αἰσχύνης
  choice: mambo ya aibu yaliyofichwa
  rationale: Kauli hii inadumisha uhusiano kati ya kufichwa na aibu bila kuamua ikiwa ni matendo, mbinu, au siri kwa maana finyu zaidi.
- source_word: μὴ περιπατοῦντες ἐν πανουργίᾳ
  choice: Hatuishi kwa hila
  rationale: “Kuishi” huwasilisha kwa Kiswahili cha kawaida matumizi ya sitiari ya “kutembea” yanayomaanisha mwenendo wa maisha; “kwa hila” linaonyesha ujanja usio wa uadilifu.
- source_word: δολοῦντες
  choice: hatulighushi
  rationale: “Kulighushi” linaonyesha kubadili au kuharibu kitu kwa udanganyifu. Dokezo linaweka wazi maana mbadala ya kukichakachua au kukipotosha kwa hila.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: neno la Mungu
  rationale: Hii ni tafsiri sanifu na pana ambayo haibani λόγος kuwa Maandiko pekee au mahubiri pekee.
- source_word: τῇ φανερώσει τῆς ἀληθείας
  choice: kwa kuuweka ukweli wazi
  rationale: Kauli hii inaonyesha kufunuliwa au kuwekwa wazi kwa ukweli bila kuifanya φανέρωσις imaanishe tangazo la maneno pekee.
- source_word: συνιστάνοντες ἑαυτούς
  choice: tunajionyesha
  rationale: Katika muktadha huu kitenzi kinahusu kujidhihirisha au kujitambulisha kwa namna inayoweza kukubaliwa. “Tunajionyesha” ni ya asili zaidi kuliko “tunajipendekeza,” ambalo linaweza kudokeza kujitafutia sifa.
- source_word: πρὸς πᾶσαν συνείδησιν ἀνθρώπων
  choice: kwa dhamiri ya kila mtu
  rationale: Inadumisha wazo la kila dhamiri ya kibinadamu kama shahidi au mwamuzi wa mwenendo wa wahudumu.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: mbele za Mungu
  rationale: Kauli hii ya kawaida inadumisha maana ya kutenda Mungu akiwa shahidi na mwamuzi.
theological_decisions:
- issue: Tofauti kati ya huduma ya udanganyifu na huduma ya ukweli
  choice: Aya inaeleza uwazi na uadilifu wa huduma ya Paulo mbele ya dhamiri za watu na mbele za Mungu.
  alternative: Kuifanya aya iwe tamko maalumu kuhusu mbinu za usemi pekee au fundisho pana kuhusu kila matumizi ya Maandiko.
  rationale: Muktadha wa karibu unahusu mwenendo na utangazaji wa kitume. Tafsiri haibani wala kupanua mada zaidi ya ushahidi wa maandishi.
- issue: Maana ya φανέρωσις
  choice: kuuweka ukweli wazi
  alternative: kuutangaza ukweli wazi
  rationale: Neno la Kigiriki linaweza kuhusisha kuufanya ukweli uonekane au ujulikane wazi, si lazima utangazaji wa maneno pekee; tafsiri inadumisha upana huo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. Sentensi zimegawanywa ili zisomeke kwa urahisi, huku viunganishi vya tofauti vya Kigiriki vikidumishwa. “Hatuishi” limetumiwa badala ya tafsiri halisi ya sitiari “hatutembei,” na “tunajionyesha” limeepuka dhana hasi ya kujipendekeza.
