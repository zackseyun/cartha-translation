id: 2CO.4.5
reference: 2 Corinthians 4:5
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οὐ γὰρ ἑαυτοὺς κηρύσσομεν ἀλλὰ ⸂Χριστὸν Ἰησοῦν⸃ κύριον, ἑαυτοὺς δὲ δούλους ὑμῶν διὰ Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/005.yaml
  text: For we do not proclaim ourselves[a], but Messiah Jesus as Lord[c][b], and ourselves as your servants for Jesus' sake.
translation:
  language: sw
  text: Kwa maana hatutangazi sisi wenyewe, bali tunamtangaza Yesu Masihi[a] kuwa Bwana, na sisi wenyewe kuwa watumwa[b] wenu kwa ajili ya Yesu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kristo Yesu.” Neno la Kigiriki Χριστός linaweza kutafsiriwa “Kristo” linapotumiwa kama sehemu ya jina; hapa limetafsiriwa kama cheo, “Masihi.”
    reason: lexical_alternative
  - marker: b
    text: Au, “watumishi.” Neno la Kigiriki δοῦλοι linaweza kumaanisha watumishi au watumwa; “watumwa” limetumiwa hapa kuhifadhi maana yenye nguvu zaidi ya kutawaliwa, kinyume na Yesu kuwa Bwana.
    reason: lexical_alternative
  - marker: c
    text: Au, “kwa sababu ya Yesu.”
    reason: alternative_reading
lexical_decisions:
- source_word: κηρύσσομεν
  choice: tunatangaza
  rationale: Neno hili linahifadhi maana ya kutangaza hadharani kama mjumbe, bila kuifanya kauli ihusu mahubiri rasmi pekee.
- source_word: ἑαυτοὺς
  choice: sisi wenyewe
  rationale: 'Kiwakilishi cha kujirejelea kimehifadhiwa katika sehemu zote mbili ili kuonyesha tofauti: wao si ujumbe wanaoutangaza, bali ni watumwa wa waamini.'
- source_word: Χριστὸν Ἰησοῦν
  choice: Yesu Masihi
  rationale: Masihi linahifadhi nguvu ya Χριστός kama cheo, huku mpangilio wa maneno ukifanywa kuwa wa kawaida katika Kiswahili.
- source_word: κύριον
  choice: Bwana
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa κύριος katika ungamo kuhusu Yesu; hapa linaeleza cheo ambacho Yesu anatangazwa kuwa nacho.
- source_word: δούλους
  choice: watumwa
  rationale: Watumwa linahifadhi uzito wa utegemezi na utii uliomo katika δοῦλοι, hasa katika tofauti iliyokusudiwa kati ya Yesu aliye Bwana na wahudumu wake.
- source_word: ὑμῶν
  choice: wenu
  rationale: Umbo la umilikaji linaonyesha uhusiano wa kujishusha na kuwatumikia waamini wa Korintho.
- source_word: διὰ Ἰησοῦν
  choice: kwa ajili ya Yesu
  rationale: 'διά pamoja na hali ya akusativi hapa inaeleza sababu au msukumo: wanakuwa watumwa wao kwa sababu ya Yesu na kwa ajili yake.'
theological_decisions:
- issue: Je, Χριστός itafsiriwe kama cheo au kama sehemu ya jina?
  choice: 'Cheo: “Masihi”'
  alternative: “Kristo”
  rationale: Katika kifungu hiki Yesu ndiye maudhui ya tangazo na κύριον inatumika kimahubiri kumhusu; kwa hiyo nguvu ya Χριστός kama cheo bado inaonekana.
- issue: Nguvu ya kisarufi ya Χριστὸν Ἰησοῦν κύριον
  choice: “Yesu Masihi kuwa Bwana”
  alternative: “Kristo Yesu Bwana” au “Yesu Kristo ni Bwana”
  rationale: Kauli “kuwa Bwana” inadumisha matumizi ya κύριον kama kiarifu cha yule anayetangazwa, bila kuongeza kitenzi huru cha “ni” ambacho hakipo katika Kigiriki.
- issue: Nguvu ya δοῦλοι katika kujieleza kwa Paulo na wenzake
  choice: “watumwa”
  alternative: “watumishi”
  rationale: “Watumwa” linaonyesha kikamilifu zaidi hali ya kujishusha na kutawaliwa inayowekwa kinyume na Yesu kuwa Bwana, bila kupunguza uzito wa sitiari.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “hatutangazi sisi wenyewe” unaepuka maana finyu ya mahubiri rasmi na kuhifadhi tofauti ya Kigiriki kati ya Paulo na wenzake kwa upande mmoja na Yesu anayehubiriwa kwa upande mwingine. “Yesu Masihi” ni mpangilio wa kawaida zaidi wa Kiswahili kuliko “Masihi Yesu,” ingawa Kigiriki kina Χριστὸν Ἰησοῦν.
