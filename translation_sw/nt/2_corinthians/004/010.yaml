  text: always carrying in the body the death of Jesus[a], so that the life of Jesus may also be revealed in our body.
translation:
  language: sw
  text: Sikuzote tukiendelea kubeba katika mwili mauti ya Yesu[a], ili uzima wa Yesu nao udhihirishwe katika mwili wetu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kufa kwa Yesu.” Nomino ya Kigiriki inaweza kusisitiza hali au uzoefu wa kifo unaobebwa katika mwili.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντοτε
  choice: sikuzote
  rationale: Kielezi hiki kinaonyesha hali inayoendelea daima; “sikuzote” ni cha kawaida na cha asili katika Kiswahili sanifu.
- source_word: νέκρωσιν
  choice: kufa
  rationale: Nomino hii inaweza kumaanisha hali au uzoefu wa kifo/kufa. “Kufa” hapa huonyesha mateso yanayoendelea yanayohusishwa na kifo cha Yesu, bila kuondoa uwezekano wa maana ya “mauti.”
- source_word: τοῦ Ἰησοῦ
  choice: kwa Yesu
  rationale: Muundo huu unahifadhi uhusiano mpana wa kimilikishi wa Kigiriki katika Kiswahili cha asili, bila kufafanua zaidi ikiwa ni kufa alikopitia Yesu au kufa kunakohusishwa naye.
- source_word: ἐν τῷ σώματι
  choice: katika mwili
  rationale: Kifungu cha kwanza hakina kiwakilishi cha umilikishi kilicho wazi; kutotaja “wetu” kunahifadhi tofauti hiyo na maandishi chanzo.
- source_word: περιφέροντες
  choice: tukiubeba
  rationale: Kauli endelevu huonyesha kuendelea kubeba katika maisha ya mwili; “kubeba” huhifadhi sitiari hiyo kwa Kiswahili cha kawaida.
- source_word: ἵνα
  choice: ili
  rationale: “Ili” huonyesha kusudi au matokeo kwa ufupi na kwa kawaida.
- source_word: καὶ
  choice: nao
  rationale: “Nao” huonyesha ulinganifu wa nyongeza kati ya kufa kwa Yesu na uzima wake.
- source_word: ζωὴ
  choice: uzima
  rationale: “Uzima” ni tafsiri ya kawaida ya ζωή katika muktadha wa uzima wa Yesu aliyefufuka.
- source_word: ἐν τῷ σώματι ἡμῶν
  choice: katika mwili wetu
  rationale: Umoja wa “mwili” pamoja na umilikishi wa wingi umehifadhiwa, kama katika Kigiriki, ili kudumisha mtazamo wa pamoja na ulinganifu wa sentensi.
- source_word: φανερωθῇ
  choice: udhihirishwe
  rationale: Kitenzi cha kutendwa hudumisha maana ya kitu kuwekwa wazi au kuonekana, bila kutaja mtendaji.
theological_decisions:
- issue: Maana ya νέκρωσις kuhusiana na Yesu
  choice: kufa kwa Yesu
  alternative: mauti ya Yesu
  rationale: “Kufa” huhifadhi uwezekano wa nomino hiyo kusisitiza hali au uzoefu wa kifo unaobebwa mwilini. “Mauti” ingeimarisha zaidi hali iliyokamilika; tanbihi inaweka wazi mbadala huo.
- issue: Idadi ya σώμα
  choice: Kuhifadhi umoja “mwili” katika vifungu vyote viwili
  alternative: miili yetu katika kifungu cha pili
  rationale: Kigiriki kinatumia umoja mara zote mbili. Umoja unahifadhi mtindo wa kifungu na maana ya pamoja ya huduma ya mitume.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa kishirikishi umewekwa kwa “tukiubeba” ili kuonyesha mwendelezo, huku umoja wa “mwili” ukihifadhiwa katika sehemu zote mbili.
