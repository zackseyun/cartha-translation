id: 2CO.4.18
reference: 2 Corinthians 4:18
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: μὴ σκοπούντων ἡμῶν τὰ βλεπόμενα ἀλλὰ τὰ μὴ βλεπόμενα, τὰ γὰρ βλεπόμενα πρόσκαιρα, τὰ δὲ μὴ βλεπόμενα αἰώνια.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/018.yaml
  text: as we look not to the things that are seen but to the things that are not seen. For the things that are seen are temporary[a], but the things that are not seen are eternal.
translation:
  language: sw
  text: Huku tukiwa hatuviangalii vitu vinavyoonekana, bali vitu visivyoonekana. Maana vitu vinavyoonekana ni vya muda, lakini vitu visivyoonekana ni vya milele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σκοπούντων
  choice: tuelekezi fikira zetu kwenye
  rationale: Kitenzi σκοπέω hapa humaanisha kuelekeza uangalifu au nia kwenye jambo. Usemi huu ni wa kawaida katika Kiswahili cha sasa, unahifadhi wazo la kulenga uangalifu, na muundo wa ‘kwa kuwa’ unaonyesha hali inayoandamana na kishazi kilichotangulia.
- source_word: μὴ
  choice: hatu- / visivyo-
  rationale: Ni ukanushi wa kawaida usio na maana ya wakati kama ‘si tena’; umeonyeshwa kwa maumbo asilia ya ukanushi wa Kiswahili.
- source_word: τὰ βλεπόμενα
  choice: vitu vinavyoonekana
  rationale: Kirai hiki ni kivumishi-nyenzi kilichotumiwa kama nomino katika wingi wa hali ya kati. Tafsiri hii huhifadhi urudiaji na ulinganifu wa Paulo bila kukifasiri kama ‘vitu vya kimwili.’
- source_word: ἀλλὰ
  choice: bali
  rationale: '‘Bali’ huonyesha wazi utofautishaji wenye nguvu baada ya ukanushi: si hivi, bali vile.'
- source_word: τὰ μὴ βλεπόμενα
  choice: vitu visivyoonekana
  rationale: Huhifadhi muundo unaolingana na ‘vitu vinavyoonekana’ na haibadili tofauti hiyo kuwa mgawanyo wa kifalsafa kati ya vitu vya kimwili na vya kiroho.
- source_word: γὰρ
  choice: Maana
  rationale: Huanzisha sababu au maelezo yanayounga mkono kauli iliyotangulia, kwa mtindo wa Kiswahili unaofaa maandishi ya hoja.
- source_word: πρόσκαιρα
  choice: vya muda
  rationale: Humaanisha vinavyodumu kwa kipindi kifupi au kilicho na kikomo. ‘Vya muda’ ni wazi na asilia, bila kuongeza nguvu ya maana ya ‘vya kitambo kidogo sana.’
- source_word: δέ
  choice: lakini
  rationale: Huonyesha sehemu ya pili ya utofautishaji kati ya vya muda na vya milele.
- source_word: αἰώνια
  choice: vya milele
  rationale: Katika utofautishaji huu na πρόσκαιρα, neno linaeleza vile vinavyodumu milele au vinavyohusika na enzi ijayo. ‘Vya milele’ ni tafsiri ya kawaida na ya moja kwa moja.
- source_word: ἡμῶν
  choice: tu- / zetu
  rationale: Ingawa katika Kigiriki ni kiwakilishi cha umilikishi kinachohusiana na kitenzi-nyenzi, Kiswahili hukiwakilisha kwa kawaida kama mhusika ‘sisi’ ndani ya kitenzi na katika ‘fikira zetu.’
theological_decisions:
- issue: Uto-fauti kati ya vinavyoonekana na visivyoonekana
  choice: vitu vinavyoonekana ... vitu visivyoonekana
  alternative: vitu vya kimwili ... vitu vya kiroho
  rationale: Paulo anataja hali ya kuonekana au kutoonekana, lakini hafafanui moja kwa moja kwamba tofauti hiyo ni kati ya vitu vya kimwili na vya kiroho. Tafsiri inahifadhi mvutano huo bila kuingiza mfumo wa kifalsafa usiotajwa.
- issue: Uhusiano wa kishazi na mstari uliotangulia
  choice: kwa kuwa hatuelekezi fikira zetu
  alternative: hatuviangalii
  rationale: Kigiriki kina kitenzi-nyenzi kinachotegemea kisarufi kishazi kilichotangulia. ‘Kwa kuwa’ hudumisha utegemezi huo badala ya kukifanya kuwa sentensi huru kabisa, huku ‘kuelekeza fikira’ kikionyesha uangalifu unaokusudiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa kurudiwa ‘vitu vinavyoonekana ... vitu visivyoonekana’ umehifadhiwa kwa ajili ya ulinganifu wa hoja. Hakuna tanbihi inayohitajika kwa kuwa mbadala wa Kiingereza ‘what is seen/the visible things’ huwasilishwa kwa kawaida kwa kirai kilekile cha Kiswahili.
