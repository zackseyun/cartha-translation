  rationale: Replaced the causal connector “kwa kuwa” with “Huku tukiwa” to reflect the circumstantial present participle σκοπούντων while retaining the ongoing negative sense and the passage’s connection to the prior verse. The remaining wording is retained because it faithfully and naturally conveys the Greek parallelism and contrast.
