review_pass:
  verdict: revise
  source_fidelity: Draft accurately preserves the visible/unseen contrast, the temporal/eternal antithesis, and the explanatory force of γάρ. However, “kwa kuwa” normally introduces a causal clause (“because”), whereas the Greek genitive participle is circumstantial and is better represented here as simultaneous with the preceding statement (“while/as”).
  naturalness: The repeated phrasing “vitu vinavyoonekana ... vitu visivyoonekana” is natural, clear Standard East African Swahili. “Huku tukiwa hatuviangalii” naturally retains the verse’s dependent, ongoing sense in a verse fragment.
  terminology: “Vitu vinavyoonekana,” “vitu visivyoonekana,” “vya muda,” and “vya milele” are faithful and appropriately non-sectarian. They do not impose a material/spiritual distinction absent from the Greek.
  issues:
  - severity: medium
    issue: “kwa kuwa” renders the opening participial clause as causal.
    rationale: The causal explanation in this verse is introduced by γάρ (“Maana”), not by μὴ σκοπούντων ἡμῶν. Rendering the opening as “kwa kuwa” risks making the preceding context depend on a cause that the Greek does not explicitly express. A circumstantial connector such as “Huku” better preserves the syntax and discourse relation.
  revised_text: Huku tukiwa hatuviangalii vitu vinavyoonekana, bali vitu visivyoonekana. Maana vitu vinavyoonekana ni vya muda, lakini vitu visivyoonekana ni vya milele.
