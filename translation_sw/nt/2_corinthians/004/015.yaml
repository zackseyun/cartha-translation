  text: τὰ γὰρ πάντα δι’ ὑμᾶς, ἵνα ἡ χάρις πλεονάσασα διὰ τῶν πλειόνων τὴν εὐχαριστίαν περισσεύσῃ εἰς τὴν δόξαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/015.yaml
  text: For all things are for your sake[a], so that as grace increases through more and more people, thanksgiving may overflow to the glory of God.
translation:
  language: sw
  text: Kwa maana mambo yote ni kwa ajili yenu, ili neema inapozidi kuenea kupitia watu wengi zaidi, shukrani ziongezeke kwa wingi kwa utukufu wa Mungu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ γὰρ πάντα
  choice: Kwa maana mambo yote
  rationale: “Kwa maana” huhifadhi nguvu ya γάρ ya kutoa msingi wa kauli iliyotangulia, na “mambo yote” hudumisha upana wa usemi wa Kiyunani.
- source_word: δι’ ὑμᾶς
  choice: ni kwa ajili yenu
  rationale: διά pamoja na hali ya kushutumiwa hapa huonyesha manufaa; “kwa ajili yenu” ni ya kawaida na wazi katika Kiswahili.
- source_word: ἵνα
  choice: ili
  rationale: Huonyesha kusudi au matokeo yanayokusudiwa kwa lugha fupi na ya kawaida.
- source_word: ἡ χάρις
  choice: neema
  rationale: “Neema” huhifadhi wazo la fadhili za Mungu bila kulibana kwa utaratibu maalumu wa kiteolojia.
- source_word: πλεονάσασα διὰ τῶν πλειόνων
  choice: inapowafikia watu wengi zaidi
  rationale: Muundo huu wa asili unaonyesha kuenea au kuongezeka kwa neema kupitia idadi inayoongezeka ya watu, huku tanbihi ikihifadhi uwezekano mwingine wa kisarufi.
- source_word: τὴν εὐχαριστίαν περισσεύσῃ
  choice: izidishe shukrani
  rationale: Huhifadhi wazo la shukrani kuwa nyingi au tele; umoja wa kitenzi unarejelea “neema” kama kisababishi ndani ya muundo wa Kiswahili.
- source_word: εἰς τὴν δόξαν τοῦ θεοῦ
  choice: kwa utukufu wa Mungu
  rationale: “Kwa utukufu wa Mungu” hueleza lengo au matokeo ya mwisho kwa Kiswahili cha kawaida na chenye hadhi.
theological_decisions:
- issue: Maana mahsusi ya “neema” katika kishazi cha kusudi
  choice: Imeachwa kuwa fadhili za Mungu zinazotenda na kuenea, bila kubainisha zaidi utaratibu wake.
  alternative: Neema ya wokovu inayowafikia wapokeaji wengi zaidi, au fadhili za Mungu katika huduma ya kitume zinazozaa shukrani.
  rationale: Mstari wenyewe haumlazimishi msomaji kuchagua maana moja nyembamba; tafsiri inadumisha upana na mvutano huo.
- issue: Uhusiano wa neema, watu wengi, na shukrani
  choice: Neema inaelezwa kuwafikia watu wengi zaidi na hivyo kuzidisha shukrani.
  alternative: Neema inaweza kueleweka kuwa inaongezeka “kupitia wengi” au “kupitia idadi kubwa zaidi.”
  rationale: Kiyunani kinaweza kuonyesha kuenea kwa neema kwa watu wengi zaidi au kutenda kwake kupitia watu wengi; tanbihi inahifadhi utata huo wa kweli.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imewekwa wazi kwa wasomaji wa kawaida, huku tanbihi ikihifadhi utata wa διὰ τῶν πλειόνων.
