base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/007.yaml
  text: But we have this treasure in clay jars[b][a], so that the surpassing greatness of the power may be of God and not from us.
translation:
  language: sw
  text: Lakini tuna hazina hii katika vyombo vya udongo,[a] ili ukuu upitao kawaida wa nguvu[b] uwe wa Mungu, wala si kutoka kwetu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “katika mitungi ya udongo.”
    reason: lexical_alternative
  - marker: b
    text: Au “nguvu isiyo ya kawaida” au “nguvu ipitayo kawaida.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔχομεν
  choice: tuna
  rationale: Kitenzi cha wakati uliopo, nafsi ya kwanza wingi, kinaonyesha kuwa tunayo hazina hiyo; “tuna” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: δὲ
  choice: Lakini
  rationale: Kiunganishi hiki kinaonyesha tofauti na muktadha uliotangulia; “Lakini” kinahifadhi nguvu hiyo ya upinzani.
- source_word: τὸν θησαυρὸν τοῦτον
  choice: hazina hii
  rationale: “Hazina” linawasilisha maana ya θησαυρός, na “hii” inadumisha rejeo la nyuma bila kufafanua sitiari kupita maandishi.
- source_word: ἐν ὀστρακίνοις σκεύεσιν
  choice: katika vyombo vya udongo
  rationale: ὀστράκινος humaanisha kilichotengenezwa kwa udongo uliochomwa, na σκεῦος ni chombo. Usemi huu ni wa asili na wenye hadhi, huku ukihifadhi picha ya vitu dhaifu na vya kawaida.
- source_word: ἵνα
  choice: ili
  rationale: “Ili” huanzisha kusudi na pia inaweza kuruhusu kivuli cha matokeo kilichopo katika ἵνα.
- source_word: ἡ ὑπερβολὴ τῆς δυνάμεως
  choice: ukuu usio na kifani wa nguvu hiyo
  rationale: Usemi huu huhifadhi muundo wa nomino na wazo la kiwango kinachopita kawaida katika ὑπερβολή, bila kuubana kuwa kivumishi pekee.
- source_word: ᾖ
  choice: uwe
  rationale: Hali ya utegemezi baada ya ἵνα inaonyeshwa kwa kawaida katika Kiswahili kwa “ili ... uwe.”
- source_word: τοῦ θεοῦ
  choice: wa Mungu
  rationale: Huhifadhi muundo wa uhusiano wa Kigiriki na kutoruhusu tafsiri ichague wazi kati ya umiliki na asili ya nguvu.
- source_word: καὶ μὴ ἐξ ἡμῶν
  choice: wala si kutoka kwetu
  rationale: ἐξ huonyesha chanzo; “kutoka kwetu” kinahifadhi tofauti kati ya Mungu na sisi. “Wala” huunganisha ukanushaji kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Maana ya sitiari ya “hazina” na “vyombo vya udongo”
  choice: Sitiari imeachwa bila kufafanua hazina kuwa injili au vyombo kuwa miili/udhaifu wa wanadamu.
  alternative: “hazina hii ya injili” au “katika miili yetu dhaifu”
  rationale: Muktadha unaweza kuelekeza maana hizo, lakini mstari wenyewe unaendeleza sitiari. Kuifafanua ndani ya matini kungeondoa uwazi wake wa kimakusudi.
- issue: Nguvu ya kishazi kinachoanzishwa na ἵνα
  choice: “ili ... uwe,” kinachowasilisha kusudi huku kikiruhusu pia maana ya matokeo.
  alternative: “hivyo ... ni,” kama matokeo tupu
  rationale: ἵνα inaweza kuwa na kivuli cha matokeo, lakini hapa tafsiri ya kusudi/matokeo kwa “ili” ni ya asili na hailazimishi uamuzi usio wa lazima.
- issue: Uhusiano katika τοῦ θεοῦ dhidi ya ἐξ ἡμῶν
  choice: “uwe wa Mungu wala si kutoka kwetu”
  alternative: “utoke kwa Mungu wala si kwetu”
  rationale: Tafsiri iliyochaguliwa inadumisha tofauti ya kimofolojia kati ya genitivi τοῦ θεοῦ na kirai cha chanzo ἐξ ἡμῶν, na hivyo kuhifadhi mvutano wa usemi wa Paulo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Vyombo vya udongo” ni wazi na kinahifadhi upana wa σκεύεσιν; tanbihi inatoa “mitungi” kama picha halisi zaidi. Muundo wa sentensi umehifadhi mvutano kati ya udhaifu wa vyombo na ukuu wa nguvu.
