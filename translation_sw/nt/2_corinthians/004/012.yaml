  yaml_path: translation/nt/2_corinthians/004/012.yaml
  text: So then[a], death is at work in us, but life in you.
translation:
  language: sw
  text: Hivyo basi, kifo kinafanya kazi ndani yetu[a], lakini uzima ndani yenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kifo kinatenda kazi ndani yetu, lakini uzima ndani yenu.”
    reason: Mbadala wa kimtindo kwa ἐνεργεῖται; ‘kinatenda kazi’ husisitiza utendaji wenye matokeo.
lexical_decisions:
- source_word: ὥστε
  choice: Hivyo basi
  rationale: Kirai hiki kinaonyesha matokeo au hitimisho linalotokana na maelezo ya mistari iliyotangulia, kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: ὁ θάνατος
  choice: kifo
  rationale: Nomino ya kawaida ‘kifo’ inahifadhi maana pana ya θάνατος kama uhalisi unaotenda katika mateso ya mitume, bila kuifunga kwa tukio moja tu la kufa.
- source_word: ἐν ἡμῖν
  choice: ndani yetu
  rationale: Hii inahifadhi ulinganifu wa moja kwa moja na ἐν ὑμῖν na inaweza kueleweka kwa maana ya uzoefu wa kimwili na wa pamoja wa Paulo na watumishi wenzake.
- source_word: ἐνεργεῖται
  choice: kinatenda kazi
  rationale: Kauli hii inaonyesha utendaji unaoendelea na wenye matokeo, bila kutumia lugha ya kitaalamu.
- source_word: ἡ δὲ ζωὴ
  choice: lakini uzima
  rationale: ‘Lakini’ inaonyesha tofauti iliyo katika δέ, huku ‘uzima’ ikihifadhi neno halisi na upana wake wa kitheolojia.
- source_word: ἐν ὑμῖν
  choice: ndani yenu
  rationale: Inadumisha ulinganifu mfupi wa Kigiriki na kuacha wazi maana ya mtu mmoja mmoja na ya jumuiya.
theological_decisions:
- issue: Maana ya tofauti kati ya kifo na uzima
  choice: Kudumisha maneno mafupi ‘kifo’ na ‘uzima’ bila kuyaeleza zaidi katika matini kuu.
  alternative: Kufafanua kuwa mitume wanapata mateso yanayofanana na kifo, huku Wakorintho wakipokea uzima wa kiroho kupitia huduma yao.
  rationale: Muktadha unahusisha mateso ya kimwili ya mitume na uzima wa Yesu unaodhihirishwa kupitia huduma yao. Tafsiri isifunge kauli hii kwa maana ya kimwili pekee wala ya kiroho pekee.
- issue: Kitenzi kilichoachwa katika kishazi cha pili
  choice: 'Kuacha kitenzi kisirudiwe: ‘lakini uzima ndani yenu.’'
  alternative: ‘lakini uzima unatenda kazi ndani yenu.’
  rationale: Kigiriki kinaacha kitenzi katika kishazi cha pili, na Kiswahili kinaweza kueleweka kwa muundo huu mfupi. Hivyo nguvu ya ulinganifu kati ya kifo na uzima inadumishwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Kifo’ ni cha kawaida na kinachoeleweka zaidi kuliko ‘mauti,’ huku ‘uzima’ ukihifadhi ulinganifu wa kitheolojia na kifasihi.
