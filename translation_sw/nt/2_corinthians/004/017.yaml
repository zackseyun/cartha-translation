  yaml_path: translation/nt/2_corinthians/004/017.yaml
  text: For our momentary light affliction is producing for us an eternal weight of glory beyond all comparison,[a]
translation:
  language: sw
  text: Kwa maana dhiki yetu nyepesi ya muda mfupi inatufanyia uzito wa milele wa utukufu unaopita kiasi sana,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa kiwango kinachozidi mno”; Kigiriki, kwa tafsiri ya moja kwa moja, “kwa kupita kiasi hadi kupita kiasi,” usemi unaoonyesha kiwango cha juu sana.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραυτίκα
  choice: ya muda mfupi
  rationale: Kirai hiki cha Kiswahili kinaonyesha kuwa dhiki ni ya sasa na ya kupita, huku kikidumisha utofauti wake na “wa milele.”
- source_word: ἐλαφρὸν
  choice: nyepesi
  rationale: “Nyepesi” inadumisha taswira na utofauti wa kimakusudi kati ya dhiki iliyo nyepesi na “uzito” wa utukufu.
- source_word: θλίψεως
  choice: dhiki
  rationale: “Dhiki” ni neno la kawaida na lenye hadhi linalojumuisha shinikizo, taabu, na mateso bila kuingiza maana maalumu ya kimadhehebu.
- source_word: ἡμῶν
  choice: yetu
  rationale: Kiwakilishi hiki kinaonyesha kuwa dhiki hiyo ni ya Paulo na wenzake, bila kufuta uwezekano wa matumizi mapana kwa waamini.
- source_word: καθ’ ὑπερβολὴν εἰς ὑπερβολὴν
  choice: usio na kifani
  rationale: Usemi huu wa asili unarudia wazo la kuzidi ili kusisitiza kiwango kisicho cha kawaida. “Usio na kifani” huwasilisha nguvu hiyo kwa Kiswahili cha asili bila tafsiri ngumu ya neno kwa neno.
- source_word: αἰώνιον
  choice: wa milele
  rationale: Hii inadumisha utofauti wa wazi kati ya muda mfupi wa dhiki na kudumu kwa uzito wa utukufu.
- source_word: βάρος
  choice: uzito
  rationale: “Uzito” huhifadhi sitiari ya Paulo na utofauti wake na “nyepesi”; “mzigo” ungeweza kudokeza kitu cha kuonea au kusumbua.
- source_word: δόξης
  choice: wa utukufu
  rationale: Muundo wa nomino “uzito wa ... utukufu” umehifadhiwa ili kutopunguza taswira yenye nguvu ya maandishi ya asili.
- source_word: κατεργάζεται
  choice: inatuzalia
  rationale: “Inatuzalia” huonyesha matokeo yanayotokezwa kwa ufanisi na dhiki, na pia ni Kiswahili cha kawaida kuliko tafsiri ngumu ya moja kwa moja.
- source_word: ἡμῖν
  choice: -tu- katika “inatuzalia”
  rationale: Kiambishi hiki kinaonyesha kuwa matokeo hayo yanatokea kwa ajili yetu, bila kudai kwamba mchakato huo ni wa ndani yetu tu.
- source_word: τὸ ... ἐλαφρὸν τῆς θλίψεως ἡμῶν
  choice: dhiki yetu nyepesi ya muda mfupi
  rationale: Mpangilio huu ni wa asili katika Kiswahili na unahifadhi umilikaji, wepesi, na ufupi wa dhiki.
theological_decisions:
- issue: Jinsi dhiki inavyohusiana na utukufu
  choice: Dhiki ya sasa inatajwa kuwa inaleta kwa waamini matokeo ya utukufu wa milele, bila kusema kwamba mateso yanastahili au yananunua wokovu.
  alternative: Kueleza kwamba dhiki hujipatia utukufu kwa kustahili, au kwamba inaleta tu ukomavu wa kiroho wa sasa.
  rationale: Utofauti kati ya “muda mfupi” na “milele” unaelekeza kwenye matokeo ya baadaye, lakini tafsiri haiongezi maelezo ya mfumo kuhusu ustahili. “Inatuzalia” inadumisha lugha yenye nguvu ya matokeo katika maandishi yenyewe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Taswira ya “nyepesi” dhidi ya “uzito” na mvutano wa “muda mfupi” dhidi ya “milele” imehifadhiwa.
