lexical_decisions:
- source_word: ἐν παντί
  choice: kwa kila namna
  rationale: Kirai hiki kinaonyesha upana wa hali au namna ya mateso, si lazima kuzungukwa kihalisi kutoka pande zote.
- source_word: θλιβόμενοι
  choice: tunateswa
  rationale: Kitenzi kina maana ya kuwekwa chini ya shinikizo au dhiki; “tunateswa” ni Kiswahili cha kawaida kinachofaa muktadha wa taabu za Paulo.
- source_word: στενοχωρούμενοι
  choice: hatubanwi
  rationale: Neno la Kigiriki lina taswira ya kufinywa katika nafasi nyembamba. “Hatubanwi” huhifadhi taswira hiyo na tofauti kati ya shinikizo linalowapata na kutofungiwa kabisa bila nafasi.
- source_word: ἀπορούμενοι
  choice: tunatatanika
  rationale: Hueleza hali ya kutokuwa na hakika au kutojua la kufanya; “tunatatanika” ni ya asili na inaeleweka katika Kiswahili cha sasa.
- source_word: ἐξαπορούμενοι
  choice: hatufikii kukata tamaa kabisa
  rationale: Kitenzi ambatani kinazidisha maana ya ἀπορέω. Tafsiri hii huhifadhi mpito kutoka kutatanika hadi hali kali zaidi inayokanushwa.
- source_word: ἀλλ’ οὐ ... ἀλλ’ οὐκ
  choice: lakini ... lakini
  rationale: Urudiaji huu huhifadhi mdundo na ulinganifu wa vipingamizi vya Paulo.
theological_decisions:
- issue: Kiwango cha uzidishaji katika jozi ya pili ya vitenzi
  choice: “hatufikii kukata tamaa kabisa” ili kutofautisha ἐξαπορούμενοι na ἀπορούμενοι
  alternative: “hatukosi kabisa la kufanya”
  rationale: Chaguo kuu linaonyesha hali kali inayokanushwa bila kuifanya aya kuwa tamko la kiufundi kuhusu kupoteza imani; tanbihi huhifadhi uwezekano wa maana ya kuwa bila njia au jawabu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa vipashio viwili na urudiaji wa “lakini” umehifadhiwa. “Hatubanwi” limetumiwa ili kudumisha sitiari ya Kigiriki ya nafasi nyembamba bila kutumia usemi mzito au usio wa kawaida.
