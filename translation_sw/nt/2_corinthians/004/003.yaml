base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/003.yaml
  text: And even if our gospel is veiled[a], it is veiled among those who are perishing,
translation:
  language: sw
  text: Lakini hata ikiwa Habari Njema yetu imefunikwa[a], imefunikwa miongoni mwa wale wanaoangamia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “imefunikwa kwa wale wanaoangamia,” au “imefunikwa miongoni mwa waliopotea.”
    reason: Mbadala wa kileksika unaohifadhi uwezekano wa ἐν kumaanisha “kwa” na wa ἀπολλυμένοις kutafsiriwa “waliopotea.”
lexical_decisions:
- source_word: εἰ δὲ καὶ
  choice: Lakini hata ikiwa
  rationale: Huwasilisha kwa Kiswahili cha kawaida maana ya sharti lenye ukubali wa hoja; “lakini” inadumisha nguvu ya δέ ya kuendeleza au kutofautisha wazo, na “hata” inadumisha msisitizo wa καί.
- source_word: κεκαλυμμένον
  choice: imefunikwa
  rationale: Ni hali timilifu ya kutendwa kutoka καλύπτω. “Imefunikwa” inadumisha sitiari ya kifuniko iliyotangulia katika 3:14–16, badala ya kuifanya kuwa kauli tambarare ya “imefichwa.”
- source_word: τὸ εὐαγγέλιον ἡμῶν
  choice: Habari Njema yetu
  rationale: Inadumisha kiwakilishi milikishi ἡμῶν na kutoa εὐαγγέλιον kwa usemi wa Kiswahili unaoeleweka na uliozoeleka bila kuongeza wazo la “tunayohubiri,” ambalo halijaelezwa wazi katika kirai hiki.
- source_word: ἐν τοῖς ἀπολλυμένοις
  choice: miongoni mwa wale wanaoangamia
  rationale: “Miongoni mwa” huakisi ἐν pamoja na hali ya utoaji/rejeleo badala ya kuibadili moja kwa moja kuwa uelekeo. “Wanaoangamia” huhifadhi hali au mchakato unaoendelea wa kitenzi kishirikishi ἀπολλυμένοις.
- source_word: ἐστὶν κεκαλυμμένον
  choice: imefunikwa
  rationale: Kurudia kiarifu kunadumisha msisitizo wa Kigiriki. Kiswahili kinaweza kurudia “imefunikwa” kwa uwazi bila kuhitaji kiwakilishi cha ziada.
theological_decisions:
- issue: Maana ya ἀπολλυμένοις katika muktadha wa wokovu wa Paulo
  choice: wale wanaoangamia
  alternative: wale waliopotea
  rationale: “Wanaoangamia” inadumisha hali au mchakato unaoendelea na mvutano wa kitheolojia wa kirai hicho, bila kuufanya mapema kuwa utambulisho tuli wa “waliopotea.”
- issue: Uhusiano unaowasilishwa na ἐν τοῖς ἀπολλυμένοις
  choice: miongoni mwa wale wanaoangamia
  alternative: kwa wale wanaoangamia
  rationale: “Miongoni mwa” huhifadhi kwa karibu maana ya eneo, mazingira, au kundi la rejeleo inayowezekana kwa ἐν; hata hivyo, “kwa” pia inawezekana kimuktadha na imeonyeshwa katika tanbihi badala ya kufuta utata huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Habari Njema” ni rahisi kueleweka huku ikidumisha maana ya εὐαγγέλιον; herufi kubwa zimetumiwa kama jina lililozoeleka la ujumbe wa injili. Muundo wa kurudia “imefunikwa” umehifadhiwa kwa sababu ni msisitizo wa makusudi katika chanzo.
