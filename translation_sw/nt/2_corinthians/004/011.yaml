id: 2CO.4.11
reference: 2 Corinthians 4:11
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀεὶ γὰρ ἡμεῖς οἱ ζῶντες εἰς θάνατον παραδιδόμεθα διὰ Ἰησοῦν, ἵνα καὶ ἡ ζωὴ τοῦ Ἰησοῦ φανερωθῇ ἐν τῇ θνητῇ σαρκὶ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/011.yaml
  text: For we who are living are always being handed over to death for Jesus’ sake[b][a], so that the life of Jesus also may be revealed in our mortal flesh.
translation:
  language: sw
  text: Kwa maana sisi tulio hai sikuzote tunatiwa mikononi mwa kifo kwa sababu ya Yesu,[a] ili uzima wa Yesu pia udhihirishwe katika mwili wetu wenye kufa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa ajili ya Yesu.”
    reason: lexical_alternative
  - marker: b
    text: “Mwili” hapa humaanisha maisha ya kimwili yenye kufa, si “asili ya dhambi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀεὶ
  choice: sikuzote
  rationale: Inaonyesha hali inayotokea daima au kwa kuendelea; “sikuzote” ni ya kawaida na ya moja kwa moja katika Kiswahili.
- source_word: γάρ
  choice: Kwa maana
  rationale: Inaunganisha mstari huu na uliotangulia kama maelezo, bila kufafanua uhusiano huo kupita kiasi.
- source_word: οἱ ζῶντες
  choice: sisi tulio hai
  rationale: Inahifadhi umbo la kirai cha Kigiriki na mgongano wake wa kimakusudi na “kifo.”
- source_word: εἰς θάνατον
  choice: mwa kifo
  rationale: Pamoja na “tunatiwa mikononi,” inaeleza hatima au mamlaka ambayo wahudumu wanawekwa chini yake; Kiswahili hiki ni cha asili kuliko tafsiri ya neno kwa neno “kwenda kifoni.”
- source_word: παραδιδόμεθα
  choice: tunatiwa mikononi
  rationale: Wakati wa sasa na hali tendwa zinaonyesha tendo linaloendelea ambalo mhusika wake hajatamkwa. Nahau hii huhifadhi wazo la kukabidhiwa chini ya mamlaka au hatari.
- source_word: διὰ Ἰησοῦν
  choice: kwa sababu ya Yesu
  rationale: διά pamoja na hali ya accusative kwa kawaida huonyesha sababu. Tafsiri hii huhifadhi wazi maana ya mateso yanayowapata kwa sababu ya Yesu, huku tanbihi ikitaja uwezekano wa “kwa ajili ya Yesu.”
- source_word: ἵνα
  choice: ili
  rationale: Huonyesha kusudi au matokeo; “ili” ni kifupi na cha kawaida katika Kiswahili.
- source_word: καὶ
  choice: pia
  rationale: Inadumisha ulinganifu kati ya kukabili kifo kwa sababu ya Yesu na uzima wa Yesu kudhihirishwa.
- source_word: ἡ ζωὴ τοῦ Ἰησοῦ
  choice: uzima wa Yesu
  rationale: “Uzima” huonyesha uhai kwa nguvu na hudumisha tofauti ya kitheolojia na kifo; muundo wa “wa Yesu” unaakisi kirai cha Kigiriki bila kukiamulia zaidi.
- source_word: φανερωθῇ
  choice: udhihirishwe
  rationale: Inahifadhi hali tendwa na wazo la kuonekana wazi bila kuongeza mtendaji ambaye Kigiriki hakumtaji.
- source_word: ἐν τῇ θνητῇ σαρκὶ ἡμῶν
  choice: katika mwili wetu wenye kufa
  rationale: Katika muktadha huu σάρξ ni maisha ya kimwili yaliyo dhaifu na yenye kufa, si “asili ya dhambi.” “Mwili” ni Kiswahili cha kawaida na wazi kwa maana hii ya kimwili, huku umoja wa pamoja ukihifadhiwa.
theological_decisions:
- issue: Maana ya σάρξ katika muktadha wa Paulo
  choice: mwili
  alternative: nyama; asili ya dhambi
  rationale: Kivumishi “wenye kufa” kinaonyesha wazi kuwa Paulo anazungumzia uwepo wa kimwili unaoweza kufa. “Mwili” huwasilisha maana hiyo kwa Kiswahili cha asili; “asili ya dhambi” ingeleta maana ya kimaadili isiyokuwapo hapa, na “nyama” inaweza kueleweka kama tishu au chakula.
- issue: Nguvu ya διὰ Ἰησοῦν
  choice: kwa sababu ya Yesu
  alternative: kwa ajili ya Yesu
  rationale: Muundo wa διά na accusative huunga mkono sababu, lakini katika muktadha sababu hiyo inahusiana na uaminifu kwa Yesu. Maandishi makuu yanaweka maana ya kisarufi iliyo wazi zaidi, na tanbihi inalinda uwezekano wa maana ya kusudi au kujitoa.
- issue: Mtendaji wa παραδιδόμεθα na φανερωθῇ
  choice: hali tendwa bila kumtaja mtendaji
  alternative: Mungu anatukabidhi; Mungu anaudhihirisha
  rationale: Kigiriki hakimtaji mtendaji moja kwa moja. Kutomwongeza huhifadhi uwazi wa kimakusudi kuhusu wakala wa mateso na wa udhihirisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. “Tunatiwa mikononi mwa kifo” hudumisha taswira ya kukabidhiwa bila kuwa ngumu kupita kiasi; “mwili wetu wenye kufa” ni ya asili kuliko “nyama yetu yenye kufa.”
