id: 2CO.4.13
reference: 2 Corinthians 4:13
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἔχοντες δὲ τὸ αὐτὸ πνεῦμα τῆς πίστεως, κατὰ τὸ γεγραμμένον· Ἐπίστευσα, διὸ ἐλάλησα, καὶ ἡμεῖς πιστεύομεν, διὸ καὶ λαλοῦμεν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/013.yaml
  text: But having the same spirit of faith[a], according to what is written, “I believed; therefore I spoke,” we also believe; therefore we also speak[b],
translation:
  language: sw
  text: Lakini tukiwa na roho ileile ya imani[a], kama ilivyoandikwa, “Niliamini, kwa hiyo nilisema,” sisi pia tunaamini, kwa hiyo pia tunasema[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Roho yuleyule wa imani,” ikiwa πνεῦμα hapa inamrejelea Roho Mtakatifu badala ya mwelekeo wa pamoja uliojaa imani.
    reason: alternative_reading
  - marker: b
    text: Paulo ananukuu Zaburi 116:10 (115:1 katika Septuajinti), akiunganisha imani na kusema kwake mwenyewe na ushuhuda wa mtunga zaburi.
    reason: cross_reference
lexical_decisions:
- source_word: Ἔχοντες
  choice: tukiwa na
  rationale: Muundo wa hali unaendeleza mtiririko wa kirai cha Kigiriki kuelekea kitenzi kikuu bila kuamua wazi kwamba uhusiano wake ni wa sababu.
- source_word: δὲ
  choice: Lakini
  rationale: Neno hili linaonyesha tofauti au hatua mpya nyepesi katika hoja ya Paulo; “Lakini” linafaa katika muktadha huu.
- source_word: τὸ αὐτὸ πνεῦμα τῆς πίστεως
  choice: roho ileile ya imani
  rationale: Tafsiri hii inadumisha muundo wa Kigiriki na uwezekano mkuu wa maana ya mwelekeo au msukumo wa ndani unaotawaliwa na imani, bila kufuta uwezekano wa kumrejelea Roho Mtakatifu.
- source_word: κατὰ τὸ γεγραμμένον
  choice: kama ilivyoandikwa
  rationale: Huu ni usemi wa kawaida na wenye heshima wa Kiswahili wa kutanguliza nukuu ya Maandiko.
- source_word: Ἐπίστευσα
  choice: Niliamini
  rationale: Wakati uliopita wa kitenzi unaonyeshwa moja kwa moja, huku uhusiano wa msamiati wa imani na kuamini ukihifadhiwa.
- source_word: διὸ
  choice: kwa hiyo
  rationale: Usemi huu unaonyesha matokeo au hitimisho katika sehemu zote mbili ambako neno hilo limetumiwa.
- source_word: ἐλάλησα
  choice: nilisema
  rationale: Katika nukuu hii, “nilisema” ni Kiswahili cha kawaida na cha moja kwa moja kwa tendo la kunena.
- source_word: καὶ ἡμεῖς πιστεύομεν
  choice: sisi pia tunaamini
  rationale: Kiwakilishi kilichotajwa wazi pamoja na “pia” kinahifadhi mkazo na ulinganifu kati ya Paulo na msemaji wa Zaburi.
- source_word: διὸ καὶ λαλοῦμεν
  choice: kwa hiyo pia tunasema
  rationale: Muundo huu unahifadhi ulinganifu wa kimantiki na wa kibalagha na maneno ya nukuu.
theological_decisions:
- issue: Ikiwa πνεῦμα inamaanisha Roho Mtakatifu au roho/mwelekeo wa pamoja wenye imani
  choice: roho ileile ya imani
  alternative: Roho yuleyule wa imani
  rationale: Muktadha unaunganisha kauli ya Paulo na ushuhuda, “Niliamini, kwa hiyo nilisema,” hivyo maana ya mwelekeo au msukumo wa ndani wenye imani inaelekea kufaa. Hata hivyo, Kigiriki hakiondoi uwezekano wa kumrejelea Roho Mtakatifu; kwa hiyo uwezekano huo umehifadhiwa katika tanbihi.
- issue: Uwasilishaji wa kundi la maneno πιστ-
  choice: imani / kuamini
  alternative: kutumaini
  rationale: “Imani” na “kuamini” ni maneno ya kawaida, yanayoeleweka, na yanadumisha uhusiano wa kimsamiati kati ya πίστις na πιστεύω.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaoeleweka. “Tukiwa na” linahifadhi mtiririko wa kirai cha Kigiriki, huku “kama ilivyoandikwa” likitoa utangulizi wa kawaida wa nukuu ya Maandiko. Herufi ndogo katika “roho” inadumisha usomaji mkuu bila kuficha usomaji mbadala unaotajwa katika tanbihi.
