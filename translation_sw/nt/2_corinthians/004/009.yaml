lexical_decisions:
- source_word: διωκόμενοι
  choice: tunateswa
  rationale: Katika muktadha wa Paulo, neno hili linaonyesha kufuatiliwa na kuonewa kwa uhasama. “Tunateswa” ni Kiswahili cha kawaida na cha moja kwa moja kinachowasilisha mateso yanayosababishwa na wapinzani.
- source_word: ἐγκαταλειπόμενοι
  choice: hatuachwi
  rationale: Kitenzi hiki humaanisha kuachwa nyuma, kutelekezwa, au kuachwa bila msaada. “Hatuachwi” ni cha asili katika Kiswahili na hakiongezi kwa lazima mhusika ambaye maandishi ya Kigiriki hayamtaji wazi.
- source_word: καταβαλλόμενοι
  choice: tunaangushwa chini
  rationale: Neno hili lina maana ya kutupwa au kuangushwa chini. Tafsiri hii inadumisha taswira halisi ya mtu kuangushwa, ambayo inatofautishwa na kuangamizwa kabisa.
- source_word: ἀπολλύμενοι
  choice: hatuangamizwi
  rationale: Katika ulinganisho huu, maana ni kwamba kuangushwa hakufikii maangamizi ya mwisho. “Hatuangamizwi” hudumisha nguvu ya utofautishaji huo.
- source_word: ἀλλ’ οὐκ
  choice: lakini hatu-
  rationale: Muundo wa “lakini hatu-” unahifadhi ukanushaji wa mkazo na mlingano wa vifungu viwili vya Kigiriki.
theological_decisions:
- issue: Ikiwa ἐγκαταλειπόμενοι itafsiriwe kwa neno lenye uzito wa kitheolojia zaidi kama “kutelekezwa” au kwa usemi mpana “kuachwa”
  choice: hatuachwi
  alternative: hatutelekezwi
  rationale: “Hatuachwi” huhifadhi uwezekano wa kuachwa bila msaada bila kumtaja Mungu waziwazi au kulazimisha mwangwi maalumu wa kifungu kingine. Hivyo utata wa mhusika anayeweza kuwaacha unabaki kama ulivyo katika Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa vipashio sambamba na marudio ya “lakini hatu-” umehifadhiwa ili kuakisi mkazo wa Kigiriki. Hakuna tanbihi iliyoongezwa kwa kuwa tofauti za kileksia zinaweza kuwasilishwa wazi katika maandishi bila kubebesha mstari maelezo yasiyo ya lazima.
