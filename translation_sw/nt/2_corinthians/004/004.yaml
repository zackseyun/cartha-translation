id: 2CO.4.4
reference: 2 Corinthians 4:4
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐν οἷς ὁ θεὸς τοῦ αἰῶνος τούτου ἐτύφλωσεν τὰ νοήματα τῶν ἀπίστων εἰς τὸ μὴ ⸀αὐγάσαι τὸν φωτισμὸν τοῦ εὐαγγελίου τῆς δόξης τοῦ Χριστοῦ, ὅς ἐστιν εἰκὼν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/004.yaml
  text: In their case[a], the god of this age has blinded the minds of the unbelieving, so that the light of the gospel of the glory of Messiah, who is the image of God[c][b], might not shine on them.
translation:
  language: sw
  text: Kwa hao, mungu wa enzi hii[a] amepofusha akili za wasioamini, ili nuru ya injili ya utukufu wa Masihi[b], aliye mfano wa Mungu, isiwaangazie.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mungu wa ulimwengu huu.” Kwa kawaida neno la Kigiriki aiōn humaanisha “enzi,” likikazia kipindi hiki cha sasa kilicho chini ya uovu.
    reason: lexical_alternative
  - marker: b
    text: Kigiriki Christos; limetafsiriwa “Masihi” hapa kwa sababu linatumika kama cheo.
    reason: lexical_alternative
  - marker: c
    text: Au, “ili wasione nuru ya injili ya utukufu wa Masihi.” Kitenzi hiki adimu kinaweza kukazia ama nuru kuwaangazia ama wao kuiona.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν οἷς
  choice: Kwao
  rationale: Kifungu hiki kinawarejelea watu wanaopotea na wasioamini waliotajwa katika muktadha uliotangulia. “Kwao” ni Kiswahili cha kawaida kinachoonyesha kwamba jambo hili linawahusu, bila kudokeza kuwamo ndani yao.
- source_word: ὁ θεὸς τοῦ αἰῶνος τούτου
  choice: mungu wa enzi hii
  rationale: “Enzi” hudumisha maana ya αἰών kama kipindi cha sasa, badala ya kuifanya iwe sawa moja kwa moja na ulimwengu ulioumbwa. Herufi ndogo katika “mungu” humtofautisha mtawala huyu wa uongo na Mungu wa kweli.
- source_word: ἐτύφλωσεν
  choice: amepofusha
  rationale: Kauli timilifu inaonyesha tendo lililotokea ambalo matokeo yake yanaendelea kuwapo katika muktadha huu.
- source_word: τὰ νοήματα τῶν ἀπίστων
  choice: akili za wasioamini
  rationale: νόημα hapa inahusu uwezo wa kufikiri na kuelewa, si mawazo fulani tu; ἄπιστοι ni wale wasioamini.
- source_word: εἰς τὸ μὴ αὐγάσαι
  choice: ili ... isiwaangazie
  rationale: Muundo huu unaonyesha kusudi au matokeo. Tafsiri kuu inachukua nuru kuwa ndiyo inayowaangazia, huku uwezekano wa maana ya wao kutoiona ukiwekwa katika tanbihi.
- source_word: τὸν φωτισμὸν τοῦ εὐαγγελίου
  choice: nuru ya injili
  rationale: “Nuru” ni ya asili na wazi katika sitiari hii, na “injili” ni neno lililoeleweka sana katika Kiswahili cha sasa.
- source_word: τῆς δόξης τοῦ Χριστοῦ
  choice: ya utukufu wa Masihi
  rationale: Mfuatano wa vimilikishi umehifadhiwa badala ya kubadilishwa kuwa “injili tukufu,” ili kudumisha uhusiano wa nuru, injili, utukufu, na Masihi. Χριστός inatumika hapa kama cheo.
- source_word: ὅς ἐστιν εἰκὼν τοῦ θεοῦ
  choice: aliye sura ya Mungu
  rationale: “Sura ya Mungu” hutoa kwa ufupi dai la moja kwa moja la maandiko kuhusu uhusiano wa Masihi na Mungu bila kuongeza ufafanuzi wa kimadhehebu.
theological_decisions:
- issue: Anayerejelewa na “mungu wa enzi hii”
  choice: Kifungu chenyewe kimehifadhiwa bila kubadilishwa kuwa “Shetani.”
  alternative: Kutaja moja kwa moja “Shetani,” au kutafsiri kuwa mfumo wa ulimwengu usio na nafsi.
  rationale: Kigiriki kinaelekea kumaanisha mamlaka ovu yenye nafsi, lakini hakimtaji Shetani kwa jina katika aya hii. Kutunza usemi wa chanzo huepuka kufasiri kupita maandishi.
- issue: Maana ya αὐγάσαι pamoja na φωτισμός
  choice: Nuru ya injili ndiyo isiyowaangazia wasioamini.
  alternative: Wasioamini hawaioni nuru ya injili.
  rationale: Kitenzi hiki ni nadra na kinaweza kueleweka ama kuhusu nuru kung’aa ama kuhusu mtu kuiona. Maana mbadala imehifadhiwa katika tanbihi.
- issue: Nguvu ya kikristolojia ya “sura ya Mungu”
  choice: Dai la moja kwa moja limehifadhiwa kama lilivyo.
  alternative: Kulipanua kwa istilahi za baadaye za kiteolojia.
  rationale: Tafsiri inapaswa kuhifadhi uzito wa dai hilo bila kuingiza ufafanuzi usiomo katika maandishi ya Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa msomaji wa kawaida. “Enzi hii,” “amepofusha akili,” na “isiwaangazie” ni misemo ya sasa na ya asili; mfuatano mgumu wa vimilikishi umehifadhiwa kwa sababu una uzito wa kimaana katika chanzo.
