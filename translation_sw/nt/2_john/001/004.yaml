id: 2JN.1.4
reference: 2 John 1:4
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἐχάρην λίαν ὅτι εὕρηκα ἐκ τῶν τέκνων σου περιπατοῦντας ἐν ἀληθείᾳ, καθὼς ἐντολὴν ἐλάβομεν παρὰ τοῦ πατρός.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/004.yaml
  text: I rejoiced greatly that I have found some of your children walking in the truth[b][a], just as we received a commandment from the Father.
translation:
  language: sw
  text: Nilifurahi sana nilipowakuta baadhi ya watoto wako wakiishi kwa kufuata kweli,[a] kama vile tulivyopokea amri kutoka kwa Baba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakitembea katika kweli.” Hii ni sitiari ya kuishi kwa kupatana na kweli iliyofunuliwa, wala si kuwa mnyofu tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐχάρην λίαν
  choice: Nilifurahi sana
  rationale: Kauli hii inadumisha nguvu ya furaha iliyosisitizwa na λίαν, kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: εὕρηκα
  choice: nilipowakuta
  rationale: Katika muktadha huu, kitenzi kinaeleza ugunduzi uliomletea mwandishi furaha. Muundo huu ni wa asili kwa Kiswahili, ingawa hauonyeshi moja kwa moja hali timilifu ya Kigiriki.
- source_word: ἐκ τῶν τέκνων σου
  choice: baadhi ya watoto wako
  rationale: ἐκ pamoja na hali ya umilikishi ina maana ya sehemu ya kundi, si lazima watoto wote.
- source_word: περιπατοῦντας ἐν ἀληθείᾳ
  choice: wakiishi kwa kufuata kweli
  rationale: ‘Kutembea’ ni sitiari ya mwenendo wa maisha; tafsiri hii inaeleza maana yake kwa Kiswahili cha kisasa huku ikidumisha uhusiano na kweli iliyofunuliwa.
- source_word: καθὼς
  choice: kama vile
  rationale: Inaonyesha ulinganifu kati ya mwenendo wao na amri iliyopokewa.
- source_word: ἐντολὴν ἐλάβομεν
  choice: tulivyopokea amri
  rationale: Inadumisha nafsi ya kwanza wingi na wakati uliopita wa Kigiriki; ‘amri’ ni neno la kawaida na lenye uzito unaofaa.
- source_word: παρὰ τοῦ πατρός
  choice: kutoka kwa Baba
  rationale: Inadumisha cheo kilichomo katika Kigiriki bila kuongeza neno ‘Mungu’.
theological_decisions:
- issue: Maana ya ἐν ἀληθείᾳ
  choice: wakiishi kwa kufuata kweli
  alternative: wakitembea katika kweli
  rationale: Kauli hii inaelekea kueleza maisha yanayopatana na kweli iliyofunuliwa, si unyofu tu. Tafsiri haifanyi ‘kweli’ kuwa kivumishi cha tabia pekee.
- issue: Mrejelewa wa ‘Baba’
  choice: kutoka kwa Baba
  alternative: kutoka kwa Mungu Baba
  rationale: Matini yenyewe inasema ‘Baba’; haifai kuongeza ufafanuzi wa kidoktrini usiotajwa moja kwa moja.
- issue: Upeo wa ‘watoto wako’
  choice: baadhi ya watoto wako
  alternative: watoto wako
  rationale: Muundo wa Kigiriki wa ἐκ unaonyesha sehemu ya kundi na haupaswi kutafsiriwa kana kwamba ni lazima wote walihusika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. ‘Wakiishi kwa kufuata kweli’ limetumiwa badala ya kalisi ‘wakitembea katika kweli’ ili sitiari ieleweke wazi; mbadala wa moja kwa moja umehifadhiwa katika tanbihi.
