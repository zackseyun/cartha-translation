source:
  edition: SBLGNT
  text: ὅτι πολλοὶ πλάνοι ⸀ἐξῆλθον εἰς τὸν κόσμον, οἱ μὴ ὁμολογοῦντες Ἰησοῦν Χριστὸν ἐρχόμενον ἐν σαρκί· οὗτός ἐστιν ὁ πλάνος καὶ ὁ ἀντίχριστος.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/007.yaml
  text: For many deceivers have gone out into the world[a], those who do not confess Jesus the Messiah coming in the flesh[b]. This is the deceiver and the antichrist.
translation:
  language: sw
  text: Kwa maana wadanganyifu wengi wametoka na kuingia ulimwenguni—watu wasiokiri kwamba Yesu ndiye Masihi[a] anayekuja katika mwili[b]. Mtu huyo ndiye mdanganyifu na mpinga Kristo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kristo.” Neno la Kigiriki Χριστός ni cheo chenye maana ya “Masihi.”
    reason: lexical_alternative
  - marker: b
    text: Au, “aliyekuja katika mwili.” Kigiriki kinasema kihalisi “anayekuja katika mwili”; usemi huu unasisitiza ubinadamu wa kweli wa Yesu, mwenye mwili halisi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Kwa maana
  rationale: Katika muktadha huu neno hilo linatoa sababu ya himizo lililotangulia; “Kwa maana” linaonyesha uhusiano huo kwa Kiswahili cha kawaida.
- source_word: πολλοὶ πλάνοι
  choice: wadanganyifu wengi
  rationale: πλάνοι hapa ni watu wanaowapotosha wengine, si watu waliokosea tu. “Wadanganyifu” pia hudumisha uhusiano na umoja ὁ πλάνος mwishoni mwa mstari.
- source_word: ἐξῆλθον εἰς τὸν κόσμον
  choice: wamejitokeza ulimwenguni
  rationale: Kauli hii ya Kiswahili inaeleza kutokea kwao hadharani na kuenea kwa shughuli yao ulimwenguni bila kufasiri κόσμος kuwa mfumo wa ulimwengu.
- source_word: οἱ μὴ ὁμολογοῦντες
  choice: watu wasiomkiri
  rationale: Kirai hiki kinawataja watu hao na kuhifadhi maana ya ὁμολογέω ya kukiri au kutangaza wazi, badala ya kukubali tu kiakili.
- source_word: Ἰησοῦν Χριστόν
  choice: Yesu kuwa ndiye Masihi
  rationale: Χριστός hapa lina nguvu ya cheo katika ungamo linalomhusu Yesu. Muundo “kuwa ndiye Masihi” ni wa kawaida katika Kiswahili na unaonyesha wazi kuwa Masihi ni cheo.
- source_word: ἐρχόμενον
  choice: anayekuja
  rationale: Huhifadhi hali ya wakati uliopo ya participio ya Kigiriki na uhusiano wake na Yesu, bila kuibadili kimya kimya kuwa tendo lililokamilika zamani.
- source_word: ἐν σαρκί
  choice: katika mwili
  rationale: Huhifadhi dai la kuja kwa Yesu akiwa mwanadamu mwenye mwili halisi; hapa σάρξ halimaanishi asili ya dhambi.
- source_word: οὗτός ἐστιν
  choice: Mtu huyo ndiye
  rationale: Muundo huu wa Kiswahili unaonyesha umoja wa kiwakilishi cha Kigiriki na kumtambulisha kila mtu wa aina hiyo, bila kufanya “huyu” irejelee wazo lisilo mtu.
- source_word: ὁ πλάνος
  choice: mdanganyifu
  rationale: Hudumisha neno lilelile lililotumiwa kwa πλάνοι mwanzoni mwa mstari.
- source_word: ὁ ἀντίχριστος
  choice: mpinga Kristo
  rationale: Hili ni neno linalotambulika katika Kiswahili cha Biblia kwa ἀντίχριστος na linaonyesha upinzani dhidi ya Kristo bila kuongeza maelezo ya kimadhehebu.
theological_decisions:
- issue: Tafsiri ya Χριστός
  choice: Masihi
  alternative: Kristo
  rationale: Mstari unalenga ungamo kuhusu utambulisho wa Yesu, kwa hiyo Χριστός linafanya kazi hasa kama cheo. Tanbihi inahifadhi tafsiri ya jadi “Kristo” kama uwezekano wa kimsamiati.
- issue: Nguvu ya ἐρχόμενον ἐν σαρκί
  choice: anayekuja katika mwili
  alternative: aliyekuja katika mwili
  rationale: Participio ya Kigiriki iko katika hali ya wakati uliopo. Tafsiri kuu inahifadhi umbo hilo na dai la ubinadamu wa kweli wa Yesu; tanbihi inaonyesha tafsiri ya wakati uliopita inayotumiwa mara nyingi bila kuifanya kuwa maandishi ya msingi.
- issue: Maana ya σάρξ
  choice: mwili, yaani ubinadamu halisi wenye mwili
  alternative: asili ya dhambi
  rationale: Katika muktadha huu σάρξ husema juu ya kuwa mwanadamu mwenye mwili, si upotovu wa kimaadili. Tafsiri huepuka kudokeza kuwa Yesu alikuwa na asili yenye dhambi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Wasiomkiri” na “ndiye” ni miundo inayoeleweka kwa wasomaji wa kawaida huku ikihifadhi uzito wa ungamo. Kistari kirefu kinatenganisha kwa uwazi maelezo ya watu wanaoitwa wadanganyifu.
