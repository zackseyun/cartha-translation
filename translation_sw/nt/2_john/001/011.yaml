base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/011.yaml
  text: For the one who says to him[a], “Greetings,” shares in his evil works.
translation:
  language: sw
  text: Kwa maana anayemwambia, “Salamu,”[a] anashiriki katika matendo yake maovu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Salamu kwako.” Neno la Kigiriki χαίρειν lilikuwa fomula ya kawaida ya kusalimu; katika muktadha huu linaweza kudokeza kumkaribisha au kumwonyesha ridhaa, si kubadilishana maneno ya adabu tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λέγων
  choice: anayemwambia
  rationale: Kirai chenye kibainishi na kitenzi-shirikishi cha wakati uliopo kinamtaja kwa ujumla mtu yeyote anayefanya tendo hilo. Muundo huu ni wa kawaida na wazi katika Kiswahili.
- source_word: γάρ
  choice: Kwa maana
  rationale: Kiunganishi hiki kinatoa sababu ya katazo lililotangulia katika mstari wa 10; “Kwa maana” kinahifadhi dhima yake ya ufafanuzi.
- source_word: αὐτῷ
  choice: -mw- katika “anayemwambia”
  rationale: Kiwakilishi cha udativo kinamrejelea mtu aliyetajwa katika muktadha uliotangulia. Kiswahili hukiwakilisha kwa kiambishi cha yambwa ndani ya kitenzi.
- source_word: χαίρειν
  choice: “Salamu”
  rationale: Hapa infinitivo hii inatumika kama kanuni ya kawaida ya kusalimu, si kama amri halisi ya kufurahi. “Salamu” ni ya asili na yenye staha, huku maelezo ya chini yakihifadhi uwezekano wa maana ya kumkaribisha au kumwonyesha ridhaa katika muktadha huu.
- source_word: κοινωνεῖ
  choice: anashiriki katika
  rationale: Kitenzi hiki pamoja na udativo kinaonyesha kushiriki au kuwa na sehemu katika jambo. Tafsiri hii inaweka wazi maana ya kuhusika bila kuingiza maana finyu ya ushirika wa kikanisa.
- source_word: τοῖς ἔργοις αὐτοῦ τοῖς πονηροῖς
  choice: matendo yake maovu
  rationale: Kirai cha udativo ndicho jambo ambalo mtu anashiriki ndani yake. “Matendo” ni Kiswahili cha kawaida kwa ἔργα katika muktadha wa mwenendo, na “maovu” kinahifadhi hukumu ya kimaadili ya πονηροῖς.
theological_decisions:
- issue: Ikiwa salamu hiyo ni adabu ya kawaida tu au ni ishara ya kumkaribisha na hivyo kushiriki katika kazi yake
  choice: Maandishi makuu yanabaki na usemi wa kawaida “Salamu,” huku tanbihi ikionyesha uzito wake wa kimuktadha bila kuufanya kuwa sehemu ya tafsiri yenyewe.
  alternative: Kutafsiri moja kwa moja “Karibu,” jambo ambalo lingeweka wazi wazo la kumpokea lakini lingeenda mbali kuliko thamani ya msingi ya χαίρειν.
  rationale: χαίρειν ni fomula ya salamu, lakini κοινωνεῖ na muktadha wa mstari wa 10 unaohusu kumpokea mwalimu huyo nyumbani huonyesha kuhusika au kuunga mkono. Tafsiri inahifadhi mvutano huo badala ya kuamua kwamba kila salamu ya kiungwana imekatazwa katika hali zote.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. Sentensi ni fupi na ya kawaida, huku “anashiriki katika” ikieleza wazi kuhusika kwa kimaadili. Alama ya tanbihi imewekwa mara tu baada ya salamu inayofafanuliwa.
