id: 2JN.1.3
reference: 2 John 1:3
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἔσται μεθ’ ἡμῶν χάρις ἔλεος εἰρήνη παρὰ θεοῦ πατρός, καὶ ⸀παρὰ Ἰησοῦ Χριστοῦ τοῦ υἱοῦ τοῦ πατρός, ἐν ἀληθείᾳ καὶ ἀγάπῃ.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/003.yaml
  text: Grace[a], mercy, and peace will be with us from God the Father and from Jesus the Messiah, the Father's Son[b], in truth and love.
translation:
  language: sw
  text: Neema, rehema na amani zitakuwa pamoja nasi kutoka kwa Mungu Baba na kutoka kwa Yesu Masihi[a], Mwana wa Baba, katika kweli na upendo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yesu Kristo.” Neno la Kigiriki Χριστός ni cheo; hapa limetafsiriwa “Masihi” ili kudumisha matumizi yake kama cheo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσται μεθ’ ἡμῶν
  choice: zitakuwa pamoja nasi
  rationale: Kitenzi cha wakati ujao ἔσται kimetafsiriwa moja kwa moja kuwa “zitakuwa,” na μετά pamoja na hali ya umilikishi kuwa “pamoja nasi.” Umoja wa kitenzi cha Kigiriki unafuata kiima kilichotangulia kwa umoja, lakini Kiswahili hutumia wingi kwa orodha ya neema, rehema na amani.
- source_word: χάρις ἔλεος εἰρήνη
  choice: Neema, rehema na amani
  rationale: Maneno haya matatu ni viima vya ἔσται na yamehifadhiwa kwa mpangilio wa Kigiriki kwa lugha ya kawaida ya salamu na baraka za Kikristo.
- source_word: παρὰ θεοῦ πατρός
  choice: kutoka kwa Mungu Baba
  rationale: παρά pamoja na hali ya umilikishi huonyesha chanzo. Hakuna kiwakilishi cha “wetu” katika Kigiriki, hivyo hakijaongezwa.
- source_word: παρὰ Ἰησοῦ Χριστοῦ
  choice: kutoka kwa Yesu Masihi
  rationale: παρά tena huonyesha chanzo. Χριστός hapa ni cheo cha Yesu; “Masihi” huhifadhi matumizi yake kama cheo katika Kiswahili cha kawaida, huku “Kristo” ikitajwa katika tanbihi kama umbo la jadi la kunukuu jina hilo.
- source_word: τοῦ υἱοῦ τοῦ πατρός
  choice: Mwana wa Baba
  rationale: Kirai hiki kinasimama sambamba na “Yesu Masihi” na kumtambulisha wazi kuwa Mwana wa Baba. Tafsiri hii ni ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: ἐν ἀληθείᾳ καὶ ἀγάπῃ
  choice: katika kweli na upendo
  rationale: 'ἐν pamoja na hali ya mahali imetafsiriwa kuwa “katika.” Nomino zisizo na vifungu maalumu zimeachwa katika maana yao ya sifa: “kweli na upendo.”'
theological_decisions:
- issue: Tafsiri ya Χριστοῦ
  choice: Masihi
  alternative: Kristo
  rationale: Χριστός inafanya kazi kama cheo kinachomhusu Yesu. “Masihi” huhifadhi maana ya cheo badala ya kukiwasilisha tu kwa umbo la jadi “Kristo”; umbo hilo la jadi limedumishwa kama mbadala katika tanbihi.
- issue: Uhusiano wa τοῦ υἱοῦ τοῦ πατρός na Yesu
  choice: Kirai cha ufafanuzi kinachomtambulisha Yesu Masihi kuwa Mwana wa Baba
  alternative: Kukichukulia kama maelezo yasiyounganishwa kwa karibu sana na jina la Yesu
  rationale: Muundo wa Kigiriki kwa kawaida unaeleweka kama kirai kinachosimama sambamba na jina la Yesu na kumtambulisha. Tafsiri inahifadhi nguvu hiyo ya kiteolojia bila kuongeza maelezo yasiyokuwamo katika matini.
- issue: Nguvu ya ἔσται katika salamu
  choice: 'Kauli ya wakati ujao: “zitakuwa”'
  alternative: 'Baraka ya ombi: “na ziwe”'
  rationale: Umbo la Kigiriki ni elekezi la wakati ujao, si amri wala hali ya kutakia. Tafsiri haibadili kauli hiyo kuwa ombi la baraka.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi na mpangilio wa dhana umefuata Kigiriki kwa karibu bila kufanya lugha kuwa ngumu au kuongeza “wetu,” ambalo halipo katika chanzo.
