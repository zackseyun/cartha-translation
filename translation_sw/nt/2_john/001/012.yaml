id: 2JN.1.12
reference: 2 John 1:12
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Πολλὰ ἔχων ὑμῖν γράφειν οὐκ ἐβουλήθην διὰ χάρτου καὶ μέλανος, ἀλλὰ ἐλπίζω ⸀γενέσθαι πρὸς ὑμᾶς καὶ στόμα πρὸς στόμα λαλῆσαι, ἵνα ἡ χαρὰ ⸀ὑμῶν ⸂πεπληρωμένη ᾖ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/012.yaml
  text: Though I have many things to write to you[a], I did not want to do so with paper and ink. Instead, I hope to come to you and speak face to face, so that your joy may be made complete.
translation:
  language: sw
  text: Ingawa nina mambo mengi ya kuwaandikia, sikutaka kufanya hivyo kwa karatasi na wino. Badala yake, ninatumaini kuja kwenu na kuzungumza nanyi uso kwa uso, ili furaha yenu[a] iwe kamili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati zina “furaha yetu” badala ya “furaha yenu.”
    reason: textual_variant
lexical_decisions:
- source_word: Πολλὰ ἔχων ὑμῖν γράφειν
  choice: Ingawa nina mambo mengi ya kuwaandikia
  rationale: Muundo wa kishirikishi umeeleweka kwa maana ya hali ya ukinzani, huku wingi wa Πολλά ukihifadhiwa kwa “mambo mengi” na ὑμῖν kwa kiambishi cha watendewa “-wa-”.
- source_word: οὐκ ἐβουλήθην
  choice: sikutaka
  rationale: Hutoa kwa lugha ya kawaida maana ya uamuzi au nia iliyo katika βούλομαι bila kuongeza ukali usiokuwamo katika maandishi.
- source_word: διὰ χάρτου καὶ μέλανος
  choice: kwa karatasi na wino
  rationale: “Kwa” huonyesha chombo au njia, kama διά pamoja na jenitivi; “karatasi” ni neno la kawaida na linaloeleweka, bila kulazimisha maana finyu ya papyrus.
- source_word: ἀλλὰ ἐλπίζω γενέσθαι πρὸς ὑμᾶς
  choice: Badala yake, ninatumaini kuja kwenu
  rationale: “Kuja kwenu” hutoa kwa ufasaha wazo la kufika na kuwa pamoja na walengwa, huku πρός ikidumisha mwelekeo kuelekea kwao.
- source_word: στόμα πρὸς στόμα λαλῆσαι
  choice: kuzungumza nanyi uso kwa uso
  rationale: “Uso kwa uso” ni nahau ya Kiswahili kwa mawasiliano ya moja kwa moja; tafsiri sisisi “mdomo kwa mdomo” ingeleta maana potovu katika matumizi ya sasa.
- source_word: ἵνα ἡ χαρὰ ὑμῶν πεπληρωμένη ᾖ
  choice: ili furaha yenu iwe kamili
  rationale: “Ili” huhifadhi kusudi la ἵνα, na “iwe kamili” huwasilisha hali ya utimilifu inayotokana na πεπληρωμένη ᾖ.
theological_decisions:
- issue: Tofauti ya hati kuhusu ni furaha ya nani inayokusudiwa
  choice: furaha yenu
  alternative: furaha yetu
  rationale: Maandishi msingi ya SBLGNT yana ὑμῶν (“yenu”), hivyo hilo limewekwa katika matini kuu. Tofauti ya ἡμῶν (“yetu”) ina umuhimu wa kifasiri na imehifadhiwa katika tanbihi badala ya kuondolewa kimya.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imetungwa kwa ufasaha wa barua ya kibinafsi, huku ikihifadhi wingi wa “mambo mengi,” njia ya “karatasi na wino,” na tofauti ya hati kuhusu kiwakilishi cha furaha.
