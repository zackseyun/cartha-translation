  text: Ἀσπάζεταί σε τὰ τέκνα τῆς ἀδελφῆς σου τῆς ⸀ἐκλεκτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/013.yaml
  text: The children of your chosen sister greet you.
translation:
  language: sw
  text: Watoto wa dada yako aliyechaguliwa wanakusalimu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀσπάζεταί σε
  choice: wanakusalimu
  rationale: Ingawa kitenzi cha Kigiriki kiko katika umoja kwa sababu kiima kisicho mtu kiko katika wingi wa neuta, Kiswahili hutumia upatanisho wa wingi kwa ‘watoto’; ‘wanakusalimu’ ni salamu ya kawaida na yenye heshima.
- source_word: τὰ τέκνα
  choice: Watoto
  rationale: ‘Watoto’ huwakilisha kwa uwazi maana ya τέκνα na kudumisha uwezekano wa kuwa watoto halisi au washiriki wa jumuiya inayowakilishwa kifamilia.
- source_word: τῆς ἀδελφῆς σου
  choice: wa dada yako
  rationale: Hii ndiyo tafsiri ya moja kwa moja na ya asili ya uhusiano wa umilikaji katika Kiswahili, bila kuamua kama ‘dada’ ni mtu halisi au taswira ya kusanyiko.
- source_word: τῆς ἐκλεκτῆς
  choice: aliyechaguliwa
  rationale: Kivumishi hiki kinaeleza ‘dada yako’; ‘aliyechaguliwa’ huhifadhi wazo la kuchaguliwa bila kuingiza istilahi ya kimadhehebu.
theological_decisions:
- issue: Ikiwa ‘dada’ na ‘watoto’ ni watu halisi au lugha ya mfano kwa kanisa na washiriki wake
  choice: Tafsiri imeacha maneno ya kifamilia kama yalivyo.
  alternative: Kufafanua kuwa ni ‘kanisa dada’ na ‘waumini wake’.
  rationale: Muktadha unaweza kuruhusu usomaji halisi au wa kimfano; maandishi ya Kigiriki hayalazimishi ufafanuzi mmoja.
- issue: Maana ya ἐκλεκτή
  choice: aliyechaguliwa
  alternative: mteule
  rationale: ‘Aliyechaguliwa’ ni ya kawaida na wazi kwa wasomaji wa kisasa, huku ikihifadhi maana ya msingi ya neno bila kulifanya jina au cheo maalumu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, kifupi na chenye heshima. Muundo ni wa kawaida na unaeleweka kwa urahisi; utata wa marejeo ya kifamilia umehifadhiwa.
