  text: πᾶς ὁ ⸀προάγων καὶ μὴ μένων ἐν τῇ διδαχῇ τοῦ Χριστοῦ θεὸν οὐκ ἔχει· ὁ μένων ἐν τῇ ⸀διδαχῇ, οὗτος καὶ τὸν πατέρα καὶ τὸν υἱὸν ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/009.yaml
  text: Everyone who goes on ahead and does not remain in the teaching of Messiah does not have God[a]. The one who remains in the teaching[b], this one has both the Father and the Son.
translation:
  language: sw
  text: Kila mtu anayekwenda mbele na asiyedumu katika mafundisho ya Masihi hana Mungu.[a] Yule anayedumu katika mafundisho,[b] huyo ana Baba na Mwana wote wawili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “anayekwenda mbali kupita kiasi” au “anayekimbilia mbele”; baadhi ya hati zina “anayekiuka” badala ya “anayekwenda mbele.”
    reason: textual_variant
  - marker: b
    text: Maneno “mafundisho ya Masihi” yanaweza kumaanisha mafundisho aliyoyatoa Masihi au mafundisho yanayomhusu Masihi.
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶς ὁ προάγων
  choice: Kila mtu anayekwenda mbele
  rationale: Muundo huu una maana ya jumla, ‘kila mtu ambaye...’. ‘Anayekwenda mbele’ huhifadhi sitiari ya προάγων bila kuifasiri moja kwa moja kuwa kuvuka mipaka au kukosa.
- source_word: μὴ μένων
  choice: asiyedumu
  rationale: ‘Kudumu’ ni Kiswahili cha sasa na chenye hadhi kinachohifadhi dhana muhimu ya Yohana ya kubaki au kuendelea katika hali fulani.
- source_word: ἐν τῇ διδαχῇ
  choice: katika mafundisho
  rationale: ‘Mafundisho’ ni ya kawaida na yanaeleweka zaidi kuliko istilahi ya kitaalamu kama ‘doktrini’; pia yanafaa kwa nomino ya Kigiriki katika umoja yenye maana ya jumla.
- source_word: τοῦ Χριστοῦ
  choice: ya Masihi
  rationale: Χριστός hapa ni cheo. Muundo ‘mafundisho ya Masihi’ huhifadhi uwezekano wa kumaanisha mafundisho yanayotoka kwa Masihi au mafundisho yanayomhusu Masihi.
- source_word: θεὸν οὐκ ἔχει
  choice: hana Mungu
  rationale: Hii hufuata moja kwa moja usemi mkali wa Kigiriki bila kuuongeza kuwa ‘hana ushirika na Mungu.’
- source_word: ὁ μένων ἐν τῇ διδαχῇ
  choice: Yule anayedumu katika mafundisho hayo
  rationale: ‘Yule anaye...’ huwasilisha kirai tegemezi chenye kibainishi; ‘hayo’ hurejelea wazi mafundisho yaliyotajwa katika sentensi ya kwanza.
- source_word: οὗτος
  choice: huyo
  rationale: ‘Huyo’ huhifadhi msisitizo wa kiwakilishi οὗτος kwa njia ya kawaida katika Kiswahili.
- source_word: καὶ τὸν πατέρα καὶ τὸν υἱὸν ἔχει
  choice: ana Baba na Mwana pia
  rationale: Muundo huu wa asili wa Kiswahili huwasilisha kujumuishwa kwa wote wawili katika καὶ...καὶ, huku ukihifadhi vyeo vya uhusiano ‘Baba’ na ‘Mwana.’
theological_decisions:
- issue: Maana ya προάγων katika matini hii
  choice: Imetafsiriwa ‘anayekwenda mbele’
  alternative: anayekwenda mbali kupita kiasi; anayekimbilia mbele; anayekosa
  rationale: SBLGNT ina προάγων, si παραβαίνων. Tafsiri iliyochaguliwa huhifadhi sitiari na haileti hukumu kali zaidi ndani ya matini kuu; tofauti ya matini na maana mbadala zimewekwa katika tanbihi.
- issue: Maana ya ‘mafundisho ya Masihi’
  choice: Muundo wa kiambishi ‘ya Masihi’ umehifadhiwa
  alternative: mafundisho aliyoyatoa Masihi; mafundisho yanayomhusu Masihi
  rationale: Hali ya umilikaji katika Kigiriki inaweza kueleweka kwa njia zote mbili. Tafsiri haiondoi utata huu halisi wa kiteolojia.
- issue: Cheo Χριστοῦ
  choice: Masihi
  alternative: Kristo
  rationale: Neno Χριστός linafanya kazi kama cheo hapa; ‘Masihi’ huwasilisha maana ya cheo hicho badala ya kukitumia kama jina tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Ulinganifu wa vifungu viwili umehifadhiwa, pamoja na msisitizo wa ‘huyo’. Alama zote za tanbihi zimo katika matini kuu.
