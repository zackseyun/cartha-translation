    issue: “mama” for κυρία
    rationale: κυρία means “lady/mistress” as a respectful feminine address; it does not mean “mother.” “Mama” introduces a maternal nuance and is especially unsuitable where the term may be a figurative designation for a church or a personal name.
  - severity: low
    issue: Footnote paraphrases the possible figurative reading as “ninakuomba, kanisa”
    rationale: The ambiguity belongs specifically to “bibi”/κυρία, not to the whole phrase. A focused note better preserves the source ambiguity.
