source:
  edition: SBLGNT
  text: καὶ νῦν ἐρωτῶ σε, κυρία, οὐχ ὡς ἐντολὴν ⸂καινὴν γράφων σοι⸃ ἀλλὰ ἣν εἴχομεν ἀπ’ ἀρχῆς, ἵνα ἀγαπῶμεν ἀλλήλους.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/005.yaml
  text: 'And now I ask you[a], lady, not as though I were writing to you a new commandment, but the one we have had from the beginning: that we love one another.'
translation:
  language: sw
  text: 'Na sasa ninakuomba, bibi[a], si kana kwamba ninakuandikia amri mpya, bali amri ambayo tumekuwa nayo tangu mwanzo: kwamba tupendane.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, huenda “bibi” linamaanisha kanisa ikiwa neno hilo linaeleweka kwa njia ya mfano; wengine hulichukulia Kyria kuwa jina maalumu.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐρωτῶ
  choice: ninakuomba
  rationale: Katika muktadha huu ἐρωτάω ina maana ya kuomba au kutoa ombi. “Ninakuomba” ni Kiswahili cha kawaida na chenye heshima, bila kuongeza nguvu ya maana kama “ninakusihi.”
- source_word: κυρία
  choice: mama
  rationale: κυρία ni umbo la kumwita mwanamke kwa heshima, yaani “lady/mistress.” “Mama” ni namna ya kawaida na yenye staha ya kumwita mwanamke katika Kiswahili cha Afrika Mashariki, huku tanbihi ikihifadhi uwezekano wa maana ya mfano au jina maalumu.
- source_word: ἐντολὴν καινὴν
  choice: amri mpya
  rationale: Hili ni neno la moja kwa moja na la kawaida, nalo linadumisha mwangwi wa matumizi ya Kiyohana kuhusu “amri mpya.”
- source_word: γράφων σοι
  choice: ninakuandikia
  rationale: Kirai cha Kigiriki chenye participio kimewasilishwa kwa kitenzi kamili ndani ya muundo wa Kiswahili “si kana kwamba,” ili sentensi iwe ya asili bila kupoteza ulinganisho wa οὐχ ὡς ... ἀλλά.
- source_word: ἣν εἴχομεν
  choice: ile tuliyo nayo
  rationale: Ingawa εἴχομεν ni wakati usiotimilifu, muktadha wa “tangu mwanzo” unaonyesha amri iliyopokewa zamani na inayoendelea kuwa yao; “tuliyo nayo” huwasilisha mwendelezo huo kwa Kiswahili cha kawaida.
- source_word: ἀπ’ ἀρχῆς
  choice: tangu mwanzo
  rationale: Hii ni tafsiri ya kawaida ya msemo wa Kiyohana na inaonyesha hali iliyoanzia mwanzo na kuendelea.
- source_word: ἵνα ἀγαπῶμεν ἀλλήλους
  choice: kwamba tupendane
  rationale: “Kwamba” huonyesha maudhui ya amri, na “tupendane” huhifadhi hali ya utegemezi yenye maana ya himizo na tendo la kila mmoja kwa mwenzake.
theological_decisions:
- issue: Mrejelewa wa κυρία
  choice: Kutumia “mama” kama neno la heshima bila kumtambulisha mrejelewa kuwa mwanamke fulani au kanisa.
  alternative: Kulielewa kama jina la mfano la kanisa la mahali, au kama jina maalumu Kyria.
  rationale: Neno la Kigiriki lenyewe linaweza kumaanisha mwanamke anayeheshimiwa, lakini katika barua hii huenda likawa lugha ya mfano kwa kanisa; wengine pia hulichukulia kama jina maalumu. Tafsiri kuu haipaswi kuamua jambo ambalo matini haijaamua wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo ni wa asili lakini unafuata kwa karibu mantiki ya Kigiriki; utata wa κυρία umehifadhiwa katika matini na kufafanuliwa katika tanbihi.
