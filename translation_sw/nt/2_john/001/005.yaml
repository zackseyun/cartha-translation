  source_fidelity: 'The draft accurately renders the request, new commandment, beginning, and mutual love. However, “mama” is not a lexically appropriate equivalent for κυρία: it adds a maternal sense absent from the Greek and makes the proposed church reading sound more definite than the source permits. “Bibi” is the ordinary respectful Swahili address that best preserves the basic sense “lady,” while retaining the ambiguity of reference.'
