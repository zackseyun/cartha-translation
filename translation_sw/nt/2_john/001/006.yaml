  text: καὶ αὕτη ἐστὶν ἡ ἀγάπη, ἵνα περιπατῶμεν κατὰ τὰς ἐντολὰς αὐτοῦ· αὕτη ⸂ἡ ἐντολή ἐστιν⸃, καθὼς ἠκούσατε ἀπ’ ἀρχῆς, ἵνα ἐν αὐτῇ περιπατῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/006.yaml
  text: 'And this is love: that we walk according to his commandments. This is the commandment[a], just as you heard from the beginning, that you should walk in it.'
translation:
  language: sw
  text: 'Na upendo ndio huu: kwamba tuenende kulingana na amri zake. Hii ndiyo amri[a], kama mlivyosikia tangu mwanzo, ili mwenende katika amri hiyo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ili mwenende katika upendo”; kiwakilishi cha Kigiriki kinaweza kurejelea “upendo” badala ya “amri.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγάπη
  choice: upendo
  rationale: Ni neno la kawaida na lenye heshima kwa ἀγάπη, na linadumisha uhusiano wa kimsamiati na matumizi ya Kiyohana katika muktadha.
- source_word: ἵνα περιπατῶμεν
  choice: kwamba tuenende
  rationale: Hapa ἵνα inaeleza upendo ni nini kwa matendo; “kwamba tuenende” huhifadhi sitiari ya mwenendo wa maisha bila kuifanya kuwa maelezo marefu.
- source_word: περιπατέω
  choice: enenda
  rationale: “Enenda” huhifadhi sitiari ya kutembea kama mwenendo wa maisha na pia marudio ya kitenzi katika vifungu vyote viwili.
- source_word: κατὰ τὰς ἐντολὰς αὐτοῦ
  choice: kulingana na amri zake
  rationale: “Kulingana na” huonyesha maana ya kufuata au kupatana na amri; “amri zake” huhifadhi wingi wa Kigiriki.
- source_word: ἐντολάς / ἐντολή
  choice: amri / amri
  rationale: Neno lilelile linatumika katika wingi na umoja ili kuhifadhi kiungo cha kimsamiati na badiliko la kimakusudi kutoka “amri zake” kwenda “amri.”
- source_word: αὕτη ἡ ἐντολή ἐστιν
  choice: Hii ndiyo amri
  rationale: Kigiriki hakina kimilikishi cha wazi hapa; tafsiri hii huepuka kuongeza “yake” na huhifadhi umoja.
- source_word: καθὼς ἠκούσατε ἀπ’ ἀρχῆς
  choice: kama mlivyosikia tangu mwanzo
  rationale: Huhifadhi wakati wa kitenzi na nahau ya Kiyohana “tangu mwanzo” kwa Kiswahili cha kawaida.
- source_word: ἵνα ἐν αὐτῇ περιπατῆτε
  choice: kwamba mwenende ndani yake
  rationale: Huhifadhi sitiari, kiwakilishi cha kike cha Kigiriki, na utata wa kile kinachorejelewa bila kukipanua ndani ya matini.
theological_decisions:
- issue: Kirejelewa cha αὐτῇ katika kifungu cha mwisho
  choice: Katika matini kuu, “yake” inaelekea kurejelea “amri” iliyotajwa mara moja kabla.
  alternative: 'Inaweza kurejelea “upendo” uliotajwa mwanzoni: “kwamba mwenende katika upendo.”'
  rationale: ἐντολή na ἀγάπη yote ni nomino za kike katika Kigiriki. “Amri” ndiyo kirejelewa cha karibu zaidi kisarufi, lakini uhusiano wa kimawazo na “upendo” ni mkubwa; kwa hiyo utata unahifadhiwa katika tanbihi badala ya kuamuliwa kidogma.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Enenda” limetumiwa kudumisha sitiari ya kimaadili ya περιπατέω; linaeleweka katika sajili ya kibiblia bila kuwa la kale kupita kiasi. Alama ya tanbihi [a] imewekwa baada ya “amri,” mahali ambapo utata wa kirejelewa unaanza kuwa muhimu.
