  text: εἴ τις ἔρχεται πρὸς ὑμᾶς καὶ ταύτην τὴν διδαχὴν οὐ φέρει, μὴ λαμβάνετε αὐτὸν εἰς οἰκίαν καὶ χαίρειν αὐτῷ μὴ λέγετε·
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/010.yaml
  text: If anyone comes to you and does not bring this teaching, do not receive him into your house, and do not say a greeting to him.
translation:
  language: sw
  text: Mtu yeyote akija kwenu bila kuleta mafundisho haya[b], msimkaribishe nyumbani mwenu, wala msimsalimie[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa umbo la maneno, Kigiriki kinasema, “msimwambie salamu.”
    reason: lexical_alternative
  - marker: b
    text: Katika muktadha, onyo hili linamhusu mtu anayekuja bila “mafundisho haya,” yaelekea mwalimu msafiri ambaye ujumbe wake unatofautiana na ungamo la kitume linaloelezwa katika aya zinazozunguka.
    reason: cross_reference
lexical_decisions:
- source_word: εἴ τις
  choice: Mtu yeyote
  rationale: Ni usemi wa sharti usiotaja mtu maalumu; unadumisha maana ya jumla na ni wa kawaida katika Kiswahili.
- source_word: ἔρχεται πρὸς ὑμᾶς
  choice: akija kwenu
  rationale: Huwakilisha moja kwa moja mwendo kuelekea kwa wapokeaji bila kuongeza wazo la ziara rasmi au kuingia katika kusanyiko.
- source_word: ταύτην τὴν διδαχήν
  choice: mafundisho haya
  rationale: Neno διδαχή linaweza kumaanisha fundisho, mafundisho, au maelekezo. 'Mafundisho haya' ni wazi na la kawaida, huku likihifadhi kiashiria 'haya'.
- source_word: οὐ φέρει
  choice: bila kuleta
  rationale: Muundo huu wa Kiswahili unaeleza kwa kawaida kwamba anayekuja hayaleti mafundisho hayo; unahifadhi sitiari ya φέρω bila kuifanya kuwa ya kiufundi.
- source_word: μὴ λαμβάνετε αὐτὸν εἰς οἰκίαν
  choice: msimkaribishe nyumbani mwenu
  rationale: Katika muktadha wa ukarimu, λαμβάνω pamoja na εἰς οἰκίαν huwasilishwa kwa Kiswahili asilia kama kumkaribisha mtu nyumbani. Haimaanishi moja kwa moja kumpokea kama mwamini au kukubali ujumbe wake.
- source_word: χαίρειν αὐτῷ μὴ λέγετε
  choice: wala msimsalimie
  rationale: Ingawa kwa umbo ni 'msimwambie salamu,' χαίρειν hapa ni kauli ya salamu. 'Msimsalimie' ni Kiswahili cha kawaida na sahihi; tanbihi inadokeza umbo halisi la Kigiriki.
theological_decisions:
- issue: Upeo wa katazo kuhusu mtu anayeleta mafundisho tofauti
  choice: Aya inadumisha matendo halisi ya kutomkaribisha nyumbani na kutomsalimu mtu huyo, bila kuyapanua kuwa katazo la kila mawasiliano wala kuyabana kwa mkutano wa kanisa pekee.
  alternative: Kulielewa kama katazo la mawasiliano yote ya kijamii, au kama katazo linalohusu tu kumpa mwalimu nafasi rasmi katika kusanyiko.
  rationale: Muktadha unaelekea kwa walimu wasafiri na uaminifu kwa ungamo la kitume, lakini maneno yenyewe hayatamki wazi mipaka yote ya matumizi yake. Tafsiri inaacha mvutano huo bila kuutatua kimadhehebu.
- issue: Jinsia ya αὐτόν katika Kiswahili
  choice: Kiambishi cha nafsi cha ngeli ya mtu katika 'msimkaribishe/msimsalimie'
  alternative: Kutaja wazi 'mwanamume huyo' au kutumia umbo la wingi lisilo na jinsia.
  rationale: Kiswahili hakionyeshi jinsia katika kiwakilishi hiki. Miundo ya umoja inahifadhi idadi na urejeo wa Kigiriki bila kuongeza jinsia ambayo sarufi ya Kiswahili haihitaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. 'Kwenu' na 'nyumbani mwenu' ni vya kawaida na vinaweka wazi kuwa wapokeaji ni wengi. 'Msimkaribishe' ni asilia zaidi kuliko tafsiri ya neno kwa neno 'msimpokee ndani ya nyumba,' huku tanbihi zikihifadhi taarifa muhimu za kimuundo na kimuktadha.
