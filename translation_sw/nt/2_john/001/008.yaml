  text: βλέπετε ἑαυτούς, ἵνα μὴ ⸀ἀπολέσητε ἃ ⸀εἰργασάμεθα, ἀλλὰ μισθὸν πλήρη ⸀ἀπολάβητε.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/008.yaml
  text: Watch yourselves[a], so that you may not lose what we have worked for, but may receive a full reward.
translation:
  language: sw
  text: Jitazameni nafsi zenu, ili msipoteze yale tuliyoyafanyia kazi[a], bali mpokee thawabu kamili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati zina “yale mliyoyafanyia kazi” badala ya “yale tuliyoyafanyia kazi.”
    reason: textual_variant
lexical_decisions:
- source_word: βλέπετε ἑαυτούς
  choice: Jiangalieni wenyewe
  rationale: Kauli ya amri ya wakati wa sasa, pamoja na kiwakilishi cha kujirejelea, inawataka wasomaji waendelee kuwa macho kuhusu hali na mwenendo wao. “Jiangalieni wenyewe” ni Kiswahili cha kawaida, chenye nguvu ya onyo bila kuongeza ufafanuzi usiomo katika Kigiriki.
- source_word: ἵνα μὴ ἀπολέσητε
  choice: ili msipoteze
  rationale: Muundo wa ἵνα pamoja na ukanushi na hali tegemezi unaeleza lengo au matokeo yanayopaswa kuepukwa. Katika muktadha huu ἀπόλλυμι humaanisha kupoteza matokeo ya kazi, si kuharibu.
- source_word: ἃ
  choice: yale
  rationale: Kiwakilishi hiki kinarejelea mambo au matokeo ya kazi iliyotangulia. “Yale” ni ya asili katika Kiswahili na huepuka urudiaji mzito wa “mambo ambayo.”
- source_word: εἰργασάμεθα
  choice: tuliyoyafanyia kazi
  rationale: Neno la Kigiriki katika matini iliyotolewa ni nafsi ya kwanza wingi na linaonyesha kazi iliyofanywa yenye matokeo yanayoendelea kuzingatiwa. Tafsiri hii inadumisha “sisi” na kuunganisha kazi hiyo na matokeo yake.
- source_word: μισθὸν πλήρη
  choice: thawabu kamili
  rationale: Katika muktadha huu μισθός ni thawabu kuliko mshahara wa ajira, na πλήρης hukazia ukamilifu wake. “Thawabu kamili” ni wazi, ya heshima, na ya kawaida katika Kiswahili.
- source_word: ἀπολάβητε
  choice: mpokee
  rationale: Kitenzi hiki hapa kina maana ya kupata au kupokea. “Mpokee” ni cha moja kwa moja na hakilazimishi wazo la kupokea tena, ambalo si lazima katika muktadha.
theological_decisions:
- issue: Mtendaji wa εἰργασάμεθα
  choice: tuliyoyafanyia kazi
  alternative: mliyoyafanyia kazi
  rationale: SBLGNT iliyotolewa ina nafsi ya kwanza wingi, “sisi tumefanya kazi,” hivyo matini kuu inadumisha wazo la kazi ya mwandishi na washirika wake kwa ajili ya wasomaji. Tofauti ya hati yenye nafsi ya pili wingi imehifadhiwa katika tanbihi bila kuamua kimya kimya kati ya mapokeo hayo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imehifadhi muundo wa onyo, jambo la kuepukwa, na lengo chanya. Alama ya tanbihi imewekwa baada ya sentensi nzima kwa kuwa tofauti hiyo inahusu kishazi cha katikati.
