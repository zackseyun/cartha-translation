  text: διὰ τὴν ἀλήθειαν τὴν μένουσαν ἐν ἡμῖν, καὶ μεθ’ ἡμῶν ἔσται εἰς τὸν αἰῶνα·
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/002.yaml
  text: because of the truth that remains in us and will be with us forever[a].
translation:
  language: sw
  text: kwa sababu ya kweli inayokaa ndani yetu, na itakuwa pamoja nasi milele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ
  choice: kwa sababu ya
  rationale: Ikiwa na hali ya kushutumiwa, διά hapa inaonyesha sababu au msingi wa upendo uliotajwa katika mstari wa 1. “Kwa sababu ya” ni Kiswahili cha kawaida na cha moja kwa moja.
- source_word: ἀλήθειαν
  choice: kweli
  rationale: ἀλήθεια hapa ni “kweli.” Neno halijafafanuliwa zaidi kuwa injili, mafundisho, Kristo, au ufunuo wa Mungu, hivyo tafsiri inadumisha upana wake wa kiteolojia.
- source_word: τὴν μένουσαν
  choice: inayokaa
  rationale: Kitenzi μένω kinaonyesha kuendelea kuwepo au kukaa. “Inayokaa” ni usemi wa kawaida unaohifadhi wazo la uwepo wa kudumu bila kuongeza maana isiyosemwa.
- source_word: ἐν ἡμῖν
  choice: ndani yetu
  rationale: ἐν pamoja na hali ya mahali hapa inatafsiriwa kwa maana ya moja kwa moja ya “ndani yetu,” na hivyo kuhifadhi taswira ya kweli kuwamo ndani ya waamini badala ya kuibadili kuwa “miongoni mwetu.”
- source_word: καὶ μεθ’ ἡμῶν ἔσται
  choice: na itakuwa pamoja nasi
  rationale: μετά pamoja na hali milikishi humaanisha “pamoja na,” na ἔσται ni wakati ujao wa “kuwa.” Tafsiri hii haiongezi kitenzi “itaendelea,” ambacho hakipo wazi katika kishazi hiki.
- source_word: εἰς τὸν αἰῶνα
  choice: milele
  rationale: Huu ni usemi wa kudumu bila mwisho; “milele” ndio namna ya kawaida, wazi, na yenye hadhi katika Kiswahili.
theological_decisions:
- issue: Maana ya kiteolojia ya “kweli” katika maandishi ya Yohana
  choice: Kudumisha neno rahisi “kweli” bila kulibainisha zaidi
  alternative: “kweli ya Injili” au “mafundisho ya kweli”
  rationale: Muktadha unaweza kuhusisha maana pana ya Kiyohana, lakini nomino ya Kigiriki yenyewe haibainishi wazi kama inamaanisha ujumbe wa Injili, Kristo mwenyewe, au ufunuo wa Mungu. Kutotilia ufafanuzi kunahifadhi utata halisi na uzito wa kiteolojia wa chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi, na chenye hadhi. Muundo unaendeleza kishazi cha mstari wa 1 kama ilivyo katika Kigiriki. Hakuna tanbihi iliyowekwa kwa sababu tofauti ya Kiingereza kati ya “remains” na “abides” inaweza kuwasilishwa kwa kawaida kwa neno moja la Kiswahili, “kukaa,” bila kupoteza maana ya msingi.
