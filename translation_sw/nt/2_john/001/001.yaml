id: 2JN.1.1
reference: 2 John 1:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ὁ πρεσβύτερος ἐκλεκτῇ κυρίᾳ καὶ τοῖς τέκνοις αὐτῆς, οὓς ἐγὼ ἀγαπῶ ἐν ἀληθείᾳ, καὶ οὐκ ἐγὼ μόνος ἀλλὰ καὶ πάντες οἱ ἐγνωκότες τὴν ἀλήθειαν,
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/001.yaml
  text: The elder[a], to the chosen lady and her children, whom I love in truth—and not I alone[b], but also all who have come to know the truth—
translation:
  language: sw
  text: Mzee, kwa mwanamke mteule[a] na watoto wake, ambao ninawapenda katika kweli[b]—wala si mimi peke yangu, bali pia wote ambao wamekuja kuijua kweli—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Huenda “mwanamke” hapa ikawa ni mfano wa kusanyiko la waamini la mahali pamoja; wengine hulichukulia Kyria kuwa jina la mtu.
    reason: alternative_reading
  - marker: b
    text: Au “kwa kweli”; kauli hii inaweza pia kuwa na maana ya Kiyohana ya “ndani ya kweli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ πρεσβύτερος
  choice: Mzee
  rationale: Katika salamu ya ufunguzi, neno hili linafanya kazi kama namna ya mwandishi kujitambulisha kwa cheo au hadhi. “Mzee” ni Kiswahili cha kawaida kinachoweza kuhusisha umri, heshima, au uongozi bila kuingiza cheo maalumu cha dhehebu.
- source_word: ἐκλεκτῇ κυρίᾳ
  choice: mama mteule
  rationale: “Mama” ni namna ya heshima na ya kawaida ya kumrejelea mwanamke, nayo “mteule” inawakilisha hali ya kuchaguliwa. Kauli hii inaweza kumaanisha mwanamke halisi au kutumiwa kwa mfano kuhusu kusanyiko la waamini.
- source_word: τοῖς τέκνοις αὐτῆς
  choice: watoto wake
  rationale: τέκνα ni watoto kwa ujumla, si wana wa kiume pekee. Kauli hii pia haifungi uwezekano wa maana ya mfano ya washiriki wa kusanyiko.
- source_word: οὓς ἐγὼ ἀγαπῶ
  choice: ambao ninawapenda
  rationale: Kiwakilishi cha wingi kinarejelea watu, na “ninawapenda” kinatoa maana ya ἀγαπῶ bila kuongeza kiwango cha hisia kisichotajwa.
- source_word: ἐν ἀληθείᾳ
  choice: katika kweli
  rationale: Tafsiri hii inadumisha uwezekano wa kumaanisha “kwa kweli” na pia wazo la upendo ulio ndani ya kweli, jambo lenye mwangwi muhimu katika maandishi ya Yohana.
- source_word: οὐκ ἐγὼ μόνος ἀλλὰ καὶ πάντες
  choice: wala si mimi peke yangu, bali pia wote
  rationale: Muundo huu unadumisha mkazo na ulinganisho wa Kigiriki kwa Kiswahili cha kawaida.
- source_word: οἱ ἐγνωκότες τὴν ἀλήθειαν
  choice: ambao wamekuja kuijua kweli
  rationale: “Wamekuja kuijua” linaonyesha hali ya sasa iliyotokana na kuipata maarifa hapo awali, kulingana na hali timilifu ya kitenzi cha Kigiriki.
theological_decisions:
- issue: Utambulisho wa ἐκλεκτῇ κυρίᾳ
  choice: Imetafsiriwa “mama mteule,” kauli inayoonekana kumwelekea mwanamke lakini inayoweza pia kutumiwa kwa mfano kuhusu kusanyiko la waamini.
  alternative: Mwanamke fulani Mkristo; kusanyiko la mahali pamoja likiwa limefanywa kama mwanamke; au Kyria kama jina la mtu.
  rationale: Kigiriki hakiamui wazi kati ya uwezekano huu. Matini kuu inadumisha maana ya kawaida ya κυρία, na tanbihi inaonyesha maana nyingine zinazowezekana.
- issue: Maana ya ἐν ἀληθείᾳ
  choice: katika kweli
  alternative: kwa kweli; ndani ya ile kweli
  rationale: Kauli hii inadumisha maana ya unyofu pamoja na mwangwi wa kiteolojia wa “kweli” katika maandishi ya Yohana, bila kuamua moja tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Mama” limetumiwa kama neno la heshima kwa mwanamke, huku “mteule” likidumisha ufupi na uzito wa ἐκλεκτή. Alama ya mkato mrefu mwishoni inadumisha sentensi inayoendelea katika mstari unaofuata.
