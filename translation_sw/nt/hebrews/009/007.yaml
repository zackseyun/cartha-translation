  text: εἰς δὲ τὴν δευτέραν ἅπαξ τοῦ ἐνιαυτοῦ μόνος ὁ ἀρχιερεύς, οὐ χωρὶς αἵματος, ὃ προσφέρει ὑπὲρ ἑαυτοῦ καὶ τῶν τοῦ λαοῦ ἀγνοημάτων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/007.yaml
  text: But into the second room only the high priest enters once a year[a], and not without blood[b], which he offers for himself and for the people's sins committed in ignorance.
translation:
  language: sw
  text: Lakini katika sehemu ya pili[a], kuhani mkuu peke yake huingia mara moja kwa mwaka, wala haingii bila damu, ambayo huitoa kwa ajili yake mwenyewe na kwa ajili ya dhambi ambazo watu walitenda bila kujua.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “hema la pili” au “chumba cha pili,” yaani sehemu ya ndani ya hema la ibada.
    reason: lexical_alternative
  - marker: b
    text: Au “dhambi za watu zisizokusudiwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς δὲ τὴν δευτέραν
  choice: Lakini katika sehemu ya pili
  rationale: Kirai cha Kigiriki kinaacha nomino ikieleweka kutokana na muktadha wa sehemu mbili za hema katika 9:2–3. “Sehemu ya pili” ni ya asili kwa Kiswahili na haifanyi kuwa lazima ichukuliwe kama chumba kilichojengwa kwa kuta.
- source_word: ἅπαξ τοῦ ἐνιαυτοῦ
  choice: mara moja kwa mwaka
  rationale: Hii ni tafsiri ya kawaida na wazi ya Kiswahili inayoonyesha tukio la kila mwaka.
- source_word: μόνος ὁ ἀρχιερεύς
  choice: kuhani mkuu peke yake
  rationale: Inaonyesha wazi kwamba ni kuhani mkuu tu aliyeruhusiwa kuingia.
- source_word: οὐ χωρὶς αἵματος
  choice: wala haingii bila damu
  rationale: Inahifadhi usemi wa Kigiriki na picha muhimu ya damu katika ibada ya dhabihu; kitenzi “haingii” kimerudiwa ili sentensi iwe wazi katika Kiswahili.
- source_word: ὃ προσφέρει
  choice: ambayo huitoa
  rationale: “Kuitoa” ina maana ya kuileta au kuiwasilisha kama toleo la dhabihu, huku kiwakilishi kikirejelea damu.
- source_word: ὑπὲρ ἑαυτοῦ
  choice: kwa ajili yake mwenyewe
  rationale: Ni usemi wa kawaida wa Kiswahili unaowasilisha maana ya uwakilishi au manufaa katika muktadha wa dhabihu.
- source_word: τῶν τοῦ λαοῦ ἀγνοημάτων
  choice: dhambi ambazo watu walitenda bila kujua
  rationale: Inaonyesha kuwa ἀγνοήματα ni makosa ya kimaadili yaliyotendwa kwa kutokujua, si ukosefu wa habari tu, bila kufuta uwezekano wa maana ya kutokusudia.
theological_decisions:
- issue: Asili ya ἀγνοήματα katika muktadha wa dhabihu
  choice: dhambi ambazo watu walitenda bila kujua
  alternative: dhambi za watu zisizokusudiwa
  rationale: Tafsiri kuu inahifadhi wazo la kutenda kwa kutokujua na uzito wa dhambi. Tanbihi inaonyesha maana inayokaribiana ya kutokusudia bila kulazimisha tofauti ya kimafundisho ambayo mstari wenyewe hauifafanui.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umewekwa wazi bila kuwa wa kitaaluma kupita kiasi; istilahi “kuhani mkuu,” “damu,” na “dhambi” zimehifadhiwa kwa sababu ya umuhimu wake katika muktadha wa ibada.
