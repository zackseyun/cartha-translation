id: HEB.9.15
reference: Hebrews 9:15
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ διὰ τοῦτο διαθήκης καινῆς μεσίτης ἐστίν, ὅπως θανάτου γενομένου εἰς ἀπολύτρωσιν τῶν ἐπὶ τῇ πρώτῃ διαθήκῃ παραβάσεων τὴν ἐπαγγελίαν λάβωσιν οἱ κεκλημένοι τῆς αἰωνίου κληρονομίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/015.yaml
  text: And for this reason he is the mediator of a new covenant[a], so that, since a death has occurred for the redemption of the transgressions committed under the first covenant, those who have been called may receive the promise of the eternal inheritance.
translation:
  language: sw
  text: Kwa sababu hiyo, yeye ni mpatanishi wa agano jipya[a], ili, kwa kuwa kifo kimetokea kwa ajili ya ukombozi wa makosa yaliyotendwa chini ya agano la kwanza, wale walioitwa wapokee ahadi ya urithi wa milele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wosia” badala ya “agano.” Neno la Kigiriki διαθήκη linaweza kuwa na maana zote mbili; Waebrania 9:16–17 inatumia mwingiliano huo wa maana, ingawa hapa “agano” linafaa zaidi kwa sababu ya tofauti na agano la kwanza.
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Kwa sababu hiyo
  rationale: Ni kiunganishi cha sababu kinachohusisha aya hii na hoja iliyotangulia, kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: διαθήκης καινῆς
  choice: wa agano jipya
  rationale: Katika muktadha huu maana ya agano ndiyo kuu kwa sababu linatofautishwa na agano la kwanza; uwezekano wa maana ya wosia umehifadhiwa katika tanbihi.
- source_word: μεσίτης
  choice: mpatanishi
  rationale: Neno hili linaeleza anayesimama kati ya pande ili kuleta au kutekeleza uhusiano wa agano, na ni la kawaida katika Kiswahili cha Biblia.
- source_word: θανάτου γενομένου
  choice: kwa kuwa kifo kimetokea
  rationale: Muundo huu unaonyesha tukio la kifo lililotimia na linaloweka msingi wa matokeo yanayofuata, bila kutaja wazi mhusika ambaye Kigiriki hakumtaji katika kishazi hiki.
- source_word: ἀπολύτρωσιν
  choice: kuwakomboa watu kutokana na
  rationale: Kukomboa huwasilisha kuachiliwa kunakopatikana kwa gharama; kutaja watu kama watendewa kunafanya uhusiano wa nomino za Kigiriki uwe wazi katika Kiswahili bila kubadili maana.
- source_word: τῶν ἐπὶ τῇ πρώτῃ διαθήκῃ παραβάσεων
  choice: makosa yaliyotendwa chini ya agano la kwanza
  rationale: “Chini ya” huhifadhi wazo la kuwa katika mamlaka au kipindi cha agano la kwanza, na “yaliyotendwa” huonyesha kwa kawaida uhusiano wa makosa hayo na watu wanaokombolewa.
- source_word: οἱ κεκλημένοι
  choice: wale walioitwa
  rationale: Huhifadhi hali inayotokana na mwito uliokwisha kutolewa, kama inavyoonyeshwa na kitenzi-jina cha wakati timilifu na sauti tendwa.
- source_word: τὴν ἐπαγγελίαν ... τῆς αἰωνίου κληρονομίας
  choice: urithi wa milele ulioahidiwa
  rationale: Muundo huu wa Kiswahili huonyesha kwa uwazi kwamba ahadi inahusu urithi wa milele; unasawazisha uasilia na uaminifu kwa uhusiano wa maneno ya Kigiriki.
- source_word: λάβωσιν
  choice: wapokee
  rationale: Huhifadhi kusudi au matokeo yanayoletwa na ὅπως kwa lugha ya kawaida.
theological_decisions:
- issue: Mhusika asiyeandikwa wazi wa ἐστίν
  choice: yeye ni
  alternative: kuacha mhusika bila kutajwa
  rationale: Kiswahili huhitaji mhusika katika usemi huu; “yeye” humrejelea Kristo katika muktadha uliotangulia bila kuongeza jina lisilopo katika aya.
- issue: Maana ya διαθήκη
  choice: agano
  alternative: wosia
  rationale: Tofauti kati ya agano jipya na agano la kwanza inaifanya “agano” kuwa maana inayofaa zaidi hapa, huku mwingiliano wa maana unaojitokeza katika 9:16–17 ukihifadhiwa katika tanbihi.
- issue: Uhusiano wa “ahadi” na “urithi wa milele”
  choice: urithi wa milele ulioahidiwa
  alternative: wapokee ahadi ya urithi wa milele
  rationale: Kigiriki kinaweza kuakisiwa kwa muundo wa pili, lakini uchaguzi huu ni wa asili zaidi katika Kiswahili na unaonyesha kwamba kile kinachopokewa ni urithi ulioahidiwa, bila kuondoa uzito wa ahadi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Sentensi imepangwa kwa mtiririko wa kawaida wa Kiswahili huku ikihifadhi uhusiano wa sababu, kusudi, na matokeo wa matini ya Kigiriki.
