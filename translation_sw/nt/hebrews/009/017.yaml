base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/017.yaml
  text: For a covenant is valid over dead ones[b][a], since it is never in force while the one who made it is living.
translation:
  language: sw
  text: Kwa maana agano huwa halali wafu wanapohusika[b][a], kwa kuwa halina nguvu kamwe wakati yule aliyefanya hivyo angali hai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa maana wosia huwa halali tu baada ya kifo, kwa kuwa hauna nguvu kamwe wakati aliyeufanya angali hai.” Neno la Kigiriki linaweza kumaanisha ama “agano” ama “wosia.”
    reason: alternative_reading
  - marker: b
    text: Usemi “wafu wanapohusika” umewekwa kwa ufupi katika Kigiriki na unaweza kurejelea ama watu waliokufa (kwa maana ya wosia), ama kifo kinachohusika katika kuthibitisha agano.
    reason: lexical_alternative
lexical_decisions:
- source_word: διαθήκη
  choice: agano
  rationale: Muktadha mpana wa Waebrania 8–10 unahusu maagano, hasa agano la kwanza na agano jipya pamoja na kuthibitishwa kwa damu. Hata hivyo, maana ya ‘wosia’ imehifadhiwa katika tanbihi kwa sababu neno la Kigiriki linaweza kuwa na maana zote mbili.
- source_word: ἐπὶ νεκροῖς
  choice: juu ya wafu
  rationale: Hii ni tafsiri fupi inayofuata usemi wa Kigiriki uliofinyangwa na kudumisha uwezekano wa kurejelea ama watu waliokufa katika muktadha wa wosia, ama vifo vinavyohusika katika kuthibitisha agano.
- source_word: βεβαία
  choice: huwa halali
  rationale: Katika muktadha huu neno linaonyesha uhalali au nguvu inayotambulika ya agano, si uhakika wa kawaida tu.
- source_word: ἐπεὶ
  choice: kwa kuwa
  rationale: Huanzisha sababu inayoeleza kauli iliyotangulia kwa Kiswahili cha kawaida na cha wazi.
- source_word: μήποτε
  choice: kamwe
  rationale: Katika muundo huu neno lina maana ya ‘wakati wowote ule si,’ hivyo ‘kamwe’ linatoa maana yake ya kimuktadha.
- source_word: ἰσχύει
  choice: halina nguvu
  rationale: Kitenzi kinaonyesha kuwa kitu kina nguvu ya kutumika au kutekelezwa; usemi huu ni wa kawaida na unaacha wazi kama kinachozungumziwa ni agano au wosia.
- source_word: ὅτε ζῇ
  choice: wakati ... angali hai
  rationale: Huhifadhi utofauti wa wakati kati ya kuwapo kwa kifo na hali inayoendelea ya kuwa hai.
- source_word: ὁ διαθέμενος
  choice: aliyelifanya
  rationale: Usemi huu unaweza kumaanisha aliyefanya agano au aliyefanya wosia, hivyo unaepuka kuamua mapema maana inayobishaniwa.
theological_decisions:
- issue: Iwapo διαθήκη katika Waebrania 9:17 litafsiriwe kama ‘agano’ au ‘wosia.’
  choice: Neno ‘agano’ limetumiwa katika matini kuu, huku ‘wosia’ ukihifadhiwa katika tanbihi.
  alternative: Wosia huwa halali baada ya kifo.
  rationale: Muktadha mkuu wa Waebrania 8–10 ni wa maagano na damu ya kuyathibitisha, lakini lugha ya 9:16–17 inaweza pia kueleweka kwa maana ya kisheria ya wosia. Tanbihi inadumisha mvutano huo bila kuufuta.
- issue: Kiwango cha kufafanua usemi ἐπὶ νεκροῖς.
  choice: Usemi ulio wazi kwa tafsiri zaidi ya moja, ‘juu ya wafu,’ umehifadhiwa katika matini kuu.
  alternative: Baada ya kifo; katika hali ya watu waliokufa; juu ya dhabihu zilizokufa.
  rationale: Kigiriki ni kifupi na kinaweza kueleweka kuhusu kifo cha mwenye wosia au vifo vya dhabihu katika kuthibitisha agano. Tafsiri kuu haichagui kimya kimya upande mmoja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaoeleweka. Usemi usio wa kawaida kidogo ‘juu ya wafu’ umehifadhiwa kwa makusudi ili kutatua kimya kimya utata halisi wa Kigiriki; tanbihi zinafafanua njia kuu mbili za kuuelewa.
