id: HEB.9.6
reference: Hebrews 9:6
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Τούτων δὲ οὕτως κατεσκευασμένων, εἰς μὲν τὴν πρώτην σκηνὴν διὰ παντὸς εἰσίασιν οἱ ἱερεῖς τὰς λατρείας ἐπιτελοῦντες,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/006.yaml
  text: With these things prepared in this way[a], the priests continually enter the first tabernacle, performing the services[b],
translation:
  language: sw
  text: Vitu hivi vikiwa vimeandaliwa kwa namna hiyo, makuhani huingia daima katika sehemu ya kwanza ya hema la ibada[a], wakitekeleza huduma za ibada[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “hema la kwanza” au “chumba cha kwanza.” Neno la Kigiriki linaweza kumaanisha hema lenyewe au, katika muktadha huu, sehemu yake ya kwanza.
    reason: lexical_alternative
  - marker: b
    text: Au “wakitekeleza matendo ya ibada” au “wakitimiza wajibu wa kiibada.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τούτων δὲ οὕτως κατεσκευασμένων
  choice: Vitu hivi vikiwa vimeandaliwa kwa namna hiyo
  rationale: Muundo huu unaonyesha hali iliyokuwapo kabla ya tendo linalofuata. “Vimeandaliwa” linafaa kwa vitu na mpangilio wa hema ulioelezwa, bila kulazimisha maana ya kujengwa pekee; δὲ haihitaji kiunganishi kizito hapa.
- source_word: εἰς μὲν τὴν πρώτην σκηνὴν
  choice: katika sehemu ya kwanza ya hema la ibada
  rationale: Katika muktadha huu σκηνή linaweza kutaja hema lote au sehemu yake. Kwa kuwa mstari wa 7 unatofautisha sehemu ya pili, “sehemu ya kwanza ya hema la ibada” huwasilisha maana ya kimuktadha kwa uwazi huku tanbihi ikihifadhi uwezekano wa kimuundo.
- source_word: διὰ παντὸς
  choice: daima
  rationale: Hueleza tendo la kawaida linalorudiwa la makuhani, si lazima kuwapo bila kukoma kila dakika.
- source_word: εἰσίασιν
  choice: huingia
  rationale: Kiambishi hu- huonyesha tendo la mazoea linalorudiwa, sawasawa na wakati wa sasa wenye maana ya kawaida katika Kigiriki.
- source_word: οἱ ἱερεῖς
  choice: makuhani
  rationale: Ni makuhani wa kawaida, wanaotofautishwa na kuhani mkuu katika mstari unaofuata.
- source_word: τὰς λατρείας ἐπιτελοῦντες
  choice: wakitekeleza huduma za ibada
  rationale: “Huduma za ibada” huhifadhi maana ya matendo rasmi ya kikuhani, na “wakitekeleza” huonyesha kutimiza wajibu huo bila kuuhusisha na ibada ya kanisa ya baadaye.
theological_decisions:
- issue: Maana ya σκηνή katika maelezo ya patakatifu
  choice: sehemu ya kwanza ya hema la ibada
  alternative: hema la kwanza; chumba cha kwanza
  rationale: Muktadha unahusu hema la kukutania na sehemu zake mbili. Tafsiri iliyochaguliwa huhifadhi mazingira ya ibada ya Agano la Kale na kuweka wazi kwamba hapa ni sehemu ya mbele inayotofautishwa na ya pili, bila kuficha mbadala katika tanbihi.
- issue: Nguvu ya διὰ παντὸς katika huduma ya kikuhani
  choice: daima
  alternative: mara kwa mara; wakati wote
  rationale: Neno linaonyesha ruhusa na huduma ya kawaida inayorudiwa katika sehemu ya kwanza, kinyume na kuingia kwa kuhani mkuu katika sehemu ya pili mara moja kwa mwaka; halimaanishi makuhani walikuwamo humo bila kukoma.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Hema la ibada” ni la kawaida zaidi kuliko istilahi nzito, na “huingia” huwasilisha tendo la mazoea. Alama zote za tanbihi zimewekwa katika matini.
