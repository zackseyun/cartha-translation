  text: καὶ καθ’ ὅσον ἀπόκειται τοῖς ἀνθρώποις ἅπαξ ἀποθανεῖν, μετὰ δὲ τοῦτο κρίσις,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/027.yaml
  text: And just as it is appointed for men to die once[a], and after this, judgment,
translation:
  language: sw
  text: Na kama vile wanadamu wamewekewa kufa mara moja, na baada ya hayo hukumu,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθ’ ὅσον
  choice: kama vile
  rationale: Katika muktadha huu, kirai hiki kinaanzisha ulinganisho unaokamilishwa katika mstari unaofuata; “kama vile” ni ya asili na hudumisha muundo huo.
- source_word: ἀπόκειται
  choice: wamewekewa
  rationale: Kitenzi hiki hapa huonyesha jambo lililowekwa au lililokusudiwa kuwa sehemu ya hali ya wanadamu. “Wamewekewa” hudumisha wazo hilo bila kulifanya kuwa amri ya moja kwa moja.
- source_word: τοῖς ἀνθρώποις
  choice: wanadamu
  rationale: Neno la Kigiriki linarejelea jamii yote ya binadamu, si wanaume pekee. “Wanadamu” linaonyesha maana hiyo kwa usahihi katika Kiswahili.
- source_word: ἅπαξ
  choice: mara moja
  rationale: Hueleza tukio moja la kifo; “mara moja” ni wazi bila kuongeza maana ya “mara moja kwa wote.”
- source_word: ἀποθανεῖν
  choice: kufa
  rationale: Hii ndiyo maana ya kawaida na ya moja kwa moja ya kitenzi hiki katika kirai.
- source_word: μετὰ δὲ τοῦτο
  choice: na baada ya hayo
  rationale: Kirai hiki huonyesha mfuatano kutoka kifo hadi hukumu. “Hayo” hurejelea jambo lililotangulia kwa njia ya asili katika Kiswahili.
- source_word: κρίσις
  choice: hukumu
  rationale: Neno hili lina maana pana ya kuhukumiwa au tathmini ya kimahakama; “hukumu” halilazimishi maana nyembamba ya adhabu wala maelezo ya mfumo fulani wa matukio ya mwisho.
theological_decisions:
- issue: Rejeo la jumla la τοῖς ἀνθρώποις
  choice: “Wanadamu,” likirejelea jamii yote ya binadamu
  alternative: “Watu” au “wanaume”
  rationale: Kigiriki kimetumia wingi wa kisarufi wenye umbo la kiume lakini maana yake hapa ni ya jumla. “Wanadamu” huhifadhi maana hiyo bila kuifanya aya iwarejelee wanaume pekee.
- issue: Upeo wa κρίσις baada ya kifo
  choice: “Hukumu” bila kufafanua matokeo yake
  alternative: “Adhabu” au “hukumu ya mwisho”
  rationale: Aya inasema kwamba hukumu hufuata kifo, lakini haifafanui hapa matokeo yake yote wala mpangilio kamili wa matukio ya mwisho. Tafsiri inaacha upana huo kama ulivyo katika chanzo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa heshima na unaoeleweka kwa wasomaji wa kawaida. Koma ya mwisho imehifadhiwa kwa sababu sentensi na ulinganisho vinaendelea katika Waebrania 9:28.
