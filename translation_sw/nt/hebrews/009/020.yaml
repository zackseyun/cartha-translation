lexical_decisions:
- source_word: λέγων
  choice: akisema
  rationale: Kitenzi kishirikishi cha wakati uliopo kinaingiza nukuu na kudumisha uhusiano wa kisarufi na tendo lililotangulia.
- source_word: Τοῦτο
  choice: Hii ndiyo
  rationale: Kigiriki hakina kitenzi kishirikishi kilichoandikwa wazi; Kiswahili cha kawaida huhitaji ‘ndiyo’ ili kuunganisha kiwakilishi na ‘damu’ bila kuongeza maana nyingine.
- source_word: αἷμα
  choice: damu
  rationale: Ni kisawe cha moja kwa moja, na kinahifadhi taswira halisi ya damu ya dhabihu katika kuthibitisha agano.
- source_word: διαθήκης
  choice: agano
  rationale: Muktadha unarejelea agano la Musa katika Kutoka 24:8, si wosia wa kisheria.
- source_word: ἧς
  choice: ambalo
  rationale: Kiwakilishi hiki cha uhusiano kinarejelea ‘agano’; Kiswahili kinaweza kudumisha muundo huo wa Kigiriki kwa njia ya kawaida.
- source_word: ἐνετείλατο
  choice: amewaamuru
  rationale: Kitenzi ἐντέλλομαι humaanisha kuamuru au kutoa maagizo; ‘amewaamuru’ ni wazi na cha kawaida.
- source_word: πρὸς ὑμᾶς
  choice: ninyi
  rationale: Kiambishi ‘-wa-’ tayari kinaonyesha walengwa wa amri, huku ‘ninyi’ ikidumisha msisitizo wa ὑμᾶς. Muundo huu unaacha uhusiano wa agano na watu ukiwa wazi bila kuubadili kuwa ‘kwa ajili yenu.’
- source_word: ὁ θεός
  choice: Mungu
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa θεός katika muktadha huu.
theological_decisions:
- issue: Maana ya διαθήκη katika muktadha wa kuthibitishwa kwa damu
  choice: agano
  alternative: wosia
  rationale: Aya inanukia Kutoka 24:8 na inazungumzia agano la Musa lililothibitishwa kwa damu; ‘wosia’ ungeleta maana ya kisheria isiyofaa hapa.
- issue: Kukamilisha kiunganishi kisichoandikwa baada ya Τοῦτο
  choice: Hii ndiyo damu ya agano
  alternative: Hii, damu ya agano
  rationale: ‘Ndiyo’ hufanya sentensi iwe ya kawaida na wazi katika Kiswahili huku ikionyesha tu uhusiano wa kiarifu uliodokezwa katika Kigiriki.
- issue: Uhusiano wa ἧς ἐνετείλατο πρὸς ὑμᾶς na agano
  choice: agano ambalo Mungu amewaamuru ninyi
  alternative: agano ambalo Mungu amewaamuru kwa ajili yenu
  rationale: Muundo wa jamaa unahifadhi uhusiano wa moja kwa moja wa Kigiriki kati ya ‘agano’ na ‘aliamuru.’ ‘Amewaamuru ninyi’ huonyesha kwa kawaida kwamba amri ilielekezwa kwa watu, bila kutatua kupita kiasi maana ya πρός.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo ‘amewaamuru ninyi’ umetumiwa ili kudumisha msisitizo wa kiwakilishi cha Kigiriki na uelekeo wa amri kwa watu.
