  verdict: revise
  source_fidelity: The draft accurately represents the conditional and inferential opening, the sacrificial blood, the ashes of a female calf, ritual defilement, and the continuing syntax into verse 14. The active participle ῥαντίζουσα is acceptably represented by “yanayowanyunyizia.” However, “ili wawe safi kimwili” slightly recasts πρὸς τὴν τῆς σαρκὸς καθαρότητα as a purpose/result clause and weakens the noun phrase “purity/purification of the flesh.”
  naturalness: The Swahili is clear, contemporary, and suitably formal. “Kwa ajili ya usafi wa mwili” more directly and naturally retains the cultic noun phrase and the outward/bodily scope intended here.
  terminology: “Mbuzi-dume,” “mafafali,” “ndama jike,” “unajisi,” and “huwatakasa” are appropriate in this ritual context. “Mwili” should be retained explicitly rather than the adverbial “kimwili,” so that σάρξ is not reduced merely to a general physical manner.
