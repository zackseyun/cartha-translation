  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἰ γὰρ τὸ αἷμα ⸂τράγων καὶ ταύρων⸃ καὶ σποδὸς δαμάλεως ῥαντίζουσα τοὺς κεκοινωμένους ἁγιάζει πρὸς τὴν τῆς σαρκὸς καθαρότητα,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/013.yaml
  text: For if the blood of goats and bulls[a], and the ashes of a heifer that sprinkle those who have been defiled, sanctify for the purification of the flesh[d][c][b],
translation:
  language: sw
  text: Kwa maana, ikiwa damu ya mbuzi-dume na mafahali, pamoja na majivu ya ndama jike[c] yanayowanyunyizia wale waliotiwa unajisi[a][d], huwatakasa kwa ajili ya usafi wa mwili[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wale waliokuwa najisi.” Kigiriki hapa kinahusu unajisi wa kiibada.
    reason: lexical_alternative
  - marker: b
    text: Yaani, usafi wa nje wa mwili uliopatikana kwa taratibu za ibada za agano la kale.
    reason: cultural_note
  - marker: c
    text: Hili linadokeza ibada ya utakaso iliyotumia majivu ya ndama jike katika Hesabu 19.
    reason: cross_reference
  - marker: d
    text: Au, “majivu ya ndama jike yanayonyunyizwa juu ya wale waliotiwa unajisi.”
    reason: translation_alternative
lexical_decisions:
- source_word: εἰ γὰρ
  choice: Kwa maana, ikiwa
  rationale: Inahifadhi uhusiano wa hoja na hali ya sharti ambayo itakamilishwa katika mstari unaofuata.
- source_word: τὸ αἷμα τράγων καὶ ταύρων
  choice: damu ya mbuzi-dume na mafahali
  rationale: Ni rejeleo la moja kwa moja kwa damu ya wanyama wa dhabihu; ‘mbuzi-dume’ huonyesha wazi jinsia iliyomo katika τράγων.
- source_word: σποδὸς δαμάλεως
  choice: majivu ya ndama jike
  rationale: Huelekeza kwenye ibada ya Hesabu 19 na humtambulisha mnyama kuwa jike bila kutumia istilahi ngumu isiyo ya kawaida.
- source_word: ῥαντίζουσα
  choice: yanayowanyunyizia
  rationale: Inahifadhi kauli tendaji ya kishirikishi cha Kigiriki, ambacho kisarufi kinaeleza ‘majivu,’ huku Kiswahili kikionyesha wazi wanaopokea tendo.
- source_word: τοὺς κεκοινωμένους
  choice: wale waliotiwa unajisi
  rationale: Inaonyesha hali ya kunajisiwa kiibada inayodokezwa na muktadha, bila kuifanya kuwa uchafu wa kimaadili.
- source_word: ἁγιάζει
  choice: huwatakasa
  rationale: Inadumisha msamiati wa kiibada na kitheolojia, lakini muktadha unaweka mpaka wake kuwa utakaso wa nje.
- source_word: πρὸς τὴν τῆς σαρκὸς καθαρότητα
  choice: ili wawe safi kimwili
  rationale: Ni Kiswahili cha kawaida kinachoeleza kusudi au matokeo ya ibada na kuhifadhi tofauti kati ya usafi wa nje hapa na utakaso wa dhamiri katika mstari wa 14.
theological_decisions:
- issue: Maana ya ἁγιάζει katika ibada za agano la kale
  choice: Utakaso wa kiibada unaohusu usafi wa nje
  alternative: Kufanywa mtakatifu kwa ndani au kubadilishwa kimaadili
  rationale: Kirai kinachofuata kinaweka wazi kuwa athari inayozungumziwa ni usafi wa mwili, na mstari wa 14 unatofautisha jambo hilo na kusafishwa kwa dhamiri.
- issue: Maana ya σάρξ katika mstari huu
  choice: Mwili katika maana ya nje na ya kiibada
  alternative: Asili ya dhambi
  rationale: Muktadha ni taratibu za utakaso wa Walawi, si matumizi ya sitiari yanayomaanisha tabia au asili ya dhambi.
- issue: Uhusiano wa ῥαντίζουσα na σποδός
  choice: Majivu yanaelezwa kwa kauli tendaji kuwa yanawanyunyizia watu
  alternative: Majivu yananyunyizwa juu ya watu
  rationale: Kauli tendaji na uhusiano wa kisarufi wa maandishi ya Kigiriki umehifadhiwa katika mstari mkuu; namna ya kauli tendwa imewekwa katika tanbihi kama ufasiri wa kawaida wa tendo la ibada.
translation_notes:
  register: Lugha ni ya sasa, yenye heshima na inayoeleweka katika Kiswahili Sanifu cha Afrika Mashariki. ‘Ndama jike’ ni wazi kuliko istilahi adimu ya kiufugaji, na ‘safi kimwili’ huepuka uwezekano wa kuelewa σάρξ kuwa asili ya dhambi. Koma ya mwisho imehifadhiwa kwa sababu sentensi ya sharti inaendelea katika mstari wa 14.
