  text: καὶ σχεδὸν ἐν αἵματι πάντα καθαρίζεται κατὰ τὸν νόμον, καὶ χωρὶς αἱματεκχυσίας οὐ γίνεται ἄφεσις.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/022.yaml
  text: And according to the law[a], almost everything is cleansed with blood, and without the shedding of blood there is no forgiveness.
translation:
  language: sw
  text: Na kwa mujibu wa sheria, karibu kila kitu hutakaswa kwa damu, na pasipo kumwaga damu hakuna msamaha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ondoleo.” Neno la Kigiriki linaweza kumaanisha kuachiliwa au kusamehewa; hapa linahusu msamaha wa dhambi.
    reason: lexical_alternative
lexical_decisions:
- source_word: σχεδόν
  choice: karibu
  rationale: 'Kielezi hiki kinaweka mpaka katika kauli: si kila kitu kabisa kilichotakaswa chini ya sheria kilihusisha damu. “Karibu kila kitu” ni Kiswahili cha kawaida na huhifadhi mpaka huo.'
- source_word: ἐν αἵματι
  choice: kwa damu
  rationale: Ingawa ἐν inaweza kutafsiriwa kihalisi kuwa “katika,” hapa inaonyesha njia au chombo cha utakaso; “kwa damu” ni ya asili na sahihi katika Kiswahili.
- source_word: πάντα
  choice: kila kitu
  rationale: Wingi wa jinsia ya kati unatumiwa kwa maana pana kuhusu vitu na taratibu zinazozungumziwa. Pamoja na σχεδόν, “karibu kila kitu” huwasilisha maana hiyo kwa uwazi.
- source_word: καθαρίζεται
  choice: hutakaswa
  rationale: Kauli ya kutendwa katika wakati wa sasa inaeleza desturi ya kawaida chini ya sheria. “Hutakaswa” huhifadhi maana ya kiibada na pia inaeleweka katika Kiswahili cha sasa.
- source_word: κατὰ τὸν νόμον
  choice: kwa mujibu wa sheria
  rationale: κατά hapa humaanisha kufuatana na mfumo wa sheria ya Musa. Tafsiri hii ni wazi bila kudai kwamba sheria yenyewe ndiyo chombo cha utakaso.
- source_word: χωρὶς
  choice: pasipo
  rationale: Neno hili lina maana ya kutokuwapo kwa kitu. “Pasipo” ni fupi, ya asili, na yenye hadhi katika kauli hii.
- source_word: αἱματεκχυσίας
  choice: kumwaga damu
  rationale: Nomino hii humaanisha kumiminwa au kumwagwa kwa damu, hasa katika muktadha wa dhabihu. “Kumwaga damu” ni usemi wa kawaida unaohifadhi mwangwi huo wa kidhabihu.
- source_word: οὐ γίνεται
  choice: hakuna
  rationale: Pamoja na nomino ἄφεσις, kitenzi hiki kina maana kwamba msamaha hautokei au haupatikani. “Hakuna” huwasilisha kauli hiyo kwa Kiswahili cha kawaida.
- source_word: ἄφεσις
  choice: msamaha
  rationale: Katika muktadha huu wa dhabihu, neno linahusu kusamehewa kwa dhambi. “Msamaha” ni wazi kwa wasomaji wa sasa; “ondoleo” ni mbadala halali lakini si wa kawaida kwa kiwango sawa.
theological_decisions:
- issue: Maana ya ἄφεσις katika muktadha wa dhabihu
  choice: msamaha
  alternative: ondoleo
  rationale: Kauli inahusu kusamehewa kwa dhambi katika hoja ya Waebrania kuhusu damu na dhabihu. “Msamaha” huwasilisha maana hiyo wazi bila kuingiza mfumo mwembamba wa kimadhehebu; tanbihi huhifadhi uwezekano wa maana ya kuachiliwa au kuondolewa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umefanywa wa asili kwa kuweka “kwa mujibu wa sheria” mapema, huku sifa ya “karibu” na uhusiano wa utakaso kwa damu vikihifadhiwa. Alama ya tanbihi imewekwa baada ya “msamaha,” neno inalolifafanua.
