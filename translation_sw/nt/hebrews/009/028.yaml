  text: οὕτως καὶ ὁ Χριστός, ἅπαξ προσενεχθεὶς εἰς τὸ πολλῶν ἀνενεγκεῖν ἁμαρτίας, ἐκ δευτέρου χωρὶς ἁμαρτίας ὀφθήσεται τοῖς αὐτὸν ἀπεκδεχομένοις εἰς σωτηρίαν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/028.yaml
  text: so also the Messiah[a], having been offered once to bear the sins of many, will appear a second time, apart from sin, to those who eagerly await him, for salvation.
translation:
  language: sw
  text: Vivyo hivyo, Kristo, akiwa ametolewa mara moja ili azibebe dhambi za wengi, atatokea mara ya pili bila kuhusiana na dhambi,[a] kwa wale wanaomngojea kwa hamu, kwa ajili ya wokovu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mbali na dhambi”; yaani, si kwa ajili ya kuzibeba dhambi kama katika kutolewa kwake kwa kwanza.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως καὶ
  choice: Vivyo hivyo ... naye
  rationale: Inaendeleza ulinganisho wa mstari uliotangulia na kutoa kwa Kiswahili cha kawaida maana ya ‘hivyo pia.’
- source_word: ὁ Χριστός
  choice: Kristo
  rationale: ‘Kristo’ ni namna ya kawaida ya Kiswahili ya cheo Χριστός, yaani Masiya, na hapa inaendelea kufanya kazi kama cheo cha kiukombozi.
- source_word: ἅπαξ
  choice: mara moja
  rationale: Inawakilisha maana ya moja kwa moja ya ἅπαξ bila kuongeza wazo lisilotajwa wazi la ‘mara moja tu kwa wakati wote.’
- source_word: προσενεχθεὶς
  choice: baada ya kutolewa
  rationale: Inahifadhi hali ya kutendwa ya kitenzi na tendo lililotangulia kabla ya kutokea kwake mara ya pili; haiongezi kiwakilishi cha kujirejelea kisichopo katika kishazi hiki.
- source_word: εἰς τὸ πολλῶν ἀνενεγκεῖν ἁμαρτίας
  choice: ili azibebe dhambi za wengi
  rationale: ‘Ili’ inaonyesha kusudi, na ‘kuzibeba dhambi’ inadumisha mwangwi wa lugha ya dhabihu na Isaya bila kuufafanua kupita kiasi.
- source_word: ἐκ δευτέρου
  choice: mara ya pili
  rationale: Ni usemi wa kawaida wa Kiswahili unaotofautisha kutokea huku na tukio la kwanza.
- source_word: χωρὶς ἁμαρτίας
  choice: mbali na dhambi
  rationale: Inadumisha ufupi na mvutano wa maana ya Kigiriki ‘apart from sin’ badala ya kuamua wazi kwamba maana pekee ni kutokuja kushughulikia dhambi.
- source_word: ὀφθήσεται
  choice: atatokea
  rationale: Ingawa umbo la Kigiriki ni la kutendwa, kitenzi hiki hutumiwa kwa maana ya kuonekana au kutokea; ‘atatokea’ ni wazi na cha kawaida katika muktadha wa kuja kwake.
- source_word: τοῖς αὐτὸν ἀπεκδεχομένοις
  choice: kwa wale wanaomngojea kwa hamu
  rationale: ‘Kwa hamu’ inadumisha matarajio yenye shauku yanayodokezwa na ἀπεκδέχομαι.
- source_word: εἰς σωτηρίαν
  choice: kwa ajili ya wokovu
  rationale: Inahifadhi maana ya lengo au kusudi bila kuongeza kitenzi cha ufafanuzi kama ‘kuleta.’
theological_decisions:
- issue: Maana ya χωρὶς ἁμαρτίας katika kutokea kwa Kristo mara ya pili
  choice: mbali na dhambi
  alternative: bila kuhusiana na dhambi; si kwa kusudi la kuzibeba dhambi
  rationale: Maandishi makuu yanabaki karibu na Kigiriki na hayafuti mvutano wake. Tanbihi inaeleza uwezekano wa kwamba kutokea kwa pili hakutakuwa kwa kazi ya kubeba dhambi kama kutolewa kwake kwa kwanza.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Mpangilio wa sentensi unadumisha ulinganisho, tendo la kutolewa lililotangulia, na lengo la wokovu. Alama ya tanbihi imewekwa baada ya kirai ‘mbali na dhambi,’ ambacho ndicho tanbihi inachofafanua.
