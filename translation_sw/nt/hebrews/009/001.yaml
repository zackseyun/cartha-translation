  yaml_path: translation/nt/hebrews/009/001.yaml
  text: Even the first covenant had regulations for worship and an earthly sanctuary[a][b].
translation:
  language: sw
  text: Hata agano la kwanza lilikuwa na kanuni za ibada na mahali patakatifu hapa duniani[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “la kwanza”—yaani, agano la kwanza; wengine huuelewa usemi huu kwa maana pana zaidi kuwa “mpango wa kwanza.”
    reason: alternative_reading
  - marker: b
    text: Au, “mahali patakatifu pa kilimwengu”; hapa maana inayowezekana zaidi ni “mahali patakatifu hapa duniani,” tofauti na mambo ya mbinguni yanayozungumziwa baadaye katika sura hii.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶχε
  choice: lilikuwa na
  rationale: Kauli ya wakati uliopita isiotimilika ya ἔχω inaanzisha maelezo ya mpango wa kwanza. “Lilikuwa na” ni Kiswahili cha kawaida kinachohifadhi maana ya kuwa na kitu.
- source_word: μὲν οὖν
  choice: Hata
  rationale: Muungano huu unaendeleza hoja kwa msisitizo wa kiasi. Katika muktadha huu, “Hata” huwasilisha vizuri wazo kwamba agano la kwanza nalo lilikuwa na mambo hayo, bila kuongeza kiashirio cha wakati kisichomo katika chanzo.
- source_word: ἡ πρώτη
  choice: agano la kwanza
  rationale: Nomino “agano” haijarudiwa katika Kigiriki, lakini kivumishi cha kike “la kwanza” kinarejelea agano la kwanza lililotajwa katika muktadha wa karibu wa 8:13. Nomino imewekwa wazi kwa ajili ya Kiswahili kinachoeleweka.
- source_word: δικαιώματα
  choice: kanuni
  rationale: Katika muktadha wa ibada, neno hili humaanisha masharti au maagizo yaliyowekwa. “Kanuni” ni neno la sasa na linaloeleweka, bila uzito usio wa lazima wa lugha ya kisheria.
- source_word: λατρείας
  choice: za ibada
  rationale: Hapa neno linabainisha eneo au kusudi la kanuni. “Za ibada” huwasilisha huduma ya kidini kwa ufupi na kwa kawaida.
- source_word: τό τε ἅγιον
  choice: mahali patakatifu
  rationale: Kirai hiki kinataja sehemu takatifu inayohusiana na ibada ya agano la kwanza. Tafsiri hii ni pana vya kutosha kwa kuwa mistari inayofuata inaeleza sehemu zake.
- source_word: κοσμικόν
  choice: hapa duniani
  rationale: Katika muktadha huu neno linatofautisha mahali patakatifu pa duniani na mambo ya mbinguni yanayozungumziwa baadaye. “Hapa duniani” huepuka kidokezo cha uovu ambacho “cha kilimwengu” kingeweza kuleta.
theological_decisions:
- issue: Kirejelewa kilichodokezwa katika ἡ πρώτη
  choice: agano la kwanza
  alternative: la kwanza; au mpango wa kwanza
  rationale: Muktadha wa karibu wa Waebrania 8 unatofautisha agano la kwanza na agano jipya, kwa hiyo “agano” ndilo rejeleo linalowezekana zaidi. Tanbihi inadumisha uwezekano wa kuelewa usemi huo kwa upana zaidi.
- issue: Maana ya κοσμικόν
  choice: hapa duniani
  alternative: cha kilimwengu
  rationale: Tofauti kuu ni kati ya mahali patakatifu pa duniani na uhalisi wa mbinguni, si kati ya utakatifu na upotovu wa kimaadili. Tafsiri iliyochaguliwa hailazimishi maana hasi ya kimaadili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni nyepesi kwa msomaji wa kawaida, huku istilahi “agano,” “kanuni za ibada,” na “mahali patakatifu” zikihifadhi usahihi wa muktadha wa kidini. Alama zote za tanbihi zimewekwa katika matini kuu.
