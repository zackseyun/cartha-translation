translation:
  language: sw
  text: Kwa njia hii Roho Mtakatifu anaonyesha kwamba njia ya kuingia mahali patakatifu[a] bado haijafunuliwa, maadamu hema la kwanza lingali limesimama.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “njia ya kuingia patakatifu.” Maneno ya Kigiriki yanaweza kumaanisha maeneo matakatifu kwa ujumla; wengine huyafasiri hasa kuwa “njia ya kuingia Patakatifu Zaidi.”
    reason: alternative_reading
  - marker: b
    text: Au, “maadamu hema la kwanza lingali lina hadhi yake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δηλοῦντος
  choice: anaonyesha
  rationale: Kitenzi hiki kinawasilisha kazi ya Roho Mtakatifu ya kuonyesha maana ya mpangilio uliotajwa; wakati wa sasa unadumisha nguvu ya kauli ya Kigiriki.
- source_word: πνεύματος τοῦ ἁγίου
  choice: Roho Mtakatifu
  rationale: Hili ndilo neno la kawaida na lenye hadhi katika Kiswahili kwa rejeo hili la Agano Jipya.
- source_word: μήπω πεφανερῶσθαι
  choice: ilikuwa bado haijafunuliwa
  rationale: Muundo huu unaonyesha hali ya kutokuwa imefunuliwa hadi wakati unaozungumziwa; ‘bado’ huhifadhi μήπω, na kauli tendwa huhifadhi umbo la Kigiriki.
- source_word: τὴν τῶν ἁγίων ὁδὸν
  choice: njia ya kuingia mahali patakatifu
  rationale: Katika muktadha wa hema na huduma ya makuhani, maneno haya yanahusu ufikiaji wa eneo takatifu. ‘Kuingia’ huifanya maana ya kimahali iwe wazi kwa Kiswahili bila kuibana kuwa chumba cha ndani pekee.
- source_word: πρώτης σκηνῆς
  choice: hema la kwanza
  rationale: ‘Hema’ ni neno la kawaida la kibiblia kwa σκηνή, na ‘la kwanza’ hudumisha utofautishaji wa mwandishi kati ya sehemu za hema katika muktadha wa karibu.
- source_word: ἔτι τῆς πρώτης σκηνῆς ἐχούσης στάσιν
  choice: maadamu hema la kwanza lingali limesimama
  rationale: ‘Maadamu’ na ‘lingali’ huonyesha mwendelezo wa hali, huku ‘limesimama’ likitoa maana ya kawaida ya kuendelea kuwapo. Uwezekano wa maana ya kuendelea kuwa na nafasi au hadhi umewekwa katika tanbihi.
theological_decisions:
- issue: Rejeo la τῶν ἁγίων
  choice: mahali patakatifu, yaani eneo la ibada
  alternative: njia ya watakatifu
  rationale: Muktadha unazungumzia mpangilio wa hema na ufikiaji wa kikuhani, kwa hiyo maana ni ya mahali pa ibada, si watu watakatifu.
- issue: Upana wa rejeo la mahali patakatifu
  choice: mahali patakatifu kwa maana pana
  alternative: Patakatifu Zaidi pekee
  rationale: Ingawa muktadha unaweza kuelekeza hasa kwenye chumba cha ndani, wingi wa Kigiriki hauhitaji tafsiri hiyo nyembamba. Matini kuu inadumisha upana huo na tanbihi inaonyesha uwezekano mwingine.
- issue: Maana ya kuendelea kwa hema la kwanza
  choice: lingali limesimama
  alternative: lingali lina nafasi au hadhi yake
  rationale: στάσις inaweza kuonyesha kuendelea kuwapo au kuendelea kuwa na nafasi inayotambuliwa. Tafsiri kuu ni ya kawaida na ya kimahali; tanbihi inadumisha maana ya kihadhi bila kuilazimisha katika matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wenye hadhi na unaoeleweka kwa wasomaji wa kawaida. ‘Lingali’ limetumiwa kwa ufupi na kwa hadhi kuonyesha hali inayoendelea; tanbihi zote zimewekewa alama katika matini kuu.
