  text: χρυσοῦν ἔχουσα θυμιατήριον καὶ τὴν κιβωτὸν τῆς διαθήκης περικεκαλυμμένην πάντοθεν χρυσίῳ, ἐν ᾗ στάμνος χρυσῆ ἔχουσα τὸ μάννα καὶ ἡ ῥάβδος Ἀαρὼν ἡ βλαστήσασα καὶ αἱ πλάκες τῆς διαθήκης,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/004.yaml
  text: having the golden censer[a], and the ark of the covenant covered on all sides with gold, in which were a golden jar holding the manna, Aaron’s staff that budded, and the tablets of the covenant,
translation:
  language: sw
  text: palikuwa na madhabahu ya dhahabu ya kufukizia uvumba[a], na sanduku la agano lililofunikwa kwa dhahabu pande zote. Ndani yake vilikuwamo gudulia la dhahabu lenye mana, fimbo ya Aroni iliyochipua, na vibao vya agano.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “chombo cha dhahabu cha kufukizia uvumba.” Neno la Kigiriki linaweza kumaanisha kifaa cha kufukizia uvumba, na maana yake hapa inajadiliwa.
    reason: alternative_reading
lexical_decisions:
- source_word: χρυσοῦν ἔχουσα θυμιατήριον
  choice: palikuwa na madhabahu ya dhahabu ya kufukizia uvumba
  rationale: θυμιατήριον inaweza kumaanisha madhabahu ya uvumba au chombo cha kufukizia uvumba. Katika maelezo ya vifaa vya hema, “madhabahu ... ya kufukizia uvumba” ni rejeo la kawaida na la kueleweka, huku maana nyingine ikihifadhiwa katika tanbihi. χρυσοῦν inaonyesha kuwa ilikuwa ya dhahabu.
- source_word: τὴν κιβωτὸν τῆς διαθήκης
  choice: sanduku la agano
  rationale: Hili ndilo neno la Kiswahili lililozoeleka na sahihi kwa sanduku takatifu la agano.
- source_word: περικεκαλυμμένην πάντοθεν χρυσίῳ
  choice: lililofunikwa kwa dhahabu pande zote
  rationale: Kauli hii huhifadhi msisitizo wa kufunikwa kila upande bila kuongeza maelezo yasiyomo katika chanzo.
- source_word: ἐν ᾗ
  choice: Ndani yake mlikuwa na
  rationale: Kiwakilishi kinarejelea sanduku; muundo huu wa Kiswahili unaanzisha kwa kawaida orodha ya vitu vilivyokuwamo ndani yake.
- source_word: στάμνος χρυσῆ ἔχουσα τὸ μάννα
  choice: gudulia la dhahabu lenye mana
  rationale: στάμνος ni chombo kama gudulia au mtungi. “Gudulia” linafaa kwa chombo cha kuhifadhia na ni neno la kibiblia linaloeleweka; ἔχουσα limetafsiriwa kwa ufupi na kwa asili kuwa “lenye.”
- source_word: ἡ ῥάβδος Ἀαρὼν ἡ βλαστήσασα
  choice: fimbo ya Aroni iliyochipua
  rationale: ῥάβδος ni fimbo, na βλαστήσασα hurejelea tukio la fimbo kutoa chipukizi.
- source_word: αἱ πλάκες τῆς διαθήκης
  choice: vibao vya agano
  rationale: πλάκες ni vibao, na “vya agano” hudumisha matumizi ya διαθήκη bila kuongeza neno “mawe,” ambalo halipo wazi katika aya hii.
theological_decisions:
- issue: Maana ya θυμιατήριον katika maelezo ya mahali patakatifu
  choice: madhabahu ya dhahabu ya kufukizia uvumba
  alternative: chombo cha dhahabu cha kufukizia uvumba
  rationale: Neno la Kigiriki linaweza kutaja madhabahu ya uvumba au chombo cha kuuchomea. Maana ya madhabahu imewekwa katika matini kwa kuwa inafaa kwa maelezo ya vifaa vya hema, lakini utata halisi wa kileksika haujafichwa; maana nyingine imetolewa katika tanbihi.
- issue: Uhusiano wa vitu vilivyoorodheshwa na sanduku katika ἐν ᾗ
  choice: Ndani yake mlikuwa na
  alternative: ambalo lilihusishwa na vitu hivyo
  rationale: Sarufi ya moja kwa moja ya Kigiriki inasema “ndani yake.” Tafsiri haibadili kauli hiyo ili kuoanisha aya kimya kimya na maelezo ya Agano la Kale.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Palikuwa na” huendeleza kimaumbile maelezo yaliyoanza katika aya iliyotangulia. Istilahi “sanduku la agano,” “mana,” na “vibao vya agano” zinadumisha msamiati wa kibiblia uliozoeleka.
