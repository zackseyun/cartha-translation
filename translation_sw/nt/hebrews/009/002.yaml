source:
  edition: SBLGNT
  text: σκηνὴ γὰρ κατεσκευάσθη ἡ πρώτη ἐν ᾗ ἥ τε λυχνία καὶ ἡ τράπεζα καὶ ἡ πρόθεσις τῶν ἄρτων, ἥτις λέγεται Ἅγια·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/002.yaml
  text: For a first tabernacle was prepared[a], in which were the lampstand and the table and the bread of the Presence[b], which is called the Holy Place.
translation:
  language: sw
  text: Kwa maana, hema la kwanza liliandaliwa[a]. Ndani yake vilikuwamo kinara cha taa, meza, na mikate iliyowekwa mbele[b]. Nalo huitwa Mahali Patakatifu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, lilijengwa; au, lilisimamishwa.
    reason: lexical_alternative
  - marker: b
    text: Kwa karibu zaidi, “uwekaji wa mikate”; pia huitwa “mikate ya wonyesho” au “mikate ya kuwapo.”
    reason: lexical_alternative
  - marker: c
    text: Kigiriki kina “Patakatifu” katika umbo la wingi; hapa neno hilo linataja sehemu ya kwanza ya hema.
    reason: lexical_alternative
lexical_decisions:
- source_word: σκηνὴ ... ἡ πρώτη
  choice: hema la kwanza
  rationale: Neno σκηνή ni “hema,” na katika muktadha huu linataja sehemu ya kwanza ya hema takatifu. Tafsiri hii inadumisha taswira ya hema la ibada na utofautishaji na sehemu ya ndani katika mstari unaofuata.
- source_word: κατεσκευάσθη
  choice: liliandaliwa
  rationale: Kitenzi hiki kinaweza kumaanisha kuandaa, kujenga, au kuweka tayari. “Liliandaliwa” kinajumuisha kuandaliwa kwa nafasi hiyo pamoja na vyombo vyake bila kuibana maana kwenye ujenzi pekee.
- source_word: λυχνία
  choice: kinara cha taa
  rationale: Kilikuwa chombo cha kushikilia taa za mafuta, si mishumaa; kwa hiyo “kinara cha taa” ni wazi na sahihi kuliko “kinara cha mishumaa.”
- source_word: τράπεζα
  choice: meza
  rationale: Hii ndiyo tafsiri ya moja kwa moja na ya kawaida kwa meza takatifu iliyokuwa katika sehemu ya kwanza.
- source_word: ἡ πρόθεσις τῶν ἄρτων
  choice: mikate iliyowekwa mbele
  rationale: Kirai hicho kwa karibu ni “uwekaji wa mikate.” Muundo huu wa Kiswahili ni wa kawaida zaidi, huku ukidumisha wazo la mikate kuwekwa au kutandazwa mbele bila kuingiza jina la kimapokeo katika matini kuu.
- source_word: ἥτις λέγεται Ἅγια
  choice: Hema hilo huitwa Mahali Patakatifu
  rationale: Ingawa Ἅγια ina umbo la wingi katika Kigiriki, hapa inataja sehemu ya kwanza ya hema, tofauti na sehemu ya ndani katika mstari unaofuata. “Mahali Patakatifu” ni jina linaloeleweka kwa sehemu hiyo.
theological_decisions:
- issue: Ikiwa Ἅγια itafsiriwe kwa umbo la wingi au kama jina la sehemu ya kwanza ya hema
  choice: Mahali Patakatifu
  alternative: mahali patakatifu; sehemu takatifu; patakatifu
  rationale: Umbo la Kigiriki ni la wingi, lakini muktadha unalitumia kama jina la sehemu ya kwanza ya hema. Tafsiri ya umoja inaweka wazi tofauti ya kieneo bila kuongeza dai la kimadhehebu; umbo la Kigiriki limetajwa katika tanbihi.
- issue: Maana ya ἡ πρόθεσις τῶν ἄρτων
  choice: mikate iliyowekwa mbele
  alternative: uwekaji wa mikate; mikate ya Wonyesho; mikate ya Kuwapo
  rationale: Kigiriki kinasisitiza kuwekwa kwa mikate. Matini kuu inadumisha tendo hilo kwa lugha ya kawaida, na tanbihi inatoa majina mengine yanayotumiwa katika mapokeo ya tafsiri bila kuamua zaidi ya ushahidi wa chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya maandiko. Sentensi ndefu ya Kigiriki imegawanywa kwa usomaji wa kawaida, lakini uhusiano wa vipashio na mpangilio wa hoja umehifadhiwa. “Mlikuwa na” linaafikiana na ngeli ya mahali na orodha ya vitu vilivyokuwa ndani ya hema.
