id: HEB.9.14
reference: Hebrews 9:14
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: πόσῳ μᾶλλον τὸ αἷμα τοῦ Χριστοῦ, ὃς διὰ πνεύματος αἰωνίου ἑαυτὸν προσήνεγκεν ἄμωμον τῷ θεῷ, καθαριεῖ τὴν συνείδησιν ⸀ἡμῶν ἀπὸ νεκρῶν ἔργων εἰς τὸ λατρεύειν θεῷ ζῶντι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/014.yaml
  text: how much more will the blood of Messiah—who through the eternal Spirit offered himself without blemish to God—cleanse our conscience from dead works to serve the living God[a].
translation:
  language: sw
  text: Je, damu ya Masihi—ambaye kwa njia ya Roho wa milele[a] alijitoa mwenyewe kwa Mungu bila dosari—haitaisafisha zaidi sana dhamiri yetu kutokana na matendo mafu, ili tumtumikie Mungu aliye hai?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa njia ya roho ya milele.” Kirai cha Kigiriki kinaweza kueleweka kwa maana ya jumla zaidi, ingawa hapa “Roho wa milele” anaeleweka kuwa Roho Mtakatifu.
    reason: alternative_reading
lexical_decisions:
- source_word: πόσῳ μᾶλλον
  choice: Je, si zaidi sana
  rationale: Muundo huu wa swali la balagha unahifadhi hoja ya kulinganisha yenye nguvu kutoka mstari uliotangulia na unasikika kwa kawaida katika Kiswahili.
- source_word: τὸ αἷμα τοῦ Χριστοῦ
  choice: damu ya Masihi
  rationale: “Damu” inadumisha lugha halisi ya dhabihu, na “Masihi” inaonyesha matumizi ya Χριστός kama cheo cha Mtiwa-Mafuta.
- source_word: διὰ πνεύματος αἰωνίου
  choice: kwa njia ya Roho wa milele
  rationale: “Kwa njia ya” inadumisha maana ya διὰ; herufi kubwa katika “Roho” inaonyesha uelewa unaowezekana zaidi kwamba anayelengwa ni Roho Mtakatifu, huku tanbihi ikihifadhi uwezekano mwingine.
- source_word: ἑαυτὸν προσήνεγκεν
  choice: alijitoa mwenyewe
  rationale: Kitenzi hiki kinadumisha nguvu ya kujitoa kuwa sadaka bila kuongeza neno “sadaka,” ambalo halijaandikwa wazi katika kirai hiki.
- source_word: ἄμωμον
  choice: bila dosari
  rationale: Usemi huu unadumisha taswira ya dhabihu inayokubalika, isiyo na waa au kasoro.
- source_word: καθαριεῖ τὴν συνείδησιν ἡμῶν
  choice: itaisafisha dhamiri yetu
  rationale: Wakati ujao wa kitenzi na umoja wa “dhamiri” katika Kigiriki umehifadhiwa.
- source_word: ἀπὸ νεκρῶν ἔργων
  choice: kutokana na matendo mafu
  rationale: Tafsiri hii iliyo karibu na maneno ya asili inahifadhi uzito na utata wa usemi unaopatikana pia katika Waebrania 6:1.
- source_word: εἰς τὸ λατρεύειν θεῷ ζῶντι
  choice: ili tumtumikie Mungu aliye hai
  rationale: “Ili” inaonyesha kusudi, na “tumtumikie” inaruhusu maana pana ya ibada na huduma bila kuibana kuwa tendo moja la kidini.
theological_decisions:
- issue: Anayelengwa na πνεύματος αἰωνίου
  choice: Roho wa milele, akieleweka kuwa Roho Mtakatifu
  alternative: roho ya milele; huenda roho ya Masihi mwenyewe au namna ya kiroho ya kujitoa
  rationale: Sarufi ya Kigiriki inaruhusu zaidi ya uelewa mmoja. Maandishi makuu yanachukua uelewa unaowezekana zaidi wa Roho wa Mungu, lakini tanbihi inadumisha utata halisi.
- issue: Tafsiri ya Χριστός
  choice: Masihi
  alternative: Kristo
  rationale: Katika muktadha huu neno linafanya kazi kama cheo cha Mtiwa-Mafuta, hivyo “Masihi” inadumisha maana ya cheo hicho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa msomaji wa kawaida. Swali la balagha limetumiwa kuonyesha nguvu ya hoja, na vistari virefu vinatenga maelezo kuhusu Masihi bila kuvuruga sentensi kuu.
