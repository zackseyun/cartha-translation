  text: concerned only with foods and drinks and various washings, fleshly regulations imposed until the time of reformation.
translation:
  language: sw
  text: Hayo ni masharti ya kimwili yanayohusu tu vyakula, vinywaji, na taratibu mbalimbali za kuosha kwa maji, yaliyowekwa mpaka wakati wa kurekebishwa kwa mambo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βαπτισμοῖς
  choice: kujitakasa kwa maji
  rationale: Katika muktadha wa ibada za Agano la Kale, neno hili linarejelea taratibu mbalimbali za kuosha au kujitakasa kwa maji, si ubatizo wa Kikristo pekee.
- source_word: δικαιώματα σαρκὸς
  choice: masharti yanayohusu mwili
  rationale: Huhifadhi maana ya kanuni za nje zinazohusu hali ya kimwili bila kudokeza kwamba zenyewe ni zenye dhambi.
- source_word: διορθώσεως
  choice: kurekebishwa kwa mambo
  rationale: Hutoa wazo la kuwekwa sawa au kupangwa upya kwa hali ya mambo, huku ikiepuka kulifunga neno kwa mfumo maalumu wa kiteolojia.
- source_word: ἐπικείμενα
  choice: yaliyowekwa
  rationale: Katika muundo huu neno linaonyesha masharti yaliyowekwa au yaliyolazimishwa hadi wakati uliowekwa.
theological_decisions:
- issue: Maana ya καιροῦ διορθώσεως
  choice: wakati wa kurekebishwa kwa mambo
  alternative: wakati wa matengenezo
  rationale: Tafsiri iliyochaguliwa ni ya kawaida na pana; inadumisha mvutano wa kifungu kuhusu mpangilio wa zamani kuwekwa sawa bila kuingiza istilahi ya kimadhehebu.
- issue: Uhusiano wa σαρκὸς na δικαιώματα
  choice: masharti yanayohusu mwili
  alternative: masharti ya kimwili
  rationale: ‘Yanayohusu mwili’ linaeleza upeo wa masharti hayo na halilazimishi maana hasi ya kimaadili ambayo ‘ya kimwili’ inaweza kuwa nayo katika Kiswahili.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi mbili zimetumiwa kwa uwazi, huku muundo na maana ya Kiyunani vikihifadhiwa.
