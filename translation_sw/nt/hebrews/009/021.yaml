  text: καὶ τὴν σκηνὴν δὲ καὶ πάντα τὰ σκεύη τῆς λειτουργίας τῷ αἵματι ὁμοίως ἐράντισεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/021.yaml
  text: And likewise he sprinkled with the blood both the tabernacle and all the vessels of the ministry[a][b].
translation:
  language: sw
  text: Vivyo hivyo, alinyunyizia damu hema takatifu[a] na vyombo vyote vya huduma ya ibada[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au ‘hema.’ Neno la Kigiriki linaweza kumaanisha hema kwa ujumla, lakini hapa linarejelea hema takatifu la ibada.
    reason: lexical_alternative
  - marker: b
    text: Au ‘vifaa vyote vya huduma.’
    reason: lexical_alternative
lexical_decisions:
- source_word: σκηνή
  choice: hema takatifu
  rationale: Neno σκηνή kimsingi ni ‘hema,’ lakini katika muktadha huu linamaanisha hema takatifu la ibada la wakati wa Musa. ‘Hema takatifu’ ni wazi kwa msomaji wa Kiswahili bila kuingiza maelezo yasiyomo katika mstari.
- source_word: σκεύη
  choice: vyombo
  rationale: Katika muktadha wa ibada, σκεύη ni vyombo au vifaa vilivyotumiwa katika utumishi wa mahali patakatifu. ‘Vyombo’ hudumisha sajili ya kiibada na ni neno la kawaida la Kiswahili.
- source_word: λειτουργία
  choice: huduma ya ibada
  rationale: Hapa λειτουργία linahusu huduma ya kikuhani katika hema takatifu. ‘Huduma ya ibada’ huonyesha maana hiyo maalumu kwa uwazi kuliko ‘huduma’ peke yake.
- source_word: αἷμα
  choice: damu
  rationale: Ni damu halisi ya dhabihu katika tendo la kiibada; tafsiri ya moja kwa moja inafaa.
- source_word: ὁμοίως
  choice: vivyo hivyo
  rationale: Huunganisha tendo hili na kunyunyiza kulikotajwa katika mstari uliotangulia na kuhifadhi nguvu ya ulinganisho.
- source_word: ἐράντισεν
  choice: alilinyunyizia
  rationale: Kitenzi cha Kiswahili katika kauli ya kutendea huonyesha kwa kawaida kwamba damu ilinyunyizwa juu ya hema na vyombo; kiambishi ‘-li-’ kinarejelea hema, huku ‘pamoja na’ kikijumuisha vyombo.
- source_word: δὲ
  choice: pamoja na muunganisho wa sentensi
  rationale: δέ hapa ni kiunganishi hafifu, si kinyume chenye nguvu. Kiswahili cha asili hakihitaji neno tofauti zaidi ya mtiririko wa ‘Vivyo hivyo’ na uratibu unaofuata.
- source_word: πάντα τὰ σκεύη
  choice: vyombo vyote
  rationale: Huhifadhi wazo la ujumla na ukamilifu wa vitu vilivyohusika.
theological_decisions:
- issue: Uhusiano wa kauli hii na taratibu za Musa zinazosimuliwa katika Kutoka
  choice: Kauli imetafsiriwa moja kwa moja kuwa muhtasari wa kunyunyiziwa damu kwa hema takatifu na vyombo vyake.
  alternative: Kuongeza maelezo ili kuoanisha au kufafanua tofauti za maelezo kati ya Waebrania na Kutoka.
  rationale: Mstari wenyewe unatoa muhtasari bila maelezo ya ziada. Tafsiri haipaswi kutatua kimya kimya maswali ya kihistoria au ya mwingiliano wa maandiko.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Hema takatifu’ na ‘huduma ya ibada’ hutoa muktadha wa kiibada kwa uwazi bila kutumia msamiati mzito usio wa kawaida. Muundo ‘pamoja na’ unaakisi uunganisho wa jozi katika Kigiriki.
