lexical_decisions:
- source_word: μετὰ ... τὸ δεύτερον καταπέτασμα
  choice: nyuma ya pazia la pili
  rationale: Katika maelezo haya ya mahali ndani ya hema, μετά pamoja na hali ya akusativi inaonyesha uhusiano wa mahali, si wakati. “Nyuma ya” ni Kiswahili cha kawaida na καταπέτασμα hapa ni pazia la ndani.
- source_word: δὲ
  choice: Na
  rationale: δέ ni kiunganishi hafifu kinachoendeleza maelezo bila kusisitiza tofauti.
- source_word: σκηνὴ
  choice: sehemu ya hema
  rationale: σκηνή hutaja hema la ibada, lakini katika muktadha huu hasa ni sehemu yake ya ndani. “Sehemu ya hema” huhifadhi picha ya hema huku ikifanya marejeo ya eneo hilo yaeleweke.
- source_word: ἡ λεγομένη
  choice: iliyoitwa
  rationale: Kirai cha kisifa kimetafsiriwa kwa njia ya kawaida na ya moja kwa moja katika Kiswahili.
- source_word: Ἅγια Ἁγίων
  choice: Patakatifu Zaidi
  rationale: Huu ni usemi wa Kisemiti wenye maana ya kiwango cha juu kabisa cha utakatifu. “Patakatifu Zaidi” ni wazi na wa sasa; tafsiri ya karibu zaidi na muundo wa asili imehifadhiwa katika tanbihi.
theological_decisions:
- issue: Tafsiri ya jina la patakatifu Ἅγια Ἁγίων
  choice: Patakatifu Zaidi
  alternative: Patakatifu pa Patakatifu
  rationale: Chaguo kuu linaeleza kwa lugha ya kawaida kwamba hapa ni mahali patakatifu kuliko pengine, bila kubadili marejeo ya patakatifu pa ndani kabisa. Muundo wa jadi na wa karibu zaidi na Kigiriki umetolewa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. “Pazia” limetumiwa badala ya istilahi nzito zaidi, na “sehemu ya hema” huepuka kudokeza kwamba kulikuwa na hema jingine tofauti.
