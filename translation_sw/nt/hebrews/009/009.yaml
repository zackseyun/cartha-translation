  text: ἥτις παραβολὴ εἰς τὸν καιρὸν τὸν ἐνεστηκότα, καθ’ ⸀ἣν δῶρά τε καὶ θυσίαι προσφέρονται μὴ δυνάμεναι κατὰ συνείδησιν τελειῶσαι τὸν λατρεύοντα,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/009.yaml
  text: which is a parable for the present time[a], according to which both gifts and sacrifices are offered that are not able to perfect the worshiper with respect to conscience,
translation:
  language: sw
  text: Hilo ni mfano kwa wakati wa sasa[a]. Kwa kufuata mpangilio huo, hutolewa zawadi na dhabihu ambazo haziwezi kumkamilisha anayeabudu kwa habari ya dhamiri yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ishara” au “kielelezo” kwa wakati wa sasa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥτις
  choice: Hilo
  rationale: Kiwakilishi hiki kinarejelea hema la kwanza au mpangilio wake uliotajwa kabla, huku kikiendeleza maelezo bila kulazimisha marejeo kuwa finyu kupita kiasi.
- source_word: παραβολὴ
  choice: mfano
  rationale: Katika muktadha huu neno linaonyesha uwakilishi au ulinganifu wa kiishara. “Mfano” ni Kiswahili cha kawaida na pana; maana mbadala ya “ishara” imehifadhiwa katika tanbihi.
- source_word: εἰς τὸν καιρὸν τὸν ἐνεστηκότα
  choice: kwa wakati wa sasa
  rationale: Inahifadhi wazo la wakati uliopo katika hoja ya mwandishi bila kuufasiri moja kwa moja kuwa enzi maalumu.
- source_word: καθ’ ἣν
  choice: Kwa kufuata mpangilio huo
  rationale: Kirejeshi cha Kigiriki kinaweza kuhusishwa na mfano au, kisarufi, na hema; tafsiri hii inaeleza uhusiano wa utoaji wa ibada na mpangilio uliowakilishwa bila kufanya sentensi ya Kiswahili kuwa nzito.
- source_word: δῶρά τε καὶ θυσίαι
  choice: zawadi na dhabihu
  rationale: Inadumisha istilahi mbili za ibada; muunganiko “na” unawasilisha jozi hiyo kwa Kiswahili cha kawaida.
- source_word: προσφέρονται
  choice: hutolewa
  rationale: Hali ya kutendwa na tendo linaloendelea au la kawaida katika ibada vinaonyeshwa kwa umbo la “hu-”.
- source_word: μὴ δυνάμεναι
  choice: ambazo haziwezi
  rationale: Inaonyesha wazi kutokuwa na uwezo kwa zawadi na dhabihu hizo.
- source_word: τελειῶσαι
  choice: kumkamilisha
  rationale: 'Inahifadhi uzito wa τελειόω katika Waebrania: kumfikisha mtu kwenye hali iliyokusudiwa ya ukamilifu au ustahili, badala ya kuibadili kuwa kusafisha tu.'
- source_word: κατὰ συνείδησιν
  choice: kwa habari ya dhamiri yake
  rationale: Inaweka kikomo cha kutokamilishwa katika eneo la dhamiri, bila kudokeza tu unyofu wa hisia binafsi.
- source_word: τὸν λατρεύοντα
  choice: anayeabudu
  rationale: Ni usemi wa asili unaomtaja mtu anayeshiriki katika ibada bila kuongeza kwamba ni kuhani.
theological_decisions:
- issue: Maana ya παραβολή katika muktadha wa hema na ibada
  choice: mfano
  alternative: ishara au kielelezo
  rationale: “Mfano” huhifadhi wazo pana la ulinganifu wenye maana bila kuufanya mpangilio wa hema kuwa ishara ya kidhahania tu; tanbihi inadumisha maana nyingine halali.
- issue: Upeo wa ukamilishaji katika κατὰ συνείδησιν
  choice: kumkamilisha anayeabudu kwa habari ya dhamiri yake
  alternative: kuitakasa dhamiri ya anayeabudu
  rationale: Chanzo kinasema kukamilisha kwa habari ya dhamiri, si moja kwa moja kuitakasa dhamiri. Tafsiri iliyochaguliwa inahifadhi tofauti hiyo na uzito wa istilahi ya ukamilifu katika Waebrania.
- issue: Marejeo ya wakati wa sasa
  choice: wakati wa sasa
  alternative: enzi ya sasa
  rationale: Tafsiri hii inadumisha uwezekano wa kuelewa wakati unaokuwapo katika hoja bila kuamua kimbele mpangilio mahsusi wa nyakati za wokovu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Sentensi imegawanywa mara mbili kwa usomaji wa asili; “mpangilio huo” huunganisha utoaji wa zawadi na dhabihu na hema/mfano uliotangulia bila kuondoa utata wa msingi.
