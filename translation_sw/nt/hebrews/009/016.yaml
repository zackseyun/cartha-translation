  yaml_path: translation/nt/hebrews/009/016.yaml
  text: For where there is a covenant[a], it is necessary for the death of the one who made it to be brought forward.
translation:
  language: sw
  text: Kwa maana palipo na agano[a], ni lazima kifo cha yule aliyelifanya kithibitishwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa maana palipo na wosia, ni lazima kifo cha yule aliyeutoa wosia huo kithibitishwe.” Neno la Kigiriki diathēkē linaweza kumaanisha “agano” au “wosia,” na wengi huielewa mistari ya 16–17 kwa maana ya kisheria hapa.
    reason: alternative_reading
lexical_decisions:
- source_word: διαθήκη
  choice: agano
  rationale: Muktadha mpana wa Waebrania 8–10 unahusu agano, hasa agano jipya na kuthibitishwa kwake kwa damu. Hata hivyo, maana ya ‘wosia’ inabaki kuwa uwezekano halisi na imehifadhiwa katika tanbihi.
- source_word: θάνατον
  choice: kifo
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja; hapa kinachozungumziwa ni kifo halisi.
- source_word: ἀνάγκη
  choice: ni lazima
  rationale: Hutoa kwa Kiswahili cha kawaida na wazi wazo la ulazima.
- source_word: φέρεσθαι
  choice: kithibitishwe
  rationale: Kitenzi hiki kihalisi kina wazo la kuletwa au kutolewa mbele. Katika hoja hii, ‘kithibitishwe’ kinaeleza kwa lugha ya kawaida kwamba kifo lazima kiwekwe wazi kama ukweli unaotumika, bila kutumia kauli ngumu isiyo ya kawaida.
- source_word: τοῦ διαθεμένου
  choice: yule aliyelifanya
  rationale: Hurejelea mtu aliyefanya au aliyeweka agano/wosia, huku kiwakilishi ‘-li-’ kikirejelea agano bila kulazimisha maana finyu ya ‘mtoa wosia’ katika matini kuu.
- source_word: ὅπου γὰρ
  choice: Kwa maana palipo na
  rationale: ‘Kwa maana’ huhifadhi kazi ya γάρ ya kutoa sababu, na ‘palipo na’ ni Kiswahili cha asili kwa ὅπου katika sentensi hii.
theological_decisions:
- issue: Iwapo διαθήκη katika Waebrania 9:16 litafsiriwe ‘agano’ au ‘wosia’
  choice: ‘agano’ katika matini kuu, na ‘wosia’ katika tanbihi
  alternative: ‘wosia’ katika matini kuu
  rationale: Hoja pana ya Waebrania 8–10 inatawaliwa na agano jipya na damu ya dhabihu, hivyo ‘agano’ hudumisha mwendelezo wa muktadha. Lakini mistari 16–17 inaweza kueleweka kisheria kuhusu wosia; tanbihi huhifadhi utata huo wa kweli badala ya kuumaliza kimya kimya.
- issue: Jinsi ya kueleza φέρεσθαι kuhusiana na kifo
  choice: ‘kithibitishwe’
  alternative: ‘kiletwe mbele’ au ‘kionyeshwe’
  rationale: ‘Kithibitishwe’ ni kauli ya kawaida zaidi katika Kiswahili na inabeba wazo la kifo kuletwa mbele au kuonyeshwa kuwa kimetokea na kina nguvu katika hoja. Hata hivyo, tafsiri hiyo haikusudii kudai kwamba kitenzi cha Kigiriki chenyewe ni istilahi maalumu ya kisheria.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo umefanywa kuwa wa asili bila kuondoa utata wa neno διαθήκη.
