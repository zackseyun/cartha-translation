base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/025.yaml
  text: Nor was it so that he might offer himself many times[a], just as the high priest enters the holy places year by year with blood not his own,
translation:
  language: sw
  text: Wala hakuingia ili ajitoe mwenyewe kuwa dhabihu mara nyingi, kama vile kuhani mkuu anavyoingia mahali patakatifu[a] mwaka baada ya mwaka kwa damu isiyo yake mwenyewe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “patakatifu.” Kigiriki kina umbo la wingi, “mahali patakatifu”; katika muktadha huu wa ibada, wengine huelewa kwa umahususi zaidi kuwa “Patakatifu pa Patakatifu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδ’ ἵνα
  choice: Wala haikuwa ili
  rationale: Inaendeleza wazo lililokanushwa katika mstari uliotangulia na kuhifadhi maana ya kusudi bila kulazimisha kurudia kitenzi kisichotajwa hapa.
- source_word: πολλάκις
  choice: mara nyingi
  rationale: Ni tafsiri ya moja kwa moja inayoonyesha urudiaji na kuandaa ulinganisho na tendo la kila mwaka la kuhani mkuu.
- source_word: προσφέρῃ ἑαυτόν
  choice: ajitoe mwenyewe kuwa dhabihu
  rationale: ‘Ajitoe’ huhifadhi hali ya kujitoa mwenyewe, na ‘kuwa dhabihu’ huweka wazi maana ya ibada ya προσφέρω katika muktadha huu.
- source_word: ὥσπερ
  choice: kama vile
  rationale: Huonyesha wazi ulinganisho kati ya Kristo na kuhani mkuu.
- source_word: ὁ ἀρχιερεὺς
  choice: kuhani mkuu
  rationale: Hili ndilo neno la kawaida na sahihi kwa cheo hiki cha ibada ya Kiyahudi.
- source_word: εἰσέρχεται
  choice: anavyoingia
  rationale: Wakati wa sasa umehifadhiwa kama tendo la kawaida linalorudiwa.
- source_word: εἰς τὰ ἅγια
  choice: mahali patakatifu
  rationale: Usemi huu wa Kiswahili ni wa asili na unaweza kurejelea eneo takatifu la patakatifu bila kuamua kimyakimya kwamba ni Patakatifu pa Patakatifu pekee.
- source_word: κατ’ ἐνιαυτὸν
  choice: mwaka baada ya mwaka
  rationale: Huonyesha kwa kawaida na kwa wazi urudiaji wa kila mwaka.
- source_word: ἐν αἵματι ἀλλοτρίῳ
  choice: kwa damu isiyo yake mwenyewe
  rationale: ‘Kwa damu’ huhifadhi maana ya chombo au njia, na ‘isiyo yake mwenyewe’ huonyesha kwamba damu hiyo ni ya mwingine, tofauti na kujitoa kwa Kristo mwenyewe.
theological_decisions:
- issue: Mahali panaporejelewa na εἰς τὰ ἅγια
  choice: mahali patakatifu
  alternative: Patakatifu pa Patakatifu
  rationale: Kigiriki kinatumia umbo la wingi, ‘vitu/mahali patakatifu,’ ambalo katika muktadha wa ibada linaweza kueleweka kwa upana kama patakatifu au kwa umahususi kama Patakatifu pa Patakatifu. Tafsiri kuu haibani maana hiyo kuliko ushahidi wa lugha asilia.
- issue: Ulinganisho wa Kristo na kuhani mkuu wa Walawi
  choice: Kristo hajitoi mara nyingi, tofauti na kuingia kwa kuhani mkuu kila mwaka kwa damu isiyo yake mwenyewe
  alternative: Kupanua wazi hapa fundisho la dhabihu ya mara moja kwa wakati wote
  rationale: Mstari unaweka tofauti ya urudiaji, lakini maelezo yote ya ‘mara moja kwa wakati wote’ yanajengwa na muktadha mpana; hayajaongezwa ndani ya mstari huu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo ‘ajitoe mwenyewe kuwa dhabihu’ unaweka wazi maana ya dhabihu bila kuwa mzito, na ‘mwaka baada ya mwaka’ huwasilisha urudiaji kwa ufasaha.
