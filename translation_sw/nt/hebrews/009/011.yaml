  text: Χριστὸς δὲ παραγενόμενος ἀρχιερεὺς τῶν ⸀γενομένων ἀγαθῶν διὰ τῆς μείζονος καὶ τελειοτέρας σκηνῆς οὐ χειροποιήτου, τοῦτ’ ἔστιν οὐ ταύτης τῆς κτίσεως,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/011.yaml
  text: But the Messiah came as high priest of the good things that have come[a], through the greater and more perfect tabernacle not made by hands—that is[b], not of this creation—
translation:
  language: sw
  text: Lakini Masihi alipokuja akiwa Kuhani Mkuu wa mema yaliyokuja[a]; kwa njia ya hema kubwa zaidi na kamilifu zaidi, lisilofanywa kwa mikono, yaani, lisilo la uumbaji huu—[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati zina, “mema yatakayokuja.”
    reason: textual_variant
  - marker: b
    text: Sentensi inaendelea katika mstari wa 12; kirai “kwa njia ya hema” hueleweka pamoja na “aliingia” katika mstari huo.
    reason: syntax_clarification
lexical_decisions:
- source_word: Χριστὸς
  choice: Masihi
  rationale: Katika muktadha huu neno linatumika kama cheo; “Masihi” ni tafsiri ya kawaida na inayoeleweka katika Kiswahili cha kibiblia.
- source_word: δὲ
  choice: Lakini
  rationale: Linaonyesha tofauti na maelezo yaliyotangulia kuhusu hema la duniani na huduma ya ukuhani.
- source_word: παραγενόμενος
  choice: alipokuja
  rationale: Huwasilisha kwa kawaida tendo la kuja au kujitokeza kwa Masihi katika nafasi yake ya kikuhani bila kulifanya kuwa kitenzi kikuu tofauti na sentensi inayoendelea.
- source_word: ἀρχιερεὺς
  choice: Kuhani Mkuu
  rationale: Hili ndilo neno sanifu la Kiswahili kwa cheo hiki cha kikuhani katika Waebrania.
- source_word: τῶν γενομένων ἀγαθῶν
  choice: wa mema ambayo yamekwisha kuja
  rationale: Inafuata usomaji wa SBLGNT γενομένων na kudumisha wazo kwamba mema hayo tayari yamefika, bila kuyafafanua zaidi.
- source_word: διὰ τῆς ... σκηνῆς
  choice: alipitia hema ...
  rationale: “Kupitia” huhifadhi maana ya διὰ pamoja na hali ya umilikishi; “hema” ni neno la kawaida la Kiswahili linalobeba taswira ya hema la kukutania. Kirai hiki pia kinaelekea kwenye kitenzi cha kuingia katika mstari wa 12.
- source_word: μείζονος
  choice: kubwa zaidi
  rationale: Katika muktadha huu huonyesha ubora na ukuu wa hema hilo, si ukubwa wa kimwili pekee.
- source_word: τελειοτέρας
  choice: kamilifu zaidi
  rationale: Huhifadhi uhusiano wa istilahi na mada ya ukamilifu katika Waebrania.
- source_word: οὐ χειροποιήτου
  choice: halikufanywa kwa mikono ya wanadamu
  rationale: Hutoa kwa Kiswahili cha kawaida nahau ya Kiyunani inayomaanisha kwamba si kazi ya utengenezaji wa binadamu.
- source_word: τοῦτ’ ἔστιν
  choice: yaani
  rationale: Ni kiunganishi cha kawaida na wazi cha kuanzisha ufafanuzi.
- source_word: οὐ ταύτης τῆς κτίσεως
  choice: si sehemu ya uumbaji huu
  rationale: Huwasilisha kwa kawaida kwamba hema hilo halitokani wala halimo katika mpangilio huu wa vitu vilivyoumbwa.
theological_decisions:
- issue: Usomaji wa τῶν γενομένων ἀγαθῶν
  choice: wa mema ambayo yamekwisha kuja
  alternative: wa mema yatakayokuja
  rationale: Matini kuu inafuata γενομένων katika SBLGNT, inayosema mema yamekwisha kuja. Usomaji unaojulikana wa μελλόντων, “yatakayokuja,” umehifadhiwa katika tanbihi kwa uwazi wa kiuhakiki.
- issue: Uhusiano wa διὰ τῆς ... σκηνῆς na sentensi inayofuata
  choice: alipitia hema ... —
  alternative: kuunganisha kirai hicho moja kwa moja na kuja kwa Masihi
  rationale: Muundo na alama ya mwisho huacha sentensi ikiendelea hadi mstari wa 12, ambako kirai hicho kwa kawaida huhusishwa na kuingia kwake, na hivyo huepuka kudokeza kwamba hema lilikuwa njia ya Masihi kuja duniani.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Herufi kubwa katika “Kuhani Mkuu” inaonyesha cheo cha Masihi. Alama ya kistari mwishoni inaonyesha kwamba sentensi inaendelea katika mstari unaofuata.
