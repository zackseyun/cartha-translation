  text: οὐ γὰρ εἰς χειροποίητα ⸂εἰσῆλθεν ἅγια⸃ Χριστός, ἀντίτυπα τῶν ἀληθινῶν, ἀλλ’ εἰς αὐτὸν τὸν οὐρανόν, νῦν ἐμφανισθῆναι τῷ προσώπῳ τοῦ θεοῦ ὑπὲρ ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/024.yaml
  text: For Messiah did not enter into holy places made by hands[a], copies of the true things, but into heaven itself[c][b], now to appear in the presence of God on our behalf.
translation:
  language: sw
  text: Kwa maana Masihi[a] hakuingia katika sehemu takatifu zilizotengenezwa kwa mikono ya wanadamu, ambazo ni vielelezo[b] vya mambo halisi, bali aliingia mbinguni kwenyewe, ili sasa aonekane mbele ya Mungu[c] kwa niaba yetu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au “Kristo.” Kigiriki: Χριστός. Maandishi yametumia “Masihi” kwa sababu hapa maana ya cheo hicho inasisitizwa.'
    reason: alternative_reading
  - marker: b
    text: Au “nakala,” “viwakilishi,” au “vitu vinavyolingana.” Neno la Kigiriki linaonyesha vitu vinavyolingana na uhalisi wa mbinguni.
    reason: lexical_alternative
  - marker: c
    text: Kisisi, “mbele ya uso wa Mungu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστός
  choice: Masihi
  rationale: Neno limetafsiriwa kama cheo, kwa kuwa muktadha unasisitiza kazi yake ya Kimasihi na ya ukuhani; “Kristo” limewekwa kama chaguo katika tanbihi.
- source_word: χειροποίητα
  choice: zilizotengenezwa kwa mikono ya wanadamu
  rationale: Kauli hii inahifadhi tofauti kati ya mahali palipojengwa na wanadamu na uhalisi wa mbinguni, huku ikisikika kwa kawaida katika Kiswahili.
- source_word: ἅγια
  choice: sehemu takatifu
  rationale: Wingi wa Kigiriki umehifadhiwa bila kuamua kimbele kuwa neno hilo linamaanisha chumba kimoja maalumu cha maskani.
- source_word: ἀντίτυπα
  choice: vielelezo
  rationale: Neno hili linaonyesha vitu vya duniani vinavyolingana na kuwakilisha uhalisi wa mbinguni; linaepuka dhana finyu ya nakala iliyotolewa moja kwa moja.
- source_word: τῶν ἀληθινῶν
  choice: vya mambo halisi
  rationale: “Halisi” hapa huonyesha uhalisi wa mwisho wa mbinguni, wala si kusema tu kwamba mambo hayo ni ya kweli kinyume cha uongo.
- source_word: αὐτὸν τὸν οὐρανόν
  choice: mbinguni kwenyewe
  rationale: “Kwenyewe” linahifadhi msisitizo wa muundo wa Kigiriki kwamba aliingia mbinguni hasa, si katika mfano wake wa duniani.
- source_word: νῦν
  choice: sasa
  rationale: Kielezi cha wakati kimehifadhiwa ili kuonyesha umuhimu wa sasa wa kuonekana kwake mbele za Mungu.
- source_word: ἐμφανισθῆναι
  choice: aonekane
  rationale: Hii inawasilisha kwa kawaida kusudi la kuingia kwake bila kuongeza waziwazi maneno kama “ajionyeshe,” ambayo hayamo katika Kigiriki.
- source_word: τῷ προσώπῳ τοῦ θεοῦ
  choice: mbele za Mungu
  rationale: Ni usemi wa kawaida wa Kiswahili unaohifadhi wazo la kufika katika uwepo wa Mungu; tafsiri sisisi zaidi imetolewa katika tanbihi.
- source_word: ὑπὲρ ἡμῶν
  choice: kwa niaba yetu
  rationale: Kauli hii inaonyesha wazi kazi ya uwakilishi na upatanishi katika muktadha wa ukuhani bila kuingiza nadharia maalumu ya upatanisho.
theological_decisions:
- issue: Istilahi ya ibada katika ἅγια
  choice: sehemu takatifu
  alternative: patakatifu; mahali patakatifu
  rationale: Wingi wa maandishi asilia umehifadhiwa, na tafsiri haijafungia maana kwenye chumba kimoja maalumu cha maskani.
- issue: Cheo cha Kikristo Χριστός
  choice: Masihi
  alternative: Kristo
  rationale: Katika hoja hii kuhusu kuingia kwa kuhani na kutimizwa kwa mifano ya ibada, maana ya cheo iko hai; chaguo la kawaida “Kristo” limetajwa katika tanbihi.
- issue: Nguvu ya uwakilishi katika ὑπὲρ ἡμῶν
  choice: kwa niaba yetu
  alternative: kwa ajili yetu
  rationale: “Kwa niaba yetu” huhifadhi kwa uwazi zaidi wazo la uwakilishi wa kikuhani bila kufafanua zaidi ya aya yenyewe.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi umehifadhi hoja ya kulinganisha mahali patakatifu pa duniani na mbingu yenyewe, huku “ili” likiweka wazi kusudi la kuingia kwake.
