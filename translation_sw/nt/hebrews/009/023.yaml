  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἀνάγκη οὖν τὰ μὲν ὑποδείγματα τῶν ἐν τοῖς οὐρανοῖς τούτοις καθαρίζεσθαι, αὐτὰ δὲ τὰ ἐπουράνια κρείττοσι θυσίαις παρὰ ταύτας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/023.yaml
  text: Therefore it was necessary for the copies of the things in the heavens to be cleansed with these[c][b][a], but the heavenly things themselves with better sacrifices than these.
translation:
  language: sw
  text: Kwa hiyo, ilikuwa lazima vielelezo[a] vya vitu vilivyo mbinguni vitakaswe[b] kwa dhabihu hizi, lakini vitu vya mbinguni vyenyewe vitakaswe kwa dhabihu[c] zilizo bora kuliko hizi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nakala” au “mifano.”
    reason: lexical_alternative
  - marker: b
    text: Au “visafishwe.” Kitenzi hiki ni lugha ya ibada inayohusu kusafishwa au kutakaswa.
    reason: lexical_alternative
  - marker: c
    text: Kigiriki kinasema “dhabihu” kwa wingi, ingawa muktadha wa Waebrania unakazia kujitoa kwa Masihi mara moja tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνάγκη οὖν
  choice: Kwa hiyo, ilikuwa lazima
  rationale: “Kwa hiyo” linaonyesha hitimisho kutokana na hoja iliyotangulia, na “ilikuwa lazima” linawasilisha kwa Kiswahili cha kawaida kishazi cha Kigiriki kisicho na kiima wazi huku likifaa muktadha wa matendo yaliyotajwa.
- source_word: ὑποδείγματα
  choice: vielelezo
  rationale: Neno hili linaonyesha vitu vya kidunia vinavyowakilisha au kuakisi vitu vya mbinguni. “Vielelezo” ni la kawaida na halidokezi tu nakala ya maandishi; mbadala “nakala” na “mifano” zimehifadhiwa katika tanbihi.
- source_word: τῶν ἐν τοῖς οὐρανοῖς
  choice: vya vitu vilivyo mbinguni
  rationale: Muundo huu unahifadhi maana ya vitu vilivyoko katika ulimwengu wa mbinguni bila kuvitambulisha kwa tafsiri maalumu zaidi. Kiswahili “mbinguni” ni namna ya kawaida ya kuwasilisha wazo la Kigiriki οὐρανοῖς.
- source_word: καθαρίζεσθαι
  choice: vitakaswe
  rationale: Katika muktadha huu kitenzi ni lugha ya ibada kuhusu utakaso. “Vitakaswe” ni cha asili katika Kiswahili cha kibiblia na bado kinaeleweka kwa wasomaji wa sasa.
- source_word: τούτοις
  choice: kwa dhabihu hizi
  rationale: Kigiriki kina kiwakilishi tu, lakini ulinganisho wa mwisho wa sentensi unaonyesha kuwa kinarejelea dhabihu za kidunia. Kuleta nomino “dhabihu” kunafanya Kiswahili kiwe wazi na cha kawaida bila kubadili hoja.
- source_word: αὐτὰ δὲ τὰ ἐπουράνια
  choice: lakini vitu vya mbinguni vyenyewe
  rationale: “Vyenyewe” linahifadhi mkazo wa αὐτά, na “vitu vya mbinguni” linaacha rejeo lake pana kama lilivyo badala ya kulifafanua kuwa patakatifu au watu.
- source_word: κρείττοσι θυσίαις
  choice: kwa dhabihu zilizo bora
  rationale: “Bora” linawasilisha neno muhimu κρείττων katika Waebrania, na “dhabihu” imeachwa katika maana ya wingi kama ilivyo katika Kigiriki.
- source_word: παρὰ ταύτας
  choice: kuliko hizi
  rationale: Baada ya kivumishi cha ulinganisho, παρά lina maana ya “kuliko.” “Hizi” linarejelea dhabihu za kidunia zilizotajwa katika sehemu ya kwanza ya mstari.
theological_decisions:
- issue: Rejeo la “vitu vya mbinguni” na kutakaswa kwake
  choice: Kudumisha kauli kwamba vitu vya mbinguni vyenyewe vinatakaswa.
  alternative: Kufafanua vitu hivyo kuwa patakatifu pa mbinguni, watu wa mbinguni, au kubadili sentensi ili isiseme kuwa vya mbinguni vinatakaswa.
  rationale: Kigiriki kinatofautisha vielelezo vya kidunia na vitu vya mbinguni vyenyewe na kinatumia lugha ya utakaso kwa vyote. Tafsiri haiondoi mvutano huo wa kiteolojia kwa maelezo ya kimadhehebu.
- issue: Wingi wa “dhabihu” ukilinganishwa na sadaka moja ya Masihi
  choice: 'Kuhifadhi wingi: “dhabihu.”'
  alternative: Kutafsiri kwa umoja, “dhabihu iliyo bora” au “sadaka iliyo bora.”
  rationale: Ingawa Waebrania hukazia pia kujitoa kwa Masihi mara moja tu, mstari huu una θυσίαις katika wingi. Wingi umehifadhiwa badala ya kuoanisha sentensi kimya kimya na kauli za sehemu nyingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa sasa, wenye heshima na unaosomeka kwa urahisi. Msamiati wa ibada umehifadhiwa bila kuingiza ufafanuzi wa kimadhehebu. Alama zote za tanbihi [a], [b], na [c] zimewekwa moja kwa moja baada ya maneno yanayohusika.
