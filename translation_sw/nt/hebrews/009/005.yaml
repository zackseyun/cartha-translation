id: HEB.9.5
reference: Hebrews 9:5
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὑπεράνω δὲ αὐτῆς Χερουβὶν δόξης κατασκιάζοντα τὸ ἱλαστήριον· περὶ ὧν οὐκ ἔστιν νῦν λέγειν κατὰ μέρος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/005.yaml
  text: And above it were the cherubim of glory overshadowing the atoning sacrifice[a]; about these things it is not now possible to speak in detail.
translation:
  language: sw
  text: Na juu yake palikuwa na makerubi wa utukufu, wakikitia kifuniko cha upatanisho[a] kivuli. Kuhusu mambo hayo, sasa haiwezekani kusema kwa undani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kiti cha rehema,” yaani, kifuniko cha sanduku; au “kipatanisho.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπεράνω δὲ αὐτῆς
  choice: Na juu yake
  rationale: Kirai hiki kinaonyesha mahali pa makerubi juu ya sanduku lililotajwa katika muktadha uliotangulia, bila kurudia jina la sanduku.
- source_word: Χερουβὶν
  choice: makerubi
  rationale: Hili ndilo umbo la wingi linalotambulika katika Kiswahili cha Biblia kwa viumbe hawa wa mbinguni.
- source_word: δόξης
  choice: wa utukufu
  rationale: Linahifadhi muundo mfupi wa Kigiriki na uhusiano wa makerubi na utukufu wa Mungu bila kuufafanua kupita kiasi.
- source_word: κατασκιάζοντα
  choice: wakikifunika kwa kivuli
  rationale: Inaeleza kwa lugha ya kawaida jinsi makerubi walivyokuwa juu ya kifuniko na kukienezea kivuli.
- source_word: τὸ ἱλαστήριον
  choice: kifuniko cha upatanisho
  rationale: Katika muktadha huu neno linarejelea kifuniko halisi cha sanduku, huku pia likibeba uhusiano wake na upatanisho; tafsiri hii huhifadhi pande zote mbili kuliko kutaja dhabihu isiyo kitu kinachofunikwa hapa.
- source_word: περὶ ὧν
  choice: Kuhusu mambo hayo
  rationale: Ni Kiswahili cha asili kinachorejelea vitu vya hema vilivyotajwa.
- source_word: οὐκ ἔστιν νῦν λέγειν κατὰ μέρος
  choice: sasa haiwezekani kusema kwa undani
  rationale: Linawasilisha kwa uwazi kauli ya mwandishi kwamba hawezi au si wakati wa kuyajadili mambo hayo moja moja sasa.
theological_decisions:
- issue: Maana ya ἱλαστήριον katika maelezo ya patakatifu
  choice: kifuniko cha upatanisho
  alternative: mahali pa rehema; kipatanisho
  rationale: Muktadha unataja kifuniko cha sanduku ambacho makerubi walikifunika kwa kivuli. 'Kifuniko cha upatanisho' kinatambulisha kitu hicho halisi na pia kinahifadhi maana yake ya kiibada, bila kukigeuza kuwa dhabihu yenyewe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya maandiko. Muundo ni wazi kwa msomaji wa kawaida huku istilahi za patakatifu na utata wa ἱλαστήριον vikihifadhiwa.
