id: HEB.9.12
reference: Hebrews 9:12
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οὐδὲ δι’ αἵματος τράγων καὶ μόσχων διὰ δὲ τοῦ ἰδίου αἵματος, εἰσῆλθεν ἐφάπαξ εἰς τὰ ἅγια, αἰωνίαν λύτρωσιν εὑράμενος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/012.yaml
  text: and not through the blood of goats and calves[a], but through his own blood, he entered once for all into the holy places, having obtained eternal redemption.
translation:
  language: sw
  text: wala si kwa damu ya mbuzi na ndama, bali kwa damu yake mwenyewe, aliingia mara moja tu katika sehemu takatifu[a], akiwa amepata ukombozi wa milele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika patakatifu.” Kigiriki kina usemi wenye umbo la wingi, “sehemu takatifu.” Tafsiri nyingine hutumia “Patakatifu Zaidi,” lakini hiyo ni tafsiri mahususi zaidi kuliko maneno yenyewe yanavyolazimu.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδὲ
  choice: wala si
  rationale: Huendeleza wazo la mstari uliotangulia na kuhifadhi nguvu ya kiunganishi pamoja na ukanushaji kwa Kiswahili cha kawaida.
- source_word: δι’ αἵματος τράγων καὶ μόσχων
  choice: kwa damu ya mbuzi na ndama
  rationale: ‘Kwa’ huonyesha njia au chombo na ni ya asili katika Kiswahili; ‘ndama’ ndilo neno mahususi kwa μόσχων katika muktadha huu.
- source_word: διὰ δὲ τοῦ ἰδίου αἵματος
  choice: bali kwa damu yake mwenyewe
  rationale: Kurudia ‘kwa’ kunahifadhi ulinganifu wa διά, huku ‘yake mwenyewe’ ikihifadhi msisitizo wa ἰδίου.
- source_word: εἰσῆλθεν
  choice: aliingia
  rationale: Huwasilisha kwa kawaida tendo lililokamilika linalosimuliwa na kitenzi cha Kigiriki cha wakati uliopita.
- source_word: ἐφάπαξ
  choice: mara moja tu
  rationale: Huonyesha tendo moja la uamuzi lisilorudiwa bila kutumia msemo mzito au usio wa kawaida katika Kiswahili.
- source_word: εἰς τὰ ἅγια
  choice: katika sehemu takatifu
  rationale: ‘Sehemu takatifu’ linaweza kuhifadhi umbo na upana wa usemi wa ibada wa Kigiriki bila kuufanya kwa lazima kuwa ‘Patakatifu Zaidi.’
- source_word: αἰωνίαν λύτρωσιν
  choice: ukombozi wa milele
  rationale: Ni usemi wa kawaida na sahihi kwa ukombozi wenye nguvu au matokeo yanayodumu daima.
- source_word: εὑράμενος
  choice: akiwa amepata
  rationale: Huwasilisha uhusiano wa kishiriki na maana ya kimuktadha ya kupata au kufanikisha, badala ya tafsiri halisi yenye kupotosha ya ‘kuona/kukuta.’
theological_decisions:
- issue: Maana ya kuingia kwa Kristo kwa damu yake mwenyewe
  choice: Masiya aliingia kwa damu yake mwenyewe, tofauti na damu ya wanyama, bila kufafanua utaratibu wa ziada ambao Kigiriki hakitaji.
  alternative: Aliingia akiwa amebeba au akiwasilisha damu yake kwa maana halisi ya kieneo; au aliingia tu baada ya kumwaga damu yake.
  rationale: Kurudia ‘kwa’ kwa διά pamoja na hali ya umilikaji kunahifadhi maana ya njia au chombo na ulinganifu wa dhabihu, bila kulazimisha maelezo ya jinsi damu ilivyohusika katika patakatifu pa mbinguni.
- issue: Upeo wa τὰ ἅγια
  choice: sehemu takatifu
  alternative: patakatifu; Patakatifu Zaidi
  rationale: Usemi wa Kigiriki una umbo la wingi na unaweza kutaja patakatifu kwa lugha ya ibada. ‘Patakatifu Zaidi’ ungefunga mapema swali la ufasiri ambalo matini yenyewe halifungi wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo ‘wala si ... bali ...’ unahifadhi utofautishaji wa matini; ‘mara moja tu’ ni wa kawaida na huonyesha kutorudiwa kwa tendo. Alama ya tanbihi imewekwa baada ya ‘sehemu takatifu,’ ambako tanbihi inahusika.
