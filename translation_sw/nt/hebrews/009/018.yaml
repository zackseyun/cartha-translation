  text: Therefore not even the first covenant was inaugurated without blood[a].
translation:
  language: sw
  text: Kwa hiyo, hata agano la kwanza halikuanzishwa bila damu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “la kwanza”—yaani, agano la kwanza. Nomino “agano” haikutajwa wazi katika Kigiriki, bali inaeleweka kutokana na muktadha. Wengine hutafsiri “wosia wa kwanza.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὅθεν
  choice: Kwa hiyo
  rationale: Huonyesha hitimisho linalotokana na hoja iliyotangulia; ni usemi wa kawaida na wazi katika Kiswahili cha sasa.
- source_word: οὐδὲ
  choice: hata ... haliku-
  rationale: Muundo huu unahifadhi msisitizo wa ‘not even’ kwa njia ya asili katika Kiswahili.
- source_word: ἡ πρώτη
  choice: agano la kwanza
  rationale: Nomino haijarudiwa katika Kigiriki, lakini kivumishi cha kike hurejelea agano linalozungumziwa katika muktadha. Kutaja ‘agano’ huondoa utata wa kisarufi bila kuongeza wazo jipya.
- source_word: χωρὶς αἵματος
  choice: bila damu
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida inayohifadhi maana ya kutokuwapo kwa damu katika tendo hilo.
- source_word: ἐγκεκαίνισται
  choice: halikuanzishwa
  rationale: Hutoa maana ya kuanzisha rasmi utaratibu au agano. Wakati uliopita unasomeka kwa kawaida katika Kiswahili, huku muktadha ukibeba uzito wa tendo lililokamilika.
theological_decisions:
- issue: Kirejelewa cha ‘la kwanza’
  choice: agano la kwanza
  alternative: ‘la kwanza’ pekee, au ‘wosia wa kwanza’
  rationale: Muktadha wa Waebrania 9 na dokezo la Kutoka 24 vinaelekeza kwenye agano. ‘Wosia’ inawezekana katika hoja ya karibu, lakini hapa ingefinya maana kuelekea upande wa kisheria; ‘la kwanza’ pekee lingekuwa lisilo wazi kwa wasomaji wengi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye staha, na inayoeleweka kwa wasomaji wa kawaida. Muundo ‘hata ... halikuanzishwa’ unadumisha msisitizo wa Kigiriki bila kusikika wa kigeni.
