  text: λαληθείσης γὰρ πάσης ἐντολῆς κατὰ ⸀τὸν νόμον ὑπὸ Μωϋσέως παντὶ τῷ λαῷ, λαβὼν τὸ αἷμα τῶν ⸀μόσχων μετὰ ὕδατος καὶ ἐρίου κοκκίνου καὶ ὑσσώπου αὐτό τε τὸ βιβλίον καὶ πάντα τὸν λαὸν ἐράντισεν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/019.yaml
  text: For when every commandment according to the law had been spoken by Moses to all the people[a], he took the blood of the calves with water and scarlet wool and hyssop, and sprinkled both the scroll itself and all the people,
translation:
  language: sw
  text: Kwa maana, Musa alipokwisha kuwaambia watu wote kila amri kulingana na sheria, alichukua damu ya ndama[a] pamoja na maji, sufu nyekundu na hisopo, akaunyunyiza damu hiyo juu ya kitabu chenyewe na juu ya watu wote,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “fahali wachanga.” Neno la Kigiriki linaweza kumaanisha ndama au fahali wachanga katika muktadha wa dhabihu.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαληθείσης γὰρ πάσης ἐντολῆς
  choice: Kwa maana, Musa alipokwisha kuwaambia ... kila amri
  rationale: Kirai huru cha jenitivi kimetafsiriwa kwa maana ya wakati; muundo huu wa Kiswahili unaonyesha kwamba kwanza Musa alitamka kila amri, kisha akafanya tendo la kunyunyiza. 'Kila amri' huhifadhi nguvu ya mgawanyo ya πάσης.
- source_word: κατὰ τὸν νόμον
  choice: kulingana na sheria
  rationale: Huhifadhi maana ya kufuata au kupatana na sheria bila kuongeza wazo kwamba kila jambo lilikuwa sharti lililoelezwa moja kwa moja.
- source_word: ὑπὸ Μωϋσέως ... παντὶ τῷ λαῷ
  choice: Musa ... kuwaambia watu wote
  rationale: Muundo tendaji ni wa kawaida zaidi katika Kiswahili na huhifadhi Musa kama mtendaji na watu wote kama wasikilizaji.
- source_word: λαβὼν
  choice: alichukua
  rationale: Kitenzi kikuu cha simulizi kinaonyesha hatua inayofuata baada ya kutamkwa kwa amri.
- source_word: τὸ αἷμα τῶν μόσχων
  choice: damu ya ndama[a]
  rationale: μόσχος inaweza kumaanisha ndama au fahali mchanga. 'Ndama' ni tafsiri ya moja kwa moja na mbadala umehifadhiwa katika tanbihi.
- source_word: μετὰ ὕδατος καὶ ἐρίου κοκκίνου καὶ ὑσσώπου
  choice: pamoja na maji, sufu nyekundu na hisopo
  rationale: '''Pamoja na'' huonyesha uambatanisho wa vitu hivyo. ''Sufu nyekundu'' ni ya kawaida na inafikisha picha ya ἔριον κοκκίνου; ''hisopo'' ni jina lililozoeleka la mmea wa kiibada.'
- source_word: αὐτό τε τὸ βιβλίον
  choice: kitabu chenyewe
  rationale: βιβλίον hapa ni hati iliyoandikwa; 'kitabu' ni Kiswahili cha kawaida na 'chenyewe' huhifadhi msisitizo wa αὐτό. Muktadha wa kale hauhitaji kulazimisha umbo mahususi la hati.
- source_word: πάντα τὸν λαὸν
  choice: watu wote
  rationale: Huhifadhi ujumla wa walengwa na kuoanisha usemi na 'watu wote' mapema katika mstari.
- source_word: ἐράντισεν
  choice: akakinyunyizia ... na
  rationale: Hutoa maana ya kunyunyiza kimiminika juu ya vitu na watu katika ibada. Kiambishi 'ki-' kinarejelea damu kama kitu kilichotumiwa kunyunyiza.
theological_decisions:
- issue: Uhusiano wa mstari huu na simulizi la Kutoka 24
  choice: Kutafsiri maelezo ya Kigiriki kama yalivyo bila kuyapatanisha kwa kuongeza au kupunguza vipengele vya simulizi la Kutoka.
  alternative: Kutumia istilahi au maelezo yaliyopanuliwa ili kuifanya ibada ilingane waziwazi na Kutoka 24.
  rationale: Waebrania inatoa usimuliaji wake uliobanwa; tafsiri inapaswa kuhifadhi maneno yake na mvutano wowote wa kimaelezo badala ya kuusawazisha kimyakimya.
- issue: Maana ya μόσχων katika mazingira ya dhabihu
  choice: ndama, huku 'fahali wachanga' ikiwekwa katika tanbihi
  alternative: fahali wachanga
  rationale: Maana zote mbili zinawezekana kileksika. Matini kuu inatumia neno pana na la moja kwa moja, huku tanbihi ikihifadhi uwezekano wa kiume unaofaa katika mazingira ya dhabihu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inadumisha mtiririko wa simulizi na koma ya mwisho kwa kuwa mstari unaendelea katika muktadha unaofuata.
