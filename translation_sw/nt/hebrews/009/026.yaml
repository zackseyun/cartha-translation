  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐπεὶ ἔδει αὐτὸν πολλάκις παθεῖν ἀπὸ καταβολῆς κόσμου· ⸀νυνὶ δὲ ἅπαξ ἐπὶ συντελείᾳ τῶν αἰώνων εἰς ἀθέτησιν ⸀ἁμαρτίας διὰ τῆς θυσίας αὐτοῦ πεφανέρωται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/026.yaml
  text: Otherwise[a], he would have had to suffer many times since the foundation of the world. But as it is[c][b], he has appeared once for all at the consummation of the ages to put away sin through the sacrifice of himself.
translation:
  language: sw
  text: La sivyo, ingempasa kuteseka mara nyingi tangu kuwekwa msingi wa ulimwengu. Lakini sasa ametokea mara moja tu katika utimilifu wa zama[a], ili kuondoa dhambi[b] kwa njia ya dhabihu yake[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mwishoni mwa zama.”
    reason: lexical_alternative
  - marker: b
    text: Au, “ili kuibatilisha dhambi” au “ili kuiweka dhambi kando.”
    reason: lexical_alternative
  - marker: c
    text: Au, “kwa kujitoa mwenyewe kuwa dhabihu.” Kigiriki kina maana ya karibu “kwa njia ya dhabihu yake”; muktadha unaonyesha kwamba dhabihu hiyo ilimhusu yeye mwenyewe.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ
  choice: La sivyo
  rationale: Katika hoja hii neno linaonyesha matokeo ambayo yangelazimika kufuata kama Kristo angejitoa mara kwa mara; “La sivyo” huwasilisha nguvu hiyo ya kimantiki kwa Kiswahili cha kawaida.
- source_word: ἔδει αὐτὸν ... παθεῖν
  choice: ingempasa kuteseka
  rationale: Hali ya kudhaniwa katika hoja inahitaji kauli ya masharti; “ingempasa” linaonyesha ulazima ambao ungekuwapo, si tukio lililotokea.
- source_word: πολλάκις
  choice: mara nyingi
  rationale: Hudumisha tofauti ya moja kwa moja na ἅπαξ, “mara moja tu.”
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: tangu kuwekwa msingi wa ulimwengu
  rationale: Hudumisha taswira ya “msingi” na maana ya muda unaoanzia mwanzo wa ulimwengu.
- source_word: νυνὶ δὲ
  choice: Lakini sasa
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida inayoonyesha tofauti kati ya hali iliyodhaniwa na jambo lililotokea kwa kweli.
- source_word: ἅπαξ
  choice: mara moja tu
  rationale: Huonyesha tukio moja lisilorudiwa katika tofauti yake na “mara nyingi,” bila kuongeza maneno ya kimafundisho yasiyokuwamo wazi katika neno lenyewe.
- source_word: ἐπὶ συντελείᾳ τῶν αἰώνων
  choice: wakati zama zilipofikia utimilifu
  rationale: Kauli hii ya asili kwa Kiswahili huhifadhi wazo la zama kufikia kilele au ukamilisho wake, badala ya kuonyesha mwisho wa kikronolojia pekee.
- source_word: εἰς ἀθέτησιν ἁμαρτίας
  choice: ili kuondoa dhambi
  rationale: “Kuondoa” ni wazi kwa wasomaji wa kawaida na hubeba wazo la kuiweka dhambi kando au kuibatilisha; umoja wa “dhambi” umehifadhiwa.
- source_word: διὰ τῆς θυσίας αὐτοῦ
  choice: kwa kujitoa mwenyewe kuwa dhabihu
  rationale: Katika muktadha wa kujitoa kwa Kristo, kauli hii inaeleza kwa kawaida kwamba yeye mwenyewe ndiye dhabihu, huku tanbihi ikihifadhi uwezekano wa muundo wa karibu zaidi, “kwa dhabihu yake.”
- source_word: πεφανέρωται
  choice: ametokea
  rationale: Huwasilisha tendo la kujidhihirisha au kuonekana katika historia kwa lugha ya kawaida, na wakati timilifu wa Kiswahili unaonyesha tukio lililotimia lenye umuhimu unaoendelea.
theological_decisions:
- issue: Nguvu ya ἅπαξ katika dhabihu ya Kristo
  choice: mara moja tu
  alternative: mara moja kabisa
  rationale: Tofauti na “mara nyingi” inaonyesha wazi kutorudiwa kwa tendo hilo. “Mara moja tu” ni ya kawaida na haiongezi ufafanuzi wa kimadhehebu.
- issue: Upeo wa ἁμαρτίας katika umoja
  choice: dhambi
  alternative: dhambi mbalimbali
  rationale: Umoja wa Kigiriki unaonyesha dhambi kama hali au uhalisi unaoshughulikiwa na dhabihu ya Kristo; kuuhifadhi huepuka kuifupisha maana kuwa matendo binafsi pekee.
- issue: Maana ya συντέλεια τῶν αἰώνων
  choice: zama zilipofikia utimilifu
  alternative: mwishoni mwa zama
  rationale: Chaguo kuu huhifadhi wazo la kilele au kukamilishwa kwa zama bila kulifanya liwe taarifa ya mwisho wa wakati pekee.
- issue: Uhusiano wa αὐτοῦ na θυσίας
  choice: kujitoa mwenyewe kuwa dhabihu
  alternative: kwa dhabihu yake
  rationale: Muktadha wa karibu wa Waebrania 9 unamhusu Kristo akijitoa mwenyewe, lakini muundo wa Kigiriki unaweza kutafsiriwa kwa ufupi kuwa “dhabihu yake”; uwezekano huo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye heshima lakini kinachoeleweka kwa urahisi. “Ingempasa” na “kuwekwa msingi wa ulimwengu” hudumisha uzito wa kifungu; sentensi nyingine zimetungwa kwa mtiririko wa kawaida. Alama zote za tanbihi zimewekwa mara moja katika matini kuu.
