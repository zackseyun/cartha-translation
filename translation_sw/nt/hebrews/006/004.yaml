  text: Ἀδύνατον γὰρ τοὺς ἅπαξ φωτισθέντας γευσαμένους τε τῆς δωρεᾶς τῆς ἐπουρανίου καὶ μετόχους γενηθέντας πνεύματος ἁγίου
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/004.yaml
  text: For it is impossible[a], in the case of those who were once enlightened, and who tasted the heavenly gift, and became partakers of the Holy Spirit[c][b],
translation:
  language: sw
  text: Kwa maana haiwezekani kwa wale ambao mara moja walitiwa nuru[a], wakaonja zawadi ya mbinguni[b], na wakawa washiriki wa Roho Mtakatifu[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Kutiwa nuru” kunaweza kumaanisha kwa upana kupokea nuru au mafundisho ya kiroho; wengine hulielewa hasa kuwa uongofu au nuru inayohusishwa na ubatizo.
    reason: alternative_reading
  - marker: b
    text: Au, “wakapata uzoefu wa zawadi ya mbinguni.” Kitenzi hicho kwa maana halisi ni “kuonja,” lakini kinaweza kumaanisha kupata uzoefu wa kweli, si kujaribu kidogo tu.
    reason: lexical_alternative
  - marker: c
    text: Au, “wakashiriki katika Roho Mtakatifu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδύνατον
  choice: haiwezekani
  rationale: Kivumishi hiki kimetumiwa kama kiarifu kwa msisitizo mwanzoni mwa sentensi; “haiwezekani” ni Kiswahili cha kawaida kinachohifadhi uzito wake.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Kiunganishi hiki kinaeleza na kuunganisha kauli na onyo lililotangulia bila kufafanua kupita kiasi aina ya hoja.
- source_word: ἅπαξ
  choice: waliwahi
  rationale: Katika muundo “waliwahi kuangaziwa,” neno hili linaonyesha jambo lililotokea wakati fulani uliopita. Haliongezi wazo la “mara moja tu na milele,” ambalo muktadha huu haulazimishi.
- source_word: φωτισθέντας
  choice: kuangaziwa
  rationale: Huhifadhi sitiari ya kupokea nuru ya kiroho au ufahamu bila kuitambulisha moja kwa moja kuwa ni uongofu au ubatizo.
- source_word: γευσαμένους
  choice: wakaonja
  rationale: Huhifadhi sitiari halisi ya Kigiriki. Kitenzi kinaweza pia kumaanisha kupata uzoefu wa kweli, lakini tafsiri kuu haibainishi kiwango cha uzoefu huo.
- source_word: δωρεᾶς τῆς ἐπουρανίου
  choice: zawadi ya mbinguni
  rationale: Ni usemi wa asili na ulio wazi unaohifadhi asili au sifa ya kimbingu bila kubainisha zawadi hiyo ni nini.
- source_word: τε ... καὶ
  choice: na
  rationale: Huunganisha maelezo yanayofuatana kwa njia ya kawaida ya Kiswahili huku ikihifadhi mkusanyiko wa vipengele.
- source_word: μετόχους
  choice: washiriki
  rationale: Neno hili linaonyesha kushiriki au kuwa na sehemu katika jambo; ni la sasa, lenye heshima, na halidhoofishi nguvu ya usemi.
- source_word: γενηθέντας
  choice: wakawa
  rationale: Huonyesha kuingia katika hali ya kuwa washiriki, sawasawa na maana ya kitenzi cha Kigiriki.
- source_word: πνεύματος ἁγίου
  choice: wa Roho Mtakatifu
  rationale: Hutegemea “washiriki” na humrejelea Roho Mtakatifu kama nafsi ya Mungu katika matumizi ya Agano Jipya.
theological_decisions:
- issue: Ikiwa φωτισθέντας inapaswa kutafsiriwa kuwa uongofu au nuru ya ubatizo hasa
  choice: kuangaziwa
  alternative: kuongolewa; kupewa nuru katika ubatizo
  rationale: Kigiriki kinatumia sitiari pana ya kuangaziwa na hakitaji uongofu wala ubatizo moja kwa moja; tafsiri inadumisha uwazi huo.
- issue: Ikiwa γευσαμένους inaonyesha kuonja kijuujuu tu au kupata uzoefu kamili
  choice: wakaonja
  alternative: wakapata uzoefu
  rationale: Kitenzi kinaweza kueleza uzoefu wa kweli, lakini kinaendelea kutumia sitiari ya kuonja. Tafsiri haisuluhishi kwa njia ya msamiati mjadala wa uasi na kudumu katika imani.
- issue: Ikiwa μετόχους γενηθέντας πνεύματος ἁγίου lazima kumaanishe kukaliwa kikamilifu na Roho kwa wokovu au ushiriki usio kamili
  choice: wakawa washiriki wa Roho Mtakatifu
  alternative: wakashiriki katika Roho Mtakatifu
  rationale: Usemi huu unahifadhi nguvu ya kushiriki bila kuingiza hitimisho maalumu la kimadhehebu kuhusu hali ya wokovu ya watu hao.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo unabaki sehemu ya sentensi inayoendelea katika mistari inayofuata, kama ilivyo katika chanzo. Alama za tanbihi zimepangwa karibu na maneno yanayohusika.
