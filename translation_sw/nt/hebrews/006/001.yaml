source:
  edition: SBLGNT
  text: Διὸ ἀφέντες τὸν τῆς ἀρχῆς τοῦ Χριστοῦ λόγον ἐπὶ τὴν τελειότητα φερώμεθα, μὴ πάλιν θεμέλιον καταβαλλόμενοι μετανοίας ἀπὸ νεκρῶν ἔργων, καὶ πίστεως ἐπὶ θεόν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/001.yaml
  text: Therefore[a], leaving the elementary message about the Messiah, let us be carried on to maturity, not laying again a foundation of repentance from dead works and of faith toward God[d][c][b],
translation:
  language: sw
  text: Kwa hiyo, tukiacha ujumbe wa msingi kuhusu Masihi[a], na tupelekwe mbele[c] kuelekea ukomavu[b], bila kuweka tena msingi wa toba kutokana na matendo mafu na wa imani kwa Mungu[d],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mafundisho ya mwanzo kuhusu Masihi” au “ujumbe wa mwanzo wa Masihi.”
    reason: lexical_alternative
  - marker: b
    text: Au, “utimilifu” au “ukamilifu.”
    reason: lexical_alternative
  - marker: c
    text: Au, “na tusonge mbele.” Kigiriki kina hali ya kutendwa, yaani, “na tupelekwe mbele” au “na tuchukuliwe mbele.”
    reason: lexical_alternative
  - marker: d
    text: Au, “imani katika Mungu” au “kumwamini Mungu.”
    reason: alternative_reading
lexical_decisions:
- source_word: Διὸ
  choice: Kwa hiyo
  rationale: Kiunganishi hiki kinaonyesha hitimisho la kimantiki linalotokana na maelezo yaliyotangulia.
- source_word: ἀφέντες
  choice: tukiacha
  rationale: Inahifadhi muundo wa kishiriki na wazo la kuondoka katika hatua ya mafundisho ya msingi ili kusonga mbele, bila kudokeza kuyakataa kabisa.
- source_word: τὸν τῆς ἀρχῆς τοῦ Χριστοῦ λόγον
  choice: ujumbe wa msingi kuhusu Masihi
  rationale: Neno λόγος hapa linaweza kuwa ujumbe au mafundisho; τῆς ἀρχῆς katika muktadha huu linaelekea kumaanisha yale ya mwanzo au ya msingi. Muundo huu ni wa kawaida katika Kiswahili na unaonyesha kuwa ujumbe huo unamhusu Masihi.
- source_word: Χριστοῦ
  choice: Masihi
  rationale: Χριστός imetumiwa hapa kwa maana ya cheo, hivyo 'Masihi' inafaa kuliko kuitumia kama jina tu.
- source_word: ἐπὶ τὴν τελειότητα
  choice: kufikia ukomavu
  rationale: Katika tofauti iliyopo kati ya msingi na hatua ya mbele zaidi, τελειότης inaeleweka kwa urahisi kama ukomavu au utimilifu, bila kulazimisha maana ya kutokuwa na dhambi kabisa.
- source_word: φερώμεθα
  choice: na tuchukuliwe mbele
  rationale: Inahifadhi hali ya kutendwa ya kitenzi cha Kigiriki badala ya kuibadili moja kwa moja kuwa juhudi ya mtendaji mwenyewe.
- source_word: θεμέλιον καταβαλλόμενοι
  choice: bila kuweka tena msingi
  rationale: Inadumisha sitiari ya ujenzi na inaeleweka kwa urahisi katika Kiswahili cha sasa.
- source_word: μετανοίας ἀπὸ νεκρῶν ἔργων
  choice: wa kutubu matendo mafu
  rationale: ‘Kutubu’ ni kitenzi cha kawaida na sahihi kwa μετάνοια katika muktadha huu; ‘matendo mafu’ inadumisha picha ya Kigiriki bila kuamua ikiwa ni matendo yasiyo na uhai au yanayoleta kifo.
- source_word: πίστεως ἐπὶ θεόν
  choice: wa kuwa na imani kwa Mungu
  rationale: ‘Imani’ inahifadhi nomino πίστις, na ‘kwa Mungu’ inabakiza kwa kiasi mwelekeo wa ἐπί huku ikiwa Kiswahili kinachoeleweka.
theological_decisions:
- issue: Je, kuacha ujumbe wa msingi kunamaanisha kuukataa au kusonga mbele kutoka hatua yake ya kwanza?
  choice: Kusonga mbele kutoka mafundisho ya msingi bila kuyakataa
  alternative: Kuacha kabisa ujumbe kuhusu Masihi
  rationale: Kauli inayofuata kuhusu kutoweka msingi tena inaonyesha maendeleo juu ya msingi uliokwisha kuwekwa, si kuukataa.
- issue: Je, τελειότης ni ukomavu, utimilifu, au ukamilifu?
  choice: ukomavu
  alternative: utimilifu au ukamilifu
  rationale: Muktadha unatofautisha mafundisho ya msingi na maendeleo ya kiroho; ‘ukomavu’ unaeleza hilo bila kufuta uwezekano wa maana ya utimilifu, ambao umetajwa katika tanbihi.
- issue: Je, hali ya kutendwa katika φερώμεθα ihifadhiwe?
  choice: na tuchukuliwe mbele
  alternative: na tusonge mbele
  rationale: Hali ya kutendwa imehifadhiwa ili kutobadili maendeleo hayo kuwa tendo la juhudi ya mwanadamu pekee, ingawa Kigiriki hakitaji wazi mtendaji anayewachukua mbele.
- issue: Maana ya ‘matendo mafu’
  choice: Kuacha usemi huo ukiwa na upana wake wa kisitiari
  alternative: matendo yasiyo na uhai au matendo yanayoleta kifo
  rationale: Kigiriki hakilazimishi mojawapo ya ufafanuzi huo, kwa hiyo tafsiri haipaswi kuamua kimya kimya.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inadumisha sitiari za msingi na matendo mafu, pamoja na hali ya kutendwa ya φερώμεθα. Alama za tanbihi zote zimewekwa mara moja katika sehemu husika ya matini.
