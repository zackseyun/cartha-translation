id: HEB.6.17
reference: Hebrews 6:17
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐν ᾧ περισσότερον βουλόμενος ὁ θεὸς ἐπιδεῖξαι τοῖς κληρονόμοις τῆς ἐπαγγελίας τὸ ἀμετάθετον τῆς βουλῆς αὐτοῦ ἐμεσίτευσεν ὅρκῳ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/017.yaml
  text: So when God desired to show more clearly to the heirs of the promise the unchangeable character of his purpose[a], he guaranteed it with an oath[b],
translation:
  language: sw
  text: Kwa hiyo, Mungu alipotaka kuwaonyesha kwa wazi zaidi warithi wa ahadi kwamba kusudi lake halibadiliki[a], alilithibitisha kwa kiapo[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hali ya kutobadilika ya shauri lake.”
    reason: lexical_alternative
  - marker: b
    text: Au, kwa maana halisi zaidi, “aliingilia kati kwa kiapo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: Kwa hiyo
  rationale: Kiunganishi hiki kinarejelea hoja iliyotangulia kuhusu kiapo na kinaonyesha uhusiano wa kimantiki; tafsiri ya neno kwa neno, ‘katika hilo,’ isingekuwa wazi kwa Kiswahili cha sasa.
- source_word: περισσότερον
  choice: kwa wazi zaidi
  rationale: Kielezi hiki kinatilia mkazo tendo la kuonyesha; ‘kwa wazi zaidi’ ni cha kawaida katika Kiswahili na kinaonyesha kwamba Mungu alitoa uthibitisho ulio dhahiri zaidi.
- source_word: βουλόμενος
  choice: alipotaka
  rationale: Kinawakilisha nia ya Mungu ya makusudi bila kudokeza tamaa dhaifu au isiyotimizwa.
- source_word: ἐπιδεῖξαι
  choice: kuwaonyesha
  rationale: Kitenzi hiki humaanisha kuonyesha au kudhihirisha; pamoja na ‘kwa wazi zaidi’ kinatoa maana ya usemi wa Kigiriki kwa lugha ya kawaida.
- source_word: τοῖς κληρονόμοις τῆς ἐπαγγελίας
  choice: warithi wa ahadi
  rationale: ‘Warithi’ huhifadhi taswira ya urithi na ‘wa ahadi’ hufuata uhusiano wa kisarufi wa Kigiriki bila kuongeza kimilikishi kisichotajwa.
- source_word: τὸ ἀμετάθετον τῆς βουλῆς αὐτοῦ
  choice: kwamba kusudi lake halibadiliki
  rationale: Muundo wa sentensi hii ni wa asili katika Kiswahili na unaeleza wazi sifa ya kusudi la Mungu kutoweza kubadilishwa, bila kutumia istilahi nzito isiyohitajika.
- source_word: ἐμεσίτευσεν
  choice: alilithibitisha
  rationale: Katika muktadha huu kitenzi kinaonyesha kwamba Mungu alitoa uhakikisho wenye nguvu kwa kiapo. ‘Alilithibitisha’ ni wazi na hakilazimishi maana finyu ya upatanishi.
- source_word: ὅρκῳ
  choice: kwa kiapo
  rationale: Hali ya dative inaonyesha njia au chombo; ‘kwa kiapo’ ni usemi wa kawaida unaohifadhi kazi hiyo.
theological_decisions:
- issue: Kutobadilika kwa kusudi la Mungu bila kuingiza mfumo wa baadaye wa kimetafizikia
  choice: kwamba kusudi lake halibadiliki
  alternative: hali ya kutobadilika ya shauri lake
  rationale: Kigiriki kinasisitiza moja kwa moja uthabiti usiobadilika wa kusudi la Mungu. Tafsiri iliyochaguliwa huhifadhi nguvu hiyo kwa lugha inayoeleweka bila kuongeza istilahi za kiteolojia zisizodaiwa na mstari.
- issue: Maana ya ἐμεσίτευσεν kuhusiana na kiapo cha Mungu
  choice: alilithibitisha kwa kiapo
  alternative: aliingilia kati kwa kiapo
  rationale: Muktadha unaonyesha kwamba kiapo kilitoa uhakikisho wa ziada kwa warithi wa ahadi. ‘Alilithibitisha’ huwasilisha kazi ya kitenzi, huku tanbihi ikihifadhi uwezekano wa tafsiri iliyo karibu zaidi na taswira ya kuingilia kati.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Sentensi imetumia muundo wa kawaida ‘kwamba ... halibadiliki’ ili kueleza nomino dhahania ya Kigiriki kwa uwazi. Alama za tanbihi zimewekwa kwenye vipashio vinavyohusika; mpangilio wao umesahihishwa kulingana na maudhui ya tanbihi.
