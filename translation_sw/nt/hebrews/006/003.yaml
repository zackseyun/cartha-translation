  text: And this we will do[a], if indeed God permits.
translation:
  language: sw
  text: Na hili tutafanya, ikiwa Mungu ataruhusu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mungu akiruhusu.” Chembe ya Kigiriki inayosisitiza sharti hilo huongeza mkazo zaidi ya sharti la kawaida.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Nasi
  rationale: Kiunganishi kinaendeleza wazo la mstari uliotangulia; “Nasi” ni mtiririko wa kawaida wa Kiswahili na kinahifadhi mhusika wa wingi aliyedokezwa katika kitenzi.
- source_word: τοῦτο
  choice: hivyo
  rationale: Kiwakilishi hiki cha umoja kinarejelea hatua au jambo lililotajwa kabla; “hivyo” ni la asili zaidi hapa kuliko tafsiri nzito ya neno kwa neno.
- source_word: ποιήσομεν
  choice: tutafanya
  rationale: Ni kitenzi cha wakati ujao, nafsi ya kwanza wingi. “Tutafanya” kinahifadhi maana ya msingi ya ποιέω bila kufafanua kupita kiasi kuwa ‘tutaendelea.’
- source_word: ἐάνπερ
  choice: ikiwa kweli
  rationale: “Ikiwa” kinahifadhi sharti, na “kweli” kinawakilisha msisitizo unaoongezwa na περ bila kuugeuza kuwa uhakika au shaka kali.
- source_word: ἐπιτρέπῃ
  choice: ataruhusu
  rationale: Kitenzi hiki katika kishazi cha sharti humaanisha kuruhusu. Wakati ujao wa Kiswahili unasikika kwa kawaida pamoja na nia ya ‘tutafanya,’ ingawa Kigiriki kina subjunktivu ya sasa.
- source_word: ὁ θεός
  choice: Mungu
  rationale: Ni mtendaji wa kitenzi; kwa Kiswahili jina hili linatolewa kwa kawaida bila kuwakilisha kibainishi cha Kigiriki kwa neno tofauti.
theological_decisions:
- issue: Sharti linalohusu ruhusa ya Mungu
  choice: Kusudi la mwandishi la kufanya jambo hilo linawekwa wazi chini ya sharti la ruhusa ya Mungu.
  alternative: ‘Mungu akipenda,’ au ufafanuzi unaodai uamuzi wa Mungu kwa namna pana kuliko maneno ya aya.
  rationale: “Ikiwa kweli Mungu ataruhusu” huhifadhi sharti halisi na msisitizo wa Kigiriki, bila kulifanya kuwa nahau dhaifu wala kulipanua kuwa tamko la kimadhehebu kuhusu uhusiano wa nia ya binadamu na enzi ya Mungu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni mfupi kama Kigiriki; ‘Nasi’ huunganisha aya na wazo lililotangulia, na tanbihi huhifadhi tafsiri mbadala ya kawaida pamoja na msisitizo wa ἐάνπερ.
