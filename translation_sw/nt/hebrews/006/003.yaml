revisions:
- from: Nasi tutafanya hivyo, ikiwa kweli Mungu ataruhusu.[a]
  to: Na hili tutafanya, ikiwa Mungu ataruhusu.[a]
  rationale: The revision renders τοῦτο with the singular “hili,” retains the future resolve of ποιήσομεν, and expresses the real condition of ἐάνπερ ἐπιτρέπῃ ὁ θεός in natural Swahili without importing doctrinal implications. The note preserves both the idiomatic alternative and the particle's emphatic conditional nuance.
