  text: For people swear by one greater than themselves[b][a], and for them an oath is the end of every dispute for confirmation.
translation:
  language: sw
  text: Kwa maana watu huapa kwa aliye mkuu kuliko wao, na kiapo kwao ni mwisho wa kila ubishi kwa ajili ya uthibitisho.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄνθρωποι
  choice: watu
  rationale: Ni neno la kijumla linalowarejelea wanadamu, si wanaume pekee; “watu” ni Kiswahili cha kawaida na sahihi katika kauli hii ya jumla.
- source_word: κατὰ τοῦ μείζονος
  choice: kwa aliye mkuu kuliko wao
  rationale: Katika muktadha wa kiapo, κατά pamoja na jenitivi humaanisha kumwita mwenye mamlaka ya juu kuwa shahidi; tafsiri hii inadumisha nguvu ya ulinganisho ya μείζονος bila kumtaja mtu mahususi.
- source_word: ὀμνύουσιν
  choice: huapa
  rationale: Wakati wa mazoea katika Kiswahili unaonyesha desturi ya jumla inayosemwa na sentensi hii.
- source_word: πάσης ... ἀντιλογίας
  choice: kila ubishi
  rationale: ἀντιλογία hapa ni pingamizi au mgogoro unaohitaji kusuluhishwa, si tu ukinzani wa kimantiki; “ubishi” ni neno la kawaida linalofaa muktadha.
- source_word: πέρας
  choice: mwisho
  rationale: Hudumisha taswira ya jambo kufikia kikomo au hitimisho lake.
- source_word: εἰς βεβαίωσιν
  choice: ili kuthibitisha jambo
  rationale: εἰς pamoja na akusativi huonyesha kusudi au matokeo, na βεβαίωσις ni uthibitisho au uhalalishaji. Kuongeza “jambo” kunafanya Kiswahili kiwe kamili bila kuweka rejeleo maalumu lisilokuwapo katika Kigiriki.
- source_word: ὁ ὅρκος
  choice: kiapo
  rationale: Ingawa Kigiriki kina kibainishi, kauli ni ya kijumla; Kiswahili hutumia “kiapo” kwa kawaida hapa bila kulazimisha “kile kiapo” au “kiapo fulani.”
theological_decisions:
- issue: Rejeleo la kijumla kwa wanadamu katika kauli ya kawaida
  choice: watu
  alternative: wanaume
  rationale: Muktadha unaeleza desturi ya wanadamu kwa ujumla, si ya wanaume pekee; “watu” huhifadhi maana ya kijumla ya ἄνθρωποι.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “huapa” unaonyesha tendo la kawaida, huku sentensi ikidumisha mantiki ya Kigiriki na kusomeka kwa urahisi.
