base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/008.yaml
  text: But if it bears thorns and thistles[a], it is worthless and near to being cursed, and its end is for burning.
translation:
  language: sw
  text: Lakini ikiwa inazaa miiba na michongoma, haifai[a] na iko karibu kulaaniwa; mwisho wake ni kuchomwa moto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “imekataliwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκφέρουσα
  choice: inazaa
  rationale: Kitenzi hiki kinaendeleza mfano wa ardhi katika mstari uliotangulia; “inazaa” ni Kiswahili cha kawaida kwa ardhi inayotoa mazao na kinahifadhi hali inayoendelea.
- source_word: δὲ
  choice: Lakini
  rationale: Kiunganishi hiki kinaonyesha tofauti na ardhi yenye kuzaa mazao mema katika mstari wa 7.
- source_word: ἀκάνθας καὶ τριβόλους
  choice: miiba na magugu yenye miiba
  rationale: Maneno hayo mawili yanataja mimea isiyofaa na yenye kuchoma. Utoaji huu unatofautisha istilahi hizo bila kutumia jina la mmea lisiloeleweka kwa urahisi.
- source_word: ἀδόκιμος
  choice: haifai
  rationale: Katika mfano wa kilimo, neno hili linaonyesha ardhi iliyoshindwa kuthibitisha manufaa yake. “Haifai” ni ya kawaida na haiongezi maana nzito kuliko iliyo katika muktadha.
- source_word: κατάρας ἐγγύς
  choice: iko karibu kulaaniwa
  rationale: Hii ni Kiswahili cha asili kinachoeleza ukaribu wa laana huku kikihifadhi onyo kwamba hukumu hiyo iko karibu, si kwamba tayari imetekelezwa.
- source_word: ἧς τὸ τέλος
  choice: mwisho wake
  rationale: Kiwakilishi kinarejelea ardhi inayodokezwa kutoka mstari uliotangulia; “mwisho wake” huhifadhi kwa ufupi maana ya mwisho au matokeo.
- source_word: εἰς καῦσιν
  choice: ni kuchomwa moto
  rationale: Huhifadhi taswira ya kuchoma bila kuifafanua moja kwa moja kuwa hukumu fulani ya kiteolojia ambayo mstari wenyewe hauitaji.
theological_decisions:
- issue: Iwapo kutaja wazi “ardhi” katika mstari huu
  choice: Kutumia “inazaa” bila kurudia nomino “ardhi”
  alternative: Lakini ardhi ikizaa miiba na magugu yenye miiba...
  rationale: Ugiriki unaendeleza kisarufi ardhi ya mstari wa 7 bila kuirudia. Kiswahili kinaweza kuendeleza mhusika huyo kwa upatanisho wa ngeli, hivyo hakuna haja ya kuongeza nomino.
- issue: Uzito wa maana ya ἀδόκιμος
  choice: haifai katika matini kuu, na “imekataliwa” katika tanbihi
  alternative: imekataliwa
  rationale: “Haifai” inalingana vizuri na tathmini ya manufaa ya ardhi katika mfano wa kilimo; tanbihi huhifadhi maana mbadala yenye uzito zaidi wa kukataliwa.
- issue: Iwapo εἰς καῦσιν ifafanuliwe kama hukumu ya mwisho
  choice: Kuhifadhi taswira ya “kuchomwa moto”
  alternative: mwisho wake ni hukumu ya moto
  rationale: Matini inatoa taswira ya kilimo lakini haibainishi hapa upeo kamili wa marejeo yake ya kiteolojia; hivyo tafsiri haipaswi kuyafafanua kupita kiasi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inaendeleza mfano wa ardhi kutoka mstari uliotangulia; “magugu yenye miiba” ni wazi zaidi kwa wasomaji wengi kuliko istilahi adimu za mimea.
