lexical_decisions:
- source_word: καὶ
  choice: Na
  rationale: Kiunganishi hiki kinaunganisha kauli na maelezo yaliyotangulia kuhusu Abrahamu.
- source_word: οὕτως
  choice: hivyo
  rationale: Huonyesha namna au matokeo yanayohusiana na simulizi lililotangulia; “hivyo” ni ya kawaida na huhifadhi uhusiano huo.
- source_word: μακροθυμήσας
  choice: baada ya kungoja kwa uvumilivu
  rationale: Kirai hiki cha wakati kinaonyesha subira ya muda mrefu katika kungojea kutimizwa kwa neno la Mungu.
- source_word: ἐπέτυχεν
  choice: aliipata
  rationale: Kitenzi kina maana ya kufanikiwa kupata au kufikia; “aliipata” ni Kiswahili cha kawaida bila kudai wazi kwamba utimilifu wote ulikuwa umepokelewa.
- source_word: τῆς ἐπαγγελίας
  choice: ahadi
  rationale: Huhifadhi nomino ya Kigiriki na uhusiano wake wa kileksia na muktadha, badala ya kuibadili moja kwa moja kuwa kitu kilichoahidiwa.
theological_decisions:
- issue: Ikiwa Abrahamu alipokea utimilifu kamili wa ahadi au aliipata ahadi kwa maana ya kuipokea au kuifikia.
  choice: aliipata ahadi
  alternative: alipokea kile kilichoahidiwa
  rationale: Kigiriki kinasema kihalisi kwamba aliipata “ahadi,” bila kutaja wazi utimilifu wake kamili. Tafsiri hii inadumisha mvutano huo wa kitheolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa kawaida kwa wasomaji wengi huku ukihifadhi maana na utata wa maandishi ya Kigiriki.
