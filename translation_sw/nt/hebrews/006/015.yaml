  yaml_path: translation/nt/hebrews/006/015.yaml
  text: And so[a], after waiting patiently, he obtained the promise.
translation:
  language: sw
  text: Na hivyo[a], baada ya kungoja kwa uvumilivu, aliipata ahadi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alipokea kile kilichoahidiwa.” Kigiriki kinasema kihalisi, “aliipata ahadi.”
