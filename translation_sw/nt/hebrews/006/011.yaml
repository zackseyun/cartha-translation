  text: And we desire each one of you to show the same diligence for the full assurance of hope until the end[b][a],
translation:
  language: sw
  text: Nasi tunatamani kila mmoja wenu aonyeshe bidii hiyo hiyo kwa ajili ya uhakika kamili wa tumaini[a] mpaka mwisho.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uhakikisho kamili wa tumaini” au “imani thabiti kabisa katika tumaini.” Neno la Kigiriki linaweza kumaanisha utimilifu wa uhakika au wa imani thabiti.
    reason: lexical_alternative
  - marker: b
    text: Au, “hadi mwisho.” Kauli hii inasisitiza kudumu mpaka kufikia ukamilisho.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιθυμοῦμεν
  choice: tunatamani
  rationale: Kitenzi hiki huonyesha hamu ya dhati. “Tunatamani” ni lugha ya kawaida yenye uzito wa kichungaji bila kudokeza tamaa mbaya.
- source_word: δὲ
  choice: Nasi
  rationale: Kiunganishi hiki ni mpito mpole unaoendeleza hoja iliyotangulia; “Nasi” kinaunganisha sentensi kwa kawaida katika Kiswahili.
- source_word: ἕκαστον ὑμῶν
  choice: kila mmoja wenu
  rationale: Huhifadhi msisitizo kwamba himizo linamhusu kila mtu binafsi katika kundi.
- source_word: τὴν αὐτὴν
  choice: iyo hiyo
  rationale: Hurejelea bidii iliyodhihirishwa tayari katika upendo na huduma; muundo huu ni wa kawaida na wenye msisitizo katika Kiswahili.
- source_word: ἐνδείκνυσθαι
  choice: aonyeshe
  rationale: Hutoa maana ya kudhihirisha au kuonyesha sifa kwa vitendo, kwa lugha nyepesi na ya kawaida.
- source_word: σπουδὴν
  choice: bidii
  rationale: “Bidii” huwasilisha juhudi ya dhati, makini na endelevu inayokusudiwa katika himizo hili.
- source_word: πρὸς
  choice: ili awe na
  rationale: Hapa πρός huonyesha lengo au matokeo yanayokusudiwa. Muundo huu ni wa asili katika Kiswahili na unaunganisha bidii na uhakika wa tumaini.
- source_word: πληροφορίαν
  choice: uhakika kamili
  rationale: Huhifadhi wazo la utimilifu wa uhakika bila kulifunga kwa maana ya kihisia pekee.
- source_word: ἐλπίδος
  choice: wa tumaini
  rationale: “Tumaini” ni kisawe cha moja kwa moja na hapa huonyesha matarajio yenye msingi katika ahadi ya Mungu, si matakwa yasiyo na msingi.
- source_word: ἄχρι τέλους
  choice: mpaka mwisho
  rationale: Huhifadhi nguvu ya wakati na wazo la kudumu hadi kufikia ukamilisho.
theological_decisions:
- issue: Maana ya “uhakika kamili wa tumaini” kuhusiana na kudumu
  choice: Kauli imeachwa ikijumuisha uhakika wa ndani wa waamini na uthabiti unaohusishwa na tumaini lenyewe, huku bidii ikiendelea mpaka mwisho.
  alternative: Kuifasiri ama kama hisia kamili ya ndani kuhusu wokovu pekee, ama kama kutimizwa kwa ahadi inayotumainiwa pekee.
  rationale: Kigiriki kinaweza kubeba mwingiliano wa maana hizo. Tafsiri haipaswi kuamua kwa siri mjadala wa kiteolojia ambao matini yenyewe hauumalizi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Sentensi imeundwa kwa mtiririko wa kawaida huku ikihifadhi msisitizo kwa kila msomaji, bidii endelevu, na utata halisi wa πληροφορία τῆς ἐλπίδος.
