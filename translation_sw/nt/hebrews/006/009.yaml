  text: Πεπείσμεθα δὲ περὶ ὑμῶν, ἀγαπητοί, τὰ κρείσσονα καὶ ἐχόμενα σωτηρίας, εἰ καὶ οὕτως λαλοῦμεν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/009.yaml
  text: But we are convinced of better things concerning you[a], beloved—things that belong to salvation—even though we speak in this way.
translation:
  language: sw
  text: Lakini, wapendwa, tuna hakika kwamba mambo yaliyo bora zaidi yanawahusu ninyi—mambo yanayohusiana na wokovu[a]—ijapokuwa tunasema kwa namna hii.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mambo yanayoandamana na wokovu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πεπείσμεθα
  choice: tuna hakika
  rationale: Kauli timilifu inaonyesha hali thabiti ya kusadikishwa; “tuna hakika” ni Kiswahili cha kawaida na huhifadhi uhakika wa mwandishi.
- source_word: δὲ
  choice: Lakini
  rationale: Inaonyesha tofauti kati ya onyo kali lililotangulia na uhakikisho unaofuata.
- source_word: περὶ ὑμῶν
  choice: yanawahusu ninyi
  rationale: Huwasilisha maana ya “kuwahusu” kwa mtiririko wa asili wa Kiswahili huku ikisisitiza walengwa.
- source_word: ἀγαπητοί
  choice: wapendwa
  rationale: Ni mwito wa upendo wenye heshima, unaofaa katika lugha ya jumuiya ya waamini.
- source_word: τὰ κρείσσονα
  choice: mambo yaliyo bora zaidi
  rationale: Huhifadhi nguvu ya ulinganisho ya kivumishi cha wingi kilichotumika kama nomino.
- source_word: ἐχόμενα σωτηρίας
  choice: mambo yanayohusiana na wokovu
  rationale: Huhifadhi uhusiano mpana na wokovu bila kuamua ikiwa mambo hayo ni dalili, matokeo, au viambata vyake.
- source_word: εἰ καὶ
  choice: ijapokuwa
  rationale: Huonyesha wazi maana ya kukubali jambo linalotofautiana na dai kuu.
- source_word: οὕτως
  choice: kwa namna hii
  rationale: Hurejelea namna na yaliyomo katika onyo kali lililotangulia.
- source_word: λαλοῦμεν
  choice: tunasema
  rationale: Ni usemi wa sasa ulio wazi na wa asili katika Kiswahili; hapa kitenzi kinahusu yaliyosemwa katika onyo.
theological_decisions:
- issue: Uhusiano wa ἐχόμενα na σωτηρίας katika muktadha wa onyo
  choice: mambo yanayohusiana na wokovu
  alternative: mambo yanayoandamana na wokovu
  rationale: Kigiriki kinathibitisha kwamba mambo hayo yana uhusiano wa karibu na wokovu, lakini hakibainishi kwa lazima kama ni ushahidi, viambata, au matokeo yake. Tafsiri hii haimalizi mvutano wa kiteolojia kwa kuingiza dai finyu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. “Wapendwa” hudumisha joto la mwito; “ijapokuwa” hufaa rejesta ya maandiko bila kuwa ya kizamani kupita kiasi.
