  yaml_path: translation/nt/hebrews/006/013.yaml
  text: For when God made the promise to Abraham[a], since he could swear by no one greater, he swore by himself[b],
translation:
  language: sw
  text: Kwa maana Mungu alipomwahidi Abrahamu, kwa kuwa hakuwa na yeyote mkuu kuliko yeye wa kuapia, aliapa kwa yeye mwenyewe,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τῷ ... Ἀβραὰμ ἐπαγγειλάμενος
  choice: alipompa Abrahamu ahadi
  rationale: Muundo huu unaonyesha kwamba Abrahamu ndiye mpokeaji wa ahadi. Kiswahili hiki ni cha asili na kinaweka wazi ahadi inayodokezwa na muktadha.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Kiunganishi hiki kinaonyesha kuwa mstari unaeleza au kuthibitisha hoja iliyotangulia.
- source_word: ἐπεὶ
  choice: kwa kuwa
  rationale: Hapa neno hili linatoa sababu ya Mungu kuapa kwa nafsi yake mwenyewe.
- source_word: κατ’ οὐδενὸς ... μείζονος ὀμόσαι
  choice: hakuwa na yeyote aliye mkuu kuliko yeye ambaye angeweza kuapa kwa jina lake
  rationale: Tafsiri hii huhifadhi wazo la kutokuwapo kwa mwingine mkuu zaidi ambaye angeweza kutajwa kama mwenye kuthibitisha kiapo, huku ikisomeka kwa kawaida katika Kiswahili.
- source_word: ὤμοσεν
  choice: aliapa
  rationale: Kitenzi hiki kinatafsiri moja kwa moja tendo la kuapa na kuhifadhi urudiaji wa mzizi unaopatikana pia katika ὀμόσαι.
- source_word: καθ’ ἑαυτοῦ
  choice: kwa nafsi yake mwenyewe
  rationale: Katika lugha ya kiapo, kirai hiki humaanisha kwamba Mungu alijiweka mwenyewe kuwa uthibitisho wa kiapo, bila mamlaka iliyo juu yake.
theological_decisions:
- issue: Asili ya kiapo cha Mungu
  choice: Mungu aliapa kwa nafsi yake mwenyewe kwa sababu hakuwapo yeyote mkuu kuliko yeye ambaye angeweza kuapa kwa jina lake.
  alternative: Mungu aliapa kwa nafsi yake kwa kuwa hakuwa na yeyote mkuu zaidi wa kuapia.
  rationale: Uamuzi huu huhifadhi dai la mstari kuhusu ukuu usio na kifani wa Mungu bila kulipanua kuwa mfumo wa mafundisho usiotajwa moja kwa moja hapa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Kwa nafsi yake mwenyewe’ limetumiwa kwa mkazo wa kiapo; ‘kwa jina lake’ linaeleza kwa kawaida maana ya kuapa kwa mamlaka ya aliye mkuu zaidi.
