  text: akisema[a], “Hakika nitakubariki, na hakika nitakuzidisha.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kigiriki hurudia kitenzi katika kila sehemu kwa msisitizo: kwa karibu, “kubariki nitakubariki, na kuzidisha nitakuzidisha.” Muundo huu unatoa mwangwi wa Mwanzo 22:17.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: akisema
  rationale: Kitenzi-shirikishi cha wakati uliopo kinatanguliza maneno ya kiapo cha Mungu; “akisema” ni tafsiri ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: Εἰ μὴν
  choice: Hakika
  rationale: Huu ni usemi wa kusisitiza katika kiapo, si sharti halisi. “Hakika” huwasilisha uthabiti wa ahadi kwa Kiswahili cha kawaida.
- source_word: εὐλογῶν εὐλογήσω
  choice: nitakubariki
  rationale: Urudiaji wa umbo la kitenzi una nguvu ya kusisitiza. Kiswahili cha kawaida hutumia wakati ujao, huku “Hakika” ikibeba msisitizo na tanbihi ikihifadhi muundo wa asili.
- source_word: σε
  choice: -ku-
  rationale: Kiambishi cha yambwa cha nafsi ya pili umoja kinamrejelea Abrahamu.
- source_word: καὶ
  choice: na
  rationale: Kiunganishi cha kawaida kinachounganisha ahadi hizo mbili.
- source_word: πληθύνων πληθυνῶ
  choice: nitakuzidisha
  rationale: “Nitakuzidisha” inadumisha kitenzi cha moja kwa moja cha Kigiriki na mwangwi wa ahadi kwa Abrahamu; “Hakika” ya pili inaonyesha msisitizo sambamba wa muundo wa asili.
theological_decisions:
- issue: Namna ya kutafsiri usemi wa kiapo wenye urudiaji wa kusisitiza katika ahadi kwa Abrahamu
  choice: Kutumia Kiswahili cha kawaida, “Hakika nitakubariki, na hakika nitakuzidisha,” huku muundo wa Kigiriki ukielezwa katika tanbihi.
  alternative: “Hakika, nikibariki nitakubariki, na nikizidisha nitakuzidisha.”
  rationale: Tafsiri hii inahifadhi msisitizo katika vitenzi vyote viwili na usambamba wa ahadi bila kuleta Kiswahili kisicho cha kawaida. Tanbihi inadumisha uwazi kuhusu muundo unaotoa mwangwi wa Mwanzo 22:17.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Hakika” limerudiwa ili kuonyesha msisitizo sambamba wa vitenzi vyote viwili; “nitakuzidisha” imehifadhi lugha ya moja kwa moja ya ahadi kwa Abrahamu.
