base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/002.yaml
  text: instruction about washings[a], the laying on of hands, the resurrection of the dead, and eternal judgment.
translation:
  language: sw
  text: mafundisho kuhusu maosho ya kiibada[a], kuwekewa mikono, ufufuo wa wafu, na hukumu ya milele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mafundisho kuhusu mabatizo.” Neno la Kigiriki liko katika wingi na linaweza kumaanisha maosho ya kiibada kwa maana pana, si lazima ubatizo wa Kikristo pekee.
    reason: lexical_alternative
lexical_decisions:
- source_word: βαπτισμῶν
  choice: maosho ya kiibada
  rationale: Nomino hii ya wingi inaweza kumaanisha maosho ya kidini au ya kimila kwa maana pana. Tafsiri hii inadumisha wingi na haifanyi neno hili lihusu ubatizo wa Kikristo pekee.
- source_word: διδαχὴν
  choice: mafundisho
  rationale: Neno hili linataja mafundisho yanayohusu mambo yaliyomo katika orodha; “mafundisho” ni Kiswahili cha kawaida, cha sasa, na kinachofaa katika muktadha huu.
- source_word: ἐπιθέσεώς τε χειρῶν
  choice: kuwekewa mikono
  rationale: Hii ni njia ya kawaida na ya asili ya Kiswahili ya kutaja tendo la kuweka mikono juu ya mtu, bila kubainisha kusudi lake kuliko maandishi yanavyofanya.
- source_word: ἀναστάσεώς τε νεκρῶν
  choice: ufufuo wa wafu
  rationale: Tafsiri hii ya kawaida inadumisha maana ya pamoja ya νεκρῶν na muundo wa kirai cha Kigiriki.
- source_word: κρίματος αἰωνίου
  choice: hukumu ya milele
  rationale: Tafsiri hii inahifadhi “hukumu” bila kuibana iwe hukumu ya adhabu pekee, na “ya milele” huwasilisha αἰωνίου kwa Kiswahili cha kawaida.
- source_word: τε ... τε καὶ
  choice: '..., ..., na ...'
  rationale: Viunganishi hivi vinapanga vipengele vya orodha. Orodha yenye koma na “na” ni ya asili katika Kiswahili na inadumisha uhusiano huo.
theological_decisions:
- issue: Maana ya βαπτισμῶν katika orodha ya mafundisho ya msingi
  choice: maosho ya kiibada
  alternative: mabatizo
  rationale: Wingi wa neno na matumizi yake yanaweza kuelekeza kwenye maosho ya kidini kwa maana pana, si lazima ubatizo wa Kikristo pekee. Tanbihi inadumisha uwezekano mwingine bila kuingiza msimamo maalumu wa kimadhehebu.
- issue: Upeo wa κρίματος αἰωνίου
  choice: hukumu ya milele
  alternative: adhabu ya milele
  rationale: Maandishi yanasema “hukumu,” si “adhabu” au “hukumu ya hatia” pekee. Tafsiri haibainishi matokeo ya hukumu zaidi ya yale yaliyosemwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa na yenye heshima. “Maosho ya kiibada” linaeleweka kwa urahisi kuliko “maosho” peke yake na linaepuka kulifanya neno la Kigiriki lihusu ubatizo pekee. Alama ya tanbihi [a] imewekwa moja kwa moja baada ya kirai husika.
