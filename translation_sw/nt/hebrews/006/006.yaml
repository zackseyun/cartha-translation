  text: καὶ παραπεσόντας, πάλιν ἀνακαινίζειν εἰς μετάνοιαν, ἀνασταυροῦντας ἑαυτοῖς τὸν υἱὸν τοῦ θεοῦ καὶ παραδειγματίζοντας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/006.yaml
  text: and having fallen away[a], to renew them again to repentance[b], since they are crucifying again for themselves the Son of God and exposing him to public shame.
translation:
  language: sw
  text: na wamekengeuka[a], kuwafanya upya tena wapate kutubu, kwa kuwa wanamsulubisha tena Mwana wa Mungu kwa ajili yao wenyewe na kumwaibisha hadharani[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wameasi imani.” Kitenzi cha Kigiriki kinaweza kumaanisha kukengeuka kwa uzito mkubwa.
    reason: lexical_alternative
  - marker: b
    text: Au “wakati wanamsulubisha tena Mwana wa Mungu kwa ajili yao wenyewe na kumwaibisha hadharani.” Virai vya Kigiriki vinaweza kueleweka kuwa vinaonyesha matendo yanayoendelea wakati huo, na si sababu tu.
    reason: alternative_reading
lexical_decisions:
- source_word: παραπεσόντας
  choice: wamekengeuka
  rationale: Kitenzi hiki katika muktadha kinaonyesha kuanguka au kuiacha imani kwa uzito. “Wamekengeuka” ni Kiswahili cha kawaida chenye uzito unaofaa, bila kuingiza moja kwa moja istilahi ya kiufundi ya baadaye kuhusu uasi-imani.
- source_word: πάλιν
  choice: tena
  rationale: Kielezi hiki kinahusishwa kwa kawaida na ἀνακαινίζειν na kinaonyesha kurudiwa kwa tendo la kuwafanya upya.
- source_word: ἀνακαινίζειν
  choice: kuwafanya upya
  rationale: Huhifadhi wazo la kufanya upya au kurudisha katika hali ya awali, huku likiwa wazi kwa msomaji wa kawaida.
- source_word: εἰς μετάνοιαν
  choice: wafikie toba
  rationale: Muundo huu unaonyesha lengo au matokeo. “Wafikie toba” huhifadhi mwelekeo wa εἰς na kutumia neno la kawaida la kibiblia “toba” bila kulifanya kuwa badiliko la akili tu.
- source_word: ἀνασταυροῦντας
  choice: wanajisulubishia tena
  rationale: Kitenzi cha sasa kinaonyesha tendo linaloendelea, na “tena” huhifadhi maana ya kurudia. Muundo wa kujirejelea unaunganisha ἑαυτοῖς kwa Kiswahili cha asili.
- source_word: ἑαυτοῖς
  choice: wanajisulubishia
  rationale: Kiambishi cha kujirejelea pamoja na kiambishi-tendea huwasilisha maana ya “kwa ajili yao wenyewe” au “kwa upande wao” bila maneno mazito yasiyo ya kawaida.
- source_word: τὸν υἱὸν τοῦ θεοῦ
  choice: Mwana wa Mungu
  rationale: Hii ndiyo tafsiri ya moja kwa moja, ya kawaida, na yenye uzito unaofaa wa cheo hiki cha Kikristo.
- source_word: παραδειγματίζοντας
  choice: kumwaibisha hadharani
  rationale: Huwasilisha wazi kumweka mtu mbele ya watu ili apatwe na aibu na fedheha.
- source_word: καὶ ... καὶ
  choice: na ... na
  rationale: Viunganishi vinaendeleza orodha na kuratibu matendo mawili yanayoeleza hali hiyo kwa njia ya kawaida katika Kiswahili.
theological_decisions:
- issue: Ikiwa mstari huu urudie wazi tamko la kutowezekana lililo katika mstari uliotangulia
  choice: Mstari unaanza na “na” na unabaki tegemezi kisarufi kwa Waebrania 6:4–6, bila kuongeza tena “haiwezekani.”
  alternative: Haiwezekani ... kuwafanya upya tena wale waliokengeuka
  rationale: Kigiriki cha mstari huu kinaendeleza sentensi iliyoanza awali. Kuhifadhi utegemezi huo huepuka kuongeza kitenzi kikuu ambacho hakipo katika mstari wenyewe.
- issue: Asili ya kukengeuka kunakotajwa
  choice: wamekengeuka
  alternative: wameasi imani
  rationale: Tafsiri inahifadhi uzito wa onyo lakini haiamui iwapo kifungu kinafundisha kupotea kwa wokovu, imani ya nje tu, au aina nyingine ya uasi wa agano.
- issue: Nguvu ya ἀνασταυροῦντας na παραδειγματίζοντας
  choice: kwa kuwa wanajisulubishia tena ... na kumwaibisha hadharani
  alternative: wakati wanajisulubishia tena ... na kumwaibisha hadharani
  rationale: Virai hivi vinaweza kueleza sababu au hali inayoendelea wakati huo. Maandishi makuu yanaonyesha maana ya sababu; tanbihi huhifadhi uwezekano wa maana ya wakati mmoja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa mstari umeachwa ukitegemea muktadha wa Waebrania 6:4–6 kama ulivyo katika Kigiriki. Maneno yanaepuka kuamua mabishano ya kimadhehebu kuhusu uasi na kudumu katika wokovu.
