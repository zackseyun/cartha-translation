lexical_decisions:
- source_word: καλὸν
  choice: jema
  rationale: Katika muktadha huu καλός inalielezea ῥῆμα na kwa kawaida humaanisha lenye ubora au manufaa. “Jema” ni la asili pamoja na “neno” na linahifadhi tathmini hiyo bila kuongeza maana.
- source_word: γευσαμένους
  choice: wameonja
  rationale: Kitenzi hiki kinaendeleza mfululizo wa vivumishi-tendo vya wingi katika mistari iliyotangulia. “Wameonja” linahifadhi sitiari ya Kigiriki bila kuamua kama ushiriki ulikuwa wa juu juu au wa kina.
- source_word: θεοῦ ῥῆμα
  choice: neno la Mungu
  rationale: ῥῆμα yaweza kumaanisha neno, usemi, au tamko. “Neno la Mungu” ni Kiswahili cha kawaida na cha heshima, huku likionyesha kuwa neno hilo latoka kwa Mungu au ni lake.
- source_word: δυνάμεις
  choice: nguvu
  rationale: Wingi wa δύναμις unaweza kurejelea maonyesho ya nguvu, pamoja na matendo ya kimiujiza. “Nguvu” linahifadhi upana huo badala ya kuufanya maana kuwa “miujiza” pekee.
- source_word: τε
  choice: na
  rationale: τε inaunganisha δυνάμεις na kitu kilichotangulia. Kiunganishi “na” kinawakilisha uhusiano huo kwa Kiswahili cha kawaida.
- source_word: μέλλοντος αἰῶνος
  choice: enzi inayokuja
  rationale: Kirai hiki kinazielezea “nguvu” na kuelekeza kwenye enzi ya baadaye. “Enzi inayokuja” ni cha asili na kinahifadhi mwelekeo wa kieskatolojia bila maelezo ya ziada.
theological_decisions:
- issue: Maana ya “wameonja” katika muktadha wa onyo
  choice: Kuhifadhi “wameonja” bila kukipanua kuwa “wamepata uzoefu kamili” wala kukidhoofisha kuwa kuonja kwa juu juu tu.
  alternative: wamepata uzoefu; wamepata ladha kidogo tu
  rationale: Waebrania 6:4–6 ni kifungu cha onyo kinachotafsiriwa kwa njia mbalimbali. “Wameonja” linahifadhi sitiari na mvutano wa maandishi bila kuamua kina cha ushiriki wao.
- issue: Maana ya δυνάμεις katika muktadha wa enzi inayokuja
  choice: Kutafsiri “nguvu” na kutoa “miujiza” au “matendo makuu” kama mbadala katika tanbihi.
  alternative: miujiza; matendo makuu
  rationale: Neno hilo laweza kumaanisha maonyesho ya kimiujiza yanayohusishwa na kuingia kwa enzi ijayo, lakini pia linaweza kuwa na maana pana ya nguvu. “Nguvu” linahifadhi utata huo halisi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi, na chenye hadhi. Mstari huu ni mwendelezo wa kisarufi wa sentensi iliyoanza katika mistari iliyotangulia; kwa hiyo unaanza kwa “na ambao.” Alama za tanbihi zimewekwa mara tu baada ya kirai husika kwa mpangilio wa a kisha b.
