id: HEB.6.10
reference: Hebrews 6:10
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οὐ γὰρ ἄδικος ὁ θεὸς ἐπιλαθέσθαι τοῦ ἔργου ὑμῶν ⸀καὶ τῆς ἀγάπης ἧς ἐνεδείξασθε εἰς τὸ ὄνομα αὐτοῦ, διακονήσαντες τοῖς ἁγίοις καὶ διακονοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/010.yaml
  text: For God is not unjust so as to forget your work and the love that you showed for his name in having served the saints and in continuing to serve them[a][b][c].
translation:
  language: sw
  text: Kwa maana Mungu si dhalimu hata asahau kazi yenu na upendo mlioonyesha kwa ajili ya jina lake,[a] kwa kuwahudumia watakatifu[b] na kuendelea kuwahudumia.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa jina lake.”
    reason: lexical_alternative
  - marker: b
    text: Yaani, waamini wenzao; hapa “watakatifu” ni watu wa Mungu waliowekwa wakfu kwake, si kundi la watu waliotangazwa baadaye rasmi kuwa watakatifu.
    reason: cultural_note
  - marker: c
    text: Au, “kwa kuwa mliwahudumia watakatifu na bado mnawahudumia.”
    reason: previous_rendering
lexical_decisions:
- source_word: ἄδικος
  choice: dhalimu
  rationale: Katika muundo huu, neno linaonyesha kutenda kinyume cha haki. ‘Si dhalimu’ ni usemi wa kawaida na wenye hadhi unaosisitiza kwamba Mungu hatatenda isivyo haki.
- source_word: ἐπιλαθέσθαι
  choice: asahau
  rationale: Huhifadhi maana ya moja kwa moja ya ‘kusahau,’ huku muktadha ukidokeza kutoshindwa kukumbuka na kuthamini kwa vitendo.
- source_word: ἔργου
  choice: kazi
  rationale: ‘Kazi’ inafaa kwa nomino ya umoja yenye maana ya jumla na inaunganika kwa kawaida na upendo unaodhihirishwa katika huduma.
- source_word: ἀγάπης
  choice: upendo
  rationale: Hili ndilo neno la kawaida na la moja kwa moja kwa ἀγάπη, hapa likimaanisha upendo ulioonekana kwa matendo.
- source_word: ἐνεδείξασθε
  choice: mlioonyesha
  rationale: Kitenzi kina maana ya kudhihirisha au kutoa ushahidi wa jambo; ‘mlioonyesha’ ni wazi na cha kawaida.
- source_word: εἰς τὸ ὄνομα αὐτοῦ
  choice: kwa ajili ya jina lake
  rationale: Huwasilisha mwelekeo wa upendo kwa heshima na kwa sababu ya jina la Mungu, huku ikihifadhi taswira muhimu ya kibiblia ya ‘jina.’
- source_word: διακονήσαντες
  choice: kwa kuwahudumia
  rationale: Huonyesha huduma iliyofanywa tayari; muktadha pamoja na kitenzi kinachofuata huweka tofauti kati ya huduma ya wakati uliopita na inayoendelea.
- source_word: τοῖς ἁγίοις
  choice: watakatifu
  rationale: Huhifadhi istilahi ya Agano Jipya kwa watu waliowekwa wakfu kwa Mungu bila kuibadili moja kwa moja kuwa ufafanuzi.
- source_word: διακονοῦντες
  choice: kuendelea kuwahudumia
  rationale: Hufanya wazi hali endelevu ya kitenzi cha wakati wa sasa na tofauti yake na huduma iliyotangulia.
theological_decisions:
- issue: Iwapo mstari unafundisha kustahili wokovu kwa matendo au Mungu kutambua kwa uaminifu matendo ya waamini
  choice: Maneno yanadumisha kwamba, kwa haki yake, Mungu hasahau kazi na upendo wao.
  alternative: Kuyafanya matendo yaonekane kuwa yanamlazimisha Mungu kutoa wokovu kama ujira unaodaiwa.
  rationale: Kigiriki kinazungumzia haki ya Mungu katika kutosahau kazi na upendo wao, lakini hakisemi kwamba matendo hayo yanastahilisha wokovu. Tafsiri haiongezi dai hilo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Si dhalimu hata asahau’ huhifadhi muundo na msisitizo wa Kigiriki; ‘kuendelea kuwahudumia’ huonyesha wazi huduma inayoendelea.
