  source_fidelity: 'Tafsiri inawasilisha kwa uaminifu hoja ya Kigiriki: Mungu si dhalimu hata kusahau kazi yao na upendo walioudhihirisha kwa ajili ya jina lake. Muundo wa ‘kwa kuwahudumia watakatifu na kuendelea kuwahudumia’ unadumisha uhusiano wa upendo unaodhihirishwa kwa huduma, na ‘kuendelea’ huonyesha vizuri utofauti wa participle ya wakati uliopo (διακονοῦντες) na tendo la huduma lililotangulia (διακονήσαντες).'
