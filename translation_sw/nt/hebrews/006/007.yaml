source:
  edition: SBLGNT
  text: γῆ γὰρ ἡ πιοῦσα τὸν ἐπ’ αὐτῆς ⸂ἐρχόμενον πολλάκις⸃ ὑετόν, καὶ τίκτουσα βοτάνην εὔθετον ἐκείνοις δι’ οὓς καὶ γεωργεῖται, μεταλαμβάνει εὐλογίας ἀπὸ τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/007.yaml
  text: For land that drinks the rain that often comes upon it and produces vegetation useful to those for whose sake it is also cultivated receives blessing from God[a][b].
translation:
  language: sw
  text: Kwa maana ardhi inayokunywa mvua inayoendelea kunyesha juu yake mara kwa mara, na kuotesha mimea yenye manufaa kwa wale ambao kwa ajili yao pia inalimwa, hupokea baraka kutoka kwa Mungu.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “majani” au “mazao” badala ya “mimea.”
    reason: lexical_alternative
  - marker: b
    text: Au “kwa wale wanaoilima,” ingawa “kwa ajili yao ... inalimwa” huakisi vizuri zaidi διά ikiwa na hali ya accusative hapa.
    reason: alternative_reading
lexical_decisions:
- source_word: γῆ
  choice: ardhi
  rationale: Katika mfano huu wa kilimo, “ardhi” ni neno la kawaida linalomaanisha eneo linalolimwa; “dunia” lingekuwa pana mno.
- source_word: πιοῦσα
  choice: inayokunywa
  rationale: Hudumisha taswira hai ya Kigiriki inayoiwakilisha ardhi kana kwamba inakunywa mvua, badala ya kuifanya kuwa maelezo tambarare kama “inayofyonza.”
- source_word: τὸν ἐπ’ αὐτῆς ἐρχόμενον πολλάκις ὑετόν
  choice: mvua inayoinyeshea mara nyingi
  rationale: Ni Kiswahili cha asili kinachohifadhi maana ya mvua kuja juu ya ardhi na mara kwa mara.
- source_word: τίκτουσα
  choice: kuotesha
  rationale: Katika muktadha wa ardhi, “kuotesha” huwasilisha kwa kawaida wazo la kuzaa au kutokeza mimea.
- source_word: βοτάνην
  choice: mimea
  rationale: “Mimea” ni neno pana, la sasa na linaloeleweka, bila kulazimisha maana mahususi ya mazao yaliyopandwa.
- source_word: εὔθετον
  choice: yenye manufaa
  rationale: Huwasilisha kufaa na kunufaisha katika muktadha wa kilimo kwa lugha wazi na ya heshima.
- source_word: ἐκείνοις δι’ οὓς καὶ γεωργεῖται
  choice: kwa wale ambao kwa ajili yao pia inalimwa
  rationale: Huhifadhi διά pamoja na accusative kama sababu au kusudi—ardhi inalimwa kwa ajili ya watu hao—na “pia” huakisi καί.
- source_word: γεωργεῖται
  choice: inalimwa
  rationale: Ni kitenzi cha kawaida na kipana cha Kiswahili kwa kufanya kazi ya kilimo katika ardhi.
- source_word: μεταλαμβάνει
  choice: hupokea
  rationale: Katika muktadha huu, linaeleza wazi ardhi kupewa baraka; ni la asili zaidi kuliko tafsiri nzito ya “kushiriki katika.”
- source_word: εὐλογίας ἀπὸ τοῦ θεοῦ
  choice: baraka kutoka kwa Mungu
  rationale: Huhifadhi chanzo cha baraka bila kulazimisha ubainisho usio katika Kigiriki.
theological_decisions:
- issue: Mfano wa kilimo katika muktadha wa onyo
  choice: Kuacha mfano useme moja kwa moja bila kuingiza hitimisho la kimafundisho kuhusu kudumu au kuasi.
  alternative: Kutafsiri kwa ufafanuzi zaidi ili kuutambulisha moja kwa moja na waamini wa kweli, waamini wa uongo, au kibali cha Mungu kwa waamini wenye matunda.
  rationale: Mstari huu unatoa upande chanya wa mfano wa kilimo. Kigiriki hakifafanui hapa mifumo hiyo ya kimafundisho, kwa hiyo tafsiri inadumisha mvutano wa kifungu kipana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Taswira ya ardhi “kunywa” mvua imehifadhiwa. Muundo umebaki wa methali bila kuingiza ufafanuzi wa kimadhehebu.
