  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἵνα μὴ νωθροὶ γένησθε, μιμηταὶ δὲ τῶν διὰ πίστεως καὶ μακροθυμίας κληρονομούντων τὰς ἐπαγγελίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/012.yaml
  text: so that you may not become sluggish[a], but imitators of those who through faith and patience inherit the promises.
translation:
  language: sw
  text: ili msije mkawa wavivu, bali mwaige wale wanaorithi ahadi kwa imani[a] na uvumilivu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa uaminifu na uvumilivu.” Neno la Kigiriki lililotafsiriwa “imani” linaweza pia, katika baadhi ya miktadha, kuwa na maana ya “uaminifu” au “kutumaini.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα μὴ
  choice: ili msije
  rationale: Huhifadhi maana ya kusudi au matokeo na kuunganisha sentensi hii na himizo la mstari uliotangulia.
- source_word: νωθροὶ γένησθε
  choice: mkawa wavivu
  rationale: “Mkawa” huonyesha kuingia katika hali hiyo, huku “wavivu” likieleza ukosefu wa bidii au mwitikio unaokusudiwa na νωθροί katika muktadha huu.
- source_word: μιμηταὶ
  choice: mwaige
  rationale: Muundo wa kitenzi ni wa asili zaidi katika Kiswahili kuliko nomino “waigaji,” huku ukihifadhi mwito wa kufuata mfano wa wengine.
- source_word: διὰ πίστεως
  choice: kwa imani
  rationale: “Imani” ni tafsiri pana na iliyozoeleka ya πίστις; kiambishi “kwa” kinaonyesha njia au namna.
- source_word: μακροθυμίας
  choice: uvumilivu
  rationale: Neno hili la kawaida linaeleza kusubiri na kustahimili kwa muda bila kutumia usemi wa kizamani.
- source_word: κληρονομούντων
  choice: wanaorithi
  rationale: Wakati wa sasa huwatambulisha watu hao kwa sifa yao ya kuzipokea ahadi kama urithi.
- source_word: τὰς ἐπαγγελίας
  choice: ahadi
  rationale: “Ahadi” katika Kiswahili inaweza kuwa umoja au wingi kwa umbo lilelile; hapa upatanisho wa kisarufi na chanzo unaelekeza kwenye ahadi nyingi.
theological_decisions:
- issue: Maana ya πίστις katika himizo hili
  choice: imani
  alternative: uaminifu au kumtumaini Mungu
  rationale: “Imani” huhifadhi upana wa neno la Kigiriki bila kuamua kimya kimya ikiwa mkazo ni kutumaini au kuwa mwaminifu; uwezekano mwingine umewekwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “mwaige wale” umetumiwa badala ya “muwe waigaji wa wale” ili sentensi isikike ya asili bila kupoteza maana ya kuufuata mfano wao.
