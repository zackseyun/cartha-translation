  text: ὅπου πρόδρομος ὑπὲρ ἡμῶν εἰσῆλθεν Ἰησοῦς, κατὰ τὴν τάξιν Μελχισέδεκ ἀρχιερεὺς γενόμενος εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/020.yaml
  text: where Jesus has entered as a forerunner on our behalf[b][a], having become a high priest forever according to the order of Melchizedek.
translation:
  language: sw
  text: ambako Yesu aliingia kwa niaba yetu[a] kama mtangulizi, yeye ambaye amekuwa kuhani mkuu milele kwa utaratibu wa Melkizedeki[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa ajili yetu.” Kauli ya Kigiriki inaweza kuonyesha tendo linalofanywa kwa manufaa ya wengine; hapa inasisitiza kwamba Yesu aliingia akituwakilisha.
    reason: lexical_alternative
  - marker: b
    text: Au “katika mpangilio wa Melkizedeki.” Kauli hii ina mwangwi wa Zaburi 110:4.
    reason: cross_reference
lexical_decisions:
- source_word: ὅπου
  choice: ambako
  rationale: Kirejeshi hiki kinaelekeza kwenye mahali pa ndani ya pazia palipotajwa katika mstari uliotangulia, bila kuongeza wazo la mwendo lisilo katika neno lenyewe.
- source_word: πρόδρομος
  choice: mtangulizi
  rationale: Neno hili linaonyesha mtu anayetangulia mbele na hivyo kufungua njia kwa wengine; ni la kawaida na linaendeleza sitiari ya maandishi ya Kigiriki.
- source_word: ὑπὲρ ἡμῶν
  choice: kwa niaba yetu
  rationale: Kauli hii inaonyesha tendo linalofanywa kwa manufaa na kwa uwakilishi wa wengine, bila kulazimisha maana finyu zaidi ya kuchukua mahali pao.
- source_word: εἰσῆλθεν
  choice: aliingia
  rationale: Wakati uliopita rahisi unawakilisha aoristi ya Kigiriki kwa Kiswahili cha kawaida; muktadha unaonyesha umuhimu unaoendelea wa kuingia huko.
- source_word: Ἰησοῦς
  choice: Yesu
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
- source_word: κατὰ τὴν τάξιν Μελχισέδεκ
  choice: kwa utaratibu wa Melkizedeki
  rationale: Kauli hii inaonyesha ulinganifu wa cheo au mpangilio na inahifadhi mwangwi wa Zaburi 110:4 bila kuufafanua kupita kiasi.
- source_word: ἀρχιερεὺς
  choice: kuhani mkuu
  rationale: Hili ndilo neno la kawaida na sahihi kwa cheo hiki cha kikuhani ambacho ni muhimu katika hoja ya Waebrania.
- source_word: γενόμενος
  choice: amekuwa
  rationale: Kitenzi kinahifadhi wazo la Yesu kuingia katika hadhi au cheo cha kuhani mkuu, bila kukibadili moja kwa moja kuwa kitenzi cha kutendwa kama ‘amefanywa’.
- source_word: εἰς τὸν αἰῶνα
  choice: milele
  rationale: Hii ndiyo tafsiri ya kawaida na wazi ya msemo unaoonyesha kudumu bila mwisho katika muktadha huu.
theological_decisions:
- issue: Uhusiano wa γενόμενος na hadhi ya Kristo
  choice: naye amekuwa kuhani mkuu milele
  alternative: naye amewekwa kuwa kuhani mkuu milele
  rationale: Tafsiri inahifadhi kitenzi cha Kigiriki kama taarifa kuhusu kuingia katika cheo cha kikuhani. Haiongezi wazi wazo la uteuzi au mtendaji ambaye hajatamkwa, wala haidokezi kwamba Yesu alianza kuwapo wakati huo.
- issue: Nguvu ya ὑπὲρ ἡμῶν
  choice: kwa niaba yetu
  alternative: kwa ajili yetu
  rationale: ‘Kwa niaba yetu’ inaendeleza maana ya uwakilishi na manufaa katika kuingia kwa Yesu mbele ya waamini, bila kuifanya kauli hii yenyewe kuwa tamko maalumu kuhusu namna ya upatanisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaosomeka kwa urahisi. ‘Mtangulizi,’ ‘kwa niaba yetu,’ na ‘kuhani mkuu’ ni maneno yanayoeleweka kwa wasomaji wa kawaida huku yakihifadhi picha, uwakilishi, na msamiati wa kikuhani wa maandishi ya asili.
