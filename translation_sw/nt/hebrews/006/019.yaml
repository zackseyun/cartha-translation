  text: ἣν ὡς ἄγκυραν ἔχομεν τῆς ψυχῆς, ⸀ἀσφαλῆ τε καὶ βεβαίαν καὶ εἰσερχομένην εἰς τὸ ἐσώτερον τοῦ καταπετάσματος,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/019.yaml
  text: We have this as an anchor of the soul[a], both secure and firm, and entering into the inner place behind the curtain,
translation:
  language: sw
  text: Tunalo tumaini hili kama nanga ya nafsi, iliyo salama na imara, na inayoingia katika mahali pa ndani, nyuma ya pazia,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “katika mahali pa ndani zaidi ya pazia” au “katika mahali pa ndani, nyuma ya pazia la ndani.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἣν
  choice: Tumaini hili
  rationale: Kiwakilishi cha kike kinarejelea wazi tumaini la mstari uliotangulia; kulitaja tena kunafanya rejeo hilo lieleweke kwa Kiswahili bila kukata uhusiano wa sentensi.
- source_word: ὡς ἄγκυραν
  choice: ni kama nanga
  rationale: ὡς inaleta ulinganisho; usemi huu ni wa kawaida na unahifadhi sitiari ya nanga.
- source_word: ἔχομεν
  choice: tuliyo nayo
  rationale: Hutoa maana ya wakati uliopo kwa Kiswahili cha kawaida na kuunganisha kwa urahisi tumaini na waamini.
- source_word: τῆς ψυχῆς
  choice: ya nafsi
  rationale: Inahifadhi maana pana ya ψυχή na sitiari ya nanga bila kuibana iwe akili, hisia, au uhai pekee.
- source_word: ἀσφαλῆ
  choice: iliyo salama
  rationale: Inaonyesha usalama na kutegemeka kwa nanga huku ikitofautishwa na βεβαίαν.
- source_word: τε καὶ βεβαίαν
  choice: na imara
  rationale: Imara huwasilisha uthabiti wa βέβαιος; uratibu wa sifa mbili unabaki wazi kwa Kiswahili cha asili.
- source_word: εἰσερχομένην
  choice: nayo inaingia
  rationale: Inahifadhi kauli ya sasa na inaonyesha kwamba maelezo yanaendelea kumhusu 'nanga' bila kuficha upanuzi wa sitiari.
- source_word: εἰς τὸ ἐσώτερον
  choice: mpaka mahali pa ndani
  rationale: Kirai hiki kinaonyesha mwendo kuingia eneo la ndani bila kulitambulisha kwa jina maalumu kuliko chanzo.
- source_word: τοῦ καταπετάσματος
  choice: nyuma ya pazia
  rationale: Katika taswira ya patakatifu, genitivi inaeleweka kuwa upande wa ndani wa pazia; 'pazia' ni neno la sasa na linaloeleweka linalohifadhi taswira hiyo.
theological_decisions:
- issue: Taswira ya ibada ya patakatifu pa mbinguni
  choice: mahali pa ndani nyuma ya pazia
  alternative: mahali pa ndani kabisa mwa pazia; nyuma ya pazia
  rationale: Tafsiri inahifadhi taswira ya hema/hekalu na kufanya uhusiano wa mahali ueleweke, bila kuamua zaidi ya maandishi kuhusu utambulisho wa eneo hilo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umewekwa wa asili kwa Kiswahili huku sitiari ya nanga na taswira ya pazia la patakatifu zikihifadhiwa.
