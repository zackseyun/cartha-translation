  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἵνα διὰ δύο πραγμάτων ἀμεταθέτων, ἐν οἷς ἀδύνατον ψεύσασθαι ⸀θεόν, ἰσχυρὰν παράκλησιν ἔχωμεν οἱ καταφυγόντες κρατῆσαι τῆς προκειμένης ἐλπίδος·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/018.yaml
  text: so that through two unchangeable things[a], in which it is impossible for God to lie[b], we who have fled for refuge might have strong encouragement to take hold of the hope set before us.
translation:
  language: sw
  text: ili kwa mambo mawili yasiyoweza kubadilika, ambamo haiwezekani Mungu kusema uongo, sisi tuliokimbilia kupata hifadhi[b] tupate faraja kubwa ya kulishika[a] tumaini lililowekwa mbele yetu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kulishikilia kwa uthabiti tumaini lililowekwa mbele yetu.” Kitenzi cha Kigiriki kinaweza kumaanisha kushika, kukamata, au kushikilia kwa nguvu.
    reason: lexical_alternative
  - marker: b
    text: Maneno “tuliokimbilia kupata hifadhi” huenda yakadokeza picha ya mtu anayekimbilia hifadhi, labda yakikumbusha miji ya makimbilio katika Agano la Kale.
    reason: cross_reference
lexical_decisions:
- source_word: ἵνα
  choice: ili
  rationale: Huonyesha kusudi au matokeo yanayotokana na mstari uliotangulia kwa Kiswahili cha kawaida.
- source_word: διὰ δύο πραγμάτων ἀμεταθέτων
  choice: kwa mambo mawili yasiyoweza kubadilika
  rationale: “Mambo” huhifadhi upana wa πράγματα, huku “yasiyoweza kubadilika” ikionyesha kwa wazi kutobadilishwa kwa mambo hayo.
- source_word: ἐν οἷς
  choice: ambayo katika hayo
  rationale: Hudumisha uhusiano wa kisarufi na mambo mawili yaliyotajwa bila kuyafafanua zaidi ndani ya mstari huu.
- source_word: ἀδύνατον ψεύσασθαι θεόν
  choice: haiwezekani Mungu kusema uongo
  rationale: Huhifadhi muundo wa kauli ya kutowezekana na uzito wa uthibitisho kuhusu ukweli wa Mungu.
- source_word: ἰσχυρὰν παράκλησιν
  choice: faraja kubwa
  rationale: παράκλησις hapa ni faraja au kutiwa moyo kunakotokana na uhakika wa ahadi na kiapo; “faraja kubwa” ni ya asili na yenye heshima.
- source_word: ἔχωμεν
  choice: tupate
  rationale: Huwakilisha hali tegemezi baada ya ἵνα na matokeo yaliyokusudiwa.
- source_word: οἱ καταφυγόντες
  choice: sisi tuliokimbilia mahali pa usalama
  rationale: Huhifadhi mwendo wa kukimbia na kusudi la kupata hifadhi, badala ya kugeuza picha hiyo kuwa wazo la jumla.
- source_word: κρατῆσαι
  choice: kulishika
  rationale: Hutoa maana ya kushika kwa uthabiti kwa lugha ya kawaida; kidokezo kinaweka wazi uwezekano wa msisitizo wa “kulishikilia kwa nguvu.”
- source_word: τῆς προκειμένης ἐλπίδος
  choice: tumaini lililowekwa mbele yetu
  rationale: Huhifadhi picha ya tumaini lililowasilishwa au kuwekwa mbele ya waamini.
theological_decisions:
- issue: Picha ya kukimbilia usalama na kulishika tumaini
  choice: sisi tuliokimbilia mahali pa usalama ... kulishika tumaini
  alternative: sisi tuliopata hifadhi ... kulishikilia kwa uthabiti tumaini
  rationale: Tafsiri iliyochaguliwa huhifadhi picha hai ya kukimbia ili kupata usalama na hatua ya kulishika tumaini, bila kuibadili kuwa maelezo ya kimafundisho.
- issue: Kauli kuhusu ukweli wa Mungu
  choice: haiwezekani Mungu kusema uongo
  alternative: Mungu hawezi kusema uongo
  rationale: Muundo huu huhifadhi kwa karibu kauli ya Kigiriki ya kutowezekana bila kuongeza madai ya kifalsafa yasiyotamkwa katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umewekwa wazi kwa wasomaji wa kawaida huku picha za asili za hifadhi na kushika tumaini zikihifadhiwa.
