  yaml_path: translation/nt/hebrews/008/007.yaml
  text: For if that first covenant had been faultless[b][a], no place would have been sought for a second.
translation:
  language: sw
  text: Kwa maana, kama agano lile la kwanza halikuwa na dosari,[a] nafasi ya kutafuta agano la pili isingekuwapo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki, “lile la kwanza”; neno “agano” limeongezwa kutokana na muktadha.
    reason: lexical_alternative
  - marker: b
    text: Au, “agano la pili lisingetafutiwa nafasi”; yaani, “nafasi/uwezekano wa agano la pili isingetafutwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ γὰρ
  choice: Kwa maana, kama
  rationale: “Kwa maana” linaonyesha kuwa mstari huu unaeleza hoja iliyotangulia, na “kama” linahifadhi nguvu ya sharti.
- source_word: ἡ πρώτη ἐκείνη
  choice: agano lile la kwanza
  rationale: Nomino “agano” haijatajwa wazi katika Kigiriki, lakini inaeleweka kutokana na muktadha wa 8:6 na ulinganisho wa la kwanza na la pili. Kuitaja hufanya Kiswahili kiwe wazi na cha kawaida.
- source_word: ἦν ἄμεμπτος
  choice: halikuwa na dosari
  rationale: Huhifadhi maana ya kutokuwa na jambo la kulaumiwa au kasoro bila kufafanua dosari hiyo ilikuwa ya aina gani.
- source_word: οὐκ ἂν
  choice: isingetafutwa
  rationale: Muundo huu wa sharti lisilotimia unaonyesha matokeo ambayo yasingetokea.
- source_word: δευτέρας
  choice: ya agano la pili
  rationale: Ingawa Kigiriki kina kivumishi tu, kurudia “agano” katika Kiswahili huondoa utata na kuonyesha wazi kinacholinganishwa.
- source_word: ἐζητεῖτο τόπος
  choice: nafasi ... isingetafutwa
  rationale: “Nafasi” ni Kiswahili cha kawaida kinachoweza kuwasilisha maana ya τόπος kama nafasi, fursa, au msingi wa kuanzishwa kwa jambo jingine, huku kikiendelea kuwa karibu na taswira ya Kigiriki.
theological_decisions:
- issue: Kutaja “agano” ingawa halirudiwi wazi katika Kigiriki
  choice: “agano lile la kwanza” na “agano la pili”
  alternative: “lile la kwanza” na “la pili”
  rationale: Muktadha unahusu maagano mawili. Kuongeza nomino inayoeleweka kunaboresha uwazi bila kuingiza dai jipya la kiteolojia; tanbihi inaonyesha udhahiri wa Kigiriki.
- issue: Dosari ya agano la kwanza ilikuwa nini au ilikuwa kwa nani
  choice: “halikuwa na dosari” bila maelezo zaidi
  alternative: Kufafanua kwamba dosari ilikuwa katika watu au utekelezaji wake
  rationale: Mstari wenyewe unaweka sharti lakini hausemi kwa ukamilifu dosari hiyo ilihusu nini. Tafsiri inahifadhi mvutano huo badala ya kuutatua kwa kuingiza ufafanuzi kutoka mstari unaofuata.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Halikuwa na dosari” ni wazi kwa wasomaji wa kawaida, na “nafasi ... isingetafutwa” huhifadhi kwa kiasi kikubwa muundo na taswira ya chanzo huku tanbihi ikitoa maana mbadala ya kimuktadha.
