  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὅτι αὕτη ἡ διαθήκη ἣν διαθήσομαι τῷ οἴκῳ Ἰσραὴλ μετὰ τὰς ἡμέρας ἐκείνας, λέγει κύριος, διδοὺς νόμους μου εἰς τὴν διάνοιαν αὐτῶν, καὶ ἐπὶ καρδίας αὐτῶν ἐπιγράψω αὐτούς, καὶ ἔσομαι αὐτοῖς εἰς θεόν καὶ αὐτοὶ ἔσονταί μοι εἰς λαόν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/010.yaml
  text: 'For this is the covenant that I will make with the house of Israel after those days[a], says the Lord: putting my laws into their minds, and I will write them on their hearts; and I will be their God, and they will be my people.'
translation:
  language: sw
  text: 'Kwa maana hili ndilo agano nitakalofanya na nyumba ya Israeli baada ya siku zile, asema Bwana: nikiweka sheria zangu katika akili zao[a], nami nitaziandika juu ya mioyo yao; nami nitakuwa Mungu wao, nao watakuwa watu wangu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au kwa mtiririko laini zaidi: “Nitaweka sheria zangu katika akili zao, nami nitaziandika juu ya mioyo yao.” Kigiriki kina kitenzi kishirikishi (“nikiweka/nikiwapa”) kinachofuatwa na kitenzi cha wakati ujao (“nitaandika”).'
    reason: lexical_alternative
lexical_decisions:
- source_word: διαθήκη
  choice: agano
  rationale: “Agano” huwasilisha maana ya kifungo cha kiagano kinachotokana na Yeremia 31, wala si wosia wa mwisho.
- source_word: διαθήσομαι
  choice: nitakalofanya
  rationale: Kitenzi hiki katika muktadha wa agano humaanisha kufanya au kuanzisha agano; “nitakalofanya” ni Kiswahili cha kawaida na sahihi.
- source_word: οἴκῳ Ἰσραήλ
  choice: nyumba ya Israeli
  rationale: Huhifadhi usemi wa kinabii na maana ya Israeli kama jumuiya ya agano.
- source_word: μετὰ τὰς ἡμέρας ἐκείνας
  choice: baada ya siku zile
  rationale: Huhifadhi nahau ya wakati na mwangwi wa Yeremia bila kuifafanua kupita maandishi.
- source_word: κύριος
  choice: Bwana
  rationale: Hufuata κύριος ya maandishi ya Kigiriki na ni jina la kawaida la heshima katika Kiswahili cha Biblia.
- source_word: διδοὺς
  choice: nikiweka
  rationale: Huhifadhi umbo la hali tegemezi linalolingana na kirai kishirikishi cha Kigiriki, huku likieleweka kwa Kiswahili.
- source_word: νόμους
  choice: sheria
  rationale: “Sheria” kwa Kiswahili inaweza kuwa na maana ya wingi kulingana na muktadha, hivyo huwasilisha νόμους bila usemi mzito usio wa kawaida.
- source_word: διάνοιαν
  choice: akili
  rationale: “Akili” huonyesha uwezo wa kufikiri na kuelewa, na hapa “akili zao” huakisi wahusika wengi.
- source_word: ἐπὶ καρδίας αὐτῶν
  choice: mioyoni mwao
  rationale: Huu ni usemi wa asili wa Kiswahili kwa uandishi unaotiwa ndani kabisa ya nafsi; wazo la kuandika bado linahifadhiwa.
- source_word: ἐπιγράψω
  choice: nitaziandika
  rationale: Huhifadhi sitiari ya kuandika na kiambishi “-zi-” hurejelea sheria.
- source_word: ἔσομαι αὐτοῖς εἰς θεόν
  choice: nitakuwa Mungu wao
  rationale: Huu ni usemi wa kawaida na wa moja kwa moja wa kanuni ya uhusiano wa agano.
- source_word: αὐτοὶ ἔσονταί μοι εἰς λαόν
  choice: nao watakuwa watu wangu
  rationale: Hukamilisha kanuni ya agano kwa lugha ya asili na inayoeleweka.
theological_decisions:
- issue: Kuhifadhi mwangwi wa agano la Yeremia
  choice: Kutumia “nyumba ya Israeli,” “sheria zangu,” “Mungu wao,” na “watu wangu.”
  alternative: Kutumia ufafanuzi laini zaidi kama “Waisraeli” na kupunguza misemo ya kiagano.
  rationale: Maneno haya yanahifadhi uhusiano wa wazi na Yeremia 31 na nguvu ya kitheolojia ya ahadi ya agano.
- issue: 'Muundo mchanganyiko wa vitenzi: διδοὺς … ἐπιγράψω'
  choice: “nikiweka … nami nitaziandika”
  alternative: “nitaweka … nami nitaziandika”
  rationale: Chaguo kuu huhifadhi tofauti ya Kigiriki kati ya kirai kishirikishi na kitenzi cha wakati ujao; chaguo laini zaidi limetolewa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kiagano na mwangwi wa Yeremia umehifadhiwa, huku sentensi ikiendelea kueleweka kwa msomaji wa kawaida.
