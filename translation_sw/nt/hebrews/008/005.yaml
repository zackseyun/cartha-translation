  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: (οἵτινες ὑποδείγματι καὶ σκιᾷ λατρεύουσιν τῶν ἐπουρανίων, καθὼς κεχρημάτισται Μωϋσῆς μέλλων ἐπιτελεῖν τὴν σκηνήν, Ὅρα γάρ, φησίν, ποιήσεις πάντα κατὰ τὸν τύπον τὸν δειχθέντα σοι ἐν τῷ ὄρει)·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/005.yaml
  text: who serve a copy and shadow of the heavenly things[a], just as Moses was divinely instructed when he was about to erect the tabernacle; for he says[b], “See that you make everything according to the pattern shown to you on the mountain.”
translation:
  language: sw
  text: hao wanaofanya huduma ya ibada katika mfano na kivuli cha mambo ya mbinguni, kama vile Musa alivyoagizwa na Mungu[a] alipokuwa karibu kukamilisha[b] hema la ibada; kwa maana anasema, “Hakikisha kwamba unatengeneza kila kitu kulingana na kielelezo ulichoonyeshwa mlimani.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alivyoonywa”; kitenzi cha Kigiriki kinaweza kukazia onyo au maelekezo kutoka kwa Mungu.
    reason: lexical_alternative
  - marker: b
    text: Au, “kujenga.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: hao
  rationale: Inarejelea makuhani waliotajwa katika muktadha uliotangulia na kuanzisha maelezo kuwahusu kwa Kiswahili cha kawaida.
- source_word: ὑποδείγματι
  choice: mfano
  rationale: Katika muktadha huu ni kitu cha duniani kinachowakilisha na kulingana na kile cha mbinguni; “mfano” ni neno la kawaida lisilobana maana kuwa nakala halisi.
- source_word: σκιᾷ
  choice: kivuli
  rationale: Inahifadhi sitiari ya Kigiriki ya kitu halisi lakini kisicho na utimilifu wa kile cha mbinguni.
- source_word: λατρεύουσιν
  choice: wanafanya huduma
  rationale: Kitenzi kinamaanisha huduma ya kidini au ya ibada; kirai hiki kinaonyesha huduma ya kikuhani bila kudokeza kwamba makuhani wanauabudu mfano wenyewe.
- source_word: τῶν ἐπουρανίων
  choice: cha mambo ya mbinguni
  rationale: Inahifadhi upeo mpana wa rejeo la Kigiriki bila kulifanya liwe mahali tu wala kulifasiri moja kwa moja kuwa “uhalisi.”
- source_word: κεχρημάτισται
  choice: alivyoagizwa na Mungu
  rationale: Kitenzi huonyesha ujumbe au maelekezo yenye asili ya kimungu. Tafsiri hii ni ya kawaida na inaweka wazi chanzo kinachodokezwa katika kauli tendwa.
- source_word: μέλλων
  choice: alipokuwa karibu
  rationale: Inaonyesha kwamba Musa alikuwa anakaribia kufanya kazi hiyo.
- source_word: ἐπιτελεῖν
  choice: kukamilisha
  rationale: Inahifadhi maana ya kutekeleza jambo hadi kukamilika, huku uwezekano wa “kujenga” katika muktadha huu ukiwekwa katika tanbihi.
- source_word: σκηνήν
  choice: hema la ibada
  rationale: “Hema” ni tafsiri ya moja kwa moja, na “la ibada” hulitambulisha kwa uwazi kuwa patakatifu pa Israeli badala ya hema la kawaida.
- source_word: Ὅρα
  choice: Hakikisha
  rationale: Katika amri hii maana ni kutunza kwa makini kwamba jambo lifanywe; “Hakikisha” ni ya asili katika Kiswahili na huhifadhi nguvu ya maonyo ya neno hilo.
- source_word: ποιήσεις πάντα
  choice: unatengeneza kila kitu
  rationale: Wakati ujao wa Kigiriki unatumika kwa nguvu ya amri katika nukuu; Kiswahili cha sasa baada ya “Hakikisha kwamba” hutoa amri hiyo kwa njia ya kawaida.
- source_word: τύπον
  choice: kielelezo
  rationale: Ni mpangilio au muundo ulioonyeshwa kwa Musa ambao alipaswa kuufuata; “kielelezo” hutofautisha neno hili na ὑπόδειγμα iliyotafsiriwa “mfano.”
theological_decisions:
- issue: Uhusiano wa huduma ya duniani na mambo ya mbinguni
  choice: “mfano na kivuli cha mambo ya mbinguni”
  alternative: “nakala na kivuli cha uhalisi wa mbinguni”
  rationale: Tafsiri iliyochaguliwa inadumisha ulinganifu na pia upungufu wa huduma ya duniani bila kupunguza mambo ya mbinguni kuwa ishara tu au kuyafafanua kupita maandishi.
- issue: Nguvu ya κεχρημάτισται
  choice: “alivyoagizwa na Mungu”
  alternative: “alivyoonya na Mungu”
  rationale: Neno hilo linaweza kuwa na maana ya onyo, lakini hapa pia linaonyesha mawasiliano na maelekezo ya kimungu. Chaguo kuu linahifadhi upana huo, na maana ya onyo imeonyeshwa katika tanbihi.
- issue: Mhusika wa φησίν
  choice: “anasema” bila kumtaja mhusika
  alternative: “Mungu anasema”
  rationale: Kigiriki kina kitenzi katika nafsi ya tatu bila nomino ya mhusika. Kutomtaja moja kwa moja kunahifadhi muundo huo na kuepuka kufafanua kimya kimya ikiwa mwandishi anamaanisha Mungu au Maandiko, ingawa muktadha wa nukuu ya kimungu uko wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Hema la ibada” linaeleweka kwa wasomaji wa kawaida, na sentensi inadumisha mtiririko wa hoja pamoja na nukuu ya moja kwa moja.
