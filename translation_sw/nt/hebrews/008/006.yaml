base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/006.yaml
  text: But as it is[a], he has obtained a more excellent ministry, by as much as he is also the mediator of a better covenant[c][b], which has been enacted on better promises.
translation:
  language: sw
  text: Lakini sasa amepata huduma iliyo bora zaidi, kwa kadiri ambavyo yeye pia ni mpatanishi wa agano bora zaidi,[a] ambalo limeanzishwa kisheria kwa msingi wa ahadi bora zaidi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki linaweza pia kumaanisha “wosia” katika miktadha fulani; hapa “agano” linafaa kwa sababu aya zinazofuata zananukuu ahadi ya Yeremia kuhusu agano jipya.
    reason: alternative_reading
  - marker: b
    text: Au, “ambalo limewekwa kwa msingi wa ahadi bora zaidi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: Lakini sasa
  rationale: Huhifadhi ulinganisho wa sasa na makuhani wa duniani waliozungumziwa kabla, kwa Kiswahili cha kawaida na cha moja kwa moja.
- source_word: διαφορωτέρας
  choice: iliyo bora zaidi
  rationale: Katika muktadha huu neno linaonyesha ubora wa huduma kwa kulinganishwa na nyingine; kauli hii pia hudumisha msururu wa ulinganisho katika aya.
- source_word: τέτυχεν
  choice: amepata
  rationale: Wakati timilifu wa Kigiriki unaonyesha tendo lililotimia lenye matokeo ya sasa; 'amepata' ni ya asili na inaonyesha kuwa sasa anayo huduma hiyo.
- source_word: λειτουργίας
  choice: huduma
  rationale: Hapa ni huduma takatifu ya Kristo katika muktadha wa ukuhani. 'Huduma' ni wazi bila kuongeza neno 'ya kikuhani,' ambalo muktadha tayari unalidhihirisha.
- source_word: ὅσῳ καὶ
  choice: kwa kadiri alivyo pia
  rationale: 'Huhifadhi uhusiano wa kiwango: huduma yake ni bora kwa kiwango kinacholingana na ubora wa agano analolipatanisha.'
- source_word: κρείττονός ... διαθήκης
  choice: agano bora zaidi
  rationale: κρείττων ni neno kuu la ulinganisho katika Waebrania, na 'bora zaidi' hudumisha msisitizo huo kwa lugha ya kawaida.
- source_word: μεσίτης
  choice: mpatanishi
  rationale: Humaanisha anayesimama kati ya pande ili kutekeleza uhusiano wa agano. 'Mpatanishi' ni istilahi iliyoeleweka na yenye uzito ufaao wa kisheria na kiteolojia.
- source_word: ἥτις
  choice: ambalo
  rationale: Hurejelea agano na kuanzisha maelezo yake bila kuliongezea nguvu isiyolazimishwa na Kigiriki.
- source_word: ἐπὶ κρείττοσιν ἐπαγγελίαις
  choice: kwa msingi wa ahadi bora zaidi
  rationale: ἐπί pamoja na hali ya dative hapa huonyesha msingi; tafsiri hii ni ya asili zaidi kuliko 'juu ya ahadi' na inaweka wazi uhusiano uliomo katika chanzo.
- source_word: νενομοθέτηται
  choice: limewekwa
  rationale: Wakati timilifu tendwa unaonyesha kuwa agano liliwekwa rasmi na linaendelea kuwa na nguvu. 'Limewekwa' ni ya asili, huku tanbihi ikihifadhi maana mbadala ya kuanzishwa kisheria.
theological_decisions:
- issue: Tafsiri ya διαθήκη katika Waebrania 8:6
  choice: agano
  alternative: wosia
  rationale: Muktadha wa Waebrania 8 unategemea moja kwa moja ahadi ya agano jipya katika Yeremia na kazi ya mpatanishi; kwa hiyo 'agano' linafaa kuliko 'wosia,' ingawa διαθήκη linaweza kuwa na maana hiyo katika miktadha mingine.
- issue: Maana ya μεσίτης
  choice: mpatanishi
  alternative: mjumbe wa kati
  rationale: Neno hili huhifadhi wajibu wa Kristo kati ya wahusika wa agano bila kufafanua kupita kiasi namna upatanisho huo unavyofanya kazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa ulinganisho 'bora zaidi' umerudiwa kimakusudi ili kudumisha hoja ya Kigiriki. 'Mpatanishi' na 'agano' ni istilahi zinazotambulika kwa wasomaji wa kawaida bila kuingiza msimamo wa kimadhehebu.
