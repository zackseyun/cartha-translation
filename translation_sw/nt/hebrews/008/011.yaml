id: HEB.8.11
reference: Hebrews 8:11
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ οὐ μὴ διδάξωσιν ἕκαστος τὸν πολίτην αὐτοῦ καὶ ἕκαστος τὸν ἀδελφὸν αὐτοῦ, λέγων· Γνῶθι τὸν κύριον, ὅτι πάντες εἰδήσουσίν με ἀπὸ ⸀μικροῦ ἕως μεγάλου αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/011.yaml
  text: And they will certainly not teach[a], each one his fellow citizen and each one his brother, saying, ‘Know the Lord,’ because they will all know me, from the least of them to the greatest.
translation:
  language: sw
  text: Wala kamwe kila mmoja hatamfundisha raia mwenzake[a], wala ndugu yake, akisema, “Mtambue Bwana,” kwa sababu wote watanijua, kuanzia aliye mdogo zaidi hadi aliye mkubwa zaidi miongoni mwao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “jirani yake.” Maandishi ya Kigiriki ya Waebrania yana “raia mwenzake,” ilhali kifungu cha Yeremia kinachonukuliwa hapa kwa kawaida hutafsiriwa “jirani yake.”
    reason: alternative_reading
lexical_decisions:
- source_word: οὐ μὴ διδάξωσιν
  choice: Wala kamwe ... hatamfundisha
  rationale: Muundo οὐ μή pamoja na kitenzi cha hali tegemezi unaonyesha ukanushi wenye mkazo. Neno “kamwe” linahifadhi mkazo huo kwa Kiswahili cha sasa; umoja wa kitenzi unatokana na muundo wa ugawaji “kila mmoja.”
- source_word: ἕκαστος
  choice: kila mmoja
  rationale: Huhifadhi maana ya ugawaji, ikisisitiza kila mtu binafsi ndani ya jumuiya inayotajwa.
- source_word: πολίτην
  choice: raia mwenzake
  rationale: πολίτης humaanisha raia au mwananchi mwenza. “Raia mwenzake” linafuata kwa karibu neno lililo katika maandishi ya Kigiriki ya Waebrania badala ya kubadili moja kwa moja kuwa “jirani” kwa kufuata mapokeo ya Yeremia.
- source_word: ἀδελφὸν
  choice: ndugu yake
  rationale: “Ndugu” huhifadhi lugha ya kifamilia ya ἀδελφός na linaweza kumaanisha ndugu wa kiume kulingana na muundo wa Kigiriki.
- source_word: Γνῶθι
  choice: Mjue
  rationale: Ni amri ya umoja inayowasilisha mwito wa kumjua au kumtambua Bwana.
- source_word: κύριον
  choice: Bwana
  rationale: “Bwana” ndilo neno la kawaida na lenye hadhi kwa κύριος katika muktadha huu wa agano.
- source_word: πάντες εἰδήσουσίν με
  choice: wote watanijua
  rationale: Huhifadhi πάντες, wakati kiambishi “-ni-” kinawakilisha wazi yambwa “mimi.”
- source_word: ἀπὸ μικροῦ ἕως μεγάλου αὐτῶν
  choice: kuanzia aliye mdogo zaidi hadi aliye mkubwa zaidi miongoni mwao
  rationale: Huwasilisha upeo mzima wa watu bila kuufungia usemi huo kwa umri au cheo pekee.
theological_decisions:
- issue: Tafsiri ya πολίτην katika dondoo linalohusiana na Yeremia 31:34
  choice: raia mwenzake
  alternative: jirani yake
  rationale: Maandishi yaliyopo ya Kigiriki ya Waebrania yana πολίτην, “raia/mwananchi mwenza.” Kipaumbele kwa chanzo cha lugha ya asili kinahitaji tofauti hiyo ionekane katika matini kuu, huku tafsiri iliyozoeleka kutoka Yeremia ikitajwa katika tanbihi.
- issue: Lugha ya kifamilia yenye jinsia katika ἀδελφὸν
  choice: ndugu yake
  alternative: ndugu yake wa kiume au wa kike
  rationale: Umoja wa kiume wa chanzo na taswira yake ya kifamilia vinahifadhiwa bila kuongeza maneno yasiyokuwapo katika matini, ingawa ahadi yenyewe inawahusu wote katika jumuiya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Kamwe” linaonyesha ukanushi wenye mkazo; marudio ya “kila mmoja” yanahifadhi muundo wa ugawaji wa chanzo. Tanbihi [a] imewekwa mara moja katika matini kuu.
