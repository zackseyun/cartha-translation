  verdict: revise
  source_fidelity: Draft preserves the emphatic negation, distributive repetition, πολίτην as “raia mwenzake,” the explicit first-person object in “watanijua,” and the inclusive range from least to greatest. However, “Mjue Bwana” is not an unambiguous or natural singular imperative corresponding to Γνῶθι, addressed by each individual to his fellow citizen/brother.
  naturalness: The overall register is clear Standard East African Swahili. Recasting the word order slightly makes the two parallel objects easier to follow. “Mtambue Bwana” is a natural singular exhortation and avoids the grammatical ambiguity of “Mjue Bwana.”
  terminology: “Bwana” appropriately renders κύριον. “Raia mwenzake” correctly retains the Greek-specific civic term rather than importing “jirani” into the main text. “Ndugu yake” is suitably concise and preserves the familial term without adding gendered wording absent from idiomatic Swahili.
  issues:
