    issue: The quoted command “Mjue Bwana” is grammatically ambiguous and does not clearly represent the singular imperative Γνῶθι.
    rationale: The Greek has a singular command, “Know the Lord,” issued by each person to another individual. “Mtambue Bwana” gives a clear singular command in natural Swahili while retaining the direct object Bwana.
  revised_text: Wala kamwe kila mmoja hatamfundisha raia mwenzake[a], wala ndugu yake, akisema, “Mtambue Bwana,” kwa sababu wote watanijua, kuanzia aliye mdogo zaidi hadi aliye mkubwa zaidi miongoni mwao.
