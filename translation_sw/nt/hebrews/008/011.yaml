  to: Wala kamwe kila mmoja hatamfundisha raia mwenzake[a], wala ndugu yake, akisema, “Mtambue Bwana,” kwa sababu wote watanijua, kuanzia aliye mdogo zaidi hadi aliye mkubwa zaidi miongoni mwao.
