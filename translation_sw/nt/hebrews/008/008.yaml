  text: μεμφόμενος γὰρ ⸀αὐτοὺς λέγει· Ἰδοὺ ἡμέραι ἔρχονται, λέγει κύριος, καὶ συντελέσω ἐπὶ τὸν οἶκον Ἰσραὴλ καὶ ἐπὶ τὸν οἶκον Ἰούδα διαθήκην καινήν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/008.yaml
  text: For in finding fault with them he says, “Look, days are coming, says the Lord, when I will establish a new covenant with the house of Israel and with the house of Judah,”
translation:
  language: sw
  text: Kwa maana, akiwalaumu, anasema, “Tazama, siku zinakuja, asema Bwana, na nitafanya agano jipya na nyumba ya Israeli na nyumba ya Yuda.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μεμφόμενος ... αὐτοὺς
  choice: akiwalaumu
  rationale: Huwasilisha moja kwa moja tendo la kuona kosa kwa ‘wao,’ huku ikihifadhi kiwakilishi kinachorejelea watu waliotajwa katika muktadha.
- source_word: Ἰδοὺ
  choice: Tazama
  rationale: Neno la kawaida na lenye hadhi linalovuta usikivu kwa tangazo la kinabii.
- source_word: συντελέσω ... διαθήκην καινήν
  choice: nitakapofanya agano jipya
  rationale: ‘Kufanya agano’ ni Kiswahili cha asili na huakisi maana ya kukamilisha au kutekeleza agano bila kuingiza ufafanuzi wa ziada.
- source_word: οἶκον Ἰσραὴλ ... οἶκον Ἰούδα
  choice: nyumba ya Israeli ... nyumba ya Yuda
  rationale: Hudumisha taswira ya kifamilia na kitaifa ya neno la Kigiriki οἶκος, ambalo hapa linamaanisha jamii ya ukoo au taifa.
theological_decisions:
- issue: Kirejeleo cha αὐτούς katika ‘akiwalaumu’
  choice: Kukihifadhi kama ‘wao’ ndani ya kitenzi ‘akiwalaumu’
  alternative: ‘akililaumu agano hilo’
  rationale: Usomaji uliotolewa wa SBLGNT una αὐτούς, ‘wao,’ hivyo tafsiri haibadili mhusika kuwa agano na haiondoi mvutano wa kimuktadha.
- issue: Nguvu ya συντελέσω kuhusu agano
  choice: ‘nitakapofanya agano jipya’
  alternative: ‘nitakapolianzisha/kulikamilisha agano jipya’
  rationale: Tafsiri hii inabaki pana vya kutosha kubeba wazo la kulitekeleza agano bila kuamua kwa tafsiri hatua mahususi ya kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa tangazo la kinabii umehifadhiwa, lakini sentensi imewekwa kwa mtiririko wa kawaida wa Kiswahili.
