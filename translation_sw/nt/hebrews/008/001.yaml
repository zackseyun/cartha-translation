id: HEB.8.1
reference: Hebrews 8:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Κεφάλαιον δὲ ἐπὶ τοῖς λεγομένοις, τοιοῦτον ἔχομεν ἀρχιερέα, ὃς ἐκάθισεν ἐν δεξιᾷ τοῦ θρόνου τῆς μεγαλωσύνης ἐν τοῖς οὐρανοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/001.yaml
  text: 'The main point in what is being said is this: we have such a high priest[a], who sat down at the right hand of the throne of the Majesty in the heavens[b],'
translation:
  language: sw
  text: 'Jambo kuu katika hayo yanayosemwa ni hili: tunaye kuhani mkuu wa namna hiyo, ambaye aliketi upande wa kulia wa kiti cha enzi cha Mwenye Ukuu mbinguni[a],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki ni “katika mbingu,” kwa umbo la wingi.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κεφάλαιον
  choice: Jambo kuu
  rationale: Katika muktadha huu neno hilo linaonyesha hoja kuu au muhtasari wa mjadala, si ‘sura’ kwa maana ya sehemu ya kitabu.
- source_word: δὲ
  choice: halijatafsiriwa kwa neno maalumu
  rationale: Hapa δέ ni kiunganishi hafifu cha kuhamisha mjadala; mtiririko wa Kiswahili tayari unaonyesha uhamisho huo bila kulazimisha ‘basi’ au ‘lakini’.
- source_word: ἐπὶ τοῖς λεγομένοις
  choice: katika hayo yanayosemwa
  rationale: Huhifadhi wazo la mambo yanayozungumziwa na hali ya tendo linaloendelea, kwa Kiswahili kinachoeleweka.
- source_word: τοιοῦτον
  choice: wa namna hiyo
  rationale: Hurejelea sifa za kuhani mkuu aliyeelezwa katika hoja iliyotangulia.
- source_word: ἔχομεν
  choice: tunaye
  rationale: Kiambishi cha ngeli ya mtu kinafaa kwa kumrejelea kuhani mkuu na ni cha kawaida katika Kiswahili.
- source_word: ἀρχιερέα
  choice: kuhani mkuu
  rationale: Ni istilahi ya kawaida na sahihi kwa cheo hiki cha kikuhani.
- source_word: ἐκάθισεν
  choice: aliketi
  rationale: Huwasilisha tendo kamili la kuketi bila kuongeza tafsiri ya kiteolojia kuhusu maana ya tendo hilo.
- source_word: ἐν δεξιᾷ
  choice: upande wa kulia
  rationale: Ni usemi wa kawaida wa Kiswahili unaohifadhi mahali pa heshima na mamlaka bila kulazimisha taswira ya mkono halisi.
- source_word: τοῦ θρόνου
  choice: wa kiti cha enzi
  rationale: Huhifadhi taswira ya kifalme ya θρόνος.
- source_word: τῆς μεγαλωσύνης
  choice: cha Mwenye Ukuu
  rationale: Huhifadhi mtajo wa heshima usio wa moja kwa moja kwa Mungu, huku ‘Mwenye Ukuu’ ikiwa ya asili zaidi kwa Kiswahili kuliko nomino dhahania pekee.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: mbinguni
  rationale: Ni usemi wa kawaida wa Kiswahili kwa eneo la mbinguni; tanbihi inaonyesha kuwa Kigiriki kina umbo la wingi.
theological_decisions:
- issue: Kumtaja wazi Mungu kama rejeleo la τῆς μεγαλωσύνης
  choice: Mwenye Ukuu
  alternative: Mungu; Ukuu
  rationale: Chanzo kinatumia jina la heshima lisilo la moja kwa moja badala ya θεός. Tafsiri hii inalinda mtindo huo bila kuficha kwamba kinachorejelewa ni nafsi.
- issue: Kupanua maana ya ἐκάθισεν ili kusisitiza kukamilika kwa kazi ya kikuhani
  choice: aliketi
  alternative: alichukua nafasi yake kwa ushindi; akaketi baada ya kukamilisha kazi yake
  rationale: Muktadha wa Waebrania unaweza kuhusisha kuketi na kazi iliyokamilika, lakini mstari huu hauyasemi maneno hayo wazi; hayapaswi kuongezwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umewekwa wazi kwa msomaji wa kawaida huku taswira ya ukuhani na ufalme ikihifadhiwa. Alama ya tanbihi [a] imewekwa baada ya ‘mbinguni,’ sehemu inayohusika moja kwa moja.
