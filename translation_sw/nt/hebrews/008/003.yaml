base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/003.yaml
  text: For every high priest is appointed to offer both gifts and sacrifices[a]; therefore it is necessary for this one also to have something that he may offer.
translation:
  language: sw
  text: Kwa maana kila kuhani mkuu huwekwa ili atoe matoleo na dhabihu; kwa hiyo ni lazima huyu pia awe na kitu cha kutoa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “huyu pia awe na kitu ambacho aweze kutoa.” Kigiriki halimtaji wazi anayerejelewa na “huyu”; katika muktadha, ni Yesu akiwa Kuhani Mkuu.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς γὰρ ἀρχιερεὺς
  choice: Kwa maana kila kuhani mkuu
  rationale: “Kila” linaonyesha maana ya kugawa ya πᾶς pamoja na nomino ya umoja; “kwa maana” linaonyesha kuwa γάρ linaunganisha mstari huu na maelezo yaliyotangulia.
- source_word: εἰς τὸ προσφέρειν
  choice: ili atoe
  rationale: Muundo wa εἰς pamoja na kitenzi-jina chenye kibainishi unaonyesha kusudi; “ili atoe” ni Kiswahili cha kawaida kinachohifadhi maana hiyo.
- source_word: δῶρά τε καὶ θυσίας
  choice: zawadi na dhabihu
  rationale: Maneno hayo mawili ya ibada yamehifadhiwa kama makundi tofauti. Katika Kiswahili, kiunganishi “na” kinawasilisha jozi ya τε καὶ kwa ufasaha bila ulazima wa kuongeza “vyote ... na.”
- source_word: καθίσταται
  choice: huwekwa
  rationale: Katika muktadha wa ukuhani, kitenzi hiki kinamaanisha kuwekwa au kuteuliwa katika wadhifa. “Huwekwa” pia huhifadhi hali ya kutendwa na maana ya kanuni ya jumla.
- source_word: ὅθεν
  choice: kwa hiyo
  rationale: Hutambulisha hitimisho linalotokana na kauli iliyotangulia.
- source_word: ἀναγκαῖον ἔχειν
  choice: ni lazima ... awe na
  rationale: Muundo huu unaonyesha ulazima; “ni lazima” ni usemi wa asili na ulio wazi katika Kiswahili.
- source_word: τι
  choice: kitu
  rationale: Huhifadhi hali isiyobainishwa ya kiwakilishi cha Kigiriki.
- source_word: καὶ τοῦτον
  choice: huyu pia
  rationale: “Huyu” huhifadhi nguvu ya kiashiria cha τοῦτον bila kumtaja wazi mhusika ambaye Kigiriki hakimtaji; “pia” huwakilisha καί.
- source_word: ὃ προσενέγκῃ
  choice: cha kutoa
  rationale: Huwasilisha kwa Kiswahili cha asili wazo la kuwa na kitu ambacho angekitoa, bila kuzidisha uzito wa muundo wa sentensi.
theological_decisions:
- issue: Mhusika anayerejelewa na τοῦτον (“huyu”)
  choice: Maandishi makuu yanatumia “huyu,” huku tanbihi ikieleza kuwa katika muktadha ni Yesu akiwa Kuhani Mkuu.
  alternative: Kutaja “Yesu” au “Kristo” moja kwa moja katika maandishi makuu.
  rationale: Muktadha unamtambulisha Yesu, lakini Kigiriki chenyewe kinatumia kiashiria. Uamuzi huu huepuka kuingiza jina lisilokuwamo na huhifadhi namna maandishi yanavyojenga hoja.
- issue: Istilahi za ibada δῶρα na θυσίαι
  choice: Kuhifadhi “zawadi na dhabihu” kama makundi mawili.
  alternative: “Sadaka na dhabihu” au kuyajumlisha kuwa “matoleo ya dhabihu.”
  rationale: Kutenganisha istilahi hizo kunahifadhi usahihi wa hoja kuhusu kazi ya kikuhani bila kuingiza ufafanuzi wa kidhehebu au kueleza mapema aina ya kile ambacho Kristo hutoa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Kuhani mkuu,” “zawadi,” na “dhabihu” huhifadhi msamiati wa kikuhani; “huyu” huhifadhi utata halisi wa rejeleo la Kigiriki.
