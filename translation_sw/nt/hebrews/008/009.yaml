id: HEB.8.9
reference: Hebrews 8:9
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οὐ κατὰ τὴν διαθήκην ἣν ἐποίησα τοῖς πατράσιν αὐτῶν ἐν ἡμέρᾳ ἐπιλαβομένου μου τῆς χειρὸς αὐτῶν ἐξαγαγεῖν αὐτοὺς ἐκ γῆς Αἰγύπτου, ὅτι αὐτοὶ οὐκ ἐνέμειναν ἐν τῇ διαθήκῃ μου, κἀγὼ ἠμέλησα αὐτῶν, λέγει κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/009.yaml
  text: not like the covenant that I made with their fathers on the day when I took hold of their hand to bring them out of the land of Egypt[a], because they did not continue in my covenant, and I disregarded them[b], says the Lord.
translation:
  language: sw
  text: si kama agano nililofanya na baba zao siku ile nilipowashika kwa mkono ili kuwatoa katika nchi ya Misri[a], kwa sababu hawakudumu katika agano langu, nami sikuwajali[b], asema Bwana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nilipowashika mikono.”
    reason: lexical_alternative
  - marker: b
    text: 'Nukuu hii inafuata maneno ya Kigiriki yaliyo katika Waebrania: “sikuwajali.” Katika maandishi ya Kiebrania ya Yeremia 31:32 maana ni tofauti, na mara nyingi hutafsiriwa “ingawa nilikuwa mume wao” au “ingawa nilikuwa bwana wao.”'
    reason: alternative_reading
lexical_decisions:
- source_word: διαθήκην
  choice: agano
  rationale: Katika Waebrania neno hili linahusu uhusiano wa agano la Mungu na watu wake; “agano” ni sahihi na la kawaida katika Kiswahili cha Biblia.
- source_word: τοῖς πατράσιν αὐτῶν
  choice: na baba zao
  rationale: Huhifadhi maana ya mababa wa Israeli na kuambatana kwa kawaida na usemi “kufanya agano na” katika Kiswahili.
- source_word: ἐν ἡμέρᾳ
  choice: siku ile
  rationale: Hutoa rejeo la wakati kwa lugha ya asili na inayoeleweka, bila kudai kwamba tukio lote lilitokea ndani ya siku moja pekee.
- source_word: ἐπιλαβομένου μου τῆς χειρὸς αὐτῶν
  choice: nilipowashika mkono
  rationale: Huhifadhi taswira ya kushika mkono iliyo katika Kigiriki, huku ikisomeka kwa kawaida katika Kiswahili.
- source_word: ἐξαγαγεῖν αὐτοὺς
  choice: ili kuwatoa
  rationale: “Kuwatoa” huwasilisha kwa ufupi na kwa kawaida tendo la Mungu la kuwaondoa Misri; dhana ya kuwaongoza haiongezwi zaidi ya kitenzi chenyewe.
- source_word: γῆς Αἰγύπτου
  choice: nchi ya Misri
  rationale: Huhifadhi neno γῆς badala ya kufupisha kuwa “Misri” pekee.
- source_word: οὐκ ἐνέμειναν ἐν τῇ διαθήκῃ μου
  choice: hawakudumu katika agano langu
  rationale: “Kudumu katika” huonyesha kutosalia waaminifu au kutendelea ndani ya wajibu wa agano bila kufafanua zaidi ya matini.
- source_word: κἀγὼ ἠμέλησα αὐτῶν
  choice: nami sikuwajali
  rationale: Huonyesha maana ya kutowajali au kutowashughulikia iliyo katika ἀμελέω, na huhifadhi kiunganishi rahisi “nami” badala ya kukifanya kuwa hitimisho la wazi.
- source_word: λέγει κύριος
  choice: asema Bwana
  rationale: Ni fomula ya nukuu iliyo ya kawaida, yenye hadhi, na ya moja kwa moja katika Kiswahili.
theological_decisions:
- issue: Tofauti kati ya maneno ya Kigiriki ya Waebrania na maandishi ya Kiebrania ya Yeremia 31:32
  choice: nami sikuwajali
  alternative: ingawa nilikuwa mume wao / bwana wao
  rationale: Tafsiri inafuata matini ya Kigiriki ya Waebrania, ἠμέλησα αὐτῶν, lakini tanbihi inahifadhi tofauti muhimu ya kimatini na kitheolojia iliyopo katika Yeremia ya Kiebrania.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi na inayoeleweka kwa wasomaji wa kawaida. Taswira ya kushika mkono na tofauti ya kimatini katika Yeremia zimehifadhiwa.
