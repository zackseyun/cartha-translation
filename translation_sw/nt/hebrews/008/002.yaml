  text: a minister of the holy places and of the true tabernacle[a], which the Lord set up[b], not man.
translation:
  language: sw
  text: mhudumu wa sehemu takatifu[a] na wa hema la kweli, ambalo Bwana alilisimamisha[b], si mwanadamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Patakatifu”; kirai cha Kigiriki kinaweza kurejelea patakatifu au sehemu zake takatifu, wala si watu watakatifu.
    reason: lexical_alternative
  - marker: b
    text: Au, “alilipiga,” kama hema linavyopigwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῶν ἁγίων
  choice: mahali patakatifu
  rationale: Kivumishi hiki cha wingi kilichotumika kama nomino kinaeleweka katika muktadha wa ibada wa Waebrania kuwa mahali patakatifu pa mbinguni, si watu watakatifu. Kiswahili hutumia umbo la jumla ‘mahali patakatifu,’ huku tanbihi ikihifadhi uwezekano wa ‘Patakatifu.’
- source_word: λειτουργὸς
  choice: mhudumu
  rationale: Neno hili humaanisha mtu anayefanya huduma rasmi, hasa ya kidini. ‘Mhudumu’ ni la kawaida na lenye heshima, na linafaa kwa huduma ya kikuhani katika muktadha huu.
- source_word: σκηνῆς
  choice: hema
  rationale: Neno hili linaibua hema la kukutania la Musa na mfano wake wa mbinguni. ‘Hema’ ni neno la kawaida la Kiswahili linalohifadhi picha hiyo.
- source_word: ἀληθινῆς
  choice: la kweli
  rationale: ‘La kweli’ huhifadhi maana ya kile kilicho halisi na kamili, tofauti na mfano wake wa duniani, bila kuongeza ufafanuzi usiotajwa wazi.
- source_word: ἔπηξεν
  choice: alilisimamisha
  rationale: Kitenzi humaanisha kukaza au kusimamisha, hasa hema. ‘Alilisimamisha’ ni Kiswahili cha asili na huhifadhi taswira ya hema; ‘alilipiga’ limewekwa katika tanbihi kama tafsiri mbadala.
- source_word: ὁ κύριος
  choice: Bwana
  rationale: ‘Bwana’ ndiyo tafsiri ya kawaida na yenye heshima ya κύριος katika muktadha huu.
- source_word: οὐκ ἄνθρωπος
  choice: wala si mwanadamu
  rationale: Kauli hii fupi inatofautisha tendo la Bwana na tendo la binadamu. ‘Mwanadamu’ hubeba maana ya jumla ya ἄνθρωπος kwa Kiswahili cha sasa.
theological_decisions:
- issue: Maana ya τῶν ἁγίων na uhusiano wake na patakatifu pa mbinguni
  choice: Lugha ya mahali patakatifu pa ibada, si rejeo kwa watu watakatifu
  alternative: watakatifu
  rationale: Waebrania 8:1–5 huzungumzia huduma ya Kuhani Mkuu katika patakatifu pa mbinguni. ‘Mahali patakatifu’ hudumisha mfumo wa hema na patakatifu bila kuhamisha maana kuwa huduma kwa watu.
- issue: Maana ya jumla ya ἄνθρωπος
  choice: mwanadamu
  alternative: mtu
  rationale: Muktadha unatofautisha kile Bwana alichosimamisha na kile ambacho mwanadamu angeweza kusimamisha. ‘Mwanadamu’ huonyesha kwa uwazi kwamba kinachokusudiwa ni binadamu kwa ujumla, si mwanamume mmoja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi umehifadhi mwendelezo wa aya iliyotangulia, kwa kuwa maandishi ya Kigiriki yanaanza kama kirai kinachomfafanua Kuhani Mkuu.
