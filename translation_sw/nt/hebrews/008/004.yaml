  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἰ μὲν ⸀οὖν ἦν ἐπὶ γῆς, οὐδ’ ἂν ἦν ἱερεύς, ⸀ὄντων τῶν προσφερόντων κατὰ ⸀νόμον τὰ δῶρα·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/004.yaml
  text: If he were on earth[a], he would not even be a priest, since there are those who offer the gifts according to the law.
translation:
  language: sw
  text: Kama angekuwa duniani, asingekuwa hata kuhani, kwa kuwa wapo wanaotoa zawadi[a] kulingana na sheria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “matoleo.” Kigiriki kinasema “zawadi,” neno linalotumiwa mara nyingi kuhusu vitu vinavyotolewa katika ibada katika muktadha huu.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ μὲν οὖν
  choice: Kama
  rationale: Muundo huu unaanzisha hoja ya masharti na kuiunganisha na yaliyotangulia. Kiswahili cha sasa hakihitaji kulimbikiza viunganishi; “Kama” hubeba sharti kwa uwazi huku mtiririko wa hoja ukibaki katika muktadha.
- source_word: ἦν
  choice: angekuwa
  rationale: Katika muundo huu wa sharti lisilo halisi, “angekuwa” huonyesha kwa kawaida hali inayodhaniwa kuwa kinyume na hali halisi.
- source_word: ἐπὶ γῆς
  choice: duniani
  rationale: Hii ndiyo tafsiri ya kawaida na ya kimuktadha, ikitofautisha eneo la duniani na la mbinguni katika hoja inayozunguka mstari huu.
- source_word: οὐδ’ ἂν ἦν
  choice: asingekuwa hata
  rationale: '“Hata” huhifadhi msisitizo wa οὐδέ pamoja na ἄν: si kwamba tu hangekuwa kuhani wa aina fulani, bali hangekuwa kuhani kabisa katika hali hiyo.'
- source_word: ἱερεύς
  choice: kuhani
  rationale: Neno la kawaida la Kiswahili kwa cheo cha ibada kinachotajwa hapa.
- source_word: ὄντων τῶν προσφερόντων
  choice: kwa kuwa wapo wanaotoa
  rationale: Genitivi huru ina nguvu ya kutoa sababu au hali inayofafanua kauli iliyotangulia; “kwa kuwa” huonyesha uhusiano huo kwa Kiswahili cha kawaida.
- source_word: κατὰ νόμον
  choice: kulingana na sheria
  rationale: Huhifadhi maana ya kutenda kwa mujibu wa utaratibu wa sheria bila kuongeza ufafanuzi usiotajwa moja kwa moja katika mstari.
- source_word: τὰ δῶρα
  choice: zawadi
  rationale: “Zawadi” huhifadhi maana ya msingi ya δῶρα na utofauti wake na kitenzi προσφέρω (“kutoa”), ingawa katika muktadha huu ni istilahi ya vitu vinavyotolewa katika ibada.
theological_decisions:
- issue: Kiima kisichotajwa wazi katika sentensi ya masharti
  choice: Kiima kimeonyeshwa ndani ya kitenzi “angekuwa,” kikirejelea Yesu/Masihi kutokana na muktadha wa karibu.
  alternative: Kutumia nomino au jina “Yesu” moja kwa moja.
  rationale: Kiswahili huruhusu kiima cha nafsi ya tatu kubebwa na kitenzi. Hivyo tafsiri inaeleweka bila kuongeza jina ambalo halipo katika Kigiriki.
- issue: Nguvu ya sentensi ya masharti
  choice: 'Imetafsiriwa kama sharti lisilo halisi: “Kama angekuwa duniani, asingekuwa hata kuhani.”'
  alternative: “Kama alikuwa duniani, hakuwa kuhani.”
  rationale: Muundo wa εἰ pamoja na wakati usiotimilifu, na ἄν katika jibu la sharti, huonyesha hali iliyo kinyume na hali halisi; muundo wa -nge- wa Kiswahili huiwasilisha kwa usahihi bila kuondoa mvutano wa hoja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye heshima lakini kinachoeleweka kwa urahisi. Muundo wa -nge- umetumiwa kuonyesha sharti lisilo halisi. Alama ya tanbihi imewekwa baada ya “zawadi,” neno ambalo tanbihi inalifafanua.
