  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐν τῷ λέγειν Καινὴν πεπαλαίωκεν τὴν πρώτην, τὸ δὲ παλαιούμενον καὶ γηράσκον ἐγγὺς ἀφανισμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/013.yaml
  text: By saying[a], “new,” he has made the first obsolete[c][b]. And what is becoming obsolete and growing old is near to disappearing.
translation:
  language: sw
  text: Kwa kusema, “mpya,”[a] ameifanya ile ya kwanza ipitwe na wakati.[b] Na kile kinachopitwa na wakati na kuzeeka kiko karibu kutoweka.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Anaposema.” Kigiriki pia kinaweza kueleweka kuwa “Katika kusema.”
    reason: lexical_alternative
  - marker: b
    text: Kigiriki kinanukuu neno “mpya” pekee, likirejelea maneno “agano jipya” katika nukuu iliyotangulia ya Yeremia 31:31. “Ile ya kwanza” ni agano la kwanza.
    reason: cross_reference
  - marker: c
    text: Au, “kuondolewa” au “kutoweka kabisa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ λέγειν
  choice: Kwa kusema
  rationale: Muundo huu unaweza kuonyesha hali au njia. “Kwa kusema” ni Kiswahili cha kawaida na hudumisha uhusiano wa moja kwa moja na tamko lililonukuliwa hapo awali.
- source_word: Καινὴν
  choice: “mpya”
  rationale: Kivumishi hiki kimesimama peke yake kwa kurejelea kwa ufupi maneno “agano jipya” katika nukuu iliyotangulia. Kutafsiri “mpya” pekee hudumisha ufupi wa Kigiriki bila kuongeza nomino isiyopo katika aya hii.
- source_word: πεπαλαίωκεν
  choice: ameifanya ... ipitwe na wakati
  rationale: Wakati timilifu unaonyesha tendo lililokamilika lenye matokeo yanayoendelea. Usemi “kupitwa na wakati” unaeleza vizuri kwamba ile ya kwanza imefanywa kuwa isiyotumika tena, bila kuingiza dai pana zaidi ya hoja ya mwandishi.
- source_word: τὴν πρώτην
  choice: ile ya kwanza
  rationale: Kivumishi kimetumiwa kama nomino na katika muktadha kinarejelea agano la kwanza. “Ile ya kwanza” hudumisha muundo wa Kigiriki huku muktadha ukibainisha rejeo lake.
- source_word: τὸ ... παλαιούμενον
  choice: kile kinachopitwa na wakati
  rationale: Kitenzi-shirikishi cha wakati uliopo kinaonyesha mchakato unaoendelea. Tafsiri hii ni ya kawaida na inaendeleza wazo la πεπαλαίωκεν.
- source_word: γηράσκον
  choice: kuzeeka
  rationale: Neno hili linaongeza taswira ya kitu kinachoendelea kuwa kizee; “kuzeeka” ni la kawaida na hudumisha sitiari hiyo.
- source_word: ἐγγὺς
  choice: kiko karibu
  rationale: Neno hili huonyesha ukaribu; “kiko karibu” ni usemi wa asili katika Kiswahili.
- source_word: ἀφανισμοῦ
  choice: kutoweka
  rationale: Nomino hii inaweza kueleza kutoweka au kuondoka machoni. “Kutoweka” ni wazi, ya sasa, na haiamui kimakusudi iwapo wazo kuu ni kuondolewa au kuangamia.
theological_decisions:
- issue: Mtendaji aliyedokezwa katika “Kwa kusema, ‘mpya’”
  choice: Mtendaji amedokezwa kwa kiambishi “a-” bila kutajwa wazi kuwa Mungu au Maandiko.
  alternative: Mungu anaposema / Maandiko yanaposema
  rationale: Kigiriki hakitaji mtendaji kwa jina bali hurudi kwa msemaji wa nukuu ya Yeremia. Tafsiri hii haiainishi zaidi ya aya yenyewe, ingawa muktadha humwezesha msomaji kumtambua.
- issue: Hali ya lile agano la kwanza
  choice: ameifanya ile ya kwanza ipitwe na wakati
  alternative: ameifanya ile ya kwanza kuwa ya zamani
  rationale: Muktadha unalinganisha agano la kwanza na agano jipya lililoahidiwa. “Kupitwa na wakati” huwasilisha nguvu ya hoja hiyo bila kuongeza madai ya kimafundisho yasiyosemwa hapa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Urudiaji wa wazo la kupitwa na wakati umehifadhiwa ili kuonyesha uhusiano wa πεπαλαίωκεν na παλαιούμενον, huku “kuzeeka” ukihifadhi taswira tofauti ya γηράσκον.
