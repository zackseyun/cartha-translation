  text: Kwa maana nitawarehemu kwa maovu yao[a], wala sitazikumbuka tena dhambi zao[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nitakuwa mwenye rehema kwa matendo yao yasiyo ya haki.” Neno la Kigiriki ἀδικίαις linaweza kumaanisha maovu au matendo ya dhuluma; “maovu” huhifadhi wingi na maana yake ya kimaadili katika muktadha huu.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “hakika sitazikumbuka dhambi zao tena.” Katika muktadha wa agano, hii ni nahau ya msamaha kamili, si dai kwamba Mungu huacha kujua dhambi hizo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Kwa maana
  rationale: Katika dondoo hili, ὅτι linaanzisha msingi au maelezo ya ahadi iliyotangulia; “Kwa maana” huhifadhi uhusiano huo kwa Kiswahili cha kawaida.
- source_word: ἵλεως ἔσομαι
  choice: nitakuwa mwenye rehema
  rationale: Huhifadhi wazo la hali ya Mungu ya rehema na upendeleo wa kusamehe bila kutumia istilahi nzito au kubadili moja kwa moja kuwa kitenzi “nitasamehe.”
- source_word: ταῖς ἀδικίαις αὐτῶν
  choice: kwao kuhusu matendo yao yasiyo ya haki
  rationale: Muundo huu unafanya uhusiano wa dativu uwe wa kawaida katika Kiswahili. Wingi wa ἀδικίαις unaweza kurejelea makosa halisi, hivyo “matendo ... yasiyo ya haki” huhifadhi wingi na uzito wa kimaadili.
- source_word: καὶ
  choice: wala
  rationale: Baada ya kishazi chanya kinachofuatwa na ukanushaji, “wala” huunganisha vishazi kwa Kiswahili cha asili huku ikihifadhi nguvu ya kiunganishi.
- source_word: τῶν ἁμαρτιῶν αὐτῶν
  choice: dhambi zao
  rationale: Hili ndilo neno la kawaida na la moja kwa moja kwa nomino ya wingi ἁμαρτιῶν pamoja na kiwakilishi chake.
- source_word: οὐ μὴ μνησθῶ ἔτι
  choice: sitazikumbuka tena
  rationale: Huhifadhi wakati ujao, ukanushaji wenye mkazo, na maana ya ἔτι katika Kiswahili fasaha bila kuwa nzito.
theological_decisions:
- issue: Maana ya Mungu kutozikumbuka dhambi tena
  choice: Nahau ya agano imeachwa katika matini kama “sitazikumbuka tena,” ikionyesha msamaha kamili na kutowahesabia dhambi.
  alternative: Kufasiri maneno hayo kuwa Mungu anapoteza maarifa ya dhambi hizo kihalisi.
  rationale: Matini inadumisha taswira ya kibiblia bila kuibadili kuwa maelezo ya kimafundisho; tanbihi hufafanua matumizi yake katika muktadha wa agano.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Kauli ni rahisi kusomeka kwa watu wa kawaida, huku ikihifadhi muundo wa ahadi ya agano na taswira ya kutokumbuka.
