  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἐκκλησίᾳ πρωτοτόκων ⸂ἀπογεγραμμένων ἐν οὐρανοῖς⸃, καὶ κριτῇ θεῷ πάντων, καὶ πνεύμασι δικαίων τετελειωμένων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/023.yaml
  text: and to the assembly of the firstborn who are enrolled in the heavens[a], and to God, the judge of all, and to the spirits of righteous people made perfect,
translation:
  language: sw
  text: na kwa kusanyiko la wazaliwa wa kwanza walioandikishwa katika mbingu[a], na kwa Mungu, Mwamuzi wa wote, na kwa roho za watu waadilifu waliokamilishwa,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walioandikishwa mbinguni.” Kigiriki kina wingi, “katika mbingu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκκλησίᾳ
  choice: kusanyiko
  rationale: Neno hili linaonyesha jamii iliyokusanyika bila kuingiza moja kwa moja maana ya taasisi ambayo huenda ikahusishwa na “kanisa”; linafaa katika muktadha wa Sayuni ya mbinguni.
- source_word: πρωτοτόκων
  choice: wazaliwa wa kwanza
  rationale: Wingi wa Kigiriki umehifadhiwa kama jina la kundi lenye hadhi au urithi wa mzaliwa wa kwanza, bila kuongeza “wana,” ambalo halipo wazi katika matini.
- source_word: ἀπογεγραμμένων
  choice: walioandikishwa
  rationale: Kauli hii huhifadhi picha ya majina yaliyowekwa katika daftari na hali inayoendelea kutokana na tendo lililokamilika.
- source_word: ἐν οὐρανοῖς
  choice: katika mbingu
  rationale: Huhifadhi kwa uwazi wingi wa Kigiriki, ingawa Kiswahili cha kawaida mara nyingi hutumia “mbinguni.”
- source_word: κριτῇ θεῷ πάντων
  choice: Mungu, Mwamuzi wa wote
  rationale: Muundo wa ufafanuzi unamtambulisha Mungu kuwa Mwamuzi wa wote na unaendeleza mfululizo wa wale ambao wasomaji wamewajia.
- source_word: πνεύμασι
  choice: roho
  rationale: Hii ndiyo maana ya moja kwa moja katika muktadha; hakuna haja ya kuongeza maelezo ya kimafundisho kuhusu hali yao.
- source_word: δικαίων
  choice: watu waadilifu
  rationale: Huonyesha wazi kwamba warejelewa ni wanadamu na inajumuisha jinsia zote bila kutumia neno linalomaanisha wanaume pekee.
- source_word: τετελειωμένων
  choice: waliokamilishwa
  rationale: Huhifadhi kauli tendwa na mada ya kukamilishwa au kufikishwa kwenye ukamilifu iliyo muhimu katika Waebrania.
theological_decisions:
- issue: Utambulisho wa “wazaliwa wa kwanza”
  choice: Jina la pamoja la watu wenye hadhi ya mzaliwa wa kwanza
  alternative: Kristo peke yake akiwa Mzaliwa wa Kwanza, huku kusanyiko likiwa lake
  rationale: Wingi wa πρωτοτόκων unaelekeza kwa nguvu kwenye kundi. Tafsiri haiingizi maelezo zaidi kuhusu namna wanavyoshiriki hadhi hiyo.
- issue: Warejelewa na “roho za watu waadilifu waliokamilishwa”
  choice: Roho za wanadamu waadilifu waliokamilishwa
  alternative: Watu wote waadilifu kwa maana pana, wawe katika mwili au la
  rationale: Neno “roho” linaashiria kwa kawaida wanadamu katika hali ya kiroho, lakini tafsiri haiongezi mfumo maalumu wa kimafundisho kuhusu hali ya kati.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Katika mbingu” ni rasmi kidogo ili kuhifadhi wingi wa Kigiriki; namna ya kawaida zaidi imewekwa katika tanbihi.
