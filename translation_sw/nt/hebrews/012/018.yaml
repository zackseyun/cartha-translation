base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/018.yaml
  text: For you have not come to what can be touched[a], and to a blazing fire, and to darkness and gloom and storm[b],
translation:
  language: sw
  text: Kwa maana hamjakaribia kitu kinachoweza kuguswa[a], wala moto unaowaka, wala giza nene, wala giza totoro, wala tufani[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mlima unaoweza kuguswa.” Muktadha unaonyesha kwamba Sinai ndiyo inayokusudiwa, lakini neno “mlima” halitajwi wazi katika Kigiriki cha mstari huu.
    reason: alternative_reading
  - marker: b
    text: 'Muundo wa karibu zaidi na mfululizo wa viunganishi vya Kigiriki unaweza kuwa: “kitu kinachoweza kuguswa, na moto unaowaka, na giza nene, na giza totoro, na tufani.” Ukanushi wa “hamjakaribia” unahusu orodha yote.'
    reason: previous_rendering
lexical_decisions:
- source_word: Οὐ γὰρ
  choice: Kwa maana ... hamja-
  rationale: “Kwa maana” linaendeleza hoja kwa nguvu ya ufafanuzi ya γάρ, huku kiambishi hasi “hamja-” kikibeba Οὐ.
- source_word: προσεληλύθατε
  choice: hamjakaribia
  rationale: Wakati timilifu unaonyesha tendo la kukaribia lenye matokeo ya sasa. “Hamjakaribia” ni Kiswahili cha kawaida na kinadumisha wazo la kusogea karibu au kupata nafasi ya kufikia.
- source_word: ψηλαφωμένῳ
  choice: kitu kinachoweza kuguswa
  rationale: Neno hili lina maana ya kitu kinachogusika au kinachoweza kuguswa. Kwa kuwa hakuna nomino “mlima” katika maandishi ya Kigiriki ya mstari huu, tafsiri kuu haiongezi nomino hiyo.
- source_word: κεκαυμένῳ πυρί
  choice: moto unaowaka
  rationale: Kirai kinaonyesha moto ulio katika hali ya kuwaka. “Moto unaowaka” ni wazi, cha sasa, na cha asili kwa Kiswahili.
- source_word: γνόφῳ
  choice: giza nene
  rationale: γνόφος hudokeza giza zito. Kivumishi “nene” kinasa uzito huo na kusaidia kulitofautisha na neno linalofuata.
- source_word: ζόφῳ
  choice: giza totoro
  rationale: ζόφος hudokeza giza kuu lenye hali ya kutisha. “Giza totoro” linahifadhi mkusanyiko wa maneno mawili yanayokaribiana bila kuyaunganisha kuwa wazo moja.
- source_word: θυέλλῃ
  choice: tufani
  rationale: θύελλα ni dhoruba kali. “Tufani” ni neno la kawaida, lenye hadhi, na linaonyesha ukali huo.
theological_decisions:
- issue: Iwapo “mlima” iongezwe kuwa kitu kilichokaribiwa
  choice: Kutoingiza “mlima” katika matini kuu; kutafsiri kama kitu kisichotajwa wazi ambacho kinaweza kuguswa.
  alternative: “Hamjaukaribia mlima unaoweza kuguswa ...”
  rationale: Ingawa muktadha unaelekeza wazi kwa Sinai, neno ὄρος (“mlima”) halipo katika maandishi ya Kigiriki ya mstari huu. Kutolitaja katika matini kuu kunahifadhi namna chanzo kilivyo na hakufuti utata wake halisi.
- issue: Jinsi ukanushi unavyohusu orodha yenye καί inayorudiwa
  choice: Kutumia “wala” kwa kila sehemu baada ya kitenzi hasi.
  alternative: 'Kutumia “na” katika orodha yote: “hamjakaribia ... na moto ... na giza ...”'
  rationale: Katika Kiswahili, “wala” huonyesha kwa kawaida na kwa uwazi kwamba ukanushi wa “hamjakaribia” unahusu kila sehemu ya orodha. Hii inadumisha mkusanyiko wa vipengele vya Kigiriki bila kuashiria kuwa baadhi yake havijakanushwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Hamjakaribia” ni cha kawaida kuliko tungo nzito zaidi, na marudio ya “wala” yanaifanya orodha hasi ieleweke mara moja. “Giza nene” na “giza totoro” yanahifadhi mkusanyiko wa istilahi mbili za Kigiriki zinazokaribiana. Koma ya mwisho imehifadhiwa kwa sababu sentensi inaendelea katika mstari unaofuata.
