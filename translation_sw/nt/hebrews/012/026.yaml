base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/026.yaml
  text: whose voice shook the earth then[a], but now he has promised, saying[b], “Yet once more I will shake not only the earth but also the heaven.”
translation:
  language: sw
  text: Sauti yake iliitikisa dunia wakati ule, lakini sasa ameahidi akisema:[a] “Mara nyingine tena nitaitikisa si dunia tu, bali pia mbingu.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maneno yanayofuata yamenukuliwa kutoka Hagai 2:6.
    reason: cross_reference
  - marker: b
    text: Au “anga.” Kigiriki kina nomino ya umoja yenye kibainishi, kihalisi “mbingu ile.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗ ἡ φωνὴ
  choice: Sauti yake
  rationale: Kiwakilishi cha umilikaji ‘yake’ kinaendeleza rejeo la Mungu kutoka muktadha uliotangulia, huku ‘sauti’ ikihifadhi wazo la msemaji binafsi.
- source_word: ἐσάλευσεν
  choice: iliitikisa
  rationale: Kitenzi hiki kinaeleza kusababisha dunia itikisike; ‘iliitikisa’ ni cha kawaida na chenye nguvu inayofaa katika muktadha huu.
- source_word: τὴν γῆν
  choice: dunia
  rationale: Tofauti yake na mbingu inaonyesha kuwa γῆ hapa ni dunia kwa maana pana, si nchi au ardhi ya eneo fulani.
- source_word: τότε
  choice: wakati ule
  rationale: Kauli hii ya wakati inaonyesha kwa uwazi tofauti kati ya tukio la zamani na ahadi inayotajwa sasa.
- source_word: νῦν δὲ ἐπήγγελται
  choice: lakini sasa ameahidi
  rationale: ‘Lakini sasa’ huhifadhi ulinganisho wa wakati, na ‘ameahidi’ huonyesha ahadi iliyotolewa ambayo bado ina nguvu.
- source_word: λέγων
  choice: akisema
  rationale: Huu ni utangulizi wa kawaida na wa asili wa maneno yaliyonukuliwa.
- source_word: Ἔτι ἅπαξ
  choice: Mara moja tena
  rationale: Kauli hii huhifadhi msisitizo wa kutokea kwa mtikiso mwingine mmoja, bila kuongeza maelezo yasiyomo katika Kigiriki.
- source_word: σείσω
  choice: nitaitikisa
  rationale: Wakati ujao na taswira ya mtikiso wa ulimwengu zimehifadhiwa moja kwa moja.
- source_word: οὐ μόνον ... ἀλλὰ καὶ
  choice: si ... tu, bali pia
  rationale: Muundo huu wa Kiswahili unawakilisha kwa kawaida jozi ya Kigiriki inayopanua wigo wa tendo.
- source_word: τὸν οὐρανόν
  choice: mbingu
  rationale: ‘Mbingu’ inafaa kwa upande wa juu wa jozi pana ya dunia na mbingu; haipunguzi maana kuwa anga la hewa pekee.
theological_decisions:
- issue: Mhusika wa sauti na wa ahadi
  choice: Kiwakilishi ‘yake’ na kitenzi ‘ameahidi’ vinamrejelea Mungu anayetajwa katika muktadha uliotangulia.
  alternative: Kutumia muundo usioonyesha wazi mhusika binafsi wa sauti na ahadi.
  rationale: Kiwakilishi husishi cha Kigiriki na nukuu kutoka Hagai zinaonyesha kwamba Mungu ndiye mwenye sauti na mtoa ahadi, bila kuhitaji kuongeza jina lake ndani ya aya.
- issue: Wigo wa lugha ya dunia na mbingu
  choice: Kutafsiri γῆ na οὐρανός kuwa ‘dunia’ na ‘mbingu.’
  alternative: Kutafsiri kuwa ‘nchi’ na ‘anga.’
  rationale: Jozi hii inaonyesha wigo mpana wa uumbaji na inahifadhi mvutano wa kinabii bila kufafanua namna mtikiso utakavyotokea.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio umefanywa kuwa wa asili kwa Kiswahili huku tofauti ya ‘wakati ule’ na ‘sasa,’ pamoja na jozi ya ‘dunia’ na ‘mbingu,’ ikihifadhiwa.
