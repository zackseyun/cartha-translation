  text: καὶ ἐκλέλησθε τῆς παρακλήσεως, ἥτις ὑμῖν ὡς υἱοῖς διαλέγεται, Υἱέ μου, μὴ ὀλιγώρει παιδείας κυρίου, μηδὲ ἐκλύου ὑπ’ αὐτοῦ ἐλεγχόμενος·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/005.yaml
  text: 'And you have forgotten the exhortation that addresses you as sons: “My son[a], do not regard lightly the Lord’s discipline[c][b], nor lose heart when you are reproved by him.”'
translation:
  language: sw
  text: 'Nanyi mmelisahau lile neno la kuwatia moyo linalowahutubia ninyi kama wana: “Mwanangu,[a] usidharau nidhamu ya Bwana,[b][c] wala usikate tamaa unapokaripiwa naye.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Mtoto wangu.” Kigiriki kinasema “mwana,” kikifuata maneno ya Mithali na lugha ya wana katika kifungu hiki.
    reason: lexical_alternative
  - marker: b
    text: “Nidhamu” inaweza pia kueleweka kuwa “mafunzo,” “malezi,” au “marekebisho,” si adhabu tu.
    reason: lexical_alternative
  - marker: c
    text: Nukuu au dokezo kutoka Mithali 3:11.
    reason: cross_reference
lexical_decisions:
- source_word: ἐκλέλησθε
  choice: mmelisahau
  rationale: Wakati timilifu unaonyesha hali ya sasa iliyotokana na kusahau; “mmelisahau” ni ya kawaida na inadumisha nguvu ya karipio.
- source_word: παρακλήσεως
  choice: neno la kuwatia moyo
  rationale: Neno hili linaweza kumaanisha himizo, faraja, au kutia moyo. Katika muktadha huu linatanguliza onyo lenye kusudi la kuimarisha, hivyo usemi huu unabeba pande zote bila kuwa wa kitaalamu mno.
- source_word: ἥτις ... διαλέγεται
  choice: linalosema nanyi
  rationale: Huwasilisha kwa Kiswahili cha kawaida wazo la Maandiko kuzungumza moja kwa moja na wasikilizaji.
- source_word: ὡς υἱοῖς
  choice: kama wana
  rationale: Hudumisha lugha ya wazi ya kiume katika Kigiriki na uhusiano wake na hoja ya uwana katika kifungu hiki.
- source_word: Υἱέ μου
  choice: Mwanangu
  rationale: Ni mwito wa umoja unaomaanisha “mwanangu”; unahifadhi maneno na mwangwi wa Mithali 3:11.
- source_word: ὀλιγώρει
  choice: usidharau
  rationale: Kitenzi kinamaanisha kuona kuwa jambo halina uzito au kulipuuzia; “usidharau” ni kifupi, cha asili, na kina nguvu inayofaa katika onyo.
- source_word: παιδείας
  choice: nidhamu
  rationale: “Nidhamu” inaweza kujumuisha mafunzo ya malezi pamoja na marekebisho, bila kuifanya iwe adhabu pekee.
- source_word: κυρίου
  choice: ya Bwana
  rationale: Huhifadhi uhusiano wa umilikaji wa genitivi na tafsiri ya kawaida ya κύριος kuwa “Bwana.”
- source_word: ἐκλύου
  choice: usikate tamaa
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha kulegea moyo au kuvunjika moyo chini ya marekebisho.
- source_word: ἐλεγχόμενος
  choice: unapokaripiwa
  rationale: Huwasilisha wazo la kukemewa au kuonyeshwa kosa katika muktadha wa nidhamu, bila kupunguza maana kuwa mafundisho tu.
theological_decisions:
- issue: Lugha ya uwana yenye jinsia katika himizo
  choice: “wana” / “Mwanangu” katika matini kuu
  alternative: “watoto” / “Mtoto wangu”
  rationale: Kigiriki kinatumia wazi lugha ya wana, ikinukuu Mithali na kuhusiana na hoja ya uwana katika Waebrania. Tanbihi inafafanua kuwa matumizi hayo yanawahusu watoto wa Mungu kwa uwakilishi bila kufuta umbo la chanzo.
- issue: Maana ya παιδεία katika uhusiano wa Mungu na watu wake
  choice: “nidhamu”
  alternative: “mafunzo,” “malezi,” au “marekebisho”
  rationale: Neno linaweza kujumuisha mafunzo ya kulea na pia marekebisho yenye kuumiza. “Nidhamu” inadumisha upana na mvutano huo badala ya kulifanya adhabu pekee au elimu tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “linalosema nanyi” ni wa kawaida na unaonyesha Maandiko yakizungumza moja kwa moja. Alama za tanbihi zote zimewekwa katika matini kuu, na mpangilio [b][c] unaweka maelezo ya neno “nidhamu” karibu na neno lenyewe.
