  yaml_path: translation/nt/hebrews/012/006.yaml
  text: For the Lord disciplines the one he loves[b][a], and he scourges every son whom he receives.
translation:
  language: sw
  text: Kwa maana Bwana humwadibisha yule anayempenda, naye humpiga kwa mjeledi[a] kila mwana[b] anayemkubali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “humpiga mijeledi.” Kitenzi cha Kigiriki ni kikali na kinaonyesha nidhamu kali.
    reason: lexical_alternative
  - marker: b
    text: “Kila mwana” linafuata maneno ya Kigiriki; katika muktadha huu usemi huo unawakilisha wote ambao Mungu anawatambua kuwa watoto wake.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃν
  choice: yule ... anayem-
  rationale: Kiwakilishi cha uhusiano kinatoa kauli ya jumla yenye rejeo la mtu mmoja; muundo huu ni wa kawaida katika Kiswahili na unahifadhi uhusiano wa vifungu vyote viwili.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Kiunganishi hiki kinatoa sababu ya himizo lililotangulia; “Kwa maana” kinaonyesha wazi uhusiano huo.
- source_word: ἀγαπᾷ
  choice: anayempenda
  rationale: Hii ni tafsiri ya kawaida na ya asili ya kitenzi kinachoeleza upendo.
- source_word: κύριος
  choice: Bwana
  rationale: Inahifadhi cheo cha kitheolojia kwa lugha ya kawaida ya Biblia ya Kiswahili.
- source_word: παιδεύει
  choice: humwadibisha
  rationale: “Kuadibisha” hapa hujumuisha marekebisho na malezi yenye kusudi, si adhabu tupu.
- source_word: μαστιγοῖ
  choice: humpiga kwa mjeledi
  rationale: Kirai hiki kinahifadhi ukali halisi wa kitenzi cha Kigiriki, ambacho humaanisha kupiga kwa mjeledi, bila kulainisha sitiari.
- source_word: δὲ
  choice: naye
  rationale: Hiki kinaunganisha kifungu cha pili kwa mwendelezo wa kawaida kuliko kuonyesha upinzani mkali.
- source_word: πάντα υἱὸν
  choice: kila mwana
  rationale: Inahifadhi nomino ya kiume ya umoja na taswira ya uana iliyo muhimu katika muktadha; matumizi yake hapa yanawakilisha watoto wote wa Mungu.
- source_word: παραδέχεται
  choice: anayemkubali
  rationale: “Kukubali” huonyesha kumpokea mtu kwa ridhaa na kumtambua kuwa wake, kwa Kiswahili cha sasa na kinachoeleweka.
theological_decisions:
- issue: Tafsiri ya υἱός katika muktadha wa nidhamu ya Mungu na uana
  choice: kila mwana
  alternative: kila mtoto
  rationale: Matini ya Kigiriki inasema “mwana,” na muktadha wa Waebrania 12 unasisitiza taswira ya uana. Tafsiri kuu haiigeuzi kuwa neno lisilo na jinsia, huku tanbihi ikifafanua nguvu yake ya uwakilishi.
- issue: Ukali wa μαστιγοῖ katika uhusiano na upendo na adibisho la Mungu
  choice: humpiga kwa mjeledi
  alternative: humwadhibu vikali
  rationale: Kitenzi cha chanzo ni kikali na kinataja kupigwa kwa mjeledi. Tafsiri hii inadumisha mvutano uliomo kati ya upendo wa Bwana na adibisho lenye maumivu badala ya kuupunguza.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kimaandiko lakini kinachoeleweka kwa msomaji wa kawaida. “Humwadibisha” huhifadhi upande wa malezi na marekebisho, huku “humpiga kwa mjeledi” ikihifadhi ukali wa sitiari ya chanzo. Alama zote za tanbihi zimewekwa katika matini kuu baada ya vifungu vinavyohusika.
