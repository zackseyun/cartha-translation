id: HEB.12.25
reference: Hebrews 12:25
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Βλέπετε μὴ παραιτήσησθε τὸν λαλοῦντα· εἰ γὰρ ἐκεῖνοι οὐκ ⸀ἐξέφυγον ⸂ἐπὶ γῆς παραιτησάμενοι τὸν⸃ χρηματίζοντα, ⸀πολὺ μᾶλλον ἡμεῖς οἱ τὸν ἀπ’ οὐρανῶν ἀποστρεφόμενοι·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/025.yaml
  text: See to it that you do not refuse the one who is speaking[a]. For if those did not escape when they refused the one who warned them on earth[b], much less will we if we turn away from the one who warns from heaven.
translation:
  language: sw
  text: Angalieni msije mkamkataa yule anayesema. Kwa maana, ikiwa wale hawakuponyoka walipomkataa yule aliyetoa onyo la Mungu duniani[a], sembuse sisi tukimwacha yule asemaye kutoka mbinguni![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “yule aliyetoa maelekezo ya Mungu duniani.” Kitenzi cha Kigiriki kinaweza kumaanisha kutoa maelekezo au onyo lenye mamlaka ya Mungu.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “zaidi sana sisi, wale tunaogeuka kutoka kwa yule wa mbinguni.” Kitenzi “kuponyoka” kinadokezwa kutokana na sehemu iliyotangulia.
    reason: lexical_alternative
lexical_decisions:
- source_word: Βλέπετε
  choice: Angalieni
  rationale: Amri ya wingi yenye nguvu ya onyo na himizo; ni Kiswahili cha kawaida na chenye hadhi.
- source_word: μὴ παραιτήσησθε
  choice: msije mkamkataa
  rationale: Muundo huu huwasilisha onyo la kutofanya jambo na maana ya kukataa, huku ukidumisha uhusiano na kitenzi kilekile kinachorudiwa baadaye.
- source_word: τὸν λαλοῦντα
  choice: yule anayesema
  rationale: Huhifadhi hali endelevu ya kitenzi-shirikishi cha wakati wa sasa bila kutaja moja kwa moja utambulisho wa msemaji.
- source_word: ἐξέφυγον
  choice: hawakuokoka
  rationale: Katika muktadha huu maana ni kutoponyoka hukumu au matokeo; ‘hawakuokoka’ ni usemi wa asili wa Kiswahili kwa kutofanikiwa kuponyoka.
- source_word: ἐπὶ γῆς
  choice: duniani
  rationale: Huhifadhi utofautishaji wa duniani na kutoka mbinguni bila kuingiza Sinai waziwazi.
- source_word: παραιτησάμενοι
  choice: walipomkataa
  rationale: Huwasilisha hali ya wakati ya kitenzi-shirikishi na kurudia mzizi wa maana wa ‘kukataa’ uliotumiwa mwanzoni.
- source_word: χρηματίζοντα
  choice: yule aliyewaonya
  rationale: Katika muktadha huu kitenzi kinaashiria ujumbe au onyo lenye mamlaka ya Mungu; ‘aliyewaonya’ ni wazi na la kawaida, huku kiwakilishi cha watendewa kikidokezwa na muktadha.
- source_word: πολὺ μᾶλλον
  choice: sembuse sisi
  rationale: Katika hoja hasi ya kutoka jambo dogo kwenda kubwa, ‘sembuse’ huonyesha kwa kawaida kuwa sisi tuna uwezekano mdogo zaidi wa kuokoka.
- source_word: ἀποστρεφόμενοι
  choice: tukimgeukia mbali
  rationale: Huwasilisha kugeuka na kumwacha msemaji kama hali ambayo chini yake onyo linawahusu wasomaji, bila kuongeza istilahi ya kimadhehebu.
- source_word: τὸν ἀπ’ οὐρανῶν
  choice: yule anayeonya kutoka mbinguni
  rationale: Hufanya rejeo linalodokezwa kwa msemaji kuwa wazi katika Kiswahili na kudumisha utofautishaji na onyo lililotolewa duniani.
theological_decisions:
- issue: Utambulisho wa anayesema au kuonya
  choice: Kutumia maelezo ya jumla ‘yule anayesema’ na ‘yule anayeonya kutoka mbinguni’ bila kuongeza jina ‘Mungu’ au ‘Kristo’.
  alternative: Kumtaja wazi kuwa Mungu au Kristo.
  rationale: Muktadha unaonyesha usemi wa kimungu, lakini mstari wenyewe hautaji jina au cheo; tafsiri inadumisha mvutano huo.
- issue: Kitenzi kinachodokezwa katika sehemu ya pili
  choice: Kutumia ‘sembuse sisi’ huku maana ya ‘hatutaokoka’ ikiachwa ieleweke kutoka kishazi kilichotangulia na kufafanuliwa katika tanbihi.
  alternative: Kuongeza wazi ‘sisi hatutaokoka’ katika matini kuu.
  rationale: Muundo huu ni wa asili katika Kiswahili na kwa kiasi kikubwa huhifadhi ufupisho wa Kigiriki bila kuficha mantiki ya onyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Angalieni’ na ‘sembuse’ ni maneno yanayoeleweka kwa wasomaji wa kawaida; muundo unadumisha onyo kali, utofautishaji wa duniani na mbinguni, na utambulisho usiotajwa wazi wa msemaji.
