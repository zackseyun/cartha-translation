  text: ἀλλὰ προσεληλύθατε Σιὼν ὄρει καὶ πόλει θεοῦ ζῶντος, Ἰερουσαλὴμ ἐπουρανίῳ, καὶ μυριάσιν ἀγγέλων, πανηγύρει
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/022.yaml
  text: But you have come to Mount Zion and to the city of the living God[a], the heavenly Jerusalem, and to myriads of angels in festal gathering[b],
translation:
  language: sw
  text: Lakini mmeufikia Mlima Sayuni na mji wa Mungu aliye hai, Yerusalemu wa mbinguni, na makumi ya maelfu ya malaika katika kusanyiko la sherehe.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na makumi ya maelfu ya malaika, na kusanyiko la sherehe.” Muundo wa Kigiriki unaweza kuhusisha “kusanyiko la sherehe” na “malaika” au kulifanya kuwa kipengele tofauti katika orodha.
    reason: alternative_reading
  - marker: b
    text: Kirai “makumi ya maelfu” kinaweza kumaanisha makumi ya maelfu kihalisi au, kwa ujumla zaidi, umati usiohesabika.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Lakini
  rationale: Inaonyesha utofautishaji wenye nguvu na Mlima Sinai katika muktadha uliotangulia, kwa namna ya kawaida na wazi katika Kiswahili.
- source_word: προσεληλύθατε
  choice: mmeufikia
  rationale: Kauli timilifu ya Kigiriki inaonyesha tendo la kufika ambalo matokeo yake yanaendelea kuwapo; umbo la wakati timilifu katika Kiswahili linahifadhi maana hiyo.
- source_word: Σιὼν ὄρει
  choice: Mlima Sayuni
  rationale: Hili ndilo umbo la kawaida la jina hilo katika Kiswahili, huku taswira ya mlima ikihifadhiwa.
- source_word: πόλει θεοῦ ζῶντος
  choice: mji wa Mungu aliye hai
  rationale: Huhifadhi uhusiano wa umilikaji na sifa yenye uzito ya Mungu kuwa hai.
- source_word: Ἰερουσαλὴμ ἐπουρανίῳ
  choice: yaani Yerusalemu wa mbinguni
  rationale: Kirai hiki kinafafanua mji wa Mungu aliye hai; “yaani” huweka uhusiano huo wazi bila kubadili maana.
- source_word: μυριάσιν ἀγγέλων
  choice: makumi ya maelfu ya malaika
  rationale: Huwasilisha idadi kubwa sana inayodokezwa na μυριάς bila kuilazimisha kuwa hesabu kamili; uwezekano wa maana ya umati usiohesabika unaelezwa katika tanbihi.
- source_word: πανηγύρει
  choice: waliokusanyika kwa shangwe
  rationale: Hutoa kwa Kiswahili cha asili wazo la kusanyiko la sikukuu lenye furaha, na katika matini kuu linahusishwa na malaika.
theological_decisions:
- issue: Uhusiano wa kisintaksia wa πανηγύρει
  choice: Kuhusisha “kusanyiko la shangwe” na makumi ya maelfu ya malaika.
  alternative: 'Kulichukua kama kipengele kipya katika orodha: “na makumi ya maelfu ya malaika, na kusanyiko la shangwe.”'
  rationale: Dativi zinazofuatana katika Kigiriki huruhusu miundo yote miwili. Kuihusisha na malaika waliotajwa mara moja kabla hutoa maana yenye mshikamano, lakini utata halisi umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Mmeufikia” huhifadhi nguvu ya wakati timilifu; “waliokusanyika kwa shangwe” ni ya asili kuliko tafsiri nomino nzito. Alama zote za tanbihi zimewekwa baada ya kirai kinachohusika.
