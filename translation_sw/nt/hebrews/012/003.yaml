  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἀναλογίσασθε γὰρ τὸν τοιαύτην ὑπομεμενηκότα ὑπὸ τῶν ἁμαρτωλῶν εἰς ⸀ἑαυτοὺς ἀντιλογίαν, ἵνα μὴ κάμητε ταῖς ψυχαῖς ὑμῶν ἐκλυόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/003.yaml
  text: For consider the one who endured such opposition from sinners against himself[a], so that you may not grow weary[b], becoming discouraged in your souls.
translation:
  language: sw
  text: Kwa maana, mtafakarini kwa makini yeye aliyestahimili upinzani wa namna hiyo kutoka kwa wenye dhambi dhidi yao wenyewe[a], ili msije mkachoka na kukata tamaa katika nafsi zenu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati zina “dhidi yake mwenyewe.” Maandishi ya SBLGNT yanasema “dhidi yao wenyewe.” Katika muktadha, upinzani huo ulimlenga Yesu.
    reason: textual_variant
  - marker: b
    text: Au, “msije mkachoka, mkizimia katika nafsi zenu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναλογίσασθε
  choice: mfikirieni sana
  rationale: Amri hii inataka wasomaji watafakari kwa makini na kwa makusudi; usemi huu ni wa kawaida na unahifadhi nguvu ya himizo.
- source_word: τοιαύτην
  choice: mkubwa namna hiyo
  rationale: Katika muktadha, neno hili linaeleza upinzani wa aina au kiwango kilichotajwa; Kiswahili hiki kinawasilisha msisitizo bila kuufafanua kupita kiasi.
- source_word: ὑπομεμενηκότα
  choice: aliyestahimili
  rationale: Kitenzi hiki huonyesha kuvumilia chini ya hali ngumu; 'aliyestahimili' ni cha asili na kinafaa kwa mateso ya Yesu katika muktadha.
- source_word: ἁμαρτωλῶν
  choice: wenye dhambi
  rationale: Hili ni kivumishi kilichotumiwa kama nomino kwa watu wenye sifa ya dhambi; 'wenye dhambi' ni wazi na chenye heshima.
- source_word: εἰς ἑαυτοὺς ἀντιλογίαν
  choice: upinzani ... dhidi yao wenyewe
  rationale: ἀντιλογία hapa ni upinzani au uhasama. Rasimu inafuata usomaji wa SBLGNT, ἑαυτούς ('wao wenyewe'), na tanbihi inaeleza usomaji mwingine pamoja na maana inayodokezwa na muktadha.
- source_word: κάμητε
  choice: msichoke
  rationale: Kitenzi hiki humaanisha kuchoka au kulegea; 'msichoke' ni kifupi, cha kawaida, na kinafaa kwa himizo.
- source_word: ταῖς ψυχαῖς ὑμῶν
  choice: mioyoni mwenu
  rationale: ψυχή hapa hurejelea nafsi au maisha ya ndani. 'Mioyoni mwenu' ni usemi wa kawaida wa Kiswahili unaowasilisha maana hiyo ya ndani bila kudokeza uchovu wa mwili pekee.
- source_word: ἐκλυόμενοι
  choice: kukata tamaa
  rationale: Kishiriki hiki kinaeleza kulegea au kuzimia moyo kunakoandamana na uchovu; 'kukata tamaa' ni Kiswahili cha sasa na kinachofahamika.
theological_decisions:
- issue: Mrejelewa wa 'yeye'
  choice: Usemi huo unamrejelea Yesu bila kurudia jina lake katika mstari huu.
  alternative: Kutaja wazi 'Yesu'.
  rationale: Muktadha wa karibu katika Waebrania 12:2 unamtambulisha Yesu, lakini kuhifadhi kiwakilishi kunafuata muundo wa Kigiriki bila kuongeza jina.
- issue: Kiwakilishi katika εἰς ἑαυτούς
  choice: 'Maandishi makuu yanafuata SBLGNT: ''dhidi yao wenyewe.'''
  alternative: '''Dhidi yake mwenyewe,'' yaani dhidi ya Yesu.'
  rationale: SBLGNT ina wingi ἑαυτούς, ingawa usomaji wa umoja ἑαυτόν unashuhudiwa na unaendana moja kwa moja na upinzani ulioelekezwa kwa Yesu. Tofauti hiyo imehifadhiwa badala ya kutatuliwa kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa himizo umehifadhiwa, huku tofauti halisi ya maandishi katika kiwakilishi ikionyeshwa wazi katika maandishi makuu na tanbihi.
