base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/010.yaml
  text: For they disciplined us for a few days as seemed best to them[a], but he does so for our benefit[b], so that we may share in his holiness.
translation:
  language: sw
  text: Kwa maana wao walikuwa wakitupa nidhamu kwa siku chache[a], kulingana na walivyoona inafaa[b]; lakini yeye hututia nidhamu kwa faida yetu, ili tushiriki utakatifu wake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa muda mfupi.” Maneno ya Kigiriki yanakazia muda wenye kikomo wa nidhamu ya baba wa kibinadamu, tofauti na kusudi la Mungu lenye kudumu.
    reason: lexical_alternative
  - marker: b
    text: Au, “kulingana na yale waliyoona kuwa yanafaa.”
    reason: alternative_reading
lexical_decisions:
- source_word: πρὸς ὀλίγας ἡμέρας
  choice: kwa siku chache
  rationale: Huhifadhi picha ya Kigiriki ya “siku chache” na mkazo wake juu ya muda mfupi wa nidhamu ya baba wa kibinadamu; tanbihi inaonyesha maana ya kinahau “kwa muda mfupi.”
- source_word: κατὰ τὸ δοκοῦν αὐτοῖς
  choice: kulingana na walivyoona inafaa
  rationale: Huonyesha kwamba baba wa kibinadamu walitenda kwa kadiri ya uamuzi wao wenyewe, bila kudai kwamba uamuzi wao ulikuwa sahihi kabisa.
- source_word: ἐπαίδευον
  choice: walitutia nidhamu
  rationale: “Kuwaweka/kutia nidhamu” hubeba wazo la malezi, mafunzo na marekebisho ya mzazi, si adhabu peke yake. Kirejeshi cha nafsi “-tu-” kinatokana na muktadha wa karibu.
- source_word: ὁ δὲ
  choice: lakini yeye hututia nidhamu
  rationale: Kiwakilishi kinamhusu Mungu katika muktadha. Kitenzi kilichodokezwa katika Kigiriki kimerudiwa kwa Kiswahili ili sentensi iwe wazi na ya kawaida bila kuongeza jina “Mungu.”
- source_word: ἐπὶ τὸ συμφέρον
  choice: kwa faida yetu
  rationale: Hueleza kusudi la nidhamu ya Mungu kuwa kile kinachotunufaisha, kwa lugha ya sasa na iliyo wazi.
- source_word: εἰς τὸ μεταλαβεῖν
  choice: ili tushiriki
  rationale: Muundo wa “ili” huhifadhi maana ya kusudi, na “kushiriki” huwasilisha wazo la kuwa na sehemu katika jambo.
- source_word: τῆς ἁγιότητος αὐτοῦ
  choice: utakatifu wake
  rationale: Huhifadhi sifa ya utakatifu kuwa ya Mungu na wazo kwamba waamini wanashiriki ndani yake, bila kufafanua utaratibu wa kiteolojia ambao mstari wenyewe hauuelezi.
theological_decisions:
- issue: Mhusika wa umoja katika ὁ δὲ
  choice: Kumrejelea Mungu kwa kiwakilishi “yeye.”
  alternative: Kutaja wazi “Mungu.”
  rationale: Muktadha wa Waebrania 12:5–11 unaonyesha wazi tofauti kati ya baba wa kibinadamu na Mungu kama Baba. Kiwakilishi huhifadhi udokezi wa Kigiriki.
- issue: Maana ya kushiriki utakatifu wake
  choice: Kusema “ili tushiriki utakatifu wake” bila kuainisha jinsi ushiriki huo unavyotokea.
  alternative: Kuufafanua kuwa hadhi ya utakatifu pekee au mchakato wa kuendelea kutakaswa pekee.
  rationale: Andiko linaeleza kusudi la nidhamu ya Mungu kuwa kushiriki utakatifu wake, lakini halibainishi hapa mfumo maalumu wa utakaso; tafsiri inahifadhi uzito na mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Kutia nidhamu” limetumiwa ili kujumuisha malezi na marekebisho badala ya kudokeza adhabu pekee; muundo wa sentensi umehifadhi tofauti kati ya baba wa kibinadamu na Mungu.
