id: HEB.12.16
reference: Hebrews 12:16
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: μή τις πόρνος ἢ βέβηλος ὡς Ἠσαῦ, ὃς ἀντὶ βρώσεως μιᾶς ἀπέδετο τὰ πρωτοτόκια ⸀ἑαυτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/016.yaml
  text: that no one be sexually immoral or godless like Esau, who sold his own birthright for a single meal.
translation:
  language: sw
  text: Asiwepo mtu yeyote mwasherati au asiyeheshimu mambo matakatifu kama Esau, ambaye aliuza haki yake ya mzaliwa wa kwanza kwa mlo mmoja.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πόρνος
  choice: mwasherati
  rationale: Neno hili linaonyesha mtu anayefanya uasherati; tafsiri hii ni ya kawaida, yenye uzito, na haipanui maana kuliko ushahidi wa Kigiriki.
- source_word: βέβηλος
  choice: asiyeheshimu mambo matakatifu
  rationale: βέβηλος kimsingi humaanisha asiye mtakatifu au anayoyachukulia mambo matakatifu kuwa ya kawaida. Kauli hii inaeleza maana hiyo kwa Kiswahili cha sasa bila kuifanya iwe madai mapana kwamba mtu huyo hana Mungu.
- source_word: βρώσεως μιᾶς
  choice: mlo mmoja
  rationale: Ingawa βρῶσις inaweza kumaanisha chakula au tendo la kula, katika muktadha huu mlo mmoja ni usemi wa asili unaosisitiza thamani ndogo ya kile alichopokea.
- source_word: τὰ πρωτοτόκια ἑαυτοῦ
  choice: haki yake ya mzaliwa wa kwanza
  rationale: Wingi wa Kigiriki πρωτοτόκια hutaja hadhi na haki zinazohusiana na kuwa mzaliwa wa kwanza; Kiswahili huieleza kwa umoja wa dhana.
- source_word: ἀπέδετο
  choice: aliuza
  rationale: Kitenzi hiki humaanisha kuuza; wakati uliopita unafaa simulizi la tendo la Esau.
theological_decisions:
- issue: Maana ya βέβηλος kuhusu Esau
  choice: asiyeheshimu mambo matakatifu
  alternative: asiye na Mungu
  rationale: Tafsiri iliyochaguliwa huhifadhi wazo la kudharau au kuyafanya ya kawaida mambo yenye thamani takatifu, hasa haki ya mzaliwa wa kwanza. ‘Asiye na Mungu’ inaweza kudokeza dai pana zaidi kuhusu imani ya Esau kuliko neno lenyewe linavyolazimisha.
- issue: Uhusiano wa ‘mwasherati’ na Esau
  choice: Kudumisha sarufi yenye sifa mbili chini ya onyo moja bila kueleza kwamba zote lazima zimfafanue Esau kwa kiwango sawa
  alternative: Kuongeza ufafanuzi unaomtenga Esau na uasherati
  rationale: Kigiriki μή τις πόρνος ἢ βέβηλος ὡς Ἠσαῦ kinaweza kusomwa huku ‘kama Esau’ kikihusishwa hasa na βέβηλος, lakini hakitoi msingi wa kuongeza ufafanuzi ndani ya aya. Muundo wa Kiswahili huhifadhi mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo wa onyo umewekwa wazi na wa moja kwa moja; hakuna alama za tanbihi kwa kuwa hakuna tanbihi iliyohitajika.
