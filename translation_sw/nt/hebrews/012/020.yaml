base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/020.yaml
  text: 'For they could not endure what was being commanded: “If even an animal touches the mountain[a], it will be stoned.”'
translation:
  language: sw
  text: 'Kwa maana hawakuweza kustahimili amri iliyotolewa: “Hata mnyama akiugusa mlima[a], atapigwa mawe.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati zinaongeza, “au atapigwa kwa mshale,” kwa mwangwi wa Kutoka 19:12–13.
    reason: textual_variant
lexical_decisions:
- source_word: οὐκ ἔφερον
  choice: hawakuweza kustahimili
  rationale: Katika muktadha huu, kitenzi φέρω pamoja na ukanushi kina maana ya kuweza kuvumilia au kustahimili; tafsiri hii inaonyesha kutoweza kwao kuikabili amri hiyo.
- source_word: γὰρ
  choice: Kwa maana
  rationale: γάρ inaeleza sababu ya kauli iliyotangulia; “Kwa maana” inadumisha uhusiano huo kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: τὸ διαστελλόμενον
  choice: amri iliyotolewa
  rationale: Kirai hiki kinarejelea agizo lenye mamlaka. “Amri iliyotolewa” ni ya asili katika Kiswahili na inadumisha hali ya kutendwa bila kuongeza maelezo yasiyokuwamo.
- source_word: Κἂν
  choice: Hata ... aki-
  rationale: κἄν huanzisha sharti lenye msisitizo; muundo “Hata mnyama aki-” unaonyesha kwamba hata mnyama hakuruhusiwa kuugusa mlima.
- source_word: θηρίον
  choice: mnyama
  rationale: θηρίον inaweza kumaanisha mnyama au mnyama wa porini; “mnyama” haibani maana kwa wanyama wa porini pekee na inafaa katika muktadha huu.
- source_word: θίγῃ
  choice: akiugusa
  rationale: 'Muundo wa sharti wa Kiswahili wenye kiambishi -ki- unawakilisha vizuri aoristi tegemezi katika kishazi hiki: “akiugusa.” Kiambishi -u- kinarejelea mlima.'
- source_word: τοῦ ὄρους
  choice: mlima
  rationale: Kigiriki kinasema tu “mlima”; ingawa muktadha unaonyesha Sinai, tafsiri haiongezi jina ambalo halipo katika mstari huu.
- source_word: λιθοβοληθήσεται
  choice: atapigwa mawe
  rationale: Tafsiri hii ya kawaida inadumisha wakati ujao na hali ya kutendwa ya kitenzi, ikimaanisha kuuawa kwa kumpiga mawe bila kutumia lugha ya kizamani.
theological_decisions:
- issue: Uhusiano wa nukuu hii na amri ya Sinai
  choice: Nukuu imetafsiriwa kulingana na maandishi ya SBLGNT na inaishia kwa “atapigwa mawe.”
  alternative: Kuongeza “au kupigwa mshale,” kama ilivyo katika baadhi ya hati na kwa mwangwi wa Kutoka 19:12–13.
  rationale: Maandishi yaliyotolewa hayana nyongeza hiyo. Tafsiri haioanishi kimyakimya na mapokeo mengine ya maandishi, bali inaweka tofauti hiyo katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo “Hata mnyama akiugusa mlima” ni wa asili na huhifadhi msisitizo wa sharti la Kigiriki.
