id: HEB.12.1
reference: Hebrews 12:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Τοιγαροῦν καὶ ἡμεῖς, τοσοῦτον ἔχοντες περικείμενον ἡμῖν νέφος μαρτύρων, ὄγκον ἀποθέμενοι πάντα καὶ τὴν εὐπερίστατον ἁμαρτίαν, δι’ ὑπομονῆς τρέχωμεν τὸν προκείμενον ἡμῖν ἀγῶνα,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/001.yaml
  text: Therefore[a], since we also have so great a cloud of witnesses surrounding us, laying aside every weight and the sin that so easily entangles, let us run with endurance the race set before us,
translation:
  language: sw
  text: Kwa hiyo, sisi pia, tukiwa na wingu kubwa sana la mashahidi linalotuzunguka, tukiweka kando kila mzigo na dhambi inayotunasa kwa urahisi[a], tukimbie kwa uvumilivu mbio iliyowekwa mbele yetu,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “dhambi inayotushikilia kwa karibu,” au “dhambi inayotutega kwa urahisi.” Kivumishi cha Kigiriki ni adimu na huenda kikasisitiza kunasa, kutega, au kushikilia kwa karibu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοιγαροῦν
  choice: Kwa hiyo
  rationale: Kiunganishi hiki kinaonyesha hitimisho linalotokana na hoja iliyotangulia, hasa mifano ya imani katika sura ya 11.
- source_word: τοσοῦτον ... νέφος μαρτύρων
  choice: wingu kubwa namna hiyo la mashahidi
  rationale: Inahifadhi taswira ya wingu pamoja na msisitizo wa wingi mkubwa wa mashahidi.
- source_word: περικείμενον ἡμῖν
  choice: tunazungukwa na
  rationale: Ni Kiswahili cha kawaida kinachowasilisha kwamba mashahidi wako pande zote kutuzunguka.
- source_word: μαρτύρων
  choice: mashahidi
  rationale: Neno hili linaweza kumaanisha watu wanaotoa ushahidi. Katika muktadha linawarejelea watu wa sura ya 11 ambao maisha yao yanashuhudia imani, bila kuamua kwamba wao ni watazamaji tu wa mbio.
- source_word: ὄγκον πάντα
  choice: kila mzigo
  rationale: Inahifadhi taswira ya uzito au kitu kinachomzuia mkimbiaji, huku ikiwa wazi kwa msomaji wa kawaida.
- source_word: ἀποθέμενοι
  choice: tukishaweka kando
  rationale: Inaonyesha kuondoa kwa makusudi kile kinachozuia kabla ya kuendelea kukimbia, huku ikidumisha uhusiano wake na himizo kuu.
- source_word: εὐπερίστατον
  choice: inayotunasa kwa urahisi
  rationale: Kivumishi hiki ni adimu na maana yake inajadiliwa. Chaguo hili linafaa taswira ya mbio na linaeleza wazi hatari ya dhambi kuwa kizuizi; maana nyingine zimehifadhiwa katika tanbihi.
- source_word: ἁμαρτίαν
  choice: dhambi
  rationale: Kiswahili hakihitaji kibainishi kinacholingana moja kwa moja na άρθρο ya Kigiriki. Chaguo hili linaitaja dhambi kama uhalisi unaozuia bila kudai kuwa ni dhambi moja maalumu iliyotajwa.
- source_word: δι’ ὑπομονῆς
  choice: kwa uvumilivu
  rationale: Inawasilisha ustahimilivu thabiti wakati wa taabu na inafaa himizo la kuendelea katika mbio.
- source_word: τρέχωμεν
  choice: tukimbie
  rationale: Ni himizo la nafsi ya kwanza wingi, linalolingana moja kwa moja na matumizi ya subjunctive ya Kigiriki.
- source_word: τὸν προκείμενον ἡμῖν ἀγῶνα
  choice: mbio zilizowekwa mbele yetu
  rationale: Ingawa ἀγών inaweza kuwa shindano au pambano, kitenzi ‘kukimbia’ kinafanya ‘mbio’ kuwa chaguo linalofaa zaidi hapa. ‘Zilizowekwa mbele yetu’ inahifadhi wazo la njia au kazi tuliyoandaliwa.
theological_decisions:
- issue: Maana ya ‘mashahidi’ kuhusiana na Waebrania 11
  choice: Watu ambao maisha yao yanashuhudia imani, huku taswira ya kutuzunguka ikichangia himizo
  alternative: Kimsingi ni watazamaji wa mbinguni wanaowaangalia waamini wakikimbia
  rationale: Muktadha wa karibu unarejelea mifano ya sura ya 11, ambao walishuhudia kwa imani na uvumilivu wao. Tafsiri inadumisha neno ‘mashahidi’ bila kuamua kwamba wanatazama mbio moja kwa moja, hivyo inaacha mvutano wa kifafanuzi uliomo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini kinachoeleweka kwa urahisi. Taswira za wingu, mzigo na mbio zimehifadhiwa. Alama ya tanbihi [a] imewekwa baada ya kirai kinachohusika moja kwa moja.
