  text: Bado hamjapinga hadi kufikia kumwagika kwa damu katika mapambano yenu dhidi ya dhambi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno kwa neno, Kigiriki husema, “bado hamjapinga hadi damu.” Huu ni usemi unaomaanisha kupinga hadi kufikia kumwagika kwa damu.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὔπω
  choice: Bado hamja-
  rationale: Kielezi hiki kinaonyesha kuwa mpaka unaotajwa haujafikiwa; muundo wa Kiswahili “bado hamja-” ni wa kawaida na sahihi.
- source_word: μέχρις αἵματος
  choice: mpaka kumwaga damu
  rationale: Huu ni usemi unaoonyesha kupinga hadi kiwango cha damu kumwagika, yaani kujeruhiwa vibaya au kuuawa. Tafsiri hii ni ya asili kwa Kiswahili kuliko “mpaka damu” huku ikihifadhi maana ya msingi.
- source_word: ἀντικατέστητε
  choice: hamjapinga
  rationale: Kitenzi kina maana ya kusimama dhidi ya kitu au kukipinga; “kupinga” kinafaa katika muktadha wa ushindani na mapambano.
- source_word: πρὸς τὴν ἁμαρτίαν
  choice: dhidi ya dhambi
  rationale: πρός pamoja na hali ya accusative hapa huonyesha upinzani. “Dhidi ya dhambi” ni usemi wa kawaida unaohifadhi kitu kinachopingwa bila kukifafanua zaidi.
- source_word: ἀνταγωνιζόμενοι
  choice: katika mapambano yenu
  rationale: Neno hili la mazingira ya mashindano au vita linaonyesha tendo linaloendelea na namna ya kupinga; “katika mapambano yenu” linasomeka kwa urahisi na kuhifadhi taswira hiyo.
theological_decisions:
- issue: Kinachorejelewa na “dhambi” katika muktadha
  choice: Kutafsiri kwa ujumla kuwa “dhambi” bila kubainisha zaidi
  alternative: Upinzani wenye dhambi wa watesi; dhambi kwa ujumla; kishawishi cha kuiacha imani
  rationale: Muktadha unahusu kuvumilia uadui na kukataa dhambi, lakini aya yenyewe haifafanui dhambi inayokusudiwa. Tafsiri pana huhifadhi utata na mvutano wa kiteolojia wa maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi, kinachoeleweka kwa wasomaji wa kawaida. Muundo umehifadhi taswira ya mapambano bila kufafanua dhambi au aina ya mateso kupita maandishi ya Kigiriki.
