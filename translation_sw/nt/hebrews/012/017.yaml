  text: ἴστε γὰρ ὅτι καὶ μετέπειτα θέλων κληρονομῆσαι τὴν εὐλογίαν ἀπεδοκιμάσθη, μετανοίας γὰρ τόπον οὐχ εὗρεν, καίπερ μετὰ δακρύων ἐκζητήσας αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/017.yaml
  text: For you know that afterward[a], when he wanted to inherit the blessing, he was rejected, for he found no opportunity for repentance[b], though he sought it with tears.
translation:
  language: sw
  text: Kwa maana mnajua kwamba baadaye, alipotaka kuirithi ile baraka, alikataliwa, kwa sababu hakupata nafasi ya kutubu[a], ingawa aliitafuta kwa machozi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hakupata nafasi ya kubadili nia.” Hii yaweza kumaanisha kwamba hakupata nafasi ya kubadili matokeo, au kwamba hakufanikiwa kumfanya Isaka abadili nia yake.
    reason: alternative_reading
  - marker: b
    text: Neno “aliitafuta” laweza kurejelea “baraka,” au, kwa uwezekano mdogo zaidi, “toba/nafasi.” Kiyunani hakionyeshi wazi kirejelewa chake.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἴστε
  choice: mnajua
  rationale: Kitenzi hiki kina maana ya wakati wa sasa na kinawakumbusha wasomaji jambo wanalolijua tayari.
- source_word: μετέπειτα
  choice: baadaye
  rationale: Ni kielezi cha wakati kinachoonyesha jambo lililotokea baada ya matendo yaliyotangulia.
- source_word: θέλων κληρονομῆσαι
  choice: alipotaka kuurithi
  rationale: Muundo wa kishirikishi umetafsiriwa kwa kishazi cha wakati cha Kiswahili; ‘kuurithi’ inadumisha wazo la kupokea kama urithi.
- source_word: τὴν εὐλογίαν
  choice: ule baraka
  rationale: Kiashiria ‘ule’ kinaelekeza kwenye baraka mahususi ya baba katika simulizi la Esau bila kuipanua maana.
- source_word: ἀπεδοκιμάσθη
  choice: alikataliwa
  rationale: Huwasilisha hali ya kukataliwa bila kuingiza maana maalumu ya kimafundisho isiyolazimishwa na muktadha.
- source_word: μετανοίας ... τόπον
  choice: nafasi ya kutubu
  rationale: Ni Kiswahili cha kawaida kwa nahau ya kupata nafasi au uwezekano wa toba, huku neno la msingi la kutubu likihifadhiwa.
- source_word: καίπερ μετὰ δακρύων ἐκζητήσας αὐτήν
  choice: ingawa aliitafuta kwa machozi
  rationale: ‘Ingawa’ huhifadhi maana ya concessive, na ‘aliitafuta’ huacha kisichotajwa wazi kile kinachorejelewa na kiwakilishi, kadiri Kiswahili kinavyoruhusu.
theological_decisions:
- issue: Kirejelewa cha αὐτήν na maana ya μετανοίας τόπον
  choice: Maandishi makuu yanasema ‘nafasi ya kutubu’ na ‘aliitafuta,’ huku maelezo ya chini yakihifadhi uwezekano tofauti.
  alternative: Kusema wazi kwamba Esau aliitafuta baraka, au kwamba hakufanikiwa kumfanya Isaka abadili nia yake.
  rationale: 'Kiyunani kina utata halisi: αὐτήν yaweza kurejelea baraka au toba, na ‘nafasi ya toba’ yaweza kueleweka kama nafasi ya kubadili matokeo au mabadiliko ya nia ya Isaka. Tafsiri haipaswi kuamua jambo ambalo chanzo hakikuliamua wazi.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Kwa maana’ kinaunganisha mstari huu na onyo lililotangulia; ‘ule baraka’ ni ya kawaida na inaonyesha baraka mahususi. Alama zote za maelezo ya chini zimewekwa katika maandishi makuu.
