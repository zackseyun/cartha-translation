reference: Hebrews 12:24
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ διαθήκης νέας μεσίτῃ Ἰησοῦ, καὶ αἵματι ῥαντισμοῦ κρεῖττον λαλοῦντι παρὰ τὸν Ἅβελ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/024.yaml
  text: and to Jesus[a], the mediator of a new covenant[b], and to the sprinkled blood that speaks better than Abel.
translation:
  language: sw
  text: na kwa Yesu, mpatanishi wa agano jipya, na kwa damu iliyonyunyizwa[b], inayonena yaliyo bora kuliko Abeli[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuliko damu ya Abeli.” Kigiriki kinasema tu “kuliko Abeli,” huenda kikidokeza damu ya Abeli iliyolia kutoka ardhini (Mwa 4:10).
    reason: alternative_reading
  - marker: b
    text: “Damu iliyonyunyizwa” ni damu ya dhabihu iliyotumiwa kwa kunyunyiza, jambo linalokumbusha kuthibitishwa kwa agano na kutakaswa.
    reason: cultural_note
lexical_decisions:
- source_word: διαθήκης νέας
  choice: agano jipya
  rationale: Neno διαθήκη katika Waebrania lina maana ya agano la kibiblia, si wosia. Kutokuwapo kwa kibainishi katika Kigiriki kunaakisiwa kwa usemi wa kawaida wa Kiswahili bila kulazimisha tofauti kati ya “agano jipya” na “lile agano jipya.”
- source_word: μεσίτῃ
  choice: mpatanishi
  rationale: “Mpatanishi” ni neno la kawaida na lenye hadhi kwa mtu aliye katikati ya pande mbili ili kuleta au kuthibitisha uhusiano wa agano.
- source_word: Ἰησοῦ
  choice: Yesu
  rationale: Hili ndilo umbo sanifu la jina hili katika Kiswahili.
- source_word: αἵματι ῥαντισμοῦ
  choice: damu iliyonyunyizwa
  rationale: Usemi huu unaeleweka kwa urahisi na unadumisha picha ya damu ya dhabihu inayotumiwa kwa kunyunyiza katika kuthibitisha agano na kutakasa.
- source_word: κρεῖττον
  choice: yaliyo bora
  rationale: Hii inawasilisha maana ya “bora zaidi” kwa Kiswahili cha kawaida; “yaliyo” huonyesha kwa kiasi kile ambacho damu inanena bila kufafanua ujumbe wake kupita kiasi.
- source_word: λαλοῦντι
  choice: inayonena
  rationale: Kitenzi cha wakati wa sasa kinahifadhiwa kwa umbo linaloeleza damu kuwa inanena; “kunena” lina hadhi inayofaa bila kuwa gumu kueleweka.
- source_word: παρὰ τὸν Ἅβελ
  choice: kuliko Abeli
  rationale: Kigiriki kinamtaja Abeli mwenyewe, si “damu ya Abeli” waziwazi. Tafsiri fupi inadumisha utata huo wa makusudi.
theological_decisions:
- issue: Kinacholinganishwa na Abeli
  choice: Maandishi makuu yanasema “kuliko Abeli,” kama Kigiriki kilivyo kifupi.
  alternative: “kuliko damu ya Abeli” au “kuliko yale yaliyonenwa na damu ya Abeli”
  rationale: Muktadha unaashiria damu ya Abeli iliyolia kutoka ardhini (Mwa 4:10), lakini chanzo kinamtaja Abeli moja kwa moja. Kutopanua usemi katika maandishi makuu kunadumisha mvutano na utata wa chanzo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo unaendeleza orodha ya muktadha kwa kuanza na “na kwa.” Alama za tanbihi zimewekwa moja kwa moja baada ya vifungu vinavyoelezwa.
