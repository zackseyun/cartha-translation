base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/009.yaml
  text: Furthermore[a], we had our earthly fathers as disciplinarians, and we respected them[c][b]. Shall we not much more submit to the Father of spirits and live?
translation:
  language: sw
  text: Zaidi ya hayo, tulikuwa na baba zetu wa kimwili[a] waliotutia nidhamu, nasi tuliwaheshimu. Je, si zaidi sana tutajitiisha kwa Baba wa roho[b], nasi tutaishi?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tafsiri ya neno kwa neno: “baba wa mwili wetu.”'
    reason: lexical_alternative
  - marker: b
    text: “Baba wa roho” huenda ikamaanisha hasa Baba wa roho zetu, kwa utofautisho na baba zetu wa kimwili; lakini usemi wa Kiyunani una maana pana zaidi.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶτα
  choice: Zaidi ya hayo
  rationale: Katika muktadha huu neno linaongeza hoja nyingine katika ulinganisho wa kutoka lililo dogo kwenda lililo kubwa, wala halionyeshi tu mfuatano wa wakati.
- source_word: τῆς σαρκὸς ἡμῶν πατέρας
  choice: baba zetu wa kimwili
  rationale: Usemi huu unamaanisha baba zetu wa kibinadamu kwa upande wa uzazi wa mwili na unadumisha utofautishaji wao na Baba wa roho bila kuipa σάρξ maana ya asili ya dhambi.
- source_word: παιδευτὰς
  choice: waliotutia nidhamu
  rationale: Kirai cha kitenzi ni cha kawaida na wazi katika Kiswahili, huku kikihifadhi uhusiano na mada ya malezi na nidhamu katika sura hii.
- source_word: ἐνετρεπόμεθα
  choice: tuliwaheshimu
  rationale: Katika muktadha huu kitenzi kinaonyesha heshima waliyopewa baba waliotia nidhamu, si lazima woga au aibu.
- source_word: οὐ πολὺ μᾶλλον ὑποταγησόμεθα
  choice: Je, si zaidi sana tutajitiisha
  rationale: Muundo huu unahifadhi swali la balagha, nguvu ya ulinganisho, na hali ya wakati ujao ya kitenzi cha Kiyunani.
- source_word: τῷ πατρὶ τῶν πνευμάτων
  choice: kwa Baba wa roho
  rationale: Tafsiri ya karibu inaacha wingi na upana wa usemi wa Kiyunani bila kuufanya mahsusi kuwa ‘Baba wa roho zetu’ au ‘Baba wa viumbe vya kiroho.’
- source_word: καὶ ζήσομεν
  choice: na kuishi
  rationale: Hii inaunganisha kujitiisha na matokeo ya kuishi kwa njia fupi na ya kawaida katika swali la Kiswahili.
theological_decisions:
- issue: Maana ya ‘Baba wa roho’
  choice: Usemi mpana unaomtaja Mungu kwa utofautisho na baba wa kimwili
  alternative: Baba wa roho zetu hasa, au Baba wa viumbe vyote vya kiroho
  rationale: Kiyunani hakisemi wazi ‘roho zetu’; kwa hiyo tafsiri kuu haifungi maana katika mojawapo ya ufafanuzi huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo wa swali la balagha na utofautishaji kati ya baba wa kimwili na Baba wa roho umehifadhiwa.
