review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the inferential particle, the ongoing reception of the unshakable kingdom, the debated χάριν as “neema,” and the reverent character of service to God. However, “ambayo kwa hiyo” does not convey δι’ ἧς (“through/by which”); it is grammatically and semantically unclear in Swahili.
  naturalness: Most wording is clear Standard East African Swahili. “Ambayo kwa hiyo” is unnatural and obscures the instrumental link. Recasting it as “na kwa neema hiyo” is idiomatic while retaining the antecedent and instrumental force.
  terminology: “Ufalme usioweza kutikiswa,” “neema,” “kumtumikia Mungu,” and “uchaji na kicho” are appropriate, respectful, and theologically non-sectarian. The footnote appropriately retains the plausible idiomatic alternative of gratitude/thankfulness.
  issues:
  - severity: medium
    issue: The expression “ambayo kwa hiyo” mistranslates/obscures δι’ ἧς.
    rationale: The Greek feminine relative phrase means “through which” and refers naturally to χάριν. In Swahili, “ambayo kwa hiyo” reads like “which therefore,” not an instrumental expression. “Na kwa neema hiyo” naturally communicates “and through that grace.”
  revised_text: Kwa hiyo, kwa kuwa tunapokea ufalme usioweza kutikiswa, tuwe na neema[a], na kwa neema hiyo tumtumikie Mungu kwa namna inayompendeza, kwa uchaji na kicho.
