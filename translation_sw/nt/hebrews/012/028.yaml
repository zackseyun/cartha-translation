  text: διὸ βασιλείαν ἀσάλευτον παραλαμβάνοντες ἔχωμεν χάριν, δι’ ἧς ⸀λατρεύωμεν εὐαρέστως τῷ θεῷ μετὰ ⸂εὐλαβείας καὶ δέους⸃,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/028.yaml
  text: Therefore[a], since we are receiving an unshakable kingdom, let us have grace, through which we may serve God acceptably with reverence and awe,
translation:
  language: sw
  text: Kwa hiyo, kwa kuwa tunapokea ufalme usioweza kutikiswa, tuwe na neema[a], na kwa neema hiyo tumtumikie Mungu kwa namna inayompendeza, kwa uchaji na kicho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “tushukuru.” Kirai cha Kigiriki ἔχωμεν χάριν kinaweza kumaanisha “tuwe na neema” au, kimsemo, “tuwe na shukrani” au “tushukuru.”
    reason: alternative_reading
lexical_decisions:
- source_word: διὸ
  choice: Kwa hiyo
  rationale: Inaonyesha hitimisho linalotokana na hoja iliyotangulia kuhusu kutikiswa na kuondolewa kwa vitu vilivyoumbwa.
- source_word: βασιλείαν ἀσάλευτον
  choice: ufalme usioweza kutikiswa
  rationale: Inahifadhi picha ya kitu kisichotikiswa na tofauti yake na vitu vinavyotikiswa katika muktadha.
- source_word: παραλαμβάνοντες
  choice: kwa kuwa tunapokea
  rationale: Kitenzi-shirikishi cha wakati wa sasa kinaelezwa kama hali inayoendelea na msingi wa himizo linalofuata.
- source_word: ἔχωμεν χάριν
  choice: tuwe na neema
  rationale: Inahifadhi maana ya msingi ya χάρις na kuruhusu kirai kinachofuata kirejelee neema kama njia ya kumtumikia Mungu; maana mbadala ya shukrani imewekwa katika tanbihi.
- source_word: δι’ ἧς
  choice: ambayo kwa hiyo
  rationale: Inahifadhi rejeo la kiwakilishi cha kike kwa χάριν na maana ya njia au chombo, yaani kupitia neema hiyo.
- source_word: λατρεύωμεν
  choice: tupate kumtumikia
  rationale: Kum­tumikia Mungu huwasilisha huduma ya kidini bila kuibana iwe ibada ya ndani pekee; muundo wa 'tupate' unaonyesha kusudi au matokeo.
- source_word: εὐαρέστως
  choice: kwa namna inayompendeza
  rationale: Ni Kiswahili cha asili kinachoonyesha kwamba huduma hiyo inakubalika na kumpendeza Mungu.
- source_word: μετὰ εὐλαβείας καὶ δέους
  choice: kwa uchaji na kicho
  rationale: ‘Uchaji’ huonyesha heshima makini mbele za Mungu, na ‘kicho’ huonyesha hofu yenye mshangao mbele ya utakatifu na ukuu wake.
theological_decisions:
- issue: Maana ya χάριν katika ἔχωμεν χάριν
  choice: neema
  alternative: shukrani; tushukuru
  rationale: Muundo wa karibu wa sentensi unaunga mkono ‘neema,’ kwa kuwa δι’ ἧς inaweza kurejelea neema kuwa njia ya kutoa huduma inayompendeza Mungu. Hata hivyo, maana ya kimsemo ‘tushukuru’ inawezekana na imehifadhiwa katika tanbihi ili kutoondoa mvutano wa kifasiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Ufalme usioweza kutikiswa’ huhifadhi taswira kuu ya muktadha; ‘uchaji na kicho’ ni lugha inayoeleweka bila kupunguza uzito wa kukaribia utakatifu wa Mungu.
