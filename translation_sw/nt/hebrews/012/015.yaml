source:
  edition: SBLGNT
  text: ἐπισκοποῦντες μή τις ὑστερῶν ἀπὸ τῆς χάριτος τοῦ θεοῦ, μή τις ῥίζα πικρίας ἄνω φύουσα ἐνοχλῇ καὶ ⸂δι’ αὐτῆς⸃ μιανθῶσιν ⸀πολλοί,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/015.yaml
  text: watching carefully lest anyone fall short of the grace of God[a], lest any root of bitterness springing up cause trouble, and through it many be defiled[b],
translation:
  language: sw
  text: mkiangalia kwa makini kwamba mtu yeyote asipungukiwe na neema ya Mungu[a], wala mzizi wowote wa uchungu usije ukachipuka na kuleta taabu, na kwa mzizi huo wengi watiwe unajisi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ashindwe kuipata neema ya Mungu.” Usemi wa Kigiriki unaweza kumaanisha kutofikia kile kinachotolewa au kupungukiwa na neema hiyo.
    reason: lexical_alternative
  - marker: b
    text: Huenda maneno “mzizi wa uchungu” yanarejelea Kumbukumbu la Torati 29:18, ambako mzizi wenye sumu ni mfano wa kutokuwa mwaminifu kwa agano kunakoenea katika jumuiya.
    reason: cross_reference
lexical_decisions:
- source_word: ἐπισκοποῦντες
  choice: mkihakikisha
  rationale: Kitenzi hiki cha hali ya kuendelea kina wazo la kuangalia kwa makini na kuwajibika kwa hali ya jumuiya. ‘Mkihakikisha’ ni Kiswahili cha kawaida kinachohifadhi uangalifu huo bila kuleta maana ya cheo rasmi.
- source_word: μή τις ὑστερῶν ἀπὸ τῆς χάριτος τοῦ θεοῦ
  choice: kwamba hakuna mtu anayepungukiwa na neema ya Mungu
  rationale: ὑστερέω pamoja na ἀπό inaweza kumaanisha kutofikia au kupungukiwa na jambo linalotolewa. ‘Anayepungukiwa’ huhifadhi onyo na pia kutokamilika kwa maana bila kuamua mjadala wa kiteolojia.
- source_word: χάριτος
  choice: neema
  rationale: ‘Neema’ ni neno la kawaida na lenye heshima katika Kiswahili cha Biblia, na huhifadhi uzito wa maana ya χάρις katika muktadha huu.
- source_word: ῥίζα πικρίας
  choice: mzizi wa uchungu
  rationale: Tafsiri hii ya karibu huhifadhi taswira ya mzizi na mwangwi unaowezekana wa Kumbukumbu la Torati 29:18; ‘uchungu’ unaweza pia kubeba wazo pana la kitu kichungu au chenye sumu katika taswira hiyo.
- source_word: ἄνω φύουσα
  choice: unaochipuka
  rationale: ‘Kuchipuka’ hueleza kwa kawaida mmea unaoanza kujitokeza na kukua, na hivyo kuhifadhi taswira hai ya Kigiriki.
- source_word: ἐνοχλῇ
  choice: kuleta taabu
  rationale: Kitenzi kina maana ya kusumbua au kuleta shida. ‘Kuleta taabu’ ni cha asili na kinaonyesha athari yake kwa jumuiya.
- source_word: δι’ αὐτῆς
  choice: kwa huo
  rationale: Kiwakilishi cha kike katika Kigiriki kinarejelea kwa uwezekano mkubwa ‘mzizi.’ Kiswahili hutumia upatanisho wa ngeli ya ‘mzizi,’ hivyo ‘kwa huo’ huhifadhi uhusiano huo na maana ya chombo au njia.
- source_word: μιανθῶσιν πολλοί
  choice: wengi wanatiwa unajisi
  rationale: μιαίνω ina uzito wa kunajisi kimaadili au kidini. ‘Kutiwa unajisi’ huhifadhi uzito huo kuliko maneno mepesi kama ‘kuathiriwa,’ huku ‘wengi’ ikitafsiri πολλοί moja kwa moja.
theological_decisions:
- issue: Iwapo onyo kuhusu kupungukiwa na neema ya Mungu linamaanisha kupoteza wokovu, kutopokea neema, au kutengwa na jumuiya
  choice: kupungukiwa na neema ya Mungu
  alternative: kushindwa kuipata neema ya Mungu
  rationale: Kigiriki kinaweza kuonyesha kutofikia kile kinachotolewa au kupungukiwa nacho, lakini aya yenyewe haiamui mabishano ya baadaye kuhusu uasi au kudumu katika wokovu. Tafsiri imeacha mvutano huo wazi.
- issue: Iwapo ‘mzizi wa uchungu’ ni hisia ya chuki binafsi tu au taswira pana ya kutokuwa mwaminifu kwa agano
  choice: mzizi wa uchungu
  alternative: mzizi mchungu
  rationale: Muundo wa karibu unaendeleza sitiari na mwangwi wa Kumbukumbu la Torati 29:18 bila kuifunga kwa hisia binafsi pekee.
- issue: Iwapo μιαίνω ipunguzwe kuwa usumbufu wa kijamii tu
  choice: wanatiwa unajisi
  alternative: wanachafuliwa
  rationale: Kitenzi kina nguvu ya kimaadili au kidini, si usumbufu wa kawaida tu. ‘Kutiwa unajisi’ huhifadhi uzito huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa wingi ‘mkihakikisha’ unaendeleza mawaidha kwa jumuiya kutoka muktadha. Lugha imehifadhi sitiari ya mzizi, utata wa ‘kupungukiwa,’ na uzito wa ‘unajisi’ bila kuingiza msimamo wa dhehebu.
