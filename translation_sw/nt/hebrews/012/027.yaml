  text: τὸ δὲ Ἔτι ἅπαξ δηλοῖ ⸂τῶν σαλευομένων⸃ μετάθεσιν ὡς πεποιημένων, ἵνα μείνῃ τὰ μὴ σαλευόμενα.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/027.yaml
  text: This phrase, “Yet once more,” indicates the removal of the things being shaken—as things that have been made—so that the things not being shaken may remain.
translation:
  language: sw
  text: Usemi huu, “Mara moja tena,” unaonyesha kuondolewa kwa vitu vinavyotikiswa—kama vitu vilivyofanywa[a]—ili vitu visivyotikiswa[b] vibaki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kama vitu vilivyoumbwa.” Kigiriki kinasema kihalisi “kama vitu vilivyofanywa.”
    reason: lexical_alternative
  - marker: b
    text: Au “vitu visivyoweza kutikiswa” / “vile visivyotikisika.”
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ δὲ Ἔτι ἅπαξ
  choice: Maneno haya, “Mara nyingine tena,”
  rationale: Kifungu kilichonukuliwa kimefanywa nomino na artiko ya Kigiriki; “maneno haya” ni Kiswahili cha kawaida kinachoonyesha kwamba mwandishi anafafanua usemi huo. δέ ina nguvu ndogo ya kiunganishi na haihitaji neno la pekee hapa.
- source_word: δηλοῖ
  choice: yanaonyesha
  rationale: Hutoa maana ya kufanya jambo lieleweke au kuonyesha hitimisho linalotokana na usemi uliotangulia, kwa lugha ya sasa na inayoeleweka.
- source_word: τῶν σαλευομένων
  choice: kwa vitu vinavyotikiswa
  rationale: Kauli ya kutendwa ya wakati uliopo imehifadhiwa kwa “vinavyotikiswa,” bila kuibadili moja kwa moja kuwa dhana ya kutoweza kudumu.
- source_word: μετάθεσιν
  choice: kuondolewa
  rationale: Katika muktadha huu neno linaonyesha kuhamishwa au kuondolewa, si badiliko tu; “kuondolewa” linafaa kwa hoja ya kifungu.
- source_word: ὡς πεποιημένων
  choice: kwa kuwa ni vitu vilivyofanywa
  rationale: “Kwa kuwa” huwasilisha ὡς kwa maana ya kutambulisha hadhi au msingi wa vitu hivyo, huku “vilivyofanywa” ikihifadhi kauli ya kutendwa na hali ya jambo lililokamilishwa. “Vitu vilivyoumbwa” ni mbadala halali lakini wa kufasiri zaidi.
- source_word: ἵνα μείνῃ
  choice: ili ... vibaki
  rationale: “Ili” huonyesha kusudi au matokeo yaliyokusudiwa, na “vibaki” hutoa kwa kawaida wazo la kuendelea kuwapo.
- source_word: τὰ μὴ σαλευόμενα
  choice: vitu visivyotikiswa
  rationale: Huhifadhi ulinganifu wa wazi kati ya vinavyotikiswa na visivyotikiswa bila kuingiza moja kwa moja maana ya kutoweza kutikiswa kutoka mstari unaofuata.
theological_decisions:
- issue: Iwapo τὰ μὴ σαλευόμενα itafsiriwe kwa kufafanua kuwa vitu visivyoweza kutikiswa au kwa ulinganifu wa karibu kuwa vitu visivyotikiswa
  choice: vitu visivyotikiswa
  alternative: vitu visivyoweza kutikiswa; vile visivyotikisika
  rationale: 'Kigiriki kinatofautisha virai viwili vya hali ya sasa: vitu vinavyotikiswa na vitu visivyotikiswa. Tafsiri hii inadumisha mvutano huo na haifanyi mstari huu useme wazi kutowezekana kwa kutikiswa, ingawa muktadha mpana unaunga mkono wazo hilo.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Maneno haya” ni ya asili zaidi kuliko “kifungu hiki” katika muktadha wa usemi mfupi ulionukuliwa. Ulinganifu wa “vinavyotikiswa ... visivyotikiswa” umehifadhiwa kwa makusudi.
