  text: καὶ τροχιὰς ὀρθὰς ⸀ποιεῖτε τοῖς ποσὶν ὑμῶν, ἵνα μὴ τὸ χωλὸν ἐκτραπῇ, ἰαθῇ δὲ μᾶλλον.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/013.yaml
  text: and make straight paths for your feet[a], so that the lame may not be turned aside[b], but rather be healed.
translation:
  language: sw
  text: Na tengenezeni njia zilizonyooka kwa ajili ya miguu yenu,[a] ili kile kilicho kilema kisipotoke njia,[b] bali kiponywe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maneno haya yana mwangwi wa Mithali 4:26 na yanaendeleza picha ya kutembea kwa nidhamu.
    reason: cross_reference
  - marker: b
    text: Au “kisiteguke” au “kisitoke kiungoni”; kitenzi cha Kigiriki kinaweza kuwa na maana ya kimatibabu katika picha hii ya mwili.
    reason: lexical_alternative
lexical_decisions:
- source_word: τροχιὰς
  choice: njia
  rationale: Neno hili linaweza kumaanisha mapito au alama za magurudumu; “njia” ni la kawaida na linaendeleza picha ya mwendo wa maisha.
- source_word: ὀρθὰς
  choice: nyoosheni
  rationale: Ingawa katika Kigiriki ni kivumishi “zilizo nyoofu,” muundo wa Kiswahili “nyoosheni njia” ni wa asili na huhifadhi wazo la kufanya mapito yawe ya moja kwa moja.
- source_word: ποιεῖτε
  choice: nyoosheni
  rationale: Amri ya wakati wa sasa inadai tendo endelevu; maana ya “fanyeni” imeunganishwa kwa kawaida na kivumishi katika kauli “nyoosheni njia.”
- source_word: τοῖς ποσὶν ὑμῶν
  choice: kwa ajili ya miguu yenu
  rationale: Huhifadhi uhusiano wa udativo unaoonyesha kwamba njia hizo zinaandaliwa kwa ajili ya miguu yao, bila kuibadili kuwa “kwa miguu yenu.”
- source_word: τὸ χωλὸν
  choice: kile kilicho kilema
  rationale: Umbo la Kigiriki ni kivumishi cha jinsi isiyo ya kiume wala ya kike kilichotumiwa kama nomino. Tafsiri hii huhifadhi kutotajwa wazi ikiwa kinachorejelewa ni kiungo dhaifu au mtu aliye dhaifu.
- source_word: ἐκτραπῇ
  choice: kisigeuke kando
  rationale: Hutoa maana ya msingi ya kugeuka kutoka njiani huku dokezo la kimatibabu la kuteguka likihifadhiwa katika tanbihi.
- source_word: ἰαθῇ
  choice: kiponywe
  rationale: Huhifadhi picha ya mwili na lengo la kurejeshwa katika hali njema.
- source_word: μᾶλλον
  choice: bali
  rationale: Katika muundo “si ... bali,” neno hili linaonyesha kwa kawaida tofauti kati ya matokeo yanayokataliwa na yanayotakiwa.
theological_decisions:
- issue: Ikiwa lugha ya ulemavu ni ya kimwili tu au ni sitiari ya udhaifu wa kiroho
  choice: Kuhifadhi lugha ya mwili bila kuamua wazi kinachorejelewa
  alternative: Kutafsiri moja kwa moja kuwa waamini walio dhaifu kiroho, au kuwa watu walio katika mazingira hatarishi kwa ujumla
  rationale: Kigiriki kinaacha rejeo likiwa pana katika himizo hili. “Kile kilicho kilema” hudumisha mvutano kati ya picha ya kiungo dhaifu na mtu dhaifu bila kuingiza tafsiri ya kimadhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa kishairi wa mwendo na uponyaji umehifadhiwa. Alama za tanbihi zimewekwa mara tu baada ya vifungu vinavyohusika.
