source:
  edition: SBLGNT
  text: πᾶσα ⸀δὲ παιδεία πρὸς μὲν τὸ παρὸν οὐ δοκεῖ χαρᾶς εἶναι ἀλλὰ λύπης, ὕστερον δὲ καρπὸν εἰρηνικὸν τοῖς δι’ αὐτῆς γεγυμνασμένοις ἀποδίδωσιν δικαιοσύνης.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/011.yaml
  text: All discipline seems for the present to be not joy but sorrow[a]; yet later it yields the peaceful fruit of righteousness to those who have been trained by it.
translation:
  language: sw
  text: Kila nidhamu, kwa wakati huu, haionekani kuwa ya furaha bali ya huzuni; lakini baadaye huzaa tunda la uadilifu lenye amani kwa wale waliozoezwa nayo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παιδεία
  choice: adhabu ya malezi
  rationale: Katika muktadha huu neno linamaanisha malezi ya mzazi yanayotia ndani maonyo, marekebisho na mazoezi, si adhabu ya kulipiza kisasi tu. “Adhabu ya malezi” ni ya kawaida na huonyesha kusudi lake la kumjenga mtu.
- source_word: πρὸς μὲν τὸ παρὸν
  choice: wakati huo
  rationale: Hueleza hali inavyoonekana wakati inapovumiliwa, kwa kulinganisha na matokeo ya baadaye.
- source_word: οὐ δοκεῖ
  choice: haionekani
  rationale: Huhifadhi wazo la jinsi jambo linavyoonekana kwa anayelipitia, badala ya kutoa tamko kamili kuhusu asili yake.
- source_word: χαρᾶς ... ἀλλὰ λύπης
  choice: kuwa ya furaha, bali ya huzuni
  rationale: Huhifadhi nomino za Kigiriki “furaha” na “huzuni” bila kufasiri λύπη kwa namna finyu kuwa maumivu ya mwili.
- source_word: ὕστερον
  choice: baadaye
  rationale: Ni kauli ya kawaida inayoonyesha matokeo yanayofuata.
- source_word: καρπὸν εἰρηνικὸν
  choice: tunda lenye amani
  rationale: Kivumishi kinaeleza tunda kuwa na sifa ya amani; tafsiri hii haikulazimishi kumaanisha tu tunda linaloleta amani.
- source_word: γεγυμνασμένοις
  choice: waliozoezwa
  rationale: Huwasilisha hali iliyotokana na mazoezi ya kurudiwa-rudiwa na kudumisha kivuli cha sitiari ya mazoezi.
- source_word: ἀποδίδωσιν
  choice: huzaa
  rationale: Kwa kuwa kiima ni adhabu ya malezi na yambwa ni tunda, “huzaa” ni ya asili na huhifadhi picha ya matokeo kama tunda.
- source_word: δικαιοσύνης
  choice: uadilifu
  rationale: Katika muktadha huu linaelekea kumaanisha mwenendo ulionyooka unaotokana na malezi ya Mungu. “Uadilifu” pia linaweza kuwa na maana ya haki, hivyo tanbihi inadumisha uwezekano huo.
theological_decisions:
- issue: Maana ya παιδεία katika tendo la Mungu kwa waamini
  choice: adhabu ya malezi inayojumuisha marekebisho na mazoezi
  alternative: adhabu ya kulipiza kisasi au mafundisho pekee
  rationale: Waebrania 12:5–10 inaonyesha tendo la baba kwa watoto wake, lenye lengo la utakatifu na ukomavu. Tafsiri hii inadumisha uzito wa marekebisho pamoja na kusudi lake la malezi.
- issue: Maana ya δικαιοσύνης
  choice: uadilifu
  alternative: haki
  rationale: Hapa neno linaelekea kueleza matokeo ya kimaadili—maisha yaliyonyooka—lakini maana ya “haki” inawezekana kileksika na imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Adhabu ya malezi” imetumiwa ili kuepuka kueleza παιδεία kama adhabu ya kulipiza tu, huku “waliozoezwa” ikidumisha taswira ya mazoezi.
