  text: καί, οὕτω φοβερὸν ἦν τὸ φανταζόμενον, Μωϋσῆς εἶπεν· Ἔκφοβός εἰμι καὶ ἔντρομος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/021.yaml
  text: And so terrifying was the sight that Moses said[b][a], “I am fearful and trembling.”
translation:
  language: sw
  text: Na kile kilichoonekana kilikuwa cha kutisha sana hivi kwamba Musa alisema[b][a], “Nina hofu kubwa na ninatetemeka.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “jambo lililoonekana” au “tamasha.” Usemi wa Kigiriki unarejelea udhihirisho ulioonekana huko Sinai.
    reason: lexical_alternative
  - marker: b
    text: Maneno haya si nukuu ya neno kwa neno kutoka Agano la Kale, bali yanaakisi hofu ya Musa inayohusishwa na tukio la Sinai; linganisha Kumbukumbu la Torati 9:19.
    reason: cross_reference
lexical_decisions:
- source_word: καί
  choice: Na
  rationale: Kiunganishi hiki kinaendeleza maelezo yaliyotangulia kuhusu Sinai; “Na” hudumisha mtiririko wa kawaida wa Kiswahili.
- source_word: οὕτω φοβερὸν ἦν
  choice: yalikuwa ya kutisha sana kiasi kwamba
  rationale: Muundo huu unaonyesha kiwango kikubwa cha hofu na unaunganisha kwa kawaida na matokeo yaliyoelezwa, yaani Musa kusema.
- source_word: τὸ φανταζόμενον
  choice: maono hayo
  rationale: Kirai hiki kinarejelea jambo lililoonekana, yaani udhihirisho wa kuonekana huko Sinai. “Maono hayo” ni ya asili katika Kiswahili na hayalazimishi kuwa yalikuwa maono ya ndoto au ufunuo wa ndani; uwezekano wa “jambo lililoonekana” umewekwa katika tanbihi.
- source_word: Μωϋσῆς εἶπεν
  choice: Musa alisema
  rationale: Hili ni tafsiri ya moja kwa moja na ya kawaida ya jina na kitenzi cha kusema.
- source_word: Ἔκφοβός εἰμι
  choice: Nimejaa hofu
  rationale: ἔκφοβος huonyesha hofu kali. “Nimejaa hofu” huhifadhi hali ya kuogopa sana bila kuichanganya na neno linalofuata kuhusu kutetemeka.
- source_word: καὶ ἔντρομος
  choice: na ninatetemeka
  rationale: Huhifadhi kiunganishi na wazo tofauti la kutetemeka, badala ya kuunganisha maneno mawili ya Kigiriki kuwa usemi mmoja.
theological_decisions:
- issue: Uhusiano wa kauli hii na simulizi la Sinai katika Agano la Kale
  choice: Kauli imetolewa wazi kama maneno ya Musa katika tukio la Sinai, kama ilivyo katika mstari wa Kigiriki.
  alternative: Kuieleza katika matini kuu kuwa muhtasari huru wa hofu ya Musa badala ya nukuu ya moja kwa moja.
  rationale: Matini inasema Musa alisema maneno hayo. Swali la kama ni nukuu ya neno kwa neno au mwangwi wa Kumbukumbu la Torati 9:19 linaachwa katika tanbihi ili kutohitimisha mvutano wa kimaandiko kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Mpangilio wa alama [b][a] umehifadhiwa kama katika matini ya ushauri ya Kiingereza, na kila alama ina tanbihi inayolingana.
