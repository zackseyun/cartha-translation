id: HEB.12.2
reference: Hebrews 12:2
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀφορῶντες εἰς τὸν τῆς πίστεως ἀρχηγὸν καὶ τελειωτὴν Ἰησοῦν, ὃς ἀντὶ τῆς προκειμένης αὐτῷ χαρᾶς ὑπέμεινεν σταυρὸν αἰσχύνης καταφρονήσας, ἐν δεξιᾷ τε τοῦ θρόνου τοῦ θεοῦ κεκάθικεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/002.yaml
  text: fixing our eyes on Jesus[a], the pioneer and perfecter of faith, who for the joy set before him endured the cross, despising the shame[b], and has sat down at the right hand of the throne of God.
translation:
  language: sw
  text: tukimkazia macho Yesu[a], mwanzilishi na mkamilishaji wa imani, ambaye kwa ajili ya furaha iliyowekwa mbele yake aliustahimili msalaba, akiidharau aibu[b], naye ameketi upande wa kulia wa kiti cha enzi cha Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mwanzilishi na mkamilishaji wa uaminifu,” au “mwanzilishi na mkamilishaji wa imani yetu.” Kifungu cha Kigiriki ni kifupi, na neno linalotafsiriwa “imani” linaweza pia kumaanisha “uaminifu” au kurejelea hasa imani ya waamini.
    reason: alternative_reading
  - marker: b
    text: Au, “akiipuuza aibu.” Maana ni kwamba aliiona fedheha ya kusulubiwa kuwa jambo lisiloweza kumzuia.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφορῶντες
  choice: tukimtazama Yesu kwa makini
  rationale: Kifungu hiki kinaonyesha kuelekeza fikira na macho kwa Yesu bila kuvutwa na mambo mengine; “kwa makini” huleta wazo hilo kwa Kiswahili cha kawaida.
- source_word: ἀρχηγὸν
  choice: mwanzilishi
  rationale: Neno linaweza kumaanisha anayeanzisha na pia anayetangulia kuwaongoza wengine. “Mwanzilishi” ni wazi na la heshima, ingawa wazo la kutangulia njiani halijitokezi kikamilifu.
- source_word: τελειωτὴν
  choice: mkamilishaji
  rationale: Humaanisha yule anayeleta jambo kwenye ukamilifu au lengo lake; linadumisha ulinganifu na “mwanzilishi.”
- source_word: τῆς πίστεως
  choice: wa imani
  rationale: Muundo mfupi wa Kigiriki umehifadhiwa bila kuongeza “yetu,” ambayo haipo wazi katika matini; uwezekano wa “uaminifu” umewekwa katika tanbihi.
- source_word: ἀντὶ τῆς προκειμένης αὐτῷ χαρᾶς
  choice: Kwa ajili ya furaha iliyowekwa mbele yake
  rationale: Katika muktadha wa ustahimilivu na mbio, furaha iliyo mbele inaeleweka zaidi kama matarajio yaliyomsukuma kuvumilia, huku tafsiri ya “badala ya” ikibaki uwezekano wa kileksika.
- source_word: ὑπέμεινεν σταυρὸν
  choice: aliustahimili msalaba
  rationale: “Kustahimili” huonyesha kudumu imara chini ya mateso, na msalaba ni ule maalumu wa kusulubiwa kwa Yesu.
- source_word: αἰσχύνης καταφρονήσας
  choice: akiidharau aibu
  rationale: Hueleza kuiona fedheha ya kusulubiwa kuwa si jambo la kuamua mwenendo wake, si kwamba aibu yenyewe ilikuwa njema.
- source_word: ἐν δεξιᾷ ... τοῦ θρόνου τοῦ θεοῦ κεκάθικεν
  choice: ameketi upande wa kulia wa kiti cha enzi cha Mungu
  rationale: “Ameketi” huwasilisha tendo lililokamilika lenye matokeo yanayoendelea; upande wa kulia ni mahali pa heshima na mamlaka.
theological_decisions:
- issue: Maana ya τῆς πίστεως pamoja na ἀρχηγὸν καὶ τελειωτὴν
  choice: Yesu ni “mwanzilishi na mkamilishaji wa imani.”
  alternative: Yesu ni mwanzilishi na mkamilishaji wa uaminifu, au wa imani yetu.
  rationale: Kigiriki ni kifupi na kinaweza kurejelea imani ya waamini au uaminifu unaodhihirishwa na Yesu. Matini kuu haiongezi “yetu” wala kufunga maana kwa tafsiri ya “uaminifu”; uwezekano huo umehifadhiwa katika tanbihi.
- issue: Nguvu ya ἀντὶ katika ἀντὶ τῆς προκειμένης αὐτῷ χαρᾶς
  choice: Furaha iliyowekwa mbele yake ndiyo matarajio yaliyokuwa mbele yake alipoustahimili msalaba.
  alternative: Aliustahimili msalaba badala ya kuchukua furaha iliyokuwa mbele yake.
  rationale: Muktadha wa mbio na ustahimilivu kuelekea lengo unaunga mkono maana ya kutenda kwa ajili ya furaha ya baadaye, bila kudai utofautishaji wa kinadharia usiolazimishwa na matini.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa kishiriki “tukimtazama” unaendeleza sentensi na himizo la mstari uliotangulia. “Kiti cha enzi” limehifadhiwa kama tamathali ya kifalme iliyozoeleka katika lugha ya Biblia.
