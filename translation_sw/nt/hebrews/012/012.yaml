  yaml_path: translation/nt/hebrews/012/012.yaml
  text: Therefore[a], strengthen your drooping hands and your weakened knees,
translation:
  language: sw
  text: Kwa hiyo[a], imarisheni mikono iliyolegea na magoti yaliyodhoofika.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri iliyo karibu zaidi na muundo wa Kigiriki, “Kwa hiyo, inyosheni mikono inayoning’inia na magoti yaliyodhoofika.” Maneno haya yana mwangwi wa Isaya 35:3 katika tafsiri ya Kigiriki na yanatumia taswira ya mwili kuonyesha ujasiri na uvumilivu unaofanywa upya.
    reason: cross_reference
lexical_decisions:
- source_word: Διὸ
  choice: Kwa hiyo
  rationale: Kiunganishi hiki kinaonyesha hitimisho la himizo linalotokana na maelezo yaliyotangulia; “Kwa hiyo” ni cha kawaida na kinahifadhi uhusiano huo wa kimantiki.
- source_word: παρειμένας χεῖρας
  choice: mikono iliyolegea
  rationale: Kirai hiki kinaonyesha mikono iliyoachwa ining’inie au iliyolegea kwa uchovu na kukata tamaa. Tafsiri hii ni ya asili katika Kiswahili na inadumisha taswira ya mwili.
- source_word: παραλελυμένα γόνατα
  choice: magoti yaliyodhoofika
  rationale: Kauli hii inaonyesha magoti yaliyofikia hali ya udhaifu. “Yaliyodhoofika” huepuka maana finyu ya kupooza kitabibu huku ikihifadhi taswira ya uchovu na kushindwa kusimama imara.
- source_word: ἀνορθώσατε
  choice: yainueni
  rationale: Kitenzi kina maana ya kuinua, kunyoosha, au kurudisha katika hali ya wima. “Yainueni” kinahifadhi amri na taswira halisi ya mwili, huku muktadha ukionyesha himizo la kupata tena ujasiri na uvumilivu.
theological_decisions:
- issue: Himizo la kitamathali linalotumia udhaifu wa mwili
  choice: Kudumisha taswira ya kuinua mikono iliyolegea na magoti yaliyodhoofika, huku muktadha ukielekeza kwenye ujasiri na uvumilivu mpya.
  alternative: Kutafsiri maana moja kwa moja kuwa “jitieni nguvu” na hivyo kupunguza taswira ya mwili.
  rationale: Muktadha wa Waebrania 12 unahusu kustahimili na nidhamu, na maneno haya yana mwangwi wa Isaya 35:3 katika mapokeo ya Kigiriki. Tafsiri haifungi taswira hiyo katika ufafanuzi mmoja tu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Kauli ni fupi na ya kihimizo; taswira ya mwili imehifadhiwa bila kutumia lugha ya kitabibu isiyokusudiwa.
