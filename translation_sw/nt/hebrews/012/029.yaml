  text: For our God is a consuming fire[a][b].
translation:
  language: sw
  text: Kwa maana Mungu wetu ni moto unaoteketeza.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Huu ni mwangwi wa Kumbukumbu la Torati 4:24, ambapo Mungu anaelezwa kuwa “moto uteketezao.”
