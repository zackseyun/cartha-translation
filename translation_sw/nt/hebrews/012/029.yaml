    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Kwa maana
  rationale: γὰρ linaunganisha kauli hii na onyo na himizo lililotangulia kwa kutoa sababu. “Kwa maana” ni Kiswahili cha kawaida chenye nguvu hiyo ya ufafanuzi; καὶ limeingizwa katika uhusiano huo badala ya kutafsiriwa peke yake kwa namna isiyo ya asili.
- source_word: ὁ θεὸς ἡμῶν
  choice: Mungu wetu
  rationale: Huu ni uwasilishaji wa kawaida na wa moja kwa moja wa muundo wa umilikaji, unaohifadhi maana ya kijumuiya na ya uhusiano wa agano.
- source_word: πῦρ
  choice: moto
  rationale: Neno limetafsiriwa moja kwa moja ili kuhifadhi sitiari ya maandiko na mwangwi wake wa Kumbukumbu la Torati 4:24.
- source_word: καταναλίσκον
  choice: unaoteketeza
  rationale: Kirai hiki cha kitenzi kinaeleza moto kuwa wenye kuteketeza kabisa. “Unaoteketeza” ni cha asili na wazi katika Kiswahili cha sasa, huku kikihifadhi nguvu hai ya kauli ya Kigiriki.
theological_decisions:
- issue: Maelezo ya kisitiari kwamba Mungu ni moto
  choice: 'Kuhifadhi sitiari moja kwa moja: “Mungu wetu ni moto unaoteketeza”'
  alternative: Mungu wetu ni kama moto unaoteketeza
  rationale: Kigiriki kina kauli ya usawazisho bila neno la kulinganisha. Tafsiri ya moja kwa moja inahifadhi uzito wa onyo na mvutano wa kitheolojia bila kuilegeza sitiari kuwa tashbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi na chenye hadhi. Muundo ni mfupi kama ulivyo katika Kigiriki; sitiari haijafafanuliwa wala kupunguzwa nguvu.
