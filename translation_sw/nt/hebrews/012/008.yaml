source:
  edition: SBLGNT
  text: εἰ δὲ χωρίς ἐστε παιδείας ἧς μέτοχοι γεγόνασι πάντες, ἄρα νόθοι ⸂καὶ οὐχ υἱοί ἐστε⸃.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/008.yaml
  text: But if you are without discipline, of which all have become sharers, then you are illegitimate children and not sons.
translation:
  language: sw
  text: Lakini ikiwa hamna nidhamu ambayo wote wamekuwa washiriki wake, basi ninyi ni watoto wasio halali, wala si wana.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παιδείας
  choice: nidhamu
  rationale: Katika muktadha huu neno linamaanisha malezi ya kurekebisha au kuadibu; “nidhamu” ni la kawaida na huhifadhi wazo hilo bila kulifanya kuwa adhabu tu.
- source_word: μέτοχοι γεγόνασι
  choice: wamekuwa washiriki wake
  rationale: Huwakilisha hali iliyotokea na inayoendelea ya kuwa na sehemu katika nidhamu hiyo.
- source_word: νόθοι
  choice: watoto wasio halali
  rationale: Hutoa maana ya watoto ambao hawatambuliwi kuwa wa ukoo halali, kwa lugha inayoeleweka bila kutumia tusi kali.
- source_word: υἱοί
  choice: wana
  rationale: Huhifadhi taswira mahsusi ya kifamilia ya neno la Kigiriki na tofauti yake na νόθοι.
theological_decisions:
- issue: Wigo wa πάντες (“wote”)
  choice: wote
  alternative: waamini wote / wana wote
  rationale: Chanzo hakitaji kundi kwa jina katika mstari huu; tafsiri inaacha wigo uamuliwe na muktadha.
- issue: Tofauti kati ya νόθοι na υἱοί
  choice: watoto wasio halali, wala si wana
  alternative: wana haramu, wala si wana halisi
  rationale: Huhifadhi mvutano wa hadhi ya kifamilia bila kuongeza “halisi,” ambalo halimo wazi katika chanzo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo umebaki karibu na hoja ya Kigiriki huku ukisomeka kwa kawaida.
