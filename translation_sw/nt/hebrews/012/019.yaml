  naturalness: “Na sauti ya tarumbeta, na sauti ya maneno” ni Kiswahili Sanifu kinachoeleweka katika orodha ya kifasihi ya Waebrania 12. “Waliomba wasiongezewe neno jingine” ni asilia na hudumisha dhana ya neno kuongezwa/kusemwa tena kwao.
  terminology: “Tarumbeta,” “sauti,” na “neno” zinafaa kwa rejesta ya Biblia. “Sauti ya maneno” huhifadhi usemi wenye mkazo wa Kigiriki bila kudai kwa kuongeza kwamba sauti yenyewe “ilisema.”
