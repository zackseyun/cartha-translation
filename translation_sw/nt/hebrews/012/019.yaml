base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/019.yaml
  text: and to the sound of a trumpet and to a voice of words[b][a], whose hearers begged that no further word be spoken to them.
translation:
  language: sw
  text: na sauti ya tarumbeta, na sauti ya maneno,[b][a] ambayo wale walioisikia waliomba wasiongezewe neno jingine.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kiwakilishi “ambayo” kinaweza kueleweka kuwa kinarejelea kwa upana zaidi udhihirisho wote wa Sinai, badala ya “sauti ya maneno” pekee.
    reason: alternative_reading
  - marker: b
    text: Tazama Kutoka 20:18–19 na Kumbukumbu la Torati 5:23–27 kuhusu ombi la Waisraeli la kutosikia tena sauti ya Mungu moja kwa moja.
    reason: cross_reference
lexical_decisions:
- source_word: σάλπιγγος ἤχῳ
  choice: sauti ya tarumbeta
  rationale: Neno “sauti” linawakilisha ἦχος kwa Kiswahili cha kawaida na kuhifadhi taswira halisi ya tarumbeta bila kuongeza dhana ya nguvu au muda wa mlio.
- source_word: φωνῇ ῥημάτων
  choice: sauti iliyosema maneno
  rationale: Hili ni toleo la asili na linaloeleweka la kirai kisicho cha kawaida, likionyesha kwamba kilichosikiwa kilikuwa usemi wenye maneno, si kelele tu.
- source_word: ἧς
  choice: ambayo
  rationale: Kiwakilishi hiki kinarejelea moja kwa moja “sauti” iliyo karibu nacho, huku tanbihi ikihifadhi uwezekano wa kukirejelea kwa upana zaidi tukio lote la kusikia pale Sinai.
- source_word: οἱ ἀκούσαντες
  choice: wale walioisikia
  rationale: Tafsiri hii inawakilisha wazi participio yenye matumizi ya nomino na kuwabainisha Waisraeli waliyoisikia sauti hiyo.
- source_word: παρῃτήσαντο
  choice: waliomba
  rationale: Katika muktadha huu kitenzi kinaonyesha ombi la kuepushwa na hotuba zaidi. “Waliomba” ni cha asili na hakikifanyi kitenzi kuwa kukataa tu; muktadha unaonyesha uzito wa ombi.
- source_word: μὴ προστεθῆναι αὐτοῖς λόγον
  choice: wasiongezewe neno jingine
  rationale: Hii huhifadhi umbo la kutendwa na wazo halisi la ‘kuongezwa’ kwa neno zaidi, lakini kwa Kiswahili kinachoeleweka na cha heshima.
theological_decisions:
- issue: Kirejelewa cha kishazi cha uhusiano ἧς
  choice: Katika matini kuu, kishazi kinarejelea moja kwa moja “sauti iliyosema maneno.”
  alternative: Kishazi kinaweza kurejelea kwa upana zaidi udhihirisho mzima wa Sinai, pamoja na sauti ya tarumbeta na sauti ya maneno.
  rationale: Kisarufi, nomino ya karibu φωνῇ na kiwakilishi cha kike umoja ἧς vinaunga mkono rejeleo la sauti. Hata hivyo, muktadha unaweza kuhusisha tukio lote la kutisha, hivyo uwezekano huo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo “wasiongezewe neno jingine” huhifadhi kwa kiasi kinachofaa usemi wa Kigiriki, na tanbihi huhifadhi utata halisi wa kirejelewa cha ἧς.
