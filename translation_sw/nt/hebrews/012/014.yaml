  text: Εἰρήνην διώκετε μετὰ πάντων, καὶ τὸν ἁγιασμόν, οὗ χωρὶς οὐδεὶς ὄψεται τὸν κύριον,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/014.yaml
  text: Pursue peace with everyone[a], and the holiness without which no one will see the Lord.
translation:
  language: sw
  text: Tafuteni kwa bidii amani na watu wote, na utakatifu[a] ambao, bila huo, hakuna mtu atakayemwona Bwana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “utakaso.” Neno la Kigiriki linaweza kumaanisha utakatifu kama sifa ya maisha, au utakaso kama hali au mchakato wa kufanywa mtakatifu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰρήνην
  choice: amani
  rationale: Katika muundo wa ‘na watu wote,’ neno hili linaelekea kumaanisha kuishi kwa amani katika mahusiano, si hisia ya utulivu wa ndani pekee.
- source_word: διώκετε
  choice: fuateni kwa bidii
  rationale: Kauli hii ya amri inaonyesha kufuatilia kwa juhudi na kwa kudumu; ‘kwa bidii’ huhifadhi nguvu ya kitenzi bila kufanya Kiswahili kuwa kigumu.
- source_word: μετὰ πάντων
  choice: na watu wote
  rationale: Hutoa maana ya kuwa na amani pamoja na kila mtu na huhifadhi upeo wa wote kwa Kiswahili cha kawaida.
- source_word: τὸν ἁγιασμόν
  choice: utakatifu
  rationale: ‘Utakatifu’ ni wazi na wa kawaida kuliko istilahi ya kitaalamu, huku ukiweza kumaanisha hali au mwenendo wa kuwekwa wakfu kwa Mungu.
- source_word: οὗ χωρὶς
  choice: ambao bila huo
  rationale: Kiwakilishi kinarejelea ‘utakatifu’; muundo huu unahifadhi uhusiano huo wazi bila kuongeza maelezo ya kitafsiri.
- source_word: οὐδεὶς
  choice: hakuna mtu
  rationale: Ni ukanushaji kamili unaolingana kwa kawaida na maana ya οὐδεὶς.
- source_word: ὄψεται
  choice: atakayemwona
  rationale: Huhifadhi wakati ujao na maana ya moja kwa moja ya kumwona.
- source_word: τὸν κύριον
  choice: Bwana
  rationale: Huhifadhi cheo cha κύριος bila kumtaja kwa namna inayolazimisha utambulisho ambao mstari wenyewe haujaueleza.
theological_decisions:
- issue: Maana ya ἁγιασμός katika himizo
  choice: utakatifu
  alternative: kutakaswa
  rationale: ‘Utakatifu’ huwasilisha kwa lugha inayoeleweka hali na mwenendo unaolingana na kuwekwa wakfu kwa Mungu. Tanbihi huhifadhi uwezekano wa maana ya hali au mchakato wa kutakaswa.
- issue: Anayerejelewa na ‘Bwana’
  choice: Bwana
  alternative: Mungu; Bwana Yesu
  rationale: Maandishi ya Kigiriki yanasema tu ‘Bwana.’ Tafsiri haibainishi zaidi ikiwa anayelengwa ni Mungu Baba au Yesu, hivyo inadumisha uwazi wenye mipaka wa chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Fuateni kwa bidii’ huhifadhi uzito wa himizo, na ‘utakatifu’ huepuka lugha ya kitaalamu kupita kiasi.
