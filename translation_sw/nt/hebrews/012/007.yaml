  text: εἰς παιδείαν ὑπομένετε· ὡς υἱοῖς ὑμῖν προσφέρεται ὁ θεός· τίς ⸀γὰρ υἱὸς ὃν οὐ παιδεύει πατήρ;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/007.yaml
  text: Endure for discipline[a]; God is dealing with you as with sons[b]. For what son is there whom a father does not discipline?
translation:
  language: sw
  text: Vumilieni kwa ajili ya nidhamu[a]; Mungu anawatendea kama wana[b]. Kwa maana ni mwana gani ambaye baba hamtii nidhamu?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yavumilieni haya kama nidhamu.” Kigiriki kinaweza kueleweka kuwa himizo la kuvumilia kwa ajili ya nidhamu, au kuyachukulia yanayovumiliwa kuwa nidhamu.
    reason: alternative_reading
  - marker: b
    text: Kigiriki, “wana.” Neno hili linafuata mfano wa baba na wana katika hoja hii; lakini matumizi ya mfano huu hayawahusu wanaume pekee.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς παιδείαν
  choice: kwa ajili ya nidhamu
  rationale: Huhifadhi maana inayowezekana ya kusudi au matokeo katika εἰς pamoja na παιδείαν, bila kuficha uwezekano mwingine kwamba wanachovumilia kichukuliwe kuwa nidhamu.
- source_word: ὑπομένετε
  choice: Vumilieni
  rationale: Umbo hili linaweza kueleweka kama taarifa au amri, lakini katika muktadha lina nguvu ya himizo. Tafsiri hii haiongezi kitu kisichotajwa wazi katika Kigiriki.
- source_word: ὡς υἱοῖς
  choice: kama wana
  rationale: Huhifadhi ulinganisho wa uhusiano wa baba na wana ambao hoja ya aya inautumia.
- source_word: προσφέρεται
  choice: anawatendea
  rationale: Katika muktadha huu kitenzi kinaeleza jinsi Mungu anavyoshughulika nao; 'anawatendea' ni Kiswahili cha kawaida na cha moja kwa moja.
- source_word: τίς γὰρ υἱὸς ὃν οὐ παιδεύει πατήρ
  choice: Kwa maana ni mwana gani ambaye baba hamtii nidhamu?
  rationale: Huhifadhi swali la balagha, taswira ya baba na mwana, na uhusiano wa kileksia kati ya παιδεία na παιδεύει kwa kutumia 'nidhamu' katika sehemu zote mbili.
theological_decisions:
- issue: Lugha ya kijinsia katika mfano wa baba na mwana
  choice: wana
  alternative: watoto
  rationale: Neno la Kigiriki υἱοί ni 'wana,' na hoja yenyewe inategemea mfano wa baba na wana. Maelezo ya chini yanafafanua kwamba matumizi yake yanawahusu waamini wote, si wanaume pekee.
- issue: Jinsi ya kuelewa εἰς παιδείαν
  choice: kwa ajili ya nidhamu
  alternative: yavumilieni haya kama nidhamu
  rationale: Kigiriki kinaweza kuonyesha kuvumilia kwa kusudi la nidhamu au kuyachukulia yanayovumiliwa kuwa nidhamu. Maandishi makuu yanatumia maana ya kusudi, huku tanbihi ikihifadhi uwezekano mwingine.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. 'Nidhamu' limetumiwa kwa uthabiti ili kuhifadhi uhusiano kati ya παιδεία na παιδεύει; tanbihi zinahifadhi utata wa kisarufi na upeo wa mfano wa kifamilia.
