  text: οὐχὶ πάντες εἰσὶν λειτουργικὰ πνεύματα εἰς διακονίαν ἀποστελλόμενα διὰ τοὺς μέλλοντας κληρονομεῖν σωτηρίαν;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/014.yaml
  text: Are they not all ministering spirits, being sent out for service for the sake of those who are about to inherit salvation?[a]
translation:
  language: sw
  text: Je, hao wote si roho watumikao, wanaotumwa kuwahudumia wale watakaourithi wokovu?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wale walio karibu kurithi wokovu.” Usemi wa Kigiriki una maana inayoelekea wakati ujao.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχὶ
  choice: Je, ... si
  rationale: Huanzisha swali la balagha linalotarajia jibu la kukubali; muundo huu ni wa kawaida na wazi katika Kiswahili.
- source_word: πάντες
  choice: wote
  rationale: Hudumisha maana jumuishi ya kivumishi cha wingi bila kuongeza maneno yasiyohitajika.
- source_word: λειτουργικὰ πνεύματα
  choice: roho wanaotumikia
  rationale: Neno λειτουργικός linaonyesha utumishi, mara nyingi wenye hadhi takatifu au rasmi. Tafsiri hii ni ya asili katika Kiswahili na hapa 'roho' inarejelea viumbe wa kimalaika.
- source_word: εἰς διακονίαν
  choice: kutoa huduma
  rationale: Kirai hiki kinaonyesha kusudi. 'Kutoa huduma' huhifadhi wazo la διακονία bila kulifungamanisha na cheo rasmi cha kidini.
- source_word: ἀποστελλόμενα
  choice: wanaotumwa
  rationale: Huhifadhi hali ya kutendwa na nguvu ya kitenzi kishirikishi kinachozifafanua roho hizo, huku Kiswahili cha sasa kikibaki cha kawaida.
- source_word: διὰ
  choice: kwa ajili ya
  rationale: Pamoja na hali ya accusative, διά hapa linaonyesha manufaa au kusudi kuhusiana na wale wanaohudumiwa.
- source_word: τοὺς μέλλοντας
  choice: wale walio karibu
  rationale: Huhifadhi mwelekeo wa wakati ujao na kidokezo cha jambo linalotarajiwa au linalokaribia, badala ya kulifanya kuwa kauli ya hatima.
- source_word: κληρονομεῖν
  choice: kurithi
  rationale: Huhifadhi kwa ufupi taswira ya urithi iliyo muhimu katika Waebrania.
- source_word: σωτηρίαν
  choice: wokovu
  rationale: Ni istilahi ya kawaida na inayofaa kimuktadha, inayoweza kubeba vipengele vya sasa na vya wakati ujao.
theological_decisions:
- issue: Nguvu ya μέλλοντας κληρονομεῖν σωτηρίαν
  choice: wale walio karibu kurithi wokovu
  alternative: wale watakaourithi wokovu
  rationale: Tafsiri iliyochaguliwa huhifadhi mtazamo wa wakati ujao na kidokezo cha matarajio katika μέλλω bila kudai wazi fundisho fulani la uhakikisho au kuamuliwa tangu awali. Tanbihi inatoa tafsiri ya kawaida zaidi ya wakati ujao.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Swali la balagha, lugha ya urithi, na hali ya baadaye vimehifadhiwa bila kuongeza ufafanuzi wa kimadhehebu.
