base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/012.yaml
  text: and like a cloak you will roll them up[a]; like a garment they will be changed. But you are the same[b], and your years will not fail.
translation:
  language: sw
  text: na kama joho utazikunja[a]; kama vazi zitabadilishwa. Lakini wewe ni yuleyule, na miaka yako haitakoma[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “utaziviringisha.”
    reason: lexical_alternative
  - marker: b
    text: Au “miaka yako haitafikia mwisho” au “miaka yako haitaisha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡσεὶ
  choice: kama
  rationale: Huanzisha ulinganisho kwa Kiswahili cha kawaida na kudumisha taswira ya mavazi.
- source_word: περιβόλαιον
  choice: joho
  rationale: Ni vazi la nje linalomzunguka mtu; “joho” ni neno la kawaida, lenye hadhi, na linahifadhi taswira ya kitu kinachofunika.
- source_word: ἑλίξεις
  choice: utazikunja
  rationale: Kitenzi kinaweza kumaanisha kukunja au kuviringisha. “Utazikunja” ni cha asili kwa vazi na hakifungi kabisa uwezekano wa taswira ya kuliviringisha.
- source_word: αὐτούς
  choice: -zi- katika “utazikunja”
  rationale: Kiwakilishi kinarejelea mbingu zilizotajwa katika muktadha uliotangulia; upatanisho wa ngeli ya “mbingu” kwa Kiswahili ni zi-.
- source_word: ὡς ἱμάτιον
  choice: kama vazi
  rationale: Hudumisha ulinganisho wa pili wa mavazi, umoja wa nomino, na mtindo wa kishairi.
- source_word: ἀλλαγήσονται
  choice: zitabadilishwa
  rationale: Hudumisha hali ya kutendwa ya Kigiriki na tofauti kati ya uumbaji unaobadilishwa na anayeendelea kuwa yuleyule.
- source_word: σὺ δὲ
  choice: Lakini wewe
  rationale: Huonyesha wazi tofauti kubwa kati ya vitu vilivyoumbwa vinavyobadilika na uthabiti wa anayezungumziwa.
- source_word: ὁ αὐτὸς
  choice: ni yuleyule
  rationale: Ni usemi wa asili wa Kiswahili unaohifadhi maana ya kuendelea kuwa yuleyule bila kuingiza istilahi ya kiteolojia ya kiufundi.
- source_word: τὰ ἔτη σου
  choice: miaka yako
  rationale: Tafsiri ya moja kwa moja inayohifadhi sitiari ya muda kuhusu kuwapo kwa kudumu.
- source_word: οὐκ ἐκλείψουσιν
  choice: haitakoma
  rationale: Hutoa kwa kawaida maana ya kutofikia mwisho au kutokoma, huku ikihifadhi mtindo wa kishairi.
theological_decisions:
- issue: Lugha ya kutobadilika kwa Mungu katika nukuu inayomhusu Mwana
  choice: Lakini wewe ni yuleyule
  alternative: Lakini wewe unabaki vilevile
  rationale: “Ni yuleyule” inafuata kwa karibu ὁ αὐτός na kuhifadhi tofauti kati ya uumbaji unaobadilishwa na utambulisho wa kudumu wa Mwana, bila kuongeza istilahi ya baadaye ya kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio wa kishairi na ulinganisho wa joho na vazi umehifadhiwa; “mbingu” imepewa upatanisho wa ngeli ya zi- kulingana na muktadha.
