  text: τοσούτῳ κρείττων γενόμενος τῶν ἀγγέλων ὅσῳ διαφορώτερον παρ’ αὐτοὺς κεκληρονόμηκεν ὄνομα.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/004.yaml
  text: having become as much superior to the angels as the name he has inherited is more excellent than theirs.
translation:
  language: sw
  text: amekuwa mkuu kuliko malaika kwa kadiri ileile jina alilorithi lilivyo bora zaidi kuliko lao.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “amekuwa bora kuliko malaika ... lina heshima zaidi kuliko lao.”
    reason: lexical_alternative
  - marker: b
    text: Katika muktadha unaofuata, “jina” linafafanuliwa kuhusiana na hadhi yake kama Mwana.
    reason: cross_reference
lexical_decisions:
- source_word: τοσούτῳ ... ὅσῳ
  choice: kwa kadiri ileile ambayo
  rationale: 'Muundo huu wa Kiswahili unaonyesha ulinganisho wa uwiano: ukuu wake juu ya malaika unalingana na ubora wa jina alilorithi.'
- source_word: κρείττων
  choice: mkuu kuliko
  rationale: Katika muktadha huu neno linaonyesha cheo au hadhi iliyo juu, si ubora wa kimaadili; kwa hiyo “mkuu kuliko” ni wazi na ya kawaida.
- source_word: γενόμενος
  choice: amekuwa
  rationale: Huhifadhi maana ya kushika hali iliyotokea bila kutumia “amefanywa,” ambayo ingeweza kueleweka kimakosa kuwa Mwana aliumbwa.
- source_word: τῶν ἀγγέλων
  choice: malaika
  rationale: Baada ya kilinganishi, “kuliko malaika” ni Kiswahili cha kawaida na sahihi.
- source_word: διαφορώτερον
  choice: bora
  rationale: Katika ulinganisho huu neno linaonyesha ubora au upekee unaozidi; “bora” ni la asili na linaeleweka kwa urahisi.
- source_word: παρ’ αὐτοὺς
  choice: kuliko lao
  rationale: Kiwakilishi cha umilikaji kinarejelea jina la malaika kwa ufupi na kwa Kiswahili cha kawaida.
- source_word: κεκληρονόμηκεν
  choice: alilorithi
  rationale: Hutoa wazi wazo la kupokea kwa urithi. Ingawa timilifu ya Kigiriki ina matokeo yanayoendelea, muktadha wa sentensi ya Kiswahili tayari unaonyesha hali iliyopo.
- source_word: ὄνομα
  choice: jina
  rationale: Tafsiri halisi inahifadhi mtiririko wa hoja, huku mistari inayofuata ikifafanua jina hilo.
theological_decisions:
- issue: Maana ya γενόμενος kuhusiana na hadhi ya Mwana
  choice: Kutafsiri “amekuwa” kwa uwazi, kwa kurejelea hali yake ya kuinuliwa na ukuu wake juu ya malaika.
  alternative: “amefanywa” au maelezo yanayodai kuwa alianza kuwa wa kimungu baadaye
  rationale: Tafsiri inahifadhi kitenzi cha Kigiriki na mvutano wa kifungu bila kudokeza kuwa Mwana aliumbwa au alipata uungu baadaye.
- issue: Maana ya “jina” katika muktadha
  choice: Kubakiza “jina” bila kulifafanua ndani ya mstari.
  alternative: “jina la Mwana” au “cheo cha Mwana”
  rationale: Mstari wenyewe unasema “jina,” na muktadha unaofuata unalifafanua kwa lugha ya uana; kutolitangulia kunahifadhi mtiririko wa fasihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa ulinganisho umehifadhiwa bila kuwa mzito kupita kiasi.
