  text: πρὸς τίνα δὲ τῶν ἀγγέλων εἴρηκέν ποτε· Κάθου ἐκ δεξιῶν μου ἕως ἂν θῶ τοὺς ἐχθρούς σου ὑποπόδιον τῶν ποδῶν σου;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/013.yaml
  text: But to which of the angels has he ever said[a], ‘Sit at my right hand until I make your enemies a footstool for your feet’?”
translation:
  language: sw
  text: Lakini ni yupi kati ya malaika ambaye Mungu amewahi kumwambia, “Keti upande wangu wa kuume mpaka nitakapowafanya[a] adui zako kuwa kiti cha kuwekea miguu yako”?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mpaka niwaweke adui zako chini ya miguu yako.”
    reason: Mbadala wa kileksia wa τίθημι (“kuweka”) na uwasilishaji wa taswira ya ὑποπόδιον.
lexical_decisions:
- source_word: πρὸς τίνα δὲ τῶν ἀγγέλων
  choice: Lakini ni yupi kati ya malaika ambaye Mungu ... kumwambia
  rationale: δέ inaendeleza utofautishaji na hoja iliyotangulia. Muundo wa Kiswahili umetaja Mungu wazi kama mhusika wa kitenzi ili swali lisomeke kwa kawaida; mhusika huyo anaeleweka kutokana na muktadha wa maneno ya Mungu.
- source_word: εἴρηκέν ποτε
  choice: amewahi kumwambia
  rationale: Wakati timilifu pamoja na ποτέ unawakilishwa kwa Kiswahili cha kawaida kwa ‘amewahi,’ huku ‘kumwambia’ kikihifadhi wazo la kusema kwa mtu fulani.
- source_word: Κάθου
  choice: Keti
  rationale: Amri hii ni ya moja kwa moja, ya asili, na yenye hadhi katika Kiswahili sanifu.
- source_word: ἐκ δεξιῶν μου
  choice: mkono wangu wa kuume
  rationale: Hii ni nahau ya kibiblia inayotambulika kwa nafasi ya heshima na mamlaka; kitenzi ‘keti’ kinafanya maana ya mahali ieleweke bila kuongeza kihusishi kisicho cha lazima.
- source_word: ἕως ἂν θῶ
  choice: mpaka nitakapowafanya
  rationale: Muundo huu unaonyesha mpaka wa wakati unaotazamia tendo la baadaye, na ‘kuwafanya ... kuwa’ unalingana vizuri na kiarifu ὑποπόδιον.
- source_word: τοὺς ἐχθρούς σου
  choice: adui zako
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya wingi huu.
- source_word: ὑποπόδιον τῶν ποδῶν σου
  choice: kiti cha kuwekea miguu yako
  rationale: Huhifadhi taswira halisi ya kifalme ya maadui kutiishwa, kwa maneno yanayoeleweka katika Kiswahili cha sasa.
theological_decisions:
- issue: Kuhifadhi nguvu ya kikristo ya nukuu ya Zaburi 110:1 bila kuifafanua kupita kiasi
  choice: 'Nukuu imeachwa kama tamko la kutawazwa linalomwelekea Mwana kwa namna ya pekee: “Keti mkono wangu wa kuume mpaka nitakapowafanya adui zako kuwa kiti cha kuwekea miguu yako.”'
  alternative: Kufafanua taswira kuwa ‘mpaka nitakapowashinda kabisa adui zako.’
  rationale: Hoja ya Waebrania inategemea maneno yenyewe ya Maandiko na tofauti kati ya Mwana na malaika; kwa hiyo taswira ya kifalme na kutiishwa kwa maadui imehifadhiwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Swali la balagha limehifadhiwa, na taswira ya kiti cha kuwekea miguu haijabadilishwa kuwa maelezo ya moja kwa moja ya ushindi.
