  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Τίνι γὰρ εἶπέν ποτε τῶν ἀγγέλων· Υἱός μου εἶ σύ, ἐγὼ σήμερον γεγέννηκά σε, καὶ πάλιν· Ἐγὼ ἔσομαι αὐτῷ εἰς πατέρα, καὶ αὐτὸς ἔσται μοι εἰς υἱόν;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/005.yaml
  text: For to which of the angels did he ever say[a], “You are my Son; today I have begotten you”? And again, “I will be to him a father[c][b], and he will be to me a son”?
translation:
  language: sw
  text: Kwa maana, ni malaika yupi ambaye aliwahi kuambiwa[a], “Wewe ni Mwanangu; leo nimekuzaa[b]”? Na tena, “Mimi nitakuwa baba yake, naye atakuwa mwanangu[c]”?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa tafsiri iliyo karibu zaidi na mpangilio wa maneno ya Kigiriki: “Kwa maana, alimwambia nani wakati wowote miongoni mwa malaika?”'
    reason: lexical_alternative
  - marker: b
    text: “Nimekuzaa” ni mwangwi wa Zaburi 2:7. Maneno haya yameeleweka kuhusiana na kutawazwa kwa mfalme, ufufuo, au uhusiano wa milele wa Mwana na Baba; tafsiri imehifadhi usemi wenyewe bila kuamua kati ya fasiri hizo.
    reason: cross_reference
  - marker: c
    text: 'Nukuu kutoka 2 Samweli 7:14. Kwa muundo wa karibu zaidi na Kigiriki: “Mimi nitakuwa baba kwake, naye atakuwa mwana kwangu.”'
    reason: alternative_reading
lexical_decisions:
- source_word: Τίνι ... τῶν ἀγγέλων
  choice: malaika yupi
  rationale: Muundo huu unaonyesha uchaguzi kutoka miongoni mwa malaika na unaifanya hoja ya swali la balagha iwe wazi katika Kiswahili cha kawaida.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Inaendeleza uhusiano wa maelezo na hoja iliyotangulia.
- source_word: εἶπέν ποτε
  choice: aliwahi kumwambia
  rationale: Neno “aliwahi” linawasilisha nguvu ya ποτέ, yaani wakati wowote, kwa namna ya kawaida katika swali la balagha la Kiswahili.
- source_word: ἀγγέλων
  choice: malaika
  rationale: Muktadha wa Waebrania 1 unaonyesha wazi kuwa hawa ni viumbe wa mbinguni, si wajumbe wa kibinadamu.
- source_word: Υἱός μου εἶ σύ
  choice: Wewe ni Mwanangu
  rationale: Inahifadhi usemi wa moja kwa moja na hadhi ya kipekee ya Mwana katika hoja ya sura hii, huku ikitumia mpangilio wa asili wa Kiswahili.
- source_word: σήμερον
  choice: leo
  rationale: Ni tafsiri ya moja kwa moja ya kielezi cha wakati bila kuongeza ufafanuzi.
- source_word: γεγέννηκά σε
  choice: nimekuzaa
  rationale: Inahifadhi sitiari ya kuzaa iliyo katika Zaburi 2:7 bila kuifafanua kuwa kutawazwa, ufufuo, kufanyika mwili, au uhusiano wa milele.
- source_word: καὶ πάλιν
  choice: Na tena
  rationale: Ni utangulizi wa kawaida na wazi wa dondoo lingine la Maandiko.
- source_word: Ἐγὼ ἔσομαι αὐτῷ εἰς πατέρα
  choice: Mimi nitakuwa Baba yake
  rationale: Inawasilisha maana ya uhusiano wa kifamilia na agano kwa Kiswahili cha asili; “Mimi” hudumisha msisitizo wa Ἐγώ.
- source_word: καὶ αὐτὸς ἔσται μοι εἰς υἱόν
  choice: naye atakuwa mwanangu
  rationale: Inahifadhi usambamba wa dondoo na kuwasilisha uhusiano huo kwa namna ya kawaida ya Kiswahili.
theological_decisions:
- issue: Utambulisho wa msemaji usiotajwa moja kwa moja katika kitenzi εἶπεν
  choice: Kutaja “Mungu” kama kiima
  alternative: 'Kuacha kiima katika nafsi ya tatu: “aliwahi kumwambia”'
  rationale: Muktadha wa karibu unamtambulisha Mungu kuwa msemaji. Kutaja jina lake huepusha utata wa viwakilishi katika Kiswahili bila kubadili maana ya chanzo.
- issue: Maana ya “leo nimekuzaa”
  choice: Kuhifadhi maneno “leo nimekuzaa” bila kuyafasiri katika mstari
  alternative: Kuyafafanua kuwa kutawazwa kwa kifalme, ufufuo, au uhusiano wa milele wa Mwana na Baba
  rationale: Dondoo la Zaburi 2:7 lina kina na mvutano wa kitheolojia ambao tafsiri haipaswi kuumaliza kwa kuchagua fasiri moja.
- issue: Lugha ya uwana katika dondoo mbili
  choice: Kutumia “Mwanangu” katika dondoo la kwanza na “mwanangu” katika la pili
  alternative: Kuandika zote kwa herufi kubwa au zote kwa herufi ndogo
  rationale: Dondoo la kwanza linatumia “Mwana” kama mtajo wa moja kwa moja katika hoja ya Kikristo ya sura hii; la pili linahifadhi kauli pana ya agano kutoka 2 Samweli 7:14 bila kuongeza alama ya kifasiri isiyokuwapo katika Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kimaandiko. Muundo wa maswali ni wa kawaida kwa wasomaji wa leo, huku dondoo zikihifadhi urari na uzito wa lugha ya Maandiko. Herufi kubwa katika “Mwanangu” na “Baba” zinaonyesha matumizi ya kimuktadha bila kuingiza ufafanuzi wa dhehebu.
