source:
  edition: SBLGNT
  text: ἠγάπησας δικαιοσύνην καὶ ἐμίσησας ἀνομίαν· διὰ τοῦτο ἔχρισέν σε ὁ θεός, ὁ θεός σου, ἔλαιον ἀγαλλιάσεως παρὰ τοὺς μετόχους σου·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/009.yaml
  text: You have loved righteousness and hated lawlessness; therefore God[a], your God, has anointed you with the oil of gladness beyond your companions.
translation:
  language: sw
  text: Umeipenda haki[a] na kuuchukia uasi; kwa hiyo Mungu, Mungu wako, amekupaka mafuta ya shangwe kuliko wenzako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uadilifu.” Neno la Kigiriki linaweza kumaanisha haki au unyoofu wa kimaadili.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠγάπησας
  choice: Umeipenda
  rationale: Kauli timilifu ya Kiswahili inaonyesha tendo lililotimia lenye umuhimu unaoendelea na inafaa katika nukuu hii yenye mtindo wa juu.
- source_word: δικαιοσύνην
  choice: haki
  rationale: “Haki” ni neno la kawaida na lenye hadhi linaloweza kubeba maana ya unyoofu wa kimaadili na utendaji wa haki; uwezekano wa mkazo wa “kutenda yaliyo sawa” umeonyeshwa katika tanbihi.
- source_word: ἐμίσησας
  choice: kuuchukia
  rationale: Kitenzi hiki kinahifadhi ukinzani mkali wa kimaadili dhidi ya “umeipenda”; umbo lake linaunganishwa kwa kawaida na kitenzi cha kwanza.
- source_word: ἀνομίαν
  choice: uasi
  rationale: Katika Kiswahili cha kawaida, “uasi” huwasilisha hali ya kukaidi sheria au mamlaka ya Mungu kwa uwazi zaidi kuliko “kutokuwa na sheria,” huku “uovu” ikiwa pana mno.
- source_word: διὰ τοῦτο
  choice: kwa hiyo
  rationale: Huonyesha kwa ufupi na kwa kawaida uhusiano wa sababu na matokeo.
- source_word: ἔχρισέν
  choice: amekupaka mafuta
  rationale: Huhifadhi taswira halisi ya χρίω ya kuwekwa wakfu au kutawazwa kwa kupakwa mafuta, bila kuibadili kuwa maelezo ya kitheolojia.
- source_word: ὁ θεός, ὁ θεός σου
  choice: Mungu, Mungu wako
  rationale: Marudio na uhusiano uliomo katika Kigiriki yamehifadhiwa moja kwa moja bila nyongeza ya ufafanuzi.
- source_word: ἔλαιον ἀγαλλιάσεως
  choice: mafuta ya shangwe
  rationale: “Shangwe” huonyesha furaha kubwa ya kusherehekea inayodokezwa na ἀγαλλίασις na inahifadhi nahau ya kibiblia ya mafuta.
- source_word: παρὰ τοὺς μετόχους σου
  choice: kuliko wenzako
  rationale: Katika muundo huu παρά ina maana ya kulinganisha; “kuliko” ni usemi wa kawaida wa Kiswahili, na “wenzako” huonyesha watu wanaoshiriki au kuhusiana naye bila sauti ya kibiashara.
theological_decisions:
- issue: Maana ya δικαιοσύνη katika nukuu ya kifalme/kimasihi
  choice: haki
  alternative: kutenda yaliyo sawa; uadilifu
  rationale: “Haki” huhifadhi upana wa maana ya Kigiriki bila kuamua kimya kimya kama mkazo ni sifa ya kimaadili au utekelezaji wa haki. Tanbihi inaonyesha uwezekano huo wa maana.
- issue: Nguvu ya Kikristo ya maneno ὁ θεός, ὁ θεός σου yanayomhusu Mwana
  choice: Kuhifadhi “Mungu, Mungu wako” bila upanuzi
  alternative: Kufafanua kwa maneno ya ziada uhusiano kati ya Mungu na Mwana
  rationale: Matini yenyewe humtaja Mungu na pia “Mungu wako.” Tafsiri inadumisha mvutano huo wa kitheolojia bila kuupunguza wala kuuingizia ufafanuzi wa kimadhehebu.
- issue: Taswira ya kutiwa mafuta katika ἔχρισέν
  choice: amekupaka mafuta
  alternative: amekutia mafuta; amekuweka wakfu
  rationale: Tafsiri halisi huhifadhi taswira ya kifalme na kimasihi pamoja na tendo la kuwekwa wakfu, bila kubana maana kuwa maelezo moja tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imehifadhi usambamba wa kishairi wa kupenda na kuchukia, marudio ya “Mungu, Mungu wako,” na taswira ya kupakwa mafuta. “Wenzako” ni ya kawaida na pana vya kutosha kwa μετόχους.
