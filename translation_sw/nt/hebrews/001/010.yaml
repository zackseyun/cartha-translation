  yaml_path: translation/nt/hebrews/001/010.yaml
  text: And[a], “You, Lord, in the beginning laid the foundation of the earth, and the heavens are the works of your hands.”
translation:
  language: sw
  text: Na[a], “Wewe, Bwana, hapo mwanzo uliweka msingi wa dunia, na mbingu ni kazi za mikono yako.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Na pia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καί
  choice: Naye asema
  rationale: Kiunganishi kinaongeza nukuu nyingine katika mfululizo. Kwa Kiswahili, kuongeza ‘asema’ kunafanya utangulizi wa nukuu uwe wa kawaida na wazi kwa kutegemea kitenzi cha kusema katika muktadha wa karibu, bila kubadili msemaji.
- source_word: Σὺ
  choice: Wewe
  rationale: Kiwakilishi kilichotajwa wazi katika Kigiriki kina msisitizo; ‘Wewe’ huhifadhi msisitizo huo katika mwanzo wa usemi wa moja kwa moja.
- source_word: κατ’ ἀρχάς
  choice: hapo mwanzo
  rationale: Ni usemi wa wakati unaoelekeza kwenye mwanzo wa uumbaji. ‘Hapo mwanzo’ ni Kiswahili cha kawaida, chenye hadhi, na kinahifadhi maana bila kulazimisha utofauti mwembamba kati ya ‘katika’ na ‘wakati wa’ mwanzo.
- source_word: κύριε
  choice: Bwana
  rationale: Ni hali ya kumwita moja kwa moja κύριος. ‘Bwana’ ndiyo tafsiri ya kawaida katika muktadha huu na huhifadhi nguvu ya usemi unaomwelekea mhusika moja kwa moja.
- source_word: τὴν γῆν
  choice: dunia
  rationale: Katika muktadha wa uumbaji na sambamba na ‘mbingu,’ γῆ humaanisha dunia, si eneo fulani la ardhi.
- source_word: ἐθεμελίωσας
  choice: uliuwekea dunia msingi
  rationale: Huhifadhi kwa uwazi taswira ya usanifu ya kuweka msingi, huku ikisomeka kwa kawaida katika Kiswahili.
- source_word: ἔργα τῶν χειρῶν σού
  choice: kazi za mikono yako
  rationale: Tafsiri hii huhifadhi taswira halisi ya chanzo kwamba mbingu ni vitu vilivyofanywa kwa mikono ya Bwana, badala ya kuifupisha kuwa ‘ufundi wako.’
- source_word: οἱ οὐρανοί
  choice: mbingu
  rationale: ‘Mbingu’ ndilo neno la kawaida la Kiswahili katika lugha ya uumbaji na linaweza kuwakilisha wingi wa Kigiriki kwa kawaida.
theological_decisions:
- issue: Kutumiwa kwa maneno ya Zaburi 102 yanayomwita Bwana kwa Mwana katika Waebrania 1
  choice: Kuhifadhi usemi wa moja kwa moja, ‘Wewe, Bwana,’ bila kuupunguza.
  alternative: Kutafsiri kwa namna isiyo ya moja kwa moja ili kupunguza uzito wa kikristo wa nukuu.
  rationale: Kigiriki kina κύριε katika usemi wa moja kwa moja, na muktadha wa Waebrania unatumia nukuu hii kumhusu Mwana. Tafsiri inapaswa kuhifadhi jambo hilo bila kuongeza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kishairi wa nukuu umehifadhiwa, pamoja na taswira za ‘msingi’ na ‘mikono.’ Alama [a] imewekwa baada ya kiunganishi kinachoanzisha nukuu.
