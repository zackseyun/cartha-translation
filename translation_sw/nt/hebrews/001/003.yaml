source:
  edition: SBLGNT
  text: ὃς ὢν ἀπαύγασμα τῆς δόξης καὶ χαρακτὴρ τῆς ὑποστάσεως αὐτοῦ, φέρων τε τὰ πάντα τῷ ῥήματι τῆς δυνάμεως, ⸂δι’ αὑτοῦ⸃ καθαρισμὸν ⸂τῶν ἁμαρτιῶν ποιησάμενος⸃ ἐκάθισεν ἐν δεξιᾷ τῆς μεγαλωσύνης ἐν ὑψηλοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/003.yaml
  text: He[a], being the radiance of his glory and the exact imprint of his being, and sustaining all things by the word of his power, after making purification for sins through himself[b], sat down at the right hand of the Majesty on high[c],
translation:
  language: sw
  text: Yeye[a], akiwa mng’ao wa utukufu wake na chapa kamili ya uhalisia wake, huyadumisha vitu vyote kwa neno la nguvu zake. Baada ya kufanya utakaso wa dhambi kupitia yeye mwenyewe[b], aliketi kwenye mkono wa kuume wa Ukuu huko juu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, Mwana anayetajwa katika mstari wa 2.
    reason: referent_clarification
  - marker: b
    text: Baadhi ya hati hazina maneno “kupitia yeye mwenyewe”; usomaji wa SBLGNT umeyajumuisha. Pia yaweza kutafsiriwa, “kwa yeye mwenyewe.”
    reason: textual_variant
  - marker: c
    text: Au, “mahali pa juu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπαύγασμα
  choice: mng’ao
  rationale: Neno hili linahifadhi taswira ya nuru inayotoka katika utukufu, bila kudokeza kuwa Mwana ni mwakisiko tu wa nje.
- source_word: δόξα
  choice: utukufu
  rationale: Hili ndilo neno la kawaida na lenye uzito unaofaa kwa fahari ya Mungu.
- source_word: χαρακτήρ
  choice: chapa kamili
  rationale: ‘Chapa’ inadumisha taswira halisi ya alama iliyopigwa kwa muhuri, na ‘kamili’ inaonyesha ulinganifu sahihi.
- source_word: ὑπόστασις
  choice: nafsi
  rationale: Katika muktadha huu ‘nafsi yake’ huonyesha uhalisi wa Mungu mwenyewe bila kuingiza moja kwa moja istilahi za baadaye za kifalsafa kama ‘substansi’.
- source_word: φέρων
  choice: huvishikilia
  rationale: Wakati wa mazoea unaonyesha tendo linaloendelea; ‘huvishikilia’ linabeba maana ya kutegemeza na kudumisha vitu vyote.
- source_word: τὰ πάντα
  choice: vitu vyote
  rationale: Linahifadhi upeo mpana wa Kigiriki bila kuubana kuwa ulimwengu wa kimaada pekee.
- source_word: ῥῆμα
  choice: neno
  rationale: Ni tafsiri ya kawaida na inahifadhi wazo la matamshi yenye kutenda bila kulifasiri kwa kulibana kuwa ‘amri’.
- source_word: τῷ ῥήματι τῆς δυνάμεως
  choice: kwa neno lake lenye nguvu
  rationale: Muundo huu ni wa asili zaidi katika Kiswahili kuliko ‘kwa neno la nguvu zake,’ huku ukihifadhi kwamba neno lake lina uwezo wa kutekeleza.
- source_word: δι’ αὑτοῦ
  choice: kupitia yeye mwenyewe
  rationale: Inafuata maana ya kawaida ya kihusishi διά pamoja na kiwakilishi jirejeshi katika usomaji wa SBLGNT.
- source_word: καθαρισμόν
  choice: utakaso
  rationale: ‘Utakaso’ huhifadhi wazo la utakaso wa kiibada na wa sadaka vizuri kuliko neno la jumla ‘usafishaji’.
- source_word: τῶν ἁμαρτιῶν
  choice: wa dhambi
  rationale: Muundo ‘utakaso wa dhambi’ ni mfupi na wa asili katika Kiswahili, ukionyesha utakaso unaoshughulikia dhambi bila kulazimisha ufafanuzi zaidi.
- source_word: ποιησάμενος
  choice: baada ya kufanya
  rationale: Huweka wazi kwamba tendo la kufanya utakaso lilitangulia tendo kuu la kuketi.
- source_word: ἐν δεξιᾷ
  choice: upande wa kuume
  rationale: Ni usemi wa kawaida wa kibiblia unaohifadhi mahali pa heshima na mamlaka bila kuongeza maelezo ndani ya matini.
- source_word: μεγαλωσύνη
  choice: Mwenye Ukuu
  rationale: Nomino ya sifa inarejelea Mungu kwa njia ya heshima; umbo hili ni la asili na lenye adhama katika Kiswahili.
- source_word: ἐν ὑψηλοῖς
  choice: huko juu
  rationale: Ni usemi wa asili unaohifadhi kutobainishwa kikamilifu kwa mahali pa juu; unaweza pia kueleweka ‘mahali pa juu.’
theological_decisions:
- issue: Maana ya ὑπόστασις katika kifungu kilichokuwa muhimu kwa mafundisho ya baadaye kuhusu Kristo
  choice: nafsi yake
  alternative: asili yake / uhalisi wake / substansi yake
  rationale: ‘Nafsi yake’ inalenga uhalisi wa Mungu mwenyewe huku ikiepuka kupachika moja kwa moja msamiati wa kiufundi wa mijadala ya baadaye; dokezo linahifadhi njia nyingine halali za kueleza neno hilo.
- issue: Nguvu ya kikristo ya ἀπαύγασμα na χαρακτήρ
  choice: mng’ao wa utukufu wake na chapa kamili ya nafsi yake
  alternative: mwakisiko wa utukufu wake na mfano wa asili yake
  rationale: Tafsiri iliyochaguliwa inadumisha lugha yenye nguvu ya kifungu kuhusu uhusiano wa Mwana na utukufu na uhalisi wa Mungu, bila kuipunguza kuwa ufanano wa nje tu.
- issue: Tofauti ya matini kuhusu δι’ αὑτοῦ
  choice: kujumuisha ‘kupitia yeye mwenyewe’ katika matini kuu
  alternative: kuacha maneno hayo / ‘kwa yeye mwenyewe’
  rationale: SBLGNT ina δι’ αὑτοῦ, kwa hiyo imetafsiriwa katika matini kuu; tofauti ya mashahidi wengine imeelezwa katika dokezo.
- issue: Mhusika wa viwakilishi ‘wake’ na ‘yake’
  choice: kuacha rejeo litokane na muktadha wa mstari uliotangulia
  alternative: kutaja ‘Mungu’ moja kwa moja
  rationale: Kigiriki kinatumia viwakilishi na hivyo tafsiri haiongezi jina ambalo halipo katika mstari huu, ingawa muktadha unalitambulisha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kifasihi lakini kinachoeleweka kwa wasomaji wa kawaida. Sentensi ndefu ya Kigiriki imegawanywa kwa alama ya nukta mkato na sentensi mbili ili isomeke kwa urahisi bila kupoteza uhusiano wa kishiriki. ‘Mwenye Ukuu’ limeandikwa kwa herufi kubwa kwa kuwa ni jina la heshima linalomrejelea Mungu.
