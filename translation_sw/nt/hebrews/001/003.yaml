  to: Yeye[a], akiwa mng’ao wa utukufu wake na chapa kamili ya uhalisia wake, huyadumisha vitu vyote kwa neno la nguvu zake. Baada ya kufanya utakaso wa dhambi kupitia yeye mwenyewe[b], aliketi kwenye mkono wa kuume wa Ukuu huko juu[c].
