  text: καὶ πρὸς μὲν τοὺς ἀγγέλους λέγει· Ὁ ποιῶν τοὺς ἀγγέλους αὐτοῦ πνεύματα, καὶ τοὺς λειτουργοὺς αὐτοῦ πυρὸς φλόγα·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/007.yaml
  text: And about the angels he says[a], “He makes his angels winds, and his ministers a flame of fire.”
translation:
  language: sw
  text: 'Na kuhusu malaika, anasema: “Anawafanya malaika wake kuwa pepo[a], na watumishi wake kuwa mwali wa moto.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “roho”; neno la Kigiriki linaweza kumaanisha “pepo” au “roho.”
    reason: alternative_reading
lexical_decisions:
- source_word: πρὸς μὲν τοὺς ἀγγέλους
  choice: kuhusu malaika
  rationale: Katika muktadha huu πρός pamoja na λέγει ina maana ya mada inayozungumziwa, si kwamba maneno haya yanaelekezwa moja kwa moja kwa malaika.
- source_word: λέγει
  choice: anasema
  rationale: Wakati uliopo umehifadhiwa katika kauli ya kunukuu Maandiko, kama ilivyo katika Kigiriki.
- source_word: Ὁ ποιῶν
  choice: Huyafanya
  rationale: Umbo la kishirikishi limetafsiriwa kwa kitenzi cha kawaida cha Kiswahili; kiambishi hu- kinafaa kwa tendo la tabia au mamlaka yanayoendelea kuonyeshwa katika ushairi huu.
- source_word: ἀγγέλους
  choice: malaika
  rationale: Muktadha wa Waebrania 1 unawahusu viumbe wa mbinguni wanaolinganishwa na Mwana, hivyo ‘malaika’ inafaa kuliko ‘wajumbe’.
- source_word: πνεύματα
  choice: pepo
  rationale: Neno la Kigiriki linaweza kumaanisha pepo za upepo au roho. ‘Pepo’ linaafikiana zaidi na usuli wa Zaburi 104:4 na ulinganifu wa kishairi na mwali wa moto; maana nyingine imehifadhiwa katika tanbihi.
- source_word: λειτουργοὺς
  choice: watumishi
  rationale: Neno hili linaonyesha wale wanaotekeleza huduma. ‘Watumishi’ ni la asili na lenye heshima katika Kiswahili bila kulifanya kuwa cheo maalumu cha kanisa.
- source_word: πυρὸς φλόγα
  choice: mwali wa moto
  rationale: Tafsiri hii huhifadhi umoja wa kirai cha Kigiriki na taswira yake ya kishairi.
- source_word: αὐτοῦ
  choice: wake
  rationale: Kiwakilishi kimetafsiriwa kwa umilikaji wa kawaida wa Kiswahili, kikimrejelea Mungu katika nukuu.
theological_decisions:
- issue: Maana ya πνεύματα katika nukuu ya Zaburi 104:4
  choice: pepo
  alternative: roho
  rationale: ‘Pepo’ inafaa zaidi kwa usuli wa Kiebrania na taswira sambamba ya ‘mwali wa moto,’ lakini neno la Kigiriki lina utata wa kweli; kwa hiyo ‘roho’ imetajwa katika tanbihi bila kuondoa mvutano wa kitafsiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kishairi wa nukuu umehifadhiwa, huku sentensi ikiendelea kuwa wazi kwa msomaji wa kawaida.
