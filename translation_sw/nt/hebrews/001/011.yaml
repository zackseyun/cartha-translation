lexical_decisions:
- source_word: αὐτοὶ
  choice: Hizo
  rationale: Kiwakilishi hiki kinarejelea mbingu na dunia zilizotajwa katika mstari uliotangulia. “Hizo” ni rejeleo la kawaida la Kiswahili kwa vitu hivyo na, kwa kuwekwa mwanzoni, linaunga mkono mkazo na utofautishaji unaofuata.
- source_word: ἀπολοῦνται
  choice: zitaangamia
  rationale: Kitenzi hiki kinaonyesha kwamba vitu hivyo vitafikia mwisho. “Zitaangamia” kinadumisha uzito wa maana bila kudokeza wazi mtendaji wa nje anayeviharibu.
- source_word: σὺ δὲ
  choice: lakini wewe
  rationale: Hii inadumisha utofautishaji wenye nguvu kati ya uumbaji unaoangamia na yule anayesemeshwa moja kwa moja.
- source_word: διαμένεις
  choice: unabaki
  rationale: “Unabaki” linaeleza kuendelea kuwapo na linatofautiana moja kwa moja na “zitaangamia.” Wakati wa sasa katika Kigiriki umedumishwa badala ya kugeuzwa kuwa wakati ujao.
- source_word: πάντες
  choice: nazo zote
  rationale: “Nazo zote” linarejelea kwa ujumla vitu vilivyotangulia kutajwa na kudumisha maana ya ujumla ya πάντες.
- source_word: ὡς ἱμάτιον
  choice: kama vazi
  rationale: “Vazi” ni neno pana, la heshima na linaloeleweka, bila kubainisha aina maalumu ya nguo ambayo Kigiriki hakibainishi hapa.
- source_word: παλαιωθήσονται
  choice: zitachakaa
  rationale: Kitenzi kinaweza kumaanisha kuzeeka au kuchakaa. Katika tashbihi ya vazi, “zitachakaa” huwasilisha picha hiyo kwa Kiswahili cha kawaida na cha sasa.
theological_decisions:
- issue: Yule anayesemeshwa na uzito wa kikristo
  choice: 'Kauli imetafsiriwa kama usemi wa moja kwa moja kwa Mwana: “lakini wewe unabaki.”'
  alternative: Kumtaja Mwana kwa jina au kuongeza maelezo ya wazi ya kiimani.
  rationale: Muktadha wa Waebrania 1 unatumia maneno ya Zaburi 102 kwa Mwana. Tafsiri inadumisha nafsi ya pili na uzito wa kifungu bila kuongeza ufafanuzi wa kimadhehebu usiokuwamo katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa sasa, wenye heshima na unaosomeka kwa urahisi. Alama zote za tanbihi zimewekwa baada ya maneno “kama vazi,” kwa kuwa tanbihi ya kwanza inahusu παλαιωθήσονται na ya pili inahusu taswira nzima ya vazi.
