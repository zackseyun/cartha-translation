  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὅταν δὲ πάλιν εἰσαγάγῃ τὸν πρωτότοκον εἰς τὴν οἰκουμένην, λέγει· Καὶ προσκυνησάτωσαν αὐτῷ πάντες ἄγγελοι θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/006.yaml
  text: And when he again brings the Firstborn into the world[a], he says[b], “And let all God’s angels worship him.”
translation:
  language: sw
  text: Naye anapomleta tena Mzaliwa wa Kwanza ulimwenguni,[a] anasema, “Na malaika wote wa Mungu wamsujudie.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Naye tena, anapomleta Mzaliwa wa Kwanza ulimwenguni, anasema, ‘Malaika wote wa Mungu wamsujudie.’” Neno la Kigiriki linalotafsiriwa “tena” linaweza kuhusishwa ama na “anamleta” ama na “anasema.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὅταν
  choice: anapomleta
  rationale: Muundo wa kiwakati wenye -po unaonyesha tukio la wakati maalumu; katika muktadha huu ni wa kawaida zaidi kuliko tafsiri yenye maana ya kila mara.
- source_word: δὲ
  choice: Naye
  rationale: Kiunganishi hiki kinaendeleza hoja kwa upole bila kusisitiza upinzani.
- source_word: πάλιν
  choice: tena
  rationale: Katika matini kuu kimehusishwa na tendo la kumleta. Kwa kuwa kinaweza pia kuhusishwa na ‘anasema,’ uwezekano huo umewekwa katika tanbihi.
- source_word: εἰσαγάγῃ
  choice: anapomleta ... ulimwenguni
  rationale: ‘Kumleta’ ni Kiswahili cha kawaida kinachoonyesha tendo la kumwingiza au kumleta ndani ya eneo linalotajwa.
- source_word: τὸν πρωτότοκον
  choice: Mzaliwa wa Kwanza
  rationale: Imehifadhiwa kama jina la cheo la Mwana katika muktadha, bila kulipanua kwa ufafanuzi wa kitheolojia usiotajwa moja kwa moja.
- source_word: εἰς τὴν οἰκουμένην
  choice: ulimwenguni
  rationale: Hutoa kwa lugha ya kawaida maana ya ulimwengu unaokaliwa bila kutumia msemo mzito usio wa lazima.
- source_word: λέγει
  choice: anasema
  rationale: Inafuata Kigiriki bila kuongeza maneno kama ‘katika Maandiko’; muktadha unaonyesha kwamba msemaji ni Mungu.
- source_word: προσκυνησάτωσαν
  choice: wamsujudie
  rationale: ‘Kusujudia’ hubeba tendo la kuinama kwa heshima ya ibada na linafaa kwa amri inayowaelekeza malaika kwa Mwana; linahifadhi pia taswira halisi ya kitenzi kuliko kulifanya kuwa heshima ya kawaida tu.
- source_word: αὐτῷ
  choice: -m- katika ‘wamsujudie’
  rationale: Kiambishi cha yambwa kinamtaja Mzaliwa wa Kwanza kama anayeelekezewa kusujudiwa.
- source_word: πάντες ἄγγελοι θεοῦ
  choice: malaika wote wa Mungu
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya muundo wa umilikaji katika Kigiriki.
theological_decisions:
- issue: Upeo wa kisintaksia wa πάλιν
  choice: ‘tena’ linahusishwa na ‘kumleta’
  alternative: ‘tena’ linahusishwa na ‘anasema’
  rationale: Kigiriki kinakubali miundo yote miwili. Matini kuu inafuata mpangilio wa maneno unaoliunganisha kwa urahisi na tendo la kumleta, huku tanbihi ikihifadhi utata halisi.
- issue: Nguvu ya προσκυνέω inapomwelekea Mwana
  choice: wamsujudie
  alternative: wamwabudu; wainame mbele yake
  rationale: Katika hoja ya Waebrania 1 na amri kwa malaika wote, neno linaonyesha heshima ya ibada, si heshima ya kijamii tu. ‘Wamsujudie’ huhifadhi maana hiyo pamoja na taswira ya kuinama bila kuongeza dai lisilo katika matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni rahisi kusomeka kwa wasomaji wa kawaida, huku ‘Mzaliwa wa Kwanza’ na ‘wamsujudie’ vikihifadhi uzito wa kifungu na mwangwi wake wa kitheolojia.
