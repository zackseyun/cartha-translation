  text: ἐπ’ ἐσχάτου τῶν ἡμερῶν τούτων ἐλάλησεν ἡμῖν ἐν υἱῷ, ὃν ἔθηκεν κληρονόμον πάντων, δι’ οὗ καὶ ⸂ἐποίησεν τοὺς αἰῶνας⸃·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/002.yaml
  text: in these last days he has spoken to us in a Son[a], whom he appointed heir of all things[b], through whom he also made the ages.
translation:
  language: sw
  text: katika siku hizi za mwisho amesema kwetu katika Mwana[a], ambaye alimweka kuwa mrithi wa vitu vyote, na ambaye kwa njia yake pia alizifanya zama[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa njia ya Mwana.” Kigiriki kinasema kihalisi “katika Mwana,” bila kibainishi bainifu cha Kigiriki kabla ya “Mwana”; hali hiyo hukazia namna na tabia ya kilele ya usemi wa Mungu.
    reason: lexical_alternative
  - marker: b
    text: Au, “ulimwengu” au “malimwengu.” Kigiriki kinasema “zama”; neno hilo linaweza kumaanisha zama zenyewe na, kwa upanuzi, mpangilio mzima wa uumbaji.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπ’ ἐσχάτου τῶν ἡμερῶν τούτων
  choice: katika siku hizi za mwisho
  rationale: Ni usemi wa wakati ulio wa kawaida katika Kiswahili, unaohifadhi uzito wa kieskatolojia wa maneno ya Kigiriki bila kuwa mgumu.
- source_word: ἐλάλησεν ἡμῖν
  choice: amesema nasi
  rationale: Wakati timilifu wa Kiswahili unaonyesha tendo lililotimia lenye umuhimu unaoendelea; 'kusema nasi' ni usemi wa asili unaohifadhi wazo la Mungu kuwaelekea wasikilizaji kwa neno lake.
- source_word: ἐν υἱῷ
  choice: katika Mwana
  rationale: Huhifadhi kwa kadiri inayowezekana muundo usio wa kawaida wa ἐν na nomino isiyo na kibainishi. Herufi kubwa inaonyesha cheo cha kipekee kinachobainishwa na muktadha, bila kuongeza 'wake' ambayo haipo wazi katika Kigiriki.
- source_word: ὃν ἔθηκεν κληρονόμον πάντων
  choice: ambaye alimweka kuwa mrithi wa vitu vyote
  rationale: '''Alimweka kuwa'' huwasilisha maana ya kumteua au kumsimamisha katika nafasi; ''vitu vyote'' huhifadhi upana wa πάντων.'
- source_word: δι’ οὗ
  choice: kupitia yeye
  rationale: Huwasilisha διά pamoja na jenitivi kama uhusika wa kati bila kuifanya kuwa kauli ya chombo tu.
- source_word: ἐποίησεν
  choice: alifanya
  rationale: Ni pana kama ποιέω kuliko 'aliumba'; muktadha unaifanya ieleweke kuwa tendo la Mungu la kufanya kuwepo.
- source_word: τοὺς αἰῶνας
  choice: nyakati
  rationale: Huhifadhi kwanza maana ya msingi ya vipindi au zama na kuepuka kuifunga mapema kwa ulimwengu wa kimaada pekee; upana wa maana unaelezwa katika tanbihi.
theological_decisions:
- issue: Nguvu ya Kikristo ya ἐν υἱῷ
  choice: katika Mwana
  alternative: kwa njia ya Mwana; katika Mwana wake
  rationale: Muundo huu huhifadhi ἐν na kutokuwapo kwa kibainishi katika Kigiriki kadiri Kiswahili kinavyoruhusu, huku muktadha ukimtambulisha Mwana huyo kuwa wa pekee. Hauongezi kimya kimya kiwakilishi 'wake' wala kupunguza usemi kuwa uhusika tu.
- issue: Upeo wa τοὺς αἰῶνας katika kazi ya Mwana
  choice: nyakati
  alternative: ulimwengu; malimwengu; vyote vilivyopo
  rationale: Neno la Kigiriki linaweza kutaja zama na, kwa upanuzi, mpangilio mzima wa uumbaji. Matini kuu inadumisha mvutano huo wa wakati na ulimwengu, huku tanbihi ikionyesha maana pana ya kiumbe chote.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inaendeleza kisarufi mstari wa 1, kama ilivyo katika Kigiriki. 'Katika Mwana' na 'nyakati' zimeachwa zikiwa na uzito na upana wa matini chanzi, huku tanbihi zikisaidia msomaji wa kawaida.
