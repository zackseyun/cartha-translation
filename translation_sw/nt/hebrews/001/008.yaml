base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/008.yaml
  text: But of the Son he says[a], “Your throne, O God, is forever and ever[b], and the scepter of uprightness is the scepter of your kingdom.”
translation:
  language: sw
  text: Lakini kuhusu Mwana, asema, “Kiti chako cha enzi, Ee Mungu[a], ni milele na milele, na fimbo ya unyoofu[b] ndiyo fimbo ya ufalme wako.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa uwezekano mdogo zaidi: “Mungu ndiye kiti chako cha enzi milele na milele.” Muundo wa Kigiriki umejadiliwa, lakini mwito wa moja kwa moja, “Kiti chako cha enzi, Ee Mungu,” unafaa zaidi katika muktadha na katika nguvu ya nukuu.'
    reason: alternative_reading
  - marker: b
    text: Au “uadilifu.” Neno la Kigiriki linaweza kumaanisha unyoofu, usawa wa maadili, au uadilifu.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς δὲ τὸν υἱόν
  choice: Lakini kuhusu Mwana, anasema
  rationale: πρός pamoja na nomino katika hali ya accusative, katika mfululizo huu wa manukuu, inaweza kuonyesha anayelengwa au anayehusu usemi. ‘Kuhusu Mwana, anasema’ ni Kiswahili cha asili kinachoweka wazi kitenzi kilichodokezwa na kudumisha utofautishaji na malaika.
- source_word: υἱόν
  choice: Mwana
  rationale: Nomino hii ina matumizi ya cheo mahususi katika muktadha. Herufi kubwa inadumisha maana ya cheo ‘Mwana’ bila kuongeza ‘wake,’ ambalo halimo wazi hapa.
- source_word: Ὁ θρόνος σου ὁ θεὸς
  choice: Kiti chako cha enzi, Ee Mungu
  rationale: Usomaji unaofaa zaidi kimuktadha unaelewa ὁ θεός kama mwito wa moja kwa moja. ‘Kiti chako cha enzi, Ee Mungu’ ni usemi wa heshima na wa kawaida katika Kiswahili, huku uwezekano wa kisarufi wa ‘Mungu ndiye kiti chako cha enzi’ ukihifadhiwa katika tanbihi.
- source_word: εἰς τὸν αἰῶνα τοῦ αἰῶνος
  choice: ni cha milele na milele
  rationale: Nahau hii inaonyesha muda usio na mwisho. ‘Milele na milele’ hudumisha msisitizo wake kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: ῥάβδος
  choice: fimbo
  rationale: Katika muktadha wa kifalme neno hili ni fimbo ya mtawala, ishara ya mamlaka. ‘Fimbo’ ni neno la Kiswahili linaloeleweka kwa urahisi; muktadha wa ufalme unaonyesha matumizi yake ya kifalme.
- source_word: τῆς εὐθύτητος
  choice: ya unyoofu
  rationale: εὐθύτης humaanisha unyoofu au uadilifu wa mwenendo. ‘Unyoofu’ hudumisha taswira ya msingi ya kuwa sawa bila kuifanya moja kwa moja kuwa istilahi pana ya ‘haki.’
- source_word: ῥάβδος τῆς βασιλείας σου
  choice: fimbo ya ufalme wako
  rationale: βασιλεία hapa inaweza kumaanisha ufalme, utawala, au enzi. ‘Ufalme wako’ ni tafsiri ya moja kwa moja na ya asili inayofaa taswira ya kifalme.
theological_decisions:
- issue: Ikiwa ὁ θεός anamwita Mwana moja kwa moja ‘Mungu’ au inapaswa kueleweka kama kiarifu, ‘Mungu ndiye kiti chako cha enzi.’
  choice: 'Mwito wa moja kwa moja: ‘Kiti chako cha enzi, Ee Mungu.’'
  alternative: ‘Mungu ndiye kiti chako cha enzi milele na milele.’
  rationale: Katika hoja ya Waebrania 1 na nguvu ya nukuu, mwito wa moja kwa moja unafaa zaidi na unaendana na usomaji wa kawaida wa Zaburi 45:6 katika Septuajinti. Hata hivyo, kwa kuwa muundo wa Kigiriki umejadiliwa, usomaji mwingine haujafichwa bali umewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. ‘Kiti cha enzi’ na ‘fimbo ya ufalme’ hudumisha taswira ya kifalme. Alama zote za tanbihi zimewekwa katika matini kuu.
