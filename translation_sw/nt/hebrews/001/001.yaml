  text: Long ago[c][b][a], God spoke to the fathers in many parts and in many ways by the prophets.
translation:
  language: sw
  text: Hapo zamani, Mungu aliwambia mababu[a] kwa sehemu nyingi[b] na kwa njia nyingi kupitia manabii[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wahenga”; Kigiriki kinasema “mababa.”
    reason: lexical_alternative
  - marker: b
    text: Au, “katika sehemu nyingi.” Usemi wa Kigiriki unatofautisha ufunuo uliotolewa kwa sehemu nyingi na njia nyingi ambazo ulitolewa.
    reason: lexical_alternative
  - marker: c
    text: Au, “kwa njia ya manabii”; kwa tafsiri sisisi, “ndani ya manabii.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πολυμερῶς
  choice: kwa sehemu nyingi
  rationale: Huhifadhi wazo la ufunuo kutolewa katika sehemu nyingi na kulitofautisha na πολυτρόπως, inayohusu njia mbalimbali.
- source_word: πολυτρόπως
  choice: kwa njia nyingi
  rationale: Ni Kiswahili cha kawaida kinachoonyesha utofauti wa namna ambazo Mungu alisema, bila kuchanganya maana yake na ‘kwa sehemu nyingi.’
- source_word: πάλαι
  choice: Hapo zamani
  rationale: Ni usemi wa asili na wenye heshima unaoonyesha wakati wa kale bila kutumia lugha iliyopitwa na wakati.
- source_word: ὁ θεὸς
  choice: Mungu
  rationale: Ni tafsiri ya moja kwa moja ya nomino iliyo kiima cha sentensi.
- source_word: λαλήσας
  choice: alisema
  rationale: Ingawa ni kitenzi-shirikishi cha wakati uliopita kinachokamilishwa kisintaksia katika mstari wa 2, kitenzi kamili kinafanya mstari huu usomeke kwa ufasaha peke yake huku kikihifadhi mlinganisho wa nyakati.
- source_word: τοῖς πατράσιν
  choice: na mababu
  rationale: Katika Kiswahili, ‘kusema na’ huwasilisha kwa kawaida tendo la kuwaambia watu; ‘mababu’ huhifadhi lugha ya kifamilia na kihistoria ya neno la Kigiriki bila kuongeza ‘wetu.’
- source_word: ἐν τοῖς προφήταις
  choice: kupitia manabii
  rationale: Huwasilisha matumizi ya manabii kama mawakala ambao kupitia kwao Mungu alisema. Pia ni usemi wa asili kuliko tafsiri sisisi ‘ndani ya manabii.’
theological_decisions:
- issue: Uhusiano wa kitenzi-shirikishi λαλήσας na kitenzi kikuu katika Waebrania 1:2
  choice: Kutumia kitenzi kamili ‘Mungu alisema’ katika mstari wa 1
  alternative: 'Kutafsiri kwa muundo wa utegemezi: ‘Baada ya Mungu kusema…’ au ‘Mungu, akiwa amesema…’'
  rationale: Kigiriki huunganisha mstari wa 1 na wa 2 kisintaksia, lakini kitenzi kamili hufanya mstari huu ueleweke unaposomwa peke yake. Hakiongezi hitimisho la kitheolojia, na bado kinaacha nafasi ya mlinganisho kati ya kusema hapo zamani na kusema katika Mwana katika mstari wa 2.
- issue: Maana ya ἐν τοῖς προφήταις
  choice: kupitia manabii
  alternative: kwa manabii; ndani ya manabii
  rationale: ‘Kupitia manabii’ humtambulisha Mungu kuwa msemaji na manabii kuwa vyombo vya kusema kwake, huku tanbihi ikihifadhi uwezekano wa tafsiri nyingine na umbo sisisi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mpangilio ‘kwa sehemu nyingi na kwa njia nyingi’ umehifadhiwa ili kuonyesha tofauti ya adverbia mbili za Kigiriki. ‘Mababu’ limetumiwa bila kuongeza ‘wetu,’ na tanbihi inaonyesha mbadala unaojumuisha vizazi vilivyotangulia.
