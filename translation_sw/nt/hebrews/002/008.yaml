  terminology: “Kutiisha” appropriately represents the ὑποτάσσω word group. “Vikiwa vimetiishwa” is retained to convey the resultant state of the Greek perfect passive participle. Pronouns remain unspecified in the text, preserving the Psalm 8/Hebrews ambiguity.
