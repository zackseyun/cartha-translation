  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: πάντα ὑπέταξας ὑποκάτω τῶν ποδῶν αὐτοῦ· ἐν ⸂τῷ γὰρ⸃ ⸀ὑποτάξαι τὰ πάντα οὐδὲν ἀφῆκεν αὐτῷ ἀνυπότακτον. νῦν δὲ οὔπω ὁρῶμεν αὐτῷ τὰ πάντα ὑποτεταγμένα·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/008.yaml
  text: You subjected all things under his feet.” For in subjecting all things to him[a], he left nothing not subjected to him[b]. But now we do not yet see all things subjected to him.
translation:
  language: sw
  text: “Ulivitiisha vitu vyote chini ya miguu yake.”[a] Kwa maana, alipovitiisha vitu vyote kwake[b], hakuacha chochote kisichotiishwa kwake. Lakini sasa bado hatuoni vitu vyote vikiwa vimetiishwa kwake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Viwakilishi “yake” na “kwake” vinaakisi Zaburi 8. Katika muktadha, vinaweza kuelekeza kwa wanadamu katika maana ya awali ya zaburi na kwa Yesu katika matumizi yake katika Waebrania.
    reason: cross_reference
  - marker: b
    text: Au, “kwa kuvitiisha vitu vyote kwake.” Muundo wa Kigiriki unaweza pia kutafsiriwa kwa maana ya kimawazo badala ya maana ya wakati.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: vitu vyote
  rationale: Nomino ya wingi ya jinsia ya kati ina maana pana na ya ujumla; “vitu vyote” ni Kiswahili cha kawaida kinachohifadhi upeo huo.
- source_word: ὑπέταξας
  choice: umevitiisha
  rationale: Kauli hii inaeleza kuweka chini ya mamlaka na inadumisha mzizi uleule wa maana unaorudiwa katika mstari mzima.
- source_word: ὑποκάτω τῶν ποδῶν αὐτοῦ
  choice: chini ya miguu yake
  rationale: Ni nahau ya mamlaka na ushindi, na pia inadumisha mwangwi wa Zaburi 8.
- source_word: ἐν τῷ ... ὑποτάξαι
  choice: kwa kuvitiisha
  rationale: Muundo huu unaweza kueleweka kimawazo au kiwakati. “Kwa kuvitiisha” unaonyesha tendo linalotolewa kama msingi wa hitimisho linalofuata bila kufunga uwezekano wa tafsiri ya kiwakati.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Kiunganishi hiki kinaanzisha maelezo ya dondoo iliyotangulia na kuendeleza hoja kwa njia ya kawaida katika Kiswahili.
- source_word: οὐδὲν ἀφῆκεν
  choice: hakuacha chochote
  rationale: Ni usemi wa asili unaohifadhi dai kwamba hakuna kitu kilichoachwa nje.
- source_word: ἀνυπότακτον
  choice: kisichotiishwa
  rationale: Uchaguzi huu unaweka wazi hali ya kutokuwa chini ya mamlaka na kuhifadhi uhusiano na kitenzi ὑποτάσσω kinachorudiwa.
- source_word: νῦν δὲ οὔπω ὁρῶμεν
  choice: Lakini sasa bado hatuoni
  rationale: Maneno haya yanaonyesha tofauti kati ya tamko la Maandiko na hali inayoonekana kwa sasa, pamoja na maana ya “bado si.”
- source_word: ὑποτεταγμένα
  choice: vikiwa vimetiishwa
  rationale: Muundo huu unaonyesha hali iliyotokana na tendo la kutiisha, kulingana na nguvu ya hali timilifu ya Kigiriki.
theological_decisions:
- issue: Anayerejelewa na viwakilishi αὐτοῦ / αὐτῷ
  choice: Viwakilishi “yake/kwake” vimehifadhiwa bila kumtaja anayerejelewa.
  alternative: Kutaja wazi wanadamu kwa maana ya awali ya Zaburi 8, au Yesu kwa matumizi ya mwandishi wa Waebrania.
  rationale: Katika Zaburi 8, maneno hayo yanawahusu wanadamu, lakini Waebrania anayatumia katika hoja inayofikia kilele chake kwa Yesu. Kuhifadhi viwakilishi kunadumisha mvutano huo wa kitheolojia badala ya kuutatua kimyakimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Marudio ya mzizi “-tiisha” yamehifadhiwa ili kuonyesha mshikamano wa hoja ya Kigiriki; viwakilishi vimeachwa bila ufafanuzi wa ziada ili kutunza utata halisi wa kifungu.
