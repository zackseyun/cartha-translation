  text: For surely it is not angels that he helps[a], but the offspring of Abraham.
translation:
  language: sw
  text: Kwa maana hakika si malaika anaowasaidia,[a] bali ni uzao wa Abrahamu anaousaidia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “anaowashika ... anaoushika”; kitenzi cha Kigiriki kinaweza kumaanisha “kushika,” lakini hapa huenda kinamaanisha “kusaidia” au “kuja kuwasaidia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δήπου
  choice: hakika
  rationale: Neno hili linaongeza msisitizo wa jambo linalotazamiwa kuwa wazi kwa wasomaji; “hakika” linaonyesha nguvu hiyo kwa Kiswahili cha kawaida.
- source_word: ἀγγέλων
  choice: malaika
  rationale: Hili ndilo neno la kawaida na la moja kwa moja kwa kundi linalotofautishwa na uzao wa Abrahamu.
- source_word: ἐπιλαμβάνεται
  choice: anawasaidia / anaousaidia
  rationale: Katika muktadha huu kitenzi kinaeleweka kwa uwezekano mkubwa kuwa kushika ili kusaidia au kuja kuwaokoa. Upatanisho wa kisarufi hubadilika kulingana na yambwa, lakini maana ileile imedumishwa katika sehemu zote mbili.
- source_word: σπέρματος Ἀβραὰμ
  choice: uzao wa Abrahamu
  rationale: “Uzao” huhifadhi umbo la umoja lenye maana ya kijumla la σπέρμα na pia ni lugha ya asili na yenye hadhi katika Kiswahili.
- source_word: οὐ γὰρ ... ἀλλὰ
  choice: Kwa maana ... si ... bali ...
  rationale: Muundo huu unadumisha uhusiano na hoja iliyotangulia pamoja na utofautishaji mkali kati ya malaika na uzao wa Abrahamu.
theological_decisions:
- issue: Maana ya ἐπιλαμβάνεται kuhusiana na kazi ya wokovu ya Mwana
  choice: Mwana anausaidia uzao wa Abrahamu, si malaika.
  alternative: Mwana anaushika uzao wa Abrahamu, jambo linaloweza kusisitiza kujitwalia kwake asili ya kibinadamu.
  rationale: Muktadha wa karibu unazungumzia ushirika wa Mwana na wanadamu na tendo lake la kuwaokoa. Maana ya kimuktadha ya “kusaidia” inafaa zaidi, lakini maana halisi ya “kushika” imehifadhiwa katika tanbihi ili kutoondoa mvutano wa kileksika na kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Marudio ya kitenzi yamedumishwa ili kuakisi msisitizo na ulinganifu wa sentensi ya Kigiriki.
