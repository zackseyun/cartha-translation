  text: τὸν δὲ βραχύ τι παρ’ ἀγγέλους ἠλαττωμένον βλέπομεν Ἰησοῦν διὰ τὸ πάθημα τοῦ θανάτου δόξῃ καὶ τιμῇ ἐστεφανωμένον, ὅπως ⸀χωρὶς θεοῦ ὑπὲρ παντὸς γεύσηται θανάτου.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/009.yaml
  text: But we see Jesus[a], who was made lower than the angels for a little while, crowned with glory and honor because of the suffering of death, so that by the grace of God he might taste death for everyone.
translation:
  language: sw
  text: Lakini tunamwona Yesu, aliyefanywa kuwa chini kuliko malaika kwa muda mfupi, akiwa ametawazwa kwa utukufu na heshima kwa sababu ya mateso ya kifo, ili, pasipo Mungu[a], aonje mauti kwa ajili ya kila mtu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati husoma, “kwa neema ya Mungu,” badala ya “pasipo Mungu.”
    reason: textual_variant
lexical_decisions:
- source_word: βραχύ τι
  choice: kwa muda mfupi
  rationale: Katika muktadha wa Zaburi 8, kirai hiki kinaeleweka zaidi kwa maana ya muda kuliko kiwango; kinaonyesha kwamba Yesu alikuwa chini ya malaika kwa kipindi kifupi.
- source_word: παρ’ ἀγγέλους
  choice: chini kuliko malaika
  rationale: Baada ya ἐλαττόω, παρά pamoja na accusative ina nguvu ya ulinganisho; tafsiri hii inaonyesha wazi ulinganisho huo.
- source_word: ἠλαττωμένον
  choice: aliyefanywa kuwa chini
  rationale: Huhifadhi hali ya kutendwa ya participle na wazo la kuwekwa katika nafasi ya chini bila kuifanya iwe tu unyenyekevu wa kihisia.
- source_word: διὰ τὸ πάθημα τοῦ θανάτου
  choice: kwa sababu ya mateso ya kifo
  rationale: διά pamoja na accusative hapa inaonyesha sababu ya kuvikwa taji; muundo huu pia huhifadhi kwa ukaribu uhusiano wa πάθημα na θάνατος.
- source_word: δόξῃ καὶ τιμῇ ἐστεφανωμένον
  choice: akiwa amevikwa taji la utukufu na heshima
  rationale: Huhifadhi taswira ya στεφανόω na mada ya kuinuliwa kwa Yesu kwa lugha ya kawaida na yenye hadhi.
- source_word: ὅπως
  choice: ili kwamba
  rationale: Huonyesha kusudi au matokeo yaliyokusudiwa ya kishazi kinachofuata.
- source_word: χωρὶς θεοῦ
  choice: pasipo Mungu
  rationale: Hii ndiyo tafsiri ya moja kwa moja ya usomaji uliopo katika matini ya Kigiriki iliyotolewa. Kauli hiyo imeachwa na mvutano wake wa kimaana badala ya kufafanuliwa kimadhehebu.
- source_word: ὑπὲρ παντός
  choice: kwa ajili ya kila mtu
  rationale: Katika muktadha huu, usemi ni wa kugawa kwa kila mmoja na unaelekea kwa watu; tafsiri hii ni ya kawaida katika Kiswahili na huhifadhi maana ya kutenda kwa niaba yao.
- source_word: γεύσηται θανάτου
  choice: aonje mauti
  rationale: Huhifadhi sitiari ya γεύομαι, ambayo inaeleweka katika Kiswahili cha kibiblia na chenye hadhi.
theological_decisions:
- issue: Tofauti ya matini katika kishazi cha kusudi
  choice: pasipo Mungu
  alternative: kwa neema ya Mungu
  rationale: Matini ya Kigiriki iliyotolewa inasoma χωρὶς θεοῦ, ‘pasipo Mungu,’ ilhali hati nyingi zina χάριτι θεοῦ, ‘kwa neema ya Mungu.’ Kwa kuwa kazi hii inaanzia ushahidi wa lugha asili, usomaji uliotolewa umewekwa katika matini kuu, na usomaji mwingine muhimu umehifadhiwa katika tanbihi bila kuondoa mvutano wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Mauti’ limetumiwa katika sitiari ‘aonje mauti,’ huku miundo mingine ikiwekwa wazi na ya kawaida. Neno ‘sasa’ linaweka wazi tofauti kati ya hali ya awali ya kufanywa chini na hali inayoonekana ya kuvikwa taji.
