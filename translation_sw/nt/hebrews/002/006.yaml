  text: διεμαρτύρατο δέ πού τις λέγων· Τί ἐστιν ἄνθρωπος ὅτι μιμνῄσκῃ αὐτοῦ, ἢ υἱὸς ἀνθρώπου ὅτι ἐπισκέπτῃ αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/006.yaml
  text: But someone has testified somewhere[a], saying, “What is man, that you remember him, or the son of man[c][b], that you care for him?”
translation:
  language: sw
  text: Lakini mtu fulani ameshuhudia mahali fulani, akisema, “Mwanadamu ni nini hata umkumbuke, au mwana wa mwanadamu[b] hata umjali[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hata umtembelee” au “hata umhudumie.” Kitenzi cha Kigiriki kinaweza kumaanisha kumjali mtu kwa kumtembelea au kumtunza.
    reason: lexical_alternative
  - marker: b
    text: Hapa “mwana wa mwanadamu” ni mwangwi wa Zaburi 8:4, ambako ni usemi wa kishairi unaowakilisha wanadamu; katika Waebrania, muktadha mpana pia unaipa aya hii umuhimu unaomhusu Yesu.
    reason: cross_reference
lexical_decisions:
- source_word: διεμαρτύρατο
  choice: ameshuhudia
  rationale: Kitenzi hiki kina maana ya kutoa ushuhuda kwa msisitizo. ‘Ameshuhudia’ ni Kiswahili cha kawaida na chenye heshima kinachofaa katika utangulizi wa ushuhuda wa Maandiko.
- source_word: δέ
  choice: Lakini
  rationale: δέ huonyesha mpito au utofautishaji wa kiasi; ‘Lakini’ linafaa katika mtiririko wa hoja kutoka mstari uliotangulia.
- source_word: πού τις
  choice: mahali fulani mtu fulani
  rationale: Muundo huu unadumisha hali isiyotaja mahali wala msemaji kwa jina, bila kudokeza kwamba mwandishi hakujua kifungu kilikotoka.
- source_word: Τί ἐστιν ἄνθρωπος
  choice: Mwanadamu ni nini
  rationale: ‘Mwanadamu’ ni nomino ya umoja yenye maana jumuishi, inayohifadhi muundo wa kishairi na uwakilishi wa wanadamu wote.
- source_word: μιμνῄσκῃ αὐτοῦ
  choice: umkumbuke
  rationale: Kitenzi hiki humaanisha kumkumbuka au kumweka akilini; ‘umkumbuke’ ni tafsiri ya moja kwa moja, ya kawaida, na iliyo wazi.
- source_word: υἱὸς ἀνθρώπου
  choice: mwana wa mwanadamu
  rationale: Tafsiri hii inahifadhi maneno na mwangwi wa Zaburi 8 bila kuamua mapema ikiwa usemi huo unapaswa kueleweka tu kwa maana ya wanadamu kwa jumla au pia kwa uhusiano wake na Yesu katika muktadha mpana.
- source_word: ἐπισκέπτῃ αὐτόν
  choice: umjali
  rationale: Kitenzi kinaweza kumaanisha kumtembelea, kumwangalia, au kumtunza mtu kwa uangalifu. ‘Umjali’ huwasilisha kwa Kiswahili cha sasa wazo la uangalifu wenye kujali bila kudokeza ziara ya kawaida tu.
theological_decisions:
- issue: Ikiwa ‘mwana wa mwanadamu’ itafsiriwe kwa namna inayotangaza wazi cheo cha Kimasihi
  choice: Kuhifadhi ‘mwana wa mwanadamu’ katika herufi za kawaida kama ilivyo katika nukuu ya Zaburi.
  alternative: Kutafsiri kwa maana ya jumla kama ‘binadamu,’ au kutumia herufi kubwa ili kuonyesha wazi cheo kinachomhusu Masihi.
  rationale: Katika Zaburi 8 usemi huu ni sambamba ya kishairi inayowahusu wanadamu; Waebrania pia huupa umuhimu unaomhusu Yesu katika muktadha unaofuata. Tafsiri hii inahifadhi mvutano huo bila kuulazimisha upande mmoja katika mstari huu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mpangilio wa kishairi wa maswali mawili umehifadhiwa. ‘Mwanadamu’ na ‘mwana wa mwanadamu’ zinaendeleza ulinganifu wa chanzo, huku ‘umjali’ ikiwa wazi zaidi kwa msomaji wa kawaida; maana nyingine halali zimewekwa katika tanbihi.
