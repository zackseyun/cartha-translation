  text: Ἐπεὶ οὖν τὰ παιδία κεκοινώνηκεν ⸂αἵματος καὶ σαρκός⸃, καὶ αὐτὸς παραπλησίως μετέσχεν τῶν αὐτῶν, ἵνα διὰ τοῦ θανάτου καταργήσῃ τὸν τὸ κράτος ἔχοντα τοῦ θανάτου, τοῦτ’ ἔστι τὸν διάβολον,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/014.yaml
  text: Therefore[a], since the children share in flesh and blood, he himself likewise partook of the same things, so that through death he might nullify the one who has the power of death—that is, the devil[b],
translation:
  language: sw
  text: Kwa hiyo, kwa kuwa watoto wana sehemu katika damu na mwili[a], yeye mwenyewe pia alishiriki katika hayo hayo kwa namna iyo hiyo, ili kwa njia ya kifo amfanye asiwe na nguvu[b] yule mwenye mamlaka ya mauti, yaani, Ibilisi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kigiriki: “damu na mwili.” Usemi wa kawaida wa Kiswahili unaweza kuwa “mwili na damu.”'
    reason: lexical_alternative
  - marker: b
    text: Au “amwangamize”; kitenzi cha Kigiriki kinaweza kumaanisha kufanya asiwe na nguvu, kubatilisha, au kuondoa uwezo wa kutenda, si lazima kumaliza kuwapo kwake.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐπεὶ οὖν
  choice: Kwa hiyo, kwa kuwa
  rationale: Huhifadhi nguvu ya hitimisho ya οὖν na maana ya sababu ya ἐπεί kwa Kiswahili cha kawaida.
- source_word: τὰ παιδία
  choice: watoto
  rationale: Hurejelea kwa uwazi watoto waliotajwa katika muktadha bila kuongeza tafsiri ya kiitikadi.
- source_word: κεκοινώνηκεν
  choice: wanashiriki
  rationale: Wakati uliopo wa Kiswahili unaeleza hali ya kuwa na sehemu katika hali hiyo, ambayo inalingana na athari ya kitenzi cha Kigiriki cha wakati timilifu.
- source_word: αἵματος καὶ σαρκός
  choice: damu na mwili
  rationale: Huhifadhi mpangilio wa Kigiriki. Hapa σάρξ ni mwili wa kibinadamu, si ‘asili ya dhambi.’
- source_word: παραπλησίως
  choice: vivyo hivyo
  rationale: Huonyesha ushiriki halisi unaofanana, bila kulazimisha wazo la kufanana kwa kila hali.
- source_word: μετέσχεν τῶν αὐτῶν
  choice: alishiriki ... katika vitu hivyo
  rationale: Huhifadhi wazo la kushiriki katika yale yale na pia tofauti ya kitenzi dhidi ya κοινωνέω katika kishazi cha kwanza.
- source_word: διὰ τοῦ θανάτου
  choice: kwa njia ya kifo
  rationale: Huonyesha kifo kuwa njia au chombo cha kutimiza kusudi.
- source_word: καταργήσῃ
  choice: amfanye asiwe na nguvu
  rationale: Hueleza kuondolewa kwa uwezo wa kutenda bila kudokeza kwamba Ibilisi aliangamizwa na kutokuwapo kabisa.
- source_word: τὸ κράτος ἔχοντα τοῦ θανάτου
  choice: yule mwenye nguvu ya mauti
  rationale: Ni tafsiri ya wazi ya mamlaka au uwezo unaohusishwa na mauti, huku ikihifadhi muundo wa chanzo.
- source_word: τοῦτ’ ἔστι τὸν διάβολον
  choice: yaani, Ibilisi
  rationale: ‘Yaani’ hutambulisha ufafanuzi wa moja kwa moja; ‘Ibilisi’ ni jina lililozoeleka la διάβολος katika Kiswahili cha Biblia.
theological_decisions:
- issue: Ushiriki wa Kristo katika hali ya kibinadamu
  choice: yeye mwenyewe pia alishiriki vivyo hivyo katika vitu hivyo
  alternative: yeye pia akawa na damu na mwili kama wao
  rationale: Tafsiri hii inathibitisha ushiriki wake halisi katika hali yao huku ikihifadhi tahadhari ya παραπλησίως na tofauti ya vitenzi viwili vya Kigiriki, bila kuingiza fomula ya baadaye ya kiteolojia.
- issue: Maana ya καταργήσῃ kuhusu Ibilisi
  choice: amfanye asiwe na nguvu
  alternative: amwangamize
  rationale: Kitenzi kinaweza kumaanisha kubatilisha, kuondoa nguvu, au kufanya kisitende kazi; hivyo tafsiri kuu haidokezi kutoweka kabisa kwa Ibilisi. Tafsiri ya jadi imeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Mauti’ limetumiwa katika kishazi kinachohusu mamlaka ya kifo ili kudumisha uzito wa kifungu; ‘kifo’ limetumiwa kwa tukio la kufa kwa Kristo. Alama zote za tanbihi zimo katika matini kuu.
