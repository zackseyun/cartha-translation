  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: πῶς ἡμεῖς ἐκφευξόμεθα τηλικαύτης ἀμελήσαντες σωτηρίας, ἥτις, ἀρχὴν λαβοῦσα λαλεῖσθαι διὰ τοῦ κυρίου, ὑπὸ τῶν ἀκουσάντων εἰς ἡμᾶς ἐβεβαιώθη,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/003.yaml
  text: How will we escape if we neglect so great a salvation? This salvation[a], having at first been spoken through the Lord, was confirmed to us by those who heard him,
translation:
  language: sw
  text: Tutaponyokaje ikiwa tunaupuuza wokovu mkuu namna hii? Wokovu huu[a], ambao ulianza kunenwa kupitia kwa Bwana, ulithibitishwa kwetu na wale waliomsikia,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ambao, baada ya kuanza kunenwa kupitia kwa Bwana, ulithibitishwa kwetu na wale waliomsikia.”
    reason: Mbadala huu huhifadhi muundo wa kiwakilishi cha Kigiriki kwa ukaribu zaidi bila kurudia ‘Wokovu huu’ kama mwanzo wa sentensi mpya.
lexical_decisions:
- source_word: πῶς ἡμεῖς ἐκφευξόμεθα
  choice: Tutaponyokaje
  rationale: Huhifadhi swali la balagha katika wakati ujao na uzito wa onyo bila kuligeuza kuwa kauli ya moja kwa moja kwamba kuponyoka hakuwezekani.
- source_word: τηλικαύτης
  choice: mkuu namna hii
  rationale: Ni usemi wa kawaida wa Kiswahili unaosisitiza ukubwa wa wokovu unaozungumziwa.
- source_word: ἀμελήσαντες
  choice: ikiwa tunaupuuza
  rationale: Kishirikishi cha Kigiriki kina nguvu ya sharti katika onyo hili. ‘Kupuuza’ huonyesha kutokujali au kutotilia maanani, si kukataa waziwazi tu.
- source_word: σωτηρίας
  choice: wokovu
  rationale: Ni neno la kawaida na linalofaa katika muktadha wa Waebrania, likibeba maana ya kuokolewa na ukombozi wa Mungu.
- source_word: ἥτις
  choice: Wokovu huu[a], ambao
  rationale: Kurudia nomino huweka wazi rejeo la kiwakilishi. Tanbihi huhifadhi uwezekano wa muundo wa karibu zaidi na Kigiriki bila kurudia nomino.
- source_word: ἀρχὴν λαβοῦσα λαλεῖσθαι
  choice: ulianza kunenwa
  rationale: Huwasilisha kwa Kiswahili cha asili maana ya kuanza kutamkwa au kutangazwa, huku ikihifadhi hali tendwa ya ujumbe huo.
- source_word: διὰ τοῦ κυρίου
  choice: kupitia kwa Bwana
  rationale: Huhifadhi wazo la uwasilishaji au wakala katika διά pamoja na cheo ‘Bwana’.
- source_word: ὑπὸ τῶν ἀκουσάντων
  choice: na wale waliomsikia
  rationale: Huwatambulisha waliosikia moja kwa moja; kiambishi ‘-m-’ kinaweka wazi kwamba waliyemsikia ni Bwana, kama muktadha unavyoonyesha.
- source_word: εἰς ἡμᾶς ἐβεβαιώθη
  choice: ulithibitishwa kwetu
  rationale: Hutoa maana ya ujumbe kuthibitishwa na kufikishwa kwa wapokeaji bila kuongeza maelezo yasiyokuwapo katika mstari.
theological_decisions:
- issue: Rejeo la ‘Bwana’ (τοῦ κυρίου)
  choice: Cheo ‘Bwana’ kinahifadhiwa, na ‘waliomsikia’ kinaonyesha kuwa rejeo katika muktadha ni Yesu.
  alternative: Kulielewa kama rejeo la jumla kwa Mungu aliye Bwana.
  rationale: Mfuatano wa ujumbe kunenwa kupitia kwa Bwana na kuthibitishwa na waliomsikia unaelekea kwa huduma ya Yesu na ushuhuda wa wale waliomsikia, bila kuongeza dai zaidi ya mstari.
- issue: Nguvu ya swali la onyo
  choice: Swali la balagha ‘Tutaponyokaje...?’ linahifadhiwa.
  alternative: ‘Hakika hatutaponyoka tukipuuza...’
  rationale: Kigiriki kina swali la wakati ujao lenye onyo kali; kulihifadhi kama swali hudumisha mvutano wa kifungu bila kuligeuza kuwa tamko la wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Kupuuza’ ni wazi kwa wasomaji wa kawaida; ‘kunenwa’ huhifadhi uzito wa lugha ya kibiblia bila kuwa ya kizamani kupita kiasi. Koma ya mwisho imehifadhiwa kwa sababu mstari unaendelea katika Waebrania 2:4.
