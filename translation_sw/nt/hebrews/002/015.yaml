base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/015.yaml
  text: and free those who[a], through fear of death, were subject to slavery all their lives.
translation:
  language: sw
  text: na kuwaweka huru wale ambao, kwa hofu ya kifo, walikuwa chini ya utumwa[a] maisha yao yote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walishikiliwa katika utumwa” au “walikuwa utumwani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπαλλάξῃ
  choice: kuwaweka huru
  rationale: Kitenzi hiki humaanisha kuachilia au kuweka huru kutoka katika hali inayomfunga mtu. “Kuwaweka huru” ni Kiswahili cha kawaida na hudumisha uhusiano wake na utumwa unaotajwa baadaye.
- source_word: τούτους, ὅσοι
  choice: wale wote ambao
  rationale: Muunganiko huu unaonyesha kundi lote lenye sifa inayofuata. “Wale wote ambao” ni wa asili katika Kiswahili na unaonyesha vizuri maana jumuishi ya ὅσοι.
- source_word: φόβῳ θανάτου
  choice: kwa sababu ya hofu ya kifo
  rationale: Kauli hii inaonyesha hofu ya kifo kuwa sababu au hali inayotawala. Tafsiri hii ni wazi na ya kawaida bila kuondoa kabisa uwezekano wa maana ya kisababishi au ya njia.
- source_word: διὰ παντὸς τοῦ ζῆν
  choice: maisha yao yote
  rationale: Nahau hii inamaanisha muda wote wa kuishi. “Maisha yao yote” ni usemi wa kawaida wa Kiswahili unaowasilisha muda huo kikamilifu.
- source_word: ἔνοχοι ἦσαν δουλείας
  choice: walikuwa chini ya utumwa
  rationale: ἔνοχος hapa huonyesha kuwa chini ya mamlaka au kifungo cha hali fulani, na δουλεία ni utumwa. Kauli hii inadumisha nguvu ya picha ya utumwa bila kufafanua utaratibu wa kiteolojia ambao mstari wenyewe hautaji.
- source_word: καὶ
  choice: na
  rationale: Kiunganishi hiki huunganisha kishazi hiki na kusudi au matokeo yaliyotajwa katika mstari uliotangulia.
theological_decisions:
- issue: Asili ya utumwa unaohusishwa na hofu ya kifo
  choice: Mstari unaeleza hali halisi ya kuwa chini ya utumwa kwa sababu ya hofu ya kifo, bila kutaja kwa undani utumwa huo ni kwa Ibilisi, dhambi, au hali ya kufa.
  alternative: Kuutaja moja kwa moja kuwa utumwa kwa Ibilisi, utumwa wa dhambi, au hofu ya kimaujudui chini ya hali ya kufa.
  rationale: Ingawa muktadha wa mstari wa 14 unamtaja Ibilisi na nguvu ya kifo, mstari huu wenyewe unasema kwa ujumla kuwa watu walikuwa chini ya utumwa kwa sababu ya hofu ya kifo. Tafsiri haiongezi maelezo ya kimafundisho ambayo hayajasemwa wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo unaendelea kutoka mstari uliotangulia, kwa hiyo unaanza na “na.”
