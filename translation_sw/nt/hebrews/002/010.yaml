id: HEB.2.10
reference: Hebrews 2:10
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἔπρεπεν γὰρ αὐτῷ, δι’ ὃν τὰ πάντα καὶ δι’ οὗ τὰ πάντα, πολλοὺς υἱοὺς εἰς δόξαν ἀγαγόντα τὸν ἀρχηγὸν τῆς σωτηρίας αὐτῶν διὰ παθημάτων τελειῶσαι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/010.yaml
  text: For it was fitting for him—for whom are all things and through whom are all things—in bringing many sons to glory[d][c][b][a], to perfect the pioneer of their salvation through sufferings.
translation:
  language: sw
  text: Kwa maana ilimpasa yeye—ambaye vitu vyote vimekuwapo kwa ajili yake na vimekuwapo kwa njia yake—katika kuwaleta wana wengi kwenye utukufu, kumkamilisha mwanzilishi wa wokovu wao kupitia mateso.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Wana wengi” huhifadhi usemi wa Kigiriki na mkazo wake wa uana na urithi; hapa unawahusisha watoto wote wa Mungu, si wanaume peke yao.
    reason: lexical_alternative
  - marker: b
    text: Au “kiongozi anayeongoza njia,” “mwasisi,” au “mwanzilishi” wa wokovu wao.
    reason: lexical_alternative
  - marker: c
    text: Hapa “kumkamilisha” ni kumfikisha kwenye lengo au utimilifu uliokusudiwa kupitia mateso, si kurekebisha kasoro ya maadili.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔπρεπεν
  choice: ilimpasa
  rationale: Huonyesha kwamba jambo hilo lilifaa na lilipatana na kusudi la Mungu, bila kudokeza kulazimishwa kutoka nje.
- source_word: αὐτῷ
  choice: yeye
  rationale: Kiwakilishi kinamhusu Mungu katika muktadha; vifungu vinavyofuata vinamtambulisha bila kuongeza jina lisilomo katika sentensi.
- source_word: δι’ ὃν τὰ πάντα καὶ δι’ οὗ τὰ πάντα
  choice: ambaye vitu vyote viko kwa ajili yake na ambaye vitu vyote vimekuwako kupitia kwake
  rationale: Hutofautisha kusudi la mwisho (‘kwa ajili yake’) na njia au utendaji (‘kupitia kwake’), huku Kiswahili kikiwa wazi na cha kawaida.
- source_word: πολλοὺς υἱοὺς
  choice: wana wengi
  rationale: Huhifadhi neno la kiume la Kigiriki na mkazo wake wa uana na urithi; katika muktadha linawahusisha watoto wote wa Mungu.
- source_word: εἰς δόξαν
  choice: kwenye utukufu
  rationale: Huonyesha mwendo kuelekea hali au sehemu ya utukufu kwa Kiswahili cha kawaida.
- source_word: ἀγαγόντα
  choice: alipokuwa akiwaleta
  rationale: Huhifadhi uhusiano wa kishiriki na tendo la kumkamilisha bila kuligeuza kwa uhakika kuwa kusudi; pia humtaja Mungu kuwa mtendaji kwa uwazi wa kisarufi.
- source_word: ἀρχηγὸν
  choice: mwanzilishi
  rationale: Huonyesha mtu anayeanzisha jambo na kufungua njia; maana ya uongozi wa kutangulia inaelezwa katika tanbihi kwa sababu hakuna neno moja la Kiswahili linalobeba vipengele vyote.
- source_word: τῆς σωτηρίας αὐτῶν
  choice: wa wokovu wao
  rationale: Ni tafsiri ya kawaida ya muundo wa kimilikishi na huhifadhi rejeleo la wokovu wa wana wengi.
- source_word: διὰ παθημάτων
  choice: kupitia mateso
  rationale: Huhifadhi wingi wa παθημάτων na kuonyesha mateso halisi aliyoyapitia.
- source_word: τελειῶσαι
  choice: kumkamilisha
  rationale: Huhifadhi msamiati muhimu wa Waebrania, kwa maana ya kumfikisha kwenye lengo au utimilifu wa jukumu, si kuondoa kasoro ya maadili.
theological_decisions:
- issue: Maana ya τελειῶσαι kuhusu Mwana
  choice: kumkamilisha
  alternative: kumfikisha kwenye utimilifu / kukamilisha jukumu lake
  rationale: Katika Waebrania, kitenzi kinaweza kumaanisha kufikisha kwenye lengo lililokusudiwa. Hapa hakidokezi kwamba Mwana alikuwa na dosari ya maadili; tanbihi inalinda tofauti hiyo bila kuondoa mvutano wa lugha ya chanzo.
- issue: Upeo wa πολλοὺς υἱοὺς
  choice: wana wengi
  alternative: watoto wengi
  rationale: ‘Wana’ huhifadhi lugha ya uana na urithi ya Kigiriki, huku tanbihi ikibainisha kwamba usemi huo hauwahusu wanaume peke yao.
- issue: Uhusiano wa ἀγαγόντα na τελειῶσαι
  choice: alipokuwa akiwaleta ... kumkamilisha
  alternative: kumkamilisha ... ili kuwaleta
  rationale: Muundo wa kishiriki umehifadhiwa kama hali inayohusiana na tendo kuu. Tafsiri ya wazi ya kusudi kwa ‘ili’ ingeweza kuamua uhusiano ambao sarufi ya Kigiriki haiulazimishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Mistari mirefu imedhibitiwa kwa vistari; mpangilio wa Kigiriki umehifadhiwa kwa kadiri inayowezekana bila kufanya sentensi isieleweke.
