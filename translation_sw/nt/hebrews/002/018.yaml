  - marker: a
    text: 'Au, “alipotiwa katika majaribu” na “wanaotiwa katika majaribu”: “maana, kwa kuwa yeye mwenyewe aliteseka alipotiwa katika majaribu, anaweza kuwasaidia wale wanaotiwa katika majaribu.” Kitenzi cha Kigiriki kinaweza kumaanisha “kujaribu” au “kupima,” kutegemea muktadha.'
