lexical_decisions:
- source_word: ἐν ᾧ
  choice: kwa kuwa
  rationale: Kirai hiki kina maana ya kisababishi hapa, kikionyesha msingi wa uwezo wake wa kusaidia.
- source_word: γὰρ
  choice: kwa maana
  rationale: Neno hili linaunganisha mstari na yaliyotangulia kwa kutoa ufafanuzi; pamoja na «kwa kuwa» linahifadhi nguvu ya γὰρ na ἐν ᾧ bila kufanya Kiswahili kuwa kizito.
- source_word: πέπονθεν
  choice: aliteseka
  rationale: Wakati timilifu wa Kigiriki unaonyesha tukio lililokamilika lenye umuhimu unaoendelea; wakati uliopita unasomeka kwa kawaida katika Kiswahili huku hoja ya sentensi ikidokeza umuhimu huo.
- source_word: αὐτὸς
  choice: yeye mwenyewe
  rationale: Inahifadhi msisitizo wa kiwakilishi kwamba yeye binafsi alipitia mateso hayo.
- source_word: πειρασθείς
  choice: alipojaribiwa
  rationale: Muundo huu ni wa kawaida na unaonyesha kwamba mateso yalihusiana na kujaribiwa kwake. Kitenzi kinaweza pia kumaanisha kupimwa, jambo lililohifadhiwa katika tanbihi.
- source_word: δύναται
  choice: anaweza
  rationale: Huwasilisha kwa uwazi uwezo wake wa sasa wa kutoa msaada.
- source_word: τοῖς πειραζομένοις
  choice: wale wanaojaribiwa
  rationale: Inahifadhi hali inayoendelea ya kitenzi tegemezi cha wakati wa sasa na kuonyesha watu wanaopitia jaribu kwa sasa.
- source_word: βοηθῆσαι
  choice: kuwasaidia
  rationale: Ni Kiswahili cha kawaida na cha heshima kinachowasilisha maana ya kusaidia au kuwajia wenye uhitaji.
theological_decisions:
- issue: Maana ya πειράζω inapotumiwa kumhusu Yesu na waumini
  choice: kujaribiwa
  alternative: kupimwa
  rationale: «Kujaribiwa» huhifadhi maana ya kawaida katika muktadha wa Agano Jipya na uhusiano wake na Waebrania 4:15, bila kudokeza kwamba Yesu alishindwa na jaribu. Kwa kuwa neno la Kigiriki linaweza pia kumaanisha «kupimwa», maana hiyo mbadala imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi na chenye hadhi. Muundo «Kwa maana, kwa kuwa» umetumiwa kuhifadhi kazi tofauti za γὰρ na ἐν ᾧ, ingawa kurudiwa kwa viunganishi kumelainishwa kwa alama ya koma.
