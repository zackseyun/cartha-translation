lexical_decisions:
- source_word: λέγων
  choice: akisema
  rationale: Kitenzi kishirikishi cha wakati uliopo kinatanguliza dondoo; “akisema” ni tafsiri ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: Ἀπαγγελῶ
  choice: nitalitangaza
  rationale: Kitenzi hiki humaanisha kutoa habari au kutangaza waziwazi; “nitalitangaza” kinahifadhi uzito wa tangazo la hadharani.
- source_word: τὸ ὄνομά σου
  choice: jina lako
  rationale: Tafsiri halisi inadumisha maana pana ya kibiblia ya “jina” bila kuipanua kwa kuingiza ufafanuzi ndani ya mstari.
- source_word: τοῖς ἀδελφοῖς μου
  choice: kwa ndugu zangu
  rationale: “Ndugu” ni neno la kawaida la Kiswahili kwa watu wa familia moja au wa jumuiya ya imani; linaweza kutumiwa bila kubainisha jinsia, huku tanbihi ikieleza umbo la Kigiriki.
- source_word: ἐν μέσῳ
  choice: katikati ya
  rationale: Tafsiri hii ya karibu inadumisha mtindo wa kishairi na wazo la kuwa ndani ya mkusanyiko.
- source_word: ἐκκλησίας
  choice: kusanyiko
  rationale: Katika dondoo hili kutoka Zaburi, neno linamaanisha watu waliokusanyika; “kusanyiko” huepuka kulifanya limaanishe taasisi ya kanisa bila ulazima.
- source_word: ὑμνήσω σε
  choice: nitakuimbia sifa
  rationale: Kitenzi kinahusu sifa inayotolewa kwa kuimba; “nitakuimbia sifa” ni Kiswahili cha asili kinachohifadhi maana hiyo ya kimuziki na mhusika anayepewa sifa.
theological_decisions:
- issue: Maana ya kifamilia ya ἀδελφοῖς
  choice: ndugu zangu
  alternative: ndugu zangu wa kiume
  rationale: Umbo la Kigiriki ni la kiume, lakini katika muktadha linaweza kuwahusu waamini wote. Neno la Kiswahili “ndugu” linahifadhi maana ya kifamilia bila kulazimisha uamuzi kuhusu ujumuishi; tanbihi inaweka wazi tofauti ya kisarufi.
- issue: Maana ya ἐκκλησία katika dondoo la Agano la Kale
  choice: kusanyiko
  alternative: mkutano; kanisa
  rationale: “Kusanyiko” linaonyesha watu wa Mungu waliokusanyika na halileti bila lazima maana ya baadaye ya taasisi ya kanisa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kishairi wa dondoo umehifadhiwa kwa “katikati ya kusanyiko,” huku sentensi ikibaki wazi na rahisi kueleweka.
