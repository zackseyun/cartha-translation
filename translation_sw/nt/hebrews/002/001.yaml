  text: For this reason[a], we must pay much closer attention to what we have heard, lest we drift away.
translation:
  language: sw
  text: Kwa sababu hiyo, ni lazima tuzingatie kwa makini zaidi yale tuliyoyasikia, tusije tukateleza na kupita yale tuliyoyasikia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “tukateleza mbali na yale tuliyoyasikia,” au, “tukayaacha yapite.” Kitenzi cha Kigiriki παραρυῶμεν huibua taswira ya kuteleza, kupita, au kuacha kitu kipite.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Kwa sababu hiyo
  rationale: Ni kiunganishi cha kawaida cha Kiswahili kinachohifadhi uhusiano wa sababu na hoja iliyotangulia.
- source_word: δεῖ
  choice: ni lazima
  rationale: Huonyesha ulazima kwa nguvu na kwa lugha ya kawaida.
- source_word: περισσοτέρως
  choice: kwa makini zaidi
  rationale: Huhifadhi nguvu ya ulinganisho na kueleza namna ya kuzingatia kwa Kiswahili cha asili.
- source_word: προσέχειν ἡμᾶς
  choice: tuzingatie
  rationale: Kitenzi hiki huonyesha kuelekeza fikira na kuyapa mambo uzito unaostahili; umbo la nafsi ya kwanza wingi linawakilisha ἡμᾶς.
- source_word: τοῖς ἀκουσθεῖσιν
  choice: yale tuliyoyasikia
  rationale: Huhifadhi maana ya mambo yaliyosikiwa bila kuyafafanua moja kwa moja kuwa ‘ujumbe,’ huku yakibaki na umuhimu wa sasa.
- source_word: μήποτε
  choice: tusije
  rationale: Ni njia ya kawaida ya Kiswahili ya kutambulisha onyo kuhusu jambo baya linaloweza kutokea.
- source_word: παραρυῶμεν
  choice: tukapeperushwa mbali nayo
  rationale: Huhifadhi taswira ya kusukumwa au kuelea na kwenda mbali taratibu, huku kiwakilishi ‘nayo’ kikifanya uhusiano na yale yaliyosikiwa uwe wazi.
theological_decisions:
- issue: Asili ya taswira ya onyo katika παραρυῶμεν
  choice: tukapeperushwa mbali nayo
  alternative: tukapita kando yake; tukayaacha yatupite
  rationale: Kitenzi kinaweza kuonyesha wasikilizaji wakipeperushwa mbali na waliyosikia, au mambo yaliyosikiwa yakiwapita. Tafsiri kuu inaweka wasikilizaji kama wanaosogea mbali, kulingana na umbo la kitenzi na muktadha wa onyo, bila kuamua mfumo maalumu wa mafundisho kuhusu uasi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Tuzingatie kwa makini zaidi’ ni rahisi kueleweka na huhifadhi msisitizo wa asili; ‘tukapeperushwa mbali nayo’ inadumisha taswira bila kutumia msamiati wa kimadhehebu.
