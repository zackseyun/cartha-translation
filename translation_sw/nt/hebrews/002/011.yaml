  text: ὅ τε γὰρ ἁγιάζων καὶ οἱ ἁγιαζόμενοι ἐξ ἑνὸς πάντες· δι’ ἣν αἰτίαν οὐκ ἐπαισχύνεται ἀδελφοὺς αὐτοὺς καλεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/011.yaml
  text: For both the one who sanctifies and those who are being sanctified are all from one[a]; for this reason he is not ashamed to call them brothers[b],
translation:
  language: sw
  text: Kwa maana yeye anayetakasa na wale wanaotakaswa wote wametokana na mmoja[a]. Kwa sababu hiyo, haoni aibu kuwaita ndugu[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutokana na Baba mmoja,” “kutokana na chanzo kimoja,” au “kutokana na babu mmoja.” Kigiriki hakibainishi anayerejelewa na neno “mmoja.”
    reason: alternative_reading
  - marker: b
    text: Neno la Kigiriki lililotafsiriwa “ndugu” liko katika umbo la wingi wa kiume; katika muktadha huu linaweza kurejelea familia pana ya waamini, wanawake wakiwemo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἁγιάζων
  choice: yeye anayetakasa
  rationale: Kirai cha hali ya sasa chenye matumizi ya nomino kinamrejelea atendaye tendo la kutakasa; tafsiri hii ni ya kawaida na hudumisha uhusiano wa kileksia na ἁγιαζόμενοι.
- source_word: οἱ ἁγιαζόμενοι
  choice: wale wanaotakaswa
  rationale: Kirai cha hali ya sasa katika kauli tendwa kinaweza kuonyesha tendo linaloendelea au hali inayoendelea; Kiswahili hiki huhifadhi kauli tendwa bila kulazimisha zaidi tofauti hiyo ya kiaspekti.
- source_word: ἐξ ἑνὸς
  choice: wanatoka kwa mmoja
  rationale: Kigiriki hakitaji wazi huyo 'mmoja' ni nani. 'Kwa mmoja' huhifadhi utata huo badala ya kuongeza Baba, chanzo, au babu mmoja katika matini kuu.
- source_word: πάντες
  choice: wote
  rationale: Huwajumuisha kwa msisitizo anayetakasa pamoja na wanaotakaswa.
- source_word: δι’ ἣν αἰτίαν
  choice: Kwa sababu hiyo
  rationale: Ni usemi wa asili wa Kiswahili unaoonyesha matokeo yanayotokana na kauli iliyotangulia.
- source_word: οὐκ ἐπαισχύνεται
  choice: haoni aibu
  rationale: Hutoa kwa kawaida maana ya kutokuwa na aibu, huku ikihifadhi wazo la heshima na aibu.
- source_word: ἀδελφοὺς
  choice: ndugu
  rationale: Neno 'ndugu' ni la kawaida na lenye heshima; kwa Kiswahili halibainishi jinsia kama nomino ya Kigiriki ya wingi wa kiume, hivyo tanbihi inaeleza umbo la asili na uwezekano wa kurejelea jumuiya nzima.
- source_word: καλεῖν
  choice: kuwaita
  rationale: Hii ndiyo tafsiri ya kawaida na ya asili ya kitenzi katika muundo huu.
theological_decisions:
- issue: Mhusika wa kitenzi 'haoni aibu' na rejeleo la 'mmoja'
  choice: Muktadha humtambulisha mhusika kuwa Mwana anayetakasa, lakini matini kuu haitaji wazi anayerejelewa na 'mmoja'.
  alternative: Kutafsiri 'kwa Baba mmoja,' 'kutoka chanzo kimoja,' au 'kutoka kwa babu mmoja.'
  rationale: Muktadha wa karibu unamwelekeza msomaji kwa Mwana/Yesu kama anayetakasa. Hata hivyo, ἐξ ἑνὸς haitaji iwapo huyo mmoja ni Mungu, Adamu, Abrahamu, au asili moja ya kibinadamu; kwa hiyo tafsiri haifungi uwezekano huo wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Muundo unaweka sambamba anayetakasa na wanaotakaswa, na huhifadhi utata halisi wa ἐξ ἑνὸς. Alama zote za tanbihi zimewekwa katika matini kuu.
