  text: εἰ γὰρ ὁ δι’ ἀγγέλων λαληθεὶς λόγος ἐγένετο βέβαιος, καὶ πᾶσα παράβασις καὶ παρακοὴ ἔλαβεν ἔνδικον μισθαποδοσίαν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/002.yaml
  text: For if the message spoken through angels proved firm[a], and every transgression and disobedience received a just penalty[b],
translation:
  language: sw
  text: Kwa maana, ikiwa ujumbe uliosemwa kupitia malaika ulithibitika kuwa imara[a], na kila ukiukaji na kutotii kulipata adhabu ya haki[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaelekea huu ni ule ujumbe wa sheria ambao, kulingana na mapokeo ya Kiyahudi, ulitolewa kupitia malaika; linganisha Matendo 7:53 na Wagalatia 3:19.
    reason: cross_reference
  - marker: b
    text: Au, “malipo ya haki” au “malipo yaliyostahili.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δι’ ἀγγέλων λαληθεὶς λόγος
  choice: ujumbe ulionenwa kupitia malaika
  rationale: Neno λόγος hapa ni ujumbe uliowasilishwa; ‘kupitia malaika’ linahifadhi διά yenye genitivi kama njia au uwakala bila kudai kwamba malaika ndio chanzo chake.
- source_word: ἀγγέλων
  choice: malaika
  rationale: Katika muktadha wa Waebrania 2, kinachokusudiwa yaelekea ni malaika wa mbinguni katika mapokeo kuhusu kutolewa kwa sheria, si wajumbe wa kibinadamu.
- source_word: ἐγένετο βέβαιος
  choice: ulithibitika kuwa imara
  rationale: Kauli hii inaonyesha kwamba ujumbe ulisimama kuwa halali, wenye nguvu na wa kutekelezwa; tafsiri hii inadumisha maana ya matokeo bila kuifanya kuwa uthibitisho wa kiakili tu.
- source_word: πᾶσα παράβασις
  choice: kila kosa
  rationale: παράβασις ni kuvuka mpaka uliowekwa au kukiuka amri. ‘Kosa’ ni la kawaida na lenye uzito wa kisheria katika Kiswahili, huku ‘ukiukaji’ likiwa jepesi kidogo katika mtiririko huu.
- source_word: παρακοὴ
  choice: kutotii
  rationale: παρακοή ni kutosikia au kutokujali ipasavyo na hivyo kutotii; ‘kutotii’ linaeleza wazi maana ya kimaadili na kisheria.
- source_word: ἔλαβεν
  choice: kulipata
  rationale: Kitenzi hiki kinadumisha muundo wa Kigiriki ambamo kila tendo la kosa na kutotii ndilo linalopata malipo yake.
- source_word: ἔνδικον μισθαποδοσίαν
  choice: adhabu ya haki
  rationale: μισθαποδοσία ni malipo au kisasi kinacholingana na tendo, na ἔνδικος huonyesha kuwa kinastahili na ni cha haki. Katika muktadha huu wa hukumu, ‘adhabu ya haki’ ni ya asili na wazi.
theological_decisions:
- issue: Asili ya ‘ujumbe ulionenwa kupitia malaika’
  choice: Dokezo la sheria iliyopitishwa kupitia malaika, bila kuitaja moja kwa moja kuwa sheria katika matini.
  alternative: Ujumbe wa Mungu kwa ujumla uliotolewa kupitia malaika.
  rationale: Muktadha mpana unaelekeza sana kwenye mapokeo ya sheria ya Sinai, lakini Kigiriki chenyewe kinasema tu ‘ujumbe ulionenwa kupitia malaika.’ Tafsiri inahifadhi usemi huo na kuacha dokezo bila kuongeza ‘sheria’ katika matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. ‘Ulionenwa’ hudumisha sauti ya kibiblia bila kuwa ya kizamani kupita kiasi; ‘ujumbe’ ni wazi kwa msomaji wa kawaida. Sentensi inaachwa wazi kwa kuendelea na mstari wa 3, kama ilivyo katika chanzo.
