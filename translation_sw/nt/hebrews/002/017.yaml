base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/017.yaml
  text: Therefore he had to become like his brothers in every respect[a], so that he might become a merciful and faithful high priest in the things pertaining to God[b], to make atonement for the sins of the people.
translation:
  language: sw
  text: Kwa hiyo ilimpasa kufanana na ndugu zake kwa kila namna[a], ili awe Kuhani Mkuu mwenye rehema na mwaminifu katika mambo ya Mungu, ili afanye upatanisho[b] kwa ajili ya dhambi za watu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki kimetumia neno la kifamilia la wingi wa kiume, “ndugu,” ambalo katika muktadha linaweza kuwajumuisha pia waumini wa kike.
    reason: lexical_alternative
  - marker: b
    text: Au “kuondoa dhambi za watu” au “kutuliza ghadhabu kwa sababu ya dhambi za watu.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὅθεν
  choice: Kwa hiyo
  rationale: Inaonyesha hitimisho linalotokana na hoja iliyotangulia kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: ὤφειλεν
  choice: ilimpasa
  rationale: Inawasilisha ulazima au wajibu uliotokana na kusudi la wokovu bila kudokeza kulazimishwa kwa nje.
- source_word: κατὰ πάντα
  choice: kwa kila namna
  rationale: Ni usemi wa asili unaohifadhi upeo mpana wa kufanana.
- source_word: τοῖς ἀδελφοῖς
  choice: ndugu zake
  rationale: Neno 'ndugu' ni la asili katika Kiswahili na linaweza kutaja ndugu wa kiume au jamaa pana kulingana na muktadha; tanbihi inafafanua umbo la Kigiriki.
- source_word: ὁμοιωθῆναι
  choice: kufanana na
  rationale: Inatoa maana ya kuwa kama wao kwa lugha ya kawaida bila kuongeza maelezo ya namna jambo hilo lilivyotokea.
- source_word: ἵνα
  choice: ili
  rationale: Inaonyesha kusudi kwa uwazi.
- source_word: ἐλεήμων
  choice: mwenye rehema
  rationale: Huhifadhi wazo la rehema katika huduma ya kikuhani kwa lugha inayoeleweka.
- source_word: πιστὸς
  choice: mwaminifu
  rationale: Huwasilisha uaminifu na kutegemeka kwa kuhani mbele za Mungu.
- source_word: ἀρχιερεὺς
  choice: Kuhani Mkuu
  rationale: Ni istilahi ya kawaida na ya moja kwa moja ya cheo hiki cha kikuhani.
- source_word: τὰ πρὸς τὸν θεόν
  choice: katika mambo yanayomhusu Mungu
  rationale: Huhifadhi usemi mpana wa Kigiriki kuhusu nyanja ya huduma ya kikuhani inayohusiana na Mungu.
- source_word: εἰς τὸ ἱλάσκεσθαι
  choice: na kufanya upatanisho kwa ajili ya
  rationale: Inatoa kwa lugha inayofikika tendo la kikuhani la kushughulikia dhambi, bila kuamua kimya kimya kati ya kuondoa dhambi na kutuliza ghadhabu.
- source_word: τὰς ἁμαρτίας τοῦ λαοῦ
  choice: dhambi za watu
  rationale: Ni tafsiri ya moja kwa moja na ya asili ya kitu kinachoshughulikiwa na tendo la upatanisho.
theological_decisions:
- issue: Maana ya ἱλάσκεσθαι katika muktadha wa upatanisho
  choice: kufanya upatanisho kwa ajili ya dhambi za watu
  alternative: kufunika dhambi za watu; kuondoa dhambi za watu; kutuliza ghadhabu kwa ajili ya dhambi za watu
  rationale: ‘Kufanya upatanisho’ ni wazi kiasi na inafaa kwa muktadha wa kikuhani, huku ikiacha mvutano wa kimaana kati ya expiation na propitiation; tanbihi inaonyesha upeo huo.
- issue: Upeo wa kifamilia wa ἀδελφοῖς
  choice: ndugu zake
  alternative: ndugu zake wa kiume; ndugu zake wa kiume na wa kike
  rationale: Kiswahili ‘ndugu’ halibainishi jinsia kwa lazima na linaweza kuwakilisha familia pana. Tanbihi huhifadhi taarifa kwamba Kigiriki kimetumia umbo la wingi wa kiume.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo umehifadhi mantiki ya mstari na lugha yake ya kikuhani bila kutumia istilahi za kitaaluma kupita kiasi.
