base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/007.yaml
  text: You made him lower than the angels for a little while[a]; you crowned him with glory and honor.
translation:
  language: sw
  text: Ulimfanya kuwa chini ya malaika kwa muda mfupi[a]; ukamvika taji ya utukufu na heshima.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ulimfanya kuwa chini kidogo kuliko malaika.” Kirai cha Kigiriki kinaweza kueleza kiwango badala ya muda.
    reason: alternative_reading
lexical_decisions:
- source_word: ἠλάττωσας
  choice: Ulimfanya kuwa chini
  rationale: 'Kitenzi hiki ni aoristi tendaji, nafsi ya pili umoja, chenye maana ya kisababishi na ulinganisho hapa: ‘kumfanya kuwa chini.’ Muundo huu ni wa kawaida na wazi katika Kiswahili.'
- source_word: αὐτὸν
  choice: -m- (yeye)
  rationale: Kiambishi cha yambwa katika ‘ulimfanya’ kinawakilisha kiwakilishi cha kiume umoja bila kuongeza nomino ambayo haipo katika kifungu hiki.
- source_word: βραχύ τι
  choice: kwa muda mfupi
  rationale: Kirai kinaweza kueleza muda au kiwango. Maana ya muda inafaa sana katika muktadha wa Waebrania 2, huku maana ya kiwango ikihifadhiwa katika tanbihi.
- source_word: παρ’ ἀγγέλους
  choice: ya malaika
  rationale: Baada ya wazo la ‘kuwa chini,’ παρά pamoja na akusativi ina nguvu ya ulinganisho. Kiswahili cha kawaida husema ‘chini ya malaika.’
- source_word: δόξῃ
  choice: ya utukufu
  rationale: Datibu inaonyesha kile ambacho mtu anavikwa kama taji; ‘taji ya utukufu’ ni usemi wa asili katika Kiswahili.
- source_word: τιμῇ
  choice: na heshima
  rationale: τιμή hapa ni hadhi au heshima aliyopewa mtu. ‘Utukufu na heshima’ huhifadhi uhusiano wa maneno hayo mawili.
- source_word: ἐστεφάνωσας
  choice: ukamvika taji
  rationale: Aoristi tendaji, nafsi ya pili umoja. ‘Kumvika taji’ ni Kiswahili cha asili kinachoonyesha kitendo cha kumtawaza au kumpamba kwa taji, bila kupunguza taswira ya Kigiriki.
- source_word: αὐτόν
  choice: -m- (yeye)
  rationale: Kiambishi cha yambwa katika ‘ukamvika’ kinawakilisha kiwakilishi kilichorudiwa katika Kigiriki kwa njia ya kawaida ya kisarufi ya Kiswahili.
theological_decisions:
- issue: Maana ya βραχύ τι katika nukuu ya Zaburi 8 inayotumiwa katika Waebrania
  choice: 'Maana ya muda: ‘kwa muda mfupi’'
  alternative: 'Maana ya kiwango: ‘chini kidogo kuliko malaika’'
  rationale: Kigiriki kinaruhusu maana zote mbili. Katika muktadha wa Waebrania 2, maana ya muda inalingana vizuri na hali ya chini ya muda ya Mwana kabla ya kutukuzwa. Tanbihi inahifadhi maana halali ya kiwango na mvutano wa kitafsiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Muundo ‘ukamvika taji’ huhifadhi taswira ya kutawazwa huku ‘kwa muda mfupi’ ikibaki na tanbihi ya maana mbadala.
