  text: while God also bore witness with signs and wonders and various miracles and distributions of the Holy Spirit according to his will.
translation:
  language: sw
  text: huku Mungu naye akishuhudia kwa ishara, maajabu, matendo mbalimbali ya nguvu[a], na migao ya Roho Mtakatifu[b], kulingana na mapenzi yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “miujiza mbalimbali” au “nguvu mbalimbali.” Neno la Kigiriki linaweza kumaanisha maonyesho ya nguvu na, katika muktadha huu, matendo ya kimiujiza.
    reason: lexical_alternative
  - marker: b
    text: Au “migawanyo” au “sehemu za mgao za Roho Mtakatifu.” Matini haisemi waziwazi “karama.”
    reason: lexical_alternative
lexical_decisions:
- source_word: συνεπιμαρτυροῦντος
  choice: huku Mungu naye akishuhudia
  rationale: Kauli ya wakati mmoja inaendeleza sentensi ya mstari uliotangulia. “Huku” huonyesha tendo linaloandamana na lile lililotajwa, na “naye” huhifadhi nguvu ya nyongeza ya συν- bila kutumia usemi mzito usio wa kawaida.
- source_word: σημείοις
  choice: kwa ishara
  rationale: “Kwa” huonyesha chombo au njia ambayo Mungu alitumia kutoa ushuhuda; “ishara” huhifadhi dhana ya jambo lenye maana ya uthibitisho.
- source_word: τέρασιν
  choice: maajabu
  rationale: Hili ni neno la kawaida na lenye hadhi kwa matendo yanayostaajabisha, hasa katika jozi ya “ishara na maajabu.”
- source_word: ποικίλαις δυνάμεσιν
  choice: matendo mbalimbali ya nguvu
  rationale: Usemi huu huhifadhi uhusiano wa δύναμις na nguvu huku muktadha ukionyesha matendo ya kimiujiza. Pia haubani maana kuwa “miujiza” pekee; mbadala huo umewekwa katika tanbihi.
- source_word: πνεύματος ἁγίου
  choice: ya Roho Mtakatifu
  rationale: Hili ndilo jina la kawaida la Kiswahili kwa πνεῦμα ἅγιον na linahifadhi uhusiano wa kisarufi na μερισμοῖς.
- source_word: μερισμοῖς
  choice: migawo
  rationale: “Migawo” huonyesha vitu au sehemu zinazogawanywa bila kuongeza neno “karama,” ambalo halipo wazi katika Kigiriki.
- source_word: κατὰ τὴν αὐτοῦ θέλησιν
  choice: kulingana na mapenzi yake
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaoonyesha kwamba migawo na ushuhuda huo vilifanyika kwa kupatana na mapenzi yake. Kisarufi, “yake” inarejelea Mungu kwa kawaida zaidi.
theological_decisions:
- issue: Mhusika anayerejelewa na “yake” katika “kulingana na mapenzi yake”
  choice: Kiwakilishi kinarejelea Mungu, aliye mhusika mkuu wa kauli “akishuhudia.”
  alternative: Kinaweza kueleweka kwa upana kuwa kinamrejelea Roho Mtakatifu, ingawa uwezekano huo ni mdogo kisarufi.
  rationale: Mungu ndiye mtenda wa kauli yote na ndiye anayeshuhudia kwa njia zilizoorodheshwa. Tafsiri haiongezi ufafanuzi unaofunga kabisa uwezekano mwingine.
- issue: Maana ya πνεύματος ἁγίου
  choice: Roho Mtakatifu
  alternative: Hakuna mbadala wa msingi unaohitajika katika muktadha huu.
  rationale: Hili huhifadhi jina la kibinafsi la kimungu linalotumiwa katika maandishi bila kuongeza maelezo ya kimadhehebu.
- issue: Je, μερισμοῖς inamaanisha moja kwa moja “karama”
  choice: Neno “karama” halijaongezwa katika matini kuu.
  alternative: migawo ya karama za Roho Mtakatifu
  rationale: Ingawa karama zinaweza kuwa kile kinachogawiwa katika muktadha, maandishi ya Kigiriki hayasemi “karama” waziwazi; kwa hiyo utata huo umehifadhiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kisasa lakini wa heshima. Kwa kuwa mstari huu ni mwendelezo wa sentensi iliyoanza katika mstari uliotangulia, umeanza kwa herufi ndogo na “huku.” “Migawo” ni sahihi lakini si neno la kila siku sana; tanbihi husaidia kufafanua bila kuongeza “karama” katika matini.
