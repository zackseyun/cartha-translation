base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/013.yaml
  text: And again[a], “I will put my trust in him.” And again, “Behold[d][c][b], I and the children whom God has given me.”
translation:
  language: sw
  text: Na tena, “Nitamtumaini.” Na tena, “Tazama, mimi na watoto ambao Mungu alionipa.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ πάλιν
  choice: Na tena
  rationale: Ni fomula fupi ya kuanzisha nukuu nyingine. Hakuna kitenzi cha kusema katika Kigiriki, kwa hiyo hakijaongezwa katika matini.
- source_word: Ἐγὼ ἔσομαι πεποιθὼς ἐπ’ αὐτῷ
  choice: Nitaweka tumaini langu kwake
  rationale: Muundo wa wakati ujao pamoja na kitenzi-jina cha hali timilifu unaonyesha msimamo thabiti wa kumtumaini. Usemi huu ni wa kawaida na wenye hadhi katika Kiswahili.
- source_word: Ἰδοὺ
  choice: Tazama
  rationale: Inahifadhi mwito wa msomaji au msikilizaji aangalie, pamoja na uzito wa lugha ya nukuu, bila kutumia neno lisilo la kawaida.
- source_word: τὰ παιδία
  choice: watoto
  rationale: Hurejelea watoto kwa maana ya uhusiano katika nukuu; “watoto” ni pana, ya kawaida, na haiingizi wazo lisilo lazima la umri mdogo sana.
- source_word: ἅ μοι ἔδωκεν ὁ θεός
  choice: ambao Mungu amenipa
  rationale: Kiwakilishi cha Kiswahili kinapatana na ngeli ya watu, huku hali timilifu “amenipa” ikionyesha umuhimu wa sasa wa tendo la Mungu la kutoa.
theological_decisions:
- issue: Sauti ya kinukuu na matumizi yake kwa Kristo
  choice: Nukuu zimetafsiriwa katika nafsi ya kwanza bila kumtaja msemaji katika matini kuu.
  alternative: Kuongeza “anasema” au “Masihi anasema.”
  rationale: Kigiriki hakimtaji msemaji hapa. Muktadha wa Waebrania unatumia maneno haya kumhusu Mwana, lakini tafsiri haipaswi kuongeza utambulisho huo ndani ya mstari na hivyo kuondoa mvutano wa kimuktadha.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa nukuu umehifadhiwa kwa ufupi; hakuna kitenzi cha kusema kilichoongezwa. “Tazama” hudumisha nguvu ya Ἰδοὺ kwa lugha inayoeleweka kwa wasomaji wa kawaida.
