base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/005.yaml
  text: For he did not subject the world to come to angels[a], about which we are speaking.
translation:
  language: sw
  text: Kwa maana Mungu hakuuweka ulimwengu ujao chini ya mamlaka ya malaika[a], ambao tunauzungumzia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ulimwengu unaokaliwa utakaokuja.”
    reason: Huhifadhi mbadala wa kileksika wa οἰκουμένη (“ulimwengu unaokaliwa”) pamoja na dhana ya wakati ujao ya τὴν μέλλουσαν.
lexical_decisions:
- source_word: Οὐ γὰρ
  choice: Kwa maana si
  rationale: γάρ inaunganisha mstari huu na hoja iliyotangulia kwa kutoa maelezo, huku οὐ ikikanusha wazi tendo la kitenzi.
- source_word: ἀγγέλοις
  choice: chini ya mamlaka ya malaika
  rationale: Muktadha wa Waebrania unarejelea viumbe wa mbinguni, si wajumbe wa kibinadamu; muundo huu pia unaonyesha kuwa dative inahusu wale ambao kitu kingewekwa chini yao.
- source_word: ὑπέταξεν
  choice: aliuweka ... chini ya mamlaka
  rationale: ὑποτάσσω humaanisha kuweka chini ya mamlaka au utawala; tafsiri hii ni ya kawaida na hudumisha wazo la kutawaliwa.
- source_word: τὴν οἰκουμένην
  choice: ulimwengu
  rationale: οἰκουμένη inaweza kumaanisha ulimwengu unaokaliwa; hapa 'ulimwengu' ni ya asili zaidi katika Kiswahili, huku tanbihi ikihifadhi maana finyu ya kileksika.
- source_word: τὴν μέλλουσαν
  choice: ujao
  rationale: Kirai hiki kinaonyesha wakati ujao; 'ujao' ni kifupi, cha asili, na hakifafanui kupita kiasi aina ya ulimwengu huo.
- source_word: περὶ ἧς λαλοῦμεν
  choice: ambao tunauzungumzia
  rationale: Huhifadhi rejeo la mwandishi kwa mjadala unaoendelea na ni Kiswahili cha sasa na cha kawaida.
theological_decisions:
- issue: Rejeo la 'ulimwengu ujao'
  choice: Ulimwengu au utaratibu ujao, bila kuufafanua zaidi
  alternative: Dunia inayokaliwa kwa ujumla, au enzi ya injili hasa
  rationale: τὴν οἰκουμένην τὴν μέλλουσαν kwa kawaida huelekeza kwenye ulimwengu ujao. Tafsiri haubainishi kama ni enzi fulani mahsusi, hivyo inadumisha mvutano wa kiteolojia wa muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mpangilio uliotanguliza 'si chini ya mamlaka ya malaika' unadumisha mkazo wa ukanushaji wa Kigiriki bila kuwa mgumu kupita kiasi.
