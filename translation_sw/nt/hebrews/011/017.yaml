  text: Πίστει προσενήνοχεν Ἀβραὰμ τὸν Ἰσαὰκ πειραζόμενος, καὶ τὸν μονογενῆ προσέφερεν ὁ τὰς ἐπαγγελίας ἀναδεξάμενος,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/017.yaml
  text: By faith Abraham[a], when he was being tested, offered up Isaac, and the one who had received the promises was offering up his one and only son,
translation:
  language: sw
  text: Kwa imani Abrahamu, alipokuwa akijaribiwa, alimtoa Isaka kuwa dhabihu; na yule aliyekuwa amezipokea ahadi alikuwa akimtoa mwana wake wa kipekee[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mwana wake wa pekee.” Neno la Kigiriki linasisitiza kwamba mwana huyo ni wa namna ya pekee; tafsiri ya jadi ni “mwana wa pekee aliyezaliwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πίστει
  choice: Kwa imani
  rationale: Dativu inaonyesha njia au chombo; ‘kwa imani’ ni usemi wa kawaida wa Kiswahili na unadumisha kauli inayorudiwa katika sura hii.
- source_word: προσενήνοχεν
  choice: alimtoa ... kuwa dhabihu
  rationale: Kitenzi kina nguvu ya utoaji wa kidhabihu katika muktadha huu. Wakati timilifu wa Kigiriki unawasilishwa kwa wakati uliopita wa kisimulizi unaosikika kwa kawaida katika Kiswahili.
- source_word: πειραζόμενος
  choice: alipokuwa akijaribiwa
  rationale: Muundo huu unadumisha hali tendwa na tendo lililokuwa likiendelea. Katika muktadha wa Mwanzo, jaribu hili ni kupimwa kwa imani, si kushawishiwa kutenda dhambi.
- source_word: μονογενῆ
  choice: mwana wake wa kipekee
  rationale: ‘Wa kipekee’ linasisitiza hadhi ya Isaka isiyolinganishwa kama mwana wa ahadi bila kudai kwamba Abrahamu hakuwa na mwana mwingine wa kibayolojia.
- source_word: προσέφερεν
  choice: alikuwa akimtoa
  rationale: Muundo endelevu unawakilisha hali isiyotimilika ya kitenzi cha Kigiriki na kuonyesha tendo lililokuwa katika hatua ya kutendeka.
- source_word: ἀναδεξάμενος
  choice: aliyekuwa amezipokea
  rationale: ‘Kupokea’ linafaa kwa ahadi na muundo huu unaonyesha kwamba kuzipokea kulitangulia tendo la kumtoa Isaka.
- source_word: ἐπαγγελίας
  choice: ahadi
  rationale: Nomino ya Kiswahili ‘ahadi’ haitofautishi umoja na wingi kwa umbo; kiambishi cha wingi ‘zi-’ katika ‘amezipokea’ kinaonyesha wazi kwamba Kigiriki ni wingi.
- source_word: καὶ
  choice: Naam
  rationale: Hapa kiunganishi kinaendeleza na kusisitiza kwa mtindo wa ufafanuzi mtu yuleyule; ‘Naam’ huunganisha sentensi kwa kawaida huku kikihifadhi msisitizo.
theological_decisions:
- issue: Maana ya μονογενῆ kuhusu Isaka ingawa Abrahamu alikuwa na mwana mwingine wa kibayolojia
  choice: mwana wake wa kipekee
  alternative: mwana wake wa pekee
  rationale: Tafsiri hii inaonyesha upekee wa Isaka kama mwana wa ahadi, bila kutoa dai linaloweza kueleweka kwamba alikuwa mwana pekee wa Abrahamu kwa maana ya kibayolojia. Tanbihi inahifadhi tafsiri nyingine ya moja kwa moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kifasihi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Kutoa kuwa dhabihu’ hudumisha muktadha wa kidhabihu, na tofauti kati ya ‘alimtoa’ na ‘alikuwa akimtoa’ hudumisha kwa kadiri ya kawaida tofauti ya hali za vitenzi vya Kigiriki.
