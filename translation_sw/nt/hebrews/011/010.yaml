  text: ἐξεδέχετο γὰρ τὴν τοὺς θεμελίους ἔχουσαν πόλιν, ἧς τεχνίτης καὶ δημιουργὸς ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/010.yaml
  text: For he was waiting for the city that has foundations[b][a], whose architect and builder is God.
translation:
  language: sw
  text: Kwa maana alikuwa akiungojea mji wenye misingi[a], ambao mbunifu na mjenzi wake ni Mungu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mji ulio na misingi.” Wingi wa “misingi” unaweza kusisitiza kudumu na uthabiti.
    reason: lexical_alternative
  - marker: b
    text: Au, “ambao msanifu na mtengenezaji wake ni Mungu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεδέχετο
  choice: alikuwa akiungojea
  rationale: Muundo huu unaonyesha tendo la kuendelea katika wakati uliopita na matarajio yenye subira; kiambishi cha yambwa katika “akiungojea” kinarejelea mji.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Inaonyesha sababu au ufafanuzi unaounganisha mstari huu na ukaaji wa Abrahamu kama mgeni katika mstari uliotangulia.
- source_word: τὴν τοὺς θεμελίους ἔχουσαν πόλιν
  choice: mji wenye misingi
  rationale: Ni Kiswahili cha kawaida kinachohifadhi wazo la mji ulio na misingi bila kuongeza kwamba ni wa mbinguni au kwamba misingi hiyo ni ya kudumu.
- source_word: θεμελίους
  choice: misingi
  rationale: Huhifadhi wingi wa neno la Kigiriki, ambao katika muktadha unaweza kudokeza uimara na uthabiti.
- source_word: πόλιν
  choice: mji
  rationale: Hili ndilo neno la kawaida na linalofaa katika taswira ya kifungu.
- source_word: ἧς
  choice: ambao ... wake
  rationale: Muundo wa Kiswahili unaonyesha uhusiano wa umilikaji kati ya mji na mbunifu pamoja na mjenzi wake.
- source_word: τεχνίτης
  choice: mbunifu
  rationale: Katika jozi hii, neno hili linaonyesha ustadi wa kupanga au kubuni na kulitofautisha na neno linalofuata la kutengeneza au kujenga.
- source_word: δημιουργὸς
  choice: mjenzi
  rationale: Kwa kuwa kinachozungumziwa ni mji, “mjenzi” huhifadhi taswira ya ujenzi na kuandamana kwa kawaida na “mbunifu.”
- source_word: ὁ θεός
  choice: Mungu
  rationale: Ni tafsiri ya kawaida ya nomino iliyo kiima cha kishazi.
theological_decisions:
- issue: Asili ya mji ulioahidiwa
  choice: mji wenye misingi
  alternative: mji wa mbinguni; mji wenye misingi ya kudumu
  rationale: Mstari wenyewe hauuiti waziwazi mji wa mbinguni wala hauongezi kivumishi “ya kudumu.” Tafsiri inahifadhi taswira na mvutano wa kifungu bila kuingiza utambulisho wa kitheolojia kutoka mistari mingine.
- issue: Uhusiano wa majina τεχνίτης na δημιουργός
  choice: mbunifu na mjenzi
  alternative: stadi na mtengenezaji; mbunifu na muumbaji
  rationale: Chaguo hili hudumisha majukumu mawili yanayohusiana lakini yasiyofanana, huku yakifaa kwa taswira ya mji. Halikusudii kufafanua kwa ukamilifu namna Mungu anavyouleta mji huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, ya heshima na inayoeleweka kwa wasomaji wa kawaida. “Alikuwa akiungojea” huhifadhi hali endelevu ya kitenzi, na “mji wenye misingi” ni ya asili bila kupoteza wingi wa Kigiriki.
