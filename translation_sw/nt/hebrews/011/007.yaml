id: HEB.11.7
reference: Hebrews 11:7
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: πίστει χρηματισθεὶς Νῶε περὶ τῶν μηδέπω βλεπομένων εὐλαβηθεὶς κατεσκεύασεν κιβωτὸν εἰς σωτηρίαν τοῦ οἴκου αὐτοῦ, δι’ ἧς κατέκρινεν τὸν κόσμον, καὶ τῆς κατὰ πίστιν δικαιοσύνης ἐγένετο κληρονόμος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/007.yaml
  text: By faith Noah[a], having been warned about things not yet seen, in reverent fear constructed an ark for the salvation of his household[d][c][b], through which he condemned the world and became heir of the righteousness according to faith.
translation:
  language: sw
  text: Kwa imani, Noa, baada ya kuonywa[a] kuhusu mambo ambayo bado hayajaonekana, kwa hofu yenye uchaji[b] alijenga safina kwa ajili ya wokovu wa watu wa nyumbani mwake. Kwa njia ya safina hiyo[c] aliuhukumu ulimwengu, akawa mrithi wa haki[d] iliyo kwa imani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “baada ya kupewa maagizo ya kimungu” au “baada ya kupokea onyo la kimungu.”
    reason: lexical_alternative
  - marker: b
    text: Au “akisukumwa na hofu ya kimungu.”
    reason: lexical_alternative
  - marker: c
    text: Maneno “kwa njia ya safina hiyo” kwa kawaida zaidi huirejelea safina; wengine huyafahamu kwa upana zaidi kuwa yanarejelea imani ya Noa au mwitikio wake wa kutii.
    reason: alternative_reading
  - marker: d
    text: Au “uadilifu”; hapa muktadha unapendelea haki inayohusishwa na imani.
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: Kwa imani
  rationale: Dativu hii inaonyesha njia au chombo na inadumisha muundo unaorudiwa katika Waebrania 11. “Imani” ni neno la kawaida na linalofaa katika muktadha wa itikio la Noa.
- source_word: χρηματισθεὶς
  choice: baada ya kuonywa
  rationale: Katika hali hii tendwa, kitenzi humaanisha kupokea ujumbe au onyo lenye asili ya kimungu. Tafsiri kuu haimtaji Mungu wazi kwa sababu mtendaji hajatajwa moja kwa moja katika Kigiriki.
- source_word: περὶ τῶν μηδέπω βλεπομένων
  choice: kuhusu mambo ambayo bado hayakuwa yameonekana
  rationale: Huhifadhi maana ya μηδέπω, “bado hayakuwa,” pamoja na hali ya mambo yajayo ambayo hayakuwa yameonekana.
- source_word: εὐλαβηθεὶς
  choice: kwa hofu yenye uchaji
  rationale: Huhifadhi pamoja hisia ya hofu na mwitikio wa kidini wenye uchaji, badala ya kuifanya iwe woga wa kawaida tu.
- source_word: κατεσκεύασεν
  choice: alijenga
  rationale: Ni Kiswahili cha kawaida na sahihi kwa tendo la kutengeneza safina kwa makusudi.
- source_word: κιβωτὸν
  choice: safina
  rationale: Hili ndilo neno lililozoeleka katika simulizi la Noa na linaonyesha chombo kikubwa cha uokozi.
- source_word: εἰς σωτηρίαν τοῦ οἴκου αὐτοῦ
  choice: ili kuwaokoa watu wa nyumbani mwake
  rationale: Hutoa kwa Kiswahili cha asili kusudi la σωτηρία na upana wa οἶκος, ambao unaweza kujumuisha kaya nzima, si familia kwa maana finyu tu.
- source_word: δι’ ἧς
  choice: Kwa njia ya safina hiyo
  rationale: Kiwakilishi cha kike katika Kigiriki kinarejelea kwa urahisi zaidi κιβωτός, “safina.” Kutaja safina wazi kunazuia kiwakilishi cha Kiswahili kisieleweke vibaya, huku tanbihi ikihifadhi uwezekano mpana.
- source_word: κατέκρινεν τὸν κόσμον
  choice: aliuhukumu ulimwengu
  rationale: Ni tafsiri ya moja kwa moja inayowasilisha kwamba utii wa Noa ulisimama kama ushahidi wa hukumu dhidi ya ulimwengu usioamini.
- source_word: τῆς κατὰ πίστιν δικαιοσύνης
  choice: uadilifu unaolingana na imani
  rationale: “Uadilifu” huhifadhi maana ya δικαιοσύνη bila kuifinya kuwa haki ya kijamii pekee, na “unaolingana na imani” huepuka kuifanya κατά iseme wazi chanzo au njia kuliko Kigiriki kinavyosema.
- source_word: ἐγένετο κληρονόμος
  choice: akawa mrithi
  rationale: Ni usemi wa kawaida unaoonyesha hadhi ambayo Noa aliifikia.
theological_decisions:
- issue: Maana ya χρηματισθεὶς na kama Mungu atajwe kuwa chanzo
  choice: baada ya kuonywa
  alternative: baada ya kuonywa na Mungu; baada ya kupewa maagizo ya kimungu
  rationale: Hali tendwa na muktadha hudokeza ujumbe wa kimungu, lakini Kigiriki hakimwonyeshi Mungu wazi kama mtendaji. Matini kuu inadumisha udokezo huo badala ya kuufanya usemi wa moja kwa moja.
- issue: Nuansi ya εὐλαβηθεὶς
  choice: kwa hofu yenye uchaji
  alternative: akisukumwa na hofu ya kimungu; kwa uchaji
  rationale: Neno hili halimaanishi woga mtupu, bali mwitikio wa hofu uliojaa uchaji unaoongoza kwenye utii.
- issue: Kinachorejelewa na δι’ ἧς
  choice: kwa njia ya safina hiyo
  alternative: kwa njia ya imani; kwa njia ya mwitikio wa Noa wa kutii
  rationale: Nomino ya karibu inayolingana kisarufi ni κιβωτός, “safina.” Hata hivyo, muktadha mpana unaweza kueleweka kuwa imani au tendo la utii; uwezekano huo umehifadhiwa katika tanbihi.
- issue: Tafsiri ya δικαιοσύνη
  choice: uadilifu
  alternative: haki
  rationale: Katika kauli ya urithi na uhusiano na imani, “uadilifu” huwasilisha vizuri hali au msimamo wa kuwa mwenye haki. “Haki” ni mbadala halali lakini inaweza pia kueleweka kuwa justice katika Kiswahili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imerahisishwa kwa mtiririko wa kawaida bila kuondoa uhusiano wa kisarufi au mvutano wa kiteolojia wa matini ya Kigiriki.
