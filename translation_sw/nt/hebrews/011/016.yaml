  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: νῦν δὲ κρείττονος ὀρέγονται, τοῦτ’ ἔστιν ἐπουρανίου. διὸ οὐκ ἐπαισχύνεται αὐτοὺς ὁ θεὸς θεὸς ἐπικαλεῖσθαι αὐτῶν, ἡτοίμασεν γὰρ αὐτοῖς πόλιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/016.yaml
  text: But as it is[a], they long for a better country—that is, a heavenly one. Therefore God is not ashamed to be called their God, for he has prepared a city for them.
translation:
  language: sw
  text: Lakini sasa wanatamani nchi iliyo bora zaidi[a], yaani, nchi ya mbinguni. Kwa hiyo Mungu haoni aibu kuitwa Mungu wao, kwa maana amewaandalia mji.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nchi ya kwao iliyo bora zaidi.” Katika Kiyunani nomino haijarudiwa hapa, bali inaeleweka kutokana na muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν δὲ
  choice: Lakini hali ilivyo
  rationale: Ni kiunganishi cha hoja kinachotofautisha hali halisi na wazo la masharti katika mstari uliotangulia; tafsiri hii haikifanyi kiwe rejeo la wakati tu.
- source_word: κρείττονος
  choice: iliyo bora zaidi
  rationale: Inaonyesha ulinganisho wa ubora na kudumisha msamiati wa kulinganisha unaojirudia katika Waebrania.
- source_word: ὀρέγονται
  choice: wanatamani
  rationale: Kitenzi hiki huonyesha hamu yenye nguvu ya kufikia kitu; “wanatamani” ni Kiswahili cha kawaida na chenye uzito unaofaa.
- source_word: κρείττονος ... ἐπουρανίου
  choice: nchi iliyo bora zaidi, yaani, nchi ya mbinguni
  rationale: Vivumishi vya Kiyunani vinategemea nomino iliyodokezwa kutokana na πατρίδα katika muktadha. Kurudia “nchi” baada ya “yaani” kunafanya sentensi iwe wazi na ya asili kwa Kiswahili.
- source_word: διὸ
  choice: Kwa hiyo
  rationale: Huonyesha hitimisho linalotokana na kutamani kwao nchi ya mbinguni.
- source_word: οὐκ ἐπαισχύνεται
  choice: haoni aibu
  rationale: Ni usemi wa kawaida wa Kiswahili unaohifadhi dhana ya kutokuwa na aibu bila kuipunguza kuwa fedheha ya muda mfupi.
- source_word: ἐπικαλεῖσθαι αὐτῶν
  choice: kuitwa Mungu wao
  rationale: Inahifadhi namna ya uhusiano iliyo katika matini na mwangwi wake wa usemi wa Agano la Kale bila kuipanua kwa ufafanuzi.
- source_word: ἡτοίμασεν
  choice: amewaandalia
  rationale: Wakati timilifu wa Kiswahili unaonyesha tendo lililokamilika ambalo matokeo yake yanaendelea kuwa muhimu; kiambishi cha mtendewa kinaonyesha kwamba maandalizi hayo ni kwa ajili yao.
- source_word: πόλιν
  choice: mji
  rationale: Inahifadhi taswira halisi ya kieskatolojia inayotumiwa katika Waebrania, bila kuongeza kibainishi kisichopo katika Kiyunani.
theological_decisions:
- issue: Nomino iliyodokezwa pamoja na κρείττονος na ἐπουρανίου
  choice: Kuweka “nchi” kutokana na muktadha wa karibu
  alternative: Kuweka “nchi ya kwao” au kuacha nomino ikiwa imedokezwa
  rationale: Muktadha wa mstari wa 14 unaonyesha πατρίς, yaani nchi ya kwao. “Nchi” ni wazi na ya kawaida, huku tanbihi ikihifadhi uwezekano wa maana ya “nchi ya kwao.”
- issue: Usemi wa uhusiano katika “Mungu wao”
  choice: Kudumisha usemi huo bila kuupanua
  alternative: Kutafsiri kwa ufafanuzi kuwa Mungu anawatambua kuwa watu wake
  rationale: Matini inasema hasa kwamba Mungu haoni aibu kuitwa Mungu wao; kuipanua kungeongeza wazo lisilotajwa moja kwa moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Muundo “hali ilivyo” unabeba tofauti ya kimantiki, na “amewaandalia mji” ni wa asili bila kupoteza ufupi wa matini.
