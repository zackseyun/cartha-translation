  text: πίστει παρῴκησεν εἰς γῆν τῆς ἐπαγγελίας ὡς ἀλλοτρίαν, ἐν σκηναῖς κατοικήσας μετὰ Ἰσαὰκ καὶ Ἰακὼβ τῶν συγκληρονόμων τῆς ἐπαγγελίας τῆς αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/009.yaml
  text: By faith he lived as a foreigner in the land of promise[a], as in a foreign land, dwelling in tents with Isaac and Jacob, fellow heirs of the same promise.
translation:
  language: sw
  text: Kwa imani, aliishi kama mgeni katika nchi ya ahadi[a], kana kwamba ilikuwa nchi ya kigeni, akiishi katika mahema pamoja na Isaka na Yakobo, warithi wenzake wa ahadi ileile.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “Kwa imani, alikaa kwa muda katika nchi ya ahadi kana kwamba ilikuwa nchi ya kigeni.”'
    reason: Mbadala huu unaonyesha maana ya kukaa kama asiye mwenyeji katika παρῴκησεν na uwezekano wa kuunganisha ὡς ἀλλοτρίαν moja kwa moja na ‘nchi ya ahadi.’
lexical_decisions:
- source_word: πίστει
  choice: Kwa imani
  rationale: Dative ya njia au chombo; katika Waebrania 11, tafsiri hii ya kawaida inaonyesha imani kuwa msingi wa tendo.
- source_word: παρῴκησεν
  choice: aliishi kama mgeni
  rationale: Kitenzi kinaonyesha kuishi mahali kama mtu asiye mwenyeji, si kuishi tu; usemi huu ni wazi na wa kawaida katika Kiswahili cha sasa.
- source_word: εἰς γῆν τῆς ἐπαγγελίας
  choice: katika nchi ya ahadi
  rationale: Ingawa εἰς mara nyingi humaanisha ‘kuingia/kwenda ndani ya,’ pamoja na kitenzi cha kukaa hapa inaeleweka kwa maana ya mahali; ‘nchi ya ahadi’ inadumisha uhusiano wa nchi hiyo na ahadi ya Mungu.
- source_word: ὡς ἀλλοτρίαν
  choice: kana kwamba ilikuwa nchi ya kigeni
  rationale: ἀλλότριος huonyesha kitu cha mwingine au cha kigeni. Tafsiri hii inadumisha ulinganisho wa ὡς na wazo kwamba nchi hiyo haikuwa mali yake wakati huo.
- source_word: ἐν σκηναῖς κατοικήσας
  choice: akiishi katika mahema
  rationale: Kirai kishirikishi kinaeleza hali au namna ya maisha yake nchini humo na kinahifadhi picha halisi ya makao yasiyo ya kudumu.
- source_word: μετὰ Ἰσαὰκ καὶ Ἰακὼβ
  choice: pamoja na Isaka na Yakobo
  rationale: μετά pamoja na genitive humaanisha moja kwa moja ‘pamoja na’; majina yametolewa kwa maumbo yaliyozoeleka katika Kiswahili.
- source_word: τῶν συγκληρονόμων
  choice: warithi wenzake
  rationale: Neno hilo linaonyesha watu wanaoshiriki urithi mmoja; ‘warithi wenzake’ ni la asili na linaloeleweka kwa urahisi.
- source_word: τῆς ἐπαγγελίας τῆς αὐτῆς
  choice: wa ahadi ileile
  rationale: αὐτῆς husisitiza kwamba Isaka na Yakobo walishiriki ahadi hiyohiyo aliyokuwa amepewa Abrahamu; ‘ileile’ inadumisha utambulisho huo bila kuzidisha msisitizo.
theological_decisions:
- issue: Mhusika wa kitenzi ambaye hajatajwa kwa jina
  choice: Kiwakilishi kisichotajwa kinamrejelea Abrahamu kutoka mstari uliotangulia; Kiswahili kinatumia ‘aliishi.’
  alternative: Kutaja wazi ‘Abrahamu aliishi.’
  rationale: Muktadha wa Waebrania 11:8 unaendelea kumzungumzia Abrahamu. Kutodokeza jina hapa kunafuata muundo wa Kigiriki bila kuleta utata mkubwa katika muktadha.
- issue: Hali ya nchi ya ahadi kama nchi ya kigeni
  choice: ‘kana kwamba ilikuwa nchi ya kigeni’
  alternative: ‘katika nchi ya ahadi kama nchi ya kigeni’
  rationale: Tafsiri teule inadumisha mvutano wa kwamba nchi ilikuwa imeahidiwa, lakini Abrahamu aliishi humo bila kuimiliki kama mwenyeji. Haidai kuwa nchi yenyewe haikuwa nchi ya ahadi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Aliishi kama mgeni’ huepuka usemi wa kizamani, huku ‘mahema’ na ‘warithi wenzake’ vikihifadhi picha na dhana za maandishi ya chanzo.
