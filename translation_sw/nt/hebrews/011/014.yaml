  text: For those who say such things make it clear that they are seeking a homeland[a].
translation:
  language: sw
  text: Kwa maana wale wanaosema mambo kama hayo wanaonyesha wazi kwamba wanatafuta nchi ya asili[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nchi yao wenyewe” au “makao yao ya nyumbani.” Mstari unaofuata unaonyesha kwamba nchi inayotarajiwa hatimaye ni ya mbinguni.
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: Kwa maana
  rationale: Inaendeleza uhusiano wa maelezo na mstari uliotangulia kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: τοιαῦτα
  choice: mambo kama hayo
  rationale: Inarejelea kauli za aina hiyo zilizotangulia; ni usemi wa asili na wazi katika Kiswahili.
- source_word: λέγοντες
  choice: wanaosema
  rationale: Kitenzi-jina cha wakati wa sasa kimetafsiriwa kwa kishazi tegemezi, kikihifadhi maana ya kusema kwao.
- source_word: ἐμφανίζουσιν
  choice: wanaonyesha wazi
  rationale: Kinawasilisha maana ya kufanya jambo lionekane au lijulikane wazi kutokana na maneno yao.
- source_word: ὅτι
  choice: kwamba
  rationale: Kinaanzisha kishazi kinachoeleza jambo linalodhihirishwa.
- source_word: πατρίδα
  choice: nchi yao
  rationale: Katika muktadha huu πατρίς humaanisha nchi ambayo mtu huihesabu kuwa yake, nchi ya asili au makao ya nyumbani. ‘Nchi yao’ ni ya kawaida katika Kiswahili, huku tanbihi ikihifadhi wigo wa maana.
- source_word: ἐπιζητοῦσιν
  choice: wanatafuta
  rationale: Inahifadhi wazo la jitihada inayoendelea ya kutafuta, bila kuibadili kuwa hamu tu.
theological_decisions:
- issue: Maana ya πατρίδα wanayoitafuta mababu katika muktadha
  choice: nchi yao
  alternative: nchi ya duniani au nchi ya mbinguni
  rationale: Mstari huu wenyewe hautaji wazi ikiwa nchi hiyo ni ya duniani au ya mbinguni. Tafsiri haileti ufafanuzi wa mstari unaofuata mapema, hivyo inadumisha mvutano wa kifungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, wazi na yenye hadhi. ‘Kwa maana’ huhifadhi uhusiano wa hoja, na ‘wanaonyesha wazi’ husikika kwa kawaida kuliko tafsiri ngumu zaidi.
