base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/011.yaml
  text: By faith even Sarah herself received power to conceive offspring[a], even beyond the proper time of life, because she considered the one who had promised to be faithful.
translation:
  language: sw
  text: Kwa imani, hata Sara mwenyewe alipokea uwezo wa kushika mimba, hata baada ya kupita umri wa kuzaa, kwa sababu alimhesabu yule aliyetoa ahadi kuwa mwaminifu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa karibu zaidi: “uwezo kwa ajili ya kuwekwa kwa mbegu.” Kirai cha Kigiriki si cha kawaida; katika muktadha kinarejelea uwezo wa kupata mtoto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: Kwa imani
  rationale: Hii ni dativu ya njia katika mtindo unaorudiwa katika Waebrania 11; “kwa imani” ni ya kawaida, wazi, na sahihi katika Kiswahili.
- source_word: καὶ αὐτῇ Σάρρᾳ
  choice: hata Sara mwenyewe
  rationale: “Hata” pamoja na “mwenyewe” huhifadhi msisitizo wa καὶ na kiwakilishi cha mkazo αὐτῇ, ikimtaja Sara kama mfano wa ziada wenye kushangaza.
- source_word: δύναμιν ... ἔλαβεν
  choice: alipokea uwezo
  rationale: Huhifadhi maana ya moja kwa moja ya kupokea δύναμις huku ikisikika kiasili kuliko “alipokea nguvu” katika muktadha wa kushika mimba.
- source_word: εἰς καταβολὴν σπέρματος
  choice: wa kupata uzao
  rationale: Kirai cha Kigiriki si cha kawaida na kwa neno kwa neno kina taswira ya kuwekwa kwa mbegu. Kwa kuwa Sara ndiye kiima, “kupata uzao” huwasilisha kusudi la uzazi bila kuingiza taswira ya kiume katika matini kuu; tafsiri ya karibu zaidi imehifadhiwa katika tanbihi.
- source_word: καὶ παρὰ καιρὸν ἡλικίας
  choice: ingawa alikuwa amepita wakati unaofaa wa umri
  rationale: Huwasilisha kuvuka kikomo cha kawaida cha hatua ya maisha bila kuongeza wazi maneno “umri wa kuzaa,” ambayo hayajasemwa moja kwa moja katika Kigiriki.
- source_word: ἐπεὶ
  choice: kwa sababu
  rationale: Huonyesha wazi sababu iliyotolewa kwa Sara kupokea uwezo huo.
- source_word: πιστὸν
  choice: mwaminifu
  rationale: Huhifadhi uzito wa kiteolojia wa sifa ya Mungu kuwa mwaminifu, huku pia ikidokeza kwamba anategemeka.
- source_word: ἡγήσατο
  choice: alimwona ... kuwa
  rationale: Ni usemi wa asili wa Kiswahili unaowasilisha hukumu au tathmini ya Sara kuhusu tabia ya mtoa ahadi.
- source_word: τὸν ἐπαγγειλάμενον
  choice: yule aliyetoa ahadi
  rationale: Huwasilisha kishiriki chenye matumizi ya nomino kwa uwazi, bila kuongeza jina la Mungu ambalo halipo wazi katika kifungu hiki.
theological_decisions:
- issue: Kiima na maana ya tendo la Sara katika sentensi yenye ugumu wa kisintaksia
  choice: 'Sara ndiye kiima: alipokea uwezo wa kupata uzao.'
  alternative: Huenda msemo huo ukahusisha tendo la Abrahamu katika “kuweka mbegu,” au ukaelezea kuanzishwa kwa ukoo.
  rationale: Katika namna hii ya matini, αὐτῇ Σάρρᾳ humtambulisha Sara kwa kawaida kuwa kiima cha ἔλαβεν. Matini kuu inadumisha hilo, lakini tanbihi inalinda usemi usio wa kawaida wa Kigiriki na uwezekano wake wa tafsiri ya karibu zaidi.
- issue: Maana ya πιστός inapomhusu mtoa ahadi
  choice: mwaminifu
  alternative: anayetegemeka
  rationale: “Mwaminifu” huhifadhi wazo la kutegemeka kwa Mungu na uzito wa kiteolojia wa neno bila kuongeza fundisho lisilosemwa na kifungu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wazi kwa msomaji wa kawaida, huku msisitizo juu ya Sara, uhusiano wa sababu, na utata halisi wa kirai εἰς καταβολὴν σπέρματος vikihifadhiwa.
