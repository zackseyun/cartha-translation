  text: πίστει κατέλιπεν Αἴγυπτον, μὴ φοβηθεὶς τὸν θυμὸν τοῦ βασιλέως, τὸν γὰρ ἀόρατον ὡς ὁρῶν ἐκαρτέρησεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/027.yaml
  text: By faith he left Egypt[a], not fearing the king’s anger[b], for he endured as seeing the One who is invisible.
translation:
  language: sw
  text: Kwa imani aliondoka Misri[a], bila kuogopa hasira ya mfalme, kwa maana alidumu imara kama akimwona Yeye asiyeonekana.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maneno haya yanaweza kurejelea ama Musa alipokimbia Misri kwa sababu ya Farao (Kutoka 2), ama alipoondoka Misri pamoja na Israeli (Kutoka 12–14); maneno ya Kigiriki hayataji wazi tukio lipi.
    reason: cross_reference
  - marker: b
    text: Au, “Yule asiyeonekana.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: Kwa imani
  rationale: Hutumia tafsiri ya kawaida ya πίστις katika sura hii na kuonyesha namna au msingi ambao kwa huo Musa alitenda.
- source_word: κατέλιπεν Αἴγυπτον
  choice: aliondoka Misri
  rationale: Katika muktadha huu καταλείπω ina maana ya kuondoka mahali; tafsiri hii ni ya kawaida na haiongezi wazo lenye nguvu zaidi la kuitelekeza Misri.
- source_word: μὴ φοβηθεὶς τὸν θυμὸν τοῦ βασιλέως
  choice: bila kuogopa hasira ya mfalme
  rationale: Huhifadhi uhusiano wa kishiriki na kitendo kikuu kwa Kiswahili cha asili. ‘Hasira’ huwasilisha θυμός bila kuzidisha maana kuwa ghadhabu kali mno.
- source_word: τὸν ἀόρατον
  choice: Yeye asiyeonekana
  rationale: Kivumishi chenye kibainishi kimetumiwa kama nomino na kinamrejelea mtu; ‘Yeye asiyeonekana’ hudumisha urejeleo huo na fumbo la kumwona asiyeonekana.
- source_word: ὡς ὁρῶν
  choice: kama akimwona
  rationale: Huhifadhi nguvu ya ulinganisho ya ὡς pamoja na taswira hai ya kuona, bila kudai kwamba alimwona kwa macho.
- source_word: ἐκαρτέρησεν
  choice: alivumilia
  rationale: καρτερέω huonyesha kustahimili au kudumu kwa uthabiti; ‘alivumilia’ ni neno la kawaida linalofaa katika muktadha wa kutotishwa na hasira ya mfalme.
theological_decisions:
- issue: Tukio linalorejelewa na ‘aliondoka Misri’
  choice: Tafsiri haibainishi ikiwa ni kukimbia kwa Musa kutoka Misri katika Kutoka 2 au kuondoka kwake pamoja na Israeli katika Kutoka 12–14.
  alternative: Kulitaja moja kwa moja ama tukio la Kutoka 2 ama lile la Kutoka 12–14.
  rationale: Kigiriki kinasema tu kwamba aliondoka Misri. Kwa kuwa tukio mahususi halijaelezwa na linaweza kueleweka kwa njia zote mbili, utata huo umehifadhiwa.
- issue: Namna Musa ‘anamwona’ asiyeonekana
  choice: ‘kama akimwona Yeye asiyeonekana’
  alternative: ‘kana kwamba alimwona Yeye asiyeonekana’
  rationale: Tafsiri iliyochaguliwa hudumisha ulinganisho na mvutano wa kitheolojia wa kuona kwa imani bila kuugeuza kuwa dai la kuona kwa macho au kuudhoofisha kuwa dhana isiyo halisi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wazi kwa msomaji wa kawaida, huku ‘kama akimwona Yeye asiyeonekana’ ukihifadhi fumbo na mvutano wa maneno ya Kigiriki.
