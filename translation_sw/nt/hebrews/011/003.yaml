  text: πίστει νοοῦμεν κατηρτίσθαι τοὺς αἰῶνας ῥήματι θεοῦ, εἰς τὸ μὴ ἐκ φαινομένων ⸂τὸ βλεπόμενον⸃ γεγονέναι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/003.yaml
  text: By faith we understand that the ages were framed by the word of God[a], so that what is seen did not come into being from things that are visible.
translation:
  language: sw
  text: Kwa imani tunaelewa kwamba zama[a] ziliwekwa katika mpangilio kwa neno la Mungu, hivi kwamba kile kinachoonekana hakikutokana na vitu vinavyoonekana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “malimwengu” au “ulimwengu mzima”; Kigiriki “zama,” neno linaloweza kumaanisha mpangilio wa ulimwengu katika mfululizo wa wakati.
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: Kwa imani
  rationale: Dativi inaonyesha njia au chombo; usemi huu ni mfupi, wa kawaida, na unadumisha mtindo unaorudiwa katika sura hii.
- source_word: νοοῦμεν
  choice: tunaelewa
  rationale: Kitenzi hiki kinaonyesha ufahamu wa kiakili, si kuona kwa macho tu.
- source_word: κατηρτίσθαι
  choice: ziliwekwa katika mpangilio
  rationale: Uchaguzi huu unawasilisha maana ya kuandaliwa, kukamilishwa, au kuwekwa sawa bila kuifanya kauli iseme moja kwa moja uumbaji wa vitu kutoka pasipo kitu.
- source_word: τοὺς αἰῶνας
  choice: zama
  rationale: Hili ndilo neno la karibu zaidi na maana ya msingi ya αἰῶνες na linahifadhi upana wake wa wakati na ulimwengu; maana mbadala imeelezwa katika tanbihi.
- source_word: ῥήματι θεοῦ
  choice: kwa neno la Mungu
  rationale: Dativi inaonyesha njia iliyotumiwa, huku ῥῆμα ikimaanisha neno au tamko lililonenwa.
- source_word: εἰς τὸ μὴ ... γεγονέναι
  choice: hivi kwamba ... hakikutokana
  rationale: Muundo huu unaonyesha matokeo, na tafsiri inaeleza kutokea au kupata kuwapo bila kuongeza istilahi nzito za kifalsafa.
- source_word: ἐκ φαινομένων
  choice: kutokana na vitu vinavyoonekana
  rationale: Inahifadhi wazi rejeo kwa vitu vinavyoonekana na tofauti yake na kile kinachoonekana.
- source_word: τὸ βλεπόμενον
  choice: kile kinachoonekana
  rationale: Kirai hiki cha umoja kina maana ya kijumla na kinarejelea mpangilio wote unaoonekana.
theological_decisions:
- issue: Upeo wa αἰῶνες katika habari ya uumbaji
  choice: zama
  alternative: ulimwengu; malimwengu; ulimwengu mzima
  rationale: Neno la Kigiriki linaweza kuhusisha mpangilio wa ulimwengu katika mfululizo wa wakati. ‘Zama’ huhifadhi upana huo bila kuufanya kuwa wa anga au vitu vya kimwili pekee.
- issue: Kama mstari unasema wazi uumbaji kutoka pasipo kitu
  choice: kile kinachoonekana hakikutokana na vitu vinavyoonekana
  alternative: kile kinachoonekana kiliumbwa kutoka pasipo kitu
  rationale: Kigiriki kinakataa kwamba kinachoonekana kilitokana na vitu vinavyoonekana, lakini hakitamki moja kwa moja kauli kamili ya kimafundisho kuhusu uumbaji kutoka pasipo kitu; hivyo tafsiri haiongezi dai hilo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Ziliwekwa katika mpangilio’ ni rasmi lakini inaeleweka, na huepuka kubana maana ya καταρτίζω kuwa uumbaji wa kimada pekee.
