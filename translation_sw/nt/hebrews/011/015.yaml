id: HEB.11.15
reference: Hebrews 11:15
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ εἰ μὲν ἐκείνης ⸀μνημονεύουσιν ἀφ’ ἧς ⸀ἐξέβησαν, εἶχον ἂν καιρὸν ἀνακάμψαι·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/015.yaml
  text: And if they had been remembering that land from which they had gone out[a], they would have had opportunity to return.
translation:
  language: sw
  text: Na kama wangekuwa wakiikumbuka nchi ile[a] walikotoka, wangekuwa na fursa ya kurudi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nchi hiyo” au “nchi yao ya asili.” Kigiriki kinaelekeza kwenye mahali pa duniani walikokuwa wameondoka.
    reason: lexical_alternative
lexical_decisions:
- source_word: μνημονεύουσιν
  choice: wangekuwa wakiikumbuka
  rationale: Muundo huu unaonyesha hali isiyotimia katika muktadha huku ukihifadhi maana ya kuendelea kuikumbuka, bila kuigeuza kuwa hisia za kuitamani kwa huzuni.
- source_word: ἐκείνης
  choice: nchi ile
  rationale: Kiwakilishi hiki kinarejelea mahali pa duniani walikotoka, kama inavyoonyesha muktadha wa mistari ya 14–16. Kutaja “nchi” kunafanya rejeleo lieleweke kwa kawaida katika Kiswahili.
- source_word: ἀφ’ ἧς
  choice: walikotoka
  rationale: Muundo wa mahali “-ko-” unaeleza kwa Kiswahili cha kawaida uhusiano wa kutoka mahali fulani.
- source_word: ἐξέβησαν
  choice: walikotoka
  rationale: Kitenzi kina maana ya kutoka au kuondoka. “Walipotoka” huhifadhi wazo la kuondoka mahali bila kuongeza ufafanuzi usiotajwa.
- source_word: εἶχον ἂν
  choice: wangekuwa na
  rationale: 'Huu ni usemi wa kawaida wa Kiswahili unaowakilisha matokeo ya hali isiyotimia: wangekuwa na kitu ikiwa sharti hilo lingetimia.'
- source_word: καιρὸν
  choice: fursa
  rationale: Hapa neno halimaanishi tu muda wa saa au kipindi, bali nafasi inayofaa ya kufanya jambo; “fursa” hutoa maana hiyo wazi.
- source_word: ἀνακάμψαι
  choice: kurudi
  rationale: Neno hili linaonyesha kurudi au kugeuka na kwenda mahali pa awali. “Kurudi” ni fupi, wazi, na ya kawaida.
- source_word: καὶ εἰ μὲν
  choice: Na kama
  rationale: Huu unaendeleza hoja ya mstari uliotangulia na kuanzisha sharti. Chembe μέν haihitaji neno tofauti katika Kiswahili hapa.
theological_decisions:
- issue: Nchi waliyokuwa wakiikumbuka ni ipi
  choice: Nchi halisi ya duniani waliyokuwa wameondoka, ikitofautishwa kwa muktadha na nchi iliyo bora ya mbinguni.
  alternative: Maisha yao ya zamani kwa ujumla, badala ya nchi halisi.
  rationale: Waebrania 11:13–16 inazungumzia nchi ya asili ya wazee wa imani na nchi iliyo bora ya mbinguni. Tafsiri inadumisha lugha halisi ya mahali na haiifanyi kuwa mfano wa maisha ya zamani.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Wangekuwa wakiikumbuka” huhifadhi hali isiyotimia na tendo linaloendelea; “fursa” ni wazi zaidi kuliko “wakati” katika muktadha huu.
