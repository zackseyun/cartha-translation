  text: πίστει Ἰωσὴφ τελευτῶν περὶ τῆς ἐξόδου τῶν υἱῶν Ἰσραὴλ ἐμνημόνευσεν, καὶ περὶ τῶν ὀστέων αὐτοῦ ἐνετείλατο.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/022.yaml
  text: By faith Joseph, as he was nearing the end of his life, mentioned the exodus of the sons of Israel and gave instructions concerning his bones.
translation:
  language: sw
  text: Kwa imani Yosefu, alipokuwa anakaribia mwisho wa maisha yake,[a] alitaja kuondoka kwa wana wa Israeli[b] na akatoa maagizo kuhusu mifupa yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alipokuwa akifa.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kutoka kwa wana wa Israeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: Kwa imani
  rationale: Inaendeleza mtindo unaorudiwa katika Waebrania 11 na kueleza imani ambayo kwa hiyo Yosefu alitenda.
- source_word: τελευτῶν
  choice: alipokuwa anakaribia mwisho wa maisha yake
  rationale: Kirai hiki cha wakati kinaonyesha kwamba Yosefu alikuwa mwishoni mwa maisha yake; mbadala wa moja kwa moja zaidi, 'alipokuwa akifa,' umewekwa katika tanbihi.
- source_word: περὶ τῆς ἐξόδου
  choice: kutoka
  rationale: Neno hili linaashiria kuondoka kwa Israeli Misri na linaendeleza istilahi ya kibiblia iliyozoeleka ya 'kutoka' bila kulazimisha matumizi ya jina maalumu.
- source_word: τῶν υἱῶν Ἰσραὴλ
  choice: kwa wana wa Israeli
  rationale: Inahifadhi taswira ya wazi ya kifamilia ya Kigiriki, badala ya kuibadili kuwa tu 'Waisraeli.'
- source_word: ἐμνημόνευσεν
  choice: alitaja
  rationale: Pamoja na περὶ, kitenzi hiki humaanisha kutaja au kusema kuhusu jambo, si kukumbuka kimoyomoyo tu.
- source_word: ἐνετείλατο
  choice: kutoa maagizo
  rationale: Huwasilisha agizo la makusudi la Yosefu kwa Kiswahili cha sasa bila kupunguza nguvu yake.
- source_word: περὶ τῶν ὀστέων αὐτοῦ
  choice: kuhusu mifupa yake
  rationale: Inahifadhi nomino halisi 'mifupa' na dokezo la ombi la Yosefu kuhusu mifupa yake.
theological_decisions:
- issue: Maana ya πίστις katika Waebrania 11
  choice: imani
  alternative: uaminifu; tumaini
  rationale: Muundo unaorudiwa katika sura hii unaonyesha imani kama msingi au njia ya tendo la Yosefu; 'uaminifu' si maana inayotangulia hapa.
- issue: Kutambua ἔξοδος kama tukio la kihistoria
  choice: kutoka kwa wana wa Israeli
  alternative: kuondoka kwa wana wa Israeli
  rationale: Muktadha unahusu kuondoka kwao Misri, lakini neno 'kutoka' pia huhifadhi maana ya kawaida ya nomino ya Kigiriki bila kuongeza maelezo yasiyotajwa katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo umewekwa wa kawaida na wa sasa, huku istilahi za msingi na taswira ya kifamilia ya matini ya Kigiriki zikihifadhiwa.
