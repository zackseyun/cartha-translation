lexical_decisions:
- source_word: ἐν ταύτῃ
  choice: kwa hiyo
  rationale: Kirai hiki kinarejelea πίστις (‘imani’) katika mstari uliotangulia na hapa kinaeleza njia au msingi; ‘kwa hiyo’ huhifadhi rejeo hilo bila kurudia neno ‘imani’ ndani ya matini.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Huonyesha kwamba mstari huu unaeleza au kuthibitisha kauli iliyotangulia kuhusu imani.
- source_word: ἐμαρτυρήθησαν
  choice: walishuhudiwa kuwa wamekubaliwa
  rationale: Kauli tendwa ya μαρτυρέω ina maana ya kutolewa ushuhuda mzuri au kukubaliwa. Tafsiri hii huhifadhi taswira ya ushuhuda na maana yake chanya bila kutaja Mungu waziwazi ambapo Kigiriki hakumtaji.
- source_word: οἱ πρεσβύτεροι
  choice: wazee wa kale
  rationale: Katika muktadha huu neno halimaanishi hasa viongozi wa jumuiya, bali watu wa vizazi vya zamani wanaotajwa katika sura hii. ‘Wazee wa kale’ huhifadhi maana ya msingi huku ikizuia mkanganyiko wa ‘wazee’ kama cheo cha kanisa.
theological_decisions:
- issue: Kirejelewa cha ταύτῃ
  choice: Kinaeleweka kuwa kinarejelea imani ya mstari wa 1.
  alternative: Kinaweza kurejelea kwa upana zaidi uhalisi wote ulioelezwa katika mstari wa 1.
  rationale: Umoja wa kike wa ταύτῃ unalingana kiasili na πίστις, na hoja ya sura inahusu imani. Hata hivyo, ‘kwa hiyo’ huhifadhi rejeo la Kigiriki na halipanui matini kuu kuwa ‘kwa imani.’
- issue: Chanzo cha ushuhuda mzuri
  choice: Matini kuu haitaji waziwazi kwamba Mungu ndiye aliyewakubali.
  alternative: Kutafsiri ‘walikubaliwa na Mungu.’
  rationale: Muktadha wa sura unaelekeza kwa Mungu kama mtoa ushuhuda, lakini sentensi ya Kigiriki haimtaji; kwa hiyo tafsiri haiongezi mhusika huyo katika matini kuu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Wazee wa kale’ limetumiwa badala ya ‘wazee’ peke yake ili kuepuka kueleweka kama viongozi wa kanisa; maelezo mafupi na mbadala zimewekwa katika tanbihi.
