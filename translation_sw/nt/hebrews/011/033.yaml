lexical_decisions:
- source_word: διὰ πίστεως
  choice: kwa imani
  rationale: Kirai hiki kinaonyesha njia au uwezo ambao kwa huo walitenda. “Kwa imani” ni Kiswahili cha kawaida na chenye hadhi, nacho hudumisha maana ya kumtegemea Mungu bila kuifanya πίστις kuwa “uaminifu.”
- source_word: κατηγωνίσαντο βασιλείας
  choice: walishinda falme
  rationale: Kitenzi kina maana ya kuwashinda au kuwatiisha wapinzani katika mapambano; “walishinda falme” hudumisha maana ya kisiasa na kijeshi ya maneno ya Kigiriki.
- source_word: εἰργάσαντο δικαιοσύνην
  choice: wakatenda yaliyo ya haki
  rationale: “Kutenda yaliyo ya haki” ni usemi wa asili unaoeleweka kwa urahisi na unaobeba maana ya mwenendo mwadilifu, huku “haki” pia ikiruhusu wazo la kutenda kwa usawa.
- source_word: ἐπέτυχον ἐπαγγελιῶν
  choice: wakapata ahadi
  rationale: Tafsiri hii hufuata wingi wa Kigiriki na haibainishi kupita kiasi ikiwa walipokea utimilifu wote wa yaliyoahidiwa au walifikia ahadi fulani.
- source_word: ἔφραξαν στόματα λεόντων
  choice: wakafunga vinywa vya simba
  rationale: Tafsiri halisi na ya kawaida inayohifadhi taswira yenye nguvu ya kuzizuia simba, bila kulifanya dokezo la simulizi la Danieli kuwa wazi zaidi ya matini.
theological_decisions:
- issue: Maana ya πίστις katika orodha ya Waebrania 11
  choice: imani
  alternative: tumaini; uaminifu
  rationale: Muktadha unasisitiza matendo yaliyofanywa kwa kumtegemea Mungu. “Imani” hudumisha neno kuu la sura nzima bila kulibana kuwa hisia ya tumaini pekee au sifa ya uaminifu.
- issue: Maana ya δικαιοσύνη katika muktadha huu usio wa Paulo
  choice: yaliyo ya haki
  alternative: uadilifu; matendo ya haki
  rationale: Usemi huu unahifadhi upana wa maana ya mwenendo ulio sawa mbele za Mungu na pia uwezekano wa kutekeleza haki, bila kuubana upande mmoja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa vitenzi mfululizo unahifadhi mwendo wa orodha ya Kigiriki. “Kwa imani” tayari hujumuisha maana za ‘kwa njia ya imani’ na ‘kwa imani,’ kwa hiyo hakuna tanbihi tofauti inayohitajika kwa tofauti hiyo ya Kiingereza.
