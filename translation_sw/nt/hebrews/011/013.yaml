id: HEB.11.13
reference: Hebrews 11:13
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Κατὰ πίστιν ἀπέθανον οὗτοι πάντες, μὴ ⸀λαβόντες τὰς ἐπαγγελίας, ἀλλὰ πόρρωθεν αὐτὰς ἰδόντες καὶ ἀσπασάμενοι, καὶ ὁμολογήσαντες ὅτι ξένοι καὶ παρεπίδημοί εἰσιν ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/013.yaml
  text: All these died in faith[a], not having received the promises, but having seen them from afar and greeted them[c][b], and having confessed that they are strangers and exiles on the earth.
translation:
  language: sw
  text: Hawa wote walikufa katika imani, bila kuzipokea ahadi hizo; bali waliziona kwa mbali na kuzikaribisha[a], wakakiri kwamba wao ni wageni na wakaaji wa muda[b] duniani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuzisalimia” au “kuzikumbatia.” Kitenzi cha Kigiriki kinaweza kumaanisha kusalimu au kukaribisha; hapa kimetumiwa kwa njia ya kitamathali kuhusu ahadi walizoziona kwa mbali.
    reason: lexical_alternative
  - marker: b
    text: Au, “wageni wakaaji” au “wapitaji.” Neno la Kigiriki linawaeleza watu wanaoishi mahali bila kuwa wenyeji kamili au bila makao ya kudumu huko.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κατὰ πίστιν
  choice: wakiwa na imani
  rationale: Kirai hiki kinaonyesha hali au msimamo wa imani waliokuwa nao walipokufa; tafsiri hii ni ya kawaida katika Kiswahili na haifanyi imani ionekane tu kuwa chombo cha tendo hilo.
- source_word: ἀπέθανον
  choice: walikufa
  rationale: Ni tafsiri ya moja kwa moja na wazi ya kitenzi, bila kutumia lugha ya kupunguza ukali wa kifo.
- source_word: οὗτοι πάντες
  choice: hawa wote
  rationale: Inadumisha msisitizo wa kiwakilishi kwa watu waliotajwa katika mistari iliyotangulia.
- source_word: μὴ λαβόντες τὰς ἐπαγγελίας
  choice: hawakupokea ahadi hizo
  rationale: Inahifadhi ukanushi, wingi wa 'ahadi,' na uhusiano wake na kufa kwao, huku ikitumia sentensi ya asili katika Kiswahili.
- source_word: πόρρωθεν αὐτὰς ἰδόντες
  choice: waliziona kwa mbali
  rationale: Inadumisha taswira ya kuziona ahadi zikiwa bado mbali.
- source_word: ἀσπασάμενοι
  choice: kuzikaribisha
  rationale: Kitenzi kinaweza kumaanisha kusalimu au kukaribisha. Kwa kuwa ahadi ndizo zinazosalimiwa, 'kuzikaribisha' huwasilisha mwitikio chanya wa kitamathali bila kufafanua kupita kiasi.
- source_word: ὁμολογήσαντες
  choice: wakakiri
  rationale: Inaonyesha kukubali au kutangaza wazi hali yao, na inaendeleza mfuatano wa matendo kwa Kiswahili cha kawaida.
- source_word: ξένοι
  choice: wageni
  rationale: Neno hili ni la kawaida na linaonyesha watu wasio wa mahali hapo au wasio na hali kamili ya kuwa wenyeji.
- source_word: παρεπίδημοί
  choice: wakaaji wa muda
  rationale: Inaonyesha wanaoishi mahali pasipo kuwa makao yao ya kudumu; huepuka kuongeza dhana ya kufukuzwa iliyo katika 'wahamishwa' au 'wakimbizi.'
- source_word: ἐπὶ τῆς γῆς
  choice: duniani
  rationale: Katika muktadha huu mpana wa maisha yao kama wageni, γῆ inaelekea kumaanisha dunia kuliko eneo maalumu la ardhi.
theological_decisions:
- issue: Maana ya πίστις katika Κατὰ πίστιν
  choice: imani
  alternative: uaminifu; kutumaini
  rationale: '''Imani'' inadumisha istilahi kuu ya sura hii na inafaa kwa msimamo wao wa kumtumaini Mungu hadi kufa, bila kubana maana kuwa uaminifu wa kibinadamu pekee.'
- issue: Taswira ya ἀσπασάμενοι ikielekezwa kwa ahadi
  choice: kuzikaribisha
  alternative: kuzisalimia; kuzikumbatia
  rationale: '''Kuzikaribisha'' inadumisha lugha ya kitamathali na mwitikio wao wa furaha kwa ahadi ambazo hawakuwa wamezipokea; ''kuzikumbatia'' ingekuwa fasiri yenye nguvu zaidi.'
- issue: Hali inayotajwa na παρεπίδημοί
  choice: wakaaji wa muda
  alternative: wapitaji; wageni wakaaji; wahamishwa
  rationale: Uchaguzi huu unaonyesha kutokuwa na makao ya kudumu au ushirika kamili mahali hapo bila kuingiza kwa lazima wazo la kufukuzwa kutoka nchi yao.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imegawanywa baada ya wazo la kwanza ili kupunguza uzito wa mfululizo mrefu wa vivumishi-tegemezi vya Kigiriki. 'Wakiwa na imani' ni ya kawaida zaidi kuliko 'kwa kadiri ya imani,' na 'wakaaji wa muda' ni wazi zaidi kwa wasomaji wa kawaida kuliko istilahi za kale.
