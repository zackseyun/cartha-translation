  text: ὧν οὐκ ἦν ἄξιος ὁ κόσμος ⸀ἐπὶ ἐρημίαις πλανώμενοι καὶ ὄρεσι καὶ σπηλαίοις καὶ ταῖς ὀπαῖς τῆς γῆς·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/038.yaml
  text: —of whom the world was not worthy—wandering in deserts and mountains[b][a], and caves and holes in the ground.
translation:
  language: sw
  text: —watu ambao ulimwengu haukuwastahili—walitangatanga nyikani[a] na milimani, mapangoni na katika mashimo ardhini[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika maeneo ya ukiwa.”
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “mashimo ya ardhi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧν
  choice: watu ambao
  rationale: Kiwakilishi hiki cha uhusiano katika hali ya umilikishi kinawarejelea waaminifu walioteswa waliotajwa kabla; kuongeza “watu” hufanya rejeo hilo lieleweke kwa Kiswahili bila kubadili maana.
- source_word: ἄξιος
  choice: kuwastahili
  rationale: Kitenzi “kustahili” kinahifadhi tathmini yenye nguvu kwamba ulimwengu haukuwa na ustahili wa kuwa na watu hao.
- source_word: κόσμος
  choice: ulimwengu
  rationale: Ni tafsiri ya kawaida na pana inayoweza kuhusisha jamii ya wanadamu iliyowakataa waaminifu hao.
- source_word: ἐπὶ ἐρημίαις
  choice: nyikani
  rationale: Katika muktadha huu ἐπί pamoja na hali ya dative inaonyesha mahali; “nyikani” ni ya asili, dhahiri, na inaonyesha maeneo ya ukiwa.
- source_word: πλανώμενοι
  choice: walitangatanga
  rationale: Neno hili linaonyesha kwenda huku na huku bila makao ya kudumu, katika hali ya kufukuzwa na taabu.
- source_word: ὄρεσι
  choice: milimani
  rationale: Hii ni tafsiri ya moja kwa moja ya maeneo ya juu yanayotajwa katika orodha.
- source_word: σπηλαίοις
  choice: mapangoni
  rationale: Ni neno la kawaida na linaloeleweka kwa maficho ya asili ndani ya miamba au ardhi.
- source_word: ὀπαῖς τῆς γῆς
  choice: mashimo ardhini
  rationale: Kauli hii ya Kiswahili ni ya asili na inahifadhi picha halisi ya matundu, mashimo, au mianya katika ardhi.
theological_decisions:
- issue: Rejeo na uzito wa kauli “ulimwengu haukuwastahili”
  choice: Kauli imehifadhiwa kama hukumu ya kimaadili dhidi ya ulimwengu, ikilinganishwa na thamani ya waaminifu walioteswa.
  alternative: Kuieleza tu kama kutopatana kwa waaminifu na ulimwengu bila tathmini ya kimaadili.
  rationale: Kigiriki kinatoa tathmini yenye nguvu, si maelezo yasiyoegemea upande wowote kuhusu tofauti zao; tafsiri haiongezi dai jingine la kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Dashi zinahifadhi kauli ya kati yenye msisitizo; maumbo ya mahali “nyikani,” “milimani,” na “mapangoni” yanaipa orodha mtiririko wa asili.
