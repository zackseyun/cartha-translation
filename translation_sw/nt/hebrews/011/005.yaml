id: HEB.11.5
reference: Hebrews 11:5
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Πίστει Ἑνὼχ μετετέθη τοῦ μὴ ἰδεῖν θάνατον, καὶ οὐχ ηὑρίσκετο διότι μετέθηκεν αὐτὸν ὁ θεός· πρὸ γὰρ τῆς ⸀μεταθέσεως μεμαρτύρηται εὐαρεστηκέναι τῷ θεῷ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/005.yaml
  text: By faith Enoch was taken away so that he should not see death[a], and he was not found because God had taken him away. For before his being taken away, he had been commended as having pleased God[c][b],
translation:
  language: sw
  text: Kwa imani Henoko aliondolewa ili asione kifo[a], naye hakupatikana kwa sababu Mungu alikuwa amemwondoa. Maana kabla ya kuondolewa kwake[b], alikuwa amepata ushuhuda kwamba amempendeza Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, asipitie kifo.
    reason: lexical_alternative
  - marker: b
    text: Au, kabla hajaondolewa.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πίστει
  choice: Kwa imani
  rationale: Hutafsiri πίστις kwa istilahi iliyozoeleka na kuonyesha kwamba imani ndiyo hali au njia iliyohusishwa na tukio hili.
- source_word: Ἑνὼχ
  choice: Henoko
  rationale: Hili ndilo umbo la jina linalotambulika katika matumizi ya Biblia ya Kiswahili.
- source_word: μετετέθη / μετέθηκεν
  choice: aliondolewa / alikuwa amemwondoa
  rationale: Huhifadhi wazo la kuondolewa kwa tendo la Mungu bila kuongeza kwamba alipelekwa mahali fulani au kueleza namna tukio hilo lilivyotokea.
- source_word: τοῦ μὴ ἰδεῖν θάνατον
  choice: ili asione kifo
  rationale: Huhifadhi nahau ya Kigiriki ya ‘kuona kifo’ huku ‘ili’ ikiwakilisha kusudi au matokeo yanayokusudiwa na kifungu cha kitenzi-jina.
- source_word: οὐχ ηὑρίσκετο
  choice: hakupatikana
  rationale: Ni tafsiri ya moja kwa moja inayomwacha mtafutaji bila kutajwa, kama ilivyo katika Kigiriki.
- source_word: πρὸ γὰρ τῆς μεταθέσεως
  choice: Maana kabla ya kuondolewa kwake
  rationale: Huwakilisha nomino μετάθεσις na kudumisha uhusiano wake wa kileksia na vitenzi vya kuondolewa vilivyotangulia.
- source_word: μεμαρτύρηται
  choice: alikuwa amepata ushuhuda
  rationale: Hutoa kwa Kiswahili cha kawaida maana ya kupokea ushuhuda wenye kumkubali au kumsifu, huku ikidumisha hali iliyokuwapo kabla ya kuondolewa kwake.
- source_word: εὐαρεστηκέναι τῷ θεῷ
  choice: kwamba amempendeza Mungu
  rationale: Huwasilisha wazi kwamba yaliyoshuhudiwa kumhusu Henoko ni kuwa alikuwa amempendeza Mungu.
theological_decisions:
- issue: Maana ya lugha ya μετατίθημι kuhusu Henoko
  choice: aliondolewa
  alternative: alichukuliwa kwenda mbinguni
  rationale: Aya inasema Mungu alimwondoa Henoko ili asione kifo, lakini haielezi hapa alikopelekwa wala namna tendo hilo lilivyofanyika; tafsiri haiongezi maelezo hayo.
- issue: Nguvu ya nahau ‘kuona kifo’
  choice: asione kifo
  alternative: asipitie kifo
  rationale: Nahau ya chanzo imehifadhiwa kwa kuwa inaeleweka katika muktadha, na maana yake ya kawaida imefafanuliwa katika tanbihi.
- issue: Maana ya ushuhuda kuhusu Henoko
  choice: alikuwa amepata ushuhuda kwamba amempendeza Mungu
  alternative: alikuwa amesifiwa kwa kumpendeza Mungu
  rationale: ‘Ushuhuda’ huhifadhi uhusiano na μαρτυρέω na haubainishi zaidi ya maandishi ikiwa ushuhuda huo ulitolewa moja kwa moja na Mungu au kupitia Maandiko.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi na inayoeleweka kwa wasomaji wa kawaida. Nahau ya chanzo ‘kuona kifo’ imehifadhiwa, huku miundo mizito ikiepukwa isipokuwa ‘kuondolewa kwake,’ ambayo inadumisha umbo la nomino katika Kigiriki.
