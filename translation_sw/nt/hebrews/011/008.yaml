  text: ⸀Πίστει καλούμενος Ἀβραὰμ ὑπήκουσεν ἐξελθεῖν εἰς ⸀τόπον ὃν ἤμελλεν λαμβάνειν εἰς κληρονομίαν, καὶ ἐξῆλθεν μὴ ἐπιστάμενος ποῦ ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/008.yaml
  text: By faith Abraham[a], when called, obeyed to go out to a place that he was going to receive as an inheritance, and he went out not knowing where he was going.
translation:
  language: sw
  text: Kwa imani Abrahamu, alipoitwa, alitii kwa kuondoka kwenda mahali ambako angepokea kama urithi. Naye aliondoka bila kujua anakokwenda.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πίστει
  choice: Kwa imani
  rationale: Dativu inaonyesha njia au msingi wa tendo; “kwa imani” ni usemi wa kawaida wa Kiswahili na unaonyesha kumtegemea Mungu.
- source_word: καλούμενος
  choice: alipoitwa
  rationale: Kirai hiki cha wakati katika kauli ya kutendwa kinaonyesha mazingira ya kutii kwa Abrahamu bila kulazimisha mpangilio zaidi ya maandishi.
- source_word: ὑπήκουσεν ἐξελθεῖν
  choice: alitii na kuondoka
  rationale: Kiswahili cha kawaida hakitumii kwa urahisi muundo unaolingana moja kwa moja na “alitii kuondoka.” Muundo huu unaonyesha kwamba kuitikia kwa kuondoka ndiko kulikokuwa tendo lake la utii.
- source_word: τόπον
  choice: mahali
  rationale: Neno linataja eneo ambalo bado halijabainishwa; Kiswahili hakihitaji kibainishi cha kutenganisha “a/the.”
- source_word: ἤμελλεν λαμβάνειν
  choice: ambapo angepokea
  rationale: Huhifadhi maana ya wakati ujao bila kuongeza dhana ya kwamba jambo hilo lilikuwa karibu sana kutokea au kutumia lugha nzito ya kuamriwa tangu awali.
- source_word: εἰς κληρονομίαν
  choice: kuwa urithi
  rationale: Inaonyesha hadhi au matokeo ya kupokea mahali hapo kama urithi, bila kuongeza kimilikishi kisichotajwa wazi katika Kigiriki.
- source_word: ἐξῆλθεν
  choice: akaondoka
  rationale: Inahifadhi tendo kuu la simulizi na mwangwi wa ἐξελθεῖν, ingawa Kiswahili hutumia kitenzi cha kawaida “kuondoka.”
- source_word: μὴ ἐπιστάμενος
  choice: bila kujua
  rationale: Ni njia ya kawaida na fupi ya kueleza hali iliyoandamana na kuondoka kwake.
- source_word: ποῦ ἔρχεται
  choice: anakokwenda
  rationale: Wakati uliopo wa Kigiriki unaeleza safari inayoendelea; “anakokwenda” ni Kiswahili cha asili kwa mahali anapoelekea.
theological_decisions:
- issue: Maana ya πίστις katika mwitikio wa Abrahamu
  choice: imani
  alternative: tumaini; uaminifu
  rationale: Muktadha unasisitiza kumtegemea Mungu na kuitikia wito wake. “Imani” huhifadhi neno kuu la sura hii bila kuifanya maana kuwa uaminifu wa Abrahamu pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Sentensi imeundwa kwa mtiririko wa kawaida, huku ikihifadhi uhusiano kati ya wito, utii, kuondoka, urithi, na kutokujua mahali pa kwenda.
