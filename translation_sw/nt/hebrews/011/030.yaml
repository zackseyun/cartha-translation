  text: By faith the walls of Jericho fell after they had been encircled for seven days[a].
translation:
  language: sw
  text: Kwa imani, kuta za Yeriko zilianguka baada ya kuzungukwa kwa siku saba.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kupitia imani.” Dativu ya Kigiriki πίστει inaweza kuonyesha njia au namna; matini kuu inadumisha usemi unaorudiwa katika Waebrania 11.
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: Kwa imani
  rationale: Hali ya kutoa ya πίστις inaweza kuonyesha njia au namna. “Kwa imani” ni usemi wa kawaida na wenye hadhi unaohifadhi uradidi wa sura ya 11 bila kufafanua kupita kiasi uhusiano huo.
- source_word: τὰ τείχη
  choice: kuta
  rationale: τεῖχος humaanisha ukuta, hasa ukuta wa mji; wingi wake umetafsiriwa kwa kawaida kama “kuta.”
- source_word: Ἰεριχὼ
  choice: za Yeriko
  rationale: Jina la mahali limetoholewa kwa umbo la Kiswahili “Yeriko,” na muundo wa “za” unaonyesha kwamba ni kuta za mji huo.
- source_word: ἔπεσαν
  choice: zilianguka
  rationale: Kitenzi πίπτω hapa humaanisha moja kwa moja “kuanguka”; tafsiri hii haiongezi wazo mahususi zaidi la kuporomoka.
- source_word: κυκλωθέντα
  choice: baada ya kuzungukwa
  rationale: Kauli-tendwa ya kitenzi-shirikishi inaeleza tendo lililotangulia kuanguka kwa kuta. “Kuzungukwa” huhifadhi mtazamo wa Kigiriki bila kuongeza wazi kwamba watu walizizunguka kwa kutembea.
- source_word: ἐπὶ ἑπτὰ ἡμέρας
  choice: kwa siku saba
  rationale: ἐπί pamoja na hali ya kushutumiwa katika usemi wa wakati huonyesha muda; “kwa siku saba” ni Kiswahili cha kawaida na kinacholingana na dokezo la simulizi la Yoshua 6.
theological_decisions:
- issue: Maana ya πίστις katika Waebrania 11:30
  choice: imani
  alternative: uaminifu; tumaini
  rationale: Katika uradidi wa Waebrania 11, “imani” ndiyo tafsiri ya kawaida na inayofaa zaidi. Haibadili neno kuwa “uaminifu” wala kulipunguza kuwa hisia ya kutumaini.
- issue: Uhusiano unaoonyeshwa na πίστει
  choice: Kwa imani
  alternative: Kupitia imani
  rationale: Hali ya kutoa inaweza kuonyesha njia au namna. Matini kuu inahifadhi usemi wa kawaida wa sura hii, huku tanbihi ikitaja uwezekano mwingine bila kuamua zaidi ya Kigiriki.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni nyepesi kueleweka, huku kauli-tendwa na utata halisi wa πίστει vikihifadhiwa.
