  yaml_path: translation/nt/hebrews/011/036.yaml
  text: And others experienced mocking and flogging[a], and even chains and imprisonment.
translation:
  language: sw
  text: Wengine nao walidhihakiwa na kupigwa mijeledi,[a] na hata walifungwa kwa minyororo na kutiwa gerezani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wengine nao walipitia majaribu ya dhihaka na kupigwa mijeledi, na hata ya kufungwa kwa minyororo na kutiwa gerezani.” Kigiriki kwa maana halisi zaidi kinasema, “walipokea jaribio la...”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕτεροι
  choice: Wengine
  rationale: Inaonyesha kundi jingine katika orodha ya waaminifu walioteseka, huku ikidumisha utofautishaji na mifano iliyotangulia.
- source_word: ἐμπαιγμῶν
  choice: walidhihakiwa
  rationale: Kitenzi hiki ni cha kawaida na chenye hadhi katika Kiswahili cha sasa, na kinaeleza kutendewa dhihaka.
- source_word: μαστίγων
  choice: kupigwa mijeledi
  rationale: Hueleza kwa uwazi adhabu ya kupigwa kwa mijeledi, badala ya neno pana zaidi la kupigwa.
- source_word: πεῖραν ἔλαβον
  choice: walidhihakiwa na kupigwa mijeledi
  rationale: Muundo wa Kigiriki, kwa maana halisi ‘walipokea jaribu la,’ umetafsiriwa kwa vitendo vya moja kwa moja ili kutoa Kiswahili cha kawaida; tanbihi inahifadhi uwezekano wa maana ya kupitia majaribu.
- source_word: ἔτι δὲ
  choice: na hata
  rationale: Inaonyesha kuongezeka kwa ukali kutoka dhihaka na mijeledi hadi kufungwa na kutiwa gerezani.
- source_word: δεσμῶν
  choice: walifungwa minyororo
  rationale: ‘Minyororo’ ni picha halisi na inayoeleweka ya vifungo vya wafungwa; kitenzi ‘walifungwa’ huifanya sentensi iwe ya asili.
- source_word: φυλακῆς
  choice: kutiwa gerezani
  rationale: Huwasilisha hali ya kufungwa gerezani kwa Kiswahili cha kawaida na sahihi.
