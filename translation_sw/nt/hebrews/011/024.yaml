lexical_decisions:
- source_word: πίστει
  choice: Kwa imani
  rationale: Hii ni hali ya njia/chombo; katika Waebrania 11 ni kauli inayorudiwa na kwa Kiswahili cha kawaida hutafsiriwa kwa ufasaha kuwa “Kwa imani.”
- source_word: Μωϋσῆς
  choice: Musa
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
- source_word: μέγας γενόμενος
  choice: alipokuwa mtu mzima
  rationale: Katika muktadha huu kirai hiki kinaeleza kufikia utu uzima, si kupata ukuu au cheo.
- source_word: ἠρνήσατο
  choice: alikataa
  rationale: Kitenzi kinaonyesha uamuzi wa kukataa utambulisho alioitwa nao; “alikataa” huambatana kwa kawaida na kitenzi-jina kinachofuata.
- source_word: λέγεσθαι
  choice: kuitwa
  rationale: Ni kitenzi-jina katika hali ya kutendwa, na “kuitwa” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: υἱὸς θυγατρὸς Φαραώ
  choice: mwana wa binti ya Farao
  rationale: Kirai hiki kinaonyesha utambulisho maalumu wa kifalme uliokuwa ukihusishwa na Musa. “Binti ya Farao” ni muundo wa kawaida kwa cheo cha ngeli ya 9.
- source_word: Φαραώ
  choice: Farao
  rationale: Hili ndilo umbo la kawaida la cheo hiki katika Kiswahili cha Biblia.
theological_decisions:
- issue: Tafsiri ya πίστις katika kauli inayorudiwa katika Waebrania 11
  choice: imani
  alternative: uaminifu; kutumaini
  rationale: Muundo na mkazo wa sura hii unaelekeza kwenye matendo yaliyofanywa kwa imani. Maana mbadala zinazowezekana zimehifadhiwa katika tanbihi bila kuondoa kauli kuu inayorudiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. “Alipokuwa mtu mzima” ni ya kawaida na inaeleza ukomavu bila kudokeza ukuu wa cheo; mpangilio wa sentensi umewekwa wazi na wa asili.
