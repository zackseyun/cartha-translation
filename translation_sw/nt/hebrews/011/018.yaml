lexical_decisions:
- source_word: πρὸς ὃν ἐλαλήθη
  choice: ambaye aliambiwa
  rationale: Hutoa kwa Kiswahili cha kawaida maana ya kirai cha uhusiano pamoja na kauli tendwa, bila kumtaja wazi msemaji ambaye Kigiriki hakumtaji.
- source_word: Ἐν Ἰσαὰκ
  choice: Kupitia Isaka
  rationale: Katika muktadha wa ahadi kuhusu ukoo, ἐν inaonyesha mstari ambao uzao wa Abrahamu utatambulishwa. “Kupitia Isaka” ni wazi na ya kawaida zaidi katika Kiswahili, huku tafsiri ya karibu zaidi na muundo wa Kigiriki ikihifadhiwa katika tanbihi.
- source_word: κληθήσεταί
  choice: utaitwa
  rationale: Ni kauli tendwa ya wakati ujao inayohifadhi wazo la kuita au kutaja lililo katika καλέω, bila kulibadili moja kwa moja kuwa “utahesabiwa.”
- source_word: σοι σπέρμα
  choice: uzao wako
  rationale: “Uzao” huwasilisha nomino ya umoja yenye maana ya kijumla na dative yenye maana ya umilikaji kwa Kiswahili fasaha.
theological_decisions:
- issue: Jinsi ya kutafsiri ahadi kuhusu mstari wa uzao kupitia Isaka
  choice: Kupitia Isaka uzao wako utaitwa
  alternative: Katika Isaka uzao wako utaitwa
  rationale: Tafsiri kuu inaeleza kwa kawaida uhusiano wa ukoo bila kuongeza kwamba uzao ‘utatokana’ na Isaka au ‘utahesabiwa’ kupitia yeye. Kitenzi “utaitwa” huhifadhi mvutano wa kimaana wa maandishi ya Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. “Uzao” limetumiwa badala ya “mbegu” kwa kuwa hapa neno hilo linawahusu wazao kwa maana ya kijumla.
