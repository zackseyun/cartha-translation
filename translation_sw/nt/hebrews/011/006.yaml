  text: χωρὶς δὲ πίστεως ἀδύνατον εὐαρεστῆσαι, πιστεῦσαι γὰρ δεῖ τὸν προσερχόμενον τῷ θεῷ ὅτι ἔστιν καὶ τοῖς ἐκζητοῦσιν αὐτὸν μισθαποδότης γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/006.yaml
  text: And without faith it is impossible to please him[c][b][a], for the one who comes to God must believe that he exists and that he is a rewarder of those who diligently seek him.
translation:
  language: sw
  text: Na bila imani[a] haiwezekani kumpendeza Mungu, kwa maana mtu anayemkaribia Mungu lazima aamini kwamba yuko[b], na kwamba yeye huwapa thawabu wale wanaomtafuta kwa bidii[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kumtumaini.” Neno la Kigiriki πίστις linaweza pia kumaanisha “uaminifu” katika baadhi ya miktadha, lakini hapa maelezo yanayofuata yanakazia kumwamini Mungu.
    reason: lexical_alternative
  - marker: b
    text: Kwa maneno mengine, “kwamba Mungu yupo.” Kigiriki kinasema kwa ufupi, “kwamba yuko” au “kwamba yu.”
    reason: lexical_alternative
  - marker: c
    text: Kigiriki kinaweza kutafsiriwa kwa uhalisi zaidi, “anakuwa mtoaji wa thawabu,” au “hujidhihirisha kuwa mtoaji wa thawabu.” Katika muktadha huu, kauli hiyo hueleza kwamba Mungu hujidhihirisha kuwa mtoaji wa thawabu kwa wale wanaomtafuta.
    reason: lexical_alternative
lexical_decisions:
- source_word: χωρὶς δὲ
  choice: Na bila
  rationale: χωρίς huonyesha kutokuwapo kwa kitu, na δέ ni kiunganishi hafifu. “Na bila” linaendeleza mtiririko kutoka mifano iliyotangulia bila kuingiza utofautishaji mkali.
- source_word: πίστεως
  choice: imani
  rationale: Katika muktadha huu πίστις inaelezwa mara moja kwa πιστεῦσαι, yaani kuamini. “Imani” ni neno la kawaida na linalofaa, huku uwezekano wa maana ya “kumtumaini” ukihifadhiwa katika tanbihi.
- source_word: ἀδύνατον εὐαρεστῆσαι
  choice: haiwezekani kumpendeza Mungu
  rationale: Muundo wa kivumishi kisicho na mtenda pamoja na kitenzi-jina unatafsiriwa kwa kawaida “haiwezekani kumpendeza.” “Mungu” ametajwa wazi kwa kuwa ndiye rejeleo la kitenzi na anatajwa katika kishazi kinachofuata.
- source_word: πιστεῦσαι γὰρ δεῖ
  choice: kwa maana ... lazima aamini
  rationale: γάρ inatoa sababu, na δεῖ huonyesha ulazima. Muundo huu ni wa asili katika Kiswahili na unadumisha nguvu ya kauli.
- source_word: τὸν προσερχόμενον τῷ θεῷ
  choice: mtu anayemkaribia Mungu
  rationale: Kitenzi προσερχόμενον huonyesha kumwendea au kumkaribia Mungu. “Anayemkaribia” kinahifadhi picha ya kusogea karibu bila kuifanya kauli kuwa ya kiibada pekee.
- source_word: ὅτι ἔστιν
  choice: kwamba yuko
  rationale: Kauli fupi ya Kigiriki inathibitisha kuwapo kwa Mungu. “Yuko” ni ya asili na fupi katika Kiswahili, huku maana iliyo wazi zaidi ya “kwamba Mungu yupo” ikielezwa katika tanbihi.
- source_word: τοῖς ἐκζητοῦσιν αὐτὸν
  choice: wale wanaomtafuta kwa bidii
  rationale: ἐκζητέω ina nguvu kuliko “kutafuta” kwa kawaida; “kwa bidii” huonyesha utafutaji wa dhati na endelevu.
- source_word: μισθαποδότης γίνεται
  choice: yeye huwapa thawabu
  rationale: μισθαποδότης ni mtu anayetoa thawabu, na γίνεται katika muundo huu hueleza jinsi Mungu anavyodhihirika kwa wanaomtafuta. “Huwapa thawabu” ni Kiswahili cha kawaida; maana halisi zaidi ya kitenzi na nomino imehifadhiwa katika tanbihi.
theological_decisions:
- issue: Maana ya πίστις katika muktadha wenye uzito wa kiteolojia
  choice: imani
  alternative: kumtumaini; uaminifu
  rationale: Maelezo yanayofuata yanakazia kumwamini Mungu, kwa hiyo “imani” ndiyo chaguo kuu la asili. Tanbihi inahifadhi “kumtumaini” bila kulazimisha fundisho la dhehebu fulani; “uaminifu” si maana inayotawala hapa.
- issue: Nguvu ya γίνεται katika maelezo ya Mungu kuwa mtoaji wa thawabu
  choice: yeye huwapa thawabu
  alternative: anakuwa mtoaji wa thawabu; hujidhihirisha kuwa mtoaji wa thawabu
  rationale: Tafsiri kuu inaleta Kiswahili cha kawaida bila kudokeza kuwa tabia ya Mungu inabadilika. Tanbihi huhifadhi kwamba Kigiriki kimetumia γίνεται, “anakuwa,” ambacho hapa kinaweza kueleza jinsi Mungu anavyodhihirika au kupatikana kuwa kwa wale wanaomtafuta.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. “Kumkaribia Mungu,” “kwa bidii,” na “thawabu” hudumisha uzito wa kifungu bila kutumia istilahi nzito zisizo za lazima.
