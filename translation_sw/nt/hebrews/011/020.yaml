  alternative: Kwa imani ... akitabiri mambo yatakayokuja
  rationale: Tafsiri haibadili baraka kuwa unabii moja kwa moja; inahifadhi kauli ya Kigiriki kwamba baraka zilihusu mambo yajayo.
