  yaml_path: translation/nt/hebrews/011/001.yaml
  text: Faith is the assurance of things hoped for[b][a], the proof of things not seen.
translation:
  language: sw
  text: Imani ni uhakika wa mambo yanayotumainiwa[a], uthibitisho wa mambo yasiyoonekana[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “msingi” au “uhalisi” wa mambo yanayotumainiwa.
    reason: lexical_alternative
  - marker: b
    text: Au “ushahidi” au “usadikisho” wa mambo yasiyoonekana.
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστις
  choice: imani
  rationale: Katika muktadha huu neno hilo linamaanisha msimamo wa kumtumaini Mungu na ahadi zake. “Imani” ndilo neno la kawaida, lenye heshima, na linalofaa katika Kiswahili bila kulibana liwe hisia tu au uaminifu.
- source_word: ἐλπιζομένων
  choice: mambo yanayotumainiwa
  rationale: Kirai hiki kinahifadhi dhana ya mambo ambayo ndiyo maudhui ya tumaini na kinaeleweka kwa urahisi katika Kiswahili cha sasa.
- source_word: ὑπόστασις
  choice: uhakika
  rationale: Neno la Kigiriki linaweza kumaanisha msingi, uhalisi, au hali ya kuwa na uhakika. “Uhakika” linafaa katika muktadha wa himizo wa sura hii bila kulifanya neno hilo kuwa dai maalumu la kifalsafa.
- source_word: πραγμάτων
  choice: mambo
  rationale: “Mambo” ni neno pana linaloweza kurejelea vitu, hali, au mambo halisi, na linadumisha uwiano wa vifungu viwili.
- source_word: ἔλεγχος
  choice: uthibitisho
  rationale: Neno hili linaweza kuonyesha uthibitisho, ushahidi, au usadikisho unaotokana na ushahidi. “Uthibitisho” linahifadhi uzito wake wa kiushahidi na kuunda ulinganifu wa asili na “uhakika.”
- source_word: οὐ βλεπομένων
  choice: mambo yasiyoonekana
  rationale: Tafsiri hii ya moja kwa moja inadumisha hali ya mambo kutokuwa yanaonekana na ulinganifu wake na “mambo yanayotumainiwa.”
- source_word: δὲ
  choice: —
  rationale: Kiunganishi hiki ni mpito hafifu wa mazungumzo. Kimeachwa bila neno la wazi katika Kiswahili kwa sababu mwanzo wa sentensi mpya tayari unaonyesha mpito huo, na kuongeza “sasa” kungedokeza wakati ambao Kigiriki hakikusudii.
theological_decisions:
- issue: Maana ya ὑπόστασις katika Waebrania 11:1
  choice: uhakika
  alternative: msingi; uhalisi
  rationale: “Uhakika” linaonyesha nguvu ya kiutendaji na ya uzoefu katika maelezo haya ya imani, huku tanbihi ikihifadhi uwezekano halisi wa maana za “msingi” na “uhalisi.”
- issue: Tafsiri ya πίστις
  choice: imani
  alternative: tumaini; uaminifu
  rationale: Hapa hakuna muundo unaolazimisha maana ya “uaminifu.” Muktadha unahusu kumtumaini Mungu na ahadi zake, hivyo “imani” ndiyo tafsiri pana na ya kawaida zaidi.
- issue: Maana ya ἔλεγχος
  choice: uthibitisho
  alternative: ushahidi; usadikisho
  rationale: “Uthibitisho” huhifadhi upande wa kiushahidi wa neno, lakini “ushahidi” na “usadikisho” yanawezekana kwa sababu neno la Kigiriki linaweza kuelekeza ama kwenye msingi wa kusadiki ama kwenye usadikisho unaotokana nao.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa sentensi umehifadhi ulinganifu wa vifungu viwili vya Kigiriki. Alama za tanbihi zimewekwa baada ya maneno husika ili kila mbadala uhusishwe wazi na neno lake.
