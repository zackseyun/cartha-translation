  text: Πίστει διέβησαν τὴν Ἐρυθρὰν Θάλασσαν ὡς διὰ ξηρᾶς ⸀γῆς, ἧς πεῖραν λαβόντες οἱ Αἰγύπτιοι κατεπόθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/029.yaml
  text: By faith they crossed the Red Sea as through dry land[a], of which the Egyptians, when they attempted it, were swallowed up.
translation:
  language: sw
  text: Kwa imani walivuka Bahari ya Shamu kama kwenye nchi kavu[a]; Wamisri walipojaribu kufanya hivyo, walimezwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Bahari ya Matete.” Hapa maandishi ya Kigiriki yanasema “Bahari ya Shamu” (Ἐρυθρὰν Θάλασσαν), ingawa jina la Kiebrania katika simulizi la Kutoka wakati mwingine hufasiriwa kuwa “Bahari ya Matete.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πίστει
  choice: Kwa imani
  rationale: Hii ni hali ya utoaji njia au chombo; pia inadumisha fomula kuu inayorudiwa katika Waebrania 11.
- source_word: διέβησαν
  choice: walivuka
  rationale: Kitenzi kinaeleza kupita kutoka upande mmoja hadi mwingine; “walivuka” ni Kiswahili cha kawaida na sahihi.
- source_word: τὴν Ἐρυθρὰν Θάλασσαν
  choice: Bahari ya Shamu
  rationale: Kirai cha Kigiriki kinataja bahari inayojulikana katika mapokeo ya Kiswahili kama Bahari ya Shamu; uwezekano wa jina “Bahari ya Matete” kutokana na jina la Kiebrania katika Kutoka umewekwa katika tanbihi.
- source_word: ὡς διὰ ξηρᾶς γῆς
  choice: kana kwamba walipitia nchi kavu
  rationale: “Kana kwamba” huhifadhi ulinganisho wa ὡς, na “nchi kavu” huwasilisha maana ya ξηρᾶς γῆς kwa Kiswahili cha asili.
- source_word: ἧς πεῖραν λαβόντες
  choice: walipojaribu kufanya hivyo
  rationale: Nahau πεῖραν λαμβάνειν humaanisha kujaribu; “hivyo” huunganisha jaribio la Wamisri na tendo lilelile la kuivuka bahari bila kuleta muundo mgumu wa moja kwa moja.
- source_word: οἱ Αἰγύπτιοι
  choice: Wamisri
  rationale: Hili ni jina la kawaida la Kiswahili kwa watu wa Misri, likirejelea majeshi ya Farao katika tukio la Kutoka.
- source_word: κατεπόθησαν
  choice: walimezwa
  rationale: Huhifadhi taswira hai ya kitenzi καταπίνω, “kumeza,” badala ya kufasiri moja kwa moja kuwa “walizama.”
theological_decisions:
- issue: Tafsiri ya πίστις katika Waebrania 11
  choice: imani
  alternative: tumaini; uaminifu
  rationale: Fomula Πίστει inayorudiwa ni mhimili wa sura hii. “Imani” ni tafsiri ya kawaida na inayofaa katika muktadha huu, bila kuamua kwamba neno linamaanisha uaminifu.
- issue: Kiunganishi kati ya kuvuka kwa Waisraeli na jaribio la Wamisri
  choice: lakini Wamisri walipojaribu kufanya hivyo
  alternative: ambayo Wamisri walipojaribu kuivuka
  rationale: “Lakini” huonyesha tofauti dhahiri ya matokeo katika muktadha, huku “kufanya hivyo” kikihifadhi rejeo la kiwakilishi ἧς kwa jaribio la kuvuka. Hakiongezi maelezo ya kidoktrini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni nyepesi kwa msomaji wa kawaida huku ikihifadhi taswira ya “walimezwa” na ulinganisho wa “kana kwamba.”
