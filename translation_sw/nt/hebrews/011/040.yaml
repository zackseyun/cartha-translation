base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/040.yaml
  text: since God had provided something better for us[b][a], so that they would not be made perfect apart from us.
translation:
  language: sw
  text: kwa kuwa Mungu alikuwa ametutayarishia kitu kilicho bora zaidi[a], ili wao wasifanywe wakamilifu[b] pasipo sisi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mungu alikuwa ameona mapema kitu kilicho bora zaidi kwa ajili yetu.” Neno la Kigiriki linaweza kudokeza kuona mapema au kuandaa mapema; muktadha unaelekea zaidi kwenye maandalizi au mpango wa Mungu.
    reason: lexical_alternative
  - marker: b
    text: Au, “wasikamilishwe bila sisi,” au “wasifikishwe kwenye utimilifu pasipo sisi.”
    reason: alternative_reading
lexical_decisions:
- source_word: προβλεψαμένου
  choice: alikuwa ametutayarishia
  rationale: Katika muktadha huu, kitenzi hiki kinaonyesha kwamba Mungu alikuwa ameandaa au amepanga jambo mapema kwa ajili yetu, si kwamba aliliona tu kabla halijatokea. Muundo huu pia unasikika wa kawaida katika Kiswahili.
- source_word: κρεῖττόν τι
  choice: kitu kilicho bora zaidi
  rationale: Neno “bora zaidi” linadumisha wazo la ulinganisho na mada inayojirudia katika Waebrania, huku “kitu” kikihifadhi hali ya kutotajwa kwa undani.
- source_word: περὶ ἡμῶν
  choice: ametutayarishia
  rationale: Kiambishi “-tu-” pamoja na “-ia” kinaeleza kwa lugha ya kawaida kwamba maandalizi ya Mungu yalikuwa kwa ajili yetu au yakituhusu.
- source_word: ἵνα μὴ
  choice: ili ... wasi-
  rationale: “Ili” linahifadhi maana ya kusudi au matokeo yaliyokusudiwa.
- source_word: χωρὶς ἡμῶν
  choice: pasipo sisi
  rationale: Hili linaonyesha kwamba kukamilishwa kwao hakutokei bila sisi au kando yetu, na linadumisha wazo la pamoja.
- source_word: τελειωθῶσιν
  choice: wasifanywe wakamilifu
  rationale: Tafsiri hii inahifadhi maana pana ya kufanywa wakamilifu na kufikishwa kwenye utimilifu bila kuibana kuwa ukamilifu wa maadili pekee.
- source_word: τοῦ θεοῦ
  choice: Mungu
  rationale: 'Kiima cha kishiriki cha Kigiriki kinatolewa wazi katika kishazi tegemezi cha sababu: “kwa kuwa Mungu...”'
theological_decisions:
- issue: Maana ya τελειωθῶσιν katika muktadha wa historia ya wokovu katika Waebrania
  choice: wasifanywe wakamilifu
  alternative: wasifikishwe kwenye utimilifu
  rationale: “Wasifanywe wakamilifu” linahifadhi mvutano kati ya ukamilifu na kufikishwa kwenye lengo au utimilifu, bila kuamua kwamba maana ni ya kimaadili tu au ya mwisho wa nyakati tu.
- issue: Uhusiano wa waamini wa zamani na “sisi”
  choice: pasipo sisi
  alternative: bila sisi; kando yetu
  rationale: Usemi huu unadumisha wazo la kwamba utimilifu wao haujatenganishwa na wetu, bila kufafanua zaidi namna au wakati wa kukamilishwa huko.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. “Ametutayarishia” ni ya kawaida zaidi kuliko muundo mzito wa “ameandaa kwa habari yetu,” na “pasipo sisi” hudumisha hadhi ya kifungu bila kuwa ya kizamani sana.
