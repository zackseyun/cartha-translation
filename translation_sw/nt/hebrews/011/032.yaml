base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/032.yaml
  text: And what more shall I say? For time would fail me if I were telling about Gideon[a], Barak, Samson, Jephthah, David, and also Samuel and the prophets,
translation:
  language: sw
  text: Niseme nini zaidi? Maana muda hautanitosha nikisimulia[a] habari za Gideoni, Baraka, Samsoni, Yeftha, Daudi, na pia Samweli na manabii,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa tafsiri ya karibu zaidi na muundo wa Kigiriki: “Maana muda utanipungukia nikisimulia ...”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ τί ἔτι λέγω;
  choice: Niseme nini zaidi?
  rationale: Swali hili la balagha ni la kawaida na linaeleweka katika Kiswahili, huku likidumisha msukumo wa mwandishi wa kuongeza mifano mingine bila kuisimulia kwa kirefu.
- source_word: ἐπιλείψει με γὰρ ὁ χρόνος
  choice: Maana muda hautanitosha
  rationale: Hii ni namna ya asili ya Kiswahili ya kueleza kwamba muda utamwishia mwandishi kabla hajamaliza; “Maana” inadumisha nguvu ya ufafanuzi ya γάρ.
- source_word: διηγούμενον
  choice: nikisimulia
  rationale: Kitenzi hiki kinaonyesha tendo linaloendelea na hali ambayo muda haungetosha, bila kuongeza wazo lisilokuwamo la kuanza au kumaliza simulizi.
- source_word: περὶ
  choice: habari za
  rationale: Katika muktadha wa kusimulia kuhusu watu, “habari za” ni Kiswahili cha kawaida na chenye heshima kuliko uundaji mgumu wa moja kwa moja.
- source_word: Γεδεών, Βαράκ, Σαμψών, Ἰεφθάε, Δαυίδ, Σαμουὴλ
  choice: Gideoni, Baraka, Samsoni, Yeftha, Daudi, Samweli
  rationale: Majina yametolewa kwa maumbo yaliyozoeleka katika matumizi ya Biblia ya Kiswahili.
- source_word: τε καὶ
  choice: na pia
  rationale: “Na pia” inadumisha maana ya nyongeza katika uhusiano wa Daudi na Samweli bila kuifanya iwe nzito.
- source_word: τῶν προφητῶν
  choice: manabii
  rationale: Wingi huu wa kawaida unarejelea kundi la manabii; Kiswahili hakihitaji kibainishi kinacholingana na ὁ hapa.
theological_decisions:
- issue: Nguvu ya balagha ya kauli kuhusu muda
  choice: “Muda hautanitosha” imetumiwa kama kauli ya balagha inayoonyesha kwa nini mwandishi anafupisha simulizi.
  alternative: “Muda utanipungukia.”
  rationale: Tafsiri hii haidai kwamba mwandishi hana muda kabisa; inadumisha kusudi la sentensi la kuonyesha kwamba hawezi kueleza mifano yote kwa kirefu.
- issue: Mpangilio wa majina ya mwisho
  choice: “Daudi, na pia Samweli na manabii”
  alternative: “Daudi na Samweli na manabii”
  rationale: Muundo uliochaguliwa unahifadhi kwa kiasi nguvu ya nyongeza ya τε καὶ, huku Samweli akibaki ametajwa kwa jina tofauti na kundi pana la manabii.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni rahisi kwa wasomaji wa kawaida, lakini inadumisha swali la balagha, hali ya tendo linaloendelea, na mpangilio wa majina katika chanzo.
