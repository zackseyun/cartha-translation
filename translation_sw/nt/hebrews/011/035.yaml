source:
  edition: SBLGNT
  text: ἔλαβον γυναῖκες ἐξ ἀναστάσεως τοὺς νεκροὺς αὐτῶν· ἄλλοι δὲ ἐτυμπανίσθησαν, οὐ προσδεξάμενοι τὴν ἀπολύτρωσιν, ἵνα κρείττονος ἀναστάσεως τύχωσιν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/035.yaml
  text: Women received back their dead by resurrection[a]; but others were tortured, not accepting release[c][b], so that they might obtain a better resurrection.
translation:
  language: sw
  text: Wanawake waliwapokea tena wafu wao kwa kufufuliwa; lakini wengine waliteswa vikali[b], wakakataa kuachiliwa huru[a], ili wapate ufufuo bora zaidi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno linalotafsiriwa “kuachiliwa huru” linaweza pia kutafsiriwa “kuokolewa” au “kupewa uhuru.” Hapa linahusu kuwekwa huru kutoka matesoni au kifoni, wala si lazima ukombozi katika maana maalumu ya wokovu.
    reason: lexical_alternative
  - marker: b
    text: “Waliteswa vikali” hutafsiri kitenzi kinachohusishwa na mateso makali ya mwili, ambacho kihistoria huenda kilihusisha kifaa cha kuteshea. Njia kamili haijulikani kwa uhakika.
    reason: cultural_note
  - marker: c
    text: “Ufufuo bora zaidi” unatofautishwa na kurudishwa kwa wafu kwenye maisha ya kawaida yanayoweza kufa, kulikotajwa mwanzoni mwa aya; hapa ni tumaini la ufufuo ulio bora zaidi baada ya kifo.
    reason: cross_reference
lexical_decisions:
- source_word: ἔλαβον
  choice: waliwapokea tena
  rationale: Katika muktadha huu wanawake hawakuwapokea tu, bali waliwapata tena wapendwa wao waliokuwa wamekufa.
- source_word: γυναῖκες
  choice: Wanawake
  rationale: Neno hili hapa linarejelea wanawake kwa ujumla, wala si lazima wake.
- source_word: ἐξ ἀναστάσεως
  choice: kwa njia ya ufufuo
  rationale: Kirai hiki kinaonyesha njia au chanzo cha kuwapokea tena wafu wao, kwa Kiswahili cha kawaida na chenye heshima.
- source_word: τοὺς νεκροὺς αὐτῶν
  choice: wafu wao
  rationale: Hii ni tafsiri fupi na ya kawaida ya watu wao wa karibu waliokuwa wamekufa.
- source_word: ἄλλοι δὲ
  choice: lakini wengine
  rationale: δέ inaleta utofautishaji kati ya wale waliopata kurejeshewa wafu wao na waaminifu waliovumilia mateso bila kukubali kuokolewa kutoka humo.
- source_word: ἐτυμπανίσθησαν
  choice: waliteswa vikali
  rationale: Kitenzi kinaashiria mateso makali ya mwili, huenda kwa kupigwa kwenye kifaa fulani; kwa kuwa njia yenyewe haijulikani kwa uhakika, tafsiri haibainishi chombo maalumu.
- source_word: οὐ προσδεξάμενοι
  choice: wakakataa
  rationale: Kirai shiriki kinaonyesha kuwa hawakukubali jambo walilopewa kama chaguo; ‘wakakataa’ ni ya asili na wazi katika Kiswahili.
- source_word: τὴν ἀπολύτρωσιν
  choice: kuachiliwa
  rationale: Katika muktadha huu ni kuachiliwa kutoka matesoni au hatari ya kifo, si lazima ukombozi katika maana maalumu ya wokovu.
- source_word: ἵνα
  choice: ili
  rationale: Kiunganishi hiki kinaonyesha kusudi la kukataa kwao kuachiliwa.
- source_word: κρείττονος ἀναστάσεως
  choice: ufufuo ulio bora zaidi
  rationale: κρείττων humaanisha ‘bora zaidi’ na huendeleza utofautishaji wa mwandishi kati ya kurudishwa kwenye maisha haya na tumaini la ufufuo lililo bora zaidi.
- source_word: τύχωσιν
  choice: wapate
  rationale: Kitenzi hapa kina maana ya kupata au kufikia; ‘wapate’ ni cha kawaida na kinaendana vizuri na ‘ufufuo’.
theological_decisions:
- issue: Maana ya ἀπολύτρωσιν katika muktadha huu
  choice: kuachiliwa kutoka matesoni au kifoni
  alternative: ukombozi katika maana pana ya kitheolojia
  rationale: Muktadha unahusu waaminifu waliokataa nafasi ya kuponyoka ili wadumu katika uaminifu. ‘Kuachiliwa’ huhifadhi maana hiyo bila kuingiza dai la kiitikadi lisiloelezwa wazi.
- issue: Maana ya ‘ufufuo ulio bora zaidi’
  choice: ufufuo wa mwisho ulio bora kuliko kurudishwa kwa muda kwenye maisha ya kufa
  alternative: ufufuo wenye hali nzuri zaidi bila kuutaja wazi utofautishaji na sehemu ya kwanza ya aya
  rationale: Muundo wa aya unalinganisha kuhuishwa kwa wafu katika sehemu ya kwanza na tumaini la wale waliokubali kufa katika sehemu ya pili. Tafsiri yenyewe inaacha ufafanuzi zaidi kwenye tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi unadumisha utofautishaji wa Kigiriki kati ya kupokea waliokufa wakiwa hai tena na kukataa kuachiliwa kwa ajili ya ufufuo ulio bora zaidi. Alama zote za tanbihi zimewekwa karibu na maneno yanayofafanuliwa.
