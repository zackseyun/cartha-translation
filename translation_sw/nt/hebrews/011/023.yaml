id: HEB.11.23
reference: Hebrews 11:23
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Πίστει Μωϋσῆς γεννηθεὶς ἐκρύβη τρίμηνον ὑπὸ τῶν πατέρων αὐτοῦ, διότι εἶδον ἀστεῖον τὸ παιδίον καὶ οὐκ ἐφοβήθησαν τὸ διάταγμα τοῦ βασιλέως.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/023.yaml
  text: By faith Moses[a], when he was born, was hidden for three months by his parents, because they saw that the child was beautiful, and they were not afraid of the king’s edict.
translation:
  language: sw
  text: Kwa imani, Musa, alipozaliwa, alifichwa na wazazi wake kwa miezi mitatu, kwa sababu waliona kwamba mtoto huyo alikuwa mzuri[a], nao hawakuiogopa amri ya mfalme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mwenye kupendeza” au “wa pekee.” Neno la Kigiriki ἀστεῖον linaakisi Kutoka 2:2 na Matendo 7:20.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πίστει
  choice: Kwa imani
  rationale: Kirai hiki kinaonyesha njia au msingi wa tendo na kinaendeleza kaulimbiu inayojirudia katika Waebrania 11.
- source_word: γεννηθεὶς
  choice: alipozaliwa
  rationale: Kauli ya wakati inawasilisha kihusishi cha aoristi tendwa kwa Kiswahili cha kawaida na wazi.
- source_word: ἐκρύβη
  choice: alifichwa
  rationale: 'Huhifadhi kauli tendwa: Musa ndiye aliyefichwa na wengine.'
- source_word: τρίμηνον
  choice: kwa miezi mitatu
  rationale: Hueleza muda wa tendo kwa muundo wa kawaida wa Kiswahili.
- source_word: ὑπὸ τῶν πατέρων αὐτοῦ
  choice: na wazazi wake
  rationale: Ingawa πατέρων kwa umbo ni 'baba,' hapa humaanisha wazazi kwa pamoja, kulingana na muktadha wa Kutoka.
- source_word: ἀστεῖον
  choice: mzuri
  rationale: Neno linaweza kumaanisha mwenye sura nzuri, bora, au wa pekee. 'Mzuri' ni la asili na linaacha upana huo wa maana bila kudai ishara ya kimiujiza.
- source_word: τὸ παιδίον
  choice: mtoto huyo
  rationale: Hurejelea mtoto aliyekwisha kutajwa na kudumisha hadhi ya lugha ya kifungu.
- source_word: οὐκ ἐφοβήθησαν
  choice: hawakuiogopa
  rationale: Hutoa maana ya moja kwa moja na kuhifadhi utofauti kati ya imani na hofu.
- source_word: τὸ διάταγμα τοῦ βασιλέως
  choice: amri ya mfalme
  rationale: διάταγμα ni agizo rasmi; 'amri ya mfalme' ni wazi, ya kawaida, na yenye uzito unaofaa.
theological_decisions:
- issue: Sababu ya wazazi kumficha Musa
  choice: Tendo lao linaelezwa chini ya kichwa 'Kwa imani'; waliona mtoto alikuwa mzuri, nao hawakuiogopa amri ya mfalme.
  alternative: Uzuri wa mtoto pekee uliwachochea, au sura yake ilikuwa ishara maalumu ya Mungu.
  rationale: Muundo wa sentensi unadumisha pamoja kuonekana kwa uzuri wa mtoto na kutokuiogopa amri ya mfalme, bila kuongeza dai kwamba sura yake ilikuwa ishara ya kimiujiza.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Alama ya tanbihi [a] imewekwa mara tu baada ya neno linalohusika.
