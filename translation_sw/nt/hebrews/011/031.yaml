base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/031.yaml
  text: By faith Rahab the prostitute did not perish with those who were disobedient[b][a], because she had welcomed the spies in peace.
translation:
  language: sw
  text: Kwa imani, Rahabu, yule kahaba, hakuangamia pamoja na wale waliokataa kutii[a], kwa sababu aliwakaribisha wale wapelelezi kwa amani[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wale walioasi.”
    reason: lexical_alternative
  - marker: b
    text: Au, “baada ya kuwapokea wale wapelelezi kwa amani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: Kwa imani
  rationale: Hii ni hali ya namna/chombo inayoanzisha mfano wa Rahabu katika Waebrania 11; “kwa imani” ni usemi wa kawaida na wa asili katika Kiswahili.
- source_word: Ῥαὰβ
  choice: Rahabu
  rationale: Hili ndilo umbo la kawaida la jina hili katika mapokeo ya Biblia ya Kiswahili.
- source_word: ἡ πόρνη
  choice: yule kahaba
  rationale: “Kahaba” ni neno la sasa, wazi, na lenye hadhi ya kimtindo kuliko misamiati ya kizamani; linaendeleza nguvu ya kijamii na kimaadili ya πόρνη bila kulainisha maana.
- source_word: οὐ συναπώλετο
  choice: hakuangamia pamoja na
  rationale: Kitenzi ambatani kina wazo la kuangamia pamoja na wengine; muundo huu unalihifadhi wazi na kwa Kiswahili cha asili.
- source_word: τοῖς ἀπειθήσασιν
  choice: wale waliokataa kutii
  rationale: ἀπειθέω inaweza kumaanisha kutotii au kukataa kutii. “Waliokataa kutii” linaonyesha kipengele cha hiari bila kulibadili kuwa tu “kutokuamini.”
- source_word: δεξαμένη
  choice: kwa sababu aliwakaribisha
  rationale: Kirai kishirikishi cha aoristi kinaweza kueleza hali au sababu inayohusiana na kuokoka kwake; “kwa sababu” ni cha asili, huku uwezekano wa tafsiri ya kihali ukihifadhiwa katika tanbihi.
- source_word: τοὺς κατασκόπους
  choice: wale wapelelezi
  rationale: “Wapelelezi” ndilo neno la kawaida katika muktadha wa watu waliotumwa kuchunguza nchi au mji kwa siri.
- source_word: μετ’ εἰρήνης
  choice: kwa amani
  rationale: Huhifadhi nahau ya chanzo na kuonyesha namna ya kuwapokea—bila uadui na kwa nia njema.
theological_decisions:
- issue: Tafsiri ya πίστις katika mfumo wa mifano ya Waebrania 11
  choice: imani
  alternative: tumaini / uaminifu
  rationale: Katika muundo πίστει pamoja na jina la mfano, “imani” ndilo chaguo la msingi na la kawaida. “Tumaini” lingesogeza maana kuelekea hope, na “uaminifu” ungeweza kusisitiza faithfulness kuliko tendo la kuamini linalotawala hapa.
- issue: Maana ya ἀπειθήσασιν
  choice: waliokataa kutii
  alternative: wasiotii / wasioamini
  rationale: Chaguo hili linatunza maana ya uasi au kutotii bila kulazimisha tafsiri kuwa kutokuamini pekee, ingawa dhana hizo zinaweza kuhusiana katika muktadha.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa optimal-equivalence: unaweka wazo la kuangamia pamoja wazi, unatumia “kahaba” bila tafsida, na unatoa katika tanbihi uwezekano wa kusoma δεξαμένη kama hali ya wakati badala ya sababu.'
