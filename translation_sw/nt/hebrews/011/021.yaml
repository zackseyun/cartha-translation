  text: πίστει Ἰακὼβ ἀποθνῄσκων ἕκαστον τῶν υἱῶν Ἰωσὴφ εὐλόγησεν, καὶ προσεκύνησεν ἐπὶ τὸ ἄκρον τῆς ῥάβδου αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/021.yaml
  text: By faith Jacob[a], as he was dying, blessed each of the sons of Joseph[b], and worshiped while leaning on the top of his staff.
translation:
  language: sw
  text: Kwa imani, Yakobo alipokuwa akifa, alimbariki kila mmoja wa wana wa Yosefu, naye akaabudu akiwa ameegemea juu ya sehemu ya juu ya fimbo yake.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata matini ya Kiebrania ya Mwanzo 47:31, “aliinama kwa ibada juu ya kichwa cha kitanda chake.” Matini ya Kigiriki hapa yasema “fimbo.”
    reason: textual_variant
  - marker: b
    text: Au “akaabudu akielekea sehemu ya juu ya fimbo yake.” Huenda kirai hiki kinaeleza mkao wa Yakobo, wala si kitu alichokiabudu.
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: Kwa imani
  rationale: Nomino πίστις hapa ina maana ya imani, na hali ya udativu inaonyesha kwamba matendo ya Yakobo yalifanywa kwa imani; huu pia ndio mtindo unaorudiwa katika Waebrania 11.
- source_word: ἀποθνῄσκων
  choice: alipokuwa akifa
  rationale: Kitenzi-shirikishi cha wakati uliopo kinaonyesha tendo lililokuwa likiendelea wakati wa matendo makuu; tafsiri hii ni ya kawaida katika Kiswahili na inadumisha maana hiyo ya wakati mmoja.
- source_word: ἕκαστον τῶν υἱῶν Ἰωσὴφ
  choice: kila mmoja wa wana wa Yosefu
  rationale: ἕκαστον pamoja na muundo wa umilikishi wa sehemu inasisitiza kwamba kila mwana alipokea baraka kivyake.
- source_word: εὐλόγησεν
  choice: alimbariki
  rationale: Hii ni tafsiri ya kawaida na ya asili ya εὐλογέω katika muktadha wa Yakobo kuwapa wana wa Yosefu baraka.
- source_word: προσεκύνησεν
  choice: akaabudu
  rationale: Katika muktadha huu προσκυνέω inaeleza tendo la ibada, si kuinama kwa mwili tu; ‘akaabudu’ inadumisha maana ya kidini bila kutaja kitu kilichoabudiwa ambacho Kigiriki hakikitaji wazi.
- source_word: ἐπὶ τὸ ἄκρον τῆς ῥάβδου αὐτοῦ
  choice: huku akiegemea ncha ya fimbo yake
  rationale: Muundo huu unaeleza kwa Kiswahili cha kawaida mkao unaowezekana wa Yakobo, huku ukidumisha neno la Kigiriki ‘fimbo’ na kuepuka kudokeza kwamba fimbo ndiyo iliyoabudiwa.
theological_decisions:
- issue: Uhusiano kati ya ibada ya Yakobo na fimbo katika kishazi cha mwisho
  choice: Yakobo alimwabudu Mungu huku akiegemea ncha ya fimbo yake.
  alternative: Yakobo aliabudu akielekea ncha ya fimbo yake; au, kwa kufuata maandishi ya Kiebrania ya Mwanzo 47:31, aliinama kwa ibada juu ya kichwa cha kitanda chake.
  rationale: Maandishi ya Kigiriki ya Waebrania yanasema ‘fimbo’ na yanaakisi umbo la Septuajinti, ilhali maandishi ya Kiebrania ya Mwanzo 47:31 yanaweza kueleweka kuwa ‘kitanda.’ Tafsiri kuu inachukua kirai kama maelezo ya mkao, si kama kumfanya fimbo kuwa kitu cha kuabudiwa; uwezekano mwingine umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wazi kwa msomaji wa kawaida, huku tofauti kati ya ‘fimbo’ na ‘kitanda’ na utata wa kirai cha mwisho vikihifadhiwa katika tanbihi.
