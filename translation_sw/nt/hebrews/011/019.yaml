base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/019.yaml
  text: having considered that God is able even to raise from the dead[a], from where, in a figure[b], he also received him back.
translation:
  language: sw
  text: Alifikiri kwamba Mungu anaweza hata kumfufua kutoka kwa wafu. Kwa hiyo[a], kwa njia ya mfano[b], alimpokea tena.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kutoka huko.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kama mfano.” Usemi wa Kiyunani unaweza kumaanisha kwa namna ya kitamathali au kwa maana ya mfano wa kiishara.
    reason: lexical_alternative
lexical_decisions:
- source_word: λογισάμενος
  choice: Alifikiri
  rationale: Kitenzi hiki kinaonyesha Abrahamu akitafakari na kufikia uamuzi moyoni; “alifikiri” ni Kiswahili cha kawaida na chenye heshima bila kuongeza uhakika usioelezwa moja kwa moja.
- source_word: καὶ ἐκ νεκρῶν ἐγείρειν
  choice: hata kumfufua kutoka kwa wafu
  rationale: “Hata” linaonyesha msisitizo wa καί, na “kumfufua kutoka kwa wafu” ni usemi wa kawaida wa ufufuo unaodumisha wazo la kutoka miongoni mwa waliokufa. Kiambishi “-m-” kinamrejelea Isaka anayeeleweka kutokana na muktadha.
- source_word: δυνατὸς ὁ θεός
  choice: Mungu anaweza
  rationale: Hili linaakisi kwa ufupi na kwa kawaida kiarifu cha Kiyunani kuhusu uwezo wa Mungu.
- source_word: ὅθεν
  choice: Kwa hiyo
  rationale: Katika muktadha huu neno linaweza kuonyesha matokeo ya fikira za Abrahamu. Maana nyingine ya “kutoka huko” imehifadhiwa katika tanbihi kwa sababu neno pia linaweza kueleweka kwa maana ya chanzo.
- source_word: ἐν παραβολῇ
  choice: kwa njia ya mfano
  rationale: Usemi huu unadumisha maana ya ulinganisho au tukio lenye maana ya mfano bila kuamua kwa lazima kama mkazo uko kwenye lugha ya kitamathali au kwenye mfano wa kiishara.
- source_word: ἐκομίσατο
  choice: alimpokea tena
  rationale: Kitenzi cha kati katika muktadha huu kina maana ya kumpata au kumpokea Isaka tena baada ya kuwa tayari kumtoa; “alimpokea tena” ni cha asili na hudumisha wazo la kurudishiwa.
theological_decisions:
- issue: Namna Isaka alivyopokewa tena
  choice: “kwa njia ya mfano” linaonyesha kwamba Abrahamu alimpokea Isaka kana kwamba amerudi kutoka kwa wafu, bila kusema kwamba ufufuo halisi ulitokea.
  alternative: Usemi unaweza kusisitiza Isaka kama mfano au ishara yenye maana pana zaidi.
  rationale: ἐν παραβολῇ huweka tukio katika ulinganisho wa mfano. Tafsiri haifafanui zaidi aina ya mfano huo wala kuingiza fundisho maalumu lisilotajwa wazi.
- issue: Uhusiano wa ὅθεν na sentensi iliyotangulia
  choice: “Kwa hiyo” linaonyesha hitimisho au matokeo ya imani ya Abrahamu.
  alternative: “Kutoka huko” linaweza kuirejelea hali au eneo la wafu kwa njia ya kitamathali.
  rationale: Neno la Kiyunani linaweza kuwa la kimantiki au la chanzo; tanbihi inalinda uwezekano huo badala ya kuufuta.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni fupi na wazi; viwakilishi vinamrejelea Isaka kutokana na muktadha wa mstari uliotangulia.
