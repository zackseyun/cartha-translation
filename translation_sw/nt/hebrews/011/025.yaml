  text: μᾶλλον ἑλόμενος συγκακουχεῖσθαι τῷ λαῷ τοῦ θεοῦ ἢ πρόσκαιρον ἔχειν ἁμαρτίας ἀπόλαυσιν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/025.yaml
  text: choosing rather to be mistreated with the people of God than to have the temporary enjoyment of sin,[a]
translation:
  language: sw
  text: akachagua kuteswa pamoja na watu wa Mungu badala ya kufurahia dhambi kwa muda mfupi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “raha ya dhambi inayopita upesi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μᾶλλον ἑλόμενος
  choice: akachagua ... badala ya
  rationale: Muundo huu unaonyesha uamuzi wa makusudi na upendeleo kati ya mambo mawili, huku ukitiririka kiasili kutoka mstari uliotangulia.
- source_word: συγκακουχεῖσθαι
  choice: kuteswa pamoja na
  rationale: Unahifadhi maana ya kutendewa vibaya au kupata mateso na pia ushirika unaoonyeshwa na kiambishi συν-.
- source_word: τῷ λαῷ τοῦ θεοῦ
  choice: watu wa Mungu
  rationale: Ni usemi wa kawaida na wenye heshima unaohifadhi uhusiano wa umilikaji katika Kigiriki.
- source_word: πρόσκαιρον
  choice: kwa muda mfupi
  rationale: Inaeleza wazi kwamba hali hiyo hudumu kwa kipindi kifupi bila kuifanya iwe ya papo moja tu.
- source_word: ἔχειν ἁμαρτίας ἀπόλαυσιν
  choice: kufurahia dhambi
  rationale: Ingawa ἔχειν ni ‘kuwa na’ na ἀπόλαυσιν ni ‘furaha/raha,’ Kiswahili cha asili huepuka usemi mzito ‘kuwa na furaha ya dhambi’ kwa kutumia kitenzi ‘kufurahia,’ bila kuongeza maana mpya.
theological_decisions:
- issue: Dhambi inayorejelewa katika chaguo la Musa
  choice: Tafsiri inaacha ‘dhambi’ ikiwa pana bila kutaja matendo maalumu.
  alternative: Kuitambulisha hasa na anasa au marupurupu ya ikulu ya Farao.
  rationale: Kigiriki hakifafanui dhambi husika; kinaweka tu tofauti kati ya kushiriki mateso ya watu wa Mungu na furaha ya dhambi ya muda mfupi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. ‘Akachagua’ hudumisha uhusiano wa kishazi na Musa katika mstari uliotangulia.
