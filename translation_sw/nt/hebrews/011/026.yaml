  text: μείζονα πλοῦτον ἡγησάμενος τῶν Αἰγύπτου θησαυρῶν τὸν ὀνειδισμὸν τοῦ Χριστοῦ, ἀπέβλεπεν γὰρ εἰς τὴν μισθαποδοσίαν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/026.yaml
  text: He considered the reproach of Messiah greater wealth than the treasures of Egypt[b][a], for he was looking to the reward.
translation:
  language: sw
  text: Alihesabu fedheha ya Masihi[a] kuwa utajiri mkubwa kuliko hazina za Misri, kwa maana alikuwa akitazamia thawabu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kirai “fedheha ya Masihi” kinaweza kumaanisha fedheha inayobebwa kwa ajili ya Masihi, fedheha inayoshirikiwa na Mtiwa-Mafuta wa Mungu, au fedheha ambayo kitabu cha Waebrania huiona kuwa imetimizwa katika Masihi. Maneno ya Kigiriki hayaweki wazi uhusiano huo.
    reason: lexical_alternative
lexical_decisions:
- source_word: μείζονα πλοῦτον
  choice: utajiri mkuu kuliko
  rationale: Muundo wa kulinganisha unaonyesha kwamba jambo hili lilihesabiwa kuwa lenye thamani kubwa zaidi kuliko hazina za Misri; Kiswahili hutumia kwa kawaida muundo wa “mkuu kuliko” katika ulinganisho huu.
- source_word: ἡγησάμενος
  choice: Aliona kwamba
  rationale: Kitenzi ἡγέομαι hapa humaanisha kuhesabu au kutathmini jambo kuwa la thamani fulani. “Aliona kwamba” ni Kiswahili cha kawaida kinachohifadhi maana ya tathmini, si kuona kwa macho.
- source_word: τῶν Αἰγύπτου θησαυρῶν
  choice: hazina za Misri
  rationale: Huhifadhi kwa uwazi uhusiano wa kimilikishi wa Kigiriki na ni usemi wa kawaida wa Kiswahili.
- source_word: τὸν ὀνειδισμὸν
  choice: kushutumiwa
  rationale: ὀνειδισμός huonyesha shutuma, fedheha, au aibu anayotwishwa mtu. “Kushutumiwa” ni ya asili na inaonyesha kwamba Musa alivumilia lawama; tanbihi inaeleza uwezekano mpana zaidi wa “fedheha.”
- source_word: τοῦ Χριστοῦ
  choice: kwa ajili ya Masihi
  rationale: Χριστός inafanya kazi kama cheo, kwa hiyo “Masihi” linafaa. Genitivi inaweza kueleweka kwa njia kadhaa; katika matini kuu “kwa ajili ya” hutoa Kiswahili kinachoeleweka, huku tanbihi ikihifadhi utata wa uhusiano huo.
- source_word: ἀπέβλεπεν
  choice: alikuwa akitazamia
  rationale: Wakati usiotimilifu unaonyesha mwelekeo wa kudumu. “Alikuwa akitazamia” huhifadhi hali hiyo endelevu na kuelekeza fikira kwenye jambo la baadaye.
- source_word: μισθαποδοσίαν
  choice: thawabu
  rationale: Neno hili humaanisha malipo au ujira unaotolewa kwa mtu. “Thawabu” ni neno la kawaida na lenye hadhi katika muktadha wa imani na uvumilivu.
theological_decisions:
- issue: Uhusiano wa “kushutumiwa/fedheha” na Masihi katika τοῦ Χριστοῦ
  choice: Matini kuu yasema “kushutumiwa kwa ajili ya Masihi,” huku tanbihi ikitoa tafsiri ya karibu zaidi “fedheha ya Masihi” na kutaja upeo wa maana.
  alternative: “fedheha ya Masihi” bila ufafanuzi katika matini kuu
  rationale: Genitivi ya Kigiriki haibainishi moja kwa moja ikiwa ni shutuma kwa ajili ya Masihi, fedheha inayoshirikiwa naye, au fedheha ambayo Waebrania huona ikitimia kwake. Tanbihi huzuia tafsiri ya Kiswahili isifunge mjadala huo wa kiteolojia.
- issue: Utoaji wa Χριστοῦ kama cheo
  choice: Masihi
  alternative: Kristo
  rationale: Katika kifungu hiki Χριστός ni cheo cha Mtiwa-Mafuta, si jina la kawaida tu; “Masihi” huonyesha kazi hiyo ya cheo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imeundwa kwa urahisi ili isomeke kwa wasomaji wa kawaida, na tanbihi imehifadhi utata halisi wa genitivi ya Kigiriki.
