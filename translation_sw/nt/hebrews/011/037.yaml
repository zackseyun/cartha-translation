  text: ἐλιθάσθησαν, ⸀ἐπρίσθησαν, ἐν φόνῳ ⸀μαχαίρης ἀπέθανον, περιῆλθον ἐν μηλωταῖς, ἐν αἰγείοις δέρμασιν, ὑστερούμενοι, θλιβόμενοι, κακουχούμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/037.yaml
  text: They were stoned[a], they were sawn in two, they died by the sword; they went about in sheepskins, in goatskins, destitute, afflicted, mistreated—
translation:
  language: sw
  text: Walipigwa mawe, walikatwa vipande viwili kwa msumeno, walikufa kwa kuuawa kwa upanga[a]; walizunguka huku na huku wakiwa wamevaa ngozi za kondoo na za mbuzi, wakiwa wahitaji, wakiteswa na kutendewa vibaya—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: walikufa kwa upanga. Kigiriki kina neno lenye maana ya “mauaji” au “uchinjaji,” ambalo linasisitiza ukatili wa kifo hicho.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλιθάσθησαν
  choice: Walipigwa mawe
  rationale: Huhifadhi kauli tendwa ya kitenzi λιθάζω bila kuongeza wazi kwamba walikufa, jambo ambalo kitenzi chenyewe halitamki moja kwa moja.
- source_word: ἐπρίσθησαν
  choice: walikatwa vipande viwili kwa misumeno
  rationale: πρίζω humaanisha kukata kwa msumeno; ‘vipande viwili’ huwasilisha maana inayokusudiwa katika orodha hii ya mateso kwa Kiswahili cha kawaida.
- source_word: ἐν φόνῳ μαχαίρης ἀπέθανον
  choice: walikufa kwa kuchinjwa kwa upanga
  rationale: ‘Walikufa’ huwakilisha ἀπέθανον, huku ‘kwa kuchinjwa kwa upanga’ ikihifadhi uzito wa φόνος kuliko usemi rahisi ‘kwa upanga.’
- source_word: περιῆλθον
  choice: walizunguka huku na huku
  rationale: Hueleza kwenda kutoka mahali hadi mahali bila kuingiza kwa lazima wazo la kupotea linaloweza kusikika katika ‘walitangatanga.’
- source_word: ἐν μηλωταῖς, ἐν αἰγείοις δέρμασιν
  choice: wakiwa wamevaa ngozi za kondoo na za mbuzi
  rationale: Katika muktadha huu vihusishi vinaeleza mavazi; tamko wazi la kuvaa ni la asili katika Kiswahili na linadumisha ulinganifu wa aina hizo mbili za ngozi.
- source_word: ὑστερούμενοι
  choice: wakiwa wahitaji
  rationale: Huwasilisha hali ya kukosa mahitaji muhimu bila kuongeza vitu mahususi ambavyo Kigiriki hakutaji.
- source_word: θλιβόμενοι
  choice: wakiteswa
  rationale: Kauli hii huonyesha dhiki au shinikizo walilofanyiwa na inasomeka kwa kawaida katika orodha ya mateso.
- source_word: κακουχούμενοι
  choice: na kutendewa vibaya
  rationale: Ni tafsiri ya moja kwa moja na ya sasa ya kufanyiwa ubaya au kudhulumiwa, bila kuzidisha maana.
theological_decisions:
- issue: Uzito wa usemi ἐν φόνῳ μαχαίρης
  choice: walikufa kwa kuchinjwa kwa upanga
  alternative: waliuawa kwa upanga
  rationale: Kigiriki kina nomino φόνος, yenye wazo la mauaji au uchinjaji, pamoja na ἀπέθανον, ‘walikufa.’ Tafsiri kuu inadumisha ukali huo; tanbihi inatoa namna fupi na ya kawaida zaidi bila kudai kwamba tofauti hiyo ni ya kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa orodha na alama ya mwisho ya kuendeleza sentensi vimehifadhiwa. Kiashiria [a] kimewekwa baada ya kirai kinachoelezwa na tanbihi.
