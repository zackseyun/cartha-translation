  text: ἔσβεσαν δύναμιν πυρός, ἔφυγον στόματα ⸀μαχαίρης, ⸀ἐδυναμώθησαν ἀπὸ ἀσθενείας, ἐγενήθησαν ἰσχυροὶ ἐν πολέμῳ, παρεμβολὰς ἔκλιναν ἀλλοτρίων·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/034.yaml
  text: quenched the power of fire[a], escaped the edge of the sword, were made strong out of weakness, became mighty in battle[b], put foreign armies to flight.
translation:
  language: sw
  text: walizima nguvu za moto, wakaepuka makali ya upanga, wakatiwa nguvu kutoka katika hali ya udhaifu, wakawa hodari vitani, wakayakimbiza majeshi ya wageni.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kambi za wageni”; neno la Kigiriki linaweza kumaanisha kambi ya kijeshi na, kwa maana pana, jeshi lililopiga kambi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσβεσαν δύναμιν πυρός
  choice: walizima nguvu za moto
  rationale: Neno ἔσβεσαν lina maana ya kuzima, na δύναμιν πυρός hudumisha wazo la nguvu au uwezo wa moto badala ya kutaja moto pekee.
- source_word: ἔφυγον στόματα μαχαίρης
  choice: wakaepuka makali ya upanga
  rationale: Ingawa στόματα ni 'vinywa,' kirai hiki ni nahau inayomaanisha makali ya upanga; 'wakaepuka' huonyesha kuokoka kwao na si kukimbia tu.
- source_word: ἐδυναμώθησαν ἀπὸ ἀσθενείας
  choice: wakatiwa nguvu walipokuwa dhaifu
  rationale: Kauli tendwa ya ἐδυναμώθησαν imehifadhiwa kwa 'wakatiwa nguvu.' Kirai hiki kinaeleza kwa Kiswahili cha kawaida kwamba nguvu walizipokea wakiwa katika hali ya udhaifu, bila kudokeza walijitia nguvu wenyewe.
- source_word: ἐγενήθησαν ἰσχυροὶ ἐν πολέμῳ
  choice: wakawa hodari vitani
  rationale: '''Wakawa hodari'' huonyesha kuingia katika hali ya nguvu, na ''vitani'' ni usemi wa kawaida kwa muktadha wa mapambano.'
- source_word: παρεμβολὰς ἔκλιναν ἀλλοτρίων
  choice: wakayakimbiza majeshi ya wageni
  rationale: παρεμβολή kimsingi ni kambi, lakini hapa humaanisha jeshi lililopiga kambi; ἔκλιναν katika muktadha wa kijeshi ni kulifanya lirudi nyuma au likimbie. 'Majeshi ya wageni' huhifadhi maana ya majeshi ya watu wasio wao.
theological_decisions:
- issue: Kiwango cha uhalisia katika mfululizo wa matendo ya ukombozi na ushindi kwa imani
  choice: Kuhifadhi picha halisi za moto, upanga, udhaifu, vita na majeshi bila kuzifanya mafumbo ya kiroho
  alternative: Kuyafanya maneno ya jumla kuhusu kushinda hatari na maadui
  rationale: Muktadha wa Waebrania 11 unataja matendo ya kihistoria yanayohusishwa na waaminifu. Tafsiri haiongezi maana ya kiroho isiyotajwa wala kuondoa mvutano kati ya udhaifu wa kibinadamu na nguvu wanazopewa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa heshima na unaoeleweka kwa wasomaji wa kawaida. Vitenzi mfululizo vya 'waka-' vinatunza kasi ya orodha ya Kigiriki. 'Makali ya upanga' ni nahau asilia ya Kiswahili; hakuna tanbihi inayohitajika kwa nahau hiyo.
