lexical_decisions:
- source_word: καὶ
  choice: Na
  rationale: Kiunganishi cha kawaida kinachounganisha muhtasari huu na orodha iliyotangulia bila kuongeza wazo la upinzani lisilo wazi katika Kigiriki.
- source_word: πάντες
  choice: hao wote
  rationale: Hurejelea watu wa imani waliotajwa kabla; mpangilio huu ni wa asili katika Kiswahili na unaonyesha wazi rejeo hilo.
- source_word: μαρτυρηθέντες
  choice: ingawa walipata ushuhuda mzuri
  rationale: Kauli hii ya kutendwa inaonyesha kwamba walitolewa ushuhuda wa kuwakubali, kama ilivyo dhamira ya sura nzima. 'Ingawa' huonyesha uhusiano wa kimuktadha na sentensi inayofuata bila kubadili maana ya kitenzi.
- source_word: διὰ τῆς πίστεως
  choice: kwa njia ya imani
  rationale: διά pamoja na hali ya genitive huonyesha njia au chombo; tafsiri hii inadumisha maana hiyo wazi.
- source_word: πίστεως
  choice: imani
  rationale: Katika Waebrania 11 neno hili linahusu imani au kumtumaini Mungu; 'imani' ni istilahi ya kawaida, wazi, na yenye hadhi katika Kiswahili.
- source_word: οὐκ ἐκομίσαντο
  choice: hawakuipokea
  rationale: κομίζω katika umbo la kati hapa humaanisha kupokea au kupata kitu kilichoahidiwa; 'kupokea' ni ya asili na sahihi.
- source_word: τὴν ἐπαγγελίαν
  choice: ahadi
  rationale: Umoja wenye kibainishi umehifadhiwa kwa namna ya kawaida katika Kiswahili bila kuupanua kuwa utimilifu au kitu kilichoahidiwa.
theological_decisions:
- issue: Maana ya 'ahadi' katika muktadha
  choice: ahadi
  alternative: kile kilichoahidiwa; utimilifu wa ahadi; urithi au baraka iliyoahidiwa
  rationale: Kigiriki kina usemi mfupi na wenye mvutano wa kitheolojia unaofafanuliwa zaidi katika mstari wa 40. Kutumia 'ahadi' bila kuupanua huepuka kuamua kimya-kimya ni kipengele gani hasa cha ahadi kinachokusudiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Usemi 'walipata ushuhuda mzuri' unaeleweka kwa wasomaji wa kawaida huku ukihifadhi wazo la kauli ya kutendwa na kibali kilichotolewa; tanbihi zinatunza mbadala wa kileksika.
