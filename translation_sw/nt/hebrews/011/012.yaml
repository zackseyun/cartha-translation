  text: διὸ καὶ ἀφ’ ἑνὸς ἐγεννήθησαν, καὶ ταῦτα νενεκρωμένου, καθὼς τὰ ἄστρα τοῦ οὐρανοῦ τῷ πλήθει καὶ ὡς ἡ ἄμμος ἡ παρὰ τὸ χεῖλος τῆς θαλάσσης ἡ ἀναρίθμητος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/012.yaml
  text: Therefore from one man[a], and this one as good as dead, descendants were born as numerous as the stars of heaven and as the innumerable sand by the seashore.
translation:
  language: sw
  text: Kwa hiyo, kutoka kwa mtu mmoja[a]—naye akiwa kama mfu—walizaliwa wazao wengi kama nyota za mbinguni kwa idadi, na kama mchanga ulio kando ya bahari usiohesabika.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa karibu zaidi, “kutoka kwa mmoja, naye akiwa amefanywa kama mfu.” Maana katika muktadha ni kwamba Abrahamu alikuwa amezeeka kupita umri wa kawaida wa kuwa na watoto.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: Kwa hiyo
  rationale: Huonyesha hitimisho linalotokana na kauli iliyotangulia kuhusu imani na kuzaliwa kwa mtoto.
- source_word: ἀφ’ ἑνὸς
  choice: kutoka kwa mtu mmoja
  rationale: Umbo la kiume na muktadha humrejelea Abrahamu; neno “mtu” huweka maana hiyo wazi kwa Kiswahili cha kawaida.
- source_word: ἐγεννήθησαν
  choice: walizaliwa wazao
  rationale: Kitenzi cha wingi katika hali ya kutendwa kinaeleza kutokea kwa uzao; mpangilio huu ni wa asili katika Kiswahili na hufanya nomino inayodokezwa iwe wazi.
- source_word: καὶ ταῦτα νενεκρωμένου
  choice: naye akiwa kama mfu
  rationale: Ni usemi wa sitiari kuhusu hali ya Abrahamu ya kutoweza tena kuzaa kwa sababu ya umri, wala si kwamba alikuwa amekufa kihalisi.
- source_word: καθὼς τὰ ἄστρα τοῦ οὐρανοῦ τῷ πλήθει
  choice: wengi kama nyota za mbinguni
  rationale: Huhifadhi ulinganisho wa idadi kubwa kwa lugha ya Kiswahili iliyo wazi na yenye hadhi.
- source_word: ὡς ἡ ἄμμος ἡ παρὰ τὸ χεῖλος τῆς θαλάσσης ἡ ἀναρίθμητος
  choice: wasiohesabika kama mchanga ulio kando ya bahari
  rationale: Hutoa kwa kawaida taswira ya mchanga ulioko ukingoni mwa bahari na kusisitiza kwamba wazao hawawezi kuhesabika.
theological_decisions:
- issue: Anayerejelewa na ἀφ’ ἑνὸς (“kutoka kwa mmoja”)
  choice: kutoka kwa mtu mmoja
  alternative: kutoka kwa mmoja
  rationale: Muktadha na umbo la kiume humwelekeza msomaji kwa Abrahamu. Tafsiri hii huweka rejeleo wazi bila kulitaja jina ambalo halipo katika mstari.
- issue: Maana ya νενεκρωμένου
  choice: akiwa kama mfu
  alternative: akiwa amefanywa mfu
  rationale: Kauli hii inaeleza kwa sitiari hali ya Abrahamu ya kuzeeka na kutokuwa na uwezo wa kawaida wa kuzaa; haimaanishi kifo halisi. “Kama mfu” huhifadhi ukali wa taswira bila kuipotosha.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi huhifadhi picha za ahadi kuhusu nyota na mchanga huku ukiepuka lugha ya kale isiyo ya lazima.
