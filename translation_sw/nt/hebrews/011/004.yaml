  to: Kwa imani, Abeli alimtolea Mungu dhabihu bora kuliko ile ya Kaini[a]. Kwa dhabihu hiyo alishuhudiwa kuwa mwenye haki[b], Mungu akitoa ushuhuda kuhusu matoleo ya Abeli. Na kwa njia hiyo, ingawa alikufa, bado ananena[c].
