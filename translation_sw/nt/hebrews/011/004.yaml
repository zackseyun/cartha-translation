review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately renders the principal clauses and retains the comparative sense of πλείονα θυσίαν and the witness motif of μαρτυρέω. Two points need correction: in the genitive absolute, the possessive in “matoleo yake” can naturally be read as referring to Mungu in Swahili, whereas αὐτοῦ refers to Abel; and “kwa hiyo” is primarily causal in ordinary Swahili and does not adequately convey δι’ αὐτῆς (“through/by means of it”).'
  naturalness: The register is generally natural, clear Standard East African Swahili. “Alishuhudiwa kuwa mwenye haki” is acceptable in biblical/formal register. “Kwa njia hiyo” is clearer and more idiomatic than “kwa hiyo” for the final instrumental phrase while retaining an intentionally broad antecedent.
  terminology: “Imani,” “dhabihu,” “mwenye haki,” “ushuhuda,” and “ananena” are appropriate and consistent theological/biblical terminology. “Matoleo ya Abeli” correctly identifies the gifts as Abel’s without importing interpretation.
  issues:
  - severity: medium
    issue: Ambiguous possessive in “Mungu akitoa ushuhuda kuhusu matoleo yake.”
    rationale: Placed after “Mungu,” “yake” may be understood as God’s offerings. The Greek αὐτοῦ refers to Abel and should be made explicit in Swahili.
  - severity: medium
    issue: “Kwa hiyo” does not adequately render the instrumental force of δι’ αὐτῆς.
    rationale: In current Swahili, “kwa hiyo” normally means “therefore/for that reason,” changing the relation into a causal inference. “Kwa njia hiyo” expresses means while leaving open whether “hiyo” points to faith or sacrifice.
  revised_text: Kwa imani, Abeli alimtolea Mungu dhabihu bora kuliko ile ya Kaini[a]. Kwa dhabihu hiyo alishuhudiwa kuwa mwenye haki[b], Mungu akitoa ushuhuda kuhusu matoleo ya Abeli. Na kwa njia hiyo, ingawa alikufa, bado ananena[c].
  revised_footnotes:
