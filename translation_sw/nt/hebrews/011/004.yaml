  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Πίστει πλείονα θυσίαν Ἅβελ παρὰ Κάϊν προσήνεγκεν τῷ θεῷ, δι’ ἧς ἐμαρτυρήθη εἶναι δίκαιος, μαρτυροῦντος ἐπὶ τοῖς δώροις αὐτοῦ ⸂τοῦ θεοῦ⸃, καὶ δι’ αὐτῆς ἀποθανὼν ἔτι ⸀λαλεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/004.yaml
  text: By faith Abel offered to God a better sacrifice than Cain[a], through which he was attested as righteous, God testifying concerning his gifts; and through it, though he died[d][c][b], he still speaks.
translation:
  language: sw
  text: Kwa imani, Abeli alimtolea Mungu dhabihu bora kuliko ile ya Kaini[a]. Kwa dhabihu hiyo alishuhudiwa kuwa mwenye haki[b], Mungu akitoa ushuhuda kuhusu matoleo ya Abeli. Na kwa njia hiyo, ingawa alikufa, bado ananena[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “dhabihu kubwa zaidi kuliko ile ya Kaini.” Neno la Kigiriki linaweza kulenga ubora (“bora”) au ukubwa/wingi (“kubwa zaidi”).
    reason: lexical_alternative
  - marker: b
    text: Au, “alithibitishwa kuwa mwenye haki,” au “alipata ushuhuda kwamba alikuwa mwenye haki.”
    reason: lexical_alternative
  - marker: c
    text: Maneno “kwa njia hiyo” yanaweza kurejelea imani ya Abeli au dhabihu yake; Kigiriki hakibainishi kabisa.
    reason: alternative_reading
lexical_decisions:
- source_word: Πίστει
  choice: Kwa imani
  rationale: Hiki ni kielezi cha njia au chombo; “kwa imani” ni Kiswahili cha kawaida na kinaendana na mada kuu ya Waebrania 11.
- source_word: πλείονα θυσίαν
  choice: dhabihu bora
  rationale: πλείων inaweza kuonyesha ubora au wingi, lakini katika muktadha huu “bora” huwasilisha kwa kawaida ulinganisho wa dhabihu ya Abeli na ile ya Kaini bila kuongeza wazo la ‘kukubalika’ ambalo halijasemwa wazi.
- source_word: παρὰ Κάϊν
  choice: kuliko ya Kaini
  rationale: παρά baada ya neno la kulinganisha huonyesha kipimo cha ulinganisho. Kuongeza “ya” kunaweka wazi kwa Kiswahili kwamba dhabihu ya Abeli inalinganishwa na dhabihu ya Kaini, si kwamba dhabihu inalinganishwa na Kaini mwenyewe.
- source_word: προσήνεγκεν τῷ θεῷ
  choice: alimtolea Mungu
  rationale: Kitenzi προσφέρω katika mazingira ya ibada na dhabihu kina maana ya kutoa au kutolea; “alimtolea Mungu” ni kifupi na cha asili.
- source_word: δι’ ἧς
  choice: Kwa dhabihu hiyo
  rationale: Kiwakilishi cha kike katika Kigiriki kwa kawaida kinarejelea θυσίαν, ‘dhabihu.’ Kutaja dhabihu wazi kunazuia mkanganyiko usio wa lazima katika kishazi hiki.
- source_word: ἐμαρτυρήθη εἶναι δίκαιος
  choice: alishuhudiwa kuwa mwenye haki
  rationale: Tafsiri hii inadumisha msamiati wa ushuhuda unaorudiwa katika Waebrania 11 na wakati huohuo inahifadhi kauli ya kwamba Abeli alikuwa mwenye haki.
- source_word: μαρτυροῦντος ἐπὶ τοῖς δώροις αὐτοῦ τοῦ θεοῦ
  choice: Mungu akitoa ushuhuda kuhusu matoleo yake
  rationale: Muundo huu unamtaja Mungu wazi kuwa mtoa ushuhuda. “Matoleo” linafaa kwa δῶρα katika mazingira ya dhabihu na ni la kawaida kuliko ‘zawadi’ hapa.
- source_word: δι’ αὐτῆς
  choice: kwa hiyo
  rationale: Kigiriki kinaweza kurejelea imani ya Abeli au dhabihu yake. “Kwa hiyo” linaacha rejeleo hilo wazi kwa kiasi kinachowezekana katika Kiswahili; tanbihi inaeleza uwezekano wote.
- source_word: ἀποθανὼν
  choice: ingawa alikufa
  rationale: Kishiriki cha wakati uliopita kinaonyesha kifo kilichotangulia, na katika muktadha kina nguvu ya ukinzani kwa sababu bado ananena.
- source_word: ἔτι λαλεῖ
  choice: bado ananena
  rationale: Wakati uliopo unaonyesha athari au sauti inayoendelea. “Bado ananena” ni lugha yenye hadhi inayofaa maandiko na inahifadhi maana hiyo.
theological_decisions:
- issue: Kirejelewa cha δι’ αὐτῆς katika kishazi cha mwisho
  choice: Kimeachwa bila kubainishwa kabisa kwa maneno “kwa hiyo”
  alternative: kwa imani hiyo; kwa dhabihu hiyo
  rationale: Kiwakilishi cha Kigiriki kinaweza kuelekezwa kwa imani, ambayo ndiyo mada ya sura, au kwa dhabihu, ambalo ndilo neno la karibu linaloweza kurejelewa. Tafsiri kuu haichagui moja kimya kimya, na tanbihi inataja yote mawili.
- issue: Nguvu ya ἐμαρτυρήθη
  choice: alishuhudiwa kuwa mwenye haki
  alternative: alithibitishwa kuwa mwenye haki; alipata ushuhuda kwamba alikuwa mwenye haki
  rationale: “Alishuhudiwa” huhifadhi wazo la ushuhuda ambalo ni muhimu katika hoja ya Waebrania 11, badala ya kuligeuza tu kuwa sifa au kibali.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Dhabihu,” “mwenye haki,” na “ananena” ni maneno yanayoeleweka katika sajili ya kibiblia bila kuifanya sentensi kuwa ya kizamani kupita kiasi. Muundo umeweka marudio ya wazo la ushuhuda na umehifadhi utata halisi wa kishazi cha mwisho.
