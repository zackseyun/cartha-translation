  text: πίστει πεποίηκεν τὸ πάσχα καὶ τὴν πρόσχυσιν τοῦ αἵματος, ἵνα μὴ ὁ ὀλοθρεύων τὰ πρωτότοκα θίγῃ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/028.yaml
  text: By faith he has kept the Passover and the sprinkling of the blood[a], so that the destroyer of the firstborn might not touch them.
translation:
  language: sw
  text: Kwa imani aliadhimisha Pasaka na kunyunyiza damu[a], ili mwangamizaji wa wazaliwa wa kwanza asiwaguse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kupaka damu.” Neno la Kigiriki linarejelea tendo la kiibada la kuweka damu; “kunyunyiza” ni tafsiri ya jadi ya kiibada, lakini “kupaka” huenda ikaonyesha kwa usahihi zaidi mazingira ya Pasaka.
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: Kwa imani
  rationale: Dativu ya njia au chombo; pia inadumisha fomula inayorudiwa katika Waebrania 11.
- source_word: πεποίηκεν
  choice: aliadhimisha
  rationale: Katika muktadha huu ποιέω humaanisha kutekeleza au kuadhimisha Pasaka. Wakati timilifu wa Kigiriki umeelezwa kwa wakati uliopita wa Kiswahili kwa mtiririko wa kawaida wa simulizi.
- source_word: τὸ πάσχα
  choice: Pasaka
  rationale: Neno hili linaweza kurejelea tukio, sikukuu, au mlo wa Pasaka; 'Pasaka' halibanwi kwa mlo pekee.
- source_word: τὴν πρόσχυσιν τοῦ αἵματος
  choice: kunyunyiza damu
  rationale: Hutoa maana ya tendo la kiibada la kuweka damu, huku tafsiri mbadala inayolingana kwa karibu zaidi na mazingira ya Kutoka 12 ikihifadhiwa katika tanbihi.
- source_word: ἵνα μὴ
  choice: ili ... asi-
  rationale: Muundo huu wa Kiswahili unaonyesha kusudi la kishazi cha Kigiriki chenye μή na hali tegemezi.
- source_word: ὁ ὀλοθρεύων
  choice: yule mwenye kuwaangamiza
  rationale: Inahifadhi umbo la kirai cha Kigiriki bila kuongeza utambulisho wa 'malaika,' ambao haujatajwa wazi.
- source_word: τὰ πρωτότοκα
  choice: wazaliwa wa kwanza
  rationale: Ni tafsiri ya kawaida ya kivumishi cha wingi kilichotumiwa kama nomino, bila kukibana kwa kusema watoto pekee.
- source_word: θίγῃ
  choice: asiwasuse
  rationale: Kitenzi θιγγάνω kimsingi humaanisha kugusa; 'susa' hapa huhifadhi maana hiyo huku ikifaa katika muktadha wa mguso wenye madhara.
- source_word: αὐτῶν
  choice: wao / -wa- katika asiwasuse
  rationale: Kiwakilishi kinarejelea watu wanaohusishwa na Musa katika muktadha; kiambishi cha Kiswahili hudumisha rejeo hilo bila kuongeza jina lisilokuwapo katika Kigiriki.
theological_decisions:
- issue: Utambulisho wa mtenda aliyedokezwa katika πεποίηκεν
  choice: Kitenzi kimeachwa bila kumtaja Musa moja kwa moja
  alternative: Musa aliadhimisha
  rationale: Muktadha wa Waebrania 11:23–29 unaonyesha kuwa ni Musa, lakini Kigiriki hakirudii jina lake; Kiswahili kinaweza kuacha mtenda adokezwe na muktadha.
- issue: Maana ya πίστις
  choice: imani
  alternative: tumaini; uaminifu
  rationale: Mada na fomula inayorudiwa katika Waebrania 11 zinaunga mkono 'imani,' si 'uaminifu,' katika mstari huu.
- issue: Utambulisho wa ὁ ὀλοθρεύων
  choice: yule mwenye kuwaangamiza
  alternative: malaika mwenye kuangamiza
  rationale: Maandishi ya Kigiriki hayamtaji malaika; tafsiri haipaswi kuingiza utambulisho huo kwa njia ya ufafanuzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. 'Aliadhimisha Pasaka' ni usemi wa kawaida unaoeleweka; 'asiwasuse' huhifadhi maana ya msingi ya 'kugusa' katika muktadha wa madhara. Alama ya tanbihi [a] imewekwa mara tu baada ya kirai kinachohusika.
