  text: 'Na tena katika kifungu hiki cha Maandiko: “Hakika hawataingia katika pumziko langu.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kigiriki, neno kwa neno, “Ikiwa wataingia katika pumziko langu,” ni mtindo wa kiapo wenye maana ya “Hakika hawataingia katika pumziko langu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: katika mahali pengine
  rationale: Katika muktadha wa mfululizo wa manukuu ya Maandiko, kirai hiki kinaelekeza kwenye sehemu nyingine ya Maandiko; ‘katika mahali pengine’ ni Kiswahili cha kawaida na huunganisha mstari huu na nukuu iliyotangulia.
- source_word: πάλιν
  choice: tena
  rationale: Huonyesha kuwa mwandishi anatoa nukuu au ushuhuda mwingine wa Maandiko.
- source_word: Εἰ εἰσελεύσονται
  choice: Hakika hawataingia
  rationale: Ingawa kwa umbo ni sharti lenye maana halisi ‘ikiwa wataingia,’ hapa ni mtindo wa kiapo wa Kisemiti unaotumika kama ukanushaji wenye mkazo.
- source_word: κατάπαυσίν
  choice: pumziko
  rationale: ‘Pumziko’ ni neno la kawaida na linalofaa kwa dhana kuu ya κατάπαυσις katika Waebrania 3–4.
- source_word: μου
  choice: langu
  rationale: Huhifadhi usemi wa Mungu katika nafsi ya kwanza na kuonyesha kwamba ni pumziko lake.
theological_decisions:
- issue: Tafsiri ya kirai cha kiapo Εἰ εἰσελεύσονται
  choice: Hakika hawataingia katika pumziko langu
  alternative: Ikiwa wataingia katika pumziko langu
  rationale: Muundo wa sharti unaakisi mtindo wa kiapo wa Kiebrania na katika muktadha huu una nguvu ya ukanushaji mkali. Tafsiri hii huwasilisha maana huku tanbihi ikihifadhi umbo halisi na mvutano wake.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Anasema’ limeongezwa kwa uwazi wa kawaida wa Kiswahili katika utangulizi wa nukuu; mhusika anaeleweka kuwa Mungu kutokana na muktadha. Tanbihi huhifadhi umbo halisi la Kigiriki.
