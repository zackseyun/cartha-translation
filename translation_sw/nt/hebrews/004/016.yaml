source:
  edition: SBLGNT
  text: προσερχώμεθα οὖν μετὰ παρρησίας τῷ θρόνῳ τῆς χάριτος, ἵνα λάβωμεν ἔλεος καὶ χάριν εὕρωμεν εἰς εὔκαιρον βοήθειαν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/016.yaml
  text: Therefore[a], let us approach the throne of grace with boldness[b], so that we may receive mercy and find grace for timely help.
translation:
  language: sw
  text: Basi, na tukikaribie kiti cha enzi cha neema kwa ujasiri[a], ili tupokee rehema na tupate neema ya kutusaidia wakati ufaao[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa uhuru.” Neno la Kigiriki linaweza kueleza ujasiri, uhuru wa kusema wazi, au kumkaribia mtu bila hofu.
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa msaada wakati wa uhitaji.” Kirai cha Kigiriki hukazia msaada unaotolewa wakati ufaao.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσερχώμεθα
  choice: na tukikaribie
  rationale: Kitenzi hiki ni subjunktivu ya wakati uliopo yenye nguvu ya himizo. “Na tukikaribie” ni Kiswahili cha sasa kinachoeleweka na kinahifadhi mwaliko wa pamoja wa kumkaribia Mungu.
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Huonyesha hitimisho linalotokana na hoja iliyotangulia kuhusu Yesu kuwa kuhani mkuu.
- source_word: μετὰ παρρησίας
  choice: kwa ujasiri
  rationale: παρρησία linaweza kumaanisha ujasiri, uhuru wa kusema, au uhakika katika kumkaribia mwingine. “Kwa ujasiri” linahifadhi nguvu ya usemi bila kudokeza kiburi.
- source_word: τῷ θρόνῳ τῆς χάριτος
  choice: kiti cha enzi cha neema
  rationale: Linahifadhi muundo wa kirai cha Kigiriki na sitiari yake bila kuamua kimya kimya kuwa ni ‘kiti cha enzi chenye neema.’
- source_word: ἵνα
  choice: ili
  rationale: Huonyesha kusudi kwa njia ya kawaida na fasaha katika Kiswahili.
- source_word: λάβωμεν ἔλεος
  choice: tupokee rehema
  rationale: “Kupokea” ni maana ya kawaida ya λαμβάνω, na “rehema” ni tafsiri sanifu ya ἔλεος.
- source_word: χάριν εὕρωμεν
  choice: kupata neema
  rationale: “Kupata” ni ya asili zaidi kuliko tafsiri halisi ‘kuona/kukuta’ katika muktadha huu, huku “neema” ikihifadhi istilahi kuu ya χάρις na tofauti yake na rehema.
- source_word: εἰς εὔκαιρον βοήθειαν
  choice: kwa ajili ya msaada unaokuja kwa wakati unaofaa
  rationale: εὔκαιρος huelekeza kwenye msaada wenye kufika wakati unaofaa. Uundaji huu ni wazi kwa msomaji wa kawaida na hauhamishi mkazo wote kwenda kwenye hali ya uhitaji.
theological_decisions:
- issue: Maana ya παρρησία katika kumkaribia Mungu
  choice: kwa ujasiri
  alternative: kwa uhakika
  rationale: “Kwa ujasiri” linahifadhi wazo lenye nguvu la uhuru wa kumkaribia Mungu kwa sababu ya ukuhani mkuu wa Yesu; tanbihi inadumisha maana nyingine halali ya uhakika bila kuifanya ujasiri kuwa majivuno.
- issue: Tafsiri ya χάρις katika kishazi cha pili
  choice: neema
  alternative: fadhili
  rationale: “Neema” ni sahihi katika muktadha wa wema wa Mungu na huhifadhi uhusiano wa kileksia na “kiti cha enzi cha neema,” bila kuongeza fundisho lisilosemwa na kifungu.
- issue: Wakati wa msaada katika εὔκαιρον βοήθειαν
  choice: msaada unaokuja kwa wakati unaofaa
  alternative: msaada wakati wa uhitaji
  rationale: Chaguo kuu linahifadhi mkazo wa εὔκαιρος juu ya kufaa kwa wakati wa msaada. Tafsiri mbadala ni ya kueleweka lakini hutafsiri wazi zaidi hali ya mpokeaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa himizo la pamoja umehifadhiwa, pamoja na sitiari ya kiti cha enzi na tofauti kati ya kupokea rehema na kupata neema.
