  yaml_path: translation/nt/hebrews/004/008.yaml
  text: For if Joshua had given them rest[a], he would not have spoken later about another day.
translation:
  language: sw
  text: Kwa maana, kama Yoshua angewapa pumziko[a], Mungu hangalisema baadaye kuhusu siku nyingine.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kigiriki: “Yesu.” Umbo la jina Ἰησοῦς linaweza kumaanisha Yesu au Yoshua; hapa muktadha unaelekeza kwa Yoshua mwana wa Nuni.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰησοῦς
  choice: Yoshua
  rationale: Umbo la Kigiriki Ἰησοῦς linaweza kumaanisha Yesu au Yoshua. Muktadha unahusu kuingia kwa Israeli katika nchi chini ya Yoshua mwana wa Nuni, hivyo “Yoshua” ndilo rejeleo linalokusudiwa hapa.
- source_word: κατέπαυσεν
  choice: angaliwapa pumziko
  rationale: Kitenzi καταπαύω hapa kina maana ya kusababisha watu wapumzike au kuwapa pumziko. Kauli “kuwapa pumziko” ni ya kawaida katika Kiswahili na inadumisha maana hiyo ya kisababishi pamoja na mada ya pumziko katika kifungu.
- source_word: οὐκ ἂν ... ἐλάλει
  choice: asingalisema
  rationale: Muundo huu unaonyesha matokeo yasiyotokea katika hali ya kinyume na ukweli ya wakati uliopita. “Asingalisema” huwasilisha nguvu hiyo ya masharti kwa ufupi na bila kuongeza mtendaji ambaye hajatajwa wazi katika Kigiriki.
- source_word: περὶ ἄλλης ... ἡμέρας
  choice: kuhusu siku nyingine
  rationale: Kauli hii inaelekeza kwenye siku nyingine iliyotajwa baada ya wakati wa Yoshua. “Kuhusu siku nyingine” ni ya asili na haifafanui zaidi ya chanzo.
- source_word: μετὰ ταῦτα
  choice: baadaye
  rationale: Neno “baadaye” linaonyesha kwa kawaida mfuatano wa wakati unaomaanishwa na μετὰ ταῦτα.
- source_word: γὰρ
  choice: Kwa maana
  rationale: γάρ inatoa sababu inayounga mkono hoja iliyotangulia. “Kwa maana” hudumisha uhusiano huo wa kimantiki katika mtindo wenye hadhi.
theological_decisions:
- issue: Rejeleo la Ἰησοῦς katika Waebrania 4:8
  choice: Yoshua mwana wa Nuni
  alternative: Yesu
  rationale: Hoja inahusu Israeli kuingia katika nchi chini ya Yoshua na ahadi ya baadaye ya pumziko katika Zaburi 95. Hata hivyo, kwa kuwa umbo la jina la Kigiriki ni lilelile kwa Yesu na Yoshua, jambo hilo linawekwa wazi katika tanbihi.
- issue: Mtendaji wa ἐλάλει
  choice: 'Kuacha mtendaji bila kutajwa wazi: “asingalisema”'
  alternative: “Mungu asingalisema” au kuelewa kwamba ni Yoshua aliyesema
  rationale: Kitenzi cha Kigiriki hakitaji nomino wala kiwakilishi cha mtendaji katika mstari huu. Tafsiri haiongezi “Mungu,” lakini tanbihi inaonya kwamba mtendaji ametegemezwa na muktadha, ili kutomfanya Yoshua kuwa mtendaji kwa lazima.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaosomeka kwa urahisi. Maumbo “angaliwapa” na “asingalisema” yanadumisha hali ya kinyume na ukweli ya wakati uliopita bila kuwa mazito kupita kiasi. “Pumziko” limetumiwa kwa uthabiti ili kuhifadhi neno kuu la hoja ya Waebrania 3–4.
