  text: πάλιν τινὰ ὁρίζει ἡμέραν, Σήμερον, ἐν Δαυὶδ λέγων μετὰ τοσοῦτον χρόνον, καθὼς ⸀προείρηται, Σήμερον ἐὰν τῆς φωνῆς αὐτοῦ ἀκούσητε, μὴ σκληρύνητε τὰς καρδίας ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/007.yaml
  text: 'Again he appoints a certain day[a], “Today,” saying through David after so long a time, just as has been said before: “Today, if you hear his voice, do not harden your hearts.”'
translation:
  language: sw
  text: 'Kwa mara nyingine, Mungu anaiteua siku fulani, “Leo,” akisema kwa njia ya Daudi[a] baada ya muda mrefu hivyo, kama ilivyosemwa hapo awali:


    “Leo, ikiwa mtaisikia sauti yake,

    msifanye mioyo yenu kuwa migumu.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika Daudi,” yaani, katika zaburi inayohusishwa na Daudi.
    reason: alternative_reading
lexical_decisions:
- source_word: πάλιν
  choice: Kwa mara nyingine
  rationale: Inaonyesha kwamba hoja inaanza tena kwa kusema Mungu anateua siku nyingine ya kuitwa “Leo.”
- source_word: τινὰ ἡμέραν
  choice: siku fulani
  rationale: Inahifadhi maana ya siku mahususi ambayo haijatajwa kwa jina jingine isipokuwa “Leo.”
- source_word: ὁρίζει
  choice: anaiteua
  rationale: Kitenzi hiki kinaonyesha kuweka au kuamua kwa mamlaka siku hiyo.
- source_word: Σήμερον
  choice: Leo
  rationale: Limehifadhiwa kama jina lenye mkazo la siku iliyowekwa katika nukuu ya Zaburi 95.
- source_word: ἐν Δαυὶδ λέγων
  choice: akisema kwa njia ya Daudi
  rationale: Ni Kiswahili cha kawaida kinachoonyesha kwamba Mungu alisema kwa kumtumia Daudi, bila kutoa dai pana zaidi kuhusu namna ya uandishi.
- source_word: μετὰ τοσοῦτον χρόνον
  choice: baada ya muda mrefu hivyo
  rationale: Inaonyesha kipindi kirefu kilichopita tangu kizazi cha jangwani.
- source_word: καθὼς προείρηται
  choice: kama ilivyosemwa hapo awali
  rationale: Inawakilisha usemi uliotangulia ambao bado una umuhimu katika hoja.
- source_word: ἐὰν τῆς φωνῆς αὐτοῦ ἀκούσητε
  choice: ikiwa mtaisikia sauti yake
  rationale: Inadumisha taswira ya kibiblia ya kuisikia sauti, bila kuibadili moja kwa moja kuwa “kutii.”
- source_word: μὴ σκληρύνητε τὰς καρδίας ὑμῶν
  choice: msifanye mioyo yenu kuwa migumu
  rationale: Ni onyo la kawaida na linaloeleweka dhidi ya kuwa wakaidi moyoni.
theological_decisions:
- issue: Nguvu ya neno “Leo” katika hoja kuhusu pumziko la Mungu
  choice: “Leo” imetafsiriwa kama nafasi ya sasa ya kuitikia ambayo Mungu ameiteua, bila kuifanya kuwa tarehe ya kalenda pekee.
  alternative: Kuichukulia “Leo” kuwa siku ya kihistoria ya mtunga-zaburi pekee, au siku ya mwisho pekee.
  rationale: Muktadha unasema kwamba muda mrefu baada ya kizazi cha jangwani Mungu bado anataja siku ya kuitikia. Tafsiri haifungi mvutano huu kwa mfumo mmoja wa kitheolojia.
- issue: Maana ya ἐν Δαυὶδ
  choice: kwa njia ya Daudi
  alternative: katika Daudi, yaani katika zaburi inayohusishwa na Daudi
  rationale: Uchaguzi huu unaeleza kwa Kiswahili cha kawaida kwamba Mungu ndiye msemaji anayetumia Daudi, huku tanbihi ikihifadhi uwezekano wa kuelewa kirai hicho kama rejeo la zaburi.
- issue: Kiima kisichotajwa wazi cha ὁρίζει
  choice: Mungu anaiteua
  alternative: anaiteua
  rationale: Muktadha wa karibu unamtaja Mungu kama mwenye ahadi na mwenye kusema; kutaja “Mungu” kunazuia utata usio wa lazima katika Kiswahili bila kubadili hoja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa nukuu umewekwa kwa mistari ili onyo la Zaburi lionekane wazi. Alama [a] imewekwa baada ya “Daudi,” mahali inapohusika moja kwa moja, badala ya baada ya “siku fulani.”
