base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/013.yaml
  text: And no creature is hidden from his sight[a], but all things are naked and laid bare to his eyes[b], to whom we must give account.
translation:
  language: sw
  text: Wala hakuna kitu chochote kilichoumbwa kilichofichika mbele yake, bali vyote viko uchi na vimefunuliwa wazi[b] machoni pake—yeye ambaye tutatoa hesabu kwake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa tafsiri ya karibu zaidi na maneno ya Kigiriki: “yeye ambaye tuna neno naye”; usemi huo unaweza pia kueleweka kuwa “yeye ambaye neno au jambo letu linaelekezwa kwake.”'
    reason: alternative_reading
  - marker: b
    text: Neno lililotafsiriwa “vimefunuliwa wazi” limetokana na kitenzi adimu ambacho huenda kinadokeza shingo kuwa wazi au kurudishwa nyuma, na hivyo kusisitiza kufunuliwa kabisa mbele za Mungu.
    reason: lexical_alternative
lexical_decisions:
- source_word: κτίσις
  choice: kiumbe chochote
  rationale: Nomino ya umoja imetumiwa kwa maana ya jumla kuhusu chochote kilichoumbwa; “kiumbe chochote” huonyesha maana hiyo ya mgawanyo kwa Kiswahili cha kawaida.
- source_word: ἀφανὴς
  choice: kilichofichika
  rationale: Katika muktadha huu neno halimaanishi kutokuonekana kwa asili, bali kutoweza kujisitiri mbele ya uchunguzi wa Mungu.
- source_word: ἐνώπιον αὐτοῦ
  choice: machoni pake
  rationale: Ingawa kwa umbo ni “mbele yake,” hapa wazo la kuona linaendelea moja kwa moja katika kutajwa kwa macho yake.
- source_word: πάντα
  choice: vitu vyote
  rationale: Huhifadhi upeo mpana wa nomino ya wingi isiyo na jinsia.
- source_word: γυμνὰ
  choice: viko uchi
  rationale: Huhifadhi taswira hai ya kufunuliwa kabisa bila kuipunguza kuwa maelezo yasiyo ya kimfano.
- source_word: τετραχηλισμένα
  choice: vimewekwa wazi
  rationale: Kitenzi hiki adimu kinaonyesha hali ya kufunuliwa kabisa; tafsiri hii ni wazi kwa msomaji wa sasa bila kulazimisha picha inayobishaniwa ya shingo katika matini kuu.
- source_word: τοῖς ὀφθαλμοῖς αὐτοῦ
  choice: machoni pake
  rationale: Ni usemi wa kawaida na wenye hadhi unaoeleza kwamba kila kitu kiko wazi kwa uoni wake.
- source_word: πρὸς ὃν ἡμῖν ὁ λόγος
  choice: yeye ambaye tutatoa hesabu kwake
  rationale: Huwasilisha kwa uwazi maana ya kuwajibika mbele ya Mungu inayofaa muktadha, huku utata wa usemi mfupi wa Kigiriki ukihifadhiwa katika tanbihi.
theological_decisions:
- issue: Maana ya πρὸς ὃν ἡμῖν ὁ λόγος
  choice: 'Usemi unaeleza kuwajibika mbele za Mungu: “yeye ambaye tutatoa hesabu kwake.”'
  alternative: “yeye ambaye tunahusika naye” au “yeye ambaye neno/jambo letu linaelekezwa kwake”
  rationale: Muktadha wa Waebrania 4:12–13 unasisitiza ujuzi na uchunguzi wa Mungu. Tafsiri ya kutoa hesabu huhifadhi nguvu ya onyo, lakini tanbihi inaacha wazi uwezekano mwingine wa usemi huo uliobanwa.
- issue: Mhusika wa viwakilishi vya umoja
  choice: Viwakilishi “pake/kwake” vimeachwa virejelee mhusika wa muktadha bila kuongeza jina “Mungu” katika aya.
  alternative: Kutaja “Mungu” moja kwa moja
  rationale: Kigiriki kinatumia viwakilishi, hivyo kutotaja jina katika matini kuu hudumisha muundo wa chanzo na huepuka kuongeza ufafanuzi usioandikwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Taswira ya “uchi” imehifadhiwa kwa sababu ni ya makusudi katika Kigiriki. Alama zote za tanbihi zimewekwa katika matini kuu; [b] inahusiana na “vimewekwa wazi,” na [a] na kishazi cha mwisho.
