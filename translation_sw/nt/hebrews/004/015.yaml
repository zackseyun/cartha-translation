  text: οὐ γὰρ ἔχομεν ἀρχιερέα μὴ δυνάμενον συμπαθῆσαι ταῖς ἀσθενείαις ἡμῶν, ⸀πεπειρασμένον δὲ κατὰ πάντα καθ’ ὁμοιότητα χωρὶς ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/015.yaml
  text: For we do not have a high priest unable to sympathize with our weaknesses, but one who has been tested in every way according to likeness, yet without sin.
translation:
  language: sw
  text: Kwa maana hatuna kuhani mkuu asiyeweza kutuhurumia katika udhaifu wetu, bali tunaye aliyejaribiwa[a] katika kila jambo kwa namna inayofanana[b], lakini bila dhambi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki linaweza kumaanisha kushawishiwa kutenda mabaya au kupimwa kwa majaribu.
    reason: lexical_alternative
  - marker: b
    text: 'Kihalisi, “kwa kufanana”; kwa kuuweka wazi ulinganisho unaodokezwa: “kama sisi” au “kwa namna ileile kama sisi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρχιερέα
  choice: kuhani mkuu
  rationale: Hili ndilo neno la kawaida na sahihi kwa cheo hiki cha kikuhani, ambacho ni muhimu katika hoja ya Waebrania.
- source_word: μὴ δυνάμενον συμπαθῆσαι
  choice: asiyeweza kutuhurumia
  rationale: Muundo hasi umehifadhiwa ili kudumisha msisitizo wa Kigiriki wa ‘hatuna ... asiyeweza.’ ‘Kutuhurumia’ ni Kiswahili cha kawaida kinachoeleza kuguswa na hali yetu, ingawa kitenzi cha Kigiriki pia hubeba wazo la kuhisi pamoja na mwingine.
- source_word: ταῖς ἀσθενείαις ἡμῶν
  choice: katika udhaifu wetu
  rationale: ‘Udhaifu’ hapa unahusu hali yote ya unyonge na mipaka ya kibinadamu, si ugonjwa wa mwili pekee.
- source_word: πεπειρασμένον
  choice: aliyejaribiwa
  rationale: ‘Kujaribiwa’ kwa Kiswahili kinaweza kueleza kupimwa kwa majaribu na pia kushawishiwa kutenda mabaya; hivyo kinahifadhi upana wa maana wa πειράζω bila kuondoa mvutano wa kifungu.
- source_word: κατὰ πάντα
  choice: katika kila jambo
  rationale: Usemi huu unaonyesha ukamilifu wa majaribu aliyopitia kwa lugha ya kawaida na wazi.
- source_word: καθ’ ὁμοιότητα
  choice: kwa namna inayofanana
  rationale: Tafsiri hii inadumisha neno la Kigiriki linalosisitiza ufanano bila kuweka wazi katika matini kuu kile kinacholinganishwa, ambacho hakikutajwa moja kwa moja katika Kigiriki.
- source_word: χωρὶς ἁμαρτίας
  choice: lakini bila dhambi
  rationale: '‘Lakini’ inaonyesha utofauti wenye uzito: licha ya kujaribiwa kikamilifu, dhambi haikuwamo kwake.'
theological_decisions:
- issue: Maana ya πεπειρασμένον kuhusiana na kutokuwa na dhambi kwa Kristo
  choice: aliyejaribiwa
  alternative: aliyepimwa kwa majaribu
  rationale: ‘Aliyejaribiwa’ ni ya kawaida na inaruhusu maana zote mbili za kukabili kishawishi na kupimwa kwa majaribu. Kauli ‘bila dhambi’ ndiyo inayoweka mpaka wa wazi wa kitheolojia bila kudhoofisha uhalisi wa jaribu.
- issue: Kiwango cha kuweka wazi ulinganisho katika καθ’ ὁμοιότητα
  choice: kwa namna inayofanana
  alternative: kama sisi
  rationale: Kigiriki kinataja ufanano lakini hakisemi moja kwa moja ‘na sisi.’ Matini kuu inadumisha hali hiyo, huku tanbihi ikieleza ufafanuzi wa kawaida wa muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo hasi wa asili umehifadhiwa. Usemi ‘kwa namna inayofanana’ umeachwa kwa kiasi fulani wazi kimakusudi ili kutotaja moja kwa moja kitu cha ulinganisho ambacho Kigiriki hakikitaji.
