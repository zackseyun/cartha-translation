id: HEB.4.12
reference: Hebrews 4:12
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ζῶν γὰρ ὁ λόγος τοῦ θεοῦ καὶ ἐνεργὴς καὶ τομώτερος ὑπὲρ πᾶσαν μάχαιραν δίστομον καὶ διϊκνούμενος ἄχρι μερισμοῦ ψυχῆς ⸀καὶ πνεύματος, ἁρμῶν τε καὶ μυελῶν, καὶ κριτικὸς ἐνθυμήσεων καὶ ἐννοιῶν καρδίας·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/012.yaml
  text: For the word of God is living and active[a], and sharper than any double-edged sword, piercing to the division of soul and spirit, of joints and marrow[c][b], and able to judge the thoughts and intentions of the heart.
translation:
  language: sw
  text: Kwa maana neno la Mungu ni hai na linafanya kazi[a], tena ni kali kuliko upanga wowote wenye makali mawili. Hupenya hadi kwenye utengano wa nafsi na roho, wa viungo na uboho[b], nalo lina uwezo wa kuhukumu[c] mawazo na makusudi ya moyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “linatenda kwa ufanisi.”
    reason: lexical_alternative
  - marker: b
    text: Maneno “nafsi na roho” hapa hayalazimishi fundisho maalumu kuhusu sehemu zinazomfanya mwanadamu; mkazo ni uwezo wa neno la Mungu kupenya ndani kabisa.
    reason: alternative_reading
  - marker: c
    text: Au, “linayapambanua.” Neno la Kigiriki linahusu uwezo wa kutathmini au kuhukumu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ζῶν
  choice: li hai
  rationale: Hueleza hali ya kudumu ya neno la Mungu kuwa hai; muundo huu ni wa kawaida na wenye hadhi katika Kiswahili.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Huhifadhi kazi ya kiunganishi ya kutoa msingi wa himizo lililotangulia.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: neno la Mungu
  rationale: Ni tafsiri pana na ya moja kwa moja ambayo hailazimishi rejeo kuwa Maandiko pekee, ujumbe uliohubiriwa, tamko la Mungu, au Logos kama nafsi.
- source_word: ἐνεργὴς
  choice: linafanya kazi
  rationale: Huonyesha kuwa neno linatenda na lina athari bila kuongeza wazo la nguvu ambalo halijasemwa moja kwa moja.
- source_word: τομώτερος ὑπὲρ πᾶσαν μάχαιραν δίστομον
  choice: ni kali kuliko upanga wowote wenye makali kuwili
  rationale: Huhifadhi ulinganisho na taswira ya upanga unaokata kwa pande zote mbili kwa Kiswahili cha sasa kinachoeleweka.
- source_word: διϊκνούμενος
  choice: Hupenya
  rationale: Huhifadhi mwendo wa kufika ndani kabisa na kuendeleza taswira ya upanga.
- source_word: ἄχρι μερισμοῦ
  choice: hadi kwenye kutenganishwa
  rationale: Huhifadhi wazo la kufikia mpaka wa mgawanyo bila kufafanua kupita kiasi namna jozi zinazofuata zinavyohusiana.
- source_word: ψυχῆς καὶ πνεύματος
  choice: kwa nafsi na roho
  rationale: Huhifadhi istilahi zote mbili bila kuamua kwamba mstari unafundisha muundo maalumu wa sehemu za mwanadamu.
- source_word: ἁρμῶν τε καὶ μυελῶν
  choice: kwa viungo na uboho
  rationale: Huhifadhi jozi ya kimwili inayoendeleza taswira ya kupenya ndani kabisa; “uboho” ni neno la kawaida kwa marrow.
- source_word: κριτικὸς
  choice: lina uwezo wa kuhukumu
  rationale: Huonyesha uwezo wa kutathmini na kutoa hukumu, si ufahamu wa kawaida tu.
- source_word: ἐνθυμήσεων
  choice: mawazo
  rationale: Ni neno pana na la kawaida kwa fikira au tafakuri za ndani.
- source_word: ἐννοιῶν
  choice: makusudi
  rationale: Hutofautisha neno hili na “mawazo” kwa kuonyesha mielekeo au nia za ndani.
theological_decisions:
- issue: Rejeo la “neno la Mungu”
  choice: Limeachwa kwa upana kuwa “neno la Mungu.”
  alternative: Maandiko pekee; ahadi au hukumu iliyotamkwa na Mungu; Mwana/Logos.
  rationale: Muktadha unasisitiza Mungu anayesema na ufanisi wa tamko lake, lakini Kigiriki hakihitaji tafsiri ifunge rejeo hilo kwa mojawapo ya maana hizo.
- issue: Maana ya “nafsi na roho” kuhusu muundo wa mwanadamu
  choice: Istilahi zote mbili zimehifadhiwa bila maelezo ya kidogma.
  alternative: Kuzitafsiri kama sehemu mbili zinazoweza kutenganishwa kitaalamu, au kama uthibitisho wa mfumo maalumu wa sehemu za mwanadamu.
  rationale: Jozi hii iko ndani ya taswira ya uwezo wa neno kupenya na kuhukumu yaliyo ndani kabisa; mstari haupaswi kulazimishwa kufundisha mfumo maalumu wa anthropolojia.
- issue: Uhusiano wa jozi “nafsi na roho” na “viungo na uboho”
  choice: Muundo sambamba wa chanzo umehifadhiwa kwa kadiri inayowezekana.
  alternative: Kueleza wazi kuwa kila kitu katika kila jozi kinatenganishwa na mwenzake, au kuwa neno hupenya tu katikati yake.
  rationale: Muundo wa Kigiriki unaweza kusomwa kwa zaidi ya namna moja; tafsiri haipaswi kutatua kimya-kimya jinsi “kutenganishwa” kunavyohusiana na kila jozi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Sentensi imegawanywa mara mbili ili kudumisha uwazi bila kupoteza mtiririko wa hoja. Taswira ya upanga, kupenya, na kina cha maisha ya ndani imehifadhiwa.
