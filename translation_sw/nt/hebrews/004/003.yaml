  text: εἰσερχόμεθα γὰρ ⸀εἰς κατάπαυσιν οἱ πιστεύσαντες, καθὼς εἴρηκεν· Ὡς ὤμοσα ἐν τῇ ὀργῇ μου, Εἰ εἰσελεύσονται εἰς τὴν κατάπαυσίν μου, καίτοι τῶν ἔργων ἀπὸ καταβολῆς κόσμου γενηθέντων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/003.yaml
  text: For we who have believed enter the rest[a], just as he has said, “As I swore in my wrath[b], ‘If they shall enter my rest,’” although his works were finished from the foundation of the world.
translation:
  language: sw
  text: Kwa maana sisi tulioamini tunaingia katika pumziko hilo, kama alivyosema, “Kama nilivyoapa katika ghadhabu yangu, ‘Hakika hawataingia katika pumziko langu.’”[a] Ingawa kazi zake zilikuwa zimekamilika tangu kuumbwa kwa ulimwengu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki, kwa kufuata umbo la maneno, kinasema, “Ikiwa wataingia katika pumziko langu.” Hii ni fomula ya kiapo yenye maana, “Hakika hawataingia katika pumziko langu,” au “Kamwe hawataingia katika pumziko langu.”
    reason: alternative_reading
  - marker: b
    text: 'Kwa kufuata maneno kwa karibu zaidi: “tangu kuwekwa msingi wa ulimwengu.” Pia yaweza kutafsiriwa, “ingawa kazi zake zilikuwa zimefanyika tangu kuumbwa kwa ulimwengu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσερχόμεθα
  choice: tunaingia
  rationale: Wakati uliopo unahifadhi maana ya sasa ya waamini kuingia katika pumziko la Mungu bila kuifanya kauli kuwa ya wakati ujao pekee.
- source_word: κατάπαυσιν
  choice: pumziko hilo
  rationale: ‘Pumziko’ ni neno la kawaida na lenye hadhi; ‘hilo’ linaonyesha pumziko maalumu ambalo tayari linajadiliwa katika muktadha.
- source_word: οἱ πιστεύσαντες
  choice: sisi tulioamini
  rationale: Muundo huu unahifadhi tendo lililotimizwa la kuamini na pia kujihusisha kwa mwandishi katika nafsi ya kwanza wingi.
- source_word: καθὼς εἴρηκεν
  choice: kama alivyosema
  rationale: Ni Kiswahili cha asili kinachoonyesha kuwa kauli iliyonukuliwa inaendelea kuwa na nguvu katika hoja.
- source_word: ὀργῇ
  choice: ghadhabu
  rationale: ‘Ghadhabu’ inafaa uzito wa hasira ya hukumu katika kiapo hiki kuliko neno jepesi zaidi ‘hasira.’
- source_word: Εἰ εἰσελεύσονται εἰς τὴν κατάπαυσίν μου
  choice: Hakika hawataingia katika pumziko langu
  rationale: Hii inawasilisha maana ya kiapo cha Kisemiti, ambacho kwa muktadha ni katazo lenye mkazo; umbo la Kigiriki la masharti limeelezwa katika tanbihi.
- source_word: καίτοι
  choice: Ingawa
  rationale: Linaonyesha uhusiano wa kukubali hali iliyo kinyume au ya mshangao katika hoja.
- source_word: τῶν ἔργων ... γενηθέντων
  choice: kazi zake zilikuwa zimekamilika
  rationale: Kauli inaonyesha kwamba kazi za Mungu zilikuwa tayari zimetendeka au kukamilika; ‘zake’ linaeleweka wazi kutokana na muktadha.
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: tangu kuumbwa kwa ulimwengu
  rationale: Huu ni usemi wa asili wa Kiswahili kwa mwanzo wa ulimwengu, huku maana halisi zaidi ya kuwekwa msingi ikibainishwa katika tanbihi.
theological_decisions:
- issue: Nguvu ya kiapo kilichonukuliwa kutoka Zaburi 95
  choice: 'Kutafsiri maana yake kama katazo lenye mkazo: ‘Hakika hawataingia katika pumziko langu.’'
  alternative: 'Kutafsiri kwa kufuata umbo la juu juu: ‘Ikiwa wataingia katika pumziko langu.’'
  rationale: εἰ pamoja na wakati ujao hapa ni fomula ya kiapo iliyorithiwa kutoka Kiebrania na ina maana ya kutokuingia kabisa. Tanbihi inahifadhi umbo halisi na mvutano wa chanzo.
- issue: Wakati wa waamini kuingia katika pumziko
  choice: Kutumia wakati uliopo ‘tunaingia.’
  alternative: ‘tutaingia’ au ‘tunaendelea kuingia’
  rationale: Wakati uliopo wa Kigiriki unaruhusu maana ya sasa bila kufuta utimilifu wa baadaye unaojitokeza katika muktadha mpana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Pumziko’ limetumiwa kwa uthabiti kwa κατάπαυσις; sentensi imegawanywa baada ya nukuu ili iwe rahisi kusomeka bila kubadili uhusiano wa kimantiki.
