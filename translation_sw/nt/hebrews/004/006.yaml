  text: ἐπεὶ οὖν ἀπολείπεται τινὰς εἰσελθεῖν εἰς αὐτήν, καὶ οἱ πρότερον εὐαγγελισθέντες οὐκ εἰσῆλθον δι’ ἀπείθειαν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/006.yaml
  text: Therefore[a], since it remains for some to enter it, and those who formerly had the good news proclaimed to them did not enter because of disobedience,
translation:
  language: sw
  text: Kwa hiyo, kwa kuwa bado wapo baadhi watakaoingia humo, na wale ambao hapo awali walitangaziwa habari njema hawakuingia kwa sababu ya kutotii[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutokuamini.” Neno la Kigiriki linaweza kumaanisha kukataa kuamini kunakoonekana katika kutotii.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ οὖν
  choice: Kwa hiyo, kwa kuwa
  rationale: Muunganiko huu unatoa hitimisho na wakati huohuo unaweka msingi wa maelezo yanayofuata; tafsiri hii inahifadhi nguvu za οὖν na ἐπεί.
- source_word: ἀπολείπεται
  choice: bado imebaki
  rationale: Kauli ya wakati uliopo inaonyesha kwamba nafasi ya kuingia inaendelea kuwapo; ‘bado imebaki’ ni ya kawaida na wazi katika Kiswahili.
- source_word: τινὰς
  choice: baadhi ya watu
  rationale: Kiwakilishi kisichotaja watu mahususi kinaonyesha kwamba bado kuna watu watakaoingia, bila kuwabainisha.
- source_word: εἰσελθεῖν εἰς αὐτήν
  choice: waingie humo
  rationale: ‘Humo’ inarejelea pumziko la Mungu lililotajwa kabla, huku ikihifadhi matumizi ya kiwakilishi badala ya kurudia nomino.
- source_word: οἱ πρότερον εὐαγγελισθέντες
  choice: wale waliotangaziwa habari njema hapo awali
  rationale: Tafsiri hii inahifadhi hali tendwa ya kitenzi na maana ya πρότερον bila kutumia msamiati wa kidhehebu.
- source_word: οὐκ εἰσῆλθον
  choice: hawakuingia
  rationale: Hii ni tafsiri ya moja kwa moja ya ukanushi wa kitenzi cha wakati uliopita.
- source_word: δι’ ἀπείθειαν
  choice: kwa sababu ya kutotii
  rationale: ἀπείθεια kimsingi hudokeza kutotii au kukataa kusikia, ingawa katika muktadha huu kunahusiana kwa karibu na kutokuamini.
theological_decisions:
- issue: Maana ya ἀπείθεια katika onyo kuhusu kuingia katika pumziko
  choice: kwa sababu ya kutotii
  alternative: kwa sababu ya kutokuamini
  rationale: ‘Kutotii’ huhifadhi maana kuu ya neno na mvutano kati ya kukataa kuamini na kukataa kutii. Maana mbadala ya ‘kutokuamini’ imewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi umehifadhi uhusiano wake na hoja inayoendelea katika mstari unaofuata; ndiyo sababu mstari unaishia kwa koma.
