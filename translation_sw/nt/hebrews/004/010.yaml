  text: ὁ γὰρ εἰσελθὼν εἰς τὴν κατάπαυσιν αὐτοῦ καὶ αὐτὸς κατέπαυσεν ἀπὸ τῶν ἔργων αὐτοῦ ὥσπερ ἀπὸ τῶν ἰδίων ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/010.yaml
  text: For the one who has entered his rest has himself also rested from his works[b][a], just as God did from his own.
translation:
  language: sw
  text: Kwa maana yule aliyeingia katika pumziko lake[a], yeye mwenyewe pia amepumzika[b] kutoka katika kazi zake, kama vile Mungu alivyopumzika kutoka katika kazi zake mwenyewe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, ‘katika pumziko la Mungu.’ Katika muktadha wa Waebrania 3–4, kiwakilishi ‘lake’ kinaelekea zaidi kumrejelea Mungu.
    reason: alternative_reading
  - marker: b
    text: Au, ‘ameacha kazi zake.’ Kitenzi cha Kigiriki kina mzizi mmoja na neno ‘pumziko’ katika kifungu hiki; kwa hiyo ‘amepumzika’ huhifadhi kurudiwa kwa lugha ya pumziko.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ... εἰσελθὼν
  choice: yule aliyeingia
  rationale: Kifungu chenye kibainishi na kitenzi-shirikishi cha aoristi humtaja mtu kwa namna ya jumla ambaye kuingia kwake kumetimia; ‘yule aliyeingia’ huhifadhi umoja na hali hiyo.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Huanzisha maelezo yanayounga mkono kauli iliyotangulia na ni kiunganishi cha kawaida katika Kiswahili sanifu.
- source_word: κατάπαυσιν
  choice: pumziko
  rationale: Ni neno kuu la mada katika Waebrania 3–4, likihusishwa na pumziko la Mungu; ‘pumziko’ huhifadhi uhusiano huo.
- source_word: αὐτοῦ (after κατάπαυσιν)
  choice: lake
  rationale: Kiwakilishi cha Kigiriki hakimtaji mwenye pumziko waziwazi. ‘Lake’ huhifadhi kiwakilishi hicho bila kukibadili moja kwa moja kuwa ‘la Mungu,’ huku tanbihi ikieleza muktadha.
- source_word: καὶ αὐτὸς
  choice: yeye mwenyewe pia
  rationale: Huhifadhi msisitizo wa αὐτός pamoja na maana ya nyongeza ya καί kwa Kiswahili cha kawaida.
- source_word: κατέπαυσεν
  choice: amepumzika
  rationale: Huhifadhi mwangwi wa kimsamiati kati ya κατάπαυσις na κατέπαυσεν. Maana mbadala ya ‘ameacha’ imeonyeshwa katika tanbihi.
- source_word: ἀπὸ τῶν ἔργων αὐτοῦ
  choice: kutoka katika kazi zake
  rationale: ‘Kazi’ ni tafsiri pana na ya moja kwa moja ya ἔργα, bila kuibana kuwa juhudi za kidini au matendo ya kustahili wokovu.
- source_word: ὥσπερ
  choice: kama vile
  rationale: Huonyesha kwa kawaida ulinganisho wa wazi kati ya pumziko la mtu huyo na la Mungu.
- source_word: ἀπὸ τῶν ἰδίων
  choice: kutoka katika kazi zake mwenyewe
  rationale: Kigiriki kinaacha nomino ‘kazi’ ikiwa imeeleweka. Kiswahili huiweka wazi kwa ufasaha, huku ‘mwenyewe’ kikihifadhi msisitizo wa ἰδίων.
- source_word: ὁ θεός
  choice: Mungu
  rationale: Ni tafsiri sanifu ya θεός na hubaki kuwa mhusika aliyetajwa wazi katika ulinganisho.
theological_decisions:
- issue: Mhusika anayemiliki ‘pumziko lake’ (αὐτοῦ)
  choice: Muktadha unaelekeza zaidi kwenye pumziko la Mungu analoingia mwamini, lakini maandishi makuu yanahifadhi kiwakilishi ‘lake.’
  alternative: ‘Pumziko lake’ linaweza kueleweka kuwa pumziko la mtu anayeingia.
  rationale: Katika Waebrania 3–4, pumziko linalorudiwa ni la Mungu na lina msingi katika pumziko lake mwenyewe. Hata hivyo, kwa kuwa Kigiriki kimetumia kiwakilishi badala ya kutaja Mungu moja kwa moja, tafsiri haiondoi kabisa utata huo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ‘kutoka katika kazi’ ni rasmi kidogo lakini unaeleweka na huhifadhi kwa karibu ἀπό; kurudiwa kwa ‘pumziko/amepumzika’ ni kwa makusudi ili kuonyesha mchezo wa maneno wa Kigiriki.
