base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/004.yaml
  text: 'For he has spoken somewhere about the seventh day in this way: “And God rested on the seventh day from all his works,”[a][b]'
translation:
  language: sw
  text: 'Kwa maana mahali fulani amesema hivi kuhusu siku ya saba: “Na Mungu alipumzika siku ya saba kutoka katika kazi zake zote.”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mahali pasipotajwa.” Kigiriki kinasema kihalisi “mahali fulani,” njia ya kutambulisha nukuu ya Maandiko bila kutaja ilipo, wala si kuonyesha shaka kuhusu mamlaka yake.
    reason: lexical_alternative
  - marker: b
    text: Au “alikoma kufanya kazi.” Kitenzi kinaweza kusisitiza kuacha kufanya kazi; hapa “alipumzika” limetumiwa ili kuhifadhi uhusiano na Mwanzo 2:2 na hoja kuhusu pumziko la Mungu katika Waebrania 3–4.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴρηκεν
  choice: amesema
  rationale: Wakati timilifu wa Kigiriki unaonyesha kuwa kauli ya zamani bado ina umuhimu sasa; ‘amesema’ huhifadhi maana hiyo kwa Kiswahili cha kawaida.
- source_word: γάρ
  choice: Kwa maana
  rationale: Kiunganishi hiki kinatoa msingi au ufafanuzi wa hoja iliyotangulia.
- source_word: που
  choice: mahali fulani
  rationale: Hutambulisha sehemu ya Maandiko bila kuitaja moja kwa moja; kauli hii haimaanishi kwamba mamlaka ya andiko hilo ina shaka.
- source_word: περὶ τῆς ἑβδόμης
  choice: kuhusu siku ya saba
  rationale: Nomino ‘siku’ inaeleweka katika Kigiriki na imewekwa wazi katika Kiswahili ili sentensi ieleweke kwa urahisi.
- source_word: οὕτως
  choice: hivi
  rationale: Ni utangulizi wa kawaida na wa asili kwa maneno ya nukuu.
- source_word: Καὶ
  choice: Naye
  rationale: Huhifadhi kiunganishi kilicho mwanzoni mwa nukuu ya Mwanzo huku kikitoa Kiswahili cha asili kwa mhusika Mungu.
- source_word: κατέπαυσεν
  choice: alipumzika
  rationale: Huhifadhi uhusiano wa kimsamiati na simulizi la Mwanzo 2:2 na hoja ya pumziko la Mungu katika Waebrania 3–4; maana ya kukoma kufanya kazi imeelezwa katika tanbihi.
- source_word: ὁ θεὸς
  choice: Mungu
  rationale: Ni mhusika wazi wa kitenzi na tafsiri ya moja kwa moja ya θεός.
- source_word: ἐν τῇ ἡμέρᾳ τῇ ἑβδόμῃ
  choice: siku ya saba
  rationale: Hii ndiyo namna ya kawaida ya Kiswahili ya kueleza wakati kwa siku maalumu; hakuna haja ya kuongeza kihusishi.
- source_word: ἀπὸ πάντων τῶν ἔργων αὐτοῦ
  choice: baada ya kazi zake zote
  rationale: Katika muktadha huu, ‘baada ya’ hueleza kwa Kiswahili cha asili kwamba Mungu aliacha kufanya kazi zake zote, bila kudokeza uchovu.
theological_decisions:
- issue: Jinsi ya kutafsiri kukoma kwa Mungu kufanya kazi katika uhusiano na teolojia ya pumziko katika Waebrania
  choice: alipumzika
  alternative: alikoma kufanya kazi
  rationale: ‘Alipumzika’ hudumisha kiungo cha wazi na Mwanzo 2:2 na mada kuu ya pumziko katika Waebrania 3–4, bila kudai kwamba Mungu alikuwa amechoka. Tanbihi huhifadhi maana mbadala ya kukoma.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ‘mahali fulani amesema hivi’ ni wa kawaida na huhifadhi utambulisho usiotaja sehemu mahsusi. ‘Naye’ huhifadhi Καὶ ya nukuu bila kufanya sentensi iwe nzito.
