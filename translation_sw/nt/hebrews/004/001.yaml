base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/001.yaml
  text: Therefore[a], let us fear lest, while the promise of entering his rest still remains[c][b], any one of you should seem to have fallen short.
translation:
  language: sw
  text: Kwa hiyo, na tuogope, wakati ahadi ya kuingia katika pumziko lake bado ipo[b], asije mmoja wenu akaonekana kuwa ameshindwa kulifikia[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Au, “ahadi ikisalia ya kuingia katika pumziko lake.” Muundo wa Kigiriki ni mfupi na huonyesha hali inayoendelea wakati wa onyo.
    reason: alternative_reading
  - marker: c
    text: Au, “akaonekana amepungukiwa.” Maana katika muktadha ni kutofikia lengo lililoahidiwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: Φοβηθῶμεν
  choice: na tuogope
  rationale: Hifadhi ya nguvu ya himizo la Kigiriki; ‘tuwe waangalifu’ ingelainisha onyo kupita kiasi.
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Inaonyesha hitimisho linalotokana na hoja iliyotangulia kuhusu kushindwa kwa Israeli kuingia katika pumziko.
- source_word: μήποτε
  choice: ili ... asi-
  rationale: Muundo huu wa Kiswahili huwasilisha onyo la kuzuia matokeo yasiyotakiwa kwa njia ya kawaida na yenye uzito.
- source_word: καταλειπομένης ἐπαγγελίας
  choice: kwa kuwa ahadi ... bado ipo
  rationale: 'Inaonyesha hali inayoendelea: ahadi hiyo haijaondolewa wala kumalizika. Tanbihi huhifadhi uwezekano wa muundo wa kimazingira ‘wakati ahadi ... bado ipo.’'
- source_word: ἐπαγγελίας
  choice: ahadi
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja katika muktadha wa ahadi ya Mungu.
- source_word: εἰσελθεῖν
  choice: ya kuingia
  rationale: Hufungamana kwa kawaida na ‘ahadi’ katika Kiswahili huku ikihifadhi maana ya infinitivu.
- source_word: κατάπαυσιν
  choice: pumziko
  rationale: Neno hili linafaa katika Waebrania 3–4 na halipunguzi wazo kuwa kuacha kazi tu au mahali pa kupumzikia.
- source_word: αὐτοῦ
  choice: lake
  rationale: Huhifadhi kiwakilishi cha Kigiriki bila kuongeza ‘Mungu’ moja kwa moja katika mstari.
- source_word: δοκῇ
  choice: asionekane
  rationale: Huhifadhi wazo la kuonekana au kudhaniwa bila kuamua kimafundisho kama ni mwonekano tu au hukumu ya mwisho.
- source_word: τις ἐξ ὑμῶν
  choice: yeyote kati yenu
  rationale: Huonyesha mtu mmoja asiyeainishwa kutoka miongoni mwa wasomaji.
- source_word: ὑστερηκέναι
  choice: kuwa ameshindwa kuifikia
  rationale: Huonyesha kushindwa kufikia lengo lililoahidiwa na hutoa rejeo la ‘pumziko’ kwa uwazi wa kawaida wa Kiswahili.
theological_decisions:
- issue: Iwapo onyo lipunguzwe kuwa tahadhari tu au lihifadhi hofu halisi
  choice: na tuogope
  alternative: na tuwe waangalifu
  rationale: Kitenzi φοβηθῶμεν kina nguvu ya wazi. Tafsiri haipaswi kutatua kimya kimya mvutano kuhusu uvumilivu au uasi-imani kwa kulainisha onyo.
- issue: Iwapo ‘pumziko lake’ lifafanuliwe katika matini kuwa pumziko la Mungu la mwisho
  choice: pumziko lake
  alternative: pumziko la Mungu
  rationale: Kigiriki kinatumia kiwakilishi, na rejeo linaeleweka kutokana na muktadha. Muundo huu huepuka kuongeza ufafanuzi wa kiteolojia usiotajwa moja kwa moja katika mstari.
- issue: Nguvu ya δοκῇ katika onyo
  choice: asionekane kuwa ameshindwa kuifikia
  alternative: asiwe ameshindwa kuifikia
  rationale: Kuhifadhi ‘asionekane’ kunabakiza utata halisi wa δοκέω badala ya kuondoa kipengele cha kuonekana au kudhaniwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Na tuogope’ ni himizo la kawaida lenye uzito; ‘pumziko lake’ huhifadhi lugha ya sura bila kuingiza ufafanuzi wa dhehebu. Viashiria vyote vya tanbihi vimewekwa katika matini kuu.
