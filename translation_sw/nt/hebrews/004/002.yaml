  text: καὶ γάρ ἐσμεν εὐηγγελισμένοι καθάπερ κἀκεῖνοι, ἀλλ’ οὐκ ὠφέλησεν ὁ λόγος τῆς ἀκοῆς ἐκείνους, μὴ ⸀συγκεκερασμένους τῇ πίστει τοῖς ἀκούσασιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/002.yaml
  text: For indeed[a], we also have had good news proclaimed to us, just as they did; but the message they heard did not benefit them[b], because it was not united by faith with those who heard.
translation:
  language: sw
  text: Kwa maana sisi pia tumetangaziwa habari njema, kama wao; lakini ujumbe waliousikia haukuwafaidi, kwa sababu hawakuunganishwa kwa imani na wale waliosikia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Baadhi ya hati zina usomaji unaoweza kutafsiriwa: “kwa sababu ujumbe huo haukuunganishwa na imani katika wale waliosikia.”'
    reason: textual_variant
lexical_decisions:
- source_word: εὐηγγελισμένοι
  choice: tumetangaziwa habari njema
  rationale: Muundo wa wakati timilifu wa Kiyunani unaonyesha tangazo lililokwisha kutolewa lakini lenye umuhimu unaoendelea. Usemi huu huhifadhi wazo la kutangaziwa habari njema bila kuingiza mapema mno maana ya kiistilahi ya baadaye ya “injili.”
- source_word: καθάπερ κἀκεῖνοι
  choice: kama wao pia
  rationale: Hutoa kwa Kiswahili cha kawaida ulinganisho wa moja kwa moja kati ya wasomaji na kizazi cha jangwani katika kupokea ujumbe wa Mungu.
- source_word: ὁ λόγος τῆς ἀκοῆς
  choice: ujumbe waliousikia
  rationale: Huwasilisha λόγος kama maudhui yaliyotangazwa na ἀκοή kama yaliyosikiwa, huku ikiepuka tafsiri ngumu ya neno kwa neno.
- source_word: ὠφέλησεν
  choice: haukuwafaidi
  rationale: Ni usemi wa kawaida unaohifadhi maana ya kutowaletea manufaa yaliyokusudiwa.
- source_word: συγκεκερασμένους
  choice: hawakuunganishwa
  rationale: Kisahili kihusishi hiki hudokeza kuchanganywa au kuunganishwa. Kwa mujibu wa usomaji wa SBLGNT, umbo la wingi la hali ya kushutumiwa linaafikiana kwa kawaida na ἐκείνους, hivyo watu ndio wanaoelezwa kuwa hawakuunganishwa.
- source_word: πίστει
  choice: kwa imani
  rationale: “Imani” ndiyo tafsiri ya kawaida na inayofaa katika muktadha wa tofauti kati ya kusikia ujumbe na kuupokea kwa kuitikia.
- source_word: τοῖς ἀκούσασιν
  choice: na wale waliosikia
  rationale: Hufuata maana ya msingi ya ἀκούω bila kuongeza kwa lazima dhana ya kusikiliza kwa utiifu, ambayo haijawekwa wazi kabisa na neno lenyewe.
theological_decisions:
- issue: Maana ya πίστις katika muktadha huu
  choice: imani
  alternative: kutumaini; uaminifu
  rationale: Muktadha unalinganisha kusikia na mwitikio wa kuamini. “Imani” huhifadhi istilahi ya msingi bila kufungamanisha mstari na mfumo maalumu wa kimadhehebu.
- issue: Uhusiano wa kisarufi katika kishazi cha mwisho
  choice: wao hawakuunganishwa kwa imani na wale waliosikia
  alternative: ujumbe haukuchanganyika na imani ndani ya wale waliosikia
  rationale: Maandishi yaliyotolewa ya SBLGNT yana συγκεκερασμένους, umbo linaloafikiana kwa kawaida na ἐκείνους (“wao”). Usomaji mwingine wa kale unaunga mkono tafsiri ya jadi inayoufanya ujumbe kuwa kile kisichochanganyika na imani; huo umehifadhiwa katika tanbihi ili kutoficha tofauti ya maandishi na utata wa kifasiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imebaki karibu na mpangilio na mvutano wa Kiyunani, lakini imetumia miundo ya kawaida kama “ujumbe waliousikia” na “haukuwafaidi.”
