  text: Ἔχοντες οὖν ἀρχιερέα μέγαν διεληλυθότα τοὺς οὐρανούς, Ἰησοῦν τὸν υἱὸν τοῦ θεοῦ, κρατῶμεν τῆς ὁμολογίας·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/014.yaml
  text: Therefore[a], since we have a great high priest who has passed through the heavens—Jesus the Son of God—let us hold fast to our confession.
translation:
  language: sw
  text: Basi, kwa kuwa tunaye kuhani mkuu aliye mkuu, aliyepita katika mbingu[a]—Yesu, Mwana wa Mungu—tulishike imara ungamo letu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliyekwenda kupitia mbingu.” Kigiriki kimetumia “mbingu” katika wingi.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔχοντες οὖν
  choice: Basi, kwa kuwa tuna
  rationale: Muundo huu unaonyesha hitimisho linalotokana na hoja iliyotangulia na pia msingi wa himizo linalofuata, kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: ἀρχιερέα μέγαν
  choice: kuhani mkuu mwenye ukuu
  rationale: Neno ‘kuhani mkuu’ ni istilahi ya kawaida ya ἀρχιερεύς, huku ‘mwenye ukuu’ likihifadhi msisitizo wa μέγαν bila marudio yasiyo ya kawaida ya ‘mkuu ... mkuu.’
- source_word: διεληλυθότα τοὺς οὐρανούς
  choice: aliyepita katika mbingu
  rationale: Linadumisha picha ya kupita katika maeneo ya mbinguni na halibadili wingi wa Kigiriki kuwa dhana ya jumla ya ‘mbinguni.’ Kauli ya wakati uliopita inaeleza tendo lililotimia, kama participle ya perfect ya Kigiriki.
- source_word: Ἰησοῦν τὸν υἱὸν τοῦ θεοῦ
  choice: yaani, Yesu Mwana wa Mungu
  rationale: ‘Yaani’ linaonyesha wazi kuwa Yesu Mwana wa Mungu ndiye huyo kuhani mkuu, na cheo cha kikristo ‘Mwana wa Mungu’ kinahifadhiwa bila kufafanuliwa kupita kiasi.
- source_word: κρατῶμεν
  choice: tushike kwa uthabiti
  rationale: Hii ni kauli ya kuhimiza jumuiya iendelee kushikilia kwa nguvu, na ni ya asili katika Kiswahili sanifu.
- source_word: τῆς ὁμολογίας
  choice: ungamo letu
  rationale: ‘Ungamo’ linaonyesha tamko la wazi la imani. ‘Letu’ linafanya uhusiano wa jumuiya uwe wa asili katika Kiswahili, ingawa Kigiriki kimetumia kibainishi badala ya kiwakilishi milikishi.
theological_decisions:
- issue: Tafsiri ya cheo υἱὸς τοῦ θεοῦ
  choice: Mwana wa Mungu
  alternative: Mwana wake Mungu
  rationale: Cheo rasmi kinahifadhiwa ili kubeba uzito wake wa kikristo bila kukipunguza kuwa maelezo ya kawaida.
- issue: Kuhifadhi taswira ya τοὺς οὐρανούς
  choice: katika mbingu
  alternative: mbinguni
  rationale: ‘Katika mbingu’ linahifadhi kwa uwazi zaidi wingi na taswira ya kupita katika mbingu, bila kulazimisha mfumo maalumu wa elimu ya ulimwengu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi umewekwa wazi kwa wasomaji wa kawaida, huku istilahi za msingi ‘kuhani mkuu,’ ‘Mwana wa Mungu,’ na ‘ungamo’ zikihifadhi uzito wa kifungu.
