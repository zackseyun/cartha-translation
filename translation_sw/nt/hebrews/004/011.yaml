  text: σπουδάσωμεν οὖν εἰσελθεῖν εἰς ἐκείνην τὴν κατάπαυσιν, ἵνα μὴ ἐν τῷ αὐτῷ τις ὑποδείγματι πέσῃ τῆς ἀπειθείας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/011.yaml
  text: Therefore[a], let us make every effort to enter that rest, so that no one may fall by the same pattern of disobedience.
translation:
  language: sw
  text: Kwa hiyo, tufanye bidii kuingia katika pumziko lile, ili mtu yeyote asianguke kwa kufuata mfano uleule wa kutotii.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mfano uleule wa kutokuamini.” Neno “kutotii” linaweza kueleweka kwa kuzingatia jinsi kizazi cha jangwani kilivyokataa kumwamini Mungu, ingawa neno la Kigiriki lina maana ya moja kwa moja zaidi ya “kutotii.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σπουδάσωμεν
  choice: na tufanye bidii
  rationale: Kauli ya kuhimiza katika nafsi ya kwanza wingi inatoa mwito wa pamoja; “tufanye bidii” ni Kiswahili cha kawaida kinachobeba uzito wa juhudi, ari na umakini.
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Inaonyesha hitimisho linalotokana na hoja iliyotangulia kuhusu pumziko la Mungu na kushindwa kwa kizazi cha jangwani.
- source_word: εἰσελθεῖν
  choice: kuingia
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kitenzi hiki katika muktadha.
- source_word: ἐκείνην τὴν κατάπαυσιν
  choice: katika pumziko lile
  rationale: “Pumziko lile” huhifadhi nguvu ya kiashiria na kurejelea pumziko lililojadiliwa katika muktadha bila kulifafanua kupita kiasi.
- source_word: ἵνα μὴ
  choice: ili ... asi-
  rationale: Muundo huu wa Kiswahili unaonyesha kusudi au tokeo hasi na kudumisha nguvu ya onyo.
- source_word: ἐν τῷ αὐτῷ ... ὑποδείγματι
  choice: kwa kufuata mfano uleule
  rationale: ὑπόδειγμα inaweza kuwa mfano, kielelezo au mwenendo wa kuonya. “Kwa kufuata mfano uleule” huwasilisha kwa kawaida wazo la kurudia mwenendo wa kizazi cha jangwani.
- source_word: πέσῃ
  choice: asianguke
  rationale: Huhifadhi taswira ya kuanguka na uzito wa onyo lililo katika kauli tegemezi baada ya ἵνα μή.
- source_word: τῆς ἀπειθείας
  choice: wa kutotii
  rationale: ἀπείθεια kwa maana yake ya moja kwa moja ni kutotii; hapa nomino hiyo inafafanua mfano unaotajwa.
theological_decisions:
- issue: Uhusiano wa ἀπείθεια na kushindwa kwa kizazi cha jangwani
  choice: Kutotii katika maandishi makuu
  alternative: Kutokuamini
  rationale: Waebrania huunganisha kwa karibu kutokuamini na kutotii, lakini maana ya moja kwa moja ya ἀπείθεια hapa ni “kutotii.” Tanbihi huhifadhi uwezekano wa kuuelewa mfano huo kwa kuzingatia kukataa kwao kumwamini Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “na tufanye bidii” ni himizo la pamoja; “pumziko lile” hudumisha uhusiano na hoja iliyotangulia. Tanbihi imewekwa baada ya “kutotii,” neno linalohusika moja kwa moja na mbadala huo.
