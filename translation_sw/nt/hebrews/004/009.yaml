  text: So then[a], a Sabbath rest remains for the people of God.
translation:
  language: sw
  text: Basi, pumziko la Sabato[a] bado limebaki kwa watu wa Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “maadhimisho ya Sabato.” Neno la Kigiriki σαββατισμός ni adimu na lina mwangwi wa wazi wa Sabato; hapa huenda linamaanisha pumziko lenye tabia ya Sabato ambalo bado limebaki kwa watu wa Mungu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα
  choice: Kwa hiyo
  rationale: Kiunganishi hiki kinaonyesha hitimisho linalotokana na hoja iliyotangulia; “Kwa hiyo” ni cha kawaida na huhifadhi nguvu ya kimantiki.
- source_word: ἀπολείπεται
  choice: bado imebaki
  rationale: Kitenzi hiki kinaeleza kwamba kitu kinaendelea kuwapo au kupatikana; “bado imebaki” huonyesha wazi mwendelezo huo.
- source_word: σαββατισμός
  choice: pumziko la Sabato
  rationale: Nomino hii adimu inarejelea pumziko au maadhimisho yenye tabia ya Sabato. “Pumziko la Sabato” huhifadhi mwangwi wa Sabato na pia wazo la pumziko katika muktadha.
- source_word: τῷ λαῷ
  choice: kwa watu
  rationale: 'Dativo hapa inaeleweka kwa kawaida kuwa ya manufaa au upatikanaji: pumziko hilo limebaki kwa ajili ya watu hao.'
- source_word: τοῦ θεοῦ
  choice: wa Mungu
  rationale: Ni umilikishi au uhusiano wa moja kwa moja unaotambulisha watu kuwa wa Mungu.
theological_decisions:
- issue: Maana ya σαββατισμός katika Waebrania 4:9
  choice: Pumziko lenye tabia ya Sabato ambalo bado limebaki kwa watu wa Mungu
  alternative: Maadhimisho halisi ya Sabato; au pumziko la kiroho lisilo na uhusiano wowote na Sabato
  rationale: Neno lenyewe linatoa mwangwi wa Sabato, huku muktadha ukiunganisha pumziko la Mungu, siku ya saba, na pumziko lililoahidiwa. Tafsiri hii haiamui kimya kimya kwamba maana ni ibada ya kila juma pekee wala fumbo lisilo na mwangwi wa Sabato.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni fupi na ya asili; “pumziko la Sabato” huhifadhi istilahi ya kibiblia na utata halisi wa neno la Kigiriki.
