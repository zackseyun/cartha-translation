id: HEB.5.12
reference: Hebrews 5:12
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ γὰρ ὀφείλοντες εἶναι διδάσκαλοι διὰ τὸν χρόνον, πάλιν χρείαν ἔχετε τοῦ διδάσκειν ὑμᾶς ⸀τινὰ τὰ στοιχεῖα τῆς ἀρχῆς τῶν λογίων τοῦ θεοῦ, καὶ γεγόνατε χρείαν ἔχοντες γάλακτος, ⸀οὐ στερεᾶς τροφῆς.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/012.yaml
  text: For although by this time you ought to be teachers[a], you again need someone to teach you the basic elements of the beginning of the oracles of God, and you have come to need milk[b], not solid food.
translation:
  language: sw
  text: Kwa maana, ingawa kufikia sasa mlipaswa kuwa walimu, mnahitaji tena mtu awafundishe mambo ya msingi kabisa[a] ya mwanzo ya matamko ya Mungu[b], nanyi mmefikia kuhitaji maziwa, si chakula kigumu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kanuni za awali kabisa.”
    reason: lexical_alternative
  - marker: b
    text: “Matamko ya Mungu” ni maneno au mafunuo yatokayo kwa Mungu; si matamko ya kiutabiri ya kipagani.
    reason: cultural_note
lexical_decisions:
- source_word: ὀφείλοντες εἶναι
  choice: mlipaswa kuwa
  rationale: Huonyesha wajibu au matarajio yaliyokuwapo kufikia wakati huo bila kutoa sauti ya kisheria kupita kiasi.
- source_word: διδάσκαλοι
  choice: walimu
  rationale: Ni neno la kawaida na la asili kwa watu wanaofundisha wengine.
- source_word: διὰ τὸν χρόνον
  choice: kufikia sasa
  rationale: Huonyesha muda uliokuwa umepita na ukomavu uliotarajiwa kutokana na muda huo.
- source_word: πάλιν χρείαν ἔχετε τοῦ διδάσκειν ὑμᾶς
  choice: mnahitaji tena mtu awafundishe
  rationale: Hutoa kwa Kiswahili cha kawaida maana ya hitaji lililorudia, huku mtendaji asiyeelezwa katika Kigiriki akitolewa kwa neno la jumla “mtu.”
- source_word: τινὰ τὰ στοιχεῖα τῆς ἀρχῆς
  choice: mambo ya msingi kabisa ya mwanzo
  rationale: Huhifadhi wazo la vipengele vya awali kabisa vya mafundisho, kwa lugha inayoeleweka na bila kulifanya kuwa mfumo maalumu wa kiteolojia.
- source_word: τῶν λογίων τοῦ θεοῦ
  choice: ya matamko ya Mungu
  rationale: “Matamko” huhifadhi maana ya maneno au mafunuo yatokayo kwa Mungu, badala ya maneno ya kawaida tu.
- source_word: γεγόνατε χρείαν ἔχοντες
  choice: mmekuwa mkihitaji
  rationale: Huwasilisha hali ambayo wasomaji wameifikia na ambayo inaendelea wakati wa usemi.
- source_word: γάλακτος, οὐ στερεᾶς τροφῆς
  choice: maziwa, wala si chakula kigumu
  rationale: Huhifadhi moja kwa moja sitiari na tofauti ya balagha ya mwandishi.
theological_decisions:
- issue: Tofauti ya kisitiari kati ya maziwa na chakula kigumu
  choice: Sitiari imehifadhiwa bila kufafanuliwa kuwa mpango maalumu wa viwango vya mafundisho.
  alternative: Kufafanua moja kwa moja kuwa “mafundisho ya awali” dhidi ya “mafundisho ya juu.”
  rationale: Mstari wenyewe hautaji mtaala maalumu; kuhifadhi sitiari huacha nguvu ya hoja na mvutano wake wa kiteolojia bila kuingiza msimamo wa dhehebu.
- issue: Maana ya λόγια τοῦ θεοῦ
  choice: matamko ya Mungu
  alternative: maneno ya Mungu
  rationale: Chaguo hili huhifadhi maana iliyoinuliwa ya matamko au mafunuo ya kimungu bila kudokeza usemi wa kipagani wa kiutabiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo umefanywa wa asili kwa Kiswahili huku marudio, hali ya kurudi nyuma, na sitiari ya Kigiriki vikihifadhiwa.
