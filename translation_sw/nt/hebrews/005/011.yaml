  text: Περὶ οὗ πολὺς ἡμῖν ὁ λόγος καὶ δυσερμήνευτος λέγειν, ἐπεὶ νωθροὶ γεγόνατε ταῖς ἀκοαῖς·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/011.yaml
  text: About this we have much to say[a], and it is hard to explain[c][b], since you have become dull in hearing.
translation:
  language: sw
  text: Kuhusu jambo hili tuna mengi ya kusema[a], na ni vigumu kulieleza[b], kwa kuwa mmekuwa wazito kusikia[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Kuhusu huyo tuna mengi ya kusema”; kiwakilishi cha Kigiriki kinaweza kumrejelea Melkizedeki, ingawa huenda hapa kinarejelea kwa upana zaidi mada inayozungumziwa.
    reason: alternative_reading
  - marker: b
    text: Au “ni vigumu kulifasiri” au “ni vigumu kulifafanua.”
    reason: lexical_alternative
  - marker: c
    text: Yaani, mmekuwa wazito au wasioitikia katika kupokea mafundisho; si kwamba uwezo wenu wa kimwili wa kusikia umepungua.
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ οὗ
  choice: Kuhusu jambo hili
  rationale: Kiwakilishi cha Kigiriki kinaweza kurejelea Melkizedeki mwenyewe au mada inayozungumziwa. Katika muktadha huu, usemi huu wa Kiswahili kwa kawaida unaelekeza kwenye mada pana inayohusu Melkizedeki na ukuhani wa Kristo, bila kukata kabisa uwezekano wa rejeo la mtu.
- source_word: πολὺς ἡμῖν ὁ λόγος
  choice: tuna mengi ya kusema
  rationale: Huu ni uundaji wa kawaida wa Kiswahili unaohifadhi maana ya kuwa na maelezo mengi ya kutoa, badala ya kutafsiri λόγος kwa namna ngumu kama “neno” au “hotuba.”
- source_word: δυσερμήνευτος λέγειν
  choice: ni vigumu kulieleza
  rationale: δυσερμήνευτος huonyesha jambo gumu kufasiri au kueleza; pamoja na λέγειν, “kulieleza” huwasilisha kwa kawaida ugumu wa kulifafanua kwa maneno.
- source_word: ἐπεὶ
  choice: kwa kuwa
  rationale: Kiunganishi hiki kinatoa sababu ya ugumu wa kueleza jambo hilo.
- source_word: νωθροὶ
  choice: wazito
  rationale: “Wazito” huhifadhi taswira ya kutokuwa wepesi au tayari kupokea mafundisho. Haidai kwamba tatizo ni uwezo wa kimwili wa kusikia.
- source_word: γεγόνατε
  choice: mmekuwa
  rationale: Wakati timilifu wa Kigiriki unaonyesha hali ambayo wasikilizaji wameifikia na ambayo sasa inaendelea.
- source_word: ταῖς ἀκοαῖς
  choice: kusikia
  rationale: Neno hili linarejelea kusikia au kupokea kwa makini. “Kusikia” huhifadhi sitiari ya asili, huku tanbihi ikifafanua maana ya kuitikia mafundisho.
theological_decisions:
- issue: Rejeo la Περὶ οὗ
  choice: “Kuhusu jambo hili,” likirejelea hasa mada inayozungumziwa
  alternative: “Kuhusu huyo,” likimrejelea Melkizedeki moja kwa moja
  rationale: Melkizedeki ametajwa mara moja kabla, kwa hiyo rejeo la mtu linawezekana kisarufi. Hata hivyo, mwandishi anaonekana kutanguliza ufafanuzi mpana wa mada. Tafsiri kuu inafuata mtiririko huo, na tanbihi inahifadhi uwezekano mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Wazito kusikia” huhifadhi sitiari ya Kigiriki na ni fupi; tanbihi inaeleza kwamba maana yake ni uzito wa kupokea na kuitikia mafundisho.
