  text: τελείων δέ ἐστιν ἡ στερεὰ τροφή, τῶν διὰ τὴν ἕξιν τὰ αἰσθητήρια γεγυμνασμένα ἐχόντων πρὸς διάκρισιν καλοῦ τε καὶ κακοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/014.yaml
  text: But solid food is for the mature[b][a], who because of practice have their powers of discernment trained to distinguish both good and evil.
translation:
  language: sw
  text: Lakini chakula kigumu ni cha watu waliokomaa, ambao, kwa mazoea[a], fahamu zao[b] zimezoezwa kupambanua mema na mabaya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa matumizi ya mara kwa mara” au “kwa sababu ya mazoea.”
    reason: lexical_alternative
  - marker: b
    text: Kwa neno halisi, “fahamu”; hapa neno hilo limetumiwa kisitiari kuhusu uwezo wa mtu wa kutambua na kupambanua.
    reason: lexical_alternative
lexical_decisions:
- source_word: τελείων
  choice: watu waliokomaa
  rationale: Muktadha unawatofautisha na watoto wachanga katika 5:13. Tafsiri hii huonyesha ukomavu wa kiroho bila kudokeza ukamilifu usio na dhambi.
- source_word: στερεὰ τροφή
  choice: chakula kigumu
  rationale: Ni usemi wa kawaida unaohifadhi sitiari ya chakula kilicho tofauti na maziwa.
- source_word: διὰ τὴν ἕξιν
  choice: kwa mazoea
  rationale: ἕξις inaweza kumaanisha mazoea, matumizi ya mara kwa mara, au hali iliyojengeka. 'Kwa mazoea' ni fupi, ya asili, na huhifadhi wazo la uwezo unaokuzwa kwa kurudia.
- source_word: τὰ αἰσθητήρια
  choice: uwezo wao wa kupambanua
  rationale: Neno hili kwa msingi humaanisha milango au uwezo wa fahamu, lakini hapa limetumiwa kisitiari kuhusu uwezo wa ndani wa kutambua tofauti. Tafsiri hii inaeleweka kwa urahisi na inaendana na διάκρισιν.
- source_word: γεγυμνασμένα ἐχόντων
  choice: wamezoeza
  rationale: Muundo unaonyesha kuwa uwezo wao umo katika hali iliyotokana na kuzoezwa. Kitenzi hiki cha Kiswahili huwasilisha mazoezi na matokeo yake kwa kawaida.
- source_word: πρὸς διάκρισιν
  choice: kupambanua
  rationale: 'πρός pamoja na διάκρισιν huonyesha kusudi au matokeo: kuwa na uwezo wa kutofautisha.'
- source_word: καλοῦ τε καὶ κακοῦ
  choice: mema na mabaya
  rationale: Jozi hii ya Kiswahili ni ya kawaida katika lugha ya maadili na huhifadhi upana wa 'mema na mabaya' bila kuongeza ufafanuzi.
- source_word: δέ
  choice: Lakini
  rationale: Huonyesha utofauti na kauli iliyotangulia kuhusu maziwa na mtoto mchanga.
theological_decisions:
- issue: Maana ya τελείων katika muktadha wa ukuaji wa kiroho
  choice: watu waliokomaa
  alternative: watu wakamilifu
  rationale: Muktadha unazungumzia kukua kutoka hali ya utoto hadi uwezo uliozoezwa wa kupambanua, si lazima ukamilifu wa kimaadili usio na dhambi.
- issue: Maana ya αἰσθητήρια katika muktadha huu
  choice: uwezo wao wa kupambanua
  alternative: milango yao ya fahamu
  rationale: Sitiari inahusu uwezo wa ndani uliopata mazoezi ya kutambua mema na mabaya. Uchaguzi huu haubainishi uwezo huo kwa mfumo fulani wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Mpangilio umefanywa wa asili kwa Kiswahili huku tofauti na mstari uliotangulia, sitiari ya chakula, na hali ya uwezo uliozoezwa vikihifadhiwa.
