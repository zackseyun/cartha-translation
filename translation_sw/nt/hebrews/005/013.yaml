  text: For everyone who partakes of milk is unskilled in the word of righteousness[b][a], for he is an infant.
translation:
  language: sw
  text: Kwa maana kila mtu anayekunywa maziwa hana uzoefu katika neno la haki[a], kwa maana yeye ni mtoto mchanga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ujumbe wa haki,” au “neno kuhusu haki.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς
  choice: kila
  rationale: Limetumika kwa maana ya kugawa kwa kila mtu katika kundi linaloelezwa; “kila anayeshiriki” ni Kiswahili cha kawaida na huhifadhi nguvu ya usemi wa Kigiriki.
- source_word: ὁ μετέχων
  choice: anayeshiriki
  rationale: Kivumishi-tendo chenye kibainishi humaanisha “yule anayeshiriki.” Chaguo hili huhifadhi wazo la kuwa na sehemu katika maziwa bila kuongeza maana kwamba huyo huishi kwa maziwa pekee.
- source_word: γάλακτος
  choice: maziwa
  rationale: Taswira halisi ya maziwa imehifadhiwa kwa sababu muktadha tayari unaitumia kueleza hatua ya ukuaji wa kiroho na kielimu.
- source_word: ἄπειρος
  choice: hana uzoefu
  rationale: Neno hili linaonyesha kutokuwa na uzoefu au ujuzi wa kutosha, si ujinga kamili. Usemi huu ni wa kawaida zaidi katika Kiswahili kuliko tafsiri ngumu ya moja kwa moja.
- source_word: λόγου δικαιοσύνης
  choice: neno la haki
  rationale: Muundo mfupi wa Kigiriki umehifadhiwa ili kutofunga maana kuwa ama ujumbe unaohusu haki, ama neno lenye sifa ya haki. Tanbihi inaonyesha uwezekano huo.
- source_word: δικαιοσύνης
  choice: haki
  rationale: “Haki” ni neno la kawaida la Kiswahili linaloweza kujumuisha uadilifu au hali ya kuwa sawa mbele za Mungu, pamoja na maana ya justice, bila kulazimisha ufafanuzi mmoja.
- source_word: νήπιος
  choice: mtoto mchanga
  rationale: Huhifadhi taswira kali ya kutokomaa inayolingana na maziwa; ni wazi na ya kawaida kwa wasomaji wa Kiswahili.
- source_word: γάρ
  choice: kwa maana / kwa kuwa
  rationale: Matukio yote mawili yanaeleza sababu. Kutofautisha kwa “kwa maana” na “kwa kuwa” hutoa mtiririko wa kawaida wa Kiswahili huku kazi ya hoja ikihifadhiwa.
theological_decisions:
- issue: Maana ya λόγου δικαιοσύνης
  choice: neno la haki
  alternative: ujumbe wa haki; neno kuhusu haki
  rationale: Kirai cha Kigiriki kina uhusiano wa kijenitivi usiofafanuliwa kabisa. Tafsiri kuu imehifadhi ufupi na utata huo, huku tanbihi ikitoa maelezo yanayowezekana bila kuchagua moja kimyakimya.
- issue: Uwakilishi wa δικαιοσύνη
  choice: haki
  alternative: uadilifu
  rationale: Katika Kiswahili, “haki” ina upana unaoweza kuhusisha righteousness na justice. “Uadilifu” ni uwezekano katika baadhi ya miktadha, lakini hapa ungeweza kupunguza maana kuwa tabia ya kimaadili pekee.
- issue: Jinsia katika νήπιος ... ἐστιν
  choice: yeye ni mtoto mchanga
  alternative: mtu huyo ni mtoto mchanga
  rationale: Kigiriki kina umbo la kiume la umoja lakini matumizi yake ni ya jumla. Kiswahili hakihitaji kiwakilishi chenye jinsia; “yeye” huhifadhi umoja wa rejeleo bila kuingiza jinsia ambayo sarufi ya Kiswahili haiweke wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Taswira ya maziwa na mtoto mchanga imehifadhiwa; kirai “neno la haki” kimeachwa kwa ufupi wake wa kiteolojia na tanbihi imeweka wazi tafsiri mbadala.
