lexical_decisions:
- source_word: καίπερ
  choice: Ingawa
  rationale: 'Kiunganishi hiki kinaonyesha hali ya kukubali jambo huku kikileta tofauti: licha ya kuwa Mwana, alijifunza utii kupitia mateso.'
- source_word: ὢν
  choice: alikuwa
  rationale: Hii ni hali ya sasa ya kitenzi εἰμί, lakini katika Kiswahili kishazi kamili ‘alikuwa’ ni cha kawaida na huunganika vizuri na ‘Mwana’.
- source_word: υἱός
  choice: Mwana
  rationale: Nomino hii haina kibainishi katika Kigiriki na imetumika kama kiarifu. Kiswahili hakihitaji kibainishi kama ‘a’ au ‘the’; herufi kubwa inaonyesha kuwa katika muktadha inamhusu Yesu katika utambulisho wake wa kipekee kama Mwana.
- source_word: ἔμαθεν
  choice: alijifunza
  rationale: Kitenzi μανθάνω kinamaanisha moja kwa moja ‘kujifunza’. Tafsiri haipunguzi kauli ya andiko wala kuifafanua kupita kiasi.
- source_word: ἀφ’ ὧν
  choice: kutokana na
  rationale: ἀπό pamoja na kiwakilishi husika huonyesha chanzo au msingi. ‘Kutokana na’ huhifadhi maana hiyo kwa Kiswahili cha kawaida.
- source_word: ἔπαθεν
  choice: mateso aliyoyapata
  rationale: πάσχω inaeleza mateso halisi aliyovumilia. Kwa kuwa ‘kuteseka’ kwa kawaida hakichukui yambwa katika Kiswahili, ‘mateso aliyoyapata’ ni usemi wa asili unaowakilisha ‘mambo aliyoteseka’.
- source_word: τὴν ὑπακοήν
  choice: utii
  rationale: Ingawa nomino ina kibainishi katika Kigiriki, Kiswahili hutumia kwa kawaida nomino dhahania ‘utii’ bila neno jingine la kuibainisha. Inaonyesha kuitikia na kujitiisha kwa mapenzi ya Mungu.
theological_decisions:
- issue: Jinsi ya kuonyesha hali ya Kristo kuwa Mwana pamoja na kujifunza kwake
  choice: Ingawa alikuwa Mwana
  alternative: Ingawa alikuwa yule Mwana
  rationale: Kigiriki kinasema ‘Mwana’ bila kibainishi. Kiswahili chenyewe hakina vibainishi vinavyolingana moja kwa moja na ‘a/the’, hivyo ‘Mwana’ huhifadhi vizuri usemi wa chanzo bila kulazimisha ubainifu ambao sarufi hauelezi wazi. Kauli inathibitisha hali yake ya kuwa Mwana huku ikidumisha ukweli kwamba alijifunza kupitia mateso.
- issue: Iwapo ‘alijifunza utii’ inadokeza kutotii hapo awali
  choice: Kudumisha maneno ya moja kwa moja ‘alijifunza utii’
  alternative: alijifunza gharama ya kutii
  rationale: Andiko linasema moja kwa moja kwamba alijifunza utii. Kauli hiyo inadumishwa pamoja na mvutano wake wa kiteolojia; katika muktadha inaeleza kujifunza kwa kupitia yale aliyoyapata, si kusahihishwa baada ya kutotii.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo ni wa ulinganifu bora: unafuata kwa karibu hoja na mvutano wa Kigiriki huku ukiepuka usemi usio wa kawaida wa kukifanya kitenzi ‘kuteseka’ kiwe na yambwa.'
