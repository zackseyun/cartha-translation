  text: Οὕτως καὶ ὁ Χριστὸς οὐχ ἑαυτὸν ἐδόξασεν γενηθῆναι ἀρχιερέα, ἀλλ’ ὁ λαλήσας πρὸς αὐτόν· Υἱός μου εἶ σύ, ἐγὼ σήμερον γεγέννηκά σε·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/005.yaml
  text: 'So also the Messiah did not glorify himself to become high priest[a], but the one who spoke to him: “You are my Son[c][b]; today I have begotten you.”'
translation:
  language: sw
  text: 'Ndivyo ilivyokuwa pia kwa Masihi[a]: hakujitukuza mwenyewe[b] kuwa kuhani mkuu, bali alitukuzwa na yule aliyesema naye: “Wewe ni Mwanangu; mimi leo nimekuzaa.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Kristo.” Neno la Kigiriki Χριστός linatumika hapa kama cheo.
    reason: alternative_reading
  - marker: b
    text: Au “hakujipa heshima mwenyewe.” Kitenzi cha Kigiriki kinaweza kumaanisha kumpa mtu utukufu au heshima.
    reason: lexical_alternative
  - marker: c
    text: Dondoo kutoka Zaburi 2:7.
    reason: cross_reference
lexical_decisions:
- source_word: Οὕτως καὶ
  choice: Vivyo hivyo
  rationale: Inaendeleza ulinganisho na maelezo yaliyotangulia kuhusu kuwekwa katika ukuhani, kwa Kiswahili cha kawaida na chenye mtiririko mzuri.
- source_word: ὁ Χριστὸς
  choice: Masihi
  rationale: Χριστός inatumika hapa kama cheo katika hoja kuhusu kuwekwa katika wadhifa; “Masihi” hudumisha maana hiyo ya cheo.
- source_word: οὐχ ἑαυτὸν ἐδόξασεν
  choice: hakujitukuza mwenyewe
  rationale: Huhifadhi kitenzi cha kujipa utukufu au heshima na pia mkazo wa kiwakilishi cha kujirejelea.
- source_word: γενηθῆναι ἀρχιερέα
  choice: ili awe kuhani mkuu
  rationale: Hueleza kuingia katika wadhifa wa kuhani mkuu kwa Kiswahili cha asili bila kudokeza kwamba tayari alikuwa katika wadhifa huo.
- source_word: ἀλλ’ ὁ λαλήσας πρὸς αὐτόν
  choice: bali alitukuzwa na yule aliyemwambia
  rationale: Kigiriki kinaacha tendo la kishazi cha pili likieleweka kutokana na kishazi cha kwanza. Kiswahili kinakamilisha maana hiyo kwa hali ya kutendwa ili sentensi iwe wazi na ya kawaida, huku yule anayesema akibaki kutajwa kwa namna isiyo ya moja kwa moja.
- source_word: Υἱός μου εἶ σύ
  choice: Wewe ni Mwanangu
  rationale: Ni mpangilio wa kawaida wa Kiswahili unaohifadhi tamko la moja kwa moja na uhusiano wa mwana.
- source_word: ἐγὼ σήμερον γεγέννηκά σε
  choice: mimi leo nimekuzaa
  rationale: Huhifadhi kitenzi γεννάω na wakati wake wa timilifu, pamoja na lugha ya Zaburi 2:7, bila kuifafanua kuwa kutawazwa, kufufuliwa, au fundisho jingine maalumu.
theological_decisions:
- issue: Tafsiri ya Χριστός
  choice: Masihi
  alternative: Kristo
  rationale: Katika muktadha huu neno linafanya kazi hasa kama cheo cha yule aliyewekwa na Mungu, si kama jina tu.
- issue: Maana ya “leo nimekuzaa” katika muktadha wa Kikristo
  choice: Kuhifadhi dondoo moja kwa moja bila ufafanuzi wa kimafundisho
  alternative: Kufafanua katika matini kuwa ni kutawazwa, ufufuo, au kuzaliwa kwa namna fulani ya kiteolojia
  rationale: Dondoo la Zaburi 2:7 lina mvutano wa kifasiri unaopaswa kubaki katika matini; tafsiri haipaswi kulazimisha mjadala wa baadaye wa kiteolojia.
- issue: Tendo lililoachwa katika kishazi cha ἀλλ’
  choice: bali alitukuzwa na yule aliyemwambia
  alternative: bali yule aliyemwambia
  rationale: Kigiriki kinaacha kitenzi kieleweke kutokana na “hakujitukuza.” Kukiongeza kwa hali ya kutendwa kunawasilisha ulinganisho kwa Kiswahili wazi bila kubadili mhusika au msingi wa uteuzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Kuhani mkuu” limeachwa kwa herufi ndogo kama jina la wadhifa. Alama za tanbihi zimewekwa karibu na maneno au dondoo zinazohusika.
