  yaml_path: translation/nt/hebrews/005/004.yaml
  text: And no one takes this honor for himself[a], but is called by God, just as Aaron also was.
translation:
  language: sw
  text: Wala hakuna mtu anayejitwalia heshima hii[a], bali huitwa na Mungu, kama Aroni pia alivyoitwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “heshima hiyo.” Kigiriki kinasema tu “heshima,” kikirejelea katika muktadha hadhi au cheo cha ukuhani.
    reason: lexical_alternative
lexical_decisions:
- source_word: τις
  choice: hakuna mtu
  rationale: Pamoja na ukanushi οὐχ, usemi huu kwa kawaida unamaanisha ‘hakuna mtu’.
- source_word: ἑαυτῷ
  choice: anayejitwalia
  rationale: Kitenzi cha kujirejelea kinaonyesha mtu kujipatia mwenyewe hadhi hiyo; ‘kujitwalia’ huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: λαμβάνει
  choice: anajitwalia
  rationale: ‘Kujitwalia’ huhifadhi tofauti kati ya mtu kujipa heshima hiyo na kuitwa na Mungu.
- source_word: τὴν τιμήν
  choice: heshima hii
  rationale: τιμή ni heshima au hadhi inayohusiana na ukuhani mkuu katika muktadha; ‘hii’ huonyesha rejeo hilo bila kubadili nomino kuwa ‘cheo’.
- source_word: ἀλλὰ καλούμενος ὑπὸ τοῦ θεοῦ
  choice: bali huitwa na Mungu
  rationale: 'Huhifadhi utofautishaji na hali ya kutendwa: Mungu ndiye anayemwita mtu. Kiswahili huhitaji kauli kamili iliyo wazi katika sentensi hii.'
- source_word: καθώσπερ καὶ Ἀαρών
  choice: kama vile Aroni alivyoitwa
  rationale: Kitenzi ‘alivyoitwa’ kinajazwa kutokana na wazo lililotangulia na kufanya ulinganisho uwe wazi na wa asili kwa Kiswahili.
theological_decisions:
- issue: Asili ya kuwekwa katika ukuhani
  choice: Heshima inayozungumziwa haijitwaliwi na mtu, bali inategemea wito wa Mungu, huku Aroni akiwa mfano.
  alternative: Kuichukulia kama kauli ya jumla kuhusu heshima isiyohusiana hasa na ukuhani.
  rationale: Muktadha wa Waebrania 5:1–5 unahusu ukuhani mkuu. ‘Heshima hii’ huhifadhi neno la Kigiriki huku ikiruhusu muktadha kubainisha aina ya heshima.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. ‘Wala hakuna mtu’ huunganisha mstari huu na hoja iliyotangulia; ‘kujitwalia’ ni ya asili na huonyesha wazi kutwaa kwa ajili yake mwenyewe.
