  text: καθὼς καὶ ἐν ἑτέρῳ λέγει· Σὺ ἱερεὺς εἰς τὸν αἰῶνα κατὰ τὴν τάξιν Μελχισέδεκ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/006.yaml
  text: just as he also says in another place[b][a], “You are a priest forever according to the order of Melchizedek,”
translation:
  language: sw
  text: 'kama asemavyo pia mahali pengine[a]: “Wewe ni kuhani milele,

    kwa utaratibu wa Melkizedeki[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwingine.” Kiyunani husema kihalisi “katika nyingine,” huku neno kama “mahali” likieleweka.
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa mpangilio wa Melkizedeki.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς καὶ
  choice: kama asemavyo pia
  rationale: Huhifadhi ulinganisho wa καθώς na maana ya nyongeza ya καί kwa Kiswahili cha kawaida, huku ikiunganisha nukuu hii na iliyotangulia.
- source_word: ἐν ἑτέρῳ
  choice: mahali pengine
  rationale: Kirai cha Kiyunani kina kivumishi ‘pengine/nyingine’ huku nomino ikidokezwa; ‘mahali pengine’ huweka wazi kwamba ni sehemu nyingine ya Maandiko bila kufafanua kupita kiasi.
- source_word: λέγει
  choice: asemavyo
  rationale: Kitenzi cha wakati uliopo kinawasilisha kauli ya Maandiko kama sauti inayoendelea kusema; umbo hili haliongezi wazi mtendaji ambaye Kiyunani hakumtaji.
- source_word: Σὺ
  choice: Wewe
  rationale: Huhifadhi msisitizo wa kiwakilishi cha nafsi ya pili umoja katika usemi wa moja kwa moja.
- source_word: ἱερεὺς
  choice: kuhani
  rationale: Hili ndilo neno la kawaida na lenye hadhi katika Kiswahili kwa ἱερεύς.
- source_word: εἰς τὸν αἰῶνα
  choice: milele
  rationale: Ni tafsiri ya kawaida na wazi ya usemi unaomaanisha kudumu bila mwisho.
- source_word: κατὰ τὴν τάξιν
  choice: kwa utaratibu wa
  rationale: ‘Utaratibu’ huhifadhi wazo la τάξις kama mpangilio au aina ya ukuhani, bila kulifanya kuwa ufananisho wa jumla tu.
- source_word: Μελχισέδεκ
  choice: Melkizedeki
  rationale: Ni umbo la jina hili lililozoeleka katika Kiswahili cha Biblia na linawakilisha jina la Kiyunani bila kulitafsiri kimaana.
theological_decisions:
- issue: Mtendaji wa λέγει katika fomula ya kunukuu
  choice: ‘asemavyo,’ bila kumtaja mtendaji wazi
  alternative: ‘Maandiko yasemavyo’ au ‘Mungu asemavyo’
  rationale: Kiyunani hakitaji nomino ya mtendaji. Tafsiri hii huhifadhi sauti hai ya sasa ya nukuu na kuacha wazi uhusiano kati ya Mungu na Maandiko badala ya kuufafanua zaidi ya matini.
- issue: Maana ya τάξις katika nukuu kuhusu Melkizedeki
  choice: ‘utaratibu’ kama mpangilio au aina ya ukuhani
  alternative: ‘mfano’
  rationale: Katika hoja ya Waebrania, neno hili linaashiria mpangilio wa ukuhani unaohusishwa na Melkizedeki. ‘Utaratibu’ huhifadhi maana hiyo, huku tanbihi ikitoa tafsiri mbadala inayowezekana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaosomeka kwa urahisi. Mpangilio wa kishairi wa nukuu umehifadhiwa, na istilahi ‘kuhani,’ ‘milele,’ na ‘utaratibu’ zinafaa kwa muktadha wa hoja kuhusu ukuhani.
