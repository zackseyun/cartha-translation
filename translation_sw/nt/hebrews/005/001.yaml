  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Πᾶς γὰρ ἀρχιερεὺς ἐξ ἀνθρώπων λαμβανόμενος ὑπὲρ ἀνθρώπων καθίσταται τὰ πρὸς τὸν θεόν, ἵνα προσφέρῃ δῶρά τε καὶ θυσίας ὑπὲρ ἁμαρτιῶν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/001.yaml
  text: For every high priest[a], being taken from among men, is appointed on behalf of men in the things pertaining to God, so that he may offer both gifts and sacrifices for sins,
translation:
  language: sw
  text: Kwa maana kila kuhani mkuu, akichukuliwa kutoka miongoni mwa wanadamu, huwekwa kwa ajili ya wanadamu katika mambo yanayomhusu Mungu, ili atoe matoleo na dhabihu kwa ajili ya dhambi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πᾶς
  choice: kila
  rationale: Nomino iko katika umoja na kauli ni ya jumla kuhusu kila anayeshika cheo cha kuhani mkuu; “kila” linaonyesha matumizi hayo ya kigawanyo.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Kiunganishi hiki kinaeleza au kuunga mkono hoja iliyotangulia; “Kwa maana” ni cha kawaida na wazi katika Kiswahili.
- source_word: ἀρχιερεὺς
  choice: kuhani mkuu
  rationale: Hili ndilo neno sanifu la Kiswahili kwa cheo hicho cha ukuhani katika muktadha wa Kiyahudi.
- source_word: ἐξ ἀνθρώπων λαμβανόμενος
  choice: akichukuliwa kutoka miongoni mwa wanadamu
  rationale: Muundo huu unadumisha hali ya kutendwa ya kitenzi na unaonyesha kwamba kuhani mkuu anatoka katika jamii ya wanadamu.
- source_word: ὑπὲρ ἀνθρώπων
  choice: kwa ajili ya wanadamu
  rationale: ὑπέρ hapa huonyesha kutenda kwa manufaa au kwa niaba ya wengine. “Kwa ajili ya” ni ya asili na inafaa katika muktadha huu wa uwakilishi.
- source_word: καθίσταται
  choice: huwekwa
  rationale: Huonyesha kuteuliwa au kuwekwa katika wadhifa. Wakati wa mazoea “hu-” unafaa kwa kauli ya jumla kuhusu cheo hiki.
- source_word: τὰ πρὸς τὸν θεόν
  choice: katika mambo yanayomhusu Mungu
  rationale: Huu ni usemi unaorejelea mambo ya ibada na huduma yanayohusiana na Mungu; tafsiri hii ni ya karibu na ya kawaida katika Kiswahili.
- source_word: ἵνα προσφέρῃ
  choice: ili atoe
  rationale: “Ili” huhifadhi wazi maana ya kusudi katika ἵνα pamoja na kitenzi tegemezi.
- source_word: δῶρά τε καὶ θυσίας
  choice: vipawa na dhabihu
  rationale: Majina yote mawili yamedumishwa ili kuonyesha upana wa vitu vinavyotolewa katika ibada. Kiswahili hakihitaji lazima muundo mzito wa “vyote ... na ...” ili kuwakilisha τε καὶ.
- source_word: ὑπὲρ ἁμαρτιῶν
  choice: kwa ajili ya dhambi
  rationale: Katika muktadha wa dhabihu, usemi huu unaonyesha matoleo yanayotolewa kuhusiana na dhambi; “kwa ajili ya dhambi” ni tafsiri ya kawaida bila kufafanua zaidi namna ya athari yake.
theological_decisions:
- issue: Lugha ya uwakilishi katika ἀνθρώπων
  choice: wanadamu katika sehemu zote mbili
  alternative: wanaume; watu
  rationale: Ingawa nomino ya Kigiriki ina umbo la kisarufi la kiume na makuhani wakuu wa kihistoria walikuwa wanaume, ἄνθρωπος kwa wingi hapa inaweza kurejelea wanadamu kwa jumla, hasa katika ulinganifu kati ya kuhani anayetoka katika ubinadamu na wale anaowawakilisha. “Wanadamu” huhifadhi maana hiyo bila kuingiza dai kwamba kila anayewakilishwa ni mwanamume.
- issue: Maana ya ὑπὲρ ἁμαρτιῶν
  choice: kwa ajili ya dhambi
  alternative: kwa ondoleo la dhambi; ili kufidia dhambi
  rationale: Chanzo hakibainishi katika kishazi hiki pekee namna kamili ambayo vipawa na dhabihu zinahusiana na dhambi. Tafsiri iliyochaguliwa inadumisha upana huo na haiongezi ufafanuzi wa kiteolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi unabaki karibu na hoja ya Kigiriki huku “huwekwa” ikifanya kauli ya jumla kuwa ya asili katika Kiswahili. Hakuna tanbihi inayohitajika kwa kuwa “wanadamu” hutoa maana pana ya ἄνθρωποι kwa usahihi katika muktadha huu.
