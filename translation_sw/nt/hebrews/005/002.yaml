lexical_decisions:
- source_word: μετριοπαθεῖν
  choice: kuwashughulikia kwa upole
  rationale: Kitenzi hiki kinaonyesha mwitikio wenye kiasi na kujizuia, usio mkali wala usiojali. Usemi huu ni wa asili katika Kiswahili na unahifadhi upande wa hisia na wa matendo.
- source_word: δυνάμενος
  choice: aweze
  rationale: Hueleza uwezo wa kuhani mkuu katika mfululizo wa maelezo ya muktadha. Muundo huu unaungana kwa kawaida na sentensi iliyotangulia.
- source_word: τοῖς ἀγνοοῦσι
  choice: wale wasiojua
  rationale: Huhifadhi nguvu ya hali ya kuendelea ya nomino-kitenzi bila kuwafanya watu hawa waonekane kuwa kundi la kudumu linaloitwa 'wajinga.'
- source_word: πλανωμένοις
  choice: wanaopotoka
  rationale: Hutoa maana ya kwenda mbali na njia inayofaa bila kubainisha kama kosa hilo limetokana na wao wenyewe au wameongozwa na wengine; uwezekano wa maana ya kutendwa umewekwa katika tanbihi.
- source_word: ἐπεὶ
  choice: kwa kuwa
  rationale: Kiunganishi hiki kinatoa sababu ya kuhani mkuu kuwatendea watu kwa upole.
- source_word: καὶ αὐτὸς
  choice: yeye mwenyewe pia
  rationale: Huhifadhi msisitizo juu ya kuhani mwenyewe pamoja na wazo kwamba yeye pia anashiriki hali ya wale anaowahudumia.
- source_word: περίκειται ἀσθένειαν
  choice: amezingirwa na udhaifu
  rationale: Huhifadhi picha ya hali inayomzunguka mtu kuliko tafsiri tambarare ya kuwa chini ya udhaifu. 'Udhaifu' hubaki pana, ukiweza kutaja unyonge wa kibinadamu bila kuufanya wa kimwili au wa kimaadili pekee.
theological_decisions:
- issue: Hali ya kosa la watu wanaotajwa kwa ἀγνοοῦσι καὶ πλανωμένοις
  choice: Wale wasiojua na wanaopotoka, kwa maana pana
  alternative: Dhambi zisizokusudiwa pekee katika mfumo wa dhabihu wa Walawi
  rationale: Maneno yanaweza kukumbusha makundi ya kikuhani katika Agano la Kale, lakini yenyewe ni mapana zaidi ya istilahi maalumu ya dhabihu. Tafsiri haipunguzi maana kuwa dhambi za aina moja tu.
- issue: Maana ya ἀσθένεια kuhusu kuhani mkuu
  choice: udhaifu wa kibinadamu kwa maana pana
  alternative: udhaifu wa kimwili pekee au wa kimaadili pekee
  rationale: Neno linaweza kuhusisha unyonge wa hali ya mwanadamu kwa upana. 'Udhaifu' huhifadhi wigo huo bila kuamua jambo ambalo kifungu hakilibainishi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo unaendelea kisarufi kutoka maelezo ya kuhani mkuu katika aya iliyotangulia; alama zote za tanbihi zimewekwa katika matini.
