  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὃς ἐν ταῖς ἡμέραις τῆς σαρκὸς αὐτοῦ δεήσεις τε καὶ ἱκετηρίας πρὸς τὸν δυνάμενον σῴζειν αὐτὸν ἐκ θανάτου μετὰ κραυγῆς ἰσχυρᾶς καὶ δακρύων προσενέγκας καὶ εἰσακουσθεὶς ἀπὸ τῆς εὐλαβείας,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/007.yaml
  text: who[a], in the days of his flesh, having offered up both prayers and petitions with loud cries and tears to the one able to save him from death, and having been heard because of his reverence[b],
translation:
  language: sw
  text: ambaye, katika siku za mwili wake, alimtolea yule awezaye kumwokoa na mauti[a] maombi na dua kwa kilio kikubwa na machozi, naye akasikilizwa kwa sababu ya uchaji wake[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Kumwokoa na mauti” pia inaweza kueleweka kuwa “kumwokoa kutoka mautini,” yaani, kumkomboa kwa njia ya ufufuo.
    reason: alternative_reading
  - marker: b
    text: Au, “kwa sababu ya hofu yake ya kumcha Mungu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ταῖς ἡμέραις τῆς σαρκὸς αὐτοῦ
  choice: katika siku za mwili wake
  rationale: Inahifadhi neno halisi σάρξ, ‘mwili,’ pamoja na msisitizo wa maisha yake ya kibinadamu yenye mwili, badala ya kulifafanua tu kuwa ‘wakati wa maisha yake duniani.’
- source_word: δεήσεις τε καὶ ἱκετηρίας
  choice: maombi na dua
  rationale: ‘Maombi’ ni neno pana, huku ‘dua’ ikidokeza ombi la dhati na la kusihi; maneno haya mawili yanatofautisha istilahi za Kigiriki kwa Kiswahili cha kawaida na chenye heshima.
- source_word: πρὸς τὸν δυνάμενον σῴζειν αὐτὸν ἐκ θανάτου
  choice: kwa yule awezaye kumwokoa na mauti
  rationale: ‘Yule awezaye’ huakisi kirai cha kisifa kilichotumika kama nomino. ‘Kumwokoa na mauti’ hakiamui ikiwa maana ni kumzuia asife au kumtoa mautini kwa ufufuo.
- source_word: μετὰ κραυγῆς ἰσχυρᾶς καὶ δακρύων
  choice: kwa kilio kikubwa na machozi
  rationale: ‘Kilio’ cha umoja kinafuata κραυγῆς, na ‘kikubwa’ kinaonyesha nguvu na ukali wa κραυγῆς ἰσχυρᾶς kwa Kiswahili cha asili.
- source_word: προσενέγκας
  choice: alimtolea
  rationale: Kitenzi hiki huhifadhi wazo la kupeleka au kutoa maombi kwa Mungu na pia mwangwi wa utoaji unaofaa katika muktadha wa ukuhani wa Waebrania, bila kulazimisha maana ya dhabihu.
- source_word: εἰσακουσθεὶς
  choice: akasikilizwa
  rationale: Huonyesha kwamba sala yake ilisikilizwa kwa kibali bila kuongeza namna maalumu ya jibu ambayo haijaelezwa wazi katika Kigiriki.
- source_word: ἀπὸ τῆς εὐλαβείας
  choice: kwa sababu ya uchaji wake
  rationale: ‘Uchaji’ huwasilisha heshima ya kina na kumcha Mungu bila kuongeza moja kwa moja wazo la utiifu ambalo halimo wazi katika neno εὐλάβεια.
theological_decisions:
- issue: Maana ya ἀπὸ τῆς εὐλαβείας kuhusiana na Yesu
  choice: kwa sababu ya uchaji wake
  alternative: kwa sababu ya kumcha Mungu kwake
  rationale: ‘Uchaji’ hudumisha maana ya heshima ya kidini na mtazamo wa unyenyekevu mbele za Mungu, huku tanbihi ikihifadhi maana nyingine halali ya kumcha Mungu.
- issue: Upeo wa maana ya σῴζειν αὐτὸν ἐκ θανάτου
  choice: kumwokoa na mauti
  alternative: kumwokoa kutoka mautini
  rationale: Kauli kuu haibainishi ikiwa ni kuokolewa asipatwe na kifo au kutolewa katika kifo kwa ufufuo; uwezekano wa pili umeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa mwanzo ‘ambaye’ na koma ya mwisho umehifadhiwa kwa sababu mstari huu ni sehemu ya sentensi inayoendelea kutoka na kuingia katika mistari jirani. ‘Katika siku za mwili wake’ ni rasmi kidogo lakini hulinda taswira ya Kigiriki na msisitizo wake wa kuwa na mwili.
