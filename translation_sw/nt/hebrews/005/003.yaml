  text: And because of this he is obligated[a], just as for the people, so also for himself, to offer for sins.
translation:
  language: sw
  text: Na kwa sababu ya hilo[a], anawajibika kutoa kwa ajili ya dhambi, kwa ajili ya watu kama pia kwa ajili yake mwenyewe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kigiriki: “kwa sababu yake” au “kwa sababu ya hilo.” Yaelekea linarejelea udhaifu wa kuhani mkuu uliotajwa katika mstari uliotangulia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ αὐτὴν
  choice: kwa sababu ya udhaifu huo
  rationale: Kiwakilishi cha kike kinarejelea kwa kawaida udhaifu uliotajwa katika mstari uliotangulia. Kutaja “udhaifu” kwa Kiswahili kunafanya rejeo hilo lieleweke bila kubadili nguvu ya kisababishi ya διά.
- source_word: ὀφείλει
  choice: ana wajibu
  rationale: Huonyesha sharti au wajibu wa kikuhani, si ushauri tu.
- source_word: καθὼς ... οὕτως καὶ
  choice: kama ... mwenyewe
  rationale: Muundo wa kulinganisha umehifadhiwa kwa mpangilio wa asili na unaosomeka kwa urahisi katika Kiswahili.
- source_word: τοῦ λαοῦ
  choice: watu
  rationale: Katika muktadha huu ni watu wa agano, lakini “watu” huhifadhi usemi wa chanzo bila kuongeza “Israeli” katika matini.
- source_word: περὶ αὑτοῦ
  choice: kwa ajili ya dhambi zake mwenyewe
  rationale: “Mwenyewe” huhifadhi msisitizo wa kirejeshi; kurudia “dhambi zake” kunatoa Kiswahili cha kawaida na kuonyesha wazi kuwa kuhani naye ana dhambi.
- source_word: προσφέρειν
  choice: kutoa
  rationale: Kitenzi kimeachwa bila kuongeza nomino “dhabihu,” kama ilivyo katika Kigiriki; muktadha wa kikuhani unaonyesha kuwa ni tendo la kutoa dhabihu.
- source_word: περὶ ἁμαρτιῶν
  choice: kwa ajili ya dhambi
  rationale: Huhifadhi maana ya utoaji unaohusiana na dhambi bila kuufanya kwa lazima kuwa aina maalumu ya “sadaka ya dhambi.”
theological_decisions:
- issue: Kinachorejelewa na δι’ αὐτὴν
  choice: Udhaifu wa kuhani mkuu uliotajwa katika mstari wa 2
  alternative: Hali au wadhifa wake kwa jumla
  rationale: Udhaifu ndio rejeo la karibu zaidi kisarufi na unalingana na hoja kwamba kuhani wa kidunia hushiriki udhaifu wa watu.
- issue: Kutoa kwa ajili ya dhambi zake mwenyewe
  choice: Matini inasema wazi kwamba kuhani hutoa pia kwa ajili ya dhambi zake mwenyewe
  alternative: Kupunguza usemi huo kuwa utoaji kwa ajili yake kwa jumla
  rationale: περὶ αὑτοῦ pamoja na περὶ ἁμαρτιῶν huweka utofauti wa watu na kuhani mwenyewe; tafsiri haipaswi kuondoa mvutano huo wa kitheolojia.
- issue: Kitu cha kitenzi προσφέρειν
  choice: Kimeachwa kama “kutoa” bila kuongeza “dhabihu” katika matini
  alternative: “Kutoa dhabihu”
  rationale: Muktadha unaonyesha tendo la kidhabihu, lakini Kigiriki hakina nomino ya kitu kinachotolewa; hivyo tafsiri hii inalinda umbo la chanzo huku ikibaki wazi katika muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mpangilio umefanywa wa kawaida kwa Kiswahili huku ulinganifu kati ya watu na kuhani mwenyewe ukihifadhiwa.
