lexical_decisions:
- source_word: καὶ
  choice: naye
  rationale: Kiunganishi kinaendeleza wazo la mstari uliotangulia; “naye” ni cha asili katika Kiswahili na hudumisha uhusiano huo bila kuongeza tafsiri.
- source_word: τελειωθεὶς
  choice: baada ya kukamilishwa
  rationale: Kitenzi hiki cha wakati uliopita katika hali ya kutendwa kinaeleza kufikishwa kwenye lengo au utimilifu uliokusudiwa. “Kukamilishwa” huepuka kudokeza kwamba Yesu alikuwa na dosari ya kimaadili.
- source_word: ἐγένετο
  choice: akawa
  rationale: “Akawa” huonyesha hali au jukumu lililotokea baada ya kukamilishwa na ni tafsiri ya moja kwa moja na ya kawaida ya ἐγένετο hapa.
- source_word: πᾶσιν τοῖς ὑπακούουσιν αὐτῷ
  choice: kwa wote wanaomtii
  rationale: Kirai hiki kinawataja wanufaika na kudumisha wazi maana ya utii. Umbo “wanaomtii” linaweza kueleza tabia inayoendelea bila kulazimisha mfumo wa kimadhehebu.
- source_word: αἴτιος
  choice: chanzo
  rationale: Hapa neno humaanisha yule anayesababisha au kuleta jambo. “Chanzo” ni cha kawaida na huwasilisha uwakala wa kisababishi bila ukakasi wa “sababu” au maana ya kifasihi ya “mwanzilishi.”
- source_word: σωτηρίας
  choice: wokovu
  rationale: “Wokovu” ni istilahi ya kawaida na inayofaa muktadha wa kitheolojia wa Waebrania.
- source_word: αἰωνίου
  choice: wa milele
  rationale: “Wa milele” ni usemi wa kawaida wa Kiswahili unaowasilisha muda usio na mwisho wa wokovu.
theological_decisions:
- issue: Maana ya kikristolojia ya τελειωθεὶς kuhusu Yesu
  choice: baada ya kukamilishwa
  alternative: baada ya kufanywa mkamilifu
  rationale: Tafsiri iliyochaguliwa inaelekeza kwenye kufikishwa kwa huduma yake ya ukuhani na kazi yake ya ukombozi kwenye utimilifu, si kubadilika kutoka katika upungufu wa kimaadili kwenda ukamilifu. Tanbihi huhifadhi uwezekano wa tafsiri ya jadi.
- issue: Upeo na sharti katika πᾶσιν τοῖς ὑπακούουσιν αὐτῷ
  choice: kwa wote wanaomtii
  alternative: kwa wote wanaomsikiliza kwa utii
  rationale: Kigiriki kinataja wazi wale wanaomtii. Tafsiri hailegezi usemi huo kuwa “wanaomwamini” wala kuupanua kuwa mfumo maalumu wa kimafundisho.
- issue: Uwakala wa Kristo katika αἴτιος σωτηρίας
  choice: chanzo cha wokovu
  alternative: sababu ya wokovu
  rationale: “Chanzo” hudumisha kwamba Kristo ndiye anayeleta wokovu, bila kufafanua zaidi ya kile neno la Kigiriki linachosema.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa sentensi hudumisha mwendelezo kutoka mstari uliotangulia. “Kukamilishwa” ni wa asili kuliko “kufanywa kamili” na huhifadhi maana ya kufikishwa kwenye lengo; “wanaomtii” ni wazi na fupi.
