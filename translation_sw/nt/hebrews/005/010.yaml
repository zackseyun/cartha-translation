lexical_decisions:
- source_word: προσαγορευθεὶς
  choice: baada ya kutangazwa
  rationale: Kitenzi hiki cha hali ya kutendwa kinaonyesha tendo la Mungu la kumtaja au kumtambua rasmi Yesu kwa cheo hicho. “Kutangazwa” huhifadhi wazo la tamko rasmi bila kulazimisha maana yenye nguvu zaidi ya “kuwekwa rasmi.” Muundo wa “baada ya” pia unaonyesha kuwa tendo hilo linatangulia kwa mtazamo wa kirai kishirikishi cha Kigiriki.
- source_word: ὑπὸ τοῦ θεοῦ
  choice: na Mungu
  rationale: Ὑπό pamoja na hali ya genitivi humtaja mtendaji katika muundo wa kutendwa. Maandishi yanasema “Mungu” tu, hivyo hayajaongezewa “Baba.”
- source_word: ἀρχιερεὺς
  choice: kuhani mkuu
  rationale: Hili ndilo neno la kawaida na linaloeleweka kwa ἀρχιερεύς katika Kiswahili cha Biblia.
- source_word: κατὰ τὴν τάξιν
  choice: kwa utaratibu wa
  rationale: Katika kifungu hiki κατά huonyesha ulinganifu au kufuata kielelezo, na τάξις huelekeza kwenye mpangilio au aina ya ukuhani. “Kwa utaratibu wa” huhifadhi kwa kiasi kikubwa usemi wa chanzo na uhusiano wake na Zaburi 110:4.
- source_word: Μελχισέδεκ
  choice: Melkizedeki
  rationale: Hii ni tahajia ya jina hilo iliyozoeleka katika Kiswahili cha Afrika Mashariki.
theological_decisions:
- issue: Iwapo προσαγορευθεὶς itafsiriwe kama mabadiliko ya hali au kama tamko rasmi la Mungu
  choice: kutangazwa na Mungu kuwa kuhani mkuu
  alternative: kuitwa na Mungu kuhani mkuu; kuwekwa na Mungu kuwa kuhani mkuu
  rationale: “Kutangazwa” hudokeza kitendo cha Mungu cha kumtaja au kumtambua rasmi Yesu bila kuamua kwamba hapo ndipo alianza kuwa kuhani mkuu, wala bila kupunguza uzito wa tamko hilo kuwa jina la kawaida tu.
- issue: Maana ya τάξις katika uhusiano wa Yesu na Melkizedeki
  choice: kwa utaratibu wa Melkizedeki
  alternative: kwa mfano wa Melkizedeki; kwa daraja la Melkizedeki
  rationale: “Utaratibu” huhifadhi wigo wa maana unaoweza kujumuisha mpangilio, aina, au kielelezo cha ukuhani bila kueleza kupita maandishi yenyewe jinsi uhusiano huo unavyofanya kazi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa msomaji wa kawaida. Kifungu kimeachwa katika umbo tegemezi kwa sababu mstari huu unaendeleza sentensi ya mstari uliotangulia. Alama zote za tanbihi zimewekwa katika matini kuu.
