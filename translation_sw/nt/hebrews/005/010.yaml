  text: akiwa ametangazwa na Mungu kuwa kuhani mkuu kwa utaratibu wa Melkizedeki[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akiwa ameitwa na Mungu kuwa kuhani mkuu,” au “akiwa amewekwa na Mungu kuwa kuhani mkuu.”
    reason: lexical_alternative
  - marker: b
    text: Maneno haya yanarejelea Zaburi 110:4, ambako ukuhani unaelezwa kuwa “kwa utaratibu wa Melkizedeki.”
