base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/014.yaml
  text: For it is evident that our Lord has arisen from Judah[a], a tribe about which Moses said nothing concerning priests.
translation:
  language: sw
  text: Kwa maana ni wazi kwamba Bwana wetu ametokea kutoka Yuda[a], kabila ambalo Musa hakusema lolote kuhusu makuhani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “amechomoza kutoka Yuda.” Kitenzi cha Kigiriki kina taswira ya kuchomoza au kuota; hapa kinarejelea asili yake katika kabila la Yuda, wala si ufufuo hasa.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρόδηλον
  choice: ni wazi
  rationale: Kirai hiki cha kawaida katika Kiswahili cha sasa kinaonyesha jambo lililo dhahiri bila kutumia lugha nzito kupita kiasi.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Kinahifadhi uhusiano wa kutoa sababu au maelezo kwa hoja iliyotangulia.
- source_word: ἐξ Ἰούδα
  choice: katika Yuda
  rationale: Katika muktadha huu kinaonyesha asili au ukoo unaotokana na Yuda; sentensi inayofuata inalitaja wazi kuwa kabila.
- source_word: ἀνατέταλκεν
  choice: ametokea
  rationale: Kitenzi hiki kinadokeza kuchomoza au kuota, lakini hapa kinahusu kutoka kwa asili ya kabila la Yuda. 'Ametokea' ni cha asili katika Kiswahili na hakielekezi moja kwa moja kwenye ufufuo.
- source_word: ὁ κύριος ἡμῶν
  choice: Bwana wetu
  rationale: Kinatafsiri cheo κύριος na kumweka kiwakilishi milikishi katika mpangilio wa kawaida wa Kiswahili.
- source_word: εἰς ἣν φυλήν
  choice: kabila ambalo
  rationale: Muundo huu unaunganisha Yuda na kishazi kinachofuata kwa Kiswahili cha kawaida bila kurudia jina la kabila.
- source_word: περὶ ἱερέων οὐδὲν
  choice: hakusema lolote kuhusu makuhani
  rationale: Kinahifadhi rejeo mahususi kwa makuhani, badala ya kubadili kuwa dhana pana ya ukuhani.
- source_word: Μωϋσῆς ἐλάλησεν
  choice: Musa hakusema
  rationale: Kitenzi 'kusema' ni cha kawaida na sahihi hapa; ukanushi umeunganishwa kiasili na 'lolote' katika Kiswahili.
theological_decisions:
- issue: Mrejelewa wa ‘Bwana wetu’
  choice: Kudumisha ‘Bwana wetu’ bila kuongeza jina Yesu
  alternative: Bwana wetu Yesu
  rationale: Muktadha unamtambulisha kuwa Yesu, lakini maandishi yenyewe hapa yanatumia cheo tu; kutoongeza jina kunahifadhi namna ya usemi ya chanzo.
- issue: Maana ya ἀνατέταλκεν
  choice: ametokea, ikirejelea asili yake katika Yuda
  alternative: amechomoza au ameota kutoka Yuda
  rationale: Hoja ya muktadha inahusu kabila na sifa za ukuhani, si hasa ufufuo. Tafsiri kuu inaepuka utata usio wa lazima, huku tanbihi ikihifadhi taswira ya kitenzi cha Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Muundo ni wa moja kwa moja, na taswira halisi ya kitenzi imehifadhiwa katika tanbihi.
