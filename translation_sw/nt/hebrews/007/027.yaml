  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὃς οὐκ ἔχει καθ’ ἡμέραν ἀνάγκην, ὥσπερ οἱ ἀρχιερεῖς, πρότερον ὑπὲρ τῶν ἰδίων ἁμαρτιῶν θυσίας ἀναφέρειν, ἔπειτα τῶν τοῦ λαοῦ (τοῦτο γὰρ ἐποίησεν ἐφάπαξ ἑαυτὸν ἀνενέγκας)·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/027.yaml
  text: who has no need[a], day after day, like the high priests, to offer up sacrifices first for his own sins and then for those of the people[d][c][b], for this he did once for all when he offered up himself.
translation:
  language: sw
  text: ambaye hana haja, siku baada ya siku[a], kama makuhani wakuu, kutoa dhabihu kwanza kwa ajili ya dhambi zake mwenyewe, kisha kwa ajili ya zile za watu[b]. Kwa maana alifanya hivyo mara moja tu[c], alipojitoa mwenyewe kuwa dhabihu[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kila siku.” Nahau ya Kigiriki ina maana ya “siku baada ya siku.”
    reason: lexical_alternative
  - marker: b
    text: Au “kwa ajili ya dhambi za watu.” Kigiriki kinaacha neno “dhambi” lieleweke kutokana na maneno yaliyotangulia; kwa maneno halisi ni “kisha zile za watu.”
    reason: lexical_alternative
  - marker: c
    text: Au “mara moja na kwa wakati wote.”
    reason: lexical_alternative
  - marker: d
    text: Au “kwa kujitoa mwenyewe” au “baada ya kujitoa mwenyewe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καθ’ ἡμέραν
  choice: siku baada ya siku
  rationale: Nahau hii inaonyesha tendo linalorudiwa kila siku; usemi huu ni wa kawaida na huhifadhi nguvu hiyo ya kurudiwa.
- source_word: ἀνάγκην
  choice: hana haja
  rationale: Muundo ἔχει ἀνάγκην unatafsirika kwa kawaida kuwa ‘kuwa na haja’; hapa umekanushwa.
- source_word: ὥσπερ οἱ ἀρχιερεῖς
  choice: kama makuhani wakuu
  rationale: Huhifadhi ulinganisho na wingi wa makuhani wakuu wa mfumo wa Kilawi.
- source_word: πρότερον ... ἔπειτα
  choice: kwanza ... kisha
  rationale: Huonyesha kwa uwazi mfuatano wa matoleo ya dhabihu.
- source_word: ὑπὲρ τῶν ἰδίων ἁμαρτιῶν
  choice: kwa ajili ya dhambi zake mwenyewe
  rationale: Katika muktadha wa dhabihu, ὑπέρ ina maana ya ‘kwa ajili ya’; ‘mwenyewe’ husisitiza umilikaji uliopo katika ἰδίων.
- source_word: θυσίας ἀναφέρειν
  choice: kutoa dhabihu
  rationale: Huu ni usemi wa kawaida wa Kiswahili kwa tendo la kikuhani la kuwasilisha dhabihu, bila kulazimisha maana halisi ya ‘kupandisha’.
- source_word: τῶν τοῦ λαοῦ
  choice: zile za watu
  rationale: Huhifadhi udondoshaji wa neno ‘dhambi’ katika Kigiriki huku rejeleo lake likibaki wazi kutokana na kishazi kilichotangulia.
- source_word: τοῦτο γὰρ ἐποίησεν
  choice: Kwa maana alifanya hivyo
  rationale: ‘Hivyo’ hurejelea tendo la dhabihu lililotajwa, huku muundo ukibaki wa kawaida katika Kiswahili.
- source_word: ἐφάπαξ
  choice: mara moja tu, kwa wakati wote
  rationale: Hueleza kwamba tendo lilifanyika mara moja na lina uhalali wa kudumu; tanbihi huhifadhi namna fupi zaidi ya kutafsiri.
- source_word: ἑαυτὸν ἀνενέγκας
  choice: alipojitoa mwenyewe kuwa dhabihu
  rationale: Hutoa uhusiano wa wakati wa kitenzi-shirikishi na kudhihirisha wazi nguvu ya kidhabihu ya ἀναφέρω katika Kiswahili cha kawaida.
theological_decisions:
- issue: Upeo wa ‘hivyo’ katika kishazi cha mwisho
  choice: ‘Hivyo’ inaelekeza kwenye tendo la dhabihu lililotajwa, lililotimizwa kwa Yesu kujitoa mwenyewe, bila kudai kwamba alitoa dhabihu kwa dhambi zake mwenyewe.
  alternative: ‘Hivyo’ inarejelea tu kutoa dhabihu kwa ajili ya dhambi za watu, au kwa upana zaidi kazi yake yote ya kikuhani.
  rationale: Muktadha wa karibu unatofautisha Yesu na makuhani wakuu wengine. Tafsiri inaacha upeo wa kiwakilishi ukiwa mpana kiasi kama ulivyo katika Kigiriki, lakini haisemi kwamba Yesu alikuwa na dhambi zake mwenyewe.
- issue: Namna ya kueleza kujitoa kwa Kristo
  choice: alipojitoa mwenyewe kuwa dhabihu
  alternative: kwa kujitoa mwenyewe; baada ya kujitoa mwenyewe
  rationale: Uamuzi huu huhifadhi sura ya Yesu kuwa kuhani na pia dhabihu, huku ukitoa Kiswahili cha asili na kinachoeleweka.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Makuhani wakuu’ na ‘dhabihu’ huhifadhi msamiati wa kikuhani wa Waebrania. Mpangilio umegawanywa katika sentensi mbili ili usomeke kwa urahisi bila kuondoa uhusiano wa sababu unaoonyeshwa na γάρ.
