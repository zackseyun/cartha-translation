id: HEB.7.16
reference: Hebrews 7:16
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὃς οὐ κατὰ νόμον ἐντολῆς ⸀σαρκίνης γέγονεν ἀλλὰ κατὰ δύναμιν ζωῆς ἀκαταλύτου,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/016.yaml
  text: who has become such not according to a law of a fleshly commandment[a], but according to the power of an indestructible life[c][b],
translation:
  language: sw
  text: ambaye amekuwa kuhani, si kwa mujibu wa sheria ya amri ya kimwili[a], bali kwa nguvu ya uzima usioweza kuangamizwa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ya sharti linalohusu mwili” au “ya amri inayohusu mwili.” Neno “kimwili” hapa halimaanishi “yenye dhambi.”
    reason: lexical_alternative
  - marker: b
    text: Kimapokeo, “uzima usio na mwisho.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: ambaye
  rationale: Kiwakilishi hiki cha uhusiano kinamrejelea kuhani anayetajwa katika muktadha uliotangulia na kudumisha uhusiano wa kisintaksia.
- source_word: κατὰ νόμον
  choice: kwa mujibu wa sheria
  rationale: κατά pamoja na hali ya kushutumu huonyesha kipimo au msingi. Kutotumia “ile sheria” kunahifadhi hali ya νόμον kutokuwa na kibainishi na hakuilazimishi rejeo kuwa jina maalumu la Sheria ya Musa.
- source_word: ἐντολῆς σαρκίνης
  choice: ya amri ya kimwili
  rationale: Muundo huu unahifadhi kwa kadiri inayowezekana mfuatano wa maneno ya Kigiriki na picha ya kile kinachohusu mwili, bila kuingiza maana ya uovu au dhambi. Tanbihi inaonyesha maana mbadala ya sharti linalohusu mwili.
- source_word: γέγονεν
  choice: amekuwa kuhani
  rationale: Wakati timilifu unaonyesha hali ya sasa iliyotokana na tukio lililotangulia. Neno “kuhani” limejazwa kutokana na muktadha ili sentensi iwe ya kawaida na wazi katika Kiswahili.
- source_word: ἀλλὰ κατὰ δύναμιν
  choice: bali kwa nguvu
  rationale: Hii inadumisha ulinganifu na utofautishaji wa vifungu viwili vya κατά, huku ikitoa Kiswahili cha kawaida.
- source_word: ζωῆς ἀκαταλύτου
  choice: uzima usioweza kuangamizwa
  rationale: ἀκατάλυτος hueleza kitu kisichoweza kuvunjwa, kufutwa au kuangamizwa. Tafsiri hii ni pana kuliko wazo la muda usio na mwisho pekee.
theological_decisions:
- issue: Maana ya σαρκίνης ikilinganishwa na ἀκαταλύτου
  choice: ya kimwili, kwa maana ya sifa au sharti linalohusu mwili na ukoo
  alternative: ya kimaumbile; inayohusu mwili; ya kidunia
  rationale: Muktadha unatofautisha msingi wa nje unaohusiana na mwili na ukoo na nguvu ya uzima usioweza kuangamizwa. Tafsiri haipaswi kudokeza kwamba amri yenyewe ilikuwa ya dhambi.
- issue: Maana ya ἀκαταλύτου
  choice: usioweza kuangamizwa
  alternative: usio na mwisho; usioharibika
  rationale: Chaguo kuu linahifadhi wazo la kutoweza kuvunjwa au kuondolewa, si kuendelea kwa muda usio na mwisho tu. Tafsiri ya kimapokeo imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo “amekuwa kuhani” unakamilisha kidokezo cha Kigiriki kwa kutegemea muktadha, na “kwa mujibu wa … bali kwa …” huhifadhi utofautishaji wa hoja.
