lexical_decisions:
- source_word: ἀθέτησις
  choice: inaondolewa
  rationale: Neno hili hudokeza kubatilishwa au kuwekwa kando kwa jambo lenye nguvu ya kisheria. ‘Inaondolewa’ ni Kiswahili cha kawaida kinachohifadhi wazo la kutotumika tena katika mpangilio huu.
- source_word: μὲν γὰρ
  choice: Kwa maana, kwa upande mmoja
  rationale: γάρ hutoa sababu au ufafanuzi, huku μέν ikitazamia upande wa pili katika mstari unaofuata. Kauli hii inahifadhi uhusiano huo wa hoja.
- source_word: γίνεται
  choice: inaondolewa
  rationale: Katika muundo huu γίνομαι huonyesha kwamba tendo la kuondolewa linatokea; Kiswahili huunganisha kwa kawaida kitenzi hiki na nomino ἀθέτησις kuwa kauli ya kitendo.
- source_word: προαγούσης ἐντολῆς
  choice: amri iliyotangulia
  rationale: προαγούσης humaanisha iliyokwenda mbele au iliyotangulia. Tafsiri hii huhifadhi kipaumbele cha wakati bila kuongeza zaidi ya muktadha.
- source_word: διὰ τὸ αὐτῆς ἀσθενὲς καὶ ἀνωφελές
  choice: kwa sababu ya udhaifu wake na kutofaa kwake
  rationale: Muundo huu unatoa sababu ya kuondolewa kwa amri. ‘Udhaifu’ huhifadhi ἀσθενές, na ‘kutofaa’ huonyesha ἀνωφελές kwa lugha ya sasa bila kuficha ukali wa tathmini.
- source_word: ἀσθενές
  choice: udhaifu
  rationale: Hueleza kutokuwa na nguvu au uwezo wa kutimiza kusudi linalozungumziwa.
- source_word: ἀνωφελές
  choice: kutofaa
  rationale: Hueleza kutokuwa na manufaa au ufanisi kwa kusudi husika; ‘kutofaa’ ni ya asili na yenye hadhi katika Kiswahili cha kisasa.
theological_decisions:
- issue: Upeo wa ukosoaji wa ‘amri iliyotangulia’
  choice: Maneno makali ya udhaifu na kutofaa yanahifadhiwa, huku tanbihi ikionyesha kwamba muktadha unahusu uwezo wa kuleta ukamilifu unaozungumziwa.
  alternative: Kudai kwamba sheria yote ya Musa haina thamani kabisa, au kulainisha mstari kiasi cha kuondoa tathmini yake hasi.
  rationale: Waebrania 7:11 na 7:19 huzungumzia ukuhani na kutoweza kuleta ukamilifu. Tafsiri haipanui wala kupunguza dai la mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Kwa upande mmoja’ huhifadhi μέν na kutazamia tofauti ya mstari wa 19. Alama zote za tanbihi zimewekwa baada ya kishazi kinachofafanuliwa.
