id: HEB.7.28
reference: Hebrews 7:28
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὁ νόμος γὰρ ἀνθρώπους καθίστησιν ἀρχιερεῖς ἔχοντας ἀσθένειαν, ὁ λόγος δὲ τῆς ὁρκωμοσίας τῆς μετὰ τὸν νόμον υἱόν, εἰς τὸν αἰῶνα τετελειωμένον.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/028.yaml
  text: For the law appoints men as high priests who have weakness[a], but the word of the oath, which came after the law[b], appoints a Son who has been perfected forever.
translation:
  language: sw
  text: Kwa maana sheria huwaweka wanaume kuwa makuhani wakuu wenye udhaifu; lakini neno la kiapo, lililokuja baada ya sheria, humweka Mwana[a] aliyefanywa mkamilifu milele[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki kina “Mwana” bila kibainishi. Hili linakazia utofauti kati ya “wanaume” na “Mwana,” huku muktadha ukionyesha kwamba anayerejelewa ni Yesu.
    reason: alternative_reading
  - marker: b
    text: Au, “aliyekamilishwa milele” au “aliyeletwa kwenye utimilifu milele.” Katika muktadha wa kikuhani, kitenzi hiki kinaweza pia kuwa na maana ya “aliyewekwa wakfu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: νόμος
  choice: sheria
  rationale: Katika muktadha huu neno hili linarejelea sheria ya Musa, hasa masharti yake kuhusu ukuhani; “sheria” ni tafsiri ya kawaida na ya wazi katika Kiswahili.
- source_word: καθίστησιν
  choice: huwaweka
  rationale: Kitenzi hiki kinaonyesha kuwaweka rasmi katika wadhifa. Hali ya mazoea ya “hu-” inafaa kwa mfumo wa sheria ulioweka mfululizo wa makuhani wakuu.
- source_word: ἀνθρώπους
  choice: wanaume
  rationale: Ingawa neno la Kigiriki linaweza kumaanisha wanadamu kwa upana, hapa linawarejelea kihistoria wanaume waliowekwa katika ukuhani mkuu wa Walawi na linatofautishwa na Mwana.
- source_word: ἀρχιερεῖς
  choice: makuhani wakuu
  rationale: Hii ndiyo istilahi ya kawaida ya Kiswahili kwa washika wadhifa wa ukuhani mkuu katika mfululizo wao.
- source_word: ἔχοντας ἀσθένειαν
  choice: nao wana udhaifu
  rationale: Inahifadhi nomino “udhaifu” na kuonyesha hali ya udhaifu wa kibinadamu, si ugonjwa wa mwili pekee.
- source_word: λόγος τῆς ὁρκωμοσίας
  choice: neno la kiapo
  rationale: “Neno” linahifadhi mtindo wa kibiblia na kuonyesha tamko la Mungu lililotolewa kwa kiapo.
- source_word: τῆς μετὰ τὸν νόμον
  choice: lililokuja baada ya sheria
  rationale: Inaeleza kwa Kiswahili cha kawaida kwamba tamko la kiapo lilitolewa baadaye kuliko sheria, jambo muhimu katika hoja ya Waebrania.
- source_word: υἱόν
  choice: Mwana
  rationale: Kiswahili hakina vibainishi vinavyolingana moja kwa moja na ‘a/the’. “Mwana” linadumisha utofauti wa sifa kati ya wanaume na Mwana na, kwa herufi kubwa, rejeo lake kwa Yesu katika muktadha.
- source_word: εἰς τὸν αἰῶνα
  choice: milele
  rationale: Ni tafsiri ya kawaida na ya asili ya usemi huu unaohusu ukuhani unaodumu.
- source_word: τετελειωμένον
  choice: ambaye amekamilishwa
  rationale: Inahifadhi hali timilifu ya utendwa ya kishiriki cha Kigiriki na wazo la kuletwa kwenye ukamilifu au utimilifu unaokusudiwa, bila kulifupisha kuwa kuwekwa wakfu pekee.
theological_decisions:
- issue: Kutafsiri υἱόν lisilo na kibainishi katika utofauti wake na ἀνθρώπους
  choice: Mwana
  alternative: Mwana huyo; mwana mmoja
  rationale: Kwa kuwa Kiswahili hakina vibainishi vya uhakika na kutokuwa na uhakika kama Kigiriki au Kiingereza, “Mwana” ndiyo tafsiri ya asili. Haiongezi uhakika ambao muundo wa Kigiriki haujasema wazi, huku muktadha na herufi kubwa vikionyesha kwamba anayerejelewa ni Yesu.
- issue: Maana ya τετελειωμένον katika teolojia ya ukuhani ya Waebrania
  choice: amekamilishwa milele
  alternative: amefanywa mkamilifu milele; ameletwa kwenye utimilifu milele; amewekwa wakfu milele
  rationale: “Amekamilishwa” linadumisha kwa makusudi wigo na mvutano wa neno la Waebrania—ukamilifu, kufikishwa kwenye kusudi, na uwezekano wa maana ya kikuhani—badala ya kuamua kwamba maana yake ni kuwekwa wakfu tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kibiblia lakini kinachoeleweka kwa wasomaji wa kawaida. Sentensi inadumisha utofauti wa hoja kati ya sheria na neno la kiapo, wanaume na Mwana, pamoja na udhaifu na ukamilisho wa kudumu.
