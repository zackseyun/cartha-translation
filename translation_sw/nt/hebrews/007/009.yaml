lexical_decisions:
- source_word: ὡς ἔπος εἰπεῖν
  choice: tunaweza kusema kwamba
  rationale: Ni usemi wa tahadhari unaolegeza dai linalofuata. Tafsiri hii ni ya kawaida katika Kiswahili cha sasa na inadumisha hali ya usemi wa kukadiria bila kuufanya kuwa dai la moja kwa moja kabisa.
- source_word: δι’ Ἀβραὰμ
  choice: kupitia Abrahamu
  rationale: διά pamoja na hali ya umilikishi huonyesha njia au uwakilishi; hapa Lawi anahesabiwa kuwa ameshiriki katika tendo la babu yake Abrahamu.
- source_word: καὶ Λευὶ
  choice: hata Lawi
  rationale: 'καί ina nguvu ya kusisitiza jambo la kushangaza: hoja inamhusisha hata Lawi mwenyewe.'
- source_word: ὁ δεκάτας λαμβάνων
  choice: ambaye hupokea zaka
  rationale: Kitenzi endelevu cha Kigiriki kinamtambulisha Lawi kwa jukumu la kawaida la ukuhani la kupokea zaka.
- source_word: δεκάτας
  choice: zaka
  rationale: ‘Zaka’ ni neno la kawaida na sahihi la Kiswahili kwa sehemu ya kumi inayotolewa katika muktadha huu.
- source_word: δεδεκάτωται
  choice: amelipa zaka
  rationale: Ingawa umbo la Kigiriki ni timilifu tendwa, maana katika hoja ni kwamba Lawi anahesabiwa kuwa alitoa zaka kupitia Abrahamu. Kiswahili ‘amelipa zaka’ huwasilisha maana hiyo kwa kawaida, huku tanbihi ikihifadhi umbo la ajabu la asili.
theological_decisions:
- issue: Ushiriki wa Lawi katika tendo la Abrahamu kwa uwakilishi
  choice: Lawi anaelezwa kuwa amelipa zaka kupitia Abrahamu, kwa tahadhari ya ‘tunaweza kusema kwamba.’
  alternative: Lawi alikuwamo kiuwakilishi ndani ya Abrahamu, au kauli hiyo ni ya kitamathali tu.
  rationale: Tafsiri inadumisha mantiki ya mwandishi kwamba tendo la Abrahamu linahusishwa na Lawi bila kufafanua kwa lazima utaratibu wa kidogma wa uhusiano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umewekwa wazi na wa kawaida, huku ‘hata Lawi’ ikidumisha msisitizo na tanbihi zikihifadhi tahadhari ya usemi pamoja na umbo tendwa la Kigiriki.
