  text: ὁ δὲ μὴ γενεαλογούμενος ἐξ αὐτῶν δεδεκάτωκεν ⸀Ἀβραάμ, καὶ τὸν ἔχοντα τὰς ἐπαγγελίας εὐλόγηκεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/006.yaml
  text: But the one who is not traced by genealogy from them has taken a tenth from Abraham and has blessed the one who had the promises[a][b].
translation:
  language: sw
  text: Lakini yule ambaye nasaba yake haifuatiliwi kutoka kwao amepokea sehemu ya kumi kutoka kwa Abrahamu[a], naye amembariki yule mwenye ahadi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “amechukua sehemu ya kumi kutoka kwa Abrahamu.” Kitenzi cha Kigiriki kinaweza kumaanisha kuchukua au kupokea sehemu ya kumi.
    reason: lexical_alternative
  - marker: b
    text: Au, “yule aliyekuwa na ahadi.” Kigiriki kina participio ya wakati wa sasa, lakini kauli ya wakati uliopita inaweza kutumiwa kumrejelea Abrahamu katika simulizi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ μὴ γενεαλογούμενος ἐξ αὐτῶν
  choice: Lakini yule ambaye nasaba yake haifuatiliwi kutoka kwao
  rationale: Kauli hii inahifadhi hali ya kutendwa ya participio na hoja ya muktadha kwamba Melkizedeki hahesabiwi katika ukoo wa Walawi, bila kudai kwamba hakuwa na nasaba yoyote.
- source_word: δεδεκάτωκεν Ἀβραάμ
  choice: amepokea sehemu ya kumi kutoka kwa Abrahamu
  rationale: Kitenzi cha Kigiriki kinaweza kumaanisha kuchukua au kupokea sehemu ya kumi. ‘Amepokea’ ni ya kawaida katika Kiswahili na inaonyesha wazi kwamba Abrahamu ndiye aliyetoa; wakati timilifu unaendelezwa kwa ‘ame-’.
- source_word: τὸν ἔχοντα τὰς ἐπαγγελίας
  choice: yule mwenye ahadi
  rationale: ‘Mwenye’ huakisi participio ya wakati wa sasa bila kulazimisha tofauti ya wakati isiyo ya lazima katika Kiswahili; wingi wa ‘ahadi’ umehifadhiwa.
- source_word: εὐλόγηκεν
  choice: amembariki
  rationale: Muundo wa ‘ame-’ unawasilisha tendo lililokamilika lenye umuhimu unaoendelea katika hoja ya mwandishi.
- source_word: Ἀβραάμ
  choice: Abrahamu
  rationale: Hili ndilo umbo la kawaida la jina hili katika matumizi ya Biblia ya Kiswahili.
theological_decisions:
- issue: Tofauti ya kinasaba kuhusiana na ukuhani wa Walawi
  choice: Kauli inaonyesha kwamba nasaba ya Melkizedeki haifuatiliwi kutoka kwao, yaani katika mstari wa Walawi.
  alternative: Kauli inaweza kutafsiriwa kwa upana zaidi kuwa Melkizedeki hakutokana nao.
  rationale: Muktadha unahusu uhalali wa ukuhani usiotegemea nasaba ya Walawi. Tafsiri haifanyi madai ya kimetafizikia kuhusu asili au hali ya Melkizedeki.
- issue: Hali ya Abrahamu kuwa mwenye ahadi
  choice: yule mwenye ahadi
  alternative: yule aliyekuwa na ahadi
  rationale: Participio ya Kigiriki iko katika wakati wa sasa. Kiswahili ‘mwenye’ huhifadhi hali hiyo kwa kawaida na hakitatui kimakusudi uhusiano wa wakati.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Sehemu ya kumi’ imechaguliwa badala ya istilahi fupi ya kidini ili maana iwe wazi kwa msomaji wa kawaida; ‘nasaba yake haifuatiliwi’ huhifadhi msisitizo wa kinasaba na wa kisheria wa muktadha.
