  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Οὗτος γὰρ ὁ Μελχισέδεκ, βασιλεὺς Σαλήμ, ἱερεὺς τοῦ θεοῦ τοῦ ὑψίστου, ⸀ὁ συναντήσας Ἀβραὰμ ὑποστρέφοντι ἀπὸ τῆς κοπῆς τῶν βασιλέων καὶ εὐλογήσας αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/001.yaml
  text: For this Melchizedek[a], king of Salem, priest of God Most High, met Abraham as he was returning from the slaughter of the kings and blessed him[b],
translation:
  language: sw
  text: Kwa maana Melkizedeki huyu, mfalme wa Salemu, kuhani wa Mungu Aliye Juu Sana, alikutana na Abrahamu alipokuwa akirudi kutoka katika mauaji ya wafalme[a], akambariki,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “baada ya kuwashinda wafalme.” Kigiriki kwa maana ya karibu zaidi husema, “kutoka katika mauaji ya wafalme.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὗτος γὰρ ὁ Μελχισέδεκ
  choice: Kwa maana Melkizedeki huyu
  rationale: “Kwa maana” inadumisha uhusiano wa maelezo unaoletwa na γάρ, na kuweka “huyu” baada ya jina ni mpangilio wa kawaida wa Kiswahili unaohifadhi msisitizo wa Οὗτος.
- source_word: βασιλεὺς Σαλήμ
  choice: mfalme wa Salemu
  rationale: Hili ni tafsiri ya moja kwa moja ya cheo na unukuzi wa jina la mahali unaotambulika katika mapokeo ya Biblia ya Kiswahili.
- source_word: ἱερεὺς τοῦ θεοῦ τοῦ ὑψίστου
  choice: kuhani wa Mungu Aliye Juu Sana
  rationale: Maneno haya yanahifadhi “Mungu” pamoja na cheo chake cha kimungu, huku yakisomeka kwa kawaida na kwa heshima katika Kiswahili.
- source_word: ὁ συναντήσας Ἀβραὰμ
  choice: alikutana na Abrahamu
  rationale: Kirai shirikishi cha Kigiriki kimewekwa kama kitenzi kamili ili sentensi iwe wazi na ya kawaida katika Kiswahili bila kubadili mhusika au tendo.
- source_word: ὑποστρέφοντι
  choice: alipokuwa akirudi
  rationale: Muundo huu unaonyesha kwamba kurudi kwa Abrahamu kulikuwa kunaendelea wakati Melkizedeki alipokutana naye.
- source_word: ἀπὸ τῆς κοπῆς τῶν βασιλέων
  choice: baada ya kuwaua wafalme
  rationale: κοπή lina maana halisi ya kukata chini au kuua katika mapigano. Muundo wa kitenzi unaepusha utata wa Kiswahili ambao ungeweza kupatikana katika “mauaji ya wafalme.”
- source_word: καὶ εὐλογήσας αὐτόν
  choice: akambariki
  rationale: Kitenzi hiki kinaonyesha tendo la pili la Melkizedeki kwa Abrahamu; kiambishi “-m-” kinamtaja Abrahamu kwa kawaida katika Kiswahili.
theological_decisions:
- issue: Tafsiri ya cheo cha kimungu τοῦ θεοῦ τοῦ ὑψίστου
  choice: Mungu Aliye Juu Sana
  alternative: Mungu Mkuu Zaidi
  rationale: “Aliye Juu Sana” huhifadhi picha ya ύψιστος kama cheo cha Mungu na huepuka kuifanya kuwa ulinganisho wa kawaida tu.
- issue: Nguvu ya kijeshi ya κοπή
  choice: kuwaua wafalme
  alternative: kuwashinda wafalme
  rationale: Chaguo kuu linahifadhi nguvu halisi ya neno la Kigiriki, huku tanbihi ikitoa tafsiri pana inayowezekana katika muktadha wa ushindi wa kijeshi bila kuficha mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Majina “Melkizedeki,” “Salemu,” na “Abrahamu” yanafuata maumbo yanayotambulika kwa wasomaji wa Biblia ya Kiswahili. Koma ya mwisho imehifadhiwa kwa sababu sentensi na hoja vinaendelea katika mstari unaofuata.
