lexical_decisions:
- source_word: Καὶ
  choice: Na
  rationale: Kiunganishi hiki kinaendeleza hoja kutoka mstari uliotangulia na kimehifadhiwa wazi.
- source_word: καθ’ ὅσον
  choice: kwa kuwa
  rationale: Katika muktadha huu, kirai hiki kinaanzisha msingi wa hoja. ‘Kwa kuwa’ ni Kiswahili cha kawaida na chenye hadhi, bila kufanya sentensi kuwa nzito isivyo lazima.
- source_word: οὐ χωρὶς ὁρκωμοσίας
  choice: halikufanyika bila kiapo
  rationale: Maana halisi ya χωρίς pamoja na jenitivi ni ‘bila,’ na ὁρκωμοσία ni tendo au uthibitisho wa kiapo. Kitenzi ‘halikufanyika’ kimeongezwa kwa ulaini wa Kiswahili huku ‘hili’ likirejelea kuwekwa kwa ukuhani kunakoelezwa katika muktadha.
- source_word: οἱ μὲν γὰρ
  choice: kwa maana wale
  rationale: γάρ imetafsiriwa kwa nguvu yake ya kutoa maelezo, huku μέν ikiacha wazi ulinganisho unaokamilishwa katika mstari unaofuata. ‘Wale’ hurejelea makuhani waliotangulia bila kuwataja kwa maelezo ya ziada.
- source_word: χωρὶς ὁρκωμοσίας
  choice: bila kiapo
  rationale: Kirai kilichorudiwa kimetafsiriwa kwa namna ileile ndani ya mstari.
- source_word: εἰσὶν ἱερεῖς γεγονότες
  choice: walikuwa makuhani
  rationale: Muundo huu unaonyesha hali iliyotokana na wao kuingia katika ukuhani. Kiswahili hiki ni cha asili katika muktadha, ingawa tafsiri ya karibu zaidi ‘walifanywa makuhani’ pia inawezekana.
theological_decisions:
- issue: Kirejeleo cha ulinganisho kati ya makuhani wa awali na kuhani aliyewekwa kwa kiapo
  choice: Mstari unaonyesha kuwa ukuhani unaozungumziwa kuhusu Yesu haukuwa bila kiapo, tofauti na makuhani waliotangulia ambao walikuwa makuhani bila kiapo.
  alternative: Kuufafanua moja kwa moja kuwa ulinganisho mpana kati ya ukuhani wote wa agano la kale na ukuhani wa milele wa Masihi.
  rationale: Muktadha wa Waebrania 7 na Zaburi 110:4 unaweka ulinganisho huo, lakini mstari huu umeachwa utoe dai lake lenyewe bila kuongezewa hitimisho la kiteolojia lisilotamkwa hapa.
