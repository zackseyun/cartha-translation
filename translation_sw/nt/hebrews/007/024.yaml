  text: ὁ δὲ διὰ τὸ μένειν αὐτὸν εἰς τὸν αἰῶνα ἀπαράβατον ἔχει τὴν ἱερωσύνην·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/024.yaml
  text: But he[a], because he remains forever, holds the priesthood permanently.
translation:
  language: sw
  text: Lakini yeye, kwa sababu anaendelea kuishi milele, ana ukuhani wa kudumu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ukuhani usiobadilika,” au, “ukuhani usiohamishiwa kwa mwingine.” Neno la Kigiriki linaweza kuwa na maana yoyote kati ya hizo. Katika muktadha, hoja ni kwamba kwa kuwa Yesu anaishi milele, ukuhani wake haupiti kwa mwingine.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: Lakini yeye
  rationale: Kifungu hiki kinamtaja Yesu kwa kulinganisha na makuhani wengi waliotangulia katika mstari uliopita. “Lakini” linaonyesha tofauti hiyo kwa lugha ya kawaida.
- source_word: διὰ τὸ μένειν αὐτὸν
  choice: kwa sababu anaendelea kuishi
  rationale: διά pamoja na kitenzi-jina chenye kibainishi huonyesha sababu. Katika muktadha, μένω humaanisha kuendelea kuwapo au kuishi, kinyume na makuhani waliokufa.
- source_word: εἰς τὸν αἰῶνα
  choice: milele
  rationale: Huu ni usemi wa muda usio na mwisho; “milele” ni tafsiri ya kawaida na wazi katika Kiswahili.
- source_word: ἀπαράβατον
  choice: wa kudumu
  rationale: Neno hili linaweza kueleza ukuhani usiobadilika au usiohamishwa kwa mwingine. “Wa kudumu” linafikisha hoja ya muktadha kwamba ukuhani wa Yesu haukomi wala kupokelewa na mrithi kwa sababu yeye huishi milele, bila kufunga maana katika fasiri moja tu.
- source_word: ἔχει τὴν ἱερωσύνην
  choice: ana ukuhani
  rationale: ἔχω hapa huonyesha kuwa na au kushikilia cheo cha ukuhani. “Ana ukuhani” ni Kiswahili cha asili na cha moja kwa moja.
- source_word: ἱερωσύνην
  choice: ukuhani
  rationale: Nomino hii humaanisha cheo au huduma ya kuhani; “ukuhani” ndilo neno sanifu na linaloeleweka katika muktadha huu.
theological_decisions:
- issue: Maana ya ἀπαράβατον kuhusu ukuhani wa Yesu
  choice: ukuhani wa kudumu
  alternative: ukuhani usiobadilika; ukuhani usiohamishiwa kwa mwingine
  rationale: Muktadha unalinganisha Yesu anayeishi milele na makuhani waliokufa na kufuatwa na wengine. Tafsiri kuu inasisitiza udumu wa ukuhani wake, huku tanbihi ikihifadhi uwezekano halisi wa maana ya kutobadilika au kutohamishwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Anaendelea kuishi milele” huweka wazi tofauti ya kimuktadha na makuhani wanaokufa; “ukuhani wa kudumu” ni wa kawaida kwa msomaji huku tanbihi ikihifadhi utata wa neno la Kigiriki.
