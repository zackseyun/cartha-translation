lexical_decisions:
- source_word: ἔτι
  choice: bado
  rationale: Inaonyesha kwamba hali hiyo iliendelea kuwapo wakati wa kukutana huku.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Inaendeleza maelezo yanayounga mkono hoja ya mstari uliotangulia.
- source_word: ἐν τῇ ὀσφύϊ
  choice: katika kiuno
  rationale: Inahifadhi taswira halisi ya Kigiriki inayotumiwa kama nahau ya ukoo na asili ya uzazi.
- source_word: τοῦ πατρὸς
  choice: cha baba yake
  rationale: Inahifadhi muundo wa Kigiriki bila kuongeza jina Abrahamu; katika muktadha, ‘baba’ humaanisha babu wa ukoo.
- source_word: ἦν
  choice: alikuwa
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kitenzi cha kuwapo katika wakati uliopita.
- source_word: ὅτε
  choice: wakati
  rationale: Inaonyesha kwa kawaida muda ambapo tukio la kukutana lilitokea.
- source_word: συνήντησεν
  choice: alipokutana
  rationale: Hutoa maana ya kukutana kwa ufupi na kwa Kiswahili cha kawaida.
- source_word: αὐτῷ
  choice: naye
  rationale: Inahifadhi kiwakilishi cha Kigiriki; muktadha unaonyesha kuwa kinamrejelea Abrahamu.
- source_word: Μελχισέδεκ
  choice: Melkizedeki
  rationale: Ni umbo la jina linalotambulika katika matumizi ya Biblia ya Kiswahili.
theological_decisions:
- issue: Uwakilishi wa kinahau wa ukoo wa Lawi kutoka kwa Abrahamu
  choice: Kuhifadhi taswira ‘katika kiuno cha baba yake’ katika matini kuu
  alternative: alikuwa bado katika mwili wa babu yake
  rationale: Hoja humhesabu Lawi kuwa ndani ya Abrahamu kwa maana ya ukoo na asili ya uzazi. Kuhifadhi taswira huacha mantiki ya mwandishi ionekane bila kuingiza ufafanuzi wa kiteolojia katika matini.
- issue: Utambulisho wa ‘baba yake’
  choice: Kutafsiri ‘baba yake’ bila kutaja Abrahamu waziwazi
  alternative: babu yake Abrahamu
  rationale: Ingawa anayerejelewa ni Abrahamu, Kigiriki hakitaji jina lake hapa. Muktadha unatosha kumtambulisha.
