  text: Τοιοῦτος γὰρ ἡμῖν ⸀καὶ ἔπρεπεν ἀρχιερεύς, ὅσιος, ἄκακος, ἀμίαντος, κεχωρισμένος ἀπὸ τῶν ἁμαρτωλῶν, καὶ ὑψηλότερος τῶν οὐρανῶν γενόμενος·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/026.yaml
  text: 'For such a high priest was indeed fitting for us: holy[a], innocent, undefiled, separated from sinners[b], and having become higher than the heavens.'
translation:
  language: sw
  text: 'Kwa maana, kwa kweli, ilikuwa inafaa kwetu kuwa na kuhani mkuu wa namna hii: mtakatifu, asiye na hatia, asiye na unajisi, aliyetengwa na wenye dhambi,[a] na ambaye amekuwa juu kuliko mbingu.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliyewekwa kando na wenye dhambi.” Kauli hii inaonyesha usafi wake wa kiadili na hadhi yake iliyotukuzwa kama kuhani mkuu.
    reason: lexical_alternative
  - marker: b
    text: Au, “ametukuzwa juu ya mbingu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοιοῦτος
  choice: wa namna hii
  rationale: Inaelekeza nyuma kwa aina ya kuhani mkuu aliyeelezwa katika hoja iliyotangulia, huku ikisikika kwa kawaida katika Kiswahili.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Inahifadhi uhusiano wa ufafanuzi na hoja iliyotangulia.
- source_word: ἡμῖν καὶ ἔπρεπεν
  choice: alitufaa hasa
  rationale: Kitenzi kinaonyesha kufaa kwetu, na καί hapa inaeleweka kuwa ya kusisitiza; “hasa” inawasilisha msisitizo huo kwa Kiswahili cha kawaida.
- source_word: ἀρχιερεύς
  choice: kuhani mkuu
  rationale: Hili ndilo neno la kawaida na sahihi kwa cheo hiki cha kikuhani katika Waebrania.
- source_word: ὅσιος
  choice: mtakatifu
  rationale: Linaonyesha utakatifu na uadilifu unaofaa kwa kuhani mkuu.
- source_word: ἄκακος
  choice: asiye na hatia
  rationale: Linaeleza kutokuwa na uovu au kosa la kiadili bila kudokeza tu kutodhuru wengine.
- source_word: ἀμίαντος
  choice: asiye na unajisi
  rationale: Linahifadhi taswira ya usafi wa kiadili na wa kikuhani iliyomo katika neno la Kigiriki.
- source_word: κεχωρισμένος ἀπὸ τῶν ἁμαρτωλῶν
  choice: aliyetengwa na wenye dhambi
  rationale: Muundo wa wakati timilifu unaonyesha hali iliyoendelea ya kutengwa; tafsiri hii haifuti uwezekano wa maana ya tofauti ya kiadili na hadhi iliyotukuzwa.
- source_word: ὑψηλότερος τῶν οὐρανῶν
  choice: juu kuliko mbingu
  rationale: Inahifadhi moja kwa moja umbo la ulinganisho la Kigiriki badala ya kulibadili kuwa kauli ya kutukuzwa.
- source_word: γενόμενος
  choice: amekuwa
  rationale: Inaonyesha kuingia katika hali ya kutukuzwa kama matokeo, bila kuongeza wazi mtendaji ambaye Kigiriki hakumtaji.
theological_decisions:
- issue: Uhusiano wa Yesu na wenye dhambi katika kauli “aliyetengwa na wenye dhambi”
  choice: Kauli imeachwa kuwa “aliyetengwa na wenye dhambi,” ikisisitiza usafi na hadhi yake bila kufafanua kupita kiasi aina ya kutengwa.
  alternative: “Aliyewekwa kando na wenye dhambi,” au kuifanya iwe kauli ya kutengwa kwa mahali tu.
  rationale: Muktadha unaunganisha usafi wa kikuhani na kutukuzwa. Tafsiri ya moja kwa moja huhifadhi mvutano wa maana bila kukana kwamba Yesu alishirikiana na wenye dhambi wakati wa huduma yake duniani.
- issue: Nguvu ya γενόμενος pamoja na “juu kuliko mbingu”
  choice: “naye amekuwa juu kuliko mbingu”
  alternative: “naye ametukuzwa juu ya mbingu” au “aliye juu kuliko mbingu.”
  rationale: “Amekuwa” inahifadhi mwendo wa kihistoria kuelekea hali ya kutukuzwa bila kuongeza kauli ya kutendwa wala kudokeza mabadiliko katika asili yake ya kimungu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Maneno ya kikuhani na ya usafi yamehifadhiwa bila kuwa ya kizamani kupita kiasi. Alama za tanbihi zimewekwa baada ya vifungu vinavyohusika, kwa kuwa mpangilio wa alama katika safu ya ushauri ya Kiingereza haukulingana na yaliyomo katika tanbihi.
