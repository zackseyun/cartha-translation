base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/007.yaml
  text: Beyond all dispute[a], the lesser is blessed by the greater.
translation:
  language: sw
  text: Bila ubishi wowote[a], aliye mdogo hubarikiwa na aliye mkubwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Pasipo ubishi wowote” au “bila pingamizi lolote.”
    reason: lexical_alternative
lexical_decisions:
- source_word: χωρὶς δὲ πάσης ἀντιλογίας
  choice: Bila ubishi wowote
  rationale: Kirai hiki kinaonyesha kwamba hoja inayofuata haipingiki. “Bila ubishi wowote” ni Kiswahili cha kawaida na chenye hadhi kinachohifadhi maana ya “pasipo/bila upinzani wowote.” δέ ina nguvu ndogo ya kuendeleza hoja, hivyo haihitaji kiunganishi tofauti hapa.
- source_word: τὸ ἔλαττον
  choice: aliye mdogo
  rationale: Kivumishi hiki cha kulinganisha kimetumika kama nomino kwa maana ya mtu aliye chini kwa hadhi. “Aliye mdogo” huhifadhi ulinganisho bila kudokeza udogo wa umri au ubaya wa kimaadili.
- source_word: ὑπὸ τοῦ κρείττονος
  choice: na aliye mkuu
  rationale: ὑπό pamoja na umilikishi huonyesha mtendaji wa tendo katika sentensi tendwa. “Aliye mkuu” hueleza hadhi ya juu kwa njia ya asili katika Kiswahili.
- source_word: εὐλογεῖται
  choice: hubarikiwa
  rationale: 'Wakati uliopo wa hali ya kutendwa unaeleza kanuni ya jumla: mtu huyo hupokea baraka. “Hubarikiwa” ni tafsiri ya moja kwa moja na inayofaa muktadha wa Melkizedeki kumbariki Abrahamu.'
theological_decisions:
- issue: Asili ya ulinganisho kati ya aliye mdogo na aliye mkuu
  choice: 'Mstari unasema kanuni ya jumla ya hadhi: aliye chini kwa hadhi hubarikiwa na aliye juu kwa hadhi.'
  alternative: Ni desturi ya kijamii tu isiyo na uzito wa kiteolojia.
  rationale: Katika Waebrania 7, kanuni hii inaunga mkono hoja kwamba Melkizedeki ni mkuu kuliko Abrahamu. Tafsiri inahifadhi lugha ya kulinganisha hadhi bila kuongeza ufafanuzi usiomo katika maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa “aliye mdogo ... aliye mkuu” unadumisha ulinganisho wa watu na sauti ya kanuni ya jumla.
