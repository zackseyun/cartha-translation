  text: And it is even more evident[a], if another priest arises according to the likeness of Melchizedek[b],
translation:
  language: sw
  text: Na jambo hili ni wazi hata zaidi ikiwa kuhani mwingine[a] anatokea kwa mfano wa Melkizedeki[b],
  philosophy: optimal-equivalence
  footnotes:
