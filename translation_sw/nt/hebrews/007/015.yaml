lexical_decisions:
- source_word: περισσότερον ἔτι
  choice: hata zaidi
  rationale: Kirai hiki kinaongeza nguvu ya dai lililotangulia; “hata zaidi” ni Kiswahili cha kawaida kinachohifadhi ongezeko hilo.
- source_word: κατάδηλόν
  choice: ni dhahiri
  rationale: Neno hili humaanisha jambo lililo wazi au dhahiri; “ni dhahiri” linaakisi moja kwa moja ἐστιν na halirudii isivyohitajika nguvu iliyomo katika περισσότερον ἔτι.
- source_word: εἰ
  choice: ikiwa
  rationale: Ingawa katika hoja hii linaweza kukaribia maana ya “kwa kuwa,” εἰ ni kiunganishi cha sharti; “ikiwa” kinahifadhi muundo na utata huo.
- source_word: κατὰ τὴν ὁμοιότητα
  choice: kwa mfano wa
  rationale: Usemi huu unaonyesha kufanana au kuambatana na kielelezo fulani, huku ukihifadhi mwangwi wa Zaburi 110:4 na hoja ya sura hii.
- source_word: Μελχισέδεκ
  choice: Melkizedeki
  rationale: Hili ndilo umbo la jina hili lililozoeleka katika Kiswahili cha Biblia.
- source_word: ἀνίσταται
  choice: anatokea
  rationale: Katika muktadha huu kitenzi kinaonyesha kujitokeza kwa kuhani; “anatokea” ni cha asili na hakilazimishi maana ya kufufuliwa.
- source_word: ἱερεὺς ἕτερος
  choice: kuhani mwingine
  rationale: Tafsiri hii ni ya kawaida na inaacha muktadha uonyeshe kwamba kuhani huyo ni tofauti na ukuhani wa Walawi.
theological_decisions:
- issue: Maana ya ἕτερος kuhusiana na ukuhani
  choice: kuhani mwingine
  alternative: kuhani wa aina tofauti
  rationale: ἕτερος linaweza kusisitiza utofauti, lakini “kuhani mwingine” ni la asili na halizidishi tofauti hiyo katika matini kuu; uwezekano wa msisitizo huo umeelezwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio “anatokea kuhani mwingine” umehifadhiwa ili kutanguliza tendo la kujitokeza kama katika Kigiriki, bila kufanya sentensi kuwa ngumu. Koma ya mwisho inaonyesha kuwa sentensi na hoja zinaendelea katika mstari unaofuata.
