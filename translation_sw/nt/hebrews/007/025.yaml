  text: ὅθεν καὶ σῴζειν εἰς τὸ παντελὲς δύναται τοὺς προσερχομένους δι’ αὐτοῦ τῷ θεῷ, πάντοτε ζῶν εἰς τὸ ἐντυγχάνειν ὑπὲρ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/025.yaml
  text: Therefore he is also able to save completely those who draw near to God through him[a], since he always lives to intercede for them.
translation:
  language: sw
  text: Kwa hiyo, anaweza pia kuwaokoa kikamilifu[a] wale wanaomkaribia Mungu kupitia yeye, kwa sababu anaishi daima ili kuwaombea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuwaokoa milele”; kijadi, “kuwaokoa kwa ukamilifu wote.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅθεν
  choice: Kwa hiyo
  rationale: Inaonyesha hitimisho linalotokana na hoja iliyotangulia kuhusu ukuhani wa Yesu unaodumu.
- source_word: καὶ
  choice: pia
  rationale: Inahifadhi maana ya nyongeza inayounganisha uwezo wake wa kuokoa na ukuhani wake wa kudumu.
- source_word: σῴζειν
  choice: kuwaokoa
  rationale: Ni tafsiri ya kawaida na yenye uzito unaofaa katika muktadha wa wokovu.
- source_word: εἰς τὸ παντελές
  choice: kikamilifu
  rationale: Inaonyesha ukamilifu wa wokovu bila kufungia kirai hiki katika maana ya wakati pekee; maana ya kudumu imehifadhiwa katika tanbihi.
- source_word: δύναται
  choice: anaweza
  rationale: Inaeleza uwezo wake unaotokana na ukuhani wake wa kudumu kwa lugha ya kawaida ya Kiswahili.
- source_word: τοὺς προσερχομένους
  choice: wale wanaomkaribia
  rationale: Kumkaribia Mungu huhifadhi maana ya kufikia uwepo wake na ya ibada inayojirudia katika Waebrania.
- source_word: δι’ αὐτοῦ
  choice: kupitia yeye
  rationale: 'Inaonyesha wazi upatanishi wake: watu humkaribia Mungu kwa njia yake.'
- source_word: τῷ θεῷ
  choice: Mungu
  rationale: Pamoja na kitenzi 'wanaomkaribia,' muundo huu ni wa asili na sahihi katika Kiswahili.
- source_word: πάντοτε ζῶν
  choice: kwa sababu anaishi daima
  rationale: Inafanya wazi kuwa kuishi kwake daima ndio msingi wa uwezo wake wa kuokoa, huku ikihifadhi hali ya kuendelea.
- source_word: εἰς τὸ ἐντυγχάνειν
  choice: ili kuwaombea
  rationale: Inaonyesha kusudi la kuishi kwake daima na wazo la kuwasilisha maombi kwa niaba yao.
- source_word: ὑπὲρ αὐτῶν
  choice: kuwaombea
  rationale: Kiambishi cha watendewa '-wa-' katika 'kuwaombea' kinaonyesha kwamba anafanya hivyo kwa ajili yao.
theological_decisions:
- issue: Upeo wa maana ya εἰς τὸ παντελές
  choice: kikamilifu
  alternative: milele; kabisa kabisa
  rationale: Kirai kinaweza kueleza ukamilifu au kudumu kwa wakati wote. Muktadha unaunga mkono vipengele vyote viwili kwa kutaja kuishi kwake daima; kwa hiyo maandishi makuu yanatumia 'kikamilifu,' na tanbihi inahifadhi maana mbadala ya wakati bila kuondoa mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo 'wanaomkaribia Mungu' huhifadhi msamiati muhimu wa kumkaribia Mungu katika Waebrania; 'kuwaombea' ni wa asili kuliko istilahi nzito zaidi ya kidini, huku ukihifadhi maana ya upatanishi.
