  text: ἐφ’ ὃν γὰρ λέγεται ταῦτα φυλῆς ἑτέρας μετέσχηκεν, ἀφ’ ἧς οὐδεὶς προσέσχηκεν τῷ θυσιαστηρίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/013.yaml
  text: For the one about whom these things are said belongs to another tribe[b][a], from which no one has served at the altar.
translation:
  language: sw
  text: Kwa maana yule ambaye mambo haya yanasemwa juu yake ni wa kabila jingine,[a] ambalo hakuna mtu hata mmoja kutoka kwalo aliyewahi kuhudumu madhabahuni.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ameshiriki katika kabila jingine,” au “ametoka katika kabila jingine.” Kitenzi cha Kigiriki kinaweza kumaanisha kushiriki au kuwa na uhusiano na kitu; hapa kinahusu kuwa wa kabila fulani.
    reason: lexical_alternative
  - marker: b
    text: Au, “aliyehudumu kwenye madhabahu.” Usemi huu unamaanisha kutekeleza huduma inayohusiana na madhabahu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφ’ ὃν
  choice: ambaye mambo haya yanasemwa kumhusu
  rationale: Muundo huu unaonyesha kwamba maneno hayo yanamhusu mtu fulani, bila kuongeza ufafanuzi usiokuwamo katika Kigiriki.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Inaendeleza hoja kwa kutoa msingi wa maelezo yaliyotangulia.
- source_word: λέγεται ταῦτα
  choice: mambo haya yanasemwa
  rationale: Inahifadhi hali ya kutendwa na wingi wa ταῦτα kwa Kiswahili cha kawaida.
- source_word: φυλῆς ἑτέρας
  choice: kabila jingine
  rationale: Katika muktadha huu φυλή ni mojawapo ya makabila ya Israeli, na ἑτέρας linaonyesha kabila tofauti na lile la kikuhani lililokuwa likizungumziwa.
- source_word: μετέσχηκεν
  choice: ni wa
  rationale: Ni njia ya kawaida ya Kiswahili ya kueleza uhusiano thabiti wa mtu na kabila. Haidokezi kwamba alibadili kabila, wala hailazimishi maana ya ukoo zaidi ya maneno ya Kigiriki.
- source_word: ἀφ’ ἧς
  choice: ambalo
  rationale: Kiwakilishi kinarejelea ‘kabila’; katika Kiswahili uhusiano wa kutoka katika kabila hilo unaeleweka kwa kawaida ndani ya kishazi kinachofuata.
- source_word: οὐδεὶς
  choice: hakuna mtu hata mmoja
  rationale: Inatoa kwa wazi msisitizo wa kwamba hakuna yeyote.
- source_word: προσέσχηκεν τῷ θυσιαστηρίῳ
  choice: aliyewahi kuhudumu madhabahuni
  rationale: Katika muktadha wa ibada, kitenzi kinaonyesha kushughulika au kutumikia kwenye madhabahu. ‘Kuhudumu madhabahuni’ ni Kiswahili cha kawaida kisichobainisha kupita kiasi tendo maalumu la kikuhani.
- source_word: θυσιαστηρίῳ
  choice: madhabahuni
  rationale: Hili ni neno la kawaida la Kiswahili kwa mahali pa kutoa dhabihu; hali ya mahali inafaa na kitenzi ‘kuhudumu.’
theological_decisions:
- issue: Uhusiano wa Yesu na kabila lisilo la Lawi katika hoja kuhusu ukuhani
  choice: Kutafsiri μετέσχηκεν kwa ‘ni wa kabila jingine,’
  alternative: ‘ametoka katika kabila jingine’ au ‘ameshiriki katika kabila jingine’
  rationale: Tafsiri hii inaonyesha uhusiano wa kikabila unaohitajika na hoja, lakini haisemi moja kwa moja ‘amezaliwa katika’ au ‘ametokana na,’ jambo ambalo lingefanya maana ya nasaba iwe wazi zaidi kuliko ilivyo katika kitenzi cha Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Yule ambaye’ na ‘Kwa maana’ vinaendeleza mtiririko wa hoja, huku ‘kuhudumu madhabahuni’ kikitoa maana ya kiibada kwa lugha inayoeleweka kwa wasomaji wa kawaida.
