base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/022.yaml
  text: By so much[a], Jesus has become the guarantor of a better covenant.
translation:
  language: sw
  text: Kwa kadiri hiyo, Yesu amekuwa mdhamini wa agano[a] bora zaidi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wosia.” Neno la Kigiriki linaweza kumaanisha “agano” au, katika baadhi ya miktadha, “wosia”; hapa “agano” linafaa zaidi kwa sababu ya hoja kuhusu ukuhani na kiapo.
    reason: alternative_reading
lexical_decisions:
- source_word: κατὰ τοσοῦτο
  choice: Kwa kadiri hiyo
  rationale: Nahau hii huonyesha kiwango au kiasi cha ulinganisho. Tafsiri hii inadumisha uhusiano na hoja iliyotangulia na inaeleweka kwa Kiswahili cha kawaida.
- source_word: κρείττονος
  choice: bora zaidi
  rationale: Neno hili la kulinganisha ni muhimu katika Waebrania. “Bora zaidi” linaonyesha wazi ubora wa agano hili likilinganishwa na mpangilio uliotangulia.
- source_word: διαθήκης
  choice: agano
  rationale: Ingawa neno la Kigiriki linaweza kumaanisha pia wosia katika baadhi ya miktadha, hapa hoja kuhusu ukuhani na kiapo inaelekeza kwenye agano.
- source_word: γέγονεν
  choice: amekuwa
  rationale: Kauli timilifu ya Kigiriki inaonyesha jambo lililotokea ambalo matokeo yake yanaendelea; “amekuwa” inadumisha maana hiyo.
- source_word: ἔγγυος
  choice: mdhamini
  rationale: Neno hili humaanisha mtu anayetoa dhamana au kusimama kama hakikisho la wajibu fulani. “Mdhamini” ni sahihi na linaeleweka katika Kiswahili cha sasa.
- source_word: Ἰησοῦς
  choice: Yesu
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
theological_decisions:
- issue: Maana ya διαθήκη katika Waebrania 7:22
  choice: agano
  alternative: wosia
  rationale: Muktadha wa karibu unahusu ukuhani wa Yesu na kiapo cha Mungu, hivyo “agano” linafaa zaidi kuliko “wosia.” Tanbihi inahifadhi uwezekano wa maana nyingine ya neno hilo bila kuiingiza katika matini kuu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya sasa na yenye heshima. “Kwa kadiri hiyo” huhifadhi kipimo cha ulinganisho, na “mdhamini” huepuka lugha ya kizamani huku likibaki sahihi.
