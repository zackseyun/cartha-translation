base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/017.yaml
  text: 'For it is testified: “You are a priest forever according to the order of Melchizedek.”[a][b]'
translation:
  language: sw
  text: 'Kwa maana inashuhudiwa: “Wewe ni kuhani milele, kwa utaratibu wa Melkizedeki.”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa usemi wa jadi zaidi, “kwa mfano wa Melkizedeki.”
    reason: lexical_alternative
  - marker: b
    text: Dondoo kutoka Zaburi 110:4.
    reason: cross_reference
lexical_decisions:
- source_word: μαρτυρεῖται
  choice: imeshuhudiwa
  rationale: Kitenzi cha sasa katika hali ya kutendwa kimetumiwa bila kumtaja mtendaji; tafsiri hii inadumisha ushuhuda wa Maandiko bila kuongeza wazi kwamba Mungu au mwandishi ndiye anayesema.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Kiunganishi hiki kinatoa msingi wa kauli iliyotangulia; “Kwa maana” ni cha kawaida na wazi katika Kiswahili sanifu.
- source_word: ὅτι
  choice: ':'
  rationale: Neno hili linaanzisha yaliyomo katika ushuhuda. Nukta mbili zinaingiza dondoo la moja kwa moja kwa Kiswahili cha asili zaidi.
- source_word: Σὺ
  choice: Wewe
  rationale: Kiwakilishi cha nafsi ya pili umoja kimesisitizwa katika Kigiriki; “Wewe” kinadumisha mkazo na usemi wa moja kwa moja.
- source_word: ἱερεὺς
  choice: kuhani
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa priest; haliongezi cheo cha “kuhani mkuu,” ambacho hakipo katika mstari huu.
- source_word: εἰς τὸν αἰῶνα
  choice: milele
  rationale: Ni usemi wa muda usio na mwisho; “milele” ni tafsiri fupi, ya kawaida na yenye heshima.
- source_word: κατὰ τὴν τάξιν
  choice: kwa mfano wa
  rationale: Katika muktadha huu kifungu kinaonyesha ulinganifu na aina au mpangilio wa ukuhani wa Melkizedeki. “Kwa mfano wa” ni Kiswahili cha kawaida; “kwa utaratibu wa” limehifadhiwa katika tanbihi kama tafsiri ya karibu zaidi ya kimuundo.
- source_word: Μελχισέδεκ
  choice: Melkizedeki
  rationale: Jina limetoholewa kwa umbo lililozoeleka katika matumizi ya Biblia ya Kiswahili.
theological_decisions:
- issue: Cheo cha kikuhani katika dondoo la Zaburi
  choice: kuhani
  alternative: kuhani mkuu
  rationale: Kigiriki kinasema ἱερεύς, “kuhani,” si ἀρχιερεύς, “kuhani mkuu.” Kuongeza “mkuu” hapa kungeingiza ufafanuzi wa kiteolojia unaojengwa kwingine katika Waebrania lakini hauko katika mstari huu.
- issue: Maana ya κατὰ τὴν τάξιν kuhusiana na Melkizedeki
  choice: kwa mfano wa Melkizedeki
  alternative: kwa utaratibu wa Melkizedeki
  rationale: “Kwa mfano wa” huwasilisha ulinganifu wa aina ya ukuhani kwa Kiswahili kinachoeleweka, huku tanbihi ikihifadhi uwezekano wa kusoma τάξις kama utaratibu au mpangilio.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kimaandiko. Sentensi ni fupi na ya moja kwa moja; dondoo na alama zote za tanbihi zimehifadhiwa.
