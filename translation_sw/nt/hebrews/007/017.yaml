  verdict: revise
  source_fidelity: The present passive μαρτυρεῖται is best represented by the present impersonal passive “inashuhudiwa,” rather than the perfect “imeshuhudiwa.” The citation otherwise retains the direct address, “priest,” and “forever” without theological expansion. For κατὰ τὴν τάξιν, “kwa utaratibu wa” more directly represents the stated order/pattern than “kwa mfano wa.”
  naturalness: “Kwa maana inashuhudiwa” is concise, grammatical Standard East African Swahili in a formal scriptural register. “Kwa utaratibu wa Melkizedeki” is clear and suitably formal.
  terminology: “Kuhani,” “milele,” and the established biblical name “Melkizedeki” are appropriate. The lexical-alternative footnote should identify “kwa mfano wa” as the more traditional alternative, not characterize “kwa utaratibu wa” as merely closer to Greek while the main text uses the alternative.
  issues:
  - severity: medium
    issue: Tense/aspect of imeshuhudiwa
    rationale: “Imeshuhudiwa” is perfect, whereas μαρτυρεῖται is present passive/impersonal. “Inashuhudiwa” preserves the ongoing scriptural testimony more closely.
  - severity: medium
    issue: Main rendering of κατὰ τὴν τάξιν
    rationale: “Kwa mfano wa” communicates resemblance but can underrepresent τάξις, which denotes an order, arrangement, or established pattern. “Kwa utaratibu wa” is a safer direct rendering.
  - severity: low
    issue: Lexical footnote framing
    rationale: Once the main text uses “kwa utaratibu wa,” the footnote should present “kwa mfano wa” as the traditional alternative and should not describe it as the closer structural rendering.
