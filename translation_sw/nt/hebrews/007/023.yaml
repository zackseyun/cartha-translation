lexical_decisions:
- source_word: Καὶ οἱ μὲν πλείονές εἰσιν γεγονότες ἱερεῖς
  choice: Nao kwa kweli wamekuwa makuhani wengi
  rationale: “Nao” linaendeleza hoja kutoka muktadha uliotangulia; “kwa kweli” linaakisi μέν na kuandaa utofauti wa mstari unaofuata. Muundo “wamekuwa makuhani wengi” unahifadhi kwa kadiri ya kawaida maana ya γεγονότες na wingi wa makuhani.
- source_word: διὰ τὸ θανάτῳ κωλύεσθαι
  choice: kwa sababu kifo kiliwazuia
  rationale: διά pamoja na infinitivu yenye kibainishi hutoa sababu, na θανάτῳ inaonyesha chombo au kisababishi. Kauli tendaji ya Kiswahili ni ya kawaida na inawasilisha wazi maana ya kauli tendwa ya Kigiriki.
- source_word: παραμένειν
  choice: kuendelea katika ukuhani
  rationale: Kitenzi kina maana ya kubaki au kuendelea; katika muktadha huu kinahusu kuendelea na huduma ya ukuhani. Kirai hiki kinaweka maana ya kimuktadha wazi bila kudai kwamba neno “ukuhani” limetajwa moja kwa moja katika Kigiriki.
- source_word: Καὶ
  choice: Nao
  rationale: Kiunganishi hiki kinadumisha mtiririko wa hoja, huku “-o” kikirejelea makuhani wanaozungumziwa katika muktadha.
theological_decisions:
- issue: Tofauti kati ya makuhani wengi wenye kufa na ukuhani wa Yesu unaodumu
  choice: Mstari unasisitiza wingi wa makuhani uliosababishwa na kifo kuwazuia kuendelea, ukiandaa utofauti wa mstari unaofuata.
  alternative: Kutaja moja kwa moja “makuhani Walawi” au kueleza hapa kwamba ukuhani wa Yesu ni wa milele.
  rationale: Ingawa muktadha unahusu mfumo wa ukuhani wa awali, Kigiriki cha mstari huu hakitumii neno “Walawi” wala hakitoi hitimisho lote la mstari unaofuata. Tafsiri haiongezi hitimisho la kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Makuhani” na “ukuhani” ni istilahi zinazoeleweka katika muktadha wa Biblia. Kauli “kifo kiliwazuia” ni ya asili zaidi kwa Kiswahili kuliko muundo tendwa mzito.
