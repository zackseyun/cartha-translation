base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/023.yaml
  text: And they indeed have become many priests[a], because they are prevented by death from remaining in office[b],
translation:
  language: sw
  text: Nao kwa kweli wamekuwa makuhani wengi[a], kwa sababu kifo kiliwazuia kuendelea katika ukuhani[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kumekuwa na makuhani wengi.”
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “kuendelea” au “kubaki”; katika muktadha maana yake ni kuendelea katika huduma ya ukuhani.
