  text: ᾧ καὶ δεκάτην ἀπὸ πάντων ἐμέρισεν Ἀβραάμ, πρῶτον μὲν ἑρμηνευόμενος βασιλεὺς δικαιοσύνης ἔπειτα δὲ καὶ βασιλεὺς Σαλήμ, ὅ ἐστιν βασιλεὺς εἰρήνης,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/002.yaml
  text: to whom Abraham also apportioned a tenth of everything[a]. First, his name is translated King of Righteousness, and then also King of Salem, that is[b], King of Peace.
translation:
  language: sw
  text: ambaye Ibrahimu pia alimtengea sehemu ya kumi ya vitu vyote[a]. Kwanza, akitafsiriwa, “Mfalme wa Haki”[b]; kisha pia, “Mfalme wa Salemu,” yaani, “Mfalme wa Amani.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “zaka.” Kigiriki kinasema kihalisi, “sehemu ya kumi.”
    reason: lexical_alternative
  - marker: b
    text: Au, “Mfalme wa Uadilifu.” Neno la Kigiriki linaweza kumaanisha haki au uadilifu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾧ
  choice: ambaye ... alimpa
  rationale: Kiwakilishi cha urejeshi katika hali ya yambwa kinamrejelea Melkizedeki; muundo huu wa Kiswahili unaonyesha wazi kuwa yeye ndiye aliyepokea.
- source_word: δεκάτην ἀπὸ πάντων
  choice: sehemu ya kumi ya vitu vyote
  rationale: Huhifadhi maana halisi ya ‘moja ya kumi’ na wazo la kuchukuliwa katika jumla yote bila kulazimisha neno la kidini ‘zaka.’
- source_word: ἐμέρισεν
  choice: alimpa sehemu
  rationale: Kitenzi kina wazo la kugawa au kutenga sehemu; ‘alimpa sehemu’ ni cha kawaida katika Kiswahili na huhifadhi wazo hilo kuliko ‘alimpa’ peke yake.
- source_word: ἑρμηνευόμενος
  choice: jina lake likitafsiriwa ni
  rationale: Ingawa Kigiriki kina umbo la kishirikishi, muktadha unaeleza maana ya jina Melkizedeki; kutaja ‘jina lake’ huifanya sentensi iwe wazi na ya kawaida.
- source_word: βασιλεὺς δικαιοσύνης
  choice: Mfalme wa Uadilifu
  rationale: ‘Uadilifu’ ni neno la kawaida na pana linaloweza kueleza δικαιοσύνη hapa bila kuamua kupita kiasi kati ya haki ya kimaadili na utendaji wa haki.
- source_word: βασιλεὺς Σαλήμ
  choice: Mfalme wa Salemu
  rationale: Σαλήμ ni jina la mahali, hivyo limetoholewa kuwa ‘Salemu.’
- source_word: ὅ ἐστιν βασιλεὺς εἰρήνης
  choice: yaani, “Mfalme wa Amani”
  rationale: ‘Yaani’ huanzisha kwa kawaida ufafanuzi wa maana ya Salemu, na ‘amani’ ni kisawe cha moja kwa moja cha εἰρήνη.
theological_decisions:
- issue: Maana ya δικαιοσύνη katika cheo kinachoeleza jina
  choice: uadilifu
  alternative: haki
  rationale: δικαιοσύνη inaweza kuhusisha uadilifu au haki. ‘Uadilifu’ inafaa katika maelezo ya jina na huepuka kuifanya maana kuwa haki ya kimahakama pekee; ‘haki’ imehifadhiwa katika tanbihi kama tafsiri halali.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Alama za kunukuu zinaonyesha vyeo vinavyotolewa kama maana za majina; mfuatano wa ‘Kwanza ... kisha pia’ huhifadhi muundo wa Kigiriki.
