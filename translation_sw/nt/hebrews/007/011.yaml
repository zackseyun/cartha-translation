  to: Basi, kama ukamilifu ungepatikana kwa njia ya ukuhani wa Walawi—kwa maana watu walikuwa wamepewa sheria kwa msingi wa ukuhani huo[a]—haja gani zaidi ingekuwapo ya kuhani mwingine kutokea kwa utaratibu wa Melkizedeki, wala kuitwa kwa utaratibu wa Haruni?[b]
