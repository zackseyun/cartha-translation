id: HEB.7.11
reference: Hebrews 7:11
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Εἰ μὲν οὖν τελείωσις διὰ τῆς Λευιτικῆς ἱερωσύνης ἦν, ὁ λαὸς γὰρ ἐπ’ ⸀αὐτῆς ⸀νενομοθέτηται, τίς ἔτι χρεία κατὰ τὴν τάξιν Μελχισέδεκ ἕτερον ἀνίστασθαι ἱερέα καὶ οὐ κατὰ τὴν τάξιν Ἀαρὼν λέγεσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/011.yaml
  text: If perfection had been through the Levitical priesthood—for on its basis the people had received the law—what further need was there for another priest to arise according to the order of Melchizedek and not be spoken of according to the order of Aaron?[a][b]
translation:
  language: sw
  text: Basi, kama ukamilifu ungepatikana kwa njia ya ukuhani wa Walawi—kwa maana watu walikuwa wamepewa sheria kwa msingi wa ukuhani huo[a]—haja gani zaidi ingekuwapo ya kuhani mwingine kutokea kwa utaratibu wa Melkizedeki, wala kuitwa kwa utaratibu wa Haruni?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa maana chini ya ukuhani huo watu walipewa sheria.” Usemi wa Kigiriki unaweza kutafsiriwa kwa namna hii ya karibu zaidi; maana yake ni kwamba mpangilio wa sheria wa watu ulitegemea ukuhani huo wa Walawi.
    reason: lexical_alternative
  - marker: b
    text: Au, “kuhani mwingine kutokea katika utaratibu wa Melkizedeki, wala kuitwa katika utaratibu wa Haruni.”
    reason: alternative_reading
lexical_decisions:
- source_word: τελείωσις
  choice: ukamilifu
  rationale: Neno hili linahifadhi uzito wa kiibada na kitheolojia katika Waebrania bila kulifupisha kuwa maendeleo ya kimaadili tu au ukamilishaji wa jambo.
- source_word: διὰ τῆς Λευιτικῆς ἱερωσύνης
  choice: kwa njia ya ukuhani wa Walawi
  rationale: διά pamoja na jenitivi huonyesha njia au chombo; usemi huu ni wa asili katika Kiswahili na unadumisha hoja ya ukuhani kuwa njia ya kufikia ukamilifu.
- source_word: ἐπ’ αὐτῆς
  choice: kwa msingi wa ukuhani huo
  rationale: Kiwakilishi cha kike kinarejelea kwa uwezekano mkubwa ukuhani wa Walawi; tafsiri hii inaonyesha uhusiano wa msingi bila kuficha marejeo yake.
- source_word: νενομοθέτηται
  choice: watu walipewa sheria
  rationale: Kauli timilifu ya kutendwa inaonyesha kwamba watu walikuwa wamepewa sheria au kuwekwa chini ya mpangilio wa sheria; hii ni Kiswahili cha kawaida na wazi.
- source_word: τίς ἔτι χρεία
  choice: kungekuwa na haja gani zaidi
  rationale: Inahifadhi swali la balagha kuhusu haja ambayo bado ingebaki.
- source_word: κατὰ τὴν τάξιν Μελχισέδεκ
  choice: kwa kufuata utaratibu wa Melkizedeki
  rationale: τάξις hapa ni utaratibu, mpangilio, au aina iliyowekwa; 'kwa kufuata' huwasilisha κατά kwa Kiswahili cha asili.
- source_word: ἕτερον ... ἱερέα
  choice: kuhani mwingine
  rationale: Tofauti yake na ukuhani wa Haruni inaelezwa wazi na sehemu inayofuata, hivyo 'mwingine' inatosha bila kuongeza ufafanuzi.
- source_word: ἀνίστασθαι
  choice: kuinuka
  rationale: Inadumisha taswira ya chanzo huku katika muktadha ikimaanisha kutokea au kuwekwa kwa kuhani, bila kulazimisha maana ya ufufuo.
- source_word: καὶ οὐ ... λέγεσθαι
  choice: wala si kuitwa kuwa wa utaratibu wa Haruni
  rationale: λέγεσθαι hapa inahusu kutajwa au kutambulishwa kwa kuhani kwa mujibu wa utaratibu fulani; 'kuitwa kuwa wa' ni ya asili na wazi.
- source_word: Μελχισέδεκ / Ἀαρών
  choice: Melkizedeki / Haruni
  rationale: Majina yametolewa kwa maumbo yaliyozoeleka katika matumizi ya Biblia ya Kiswahili.
theological_decisions:
- issue: Maana ya τελείωσις katika hoja ya ukuhani ya Waebrania
  choice: ukamilifu
  alternative: kukamilishwa; kufunguliwa njia kamili ya kumkaribia Mungu
  rationale: ‘Ukamilifu’ hudumisha mvutano wa kiibada na wokovu na kuacha muktadha mpana wa Waebrania ueleze maana yake kikamilifu.
- issue: Kirejelewa cha αὐτῆς katika ἐπ’ αὐτῆς νενομοθέτηται
  choice: ukuhani wa Walawi
  alternative: sheria; mpangilio mpana wa agano
  rationale: Nomino ya kike iliyo karibu na inayofaa kisintaksia ni ‘ukuhani’; kishazi cha mabano kinaeleza uhusiano wa sheria ya watu na mfumo huo wa ukuhani.
- issue: Maana ya τάξις katika kulinganisha Melkizedeki na Haruni
  choice: utaratibu
  alternative: daraja; mfano; mpangilio
  rationale: ‘Utaratibu’ haudai nasaba pekee wala cheo pekee, hivyo huhifadhi upana wa neno la Kigiriki katika hoja hii.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa msomaji wa kawaida. ‘Basi’ limetumika kuwasilisha nguvu ya kimantiki ya οὖν, si kama kielezi cha wakati. Mabano marefu yanahifadhi kishazi cha maelezo cha γάρ.
