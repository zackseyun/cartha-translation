source:
  edition: SBLGNT
  text: καὶ οἱ μὲν ἐκ τῶν υἱῶν Λευὶ τὴν ἱερατείαν λαμβάνοντες ἐντολὴν ἔχουσιν ἀποδεκατοῦν τὸν λαὸν κατὰ τὸν νόμον, τοῦτ’ ἔστιν τοὺς ἀδελφοὺς αὐτῶν, καίπερ ἐξεληλυθότας ἐκ τῆς ὀσφύος Ἀβραάμ·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/005.yaml
  text: And those from the sons of Levi who receive the priesthood have a commandment according to the law to collect a tenth from the people—that is[b][a], from their brothers—though they also have come from Abraham’s loins.
translation:
  language: sw
  text: Na wale miongoni mwa wana wa Lawi wanaopokea ukuhani wana amri ya kukusanya sehemu ya kumi kutoka kwa watu, kulingana na Sheria—yaani, kutoka kwa ndugu zao[a]—ingawa wao pia wametokana na viuno vya Abrahamu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Waisraeli wenzao.” Kigiriki kinasema “ndugu zao,” kikitumia lugha ya undugu kwa watu wenzao wa Israeli.
    reason: lexical_alternative
  - marker: b
    text: Au, “ni wazao wa Abrahamu.” Kwa neno halisi, “wametokana na viuno vya Abrahamu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ μὲν ἐκ τῶν υἱῶν Λευὶ
  choice: wale miongoni mwa wana wa Lawi
  rationale: Inahifadhi maana ya sehemu ya kundi iliyo katika ἐκ na lugha ya ukoo ya υἱῶν, bila kuwafanya wana wote wa Lawi kuwa makuhani.
- source_word: τὴν ἱερατείαν λαμβάνοντες
  choice: wanaopokea ukuhani
  rationale: ‘Kupokea’ huonyesha kupewa au kushika wadhifa huo, si kujitwalia; ‘ukuhani’ ni neno la kawaida na lenye hadhi.
- source_word: ἐντολὴν ἔχουσιν
  choice: wana amri
  rationale: Inadumisha muundo wa nomino wa Kigiriki na nguvu yake ya kisheria, kwa Kiswahili cha kawaida.
- source_word: ἀποδεκατοῦν
  choice: kukusanya sehemu ya kumi kutoka kwa
  rationale: Kitenzi kinamaanisha kupokea au kuchukua sehemu ya kumi kutoka kwa wengine, si kuitoa mwenyewe.
- source_word: τὸν λαὸν
  choice: watu
  rationale: Ni tafsiri ya moja kwa moja; maelezo yanayofuata yanafafanua kuwa ni watu wenzao wa Israeli.
- source_word: κατὰ τὸν νόμον
  choice: kulingana na Sheria
  rationale: Inaonyesha kwamba tendo hilo limeamriwa kwa mujibu wa Sheria ya Musa; herufi kubwa hutambulisha Sheria hiyo katika muktadha.
- source_word: τοῦτ’ ἔστιν
  choice: yaani
  rationale: Ni usemi wa kawaida wa Kiswahili unaoleta ufafanuzi wa kinachotangulia.
- source_word: τοὺς ἀδελφοὺς αὐτῶν
  choice: ndugu zao
  rationale: ‘Ndugu’ huhifadhi lugha ya undugu huku kwa kawaida katika Kiswahili ikiweza kurejelea jamaa au watu wa jamii moja bila kulazimisha jinsia.
- source_word: καίπερ
  choice: ingawa
  rationale: Inawakilisha wazi uhusiano wa kukubali jambo linaloonekana kuwa kinyume.
- source_word: ἐξεληλυθότας ἐκ τῆς ὀσφύος Ἀβραάμ
  choice: wao pia wametokana na viuno vya Abrahamu
  rationale: Inahifadhi taswira halisi ya mwili na ukoo katika Kigiriki, muhimu kwa hoja ya sura hii, huku tanbihi ikitoa maana ya kawaida.
theological_decisions:
- issue: Lugha ya undugu katika muktadha wa watu wa Israeli
  choice: ndugu zao
  alternative: Waisraeli wenzao
  rationale: Kigiriki hutumia ἀδελφούς; ‘ndugu zao’ huhifadhi sitiari ya kifamilia na bado ni ya kawaida katika Kiswahili. Tanbihi hufafanua rejeleo pana.
- issue: Kuhifadhi nahau ya ukoo wa kimwili
  choice: wametokana na viuno vya Abrahamu
  alternative: ni wazao wa Abrahamu
  rationale: Nahau ya mwili inadumisha nguvu ya hoja kuhusu asili yao ya pamoja kutoka kwa Abrahamu, bila kuficha maana kwa kuwa tanbihi inaifafanua.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Sehemu ya kumi’ imechaguliwa badala ya kitenzi kinachoweza kueleweka kama kutoa zaka; ‘Sheria’ inarejelea Sheria ya Musa. Alama zote za tanbihi zipo katika matini kuu.
