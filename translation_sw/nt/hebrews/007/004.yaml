  text: Θεωρεῖτε δὲ πηλίκος οὗτος ⸀ᾧ δεκάτην Ἀβραὰμ ἔδωκεν ἐκ τῶν ἀκροθινίων ὁ πατριάρχης.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/004.yaml
  text: Consider how great this man was[b][a], to whom Abraham the patriarch gave a tenth of the spoils.
translation:
  language: sw
  text: Basi, fikirini jinsi mtu huyu alivyokuwa mkuu, ambaye Abrahamu, baba wa taifa, alimpa sehemu ya kumi[a] ya nyara[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “zaka.” Kigiriki kinasema kihalisi “sehemu ya kumi.”
    reason: lexical_alternative
  - marker: b
    text: Neno la Kigiriki linaweza kumaanisha nyara za vita, na huenda likadokeza sehemu bora kabisa ya mali iliyotekwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: Θεωρεῖτε
  choice: fikirini
  rationale: Ni amri ya wingi inayowataka wasomaji watafakari kwa makini; “fikirini” ni Kiswahili cha sasa na cha kawaida chenye nguvu ya mwito huo.
- source_word: δὲ
  choice: Basi
  rationale: Hutia alama mpito mwororo katika hoja, si upinzani mkali; “Basi” linaunganisha sentensi na muktadha kwa kawaida.
- source_word: πηλίκος
  choice: jinsi ... alivyokuwa mkuu
  rationale: Huhusu ukubwa au ukuu; muundo huu ni wa asili katika Kiswahili na hauamui mapema aina ya ukuu unaokusudiwa.
- source_word: οὗτος
  choice: mtu huyu
  rationale: Humrejelea Melkizedeki katika muktadha uliotangulia; “mtu huyu” ni wazi bila kuongeza tafsiri ya kitheolojia.
- source_word: ᾧ
  choice: ambaye ... alimpa
  rationale: Muundo huu wa Kiswahili huwasilisha kwa kawaida uhusiano wa yule aliyepokea kile Abrahamu alichotoa.
- source_word: δεκάτην
  choice: sehemu ya kumi
  rationale: Hutafsiri maana halisi ya “moja ya kumi” kwa lugha inayoeleweka na huepuka kuingiza mapema mahusiano ya kitaasisi yanayoweza kuambatana na “zaka.”
- source_word: Ἀβραὰμ
  choice: Abrahamu
  rationale: Umbo la kawaida la jina hili katika Kiswahili.
- source_word: ἔδωκεν
  choice: alimpa
  rationale: Hutoa maana ya kawaida ya tendo lililokamilika la kutoa na pia huonyesha mpokeaji kwa kawaida katika Kiswahili.
- source_word: ἐκ τῶν ἀκροθινίων
  choice: ya nyara
  rationale: “Nyara” huonyesha mali iliyotekwa vitani; uhusiano wa sehemu na jumla unasikika kwa kawaida kama “sehemu ya kumi ya nyara.”
- source_word: ὁ πατριάρχης
  choice: baba mkuu
  rationale: Humtambulisha Abrahamu kwa hadhi yake kama baba wa taifa au ukoo; ni wazi zaidi kwa msomaji wa kawaida kuliko neno la mkopo “patriarki.”
theological_decisions:
- issue: Mrejelewa na uzito wa tathmini katika aya
  choice: Aya inasisitiza ukuu wa Melkizedeki kwa kusema kwamba hata Abrahamu, aliyeitwa baba mkuu, alimpa sehemu ya kumi.
  alternative: Aya inaweza kutafsiriwa kwa kusisitiza zaidi hadhi ya juu inayodokezwa na Melkizedeki kupokea sehemu ya kumi kutoka kwa Abrahamu.
  rationale: Kigiriki hujenga hoja kuhusu ukuu wa Melkizedeki kwa tendo la Abrahamu, lakini tafsiri haipaswi kueleza kwa nguvu zaidi hitimisho la kitheolojia ambalo muktadha unaolizunguka unaendelea kulijenga.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Alama za tanbihi zimewekwa baada ya kishazi “nyara,” ambacho ndicho zinachofafanua.
