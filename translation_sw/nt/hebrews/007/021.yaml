translation:
  language: sw
  text: 'Lakini huyu alifanywa kuhani kwa kiapo, kwa yule aliyemwambia, “Bwana ameapa[a], wala hatabadilisha nia yake: ‘Wewe ni kuhani milele.’”'
  philosophy: optimal-equivalence
