lexical_decisions:
- source_word: ὁ δὲ
  choice: lakini huyu
  rationale: Huhifadhi utofautishaji wa huyu kuhani na makuhani waliotangulia katika mstari uliopita, huku ikiwa Kiswahili cha kawaida.
- source_word: μετὰ ὁρκωμοσίας
  choice: kwa kiapo
  rationale: Hueleza njia au hali ya kuwekwa kwake kuwa kuhani na kudumisha tofauti na wale waliowekwa bila kiapo katika mstari wa 20.
- source_word: διὰ τοῦ λέγοντος πρὸς αὐτόν
  choice: kupitia yeye aliyemwambia
  rationale: Huhifadhi wazo la uwakala katika διά pamoja na uhusiano wa msemaji na yule anayeambiwa, bila kumtaja msemaji zaidi ya Kigiriki.
- source_word: Ὤμοσεν κύριος
  choice: Bwana ameapa
  rationale: Kauli timilifu ya Kiswahili inaonyesha tendo la zamani lenye nguvu inayoendelea katika hoja ya Waebrania; tanbihi inahifadhi uwezekano wa tafsiri ya wakati uliopita sahili.
- source_word: κύριος
  choice: Bwana
  rationale: Ni tafsiri ya kawaida na yenye heshima ya κύριος, ikifuata maandishi ya Kigiriki bila kubadilisha moja kwa moja kuwa jina la Mungu la Kiebrania.
- source_word: οὐ μεταμεληθήσεται
  choice: hatabadili nia yake
  rationale: Hueleza kutogeuza uamuzi uliotangazwa, wala haidokezi toba ya kimaadili.
- source_word: Σὺ ἱερεὺς
  choice: Wewe ni kuhani
  rationale: Kitenzi kishirikishi kinachodokezwa katika Kigiriki kimeongezwa kwa lazima katika Kiswahili cha asili.
- source_word: εἰς τὸν αἰῶνα
  choice: milele
  rationale: Ni namna ya kawaida ya Kiswahili ya kuonyesha kudumu bila mwisho katika nahau hii.
theological_decisions:
- issue: Kiapo cha Mungu na kudumu kwa ukuhani
  choice: Tafsiri inaonyesha kwamba huyu aliwekwa kuwa kuhani kwa kiapo cha Bwana na kwamba ukuhani wake ni wa milele.
  alternative: Muundo rasmi zaidi ungeweza kusema “Bwana aliapa” badala ya “Bwana ameapa.”
  rationale: Huhifadhi hoja ya muktadha inayotofautisha makuhani waliowekwa bila kiapo na huyu aliyethibitishwa kwa kiapo, bila kuingiza mafundisho ya baadaye yasiyotajwa katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “lakini huyu” unadumisha utofautishaji wa muktadha; “aliwekwa kuwa kuhani” unasema wazi wazo linalodokezwa na sentensi ya Kigiriki na muktadha wa mstari wa 20.
