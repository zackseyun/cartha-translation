base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/019.yaml
  text: For the law perfected nothing[a], but there is the introduction of a better hope[b], through which we draw near to God.
translation:
  language: sw
  text: Kwa maana sheria haikufanya chochote kuwa kamilifu[a]; bali kuna kuletwa kwa tumaini bora zaidi[b], na kupitia tumaini hilo tunamkaribia Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “haikukamilisha chochote.” Kitenzi cha Kigiriki kinaweza pia kumaanisha “kufikisha kwenye lengo lililokusudiwa.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kuingizwa kwa tumaini bora zaidi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲν
  choice: chochote
  rationale: Katika sentensi hasi, “haikukamilisha chochote” ni Kiswahili cha kawaida kinachohifadhi ukanushaji kamili wa Kigiriki.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Huonyesha sababu au ufafanuzi unaohusiana na kauli iliyotangulia.
- source_word: ἐτελείωσεν
  choice: haikukamilisha
  rationale: “Kukamilisha” huhifadhi wazo la kufikisha kwenye ukamilifu au lengo lililokusudiwa, ambalo lina uzito maalumu katika Waebrania.
- source_word: ὁ νόμος
  choice: sheria
  rationale: Muktadha unaelekeza kwenye sheria ya Musa na mfumo wake wa kikuhani; herufi ndogo haiongezi utofautishaji usiokuwapo katika Kigiriki.
- source_word: ἐπεισαγωγὴ
  choice: kuletwa
  rationale: Nomino ya kitendo inaonyesha kuingizwa au kuletwa kwa jambo jipya; “kuletwa” ni ya asili na inahifadhi muundo wa kinomino.
- source_word: δὲ
  choice: lakini
  rationale: Huonyesha tofauti kati ya kutokamilisha kwa sheria na kuletwa kwa tumaini bora zaidi.
- source_word: κρείττονος ἐλπίδος
  choice: tumaini bora zaidi
  rationale: “Bora zaidi” huhifadhi ulinganisho muhimu unaorudiwa katika Waebrania, huku “tumaini” likibaki bila kifungu bainishi kama katika Kigiriki.
- source_word: δι’ ἧς
  choice: hutuwezesha
  rationale: Kigiriki kihalisi ni “ambalo kupitia hilo”; muundo huu wa Kiswahili huwasilisha tumaini kuwa njia inayowezesha kumkaribia Mungu bila kuleta utata wa kirejeleo.
- source_word: ἐγγίζομεν
  choice: kumkaribia
  rationale: Huhifadhi maana ya kusogea karibu na Mungu na mwangwi wa kufikia uwepo wake katika muktadha wa ibada.
- source_word: τῷ θεῷ
  choice: Mungu
  rationale: Ni kijalizo cha kitenzi “kumkaribia,” kwa muundo wa kawaida wa Kiswahili.
theological_decisions:
- issue: Maana ya τελειόω kuhusiana na sheria
  choice: Sheria haikufikisha chochote kwenye ukamilifu au lengo lililokusudiwa.
  alternative: Sheria haikufanya jambo lolote kabisa.
  rationale: “Haikukamilisha chochote” huhifadhi uzito wa kiteolojia wa τελειόω bila kudai kwamba sheria haikuwa na kazi yoyote kwa maana zote.
- issue: Tofauti yenye udondoshaji baada ya kauli kuhusu sheria
  choice: Kutumia muundo wa kinomino “lakini kuletwa kwa tumaini bora zaidi” na kuunganisha kazi yake na kishazi kinachofuata.
  alternative: Lakini tumaini bora zaidi limeletwa.
  rationale: Kigiriki hakina kitenzi kamili katika sehemu hii. Muundo uliochaguliwa huhifadhi kwa kiasi kikubwa udondoshaji huo bila kulazimisha wakati wa kitenzi usiotajwa.
- issue: Kirejeleo cha δι’ ἧς
  choice: Tumaini bora zaidi ndilo njia ambayo kupitia hiyo tunamkaribia Mungu.
  alternative: Kuletwa kwa tumaini ndiko kunakotuwezesha kumkaribia Mungu.
  rationale: Kiwakilishi cha kike ἧς kinaweza kurejelea kwa asili “tumaini”; tafsiri kuu inafanya uhusiano huo uwe wazi bila kuondoa kabisa ukaribu wa dhana hizo mbili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Kwa maana,” “tumaini,” na “kumkaribia Mungu” huhifadhi mtiririko na mwangwi wa kiibada wa kifungu bila kuwa wa kizamani.
