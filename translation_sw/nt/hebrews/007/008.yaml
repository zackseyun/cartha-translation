  text: καὶ ὧδε μὲν δεκάτας ἀποθνῄσκοντες ἄνθρωποι λαμβάνουσιν, ἐκεῖ δὲ μαρτυρούμενος ὅτι ζῇ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/008.yaml
  text: And here mortal men receive tithes[a], but there he is testified to be living.
translation:
  language: sw
  text: Na hapa watu wanaokufa hupokea zaka, lakini kule zaka hupokelewa na yule anayeshuhudiwa kwamba yu hai.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “lakini kule inashuhudiwa juu yake kwamba anaishi.” Kigiriki huiweka kauli hii katika namna ya ushuhuda wa Maandiko badala ya kudai moja kwa moja kwamba Melkizedeki ana hali ya kutokufa.
    reason: alternative_reading
lexical_decisions:
- source_word: ὧδε
  choice: hapa
  rationale: Inahifadhi utofautishaji wa kimaelekezo kati ya mazingira ya sasa ya ukuhani wa Walawi na simulizi la Maandiko kuhusu Melkizedeki.
- source_word: δεκάτας
  choice: zaka
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa sehemu ya kumi inayotolewa katika muktadha wa kidini.
- source_word: ἀποθνῄσκοντες ἄνθρωποι
  choice: watu wanaokufa
  rationale: Inatafsiri kishiriki moja kwa moja na kusisitiza hali yao ya kufa, bila kuongeza dai jingine.
- source_word: λαμβάνουσιν
  choice: hupokea
  rationale: Huwasilisha tendo la kawaida au linalojirudia la kupokea zaka katika mfumo wa ukuhani.
- source_word: ἐκεῖ
  choice: kule
  rationale: Inadumisha jozi ya balagha ‘hapa ... kule,’ huku ‘kule’ ikielekeza kwenye ushuhuda wa simulizi la Maandiko.
- source_word: μαρτυρούμενος
  choice: anashuhudiwa
  rationale: Inahifadhi hali ya kutendwa na wazo kwamba kauli hiyo inatolewa kama ushuhuda, si kama ufafanuzi wa moja kwa moja wa asili yake.
- source_word: ὅτι ζῇ
  choice: kwamba yu hai
  rationale: Inahifadhi wakati wa sasa na ni usemi wa asili, wenye hadhi, unaoonyesha kwamba ushuhuda humwasilisha akiwa hai.
theological_decisions:
- issue: Asili ya utofautishaji kati ya makuhani Walawi na Melkizedeki
  choice: Watu wanaopokea zaka hapa ni wenye kufa, ilhali Melkizedeki anatajwa katika ushuhuda wa Maandiko kuwa yu hai.
  alternative: Mstari unafundisha moja kwa moja kwamba Melkizedeki anaishi milele bila kufa.
  rationale: Muundo wa Kigiriki unadumisha lugha ya ushuhuda kwa kutumia μαρτυρούμενος. Tafsiri haiondoi uwezekano wa maana pana ya kitheolojia, lakini haisuluhishi mvutano kwa kudai wazi kutokufa halisi kwa Melkizedeki.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Yu hai’ ni kifupi na cha kawaida katika mtindo wa kibiblia bila kuwa cha kizamani kupita kiasi; ‘watu wanaokufa’ huhifadhi maana ya wazi ya Kigiriki.
