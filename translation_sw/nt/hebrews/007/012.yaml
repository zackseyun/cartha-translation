  text: μετατιθεμένης γὰρ τῆς ἱερωσύνης ἐξ ἀνάγκης καὶ νόμου μετάθεσις γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/012.yaml
  text: For when the priesthood is changed[a], of necessity there is also a change of law.
translation:
  language: sw
  text: Kwa maana, ukuhani unapobadilishwa, ni lazima pia mabadiliko ya sheria yatokee.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ni lazima pia mabadiliko ya ile Sheria yatokee”; “ile Sheria” huelekeza hasa kwenye Sheria ya Musa iliyoweka ukuhani wa Walawi.
    reason: alternative_reading
lexical_decisions:
- source_word: μετατιθεμένης
  choice: unapobadilishwa
  rationale: Kitenzi hiki kinaonyesha kuhama kutoka mpangilio mmoja kwenda mwingine. “Unapobadilishwa” ni Kiswahili cha kawaida na kinahifadhi uhusiano wa kimantiki wa kishazi tegemezi bila kuufanya kuwa uhamisho wa kiutawala tu.
- source_word: ἱερωσύνης
  choice: ukuhani
  rationale: Neno hili linamaanisha taasisi au cheo cha kikuhani, si tendo moja la kuhani; “ukuhani” ndilo neno la kawaida na linalofaa katika hoja hii.
- source_word: ἐξ ἀνάγκης
  choice: ni lazima
  rationale: 'Kirai hiki kinaonyesha ulazima wa kimantiki: ukuhani ukibadilishwa, badiliko linalohusiana na sheria haliwezi kuepukika.'
- source_word: νόμου
  choice: sheria
  rationale: Nomino haina kibainishi katika Kigiriki. “Sheria” inadumisha upana kiasi, huku muktadha ukiielekeza hasa kwenye mfumo wa sheria unaosimamia ukuhani wa Walawi.
- source_word: μετάθεσις
  choice: ibadilishwe
  rationale: Neno hili lina mzizi mmoja na μετατιθεμένης na linaonyesha badiliko linalolingana. Muundo wa kitenzi “sheria ibadilishwe” ni wa asili zaidi katika Kiswahili kuliko nomino nzito kama “badiliko la sheria,” huku ukihifadhi maana.
- source_word: γίνεται
  choice: ibadilishwe
  rationale: Katika muundo huu, γίνομαι huonyesha kutokea kwa matokeo. Kiswahili cha kimodal “ni lazima ... ibadilishwe” kinawasilisha kwa kawaida tukio hilo la lazima.
- source_word: καὶ
  choice: pia
  rationale: “Pia” linaunganisha badiliko la sheria kama tokeo linaloambatana na badiliko la ukuhani.
- source_word: γὰρ
  choice: Kwa maana
  rationale: “Kwa maana” linaonyesha kwamba mstari huu unatoa sababu au ufafanuzi wa hoja iliyotangulia.
theological_decisions:
- issue: Upeo wa νόμος kuhusiana na ukuhani
  choice: “sheria” katika maandishi makuu, likiruhusu maana ya mfumo wa kisheria unaosimamia ukuhani na, kwa muktadha, Sheria ya Musa.
  alternative: “ile Sheria,” likitaja kwa uwazi zaidi Sheria ya Musa.
  rationale: Muktadha unahusu mfumo wa Musa ulioweka ukuhani wa Walawi, lakini νόμου haina kibainishi katika Kigiriki. Tafsiri kuu haiongezi umahususi usioonyeshwa kisarufi, na tanbihi inahifadhi usomaji mahsusi unaowezekana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo “ni lazima ... ibadilishwe” unatoa hoja ya ulazima kwa ufasaha, na “ukuhani” huhifadhi lugha ya kitaasisi ya kifungu.
