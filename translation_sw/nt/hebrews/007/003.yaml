base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/003.yaml
  text: without father[a], without mother, without genealogy, having neither beginning of days nor end of life, but being made like the Son of God[b], he remains a priest perpetually.
translation:
  language: sw
  text: hana baba, hana mama, hana nasaba[a], hana mwanzo wa siku wala mwisho wa maisha; bali, akiwa amefananishwa na Mwana wa Mungu, anadumu kuwa kuhani milele[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hana nasaba iliyoandikwa.” Kitabu cha Mwanzo hakitaji nasaba ya Melkizedeki, na Waebrania hutumia ukimya huo kumwasilisha kama mfano.
    reason: lexical_alternative
  - marker: b
    text: Au, “daima” au “wakati wote.” Kirai hiki kinakazia hali ya kudumu ya ukuhani wake kama unavyowasilishwa katika Maandiko.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπάτωρ
  choice: hana baba
  rationale: Huhifadhi maana ya moja kwa moja na ulinganifu wa mfululizo wa Kigiriki bila kuamua kimyakimya kama kinachokusudiwa ni hali halisi au ukosefu wa taarifa katika simulizi.
- source_word: ἀμήτωρ
  choice: hana mama
  rationale: Ni tafsiri ya kawaida na yenye ulinganifu na 'hana baba'.
- source_word: ἀγενεαλόγητος
  choice: hana nasaba
  rationale: '''Nasaba'' ni neno la kawaida kwa ukoo au orodha ya kizazi; maelezo ya chini yanaonyesha uwezekano wa kuelewa kuwa hana nasaba iliyoandikwa.'
- source_word: μήτε ἀρχὴν ἡμερῶν μήτε ζωῆς τέλος ἔχων
  choice: hana mwanzo wa siku wala mwisho wa uzima
  rationale: Huhifadhi jozi ya ukanushi na mtindo ulioinuliwa wa asili kwa Kiswahili kinachoeleweka.
- source_word: ἀφωμοιωμένος
  choice: akiwa amefananishwa na
  rationale: Huwakilisha umbo timilifu la kutendwa na kudumisha tofauti kati ya Melkizedeki na Mwana; haisemi kwamba wao ni mtu yuleyule.
- source_word: τῷ υἱῷ τοῦ θεοῦ
  choice: Mwana wa Mungu
  rationale: Ni cheo sanifu cha Kikristo na tafsiri ya kawaida ya kirai hiki.
- source_word: μένει
  choice: anadumu
  rationale: Huonyesha hali inayoendelea kama ilivyo katika wakati wa sasa wa μένω.
- source_word: ἱερεὺς
  choice: kuwa kuhani
  rationale: Muundo 'anadumu kuwa kuhani' ni wa asili katika Kiswahili na huwasilisha hali yake ya ukuhani inayoendelea.
- source_word: εἰς τὸ διηνεκές
  choice: milele
  rationale: Ni Kiswahili cha kawaida na chenye hadhi kinachoonyesha mwendelezo usiokatika; tanbihi inaeleza mkazo wa kudumu katika uwasilishaji wa Maandiko.
theological_decisions:
- issue: Ikiwa Melkizedeki anaelezwa kuwa bila wazazi na wa milele kihalisi, au kama anavyowasilishwa katika simulizi la Maandiko kwa kusudi la kifananishi
  choice: Maelezo makali ya mstari yamehifadhiwa, huku 'akiwa amefananishwa na Mwana wa Mungu' likionyesha ulinganisho bila kudai utambulisho.
  alternative: Kutafsiri wazi kuwa hana nasaba iliyoandikwa na kwamba ukuhani wake hudumu tu katika simulizi.
  rationale: Kigiriki chenyewe kinasema hana baba, hana mama, na hana nasaba, kisha kinamtaja kuwa amefananishwa na Mwana. Tafsiri kuu huhifadhi mvutano huo; tanbihi hutoa ufafanuzi wa kimuktadha bila kuuingiza ndani ya matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wenye mfululizo mfupi huhifadhi mkazo wa Kigiriki. 'Uzima' limetumiwa katika kirai kilichoinuliwa 'mwisho wa uzima,' na 'milele' ni la kawaida zaidi kwa wasomaji kuliko istilahi nzito kama 'daima dawamu'.
