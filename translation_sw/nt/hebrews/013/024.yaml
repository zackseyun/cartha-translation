id: HEB.13.24
reference: Hebrews 13:24
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀσπάσασθε πάντας τοὺς ἡγουμένους ὑμῶν καὶ πάντας τοὺς ἁγίους. ἀσπάζονται ὑμᾶς οἱ ἀπὸ τῆς Ἰταλίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/024.yaml
  text: Greet all your leaders and all the saints[a]. Those from Italy greet you.
translation:
  language: sw
  text: Wasalimuni viongozi wenu wote na watakatifu wote. Wale wanaotoka Italia[a] wanawasalimu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wale walio Italia wanawasalimu.” Kirai cha Kigiriki kinaweza kumaanisha watu waliotoka Italia au watu walioko huko.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Wasalimuni
  rationale: Kitenzi cha amri kinamaanisha kutoa au kufikisha salamu. “Wasalimuni” ni Kiswahili cha kawaida na kinahifadhi nguvu ya amri.
- source_word: πάντας
  choice: wote
  rationale: Neno hili linahusu kundi zima; “wote” ni tafsiri ya moja kwa moja na ya kawaida katika Kiswahili.
- source_word: τοὺς ἡγουμένους ὑμῶν
  choice: viongozi wenu
  rationale: Kirai hiki kinamaanisha wale wanaoongoza jumuiya. “Viongozi wenu” ni wazi na hakileti dhana ya watawala wa kisiasa.
- source_word: τοὺς ἁγίους
  choice: watakatifu
  rationale: Hili ni jina la kawaida katika Agano Jipya kwa waumini waliotengwa kwa ajili ya Mungu. “Watakatifu” linahifadhi uzito wa kileksika na kitheolojia bila kulifafanua zaidi.
- source_word: ἀσπάζονται
  choice: wanawasalimu
  rationale: Katika muktadha wa barua, kitenzi hiki kinaeleza kwamba watu fulani wanatoa salamu kwa wasomaji. Muundo huu ni wa kawaida na unaonyesha wazi watendaji na wapokeaji.
- source_word: οἱ ἀπὸ τῆς Ἰταλίας
  choice: Wale wanaotoka Italia
  rationale: Kwa kawaida ἀπό pamoja na hali milikishi huonyesha asili au mahali mtu alikotoka. Tafsiri hii inatanguliza maana hiyo ya moja kwa moja huku uwezekano wa kumaanisha watu walioko Italia ukihifadhiwa katika tanbihi.
theological_decisions:
- issue: Wanaorejelewa na οἱ ἀπὸ τῆς Ἰταλίας
  choice: Wale wanaotoka Italia
  alternative: Wale walio Italia
  rationale: Hili ni fumbo la kimuktadha linalohusu mahali barua ilipoandikwa, si fundisho kuu. Kwa kuwa ἀπό kwa kawaida huonyesha asili, maana ya “wanaotoka Italia” imewekwa katika matini kuu; maana ya mahali walipo imehifadhiwa katika tanbihi bila kuamua jambo hilo kwa uhakika usiokuwapo katika Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni fupi na wazi; istilahi “viongozi” na “watakatifu” zinadumisha lugha ya jumuiya ya waumini bila kuingiza mapokeo ya dhehebu fulani.
