  text: so that we confidently say[a], “The Lord is my helper; I will not be afraid[b]. What can man do to me?”
translation:
  language: sw
  text: 'Kwa hiyo tunaweza kusema kwa ujasiri: “Bwana ndiye msaidizi wangu; sitaogopa. Mwanadamu atanifanyia nini?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὥστε
  choice: hivyo
  rationale: Inaonyesha matokeo au hitimisho linalotokana na kauli iliyotangulia, na inaingia kwa kawaida katika tamko linalofuata.
- source_word: θαρροῦντας ἡμᾶς λέγειν
  choice: tuseme kwa ujasiri
  rationale: Muundo huu unaonyesha kwamba sisi tunasema tukiwa na moyo mkuu na uhakika; Kiswahili hiki ni cha kawaida bila kuufanya kuwa amri kali.
- source_word: Κύριος
  choice: Bwana
  rationale: Ni tafsiri ya kawaida na yenye heshima ya κύριος kama cheo cha Mungu katika dondoo hili.
- source_word: ἐμοὶ βοηθός
  choice: ndiye msaidizi wangu
  rationale: Dativu ἐμοὶ inaonyesha msaada kwa ajili yangu; umilikishi “wangu” ni usemi wa kawaida wa Kiswahili, huku “ndiye” ikibainisha kiarifu.
- source_word: οὐ φοβηθήσομαι
  choice: sitaogopa
  rationale: Inahifadhi wakati ujao na maana ya kutokuwa na hofu kwa Kiswahili cha kawaida.
- source_word: τί ποιήσει μοι ἄνθρωπος
  choice: Mwanadamu atanifanyia nini?
  rationale: Inahifadhi kitenzi cha wakati ujao ποιήσει na nomino ya umoja yenye maana ya jumla ἄνθρωπος, huku swali la balagha likibaki wazi.
theological_decisions:
- issue: Maana ya jumla ya ἄνθρωπος
  choice: mwanadamu
  alternative: mtu; mtu yeyote
  rationale: “Mwanadamu” huhifadhi umoja wa Kigiriki na maana yake ya jumla bila kuufanya usemi huo uwahusu wanaume pekee.
- issue: Nguvu ya wakati ujao katika ποιήσει
  choice: atanifanyia nini?
  alternative: anaweza kunifanyia nini?
  rationale: Tafsiri ya wakati ujao huhifadhi umbo la chanzo na mvutano wa swali la balagha bila kulifafanua kimyakimya kuwa swali la uwezo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Mpangilio wa sentensi umewekwa wa asili kwa Kiswahili huku muundo wa dondoo la Zaburi ukihifadhiwa.
