  to: Awawezeshe kwa kila jambo jema ili mfanye mapenzi yake, akifanya ndani yetu yale yanayompendeza machoni pake kwa njia ya Yesu Masihi. Utukufu uwe wake[a] milele na milele. Amina.
  rationale: Revision avoids forcing the contested referent of the Greek relative pronoun by replacing the masculine relative clause with the unanchored doxological expression ‘Utukufu uwe wake.’ It also places the footnote at the relevant pronoun and renders the purpose clause more directly. The revised opening conveys καταρτίσαι in modern, natural Swahili while retaining the supplied/enabling sense of the phrase.
