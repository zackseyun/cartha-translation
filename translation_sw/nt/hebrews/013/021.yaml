id: HEB.13.21
reference: Hebrews 13:21
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καταρτίσαι ὑμᾶς ἐν ⸀παντὶ ἀγαθῷ εἰς τὸ ποιῆσαι τὸ θέλημα αὐτοῦ, ποιῶν ἐν ⸀ἡμῖν τὸ εὐάρεστον ἐνώπιον αὐτοῦ διὰ Ἰησοῦ Χριστοῦ, ᾧ ἡ δόξα εἰς τοὺς ⸀αἰῶνας· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/021.yaml
  text: may he equip you in every good thing to do his will[a], working in us what is pleasing before him through Jesus the Messiah, to whom be the glory forever and ever. Amen.
translation:
  language: sw
  text: Awawezeshe kwa kila jambo jema ili mfanye mapenzi yake, akifanya ndani yetu yale yanayompendeza machoni pake kwa njia ya Yesu Masihi. Utukufu uwe wake[a] milele na milele. Amina.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiwakilishi “wake” kinaweza kumrejelea Yesu Masihi hasa; wengine hukielewa kuwa kinamrejelea Mungu wa amani, ambaye ndiye mhusika mkuu wa ombi hili.
    reason: alternative_reading
lexical_decisions:
- source_word: καταρτίσαι
  choice: awafanye kuwa tayari
  rationale: Katika ombi hili, kitenzi kina maana ya kuwaandaa au kuwapa waamini kinachohitajika ili watii; usemi huu ni wa kawaida na hauingizi wazo la kurejeshwa ambalo muktadha haulazimishi.
- source_word: ἐν παντὶ ἀγαθῷ
  choice: katika kila jambo jema
  rationale: Hufuata kwa karibu muundo wa Kigiriki huku ukibaki wa asili katika Kiswahili; inaweza kueleza eneo au njia ambayo maandalizi hayo yanaonekana.
- source_word: εἰς τὸ ποιῆσαι τὸ θέλημα αὐτοῦ
  choice: ili mtimize mapenzi yake
  rationale: Muundo wa infinitivu unaonyesha kusudi. ‘Mtimimize mapenzi yake’ ni Kiswahili cha kawaida kwa kutenda yale Mungu anayotaka.
- source_word: ποιῶν ἐν ἡμῖν
  choice: akitenda ndani yetu
  rationale: Kirai endelevu kinadumisha wazo la Mungu kuwa mtendaji ndani ya waamini; ‘ndani yetu’ ndiyo maana ya karibu zaidi hapa.
- source_word: τὸ εὐάρεστον ἐνώπιον αὐτοῦ
  choice: yale yanayompendeza mbele zake
  rationale: Hutoa kwa lugha ya kawaida wazo la mambo yanayokubalika na kumpendeza Mungu kwa kipimo chake mwenyewe.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: kwa njia ya Yesu Masihi
  rationale: διά inaonyesha njia au wakala; Χριστός inabaki kama cheo ‘Masihi’ katika muktadha huu wa kitheolojia.
- source_word: ᾧ ἡ δόξα
  choice: ambaye utukufu ni wake
  rationale: Huhifadhi kishazi cha uhusiano bila kumtaja wazi rejeleo la ᾧ, hivyo utata halisi wa Kigiriki unabaki.
- source_word: εἰς τοὺς αἰῶνας
  choice: milele na milele
  rationale: Ni usemi wa Kiswahili unaoeleweka na wa heshima kwa muda usio na mwisho katika tamko la sifa.
theological_decisions:
- issue: Rejeleo la kiwakilishi ᾧ katika tamko la utukufu
  choice: Kishazi ‘ambaye utukufu ni wake’ kimeachwa kimrejelee mtajwa bila kumfafanua zaidi.
  alternative: Kusema wazi kwamba utukufu ni wa Yesu Masihi, au kwamba ni wa Mungu wa amani ambaye ndiye mhusika mkuu wa ombi.
  rationale: Kisarufi, ᾧ inaweza kumrejelea Yesu Masihi aliye karibu zaidi, lakini pia inaweza kumrejelea Mungu, mhusika mkuu wa ombi. Tafsiri haipaswi kuondoa utata huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya baraka ya kiibada lakini kinachoeleweka kwa msomaji wa kawaida. ‘Masihi’ limetumiwa kama cheo. Alama ya tanbihi imewekwa baada ya mstari mzima kwa kuwa inahusu rejeleo katika kishazi cha mwisho.
