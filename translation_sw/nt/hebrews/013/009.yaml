base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/009.yaml
  text: Do not be carried away by various and strange teachings[a], for it is good for the heart to be strengthened by grace, not by foods[c][b], by which those who occupied themselves with them were not benefited.
translation:
  language: sw
  text: Msichukuliwe na mafundisho mbalimbali na mageni, kwa maana ni vema moyo uimarishwe kwa neema, si kwa vyakula[a]; wale waliojishughulisha navyo[b] hawakupata faida.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Vyakula” huenda vikamaanisha desturi au masharti yanayohusu vyakula; Kigiriki kinasema tu “vyakula.”
    reason: cultural_note
  - marker: b
    text: 'Tafsiri nyingine: “wale walioishi kwa hayo” au “wale waliojiendesha kwa hayo.” Kigiriki kwa maana halisi husema “wale waliotembea katika hivyo.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: διδαχαῖς ποικίλαις καὶ ξέναις
  choice: mafundisho mbalimbali na mageni
  rationale: “Mafundisho” ni neno la kawaida na lenye heshima; “mbalimbali na mageni” huhifadhi wingi na hali ya kutokuwa sehemu ya ujumbe unaojulikana bila kuingiza wazo la kabila au nchi nyingine.
- source_word: μὴ παραφέρεσθε
  choice: Msichukuliwe
  rationale: Huhifadhi kauli tendwa na taswira ya kubebwa mbali au kuondolewa kwenye njia, huku ikiwa onyo la moja kwa moja na la kawaida kwa Kiswahili.
- source_word: χάριτι βεβαιοῦσθαι τὴν καρδίαν
  choice: moyo kuimarishwa kwa neema
  rationale: “Kuimarishwa” huwasilisha maana ya kuthibitishwa au kufanywa imara; “moyo” na “neema” zimehifadhiwa kwa uwazi wa kibiblia, na “kwa” huonyesha njia au chombo.
- source_word: οὐ βρώμασιν
  choice: si kwa vyakula
  rationale: Tafsiri ya moja kwa moja haipanui neno kuwa sheria za vyakula au milo ya dhabihu, hivyo huhifadhi upeo usioamuliwa wa chanzo.
- source_word: οἱ περιπατοῦντες
  choice: wale waliojiendesha kwa hayo
  rationale: Kitenzi kinaweza kumaanisha mwenendo wa maisha. “Waliojiendesha kwa hayo” ni Kiswahili cha asili zaidi kuliko taswira isiyoeleweka ya ‘kutembea ndani ya vyakula,’ huku dokezo likihifadhi maana nyingine zinazowezekana.
- source_word: οὐκ ὠφελήθησαν
  choice: hawakupata faida
  rationale: Hutoa maana ya kutonufaika kwa Kiswahili cha kawaida na wazi bila kubadili tathmini ya mwandishi.
theological_decisions:
- issue: Kinachorejelewa na “vyakula” katika utofauti wake na neema
  choice: Neno “vyakula” limehifadhiwa bila kulifafanua katika matini kuu.
  alternative: Sheria za vyakula, desturi zinazohusu vyakula, au milo ya dhabihu.
  rationale: Muktadha unaweza kudokeza desturi za kidini zinazohusu vyakula, lakini βρώμασιν yenyewe haisemi kwa usahihi ni mfumo gani; kutafsiri moja kwa moja huhifadhi mvutano huo.
- issue: Maana ya sitiari ya “moyo”
  choice: “Moyo” umehifadhiwa kama kitovu cha utu wa ndani.
  alternative: Akili au utu wa ndani.
  rationale: Neno καρδία lina uzito wa kibiblia na halipaswi kufupishwa kuwa akili pekee.
- issue: Maana ya περιπατοῦντες kuhusiana na vyakula
  choice: “Waliojiendesha kwa hayo” inaonyesha kwamba waliufuata mwenendo huo.
  alternative: Walioishi kwa hayo; waliojishughulisha na hayo; waliotembea ndani yake.
  rationale: Taswira halisi ya kutembea ni ngumu kwa Kiswahili inapohusishwa na vyakula. Tafsiri iliyochaguliwa ni ya asili lakini dokezo linaonyesha maana mbadala ili kutofunga tafsiri kupita kiasi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imewekwa wazi na ya kawaida kwa wasomaji wengi, huku maneno ya msingi “moyo,” “neema,” na “vyakula” yakihifadhiwa. Alama zote za vidokezo [a] na [b] zipo katika matini kuu.
