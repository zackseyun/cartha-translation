translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio wa kishazi cha mwisho umefanywa kuwa wa kawaida katika Kiswahili, huku sharti la kuwasili kwa Timotheo na kusudi la mwandishi la kuwaona wasomaji yakihifadhiwa.
