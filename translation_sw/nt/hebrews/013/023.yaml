  yaml_path: translation/nt/hebrews/013/023.yaml
  text: Know that our brother Timothy has been released[a], with whom I will see you if he comes soon.
translation:
  language: sw
  text: Jueni kwamba ndugu yetu Timotheo ameachiliwa[a]. Akija mapema, nitawaona pamoja naye.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “amewekwa huru,” labda kutoka kifungoni. Kitenzi hiki pia kinaweza kumaanisha “ametumwa aende” au “ameruhusiwa kuondoka,” lakini tafsiri “ameachiliwa” inaonekana kufaa zaidi katika muktadha huu.
    reason: lexical_alternative
lexical_decisions:
- source_word: γινώσκετε
  choice: Jueni kwamba
  rationale: Kitenzi ni agizo la wingi linalotumiwa kutoa taarifa; “Jueni kwamba” ni Kiswahili cha kawaida na kinahifadhi nguvu ya agizo.
- source_word: ἀδελφὸν ἡμῶν
  choice: ndugu yetu
  rationale: Hii ni lugha ya kifamilia ya jumuiya ya waamini, na hapa inamtaja Timotheo kwa njia ya kawaida na ya heshima.
- source_word: Τιμόθεον
  choice: Timotheo
  rationale: Jina limetolewa kwa umbo lililozoeleka katika Kiswahili cha Biblia.
- source_word: ἀπολελυμένον
  choice: ameachiliwa
  rationale: Kauli timilifu tendwa inaonyesha tendo lililokamilika lenye athari ya sasa. “Ameachiliwa” linafaa zaidi katika muktadha unaowezekana wa kuachiliwa kutoka kifungoni, huku maana nyingine zikihifadhiwa katika tanbihi.
- source_word: μεθ’ οὗ
  choice: pamoja naye
  rationale: Kirejeshi hiki kinamhusisha Timotheo na safari inayotarajiwa; katika Kiswahili sentensi imepangwa upya kwa uwazi bila kubadili uhusiano huo.
- source_word: ἐὰν τάχιον ἔρχηται
  choice: Akija upesi
  rationale: Kishazi kinaonyesha sharti kuhusu kuwasili kwa Timotheo; “upesi” ni njia ya kawaida ya kuwasilisha τάχιον katika muktadha huu.
- source_word: ὄψομαι ὑμᾶς
  choice: nitakuja pamoja naye kuwaona
  rationale: Maana ya msingi ya ὄψομαι ὑμᾶς ni “nitawaona.” Kuongeza “nitakuja” kunafanya uhusiano wa safari na kuonana uwe wa kawaida katika Kiswahili, huku “kuwaona” ikihifadhi kitenzi cha kuona.
