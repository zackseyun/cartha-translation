  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Μνημονεύετε τῶν ἡγουμένων ὑμῶν, οἵτινες ἐλάλησαν ὑμῖν τὸν λόγον τοῦ θεοῦ, ὧν ἀναθεωροῦντες τὴν ἔκβασιν τῆς ἀναστροφῆς μιμεῖσθε τὴν πίστιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/007.yaml
  text: Remember your leaders[a], who spoke the word of God to you. As you consider the outcome of their way of life[b], imitate their faith.
translation:
  language: sw
  text: Wakumbukeni viongozi wenu, waliosema neno la Mungu kwenu. Mnapotafakari kwa makini matokeo ya mwenendo wao wa maisha[b], igeni imani yao[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “uaminifu wao.” Neno la Kigiriki linaweza kumaanisha imani au uaminifu.
    reason: alternative_reading
  - marker: b
    text: “Matokeo” pia yanaweza kutafsiriwa “mwisho”; katika baadhi ya tafsiri, linaeleweka kuwa namna walivyokufa.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μνημονεύετε
  choice: Wakumbukeni
  rationale: Amri ya wakati uliopo inahimiza kuendelea kuwakumbuka; “wakumbukeni” ni ya kawaida na ya moja kwa moja katika Kiswahili.
- source_word: τῶν ἡγουμένων ὑμῶν
  choice: viongozi wenu
  rationale: Hurejelea watu waliokuwa na jukumu la kuongoza jumuiya; “viongozi” huonyesha mamlaka bila kuleta maana ya kisiasa ya “watawala.”
- source_word: οἵτινες ἐλάλησαν ὑμῖν τὸν λόγον τοῦ θεοῦ
  choice: waliosema neno la Mungu kwenu
  rationale: Huhifadhi maana ya kawaida ya λαλέω, yaani kusema, na usemi wa kibiblia “neno la Mungu,” bila kuongeza dhana mahususi zaidi ya kuhubiri.
- source_word: ἀναθεωροῦντες
  choice: Mnapotafakari kwa makini
  rationale: Kitenzi hiki kinamaanisha kutazama au kufikiria jambo kwa umakini; tafsiri hii inaonyesha uchunguzi wenye tafakari.
- source_word: τὴν ἔκβασιν
  choice: matokeo
  rationale: Neno hili linaweza kumaanisha matokeo au mwisho. “Matokeo” huhifadhi upana wa maana bila kudai kwamba kifungu kinarejelea hasa kifo chao.
- source_word: τῆς ἀναστροφῆς
  choice: ya mwenendo wao wa maisha
  rationale: ἀναστροφή hurejelea mwenendo au namna ya kuishi; usemi huu ni wazi kwa msomaji wa sasa na unahusisha tabia pamoja na maisha yao kwa ujumla.
- source_word: μιμεῖσθε
  choice: igeni
  rationale: Ni amri ya moja kwa moja ya kufuata mfano wa mtu; “igeni” ni tafsiri fupi na sahihi.
- source_word: τὴν πίστιν
  choice: imani yao
  rationale: πίστις inaweza kumaanisha imani au uaminifu. “Imani” inafaa katika matini kuu, huku uwezekano wa “uaminifu” ukihifadhiwa katika tanbihi.
theological_decisions:
- issue: Maana ya πίστις inaposemwa kuwa sifa ya wanadamu ya kuigwa
  choice: imani yao
  alternative: uaminifu wao
  rationale: Muktadha unaruhusu maana ya imani au uaminifu. Matini kuu inatumia “imani,” lakini tanbihi inadumisha mvutano halisi wa kimaana.
- issue: Kama ἔκβασις humaanisha hasa kifo au kuuawa kwa viongozi hao
  choice: matokeo
  alternative: mwisho; au, kwa baadhi ya tafsiri, namna walivyokufa
  rationale: Neno la Kigiriki linaweza kuonyesha mwisho au matokeo ya maisha yao, lakini mstari wenyewe hautaji wazi kifo wala kuuawa. “Matokeo” huepuka kuingiza dai la kihistoria lisilotajwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Mpangilio wa sentensi unafuata hoja ya Kigiriki huku ukitumia muundo wa kawaida wa Kiswahili. Alama za tanbihi zimewekwa kwenye maneno yanayohusika moja kwa moja.
