base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/011.yaml
  text: For the bodies of those animals whose blood is brought into the holy places for sin by the high priest are burned outside the camp[a][b].
translation:
  language: sw
  text: Kwa maana miili ya wanyama ambao damu yao huletwa ndani ya mahali patakatifu[a] kwa ajili ya dhambi kwa njia ya kuhani mkuu huchomwa[b] nje ya kambi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ndani ya patakatifu.” Kigiriki hutumia usemi wa wingi, “ndani ya mahali/sehemu takatifu,” usemi wa kiibada unaorejelea eneo takatifu la patakatifu.
    reason: lexical_alternative
  - marker: b
    text: Au, “huteketezwa kabisa.” Kitenzi cha Kigiriki kinaweza kusisitiza kuchomwa kikamilifu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧν ... ζῴων / τούτων τὰ σώματα
  choice: miili ya wanyama wale ambao
  rationale: Muundo huu unaonyesha wazi uhusiano kati ya wanyama wa dhabihu na damu yao, huku ukihifadhi muundo wa urejeshi wa Kigiriki kwa Kiswahili cha kawaida.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Kiunganishi hiki kinaonyesha kuwa mstari huu unatoa msingi au maelezo ya kauli iliyotangulia.
- source_word: εἰσφέρεται τὸ αἷμα
  choice: damu yao huletwa
  rationale: Huhifadhi hali ya kutendwa na tendo la kuingiza damu katika eneo la patakatifu.
- source_word: περὶ ἁμαρτίας
  choice: kwa ajili ya dhambi
  rationale: Huhifadhi uhusiano mpana na dhambi bila kuufanya moja kwa moja usemi maalumu zaidi wa ‘dhabihu ya dhambi.’
- source_word: εἰς τὰ ἅγια
  choice: ndani ya sehemu takatifu
  rationale: ‘Sehemu takatifu’ huhifadhi wingi wa usemi wa Kigiriki na maana yake ya eneo takatifu la ibada bila kuubana kuwa Patakatifu Zaidi.
- source_word: διὰ τοῦ ἀρχιερέως
  choice: na kuhani mkuu
  rationale: Katika sentensi ya kutendwa, ‘na’ huonyesha kwa kawaida kwamba kuhani mkuu ndiye anayeleta damu.
- source_word: κατακαίεται
  choice: huchomwa
  rationale: Hutoa tendo la kuchomwa kwa lugha ya kawaida; uwezekano wa msisitizo wa kuchomwa kabisa umehifadhiwa katika tanbihi.
- source_word: ἔξω τῆς παρεμβολῆς
  choice: nje ya kambi
  rationale: Ni usemi wa kawaida na sahihi kwa kambi ya Israeli katika mazingira ya hema na dhabihu.
theological_decisions:
- issue: Maana ya kiibada ya εἰς τὰ ἅγια
  choice: ndani ya sehemu takatifu
  alternative: ndani ya patakatifu; ndani ya Patakatifu Zaidi
  rationale: Kigiriki kinaweza kurejelea eneo takatifu la patakatifu kwa upana. Tafsiri haibainishi Patakatifu Zaidi kwa sababu mstari wenyewe haulazimishi maana hiyo nyembamba.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa heshima, wa sasa na unaoeleweka kwa urahisi. Msamiati wa kiibada umehifadhiwa bila kuongeza ubainisho wa kimadhehebu.
