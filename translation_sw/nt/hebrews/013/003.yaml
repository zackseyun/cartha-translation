  text: μιμνῄσκεσθε τῶν δεσμίων ὡς συνδεδεμένοι, τῶν κακουχουμένων ὡς καὶ αὐτοὶ ὄντες ἐν σώματι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/003.yaml
  text: Remember those in prison[a], as though imprisoned with them; those who are mistreated[b], since you yourselves also are in the body.
translation:
  language: sw
  text: Wakumbukeni walio gerezani[a], kana kwamba mmefungwa pamoja nao; na wale wanaotendewa vibaya, kwa kuwa ninyi wenyewe pia mko katika mwili[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wafungwa.” Kigiriki huleta moja kwa moja taswira ya watu waliofungwa kwa vifungo.
    reason: lexical_alternative
  - marker: b
    text: Huenda “katika mwili” ikarejelea kuwa sehemu ya mwili wa Kristo; lakini inaelekea zaidi kurejelea hali ya kawaida ya wanadamu kuwa na mwili na hivyo kuwa katika hatari ya kuteseka.
    reason: alternative_reading
lexical_decisions:
- source_word: μιμνῄσκεσθε
  choice: Wakumbukeni
  rationale: Kitenzi hiki ni amri ya wakati uliopo kwa wingi na kinahimiza kuendelea kuwakumbuka. Katika Kiswahili, “Wakumbukeni” ni amri ya kawaida na ya asili ambayo muktadha unaweza kuipa maana ya tendo linaloendelea.
- source_word: τῶν δεσμίων
  choice: walio gerezani
  rationale: δέσμιος humaanisha mtu aliyefungwa, mara nyingi mfungwa. “Walio gerezani” ni Kiswahili cha sasa kinachoeleweka kwa urahisi, huku tanbihi ikihifadhi taswira ya kufungwa kwa minyororo au vifungo.
- source_word: ὡς συνδεδεμένοι
  choice: kana kwamba mmefungwa pamoja nao
  rationale: Kitenzi συνδέομαι huleta taswira ya kufungwa pamoja na wengine. Tafsiri hii inaonyesha mshikamano wa kina na wafungwa bila kuifanya kuwa kumbukumbu ya kiakili tu.
- source_word: τῶν κακουχουμένων
  choice: wale wanaotendewa vibaya
  rationale: κακουχέομαι hueleza kutendewa vibaya, kuonewa, au kuteswa na wengine. Usemi huu ni wazi, wa kawaida, na unahifadhi hali ya kupokea mateso kutoka kwa wengine.
- source_word: ὡς καὶ αὐτοὶ ὄντες ἐν σώματι
  choice: kwa kuwa ninyi wenyewe pia mko katika mwili
  rationale: Usemi ἐν σώματι kwa maana ya moja kwa moja ni “katika mwili.” Tafsiri hii inadumisha usemi huo na uwazi wake wa kitafsiri, huku “kwa kuwa” ikionyesha nguvu yake ya kutoa sababu katika muktadha.
theological_decisions:
- issue: Maana ya “katika mwili” (ἐν σώματι)
  choice: hali ya kawaida ya wanadamu kuwa na mwili na hivyo kuwa katika hatari ya kuteseka
  alternative: kuwa sehemu ya mwili wa Kristo
  rationale: Katika muktadha wa kuwasihi waumini wawajali wafungwa na wanaotendewa vibaya, maana inayowezekana zaidi ni udhaifu wa kimwili unaoshirikiwa na wanadamu. Hata hivyo, maneno halisi “mko katika mwili” yamehifadhiwa ili kutofunga uwezekano wa mwangwi wa ushirika katika mwili wa Kristo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi, lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi unahifadhi usawa wa mawaidha mawili na mvutano wa maana katika usemi “mko katika mwili.”
