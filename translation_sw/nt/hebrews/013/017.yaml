source:
  edition: SBLGNT
  text: Πείθεσθε τοῖς ἡγουμένοις ὑμῶν καὶ ὑπείκετε, αὐτοὶ γὰρ ἀγρυπνοῦσιν ὑπὲρ τῶν ψυχῶν ὑμῶν ὡς λόγον ἀποδώσοντες, ἵνα μετὰ χαρᾶς τοῦτο ποιῶσιν καὶ μὴ στενάζοντες, ἀλυσιτελὲς γὰρ ὑμῖν τοῦτο.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/017.yaml
  text: Be persuaded by your leaders and yield to them[a], for they are keeping watch over your souls as those who will give an account, so that they may do this with joy and not with groaning, for this would be unprofitable for you.
translation:
  language: sw
  text: Kubali kushawishiwa na viongozi wenu[a], na muwape nafasi, kwa maana wanakesha kwa ajili ya nafsi zenu kama watu watakaotoa hesabu, ili wafanye hivyo kwa furaha, wala si kwa kuugua; kwa maana hilo halina faida kwenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Watiini viongozi wenu.” Kitenzi cha Kigiriki kinachotafsiriwa “kubali kushawishiwa” kinaweza pia kumaanisha “kutii,” ingawa kwa maana yake ya msingi hudokeza kukubali kushawishiwa au kushindwa moyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πείθεσθε
  choice: Washawishikeni na
  rationale: Kauli hii inaweza kumaanisha kutii, lakini umbo lake hapa pia lina wazo la kukubali kushawishiwa. Tafsiri hii inadumisha mwitikio wa hiari kwa uongozi bila kuifanya amri ya utii usio na mipaka.
- source_word: ἡγουμένοις
  choice: viongozi wenu
  rationale: Neno hili linawarejelea watu wanaoongoza jumuiya; “viongozi” ni Kiswahili cha kawaida na haliongezi dhana kali ya utawala.
- source_word: ὑπείκετε
  choice: muwakubalie
  rationale: Kitenzi kina maana ya kupisha, kukubali au kujinyenyekeza. “Muwakubalie” ni cha asili katika Kiswahili na kinatofautisha wazo hili na kushawishika katika kitenzi cha kwanza.
- source_word: ἀγρυπνοῦσιν
  choice: wanazilinda
  rationale: Kitenzi kina picha ya kukesha kwa uangalifu. “Wanazilinda” kinaonyesha uangalizi endelevu, ingawa sitiari ya kutokulala haijaonyeshwa moja kwa moja.
- source_word: ψυχῶν
  choice: nafsi zenu
  rationale: ψυχή inaweza kumaanisha nafsi, uhai au mtu. “Nafsi” inadumisha uzito wa kiroho wa kirai huku muktadha ukiruhusu uangalizi wa mtu mzima.
- source_word: ὡς λόγον ἀποδώσοντες
  choice: kama watu watakaotoa hesabu
  rationale: Kirai hiki kinadumisha wajibu wa baadaye wa viongozi wa kutoa hesabu, unaodokeza uwajibikaji mbele za Mungu bila kuongeza maneno yasiyokuwapo wazi katika mstari.
- source_word: μετὰ χαρᾶς
  choice: kwa furaha
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja ya kirai hiki.
- source_word: στενάζοντες
  choice: kwa kuugua
  rationale: “Kuugua” kinahifadhi picha halisi ya kusononeka kwa sauti badala ya kuibadili tu kuwa huzuni.
- source_word: ἀλυσιτελὲς
  choice: halingekuwa na faida
  rationale: Kivumishi hiki humaanisha lisilo na manufaa. Usemi huu ni wa kawaida katika Kiswahili na hauelekei kwenye maana kali zaidi ya ‘lenye madhara.’
theological_decisions:
- issue: Asili ya mwito kuhusu viongozi wa jumuiya ya waamini
  choice: Mstari unahimiza kukubali kushawishiwa na kuwakubalia viongozi wanaowajibika kwa uangalizi wao.
  alternative: Amri ya kuwatii viongozi kwa namna isiyo na masharti.
  rationale: Vitenzi viwili Πείθεσθε na ὑπείκετε vinaonyesha mwitikio wa kukubali ushawishi na kupisha, huku sababu inayofuata ikiweka uongozi huo ndani ya uwajibikaji wa viongozi kwa ajili ya nafsi za waamini.
- issue: Mhusika wa tendo katika ἵνα μετὰ χαρᾶς τοῦτο ποιῶσιν
  choice: Waamini wafanye kwa namna inayowawezesha viongozi kutekeleza uangalizi wao kwa furaha.
  alternative: Viongozi pekee ndio wanaoamriwa wafanye uangalizi kwa furaha.
  rationale: Kisarufi, ποιῶσιν inawarejelea viongozi, lakini sentensi ya kusudi inategemea mwitikio unaoagizwa kwa wasikilizaji. “Fanyeni hivyo ili...” huweka uhusiano huo wazi bila kubadili mhusika wa utekelezaji wa wajibu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Maneno “nafsi,” “kutoa hesabu,” na “kuugua” yanadumisha uzito na picha za maandishi ya Kigiriki; tanbihi inahifadhi tafsiri mbadala iliyozoeleka ya Πείθεσθε.
