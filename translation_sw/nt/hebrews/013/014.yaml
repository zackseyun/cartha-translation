  yaml_path: translation/nt/hebrews/013/014.yaml
  text: For we do not have a lasting city here[a], but we seek the one that is to come.
translation:
  language: sw
  text: Kwa maana hapa hatuna mji unaodumu, bali tunautafuta ule utakaokuja.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri iliyo karibu zaidi na muundo wa Kigiriki, “mji unaokuja” au “mji ujao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ γὰρ
  choice: Kwa maana ... hatuna
  rationale: “Kwa maana” huonyesha kwamba mstari huu unatoa sababu au maelezo yanayohusiana na himizo lililotangulia; “hatuna” huwasilisha ukanushi wa kitenzi kwa Kiswahili cha kawaida.
- source_word: ἔχομεν
  choice: tuna (katika “hatuna”)
  rationale: Kitenzi cha kawaida “kuwa na” ndicho kinachowasilisha kwa urahisi maana ya kuwa au kumiliki kitu.
- source_word: ὧδε
  choice: hapa
  rationale: Huhifadhi maana ya moja kwa moja ya kielezi cha mahali bila kuifasiri zaidi kuwa “duniani.”
- source_word: μένουσαν
  choice: unaodumu
  rationale: Hueleza mji unaobaki au unaoendelea kuwapo, na huhifadhi utofauti wake na mji wa wakati ujao.
- source_word: πόλιν
  choice: mji
  rationale: Neno halisi la picha hii linahifadhiwa bila kulipanua kuwa “mbingu,” “nchi,” au “makao.”
- source_word: ἀλλὰ
  choice: bali
  rationale: “Bali” huonyesha kwa kawaida na kwa nguvu utofauti kati ya kutokuwa na mji wa kudumu hapa na kuutafuta ule ujao.
- source_word: τὴν μέλλουσαν
  choice: ule utakaokuja
  rationale: Kiwakilishi “ule” kinarejelea “mji,” huku “utakaokuja” kikihifadhi mwelekeo wa wakati ujao wa kirai cha Kigiriki bila kurudia nomino kwa namna isiyo ya lazima.
- source_word: ἐπιζητοῦμεν
  choice: tunautafuta
  rationale: Hutoa maana ya kutafuta au kuelekeza jitihada kwa kitu. Umbo lenye kiambishi cha yambwa “-u-” huonyesha wazi kwamba kinachotafutwa ni mji huo.
theological_decisions:
- issue: Maana ya picha ya “mji”
  choice: Kudumisha neno “mji” kama lilivyo katika mstari
  alternative: mbingu; mji wa mbinguni; Yerusalemu wa mbinguni
  rationale: Ingawa sehemu nyingine za Waebrania zinaendeleza picha ya mji wa mbinguni, mstari huu hautaji moja kwa moja mbingu wala Yerusalemu. Tafsiri hii kwa hiyo haiingizi ufafanuzi mpana zaidi katika matini.
- issue: Uhusiano kati ya mji wa hapa na mji ujao
  choice: Kuhifadhi utofauti kati ya “mji unaodumu” na “ule utakaokuja”
  alternative: Kufafanua mji wa sasa kuwa mji wa kidunia na ujao kuwa makao ya milele
  rationale: Matini yenyewe inasisitiza kutodumu kwa mji wa hapa na kutafutwa kwa ule ujao, bila kufafanua kikamilifu asili ya kila mmoja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. “Kwa maana” hudumisha uhusiano wa hoja na muktadha uliotangulia; “unaodumu” ni la kawaida zaidi kuliko maneno mazito kama “unaokaa daima.” Alama ya tanbihi imewekwa baada ya kirai inachokifafanua.
