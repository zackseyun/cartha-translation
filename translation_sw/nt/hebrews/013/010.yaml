  text: Tuna madhabahu ambayo wale wanaohudumu katika hema hawana haki ya kula kutoka humo[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa maana iliyo wazi zaidi, “wale wanaofanya huduma ya ibada katika hema.” Maneno haya yanawahusu wale wanaofanya huduma katika patakatifu pa agano la kale.
    reason: lexical_alternative
  - marker: b
    text: Neno “madhabahu” limefasiriwa kwa njia mbalimbali kuwa Kristo mwenyewe, msalaba, madhabahu ya mbinguni, au manufaa ya dhabihu ya Kristo. Kigiriki kinaacha taswira hiyo bila kuifafanua zaidi hapa.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔχομεν
  choice: Tuna
  rationale: Kitenzi cha wakati wa sasa kinawahusisha mwandishi na wasomaji wake katika hali ya kuwa na madhabahu hii.
- source_word: θυσιαστήριον
  choice: madhabahu
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa mahali pa kutolea dhabihu; linahifadhi taswira ya ibada bila kuifasiri moja kwa moja kuwa Kristo, msalaba, au dhabihu.
- source_word: ἐξ οὗ
  choice: kutoka kwake
  rationale: Muundo huu unaonyesha chanzo cha kile kinacholiwa na unahifadhi taswira ya kula kutoka madhabahuni.
- source_word: φαγεῖν
  choice: kula
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kitenzi hiki katika muktadha wa kushiriki chakula cha dhabihu.
- source_word: οὐκ ἔχουσιν ἐξουσίαν
  choice: hawana haki
  rationale: Katika muktadha huu, ἐξουσία inaonyesha haki au ruhusa halali ya kushiriki, si uwezo wa kimwili.
- source_word: οἱ τῇ σκηνῇ λατρεύοντες
  choice: wale wanaohudumu katika hema
  rationale: λατρεύω hapa ina maana ya huduma ya ibada, nayo σκηνή inarejelea hema la ibada katika mfumo wa agano la kale. Neno 'hema' linahifadhi taswira ya Kigiriki na linaeleweka kwa wasomaji wa Kiswahili.
theological_decisions:
- issue: Kitu kinachorejelewa na neno “madhabahu” katika Waebrania 13:10
  choice: Kubakiza neno halisi “madhabahu” bila kufafanua rejeo lake katika matini kuu.
  alternative: Kulieleza kuwa Kristo mwenyewe, msalaba, madhabahu ya mbinguni, au manufaa ya dhabihu ya Kristo.
  rationale: Kigiriki kinataja taswira ya madhabahu bila kuifafanua zaidi hapa. Kubakiza taswira hiyo kunahifadhi utata halisi na mvutano wa kiteolojia bila kuingiza fasiri finyu katika matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wa heshima na unaoeleweka. “Hema” limetumiwa badala ya mkopo mzito zaidi, huku tanbihi ikifafanua kuwa ni patakatifu pa agano la kale. Alama zote za tanbihi zimewekwa katika matini kuu.
