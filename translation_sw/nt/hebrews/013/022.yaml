source:
  edition: SBLGNT
  text: Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί, ἀνέχεσθε τοῦ λόγου τῆς παρακλήσεως, καὶ γὰρ διὰ βραχέων ἐπέστειλα ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/022.yaml
  text: I urge you[a], brothers, bear with this word of exhortation[b], for I have written to you briefly.
translation:
  language: sw
  text: Nawasihi, ndugu[a], livumilieni neno hili la mawaidha[b], kwa maana nimewaandikia kwa ufupi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno “ndugu” linaweza kulihusu kusanyiko lote, wanaume na wanawake.
    reason: lexical_alternative
  - marker: b
    text: “Neno la mawaidha” linaweza pia kutafsiriwa “ujumbe wa kuhimiza” au “ujumbe wa kutia moyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: Nawasihi
  rationale: Kitenzi hiki hapa ni ombi la dhati kwa wasomaji; “nawasihi” ni Kiswahili cha sasa, chenye heshima, kinachobeba maana ya kusihi au kuhimiza.
- source_word: δὲ
  choice: —
  rationale: Chembe hii inaonyesha mpito hafifu. Haijatafsiriwa kwa neno maalumu kwa sababu mtiririko wa Kiswahili katika hitimisho hili unaonyesha mpito huo bila kuingiza tofauti kali kama “lakini” au dhana ya wakati kama “sasa.”
- source_word: ἀδελφοί
  choice: ndugu
  rationale: “Ndugu” ni neno la kawaida la Kiswahili kwa washiriki wa jumuiya moja na, tofauti na Kiingereza, linaweza kuwahusu wanaume na wanawake bila kuondoa taswira ya kifamilia ya Kigiriki.
- source_word: ἀνέχεσθε
  choice: mvumilie
  rationale: Huhifadhi wazo la kulipokea kwa subira na kustahimili ujumbe huu; ni lenye nguvu zaidi kuliko “lisikilizeni” na si la mazungumzo mno kama “livumilieni tu.”
- source_word: τοῦ λόγου τῆς παρακλήσεως
  choice: neno hili la mausia
  rationale: “Neno” huwakilisha λόγος kama ujumbe unaowasilishwa, na “mausia” hubeba himizo au nasaha nzito. “Hili” linafanya rejeo kwa maandishi ya sasa kuwa la kawaida katika Kiswahili, ingawa halina kionyeshi cha moja kwa moja katika Kigiriki.
- source_word: καὶ γὰρ
  choice: kwa maana
  rationale: Muungano huu unatoa sababu inayounga mkono ombi lililotangulia; “kwa maana” huwasilisha uhusiano huo kwa Kiswahili cha kawaida bila kutafsiri kila chembe kimitambo.
- source_word: διὰ βραχέων
  choice: kwa ufupi
  rationale: Ni tafsiri ya kawaida ya nahau inayomaanisha kwa maneno machache au kwa ufupi.
- source_word: ἐπέστειλα ὑμῖν
  choice: nimewaandikia
  rationale: Kauli timilifu ya Kiswahili inafaa kwa maandishi yaliyo mikononi mwa wapokeaji, huku kiambishi “-wa-” kikionyesha kwamba aliwaandikia wao.
theological_decisions:
- issue: Ujumuishaji wa kijinsia katika ἀδελφοί
  choice: ndugu
  alternative: ndugu wa kiume; ndugu wa kiume na wa kike
  rationale: Katika Kiswahili, “ndugu” yenyewe si ya jinsia maalumu na inaweza kulitaja kusanyiko lote. Hivyo inadumisha lugha ya kifamilia bila kuamua kwamba walioandikiwa walikuwa wanaume pekee.
- issue: Maana ya παράκλησις
  choice: mausia
  alternative: himizo; faraja
  rationale: Katika muktadha huu wa kutakiwa kuustahimili ujumbe mzima, “mausia” yanaonyesha nasaha yenye uzito. Hata hivyo neno la Kigiriki linaweza pia kusisitiza kuhimiza au kutia moyo, jambo linalohifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo ni wa moja kwa moja na unadumisha ombi la dhati, lugha ya kifamilia, na uwezekano wa παράκλησις kumaanisha mausia, himizo, au kutiwa moyo.
