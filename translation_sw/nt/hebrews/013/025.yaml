lexical_decisions:
- source_word: ἡ χάρις
  choice: Neema
  rationale: Katika salamu hii ya mwisho, χάρις ni baraka ya kawaida ya barua. Kiswahili cha asili hutumia “Neema” bila kujaribu kuwakilisha kibainishi cha Kigiriki kwa neno tofauti.
- source_word: μετὰ
  choice: iwe nanyi
  rationale: μετά pamoja na hali ya umilikishi humaanisha “pamoja na.” Kwa kuwa Kigiriki kimedondosha kitenzi katika tamko la baraka, “iwe nanyi” huwasilisha kwa kawaida maana ya ombi au baraka iliyodokezwa.
- source_word: πάντων ὑμῶν
  choice: nanyi nyote
  rationale: Usemi huu unawahusisha wazi wasikilizaji wote. “Nanyi nyote” ni wa kawaida katika Kiswahili na unadumisha msisitizo wa πάντων.
