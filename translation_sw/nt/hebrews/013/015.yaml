base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/015.yaml
  text: Therefore[a], through him let us continually offer up to God a sacrifice of praise—that is[c][b], the fruit of lips confessing his name.
translation:
  language: sw
  text: Basi, kwa njia yake, tumtolee Mungu daima[a] dhabihu ya sifa—yaani, matunda ya midomo[b] inayokiri[c] jina lake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakati wote” au “bila kukoma.”
    reason: lexical_alternative
  - marker: b
    text: Au “matunda ya midomo yetu.” Neno “yetu” linaweza kueleweka kutokana na muktadha, lakini halijaandikwa wazi katika Kigiriki.
    reason: lexical_alternative
  - marker: c
    text: Au “inayotambua waziwazi jina lake.” Kitenzi cha Kigiriki kinaweza kumaanisha kukiri au kutambua waziwazi.
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ αὐτοῦ
  choice: kwa njia yake
  rationale: Muundo διά pamoja na jenitivi unaonyesha njia au upatanishi. “Kwa njia yake” ni Kiswahili cha kawaida kinachohifadhi maana hiyo bila kufafanua kiwakilishi kuliko maandishi ya Kigiriki.
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Neno hili linaonyesha hitimisho au wito unaotokana na hoja iliyotangulia.
- source_word: ἀναφέρωμεν
  choice: na tumtolee
  rationale: Kitenzi hiki ni subjunktivi ya kuhimiza katika nafsi ya kwanza wingi. “Na tumtolee” kinawasilisha himizo na pia tendo la kumtolea Mungu dhabihu.
- source_word: θυσίαν αἰνέσεως
  choice: dhabihu ya sifa
  rationale: Tafsiri hii ni ya kawaida na yenye heshima, huku ikihifadhi taswira ya dhabihu na uhusiano wake na sifa.
- source_word: διὰ παντός
  choice: daima
  rationale: Kirai hiki humaanisha kuendelea au nyakati zote. “Daima” ni kifupi na cha asili katika muktadha huu.
- source_word: τῷ θεῷ
  choice: Mungu
  rationale: Datibu humtaja anayepokea dhabihu. Katika Kiswahili, anayepokea anaonyeshwa moja kwa moja ndani ya muundo “kumtolea Mungu.”
- source_word: τοῦτ’ ἔστιν
  choice: yaani
  rationale: “Yaani” huanzisha maelezo yanayobainisha dhabihu ya sifa ni nini.
- source_word: καρπὸν χειλέων
  choice: matunda ya midomo
  rationale: Tafsiri hii inadumisha sitiari ya matunda na mwangwi wa lugha ya Maandiko. Kiwakilishi “yetu” hakijaelezwa wazi katika Kigiriki.
- source_word: ὁμολογούντων
  choice: inayolikiri
  rationale: Kitenzi hiki kinaweza kumaanisha kukiri au kutambua waziwazi. “Inayolikiri” kinahifadhi wazo la tamko la wazi na kinaonyesha kuwa midomo ndiyo inayotenda kwa lugha ya kisitiari.
- source_word: τῷ ὀνόματι αὐτοῦ
  choice: jina lake
  rationale: Ingawa Kigiriki kina datibu baada ya ὁμολογέω, Kiswahili cha kawaida husema “kulikiri jina lake,” yaani kutangaza waziwazi yeye ni nani.
theological_decisions:
- issue: Anayerejelewa na “yake” katika δι’ αὐτοῦ
  choice: Kiwakilishi kimeachwa kuwa “yake”; katika muktadha kinamrejelea Yesu Kristo na kinaonyesha kuwa sifa hutolewa kwa Mungu kwa njia yake.
  alternative: Kutaja wazi “kwa njia ya Yesu” au kutafsiri kwa maana pana isiyoonyesha upatanishi.
  rationale: Muktadha wa karibu unamhusu Yesu na kazi yake ya kikuhani. Hata hivyo, kutobadili kiwakilishi kuwa jina kunahifadhi namna ambayo mstari wa Kigiriki umejieleza na hakufafanui zaidi ya maandishi.
- issue: Nguvu ya lugha ya dhabihu
  choice: Taswira halisi imehifadhiwa katika “tumtolee” na “dhabihu ya sifa.”
  alternative: Kurahisisha kuwa “tumsifu Mungu.”
  rationale: Mwandishi kwa makusudi anaeleza sifa kwa lugha ya dhabihu. Kuihifadhi kunadumisha uhusiano wa hoja na muktadha wa dhabihu bila kuongeza dai la kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wa heshima, na unaosomeka kwa urahisi. Muundo “na tumtolee” unatoa himizo la pamoja; “dhabihu ya sifa” na “matunda ya midomo” zinahifadhi sitiari kuu za maandishi ya asili.
