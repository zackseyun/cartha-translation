  text: Προσεύχεσθε περὶ ἡμῶν, ⸀πειθόμεθα γὰρ ὅτι καλὴν συνείδησιν ἔχομεν, ἐν πᾶσιν καλῶς θέλοντες ἀναστρέφεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/018.yaml
  text: Pray for us[a], for we are convinced that we have a good conscience[c][b], since we want to conduct ourselves well in everything.
translation:
  language: sw
  text: Tuombeeni, kwa maana tuna hakika[a] kwamba tuna dhamiri njema[b], kwa kuwa tunataka kuenenda vema katika mambo yote.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “tumesadiki.”
    reason: lexical_alternative
  - marker: b
    text: Au “dhamiri safi.”
    reason: lexical_alternative
  - marker: c
    text: Au “tukitaka kuenenda kwa heshima katika mambo yote.”
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: Προσεύχεσθε περὶ ἡμῶν
  choice: Tuombeeni
  rationale: Kitenzi cha kuomba kikiwa na περί pamoja na hali ya umilikishi humaanisha kuwaombea watu fulani. Umbo la Kiswahili “tu-ombe-eni” linaonyesha kwa kawaida kwamba waandikiwa wengi wanaombwa kuwaombea waandishi.
- source_word: πειθόμεθα
  choice: tuna hakika
  rationale: Katika muktadha huu umbo hili linaeleza usadikisho thabiti wa waandishi. “Tuna hakika” ni Kiswahili cha kawaida na chenye heshima, huku tanbihi ikihifadhi uwezekano wa kutafsiriwa “tumesadiki.”
- source_word: καλὴν συνείδησιν
  choice: dhamiri njema
  rationale: Tafsiri hii inahifadhi maana pana ya kivumishi καλὴν bila kuifupisha kuwa hali maalumu ya kutokuwa na hatia; “dhamiri safi” imeonyeshwa kama uwezekano katika tanbihi.
- source_word: ἐν πᾶσιν
  choice: katika mambo yote
  rationale: Usemi huu unaonyesha upeo mpana wa mwenendo na unasomeka kwa kawaida katika Kiswahili Sanifu.
- source_word: καλῶς
  choice: vema
  rationale: Kielezi “vema” kinahifadhi maana pana ya kufanya au kuishi kwa njia nzuri; “kwa heshima” kingekuwa tafsiri yenye ufafanuzi zaidi.
- source_word: θέλοντες
  choice: kwa kuwa tunataka
  rationale: Kirai hiki kinaonyesha nia inayoendelea. Kiswahili hiki kinaweka wazi uhusiano unaowezekana wa sababu au maelezo bila kudai ukamilifu wa maadili.
- source_word: ἀναστρέφεσθαι
  choice: kujiendesha
  rationale: Kitenzi hiki hapa kinahusu mwenendo au namna ya maisha. “Kujiendesha” kinahifadhi maana ya kimaadili kwa lugha inayoeleweka.
theological_decisions:
- issue: Uhusiano wa kirai θέλοντες na dai la kuwa na dhamiri njema
  choice: kwa kuwa tunataka kujiendesha vema katika mambo yote
  alternative: tukitaka kujiendesha vema katika mambo yote
  rationale: Kirai shirikishi cha Kigiriki kinaweza kueleweka kuwa cha sababu au cha maelezo, lakini uhusiano wake si wa lazima uwe wa sababu pekee. Tafsiri kuu ni ya kawaida katika Kiswahili, na tanbihi inahifadhi muundo usioamua uhusiano huo kwa nguvu zaidi. Haisemi kwamba waandishi hawana dhambi, bali inaeleza nia yao ya mwenendo mwema.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Tuombeeni” ni cha moja kwa moja na cha kawaida; “dhamiri njema” na “kujiendesha vema” huhifadhi upana wa maneno ya Kigiriki bila kuingiza msimamo wa kimadhehebu.
