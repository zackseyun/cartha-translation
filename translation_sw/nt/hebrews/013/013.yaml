  yaml_path: translation/nt/hebrews/013/013.yaml
  text: Therefore[a], let us go out to him outside the camp, bearing his reproach.
translation:
  language: sw
  text: Basi, na twende kwake nje ya kambi[a], tukiibeba fedheha yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nje ya mahali pa kupiga kambi.” Kirai hiki hukumbusha taswira ya dhabihu katika Mambo ya Walawi 16 na kukataliwa ambako Yesu alibeba nje ya mji.
    reason: mbadala wa kileksika; dokezo la taswira ya muktadha
lexical_decisions:
- source_word: τοίνυν
  choice: Kwa hiyo
  rationale: Kiunganishi hiki kinatoa hitimisho kutokana na hoja ya mistari 11–12; “Kwa hiyo” huhifadhi nguvu hiyo ya kimantiki kwa Kiswahili cha kawaida.
- source_word: ἐξερχώμεθα
  choice: na twende
  rationale: Ni hali ya utegemezi ya nafsi ya kwanza wingi yenye maana ya himizo. Katika muktadha huu “na twende” ni ya asili na huonyesha mwito wa kutoka kuelekea kwake.
- source_word: πρὸς αὐτὸν
  choice: kwake
  rationale: πρός pamoja na hali ya kushutumiwa huonyesha mwendo kuelekea kwa mtu; “kwake” ni fupi na ya kawaida, huku ikidumisha kiwakilishi cha Kigiriki.
- source_word: ἔξω τῆς παρεμβολῆς
  choice: nje ya kambi
  rationale: παρεμβολή humaanisha kambi au mahali pa kupiga kambi. “Kambi” huhifadhi taswira ya ibada na jangwani inayotokana na muktadha wa Waebrania.
- source_word: τὸν ὀνειδισμὸν αὐτοῦ
  choice: aibu aliyotwezwa
  rationale: ὀνειδισμός hujumuisha shutuma, fedheha, na aibu ya kijamii. “Aibu aliyotwezwa” huonyesha wazi kuwa ni aibu iliyomfikia yeye bila kubadili kiwakilishi kuwa jina.
- source_word: φέροντες
  choice: tukiibeba
  rationale: Kitenzi-shirikishi cha wakati uliopo huonyesha kushiriki kwa kuendelea katika aibu hiyo. “Tukiibeba” huhifadhi sitiari ya kubeba badala ya kuifafanua kuwa kuvumilia tu.
theological_decisions:
- issue: Mrejelewa wa “kwake” na “aliyotwezwa”
  choice: Viwakilishi vinadumishwa; katika muktadha vinamrejelea Yesu wa mstari wa 12.
  alternative: Kutaja wazi “Yesu” katika mstari huu.
  rationale: Kigiriki kinatumia kiwakilishi, na mrejelewa wake unaeleweka kutokana na muktadha wa karibu. Kutaja jina moja kwa moja kungeondoa muundo wa chanzo bila ulazima.
- issue: Maana ya “nje ya kambi”
  choice: Taswira halisi ya kambi inadumishwa.
  alternative: Nje ya mfumo wa kidini au nje ya jumuiya.
  rationale: Kirai hiki kinahusiana na dhabihu zilizotolewa nje ya kambi katika hoja ya mistari 11–12, pamoja na kukataliwa kwa Yesu. Kukifafanua kwa dhana moja tu kungepunguza upana wa taswira na mvutano wake wa kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imehifadhi himizo la pamoja, mwendo kuelekea kwake, taswira ya kambi, na sitiari ya kubeba aibu. Hakuna tanbihi iliyoongezwa kwa sababu mbadala “mahali pa kupiga kambi” hauhitajiki ili kuelewa maandishi na maelezo yaliyotolewa katika English POB hayalingani na alama yake kwenye neno “Therefore.”
