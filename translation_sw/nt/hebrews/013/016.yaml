base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/016.yaml
  text: And do not neglect doing good and sharing[b][a], for with such sacrifices God is pleased.
translation:
  language: sw
  text: Wala msisahau kutenda mema na kugawana na wengine[a], kwa maana Mungu hupendezwa na dhabihu kama hizo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuwa na ushirika.” Neno la Kigiriki linaweza pia kumaanisha kushiriki kwa ukarimu; katika muktadha huu huenda hasa linarejelea kugawana mali au rasilimali na wengine.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐποιΐας
  choice: kutenda mema
  rationale: Nomino hii inaonyesha tendo la kuwafanyia wengine mema. Kauli hii ni ya kawaida, wazi, na inadumisha nguvu ya kitendo katika Kigiriki.
- source_word: κοινωνίας
  choice: kushirikiana
  rationale: Katika muktadha huu neno linahusu kuwashirikisha wengine mali au rasilimali, lakini linaweza pia kuwa na maana pana ya ushirika. 'Kushirikiana' inadumisha upana huo bila kulifanya lihusu fedha pekee.
- source_word: μὴ ἐπιλανθάνεσθε
  choice: msisahau
  rationale: Hii ndiyo maana ya moja kwa moja ya kitenzi cha Kigiriki, na katika himizo hili inaeleweka pia kuwa wasipuuze kuyatenda mambo hayo.
- source_word: τοιαύταις ... θυσίαις
  choice: dhabihu kama hizo
  rationale: Inadumisha wazi sitiari ya dhabihu inayotumiwa kwa kutenda mema na kushirikiana.
- source_word: εὐαρεστεῖται
  choice: hupendezwa na
  rationale: Kauli hii ya Kiswahili inaeleza kwa kawaida kwamba dhabihu hizo zinampendeza Mungu.
- source_word: ὁ θεός
  choice: Mungu
  rationale: Hili ni tafsiri sanifu ya nomino inayotumika kama mtendaji wa sentensi.
- source_word: δὲ
  choice: Wala
  rationale: Katika mfululizo wa mahimizo, 'wala' huunganisha katazo hili kwa kawaida na yaliyotangulia bila kuleta utofautishaji mkali.
theological_decisions:
- issue: Maana ya 'dhabihu' katika mstari huu
  choice: Kutenda mema na kushirikiana kunatajwa kisitiari kuwa dhabihu zinazompendeza Mungu
  alternative: Kuona neno hili kuwa sadaka ya mali pekee, au kuliondoa kabisa wazo la dhabihu na kulifanya mwenendo mwema kwa jumla
  rationale: Kigiriki kinatumia wazi lugha ya dhabihu kwa matendo haya. Tafsiri inadumisha sitiari hiyo bila kuibana kuwa utoaji wa mali pekee wala kuondoa uzito wake wa ibada.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni rahisi kwa msomaji wa kawaida, huku ukidumisha lugha ya dhabihu na upana wa neno κοινωνία.
