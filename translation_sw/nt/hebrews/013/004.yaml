base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/004.yaml
  text: Let marriage be held in honor among all[a], and the marriage bed be undefiled[b], for God will judge the sexually immoral and adulterers.
translation:
  language: sw
  text: Ndoa iheshimiwe miongoni mwa watu wote[a][b], na kitanda cha ndoa kisiwe na unajisi, kwa maana Mungu atawahukumu waasherati na wazinzi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ndoa inaheshimika miongoni mwa watu wote.” Kigiriki hakina kitenzi dhahiri katika kishazi cha kwanza, kwa hiyo kinaweza kueleweka ama kama himizo ama kama taarifa.
    reason: alternative_reading
  - marker: b
    text: Au, “na watu wote,” badala ya “miongoni mwa watu wote.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τίμιος
  choice: na iheshimiwe
  rationale: Neno hili huonyesha kitu chenye thamani na kinachostahili heshima. Muundo wa kuhimiza unafaa mfululizo wa mawaidha katika Waebrania 13, huku uwezekano wa kauli ya taarifa ukihifadhiwa katika tanbihi.
- source_word: γάμος
  choice: ndoa
  rationale: Hapa neno linamaanisha hali au taasisi ya ndoa, si sherehe ya arusi.
- source_word: ἐν πᾶσιν
  choice: miongoni mwa watu wote
  rationale: Wingi huu unaeleweka kwa kawaida kuwa unawahusu watu. Tafsiri hii inadumisha upana wa maana bila kufafanua kupita kiasi ni kundi gani hasa linalokusudiwa.
- source_word: κοίτη
  choice: kitanda cha ndoa
  rationale: Ingawa maana ya moja kwa moja ni kitanda, hapa ni sitiari inayorejelea mahusiano ya kingono ndani ya ndoa; usemi huu ni wa kawaida na wenye staha katika Kiswahili.
- source_word: ἀμίαντος
  choice: kisitiwe unajisi
  rationale: Chaguo hili linadumisha maana ya kutotiwa doa au uchafu pamoja na uzito wa kimaadili wa neno la Kigiriki.
- source_word: πόρνους
  choice: waasherati
  rationale: Neno hili linataja kwa upana watu wanaojihusisha na uasherati; ni neno la Kiswahili linaloeleweka na linalofaa mtindo wa maandiko.
- source_word: μοιχοὺς
  choice: wazinzi
  rationale: Neno hili linawalenga hasa wanaovunja uaminifu wa ndoa kwa uzinzi, na hivyo linadumisha tofauti yake na kundi pana la waasherati.
- source_word: κρινεῖ
  choice: atawahukumu
  rationale: Wakati ujao wa kitenzi unadumishwa. 'Atawahukumu' haiongezi matokeo ambayo kitenzi cha Kigiriki hakiyataji wazi.
- source_word: γὰρ
  choice: kwa maana
  rationale: Kiunganishi hiki kinaonyesha sababu ya himizo lililotangulia kwa Kiswahili cha kawaida na chenye hadhi.
theological_decisions:
- issue: Iwapo kishazi cha kwanza ni taarifa au himizo
  choice: 'Himizo: “Ndoa na iheshimiwe”'
  alternative: 'Taarifa: “Ndoa inaheshimika”'
  rationale: Kigiriki hakina kitenzi dhahiri katika kishazi cha kwanza, hivyo maana zote mbili zinawezekana. Muktadha wa mawaidha ya haraka katika Waebrania 13 unaunga mkono himizo, lakini utata halisi umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye staha na uzito wa kimaadili. “Kitanda cha ndoa” kimetumiwa kama sitiari inayoeleweka bila kuwa wazi kupita kiasi.
