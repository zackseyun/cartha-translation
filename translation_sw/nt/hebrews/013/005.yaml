base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/005.yaml
  text: Let your way of life be free from the love of money[a], being content with what you have, for he himself has said, “I will never leave you[b], nor will I ever forsake you.”
translation:
  language: sw
  text: Mwenendo wenu usiwe wa kupenda fedha; mridhike na mlivyo navyo[a], kwa maana yeye mwenyewe amesema, “Sitakuacha kamwe[b], wala sitakutelekeza kamwe.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa ukaribu zaidi na maneno ya asili, “mridhike na vitu vilivyopo.” Katika muktadha huu humaanisha kuridhika na mlivyo navyo sasa.
    reason: lexical_alternative
  - marker: b
    text: Ahadi hii ina mwangwi wa hakikisho la Mungu katika Agano la Kale, hasa Kumbukumbu la Torati 31:6, 8 na Yoshua 1:5.
    reason: cross_reference
lexical_decisions:
- source_word: ἀφιλάργυρος ὁ τρόπος
  choice: Msiwe na tabia ya kupenda fedha
  rationale: Kirai hiki kinaagiza mwenendo usiotawaliwa na kupenda fedha. Muundo wa wingi unaendana na waandikiwa na ni wa kawaida katika Kiswahili.
- source_word: ἀρκούμενοι
  choice: mridhike
  rationale: Kitenzi hiki kinaendeleza agizo la mwanzo na kueleza hali ya kuridhika badala ya kutamani zaidi.
- source_word: τοῖς παροῦσιν
  choice: na mlivyo navyo
  rationale: Maana ya msingi ni vitu vilivyopo au vilivyo karibu; katika muktadha wa mali, Kiswahili cha kawaida husema ‘mlivyo navyo’ bila kuzuia maana kwa fedha peke yake.
- source_word: αὐτὸς γὰρ εἴρηκεν
  choice: kwa maana yeye mwenyewe amesema
  rationale: ‘Yeye mwenyewe’ huhifadhi msisitizo wa αὐτός, na wakati timilifu ‘amesema’ huonyesha kuwa kauli hiyo ina nguvu inayoendelea. Jina ‘Mungu’ halijaongezwa kwa kuwa halipo wazi katika Kigiriki.
- source_word: Οὐ μή σε ἀνῶ
  choice: Sitakuacha kamwe
  rationale: ‘Kamwe’ huwasilisha nguvu ya ukanushaji wa mkazo οὐ μή kwa Kiswahili cha asili.
- source_word: οὐδ’ οὐ μή σε ἐγκαταλίπω
  choice: wala sitakutupa kamwe
  rationale: ‘Kutupa’ hapa ni kumwacha au kumtelekeza mtu kabisa; pamoja na ‘kamwe’ huhifadhi ukanushaji wenye mkazo na kutofautisha kwa kiasi na ‘kuacha’ katika kishazi cha kwanza.
theological_decisions:
- issue: Utambulisho wa msemaji wa ahadi
  choice: yeye mwenyewe amesema
  alternative: Mungu mwenyewe amesema
  rationale: Muktadha unaonyesha kuwa msemaji ni Mungu, lakini maandishi ya Kigiriki yana kiwakilishi αὐτός, si nomino θεός. Kiwakilishi kinahifadhi umbo na msisitizo wa chanzo bila kuongeza jina lisilotajwa.
- issue: Nguvu ya ukanushaji maradufu katika ahadi
  choice: Sitakuacha kamwe, wala sitakutupa kamwe
  alternative: Hakika sitakuacha wala kukutupa
  rationale: Kurudia ‘kamwe’ katika kila kishazi kunawakilisha miundo miwili ya οὐ μή na kuhifadhi uhakika mkubwa wa ahadi kwa Kiswahili kinachoeleweka.
- issue: Mwangwi wa ahadi za agano katika Agano la Kale
  choice: Kuhifadhi mtindo wa ahadi bila kuingiza marejeo ndani ya matini
  alternative: Kumtaja Mungu na vifungu vya Agano la Kale moja kwa moja katika matini
  rationale: Dondoo linarejelea kwa mwangwi Kumbukumbu la Torati 31:6, 8 na Yoshua 1:5, lakini mwangwi huo unafaa kuelezwa katika tanbihi badala ya kupanua matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Tabia ya kupenda fedha’ ni wazi kwa wasomaji wa kawaida; ‘mridhike na mlivyo navyo’ ni ya asili kuliko tafsiri neno kwa neno. Alama zote za tanbihi zimewekwa katika matini kuu.
