base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/012.yaml
  text: Therefore Jesus also suffered outside the gate[b][a], so that he might sanctify the people through his own blood.
translation:
  language: sw
  text: Kwa hiyo Yesu pia aliteseka nje ya lango[b], ili awatakase[a] watu kwa damu yake mwenyewe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “awafanye watakatifu” au “awaweke wakfu.”
    reason: lexical_alternative
  - marker: b
    text: Kauli “nje ya lango” huenda inarejelea mahali nje ya Yerusalemu ambako Yesu aliteseka, na inakumbusha jinsi mabaki ya dhabihu yalivyoondolewa nje ya kambi au lango katika muktadha uliotangulia.
    reason: cross_reference
lexical_decisions:
- source_word: διὸ
  choice: Kwa hiyo
  rationale: Kiunganishi hiki kinaonyesha hitimisho linalotokana na hoja iliyotangulia; “Kwa hiyo” ni usemi wa kawaida na huhifadhi uhusiano huo wa kimantiki.
- source_word: καὶ
  choice: pia
  rationale: Neno hili linamhusisha Yesu na mfano wa dhabihu uliotajwa kabla; “pia” huhifadhi ulinganisho bila kuongeza msisitizo usio lazima.
- source_word: Ἰησοῦς
  choice: Yesu
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
- source_word: ἵνα ἁγιάσῃ
  choice: ili awatakase
  rationale: Muundo wa ἵνα pamoja na kitenzi tegemezi unaonyesha kusudi. “Awatakase” huhifadhi maana ya kidini na ya dhabihu ya ἁγιάζω, huku maelezo mbadala yakitolewa katika tanbihi.
- source_word: διὰ τοῦ ἰδίου αἵματος
  choice: kwa damu yake mwenyewe
  rationale: διά pamoja na hali ya umilikishi huonyesha njia au chombo. “Kwa damu yake mwenyewe” ni Kiswahili cha asili kinachohifadhi msisitizo wa ἰδίου na taswira ya dhabihu.
- source_word: τὸν λαόν
  choice: watu
  rationale: Kigiriki kinasema “watu” bila kuongeza waziwazi “wa Mungu.” Tafsiri hii huhifadhi upeo wa maneno ya chanzo bila kuingiza ufafanuzi katika matini kuu.
- source_word: ἔξω τῆς πύλης
  choice: nje ya lango
  rationale: Umoja wa “lango” unalingana na Kigiriki. Kauli hii inadokeza eneo nje ya Yerusalemu bila kuongeza neno “mji,” ambalo halimo katika matini.
- source_word: ἔπαθεν
  choice: aliteseka
  rationale: Kitenzi hiki kinaeleza kwa ufupi kwamba Yesu alipata mateso; “aliteseka” ni tafsiri ya moja kwa moja na ya kawaida.
theological_decisions:
- issue: Maana ya ἁγιάζω katika muktadha wa dhabihu
  choice: awatakase
  alternative: awafanye watakatifu; awaweke wakfu
  rationale: “Awatakase” huhifadhi maana ya kidini na ya agano katika Waebrania bila kuibana iwe fundisho maalumu la dhehebu. Tanbihi inaonyesha kwamba neno hilo pia linaweza kuelezwa kama kuwafanya watakatifu au kuwaweka wakfu.
- issue: Upeo wa τὸν λαόν
  choice: watu
  alternative: watu wa Mungu
  rationale: Muktadha unadokeza watu wa agano wa Mungu, lakini Kigiriki chenyewe hakiongezi “wa Mungu.” Matini kuu kwa hiyo haipanui usemi huo kimafafanuzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imepangwa kwa mtiririko wa kawaida wa Kiswahili huku ikihifadhi uhusiano wa hitimisho, kusudi, njia ya utakaso, na taswira ya dhabihu.
