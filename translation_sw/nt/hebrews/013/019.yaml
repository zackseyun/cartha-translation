  text: And I urge you all the more to do this[a], so that I may be restored to you sooner.
translation:
  language: sw
  text: Nami nawasihi zaidi mfanye hivyo, ili nirejeshwe kwenu mapema zaidi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nirudishwe kwenu.” Neno la Kigiriki linaweza kumaanisha kwa ujumla kurejeshwa kwa waandikiwa, bila kubainisha hali hasa.
    reason: lexical_alternative
lexical_decisions:
- source_word: περισσοτέρως
  choice: sana zaidi
  rationale: Kielezi hiki cha ulinganisho kinatia nguvu ombi; “sana zaidi” huhifadhi wazo la msisitizo ulioongezeka katika Kiswahili cha kawaida.
- source_word: δὲ
  choice: Nami
  rationale: Hapa δέ inaunganisha kwa upole na sentensi iliyotangulia, bila kuonyesha upinzani mkali; “Nami” huendeleza mtiririko wa mawaidha kwa kawaida.
- source_word: παρακαλῶ
  choice: nawasihi
  rationale: Kitenzi kinaonyesha ombi la dhati lenye msisitizo; “nawasihi” ni la heshima na lina nguvu inayofaa.
- source_word: τοῦτο ποιῆσαι
  choice: mfanye hivyo
  rationale: Maneno haya yanarejelea ombi lililotangulia la kuwaombea; “mfanye hivyo” huhifadhi urejeo huo bila kurudia maelezo.
- source_word: ἵνα
  choice: ili
  rationale: Huanzisha kusudi la ombi, na “ili” ni kiunganishi cha kawaida na sahihi katika Kiswahili.
- source_word: τάχιον
  choice: upesi zaidi
  rationale: Kielezi hiki ni cha ulinganisho, “mapema/upesi zaidi”; “upesi zaidi” huhifadhi wazi nguvu hiyo ya ulinganisho.
- source_word: ἀποκατασταθῶ
  choice: nirudishwe
  rationale: Kauli tendwa inaweza kumaanisha kurejeshwa au kurudishwa kwa wasomaji. “Nirudishwe” huhifadhi kauli tendwa na kutotaja sababu au hali mahsusi.
- source_word: ὑμῖν
  choice: kwenu
  rationale: Huonyesha kurejeshwa kwa walengwa au katika uwepo wao; “kwenu” ni ya asili na inafaa katika muktadha.
theological_decisions:
- issue: Maana ya kurejeshwa kwa mwandishi kwa wasomaji
  choice: Ombi la jumla kwamba arudishwe kwao, bila kutaja hali hasa
  alternative: Kuachiliwa gerezani, kurudi baada ya safari au kutengana, au kurejeshwa katika huduma miongoni mwao
  rationale: Neno la Kigiriki ἀποκατασταθῶ ὑμῖν halibainishi sababu iliyomzuia wala namna atakavyorudi. Tafsiri haiongezi mazingira ya kihistoria ambayo maandishi yenyewe hayasemi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa ombi la dhati na kauli tendwa umehifadhiwa; tanbihi inadumisha upana wa maana ya kitenzi cha Kigiriki.
