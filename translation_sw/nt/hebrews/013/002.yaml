  text: τῆς φιλοξενίας μὴ ἐπιλανθάνεσθε, διὰ ταύτης γὰρ ἔλαθόν τινες ξενίσαντες ἀγγέλους.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/002.yaml
  text: Do not neglect hospitality[a], for through it some have entertained angels without knowing it.
translation:
  language: sw
  text: Msisahau kuwakaribisha wageni, kwa maana kwa kufanya hivyo wengine waliwakaribisha malaika bila kujua.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wengine waliwakaribisha wajumbe bila kujua.” Neno la Kigiriki linaweza kumaanisha “malaika” au “wajumbe,” ingawa hapa “malaika” inafaa zaidi kwa sababu huenda mwandishi anadokeza masimulizi ya watu waliowakaribisha wageni wa mbinguni.
    reason: lexical_alternative
lexical_decisions:
- source_word: φιλοξενίας
  choice: kuwakaribisha wageni
  rationale: Neno hilo linamaanisha upendo au ukarimu kwa wageni. Usemi huu wa Kiswahili ni wa kawaida na unaweka wazi kwamba ukarimu unaoagizwa unawahusu wageni.
- source_word: μὴ ἐπιλανθάνεσθε
  choice: Msisahau
  rationale: Kitenzi kinaweza kumaanisha kusahau au kupuuza. Katika himizo hili, “msisahau” ni usemi wa asili unaodokeza kuendelea kutenda jambo hilo, bila kuongeza wazo lisilokuwamo katika matini.
- source_word: διὰ ταύτης
  choice: kwa kufanya hivyo
  rationale: Kiwakilishi kinarejelea tendo la kuwakaribisha wageni. Tafsiri hii inaonyesha njia au tendo ambalo kupitia hilo jambo lilitokea.
- source_word: ἔλαθόν
  choice: bila kujua
  rationale: Muundo wa λανθάνω pamoja na kitenzi-shirikishi unaonyesha kwamba tendo lilifanyika bila wahusika kulitambua.
- source_word: τινες
  choice: wengine
  rationale: Hili ni neno la kawaida la Kiswahili kwa kundi lisilotajwa wazi ndani ya watu wengi.
- source_word: ξενίσαντες
  choice: waliwakaribisha
  rationale: Kitenzi kinamaanisha kupokea au kukaribisha wageni. “Waliwakaribisha” ni wazi na cha asili katika Kiswahili.
- source_word: ἀγγέλους
  choice: malaika
  rationale: Ingawa neno la Kigiriki linaweza pia kumaanisha wajumbe, dokezo linalowezekana la masimulizi ya Mwanzo 18–19 linaunga mkono maana ya viumbe wa mbinguni. Maana nyingine imehifadhiwa katika tanbihi.
theological_decisions:
- issue: Maana ya ἀγγέλους
  choice: malaika kwa maana ya viumbe wa mbinguni
  alternative: wajumbe wa kibinadamu
  rationale: Muktadha na dokezo linalowezekana la watu waliowapokea wageni wa mbinguni katika masimulizi ya Agano la Kale vinaifanya “malaika” kuwa tafsiri inayofaa zaidi, huku uwezekano wa kileksika wa “wajumbe” ukihifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wa heshima na unaoeleweka kwa wasomaji wa kawaida. Kurudiwa kwa mzizi wa “karibisha” kunaakisi uhusiano wa maneno ya Kigiriki φιλοξενία na ξενίζω bila kufanya sentensi kuwa ngumu.
