  text: Ἡ φιλαδελφία μενέτω.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/001.yaml
  text: Let brotherly love continue[a].
translation:
  language: sw
  text: Upendo wa kindugu na udumu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “upendo kwa waamini wenzenu.” Neno la Kigiriki linamaanisha upendo wa kifamilia ndani ya jumuiya ya waamini, si upendo kwa wanaume pekee.
    reason: lexical_alternative
lexical_decisions:
- source_word: φιλαδελφία
  choice: upendo wa kindugu
  rationale: Neno hili linaeleza upendo wa kifamilia kati ya ndugu; katika matumizi ya Kikristo linawahusu waamini wote, si wanaume pekee. “Upendo wa kindugu” huhifadhi taswira ya familia na ni Kiswahili cha kawaida na chenye hadhi.
- source_word: μενέτω
  choice: na udumu
  rationale: Kauli ya amri ya wakati uliopo inatoa wito wa hali inayoendelea. “Na udumu” huhifadhi nguvu ya himizo pamoja na maana ya kuendelea kuwapo.
- source_word: Ἡ
  choice: imewakilishwa kwa kutambulisha “upendo wa kindugu” kama fadhila inayojulikana
  rationale: Kibainishi cha Kigiriki hulitambulisha wazo hili kuwa jambo maalumu linalojulikana kwa wasomaji. Kiswahili hakihitaji neno tofauti linalolingana na kibainishi hicho hapa.
theological_decisions:
- issue: Upeo wa φιλαδελφία na lugha ya kifamilia
  choice: upendo wa kindugu
  alternative: upendo kwa waamini wenzenu; kupendana
  rationale: Tafsiri hii huhifadhi sitiari ya familia iliyomo katika Kigiriki bila kuifanya ihusu wanaume pekee. Tanbihi inaeleza kwamba jumuiya yote ya waamini inakusudiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; sentensi ni fupi, ya sasa, yenye hadhi na rahisi kueleweka. Muundo “na udumu” umetumiwa kama himizo la kuendeleza hali iliyopo.
