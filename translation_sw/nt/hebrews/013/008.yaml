  yaml_path: translation/nt/hebrews/013/008.yaml
  text: Jesus the Messiah is the same yesterday and today and forever[a].
translation:
  language: sw
  text: Yesu Masihi ni yeye yule jana na leo na hata milele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yesu Kristo ni yeye yule jana na leo na hata milele.” Jina la cheo la Kigiriki Χριστός linaweza kutafsiriwa “Masihi” au kutoholewa “Kristo.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰησοῦς
  choice: Yesu
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
- source_word: Χριστὸς
  choice: Masihi
  rationale: Neno la Kigiriki ni jina la cheo linalomaanisha aliyetiwa mafuta; “Masihi” linawasilisha maana hiyo kwa Kiswahili, huku “Kristo” likitajwa katika tanbihi kama umbo mbadala lililozoeleka.
- source_word: ἐχθὲς
  choice: jana
  rationale: Kielezi cha wakati kimetafsiriwa moja kwa moja na kuhifadhi mpangilio wa nyakati katika sentensi.
- source_word: σήμερον
  choice: leo
  rationale: Tafsiri ya moja kwa moja inayolingana kwa kawaida na “jana” katika Kiswahili.
- source_word: ὁ αὐτός
  choice: ni yeye yule
  rationale: Usemi huu wa kawaida wa Kiswahili unaonyesha kwamba utambulisho na hali yake havibadiliki, bila kuongeza maelezo ya kiitikadi.
- source_word: εἰς τοὺς αἰῶνας
  choice: hata milele
  rationale: Ni usemi wa asili wa Kiswahili unaowasilisha kudumu bila mwisho; “hata” pia hudumisha msisitizo wa kilele cha mfuatano wa nyakati.
- source_word: καὶ ... καὶ ... καὶ
  choice: na ... na ... na hata
  rationale: Viunganishi vya mfuatano vimehifadhiwa kwa namna ya kawaida ya Kiswahili, huku “na hata milele” ikitoa kilele cha kimahadhi kinacholingana na maana ya Kigiriki.
theological_decisions:
- issue: Nguvu ya kikristo ya kauli kuhusu kutobadilika kwa Yesu
  choice: Kutafsiri moja kwa moja kwamba Yesu Masihi ni yeye yule katika nyakati zote.
  alternative: Kupanua kauli kuwa maelezo ya wazi kuhusu kutobadilika kwa asili yake au uungu wake.
  rationale: Kigiriki kinathibitisha wazi uendelevu wa utambulisho wake, lakini hakifafanui hapa hitimisho pana la kidogma; tafsiri haipaswi kuliongeza.
- issue: Χριστός kama jina la cheo au umbo lililotoholewa
  choice: Masihi
  alternative: Kristo
  rationale: “Masihi” hutafsiri cheo hicho, lakini “Kristo” ni umbo la kawaida katika mapokeo ya Kiswahili; uwezekano huo halisi umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni fupi, yenye hadhi na inayoeleweka kwa wasomaji wa kawaida. Muundo “ni yeye yule” ni wa asili na hudumisha msisitizo wa Kigiriki. Kiswahili hakina kibainishi bainifu kinacholingana na “the,” hivyo “Yesu Masihi” ni muundo wa kawaida wa jina pamoja na cheo.
