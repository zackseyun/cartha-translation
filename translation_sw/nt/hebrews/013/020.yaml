id: HEB.13.20
reference: Hebrews 13:20
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ὁ δὲ θεὸς τῆς εἰρήνης, ὁ ἀναγαγὼν ἐκ νεκρῶν τὸν ποιμένα τῶν προβάτων τὸν μέγαν ἐν αἵματι διαθήκης αἰωνίου, τὸν κύριον ἡμῶν Ἰησοῦν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/020.yaml
  text: May the God of peace[a], who brought up from the dead our Lord Jesus, the great shepherd of the sheep, by the blood of an eternal covenant,
translation:
  language: sw
  text: Mungu wa amani, aliyemrudisha kutoka kwa wafu Bwana wetu Yesu, Mchungaji mkuu wa kondoo, kwa damu ya agano la milele[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliyemrudisha kutoka kwa wafu Bwana wetu Yesu ... kupitia damu ya agano la milele.” Kigiriki kinaruhusu kishazi “kwa/katika damu ya agano la milele” kuhusishwa kwa namna tofauti kidogo na tendo la kumrudisha Yesu au na maelezo yake kama Mchungaji mkuu.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὁ δὲ
  choice: Mungu
  rationale: δέ inaashiria mpito kuelekea sala ya baraka, lakini Kiswahili hakihitaji kiunganishi maalumu hapa; kuanza moja kwa moja na “Mungu” ni kwa kawaida na hakuongezi dhana ya wakati ambayo haipo wazi katika Kigiriki.
- source_word: θεὸς τῆς εἰρήνης
  choice: Mungu wa amani
  rationale: Huhifadhi muundo na maana ya Mungu anayehusishwa na amani kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: ὁ ἀναγαγὼν
  choice: aliyemrudisha
  rationale: Kitenzi ἀνάγω kina wazo la kuleta au kurudisha juu; katika muktadha wa ufufuo, “aliyemrudisha” ni cha kawaida na huhifadhi kwa kiasi taswira ya kumtoa Yesu kutoka kwa wafu bila kupanua maana.
- source_word: ἐκ νεκρῶν
  choice: kutoka kwa wafu
  rationale: Ni usemi wa kawaida wa Kiswahili kwa formula ya Kigiriki inayohusu ufufuo kutoka miongoni mwa wafu.
- source_word: τὸν ποιμένα τῶν προβάτων τὸν μέγαν
  choice: Mchungaji mkuu wa kondoo
  rationale: Huhifadhi sitiari ya kichungaji, nomino halisi “kondoo,” na msisitizo wa τὸν μέγαν.
- source_word: ἐν αἵματι
  choice: kwa damu
  rationale: “Kwa” inaweza kuonyesha chombo, msingi, au uhusiano bila kufafanua kupita kiasi kazi ya damu katika kishazi hiki.
- source_word: διαθήκης αἰωνίου
  choice: ya agano la milele
  rationale: “Agano” linafaa katika hoja ya Waebrania kuhusu διαθήκη; “la milele” ni Kiswahili cha kawaida kwa αἰωνίου. Kutotumia kiainishi maalumu kunahifadhi hali ya usemi wa Kigiriki usio na kiainishi.
- source_word: τὸν κύριον ἡμῶν Ἰησοῦν
  choice: Bwana wetu Yesu
  rationale: Huhifadhi cheo κύριος na uhusiano unaoonyeshwa na ἡμῶν, huku ikimtambulisha wazi yule aliyerudishwa kutoka kwa wafu.
theological_decisions:
- issue: Uhusiano wa ἐν αἵματι διαθήκης αἰωνίου na sehemu nyingine za sentensi
  choice: Kishazi “kwa damu ya agano la milele” kimewekwa baada ya maelezo ya Yesu ili kiweze kusomwa hasa pamoja na tendo la Mungu la kumrudisha kutoka kwa wafu, bila kufunga kabisa uhusiano wake na “Mchungaji mkuu.”
  alternative: 'Kukifungamanisha wazi na cheo cha Yesu: “Mchungaji mkuu wa kondoo kwa damu ya agano la milele,” au kusema kwa uwazi zaidi kwamba Mungu alimfufua “kupitia damu.”'
  rationale: Mpangilio wa Kigiriki unaruhusu zaidi ya uchanganuzi mmoja. Tafsiri na tanbihi zinahifadhi utata huo badala ya kuamua kwa siri jinsi damu ya agano inavyohusiana na ufufuo au utambulisho wa Mchungaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Aya ni sehemu ya sentensi inayoendelea katika mstari unaofuata, kwa hiyo imeachwa na koma na haijaongezewa kitenzi cha ombi ambacho hakimo katika mstari huu.
