  text: where your fathers tested me by trial and saw my works[b][a],
translation:
  language: sw
  text: ambapo baba zenu walinijaribu kwa kunipima[a], na wakaona matendo yangu[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “baba zenu walinijaribu kwa kunijaribu,” au “waliniweka kwenye jaribio.” Kirai cha Kigiriki ἐν δοκιμασίᾳ ni kigumu na kinaweza kueleza namna au njia iliyotumiwa.
    reason: lexical_alternative
  - marker: b
    text: 'Baadhi ya tafsiri huonyesha hali ya kukinzana: “na bado wakaona matendo yangu” au “ingawa waliona matendo yangu.” Kigiriki kinasema tu “na wakaona.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗ
  choice: ambapo
  rationale: Kielezi hiki cha uhusiano kinaelekeza kwenye mahali pa jangwani palipotajwa katika muktadha; “ambapo” huhifadhi maana ya mahali bila kuibadili kuwa ya wakati.
- source_word: ἐπείρασαν
  choice: walinijaribu
  rationale: Kitenzi kinaonyesha kumjaribu au kumweka Mungu kwenye jaribio kwa namna ya uchokozi. Kiambishi cha yambwa “-ni-” kinaweka wazi yambwa anayeeleweka katika muktadha.
- source_word: οἱ πατέρες ὑμῶν
  choice: baba zenu
  rationale: Tafsiri hii ya moja kwa moja huhifadhi lugha ya kihistoria na ya agano ya chanzo; katika muktadha inawahusu waliowatangulia wasikilizaji.
- source_word: ἐν δοκιμασίᾳ
  choice: kwa kunipima
  rationale: Kirai hiki kigumu kinaweza kuonyesha namna au njia ya tendo. “Kwa kunipima” ni Kiswahili cha kawaida na huhifadhi wazo la kupima au kuthibitisha bila kuficha utata wake.
- source_word: καὶ εἶδον
  choice: na wakaona
  rationale: καί ni kiunganishi cha kawaida, kwa hiyo maandishi makuu hayakiongezi kiashiria cha hali ya kukinzana kama “ingawa” au “lakini bado.”
- source_word: τὰ ἔργα μου
  choice: matendo yangu
  rationale: “Matendo” hueleza kazi na vitendo vya Mungu jangwani kwa lugha ya asili na yenye hadhi.
theological_decisions:
- issue: Yambwa la tendo la kujaribu
  choice: walinijaribu
  alternative: walijaribu
  rationale: Ingawa SBLGNT haina kiwakilishi huru cha yambwa katika kishazi hiki, muktadha wa nukuu kutoka Zaburi 95 unaonyesha kuwa Mungu ndiye anayejaribiwa. Kiswahili kinahitaji yambwa hilo lielezwe ili maana iwe wazi na ya kawaida.
- issue: Uhusiano wa “wakaona” na tendo lililotangulia
  choice: na wakaona
  alternative: ingawa waliona
  rationale: Maandishi ya Kigiriki yana καί tu. Tafsiri haiongezi uhusiano wa kukinzana ambao unatokana na ufafanuzi wa muktadha, bali inaueleza katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Baba zenu” huhifadhi mtindo wa kihistoria wa nukuu, huku “kwa kunipima” ikitoa kirai kinachoeleweka bila kuondoa ugumu wa asili. Alama za tanbihi zimewekwa karibu na maneno yanayohusika.
