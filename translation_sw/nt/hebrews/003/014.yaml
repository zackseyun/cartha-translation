  yaml_path: translation/nt/hebrews/003/014.yaml
  text: For we have become sharers in the Messiah, if indeed we hold the beginning of our assurance firm to the end.
translation:
  language: sw
  text: Kwa maana tumekuwa washiriki wa Masihi[a], ikiwa kwa kweli tutaendelea kushikilia imara mpaka mwisho uhakika tuliokuwa nao tangu mwanzo[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wenye sehemu katika Masihi” au “washirika wa Masihi.”
    reason: lexical_alternative
  - marker: b
    text: Au “ujasiri” au “uthabiti wa imani.” Neno la Kigiriki linaweza pia kumaanisha “uhakika”; katika miktadha mingine linaweza kuwa “hali halisi” au “kiini.”
    reason: lexical_alternative
  - marker: c
    text: 'Kwa kufuata muundo wa Kigiriki kwa karibu zaidi: “tukishikilia imara mpaka mwisho mwanzo wa uhakika wetu.”'
    reason: structural_alternative
lexical_decisions:
- source_word: μέτοχοι
  choice: washiriki
  rationale: Neno hili linamaanisha watu wanaoshiriki katika jambo au kuwa na sehemu ndani yake. “Washiriki” ni Kiswahili cha sasa, cha kawaida, na kinahifadhi maana ya ushirika bila kulazimisha aina maalumu ya uhusiano.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Kiunganishi hiki kinatoa sababu au maelezo yanayohusiana na onyo lililotangulia.
- source_word: τοῦ Χριστοῦ
  choice: wa Masihi
  rationale: Hapa Χριστός inafanya kazi kama cheo cha yule aliyeahidiwa; “Masihi” huhifadhi maana hiyo wazi.
- source_word: γεγόναμεν
  choice: tumekuwa
  rationale: Kauli ya wakati timilifu inaonyesha hali ya sasa iliyotokana na jambo lililotokea; “tumekuwa” huhifadhi wazo la kuingia katika hali hiyo na kuendelea kuwamo.
- source_word: ἐάνπερ
  choice: ikiwa kwa kweli
  rationale: Huhifadhi sharti pamoja na msisitizo unaoletwa na chembe -περ.
- source_word: τὴν ἀρχὴν τῆς ὑποστάσεως
  choice: uhakika wetu wa tangu mwanzo
  rationale: Hii ni njia ya asili ya Kiswahili ya kueleza uhakika waliokuwa nao mwanzoni. Tanbihi inahifadhi muundo wa karibu zaidi na Kigiriki pamoja na uwezekano mwingine wa maana ya ὑπόστασις.
- source_word: μέχρι τέλους
  choice: mpaka mwisho
  rationale: Kirai hiki kinaonyesha kudumu katika mwendo wote hadi mwisho.
- source_word: βεβαίαν κατάσχωμεν
  choice: tunaushikilia imara
  rationale: Kitenzi kina maana ya kuendelea kushika au kutunza, na kivumishi kinaonyesha uthabiti. Muundo huu ni wa kawaida katika Kiswahili na huhifadhi wazo la kudumu.
theological_decisions:
- issue: Sharti na kudumu katika imani
  choice: Sharti limehifadhiwa moja kwa moja kwa maneno “ikiwa kwa kweli” bila kueleza mfumo fulani wa kiteolojia kuhusu kudumu, kuasi, au uthibitisho wa wokovu.
  alternative: Kutafsiri sharti kuwa ushahidi tu wa ushirika wa zamani, au kuwa tamko la kwamba ushirika unabaki tu kwa kudumu.
  rationale: Kigiriki kinatoa sharti la kweli lakini hakisuluhishi chenyewe mijadala ya baadaye kuhusu uhusiano kamili kati ya ushirika na kudumu.
- issue: Uhusiano unaoonyeshwa na μέτοχοι τοῦ Χριστοῦ
  choice: “washiriki wa Masihi”
  alternative: “wenye sehemu katika Masihi” au “washirika pamoja na Masihi”
  rationale: Kirai cha Kigiriki kinaweza kueleweka kama kushiriki katika Masihi au kuwa na sehemu inayohusiana naye. Tafsiri iliyochaguliwa huhifadhi upana huo bila kufafanua zaidi ya matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Tunaushikilia imara” limetumiwa badala ya muundo mzito wa neno kwa neno, huku tanbihi ikihifadhi muundo na utata wa Kigiriki.
