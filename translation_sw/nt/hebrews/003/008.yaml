  yaml_path: translation/nt/hebrews/003/008.yaml
  text: do not harden your hearts as in the rebellion[a], as on the day of testing in the wilderness,
translation:
  language: sw
  text: msiifanye mioyo yenu kuwa migumu kama katika ule uasi[a], kama siku ile ya jaribu jangwani,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata majina ya mahali katika maandishi ya Kiebrania ya Zaburi 95:8, “kama huko Meriba, kama siku ile ya Masa jangwani.”
    reason: alternative_reading
lexical_decisions:
- source_word: μὴ σκληρύνητε
  choice: msifanye ... kuwa migumu
  rationale: Muundo huu ni katazo la moja kwa moja na unahifadhi kauli tendaji, hivyo unaonyesha wajibu wa wasikilizaji katika kuifanya mioyo yao kuwa migumu.
- source_word: τὰς καρδίας ὑμῶν
  choice: mioyo yenu
  rationale: ‘Mioyo’ ni istilahi ya kawaida ya kibiblia kwa utu wa ndani, ikihusisha nia, fikra na mwelekeo, na ‘yenu’ inadumisha usemi wa moja kwa moja kwa jumuiya.
- source_word: ὡς ἐν τῷ παραπικρασμῷ
  choice: kama katika ule uasi
  rationale: παραπικρασμός inaweza kumaanisha uchokozi au uasi; katika muktadha huu inaeleza uasi wa Israeli uliomchokoza Mungu. ‘Ule’ unaelekeza kwenye tukio la kihistoria linalojulikana.
- source_word: κατὰ τὴν ἡμέραν τοῦ πειρασμοῦ
  choice: kama siku ile ya jaribu
  rationale: ‘Kama’ inadumisha ulinganisho wa κατά na kifungu kilichotangulia. ‘Jaribu’ linahifadhi upana wa πειρασμός bila kuamua kimyakimya kama mkazo ni kujaribiwa, kupimwa, au kumjaribu Mungu; muktadha unaendelea kulifafanua.
- source_word: ἐν τῇ ἐρήμῳ
  choice: jangwani
  rationale: ‘Jangwani’ ni usemi wa kawaida na wenye mwangwi wa kibiblia kwa eneo la kutanga kwa Israeli.
theological_decisions:
- issue: Namna ya kutafsiri dokezo la kihistoria la Zaburi 95
  choice: Kutafsiri nomino za Kigiriki kwa maelezo, ‘ule uasi’ na ‘siku ile ya jaribu,’ katika maandishi makuu.
  alternative: kama huko Meriba, siku ile huko Masa jangwani
  rationale: Waebrania anafuata maneno ya Kigiriki ya Zaburi 94(95):8 LXX, ambayo yanatafsiri majina ya mahali ya Kiebrania kwa nomino zenye maana. Maandishi makuu yanafuata Kigiriki, huku tanbihi ikihifadhi msingi muhimu wa Kiebrania.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo unabaki wa kinukuu cha Maandiko bila kuwa mgumu kupita kiasi; ‘jaribu’ linadumisha mvutano wa kimaana wa neno la Kigiriki.
