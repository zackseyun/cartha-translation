  text: βλέπετε, ἀδελφοί, μήποτε ἔσται ἔν τινι ὑμῶν καρδία πονηρὰ ἀπιστίας ἐν τῷ ἀποστῆναι ἀπὸ θεοῦ ζῶντος,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/012.yaml
  text: Watch out[a], brothers[c][b], lest there be in any of you an evil heart of unbelief in turning away from the living God.
translation:
  language: sw
  text: Jihadharini, ndugu[a], isije ikawa kwamba yeyote miongoni mwenu ana moyo mwovu wa kutokuamini[b] katika kumwacha Mungu aliye hai.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno “ndugu” hapa linawataja waamini wenzao na linaweza kujumuisha wanaume na wanawake.
    reason: lexical_alternative
  - marker: b
    text: Au, “moyo mwovu usio na imani” au “moyo mwovu usio mwaminifu.”
    reason: alternative_reading
  - marker: c
    text: Au, “katika kujitenga na” au “katika kugeuka kutoka kwa Mungu aliye hai.”
    reason: alternative_reading
lexical_decisions:
- source_word: βλέπετε
  choice: Jihadharini
  rationale: Ni amri ya wakati uliopo kwa wingi yenye onyo la kuwa macho; “Jihadharini” ni ya kawaida na ina nguvu inayofaa katika Kiswahili.
- source_word: ἀδελφοί
  choice: ndugu
  rationale: “Ndugu” ni mwito wa kawaida wa kibiblia kwa waamini wenzake na katika Kiswahili inaweza kujumuisha wanaume na wanawake bila kupoteza wazo la undugu.
- source_word: μήποτε ἔσται ἔν τινι ὑμῶν
  choice: ili asiwepo yeyote miongoni mwenu aliye na
  rationale: Muundo huu wa Kiswahili huwasilisha onyo kuhusu uwezekano wa hali hiyo kutokea kwa mtu yeyote katika jumuiya.
- source_word: καρδία πονηρὰ
  choice: moyo mwovu
  rationale: “Moyo” huhifadhi taswira ya kibiblia ya kitovu cha mawazo, nia na mapenzi; “mwovu” huonyesha ubaya wa kimaadili.
- source_word: ἀπιστίας
  choice: wa kutokuamini
  rationale: Katika muktadha wa Waebrania 3, neno hili hasa linahusu kutoliamini neno la Mungu, huku uwezekano wa maana ya kutokuwa mwaminifu ukitambuliwa katika tanbihi.
- source_word: ἐν τῷ ἀποστῆναι
  choice: kwa kumwacha
  rationale: Huwasilisha tendo la kujiondoa au kugeuka kutoka kwa Mungu kwa lugha ya kawaida, bila kuingiza istilahi ya kiteolojia yenye maana finyu zaidi.
- source_word: ἀπὸ θεοῦ ζῶντος
  choice: Mungu aliye hai
  rationale: Ni usemi wa kibiblia unaomtambulisha Mungu wa kweli na kuhifadhi msisitizo wa ζῶντος.
theological_decisions:
- issue: Ikiwa ἀπιστίας itafsiriwe kama kutokuamini au kutokuwa mwaminifu
  choice: kutokuamini
  alternative: kutokuwa mwaminifu
  rationale: Muktadha wa karibu unasisitiza kushindwa kuamini sauti na ahadi ya Mungu, lakini tanbihi inadumisha upana wa maana unaowezekana.
- issue: Ikiwa ἀποστῆναι itafsiriwe kwa istilahi kali ya kuasi imani
  choice: kumwacha
  alternative: kujitenga na / kumwasi
  rationale: “Kumwacha” ni wazi na nzito lakini hailazimishi maana ya kiufundi ya uasi wa imani; tanbihi huhifadhi mbadala zinazowezekana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inadumisha sauti ya onyo na taswira ya “moyo” huku ikiepuka istilahi za kimadhehebu au za kiufundi zisizolazimishwa na maandishi ya Kigiriki.
