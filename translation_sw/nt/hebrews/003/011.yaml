translation:
  language: sw
  text: kama nilivyoapa katika ghadhabu yangu[a], “Hawataingia kamwe katika pumziko langu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maneno halisi, Kigiriki kinasema, “Ikiwa wataingia katika pumziko langu,” ambayo ni fomula ya kiapo yenye maana, “Hakika hawataingia katika pumziko langu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: kama
  rationale: Huunganisha kauli hii na muktadha wa nukuu iliyotangulia kwa maana ya ‘kama’ au ‘jinsi’; pia huhifadhi umbo la sentensi linaloendelea kutoka mstari uliotangulia.
- source_word: ὤμοσα
  choice: nilivyoapa
  rationale: Kitenzi ὀμνύω humaanisha kuapa; umbo hili linaendana kiasili na kiunganishi ‘kama’ na linaonyesha tendo lililofanyika.
- source_word: ἐν τῇ ὀργῇ μου
  choice: katika ghadhabu yangu
  rationale: ‘Ghadhabu’ huhifadhi uzito wa hasira ya Mungu katika hukumu bila kuongeza ufafanuzi wa kimadhehebu.
- source_word: Εἰ εἰσελεύσονται
  choice: Hawataingia kamwe
  rationale: 'Hii ni fomula ya kiapo yenye εἰ pamoja na wakati ujao. Ingawa kwa maneno halisi ni ‘ikiwa wataingia,’ maana yake ya kiidioma ni katazo thabiti: hakika hawataingia.'
- source_word: εἰς τὴν κατάπαυσίν μου
  choice: katika pumziko langu
  rationale: ‘Pumziko’ hudumisha neno kuu linaloendelezwa katika Waebrania bila kulifinyanga mapema kuwa nchi, mbingu, au amani ya ndani; ‘kuingia katika’ ni Kiswahili cha kawaida.
theological_decisions:
- issue: Fomula ya kiapo Εἰ εἰσελεύσονται
  choice: Hawataingia kamwe
  alternative: Ikiwa wataingia katika pumziko langu
  rationale: Tafsiri ya neno kwa neno ingeweza kusikika kama sharti la kawaida, ilhali ni fomula ya kiapo inayokanusha kwa mkazo. ‘Kamwe’ huwasilisha nguvu hiyo wazi.
- issue: Maana ya κατάπαυσις
  choice: pumziko
  alternative: mahali pangu pa kupumzika
  rationale: ‘Pumziko’ huhifadhi upana na mvutano wa wazo hili katika Zaburi 95 na hoja ya Waebrania, bila kulifanya mahali maalumu pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Ghadhabu’ limetumiwa kwa uzito wa muktadha wa hukumu, na ‘pumziko’ limedumishwa kama neno kuu la hoja ya Waebrania.
