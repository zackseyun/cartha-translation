base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/003.yaml
  text: For this one has been counted worthy of more glory than Moses, just as the one who built the house has greater honor than the house.
translation:
  language: sw
  text: Kwa maana huyu amehesabiwa kuwa anastahili utukufu zaidi kuliko Musa, kwa kadiri yule aliyeijenga nyumba alivyo na heshima zaidi kuliko nyumba.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὗτος
  choice: huyu
  rationale: Kiwakilishi cha karibu kinadumisha rejeo la wazi kwa Yesu kutoka muktadha uliotangulia bila kuongeza jina lisilomo katika aya.
- source_word: πλείονος ... δόξης
  choice: utukufu mwingi kuliko
  rationale: Huonyesha ulinganisho wa kiasi cha utukufu kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: ἠξίωται
  choice: amehesabiwa kuwa anastahili
  rationale: Huhifadhi wazo la kutathminiwa au kuonwa kuwa anastahili, pamoja na hali kamilifu ya tendo.
- source_word: καθ’ ὅσον
  choice: kama vile
  rationale: Katika sentensi hii huanzisha ulinganisho unaoeleza msingi wa dai lililotangulia.
- source_word: ὁ κατασκευάσας
  choice: aliyeijenga
  rationale: Kitenzi kinaweza kumaanisha kujenga, kutayarisha, au kuunda; 'aliyeijenga' ni cha asili zaidi kwa mfano wa nyumba.
- source_word: οἶκος
  choice: nyumba
  rationale: Hudumisha taswira ya nyumba na pia uwezekano wa maana pana ya jamaa au kaya katika muktadha.
theological_decisions:
- issue: Utambulisho wa οὗτος
  choice: huyu
  alternative: Yesu
  rationale: Kutotaja 'Yesu' moja kwa moja kunahifadhi namna ya Kigiriki na kumwacha muktadha utoe rejeo.
- issue: Ulinganisho kati ya mjenzi na nyumba
  choice: nyumba yenyewe
  alternative: hiyo
  rationale: Kurudia 'nyumba' huweka hoja wazi bila kuamua hapa maana ya mfano huo beyond maneno ya aya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi; muundo umewekwa wazi kwa msomaji wa kawaida huku ulinganisho na taswira ya nyumba vikihifadhiwa.
