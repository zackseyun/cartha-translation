base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/010.yaml
  text: For forty years[a], therefore, I was provoked with this generation, and said, ‘They always go astray in their hearts[b], but they have not known my ways.’
translation:
  language: sw
  text: Kwa miaka arobaini[a]; kwa hiyo, nilichukizwa na kizazi hiki, nikasema, “Sikuzote hupotea mioyoni mwao[b], lakini wao hawakujua njia zangu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nilighadhibika na kizazi hiki”; kitenzi cha Kigiriki kinaweza kueleza kutoridhika sana, hata kuchukia au kusikia kinyaa.
    reason: lexical_alternative
  - marker: b
    text: Kigiriki, “katika moyo” (umoja), yaelekea kikikichukulia kizazi kuwa jumuiya moja.
    reason: lexical_alternative
lexical_decisions:
- source_word: τεσσεράκοντα ἔτη
  choice: Kwa miaka arobaini
  rationale: Kirai hiki kinaonyesha muda ulioendelea; ‘kwa miaka arobaini’ ni Kiswahili cha kawaida kinachohifadhi maana ya accusative ya muda.
- source_word: διὸ
  choice: kwa hiyo
  rationale: Kinaonyesha matokeo au hitimisho linalotokana na yaliyotangulia.
- source_word: προσώχθισα
  choice: nilichukizwa
  rationale: Kitenzi kinaonyesha kutoridhika sana, hata kuchukia au kusikia kinyaa; ‘nilichukizwa’ huhifadhi nguvu hiyo bila kuifunga kwenye hasira pekee.
- source_word: τῇ γενεᾷ ταύτῃ
  choice: na kizazi hiki
  rationale: Baada ya ‘nilichukizwa,’ kiunganishi ‘na’ ni cha kawaida katika Kiswahili na humtaja mhusika aliyesababisha chukizo.
- source_word: καὶ εἶπον
  choice: nikasema
  rationale: Muundo wa mfululizo wa vitendo ‘nikasema’ ni wa asili katika Kiswahili na hudumisha nafsi ya kwanza.
- source_word: Ἀεὶ πλανῶνται
  choice: Sikuzote wanapotoka
  rationale: ‘Sikuzote’ huonyesha mwenendo unaoendelea, na ‘wanapotoka’ huhifadhi picha ya kuiacha njia iliyo sawa.
- source_word: τῇ καρδίᾳ
  choice: mioyoni mwao
  rationale: Ingawa Kigiriki kina umoja wa kijumla, Kiswahili hutumia wingi kwa kawaida pamoja na ‘wao’; maana ya ndani ya fikra na nia inabaki wazi.
- source_word: αὐτοὶ δὲ
  choice: nao
  rationale: ‘Nao’ huonyesha mhusika kwa mkazo mdogo na inaweza kubeba tofauti ya δέ bila kufanya sentensi kuwa nzito.
- source_word: οὐκ ἔγνωσαν
  choice: hawakuzijua
  rationale: Wakati uliopita unaakisi aoristi ya nukuu, huku ‘kujua’ kikihifadhi uwezekano wa maana ya utambuzi wa kina, si kuelewa kiakili tu.
- source_word: τὰς ὁδούς μου
  choice: njia zangu
  rationale: Ni sitiari ya kawaida na iliyo wazi kuhusu namna za Mungu za kutenda na mwenendo anaoutaka.
theological_decisions:
- issue: Nguvu ya kutoridhika kwa Mungu katika προσώχθισα
  choice: nilichukizwa
  alternative: nilighadhibika; niliwachukia
  rationale: ‘Nilichukizwa’ huonyesha kutoridhika kwa Mungu kwa nguvu bila kupunguza neno kuwa hasira tu wala kulifanya liwe chuki kwa kiwango kisicholazimishwa na Kigiriki.
- issue: Umoja wa kijumla katika τῇ καρδίᾳ
  choice: mioyoni mwao
  alternative: moyoni mwao
  rationale: Kigiriki kina ‘moyo’ katika umoja, yaelekea kikikitazama kizazi kama jumuiya moja. Hata hivyo, ‘moyoni mwao’ pamoja na kiwakilishi cha wingi si muundo wa asili sana katika Kiswahili; wingi huwasilisha maana hiyo kwa uwazi. Tanbihi huhifadhi umbo la chanzo.
- issue: Maana ya οὐκ ἔγνωσαν
  choice: hawakuzijua
  alternative: hawakuzitambua; hawakuzielewa
  rationale: ‘Kujua’ huhifadhi mvutano kati ya ufahamu na kutokutambua kwa kina njia za Mungu, bila kuamua kuwa ni uelewa wa kiakili pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Nilichukizwa’ na ‘wanapotoka’ ni maneno yanayoeleweka kwa wasomaji wa kawaida huku yakihifadhi uzito na taswira ya chanzo.
