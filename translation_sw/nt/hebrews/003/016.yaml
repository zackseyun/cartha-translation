  text: τίνες γὰρ ἀκούσαντες παρεπίκραναν; ἀλλ’ οὐ πάντες οἱ ἐξελθόντες ἐξ Αἰγύπτου διὰ Μωϋσέως;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/016.yaml
  text: For who[a], when they heard, rebelled? Was it not all those who came out of Egypt through Moses?
translation:
  language: sw
  text: Kwa maana, ni nani[a] waliosikia kisha wakaasi? Je, si wote waliotoka Misri kupitia Musa?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ni nani waliosikia na wakamkasirisha?” (au “wakamhuzunisha?”). Kitenzi cha Kigiriki kinaweza kutafsiriwa kwa maana halisi zaidi kwa namna hii, lakini hapa kinahusu uasi wa Israeli uliomchokoza Mungu jangwani.
    reason: lexical_alternative
lexical_decisions:
- source_word: τίνες
  choice: ni nani
  rationale: Huanzisha swali la balagha kuhusu utambulisho wa walioasi; katika Kiswahili, “ni nani” linaweza kurejelea watu wengi kulingana na kitenzi cha wingi.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Huonyesha kuwa swali hili linaeleza na kuunga mkono hoja iliyotangulia.
- source_word: ἀκούσαντες
  choice: waliosikia kisha
  rationale: Huwasilisha kishirikishi cha aoristi kwa lugha ya kawaida na kudokeza kuwa kusikia kulit tangulia kuasi.
- source_word: παρεπίκραναν
  choice: wakaasi
  rationale: Katika muktadha wa kizazi cha jangwani, kitenzi hiki kinaeleza uasi wao uliomchokoza Mungu; “wakaasi” huwasilisha maana hiyo kwa uwazi.
- source_word: ἀλλ’ οὐ πάντες
  choice: Je, si wote
  rationale: Huhifadhi nguvu ya swali la balagha linalotarajia jibu la kukubali bila kulazimisha kiunganishi kizito cha upinzani.
- source_word: οἱ ἐξελθόντες ἐξ Αἰγύπτου
  choice: waliotoka Misri
  rationale: Ni usemi wa kawaida wa Kiswahili unaohifadhi maana ya kutoka nchini Misri.
- source_word: διὰ Μωϋσέως
  choice: kupitia Musa
  rationale: Huhifadhi wazo la Musa kuwa wakala au njia ambayo kutoka huko kulifanyika, bila kufafanua zaidi ya maandishi.
theological_decisions:
- issue: Maana ya παραπικραίνω katika muktadha wa kizazi cha jangwani
  choice: wakaasi
  alternative: wakamchokoza / wakatia uchungu
  rationale: “Wakaasi” huonyesha wazi tendo la kutomtii Mungu katika simulizi la jangwani. Tanbihi huhifadhi maana halisi zaidi ya kumchokoza au kutia uchungu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa maswali mawili ya balagha umehifadhiwa; msamiati umewekwa wazi kwa wasomaji wa kawaida bila kuondoa mvutano wa kimaana wa kitenzi cha Kigiriki.
