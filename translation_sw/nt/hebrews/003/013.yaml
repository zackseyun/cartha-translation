review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the adversative, reciprocal daily exhortation, the Psalm 95 allusion in “Leo,” and sin’s deceit as the means of hardening. However, “wakati huu” unnecessarily specifies what the Greek leaves implicit, and “asije akafanywa” uses an awkward perfect construction for the aorist passive subjunctive.
  naturalness: “Mhimizane kila siku” is natural Standard East African Swahili. “Ili mtu yeyote kati yenu asifanywe mgumu” is clearer and more idiomatic than “ili yeyote kati yenu asije akafanywa kuwa mgumu.”
  terminology: “Dhambi,” “udanganyifu,” and the quoted thematic “Leo” are suitable. The lexical-alternative note should not offer “shauriane,” which ordinarily means consult one another rather than exhort/encourage one another.
  issues:
  - severity: medium
    issue: Added specification in “wakati huu ungali unaitwa ‘Leo’”
    rationale: The Greek says literally that “Today” is called, with the temporal referent left compressed and thematic. “Wakati huu” is interpretive and is not needed for intelligible Swahili; retaining an implicit subject better preserves the source’s formulation.
  - severity: medium
    issue: “Asije akafanywa kuwa mgumu” is grammatically and stylistically cumbersome
    rationale: The Greek σκληρυνθῇ is an aorist passive subjunctive under ἵνα μή. “Asifanywe mgumu” directly expresses the negative purpose and passive sense without the incongruous perfect form “akafanywa.”
  - severity: low
    issue: Footnote a gives “shauriane” as a lexical alternative
    rationale: In normal modern Swahili, “shauriane” means deliberate or consult together; it is not a close contextual equivalent for παρακαλεῖτε. “Tiane moyo” and “sihiane” are more suitable alternatives.
  - severity: low
    issue: Footnote b says “linarudia wazo la Zaburi 95”
    rationale: The wording is more specifically an echo of the scriptural expression in Psalm 95, not merely a repetition of a general idea.
  revised_text: Bali mhimizane kila siku[b], maadamu bado inaitwa “Leo”[a], ili mtu yeyote kati yenu asifanywe mgumu kwa udanganyifu wa dhambi.
  revised_footnotes:
  - marker: a
    text: “Leo” linarejelea usemi wa Zaburi 95 na linamaanisha wakati wa sasa ambao mwito wa Mungu unapaswa kuitikiwa.
    reason: cross_reference
