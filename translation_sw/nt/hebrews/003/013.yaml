  rationale: The revision removes an unnecessary interpretive noun phrase, improves the Swahili expression of the Greek passive subjunctive, and corrects the lexical and cross-reference footnotes while retaining the source text’s ambiguity about the agent of hardening and the thematic force of “Leo.”
