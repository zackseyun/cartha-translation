  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀλλὰ παρακαλεῖτε ἑαυτοὺς καθ’ ἑκάστην ἡμέραν, ἄχρις οὗ τὸ Σήμερον καλεῖται, ἵνα μὴ σκληρυνθῇ ⸂τις ἐξ ὑμῶν⸃ ἀπάτῃ τῆς ἁμαρτίας·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/013.yaml
  text: But encourage one another every day[b][a], as long as it is called “Today,” so that none of you may be hardened by the deceitfulness of sin.
translation:
  language: sw
  text: Bali mhimizane kila siku[b], maadamu bado inaitwa “Leo”[a], ili mtu yeyote kati yenu asifanywe mgumu kwa udanganyifu wa dhambi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Leo” linarejelea usemi wa Zaburi 95 na linamaanisha wakati wa sasa ambao mwito wa Mungu unapaswa kuitikiwa.
    reason: cross_reference
  - marker: b
    text: Au, “tiane moyo” au “sihiane.” Kitenzi cha Kigiriki kinaweza kumaanisha kuhimiza, kusihi, au kutia moyo kulingana na muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Bali
  rationale: Inaonyesha tofauti yenye nguvu na onyo lililotangulia kwa lugha ya heshima na ya kawaida katika maandishi.
- source_word: παρακαλεῖτε
  choice: mhimizane
  rationale: Katika muktadha huu kitenzi kinahusu kuimarishana kwa himizo la kudumu; ‘mhimizane’ huhifadhi uzito wa wito bila kuufanya kuwa faraja tu.
- source_word: ἑαυτοὺς
  choice: -ane (mhimizane)
  rationale: Ingawa umbo la Kigiriki ni la kujirejelea, hapa lina maana ya kutendeana; kiambishi -ane huwasilisha kwa kawaida tendo la kila mmoja kwa mwenzake.
- source_word: καθ’ ἑκάστην ἡμέραν
  choice: kila siku
  rationale: Huwasilisha wazi tendo linalorudiwa siku baada ya siku.
- source_word: ἄχρις οὗ τὸ Σήμερον καλεῖται
  choice: maadamu wakati huu ungali unaitwa “Leo”
  rationale: ‘Maadamu’ na ‘ungali’ huhifadhi wazo la kipindi kinachoendelea, huku alama za kunukuu zikionyesha matumizi maalumu ya ‘Leo’ yanayotokana na Zaburi 95.
- source_word: σκληρυνθῇ
  choice: asije akafanywa kuwa mgumu
  rationale: Huhifadhi hali ya kutendwa ya kitenzi cha Kigiriki na kuonyesha hatari ya mtu kufanywa mgumu, bila kuongeza wazi neno ‘moyo’ ambalo halimo katika mstari huu.
- source_word: τις ἐξ ὑμῶν
  choice: yeyote kati yenu
  rationale: Pamoja na ukanushaji wa kusudi, usemi huu unahusu kila mtu katika jumuiya bila ubaguzi.
- source_word: ἀπάτῃ τῆς ἁμαρτίας
  choice: kwa udanganyifu wa dhambi
  rationale: ‘Kwa’ linaonyesha njia au chombo cha kufanywa mgumu, na ‘udanganyifu wa dhambi’ huhifadhi dhambi ikiwa na tabia ya kudanganya.
theological_decisions:
- issue: Maana ya pamoja ya ἑαυτοὺς
  choice: mhimizane
  alternative: jichocheeni wenyewe
  rationale: Katika agizo la wingi, kiwakilishi hiki kina nguvu ya kutendeana. Tafsiri iliyochaguliwa inaonyesha wajibu wa waamini kwa wao kwa wao bila kuufanya kuwa tendo la kila mtu peke yake.
- issue: Maana ya τὸ Σήμερον
  choice: “Leo” kama wakati wa sasa wa kuitikia mwito wa Mungu
  alternative: leo kama taarifa ya kawaida ya tarehe au siku
  rationale: Katika muktadha wa Waebrania 3, neno hili linarudia Zaburi 95. Alama za kunukuu na tanbihi huhifadhi uzito huo bila kuingiza ufafanuzi wote katika matini.
- issue: Mtendaji katika kufanywa mgumu
  choice: hali ya kutendwa imehifadhiwa bila kumtaja mtendaji
  alternative: dhambi inamfanya mtu kuwa mgumu
  rationale: Kigiriki hakimtaji moja kwa moja mtendaji wa kitendo cha kufanywa mgumu. Kutomtaja kunahifadhi mvutano na uwezekano wa kimaana wa matini, huku udanganyifu wa dhambi ukibaki njia inayotajwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Mhimizane’ ni cha kawaida na kina nguvu ya kutendeana. Muundo ‘asije akafanywa kuwa mgumu’ ni mzito kidogo lakini unahifadhi hali ya kutendwa na huepuka kuongeza ‘moyo’ isiyomo wazi katika Kigiriki.
