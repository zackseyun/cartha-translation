  yaml_path: translation/nt/hebrews/003/004.yaml
  text: For every house is built by someone[a], but God is the one who built all things.
translation:
  language: sw
  text: Kwa maana kila nyumba hujengwa na mtu, lakini Mungu ndiye aliyejenga vitu vyote.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kila kitu.”
    reason: Mbadala wa kileksia wa πάντα; “vitu vyote” huhifadhi wingi wa Kigiriki, ilhali “kila kitu” ni tafsiri ya kawaida yenye maana pana ileile.
lexical_decisions:
- source_word: πᾶς
  choice: kila
  rationale: 'Pamoja na nomino ya umoja οἶκος, neno hili lina maana ya kugawa kwa kila moja: “kila nyumba.”'
- source_word: γὰρ
  choice: Kwa maana
  rationale: Linaonyesha kuwa kauli hii inatoa msingi wa maelezo kwa hoja iliyotangulia.
- source_word: οἶκος
  choice: nyumba
  rationale: Hudumisha picha halisi ya jengo na pia nafasi ya matumizi ya kimfano katika muktadha wa Waebrania 3.
- source_word: κατασκευάζεται
  choice: hujengwa
  rationale: Kauli tendwa ya sasa inaeleza ukweli wa jumla kwamba nyumba hujengwa; uchaguzi huu ni wa kawaida na hudumisha picha ya ujenzi.
- source_word: ὑπό τινος
  choice: na mtu fulani
  rationale: ὑπό pamoja na hali ya kumilikisha huonyesha mtendaji, na τις humtaja kwa namna isiyo maalumu.
- source_word: ὁ δὲ
  choice: lakini aliye
  rationale: δέ huonyesha utofautishaji au hatua mpya ya hoja, huku ὁ pamoja na kitenzi-shirikishi ikiwakilishwa kwa “aliye.”
- source_word: πάντα
  choice: vitu vyote
  rationale: Huhifadhi upana wa maana ya πάντα bila kuibana kuwa ulimwengu pekee.
- source_word: κατασκευάσας
  choice: aliyevijenga
  rationale: Hudumisha mwendelezo wa picha na mzizi wa maana uliotumika katika “hujengwa,” huku ikimtaja mtendaji wa vitu vyote.
- source_word: θεός
  choice: Mungu
  rationale: Katika mpangilio huu θεός humtambulisha wazi aliyevijenga vitu vyote.
theological_decisions:
- issue: Utambulisho wa mjenzi wa vitu vyote
  choice: aliyevijenga vitu vyote ni Mungu
  alternative: Mungu ndiye aliyevijenga vitu vyote
  rationale: Mpangilio huu unafuata kwa karibu muundo wa Kigiriki ὁ ... κατασκευάσας θεός na kuhifadhi dai la wazi kwamba mjenzi wa vitu vyote ni Mungu, bila kuongeza ufafanuzi wa kimetafizikia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. “Hujengwa” huwasilisha ukweli wa jumla kwa ufasaha, na “mtu fulani” huhifadhi kutokutajwa kwa mjenzi mahsusi katika kishazi cha kwanza.
