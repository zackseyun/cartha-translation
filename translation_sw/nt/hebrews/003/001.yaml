  source_fidelity: 'Tafsiri inafuata kwa uaminifu muundo na maana ya Kigiriki: Ὅθεν ni “Kwa hiyo”; ἀδελφοὶ ἅγιοι ni “ndugu watakatifu”; μέτοχοι κλήσεως ἐπουρανίου ni “washiriki wa mwito wa mbinguni”; na κατανοήσατε inaelezwa vizuri kwa amri “mtafakarini.” Vyeo viwili, “mtume na kuhani mkuu,” pamoja na kirai “wa ukiri wetu,” vimehifadhiwa bila kuongeza tafsiri ya kimafundisho. “Mtafakarini Yesu” pia hudumisha mpangilio unaokubalika wa sentensi ingawa jina lipo mwisho katika Kigiriki.'
  naturalness: Kiswahili ni sanifu, cha sasa, na chenye mtindo wa heshima unaofaa kwa Waebrania. “Ninyi mlio washiriki wa mwito wa mbinguni” ni muundo wa asili na unaweka wazi uhusiano wa maelezo na wasomaji. “Mtafakarini” ni amri ya heshima ya wingi na huwasilisha mwito wa kutazama kwa makini.
  terminology: Istilahi “ndugu watakatifu,” “mwito wa mbinguni,” “mtume,” “kuhani mkuu,” na “ukiri wetu” ni sahihi na thabiti. Tanbihi (a) hushughulikia kwa usahihi upeo jumuishi wa ἀδελφοὶ bila kubadili umbo la maandishi makuu. Tanbihi (b) na (c) zinahifadhi mbadala halali wa kileksia na kisintaksia.
