id: HEB.3.1
reference: Hebrews 3:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ὅθεν, ἀδελφοὶ ἅγιοι, κλήσεως ἐπουρανίου μέτοχοι, κατανοήσατε τὸν ἀπόστολον καὶ ἀρχιερέα τῆς ὁμολογίας ἡμῶν ⸀Ἰησοῦν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/001.yaml
  text: Therefore[a], holy brothers, sharers in a heavenly calling, consider Jesus, the apostle and high priest of our confession[c][b],
translation:
  language: sw
  text: Kwa hiyo, ndugu watakatifu,[a] ninyi mlio washiriki wa mwito wa mbinguni,[b] mtafakarini Yesu, mtume na kuhani mkuu wa ukiri wetu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika Kigiriki, neno linalotafsiriwa “ndugu” lina umbo la kiume la wingi, lakini hapa linazungumza na jumuiya nzima ya waamini, wakiwemo wanawake.
    reason: cultural_note
  - marker: b
    text: Au, “washiriki wa mwito utokao mbinguni.”
    reason: lexical_alternative
  - marker: c
    text: Au, “mtafakarini yule tunayemkiri, yaani Yesu, mtume na kuhani mkuu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅθεν
  choice: Kwa hiyo
  rationale: Kiunganishi hiki kinaonyesha hitimisho linalotokana na hoja iliyotangulia, hasa Waebrania 2:17–18.
- source_word: ἀδελφοὶ ἅγιοι
  choice: ndugu watakatifu
  rationale: “Ndugu” ni neno la kawaida na lenye heshima katika Kiswahili, na katika wingi linaweza kulihusu kusanyiko lote; “watakatifu” linadumisha wazo la watu waliowekwa wakfu kwa Mungu.
- source_word: μέτοχοι
  choice: washiriki
  rationale: Linadumisha maana ya watu wanaoshiriki katika jambo fulani kwa lugha ya sasa na inayoeleweka.
- source_word: κλήσεως ἐπουρανίου
  choice: wa mwito wa mbinguni
  rationale: “Mwito” linahifadhi maana ya wito wa Mungu, na “wa mbinguni” linaacha wazi iwapo maelezo yanahusu asili ya mwito au sifa yake.
- source_word: κατανοήσατε
  choice: mtafakarini
  rationale: Amri hii inataka fikira makini na endelevu kuelekezwa kwa Yesu; “mtafakarini” ni ya asili, yenye heshima, na haiongezi maelezo yasiyokuwapo.
- source_word: ἀπόστολον
  choice: mtume
  rationale: “Mtume” ni istilahi iliyozoeleka kwa mtu aliyetumwa na inadumisha uzito wa cheo hiki kinapotumiwa kumhusu Yesu.
- source_word: ἀρχιερέα
  choice: kuhani mkuu
  rationale: Hii ndiyo istilahi ya kawaida na sahihi kwa cheo cha kidini kinachotawala hoja ya Waebrania.
- source_word: τῆς ὁμολογίας ἡμῶν
  choice: wa ukiri wetu
  rationale: Tafsiri hii inaunganisha kirai na vyeo vyote viwili na kudumisha maana ya ukiri wa pamoja bila kuubana kuwa imani ya moyoni pekee.
- source_word: Ἰησοῦν
  choice: Yesu
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
theological_decisions:
- issue: Wanaokusudiwa na ἀδελφοὶ
  choice: Kutumia “ndugu” katika maandishi makuu na kufafanua katika tanbihi kwamba jumuiya nzima inaelekezwa.
  alternative: ndugu wa kiume na wa kike
  rationale: Nomino ya Kigiriki ina umbo la kiume la wingi, lakini hapa inaelekea kulihusu kusanyiko lote. “Ndugu” katika Kiswahili kwa kawaida inaweza kuwa jumuishi bila kulazimisha ufafanuzi ndani ya mstari.
- issue: Maana ya ἀπόστολον inapomhusu Yesu
  choice: Kudumisha cheo “mtume.”
  alternative: aliyetumwa
  rationale: Andiko lenyewe linatumia ἀπόστολος kumhusu Yesu. Kutumia “mtume” kunadumisha nguvu ya kifasihi na kitheolojia bila kuingiza tofauti za baadaye kuhusu vyeo vya kanisa.
- issue: Uhusiano wa τῆς ὁμολογίας ἡμῶν na vyeo vya Yesu
  choice: “mtume na kuhani mkuu wa ukiri wetu”
  alternative: “yule tunayemkiri, yaani Yesu, mtume na kuhani mkuu”
  rationale: Kirai cha jinsi ya umilikaji kinaweza kueleweka kuwa kinahusishwa na vyeo vyote viwili, lakini pia kinaweza kuwasilisha Yesu kuwa ndiye tunayemkiri. Maandishi makuu yanafuata muundo wa Kigiriki, huku tanbihi ikihifadhi uwezekano mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wa heshima na unaosomeka kwa urahisi. Istilahi “mwito,” “mtume,” “kuhani mkuu,” na “ukiri” zinadumisha msamiati muhimu wa kifungu bila kuwa za kimadhehebu.
