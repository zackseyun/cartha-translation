  naturalness: “Na aliwaapia nani kwamba hawataingia katika pumziko lake...?” is more idiomatic and direct than “Na ni akina nani aliowaapia...?” The revised wording remains standard, contemporary East African Swahili and preserves the formal scriptural register.
  terminology: “Pumziko lake” appropriately retains Hebrews’ theological term κατάπαυσις without overinterpreting it. “Wale waliokataa kutii” conveys ἀπειθήσασιν without substituting “hawakuamini.”
