  text: τίσιν δὲ ὤμοσεν μὴ εἰσελεύσεσθαι εἰς τὴν κατάπαυσιν αὐτοῦ εἰ μὴ τοῖς ἀπειθήσασιν;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/018.yaml
  text: And to whom did he swear that they would not enter his rest[a], if not to those who disobeyed?
translation:
  language: sw
  text: Na aliwaapia nani kwamba hawataingia katika pumziko lake, isipokuwa wale waliokataa kutii[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wale wasiotii.” Kitenzi cha Kigiriki kinaweza kukazia tendo la kukataa kutii; katika muktadha huu, kutotii huku kunahusiana kwa karibu na kutokuamini (tazama Ebr. 3:19).
    reason: lexical_alternative
lexical_decisions:
- source_word: τίσιν
  choice: ni akina nani
  rationale: Kiulizi hiki cha wingi kinarejelea watu. “Ni akina nani” ni Kiswahili cha kawaida kinachodumisha nguvu ya swali la balagha.
- source_word: δὲ
  choice: Na
  rationale: Hapa δέ linaendeleza mfululizo wa maswali kutoka mstari uliotangulia bila kusisitiza utofautishaji mkali.
- source_word: ὤμοσεν
  choice: aliowaapia
  rationale: Kitenzi hiki kinadumisha uzito wa kiapo na kinaonyesha kuwa kiapo hicho kiliwahusu watu wanaoulizwa.
- source_word: μὴ εἰσελεύσεσθαι
  choice: kwamba hawataingia
  rationale: Kishazi cha kitenzi-jina kinaeleza yaliyomo katika kiapo; muundo huu ni wa kawaida na wazi katika Kiswahili.
- source_word: εἰς τὴν κατάπαυσιν αὐτοῦ
  choice: katika pumziko lake
  rationale: “Pumziko lake” linahifadhi mada ya pumziko la Mungu katika Waebrania, na “katika” linaonyesha kuingia ndani yake.
- source_word: εἰ μὴ
  choice: isipokuwa
  rationale: Katika swali hili la balagha, kifungu hiki kinatanguliza jibu linalotarajiwa kwa Kiswahili cha kawaida.
- source_word: τοῖς ἀπειθήσασιν
  choice: wale ambao hawakutii
  rationale: Tafsiri hii inaonyesha tendo la kutotii bila kulibadilisha moja kwa moja kuwa kutokuamini, ingawa muktadha wa mstari wa 19 unahusianisha mambo hayo.
theological_decisions:
- issue: Maana ya ἀπειθήσασιν katika onyo hili
  choice: wale ambao hawakutii
  alternative: wale ambao hawakuamini
  rationale: Neno la Kigiriki hapa linaelekeza kwenye kukataa kutii, huku muktadha ukihusianisha kutotii huko na kutokuamini. Tafsiri kuu inadumisha tofauti hiyo ya kimatamshi na mvutano wa kiteolojia badala ya kuyafanya maneno hayo kuwa sawa kabisa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa swali la balagha umehifadhiwa, na msamiati unabaki wazi kwa msomaji wa kawaida.
