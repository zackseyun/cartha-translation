translation:
  language: sw
  text: Nasi tunaona kwamba hawakuweza kuingia kwa sababu ya kutokuamini[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ukosefu wa uaminifu.” Neno la Kigiriki linaweza kumaanisha si tu kukosa imani, bali pia kukataa kutumaini kunakoonyesha ukosefu wa uaminifu.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Nasi
  rationale: Kiunganishi hiki kinaendeleza hoja kutoka mstari uliotangulia; “Nasi” ni ya asili kwa Kiswahili na huhifadhi nafsi ya kwanza wingi ya kitenzi kinachofuata bila kuongeza nguvu ya kihitimisho.
- source_word: βλέπομεν
  choice: tunaona
  rationale: Huhifadhi hali ya sasa na nafsi ya kwanza wingi ya kitenzi cha Kigiriki kwa lugha ya moja kwa moja na ya kawaida.
- source_word: ὅτι
  choice: kwamba
  rationale: Hutambulisha wazi maudhui ya jambo linaloonekana, sawasawa na muundo wa Kigiriki.
- source_word: οὐκ ἠδυνήθησαν
  choice: hawakuweza
  rationale: Ni Kiswahili cha kawaida kinachohifadhi wazi wazo la kutokuwa na uwezo.
- source_word: εἰσελθεῖν
  choice: kuingia
  rationale: Hutoa maana ya moja kwa moja ya kitenzi na kuacha muktadha wa kifungu ueleze walichoshindwa kuingia.
- source_word: δι’
  choice: kwa sababu ya
  rationale: διά pamoja na hali ya accusative huonyesha sababu hapa; usemi huu ni wazi na wa asili katika Kiswahili.
- source_word: ἀπιστίαν
  choice: kutokuamini
  rationale: Katika muktadha wa Waebrania 3, neno hili linaonyesha kushindwa kuamini na kumtumaini Mungu. “Kutokuamini” ni wazi kwa wasomaji wa sasa huku tanbihi ikihifadhi maana mbadala ya kutokuwa mwaminifu.
theological_decisions:
- issue: Maana ya ἀπιστία kuhusiana na kuamini na uaminifu
  choice: kutokuamini
  alternative: kutokuwa waaminifu
  rationale: Muktadha wa karibu unasisitiza kukataa kuamini ahadi na sauti ya Mungu, hivyo “kutokuamini” linafaa katika matini kuu. Hata hivyo, neno la Kigiriki linaweza pia kudokeza kutokuwa mwaminifu au kukataa kutumaini; maana hiyo imehifadhiwa katika tanbihi bila kuondoa mvutano wa kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Muundo ni mfupi na wa moja kwa moja, huku “Nasi tunaona” ikidumisha mtiririko wa hoja.
