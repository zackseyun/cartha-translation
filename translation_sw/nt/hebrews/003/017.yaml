  text: τίσιν δὲ προσώχθισεν τεσσεράκοντα ἔτη; οὐχὶ τοῖς ἁμαρτήσασιν, ὧν τὰ κῶλα ἔπεσεν ἐν τῇ ἐρήμῳ;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/017.yaml
  text: And with whom was he angry for forty years? Was it not with those who sinned[a], whose bodies fell in the wilderness?
translation:
  language: sw
  text: Na Mungu aliwakasirikia nani kwa miaka arobaini? Je, si wale waliotenda dhambi, ambao miili yao[a] ilianguka jangwani?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ambao mizoga yao ilianguka jangwani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προσώχθισεν
  choice: aliwakasirikia
  rationale: Kitenzi hiki humaanisha kuwa na hasira au ghadhabu dhidi ya watu fulani. “Aliwakasirikia” ni Kiswahili cha kawaida na kinaonyesha wazi walengwa wa hasira.
- source_word: τεσσεράκοντα ἔτη
  choice: kwa miaka arobaini
  rationale: Hiki ni kirai cha muda; “kwa miaka arobaini” ni usemi wa asili katika Kiswahili.
- source_word: ἁμαρτήσασιν
  choice: wale waliotenda dhambi
  rationale: Kirai hiki kinawataja watu waliotenda dhambi katika kizazi cha jangwani bila kufafanua zaidi aina au idadi ya matendo yao.
- source_word: κῶλα
  choice: miili yao
  rationale: Ingawa neno hili kwa msingi linaweza kumaanisha viungo vya mwili, katika muktadha huu linarejelea miili iliyoanguka ya waliokufa. “Miili yao” ni wazi, yenye heshima, na ya kawaida katika Kiswahili.
- source_word: ἔπεσεν
  choice: ilianguka
  rationale: Tafsiri hii inadumisha taswira ya kuanguka na inadokeza kifo na hukumu bila kuongeza moja kwa moja neno “kufa.”
- source_word: ἐν τῇ ἐρήμῳ
  choice: jangwani
  rationale: “Jangwani” linafaa kwa mazingira ya safari ya Israeli na ni usemi wa kibiblia unaoeleweka katika Kiswahili.
theological_decisions:
- issue: Mhusika aliyedokezwa katika προσώχθισεν
  choice: Mungu
  alternative: yeye
  rationale: Kiyunani hakitaji nomino hapa, lakini muktadha unaonyesha kwamba mhusika ni Mungu. Kutaja “Mungu” huondoa utata wa kiwakilishi katika Kiswahili bila kuongeza dai jipya la kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa maswali mawili ya balagha umehifadhiwa, na alama ya tanbihi imewekwa baada ya sentensi inayohusika.
