  text: while it is being said[a], “Today, if you hear his voice, do not harden your hearts as in the rebellion.”
translation:
  language: sw
  text: 'wakati yanaposemwa maneno haya: “Leo, mkisikia sauti yake, msiifanye mioyo yenu kuwa migumu kama katika ule uasi[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kama katika ule uchokozi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ λέγεσθαι
  choice: wakati inaposemwa
  rationale: Muundo wa ἐν pamoja na kitenzi-jina chenye hali ya sasa na ya kutendwa una maana ya wakati au mazingira. Tafsiri hii inadumisha wazo la maneno yanayoendelea kutamkwa huku ikibaki ya kawaida katika Kiswahili.
- source_word: Σήμερον
  choice: Leo
  rationale: Ni kielezi cha kawaida cha wakati na kinadumisha uzito wa mwito wa haraka katika zaburi iliyonukuliwa.
- source_word: ἐὰν ... ἀκούσητε
  choice: mkisikia
  rationale: Muundo wa -ki- unaeleza sharti kwa Kiswahili cha kawaida bila kulazimisha maana ya wakati ujao; hapa kusikia kunaweza pia kudokeza kuitikia ujumbe.
- source_word: τῆς φωνῆς αὐτοῦ
  choice: sauti yake
  rationale: Hii ni tafsiri ya kawaida na ya moja kwa moja ya muundo wa umilikaji, ikidumisha namna ya kibinafsi ya Mungu kusema.
- source_word: Μὴ σκληρύνητε τὰς καρδίας ὑμῶν
  choice: msiifanye mioyo yenu kuwa migumu
  rationale: Inadumisha katazo lenye kitendo cha kusababisha ugumu na taswira ya kibiblia ya moyo kama utu wa ndani, si hisia peke yake.
- source_word: ὡς ἐν τῷ παραπικρασμῷ
  choice: kama katika ule uasi
  rationale: Neno παραπικρασμός linaelekeza kwenye tukio mahususi la ukaidi wa Israeli jangwani. 'Ule uasi' linaeleweka kwa msomaji wa sasa na kidokezi 'ule' kinadumisha rejeo la tukio linalojulikana.
theological_decisions:
- issue: Maana ya παραπικρασμός katika nukuu ya Zaburi 95
  choice: ule uasi
  alternative: ule uchokozi
  rationale: '''Uasi'' linaonyesha vizuri ukaidi dhidi ya Mungu na uzito wake wa kimaadili na wa agano. ''Uchokozi'' linaweza kuonyesha tendo la kumkasirisha au kumchokoza Mungu, lakini si la kawaida sana katika muktadha huu; limehifadhiwa katika tanbihi ili kutunza uwezekano wa kileksika.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Aya imeachwa kama kishazi kinachoendelea kutoka muktadha uliotangulia, kama ilivyo katika Kigiriki. Alama ya tanbihi imewekwa baada ya neno linalohusika moja kwa moja.
