  text: καὶ Μωϋσῆς μὲν πιστὸς ἐν ὅλῳ τῷ οἴκῳ αὐτοῦ ὡς θεράπων εἰς μαρτύριον τῶν λαληθησομένων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/005.yaml
  text: And Moses indeed was faithful in all his house as a servant[a], for a testimony of the things that would be spoken later[b],
translation:
  language: sw
  text: Naye Musa alikuwa mwaminifu katika nyumba yake yote kama mtumishi,[a] kwa ushuhuda wa mambo ambayo yangenenwa baadaye.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika nyumba yake yote.” Kigiriki kinadumisha taswira ya “nyumba,” ambayo inaendelea kutumiwa katika aya zinazofuata za Waebrania.
    reason: lexical_alternative
  - marker: b
    text: Au, “wa mambo yaliyokuwa yatanenwa.” Kirai hiki kinaelekeza mbele kwenye mambo ambayo yangefunuliwa baadaye.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: Naye
  rationale: Kiunganishi hiki kinaendeleza ulinganisho wa aya zilizotangulia huku kikimtaja Musa kwa njia ya kawaida katika Kiswahili.
- source_word: Μωϋσῆς
  choice: Musa
  rationale: Hili ndilo umbo la jina linalotumiwa kwa kawaida katika Kiswahili.
- source_word: μὲν
  choice: alikuwa
  rationale: Chembe μὲν huandaa utofautishaji unaokamilishwa na δέ katika aya ya 6. Kiswahili cha kawaida kinaweza kuacha nguvu yake idokezwe na mpangilio wa sentensi; kuingiza ‘kwa kweli’ kungeweza kusikika kama msisitizo wa uthibitisho kuliko utofautishaji.
- source_word: πιστὸς
  choice: mwaminifu
  rationale: Neno hili linaeleza uaminifu na kutegemeka kwa Musa katika huduma yake.
- source_word: ἐν ὅλῳ τῷ οἴκῳ αὐτοῦ
  choice: katika nyumba yake yote
  rationale: Tafsiri hii inadumisha taswira ya ‘nyumba’ kutoka Hesabu 12:7 na muktadha wa Waebrania 3, bila kuifupisha kuwa nyumba halisi pekee.
- source_word: ὡς
  choice: kama
  rationale: Hutambulisha cheo au nafasi ambayo Musa alitumikia.
- source_word: θεράπων
  choice: mtumishi
  rationale: Neno hili huonyesha huduma yenye heshima na si lazima hali ya utumwa; ‘mtumishi’ pia linaacha wazi tofauti na Mwana katika aya inayofuata.
- source_word: εἰς μαρτύριον
  choice: ili awe ushuhuda
  rationale: Muundo huu unaonyesha kusudi au matokeo ya huduma aminifu ya Musa kwa Kiswahili cha asili.
- source_word: τῶν λαληθησομένων
  choice: wa mambo ambayo yangenenwa baadaye
  rationale: Kirai cha Kigiriki ni participio ya wakati ujao katika kauli tendwa. Tafsiri hii inadumisha hali ya kutajwa baadaye bila kumtaja moja kwa moja msemaji ambaye Kigiriki hakumtaji.
theological_decisions:
- issue: Maana ya ‘nyumba yake’ kuhusiana na Musa
  choice: Taswira ya ‘nyumba’ imedumishwa kama eneo la watu au mpango wa Mungu ambamo Musa alitumikia.
  alternative: ‘watu wote wa nyumba yake’ au ‘nyumba yake yote’ kwa maana ya kaya
  rationale: Muktadha wa Waebrania 3 na mwangwi wa Hesabu 12:7 huendeleza taswira ya nyumba kuwa watu wa Mungu. Tafsiri haipaswi kuamua kwamba ni jengo au kaya ya kawaida tu.
- issue: Nguvu ya θεράπων
  choice: mtumishi
  alternative: mhudumu; mtumishi wa karibu
  rationale: ‘Mtumishi’ huwasilisha huduma ya heshima bila kuingiza maana mahsusi ya mtumwa, na hudumisha utofauti kati ya Musa mtumishi na Kristo Mwana katika aya ya 6.
- issue: Mhusika na wakati katika τῶν λαληθησομένων
  choice: mambo ambayo yangenenwa baadaye
  alternative: mambo yaliyokuwa yatanenwa; mambo ambayo Mungu angesema baadaye
  rationale: Kigiriki kinaonyesha mambo yatakayonenwa kwa kauli tendwa lakini hakimtaji msemaji. Tafsiri inadumisha utata huo badala ya kuongeza ‘Mungu’ katika matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Yangenenwa’ limetumiwa kudumisha kauli tendwa na mwelekeo wa wakati ujao wa Kigiriki. Alama zote za tanbihi zimewekwa katika matini kuu.
