  text: who was faithful to the one who appointed him[b][a], just as Moses also was in all his house.
translation:
  language: sw
  text: aliyekuwa mwaminifu kwa yule aliyemteua[a], kama vile Musa pia alivyokuwa mwaminifu katika nyumba yake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliyemfanya.” Kitenzi cha Kigiriki kinaweza kumaanisha “kufanya,” lakini hapa huenda kinamaanisha “kuteua” au “kumweka katika jukumu.”
    reason: lexical_alternative
  - marker: b
    text: Baadhi ya hati zinaongeza “yote,” yaani, “katika nyumba yake yote,” kwa kufanana kwa karibu na Hesabu 12:7; hati nyingine zinasema tu “katika nyumba yake.” Inaelekea “nyumba” hapa ni nyumba ya Mungu.
    reason: textual_variant
lexical_decisions:
- source_word: πιστὸν ὄντα
  choice: aliyekuwa mwaminifu
  rationale: Kirai hiki cha kishirikishi kinamrejelea Yesu katika mstari uliotangulia. Muundo wa kishazi tegemezi ni wa asili katika Kiswahili, na “mwaminifu” hapa humaanisha mwenye kutegemeka na kutimiza wajibu wake.
- source_word: τῷ ποιήσαντι αὐτὸν
  choice: kwa yule aliyemteua
  rationale: Ingawa ποιέω kwa kawaida humaanisha “fanya” au “umba,” katika muktadha huu wa jukumu na utumishi maana inayofaa ni kumweka au kumteua kwa kazi. “Kwa” huonyesha yule ambaye Yesu alikuwa mwaminifu kwake.
- source_word: ὡς καὶ
  choice: kama vile ... pia
  rationale: Muundo huu unaonyesha ulinganisho wa uaminifu wa Yesu na ule wa Musa kwa Kiswahili cha kawaida na wazi.
- source_word: Μωϋσῆς
  choice: Musa
  rationale: Hili ndilo umbo la kawaida la jina hili katika Biblia na matumizi ya Kiswahili.
- source_word: ἐν τῷ οἴκῳ αὐτοῦ
  choice: katika nyumba yake
  rationale: “Nyumba” hudumisha taswira inayoendelezwa katika mistari inayofuata. Kiwakilishi “yake” kinahifadhi namna ya Kigiriki bila kumtaja wazi mwenye nyumba; kwa muktadha huenda kinamrejelea Mungu.
theological_decisions:
- issue: Maana ya ποιήσαντι inapomhusu Mwana
  choice: aliyemteua
  alternative: aliyemfanya / aliyemuumba
  rationale: Maana halisi ya kitenzi ni pana na inaweza kuwa “fanya,” lakini hapa muktadha wa utume na uaminifu katika jukumu unaunga mkono “teua.” Tanbihi inahifadhi maana nyingine ya kileksika bila kufanya matini kuu idokeze moja kwa moja kwamba Mwana aliumbwa.
- issue: Mrejelewa wa αὐτοῦ katika “nyumba yake”
  choice: Kiwakilishi kimeachwa kuwa “yake”
  alternative: nyumba ya Mungu
  rationale: Inaelekea nyumba hiyo ni ya Mungu kwa sababu ya muktadha na mwangwi wa Hesabu 12:7, lakini matini ya Kigiriki ina kiwakilishi tu. Kukihifadhi huepuka kufafanua kupita kiasi jambo ambalo matini haijalisema wazi.
- issue: Kurudiwa kwa wazo la uaminifu katika sehemu ya Musa
  choice: alivyokuwa mwaminifu
  alternative: alivyokuwa
  rationale: Kiswahili huhitaji kijalizo kilicho wazi zaidi ili ulinganisho usisikike pungufu. Kurudia “mwaminifu” hufafanua ulinganisho uliomo katika ὡς καὶ bila kuongeza wazo jipya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa msomaji wa kawaida. “Nyumba” imehifadhiwa badala ya “jamaa” au “watu wa nyumbani” ili kudumisha taswira ya kifasihi na kiteolojia inayoendelea katika muktadha.
