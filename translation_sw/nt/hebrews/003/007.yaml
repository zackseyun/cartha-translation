  text: 'Therefore, just as the Holy Spirit says: “Today, if you hear his voice,”'
translation:
  language: sw
  text: 'Kwa hiyo, kama asemavyo Roho Mtakatifu: “Leo, ikiwa mtaisikia sauti yake,”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διό
  choice: Kwa hiyo
  rationale: Kiunganishi hiki kinaonyesha hitimisho linalotokana na hoja iliyotangulia; “Kwa hiyo” ni cha kawaida na huhifadhi uhusiano huo wa kimantiki.
- source_word: καθὼς
  choice: kama
  rationale: Hutambulisha namna ya kunukuu kwa kulinganisha; “kama” ni tafsiri ya asili na fasaha katika Kiswahili bila kuongeza mkazo usiokuwapo.
- source_word: λέγει
  choice: asemavyo
  rationale: Wakati uliopo wa Kigiriki umehifadhiwa katika muundo wa Kiswahili unaotambulisha nukuu kama kauli inayoendelea kunena.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: Roho Mtakatifu
  rationale: Ni istilahi sanifu na sahihi ya Kiswahili kwa kirai hiki, bila kuongeza msisitizo.
- source_word: Σήμερον
  choice: Leo
  rationale: Kielezi hiki cha wakati kinaanza maneno yaliyonukuliwa na kimetafsiriwa moja kwa moja.
- source_word: ἐὰν
  choice: ikiwa
  rationale: Huanzisha sharti; “ikiwa” ni la kawaida, lenye hadhi, na huhifadhi hali ya sharti bila kuongeza maana.
- source_word: τῆς φωνῆς αὐτοῦ
  choice: sauti yake
  rationale: Kiswahili hutumia kwa kawaida “kuisikia sauti”; tafsiri hii huhifadhi rejeo la kibinafsi la kirai cha Kigiriki.
- source_word: ἀκούσητε
  choice: mtaisikia
  rationale: Muundo wa sharti wa Kiswahili “ikiwa mtaisikia” hutoa maana ya Kigiriki kwa njia ya asili. “Sikia” huepuka kuifanya moja kwa moja kuwa “tii,” jambo ambalo lingefasiri zaidi ya msingi wa kileksika.
theological_decisions:
- issue: Kumtaja msemaji wa nukuu ya Zaburi
  choice: Nukuu imetambulishwa moja kwa moja kuwa ni maneno ya Roho Mtakatifu.
  alternative: Roho Mtakatifu anasema kupitia Maandiko au mtunga zaburi.
  rationale: Kigiriki kinasema wazi “Roho Mtakatifu anasema.” Tafsiri inadumisha usemi huo wa moja kwa moja bila kuupunguza kuwa kauli ya mwanadamu tu wala kuongeza maelezo mapana kuhusu uvuvio.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo “kama asemavyo” ni wa kifasihi kwa kiasi kinachofaa muktadha wa Maandiko lakini bado ni wa asili. Aya inaishia katikati ya nukuu, kwa hiyo koma imehifadhiwa.
