  text: Χριστὸς δὲ ὡς υἱὸς ἐπὶ τὸν οἶκον αὐτοῦ· ⸀ὃς οἶκός ἐσμεν ἡμεῖς, ⸀ἐὰν τὴν παρρησίαν καὶ τὸ καύχημα τῆς ⸀ἐλπίδος κατάσχωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/006.yaml
  text: But the Messiah was faithful as a Son over his house[a], whose house we are[c][b], if we hold fast our boldness and the boast of our hope.
translation:
  language: sw
  text: Lakini Masihi[a] ni kama Mwana juu ya nyumba yake, ambayo sisi ni nyumba yake, ikiwa tutashikilia kwa uthabiti ujasiri wetu[b] na fahari ya tumaini letu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Kristo” badala ya “Masihi.” Neno la Kigiriki Χριστός linaweza kutumiwa kama cheo (“Masihi”) au kama jina (“Kristo”).
    reason: alternative_reading
  - marker: b
    text: Au “uhakika wetu.” Neno la Kigiriki παρρησία linaweza kumaanisha uwazi, uhuru wa kusema, au ujasiri wenye uhakika.
    reason: lexical_alternative
  - marker: c
    text: Au “sababu ya kujivunia iliyo katika tumaini letu,” au “shangwe ya tumaini letu.” Neno la Kigiriki καύχημα linaweza kumaanisha fahari, sababu ya kujivunia, au kujiamini kwa shangwe.
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστὸς
  choice: Masihi
  rationale: Katika ulinganisho na Musa, neno hili lina nguvu ya cheo; “Masihi” huonyesha hilo wazi, huku tanbihi ikihifadhi uwezekano wa “Kristo.”
- source_word: δὲ
  choice: Lakini
  rationale: Huonyesha tofauti na maelezo yaliyotangulia kuhusu Musa.
- source_word: ὡς υἱὸς
  choice: kama Mwana
  rationale: Hudumisha nguvu ya ulinganisho wa ὡς na hadhi ya mwana katika muktadha huu.
- source_word: ἐπὶ τὸν οἶκον αὐτοῦ
  choice: juu ya nyumba yake
  rationale: “Juu ya” huonyesha mamlaka au usimamizi, na “nyumba” hudumisha sitiari ya watu wa Mungu. Kiwakilishi hakifafanuliwi kupita kiasi.
- source_word: ὃς οἶκός ἐσμεν ἡμεῖς
  choice: Sisi ndio nyumba hiyo
  rationale: Ni Kiswahili cha kawaida kinachodumisha sitiari na uhusiano wa kishazi rejeshi bila muundo mgumu usio wa asili.
- source_word: ἐὰν
  choice: ikiwa
  rationale: Hudumisha sharti halisi bila kulitia nguvu ya kitheolojia ambayo Kigiriki hakilazimishi.
- source_word: παρρησίαν
  choice: ujasiri wetu
  rationale: “Ujasiri” hubeba wazo la kusema au kusimama wazi na kwa moyo thabiti; “wetu” inaeleweka kutokana na nafsi ya kwanza wingi.
- source_word: καύχημα
  choice: fahari
  rationale: “Fahari” huonyesha kile ambacho mtu anajivunia au kukitukuza bila kutoa hisia hasi isiyolazimishwa ya kujisifu.
- source_word: τῆς ἐλπίδος
  choice: ya tumaini letu
  rationale: Kiswahili cha kawaida huhitaji uhusiano huu, na “letu” linatokana kwa kawaida na muktadha wa “sisi.”
- source_word: κατάσχωμεν
  choice: tutashikilia kwa uthabiti
  rationale: Huonyesha kuendelea kutunza au kushikilia bila kuachilia, kwa namna ya asili katika kishazi cha sharti cha Kiswahili.
theological_decisions:
- issue: Kutafsiri Χριστός kama cheo au jina
  choice: Masihi
  alternative: Kristo
  rationale: Muktadha wa kumlinganisha Musa na Mwana unaunga mkono nguvu ya cheo, lakini tanbihi inahifadhi uwezekano wa matumizi kama jina.
- issue: Nguvu ya sharti ἐὰν ... κατάσχωμεν
  choice: ikiwa tutashikilia kwa uthabiti
  alternative: mradi tu tushikilie kwa uthabiti
  rationale: “Ikiwa” huhifadhi mvutano halisi wa sharti kuhusu kudumu bila kuamua mfumo fulani wa kimadhehebu kuhusu ustahimilivu au kuasi.
- issue: Mrejeo wa αὐτοῦ katika “nyumba yake”
  choice: kuhifadhi kiwakilishi “yake” bila kumtaja mwenye nyumba moja kwa moja
  alternative: nyumba ya Mungu / nyumba ya Mwana
  rationale: Sintaksia na muktadha vinaweza kuhusishwa na Mungu au na Mwana; tafsiri haipaswi kufuta uwezekano huo kwa kulazimisha mrejeo mmoja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Sitiari ya “nyumba” imedumishwa, lugha ya sharti haijafafanuliwa kimadhehebu, na sentensi imegawanywa mara mbili ili iwe ya asili na wazi kwa Kiswahili.
