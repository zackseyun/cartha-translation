translation:
  language: sw
  text: Na tumzingatie kila mmoja mwenzake kwa makini, ili kuchochea upendo na matendo mema.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kusukuma kwa nguvu kuelekea upendo na matendo mema” au “kuamsha upendo na matendo mema.” Nomino ya Kigiriki παροξυσμός inaweza kumaanisha msukumo wenye nguvu au kuchokoza.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατανοῶμεν
  choice: tufikiriane kwa makini
  rationale: Kitenzi hiki ni kauli ya kuhimiza katika nafsi ya kwanza wingi na kina maana ya kuelekeza fikira au uangalifu kwa mtu. Muundo wa kurejeana unaunganisha kwa kawaida maana hiyo na ἀλλήλους.
- source_word: ἀλλήλους
  choice: -ane (katika “tufikiriane”)
  rationale: Kiambishi cha kutendeana -ane kinawasilisha maana ya kurejeana ya “wao kwa wao” kwa Kiswahili cha kawaida.
- source_word: εἰς
  choice: ili
  rationale: Hapa εἰς inaelekeza kwenye kusudi au matokeo; “ili” huonyesha uhusiano huo kwa uwazi na kwa lugha ya kawaida.
- source_word: παροξυσμὸν
  choice: kuchochea
  rationale: Nomino hii inaweza kumaanisha msukumo wenye nguvu au uchokozi. “Kuchochea” inadumisha nguvu ya kuamsha tendo, huku vitu vinavyochochewa—upendo na matendo mema—vikionyesha maana chanya katika muktadha.
- source_word: ἀγάπης
  choice: upendo
  rationale: Ni tafsiri ya kawaida, ya sasa, na iliyo wazi ya ἀγάπη.
- source_word: καλῶν ἔργων
  choice: matendo mema
  rationale: Tafsiri hii inawakilisha moja kwa moja kivumishi na nomino, na ni usemi wa kawaida wa Kiswahili bila kuingiza mfumo maalumu wa kimafundisho.
- source_word: καὶ
  choice: na
  rationale: “Na” inaunganisha himizo hili na muktadha uliotangulia, na pia inaunganisha upendo na matendo mema.
theological_decisions:
- issue: Maana inayoweza kusikika hasi ya παροξυσμός
  choice: kuchochea upendo na matendo mema
  alternative: kusukuma kwa nguvu kuelekea upendo na matendo mema; kuamsha upendo na matendo mema
  rationale: Neno la Kigiriki lina nguvu ya msukumo au uchokozi na wakati mwingine linaweza kuwa na maana hasi. Hapa vitu vyake ni vyema, kwa hiyo “kuchochea” huhifadhi nguvu yake bila kugeuza himizo kuwa la uhasama. Tanbihi inaweka wazi upana wa maana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Tufikiriane kwa makini” huhifadhi uangalifu wa κατανοέω na urejeano wa ἀλλήλους; “kuchochea” hudumisha nguvu ya παροξυσμός bila kuifanya sentensi isikike hasi isivyohitajika.
