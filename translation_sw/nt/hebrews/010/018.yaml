base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/018.yaml
  text: Where there is forgiveness of these[a], there is no longer any offering for sin.
translation:
  language: sw
  text: Palipo na msamaha wa mambo hayo[a], hakuna tena sadaka kwa ajili ya dhambi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ondoleo la mambo hayo”; “mambo hayo” ni dhambi na matendo ya uasi yaliyotajwa katika mstari uliotangulia.
    reason: Mbadala wa kimsamiati na ufafanuzi wa kile kinachorejelewa.
lexical_decisions:
- source_word: ὅπου
  choice: Palipo na
  rationale: Huwasilisha hali au mazingira ambamo kauli inayofuata ni kweli; muundo huu ni wa kawaida na wa asili katika Kiswahili.
- source_word: δὲ
  choice: haijatafsiriwa kwa neno tofauti
  rationale: Hapa δέ ni kiunganishi hafifu cha kuendeleza hitimisho. Mtiririko wa sentensi ya Kiswahili unaonyesha uhusiano huo bila kuongeza neno kama “basi” au “lakini,” ambalo lingeweza kuzidisha nguvu yake.
- source_word: ἄφεσις
  choice: msamaha
  rationale: Katika muktadha huu wa dhambi na dhabihu, neno hili humaanisha kuondolewa kwa hatia au kusamehewa; “msamaha” ni neno la sasa, wazi na lenye uzito unaofaa.
- source_word: τούτων
  choice: wa mambo hayo
  rationale: Kiwakilishi hiki hurejelea dhambi na matendo ya uasi yaliyotajwa katika mstari uliotangulia. Tafsiri hii inadumisha urejeo wa jumla wa Kigiriki badala ya kuufafanua moja kwa moja ndani ya matini.
- source_word: οὐκέτι
  choice: hakuna tena
  rationale: Huonyesha kwamba sadaka ya aina inayotajwa haiendelei kuwapo au kuhitajika baada ya msamaha.
- source_word: προσφορὰ
  choice: sadaka
  rationale: Ni istilahi ya jumla ya kitu kinachotolewa katika mazingira ya ibada. “Sadaka” ni ya asili katika Kiswahili na haibani maana kuwa aina maalumu kuliko Kigiriki.
- source_word: περὶ ἁμαρτίας
  choice: kwa ajili ya dhambi
  rationale: Huhifadhi maana ya sadaka inayohusiana na kuondoa dhambi bila kulazimisha tafsiri maalumu ya “sadaka ya dhambi.”
theological_decisions:
- issue: Ukamilifu na utoshelevu wa sadaka ya Kristo
  choice: Mstari unasema kwamba palipo na msamaha, hakuna tena sadaka kwa ajili ya dhambi.
  alternative: Kuutafsiri kana kwamba kila aina ya sadaka imekomeshwa, au kana kwamba kauli inahusu tu taratibu za Walawi bila dai pana zaidi katika hoja ya sura hii.
  rationale: Muktadha unatofautisha sadaka zilizorudiwa na sadaka yenye matokeo ya kudumu. Tafsiri inaacha dai la mstari lisimame bila kulipanua kwa aina zote za utoaji wala kulibana kuliko matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo ni mfupi kama ulivyo mstari wa Kigiriki, na utata wa kiwakilishi “hayo” umehifadhiwa huku ukifafanuliwa katika tanbihi.
