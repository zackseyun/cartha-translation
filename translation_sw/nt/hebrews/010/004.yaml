base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/004.yaml
  text: For it is impossible for the blood of bulls and goats to take away sins[a].
translation:
  language: sw
  text: Kwa maana haiwezekani damu ya mafahali na mbuzi kuondoa dhambi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutwaa mbali dhambi.” Kitenzi cha Kigiriki kinaweza kumaanisha kuondoa au kutwaa mbali.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδύνατον
  choice: haiwezekani
  rationale: Kivumishi hiki kimetumiwa bila mtendaji pamoja na kitenzi-jina ἀφαιρεῖν. “Haiwezekani” ni Kiswahili cha kawaida kinachohifadhi uzito kamili wa kauli hiyo.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Kiunganishi hiki kinatoa sababu inayofafanua hoja iliyotangulia; “kwa maana” kinaonyesha uhusiano huo kwa uwazi na kwa mtindo wenye hadhi.
- source_word: αἷμα
  choice: damu
  rationale: Neno halisi la lugha ya dhabihu limehifadhiwa kwa sababu damu ni sehemu muhimu ya hoja ya Waebrania; halijafasiriwa kwa upana kuwa “dhabihu” au “kifo.”
- source_word: ταύρων
  choice: ya mafahali
  rationale: Wingi wa ng'ombe dume umeonyeshwa kwa “mafahali,” neno la kawaida na sahihi kwa ταύρων katika muktadha wa dhabihu.
- source_word: τράγων
  choice: na mbuzi
  rationale: Ingawa τράγος hasa ni mbuzi dume, “mbuzi” ni usemi wa kawaida katika Kiswahili cha muktadha wa dhabihu, na jinsia yao haitiliwi mkazo katika hoja hii.
- source_word: ἀφαιρεῖν
  choice: kuondoa
  rationale: Kitenzi hiki kina maana ya kuondoa au kutwaa mbali. “Kuondoa” ni cha asili katika Kiswahili na kinahifadhi nguvu ya kauli bila kuongeza maelezo ya kiteolojia.
- source_word: ἁμαρτίας
  choice: dhambi
  rationale: Katika Kiswahili, “dhambi” linaweza kutumika kwa maana ya umoja au wingi kulingana na muktadha; hapa linaonyesha dhambi zinazotajwa kwa wingi katika Kigiriki bila usemi usio wa kawaida.
theological_decisions:
- issue: Uwezo wa dhabihu za wanyama katika hoja ya Waebrania
  choice: Mstari unasema damu ya wanyama haiwezi kuondoa dhambi kwa maana kuu inayokusudiwa na hoja.
  alternative: Dhabihu zilifunika dhambi kwa muda au zilileta utakaso wa kiibada bila kuziondoa kabisa.
  rationale: Tafsiri haijaingiza ufafanuzi kamili wa kimafundisho katika matini. “Kuondoa dhambi” inafuata Kigiriki na kuhifadhi mvutano kati ya dhabihu za wanyama zilizorudiwa na toleo lenye matokeo ya mwisho linaloelezwa katika muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa urahisi. Muundo ni mfupi kama wa Kigiriki, huku “Kwa maana” ikihifadhi uhusiano wa kimantiki na mstari uliotangulia. Alama ya tanbihi [a] imewekwa katika matini.
