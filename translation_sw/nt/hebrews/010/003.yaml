lexical_decisions:
- source_word: ἀλλ’
  choice: Lakini
  rationale: Kiunganishi hiki kinaonyesha tofauti na dai la mstari uliotangulia kwamba dhabihu hizo haziwezi kuwakamilisha waabudu.
- source_word: ἐν αὐταῖς
  choice: katika dhabihu hizi
  rationale: Kiwakilishi cha Kiyunani kinarejelea dhabihu zilizotajwa katika muktadha uliotangulia; kutaja “dhabihu” wazi kunafanya rejeo lieleweke bila kuongeza wazo jipya.
- source_word: ἀνάμνησις
  choice: ukumbusho
  rationale: Neno hili humaanisha jambo linaloleta kitu akilini; “ukumbusho” ni Kiswahili cha kawaida na kinafaa kwa hoja kwamba dhabihu zinakumbusha dhambi.
- source_word: ἁμαρτιῶν
  choice: wa dhambi
  rationale: Hii ni jenitivi inayotegemea ἀνάμνησις na kwa kawaida hutafsiriwa “ukumbusho wa dhambi,” hivyo dhambi ndizo zinazokumbushwa.
- source_word: κατ’ ἐνιαυτόν
  choice: mwaka baada ya mwaka
  rationale: Msemo huu unaonyesha tukio linalorudiwa kila mwaka; chaguo hili linasisitiza mwendelezo wa kurudiwa kwa dhabihu katika hoja ya Waebrania.
theological_decisions:
- issue: Rejeo la αὐταῖς
  choice: Kiwakilishi kinarejelea dhabihu zinazorudiwa, na kimetafsiriwa wazi kuwa “katika dhabihu hizi.”
  alternative: katika hizo
  rationale: Muktadha wa karibu unazungumzia dhabihu zilezile zinazotolewa daima. Kutaja dhabihu wazi kunaboresha ufafanuzi bila kubadili hoja ya kitheolojia.
- issue: Nguvu ya κατ’ ἐνιαυτόν
  choice: mwaka baada ya mwaka
  alternative: kila mwaka
  rationale: Chaguo kuu linaonyesha si tu marudio ya kila mwaka bali pia mfululizo wake, ambao ni muhimu katika hoja ya mwandishi kuhusu dhabihu zinazorudiwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni fupi na ya asili; “dhabihu hizi” huweka wazi rejeo la kiwakilishi, na “mwaka baada ya mwaka” huhifadhi msisitizo wa marudio.
