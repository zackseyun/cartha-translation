  text: But in these sacrifices there is a reminder of sins year after year,[a]
translation:
  language: sw
  text: Lakini katika dhabihu hizi kuna ukumbusho wa dhambi mwaka baada ya mwaka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kila mwaka.”
