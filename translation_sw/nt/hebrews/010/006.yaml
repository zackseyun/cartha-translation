  text: In whole burnt offerings and sin offerings you took no pleasure[a].
translation:
  language: sw
  text: Sadaka za kuteketezwa kabisa na sadaka za dhambi hukupendezwa nazo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sadaka za kuteketezwa na sadaka kwa ajili ya dhambi.” Kirai cha Kigiriki περὶ ἁμαρτίας ni usemi wa kiibada unaomaanisha sadaka inayotolewa kwa ajili ya dhambi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁλοκαυτώματα
  choice: sadaka za kuteketezwa kabisa
  rationale: Neno hili hutaja sadaka zilizoteketezwa zima kwa moto. Tafsiri hii inaweka wazi ukamilifu wa kuteketezwa na kudumisha istilahi maalumu ya ibada.
- source_word: καὶ
  choice: na
  rationale: Kiunganishi rahisi kinachounganisha aina mbili za sadaka.
- source_word: περὶ ἁμαρτίας
  choice: sadaka za dhambi
  rationale: Katika muktadha wa utoaji wa sadaka, kirai hiki ni usemi wa kiibada unaomaanisha sadaka iliyotolewa kwa ajili ya dhambi. “Sadaka za dhambi” ni fupi, ya kawaida katika Kiswahili cha Biblia, na sahihi katika muktadha.
- source_word: οὐκ
  choice: hu-...-si-
  rationale: Ukanushi umejumuishwa kwa kawaida katika kitenzi cha Kiswahili “hukuzipendezwa,” bila kupunguza nguvu yake.
- source_word: εὐδόκησας
  choice: hukuzipendezwa nazo
  rationale: Kitenzi kinamwelekea Mungu katika nafsi ya pili umoja. Usemi huu unaonyesha kutoridhishwa au kutofurahia bila kuongeza ufafanuzi wa kiteolojia.
theological_decisions:
- issue: Istilahi za sadaka katika nukuu inayotumiwa katika hoja ya Waebrania 10
  choice: 'Kudumisha aina mahususi: “sadaka za kuteketezwa kabisa” na “sadaka za dhambi.”'
  alternative: “sadaka za kuteketezwa na sadaka kwa ajili ya dhambi”
  rationale: Kutaja aina hizo wazi humsaidia msomaji kufuatilia tofauti kati ya sadaka za mfumo wa ibada na kujitoa kwa Mwana, bila kuingiza hitimisho la kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Sadaka za kuteketezwa kabisa” ni wazi kwa msomaji wa kawaida; “sadaka za dhambi” huhifadhi ufupi na umahususi wa istilahi ya kiibada.
