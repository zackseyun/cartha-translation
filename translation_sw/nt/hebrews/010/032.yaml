id: HEB.10.32
reference: Hebrews 10:32
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἀναμιμνῄσκεσθε δὲ τὰς πρότερον ἡμέρας, ἐν αἷς φωτισθέντες πολλὴν ἄθλησιν ὑπεμείνατε παθημάτων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/032.yaml
  text: But remember the former days[a], when, after you were enlightened, you endured a great struggle of sufferings[c][b],
translation:
  language: sw
  text: Lakini zikumbukeni siku zile za kwanza, baada ya kutiwa nuru[a][b], mlipostahimili pambano kubwa la mateso[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mlipotiwa nuru.” Kirai cha Kigiriki kinaweza kueleweka kuwa kutiwa nuru kulitokea kabla ya pambano, au kuwa ni sehemu ya kipindi kilekile kinachokumbukwa.
    reason: lexical_alternative
  - marker: b
    text: “Kutiwa nuru” kunaweza kumaanisha kwa upana kupokea mwanga wa kiroho. Wengine hulihusianisha na uongofu, ubatizo, au kufundishwa imani, lakini mstari huu hautaji jambo moja hususa.
    reason: alternative_reading
  - marker: c
    text: Au, “shindano kali la mateso.” Neno la Kigiriki lina wazo la pambano au shindano.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναμιμνῄσκεσθε
  choice: zikumbukeni
  rationale: Kitenzi cha kuamuru katika wingi kinawataka wasomaji wazirejeshe akilini siku hizo; kiambishi “zi-” kinakubaliana na “siku.”
- source_word: δὲ
  choice: Lakini
  rationale: Neno hili linaonyesha mpito wenye utofautishaji wa kiasi kutoka onyo lililotangulia hadi wito wa kukumbuka ustahimilivu wao wa awali.
- source_word: τὰς πρότερον ἡμέρας
  choice: siku zile za kwanza
  rationale: Hii ni kauli ya kawaida ya Kiswahili inayorejelea kipindi chao cha awali bila kudokeza nyakati za kale kwa ujumla.
- source_word: ἐν αἷς
  choice: baada ya
  rationale: Katika muundo wa sentensi, kishazi hiki kinaeleza wakati; “baada ya” kinaonyesha kwa kawaida tendo la kutiwa nuru likitangulia ustahimilivu, huku tanbihi ikihifadhi uwezekano wa uhusiano mpana zaidi wa wakati.
- source_word: φωτισθέντες
  choice: kutiwa nuru
  rationale: Huhifadhi sitiari ya Kigiriki na hali ya kutendwa bila kuifasiri moja kwa moja kuwa uongofu, ubatizo, au kufundishwa imani.
- source_word: πολλὴν ἄθλησιν
  choice: pambano kubwa
  rationale: “Pambano” linadumisha wazo la kushindana au kujitahidi lililomo katika ἄθλησις, na “kubwa” linaonyesha uzito wa πολλήν kwa lugha ya kawaida.
- source_word: ὑπεμείνατε
  choice: mlipostahimili
  rationale: Kitenzi hiki kinaonyesha kuvumilia na kusimama imara chini ya mateso yaliyodumu.
- source_word: παθημάτων
  choice: la mateso
  rationale: Hii ni tafsiri ya moja kwa moja ya nomino ya wingi inayoeleza aina au mazingira ya pambano.
theological_decisions:
- issue: Maana ya φωτισθέντες katika muktadha wa onyo na himizo
  choice: Kuhifadhi usemi wa kisitiari “kutiwa nuru” bila kuubana kuwa tukio moja maalumu la kimafundisho.
  alternative: “baada ya kuongoka,” “baada ya kubatizwa,” au “baada ya kufundishwa imani”
  rationale: Mstari unaonyesha kwamba wasomaji walikuwa wamepokea nuru ya kiroho, lakini hautaji kwa usahihi ikiwa hii ni uongofu, ubatizo, au mafundisho. Tafsiri hii huhifadhi mvutano huo wa kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Siku zile za kwanza” ni ya asili zaidi kuliko “siku za zamani” katika kurejelea mwanzo wa uzoefu wa wasomaji, na “pambano” huhifadhi kwa kiasi sitiari ya mashindano.
