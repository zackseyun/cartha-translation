base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/031.yaml
  text: It is a fearful thing to fall into the hands of the living God[a].
translation:
  language: sw
  text: Ni jambo la kuogofya kuanguka mikononi mwa Mungu aliye hai.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ni jambo la kutisha kuanguka mikononi mwa Mungu aliye hai.”
    reason: lexical_alternative
lexical_decisions:
- source_word: φοβερὸν
  choice: jambo la kuogofya
  rationale: Kivumishi hiki huonyesha jambo linaloleta hofu kuu au woga. Muundo wa Kiswahili “ni jambo la kuogofya” ni wa kawaida, wenye uzito, na unahifadhi kauli ya jumla ya Kigiriki bila kuongeza maelezo.
- source_word: τὸ ἐμπεσεῖν
  choice: kuanguka
  rationale: Kitenzi-jina cha Kigiriki kinatafsiriwa kwa njia ya kawaida kama “kuanguka”; kirai kinachofuata kinakamilisha maana ya kuingia chini ya mamlaka ya mwingine.
- source_word: εἰς χεῖρας
  choice: mikononi mwa
  rationale: Hii ni nahau ya kuingia chini ya uwezo au hukumu ya mtu. Kutunza taswira ya “mikono” kunahifadhi nguvu na mwangwi wa kibiblia wa usemi wa asili.
- source_word: θεοῦ
  choice: Mungu
  rationale: 'Ni tafsiri ya moja kwa moja ya nomino katika hali ya umilikaji: mikono ya Mungu.'
- source_word: ζῶντος
  choice: aliye hai
  rationale: Kirai hiki kinamfafanua Mungu kuwa Mungu aliye hai. “Aliye hai” ni usemi wa kawaida na wenye hadhi katika Kiswahili na huhifadhi msisitizo wa uwepo na utendaji wake halisi.
theological_decisions:
- issue: Nguvu ya onyo hili
  choice: Kauli ya jumla na nzito kuhusu hofu ya kuingia chini ya mamlaka ya Mungu aliye hai katika muktadha wa hukumu
  alternative: Kurejelea tu adhabu ya muda, au kuwa kauli ya kihisia isiyohusiana na hukumu
  rationale: Muktadha unahitimisha onyo, na nahau ya “kuanguka mikononi mwa” ina uzito wa kimahakama. Tafsiri inahifadhi uzito huo bila kuongeza neno “hukumu,” ambalo halipo waziwazi katika Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, rahisi kueleweka, yenye hadhi na uzito wa onyo. Taswira ya mikono imehifadhiwa badala ya kufafanuliwa kuwa “mamlaka” au “hukumu.”
