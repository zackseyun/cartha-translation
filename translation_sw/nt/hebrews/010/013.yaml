lexical_decisions:
- source_word: τὸ λοιπὸν
  choice: tangu wakati huo
  rationale: Kirai hiki kinatumika kama kielezi cha wakati na kinaelekeza kwenye kipindi kinachoanza baada ya kuketi kulikotajwa katika muktadha uliotangulia.
- source_word: ἐκδεχόμενος
  choice: akingoja
