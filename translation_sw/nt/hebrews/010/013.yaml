  choice: Kudumisha taswira halisi ya adui kuwekwa kuwa “kiti cha kuwekea miguu yake.”
  alternative: mpaka adui zake washindwe; mpaka adui zake wawekwe chini ya miguu yake
  rationale: Waebrania inanukia kwa makusudi Zaburi 110:1. Taswira hii huhifadhi uhusiano huo wa kimaandiko na maana yake ya kutawazwa bila kuongeza ufafanuzi wa kimadhehebu.
