- source_word: ἕως
  choice: mpaka
  rationale: Hutambulisha kikomo cha muda wa kungoja.
- source_word: τεθῶσιν
  choice: wawekwe kuwa
  rationale: Huhifadhi hali ya kutendwa ya kitenzi τίθημι na kuunganika kwa kawaida na taswira ya adui kuwa kiti cha kuwekea miguu.
- source_word: οἱ ἐχθροὶ αὐτοῦ
  choice: adui zake
  rationale: Ni namna ya kawaida na wazi ya kuonyesha umilikaji katika Kiswahili.
- source_word: ὑποπόδιον τῶν ποδῶν αὐτοῦ
  choice: kiti cha kuwekea miguu yake
  rationale: Huhifadhi taswira halisi ya Zaburi 110:1 badala ya kuifafanua tu kama kushindwa au kutiishwa.
theological_decisions:
