  text: And the Holy Spirit also testifies to us[a]; for after saying,
translation:
  language: sw
  text: Naye Roho Mtakatifu pia anatushuhudia[a]; kwa maana baada ya kusema,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “anatupa ushuhuda.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μαρτυρεῖ
  choice: anatushuhudia
  rationale: Kitenzi hiki kinahifadhi maana ya kutoa ushuhuda, huku muundo wa sasa ukionyesha tendo la Roho Mtakatifu la kushuhudia.
- source_word: δὲ
  choice: Naye
  rationale: Hiki ni kiunganishi chepesi kinachoendeleza hoja; “Naye” kinaunganisha sentensi na kumweka Roho Mtakatifu kama shahidi wa nyongeza bila kuleta utofauti mkali.
- source_word: ἡμῖν
  choice: -tu- katika “anatushuhudia”
  rationale: Yambwa ya Kiswahili iliyounganishwa na kitenzi huwasilisha kwa kawaida maana ya “kwetu/sisi” katika muktadha huu.
- source_word: καὶ
  choice: pia
  rationale: '“Pia” kinahifadhi nguvu ya nyongeza: Roho Mtakatifu anaongezwa kama shahidi katika hoja.'
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: Roho Mtakatifu
  rationale: Hili ndilo jina la kawaida na lenye hadhi katika Kiswahili cha sasa, nalo linamtambulisha Roho huyo hasa.
- source_word: μετὰ γὰρ τὸ εἰρηκέναι
  choice: kwa maana baada ya kusema
  rationale: Muundo huu unaonyesha mfuatano wa wakati. Kutotaja kiwakilishi cha mtendaji kunahifadhi ufupi na kiasi cha kutotajwa wazi kilichopo katika Kigiriki, huku muktadha ukielekeza kwa Roho Mtakatifu.
theological_decisions:
- issue: Utendaji binafsi wa Roho Mtakatifu katika kutoa ushuhuda
  choice: Roho Mtakatifu pia anatushuhudia
  alternative: Roho Mtakatifu pia anatolea ushuhuda kwetu
  rationale: Tafsiri inamhifadhi Roho Mtakatifu kama mtendaji anayeshuhudia, kama sintaksia ya Kigiriki inavyoonyesha, bila kuongeza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Anatushuhudia” ni kifupi na cha asili; tanbihi huhifadhi njia mbadala iliyo wazi zaidi kuhusu kutoa ushuhuda kwetu.
