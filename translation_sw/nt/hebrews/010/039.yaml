  text: ἡμεῖς δὲ οὐκ ἐσμὲν ὑποστολῆς εἰς ἀπώλειαν, ἀλλὰ πίστεως εἰς περιποίησιν ψυχῆς.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/039.yaml
  text: But we are not of shrinking back to destruction[d][c][b][a], but of faith to the preservation of the soul.
translation:
  language: sw
  text: Lakini sisi hatumo miongoni mwa wale wanaorudi nyuma hata kuangamia,[a] bali miongoni mwa wale wenye imani[b] kwa ajili ya kuhifadhi nafsi.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wanaojiondoa” au “wanaorudi nyuma.” Neno la Kigiriki linaweza kumaanisha kurudi nyuma au kujiondoa; wengine hulichukua hapa kwa maana kali zaidi ya kuiacha imani.
    reason: lexical_alternative
  - marker: b
    text: Au, “uaminifu.” Neno la Kigiriki linaweza kumaanisha imani na pia uaminifu unaodumu.
    reason: alternative_reading
  - marker: c
    text: Au, “kwa ajili ya kuihifadhi nafsi,” “kwa ajili ya kuipata nafsi,” au “kwa ajili ya kuhifadhi uhai.” Neno ψυχή linaweza kumaanisha nafsi, uhai, au mtu mwenyewe.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς δὲ οὐκ ἐσμὲν
  choice: Lakini sisi si watu wa
  rationale: Muundo huu wa Kiswahili unaonyesha msisitizo wa ἡμεῖς, utofauti wa δέ, na hali ya kuwa katika kundi linalotajwa na nomino za hali ya umilikishi.
- source_word: ὑποστολῆς
  choice: kurudi nyuma
  rationale: Hutoa maana ya kujiondoa au kurejea nyuma bila kuifasiri moja kwa moja kuwa uasi kamili.
- source_word: εἰς ἀπώλειαν
  choice: na kuangamia
  rationale: Katika Kiswahili cha kawaida, muunganiko huu unaonyesha matokeo au mwisho wa kurudi nyuma; ἀπώλεια inaweza kumaanisha uangamivu au kupotea.
- source_word: πίστεως
  choice: imani
  rationale: Ni tafsiri ya kawaida ya πίστις na hapa inatofautishwa na kurudi nyuma, huku ikiweza pia kudokeza kudumu kwa uaminifu.
- source_word: εἰς περιποίησιν ψυχῆς
  choice: na kuokoa uhai wetu
  rationale: Muktadha wa utofauti na ἀπώλεια unaunga mkono wazo la kuhifadhi au kuokoa; ψυχή hapa ni nafsi/uhai wa mtu kwa maana pana, si lazima 'roho' kama sehemu tofauti ya binadamu.
theological_decisions:
- issue: Maana ya πίστις inapolinganishwa na ὑποστολή
  choice: imani
  alternative: uaminifu
  rationale: Neno hilo linaweza kujumuisha imani inayodumu kwa uaminifu, lakini maandishi hayalazimishi maana ya 'uaminifu' peke yake.
- issue: Maana ya περιποίησις ψυχῆς
  choice: kuokoa uhai wetu
  alternative: kuhifadhi nafsi; kuupata uhai
  rationale: Utofauti wa moja kwa moja na kuangamia unapendelea maana ya kuokoa au kuhifadhi, lakini uwezekano wa 'kupata' unabaki katika upeo wa neno la Kigiriki na umewekwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Kirai “sisi si watu wa...” ni cha asili katika Kiswahili na huhifadhi mgawanyo wa makundi uliodokezwa na hali ya umilikishi ya Kigiriki. 'Uhai' huepuka kuifanya ψυχή kuwa 'roho' kwa maana finyu.
