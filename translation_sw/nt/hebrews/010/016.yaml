  text: Αὕτη ἡ διαθήκη ἣν διαθήσομαι πρὸς αὐτοὺς μετὰ τὰς ἡμέρας ἐκείνας, λέγει κύριος, διδοὺς νόμους μου ἐπὶ καρδίας αὐτῶν, καὶ ἐπὶ ⸂τὴν διάνοιαν⸃ αὐτῶν ἐπιγράψω αὐτούς,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/016.yaml
  text: 'This is the covenant that I will make with them after those days[a], says the Lord: putting my laws upon their hearts, and I will write them on their minds,'
translation:
  language: sw
  text: “Hili ndilo agano nitakalofanya nao baada ya siku zile,” asema Bwana, “kwa kuweka sheria zangu mioyoni mwao, nami nitaziandika akilini mwao.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa Kiswahili laini zaidi: “Nitaweka sheria zangu mioyoni mwao, nami nitaziandika akilini mwao.”'
    reason: Njia mbadala ya kisarufi inayogeuza kitenzi-tegemezi cha Kigiriki kuwa vitenzi viwili vikuu vya wakati ujao.
lexical_decisions:
- source_word: διαθήκη
  choice: agano
  rationale: “Agano” huhifadhi maana ya uhusiano wa agano katika nukuu ya Yeremia na matumizi yake katika Waebrania.
- source_word: διαθήσομαι πρὸς αὐτούς
  choice: nitakalofanya nao
  rationale: Hii ni kauli ya kawaida ya Kiswahili kwa kufanya agano na watu, huku ikihifadhi wakati ujao.
- source_word: μετὰ τὰς ἡμέρας ἐκείνας
  choice: baada ya siku zile
  rationale: Tafsiri ya moja kwa moja na ya kawaida ya kishazi cha wakati bila kuongeza maelezo yasiyomo.
- source_word: κύριος
  choice: Bwana
  rationale: Hufuata neno la Kigiriki κύριος na matumizi ya kawaida ya kibiblia katika Kiswahili.
- source_word: διδοὺς
  choice: kwa kuweka
  rationale: Huhifadhi umbo la kitenzi-tegemezi linaloeleza namna au maudhui ya agano, badala ya kuligeuza kimya kimya kuwa kitenzi kikuu cha wakati ujao.
- source_word: νόμους μου
  choice: sheria zangu
  rationale: Huhifadhi wingi wa νόμους na uhusiano wake wa kimsamiati na νόμος.
- source_word: ἐπὶ καρδίας αὐτῶν
  choice: mioyoni mwao
  rationale: Ni usemi wa asili wa Kiswahili kwa picha ya sheria kuwekwa ndani ya mioyo; tafsiri ya “juu ya mioyo” ingekuwa ngumu na ingeweza kupotosha maana.
- source_word: ἐπὶ τὴν διάνοιαν αὐτῶν
  choice: akilini mwao
  rationale: “Akili” huwasilisha uwezo wa kufikiri na kuelewa unaomaanishwa na διάνοια, kwa Kiswahili cha kawaida.
- source_word: ἐπιγράψω αὐτούς
  choice: nitaziandika
  rationale: Kiambishi “-zi-” kinarejelea wazi “sheria” na kuhifadhi picha ya kuziandika bila kurudia nomino.
theological_decisions:
- issue: Muundo wa ndani wa nukuu ya Yeremia
  choice: Kuhifadhi kitenzi-tegemezi “kwa kuweka” kisha kitenzi kikuu “nitaziandika”
  alternative: “Nitaweka sheria zangu mioyoni mwao, nami nitaziandika akilini mwao”
  rationale: Kigiriki cha Waebrania kina participle διδοὺς ikifuatiwa na kitenzi cha wakati ujao ἐπιγράψω. Muundo huu unahifadhi tofauti hiyo badala ya kuilinganisha kimya kimya na namna laini zaidi ya kunukuu Yeremia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Mioyoni mwao” na “akilini mwao” ni vya asili kuliko uigaji mgumu wa kihusishi cha Kigiriki, huku tofauti kati ya moyo na akili ikihifadhiwa.
