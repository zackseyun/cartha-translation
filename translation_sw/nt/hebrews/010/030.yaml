  text: οἴδαμεν γὰρ τὸν εἰπόντα· Ἐμοὶ ἐκδίκησις, ἐγὼ ⸀ἀνταποδώσω· καὶ πάλιν· ⸂Κρινεῖ κύριος⸃ τὸν λαὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/030.yaml
  text: For we know the one who said[a], “Vengeance is mine; I will repay,” and again[b], “The Lord will judge his people.”
translation:
  language: sw
  text: Kwa maana tunamjua yule aliyesema, “Kisasi ni changu; mimi nitalipa,” na tena, “Bwana atawahukumu watu wake.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nukuu hizi zinarejelea Kumbukumbu la Torati 32:35–36. Katika muktadha wake wa awali, “kuhukumu” kunaweza kujumuisha kuadhibu na pia kuwatetea watu; hapa muktadha wa onyo unakazia hukumu ya Mungu.
    reason: cross_reference
lexical_decisions:
- source_word: οἴδαμεν
  choice: tunamjua
  rationale: οἶδα ina maana ya wakati wa sasa katika Kiyunani cha Koine. Kiambishi cha yambwa -m- kinafaa kwa kuwa anayejulikana ni mtu, yaani Mungu anayenukuliwa.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Inaendeleza uhusiano wa maelezo na onyo la mstari uliotangulia kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: τὸν εἰπόντα
  choice: yeye aliyesema
  rationale: Kirai hiki kinamtaja Mungu binafsi kuwa ndiye aliyesema maneno ya Maandiko, bila kuongeza jina lisilokuwamo katika mstari.
- source_word: Ἐμοὶ ἐκδίκησις
  choice: Kisasi ni changu
  rationale: Huhifadhi usemi mfupi na wenye mkazo wa Kiyunani, unaomaanisha kwamba haki ya kulipiza kisasi ni ya Mungu.
- source_word: ἀνταποδώσω
  choice: mimi nitalipa
  rationale: Kitenzi kina maana ya kulipa au kutoa malipo yanayostahili. Kiwakilishi “mimi” kinahifadhi mkazo wa ἐγώ.
- source_word: καὶ πάλιν
  choice: na tena
  rationale: Ni fomula ya kawaida ya kutanguliza nukuu ya pili bila kuongeza kitenzi kisichotajwa wazi.
- source_word: Κρινεῖ
  choice: atawahukumu
  rationale: “Hukumu” huhifadhi wigo wa kisheria wa κρίνω na uzito wake katika muktadha huu wa onyo; umbo la wingi la yambwa linapatana na “watu wake.”
- source_word: κύριος
  choice: Bwana
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa κύριος linapomtaja Mungu.
- source_word: τὸν λαὸν αὐτοῦ
  choice: watu wake
  rationale: Ni tafsiri ya asili ya Kiswahili inayohifadhi uhusiano wa agano bila kuongeza “mwenyewe.”
theological_decisions:
- issue: Maana ya lugha ya hukumu katika nukuu ya Kumbukumbu la Torati
  choice: “Kisasi ni changu; mimi nitalipa” na “Bwana atawahukumu watu wake.”
  alternative: “Bwana atawatetea watu wake.”
  rationale: Katika chanzo cha Kumbukumbu la Torati, wazo la kuhukumu linaweza kujumuisha adhabu na kuwatetea watu. Hata hivyo, muktadha wa onyo katika Waebrania 10 unasisitiza hukumu ya Mungu. “Atawahukumu” huhifadhi maana pana na mvutano huo badala ya kuufanya uwe utetezi pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa nukuu umehifadhiwa kwa ufupi na kwa uzito unaofaa onyo hili.
