lexical_decisions:
- source_word: ἔτι γὰρ
  choice: Kwa maana bado
  rationale: “Kwa maana” linaonyesha uhusiano wa maelezo na himizo lililotangulia, na “bado” linahifadhi maana ya wakati ya ἔτι.
- source_word: μικρὸν ὅσον ὅσον
  choice: muda mfupi sana
  rationale: Usemi huu wenye urudiaji unasisitiza ufupi mkubwa wa muda; tafsiri hii ni ya kawaida katika Kiswahili na inahifadhi msisitizo huo.
- source_word: ὁ ἐρχόμενος
  choice: yule ajaye
  rationale: Kirai hiki ni kishiriki chenye kibainishi kinachotumiwa kama nomino. “Yule ajaye” kinahifadhi hali yake ya kushirikisha tendo na kinaweza kueleweka ama kama maelezo ama kama jina la kimasiha kulingana na muktadha.
- source_word: ἥξει
  choice: atakuja
  rationale: Kitenzi hiki cha wakati ujao kina maana ya moja kwa moja ya kuja, na pia kinahifadhi mwangwi wa kitenzi uliomo katika “ajaye.”
- source_word: οὐ χρονίσει
  choice: wala hatakawia
  rationale: χρονίζω hapa humaanisha kuchelewa au kukawia. “Hatakawia” ni Kiswahili cha sasa, wazi na chenye hadhi; “wala” linaunganisha ukanushi kwa mtiririko wa kawaida.
theological_decisions:
- issue: Ikiwa ὁ ἐρχόμενος itafsiriwe wazi kama cheo cha Kimasiha au kama kirai cha kawaida cha kishiriki
  choice: yule ajaye
  alternative: Ajaye
  rationale: Muktadha unaelekea kwenye maana ya Kimasiha, lakini umbo la Kigiriki pia linaweza kusomwa kama kirai cha kawaida. “Yule ajaye” linadumisha urejeo maalumu bila kulazimisha kwa herufi kubwa kwamba lazima liwe cheo rasmi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Muda mfupi sana” huepuka tafsiri ya neno kwa neno isiyo ya kawaida, huku “yule ajaye atakuja” ikihifadhi urudiaji wa mzizi wa kitenzi katika Kigiriki na mvutano wa maana kuhusu cheo cha Kimasiha.
