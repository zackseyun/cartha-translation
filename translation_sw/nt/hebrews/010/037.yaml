  text: Kwa maana, bado muda mfupi sana tu[a]; yule ajaye[b] atakuja, wala hatakawia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki hurudia neno linalomaanisha “kadiri” au “kiasi”; nahau hiyo husisitiza kwamba muda uliobaki ni mfupi sana.
    reason: lexical_alternative
  - marker: b
    text: Au, “Ajaye.” Katika muktadha huu usemi huu huenda ukawa cheo kinachomhusu Masihi, ingawa Kigiriki pia kinaweza kueleweka kwa ujumla kuwa “yule anayekuja.”
