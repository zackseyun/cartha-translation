base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/023.yaml
  text: Let us hold fast the confession of our hope without wavering[a], for the one who promised is faithful.
translation:
  language: sw
  text: Tushike imara ungamo la tumaini letu lisilotetereka, kwa maana yeye aliyeahidi ni mwaminifu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ungamo la tumaini.” Kigiriki hakisemi wazi “letu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέχωμεν
  choice: Na tushike
  rationale: Kauli ya nafsi ya kwanza wingi katika hali ya kutia moyo inaleta wito wa pamoja; “Na tushike” ni ya kawaida na huhifadhi maana ya kuendelea kushikilia kwa uthabiti.
- source_word: ὁμολογίαν
  choice: ungamo
  rationale: “Ungamo” linaonyesha kukiri au kutangaza hadharani imani na msimamo, kama muktadha wa Waebrania unavyodai.
- source_word: τῆς ἐλπίδος
  choice: la tumaini letu
  rationale: Kigiriki hakina kiwakilishi cha umilikaji kilicho wazi, lakini “letu” hufanya Kiswahili kiwe cha kawaida katika wito unaoelekezwa kwa jumuiya; tanbihi huhifadhi uwezekano wa tafsiri ya moja kwa moja zaidi.
- source_word: ἀκλινῆ
  choice: bila kuyumba
  rationale: Kivumishi hiki kina maana ya kutokupinda au kutotetereka; msemo “bila kuyumba” ni wa asili na unaonyesha uthabiti unaotakiwa.
- source_word: πιστὸς
  choice: mwaminifu
  rationale: “Mwaminifu” huhifadhi maana ya mtu anayetegemeka na pia mwangwi wa kitheolojia wa uaminifu wa Mungu.
- source_word: ὁ ἐπαγγειλάμενος
  choice: yeye aliyeahidi
  rationale: Kirai hiki cha kishirikishi chenye kibainishi humaanisha yule aliyetoa ahadi; tafsiri haiongezi jina “Mungu,” hivyo inadumisha namna chanzo kilivyoacha mhusika akieleweka kwa muktadha.
theological_decisions:
- issue: Mhusika wa “yeye aliyeahidi”
  choice: Ameachwa bila kutajwa kwa jina, kama katika Kigiriki.
  alternative: “Mungu aliyeahidi”
  rationale: Muktadha unaonyesha kwamba ni Mungu, lakini chanzo hakimtaji wazi katika mstari huu; kutomtaja kwa jina huepuka kuongeza ufafanuzi wa kitafsiri.
- issue: Kuongeza “letu” baada ya “tumaini”
  choice: “ungamo la tumaini letu” kwa Kiswahili cha kawaida cha wito wa kijumuiya.
  alternative: “ungamo la tumaini”
  rationale: “Letu” halipo wazi katika Kigiriki, ingawa linaeleweka kutokana na nafsi ya kwanza wingi. Tanbihi inaweka wazi tofauti hiyo bila kupoteza mtiririko wa kawaida wa Kiswahili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Ungamo” limetumiwa kwa maana ya kukiri imani hadharani; “bila kuyumba” ni msemo wa kawaida unaohifadhi wito wa kudumu imara.
