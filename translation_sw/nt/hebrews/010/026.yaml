  text: Ἑκουσίως γὰρ ἁμαρτανόντων ἡμῶν μετὰ τὸ λαβεῖν τὴν ἐπίγνωσιν τῆς ἀληθείας, οὐκέτι περὶ ἁμαρτιῶν ἀπολείπεται θυσία,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/026.yaml
  text: For if we go on sinning deliberately after receiving the knowledge of the truth[a], there no longer remains a sacrifice for sins,
translation:
  language: sw
  text: Kwa maana, ikiwa tunaendelea kutenda dhambi kwa makusudi baada ya kupokea maarifa ya kweli[a], hakuna dhabihu tena kwa ajili ya dhambi,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “maarifa kamili ya kweli.” Neno la Kigiriki linaweza kuwa na maana ya maarifa kamili zaidi au ya kina zaidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἑκουσίως
  choice: kwa makusudi
  rationale: Ni Kiswahili cha kawaida na chenye hadhi kinachoonyesha kutenda kwa kujua na kukusudia, bila kutumia lugha nzito ya kisheria.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Inaendeleza uhusiano wa maelezo na hoja iliyotangulia.
- source_word: ἁμαρτανόντων ἡμῶν
  choice: ikiwa tunaendelea kutenda dhambi
  rationale: Kishiriki cha wakati uliopo katika muundo wa genitivi kinaelekea kuonyesha tendo linaloendelea; 'tunaendelea' huhifadhi nguvu hiyo, na 'ikiwa' hufanya uhusiano wa kimantiki uwe wa asili katika Kiswahili.
- source_word: μετὰ τὸ λαβεῖν
  choice: baada ya kupokea
  rationale: Huhifadhi mfuatano wa wakati na tendo lililotangulia kwa lugha fupi na ya kawaida.
- source_word: ἐπίγνωσιν
  choice: ujuzi
  rationale: '''Ujuzi'' ni tafsiri ya asili hapa bila kulazimisha maana ya kitheolojia kuhusu hali ya kiroho; uwezekano wa maana yenye nguvu zaidi umewekwa katika tanbihi.'
- source_word: τῆς ἀληθείας
  choice: wa kweli
  rationale: Ni muundo wa kawaida wa Kiswahili unaolingana na genitivi ya Kigiriki na kudokeza kweli inayojulikana katika muktadha.
- source_word: οὐκέτι
  choice: haibaki tena
  rationale: Huonyesha kwamba kuanzia hapo dhabihu hiyo haipo kama jambo linalobaki.
- source_word: περὶ ἁμαρτιῶν
  choice: kwa ajili ya dhambi
  rationale: Katika muktadha wa dhabihu, περί pamoja na genitivi ina maana ya dhabihu inayohusiana na au kutolewa kwa ajili ya dhambi.
- source_word: ἀπολείπεται
  choice: haibaki
  rationale: Hutoa kwa kawaida maana ya kitu kutosalia au kutokuwapo tena.
- source_word: θυσία
  choice: dhabihu
  rationale: Ni istilahi ya kawaida ya kibiblia kwa sadaka inayotolewa kwa kusudi la kidini na inafaa hoja ya Waebrania kuhusu dhabihu.
theological_decisions:
- issue: Nyanja ya tendo na uzito wa kichungaji wa ἁμαρτανόντων
  choice: ikiwa tunaendelea kutenda dhambi kwa makusudi
  alternative: ikiwa tunatenda dhambi kwa makusudi
  rationale: Kishiriki cha wakati uliopo kinaunga mkono tendo linaloendelea au la kudumu, si lazima tendo moja pekee. Tafsiri inadumisha uzito wa onyo bila kuingiza fundisho maalumu la kimadhehebu kuhusu uasi au kudumu katika wokovu.
- issue: Nguvu ya ἐπίγνωσις katika muktadha wa onyo
  choice: ujuzi wa kweli
  alternative: ujuzi kamili wa kweli
  rationale: Andiko linasema wamepokea ujuzi wa kweli, lakini halifafanui moja kwa moja kiwango chake cha kiroho wala kama ni kuzaliwa upya. Maana yenye nguvu zaidi inadumishwa katika tanbihi bila kutatua mjadala wa kitheolojia kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi na inayoeleweka kwa wasomaji wa kawaida. Muundo 'tunaendelea kutenda dhambi' umechaguliwa ili kuonyesha tendo endelevu, na sentensi imeachwa na koma kwa kuwa aya inaendelea kisintaksia katika mstari unaofuata.
