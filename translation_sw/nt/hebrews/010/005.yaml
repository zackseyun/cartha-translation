  text: διὸ εἰσερχόμενος εἰς τὸν κόσμον λέγει· Θυσίαν καὶ προσφορὰν οὐκ ἠθέλησας, σῶμα δὲ κατηρτίσω μοι·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/005.yaml
  text: 'Therefore[a], when he comes into the world, he says: “Sacrifice and offering you did not desire, but a body you prepared for me.”'
translation:
  language: sw
  text: 'Kwa hiyo[a], anapoingia ulimwenguni, anasema: “Dhabihu na sadaka hukuzitaka, bali uliniandalia mwili.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hapa Waebrania inafuata maneno ya Kigiriki ya Zaburi 40:6, “mwili uliniandalia.” Maandishi ya Kiebrania ya Zaburi 40:6 yanasema, “masikio umenifungulia.”
    reason: alternative_reading
lexical_decisions:
- source_word: διὸ
  choice: Kwa hiyo
  rationale: Inaonyesha hitimisho linalotokana na hoja iliyotangulia kwa Kiswahili cha kawaida na wazi.
- source_word: εἰσερχόμενος εἰς τὸν κόσμον
  choice: anapoingia ulimwenguni
  rationale: Inahifadhi hali ya wakati mmoja ya kirai-shirikishi cha sasa na picha hai ya kuja kwake katika ulimwengu bila kulazimisha wakati uliopita.
- source_word: λέγει
  choice: anasema
  rationale: Inahifadhi wakati wa sasa unaotumiwa kutambulisha maneno ya Maandiko.
- source_word: Θυσίαν καὶ προσφορὰν
  choice: Dhabihu na sadaka
  rationale: Maneno haya yanatenganisha aina mbili zinazohusiana za matoleo ya ibada; ni lugha ya kawaida na yenye hadhi katika Kiswahili cha kibiblia.
- source_word: οὐκ ἠθέλησας
  choice: hukuzitaka
  rationale: Huwasilisha kwa kawaida maana ya kutotaka au kutotamani, huku kiambishi cha ngeli ya wingi kikirejelea dhabihu na sadaka kwa pamoja.
- source_word: σῶμα
  choice: mwili
  rationale: Ni nomino halisi ya umoja na huhifadhi uzito wa mwili katika hoja ya Waebrania bila kuongeza ufafanuzi.
- source_word: δὲ
  choice: bali
  rationale: Inaonyesha tofauti dhahiri kati ya dhabihu na sadaka ambazo hazikutakiwa na mwili ulioandaliwa.
- source_word: κατηρτίσω μοι
  choice: uliniandalia
  rationale: Kitenzi hiki huonyesha kuandaa, na kiambishi -ni- huwasilisha dative μοι kwa maana ya ‘kwa ajili yangu’ kwa Kiswahili cha asili.
theological_decisions:
- issue: Maneno ya nukuu ya Zaburi 40:6 katika Waebrania yanatofautiana na maandishi ya Kiebrania ya Zaburi hiyo.
  choice: mwili uliniandalia
  alternative: masikio umenifungulia
  rationale: Tafsiri inafuata moja kwa moja maandishi ya Kigiriki ya Waebrania 10:5, σῶμα δὲ κατηρτίσω μοι, bila kuyapatanisha kimya kimya na maandishi ya Kiebrania ya Zaburi. Tofauti muhimu imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo ‘anapoingia’ huhifadhi uhai wa kirai cha Kigiriki; ‘uliniandalia mwili’ ni wa asili zaidi kuliko ‘uliandaa mwili kwa ajili yangu’ huku ukihifadhi maana ileile.
