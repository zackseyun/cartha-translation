  to: Kwa kuwa sheria ina kivuli cha mambo mema yatakayokuja, wala si sura yenyewe ya mambo hayo,[a] haiwezi kamwe, kwa dhabihu zilezile wanazotoa daima mwaka baada ya mwaka, kuwakamilisha[c] wale wanaokaribia.[b]
