id: HEB.10.1
reference: Hebrews 10:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Σκιὰν γὰρ ἔχων ὁ νόμος τῶν μελλόντων ἀγαθῶν, οὐκ αὐτὴν τὴν εἰκόνα τῶν πραγμάτων, κατ’ ἐνιαυτὸν ταῖς αὐταῖς θυσίαις ἃς προσφέρουσιν εἰς τὸ διηνεκὲς οὐδέποτε ⸀δύναται τοὺς προσερχομένους τελειῶσαι·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/001.yaml
  text: For since the law has only a shadow of the good things to come[a], not the very form of the realities, it can never, by the same sacrifices that they continually offer year after year[c][b], perfect those who draw near.
translation:
  language: sw
  text: Kwa kuwa sheria ina kivuli cha mambo mema yatakayokuja, wala si sura yenyewe ya mambo hayo,[a] haiwezi kamwe, kwa dhabihu zilezile wanazotoa daima mwaka baada ya mwaka, kuwakamilisha[c] wale wanaokaribia.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wala si picha yenyewe ya mambo hayo.”
    reason: lexical_alternative
  - marker: b
    text: “Wale wanaokaribia” katika Waebrania huweza kudokeza watu wanaomkaribia Mungu katika ibada.
    reason: cultural_note
  - marker: c
    text: Au, “kuwafanya wakamilifu” au “kuwafikisha kwenye ukamilifu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Σκιὰν
  choice: kivuli
  rationale: Neno hili huhifadhi sitiari ya kitu kinachoonyesha kwa kutangulia yale yatakayokuja, lakini ambacho si uhalisia kamili.
- source_word: τῶν μελλόντων ἀγαθῶν
  choice: cha mambo mema yatakayokuja
  rationale: Huhifadhi maana ya mambo mema yaliyo mbele bila kubainisha zaidi wakati wake wa kutimia.
- source_word: οὐκ αὐτὴν τὴν εἰκόνα τῶν πραγμάτων
  choice: wala si sura halisi ya mambo hayo
  rationale: “Sura halisi” huwasilisha nguvu ya αὐτήν na tofauti kati ya kivuli na uhalisia unaolingana nacho, huku tanbihi ikihifadhi tafsiri ya moja kwa moja zaidi ya εἰκών.
- source_word: κατ’ ἐνιαυτὸν
  choice: mwaka baada ya mwaka
  rationale: Usemi huu wa kawaida unaonyesha kurudiwa kwa dhabihu kila mwaka.
- source_word: ταῖς αὐταῖς θυσίαις
  choice: kwa dhabihu zilezile
  rationale: “Kwa” huonyesha njia au chombo, na “zilezile” huhifadhi mkazo wa dhabihu zinazojirudia.
- source_word: ἃς προσφέρουσιν εἰς τὸ διηνεκές
  choice: wanazotoa daima
  rationale: Huhifadhi kauli tendaji yenye mtendaji asiyetajwa wazi na hali ya utoaji unaoendelea.
- source_word: οὐδέποτε δύναται
  choice: haiwezi kamwe
  rationale: Huhifadhi uwezo unaokanushwa kabisa kwa lugha ya kawaida ya Kiswahili.
- source_word: τοὺς προσερχομένους
  choice: wale wanaomkaribia Mungu
  rationale: Katika muktadha wa Waebrania, kitenzi hiki huelekea kumaanisha kumkaribia Mungu katika ibada; kumtaja Mungu hufanya usemi uwe wa asili na wazi katika Kiswahili.
- source_word: τελειῶσαι
  choice: kuwakamilisha
  rationale: Huhifadhi istilahi kuu ya Waebrania kuhusu kufikishwa kwenye lengo lililokusudiwa na kupata njia kamili ya kumkaribia Mungu, bila kuifasiri moja kwa moja kuwa ukamilifu wa kimaadili.
theological_decisions:
- issue: Tofauti kati ya kivuli na uhalisia katika sheria na dhabihu
  choice: Sheria ina kivuli kinachotangulia mambo mema yajayo, lakini si sura halisi ya mambo hayo.
  alternative: Sheria yenyewe ni picha kamili ya mambo mema yajayo.
  rationale: Kigiriki kinatofautisha wazi σκιά na αὐτὴν τὴν εἰκόνα. Tafsiri inadumisha nafasi ya sheria kama ishara ya kutangulia bila kuifanya iwe utimilifu wenyewe.
- issue: Maana ya τελειῶσαι katika muktadha wa dhabihu
  choice: kuwakamilisha
  alternative: kuwafikisha kwenye ukamilifu; kuwatimilisha
  rationale: “Kuwakamilisha” hudumisha msamiati wa kiteolojia wa Waebrania na wazo la kufikishwa kwenye lengo, lakini tanbihi inaonya dhidi ya kuielewa tu kama kutokuwa na dosari za kimaadili.
- issue: Yule anayekaribiwa katika τοὺς προσερχομένους
  choice: wale wanaomkaribia Mungu
  alternative: wale wanaokaribia
  rationale: Kitenzi hakitaji kitu chake moja kwa moja, lakini matumizi yake ya kiibada katika Waebrania yanaelekea kwa Mungu. Tafsiri inaweka maana hiyo wazi huku tanbihi ikieleza muktadha wa ibada.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Mpangilio wa sentensi unafuata hoja ndefu ya Kigiriki bila kuwa mzito kupita kiasi. “Dhabihu,” “sheria,” na “kumkaribia Mungu” hudumisha muktadha wa ibada.
