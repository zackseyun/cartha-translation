lexical_decisions:
- source_word: μὴ ἀποβάλητε
  choice: msiutupe
  rationale: Kitenzi katika hali ya kukataza kinaonyesha tendo la makusudi la kutupilia mbali, si kupoteza tu bila kukusudia.
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Inaonyesha hitimisho au himizo linalotokana na yaliyotangulia.
- source_word: παρρησίαν
  choice: ujasiri
  rationale: Neno hili linaweza kumaanisha uhuru wa kusema au kumkaribia Mungu kwa ujasiri na kujiamini; “ujasiri” huhifadhi nguvu ya himizo katika muktadha huu.
- source_word: ὑμῶν
  choice: wenu
  rationale: Ni kiwakilishi cha umilikaji kinachohusiana na “ujasiri.”
- source_word: ἥτις
  choice: ambao
  rationale: Kiwakilishi cha uhusiano kinaanzisha maelezo kuhusu sifa ya ujasiri huo.
- source_word: ἔχει
  choice: una
  rationale: Huhifadhi kauli ya moja kwa moja kwamba ujasiri huo una thawabu, bila kuifasiri kwa kuongeza wazo la kuleta au kusababisha.
- source_word: μεγάλην
  choice: kubwa
  rationale: Ni tafsiri ya kawaida na ya asili inapohusishwa na “thawabu.”
- source_word: μισθαποδοσίαν
  choice: thawabu
  rationale: Hutoa maana ya malipo mema au tuzo kwa lugha ya kawaida, bila kuingiza hisia ya biashara isiyolazimishwa na muktadha.
theological_decisions:
- issue: Maana ya παρρησία katika Waebrania 10:35
  choice: ujasiri
  alternative: uhakika; kujiamini
  rationale: Katika Waebrania neno hili huhusishwa na uhuru wa kumkaribia Mungu kwa kujiamini na kudumu wazi katika imani. “Ujasiri” huhifadhi mkazo wa himizo bila kulifungia neno hilo katika hisia ya ndani pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “msiutupe” huhifadhi taswira yenye nguvu ya tendo la makusudi, huku sentensi ikibaki wazi kwa msomaji wa kawaida.
