base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/002.yaml
  text: Otherwise[a], would they not have stopped being offered, because those who worship, having once been cleansed[b], would no longer have any consciousness of sins?
translation:
  language: sw
  text: Kama sivyo, je, dhabihu hizo hazingeacha kutolewa? Kwa maana waabudu, baada ya kusafishwa mara moja[b], hawangekuwa tena na ufahamu wowote wa dhambi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “dhamiri kuhusu dhambi.” Neno la Kigiriki linaweza kumaanisha dhamiri, ufahamu, au hali ya kutambua dhambi; hapa linahusu hali ya kuendelea kujiona na hatia mbele za Mungu.
    reason: lexical_alternative
  - marker: b
    text: Au, “baada ya kutakaswa mara moja tu.” Katika muktadha huu, “mara moja” linaweza kuwa na maana ya tendo la mwisho lisilohitaji kurudiwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ
  choice: Kama sivyo
  rationale: Katika hoja hii neno hilo linaanzisha hitimisho la hali iliyo kinyume na uhalisi, likirejelea mstari uliotangulia.
- source_word: οὐκ ἂν ἐπαύσαντο προσφερόμεναι
  choice: je, dhabihu hizo hazingeacha kutolewa?
  rationale: Muundo wa Kigiriki ni swali la balagha kuhusu hali isiyotokea. 'Dhabihu hizo' inaweka wazi kiwakilishi kinachorejelea dhabihu za mstari uliotangulia bila kubadili maana.
- source_word: διὰ τὸ μηδεμίαν ἔχειν ἔτι
  choice: Kwa maana ... hawangekuwa tena na ... wowote
  rationale: Muundo wenye διά unaonyesha sababu, na ἔτι inaonyesha kwamba hali hiyo isingeendelea baada ya kusafishwa.
- source_word: συνείδησιν ἁμαρτιῶν
  choice: ufahamu wowote wa dhambi
  rationale: συνείδησις linaweza kumaanisha dhamiri, ufahamu, au hali ya kutambua. 'Ufahamu wa dhambi' huepuka kudokeza kwamba waabudu wangepoteza uwezo wa kimaadili wa kutambua dhambi.
- source_word: τοὺς λατρεύοντας
  choice: waabudu
  rationale: Hili ni jina linalotokana na kitenzi na linawataja wale wanaoshiriki katika ibada; 'waabudu' ni fupi na ya kawaida katika Kiswahili.
- source_word: ἅπαξ
  choice: mara moja
  rationale: Neno linaweza kumaanisha tukio lililotokea mara moja na, katika muktadha huu, linaweza pia kusisitiza ukamilifu usiohitaji kurudiwa; tafsiri kuu haiongezi nguvu hiyo bila kuieleza katika tanbihi.
- source_word: κεκαθαρισμένους
  choice: baada ya kusafishwa
  rationale: Kauli timilifu tendwa inaonyesha tendo lililokamilika lenye matokeo yanayoendelea; muundo huu ni wa kawaida na unaeleweka katika Kiswahili.
theological_decisions:
- issue: Maana ya συνείδησιν ἁμαρτιῶν baada ya waabudu kusafishwa
  choice: ufahamu wowote wa dhambi
  alternative: dhamiri kuhusu dhambi
  rationale: Hoja inahusu kuondolewa kwa hali ya kuendelea kujiona na hatia mbele za Mungu, si kuondolewa kwa uwezo wa kutambua dhambi kimaadili. Tanbihi inadumisha upana wa maana ya neno la Kigiriki.
- issue: Nguvu ya ἅπαξ
  choice: mara moja
  alternative: mara moja tu, kwa ukamilifu
  rationale: Tafsiri kuu inadumisha maana ya msingi bila kuamua kimya kimya kama kielezi hicho hapa lazima kieleweke kuwa 'mara moja tu kwa wakati wote'; uwezekano huo umeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Swali la kwanza limetenganishwa ili mtiririko wa hoja uwe wa kawaida katika Kiswahili; sentensi ya pili inaeleza sababu iliyomo katika διὰ τό. Alama za tanbihi zimewekwa moja kwa moja baada ya maneno yanayofafanuliwa.
