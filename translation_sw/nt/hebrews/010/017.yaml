translation:
  language: sw
  text: na dhambi zao na matendo yao ya kuvunja sheria sitayakumbuka tena.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata muundo wa Kigiriki kwa karibu zaidi, “hakika sitazikumbuka tena dhambi zao na matendo yao ya kuvunja sheria.”
    reason: lexical_alternative
  - marker: b
    text: “Matendo ya kuvunja sheria” hutafsiri ἀνομίαι, yaani matendo yanayokiuka sheria; pia inaweza kutafsiriwa “matendo ya uasi” au, kwa mtindo wa jadi, “maovu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: na
  rationale: Kiunganishi kimehifadhiwa mwanzoni kwa sababu kifungu hiki kinaendeleza nukuu na kukiunganisha na kauli iliyotangulia.
- source_word: τῶν ἁμαρτιῶν αὐτῶν
  choice: dhambi zao
  rationale: ἁμαρτία kwa kawaida ni ‘dhambi’; wingi pamoja na αὐτῶν unatafsiriwa kwa njia ya moja kwa moja na ya kawaida kuwa ‘dhambi zao.’
- source_word: καὶ τῶν ἀνομιῶν αὐτῶν
  choice: na matendo yao ya uasi-sheria
  rationale: ἀνομία hueleza hali au tendo la kuvunja au kukaidi sheria. ‘Matendo ya uasi-sheria’ ni wazi kwa msomaji wa leo na huhifadhi maana halisi ya wingi kuliko neno pana kama ‘maovu.’
- source_word: οὐ μὴ μνησθήσομαι
  choice: sitayakumbuka
  rationale: οὐ μή pamoja na kitenzi cha wakati ujao ni ukanushi wenye mkazo. Kiswahili ‘sitayakumbuka’ kikifuatiwa na ‘tena’ huwasilisha kukataa kabisa kuyakumbuka kuanzia hapo.
- source_word: ἔτι
  choice: tena
  rationale: Katika muundo huu wa ukanushi, ἔτι humaanisha ‘tena’ au ‘kuanzia sasa’; nafasi yake baada ya kitenzi ni ya asili katika Kiswahili.
theological_decisions:
- issue: Mungu kutozikumbuka dhambi
  choice: 'Kudumisha tamathali ya moja kwa moja: ‘sitayakumbuka tena.’'
  alternative: Kufafanua kuwa ‘sitawahesabia tena’ au ‘sitazileta tena dhidi yao.’
  rationale: ‘Kukumbuka’ huhifadhi lugha muhimu ya agano iliyo katika andiko bila kuamua kwamba Mungu hupoteza maarifa au kufafanua kimadhehebu jinsi ahadi hiyo inavyotekelezwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umehifadhi mwanzo wa ‘na’ kwa kuwa mstari unaendeleza nukuu ya mstari uliotangulia. ‘Uasi-sheria’ ni sahihi lakini si neno la mazungumzo ya kila siku, hivyo limefafanuliwa katika tanbihi.
