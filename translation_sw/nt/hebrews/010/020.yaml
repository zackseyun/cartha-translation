lexical_decisions:
- source_word: ἣν
  choice: ambayo
  rationale: Kiwakilishi hiki cha uhusiano kinaendeleza sentensi ya mstari uliotangulia bila kubainisha zaidi ya Kigiriki kile kinachorejelewa.
- source_word: ἐνεκαίνισεν
  choice: alituanzishia
  rationale: Kitenzi hiki kinaonyesha kuanzishwa au kuwekwa kwa jambo jipya ili litumiwe; ‘alituanzishia’ huhifadhi wazo hilo na pia manufaa yanayoonyeshwa na ἡμῖν.
- source_word: ἡμῖν
  choice: -tu-
  rationale: Kiambishi cha yambwa ‘-tu-’ katika ‘alituanzishia’ huonyesha kwamba njia hiyo ilianzishwa kwa ajili yetu.
- source_word: ὁδὸν
  choice: njia
  rationale: ‘Njia’ ni tafsiri ya kawaida na ya asili, na inafaa kwa taswira ya kumfikia Mungu.
- source_word: πρόσφατον
  choice: mpya
  rationale: Katika muktadha huu neno linaeleza njia iliyoanzishwa karibuni au upya; ‘mpya’ ni wazi na ya kawaida.
- source_word: ζῶσαν
  choice: iliyo hai
  rationale: Tafsiri hii huhifadhi maana ya moja kwa moja ya ‘hai’ bila kuifasiri zaidi kuwa ‘itoayo uzima.’
- source_word: διὰ τοῦ καταπετάσματος
  choice: kupitia pazia
  rationale: καταπέτασμα ni pazia la hema takatifu au hekalu. ‘Pazia’ ni neno la sasa na linaloeleweka kwa urahisi.
- source_word: τοῦτ’ ἔστιν
  choice: yaani
  rationale: ‘Yaani’ ni njia ya kawaida ya Kiswahili ya kuingiza ufafanuzi au utambulisho unaofuata.
- source_word: τῆς σαρκὸς αὐτοῦ
  choice: mwili wake
  rationale: Katika Kiswahili, ‘mwili wake’ huwasilisha kwa kawaida rejeo halisi la σάρξ kwa ubinadamu wa kimwili wa Yesu; ‘nyama yake’ ingeweza kueleweka vibaya kama nyama ya chakula.
theological_decisions:
- issue: Utambulisho wa kitamathali wa pazia na mwili wa Yesu
  choice: yaani, mwili wake
  alternative: yaani, kupitia mwili wake
  rationale: Kigiriki kinaweka ‘mwili wake’ kama ufafanuzi wa ‘pazia.’ Kutokurudia ‘kupitia’ huhifadhi utambulisho huo na pia ubainifu wa kisarufi, bila kuamua kwa lazima kama kishazi hicho kinasisitiza pazia lenyewe au njia ya kupitia mwili wake.
- issue: Tafsiri ya σάρξ
  choice: mwili
  alternative: nyama
  rationale: Hapa σάρξ linarejelea hali halisi ya kimwili ya Yesu, si ‘asili ya dhambi.’ ‘Mwili’ ni tafsiri ya Kiswahili iliyo wazi na yenye heshima katika muktadha huu, huku tanbihi ikieleza kazi yake katika taswira.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka. Sentensi imeachwa kama mwendelezo wa mstari uliotangulia, sawa na muundo wa Kigiriki. Alama zote za tanbihi zimewekwa katika matini kuu.
