  text: which he inaugurated for us as a new and living way through the curtain—that is[a], his flesh[b],
translation:
  language: sw
  text: 'ambayo alituanzishia: njia mpya na iliyo hai kupitia pazia[a]—yaani, mwili wake[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “utaji.”
    reason: lexical_alternative
  - marker: b
    text: Maneno “yaani, mwili wake” yanafafanua taswira ya pazia kwa kulitambulisha na mwili wake.
