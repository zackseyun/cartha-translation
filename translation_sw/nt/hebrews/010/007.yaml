  text: τότε εἶπον· Ἰδοὺ ἥκω, ἐν κεφαλίδι βιβλίου γέγραπται περὶ ἐμοῦ, τοῦ ποιῆσαι, ὁ θεός, τὸ θέλημά σου.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/007.yaml
  text: Then I said[a], ‘Behold, I have come—in the scroll of the book it is written about me—to do your will, O God.’
translation:
  language: sw
  text: Ndipo nikasema, “Tazama, nimekuja—katika gombo la kitabu[a] imeandikwa kunihusu—ili nifanye mapenzi yako, Ee Mungu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika hati-kunjo ya kitabu.” Msemo huu unarejelea gombo la maandishi, si kitabu cha kisasa chenye kurasa zilizofungwa pamoja.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Ndipo
  rationale: Huonyesha mfuatano wa wakati na kuanzisha jibu lililonukuliwa kwa ufupi na kwa Kiswahili cha kawaida.
- source_word: εἶπον
  choice: nikasema
  rationale: Ni tafsiri ya kawaida ya kitenzi hiki katika kauli ya kusimulia inayotanguliza maneno ya moja kwa moja.
- source_word: Ἰδοὺ
  choice: Tazama
  rationale: Huhifadhi msisitizo wa kuelekeza fikira na uzito wa lugha ya Maandiko bila kuwa ya kizamani kupita kiasi.
- source_word: ἥκω
  choice: nimekuja
  rationale: Ingawa umbo la Kigiriki ni la wakati uliopo, kitenzi hiki mara nyingi huonyesha kufika ambako matokeo yake yapo sasa; ‘nimekuja’ huwasilisha maana hiyo.
- source_word: ἐν κεφαλίδι βιβλίου
  choice: katika gombo la kitabu
  rationale: Katika msemo huu κεφαλίς hurejelea gombo, yaani umbo la kale la kitabu, wala si kichwa cha habari au sura ya kitabu.
- source_word: γέγραπται
  choice: imeandikwa
  rationale: Huhifadhi kauli ya kawaida ya Maandiko kwamba jambo limeandikwa na bado linasimama likiwa na mamlaka.
- source_word: περὶ ἐμοῦ
  choice: kunihusu
  rationale: Ni Kiswahili cha sasa na cha moja kwa moja kinachowasilisha maana ya περί pamoja na uhusiano wa nafsi ya kwanza.
- source_word: τοῦ ποιῆσαι
  choice: ili nifanye
  rationale: Huwasilisha kusudi la kuja kwa msemaji na kudumisha uhusiano wa nafsi ya kwanza ulio wazi katika muktadha.
- source_word: ὁ θεός
  choice: Ee Mungu
  rationale: Ingawa Kigiriki kimetumia umbo la nomino, hapa lina nguvu ya kumwita Mungu moja kwa moja; ‘Ee Mungu’ huonyesha mwito huo wazi.
- source_word: τὸ θέλημά σου
  choice: mapenzi yako
  rationale: ‘Mapenzi’ ni istilahi ya kawaida na sahihi kwa θέλημα katika muktadha huu, ikimaanisha kile Mungu anachotaka.
theological_decisions:
- issue: Msemaji wa nafsi ya kwanza katika nukuu ya Zaburi na matumizi yake kwa Masihi katika Waebrania
  choice: Kauli imetafsiriwa moja kwa moja katika nafsi ya kwanza bila kumtaja wazi Masihi ndani ya aya hii.
  alternative: Kumtambulisha msemaji moja kwa moja kuwa Masihi au Kristo katika maandishi ya aya.
  rationale: Muktadha wa Waebrania unatumia nukuu hii kumhusu Mwana/Kristo, lakini maneno ya aya yenyewe ni tamko la nafsi ya kwanza. Tafsiri inaacha muktadha utoe utambulisho huo badala ya kuuongeza ndani ya aya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya lugha ya Maandiko lakini kinachoeleweka kwa msomaji wa kawaida. ‘Tazama’ na ‘Ee Mungu’ zimehifadhi uzito wa nukuu, huku ‘nimekuja,’ ‘imeandikwa,’ na ‘kunihusu’ zikitumia lugha ya sasa na ya asili.
