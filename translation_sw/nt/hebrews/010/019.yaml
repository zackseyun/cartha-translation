  yaml_path: translation/nt/hebrews/010/019.yaml
  text: Therefore, brothers, since we have boldness to enter the holy places by the blood of Jesus,
translation:
  language: sw
  text: Kwa hiyo, ndugu[a], kwa kuwa tuna ujasiri wa kuingia mahali patakatifu[b] kwa damu ya Yesu,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ndugu wa kiume na dada”; Kigiriki kinasema “ndugu” kwa umbo la kiume, ambalo huenda linawakilisha kusanyiko lote.
    reason: lexical_alternative
  - marker: b
    text: Au, “patakatifu”; katika taswira ya hema takatifu katika Waebrania, kirai hiki kinarejelea maeneo matakatifu ya uwepo wa Mungu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔχοντες
  choice: kwa kuwa tuna
  rationale: Ingawa ni kauli ya kushiriki yenye maana ya moja kwa moja ya ‘tukiwa na’, hapa inatoa msingi wa wito unaofuata; ‘kwa kuwa tuna’ huwasilisha uhusiano huo wa kisababu kwa Kiswahili cha kawaida.
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Huonyesha hitimisho linalotokana na hoja iliyotangulia na kuhifadhi wazi mtiririko wa kimantiki.
- source_word: ἀδελφοί
  choice: ndugu
  rationale: ‘Ndugu’ ni neno la kawaida na lenye heshima la kuhutubia waumini; linahifadhi wazo la undugu huku tanbihi ikieleza umbo la kiume la Kigiriki na uwezekano wa kusudi la kulihutubia kusanyiko lote.
- source_word: παρρησίαν
  choice: ujasiri
  rationale: Katika muktadha huu neno linaonyesha uhuru wenye kujiamini wa kumkaribia Mungu; ‘ujasiri’ huhifadhi nguvu yake bila kulifanya kuwa kiburi.
- source_word: εἰς τὴν εἴσοδον
  choice: wa kuingia
  rationale: Muundo huu wa Kiswahili ni wa asili na huwasilisha kusudi au uwezo wa kuingia, huku ukihifadhi maana ya ufikiaji.
- source_word: τῶν ἁγίων
  choice: mahali patakatifu
  rationale: Katika taswira ya hema takatifu katika Waebrania, kirai hiki kinarejelea eneo takatifu la uwepo wa Mungu. ‘Mahali patakatifu’ hakilazimishi maana finyu ya Patakatifu Zaidi.
- source_word: ἐν τῷ αἵματι Ἰησοῦ
  choice: kwa damu ya Yesu
  rationale: ‘Kwa’ huonyesha njia au msingi wa kuingia na kuhifadhi maana ya dhabihu iliyo katika kirai cha Kigiriki.
theological_decisions:
- issue: Maana ya τῶν ἁγίων
  choice: mahali patakatifu pa uwepo wa Mungu
  alternative: Patakatifu Zaidi; patakatifu; watakatifu
  rationale: Muktadha mpana wa Waebrania kuhusu hema na dhabihu unaunga mkono maana ya mahali, si watu watakatifu. Tafsiri haibani kirai kuwa Patakatifu Zaidi pekee.
- issue: Upeo wa ἀδελφοί
  choice: ndugu katika matini, pamoja na ufafanuzi katika tanbihi
  alternative: ndugu wa kiume na wa kike
  rationale: Kigiriki kina umbo la kiume la wingi, lakini huenda kinawakilisha kusanyiko lote. ‘Ndugu’ ni ya asili katika Kiswahili na tanbihi huhifadhi taarifa hiyo ya chanzo bila kuamua kimya kimya upeo wake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imehifadhi koma ya mwisho kwa kuwa mstari unaendelea katika aya inayofuata. ‘Mahali patakatifu’ huhifadhi taswira ya ibada na kiwango fulani cha kutobainisha upeo mahususi wa eneo hilo.
