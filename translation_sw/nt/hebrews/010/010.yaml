  text: ἐν ᾧ θελήματι ἡγιασμένοι ⸀ἐσμὲν διὰ τῆς προσφορᾶς τοῦ σώματος Ἰησοῦ Χριστοῦ ἐφάπαξ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/010.yaml
  text: By that will we have been sanctified through the offering of the body of Jesus the Messiah once for all[a][b].
translation:
  language: sw
  text: Kwa mapenzi hayo[a] tumetakaswa kwa njia ya utoaji wa mwili wa Yesu Masihi[b], mara moja tu, kwa wakati wote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata maneno ya Kigiriki kwa karibu zaidi, “katika mapenzi hayo.” Maana ni kwamba tumetakaswa kwa mapenzi ya Mungu yaliyotajwa katika muktadha.
    reason: lexical_alternative
  - marker: b
    text: Au “Yesu Kristo.” Neno la Kigiriki Χριστός ni cheo; maana yake ni “Masihi.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ᾧ θελήματι
  choice: Kwa mapenzi hayo
  rationale: Kirai hiki kinarejelea mapenzi ya Mungu yaliyotajwa katika muktadha. ‘Kwa’ linaonyesha njia au msingi kwa Kiswahili cha kawaida, huku ‘hayo’ likihifadhi rejeo lake la nyuma.
- source_word: ἡγιασμένοι ἐσμὲν
  choice: tumetakaswa
  rationale: Muundo wa timilifu unaonyesha tendo lililokamilika ambalo matokeo yake yanaendelea. ‘Tumetakaswa’ huhifadhi maana hiyo bila kuifanya kuwa hali inayoendelea hatua kwa hatua.
- source_word: διὰ τῆς προσφορᾶς
  choice: kwa njia ya kutolewa
  rationale: διά pamoja na jenitivi huonyesha njia, nayo προσφορά hapa ni tendo la kutoa sadaka. Usemi huu huhifadhi wazo la utoaji bila kuongeza wazi neno ‘dhabihu’ ambalo ni fasiri pana zaidi.
- source_word: τοῦ σώματος
  choice: kwa mwili
  rationale: Huhifadhi kitu halisi kilichotolewa—mwili—na muundo unaomtambulisha mwenye mwili huo katika maneno yanayofuata.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesu Masihi
  rationale: Χριστός lina nguvu ya cheo hapa; ‘Masihi’ huwasilisha maana ya cheo hicho kwa Kiswahili, badala ya kukitumia tu kama sehemu ya jina.
- source_word: ἐφάπαξ
  choice: mara moja tu kwa wakati wote
  rationale: Hueleza kwamba utoaji huo ulifanyika mara moja kwa ukamilifu na hautarudiwa.
theological_decisions:
- issue: Hali na nguvu ya kitheolojia ya kutakaswa
  choice: tumetakaswa
  alternative: tunatakaswa
  rationale: 'Muundo wa Kigiriki ni timilifu inayozunguka: tendo limekamilika na matokeo yake yanadumu. Tafsiri hii haigeuzi kauli kuwa mchakato unaoendelea wala haifafanui zaidi ya sarufi.'
- issue: Cheo cha kikristo Χριστοῦ
  choice: Masihi
  alternative: Kristo
  rationale: ‘Masihi’ huhifadhi maana ya Χριστός kama cheo katika muktadha huu; tanbihi inataja umbo la jadi ‘Kristo’ bila kulazimisha uamuzi wa kimadhehebu.
- issue: Maana ya ἐφάπαξ
  choice: mara moja tu kwa wakati wote
  alternative: mara moja
  rationale: Huhifadhi mkazo wa utoaji wa Yesu kuwa wa mwisho na usiorudiwa, bila kuongeza nadharia nyingine kuhusu upatanisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Kutolewa kwa mwili’ kimetumiwa badala ya ‘sadaka ya mwili’ ili kuhifadhi upana wa προσφορά na muundo wa chanzo; koma kabla ya kirai cha mwisho husaidia kuonyesha kwamba ‘mara moja tu kwa wakati wote’ linaeleza tendo la kutolewa.
