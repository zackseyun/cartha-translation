  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maneno mengine, «kuhani mkuu». Hata hivyo, Kiyunani husema «kuhani aliye mkuu» (ἱερέα μέγαν), wala si cheo cha kawaida «Kuhani Mkuu» (ἀρχιερεύς).
