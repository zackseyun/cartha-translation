lexical_decisions:
- source_word: καὶ
  choice: na kwa kuwa tuna
  rationale: Kiunganishi hiki kinaendeleza muundo wa sentensi ulioanza katika mstari wa 19; maneno yaliyodokezwa na muktadha yanawekwa wazi ili kishazi kisomeke kwa Kiswahili cha kawaida.
- source_word: ἱερέα
  choice: kuhani
  rationale: ἱερεύς humaanisha kuhani; neno la cheo la kawaida la ‘kuhani mkuu’ katika Kiyunani, ἀρχιερεύς, halitumiki hapa.
- source_word: μέγαν
  choice: mkuu
  rationale: Katika Kiswahili, ‘kuhani mkuu’ ni usemi wa asili unaoweza kuonyesha ukuu au hadhi ya kuhani, ingawa unaweza pia kueleweka kuwa cheo maalumu; tanbihi inahifadhi tofauti iliyopo katika Kiyunani.
- source_word: ἐπὶ
  choice: juu ya
  rationale: Pamoja na shamirisho hili, ἐπί inaonyesha mamlaka au usimamizi.
- source_word: τὸν οἶκον
  choice: nyumba
  rationale: ‘Nyumba’ huhifadhi sitiari ya kibiblia, huku ikiweza pia kumaanisha jamaa au watu wa Mungu.
- source_word: τοῦ θεοῦ
  choice: ya Mungu
  rationale: Huu ni muundo wa kawaida wa umilikaji unaotambulisha nyumba kuwa ya Mungu.
theological_decisions:
- issue: Iwapo ἱερέα μέγαν itafsiriwe moja kwa moja kama cheo maalumu cha ‘kuhani mkuu’
  choice: kuhani mkuu, kwa tanbihi inayofafanua maana halisi
  alternative: kuhani aliye mkuu
  rationale: Kiyunani kina nomino ‘kuhani’ iliyofafanuliwa na kivumishi ‘mkuu,’ si neno la kawaida ἀρχιερεύς. Hata hivyo, ‘kuhani mkuu’ ndilo tungo la Kiswahili lililo la asili zaidi; tanbihi inazuia tofauti hiyo ya Kiyunani isipotee kimya kimya.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo unaendeleza hoja ya mstari uliotangulia; alama zote za tanbihi zimewekwa baada ya kishazi kinachohusika.
