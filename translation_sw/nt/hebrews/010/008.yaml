id: HEB.10.8
reference: Hebrews 10:8
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀνώτερον λέγων ὅτι ⸂Θυσίας καὶ προσφορὰς⸃ καὶ ὁλοκαυτώματα καὶ περὶ ἁμαρτίας οὐκ ἠθέλησας οὐδὲ εὐδόκησας, αἵτινες κατὰ ⸀νόμον προσφέρονται,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/008.yaml
  text: After saying above[a], “Sacrifices and offerings and whole burnt offerings and sin offerings you did not desire[c][b], nor did you delight in”—which are offered according to the law—
translation:
  language: sw
  text: Baada ya kusema hapo juu, “Dhabihu na matoleo, na sadaka za kuteketezwa kabisa[a], na sadaka za dhambi[b] hukuzitaka wala hukupendezwa nazo”—ambazo hutolewa kulingana na sheria[c]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sadaka za kuteketezwa.” Neno la Kigiriki linamaanisha sadaka zilizoteketezwa kabisa juu ya madhabahu.
    reason: lexical_alternative
  - marker: b
    text: Au, “matoleo kwa ajili ya dhambi.”
    reason: lexical_alternative
  - marker: c
    text: Yaani, kulingana na sheria ya Musa.
    reason: cultural_note
lexical_decisions:
- source_word: ἀνώτερον λέγων
  choice: Hapo juu alisema
  rationale: This naturally points back to the preceding part of the cited passage while retaining the discourse function of ἀνώτερον.
- source_word: Θυσίας καὶ προσφορὰς
  choice: Dhabihu na matoleo
  rationale: These are standard, understandable Swahili terms that preserve the distinct sacrificial categories.
- source_word: ὁλοκαυτώματα
  choice: sadaka za kuteketezwa kabisa
  rationale: The phrase makes explicit that these offerings were wholly consumed by fire, preserving the lexical force of the Greek compound.
- source_word: περὶ ἁμαρτίας
  choice: sadaka za dhambi
  rationale: In this cultic context the phrase denotes the recognized category of sin offerings rather than merely a general action concerning sin.
- source_word: οὐκ ἠθέλησας
  choice: hukuzitaka
  rationale: This is natural current Swahili for the negative stance expressed by θέλω and takes the preceding offerings as its understood object.
- source_word: οὐδὲ εὐδόκησας
  choice: wala hukupendezwa nazo
  rationale: The wording preserves the parallel but distinct idea of taking pleasure or being pleased with the offerings; 'nazo' makes the understood object natural in Swahili.
- source_word: αἵτινες κατὰ νόμον προσφέρονται
  choice: ambazo hutolewa kulingana na sheria
  rationale: This closely preserves the relative clause, passive voice, and conformity to the law without interpreting beyond the text.
theological_decisions:
- issue: The catalog of sacrificial categories
  choice: Dhabihu na matoleo, na sadaka za kuteketezwa kabisa, na sadaka za dhambi
  alternative: Dhabihu na matoleo, sadaka za kuteketezwa na matoleo kwa ajili ya dhambi
  rationale: The chosen wording preserves the cultic specificity and repeated conjunctions of the Greek without importing a later doctrinal scheme.
- issue: God's negative stance toward sacrifices prescribed by the law
  choice: hukuzitaka wala hukupendezwa nazo
  alternative: hukuzitaka wala hukukubali
  rationale: The chosen wording distinguishes desire from delight and leaves intact the tension that these offerings were prescribed by the law yet were not what God desired or delighted in here.
- issue: Identification of νόμος
  choice: sheria, with a note identifying the Mosaic law
  alternative: Sheria ya Musa in the main text
  rationale: Keeping 'sheria' in the main text follows the Greek wording, while the note supplies the contextual identification without making an implicit referent explicit in the verse itself.
translation_notes:
  register: Standard East African Swahili in a dignified but accessible register. Cultic terms are retained, with brief footnotes where a fuller or alternative expression aids ordinary readers. The dash preserves the verse's syntactic continuation into the next statement.
