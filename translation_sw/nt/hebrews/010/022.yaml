  text: προσερχώμεθα μετὰ ἀληθινῆς καρδίας ἐν πληροφορίᾳ πίστεως, ῥεραντισμένοι τὰς καρδίας ἀπὸ συνειδήσεως πονηρᾶς καὶ λελουσμένοι τὸ σῶμα ὕδατι καθαρῷ·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/022.yaml
  text: let us draw near with a true heart in full assurance of faith[d][c][b][a], with our hearts sprinkled clean from an evil conscience and our bodies washed with pure water.
translation:
  language: sw
  text: na tumkaribie Mungu kwa moyo wa kweli[a], tukiwa na uhakika kamili wa imani, mioyo yetu ikiwa imenyunyiziwa ili kusafishwa kutokana na dhamiri mbaya[b], na miili yetu ikiwa imeoshwa kwa maji safi.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa moyo mnyofu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kutokana na dhamiri yenye hatia.” Kigiriki kinasema kihalisi “dhamiri mbaya.”
    reason: lexical_alternative
  - marker: c
    text: Taswira hii inaweza kukumbusha lugha ya utakaso wa kiibada na pia inaweza kueleweka kuwa dokezo la ubatizo, lakini mstari huu hautaji wazi kuoshwa huko kuwa nini.
    reason: cultural_note
lexical_decisions:
- source_word: προσερχώμεθα
  choice: na tumkaribie Mungu
  rationale: Kauli ya kuhimiza katika nafsi ya kwanza wingi. Kitenzi hiki katika muktadha wa Waebrania humaanisha kumkaribia Mungu; kumtaja Mungu kunafanya maana hiyo ya kimuktadha iwe wazi na ya kawaida katika Kiswahili.
- source_word: ἀληθινῆς καρδίας
  choice: kwa moyo wa kweli
  rationale: Hudumisha ufupi na upana wa ἀληθινός, yaani wa kweli, halisi, na usio na unafiki, bila kuifupisha maana kuwa unyofu pekee.
- source_word: ἐν πληροφορίᾳ πίστεως
  choice: tukiwa na uhakika kamili wa imani
  rationale: Hutoa maana ya πληροφορία kama uhakika ulio kamili, huku πίστις ikibaki 'imani' katika maana ya kumwamini Mungu kwa uthabiti.
- source_word: ῥεραντισμένοι τὰς καρδίας ἀπὸ συνειδήσεως πονηρᾶς
  choice: mioyo yetu ikiwa imenyunyiziwa ili kusafishwa kutokana na dhamiri mbaya
  rationale: Hudumisha taswira ya kunyunyizia ya utakaso na hali iliyotimizwa ya kauli timilifu. 'Ili kusafishwa kutokana na' huwasilisha matokeo ya utakaso yanayodokezwa na ἀπό kwa Kiswahili cha kawaida.
- source_word: λελουσμένοι τὸ σῶμα ὕδατι καθαρῷ
  choice: miili yetu ikiwa imeoshwa kwa maji safi
  rationale: Umoja wa Kigiriki wa 'mwili' ni wa kugawa kwa kila mshiriki wa kundi, hivyo wingi ni wa kawaida kwa Kiswahili. 'Maji safi' hubeba maana ya usafi wa kimwili na wa kiibada.
theological_decisions:
- issue: Iwapo kuoshwa kwa maji kutambulishwe wazi kuwa ubatizo
  choice: Taswira ya kuoshwa kwa maji imeachwa bila kuitaja wazi kuwa ubatizo
  alternative: Kutafsiri moja kwa moja kuwa ubatizo, au kuifanya kuwa utakaso wa ndani pekee
  rationale: Maneno yanaweza kukumbusha taratibu za utakaso na pia ubatizo, lakini mstari wenyewe hautambulishi kuoshwa huko kwa namna isiyo na utata.
- issue: Maana ya συνειδήσεως πονηρᾶς
  choice: dhamiri mbaya
  alternative: dhamiri yenye hatia
  rationale: πονηρός ni 'mbaya/uovu' na si neno linalomaanisha hatia pekee; tafsiri pana inahifadhi maana ya kimaadili na kiibada.
- issue: Kitu kinachokaribiwa katika προσερχώμεθα
  choice: Mungu ametajwa wazi kama yule anayekaribiwa
  alternative: tukaribie, bila kutaja anayekaribiwa
  rationale: Muktadha wa karibu wa Waebrania 10:19–21 ni kuingia mbele za Mungu. Kiswahili huhitaji kijalizo au muktadha ulio wazi zaidi ili kitenzi hiki kisikike kamili; uongezaji huu hufafanua kinachodokezwa bila kubadili dai la kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya Maandiko. Muundo wa usambamba wa vishazi viwili vya hali timilifu umehifadhiwa, huku sentensi ikifanywa isomeke kwa kawaida kwa wasomaji wa kawaida.
