source:
  edition: SBLGNT
  text: Καὶ πᾶς μὲν ἱερεὺς ἕστηκεν καθ’ ἡμέραν λειτουργῶν καὶ τὰς αὐτὰς πολλάκις προσφέρων θυσίας, αἵτινες οὐδέποτε δύνανται περιελεῖν ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/011.yaml
  text: And every priest stands day after day ministering and offering the same sacrifices again and again[a], which can never take away sins.
translation:
  language: sw
  text: Na kila kuhani husimama siku baada ya siku, akihudumu na kutoa dhabihu zilezile tena na tena, ambazo haziwezi kamwe kuondoa dhambi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kufuta dhambi.”
    reason: Mbadala wa kimsamiati unaotoa kwa Kiswahili cha kawaida maana ya kuondoa dhambi kabisa; haubadilishi dai la kutoweza kwa dhabihu hizo.
lexical_decisions:
- source_word: πᾶς ... ἱερεὺς
  choice: kila kuhani
  rationale: Muundo huu una maana ya kugawa kwa kila mmoja katika kundi la makuhani. “Kila kuhani” ni Kiswahili cha kawaida na haumfanyi kuhani mkuu bila msingi wa kimaandishi.
- source_word: ἕστηκεν
  choice: husimama
  rationale: Kauli hii inaonyesha hali ya kusimama pamoja na huduma inayorudiwa. “Husimama” ni ya asili katika Kiswahili na inadumisha utofauti wa kifasihi na kuketi kwa Masihi katika mstari unaofuata.
- source_word: καθ’ ἡμέραν
  choice: siku baada ya siku
  rationale: Usemi huu unaonyesha tendo la kila siku linaloendelea kurudiwa, kwa mkazo zaidi kuliko “kila siku” pekee.
- source_word: λειτουργῶν
  choice: akihudumu
  rationale: Katika muktadha huu neno linahusu huduma ya kidini ya kuhani. “Akihudumu” ni fupi, ya asili, na inaendana na muktadha wa dhabihu.
- source_word: τὰς αὐτὰς ... θυσίας
  choice: dhabihu zilezile
  rationale: Uchaguzi huu unahifadhi mkazo wa kwamba dhabihu hizohizo ndizo zinazotolewa kwa kurudiwa.
- source_word: πολλάκις
  choice: tena na tena
  rationale: Usemi huu wa Kiswahili unatoa kwa uwazi nguvu ya tendo linalorudiwa mara nyingi.
- source_word: προσφέρων
  choice: kutoa
  rationale: “Kutoa dhabihu” ndiyo kauli ya kawaida na sahihi katika muktadha wa ibada ya dhabihu.
- source_word: οὐδέποτε δύνανται
  choice: haziwezi kamwe
  rationale: Muunganiko huu unahifadhi dai lenye nguvu la kutoweza kabisa, bila kulilegeza.
- source_word: περιελεῖν ἁμαρτίας
  choice: kuondoa dhambi
  rationale: “Kuondoa” huwasilisha maana ya kuondoa au kuchukua mbali, bila kuongeza ufafanuzi wa kimadhehebu.
theological_decisions:
- issue: Uhusiano wa kusimama kwa kuhani na hoja ya Waebrania 10
  choice: “Husimama” imetumiwa ili kuhifadhi picha ya huduma ya makuhani inayoendelea na utofauti wake na kuketi kwa Masihi katika mstari wa 12.
  alternative: “Amesimama” au “anasimama,” ambazo zingehifadhi hali ya tendo lakini zingeweza kufifisha maana ya mazoea yanayorudiwa.
  rationale: Muktadha wa karibu unaweka kwa makusudi huduma ya makuhani inayorudiwa kinyume na tendo la Masihi. Tafsiri inahifadhi utofauti huo bila kuufafanua kupita maandishi.
- issue: Upeo wa kutoweza kwa dhabihu kuondoa dhambi
  choice: “Haziwezi kamwe kuondoa dhambi” inadumisha dai kamili la maandishi kuhusu kutoweza kwa dhabihu hizi.
  alternative: “Haziwezi kuondoa dhambi kikamilifu,” ambayo ingeongeza kielezi kisichotajwa moja kwa moja katika Kigiriki.
  rationale: οὐδέποτε δύνανται inaonyesha kutoweza kabisa katika hoja ya mwandishi; hivyo dai halipaswi kulegezwa wala kuongezewa ufafanuzi wa kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. “Siku baada ya siku” na “tena na tena” zinahifadhi mkazo wa kurudiwa kwa huduma na dhabihu.
