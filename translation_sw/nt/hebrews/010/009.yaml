    issue: Purpose-clause verb form
    rationale: In 'ili alisimamishe la pili,' 'alisimamishe' has the past marker -li-. Following 'ili,' the intended purposive/subjunctive form is 'ili asimamishe la pili,' corresponding to Greek ἵνα ... στήσῃ.
  - severity: low
    issue: Footnote wording is redundant and imprecise
    rationale: The opening 'Yaani' merely repeats the main text, while 'hali ya pili ya mapenzi ya Mungu' introduces an awkward and less accurate category. The note should succinctly identify the likely contextual referents while retaining their interpretive uncertainty.
