  source_fidelity: The draft accurately renders the sequence, the perfect-force statement ('amesema'), the quoted declaration, and the terse contrast 'la kwanza'/'la pili.' However, 'ili alisimamishe' uses a past-tense form where the purpose clause calls for the subjunctive 'ili asimamishe.'
  naturalness: The verse is otherwise natural Standard East African Swahili with an appropriately elevated scriptural register. 'Ili asimamishe' is idiomatic and grammatically appropriate after 'ili.'
  terminology: '''Mapenzi yako,'' ''Huondoa,'' and the unexpanded ''la kwanza''/''la pili'' are suitable. The footnote should not call the repeated text ''Yaani,'' and its description of the second referent as a ''hali ya pili'' is less precise than the contextual contrast in Hebrews 10:8–10.'
  issues:
