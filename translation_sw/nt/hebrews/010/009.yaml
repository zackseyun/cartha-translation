  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: τότε εἴρηκεν· Ἰδοὺ ἥκω τοῦ ⸀ποιῆσαι τὸ θέλημά σου· ἀναιρεῖ τὸ πρῶτον ἵνα τὸ δεύτερον στήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/009.yaml
  text: Then he said[a], ‘Behold, I have come to do your will.’ He takes away the first so that he may establish the second.
translation:
  language: sw
  text: Kisha amesema, “Tazama, nimekuja kufanya mapenzi yako.” Huondoa la kwanza ili asimamishe la pili.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Huenda “la kwanza” na “la pili” yakarejelea mpangilio wa kwanza wa dhabihu na mapenzi ya Mungu yaliyotimizwa katika sadaka ya Masihi.
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: Kisha
  rationale: Huonyesha mfuatano wa hoja na kuunganisha kauli hii na nukuu iliyotangulia kwa Kiswahili cha kawaida.
- source_word: εἴρηκεν
  choice: amesema
  rationale: Wakati timilifu wa Kigiriki unaonyesha kauli iliyotolewa ambayo bado ina umuhimu; “amesema” huhifadhi hali hiyo kwa Kiswahili.
- source_word: Ἰδοὺ
  choice: Tazama
  rationale: Huhifadhi mwito wenye msisitizo na mtindo wa kimaandiko bila kuwa wa kizamani kupita kiasi.
- source_word: ἥκω
  choice: nimekuja
  rationale: Huonyesha kuwasili ambako matokeo yake yanaendelea, maana ya kawaida ya kitenzi hiki katika muktadha.
- source_word: τοῦ ποιῆσαι
  choice: kufanya
  rationale: Hutoa kusudi la kuja kwa njia ya kawaida na wazi katika Kiswahili.
- source_word: τὸ θέλημά σου
  choice: mapenzi yako
  rationale: “Mapenzi” ni neno la kawaida la kibiblia kwa kusudi au utashi wa Mungu katika muktadha huu.
- source_word: ἀναιρεῖ
  choice: Huondoa
  rationale: Huhifadhi maana ya kuweka kando au kuondoa bila kuongeza wazo mahsusi la kufuta kisheria.
- source_word: τὸ πρῶτον
  choice: la kwanza
  rationale: Huhifadhi ufupi na kutotajwa wazi kwa nomino katika Kigiriki; rejeo linaeleweka kutokana na muktadha.
- source_word: ἵνα
  choice: ili
  rationale: Huonyesha kusudi au matokeo yaliyokusudiwa kwa Kiswahili cha asili.
- source_word: τὸ δεύτερον
  choice: la pili
  rationale: Huhifadhi ulinganifu wa kiritoriki na “la kwanza” bila kulazimisha ufafanuzi ndani ya mstari.
- source_word: στήσῃ
  choice: alisimamishe
  rationale: Katika muktadha humaanisha kulithibitisha, kuliweka imara, au kulianzisha; “alisimamishe” huhifadhi taswira na utofauti wake na “huondoa.”
theological_decisions:
- issue: Rejeo la “la kwanza” na “la pili”
  choice: Maandishi makuu yanahifadhi kauli fupi “la kwanza” na “la pili,” huku muktadha ukielekeza kwenye mpangilio wa kwanza wa dhabihu na utimilifu wa mapenzi ya Mungu katika kujitoa kwa Masihi.
  alternative: Yanaweza kueleweka kwa upeo mwembamba kuwa kauli mbili za nukuu ya Zaburi, au kwa upeo mpana kuwa agano la kale na agano jipya.
  rationale: Waebrania 10:8–10 inatofautisha dhabihu na matoleo na kutendwa kwa mapenzi ya Mungu. Kutotaja moja kwa moja “mpangilio” au “agano” kunahifadhi ufupi na mvutano wa kitheolojia wa Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi ya kimaandiko lakini kinachoeleweka kwa msomaji wa kawaida. Alama ya tanbihi imewekwa baada ya sentensi inayofafanuliwa.
