translation:
  language: sw
  text: Mara nyingine mlifanywa kuwa tamasha hadharani kwa matukano na mateso,[a] na mara nyingine mkawa washirika wa wale waliotendewa hivyo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa taswira iliyo wazi zaidi, “mlifanywa kituko hadharani.”
    reason: lexical_alternative
  - marker: b
    text: Au yawezekana, “mkawa washirika wa wale walioishi au waliojiendesha hivyo.” Kitenzi cha Kigiriki kinaweza kumaanisha mwenendo wa maisha, ingawa hapa muktadha wa mateso unaunga mkono maana ya “waliotendewa hivyo.”
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦτο μὲν ... τοῦτο δὲ
  choice: wakati mwingine ... na wakati mwingine
  rationale: Muundo huu unaonyesha hali mbili tofauti walizopitia wasomaji; usemi huu ni wa kawaida na wazi katika Kiswahili cha sasa.
- source_word: ὀνειδισμοῖς
  choice: matukano
  rationale: Neno hili linamaanisha shutuma au maneno ya kudhalilisha; ‘matukano’ linaeleza kwa uwazi unyanyasaji huo wa maneno.
- source_word: θλίψεσιν
  choice: mateso
  rationale: Katika muktadha wa dhuluma, neno hili linaonyesha taabu na shinikizo walizoteswa nazo bila kulibana kwa aina moja tu ya maumivu.
- source_word: θεατριζόμενοι
  choice: mlifanywa kuwa tamasha mbele ya watu
  rationale: Kitenzi kina picha ya mtu kuonyeshwa hadharani kama tamasha na kudhalilishwa; tafsiri hii inahifadhi picha hiyo yenye nguvu na hali ya hadharani.
- source_word: κοινωνοὶ
  choice: washirika
  rationale: Neno linaonyesha kushiriki hali ya wengine na kusimama pamoja nao, si urafiki wa kawaida tu.
- source_word: τῶν οὕτως ἀναστρεφομένων
  choice: wa wale waliotendewa hivyo
  rationale: Ingawa kitenzi kinaweza kumaanisha kuishi au kujiendesha kwa namna fulani, muktadha wa matukano na mateso unaunga mkono maana ya kutendewa kwa namna hiyo; uwezekano mwingine umehifadhiwa katika tanbihi.
- source_word: γενηθέντες
  choice: mkawa
  rationale: Hii inaeleza kwamba waliingia katika hali ya kuwa washirika wa waliokuwa wakiteswa, kwa Kiswahili cha asili na kifupi.
theological_decisions:
- issue: Maana ya ἀναστρεφομένων katika muktadha
  choice: wale waliotendewa hivyo
  alternative: wale walioishi au waliojiendesha hivyo
  rationale: Muktadha wa karibu unahusu matukano, mateso, na kushirikiana na wanaodhulumiwa. Hata hivyo, kwa kuwa kitenzi mara nyingi huhusu mwenendo wa maisha, uwezekano huo haujaondolewa bali umeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. ‘Kufanywa kuwa tamasha mbele ya watu’ huhifadhi taswira kali ya Kigiriki bila kuwa ya kizamani; ‘washirika’ huonyesha mshikamano wa kweli katika mateso.
