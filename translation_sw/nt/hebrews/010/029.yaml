id: HEB.10.29
reference: Hebrews 10:29
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: πόσῳ δοκεῖτε χείρονος ἀξιωθήσεται τιμωρίας ὁ τὸν υἱὸν τοῦ θεοῦ καταπατήσας, καὶ τὸ αἷμα τῆς διαθήκης κοινὸν ἡγησάμενος ἐν ᾧ ἡγιάσθη, καὶ τὸ πνεῦμα τῆς χάριτος ἐνυβρίσας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/029.yaml
  text: How much worse punishment do you think will be deserved by the one who has trampled underfoot the Son of God[a], and has regarded the blood of the covenant by which he was sanctified as common[c][b], and has insulted the Spirit of grace?
translation:
  language: sw
  text: Je, mnadhani mtu aliyemkanyaga Mwana wa Mungu, akaiona damu ya agano kuwa ya kawaida[a]—damu ambayo kwa damu hiyo alitakaswa[b]—na akamtukana[c] Roho wa neema atahesabiwa kustahili adhabu kali zaidi kiasi gani?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kuwa najisi” au “kuwa isiyo takatifu.”
    reason: lexical_alternative
  - marker: b
    text: Kwa sarufi ya Kigiriki, kishazi “ambayo kwa damu hiyo alitakaswa” kinaunganishwa na mtu anayefanya matendo hayo; baadhi ya wafasiri humwelewa mhusika kwa njia tofauti. Tafsiri hii inahifadhi utata huo badala ya kuamua mjadala wa kiteolojia.
    reason: alternative_reading
  - marker: c
    text: Au “akamfanyia dharau kubwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πόσῳ ... χείρονος
  choice: kali zaidi kwa kiasi gani
  rationale: Muundo huu wa Kiswahili unawasilisha swali la balagha na ulinganisho wa adhabu kwa njia ya kawaida na yenye kueleweka; “kali zaidi” linafaa zaidi kwa adhabu kuliko tafsiri ya neno kwa neno “mbaya zaidi.”
- source_word: ἀξιωθήσεται
  choice: atahesabiwa kuwa anastahili
  rationale: Unahifadhi hali ya kutendwa na maana ya hukumu ya kuonwa au kuhesabiwa kuwa mtu anastahili jambo fulani.
- source_word: τιμωρίας
  choice: adhabu
  rationale: Ni neno la kawaida na lenye hadhi linaloeleza adhabu ya hukumu bila kuongeza wazo lisilokuwamo wazi katika maandishi.
- source_word: καταπατήσας
  choice: aliyemkanyaga
  rationale: Unahifadhi taswira kali ya kumkanyaga mtu kwa dharau badala ya kuibadili kuwa maelezo ya jumla kuhusu kutomheshimu.
- source_word: τὸν υἱὸν τοῦ θεοῦ
  choice: Mwana wa Mungu
  rationale: Ni tafsiri ya moja kwa moja na iliyozoeleka ya cheo hiki.
- source_word: κοινὸν
  choice: ya kawaida
  rationale: Inahifadhi tofauti ya msingi kati ya kilicho cha kawaida na kilichowekwa wakfu; maana za “najisi” au “kisicho kitakatifu” zinawekwa katika tanbihi.
- source_word: ἡγησάμενος
  choice: akaiona ... kuwa
  rationale: Ni njia ya asili ya Kiswahili ya kueleza tathmini au uamuzi wa mtu kuhusu kitu.
- source_word: τὸ αἷμα τῆς διαθήκης
  choice: damu ya agano
  rationale: Inahifadhi usemi wa kibiblia na uhusiano wake na dhabihu na agano.
- source_word: ἐν ᾧ
  choice: ambayo kwa hiyo
  rationale: Inaonyesha maana ya chombo au njia—kutakaswa kwa damu hiyo—huku ikiendeleza uhusiano wa kisarufi wa kishazi.
- source_word: ἡγιάσθη
  choice: alitakaswa
  rationale: Ni kitenzi cha hali ya kutendwa kinachohifadhi maana ya kufanywa mtakatifu au kuwekwa wakfu.
- source_word: ἐνυβρίσας
  choice: akamtukana
  rationale: Linawasilisha tendo la kumfanyia Roho dharau yenye kuumiza kwa lugha iliyo wazi na ya sasa.
- source_word: τὸ πνεῦμα τῆς χάριτος
  choice: Roho wa neema
  rationale: Inahifadhi muundo na uzito wa usemi wa Kigiriki bila kuufafanua kupita kiasi.
theological_decisions:
- issue: Mhusika wa ἐν ᾧ ἡγιάσθη (“ambayo kwa hiyo alitakaswa”)
  choice: Kishazi kimetafsiriwa kwa namna ambayo kisarufi kinamhusu mtu anayeonywa katika aya.
  alternative: Baadhi hufasiri mhusika kuwa Kristo, damu yenyewe, au jumuiya ya agano.
  rationale: Katika mtiririko wa Kigiriki, mhusika wa karibu ni mtu mmoja anayeelezwa kwa vitenzi vya hali ya kushiriki. Tafsiri haiamui mjadala wa kiteolojia kuhusu uasi na kudumu katika imani, bali inahifadhi muundo wa maandishi na kutaja uwezekano mwingine katika tanbihi.
- issue: Maana ya κοινὸν kuhusu damu ya agano
  choice: ya kawaida
  alternative: najisi; isiyo takatifu
  rationale: “Ya kawaida” huhifadhi upinzani wa kile cha kawaida dhidi ya kile kilichotakaswa, bila kulazimisha mojawapo ya vivuli vya maana vinavyowezekana katika muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inahifadhi swali la balagha, taswira ya kumkanyaga Mwana wa Mungu, na istilahi za kibiblia “damu ya agano” na “Roho wa neema.” Alama za vistari zimetumiwa kutenganisha kishazi cha “damu ambayo kwa hiyo alitakaswa” ili marejeo yake yabaki wazi kadiri sarufi ya Kiswahili inavyoruhusu.
