  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀθετήσας τις νόμον Μωϋσέως χωρὶς οἰκτιρμῶν ἐπὶ δυσὶν ἢ τρισὶν μάρτυσιν ἀποθνῄσκει·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/028.yaml
  text: Anyone who has set aside the law of Moses dies without mercy on the testimony of two or three witnesses[a].
translation:
  language: sw
  text: Mtu yeyote aliyeikataa sheria ya Musa hufa bila huruma kwa ushahidi wa mashahidi wawili au watatu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “huuawa.” Kigiriki kinasema kihalisi “hufa,” lakini muktadha ni wa kutekelezwa kwa hukumu ya kifo chini ya sheria ya Musa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀθετήσας
  choice: aliyeikataa
  rationale: Kitenzi ἀθετέω hapa huonyesha kuikataa au kuipuuza mamlaka ya sheria. “Aliyeikataa” ni lugha ya kawaida na yenye hadhi, na haifanyi kosa hilo kuwa uvunjaji wa amri moja tu.
- source_word: τις
  choice: Mtu yeyote
  rationale: Kiwakilishi hiki kisichotaja mtu maalumu kinatumiwa kwa maana ya jumla; “mtu yeyote” huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: νόμον Μωϋσέως
  choice: sheria ya Musa
  rationale: Huu ni uwasilishaji wa kawaida na wa moja kwa moja wa muundo wa Kigiriki, unaoeleweka vizuri katika Kiswahili.
- source_word: χωρὶς οἰκτιρμῶν
  choice: bila huruma
  rationale: Ingawa Kigiriki kina umbo la wingi, Kiswahili hutumia kwa kawaida nomino dhahania ya umoja “huruma”; pia inafaa katika muktadha wa hukumu.
- source_word: ἐπὶ δυσὶν ἢ τρισὶν μάρτυσιν
  choice: kwa ushahidi wa mashahidi wawili au watatu
  rationale: ἐπί pamoja na dativu huonyesha msingi wa hukumu. Neno “ushahidi” linaweka wazi maana ya kisheria inayodokezwa na muundo wa Kigiriki.
- source_word: ἀποθνῄσκει
  choice: hufa
  rationale: Kigiriki kinasema kihalisi “hufa” katika kauli ya jumla kuhusu matokeo ya kisheria. Tafsiri hii inadumisha kiasi cha matini huku muktadha ukidokeza kuuawa kwa hukumu.
theological_decisions:
- issue: Iwapo nguvu ya kisheria ya ἀποθνῄσκει, yaani kuuawa kwa hukumu, iwekwe wazi katika matini kuu
  choice: hufa
  alternative: huuawa
  rationale: Muktadha wa sheria ya Musa unahusu hukumu ya kifo, lakini kitenzi cha Kigiriki chenyewe ni “hufa,” si usemi wa kisababishi ulio wazi. Matini kuu inahifadhi namna hiyo ya kusema, huku tanbihi ikitoa maana mbadala inayofaa katika muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo unahifadhi ufupi na uzito wa kauli ya Kigiriki bila kuongeza ufafanuzi wa kimadhehebu.
