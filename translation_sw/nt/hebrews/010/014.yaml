  yaml_path: translation/nt/hebrews/010/014.yaml
  text: For by one offering he has perfected for all time those who are being sanctified[a].
translation:
  language: sw
  text: Kwa maana kwa sadaka moja amewakamilisha milele wale wanaotakaswa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wale wanaofanywa watakatifu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μιᾷ
  choice: moja
  rationale: Kivumishi hiki kinaeleza προσφορᾷ na kusisitiza kwamba toleo hilo ni moja tu, kulingana na hoja ya muktadha kuhusu kutorudiwa kwake.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Inaonyesha sababu au ufafanuzi unaounganisha mstari huu na hoja iliyotangulia; “Kwa maana” ni kiunganishi cha kawaida na chenye hadhi katika Kiswahili.
- source_word: προσφορᾷ
  choice: toleo
  rationale: Neno hili humaanisha kitu kinachotolewa kwa Mungu. “Toleo” linadumisha upana wa neno la Kigiriki bila kulifasiri moja kwa moja kuwa “dhabihu,” ingawa muktadha ni wa dhabihu.
- source_word: τετελείωκεν
  choice: amewakamilisha
  rationale: Kauli ya wakati timilifu inaonyesha tendo lililokamilika lenye matokeo yanayoendelea. “Amewakamilisha” huhifadhi maana ya kufikisha kwenye ukamilifu pamoja na nguvu ya hali hiyo inayoendelea.
- source_word: εἰς τὸ διηνεκές
  choice: milele
  rationale: Katika Waebrania, kirai hiki huonyesha uhalali au athari yenye kudumu. “Milele” ni ya asili katika Kiswahili na hapa inaeleza kudumu kwa matokeo ya toleo hilo moja.
- source_word: τοὺς ἁγιαζομένους
  choice: wale wanaotakaswa
  rationale: Kitenzi-shirikishi cha wakati wa sasa na hali ya kutendwa kinaonyesha watu wanaofanyiwa tendo linaloendelea. “Wale wanaotakaswa” huhifadhi hali ya kutendwa na mwendelezo bila kuifafanua kupita kiasi.
theological_decisions:
- issue: Uhusiano kati ya kukamilishwa kulikotimizwa na kutakaswa kunakoendelea
  choice: 'Kudumisha vipengele vyote viwili: “amewakamilisha” pamoja na “wanaotakaswa.”'
  alternative: Kutafsiri kwa namna inayosisitiza hali iliyokwisha tu, au kwa namna inayodhoofisha matokeo yaliyokamilika na kusisitiza mchakato pekee.
  rationale: Kigiriki kinaweka pamoja tendo lililokamilika lenye matokeo ya kudumu (τετελείωκεν) na kitenzi-shirikishi cha sasa cha hali ya kutendwa (ἁγιαζομένους). Tafsiri haipaswi kuondoa mvutano huo wa kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Mpangilio “kwa toleo moja” umehifadhi msisitizo wa chombo kimoja cha dhabihu; alama [a] imewekwa moja kwa moja baada ya kirai kinachohusika.
