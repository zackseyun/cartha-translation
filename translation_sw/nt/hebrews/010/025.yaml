  text: μὴ ἐγκαταλείποντες τὴν ἐπισυναγωγὴν ἑαυτῶν, καθὼς ἔθος τισίν, ἀλλὰ παρακαλοῦντες, καὶ τοσούτῳ μᾶλλον ὅσῳ βλέπετε ἐγγίζουσαν τὴν ἡμέραν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/025.yaml
  text: not neglecting our own gathering together[a], as is the habit of some[b], but encouraging one another—and all the more as you see the Day drawing near.
translation:
  language: sw
  text: tusiache kukusanyika pamoja[a], kama ilivyo desturi ya wengine, bali tutiane moyo zaidi sana kadiri mnavyoona ile Siku[b] ikikaribia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “tusitelekeze” au “tusipuuze kukusanyika pamoja.”
    reason: lexical_alternative
  - marker: b
    text: “Ile Siku” huenda inarejelea siku ya Bwana inayokuja au siku ya hukumu ya mwisho.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγκαταλείποντες
  choice: tusiache
  rationale: Kitenzi hiki kinaweza kumaanisha kuacha, kutelekeza, au kupuuza. Katika muktadha huu, “tusiache” ni cha kawaida na chenye hadhi, na hakilazimishi maana ya kuasi kabisa.
- source_word: ἐπισυναγωγὴν ἑαυτῶν
  choice: kukusanyika pamoja
  rationale: Kirai hiki kinarejelea waamini kujumuika wenyewe. “Kukusanyika pamoja” huhifadhi wazo la mkusanyiko wa jumuiya bila kuingiza dhana ya baadaye ya ibada rasmi ya kanisa.
- source_word: καθὼς ἔθος τισίν
  choice: kama ilivyo desturi ya wengine
  rationale: “Desturi” huwakilisha ἔθος kwa uwazi na kudumisha karipio la upole lakini lenye uzito.
- source_word: παρακαλοῦντες
  choice: tutiane moyo
  rationale: Katika muktadha wa kustahimili kwa pamoja, kirai hiki huonyesha kuhimiza na kuimarishana. Umbo la kutendeana linaweka wazi maana ya kijumuiya inayodokezwa na muktadha.
- source_word: τοσούτῳ μᾶλλον ὅσῳ
  choice: zaidi sana kadiri
  rationale: Ujenzi huu unaonyesha kwamba himizo linapaswa kuongezeka kwa kadiri Siku inavyokaribia.
- source_word: βλέπετε
  choice: mnavyoona
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya nafsi ya pili wingi, bila kufafanua namna wanavyotambua ukaribu huo.
- source_word: ἐγγίζουσαν
  choice: ikikaribia
  rationale: Huhifadhi taswira ya Siku inayozidi kuwa karibu.
- source_word: τὴν ἡμέραν
  choice: ile Siku
  rationale: “Ile Siku” huashiria siku maalumu inayojulikana katika matarajio ya mwisho bila kuongeza moja kwa moja “ya Bwana” au “ya hukumu,” maneno ambayo hayapo katika mstari.
theological_decisions:
- issue: Rejeo la kieskatolojia la τὴν ἡμέραν
  choice: ile Siku
  alternative: siku; Siku ya Bwana; siku ya hukumu
  rationale: Muktadha unaelekea kwenye siku ya mwisho inayotarajiwa. “Ile Siku” huitambulisha kama siku maalumu huku ikihifadhi kutokubainishwa kwa maandishi ya Kigiriki.
- issue: Yambwa ya pamoja ya παρακαλοῦντες
  choice: tutiane moyo
  alternative: tuhimize, bila kutaja yambwa
  rationale: Ingawa Kigiriki hakitaji wazi “ninyi kwa ninyi,” muktadha wa kukusanyika kwa jumuiya unaonyesha kitendo cha kuhimizana; umbo la Kiswahili la kutendeana ni la asili na huweka wazi maana hiyo bila kuongeza fundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo unaendeleza himizo la mstari uliotangulia kwa kutumia “tusiache ... bali tutiane moyo.”
