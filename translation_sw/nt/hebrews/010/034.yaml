id: HEB.10.34
reference: Hebrews 10:34
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ γὰρ τοῖς ⸀δεσμίοις συνεπαθήσατε, καὶ τὴν ἁρπαγὴν τῶν ὑπαρχόντων ὑμῶν μετὰ χαρᾶς προσεδέξασθε, γινώσκοντες ἔχειν ⸀ἑαυτοὺς κρείττονα ⸀ὕπαρξιν καὶ μένουσαν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/034.yaml
  text: For you also suffered together with the prisoners[a], and you accepted with joy the plundering of your possessions[b], knowing that you yourselves have a better and lasting possession.
translation:
  language: sw
  text: Kwa maana mlishiriki mateso ya wafungwa[a], na mkakubali kwa furaha kuporwa mali zenu, mkijua kwamba ninyi wenyewe mna mali iliyo bora zaidi na ya kudumu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mliwahurumia wafungwa.” Kitenzi cha Kigiriki kinaweza kumaanisha kuwa na huruma, lakini hapa huenda kinajumuisha kushiriki mateso yao.
    reason: lexical_alternative
  - marker: b
    text: Baadhi ya hati zinasema, “mkijua kwamba mna mali bora zaidi mbinguni, nayo ni ya kudumu.”
    reason: textual_variant
lexical_decisions:
- source_word: δεσμίοις
  choice: wafungwa
  rationale: Neno hili humaanisha watu walio vifungoni au gerezani; “wafungwa” ni fupi, wazi, na la kawaida katika Kiswahili.
- source_word: συνεπαθήσατε
  choice: mlishiriki mateso ya
  rationale: Kitenzi kinaweza kumaanisha kuhurumia au kuwa na hisia pamoja na mwingine, lakini kiambishi σύν- na muktadha wa mateso vinaonyesha mshikamano wenye kushiriki gharama, si huruma ya moyoni tu.
- source_word: ἁρπαγήν
  choice: kuporwa
  rationale: Neno hili linaonyesha kunyang'anywa kwa nguvu au isivyo haki; “kuporwa” huhifadhi uzito huo kuliko usemi wa kiutawala kama “kutaifishwa.”
- source_word: τῶν ὑπαρχόντων ὑμῶν
  choice: mali zenu
  rationale: Kirai hiki kinamaanisha vitu au mali walizokuwa nazo; “mali zenu” ni usemi wa kawaida na unaofaa katika Kiswahili.
- source_word: μετὰ χαρᾶς
  choice: kwa furaha
  rationale: Tafsiri ya moja kwa moja na ya kawaida inayohifadhi msisitizo wa namna walivyokubali kuporwa.
- source_word: προσεδέξασθε
  choice: mkakubali
  rationale: Katika muktadha wa kuvumilia hasara, “mkakubali” huonyesha kwamba waliipokea hali hiyo bila kudokeza kuwa waliidhinisha dhuluma yenyewe.
- source_word: γινώσκοντες
  choice: mkijua
  rationale: Huhifadhi muundo wa kitenzi tegemezi na pia huacha wazi uhusiano wake wa wakati na sababu.
- source_word: ἑαυτοὺς ἔχειν
  choice: ninyi wenyewe mna
  rationale: Huhifadhi msisitizo wa kiwakilishi rejeshi ἑαυτούς katika matini ya SBLGNT.
- source_word: κρείττονα
  choice: iliyo bora zaidi
  rationale: “Bora zaidi” hudumisha mada ya ulinganisho inayojirudia katika Waebrania.
- source_word: ὕπαρξιν
  choice: mali
  rationale: Neno linaweza kumaanisha mali au miliki. “Mali” hudumisha uhusiano wa kimaana na mali zilizoporwa, ingawa umoja wa Kigiriki unatumiwa kwa maana ya jumla.
- source_word: μένουσαν
  choice: ya kudumu
  rationale: Huonyesha hali ya kuendelea kuwapo na kutopotea, kwa lugha ya kawaida na yenye heshima.
theological_decisions:
- issue: Maana ya mshikamano na waamini waliofungwa
  choice: Kushiriki mateso ya wafungwa
  alternative: Kuwahurumia wafungwa
  rationale: συμπαθέω inaweza kueleza huruma, lakini katika muktadha wa Waebrania 10:32–34 usemi wenye nguvu zaidi unaonyesha mshikamano wa vitendo na mateso yao. Tanbihi huhifadhi uwezekano wa tafsiri dhaifu zaidi.
- issue: Asili ya “mali iliyo bora zaidi na ya kudumu”
  choice: Imeachwa kuwa mali bora na ya kudumu bila kutajwa mahali ilipo au kufafanuliwa kuwa wokovu, urithi, au thawabu
  alternative: Mali bora mbinguni; urithi bora
  rationale: Matini ya SBLGNT haisemi “mbinguni,” kwa hiyo tafsiri kuu haiongezi ufafanuzi wa kiteolojia ambao haupo katika matini iliyochaguliwa.
- issue: Tofauti ya matini kuhusu ἑαυτούς na nyongeza ya ἐν οὐρανοῖς
  choice: 'Kufuata matini ya SBLGNT: “ninyi wenyewe mna mali iliyo bora zaidi na ya kudumu”'
  alternative: “mna kwa ajili yenu mali bora mbinguni, nayo ni ya kudumu”
  rationale: Ushahidi wa hati una tofauti muhimu; tanbihi inautaja bila kuingiza usomaji mbadala katika matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Mlishiriki mateso” ni wazi kwa wasomaji wa kawaida na huhifadhi uzito wa mshikamano; “kuporwa mali zenu” ni ya asili na huonyesha unyang'anyi wa nguvu. Alama zote za tanbihi zimewekwa katika matini kuu karibu na maneno yanayohusika.
