  text: ὁ δὲ δίκαιός ⸀μου ἐκ πίστεως ζήσεται, καὶ ἐὰν ὑποστείληται, οὐκ εὐδοκεῖ ἡ ψυχή μου ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/038.yaml
  text: But my righteous one will live by faith[a], and if he shrinks back[c][b], my soul takes no pleasure in him.
translation:
  language: sw
  text: Lakini mwenye haki wangu[b] ataishi kwa imani[a]; naye akirudi nyuma[c], nafsi yangu haimfurahii.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa uaminifu” au “kwa kutumaini.” Neno la Kigiriki pistis linaweza kuwa na maana hizi, ingawa matini kuu imetumia “imani.”
    reason: lexical_alternative
  - marker: b
    text: Baadhi ya hati za kale husoma tu “mwenye haki,” bila neno “wangu.”
    reason: textual_variant
  - marker: c
    text: Katika Kigiriki, maneno yanayorejelea mtu huyu yako katika umoja wa kiume na yanatumika kiwakilishi; si lazima yawe yanawahusu wanaume pekee.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ δὲ δίκαιός μου
  choice: Lakini mwenye haki wangu
  rationale: Kivumishi chenye kibainishi kimetumiwa kama nomino, kikimtaja mtu mwenye sifa ya haki. Neno μου limehifadhiwa kwa ‘wangu,’ kulingana na matini ya SBLGNT.
- source_word: ἐκ πίστεως
  choice: kwa imani
  rationale: Kiambishi ἐκ hapa huonyesha msingi au njia ya kuishi. ‘Kwa imani’ ni Kiswahili cha kawaida na cha moja kwa moja; maana zinazowezekana za uaminifu na kutumaini zimehifadhiwa katika tanbihi.
- source_word: ζήσεται
  choice: ataishi
  rationale: Huhifadhi wakati ujao wa kitenzi ζάω kwa lugha ya kawaida na iliyo wazi.
- source_word: ὑποστείληται
  choice: akirudi nyuma
  rationale: Katika muktadha huu kitenzi kinaonyesha kujiondoa au kurudi nyuma chini ya shinikizo. Usemi huu unaeleweka kwa urahisi na unaendana na onyo la kifungu.
- source_word: οὐκ εὐδοκεῖ
  choice: haitapendezwa
  rationale: Hutoa maana ya kutofurahia au kutoridhishwa, huku ikiunganishwa moja kwa moja na ‘nafsi yangu’ kama ilivyo katika Kigiriki.
- source_word: ἡ ψυχή μου
  choice: nafsi yangu
  rationale: Huhifadhi usemi wa wazi wa Kigiriki na mwangwi wake wa Maandiko badala ya kuufupisha kuwa ‘mimi.’
- source_word: ἐν αὐτῷ
  choice: naye
  rationale: Baada ya kitenzi cha kupendezwa, ‘naye’ ni Kiswahili cha asili kinachowasilisha ἐν + dative bila kulazimisha muundo usio wa kawaida.
theological_decisions:
- issue: Maana ya πίστις katika ἐκ πίστεως
  choice: imani
  alternative: uaminifu; kutumaini
  rationale: ‘Imani’ imewekwa katika matini kuu bila kufuta upana wa maana wa πίστις; maana nyingine zinazowezekana zimeelezwa katika tanbihi.
- issue: Mhusika wa kishazi ‘akirudi nyuma’
  choice: Mtu yuleyule aliyetajwa kama ‘mwenye haki wangu’
  alternative: Mtu yeyote asiye yule aliyetajwa kwanza
  rationale: Kigiriki kinaendeleza rejeo la umoja katika kishazi kinachofuata bila kutaja wazi mhusika mwingine. Tafsiri inadumisha mtiririko huo na mvutano wa onyo.
- issue: Umoja wa kiume wenye maana wakilishi
  choice: Kutumia muundo wa umoja usiobainisha jinsia katika Kiswahili
  alternative: Kumtaja wazi kama mwanamume
  rationale: Kigiriki kina maumbo ya umoja wa kiume yanayoweza kutumiwa kiwakilishi. Kiswahili hakihitaji kiwakilishi chenye jinsia hapa; tanbihi inaeleza umbo la chanzo bila kudokeza kwamba kauli inawahusu wanaume pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo ‘nafsi yangu haitapendezwa naye’ umehifadhiwa ili kudumisha picha na nguvu ya usemi wa chanzo.
