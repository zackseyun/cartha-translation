id: HEB.10.36
reference: Hebrews 10:36
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὑπομονῆς γὰρ ἔχετε χρείαν ἵνα τὸ θέλημα τοῦ θεοῦ ποιήσαντες κομίσησθε τὴν ἐπαγγελίαν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/036.yaml
  text: For you have need of endurance[a], so that after doing the will of God you may receive the promise.
translation:
  language: sw
  text: Kwa maana mnahitaji uvumilivu ili, baada ya kufanya mapenzi ya Mungu, mpokee ahadi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mpokee kile kilichoahidiwa.”
    reason: Maana nyingine inayowezekana ya τὴν ἐπαγγελίαν katika muktadha huu.
lexical_decisions:
- source_word: ὑπομονῆς
  choice: uvumilivu
  rationale: Neno hili linaeleza kudumu kwa uthabiti chini ya shinikizo au majaribu. “Uvumilivu” ni neno la kawaida na lenye heshima katika Kiswahili, bila kuongeza maana isiyokuwamo wazi katika chanzo.
- source_word: χρείαν ἔχετε
  choice: mnahitaji
  rationale: Hii ndiyo tafsiri ya kawaida na ya moja kwa moja ya nahau yenye maana ya kuwa na uhitaji wa kitu.
- source_word: ἵνα
  choice: ili
  rationale: “Ili” huonyesha kusudi au matokeo yanayokusudiwa kwa njia ya asili katika Kiswahili.
- source_word: τὸ θέλημα τοῦ θεοῦ
  choice: mapenzi ya Mungu
  rationale: Huu ni usemi wa kawaida wa kibiblia katika Kiswahili unaowasilisha kwa uaminifu wazo la yale Mungu anayotaka.
- source_word: ποιήσαντες
  choice: baada ya kufanya
  rationale: Kirai hiki kinaonyesha kwamba kufanya mapenzi ya Mungu hutangulia kupokea; “baada ya kufanya” huweka wazi uhusiano huo wa wakati.
- source_word: κομίσησθε
  choice: mpokee
  rationale: Katika muktadha huu kitenzi kina maana ya kupokea au kupata kile kilichoahidiwa. “Mpokee” ni wazi na cha kawaida.
- source_word: τὴν ἐπαγγελίαν
  choice: ahadi
  rationale: Nomino ya Kigiriki inaweza kumaanisha ahadi yenyewe au kile kilichoahidiwa. “Ahadi” huhifadhi umbo na utata wa chanzo, huku maana nyingine ikitolewa katika tanbihi.
theological_decisions:
- issue: Iwapo ἐπαγγελίαν inamaanisha ahadi yenyewe au kile kilichoahidiwa
  choice: ahadi
  alternative: kile kilichoahidiwa
  rationale: Chanzo kinasema kihalisi “ahadi,” lakini pamoja na kitenzi κομίσησθε usemi huo unaweza kueleweka kuwa kupokea utimilifu au kitu kilichoahidiwa. Matini kuu inahifadhi usemi wa chanzo bila kuondoa mvutano huo, na tanbihi inaonyesha maana nyingine inayowezekana.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Muundo ni wa asili huku ukihifadhi mpangilio wa kimantiki wa Kigiriki.
