revisions:
- from: bali tarajio la kutisha la hukumu[a], na ghadhabu ya moto ulio karibu kuwateketeza wale wanaompinga Mungu.
  to: bali tarajio la kutisha la hukumu[a], na ukali wa moto unaokaribia kuwateketeza wapinzani.
  rationale: The revision removes the supplied reference to God, preserving the source’s unqualified designation “the adversaries.” It renders the compressed fire expression in natural formal Swahili while retaining its severity and the imminence expressed by μέλλοντος. The existing footnote anchor and lexical-alternative note remain structurally valid and semantically defensible.
  reviewer_model: gpt-5.6-terra
