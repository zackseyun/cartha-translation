  text: φοβερὰ δέ τις ἐκδοχὴ κρίσεως καὶ πυρὸς ζῆλος ἐσθίειν μέλλοντος τοὺς ὑπεναντίους.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/027.yaml
  text: but a fearful expectation of judgment[a], and a fury of fire about to consume the adversaries.
translation:
  language: sw
  text: bali tarajio la kutisha la hukumu[a], na ukali wa moto unaokaribia kuwateketeza wapinzani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kungojea hukumu kwa hofu kuu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: φοβερὰ
  choice: la kutisha
  rationale: Kivumishi hiki kinaeleza tarajio kuwa lenye kutia hofu kuu; ‘la kutisha’ ni Kiswahili cha kawaida, chenye uzito, bila kuongeza ufafanuzi wa kimadhehebu.
- source_word: δέ
  choice: bali
  rationale: Katika muktadha, kiunganishi hiki kinaonyesha tofauti na kauli hasi ya mstari uliotangulia.
- source_word: τις
  choice: —
  rationale: Maana yake ya kutokutaja kwa ukamilifu inabebwa kwa kawaida na muundo wa ‘tarajio la’; kuitafsiri moja kwa moja kuwa ‘fulani’ kungefanya Kiswahili kisikike kisicho cha kawaida.
- source_word: ἐκδοχὴ
  choice: tarajio
  rationale: Neno hili lina maana ya kutarajia au kungojea jambo linalokuja; ‘tarajio’ linafaa pamoja na ‘la hukumu’.
- source_word: κρίσεως
  choice: la hukumu
  rationale: ‘Hukumu’ huhifadhi maana pana ya tendo la kimahakama bila kuibana kuwa ‘adhabu’ au ‘hukumu ya hatia.’
- source_word: πυρὸς ζῆλος
  choice: ghadhabu ya moto
  rationale: ζῆλος katika taswira hii hubeba nguvu kali inayowaka; ‘ghadhabu ya moto’ ni ya asili na yenye uzito katika Kiswahili kuliko tafsiri halisi ‘wivu/juhudi ya moto.’
- source_word: ἐσθίειν
  choice: kuwateketeza
  rationale: Katika muktadha wa moto wa hukumu, ‘kuteketeza’ huwasilisha maana ya kula kabisa au kuangamiza kwa moto kwa njia ya kawaida.
- source_word: μέλλοντος
  choice: ulio karibu
  rationale: Huhifadhi wazo la jambo linalokaribia au lililo tayari kutokea bila kuligeuza kuwa maelezo ya hatima ya milele.
- source_word: τοὺς ὑπεναντίους
  choice: wale wanaompinga Mungu
  rationale: Neno humaanisha walio upande wa upinzani. Kitenzi ‘kumpinga’ ni cha kawaida zaidi kuliko nomino nzito ‘wapinzani’; ‘Mungu’ huweka wazi mlengwa anayodokezwa na taswira ya hukumu katika muktadha.
theological_decisions:
- issue: Asili ya taswira ya hukumu
  choice: Kuhifadhi taswira kali ya moto unaoteketeza bila kufafanua wazi kuwa ni lugha ya mfano au adhabu ya milele.
  alternative: Kutafsiri kwa ufafanuzi kuwa ‘adhabu ya milele’ au kupunguza taswira kuwa mfano tu.
  rationale: Mstari unaonya kuhusu hukumu ya Mungu kwa taswira kali, lakini hauainishi hapa muda au maelezo yote ya hukumu hiyo.
- issue: Utambulisho wa τοὺς ὑπεναντίους
  choice: ‘wale wanaompinga Mungu’
  alternative: ‘wapinzani’
  rationale: Muktadha wa hukumu na moto unadokeza kuwa upinzani unamlenga Mungu. Tafsiri hii inaeleweka kwa urahisi, ingawa nomino yenyewe haisemi jina ‘Mungu’ moja kwa moja.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa ulinganifu mwafaka: unahifadhi ukali na msongamano wa Kigiriki huku ukiepuka misemo isiyo ya kawaida kama ‘juhudi ya moto.’'
