review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the adversative force, fearful expectation, judgment, impending consumption, and fire imagery. However, τοὺς ὑπεναντίους means “the adversaries/opponents” and does not name God as the one opposed. Adding “Mungu” supplies information not expressed in this verse. The compressed πυρὸς ζῆλος is better represented by an idiomatic expression retaining the forceful fire imagery rather than by a phrase that can suggest that the fire itself has personal wrath.
  naturalness: The register is clear, contemporary Standard East African Swahili. “Ukali wa moto unaokaribia kuwateketeza wapinzani” is natural and suitably grave. It also avoids the heavier explanatory phrase “wale wanaompinga Mungu.”
  terminology: “Hukumu” correctly preserves κρίσις without prejudging its precise outcome. “Wapinzani” directly represents τοὺς ὑπεναντίους. “Ukali wa moto” is an idiomatic rendering of the vivid, compressed πυρὸς ζῆλος and retains its destructive intensity without importing a denominational interpretation.
  issues:
  - severity: medium
    issue: “wale wanaompinga Mungu” adds an explicit object absent from the Greek.
    rationale: The source identifies “the adversaries” but does not say “those opposing God” in this clause. The wider context may inform interpretation, but the translation should not make that inference explicit.
  - severity: low
    issue: “ghadhabu ya moto” is less precise as a rendering of πυρὸς ζῆλος.
    rationale: The phrase denotes a fierce, fire-like zeal/fury and is likely scriptural allusion language. “Ukali wa moto” is idiomatic in Swahili while preserving the intense fire imagery without personifying the fire as angry.
  revised_text: bali tarajio la kutisha la hukumu[a], na ukali wa moto unaokaribia kuwateketeza wapinzani.
  revised_footnotes:
  - marker: a
    text: Au, “kungojea hukumu kwa hofu kuu.”
    reason: lexical_alternative
  revision_rationale: The revision removes the supplied reference to God, preserving the source’s unqualified designation “the adversaries.” It renders the compressed fire expression in natural formal Swahili while retaining its severity and the imminence expressed by μέλλοντος. The existing footnote anchor and lexical-alternative note remain structurally valid and semantically defensible.
