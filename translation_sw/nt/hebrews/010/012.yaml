base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/012.yaml
  text: But this one[a], after offering one sacrifice for sins for all time, sat down at the right hand of God[b],
translation:
  language: sw
  text: Lakini huyu, baada ya kutoa dhabihu moja kwa ajili ya dhambi kwa wakati wote,[a] aliketi upande wa kuume wa Mungu[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akiwa ametoa dhabihu moja kwa ajili ya dhambi milele.” Kishazi cha Kigiriki “kwa wakati wote” kinaweza kuhusishwa kwa karibu zaidi na tendo la kutoa dhabihu, kikikazia matokeo yake ya kudumu.
    reason: alternative_reading
  - marker: b
    text: “Upande wa kuume wa Mungu” ni mwangwi wa Zaburi 110:1, andiko muhimu katika Waebrania kuhusu kuinuliwa kwa Masihi.
    reason: cross_reference
lexical_decisions:
- source_word: οὗτος
  choice: huyu
  rationale: Kiwakilishi kionyeshi kinadumisha mkazo na utofautishaji kati yake na makuhani wanaotoa dhabihu mara kwa mara katika muktadha uliotangulia.
- source_word: δὲ
  choice: Lakini
  rationale: Kinaonyesha utofauti na makuhani wa mstari uliotangulia, ambao husimama na kutoa dhabihu zilezile tena na tena.
- source_word: μίαν ... θυσίαν
  choice: dhabihu moja
  rationale: Kinahifadhi mkazo wa Kigiriki juu ya dhabihu moja, tofauti na dhabihu nyingi zilizorudiwa.
- source_word: ὑπὲρ ἁμαρτιῶν
  choice: kwa ajili ya dhambi
  rationale: Ni usemi wa kawaida na unaoeleweka unaowasilisha kusudi la dhabihu huku ukihifadhi wingi wa neno la Kigiriki.
- source_word: προσενέγκας
  choice: baada ya kutoa
  rationale: Inaonyesha kwa kawaida kwamba tendo la kutoa dhabihu lilitangulia tendo kuu la kuketi.
- source_word: εἰς τὸ διηνεκές
  choice: kwa wakati wote
  rationale: Inaeleza udumu wa dhabihu hiyo bila kutumia lugha nzito; nafasi yake karibu na dhabihu inaonyesha ufanisi wake wa kudumu, huku tanbihi ikihifadhi uwezekano mwingine wa kisintaksia.
- source_word: ἐκάθισεν
  choice: aliketi
  rationale: Ni tafsiri ya moja kwa moja ya tendo lililokamilika na inadumisha utofauti wa kimuktadha na makuhani wanaoendelea kusimama.
- source_word: ἐν δεξιᾷ τοῦ θεοῦ
  choice: upande wa kuume wa Mungu
  rationale: Ni usemi wa heshima unaotambulika katika Kiswahili cha Biblia na unadumisha mwangwi wa Zaburi 110:1.
theological_decisions:
- issue: Uhusiano wa kisintaksia wa εἰς τὸ διηνεκές
  choice: Imewekwa karibu na kutoa dhabihu ili kukazia ufanisi wa kudumu wa dhabihu hiyo moja.
  alternative: 'Inaweza kuhusishwa na kuketi: “aliketi kwa wakati wote upande wa kuume wa Mungu.”'
  rationale: Muktadha wa Waebrania 10 unatofautisha dhabihu moja yenye matokeo ya kudumu na dhabihu zinazotolewa tena na tena. Hata hivyo, muundo wa Kigiriki unaruhusu kishazi hicho kuhusishwa na kuketi, kwa hiyo uwezekano huo umeonyeshwa katika tanbihi.
- issue: Maana ya kuketi upande wa kuume wa Mungu
  choice: Usemi umeachwa kama ulivyo bila kuongeza ufafanuzi wa kimafundisho katika matini.
  alternative: Kufafanua moja kwa moja kuwa ni kutawazwa au kuinuliwa kwa Masihi.
  rationale: Mwangwi wa Zaburi 110:1 ni muhimu, lakini tafsiri haipaswi kuingiza ufafanuzi ndani ya matini kuliko maneno ya chanzo yanavyosema.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. “Huyu” inadumisha utofautishaji wa kifungu; “upande wa kuume” inadumisha usemi wa kibiblia unaojulikana bila kuwa wa kizamani kupita kiasi.
