lexical_decisions:
- source_word: πλήν
  choice: Lakini
  rationale: Hapa neno hili linaweka mpaka au marekebisho katika hoja ya Paulo. “Lakini” ni kiunganishi cha kawaida na chenye hadhi kinachoonyesha msisitizo huu bila kulifanya kuwa jambo la pekee lisilohusiana.
- source_word: εἰς ὃ
  choice: tulipofikia
  rationale: Muundo huu unaelekeza kwenye hatua au kiwango kilichofikiwa; Kiswahili cha “tulipofikia” huunganisha maana hiyo kwa kawaida na kitenzi ἐφθάσαμεν.
- source_word: ἐφθάσαμεν
  choice: tulipofikia
  rationale: Kitenzi kinaonyesha hatua ambayo tayari imefikiwa. Wakati wa -li- katika kishazi hiki unaonyesha tendo lililotimia ambalo bado ni msingi wa himizo la sasa.
- source_word: τῷ αὐτῷ
  choice: kwa hatua ileile
  rationale: Dativi inaonyesha namna au kipimo kinachofuatwa. “Kwa hatua ileile” huhifadhi wazo la ulinganifu bila kuongeza waziwazi nomino kama “kanuni,” ambayo haipo katika matini hii fupi ya Kigiriki.
- source_word: στοιχεῖν
  choice: na tuendelee kwenda
  rationale: Kitenzi hiki kina taswira ya kwenda kwa mstari au hatua inayolingana na kipimo fulani. “Tuendelee kwenda” ni himizo la asili kwa Kiswahili, huku “kwa hatua ileile” likibeba taswira ya kwenda kwa mpangilio.
theological_decisions:
- issue: Iwapo kutaja wazi nomino kama “kanuni” au “kipimo” pamoja na τῷ αὐτῷ
  choice: Kutotaja “kanuni” katika matini kuu; kutumia “kwa hatua ileile.”
  alternative: “na tuenende kwa kanuni ileile” / “na tushike kipimo kilekile”
  rationale: Matini ya SBLGNT inaacha kitu kinacholinganishwa bila kukitaja wazi. Tafsiri kuu inadumisha hali hiyo badala ya kuingiza nomino inayopatikana katika mapokeo mengine ya matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “tulipofikia” ni wa kawaida na wazi; “kwa hatua ileile” huhifadhi taswira ya στοιχεῖν na kutotaja wazi kipimo ambacho Kigiriki kimekiacha kuwa fiche.
