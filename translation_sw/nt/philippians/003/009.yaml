  text: καὶ εὑρεθῶ ἐν αὐτῷ, μὴ ἔχων ἐμὴν δικαιοσύνην τὴν ἐκ νόμου ἀλλὰ τὴν διὰ πίστεως Χριστοῦ, τὴν ἐκ θεοῦ δικαιοσύνην ἐπὶ τῇ πίστει,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/009.yaml
  text: and be found in him[a], not having my own righteousness from the law[b], but that which is through faith in Messiah—the righteousness from God based on faith.
translation:
  language: sw
  text: na nipatikane ndani yake, bila kuwa na haki[b] yangu mwenyewe itokanayo na sheria, bali ile ipatikanayo kwa imani katika Masihi[a]—haki itokayo kwa Mungu kwa msingi wa imani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa njia ya uaminifu wa Masihi.”
    reason: alternative_reading
  - marker: b
    text: Au, “uadilifu” (katika matukio yote mawili).
    reason: lexical_alternative
lexical_decisions:
- source_word: εὑρεθῶ
  choice: nipatikane
  rationale: Kitenzi cha kutendwa katika hali tegemezi kinaendelezwa kwa ‘nipatikane,’ ambacho ni cha asili katika Kiswahili na hakiongezi ufafanuzi usio katika matini.
- source_word: ἐν αὐτῷ
  choice: ndani yake
  rationale: Huhifadhi lugha pana ya Paulo kuhusu kuwa ndani ya Masihi bila kuifupisha kuwa maelezo maalumu kama ‘nimeunganishwa naye.’
- source_word: μὴ ἔχων
  choice: nisiwe na
  rationale: Huonyesha hali ambayo Paulo anataka kupatikana nayo na ni ya kawaida zaidi kwa Kiswahili kuliko tafsiri ya neno kwa neno ya kishirikishi.
- source_word: δικαιοσύνην
  choice: haki
  rationale: ‘Haki’ ni neno la kawaida na lenye hadhi linalobeba sehemu kubwa ya upana wa δικαιοσύνη katika Kiswahili; tanbihi inaonyesha uwezekano wa maana ya uadilifu au haki ya hukumu.
- source_word: τὴν ἐκ νόμου
  choice: itokanayo na sheria
  rationale: Huonyesha wazi chanzo kinachoashiriwa na ἐκ na kuunganika kiasili na ‘haki yangu mwenyewe.’
- source_word: διὰ πίστεως Χριστοῦ
  choice: kwa kumwamini Masihi
  rationale: Huwasilisha usomaji wa imani iliyoelekezwa kwa Masihi kwa Kiswahili cha kawaida; usomaji mwingine wa ‘uaminifu wa Masihi’ umehifadhiwa katika tanbihi.
- source_word: Χριστοῦ
  choice: Masihi
  rationale: Hapa Χριστός bado lina nguvu ya cheo, hivyo ‘Masihi’ huhifadhi maana hiyo kuliko kulitumia tu kama jina.
- source_word: τὴν ἐκ θεοῦ δικαιοσύνην
  choice: haki itokayo kwa Mungu
  rationale: Huhifadhi marudio ya ‘haki’ na wazo la Mungu kuwa chanzo chake kwa muundo mfupi wa Kiswahili.
- source_word: ἐπὶ τῇ πίστει
  choice: inayotegemea imani
  rationale: Huonyesha msingi au tegemeo linalowasilishwa na ἐπί pamoja na dativu, kwa lugha ya sasa na inayoeleweka.
theological_decisions:
- issue: Maana ya πίστεως Χριστοῦ
  choice: 'Imani katika Masihi: ‘kwa kumwamini Masihi’'
  alternative: 'Uaminifu wa Masihi: ‘kwa njia ya uaminifu wa Masihi’'
  rationale: Muundo wa Kigiriki unaweza kueleweka kwa njia zote mbili. Matini kuu inafuata usomaji wa imani inayoelekezwa kwa Masihi, huku tanbihi ikihifadhi usomaji wa uaminifu wa Masihi bila kuufuta.
- issue: Maana ya δικαιοσύνη katika hoja ya Paulo
  choice: haki
  alternative: uadilifu; au haki kwa maana ya hukumu ya haki
  rationale: ‘Haki’ ni sawa la kawaida la Kiswahili lenye upana unaofaa, lakini δικαιοσύνη linaweza kusisitiza uadilifu au haki ya hukumu kulingana na jinsi hoja inavyoeleweka.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi umehifadhi mlinganisho wa Paulo kati ya haki itokanayo na sheria na haki itokayo kwa Mungu, huku vistari virefu vikitenga ufafanuzi wa pili.
