  yaml_path: translation/nt/philippians/003/014.yaml
  text: I press on toward the goal for the prize of the upward call of God in Messiah Jesus[a][b].
translation:
  language: sw
  text: Nakaza mwendo kuelekea lengo ili nipate tuzo ya mwito wa Mungu wa kwenda juu[a] katika Masihi Yesu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mwito wa mbinguni” au “mwito utokao juu.”
    reason: lexical_alternative
  - marker: b
    text: 'Kigiriki: “katika Kristo Yesu”; hapa “Kristo” limetafsiriwa “Masihi” kwa sababu Χριστός ni cheo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ σκοπόν
  choice: kuelekea lengo
  rationale: Katika picha ya mashindano ya mbio, kirai hiki kinaonyesha mwendo unaoelekezwa kwenye shabaha maalumu; “kuelekea lengo” ni Kiswahili cha kawaida na kinahifadhi picha hiyo.
- source_word: διώκω
  choice: Nakaza mwendo
  rationale: Kitenzi hiki hapa kina maana ya kufuatilia kwa bidii. “Nakaza mwendo” kinaonyesha jitihada kubwa na kusonga mbele katika picha ya mbio bila kuongeza wazo la kasi pekee.
- source_word: εἰς τὸ βραβεῖον
  choice: ili nipate tuzo
  rationale: εἰς hapa inaonyesha kusudi la juhudi. Tafsiri hii ni ya asili katika Kiswahili na inaweka wazi kwamba tuzo ndiyo inayolengwa, bila kudai kwamba tayari imepatikana.
- source_word: ἄνω
  choice: wa kwenda juu
  rationale: Uchaguzi huu unahifadhi mwelekeo wa ἄνω na mvutano wake wa kimaana; unaweza kuhusishwa na mwito unaoelekeza juu, huku uwezekano wa maana ya mbinguni au kutoka juu ukibaki katika tanbihi.
- source_word: κλήσεως τοῦ θεοῦ
  choice: mwito wa Mungu
  rationale: Muundo huu unaakisi genitivi ya Kigiriki kwa njia ya kawaida na yenye heshima katika Kiswahili, bila kuamua zaidi ya maandishi kama Mungu ndiye chanzo au mwenye mwito.
- source_word: Χριστῷ
  choice: Masihi
  rationale: Χριστός hapa inabaki kuwa cheo chenye maana, kwa hiyo “Masihi” huiwasilisha kama cheo badala ya kuiacha tu kama jina lililohamishwa.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: katika Masihi Yesu
  rationale: Kirai kihusishi kimetafsiriwa moja kwa moja ili kuhifadhi lugha ya Paulo ya kuwamo au kuunganishwa katika Masihi Yesu.
theological_decisions:
- issue: Maana ya ἄνω κλήσεως
  choice: mwito ... wa kwenda juu
  alternative: mwito wa mbinguni; mwito utokao juu
  rationale: Neno ἄνω linaweza kueleza mwelekeo wa juu au uhusiano na yaliyo juu. Tafsiri kuu inahifadhi maana ya mwelekeo na picha ya mashindano, huku tanbihi ikionyesha tafsiri nyingine halali bila kutatua kimya kimya mvutano wa kimaana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Nakaza mwendo” huhifadhi nguvu ya sitiari ya mbio; “tuzo” ni neno linaloeleweka kwa urahisi katika muktadha wa mashindano. Alama zote za tanbihi zimewekwa baada ya sentensi inayohusika.
