review_pass:
  verdict: revise
  source_fidelity: Draft correctly preserves the singular possessive in «wangu», the plural «sisi», the collective force of Συμμιμηταί, and the imperative sense of σκοπεῖτε. However, «kama vile mlivyo na sisi kuwa kielelezo» is not idiomatic or grammatically well-formed Standard East African Swahili. The revision renders καθὼς ἔχετε τύπον ἡμᾶς naturally as «kwa kuwa mnayo sisi kama kielelezo», retaining the sense that the readers have Paul and his associates as their model.
  naturalness: «Kwa pamoja iweni waigaji wangu» is clearer and more natural than «iweni waigaji wangu pamoja». «Wanaoishi kwa namna hii» is natural modern Kiswahili for the figurative Greek expression concerning manner of life. The final clause requires revision for natural syntax.
  terminology: «Ndugu», «waigaji», «kielelezo», and «waangalieni kwa makini» are suitable, respectful, and semantically sound. The note appropriately explains the Greek masculine-plural form without making the Swahili text artificially gendered.
  issues:
  - severity: medium
    issue: 'The final clause is unidiomatic: «kama vile mlivyo na sisi kuwa kielelezo.»'
    rationale: The construction does not naturally express ‘just as you have us as a pattern’ in Standard East African Swahili. «Kwa kuwa mnayo sisi kama kielelezo» is idiomatic and preserves the plural object ἡμᾶς and exemplary sense of τύπον.
  - severity: low
    issue: Placement of «pamoja» in the opening command is slightly awkward.
    rationale: Moving it before the imperative—«Kwa pamoja iweni waigaji wangu»—more clearly conveys the shared/collective force of Συμμιμηταί.
