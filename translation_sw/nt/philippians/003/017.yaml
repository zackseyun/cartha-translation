id: PHP.3.17
reference: Philippians 3:17
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Συμμιμηταί μου γίνεσθε, ἀδελφοί, καὶ σκοπεῖτε τοὺς οὕτω περιπατοῦντας καθὼς ἔχετε τύπον ἡμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/017.yaml
  text: Brothers[a], join in imitating me, and keep your eyes on those who walk this way[b], just as you have us as a pattern.
translation:
  language: sw
  text: Ndugu[a], kwa pamoja iweni waigaji wangu, na waangalieni kwa makini wale wanaoishi kwa namna hii, kwa kuwa mnayo sisi kama kielelezo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki lina umbo la wingi wa kiume, lakini yaelekea Paulo analielekeza kwa kusanyiko lote, wanaume na wanawake.
    reason: cultural_note
lexical_decisions:
- source_word: Συμμιμηταί μου γίνεσθε
  choice: iweni waigaji wangu pamoja
  rationale: 'Muundo huu unahifadhi amri ya γίνεσθε na nguvu ya kijumuiya ya Συμμιμηταί: waamini waige pamoja, si kila mmoja peke yake.'
- source_word: ἀδελφοί
  choice: Ndugu
  rationale: Katika Kiswahili, “ndugu” ni neno la kawaida linaloweza kuwaita waamini wa kiume na wa kike, huku likidumisha lugha ya kifamilia ya Kigiriki.
- source_word: σκοπεῖτε
  choice: waangalieni kwa makini
  rationale: Kitenzi kinaashiria kuelekeza uangalifu na kuwachunguza kwa kusudi, si kuwaona tu.
- source_word: οὕτω περιπατοῦντας
  choice: wale wanaoishi kwa namna hii
  rationale: Ingawa περιπατέω kihalisi ni “kutembea,” hapa ni sitiari ya mwenendo wa maisha; tafsiri hii huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: τύπον
  choice: kielelezo
  rationale: Neno hili linaonyesha mfano au kielelezo kinachopaswa kufuatwa.
- source_word: ἡμᾶς
  choice: sisi
  rationale: Wingi wa kiwakilishi umehifadhiwa; Paulo hajisemi yeye peke yake bali anajumuisha wenzake.
theological_decisions:
- issue: Upeo wa ἀδελφοί
  choice: Kutumia “Ndugu” katika matini kuu na kufafanua katika tanbihi kuwa kusanyiko lote linaelekezwa.
  alternative: “Ndugu wa kiume na wa kike”
  rationale: “Ndugu” ni la asili na lenye heshima katika Kiswahili na linaweza kuwa jumuishi, lakini tanbihi huweka wazi umbo la kiume la Kigiriki na uwezekano mkubwa wa rejeo kwa kusanyiko lote.
- issue: Uhusiano wa “mimi” na “sisi” katika mstari
  choice: Kuhifadhi “wangu” mwanzoni na “sisi” mwishoni.
  alternative: Kusawazisha zote kuwa umoja au wingi
  rationale: Badiliko hilo limo katika matini ya Kigiriki na linaweza kuonyesha kwamba Paulo anajitaja kwanza, kisha anajumuisha washirika wake kama kielelezo; halipaswi kuondolewa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Wanaoishi” limetumiwa badala ya “wanaotembea” ili sitiari ya Kigiriki ieleweke kwa kawaida; “kielelezo” kinatunza wazo la mfano wa kufuatwa.
