  text: πολλοὶ γὰρ περιπατοῦσιν οὓς πολλάκις ἔλεγον ὑμῖν, νῦν δὲ καὶ κλαίων λέγω, τοὺς ἐχθροὺς τοῦ σταυροῦ τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/018.yaml
  text: For many walk[a], whom I often told you about, and now even weeping I say, are enemies of the cross of Messiah,
translation:
  language: sw
  text: Kwa maana watu wengi wanaishi kama maadui wa msalaba wa Masihi[a]. Nimewaambia habari zao mara nyingi, na sasa ninawaambia huku nikilia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kristo.”
    reason: Tafsiri nyingine ya Χριστοῦ inayotumia umbo la jadi la cheo hicho badala ya ‘Masihi.’
lexical_decisions:
- source_word: πολλοὶ
  choice: watu wengi
  rationale: Kivumishi hiki kimetumika kama nomino na kinamaanisha kundi kubwa la watu bila kuongeza maana nyingine.
- source_word: γὰρ
  choice: kwa maana
  rationale: Kiunganishi hiki kinaonyesha kwamba sentensi hii inatoa sababu au msingi wa himizo lililotangulia.
- source_word: περιπατοῦσιν
  choice: wanaishi
  rationale: Kitenzi hiki kimetumika kwa njia ya sitiari kuhusu mwenendo au namna ya maisha. ‘Wanaishi’ ni Kiswahili cha kawaida na wazi kinachowasilisha maana hiyo.
- source_word: πολλάκις ἔλεγον ὑμῖν
  choice: nimewaambia habari zao mara nyingi
  rationale: Hii inahifadhi wazo la Paulo kuwaeleza wasomaji wake habari za watu hao tena na tena wakati uliopita.
- source_word: νῦν δὲ καὶ κλαίων λέγω
  choice: na sasa ninawaambia tena huku nikilia
  rationale: ‘Huku nikilia’ inadumisha kitendo cha wakati mmoja cha κλαίων na uzito wa hisia za Paulo; ‘tena’ linaonyesha utofautishaji kati ya maonyo ya zamani na taarifa yake ya sasa.
- source_word: ἐχθροὺς
  choice: maadui
  rationale: Neno hili linaonyesha upinzani mkali, na ‘maadui’ ndilo neno la moja kwa moja na la kawaida katika muktadha huu.
- source_word: σταυροῦ
  choice: msalaba
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa chombo cha kusulubia na pia linabeba umuhimu wa kifo cha Yesu unaokusudiwa hapa.
- source_word: Χριστοῦ
  choice: Masihi
  rationale: Hapa Χριστός inafanya kazi kama cheo cha yule aliyetiwa mafuta; ‘Masihi’ huhifadhi maana hiyo ya cheo.
theological_decisions:
- issue: Tafsiri ya Χριστοῦ katika usemi τοῦ σταυροῦ τοῦ Χριστοῦ
  choice: msalaba wa Masihi
  alternative: msalaba wa Kristo
  rationale: Muktadha haulazimishi Χριστός ichukuliwe kama jina binafsi. ‘Masihi’ huhifadhi wazi maana ya cheo, huku tanbihi ikitaja tafsiri ya jadi ‘Kristo’.
- issue: Uhusiano wa watu wengi na ‘maadui wa msalaba’
  choice: wanaishi kama maadui wa msalaba
  alternative: wanaishi; wao ni maadui wa msalaba
  rationale: Katika Kigiriki, τοὺς ἐχθροὺς ni kirai kinachowaeleza οὓς, yaani watu wale wale. ‘Kama maadui’ huonyesha kwamba mwenendo wao unawatambulisha kuwa maadui bila kuongeza sababu ambayo kifungu hakijaitaja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umegawanywa katika sentensi mbili ili kuepuka sentensi nzito isiyo ya kawaida katika Kiswahili, huku uhusiano wa kisarufi na msisitizo wa Kigiriki ukihifadhiwa.
