  text: καίπερ ἐγὼ ἔχων πεποίθησιν καὶ ἐν σαρκί. Εἴ τις δοκεῖ ἄλλος πεποιθέναι ἐν σαρκί, ἐγὼ μᾶλλον·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/004.yaml
  text: Though I myself have confidence even in the flesh. If anyone else thinks he has confidence in the flesh[a], I have more.
translation:
  language: sw
  text: Ingawa mimi mwenyewe nina sababu za kuwa na tumaini hata katika mwili. Ikiwa mtu mwingine yeyote anadhani ana sababu za kuwa na tumaini katika mwili[a], mimi nina sababu zaidi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au “ana tumaini katika sifa za kibinadamu” au “katika hadhi ya nje.” Kigiriki: “katika mwili.”'
    reason: Hufafanua maana ya kimuktadha ya σάρξ bila kuondoa neno la Kigiriki katika matini kuu.
lexical_decisions:
- source_word: καίπερ
  choice: Ingawa
  rationale: Huonyesha kauli ya kukubali jambo linalotofautishwa na hoja kuu, na ni Kiswahili cha kawaida na chenye heshima.
- source_word: ἐγὼ ἔχων πεποίθησιν
  choice: mimi mwenyewe nina sababu ya kuutumainia
  rationale: Muundo huu unawasilisha hali ya kuwa na msingi wa kutegemea kitu; “mimi mwenyewe” huhifadhi msisitizo wa ἐγώ.
- source_word: καὶ ἐν σαρκί
  choice: mwili pia
  rationale: “Mwili” huhifadhi neno la chanzo σάρξ, huku “pia” ikibeba καί na kuunganisha kauli hii na muktadha uliotangulia.
- source_word: δοκεῖ
  choice: anadhani
  rationale: Huwasilisha kwa kawaida maana ya mtu kujiona au kufikiri kwamba ana msingi huo.
- source_word: ἄλλος
  choice: mwingine yeyote
  rationale: Pamoja na τις, usemi huu huonyesha mtu mwingine awaye yote katika ulinganisho.
- source_word: πεποιθέναι
  choice: ana sababu ya kuutumainia
  rationale: Huwasilisha hali thabiti ya kuwa na uhakika au tegemeo bila kutumia “imani,” ambalo lingeweza kuleta maana nzito ya kidini isiyokusudiwa hapa.
- source_word: μᾶλλον
  choice: mimi nina sababu zaidi
  rationale: Hukamilisha kwa Kiswahili sanifu ulinganisho mfupi wa Kigiriki, ambao kitenzi chake kimeachwa kueleweka.
theological_decisions:
- issue: Maana ya σάρξ katika Wafilipi 3:4
  choice: Kuhifadhi “mwili” katika matini kuu, huku tanbihi ikieleza maana yake ya sifa au hadhi za nje za kibinadamu.
  alternative: sifa za kibinadamu / hadhi ya nje
  rationale: Muktadha wa mistari 5–6 unataja tohara, nasaba, uhusiano na sheria, na bidii. Kwa hiyo hapa σάρξ haimaanishi hasa “asili ya dhambi,” lakini neno la chanzo linapaswa kubaki wazi katika matini kuu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Usemi “ana sababu ya kuutumainia mwili” ni wa kawaida zaidi kuliko tafsiri ngumu ya neno kwa neno, huku ukihifadhi “mwili” na mvutano wa hoja ya Paulo.
