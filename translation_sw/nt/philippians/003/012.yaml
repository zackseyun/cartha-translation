id: PHP.3.12
reference: Philippians 3:12
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Οὐχ ὅτι ἤδη ἔλαβον ἢ ἤδη τετελείωμαι, διώκω δὲ εἰ καὶ καταλάβω, ἐφ’ ᾧ καὶ κατελήμφθην ὑπὸ ⸀Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/012.yaml
  text: Not that I have already received it or have already been perfected[c][b][a], but I press on to see if I may also take hold of that for which I too was taken hold of by Christ.
translation:
  language: sw
  text: Si kwamba tayari nimekipata[a] au kwamba tayari nimekamilishwa[b]; bali ninakifuata, ili nipate kukishika kile ambacho kwa ajili yake mimi pia nilishikwa na Kristo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nimekwisha kukifikia”; Kigiriki hakitaji wazi kitu kinachopatikana, bali kinaachwa kieleweke kutokana na muktadha.
    reason: lexical_alternative
  - marker: b
    text: Au “tayari nimekuwa mkamilifu” au “tayari nimefanywa kamili.”
    reason: lexical_alternative
  - marker: c
    text: Kigiriki Christos; yaweza pia kutafsiriwa “Masihi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλαβον
  choice: nimekwisha kuipata
  rationale: Kitenzi kina kitu kisichotajwa wazi ambacho kinaeleweka kutokana na muktadha. Kiambishi cha yambwa “-i-” kinarejelea lengo hilo bila kulifafanua kupita kiasi.
- source_word: τετελείωμαι
  choice: nimekamilishwa
  rationale: 'Huhifadhi hali timilifu ya kauli tendwa: Paulo anakataa kwamba tayari amefikishwa katika hali iliyokamilika, bila kuingiza dai maalumu la kimadhehebu.'
- source_word: διώκω
  choice: ninakaza mwendo
  rationale: Ni usemi wa asili wa Kiswahili unaoonyesha juhudi inayoendelea ya kulifuata lengo; unafaa katika picha ya mwendo iliyo katika muktadha.
- source_word: καταλάβω
  choice: nipate kulishika
  rationale: Huhifadhi nguvu halisi ya ‘kushika’ na uhusiano wa kimatamshi na kaτελήμφθην baadaye katika mstari.
- source_word: ἐφ’ ᾧ
  choice: lile ambalo kwa ajili yake
  rationale: Huwasilisha tafsiri ya kusudi au lengo huku ikiacha kitu chenyewe kieleweke kutokana na muktadha.
- source_word: κατελήμφθην
  choice: nilishikwa
  rationale: Huhifadhi kauli tendwa na mchezo wa maneno kati ya kushika lengo na Paulo kushikwa.
- source_word: Χριστοῦ
  choice: Kristo
  rationale: Hili ndilo umbo la kawaida la jina/cheo hiki katika Kiswahili cha Biblia; maana ya kichwa ‘Masihi’ imeonyeshwa katika tanbihi.
theological_decisions:
- issue: Ikiwa τετελείωμαι idokeze ukamilifu usio na dhambi
  choice: nimekamilishwa
  alternative: nimekuwa mkamilifu; nimefanywa kamili
  rationale: Kigiriki kinakataa kuwa Paulo tayari amefikia hali iliyokamilika, lakini hakifafanui hali hiyo kwa kutumia mfumo wa baadaye wa kimafundisho. Tafsiri inahifadhi kauli tendwa na mvutano huo.
- issue: Maana ya ἐφ’ ᾧ
  choice: lile ambalo kwa ajili yake
  alternative: kwa sababu yake; kwa sababu hiyo
  rationale: Muundo wa Kigiriki unaweza kujadiliwa, lakini katika muktadha huu maana ya kusudi/lengo inaeleweka vizuri. Tanbihi inahifadhi uwezekano mwingine.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Ninakaza mwendo” ni lugha ya kawaida yenye nguvu inayolingana na picha ya kufuatilia lengo. Marudio ya “kulishika/nilishikwa” yamehifadhiwa makusudi ili kuakisi mchezo wa maneno wa Kigiriki.
