  text: ὃς μετασχηματίσει τὸ σῶμα τῆς ταπεινώσεως ⸀ἡμῶν σύμμορφον τῷ σώματι τῆς δόξης αὐτοῦ κατὰ τὴν ἐνέργειαν τοῦ δύνασθαι αὐτὸν καὶ ὑποτάξαι ⸀αὑτῷ τὰ πάντα.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/021.yaml
  text: who will transform our lowly body to be like the body of his glory[c][b][a], by the power that enables him even to subject all things to himself.
translation:
  language: sw
  text: ambaye ataubadilisha mwili wetu wa unyonge ufanane na mwili wake wa utukufu,[a] kwa nguvu inayomwezesha hata kuvitiisha vitu vyote chini yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa karibu zaidi: “mwili wa unyonge wetu” ... “ili ufanane kwa umbo na mwili wa utukufu wake.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: μετασχηματίσει
  choice: ataubadilisha
  rationale: Kitenzi hiki kinaonyesha badiliko halisi la umbo au hali; “ataubadilisha” ni Kiswahili cha kawaida na chenye uzito wa tendo la wakati ujao.
- source_word: τὸ σῶμα τῆς ταπεινώσεως ἡμῶν
  choice: mwili wetu wa unyonge
  rationale: Huhifadhi wazo la hali ya sasa ya udhaifu au kudhalilika kwa mwili, huku kikisomeka kwa kawaida kuliko tafsiri ya neno kwa neno “mwili wa kudhalilishwa kwetu.”
- source_word: σύμμορφον
  choice: uwe na umbo kama
  rationale: Hueleza ulinganifu wa umbo unaokusudiwa na kivumishi cha Kigiriki bila kudokeza kwamba miili hiyo itakuwa ileile kwa kila hali.
- source_word: τῷ σώματι τῆς δόξης αὐτοῦ
  choice: mwili wake wa utukufu
  rationale: Huhifadhi muundo na uzito wa kirai cha Kigiriki, ambacho ni halisi zaidi kuliko kukifupisha kuwa “mwili wake mtukufu.”
- source_word: κατὰ τὴν ἐνέργειαν
  choice: kwa nguvu
  rationale: Katika muktadha huu ἐνέργεια ni nguvu inayotenda na kuleta matokeo; “kwa nguvu” ni ya kawaida na inaunganika vizuri na uwezo unaofuatia.
- source_word: τοῦ δύνασθαι αὐτὸν
  choice: inayomwezesha
  rationale: Hutoa kwa ufasaha uhusiano kati ya nguvu inayotenda na uwezo wake, bila kubadili mhusika wa tendo.
- source_word: ὑποτάξαι αὑτῷ τὰ πάντα
  choice: kuvitiisha vitu vyote chini yake
  rationale: “Kuvitiisha” huhifadhi maana ya kuweka chini ya mamlaka, na “vitu vyote” huhifadhi upeo mpana wa τὰ πάντα.
theological_decisions:
- issue: Uhusiano kati ya unyonge wa sasa wa mwili na utukufu wa baadaye
  choice: Aya inaeleza badiliko la baadaye la mwili wetu wa sasa wa unyonge ili uwe na umbo kama mwili wake wa utukufu.
  alternative: Kutaja wazi ufufuo au kufafanua namna badiliko hilo litakavyotokea.
  rationale: Kigiriki kinathibitisha badiliko la mwili na kufananishwa kwake na mwili wake wa utukufu, lakini hapa hakielezi utaratibu wa ufufuo; tafsiri haiongezi maelezo ya kimafundisho.
- issue: Maana ya καί kabla ya ὑποτάξαι
  choice: “hata”
  alternative: “pia” au kuiacha bila neno mahsusi
  rationale: “Hata” huonyesha uzito wa uwezo huo—anaweza kuvitiisha vitu vyote—bila kuufanya kuwa tendo tofauti lisilohusiana.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo ni wa ulinganifu bora: unasomeka kwa kawaida lakini unahifadhi taswira ya mwili, umbo, utukufu, na kutiishwa kwa vitu vyote.'
