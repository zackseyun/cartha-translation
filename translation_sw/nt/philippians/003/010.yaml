base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/010.yaml
  text: to know him[a], and the power of his resurrection, and the fellowship of his sufferings, being conformed to his death[b],
translation:
  language: sw
  text: ili nimjue, na nguvu ya ufufuo wake, na kushiriki katika mateso yake[a], huku nikifananishwa na kifo chake[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na ushirika katika mateso yake.”
    reason: lexical_alternative
  - marker: b
    text: Au, “huku nikizidi kufanana na kifo chake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γνῶναι αὐτόν
  choice: ili nimjue yeye
  rationale: Kitenzi-jina cha Kigiriki kinaeleza lengo la Paulo. “Nimjue” huhifadhi maana ya kumjua kwa uhusiano na kwa uzoefu, na “yeye” huweka mkazo uliopo katika αὐτόν.
- source_word: δύναμιν
  choice: nguvu
  rationale: “Nguvu” ni tafsiri ya moja kwa moja na ya kawaida ya δύναμις, ikieleza nguvu yenye kutenda iliyodhihirishwa katika ufufuo wake.
- source_word: ἀναστάσεως
  choice: ufufuo
  rationale: “Ufufuo” ni neno sanifu na sahihi katika muktadha huu.
- source_word: κοινωνίαν
  choice: kushiriki
  rationale: Ingawa κοινωνία ni nomino, “kushiriki” ni Kiswahili cha kawaida kinachoonyesha ushiriki halisi badala ya wazo lisilo dhahiri la ushirika.
- source_word: παθημάτων αὐτοῦ
  choice: mateso yake
  rationale: Hii ni tafsiri ya moja kwa moja inayodumisha uhusiano wa mateso hayo na Kristo bila kufafanua zaidi ya maandishi.
- source_word: συμμορφιζόμενος
  choice: huku nikifananishwa
  rationale: Umbo la wakati wa sasa la kauli tendwa linaonyesha mchakato unaoendelea. “Nikifananishwa” pia huacha wazi mtendaji wa mchakato huo, kama ilivyo katika Kigiriki.
- source_word: τῷ θανάτῳ αὐτοῦ
  choice: na kifo chake
  rationale: Baada ya “nikifananishwa,” kihusishi “na” ni cha asili katika Kiswahili na hudumisha kifo chake kuwa kielelezo ambacho Paulo anafananishwa nacho.
theological_decisions:
- issue: Maana ya κοινωνίαν παθημάτων αὐτοῦ
  choice: Ushiriki halisi katika mateso yake
  alternative: Ushirika unaohusiana na mateso yake kwa maana pana zaidi
  rationale: κοινωνία katika muundo huu huonyesha kuwa na sehemu katika mateso ya Kristo, si kuyahurumia tu; hata hivyo, tanbihi huhifadhi tafsiri ya nomino iliyo karibu zaidi na muundo wa Kigiriki.
- issue: Nguvu ya kauli tendwa katika συμμορφιζόμενος
  choice: “nikifananishwa,” bila kumtaja anayefanya tendo
  alternative: “nikizidi kuwa kama yeye katika kifo chake”
  rationale: Maandishi yana kauli tendwa lakini hayamtaji mtendaji. Tafsiri haipaswi kuamua kimya-kimya ikiwa Mungu ndiye mtendaji au kueleza mchakato kwa namna nyingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa orodha ya Kigiriki umehifadhiwa, lakini “kushiriki” limetumiwa kwa ufasaha wa kawaida. “Huku” linaonyesha uhusiano wa kirai-shirikishi na yaliyotangulia bila kulazimisha uhusiano wa kimantiki ulio finyu.
