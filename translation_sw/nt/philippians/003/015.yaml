id: PHP.3.15
reference: Philippians 3:15
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὅσοι οὖν τέλειοι, τοῦτο φρονῶμεν· καὶ εἴ τι ἑτέρως φρονεῖτε, καὶ τοῦτο ὁ θεὸς ὑμῖν ἀποκαλύψει·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/015.yaml
  text: Therefore[a], all of us who are mature should think this way; and if you think differently about anything[b], God will reveal this also to you.
translation:
  language: sw
  text: Basi, sisi sote tuliokomaa[a] tuwe na mtazamo huu[b]; na ikiwa katika jambo lolote mna mtazamo tofauti, Mungu atawafunulia hilo pia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakamilifu.” Neno la Kigiriki τέλειοι linaweza kumaanisha “wakamilifu,” lakini hapa yaelekea linarejelea ukomavu wa kiroho.
    reason: lexical_alternative
  - marker: b
    text: Au, “tufikiri hivi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Basi
  rationale: Inaonyesha hitimisho linalotokana na hoja iliyotangulia kwa njia ya kawaida katika Kiswahili.
- source_word: ὅσοι
  choice: sisi sote tulio
  rationale: Inahifadhi maana jumuishi ya kundi ambalo Paulo anajihesabu kuwa sehemu yake.
- source_word: τέλειοι
  choice: wakomavu
  rationale: Katika muktadha huu neno linaelekea kumaanisha waliokomaa kiroho, huku maana halisi inayowezekana ya ‘wakamilifu’ ikihifadhiwa katika tanbihi.
- source_word: τοῦτο φρονῶμεν
  choice: tuwe na mtazamo huu
  rationale: Kauli hii inarejelea namna ya kufikiri iliyoelezwa katika mistari iliyotangulia; umbo la ‘tuwe’ linahifadhi himizo la nafsi ya kwanza wingi.
- source_word: εἴ τι ἑτέρως φρονεῖτε
  choice: ikiwa katika jambo lolote mna mtazamo tofauti
  rationale: Inahifadhi sharti, upeo usiofungwa wa τι, na tofauti ya namna ya kufikiri bila kubainisha jambo ambalo Kigiriki hakilibainishi.
- source_word: ἀποκαλύψει
  choice: atawafunulia
  rationale: Ni kisawe cha moja kwa moja kinachohifadhi wazo la Mungu kufanya jambo hilo lijulikane kwao.
- source_word: καὶ τοῦτο
  choice: hilo pia
  rationale: Inahifadhi msisitizo wa ‘pia’ na kurejelea jambo ambalo wana mtazamo tofauti juu yake.
theological_decisions:
- issue: Maana ya τέλειοι katika himizo la Paulo
  choice: wakomavu
  alternative: wakamilifu
  rationale: Muktadha wa karibu unaonyesha kwamba Paulo bado anajitahidi kufikia lengo, kwa hiyo ‘wakomavu’ hutoa maana inayofaa zaidi bila kufuta uwezekano wa kimsamiati wa ‘wakamilifu,’ ambao umeonyeshwa katika tanbihi.
- issue: Nguvu ya φρονῶμεν
  choice: tuwe na mtazamo huu
  alternative: tufikiri hivi
  rationale: Umbo la Kigiriki ni himizo linalomjumuisha Paulo pamoja na wasomaji. Tafsiri hii inalinda ushirika huo na kuonyesha kwamba φρονέω huhusu fikra na mwelekeo wa ndani, si tendo la kiakili pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. ‘Mtazamo’ ni neno linaloeleweka kwa upana na linawasilisha fikra pamoja na mwelekeo wa ndani. Sentensi imehifadhi tofauti kati ya ‘sisi’ katika himizo la kwanza na ‘ninyi’ katika sharti linalofuata.
