  text: Ἀλλὰ ἅτινα ἦν μοι κέρδη, ταῦτα ἥγημαι διὰ τὸν Χριστὸν ζημίαν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/007.yaml
  text: But whatever things were gains to me[b][a], these I have considered loss because of Messiah.
translation:
  language: sw
  text: Lakini mambo yo yote yaliyokuwa faida kwangu, hayo nimeyahesabu[b] kuwa hasara kwa sababu ya Masihi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa sababu ya Kristo.”
    reason: lexical_alternative
  - marker: b
    text: Au “nimeyazingatia kuwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀλλὰ
  choice: Lakini
  rationale: Inaonyesha kwa uwazi ugeuko mkali kutoka katika mambo yaliyotangulia ambayo Paulo angeweza kuyategemea.
- source_word: ἅτινα
  choice: mambo yote yaliyokuwa
  rationale: Inarejelea kwa ujumla manufaa yote ambayo Paulo ametoka kuyaorodhesha, bila kuyafupisha kuwa jambo moja.
- source_word: κέρδη
  choice: faida
  rationale: Neno hili linadumisha taswira ya mahesabu na linatofautishwa moja kwa moja na ‘hasara.’
- source_word: ἥγημαι
  choice: nimeyaona kuwa
  rationale: Kauli ya wakati timilifu inaonyesha tathmini iliyofanywa na ambayo matokeo yake yanaendelea; usemi huu ni wa kawaida na wazi katika Kiswahili.
- source_word: διὰ τὸν Χριστόν
  choice: kwa sababu ya Masihi
  rationale: διά pamoja na hali ya kushutumiwa hapa inaeleza sababu; ‘Masihi’ hutafsiri maana ya cheo Χριστός.
- source_word: ζημίαν
  choice: hasara
  rationale: Linahifadhi ulinganisho wa kimahesabu kati ya faida za awali na hasara moja inayojumuisha yote.
theological_decisions:
- issue: Tafsiri ya Χριστόν
  choice: Masihi
  alternative: Kristo
  rationale: Katika muktadha huu Χριστός inaeleweka kama cheo; ‘Masihi’ huwasilisha maana ya cheo hicho, huku tanbihi ikitaja umbo la jadi ‘Kristo.’
- issue: Maana ya διὰ τὸν Χριστόν
  choice: kwa sababu ya Masihi
  alternative: kwa ajili ya Masihi
  rationale: Muundo wa διά pamoja na accusative unaweza kugusa sababu au kusudi/manufaa; matini kuu inaweka maana ya sababu iliyo wazi zaidi hapa, bila kudai kuwa usemi mbadala hauwezekani.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ‘faida—hasara’ unahifadhi sitiari ya mahesabu, na kiwakilishi ‘hayo’ kinawakilisha ταῦτα kwa msisitizo.
