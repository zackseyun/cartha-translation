  text: ἀδελφοί, ἐγὼ ἐμαυτὸν ⸀οὐ λογίζομαι κατειληφέναι· ἓν δέ, τὰ μὲν ὀπίσω ἐπιλανθανόμενος τοῖς δὲ ἔμπροσθεν ἐπεκτεινόμενος,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/013.yaml
  text: 'Brothers[a], I do not consider myself to have taken hold of it. But one thing: forgetting the things behind and reaching forward to the things ahead,'
translation:
  language: sw
  text: 'Ndugu[a], mimi sijidhanii kuwa nimekwisha kulishika. Lakini jambo moja: nikiyasahau yaliyo nyuma na kujinyoosha kuelekea yaliyo mbele,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki lililotafsiriwa “Ndugu” lina umbo la kiume, lakini mara nyingi Paulo hulitumia kulihutubia kundi lote la waamini, wakiwemo wanawake.
    reason: cultural_note
lexical_decisions:
- source_word: ἀδελφοί
  choice: Ndugu
  rationale: “Ndugu” ni mwito wa kawaida na wenye heshima katika Kiswahili; unaweza kulihusu kundi lote la waamini. Tanbihi inaeleza umbo la kiume la neno la Kigiriki bila kulazimisha maana finyu katika matini kuu.
- source_word: λογίζομαι
  choice: sijioni
  rationale: Katika kauli ya mtu kujitathmini, “sijioni” huwasilisha maana ya kujihesabu au kujifikiria kwa Kiswahili cha kawaida na cha sasa.
- source_word: κατειληφέναι
  choice: kuwa nimekwisha kulishika
  rationale: “Kulishika” inadumisha sitiari ya kukamata au kupata kitu iliyotumiwa katika mstari wa 12. Kiambishi cha yambwa “-li-” kinawakilisha kitu kinachoeleweka kutokana na muktadha bila kukitaja wazi zaidi kuliko Kigiriki.
- source_word: ἓν δέ
  choice: Lakini jambo moja
  rationale: Tafsiri hii inadumisha usemi mfupi usio na kitenzi katika Kigiriki, badala ya kuongeza “ninalofanya.”
- source_word: τὰ μὲν ὀπίσω
  choice: yaliyo nyuma
  rationale: Huhifadhi wingi na picha ya mambo yaliyoachwa nyuma kwa lugha fupi na ya kawaida.
- source_word: ἐπιλανθανόμενος
  choice: nikiyasahau
  rationale: Hii ndiyo maana ya moja kwa moja ya kitenzi na inadumisha mtiririko wa kishirikishi katika sentensi.
- source_word: τοῖς δὲ ἔμπροσθεν
  choice: yaliyo mbele
  rationale: Huhifadhi ulinganifu na “yaliyo nyuma” pamoja na mwelekeo wa picha ya kusonga mbele.
- source_word: ἐπεκτεινόμενος
  choice: kujinyoosha kuelekea
  rationale: Kauli hii huonyesha tendo la kujitanua mbele kuelekea kitu bila kuongeza kwa lazima wazo la kujikaza sana.
theological_decisions:
- issue: Yambwa lisilotajwa la κατειληφέναι
  choice: Limedokezwa kwa kiambishi “-li-” katika “kulishika,” bila kutajwa kwa jina.
  alternative: Kulifafanua kuwa “lengo,” “ukamilifu,” au “tuzo.”
  rationale: Kigiriki hakitaji yambwa waziwazi. Kulipa jina kungeamua mapema jambo ambalo muktadha unaliacha lidokezwe na kungeweza kufinya mvutano wa kifungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo mfupi wa “Lakini jambo moja” na taswira ya kushika, yaliyo nyuma, na kujinyoosha mbele zimehifadhiwa.
