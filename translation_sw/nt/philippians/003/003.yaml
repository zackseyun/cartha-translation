  yaml_path: translation/nt/philippians/003/003.yaml
  text: For we are the circumcision[a], who worship by the Spirit of God and boast in Messiah Jesus and put no confidence in the flesh[c][b],
translation:
  language: sw
  text: Kwa maana sisi ndio tohara, sisi tunaomwabudu Mungu kwa Roho wa Mungu[a], tunaojisifia katika Masihi Yesu[b], wala hatuweki tumaini letu katika mwili[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Baadhi ya nakala za kale husoma: “tunaomwabudu Mungu katika roho.”'
    reason: textual_variant
  - marker: b
    text: “Masihi” ni tafsiri ya cheo cha Kigiriki Christos, ambacho pia huandikwa “Kristo.”
    reason: lexical_alternative
  - marker: c
    text: “Mwili” hapa unahusu sifa za kimwili au za kibinadamu zinazoweza kuwa msingi wa kutumaini, kama tohara au hadhi.
    reason: cultural_note
lexical_decisions:
- source_word: περιτομή
  choice: tohara
  rationale: Neno halisi la agano limehifadhiwa ili kubakiza dai lenye msisitizo la Paulo kwamba waamini ndio tohara, si kufafanua mapema kuwa ni ‘waliotahiriwa kweli.’
- source_word: πνεύματι θεοῦ
  choice: kwa Roho wake
  rationale: Katika usomaji wa SBLGNT, θεοῦ inaelekeza kwa Roho wa Mungu; ‘kwa Roho wake’ ni Kiswahili cha kawaida kinachoonyesha njia au uwezo wa ibada bila kurudia ‘Mungu’ kwa uzito usio wa lazima.
- source_word: λατρεύοντες
  choice: tunaomwabudu Mungu
  rationale: Kitenzi kinaonyesha huduma ya kidini au ibada; ‘kumwabudu Mungu’ ni usemi wa kawaida na wenye heshima katika Kiswahili.
- source_word: καυχώμενοι
  choice: tunaojisifia
  rationale: ‘Kujisifia’ huhifadhi ukali wa utofautishaji wa Paulo kuhusu msingi wa fahari au kutumaini, badala ya kuifanya iwe ‘kufurahi’ tu.
- source_word: Χριστῷ
  choice: Masihi
  rationale: Χριστός limetafsiriwa kama cheo ‘Masihi,’ huku tanbihi ikifafanua uhusiano wake na ‘Kristo.’
- source_word: σαρκί
  choice: mwili
  rationale: ‘Mwili’ huhifadhi mwingiliano wa maana halisi na ya mfano; katika muktadha huu linahusu hasa sifa za kimwili au za kibinadamu zinazoweza kutegemewa.
- source_word: πεποιθότες
  choice: hatuutumainii
  rationale: Muundo huu unaonyesha hali thabiti ya kutoweka tumaini au utegemezi katika mwili.
- source_word: γάρ
  choice: Kwa maana
  rationale: Huonyesha wazi kwamba sentensi hii inatoa sababu au maelezo ya onyo lililotangulia.
theological_decisions:
- issue: Maana ya σάρξ katika mstari huu
  choice: ‘Mwili’ unahusu hasa misingi ya kimwili na ya kibinadamu ya kutumainiwa, kama tohara, nasaba, hadhi na sifa za kidini.
  alternative: Asili ya dhambi kama kanuni ya ndani ya maadili.
  rationale: Muktadha unaofuata mara moja unaorodhesha tohara, ukoo, uhusiano na sheria, na hadhi; kwa hiyo maana ya sifa za kibinadamu ina uzito hapa, huku neno ‘mwili’ likihifadhi upana wa istilahi.
- issue: Nguvu ya πνεύματι θεοῦ
  choice: Roho wa Mungu ndiye njia au uwezo ambao kwa huo ibada hutolewa.
  alternative: Roho ya mwanadamu, au kumwabudu Mungu kwa namna ya kiroho.
  rationale: Usomaji wa SBLGNT wenye θεοῦ unaelekeza kwa Roho wa Mungu, ingawa tofauti ya maandishi imeelezwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa aya umewekwa wa moja kwa moja na wa kawaida; istilahi za agano ‘tohara,’ ‘Roho,’ ‘Masihi,’ na ‘mwili’ zimehifadhiwa, huku tanbihi zikieleza tofauti ya maandishi na maana za muktadha.
