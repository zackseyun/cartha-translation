  text: ikiwa kwa namna fulani nitaweza kuufikia ufufuo kutoka miongoni mwa wafu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya karibu zaidi na maneno ya Kigiriki, “ufufuo wa kutoka miongoni mwa wafu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ πως
  choice: ikiwa kwa namna fulani
  rationale: Huhifadhi hali ya masharti na kutokuwa na uhakika kuhusu namna ya kuufikia lengo, bila kudokeza moja kwa moja kwamba Paulo anatilia shaka ahadi ya Mungu.
- source_word: καταντήσω
  choice: nitaufikia
  rationale: Kitenzi hiki hapa kina maana ya kufika kwenye lengo. ‘Nitaufikia’ ni Kiswahili cha kawaida kinachofaa baada ya kishazi cha masharti ‘ikiwa’.
- source_word: εἰς
  choice: -fikia
  rationale: Katika Kiswahili, mwelekeo unaoonyeshwa na εἰς umejumuishwa kwa kawaida katika kitenzi ‘kuufikia’; kuongeza kihusishi kungefanya sentensi isiwe ya asili.
- source_word: ἐξανάστασιν
  choice: ufufuo
  rationale: Neno hili linamaanisha kufufuka. ‘Ufufuo’ ni istilahi iliyo wazi na ya kawaida; tafsiri ya kimuundo kama ‘ufufuo wa kutoka nje’ ingekuwa ngumu kueleweka.
- source_word: τὴν ἐκ νεκρῶν
  choice: kutoka kwa wafu
  rationale: Hii ni tafsiri ya asili na iliyo wazi ya wazo la kutoka katika hali au kundi la wafu. Maana iliyo wazi zaidi ya ‘kutoka miongoni mwa wafu’ imehifadhiwa katika tanbihi.
theological_decisions:
- issue: Iwapo ἐξανάστασις litafsiriwe kwa namna inayolitofautisha sana na ἀνάστασις ya kawaida na hivyo kudokeza ufufuo wa pekee.
  choice: ufufuo kutoka kwa wafu
  alternative: ufufuo wa kutoka miongoni mwa wafu
  rationale: Muundo usio wa kawaida wa neno la Kigiriki unaweza kusisitiza kutoka miongoni mwa wafu, lakini haulazimishi kubuni istilahi mpya ya Kiswahili wala kuamua kwamba hapa pana aina tofauti ya ufufuo. Tafsiri kuu inabaki wazi na ya kawaida, huku tanbihi ikihifadhi msisitizo unaowezekana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa masharti umehifadhiwa, na ‘ufufuo’ umetumiwa badala ya istilahi ya kale au inayoweza kuwa na mahusiano mengine ya kidini.
