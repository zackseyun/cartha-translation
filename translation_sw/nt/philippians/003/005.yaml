  text: περιτομῇ ὀκταήμερος, ἐκ γένους Ἰσραήλ, φυλῆς Βενιαμίν, Ἑβραῖος ἐξ Ἑβραίων, κατὰ νόμον Φαρισαῖος,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/005.yaml
  text: circumcised on the eighth day, from the people of Israel, of the tribe of Benjamin, a Hebrew from Hebrews; according to the law, a Pharisee,
translation:
  language: sw
  text: niliyetahiriwa siku ya nane, wa uzao wa Israeli, wa kabila la Benyamini, Mwebrania wa Waebrania[a]; kwa habari ya Sheria, Mfarisayo,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mwebrania aliyezaliwa na Waebrania,” ikisisitiza nasaba na utambulisho wa Kiebrania wa Paulo.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιτομῇ ὀκταήμερος
  choice: nilitahiriwa siku ya nane
  rationale: Muundo huu wa Kiswahili unaeleza kwa kawaida usemi wa Kigiriki uliobanwa na kuhifadhi wakati maalumu wa tohara katika desturi ya agano la Kiyahudi.
- source_word: ἐκ γένους Ἰσραήλ
  choice: mimi ni wa uzao wa Israeli
  rationale: Neno γένος hapa linahusu asili ya kikabila au nasaba. “Wa uzao wa Israeli” ni la asili katika Kiswahili na linaonyesha dai la Paulo kuhusu asili yake ya Kiisraeli.
- source_word: φυλῆς Βενιαμίν
  choice: wa kabila la Benyamini
  rationale: Kirai hiki kinabainisha nasaba ya kikabila kwa lugha iliyo wazi na iliyozoeleka katika Kiswahili cha Biblia.
- source_word: Ἑβραῖος ἐξ Ἑβραίων
  choice: Mwebrania wa Waebrania
  rationale: Tafsiri hii inahifadhi ufupi, msisitizo, na muundo wa kirai cha Kigiriki bila kufafanua kupita kiasi ikiwa kinarejelea hasa wazazi, nasaba, lugha, au utambulisho mpana wa Kiebrania.
- source_word: κατὰ νόμον
  choice: kwa habari ya Sheria
  rationale: Hapa κατά linaanzisha kipengele cha kujitambulisha kwa kuzingatia Sheria; usemi huu ni wa kawaida na wazi katika Kiswahili huku ukihifadhi uhusiano huo.
- source_word: Φαρισαῖος
  choice: Farisayo
  rationale: Hili ndilo jina la Kiswahili lililozoeleka kwa mshiriki wa kundi hili la Kiyahudi.
theological_decisions:
- issue: Maana pana ya Ἑβραῖος ἐξ Ἑβραίων
  choice: Mwebrania wa Waebrania
  alternative: Mwebrania aliyezaliwa na Waebrania
  rationale: Maandishi hayataji wazi kuzaliwa pekee; tafsiri kuu inahifadhi uwezekano wa kusisitiza nasaba pamoja na utambulisho wa Kiebrania, na ufafanuzi maalumu zaidi umewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Msururu wa sifa umehifadhiwa kama katika muktadha wa orodha ya Paulo; “Sheria” imeandikwa kwa herufi kubwa kuonyesha Torati ya Kiyahudi katika muktadha huu.
