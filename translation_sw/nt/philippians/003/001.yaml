lexical_decisions:
- source_word: Τὸ λοιπόν
  choice: Hatimaye
  rationale: Ni kiashiria cha mpito katika mazungumzo. “Hatimaye” ni Kiswahili cha kawaida na cha asili, huku tanbihi ikihifadhi maana nyingine zinazowezekana.
- source_word: ἀδελφοί μου
  choice: ndugu zangu
  rationale: “Ndugu” ni neno la kawaida la Kiswahili linaloweza kuzungumzia waumini wa kiume na wa kike kwa pamoja bila kupoteza dhana ya undugu wa jumuiya.
- source_word: χαίρετε
  choice: furahini
  rationale: Kitenzi cha amri cha wingi kinahifadhi wito wa Paulo wa kuwa na furaha, si taarifa tu kuhusu hisia.
- source_word: ἐν κυρίῳ
  choice: katika Bwana
  rationale: Muundo huu unahifadhi usemi wa Paulo unaoweka furaha katika uhusiano na Bwana bila kufafanua kupita kiasi aina ya uhusiano huo.
- source_word: τὰ αὐτά
  choice: mambo yale yale
  rationale: Tafsiri hii inaacha rejeleo likiwa pana kama lilivyo katika Kigiriki—huenda ni maonyo yaliyotangulia au mafundisho ya awali kwa ujumla.
- source_word: γράφειν
  choice: kuwaandikia
  rationale: Kiambishi cha mtendewa “-wa-” kinaonyesha kwa kawaida katika Kiswahili kwamba Paulo anawaandikia wao, kulingana na ὑμῖν.
- source_word: οὐκ ὀκνηρόν
  choice: si taabu kwangu
  rationale: Usemi huu wa kawaida unaonyesha kwamba kurudia kuandika hakumlemei wala hakumfanyi Paulo asite, bila kuubana maana kuwa kuchoshwa pekee.
- source_word: ἀσφαλές
  choice: ni kwa usalama wenu
  rationale: Inahifadhi maana ya msingi ya usalama na ulinzi bila kuingiza moja kwa moja sitiari ya “kinga” katika matini kuu.
theological_decisions:
- issue: Jina la kuwaita waumini wote
  choice: ndugu zangu
  alternative: ndugu zangu wa kiume na wa kike
  rationale: ἀδελφοί ni wingi wa kisarufi wa kiume, lakini hapa Paulo analiambia kusanyiko lote. “Ndugu” katika Kiswahili linaweza kujumuisha wote kwa asili; tanbihi inaweka wazi upeo huo.
- issue: Maana ya kurudia kuandika kuwa ulinzi
  choice: ni kwa usalama wenu
  alternative: ni kinga kwenu
  rationale: Matini kuu inadumisha maana ya moja kwa moja ya kivumishi ἀσφαλές, huku tanbihi ikionyesha uwezekano wa kueleza kazi yake ya kulinda kwa neno “kinga”.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Bwana” linahifadhi istilahi ya kawaida ya kibiblia, na kiunganishi “bali” kinaonyesha tofauti ya μὲν…δέ kwa uwazi.
