reference: Philippians 3:19
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὧν τὸ τέλος ἀπώλεια, ὧν ὁ θεὸς ἡ κοιλία καὶ ἡ δόξα ἐν τῇ αἰσχύνῃ αὐτῶν, οἱ τὰ ἐπίγεια φρονοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/019.yaml
  text: Their end is destruction[a], their god is the belly[b], and their glory is in their shame—their minds are set on earthly things.
translation:
  language: sw
  text: Mwisho wao ni maangamizi, mungu wao ni tumbo lao[a], na utukufu wao umo katika aibu yao—wao huyawaza mambo ya duniani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mungu wao ni tamaa yao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τέλος
  choice: mwisho
  rationale: Neno hili linadumisha ufupi wa Kigiriki na linaweza kumaanisha mwisho pamoja na matokeo ya mwisho.
- source_word: ἀπώλεια
  choice: maangamizi
  rationale: Linawasilisha kwa lugha ya sasa uzito wa uharibifu wa mwisho unaokusudiwa hapa.
- source_word: κοιλία
  choice: tumbo
  rationale: Linahifadhi sitiari halisi na yenye nguvu ya Kigiriki badala ya kuifasiri moja kwa moja kuwa tamaa.
- source_word: δόξα
  choice: utukufu
  rationale: Ni kisawe cha moja kwa moja kinachohifadhi kejeli ya kuona kinachoaibisha kuwa jambo la utukufu.
- source_word: αἰσχύνη
  choice: aibu
  rationale: Ni neno fupi na la kawaida linalobeba maana ya fedheha na hali ya kuaibisha.
- source_word: τὰ ἐπίγεια
  choice: mambo ya duniani
  rationale: Ni usemi wa kawaida wa Kiswahili unaokaribia wingi wa Kigiriki bila kuubana kwa tafsiri ya kimadhehebu.
- source_word: φρονοῦντες
  choice: huyawaza
  rationale: Huonyesha mwelekeo wa mawazo unaoendelea, si tendo la muda mfupi tu.
- source_word: ὧν ... ὧν
  choice: wao ... wao
  rationale: Muundo huu unarejelea watu waliotajwa katika mstari uliotangulia na kwa Kiswahili unaendelea kwa viwakilishi milikishi vyao.
theological_decisions:
- issue: Nguvu ya kisitiari ya usemi “mungu wao ni tumbo”
  choice: Sitiari halisi “tumbo” imehifadhiwa katika matini kuu.
  alternative: mungu wao ni tamaa yao
  rationale: Kigiriki kinatumia kiungo cha mwili kama sitiari yenye nguvu ya tamaa au kujitumikia. Kukihifadhi huepuka kuamua mapema maana yake kwa ufafanuzi mmoja tu.
- issue: Maana ya “utukufu wao umo katika aibu yao”
  choice: Muundo wa moja kwa moja wenye “utukufu” na “aibu” umehifadhiwa.
  alternative: wanajivunia mambo yao ya aibu
  rationale: Tafsiri ya moja kwa moja inadumisha kejeli na mvutano wa kauli ya Paulo; mbadala unaeleweka lakini unafasiri δόξα kuwa kujivunia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inadumisha mfululizo mkali wa maelezo ya Kigiriki na sitiari zake, huku kifungu cha mwisho kikitumia “huyawaza” kuonyesha mwelekeo wa kudumu wa fikira.
