id: PHP.3.8
reference: Philippians 3:8
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀλλὰ ⸀μενοῦνγε καὶ ἡγοῦμαι πάντα ζημίαν εἶναι διὰ τὸ ὑπερέχον τῆς γνώσεως Χριστοῦ Ἰησοῦ τοῦ κυρίου μου δι’ ὃν τὰ πάντα ἐζημιώθην, καὶ ἡγοῦμαι ⸀σκύβαλα ἵνα Χριστὸν κερδήσω
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/008.yaml
  text: More than that[a], I consider all things to be loss because of the surpassing value of the knowledge of Messiah Jesus my Lord, for whose sake I have suffered the loss of all things and consider them rubbish[c][b], so that I may gain Messiah.
translation:
  language: sw
  text: Zaidi ya hayo, ninahesabu mambo yote kuwa hasara kwa sababu ya ubora usio na kifani wa kumjua Masihi Yesu, Bwana wangu. Kwa ajili yake nimepata hasara ya mambo yote, nami ninayahesabu kuwa takataka[a], ili nimpate Masihi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Takataka” hutafsiri neno kali linaloweza pia kumaanisha mabaki ya kutupwa au kinyesi.
    reason: lexical_alternative
  - marker: b
    text: “Masihi” inaweza pia kutafsiriwa “Kristo.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ μενοῦνγε καὶ
  choice: Zaidi ya hayo
  rationale: Kirai hiki kinaendeleza na kusisitiza hoja ya Paulo; tafsiri hii ni ya kawaida na yenye nguvu katika Kiswahili.
- source_word: ἡγοῦμαι
  choice: ninahesabu
  rationale: Kitenzi kinaonyesha tathmini ya makusudi na pia kinadumisha taswira ya faida na hasara katika mstari huu.
- source_word: πάντα / τὰ πάντα
  choice: mambo yote
  rationale: Huhifadhi upeo mpana wa maneno ya Kigiriki bila kuongeza kitu kisichokuwamo.
- source_word: ζημίαν
  choice: hasara
  rationale: Ni neno la kawaida la Kiswahili linalofaa taswira ya uhasibu ya faida na hasara.
- source_word: διὰ τὸ ὑπερέχον τῆς γνώσεως
  choice: kwa sababu ya ubora usio na kifani wa kumjua
  rationale: Huwasilisha thamani kuu ya γνώσις kwa Kiswahili cha asili; 'kumjua' pia huhifadhi mwelekeo wa kibinafsi wa kumjua Yesu.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Masihi Yesu
  rationale: Χριστός hapa inabaki na uzito wa cheo, hivyo 'Masihi' hutafsiri maana yake badala ya kuitoholeza tu.
- source_word: τοῦ κυρίου μου
  choice: Bwana wangu
  rationale: Huhifadhi umilikishi na uzito wa neno κύριος katika kauli ya Paulo.
- source_word: δι’ ὃν
  choice: Kwa ajili yake
  rationale: 'Hutoa kwa ufupi sababu inayomlenga mtu: hasara hiyo imepatikana kwa ajili ya Yesu.'
- source_word: ἐζημιώθην
  choice: nimepata hasara
  rationale: Huhifadhi wazo la kupata au kukumbwa na hasara, huku wakati timilifu wa Kiswahili ukionyesha matokeo yanayoendelea.
- source_word: σκύβαλα
  choice: takataka
  rationale: Ni neno kali lakini linaloeleweka kwa kawaida kwa vitu vya kutupwa; uwezekano wa maana chafu zaidi umewekwa katika tanbihi.
- source_word: ἵνα Χριστὸν κερδήσω
  choice: ili nimpate Masihi
  rationale: '''Ili'' huonyesha kusudi, na ''nimpate'' hudumisha taswira ya kupata faida huku kiambishi cha nafsi kikionyesha kwamba anayepatikana ni mtu.'
theological_decisions:
- issue: Tafsiri ya Χριστός katika matumizi ya Paulo
  choice: Masihi
  alternative: Kristo
  rationale: Katika mstari huu neno linaendelea kufanya kazi kama cheo chenye maana. Njia ya jadi 'Kristo' imehifadhiwa katika tanbihi bila kulazimisha msimamo wa kimadhehebu.
- issue: Maana ya γνώσεως
  choice: kumjua
  alternative: ujuzi wa / maarifa ya
  rationale: '''Kumjua'' ni Kiswahili cha asili na kinaweza kuonyesha ujuzi wa kibinafsi bila kuondoa uwezekano wa maana ya maarifa; ujenzi wa Kigiriki umeelezwa kupitia ''ubora ... wa kumjua''.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imegawanywa mara mbili ili isomeke kwa urahisi, bila kuvunja mtiririko wa hoja. Taswira ya hasara na kupata imehifadhiwa, na lugha haijaongezewa ufafanuzi wa kimadhehebu.
source_grounding:
  english_pob_role: consult_only
