translation:
  language: sw
  text: Jihadharini na mbwa; jihadharini na wafanyakazi waovu; jihadharini na ukataji wa mwili.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Paulo anatumia “ukataji wa mwili” kama neno kali la kejeli linalotofautishwa na “tohara” katika mstari unaofuata. Kigiriki kina nomino inayodokeza ukataji unaoharibu mwili.
    reason: cross_reference
lexical_decisions:
- source_word: Βλέπετε
  choice: Jihadharini na
  rationale: Kitenzi cha amri katika wakati wa sasa kimerudiwa mara tatu na kutoa onyo la haraka. “Jihadharini na” ni Kiswahili cha kawaida na chenye hadhi, na marudio yake yanahifadhi msisitizo wa Kigiriki.
- source_word: τοὺς κύνας
  choice: mbwa
  rationale: Taswira halisi na kali ya Paulo imehifadhiwa bila kuongeza kivumishi cha ufafanuzi ambacho hakipo katika Kigiriki.
- source_word: τοὺς κακοὺς ἐργάτας
  choice: watenda maovu
  rationale: Kauli hii inahifadhi maana ya watu wanaofanya kazi au matendo yenye ubaya wa kimaadili, huku ikisikika kwa kawaida katika Kiswahili cha sasa.
- source_word: τὴν κατατομήν
  choice: ukeketaji
  rationale: Neno hili hutaja kukata au kuharibu mwili na kuhifadhi dhihaka kali dhidi ya “tohara” (περιτομή) katika mstari unaofuata. Nomino dhahania imehifadhiwa badala ya kubadilishwa moja kwa moja kuwa jina la watu.
theological_decisions:
- issue: Jinsi ya kutafsiri κατατομήν kuhusiana na lugha ya tohara katika muktadha
  choice: ukeketaji
  alternative: wakataji; tohara ya uongo; kukata
  rationale: Paulo hatumii neno la kawaida la “tohara,” bali neno la dhihaka linalodokeza kukata kunakoharibu. “Ukeketaji” huhifadhi ukali na mchezo wa maneno bila kuongeza madai ya kitheolojia yasiyotajwa wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa “Jihadharini na” umerudiwa mara tatu ili kudumisha mdundo na msisitizo wa onyo la Kigiriki. Alama ya tanbihi [a] imewekwa baada ya “ukeketaji,” ambako maelezo yake yanahusika moja kwa moja.
