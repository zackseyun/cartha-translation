  text: κατὰ ⸀ζῆλος διώκων τὴν ἐκκλησίαν, κατὰ δικαιοσύνην τὴν ἐν νόμῳ γενόμενος ἄμεμπτος.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/006.yaml
  text: as to zeal[a], persecuting the church; as to righteousness under the law[b], having become blameless.
translation:
  language: sw
  text: kwa habari ya bidii, nikilitesa kanisa; kwa habari ya haki iliyo katika Sheria, niliyepatikana bila lawama.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατὰ
  choice: kwa habari ya
  rationale: Kirai hiki kinatanguliza kipimo au eneo linalozungumziwa na kinahifadhi urudiaji wa muundo wa Paulo kwa Kiswahili cha kawaida.
- source_word: ζῆλος
  choice: bidii
  rationale: “Bidii” linaonyesha ari kubwa ya kidini katika maisha ya zamani ya Paulo bila kuamua kama ari hiyo ilikuwa njema.
- source_word: διώκων
  choice: nikilitesa
  rationale: Katika muktadha huu kitenzi kinamaanisha kutenda kwa uhasama dhidi ya jumuiya ya waamini, si kufuatilia tu.
- source_word: ἐκκλησίαν
  choice: kanisa
  rationale: Hapa neno linamaanisha jumuiya ya waamini wa Kristo; “kanisa” ndilo neno la kawaida na linaloeleweka wazi katika Kiswahili.
- source_word: δικαιοσύνην
  choice: haki
  rationale: “Haki” linaweza kuonyesha hali ya kuwa sawa au mwadilifu kwa kipimo kinachotajwa, huku likihifadhi upana wa maana ya δικαιοσύνη bila kulazimisha tafsiri finyu.
- source_word: ἐν νόμῳ
  choice: iliyo katika Sheria
  rationale: Tafsiri hii inakaribia muundo wa Kigiriki “katika sheria” na inaonyesha kwamba haki inayodaiwa inafafanuliwa ndani ya nyanja au kipimo cha Sheria.
- source_word: γενόμενος
  choice: nikawa
  rationale: “Nikawa” linahifadhi wazo la kitenzi la kufikia au kuwa katika hali hiyo, badala ya kulifanya ἄμεμπτος kuwa kivumishi kisicho na tendo.
- source_word: ἄμεμπτος
  choice: asiye na lawama
  rationale: Kirai hiki huonyesha kutopatikana na shtaka kwa kipimo kilichotajwa, bila kudokeza kutokuwa na dhambi kabisa.
theological_decisions:
- issue: Upeo wa dai la Paulo kwamba hakuwa na lawama
  choice: Dai hilo linahusu haki iliyo katika Sheria, yaani tathmini kwa kipimo hicho.
  alternative: Paulo anadai kwamba hakuwa na dhambi yoyote kabisa mbele za Mungu.
  rationale: Kisarufi, ἄμεμπτος linaunganishwa na δικαιοσύνη τὴν ἐν νόμῳ. Kwa hiyo maneno hayo yanaeleza hali yake ya zamani kwa kipimo cha Sheria, si dai lisilo na mpaka la ukamilifu wa maadili.
- issue: Tathmini ya bidii ya Paulo
  choice: Neno “bidii” limeachwa na mvutano wake, huku tendo lenyewe likitajwa kuwa kulitesa kanisa.
  alternative: Kutafsiri ζῆλος kwa neno linaloisifu au kuilaumu ari hiyo moja kwa moja.
  rationale: Andiko linaonyesha ukubwa wa ari yake lakini pia linaweka wazi matokeo yake mabaya; tafsiri haipaswi kutatua mvutano huo kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo unaorudiwa “kwa habari ya” umehifadhi mpangilio wa hoja, na neno “Sheria” limeandikwa kwa herufi kubwa kwa kuwa linarejelea Sheria ya Musa katika muktadha huu.
