  text: ἡμῶν γὰρ τὸ πολίτευμα ἐν οὐρανοῖς ὑπάρχει, ἐξ οὗ καὶ σωτῆρα ἀπεκδεχόμεθα κύριον Ἰησοῦν Χριστόν,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/020.yaml
  text: For our citizenship is in heaven[a], from where we also eagerly await a Savior[d][c][b], the Lord Jesus the Messiah.
translation:
  language: sw
  text: Kwa maana uraia wetu[a] uko mbinguni[b], na kutoka huko pia tunamngojea kwa hamu Mwokozi, Bwana Yesu Masihi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “jumuiya yetu ya kiraia.”
    reason: lexical_alternative
  - marker: b
    text: Kwa neno halisi, “katika mbingu.”
    reason: lexical_alternative
  - marker: c
    text: Au “Bwana Yesu Kristo.”
    reason: alternative_reading
lexical_decisions:
- source_word: πολίτευμα
  choice: uraia
  rationale: Neno hili lina nguvu ya kiraia na kisiasa, likieleza mahali waamini wanapopata utambulisho na haki zao za msingi. “Uraia” ni wazi na wa kawaida katika Kiswahili cha sasa bila kulifanya neno hilo limaanishe tu mahali pa kuishi.
- source_word: ἐν οὐρανοῖς
  choice: mbinguni
  rationale: Ingawa Kigiriki kina umbo la wingi, “mbinguni” ndiyo njia ya kawaida na ya asili katika Kiswahili ya kutaja makao ya mbinguni.
- source_word: ὑπάρχει
  choice: uko
  rationale: “Uko” huonyesha kuwapo kwa sasa kwa uraia huo na kupatana kisarufi na mahali panapotajwa.
- source_word: ἐξ οὗ
  choice: kutoka huko
  rationale: Kirai hiki kinarejelea mbinguni kama mahali ambako Mwokozi atatoka. “Kutoka huko” huhifadhi maana ya mahali kwa Kiswahili cha kawaida.
- source_word: σωτῆρα
  choice: Mwokozi
  rationale: “Mwokozi” ni neno la kawaida la Kibiblia na la Kiswahili linalobeba maana ya yule anayeokoa au kukomboa.
- source_word: ἀπεκδεχόμεθα
  choice: tunamngojea kwa hamu
  rationale: Kitenzi kinaonyesha kungoja kunakoendelea kwa matarajio makubwa; kirai hiki kinaeleza hali hiyo kwa uwazi na kwa lugha ya asili.
- source_word: κύριον
  choice: Bwana
  rationale: “Bwana” ndiyo tafsiri ya kawaida na inayofaa ya cheo hiki cha Yesu katika muktadha wa Agano Jipya.
- source_word: Χριστόν
  choice: Masihi
  rationale: Hapa neno hilo linaendelea kufanya kazi kama cheo cha Yesu, hasa katika muktadha wa kumtarajia Mwokozi; “Masihi” hutafsiri maana ya cheo hicho badala ya kukinakili tu.
theological_decisions:
- issue: Tafsiri ya Χριστόν katika mfululizo wa vyeo κύριον Ἰησοῦν Χριστόν
  choice: Masihi katika matini kuu
  alternative: Kristo
  rationale: “Masihi” huhifadhi maana hai ya cheo cha Χριστός katika muktadha huu wa Mwokozi anayetarajiwa, huku tanbihi ikihifadhi tafsiri ya kimapokeo “Kristo” bila kuamua kwamba neno hilo ni jina la kawaida tu.
- issue: Uhusiano wa σωτῆρα na κύριον Ἰησοῦν Χριστόν
  choice: Mwokozi, Bwana Yesu Masihi
  alternative: Mwokozi ambaye ni Bwana Yesu Masihi
  rationale: Muundo wa kuweka majina sambamba huhifadhi ukaribu wa sintaksia ya Kigiriki na kumtambulisha Mwokozi kuwa Bwana Yesu Masihi bila kuongeza kishazi cha ufafanuzi kisichokuwapo wazi katika chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Mpangilio umehifadhi hoja ya “kwa maana,” taswira ya uraia, mwelekeo wa kutoka mbinguni, na hali ya kungoja kwa hamu.
