  yaml_path: translation/nt/philippians/001/024.yaml
  text: But to remain in the flesh is more necessary for your sake[a].
translation:
  language: sw
  text: Lakini kubaki katika mwili ni muhimu zaidi kwa ajili yenu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuendelea kuishi katika mwili.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ἐπιμένειν
  choice: kubaki
  rationale: Kitenzi-jina chenye kibainishi kinataja tendo la kuendelea kuwapo; “kubaki” ni Kiswahili cha kawaida kinachohifadhi wazo la Paulo la kuendelea na maisha ya sasa.
- source_word: δὲ
  choice: Lakini
  rationale: Hapa δέ linaonyesha tofauti na wazo lililotangulia la kuondoka na kuwa pamoja na Kristo; “Lakini” huonyesha wazi geuko hilo.
- source_word: ἐν τῇ σαρκὶ
  choice: katika mwili
  rationale: Katika muktadha huu σάρξ linamaanisha maisha ya kidunia katika mwili, si maana ya kimaadili ya asili yenye dhambi. “Katika mwili” ni ya asili zaidi katika Kiswahili kuliko “katika nyama” na huhifadhi maana halisi.
- source_word: ἀναγκαιότερον
  choice: ni muhimu zaidi
  rationale: Huhifadhi hali ya kulinganisha ya neno la Kigiriki huku ikitoa Kiswahili cha sasa na kinachoeleweka.
- source_word: δι’ ὑμᾶς
  choice: kwa ajili yenu
  rationale: Kirai hiki kinaonyesha kwamba kuendelea kwa Paulo kuishi kunawanufaisha Wafilipi; “kwa ajili yenu” hueleza maana hiyo bila kupanua matini.
theological_decisions:
- issue: Maana ya σάρξ katika mstari huu
  choice: maisha halisi ya kidunia katika mwili (“katika mwili”)
  alternative: maana ya kimaadili (“asili yenye dhambi”) au ufafanuzi mpana (“kuendelea kuwa hai katika ulimwengu huu”)
  rationale: Muktadha unatofautisha kuondoka na kuwa pamoja na Kristo na Paulo kuendelea na maisha yake ya sasa kwa manufaa ya Wafilipi. Maana ya kimaadili ingeleta wazo lisilodaiwa na muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Tafsiri inafuata ulinganifu mwafaka, ikihifadhi tofauti na hali ya kulinganisha katika Kigiriki.
