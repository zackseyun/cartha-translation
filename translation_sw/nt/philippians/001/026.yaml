  text: ἵνα τὸ καύχημα ὑμῶν περισσεύῃ ἐν Χριστῷ Ἰησοῦ ἐν ἐμοὶ διὰ τῆς ἐμῆς παρουσίας πάλιν πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/026.yaml
  text: so that your boasting in Messiah Jesus may abound because of me through my coming to you again[a][b][c][d].
translation:
  language: sw
  text: ili kujivunia kwenu[a] katika Masihi Yesu kuzidi kwa sababu yangu[b] kwa kuja kwangu tena kwenu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sababu yenu ya kujivunia.”
    reason: lexical_alternative
  - marker: b
    text: Kwa maana halisi, “ndani yangu”; hapa maana inaweza kuwa “kwa sababu yangu” au “kwa habari yangu.”
    reason: lexical_alternative
  - marker: c
    text: Au, “kwa kuwapo kwangu tena pamoja nanyi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: ili
  rationale: Huanzisha kusudi au matokeo yanayotokana na kauli iliyotangulia.
- source_word: τὸ καύχημα ὑμῶν
  choice: kujivunia kwenu
  rationale: Kauli hii inaweza kumaanisha tendo la kujivunia au sababu ya kujivunia; ‘kujivunia kwenu’ ni ya asili katika Kiswahili na haifungi uwezekano huo kabisa.
- source_word: περισσεύῃ
  choice: kuzidi
  rationale: Huwasilisha wazo la kuongezeka au kuwa tele, huku muundo wa ‘ili ... kuzidi’ ukidumisha nguvu ya hali tegemezi.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: katika Kristo Yesu
  rationale: Hudumisha usemi wa Paulo unaoweka kujivunia ndani ya uhusiano na Kristo Yesu.
- source_word: ἐν ἐμοὶ
  choice: kwa sababu yangu
  rationale: Ingawa kwa umbo ni ‘ndani yangu,’ hapa inaelekea kumtaja Paulo kuwa msingi au sababu ya kujivunia kwao.
- source_word: διὰ τῆς ἐμῆς παρουσίας
  choice: kwa njia ya kuja kwangu
  rationale: παρουσία inaweza kumaanisha kuwapo au kuja; katika muktadha huu inarejelea kufika kwa Paulo na kuwapo tena pamoja nao.
- source_word: πάλιν πρὸς ὑμᾶς
  choice: tena kwenu
  rationale: Ni mpangilio wa kawaida wa Kiswahili unaohifadhi wazo la ziara nyingine kwa Wafilipi.
theological_decisions:
- issue: Tafsiri ya Χριστός
  choice: Kristo Yesu
  alternative: Masihi Yesu
  rationale: ‘Kristo Yesu’ ni jina la cheo lililozoeleka na lenye heshima katika Kiswahili cha Biblia; ‘Masihi Yesu’ pia linaweza kueleza cheo hicho, lakini si la kawaida katika mpangilio huu.
- issue: Uhusiano wa kujivunia na Kristo
  choice: kujivunia kwenu katika Kristo Yesu
  alternative: kujivunia kwenu kuzidi katika Kristo Yesu
  rationale: Mpangilio uliochaguliwa unaunganisha kwa kawaida καύχημα na ἐν Χριστῷ Ἰησοῦ, yaani kujivunia kunakoelekezwa na kufanyika katika Kristo, bila kukana uwezekano wa kuunganisha kirai hicho na kitenzi ‘kuzidi.’
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wa heshima na unaosomeka kwa urahisi. Muundo umefuata kwa karibu mpangilio wa Kigiriki lakini umeepuka mlundikano usio wa kawaida wa virai. Alama zote za tanbihi zimewekwa mwishoni mwa mstari kwa kuwa kila moja inahusu kirai tofauti ndani ya sentensi hiyo.
