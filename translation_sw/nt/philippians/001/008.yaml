  text: μάρτυς γάρ ⸀μου ὁ θεός, ὡς ἐπιποθῶ πάντας ὑμᾶς ἐν σπλάγχνοις ⸂Χριστοῦ Ἰησοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/008.yaml
  text: For God is my witness[b][a], how I long for all of you with the affections of Messiah Jesus.
translation:
  language: sw
  text: Kwa maana Mungu ni shahidi wangu, jinsi ninavyowatamani ninyi nyote kwa huruma ya Masihi Yesu[b][a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “Kristo Yesu.”'
    reason: alternative_reading
  - marker: b
    text: 'Au: “kwa hisia nyororo za Masihi Yesu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: μάρτυς
  choice: shahidi
  rationale: Katika kauli ya kiapo, “Mungu ni shahidi wangu” ni Kiswahili cha kawaida na chenye uzito, kikionyesha kwamba Paulo anamwomba Mungu athibitishe unyoofu wake.
- source_word: γάρ
  choice: Kwa maana
  rationale: Inaendeleza na kueleza kauli iliyotangulia, huku ikihifadhi wazi uhusiano wa kimantiki wa sentensi.
- source_word: ὡς
  choice: kwamba ... sana
  rationale: Katika muktadha huu neno hilo linaingiza jambo ambalo Mungu analishuhudia na pia linaonyesha ukubwa wa hamu; “sana” pamoja na kitenzi “ninawatamani” huwasilisha nguvu hiyo kwa Kiswahili cha kawaida.
- source_word: ἐπιποθῶ
  choice: ninawatamani sana
  rationale: Huwasilisha hamu kubwa ya kuwa pamoja nao kwa lugha ya sasa na ya asili, bila kuifanya iwe tamaa ya kimwili.
- source_word: πάντας ὑμᾶς
  choice: ninyi nyote
  rationale: Inahifadhi msisitizo wa πάντας kwamba hakuna hata mmoja anayeachwa nje.
- source_word: σπλάγχνοις
  choice: upendo wa ndani kabisa
  rationale: Neno la Kigiriki hutumia viungo vya ndani kwa njia ya sitiari kumaanisha hisia nyororo na za kina. Tafsiri hii huepuka maana ya kimwili isiyokusudiwa na kuhifadhi kina cha hisia.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Masihi Yesu
  rationale: Χριστός lina maana ya cheo cha Mtiwa-Mafuta; “Masihi” hutafsiri maana hiyo, huku “Yesu” likibaki jina.
theological_decisions:
- issue: Jinsi hisia za Paulo zinavyohusishwa na Masihi Yesu
  choice: kwa upendo wa ndani kabisa wa Masihi Yesu
  alternative: kwa huruma ya Masihi Yesu
  rationale: Kirai ἐν σπλάγχνοις Χριστοῦ Ἰησοῦ kinaweza kueleweka kuwa Paulo anatamani kwa hisia nyororo zinazotokana na Masihi au zinazolingana na zake. Tafsiri haiongezi maelezo ya chanzo wala ulinganisho, hivyo inadumisha mkazo na mvutano wa asili.
- issue: Tafsiri ya Χριστός katika muundo Χριστοῦ Ἰησοῦ
  choice: Masihi Yesu
  alternative: Kristo Yesu
  rationale: “Masihi” huonyesha wazi maana ya cheo cha Kigiriki Χριστός; “Kristo Yesu,” ambalo ni umbo la kimapokeo na linalofanana zaidi na jina maalumu katika matumizi ya Paulo, limehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Ninyi nyote” huhifadhi msisitizo wa Kigiriki, na “upendo wa ndani kabisa” huwasilisha sitiari ya σπλάγχνα kwa njia ya kawaida bila kuwa ya kitabibu au ya kizamani.
