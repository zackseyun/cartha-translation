  text: For to me[a], to live is Christ, and to die is gain.
translation:
  language: sw
  text: Kwa maana kwangu mimi, kuishi ni Kristo[a], na kufa ni faida.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Masihi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμοὶ
  choice: kwangu mimi
  rationale: Dative hii inaonyesha mtazamo binafsi wa Paulo. “Kwangu mimi” ni Kiswahili cha kawaida na chenye msisitizo unaofaa katika kauli hii.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Kiunganishi hiki kinaeleza sababu au ufafanuzi wa wazo lililotangulia; “Kwa maana” huhifadhi mtiririko huo wa hoja kwa lugha ya heshima na iliyo wazi.
- source_word: τὸ ζῆν
  choice: kuishi
  rationale: Kitenzi-jina chenye kibainishi kimetafsiriwa kwa kitenzi-jina cha Kiswahili, kikihifadhi ufupi na ulinganifu wake na “kufa.”
- source_word: Χριστὸς
  choice: Kristo
  rationale: “Kristo” ni matumizi ya kawaida ya Kiswahili na yanaakisi namna neno hili linavyoweza kutumiwa kama cheo na pia kama jina katika Paulo; maana ya cheo “Masihi” imehifadhiwa katika tanbihi.
- source_word: τὸ ἀποθανεῖν
  choice: kufa
  rationale: Kitenzi-jina hiki kinadumisha muundo sambamba na “kuishi” na kutoa Kiswahili kifupi na cha asili.
- source_word: κέρδος
  choice: faida
  rationale: “Faida” huwasilisha maana ya kitu kinachomletea mtu manufaa bila kulazimisha maana ya kibiashara, na ni neno la kawaida katika Kiswahili sanifu.
