  text: The former do so out of love[a], knowing that I am appointed for the defense of the good news[b],
translation:
  language: sw
  text: Hawa wanahubiri kwa upendo, wakijua kwamba nimewekwa kwa ajili ya kuitetea Habari Njema.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ μὲν
  choice: Hawa wanahubiri
  rationale: Kirai cha Kiyunani hakina kitenzi wazi na kinaelekeza kwenye tendo lililotajwa katika muktadha, yaani kumhubiri Kristo. Kiswahili cha kawaida huhitaji tendo lielezwe; “hawa” pia huhifadhi utofautishaji na kundi jingine.
- source_word: ἐξ ἀγάπης
  choice: kwa sababu ya upendo
  rationale: Hueleza upendo kuwa msukumo wa tendo hilo kwa Kiswahili cha asili na chenye kueleweka.
- source_word: εἰδότες
  choice: wakijua
  rationale: Huhifadhi muundo wa kishiriki na kuonyesha kwamba ujuzi wao unaambatana na sababu yao ya kuhubiri.
- source_word: εἰς ἀπολογίαν
  choice: ili kuitetea
  rationale: Huwasilisha kusudi na maana ya ἀπολογία kama utetezi wa hoja au wa kisheria bila kufanya sentensi kuwa nzito.
- source_word: τοῦ εὐαγγελίου
  choice: Habari Njema
  rationale: Ni tafsiri ya maana iliyo wazi kwa wasomaji wa kawaida na inarejelea ujumbe wa Kikristo unaokusudiwa katika muktadha.
- source_word: κεῖμαι
  choice: nimewekwa hapa
  rationale: Huhifadhi taswira ya msingi ya kuwekwa katika hali au nafasi fulani na kuepuka kubainisha zaidi ya maandishi kwamba ni uteuzi rasmi.
theological_decisions:
- issue: Maana ya κεῖμαι katika kifungo cha Paulo
  choice: nimewekwa hapa
  alternative: nimeteuliwa
  rationale: “Nimewekwa hapa” huhifadhi uwezekano wa kurejelea hali ya Paulo ya sasa pamoja na jukumu lake, bila kulazimisha dai lililo wazi zaidi la uteuzi wa kimungu; “hapa” huifanya kauli iwe ya kawaida katika Kiswahili.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Kitenzi “wanahubiri” kimejazwa kutokana na muktadha kwa uwazi wa Kiswahili; sentensi imebaki fupi na ya kawaida.
