  yaml_path: translation/nt/philippians/001/005.yaml
  text: because of your partnership in the gospel from the first day until now,[a]
translation:
  language: sw
  text: kwa sababu ya ushiriki wenu katika injili tangu siku ya kwanza hadi sasa,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa ajili ya injili.” Kifungu cha Kigiriki kinaweza kuonyesha ama eneo la ushiriki wao wa pamoja, ama lengo au kusudi lake.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ τῇ κοινωνίᾳ
  choice: kwa sababu ya ushiriki
  rationale: ἐπί pamoja na nomino ya hali ya utoaji huonyesha msingi au sababu ya shukrani ya Paulo katika sentensi inayozunguka kifungu hiki. “Kwa sababu ya” ni ya kawaida na wazi katika Kiswahili, na “ushiriki” huonyesha kushiriki kwa vitendo bila kuishusha maana kuwa urafiki tu.
- source_word: ὑμῶν
  choice: wenu
  rationale: Kiwakilishi hiki kinawaonyesha Wafilipi kuwa ndio washiriki wanaozungumziwa.
- source_word: εἰς τὸ εὐαγγέλιον
  choice: katika injili
  rationale: Kifungu hiki kinaweza kuonyesha eneo la ushiriki wao au lengo lake. “Katika injili” huhifadhi maana ya kwanza kwa ufupi, huku maana ya kusudi ikitajwa katika tanbihi.
- source_word: εὐαγγέλιον
  choice: injili
  rationale: “Injili” ni neno la kawaida, lenye uzito unaofaa katika matumizi ya Paulo, kwa habari njema inayomhusu Kristo.
- source_word: ἀπὸ τῆς πρώτης ἡμέρας
  choice: tangu siku ya kwanza
  rationale: Kifungu kinaonyesha mwanzo wa ushiriki wao; “tangu” pia hudokeza mwendelezo kutoka wakati huo.
- source_word: ἄχρι τοῦ νῦν
  choice: hadi sasa
  rationale: Hiki ni kielezi cha kawaida cha Kiswahili kinachoonyesha kuendelea mpaka wakati wa sasa.
theological_decisions:
- issue: Uhusiano wa εἰς τὸ εὐαγγέλιον na κοινωνίᾳ
  choice: katika injili
  alternative: kwa ajili ya injili
  rationale: Kigiriki kinaweza kueleweka kuwa injili ndiyo eneo la ushiriki wao au ndiyo lengo la ushiriki huo. Matini kuu inatumia usemi wa kwanza, na tanbihi inahifadhi uwezekano wa pili bila kuamua mvutano huo kimyakimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa msomaji wa kawaida. “Ushiriki” umetumiwa badala ya “ushirika” ili kusisitiza kushiriki kwa vitendo bila kuongeza wazi wazo la kueneza injili, ambalo halijatajwa moja kwa moja katika kifungu cha Kigiriki.
