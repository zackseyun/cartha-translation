id: PHP.1.7
reference: Philippians 1:7
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καθώς ἐστιν δίκαιον ἐμοὶ τοῦτο φρονεῖν ὑπὲρ πάντων ὑμῶν, διὰ τὸ ἔχειν με ἐν τῇ καρδίᾳ ὑμᾶς, ἔν τε τοῖς δεσμοῖς μου καὶ ἐν τῇ ἀπολογίᾳ καὶ βεβαιώσει τοῦ εὐαγγελίου συγκοινωνούς μου τῆς χάριτος πάντας ὑμᾶς ὄντας·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/007.yaml
  text: For it is right for me to think this about all of you[a], because I have you in my heart, since both in my chains and in the defense and confirmation of the gospel[b], all of you are fellow partakers with me of grace.
translation:
  language: sw
  text: Ni sawa kwangu kuwafikiria hivi ninyi nyote[a], kwa sababu ninawashika moyoni mwangu, na kwa kuwa ninyi nyote mnashiriki nami katika neema, katika vifungo vyangu na katika kuitetea na kuithibitisha injili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa sababu mmeniweka moyoni mwenu.” Kishazi cha Kigiriki kinaweza kueleweka kwa njia zote mbili.
    reason: alternative_reading
lexical_decisions:
- source_word: δίκαιον
  choice: Ni sawa
  rationale: Inaonyesha kwamba mtazamo wa Paulo ni unaofaa na wenye msingi wa kimaadili, kwa Kiswahili cha kawaida na cha heshima.
- source_word: φρονεῖν
  choice: kuwafikiria hivyo
  rationale: Inahifadhi wazo la kufikiri na kuwa na mtazamo fulani kuelekea Wafilipi bila kulifanya kuwa hisia pekee.
- source_word: ὑπὲρ πάντων ὑμῶν
  choice: ninyi nyote
  rationale: Katika muundo huu, ὑπέρ inaeleza mtazamo wa Paulo kuwahusu wote; kiambishi cha yambwa katika “kuwafikiria” kinawasilisha maana hiyo kwa Kiswahili cha asili.
- source_word: διὰ τὸ ἔχειν με ἐν τῇ καρδίᾳ ὑμᾶς
  choice: kwa sababu nimewaweka moyoni mwangu
  rationale: Ni usemi wa kawaida unaoonyesha upendo na kuwathamini; utata wa kisarufi kuhusu ni nani aliye moyoni mwa nani umehifadhiwa katika tanbihi.
- source_word: δεσμοῖς
  choice: vifungo
  rationale: Inahifadhi taswira halisi ya kufungwa kwa Paulo na pia inaeleweka kama hali yake ya kifungo.
- source_word: ἀπολογίᾳ
  choice: ninapoitetea
  rationale: Kitenzi hiki huleta Kiswahili cha asili huku kikihifadhi wazo la Paulo kuitolea injili utetezi wa wazi au rasmi.
- source_word: βεβαιώσει
  choice: kuithibitisha
  rationale: Inaonyesha kuiimarisha au kuthibitisha kweli na uhalali wa injili.
- source_word: συγκοινωνούς
  choice: mnashiriki pamoja nami
  rationale: Inaonyesha ushiriki wa pamoja na Paulo bila urudiaji usio wa lazima.
- source_word: χάριτος
  choice: neema hii
  rationale: “Neema” huhifadhi istilahi kuu ya kiteolojia; “hii” inaelekeza kwenye neema inayoshirikiwa katika huduma na mateso yanayotajwa katika muktadha.
theological_decisions:
- issue: Utata wa kisarufi katika kishazi cha moyo
  choice: kwa sababu nimewaweka moyoni mwangu
  alternative: kwa sababu mmeniweka moyoni mwenu
  rationale: Viwakilishi vyote viwili viko katika hali ya akusativi kandokando ya kitenzi-jina cha Kigiriki, hivyo muundo unaweza kueleweka kwa njia zote mbili. Matini kuu inafuata mtiririko wa karibu wa upendo na mtazamo wa Paulo, huku maana nyingine ikihifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Sentensi imegawanywa kidogo ili kuepuka msongamano, huku uhusiano wa mawazo na utata halisi wa matini ya Kigiriki ukihifadhiwa.
