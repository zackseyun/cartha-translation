lexical_decisions:
- source_word: ἀγῶνα
  choice: pambano
  rationale: Neno hili linaonyesha mapambano au kushindana kwa nguvu katika hali ya upinzani; “pambano” ni la kawaida na lenye hadhi katika Kiswahili.
- source_word: ἔχοντες
  choice: mkiwa na
  rationale: Inahifadhi muundo wa hali unaounganisha mstari huu na agizo la muktadha uliotangulia.
- source_word: ἐν ἐμοί
  choice: nikipambana nalo / ninapambana nalo
  rationale: Tafsiri ya kiidioma inaeleza kwamba pambano linaonekana na kusikika katika maisha ya Paulo, bila kutumia Kiswahili kisicho cha kawaida kama “ndani yangu” katika muktadha huu.
- source_word: νῦν
  choice: sasa
  rationale: Inahifadhi utofautishaji wa wakati kati ya yale Wafilipi waliona zamani na yale wanayosikia sasa.
theological_decisions:
- issue: Ikiwa pambano la sasa linaendelea
  choice: bado ninapambana nalo
  alternative: mnasikia liko kwangu
  rationale: Ingawa “bado” halipo kama neno tofauti katika Kigiriki, muunganiko wa “sasa mnasikia” na ἔχοντες/ἐν ἐμοί unaonyesha kwa kawaida kwamba Paulo ana pambano hilo wakati huu; uchaguzi huu unaweka wazi maana bila kuongeza dai la kiteolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Urudiaji wa “pambano” na “kupambana” umehifadhiwa ili kuonyesha uhusiano wa moja kwa moja wa wazo, huku sentensi ikibaki ya kawaida kwa wasomaji wa leo.
