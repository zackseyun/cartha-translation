  text: ὅτι ὑμῖν ἐχαρίσθη τὸ ὑπὲρ Χριστοῦ, οὐ μόνον τὸ εἰς αὐτὸν πιστεύειν ἀλλὰ καὶ τὸ ὑπὲρ αὐτοῦ πάσχειν),
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/029.yaml
  text: For it has been graciously granted to you on behalf of Messiah not only to believe in him[a], but also to suffer for him[d][c][b],
translation:
  language: sw
  text: Kwa maana mmepewa kwa neema, kwa ajili ya Masihi[a], si tu kumwamini[b], bali pia kuteseka kwa ajili yake[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Kristo.” Neno la Kigiriki Χριστός ni cheo chenye maana ya “Masihi.”
    reason: lexical_alternative
  - marker: b
    text: Au “kumtumaini.”
    reason: lexical_alternative
  - marker: c
    text: Au “kwa sababu yake” au “kwa niaba yake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Kwa maana
  rationale: Katika muktadha, kiunganishi hiki kinatoa sababu au maelezo ya msimamo usio na hofu uliotajwa katika mstari uliotangulia.
- source_word: ἐχαρίσθη
  choice: mmepewa kwa neema
  rationale: Kitenzi hiki kinaonyesha kupewa bure au kwa neema, si kuruhusiwa tu. Kauli tendwa pia imehifadhiwa bila kumtaja wazi mtendaji ambaye Kigiriki hakumtaji.
- source_word: τὸ ὑπὲρ Χριστοῦ
  choice: kwa ajili ya Masihi
  rationale: ὑπέρ hapa inaonyesha kwamba zawadi yote—kumwamini na kuteseka—inahusiana na Masihi na ni kwa ajili yake. Χριστός imetafsiriwa kama cheo, ‘Masihi.’
- source_word: πιστεύειν εἰς αὐτόν
  choice: kumwamini
  rationale: Hii ni njia ya kawaida na ya asili katika Kiswahili ya kueleza kuweka imani au tumaini katika mtu.
- source_word: πάσχειν
  choice: kuteseka
  rationale: Tafsiri ya moja kwa moja inahifadhi uzito na uwazi wa kitenzi cha Kigiriki.
- source_word: ὑπὲρ αὐτοῦ
  choice: kwa ajili yake
  rationale: Kirai kinaonyesha kuteseka kwa sababu yake au kwa manufaa ya jambo lake, bila kulazimisha maana finyu ya uwakilishi.
theological_decisions:
- issue: Kama kauli kwamba kuamini na kuteseka vyote vimetolewa kwa neema ipunguzwe makali
  choice: Lugha ya kupewa kwa neema imehifadhiwa na inahusu kuamini pamoja na kuteseka
  alternative: Kutafsiri kama ‘mmeruhusiwa’ au kupanga sentensi kwa namna inayoficha kwamba mambo yote mawili yametolewa
  rationale: Muundo wa Kigiriki unajumuisha kumwamini Masihi na kuteseka kwa ajili yake ndani ya kile walichopewa kwa neema; mvutano huu wa kiteolojia haupaswi kuondolewa.
- issue: Mtendaji wa ἐχαρίσθη
  choice: Kauli tendwa ‘mmepewa kwa neema’ bila kumtaja mtendaji
  alternative: Kuongeza wazi ‘Mungu amewapa’
  rationale: Muktadha unaweza kudokeza Mungu kuwa mtendaji, lakini mstari wa Kigiriki hautaji jina lake wazi; tafsiri haiongezi jambo hilo katika matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaoeleweka. Mpangilio wa virai unalenga kudumisha upeo wa ‘kwa ajili ya Masihi’ juu ya zawadi zote mbili bila kufanya sentensi kuwa nzito kupita kiasi.
