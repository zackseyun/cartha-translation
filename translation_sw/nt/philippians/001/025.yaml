reference: Philippians 1:25
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ τοῦτο πεποιθὼς οἶδα ὅτι μενῶ καὶ ⸀παραμενῶ πᾶσιν ὑμῖν εἰς τὴν ὑμῶν προκοπὴν καὶ χαρὰν τῆς πίστεως,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/025.yaml
  text: And convinced of this[a], I know that I will remain and continue with all of you for your progress and joy in the faith,
translation:
  language: sw
  text: Nami, nikiwa na hakika ya jambo hili, najua kwamba nitabaki na kuendelea kuwa pamoja nanyi nyote kwa ajili ya maendeleo yenu na furaha yenu katika imani.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “furaha ya imani” au “furaha inayotokana na imani.”
    reason: alternative_reading
lexical_decisions:
- source_word: πεποιθὼς
  choice: nikiwa na hakika
  rationale: Kauli timilifu ya kitenzi hiki inaonyesha hali thabiti ya kuwa na uhakika; usemi huu ni wa kawaida na wenye heshima katika Kiswahili.
- source_word: μενῶ
  choice: nitabaki
  rationale: Huhifadhi wakati ujao na maana ya msingi ya kuendelea kuwapo, huku ikitofautishwa na kitenzi kinachofuata.
- source_word: παραμενῶ
  choice: kuendelea kuwa pamoja
  rationale: Huwasilisha wazo la kuendelea kuwapo kando ya wengine, si kuendelea kuishi tu.
- source_word: πᾶσιν ὑμῖν
  choice: pamoja nanyi nyote
  rationale: Huhifadhi uhusiano wa kuwa pamoja nao na kutaja wazi maana ya πᾶσιν, yaani wote.
- source_word: προκοπὴν
  choice: maendeleo
  rationale: Neno hili linaonyesha kusonga mbele au kukua; “maendeleo” ni la kawaida na linafaa katika muktadha wa ukuaji wa kiimani.
- source_word: χαρὰν τῆς πίστεως
  choice: furaha yenu katika imani
  rationale: Ni usemi wa asili katika Kiswahili unaohusianisha furaha na imani bila kuamua kwa lazima ikiwa imani ndiyo chanzo cha furaha hiyo.
- source_word: πίστεως
  choice: imani
  rationale: Katika muktadha huu πίστις inahusu maisha ya kuamini; “imani” ndiyo tafsiri ya kawaida na inayofaa zaidi.
theological_decisions:
- issue: Maana ya umilikishi katika χαρὰν τῆς πίστεως
  choice: furaha yenu katika imani
  alternative: furaha ya imani; furaha inayotokana na imani
  rationale: Muundo wa Kigiriki unaweza kueleweka kwa njia zaidi ya moja. Tafsiri kuu ni ya asili lakini hailazimishi maana ya kisababishi; uwezekano mwingine umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Alama ya tanbihi imewekwa baada ya kirai kinachohusika badala ya baada ya “jambo hili,” kwa kuwa tanbihi inafafanua χαρὰν τῆς πίστεως.
