lexical_decisions:
- source_word: Γινώσκειν ... βούλομαι
  choice: Nataka mjue
  rationale: Hii ni kauli ya kawaida na ya asili katika Kiswahili kwa kumjulisha msomaji jambo, huku ikihifadhi nia binafsi ya mwandishi.
- source_word: δὲ
  choice: imewasilishwa kwa mpito wa kawaida bila neno tofauti
  rationale: δέ hapa ni kiunganishi hafifu cha kuhamia kwenye mada nyingine, si upinzani mkali. Kiswahili hakihitaji lazima neno kama “lakini” au “sasa” katika nafasi hii.
- source_word: ἀδελφοί
  choice: ndugu
  rationale: “Ndugu” ni mwito wa kawaida na wenye heshima katika jumuiya ya waumini; katika Kiswahili unaweza kuwahusu wanaume na wanawake bila kufuta umbo la Kigiriki, ambalo linafafanuliwa katika tanbihi.
- source_word: τὰ κατ’ ἐμὲ
  choice: mambo yaliyonipata
  rationale: Kauli hii inaeleza kwa lugha ya kawaida hali na matukio yaliyompata Paulo, bila kuibana kwa tukio moja tu.
- source_word: μᾶλλον
  choice: kwa kweli
  rationale: Hapa neno linaonyesha matokeo yasiyotazamiwa, kinyume na dhana kwamba yaliyompata Paulo yangezuia kuenea kwa habari njema.
- source_word: εἰς προκοπὴν τοῦ εὐαγγελίου
  choice: yameendeleza habari njema
  rationale: Muundo wa nomino wa Kigiriki umeelezwa kwa kitenzi cha asili cha Kiswahili, huku wazo la maendeleo au kusonga mbele likihifadhiwa.
- source_word: ἐλήλυθεν
  choice: yameendeleza
  rationale: Kauli ya wakati timilifu inaonyesha matokeo ya mambo yaliyotokea ambayo yanaendelea kuwapo; wakati timilifu wa Kiswahili “yame-” unafikisha maana hiyo kwa ufupi.
