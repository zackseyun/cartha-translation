  text: οἶδα γὰρ ὅτι τοῦτό μοι ἀποβήσεται εἰς σωτηρίαν διὰ τῆς ὑμῶν δεήσεως καὶ ἐπιχορηγίας τοῦ πνεύματος Ἰησοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/019.yaml
  text: For I know that this will turn out for my deliverance through your prayer and the provision of the Spirit of Jesus the Messiah[b][a],
translation:
  language: sw
  text: Kwa maana najua kwamba jambo hili litaniletea ukombozi[a] kwa njia ya maombi yenu na msaada wa Roho wa Yesu Masihi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wokovu” au “kutetewa.”
    reason: alternative_reading
  - marker: b
    text: 'Kigiriki: “Roho wa Yesu Kristo.” “Kristo” ni cheo chenye maana ya “Masihi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἶδα
  choice: najua
  rationale: Kitenzi hiki kina maana ya wakati wa sasa licha ya umbo lake la Kigiriki; “najua” ni Kiswahili cha kawaida na kinahifadhi uhakika wa Paulo.
- source_word: τοῦτό
  choice: jambo hili
  rationale: Kiwakilishi hiki kinarejelea hali ya Paulo iliyotangulia kwa ujumla bila kuifafanua kupita kiasi.
- source_word: ἀποβήσεται
  choice: litaniletea
  rationale: Katika muktadha huu kitenzi kinaonyesha matokeo; usemi huu ni wa asili katika Kiswahili na unaunganisha wazi jambo hilo na matokeo kwa Paulo.
- source_word: σωτηρίαν
  choice: ukombozi
  rationale: Katika muktadha wa kifungo, neno hili linaweza kumaanisha kuokolewa au kutetewa, huku likiwa na mwangwi mpana wa wokovu; maana nyingine zimehifadhiwa katika tanbihi.
- source_word: δεήσεως
  choice: maombi
  rationale: “Maombi” ni neno la kawaida na linaloeleweka kwa dua au ombi linaloelekezwa kwa Mungu.
- source_word: ἐπιχορηγίας
  choice: msaada
  rationale: Neno hili linamaanisha kile kinachotolewa ili kukidhi hitaji; “msaada” ni la asili na linafaa kwa utendaji wa Roho katika muktadha huu.
- source_word: πνεύματος Ἰησοῦ Χριστοῦ
  choice: Roho wa Yesu Masihi
  rationale: Muundo wa umilikaji umehifadhiwa moja kwa moja, na Χριστός imetafsiriwa kama cheo “Masihi” badala ya kuachwa kama jina lililotoholewa.
theological_decisions:
- issue: Maana ya σωτηρίαν katika muktadha wa kifungo cha Paulo
  choice: ukombozi
  alternative: wokovu au kuthibitishwa kuwa mwenye haki
  rationale: Muktadha wa karibu unahusu hali ya Paulo akiwa kifungoni na matokeo anayoyatarajia. “Ukombozi” linafaa katika muktadha huo, lakini tanbihi inadumisha upana wa neno la Kigiriki bila kuamua kwa lazima kati ya kuachiliwa, wokovu mpana, au kutetewa.
- issue: Uhusiano wa ἐπιχορηγίας na πνεύματος Ἰησοῦ Χριστοῦ
  choice: msaada wa Roho wa Yesu Masihi
  alternative: msaada unaotolewa na Roho wa Yesu Masihi
  rationale: Muundo mfupi wa umilikaji unahifadhi kiasi fulani cha utata wa Kigiriki kuhusu kama Roho ndiye msaada unaotolewa au ndiye anayetoa msaada.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni nyepesi kwa msomaji wa kawaida, huku muundo “msaada wa Roho” ukihifadhi utata halisi wa Kigiriki.
