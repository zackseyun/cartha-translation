lexical_decisions:
- source_word: πάντοτε
  choice: daima
  rationale: Huwasilisha maana ya ‘sikuzote’ kwa lugha ya sasa na yenye hadhi, huku ikiendeleza mtiririko wa sentensi kutoka mstari uliotangulia.
- source_word: ἐν πάσῃ δεήσει μου
  choice: katika kila ombi langu
  rationale: Hudumisha upekee wa δέησις kama ombi la dhati na wazo la kila tukio la kuomba, bila kulipanua kuwa sala kwa ujumla.
- source_word: ὑπὲρ πάντων ὑμῶν
  choice: kwa ajili yenu nyote
  rationale: Hutoa wazi maana ya kuwaombea waamini wote.
- source_word: μετὰ χαρᾶς
  choice: kwa furaha
  rationale: Ni usemi wa kawaida wa Kiswahili unaohifadhi hali ambayo ombi linafanywa.
- source_word: τὴν δέησιν ποιούμενος
  choice: nikiomba
  rationale: Kitenzi cha Kiswahili ni cha asili kuliko tafsiri halisi ‘nikifanya ombi’ na kinahifadhi uhusiano wa kishiriki na tendo kuu la sentensi.
