  text: τί γάρ; πλὴν ⸀ὅτι παντὶ τρόπῳ, εἴτε προφάσει εἴτε ἀληθείᾳ, Χριστὸς καταγγέλλεται, καὶ ἐν τούτῳ χαίρω· ἀλλὰ καὶ χαρήσομαι,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/018.yaml
  text: What then? Only that in every way[a], whether in pretense or in truth, Messiah is being proclaimed, and in this I rejoice. Yes[b], and I will rejoice.
translation:
  language: sw
  text: Basi, je? Cha maana ni kwamba kwa kila njia, iwe kwa kisingizio[a] au kwa kweli, Masihi anatangazwa; nami ninafurahi katika hilo. Naam, nami pia nitafurahi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa kujifanya.”
    reason: lexical_alternative
  - marker: b
    text: Au, “lakini pia nitafurahi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γάρ
  choice: Basi iweje?
  rationale: Linadumisha swali fupi la balagha linalounganisha hitimisho la Paulo na maelezo yaliyotangulia, kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: πλὴν ὅτι
  choice: Jambo la maana ni kwamba
  rationale: Linaonyesha nguvu ya usemi huu ya kuelekeza fikira kwenye jambo kuu, bila kuifanya sentensi ya Kiswahili kuwa ngumu au isiyo ya kawaida.
- source_word: παντὶ τρόπῳ
  choice: kwa kila njia
  rationale: Linahifadhi maana ya namna au njia yoyote ambayo ujumbe unatangazwa.
- source_word: προφάσει
  choice: kwa kisingizio
  rationale: Linawasilisha hali ya kujifanya au kutumia tangazo kama kisingizio, bila kufafanua nia hizo zaidi ya neno la Kigiriki.
- source_word: ἀληθείᾳ
  choice: kwa kweli
  rationale: Linadumisha ulinganifu mfupi na wa moja kwa moja dhidi ya ‘kwa kisingizio.’
- source_word: Χριστὸς
  choice: Masihi
  rationale: Hapa Χριστός ni cheo cha yule anayetangazwa; ‘Masihi’ huhifadhi maana ya cheo hicho kwa uwazi.
- source_word: καταγγέλλεται
  choice: anatangazwa
  rationale: Linahifadhi hali ya kutendwa na wazo la tangazo la hadharani; wakati wa sasa unaonyesha tendo linaloendelea.
- source_word: ἐν τούτῳ
  choice: jambo hilo
  rationale: Kiswahili hiki cha asili kinaelekeza furaha ya Paulo kwenye ukweli uliotajwa kwamba Masihi anatangazwa.
- source_word: χαίρω
  choice: ninafurahia
  rationale: Linabeba maana ya furaha ya sasa ya Paulo na linaungana kiasili na ‘jambo hilo.’
- source_word: ἀλλὰ καὶ χαρήσομαι
  choice: na pia nitaendelea kufurahi
  rationale: Linawasilisha nyongeza yenye mtazamo wa wakati ujao; ‘nitaendelea’ huonyesha mwendelezo kutoka furaha ya sasa hadi ya baadaye, huku tanbihi ikihifadhi tafsiri iliyo rasmi zaidi.
theological_decisions:
- issue: Tafsiri ya Χριστός
  choice: Masihi
  alternative: Kristo
  rationale: Katika muktadha huu neno hilo linafanya kazi kama cheo cha yule anayetangazwa, hivyo ‘Masihi’ linaonyesha wazi zaidi maana ya cheo cha Kigiriki bila kuingiza msimamo wa kimadhehebu.
- issue: Nia mbaya na tangazo la Masihi
  choice: Kauli inaacha mvutano kwamba Masihi anatangazwa hata ‘kwa kisingizio’
  alternative: Kufafanua kuwa Paulo anaidhinisha ujumbe lakini si nia mbaya
  rationale: Mstari wenyewe unasisitiza furaha kwa tangazo la Masihi bila kutoa maelezo kamili ya tathmini ya Paulo kuhusu wahubiri; tafsiri haiongezi ufafanuzi wa kiteolojia usiotajwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi na chenye hadhi. Muundo umewekwa wa kawaida kwa wasomaji wa leo huku swali la balagha, ulinganifu wa nia, hali ya kutendwa ya kitenzi, na mwelekeo wa furaha ya sasa na ya baadaye vikihifadhiwa.
