base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/022.yaml
  text: But if to go on living in the flesh means fruitful labor for me[b][a], yet which I will choose I do not know.
translation:
  language: sw
  text: Lakini ikiwa kuendelea kuishi katika mwili[a] kunamaanisha kazi yenye kuzaa matunda[b] kwangu, na sijui nichague nini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “katika nyama.” Hapa neno hili linamaanisha kuendelea kuishi katika maisha ya kimwili duniani.
    reason: lexical_alternative
  - marker: b
    text: Au “ni tunda la kazi kwangu” au “ni matunda ya kazi kwangu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ζῆν
  choice: kuendelea kuishi
  rationale: Muundo huu unaonyesha kuendelea kwa maisha ya sasa, huku ukibaki wa kawaida na wazi katika Kiswahili.
- source_word: ἐν σαρκί
  choice: katika mwili
  rationale: Katika muktadha huu σάρξ hurejelea maisha ya kimwili duniani, si asili ya dhambi. ‘Katika mwili’ ni Kiswahili cha kawaida zaidi kuliko tafsiri ya moja kwa moja ‘katika nyama.’
- source_word: καρπὸς ἔργου
  choice: kazi yenye matunda
  rationale: Kirai cha Kigiriki kimebanwa. Tafsiri hii huhifadhi picha ya matunda na kueleza kazi yenye matokeo bila kuainisha matokeo hayo zaidi ya maandishi.
- source_word: αἱρήσομαι
  choice: nitachagua
  rationale: Kitenzi hiki katika muktadha kinaonyesha kuchagua kati ya uwezekano wawili.
- source_word: οὐ γνωρίζω
  choice: sijui
  rationale: Ingawa γνωρίζω pia inaweza kumaanisha ‘kujulinisha,’ hapa inaeleza kutokuwa na uhakika kuhusu uchaguzi.
theological_decisions:
- issue: Maana ya σάρξ katika aya hii
  choice: maisha ya kimwili duniani (‘katika mwili’)
  alternative: asili ya dhambi
  rationale: Muktadha unatofautisha kuendelea kuishi duniani na kuondoka ili kuwa pamoja na Kristo; kwa hiyo neno hili linahusu maisha katika mwili, si upotovu wa kimaadili.
- issue: Uhusiano wa kisarufi kati ya kuendelea kuishi na καρπὸς ἔργου
  choice: ‘kunamaanisha kazi yenye matunda kwangu’
  alternative: ‘ni tunda la kazi kwangu’
  rationale: Kigiriki kimebanwa na kinaweza kueleweka kwa zaidi ya namna moja. Tafsiri kuu ni ya kawaida katika Kiswahili, huku tanbihi ikihifadhi uwezekano wa muundo wa karibu zaidi na maneno ya asili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Mwili’ limetumiwa badala ya ‘nyama’ ili kuepuka maana isiyokusudiwa katika matumizi ya kawaida. Neno ‘bado’ linaonyesha mvutano wa sentensi bila kugeuza muundo huo kuwa hitimisho la moja kwa moja.
