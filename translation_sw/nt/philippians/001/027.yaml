id: PHP.1.27
reference: Philippians 1:27
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Μόνον ἀξίως τοῦ εὐαγγελίου τοῦ Χριστοῦ πολιτεύεσθε, ἵνα εἴτε ἐλθὼν καὶ ἰδὼν ὑμᾶς εἴτε ἀπὼν ⸀ἀκούω τὰ περὶ ὑμῶν, ὅτι στήκετε ἐν ἑνὶ πνεύματι, μιᾷ ψυχῇ συναθλοῦντες τῇ πίστει τοῦ εὐαγγελίου,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/027.yaml
  text: Only conduct yourselves in a manner worthy of the gospel of Messiah[a], so that whether I come and see you or am absent, I may hear about you that you are standing firm in one spirit, with one soul striving together for the faith of the gospel[e][d][c][b],
translation:
  language: sw
  text: 'Jambo la muhimu ni hili tu: mwenende kama raia kwa namna inayostahili habari njema ya Masihi[a], ili kwamba, kama nikija na kuwaona au nikiwa mbali, nipate kusikia habari zenu kwamba mnasimama imara katika roho moja[b], mkiwa na nafsi moja[c] na mkijitahidi pamoja kwa ajili ya imani ya habari njema[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kristo.” Neno la Kigiriki Χριστός ni cheo chenye maana ya “aliyetiwa mafuta,” yaani Masihi.
    reason: lexical_alternative
  - marker: b
    text: Au, “katika Roho mmoja,” yaani Roho Mtakatifu.
    reason: alternative_reading
  - marker: c
    text: Au, “mkiwa na nia moja.”
    reason: lexical_alternative
  - marker: d
    text: Au, “mkijitahidi pamoja kwa ajili ya imani katika habari njema.”
    reason: alternative_reading
lexical_decisions:
- source_word: Μόνον
  choice: Jambo la muhimu ni hili tu
  rationale: Muundo huu wa asili wa Kiswahili huhifadhi msisitizo wa neno lililotangulizwa na kuonyesha kuwa hili ndilo himizo kuu, bila kulifanya kuwa kizuizi kisichoeleweka.
- source_word: ἀξίως
  choice: kwa namna inayostahili
  rationale: Hufafanua namna ya mwenendo na kuhifadhi uzito wa kimaadili wa kielezi cha Kigiriki.
- source_word: πολιτεύεσθε
  choice: mwenende kama raia
  rationale: Huhifadhi maana ya kuishi au kujiendesha pamoja na kidokezo cha uraia kilichomo katika kitenzi, ambacho kina umuhimu maalumu kwa wasomaji wa Filipi.
- source_word: εὐαγγελίου
  choice: habari njema
  rationale: Ni tafsiri wazi na ya kawaida ya εὐαγγέλιον katika Kiswahili cha sasa.
- source_word: Χριστοῦ
  choice: Masihi
  rationale: Hapa Χριστός inafanya kazi kama cheo; “Masihi” huhifadhi maana yake ya ‘aliyetiwa mafuta.’
- source_word: ἀκούω τὰ περὶ ὑμῶν
  choice: nipate kusikia habari zenu
  rationale: Ni Kiswahili cha asili kinachoakisi nahau ya Kigiriki ya kusikia mambo yanayowahusu.
- source_word: στήκετε
  choice: mnasimama imara
  rationale: Huhifadhi taswira na maana ya uthabiti katika kitenzi.
- source_word: ἐν ἑνὶ πνεύματι
  choice: katika roho moja
  rationale: Huhifadhi muundo wa Kigiriki na uwezekano wa kumaanisha umoja wa ndani, bila kufuta uwezekano wa kumrejelea Roho Mtakatifu.
- source_word: μιᾷ ψυχῇ
  choice: mkiwa na nafsi moja
  rationale: Huhifadhi taswira halisi ya ψυχή na wazo la umoja wa kusudi na moyo.
- source_word: συναθλοῦντες
  choice: mkishindana pamoja
  rationale: Huhifadhi taswira ya watu wanaojitahidi bega kwa bega katika mashindano.
- source_word: τῇ πίστει τοῦ εὐαγγελίου
  choice: kwa ajili ya imani ya habari njema
  rationale: Hufuata kwa karibu uhusiano wa maneno wa Kigiriki na kuacha wazi kama ni imani inayotokana na habari njema, yaliyomo katika habari njema, au imani katika habari njema.
theological_decisions:
- issue: Ikiwa πνεύματι inamrejelea Roho Mtakatifu au roho/mwelekeo mmoja wa waamini
  choice: katika roho moja
  alternative: katika Roho mmoja
  rationale: Ulinganifu na “nafsi moja” unaunga mkono umoja wa ndani wa waamini, lakini Kigiriki hakiondoi rejeo kwa Roho Mtakatifu; tanbihi huhifadhi mvutano huo.
- issue: Uhusiano wa τῇ πίστει na τοῦ εὐαγγελίου
  choice: kwa ajili ya imani ya habari njema
  alternative: kwa ajili ya imani katika habari njema
  rationale: Muundo wa karibu na Kigiriki hauamui kimya kimya kama imani ndiyo yaliyomo katika habari njema au kitendo cha kuziamini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima lakini kinachoeleweka kwa wasomaji wa kawaida. “Mwenende kama raia” kimetumiwa kuhifadhi kidokezo cha kiraia cha πολιτεύεσθε; sentensi ndefu imeendelezwa kwa kuwa mstari wa Kigiriki ni himizo moja lililounganishwa.
