review_pass:
  verdict: revise
  source_fidelity: Draft faithfully represents the emphatic controlling exhortation, the civic nuance of πολιτεύεσθε, the conditional contrast of Paul's presence or absence, communal unity, and the ambiguous genitive phrase concerning faith and the gospel. However, “mkishindana pamoja” can naturally suggest competing against one another in Swahili, whereas συναθλοῦντες means striving or contending alongside one another.
  naturalness: The register is clear Standard East African Swahili. “Mwenende kama raia” appropriately retains the civic coloring, though it is intentionally formal. Replacing the potentially adversarial “mkishindana pamoja” with “mkijitahidi pamoja” gives the intended cooperative sense naturally.
  terminology: “Habari njema,” “Masihi,” “roho moja,” and “nafsi moja” are suitable. The footnotes appropriately retain the possible Holy-Spirit reading and the alternative relation of faith to the gospel without forcing either interpretation.
  issues:
  - severity: medium
    issue: “mkishindana pamoja” may imply mutual competition.
    rationale: The Greek συναθλοῦντες depicts joint effort/contending side by side, not believers competing with each other. “Mkijitahidi pamoja” preserves the shared-struggle image without this misleading implication.
  revised_text: 'Jambo la muhimu ni hili tu: mwenende kama raia kwa namna inayostahili habari njema ya Masihi[a], ili kwamba, kama nikija na kuwaona au nikiwa mbali, nipate kusikia habari zenu kwamba mnasimama imara katika roho moja[b], mkiwa na nafsi moja[c] na mkijitahidi pamoja kwa ajili ya imani ya habari njema[d].'
