  text: οἱ δὲ ἐξ ⸂ἐριθείας τὸν Χριστὸν καταγγέλλουσιν, οὐχ ἁγνῶς, οἰόμενοι θλῖψιν ἐγείρειν τοῖς δεσμοῖς μου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/017.yaml
  text: But the others proclaim the Messiah out of selfish ambition[a], not sincerely[b], thinking to raise up affliction for me in my imprisonment.
translation:
  language: sw
  text: Lakini hao wengine wanamtangaza Masihi[a] kwa nia ya kujinufaisha, si kwa nia safi, wakidhani kwamba wataniletea dhiki katika kifungo changu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kristo.”
    reason: alternative_reading
  - marker: b
    text: Kwa maana halisi, “katika minyororo yangu”; yaani, katika kifungo changu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐριθείας
  choice: nia ya kujinufaisha
  rationale: Neno hili linaonyesha tamaa ya kujitafutia faida au cheo kwa ushindani wa kichama. Kauli hii ni ya kawaida na inaweka wazi kwamba tatizo ni kusudi lao la ubinafsi.
- source_word: Χριστόν
  choice: Masihi
  rationale: Hapa neno hilo linaonyesha cheo na utambulisho wa yule anayetangazwa, kwa hiyo “Masihi” linafaa; “Kristo” limehifadhiwa katika tanbihi kama tafsiri mbadala iliyozoeleka.
- source_word: καταγγέλλουσιν
  choice: wanamtangaza
  rationale: Kitenzi hiki kinahusu kutangaza hadharani na si lazima kuhubiri katika mazingira rasmi pekee.
- source_word: οὐχ ἁγνῶς
  choice: si kwa nia safi
  rationale: Katika muktadha huu usafi unaohusika ni usafi wa kusudi. Kauli hii ya Kiswahili inaeleza maana hiyo bila kudai kwamba ujumbe wenyewe ulikuwa wa uongo.
- source_word: οἰόμενοι
  choice: wakidhani kwamba
  rationale: Hii inahifadhi wazo la dhana au matarajio yaliyokuwa katika akili zao bila kuamua ikiwa wangetimiza lengo lao.
- source_word: θλῖψιν ἐγείρειν
  choice: watanizidishia dhiki
  rationale: Kauli ya Kigiriki kwa maana halisi ni kuinua au kuamsha dhiki. “Kuzidishia dhiki” ni Kiswahili cha asili kinachoonyesha kusababisha dhiki zaidi katika hali iliyokuwapo.
- source_word: τοῖς δεσμοῖς μου
  choice: katika kifungo changu
  rationale: δεσμοί ni “minyororo” kwa maana halisi, lakini hapa inawakilisha hali ya Paulo ya kufungwa. Tafsiri kuu inaweka maana wazi, huku maana halisi ikihifadhiwa katika tanbihi.
theological_decisions:
- issue: Tafsiri ya Χριστός
  choice: Masihi
  alternative: Kristo
  rationale: Kwa kuwa Yesu ndiye maudhui ya kutangazwa hapa, maana ya cheo cha Kimasihi inaonekana wazi. Tanbihi inahifadhi “Kristo,” ambayo pia inaweza kueleweka kama cheo au jina lililozoeleka.
- issue: Asili ya tatizo katika utangazaji wao
  choice: si kwa nia safi
  alternative: si kwa unyofu
  rationale: Muktadha unatofautisha nia za watangazaji, si lazima ukweli wa ujumbe wanaoutangaza. Tafsiri haiongezi hukumu kwamba mahubiri yao yalikuwa ya mafundisho ya uongo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imetumia “hao wengine” kuonyesha utofautishaji wa οἱ δέ na kundi lililotajwa kabla. “Watanizidishia dhiki” ni ya asili zaidi kuliko tafsiri neno kwa neno ya “kuinua dhiki,” huku ikihifadhi kusudi lao la kuongeza mateso ya Paulo.
