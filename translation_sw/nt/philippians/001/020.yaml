id: PHP.1.20
reference: Philippians 1:20
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: κατὰ τὴν ἀποκαραδοκίαν καὶ ἐλπίδα μου ὅτι ἐν οὐδενὶ αἰσχυνθήσομαι, ἀλλ’ ἐν πάσῃ παρρησίᾳ ὡς πάντοτε καὶ νῦν μεγαλυνθήσεται Χριστὸς ἐν τῷ σώματί μου, εἴτε διὰ ζωῆς εἴτε διὰ θανάτου.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/020.yaml
  text: in keeping with my eager expectation and hope that I will not be put to shame in anything[a], but that with all boldness, as always, even now Messiah will be magnified in my body[b], whether through life or through death.
translation:
  language: sw
  text: kulingana na matarajio yangu ya dhati na tumaini langu kwamba sitaaibishwa katika jambo lolote[a], bali kwamba kwa ujasiri kamili, kama sikuzote, hata sasa Masiya[b] atatukuzwa katika mwili wangu, iwe kwa uzima au kwa kifo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sitaaibika katika jambo lolote.”
    reason: lexical_alternative
  - marker: b
    text: Au, “Kristo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ
  choice: kulingana na
  rationale: Inaonyesha kwamba jambo linalotajwa linapatana na matarajio na tumaini la Paulo; tafsiri hii ni ya kawaida na huhifadhi uhusiano huo.
- source_word: ἀποκαραδοκίαν
  choice: matarajio yangu ya dhati
  rationale: Nomino hii adimu inaonyesha kutazamia kwa nguvu na kwa hamu; ‘ya dhati’ huwasilisha uzito huo kwa Kiswahili cha kawaida bila kuwa na muundo mzito.
- source_word: ἐλπίδα
  choice: tumaini langu
  rationale: Huhifadhi maana ya kawaida ya tumaini lenye kutazamia mema katika matumizi ya Paulo.
- source_word: ἐν οὐδενὶ
  choice: katika jambo lolote
  rationale: Huwasilisha ukanushaji mpana wa hali au jambo lolote kwa Kiswahili cha asili.
- source_word: αἰσχυνθήσομαι
  choice: sitaaibishwa
  rationale: Huhifadhi uwezekano wa maana ya nje au ya hadharani—kutotiwa aibu au kutofedheheshwa—katika ushuhuda wa Paulo.
- source_word: ἐν πάσῃ παρρησίᾳ
  choice: kwa ujasiri kamili
  rationale: παρρησία hapa ni ujasiri wa kusema au kushuhudia wazi; ‘kamili’ huwasilisha nguvu ya πάσῃ kwa Kiswahili cha asili.
- source_word: μεγαλυνθήσεται
  choice: atatukuzwa
  rationale: Kitenzi kina maana ya kumfanya au kumwonyesha kuwa mkuu. ‘Atatukuzwa’ ni cha asili na huhifadhi wazo la heshima na ukuu kuonekana.
- source_word: Χριστὸς
  choice: Masiya
  rationale: Hapa Χριστός bado ni cheo chenye maana, si jina tupu; ‘Masiya’ huhifadhi wazi maana ya cheo hicho.
- source_word: ἐν τῷ σώματί μου
  choice: katika mwili wangu
  rationale: Tafsiri ya moja kwa moja ni wazi na huhifadhi msisitizo wa ushuhuda unaotokea katika mwili wa Paulo.
- source_word: εἴτε διὰ ζωῆς εἴτε διὰ θανάτου
  choice: iwe kwa kuishi au kwa kufa
  rationale: Huwasilisha kwa Kiswahili cha kawaida njia mbili zinazolinganishwa—maisha ya Paulo na kifo chake—bila kulazimisha maana finyu ya chombo.
theological_decisions:
- issue: Jinsi ya kutafsiri Χριστός katika muktadha wa barua ya Paulo
  choice: Masiya
  alternative: Kristo
  rationale: Katika mstari huu cheo hicho bado kinaonyesha utambulisho na ukuu wa Yesu kama aliyetiwa mafuta. ‘Masiya’ huhifadhi maana hiyo, huku ‘Kristo’ likitajwa kama neno mbadala linalotumiwa sana.
- issue: Maana ya αἰσχυνθήσομαι
  choice: sitaaibishwa
  alternative: sitaaibika
  rationale: Umbo la Kigiriki linaweza kueleweka kuwa Paulo hatatiwa aibu hadharani au kwamba yeye mwenyewe hataona aibu. Matini kuu huhifadhi zaidi upande wa kudhihirishwa au kufedheheshwa, na tanbihi huhifadhi maana nyingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umewekwa karibu na sentensi ya Kigiriki lakini umelainishwa kwa ‘ujasiri kamili’ na ‘iwe kwa kuishi au kwa kufa’ ili usomeke kwa kawaida. Tanbihi zimepangwa kulingana na mahali pa alama katika matini, zikihifadhi utata halisi wa αἰσχυνθήσομαι na mbadala wa istilahi kwa Χριστός.
