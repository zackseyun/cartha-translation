  text: καὶ μὴ πτυρόμενοι ἐν μηδενὶ ὑπὸ τῶν ἀντικειμένων (ἥτις ⸂ἐστὶν αὐτοῖς⸃ ἔνδειξις ἀπωλείας, ⸀ὑμῶν δὲ σωτηρίας, καὶ τοῦτο ἀπὸ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/028.yaml
  text: and not being frightened in anything by those who oppose you[a]. This is a sign to them of destruction[c][b], but of your salvation—and this from God.
translation:
  language: sw
  text: wala msitishwe kwa njia yoyote na wale wanaowapinga[a]. Jambo hili ni ishara kwao ya kuangamia[b], lakini kwenu ya wokovu—na hili linatoka kwa Mungu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “msiogope” au “msishtushwe.”
    reason: lexical_alternative
  - marker: b
    text: Au “uthibitisho” au “dalili” ya kuangamia.
    reason: lexical_alternative
  - marker: c
    text: Maneno “hili linatoka kwa Mungu” yanaweza kurejelea wokovu hasa, au kwa upana zaidi jambo lote lililotangulia kuhusu ishara hiyo.
    reason: alternative_reading
lexical_decisions:
- source_word: πτυρόμενοι
  choice: msitishwe
  rationale: Kitenzi hiki huonyesha kushtuliwa, kuogopeshwa, au kutishwa. “Msitishwe” ni Kiswahili cha kawaida kinachoonyesha shinikizo la wapinzani bila kupunguza wazo la hofu.
- source_word: ἐν μηδενί
  choice: kwa njia yoyote
  rationale: Nahau hii ina maana ya kutotishwa katika jambo lolote au kwa namna yoyote; tafsiri hii ni ya asili na inadumisha maana yake pana.
- source_word: ἀντικειμένων
  choice: wale wanaowapinga
  rationale: Hali ya kitenzi cha Kigiriki inawaonyesha watu wanaoendelea kuwapinga waamini; usemi huu ni wazi na wa kawaida.
- source_word: ἔνδειξις
  choice: ishara
  rationale: Neno hili linaonyesha dalili au ushahidi unaoelekeza kwenye uhalisi fulani. “Ishara” ni fupi, wazi, na haidai uthibitisho wa kiwango kisichotajwa na maandishi.
- source_word: ἀπωλείας
  choice: kuangamia
  rationale: “Kuangamia” huwasilisha wazo la uharibifu au maangamizi ya hukumu bila kuingiza ufafanuzi wa ziada.
- source_word: σωτηρίας
  choice: wokovu
  rationale: “Wokovu” linadumisha uzito wa kitheolojia wa tendo la Mungu la kuokoa katika muktadha huu wa Paulo.
- source_word: τοῦτο ἀπὸ θεοῦ
  choice: na hili latoka kwa Mungu
  rationale: Tafsiri inadumisha kiwakilishi cha kuonyesha huku ikiacha wazi kama “hili” linarejelea wokovu hasa au ishara yote iliyotangulia.
theological_decisions:
- issue: Kirejelewa cha τοῦτο (“hili”)
  choice: 'Kimeachwa kwa makusudi bila kubainishwa katika matini kuu: “na hili latoka kwa Mungu.”'
  alternative: “Hili” linaweza kurejelea wokovu wao hasa, au kwa upana zaidi ishara inayodhihirishwa na kutotishwa kwao na matokeo yake kwa wapinzani.
  rationale: Kigiriki kinaruhusu virejelewa zaidi ya kimoja; kutobainisha kunahifadhi utata na mvutano wa kitheolojia uliopo katika chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi unafuata kwa karibu hoja ya Kigiriki huku ukitumia “Jambo hili” ili kirejelewa kisikike kwa kawaida kwa Kiswahili; “hili” ya mwisho inadumisha utata wa chanzo.
