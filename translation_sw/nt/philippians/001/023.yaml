  rationale: 'The revision improves idiomatic Standard East African Swahili while preserving every major feature of the Greek: pressure from two alternatives, Paul’s expressed desire, the euphemism “to depart,” union with Masihi, and the emphatic “far better.” It also makes the lexical footnote''s function clearer and retains correct anchor placement.'
