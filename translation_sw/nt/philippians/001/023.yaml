    issue: The wording “ninasongwa kati ya hayo mawili” is somewhat less idiomatic and lacks an explicit noun for the two alternatives.
    rationale: “Ninabanwa kati ya mambo hayo mawili” more naturally conveys the contextual force of being pressed between two options.
  - severity: low
    issue: “Shauku” can have a narrower connotation of enthusiastic zeal than the broad desire expressed by ἐπιθυμία.
    rationale: “Hamu” preserves the explicit sense of desire in more neutral contemporary Swahili.
  - severity: low
    issue: Footnote [a] begins with “Yaani,” rather than clearly identifying “kufa” as an alternative rendering.
    rationale: A lexical-alternative footnote should distinguish the explanatory alternative from the literal euphemism, without making death explicit in the main text.
