  text: συνέχομαι δὲ ἐκ τῶν δύο, τὴν ἐπιθυμίαν ἔχων εἰς τὸ ἀναλῦσαι καὶ σὺν Χριστῷ εἶναι, πολλῷ ⸀γὰρ μᾶλλον κρεῖσσον,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/023.yaml
  text: But I am hard pressed between the two[a], having the desire to depart and be with Messiah[b], for that is far better.
translation:
  language: sw
  text: Lakini ninabanwa kati ya mambo hayo mawili, nikiwa na hamu ya kuondoka[a] na kuwa pamoja na Masihi[b], kwa maana hilo ni bora zaidi sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kufa.” Kwa maana halisi, “kuondoka.”
    reason: lexical_alternative
  - marker: b
    text: 'Au, “Kristo.” Kigiriki: Christos, yaani, “Masihi.”'
    reason: alternative_rendering
lexical_decisions:
- source_word: συνέχομαι
  choice: ninasongwa
  rationale: Kitenzi hiki kinaonyesha kubanwa au kushikiliwa na mambo mawili yanayoshindana; “ninasongwa” huhifadhi wazo la shinikizo bila kulifanya tu kuwa mgawanyiko wa hisia.
- source_word: ἐκ τῶν δύο
  choice: kati ya hayo mawili
  rationale: Ingawa muundo wake wa moja kwa moja ni “kutokana na hayo mawili,” katika muktadha unamaanisha kubanwa kati ya mambo mawili yaliyotajwa.
- source_word: τὴν ἐπιθυμίαν ἔχων
  choice: nikiwa na shauku
  rationale: “Shauku” huwasilisha hamu kubwa ya Paulo, huku muundo wa “nikiwa na” ukidumisha uhusiano wa kishiriki uliopo katika Kigiriki.
- source_word: ἀναλῦσαι
  choice: kuondoka
  rationale: Neno hili linaweza kutumiwa kwa njia ya sitiari kuhusu kufa. “Kuondoka” huhifadhi taswira na kutolitaja kifo waziwazi kuliko chanzo.
- source_word: Χριστῷ
  choice: Masihi
  rationale: Χριστός hapa ni cheo kinachomaanisha Mtiwa-Mafuta; “Masihi” huonyesha maana hiyo wazi katika Kiswahili.
- source_word: πολλῷ γὰρ μᾶλλον κρεῖσσον
  choice: kwa maana hilo ni bora zaidi kwa kiasi kikubwa
  rationale: Usemi wa Kigiriki unasisitiza sana ulinganisho; tafsiri hii huhifadhi nguvu ya “far better” kwa Kiswahili cha kawaida na kinachoeleweka.
theological_decisions:
- issue: Ushirika na Masihi baada ya kuondoka
  choice: kuondoka na kuwa pamoja na Masihi
  alternative: kufa na kwenda mbinguni mara moja
  rationale: Tafsiri inabaki na madai ya wazi ya Kigiriki—kuondoka na kuwa pamoja na Masihi—bila kuongeza maelezo ya wakati, mahali, au utaratibu ambayo mstari wenyewe hautoi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Ninasongwa” ni cha karibu na nguvu ya kitenzi cha Kigiriki, na “nikiwa na shauku” hudumisha muundo wa sentensi bila kuwa mzito kupita kiasi.
