id: PHP.1.1
reference: Philippians 1:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Παῦλος καὶ Τιμόθεος δοῦλοι ⸂Χριστοῦ Ἰησοῦ⸃ πᾶσιν τοῖς ἁγίοις ἐν Χριστῷ Ἰησοῦ τοῖς οὖσιν ἐν Φιλίπποις σὺν ἐπισκόποις καὶ διακόνοις·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/001.yaml
  text: 'Paul and Timothy[a], servants of Messiah Jesus, to all the saints in Messiah Jesus who are in Philippi[c][b], together with the overseers and deacons:'
translation:
  language: sw
  text: 'Paulo na Timotheo, watumwa[b] wa Masihi[a] Yesu, kwa watakatifu wote walio katika Masihi Yesu huko Filipi, pamoja na waangalizi[c] na mashemasi:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Kristo.” Neno la Kigiriki Χριστός ni cheo chenye maana ya “Mtiwa-Mafuta.”
    reason: alternative_reading
  - marker: b
    text: Au “watumishi.”
    reason: lexical_alternative
  - marker: c
    text: Au “maaskofu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλοι
  choice: watumwa
  rationale: Neno hili linaonyesha hali ya kuwa chini ya mamlaka ya bwana, si huduma ya hiari tu; “watumwa” huhifadhi uzito huo wa Kigiriki.
- source_word: Χριστοῦ Ἰησοῦ / Χριστῷ Ἰησοῦ
  choice: Masihi Yesu / katika Masihi Yesu
  rationale: Χριστός ni cheo chenye maana ya Mtiwa-Mafuta; “Masihi” huhifadhi maana yake ya kicheo, huku “katika” ikidumisha usemi wa Paulo kuhusu muungano na Masihi.
- source_word: πᾶσιν τοῖς ἁγίοις
  choice: kwa watakatifu wote
  rationale: Hili ni tamko fupi na la kawaida la Kiswahili linalohifadhi muundo wa anwani na utambulisho wao kama watu waliowekwa wakfu.
- source_word: τοῖς οὖσιν ἐν Φιλίπποις
  choice: walio ... huko Filipi
  rationale: Kishazi tegemezi huwasilisha kwa Kiswahili cha kawaida maana ya wale walioko Filipi, bila kulazimisha muundo wa Kigiriki.
- source_word: σὺν
  choice: pamoja na
  rationale: Huhifadhi wazi maana ya ushirika au kuhusishwa pamoja.
- source_word: ἐπισκόποις
  choice: waangalizi
  rationale: Hutafsiri maana ya msingi ya neno la Kigiriki bila kuingiza moja kwa moja maana za baadaye za cheo cha askofu.
- source_word: διακόνοις
  choice: mashemasi
  rationale: Katika kuorodheshwa pamoja na waangalizi, neno linaelekea kutaja jukumu linalotambulika katika kusanyiko; “mashemasi” ndiyo istilahi iliyozoeleka.
theological_decisions:
- issue: Tafsiri ya Χριστός katika salamu ya Paulo
  choice: Masihi Yesu
  alternative: Kristo Yesu
  rationale: “Masihi” hutafsiri cheo na kuhifadhi maana yake ya Mtiwa-Mafuta; “Kristo” limezoeleka zaidi lakini linaweza kusikika kama jina binafsi.
- issue: Tafsiri ya δοῦλοι katika Wafilipi 1:1
  choice: watumwa
  alternative: watumishi
  rationale: “Watumwa” huhifadhi hali ya kumilikiwa na kuwa chini ya mamlaka inayodokezwa na δοῦλοι; “watumishi” ni laini zaidi na inaweza kuficha kipengele hicho.
- issue: Tafsiri ya ἐπισκόποις
  choice: waangalizi
  alternative: maaskofu
  rationale: “Waangalizi” huonyesha kazi inayotajwa na neno la Kigiriki bila kuamua kwamba cheo hicho kilikuwa sawa katika kila jambo na uaskofu wa mifumo ya kanisa ya baadaye.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya salamu ya barua lakini kinachoeleweka kwa msomaji wa kawaida. “Huko Filipi” ni ya asili zaidi kuliko kurudia “katika” kwa mahali, huku “katika Masihi Yesu” ikihifadhi usemi muhimu wa Paulo. Alama zote za tanbihi zimewekwa mara baada ya maneno yanayohusika.
