  source_fidelity: 'Tafsiri inafuata kwa uaminifu muundo na maana ya Kigiriki: Paulo na Timotheo wanajitambulisha kama δοῦλοι (“watumwa”) wa Masihi Yesu; anwani inaelekezwa kwa watakatifu wote walio katika Masihi Yesu na walioko Filipi; kisha inawajumuisha waangalizi na mashemasi. “Pamoja na” huwakilisha vizuri σὺν, na “huko Filipi” huwasilisha kwa kawaida ἐν Φιλίπποις bila kubadilisha maana.'
