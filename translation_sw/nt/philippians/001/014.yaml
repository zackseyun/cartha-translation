id: PHP.1.14
reference: Philippians 1:14
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ τοὺς πλείονας τῶν ἀδελφῶν ἐν κυρίῳ πεποιθότας τοῖς δεσμοῖς μου περισσοτέρως τολμᾶν ἀφόβως τὸν ⸀λόγον λαλεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/014.yaml
  text: And most of the brothers[a], having become confident in the Lord because of my chains, dare all the more to speak the word fearlessly.
translation:
  language: sw
  text: Na walio wengi miongoni mwa ndugu[a], wakiwa wamepata ujasiri katika Bwana kwa sababu ya minyororo yangu, wanathubutu hata zaidi kusema neno bila woga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ndugu na dada”; hapa neno hili huenda linawarejelea waamini wenzao kwa upana zaidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλείονας
  choice: wengi
  rationale: Pamoja na kibainishi na umilikishi wa sehemu, neno hili linaonyesha walio wengi miongoni mwa ndugu, si ongezeko tu la idadi.
- source_word: ἀδελφῶν
  choice: ndugu
  rationale: Neno la Kigiriki ni wingi wa kiume; Kiswahili 'ndugu' huhifadhi usemi huo huku pia likiweka wazi katika tanbihi kwamba huenda kundi lote la waamini linakusudiwa.
- source_word: ἐν κυρίῳ
  choice: katika Bwana
  rationale: Huu ni usemi wa kawaida wa Paulo unaoonyesha eneo au msingi wa ujasiri wao, nao umehifadhiwa bila kuufafanua kupita kiasi.
- source_word: πεποιθότας
  choice: kwa kuwa wamepata ujasiri
  rationale: Kauli timilifu inaonyesha kwamba walifikia hali ya kuwa na ujasiri na sasa wanaendelea kuwa katika hali hiyo.
- source_word: τοῖς δεσμοῖς μου
  choice: kwa sababu ya minyororo yangu
  rationale: Tafsiri hii huhifadhi picha halisi ya minyororo na kueleza nguvu ya kisababishi inayofaa katika muktadha.
- source_word: περισσοτέρως
  choice: hata zaidi
  rationale: Hii ni kauli ya kawaida ya Kiswahili inayohifadhi nguvu ya ulinganisho ya kielezi.
- source_word: τολμᾶν
  choice: wanathubutu
  rationale: Kitenzi hiki huonyesha azimio la ujasiri la kufanya jambo licha ya hatari au hofu.
- source_word: ἀφόβως
  choice: bila woga
  rationale: Usemi huu unaonyesha moja kwa moja kutokuwapo kwa hofu, badala ya maana pana zaidi ya kuwa jasiri.
- source_word: τὸν λόγον
  choice: neno
  rationale: Hii ndiyo tafsiri ya karibu zaidi ya maandishi; katika muktadha yaelekea ni ujumbe unaohubiriwa, lakini 'wa Mungu' halijaongezwa kwa kuwa halipo katika Kigiriki.
- source_word: λαλεῖν
  choice: kusema
  rationale: Kitenzi cha Kigiriki ni cha jumla kuhusu kunena; 'kusema' huepuka kuongeza maana maalumu ya kuhubiri ambayo haijaelezwa moja kwa moja.
theological_decisions:
- issue: Upeo wa ἀδελφοί
  choice: Neno 'ndugu' limetumiwa katika maandishi makuu, na tanbihi inaeleza uwezekano wa kuwahusu waamini wa kiume na wa kike.
  alternative: '''ndugu wa kiume na wa kike'' au ''waamini wenzangu'''
  rationale: Umbo la Kigiriki ni wingi wa kiume, lakini katika muktadha huenda linarejelea jumuiya pana ya waamini. Tafsiri kuu huhifadhi umbo la chanzo, huku tanbihi ikihifadhi uwezekano wa maana jumuishi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umewekwa wazi na wa kawaida huku picha ya 'minyororo,' usemi wa Paulo 'katika Bwana,' na utata wa upeo wa 'ndugu' vikihifadhiwa.
