  text: καὶ τοῦτο προσεύχομαι ἵνα ἡ ἀγάπη ὑμῶν ἔτι μᾶλλον καὶ μᾶλλον περισσεύῃ ἐν ἐπιγνώσει καὶ πάσῃ αἰσθήσει,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/009.yaml
  text: 'And this I pray: that your love may abound still more and more in knowledge and all discernment[b][a],'
translation:
  language: sw
  text: 'Na hili ndilo ninaloomba: kwamba upendo wenu uzidi kuongezeka zaidi na zaidi katika maarifa[a] na utambuzi wote[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “pamoja na maarifa”; kihusishi cha Kigiriki kinaweza pia kueleweka kwa maana ya uhusiano wa karibu.
    reason: lexical_alternative
  - marker: b
    text: Au “ufahamu wote” au “uwezo wa kutambua mema na mabaya kwa kila hali.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ τοῦτο
  choice: Nami ninaomba hivi
  rationale: Kaί inaendeleza mawazo ya awali, na τοῦτο inaelekeza kwenye yaliyomo katika ombi. Muundo huu ni wa kawaida katika Kiswahili na haupotezi nguvu ya kiunganishi wala ya kiwakilishi.
- source_word: προσεύχομαι
  choice: ninaomba
  rationale: Wakati uliopo unaonyesha tendo la Paulo linaloendelea; 'ninaomba' ni usemi wa asili katika Kiswahili bila kulazimisha maelezo ya ziada.
- source_word: ἵνα
  choice: kwamba
  rationale: Hapa ἵνα inatanguliza yaliyomo au kusudi la ombi. 'Kwamba' huunganisha kwa kawaida na kitenzi 'ninaomba' huku ikihifadhi uhusiano huo.
- source_word: ἀγάπη ὑμῶν
  choice: upendo wenu
  rationale: Hii ni tafsiri ya moja kwa moja, iliyo wazi na ya kawaida ya kirai hicho.
- source_word: ἔτι μᾶλλον καὶ μᾶλλον περισσεύῃ
  choice: uzidi kuongezeka zaidi na zaidi
  rationale: '''Uzidi'' huwakilisha ἔτι na hali ya utegemezi baada ya ἵνα, huku marudio ''zaidi na zaidi'' yakihifadhi msisitizo wa μᾶλλον καὶ μᾶλλον. ''Kuongezeka'' hutoa picha ya wingi kwa lugha ya kawaida.'
- source_word: ἐν ἐπιγνώσει
  choice: katika ujuzi
  rationale: Inahifadhi muundo wa kihusishi ἐν na maana pana ya ἐπίγνωσις bila kuiongezea kwa lazima dhana ya 'ujuzi kamili.'
- source_word: πάσῃ αἰσθήσει
  choice: utambuzi wote
  rationale: Katika muktadha huu αἴσθησις ni uwezo wa kutambua kwa busara, hasa katika mambo ya kimaadili na kimatendo, si hisi za mwili tu. 'Utambuzi' ni neno la sasa na linaloeleweka, na 'wote' huhifadhi upana wa πάσῃ.
