lexical_decisions:
- source_word: πεπληρωμένοι
  choice: mkiwa mmejazwa
  rationale: Kitenzi timilifu tendwa kinaonyesha hali iliyotokana na tendo lililotangulia; usemi huu pia huhifadhi umbo la kirai tegemezi kinachoungana na mstari uliotangulia.
- source_word: καρπὸν
  choice: tunda
  rationale: Umoja wa neno la Kigiriki umehifadhiwa, pamoja na taswira ya matokeo ya kiroho au kimaadili.
- source_word: δικαιοσύνης
  choice: haki
  rationale: “Haki” ni tafsiri pana na ya kawaida ya δικαιοσύνη katika Kiswahili, na haiamui kimyakimya kama uhusiano huu unamaanisha tabia ya haki, tendo la kutenda yaliyo sawa, au tunda linaloitwa haki.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: linalokuja kupitia Yesu Masihi
  rationale: διά pamoja na hali ya genitivi huonyesha njia au uwakala; “kupitia” huhifadhi wazo hilo, huku “linalokuja” likifanya uhusiano wake na “tunda” uwe wazi na wa kawaida kwa Kiswahili.
- source_word: Χριστοῦ
  choice: Masihi
  rationale: Neno limetafsiriwa kama cheo chenye maana, si kama jina la pili lisilotafsiriwa.
- source_word: εἰς δόξαν καὶ ἔπαινον θεοῦ
  choice: kwa utukufu na sifa ya Mungu
  rationale: “Kwa” hapa huwasilisha lengo au matokeo yanayoelekezwa kwenye utukufu na sifa ya Mungu kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Maana ya “tunda la haki”
  choice: Muundo “tunda la haki” umehifadhiwa bila kufafanua kupita kiasi aina ya uhusiano wa genitivi.
  alternative: Tunda linalojumuisha haki; tunda lenye sifa ya haki; au matokeo yanayohesabiwa kuwa haki.
  rationale: Muktadha unaelekea kwenye matokeo ya kimaadili au kiroho yanayotokana na Yesu Masihi, lakini muundo wa Kigiriki unaweza kueleweka kwa zaidi ya njia moja. Tafsiri haifungi uwezekano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Kirai kinaanza kwa “mkiwa” kwa kuwa ni mwendelezo wa kisarufi wa mstari uliotangulia.
