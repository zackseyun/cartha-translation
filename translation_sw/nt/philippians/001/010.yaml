lexical_decisions:
- source_word: δοκιμάζειν
  choice: kupambanua
  rationale: Kitenzi hiki kinaweza kumaanisha kujaribu, kuchunguza, na kisha kuthibitisha au kukubali. “Kupambanua” ni Kiswahili cha kawaida kinachoonyesha uchunguzi na uamuzi wa kimaadili katika muktadha huu.
- source_word: τὰ διαφέροντα
  choice: mambo yaliyo bora
  rationale: Ingawa kwa karibu zaidi ni “mambo yanayotofautiana,” kirai hiki katika muktadha kinaelekea kumaanisha mambo yaliyo bora au yenye uzito zaidi. Tafsiri hii inadumisha nguvu ya ulinganisho.
- source_word: εἰλικρινεῖς
  choice: safi
  rationale: Neno linaweza kueleza usafi au unyofu. “Safi” linafaa katika muktadha wa maadili na linaungana kwa kawaida na “bila lawama.”
- source_word: ἀπρόσκοποι
  choice: bila lawama
  rationale: Neno linaweza kumaanisha kutokwaza, kutokukwazika, au kutokuwa na kosa la kulaumiwa. “Bila lawama” linawasilisha kwa ufupi maisha yasiyostahili kulaumiwa huku uwezekano mwingine ukibaki ndani ya wigo wa maana.
- source_word: εἰς ἡμέραν Χριστοῦ
  choice: kwa siku ya Masihi
  rationale: εἰς hapa inaelekeza kwenye lengo au siku inayotarajiwa. “Masihi” huhifadhi maana ya Χριστός kama cheo katika kirai hiki cha kieskatolojia.
theological_decisions:
- issue: Tafsiri ya Χριστοῦ katika kirai εἰς ἡμέραν Χριστοῦ
  choice: Masihi
  alternative: Kristo
  rationale: Katika kirai hiki Χριστός inafanya kazi kama cheo, kwa hiyo “Masihi” inaonyesha maana yake wazi. Tafsiri ya jadi “Kristo” imehifadhiwa katika tanbihi.
