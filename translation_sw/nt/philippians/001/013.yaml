  text: so that my chains in Messiah have become known throughout the whole imperial guard and to all the rest[b][a],
translation:
  language: sw
  text: Hivyo minyororo yangu katika Masihi imejulikana wazi katika kikosi chote cha walinzi wa kifalme[b] na kwa wengine wote.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “minyororo yangu ni kwa ajili ya Masihi.”
    reason: alternative_reading
  - marker: b
    text: Au, “katika praitorio yote”; neno hili linaweza kumaanisha kikosi cha walinzi wa kifalme au makao makuu/makazi ya mtawala.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: hivyo
  rationale: Huonyesha matokeo ya kauli iliyotangulia kwa Kiswahili cha kawaida na kwa ufupi.
- source_word: τοὺς δεσμούς μου
  choice: minyororo yangu
  rationale: Huhifadhi taswira halisi ya vifungo vya Paulo, huku kwa muktadha ikimaanisha hali yake ya kufungwa.
- source_word: φανεροὺς ... γενέσθαι
  choice: ikajulikana
  rationale: Huonyesha kwamba sababu au maana ya minyororo yake ilikuja kutambuliwa wazi.
- source_word: ἐν Χριστῷ
  choice: ni kwa ajili ya Masihi
  rationale: Katika muktadha huu inaeleza kwa njia ya kawaida kwamba kufungwa kwake kulihusiana na uaminifu wake kwa Masihi; maana ya karibu zaidi ya ‘katika Masihi’ imehifadhiwa katika tanbihi.
- source_word: Χριστῷ
  choice: Masihi
  rationale: Huhifadhi Χριστός kama cheo chenye maana, si kama jina tu.
- source_word: ἐν ὅλῳ τῷ πραιτωρίῳ
  choice: katika kikosi kizima cha walinzi wa mfalme
  rationale: Hutoa maana inayowezekana zaidi ya kundi la walinzi wa mtawala, huku utata wa neno πραιτώριον ukihifadhiwa katika tanbihi.
- source_word: τοῖς λοιποῖς πᾶσιν
  choice: kwa wengine wote
  rationale: Huhifadhi upanuzi wa taarifa kutoka kwa walinzi hadi kwa watu wengine wote.
theological_decisions:
- issue: Maana ya ἐν Χριστῷ kuhusiana na minyororo ya Paulo
  choice: minyororo yake ni kwa ajili ya Masihi
  alternative: minyororo yake iko ‘katika Masihi’
  rationale: Muktadha unasisitiza kwamba sababu ya kufungwa kwake ilijulikana, lakini kirai cha Kigiriki kinaweza pia kusisitiza hali yake ya kuwa katika Masihi; uwezekano huo haujaondolewa bali umewekwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio wa sentensi umefanywa wa kawaida kwa Kiswahili bila kuondoa taswira ya ‘minyororo’ wala utata halisi wa ἐν Χριστῷ na πραιτώριον.
