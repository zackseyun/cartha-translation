base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/006.yaml
  text: 'I am confident of this very thing: that he who began a good work among you will bring it to completion at the day of Messiah Jesus.'
translation:
  language: sw
  text: 'Nina hakika kabisa kuhusu jambo hili: kwamba yeye aliyeanza kazi njema miongoni mwenu[a] ataikamilisha hadi siku ya Masihi Yesu[b][c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ndani yenu.”
    reason: lexical_alternative
  - marker: b
    text: Kwa mapokeo, “Kristo Yesu.”
    reason: lexical_alternative
  - marker: c
    text: Kauli “ataikamilisha hadi siku ya Masihi Yesu” inaweza pia kutafsiriwa, “ataikamilisha ifikapo siku ya Masihi Yesu.”
    reason: translation_alternative
lexical_decisions:
- source_word: πεποιθὼς αὐτὸ τοῦτο
  choice: Nina hakika kabisa kwamba
  rationale: Kauli hii ya asili inaonyesha uhakika wenye msisitizo. Kiswahili hiki ni cha kawaida na kinaunganisha kishiriki hicho na mtazamo wa Paulo bila tafsiri ngumu ya neno kwa neno.
- source_word: ὁ ἐναρξάμενος
  choice: yeye aliyeanza
  rationale: Inadumisha mhusika binafsi ambaye, kwa muktadha, ni Mungu, bila kuongeza jina lisilotajwa wazi katika mstari.
- source_word: ἐν ὑμῖν
  choice: miongoni mwenu
  rationale: Kiwakilishi ni cha wingi na kinawaelekea waumini wa Filipi kwa pamoja; ‘miongoni mwenu’ kinaonyesha upeo huo wa kijumuiya huku uwezekano wa ‘ndani yenu’ ukihifadhiwa katika tanbihi.
- source_word: ἔργον ἀγαθὸν
  choice: kazi njema
  rationale: Ni tafsiri ya moja kwa moja, ya kawaida, isiyoongeza maelezo yasiyokuwamo katika Kigiriki.
- source_word: ἐπιτελέσει
  choice: ataikamilisha
  rationale: Kitenzi kinaonyesha kuifikisha kazi kwenye mwisho wake; ‘ataikamilisha’ ni kifupi, wazi, na cha asili katika Kiswahili.
- source_word: ἄχρι ἡμέρας
  choice: hadi siku ya
  rationale: ‘Hadi’ kinadumisha mpaka wa wakati unaoonyeshwa na ἄχρι bila kulazimisha zaidi ikiwa ukamilisho unatokea siku hiyo au unafikiwa kabla yake.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Masihi Yesu
  rationale: Χριστός hapa ni cheo; ‘Masihi’ hutafsiri maana ya cheo hicho, huku namna ya jadi ‘Kristo Yesu’ ikitajwa katika tanbihi.
theological_decisions:
- issue: Iwapo kazi ya Mungu ielezwe kuwa ndani ya kila mtu binafsi au miongoni mwa jumuiya ya waumini
  choice: miongoni mwenu
  alternative: ndani yenu
  rationale: Wingi wa ὑμῖν na mazingira ya barua kwa kanisa zima yanaunga mkono maana ya kijumuiya, lakini tanbihi inadumisha uwezekano wa maana inayohusu kilicho ndani yao.
- issue: Uhusiano wa kukamilishwa kwa kazi na siku ya Masihi Yesu
  choice: hadi siku ya
  alternative: ifikapo siku ya
  rationale: Tafsiri kuu inadumisha mpaka wa wakati wa ἄχρι na kuepuka kuamua kimya kimya kama kazi itakamilishwa hasa siku hiyo au kufikia siku hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imewekwa kwa mtiririko wa kawaida wa Kiswahili, huku msisitizo wa uhakika, upeo wa kijumuiya, na mpaka wa wakati wa Kigiriki vikidumishwa.
