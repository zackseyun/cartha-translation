  text: χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/002.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a][b][c].
translation:
  language: sw
  text: Neema na amani kutoka kwa Mungu Baba yetu na Bwana Yesu Masihi[a] ziwe nanyi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, Kristo.
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: Neema
  rationale: “Neema” ni neno la kawaida na lenye uzito unaofaa kwa salamu ya Paulo, likidumisha wazo la fadhili ya Mungu bila kulifafanua kupita kiasi.
- source_word: ὑμῖν
  choice: ziwe nanyi
  rationale: Katika salamu na baraka za Kiswahili, “ziwe nanyi” ni usemi wa asili unaowasilisha vizuri dativu “kwenu,” ingawa kitenzi hakijaandikwa wazi katika Kigiriki.
- source_word: εἰρήνη
  choice: amani
  rationale: “Amani” ni sawia ya moja kwa moja na ya kawaida, na inadumisha upana wa wazo la εἰρήνη katika salamu hii.
- source_word: ἀπὸ
  choice: kutoka kwa
  rationale: “Kutoka kwa” huonyesha chanzo kwa uwazi na kwa Kiswahili cha kawaida.
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: Mungu Baba yetu
  rationale: Muundo huu unamweleza Mungu kuwa Baba yetu na ni wa kawaida katika Kiswahili cha heshima cha Kikristo.
- source_word: κυρίου
  choice: Bwana
  rationale: “Bwana” ndiyo tafsiri ya kawaida ya κύριος na inadumisha uzito wake wa kiukristo katika muktadha huu.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesu Masihi
  rationale: “Masihi” huwasilisha maana ya cheo Χριστός badala ya kukinakili tu; tanbihi inadumisha pia umbo la jadi “Kristo.”
theological_decisions:
- issue: Jinsi ya kutafsiri Χριστοῦ katika salamu ya Paulo
  choice: Masihi
  alternative: Kristo
  rationale: Χριστός inaweza kuwa cheo au kuwa karibu na jina maalumu katika matumizi ya Paulo. “Masihi” huweka wazi maana ya cheo, huku “Kristo” likitolewa katika tanbihi kwa sababu ndilo umbo la jadi na linaweza kuakisi matumizi yanayofanana na jina katika salamu hii.
- issue: Chanzo cha neema na amani katika kirai ἀπὸ θεοῦ... καὶ κυρίου...
  choice: Mungu Baba yetu na Bwana Yesu Masihi wote wanatajwa chini ya kihusishi kimoja cha chanzo
  alternative: Kurudia “kutoka kwa” kabla ya Bwana Yesu Masihi
  rationale: Kigiriki kina ἀπό mara moja na kinaunganisha Mungu Baba yetu na Bwana Yesu Masihi kwa καί. Tafsiri haiongezi ufafanuzi wa kiteolojia zaidi ya muundo huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mpangilio umefanywa kuwa wa asili kwa Kiswahili kwa kuweka “ziwe nanyi” mwishoni, huku uhusiano wa neema na amani na chanzo chake ukidumishwa.
