lexical_decisions:
- source_word: Εὐχαριστῶ
  choice: Ninamshukuru
  rationale: Kitenzi cha wakati uliopo, nafsi ya kwanza umoja; 'ninamshukuru' ni Kiswahili cha kawaida na huhifadhi tendo la moja kwa moja la kutoa shukrani.
- source_word: τῷ θεῷ μου
  choice: Mungu wangu
  rationale: Yambwa katika hali ya dative pamoja na εὐχαριστέω hutolewa kwa kawaida katika Kiswahili kama yambwa wa moja kwa moja; umilikishi 'wangu' umehifadhiwa.
- source_word: ἐπὶ
  choice: kila ninapo-
  rationale: ἐπὶ pamoja na dative hapa huonyesha tukio au wakati unaochochea shukrani. Muundo 'kila ninapowakumbuka' ni wa asili katika Kiswahili na hauamui kwamba kumbukumbu ndiyo sababu badala ya tukio.
- source_word: πάσῃ
  choice: kila
  rationale: Pamoja na nomino ya umoja μνείᾳ, 'kila' huhifadhi maana ya ugawaji kwa njia ya kawaida katika Kiswahili.
- source_word: μνείᾳ
  choice: ninapowakumbuka
  rationale: Nomino ya Kigiriki imetolewa kwa kishazi cha kitenzi ili kupata Kiswahili cha asili huku ikihifadhi maana ya kukumbuka.
- source_word: ὑμῶν
  choice: -wa-
  rationale: Kiambishi cha yambwa '-wa-' huonyesha kuwa wanaokumbukwa ni watu wengi, jambo linalohifadhi wingi wa ὑμῶν.
