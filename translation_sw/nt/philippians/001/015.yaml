    rationale: μέν chiefly coordinates the contrast with δέ here; “kweli” can add an unnecessary assertion-like emphasis. The contrast is naturally carried by “lakini.”
  - severity: low
    issue: “mashindano” for ἔρις
    rationale: Although possible, “mashindano” may evoke neutral competitions. “Ushindani” more directly expresses the hostile or self-seeking rivalry intended here.
  - severity: low
    issue: Missing lexical-alternative footnote for Masihi
    rationale: The English POB audit trail supplies a Christ/Kristo alternative for Χριστός. Including the corresponding Swahili note preserves that translation decision and its anchor.
