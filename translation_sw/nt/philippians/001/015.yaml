  text: Τινὲς μὲν καὶ διὰ φθόνον καὶ ἔριν, τινὲς δὲ καὶ δι’ εὐδοκίαν τὸν Χριστὸν κηρύσσουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/015.yaml
  text: Some indeed proclaim the Messiah because of envy and rivalry[a], but others because of goodwill.
translation:
  language: sw
  text: Wengine wanamtangaza Masihi[a] kwa sababu ya wivu na ushindani, lakini wengine kwa nia njema.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kristo.” Cheo cha Kigiriki ni Χριστός (Christos).
    reason: lexical_alternative
lexical_decisions:
- source_word: Τινὲς μὲν … τινὲς δὲ
  choice: Wengine kweli … lakini wengine
  rationale: Muundo huu unaonyesha makundi mawili yanayotofautishwa. “Wengine … wengine” ni Kiswahili cha kawaida, huku “kweli … lakini” kikibeba msisitizo na utofautishaji wa μέν … δέ.
- source_word: διὰ φθόνον
  choice: kwa sababu ya wivu
  rationale: διά pamoja na hali ya accusative inaonyesha sababu au msukumo hapa; tafsiri hii inaweka wazi nia ya wahubiri hao.
- source_word: ἔριν
  choice: mashindano
  rationale: Katika muktadha huu neno linahusu ushindani wa kiuhasama kati ya watu. “Mashindano” linaeleza vizuri nia ya kushindana, badala ya ugomvi kwa ujumla.
- source_word: δι’ εὐδοκίαν
  choice: kwa nia njema
  rationale: Kauli hii inatofautishwa na wivu na mashindano, hivyo inaonyesha msukumo mwema. “Kwa nia njema” ni ya kawaida na inaeleweka kwa urahisi katika Kiswahili cha sasa.
- source_word: τὸν Χριστόν
  choice: Masihi
  rationale: Χριστός hapa ina kazi ya cheo cha yule aliyetiwa mafuta. “Masihi” huhifadhi maana hiyo kwa lugha ya kawaida ya kibiblia.
- source_word: κηρύσσουσιν
  choice: wanamtangaza
  rationale: Kitenzi hiki huhusu kutangaza ujumbe hadharani. “Wanamtangaza” kinahifadhi maana ya kiheraldi bila kuifanya iwe tendo rasmi la mahubiri ya kanisani pekee.
theological_decisions:
- issue: Χριστός kama cheo au jina
  choice: Masihi
  alternative: Kristo
  rationale: Kibainishi τόν kinaunga mkono usomaji wa Χριστός kama cheo katika sentensi hii. “Masihi” huonyesha wazi cheo hicho bila kuingiza msimamo wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi umehifadhi utofautishaji wa makundi mawili na sababu zao, huku καί zisizotafsiriwa zote kimitambo ili kuepuka Kiswahili kisicho cha kawaida.
