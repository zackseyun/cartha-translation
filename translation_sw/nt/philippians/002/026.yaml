  text: since he was longing for all of you and was deeply distressed because you heard that he was sick[a].
translation:
  language: sw
  text: Kwa kuwa alikuwa akiwatamani sana ninyi nyote, naye alifadhaika sana kwa sababu mlisikia kwamba alikuwa mgonjwa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa sababu alikuwa amesikia kwamba ninyi mlisikia kuwa alikuwa mgonjwa.”
    reason: Usomaji au uelewa mbadala.
lexical_decisions:
- source_word: ἐπειδὴ
  choice: kwa kuwa
  rationale: Kiunganishi hiki kinaonyesha sababu inayofafanua kwa nini Epafrodito alitumwa arudi; “kwa kuwa” ni cha kawaida na huhifadhi maana ya kisababishi.
- source_word: ἐπιποθῶν ἦν
  choice: alikuwa akiwatamani
  rationale: Muundo wa kitenzi-shirikishi cha wakati uliopo pamoja na ἦν unaonyesha hali iliyoendelea wakati uliopita; “alikuwa akiwatamani” huhifadhi mwendelezo huo na shauku ya kuwa pamoja nao.
- source_word: πάντας ὑμᾶς
  choice: ninyi nyote
  rationale: Huhifadhi msisitizo wa πάντας kwamba hamu yake iliwahusu wote bila kuacha yeyote.
- source_word: ἀδημονῶν
  choice: alikuwa na huzuni kubwa
  rationale: Neno hili huonyesha dhiki nzito ya kihisia, si wasiwasi mdogo tu; usemi huu ni wa kawaida na wenye uzito unaofaa katika Kiswahili.
- source_word: διότι
  choice: kwa sababu
  rationale: Hutoa sababu ya moja kwa moja ya huzuni yake.
- source_word: ἠκούσατε
  choice: mlisikia
  rationale: Hutafsiri moja kwa moja nafsi ya pili wingi na tendo la wakati uliopita.
- source_word: ὅτι ἠσθένησεν
  choice: kwamba alikuwa mgonjwa
  rationale: Katika muktadha huu ἀσθενέω inahusu ugonjwa wa mwili; “alikuwa mgonjwa” ni Kiswahili cha kawaida, ingawa aoristi inaweza pia kueleweka kama kuugua au kupata ugonjwa.
