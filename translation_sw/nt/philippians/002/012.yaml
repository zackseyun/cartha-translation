id: PHP.2.12
reference: Philippians 2:12
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ὥστε, ἀγαπητοί μου, καθὼς πάντοτε ὑπηκούσατε, μὴ ὡς ἐν τῇ παρουσίᾳ μου μόνον ἀλλὰ νῦν πολλῷ μᾶλλον ἐν τῇ ἀπουσίᾳ μου, μετὰ φόβου καὶ τρόμου τὴν ἑαυτῶν σωτηρίαν κατεργάζεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/012.yaml
  text: So then[a], my beloved, just as you have always obeyed—not only in my presence, but now much more in my absence—work out your own salvation with fear and trembling[c][b],
translation:
  language: sw
  text: Kwa hiyo, wapendwa wangu, kama vile mlivyotii sikuzote—si wakati nilipokuwapo tu, bali sasa zaidi sana nisipokuwapo—ufanyieni kazi wokovu wenu wenyewe kwa hofu na kutetemeka.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Kufanyia kazi” hapa ni kuufanyia kazi wokovu hadi udhihirike katika maisha, si kuupata kwa kuustahili.
    reason: alternative_reading
  - marker: b
    text: “Hofu na kutetemeka” huonyesha kicho chenye uzito na unyenyekevu mkubwa mbele za Mungu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὥστε
  choice: Kwa hiyo
  rationale: Inaonyesha hitimisho linalotokana na maelezo na himizo yaliyotangulia, kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: ἀγαπητοί μου
  choice: wapendwa wangu
  rationale: Inahifadhi mwito wa upendo wa kichungaji bila kuwa mzito au wa kizamani.
- source_word: καθὼς πάντοτε ὑπηκούσατε
  choice: kama vile mlivyotii sikuzote
  rationale: Inaeleza mwenendo wao uliothibitika wa kutii na umuhimu wake unaoendelea.
- source_word: παρουσίᾳ / ἀπουσίᾳ
  choice: nilipokuwapo / nisipokuwapo
  rationale: Vishazi vya kitenzi ni vya asili zaidi katika Kiswahili kuliko nomino ‘kuwapo/kutokuwapo’ hapa, huku vikihifadhi ulinganifu wa Kigiriki.
- source_word: πολλῷ μᾶλλον
  choice: zaidi sana
  rationale: Inahifadhi nguvu ya ulinganisho unaosisitizwa.
- source_word: τὴν ἑαυτῶν σωτηρίαν
  choice: wokovu wenu wenyewe
  rationale: ‘Wokovu’ huhifadhi uzito wa σωτηρία, na ‘wenu wenyewe’ hudumisha msisitizo wa ἑαυτῶν bila kudai kuwa ni jambo la mtu binafsi aliyejitenga na jumuiya.
- source_word: κατεργάζεσθε
  choice: utim dani
  rationale: Kusudi ni kueleza kuufanyia kazi wokovu hadi udhihirike katika maisha, bila kutumia lugha inayodokeza kuununua au kuustahili.
- source_word: μετὰ φόβου καὶ τρόμου
  choice: kwa hofu na kutetemeka
  rationale: Inahifadhi uzito, unyenyekevu, na nguvu ya msemo wa Kigiriki badala ya kuupunguza kuwa ‘heshima’ tu.
theological_decisions:
- issue: Maana ya κατεργάζεσθε kuhusiana na wokovu
  choice: Agizo la kuutimiza na kuudhihirisha wokovu katika maisha
  alternative: Agizo la kujipatia au kustahili wokovu kwa juhudi za kibinadamu
  rationale: Kitenzi kinaweza kumaanisha kutekeleza au kufikisha jambo kwenye matokeo; muktadha unaofuata unasema Mungu ndiye atendaye kazi ndani yao. Tafsiri na tanbihi zinahifadhi wajibu wa waamini bila kufundisha kwamba wanaununua wokovu.
- issue: Nguvu ya ‘hofu na kutetemeka’
  choice: Msimamo wa unyenyekevu wenye uzito na kicho mbele za Mungu
  alternative: Woga wa kutisha pekee, au heshima isiyo na uzito wa kihisia
  rationale: Msemo una uzito halisi na haupaswi kulainishwa kupita kiasi; tanbihi hufafanua matumizi yake bila kuondoa mvutano wa maneno yenyewe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi unadumisha ulinganifu wa kuwapo/kutokuwapo na uzito wa himizo la Paulo.
