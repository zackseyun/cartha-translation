  text: For God is the one working in you both to will and to work for his good pleasure[a][b].
translation:
  language: sw
  text: Kwa maana Mungu ndiye anayefanya kazi ndani yenu katika kutaka na kutenda kwa ajili ya mapenzi yake mema[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ili mtake na mtende.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kulingana na mapenzi yake mema.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γάρ
  choice: Kwa maana
  rationale: Inaonyesha kwamba kauli hii inatoa msingi wa himizo lililotangulia, kwa kiunganishi cha kawaida na cha heshima katika Kiswahili.
- source_word: ὁ ἐνεργῶν
  choice: ndiye anayefanya kazi
  rationale: Muundo huu unaonyesha Mungu kuwa mhusika anayefanya kazi kwa kuendelea, huku ukihifadhi msisitizo wa kirai cha Kigiriki chenye kibainishi na kitenzi-jina.
- source_word: ἐν ὑμῖν
  choice: ndani yenu
  rationale: Inahifadhi uwezekano wa kueleweka kuhusu kila mwamini na kuhusu jumuiya nzima, bila kuamua kimyakimya kuwa maana ni moja tu.
- source_word: τὸ θέλειν
  choice: mtake
  rationale: Inaeleza utashi wa ndani kwa Kiswahili cha kawaida; muundo wa ‘akiwafanya’ unaonyesha kwamba utashi huu umo ndani ya eneo la kazi ya Mungu.
- source_word: τὸ ἐνεργεῖν
  choice: mtende
  rationale: Inaonyesha utekelezaji au tendo halisi na kudumisha ulinganifu na ‘mtake,’ bila kuongeza wazo lisilotajwa moja kwa moja la ‘uwezo.’
- source_word: ὑπὲρ τῆς εὐδοκίας
  choice: kwa ajili ya mapenzi yake mema
  rationale: ‘Kwa ajili ya’ huwasilisha maana ya kusudi au manufaa inayowezekana kwa ὑπέρ pamoja na umilikishi; ‘yake’ inaeleweka kutokana na Mungu kuwa mhusika wa sentensi.
theological_decisions:
- issue: Utendaji wa Mungu na kutaka/kutenda kwa wanadamu
  choice: akiwafanya mtake na mtende
  alternative: katika kutaka na katika kutenda
  rationale: Tafsiri inaweka kutaka na kutenda vyote chini ya kazi ya Mungu, lakini bado inawaonyesha waamini kuwa ndio wanaotaka na kutenda; haielezi kwa mfumo wa dhehebu jinsi utendaji wa Mungu na uwajibikaji wa mwanadamu vinavyohusiana.
- issue: Maana ya ὑπὲρ τῆς εὐδοκίας
  choice: kwa ajili ya mapenzi yake mema
  alternative: kulingana na mapenzi yake mema
  rationale: Maandishi makuu yanatanguliza maana ya kusudi/manufaa, huku tanbihi ikihifadhi uwezekano wa maana ya kipimo au ulinganifu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Ndani yenu’ limeachwa wazi ili liweze kurejelea waamini mmoja mmoja au kwa pamoja. Muundo wa vitenzi ‘mtake na mtende’ ni wa kawaida kwa wasomaji wa leo na unaepuka maneno mazito yasiyo ya lazima.
