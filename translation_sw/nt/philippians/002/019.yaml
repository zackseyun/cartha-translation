  text: Ἐλπίζω δὲ ἐν κυρίῳ Ἰησοῦ Τιμόθεον ταχέως πέμψαι ὑμῖν, ἵνα κἀγὼ εὐψυχῶ γνοὺς τὰ περὶ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/019.yaml
  text: But I hope in the Lord Jesus to send Timothy to you soon[a], so that I too may be encouraged when I learn the things concerning you.
translation:
  language: sw
  text: Lakini natumaini katika Bwana Yesu kumtuma Timotheo kwenu hivi karibuni, ili mimi pia nipate moyo nitakapopata habari kuhusu hali yenu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, karibu zaidi na maneno ya asili, “nitakapojua mambo yanayowahusu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐλπίζω
  choice: natumaini
  rationale: Kitenzi cha wakati wa sasa kinaeleza tumaini au matarajio ya Paulo ya wakati huo; “natumaini” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: δὲ
  choice: Lakini
  rationale: Kiunganishi hiki kinaonyesha mpito wenye tofauti ndogo na yaliyotangulia; “Lakini” kinaweka wazi uhusiano huo.
- source_word: ἐν κυρίῳ Ἰησοῦ
  choice: katika Bwana Yesu
  rationale: Tafsiri hii inadumisha wazo kwamba tumaini la Paulo liko ndani ya uhusiano wake na utegemezi wake kwa Bwana Yesu, bila kulifafanua kupita kiasi.
- source_word: Τιμόθεον
  choice: Timotheo
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili cha Biblia.
- source_word: ταχέως
  choice: hivi karibuni
  rationale: Katika muktadha wa mpango wa kumtuma mtu, neno hili linaeleza wakati unaotarajiwa kuliko kasi ya safari.
- source_word: πέμψαι
  choice: kumtuma
  rationale: Kitenzi-jina baada ya “natumaini” kinatafsiriwa kwa kawaida na kwa usahihi kuwa “kumtuma.”
- source_word: ὑμῖν
  choice: kwenu
  rationale: “Kwenu” ni Kiswahili cha kawaida kinachoonyesha walengwa na mahali anapotumwa Timotheo.
- source_word: ἵνα
  choice: ili
  rationale: “Ili” linaonyesha wazi kusudi la kumtuma Timotheo.
- source_word: κἀγὼ
  choice: mimi pia
  rationale: Hifadhi msisitizo wa Paulo kwamba yeye pia atanufaika kwa kusikia habari zao.
- source_word: εὐψυχῶ
  choice: nitiwe moyo
  rationale: Kitenzi kina maana ya kuwa na moyo mzuri au kupata faraja; “nitiwe moyo” ni usemi wa kawaida unaofikisha maana hiyo.
- source_word: γνοὺς
  choice: nitakapopata habari
  rationale: Ingawa kwa umbo ni kishirikishi cha aoristi, hapa kinaeleza hali ya wakati inayosababisha Paulo kutiwa moyo; Kiswahili cha kawaida hutumia “nitakapopata habari.”
- source_word: τὰ περὶ ὑμῶν
  choice: habari kuhusu hali yenu
  rationale: Kirai hiki kinahusu mambo au hali za Wafilipi. Tafsiri hii ni ya kawaida kwa Kiswahili huku tanbihi ikihifadhi usemi ulio karibu zaidi na muundo wa Kigiriki.
theological_decisions:
- issue: Tafsiri ya κύριος katika kirai ἐν κυρίῳ Ἰησοῦ
  choice: Bwana
  alternative: Mkuu
  rationale: “Bwana” ni cheo cha kawaida cha Kikristo kwa Yesu katika Agano Jipya na kinafaa hapa; hakuna jambo katika muktadha linalohitaji tafsiri nyingine.
- issue: Uhusiano unaoonyeshwa na ἐν katika ἐν κυρίῳ Ἰησοῦ
  choice: katika Bwana Yesu
  alternative: kwa njia ya Bwana Yesu
  rationale: “Katika” kinahifadhi upana wa usemi wa Paulo—tumaini lake limewekwa katika uhusiano na utegemezi kwa Bwana Yesu—bila kuufanya usemi huo kuwa wa chombo tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo wa sentensi unadumisha mtiririko wa hoja ya Paulo, huku tanbihi ikihifadhi uwezekano wa tafsiri iliyo halisi zaidi wa τὰ περὶ ὑμῶν.
