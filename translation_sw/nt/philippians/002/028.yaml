  source_fidelity: 'Mabadiliko mawili salama yanahitajika. “Nimemtuma” ni timilifu na inaweza kudokeza tendo lenye athari ya sasa, ilhali ἔπεμψα ni aoristi na inatafsirika kwa kawaida kama wakati uliopita: “nilimtuma.” Pia “niwe na huzuni kidogo” husema kuwa na huzuni kiasi kidogo, si wazi kuwa huzuni imepungua kwa kulinganisha kama ἀλυπότερος (“mwenye huzuni/masikitiko kidogo zaidi”).'
