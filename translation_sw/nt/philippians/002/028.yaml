translation:
  language: sw
  text: Kwa hiyo nilimtuma kwenu kwa hamu kubwa zaidi, ili mtakapomwona tena mfurahi, nami huzuni yangu ipungue.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπουδαιοτέρως
  choice: kwa hamu kubwa zaidi
  rationale: Kielezi hiki cha ulinganisho kinaonyesha kuongezeka kwa hamu au bidii; tafsiri hii inahifadhi nguvu ya ulinganisho kwa Kiswahili cha kawaida.
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Inaonyesha hitimisho au mwendelezo unaotokana na maelezo yaliyotangulia.
- source_word: ἔπεμψα
  choice: nimemtuma kwenu
  rationale: Wakati timilifu wa Kiswahili unaeleza kitendo kilichokamilika chenye umuhimu wa sasa kwa wasomaji; pia unafaa katika hali ya barua inayosafirishwa na mtu aliyetumwa. Neno “kwenu” linaweka wazi mwelekeo unaoeleweka katika muktadha.
- source_word: ἵνα
  choice: ili
  rationale: Inaonyesha kusudi kwa ufupi na kwa Kiswahili cha asili.
- source_word: ἰδόντες
  choice: mtakapomwona
  rationale: Kitenzi kishirikishi cha Kigiriki kinaelezwa kiasili kama hali ya wakati inayotangulia furaha inayokusudiwa.
- source_word: πάλιν
  choice: tena
  rationale: Inaonyesha kwamba watamwona Epafrodito mara nyingine.
- source_word: χαρῆτε
  choice: mfurahi
  rationale: Huhifadhi wazo la kufurahi na hali ya utegemezi iliyo chini ya kishazi cha kusudi.
- source_word: κἀγὼ
  choice: nami
  rationale: Muungano wa καὶ ἐγώ unaonyeshwa kwa ufupi na kwa kawaida kama “nami.”
- source_word: ἀλυπότερος
  choice: niwe na huzuni kidogo
  rationale: Huhifadhi ulinganisho wa kuwa na huzuni kwa kiwango kilichopungua bila kuibadili kuwa wasiwasi pekee.
- source_word: ὦ
  choice: niwe
  rationale: Hali tegemezi ya εἰμί inaonyeshwa kiasili baada ya “ili” katika kusudi linaloendelea hadi sehemu ya pili ya sentensi.
