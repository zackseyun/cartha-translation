  text: I am confident in the Lord that I myself will also come soon.
translation:
  language: sw
  text: Nami nina hakika katika Bwana kwamba mimi mwenyewe pia nitakuja hivi karibuni.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nami ninatumaini katika Bwana kwamba hata mimi mwenyewe nitakuja hivi karibuni.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πέποιθα
  choice: nina hakika
  rationale: Kitenzi cha wakati timilifu kinaonyesha hali thabiti ya kuwa na uhakika; usemi huu ni wa kawaida na huhifadhi nguvu yake ya sasa.
- source_word: δὲ
  choice: nami
  rationale: Kiunganishi hiki kinaendeleza hoja kwa upole; katika muktadha, “nami” huunganisha matarajio ya Paulo kuhusu safari yake na yaliyotangulia huku kikisaidia kuwasilisha maana ya nyongeza.
- source_word: ἐν κυρίῳ
  choice: katika Bwana
  rationale: Huhifadhi usemi wa kawaida wa Paulo unaoonyesha kwamba uhakika wake una msingi au mazingira yake katika Bwana.
- source_word: ὅτι
  choice: kwamba
  rationale: Huanzisha maudhui ya uhakika wa Paulo kwa Kiswahili cha kawaida.
- source_word: καὶ αὐτὸς
  choice: mimi mwenyewe pia
  rationale: “Mimi mwenyewe” huhifadhi msisitizo wa αὐτός kwamba Paulo atakuja binafsi, na “pia” huhifadhi maana ya nyongeza ya καί.
- source_word: ταχέως
  choice: hivi karibuni
  rationale: Katika muktadha huu neno linahusu ukaribu wa wakati, si kasi ya kusafiri.
- source_word: ἐλεύσομαι
  choice: nitakuja
  rationale: Huhifadhi wakati ujao na mtazamo wa kielekezi wa Paulo akiwaandikia Wafilipi.
- source_word: κυρίῳ
  choice: Bwana
  rationale: Hili ndilo neno la kawaida na lenye hadhi kwa κύριος katika matumizi haya ya Paulo.
theological_decisions:
- issue: Asili ya uhakika wa Paulo kuhusiana na Bwana
  choice: nina hakika katika Bwana
  alternative: namtumaini Bwana kwamba mimi mwenyewe pia nitakuja hivi karibuni
  rationale: Ufasiri uliochaguliwa huhifadhi kwamba matarajio ya Paulo yamejengwa katika Bwana, bila kuyafanya yaonekane kuwa ufunuo wa moja kwa moja au uhakika unaotokana na matumaini yake binafsi tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio “mimi mwenyewe pia” huhifadhi msisitizo na maana ya nyongeza bila kufanya sentensi kuwa nzito.
