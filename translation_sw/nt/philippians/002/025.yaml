  text: Ἀναγκαῖον δὲ ἡγησάμην Ἐπαφρόδιτον τὸν ἀδελφὸν καὶ συνεργὸν καὶ συστρατιώτην μου, ὑμῶν δὲ ἀπόστολον καὶ λειτουργὸν τῆς χρείας μου, πέμψαι πρὸς ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/025.yaml
  text: But I considered it necessary to send to you Epaphroditus—my brother and fellow worker and fellow soldier[b][a], and your messenger and minister to my need—
translation:
  language: sw
  text: Lakini niliona ni lazima nimtume kwenu Epafrodito—ndugu yangu, mfanyakazi mwenzangu, na askari mwenzangu; naye ni mjumbe wenu[a] na mhudumu kwa ajili ya mahitaji yangu[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtume”—yaani, mtu aliyetumwa na ninyi.
    reason: alternative_reading
  - marker: b
    text: Au, “mtumishi wa kunihudumia katika uhitaji wangu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναγκαῖον
  choice: ni lazima
  rationale: Hueleza jambo ambalo Paulo aliliona kuwa la lazima; usemi huu ni wa kawaida na wazi katika Kiswahili.
- source_word: ἡγησάμην
  choice: niliona
  rationale: Katika muundo ‘niliona ni lazima,’ kitenzi hiki huwasilisha tathmini au uamuzi wa Paulo, si kuona kwa macho.
- source_word: πέμψαι
  choice: nimtume
  rationale: Hutegemea ἡγησάμην na humaanisha ‘kutuma’; wazo la ‘kumrudisha’ halijaelezwa moja kwa moja katika kifungu hiki.
- source_word: ἀδελφὸν
  choice: ndugu yangu
  rationale: Hifadhi lugha ya kifamilia inayomtaja mwamini mwenzao bila kuongeza ufafanuzi usiokuwapo katika maandishi.
- source_word: συνεργὸν
  choice: mfanyakazi mwenzangu
  rationale: Ni usemi wa kawaida unaoonyesha mtu anayefanya kazi pamoja na Paulo.
- source_word: συστρατιώτην
  choice: askari mwenzangu
  rationale: Huhifadhi sitiari ya kijeshi kwa lugha wazi na ya asili.
- source_word: ἀπόστολον
  choice: mjumbe wenu
  rationale: Muktadha unaonyesha mwakilishi aliyetumwa na Wafilipi; ‘mjumbe’ huhifadhi maana ya kutumwa bila kudokeza lazima cheo maalumu cha kitume.
- source_word: λειτουργὸν
  choice: mhudumu
  rationale: Huonyesha mtu anayetoa huduma yenye heshima bila kulazimisha maana ya cheo cha kisasa cha kanisa.
- source_word: τῆς χρείας μου
  choice: wa mahitaji yangu
  rationale: Huonyesha kwamba huduma ya Epafrodito ilielekezwa katika kutimiza mahitaji ya Paulo, huku ikibaki karibu na muundo wa Kigiriki.
theological_decisions:
- issue: Ikiwa ἀπόστολον itafsiriwe kwa maana ya cheo maalumu ‘mtume’ au maana pana ya ‘mjumbe’
  choice: mjumbe
  alternative: mtume
  rationale: Katika muktadha huu Epafrodito ni aliyetumwa na kanisa la Filipi kwenda kwa Paulo. ‘Mjumbe’ huonyesha uwakilishi huo bila kuamua kwamba alikuwa na cheo maalumu cha Mtume.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa orodha na sitiari ya kijeshi zimehifadhiwa; vistari virefu vinaonyesha kwamba sentensi inaendelea katika mstari unaofuata.
