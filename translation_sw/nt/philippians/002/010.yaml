  terminology: Jina «Yesu» na usemi «kila goti lipigwe» vinafaa. «Kwa kutajwa jina la Yesu» huepuka maana ya uwakala/mamlaka inayoweza kusomwa katika «kwa jina la Yesu», bila kuondoa utata halali wa kihusishi ἐν. Tanbihi huhifadhi mbadala wa karibu «katika jina la Yesu».
