  source_fidelity: 'Maana kuu imehifadhiwa: ἵνα ni «ili», taswira ya «kila goti» ipo, na upeo wa makundi ya mbinguni, duniani, na chini ya dunia haujafafanuliwa kupita matini. Hata hivyo, «kwa jina la Yesu» kwa kawaida husikika kama kwa mamlaka ya Yesu, ilhali ἐν τῷ ὀνόματι Ἰησοῦ katika muktadha huu inafaa zaidi «kwa kutajwa jina la Yesu» au «katika jina la Yesu». Pia «la walio mbinguni, duniani na chini ya dunia» hailingani kisarufi, kwa kuwa «walio» haiwezi kutawala «duniani» kama kundi sambamba bila kurudiwa au kutumika «vya».'
