translation:
  language: sw
  text: ili kwa kutajwa jina la Yesu kila goti lipigwe[a], vya mbinguni, vya duniani, na vya chini ya dunia[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “katika jina la Yesu.”
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “vya mbinguni, vya duniani, na vya chini ya dunia”; yaani, makundi ya walioko katika maeneo hayo.
