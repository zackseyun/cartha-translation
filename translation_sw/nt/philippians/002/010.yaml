lexical_decisions:
- source_word: ἵνα
  choice: ili
  rationale: Huonyesha kusudi au matokeo yanayotokana na kauli iliyotangulia, kwa Kiswahili cha kawaida na wazi.
- source_word: ἐν τῷ ὀνόματι Ἰησοῦ
  choice: kwa jina la Yesu
  rationale: Katika muktadha wa kusujudu, usemi huu unaonyesha mwitikio kwa jina, hadhi na heshima ya Yesu. Tanbihi inahifadhi uwezekano wa tafsiri ya karibu zaidi ya kimuundo, “katika jina la Yesu.”
- source_word: πᾶν γόνυ
  choice: kila goti
  rationale: Inahifadhi picha halisi na yenye nguvu ya tendo la mwili linaloonyesha heshima ya ulimwengu wote, badala ya kuifafanua kuwa ‘kila mtu.’
- source_word: κάμψῃ
  choice: lipigwe
  rationale: Usemi ‘goti lipigwe’ ni wa kawaida katika Kiswahili cha kibiblia na unaeleza kuinama kwa heshima; hali tegemezi inaendana na ἵνα pamoja na kitenzi cha Kigiriki.
- source_word: ἐπουρανίων
  choice: walio mbinguni
  rationale: Inawasilisha kivumishi kilichotumika kama nomino kwa njia ya asili katika Kiswahili bila kubainisha viumbe hao ni nani.
- source_word: ἐπιγείων
  choice: duniani
  rationale: Inaendeleza mpangilio wa maeneo matatu na kuonyesha walio katika eneo la dunia bila kuongeza utambulisho wao.
- source_word: καταχθονίων
  choice: chini ya dunia
  rationale: Inahifadhi picha ya mahali iliyo katika Kigiriki bila kuingiza neno lenye tafsiri pana zaidi kama ‘kuzimu.’
theological_decisions:
- issue: 'Upeo wa usemi wa sehemu tatu: ἐπουρανίων καὶ ἐπιγείων καὶ καταχθονίων'
  choice: Kuhifadhi upeo wa ulimwengu mzima kwa kusema ‘walio mbinguni, duniani na chini ya dunia,’ bila kuwataja kwa makundi mahususi.
  alternative: Kutaja wazi malaika, wanadamu na wafu au mapepo.
  rationale: Mstari unasisitiza heshima ya wote kwa Yesu, lakini hauwabainishi moja kwa moja walio katika kila eneo; hivyo tafsiri haipaswi kuongeza ufafanuzi wa kiteolojia usiolazimishwa na matini.
- issue: Maana ya ἐν τῷ ὀνόματι Ἰησοῦ
  choice: kwa jina la Yesu
  alternative: katika jina la Yesu
  rationale: ‘Kwa jina la Yesu’ ni usemi wa asili unaofaa katika muktadha huu wa kupiga goti, huku tanbihi ikihifadhi tafsiri mbadala inayofuata kwa karibu zaidi kihusishi cha Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo ‘kila goti lipigwe’ unahifadhi taswira ya Kigiriki, na ‘la walio’ huonyesha uhusiano wa maneno ya Kigiriki yaliyo katika hali ya umilikishi.
