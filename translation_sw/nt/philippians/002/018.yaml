  text: In the same way[a], you also rejoice and rejoice with me.
translation:
  language: sw
  text: Vivyo hivyo[a], ninyi pia furahini, na furahini pamoja nami.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kadhalika, ninyi pia furahini na shirikini furaha pamoja nami.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ...αὐτὸ
  choice: Vivyo hivyo
  rationale: Kirai hiki kinatumika kama kielezi kinachorejelea hali iliyotangulia. ‘Vivyo hivyo’ ni Kiswahili cha kawaida na hudumisha uhusiano huo bila kutumia tafsiri ngumu ya neno kwa neno.
- source_word: χαίρετε
  choice: furahini
  rationale: Ni amri ya wakati uliopo kwa wingi. ‘Furahini’ hudumisha nguvu ya kitenzi na msisitizo wa furaha unaojirudia katika Wafilipi.
- source_word: συγχαίρετέ
  choice: furahini pamoja
  rationale: Kitenzi ambatani kinaeleza kufurahi kwa pamoja. Kurudia ‘furahini’ na kuongeza ‘pamoja’ kunawasilisha kwa uwazi maana hiyo katika Kiswahili.
- source_word: μοι
  choice: nami
  rationale: Kiwakilishi hiki kinamtaja Paulo kuwa mtu ambaye Wafilipi wanapaswa kufurahi pamoja naye; ‘nami’ ni tafsiri fupi na ya kawaida.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, wazi na yenye heshima. Kurudiwa kwa ‘furahini’ kunadumisha vitenzi viwili vya Kigiriki na kutofautisha furaha yao na kufurahi kwao pamoja na Paulo.
