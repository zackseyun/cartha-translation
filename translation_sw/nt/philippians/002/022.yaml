base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/022.yaml
  text: But you know his proven character[b][a], that as a child with his father he served with me for the gospel.
translation:
  language: sw
  text: Lakini ninyi mnaijua tabia yake iliyothibitishwa[a], kwamba alihudumu pamoja nami kwa ajili ya Injili kama mtoto pamoja na baba yake[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, tabia ambayo imeonekana kuwa ya kweli baada ya kujaribiwa.
    reason: lexical_alternative
  - marker: b
    text: Kwa maana halisi, “kama mtoto pamoja na baba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Lakini
  rationale: Inaendeleza utofautishaji au mpito mpole katika muktadha kwa Kiswahili cha kawaida.
- source_word: δοκιμὴν αὐτοῦ
  choice: tabia yake iliyothibitishwa
  rationale: Inaonyesha tabia ya Timotheo ambayo uhalisi wake umedhihirika baada ya kujaribiwa, badala ya wazo la uthibitisho wa kinadharia tu.
- source_word: γινώσκετε
  choice: ninyi mnajua
  rationale: Wakati wa sasa unaonyesha kwamba Wafilipi tayari wanaijua tabia ya Timotheo; kiwakilishi kimewekwa ili kubeba msisitizo uliomo katika umbo la kitenzi cha Kigiriki.
- source_word: ὅτι
  choice: kwamba
  rationale: Inaanzisha maelezo ya kile wanachojua kuhusu Timotheo.
- source_word: ὡς πατρὶ τέκνον
  choice: kama mtoto akiwa na baba yake
  rationale: Inahifadhi tashbihi ya kifamilia na maana pana ya τέκνον bila kuibana kuwa 'mwana'; 'akiwa na' huonyesha uhusiano wa kutumika pamoja.
- source_word: σὺν ἐμοὶ
  choice: pamoja nami
  rationale: Ni tafsiri ya kawaida ya ushirika wa karibu katika huduma.
- source_word: ἐδούλευσεν
  choice: alitumika
  rationale: Inahifadhi maana ya kutoa huduma kwa kujitoa katika muktadha huu bila kulazimisha tafsiri ya moja kwa moja 'alifanya kazi kama mtumwa'.
- source_word: εἰς τὸ εὐαγγέλιον
  choice: kwa ajili ya Injili
  rationale: Inaeleza kusudi na mwelekeo wa huduma yao kwa Kiswahili cha asili.
theological_decisions:
- issue: Uhusiano kati ya Timotheo na Paulo katika tashbihi
  choice: kama mtoto akiwa na baba yake
  alternative: kama mwana akimtumikia baba yake
  rationale: Kigiriki kinasema kwa maana halisi 'kama mtoto pamoja na baba,' na kisha kwamba Timotheo alitumika pamoja na Paulo. Tafsiri iliyochaguliwa haidokezi kimakosa kwamba Timotheo alim­tumikia Paulo badala ya kutumika pamoja naye kwa ajili ya Injili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umefanywa kuwa wa kawaida kwa wasomaji wa leo huku tashbihi na msisitizo wa maandishi ya Kigiriki vikihifadhiwa.
