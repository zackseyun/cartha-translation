  text: complete my joy[a], so that you may think the same way, having the same love, being united in soul[c][b], thinking one thing.
translation:
  language: sw
  text: ikamilisheni furaha yangu, ili mwe na nia moja, mkiwa na upendo uleule, wenye umoja wa moyo[a], mkifikiria jambo moja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wenye nafsi moja”; pia yaweza kuwa, “wenye roho moja.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πληρώσατέ μου τὴν χαρὰν
  choice: ikamilisheni furaha yangu
  rationale: Kauli ya amri inaomba furaha ya Paulo ifikishwe kwenye ukamilifu; ‘ikamilisheni’ ni ya asili na inadumisha wazo la kujaza kwa kipimo kamili.
- source_word: ἵνα
  choice: kwa kuwa na
  rationale: Katika muktadha huu ἵνα inaweza kuonyesha maudhui au njia ambayo furaha hiyo inakamilishwa. Muundo huu ni wa asili katika Kiswahili na unaunganisha ombi na maelezo yanayofuata bila kulazimisha tofauti kali kati ya kusudi na matokeo.
- source_word: τὸ αὐτὸ φρονῆτε
  choice: kuwa na nia moja
  rationale: φρονέω hapa inahusu mwelekeo wa fikira na mtazamo, si tendo la kufikiri tu. ‘Kuwa na nia moja’ ni Kiswahili cha kawaida kinachoonyesha umoja bila kudai kufanana katika kila wazo.
- source_word: τὴν αὐτὴν ἀγάπην ἔχοντες
  choice: mkiwa na upendo uleule
  rationale: Tafsiri hii inahifadhi kishiriki na kurudia kwa αὐτός, huku ‘upendo’ ikiwa tafsiri ya kawaida na wazi ya ἀγάπη.
- source_word: σύμψυχοι
  choice: wenye umoja wa moyo
  rationale: Neno hili adimu lina wazo la kuwa pamoja katika maisha ya ndani. ‘Umoja wa moyo’ ni wa asili na wenye hadhi katika Kiswahili, bila kuingiza maana maalumu ya kiroho isiyolazimishwa na neno lenyewe.
- source_word: τὸ ἓν φρονοῦντες
  choice: mkinuia jambo moja
  rationale: Hili linadumisha uhusiano na φρονέω ya awali lakini linaonyesha mkazo wa kuelekea lengo au jambo moja; ‘jambo moja’ huhifadhi umoja wa τὸ ἓν bila kulifafanua zaidi ya maandishi.
theological_decisions:
- issue: Jinsi ya kuonyesha umoja unaosisitizwa kwa kurudiwa kwa φρονέω
  choice: ‘kuwa na nia moja ... mkinuia jambo moja’
  alternative: ‘kufikiri vivyo hivyo ... mkifikiri jambo moja’
  rationale: Chaguo hili linadumisha kurudiwa kwa wazo la nia huku likitumia Kiswahili cha asili. Halibadili wito wa umoja kuwa madai ya ulinganifu kamili wa maoni au umoja wa kitaasisi.
- issue: Maana ya σύμψυχοι
  choice: ‘wenye umoja wa moyo’
  alternative: ‘wenye roho moja’ au ‘wenye nafsi moja’
  rationale: ‘Moyo’ hapa huwasilisha maisha ya ndani na nia ya pamoja kwa Kiswahili kinachoeleweka. Maana halisi zaidi za ‘roho’ na ‘nafsi’ zinaweza kusikika kama kauli maalumu kuhusu asili ya kiroho; uwezekano huo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inahifadhi mfululizo wa maneno yanayoeleza umoja, lakini inakwepa tafsiri ngumu kama ‘mkifikiri kitu kilekile.’
