id: PHP.2.15
reference: Philippians 2:15
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἵνα γένησθε ἄμεμπτοι καὶ ἀκέραιοι, τέκνα θεοῦ ⸂ἄμωμα μέσον⸃ γενεᾶς σκολιᾶς καὶ διεστραμμένης, ἐν οἷς φαίνεσθε ὡς φωστῆρες ἐν κόσμῳ
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/015.yaml
  text: so that you may become blameless and pure[a], children of God without blemish in the midst of a crooked and twisted generation[c][b], among whom you shine as lights in the world
translation:
  language: sw
  text: ili mpate kuwa bila lawama na safi, watoto wa Mungu wasio na dosari katikati ya kizazi kilichopinda na kupotoka[b]. Miongoni mwao mnang'aa[a] kama mianga[c] ulimwenguni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mnaonekana.”
    reason: lexical_alternative
  - marker: b
    text: Maneno “kizazi kilichopinda na kupotoka” huenda yakawa mwangwi wa Kumbukumbu la Torati 32:5, yakitofautisha watoto wa Mungu na kizazi kilichoharibika.
    reason: cross_reference
  - marker: c
    text: Au, “vyanzo vya nuru”; neno la Kigiriki linaweza pia kutaja mianga ya angani.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα γένησθε
  choice: ili mpate kuwa
  rationale: “Ili” huonyesha kusudi au matokeo, na “mpate kuwa” huhifadhi wazo la kufikia hali hiyo bila kufanya Kiswahili kuwa kizito.
- source_word: ἄμεμπτοι καὶ ἀκέραιοι
  choice: bila lawama na safi
  rationale: “Bila lawama” huonyesha kutokuwa na kosa linaloweza kushutumiwa, huku “safi” ikieleza unyofu na usafi wa maadili kwa lugha inayoeleweka.
- source_word: τέκνα θεοῦ
  choice: watoto wa Mungu
  rationale: τέκνα inawahusu watoto bila kuwabainisha kwa jinsia; “watoto wa Mungu” ni sahihi na ya kawaida.
- source_word: ἄμωμα
  choice: wasio na dosari
  rationale: Kauli hii inahifadhi taswira ya kutokuwa na waa au kasoro na kuitofautisha na “bila lawama” iliyotangulia.
- source_word: μέσον γενεᾶς σκολιᾶς καὶ διεστραμμένης
  choice: katikati ya kizazi kilichopinda na kupotoka
  rationale: Tafsiri hii inadumisha lugha ya kimaadili na taswira mbili za kupinda na kupotoshwa, bila kuongeza ufafanuzi wa kimadhehebu.
- source_word: ἐν οἷς
  choice: miongoni mwao
  rationale: Kiwakilishi kinarejelea watu wa kizazi hicho; “miongoni mwao” ni cha asili zaidi kuliko kukirejelea kizazi kama kitu.
- source_word: φαίνεσθε
  choice: mnang'aa
  rationale: Pamoja na φωστῆρες, maana ya kutoa mwanga inafaa sana katika muktadha, ingawa maana ya “mnaonekana” pia inawezekana na imehifadhiwa katika tanbihi.
- source_word: φωστῆρες
  choice: mianga
  rationale: Neno linaweza kumaanisha vitu vinavyotoa nuru, hata mianga ya angani. “Mianga” huhifadhi upana huo kuliko “nyota” na ni rahisi kuliko istilahi ya kitaalamu.
- source_word: ἐν κόσμῳ
  choice: ulimwenguni
  rationale: Hii ni njia ya kawaida na fupi ya kueleza kuwapo katika ulimwengu wa wanadamu.
theological_decisions:
- issue: Uhusiano wa “wasio na dosari” na “watoto wa Mungu,” pamoja na mwangwi unaowezekana wa Kumbukumbu la Torati 32:5
  choice: “watoto wa Mungu wasio na dosari”
  alternative: Kuhusisha “wasio na dosari” kwa ujumla na sifa zote za kishazi hicho
  rationale: Mpangilio wa Kigiriki unaihusisha sifa hiyo moja kwa moja na “watoto wa Mungu.” Tafsiri inadumisha pia utofautishaji wa kiagano dhidi ya kizazi kilichopotoka bila kuufanya mwangwi huo kuwa dai la wazi katika matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo umegawanywa katika sentensi mbili ili kuepuka msongamano bila kuvunja uhusiano wa hoja. “Kilichopinda na kupotoka” huhifadhi taswira ya chanzo, na “mianga” hudumisha uwezekano mpana wa φωστῆρες.
