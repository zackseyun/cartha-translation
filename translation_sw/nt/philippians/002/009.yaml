  yaml_path: translation/nt/philippians/002/009.yaml
  text: Therefore God also highly exalted him and graciously gave him the name that is above every name[b][a],
translation:
  language: sw
  text: Kwa hiyo Mungu pia alimwinua juu sana, na kwa neema akampa jina lililo juu ya kila jina.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akamjalia.”
    reason: lexical_alternative
  - marker: b
    text: “Jina” linaweza kumaanisha si jina linalotamkwa tu, bali pia hadhi au cheo; mstari huu wenyewe bado hautaji ni jina gani linalokusudiwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ καὶ
  choice: Kwa hiyo ... pia
  rationale: “Kwa hiyo” huhifadhi uhusiano wa hitimisho na yaliyotangulia, na “pia” huhifadhi nguvu ya nyongeza ya καί kwa mpangilio wa kawaida wa Kiswahili.
- source_word: ὁ θεὸς
  choice: Mungu
  rationale: Huyu ndiye mtendaji aliyetajwa wazi katika Kigiriki; “Mungu” ni namna ya kawaida na yenye heshima katika Kiswahili.
- source_word: ὑπερύψωσεν
  choice: alimwinua juu sana
  rationale: Huhifadhi msisitizo wa kitenzi ambatano ὑπερύψωσεν kwa lugha ya asili na inayoeleweka, bila kuongeza wazo mahsusi la mahali lisilotamkwa moja kwa moja.
- source_word: ἐχαρίσατο
  choice: kwa neema akampa
  rationale: Huwasilisha tendo la kumpa huku ikidokeza wazi uhusiano wa kitenzi na χάρις, yaani neema; “akampa” peke yake lingeweza kuficha kidokezo hicho.
- source_word: τὸ ὄνομα
  choice: jina
  rationale: Kigiriki kinasema “jina”; tafsiri hailibadili kuwa “cheo,” ingawa katika muktadha linaweza pia kuashiria hadhi, cheo, au mamlaka.
- source_word: τὸ ὑπὲρ πᾶν ὄνομα
  choice: jina lililo juu ya kila jina
  rationale: Huhifadhi muundo wa kulinganisha wa Kigiriki na ni usemi wa kawaida, wazi, na wenye hadhi katika Kiswahili.
theological_decisions:
- issue: Utambulisho wa “jina”
  choice: Neno “jina” limeachwa bila kutaja ni jina gani katika mstari mkuu.
  alternative: Kulieleza kuwa jina “Yesu,” au kulifafanua kuwa cheo cha kimungu “Bwana” kinachojitokeza katika mistari inayofuata.
  rationale: Mstari huu wenyewe haulitambulishi jina hilo wazi. Kuacha usemi huo wazi huhifadhi utata na mvutano halisi wa kifungu bila kuingiza hitimisho la kitafsiri kutoka Wafilipi 2:10–11.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, ya kawaida, na yenye hadhi. Muundo umewekwa wazi kwa wasomaji wa kawaida huku ukihifadhi msisitizo wa Kigiriki na kutofafanua kupita kiasi maana ya “jina.”
