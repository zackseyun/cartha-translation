  text: ἀλλὰ εἰ καὶ σπένδομαι ἐπὶ τῇ θυσίᾳ καὶ λειτουργίᾳ τῆς πίστεως ὑμῶν, χαίρω καὶ συγχαίρω πᾶσιν ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/017.yaml
  text: But even if I am being poured out as a drink offering upon the sacrifice and service of your faith[c][b][a], I rejoice and rejoice with all of you.
translation:
  language: sw
  text: Lakini hata ikiwa ninamiminwa kama sadaka ya kinywaji[a] juu ya dhabihu na huduma ya ibada[b] ya imani yenu[c], ninafurahi, nami ninafurahi pamoja nanyi nyote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ninamiminwa kama sadaka ya kumiminwa.”
    reason: lexical_alternative
  - marker: b
    text: Neno hili pia linaweza kutafsiriwa “huduma”; katika muktadha huu Kigiriki kinadumisha lugha ya ibada.
    reason: lexical_alternative
  - marker: c
    text: Au, “uaminifu wenu.”
    reason: alternative_reading
lexical_decisions:
- source_word: σπένδομαι
  choice: ninamiminwa kama sadaka ya kinywaji
  rationale: Kauli hii inahifadhi sitiari ya sadaka ya kinywaji inayomiminwa katika ibada, huku ikieleweka kwa msomaji wa Kiswahili cha sasa.
- source_word: ἐπὶ
  choice: juu ya
  rationale: Huhifadhi picha ya sadaka ya Paulo kumiminwa juu ya, au kuongezwa kwenye, dhabihu ya Wafilipi bila kuondoa utata huo.
- source_word: θυσίᾳ
  choice: dhabihu
  rationale: Ni neno la kawaida na lenye heshima kwa dhabihu, nalo linadumisha lugha ya ibada ya kifungu hiki.
- source_word: λειτουργίᾳ
  choice: huduma ya ibada
  rationale: Muktadha wa dhabihu unaipa huduma hii maana ya kiibada; tafsiri hii huihifadhi bila kulazimisha kwamba Wafilipi wenyewe wanaitwa makuhani.
- source_word: πίστεως
  choice: imani
  rationale: Hii ndiyo maana ya msingi katika muktadha huu, ingawa ‘uaminifu’ unabaki kuwa uwezekano halali na umeonyeshwa katika tanbihi.
- source_word: χαίρω
  choice: ninafurahi
  rationale: Huhifadhi msamiati mkuu wa furaha unaorudiwa katika Wafilipi na kauli ya wakati wa sasa.
- source_word: συγχαίρω
  choice: kufurahi pamoja
  rationale: Huhifadhi uhusiano wa kimatamshi na χαίρω na maana ya Paulo kuungana na jumuiya yote katika furaha.
- source_word: πᾶσιν ὑμῖν
  choice: pamoja nanyi nyote
  rationale: Ni Kiswahili cha kawaida kinachodumisha msisitizo kwamba jumuiya nzima imehusishwa.
theological_decisions:
- issue: Taswira ya kidhabihu kuhusu uwezekano wa kifo cha Paulo
  choice: Paulo anajieleza kwa sitiari kuwa anamiminwa kama sadaka ya kinywaji juu ya dhabihu na huduma ya ibada inayohusishwa na imani ya Wafilipi.
  alternative: Maisha ya Paulo yanamiminwa tu kuhusiana na huduma yao, bila msisitizo mahsusi wa kidhabihu.
  rationale: Mkusanyiko wa maneno σπένδομαι, θυσία na λειτουργία unaunga mkono kuhifadhi taswira ya dhabihu na ibada badala ya kuifanya kuwa huduma ya kawaida tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Lugha ya dhabihu imehifadhiwa, lakini ‘huduma ya ibada’ imetumiwa badala ya ‘huduma ya kikuhani’ ili kutodokeza zaidi ya kile kinacholazimishwa na Kigiriki. Kurudiwa kwa mzizi wa ‘furahi’ kunaakisi uhusiano wa χαίρω na συγχαίρω.
