lexical_decisions:
- source_word: ἐταπείνωσεν
  choice: alijinyenyekeza
  rationale: Kitenzi hiki cha Kiswahili kinaonyesha tendo la hiari la kujishusha bila kutumia lugha ya kizamani.
- source_word: ἑαυτὸν
  choice: mwenyewe
  rationale: Neno hili linahifadhi msisitizo wa kiwakilishi cha kujirejelea na kuonyesha kwamba kujinyenyekeza kwake kulikuwa kwa hiari.
- source_word: γενόμενος
  choice: kwa kuwa
  rationale: Muundo huu unaunganisha utiifu na kujinyenyekeza kama namna ambavyo tendo hilo lilidhihirika, bila kulazimisha mpangilio wa wakati usio wazi katika kishirikishi.
- source_word: ὑπήκοος
  choice: mtiifu
  rationale: Ni kisawe cha kawaida na cha moja kwa moja kinachohifadhi maana ya utiifu.
- source_word: μέχρι θανάτου
  choice: mpaka kufa
  rationale: Kauli ya asili na inayoeleweka inayobakiza wazo kwamba utiifu wake ulifikia hadi kifo chenyewe.
- source_word: δὲ
  choice: naam
  rationale: Katika muktadha huu neno hilo linaongeza msisitizo kwa aina ya kifo iliyofuata; “naam” huonyesha kupanda kwa nguvu ya usemi kwa lugha yenye hadhi.
- source_word: σταυροῦ
  choice: msalabani
  rationale: Hueleza kwa uwazi kifo cha kusulubiwa huku ikihifadhi picha halisi ya msalaba.
theological_decisions:
- issue: Nguvu ya kishazi cha mwisho θανάτου δὲ σταυροῦ
  choice: naam, kufa msalabani
  alternative: yaani, kifo cha msalaba
  rationale: Tafsiri hii inahifadhi ongezeko la msisitizo kutoka kifo kwa jumla hadi kifo cha aibu cha msalabani, bila kuongeza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Naam” limetumiwa kwa msisitizo wa balagha; alama zote za tanbihi [a] na [b] zimewekwa katika matini kuu.
