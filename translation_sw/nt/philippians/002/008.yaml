  text: alijinyenyekeza mwenyewe, akawa mtiifu mpaka kufa[a]—hata kifo cha msalaba.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hadi kifo”; maana yake ni kwamba utiifu wake ulifikia hadi kifo chenyewe.
