  text: For they all seek their own interests[a], not those of Jesus the Messiah.
translation:
  language: sw
  text: Kwa maana wote wanatafuta masilahi yao wenyewe, wala si yale ya Yesu Masihi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yesu Kristo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πάντες
  choice: wote
  rationale: Nomino hii ya wingi yenye kibainishi inawarejelea watu wote wanaozungumziwa katika muktadha; “wote” ni ya kawaida na inadumisha mkazo wa ujumla.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Kiunganishi hiki kinatoa sababu ya kauli iliyotangulia; “Kwa maana” kinaonyesha uhusiano huo wa ufafanuzi kwa uwazi.
- source_word: τὰ ἑαυτῶν
  choice: masilahi yao wenyewe
  rationale: Usemi huu wa wingi usio na jinsia unamaanisha mambo yanayomhusu mtu mwenyewe. “Masilahi yao wenyewe” unaeleza maana hiyo kwa Kiswahili cha sasa na kudumisha ukinzani wa kimaadili.
- source_word: ζητοῦσιν
  choice: wanatafuta
  rationale: Kitenzi hiki kina maana ya kutafuta au kujitahidi kupata; “wanatafuta” kinafaa kwa pande zote mbili za ukinzani bila kuongeza ufafanuzi usio katika matini.
- source_word: τὰ Ἰησοῦ Χριστοῦ
  choice: yale ya Yesu Masihi
  rationale: “Yale” kinarejelea masilahi yaliyotajwa katika sehemu ya kwanza, na hivyo kuhifadhi muundo wa kidokezo wa Kigiriki bila kurudia neno “masilahi.” “Masihi” inadumisha maana ya cheo Χριστός.
theological_decisions:
- issue: Namna ya kutafsiri Χριστοῦ katika Ἰησοῦ Χριστοῦ
  choice: Yesu Masihi
  alternative: Yesu Kristo
  rationale: “Masihi” huonyesha wazi maana ya cheo Χριστός. Kwa kuwa “Yesu Kristo” pia ni usemi uliozoeleka sana katika Kiswahili na unaweza kuonyesha jina-cheo hili, umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo “wala si yale ya” unaendeleza ukinzani na kurejelea “masilahi” bila marudio mazito.
