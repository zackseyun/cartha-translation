  text: Therefore[a], I hope to send him as soon as I see how things go with me.
translation:
  language: sw
  text: Kwa hiyo, ninatumaini kumtuma mara tu nitakapofahamu wazi hali yangu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “Kwa hiyo, ninatumaini kumtuma nitakapofahamu wazi mambo yanayonihusu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτον
  choice: yeye
  rationale: Kiwakilishi hiki cha kuonyesha kinamrejelea Timotheo katika muktadha wa karibu; “yeye” ni ya asili katika Kiswahili na bado inampa mkazo.
- source_word: μὲν οὖν
  choice: Kwa hiyo
  rationale: Huonyesha mpito wa kimantiki unaotokana na yaliyotangulia; “Kwa hiyo” ni wazi na ya kawaida katika Kiswahili sanifu.
- source_word: ἐλπίζω πέμψαι
  choice: ninatumaini kumtuma
  rationale: Huhifadhi maana ya tumaini au matarajio pamoja na tendo linalokusudiwa la kutuma.
- source_word: ὡς ἂν ἀφίδω
  choice: mara nitakapoona wazi
  rationale: Muundo huu unaeleza wakati ujao unaotegemea Paulo kupata ufahamu wa wazi kuhusu hali yake.
- source_word: ἀφίδω
  choice: nitakapoona wazi
  rationale: Huhifadhi wazo la kuona au kutambua kwa uwazi, si tu kupokea taarifa.
- source_word: τὰ περὶ ἐμέ
  choice: jinsi mambo yangu yatakavyokuwa
  rationale: Ni usemi wa asili unaorejelea hali au mambo yanayomhusu Paulo, huku ukidumisha mwelekeo wa wakati ujao wa muktadha.
- source_word: ἐξαυτῆς
  choice: mara
  rationale: Kielezi hiki kinaonyesha kwamba atamtuma Timotheo bila kuchelewa baada ya hali yake kuwa wazi; “mara” huunganika kwa kawaida na kishazi cha wakati.
