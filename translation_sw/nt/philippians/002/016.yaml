  text: λόγον ζωῆς ἐπέχοντες, εἰς καύχημα ἐμοὶ εἰς ἡμέραν Χριστοῦ, ὅτι οὐκ εἰς κενὸν ἔδραμον οὐδὲ εἰς κενὸν ἐκοπίασα.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/016.yaml
  text: holding fast the word of life[a], for a boast to me in the day of Messiah[b], that I did not run in vain or labor in vain.
translation:
  language: sw
  text: Mkilishikilia neno la uzima[a], ili niwe na jambo la kujivunia katika siku ya Masihi[b], kwa kuwa sikukimbia bure wala sikufanya kazi kwa bidii bure.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mkilitoa” au “mkiwaletea wengine neno la uzima.”
    reason: lexical_alternative
  - marker: b
    text: 'Tafsiri ya kimapokeo: “siku ya Kristo.”'
    reason: alternative_reading
lexical_decisions:
- source_word: λόγον ζωῆς
  choice: neno la uzima
  rationale: 'Huhifadhi usemi mfupi wa Kigiriki na maana zake zinazowezekana: neno linaloleta uzima na neno linalohusu uzima.'
- source_word: ἐπέχοντες
  choice: mkilishikilia
  rationale: Katika muktadha wa utii na uthabiti, maana ya kushikamana kwa nguvu inafaa; maana nyingine ya kulishikilia nje au kulitolea wengine imehifadhiwa katika tanbihi.
- source_word: καύχημα ἐμοὶ
  choice: niwe na sababu ya kujivunia
  rationale: Hutoa Kiswahili cha kawaida kwa jambo linalompa Paulo msingi wa kujivunia, bila kudokeza majivuno yasiyofaa.
- source_word: ἡμέραν Χριστοῦ
  choice: siku ya Masihi
  rationale: Χριστοῦ hapa ina nguvu ya cheo katika usemi wa kieskatolojia; 'Masihi' huhifadhi maana hiyo.
- source_word: οὐκ εἰς κενὸν
  choice: bure
  rationale: Ni usemi wa asili na mfupi wa Kiswahili unaoonyesha jitihada zisizozaa matunda au zisizo na kusudi.
- source_word: ἔδραμον
  choice: sikukimbia
  rationale: Huhifadhi taswira ya Paulo ya mbio kama mfano wa huduma yake.
- source_word: ἐκοπίασα
  choice: sikutaabika
  rationale: Kitenzi hiki huonyesha kazi ngumu yenye uchovu; 'kutaabika' huhifadhi uzito huo na kutofautiana na taswira ya kukimbia.
theological_decisions:
- issue: Utafsiri wa Χριστοῦ katika usemi wa kieskatolojia
  choice: Masihi
  alternative: Kristo
  rationale: Katika 'siku ya Masihi,' neno hilo linafanya kazi kama cheo chenye maana ya kifalme na kimasiya, si kama jina tu.
- issue: Maana ya ἐπέχοντες
  choice: mkilishikilia
  alternative: mkilishikilia mbele / mkiwapelekea wengine
  rationale: Muktadha unaruhusu maana ya kudumu katika neno au ya kulitolea wengine. Maandishi makuu yanafuata mtiririko wa himizo la uthabiti, huku tanbihi ikihifadhi uwezekano wa maana ya nje na ya utangazaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi huhifadhi ulinganifu wa 'sikukimbia bure wala sikutaabika bure,' huku tanbihi zikihifadhi utata halisi wa ἐπέχοντες na tafsiri ya kimapokeo ya Χριστοῦ.
