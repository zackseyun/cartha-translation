  text: μηδὲν κατ’ ἐριθείαν ⸂μηδὲ κατὰ⸃ κενοδοξίαν, ἀλλὰ τῇ ταπεινοφροσύνῃ ἀλλήλους ἡγούμενοι ὑπερέχοντας ἑαυτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/003.yaml
  text: Do nothing from selfish ambition or empty conceit[a], but in humility regard one another as more important than yourselves[b],
translation:
  language: sw
  text: Msifanye jambo lolote kwa nia ya ubinafsi au majivuno matupu[a], bali kwa unyenyekevu, kila mmoja amhesabu mwenzake kuwa bora kuliko yeye mwenyewe[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “majivuno yasiyo na maana” au “kutafuta sifa zisizo na maana.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kuwa wa maana zaidi kuliko yeye mwenyewe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδὲν
  choice: Msifanye jambo lolote
  rationale: Huwasilisha katazo la jumla kwa Kiswahili cha kawaida na kudumisha mtindo wa himizo wa Paulo.
- source_word: κατ’ ἐριθείαν
  choice: kwa nia ya ubinafsi
  rationale: ἐριθεία hapa huelekea kumaanisha tamaa ya kujinufaisha au kujitukuza inayochochea matendo; kifungu hiki ni cha asili na kinaonyesha msukumo wa ndani.
- source_word: κατὰ κενοδοξίαν
  choice: au majivuno yasiyo na maana
  rationale: Huhifadhi wazo la kujitukuza kuliko tupu au kusiko na msingi, kwa lugha inayoeleweka kwa wasomaji wa sasa.
- source_word: τῇ ταπεινοφροσύνῃ
  choice: kwa unyenyekevu
  rationale: Dative inaonyesha namna au mtazamo unaopaswa kuongoza tendo; 'kwa unyenyekevu' ni sahihi na ya kawaida.
- source_word: ἀλλήλους
  choice: kila mmoja ... mwenzake
  rationale: Muundo huu wa Kiswahili unaonyesha wazi maana ya kutendeana ya ἀλλήλους.
- source_word: ἡγούμενοι
  choice: amhesabu
  rationale: Kitenzi kina maana ya kutathmini au kumwona mtu kwa namna fulani; 'amhesabu' hudumisha uzito wa uamuzi wa kimtazamo.
- source_word: ὑπερέχοντας ἑαυτῶν
  choice: kuwa bora kuliko yeye mwenyewe
  rationale: Huhifadhi ulinganisho wa ὑπερέχοντας bila kuufasiri moja kwa moja kuwa thamani ya kimaumbile; tanbihi inatoa uwezekano wa 'wa maana zaidi'.
theological_decisions:
- issue: Maana ya kuwahesabu wengine kuwa ὑπερέχοντας
  choice: kuwa bora kuliko yeye mwenyewe
  alternative: kuwa wa maana zaidi kuliko yeye mwenyewe
  rationale: Neno la Kigiriki linaweza kueleza ubora, ukuu, au kuwa juu ya mwingine. Tafsiri kuu huhifadhi ulinganisho huo, huku tanbihi ikionyesha maana inayowezekana ya kuwapa wengine umuhimu mkubwa zaidi bila kuamua kuwa Paulo anadai ubora wa kimaumbile.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa umoja 'kila mmoja ... yeye mwenyewe' umechaguliwa ili kuepuka utata wa viwakilishi na kuonyesha wajibu wa kila mtu binafsi.
