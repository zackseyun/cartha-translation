lexical_decisions:
- source_word: ἀλλὰ
  choice: bali
  rationale: Huonyesha utofauti mkubwa na kauli iliyotangulia kwa lugha ya kawaida na yenye heshima.
- source_word: ἑαυτὸν ἐκένωσεν
  choice: alijifanya kuwa si kitu
  rationale: Ni usemi wa asili wa Kiswahili unaohifadhi wazo la kujishusha kabisa bila kufafanua kwa kuingiza nadharia kuhusu kuacha sifa za uungu; sitiari ya moja kwa moja ‘alijimwaga’ ingeweza kupotosha.
- source_word: μορφὴν δούλου λαβών
  choice: akatwaa hali ya mtumwa
  rationale: ‘Hali’ hudumisha uzito wa μορφή bila kuifanya kuwa mwonekano wa nje tu, na ‘mtumwa’ huonyesha hadhi ya kufungwa iliyo katika δοῦλος.
- source_word: ἐν ὁμοιώματι ἀνθρώπων γενόμενος
  choice: akawa katika mfano wa wanadamu
  rationale: Hufuata moja kwa moja muundo wa Kigiriki, huhifadhi ὁμοίωμα kama ‘mfano,’ na kutafsiri wingi wa jumla ἀνθρώπων kwa ‘wanadamu.’
- source_word: σχήματι εὑρεθεὶς ὡς ἄνθρωπος
  choice: alipoonekana kwa sura ya nje kuwa mwanadamu
  rationale: ‘Sura ya nje’ hutofautisha σχῆμα na μορφή ya awali, huku ‘mwanadamu’ ikihifadhi maana ya jumla isiyobainisha jinsia ya ἄνθρωπος.
theological_decisions:
- issue: Maana ya ἑαυτὸν ἐκένωσεν katika muktadha wa Kristo
  choice: Kuhifadhi kujifanya kuwa si kitu na kuyaacha mafungu yanayofuata yaeleze namna ya kujishusha huko.
  alternative: Alijimwaga; aliacha sifa zake za uungu.
  rationale: Andiko lenyewe linaunganisha tendo hilo na kutwaa hali ya mtumwa na kuwa katika mfano wa wanadamu; tafsiri haipaswi kuamua nadharia ya kikenosi ambayo Kigiriki hakisemi wazi.
- issue: Nguvu ya ὁμοίωμα katika ‘mfano wa wanadamu’
  choice: Kuhifadhi neno ‘mfano’ bila kudokeza kuwa ubinadamu wake ulikuwa mwonekano wa bandia tu.
  alternative: Alionekana tu kuwa mwanadamu; alikuwa mwanadamu kwa kauli iliyo na nguvu kuliko neno la Kigiriki.
  rationale: Huhifadhi mvutano wa maneno ya Paulo bila kukana ubinadamu halisi wala kusema zaidi ya chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Bali’ na ‘akatwaa’ vina ladha ya maandiko lakini vinaeleweka; ‘mtumwa’ huhifadhi ukali wa δοῦλος. Alama zote za tanbihi zilizoorodheshwa zipo katika matini kuu.
