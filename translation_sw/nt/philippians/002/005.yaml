translation:
  language: sw
  text: Muwe na mtazamo huu miongoni mwenu[a], ambao pia Masihi Yesu[b] alikuwa nao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Muwe na mtazamo huu miongoni mwenu ambao ninyi pia mnao katika Masihi Yesu.”
