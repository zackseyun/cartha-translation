lexical_decisions:
- source_word: τοῦτο
  choice: huu
  rationale: Kiwakilishi hiki kinaelekeza mbele kwenye mtazamo unaoelezwa kwa mfano wa kujinyenyekeza kwa Yesu katika mistari inayofuata.
- source_word: φρονεῖτε
  choice: Muwe na mtazamo
  rationale: Katika matumizi ya Paulo, kitenzi hiki huhusu namna ya kufikiri na mwelekeo wa ndani, si tendo la kufikiri tu; usemi huu pia unadumisha nguvu ya agizo.
- source_word: ἐν ὑμῖν
  choice: miongoni mwenu
  rationale: Kiwakilishi ni cha wingi, na muktadha wa Wafilipi 2:1–4 unahusu maisha ya pamoja ya waumini; kwa hiyo tafsiri ya kijumuiya inafaa zaidi kuliko ya mtu mmoja mmoja.
- source_word: ὃ
  choice: ambao
  rationale: Kiwakilishi hiki cha uhusiano kinaunganisha mtazamo unaoagizwa na ule unaohusishwa na Yesu.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: Masihi Yesu
  rationale: Χριστός hapa ina nguvu ya cheo, hivyo imetafsiriwa ‘Masihi.’ Kiswahili cha matini kuu kimetumia muundo wa kawaida ‘alikuwa nao,’ huku uwezekano wa maana ya kuwa katika Masihi ukihifadhiwa katika tanbihi.
theological_decisions:
- issue: Iwapo kishazi kinaonyesha mtazamo ulioonyeshwa na Yesu au mtazamo ambao waumini wanao kwa kuwa katika yeye.
  choice: 'Usomaji wa Yesu kuwa mfano: “ambao pia Masihi Yesu alikuwa nao.”'
  alternative: 'Usomaji wa ushirika: “ambao ninyi pia mnao katika Masihi Yesu.”'
  rationale: Muktadha unaofuata unaeleza kujishusha kwa Masihi kama mfano kwa waumini, jambo linalounga mkono usomaji wa kwanza. Hata hivyo, Kigiriki kimefupishwa na kinaweza pia kueleweka kwa msingi wa kuwa katika Masihi; uwezekano huo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. “Mtazamo” ni wa kawaida na huwasilisha fikira pamoja na mwelekeo wa ndani; “miongoni mwenu” hudumisha msisitizo wa kijumuiya.
