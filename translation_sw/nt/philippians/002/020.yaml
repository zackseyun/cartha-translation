lexical_decisions:
- source_word: γὰρ
  choice: Kwa maana
  rationale: Inaendeleza nguvu ya maelezo inayounganisha kauli hii na muktadha uliotangulia.
- source_word: οὐδένα ... ἔχω
  choice: sina mtu mwingine
  rationale: Ni usemi wa kawaida wa Kiswahili; “mwingine” hujitokeza kimuktadha kwa kuwa Paulo anamlinganisha Timotheo na wengine, bila kudokeza kwamba Paulo hana mtu kabisa.
- source_word: ἰσόψυχον
  choice: mwenye moyo kama wake
  rationale: Neno hili adimu linamaanisha kwa karibu ‘mwenye nafsi iliyo sawa’; hapa linaonyesha mtu mwenye mwelekeo wa ndani kama wa Timotheo. Kiswahili hiki ni cha asili na huhifadhi ulinganisho wa kimuktadha.
- source_word: ὅστις
  choice: ambaye
  rationale: Kiwakilishi rejeshi cha kawaida kinaunganisha sifa ya mtu huyo na tendo lake linalotarajiwa.
- source_word: γνησίως
  choice: kwa unyofu
  rationale: Hueleza kwamba kujali kwake ni kwa kweli na kwa nia safi, si kwa kujifanya.
- source_word: τὰ περὶ ὑμῶν
  choice: mambo yenu
  rationale: Huhifadhi upana wa kirai cha Kigiriki, ambacho kinaweza kumaanisha hali, mahitaji, na mambo yanayowahusu Wafilipi.
- source_word: μεριμνήσει
  choice: atajali
  rationale: Katika muktadha huu kitenzi kina maana chanya ya kuwahangaikia kwa uangalifu, si wasiwasi wenye dhambi.
