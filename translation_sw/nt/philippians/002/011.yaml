  source_fidelity: “na kila ulimi ukiri kwamba Yesu Masihi ni Bwana, kwa utukufu wa Mungu Baba” accurately represents καὶ πᾶσα γλῶσσα ἐξομολογήσηται ὅτι κύριος Ἰησοῦς Χριστὸς εἰς δόξαν θεοῦ πατρός. The dependent subjunctive “ukiri” appropriately carries the purpose-oriented subjunctive in continuity with verse 10. “Kila ulimi” retains the Greek bodily metaphor, and the confession, lordship title, and God-the-Father doxological goal are all preserved.
