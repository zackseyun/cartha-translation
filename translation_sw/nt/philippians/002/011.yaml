  text: καὶ πᾶσα γλῶσσα ἐξομολογήσηται ὅτι κύριος Ἰησοῦς Χριστὸς εἰς δόξαν θεοῦ πατρός.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/011.yaml
  text: and every tongue should confess that Jesus the Messiah is Lord[b][a], to the glory of God the Father.
translation:
  language: sw
  text: na kila ulimi ukiri kwamba Yesu Masihi ni Bwana[a], kwa utukufu wa Mungu Baba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “Yesu Kristo ni Bwana.”'
    reason: Ufasiri wa jadi wa Χριστός kama ‘Kristo’.
lexical_decisions:
- source_word: πᾶσα γλῶσσα
  choice: kila ulimi
  rationale: Ufasiri wa karibu unaohifadhi taswira ya kiungo cha mwili kinachotamka ungamo, huku ukiwa usemi unaoeleweka katika Kiswahili.
- source_word: ἐξομολογήσηται
  choice: ukiri
  rationale: Kitenzi hiki kinaonyesha kukiri au kutangaza wazi. Umbo la kutegemea ‘ukiri’ linaakisi hali ya utegemezi ya Kigiriki na uhusiano wake na kusudi lililoanza katika mstari uliotangulia.
- source_word: κύριος
  choice: Bwana
  rationale: ‘Bwana’ ni tafsiri ya kawaida na yenye uzito unaofaa kwa κύριος hapa, ikihifadhi dai la ungamo kuhusu Yesu bila kulipunguza kuwa ‘mkuu’ au ‘mwenye mamlaka’ tu.
- source_word: Χριστός
  choice: Masihi
  rationale: Hapa Χριστός bado ina nguvu ya cheo, hivyo ‘Masihi’ inawasilisha maana yake badala ya kutegemea tu umbo la jadi ‘Kristo’.
- source_word: εἰς δόξαν
  choice: kwa utukufu wa
  rationale: Katika muktadha huu ‘kwa utukufu wa’ ni Kiswahili cha kawaida kinachoonyesha kwamba ungamo hilo linaelekea katika kumletea Mungu utukufu.
- source_word: θεοῦ πατρός
  choice: Mungu Baba
  rationale: Huu ni mpangilio wa kawaida na wazi wa Kiswahili kwa kumtaja Mungu akiwa Baba.
theological_decisions:
- issue: Namna ya kutafsiri Χριστός katika ungamo kuhusu Yesu
  choice: Masihi
  alternative: Kristo
  rationale: ‘Masihi’ huhifadhi wazi maana ya cheo cha Χριστός. ‘Kristo’ ni umbo la jadi linalowezekana na limetolewa katika tanbihi, bila kuingiza fundisho la ziada.
- issue: Uhusiano wa Yesu Masihi na κύριος
  choice: Yesu Masihi ni Bwana
  alternative: Bwana ni Yesu Masihi
  rationale: Mpangilio uliochaguliwa ni wa asili zaidi katika Kiswahili na unadumisha kiini cha ungamo la Kigiriki kwamba Yesu Masihi ni Bwana, bila kufafanua zaidi namna ya uhusiano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima, na rahisi kusomeka. Herufi ndogo mwanzoni na kiunganishi ‘na’ vinahifadhi mwendelezo wa sentensi kutoka mstari uliotangulia.
