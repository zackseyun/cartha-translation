  text: Εἴ τις οὖν παράκλησις ἐν Χριστῷ, εἴ τι παραμύθιον ἀγάπης, εἴ τις κοινωνία πνεύματος, εἴ τις σπλάγχνα καὶ οἰκτιρμοί,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/001.yaml
  text: So if there is any encouragement in Messiah[a], if any comfort from love, if any fellowship of the Spirit, if any affection and compassion,
translation:
  language: sw
  text: Kwa hiyo, ikiwa kuna kutiwa moyo kokote katika Masihi, ikiwa kuna faraja yoyote itokanayo na upendo, ikiwa kuna ushirika wowote wa Roho[a], ikiwa kuna upendo wa ndani na huruma,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kushiriki katika Roho”; kwa uwezekano mdogo, “ushirika katika roho.”
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Huonyesha hitimisho au mwendelezo wa hoja ya Paulo kutoka katika muktadha uliotangulia kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: παράκλησις
  choice: faraja
  rationale: Katika muktadha huu neno lina maana ya kutia moyo na kuimarisha kwa kufariji. “Faraja” ni ya kawaida na haibani maana kuwa amri au nasaha pekee.
- source_word: ἐν Χριστῷ
  choice: katika Masihi
  rationale: Kihusishi ἐν kimehifadhiwa kwa “katika,” na Χριστῷ limetafsiriwa kama cheo “Masihi,” si kama jina tu.
- source_word: παραμύθιον
  choice: kitulizo
  rationale: Neno linahusu faraja yenye kutuliza. “Kitulizo” hulitofautisha na παράκλησις iliyotafsiriwa “faraja” huku likihifadhi ukaribu wa maana.
- source_word: ἀγάπης
  choice: kitokanacho na upendo
  rationale: Muundo huu wa Kiswahili unaeleza kwa kawaida kwamba kitulizo hicho hutoka katika upendo, bila kudai kwa lazima uhusiano mmoja tu wa kisarufi.
- source_word: κοινωνία
  choice: ushirika
  rationale: “Ushirika” huonyesha uhusiano wa pamoja na kushiriki, unaofaa katika wito huu wa umoja.
- source_word: πνεύματος
  choice: wa Roho
  rationale: Inaelekea Paulo anamrejelea Roho Mtakatifu; hata hivyo, uhusiano halisi wa kisarufi kati ya κοινωνία na πνεύματος unabaki wenye uwezekano zaidi ya mmoja, ambao umeonyeshwa katika tanbihi.
- source_word: σπλάγχνα
  choice: mapenzi ya ndani
  rationale: Neno hilo, ambalo kihalisi huhusu viungo vya ndani, hutumiwa kwa hisia nyororo na za kina. “Mapenzi ya ndani” huwasilisha maana hiyo bila lugha ya kianatomia.
- source_word: οἰκτιρμοί
  choice: huruma
  rationale: “Huruma” ni tafsiri ya kawaida na ya sasa kwa hisia za rehema au kuwajali wengine kwa kina.
theological_decisions:
- issue: Ikiwa πνεύματος inamrejelea Roho Mtakatifu na jinsi ya kueleza uhusiano wake na κοινωνία
  choice: ushirika wa Roho
  alternative: kushiriki katika Roho; au, kwa uwezekano mdogo, ushirika katika roho
  rationale: Katika mfululizo huu wa mambo ya Kikristo, rejeo kwa Roho Mtakatifu ndilo linalowezekana zaidi. Hata hivyo, hali ya umilikishi katika Kigiriki haisemi wazi ikiwa ni ushirika unaotolewa na Roho au kushiriki katika Roho; tanbihi huhifadhi utata huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa masharti unaorudiwa umehifadhiwa, pamoja na koma ya mwisho inayoonyesha kwamba sentensi inaendelea katika mstari unaofuata.
