  text: καὶ γὰρ ἠσθένησεν παραπλήσιον ⸀θανάτῳ· ἀλλὰ ὁ θεὸς ⸂ἠλέησεν αὐτόν⸃, οὐκ αὐτὸν δὲ μόνον ἀλλὰ καὶ ἐμέ, ἵνα μὴ λύπην ἐπὶ λύπην σχῶ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/027.yaml
  text: For indeed he was sick[a], nearly to death; but God had mercy on him, and not on him only but also on me[b], so that I might not have sorrow upon sorrow.
translation:
  language: sw
  text: Kwa maana kweli alikuwa mgonjwa, karibu kufa[a]. Lakini Mungu alimrehemu, na si yeye tu bali na mimi pia, ili nisiwe na huzuni juu ya huzuni[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “karibu na kifo” au “karibu kufikia kifo.”
    reason: lexical_alternative
  - marker: b
    text: Kwa maana halisi, “huzuni juu ya huzuni,” usemi unaoonyesha huzuni inayoongezeka.
    reason: cultural_note
lexical_decisions:
- source_word: ἠσθένησεν
  choice: aliugua
  rationale: Katika muktadha huu kitenzi kinataja ugonjwa wa mwili. “Aliugua” ni Kiswahili cha kawaida na huwasilisha tukio hilo kwa uwazi.
- source_word: παραπλήσιον θανάτῳ
  choice: kuwa karibu kufa
  rationale: Kirai hiki kinaonyesha kwamba alikaribia kifo bila kusema kwamba alikufa. “Kuwa karibu kufa” ni cha asili na sahihi katika Kiswahili.
- source_word: ἠλέησεν αὐτόν
  choice: alimrehemu
  rationale: “Alimrehemu” huhifadhi maana ya Mungu kumwonyesha rehema na huruma, pamoja na uzito wa kitheolojia wa kitenzi cha Kigiriki.
- source_word: οὐκ αὐτὸν δὲ μόνον ἀλλὰ καὶ ἐμέ
  choice: wala si yeye tu, bali na mimi pia
  rationale: Muundo huu huhifadhi ulinganisho na msisitizo wa kwamba rehema ya Mungu ilimhusu Epafrodito na pia Paulo.
- source_word: ἵνα μὴ
  choice: ili nisiwe na
  rationale: “Ili nisiwe na” huonyesha kusudi au matokeo yaliyokusudiwa kuepukwa bila kulazimisha ufafanuzi zaidi.
- source_word: λύπην ἐπὶ λύπην
  choice: huzuni juu ya huzuni
  rationale: Tafsiri hii huhifadhi urudiaji na taswira ya huzuni moja kuongezwa juu ya nyingine.
- source_word: σχῶ
  choice: nisiwe na
  rationale: Kitenzi ἔχω hapa kina maana pana ya kuwa na au kupata huzuni; muundo hasi “nisiwe na” ni wa asili pamoja na ἵνα μή.
theological_decisions:
- issue: Maana ya Mungu kumrehemu Paulo
  choice: Kudumisha kauli kwamba Mungu alimrehemu pia Paulo bila kufafanua namna rehema hiyo ilivyotenda kazi
  alternative: Kusema wazi kwamba rehema kwa Paulo ilikuwa kumponya Epafrodito
  rationale: Muktadha unaashiria uhusiano huo, lakini mstari wenyewe unaacha kauli hiyo ikiwa pana; tafsiri haipaswi kuibana kwa maelezo yasiyotamkwa moja kwa moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa Kigiriki wa “huzuni juu ya huzuni” umehifadhiwa kwa sababu ya nguvu yake ya balagha na umefafanuliwa katika tanbihi.
