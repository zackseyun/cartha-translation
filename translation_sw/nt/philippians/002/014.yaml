  text: Πάντα ποιεῖτε χωρὶς γογγυσμῶν καὶ διαλογισμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/014.yaml
  text: Do everything without grumbling or arguing[b][a],
translation:
  language: sw
  text: Fanyeni kila jambo bila kunung'unika wala kubishana.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “bila kunung’unika wala kuzozana.” Neno lililotafsiriwa “kubishana” linaweza pia kumaanisha kuhoji au kuwa na mashaka katika miktadha mingine, ingawa hapa huenda linamaanisha mabishano yenye ugomvi.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάντα
  choice: kila jambo
  rationale: Nomino hii iliyotumika kwa maana pana inajumuisha yote wanayofanya; “kila jambo” ni Kiswahili cha kawaida na huhifadhi upeo wa agizo.
- source_word: ποιεῖτε
  choice: Fanyeni
  rationale: Kauli ya amri ya wakati uliopo inaelekeza mwenendo unaoendelea. “Fanyeni” ni amri ya wingi ya kawaida inayofaa muktadha.
- source_word: χωρὶς
  choice: bila
  rationale: “Bila” huonyesha wazi kwamba kunung’unika na kubishana havipaswi kuwamo katika matendo yao.
- source_word: γογγυσμῶν
  choice: kunung'unika
  rationale: Neno hili humaanisha manung’uniko au malalamiko yanayotolewa kwa sauti ya chini; “kunung’unika” ni la kawaida na pia huhifadhi mwangwi unaowezekana wa manung’uniko ya Israeli jangwani.
- source_word: διαλογισμῶν
  choice: kubishana
  rationale: Ingawa neno linaweza kumaanisha mawazo, hoja, au mashaka katika miktadha mingine, hapa linaelekea kumaanisha mabishano yenye ugomvi; “kubishana” ni wazi na la asili kwa wasomaji wa sasa.
theological_decisions:
- issue: Maana ya διαλογισμῶν
  choice: kubishana
  alternative: kuwa na mashaka / kuhoji
  rationale: Muktadha wa agizo kuhusu mwenendo wa pamoja unaunga mkono maana ya mabishano, lakini tanbihi huhifadhi uwezekano mpana wa kileksika bila kuuficha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo mfupi unafuata msisitizo wa maandishi ya Kigiriki; “wala” huunganisha kwa kawaida mambo mawili yanayokatazwa.
