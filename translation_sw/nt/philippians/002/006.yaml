lexical_decisions:
- source_word: ὃς
  choice: ambaye
  rationale: Kiwakilishi hiki cha uhusiano kinaunganisha mstari huu na Kristo aliyetajwa katika mstari uliotangulia.
- source_word: ἐν μορφῇ θεοῦ
  choice: katika umbo la Mungu
  rationale: “Umbo” huhifadhi usemi wa Kigiriki μορφή bila kuubadili kuwa ufafanuzi finyu wa kimetafizikia; pia ni lugha ya Kiswahili inayoeleweka na yenye hadhi.
- source_word: ὑπάρχων
  choice: ingawa alikuwa
  rationale: 'Tafsiri hii huonyesha nguvu ya kukubali hali fulani kisha kuleta tofauti katika hoja: licha ya hali yake, Kristo hakuitumia kwa kujinufaisha. Uwezekano wa tafsiri ya hali tu umehifadhiwa katika tanbihi.'
- source_word: ἁρπαγμὸν
  choice: kitu cha kunyakua
  rationale: Neno ἁρπαγμός lina utata mkubwa. “Kitu cha kunyakua” hudumisha picha ya kutwaa au kushikilia kitu bila kufunga maana kwenye wazo la kukitumia kwa faida binafsi; maana hiyo nyingine imehifadhiwa katika tanbihi.
- source_word: ἡγήσατο
  choice: hakuhesabu
  rationale: “Kuhesabu” hapa humaanisha kuangalia au kuchukulia jambo kwa namna fulani, na hutoa tafsiri fupi iliyo karibu na ἡγέομαι.
- source_word: τὸ εἶναι ἴσα θεῷ
  choice: kuwa sawa na Mungu
  rationale: Hii inafuata kwa karibu kishazi cha Kigiriki chenye kitenzi-jina na kuhifadhi wazo la usawa na Mungu bila kuongeza maelezo ya kimafundisho.
theological_decisions:
- issue: Nguvu ya Kikristo ya ἐν μορφῇ θεοῦ
  choice: katika umbo la Mungu
  alternative: katika asili ya Mungu
  rationale: Tafsiri inahifadhi maneno ya Paulo na uzito wake wa juu kuhusu Kristo, bila kuingiza moja kwa moja istilahi za mafundisho ya baadaye.
- issue: Maana ya ἁρπαγμός kuhusiana na kuwa sawa na Mungu
  choice: kitu cha kunyakua
  alternative: kitu cha kutumia kwa faida yake mwenyewe
  rationale: Kwa kuwa neno linaweza kueleweka kama kitu cha kutwaa, kushikilia, au kutumia kwa kujinufaisha, matini kuu inatumia tafsiri iliyo karibu na picha ya neno, huku tanbihi ikihifadhi maana ya kimuktadha ya kutumia fursa kwa faida binafsi.
- issue: Nguvu ya ὑπάρχων katika hoja
  choice: ingawa alikuwa
  alternative: akiwa
  rationale: Muktadha wa kujishusha katika mstari unaofuata unaunga mkono maana ya kukubali hali kisha kuonyesha tofauti, lakini tafsiri ya hali tu bado inawezekana na imeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umewekwa wazi kwa wasomaji wa kawaida huku ukihifadhi utata halisi wa ὑπάρχων na ἁρπαγμός. Alama zote za tanbihi zimewekwa katika matini kuu.
