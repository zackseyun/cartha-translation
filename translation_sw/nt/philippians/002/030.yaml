  text: ὅτι διὰ τὸ ἔργον ⸀Χριστοῦ μέχρι θανάτου ἤγγισεν, ⸀παραβολευσάμενος τῇ ψυχῇ ἵνα ἀναπληρώσῃ τὸ ὑμῶν ὑστέρημα τῆς πρός με λειτουργίας.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/030.yaml
  text: because for the work of Messiah he came near to death[c][b][a], risking his life to make up for what was lacking in your service to me.
translation:
  language: sw
  text: Kwa sababu ya kazi ya Masihi[a][c], alikaribia kufa, akihatarisha maisha yake ili kukamilisha kile kilichokosekana[b] katika huduma yenu kwangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “Kristo.” Kigiriki: “kazi ya Kristo/Masihi.”'
    reason: alternative_reading
  - marker: b
    text: “Kile kilichokosekana” ni huduma ambayo Wafilipi hawakuweza kumtolea Paulo wao wenyewe kwa sababu hawakuwapo; haimaanishi kwamba hawakuwa tayari kumsaidia.
    reason: cultural_note
  - marker: c
    text: Au, “Kwa ajili ya kazi ya Masihi.”
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τὸ ἔργον Χριστοῦ
  choice: Kwa sababu ya kazi ya Masihi
  rationale: διά pamoja na hali ya kushutumiwa hapa inaonyesha sababu au kusudi. “Kwa sababu ya” ni Kiswahili cha kawaida kinachoonyesha sababu, huku dokezo [c] likihifadhi uwezekano wa maana ya “kwa ajili ya.”
- source_word: Χριστοῦ
  choice: Masihi
  rationale: Χριστός hapa inasikika kama cheo; “Masihi” huhifadhi maana yake badala ya kuitumia tu kama jina. “Kristo” limetolewa kama tafsiri nyingine katika dokezo.
- source_word: μέχρι θανάτου ἤγγισεν
  choice: alikuwa karibu kufa
  rationale: Hii ni njia ya asili ya Kiswahili ya kueleza kwamba alikaribia kifo, bila kudai kwamba alikufa.
- source_word: παραβολευσάμενος τῇ ψυχῇ
  choice: akihatarisha maisha yake
  rationale: Kitenzi kinaonyesha kujitia katika hatari, na ψυχή hapa ni uhai wa duniani; “maisha yake” ni wazi na ya kawaida kuliko “nafsi yake.”
- source_word: ἵνα ἀναπληρώσῃ
  choice: ili kukamilisha
  rationale: ἵνα inaonyesha kusudi, na ἀναπληρόω hapa ni kujazia au kutimiza kile ambacho hakikuweza kufanywa.
- source_word: τὸ ὑμῶν ὑστέρημα
  choice: kile kilichokosekana
  rationale: Usemi huu huhifadhi wazo la jambo lililokuwa halijapatikana bila kuwalaumu Wafilipi kwa uzembe au ukosefu wa nia.
- source_word: τῆς πρός με λειτουργίας
  choice: katika huduma yenu kwangu
  rationale: λειτουργία hapa ni msaada au huduma ya vitendo; “huduma” ni neno pana linalofaa muktadha.
theological_decisions:
- issue: Tafsiri ya Χριστοῦ katika usemi wa Paulo
  choice: Masihi
  alternative: Kristo
  rationale: “Masihi” hutafsiri cheo na kudumisha nguvu yake ya kimaana; “Kristo” ni umbo lililozoeleka na limetajwa katika dokezo bila kulazimisha mojawapo kuwa jina tu.
- issue: Maana ya upungufu katika huduma ya Wafilipi
  choice: kile kilichokosekana
  alternative: upungufu wenu
  rationale: Muktadha unaonyesha huduma ambayo hawakuweza kuitoa wao wenyewe kwa sababu ya kutokuwapo kwao, si lawama kuhusu kutokuwa tayari. Tafsiri kuu inadumisha usemi wa chanzo, na dokezo linafafanua bila kuubadili.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni ya kawaida kwa msomaji wa leo, lakini inadumisha tofauti kati ya sababu na kusudi katika διά kwa dokezo, pamoja na mvutano wa “kile kilichokosekana” bila kuugeuza kuwa lawama.
