  text: Each of you should look not only to your own interests[a], but also to the interests of others.
translation:
  language: sw
  text: Kila mmoja wenu asiangalie mambo yake mwenyewe tu,[a] bali pia mambo ya wengine.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “masilahi yake mwenyewe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σκοποῦντες
  choice: asiangalie
  rationale: Kitenzi σκοπέω hapa kina maana ya kuelekeza uangalifu au kujali jambo fulani. “Kuangalia” ni cha kawaida katika Kiswahili na, katika muktadha huu, kinadokeza kuzingatia mahitaji na hali ya mtu.
- source_word: τὰ ἑαυτῶν
  choice: mambo yake mwenyewe
  rationale: Muundo huu wa wingi usio na nomino iliyotajwa una maana pana kuliko mali pekee; “mambo yake mwenyewe” huhifadhi upana huo bila kufafanua kupita kiasi kuwa masilahi, mahitaji, au faida tu.
- source_word: ἕκαστοι
  choice: Kila mmoja wenu
  rationale: Neno hili linaelekeza agizo kwa kila mtu mmoja mmoja ndani ya jumuiya. “Kila mmoja wenu” huonyesha wazi nguvu hiyo ya mgawanyo.
- source_word: ἀλλὰ καὶ
  choice: si ... tu, bali pia
  rationale: Muundo huu wa Kiswahili huwasilisha kwa kawaida utofautishaji pamoja na nyongeza iliyomo katika ἀλλὰ καὶ.
- source_word: τὰ ἑτέρων
  choice: mambo ya wengine
  rationale: Kama τὰ ἑαυτῶν, kirai hiki kinahusu kwa upana masuala, mahitaji, hali, au masilahi ya wengine. “Mambo ya wengine” huhifadhi upana wa asili.
theological_decisions:
- issue: Je, mstari unakataza kabisa kushughulikia mambo ya mtu mwenyewe?
  choice: Tafsiri “asiangalie tu ... bali pia” inaonyesha kwamba mtu hapaswi kujali mambo yake peke yake, bali ajali pia ya wengine.
  alternative: “Asiangalie mambo yake mwenyewe, bali pia mambo ya wengine,” ambayo inaweza kusikika kama katazo kamili la kujali mambo yake.
  rationale: Ingawa μή ... ἀλλὰ καὶ kwa ukaribu ni “si ... bali pia,” muktadha na καί huunga mkono maana ya kutotazama mambo binafsi pekee, si kupuuza kabisa wajibu wa mtu mwenyewe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. “Mambo” limechaguliwa ili kuhifadhi upana wa kirai cha Kigiriki; tanbihi inaonyesha maana ya kimuktadha ya “masilahi.”
