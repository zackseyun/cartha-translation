lexical_decisions:
- source_word: ἐπιεικές
  choice: upole
  rationale: Katika muktadha huu neno linamaanisha mwenendo wa kuwajali wengine, kutokuwa mkali, na kuwa tayari kutodai haki zako bila huruma. “Upole” ni neno la kawaida na la heshima katika Kiswahili, ingawa tanbihi inaonyesha upana wa maana ya Kigiriki.
- source_word: γνωσθήτω
  choice: na ujulikane
  rationale: 'Muundo huu unawakilisha agizo la hali ya kutendwa na unasikika kwa kawaida katika Kiswahili: sifa hiyo ionekane na kutambuliwa na wengine.'
- source_word: πᾶσιν ἀνθρώποις
  choice: kwa watu wote
  rationale: Tafsiri hii inaonyesha wazi kwamba kauli hiyo inawahusu watu wote bila kuifanya iwe ya jinsia moja.
- source_word: κύριος
  choice: Bwana
  rationale: “Bwana” ni tafsiri ya kawaida ya kichwa κύριος na inadumisha uzito wake wa kitheolojia.
- source_word: ἐγγύς
  choice: yu karibu
  rationale: '“Karibu” inadumisha utata wenye maana katika Kigiriki: inaweza kurejelea kuwapo kwa Bwana karibu, kuja kwake kuwa karibu, au yote mawili.'
theological_decisions:
- issue: Maana ya ὁ κύριος ἐγγύς
  choice: Bwana yu karibu
  alternative: Bwana yuko karibu nasi; au, Bwana anakuja hivi karibuni
  rationale: Kauli ya Kigiriki inaweza kuwa na maana ya ukaribu wa Bwana kwa kuwapo kwake, ukaribu wa wakati wa kuja kwake, au maana zote mbili. Tafsiri kuu haichagui moja na kuondoa nyingine.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wa heshima, na unaoeleweka kwa wasomaji wa kawaida. “Yu karibu” ni kifupi chenye hadhi ya maandiko na huhifadhi utata wa Kigiriki; “na ujulikane” hutoa agizo kwa njia ya kawaida bila kuwa nzito.
