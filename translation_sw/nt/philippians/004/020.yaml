  text: To our God and Father be the glory forever and ever[a]. Amen.
translation:
  language: sw
  text: Mungu wetu na Baba yetu apewe utukufu milele na milele[a]. Amina.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa karibu zaidi: “kwa zama za zama.”'
