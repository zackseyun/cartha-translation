lexical_decisions:
- source_word: δὲ
  choice: (haijatafsiriwa kwa neno maalumu)
  rationale: Ni kiunganishi hafifu kinacholeta hitimisho la sifa; katika Kiswahili, kuanza moja kwa moja ni kwa asili zaidi kuliko kuongeza ‘sasa’ au kudokeza utofautishaji mkali.
- source_word: θεῷ καὶ πατρὶ ἡμῶν
  choice: Mungu wetu na Baba yetu
  rationale: Kirai hiki kinamrejelea mtu mmoja. Kurudia ‘yetu’ huweka wazi kwa Kiswahili kwamba yeye ni Mungu wetu na pia Baba yetu.
- source_word: ἡ δόξα
  choice: apewe utukufu
  rationale: Kigiriki hakina kitenzi hapa. ‘Apewe utukufu’ huwasilisha kwa kawaida dhamira ya tamko hili la sifa bila kulifanya kuwa dai la umiliki pekee.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: milele na milele
  rationale: Hii ni nahau ya muda usio na mwisho; usemi huu wa Kiswahili ni wa kawaida, wenye hadhi, na huhifadhi uzito wa sifa.
- source_word: ἀμήν
  choice: Amina
  rationale: Umbo hili lililozoeleka katika Kiswahili linahifadhi uthibitisho wa kiliturujia wa neno la asili.
theological_decisions:
- issue: Kukamilisha kitenzi kinachodokezwa katika tamko la sifa
  choice: apewe utukufu
  alternative: utukufu ni wake; kwake uwe utukufu
  rationale: Kifungu cha Kigiriki hakina kitenzi na kwa hiyo kinaweza kusikika kama tamko au ombi la sifa. ‘Apewe utukufu’ linafaa kwa Kiswahili cha sasa na kwa kazi ya kidoksolojia ya sentensi, bila kudai kwamba Kigiriki chenyewe kina kitenzi cha kuamuru.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni fupi na ya kidoksolojia; ‘Amina’ limetumiwa kwa umbo lililozoeleka katika Biblia na ibada za Kiswahili.
