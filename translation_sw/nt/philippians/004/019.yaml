base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/019.yaml
  text: And my God will supply every need of yours according to his riches in glory in Messiah Jesus[a][b][c][d].
translation:
  language: sw
  text: Naye Mungu wangu atakidhi kila hitaji lenu kwa kadiri ya utajiri wake katika utukufu, katika Masihi Yesu[a][b][c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “katika Kristo Yesu.”'
    reason: lexical_alternative
  - marker: b
    text: “Kwa kadiri ya utajiri wake” huonyesha kipimo cha utoaji wa Mungu, si tu kwamba Mungu hutoa kutoka katika utajiri wake.
    reason: alternative_reading
  - marker: c
    text: 'Au huenda: “kwa utukufu,” badala ya “katika utukufu.”'
    reason: alternative_reading
  - marker: d
    text: 'Au, virai hivi vinaweza kusomwa pamoja: “katika utukufu katika Masihi Yesu.”'
    reason: previous_rendering
lexical_decisions:
- source_word: ὁ δὲ θεός μου
  choice: Naye Mungu wangu
  rationale: δέ ni kiunganishi chepesi katika muktadha huu; “naye” huendeleza wazo kwa kawaida bila kusisitiza tofauti isiyokusudiwa, huku ikihifadhi “Mungu wangu.”
- source_word: πληρώσει
  choice: atakidhi
  rationale: Katika muktadha huu πληρόω ina maana ya kutosheleza au kutoa kile kinachohitajika. “Atakidhi” ni Kiswahili cha kawaida na sahihi kuliko tafsiri halisi ya “atajaza.”
- source_word: πᾶσαν χρείαν ὑμῶν
  choice: kila hitaji lenu
  rationale: χρεία humaanisha hitaji au jambo la lazima; “kila hitaji lenu” huhifadhi nguvu ya kugawa ya πᾶσαν na umilikaji wa ὑμῶν kwa lugha ya kawaida.
- source_word: κατὰ τὸ πλοῦτος αὐτοῦ
  choice: kwa kadiri ya utajiri wake
  rationale: κατά pamoja na nomino katika hali ya akusativi hapa huonyesha kipimo au kiwango. “Kwa kadiri ya” huepuka kudokeza kwamba Mungu hutoa sehemu ndogo tu kutoka katika utajiri wake.
- source_word: ἐν δόξῃ
  choice: katika utukufu
  rationale: Tafsiri hii rasmi huhifadhi uwazi wa maana wa kirai cha Kigiriki badala ya kuamua kimyakimya kwamba kinamaanisha tu “kwa namna ya utukufu.”
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: katika Masihi Yesu
  rationale: Χριστός hapa ni cheo cha kimasiya. “Masihi” hutafsiri maana ya cheo hicho, huku umbo la mapokeo “Kristo” likitolewa katika tanbihi.
theological_decisions:
- issue: Jinsi ya kutafsiri Χριστός katika ἐν Χριστῷ Ἰησοῦ
  choice: katika Masihi Yesu
  alternative: katika Kristo Yesu
  rationale: Muktadha unaruhusu cheo Χριστός kitafsiriwe kwa maana yake, “Masihi,” bila kukifanya kuwa jina tu. Umbo lililozoeleka “Kristo Yesu” limehifadhiwa kama tafsiri mbadala katika tanbihi.
- issue: Uhusiano wa ἐν δόξῃ na ἐν Χριστῷ Ἰησοῦ
  choice: katika utukufu, katika Masihi Yesu
  alternative: katika utukufu katika Masihi Yesu
  rationale: Koma husaidia usomaji wa Kiswahili bila kufuta uwezekano kwamba virai hivyo viwili vina uhusiano wa karibu. Ujenzi usio na koma umetolewa katika tanbihi ili kuhifadhi mvutano wa kisintaksia wa Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. “Atakidhi kila hitaji lenu” ni wazi kwa wasomaji wa kawaida; “kwa kadiri ya” huhifadhi wazo la kipimo, na tanbihi huhifadhi njia mbadala za kileksia na kisintaksia bila kuamua utata wa asili kupita kiasi.
