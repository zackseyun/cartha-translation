  text: ἀσπάζονται ὑμᾶς πάντες οἱ ἅγιοι, μάλιστα δὲ οἱ ἐκ τῆς Καίσαρος οἰκίας.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/022.yaml
  text: All the saints greet you[a], especially those of Caesar’s household.
translation:
  language: sw
  text: Watakatifu wote wanawasalimu, hasa wale wa nyumbani mwa Kaisari.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, watu waliohusishwa na kaya au utumishi wa Kaisari; si lazima wawe jamaa zake.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάζονται
  choice: wanawasalimu
  rationale: Ni kitenzi cha kawaida cha salamu katika barua; ‘wanawasalimu’ ni Kiswahili cha sasa na hudumisha maana ya moja kwa moja.
- source_word: πάντες οἱ ἅγιοι
  choice: Watakatifu wote
  rationale: ἅγιοι ni jina la kawaida la Paulo kwa waumini kama watu waliowekwa wakfu; ‘watakatifu’ huhifadhi istilahi hiyo bila kuifafanua kwa maneno mengine.
- source_word: μάλιστα δὲ
  choice: hasa
  rationale: Huonyesha kundi linalosisitizwa ndani ya kundi kubwa zaidi; ‘hasa’ ni tafsiri fupi na ya kawaida.
- source_word: οἱ ἐκ τῆς Καίσαρος οἰκίας
  choice: wale wa nyumbani mwa Kaisari
  rationale: Kirai hiki kinawataja watu waliohusishwa na kaya au utumishi wa kifalme, bila kudai kwamba walikuwa jamaa wa damu wa Kaisari.
- source_word: Καίσαρος
  choice: Kaisari
  rationale: Huhifadhi jina au cheo cha kihistoria kilichotumiwa katika Kigiriki badala ya kukibadili kuwa ‘mfalme’.
theological_decisions:
- issue: Maana ya ‘watakatifu’ katika matumizi ya Paulo
  choice: Imetafsiriwa ‘watakatifu’ kama jina la waumini kwa ujumla.
  alternative: watu wa Mungu; waumini
  rationale: Neno hapa halimaanishi tabaka maalumu la Wakristo wenye utakatifu wa kipekee. Kudumisha ‘watakatifu’ huhifadhi msamiati wa Paulo bila kuingiza ufafanuzi wa kimadhehebu.
- issue: Utambulisho wa watu wa nyumbani mwa Kaisari
  choice: Kirai kimeachwa kikiwahusu watu wa kaya au taasisi ya Kaisari kwa maana pana.
  alternative: jamaa wa Kaisari
  rationale: Kigiriki hakilazimishi maana ya ndugu wa damu; kinaweza kujumuisha watumwa, waliowekwa huru, watumishi, au maafisa waliohusishwa na kaya ya kifalme.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. ‘Nyumbani mwa Kaisari’ ni usemi wa asili unaohifadhi upana wa οἰκία katika muktadha huu.
