base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/006.yaml
  text: Do not be anxious about anything[a], but in everything, by prayer and petition with thanksgiving[c][b], let your requests be made known to God.
translation:
  language: sw
  text: Msihangaike kuhusu jambo lolote,[a] bali katika kila jambo, kwa sala na dua pamoja na shukrani, mjulisheni Mungu haja zenu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Msiwe na wasiwasi kuhusu jambo lolote.”
    reason: lexical_alternative
  - marker: b
    text: Au, “haja zenu na zijulikane mbele za Mungu.”
    reason: translation_alternative
lexical_decisions:
- source_word: μηδὲν μεριμνᾶτε
  choice: Msihangaike kuhusu jambo lolote
  rationale: Muundo huu wa Kiswahili ni wa kawaida na unaonyesha wazi katazo la kuwa na wasiwasi kuhusu jambo lolote, bila kubadili maana kuwa kutokuwa na fikira au wajibu.
- source_word: ἐν παντὶ
  choice: katika kila jambo
  rationale: Huhifadhi upana wa usemi wa Kigiriki na ni wa asili katika Kiswahili cha sasa.
- source_word: τῇ προσευχῇ
  choice: sala
  rationale: Ni neno la kawaida na pana kwa tendo la kumwelekea Mungu katika maombi.
- source_word: τῇ δεήσει
  choice: dua
  rationale: Hutofautisha ombi la dhati na mahususi na neno pana zaidi 'sala', huku likibaki rahisi kueleweka katika Kiswahili sanifu.
- source_word: μετ’ εὐχαριστίας
  choice: pamoja na shukrani
  rationale: Huhifadhi maana ya kufanya sala na dua zikiambatana na kumshukuru Mungu.
- source_word: τὰ αἰτήματα ὑμῶν
  choice: maombi yenu
  rationale: Ni usemi wa asili wa Kiswahili kwa mambo yanayoombwa; muktadha unazuia yasichanganywe na 'sala' kwa ujumla.
- source_word: γνωριζέσθω
  choice: mjulishe
  rationale: Ingawa Kigiriki kina umbo la amri tendwa, amri tendi ni ya asili zaidi katika Kiswahili na hudumisha wito wa kuyafanya maombi yajulikane.
- source_word: πρὸς τὸν θεόν
  choice: Mungu
  rationale: Kwa kitenzi 'mjulishe', Mungu ndiye yule anayejulishwa; muundo huu unatoa kwa usahihi mwelekeo wa πρὸς bila Kiswahili kisicho cha asili.
theological_decisions:
- issue: Kumjulisha Mungu maombi licha ya ujuzi wake
  choice: mjulishe Mungu maombi yenu
  alternative: maombi yenu na yajulikane mbele za Mungu
  rationale: Tafsiri inadumisha lugha ya mstari bila kueleza jinsi amri hii inavyohusiana na ujuzi wa Mungu; hivyo haitatui kimyakimya mvutano wa kiteolojia uliopo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. 'Msihangaike' ni cha kawaida zaidi kuliko usemi mzito au wa kizamani; 'dua' hutumiwa kuhifadhi tofauti kati ya προσευχή na δέησις. Alama zote za tanbihi zimewekwa katika matini kuu.
