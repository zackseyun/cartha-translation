id: PHP.4.15
reference: Philippians 4:15
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Οἴδατε δὲ καὶ ὑμεῖς, Φιλιππήσιοι, ὅτι ἐν ἀρχῇ τοῦ εὐαγγελίου, ὅτε ἐξῆλθον ἀπὸ Μακεδονίας, οὐδεμία μοι ἐκκλησία ἐκοινώνησεν εἰς λόγον δόσεως καὶ λήμψεως εἰ μὴ ὑμεῖς μόνοι,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/015.yaml
  text: And you yourselves also know[a], Philippians, that at the beginning of the gospel, when I departed from Macedonia, no church shared with me in the matter of giving and receiving except you alone.
translation:
  language: sw
  text: Nanyi wenyewe mnajua, enyi Wafilipi, kwamba mwanzoni mwa Habari Njema, nilipoondoka Makedonia, hakuna kanisa lolote lililoshirikiana nami katika suala la kutoa na kupokea[a], isipokuwa ninyi peke yenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika hesabu ya kutoa na kupokea.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἴδατε
  choice: mnajua
  rationale: Kitenzi cha hali katika wakati wa sasa ndicho kinacholeta maana ya kawaida ya οἶδα kwa Kiswahili cha sasa.
- source_word: δὲ καὶ ὑμεῖς
  choice: Nanyi wenyewe
  rationale: Muundo huu unaendeleza hoja, huku ukihifadhi maana ya nyongeza ya καί na mkazo wa kiwakilishi ὑμεῖς.
- source_word: Φιλιππήσιοι
  choice: enyi Wafilipi
  rationale: Hutoa mwito wa moja kwa moja kwa watu wa Filipi kwa namna ya kawaida na yenye hadhi katika Kiswahili.
- source_word: ἐν ἀρχῇ τοῦ εὐαγγελίου
  choice: mwanzoni mwa kuhubiriwa kwa Habari Njema
  rationale: Katika muktadha huu kifungu kinaelekea kutaja hatua ya mwanzo ya kazi ya Habari Njema kati yao; kutaja 'kuhubiriwa' hufanya uhusiano huo uwe wazi kwa Kiswahili bila kuubana kuwa wakati wa kuandikwa kwa Injili.
- source_word: ὅτε ἐξῆλθον ἀπὸ Μακεδονίας
  choice: nilipoondoka Makedonia
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya tukio la Paulo kuondoka eneo hilo.
- source_word: οὐδεμία μοι ἐκκλησία ἐκοινώνησεν
  choice: hakuna kanisa lolote lililoshirikiana nami
  rationale: Kitenzi 'kushirikiana' huhifadhi wazo la ushiriki wa pamoja bila kukifanya kifungu kuwa cha kibiashara tu.
- source_word: εἰς λόγον δόσεως καὶ λήμψεως
  choice: katika suala la kutoa na kupokea
  rationale: Hutoa maana kuu ya ushirika wa mali kwa Kiswahili kinachoeleweka, huku maana inayowezekana ya kihasibu ikiwekwa katika tanbihi.
- source_word: εἰ μὴ ὑμεῖς μόνοι
  choice: isipokuwa ninyi peke yenu
  rationale: Inahifadhi mkazo wa kwamba Wafilipi ndio waliokuwa kanisa pekee lililoshiriki naye kwa namna hii.
