  text: Ἀσπάσασθε πάντα ἅγιον ἐν Χριστῷ Ἰησοῦ. ἀσπάζονται ὑμᾶς οἱ σὺν ἐμοὶ ἀδελφοί.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/021.yaml
  text: Greet every saint in Messiah Jesus[b][a]. The brothers with me greet you.
translation:
  language: sw
  text: Wasalimuni kila mtakatifu katika Masihi Yesu.[a] Ndugu walio pamoja nami wanawasalimu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika Kristo Yesu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάσασθε
  choice: Wasalimuni
  rationale: Kitenzi hiki cha amri katika hitimisho la barua kinamaanisha kuwafikishia wengine salamu; “wasalimuni” ni tafsiri fupi na ya kawaida katika Kiswahili.
- source_word: πάντα ἅγιον
  choice: kila mtakatifu
  rationale: Umoja unaoandamana na πᾶς una maana ya kugawa kwa kila mmoja; “kila mtakatifu” huhifadhi muundo na wazo la kila mwamini mmoja mmoja.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: katika Masihi Yesu
  rationale: Χριστός hapa ni cheo; “Masihi” huonyesha maana ya cheo hicho, naye ἐν ametafsiriwa moja kwa moja kuwa “katika.”
- source_word: ἀσπάζονται
  choice: wanawasalimu
  rationale: Katika salamu za mwisho za barua, umbo hili la Kigiriki linaelezwa kwa kawaida kwa kitenzi tendi; kiambishi “-wa-” kinaonyesha kwa uwazi kwamba wapokeaji ndio wanaosalimiwa.
- source_word: οἱ σὺν ἐμοὶ ἀδελφοί
  choice: Ndugu walio pamoja nami
  rationale: “Ndugu” ni neno la kawaida la Kiswahili linaloweza kumaanisha ndugu wa kiume au waamini wenza kwa ujumla, hivyo linahifadhi vizuri uwezekano wa kundi lenye wanaume na wanawake bila kuongeza maneno yasiyomo katika Kigiriki.
theological_decisions:
- issue: Utoaji wa cheo Χριστός
  choice: Masihi Yesu
  alternative: Kristo Yesu
  rationale: Kwa kuwa Χριστός inafanya kazi kama cheo, “Masihi” huwasilisha maana yake kwa uwazi badala ya kuitumia kama jina tu. Tafsiri ya kimapokeo “Kristo Yesu” imetajwa katika tanbihi bila kuamua tofauti ya kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na rahisi kueleweka. “Ndugu” limeachwa bila tanbihi ya kijinsia kwa sababu katika Kiswahili lenyewe linaweza kujumuisha waamini wenza wa jinsia zote kulingana na muktadha.
