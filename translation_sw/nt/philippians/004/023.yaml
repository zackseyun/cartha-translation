lexical_decisions:
- source_word: χάρις
  choice: neema
  rationale: Neno “neema” ni la kawaida na lenye heshima katika Kiswahili cha Biblia, na linahifadhi wazo la fadhili ya Mungu inayotolewa bila kustahiliwa.
- source_word: κυρίου
  choice: Bwana
  rationale: “Bwana” ni tafsiri ya kawaida ya cheo κύριος na inafaa hapa kama cheo cha Yesu.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesu Kristo
  rationale: Katika baraka hii ya Kipaulo, Χριστός imeungana kwa karibu na jina Yesu na inasikika kama sehemu ya jina-cheo lililozoeleka; “Yesu Kristo” ni ya asili na wazi zaidi kwa wasomaji wa Kiswahili kuliko “Yesu Masihi,” bila kuondoa maana yake ya Kimasihi.
- source_word: μετὰ
  choice: pamoja na
  rationale: Pamoja na nomino katika hali ya genitivi, μετά hapa huonyesha kuwapo au kuandamana; “pamoja na” huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: τοῦ πνεύματος ὑμῶν
  choice: roho yenu
  rationale: Kigiriki kina nomino ya umoja “roho” pamoja na kiwakilishi cha wingi “yenu.” “Roho yenu” kinahifadhi umoja huo wa pamoja badala ya kuugeuza moja kwa moja kuwa “roho zenu.”
theological_decisions:
- issue: Iwapo Χριστοῦ itafsiriwe “Masihi” au iandikwe “Kristo” katika mtungo “Bwana Yesu Kristo”
  choice: Kristo
  alternative: Masihi
  rationale: Ingawa Χριστός kimsingi ni cheo chenye maana ya “Masihi” au “Mtiwa-Mafuta,” katika mtungo huu wa baraka ya Kipaulo neno hilo limefungamana kwa karibu na jina Yesu. “Kristo” huhifadhi matumizi hayo yanayofanana na jina-cheo na ndiyo lugha ya kawaida, ya heshima, na inayoeleweka kwa upana katika Kiswahili.
- issue: Iwapo πνεύματος inamtaja Roho Mtakatifu au roho ya waamini
  choice: roho ya waamini, kwa maana ya pamoja
  alternative: Roho Mtakatifu
  rationale: Kiwakilishi ὑμῶν (“yenu”) kwa kawaida kinafanya “roho yenu” kuwa rejeo la maisha ya ndani ya waamini kwa pamoja. Herufi ndogo huepuka kuamua kwamba ni jina la moja kwa moja la Roho Mtakatifu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; sentensi ni fupi, ya heshima, na ya kawaida kwa baraka ya kufunga barua. Muundo “iwe pamoja na” unawakilisha ombi la baraka lililodokezwa katika Kigiriki, ambacho hakina kitenzi kilichoandikwa wazi.
