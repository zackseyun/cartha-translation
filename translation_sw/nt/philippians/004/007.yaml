reference: Philippians 4:7
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἡ εἰρήνη τοῦ θεοῦ ἡ ὑπερέχουσα πάντα νοῦν φρουρήσει τὰς καρδίας ὑμῶν καὶ τὰ νοήματα ὑμῶν ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/007.yaml
  text: And the peace of God[a], which surpasses all understanding, will guard your hearts and your minds in Messiah Jesus.
translation:
  language: sw
  text: Na amani ya Mungu, inayopita ufahamu wote, italinda mioyo yenu na mawazo yenu katika Masihi Yesu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika Kristo Yesu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰρήνη
  choice: amani
  rationale: “Amani” ndiyo kisawe cha kawaida na cha asili, na hapa inaweza kujumuisha utulivu wa ndani pamoja na hali njema inayotokana na Mungu.
- source_word: τοῦ θεοῦ
  choice: ya Mungu
  rationale: Muundo huu unahifadhi uhusiano wa kirai cha Kigiriki bila kuufafanua kwa lazima kuwa “kutoka kwa Mungu,” ingawa wazo la chanzo linaweza kuwamo.
- source_word: ἡ ὑπερέχουσα πάντα νοῦν
  choice: inayopita ufahamu wote
  rationale: Kauli hii ya Kiswahili inaeleza kwamba amani ya Mungu inapita uwezo wote wa kuelewa, bila kupanua maana kupita kiasi.
- source_word: φρουρήσει
  choice: italinda
  rationale: “Italinda” huhifadhi maana ya ulinzi thabiti iliyomo katika kitenzi, ambacho kinaweza kuwa na taswira ya ulinzi wa kijeshi.
- source_word: τὰς καρδίας ὑμῶν
  choice: mioyo yenu
  rationale: “Mioyo” huhifadhi taswira ya kibiblia ya maisha ya ndani, hisia, nia, na utu wa ndani.
- source_word: τὰ νοήματα ὑμῶν
  choice: mawazo yenu
  rationale: “Mawazo” hutaja shughuli na yaliyomo akilini, na pia hutofautisha νοήματα na νοῦν iliyotafsiriwa “ufahamu.”
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: katika Masihi Yesu
  rationale: “Katika” huhifadhi wazo la kuwa ndani ya nyanja ya uhusiano na Yesu, huku “Masihi” ikitafsiri cheo Χριστός badala ya kukinakili tu.
theological_decisions:
- issue: Namna ya kutafsiri Χριστῷ katika kauli ya Paulo ἐν Χριστῷ Ἰησοῦ
  choice: katika Masihi Yesu
  alternative: katika Kristo Yesu
  rationale: “Masihi” huonyesha wazi maana ya cheo cha Yesu na kudumisha nguvu yake ya kimasiya; “Kristo” ni umbo la kimapokeo na la kawaida zaidi katika Kiswahili, hivyo limetolewa kama mbadala katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; mtindo ni wa sasa, wenye heshima na unaosomeka kwa urahisi. Muundo wa sentensi unafuata hoja ya Kigiriki huku ukitumia “mawazo” kwa νοήματα ili kuepuka kurudia “ufahamu” wa νοῦς.
