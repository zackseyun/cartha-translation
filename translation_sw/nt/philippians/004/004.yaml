  text: Rejoice in the Lord always[a]; again I will say[b], rejoice.
translation:
  language: sw
  text: Furahini katika Bwana sikuzote[a]; tena nitasema[b], furahini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Shangilieni katika Bwana sikuzote.”
    reason: lexical_alternative
  - marker: b
    text: Kwa neno kwa neno, “tena nitasema, furahini.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Χαίρετε
  choice: Furahini
  rationale: Ni amri ya wakati wa sasa kwa wingi. “Furahini” ni Kiswahili cha kawaida na chenye heshima kinachohifadhi nguvu ya himizo na maana ya χαίρω.
- source_word: ἐν
  choice: katika
  rationale: “Katika” huhifadhi wazo la eneo la kiuhusiano au umoja bila kulifanya liwe tu sababu (“kwa sababu ya”) au chombo.
- source_word: κυρίῳ
  choice: Bwana
  rationale: Katika matumizi ya Paulo hapa neno hilo linamhusu Kristo. “Bwana” ndilo neno la kawaida la kibiblia na haliongezi tafsiri ya kimadhehebu.
- source_word: πάντοτε
  choice: sikuzote
  rationale: “Sikuzote” ni sawa ya asili katika Kiswahili sanifu na huwasilisha nguvu endelevu ya kielezi hiki.
- source_word: πάλιν
  choice: tena
  rationale: “Tena” huonyesha kwa ufupi kurudiwa kwa himizo kwa kusisitiza.
- source_word: ἐρῶ
  choice: Nitasema
  rationale: Huhifadhi wakati ujao wa ἐρῶ badala ya kuugeuza kuwa wakati wa sasa.
- source_word: χαίρετε
  choice: furahini
  rationale: Kurudia tafsiri ileile kunahifadhi msisitizo wa balagha wa Paulo.
theological_decisions:
- issue: Maana ya “katika Bwana”
  choice: 'Imeachwa kama uhusiano au eneo la maisha: “katika Bwana.”'
  alternative: “kwa sababu ya Bwana” au “kwa uwezo wa Bwana”
  rationale: Kirai ἐν κυρίῳ kinaweza kubeba upana wa kuwa katika uhusiano au umoja na Bwana. “Katika Bwana” huhifadhi upana huo bila kuamua kimya kimya kuwa ni sababu au njia pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Furahini” ni wazi kwa wasomaji wa kawaida; “katika Bwana” huhifadhi uzito na upana wa kirai cha Kigiriki. Alama zote za tanbihi zimewekwa katika matini kuu.
