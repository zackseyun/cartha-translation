id: PHP.4.1
reference: Philippians 4:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὥστε, ἀδελφοί μου ἀγαπητοὶ καὶ ἐπιπόθητοι, χαρὰ καὶ στέφανός μου, οὕτως στήκετε ἐν κυρίῳ, ἀγαπητοί.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/001.yaml
  text: So then[a], my beloved and longed-for brothers, my joy and crown, stand firm in the Lord in this way[b], beloved.
translation:
  language: sw
  text: Kwa hiyo, ndugu zangu wapendwa ambao ninawatamani sana, furaha yangu na taji yangu, simameni imara katika Bwana kwa namna hii, wapendwa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὥστε
  choice: Kwa hiyo
  rationale: Inaonyesha hitimisho linalotokana na hoja iliyotangulia kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: ἀδελφοί
  choice: ndugu zangu
  rationale: “Ndugu” ni neno la kawaida la Kiswahili kwa waamini wenzake na, katika muktadha huu, linaweza kulihusu kusanyiko lote bila kuifanya jinsia kuwa wazi kuliko ilivyo katika matumizi ya Paulo.
- source_word: ἀγαπητοὶ
  choice: wapendwa
  rationale: Linaendeleza hisia ya upendo ya Paulo; kurudiwa kwake mwishoni mwa mstari kumehifadhiwa.
- source_word: ἐπιπόθητοι
  choice: ambao ninawatamani sana
  rationale: Linaonyesha hamu kubwa ya Paulo ya kuwa pamoja nao kwa usemi unaoeleweka katika Kiswahili cha sasa.
- source_word: χαρὰ
  choice: furaha yangu
  rationale: Tafsiri ya moja kwa moja inayohifadhi kauli kwamba Wafilipi wenyewe ni furaha ya Paulo.
- source_word: στέφανός
  choice: taji yangu
  rationale: “Taji” ni tafsiri fupi na ya kawaida; tanbihi inaeleza kuwa hapa neno la Kigiriki linaweza kurejelea shada la ushindi.
- source_word: οὕτως
  choice: kwa namna hii
  rationale: Inahifadhi wazi maana ya namna ya kusimama imara na kwa kawaida inaelekeza kwenye mafundisho na mfano uliotangulia.
- source_word: στήκετε
  choice: simameni imara
  rationale: Inawasilisha agizo la kudumu thabiti bila kutumia lugha ya kizamani.
- source_word: ἐν κυρίῳ
  choice: katika Bwana
  rationale: Inahifadhi usemi wa Paulo wenye maana ya mahali au uhusiano bila kuufafanua kupita kiasi.
theological_decisions:
- issue: Wigo wa ἀδελφοί
  choice: “Ndugu zangu” limetumiwa katika matini kuu, huku tanbihi ikieleza umbo la kiume la Kigiriki na wigo wake wa kusanyiko lote.
  alternative: “ndugu zangu wa kiume na wa kike”
  rationale: Kiswahili “ndugu” kwa asili halibainishi jinsia katika matumizi haya. Tanbihi inalinda taarifa ya kisarufi ya Kigiriki bila kupotosha wigo wa salamu kwa kanisa lote.
- issue: Taswira ya στέφανος
  choice: “taji” katika matini kuu, pamoja na tanbihi kuhusu shada la mshindi
  alternative: “shada la ushindi”
  rationale: “Taji” ni ya asili na fasaha katika Kiswahili, lakini tanbihi inalinda tofauti kati ya στέφανος ya ushindi na taji ya kifalme.
- issue: Uhusiano wa οὕτως na muktadha
  choice: “kwa namna hii” limehifadhiwa bila kutaja kwa ufafanuzi jambo moja maalumu linalorejelewa
  alternative: “kama nilivyowaeleza”
  rationale: Kielezi kinaelekeza kwa jumla kwenye namna iliyoonyeshwa katika muktadha uliotangulia; kukifafanua zaidi kungeondoa kiwango fulani cha uwazi kilicho katika Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Sentensi imegawanywa baada ya “taji yangu” ili kupunguza msongamano wa virai vya mwito huku uhusiano wa hoja ukihifadhiwa kwa “Basi.”
