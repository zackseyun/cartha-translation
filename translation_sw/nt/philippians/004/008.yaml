  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Τὸ λοιπόν, ἀδελφοί, ὅσα ἐστὶν ἀληθῆ, ὅσα σεμνά, ὅσα δίκαια, ὅσα ἁγνά, ὅσα προσφιλῆ, ὅσα εὔφημα, εἴ τις ἀρετὴ καὶ εἴ τις ἔπαινος, ταῦτα λογίζεσθε·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/008.yaml
  text: Finally[a], brothers, whatever is true, whatever is honorable, whatever is just, whatever is pure, whatever is lovely, whatever is commendable—if there is any virtue and if there is any praise—think about these things.
translation:
  language: sw
  text: Hatimaye, ndugu[a], mambo yoyote yaliyo ya kweli, yenye heshima, ya haki, safi, yapendezayo, yenye sifa njema—ikiwa kuna wema wowote na ikiwa kuna sifa yoyote—yatafakarini mambo hayo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki lililotafsiriwa “ndugu” lina umbo la kiume, lakini hapa linaweza kuihusu jumuiya yote ya waamini, wanaume na wanawake.
    reason: cultural_note
lexical_decisions:
- source_word: Τὸ λοιπόν
  choice: Hatimaye
  rationale: Ni kiashiria cha mpito kinachoanzisha himizo la kumalizia; “Hatimaye” ni cha kawaida na huhifadhi nguvu hiyo ya mpito.
- source_word: ἀδελφοί
  choice: ndugu
  rationale: “Ndugu” ni neno la kawaida la Kiswahili linaloweza kutumiwa kwa jumuiya nzima bila kulazimisha jinsia ambayo nomino ya Kigiriki yenye umbo la kiume inaweza kuwakilisha katika mwito wa Paulo.
- source_word: ὅσα
  choice: mambo yoyote / yoyote
  rationale: Urejeshaji wa “yoyote” huhifadhi mtindo wa orodha ya Kigiriki, huku “mambo” likitajwa mwanzoni ili sentensi iwe wazi na ya asili kwa Kiswahili.
- source_word: ἀληθῆ
  choice: yaliyo ya kweli
  rationale: Huwasilisha maana pana ya yaliyo kweli, ya kuaminika, au halisi katika orodha hii ya kimaadili.
- source_word: σεμνά
  choice: yenye kuheshimika
  rationale: Hueleza mambo yenye uzito wa kimaadili na yanayostahili heshima bila kutumia lugha nzito isiyo ya kawaida.
- source_word: δίκαια
  choice: yaliyo ya haki
  rationale: Katika muktadha huu wa kimaadili, “ya haki” hujumuisha yaliyo sawa, ya adili, na yasiyopendelea.
- source_word: ἁγνά
  choice: yaliyo safi
  rationale: Huhifadhi maana za usafi wa kimaadili na wa ndani bila kuibana kwa usafi wa kingono pekee.
- source_word: προσφιλῆ
  choice: ya kupendeza
  rationale: Hueleza yale yanayoamsha upendo au kupendwa na ni usemi wa sasa unaoeleweka kwa urahisi.
- source_word: εὔφημα
  choice: yenye sifa njema
  rationale: Huhifadhi wazo la mambo yanayosemwa vizuri au yenye sifa nzuri, badala ya kuyafanya tu kuwa mazuri kwa mtazamo wa mtu binafsi.
- source_word: εἴ τις ἀρετὴ
  choice: ikiwa kuna ubora wowote wa kimaadili
  rationale: ἀρετή ni ubora au wema wa kimaadili; ufafanuzi huu mfupi huepuka utata wa “ubora” peke yake huku ukihifadhi nguvu ya muhtasari.
- source_word: εἴ τις ἔπαινος
  choice: ikiwa kuna jambo lolote linalostahili sifa
  rationale: Hutoa kwa Kiswahili cha asili wazo la kuwepo kwa kitu chenye kustahili kusifiwa, bila kurudia kwa namna isiyoeleweka “ikiwa kuna sifa yoyote.”
- source_word: ταῦτα λογίζεσθε
  choice: yatafakarini mambo hayo
  rationale: Kitenzi kinataka kuzingatia kwa makusudi na kwa kuendelea; “yatafakarini” ni himizo fupi, la heshima, na la kawaida.
theological_decisions:
- issue: Wanaolengwa na mwito ἀδελφοί
  choice: “ndugu” katika matini, pamoja na tanbihi kwamba mwito unahusu jumuiya yote ya waamini
  alternative: “ndugu wa kiume” au “ndugu wa kiume na wa kike”
  rationale: Umbo la Kigiriki ni la kiume kwa sarufi lakini katika mwito huu linaweza kuiwakilisha jumuiya nzima. Kiswahili “ndugu” huhifadhi mwito wa kifamilia bila kuwatenga wanawake wala kuongeza maneno ndani ya matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa heshima lakini wa sasa na unaoeleweka kwa msomaji wa kawaida. Marudio ya “yoyote” yamehifadhiwa kwa sababu ndiyo yanayoupa mstari mdundo na mkazo wa orodha ya asili.
