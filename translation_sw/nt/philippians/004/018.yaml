  terminology: Epafrodito, dhabihu, na Mungu zimetumiwa kwa usahihi. Taswira ya ὀσμὴν εὐωδίας, θυσίαν δεκτήν, εὐάρεστον τῷ θεῷ imehifadhiwa bila kuiondoa katika lugha ya ibada.
