  text: ἀπέχω δὲ πάντα καὶ περισσεύω· πεπλήρωμαι δεξάμενος παρὰ Ἐπαφροδίτου τὰ παρ’ ὑμῶν, ὀσμὴν εὐωδίας, θυσίαν δεκτήν, εὐάρεστον τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/018.yaml
  text: But I have received everything[a], and I abound. I am fully supplied, having received from Epaphroditus what came from you—a fragrant aroma, an acceptable sacrifice, pleasing to God.
translation:
  language: sw
  text: Lakini nimepokea kila kitu[a], nami nina tele. Nimetoshelezwa, kwa kuwa nimepokea kutoka kwa Epafrodito vitu vilivyotoka kwenu—harufu ya kupendeza, dhabihu inayokubalika, inayompendeza Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au yamkini, “nina kila kitu kikamilifu” au “nimepokea malipo kamili.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέχω
  choice: nimepokea
  rationale: Katika muktadha wa msaada wa mali, kitenzi kinaweza kumaanisha kuwa kitu kimepokelewa kikamilifu au malipo yamepokelewa yote. “Nimepokea” ni Kiswahili cha kawaida na hakilazimishi maana ya kibiashara katika matini kuu.
- source_word: πάντα
  choice: kila kitu
  rationale: Huhifadhi upeo mpana wa usemi wa Kigiriki na kwa kawaida hapa hurejelea yote waliyomtumia Paulo.
- source_word: περισσεύω
  choice: nina zaidi ya kutosha
  rationale: Hueleza wingi unaopita kiasi cha kutosheleza kwa Kiswahili cha sasa na huendeleza mkazo wa Paulo kuhusu kuwa na tele.
- source_word: πεπλήρωμαι
  choice: nimejazwa tele
  rationale: Huhifadhi picha ya kujazwa pamoja na hali ya sasa iliyotokana na zawadi yao, bila kuifanya sentensi kuwa ya kifedha tu.
- source_word: δεξάμενος
  choice: baada ya kupokea
  rationale: Huonyesha kwamba hali ya Paulo ya kuwa na tele imetokana na kupokea zawadi hiyo.
- source_word: παρὰ Ἐπαφροδίτου
  choice: kutoka kwa Epafrodito
  rationale: Humtaja Epafrodito kuwa mtu ambaye Paulo alipokea vitu hivyo moja kwa moja, huku kishazi kinachofuata kikionyesha kwamba vilitoka kwa Wafilipi.
- source_word: τὰ παρ’ ὑμῶν
  choice: vitu vilivyotoka kwenu
  rationale: Ni usemi wa kawaida unaohifadhi tofauti kati ya Epafrodito kama mleta zawadi na Wafilipi kama waliyoitoa.
- source_word: ὀσμὴν εὐωδίας
  choice: harufu nzuri
  rationale: Huhifadhi picha ya harufu ya kupendeza inayohusishwa na dhabihu katika Maandiko, kwa lugha inayoeleweka na yenye hadhi.
- source_word: θυσίαν δεκτήν
  choice: dhabihu inayokubalika
  rationale: Hudumisha wazi sitiari ya ibada na tathmini chanya ya dhabihu hiyo.
- source_word: εὐάρεστον τῷ θεῷ
  choice: na kumpendeza Mungu
  rationale: Husema kwa uwazi kwamba zawadi hiyo inampendeza Mungu, huku kivumishi kikiunganishwa kiasili na “dhabihu” katika Kiswahili.
theological_decisions:
- issue: Picha ya dhabihu kwa zawadi ya Wafilipi
  choice: Kuhifadhi mfuatano wa “harufu nzuri, dhabihu inayokubalika na kumpendeza Mungu” kama sitiari halisi ya ibada.
  alternative: Kufupisha kuwa maelezo ya jumla kwamba zawadi hiyo ilikubaliwa na Mungu.
  rationale: Paulo kwa makusudi anaieleza zawadi kwa lugha ya dhabihu. Kuhifadhi harufu, dhabihu, kukubalika, na kumpendeza Mungu kunatunza nguvu ya kiteolojia bila kuongeza fundisho lisilo katika matini.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Tafsiri imetumia ulinganifu mwafaka: ni ya asili kwa msomaji wa kawaida huku ikihifadhi msisitizo wa wingi, hali ya kujazwa, na picha ya dhabihu.'
