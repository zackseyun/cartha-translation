id: PHP.4.10
reference: Philippians 4:10
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἐχάρην δὲ ἐν κυρίῳ μεγάλως ὅτι ἤδη ποτὲ ἀνεθάλετε τὸ ὑπὲρ ἐμοῦ φρονεῖν, ἐφ’ ᾧ καὶ ἐφρονεῖτε ἠκαιρεῖσθε δέ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/010.yaml
  text: I rejoiced greatly in the Lord that now at last you have revived your concern for me[a]; indeed, you were concerned[b], but you lacked opportunity.
translation:
  language: sw
  text: Nilifurahi sana katika Bwana, kwa kuwa sasa hatimaye mmeihuisha tena hali yenu ya kunijali[a]. Kwa kweli, mlikuwa mnanijali[b], lakini hamkupata nafasi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana ya karibu na neno halisi, “mmechanua tena” katika kunijali; kitenzi cha Kigiriki kina taswira ya mmea kuchanua au kuchipuka tena.
    reason: lexical_alternative
  - marker: b
    text: Au, “mlikuwa mkiniwazia.” Kitenzi cha Kigiriki kinaweza kumaanisha kumfikiria mtu, kuwa na mwelekeo wa mawazo kumwelekea, au kumjali.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐχάρην
  choice: Nilifurahi
  rationale: Kitenzi hiki katika wakati uliopita kinaeleza furaha ya Paulo moja kwa moja; “Nilifurahi” ni Kiswahili cha kawaida na chenye heshima.
- source_word: ἐν κυρίῳ
  choice: katika Bwana
  rationale: Huhifadhi usemi wa Paulo unaoweza kuonyesha mazingira au msingi wa furaha yake.
- source_word: μεγάλως
  choice: sana
  rationale: Huwasilisha kiwango kikubwa cha furaha kwa Kiswahili cha asili.
- source_word: ἤδη ποτὲ
  choice: sasa hatimaye
  rationale: Huonyesha kwamba jambo hilo limejitokeza tena baada ya kipindi fulani, bila lazima ya kuwalaumu Wafilipi.
- source_word: ἀνεθάλετε
  choice: mmechipusha tena
  rationale: Huhifadhi kwa kiasi kikubwa taswira ya mimea kuchanua au kuchipuka tena, huku ikibaki wazi katika muktadha.
- source_word: τὸ ὑπὲρ ἐμοῦ φρονεῖν
  choice: kujali kwenu juu yangu
  rationale: φρονέω hapa ni zaidi ya kuwaza tu; inaelekea katika kuwa na nia na kujali hali ya Paulo.
- source_word: ἐφ’ ᾧ
  choice: Kwa kweli
  rationale: Huleta ufafanuzi wa Paulo kwamba kujali kwao hakukuwa kumekoma, ingawa fungu la Kigiriki linaweza kueleweka kwa uhusiano wa karibu zaidi na jambo lililotangulia.
- source_word: ἐφρονεῖτε
  choice: mlikuwa mnanijali
  rationale: Hudumisha uhusiano wa kileksika na φρονεῖν na kuthibitisha kwamba nia yao njema iliendelea.
- source_word: ἠκαιρεῖσθε
  choice: hamkupata nafasi
  rationale: Huonyesha ukosefu wa fursa inayofaa, si ukosefu wa nia au kujali.
theological_decisions:
- issue: Maana ya “katika Bwana”
  choice: katika Bwana
  alternative: kwa sababu ya Bwana
  rationale: Tafsiri haifungi usemi huo kwa sababu pekee; huhifadhi uwezekano wa kuonyesha mazingira, uhusiano, au msingi wa furaha ya Paulo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Mmechipusha tena” hudumisha taswira ya asili bila kufanya mstari usieleweke; tanbihi inaeleza mbadala wa karibu zaidi wa “mmechanua tena.”
