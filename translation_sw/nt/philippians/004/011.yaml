  text: Not that I am speaking from need[a], for I have learned to be content in whatever circumstances I am in.
translation:
  language: sw
  text: Sisemi haya kwa sababu ya uhitaji, kwa maana nimejifunza kutosheka katika hali yoyote niliyomo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kuwa na uwezo wa kujitosheleza”; kivumishi cha Kigiriki kinaweza kumaanisha kujitosheleza, ingawa hapa kimetafsiriwa kwa kuzingatia muktadha kuwa “kutosheka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καθ’ ὑστέρησιν
  choice: kwa sababu nina uhitaji
  rationale: Kirai hiki huonyesha kusema kwa sababu ya upungufu au uhitaji. Tafsiri hii ni ya kawaida katika Kiswahili na inaweka wazi kwamba Paulo hasemi akichochewa na mahitaji yake binafsi.
- source_word: λέγω
  choice: Sisemi hivyo
  rationale: Wakati wa sasa umehifadhiwa, na neno “hivyo” linaunganisha kauli hii kwa kawaida na yaliyotangulia bila kuongeza maana mpya.
- source_word: ἔμαθον
  choice: nimejifunza
  rationale: Kauli hii inaonyesha jambo alilojifunza ambalo matokeo yake yanaendelea kuwapo; hali timilifu ya Kiswahili huiwasilisha kwa kawaida.
- source_word: ἐν οἷς εἰμι
  choice: katika hali yoyote niliyo nayo
  rationale: Kirai hiki kinahusu mazingira au hali mbalimbali, si mahali tu. Kiswahili hiki ni cha kawaida na kinahifadhi upana wa usemi wa Kigiriki.
- source_word: αὐτάρκης
  choice: kuridhika
  rationale: Katika muktadha huu neno linaonyesha kuwa na utoshelevu au kutosheka katika hali mbalimbali. “Kuridhika” ni la kawaida na halisisitizi kimakosa kujitegemea kabisa.
theological_decisions:
- issue: Dokezo la kifalsafa katika αὐτάρκης
  choice: “kuridhika” limetumiwa katika maandishi makuu.
  alternative: “kujitosheleza”
  rationale: Paulo anaeleza hali aliyojifunza katika mazingira yanayobadilika. “Kuridhika” linafaa katika muktadha na halidokezi kwamba hatakiwi na msaada wa Mungu au wengine; maana mbadala ya kileksika imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo umewekwa wazi na wa asili huku ukihifadhi uhusiano wa sababu na mvutano wa maana katika αὐτάρκης.
