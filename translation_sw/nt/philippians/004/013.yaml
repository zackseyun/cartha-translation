lexical_decisions:
- source_word: πάντα
  choice: mambo yote
  rationale: Huhifadhi upana wa usemi wa Kigiriki, huku tanbihi ikieleza kwamba katika muktadha Paulo anazungumzia hali mbalimbali za maisha.
- source_word: ἰσχύω
  choice: ninaweza kufanya
  rationale: Kitenzi kinaonyesha kuwa na uwezo au nguvu. Tafsiri hii ni ya kawaida katika Kiswahili na inaeleza uwezo unaotolewa bila kutumia usemi mzito usio wa lazima.
- source_word: ἐν
  choice: kwa njia ya
  rationale: Ingawa maana yake ya msingi ni ‘katika,’ hapa pamoja na kirai kinachomtaja mtu kinaweza kuonyesha njia au wakala; ‘kwa njia ya’ ni wazi na ya asili katika Kiswahili.
- source_word: τῷ ἐνδυναμοῦντί με
  choice: yule anayenitia nguvu
  rationale: Huhifadhi muundo wa kishirikishi chenye kibainishi na hali endelevu ya tendo, bila kuongeza jina la Kristo ambalo halitajwi wazi katika mstari huu.
theological_decisions:
- issue: Anayerejelewa na ‘yule anayenitia nguvu’
  choice: Kubaki na usemi ‘yule anayenitia nguvu’ bila kuongeza ‘Kristo’ katika matini kuu.
  alternative: kwa njia ya Kristo anayenitia nguvu
  rationale: Muktadha unaelekeza kwa Kristo Yesu, lakini maandishi ya Kigiriki ya mstari huu hayamtaji kwa jina. Tafsiri inadumisha kile kilicho wazi na tanbihi inaeleza rejeo linalowezekana.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Usemi ‘mambo yote’ huhifadhi upana wa Kigiriki, na tanbihi huzuia usomwe bila kuzingatia muktadha wa kuridhika katika hali mbalimbali.
