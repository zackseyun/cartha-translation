  text: Ninaweza kufanya mambo yote kupitia yule anayenitia nguvu[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ninaweza katika mambo yote.” Katika muktadha, maana yake ni kuwa na uwezo katika kila hali.
    reason: lexical_alternative
  - marker: b
    text: Kigiriki kinasema “yule anayenitia nguvu” bila kumtaja Kristo waziwazi katika mstari huu, ingawa muktadha unaelekeza kwake.
