  yaml_path: translation/nt/philippians/004/017.yaml
  text: Not that I seek the gift[a], but I seek the fruit that increases to your account.
translation:
  language: sw
  text: Si kwamba ninaitafuta ile zawadi, bali ninatafuta matunda yanayozidi kuongezeka katika akaunti yenu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “matunda yanayozidi kuwa mengi katika akaunti yenu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιζητῶ
  choice: ninaitafuta / ninatafuta
  rationale: Kitenzi hiki huonyesha kutafuta au kutamani kwa bidii. Kurudia ‘tafuta’ kunadumisha ulinganifu wa kauli ya Kigiriki, huku upatanisho wa kisarufi ukifuata nomino husika.
- source_word: δόμα
  choice: ile zawadi
  rationale: ‘Zawadi’ ni tafsiri ya moja kwa moja na ya kawaida kwa kitu ambacho Wafilipi walimpa Paulo. ‘Ile’ huirejelea zawadi inayojulikana katika muktadha bila kuongeza wazo la ‘yenyewe’ lisilo wazi katika Kigiriki.
- source_word: καρπὸν
  choice: matunda
  rationale: ‘Matunda’ yanahifadhi sitiari ya matokeo au mavuno na hayafuti mvutano wake na lugha ya kihasibu inayofuata.
- source_word: πλεονάζοντα
  choice: yanayoongezeka
  rationale: Hii huonyesha matunda yanayozidi au kukua, na inadumisha hali inayoendelea ya kirai cha Kigiriki kwa Kiswahili cha kawaida.
- source_word: εἰς λόγον ὑμῶν
  choice: kwa hesabu yenu
  rationale: Katika muktadha wa shughuli za kutoa na kupokea, λόγος inaweza kumaanisha hesabu ya kibiashara. ‘Kwa hesabu yenu’ huhifadhi lugha hiyo bila kuibadili kuwa manufaa ya jumla tu.
- source_word: οὐχ ὅτι ... ἀλλὰ
  choice: Si kwamba ... bali
  rationale: Muundo huu wa kawaida wa Kiswahili unadumisha ufafanuzi na ulinganisho wa Paulo.
theological_decisions:
- issue: Uhusiano wa ‘matunda’ na ‘hesabu’
  choice: 'Kuhifadhi sitiari zote mbili: ‘matunda yanayoongezeka kwa hesabu yenu’'
  alternative: ‘Faida inayoongezeka kwa ajili yenu’
  rationale: Kigiriki huunganisha sitiari ya matunda na lugha ya kihasibu. Tafsiri haipaswi kuamua kimya kimya kama Paulo anamaanisha thawabu, ukuaji wa kiroho, au manufaa mengine mahususi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa kawaida kwa wasomaji wengi, huku sitiari ya matunda na lugha ya hesabu zikihifadhiwa. Alama ya tanbihi [a] imewekwa katika matini.
