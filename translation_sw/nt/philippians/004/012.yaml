  text: οἶδα καὶ ταπεινοῦσθαι, οἶδα καὶ περισσεύειν· ἐν παντὶ καὶ ἐν πᾶσιν μεμύημαι, καὶ χορτάζεσθαι καὶ πεινᾶν, καὶ περισσεύειν καὶ ὑστερεῖσθαι·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/012.yaml
  text: 'I know how to be brought low, and I know how to abound. In every circumstance and in all things I have learned the secret: both to be well fed and to be hungry, both to abound and to be in need.'
translation:
  language: sw
  text: Najua jinsi ya kuishi katika hali ya chini, na najua jinsi ya kuwa na vingi. Katika kila hali na katika mambo yote nimejifunza siri[a]—kushiba na kuwa na njaa, kuwa na vingi na kupungukiwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya karibu zaidi, “nimeanzishwa katika siri.” Paulo anatumia kwa njia ya mfano lugha ya kuanzishwa katika siri ili kueleza kujifunza siri.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἶδα
  choice: najua jinsi ya
  rationale: Pamoja na vitenzi-jina vinavyofuata, usemi huu unaonyesha ujuzi wa vitendo uliopatikana kwa uzoefu, si ufahamu wa kinadharia tu.
- source_word: ταπεινοῦσθαι
  choice: kuishi katika hali ya chini
  rationale: Huhifadhi wazo la kuwa katika mazingira ya chini au yenye upungufu bila kulifanya kuwa unyenyekevu wa tabia tu; ‘kuishi’ hufanya usemi huo uwe wa kawaida katika Kiswahili.
- source_word: περισσεύειν
  choice: kuwa na vingi
  rationale: Huonyesha kuwa na zaidi ya mahitaji na kuhifadhi ulinganifu wa hali tofauti bila kuifanya maana kuwa utajiri wa fedha pekee.
- source_word: ἐν παντὶ καὶ ἐν πᾶσιν
  choice: katika kila hali na katika mambo yote
  rationale: Huhifadhi msisitizo wa misemo miwili ya Kigiriki na kuwasilisha upana wa uzoefu unaozungumziwa.
- source_word: μεμύημαι
  choice: nimejifunza siri
  rationale: Huwasilisha kwa Kiswahili cha sasa sitiari ya kujulishwa siri kutokana na uzoefu; picha ya kuingizwa katika siri imeelezwa katika tanbihi.
- source_word: χορτάζεσθαι
  choice: kushiba
  rationale: Ni kinyume cha moja kwa moja na cha kawaida cha ‘kuona njaa’ na huhifadhi maana inayohusiana na chakula.
- source_word: πεινᾶν
  choice: kuona njaa
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha hali ya kuwa na njaa.
- source_word: ὑστερεῖσθαι
  choice: kupungukiwa
  rationale: Huonyesha kukosa mahitaji kwa upana, bila kuifunga maana kwenye fedha pekee.
