  text: Εὐοδίαν παρακαλῶ καὶ Συντύχην παρακαλῶ τὸ αὐτὸ φρονεῖν ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/002.yaml
  text: I urge Euodia[a], and I urge Syntyche, to think the same way in the Lord.
translation:
  language: sw
  text: Namsihi Euodia, na namsihi Sintike, wawe na nia moja katika Bwana.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wafikiri kwa njia moja katika Bwana”; pia yaweza kuwa, “wakubaliane katika Bwana.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐοδίαν
  choice: Euodia
  rationale: Jina la mtu limetoholewa kwa tahajia inayokaribia Kigiriki na iliyo wazi kwa msomaji wa Kiswahili, badala ya kutafsiri maana ya jina.
- source_word: παρακαλῶ
  choice: namsihi
  rationale: ‘Namsihi’ linaonyesha ombi la dhati na lenye uzito bila ukali wa amri. Kurudiwa kwa kitenzi kumehifadhiwa kwa kuwa Paulo anamsihi kila mwanamke mmoja mmoja.
- source_word: Συντύχην
  choice: Sintike
  rationale: Jina la mtu limetoholewa kwa namna ya kawaida katika Kiswahili, kwa kufuata matamshi ya Kigiriki badala ya kutafsiri maana yake.
- source_word: τὸ αὐτὸ φρονεῖν
  choice: wawe na nia moja
  rationale: Kauli hii ya Kiswahili inahifadhi wazo la kuwa na mtazamo au mwelekeo mmoja, si kukubaliana tu kuhusu hoja fulani. Pia inaendana na matumizi mapana ya φρονέω katika Wafilipi.
- source_word: ἐν κυρίῳ
  choice: katika Bwana
  rationale: Tafsiri ya karibu imehifadhi msingi na mazingira ya umoja wao katika uhusiano wao na Bwana, bila kuufanya kuwa upatanisho wa kibinadamu tu.
theological_decisions:
- issue: Aina ya umoja unaotakiwa
  choice: wawe na nia moja katika Bwana
  alternative: wakubaliane katika Bwana
  rationale: ‘Wakubaliane’ lingeweza kufanya maana iwe nyembamba kana kwamba ni makubaliano juu ya jambo moja tu. ‘Wawe na nia moja’ huhifadhi upana wa kiakili na kimwelekeo wa φρονεῖν pamoja na mvutano wa kifungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kurudia ‘namsihi’ umehifadhiwa ili kuonyesha kuwa wito unaelekezwa kwa kila mmoja kwa usawa.
