base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/009.yaml
  text: What you also learned and received and heard and saw in me—practice these things[b][a], and the God of peace will be with you.
translation:
  language: sw
  text: Mambo ambayo pia mliyojifunza na kuyapokea, na kuyasikia na kuyaona kwangu[b], yatendeni[a]; naye Mungu wa amani atakuwa pamoja nanyi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “fanyeni mambo hayo.”
    reason: lexical_alternative
  - marker: b
    text: “Kuyaona kwangu” pia kunaweza kusemwa “kuyaona katika mfano wangu” au “kuyaona katika maisha yangu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἃ
  choice: Mambo
  rationale: Kiwakilishi cha uhusiano cha wingi wa kati kinarejelea mambo yote yanayofuatia; “mambo” ni ya kawaida na hudumisha wingi huo katika Kiswahili.
- source_word: ἐμάθετε
  choice: mliyojifunza
  rationale: Huonyesha yale Wafilipi waliojifunza; umbo hili la wakati uliopita ni la asili na linaingia vizuri katika mfululizo wa vitenzi.
- source_word: παρελάβετε
  choice: mkayapokea
  rationale: “Kupokea” hudumisha upana wa maana, iwe ni kupokea mafundisho au mapokeo, bila kuongeza ufafanuzi usiotajwa wazi.
- source_word: ἠκούσατε
  choice: mkayasikia
  rationale: Hutoa maana ya moja kwa moja ya kusikia huku kiambishi “-ya-” kikirejelea mambo hayo na kudumisha ulinganifu wa mfululizo.
- source_word: εἴδετε ἐν ἐμοί
  choice: kuyaona kwangu
  rationale: “Kwangu” hudumisha wazo la mambo yaliyoonekana katika Paulo mwenyewe bila kuyawekea tafsiri finyu kuwa mfano au mwenendo pekee.
- source_word: ταῦτα πράσσετε
  choice: yatendeni
  rationale: Kitenzi “kutenda” kinaeleza kuyaweka mambo hayo katika vitendo. Amri ya sasa ya Kigiriki inaweza kudokeza tendo la kudumu; tanbihi inatoa “endelea kuyatenda” kama uwezekano ulio wazi zaidi.
- source_word: ὁ θεὸς τῆς εἰρήνης
  choice: Mungu wa amani
  rationale: Hudumisha moja kwa moja muundo wa Kigiriki na usemi wa kawaida wa Paulo bila kuufasiri kuwa Mungu anayetoa amani pekee.
- source_word: ἔσται μεθ’ ὑμῶν
  choice: atakuwa pamoja nanyi
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya ahadi ya kuwapo kwa Mungu pamoja nao.
theological_decisions:
- issue: Uhusiano kati ya kutii na kuwapo kwa Mungu
  choice: Himizo linafuatiwa na ahadi kwa kuunganishwa na “naye,” bila kuifanya sentensi kuwa sharti la wazi.
  alternative: Kutafsiri kwa muundo wa sharti, kama “mkifanya hivyo, ndipo Mungu wa amani atakuwa pamoja nanyi.”
  rationale: Kigiriki kinaunganisha vifungu kwa καί, wala hakitumii muundo wa wazi wa sharti. Tafsiri inahifadhi nguvu ya kichungaji na mvutano wa kitheolojia bila kuongeza uhusiano wa kimitambo wa sababu na matokeo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. Mfululizo wa vitenzi umeunganishwa kwa viambishi vya urejeshi ili sentensi isomeke kwa urahisi. Alama zote za tanbihi zimewekwa mara moja katika matini kuu.
