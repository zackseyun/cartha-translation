- from: Naam, nakuomba wewe pia, mwenzangu mwaminifu,[a] uwasaidie wanawake hawa, ambao walipambana pamoja nami katika kazi ya injili,[b] pamoja na Klementi na wafanyakazi wenzangu wengine, ambao majina yao yamo katika kitabu cha uzima.
  to: Naam, nakuomba wewe pia, mwenzangu wa kweli,[a] uwasaidie wanawake hawa, ambao walijitahidi pamoja nami katika injili,[b] pamoja na Klementi na wafanyakazi wenzangu wengine, ambao majina yao yamo katika kitabu cha uzima.
  rationale: Revision is limited to restoring the sense of γνήσιε as “true/genuine,” avoiding the unnecessary addition of “kazi” to ἐν τῷ εὐαγγελίῳ, and aligning footnote b with the lexical alternatives for συνήθλησάν. The ambiguity of σύζυγε as a descriptive address or possible proper name is retained in footnote a.
