id: PHP.4.3
reference: Philippians 4:3
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ναὶ ἐρωτῶ καὶ σέ, ⸂γνήσιε σύζυγε⸃, συλλαμβάνου αὐταῖς, αἵτινες ἐν τῷ εὐαγγελίῳ συνήθλησάν μοι μετὰ καὶ Κλήμεντος καὶ τῶν λοιπῶν συνεργῶν μου, ὧν τὰ ὀνόματα ἐν βίβλῳ ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/003.yaml
  text: Yes[a], I ask you also, true companion, help these women, who contended alongside me in the gospel[b], together with Clement and the rest of my fellow workers, whose names are in the book of life.
translation:
  language: sw
  text: Naam, nakuomba wewe pia, mwenzangu wa kweli,[a] uwasaidie wanawake hawa, ambao walijitahidi pamoja nami katika injili,[b] pamoja na Klementi na wafanyakazi wenzangu wengine, ambao majina yao yamo katika kitabu cha uzima.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tafsiri nyingine: “mwenzangu wa kweli katika nira”; wengine hudhani kuwa usemi huu ni jina la mtu, “Sizigo.”'
    reason: alternative_reading
  - marker: b
    text: Au, “walipambana pamoja nami” au “walishindana bega kwa bega nami.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ναί
  choice: Naam
  rationale: Hudumisha uthibitisho wa moja kwa moja unaoanzisha ombi la Paulo kwa lugha yenye hadhi na iliyo ya kawaida katika Kiswahili.
- source_word: ἐρωτῶ
  choice: nakuomba
  rationale: Hutoa maana ya msingi ya ombi la kibinafsi bila kulifanya liwe amri kali.
- source_word: γνήσιε σύζυγε
  choice: mwenzangu mwaminifu
  rationale: Huchukulia σύζυγε kuwa nomino ya maelezo kwa mshirika asiyeitwa jina; “mwaminifu” hapa huwasilisha uhalisi na kutegemeka kwa γνήσιε kwa Kiswahili cha kawaida.
- source_word: συλλαμβάνου
  choice: uwasaidie
  rationale: Hueleza wito wa kutoa msaada wa vitendo kwa uwazi bila kulazimisha sitiari ya kushika pamoja.
- source_word: αὐταῖς
  choice: wanawake hawa
  rationale: Huonyesha wazi jinsia ya wingi inayorejelea Euodia na Sintike katika muktadha uliotangulia.
- source_word: συνήθλησάν μοι
  choice: walipambana pamoja nami
  rationale: Huhifadhi taswira ya mashindano au jitihada nzito iliyomo katika συναθλέω, huku ikibaki ya kawaida na kueleweka.
- source_word: ἐν τῷ εὐαγγελίῳ
  choice: katika kazi ya injili
  rationale: Kiswahili huhitaji ufafanuzi mdogo ili pambano lisieleweke kuwa dhidi ya injili; “kazi” huwasilisha eneo la huduma bila kuondoa kabisa upana wa usemi wa Kigiriki.
- source_word: συνεργῶν
  choice: wafanyakazi wenzangu
  rationale: Ni usemi wazi na wa kawaida wa ushirika katika kazi, unaofaa kwa istilahi ya Paulo.
- source_word: βίβλῳ ζωῆς
  choice: kitabu cha uzima
  rationale: Ni usemi wa kibiblia uliozoeleka na unaoeleweka katika Kiswahili.
theological_decisions:
- issue: Tafsiri ya γνήσιε σύζυγε
  choice: 'Kauli ya maelezo kwa mshirika wa kiume ambaye jina lake halikutajwa: “mwenzangu mwaminifu”'
  alternative: Huenda Σύζυγος ni jina la mtu, “Sizigo,” au usemi wa kisitiari “mwenzangu wa nira.”
  rationale: Kivumishi γνήσιε kinaendana kwa kawaida na mwito wa maelezo, lakini uwezekano wa jina maalumu na sitiari halisi unabaki; kwa hiyo umewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo unabaki karibu na Kigiriki, lakini “katika kazi ya injili” hutumiwa kwa ufasaha na uwazi wa Kiswahili. Alama zote za tanbihi zimewekwa katika matini kuu.
