    text: 'Tafsiri nyingine: “mwenzangu wa kweli katika nira”; wengine hudhani kuwa usemi huu ni jina la mtu, “Sizigo.”'
    reason: alternative_reading
  - marker: b
    text: Au, “walipambana pamoja nami” au “walishindana bega kwa bega nami.”
    reason: lexical_alternative
  revision_rationale: Revision is limited to restoring the sense of γνήσιε as “true/genuine,” avoiding the unnecessary addition of “kazi” to ἐν τῷ εὐαγγελίῳ, and aligning footnote b with the lexical alternatives for συνήθλησάν. The ambiguity of σύζυγε as a descriptive address or possible proper name is retained in footnote a.
