  yaml_path: translation/nt/philippians/004/016.yaml
  text: because even in Thessalonica you sent for my need both once and twice[a].
translation:
  language: sw
  text: kwa maana hata huko Thesalonike mlinitumia msaada kwa ajili ya hitaji langu mara moja na tena[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa lugha ya kawaida zaidi, “mlinitumia msaada kwa ajili ya hitaji langu zaidi ya mara moja.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: kwa maana
  rationale: Kiunganishi hiki kinaeleza sababu ya kauli iliyotangulia; “kwa maana” ni cha kawaida na chenye hadhi katika Kiswahili.
- source_word: ἐν Θεσσαλονίκῃ
  choice: nilipokuwa Thesalonike
  rationale: Muundo huu wa Kiswahili unaonyesha kwa kawaida kwamba Paulo ndiye aliyekuwa Thesalonike, bila kubadili maana ya mahali ya Kigiriki.
- source_word: ἅπαξ καὶ δὶς
  choice: mara moja na tena
  rationale: Huhifadhi msisitizo wa usemi wa Kigiriki, yaani walituma zaidi ya mara moja, huku ukiwa wa asili katika Kiswahili.
- source_word: εἰς τὴν χρείαν μοι
  choice: kwa ajili ya hitaji langu
  rationale: Huhifadhi umoja wa χρεία na kueleza kwamba kile kilichotumwa kililenga kumsaidia Paulo katika hitaji lake.
- source_word: ἐπέμψατε
  choice: mlinitumia msaada
  rationale: Kigiriki kinasema kihalisi “mlituma,” lakini kitu kilichotumwa kimeachwa kudokezwa. Kiswahili huhitaji ufafanuzi wa kawaida zaidi; “msaada” huonyesha muktadha bila kuamua kama ulikuwa fedha au kitu kingine.
