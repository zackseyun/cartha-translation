id: COL.3.22
reference: Colossians 3:22
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οἱ δοῦλοι, ὑπακούετε κατὰ πάντα τοῖς κατὰ σάρκα κυρίοις, μὴ ἐν ⸀ὀφθαλμοδουλίαις, ὡς ἀνθρωπάρεσκοι, ἀλλ’ ἐν ἁπλότητι καρδίας, φοβούμενοι τὸν ⸀κύριον.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/022.yaml
  text: Servants[a], obey in everything those who are your masters according to the flesh, not with eye-service, as people-pleasers, but with sincerity of heart[b][c], fearing the Lord.
translation:
  language: sw
  text: Enyi watumwa,[a] watiini katika kila jambo wale walio mabwana zenu kwa jinsi ya mwili,[b] si kwa kufanya kazi wakati tu mnapotazamwa,[c] kama watu wanaotaka kuwapendeza wanadamu, bali kwa moyo mnyofu, mkimcha Bwana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kiyunani δοῦλοι linamaanisha kwa kawaida watu waliokuwa watumwa chini ya mamlaka ya bwana; linaweza pia kutafsiriwa “watumishi,” lakini hapa “watumwa” huonyesha wazi hali yao ya kijamii.
    reason: lexical_alternative
  - marker: b
    text: “Kwa jinsi ya mwili” linaweza kutafsiriwa “wa duniani”; yaani, mamlaka ya mabwana hao ni ya kibinadamu na ya maisha haya.
    reason: lexical_alternative
  - marker: c
    text: Yaani, kufanya kazi kwa bidii wakati tu mtu anapotazamwa.
    reason: cultural_note
lexical_decisions:
- source_word: οἱ δοῦλοι
  choice: Enyi watumwa
  rationale: Katika kanuni hii ya nyumba, δοῦλοι inataja wazi watu waliokuwa watumwa chini ya mamlaka ya mabwana; “watumwa” huepuka kuugeuza uhusiano huo kuwa ajira ya hiari.
- source_word: ὑπακούετε κατὰ πάντα
  choice: watiini katika kila jambo
  rationale: Huhifadhi hali ya amri ya ὑπακούετε na upana wa κατὰ πάντα kwa Kiswahili cha kawaida.
- source_word: τοῖς κατὰ σάρκα κυρίοις
  choice: wale walio mabwana zenu kwa jinsi ya mwili
  rationale: Hutofautisha mabwana wa kibinadamu na Bwana aliyetajwa mwishoni, huku ikihifadhi usemi wa Paulo κατὰ σάρκα badala ya kuufupisha tu kuwa “wa duniani.”
- source_word: μὴ ἐν ὀφθαλμοδουλίαις
  choice: si kwa kufanya kazi wakati tu mnapotazamwa
  rationale: Tafsiri ya kimaana inaeleza kwa kawaida huduma inayofanywa ili kuonekana na wakati mwenye mamlaka anatazama; kalki kama “utumishi wa macho” si ya asili katika Kiswahili cha sasa.
- source_word: ὡς ἀνθρωπάρεσκοι
  choice: kama watu wanaotaka kuwapendeza wanadamu
  rationale: Huwasilisha maana hasi ya kutenda kwa lengo la kupata kibali cha watu bila kutumia neno la kubuni lisilo la kawaida.
- source_word: ἐν ἁπλότητι καρδίας
  choice: kwa moyo mnyofu
  rationale: ἁπλότης hapa ni unyofu na kutokuwa na nia mbili, si urahisi wa kiakili; “moyo mnyofu” ni wa asili na wenye heshima.
- source_word: φοβούμενοι τὸν κύριον
  choice: mkimcha Bwana
  rationale: “Kumcha Bwana” ni usemi wa kibiblia uliozoeleka unaohifadhi wazo la hofu yenye heshima; “Bwana” pia hutenganishwa na mabwana wa kibinadamu.
theological_decisions:
- issue: Maagizo ya kimaadili katika mazingira ya utumwa
  choice: Kutaja hali hiyo wazi kwa “watumwa” na “mabwana” bila kuibadili kuwa uhusiano wa waajiri na wafanyakazi.
  alternative: Kutumia “watumishi” na kuelewa mabwana kama waajiri wa kisasa.
  rationale: Maneno ya Kiyunani na muktadha wa kanuni za nyumba yanahusu utumwa wa ulimwengu wa kale. Kulainisha maneno kungeficha mvutano wa kihistoria na kimaadili uliomo katika kifungu; kutafsiri wazi hakumaanishi kuhalalisha taasisi hiyo.
- issue: Maana ya κατὰ σάρκα
  choice: kwa jinsi ya mwili
  alternative: wa duniani
  rationale: Usemi huu huhifadhi tofauti ya Paulo kati ya mamlaka ya kibinadamu yenye mipaka na Bwana, bila kufunga kabisa maana yake katika ufafanuzi mmoja.
- issue: Utambulisho wa τὸν κύριον
  choice: Bwana
  alternative: bwana mkuu
  rationale: Kibainishi pamoja na tofauti na mabwana wa kibinadamu kinaelekeza kwa Bwana wa kimungu; tafsiri ya cheo “Bwana” huhifadhi matumizi hayo bila kuongeza jina ambalo halipo katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “Enyi watumwa” huhifadhi anwani ya moja kwa moja; “moyo mnyofu” ni wa kawaida kuliko kalki “unyofu wa moyo,” na ufafanuzi wa ὀφθαλμοδουλία katika matini unaepuka usemi usioeleweka wa “utumishi wa macho.”
