  source_fidelity: 'Tafsiri inafuata kwa uaminifu vipengele vya msingi vya Kiyunani: anwani kwa watumwa, amri ya kutii katika kila jambo, utofauti wa mabwana wa «kwa jinsi ya mwili» na Bwana, katazo la utendaji wa kuonekana, nia ya kuwapendeza watu, unyofu wa moyo, na kumcha Bwana. Haibadilishi mazingira ya utumwa kuwa ajira ya kisasa.'
