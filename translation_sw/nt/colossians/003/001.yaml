  text: Εἰ οὖν συνηγέρθητε τῷ Χριστῷ, τὰ ἄνω ζητεῖτε, οὗ ὁ Χριστός ἐστιν ἐν δεξιᾷ τοῦ θεοῦ καθήμενος·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/001.yaml
  text: If[a], then, you were raised with the Messiah, seek the things above[b], where the Messiah is, seated at the right hand of God.
translation:
  language: sw
  text: Basi, ikiwa mmefufuliwa pamoja na Masihi, yatafuteni yaliyo juu, ambako Masihi yuko, ameketi upande wa kuume wa Mungu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Basi, kwa kuwa mmefufuliwa pamoja na Masihi.” Kigiriki kinatumia muundo wa sharti (“ikiwa”), ingawa katika muktadha huenda Paulo anadhani sharti hilo ni kweli.
    reason: alternative_reading
lexical_decisions:
- source_word: Εἰ οὖν
  choice: Basi, ikiwa
  rationale: Huhifadhi muundo wa sharti wa εἰ pamoja na kiunganishi cha hoja οὖν, bila kuugeuza kimya kimya kuwa kauli ya uhakika.
- source_word: συνηγέρθητε τῷ Χριστῷ
  choice: mmefufuliwa pamoja na Masihi
  rationale: Kitenzi ni aoristi tendwa, nafsi ya pili wingi; ‘mmefufuliwa’ huonyesha tendo lililowapata na matokeo yake ya sasa, huku ‘pamoja na’ ikibeba wazo la kuunganishwa naye.
- source_word: τὰ ἄνω
  choice: yaliyo juu
  rationale: Huhifadhi maana pana ya usemi wa Kigiriki unaorejelea mambo ya juu bila kuufafanua zaidi kuwa ‘mambo ya mbinguni.’
- source_word: ζητεῖτε
  choice: yatafuteni
  rationale: Amri ya wakati wa sasa inaelekeza kwenye jitihada au mwelekeo unaoendelea; Kiswahili hiki ni cha kawaida na cha moja kwa moja.
- source_word: οὗ ὁ Χριστός ἐστιν
  choice: ambako Masihi yuko
  rationale: ‘Ambako’ huonyesha mahali au ulimwengu unaoitwa ‘juu,’ na Χριστός imetafsiriwa kama cheo.
- source_word: ἐν δεξιᾷ τοῦ θεοῦ καθήμενος
  choice: ameketi mkono wa kuume wa Mungu
  rationale: Huhifadhi taswira ya kifalme ya kuketi upande wa kuume wa Mungu bila kuipanua kuwa ‘ametawazwa.’
theological_decisions:
- issue: Nguvu ya sharti Εἰ
  choice: Basi, ikiwa
  alternative: Basi, kwa kuwa
  rationale: Ingawa sharti hili katika muktadha huenda linadhaniwa kuwa kweli, muundo wa sharti wa Kigiriki umehifadhiwa ili kutotatua mvutano wa kauli bila ulazima.
- issue: Tafsiri ya Χριστός
  choice: Masihi
  alternative: Kristo
  rationale: Katika mstari huu neno linaendelea kubeba maana ya cheo cha Mtiwa-Mafuta, hasa katika maelezo ya kuinuliwa kwake; kwa hiyo ‘Masihi’ huonyesha maana hiyo wazi.
- issue: Maana ya kufufuliwa pamoja na Masihi
  choice: mmefufuliwa pamoja na Masihi
  alternative: mlifufuka pamoja na Masihi
  rationale: Kauli tendwa ya Kigiriki imehifadhiwa; tafsiri haimtaji mtendaji ambaye hakutajwa moja kwa moja katika kishazi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Masihi’ limetumika kama cheo; ‘mkono wa kuume wa Mungu’ huhifadhi nahau ya kibiblia iliyozoeleka.
