  footnotes:
  - marker: a
    text: Au, “Fikirini mambo yaliyo juu.” Kitenzi cha Kigiriki hakimaanishi kufikiri tu, bali pia kuelekeza mtazamo au mahangaiko ya mtu kwenye jambo fulani.
