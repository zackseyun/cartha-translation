lexical_decisions:
- source_word: τὰ ἄνω
  choice: mambo ya juu
  rationale: Kirai hiki cha wingi kinarejelea mambo au hali halisi za juu; tafsiri hii inadumisha wingi na ulinganifu wake na mambo yaliyo duniani.
- source_word: φρονεῖτε
  choice: Yaelekezeni mawazo yenu kwenye
  rationale: 'Kitenzi hiki kina maana pana kuliko kufikiri tu: kinahusu kuelekeza mtazamo, nia, na mahangaiko ya mtu kwenye jambo fulani. Kauli hii pia huwasilisha amri ya kuendelea kuwa na mwelekeo huo.'
- source_word: μὴ
  choice: si
  rationale: Hapa neno hili linakanusha jambo la pili kwa kulinganisha moja kwa moja na jambo la kwanza.
- source_word: τὰ ἐπὶ τῆς γῆς
  choice: mambo yaliyo duniani
  rationale: Tafsiri hii inadumisha muundo wa mambo halisi na utofautishaji wa mahali kati ya yaliyo juu na yaliyo duniani, bila kuyaeleza zaidi ya Kigiriki.
- source_word: γῆς
  choice: duniani
  rationale: Katika utofautishaji huu wa ulimwengu mzima na 'juu,' neno hili humaanisha dunia, wala si nchi au eneo maalumu.
theological_decisions:
- issue: Asili ya himizo katika φρονεῖτε
  choice: Himizo la kuelekeza mtazamo, nia, na maadili kwenye mambo ya juu
  alternative: Amri finyu ya kufikiri kiakili tu kuhusu yaliyo juu
  rationale: Maana ya φρονέω inahusisha fikra, mtazamo, nia, au mwelekeo wa ndani. 'Yaelekezeni mawazo yenu' huhifadhi upana huo bila kuingiza maelezo ya ziada ya kimafundisho.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Yaelekezeni mawazo yenu' ni cha asili na kinafikisha maana pana ya φρονεῖτε; 'mambo yaliyo duniani' huhifadhi utofautishaji halisi wa juu na dunia.
