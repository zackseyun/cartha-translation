  text: καὶ πᾶν ⸂ὅ τι⸃ ⸀ἐὰν ποιῆτε ἐν λόγῳ ἢ ἐν ἔργῳ, πάντα ἐν ὀνόματι κυρίου Ἰησοῦ, εὐχαριστοῦντες τῷ ⸀θεῷ πατρὶ δι’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/017.yaml
  text: And whatever you do[a], in word or in deed, do everything in the name of the Lord Jesus[b], giving thanks to God the Father through him.
translation:
  language: sw
  text: Na kila mfanyalo, kwa neno au kwa tendo[a], fanyeni yote katika jina la Bwana Yesu[b], mkimshukuru Mungu Baba kwa njia yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa kusema au kwa kutenda.”
    reason: lexical_alternative
  - marker: b
    text: “Katika jina la” pia laweza kumaanisha “chini ya mamlaka ya” au “kama mwakilishi wa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν ὅ τι ἐὰν ποιῆτε
  choice: kila mfanyalo
  rationale: 'Muundo huu una maana pana isiyo na kikomo: jambo lolote mnalofanya. “Kila mfanyalo” ni Kiswahili cha asili na huhifadhi ujumla wa usemi wa Kigiriki.'
- source_word: ἐν λόγῳ ἢ ἐν ἔργῳ
  choice: kwa neno au kwa tendo
  rationale: Jozi hii fupi hutofautisha usemi na matendo. Tafsiri hii huhifadhi uwiano wa kishairi wa Kigiriki bila kupoteza uwazi.
- source_word: πάντα
  choice: yote
  rationale: Neno hili linajumlisha mambo yote yaliyotajwa kabla na kusisitiza kuwa hakuna sehemu ya maisha iliyo nje ya agizo hili.
- source_word: ἐν ὀνόματι κυρίου Ἰησοῦ
  choice: katika jina la Bwana Yesu
  rationale: Hii ni tafsiri ya moja kwa moja inayohifadhi upana wa nahau ya kibiblia, unaoweza kuhusisha mamlaka, uwakilishi na uhusiano wa uaminifu.
- source_word: κυρίου
  choice: Bwana
  rationale: Katika muktadha huu κύριος ni cheo cha Yesu chenye uzito wa Agano Jipya; “Bwana” ndilo neno la kawaida na lenye heshima katika Kiswahili.
- source_word: εὐχαριστοῦντες
  choice: mkimshukuru
  rationale: Umbo hili linaonyesha tendo linaloendelea sambamba na kufanya yote katika jina la Yesu. “Mkimshukuru” huwasilisha uhusiano huo kwa Kiswahili cha kawaida.
- source_word: τῷ θεῷ πατρὶ
  choice: Mungu Baba
  rationale: πατρί linafafanua θεῷ; “Mungu Baba” ni usemi wazi na wa kawaida wa Kiswahili unaohifadhi uhusiano huo.
- source_word: δι’ αὐτοῦ
  choice: kwa njia yake
  rationale: Kirai hiki huhifadhi wazo la upatanishi, huku kiwakilishi kikirejelea kwa kawaida jina lililo karibu zaidi, yaani Bwana Yesu.
theological_decisions:
- issue: Maana ya “katika jina la Bwana Yesu”
  choice: Nahau “katika jina la Bwana Yesu” imehifadhiwa katika matini kuu.
  alternative: chini ya mamlaka ya Bwana Yesu; kama wawakilishi wa Bwana Yesu
  rationale: Nahau ya Kigiriki ina maana pana inayoweza kujumuisha mamlaka, uwakilishi na kujitambulisha pamoja na Yesu. Kuifafanua kwa maana moja tu kungepunguza mvutano na utajiri wake.
- issue: Mrejelewa wa “kwa njia yake”
  choice: Kiwakilishi kinamrejelea Bwana Yesu, ambaye kwa njia yake shukrani hutolewa kwa Mungu Baba.
  alternative: Kukichukulia kiwakilishi kwa maana ya jumla bila kusisitiza urejeleaji wake kwa Yesu
  rationale: Kisarufi, jina lililo karibu zaidi ni “Bwana Yesu,” na tafsiri hii huhifadhi muundo wa sentensi bila kuongeza maelezo ya kimafundisho yasiyokuwamo katika Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. “Neno” na “tendo” yamechaguliwa ili kudumisha ufupi na uwiano wa usemi wa asili.
