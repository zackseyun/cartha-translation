  verdict: revise
  source_fidelity: '‘Enyi waume, wapendeni wake zenu’ faithfully conveys the marital addressees, the imperative, and the relational object. However, ‘msiwe na uchungu dhidi yao’ does not naturally convey πικραίνεσθε in this interpersonal context: ‘uchungu’ normally denotes pain or sorrow in contemporary Standard East African Swahili and can obscure the sense of embittered or harsh treatment.'
  naturalness: The opening and conjunction are natural in a formal biblical register. Replacing ‘msiwe na uchungu dhidi yao’ with ‘msiwatendee kwa ukali’ gives idiomatic, clear Swahili and naturally expresses the prohibited conduct toward the wives.
  terminology: ‘Waume’ and ‘wake zenu’ correctly retain the explicitly marital, gendered reference of ἄνδρες and γυναῖκες. ‘Ukali’ appropriately represents the contextual relational force of πικραίνεσθε; a footnote preserves the lexical alternative of bitterness/resentment without making an unnatural literalism the main text.
  issues:
  - severity: medium
    issue: ‘msiwe na uchungu dhidi yao’ is an unnatural and potentially misleading rendering of μὴ πικραίνεσθε πρὸς αὐτάς.
    rationale: In Standard East African Swahili, ‘kuwa na uchungu’ most readily means to experience pain, grief, or distress, rather than to act with bitter resentment or harshness toward someone. The source context calls for a prohibition of harsh or embittered treatment.
  revised_text: Enyi waume, wapendeni wake zenu, wala msiwatendee kwa ukali.[a]
