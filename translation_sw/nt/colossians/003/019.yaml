  text: οἱ ἄνδρες, ἀγαπᾶτε τὰς γυναῖκας καὶ μὴ πικραίνεσθε πρὸς αὐτάς.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/019.yaml
  text: Husbands[a], love your wives, and do not be harsh toward them.
translation:
  language: sw
  text: Enyi waume, wapendeni wake zenu, wala msiwatendee kwa ukali.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “msiwe na kinyongo dhidi yao.” Kitenzi cha Kigiriki kinaweza kumaanisha kuwa na uchungu wa kinyongo au kuwa na moyo mkali; katika muktadha huu hurejelea mwenendo mkali au wa chuki dhidi ya wake.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ἄνδρες
  choice: Enyi waume
  rationale: Ingawa ἀνήρ inaweza kumaanisha ‘mwanamume’ au ‘mume,’ muktadha wa maagizo ya nyumbani na kutajwa kwa wake unaonyesha wazi kwamba hapa ni waume wanaosemewa.
- source_word: ἀγαπᾶτε
  choice: wapendeni
  rationale: Huhifadhi maana ya kawaida ya ἀγαπάω na nguvu ya amri, huku kiambishi cha yambwa -wa- kikirejelea wake.
- source_word: τὰς γυναῖκας
  choice: wake zenu
  rationale: γυνή inaweza kumaanisha ‘mwanamke’ au ‘mke,’ lakini muktadha wa ndoa unahitaji ‘wake’; ‘zenu’ huonyesha uhusiano unaoeleweka katika Kigiriki na ni usemi wa kawaida wa Kiswahili.
- source_word: μὴ πικραίνεσθε
  choice: msiwe na uchungu
  rationale: πικραίνω inahusiana moja kwa moja na uchungu na inaweza kueleza kuwa na kinyongo au moyo mkali. Tafsiri hii huhifadhi sitiari na utata halisi kuliko kuifupisha kuwa matendo makali pekee.
- source_word: πρὸς αὐτάς
  choice: dhidi yao
  rationale: πρός pamoja na hali ya accusative hapa huelekeza mtazamo au mwenendo kwa wake; ‘dhidi yao’ ni ya asili pamoja na ‘kuwa na uchungu’ na huhifadhi mwelekeo hasi.
theological_decisions:
- issue: Anwani ya kijinsia na ya kindoa katika maagizo ya nyumbani
  choice: Kuhifadhi anwani mahsusi ya waume na wake.
  alternative: Kutumia maneno mapana ‘wanaume’ na ‘wanawake.’
  rationale: Kigiriki hapa kinawahusu wanaume waliooa katika uhusiano wao na wake zao, si wanaume na wanawake kwa ujumla.
- issue: Maana ya πικραίνεσθε
  choice: Kuhifadhi taswira ya uchungu katika maandishi na kueleza uwezekano wa ukali katika tanbihi.
  alternative: Kutafsiri moja kwa moja ‘msiwatendee kwa ukali.’
  rationale: Kitenzi kinaweza kurejelea kuwa na uchungu au kinyongo na pia mwenendo mkali unaotokana navyo; maandishi na tanbihi kwa pamoja huhifadhi wigo huo bila kuamua maana moja kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Enyi waume’ inaweka wazi anwani ya moja kwa moja, huku ‘wala’ ikiunganisha amri hasi kwa mtindo wa kawaida wa kibiblia usio mzito kupita kiasi.
