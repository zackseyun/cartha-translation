  yaml_path: translation/nt/colossians/003/021.yaml
  text: Fathers[a], do not provoke your children, so that they may not become discouraged.
translation:
  language: sw
  text: Akina baba, msiwachokoze watoto wenu, ili wasivunjike moyo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ πατέρες
  choice: Akina baba
  rationale: Neno la Kigiriki linawataja hasa baba, si wazazi kwa ujumla. “Akina baba” ni mwito wa kawaida na wa heshima katika Kiswahili, na huhifadhi mhusika aliyetajwa katika muktadha wa maagizo ya nyumbani.
- source_word: μὴ ἐρεθίζετε
  choice: msiwachokoze
  rationale: Kitenzi hiki katika muktadha huu kina maana ya kuwachochea au kuwaudhi watoto kwa namna yenye madhara. “Msiwachokoze” ni Kiswahili cha sasa kinachoonyesha tendo linaloweza kuamsha hisia hasi bila kulifanya liwe hasa ‘kuwakasirisha’ tu.
- source_word: τὰ τέκνα ὑμῶν
  choice: watoto wenu
  rationale: τέκνα ni neno jumuishi kwa watoto au wazao; “watoto wenu” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: ἵνα μὴ
  choice: ili wasi-
  rationale: Muundo “ili wasi-” huhifadhi kwa Kiswahili cha kawaida maana ya kusudi au matokeo yanayokusudiwa kuepukwa.
- source_word: ἀθυμῶσιν
  choice: wasivunjike moyo
  rationale: Kitenzi ἀθυμέω huonyesha kupoteza moyo, hamasa, au ujasiri. Nahau “kuvunjika moyo” ni ya kawaida, yenye hadhi, na huwasilisha hali hiyo ya ndani kwa usahihi.
theological_decisions:
- issue: Wigo wa οἱ πατέρες katika agizo la nyumbani
  choice: Agizo limetafsiriwa kuwaelekea hasa akina baba
  alternative: Kulielekeza kwa wazazi kwa ujumla
  rationale: Kigiriki kinawataja waziwazi baba. Ingawa kanuni hiyo inaweza kutumiwa kwa wazazi wengine pia, tafsiri haipaswi kupanua kimya kimya mhusika wa kisarufi na kileksika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi na chenye hadhi. Nahau “kuvunjika moyo” hutoa kwa kawaida maana ya ἀθυμέω, hivyo hakuna tanbihi inayohitajika.
