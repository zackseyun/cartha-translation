  text: Ἐνδύσασθε οὖν ὡς ἐκλεκτοὶ τοῦ θεοῦ, ἅγιοι καὶ ἠγαπημένοι, σπλάγχνα οἰκτιρμοῦ, χρηστότητα, ταπεινοφροσύνην, πραΰτητα, μακροθυμίαν,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/012.yaml
  text: Put on[a], then, as God’s chosen ones, holy and beloved, compassion, kindness, humility, gentleness[b], and patience[c],
translation:
  language: sw
  text: Basi, kama watu waliochaguliwa na Mungu[a], watakatifu na wapendwa, jivikeni[b] huruma ya ndani kabisa[c], fadhili, unyenyekevu, upole[d] na uvumilivu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wateule wa Mungu.”
    reason: lexical_alternative
  - marker: b
    text: Kwa maana halisi, “vaeni”; hapa ni taswira ya kuyafanya maadili haya kuwa sehemu ya maisha yenu.
    reason: metaphor_clarification
  - marker: c
    text: Au, “mioyo yenye huruma.” Kigiriki kwa maana halisi huzungumzia hisia za rehema zinazotoka ndani kabisa.
    reason: lexical_alternative
  - marker: d
    text: Au, “uungwana usio na ukali.” Neno hili halidokezi udhaifu.
    reason: lexical_clarification
lexical_decisions:
- source_word: Ἐνδύσασθε
  choice: jivikeni
  rationale: Kitenzi hiki ni agizo la kujitendea na kinatumia kwa njia ya mfano wazo la kuvaa nguo. “Jivikeni” huhifadhi taswira hiyo kwa Kiswahili cha kawaida.
- source_word: οὖν
  choice: Basi
  rationale: Huonyesha hitimisho au himizo linalotokana na yaliyotangulia; “Basi” huunganisha hoja kwa kawaida bila kuwa rasmi kupita kiasi.
- source_word: ὡς ἐκλεκτοὶ τοῦ θεοῦ
  choice: kama watu waliochaguliwa na Mungu
  rationale: Huhifadhi utambulisho wa wasomaji kuwa wamechaguliwa na Mungu, huku ikiepuka kufanya kifungu hiki kifafanue namna au utaratibu wa uchaguzi huo.
- source_word: ἅγιοι καὶ ἠγαπημένοι
  choice: mlio watakatifu na kupendwa
  rationale: “Mlio” huonyesha kwamba maneno haya yanaeleza utambulisho wao. “Kupendwa” huhifadhi hali ya kuwa wamependwa bila kuongeza wazi mtendaji ambaye Kigiriki hakumtaji katika kishazi hiki.
- source_word: σπλάγχνα οἰκτιρμοῦ
  choice: huruma ya ndani kabisa
  rationale: Kifungu hiki kwa neno halisi hurejelea sehemu za ndani kama makao ya hisia za rehema. Kiswahili hiki kinawasilisha huruma ya kina bila kutumia picha ya viungo vya mwili ambayo ingekuwa ngeni.
- source_word: χρηστότητα
  choice: wema
  rationale: Katika orodha hii ya maadili, neno hilo humaanisha tabia njema yenye fadhili kwa wengine. “Wema” ni neno la kawaida na pana linalofaa muktadha.
- source_word: ταπεινοφροσύνην
  choice: unyenyekevu
  rationale: Huwasilisha kwa usahihi hali ya kutokuwa na majivuno na kuwa na mtazamo wa unyenyekevu.
- source_word: πραΰτητα
  choice: upole
  rationale: “Upole” ni Kiswahili cha sasa kinachoeleweka na huonyesha tabia ya kutenda bila ukali; hakimaanishi lazima udhaifu.
- source_word: μακροθυμίαν
  choice: uvumilivu
  rationale: Neno la Kigiriki huonyesha uwezo wa kustahimili kwa muda mrefu, hasa katika mahusiano na watu. “Uvumilivu” ni tafsiri ya kawaida na ya asili katika orodha hii.
theological_decisions:
- issue: Kutafsiri ἐκλεκτοὶ τοῦ θεοῦ bila kuingiza mfumo maalumu wa mafundisho kuhusu uchaguzi
  choice: watu waliochaguliwa na Mungu
  alternative: wateule wa Mungu
  rationale: Kifungu kinathibitisha kwamba Mungu ndiye aliyewachagua, lakini hakielezi hapa msingi, namna, au mpangilio wa uchaguzi huo. Tafsiri iliyochaguliwa huhifadhi dai la maandiko bila kulifafanua kupita yaliyosemwa.
- issue: Kuhifadhi uhusiano wa ἅγιοι καὶ ἠγαπημένοι na utambulisho wa wasomaji
  choice: mlio watakatifu na kupendwa
  alternative: watakatifu na wapendwa
  rationale: Muundo huu unaonyesha wazi kwamba sifa zote mbili zinawahusu watu waliochaguliwa na Mungu. “Kupendwa” pia huhifadhi hali ya kupokea upendo bila kutaja moja kwa moja mtendaji ambaye kishazi chenyewe hakimtaji.
- issue: Kuwasilisha σπλάγχνα οἰκτιρμοῦ bila kufifisha kina cha huruma wala kulazimisha taswira ngeni
  choice: huruma ya ndani kabisa
  alternative: mioyo yenye huruma
  rationale: Kigiriki hutumia lugha ya viungo vya ndani kwa hisia ya rehema ya kina. Tafsiri kuu huwasilisha maana hiyo, huku tanbihi ikihifadhi taswira mbadala ya moyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa agizo na taswira ya kuvaa umehifadhiwa; orodha ya maadili imewasilishwa kwa maneno ya sasa yasiyo ya kimadhehebu.
