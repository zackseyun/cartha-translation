  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὅπου οὐκ ἔνι Ἕλλην καὶ Ἰουδαῖος, περιτομὴ καὶ ἀκροβυστία, βάρβαρος, Σκύθης, δοῦλος, ἐλεύθερος, ἀλλὰ ⸀τὰ πάντα καὶ ἐν πᾶσιν Χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/011.yaml
  text: where there is no Greek and Jew[a], circumcision and uncircumcision, barbarian, Scythian, servant, free, but Messiah is all[c][b], and in all.
translation:
  language: sw
  text: Ambamo hakuna Mgiriki wala Myahudi, aliyetahiriwa wala asiyetahiriwa, mshenzi[a] wala Mskiti, mtumwa wala mtu huru; bali Masihi[b] ni yote, naye yumo katika wote.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki lilikuwa lebo ambayo Wagiriki waliwatumia watu ambao lugha na utamaduni wao waliuona kuwa wa kigeni au usio wa Kigiriki; kwa desturi hutafsiriwa pia ‘barbarian.’
    reason: historical_context
  - marker: b
    text: Kigiriki Christos, yaani ‘Masihi’ au ‘Aliyetiwa Mafuta’; kwa desturi hutafsiriwa ‘Kristo.’
    reason: lexical_alternative
  - marker: c
    text: Au, ‘naye yumo katika kila mmoja.’ Kigiriki ‘katika wote’ ni kifupi na kinaweza kueleweka hasa kuhusu washiriki wote wa jamii iliyofanywa upya.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπου
  choice: Humo
  rationale: Hurejelea hali au jamii ya mtu mpya iliyotajwa katika mstari uliotangulia, huku ikidumisha maana ya eneo au nyanja.
- source_word: οὐκ ἔνι
  choice: hakuna
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha kwamba tofauti hizi hazina nafasi katika nyanja inayozungumziwa.
- source_word: Ἕλλην καὶ Ἰουδαῖος
  choice: Mgiriki wala Myahudi
  rationale: Ἕλλην ni Mgiriki, si neno pana zaidi la mtu wa mataifa; ‘wala’ huwasilisha ukanushaji wa jozi hii kwa Kiswahili cha kawaida.
- source_word: περιτομὴ καὶ ἀκροβυστία
  choice: aliyetahiriwa wala asiyetahiriwa
  rationale: Ingawa Kigiriki kina nomino dhahania, hapa zinatumika kama alama za utambulisho wa watu. Muundo wa watu ni wa asili na wazi zaidi kwa Kiswahili.
- source_word: βάρβαρος
  choice: mgeni
  rationale: Neno lilimtaja mtu ambaye lugha na utamaduni wake ulionekana kuwa wa kigeni kwa Wagiriki. ‘Mgeni’ huepuka matusi yasiyokusudiwa katika Kiswahili cha sasa; tanbihi huhifadhi mazingira ya kihistoria.
- source_word: Σκύθης
  choice: Mskythia
  rationale: Ni jina maalumu la mtu wa jamii ya Waskythia, hivyo limetoholewa badala ya kujumlishwa.
- source_word: δοῦλος
  choice: mtumwa
  rationale: Jozi yake na ἐλεύθερος inaonyesha wazi hali ya kisheria na kijamii ya utumwa, si utumishi wa hiari tu.
- source_word: ἐλεύθερος
  choice: mtu huru
  rationale: Hutoa kinyume cha moja kwa moja na cha kawaida cha ‘mtumwa’.
- source_word: τὰ πάντα
  choice: ni kila kitu
  rationale: Huonyesha ukuu na utoshelevu kamili wa Masihi kwa Kiswahili cha sasa kilicho wazi, bila kuongeza ufafanuzi wa kimetafizikia.
- source_word: ἐν πᾶσιν
  choice: yumo ndani ya wote
  rationale: Huhifadhi ufupi na upana wa Kigiriki; muktadha unaelekeza kwa watu wote wa jamii iliyofanywa upya, lakini usemi wenyewe hauwalazimishi wasomaji kuufanya kuwa ‘kila mtu’ pekee.
- source_word: Χριστός
  choice: Masihi
  rationale: Hapa Χριστός linafanya kazi kama cheo; ‘Masihi’ huwasilisha maana ya cheo hicho badala ya kulitohosha tu kuwa ‘Kristo’.
theological_decisions:
- issue: Upeo wa ἐν πᾶσιν
  choice: yumo ndani ya wote
  alternative: yumo ndani ya kila mmoja; yumo katika vitu vyote
  rationale: Muktadha unahusu washiriki wa jamii iliyofanywa upya, lakini Kigiriki ni kifupi na kinaweza kusikika kwa upana zaidi. Tafsiri kuu inadumisha mvutano huo.
- issue: Tafsiri ya Χριστός
  choice: Masihi
  alternative: Kristo
  rationale: Neno linatumika hapa kama cheo cha aliyetiwa mafuta. ‘Masihi’ huonyesha maana hiyo wazi, huku tanbihi ikitoa umbo la jadi.
- issue: Tafsiri ya δοῦλος
  choice: mtumwa
  alternative: mtumishi
  rationale: Kwa kuwa neno limewekwa kinyume na ‘mtu huru,’ hali ya kufungwa katika utumwa ndiyo inayosisitizwa.
- issue: Maana ya τὰ πάντα
  choice: ni kila kitu
  alternative: ni yote
  rationale: ‘Kila kitu’ ni Kiswahili cha kawaida kwa τὰ πάντα katika kauli hii. Hakisemi kwamba Masihi ni kila kitu kwa maana ya utambulisho wa kimetafizikia, bali kinadumisha kauli pana ya maandiko.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Orodha imetolewa kwa jozi za ‘wala’ ili ukanushaji usikike kwa kawaida. Nukta mkato hutenganisha orodha ya tofauti za kibinadamu na kauli kuu kuhusu Masihi.
