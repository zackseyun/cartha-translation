  text: ἐπὶ πᾶσιν δὲ τούτοις τὴν ἀγάπην, ⸀ὅ ἐστιν σύνδεσμος τῆς τελειότητος.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/014.yaml
  text: And above all these[a], put on love, which is the bond of perfection.
translation:
  language: sw
  text: Zaidi ya hayo yote, jivikeni upendo, ambao ni kifungo cha ukamilifu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kifungo cha utimilifu” au “kifungo cha ukomavu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ πᾶσιν δὲ τούτοις
  choice: Zaidi ya hayo yote
  rationale: Kauli hii ya Kiswahili huonyesha upendo kuwa wa kwanza kwa umuhimu na pia kile kinachoongezwa juu ya sifa zilizotajwa, hivyo inadumisha kwa kiasi kinachowezekana sitiari ya kuvaa inayotawala muktadha.
- source_word: τὴν ἀγάπην
  choice: upendo
  rationale: “Upendo” ni tafsiri ya kawaida, ya asili, na yenye upana unaofaa kwa ἀγάπη katika muktadha huu.
- source_word: '[kitenzi kinachodokezwa kutoka ἐνδύσασθε katika mstari wa 12]'
  choice: jivikeni
  rationale: Ingawa hakuna kitenzi wazi katika kifungu hiki, nomino ya hali ya kutendwa τὴν ἀγάπην inategemea amri ἐνδύσασθε ya mstari wa 12. “Jivikeni” hukamilisha sentensi kwa Kiswahili na kudumisha sitiari ya mavazi.
- source_word: ὅ
  choice: ambao
  rationale: Kiwakilishi hiki huanzisha maelezo kuhusu upendo bila kulazimisha uamuzi juu ya kutopatana kwa jinsia ya kisarufi kati ya ὅ na ἀγάπην katika Kigiriki. Katika Kiswahili, “ambao” hupatana kwa kawaida na “upendo.”
- source_word: σύνδεσμος
  choice: kifungo
  rationale: “Kifungo” huonyesha kitu kinachofungamanisha au kuunganisha, huku kikihifadhi ufupi na nguvu ya sitiari ya Kigiriki.
- source_word: τῆς τελειότητος
  choice: cha ukamilifu
  rationale: “Ukamilifu” huhifadhi wigo wa τελειότης unaoweza kumaanisha hali ya kuwa kamili, timilifu, au kukomaa, bila kuufanya usemi huo umaanishe tu ukomavu.
theological_decisions:
- issue: Maana ya upendo kuwa σύνδεσμος τῆς τελειότητος
  choice: Upendo unaitwa “kifungo cha ukamilifu,” kwa usemi mfupi unaohifadhi uwezekano kwamba unaunganisha sifa hizo katika ukamilifu.
  alternative: Upendo ni kifungo kinacholeta utimilifu au ukomavu, au kifungo ambacho ni cha hali ya ukamilifu.
  rationale: Uhusiano wa kisarufi wa τῆς τελειότητος unaweza kueleweka kwa namna kadhaa zinazokaribiana. Tafsiri ya moja kwa moja “kifungo cha ukamilifu” haifungi maana katika fasiri moja tu, hivyo inadumisha utata halisi wa chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima, na rahisi kueleweka. “Jivikeni” hudumisha sitiari ya mavazi kutoka muktadha, na “Zaidi ya hayo yote” huonyesha kipaumbele bila kuwa nzito au ya kizamani.
