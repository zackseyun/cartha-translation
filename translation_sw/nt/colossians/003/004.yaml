  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὅταν ὁ Χριστὸς φανερωθῇ, ἡ ζωὴ ⸀ὑμῶν, τότε καὶ ὑμεῖς σὺν αὐτῷ φανερωθήσεσθε ἐν δόξῃ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/004.yaml
  text: When Messiah[a], who is your life, is revealed[c][b], then you also will be revealed with him in glory.
translation:
  language: sw
  text: Wakati Masihi[a], aliye uzima wenu[b], atakapofunuliwa, ndipo ninyi pia mtafunuliwa pamoja naye katika utukufu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Kristo.” Cheo cha Kigiriki Χριστός kinaweza kutafsiriwa “Masihi” au kutolewa kwa umbo lililozoeleka “Kristo”; hapa “Masihi” huhifadhi maana ya cheo hicho.
    reason: alternative_reading
  - marker: b
    text: 'Kwa neno kwa neno: “Masihi, uzima wenu.”'
    reason: lexical_alternative
  - marker: c
    text: Au “mtaonekana pamoja naye katika utukufu.” Kitenzi cha Kigiriki kinatokana na mzizi uleule uliotumiwa mapema katika mstari huu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: Wakati ... atakapofunuliwa
  rationale: Inaonyesha tukio la wakati ujao linalotarajiwa; muundo huu ni wa kawaida na wa asili katika Kiswahili.
- source_word: ὁ Χριστὸς
  choice: Masihi
  rationale: Χριστός ni cheo chenye maana ya Mtiwa-Mafuta; “Masihi” huhifadhi nguvu ya cheo hicho katika Kiswahili.
- source_word: φανερωθῇ
  choice: atakapofunuliwa
  rationale: Huhifadhi hali ya kutendwa na wazo la kuwekwa wazi au kuonekana hadharani.
- source_word: ἡ ζωὴ ὑμῶν
  choice: aliye uzima wenu
  rationale: Hufanya uhusiano wa kiambatisho wa Kigiriki uwe wazi kwa Kiswahili bila kuongeza maelezo ya kitheolojia.
- source_word: τότε καὶ ὑμεῖς
  choice: ndipo ninyi pia
  rationale: “Ndipo” huhifadhi mfuatano wa wakati, “pia” huhifadhi καί, na “ninyi” huonyesha msisitizo wa kiwakilishi kilicho wazi katika Kigiriki.
- source_word: σὺν αὐτῷ
  choice: pamoja naye
  rationale: Hueleza ushirika wa karibu unaomaanishwa na σύν kwa Kiswahili cha kawaida.
- source_word: φανερωθήσεσθε
  choice: mtafunuliwa
  rationale: Huhifadhi hali ya kutendwa na urudiaji wa mzizi uleule uliotumiwa kwa kufunuliwa kwa Masihi.
- source_word: ἐν δόξῃ
  choice: katika utukufu
  rationale: Huhifadhi kishazi cha kihusishi na uzito wake wa maana; kinaweza kueleza mazingira au namna ya kufunuliwa.
theological_decisions:
- issue: Kutafsiri Χριστός kama cheo au kama jina lililozoeleka
  choice: Masihi
  alternative: Kristo
  rationale: Muktadha na matumizi ya kibainishi vinaunga mkono nguvu ya cheo; “Masihi” hutafsiri maana ya Χριστός badala ya kuihamisha kwa sauti tu.
- issue: Uhusiano wa ἡ ζωὴ ὑμῶν na Masihi
  choice: aliye uzima wenu
  alternative: uzima wenu
  rationale: Kigiriki kinamtambulisha Masihi kuwa uzima wa waamini. Kishazi hiki kinaweka utambulisho huo wazi kwa Kiswahili bila kuufafanua kupita maandiko.
- issue: Ulinganifu wa vitenzi viwili vya φανερόω
  choice: atakapofunuliwa ... mtafunuliwa
  alternative: atakapoonekana ... mtaonekana
  rationale: Kutumia mzizi mmoja huhifadhi ulinganifu wa maandishi na hali ya kutendwa katika vitenzi vyote viwili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya maandiko. Muundo ni wazi kwa wasomaji wa kawaida, huku ukihifadhi hali ya kutendwa, msisitizo wa “ninyi pia,” na ulinganifu wa vitenzi vya Kigiriki.
