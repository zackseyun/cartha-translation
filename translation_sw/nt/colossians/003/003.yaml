    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεθάνετε
  choice: mlikufa
  rationale: Kitenzi cha aoristi, nafsi ya pili wingi, kinaeleza tukio la uamuzi lililotokea zamani. ‘Mlikufa’ ni Kiswahili cha kawaida na huhifadhi hali hiyo bila kuongeza ufafanuzi.
- source_word: γάρ
  choice: kwa maana
  rationale: Huonyesha sababu au msingi wa himizo lililotangulia; ‘kwa maana’ huunganisha hoja kwa njia ya kawaida na yenye heshima.
- source_word: ἡ ζωὴ ὑμῶν
  choice: uhai wenu
  rationale: ‘Uhai’ linafaa zaidi hapa kwa ζωή inayorejelea hali ya kuwa hai ya waamini, bila kulipanua kuwa fundisho lisilotajwa wazi.
- source_word: κέκρυπται
  choice: umefichwa
  rationale: Kauli timilifu tendwa inaonyesha tendo lililotimizwa lenye hali inayoendelea sasa. ‘Umefichwa’ huhifadhi vipengele hivyo kwa Kiswahili cha kawaida.
- source_word: σὺν τῷ Χριστῷ
  choice: pamoja na Masihi
  rationale: σύν huonyesha ushirika au kuunganishwa, hivyo ‘pamoja na’ ni wazi. Χριστός imetafsiriwa kama cheo ‘Masihi,’ si jina tu.
- source_word: ἐν τῷ θεῷ
  choice: katika Mungu
  rationale: ἐν hapa huonyesha mahali au nyanja; ‘katika Mungu’ huhifadhi taswira na nguvu ya Kigiriki bila kuifafanua kupita kiasi.
theological_decisions:
- issue: Kutafsiri Χριστῷ kama cheo au kama umbo lililozoeleka la jina
  choice: Masihi
  alternative: Kristo
  rationale: Katika muktadha huu Χριστός hutumika kama cheo cha Mtiwa-Mafuta. ‘Masihi’ huhifadhi maana hiyo; ‘Kristo’ ni mbadala halali na umeonyeshwa katika tanbihi.
- issue: Maana ya hali ya κέκρυπται
  choice: umefichwa
  alternative: umefichika
  rationale: ‘Umefichwa’ huhifadhi wazi sauti tendwa na wazo la tendo lililotimia lenye matokeo yanayoendelea. ‘Umefichika’ inaweza kusikika kama hali isiyo na mtendaji na kupunguza sauti tendwa ya Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo umehifadhi uhusiano wa sababu, sauti tendwa, na lugha ya ‘katika Mungu’ bila kuongeza ufafanuzi wa kimadhehebu.
