translation:
  language: sw
  text: Kwa maana mlikufa, na uhai wenu umefichwa[b] pamoja na Masihi[a] katika Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kristo.” Neno la Kigiriki Χριστός linaweza kutafsiriwa “Masihi” au “Kristo”; hapa limetafsiriwa kama cheo ili kuhifadhi maana yake.
    reason: alternative_reading
  - marker: b
