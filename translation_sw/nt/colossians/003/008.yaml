  text: νυνὶ δὲ ἀπόθεσθε καὶ ὑμεῖς τὰ πάντα, ὀργήν, θυμόν, κακίαν, βλασφημίαν, αἰσχρολογίαν ἐκ τοῦ στόματος ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/008.yaml
  text: 'But now you also must put away all these things: anger, rage, malice, slander, and filthy speech from your mouth.'
translation:
  language: sw
  text: 'Lakini sasa ninyi pia yawekeni mbali mambo haya yote: hasira, ghadhabu, uovu, matukano, na maneno machafu yatokayo vinywani mwenu.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπόθεσθε
  choice: yawekeni mbali
  rationale: Kitenzi hiki kina maana ya kuvua au kuondoa kitu; hapa ni agizo la kuachana kabisa na tabia zilizoorodheshwa.
- source_word: ὀργήν
  choice: hasira
  rationale: Neno la kawaida na la asili kwa hali ya hasira, likitofautishwa kadiri iwezekanavyo na θυμός.
- source_word: θυμόν
  choice: ghadhabu
  rationale: Huwasilisha hasira kali au inayowaka, huku kikidumisha tofauti ya kileksika na ὀργή.
- source_word: κακίαν
  choice: uovu
  rationale: Neno pana linaloonyesha ubaya au nia mbaya; 'uovu' huhifadhi upana huo bila kuubana kuwa chuki pekee.
- source_word: βλασφημίαν
  choice: kashfa
  rationale: Katika muktadha wa usemi dhidi ya wengine, neno linaweza kumaanisha matamshi ya kudhalilisha au kuchafua jina; 'kashfa' ni ya kawaida na haibani maana kuwa kukufuru Mungu tu.
- source_word: αἰσχρολογίαν
  choice: maneno machafu
  rationale: Hutoa kwa lugha ya kawaida maana ya usemi wa aibu, mchafu, au usiofaa.
- source_word: ἐκ τοῦ στόματος ὑμῶν
  choice: kutoka vinywani mwenu
  rationale: Huhifadhi taswira halisi ya chanzo cha usemi na umoja wa Kigiriki unaotumiwa kwa maana ya jumla kwa kundi.
theological_decisions:
- issue: Upeo wa βλασφημία
  choice: kashfa
  alternative: kukufuru
  rationale: βλασφημία linaweza kuelekezwa kwa Mungu au kwa wanadamu. Orodha hii ya tabia na marejeo ya kinywa yanaunga mkono maana pana ya usemi wa kudhalilisha; tafsiri haipaswi kulazimisha rejeo kwa Mungu.
- issue: Nguvu ya agizo ἀπόθεσθε
  choice: yawekeni mbali
  alternative: lazima myaondoe
  rationale: Umbo lenyewe ni agizo la moja kwa moja. Kiswahili cha agizo kinadumisha nguvu hiyo bila kuongeza kitenzi cha ulazima kisichotajwa wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Orodha imetolewa kwa maneno yanayoeleweka kwa urahisi, huku tofauti kati ya ὀργή na θυμός ikihifadhiwa kwa 'hasira' na 'ghadhabu'.
