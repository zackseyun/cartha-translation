  text: Because of these things the wrath of God is coming upon the sons of disobedience[a].
translation:
  language: sw
  text: Kwa sababu ya mambo hayo, ghadhabu ya Mungu inakuja juu ya wana wa uasi[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watoto wa uasi,” yaani, watu wanaotambulishwa kwa uasi.
    reason: lexical_alternative
  - marker: b
    text: Baadhi ya nakala za kale huacha maneno “juu ya wana wa uasi.”
    reason: textual_variant
lexical_decisions:
- source_word: δι’ ἃ
  choice: Kwa sababu ya mambo hayo
  rationale: διά pamoja na kiwakilishi cha uhusiano katika hali ya akusativi huonyesha sababu. “Mambo hayo” hurejelea maovu yaliyotajwa katika mstari uliotangulia na kuhifadhi wingi wa rejeo hilo.
- source_word: ἔρχεται
  choice: inakuja
  rationale: Wakati wa sasa wa ἔρχομαι unahifadhi wazo la ghadhabu inayokuja, lenye mwelekeo wa hukumu ya wakati ujao, bila kuifanya kuwa kauli ya jumla tu.
- source_word: ἡ ὀργὴ τοῦ θεοῦ
  choice: ghadhabu ya Mungu
  rationale: ὀργή hapa ni hasira ya Mungu yenye sura ya hukumu; “ghadhabu” ni neno la Kiswahili lenye uzito na heshima unaofaa muktadha huu.
- source_word: ἐπὶ
  choice: juu ya
  rationale: ἐπί pamoja na akusativi huonyesha walengwa ambao ghadhabu inayokuja itawafikia. “Juu ya” huhifadhi taswira na mwelekeo wa usemi wa Kigiriki.
- source_word: τοὺς υἱοὺς τῆς ἀπειθείας
  choice: wana wa kutotii
  rationale: Tafsiri hii huhifadhi nahau ya Kisemiti iliyo katika Kigiriki na nomino ya kiume υἱούς. Tanbihi inaeleza kuwa maana yake ni watu wenye sifa ya kutomtii Mungu.
theological_decisions:
- issue: Iwapo nahau “wana wa kutotii” ihifadhiwe au ifafanuliwe moja kwa moja
  choice: Kuhifadhi “wana wa kutotii” katika matini kuu
  alternative: watu wasiotii; watu wenye sifa ya kutotii
  rationale: Kigiriki kina nahau ya kiume inayowataja watu wanaotambulishwa na kutotii kwao. Kuihifadhi hudumisha muundo na uzito wa chanzo, huku tanbihi ikitoa maana yake bila kuingiza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa moja kwa moja lakini wa asili; “ghadhabu” huhifadhi uzito wa lugha ya hukumu, na tanbihi hufafanua nahau isiyo ya kawaida bila kuibadili kimya kimya.
