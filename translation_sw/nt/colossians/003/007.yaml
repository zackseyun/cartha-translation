translation:
  language: sw
  text: Ninyi pia wakati fulani mlienenda katika mambo hayo, mlipokuwa mkiishi katika hayo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν οἷς
  choice: katika mambo hayo
  rationale: Kifungu hiki kinaelekeza kwa kawaida kwenye matendo maovu yaliyotajwa kabla. Kutaja “mambo” kunafanya rejeo hilo lieleweke kwa Kiswahili, huku kihusishi “katika” kikihifadhi wazo la mwenendo ndani ya mazingira hayo.
- source_word: καὶ ὑμεῖς
  choice: ninyi pia
  rationale: “Ninyi” linahifadhi msisitizo wa kiwakilishi cha Kigiriki, na “pia” linaonyesha kwamba Wakolosai wenyewe walishiriki hapo zamani katika mwenendo huo.
- source_word: περιεπατήσατε
  choice: mlienenda
  rationale: Kitenzi hiki kinahifadhi sitiari ya kutembea kama mwenendo wa maisha, na pia kinakitofautisha na ἐζῆτε (“mlipokuwa mkiishi”) inayofuata.
- source_word: ποτε
  choice: wakati fulani
  rationale: Maneno haya yanaonyesha kipindi cha zamani kisichotajwa kwa usahihi, kwa njia ya kawaida na inayoeleweka katika Kiswahili.
- source_word: ὅτε
  choice: mlipokuwa
  rationale: Muundo huu unaunganisha kwa kawaida tendo la zamani na hali ya maisha iliyokuwa ikiendelea wakati huo.
- source_word: ἐζῆτε
  choice: mlipokuwa mkiishi
  rationale: Muundo wa kuendelea unaakisi hali endelevu ya wakati uliopita na kudumisha tofauti na sitiari ya “mlienenda.”
- source_word: ἐν τούτοις
  choice: ndani yake
  rationale: Kiwakilishi hiki kinarejelea mambo maovu yaliyotajwa, kinaepusha urudiaji mzito, na kinaonyesha kwamba mambo hayo yalikuwa mazingira ya maisha yao ya zamani.
theological_decisions:
- issue: Uhusiano kati ya “mlienenda” na “mlipokuwa mkiishi” katika maelezo ya kimaadili ya Paulo
  choice: Kudumisha tofauti kati ya mwenendo wa zamani (“mlienenda”) na hali au mazingira ya maisha ya zamani (“mlipokuwa mkiishi ndani yake”).
  alternative: Kutafsiri vitenzi vyote viwili kwa maana ileile ya “kuishi.”
  rationale: Tofauti hii inafuata vitenzi viwili tofauti vya Kigiriki, περιπατέω na ζάω, bila kuongeza dai la kimafundisho lisilokuwamo katika mstari.
- issue: Rejeo la ἐν οἷς
  choice: Kulihusisha hasa na mambo au matendo maovu yaliyotajwa kabla.
  alternative: Kulihusisha na watu waliotajwa kabla na kutafsiri “miongoni mwao.”
  rationale: Muktadha wa karibu na kifungu cha mwisho ἐν τούτοις vinaunga mkono rejeo la matendo hayo, lakini umbo la Kigiriki linaweza pia kueleweka likirejelea watu; kwa hiyo uwezekano huo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa na yenye heshima. “Mlienenda” limetumiwa kuhifadhi sitiari ya Paulo, huku “mlipokuwa mkiishi” likidumisha tofauti ya vitenzi vya Kigiriki.
