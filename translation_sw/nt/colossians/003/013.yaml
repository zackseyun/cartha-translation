  yaml_path: translation/nt/colossians/003/013.yaml
  text: bearing with one another and forgiving each other[a], if anyone has a complaint against anyone; just as the Lord also forgave you[b], so also you must do.
translation:
  language: sw
  text: Mkivumiliana na kusameheana, ikiwa yeyote ana lalamiko dhidi ya mwingine[a]; kama vile Bwana alivyowasamehe ninyi, vivyo hivyo nanyi fanyeni.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ikiwa yeyote ana sababu ya kumlaumu mwingine.”
    reason: lexical_alternative
  - marker: b
    text: Kigiriki kinaishia kwa maneno “vivyo hivyo nanyi,” huku tendo la kusamehe likieleweka kutokana na muktadha.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνεχόμενοι ἀλλήλων
  choice: mkichukuliana
  rationale: Kitenzi hiki kinaonyesha kuendelea kuvumiliana kwa subira katika mahusiano. ‘Kuchukuliana’ ni Kiswahili cha kawaida na chenye heshima, bila ukali wa ‘kustahimiliana.’
- source_word: χαριζόμενοι ἑαυτοῖς
  choice: kusameheana
  rationale: Katika muktadha huu χαρίζομαι humaanisha kuondoleana kosa. Umbo la kutendeana linaonyesha wazi tendo la pande zote katika jumuiya.
- source_word: ἐάν τις πρός τινα ἔχῃ μομφήν
  choice: ikiwa yeyote ana lalamiko dhidi ya mwingine
  rationale: Huhifadhi hali ya jumla na isiyoainishwa ya sharti hilo. ‘Lalamiko’ linaeleza sababu ya kumlaumu mtu bila kulifanya kuwa shtaka rasmi.
- source_word: καθὼς καὶ
  choice: kama vile ... vivyo hivyo
  rationale: Muundo huu unaonyesha ulinganisho kati ya msamaha wa Bwana na wajibu wa waamini kusameheana.
- source_word: ὁ κύριος
  choice: Bwana
  rationale: Huhifadhi cheo cha κύριος bila kumtaja mhusika kwa ufafanuzi unaozidi maandishi ya Kigiriki.
- source_word: ἐχαρίσατο
  choice: alivyowasamehe
  rationale: Hutoa maana ya moja kwa moja ya msamaha katika muktadha huu na kudumisha uhusiano wa kimaanana na ‘kusameheana’ katika kishazi cha kwanza.
- source_word: οὕτως καὶ ὑμεῖς
  choice: vivyo hivyo nanyi mnapaswa kufanya
  rationale: Kigiriki kinaacha kitenzi kieleweke kutokana na muktadha. Kiswahili huhitaji ukamilisho wa kawaida zaidi; ‘kufanya’ hurejelea tendo la kusamehe bila kurudia neno hilo katika mstari mkuu.
theological_decisions:
- issue: Mhusika anayerejelewa na ὁ κύριος
  choice: Kutafsiri kwa cheo ‘Bwana’ bila kuongeza ‘Kristo’
  alternative: Kumtaja wazi Kristo au kuelewa kwa ujumla kuwa ni Mungu
  rationale: Katika matumizi ya Paulo hapa, yaelekea cheo hiki kinamrejelea Kristo, lakini maandishi yenyewe yanasema tu ‘Bwana.’ Tafsiri inadumisha kiwango hicho cha ubainifu.
- issue: Kitenzi kilichoachwa katika οὕτως καὶ ὑμεῖς
  choice: Kukamilisha kwa ‘mnapaswa kufanya’ na kueleza udondoshaji katika tanbihi
  alternative: Kuandika wazi ‘nanyi sameheni’ au kuacha ‘vivyo hivyo nanyi’
  rationale: Kigiriki huacha tendo likieleweka kutokana na muktadha. Ukamilisho uliochaguliwa ni wa kawaida kwa Kiswahili, huku tanbihi ikihifadhi taarifa ya muundo mfupi wa chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa ‘mkichukuliana na kusameheana’ unaendeleza mtiririko wa mawaidha kutoka muktadha uliotangulia. ‘Ninyi’ baada ya ‘aliwasamehe’ kimakusudi inasisitiza kiwakilishi cha Kigiriki ὑμῖν.
