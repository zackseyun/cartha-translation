  terminology: Bwana, kusameheana, lalamiko, na vivyo hivyo ni chaguo sahihi kwa muktadha na rejesta. “Sababu ya kumlaumu” katika tanbihi hutoa mbadala wa karibu wa μομφή bila kuimarisha maana kuwa kinyongo cha ndani.
