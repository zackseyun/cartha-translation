lexical_decisions:
- source_word: μὴ ψεύδεσθε
  choice: Msiambiane uongo
  rationale: Ni katazo la moja kwa moja na la kawaida katika Kiswahili; linaonyesha wazi kwamba tendo hilo linaelekezwa kwa wengine.
- source_word: εἰς ἀλλήλους
  choice: -ambiane
  rationale: Kiambishi cha kutendeana kinaingiza kwa njia ya asili maana ya ‘ninyi kwa ninyi’ bila kurudia maneno yasiyohitajika.
- source_word: ἀπεκδυσάμενοι
  choice: kwa kuwa mmejivua
  rationale: ‘Mmejivua’ huhifadhi taswira ya kuvua vazi na hali ya tendo lililokamilika; ‘kwa kuwa’ linaonyesha uwezekano mkubwa kwamba kirai shirikishi kinatoa msingi wa katazo.
- source_word: τὸν παλαιὸν ἄνθρωπον
  choice: mtu wa kale
  rationale: Huhifadhi umoja na taswira ya Paulo ya ‘mtu wa kale,’ pamoja na ulinganifu wake na ‘mtu mpya’ katika mstari unaofuata.
- source_word: σὺν ταῖς πράξεσιν αὐτοῦ
  choice: pamoja na matendo yake
  rationale: ‘Pamoja na’ huonyesha uandamani, na ‘matendo’ huwasilisha mwenendo unaotokana na mtu wa kale; ‘yake’ hurejelea kwa kawaida nomino hiyo katika Kiswahili.
theological_decisions:
- issue: Maana ya τὸν παλαιὸν ἄνθρωπον
  choice: mtu wa kale
  alternative: utu wa kale / nafsi ya zamani
  rationale: Tafsiri kuu inadumisha taswira ya kiantropolojia na uhusiano wake na ‘mtu mpya,’ huku tanbihi ikitoa namna za kufafanua maana bila kuzifanya kuwa tafsiri pekee.
- issue: Uhusiano wa kisarufi wa ἀπεκδυσάμενοι na katazo
  choice: kwa kuwa mmejivua
  alternative: mkiwa mmejivua / baada ya kujivua
  rationale: Kirai shirikishi kinaelekea kutoa msingi wa agizo, lakini Kigiriki pia kinaweza kuachwa katika muundo usioeleza wazi kama ni sababu au wakati; tanbihi inahifadhi uwezekano huo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Msiambiane uongo’ ni cha kawaida na wazi; ‘mmejivua mtu wa kale’ kwa makusudi huhifadhi taswira ya vazi na usemi wa chanzo, ingawa ni wa kifasihi zaidi kuliko ‘mmeacha utu wa kale.’
