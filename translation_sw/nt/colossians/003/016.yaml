reference: Colossians 3:16
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὁ λόγος τοῦ Χριστοῦ ἐνοικείτω ἐν ὑμῖν πλουσίως ἐν πάσῃ σοφίᾳ· διδάσκοντες καὶ νουθετοῦντες ἑαυτοὺς ⸀ψαλμοῖς, ⸀ὕμνοις, ᾠδαῖς πνευματικαῖς ⸀ἐν χάριτι, ᾄδοντες ἐν ⸂ταῖς καρδίαις⸃ ὑμῶν τῷ ⸀θεῷ·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/016.yaml
  text: Let the word of Messiah dwell in you richly in all wisdom[a], teaching and admonishing one another with psalms, hymns, and spiritual songs[b], singing with grace in your hearts to God.
translation:
  language: sw
  text: Neno la Masihi na likae kwa wingi ndani yenu[a] kwa hekima yote; mkifundishana na kuonyana kwa zaburi, nyimbo za sifa, na nyimbo za kiroho, huku mkimwimbia Mungu kwa shukrani[b] mioyoni mwenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “miongoni mwenu.” Kiwakilishi cha Kigiriki ni cha wingi; kinaweza kusisitiza neno kukaa ndani ya jumuiya kwa pamoja au ndani ya waamini mmoja mmoja.
    reason: alternative_reading
  - marker: b
    text: Au “kwa neema.” Neno la Kigiriki linaweza kumaanisha neema, namna ya neema, au shukrani katika muktadha huu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λόγος τοῦ Χριστοῦ
  choice: Neno la Masihi
  rationale: “Neno” linahifadhi upana wa λόγος, yaani ujumbe au mafundisho yanayohusiana na Masihi. “Masihi” linawasilisha Χριστός kama cheo, huku muundo “la Masihi” ukiacha wazi kama ni neno litokalo kwake au linalomhusu.
- source_word: ἐνοικείτω ἐν ὑμῖν πλουσίως
  choice: na likae kwa wingi ndani yenu
  rationale: “Likae” linahifadhi sitiari ya kukaa ndani na nguvu ya amri inayoendelea. “Ndani yenu” ni tafsiri ya moja kwa moja ya ἐν ὑμῖν, ambayo inaweza kueleweka kwa waamini mmoja mmoja au kwa jumuiya nzima.
- source_word: ἐν πάσῃ σοφίᾳ
  choice: kwa hekima yote
  rationale: Muundo huu ni wa kawaida katika Kiswahili na hauamui kwa lazima kama hekima inahusishwa zaidi na kukaa kwa neno au na kufundisha na kuonya kunakofuata.
- source_word: διδάσκοντες καὶ νουθετοῦντες ἑαυτούς
  choice: mkifundishana na kuonyana
  rationale: Vitenzi vya kutendeana vinaonyesha tendo la pande mbili ndani ya jumuiya. “Kuonyana” linahifadhi wazo la maelekezo yenye kusahihisha katika νουθετέω.
- source_word: ψαλμοῖς, ὕμνοις, ᾠδαῖς πνευματικαῖς
  choice: kwa zaburi, nyimbo za sifa, na nyimbo za kiroho
  rationale: Aina tatu za nyimbo zimetofautishwa. “Nyimbo za sifa” ni usemi unaoeleweka kwa ὕμνοις, na kivumishi πνευματικαῖς kimeunganishwa na “nyimbo” kama ilivyo katika Kigiriki.
- source_word: ἐν χάριτι
  choice: kwa neema
  rationale: Tafsiri hii inahifadhi maana ya msingi ya χάρις na pia mvutano wa kimuktadha kati ya neema, hali ya kupendeza, na shukrani; maana ya shukrani imeonyeshwa katika tanbihi.
- source_word: ᾄδοντες ἐν ταῖς καρδίαις ὑμῶν τῷ θεῷ
  choice: huku mkimwimbia Mungu ... mioyoni mwenu
  rationale: “Huku mkimwimbia” linaonyesha tendo linaloambatana na kufundishana na kuonyana. “Mioyoni mwenu” linahifadhi lugha ya ndani ya Kigiriki.
theological_decisions:
- issue: Maana ya Χριστοῦ
  choice: Masihi
  alternative: Kristo
  rationale: Hapa Χριστός linafanya kazi kama cheo. “Masihi” linaonyesha wazi maana ya cheo hicho na muktadha wake wa Kiyahudi bila kuongeza fundisho la dhehebu.
- issue: Nguvu ya kijumuiya au ya kibinafsi ya ἐν ὑμῖν
  choice: ndani yenu
  alternative: miongoni mwenu
  rationale: Kiwakilishi ni cha wingi, na muktadha unahusu matendo ya pamoja. “Ndani yenu” linafuata Kigiriki kwa karibu na linaacha uwezekano wa neno kukaa ndani ya kila mwamini na ndani ya jumuiya kwa pamoja; tanbihi inaeleza mvutano huo.
- issue: Maana ya ἐν χάριτι
  choice: kwa neema
  alternative: kwa shukrani
  rationale: χάρις linaweza kumaanisha neema au shukrani katika muktadha huu. Maandishi makuu yanahifadhi neno lenye upana zaidi, na tanbihi inatoa maana nyingine inayowezekana.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inadumisha sitiari ya neno kukaa ndani, lugha ya ushirika wa waamini, na utata halisi wa “kwa neema” bila kuufafanua kupita kiasi.
