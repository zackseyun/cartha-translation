lexical_decisions:
- source_word: ὃ ἐὰν ποιῆτε
  choice: Lolote mfanyalo
  rationale: Muundo huu unaonyesha jambo lolote bila kulibainisha. “Lolote mfanyalo” ni Kiswahili cha kawaida na huhifadhi maana ya jumla ya neno la Kigiriki.
- source_word: ἐκ ψυχῆς
  choice: kwa moyo wote
  rationale: Kihalisi ni “kutoka nafsini,” lakini katika muktadha huu msemo unaonyesha unyofu wa ndani na kujitoa kikamilifu. “Kwa moyo wote” huwasilisha maana hiyo kwa Kiswahili cha asili huku tanbihi ikihifadhi taswira halisi.
- source_word: ἐργάζεσθε
  choice: lifanyeni
  rationale: Kitenzi hiki ni agizo la kutenda au kufanya kazi kwa bidii. “Lifanyeni” linarejelea kwa urahisi “lolote” na huepuka uzito usio wa lazima wa kurudia “fanyeni kazi” katika Kiswahili.
- source_word: ὡς
  choice: kama kwa
  rationale: 'Hutambulisha mtazamo au namna ya kutenda: kazi inapaswa kufanywa kama jambo linalofanywa kwa ajili ya Bwana.'
- source_word: τῷ κυρίῳ
  choice: kwa Bwana
  rationale: “Bwana” huhifadhi cheo cha κύριος na katika muktadha huu kwa kawaida humrejelea Kristo. Herufi kubwa inasaidia kuonyesha rejeo hilo bila kufuta kivuli cha maana ya mwenye mamlaka.
- source_word: ἀνθρώποις
  choice: wanadamu
  rationale: Neno la Kigiriki linawahusu wanadamu kwa jumla, si wanaume pekee. “Wanadamu” huhifadhi wazi utofautishaji kati ya Bwana na viumbe wa kibinadamu.
theological_decisions:
- issue: Maana ya κύριος katika maagizo ya watu wa nyumbani
  choice: Bwana
  alternative: bwana au mwenye mamlaka
  rationale: Ingawa muktadha unahusu watumwa na mabwana, κύριος hapa inaeleweka kwa kawaida kuwa cheo cha Kristo. Tafsiri “Bwana” inadumisha hilo, huku tanbihi ikitaja kivuli cha maana kinachotokana na muktadha wa mamlaka.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo “Lolote mfanyalo” ni wa kifasihi kiasi na unaofaa kwa maandiko; “kwa moyo wote” ni nahau ya sasa na ya kawaida. Alama zote za tanbihi zimewekwa moja kwa moja baada ya maneno husika.
