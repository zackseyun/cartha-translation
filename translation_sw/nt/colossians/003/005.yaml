  text: Νεκρώσατε οὖν τὰ ⸀μέλη τὰ ἐπὶ τῆς γῆς, πορνείαν, ἀκαθαρσίαν, πάθος, ἐπιθυμίαν κακήν, καὶ τὴν πλεονεξίαν ἥτις ἐστὶν εἰδωλολατρία,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/005.yaml
  text: 'Therefore[a], put to death the members that are on the earth: sexual immorality, impurity, passion, evil desire, and greed[b], which is idolatry.'
translation:
  language: sw
  text: 'Kwa hiyo, vifisheni viungo vyenu vilivyo duniani[a]: uasherati, uchafu, tamaa, hamu mbaya, na pupa[b], ambayo ni ibada ya sanamu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mambo yoyote ya kidunia yaliyo ndani yenu.” Kigiriki kinasema kihalisi zaidi, “viungo vilivyo duniani.”
    reason: lexical_alternative
  - marker: b
    text: Au, “uchu wa kutaka zaidi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Νεκρώσατε
  choice: viangamizeni
  rationale: Amri hii ya wakati aoristi inadai hatua thabiti ya kuvifanya vife. Kwa kuwa neno linalofuata ni “viungo,” “viangamizeni” ni la kawaida na lenye nguvu katika Kiswahili kuliko tafsiri ya neno kwa neno “vifisheni.”
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Inaonyesha hitimisho linalotokana na hoja iliyotangulia.
- source_word: μέλη
  choice: viungo
  rationale: Huhifadhi sitiari halisi ya viungo vya mwili bila kuibadili kuwa dhana kama “asili ya kidunia.”
- source_word: τὰ ἐπὶ τῆς γῆς
  choice: vilivyo duniani
  rationale: Huhifadhi taswira ya mahali katika Kigiriki na kuacha wazi maana yake ya kisitiari.
- source_word: πορνείαν
  choice: uasherati
  rationale: Ni neno la kawaida la kibiblia kwa mwenendo mpana wa ngono usio halali, ingawa katika matumizi fulani ya sasa linaweza kueleweka kwa maana nyembamba; hapa muktadha na orodha huonyesha uovu wa kingono kwa upana.
- source_word: ἀκαθαρσίαν
  choice: uchafu
  rationale: Huwakilisha hali ya kutokuwa safi kimaadili na ni fupi, ya kawaida, na yenye upana unaofaa.
- source_word: πάθος
  choice: tamaa
  rationale: Katika orodha hii ya maovu neno humaanisha hisia au shauku kali isiyodhibitiwa; “tamaa” ni ya asili katika Kiswahili.
- source_word: ἐπιθυμίαν κακήν
  choice: hamu mbaya
  rationale: Hutofautisha kirai hiki na πάθος huku ikihifadhi wazi sifa ya kimaadili κακήν, “mbaya.”
- source_word: πλεονεξίαν
  choice: pupa
  rationale: Huonyesha hamu ya kujipatia zaidi kwa kujilimbikizia; ni ya sasa na pana kuliko “uchoyo” pekee.
- source_word: ἥτις ἐστὶν εἰδωλολατρία
  choice: ambayo ni ibada ya sanamu
  rationale: Kiwakilishi cha umoja kinarejelea kwa kawaida nomino ya karibu “pupa,” na kauli ya moja kwa moja huhifadhi mkazo wa Paulo.
theological_decisions:
- issue: Kirejelewa cha “ambayo ni ibada ya sanamu”
  choice: Kishazi kinarejelea hasa “pupa.”
  alternative: Kishazi kinaweza kueleweka kuwa muhtasari wa orodha nzima ya maovu.
  rationale: ἥτις ni kiwakilishi cha kike cha umoja kinachopatana kwa karibu zaidi na πλεονεξίαν, nomino ya kike ya umoja iliyo mara moja kabla yake. Kiswahili “ambayo” pia huonyesha kwa kawaida rejeo hilo bila kuongeza ufafanuzi wa kimadhehebu.
- issue: Maana ya “viungo vilivyo duniani”
  choice: Sitiari ya viungo imehifadhiwa katika maandishi makuu.
  alternative: “Mambo ya kidunia yaliyo ndani yenu” au “asili yenu ya kidunia.”
  rationale: Kigiriki kinasema “viungo,” na majina yanayofuata yanaweza kuvifafanua kwa kuviweka sambamba. Kutumia “asili” kungetatua sitiari kwa namna isiyoelezwa wazi katika chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sitiari umehifadhiwa, na tanbihi hutoa maana mbadala ya kifafanuzi. Alama zote za tanbihi [a] na [b] zimo katika maandishi makuu.
