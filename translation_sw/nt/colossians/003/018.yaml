  yaml_path: translation/nt/colossians/003/018.yaml
  text: Wives[a], submit yourselves to your husbands[b], as is fitting in the Lord.
translation:
  language: sw
  text: Enyi wake, jitiisheni kwa waume zenu, kama inavyofaa katika Bwana.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γυναῖκες
  choice: wake
  rationale: Katika muktadha wa maagizo ya nyumbani na kwa kulinganishwa na ἀνδράσιν, neno hili linamaanisha wanawake walio katika ndoa, yaani wake.
- source_word: ὑποτάσσεσθε
  choice: watiini
  rationale: Kitenzi cha amri kinaeleza kujiweka chini ya mamlaka katika uhusiano huu. ‘Watiini’ ni Kiswahili cha kawaida na chenye heshima, bila kutoa wazo la kulazimishwa ambalo halijaelezwa wazi hapa.
- source_word: ἀνδράσιν
  choice: waume zenu
  rationale: Katika jozi hii ya kifamilia, ἀνήρ humaanisha ‘mume,’ si wanaume kwa ujumla; ‘zenu’ huonyesha wazi uhusiano unaokusudiwa.
- source_word: ὡς
  choice: kama
  rationale: Neno hili linaanzisha kipimo cha kinachofaa, wala si sababu ya moja kwa moja.
- source_word: ἀνῆκεν
  choice: inavyofaa
  rationale: 'Ingawa umbo la Kigiriki ni la wakati uliopita usiotimilika, katika kauli hii ya maadili lina maana ya jumla ya wakati wa sasa: jambo linalofaa au linalostahili.'
- source_word: ἐν κυρίῳ
  choice: katika Bwana
  rationale: Tafsiri hii ya karibu na asili huhifadhi kwamba kufaa kwa agizo hilo kumefungamanishwa na uhusiano na Bwana.
theological_decisions:
- issue: Upeo na msingi wa agizo
  choice: ‘kama inavyofaa katika Bwana’
  alternative: Kulitoa kama desturi ya kijamii isiyo na mpaka wa kiteolojia, au kuhusisha ‘katika Bwana’ na wake pekee
  rationale: Mpangilio wa Kigiriki unaunganisha ἐν κυρίῳ na kauli kuhusu kufaa. Tafsiri huhifadhi sifa hii ya kiteolojia bila kuipanua kwa maelezo yasiyomo katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Enyi wake’ huonyesha wito wa moja kwa moja wa wingi; ‘watiini’ ni amri iliyo wazi na ya kawaida. Hakuna tanbihi iliyoongezwa kwa kuwa tofauti za kileksika zinaweza kuhifadhiwa katika taarifa za uhariri bila kuvuruga mstari mfupi.
