  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Τὰ τέκνα, ὑπακούετε τοῖς γονεῦσιν κατὰ πάντα, τοῦτο γὰρ ⸂εὐάρεστόν ἐστιν⸃ ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/020.yaml
  text: Children[a], obey your parents in everything[b], for this is pleasing in the Lord.
translation:
  language: sw
  text: Watoto, watiini wazazi wenu katika mambo yote, kwa maana jambo hili linapendeza[a] katika Bwana.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “linakubalika.”
    reason: lexical_alternative
  - marker: b
    text: “Katika Bwana” linaweza kueleweka kuwa jambo hili linapendeza ndani ya uhusiano wa mtu na Bwana, badala ya kumaanisha tu “linampendeza Bwana.”
    reason: alternative_reading
lexical_decisions:
- source_word: Τὰ τέκνα
  choice: Watoto
  rationale: τέκνα ni neno la kawaida linalowataja watoto au wazao bila kuwahusu wana wa kiume pekee; “Watoto” ni mwito wa moja kwa moja na wa kawaida katika Kiswahili.
- source_word: ὑπακούετε
  choice: watiini
  rationale: Kitenzi hiki cha amri kina maana ya kutii au kufuata mamlaka; “watiini” kinaonyesha wazi nguvu ya agizo katika uhusiano wa watoto na wazazi.
- source_word: τοῖς γονεῦσιν
  choice: wazazi wenu
  rationale: γονεῦσιν humaanisha wazazi. Kiwakilishi “wenu” kinaeleweka kutokana na mwito kwa watoto na hufanya sentensi iwe ya kawaida katika Kiswahili.
- source_word: κατὰ πάντα
  choice: katika mambo yote
  rationale: Kirai hiki kinaonyesha upeo wa utii, yaani katika kila jambo, wala si maana ya wakati kama “sikuzote.”
- source_word: τοῦτο
  choice: jambo hili
  rationale: τοῦτο hurejelea agizo la kutii lililotangulia. “Jambo hili” huhifadhi urejeleo huo kwa Kiswahili cha kawaida.
- source_word: γὰρ
  choice: kwa maana
  rationale: γάρ huanzisha sababu ya agizo; “kwa maana” huonyesha uhusiano huo wa maelezo kwa uwazi.
- source_word: εὐάρεστόν ἐστιν
  choice: linapendeza
  rationale: εὐάρεστος huonyesha jambo linalopendeza au kukubalika. “Linapendeza” ni la kawaida na huhifadhi maana ya tathmini bila kuongeza mhusika ambaye hajatajwa wazi.
- source_word: ἐν κυρίῳ
  choice: katika Bwana
  rationale: 'Tafsiri hii huhifadhi kirai cha kawaida cha Paulo na pia kutokamilika kwake kwa kimakusudi: kinaweza kuonyesha hali au uhusiano ndani ya Bwana, badala ya kukifupisha kuwa “kwa Bwana” pekee.'
theological_decisions:
- issue: Upeo wa “katika mambo yote” kwa kuhusishwa na “katika Bwana”
  choice: Vishazi vyote viwili vimehifadhiwa bila kuongeza sharti au kauli ya kuvitenganisha.
  alternative: Kutafsiri “katika Bwana” kama kikomo cha moja kwa moja cha utii, au kama “kwa sababu jambo hili linampendeza Bwana.”
  rationale: Kiyunani hakiongezi wazi kifungu cha ubaguzi baada ya “katika mambo yote,” wala hakifungi kisarufi “katika Bwana” moja kwa moja na amri ya kutii. Tafsiri hiyo huhifadhi mvutano na utata wa maandishi badala ya kuamua suala la kimaadili au kiteolojia ndani ya tafsiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo wa moja kwa moja wa agizo umehifadhiwa, huku “jambo hili” likifanya urejeleo wa τοῦτο uwe wa kawaida katika Kiswahili.
