  text: knowing that from the Lord you will receive the reward of the inheritance[b][a]. Serve the Lord Messiah.
translation:
  language: sw
  text: mkijua kwamba mtapokea kutoka kwa Bwana thawabu ya urithi. Mnamtumikia Bwana Masihi.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kitenzi cha Kigiriki kinaweza kusomwa kama hali elezi, “mnamtumikia,” au kama amri, “mtumikieni.”
    reason: lexical_alternative
  - marker: b
    text: Au, kwa tafsiri iliyozoeleka zaidi, “Bwana Kristo.”
    reason: alternative_reading
lexical_decisions:
- source_word: εἰδότες
  choice: mkijua
  rationale: Huhifadhi umbo la kitenzi-shirikishi na uhusiano wake na himizo la mstari uliotangulia bila kulazimisha maana ya sababu.
- source_word: ἀπὸ κυρίου
  choice: kutoka kwa Bwana
  rationale: ἀπό pamoja na hali ya umilikishi huonyesha chanzo; thawabu inatoka kwa Bwana.
- source_word: ἀπολήμψεσθε
  choice: mtapokea
  rationale: Ni kitenzi cha wakati ujao kinachoeleza kupokea; wazo la kupokea malipo linabebwa pia na neno “thawabu.”
- source_word: ἀνταπόδοσιν
  choice: thawabu
  rationale: Neno hili huonyesha malipo au ujira unaotolewa kwa kulingana na tendo; “thawabu” ni la kawaida, wazi, na linafaa katika muktadha huu chanya.
- source_word: τῆς κληρονομίας
  choice: ya urithi
  rationale: Huhifadhi kwa ufupi uhusiano wa kihusishi katika Kigiriki bila kuamua wazi ikiwa thawabu ni urithi wenyewe au thawabu inayohusiana na urithi.
- source_word: τῷ κυρίῳ Χριστῷ
  choice: Bwana Masihi
  rationale: Χριστός limetumiwa kama cheo; “Masihi” huonyesha wazi maana ya Mpakwa-Mafuta, huku κύριος likitafsiriwa “Bwana.”
- source_word: δουλεύετε
  choice: mnamtumikia
  rationale: Ni hali elezi ya sasa, nafsi ya pili wingi, si umbo la amri. Tafsiri hii huiweka kama ukumbusho unaohimiza.
theological_decisions:
- issue: Maana ya Χριστῷ katika kirai cha kikristolojia
  choice: Masihi
  alternative: Kristo
  rationale: Katika kirai hiki Χριστός lina nguvu ya cheo; “Masihi” huhifadhi maana hiyo badala ya kulifanya lionekane kama jina tu.
- issue: Nguvu ya δουλεύετε
  choice: 'hali elezi: “mnamtumikia”'
  alternative: 'amri: “mtumikieni”'
  rationale: Umbo la Kigiriki ni hali elezi ya sasa. Ingawa muktadha wake una nguvu ya kuhimiza, tafsiri haipaswi kulibadili kimyakimya kuwa amri.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Mpangilio “kutoka kwa Bwana” umewekwa mapema ili chanzo cha thawabu kiwe wazi, huku “thawabu ya urithi” ikihifadhi ufupi na utata halisi wa Kigiriki.
