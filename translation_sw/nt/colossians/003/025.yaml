  yaml_path: translation/nt/colossians/003/025.yaml
  text: For the wrongdoer will be repaid for what he has done wrong[b][a], and there is no partiality.
translation:
  language: sw
  text: Kwa maana, atendaye mabaya atalipwa kwa yale mabaya aliyotenda[a], wala hakuna upendeleo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “atarudishiwa yale mabaya aliyotenda.”
    reason: lexical_alternative
  - marker: b
    text: Au, “hakuna ubaguzi”; kwa neno kwa neno, “hakuna kupokea uso,” yaani, hakuna kuhukumu kwa kuzingatia hadhi au hali ya nje.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ γὰρ ἀδικῶν
  choice: Kwa maana, anayetenda mabaya
  rationale: Kirai cha Kigiriki kinamtaja kwa ujumla mtu yeyote anayetenda isivyo haki. “Kwa maana” linawakilisha γάρ kama kiunganishi cha kutoa sababu, na “anayetenda mabaya” ni Kiswahili cha kawaida kinachohifadhi hali endelevu ya kitenzi cha wakati uliopo.
- source_word: κομίσεται
  choice: atapokea malipo
  rationale: Katika muktadha huu kitenzi kina maana ya kupokea kile kinachomstahili mtu kama matokeo ya matendo yake. “Atapokea malipo” linaonyesha wazo la kulipwa kwa mujibu wa tendo bila kumtaja wazi anayelipa, ambaye maandishi ya Kigiriki hayamtaji.
- source_word: ὃ ἠδίκησεν
  choice: ya mabaya aliyotenda
  rationale: Kirai hiki kinarejelea ubaya ambao mtu huyo alitenda. Muundo huu ni wa asili katika Kiswahili na unadumisha uhusiano wa kimatamshi na ἀδικῶν.
- source_word: οὐκ ἔστιν προσωπολημψία
  choice: wala hakuna upendeleo
  rationale: προσωπολημψία ni kumpendelea mtu kwa kuzingatia hadhi au hali yake ya nje. “Upendeleo” ni neno la sasa, lenye heshima na linaloeleweka kwa urahisi.
- source_word: implicit generic masculine in ὁ ... ἀδικῶν / ἠδίκησεν
  choice: anaye- / aliye-
  rationale: Kiswahili hakihitaji kiwakilishi cha kijinsia hapa. Ngeli ya mtu katika “anayetenda” na “aliyotenda” huhifadhi umoja na maana ya jumla bila kuingiza jinsia isiyolazimishwa na matumizi ya kawaida ya Kiswahili.
theological_decisions:
- issue: Asili ya hukumu na kutokuwapo kwa upendeleo
  choice: Mstari unaeleza kanuni ya malipo yasiyo na upendeleo bila kubainisha kikamilifu namna au wakati wa hukumu.
  alternative: Kuifanya kauli ihusu hukumu ya mwisho pekee, au kuifungia tu katika mahusiano kati ya mabwana na watumwa.
  rationale: Maneno ya Kigiriki ni mapana. Tafsiri inadumisha onyo hilo la kimaadili na kitheolojia bila kulipunguza hadi mazingira au wakati ambao mstari wenyewe hautaji wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni fupi na ya moja kwa moja; “mabaya” huepuka usemi mzito usio wa kawaida, huku “upendeleo” likihifadhi uzito wa onyo.
