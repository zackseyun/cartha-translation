review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly renders the explanatory γάρ, the generic articular participle, the future recompense, and the assertion that there is no προσωπολημψία. However, “atapokea malipo ya mabaya” is semantically and idiomatically less precise: it can suggest receiving payments that are themselves evil, rather than receiving recompense for wrongs committed.'
  naturalness: “Kwa maana, atendaye mabaya atalipwa kwa yale mabaya aliyotenda” is more natural and direct in Standard East African Swahili. It conveys the judicial/retributive force of κομίσεται without specifying the agent, timing, or mechanism of repayment.
  terminology: “Upendeleo” is an appropriate modern rendering of προσωπολημψία. The footnote can offer “ubaguzi” as a usable alternative and explain the literal idiom without treating the literal phrase as normal Swahili.
  issues:
  - severity: medium
    issue: “atapokea malipo ya mabaya aliyotenda” is awkward and may be misconstrued.
    rationale: The Greek says that the wrongdoer will receive recompense for the wrong done. In Swahili, “malipo ya mabaya” can be read as ‘payment(s) of evil things’ rather than ‘payment for evil done.’ “Atalipwa kwa yale mabaya aliyotenda” clearly preserves the intended relation.
  revised_text: Kwa maana, atendaye mabaya atalipwa kwa yale mabaya aliyotenda[a], wala hakuna upendeleo[b].
