  to: Kwa maana, atendaye mabaya atalipwa kwa yale mabaya aliyotenda[a], wala hakuna upendeleo[b].
  rationale: The revision replaces an ambiguous Swahili expression for recompense with an idiomatic formulation that faithfully conveys future retribution for wrongdoing. It retains the generic scope, does not identify the agent of recompense, and preserves the broad statement of impartiality.
