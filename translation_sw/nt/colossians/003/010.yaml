  text: na mmevaa mtu mpya[a], ambaye anafanywa upya ili kufikia ujuzi[b], kwa sura ya yule aliyemuumba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “utu mpya.” Usemi wa Kigiriki unatofautisha mtu au utu mpya na mtu wa zamani katika muktadha unaozunguka.
