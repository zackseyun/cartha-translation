lexical_decisions:
- source_word: ἐνδυσάμενοι
  choice: mmevaa
  rationale: Huhifadhi sitiari ya kuvaa na huonyesha tendo lililotimizwa ambalo linaunganishwa na muktadha uliotangulia.
- source_word: τὸν νέον
  choice: mtu mpya
  rationale: Kivumishi hiki kimetumiwa kama nomino na kinatofautishwa na ‘mtu wa zamani’ katika muktadha. ‘Mtu mpya’ huhifadhi taswira ya kibinadamu na upatanifu wa kisarufi na αὐτόν.
- source_word: ἀνακαινούμενον
  choice: anayefanywa mpya
  rationale: Huhifadhi hali ya kutendwa na maana ya mchakato unaoendelea katika kauli ya sasa.
- source_word: εἰς ἐπίγνωσιν
  choice: ili afikie ujuzi
  rationale: ‘Afikie’ huonyesha mwelekeo au matokeo yanayodokezwa na εἰς, bila kulazimisha maana ya ‘ujuzi kamili’ katika matini kuu.
- source_word: κατ’ εἰκόνα
  choice: kwa mfano wa
  rationale: Hueleza kufanana au kupatana na kielelezo na kudumisha mwangwi unaowezekana wa lugha ya sura ya Mungu katika Mwanzo.
- source_word: τοῦ κτίσαντος αὐτόν
  choice: yule aliyemuumba
  rationale: Hufuata muundo wa kishiriki cha Kigiriki na kuhusisha kiwakilishi cha kiume na ‘mtu mpya’ bila kuficha kwamba Muumba ni nafsi.
theological_decisions:
- issue: Maana ya kiantropolojia ya τὸν νέον
  choice: mtu mpya
  alternative: utu mpya
  rationale: ‘Mtu mpya’ hufuata kwa karibu usemi wa Kigiriki na tofauti yake na mtu wa zamani, huku tanbihi ikihifadhi tafsiri ya dhana ya hali au asili mpya.
- issue: Nguvu ya maana ya ἐπίγνωσις
  choice: ujuzi
  alternative: ujuzi kamili
  rationale: Neno linaweza kudokeza ujuzi kamili au wa kina zaidi, lakini kuongeza ‘kamili’ katika matini kuu kungeweza kufafanua zaidi ya ilivyo wazi katika neno lenyewe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka. Muundo unadumisha sitiari ya kuvaa, hali ya kutendwa katika kufanywa mpya, na mwelekeo unaoonyeshwa na εἰς.
