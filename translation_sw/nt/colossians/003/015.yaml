  text: καὶ ἡ εἰρήνη τοῦ ⸀Χριστοῦ βραβευέτω ἐν ταῖς καρδίαις ὑμῶν, εἰς ἣν καὶ ἐκλήθητε ἐν ἑνὶ σώματι· καὶ εὐχάριστοι γίνεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/015.yaml
  text: And let the peace of Messiah rule in your hearts[a], to which indeed you were called in one body[c][b]. And be thankful.
translation:
  language: sw
  text: Na amani ya Masihi[a] itawale[b] mioyoni mwenu, ambayo pia mliitiwa katika mwili mmoja[c]. Na muwe wenye shukrani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kristo.” Neno la Kigiriki Χριστός ni cheo chenye maana ya Mtiwa-Mafuta.
    reason: lexical_alternative
  - marker: b
    text: Kitenzi hiki kinaweza pia kumaanisha “kutoa uamuzi kama mwamuzi,” kikisisitiza kwamba amani ya Masihi iwe ndiyo yenye kuamua katika maisha ya ndani ya jumuiya.
    reason: lexical_alternative
  - marker: c
    text: Au, yawezekana, “kuingia katika mwili mmoja,” kwa kusisitiza kuunganishwa katika mwili mmoja.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰρήνη
  choice: amani
  rationale: Hili ndilo neno la kawaida na la asili katika Kiswahili kwa amani ya kimahusiano na ya kijumuiya inayokusudiwa katika himizo hili.
- source_word: τοῦ Χριστοῦ
  choice: ya Masihi
  rationale: Χριστός lina nguvu ya cheo, yaani Mtiwa-Mafuta; “Masihi” huhifadhi maana hiyo katika lugha ya kawaida ya kibiblia.
- source_word: βραβευέτω
  choice: na itawale
  rationale: Kitenzi kinaweza kumaanisha kutoa uamuzi kama mwamuzi; “na itawale” huwasilisha kwa Kiswahili cha kawaida kazi yake ya kuongoza na kuamua.
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: mioyoni mwenu
  rationale: Nahau hii huhifadhi wingi wa Kigiriki na kurejelea maisha ya ndani, huku muktadha ukiendelea kuwa wa kijumuiya.
- source_word: εἰς ἣν καὶ ἐκλήθητε
  choice: ambayo ndiyo mliyoitiwa
  rationale: “Ambayo” inarejelea amani, na “ndiyo” huonyesha mkazo wa καί bila kuifanya kuwa kiunganishi rahisi.
- source_word: ἐν ἑνὶ σώματι
  choice: katika mwili mmoja
  rationale: Tafsiri hii ya moja kwa moja huhifadhi picha ya mwili mmoja bila kuifafanua ndani ya matini kuwa kanisa.
- source_word: εὐχάριστοι γίνεσθε
  choice: muwe wenye shukrani
  rationale: Himizo hili la hali endelevu linasikika kwa ufasaha na heshima katika Kiswahili na huhifadhi wazo la kuwa watu wa shukrani.
theological_decisions:
- issue: Tafsiri ya Χριστοῦ
  choice: Masihi
  alternative: Kristo
  rationale: Neno linafanya kazi kama cheo hapa; “Masihi” huhifadhi dhana ya Mtiwa-Mafuta bila kuongeza maelezo ya kimadhehebu.
- issue: Nguvu ya picha ya “mwili mmoja”
  choice: kuhifadhi “katika mwili mmoja” bila ufafanuzi
  alternative: kufafanua wazi kuwa ni kanisa
  rationale: Picha ya Paulo inaashiria umoja wa jumuiya, lakini kuiacha kama ilivyo huhifadhi mkazo na uchangamano wa matini.
- issue: Kazi ya amani katika mioyo
  choice: itawale
  alternative: iamue kama mwamuzi
  rationale: “Itawale” ni ya asili zaidi katika Kiswahili, huku tanbihi ikihifadhi picha ya kutoa uamuzi iliyomo katika kitenzi cha Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni mfupi na wa kihimizo; picha za “moyo” na “mwili mmoja” zimehifadhiwa. “Nanyi” huendeleza καί ya mwisho kwa mtiririko wa kawaida.
