lexical_decisions:
- source_word: ἵνα
  choice: ili
  rationale: Huanzisha kusudi na kuhifadhi maana ya kusudi kwa Kiswahili cha kawaida.
- source_word: φανερώσω
  choice: niifanye ijulikane wazi
  rationale: Kitenzi hiki katika hali tegemezi baada ya ἵνα kinaonyesha kusudi. Kauli hii inaeleza kuweka jambo wazi na kulifanya lijulikane katika muktadha wa kulitangaza.
- source_word: αὐτὸ
  choice: -i- katika “niifanye”
  rationale: Kiwakilishi hiki kinarejelea “siri” iliyotajwa katika mstari uliotangulia; kiambishi cha yambwa -i- kinadumisha matumizi ya kiwakilishi bila kurudia nomino katika matini kuu.
- source_word: ὡς
  choice: kama
  rationale: Hutambulisha namna au kiwango kinachopaswa kufuatwa.
- source_word: δεῖ
  choice: inipasavyo
  rationale: Huonyesha wajibu au ulazima kwa namna ya asili katika Kiswahili, huku uwezekano wa maana yenye nguvu zaidi, “lazima,” ukihifadhiwa katika tanbihi.
- source_word: με
  choice: -ni- katika “inipasavyo”
  rationale: Ingawa Kigiriki kinatumia umbo la akusativi kama mtendaji wa kitenzi-jina, Kiswahili huonyesha mhusika kwa kiambishi cha yambwa katika muundo huu.
- source_word: λαλῆσαι
  choice: kusema
  rationale: Ni kisawe kipana na cha moja kwa moja cha kitendo cha kunena; “kutangaza” kingeongeza umahususi usiolazimishwa na kitenzi hiki chenyewe.
