  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ὅταν ἀναγνωσθῇ παρ’ ὑμῖν ἡ ἐπιστολή, ποιήσατε ἵνα καὶ ἐν τῇ ⸀Λαοδικέων ἐκκλησίᾳ ἀναγνωσθῇ, καὶ τὴν ἐκ Λαοδικείας ἵνα καὶ ὑμεῖς ἀναγνῶτε.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/016.yaml
  text: And when this letter has been read among you[a], see that it is also read in the church of the Laodiceans[b], and that you also read the one from Laodicea.
translation:
  language: sw
  text: Barua hii itakapokuwa imesomwa miongoni mwenu, hakikisheni kwamba inasomwa pia katika kanisa la Laodikia, nanyi pia msome ile kutoka Laodikia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika Kigiriki, nomino “barua” haikutajwa katika sehemu hii, bali inaeleweka kutokana na muktadha. Haijulikani kwa uhakika barua hiyo ilikuwa ipi; “kutoka Laodikia” inaweza kumaanisha barua iliyokuwa Laodikia au iliyotumwa kutoka huko, si lazima barua iliyoandikiwa Laodikia.
    reason: lexical_alternative_and_cultural_note
lexical_decisions:
- source_word: ἀναγνωσθῇ / ἀναγνῶτε
  choice: itakapokuwa imesomwa / msome
  rationale: Kitenzi hiki humaanisha kusoma na katika mikusanyiko ya waamini mara nyingi kilihusu kusoma mbele ya kusanyiko. Kiswahili “kusoma” ni cha kawaida na hakiongezi waziwazi wazo la kusoma kwa sauti ambalo muktadha unadokeza lakini neno lenyewe halilazimishi.
- source_word: παρ’ ὑμῖν
  choice: miongoni mwenu
  rationale: Huwasilisha mahali na mazingira ya kijamii ya barua kusomwa katika jumuiya ya Wakolosai, badala ya kueleza tu ni nani aliyeisoma.
- source_word: ἡ ἐπιστολή
  choice: barua hii
  rationale: Kibainishi cha Kigiriki kinarejelea barua iliyopo inayotumwa kwa Wakolosai; “barua hii” huonyesha rejeo hilo kwa Kiswahili cha kawaida.
- source_word: ποιήσατε ἵνα
  choice: hakikisheni kwamba
  rationale: Muundo huu unatoa agizo la kuhakikisha jambo linatendeka. Tafsiri hii ni ya asili na inadumisha nguvu ya amri.
- source_word: ἐν τῇ Λαοδικέων ἐκκλησίᾳ
  choice: katika kanisa la Walaodikia
  rationale: “Kanisa” linafaa kwa ἐκκλησία katika muktadha huu, na “Walaodikia” linaonyesha watu wa Laodikia wanaounda kusanyiko hilo.
- source_word: τὴν ἐκ Λαοδικείας
  choice: ile kutoka Laodikia
  rationale: Kigiriki kinaacha nomino “barua” ieleweke kutokana na muktadha. “Ile” inadumisha udondoshaji huo, huku “kutoka” ikiwakilisha maana ya kawaida ya ἐκ bila kudai kwamba barua hiyo iliandikiwa Laodikia.
theological_decisions:
- issue: Utambulisho wa “ile kutoka Laodikia”
  choice: 'Kutafsiri kwa namna isiyoitambulisha barua hiyo: “ile kutoka Laodikia.”'
  alternative: Barua ya Paulo kwa Walaodikia; barua iliyotumwa kutoka Laodikia; au barua ya mzunguko iliyohusishwa na Laodikia, labda Waefeso.
  rationale: Kigiriki hakitaji kwa uhakika barua hiyo ilikuwa ipi wala kwamba iliandikiwa Laodikia. Tafsiri inahifadhi sintofahamu hiyo badala ya kuingiza hitimisho la kihistoria au la kikanoni.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo “hakikisheni kwamba” ni wa kawaida na hubeba agizo la Kigiriki; “ile kutoka Laodikia” huhifadhi ufupi na sintofahamu ya chanzo.
