base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/011.yaml
  text: and Jesus who is called Justus[a]. These are the only ones from the circumcision who are fellow workers for the kingdom of God[c][b], and they became a comfort to me.
translation:
  language: sw
  text: na Yesu aitwaye Yusto. Kati ya wale walio wa tohara, hawa peke yao ndio wafanyakazi wenza kwa ajili ya ufalme wa Mungu,[a] nao wamekuwa faraja kwangu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “Hawa ndio wafanyakazi wenza pekee kwa ajili ya ufalme wa Mungu ambao ni miongoni mwa walio wa tohara.”'
    reason: Inaonyesha uwezekano mwingine wa kuhusianisha kifungu “peke yao” na “walio wa tohara” bila kuufanya kuwa tafsiri kuu.
  - marker: b
    text: 'Au: “nao wakawa faraja kwangu,” au “nao wamekuwa kitia-moyo kwangu.”'
    reason: παρηγορία inaweza kumaanisha faraja au kitia-moyo, na kitenzi kinaweza kutolewa kama tukio la wakati uliopita au hali iliyodhihirika.
lexical_decisions:
- source_word: Ἰησοῦς
  choice: Yesu
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili cha Agano Jipya; linaweza pia kulingana na jina Yoshua, lakini hapa mapokeo ya majina ya Agano Jipya yanaunga mkono “Yesu”.
- source_word: ὁ λεγόμενος Ἰοῦστος
  choice: aitwaye Yusto
  rationale: Hutambulisha jina jingine la mtu huyo kwa Kiswahili cha kawaida na chenye heshima.
- source_word: οἱ ὄντες ἐκ περιτομῆς
  choice: wale waliotahiriwa
  rationale: Nahau hiyo inawatambulisha watu wenye asili ya Kiyahudi. Tafsiri hii inadumisha ishara halisi ya tohara bila kuitafsiri moja kwa moja kuwa “Wayahudi”.
- source_word: οὗτοι μόνοι
  choice: hawa peke yao ndio
  rationale: Inahifadhi msisitizo wa upekee katika kundi lililotajwa.
- source_word: συνεργοὶ
  choice: wafanyakazi wenzangu
  rationale: Katika muktadha, Paulo anasema kuwa watu hawa wanafanya kazi pamoja naye; kiwakilishi “-angu” hufanya uhusiano huo uwe wazi na wa kawaida katika Kiswahili.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: kwa ajili ya ufalme wa Mungu
  rationale: Inaeleza lengo au huduma ambayo kazi yao ya pamoja inaielekea huku ikihifadhi usemi wa kibiblia “ufalme wa Mungu”.
- source_word: ἐγενήθησάν μοι παρηγορία
  choice: wamekuwa faraja kwangu
  rationale: Hutoa kwa Kiswahili cha asili wazo la kwamba walijidhihirisha au wamekuwa chanzo cha faraja kwa Paulo; “faraja” inadumisha maana kuu ya παρηγορία.
theological_decisions:
- issue: Maana ya “wale waliotahiriwa”
  choice: Inarejelea wafanyakazi wenza wenye asili ya Kiyahudi.
  alternative: Inaweza kurejelea kwa namna nyembamba zaidi kundi lililosisitiza tohara.
  rationale: Muktadha ni orodha ya wafanyakazi wenza, na usemi unaonyesha utambulisho wao wa Kiyahudi. Tafsiri ya msingi inadumisha lugha ya tohara ili isiamue kwa nguvu zaidi ya ushahidi wa maandishi.
- issue: Kundi ambalo neno “peke yao” linabainisha
  choice: Hawa ndio pekee miongoni mwa waliotahiriwa ambao ni wafanyakazi wenza wa Paulo kwa ajili ya ufalme.
  alternative: Hawa ndio wafanyakazi wenza pekee kwa ajili ya ufalme ambao pia wametahiriwa.
  rationale: Mpangilio wa Kigiriki kwanza unaweka kundi la “wale walio wa tohara,” kisha unasisitiza kwamba hawa peke yao ni wafanyakazi wenza; hata hivyo, uwezekano wa kisintaksia wa usomaji mwingine unaonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo “Kati ya wale waliotahiriwa” huepusha sintaksia ngumu huku ukidumisha msisitizo wa Kigiriki.
