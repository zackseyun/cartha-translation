  yaml_path: translation/nt/colossians/004/013.yaml
  text: For I testify for him that he has great labor for you and for those in Laodicea and those in Hierapolis[a].
translation:
  language: sw
  text: Maana ninashuhudia kumhusu kwamba ana taabu nyingi kwa ajili yenu, na kwa ajili ya wale walioko Laodikia na wale walioko Hierapoli.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ana juhudi nyingi,” “anahangaika sana,” au “ana uchungu mwingi.” Usemi wa Kigiriki unaweza kumaanisha taabu au kazi ngumu, na katika muktadha huu pia unaweza kudokeza kuwahangaikia wengine sana.
    reason: lexical_alternative
lexical_decisions:
- source_word: μαρτυρῶ
  choice: ninamtolea ushahidi
  rationale: Kitenzi cha wakati uliopo kimetafsiriwa kwa usemi wa kawaida unaoonyesha Paulo mwenyewe akithibitisha jambo kumhusu Epafra.
- source_word: γὰρ
  choice: Maana
  rationale: Inaendeleza uhusiano wa maelezo na mstari uliotangulia kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: αὐτῷ
  choice: -m- katika “ninamtolea ushahidi”
  rationale: Kiambishi cha yambwa pamoja na “-tolea” kinaonyesha kwamba Paulo anatoa ushahidi kwa niaba yake au kumhusu, bila kuufanya usemi kuwa mzito.
- source_word: ὅτι
  choice: kwamba
  rationale: Inatanguliza yaliyomo katika ushahidi wa Paulo.
- source_word: ἔχει πολὺν πόνον
  choice: anajitaabisha sana
  rationale: Huu ni usemi wa asili wa Kiswahili unaohifadhi wazo la juhudi na taabu kubwa; hauufungi maana kwenye hisia za kuhangaika pekee wala kwenye aina moja tu ya huduma.
- source_word: ὑπὲρ ὑμῶν
  choice: kwa ajili yenu
  rationale: Inaonyesha juhudi zinazoelekezwa kwa manufaa ya waamini wa Kolosai.
- source_word: τῶν ἐν Λαοδικείᾳ
  choice: wale walioko Laodikia
  rationale: Inarejelea watu walioko katika mji huo kwa njia fupi na ya kawaida.
- source_word: τῶν ἐν Ἱεραπόλει
  choice: wale walioko Hierapoli
  rationale: Muundo sambamba umehifadhiwa, na jina la mji limetoholewa kwa matumizi ya Kiswahili.
theological_decisions:
- issue: Maana ya πολὺν πόνον kuhusiana na huduma ya Epafra
  choice: anajitaabisha sana
  alternative: ana juhudi nyingi; anahangaika sana; ana uchungu mwingi
  rationale: Muktadha wa 4:12 unahusisha kujitahidi kwake katika maombi, lakini πόνος inaweza kueleza taabu au juhudi ngumu kwa upana zaidi. “Anajitaabisha sana” huhifadhi wazo hilo pana bila kuamua kwamba Paulo anamaanisha hisia za uchungu pekee.
- issue: Nguvu ya αὐτῷ pamoja na μαρτυρῶ
  choice: ninamtolea ushahidi
  alternative: ninashuhudia kumhusu
  rationale: Dative inaweza kueleweka kama ushahidi unaotolewa kwa ajili yake au kumhusu. Usemi uliochaguliwa unaonyesha Paulo akimthibitisha Epafra kwa niaba yake huku ukiacha uhusiano huo wa maana wazi kwa kiasi kinachofaa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi na inayoeleweka kwa wasomaji wa kawaida. Muundo sambamba wa Laodikia na Hierapoli umehifadhiwa.
