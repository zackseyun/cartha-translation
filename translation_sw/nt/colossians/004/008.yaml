  text: ὃν ἔπεμψα πρὸς ὑμᾶς εἰς αὐτὸ τοῦτο ἵνα ⸀γνῶτε τὰ περὶ ⸀ἡμῶν καὶ παρακαλέσῃ τὰς καρδίας ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/008.yaml
  text: 'I sent him to you for this very purpose: that you may know how we are[a], and that he may encourage your hearts.'
translation:
  language: sw
  text: 'Nilimtuma kwenu kwa kusudi hili hasa: ili mpate kujua hali yetu[a], naye awatie moyo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati za kale zinasema, “ili tupate kujua hali yenu.”
    reason: textual_variant
lexical_decisions:
- source_word: ὃν ἔπεμψα πρὸς ὑμᾶς
  choice: Nilimtuma kwenu
  rationale: Kiwakilishi cha uhusiano kinamrejelea Tikiko katika mstari uliotangulia. Kiswahili cha kawaida huunganisha yambwa katika kitenzi; wakati uliopita rahisi unawakilisha aoristi bila kuongeza maana isiyokuwamo.
- source_word: εἰς αὐτὸ τοῦτο
  choice: kwa kusudi hili hasa
  rationale: Neno “hasa” linabeba msisitizo wa αὐτὸ τοῦτο kwa Kiswahili cha asili na kilicho wazi.
- source_word: ἵνα γνῶτε τὰ περὶ ἡμῶν
  choice: ili mpate kujua hali yetu
  rationale: “Ili” linaonyesha kusudi, na “hali yetu” ni usemi wa kawaida unaowasilisha mambo yanayotuhusu bila kufafanua kupita kiasi.
- source_word: καὶ παρακαλέσῃ
  choice: naye awatie moyo
  rationale: Katika muktadha huu παρακαλέω ina wazo la kutia nguvu na kufariji; “awatie moyo” ni usemi wa kawaida usiofinya maana kuwa mawaidha pekee au faraja pekee.
- source_word: τὰς καρδίας ὑμῶν
  choice: awatie moyo
  rationale: Nahau ya Kiswahili “kutia moyo” inawakilisha kwa ufasaha wazo la kuimarisha mioyo. Kutafsiri neno kwa neno kama “afariji mioyo yenu” kungekuwa kizito zaidi na kungepunguza upana wa παρακαλέω.
theological_decisions:
- issue: Tofauti ya maandishi kuhusu anayejua hali ya nani
  choice: “ili mpate kujua hali yetu,” kulingana na γνῶτε τὰ περὶ ἡμῶν katika SBLGNT
  alternative: “ili tupate kujua hali yenu”
  rationale: Andiko kuu linafuata toleo la chanzo lililotolewa. Tofauti inayogeuza upande wa taarifa imehifadhiwa katika tanbihi kwa uwazi wa ushahidi wa maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wazi kwa wasomaji wa kawaida; “kwa kusudi hili hasa” huhifadhi msisitizo, na “awatie moyo” hutumia nahau asilia bila kuingiza msimamo wa kimadhehebu.
