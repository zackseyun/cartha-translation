  text: Ὁ ἀσπασμὸς τῇ ἐμῇ χειρὶ Παύλου. μνημονεύετέ μου τῶν δεσμῶν. ἡ χάρις μεθ’ ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/018.yaml
  text: The greeting is in my own hand—Paul's[a]. Remember my chains[b]. Grace be with you.
translation:
  language: sw
  text: Mimi, Paulo, nimeandika salamu hii kwa mkono wangu mwenyewe.[a] Kumbukeni minyororo yangu.[b] Neema iwe pamoja nanyi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, salamu ya mwisho iliyoandikwa na Paulo mwenyewe.
    reason: lexical_clarification
  - marker: b
    text: Au “kifungo changu” au “vifungo vyangu.” Tafsiri ya moja kwa moja ni “minyororo yangu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπασμός
  choice: Salamu
  rationale: Katika muktadha wa barua, neno hili linamaanisha salamu ya kufunga barua; “salamu” ni la kawaida na lenye heshima katika Kiswahili cha sasa.
- source_word: τῇ ἐμῇ χειρὶ Παύλου
  choice: hii nimeandika kwa mkono wangu mwenyewe—mimi Paulo
  rationale: Kirai cha Kigiriki ni kifupi na kinasisitiza kwamba Paulo mwenyewe aliandika salamu hii kwa mwandiko wake. Muundo huu unafanya maana hiyo iwe wazi na ya asili kwa Kiswahili bila kuifanya Paulo kuwa mtunzi wa barua yote kwa mkono wake.
- source_word: μνημονεύετέ
  choice: Kumbukeni
  rationale: Amri ya wakati wa sasa inaweza kudokeza kuendelea kukumbuka, lakini “Kumbukeni” ni amri ya kawaida ya Kiswahili na haisisitizi kipengele cha kitenzi kupita kiasi.
- source_word: μου τῶν δεσμῶν
  choice: minyororo yangu
  rationale: δεσμοί ni minyororo au vifungo, na hapa ni taswira halisi inayowakilisha hali ya Paulo ya kufungwa. “Minyororo yangu” huhifadhi taswira hiyo kuliko “kifungo changu.”
- source_word: ἡ χάρις
  choice: Neema
  rationale: Hii ni baraka ya kawaida ya kufunga barua za Paulo. Hakuna haja ya kuongeza mwenye neema kwa kuwa hilo halijaelezwa wazi katika Kigiriki.
- source_word: μεθ’ ὑμῶν
  choice: iwe pamoja nanyi
  rationale: Kigiriki hakina kitenzi kilichoandikwa, lakini Kiswahili cha baraka huhitaji kwa kawaida “iwe”; “pamoja nanyi” huwasilisha maana ya μετά kwa njia ya asili.
theological_decisions:
- issue: Baraka ya mwisho haina kitenzi wazi katika Kigiriki
  choice: Neema iwe pamoja nanyi
  alternative: Neema pamoja nanyi
  rationale: Kuongeza “iwe” kunakamilisha baraka kwa Kiswahili cha kawaida bila kuongeza maudhui ya kiteolojia.
- issue: δεσμοί kama kifaa halisi au hali ya kifungo
  choice: minyororo yangu
  alternative: kifungo changu
  rationale: Tafsiri halisi huhifadhi taswira ya mateso na ufungwa wa Paulo huku tanbihi ikieleza maana pana ya kufungwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Muundo wa sentensi ya kwanza umewekwa wazi ili kueleza kifupi cha Kigiriki na kusisitiza mwandiko wa Paulo mwenyewe.
