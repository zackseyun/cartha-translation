  yaml_path: translation/nt/colossians/004/009.yaml
  text: together with Onesimus[a], the faithful and beloved brother, who is one of you[b]. They will make known to you everything here.
translation:
  language: sw
  text: pamoja na Onesimo, ndugu mwaminifu na mpendwa, ambaye ni mmoja wenu.[a] Watawajulisha mambo yote ya hapa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ambaye anatoka miongoni mwenu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “Watawaeleza mambo yote ya hapa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺν
  choice: pamoja na
  rationale: Huonyesha kuandamana; kwa kuzingatia mstari uliotangulia, Onesimo anaandamana na Tikiko.
- source_word: Ὀνησίμῳ
  choice: Onesimo
  rationale: Jina la mtu limetoholewa kwa namna iliyozoeleka katika Kiswahili.
- source_word: πιστῷ
  choice: mwaminifu
  rationale: Huhifadhi maana ya uaminifu au kutegemewa bila kuibana kuwa sifa moja tu.
- source_word: ἀγαπητῷ
  choice: mpendwa
  rationale: Huonyesha upendo wa kindugu kwa lugha ya kawaida na yenye heshima.
- source_word: ἀδελφῷ
  choice: ndugu
  rationale: Katika muktadha huu humtaja mwamini mwenzao; 'ndugu' ni ya asili katika Kiswahili na haihitaji ufafanuzi ulioongezwa.
- source_word: ὅς ἐστιν ἐξ ὑμῶν
  choice: ambaye ni mmoja wenu
  rationale: Ni usemi wa kawaida unaohifadhi wazo la kuwa sehemu ya jumuiya yao, huku maana ya asili ya kutoka miongoni mwao ikiwekwa katika tanbihi.
- source_word: πάντα
  choice: mambo yote
  rationale: Wingi wa kati unatumiwa kwa maana pana kuhusu taarifa au hali zote zinazohusika.
- source_word: γνωρίσουσιν
  choice: watawajulisha
  rationale: Hutoa maana ya kufanya jambo lijulikane kwa Kiswahili cha kawaida na sanifu.
- source_word: τὰ ὧδε
  choice: mambo yote ya hapa
  rationale: Hurejelea mambo au hali za mahali alipo Paulo bila kuongeza wazi wazo la matukio yanayoendelea.
theological_decisions:
- issue: Maana ya kijumuiya ya ἀδελφῷ
  choice: ndugu
  alternative: ndugu katika imani
  rationale: Neno linamtaja Mkristo mwenzao, lakini tafsiri haiongezi ufafanuzi ambao haujatamkwa katika Kigiriki.
- issue: Nguvu ya ἐξ ὑμῶν
  choice: ambaye ni mmoja wenu
  alternative: ambaye anatoka miongoni mwenu
  rationale: Huhifadhi utambulisho wa Onesimo na waamini wa Kolosai bila kuingiza madai zaidi ya kijamii au kiteolojia kutoka Filemoni.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa moja kwa moja na unaosomeka kwa urahisi; istilahi za kindugu za jumuiya ya waamini zimehifadhiwa bila upanuzi wa kimadhehebu.
