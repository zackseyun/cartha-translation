id: COL.4.12
reference: Colossians 4:12
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀσπάζεται ὑμᾶς Ἐπαφρᾶς ὁ ἐξ ὑμῶν, δοῦλος ⸀Χριστοῦ, πάντοτε ἀγωνιζόμενος ὑπὲρ ὑμῶν ἐν ταῖς προσευχαῖς, ἵνα ⸀σταθῆτε τέλειοι καὶ ⸀πεπληροφορημένοι ἐν παντὶ θελήματι τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/012.yaml
  text: Epaphras[a], who is one of you, greets you—a servant of Messiah, always striving for you in his prayers[b], so that you may stand mature and fully assured in all the will of God.
translation:
  language: sw
  text: Epafra, ambaye ni mmoja wenu, anawasalimu; yeye ni mtumwa wa Masihi[a], naye daima anajitahidi kwa ajili yenu katika sala zake, ili msimame mkiwa wakomavu na wenye uhakika kamili[b] katika mapenzi yote ya Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kristo.” Neno la Kigiriki Χριστός ni cheo chenye maana ya “Mtiwa-Mafuta,” yaani Masihi.
    reason: lexical_alternative
  - marker: b
    text: Au, “waliosadikishwa kabisa” au “walioimarishwa kikamilifu.” Kigiriki kinaweza kueleza hali ya uhakika kamili au hali ya kuthibitishwa kikamilifu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάζεται
  choice: anawasalimu
  rationale: Ni usemi wa kawaida wa salamu katika hitimisho la barua, na unadumisha hali ya wakati uliopo.
- source_word: ὁ ἐξ ὑμῶν
  choice: aliye mmoja wenu
  rationale: Unaonyesha kwa Kiswahili cha kawaida kwamba Epafra anatoka na ni sehemu ya jumuiya ya Wakolosai.
- source_word: δοῦλος
  choice: mtumwa
  rationale: 'Neno hili linadumisha nguvu ya δοῦλος: mtu aliye chini ya mamlaka na anayemilikiwa kabisa, si mfanyakazi wa hiari tu.'
- source_word: Χριστοῦ
  choice: wa Masihi
  rationale: Χριστός hapa ni cheo chenye maana ya Mtiwa-Mafuta; “Masihi” huhifadhi maana hiyo bila kuongeza jina “Yesu,” ambalo halimo katika maandishi haya.
- source_word: ἀγωνιζόμενος
  choice: anajitahidi
  rationale: Linawasilisha juhudi kubwa na endelevu bila kulazimisha picha maalumu ya mieleka.
- source_word: ἐν ταῖς προσευχαῖς
  choice: katika sala zake
  rationale: Wingi unaonyesha sala za kurudiwa-rudiwa, na kiwakilishi kinaweka wazi kwamba Epafra ndiye anayeomba.
- source_word: ἵνα σταθῆτε
  choice: ili msimame
  rationale: Linahifadhi picha ya kusimama bila kuongeza waziwazi neno “imara,” ambalo halipo katika Kigiriki.
- source_word: τέλειοι
  choice: mkiwa wakomavu
  rationale: Katika muktadha huu neno linaelekea kumaanisha ukomavu au utimilifu wa kiroho, si kutokuwa na dhambi kabisa.
- source_word: πεπληροφορημένοι
  choice: wenye uhakika kamili
  rationale: Linatoa maana ya hali thabiti ya kuwa na hakika kabisa, huku uwezekano wa maana nyingine ukihifadhiwa katika tanbihi.
- source_word: ἐν παντὶ θελήματι τοῦ θεοῦ
  choice: katika yote anayotaka Mungu
  rationale: Ni Kiswahili cha kawaida kinachowasilisha upana wa mapenzi yote ya Mungu bila kutumia “mapenzi” kwa namna inayoweza kueleweka kwanza kama upendo wa Mungu.
theological_decisions:
- issue: Jinsi ya kutafsiri Χριστοῦ katika δοῦλος Χριστοῦ
  choice: mtumwa wa Masihi
  alternative: mtumwa wa Kristo
  rationale: “Masihi” hudumisha maana ya cheo cha Χριστός. Jina “Yesu” halijaongezwa kwa kuwa halipo katika ushahidi wa maandishi uliotolewa.
- issue: Jinsi ya kutafsiri δοῦλος
  choice: mtumwa
  alternative: mtumishi
  rationale: “Mtumwa” huhifadhi wazo lenye nguvu la kuwa chini ya mamlaka na kumilikiwa kabisa na Masihi; “mtumishi” lingeweza kupunguza nguvu hiyo.
- issue: Maana ya πεπληροφορημένοι
  choice: wenye uhakika kamili
  alternative: walioimarishwa kikamilifu / waliosadikishwa kabisa
  rationale: Maana ya kuwa na uhakika ndiyo ya kawaida na inafaa katika muktadha huu, lakini Kigiriki kinaweza pia kusisitiza kusadikishwa au kuthibitishwa kikamilifu; tanbihi inalinda mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Sentensi imegawanywa baada ya salamu ili kuepuka msongamano, huku uhusiano wa vipashio vya Kigiriki ukidumishwa. “Epafra” ni umbo la kawaida la jina Ἐπαφρᾶς katika Kiswahili cha Biblia.
