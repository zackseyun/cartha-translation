base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/010.yaml
  text: Aristarchus[a], my fellow prisoner, greets you, and Mark, the cousin of Barnabas (about whom you received instructions—if he comes to you, welcome him)[b],
translation:
  language: sw
  text: 'Aristarko, mfungwa mwenzangu, anawasalimu, pamoja na Marko, binamu wa Barnaba[a] (ambaye mlipokea maagizo kumhusu: akija kwenu, mkaribisheni[b]).'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mpwa wa Barnaba.” Hata hivyo, “binamu” ndiyo maana sahihi zaidi ya neno la Kiyunani ἀνεψιός katika Kiyunani cha Koine.
    reason: lexical_alternative
  - marker: b
    text: Au “mpokeeni.” Kitenzi cha Kiyunani kinaweza kumaanisha kumpokea mtu kwa ukarimu; “mkaribisheni” inaweka maana hiyo wazi katika Kiswahili cha sasa.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάζεται
  choice: anawasalimu
  rationale: Kitenzi hiki hutumiwa kwa kawaida kuwasilisha salamu katika barua. “Anawasalimu” ni usemi wa kawaida na wa moja kwa moja katika Kiswahili.
- source_word: συναιχμάλωτός
  choice: mfungwa mwenzangu
  rationale: Neno hili humaanisha mtu aliyefungwa pamoja na mwingine. Tafsiri hii ni wazi na haiongezi maelezo yasiyokuwamo katika mstari.
- source_word: ἀνεψιὸς
  choice: binamu
  rationale: Katika Kiyunani cha Koine, neno hili humaanisha hasa binamu. Hivyo “binamu” ni sahihi zaidi kuliko “mpwa” au neno pana kama “jamaa.”
- source_word: ἐλάβετε ἐντολάς
  choice: mlipokea maagizo
  rationale: “Maagizo” yanadumisha maana ya maelekezo yenye mamlaka bila kutoa hisia kali isiyolazimu ya amri za kijeshi.
- source_word: ἐὰν ἔλθῃ πρὸς ὑμᾶς
  choice: akija kwenu
  rationale: Muundo huu wa Kiswahili unaonyesha kwa kawaida sharti linalohusu tukio la wakati ujao.
- source_word: δέξασθε αὐτόν
  choice: mkaribisheni
  rationale: Katika muktadha wa safari na ukarimu, kitenzi hiki kina maana ya kumpokea mtu kwa ukarimu. “Mkaribisheni” huwasilisha maana hiyo kwa Kiswahili cha sasa.
theological_decisions:
- issue: Aina ya uhusiano wa Paulo na Aristarko katika συναιχμάλωτός μου
  choice: mfungwa mwenzangu
  alternative: mfungwa mwenzangu katika Bwana; mfanyakazi mwenzangu anayeshiriki mateso
  rationale: Mstari hausemi wazi ikiwa kifungo hicho ni halisi au cha mfano. Tafsiri ya moja kwa moja inadumisha uwezekano huo bila kuamua tafsiri ya kihistoria au ya kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa urahisi. Muundo “pamoja na Marko” unaonyesha kuwa Marko pia anatuma salamu, huku ukidumisha kitenzi cha umoja kilicho katika matini ya Kiyunani. Alama za tanbihi zimewekwa moja kwa moja baada ya maneno yanayohusika.
