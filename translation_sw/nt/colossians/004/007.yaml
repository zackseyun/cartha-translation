  text: Τὰ κατ’ ἐμὲ πάντα γνωρίσει ὑμῖν Τυχικὸς ὁ ἀγαπητὸς ἀδελφὸς καὶ πιστὸς διάκονος καὶ σύνδουλος ἐν κυρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/007.yaml
  text: Tychicus[a], the beloved brother and faithful minister and fellow servant in the Lord[c][b], will make known to you everything about me.
translation:
  language: sw
  text: Tikiko, ndugu mpendwa, mhudumu mwaminifu[b] na mtumwa mwenzangu[c] katika Bwana, atawajulisha mambo yote yanayonihusu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mambo yangu yote” au “hali zangu zote.”
    reason: lexical_alternative
  - marker: b
    text: Au, “mtumishi mwaminifu.” Neno la Kigiriki διάκονος linaweza kumaanisha mhudumu, mtumishi, au katika baadhi ya mazingira, shemasi.
    reason: lexical_alternative
  - marker: c
    text: Au, “mtumishi mwenzangu.” Neno la Kigiriki σύνδουλος limejengwa juu ya δοῦλος, ambalo linaweza kuonyesha utumishi wenye hali ya utumwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὰ κατ’ ἐμὲ πάντα
  choice: mambo yangu yote
  rationale: Nahau hii inahusu mambo yanayomhusu Paulo—hali yake, shughuli zake, au mazingira yake. “Mambo yangu yote” ni Kiswahili cha kawaida kinachodumisha upana wa πάντα bila kuibana maana kuwa hali pekee.
- source_word: γνωρίσει ὑμῖν
  choice: atawajulisha
  rationale: Kitenzi cha wakati ujao γνωρίσει pamoja na ὑμῖν kina maana ya kuwafanya wajue au kuwapa habari; “atawajulisha” ni cha asili na kinaonyesha wazi wapokeaji walio wengi.
- source_word: Τυχικὸς
  choice: Tikiko
  rationale: Jina limetoholewa kwa tahajia inayofaa sauti na matumizi ya Kiswahili.
- source_word: ὁ ἀγαπητὸς ἀδελφὸς
  choice: ndugu mpendwa
  rationale: Huhifadhi upendo wa maelezo ya Paulo na rejeo la kiume la umoja kwa Tikiko kwa lugha ya kawaida na yenye heshima.
- source_word: πιστὸς διάκονος
  choice: mhudumu mwaminifu
  rationale: διάκονος hapa inaelekea kueleza huduma ya Tikiko badala ya kutaja kwa uhakika cheo maalumu cha kanisa. “Mhudumu” huhifadhi maana pana, na “mwaminifu” huonyesha uaminifu na kutegemeka.
- source_word: σύνδουλος
  choice: mtumwa mwenzangu
  rationale: Neno σύνδουλος, lililojengwa juu ya δοῦλος, huonyesha mtu anayeshiriki hali ya kuwa chini ya bwana mmoja. “Mtumwa mwenzangu” huhifadhi uzito wa uhusiano huo kuliko “mtumishi mwenzangu,” huku tanbihi ikitaja tafsiri mbadala.
- source_word: ἐν κυρίῳ
  choice: katika Bwana
  rationale: Hii ni kauli ya kawaida ya Paulo inayoonyesha uhusiano au eneo la kiroho. Tafsiri hii haibani kirai kiwe na maana ya kufanya huduma kwa ajili ya Bwana tu.
theological_decisions:
- issue: Maana ya σύνδουλος na lugha ya δοῦλος
  choice: mtumwa mwenzangu
  alternative: mtumishi mwenzangu
  rationale: Tafsiri iliyochaguliwa inaonyesha kwamba Tikiko na Paulo wanashiriki hali ya kuwa mali ya Bwana na kumtumikia. Mbadala ni laini zaidi katika Kiswahili, lakini unaweza kufifisha wazo la utumwa au utumishi wenye kifungo lililomo katika neno la Kigiriki.
- issue: Uhusiano wa kirai ἐν κυρίῳ na sifa zinazotangulia
  choice: katika Bwana
  alternative: katika kumtumikia Bwana
  rationale: Kirai cha Kigiriki kinaweza kueleza mazingira ya utambulisho na huduma ya Tikiko bila kulazimisha uhusiano mwembamba na neno moja tu. Tafsiri ya moja kwa moja inadumisha upana huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mpangilio umefanywa wa kawaida kwa Kiswahili kwa kumtaja Tikiko kwanza na kuweka taarifa atakayotoa mwishoni; maana yote ya Kigiriki imehifadhiwa. “Katika Bwana” limeachwa baada ya sifa zilizounganishwa ili kutofunga kimya kimya kirai hicho kwa “mtumwa mwenzangu” pekee.
