  yaml_path: translation/nt/colossians/004/005.yaml
  text: Walk in wisdom toward outsiders[b][a], making the most of the time.
translation:
  language: sw
  text: Enendeni kwa hekima kwa wale walio nje,[a] mkitumia vema fursa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, watu walio nje ya jumuiya ya waamini.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “mkiununua wakati”; maana yake ni kutumia kikamilifu fursa inayopatikana.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν σοφίᾳ
  choice: kwa hekima
  rationale: Kirai hiki kinaonyesha namna ya kuishi au kujiendesha. “Kwa hekima” ni Kiswahili cha kawaida na chenye heshima, huku kikihifadhi nomino σοφία na uzito wake wa kimaadili.
- source_word: περιπατεῖτε
  choice: Enendeni
  rationale: Kitenzi hiki kimetumiwa kisitiari kuhusu mwenendo wa maisha. “Enendeni” kinadumisha kwa kiasi taswira ya kutembea, lakini katika Kiswahili cha kibiblia kinachoeleweka pia humaanisha kuishi au kujiendesha.
- source_word: πρὸς τοὺς ἔξω
  choice: mbele ya walio nje
  rationale: πρός hapa inaelekeza mwenendo wa waamini kuhusiana na watu walio nje ya jumuiya ya waamini. “Mbele ya” ni ya asili katika muktadha wa jinsi mtu anavyojiendesha machoni pa watu wengine; tanbihi inafafanua maana ya “walio nje.”
- source_word: τὸν καιρόν
  choice: kila fursa
  rationale: καιρός hapa si wakati kwa ujumla tu, bali wakati unaofaa au nafasi inayopatikana. “Kila fursa” huwasilisha maana hiyo kwa uwazi katika Kiswahili cha sasa.
- source_word: ἐξαγοραζόμενοι
  choice: mkitumia vizuri
  rationale: Katika muunganiko huu kitenzi kina maana ya kutumia kikamilifu fursa inayopatikana. Tafsiri hii huepuka kuingiza maana ya ukombozi wa wokovu isiyokusudiwa hapa; tanbihi inahifadhi sitiari halisi ya kununua.
theological_decisions:
- issue: Uwezekano wa kuipa ἐξαγοραζόμενοι maana ya kiukombozi wa wokovu
  choice: Himizo la kutumia vizuri kila fursa katika mwenendo kwa wasio waamini
  alternative: “Mkiukomboa wakati,” ambalo linaweza kueleweka kama lugha ya ukombozi wa wokovu
  rationale: Katika muktadha huu, kitenzi kinatumika kwa maana ya kutumia kikamilifu au kujipatia fursa, si kufanya upatanisho au ukombozi wa dhambi. Tafsiri kuu haiongezi dai la kimafundisho lisilokuwamo katika aya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. “Enendeni” kinahifadhi sitiari ya mwenendo bila kuwa kizito kupita kiasi; “walio nje” kinadumisha usemi wa Kigiriki na kufafanuliwa katika tanbihi.
