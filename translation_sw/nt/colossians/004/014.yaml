  text: ἀσπάζεται ὑμᾶς Λουκᾶς ὁ ἰατρὸς ὁ ἀγαπητὸς καὶ Δημᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/014.yaml
  text: Luke, the beloved physician, and Demas greet you.
translation:
  language: sw
  text: Luka, tabibu mpendwa, na Dema wanawasalimu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσπάζεται
  choice: wanawasalimu
  rationale: Katika muktadha wa barua, kitenzi hiki kinawasilisha salamu. Ingawa Kigiriki kina umbo la umoja kwa sababu mtendaji wa kwanza anatangulia, Kiswahili cha kawaida hutumia wingi kwa watendaji wawili, Luka na Dema.
- source_word: ὑμᾶς
  choice: -wa-
  rationale: Kiambishi cha yambwa -wa- katika “wanawasalimu” kinawakilisha nafsi ya pili wingi na kuwaelekezea salamu waamini wa Kolosai kwa pamoja.
- source_word: Λουκᾶς
  choice: Luka
  rationale: Hili ndilo umbo la kawaida la jina hili katika Biblia za Kiswahili.
- source_word: ἰατρὸς
  choice: tabibu
  rationale: “Tabibu” hutaja mtaalamu wa tiba kwa lugha ya sasa yenye hadhi, huku ikifaa mazingira ya karne ya kwanza kuliko cheo cha kisasa “daktari”.
- source_word: ἀγαπητὸς
  choice: mpendwa
  rationale: “Mpendwa” huhifadhi joto la upendo na heshima lililo katika ἀγαπητός, na kwa kawaida linamwelezea Luka.
- source_word: καὶ
  choice: na
  rationale: Kiunganishi rahisi kinachomwunganisha Dema na Luka kama wanaotoa salamu.
- source_word: Δημᾶς
  choice: Dema
  rationale: Hili ndilo umbo la kawaida la jina hili katika matumizi ya Biblia za Kiswahili.
theological_decisions:
- issue: Wigo wa kivumishi ὁ ἀγαπητός (“mpendwa”)
  choice: “tabibu mpendwa” linamwelezea Luka peke yake.
  alternative: Kulihusisha neno “mpendwa” pia na Dema.
  rationale: Muundo wa Kigiriki Λουκᾶς ὁ ἰατρὸς ὁ ἀγαπητός unaweka “tabibu” na “mpendwa” katika uhusiano wa maelezo na jina Luka; Dema anaongezwa baadaye kwa καί.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, fasaha na chenye hadhi. Mpangilio unafuata mtiririko wa Kigiriki huku upatanisho wa kitenzi cha wingi ukifanya sentensi iwe ya kawaida katika Kiswahili.
