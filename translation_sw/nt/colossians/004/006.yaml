  yaml_path: translation/nt/colossians/004/006.yaml
  text: Let your speech always be with grace[a], seasoned with salt[b], so that you may know how you ought to answer each person.
translation:
  language: sw
  text: Usemi wenu na uwe wa neema sikuzote[a], ukiwa umetiwa chumvi[b], ili mjue jinsi iwapasavyo kumjibu kila mtu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wenye neema.” Usemi “wa neema” unaweza kumaanisha usemi wenye fadhili, wema, au mvuto.
    reason: lexical_alternative
  - marker: b
    text: “Uliotiwa chumvi” ni sitiari ya usemi unaofaa, wenye kuvutia, na wenye hekima, si usemi usio na ladha au wenye kuharibu.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ λόγος ὑμῶν
  choice: Maneno yenu
  rationale: Katika muktadha huu, λόγος humaanisha usemi au namna ya kusema kwa jumla. “Maneno yenu” ni ya kawaida na ya asili katika Kiswahili, huku yakidumisha wazo la mawasiliano ya waamini.
- source_word: πάντοτε ἐν χάριτι
  choice: yawe na neema sikuzote
  rationale: “Na neema” huhifadhi taswira ya Kigiriki na inaweza kumaanisha maneno yenye wema, fadhili na mvuto, bila kufunga maana katika sifa moja tu.
- source_word: ἅλατι ἠρτυμένος
  choice: yakiwa yamekolezwa chumvi
  rationale: 'Tafsiri hii inadumisha sitiari ya chumvi na hali inayotokana na kitendo kilichokamilika: maneno yanapaswa kuwa na ubora wa kudumu wa kufaa, kuvutia na kuwa na hekima.'
- source_word: εἰδέναι
  choice: ili mjue
  rationale: Infinitivu ina uhusiano wa kisintaksia usio wazi kabisa na himizo lililotangulia. “Ili mjue” inaonyesha kwa kawaida kusudi au matokeo bila kulazimisha ufafanuzi zaidi.
- source_word: πῶς δεῖ ὑμᾶς
  choice: jinsi iwapasavyo
  rationale: δεῖ huonyesha ulazima au jambo linalofaa. “Iwapasavyo” huwasilisha wajibu unaofaa katika muktadha huu bila ukali usio wa lazima.
- source_word: ἑνὶ ἑκάστῳ
  choice: kila mtu
  rationale: Usemi huu wa Kigiriki unamtazama kila mmoja kibinafsi. “Kila mtu” ni wazi, wa kawaida na huhifadhi nguvu hiyo ya ugawaji.
- source_word: ἀποκρίνεσθαι
  choice: kumjibu
  rationale: Kitenzi hiki kinamaanisha kutoa jibu katika mazungumzo. “Kumjibu” ni sawia ya moja kwa moja na ya asili.
theological_decisions:
- issue: Maana ya ἐν χάριτι katika mazungumzo
  choice: na neema
  alternative: kwa upole na fadhili
  rationale: “Na neema” huhifadhi utata halisi kati ya usemi wenye fadhili na mwangwi mpana wa neema katika matumizi ya Paulo, badala ya kuufanya usemi huo kuwa adabu pekee.
- issue: Uhusiano wa εἰδέναι na himizo lililotangulia
  choice: ili mjue
  alternative: mkijua
  rationale: Muundo wa Kigiriki unaweza kueleweka kama kusudi au matokeo. “Ili mjue” hutoa Kiswahili kinachoeleweka na kudumisha uhusiano wa karibu na agizo la namna ya kusema, bila kuingiza hitimisho la kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “Maneno yenu yawe…” ni wa kawaida na unaeleweka; sitiari ya chumvi imehifadhiwa na kufafanuliwa katika tanbihi. Viashiria vyote vya tanbihi vimewekwa katika maandishi.
