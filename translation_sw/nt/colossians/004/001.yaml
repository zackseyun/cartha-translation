id: COL.4.1
reference: Colossians 4:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οἱ κύριοι, τὸ δίκαιον καὶ τὴν ἰσότητα τοῖς δούλοις παρέχεσθε, εἰδότες ὅτι καὶ ὑμεῖς ἔχετε κύριον ἐν ⸀οὐρανῷ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/001.yaml
  text: Masters[a], provide your servants with what is right and fair, knowing that you also have a Lord in heaven.
translation:
  language: sw
  text: Ninyi mabwana, watendeeni watumwa wenu haki na usawa[a], mkijua kwamba ninyi pia mna Bwana mbinguni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “haki na uadilifu.” Neno la Kigiriki lililotafsiriwa “usawa” linaweza pia kumaanisha uadilifu au kutenda kwa haki.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ κύριοι
  choice: Ninyi mabwana
  rationale: Katika muktadha wa kanuni za nyumbani, κύριοι ni mabwana wa kibinadamu walio na mamlaka juu ya watumwa. “Mabwana” ni neno la kawaida na huendeleza ulinganifu na “Bwana” wa mbinguni bila kuwafanya mabwana hao waonekane kuwa wa kimungu.
- source_word: τὸ δίκαιον
  choice: yaliyo ya haki
  rationale: Kivumishi hiki kilichotumiwa kama nomino humaanisha kilicho sahihi au cha haki. “Yaliyo ya haki” ni Kiswahili cha asili na kinabaki na nguvu ya kimaadili ya neno hilo.
- source_word: τὴν ἰσότητα
  choice: ya usawa
  rationale: ἰσότης inaweza kumaanisha usawa, uadilifu, au utendaji usio na upendeleo. “Ya usawa” huhifadhi uwezekano muhimu wa maana ya moja kwa moja bila kuzuia wazo la kuwatendea kwa uadilifu; tanbihi inafafanua upana huo.
- source_word: τοῖς δούλοις
  choice: watumwa wenu
  rationale: Uhusiano wa kijamii kati ya mabwana na δοῦλοι umetajwa wazi, hivyo “watumwa” linaonyesha hali ya kufungwa bila kuipunguza kuwa utumishi wa kawaida. Kimilikishi “wenu” kinaeleweka kutokana na uhusiano huo na hufanya Kiswahili kiwe cha kawaida.
- source_word: παρέχεσθε
  choice: watendeeni
  rationale: Kitenzi kinaamuru mabwana kuwapa au kuwafanyia watumwa yaliyo ya haki na usawa. Katika Kiswahili, “watendeeni” huungana kwa kawaida na kirai hicho na kuwasilisha wajibu wa mwenendo, badala ya kutoa vitu pekee.
- source_word: εἰδότες
  choice: mkijua
  rationale: “Mkijua” huhifadhi muundo wa hali unaoonyesha ufahamu unaoandamana na, na pia kutoa msingi wa, amri.
- source_word: καὶ ὑμεῖς
  choice: ninyi pia
  rationale: Kirai hiki kinasisitiza kwamba mabwana wenyewe wako chini ya mamlaka; “ninyi pia” huhifadhi msisitizo huo.
- source_word: κύριον
  choice: Bwana
  rationale: Herufi kubwa hutofautisha Bwana wa mbinguni na mabwana wa kibinadamu na kuhifadhi uzito wa kimungu wa κύριος. Kutotumia kibainishi “mmoja” au “yule” huleta Kiswahili cha kawaida bila kulazimisha maana isiyokuwamo.
- source_word: ἐν οὐρανῷ
  choice: mbinguni
  rationale: “Mbinguni” ni tafsiri ya kawaida, wazi, na ya asili ya mahali panapoonyeshwa na ἐν οὐρανῷ.
theological_decisions:
- issue: Utafsiri wa δοῦλοι katika kanuni za nyumbani
  choice: watumwa
  alternative: watumishi
  rationale: Muktadha unataja mabwana moja kwa moja, hivyo hali ya utumwa ni muhimu. “Watumishi” ingepunguza ukali wa hali ya kijamii inayozungumziwa.
- issue: Utafsiri wa ἰσότητα
  choice: usawa
  alternative: uadilifu
  rationale: Neno la Kigiriki linaweza kuonyesha usawa au utendaji wa haki. “Usawa” huhifadhi mvutano muhimu wa kileksika katika matini kuu, huku tanbihi ikionyesha maana mbadala ya kutenda kwa uadilifu.
- issue: Ulinganifu kati ya κύριοι wa kibinadamu na κύριον wa mbinguni
  choice: mabwana … Bwana
  alternative: waajiri … Bwana
  rationale: Kurudia mzizi wa neno kunadumisha hoja ya mstari kwamba wale walio na mamlaka duniani nao wako chini ya Bwana wa mbinguni. “Waajiri” ingebadili taasisi ya kale kuwa uhusiano wa ajira wa kisasa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “Ninyi mabwana” unaweka wazi walengwa na msisitizo; “watendeeni” ni wa kawaida kuliko tafsiri ya moja kwa moja ya “wapeni” katika muktadha wa mwenendo. Alama ya tanbihi [a] imewekwa mara moja katika matini kuu.
