  yaml_path: translation/nt/colossians/004/017.yaml
  text: And tell Archippus[a], “See to the ministry that you received in the Lord, so that you may fulfill it.”
translation:
  language: sw
  text: Na mwambieni Arkipo, “Iangalie kwa makini huduma uliyoipokea katika Bwana[a], ili uitimize.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au huenda, “huduma uliyoipokea kutoka kwa Bwana.”
    reason: Uwezekano mwingine wa kuelewa kifungu cha ἐν κυρίῳ.
lexical_decisions:
- source_word: εἴπατε
  choice: mwambieni
  rationale: Ni amri ya wingi inayoelekezwa kwa waumini; “mwambieni” ni Kiswahili cha kawaida na huhifadhi wazo la kumwambia mtu ujumbe moja kwa moja.
- source_word: Ἀρχίππῳ
  choice: Arkipo
  rationale: Jina limetoholewa kwa tahajia iliyozoeleka katika tafsiri za Kiswahili.
- source_word: Βλέπε
  choice: iangalie kwa makini
  rationale: Amri hii ya umoja inamtaka Arkipo aipe huduma yake uangalifu wa kudumu. Neno “kwa makini” linaonyesha maana hiyo ya kiidioma bila kufanya “angalia” ionekane kuwa kutazama tu kwa macho.
- source_word: διακονίαν
  choice: huduma
  rationale: Neno hili linaweza kumaanisha utumishi, huduma, au jukumu lililokabidhiwa. “Huduma” ni pana na halibainishi cheo fulani kisichotajwa katika maandishi.
- source_word: παρέλαβες
  choice: uliyoipokea
  rationale: Huhifadhi maana ya kupewa au kukabidhiwa jukumu badala ya kudokeza kwamba Arkipo alijichagulia mwenyewe.
- source_word: ἐν κυρίῳ
  choice: katika Bwana
  rationale: Hufuata kwa karibu kihusishi ἐν na kuhifadhi uwezekano wa kuelewa kishazi hiki kuwa mazingira au uhusiano ambamo huduma ilipokewa, bila kukifanya kimaanishe chanzo pekee.
- source_word: ἵνα
  choice: ili
  rationale: “Ili” huonyesha kusudi kwa Kiswahili cha kawaida na kwa ufupi.
- source_word: πληροῖς
  choice: uitimize
  rationale: Hutoa wazo la kuitekeleza huduma kikamilifu au kuifikisha kwenye ukamilifu, huku ikirejelea moja kwa moja “huduma.”
theological_decisions:
- issue: Maana ya ἐν κυρίῳ
  choice: katika Bwana
  alternative: kutoka kwa Bwana
  rationale: Kigiriki kina ἐν, si kihusishi cha kawaida kinachoonyesha chanzo moja kwa moja. Tafsiri kuu kwa hiyo inadumisha kishazi “katika Bwana,” huku tanbihi ikitaja uwezekano wa kukielewa kuwa huduma ilitoka kwa Bwana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Iangalie kwa makini” limetumiwa kama usemi wa kawaida wa kuipa huduma uangalifu, na si kutazama kwa macho tu.
