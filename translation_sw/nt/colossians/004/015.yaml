base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/015.yaml
  text: Greet the brothers in Laodicea[a], and Nympha and the church in her house.
translation:
  language: sw
  text: Wasalimuni ndugu walioko Laodikia, na Nimfa, na kanisa lililo katika nyumba yake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati au mapokeo ya matini yana “Nimfas” (jina la kiume) na “kanisa lililo katika nyumba yake”; mengine yana “kanisa lililo katika nyumba yao.”
    reason: textual_variant
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Wasalimuni
  rationale: Kitenzi cha amri kwa wingi kinatoa agizo la moja kwa moja la kuwasalimu; “wasalimuni” ni Kiswahili cha kawaida, fasaha, na kinahifadhi nguvu ya amri.
- source_word: τοὺς ἐν Λαοδικείᾳ ἀδελφοὺς
  choice: ndugu walioko Laodikia
  rationale: “Ndugu” huhifadhi taswira ya uhusiano wa kifamilia katika jumuiya ya waamini na katika Kiswahili inaweza kuwahusu waamini wa kiume na wa kike kulingana na muktadha.
- source_word: Νύμφαν
  choice: Nimfa
  rationale: Usomaji wa SBLGNT unaeleweka moja kwa moja kuwa jina la kike Nympha; “Nimfa” ni uhawilishaji unaolingana na mfumo wa sauti na tahajia ya Kiswahili.
- source_word: τὴν κατ’ οἶκον αὐτῆς ἐκκλησίαν
  choice: kanisa lililo nyumbani mwake
  rationale: Kauli hii inaonyesha jumuiya ya kanisa iliyokuwa katika nyumba yake. Tafsiri hii ni ya asili katika Kiswahili na haiingizi wazi kitenzi “hukutana,” ambacho hakijaandikwa katika Kigiriki.
- source_word: ἐκκλησίαν
  choice: kanisa
  rationale: Katika muktadha wa barua za Paulo, neno hili linamaanisha jumuiya ya waamini; “kanisa” ndiyo istilahi ya kawaida na inayoeleweka zaidi katika Kiswahili.
theological_decisions:
- issue: Utambulisho/jinsia ya Νύμφαν na kiwakilishi kinachohusiana nayo
  choice: Nimfa ... kanisa lililo nyumbani mwake
  alternative: Nimfas ... kanisa lililo nyumbani kwake; au kanisa lililo nyumbani kwao
  rationale: Matini iliyochapishwa ya SBLGNT ina αὐτῆς, kiwakilishi cha kike umoja, hivyo usomaji wa moja kwa moja ni “Nimfa ... mwake.” Kwa kuwa tofauti za hati zinaunga mkono pia jinsia ya kiume au wingi, usomaji huo umehifadhiwa katika tanbihi badala ya kutatuliwa kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Pamoja na” huunganisha kwa uwazi walengwa wa salamu, na “lililo nyumbani mwake” huhifadhi usomaji wa kike wa matini kuu bila kuficha tofauti za hati.
