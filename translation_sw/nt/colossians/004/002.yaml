lexical_decisions:
- source_word: Τῇ προσευχῇ
  choice: katika kusali
  rationale: Kirai hiki kinarejelea desturi ya kuomba, si sala moja maalumu. Nomino ya kitendo “kusali” ni ya asili katika Kiswahili na inaendana vizuri na kitenzi “dumuni.”
- source_word: προσκαρτερεῖτε
  choice: Dumuni
  rationale: Amri ya wakati uliopo inadai kuendelea kwa uthabiti na kujitoa. “Dumuni” ni amri fupi, ya kawaida, na yenye heshima inayobeba wazo la kuendelea bila kukata tamaa.
- source_word: γρηγοροῦντες
  choice: mkikesha
  rationale: Kitenzi hiki huonyesha kuwa macho na kuwa makini; hapa ni namna ya kudumu katika sala, si lazima kukosa usingizi kihalisi. “Mkikesha” huhifadhi taswira ya kukaa macho na maana ya kuwa waangalifu katika muktadha wa sala.
- source_word: ἐν αὐτῇ
  choice: katika sala hiyo
  rationale: Kiwakilishi kinarejelea sala. Kurudia “sala” badala ya kutumia “hiyo” peke yake huondoa utata wa Kiswahili bila kubadili rejeleo la Kigiriki.
- source_word: ἐν εὐχαριστίᾳ
  choice: kwa shukrani
  rationale: Kirai kinaonyesha hali au namna inayoandamana na kukesha katika sala. “Kwa shukrani” ni Kiswahili cha asili kinachohifadhi wazo la moyo wa kushukuru.
