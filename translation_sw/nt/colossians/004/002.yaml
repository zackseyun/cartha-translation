  text: Devote yourselves to prayer[a], staying alert in it with thanksgiving,
translation:
  language: sw
  text: Dumuni katika kusali[a], mkikesha katika sala hiyo kwa shukrani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Endeleeni kwa uthabiti katika sala, mkiwa macho ndani yake kwa shukrani.”
