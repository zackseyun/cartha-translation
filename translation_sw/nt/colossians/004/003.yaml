  text: προσευχόμενοι ἅμα καὶ περὶ ἡμῶν, ἵνα ὁ θεὸς ἀνοίξῃ ἡμῖν θύραν τοῦ λόγου, λαλῆσαι τὸ μυστήριον τοῦ Χριστοῦ, δι’ ὃ καὶ δέδεμαι,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/003.yaml
  text: while also praying for us[a], that God may open to us a door for the word, to speak the mystery of Messiah, because of which I am also bound[d][c][b],
translation:
  language: sw
  text: na wakati huohuo mkiomba kwa ajili yetu pia, ili Mungu atufungulie mlango wa neno, ili tuseme siri ya Masihi[c], ambayo kwa sababu ya hiyo mimi pia nimefungwa[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: c
    text: Kigiriki, “Kristo”; hapa neno hilo lina maana ya cheo, “Masihi.”
    reason: Inahifadhi umbo la Kigiriki na kueleza kwa nini cheo kimetafsiriwa ‘Masihi’.
  - marker: d
    text: Au, “niko minyororoni pia.”
    reason: δέδεμαι kihalisi ni hali ya kufungwa na katika muktadha huu inaweza kueleza kifungo cha gerezani au minyororo.
lexical_decisions:
- source_word: προσευχόμενοι ἅμα καὶ περὶ ἡμῶν
  choice: wakati huohuo mkituombea sisi pia
  rationale: Inadumisha hali ya tendo linaloendelea ya kishiriki cha sasa na maana za wakati mmoja na nyongeza katika ἅμα καὶ, bila kuibadili sentensi kuwa amri mpya.
- source_word: ἵνα ὁ θεὸς ἀνοίξῃ ἡμῖν
  choice: ili Mungu atufungulie
  rationale: Muundo wa ‘-fungulia’ unawakilisha ἡμῖν kwa Kiswahili cha kawaida, huku ‘ili’ ikihifadhi kusudi au ombi linaloonyeshwa na ἵνα pamoja na hali tegemezi.
- source_word: θύραν τοῦ λόγου
  choice: mlango kwa ajili ya neno
  rationale: Inahifadhi sitiari ya mlango na maana ya λόγος kama neno au ujumbe unaotangazwa, badala ya kuifafanua moja kwa moja kuwa ‘nafasi’.
- source_word: λαλῆσαι
  choice: ili tuinene
  rationale: ‘Kunena’ ni tafsiri ya moja kwa moja lakini yenye hadhi ya λαλέω; kurudiwa kwa ‘ili’ kunaonyesha wazi kwamba kunena ndilo kusudi la mlango kufunguliwa.
- source_word: τὸ μυστήριον
  choice: siri
  rationale: Katika Kiswahili, ‘siri’ huwasilisha jambo la Mungu lililokuwa limefichwa na sasa linafunuliwa, bila kudokeza fumbo lisiloweza kueleweka.
- source_word: τοῦ Χριστοῦ
  choice: ya Masihi
  rationale: Χριστός hapa inafanya kazi kama cheo; ‘Masihi’ hudumisha maana hiyo badala ya kuitumia kama jina tu.
- source_word: δι’ ὃ καὶ δέδεμαι
  choice: ambayo kwa sababu yake nimefungwa pia
  rationale: ‘Kwa sababu yake’ huhifadhi maana ya kisababishi ya διά pamoja na kirejeshi kinachorejelea siri iliyotajwa; ‘nimefungwa’ hudumisha hali ya sasa iliyotokana na tendo lililotangulia katika timilifu tendwa.
theological_decisions:
- issue: Maana ya τοῦ Χριστοῦ
  choice: ya Masihi
  alternative: ya Kristo
  rationale: Neno la Kigiriki linafanya kazi kama cheo katika muktadha huu. ‘Masihi’ huonyesha cheo hicho wazi, huku tanbihi ikihifadhi umbo la jadi ‘Kristo’.
- issue: Sitiari ya θύραν τοῦ λόγου
  choice: mlango kwa ajili ya neno
  alternative: nafasi ya kutangaza ujumbe
  rationale: Tafsiri kuu inadumisha picha ya Paulo ya mlango na haifungi maana kwa ufafanuzi mmoja; tanbihi inaeleza uwezekano wa maana ya fursa.
- issue: Kirejeshi katika δι’ ὃ
  choice: kinarejelea siri ya Masihi
  alternative: kinaweza kueleweka kwa upana kuwa ujumbe unaotangazwa
  rationale: Kisarufi, ὃ ni umoja wa jinsi isiyo ya kiume wala ya kike na inalingana moja kwa moja na μυστήριον, lakini kwa maana siri hiyo ndiyo maudhui ya ujumbe; tafsiri haiongezi nomino nyingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo unaanza kwa herufi ndogo kwa sababu kishiriki hiki kinaendeleza himizo la mstari uliotangulia. Sitiari ya ‘mlango’ na uhusiano wa kisarufi wa ‘siri ya Masihi’ vimehifadhiwa bila kufafanuliwa kupita kiasi.
