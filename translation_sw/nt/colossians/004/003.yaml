  rationale: Revised for idiomatic Standard East African Swahili while preserving the participial connection to the preceding exhortation, the simultaneous/additive sense of ἅμα καὶ, the metaphor of a “door of the word,” the purpose infinitive, and the causal force of δι’ ὃ. Footnote a is no longer needed because its alternative substantially duplicates the revised main phrasing; footnote b is not needed because “mlango wa neno” is retained without explanatory expansion in the verse itself.
