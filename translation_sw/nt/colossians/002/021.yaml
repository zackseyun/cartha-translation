  text: “Usishike[a], wala usionje, wala usiguse,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Usiguse, wala usionje, wala usiguse.” Kitenzi cha kwanza (ἅψῃ) kinaweza pia kutafsiriwa “gusa” au “kamata”; hapa “shika” limetumiwa ili kukitofautisha na kitenzi cha mwisho θίγῃς (“gusa”).
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ
  choice: Usi-
  rationale: μή pamoja na hali tegemezi ya aoristi huunda katazo; kiambishi cha Kiswahili “usi-” kinawasilisha katazo hilo kwa kawaida na kwa ufupi.
- source_word: ἅψῃ
  choice: shike
  rationale: ἅπτω katika umbo la kati inaweza kumaanisha “gusa” au “shika.” “Shika” inadumisha tofauti yake na θίγῃς, iliyotafsiriwa “gusa,” bila kuifanya sentensi kuwa nzito.
- source_word: μηδὲ
  choice: wala
  rationale: “Wala” ni kiunganishi cha kawaida cha Kiswahili kinachounganisha mfululizo wa makatazo hasi na kuhifadhi nguvu yake ya kujumuisha.
- source_word: γεύσῃ
  choice: usionje
  rationale: γεύομαι humaanisha moja kwa moja “onja”; maana hiyo inafaa katika muktadha wa masharti ya kujinyima.
- source_word: θίγῃς
  choice: usiguse
  rationale: θιγγάνω kwa kawaida humaanisha “gusa.” Tafsiri hii inadumisha tofauti ya kileksika na ἅψῃ, iliyotafsiriwa “shika.”
theological_decisions:
- issue: Asili ya makatazo katika muktadha
  choice: Kuyawasilisha kama mfululizo mfupi wa makatazo unaofanana na nukuu, bila maelezo ya ziada.
  alternative: Kupanua kuwa “Usishike hiki, usionje kile, wala usiguse” au kuyaunganisha wazi na kanuni za wanadamu.
  rationale: Kigiriki cha mstari huu ni kifupi na kina makatazo hayo peke yake. Tafsiri inahifadhi ukali na ufupi huo bila kuingiza ufafanuzi kutoka mistari inayouzunguka.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mfululizo wa “Usishike … usionje … usiguse” ni mfupi, wa kawaida, na unahifadhi mtindo wa ghafla wa Kigiriki.
