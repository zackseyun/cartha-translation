  yaml_path: translation/nt/colossians/002/016.yaml
  text: Therefore[a], let no one judge you in food or in drink[c][b], or with regard to a festival or a new moon or Sabbaths.
translation:
  language: sw
  text: Kwa hiyo, mtu yeyote asiwahukumu kuhusu chakula au kinywaji,[a] au kuhusu sikukuu, mwandamo wa mwezi, au Sabato.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, kuhusu masharti ya chakula na kinywaji.
    reason: cultural_note
  - marker: b
    text: 'Mfuatano “sikukuu, mwandamo wa mwezi, au Sabato” unaakisi kalenda takatifu ya Kiyahudi: maadhimisho ya kila mwaka, kila mwezi, na kila juma.'
    reason: cross_reference
lexical_decisions:
- source_word: Μὴ οὖν τις
  choice: Kwa hiyo, mtu yeyote asi-
  rationale: οὖν inaonyesha hitimisho linalotokana na hoja iliyotangulia, hivyo ‘Kwa hiyo’ linafaa. Μὴ pamoja na κρινέτω huunda katazo, nalo τις katika muundo huu limetafsiriwa kwa Kiswahili cha kawaida kuwa ‘mtu yeyote asi-’.
- source_word: ὑμᾶς κρινέτω
  choice: asiwahukumu
  rationale: κρίνω hapa ni kutoa hukumu juu ya waamini kwa msingi wa desturi zilizotajwa. ‘Asiwahukumu’ ni fupi, ya asili, na haiendi mbali hadi kudai kwamba desturi zenyewe zimebatilishwa.
- source_word: ἐν βρώσει ἢ ἐν πόσει
  choice: kuhusu chakula au kinywaji
  rationale: βρῶσις na πόσις zinaweza kumaanisha tendo la kula na kunywa au chakula na kinywaji. Katika orodha hii ya mambo ya kuzingatiwa, maana ya makundi ya chakula na kinywaji inafaa zaidi; ‘kuhusu’ huwasilisha kazi ya ἐν kwa Kiswahili cha asili.
- source_word: ἐν μέρει ἑορτῆς
  choice: kuhusu sikukuu
  rationale: ἐν μέρει hapa ni nahau yenye maana ya ‘kuhusiana na’ au ‘katika jambo la,’ si ‘katika sehemu ya.’ ἑορτή ni sikukuu ya kidini.
- source_word: νουμηνίας
  choice: mwandamo wa mwezi
  rationale: νουμηνία hurejelea mwanzo wa mwezi ulioadhimishwa kwa kuonekana kwa mwezi mpya. ‘Mwandamo wa mwezi’ ni usemi sanifu na wenye kueleweka katika Kiswahili.
- source_word: σαββάτων
  choice: Sabato
  rationale: Ingawa neno la Kigiriki liko katika wingi, hapa ni sehemu ya mlolongo wa kawaida wa kalenda takatifu—sikukuu, mwandamo wa mwezi, na Sabato. Kiswahili hutumia ‘Sabato’ kwa kawaida kama jina la aina ya siku au maadhimisho bila kulazimisha alama ya wingi.
theological_decisions:
- issue: Asili na hadhi ya mambo yaliyotajwa
  choice: Mstari unakataza watu kuwahukumu waamini kuhusu masharti ya chakula na kinywaji na kuhusu maadhimisho ya kalenda.
  alternative: Kutangaza kwamba maadhimisho yote hayo yamebatilishwa kabisa, au kwamba mstari unahusu tu masharti ya kujinyima yaliyotungwa na wanadamu.
  rationale: Kigiriki kinalenga tendo la kuwahukumu watu ‘kuhusu’ mambo haya. Mstari huu peke yake haufafanui kikamilifu kama maadhimisho hayo ni batili kiasili au hayapaswi tu kuwa msingi wa hukumu; tafsiri inalinda mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na rahisi kueleweka. Muundo ‘mtu yeyote asiwahukumu’ ni wa kawaida zaidi kuliko tafsiri yenye kukakamaa ya neno kwa neno. ‘Mwandamo wa mwezi’ huhifadhi maana ya maadhimisho ya mwezi mpya, na ‘Sabato’ huhifadhi istilahi ya kibiblia inayojulikana.
