  text: Εἰ ἀπεθάνετε σὺν Χριστῷ ἀπὸ τῶν στοιχείων τοῦ κόσμου, τί ὡς ζῶντες ἐν κόσμῳ δογματίζεσθε·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/020.yaml
  text: 'If you died with the Messiah from the elemental principles of the world[a], why, as if living in the world[b], are you submitting yourselves to decrees:'
translation:
  language: sw
  text: 'Ikiwa mlikufa pamoja na Masihi mbali na misingi ya ulimwengu[a], kwa nini, kana kwamba mnaishi ulimwenguni, mnajiweka chini ya masharti[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “roho za ulimwengu”; pia yaweza kuwa, “mambo ya msingi ya ulimwengu.”
    reason: alternative_reading
  - marker: b
    text: Au, “mnawekewa masharti?”
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ
  choice: Ikiwa
  rationale: Huhifadhi muundo wa sharti wa Kigiriki bila kuamua kimya kimya kwamba maana ni ‘kwa kuwa,’ ingawa katika muktadha Paulo huenda anachukulia jambo hilo kuwa kweli.
- source_word: ἀπεθάνετε σὺν Χριστῷ
  choice: mlikufa pamoja na Masihi
  rationale: Wakati uliopita unaonyesha tukio la uamuzi, na ‘Masihi’ huhifadhi maana ya Χριστός kama cheo.
- source_word: ἀπὸ τῶν στοιχείων τοῦ κόσμου
  choice: na kutengwa na misingi ya ulimwengu
  rationale: ‘Kutengwa na’ huwasilisha maana ya ἀπό ya kuachana au kuwekwa mbali. ‘Misingi’ huacha στοιχεῖα ikiwa na upana wa maana kuliko tafsiri inayoiweka wazi kuwa kanuni tu au roho tu.
- source_word: τί ὡς ζῶντες ἐν κόσμῳ
  choice: kwa nini ... kana kwamba mnaishi ulimwenguni
  rationale: Hutoa swali la balagha kwa Kiswahili cha kawaida na kuhifadhi wazo la ὡς la hali inayodhaniwa au kulinganishwa.
- source_word: δογματίζεσθε
  choice: mnajitiisha kwa masharti
  rationale: Huwasilisha maana ya kuongozwa na maagizo pamoja na uwezekano wa hali ya kati ambapo wasomaji wenyewe wanashiriki katika kujitiisha.
theological_decisions:
- issue: Maana ya στοιχεῖα katika matumizi ya Paulo
  choice: misingi ya ulimwengu
  alternative: roho za msingi za ulimwengu; mambo ya msingi ya ulimwengu
  rationale: Neno linaweza kumaanisha vipengele au mafundisho ya msingi, na pia linaweza kuwa na dokezo la nguvu za kiroho. Tafsiri kuu haifungi maana katika mtazamo mmoja, na tanbihi huhifadhi njia nyingine halali.
- issue: Sauti ya δογματίζεσθε
  choice: mnajitiisha kwa masharti
  alternative: mnawekewa masharti?
  rationale: Umbo la Kigiriki linaweza kueleweka kwa maana ya kati au ya kutendwa. Tafsiri kuu huonyesha ushiriki wa wasomaji bila kufuta uwezekano wa wao kuwekewa masharti, ambao umetajwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mpangilio wa swali umefanywa wa kawaida kwa Kiswahili huku masharti yote ya Kigiriki yakihifadhiwa. Alama za tanbihi [a] na [b] zimewekwa kwenye vipashio vinavyohusika moja kwa moja.
