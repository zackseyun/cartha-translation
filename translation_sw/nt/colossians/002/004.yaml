  yaml_path: translation/nt/colossians/002/004.yaml
  text: I say this so that no one may deceive you with persuasive argument.
translation:
  language: sw
  text: Ninasema hili ili mtu yeyote asiwadanganye kwa hoja yenye kushawishi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa hoja inayoonekana kuwa ya kweli” au “kwa maneno yenye kushawishi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: hili
  rationale: Kiwakilishi hiki cha kuonyesha, cha umoja na kisicho na jinsia katika Kigiriki, kinaelekeza kwa kauli au hoja iliyotangulia. “Hili” kinahifadhi umoja wake bila kufafanua kupita kiasi upeo wa rejeo.
- source_word: λέγω
  choice: ninasema
  rationale: Wakati uliopo wa kitenzi umetafsiriwa kwa hali ya sasa ya Kiswahili, kwa usemi wa moja kwa moja na wa kawaida.
- source_word: ἵνα
  choice: ili
  rationale: “Ili” linaonyesha kusudi la kusema kwa Paulo kwa uwazi na kwa Kiswahili cha kawaida.
- source_word: μηδεὶς
  choice: mtu yeyote asi-
  rationale: Muundo huu wa Kiswahili pamoja na kitenzi hasi unatoa maana ya “asiwepo mtu” kwa njia ya asili.
- source_word: ὑμᾶς
  choice: wa-
  rationale: Kiambishi cha yambwa “wa-” kinaonyesha wazi kwamba wanaozungumziwa ni watu wengi.
- source_word: παραλογίζηται
  choice: asiwadanganye
  rationale: Kitenzi hiki kinamaanisha kupotosha au kudanganya kwa hoja isiyo sahihi. “Kudanganya” ni wazi kwa wasomaji wa kawaida huku kirai kinachofuata kikionyesha njia inayotumiwa.
- source_word: ἐν πιθανολογίᾳ
  choice: kwa hoja yenye kushawishi
  rationale: “Kwa” linaonyesha njia au namna, na “hoja yenye kushawishi” linawakilisha usemi au hoja inayoonekana yenye nguvu bila kudokeza kwamba ni ya kweli.
theological_decisions:
- issue: Asili ya onyo katika παραλογίζηται ἐν πιθανολογίᾳ
  choice: Onyo la jumla dhidi ya kudanganywa kwa hoja inayoshawishi
  alternative: Onyo linalolenga hasa falsafa ya uongo au ufasaha wa maneno pekee
  rationale: Aya yenyewe haitaji mfumo fulani wa mafundisho. Tafsiri haifinyangi onyo hilo kuwa polemiki maalumu kuliko inavyoruhusu maandishi ya Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo ni mfupi na wa moja kwa moja; wingi wa walengwa unaonekana katika kiambishi “wa-”. Alama ya tanbihi [a] imewekwa baada ya kirai kinachohusika.
