  text: Kwa maana ndani yake utimilifu wote wa Uungu unakaa kwa jinsi ya mwili,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “utimilifu mzima wa Uungu unakaa ndani yake kwa jinsi ya mwili.”
    reason: Mbadala huu wa kileksika unaonyesha njia nyingine halali ya kuwakilisha πᾶν τὸ πλήρωμα na mpangilio wa kirai bila kubadili maana ya msingi.
lexical_decisions:
- source_word: ὅτι
  choice: Kwa maana
  rationale: Katika muktadha, neno hili linatoa sababu ya onyo lililotangulia; “Kwa maana” linaonyesha uhusiano huo wa kisababishi kwa Kiswahili cha kawaida.
- source_word: ἐν αὐτῷ
  choice: ndani yake
  rationale: Hii ni tafsiri ya moja kwa moja ya kirai cha mahali kinachomrejelea Kristo, bila kuongeza wazo la upekee lisilokuwamo wazi katika Kigiriki.
- source_word: κατοικεῖ
  choice: unakaa
  rationale: “Unakaa” linadumisha maana ya kuwapo kwa kudumu na kwa uthabiti, si tukio la muda mfupi.
- source_word: πᾶν τὸ πλήρωμα
  choice: utimilifu wote
  rationale: Muundo huu unaonyesha jumla kamili ya utimilifu, huku ukibaki wa kawaida na wenye kueleweka katika Kiswahili.
- source_word: τῆς θεότητος
  choice: wa Uungu
  rationale: “Uungu” hapa unaonyesha hali au uhalisi wa kuwa Mungu, si sifa za kimungu kwa maana dhaifu tu. Herufi kubwa husaidia kuonyesha rejeo kwa uhalisi wa Mungu bila kuongeza maelezo yasiyokuwamo katika matini.
- source_word: σωματικῶς
  choice: kwa mwili
  rationale: Kirai hiki kinawakilisha kielezi cha Kigiriki kwa ufupi na kuhifadhi uzito pamoja na uwezekano wake wa maana bila kukifafanua kupita kiasi kuwa “katika umbo la mwili” au “katika mwili fulani.”
theological_decisions:
- issue: Nguvu ya Kikristo ya θεότης na σωματικῶς
  choice: Aya inathibitisha kwamba utimilifu wote wa uhalisi wa Uungu unakaa ndani ya Kristo kwa mwili.
  alternative: Aya inazungumzia tu sifa za kimungu au kuwapo kwa Mungu ndani ya Kristo bila kudokeza Uungu kamili.
  rationale: θεότης ni neno lenye nguvu linaloonyesha Uungu wenyewe badala ya sifa za kimungu kwa ujumla, na σωματικῶς linaonyesha kukaa huko kuwa kwa mwili. Tafsiri haidhoofishi dai hili wala kulifafanua zaidi ya matini.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni mfupi kama Kigiriki; “unakaa” ni wa kawaida lakini bado una uzito wa kiteolojia. Alama ya tanbihi [a] imewekwa katika matini kuu.
