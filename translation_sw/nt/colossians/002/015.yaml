  text: ἀπεκδυσάμενος τὰς ἀρχὰς καὶ τὰς ἐξουσίας ἐδειγμάτισεν ἐν παρρησίᾳ, θριαμβεύσας αὐτοὺς ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/015.yaml
  text: Having disarmed the rulers and the authorities, he made a public spectacle of them, triumphing over them in him.
translation:
  language: sw
  text: Akiisha kuwapokonya wakuu na mamlaka silaha zao, aliwaaibisha hadharani, akipata ushindi juu yao katika yeye.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa njia yake.” Rejeo la “yeye” linaweza kueleweka kuwa Kristo; wengine hulihusisha na msalaba uliotajwa katika aya iliyotangulia.
    reason: Kuhifadhi utata wa rejeo la ἐν αὐτῷ bila kulazimisha tafsiri ya “msalabani” katika maandishi makuu.
lexical_decisions:
- source_word: ἀπεκδυσάμενος
  choice: akiisha kuvua ... silaha zao
  rationale: Kitenzi kinaweza kumaanisha kuvua au kupokonya. Katika muktadha wa mamlaka za kiroho zilizoshindwa, usemi huu wa Kiswahili unaonyesha kunyang'anywa uwezo wa kupigana bila kupoteza taswira ya kuvua.
- source_word: τὰς ἀρχὰς καὶ τὰς ἐξουσίας
  choice: mamlaka na watawala
  rationale: Jozi hii inarejelea nguvu au viumbe vyenye mamlaka; tafsiri inadumisha istilahi mbili tofauti bila kuzitambulisha kwa undani kupita maandishi.
- source_word: ἐδειγμάτισεν ἐν παρρησίᾳ
  choice: aliwaonyesha hadharani kuwa wameshindwa
  rationale: Hutoa kwa lugha ya kawaida maana ya kuwaweka wazi mbele ya wote kama fedheha au tamasha la kushindwa.
- source_word: θριαμβεύσας αὐτοὺς
  choice: akiwashangilia kwa ushindi
  rationale: Kitenzi kinatokana na taswira ya maandamano ya ushindi; Kiswahili hiki kinawasilisha ushindi dhidi yao huku kikidokeza maonyesho ya hadharani.
- source_word: ἐν αὐτῷ
  choice: ndani yake
  rationale: Kiwakilishi cha Kigiriki ni cha kiume au kisicho na jinsi katika umbo hili na rejeo lake lina utata; tafsiri ya moja kwa moja inalinda uwezekano wa kumrejelea Kristo badala ya kulazimisha 'msalabani' au 'katika huo'.
theological_decisions:
- issue: Mtendaji wa vitenzi
  choice: Kiwakilishi kisichotajwa 'ali-' kinaachwa kama katika muktadha, kwa uwezekano mkubwa kikimrejelea Mungu.
  alternative: Kumtaja Mungu waziwazi.
  rationale: Kigiriki hakimtaji mtendaji katika aya hii; kumwingiza kwa jina kungeondoa utegemezi wa kisarufi kwa aya iliyotangulia.
- issue: Rejeo la ἐν αὐτῷ
  choice: ndani yake
  alternative: kwa njia ya msalaba / ndani yake huyo (Kristo)
  rationale: Kifungu kinaweza kueleweka kuwa ushindi ulifanyika katika Kristo au kwa njia ya msalaba uliotajwa katika aya iliyotangulia. Maandishi makuu yanahifadhi umbo lisiloamua kabisa, na tanbihi inaeleza utata.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inadumisha mfuatano wa vishazi vya Kigiriki lakini inaeleza taswira ya ushindi kwa namna inayoeleweka kwa msomaji wa kawaida.
