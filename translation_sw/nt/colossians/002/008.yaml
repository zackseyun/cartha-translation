id: COL.2.8
reference: Colossians 2:8
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Βλέπετε μή τις ὑμᾶς ἔσται ὁ συλαγωγῶν διὰ τῆς φιλοσοφίας καὶ κενῆς ἀπάτης κατὰ τὴν παράδοσιν τῶν ἀνθρώπων, κατὰ τὰ στοιχεῖα τοῦ κόσμου καὶ οὐ κατὰ Χριστόν·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/008.yaml
  text: See to it that no one takes you captive through philosophy and empty deceit[a], according to human tradition, according to the elemental principles of the world[b], and not according to Messiah.
translation:
  language: sw
  text: Jihadharini mtu yeyote asiwateke mateka kwa njia ya falsafa na udanganyifu mtupu, kwa kufuata mapokeo ya wanadamu, kwa kufuata kanuni za awali za ulimwengu[a], wala si kwa kumfuata Masihi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nguvu za kiroho za ulimwengu.” Kirai cha Kigiriki kinaweza kumaanisha kanuni au vipengele vya awali, au nguvu za kiroho za ulimwengu.
    reason: alternative_reading
  - marker: b
    text: Kigiriki, “Kristo”; hapa limetafsiriwa “Masihi” kwa sababu maana yake kama cheo ni dhahiri.
    reason: lexical_alternative
lexical_decisions:
- source_word: Βλέπετε μή τις
  choice: Jihadharini mtu yeyote asi-
  rationale: Kitenzi cha amri kina nguvu ya onyo; muundo huu ni wa kawaida katika Kiswahili na unaonyesha tishio linalowezekana.
- source_word: ἔσται ὁ συλαγωγῶν
  choice: asiwateke mateka
  rationale: Neno la Kigiriki lina taswira ya kuwachukua watu kama nyara. ‘Kuwateka mateka’ huiwasilisha kwa Kiswahili cha kawaida bila kuondoa taswira hiyo.
- source_word: διὰ τῆς φιλοσοφίας καὶ κενῆς ἀπάτης
  choice: kwa njia ya falsafa na udanganyifu mtupu
  rationale: ‘Kwa njia ya’ huonyesha chombo au njia, huku viambajengo viwili vya Kigiriki vikidumishwa bila kulazimisha udanganyifu kuwa ufafanuzi wa falsafa.
- source_word: κατὰ τὴν παράδοσιν τῶν ἀνθρώπων
  choice: unaofuata mapokeo ya wanadamu
  rationale: κατά huonyesha kipimo au mwelekeo. ‘Mapokeo ya wanadamu’ ni ya kijinsia-jumuishi na ya kawaida katika Kiswahili.
- source_word: κατὰ τὰ στοιχεῖα τοῦ κόσμου
  choice: misingi ya ulimwengu
  rationale: στοιχεῖα linaweza kumaanisha misingi ya awali au nguvu za kiroho za ulimwengu. ‘Misingi’ haisisitizi tafsiri ya viumbe vya kiroho, nayo tanbihi huhifadhi uwezekano huo.
- source_word: οὐ κατὰ Χριστόν
  choice: wala haumfuati Masihi
  rationale: κατά ya mwisho inadumisha utofautishaji wa kiwango au mwelekeo; Χριστός limetafsiriwa kama cheo ‘Masihi’ kwa kuwa maana ya cheo ni dhahiri hapa.
theological_decisions:
- issue: Maana ya στοιχεῖα τοῦ κόσμου
  choice: misingi ya ulimwengu
  alternative: roho za msingi za ulimwengu
  rationale: Kirai hiki kinaweza kurejelea kanuni au vipengele vya msingi, au nguvu za kiroho za ulimwengu. Matini kuu haikati shauri kuwa ni viumbe binafsi; tanbihi inahifadhi tafsiri hiyo muhimu.
- issue: Uwasilishaji wa Χριστός
  choice: Masihi
  alternative: Kristo
  rationale: Neno la Kigiriki ni cheo kinachomaanisha aliyetiwa mafuta; ‘Masihi’ huonyesha maana hiyo ya cheo katika utofautishaji huu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa ‘unaofuata … wala haumfuati …’ unahusisha falsafa na udanganyifu na viwango vinavyofuata, huku ukihifadhi utofautishaji wa Kigiriki.
