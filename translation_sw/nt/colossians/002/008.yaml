revisions:
- from: Jihadharini mtu yeyote asiwateke mateka kwa njia ya falsafa na udanganyifu mtupu, unaofuata mapokeo ya wanadamu na misingi ya ulimwengu[a], wala haumfuati Masihi[b].
  to: Jihadharini mtu yeyote asiwateke mateka kwa njia ya falsafa na udanganyifu mtupu, kwa kufuata mapokeo ya wanadamu, kwa kufuata kanuni za awali za ulimwengu[a], wala si kwa kumfuata Masihi[b].
  rationale: The revision retains the warning and plunder/captivity imagery, while using parallel “kwa kufuata …” phrases to reflect each occurrence of κατά and to make clear that the philosophical deception is measured by human tradition and worldly elementary principles, not by Messiah. The wording for στοιχεῖα remains noncommittal in the main text, and the alternative cosmic-power reading is retained in an idiomatic footnote.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:09:58Z'
review_pass:
  verdict: revise
  source_fidelity: Draft correctly conveys the warning, captivity metaphor, philosophy, empty deceit, human tradition, and Messiah. However, the relative clauses “unaofuata … wala haumfuati” grammatically make “udanganyifu” alone the subject and render the final κατά Χριστόν as personally following Messiah, rather than preserving the parallel standards governing the deceptive teaching.
  naturalness: The opening is natural Standard East African Swahili. The latter relative-clause construction is syntactically awkward because a singular relative verb follows the coordinated phrase “falsafa na udanganyifu,” and “haumfuati Masihi” does not naturally express “not according to Messiah” in this context.
  terminology: “Falsafa,” “udanganyifu mtupu,” “mapokeo ya wanadamu,” and “Masihi” are suitable. “Misingi ya ulimwengu” is possible but overly broad; “kanuni za awali za ulimwengu” better represents the non-personal/basic-principles sense while retaining the disputed nature through the footnote. The footnote’s “roho za msingi” is unnatural and should be “nguvu za kiroho za ulimwengu” or “roho za ulimwengu.”
  issues:
  - severity: medium
    issue: The coordinated Greek standards introduced by κατά are recast as singular relative clauses.
    rationale: “unaofuata … wala haumfuati” agrees only with “udanganyifu,” obscuring that the characterization applies to the philosophy-and-deceit complex and weakening the parallel contrast with Christ.
  - severity: medium
    issue: “haumfuati Masihi” mistranslates οὐ κατὰ Χριστόν.
    rationale: The Greek means that the teaching is not in accordance with Messiah/Christ, not simply that it does not follow him as a person. Repeating “kwa kufuata” preserves the series of standards idiomatically.
  - severity: low
    issue: Footnote alternative is not idiomatic Swahili.
    rationale: “Roho za msingi za ulimwengu” is an unnatural designation for the cosmic-power reading and does not correspond well to the English audit trail’s “elemental spirits.”
  revised_text: Jihadharini mtu yeyote asiwateke mateka kwa njia ya falsafa na udanganyifu mtupu, kwa kufuata mapokeo ya wanadamu, kwa kufuata kanuni za awali za ulimwengu[a], wala si kwa kumfuata Masihi[b].
  revised_footnotes:
  - marker: a
    text: Au, “nguvu za kiroho za ulimwengu.” Kirai cha Kigiriki kinaweza kumaanisha kanuni au vipengele vya awali, au nguvu za kiroho za ulimwengu.
    reason: alternative_reading
  - marker: b
    text: Kigiriki, “Kristo”; hapa limetafsiriwa “Masihi” kwa sababu maana yake kama cheo ni dhahiri.
    reason: lexical_alternative
  revision_rationale: The revision retains the warning and plunder/captivity imagery, while using parallel “kwa kufuata …” phrases to reflect each occurrence of κατά and to make clear that the philosophical deception is measured by human tradition and worldly elementary principles, not by Messiah. The wording for στοιχεῖα remains noncommittal in the main text, and the alternative cosmic-power reading is retained in an idiomatic footnote.
