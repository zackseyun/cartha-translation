  text: μηδεὶς ὑμᾶς καταβραβευέτω θέλων ἐν ταπεινοφροσύνῃ καὶ θρησκείᾳ τῶν ἀγγέλων, ⸀ἃ ἑόρακεν ἐμβατεύων, εἰκῇ φυσιούμενος ὑπὸ τοῦ νοὸς τῆς σαρκὸς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/018.yaml
  text: Let no one disqualify you[a], delighting in humility and the worship of angels, dwelling on what he has seen, vainly puffed up by the mind of his flesh[c][b],
translation:
  language: sw
  text: Mtu yeyote asiwanyime tuzo, huku akipendezwa na unyenyekevu na ibada kwa malaika[a], akijishughulisha na mambo aliyoyaona[b][c], akijivuna bure kwa mawazo ya mwili wake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ibada ya malaika” au “ibada pamoja na malaika.” Kifungu cha Kigiriki kinaweza kueleweka kwa njia zaidi ya moja.
    reason: alternative_reading
  - marker: b
    text: Baadhi ya hati zina “mambo ambayo hajayaona,” na hivyo maana inaweza kuwa, “akijishughulisha na mambo ambayo hajayaona.”
    reason: textual_variant
  - marker: c
    text: Kitenzi cha Kigiriki hapa ni adimu na kigumu; kinaweza pia kutafsiriwa “akieleza kwa undani mambo aliyoyaona” au “akiingia katika mambo aliyoyaona.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καταβραβευέτω
  choice: asiwafanye mkose tuzo
  rationale: Kitenzi hiki kina taswira ya mwamuzi anayetoa uamuzi dhidi ya mtu na hivyo kumnyima tuzo. Kauli hii ni ya asili katika Kiswahili na huhifadhi taswira ya tuzo kuliko neno la kiufundi pekee.
- source_word: θέλων ἐν
  choice: akipendezwa na
  rationale: Katika muundo huu θέλων huenda ikaonyesha kupenda au kufurahia desturi zinazotajwa, si nia ya kawaida tu.
- source_word: ταπεινοφροσύνῃ
  choice: unyenyekevu
  rationale: Hili ndilo neno la kawaida, huku muktadha wa onyo ukiruhusu wasomaji kutambua kwamba huenda ni unyenyekevu wa kujionyesha au wa kujitesa bila kuingiza tafsiri hiyo katika matini.
- source_word: θρησκείᾳ τῶν ἀγγέλων
  choice: ibada kwa malaika
  rationale: Husoma genitivi kama lengo la ibada, yaani ibada inayoelekezwa kwa malaika. Utata halisi wa kisarufi umehifadhiwa katika tanbihi.
- source_word: ἃ ἑόρακεν ἐμβατεύων
  choice: akisisitiza mambo aliyoyaona
  rationale: ἐμβατεύων ni kitenzi adimu na kigumu. 'Akisisitiza' huwasilisha kwa Kiswahili cha sasa wazo linalowezekana la kukazia au kueleza kwa kina maono, bila kudai uhakika usiokuwapo.
- source_word: εἰκῇ φυσιούμενος
  choice: amejivuna bure
  rationale: Huhifadhi dhana ya kiburi kisicho na msingi na kisicho na faida, ingawa sitiari ya kuvimba inaelezwa kwa nahau ya kawaida ya Kiswahili.
- source_word: νοὸς τῆς σαρκὸς αὐτοῦ
  choice: fikira za mwili wake
  rationale: Huhifadhi nomino νοῦς kama 'fikira' na σάρξ kama 'mwili,' bila kuibadili kuwa ufafanuzi wa kimafundisho kama 'asili ya dhambi.'
theological_decisions:
- issue: Maana ya θρησκείᾳ τῶν ἀγγέλων
  choice: ibada inayoelekezwa kwa malaika
  alternative: dini ya malaika; ibada pamoja na malaika
  rationale: Usomaji wa lengo la genitivi ni wa moja kwa moja na unafaa muktadha wa onyo, lakini muundo wa Kigiriki unaweza kueleweka kwa njia nyingine; kwa hiyo mbadala zimewekwa wazi katika tanbihi.
- issue: Maana ya σάρξ katika τῆς σαρκὸς αὐτοῦ
  choice: mwili
  alternative: asili ya dhambi
  rationale: Tafsiri halisi huhifadhi mvutano wa msamiati wa Paulo na haileti kimya-kimya ufafanuzi maalumu wa kimafundisho.
- issue: Tofauti ya matini kuhusu ἃ ἑόρακεν
  choice: mambo aliyoyaona
  alternative: mambo ambayo hajayaona
  rationale: Matini ya SBLGNT imefuatwa katika matini kuu, huku usomaji wa baadhi ya hati ukitajwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo mrefu wa Kigiriki umegawanywa kwa nuktamkato ili kubaki wazi. Tanbihi zote zimewekewa alama katika matini kuu.
