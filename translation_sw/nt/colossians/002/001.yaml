  text: Θέλω γὰρ ὑμᾶς εἰδέναι ἡλίκον ἀγῶνα ἔχω ⸀ὑπὲρ ὑμῶν καὶ τῶν ἐν Λαοδικείᾳ καὶ ὅσοι οὐχ ἑόρακαν τὸ πρόσωπόν μου ἐν σαρκί,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/001.yaml
  text: For I want you to know how great a struggle I have for you and for those in Laodicea[a], and for all who have not seen my face in the flesh,
translation:
  language: sw
  text: Kwa maana nataka mjue jinsi pambano nililo nalo kwa ajili yenu lilivyo kubwa, na kwa ajili ya wale walioko Laodikia, na wote ambao hawajauona uso wangu katika mwili[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ana kwa ana” au “kimwili.” Kigiriki kinasema kihalisi “katika mwili,” kikirejelea hapa uwepo wa kimwili.
    reason: lexical_alternative
lexical_decisions:
- source_word: Θέλω γὰρ ὑμᾶς εἰδέναι
  choice: Kwa maana nataka mjue
  rationale: ‘Kwa maana’ linaendeleza hoja iliyotangulia; ‘nataka mjue’ ni Kiswahili cha kawaida na cha moja kwa moja kwa muundo wa θέλω pamoja na infinitivu.
- source_word: ἡλίκον ἀγῶνα ἔχω
  choice: jinsi pambano nililo nalo ... lilivyo kubwa
  rationale: ἡλίκον husisitiza ukubwa, na ἀγών hapa ni juhudi au pambano lenye nguvu, si lazima mashindano halisi ya riadha. Muundo huu unahifadhi taswira na mkazo wa Kigiriki.
- source_word: ὑπὲρ ὑμῶν
  choice: kwa ajili yenu
  rationale: ὑπέρ inaonyesha kwamba pambano hilo ni kwa manufaa au ni kwa niaba ya wasomaji.
- source_word: τῶν ἐν Λαοδικείᾳ
  choice: wale walio Laodikia
  rationale: Kirai chenye kibainishi kinawataja watu walioko katika mji wa Laodikia; tafsiri hii ni fupi na ya kawaida.
- source_word: ὅσοι οὐχ ἑόρακαν
  choice: wote ambao hawajauona
  rationale: ‘Wote ambao’ linadumisha upeo jumuishi wa ὅσοι, na ‘hawajauona’ linaakisi hali timilifu ya kitenzi.
- source_word: τὸ πρόσωπόν μου
  choice: uso wangu
  rationale: Tafsiri halisi inadumisha nahau ya Kigiriki na inaeleweka katika Kiswahili, bila kuibadili kimya kuwa ‘kuniona ana kwa ana.’
- source_word: ἐν σαρκί
  choice: katika mwili
  rationale: Katika muktadha huu σάρξ linamaanisha uwepo wa kimwili, si asili ya dhambi. ‘Katika mwili’ linahifadhi umbo la usemi wa chanzo kwa Kiswahili kinachoeleweka; tanbihi inaeleza maana yake ya kimuktadha.
theological_decisions:
- issue: Maana ya σάρξ katika muktadha usio wa kimaadili
  choice: katika mwili
  alternative: ana kwa ana; kimwili
  rationale: Kirai kinarejelea kukutana na Paulo katika uwepo wake wa kimwili, wala si ‘mwili’ kama asili yenye dhambi. Tafsiri kuu inadumisha picha ya lugha ya chanzo, huku tanbihi ikitoa maana ya kawaida zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Pambano’ linadumisha taswira ya ἀγών; sentensi imeachwa wazi kwa mwendelezo wa aya inayofuata, kama ilivyo katika chanzo.
