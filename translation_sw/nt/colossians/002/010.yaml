  text: καὶ ἐστὲ ἐν αὐτῷ πεπληρωμένοι, ὅς ἐστιν ἡ κεφαλὴ πάσης ἀρχῆς καὶ ἐξουσίας,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/010.yaml
  text: and in him you have been made full, who is the head of every ruler and authority.
translation:
  language: sw
  text: nanyi mmejazwa katika yeye,[a] aliye kichwa cha kila utawala na mamlaka.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mmefanywa kuwa kamili” au “mmefikishwa kwenye utimilifu.”
    reason: lexical_alternative
  - marker: b
    text: “Kichwa” huhifadhi sitiari ya Kigiriki; hapa maana yake ni kwamba yeye ni mkuu juu ya kila utawala na mamlaka.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: nanyi
  rationale: Kiunganishi kinaendeleza hoja ya mstari uliotangulia; “nanyi” kinaunganisha wazo hilo kwa kawaida huku kikihusisha wazi wasomaji.
- source_word: ἐστὲ ... πεπληρωμένοι
  choice: mmejazwa
  rationale: Muundo huu unaonyesha hali ya sasa iliyotokana na tendo lililokamilika. “Mmejazwa” huhifadhi kauli ya kutendwa na taswira ya ujazo inayounganisha mstari huu na mstari uliotangulia.
- source_word: ἐν αὐτῷ
  choice: katika yeye
  rationale: Huhifadhi usemi mfupi wa Paulo unaoonyesha kuwa hali hiyo imo ndani ya Kristo au katika muungano naye, bila kuufafanua kupita kiasi.
- source_word: ὅς
  choice: aliye
  rationale: Kiwakilishi hiki kinamrejelea Kristo na kuunganisha maelezo yanayofuata kwa Kiswahili cha kawaida.
- source_word: κεφαλὴ
  choice: kichwa
  rationale: Huhifadhi sitiari ya Kigiriki badala ya kuitafsiri moja kwa moja kuwa “mtawala”; katika muktadha huu inadokeza ukuu juu ya mamlaka zote.
- source_word: πάσης
  choice: kila
  rationale: Huwasilisha kwa kawaida maana ya ujumla unaohusisha kila aina au kila mamlaka inayotajwa.
- source_word: ἀρχῆς
  choice: utawala
  rationale: Katika jozi hii na ἐξουσία, neno linaweza kutaja nguvu au cheo kinachotawala. “Utawala” ni neno la sasa na linaacha wazi kiasi fulani ikiwa kinachokusudiwa ni eneo la kutawala au nguvu inayotawala.
- source_word: ἐξουσίας
  choice: mamlaka
  rationale: Ni tafsiri ya kawaida na inayoeleweka ya uwezo au mamlaka inayotumiwa, na huendana vizuri na “utawala”.
theological_decisions:
- issue: Maana ya waamini kujazwa katika Kristo
  choice: Kauli inasema kwamba waamini wamejazwa katika Kristo, ikihifadhi wazo la kushiriki ujazo unaopatikana ndani yake bila kulifanya fundisho maalumu la ukamilifu usio na dhambi.
  alternative: “mmekamilishwa” au “mmefikishwa kwenye utimilifu”
  rationale: “Mmejazwa” huhifadhi kauli ya kutendwa na mwangwi wa ujazo wa Kristo katika mstari uliotangulia, huku tanbihi ikionyesha tafsiri nyingine zinazowezekana.
- issue: Maana ya κεφαλή kuhusiana na nguvu za ulimwengu wa kiroho
  choice: Kristo anaelezwa kuwa kichwa cha kila utawala na mamlaka, yaani mkuu juu yao wote.
  alternative: Kristo ndiye chanzo cha kila utawala na mamlaka.
  rationale: Muktadha wa Wakolosai unaunga mkono zaidi wazo la ukuu, lakini matini kuu huhifadhi sitiari ya “kichwa” badala ya kuisuluhisha kwa neno moja la ufafanuzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo ni mfupi kama wa Kigiriki, huku tanbihi zikihifadhi uwezekano wa maana bila kulemea matini kuu.
