  text: Ὡς οὖν παρελάβετε τὸν Χριστὸν Ἰησοῦν τὸν κύριον, ἐν αὐτῷ περιπατεῖτε,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/006.yaml
  text: Therefore[a], just as you received Messiah Jesus the Lord, walk in him,
translation:
  language: sw
  text: Basi, kama mlivyompokea Masihi[a] Yesu aliye Bwana, vivyo hivyo endeleeni kuenenda katika yeye.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kristo Yesu.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ὡς
  choice: kama ... vivyo hivyo
  rationale: Muundo huu wa Kiswahili unaonyesha wazi ulinganisho kati ya jinsi walivyompokea Yesu na jinsi wanavyopaswa kuendelea kuishi.
- source_word: οὖν
  choice: Basi
  rationale: Neno hili linaunganisha agizo na hoja iliyotangulia kwa namna ya kawaida na yenye mantiki katika Kiswahili.
- source_word: παρελάβετε
  choice: mlivyompokea
  rationale: ‘Kupokea’ hudumisha upana wa kitenzi, unaoweza kuhusisha kupokea ujumbe kumhusu na pia kumkubali yeye mwenyewe, bila kulazimisha maana moja tu.
- source_word: τὸν Χριστὸν Ἰησοῦν
  choice: Masihi Yesu
  rationale: ‘Masihi’ linaonyesha kwamba Χριστός ni cheo hapa, huku ‘Yesu’ likibaki jina. Mpangilio huu pia unafuata mfuatano wa Kigiriki.
- source_word: τὸν κύριον
  choice: aliye Bwana
  rationale: Muundo huu wa kiuhusiano ni wa asili katika Kiswahili na hudumisha ‘Bwana’ kuwa cheo cha Yesu bila kuufanya mfuatano wa majina kuwa mzito.
- source_word: ἐν αὐτῷ
  choice: ndani yake
  rationale: Tafsiri hii hudumisha lugha fupi ya Paulo kuhusu uhusiano wa waamini na Masihi, bila kuifafanua kupita kiasi kuwa ‘katika umoja naye.’
- source_word: περιπατεῖτε
  choice: endeleeni kuenenda
  rationale: ‘Kuenenda’ huhifadhi sitiari ya kutembea kama mwenendo wa maisha, na ‘endeleeni’ huonyesha hali endelevu ya agizo la wakati uliopo.
theological_decisions:
- issue: Jinsi ya kutafsiri Χριστός katika mfuatano wa vyeo vya Paulo
  choice: Masihi Yesu
  alternative: Kristo Yesu
  rationale: Katika muktadha huu Χριστός lina nguvu ya cheo, si sehemu ya jina tu. ‘Masihi’ hudumisha kazi hiyo ya cheo; umbo la kimapokeo ‘Kristo Yesu’ limetolewa katika tanbihi.
- issue: Lugha ya Paulo ya kuwa ἐν αὐτῷ
  choice: ndani yake
  alternative: katika umoja naye
  rationale: Kigiriki ni kifupi na kinaweza kubeba maana pana ya kitheolojia. ‘Ndani yake’ hudumisha mvutano na upana huo badala ya kuufunga kwa ufafanuzi mmoja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Kuenenda’ limetumiwa kwa makusudi kuhifadhi sitiari ya Paulo; ‘endelea’ hufanya agizo hilo lieleweke kwa Kiswahili cha sasa.
