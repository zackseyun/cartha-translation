translation:
  language: sw
  text: ambaye ndani yake zimefichwa hazina zote za hekima na maarifa[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ambamo,” ikiwa neno hili linaeleweka kurejelea kwa upana zaidi siri ya Mungu badala ya Kristo mwenyewe.
    reason: alternative_reading
  - marker: b
    text: Au “zimehifadhiwa”; kivumishi cha Kiyunani kinaweza kudokeza kitu kilichofichwa au kilichowekwa akiba.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: ambaye ndani yake
  rationale: Kiwakilishi cha uhusiano kinaelekea kwa kawaida kwa Kristo, anayetajwa mara moja kabla katika 2:2. Muundo huu unaonyesha wazi kuwa rejeleo ni mtu na unahifadhi wazo la kuwa ndani yake.
- source_word: πάντες οἱ θησαυροὶ
  choice: hazina zote
  rationale: 'Huu ni usemi wa kawaida wa Kiswahili unaowasilisha maana ya jumla yenye uhakika ya nomino ya wingi pamoja na kibainishi: hazina zote.'
- source_word: τῆς σοφίας καὶ γνώσεως
  choice: za hekima na maarifa
  rationale: Maneno haya yanahifadhi dhana mbili zinazohusiana lakini zisizo sawa, bila kuzichanganya kuwa dhana moja.
- source_word: ἀπόκρυφοι
  choice: zimefichwa
  rationale: Chaguo hili ni la moja kwa moja na halilazimishi uamuzi kwamba hazina hizo hazipatikani kabisa au kwamba zimewekwa salama tu kwa ajili ya baadaye.
- source_word: εἰσιν ... ἀπόκρυφοι
  choice: zimefichwa
  rationale: Kitenzi kishirikishi na kivumishi cha Kiyunani vinawasilishwa kwa kauli asilia ya Kiswahili inayoonyesha hali ya hazina hizo.
theological_decisions:
- issue: Iwapo ἀπόκρυφοι inadokeza siri isiyofikika au hazina iliyohifadhiwa salama ndani ya Kristo
  choice: zimefichwa
  alternative: zimehifadhiwa
  rationale: Tafsiri hii inabaki upande wowote na kuhifadhi mvutano wa kifungu bila kuamua zaidi ya ushahidi wa Kiyunani.
- issue: Rejeleo la ἐν ᾧ
  choice: ambaye ndani yake, likimrejelea Kristo
  alternative: ambamo, likirejelea kwa upana zaidi siri ya Mungu
  rationale: Rejeleo la karibu zaidi na la kibinafsi katika 2:2 ni Kristo, lakini uwezekano mpana zaidi unahifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Mpangilio “ambaye ndani yake” unaepuka utata wa kumrejelea mtu huku tanbihi ikihifadhi uwezekano mwingine wa kisarufi.
