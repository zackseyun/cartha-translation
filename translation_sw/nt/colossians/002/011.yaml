base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/011.yaml
  text: In him you also were circumcised with a circumcision not made by hands[a], in the removal of the body of flesh, in the circumcision of Messiah[e][d][c][b],
translation:
  language: sw
  text: Katika yeye pia mlitahiriwa kwa tohara isiyofanywa kwa mikono[a], katika kuuvua mwili wa nyama[b][c], katika tohara ya Masihi[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “tohara isiyofanywa na mikono.”
    reason: lexical_alternative
  - marker: b
    text: Au, “katika kuondolewa kwa mwili wa nyama.”
    reason: lexical_alternative
  - marker: c
    text: Neno “nyama” linaweza kufasiriwa kwa maana ya hali ya mwanadamu iliyo chini ya dhambi, lakini hapa limetafsiriwa kwa maana iliyo karibu zaidi na neno la Kigiriki.
    reason: lexical_alternative
  - marker: d
    text: Au, “kwa tohara inayofanywa na Masihi.” Kirai cha Kigiriki kinaweza kumaanisha tohara inayofanywa na Masihi, iliyo ya Masihi, au inayohusishwa naye.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ᾧ
  choice: Katika yeye
  rationale: Kiwakilishi kinamrejelea Masihi katika muktadha uliotangulia. Kauli hii inadumisha wazo la waamini kuwa katika umoja naye.
- source_word: περιετμήθητε
  choice: mlitahiriwa
  rationale: Kitenzi ni cha wakati uliopita na kauli tendwa, nacho kinaonyesha tendo lililokamilika. Taswira ya tohara imehifadhiwa badala ya kufafanuliwa kwa maneno mengine.
- source_word: περιτομῇ ἀχειροποιήτῳ
  choice: kwa tohara isiyofanywa kwa mikono
  rationale: Kauli hii inahifadhi tofauti kati ya tendo la kibinadamu na tendo lisilofanywa na wanadamu, huku ikibaki wazi kuhusu mtendaji.
- source_word: ἐν τῇ ἀπεκδύσει
  choice: katika kuvuliwa
  rationale: Nomino ya Kigiriki ina maana ya kuvua kabisa au kuondoa. 'Kuvuliwa' inadumisha taswira ya kitu kinachovuliwa bila kuibadili kuwa maelezo ya kitheolojia.
- source_word: τοῦ σώματος τῆς σαρκός
  choice: kwa mwili wa nyama
  rationale: Muundo mgumu wa maneno 'mwili wa nyama' umehifadhiwa kwa ukaribu ili kutotatua kimya-kimya ikiwa Paulo anamaanisha mwili wa kimwili, maisha yanayotawaliwa na nyama, au hali nyingine inayohusiana na nyama.
- source_word: σαρκός
  choice: nyama
  rationale: '''Nyama'' inadumisha istilahi na uzito wa neno σάρξ bila kulifasiri moja kwa moja kuwa ''asili ya dhambi.'''
- source_word: ἐν τῇ περιτομῇ τοῦ Χριστοῦ
  choice: katika tohara ya Masihi
  rationale: Muundo 'ya Masihi' unaacha wazi kama tohara hiyo inafanywa na Masihi, ni yake, au inahusishwa naye; Χριστός limetafsiriwa kama cheo 'Masihi.'
theological_decisions:
- issue: Maana ya 'tohara ya Masihi'
  choice: Tohara ya Masihi
  alternative: Tohara inayofanywa na Masihi; tohara aliyopata Masihi mwenyewe; tohara inayomhusu au iliyo yake Masihi
  rationale: Muundo wa umilikishi wa Kigiriki τοῦ Χριστοῦ unaweza kueleweka kwa njia kadhaa. Tafsiri haichagui fasiri moja yenye uzito maalumu wa kimafundisho.
- issue: Maana ya 'mwili wa nyama'
  choice: Mwili wa nyama
  alternative: Mwili unaotawaliwa na nyama; asili ya dhambi; mwili wa kimwili
  rationale: Kirai hiki kina utata wa kimaana. Kukihifadhi kwa ukaribu na Kigiriki huepuka kuingiza ufafanuzi mwembamba kuhusu hali ya mwanadamu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wenye heshima na unaosomeka. Marudio ya “katika” yamehifadhiwa ili kuakisi muundo wa Kigiriki na uhusiano wa sentensi, ingawa yana uzito wa kimtindo. Istilahi “mwili wa nyama” ni ngumu kwa makusudi kwa sababu kirai cha asili pia kina utata.
