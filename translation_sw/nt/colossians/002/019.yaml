base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/019.yaml
  text: and not holding fast to the Head[a], from whom the whole body, being supplied and held together through the joints and ligaments[c][b], grows with the growth of God.
translation:
  language: sw
  text: wala hashikilii Kichwa kwa uthabiti[a]; kutoka kwake mwili wote, ukiutunzwa kwa kupewa lishe na kuunganishwa pamoja kwa njia ya viungo na kano[b], hukua kwa ukuaji utokao kwa Mungu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wala hashikamani sana na Kichwa.”
    reason: lexical_alternative
  - marker: b
    text: Au, “hulishwa na kushikamanishwa pamoja kwa njia ya viungo na kano.”
    reason: lexical_alternative
  - marker: c
    text: Kihalisi, “hukua ukuaji wa Mungu.” Kauli hii huenda ikamaanisha ukuaji unaotoka kwa Mungu.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρατῶν
  choice: hashikamani kwa uthabiti
  rationale: Kitenzi hiki kinaonyesha kuendelea kushika au kushikamana kwa nguvu, si kugusa tu. Kauli hii inaendeleza picha ya kushikamana kwa dhati na Kichwa.
- source_word: κεφαλήν
  choice: Kichwa
  rationale: Maana ya msingi ni ‘kichwa’; herufi kubwa inaonyesha kuwa katika muktadha huu kinamrejelea Kristo kama Kichwa cha mwili.
- source_word: ἐξ οὗ
  choice: Kutoka kwake
  rationale: Kiwakilishi cha Kigiriki ni cha kiume na kinarejelea Kichwa, yaani Kristo, ambaye ndiye chanzo kinachoutunza mwili.
- source_word: πᾶν τὸ σῶμα
  choice: mwili wote
  rationale: Hii ni kauli ya kawaida ya Kiswahili inayohifadhi picha ya mwili mmoja katika ukamilifu wake.
- source_word: ἁφῶν
  choice: viungo
  rationale: Katika mfano huu wa mwili, neno linamaanisha sehemu za kuunganishia au viungo.
- source_word: συνδέσμων
  choice: kano
  rationale: Neno linaonyesha vitu vinavyofunga sehemu za mwili pamoja; ‘kano’ ni istilahi ya kawaida na sahihi katika picha ya kimaumbile.
- source_word: ἐπιχορηγούμενον
  choice: hupewa mahitaji yake
  rationale: Kauli hii inaeleza mwili kupewa kile kinachouendeleza. Tafsiri hii ni ya kawaida kuliko ‘husambaziwa’ bila kutaja kinachosambazwa, huku ikiacha wazi kama kinachotolewa ni lishe, msaada, au riziki nyingine.
- source_word: συμβιβαζόμενον
  choice: kuunganishwa pamoja
  rationale: Inadokeza sehemu mbalimbali kuletwa katika umoja wenye mshikamano; kauli hii inahifadhi maana ya kimuundo bila kuongeza wazo lisilokuwamo.
- source_word: αὔξει
  choice: hukua
  rationale: ‘Hukua’ inaendeleza kwa ufasaha mfano wa mwili ulio hai.
- source_word: τὴν αὔξησιν τοῦ θεοῦ
  choice: kwa ukuaji utokao kwa Mungu
  rationale: Kauli hii inaeleweka kwa kawaida kuwa ukuaji ambao chanzo chake ni Mungu. Tanbihi inadumisha muundo halisi na uwezekano wa maana pana wa hali ya umilikaji katika Kigiriki.
theological_decisions:
- issue: Maana ya hali ya umilikaji katika τὴν αὔξησιν τοῦ θεοῦ
  choice: ukuaji utokao kwa Mungu
  alternative: ukuaji wa Mungu
  rationale: Katika muktadha, mwili hupokea uhai na ukuaji kutoka kwa Kichwa, na hatimaye kutoka kwa Mungu. Maandishi makuu yanaepuka kudokeza kwamba Mungu mwenyewe ndiye anayekua, huku tanbihi ikihifadhi muundo wa Kigiriki na utata wake wa kweli.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umefanywa kuwa wa kawaida kwa wasomaji wa leo bila kupoteza mfano wa mwili, Kichwa, viungo, na kano. Alama za tanbihi [a], [b], na [c] ziko katika maandishi makuu kwa mpangilio wa kutokea.
