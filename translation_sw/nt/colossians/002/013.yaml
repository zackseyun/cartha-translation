  text: καὶ ὑμᾶς νεκροὺς ὄντας ⸀ἐν τοῖς παραπτώμασιν καὶ τῇ ἀκροβυστίᾳ τῆς σαρκὸς ὑμῶν, συνεζωοποίησεν ὑμᾶς σὺν αὐτῷ· χαρισάμενος ἡμῖν πάντα τὰ παραπτώματα,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/013.yaml
  text: And you[a], being dead in your trespasses and the uncircumcision of your flesh, he made alive together with him, having forgiven us all our trespasses[c][b],
translation:
  language: sw
  text: Nanyi, mkiwa wafu katika makosa yenu[a] na katika hali ya kutotahiriwa kwa mwili wenu[b], Mungu aliwafanya kuwa hai pamoja naye, akiisha kutusamehe makosa yetu yote[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika makosa yenu ya kuasi.”
    reason: lexical_alternative
  - marker: b
    text: “Hali ya kutotahiriwa kwa mwili wenu” inarejelea moja kwa moja hali yao ya kimwili ya kutotahiriwa, ingawa katika muktadha pia ina umuhimu wa kiroho.
    reason: cultural_note
  - marker: c
    text: 'Kigiriki hubadilika kutoka “ninyi” kwenda “sisi”: “akiisha kutusamehe makosa yetu yote.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: νεκροὺς ὄντας
  choice: mkiwa wafu
  rationale: Huhifadhi muundo wa hali unaoelezwa na kishirikishi cha Kigiriki na unasomeka kwa kawaida katika Kiswahili.
- source_word: ἐν τοῖς παραπτώμασιν
  choice: katika makosa yenu
  rationale: “Katika” huhifadhi ἐν na picha ya kuwa katika hali au eneo la makosa, bila kuibadili moja kwa moja kuwa sababu.
- source_word: ἀκροβυστίᾳ τῆς σαρκὸς ὑμῶν
  choice: katika hali ya kutotahiriwa kwa miili yenu
  rationale: “Hali ya kutotahiriwa” huonyesha maana ya ἀκροβυστία, na “miili” huwasilisha rejeo la kimwili la σάρξ kwa Kiswahili cha kawaida bila kulifasiri kama “asili ya dhambi.”
- source_word: συνεζωοποίησεν ὑμᾶς σὺν αὐτῷ
  choice: aliwafanya kuwa hai pamoja naye
  rationale: Huhifadhi wazo la kupewa uhai kwa pamoja na yeye pamoja na msisitizo wa ushirika uliomo katika kitenzi ambatano na σύν.
- source_word: χαρισάμενος
  choice: akiisha kutusamehe
  rationale: Huwasilisha msamaha unaohusiana kwa karibu na tendo kuu na kudokeza tendo lililotimizwa, bila kuongeza maelezo yasiyo wazi katika matini.
- source_word: ἡμῖν
  choice: kutusamehe
  rationale: Huhifadhi mabadiliko halisi ya nafsi kutoka “nanyi/yenu” kwenda “tus-” badala ya kuyasawazisha.
- source_word: πάντα τὰ παραπτώματα
  choice: makosa yetu yote
  rationale: Huhifadhi msisitizo wa jumla wa πάντα na uthabiti wa kutafsiri παράπτωμα kama “kosa.”
theological_decisions:
- issue: Maana ya σάρξ katika τῆς σαρκὸς ὑμῶν
  choice: 'rejeo la kimwili: “miili yenu,” huku umuhimu wa kiroho ukibaki katika muktadha'
  alternative: “asili yenu ya dhambi” au “mwili wenu”
  rationale: Muktadha wa tohara katika 2:11 unaelekeza kwanza kwenye hali halisi ya mwili. “Asili ya dhambi” ingeamua mapema maana ya kitheolojia ambayo maneno yenyewe hayalazimishi.
- issue: Mhusika wa kitenzi συνεζωοποίησεν
  choice: “Mungu” kama kiima kilichowekwa wazi kwa usomaji wa kawaida
  alternative: 'kuacha kiima katika kiambishi pekee: “aliwafanya”'
  rationale: Kiima kinaendelea kutoka muktadha wa karibu, hasa Mungu aliyemfufua Kristo katika 2:12; kukiweka wazi hufanya Kiswahili kisomeke kwa urahisi bila kubadili dai la muktadha.
- issue: Mrejelewa wa αὐτῷ
  choice: kiwakilishi “naye,” kinachoeleweka katika muktadha kuwa Kristo
  alternative: “pamoja na Kristo”
  rationale: Kiwakilishi huhifadhi umbo la Kigiriki na kutomwingiza jina moja kwa moja, huku muktadha wa kuzikwa na kufufuliwa pamoja na Kristo ukionyesha mrejelewa.
- issue: Mabadiliko kutoka ὑμᾶς kwenda ἡμῖν
  choice: kuhifadhi “nanyi/yenu” kisha “kutusamehe/makosa yetu”
  alternative: kusawazisha yote kuwa nafsi ya pili au ya kwanza wingi
  rationale: Mabadiliko hayo yapo wazi katika Kigiriki na yanaweza kuonyesha kupanuliwa kwa kauli kuwahusisha Paulo na waamini wengine; hayapaswi kufutwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Makosa” linaeleweka kwa urahisi kuliko istilahi nzito zaidi, huku tanbihi ikihifadhi mbadala wa “makosa ya kuasi.” Muundo “mkiwa wafu” huhifadhi mvutano wa kishirikishi, na mabadiliko ya nafsi yameachwa kama yalivyo katika chanzo.
