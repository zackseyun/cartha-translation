base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/022.yaml
  text: These all perish with use[c][b][a], according to the commandments and teachings of men.
translation:
  language: sw
  text: Vitu hivyo vyote huharibika kwa kutumiwa,[a] kufuatana na maagizo na mafundisho ya wanadamu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ambavyo vyote huharibika kwa kutumiwa.” Muundo wa Kigiriki unaweza kutafsiriwa kwa namna hii, ukisisitiza kwamba vitu vinavyowekewa masharti ni vya muda na huisha kwa matumizi.
    reason: lexical_alternative
  - marker: b
    text: Kauli “maagizo na mafundisho ya wanadamu” huenda inadokeza Isaya 29:13 na kusisitiza kwamba masharti hayo yametokana na wanadamu.
    reason: cross_reference
lexical_decisions:
- source_word: ἅ ἐστιν πάντα
  choice: Vitu hivyo vyote
  rationale: Kiwakilishi cha uhusiano cha wingi wa kati kinarejelea vitu vilivyokatazwa katika mstari uliotangulia. Kauli hii ni ya asili katika Kiswahili na inaonyesha wazi rejeo hilo.
- source_word: εἰς φθοράν
  choice: huharibika
  rationale: Neno φθορά linaweza kumaanisha kuharibika, kuangamia, au kuoza. Hapa linaeleza mwisho wa vitu vinavyotumiwa, bila kulazimisha maana moja finyu.
- source_word: τῇ ἀποχρήσει
  choice: kwa kutumiwa
  rationale: Muundo huu unaonyesha kwamba vitu hivyo huharibika au huisha katika matumizi yake; tafsiri hii ni wazi na ya kawaida huku ikihifadhi uhusiano wa kisarufi.
- source_word: κατὰ
  choice: kwa kufuata
  rationale: Hapa κατὰ inaonyesha kanuni au msingi ambao masharti hayo yanafuata. ‘Kwa kufuata’ ni ya asili katika Kiswahili.
- source_word: ἐντάλματα
  choice: maagizo
  rationale: ‘Maagizo’ huhifadhi maana ya amri au masharti yaliyowekwa bila kufanya sentensi iwe nzito isivyo lazima.
- source_word: διδασκαλίας
  choice: mafundisho
  rationale: Hili ndilo neno la kawaida na lenye hadhi kwa mafundisho, bila kuingiza maana maalumu ya kimadhehebu.
- source_word: τῶν ἀνθρώπων
  choice: ya wanadamu
  rationale: ‘Wanadamu’ huonyesha kwamba chanzo cha maagizo hayo ni cha kibinadamu, kwa kutofautisha na maagizo ya Mungu, na kwa kawaida linawahusu watu wote.
theological_decisions:
- issue: Uhusiano wa maelezo kuhusu vitu vinavyoharibika na masharti ya kujinyima
  choice: Mstari unaeleza kwamba vitu vinavyokatazwa huharibika kwa kutumiwa, kisha unaonyesha kwamba masharti hayo yanafuata maagizo na mafundisho ya wanadamu.
  alternative: Mstari unaweza kueleweka kuwa unayakataa masharti hayo kwa sababu yanahusu tu vitu vinavyoisha kwa matumizi.
  rationale: Kigiriki kinaelekea kueleza kwanza vitu vinavyorejelewa, kisha asili ya kibinadamu ya masharti. Tafsiri haibainishi kupita kiasi kama mkazo mkuu uko kwa vitu au kwa masharti yenyewe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi, na inayoeleweka kwa urahisi. ‘Wanadamu’ limetumiwa kuonyesha asili ya kibinadamu ya masharti bila kuleta utata wa kijinsia.
