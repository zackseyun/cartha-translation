base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/014.yaml
  text: having wiped out the record of debt against us in decrees[a], which was opposed to us, and he has taken it out of the way[b], having nailed it to the cross.
translation:
  language: sw
  text: Ameifuta hati ya deni dhidi yetu katika maagizo[a], ambayo ilikuwa kinyume chetu; naye ameiondoa njiani kwa kuigongomelea msalabani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “hati ya kuwajibika kwa deni” au “hati iliyoandikwa.” Neno la Kigiriki linaweza kumaanisha hati iliyoandikwa kwa mkono inayothibitisha deni au wajibu wa kisheria.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξαλείψας
  choice: ameifuta
  rationale: Kitenzi hiki huonyesha kufuta maandishi au kuyaondoa kabisa. “Ameifuta” ni Kiswahili cha sasa na pia kinaonyesha tendo lililokamilishwa katika mtiririko wa sentensi.
- source_word: χειρόγραφον
  choice: hati ya deni
  rationale: Neno hilo linaweza kumaanisha hati iliyoandikwa kwa mkono inayothibitisha deni au wajibu wa kisheria. “Hati ya deni” huhifadhi picha ya maandishi na ya kuwajibika bila kuifanya iwe aina mahususi mno ya hati.
- source_word: καθ’ ἡμῶν
  choice: iliyokuwa dhidi yetu
  rationale: Kirai hiki kinaonyesha kwamba hati hiyo ilisimama kinyume chetu au ilituhukumu.
- source_word: τοῖς δόγμασιν
  choice: pamoja na masharti yake
  rationale: Hali ya kisarufi ya kirai hiki ni ngumu. Tafsiri hii inaunganisha masharti au maagizo na hati ya deni kwa Kiswahili kinachoeleweka, bila kuyatambulisha moja kwa moja kuwa Sheria ya Musa.
- source_word: ὑπεναντίον
  choice: iliyotupinga
  rationale: Huhifadhi wazi wazo la hati hiyo kuwa kinyume chetu bila kuongeza tafsiri ya kiteolojia.
- source_word: ἦρκεν
  choice: ameiondoa
  rationale: Wakati timilifu wa Kigiriki unaonyesha tendo lililokamilika lenye matokeo yanayoendelea; “ameiondoa” huwasilisha jambo hilo kwa kawaida katika Kiswahili.
- source_word: ἐκ τοῦ μέσου
  choice: njiani
  rationale: Kirai hiki ni nahau ya kuondoa kitu kilichokuwa kizuizi. “Ameiondoa njiani” ni usemi wa kawaida unaodumisha picha hiyo.
- source_word: προσηλώσας
  choice: kwa kuigongomelea
  rationale: Hueleza njia ambayo hati hiyo iliondolewa, huku ikihifadhi tendo la kuipigilia kwa misumari.
- source_word: τῷ σταυρῷ
  choice: msalabani
  rationale: “Msalaba” ndilo neno la kawaida na lililo wazi katika muktadha huu wa Kikristo.
theological_decisions:
- issue: Maana ya χειρόγραφον τοῖς δόγμασιν
  choice: hati ya deni iliyohusishwa na masharti yaliyokuwa dhidi yetu
  alternative: Sheria ya Musa yenyewe; orodha ya dhambi na madeni; hati ya mashtaka ya kisheria
  rationale: Maneno haya ni ya kisitiari na maana yake kamili inajadiliwa. Tafsiri inadumisha picha ya hati na deni, lakini haiifungamanishi na mfumo mmoja maalumu wa kiteolojia.
- issue: Mtendaji wa ἦρκεν
  choice: mtendaji anaeleweka kuwa Mungu kutokana na muktadha mpana
  alternative: kuacha mtendaji bila kutajwa wazi
  rationale: Umbo la “ameiondoa” halitaji jina la mtendaji, hivyo linabaki la kawaida kwa Kiswahili huku likipatana na muktadha unaomtaja Mungu kuwa mtendaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi mbili fupi zimetumiwa kuzuia utata wa viwakilishi na kufanya mstari usomeke kwa urahisi. Neno “masharti” halifafanuliwi kuwa Sheria ya Musa ili kuhifadhi upeo na utata wa Kigiriki.
