  text: ἅτινά ἐστιν λόγον μὲν ἔχοντα σοφίας ἐν ἐθελοθρησκίᾳ καὶ ταπεινοφροσύνῃ καὶ ἀφειδίᾳ σώματος, οὐκ ἐν τιμῇ τινι πρὸς πλησμονὴν τῆς σαρκός.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/023.yaml
  text: These indeed have an appearance of wisdom in self-made religion and humility and harsh treatment of the body[d][c][b][a], but are of no value against the indulgence of the flesh.
translation:
  language: sw
  text: Hayo kwa kweli yana sura ya hekima katika ibada ya kujitungia[b], unyenyekevu, na kuutendea mwili kwa ukali; lakini hayana thamani yoyote katika kukabiliana na kuendekeza mwili.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kifungu cha mwisho ni kigumu. Pia yaweza kutafsiriwa: “si kwa heshima yoyote, kwa kutosheleza mwili,” au “hayana heshima yoyote dhidi ya kuendekeza mwili.” Hapa “mwili” huenda ukarejelea tamaa za mwanadamu aliyeanguka.'
    reason: alternative_reading
  - marker: b
    text: 'Au: “ibada ya kujiwekea mwenyewe”; kwa mapokeo, “ibada ya mapenzi ya mtu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅτινά
  choice: Hayo
  rationale: Kiwakilishi hiki kinarejelea masharti ya mistari 21–22; “Hayo” ni cha asili na kinahifadhi rejeo hilo.
- source_word: λόγον μὲν ἔχοντα σοφίας
  choice: kwa kweli yana sura ya hekima
  rationale: Nahau hiyo inaonyesha sifa au mwonekano wa hekima, huku μέν ikitoa ukubali unaofuatiwa na utofautishaji.
- source_word: ἐθελοθρησκίᾳ
  choice: ibada ya kujitungia
  rationale: Neno adimu linaonyesha desturi ya kidini iliyobuniwa au kujiwekea kwa mapenzi ya mtu mwenyewe; tafsiri hii ni wazi bila kuamua kupita kiasi ikiwa ni ibada au mfumo mpana wa kidini.
- source_word: ταπεινοφροσύνῃ
  choice: unyenyekevu
  rationale: Hili ndilo maana ya kawaida ya neno; muktadha unaonyesha kuwa huenda ni unyenyekevu wa kujishusha wa kiasketa.
- source_word: ἀφειδίᾳ σώματος
  choice: kuutendea mwili kwa ukali
  rationale: Huwasilisha hali ya kutouhurumia mwili au kuutendea kwa ukali katika mazoea ya kujinyima.
- source_word: οὐκ ἐν τιμῇ τινι
  choice: hayana thamani yoyote
  rationale: Katika muktadha, τιμή yaweza kueleweka kama thamani au manufaa; hii inaunganisha vizuri mwonekano wa hekima na kutofaa kwake.
- source_word: πρὸς πλησμονὴν
  choice: katika kuzuia tamaa
  rationale: Tafsiri hii inafuata uelewa wa kwamba mazoea hayo hayana nguvu dhidi ya kutosheleza au kuendekeza mwili, huku ugumu wa kifungu ukielezwa katika tanbihi.
- source_word: τῆς σαρκός
  choice: za mwili
  rationale: “Mwili” huhifadhi upana na mvutano wa σάρξ; “tamaa” katika kirai hufanya maana ya ushawishi mbaya ieleweke bila kutumia istilahi ya kimadhehebu.
theological_decisions:
- issue: Maana ya kifungu kigumu οὐκ ἐν τιμῇ τινι πρὸς πλησμονὴν τῆς σαρκός
  choice: Mazoea hayo hayana thamani katika kuzuia tamaa za mwili.
  alternative: Hayaupi mwili heshima yoyote, au yanaishia tu katika kuutosheleza mwili.
  rationale: Sintaksia ya Kigiriki imebanwa na inabishaniwa. Muktadha unaunga mkono ukosoaji wa kanuni za kiasketa kuwa zinaonekana za hekima lakini hazidhibiti tamaa; tanbihi huhifadhi uwezekano mwingine wa kisintaksia na kileksika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inadumisha sauti ya ukubali kisha ukosoaji, na tanbihi huhifadhi utata halisi wa kifungu cha mwisho.
