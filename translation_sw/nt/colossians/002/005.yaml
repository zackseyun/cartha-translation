  rationale: 'The main text is revised only for a more exact and idiomatic representation of the concessive opening and the flesh/spirit contrast. The lexical and interpretive alternatives formerly supplied in separate notes are retained in a two-note set anchored to the relevant expressions: the possible Holy-Spirit reading is attached to “rohoni,” while alternatives for στερέωμα and πίστις are attached to “uthabiti.”'
