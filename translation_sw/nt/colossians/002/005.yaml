  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἰ γὰρ καὶ τῇ σαρκὶ ἄπειμι, ἀλλὰ τῷ πνεύματι σὺν ὑμῖν εἰμι, χαίρων καὶ βλέπων ὑμῶν τὴν τάξιν καὶ τὸ στερέωμα τῆς εἰς Χριστὸν πίστεως ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/005.yaml
  text: For even if I am absent in the flesh[a], yet I am with you in spirit[c][b], rejoicing and seeing your good order and the firmness of your faith in Messiah.
translation:
  language: sw
  text: Kwa maana, hata kama sipo pamoja nanyi kimwili, nipo pamoja nanyi rohoni, nikifurahi na kuona utaratibu wenu mzuri na uthabiti wa imani yenu katika Masihi[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au huenda, “katika Roho,” yaani, kwa Roho Mtakatifu.
    reason: alternative_reading
  - marker: b
    text: Au, “uimara”; au huenda, “uthabiti wa uaminifu wenu kwa Masihi.”
    reason: lexical_alternative; alternative_reading
lexical_decisions:
- source_word: τῇ σαρκί
  choice: kimwili
  rationale: Katika mlingano na τῷ πνεύματι, neno hili linaonyesha kutokuwapo kwa Paulo kwa mwili, si maana ya kimaadili ya hali ya dhambi. Kiswahili cha kawaida ‘kimwili’ kinaeleza maana hiyo wazi.
- source_word: τῷ πνεύματι
  choice: kwa roho
  rationale: Kauli hii inadumisha mlingano wa kutokuwapo kimwili na kuwapo kwa roho. Herufi ndogo na tanbihi huepuka kuamua kimya kimya kama inahusu roho ya Paulo au Roho Mtakatifu.
- source_word: χαίρων καὶ βλέπων
  choice: nikifurahi na kuona
  rationale: Vitenzi-jina vya wakati wa sasa vinaonyesha matendo yanayoambatana na kuwapo kwake pamoja nao; tafsiri hii inadumisha mpangilio wake bila kufafanua kupita kiasi namna ya ‘kuona.’
- source_word: τάξιν
  choice: utaratibu wenu mzuri
  rationale: τάξις hapa ni mpangilio au mwenendo wenye utaratibu unaostahili pongezi. ‘Utaratibu mzuri’ ni ya asili na haileti taswira ya kijeshi isiyolazimu.
- source_word: στερέωμα
  choice: uthabiti
  rationale: Neno hili huonyesha uimara au hali ya kuwa imara. ‘Uthabiti’ linaendana vizuri na imani na kuhifadhi taswira ya kitu kilicho thabiti.
- source_word: πίστεως
  choice: imani
  rationale: ‘Imani’ ndiyo maana ya kawaida katika uhusiano huu, ingawa uwezekano wa ‘uaminifu’ umehifadhiwa katika tanbihi.
- source_word: εἰς Χριστόν
  choice: katika Masihi
  rationale: εἰς humtaja mlengwa wa imani na kwa Kiswahili husemwa kwa kawaida ‘imani katika.’ Χριστός hapa inafanya kazi kama cheo, kwa hiyo imetafsiriwa ‘Masihi.’
theological_decisions:
- issue: Anayerejelewa na ‘roho’ katika mlingano wa kutokuwapo kimwili na kuwapo kwa roho
  choice: Kauli kuu inaelekea kumaanisha kwamba Paulo yuko pamoja nao kwa roho yake ingawa hayupo kwa mwili.
  alternative: Huenda Paulo anasema yuko pamoja nao kwa njia ya Roho Mtakatifu.
  rationale: Mlingano wa moja kwa moja na kutokuwapo kimwili unaunga mkono roho ya Paulo, lakini muundo wa Kigiriki hauondoi kabisa rejeo kwa Roho Mtakatifu; tanbihi inalinda utata huo.
- issue: Tafsiri ya Χριστόν
  choice: Masihi
  alternative: Kristo
  rationale: Katika kishazi ‘imani katika Χριστόν,’ neno hilo bado linaweza kusikika kama cheo. ‘Masihi’ huhifadhi maana ya cheo bila kuingiza dai la kimadhehebu.
- issue: Maana ya πίστις katika εἰς Χριστὸν πίστεως
  choice: imani katika Masihi
  alternative: uaminifu kwa Masihi
  rationale: ‘Imani’ ndiyo usomaji wa kawaida zaidi, lakini πίστις inaweza pia kuwa na kivuli cha maana ya uaminifu; uwezekano huo umewekwa katika tanbihi badala ya kutawala matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. ‘Kimwili’ na ‘kwa roho’ huwasilisha mlingano wa Kigiriki kwa njia ya kawaida ya Kiswahili, huku tanbihi zikihifadhi utata wa kiteolojia na wa kileksia.
