  text: ἐρριζωμένοι καὶ ἐποικοδομούμενοι ἐν αὐτῷ καὶ ⸀βεβαιούμενοι τῇ πίστει καθὼς ἐδιδάχθητε, ⸀περισσεύοντες ἐν εὐχαριστίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/007.yaml
  text: having been rooted and being built up in him[a], and being established in the faith just as you were taught, overflowing with thanksgiving.
translation:
  language: sw
  text: mkiwa mmetiwa mizizi na mkijengwa ndani yake, na mkifanywa imara katika imani[a] kama mlivyofundishwa, huku mkifurika kwa shukrani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa imani”; au “katika uaminifu.” Neno la Kigiriki pistis linaweza kumaanisha imani, kuamini, au uaminifu; ingawa hapa huenda “imani” inarejelea imani waliyofundishwa.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐρριζωμένοι
  choice: mkiwa mmekwisha kutiwa mizizi
  rationale: Kauli ya kutendwa katika wakati timilifu inaonyesha tendo lililokamilika lenye matokeo yanayoendelea; pia inadumisha sitiari ya kilimo.
- source_word: ἐποικοδομούμενοι
  choice: mnaendelea kujengwa
  rationale: Kauli ya sasa ya kutendwa inaonyesha mchakato unaoendelea na kuhifadhi sitiari ya ujenzi kwa Kiswahili cha kawaida.
- source_word: ἐν αὐτῷ
  choice: ndani yake
  rationale: Kiwakilishi kinarejelea Kristo katika muktadha wa karibu; tafsiri inadumisha kiwakilishi badala ya kukibadili kuwa jina au cheo.
- source_word: βεβαιούμενοι
  choice: kuimarishwa
  rationale: Huonyesha kufanywa thabiti au imara. Ni usemi wa kawaida na unaoeleweka katika Kiswahili cha sasa.
- source_word: τῇ πίστει
  choice: katika imani
  rationale: Kibainishi na maneno yanayofuata kuhusu kufundishwa yanaelekeza hasa kwenye imani au ujumbe waliopokea, ingawa neno πίστις linaweza pia kumaanisha kuamini au uaminifu.
- source_word: καθὼς ἐδιδάχθητε
  choice: kama mlivyofundishwa
  rationale: Huhifadhi ulinganisho wa καθώς na kuunganisha kuimarishwa kwao na mafundisho waliyopokea.
- source_word: περισσεύοντες
  choice: mkifurika
  rationale: Huhifadhi picha ya wingi unaozidi na hali inayoendelea, kwa lugha hai na ya kawaida.
- source_word: ἐν εὐχαριστίᾳ
  choice: kwa shukrani
  rationale: Ni usemi wa asili wa Kiswahili unaowasilisha hali au namna ya kufurika bila kufuata kihalisia kihusishi cha Kigiriki.
theological_decisions:
- issue: Maana ya τῇ πίστει
  choice: imani, hasa ikieleweka kuwa imani au ujumbe waliofundishwa
  alternative: kuamini kwao binafsi; au uaminifu
  rationale: Kibainishi pamoja na ‘kama mlivyofundishwa’ kinaunga mkono maana ya imani kama yaliyomo au mazingira ya mafundisho waliyopokea. Hata hivyo, tafsiri haifungi kabisa uwezekano wa maana ya kuamini au uaminifu, hivyo mbadala zimewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Sitiari za mizizi, ujenzi na kufurika zimehifadhiwa; tofauti ya tendo lililokamilika na mchakato unaoendelea imeonyeshwa kwa ‘mmekwisha’ na ‘mnaendelea’.
