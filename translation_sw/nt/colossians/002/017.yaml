  yaml_path: translation/nt/colossians/002/017.yaml
  text: These are a shadow of the things to come[b][a], but the body is Messiah's.
translation:
  language: sw
  text: Mambo hayo ni kivuli cha mambo yajayo, bali mwili ni wa Masihi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “bali uhalisi ni wa Masihi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅ
  choice: Mambo hayo
  rationale: Kiwakilishi hiki cha wingi kisicho na jinsia kinarejelea vyakula, sikukuu, mwandamo wa mwezi na Sabato zilizotajwa katika mstari uliotangulia. ‘Mambo hayo’ ni rejeo la kawaida na wazi katika Kiswahili.
- source_word: σκιὰ
  choice: kivuli
  rationale: Neno hili la umoja linadumisha taswira ya kitu cha muda au cha awali kinachoelekeza kwenye kilicho kamili zaidi.
- source_word: τῶν μελλόντων
  choice: cha mambo yajayo
  rationale: Muundo huu unadumisha mwelekeo wa wakati ujao bila kuamua kimyakimya kama Paulo anamaanisha utimilifu wa Kimasihi, mambo ya mwisho, au yote mawili.
- source_word: δὲ
  choice: bali
  rationale: ‘Bali’ huonyesha wazi utofautishaji kati ya kivuli na mwili huku ikifaa kwa lugha yenye hadhi ya maandiko.
- source_word: σῶμα
  choice: mwili
  rationale: ‘Mwili’ ndiyo maana ya moja kwa moja ya σῶμα na inadumisha sitiari pamoja na utata wake wa kweli katika utofautishaji na ‘kivuli.’ Maana ya kimethali ya ‘uhalisi’ inawekwa katika tanbihi.
- source_word: τοῦ Χριστοῦ
  choice: ni wa Masihi
  rationale: Uhusishi wa Kigiriki ni mfupi na kitenzi katika kishazi cha pili kimeachwa kueleweka. ‘Ni wa Masihi’ hudumisha umilikaji, ulinganifu wa vishazi, na matumizi ya Χριστός kama cheo.
theological_decisions:
- issue: Maana ya σῶμα ikilinganishwa na σκιά
  choice: mwili
  alternative: uhalisi
  rationale: Tafsiri ya ‘mwili’ inafuata neno la Kigiriki kwa karibu na kuacha msomaji aione taswira ya kivuli na mwili bila kuifafanua kupita kiasi. ‘Uhalisi’ ni ufafanuzi halali wa sitiari, hivyo umetolewa katika tanbihi.
- issue: Tafsiri ya Χριστοῦ
  choice: Masihi
  alternative: Kristo
  rationale: Katika muktadha huu Χριστός inafanya kazi kama cheo; ‘Masihi’ huwasilisha maana ya cheo hicho bila kuingiza msimamo wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Mambo hayo’ hutoa rejeo la kawaida kwa yaliyotajwa katika mstari uliotangulia; ‘mambo yajayo’ ni fupi, wazi, na hudumisha mwelekeo wa wakati ujao. ‘Bali’ huweka utofautishaji mkali wa maandishi bila kuwa wa kizamani kupita kiasi.
