  text: συνταφέντες αὐτῷ ἐν τῷ ⸀βαπτισμῷ, ἐν ᾧ καὶ συνηγέρθητε διὰ τῆς πίστεως τῆς ἐνεργείας τοῦ θεοῦ τοῦ ἐγείραντος αὐτὸν ⸀ἐκ νεκρῶν·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/012.yaml
  text: having been buried with him in baptism[a], in which you also were raised with him through faith in the working of God[b], who raised him from the dead.
translation:
  language: sw
  text: mlizikwa pamoja naye katika ubatizo[a], na katika huo pia mlifufuliwa pamoja naye kwa njia ya imani katika utendaji wa Mungu[b], aliyemfufua kutoka kwa wafu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, yawezekana, “katika yeye,” ikiwa kiwakilishi hiki kinachukuliwa kuwa kinamrejelea Kristo badala ya ubatizo.
    reason: alternative_reading
  - marker: b
    text: Au “kwa njia ya kumtumaini.” Neno la Kigiriki linalotafsiriwa “imani” linaweza pia kumaanisha “uaminifu” katika baadhi ya miktadha, lakini hapa “imani” ndiyo tafsiri kuu.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνταφέντες αὐτῷ
  choice: mlizikwa pamoja naye
  rationale: Kauli hii inadumisha hali ya kutendwa ya kitenzi na maana ya kiambishi συν-, yaani kuzikwa pamoja na Kristo. Ingawa Kigiriki kimetumia kirai tegemezi cha wakati uliopita, muundo wa Kiswahili wa kitenzi kikuu ni wa kawaida na unaunganika vizuri na muktadha wa sentensi inayoendelea kutoka mstari uliotangulia.
- source_word: ἐν τῷ βαπτισμῷ
  choice: katika ubatizo
  rationale: Neno “katika” linahifadhi uwezekano wa maana ya mahali au njia uliomo katika ἐν bila kuamua nadharia fulani ya kidhehebu kuhusu ubatizo.
- source_word: ἐν ᾧ
  choice: katika huo
  rationale: Kiwakilishi “huo” kinarejelea kwa kawaida nomino ya karibu “ubatizo,” sawa na sintaksia inayowezekana zaidi ya Kigiriki. Uwezekano wa kurejelea Kristo umehifadhiwa katika tanbihi.
- source_word: συνηγέρθητε
  choice: mlifufuliwa pamoja naye
  rationale: Hali ya kutendwa na maana ya kiambishi συν- zimeonyeshwa wazi. Maneno “naye” yanaweka wazi wazo la kufufuliwa pamoja na Kristo lililomo katika kitenzi ambatani na muktadha.
- source_word: διὰ τῆς πίστεως
  choice: kwa njia ya imani
  rationale: “Kwa njia ya” linaonyesha njia au chombo, huku “imani” likiwa chaguo kuu na la kawaida kwa πίστις katika muktadha huu.
- source_word: τῆς ἐνεργείας τοῦ θεοῦ
  choice: katika utendaji wa Mungu
  rationale: Muundo huu unaeleza imani kuwa inaelekezwa kwenye tendo lenye ufanisi la Mungu. “Utendaji” huhifadhi wazo la nguvu inayofanya kazi, wala si nguvu kama uwezo wa kinadharia tu.
- source_word: τοῦ ἐγείραντος αὐτὸν ἐκ νεκρῶν
  choice: aliyemfufua kutoka kwa wafu
  rationale: Kirai cha Kiswahili ni cha asili na kinahifadhi kazi ya kirai elezi kinachomtambulisha Mungu kuwa ndiye aliyemfufua Kristo.
theological_decisions:
- issue: Kirejelewa cha ἐν ᾧ
  choice: “katika huo,” kikirejelea ubatizo
  alternative: “katika yeye,” kikirejelea Kristo
  rationale: Ubatizo ndio nomino iliyo karibu zaidi na ndio kirejelewa kinachofaa zaidi kisintaksia. Hata hivyo, umbo la Kigiriki linaweza pia kuchukuliwa kuwa linamrejelea Kristo; uwezekano huo haujafichwa bali umewekwa katika tanbihi.
- issue: Maana ya lugha ya ubatizo
  choice: Kuhifadhi uhusiano wa karibu kati ya kuzikwa na kufufuliwa pamoja na Kristo, ubatizo, na imani
  alternative: Kutafsiri kwa namna inayolazimisha mtazamo wa kisakramenti au mtazamo wa kiishara pekee
  rationale: Mstari unaunganisha mambo hayo kwa nguvu, lakini hauamui peke yake mabishano ya baadaye ya kidhehebu kuhusu jinsi ubatizo unavyofanya kazi. Tafsiri inaacha mvutano huo kama ulivyo.
- issue: Maana ya πίστις
  choice: imani
  alternative: tumaini/kuamini; au uaminifu
  rationale: Katika muundo huu, “imani” au hali ya kumtumaini Mungu anayefanya kazi ndiyo maana inayowezekana zaidi. “Uaminifu” ni maana inayowezekana ya neno hilo katika miktadha mingine, lakini si chaguo kuu hapa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Maneno “mlizikwa pamoja naye” na “mlifufuliwa pamoja naye” yanaendeleza ulinganifu wa vifungu vya Kigiriki. “Utendaji wa Mungu” ni lugha inayoeleweka inayosisitiza tendo hai na lenye ufanisi la Mungu bila kuingiza msimamo wa kidhehebu.
