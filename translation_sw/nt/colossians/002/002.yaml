  naturalness: Kiswahili ni sanifu na kinaeleweka. “Mioyo yao itiwe moyo” ni sahihi katika mtindo wa kibiblia. “Kuijua siri” ni sahihi na ya asili kuliko “kumjua siri.” Muundo “uhakika kamili wa ufahamu” ni wa hadhi na unaofaa kwa tafsiri ya usawa-mzuri, ingawa unaacha kwa makusudi uhusiano wa maneno hayo uliofungamana katika Kigiriki.
