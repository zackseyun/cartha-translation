  yaml_path: translation/nt/colossians/002/002.yaml
  text: so that their hearts may be encouraged[a], having been knit together in love and unto all the riches of the full assurance of understanding, unto the knowledge of the mystery of God, Messiah[d][c][b],
translation:
  language: sw
  text: ili mioyo yao itiwe moyo, wakiwa wameunganishwa katika upendo[a], na wapate utajiri wote wa uhakika kamili wa ufahamu, hata wafikie kuijua[b] siri ya Mungu, Masihi[c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakiwa wameletwa pamoja katika upendo.” Kitenzi kinaweza kumaanisha kuletwa pamoja au kuunganishwa kwa karibu.
    reason: lexical_alternative
  - marker: b
    text: Au “wafikie ujuzi kamili.” Neno la Kigiriki linaweza kuwa na maana iliyosisitizwa ya ujuzi wa kina au kamili.
    reason: lexical_alternative
  - marker: c
    text: 'Kigiriki hapa ni kifupi na kina ugumu fulani: “siri ya Mungu, Masihi.” Tafsiri hii inaelewa “Masihi” kuwa maelezo yanayoitambulisha siri ya Mungu, huku ikihifadhi ufupi wa usemi huo.'
    reason: alternative_reading
  - marker: d
    text: Baadhi ya hati zina maneno marefu zaidi, kama “siri ya Mungu, ya Baba, na ya Masihi.” Tafsiri hii inafuata maneno mafupi ya matini ya Kigiriki iliyotolewa.
    reason: textual_variant
lexical_decisions:
- source_word: παρακληθῶσιν
  choice: itiwe moyo
  rationale: Katika muktadha huu kitenzi kinahusu kutiwa nguvu na kupewa tumaini moyoni; “itiwe moyo” ni Kiswahili cha kawaida kinachobeba maana pana kuliko kufarijiwa tu.
- source_word: καρδίαι
  choice: mioyo
  rationale: Hudumisha taswira ya kibiblia ya kitovu cha maisha ya ndani bila kuibana iwe akili au hisia pekee.
- source_word: συμβιβασθέντες
  choice: wakiwa wameunganishwa kwa karibu
  rationale: Kitenzi hapa kinaelekea kueleza kuletwa pamoja au kuunganishwa; maneno “kwa karibu” yanaonyesha uimara wa muungano bila kutumia sitiari isiyo ya kawaida katika Kiswahili.
- source_word: ἐν ἀγάπῃ
  choice: katika upendo
  rationale: Huonyesha upendo kuwa mazingira au kifungo ambamo muungano huo unatokea.
- source_word: εἰς πᾶν πλοῦτος
  choice: na wapate utajiri wote
  rationale: εἰς inaonyesha lengo au matokeo. Kiswahili cha “wapate” huwasilisha mwendo kuelekea lengo hilo kwa kawaida.
- source_word: πληροφορίας τῆς συνέσεως
  choice: uhakika kamili unaotokana na ufahamu
  rationale: πληροφορία hapa ni usadikisho au uhakika kamili, na συνέσεως ni ufahamu. Muundo huu wa Kiswahili unaweka uhusiano wao wazi bila kuugeuza kuwa habari tu.
- source_word: ἐπίγνωσιν
  choice: kumjua
  rationale: Kwa kuwa kinachojulikana kinaishia kutambulishwa kuwa Masihi, “kumjua” ni ya kawaida zaidi kuliko nomino “maarifa”; kinaweza pia kudokeza ujuzi wa kina.
- source_word: μυστηρίου
  choice: siri
  rationale: Katika matumizi ya Paulo ni kusudi la Mungu lililokuwa limefichwa kisha likafunuliwa. “Siri” ni neno la sasa na linaloeleweka kwa urahisi katika Kiswahili.
- source_word: θεοῦ, Χριστοῦ
  choice: ya Mungu—Masihi
  rationale: Mstari mrefu wa uakifishaji hudumisha usemi mfupi wa Kigiriki na kuonyesha uwezekano wa Masihi kuwa katika uhusiano wa ufafanuzi na “siri ya Mungu,” bila kuongeza neno la ufafanuzi lisilomo wazi katika matini.
theological_decisions:
- issue: Uhusiano wa Χριστοῦ katika τοῦ μυστηρίου τοῦ θεοῦ, Χριστοῦ
  choice: “siri ya Mungu—Masihi,” ambapo Masihi anaeleweka kwa kawaida kuwa katika apposition na siri
  alternative: “siri ya Mungu, yaani Masihi”; au kwa kufuata mapokeo marefu ya nakala, “siri ya Mungu, ya Baba, na ya Masihi”
  rationale: Matini iliyotolewa ni fupi na yenye msongamano wa kisintaksia. Uakifishaji kwa mstari mrefu unaonyesha uhusiano wa karibu wa apposition bila kuficha ugumu huo wala kuingiza maneno ya mapokeo marefu ya nakala.
- issue: Maana ya μυστήριον
  choice: “siri” kama kusudi la Mungu lililofichwa na sasa kufunuliwa
  alternative: “fumbo” kama jambo lisiloeleweka
  rationale: Katika muktadha wa Paulo neno halimaanishi hasa kitendawili kisichoweza kueleweka, bali jambo la Mungu lililokuwa limefichwa na sasa linajulikana.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Itiwe moyo” na “wakiwa wameunganishwa kwa karibu” ni misemo inayoeleweka kwa wasomaji wa kawaida. Marudio ya lengo katika εἰς yamewasilishwa kwa “wapate” na “hata wafikie” ili sentensi isikike ya asili bila kupoteza mwendo wa hoja ya Paulo.
