  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἴ γε ἐπιμένετε τῇ πίστει τεθεμελιωμένοι καὶ ἑδραῖοι καὶ μὴ μετακινούμενοι ἀπὸ τῆς ἐλπίδος τοῦ εὐαγγελίου οὗ ἠκούσατε, τοῦ κηρυχθέντος ἐν ⸀πάσῃ κτίσει τῇ ὑπὸ τὸν οὐρανόν, οὗ ἐγενόμην ἐγὼ Παῦλος διάκονος.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/023.yaml
  text: if indeed you continue in the faith[a], grounded and steadfast, and not moved away from the hope of the gospel that you heard, which has been proclaimed in all creation under heaven, of which I, Paul[b], became a servant.
translation:
  language: sw
  text: ikiwa kweli mnaendelea katika imani, mkiwa mmejengwa juu ya msingi na imara, wala msiondolewe kutoka katika tumaini la injili mliyoisikia. Injili hiyo imehubiriwa katika uumbaji wote chini ya mbingu[a], nami Paulo nikawa mtumishi wake[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa kila kiumbe kilicho chini ya mbingu.” Neno la Kigiriki κτίσις linaweza kumaanisha “uumbaji” au, katika baadhi ya miktadha, “kiumbe.”
    reason: lexical_alternative
  - marker: b
    text: Au, “mhudumu wake.” Neno la Kigiriki διάκονος linaweza kumaanisha mtumishi au mhudumu kulingana na muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ γε
  choice: ikiwa kweli
  rationale: Huhifadhi hali ya sharti ya εἰ na msisitizo wa γε bila kuifanya kauli kuwa uhakikisho wala tishio lililozidishwa.
- source_word: ἐπιμένετε τῇ πίστει
  choice: mnaendelea katika imani
  rationale: Kitenzi cha wakati uliopo kinaonyesha kuendelea kudumu, na ‘katika imani’ huhifadhi maana ya πίστις pamoja na kiambishi chake.
- source_word: τεθεμελιωμένοι καὶ ἑδραῖοι
  choice: mkiwa mmejengwa juu ya msingi na kuwa imara
  rationale: ‘Mmejengwa juu ya msingi’ hudumisha taswira ya msingi na matokeo yanayoendelea ya kauli tendwa timilifu; ‘imara’ huonyesha uthabiti wa ἑδραῖοι kwa Kiswahili cha kawaida.
- source_word: μὴ μετακινούμενοι
  choice: bila kuondolewa mbali
  rationale: Huhifadhi wazo la kutohamishwa kutoka mahali palipo thabiti na kuunganika kwa kawaida na maelezo yaliyotangulia.
- source_word: ἀπὸ τῆς ἐλπίδος τοῦ εὐαγγελίου
  choice: mbali na tumaini la injili
  rationale: 'Huhifadhi uhusiano mpana wa kimilikishi: tumaini linalohusishwa na injili au linalotolewa nayo, bila kuamua zaidi ya maandishi.'
- source_word: τοῦ κηρυχθέντος
  choice: imehubiriwa
  rationale: Hutoa maana ya kutangazwa hadharani kwa injili kwa lugha ya kawaida na yenye heshima.
- source_word: ἐν πάσῃ κτίσει τῇ ὑπὸ τὸν οὐρανόν
  choice: katika uumbaji wote ulio chini ya mbingu
  rationale: Huchukua κτίσις kwa maana pana ya ‘uumbaji’ na kudumisha upeo wa kauli; maana mbadala ya ‘kila kiumbe’ imewekwa katika tanbihi.
- source_word: οὗ ἐγενόμην ἐγὼ Παῦλος διάκονος
  choice: nami Paulo nimekuwa mtumishi wake
  rationale: Kiwakilishi ‘wake’ kinarejelea injili kwa uwazi wa Kiswahili. ‘Mtumishi’ huepuka kuingiza cheo rasmi cha kikanisa kisicholazimishwa na διάκονος.
theological_decisions:
- issue: Nguvu ya sharti katika εἴ γε na kuendelea katika imani
  choice: ikiwa kweli mnaendelea katika imani
  alternative: kwa kuwa kweli mnaendelea katika imani; mradi mnaendelea katika imani
  rationale: Kigiriki kinaweka sharti halisi lenye msisitizo, lakini aya yenyewe haiamui mabishano mapana kuhusu uwezekano wa kuanguka au uhakika wa kudumu. Tafsiri inadumisha mvutano huo.
- issue: Maana ya πίστις katika τῇ πίστει
  choice: imani
  alternative: uaminifu; tumaini lenye kutegemea
  rationale: Katika muundo na muktadha huu, ‘imani’ ndiyo maana ya kawaida na haikulazimishi πίστις kumaanisha sifa ya uaminifu.
- issue: Upeo wa tangazo la injili
  choice: katika uumbaji wote ulio chini ya mbingu
  alternative: kwa kila kiumbe kilicho chini ya mbingu
  rationale: Kauli pana imehifadhiwa kama ilivyo bila kuibana iwe taarifa ya kijiografia ya kisasa wala kuondoa matumizi yake ya jumla.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imegawanywa baada ya ‘mliyoisikia’ ili iwe rahisi kueleweka, huku uhusiano wa injili na kishazi kinachofuata ukihifadhiwa kwa kurudia ‘Injili hiyo.’ Alama za tanbihi zimewekwa moja kwa moja baada ya maneno yanayohusika.
