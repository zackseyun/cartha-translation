  text: Νῦν χαίρω ἐν τοῖς παθήμασιν ὑπὲρ ὑμῶν, καὶ ἀνταναπληρῶ τὰ ὑστερήματα τῶν θλίψεων τοῦ Χριστοῦ ἐν τῇ σαρκί μου ὑπὲρ τοῦ σώματος αὐτοῦ, ὅ ἐστιν ἡ ἐκκλησία,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/024.yaml
  text: Now I rejoice in my sufferings for your sake[a], and in my flesh I am filling up what is lacking in the afflictions of the Messiah for the sake of his body, which is the church[b],
translation:
  language: sw
  text: Sasa ninafurahi katika mateso yangu kwa ajili yenu, na katika mwili wangu ninayakamilisha yaliyopungua katika dhiki za Masihi[b] kwa ajili ya mwili wake, yaani, kanisa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ninajaza kilichobaki katika dhiki za Masihi.” Paulo hamaanishi kwamba kazi ya Masihi ya upatanisho ilikuwa na upungufu; anazungumzia ushiriki wake katika mateso yanayohusiana na Masihi na mwili wake, yaani, kanisa.
    reason: alternative_reading
  - marker: b
    text: Kigiriki, “Kristo”; kimetafsiriwa “Masihi” hapa kwa sababu Χριστός hutumika kama cheo.
    reason: lexical_alternative
lexical_decisions:
- source_word: Νῦν
  choice: Sasa
  rationale: Ni kiashirio cha wakati kinacholeta hali na mtazamo wa Paulo wa sasa.
- source_word: χαίρω
  choice: ninafurahia
  rationale: Huwasilisha furaha ya Paulo ya wakati wa sasa kwa Kiswahili cha kawaida na cha heshima.
- source_word: ἐν τοῖς παθήμασιν ὑπὲρ ὑμῶν
  choice: mateso yangu kwa ajili yenu
  rationale: Muktadha wa nafsi ya kwanza unahalalisha 'yangu,' huku 'kwa ajili yenu' ikihifadhi maana ya manufaa ya ὑπέρ.
- source_word: ἀνταναπληρῶ τὰ ὑστερήματα
  choice: ninatimiza kile kilichopungua
  rationale: Huhifadhi picha yenye nguvu ya kukamilisha au kujaza kilichobaki bila kuifafanua kupita kiasi ndani ya matini.
- source_word: τῶν θλίψεων
  choice: katika dhiki
  rationale: '''Dhiki'' hutofautisha θλίψεις na πάθημα iliyotafsiriwa ''mateso,'' na huonyesha taabu au mashinikizo makali.'
- source_word: τοῦ Χριστοῦ
  choice: za Masihi
  rationale: Χριστός hapa ina nguvu ya cheo; 'Masihi' huhifadhi maana hiyo.
- source_word: ἐν τῇ σαρκί μου
  choice: katika mwili wangu
  rationale: Katika Kiswahili 'mwili wangu' huonyesha kwa kawaida uwepo wa Paulo wa kimwili; 'nyama yangu' ingekuwa isiyo ya asili na ingeweza kupotosha.
- source_word: ὑπὲρ τοῦ σώματος αὐτοῦ
  choice: kwa ajili ya mwili wake
  rationale: Huhifadhi maana ya manufaa na sitiari ya mwili.
- source_word: ὅ ἐστιν ἡ ἐκκλησία
  choice: yaani, kanisa
  rationale: Hufanya utambulisho wa mwili na kanisa kuwa wazi kwa Kiswahili cha asili bila kubadili maana.
theological_decisions:
- issue: Maana ya kile kilichopungua katika dhiki za Masihi
  choice: Matini inadumisha usemi wenye mvutano kwamba Paulo anatimiza kilichopungua katika dhiki za Masihi, huku tanbihi ikieleza kuwa ni ushiriki wake katika mateso yanayohusiana na Masihi na kanisa.
  alternative: Kufanya matini kuu iseme wazi kwamba ni kiasi tu cha dhiki za huduma kilichobaki, au kwamba mateso ya ukombozi ya Masihi yalikuwa na upungufu.
  rationale: Usemi wa Kigiriki ni wenye nguvu na haupaswi kulainishwa. Hata hivyo, θλίψεις na rejeo kwa mwili, yaani kanisa, vinaelekeza kwenye mateso ya kimisioni na kikanisa, si upungufu katika kazi ya upatanisho ya Masihi.
- issue: Tafsiri ya Χριστοῦ
  choice: Masihi
  alternative: Kristo
  rationale: Katika mstari huu Χριστός inafanya kazi kama cheo; 'Masihi' huhifadhi nguvu yake ya Kiyahudi na ya kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. 'Ninafurahia' ni ya asili kuliko 'nashangilia' katika muktadha wa mateso. 'Mwili' limetumiwa kwa σάρξ na σῶμα kwa sababu Kiswahili hakitumii 'nyama' kwa namna ya kawaida hapa; marudio hayo pia yanadumisha uhusiano kati ya mwili wa Paulo na mwili wa Masihi. Alama ya tanbihi [a] imewekwa baada ya sentensi nzima kwa kuwa tanbihi inafafanua kishazi cha kati.
