  text: in whom we have redemption[a], the forgiveness of sins.
translation:
  language: sw
  text: Ndani yake tuna ukombozi[a], msamaha wa dhambi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kuachiliwa” kwa maneno yote mawili, “ukombozi” na “msamaha”; yaelekea hapa Paulo anatumia “msamaha wa dhambi” kufafanua ukombozi huu ni nini.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: ambaye ndani yake
  rationale: Kiwakilishi cha uhusiano kinamrejelea Mwana mpendwa katika mstari uliotangulia. Mpangilio huu unahifadhi maana ya kibinafsi na wazo la kuwa ndani yake, badala ya kuifanya kauli iwe ya chombo, ‘ambaye kwa yeye.’
- source_word: ἔχομεν
  choice: tuna
  rationale: Kitenzi cha wakati uliopo kinaeleza kwamba kwa sasa tunao ukombozi; ‘tuna’ ni tafsiri ya kawaida na ya moja kwa moja.
- source_word: ἀπολύτρωσιν
  choice: ukombozi
  rationale: ‘Ukombozi’ ni neno la kawaida la kibiblia linalobeba maana ya kuwekwa huru, hasa kwa tendo lenye gharama, bila kupunguza maana kuwa ‘kuachiliwa’ tu.
- source_word: ἄφεσιν
  choice: msamaha
  rationale: Katika muktadha wa dhambi, ‘msamaha’ hueleza kwa uwazi kuondolewa kwa hatia au deni la dhambi; hapa nomino hii inafafanua ukombozi.
- source_word: τῶν ἁμαρτιῶν
  choice: wa dhambi
  rationale: Kirai hiki kinaonyesha kile kinachosamehewa. Kiswahili cha kawaida hutumia ‘msamaha wa dhambi’ kwa maana hiyo.
theological_decisions:
- issue: Uhusiano kati ya ‘ukombozi’ na ‘msamaha wa dhambi’
  choice: 'Kutafsiri kirai cha pili kama ufafanuzi wa kwanza: ‘ukombozi, yaani, msamaha wa dhambi.’'
  alternative: ‘ukombozi, msamaha wa dhambi’
  rationale: Katika Kigiriki, ‘msamaha wa dhambi’ umewekwa sambamba na ‘ukombozi’ ili kuueleza. ‘Yaani’ hufanya uhusiano huo uwe wa kawaida na wazi katika Kiswahili, bila kudai kwamba hii ndiyo maana yote ya ukombozi katika kila muktadha.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Ambaye ndani yake’ hudumisha uhusiano na Mwana aliyetajwa katika mstari uliotangulia, na ‘yaani’ huweka wazi uhusiano wa ufafanuzi kati ya nomino hizo mbili.
