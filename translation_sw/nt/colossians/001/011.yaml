  text: being strengthened with all power[a], according to the might of his glory, for all endurance and patience with joy,
translation:
  language: sw
  text: mkiimarishwa kwa nguvu zote, kwa kadiri ya uweza wa utukufu wake[a], ili muwe na ustahimilivu wote na uvumilivu pamoja na furaha,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa kadiri ya uweza wake wenye utukufu.” Kwa karibu zaidi, Kigiriki husema “kwa kadiri ya uweza wa utukufu wake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν πάσῃ δυνάμει
  choice: kwa nguvu zote
  rationale: Kwa pamoja na hali ya kutendewa katika “mkiimarishwa” huonyesha njia au nyenzo ya kuimarishwa. “Nguvu zote” ni Kiswahili cha kawaida na hudumisha wazo la nguvu kwa ukamilifu.
- source_word: δυναμούμενοι
  choice: mkiimarishwa
  rationale: Hali ya kuendelea ya kauli tendwa inaonyesha kwamba waamini wanaendelea kufanywa imara; mtendaji anayeeleweka katika muktadha wa sala ni Mungu.
- source_word: κατὰ τὸ κράτος
  choice: kwa kadiri ya uweza
  rationale: κατά hapa huonyesha kipimo au kiwango. “Kwa kadiri ya” hudumisha kwamba kuimarishwa kwao kunalingana na uweza wa Mungu, huku “uweza” ikitofautisha κράτος na δύναμις iliyotangulia.
- source_word: τῆς δόξης αὐτοῦ
  choice: wa utukufu wake
  rationale: Muundo huu huhifadhi uhusiano wa moja kwa moja wa maneno ya Kigiriki, “uweza wa utukufu wake,” bila kuugeuza kimya kuwa kivumishi “uweza wake wenye utukufu.”
- source_word: εἰς πᾶσαν ὑπομονὴν
  choice: ili mpate kuwa na ustahimilivu wote
  rationale: εἰς huonyesha kusudi au matokeo. “Ili mpate kuwa na” ni ya asili katika Kiswahili na “ustahimilivu” hueleza kusimama imara chini ya taabu.
- source_word: μακροθυμίαν
  choice: uvumilivu
  rationale: “Uvumilivu” ni neno la sasa na linaloeleweka, mara nyingi likihusu subira ya muda mrefu, hasa katika mahusiano; linabaki tofauti na “ustahimilivu.”
- source_word: μετὰ χαρᾶς
  choice: pamoja na furaha
  rationale: Tafsiri hii huiweka χαρά kama nomino na haiamui kupita kiasi ikiwa kirai kinaambatana hasa na ustahimilivu na uvumilivu au na sehemu inayofuata.
theological_decisions:
- issue: Uhusiano wa kuimarishwa kwa waamini na sifa za Mungu
  choice: “kwa kadiri ya uweza wa utukufu wake”
  alternative: “kwa kadiri ya uweza wake wenye utukufu”
  rationale: Chaguo hili hudumisha msongamano wa usemi wa Paulo na muundo wa Kigiriki bila kuingiza ufafanuzi wa kimafundisho usiokuwamo moja kwa moja katika maandishi.
- issue: Kiambatisho cha “pamoja na furaha”
  choice: Kirai kimeachwa mwishoni mwa mstari bila kukifungamanisha kwa mkazo na sehemu moja tu.
  alternative: “mkivumilia yote kwa furaha” au kukiunganisha na kutoa shukrani katika mstari unaofuata
  rationale: Mpangilio wa Kigiriki unaruhusu kirai kueleweka pamoja na ustahimilivu na uvumilivu, lakini mpaka wa kisintaksia kuelekea mstari unaofuata umejadiliwa. Tafsiri haipaswi kuondoa kabisa utata huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. “Ustahimilivu” na “uvumilivu” zimetumiwa kutofautisha maneno mawili yanayokaribiana ya Kigiriki; muundo “uweza wa utukufu wake” umehifadhiwa kwa makusudi.
