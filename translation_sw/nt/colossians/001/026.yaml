source:
  edition: SBLGNT
  text: τὸ μυστήριον τὸ ἀποκεκρυμμένον ἀπὸ τῶν αἰώνων καὶ ἀπὸ τῶν γενεῶν,— ⸀νῦν δὲ ἐφανερώθη τοῖς ἁγίοις αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/026.yaml
  text: the mystery hidden from the ages and from the generations—but now revealed to his saints[b][a],
translation:
  language: sw
  text: ile siri iliyokuwa imefichwa tangu enzi zilizopita na tangu vizazi vilivyopita, lakini sasa imefunuliwa kwa watakatifu wake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Watakatifu wake” maana yake pia inaweza kutafsiriwa “watu wake watakatifu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μυστήριον
  choice: siri
  rationale: Katika matumizi ya Paulo, neno hili humaanisha kusudi la Mungu lililokuwa limefichwa lakini sasa limefunuliwa; “siri” ni neno la kawaida na linaloeleweka katika Kiswahili bila kudokeza fumbo lisiloweza kujulikana.
- source_word: ἀποκεκρυμμένον
  choice: iliyokuwa imefichwa
  rationale: Muundo huu unaonyesha hali iliyotokana na kufichwa hapo awali; tafsiri hii ni ya asili katika Kiswahili na inadumisha maana ya kutendwa.
- source_word: ἀπὸ τῶν αἰώνων
  choice: tangu enzi zilizopita
  rationale: “Tangu” inadumisha nguvu ya ἀπό, na “enzi zilizopita” huonyesha vipindi vya kale badala ya dhana ya umilele.
- source_word: καὶ ἀπὸ τῶν γενεῶν
  choice: na vizazi vilivyopita
  rationale: Tafsiri hii inadumisha usambamba na “enzi zilizopita” huku ikisomeka kwa kawaida katika Kiswahili.
- source_word: νῦν δὲ
  choice: lakini sasa
  rationale: Maneno haya yanaonyesha kwa wazi tofauti kati ya kufichwa hapo awali na kufunuliwa sasa.
- source_word: ἐφανερώθη
  choice: imefunuliwa
  rationale: Kauli ya kutendwa inadumishwa, na wakati timilifu wa Kiswahili unaeleza kwa kawaida ufunuo uliotokea na wenye umuhimu wa sasa bila kulazimisha ufafanuzi wa ziada.
- source_word: τοῖς ἁγίοις αὐτοῦ
  choice: kwa watakatifu wake
  rationale: “Watakatifu wake” inadumisha istilahi ya Paulo kwa watu waliowekwa wakfu kwa Mungu; “kwa” hapa inaeleza wale waliopokea ufunuo.
theological_decisions:
- issue: Maana ya “watakatifu wake”
  choice: Watu wa Mungu waliowekwa wakfu kwake, yaani jumuiya ya waamini
  alternative: Watu wake watakatifu
  rationale: Katika matumizi ya Paulo, ἅγιοι kwa kawaida si tabaka maalumu la watu waliotangazwa rasmi kuwa watakatifu, bali waamini kama watu waliotengwa kwa ajili ya Mungu. Tafsiri inadumisha istilahi hiyo bila kuibana kwa maana ya baadaye ya kidhehebu.
- issue: Asili ya siri
  choice: Siri kama kusudi la Mungu lililofichwa hapo awali na sasa kufunuliwa
  alternative: Fumbo lisiloweza kueleweka
  rationale: Muktadha wenyewe unaweka mkazo juu ya kufichwa na kisha kufunuliwa, si juu ya jambo ambalo kwa asili haliwezi kujulikana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Enzi zilizopita” na “vizazi vilivyopita” vinadumisha usambamba wa Kigiriki bila kufanya sentensi kuwa ngumu. Alama ya tanbihi [a] imewekwa baada ya kirai kinachohusika.
