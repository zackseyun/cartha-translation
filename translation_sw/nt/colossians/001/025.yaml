id: COL.1.25
reference: Colossians 1:25
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἧς ἐγενόμην ἐγὼ διάκονος κατὰ τὴν οἰκονομίαν τοῦ θεοῦ τὴν δοθεῖσάν μοι εἰς ὑμᾶς πληρῶσαι τὸν λόγον τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/025.yaml
  text: of which I became a servant according to the stewardship from God given to me for you[a], to fulfill the word of God[b],
translation:
  language: sw
  text: ambalo nilikuja kuwa mtumishi wake, kwa mujibu wa uwakili kutoka kwa Mungu niliopewa kwa ajili yenu, ili nilitimize neno la Mungu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ili nilifanye neno la Mungu lijulikane kikamilifu,” au “ili nilikamilishe neno la Mungu.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἧς
  choice: ambalo ... wake
  rationale: Kiwakilishi hiki cha kike cha umoja kinarejelea ἐκκλησία (‘kanisa’) katika mstari uliotangulia. Muundo huu unadumisha rejeo hilo bila kulifanya kanisa kuwa mtu.
- source_word: ἐγενόμην
  choice: nimekuwa
  rationale: Kitenzi hiki kinaonyesha kuingia katika hali au jukumu fulani. ‘Nimekuwa’ ni Kiswahili cha kawaida na hakiongezi wazi wazo la kuwekwa rasmi ambalo halijasemwa moja kwa moja.
- source_word: διάκονος
  choice: mtumishi
  rationale: Hapa neno linaonyesha mtu anayehudumu, si lazima cheo maalumu cha kanisa. ‘Mtumishi’ linaeleweka kwa urahisi na halileti maana ya cheo cha baadaye.
- source_word: κατὰ τὴν οἰκονομίαν τοῦ θεοῦ
  choice: kwa mujibu wa jukumu la usimamizi kutoka kwa Mungu
  rationale: οἰκονομία linaweza kumaanisha uwakili, usimamizi, au jukumu lililokabidhiwa. Usemi huu unaonyesha jukumu lenye usimamizi na kwamba chanzo chake ni Mungu, bila kulifanya kuwa cheo cha kidini.
- source_word: τὴν δοθεῖσάν μοι
  choice: nililopewa
  rationale: Muundo wa kutendwa unadumishwa na unahusishwa moja kwa moja na ‘jukumu la usimamizi.’
- source_word: εἰς ὑμᾶς
  choice: kwa ajili yenu
  rationale: Katika muktadha huu kirai kinaonyesha wale wanaonufaika na kuelekezewa huduma ya Paulo.
- source_word: πληρῶσαι
  choice: nilitimize
  rationale: ‘Kutimiza’ huhifadhi upana wa πληρόω na mwangwi wa lugha ya utimilifu katika barua hii, bila kuamua kama mkazo ni kutangaza kikamilifu, kukamilisha, au kutekeleza.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: neno la Mungu
  rationale: Hili ni tamko la kawaida na lenye hadhi kwa ujumbe au ufunuo wa Mungu, nalo linahifadhi mwangwi wa kibiblia wa kirai hiki.
theological_decisions:
- issue: Maana ya πληρῶσαι τὸν λόγον τοῦ θεοῦ
  choice: ili nilitimize neno la Mungu
  alternative: ili nilifanye neno la Mungu lijulikane kikamilifu; au, ili nilikamilishe neno la Mungu
  rationale: Kirai kinaweza kuelekeza kwenye kulifikisha neno la Mungu katika udhihirisho au utangazaji wake kamili, hasa kwa kuzingatia siri inayofunuliwa katika mistari inayofuata. ‘Kulitimiza’ kinahifadhi mvutano huo badala ya kuufunga kwa fasiri moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Jukumu la usimamizi’ linaeleweka zaidi kwa wasomaji wa kawaida kuliko ‘uwakili,’ huku likihifadhi wazo la dhamana iliyokabidhiwa. Alama ya tanbihi [a] imewekwa baada ya kirai kinachohusika.
