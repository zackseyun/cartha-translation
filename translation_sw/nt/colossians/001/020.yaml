  yaml_path: translation/nt/colossians/001/020.yaml
  text: and through him to reconcile all things to himself[d][c][b][a], having made peace through the blood of his cross—through him—whether the things on the earth or the things in the heavens.
translation:
  language: sw
  text: na kwa njia yake[a] kuvipatanisha vitu vyote[b] na yeye mwenyewe, akiisha kufanya amani kwa damu ya msalaba wake—kwa njia yake[d]—viwe ni vitu vilivyo duniani au vitu vilivyo mbinguni.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, ‘kwa yeye’ katika sehemu zote mbili zenye maneno ‘kwa njia yake.’
    reason: lexical_alternative
  - marker: b
    text: Fungu ‘vitu vyote’ limeachwa na maana pana, kulingana na Kigiriki na maneno yanayofuata, ‘viwe ni vitu vilivyo duniani au vitu vilivyo mbinguni.’ Mstari huu wenyewe hauelezi jinsi upatanisho huu unavyohusiana na wokovu wa mwisho.
    reason: alternative_reading
  - marker: c
    text: Katika Kigiriki, neno ‘mbingu’ liko katika wingi.
    reason: lexical_alternative
  - marker: d
    text: Baadhi ya hati za kale hazina maneno ya pili ‘kwa njia yake.’
    reason: textual_variant
lexical_decisions:
- source_word: δι’ αὐτοῦ
  choice: kwa njia yake
  rationale: Kirai hiki kinaonyesha njia au utendaji wa mpatanishi; ‘kwa njia yake’ ni Kiswahili cha kawaida kinachohifadhi msisitizo kwamba upatanisho unatendeka kupitia kwake.
- source_word: ἀποκαταλλάξαι
  choice: kuvipatanisha
  rationale: Kitenzi hiki kinaeleza kurejeshwa kwa uhusiano. ‘Kuvipatanisha’ kinahifadhi maana hiyo bila kuongeza wazo la ukamilifu ambalo kiambishi cha Kigiriki kinaweza kudokeza lakini halilazimishi.
- source_word: τὰ πάντα
  choice: vitu vyote
  rationale: Hili ni fungu pana la wingi lisilo na jinsia katika Kigiriki. ‘Vitu vyote’ linadumisha upeo wake na uhusiano wake na vitu vya duniani na vya mbinguni bila kulibana kuwa watu pekee.
- source_word: εἰς αὐτόν
  choice: na yeye mwenyewe
  rationale: Katika Kiswahili, kupatanisha kitu ‘na’ mtu ni usemi wa kawaida. ‘Yeye mwenyewe’ kinaonyesha uhusiano wa kujirejelea unaoeleweka katika muktadha, yaani Mungu akivipatanisha vitu vyote na yeye mwenyewe kwa njia ya Mwana.
- source_word: εἰρηνοποιήσας
  choice: akiisha kufanya amani
  rationale: Muundo huu unaonyesha tendo lililotangulia au linaloambatana na upatanisho, huku ukihifadhi uhusiano wa kisababishi au njia bila kuligeuza kuwa sentensi huru.
- source_word: διὰ τοῦ αἵματος
  choice: kwa damu
  rationale: ‘Kwa’ linaonyesha njia; ‘damu’ imedumishwa kwa kuwa ni lugha halisi yenye uzito wa dhabihu na haipaswi kufupishwa kuwa ‘kifo’ tu.
- source_word: τοῦ σταυροῦ αὐτοῦ
  choice: ya msalaba wake
  rationale: Tafsiri hii inadumisha ‘msalaba’ na kiwakilishi cha umilikaji kilicho wazi katika Kigiriki, badala ya kuufanya msalaba kuwa ishara dhahania.
- source_word: ⸂[δι’ αὐτοῦ]⸃
  choice: kwa njia yake
  rationale: Kirai kilichorudiwa kimehifadhiwa na kutengwa kwa vistari virefu ili kuonyesha msisitizo wa kurejelea, huku tofauti ya maandishi ikiwekwa katika tanbihi.
- source_word: εἴτε ... εἴτε
  choice: iwe ni ... au
  rationale: Huu ni muundo wa kawaida wa Kiswahili unaohifadhi jozi pana inayotajwa katika Kigiriki.
- source_word: τὰ ἐπὶ τῆς γῆς
  choice: vitu vilivyo duniani
  rationale: ‘Duniani’ linafaa kwa utofautishaji wa ulimwengu na mbingu kuliko ‘nchini’ au ‘ardhini’ katika muktadha huu wa upeo wa uumbaji.
- source_word: τὰ ἐν τοῖς οὐρανοῖς
  choice: vitu vilivyo mbinguni
  rationale: ‘Mbinguni’ ni usemi wa asili wa Kiswahili. Kwa kuwa umbo lake halionyeshi wazi wingi wa Kigiriki, jambo hilo limeelezwa katika tanbihi.
theological_decisions:
- issue: Upeo wa upatanisho katika τὰ πάντα
  choice: Imetafsiriwa kwa upana kuwa ‘vitu vyote’ bila kubana kinachorejelewa wala kuingiza fundisho la wokovu wa wote.
  alternative: ‘watu wote’ au ‘ulimwengu wote kuokolewa hatimaye’
  rationale: Muktadha unazungumzia upatanisho wenye upeo wa uumbaji—vitu vya duniani na vya mbinguni. Tafsiri inadumisha upana huo lakini haiamui jinsi upatanisho huu unavyohusiana na wokovu wa mwisho wa viumbe binafsi.
- issue: Kinachorejelewa na εἰς αὐτόν
  choice: Mungu anavipatanisha vitu vyote na yeye mwenyewe kwa njia ya Mwana.
  alternative: Masihi anavipatanisha vitu vyote na yeye mwenyewe.
  rationale: Sintaksia inaendeleza kusudi kutoka mstari wa 19, ambako Mungu alipendezwa utimilifu wote ukae ndani ya Mwana. ‘Yeye mwenyewe’ linaweka wazi uhusiano wa kujirejelea bila kuongeza dai linalopita sintaksia ya karibu.
- issue: Maana ya ‘damu ya msalaba wake’
  choice: Lugha halisi ya damu na msalaba imedumishwa.
  alternative: ‘kifo chake msalabani’
  rationale: Kigiriki kinataja wazi damu na msalaba. Kudumisha yote mawili kunahifadhi uzito wa dhabihu na tukio la kihistoria bila kuingiza nadharia mahususi ya upatanisho.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa mstari umehifadhiwa kama mwendelezo wa sentensi iliyoanza kabla yake. ‘Kwa njia yake’ na ‘vitu vyote’ ni wazi kwa msomaji wa kawaida huku vikidumisha upana na mvutano wa kifundisho wa Kigiriki.
