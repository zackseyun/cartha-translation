base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/017.yaml
  text: And he is before all things[b][a], and in him all things hold together.
translation:
  language: sw
  text: Naye yuko kabla ya vitu vyote[b], na vitu vyote vimeungamanika ndani yake[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “vitu vyote hudumu pamoja ndani yake,” au “vitu vyote vina mshikamano ndani yake.”
    reason: lexical_alternative
  - marker: b
    text: “Kabla ya vitu vyote” inaweza pia kudokeza ukuu juu ya vitu vyote, lakini maneno ya Kigiriki kimsingi yanaonyesha kutangulia.
    reason: alternative_reading
lexical_decisions:
- source_word: αὐτός
  choice: naye
  rationale: Kiwakilishi cha Kigiriki kimetiliwa mkazo; “naye” kinaonyesha mwendelezo wenye mkazo kwa njia ya kawaida katika Kiswahili bila kuongeza maana kupita kiasi.
- source_word: πρὸ πάντων
  choice: kabla ya vitu vyote
  rationale: πρό pamoja na hali ya genitivi hapa kimsingi huonyesha kutangulia. Usemi huu unahifadhi wazo la kuwako kwake kabla ya vitu vyote bila kuubadili moja kwa moja kuwa usemi wa cheo.
- source_word: τὰ πάντα
  choice: vitu vyote
  rationale: Usemi huu ni mpana na unajumuisha vyote; “vitu vyote” pia huhifadhi marudio ya wazo katika muktadha bila kulibana kuwa “uumbaji wote” pekee.
- source_word: ἐν αὐτῷ
  choice: ndani yake
  rationale: Huhifadhi kwa karibu ἐν αὐτῷ na uhusiano wa kuwa ndani yake, badala ya kuamua kimya kimya maana ya kiutendaji kama “kwa njia yake.”
- source_word: συνέστηκεν
  choice: vinashikamana
  rationale: Kitenzi cha wakati timilifu huonyesha hali ya sasa iliyotokana na tendo lililotangulia. “Vinashikamana” ni Kiswahili cha kawaida kinachoeleza mshikamano unaoendelea.
theological_decisions:
- issue: Uhusiano wa Kristo na vitu vyote katika πρὸ πάντων
  choice: “Kabla ya vitu vyote” huonyesha kimsingi kutangulia kwa wakati.
  alternative: “Juu ya vitu vyote” kwa maana ya ukuu au cheo.
  rationale: Muundo wa Kigiriki kwa kawaida huonyesha kutangulia. Katika muktadha, unaweza pia kudokeza ukuu, lakini tafsiri kuu haipaswi kubadili maana ya msingi kuwa cheo pekee.
- issue: Nguvu ya συνέστηκεν
  choice: Vitu vyote vinaendelea kushikamana ndani yake.
  alternative: Vitu vyote vina asili au kuwapo kwake ndani yake.
  rationale: Tafsiri hii inaonyesha hali endelevu ya mshikamano na mpangilio wa ulimwengu bila kufunga maana pana ya kitenzi kwa ufafanuzi mmoja wa kifalsafa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Naye” huunganisha mstari na muktadha huku ikibeba mkazo wa αὐτός. “Vinashikamana” ni wazi kwa msomaji wa kawaida kuliko istilahi za kitaalamu.
