base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/007.yaml
  text: just as you learned from Epaphras[a], our beloved fellow servant, who is a faithful minister of the Messiah on our behalf[c][b],
translation:
  language: sw
  text: kama vile mlivyojifunza kutoka kwa Epafra, mtumwa mwenzetu mpendwa[a], ambaye ni mhudumu mwaminifu wa Masihi[c] kwa niaba yetu[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana ya msingi, “mtumwa mwenzetu,” yaani mtu ambaye, pamoja nasi, ni mtumwa chini ya bwana yuleyule. Inaweza pia kutafsiriwa “mtumishi mwenzetu.”
    reason: lexical_alternative
  - marker: b
    text: Baadhi ya nakala za kale husoma “yenu” badala ya “yetu.”
    reason: textual_variant
  - marker: c
    text: Kigiriki Χριστοῦ; limetafsiriwa “Masihi” kwa sababu hapa neno hilo linatumika kama cheo.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: kama vile
  rationale: Huendeleza ulinganisho na maelezo yaliyotangulia kwa njia ya kawaida katika Kiswahili.
- source_word: ἐμάθετε ἀπὸ Ἐπαφρᾶ
  choice: mlivyojifunza kutoka kwa Epafra
  rationale: Wakati uliopita unaonyesha jinsi Wakolosai walivyoipokea habari njema, na ἀπό humtaja Epafra kuwa chanzo cha mafundisho hayo bila kuongeza kiwakilishi kisichotajwa wazi.
- source_word: ἀγαπητοῦ συνδούλου ἡμῶν
  choice: mtumwa mwenzetu mpendwa
  rationale: ‘Mtumwa mwenzetu’ huhifadhi wazo la σύνδουλος la watu wanaomilikiwa na bwana yuleyule, huku ‘mpendwa’ ikihifadhi hisia ya upendo.
- source_word: πιστὸς
  choice: mwaminifu
  rationale: Hueleza uaminifu na utegemekaji wa Epafra katika huduma yake.
- source_word: διάκονος
  choice: mhudumu
  rationale: Hapa neno linamaanisha mtu anayemtumikia Masihi, si lazima cheo rasmi cha kanisa.
- source_word: τοῦ Χριστοῦ
  choice: wa Masihi
  rationale: Χριστός inafanya kazi kama cheo chenye maana ya Mtiwa-Mafuta; ‘Masihi’ huhifadhi maana hiyo.
- source_word: ὑπὲρ ἡμῶν
  choice: kwa niaba yetu
  rationale: Huhifadhi maana ya uwakilishi inayowezekana katika ὑπέρ pamoja na kiwakilishi cha nafsi ya kwanza wingi.
theological_decisions:
- issue: Maana ya σύνδουλος
  choice: mtumwa mwenzetu
  alternative: mtumishi mwenzetu
  rationale: Neno la Kigiriki linaonyesha kwamba Epafra, Paulo, na wenzake wako chini ya bwana yuleyule; ‘mtumwa’ huhifadhi kwa uwazi zaidi uhusiano huo wa umiliki na utiifu.
- issue: Jinsi ya kutafsiri Χριστός
  choice: Masihi
  alternative: Kristo
  rationale: Katika kirai hiki neno linamtambulisha yule anayetumikiwa kwa cheo chake, hivyo ‘Masihi’ huhifadhi maana ya cheo bila kukifanya jina tu.
- issue: Maana na tofauti ya maandishi ya ὑπὲρ ἡμῶν
  choice: kwa niaba yetu
  alternative: kwa ajili yenu
  rationale: Maandishi yaliyotolewa yana ἡμῶν, ‘yetu,’ na ‘kwa niaba’ huonyesha uwakilishi. Hata hivyo, kuna ushahidi muhimu wa hati kwa ὑμῶν, ‘yenu,’ ambao umeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa maandiko. Muundo wa sentensi umeachwa ukiendelea kwa koma kwa kuwa mstari huu ni sehemu ya sentensi ndefu iliyoanza kabla yake. ‘Mtumwa mwenzetu’ ni mkali kuliko ‘mtumishi mwenzetu’ lakini umechaguliwa ili kuhifadhi taswira ya σύνδουλος.
