  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Εὐχαριστοῦμεν τῷ ⸀θεῷ πατρὶ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ πάντοτε ⸀περὶ ὑμῶν προσευχόμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/003.yaml
  text: We always give thanks to God[a], the Father of our Lord Jesus the Messiah, when we pray for you,
translation:
  language: sw
  text: Sikuzote tunamshukuru Mungu, Baba wa Bwana wetu Yesu Masihi[a], tunapowaombea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au kwa namna ya mapokeo, “Yesu Kristo.”
    reason: Tafsiri mbadala ya Χριστός, ambayo inaweza kuwakilishwa kwa cheo chenye maana “Masihi” au kwa umbo la mapokeo “Kristo.”
lexical_decisions:
- source_word: Εὐχαριστοῦμεν
  choice: tunamshukuru
  rationale: Kitenzi hiki humaanisha kutoa au kuonyesha shukrani. Katika Kiswahili cha sasa, “tunamshukuru Mungu” ni usemi wa kawaida na wa heshima kuliko tafsiri ngumu ya neno kwa neno kama “tunatoa shukrani kwa Mungu.”
- source_word: τῷ θεῷ πατρὶ
  choice: Mungu, Baba
  rationale: Nomino hizi mbili ziko katika hali ya uhusiano wa ufafanuzi; “Baba” anamfafanua “Mungu.” Koma inaweka uhusiano huo wazi bila kuzifanya kuwa wahusika wawili.
- source_word: τοῦ κυρίου ἡμῶν
  choice: wa Bwana wetu
  rationale: Huhifadhi cheo κύριος na muundo wa kimilikishi wa Kigiriki kwa Kiswahili cha kawaida.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesu Masihi
  rationale: Χριστός hapa inaweza kusikika kama cheo chenye maana ya Mtiwa-Mafuta. “Masihi” huhifadhi maana hiyo, huku “Yesu Kristo” ikitolewa katika tanbihi kama namna ya mapokeo.
- source_word: πάντοτε
  choice: Sikuzote
  rationale: Neno hili humaanisha “daima/sikuzote.” Limewekwa mwanzoni ili lihusiane kwa kawaida na tendo kuu la kumshukuru Mungu, bila kufanya sentensi kuwa nzito.
- source_word: περὶ ὑμῶν
  choice: tunapowaombea
  rationale: Pamoja na kitenzi cha kusali, περί + hali ya umilikishi huonyesha watu wanaohusika katika maombi; “kuwaombea” ni Kiswahili cha kawaida kwa maombi ya uombezi.
- source_word: προσευχόμενοι
  choice: tunapowaombea
  rationale: Hali ya wakati uliopo ya kitenzi-shirikishi huonyesha kitendo kinachoambatana na kutoa shukrani. Muundo wa “tunapo-” unaonyesha hali hiyo kwa Kiswahili cha asili.
theological_decisions:
- issue: Jinsi ya kutafsiri Χριστός katika shukrani ya mwanzo ya barua
  choice: Masihi
  alternative: Kristo
  rationale: “Masihi” huonyesha kwamba Χριστός ni cheo cha Mtiwa-Mafuta, si jina la ukoo. “Kristo” ni tafsiri ya mapokeo na imehifadhiwa katika tanbihi bila kuamua kwamba nguvu ya kicheo imepotea.
- issue: Uhusiano wa “Baba” na “Mungu”
  choice: Mungu, Baba wa Bwana wetu Yesu Masihi
  alternative: Mungu Baba wa Bwana wetu Yesu Masihi
  rationale: Koma huonyesha kwamba “Baba” ni ufafanuzi wa Mungu anayeshukuriwa. Hii hufuata kwa karibu uhusiano wa viambajengo vya Kigiriki bila kuingiza wazo la wahusika wawili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imetumia “tunamshukuru” na “tunapowaombea” kwa mtiririko wa kawaida. “Sikuzote” imehusishwa hasa na tendo kuu la kutoa shukrani, ingawa mpangilio wa Kigiriki unaweza kuruhusu msomaji pia kuhisi ukaribu wake na tendo la kuomba.
