  text: Kwa maana, ilipendeza kwamba ukamilifu wote ukae ndani yake[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa sababu ilipendeza kwamba ukamilifu wote ukae ndani yake.” Kiunganishi hiki kinaweza kutafsiriwa kwa zaidi ya njia moja ya kueleza uhusiano katika muktadha.
