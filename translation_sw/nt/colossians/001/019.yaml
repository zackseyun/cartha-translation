lexical_decisions:
- source_word: ὅτι
  choice: Kwa maana
  rationale: Katika muktadha, kiunganishi hiki kinaeleza msingi wa madai yaliyotangulia kuhusu Mwana. “Kwa maana” huonyesha uhusiano huo wa maelezo kwa Kiswahili cha kawaida, huku “kwa sababu” pia ikiwezekana.
- source_word: ἐν αὐτῷ
  choice: ndani yake
  rationale: Kiwakilishi kinamrejelea Mwana aliyetajwa katika muktadha wa karibu. “Ndani yake” kinahifadhi usemi wa Kigiriki bila kuongeza jina “Kristo” au “Masihi” katika mstari huu.
- source_word: εὐδόκησεν
  choice: ulipendezwa
  rationale: Kitenzi kinaonyesha radhi au kusudi jema. Upatanisho wa ngeli na “utimilifu wote” unaacha kirai hicho kiwe kiima cha kisarufi, kama inavyowezekana katika Kigiriki, bila kuongeza “Mungu” au “Baba” kama kiima kisichotajwa wazi.
- source_word: πᾶν τὸ πλήρωμα
  choice: utimilifu wote
  rationale: Usemi huu ni wa ujumla na mkamilifu. “Utimilifu wote” unahifadhi nguvu ya πᾶν bila kuongeza maneno “wa Mungu,” ambayo yanaeleweka kwa kawaida kutokana na muktadha lakini hayapo wazi hapa.
- source_word: κατοικῆσαι
  choice: kukaa
  rationale: Kitenzi hiki kinamaanisha kufanya makao au kudumu mahali. “Kukaa” ni neno la kawaida, lenye hadhi, na linaeleweka kwa urahisi katika Kiswahili; katika muktadha huu lina maana ya kufanya makao.
theological_decisions:
- issue: Kiima cha εὐδόκησεν ambacho hakijatajwa kwa namna isiyo na utata
  choice: Kutafsiri “utimilifu wote ulipendezwa” bila kuongeza “Mungu” au “Baba.”
  alternative: “Mungu alipendezwa utimilifu wake wote ukae ndani yake” au “Baba alipendezwa…”
  rationale: Kigiriki hakimtaji Mungu au Baba moja kwa moja kuwa kiima. Muundo wa “utimilifu wote ulipendezwa kukaa” unafuata uwezekano wa kisarufi wa maandishi na huepuka kuingiza ufafanuzi wa kitheolojia katika matini kuu, ingawa Kiswahili chake ni cha juu kidogo kuliko mazungumzo ya kawaida.
- issue: Kinachorejelewa na “utimilifu wote”
  choice: Kuacha usemi “utimilifu wote” bila kuupanua.
  alternative: “utimilifu wote wa Mungu” au “utimilifu wake wote”
  rationale: Muktadha, hasa Wakolosai 2:9, unaunga mkono kwa nguvu maana ya utimilifu wa Mungu. Hata hivyo, mstari huu hauna kirai wazi cha “wa Mungu”; hivyo tafsiri inadumisha uzito na pia ukomo wa maneno ya chanzo.
translation_notes:
  register: Kiswahili ni sanifu, cha Afrika Mashariki, chenye hadhi na kinachoeleweka. Muundo “utimilifu wote ulipendezwa kukaa” si wa kawaida sana katika mazungumzo, lakini umechaguliwa kwa makusudi ili kuhifadhi sintaksia na utata halisi wa Kigiriki badala ya kuongeza kiima cha “Mungu” au “Baba.”
