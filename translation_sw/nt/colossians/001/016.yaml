id: COL.1.16
reference: Colossians 1:16
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὅτι ἐν αὐτῷ ἐκτίσθη τὰ ⸀πάντα ἐν τοῖς οὐρανοῖς ⸀καὶ ἐπὶ τῆς γῆς, τὰ ὁρατὰ καὶ τὰ ἀόρατα, εἴτε θρόνοι εἴτε κυριότητες εἴτε ἀρχαὶ εἴτε ἐξουσίαι· τὰ πάντα δι’ αὐτοῦ καὶ εἰς αὐτὸν ἔκτισται·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/016.yaml
  text: For in him all things were created[a], in the heavens and on the earth, the visible and the invisible, whether thrones or dominions or rulers or authorities[d][c][b]; all things have been created through him and for him.
translation:
  language: sw
  text: Kwa maana katika yeye vitu vyote viliumbwa[a], vilivyo mbinguni[b] na duniani, vinavyoonekana na visivyoonekana, iwe ni viti vya enzi, au tawala[c], au watawala, au mamlaka; vitu vyote vimeumbwa kwa njia yake na kwa ajili yake[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa sababu katika yeye vitu vyote viliumbwa.”
    reason: lexical_alternative
  - marker: b
    text: Kigiriki kina “katika mbingu” kwa umbo la wingi.
    reason: lexical_alternative
  - marker: c
    text: Au, “mamlaka za utawala” au “utawala”; huenda maneno haya yanataja madaraja mbalimbali ya mamlaka yaliyoumbwa.
    reason: lexical_alternative
  - marker: d
    text: Au, “kuelekea kwake”; usemi “kwa ajili yake” unaonyesha kwamba yeye ndiye lengo la uumbaji.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Kwa maana
  rationale: Katika muktadha huu neno hilo linatoa msingi wa dai lililotangulia kuhusu ukuu wa Mwana; “Kwa maana” ni kiunganishi cha kawaida kinachohifadhi nguvu yake ya kisababishi.
- source_word: ἐν αὐτῷ
  choice: ndani yake
  rationale: Huhifadhi wazo la “katika yeye” bila kuligeuza kuwa “kwa yeye,” kwa kuwa baadaye δι’ αὐτοῦ linaeleza wazi wazo la njia au upatanishi.
- source_word: ἐκτίσθη
  choice: viliumbwa
  rationale: Kitenzi cha kutendwa kinaafikiana kwa kawaida na “vitu vyote” na kinaeleza tendo la uumbaji lililotokea.
- source_word: τὰ πάντα
  choice: vitu vyote
  rationale: Ni tafsiri pana na wazi inayohifadhi upeo wa jumla wa maneno ya Kigiriki bila kuyafafanua kuwa ulimwengu pekee.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: vilivyo mbinguni
  rationale: “Mbinguni” ni usemi wa kawaida wa Kiswahili unaowakilisha eneo la mbingu; tanbihi inaonyesha umbo la wingi la Kigiriki.
- source_word: ἐπὶ τῆς γῆς
  choice: juu ya dunia
  rationale: Ni tafsiri ya kawaida inayolingana na “mbinguni” na kuonyesha upeo wote wa uumbaji.
- source_word: τὰ ὁρατὰ καὶ τὰ ἀόρατα
  choice: vinavyoonekana na visivyoonekana
  rationale: Vivumishi hivi vinatumika kama nomino; muundo huu ni mfupi, wa asili, na huhifadhi utofautishaji wake.
- source_word: εἴτε ... εἴτε ... εἴτε ... εἴτε
  choice: iwe ni ... au ... au ... au
  rationale: Muundo huu ni wa kawaida katika Kiswahili na huhifadhi orodha ya makundi yote manne.
- source_word: θρόνοι
  choice: viti vya enzi
  rationale: Tafsiri ya moja kwa moja huhifadhi taswira ya vyeo au nafasi za mamlaka bila kuamua aina yake.
- source_word: κυριότητες
  choice: mamlaka kuu
  rationale: Huwasilisha kwa lugha inayoeleweka wazo la utawala au cheo chenye nguvu, huku tanbihi ikihifadhi uwezekano wa “utawala mkuu.”
- source_word: ἀρχαὶ
  choice: watawala
  rationale: Huwasilisha maana ya wenye kutawala kwa Kiswahili cha sasa bila kutumia istilahi ya kidini isiyoeleweka kwa urahisi.
- source_word: ἐξουσίαι
  choice: wenye mamlaka
  rationale: Hutofautisha kundi hili na “watawala” na kudumisha maana ya wale wenye mamlaka.
- source_word: δι’ αὐτοῦ
  choice: kwa njia yake
  rationale: Hueleza wazi kwamba uumbaji ulifanyika kupitia yeye, na hutofautishwa na “ndani yake.”
- source_word: εἰς αὐτόν
  choice: kwa ajili yake
  rationale: Huwasilisha kwa lugha ya kawaida kwamba yeye ndiye kusudi au lengo la uumbaji; tanbihi inahifadhi tafsiri ya karibu zaidi ya mwelekeo.
theological_decisions:
- issue: Uhusiano wa Mwana na uumbaji katika ἐν αὐτῷ / δι’ αὐτοῦ / εἰς αὐτόν
  choice: Kuhifadhi maneno tofauti “ndani yake ... kwa njia yake ... kwa ajili yake.”
  alternative: “kwa yeye ... kupitia yeye ... kuelekea kwake”
  rationale: Kigiriki kinatumia vihusishi vitatu tofauti ili kuonyesha uhusiano wenye vipengele kadhaa kati ya Mwana na uumbaji. Tafsiri haivisawazishi kuwa wazo moja.
- issue: Asili ya “viti vya enzi ... mamlaka kuu ... watawala ... wenye mamlaka”
  choice: Kuyatafsiri kama makundi ya mamlaka yaliyoumbwa bila kuyafafanua zaidi.
  alternative: Kuyataja wazi kuwa madaraja ya malaika au mifumo ya kisiasa ya wanadamu.
  rationale: Aya inataja makundi ya mamlaka katika uumbaji lakini haisemi hapa kwamba ni ya kiroho tu au ya kidunia tu; tafsiri haipaswi kuamua jambo hilo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imehifadhiwa kuwa moja kwa kutumia nuktakoma, kama muundo wa Kigiriki. Istilahi za mamlaka zimewekwa wazi kwa msomaji wa kawaida bila kubainisha ikiwa ni nguvu za kiroho au za kidunia.
