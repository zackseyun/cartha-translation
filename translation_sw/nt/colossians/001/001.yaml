lexical_decisions:
- source_word: Παῦλος
  choice: Paulo
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili cha Biblia.
- source_word: ἀπόστολος
  choice: mtume
  rationale: Katika utambulisho wa Paulo, neno hili ni cheo cha mtu aliyetumwa na kupewa mamlaka, si mjumbe wa kawaida tu.
- source_word: Χριστοῦ Ἰησοῦ
  choice: wa Masihi Yesu
  rationale: Muundo wa kumilikisha unaonyesha kwamba Paulo ni mtume wa Masihi Yesu. ‘Masihi’ huhifadhi maana ya cheo cha Χριστός, huku ‘Yesu’ likiwa jina.
- source_word: διὰ θελήματος θεοῦ
  choice: kwa mapenzi ya Mungu
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha kwamba utume wa Paulo unatokana na uamuzi au kusudi la Mungu.
- source_word: Τιμόθεος
  choice: Timotheo
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili cha Biblia.
- source_word: ὁ ἀδελφὸς
  choice: ndugu yetu
  rationale: Ingawa Kigiriki kinasema kihalisi ‘ndugu huyo,’ muktadha wa salamu ya barua unaonyesha uhusiano wa pamoja wa waamini; ‘ndugu yetu’ ni Kiswahili cha asili bila kubadili maana.
theological_decisions:
- issue: Tafsiri ya Χριστός
  choice: Masihi
  alternative: Kristo
  rationale: Hapa neno hilo linafanya kazi kama cheo kinachomtambulisha Yesu kuwa Mtiwa-Mafuta aliyeahidiwa. ‘Masihi’ huhifadhi maana hiyo wazi; ‘Kristo’ limetolewa kama tafsiri mbadala iliyozoeleka.
- issue: Nguvu ya uhusiano katika ὁ ἀδελφός
  choice: ndugu yetu
  alternative: ndugu huyo
  rationale: Neno linamtambulisha Timotheo kama mshiriki wa familia ya imani. Kiswahili cha kawaida hutumia ‘ndugu yetu’ katika muktadha huu, bila kulifanya kuwa dai la undugu wa damu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya barua ya kitume lakini kinachoeleweka kwa urahisi. Mpangilio na koma ya mwisho vimehifadhi muundo wa utangulizi unaoendelea katika mstari unaofuata.
