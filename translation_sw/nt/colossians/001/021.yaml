base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/021.yaml
  text: And you[a], who once were alienated and hostile in mind in evil deeds—
translation:
  language: sw
  text: Nanyi[a], ambao hapo zamani mlikuwa mmetengwa, wenye uadui katika nia zenu, katika matendo maovu—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “maadui katika nia zenu, katika matendo maovu.” Kigiriki ni kifupi, na uhusiano kati ya uadui wa nia na matendo maovu unaweza kueleweka kwa zaidi ya njia moja.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ὑμᾶς
  choice: Nanyi
  rationale: Huendeleza sentensi ya mstari uliotangulia na kuwajumuisha wasomaji katika hoja; kiambishi -na hudumisha nguvu ya καί.
- source_word: ποτε
  choice: hapo zamani
  rationale: Huonyesha hali yao ya awali kwa Kiswahili cha kawaida na kuandaa utofauti na hali yao ya sasa.
- source_word: ὄντας
  choice: ambao ... mlikuwa
  rationale: Kishiriki cha Kigiriki kimewasilishwa kwa kishazi tegemezi cha asili katika Kiswahili bila kupoteza maana ya hali iliyokuwa ikiwasifu.
- source_word: ἀπηλλοτριωμένους
  choice: mmetengwa naye
  rationale: Hueleza hali ya kutenganishwa au kufanywa wageni; 'naye' humrejelea Mungu kutokana na muktadha bila kuingiza jina lisilokuwapo katika mstari.
- source_word: ἐχθροὺς
  choice: maadui
  rationale: Huhifadhi kwa karibu nomino ya Kigiriki na uzito wake wa kimahusiano badala ya kuibadili kabisa kuwa kivumishi.
- source_word: τῇ διανοίᾳ
  choice: katika nia zenu
  rationale: Dativo inaweza kuonyesha eneo au upande ambamo uadui ulikuwapo; 'nia' hujumuisha fikira na mwelekeo wa ndani.
- source_word: ἐν τοῖς ἔργοις τοῖς πονηροῖς
  choice: katika matendo yenu maovu
  rationale: Hufuata muundo wenye ἐν bila kuamua kwa lazima kama matendo ndiyo sababu, eneo, au udhihirisho wa uadui.
- source_word: ἔργοις
  choice: matendo
  rationale: Ni neno la sasa na la kawaida linaloeleza vitendo bila kuleta maana maalumu ya kitheolojia ya 'matendo ya sheria'.
- source_word: πονηροῖς
  choice: maovu
  rationale: Hutoa moja kwa moja hukumu ya kimaadili iliyomo katika neno la Kigiriki.
theological_decisions:
- issue: Uhusiano kati ya uadui wa ndani na matendo maovu
  choice: katika nia zenu, katika matendo yenu maovu
  alternative: mkiwa na nia ya uadui, mkifanya matendo maovu
  rationale: 'Muundo sambamba huhifadhi ufupi na utata wa ἐν: matendo yanaweza kuwa eneo au udhihirisho wa uadui, bila kudai wazi kuwa ndiyo sababu yake.'
- issue: Kile ambacho wasomaji walikuwa wametengwa nacho
  choice: naye
  alternative: kutengwa
  rationale: Muktadha unaelekeza kwa Mungu, lakini kiwakilishi kinadumisha mwendelezo wa sentensi bila kuongeza jina 'Mungu' ndani ya mstari huu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Alama ya mwisho ya mkato mrefu imehifadhiwa kwa kuwa wazo linaendelea katika mstari unaofuata.
