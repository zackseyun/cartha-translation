lexical_decisions:
- source_word: ἐρρύσατο
  choice: alituokoa
  rationale: Kitenzi ‘kuokoa’ kinaonyesha kitendo thabiti cha kututoa katika hatari au chini ya nguvu yenye uadui, bila kuongeza istilahi ya kiteolojia isiyomo katika Kigiriki.
- source_word: ἐξουσίας
  choice: mamlaka
  rationale: ‘Mamlaka’ ni kisawe cha moja kwa moja cha ἐξουσία na hapa kinaweza kumaanisha nguvu inayotawala, bila kubadili taswira hiyo kuwa eneo tu.
- source_word: σκότους
  choice: giza
  rationale: ‘Giza’ linadumisha taswira ya Kigiriki na kuacha vidokezo vyake vya kimaadili na kiroho viamuliwe na muktadha.
- source_word: μετέστησεν
  choice: kutuhamishia
  rationale: ‘Kutuhamishia’ huonyesha kuondolewa kutoka chini ya mamlaka moja na kuingizwa katika ufalme mwingine; kiambishi -ia kinaendana kiasili na ‘katika ufalme.’
- source_word: βασιλείαν
  choice: ufalme
  rationale: Katika taswira ya kuhamishwa na kuingizwa mahali pengine, ‘ufalme’ huwasilisha kwa kawaida eneo linalotawaliwa na Mwana huku ikidokeza utawala wake.
- source_word: υἱοῦ
  choice: Mwana
  rationale: ‘Mwana’ ni tafsiri ya moja kwa moja; herufi kubwa inaonyesha kwamba muktadha unamtaja Mwana wa pekee anayezungumziwa katika kifungu hiki kuhusu Kristo.
- source_word: ἀγάπης
  choice: pendo
  rationale: ‘Pendo’ ni nomino ya Kiswahili inayowezesha muundo wa karibu na Kigiriki, ‘Mwana wa pendo lake,’ bila kuufafanua kimya kimya kuwa tu ‘Mwana mpendwa.’
- source_word: τοῦ υἱοῦ τῆς ἀγάπης αὐτοῦ
  choice: Mwana wa pendo lake
  rationale: Muundo huu unahifadhi kwa kiasi kikubwa kirai cha uhusiano wa umilikaji cha Kigiriki. Maana zake za kawaida zaidi katika Kiswahili zimewekwa katika tanbihi ili msomaji apate ufafanuzi bila kuondoa upekee wa matini kuu.
theological_decisions:
- issue: Tafsiri ya kirai τοῦ υἱοῦ τῆς ἀγάπης αὐτοῦ
  choice: Mwana wa pendo lake
  alternative: Mwana wake mpendwa; Mwana anayempenda
  rationale: Kirai kinaeleza pendo la Mungu kwa Mwana. Matini kuu inadumisha mvutano na muundo usio wa kawaida wa Kigiriki, ilhali tanbihi inatoa maana mbili za Kiswahili zilizo wazi zaidi bila kulazimisha moja kuwa tafsiri pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Alituokoa,’ ‘mamlaka ya giza,’ na ‘kutuhamishia katika ufalme’ ni miundo ya sasa na ya kawaida. ‘Mwana wa pendo lake’ umechaguliwa kwa makusudi ili kuhifadhi muundo wa Kigiriki; tanbihi inazuia usemi huo usieleweke vibaya.
