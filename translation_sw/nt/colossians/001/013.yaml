  text: ambaye alituokoa kutoka katika mamlaka ya giza, akatuhamisha katika ufalme wa Mwana wa pendo lake,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mwana wake mpendwa,” au “Mwana ambaye anapendwa naye.”
