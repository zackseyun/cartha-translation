  text: ὃν ἡμεῖς καταγγέλλομεν νουθετοῦντες πάντα ἄνθρωπον καὶ διδάσκοντες πάντα ἄνθρωπον ἐν πάσῃ σοφίᾳ, ἵνα παραστήσωμεν πάντα ἄνθρωπον τέλειον ἐν ⸀Χριστῷ·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/028.yaml
  text: Him we proclaim, warning every person and teaching every person with all wisdom, so that we may present every person mature in Messiah.
translation:
  language: sw
  text: Yeye ndiye tunayemtangaza, tukimwonya kila mtu na kumfundisha kila mtu kwa hekima yote, ili tumwasilishe kila mtu akiwa amekomaa katika Kristo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταγγέλλομεν
  choice: tunayemtangaza
  rationale: Kitenzi hiki humaanisha kutangaza au kuhubiri waziwazi; ‘tunayemtangaza’ huhifadhi Kristo kuwa ndiye anayelengwa na tangazo.
- source_word: νουθετοῦντες
  choice: tukimwonya
  rationale: Hujumuisha kuonya kwa kumwelekeza mtu kiakili na kimaadili; ‘tukimwonya’ ni ya kawaida na inaendana na muktadha.
- source_word: πάντα ἄνθρωπον
  choice: kila mtu
  rationale: Kirai hiki kimerudiwa mara tatu kwa msisitizo wa upeo unaomhusu kila mtu; marudio yamehifadhiwa.
- source_word: ἐν πάσῃ σοφίᾳ
  choice: kwa hekima yote
  rationale: Huhifadhi kwa karibu maana na upeo wa πάσῃ bila kuongeza chanzo cha hekima ambacho hakikutajwa wazi.
- source_word: παραστήσωμεν
  choice: tumlete
  rationale: Katika muktadha wa kumweka mtu mbele kwa kukubaliwa au kutathminiwa, ‘tumlete’ ni ya asili katika Kiswahili huku ikihifadhi wazo la kuwasilisha.
- source_word: τέλειον
  choice: amekomaa
  rationale: Hapa neno linaelekea kumaanisha ukomavu au ukamilifu wa Kikristo; ‘amekomaa’ huepuka kudokeza kutokuwa na dosari kabisa.
- source_word: ἐν Χριστῷ
  choice: katika Kristo
  rationale: Tafsiri ya moja kwa moja inayohifadhi muungano au nafasi ya mtu ndani ya Kristo bila kuifafanua kupita kiasi.
theological_decisions:
- issue: Maana ya τέλειον
  choice: amekomaa
  alternative: mkamilifu
  rationale: ‘Amekomaa’ inafaa kwa lengo la ukuaji katika Kristo na haifungi kifungu kwenye dai la ukamilifu usio na dhambi; hata hivyo, wazo la ukamilifu kamili halijafutwa kabisa katika neno la Kigiriki.
- issue: Cheo Χριστός
  choice: Kristo
  alternative: Masihi
  rationale: ‘Kristo’ ndilo umbo la kawaida la jina/cheo katika Agano Jipya la Kiswahili na hapa neno linatumiwa kama utambulisho uliowekwa wazi wa Yesu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Muundo wa Kigiriki wenye marudio ya ‘kila mtu’ umehifadhiwa kwa ajili ya msisitizo; sentensi imeundwa kwa mtiririko wa kawaida wa Kiswahili.
