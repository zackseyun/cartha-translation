base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/006.yaml
  text: which has come to you[a], just as also in all the world it is bearing fruit and growing, just as also among you[d][c][b], from the day you heard and came to know the grace of God in truth.
translation:
  language: sw
  text: Injili hiyo imewafikia, na ulimwenguni kote inazaa matunda na kukua, kama ilivyo pia miongoni mwenu, tangu siku mliposikia na kuijua neema ya Mungu katika kweli.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: d
    text: Au, “kwa kweli,” au “katika ile kweli.”
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦ παρόντος εἰς ὑμᾶς
  choice: ambayo imewafikia
  rationale: The participle continues the description of the gospel from verse 5. “Imewafikia” naturally expresses its arrival and presence among the Colossians without overexplaining the phrase.
- source_word: ἐν παντὶ τῷ κόσμῳ
  choice: ulimwenguni kote
  rationale: This is natural Standard East African Swahili and retains Paul’s expansive universal wording without turning it into a technical geographical claim.
- source_word: ἐστὶν καρποφορούμενον καὶ αὐξανόμενον
  choice: inazaa matunda na kukua
  rationale: The wording preserves both the agricultural metaphor and the continuing action expressed by the Greek construction.
- source_word: καθὼς καὶ ἐν ὑμῖν
  choice: ndivyo ilivyo pia miongoni mwenu
  rationale: “Miongoni mwenu” naturally presents the Colossians corporately while a footnote preserves the possible sense of activity within them.
- source_word: ἐπέγνωτε
  choice: kuijua
  rationale: “Kuijua” communicates real recognition or coming to know without importing the stronger and potentially overstated idea of exhaustive knowledge.
- source_word: τὴν χάριν τοῦ θεοῦ
  choice: neema ya Mungu
  rationale: This established and dignified Swahili expression accurately preserves the central Pauline phrase.
- source_word: ἐν ἀληθείᾳ
  choice: katika kweli
  rationale: The relatively formal wording preserves the ambiguity between manner (“truly”) and sphere or content (“in the truth”).
theological_decisions:
- issue: Scope of ἐν παντὶ τῷ κόσμῳ
  choice: Retain the universal wording “ulimwenguni kote” as a broad description of the gospel’s worldwide spread.
  alternative: Treat it as a strict claim that every individual and geographical region had already been reached.
  rationale: The translation preserves Paul’s expansive language while adding no interpretive limitation or geographical specification.
- issue: Nuance of ἐν ἀληθείᾳ
  choice: Render it “katika kweli” to preserve the phrase’s ambiguity.
  alternative: Resolve it as either “kwa kweli” or “katika ile kweli.”
  rationale: The Greek can describe manner or the sphere/content of truth; the main text should not silently choose between these closely related senses.
translation_notes:
  register: Natural, current, dignified Standard East African Swahili. The semicolon clarifies the repeated comparison without suppressing the Greek structure. All alternatives are phrased for ordinary readers, and no denominational terminology has been introduced.
