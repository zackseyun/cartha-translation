id: COL.1.9
reference: Colossians 1:9
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Διὰ τοῦτο καὶ ἡμεῖς, ἀφ’ ἧς ἡμέρας ἠκούσαμεν, οὐ παυόμεθα ὑπὲρ ὑμῶν προσευχόμενοι καὶ αἰτούμενοι ἵνα πληρωθῆτε τὴν ἐπίγνωσιν τοῦ θελήματος αὐτοῦ ἐν πάσῃ σοφίᾳ καὶ συνέσει πνευματικῇ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/009.yaml
  text: For this reason[a], we also, from the day we heard, have not ceased praying for you and asking that you may be filled with the knowledge of his will in all spiritual wisdom and understanding[b],
translation:
  language: sw
  text: Kwa sababu hiyo, sisi pia, tangu siku tuliposikia, hatujaacha kuwaombea na kuomba kwamba mjazwe ujuzi[a] wa mapenzi yake, katika hekima yote na ufahamu wa kiroho[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ujuzi kamili.” Neno la Kigiriki linaweza kuwa na maana ya ujuzi ulio kamili zaidi au wa kina zaidi.
    reason: lexical_alternative
  - marker: b
    text: Kirai “wa kiroho” kinaweza kumaanisha wa tabia ya kiroho au unaotolewa na Roho.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Kwa sababu hiyo
  rationale: Kirai hiki kinaonyesha sababu inayotokana na habari iliyotangulia kuhusu imani na upendo wa Wakolosai; tafsiri hii ni ya kawaida na inahifadhi uhusiano huo.
- source_word: καὶ ἡμεῖς
  choice: sisi pia
  rationale: Neno καί linawakazia Paulo na wenzake kuwa wao pia waliitikia habari hiyo; kiwakilishi “sisi” kinahifadhi mkazo wa Kigiriki.
- source_word: ἀφ’ ἧς ἡμέρας ἠκούσαμεν
  choice: tangu siku tuliposikia
  rationale: Inaonyesha mwanzo wa tendo la kuomba linaloendelea hadi sasa; “tangu” ni ya asili katika Kiswahili.
- source_word: οὐ παυόμεθα
  choice: hatujaacha
  rationale: Wakati wa sasa wa Kigiriki unaonyesha tendo linaloendelea; hali timilifu ya Kiswahili inaeleza vizuri kwamba hawakuacha na bado wanaendelea.
- source_word: ὑπὲρ ὑμῶν προσευχόμενοι καὶ αἰτούμενοι
  choice: kuwaombea na kuomba
  rationale: “Kuwaombea” inaonyesha sala kwa niaba yao, huku “kuomba” ikihifadhi wazo maalumu la kutoa ombi; hivyo vitenzi vyote viwili vimehifadhiwa.
- source_word: ἵνα πληρωθῆτε
  choice: kwamba mjazwe
  rationale: Hii inaeleza yaliyomo katika ombi. Kauli tendwa inahifadhi Mungu kama mtendaji anayeeleweka bila kumtaja waziwazi.
- source_word: τὴν ἐπίγνωσιν
  choice: ujuzi
  rationale: “Ujuzi” ni neno wazi la Kiswahili kwa kujua au kuwa na maarifa. Uwezekano wa maana iliyosisitizwa, yaani “ujuzi kamili,” umehifadhiwa katika tanbihi badala ya kuingizwa moja kwa moja katika matini.
- source_word: τοῦ θελήματος αὐτοῦ
  choice: wa mapenzi yake
  rationale: Hii inafuata muundo wa umilikaji wa Kigiriki kwa Kiswahili cha kawaida bila kuongeza mhusika ambaye kiwakilishi kinamrejelea.
- source_word: ἐν πάσῃ σοφίᾳ καὶ συνέσει πνευματικῇ
  choice: katika hekima na ufahamu wote wa kiroho
  rationale: “Katika” linahifadhi wazo la mazingira au namna ambamo ujuzi huo unapatikana. Muundo huu unaunganisha “wa kiroho” na hekima pamoja na ufahamu bila kuamua wazi kama maana yake ni tabia ya kiroho au kutolewa na Roho.
- source_word: σοφίᾳ
  choice: hekima
  rationale: Hili ndilo neno la kawaida na lenye heshima kwa σοφία, likijumuisha busara ya kuelewa na kuishi kwa usahihi.
- source_word: συνέσει
  choice: ufahamu
  rationale: Neno hili linaeleza uwezo wa kuelewa na kuunganisha mambo, na linaendana kwa kawaida na “hekima.”
theological_decisions:
- issue: Uzito wa maana ya ἐπίγνωσις katika ombi la Paulo
  choice: ujuzi
  alternative: ujuzi kamili
  rationale: ἐπίγνωσις linaweza kudokeza ujuzi kamili au wa kina zaidi, lakini maana hiyo iliyosisitizwa hailazimishwi na sarufi hapa. Matini kuu inabaki wazi, na maana nyingine inaelezwa katika tanbihi.
- issue: Maana na upeo wa πνευματικῇ
  choice: wa kiroho, likielezea hekima na ufahamu bila kumtaja Roho Mtakatifu moja kwa moja
  alternative: hekima na ufahamu unaotolewa na Roho
  rationale: Kivumishi hicho kinaweza kumaanisha sifa ya kiroho au uhusiano na Roho Mtakatifu. Tafsiri fupi “wa kiroho” inahifadhi uwezekano huo wa pande mbili badala ya kuutatua kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inahifadhi mtiririko wa ombi la Paulo huku ikitumia miundo inayoeleweka kwa msomaji wa kawaida. Alama za tanbihi zimewekwa baada ya maneno yanayohusika moja kwa moja.
