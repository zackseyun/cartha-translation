  yaml_path: translation/nt/colossians/001/004.yaml
  text: having heard of your faith in Messiah Jesus and the love that you have for all the saints,[a]
translation:
  language: sw
  text: Tuliposikia habari za imani yenu katika Masihi Yesu na upendo mlio nao kwa watakatifu wote.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “tumaini lenu katika Masihi Yesu” au “uaminifu wenu katika Masihi Yesu.” Neno la Kigiriki pistis linaweza kuwa na maana hizi zinazohusiana kulingana na muktadha.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσαντες
  choice: kwa kuwa tumesikia juu ya
  rationale: Kirai hiki kinaendeleza mhusika aliyedokezwa katika mstari uliotangulia na kutaja sababu ya shukrani. Kiswahili cha sasa hutumia kwa kawaida “kusikia juu ya” wakati kilichosikiwa ni habari kuhusu jambo.
- source_word: πίστιν
  choice: imani
  rationale: “Imani” ndiyo tafsiri ya kawaida ya πίστις na hapa inafaa kwa uhusiano wa Wakolosai na Masihi Yesu; maana zinazohusiana za kumtumaini na uaminifu zimehifadhiwa katika tanbihi.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: katika Masihi Yesu
  rationale: “Katika” huhifadhi usemi wa Paulo wenye maana ya uhusiano au hali, na “Masihi” hutafsiri cheo Χριστός huku Yesu likibaki jina.
- source_word: ἀγάπην
  choice: upendo
  rationale: Hii ni tafsiri ya kawaida, wazi na yenye hadhi ya ἀγάπη.
- source_word: ἣν ἔχετε
  choice: mlio nao
  rationale: Huhifadhi kishazi rejeshi kilichopo katika SBLGNT na kueleza kwa Kiswahili cha asili kwamba wasomaji wana upendo huo.
- source_word: εἰς πάντας τοὺς ἁγίους
  choice: kwa watakatifu wote
  rationale: “Kwa” ni usemi wa kawaida wa Kiswahili kwa upendo unaoelekezwa kwa watu, na “watakatifu” huhifadhi istilahi ya Paulo kwa waumini waliowekwa wakfu kwa Mungu.
theological_decisions:
- issue: Kutafsiri Χριστῷ kama cheo au kuitumia kama umbo la jina
  choice: Masihi Yesu
  alternative: Kristo Yesu
  rationale: Χριστός ni cheo kinachomaanisha Masihi; kukitafsiri huhifadhi maana yake badala ya kukifanya tu sehemu ya jina.
- issue: Wigo wa maana ya πίστις
  choice: imani
  alternative: kumtumaini; uaminifu
  rationale: Katika muktadha huu “imani” ndiyo maana inayofaa zaidi, lakini neno la Kigiriki linaweza pia kuwa na vivuli vinavyohusiana vya kutumaini au uaminifu; tanbihi huhifadhi uwezekano huo bila kuamua kupita ushahidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Kwa kuwa tumesikia” linaunganisha mstari huu kwa kawaida na shukrani ya mstari uliotangulia; “mlio nao” ni fupi na ya asili kuliko “ambao mnao.”
