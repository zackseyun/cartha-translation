id: COL.1.27
reference: Colossians 1:27
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οἷς ἠθέλησεν ὁ θεὸς γνωρίσαι τί τὸ πλοῦτος τῆς δόξης τοῦ μυστηρίου τούτου ἐν τοῖς ἔθνεσιν, ⸀ὅ ἐστιν Χριστὸς ἐν ὑμῖν, ἡ ἐλπὶς τῆς δόξης·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/027.yaml
  text: To them God chose to make known what is the riches of the glory of this mystery among the Gentiles[a], which is Messiah in you[b], the hope of glory.
translation:
  language: sw
  text: Mungu alitaka kuwajulisha jinsi utajiri wa utukufu wa siri hii ulivyo mkuu miongoni mwa watu wa mataifa, yaani, Masihi aliye ndani yenu[a], tumaini la utukufu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Masihi aliye miongoni mwenu.” Kigiriki kinaweza kumaanisha Masihi kuwa ndani ya waamini au kuwa miongoni mwao kama jumuiya.
    reason: alternative_reading
lexical_decisions:
- source_word: οἷς
  choice: kuwajulisha
  rationale: Kiambishi -wa- kinawarejelea watakatifu waliotajwa katika mstari uliotangulia na ni yambwa isiyo ya moja kwa moja ya 'kujulisha'.
- source_word: ἠθέλησεν
  choice: alipenda
  rationale: Huwasilisha nia na mapenzi ya Mungu kwa Kiswahili cha kawaida bila kulazimisha maana finyu ya 'alichagua'.
- source_word: γνωρίσαι
  choice: kujulisha
  rationale: Ni ulinganifu wa moja kwa moja na wa kawaida wa maana ya kufanya jambo lijulikane.
- source_word: τί τὸ πλοῦτος τῆς δόξης
  choice: jinsi ulivyo mkuu utajiri wa utukufu
  rationale: Muundo huu ni wa asili katika Kiswahili na unaonyesha wingi au ukubwa wa utajiri unaosisitizwa na kirai cha Kigiriki, bila kutumia sarufi isiyo ya kawaida.
- source_word: μυστηρίου
  choice: siri
  rationale: Katika muktadha huu ni kusudi la Mungu lililokuwa limefichwa lakini sasa limejulishwa; 'siri' huwasilisha maana hiyo kwa uwazi.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: miongoni mwa watu wa mataifa
  rationale: Hutambulisha wasio Wayahudi kwa uwazi huku ikidumisha maana ya ἔθνη.
- source_word: ὅ ἐστιν
  choice: yaani
  rationale: Hutambulisha kwa kawaida maelezo yanayobainisha siri hiyo.
- source_word: Χριστὸς
  choice: Masihi
  rationale: Hapa Χριστός ina nguvu ya cheo na inabainisha yaliyomo katika siri.
- source_word: ἐν ὑμῖν
  choice: aliye ndani yenu
  rationale: Huhifadhi maana ya moja kwa moja ya uwepo ndani ya waamini, huku maana ya kijumuiya 'miongoni mwenu' ikiwekwa katika tanbihi.
- source_word: ἡ ἐλπὶς τῆς δόξης
  choice: tumaini la utukufu
  rationale: Huhifadhi ufupi na msongamano wa kirai cha asili bila kuamua kupita kiasi uhusiano wa genitivi.
theological_decisions:
- issue: Maana ya Χριστός
  choice: Masihi
  alternative: Kristo
  rationale: Katika kishazi hiki neno linafanya kazi kama cheo kinachotambulisha siri, hivyo 'Masihi' hudumisha nguvu hiyo.
- issue: Maana ya ἐν ὑμῖν
  choice: aliye ndani yenu
  alternative: aliye miongoni mwenu
  rationale: Kigiriki kinaweza kumaanisha uwepo wa Masihi ndani ya waamini au miongoni mwao kama jumuiya. Maandishi makuu yanatumia maana ya moja kwa moja, na tanbihi inadumisha uwezekano mwingine.
- issue: Uhusiano wa ἐν τοῖς ἔθνεσιν na ἐν ὑμῖν
  choice: miongoni mwa watu wa mataifa ... ndani yenu
  alternative: miongoni mwa watu wa mataifa ... miongoni mwenu
  rationale: Tofauti hii haifuti mvutano kati ya upeo wa siri kati ya watu wa mataifa na uwepo wa Masihi kwa waamini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Watu wa mataifa' ni wazi zaidi kwa wasomaji wa kawaida kuliko 'Mataifa' peke yake; sentensi inadumisha mtiririko na uzito wa usemi wa Paulo.
