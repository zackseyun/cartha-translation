lexical_decisions:
- source_word: εὐχαριστοῦντες
  choice: mkimshukuru
  rationale: Kitenzi kishirikishi cha wakati uliopo kinaendeleza mtiririko wa sentensi iliyotangulia; “mkimshukuru” ni Kiswahili cha kawaida kinachoonyesha tendo linaloendelea bila kukifanya kuwa sentensi mpya.
- source_word: τῷ πατρὶ
  choice: Baba
  rationale: Kigiriki kinasema moja kwa moja “Baba”; hakuna haja ya kuongeza “Mungu” katika aya hii.
- source_word: ἱκανώσαντι
  choice: aliyewastahilisha
  rationale: Kitenzi ἱκανόω humaanisha kuwafanya watu wafae au wastahili. “Aliyewastahilisha” huonyesha kwamba Baba ndiye aliyewafanya wafae kupata sehemu hiyo, si kwamba aliwapa ruhusa tu.
- source_word: ὑμᾶς
  choice: ninyi
  rationale: Maandishi ya SBLGNT yana ὑμᾶς, yaani “ninyi.” Kiwakilishi kimewekwa wazi ili tofauti yake na usomaji “sisi” ionekane.
- source_word: εἰς τὴν μερίδα
  choice: kuwa na sehemu
  rationale: Kauli hii huwasilisha kwa Kiswahili cha kawaida wazo la kufanywa wafae kuingia au kushiriki katika sehemu iliyotolewa.
- source_word: τοῦ κλήρου
  choice: katika urithi
  rationale: κλῆρος inaweza kumaanisha kura, fungu lililogawiwa, au urithi. Katika muktadha huu “urithi” huwasilisha vizuri baraka inayogawiwa huku tanbihi ikihifadhi taswira ya fungu lililotolewa.
- source_word: τῶν ἁγίων
  choice: wa watakatifu
  rationale: Katika matumizi ya Paulo, ἅγιοι ni watu waliowekwa wakfu kwa Mungu. “Watakatifu” ni fupi, yenye heshima, na huhifadhi uhusiano wa moja kwa moja na dhana ya utakatifu.
- source_word: ἐν τῷ φωτί
  choice: walio katika nuru
  rationale: Muundo huu unaunganisha kwa njia ya kawaida nuru na watakatifu, huku ukihifadhi uwezekano wa kuelewa nuru kuwa mazingira ya urithi wao; tanbihi inaonyesha tafsiri mbadala ya muundo huo.
theological_decisions:
- issue: Tofauti ya maandishi katika kiwakilishi cha yambwa
  choice: ninyi
  alternative: sisi
  rationale: Maandishi yaliyotolewa yana ὑμᾶς (“ninyi”), hivyo huo ndio usomaji wa matini kuu. Usomaji ἡμᾶς (“sisi”) katika baadhi ya hati umehifadhiwa katika tanbihi bila kubadili matini ya msingi.
- issue: Uhusiano wa “katika nuru” na maneno yaliyotangulia
  choice: watakatifu walio katika nuru
  alternative: urithi ulio katika nuru
  rationale: Mpangilio wa Kigiriki unaweza kuruhusu uhusiano mpana wa kirai hiki na urithi au fungu la watakatifu. Matini kuu inatumia muundo wa asili wa Kiswahili, na tanbihi inahifadhi uwezekano mwingine bila kuamua zaidi ya ushahidi wa lugha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo unabaki kuwa sehemu ya sentensi inayoendelea kutoka aya zilizotangulia. “Aliyewastahilisha” huchaguliwa badala ya lugha ya kiutawala kama “aliyewapa sifa,” na taswira ya urithi uliogawiwa inahifadhiwa kwa matini kuu pamoja na tanbihi.
