  text: mkimshukuru Baba, aliyewafanya ninyi[a] mstahili kupokea fungu la urithi wa watakatifu walio katika nuru[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati zina “sisi” badala ya “ninyi.”
