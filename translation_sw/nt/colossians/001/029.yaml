  yaml_path: translation/nt/colossians/001/029.yaml
  text: For this I also labor[a], striving according to his working[d][c][b], which is working in me in power.
translation:
  language: sw
  text: Kwa kusudi hili[a] pia najitaabisha, nikijitahidi[b] kwa kadiri ya utendaji wake[c], unaotenda kazi ndani yangu kwa nguvu[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa ajili ya hili,” “kwa jambo hili,” au “ili kufikia lengo hili.”
    reason: lexical_alternative
  - marker: b
    text: Au “nikipambana.”
    reason: lexical_alternative
  - marker: c
    text: Kigiriki kinasema “utendaji wake” bila kutaja wazi kama “wake” anamrejelea Mungu au Masihi.
    reason: alternative_reading
  - marker: d
    text: Au “unaotenda kazi kwa uwezo mkubwa ndani yangu” au “ulio kazini ndani yangu kwa nguvu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ὃ
  choice: Kwa kusudi hili
  rationale: Kirai hiki kinarejelea lengo la huduma lililotajwa kabla na kinaweza kueleza kusudi. “Kwa kusudi hili” ni Kiswahili cha kawaida kinachodumisha uhusiano huo bila kuufafanua kupita kiasi.
- source_word: καὶ
  choice: pia
  rationale: Hapa καί inaongeza juhudi za Paulo kwenye jambo alilolisema kabla; “pia” inaonyesha maana hiyo kwa uwazi.
- source_word: κοπιῶ
  choice: ninataabika
  rationale: Kitenzi kinaonyesha kufanya kazi kwa bidii hadi kuchoka. “Ninataabika” kinadumisha uzito wa juhudi hiyo bila kuwa cha kizamani.
- source_word: ἀγωνιζόμενος
  choice: nikijitahidi
  rationale: Kishiriki hiki kinaonyesha kujikakamua kwa nguvu, likiwa na kivuli cha shindano au pambano. “Nikijitahidi” ni cha asili na kinaeleweka kwa urahisi.
- source_word: κατὰ
  choice: kwa kadiri ya
  rationale: Pamoja na hali ya kushutumiwa, κατά hapa huonyesha kipimo au kiwango kinachoongoza juhudi za Paulo, si tu chombo anachotumia.
- source_word: ἐνέργειαν
  choice: utendaji
  rationale: Neno hili linaeleza nguvu inayotenda au utendaji wenye matokeo. “Utendaji” huepuka maana ya kisayansi ya kisasa inayoweza kuletwa na “nishati” na linaendana na kitenzi kinachofuata.
- source_word: αὐτοῦ
  choice: wake
  rationale: Kiwakilishi cha Kigiriki hakimtaji wazi mhusika wake. “Wake” kinadumisha hali hiyo bila kuamua kuwa ni Mungu au Kristo.
- source_word: τὴν ἐνεργουμένην
  choice: unaotenda kazi
  rationale: Kishiriki cha wakati uliopo kinaonyesha utendaji unaoendelea. “Unaotenda kazi” ni cha asili na pia kinahifadhi uhusiano wa kimsamiati na “utendaji.”
- source_word: ἐν ἐμοὶ
  choice: ndani yangu
  rationale: “Ndani yangu” huakisi maana ya moja kwa moja ya ἐν na kuacha wazi uhusiano kati ya uwezeshaji wa ndani na huduma ya nje.
- source_word: ἐν δυνάμει
  choice: kwa nguvu
  rationale: Kirai hiki kinaeleza namna au nguvu ya utendaji huo. “Kwa nguvu” ni cha kawaida na kinadumisha dhana ya nomino δύναμις.
theological_decisions:
- issue: Mhusika anayerejelewa na αὐτοῦ (“wake”)
  choice: Kuhifadhi kiwakilishi “wake” bila kutaja wazi kama kinamrejelea Mungu au Masihi.
  alternative: “utendaji wa Mungu” au “utendaji wa Kristo”
  rationale: Mstari wenyewe hautaji wazi mhusika wa kiwakilishi, na muktadha unaweza kuruhusu wasomaji kufuatilia rejeleo hilo. Kutumia “wake” kunadumisha utata halisi wa maandishi ya Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo unahifadhi urudiaji wa mzizi wa ἐνέργεια/ἐνεργουμένην kwa “utendaji… unaotenda kazi,” huku ukiendelea kusomeka kwa urahisi.
