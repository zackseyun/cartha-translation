  text: And he is the head of the body[a], the church; he is the beginning, the firstborn from the dead, so that he himself might become preeminent in all things[b],
translation:
  language: sw
  text: Naye ndiye kichwa cha mwili, yaani, kanisa; yeye ndiye mwanzo[a], mzaliwa wa kwanza kutoka kwa wafu, ili yeye mwenyewe apate kushika nafasi ya kwanza katika mambo yote[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “chanzo” au “mtawala” badala ya “mwanzo” (ἀρχή).
    reason: lexical_alternative
  - marker: b
    text: Au “awe wa kwanza katika mambo yote” badala ya “ashike nafasi ya kwanza katika mambo yote.”
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτός
  choice: yeye / yeye mwenyewe
  rationale: Viwakilishi hivi vinahifadhi msisitizo wa Kigiriki; katika kishazi cha mwisho, “yeye mwenyewe” huonyesha wazi msisitizo wa αὐτός.
- source_word: κεφαλή
  choice: kichwa
  rationale: Huhifadhi sitiari ya kichwa na mwili bila kuifafanua kwa upande mmoja tu kuwa mamlaka au chanzo.
- source_word: σώματος
  choice: mwili
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja, na huhifadhi uhusiano wa kisitiari na “kichwa.”
- source_word: ἐκκλησίας
  choice: kanisa
  rationale: Katika muktadha huu wa Paulo, neno hili linamaanisha jumuiya ya waamini, ambao wametajwa kuwa mwili wa Kristo.
- source_word: ἀρχή
  choice: mwanzo
  rationale: “Mwanzo” linaendana vizuri na maelezo yanayofuata kuhusu mzaliwa wa kwanza kutoka kwa wafu, huku likiacha wazi upana wa maana ya neno la Kigiriki.
- source_word: πρωτότοκος
  choice: mzaliwa wa kwanza
  rationale: Huhifadhi umbo la neno na mwangwi wake wa kibiblia, unaoweza kuhusisha kutangulia na cheo.
- source_word: ἐκ τῶν νεκρῶν
  choice: kutoka kwa wafu
  rationale: Ni usemi wa kawaida wa Kiswahili unaoeleza kufufuka kutoka miongoni mwa waliokufa.
- source_word: ἵνα γένηται
  choice: ili ... apate kuwa
  rationale: Huwasilisha kusudi au matokeo ya kishazi cha ἵνα na pia maana ya kuja kuwa katika γένηται.
- source_word: ἐν πᾶσιν
  choice: katika mambo yote
  rationale: Huhifadhi upeo mpana wa wingi wa jinsia isiyo na uhai katika Kigiriki.
- source_word: πρωτεύων
  choice: kuwa wa kwanza
  rationale: Ni Kiswahili cha asili kinachoeleza kushika nafasi kuu au ya kwanza bila kuongeza dhana pana isiyotajwa moja kwa moja.
theological_decisions:
- issue: Maana ya κεφαλή katika sitiari ya Kristo na mwili
  choice: Kuhifadhi “kichwa” bila kufafanua kuwa ni mamlaka pekee au chanzo pekee.
  alternative: Kiongozi wa mwili; chanzo cha mwili.
  rationale: Sitiari yenyewe ina maana pana. Kuitunza huepuka kuamua kimya kimya mjadala ambao maandishi ya Kigiriki hayamalizi hapa.
- issue: Maana ya ἀρχή katika muktadha wa ufufuo na uumbaji mpya
  choice: mwanzo
  alternative: chanzo; mtawala
  rationale: Muktadha wa “mzaliwa wa kwanza kutoka kwa wafu” unaunga mkono wazo la Kristo kuanzisha utaratibu wa ufufuo, lakini tanbihi huhifadhi uwezekano mwingine wa kileksika.
- issue: Nguvu ya πρωτότοκος ἐκ τῶν νεκρῶν
  choice: mzaliwa wa kwanza kutoka kwa wafu
  alternative: wa kwanza kufufuka kutoka kwa wafu
  rationale: Tafsiri hii huhifadhi istilahi ya kibiblia na maana ya ukuu inayosisitizwa katika kishazi kinachofuata, bila kuibadili kuwa kauli kuhusu kuumbwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. “Yaani, kanisa” hufanya uhusiano wa ufafanuzi kati ya mwili na kanisa uwe wazi kwa njia ya asili. Alama za tanbihi zimewekwa baada ya maneno ambayo tanbihi zake zinafafanua.
