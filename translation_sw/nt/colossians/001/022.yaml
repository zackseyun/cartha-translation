source:
  edition: SBLGNT
  text: νυνὶ δὲ ⸀ἀποκατηλλάγητε ἐν τῷ σώματι τῆς σαρκὸς αὐτοῦ διὰ τοῦ θανάτου— παραστῆσαι ὑμᾶς ἁγίους καὶ ἀμώμους καὶ ἀνεγκλήτους κατενώπιον αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/022.yaml
  text: But now he has reconciled you in his body of flesh through death[a], to present you holy and blameless and beyond reproach before him[b],
translation:
  language: sw
  text: Lakini sasa mmepatanishwa katika mwili wake wa nyama kwa njia ya kifo[a], ili awalete mbele yake mkiwa watakatifu, bila dosari, na bila shtaka[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “amewapatanisha.” Kitenzi cha Kigiriki kiko katika hali ya kutendwa.
    reason: alternative_reading
  - marker: b
    text: “Bila dosari” pia inaweza kutafsiriwa “bila kilema,” ikihifadhi mwangwi wa lugha ya dhabihu katika neno la Kigiriki.
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: Lakini sasa
  rationale: Inahifadhi tofauti kati ya hali yao ya awali katika mstari wa 21 na hali yao ya sasa.
- source_word: ἀποκατηλλάγητε
  choice: amewapatanisha nanyi
  rationale: Kitenzi cha Kigiriki ni cha kutendwa, lakini muktadha unadokeza mtendaji; usemi huu wa Kiswahili ni wa kawaida na unaonyesha kuwa yeye ndiye aliyeanzisha upatanisho. Tanbihi huhifadhi umbo la kutendwa.
- source_word: ἐν τῷ σώματι τῆς σαρκὸς αὐτοῦ
  choice: katika mwili wake wa nyama
  rationale: Inahifadhi msisitizo wa mwili halisi bila kuipa σάρξ maana ya asili ya dhambi.
- source_word: διὰ τοῦ θανάτου
  choice: kwa njia ya kifo
  rationale: Inaonyesha kifo kuwa njia ambayo upatanisho ulitimizwa bila kuongeza kimya kimya kiwakilishi kisichopo katika fungu hili.
- source_word: παραστῆσαι ὑμᾶς
  choice: ili awalete mbele yake
  rationale: Inatoa kwa Kiswahili cha kawaida wazo la kusimamisha au kuwasilisha watu mbele ya mwingine, na inaonyesha kusudi la upatanisho.
- source_word: ἁγίους
  choice: watakatifu
  rationale: Ni istilahi ya kawaida inayohifadhi maana za kuwekwa wakfu na usafi wa kiadili.
- source_word: ἀμώμους
  choice: bila dosari
  rationale: Inasomeka kwa kawaida na pia inaweza kubeba mwangwi wa kitu cha dhabihu kisicho na kilema.
- source_word: ἀνεγκλήτους
  choice: bila shtaka
  rationale: Inahifadhi maana ya kimahakama ya kutokuwa na shtaka linaloweza kusimamishwa dhidi yao.
- source_word: κατενώπιον αὐτοῦ
  choice: mbele yake
  rationale: Inahifadhi mazingira ya kuwapo na kutathminiwa bila kuamua wazi kama kiwakilishi kinamhusu Mungu au Kristo.
theological_decisions:
- issue: Mtendaji wa ἀποκατηλλάγητε iliyo katika hali ya kutendwa
  choice: amewapatanisha nanyi
  alternative: mmepatanishwa
  rationale: Muktadha unadokeza mtendaji, na muundo wa kutenda unasomeka kwa kawaida zaidi katika Kiswahili; hata hivyo, tanbihi inaweka wazi kwamba Kigiriki chenyewe ni cha kutendwa.
- issue: Maana ya σάρξ katika kirai kinachohusu mwili
  choice: nyama katika maana ya mwili halisi
  alternative: asili ya dhambi
  rationale: Muktadha unasisitiza ubinadamu halisi na kifo cha kimwili; maana ya maadili ya 'asili ya dhambi' haikubaliki hapa.
- issue: Tofauti kati ya ἀμώμους na ἀνεγκλήτους
  choice: bila dosari, na bila shtaka
  alternative: bila lawama, na wasioweza kulaumiwa
  rationale: Chaguo hili linatofautisha mwangwi wa dhabihu wa neno la kwanza na maana ya kimahakama ya neno la pili.
- issue: Rejeo la αὐτοῦ katika κατενώπιον αὐτοῦ
  choice: mbele yake
  alternative: mbele za Mungu / mbele za Kristo
  rationale: Kiwakilishi cha Kigiriki hakimtaji mhusika kwa jina katika mstari huu; tafsiri haipaswi kuondoa utata huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Mwili wake wa nyama' limehifadhiwa kwa makusudi ili kusisitiza mwili halisi, ingawa ni muundo mzito kidogo. Alama zote za tanbihi zimewekwa katika matini kuu.
