  text: and who also made known to us your love in the Spirit[a].
translation:
  language: sw
  text: naye pia alitujulisha kuhusu upendo wenu katika Roho[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “upendo wenu katika roho,” yaani, upendo wenu wa kiroho.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ... δηλώσας
  choice: naye ... alitujulisha
  rationale: Kifungu cha nomino chenye participio ya wakati uliopita kinamrejelea Epafra katika mstari uliotangulia. Kiswahili cha kawaida hutumia kishazi cha kitenzi, “naye ... alitujulisha,” ambacho pia kinaendeleza uhusiano huo.
- source_word: καὶ
  choice: pia
  rationale: Hapa καί inaongeza jambo lingine alilofanya Epafra; “pia” huonyesha maana hiyo kwa kawaida.
- source_word: ἡμῖν
  choice: -tu- katika “alitujulisha”
  rationale: Dativi hii ni yambwa isiyo ya moja kwa moja, yaani Paulo na wenzake ndio waliojulishwa; kiambishi cha Kiswahili “-tu-” kinatoa maana hiyo kwa ufupi na kwa usahihi.
- source_word: τὴν ὑμῶν ἀγάπην
  choice: upendo wenu
  rationale: Hii ni tafsiri ya moja kwa moja, ya kawaida na yenye hadhi ya ἀγάπη pamoja na kiwakilishi cha umiliki ὑμῶν.
- source_word: ἐν πνεύματι
  choice: katika Roho
  rationale: Katika matumizi ya Paulo, πνεῦμα bila kibainishi bado inaweza kumaanisha Roho Mtakatifu. “Katika Roho” huhifadhi muundo na maana inayowezekana zaidi bila kufafanua kupita kiasi; uwezekano wa maana ya roho au sifa ya kiroho umewekwa katika tanbihi.
theological_decisions:
- issue: Kirejelewa cha πνεύματι
  choice: Roho Mtakatifu ndiye anayeelekea kurejelewa na maneno “upendo wenu katika Roho”
  alternative: “upendo wenu wa kiroho” au “upendo wenu katika roho”
  rationale: Kirai hiki kinaweza kurejelea Roho Mtakatifu au kueleza mazingira/sifa ya kiroho ya upendo wao. Matini kuu inatumia maana inayowezekana zaidi katika matumizi ya Paulo, huku tanbihi ikihifadhi utata halisi wa Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Naye” huunganisha mstari huu kwa kawaida na Epafra aliyetajwa katika mstari uliotangulia; herufi kubwa katika “Roho” huonyesha usomaji mkuu, huku tanbihi ikihifadhi usomaji mwingine.
