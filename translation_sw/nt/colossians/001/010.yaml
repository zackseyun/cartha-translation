  text: ili mwenende kwa namna inayomstahili Bwana na kumpendeza kwa kila namna,[a] mkizaa matunda katika kila kazi njema na mkikua katika kumjua Mungu,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki husema ‘kwa upendezaji wote’; hakimtaji wazi anayependezwa, ingawa muktadha unaonyesha kuwa ni Bwana.
    reason: lexical_alternative
