lexical_decisions:
- source_word: περιπατῆσαι
  choice: mwenende
  rationale: Kitenzi hiki kinahifadhi sitiari ya kawaida ya Paulo ya ‘kutembea’ kwa maana ya mwenendo wa maisha; ‘mwenende’ ni lugha ya heshima na inaeleweka katika muktadha wa kibiblia.
- source_word: ἀξίως τοῦ κυρίου
  choice: kwa namna inayomstahili Bwana
  rationale: Hutoa maana ya mwenendo unaolingana na Bwana kwa Kiswahili cha asili zaidi kuliko tafsiri ya neno kwa neno ‘kwa kustahili kwa Bwana.’
- source_word: εἰς πᾶσαν ἀρεσκείαν
  choice: na kumpendeza kwa kila namna
  rationale: Ingawa Kigiriki hakitaji wazi yule anayependezwa, Bwana ndiye anayerejelewa kwa dhahiri katika muktadha. Kiswahili huhitaji usemi ulio wazi na wa kawaida; tanbihi huhifadhi udhahiri huo wa kisarufi.
- source_word: ἐν παντὶ ἔργῳ ἀγαθῷ
  choice: katika kila kazi njema
  rationale: Inahifadhi nguvu ya mgawanyo ya παντί na ubora wa kimaadili wa ἀγαθῷ.
- source_word: καρποφοροῦντες
  choice: mkizaa matunda
  rationale: Inahifadhi sitiari ya kilimo na mwangwi wake na Wakolosai 1:6.
- source_word: αὐξανόμενοι
  choice: kukua
  rationale: Ni usemi wa kawaida unaoendeleza taswira hai ya ukuaji sambamba na kuzaa matunda.
- source_word: τῇ ἐπιγνώσει τοῦ θεοῦ
  choice: katika kumjua Mungu
  rationale: Inachukua dativu kama eneo au upande ambamo ukuaji unatokea. ‘Kumjua Mungu’ ni Kiswahili cha kawaida na cha binafsi bila kulazimisha maana ya kiufundi.
theological_decisions:
- issue: Yule anayependezwa katika ἀρεσκείαν
  choice: 'Kumfanya Bwana kuwa rejeleo lililo wazi katika maandishi: ‘kumpendeza kwa kila namna.’'
  alternative: ‘kwa ajili ya kupendeza kwa kila namna,’ bila kutaja rejeleo wazi.
  rationale: Kigiriki kinaacha rejeleo likieleweka kutokana na ‘Bwana,’ lakini Kiswahili cha kawaida hunufaika kwa kulitaja. Tanbihi inatunza ukweli kwamba kiwakilishi hakipo wazi katika chanzo.
- issue: Nuansi ya ἐπίγνωσις
  choice: ‘kumjua Mungu’ katika maandishi makuu.
  alternative: ‘kumjua Mungu kikamilifu zaidi’ au ‘maarifa kamili ya Mungu.’
  rationale: Nomino inaweza kudokeza ujuzi kamili au wa kina zaidi, lakini si lazima nuansi hiyo iwe ya kiufundi katika kila matumizi. Tanbihi inahifadhi uwezekano huo.
- issue: Kazi ya dativu τῇ ἐπιγνώσει
  choice: 'Kuisoma kama eneo/upande wa ukuaji: ‘katika kumjua Mungu.’'
  alternative: 'Kuisoma kama njia au chombo: ‘kwa kumjua Mungu.’'
  rationale: Sarufi inaruhusu zaidi ya uhusiano mmoja; usomaji wa eneo unalingana vizuri na kitenzi cha kukua, huku tanbihi ikitaja usomaji wa kichombo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Mwenende’ huhifadhi sitiari ya Paulo ya mwenendo wa maisha; muundo wa ‘mkizaa… na kukua…’ huhifadhi usambamba wa vishiriki vya Kigiriki. Koma ya mwisho inaachwa kwa kuwa mstari unaendelea kisintaksia kutoka na kwenda katika muktadha unaozunguka.
