  text: Yeye ni mfano wa Mungu asiyeonekana, mzaliwa wa kwanza[a] wa viumbe vyote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Usemi “mzaliwa wa kwanza” hapa unaweza kuonyesha cheo na haki za urithi, si lazima kumaanisha kwamba Mwana ni sehemu ya vitu vilivyoumbwa. Linganisha mistari inayofuata, inayosema kwamba vitu vyote viliumbwa kwa njia yake na kwa ajili yake. Pia yaweza kutafsiriwa, “mzaliwa wa kwanza aliye juu ya viumbe vyote.”
