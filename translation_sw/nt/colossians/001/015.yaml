lexical_decisions:
- source_word: ὅς ἐστιν
  choice: Yeye ni
  rationale: Kiwakilishi hiki kinamrejelea Mwana aliyetajwa katika mstari uliotangulia. “Yeye ni” ni mwanzo wa kawaida wa sentensi ya Kiswahili na huwasilisha kauli ya wakati uliopo bila kufanya sentensi iwe nzito.
- source_word: εἰκὼν
  choice: mfano
  rationale: “Mfano” ni neno la kawaida na lenye hadhi linaloweza kubeba maana za kufanana, kumwakilisha na kumfunua mwingine, bila kufafanua kupita kiasi uhusiano unaokusudiwa.
- source_word: τοῦ θεοῦ τοῦ ἀοράτου
  choice: wa Mungu asiyeonekana
  rationale: Muundo huu wa Kiswahili unaonyesha wazi kuwa Mungu ndiye asiyeonekana na unafuata uhusiano wa maneno katika Kigiriki.
- source_word: πρωτότοκος
  choice: mzaliwa wa kwanza
  rationale: Tafsiri hii inadumisha sitiari ya Kigiriki pamoja na usuli wake wa kibiblia wa cheo, urithi na haki za mzaliwa wa kwanza; haibadilishi neno moja kwa moja kuwa fasiri kama “mkuu kuliko wote.”
- source_word: πάσης κτίσεως
  choice: wa viumbe vyote
  rationale: Hii inadumisha kwa ukaribu umilikishi wa Kigiriki na hali yake yenye uwezekano wa kufasiriwa kwa zaidi ya njia moja. “Viumbe vyote” ni Kiswahili cha kawaida kinachowasilisha kwa uwazi eneo lote la vitu vilivyoumbwa.
theological_decisions:
- issue: Maana ya πρωτότοκος πάσης κτίσεως kuhusu uhusiano wa Mwana na uumbaji
  choice: mzaliwa wa kwanza wa viumbe vyote
  alternative: mzaliwa wa kwanza aliye juu ya viumbe vyote
  rationale: Neno “wa” linafuata moja kwa moja muundo wa Kigiriki na kuhifadhi mvutano wa kifasiri badala ya kuamua kimya kimya kuwa genitivi ina maana ya utawala. Tanbihi inaeleza kuwa katika matumizi ya kibiblia “mzaliwa wa kwanza” mara nyingi huonyesha cheo na haki za urithi, huku mistari inayofuata ikisema kwamba vitu vyote viliumbwa kwa njia yake na kwa ajili yake.
translation_notes:
