  text: 'To the holy and faithful brothers in Messiah at Colossae: grace to you and peace from God our Father[a][b][c].'
translation:
  language: sw
  text: 'Kwa ndugu watakatifu na waaminifu[a] katika Masihi[c] walioko Kolosai: neema na amani ziwe kwenu kutoka kwa Mungu Baba yetu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wenye kuamini”; neno la Kigiriki linaweza kueleza wanaoamini au walio waaminifu.
    reason: lexical_alternative
  - marker: c
    text: 'Tafsiri ya jadi: “Kristo.” Cheo cha Kigiriki Χριστός humaanisha “Masihi.”'
    reason: alternative_reading
lexical_decisions:
- source_word: τοῖς ἐν Κολοσσαῖς
  choice: huko Kolosai
  rationale: Kirai hiki kinawatambulisha wapokeaji kwa mahali walipo. “Huko Kolosai” ni Kiswahili cha kawaida katika anuani na kinahifadhi maana ya mahali.
- source_word: ἁγίοις
  choice: watakatifu
  rationale: Kivumishi hiki kinaeleza ndugu kuwa waliowekwa wakfu kwa Mungu; “watakatifu” kinahifadhi maana ya msingi bila kukifanya kuwa cheo maalumu cha baadaye.
- source_word: πιστοῖς
  choice: waaminifu
  rationale: πιστός inaweza kumaanisha waaminifu au wenye kuamini. “Waaminifu” ni maelezo ya kawaida ya tabia na uaminifu wao, huku uwezekano wa “wenye kuamini” ukihifadhiwa katika tanbihi.
- source_word: ἀδελφοῖς
  choice: ndugu
  rationale: “Ndugu” ni neno la asili na lenye heshima katika Kiswahili; linaweza kurejelea wanaume na wanawake, ingawa neno la Kigiriki liko katika umbo la kiume la wingi.
- source_word: ἐν Χριστῷ
  choice: walio katika Masihi
  rationale: “Katika” kinahifadhi lugha ya Paulo kuhusu uhusiano au muungano na Masihi, na Χριστός limetafsiriwa kama cheo “Masihi” badala ya kutumiwa kama jina lisilotafsiriwa.
- source_word: χάρις ὑμῖν καὶ εἰρήνη
  choice: Neema na amani ziwe kwenu
  rationale: Hiki ni Kiswahili cha kawaida cha salamu kinachohifadhi neema na amani pamoja na uelekeo wake kwa wapokeaji.
- source_word: ἀπὸ θεοῦ πατρὸς ἡμῶν
  choice: kutoka kwa Mungu Baba yetu
  rationale: Muundo huu unamfafanua Mungu kuwa Baba yetu bila kuongeza kiunganishi kisichomo katika Kigiriki.
theological_decisions:
- issue: Maana ya πιστοῖς
  choice: waaminifu
  alternative: wenye kuamini
  rationale: Muktadha haulazimishi kutenganisha kabisa imani na uaminifu. Matini kuu inatumia “waaminifu,” na tanbihi inadumisha maana nyingine inayowezekana.
- issue: Jinsia na upeo wa ἀδελφοῖς
  choice: ndugu
  alternative: ndugu wa kiume
  rationale: Kigiriki kina umbo la kiume la wingi, lakini katika salamu hii huenda Paulo analihutubia kusanyiko lote, wakiwemo wanawake. Kiswahili “ndugu” linaweza kubeba upeo huo bila kupotosha neno la uhusiano.
- issue: Tafsiri ya Χριστῷ
  choice: Masihi
  alternative: Kristo
  rationale: Χριστός ni cheo chenye maana ya “Masihi.” Tafsiri hii inadhihirisha maana ya cheo, huku namna ya jadi “Kristo” ikitajwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaosomeka kwa urahisi. Muundo wa salamu ya barua umehifadhiwa, na “walio katika Masihi” limetumiwa kudumisha usemi muhimu wa Paulo bila kuufafanua kupita kiasi.
