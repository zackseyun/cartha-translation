id: COL.1.5
reference: Colossians 1:5
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: διὰ τὴν ἐλπίδα τὴν ἀποκειμένην ὑμῖν ἐν τοῖς οὐρανοῖς, ἣν προηκούσατε ἐν τῷ λόγῳ τῆς ἀληθείας τοῦ εὐαγγελίου
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/005.yaml
  text: because of the hope laid up for you in the heavens[a], which you heard before in the word of truth[d][c][b], the gospel
translation:
  language: sw
  text: kwa sababu ya tumaini lililohifadhiwa kwa ajili yenu mbinguni[a]. Tumaini hilo mlilisikia habari zake hapo awali[b] katika neno la kweli[c], yaani Injili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki kinasema kihalisi “katika mbingu,” kwa kutumia wingi; Kiswahili “mbinguni” kinaweza pia kutafsiriwa “katika mbingu.”
    reason: lexical_alternative
  - marker: b
    text: Au “mlikuwa mmelisikia kabla” au “mlilisikia mapema.”
    reason: lexical_alternative
  - marker: c
    text: “Neno la kweli” linaweza pia kutafsiriwa “ujumbe wa kweli.” “Injili” inalifafanua neno au ujumbe huo.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τὴν ἐλπίδα
  choice: kwa sababu ya tumaini
  rationale: διά pamoja na hali ya akusativi inaonyesha sababu au msingi hapa; tafsiri hii pia inaendeleza uhusiano wa kisintaksia na mstari uliotangulia.
- source_word: ἀποκειμένην
  choice: lililohifadhiwa
  rationale: Kitenzi hiki humaanisha kuwekwa salama au kutengwa kwa ajili ya wakati ujao. “Lililohifadhiwa” ni cha kawaida katika Kiswahili na hakifanyi tumaini lionekane kuwa kitu cha kimwili kupita kiasi.
- source_word: ὑμῖν
  choice: kwa ajili yenu
  rationale: 'Dativu inaonyesha manufaa: tumaini hilo limehifadhiwa kwa manufaa ya waamini hao.'
- source_word: ἐν τοῖς οὐρανοῖς
  choice: mbinguni
  rationale: “Mbinguni” ndiyo namna ya kawaida na yenye hadhi katika Kiswahili; neno hilo linaweza kuwakilisha usemi wa Kigiriki ulio katika wingi bila kulazimisha Kiswahili kisicho cha kawaida.
- source_word: ἣν προηκούσατε
  choice: Tumaini hilo mlilisikia habari zake hapo awali
  rationale: Kiwakilishi cha kike cha umoja kinarejelea moja kwa moja “tumaini.” “Mlisikia habari zake” ni Kiswahili cha kawaida kwa kusikia kuhusu jambo la dhahania, na “hapo awali” huhifadhi maana ya kiambishi awali προ-.
- source_word: ἐν τῷ λόγῳ τῆς ἀληθείας
  choice: katika neno la kweli
  rationale: Huhifadhi muundo wa Kigiriki na usemi wa kibiblia, huku “Injili” inayofuata ikifafanua kuwa neno hilo ni ujumbe.
- source_word: τοῦ εὐαγγελίου
  choice: yaani Injili
  rationale: Genitivi hii inaeleweka vizuri kama maelezo yanayotambulisha “neno la kweli.” “Yaani” huonyesha uhusiano huo wazi bila kuifanya Injili kuwa kitu tofauti.
theological_decisions:
- issue: Kirejelewa cha kishazi cha uhusiano
  choice: Kishazi kinarejelea “tumaini.”
  alternative: Kukichukulia kuwa kinarejelea kwa upana ujumbe wote wa Injili.
  rationale: Kiwakilishi ἣν ni cha kike, umoja, na kinakubaliana moja kwa moja na ἐλπίδα. Tafsiri inadumisha mkazo huo badala ya kuufanya kuwa wa jumla.
- issue: Umoja au wingi wa οὐρανοῖς
  choice: Kutumia “mbinguni” katika matini kuu na kueleza wingi wa Kigiriki katika tanbihi.
  alternative: Kutumia “katika mbingu” moja kwa moja katika matini kuu.
  rationale: Kigiriki kina wingi, lakini “mbinguni” ni usemi asilia wa Kiswahili na kwa kawaida hauamui wazi umoja au wingi; tanbihi huhifadhi taarifa ya kimofolojia.
- issue: Uhusiano wa “Injili” na “neno la kweli”
  choice: “Injili” inalitambulisha “neno la kweli” kwa apposition.
  alternative: Kuchukulia τοῦ εὐαγγελίου kuwa genitivi yenye maana ya “neno la kweli linalotokana na Injili” au “linalohusu Injili.”
  rationale: Muundo na muktadha vinaunga mkono zaidi kwamba Paulo anafafanua neno la kweli kuwa ni Injili, bila kuanzisha ujumbe mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imegawanywa baada ya “mbinguni” ili kuepuka mlolongo mzito wa vishazi, lakini uhusiano wa kisarufi umehifadhiwa kwa kurudia “Tumaini hilo.”
