base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/017.yaml
  text: so that the man of God may be complete[b][a], equipped for every good work.
translation:
  language: sw
  text: ili mtu wa Mungu[b] awe kamili, akiwa ametayarishwa kikamilifu kwa kila kazi njema.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akiwa amewekewa kila kinachohitajika.” Neno ἐξηρτισμένος linaonyesha hali ya mtu ambaye tayari ametayarishwa au amepewa kikamilifu anachohitaji kwa ajili ya kazi.
    reason: lexical_alternative
  - marker: b
    text: “Mtu wa Mungu” ni usemi wa umoja wa kiume kisarufi katika Kigiriki na huenda ni cheo cha kibiblia kinachotambulika. Katika muktadha unaweza kumaanisha hasa mtumishi wa Mungu, huku kanuni yake ikihusu kwa upana zaidi mwamini anayejengwa na Maandiko.
    reason: cultural_note
lexical_decisions:
- source_word: ἵνα
  choice: ili
  rationale: Huanzisha kishazi cha kusudi kinachotokana na mstari wa 16; “ili” ni ya kawaida na huhifadhi maana ya kusudi.
- source_word: ἄρτιος
  choice: kamili
  rationale: Hueleza mtu aliyekamilishwa au anayefaa kikamilifu kwa kazi yake, bila kulazimisha maana ya kutokuwa na dhambi.
- source_word: ᾖ
  choice: awe
  rationale: Huwakilisha hali tegemezi baada ya ἵνα kwa namna ya kawaida katika Kiswahili.
- source_word: ὁ τοῦ θεοῦ ἄνθρωπος
  choice: mtu wa Mungu
  rationale: Huhifadhi usemi wa kibiblia unaotambulika. Neno la Kiswahili “mtu” ni la kawaida na halibainishi jinsia, ingawa usemi wa Kigiriki uko katika umoja wa kiume kisarufi.
- source_word: πρὸς
  choice: kwa
  rationale: Huonyesha kufaa au kuandaliwa kwa kusudi la kutenda kazi hizo.
- source_word: πᾶν ἔργον ἀγαθόν
  choice: kila kazi njema
  rationale: Huhifadhi nguvu ya distributivu ya πᾶν na sifa ya kimaadili ya ἀγαθόν kwa lugha ya kawaida.
- source_word: ἐξηρτισμένος
  choice: akiwa ameandaliwa
  rationale: 'Huhifadhi hali ya tendo lililokamilika: mtu amefanywa tayari na kuwezeshwa kwa kazi njema; wazo la ukamilifu wa maandalizi linaweza pia kutajwa wazi zaidi.'
theological_decisions:
- issue: Usemi wa kijinsia katika ὁ τοῦ θεοῦ ἄνθρωπος
  choice: mtu wa Mungu
  alternative: mwanamume wa Mungu
  rationale: Ingawa Kigiriki kina umoja wa kiume kisarufi na huenda usemi huu unamlenga kwanza mtumishi wa Mungu katika muktadha, ἄνθρωπος humaanisha “mtu.” Kiswahili “mtu wa Mungu” huhifadhi cheo cha kibiblia bila kuongeza dai kwamba anayelengwa lazima awe mwanamume, huku tanbihi ikieleza umbo na upana wa matumizi.
- issue: Maana ya ἄρτιος
  choice: kamili
  alternative: anayefaa kabisa
  rationale: “Kamili” huhifadhi uhusiano wa kimaana na maandalizi yanayotajwa baadaye, lakini haikusudiwi kufundisha kutokuwa na dhambi; hapa ni ukamilifu au ufaafu kwa kazi njema.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imehifadhi kishazi cha kusudi, usemi wa kibiblia “mtu wa Mungu,” na tofauti ya kimaana kati ya kuwa kamili na kuwa ameandaliwa.
