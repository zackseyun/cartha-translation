    rationale: ἐξηρτισμένος is a perfect passive participle meaning having been fully furnished/equipped. “Ameandaliwa” can mean simply prepared, whereas “ametayarishwa kikamilifu” more clearly conveys the completed and thorough readiness in the Greek.
