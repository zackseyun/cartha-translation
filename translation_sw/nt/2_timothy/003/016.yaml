  yaml_path: translation/nt/2_timothy/003/016.yaml
  text: Every Scripture is God-breathed and profitable for teaching[a], for reproof, for correction[c][b], and for training in righteousness.
translation:
  language: sw
  text: Kila Andiko limetolewa kwa pumzi ya Mungu na linafaa kwa kufundisha, kwa kuonyesha makosa, kwa kurekebisha, na kwa malezi katika uadilifu.[c][a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Maandiko yote yametolewa kwa pumzi ya Mungu na yanafaa.” Maneno ya Kigiriki πᾶσα γραφή yanaweza kueleweka kwa maana ya kigawanyo (“kila Andiko”) au ya kijumla (“Maandiko yote”).
    reason: alternative_reading
  - marker: b
    text: Au, “Kila Andiko lililotolewa kwa pumzi ya Mungu linafaa pia kwa kufundisha, kwa kuonyesha makosa, kwa kurekebisha, na kwa malezi katika uadilifu.”
    reason: alternative_reading
  - marker: c
    text: Neno “uadilifu” linaweza pia kutafsiriwa “haki” katika baadhi ya miktadha ya Paulo; hapa maana kuu ni malezi ya kuishi kwa unyoofu.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσα γραφὴ
  choice: Kila Andiko
  rationale: Muundo huu unafuata maana ya kigawanyo ya πᾶσα γραφή, huku neno “Andiko” likionyesha maandiko matakatifu katika muktadha wa aya 15–17. Maana ya kijumla, “Maandiko yote,” imehifadhiwa katika tanbihi.
- source_word: θεόπνευστος
  choice: limepuliziwa na Mungu
  rationale: Huwasilisha kwa uwazi taswira ya neno ambatani la Kigiriki, yaani kwamba Andiko linatokana na pumzi ya Mungu, bila kuingiza nadharia za baadaye kuhusu uvuvio.
- source_word: ὠφέλιμος
  choice: linafaa
  rationale: Ni Kiswahili cha kawaida na chenye hadhi kinachoonyesha kuwa Andiko lina manufaa kwa madhumuni yanayofuata.
- source_word: πρὸς διδασκαλίαν
  choice: kwa kufundisha
  rationale: Hueleza wazi tendo na maudhui ya kufundisha bila kulibana kuwa istilahi ya kimadhehebu.
- source_word: ἐλεγμόν
  choice: kwa kuonyesha makosa
  rationale: Hushika maana ya kufichua kosa au kulileta wazi; ni pana na ya asili zaidi katika Kiswahili kuliko neno linaloweza kumaanisha karipio la maneno pekee.
- source_word: ἐπανόρθωσιν
  choice: kwa kurekebisha
  rationale: Hutoa maana ya kukifanya kilichopotoka kiwe sawa tena kwa usemi mfupi na wa kawaida.
- source_word: παιδείαν τὴν ἐν δικαιοσύνῃ
  choice: kwa kufundisha mtu kuishi kwa uadilifu
  rationale: παιδεία hapa ni malezi au mafunzo yanayomjenga mtu, na δικαιοσύνη katika muktadha huu linaelekea kwenye mwenendo ulionyooka. Usemi huu ni wa asili kwa wasomaji wa kawaida.
- source_word: δικαιοσύνῃ
  choice: uadilifu
  rationale: Katika muktadha wa malezi ya kimaadili, “uadilifu” huwasilisha hali na mwenendo ulionyooka. “Haki” ni maana nyingine inayowezekana katika baadhi ya miktadha ya Paulo na imehifadhiwa katika tanbihi.
theological_decisions:
- issue: Uhusiano wa kisintaksia wa θεόπνευστος na ὠφέλιμος na πᾶσα γραφή
  choice: 'Vivumishi vyote viwili vimetafsiriwa kama taarifa kuhusu kila Andiko: “Kila Andiko limepuliziwa na Mungu na linafaa.”'
  alternative: “Kila Andiko lililopuliziwa na Mungu linafaa pia...”
  rationale: Usomaji wa taarifa sambamba unaendana vizuri na mtiririko unaoelekea aya ya 17. Hata hivyo, muundo wa Kigiriki unaweza pia kueleweka kwa kufanya “lililopuliziwa na Mungu” kuwa sifa inayolitambulisha Andiko; uwezekano huo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imetumia vitenzi vya kawaida na vinavyoeleweka kwa urahisi. Alama za tanbihi zote zimewekwa baada ya sentensi kwa sababu kila moja inaeleza ama muundo mzima wa sentensi ama istilahi iliyo ndani yake.
