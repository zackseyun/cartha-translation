lexical_decisions:
- source_word: ἄστοργοι
  choice: wasiokuwa na upendo wa kifamilia
  rationale: Neno hili hueleza ukosefu wa upendo wa asili unaotarajiwa hasa miongoni mwa watu wa familia au jamaa wa karibu; tafsiri hii inahifadhi maana hiyo mahususi.
- source_word: ἄσπονδοι
  choice: wasiopatanika
  rationale: Huwaeleza watu wasiokubali kuingia katika mapatano au kufanya amani; ‘wasiopatanika’ ni ya asili na inayoeleweka katika Kiswahili cha sasa.
- source_word: διάβολοι
  choice: wachongezi
  rationale: Katika orodha hii ya maovu, wingi huu unawaeleza watu wanaowasingizia au kuwachongea wengine, wala haumrejelei Ibilisi.
- source_word: ἀκρατεῖς
  choice: wasiojizuia
  rationale: Hueleza ukosefu wa uwezo wa kutawala tamaa au misukumo ya mtu; ‘wasiojizuia’ ni fupi na ya kawaida.
- source_word: ἀνήμεροι
  choice: wakatili
  rationale: Neno hili lina maana ya kuwa mkali, asiye na upole, au kama mtu asiyefugika; ‘wakatili’ huwasilisha tabia ya ukali na ukatili kwa uwazi.
- source_word: ἀφιλάγαθοι
  choice: wasiopenda mema
  rationale: Muundo wa neno una maana ya kutokuwa na upendo kwa lililo jema; tafsiri hii inahifadhi hali hiyo bila kuiongeza kuwa chuki ya wazi.
theological_decisions:
- issue: Maana ya διάβολοι katika orodha ya maovu
  choice: wachongezi
  alternative: mashetani; wenye tabia ya kishetani
  rationale: Katika muktadha huu, neno la wingi linafanya kazi kama sifa ya mwenendo wa watu. Kulitafsiri kuwa ‘mashetani’ kungeweza kufanya msomaji alielewe kama utambulisho wa viumbe wa kiroho badala ya tabia ya kuchongea.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo sambamba wa maneno ya wingi umehifadhi mtiririko wa orodha ya maovu. Alama zote za tanbihi zimewekwa mara tu baada ya maneno yanayohusika.
