  text: ὃν τρόπον δὲ Ἰάννης καὶ Ἰαμβρῆς ἀντέστησαν Μωϋσεῖ, οὕτως καὶ οὗτοι ἀνθίστανται τῇ ἀληθείᾳ, ἄνθρωποι κατεφθαρμένοι τὸν νοῦν, ἀδόκιμοι περὶ τὴν πίστιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/008.yaml
  text: Just as Jannes and Jambres opposed Moses[a], so also these men oppose the truth—men corrupted in mind[b], disqualified regarding the faith.
translation:
  language: sw
  text: Kama vile Yane na Yambre walivyompinga Musa[a], vivyo hivyo watu hawa nao wanaipinga kweli—watu ambao akili zao zimeharibika, wasiofaa kwa habari ya imani[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walivyosimama kinyume na Musa” … “wanasimama kinyume na kweli.”
    reason: lexical_alternative
  - marker: b
    text: “Imani” hapa huenda inamaanisha imani ya Kikristo au ujumbe wa kitume, si kuamini kwa mtu binafsi tu.
    reason: cross_reference
lexical_decisions:
- source_word: ὃν τρόπον δὲ
  choice: Kama vile
  rationale: “Kama vile” linaanzisha ulinganisho kwa Kiswahili cha kawaida. δὲ hapa ni kiunganishi hafifu cha kuendeleza hoja; halihitaji kutafsiriwa kwa neno tofauti kama “sasa” au “lakini” katika sentensi hii.
- source_word: Ἰάννης καὶ Ἰαμβρῆς
  choice: Yane na Yambre
  rationale: Majina yametoholewa kwa mwandiko na matamshi yanayofaa Kiswahili.
- source_word: ἀντέστησαν Μωϋσεῖ
  choice: walivyompinga Musa
  rationale: Kitenzi kinaonyesha kusimama dhidi ya mtu au kumpinga kwa vitendo; umbo la wakati uliopita limehifadhiwa.
- source_word: οὕτως καὶ οὗτοι
  choice: vivyo hivyo watu hawa nao
  rationale: Huhifadhi ulinganisho wa moja kwa moja na kuonyesha kwamba οὗτοι inawarejelea wanaume wanaozungumziwa katika muktadha.
- source_word: ἀνθίστανται τῇ ἀληθείᾳ
  choice: wanaipinga kweli
  rationale: Wakati wa sasa unaonyesha upinzani unaoendelea. “Kweli” limeachwa na upana wake wa Kiyunani bila kufafanuliwa moja kwa moja kuwa ujumbe wa injili.
- source_word: ἄνθρωποι κατεφθαρμένοι τὸν νοῦν
  choice: watu ambao akili zao zimeharibika
  rationale: Kauli hii huonyesha hali iliyotokana na kuharibika kwa fikra; “akili zao zimeharibika” ni ya asili na inafahamika kwa urahisi katika Kiswahili.
- source_word: ἀδόκιμοι περὶ τὴν πίστιν
  choice: wasiofaa kwa habari ya imani
  rationale: ἀδόκιμοι hueleza wale ambao hawakupita kipimo au hawakuthibitishwa kuwa wanafaa. “Kwa habari ya imani” huhifadhi uhusiano mpana unaoonyeshwa na περί bila kuamua iwapo πίστις ni imani binafsi au jumla ya mafundisho ya Kikristo.
theological_decisions:
- issue: Maana ya “kweli” na “imani”
  choice: 'Maneno yote mawili yameachwa katika upana wake: “kweli” na “imani.”'
  alternative: Kuyafafanua moja kwa moja kuwa “ukweli wa injili” na “mafundisho ya imani ya Kikristo,” au kuelewa “imani” kuwa tumaini la mtu binafsi.
  rationale: Muktadha unaelekea kwenye ujumbe wa kitume na imani ya Kikristo, lakini tafsiri kuu haipaswi kufunga maana ambayo maandishi yenyewe yameiacha kwa kiasi fulani wazi.
- issue: Urejeleaji wa ἄνθρωποι
  choice: “watu hawa” na “watu”
  alternative: “wanaume hawa” na “wanaume”
  rationale: Ingawa muktadha unaweza kuwarejelea walimu wa uongo wa kiume, “watu hawa” ni Kiswahili cha kawaida na cha heshima kinachoonyesha kundi maalumu bila kudai jinsia kwa nguvu kuliko matumizi ya kawaida ya ἄνθρωποι yanavyoruhusu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa ulinganisho umehifadhiwa, lakini sentensi imetungwa kwa mtiririko wa kawaida wa Kiswahili. Alama [b] imewekwa baada ya “imani,” ambako maelezo yake yanahusika moja kwa moja.
