lexical_decisions:
- source_word: σὺ δὲ
  choice: Lakini wewe
  rationale: Kiwakilishi kilichotajwa wazi kinaweka mkazo kwa Timotheo na δέ kinaonyesha utofauti na watu waovu waliotajwa kabla.
- source_word: μένε ἐν οἷς
  choice: dumu katika mambo
  rationale: Amri ya wakati wa sasa inadai kuendelea kwa uthabiti; “dumu katika” pia huhifadhi taswira ya kubaki ndani ya mafundisho hayo.
- source_word: ἔμαθες
  choice: uliyojifunza
  rationale: Wakati wa aoristi unaelekeza kwenye mafundisho aliyopokea hapo awali.
- source_word: ἐπιστώθης
  choice: kusadikishwa kuyahusu
  rationale: Hapa kitenzi katika hali ya kutendwa kinaashiria kufanywa mwenye uhakika au kusadiki; tafsiri hii inaonyesha usadikisho uliotokana na yale aliyojifunza bila kuifanya iwe agizo alilokabidhiwa.
- source_word: εἰδὼς
  choice: ukijua
  rationale: Umbo la kushiriki linahifadhi uhusiano mpana wa kimazingira na agizo kuu bila kuufanya wazi kuwa sababu pekee.
- source_word: παρὰ τίνων
  choice: kutoka kwa akina nani
  rationale: παρά pamoja na hali ya genitivi huonyesha chanzo, na umbo la wingi la SBLGNT hurejelea zaidi ya mtu mmoja bila kuwataja.
theological_decisions:
- issue: Wanaorejelewa na παρὰ τίνων
  choice: kutoka kwa akina nani
  alternative: kutoka kwa nani
  rationale: SBLGNT ina usomaji wa wingi, lakini mstari hauwataji walimu hao. Tafsiri haiwawekei utambulisho wa kimadhehebu au wa kifasiri.
- issue: Maana ya ἐπιστώθης
  choice: kusadikishwa kuyahusu
  alternative: kuhakikishiwa kuyahusu
  rationale: Chaguo kuu linaonyesha usadikisho thabiti kuhusu mafundisho; tanbihi huhifadhi maana mbadala ya kupewa uhakika.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Dumu” ni kifupi na cha kawaida katika muktadha wa kuendelea kwa uthabiti; “akina nani” huonyesha wazi wingi wa maandishi ya msingi.
