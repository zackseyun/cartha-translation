base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/015.yaml
  text: and that from infancy you have known the sacred writings[b][a], which are able to make you wise for salvation through faith in Messiah Jesus.
translation:
  language: sw
  text: na kwamba tangu ulipokuwa mtoto mchanga umeyajua maandiko matakatifu[a], ambayo yanaweza kukufanya uwe na hekima kwa ajili ya wokovu kwa njia ya imani katika Masihi Yesu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Maandiko Matakatifu.” Kigiriki kinasema kihalisi “maandiko matakatifu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa njia ya uaminifu wa Masihi Yesu,” ingawa hapa “imani katika Masihi Yesu” ndiyo maana ya kawaida zaidi.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπὸ βρέφους
  choice: tangu ulipokuwa mtoto mchanga
  rationale: βρέφος humaanisha mtoto aliye mdogo sana. Kauli hii ni ya kawaida katika Kiswahili na inahifadhi maana yenye nguvu kuliko ‘tangu utotoni.’
- source_word: ἱερὰ γράμματα
  choice: maandiko matakatifu
  rationale: Tafsiri hii inawakilisha moja kwa moja wazo la maandishi yenye utakatifu na kwa kawaida inaeleweka kuwa maandiko ya dini aliyofundishwa Timotheo.
- source_word: οἶδας
  choice: umeyajua
  rationale: Ingawa οἶδα ina maana ya wakati uliopo, pamoja na ἀπὸ βρέφους hali timilifu ya Kiswahili huonyesha ujuzi ulioanza zamani na unaoendelea kuwapo.
- source_word: τὰ δυνάμενά σε σοφίσαι
  choice: ambayo yanaweza kukupa hekima
  rationale: Kifungu hiki kinahusisha uwezo na maandiko na kutafsiri σοφίζω kwa lugha ya sasa na ya kawaida bila kupoteza wazo la kumfanya mtu awe na hekima.
- source_word: εἰς σωτηρίαν
  choice: inayoongoza kwenye wokovu
  rationale: εἰς huonyesha lengo au matokeo; usemi huu unaeleza kwa kawaida kwamba hekima hiyo inaelekea kwenye wokovu.
- source_word: διὰ πίστεως
  choice: kwa njia ya imani
  rationale: Hii inahifadhi dhana ya njia au chombo kinachoonyeshwa na διά na maana ya kawaida ya πίστις katika muktadha huu.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: katika Masihi Yesu
  rationale: ‘Masihi’ hutafsiri Χριστός kama cheo, huku ‘Yesu’ likibaki jina; ‘katika’ huhifadhi uhusiano unaoonyeshwa na ἐν.
theological_decisions:
- issue: Χριστῷ kama cheo au sehemu ya jina
  choice: Masihi Yesu
  alternative: Kristo Yesu
  rationale: Χριστός linaendelea kuwa na maana ya cheo cha Masihi hapa; kulisawiri hivyo kunahifadhi maana yake badala ya kulifanya tu kuwa sehemu ya jina.
- issue: Maana ya πίστεως katika διὰ πίστεως τῆς ἐν Χριστῷ Ἰησοῦ
  choice: kwa njia ya imani katika Masihi Yesu
  alternative: kwa njia ya uaminifu wa Masihi Yesu
  rationale: Muundo wenye ἐν kwa kawaida zaidi unaeleza imani iliyoelekezwa kwa Masihi Yesu. Uwezekano mdogo wa ‘uaminifu wa Masihi Yesu’ umehifadhiwa katika tanbihi bila kuufanya kuwa maana kuu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Tangu ulipokuwa mtoto mchanga’ ni wazi kwa wasomaji wa kawaida; ‘kukupa hekima inayoongoza kwenye wokovu’ huepuka usemi wa kizamani huku ikihifadhi lengo linaloonyeshwa na εἰς.
