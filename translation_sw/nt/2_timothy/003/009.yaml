  text: ἀλλ’ οὐ προκόψουσιν ἐπὶ πλεῖον, ἡ γὰρ ἄνοια αὐτῶν ἔκδηλος ἔσται πᾶσιν, ὡς καὶ ἡ ἐκείνων ἐγένετο.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/009.yaml
  text: But they will not advance any further[a], for their foolishness will be plain to everyone[b], as that of those men also became.
translation:
  language: sw
  text: Lakini hawatafanya maendeleo zaidi,[a] kwa maana upumbavu wao utakuwa dhahiri kwa watu wote, kama upumbavu wa watu wale pia ulivyokuwa dhahiri.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hawatasonga mbele zaidi.”
    reason: lexical_alternative
  - marker: b
    text: Yaani, upumbavu wa Yane na Yambre waliotajwa katika mstari uliotangulia.
    reason: cross_reference
lexical_decisions:
- source_word: προκόψουσιν
  choice: wataendelea
  rationale: Kitenzi hiki humaanisha kusonga mbele au kufanya maendeleo. Katika muktadha wa walimu wa uongo, “wataendelea” huhifadhi wazo la kusonga mbele bila kudokeza maendeleo mema.
- source_word: ἐπὶ πλεῖον
  choice: zaidi
  rationale: Kirai hiki humaanisha “zaidi” au “kwa kiwango kikubwa zaidi”; pamoja na ukanushi, “hawataendelea zaidi” ni Kiswahili cha kawaida na wazi.
- source_word: ἄνοια
  choice: upumbavu
  rationale: Neno hili linaonyesha kukosa ufahamu au mwenendo usio na akili; “upumbavu” hubeba maana ya kiakili na kimaadili katika muktadha huu.
- source_word: ἔκδηλος
  choice: utakuwa dhahiri
  rationale: Maana yake ni kuwa wazi au kuonekana wazi; “dhahiri” ni neno la sasa, lenye hadhi, na linaloeleweka kwa urahisi.
- source_word: πᾶσιν
  choice: kwa watu wote
  rationale: Huwasilisha upeo wa jumla wa dative ya wingi kwa Kiswahili cha kawaida bila kudai kwamba ni kila mwanadamu bila mipaka ya kimuktadha.
- source_word: ὡς καὶ ἡ ἐκείνων ἐγένετο
  choice: kama ule wa watu wale ulivyokuwa
  rationale: Kirai cha Kigiriki kimeacha nomino “upumbavu” ikieleweka. Kiwakilishi “ule” hurejelea upumbavu, na “watu wale” huhifadhi rejeo la nyuma bila kuingiza majina ndani ya mstari.
theological_decisions:
- issue: Rejeo la ἐκείνων
  choice: “watu wale” linarejelea Yane na Yambre waliotajwa katika mstari uliotangulia
  alternative: rejeo la jumla kwa walimu wa uongo wa zamani
  rationale: Muktadha wa karibu wa 3:8 unawataja Yane na Yambre. Tafsiri “watu wale” huhifadhi kiungo hicho cha nyuma, huku tanbihi ikikifafanua bila kuingiza tafsiri hiyo moja kwa moja katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umehifadhi ulinganisho na ufupisho wa Kigiriki, huku tanbihi zikitoa mbadala wa kileksika na kufafanua rejeo la kimuktadha.
