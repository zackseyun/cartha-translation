  text: ἐκ τούτων γάρ εἰσιν οἱ ἐνδύνοντες εἰς τὰς οἰκίας καὶ ⸀αἰχμαλωτίζοντες γυναικάρια σεσωρευμένα ἁμαρτίαις, ἀγόμενα ἐπιθυμίαις ποικίλαις,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/006.yaml
  text: For among these are those who slip into households and capture little women burdened with sins[a], led along by various desires[c][b],
translation:
  language: sw
  text: Kwa maana miongoni mwa hao wamo wale wanaojipenyeza majumbani na kuwateka[a] wanawake wanyonge[b], waliolemewa na dhambi[c] na kuongozwa na tamaa mbalimbali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuwafanya mateka”; neno la Kigiriki lina picha ya kukamata mateka.
    reason: lexical_alternative
  - marker: b
    text: Kigiriki kinatumia umbo la kudunisha, kihalisi “wanawake wadogo”; katika muktadha huu linawalenga wanawake walio wanyonge au wanaoweza kutumiwa vibaya.
    reason: lexical_alternative
  - marker: c
    text: Au, “waliobebeshwa mzigo wa dhambi”; usemi wa Kigiriki unaonyesha dhambi zilizokusanyika na kuwa mzigo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τούτων
  choice: miongoni mwa hao
  rationale: Kirai hiki kinaonyesha kwamba watu hao ni sehemu ya kundi lililoelezwa katika mistari iliyotangulia; tafsiri hii ni ya kawaida na wazi katika Kiswahili.
- source_word: ἐνδύνοντες εἰς τὰς οἰκίας
  choice: wanaojipenyeza majumbani
  rationale: Kitenzi kina dokezo la kuingia kwa siri au kwa hila. ‘Kujipenyeza majumbani’ huhifadhi dokezo hilo na kuelekeza kwenye mazingira ya nyumbani, si majengo tu.
- source_word: αἰχμαλωτίζοντες
  choice: kuwateka
  rationale: Neno hili lina picha ya kuwakamata watu na kuwafanya mateka; ‘kuwateka’ ni fupi, ya asili, na huhifadhi wazo la kuwatawala.
- source_word: γυναικάρια
  choice: wanawake wanyonge
  rationale: Ni umbo la kudunisha lenye maana hasi katika muktadha huu. ‘Wanawake wanyonge’ linaonyesha kundi linaloweza kutumiwa vibaya bila kudai kwamba wanawake wote ni wanyonge.
- source_word: σεσωρευμένα ἁμαρτίαις
  choice: waliolemewa na dhambi
  rationale: Kauli timilifu ya kutendwa inaonyesha hali iliyokusanyika na kuwa mzigo. Tafsiri hii ni ya kawaida katika Kiswahili na huhifadhi uzito wa dhambi nyingi.
- source_word: ἀγόμενα
  choice: kuongozwa
  rationale: Kauli ya kutendwa inaonyesha kwamba wanawake hao wanavutwa au kuendeshwa na nguvu ya tamaa zao, bila kuongeza wazo la kuondolewa mahali.
- source_word: ἐπιθυμίαις ποικίλαις
  choice: na tamaa mbalimbali
  rationale: ‘Tamaa’ lina maana hasi inayofaa muktadha wa kimaadili, na ‘mbalimbali’ huakisi moja kwa moja wingi wa aina unaoonyeshwa na ποικίλαις.
theological_decisions:
- issue: Kauli ya kudunisha γυναικάρια
  choice: wanawake wanyonge
  alternative: wanawake wadogo; wanawake wajinga; wanawake wanaodanganyika kwa urahisi
  rationale: Tafsiri inalenga kundi maalumu lililo hatarini kudanganywa na walimu wa uongo, si wanawake wote. Inahifadhi ukali wa kauli bila kuingiza dai la jumla kuhusu wanawake.
- issue: Maana ya mazingira ya οἰκίας
  choice: majumbani
  alternative: katika nyumba; katika kaya
  rationale: Muktadha unahusu kujipenyeza katika mazingira ya nyumbani na kuwashawishi watu waliomo. ‘Majumbani’ ni ya asili na inaweza kubeba maana ya mahali pamoja na mazingira ya nyumbani.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Lugha ni wazi kwa msomaji wa kawaida huku ikihifadhi picha za kujipenyeza, kuteka, kulemewa, na kuongozwa.
