reference: 2 Timothy 3:2
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἔσονται γὰρ οἱ ἄνθρωποι φίλαυτοι, φιλάργυροι, ἀλαζόνες, ὑπερήφανοι, βλάσφημοι, γονεῦσιν ἀπειθεῖς, ἀχάριστοι, ἀνόσιοι,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/002.yaml
  text: For people will be lovers of self[a], lovers of money, boastful, arrogant, slanderous, disobedient to parents, ungrateful, unholy,
translation:
  language: sw
  text: Kwa maana watu watakuwa wenye kujipenda, wenye kupenda fedha, wenye kujisifu, wenye kiburi, wenye kukashifu[a], wasiotii wazazi, wasio na shukrani, na wasio na utauwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wenye kukufuru” au “wenye kutukana.” Neno la Kigiriki linaweza kumaanisha usemi unaowavunjia heshima watu au Mungu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσονται
  choice: watakuwa
  rationale: Ni kitenzi cha wakati ujao cha εἰμί; “watakuwa” ni tafsiri ya kawaida na ya moja kwa moja katika Kiswahili.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Inaunganisha sentensi hii na iliyotangulia kwa kutoa sababu au maelezo.
- source_word: οἱ ἄνθρωποι
  choice: watu
  rationale: Usemi huu unawahusu wanadamu kwa ujumla, si wanaume pekee.
- source_word: φίλαυτοι
  choice: wenye kujipenda wenyewe
  rationale: Inaonyesha kujipenda kwa ubinafsi, huku ikihifadhi muundo unaolingana na sifa inayofuata.
- source_word: φιλάργυροι
  choice: wenye kupenda fedha
  rationale: Neno hilo kihalisi linahusu kupenda fedha; tafsiri hii ni wazi na haipanui maana kuwa tamaa ya kila aina.
- source_word: ἀλαζόνες
  choice: wenye kujisifu
  rationale: Inaeleza watu wanaojigamba au kujionyesha; “wenye kujisifu” ni ya kawaida na inafaa katika orodha hii.
- source_word: ὑπερήφανοι
  choice: wenye kiburi
  rationale: Inabeba maana hasi ya majivuno na kujiona kuwa bora kuliko wengine.
- source_word: βλάσφημοι
  choice: wenye kukashifu
  rationale: “Kukashifu” linaweza kueleza maneno yanayovunjia watu heshima na pia, kulingana na muktadha, maneno yanayomvunjia Mungu heshima; hivyo linahifadhi upana wa neno la Kigiriki.
- source_word: γονεῦσιν ἀπειθεῖς
  choice: wasiotii wazazi
  rationale: Hii ni tafsiri ya kawaida na ya asili ya kivumishi pamoja na nomino katika hali ya kudaiwa.
- source_word: ἀχάριστοι
  choice: wasio na shukrani
  rationale: Ni usemi wa Kiswahili wa kawaida unaoonyesha kutokuwa na moyo wa kushukuru.
- source_word: ἀνόσιοι
  choice: wasio watakatifu
  rationale: Inahifadhi uzito wa kidini na kimaadili wa kutokuwa na uchaji au heshima kwa yaliyo matakatifu.
theological_decisions:
- issue: Maana jumuishi ya οἱ ἄνθρωποι
  choice: watu
  alternative: wanaume; wanadamu
  rationale: Nomino ya kiume ya wingi imetumiwa kwa maana ya jumla; “watu” haizuii wanawake na ni ya asili katika Kiswahili.
- issue: Upana wa maana ya βλάσφημοι
  choice: wenye kukashifu
  alternative: wenye kukufuru; wenye kutukana
  rationale: Neno la Kigiriki linaweza kurejelea usemi unaowavunjia heshima wanadamu au Mungu. Tafsiri kuu inahifadhi upana huo, na tanbihi inaonyesha tafsiri nyingine zinazowezekana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Marudio ya “wenye” na “wasio” yanadumisha mdundo wa orodha ya maovu bila kufanya sentensi iwe ngumu.
