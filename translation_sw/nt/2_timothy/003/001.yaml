  yaml_path: translation/nt/2_timothy/003/001.yaml
  text: 'But know this: in the last days difficult times will come[a].'
translation:
  language: sw
  text: 'Lakini ujue hili: katika siku za mwisho kutakuja nyakati ngumu[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nyakati za hatari” au “nyakati za taabu.” Kivumishi cha Kigiriki kinaweza kumaanisha nyakati zilizo ngumu, hatari, au za taabu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτο
  choice: hili
  rationale: Kiwakilishi cha kuonyesha cha jinsi ya kati kinatazamia maelezo yanayofuata; “hili” ni cha kawaida katika Kiswahili kwa kurejelea jambo linalotajwa baada yake.
- source_word: δὲ
  choice: Lakini
  rationale: Huonyesha utofauti au hatua mpya yenye mgeuko mdogo kutoka muktadha uliotangulia; “Lakini” inadumisha nguvu hiyo bila kuizidisha.
- source_word: γίνωσκε
  choice: ujue
  rationale: Ni amri ya wakati uliopo kwa nafsi ya pili umoja. “Ujue” ni himizo la moja kwa moja na la kawaida kwa Timotheo.
- source_word: ὅτι
  choice: ':'
  rationale: Neno hili linaanzisha maudhui ya kile Timotheo anachopaswa kujua; nukta mbili huwasilisha uhusiano huo kwa Kiswahili cha asili.
- source_word: ἐν ἐσχάταις ἡμέραις
  choice: katika siku za mwisho
  rationale: Ni usemi wa kieskatolojia unaojulikana. Tafsiri hii huhifadhi usemi wa chanzo bila kufafanua kimfumo kipindi kinachokusudiwa.
- source_word: ἐνστήσονται
  choice: kutakuja
  rationale: Kitenzi kina maana ya kufika au kuwapo. “Kutakuja” huendana kwa kawaida na “nyakati” na huhifadhi mwelekeo wa wakati ujao.
- source_word: καιροὶ
  choice: nyakati
  rationale: καιρός humaanisha vipindi au majira maalumu, si wakati wa mfululizo tu; “nyakati” ni tafsiri pana na ya kawaida katika muktadha huu.
- source_word: χαλεποί
  choice: ngumu
  rationale: Kivumishi hiki kinaweza kueleza hali ngumu, hatari, kali, au yenye kusumbua. “Ngumu” ni cha sasa na kinachoeleweka, huku tanbihi ikihifadhi upana wa maana.
theological_decisions:
- issue: Maana ya “siku za mwisho”
  choice: Kuhifadhi usemi “siku za mwisho” bila kuuwekea mipaka kuwa kipindi kifupi tu kabla ya kurudi kwa Kristo.
  alternative: Kuutafsiri wazi kuwa kipindi cha mwisho kabisa kabla ya mwisho, au kuwa kipindi kipana cha kieskatolojia ambacho tayari kimeanza.
  rationale: Usemi wa Kigiriki una uzito wa kiteolojia lakini mstari huu pekee hauamui kwa uwazi kati ya mitazamo hiyo. Tafsiri huhifadhi mvutano huo badala ya kuingiza mfumo fulani wa kieskatolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa moja kwa moja umehifadhiwa, na tanbihi inaonyesha upana wa maana ya χαλεποί.
