lexical_decisions:
- source_word: προδόται
  choice: wasaliti
  rationale: Neno hili humaanisha watu wanaowasaliti wengine au wasiokuwa waaminifu kwao. “Wasaliti” ni neno la kawaida na lenye uzito unaofaa katika orodha hii ya maovu.
- source_word: προπετεῖς
  choice: wenye kufanya mambo bila kufikiri
  rationale: Neno hili linaeleza watu wanaotenda kwa pupa bila kuzingatia matokeo. Kauli hii inaeleweka wazi katika Kiswahili cha sasa na huepuka maana nyingine ya “wenye pupa,” ambayo wakati mwingine huhusishwa na tamaa.
- source_word: τετυφωμένοι
  choice: waliojaa majivuno
  rationale: Hii ni participio ya hali timilifu katika kauli tendwa, yenye maana ya kuwa wamefanywa au wamekuwa wenye majivuno. “Waliojaa majivuno” hudumisha kwa kiasi taswira ya kufura huku ikitoa maana wazi kwa msomaji wa kawaida.
- source_word: φιλήδονοι
  choice: wanaopenda anasa
  rationale: Neno ambatani la Kigiriki humaanisha wanaopenda raha au anasa. “Wanaopenda anasa” ni la asili katika Kiswahili na linaandaa ulinganifu na kumpenda Mungu.
- source_word: μᾶλλον ἢ
  choice: kuliko
  rationale: Muundo huu wa ulinganisho unaonyesha upendeleo mkubwa kwa kitu kimoja dhidi ya kingine. “Kuliko” huonyesha kwa ufupi na kwa kawaida ulinganisho huo katika Kiswahili.
- source_word: φιλόθεοι
  choice: kumpenda Mungu
  rationale: Neno hili humaanisha wenye kumpenda Mungu. Muundo wa kitenzi baada ya “kuliko” ni wa asili zaidi katika Kiswahili na bado huhifadhi tofauti iliyo wazi kati ya kupenda anasa na kumpenda Mungu.
theological_decisions:
- issue: Kuhifadhi ulinganifu wa maadili kati ya kupenda anasa na kumpenda Mungu bila kuongeza maana ya kimadhehebu
  choice: wanaopenda anasa kuliko kumpenda Mungu
  alternative: wapendao anasa kuliko walio wapenzi wa Mungu
  rationale: Tafsiri iliyochaguliwa ni ya kawaida na wazi, huku ikihifadhi mgongano wa Kigiriki kati ya kuelekeza upendo kwa anasa na kuuelekeza kwa Mungu. Aya hii ni maelezo ya maadili, si istilahi maalumu ya mafundisho.
- issue: Kuwasilisha taswira ya τετυφωμένοι pamoja na maana yake ya majivuno
  choice: waliojaa majivuno
  alternative: wenye kujiona
  rationale: “Waliojaa majivuno” hudokeza hali iliyokita na kuhifadhi sehemu ya taswira ya kufura, bila kuifanya sentensi isisikike ya kigeni. Tanbihi inaweka wazi tafsiri mbadala na taswira ya neno la asili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo unaendelea kama sehemu ya orodha ya maovu, ndiyo sababu umeachwa na koma mwishoni. Alama za tanbihi [a], [b], na [c] zimewekwa mara tu baada ya maneno yanayohusika.
