  yaml_path: translation/nt/2_timothy/003/013.yaml
  text: But evil people and impostors will go on from bad to worse[b][a], deceiving and being deceived.
translation:
  language: sw
  text: Lakini watu waovu na walaghai watazidi kuwa waovu[b], huku wakidanganya na wao wenyewe wakidanganywa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakipotosha na wao wenyewe wakipotoshwa.”
    reason: lexical_alternative
  - marker: b
    text: Kwa maana ya neno kwa neno, “watasonga mbele kuelekea yaliyo mabaya zaidi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πονηροὶ
  choice: waovu
  rationale: Hueleza upotovu wa kimaadili, si ubaya wa kawaida tu.
- source_word: δὲ
  choice: Lakini
  rationale: Huonyesha tofauti na yale yaliyotangulia kuhusu Timotheo na watu waaminifu.
- source_word: ἄνθρωποι
  choice: watu
  rationale: Ni rejeo la jumla kwa wanadamu, wala halihusu wanaume pekee.
- source_word: γόητες
  choice: walaghai
  rationale: Neno hili humaanisha wadanganyifu wenye hila; hapa 'walaghai' linaonyesha udanganyifu bila kulazimisha maana mahsusi ya uchawi.
- source_word: προκόψουσιν ἐπὶ τὸ χεῖρον
  choice: watazidi kuwa wabaya zaidi
  rationale: Ni Kiswahili cha kawaida kinachoonyesha mwendo unaoendelea kuelekea hali mbaya zaidi, huku dokezo la maana halisi likiwekwa katika tanbihi.
- source_word: πλανῶντες
  choice: huku wakidanganya
  rationale: Huhifadhi tendo linaloendelea na kulihusianisha na kuzidi kwao katika uovu.
- source_word: πλανώμενοι
  choice: na wao wenyewe wakidanganywa
  rationale: 'Huhifadhi hali ya kutendwa: wadanganyifu hao pia wako chini ya udanganyifu.'
theological_decisions:
- issue: Upeo wa ἄνθρωποι
  choice: watu
  alternative: wanaume
  rationale: Umbo la kiume la Kigiriki ni la kijumla katika muktadha huu; 'watu' halipunguzi rejeo kuwa wanaume pekee.
- issue: Dokezo la γόητες
  choice: walaghai
  alternative: wachawi
  rationale: Ingawa neno linaweza kuwa na madokezo ya uchawi au uganga wa kitapeli, muktadha unasisitiza hila na udanganyifu. Tafsiri haipaswi kuingiza dai la uchawi kwa nguvu kuliko ushahidi wa muktadha.
- issue: Uhusiano wa πλανῶντες na πλανώμενοι
  choice: wakidanganya na wao wenyewe wakidanganywa
  alternative: wakipotosha na kupotoshwa
  rationale: Huhifadhi mvutano kwamba watu hawa ni watendaji wa udanganyifu na wakati huohuo ni waathiriwa wake, bila kueleza ni nani anayewadanganya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Walaghai' linaeleweka kwa wasomaji wa kawaida na huhifadhi wazo la hila. Muundo wa 'huku...' unaonyesha kwamba udanganyifu unaambatana na kuzidi kwao kuwa wabaya.
