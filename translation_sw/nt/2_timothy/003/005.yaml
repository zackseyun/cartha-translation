  text: ἔχοντες μόρφωσιν εὐσεβείας τὴν δὲ δύναμιν αὐτῆς ἠρνημένοι· καὶ τούτους ἀποτρέπου.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/005.yaml
  text: having a form of godliness but denying its power[b][a]; and turn away from these people.
translation:
  language: sw
  text: wakiwa na sura ya utauwa[a], lakini wameikana nguvu yake. Jiepushe na watu hao.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mwonekano wa utauwa.” Neno la Kiyunani linaweza kusisitiza sura au umbo la nje.
    reason: lexical_alternative
  - marker: b
    text: Au, “Kaa mbali na watu hao” au “Waepuke watu hao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχοντες
  choice: wakiwa na
  rationale: Kirai hiki cha hali kinaendelea kuwaeleza watu waliotajwa katika muktadha uliotangulia; “wakiwa na” ni Kiswahili cha kawaida kinachohifadhi uhusiano huo.
- source_word: μόρφωσιν
  choice: sura
  rationale: “Sura” inaweza kumaanisha umbo au mwonekano wa nje, na hivyo inadumisha tofauti iliyokusudiwa kati ya hali ya nje na nguvu halisi bila kuifafanua kupita kiasi.
- source_word: εὐσεβείας
  choice: utauwa
  rationale: “Utauwa” hueleza maisha ya kumcha na kumheshimu Mungu na inafaa kwa matumizi ya neno hili katika Nyaraka za Kichungaji.
- source_word: τὴν δὲ δύναμιν αὐτῆς
  choice: lakini ... nguvu yake
  rationale: Tafsiri hii inadumisha utofautishaji wa δέ na kiwakilishi αὐτῆς, huku “nguvu” ikiacha wazi aina ya utendaji unaokusudiwa.
- source_word: ἠρνημένοι
  choice: wameikana
  rationale: Kauli ya wakati timilifu inaonyesha msimamo uliokwisha kuchukuliwa na ambao matokeo yake yanaendelea; “wameikana” inadumisha hali hiyo.
- source_word: καὶ τούτους ἀποτρέπου
  choice: Jiepushe na watu hao
  rationale: Kitenzi cha kati cha kuamuru kina maana ya mtu kujiondoa au kukaa mbali; “jiepushe” ni amri ya kawaida na ya moja kwa moja, na “watu hao” huweka wazi warejelewa wa wingi.
theological_decisions:
- issue: Tofauti kati ya sura ya nje ya dini na uhalisi wake wenye nguvu
  choice: sura ya utauwa ... nguvu yake
  alternative: mwonekano wa utauwa ... nguvu yake
  rationale: Tafsiri inadumisha mvutano kati ya hali ya nje ya utauwa na uhalisi wake wenye matokeo. Haifanyi “nguvu” kuwa miujiza pekee, mabadiliko ya maadili pekee, au kazi ya Roho Mtakatifu pekee, kwa kuwa Kiyunani hakubani maana hiyo hapa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Sura ya utauwa” inadumisha picha ya nje dhidi ya nguvu halisi; “jiepushe” ni amri ya moja kwa moja kwa mtu mmoja.
