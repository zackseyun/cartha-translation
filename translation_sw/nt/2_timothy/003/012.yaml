  text: καὶ πάντες δὲ οἱ θέλοντες ⸂ζῆν εὐσεβῶς⸃ ἐν Χριστῷ Ἰησοῦ διωχθήσονται·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/012.yaml
  text: And indeed[a], all who want to live godly in Messiah Jesus will be persecuted.
translation:
  language: sw
  text: Naam, wote wanaotaka kuishi maisha ya kumcha Mungu katika Masihi Yesu[a] watateswa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika Kristo Yesu.”
    reason: Tafsiri mbadala ya Χριστῷ inayotumia umbo la jadi “Kristo” badala ya kutafsiri cheo hicho kuwa “Masihi.”
lexical_decisions:
- source_word: καὶ ... δὲ
  choice: Naam
  rationale: Katika muktadha huu viunganishi hivi vinaendeleza hoja na kuithibitisha kwa msisitizo wa kiasi. “Naam” ni usemi wa asili na wenye heshima unaobeba nguvu hiyo bila kuonyesha upinzani mkali.
- source_word: πάντες οἱ θέλοντες
  choice: wote wanaotaka
  rationale: Muundo wa kibainishi pamoja na kitenzi-shirikishi unawataja kwa ujumla watu wote wenye nia hiyo; tafsiri hii inahifadhi upeo wa “wote” na maana ya hiari au tamaa katika θέλω.
- source_word: ζῆν εὐσεβῶς
  choice: kuishi maisha ya kumcha Mungu
  rationale: εὐσεβῶς inaeleza maisha yanayoendeshwa kwa uchaji na kujitoa kwa Mungu. Usemi huu ni wa kawaida zaidi katika Kiswahili cha sasa kuliko “kuishi kwa utauwa,” huku ukihifadhi maana ya kidini na kimaadili.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: katika Masihi Yesu
  rationale: ἐν huonyesha mazingira au uhusiano wa maisha ndani ya Yesu, naye Χριστός hapa anaweza kueleweka kama cheo cha Masihi. “Katika” huhifadhi kwa makusudi upana wa uhusiano huo badala ya kuufafanua kupita kiasi.
- source_word: διωχθήσονται
  choice: watateswa
  rationale: Kitenzi hiki ni cha wakati ujao na kauli ya kutendwa, kikiwa na maana ya kufuatwa kwa uhasama au kuteswa. “Watateswa” ni tafsiri fupi, ya moja kwa moja, na ya kawaida katika muktadha huu.
theological_decisions:
- issue: Kutafsiri Χριστῷ kama cheo au kama jina lililozoeleka
  choice: Masihi Yesu
  alternative: Kristo Yesu
  rationale: Katika kirai hiki Χριστός bado inaweza kubeba nguvu ya cheo cha yule aliyetiwa mafuta. “Masihi Yesu” huonyesha wazi nguvu hiyo; tanbihi inatoa umbo la jadi “Kristo Yesu” bila kulazimisha tofauti ya kiteolojia.
- issue: Maana ya maisha “katika” Yesu
  choice: katika Masihi Yesu
  alternative: kwa kuungana na Masihi Yesu
  rationale: Kirai cha Kigiriki ἐν Χριστῷ Ἰησοῦ kinaweza kuonyesha mazingira, uhusiano, au muungano na Yesu. Tafsiri halisi kiasi ya “katika” inalinda upana huo na haifungi maana katika ufafanuzi mmoja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na heshima. “Naam” hutoa msisitizo wa uthibitisho, na “maisha ya kumcha Mungu” huepuka usemi mgumu au wa kizamani bila kupunguza uzito wa sentensi.
