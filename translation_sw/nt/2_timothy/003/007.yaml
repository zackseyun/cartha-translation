  yaml_path: translation/nt/2_timothy/003/007.yaml
  text: always learning and never able to come to the knowledge of the truth[a].
translation:
  language: sw
  text: wakijifunza daima, lakini hawawezi kamwe kuufikia ujuzi wa kweli[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ujuzi kamili wa kweli.” Neno la Kigiriki linaweza kuwa na maana ya ujuzi ulio kamili zaidi au wa kina zaidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντοτε
  choice: daima
  rationale: Kielezi hiki kinaonyesha tendo linaloendelea au kurudiwa; “daima” ni kifupi na kinahifadhi nguvu ya utofautishaji na μηδέποτε.
- source_word: μανθάνοντα
  choice: wakijifunza
  rationale: Kitenzi-ushiriki cha wakati uliopo kinaonyesha kujifunza kunakoendelea. Muundo wa “waki-” unaendeleza utegemezi wa kisarufi kwa wanawake waliotajwa katika mstari uliotangulia bila kuongeza maana ya kufundishwa rasmi.
- source_word: μηδέποτε
  choice: kamwe
  rationale: Kielezi hiki hasi kina maana ya “wakati wowote ule si”; “kamwe” kinaonyesha ukataaji mkali na kuleta utofauti wa wazi na “daima.”
- source_word: εἰς ἐπίγνωσιν
  choice: kuufikia ujuzi
  rationale: εἰς pamoja na ἐλθεῖν inaonyesha kufika kwenye hali au lengo fulani. “Kuufikia ujuzi” ni Kiswahili cha kawaida kinachohifadhi taswira ya kufika bila kulazimisha maana ya “ujuzi kamili.”
- source_word: ἀληθείας
  choice: wa kweli
  rationale: Hiki ni kivumishi-milikishi kinachotegemea “ujuzi.” “Kweli” hapa inaeleweka kama ile kweli inayotambulika katika muktadha, si ukweli kwa ujumla tu.
- source_word: ἐλθεῖν
  choice: kuufikia
  rationale: Ingawa maana ya msingi ni “kuja,” katika muundo huu wa kufika kwenye ujuzi, “kuufikia” ni usemi wa kawaida wa Kiswahili na huhifadhi wazo la kuwasili kwenye lengo.
- source_word: δυνάμενα
  choice: wasiweze
  rationale: Kitenzi-ushiriki hiki kinaonyesha uwezo. “Wasiweze” kinategemea wahusika wa kike waliotajwa katika mstari uliotangulia na kinaungana kiasili na “kamwe.”
theological_decisions:
- issue: Kiwango cha maana ya ἐπίγνωσις katika matumizi ya Paulo
  choice: ujuzi
  alternative: ujuzi kamili
  rationale: ἐπίγνωσις yaweza kudokeza ujuzi ulio kamili au wa kina zaidi, lakini hapa hoja kuu ni kushindwa kuifikia kweli licha ya kujifunza daima. “Ujuzi” hailazimishi tofauti ya kitaalamu isiyodaiwa wazi na mstari; uwezekano wa maana yenye nguvu zaidi umewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Sentensi imehifadhiwa kama kishazi kinachotegemea mstari uliotangulia, kulingana na muundo wa Kigiriki.
