  text: τοῖς διωγμοῖς, τοῖς παθήμασιν, οἷά μοι ἐγένετο ἐν Ἀντιοχείᾳ, ἐν Ἰκονίῳ, ἐν Λύστροις, οἵους διωγμοὺς ὑπήνεγκα· καὶ ἐκ πάντων με ἐρρύσατο ὁ κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/011.yaml
  text: the persecutions[a], the sufferings, such as happened to me in Antioch, in Iconium, in Lystra—what persecutions I endured[b]; and from them all the Lord rescued me.
translation:
  language: sw
  text: minyanyaso, mateso, kama yale yaliyonipata huko Antiokia, Ikonio na Listra—ni minyanyaso ya namna gani niliyovumilia![a] Na Bwana[b] aliniokoa kutoka katika hayo yote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “minyanyaso mikubwa namna gani niliyovumilia!”
    reason: lexical_alternative
  - marker: b
    text: Huenda “Bwana” anamrejelea Bwana Yesu, ingawa maandishi ya Kigiriki yanasema tu “Bwana.”
    reason: alternative_reading
lexical_decisions:
- source_word: διωγμοῖς / διωγμούς
  choice: minyanyaso
  rationale: Neno hili linaonyesha kufuatiliwa na kutendewa kwa uhasama kwa sababu ya imani au utume. “Minyanyaso” ni la kawaida na linatofautisha wazo hili na mateso kwa maana pana.
- source_word: παθήμασιν
  choice: mateso
  rationale: “Mateso” huhifadhi maana pana ya mambo yanayoumiza au kuleta taabu bila kuyawekea mipaka kuwa mashambulizi ya nje pekee.
- source_word: οἷά μοι ἐγένετο
  choice: kama yale yaliyonipata
  rationale: Kauli hii ya asili inatoa mifano ya minyanyaso na mateso yaliyotajwa, na tafsiri hii ni ya kawaida katika Kiswahili huku ikihifadhi kazi hiyo.
- source_word: ἐν Ἀντιοχείᾳ, ἐν Ἰκονίῳ, ἐν Λύστροις
  choice: huko Antiokia, Ikonio na Listra
  rationale: Majina ya mahali yametoholewa kwa maumbo yanayotambulika katika Kiswahili. “Huko” linafaa kwa kukumbuka matukio katika maeneo hayo bila kurudia kihusishi kwa namna isiyo ya kawaida.
- source_word: οἵους διωγμοὺς
  choice: ni minyanyaso ya namna gani
  rationale: Muundo huu unahifadhi nguvu ya mshangao na sifa ya οἵους bila kuamua kwa usahihi zaidi kiwango au aina ya minyanyaso.
- source_word: ὑπήνεγκα
  choice: niliyovumilia
  rationale: Kitenzi hiki kinaeleza kubeba au kustahimili shinikizo; “kuvumilia” ni cha asili na sahihi katika muktadha huu.
- source_word: ἐκ πάντων
  choice: kutoka katika hayo yote
  rationale: Kauli hii inarejelea minyanyaso na mateso yote yaliyotajwa na kuhifadhi taswira ya kuokolewa kutoka ndani ya hatari hizo.
- source_word: ἐρρύσατο
  choice: aliniokoa
  rationale: “Kuokoa” hapa ni neno la kawaida kwa kumtoa mtu katika hatari. Muktadha unaonyesha wazi wokovu kutoka katika minyanyaso, si lazima maana pana ya wokovu wa kiroho.
- source_word: ὁ κύριος
  choice: Bwana
  rationale: Kichwa κύριος kimetafsiriwa kwa neno la kawaida “Bwana” bila kuongeza jina ambalo halipo katika maandishi ya Kigiriki.
theological_decisions:
- issue: Anayerejelewa na “Bwana”
  choice: Bwana
  alternative: Bwana Yesu
  rationale: Katika maandishi ya Paulo huenda sana cheo hiki kinamrejelea Yesu, lakini Kigiriki kinasema tu ὁ κύριος. Tafsiri inaacha rejeo hilo kama lilivyo badala ya kuongeza “Yesu” katika matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Kipande cha mwanzo kimeachwa katika mtiririko wa orodha kwa sababu aya inaendeleza sentensi iliyoanza katika aya iliyotangulia. Alama ya mshangao inaonyesha nguvu ya muundo wa οἵους bila kuongeza maelezo ya kiteolojia.
