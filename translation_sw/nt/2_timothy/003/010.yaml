id: 2TI.3.10
reference: 2 Timothy 3:10
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Σὺ δὲ ⸀παρηκολούθησάς μου τῇ διδασκαλίᾳ, τῇ ἀγωγῇ, τῇ προθέσει, τῇ πίστει, τῇ μακροθυμίᾳ, τῇ ἀγάπῃ, τῇ ὑπομονῇ,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/010.yaml
  text: But you have closely followed my teaching[a], conduct, purpose, faith, patience, love, endurance,
translation:
  language: sw
  text: Lakini wewe umefuata kwa makini mafundisho yangu, mwenendo wangu, kusudi langu, imani yangu[a], uvumilivu wangu, upendo wangu na ustahimilivu wangu,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “uaminifu.” Neno la Kigiriki katika muktadha huu linaweza kumaanisha imani au uaminifu.
    reason: alternative_reading
lexical_decisions:
- source_word: Σὺ δὲ
  choice: Lakini wewe
  rationale: “Lakini” huhifadhi utofautishaji na watu waovu waliotajwa kabla, na “wewe” huonyesha msisitizo wa kiwakilishi Σὺ.
- source_word: παρηκολούθησάς
  choice: umefuata kwa makini
  rationale: Kauli hii inaonyesha kufahamu kwa karibu na kufuata kwa uangalifu mafundisho na maisha ya Paulo; tafsiri hii huhifadhi vipengele vya kuzingatia na kuiga.
- source_word: μου
  choice: yangu / wangu / langu
  rationale: Kiwakilishi cha umilikaji kinahusishwa na kila nomino katika orodha, huku upatanisho wa kisarufi wa Kiswahili ukizingatiwa.
- source_word: διδασκαλίᾳ
  choice: mafundisho
  rationale: Ni neno la kawaida na linaloeleweka kwa maudhui aliyofundisha Paulo, bila uzito wa istilahi ya kitaalamu.
- source_word: ἀγωγῇ
  choice: mwenendo
  rationale: Hueleza namna ya kuishi au tabia inayoonekana katika maisha.
- source_word: προθέσει
  choice: kusudi
  rationale: Huwasilisha lengo au azimio thabiti la Paulo kwa lugha ya kawaida.
- source_word: πίστει
  choice: imani
  rationale: “Imani” huhifadhi maana kuu ya πίστις, huku uwezekano wa maana ya “uaminifu” ukihifadhiwa katika tanbihi.
- source_word: μακροθυμίᾳ
  choice: uvumilivu
  rationale: Hueleza subira na ustahimilivu kwa watu, hasa wakati wa kuchokozwa.
- source_word: ἀγάπῃ
  choice: upendo
  rationale: Ni tafsiri ya kawaida, ya wazi na ya sasa ya ἀγάπη.
- source_word: ὑπομονῇ
  choice: ustahimilivu
  rationale: Husisitiza kudumu imara chini ya majaribu na pia huitofautisha na μακροθυμία, iliyotafsiriwa “uvumilivu.”
theological_decisions:
- issue: Maana ya πίστις katika orodha ya sifa za Paulo
  choice: imani
  alternative: uaminifu
  rationale: Katika muktadha huu πίστις inaweza kumaanisha kumtumaini Mungu au kuwa mwaminifu. Maandishi makuu yanatumia “imani,” lakini tanbihi huhifadhi maana nyingine halali bila kuondoa utata wa asili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Kurudiwa kwa viwakilishi vya umilikaji kunafanya kila sifa ihusishwe wazi na Paulo, na tofauti kati ya “uvumilivu” na “ustahimilivu” huhifadhi tofauti ya maneno mawili ya Kigiriki.
