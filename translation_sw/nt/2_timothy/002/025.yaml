  yaml_path: translation/nt/2_timothy/002/025.yaml
  text: correcting those who oppose him with gentleness[a], in case God may grant them repentance leading to the knowledge of the truth[b],
translation:
  language: sw
  text: akiwasahihisha kwa upole wale wanaompinga[a], huenda Mungu akawajalia kutubu ili waijue kweli,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wale wanaopinga.” Kigiriki hakitaji wazi mtu anayepingwa; muktadha unaonyesha kuwa wanampinga mtumishi wa Bwana na mafundisho yake.
    reason: lexical_alternative
  - marker: b
