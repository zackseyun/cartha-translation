base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/009.yaml
  text: for which I am suffering hardship[a], even to the point of chains, as a criminal[b]. But the word of God is not bound.
translation:
  language: sw
  text: Kwa ajili yake ninateseka[a], hata kufikia kuwa katika minyororo kama mhalifu[b]. Lakini neno la Mungu halijafungwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ambayo ndani yake” au “ambayo kwa sababu yake”; yaelekea kishazi cha Kigiriki kinarejelea injili iliyotajwa katika mstari uliotangulia.
    reason: alternative_reading
  - marker: b
    text: Au, “kama mtenda maovu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: ambayo kwa ajili yake
  rationale: Kishazi hiki kinarejelea injili iliyotajwa katika mstari uliotangulia na kinaweza kuonyesha sababu au mazingira ya mateso. Tafsiri hii inaeleza kwa Kiswahili cha kawaida kwamba Paulo anateseka kwa ajili ya injili huku tanbihi ikihifadhi uwezekano mwingine.
- source_word: κακοπαθῶ
  choice: ninateseka
  rationale: Kitenzi kinaonyesha kupitia taabu au mateso yanayoendelea. ‘Ninateseka’ ni cha asili, wazi, na kinahifadhi hali ya sasa.
- source_word: μέχρι δεσμῶν
  choice: hata kufikia kufungwa kwa minyororo
  rationale: μέχρι huonyesha kiwango kilichofikiwa, na δεσμῶν hudumisha picha halisi ya minyororo huku ‘kufungwa’ ikifanya maana yake ieleweke kwa urahisi.
- source_word: ὡς κακοῦργος
  choice: kama mhalifu
  rationale: Neno hili linaweza kumaanisha mtu atendaye maovu au mkosaji wa jinai. Katika mazingira ya kufungwa, ‘mhalifu’ ni sawia ya Kiswahili iliyo wazi bila kudai kwamba shtaka hilo lilikuwa la haki.
- source_word: ἀλλὰ
  choice: Lakini
  rationale: Kiunganishi hiki kinaweka tofauti kali kati ya Paulo kufungwa na neno la Mungu kutofungwa.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: neno la Mungu
  rationale: Hii ni tafsiri ya kawaida inayohifadhi upana wa λόγος bila kuibana iwe Maandiko pekee au ujumbe wa injili pekee.
- source_word: οὐ δέδεται
  choice: halijafungwa
  rationale: Kauli timilifu ya kutendwa inaonyesha hali ya kutokuwa limefungwa. ‘Halijafungwa’ pia hudumisha ulinganifu wa kimakusudi na kufungwa kwa Paulo.
theological_decisions:
- issue: Maana mahususi ya ‘neno la Mungu’
  choice: neno la Mungu
  alternative: ujumbe wa injili; Maandiko
  rationale: Muktadha wa karibu unaelekeza hasa kwenye injili inayohubiriwa, lakini kishazi cha Kigiriki ni kipana zaidi. Tafsiri haifungi maana kwenye rejeo moja tu.
- issue: Uhusiano wa ἐν ᾧ na injili
  choice: ambayo kwa ajili yake
  alternative: ambayo ndani yake; ambayo kwa sababu yake
  rationale: Muktadha unaunga mkono kurejelea injili ya mstari wa 8 na maana ya sababu, lakini tanbihi inahifadhi uwezo wa kishazi hicho kueleweka kama mazingira au nyanja ambamo mateso yanatokea.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ‘kufungwa kwa minyororo’ unahifadhi picha ya minyororo na unasikika kwa kawaida; sentensi ya mwisho ni fupi na yenye mkazo ili kuonyesha tofauti ya balagha.
