lexical_decisions:
- source_word: λόγος
  choice: maneno
  rationale: Katika muktadha wa mafundisho ya uongo na majadiliano yasiyo na maana (mst. 16, 18), neno hili linamaanisha yale wanayosema, si neno moja tu. “Maneno” ni Kiswahili cha kawaida kinachobaki wazi kama ni mazungumzo, kauli, au ujumbe wao.
- source_word: αὐτῶν
  choice: yao
  rationale: Ni kiwakilishi cha umilikaji kinachohusiana moja kwa moja na λόγος.
- source_word: ὡς γάγγραινα
  choice: kama donda ndugu
  rationale: “Donda ndugu” ni istilahi ya Kiswahili iliyozoeleka kwa ugonjwa wa tishu unaooza na kuenea; inadumisha picha kali ya ugonjwa unaoharibu bila kuibadili kuwa “saratani.”
- source_word: νομὴν ἕξει
  choice: yataenea
  rationale: Kirai hiki kwa maana halisi kinahusu kupata nafasi ya kulisha au kuendelea, lakini katika mfano wa donda ndugu kinaeleza kuenea kwake kwa uharibifu. “Yataenea” huwasilisha maana hiyo kwa Kiswahili cha asili.
- source_word: ὧν ἐστιν
  choice: Miongoni mwao wamo
  rationale: Muundo huu unawataja watu wawili kama sehemu ya kundi linalozungumziwa; “miongoni mwao wamo” huhifadhi maana hiyo kwa mtindo wa kawaida wa Kiswahili.
- source_word: Ὑμέναιος
  choice: Himenayo
  rationale: Jina limetoholewa kwa tahajia na matamshi yanayofaa Kiswahili.
- source_word: Φίλητος
  choice: Fileto
  rationale: Jina limetoholewa kwa tahajia na matamshi yanayofaa Kiswahili.
theological_decisions:
- issue: Nguvu ya mfano wa ugonjwa
  choice: Maneno ya upotovu yanaonyeshwa kuwa yanaenea kwa uharibifu katika jumuiya.
  alternative: Kutafsiri kirai hicho kwa kufuata maneno yake halisi zaidi, kama “yatapata malisho/njia yake,” bila kueleza kuenea kwake.
  rationale: “Yataenea kama donda ndugu” huhifadhi onyo la Paulo na picha ya ugonjwa unaosambaa bila kuongeza dai la kimafundisho lisilokuwamo katika maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Donda ndugu” inadumisha sitiari ya kitabibu, huku “yataenea” ikifanya nahau ya Kigiriki ieleweke kwa msomaji wa kawaida.
