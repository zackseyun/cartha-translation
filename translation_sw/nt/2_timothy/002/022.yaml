base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/022.yaml
  text: But flee youthful desires[a], and pursue righteousness, faith, love, and peace[c][b], together with those who call on the Lord from a pure heart.
translation:
  language: sw
  text: Lakini zikimbie tamaa za ujana[a], na ufuatilie uadilifu[b], imani[c], upendo na amani, pamoja na wale wanaomwitia Bwana kwa moyo safi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au ‘tamaa zinazowapata vijana.’ Kirai cha Kigiriki kinaweza kumaanisha kwa upana tamaa zinazohusishwa na ujana, si tamaa za ngono pekee.
    reason: lexical_alternative
  - marker: b
    text: Au ‘haki.’ Neno la Kigiriki linaweza kuhusisha mwenendo mwema na pia kutenda yaliyo ya haki katika mahusiano.
    reason: alternative_reading
  - marker: c
    text: Au ‘uaminifu.’ Neno la Kigiriki linaweza kumaanisha imani, kutumaini, au uaminifu kulingana na muktadha.
    reason: alternative_reading
lexical_decisions:
- source_word: νεωτερικὰς ἐπιθυμίας
  choice: tamaa za ujana
  rationale: Kirai hiki kinamaanisha tamaa zinazohusishwa na ujana kwa maana pana, si tamaa za ngono pekee. ‘Tamaa za ujana’ ni Kiswahili cha kawaida na kinahifadhi upana huo.
- source_word: φεῦγε
  choice: zikimbie
  rationale: Amri hii ina nguvu ya kujiepusha kabisa na kwa kuendelea; ‘zikimbie’ huhifadhi picha hai ya kukimbia mbali na kitu.
- source_word: δίωκε
  choice: ufuatilie
  rationale: Kitenzi hiki kinaeleza juhudi hai na endelevu. ‘Ufuatilie’ pia hudumisha ulinganifu wa kisemantiki na ‘zikimbie.’
- source_word: δικαιοσύνην
  choice: uadilifu
  rationale: Katika orodha hii ya sifa, ‘uadilifu’ huwasilisha mwenendo ulio sawa na mwema kwa lugha ya kawaida; maana mbadala ya ‘haki’ imehifadhiwa katika tanbihi.
- source_word: πίστιν
  choice: imani
  rationale: ‘Imani’ ndiyo tafsiri ya kawaida ya πίστις na inafaa katika orodha hii, huku uwezekano wa maana ya ‘uaminifu’ ukihifadhiwa katika tanbihi.
- source_word: ἀγάπην
  choice: upendo
  rationale: Ni tafsiri ya moja kwa moja, ya kawaida na inayofaa katika muktadha huu.
- source_word: εἰρήνην
  choice: amani
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida katika orodha ya sifa zinazopaswa kufuatiliwa.
- source_word: μετὰ τῶν ἐπικαλουμένων τὸν κύριον
  choice: pamoja na wale wanaomwitia Bwana
  rationale: ‘Pamoja na’ huonyesha ushirika unaoelezwa na μετά pamoja na genitivi; ‘kumwitia Bwana’ ni usemi wa asili unaohifadhi maana ya kumwomba au kumkiri Bwana.
- source_word: κύριον
  choice: Bwana
  rationale: ‘Bwana’ ndiyo tafsiri ya kawaida ya κύριος katika Agano Jipya.
- source_word: ἐκ καθαρᾶς καρδίας
  choice: kutoka katika moyo safi
  rationale: ‘Kutoka katika’ huhifadhi wazo la chanzo linaloletwa na ἐκ, yaani kumwitia Bwana kunakotoka ndani ya moyo safi.
theological_decisions:
- issue: Upeo wa ‘tamaa za ujana’
  choice: Tamaa mbalimbali zinazohusishwa na ujana, bila kuziweka katika tamaa za ngono pekee
  alternative: Hasa tamaa za ngono
  rationale: Kirai cha Kigiriki kina maana pana, na muktadha wa tabia na mwenendo hauhalalishi kuifinya maana iwe ya ngono tu.
- issue: Maana ya δικαιοσύνη katika orodha ya sifa
  choice: Uadilifu katika matini kuu
  alternative: Haki
  rationale: Katika himizo hili la kimaadili, ‘uadilifu’ ni ya asili na huonyesha mwenendo ulio sawa; hata hivyo, neno la Kigiriki linaweza pia kuwa na maana ya haki katika mahusiano, ambayo imehifadhiwa katika tanbihi.
- issue: Maana ya πίστις katika orodha ya sifa
  choice: Imani katika matini kuu
  alternative: Uaminifu
  rationale: ‘Imani’ huhifadhi tafsiri ya kawaida bila kuondoa uwezekano kwamba katika orodha hii neno linadokeza sifa ya uaminifu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa amri mbili zinazokinzana—‘zikimbie’ na ‘ufuatilie’—umehifadhiwa. Tanbihi zimewekwa mara tu baada ya maneno yanayohusika ili viashiria vyote vya [a], [b], na [c] vionekane katika matini kuu.
