  text: If we are faithless[a], he remains faithful[b], for he cannot deny himself.
translation:
  language: sw
  text: Kama sisi si waaminifu[a], yeye hubaki mwaminifu[b]; hawezi kujikana mwenyewe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kama sisi hatuamini” au “kama sisi hatuna imani.” Kitenzi cha Kigiriki kinaweza kumaanisha kutokuamini au kutokuwa waaminifu.
    reason: lexical_alternative
  - marker: b
    text: Au “wa kutegemewa.” Neno “mwaminifu” limetumiwa ili kudumisha utofautishaji na “si waaminifu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπιστοῦμεν
  choice: hatuna imani
  rationale: Kitenzi hiki kinaweza kumaanisha kutokuamini au kutokuwa mwaminifu. Kauli ‘hatuna imani’ ni ya kawaida katika Kiswahili, inadumisha uhusiano wa kimatamshi na ‘mwaminifu,’ na haiifungi maana katika upande mmoja tu.
- source_word: πιστὸς
  choice: mwaminifu
  rationale: ‘Mwaminifu’ huhifadhi utofautishaji wa moja kwa moja na ‘hatuna imani’ na inaweza pia kuonyesha kuwa yeye ni wa kutegemewa.
- source_word: μένει
  choice: hubaki
  rationale: ‘Hubaki’ ni ya asili na huonyesha hali yake ya kudumu bila kutumia lugha nzito isiyo ya kawaida.
- source_word: ἀρνήσασθαι
  choice: kujikataa
  rationale: Katika muundo wa Kiswahili, ‘kujikataa mwenyewe’ hutoa kwa uwazi maana ya kukana au kukataa nafsi yake mwenyewe.
- source_word: ἑαυτὸν
  choice: mwenyewe
  rationale: Neno hili la kujirejelea linaonyesha kwamba kutokubadilika kwa uaminifu wake kunategemea yeye alivyo mwenyewe.
- source_word: οὐ δύναται
  choice: hawezi
  rationale: ‘Hawezi’ ni tafsiri fupi, ya kawaida, na sahihi ya kutokuwa na uwezo, si kutotaka tu.
theological_decisions:
- issue: Maana ya uaminifu wa Mungu tunapokosa imani
  choice: Mstari unasema kwamba yeye hubaki mwaminifu kwa sababu hawezi kujikana mwenyewe, bila kufafanua ikiwa uaminifu huo hapa hasa ni wa kuokoa, kutimiza ahadi, au kutekeleza onyo la hukumu.
  alternative: Huenda ikafasiriwa kwamba yeye huendelea kuwaokoa watu wake licha ya udhaifu wao, au kwamba yeye ni mwaminifu kwa neno lake lote, pamoja na maonyo yake kuhusu uasi.
  rationale: Kigiriki kinathibitisha uthabiti wake lakini hakiamui wazi matokeo ya kichungaji au kitheolojia yanayobishaniwa; tafsiri inadumisha mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo mfupi wa kauli ya kishairi umehifadhiwa, pamoja na utata halisi wa ἀπιστοῦμεν na mvutano wa kitheolojia.
