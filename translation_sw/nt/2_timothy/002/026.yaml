  yaml_path: translation/nt/2_timothy/002/026.yaml
  text: and they may come to their senses out of the devil’s snare[b][a], having been captured alive by him for his will.
translation:
  language: sw
  text: na wapate kuwa na akili timamu tena, na kuponyoka kutoka katika mtego wa Ibilisi, wakiwa wamekamatwa wakiwa hai naye ili watimize mapenzi yake.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kitenzi cha Kigiriki kina maana mahususi ya “kukamata ukiwa hai,” ingawa pia kinaweza kutafsiriwa kwa ujumla zaidi kuwa “kuchukua mateka.”
    reason: lexical_alternative
  - marker: b
    text: Au, “wakiwa wamechukuliwa mateka naye ili watimize mapenzi ya yule.” Baadhi huelewa “yule” kuwa Mungu, si Ibilisi.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνανήψωσιν
  choice: wapate kurudiwa na fahamu
  rationale: Kitenzi hiki kihalisi huhusiana na kuzinduka au kuwa na akili timamu tena. Katika muktadha huu, msemo huu wa Kiswahili huwasilisha kurejea kwa utambuzi ulio wazi baada ya kudanganywa.
- source_word: παγίδος
  choice: mtego
  rationale: “Mtego” ni neno la kawaida na la asili katika Kiswahili kwa kifaa au hila ya kunasa, na linadumisha taswira ya kunaswa.
- source_word: διαβόλου
  choice: Ibilisi
  rationale: Hapa neno hili ni jina la adui binafsi, si maelezo ya jumla ya mchongezi.
- source_word: ἐζωγρημένοι
  choice: wakiwa wamekamatwa hai
  rationale: ζωγρέω ina maana mahususi ya kukamata mtu akiwa hai. Kauli ya kutendwa ya wakati timilifu inaonyesha hali inayotokana na kukamatwa huko.
- source_word: ὑπ’ αὐτοῦ
  choice: naye
  rationale: Kiwakilishi kwa kawaida humrejelea Ibilisi, ambaye ametajwa mara moja kabla yake; “naye” huepuka marudio yasiyo ya lazima.
- source_word: εἰς τὸ ἐκείνου θέλημα
  choice: kwa ajili ya mapenzi yake
  rationale: Tafsiri hii inadumisha muundo mfupi wa Kigiriki bila kuongeza wazi kitenzi “kufanya.” Kiwakilishi ἐκείνου kinaweza kueleweka kwa zaidi ya njia moja, kwa hiyo utata huo unaelezwa katika tanbihi.
theological_decisions:
- issue: Mrejelewa wa ἐκείνου katika εἰς τὸ ἐκείνου θέλημα
  choice: Kiwakilishi katika matini kuu kinaeleweka kumrejelea Ibilisi.
  alternative: Baadhi hulielewa kiwakilishi hicho kumrejelea Mungu, hivyo watu hao wangekuwa wamekamatwa na Ibilisi lakini wapate kufanya mapenzi ya Mungu.
  rationale: Ibilisi ndiye mrejelewa wa karibu zaidi kisarufi, na sentensi inaendelea kueleza hali ya kunaswa ambako wanahitaji kutoka. Hata hivyo, utambulisho wa mrejelewa umejadiliwa kwa muda mrefu, kwa hiyo uwezekano mwingine umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Taswira ya mtego na maana ya kukamatwa hai zimehifadhiwa, huku utata wa kiwakilishi cha mwisho ukibainishwa katika tanbihi.
