id: 2TI.2.8
reference: 2 Timothy 2:8
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Μνημόνευε Ἰησοῦν Χριστὸν ἐγηγερμένον ἐκ νεκρῶν, ἐκ σπέρματος Δαυίδ, κατὰ τὸ εὐαγγέλιόν μου·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/008.yaml
  text: Remember Jesus the Messiah[a], raised from the dead, descended from David[b], according to my gospel.
translation:
  language: sw
  text: Endelea kumkumbuka Yesu Masihi[a], aliyefufuliwa kutoka kwa wafu, aliyetokana na uzao wa Daudi[b], kulingana na injili yangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “Yesu Kristo.” Neno la Kigiriki Χριστός linaweza kutafsiriwa “Kristo” au “Masihi”; hapa “Masihi” limetumiwa ili kudumisha maana ya cheo hicho, hasa kwa kuwa Yesu anatajwa kuwa wa uzao wa Daudi.'
    reason: alternative_reading
  - marker: b
    text: 'Kihalisi: “kutoka katika mbegu ya Daudi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μνημόνευε
  choice: Endelea kumkumbuka
  rationale: Kauli ya kuamuru katika wakati uliopo inaelekeza Timotheo aendelee kumweka Yesu akilini; usemi huu ni wa kawaida na unaonyesha mwendelezo wa agizo.
- source_word: Ἰησοῦν Χριστόν
  choice: Yesu Masihi
  rationale: Χριστός hapa ni cheo kinachohusiana wazi na ufufuo na uzao wa Daudi. “Masihi” huwasilisha maana ya cheo hicho, huku “Kristo” ikitajwa katika tanbihi kama namna nyingine iliyozoeleka.
- source_word: ἐγηγερμένον
  choice: aliyefufuliwa
  rationale: 'Kitenzi hiki ni hali timilifu tendwa: Yesu alifufuliwa na anaendelea kuwa hai. “Aliyefufuliwa” huhifadhi maana ya kutendwa bila kulazimisha kumtaja mtendaji ambaye hakutajwa katika mstari.'
- source_word: ἐκ νεκρῶν
  choice: kutoka kwa wafu
  rationale: Huu ni usemi wa kawaida wa Kiswahili kuhusu ufufuo na unalingana na maana ya kutoka miongoni mwa waliokufa.
- source_word: ἐκ σπέρματος Δαυίδ
  choice: aliyetokana na uzao wa Daudi
  rationale: Katika muktadha wa nasaba, σπέρμα humaanisha uzao. Tafsiri hii ni ya asili katika Kiswahili na inadumisha msisitizo wa nasaba ya Daudi.
- source_word: κατὰ τὸ εὐαγγέλιόν μου
  choice: kulingana na injili yangu
  rationale: κατά ina maana ya “kulingana na,” na “injili yangu” huhifadhi moja kwa moja kiwakilishi cha Paulo bila kudokeza kwamba ni injili tofauti.
theological_decisions:
- issue: Tafsiri ya Χριστός
  choice: Masihi
  alternative: Kristo
  rationale: Muktadha wa uzao wa Daudi na ufufuo unaonyesha wazi matumizi ya Χριστός kama cheo. “Masihi” huweka maana hiyo wazi; tanbihi huhifadhi “Kristo” kama tafsiri mbadala iliyozoeleka.
- issue: Nguvu ya ἐγηγερμένον, hali timilifu tendwa
  choice: aliyefufuliwa
  alternative: aliyefufuka
  rationale: “Aliyefufuliwa” huhifadhi hali ya kutendwa iliyo katika Kigiriki na pia hali endelevu baada ya tendo la ufufuo; haitaji wazi mtendaji ambaye kifungu hakimtaji.
- issue: Maana ya “injili yangu”
  choice: injili yangu
  alternative: injili ninayoihubiri
  rationale: Kiwakilishi cha Kigiriki kinahifadhiwa bila ufafanuzi wa ziada. Maneno hayo yanaweza kueleweka kuwa injili aliyokabidhiwa na anayoihubiri Paulo, wala maandishi hayalazimishi wazo la injili tofauti.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Endelea kumkumbuka” ni agizo la moja kwa moja kwa mtu mmoja na huonyesha mwendelezo; “uzao wa Daudi” ni wa kawaida kuliko tafsiri halisi ya “mbegu.”
