  yaml_path: translation/nt/2_timothy/002/001.yaml
  text: You[a], then, my child, be strengthened in the grace that is in Messiah Jesus[b],
translation:
  language: sw
  text: Basi wewe, mwanangu, upate nguvu[a] katika neema iliyo katika Masihi Yesu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uwe na nguvu.”
