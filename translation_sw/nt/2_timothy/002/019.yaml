  text: ὁ μέντοι στερεὸς θεμέλιος τοῦ θεοῦ ἕστηκεν, ἔχων τὴν σφραγῖδα ταύτην· Ἔγνω κύριος τοὺς ὄντας αὐτοῦ, καί· Ἀποστήτω ἀπὸ ἀδικίας πᾶς ὁ ὀνομάζων τὸ ὄνομα κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/019.yaml
  text: 'Nevertheless[a], the firm foundation of God stands, having this seal: “The Lord knows those who are his,” and[b], “Let everyone who names the name of the Lord depart from unrighteousness.”'
translation:
  language: sw
  text: 'Hata hivyo, msingi imara wa Mungu umesimama, ukiwa na muhuri huu[a]: “Bwana anawajua walio wake,” na, “Kila anayelitaja jina la Bwana[b] na aache uovu.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ukiwa na maandishi haya.” Neno lililotafsiriwa “muhuri” linaweza kumaanisha alama ya utambulisho au maandishi yaliyo kwenye muhuri.
    reason: lexical_alternative
  - marker: b
    text: Au, “Kila anayeliitia jina la Bwana.” Kigiriki kinasema kihalisi “anayelitaja jina la Bwana,” nahau inayoweza kumaanisha kumwitia au kukiri uaminifu kwake.
    reason: lexical_alternative
lexical_decisions:
- source_word: μέντοι
  choice: Hata hivyo
  rationale: Inaonyesha utofautishaji wenye uzito dhidi ya mafundisho ya uongo yaliyotangulia.
- source_word: στερεὸς θεμέλιος
  choice: msingi imara
  rationale: Inahifadhi sitiari ya msingi na kusisitiza uthabiti wake kwa Kiswahili cha kawaida.
- source_word: τοῦ θεοῦ
  choice: wa Mungu
  rationale: Inahifadhi uhusiano wa kiima cha umilikaji bila kuamua kama ni umiliki, chanzo, au sifa.
- source_word: ἕστηκεν
  choice: umesimama
  rationale: Huwasilisha hali thabiti inayotokana na kitenzi cha wakati timilifu wa Kigiriki.
- source_word: ἔχων τὴν σφραγῖδα ταύτην
  choice: ukiwa na muhuri huu
  rationale: Inahifadhi taswira ya muhuri wa utambulisho au uthibitisho; maana ya maandishi yaliyo kwenye muhuri imeelezwa katika tanbihi.
- source_word: Ἔγνω
  choice: anawajua
  rationale: Ingawa umbo ni aoristi, katika nukuu hii lina maana ya kudumu; wakati wa sasa ni wa asili zaidi katika Kiswahili.
- source_word: κύριος
  choice: Bwana
  rationale: Inahifadhi uzito wa kimandiko wa κύριος bila kutaja wazi zaidi anayerejelewa.
- source_word: τοὺς ὄντας αὐτοῦ
  choice: walio wake
  rationale: Inaeleza kwa ufupi na kwa kawaida uhusiano wa kuwa mali yake.
- source_word: Ἀποστήτω
  choice: na aachane
  rationale: Huonyesha agizo la kujitenga kwa uamuzi na mwenendo usiofaa.
- source_word: ἀπὸ ἀδικίας
  choice: na udhalimu
  rationale: ‘Udhalimu’ linaweza kujumuisha uovu, kutotenda haki, na mwenendo usio wa haki, likidumisha upana wa ἀδικία.
- source_word: πᾶς ὁ ὀνομάζων τὸ ὄνομα κυρίου
  choice: Kila anayelitaja jina la Bwana
  rationale: Inahifadhi uradidi wa kimakusudi wa Kigiriki ‘kutaja jina,’ huku maana ya kuita au kukiri uaminifu ikitolewa katika tanbihi.
theological_decisions:
- issue: Anayerejelewa na “Bwana” katika kauli mbili za muhuri
  choice: Kutafsiri sehemu zote mbili kwa “Bwana” bila kubainisha kama ni Baba au Kristo.
  alternative: Kuzifafanua zote kuwa zinamhusu Mungu Baba, zote kuwa zinamhusu Kristo, au kutofautisha anayerejelewa katika kila kauli.
  rationale: Kigiriki kinatumia κύριος bila ufafanuzi wa moja kwa moja. Tafsiri inahifadhi uzito na uwezekano wa marejeo yenye tabaka mbalimbali katika nukuu ya Maandiko na matumizi yake ya Kikristo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo wa sentensi na sitiari kuu zimehifadhiwa, huku maneno yakibaki wazi kwa msomaji wa kawaida. Alama za tanbihi zimewekwa mara tu baada ya sehemu zinazohusika.
