  text: Ἐν μεγάλῃ δὲ οἰκίᾳ οὐκ ἔστιν μόνον σκεύη χρυσᾶ καὶ ἀργυρᾶ ἀλλὰ καὶ ξύλινα καὶ ὀστράκινα, καὶ ἃ μὲν εἰς τιμὴν ἃ δὲ εἰς ἀτιμίαν·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/020.yaml
  text: In a large house there are not only gold and silver vessels[a], but also wooden and earthenware ones, and some are for honor[b], but others for dishonor.
translation:
  language: sw
  text: Katika nyumba kubwa, si vyombo vya dhahabu na fedha tu vilivyomo, bali pia vyombo vya mbao na vya udongo wa mfinyanzi[a]; vingine ni kwa ajili ya heshima[b], lakini vingine ni kwa ajili ya fedheha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani vyombo vilivyotengenezwa kwa udongo wa mfinyanzi, yaani udongo uliochomwa.
    reason: cultural_note
  - marker: b
    text: Au “kwa matumizi ya heshima … kwa matumizi yasiyo ya heshima.” Kigiriki kinasema kwa maana ya moja kwa moja zaidi, “kwa heshima … kwa fedheha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μεγάλῃ οἰκίᾳ
  choice: nyumba kubwa
  rationale: Huwasilisha ukubwa wa nyumba kwa Kiswahili cha kawaida bila kuingiza wazo lisilo la lazima la ubora au fahari.
- source_word: σκεύη
  choice: vyombo
  rationale: Ni neno pana linalofaa kwa vitu vya nyumbani vilivyotengenezwa kwa vifaa mbalimbali na linadumisha uwezo wa picha hii kutumiwa kisitiari.
- source_word: χρυσᾶ καὶ ἀργυρᾶ
  choice: vya dhahabu na fedha
  rationale: Vivumishi vya Kigiriki vinaonyesha vitu vilivyotengenezwa kwa dhahabu na fedha; muundo huu ni wa kawaida na wazi katika Kiswahili.
- source_word: ξύλινα καὶ ὀστράκινα
  choice: vya mbao na vya udongo wa mfinyanzi
  rationale: ξύλινα ni vitu vya mbao, na ὀστράκινα ni vitu vilivyotengenezwa kwa udongo wa mfinyanzi, kwa kawaida udongo uliochomwa. Tafsiri hii ni sahihi na inaeleweka kwa urahisi.
- source_word: καὶ ἃ μὲν ... ἃ δὲ ...
  choice: vingine ... lakini vingine ...
  rationale: Muundo huu unadhihirisha wazi tofauti iliyomo katika jozi ya Kigiriki μέν...δέ.
- source_word: εἰς τιμήν
  choice: kwa ajili ya heshima
  rationale: Inadumisha nomino dhahania τιμή na mwelekeo unaoonyeshwa na εἰς, bila kuamua kimyakimya kwamba maana ni matumizi fulani tu.
- source_word: εἰς ἀτιμίαν
  choice: kwa ajili ya fedheha
  rationale: “Fedheha” ni kinyume chenye nguvu cha “heshima” na huhifadhi utofautishaji wa τιμή na ἀτιμία bila kuibadili kuwa “matumizi ya kawaida.”
- source_word: δὲ (initial)
  choice: imewakilishwa na mtiririko wa sentensi, bila neno tofauti
  rationale: δὲ hapa ni kiunganishi chepesi cha kuendeleza hoja. Kiswahili hakihitaji kuongeza “basi” au “lakini” mwanzoni, jambo ambalo lingeweza kuzidisha nguvu yake.
theological_decisions:
- issue: Ikiwa τιμή/ἀτιμία yatafafsiriwa kama aina za matumizi au kama heshima/fedheha
  choice: kwa ajili ya heshima ... kwa ajili ya fedheha
  alternative: kwa matumizi ya heshima ... kwa matumizi yasiyo ya heshima
  rationale: Maneno ya Kigiriki ni nomino dhahania “heshima” na “fedheha.” Kuyabakiza hivyo kunadumisha mvutano wa picha ya vyombo vya nyumbani na matumizi yake ya kitheolojia katika mstari unaofuata, badala ya kuifungia maana katika kazi za kawaida za nyumbani.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “si ... tu ... bali pia” unadumisha msisitizo wa οὐκ ... μόνον ... ἀλλὰ καί kwa njia ya kawaida. Alama za tanbihi zimewekwa karibu na maneno yanayofafanuliwa.
