  text: who have gone astray from the truth[a], saying that the resurrection has already happened[e][d][c][b], and are upsetting the faith of some.
translation:
  language: sw
  text: ambao wamepotoka kutoka kwenye kweli[a], wakisema kwamba ufufuo tayari umetokea[b], na wanapindua imani ya baadhi ya watu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wamekosa shabaha kuhusu kweli” au “wamekengeuka kutoka kwenye kweli.”
    reason: lexical_alternative
  - marker: b
    text: Yaani, walidai kwamba ufufuo uliokuwa unatarajiwa wakati ujao ulikuwa tayari umetokea.
    reason: cross_reference
  - marker: c
    text: Au, “wanabomoa” au “wanaharibu.” Neno la Kigiriki linaweza kumaanisha kupindua, kubomoa, au kuharibu.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: ambao
  rationale: Kiwakilishi hiki kinaendeleza sentensi ya uhusiano inayowarejelea walimu wa uongo waliotajwa kabla; “ambao” ni ya kawaida na sahihi katika Kiswahili.
- source_word: περὶ τὴν ἀλήθειαν ἠστόχησαν
  choice: wamepotoka kutoka kwenye kweli
  rationale: Kitenzi ἀστοχέω pamoja na kirai hiki humaanisha kukosa shabaha au kukengeuka kuhusiana na kweli. “Wamepotoka kutoka kwenye kweli” huwasilisha wazi kupotoka kwao bila kulazimisha sitiari ya shabaha.
- source_word: λέγοντες
  choice: wakisema
  rationale: Umbo la “wakisema” linahifadhi uhusiano wa kishiriki na kueleza yaliyodhihirisha kupotoka kwao bila kuamua kwa nguvu ikiwa ni njia au maudhui.
- source_word: ἀνάστασιν
  choice: ufufuo
  rationale: Ingawa nomino haina kibainishi katika Kigiriki, muktadha unaonyesha ufufuo unaojulikana unaotarajiwa; Kiswahili hakihitaji kibainishi mahsusi.
- source_word: ἤδη γεγονέναι
  choice: tayari umetokea
  rationale: Huwasilisha tendo lililokwisha kutimia lenye umuhimu wa sasa, kama linavyodokezwa na infinitivi timilifu.
- source_word: ἀνατρέπουσιν
  choice: wanapindua
  rationale: Kitenzi kina maana yenye nguvu ya kupindua au kubomoa. “Wanapindua” huhifadhi picha hiyo na hali ya tendo linaloendelea, badala ya kuipunguza kuwa kusumbua kihisia tu.
- source_word: τήν τινων πίστιν
  choice: imani ya baadhi ya watu
  rationale: “Imani” ni tafsiri ya kawaida ya πίστις hapa, na τινων hudokeza watu fulani wasiotajwa.
theological_decisions:
- issue: Maana ya dai kwamba ufufuo tayari umetokea
  choice: Dai limetafsiriwa moja kwa moja bila kufafanua mfumo wa mafundisho uliokuwa nyuma yake.
  alternative: Kulifafanua kuwa ufufuo wa kiroho pekee au kukana ufufuo wa mwili wa wakati ujao.
  rationale: Mstari unataja dai la walimu hao, lakini hauelezi kikamilifu jinsi walivyolielewa. Tafsiri inapaswa kuhifadhi ukomo huo.
- issue: Maana ya πίστις
  choice: imani
  alternative: tumaini au kumtumaini Mungu
  rationale: “Imani” ndiyo maana ya kawaida na isiyobana tafsiri katika muktadha huu; neno linaweza kuhusisha hali ya kumtumaini Mungu bila kulifafanua zaidi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa sentensi unahifadhi kiwakilishi kimoja cha uhusiano kinachotawala vitendo vyote viwili. “Kwenye kweli” ni ya kawaida na rahisi kueleweka; “wanapindua imani” huhifadhi nguvu ya ἀνατρέπουσιν.
