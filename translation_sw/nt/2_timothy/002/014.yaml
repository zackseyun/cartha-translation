  text: Ταῦτα ὑπομίμνῃσκε, διαμαρτυρόμενος ἐνώπιον τοῦ ⸀κυρίου, μὴ λογομαχεῖν, ⸀ἐπ’ οὐδὲν χρήσιμον, ἐπὶ καταστροφῇ τῶν ἀκουόντων.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/014.yaml
  text: Keep reminding them of these things[a], solemnly charging them before the Lord not to quarrel about words[b], which is useful for nothing and leads to the ruin of those who hear.
translation:
  language: sw
  text: Endelea kuwakumbusha mambo haya, ukiwaagiza kwa dhati mbele za Bwana[a] wasibishane juu ya maneno; mabishano hayo hayana faida yoyote, bali huleta uharibifu kwa wale wanaosikiliza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno “Bwana” hapa linaweza kumaanisha Bwana Yesu hasa, au Mungu kwa maana pana; Kigiriki hakimtaji wazi zaidi.
    reason: alternative_reading
lexical_decisions:
- source_word: Ταῦτα
  choice: mambo haya
  rationale: Kiwakilishi hiki cha wingi kinarejelea mafundisho yaliyotangulia; “mambo haya” ni Kiswahili cha kawaida na huhifadhi uhusiano huo.
- source_word: ὑπομίμνῃσκε
  choice: Endelea kuwakumbusha
  rationale: Amri ya wakati wa sasa inaonyesha tendo la kuendelea au kurudiwa. “Endelea kuwakumbusha” huwasilisha maana hiyo kwa uwazi; kiambishi “-wa-” kimetolewa kutokana na muktadha.
- source_word: διαμαρτυρόμενος
  choice: ukiwaagiza kwa uzito
  rationale: Kitenzi hiki huonyesha agizo au onyo lenye msisitizo mkubwa. “Kwa uzito” huhifadhi uzito wa kiapo/agizo bila kutumia lugha ngumu isiyo ya kawaida.
- source_word: ἐνώπιον τοῦ κυρίου
  choice: mbele za Bwana
  rationale: Ni nahau ya kutenda chini ya ushahidi wa kimungu. “Mbele za Bwana” ni ya asili na haiamui kimya kimya ikiwa Bwana hapa ni Yesu hasa au Mungu kwa maana pana.
- source_word: μὴ λογομαχεῖν
  choice: wasibishane kuhusu maneno
  rationale: Neno hili linamaanisha kugombana au kubishana juu ya maneno. Tafsiri hii ni ya kawaida na huhifadhi maana yake hasi.
- source_word: ἐπ’ οὐδὲν χρήσιμον
  choice: Jambo hilo halina faida yoyote
  rationale: Kirai hiki huonyesha kutokuwapo kabisa kwa manufaa. Sentensi tofauti hufanya uhusiano wake na kubishana kuhusu maneno uwe wazi katika Kiswahili.
- source_word: ἐπὶ καταστροφῇ
  choice: bali huleta uharibifu
  rationale: Kirai kinaonyesha matokeo mabaya sana—kuanguka au kuharibiwa. “Huleta uharibifu” huhifadhi ukali wake bila kulazimisha wazo la maangamizi ya kimwili.
- source_word: τῶν ἀκουόντων
  choice: kwa wale wanaosikiliza
  rationale: Kivumishi-partisipio cha wakati wa sasa kinatumika kama nomino. “Wale wanaosikiliza” ni Kiswahili cha asili na huonyesha watu wanaoyasikia mabishano hayo.
theological_decisions:
- issue: Anayerejelewa na κύριος
  choice: Bwana
  alternative: Mungu; Bwana Yesu
  rationale: Kigiriki kinasema tu “Bwana” bila kumtaja wazi zaidi. Tafsiri imehifadhi cheo hicho na utata wake halisi badala ya kuamua kwamba ni Yesu hasa au Mungu kwa maana pana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wazi kwa msomaji wa kawaida, huku uzito wa agizo na ukali wa matokeo ya mabishano ya maneno vikihifadhiwa.
