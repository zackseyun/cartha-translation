id: 2TI.2.21
reference: 2 Timothy 2:21
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐὰν οὖν τις ἐκκαθάρῃ ἑαυτὸν ἀπὸ τούτων, ἔσται σκεῦος εἰς τιμήν, ἡγιασμένον, ⸀εὔχρηστον τῷ δεσπότῃ, εἰς πᾶν ἔργον ἀγαθὸν ἡτοιμασμένον.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/021.yaml
  text: Therefore[a], if anyone cleanses himself from these things, he will be a vessel for honor, sanctified, useful to the Master[b], prepared for every good work.
translation:
  language: sw
  text: Kwa hiyo, mtu yeyote akijitakasa kutokana na mambo hayo, atakuwa chombo cha heshima[a], kilichotakaswa[b], kinachomfaa Bwana, na kilichoandaliwa kwa kila kazi njema.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa matumizi ya heshima.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kilichofanywa kitakatifu” au “kilichowekwa wakfu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: Kwa hiyo, ... aki-
  rationale: “Kwa hiyo” hudumisha hitimisho linalotokana na muktadha uliotangulia, huku muundo wa masharti wa “aki-” ukitoa maana ya ἐὰν kwa Kiswahili cha kawaida.
- source_word: τις
  choice: mtu yeyote
  rationale: Kiwakilishi hiki hakimtaji mtu maalumu; “mtu yeyote” hudumisha maana yake ya jumla bila kuweka jinsia isiyodaiwa na muktadha.
- source_word: ἐκκαθάρῃ ἑαυτὸν
  choice: akijitakasa
  rationale: Kitenzi cha kujirejelea hudumisha kwamba mtu anajitakasa mwenyewe. “Kujitakasa” pia kinafaa katika taswira ya vyombo na muktadha wa kiroho.
- source_word: ἀπὸ τούτων
  choice: na mambo hayo
  rationale: Katika muundo wa Kiswahili, “kujitakasa na” humaanisha kujiondolea au kujitenga na uchafu unaotajwa. “Mambo hayo” hurejelea yaliyotangulia bila kuamua kimyakimya kama yanamaanisha watu, mafundisho, au mwenendo pekee.
- source_word: σκεῦος
  choice: chombo
  rationale: “Chombo” hudumisha taswira ya vyombo katika nyumba kutoka mstari uliotangulia na ni neno la kawaida, pana, na linaloeleweka.
- source_word: εἰς τιμήν
  choice: cha heshima
  rationale: Tafsiri hii hudumisha kwa ufupi tofauti kati ya τιμή na ἀτιμία katika taswira ya vyombo, bila kuongeza wazi wazo la matumizi ambalo limedokezwa tu.
- source_word: ἡγιασμένον
  choice: kilichotakaswa
  rationale: Umbo hili hudumisha hali iliyotokana na tendo la kutakasa na lina uzito wa kiroho unaofaa kwa ἁγιάζω.
- source_word: εὔχρηστον τῷ δεσπότῃ
  choice: kinachomfaa Bwana
  rationale: “Kinachomfaa” hutoa maana ya kuwa chenye manufaa au kufaa kutumiwa. “Bwana” hudumisha mamlaka ya δεσπότης na pia uwezekano wa rejeo la kimungu katika taswira ya mwenye nyumba.
- source_word: εἰς πᾶν ἔργον ἀγαθὸν ἡτοιμασμένον
  choice: kilichoandaliwa kwa kila kazi njema
  rationale: “Kilichoandaliwa” hudumisha hali ya kuwa tayari iliyotokana na maandalizi, na “kila kazi njema” huwasilisha upana wa πᾶν ἔργον ἀγαθόν.
theological_decisions:
- issue: Rejeo la jumla la τις pamoja na ἑαυτόν
  choice: mtu yeyote akijitakasa ... atakuwa
  alternative: mtu akijisafisha mwenyewe ... huwa
  rationale: Kiswahili hakihitaji kiwakilishi cha jinsia katika muundo huu. Tafsiri hudumisha umoja na hali ya kujirejelea bila kuingiza jinsia ambayo si lazima katika lugha lengwa.
- issue: Maana ya ἡγιασμένον
  choice: kilichotakaswa
  alternative: kilichowekwa wakfu
  rationale: “Kilichotakaswa” hudumisha uhusiano wa neno hili na utakatifu, lakini hakifungi maana kwenye kuwekwa rasmi wakfu pekee. Uwezekano wa maana ya kutengwa kwa kusudi takatifu umewekwa katika tanbihi.
- issue: Utambulisho wa δεσπότης katika taswira ya nyumba
  choice: Bwana
  alternative: mwenye nyumba
  rationale: “Bwana” hudumisha mamlaka ya mkuu au mwenye chombo na kuruhusu rejeo la kimungu linaloeleweka katika muktadha, bila kuondoa taswira ya kaya kwa maelezo ya ziada.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo wa sentensi hudumisha taswira moja ya chombo na upatanisho wa kisarufi wa ngeli ya KI-VI. Herufi kubwa katika “Bwana” inaonyesha rejeo linalowezekana la kimungu bila kubadili neno kuwa jina maalumu lisilokuwa wazi katika Kigiriki.
