    issue: The phrase “akijitakasa na mambo hayo” is ambiguous in Swahili.
    rationale: The Greek ἐκκαθάρῃ ἑαυτὸν ἀπὸ τούτων explicitly expresses cleansing oneself away/from these things. Adding “kutokana na” supplies this directional/separative sense naturally without deciding what “these things” specifically denotes.
