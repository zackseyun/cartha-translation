translation:
  language: sw
  text: Mkulima anayefanya kazi kwa bidii lazima awe wa kwanza kupata sehemu ya mazao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mkulima anayefanya kazi kwa bidii lazima awe wa kwanza kushiriki katika mazao.” Kigiriki hutumia kitenzi chenye maana ya kushiriki au kupata sehemu.
    reason: lexical_alternative
lexical_decisions:
- source_word: κοπιῶντα
  choice: anayefanya kazi kwa bidii
  rationale: Kitenzi hiki huonyesha kufanya kazi kwa juhudi kubwa au kuchoka kwa kazi; usemi huu ni wa kawaida na unasisitiza bidii ya mkulima.
- source_word: γεωργὸν
  choice: mkulima
  rationale: Neno hili humaanisha mtu anayelima au kufanya kazi ya shambani; “mkulima” ni sawa la wazi na la kawaida katika Kiswahili.
- source_word: δεῖ
  choice: anayepaswa
  rationale: Huhifadhi maana ya ulazima au wajibu kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: πρῶτον
  choice: wa kwanza
  rationale: Katika muundo huu linaonyesha kipaumbele cha mkulima katika kupata sehemu ya mazao, badala ya kusema tu kwamba lazima aanze kwa kufanya kazi.
- source_word: τῶν καρπῶν
  choice: ya mazao
  rationale: Katika muktadha wa kilimo, “mazao” huwasilisha kwa upana matokeo ya shamba kuliko “matunda” pekee.
- source_word: μεταλαμβάνειν
  choice: kupata sehemu
  rationale: Kitenzi kina maana ya kushiriki au kupata sehemu ya kitu; tafsiri hii huonyesha wazi maana inayodokezwa na hali ya umilikishi ya τῶν καρπῶν.
theological_decisions:
- issue: Maana ya kauli yenye mfano wa kilimo
  choice: Anayefanya kazi ndiye anayepaswa kupewa kipaumbele cha kushiriki matokeo ya kazi hiyo.
  alternative: Mkulima lazima kwanza afanye kazi ndipo ale mazao.
  rationale: Mpangilio na sintaksia ya Kigiriki huunganisha πρῶτον kwa kawaida zaidi na kupata sehemu ya mazao. Hata hivyo, tanbihi inahifadhi uwezekano wa kuelewa “kwanza” kuwa inahusu kufanya kazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, ya kawaida na yenye hadhi. “Kupata sehemu ya mazao” ni wazi kwa wasomaji wa kawaida, huku tanbihi ikihifadhi tafsiri rasmi zaidi ya “kushiriki” na uwezekano wa kisintaksia.
