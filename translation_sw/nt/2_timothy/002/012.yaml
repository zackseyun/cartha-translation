  text: εἰ ὑπομένομεν, καὶ συμβασιλεύσομεν· εἰ ⸀ἀρνησόμεθα, κἀκεῖνος ἀρνήσεται ἡμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/012.yaml
  text: If we endure[a], we will also reign with him; if we deny him, he also will deny us.
translation:
  language: sw
  text: Tukivumilia, tutatawala pamoja naye; tukimkana[a], yeye pia atatukana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “tukimkataa, yeye pia atatukataa.”
    reason: Mbadala huu unaonyesha wigo wa ἀρνέομαι, ambalo linaweza kumaanisha kumkana, kumkataa, au kukataa kuwa na uhusiano naye.
lexical_decisions:
- source_word: ὑπομένομεν
  choice: tukivumilia
  rationale: Kitenzi “kuvumilia” kinaeleza kudumu imara chini ya majaribu au mateso, huku kikihifadhi muundo wa sharti wa Kigiriki kwa lugha ya kawaida na yenye hadhi.
- source_word: συμβασιλεύσομεν
  choice: tutatawala pamoja naye
  rationale: Kitenzi hiki cha Kigiriki humaanisha kutawala pamoja na mwingine. “Tutatawala pamoja naye” ni usemi wa asili wa Kiswahili unaohifadhi picha ya kifalme na unaweka wazi kwamba ni pamoja na Kristo, kama muktadha unavyoonyesha.
- source_word: ἀρνησόμεθα
  choice: tukimkana
  rationale: “Kumkana” huweza kumaanisha kukataa kumtambua au kutokuwa mwaminifu kwake. Kimilikishi cha yambwa kinamtaja anayerejelewa na muktadha bila kuongeza maelezo yasiyokuwamo katika Kigiriki.
- source_word: κἀκεῖνος
  choice: yeye pia
  rationale: Crasis καὶ ἐκεῖνος inaonyesha ulinganifu wa tendo la pili na la kwanza. “Yeye pia” ni ya kawaida na inahifadhi uzito wa mwitikio huo.
- source_word: ἀρνήσεται ἡμᾶς
  choice: atatukana
  rationale: Kurudia mzizi uleule wa “kana” kunahifadhi marudio ya makusudi ya ἀρνέομαι na nguvu ya onyo katika mistari miwili inayolingana.
theological_decisions:
- issue: Asili ya onyo katika kishazi cha pili cha sharti
  choice: 'Kauli imetafsiriwa moja kwa moja kuwa onyo halisi: “tukimkana, yeye pia atatukana.”'
  alternative: Kulieleza kama kupoteza thawabu tu, au kama sharti la kinadharia lisilo na uwezekano halisi.
  rationale: Kigiriki kinatoa sharti lenye uwiano na onyo zito. Tafsiri haifafanui ikiwa matokeo yanahusu hukumu ya mwisho, kupoteza thawabu, au mjadala wa kitheolojia kuhusu uasi; inaacha mvutano huo kama ulivyo katika maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo mfupi na wenye ulinganifu umehifadhiwa ili kuonyesha mtindo wa kauli ya kukumbukwa. “Yeye” imewekwa wazi kwa ajili ya msisitizo wa ulinganifu, ingawa kiwakilishi tayari kimo ndani ya kitenzi.
