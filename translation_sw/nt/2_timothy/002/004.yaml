  text: οὐδεὶς στρατευόμενος ἐμπλέκεται ταῖς τοῦ βίου πραγματείαις, ἵνα τῷ στρατολογήσαντι ἀρέσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/004.yaml
  text: No one serving as a soldier gets entangled in the affairs of ordinary life[a], so that he may please the one who enlisted him.
translation:
  language: sw
  text: Hakuna mtu anayehudumu kama askari hujifunga katika shughuli za maisha ya kawaida[a], ili ampendeze yule aliyemwandikisha jeshini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “shughuli za kiraia.” Kigiriki kinatofautisha utumishi wa kijeshi na shughuli za kawaida za maisha.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς
  choice: Hakuna mtu
  rationale: Huhifadhi maana ya jumla ya kiwakilishi hasi, yaani ‘hakuna yeyote,’ kwa Kiswahili cha kawaida.
- source_word: στρατευόμενος
  choice: anayetumikia kama askari
  rationale: Huonyesha hali inayoendelea ya kuwa katika utumishi wa kijeshi na hudumisha sitiari ya kijeshi bila lugha ya kizamani.
- source_word: ἐμπλέκεται
  choice: anayejitia
  rationale: Huwasilisha wazo la kuingia au kujihusisha katika mambo yanayoweza kumzuia kutekeleza wajibu wake; katika muktadha huu lina maana ya kunaswa na shughuli hizo.
- source_word: ταῖς τοῦ βίου πραγματείαις
  choice: katika shughuli za maisha ya kawaida
  rationale: πραγματείαις inaweza kumaanisha shughuli, kazi, au mambo ya kibiashara, na βίος hapa yahusu maisha ya kila siku. Tafsiri hii hudumisha utofauti na utumishi wa kijeshi bila kuibana maana kuwa biashara pekee.
- source_word: ἵνα
  choice: ili
  rationale: Kiunganishi cha kusudi kinachowasilisha kwa kawaida lengo la kutokujitia katika shughuli hizo.
- source_word: τῷ στρατολογήσαντι
  choice: yule aliyemwandikisha jeshini
  rationale: Hufuata kitenzi cha kuandikisha au kuajiri mtu kuwa askari bila kuongeza cheo maalumu cha kijeshi kisichotajwa katika Kigiriki.
- source_word: ἀρέσῃ
  choice: ampendeze
  rationale: 'Huhifadhi kusudi lililoonyeshwa na hali tegemezi baada ya ἵνα: askari analenga kupata kibali cha aliyemwandikisha.'
theological_decisions:
- issue: Upeo wa sitiari ya kijeshi
  choice: Taswira imeachwa kuwa ya askari anayekataa kunaswa na shughuli za maisha ya kawaida ili ampendeze aliyemwandikisha.
  alternative: Kuitafsiri moja kwa moja kuwa agizo kuhusu vipaumbele vya huduma, au kubainisha zaidi kuwa ni ‘shughuli za kiraia.’
  rationale: Kigiriki kinatoa sitiari ya kijeshi lakini hakielezi matumizi yake yote ndani ya mstari huu. Tafsiri inadumisha taswira na mvutano huo badala ya kuingiza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Anayetumikia kama askari’ na ‘aliyemwandikisha jeshini’ ni wazi kwa wasomaji wa kawaida; tanbihi huhifadhi uwezekano wa tafsiri yenye mkazo wa maisha ya kiraia.
