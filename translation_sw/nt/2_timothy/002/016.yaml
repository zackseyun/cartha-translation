  text: τὰς δὲ βεβήλους κενοφωνίας περιΐστασο· ἐπὶ πλεῖον γὰρ προκόψουσιν ἀσεβείας,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/016.yaml
  text: But avoid profane empty talk[a], for they will advance further into ungodliness,
translation:
  language: sw
  text: Lakini jiepushe na maneno matupu yasiyomheshimu Mungu[a], kwa maana wataendelea zaidi katika kutomcha Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “porojo zisizo na uchaji,” “maneno yasiyo na maana,” au “usemi mtupu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: βεβήλους
  choice: yasiyomheshimu Mungu
  rationale: Neno hili linaonyesha kitu kisicho kitakatifu au kisicho na heshima kwa mambo ya Mungu. Kauli hii ya Kiswahili cha kawaida inahifadhi uzito wake wa kidini na kimaadili.
- source_word: κενοφωνίας
  choice: maneno matupu
  rationale: Hii ni usemi usio na maana au thamani ya kweli. “Maneno matupu” ni ya asili katika Kiswahili na huhifadhi wazo la usemi wenye sauti lakini usio na uzito.
- source_word: περιΐστασο
  choice: jiepushe na
  rationale: Amri ya kati inamtaka Timotheo akae mbali na usemi huo au aukwepe; “jiepushe na” ni ya kawaida, wazi, na yenye nguvu inayofaa.
- source_word: ἐπὶ πλεῖον
  choice: watazidi kuingia
  rationale: Kirai hiki kinaonyesha mwendo unaoongezeka kuelekea hali fulani. “Watazidi kuingia” kinaeleza maendeleo hayo kwa Kiswahili cha kawaida.
- source_word: προκόψουσιν
  choice: watazidi kuingia
  rationale: Kitenzi kina maana ya kusonga mbele au kufanya maendeleo; hapa maendeleo hayo ni katika mwelekeo mbaya wa kimaadili.
- source_word: ἀσεβείας
  choice: kutomcha Mungu
  rationale: Hili linaonyesha ukosefu wa uchaji au heshima kwa Mungu. “Kutomcha Mungu” ni wazi kwa wasomaji wa kawaida na huhifadhi maana ya kidini na kimaadili.
- source_word: δὲ
  choice: Lakini
  rationale: Kiunganishi kinaonyesha tofauti na himizo lililotangulia; “Lakini” huonyesha ugeukaji huo wazi.
theological_decisions:
- issue: Ikiwa onyo linahusu usemi usiofaa tu au usemi wenye upotovu wa kidini na kimaadili
  choice: “maneno matupu yasiyomheshimu Mungu” huhifadhi pamoja utupu wa usemi huo na tabia yake ya kutokuwa na heshima kwa Mungu.
  alternative: “porojo zisizo na maana”
  rationale: βεβήλους na ἀσεβείας zinaonyesha kwamba si mazungumzo yasiyofaa tu, bali usemi unaohusiana na kukosa uchaji kwa Mungu.
- issue: Mtendaji asiyeelezwa wazi wa προκόψουσιν
  choice: “wanaoyasema”
  alternative: Kuyafanya “maneno matupu” yenyewe kuwa ndiyo yanayoendelea
  rationale: Kitenzi cha Kigiriki ni cha wingi bila nomino ya wazi kama kiima. Muktadha unaruhusu kueleweka kuwa ni watu wanaojihusisha na maneno hayo; tafsiri inaweka rejeo hilo wazi kwa Kiswahili bila kubadili mwelekeo wa onyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Jiepushe” na “kutomcha Mungu” ni maneno yanayoeleweka kwa wasomaji wa kawaida bila kuwa ya kale kupita kiasi.
