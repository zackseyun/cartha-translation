- from: Lakini jiepushe na maneno matupu yasiyomheshimu Mungu[a], kwa maana wanaoyasema watazidi kuingia katika kutomcha Mungu.
  to: Lakini jiepushe na maneno matupu yasiyomheshimu Mungu[a], kwa maana wataendelea zaidi katika kutomcha Mungu.
  rationale: The revision removes the interpretive phrase “wanaoyasema” so that the unexpressed plural subject remains unexpressed, as in Greek. It also uses “wataendelea zaidi katika” to convey continued advance to a greater extent in ungodliness. All other wording is retained because it is faithful, natural, and suitably weighted in religious-moral register.
