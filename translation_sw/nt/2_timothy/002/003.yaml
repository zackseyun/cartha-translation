  yaml_path: translation/nt/2_timothy/002/003.yaml
  text: Share in suffering as a good soldier of Messiah Jesus[a][b].
translation:
  language: sw
  text: Shiriki katika mateso kama askari mwema wa Masihi Yesu.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Vumilia taabu pamoja nami kama askari mwema wa Masihi Yesu.”
    reason: lexical_alternative
  - marker: b
    text: 'Kigiriki: “Kristo Yesu”; hapa Χριστός limetafsiriwa “Masihi” kwa sababu linatumika kama cheo.'
    reason: alternative_reading
lexical_decisions:
- source_word: συγκακοπάθησον
  choice: Shiriki katika mateso
  rationale: Kitenzi hiki ni amri ya nafsi ya pili umoja; kiambishi συν- kinaonyesha kushiriki taabu au mateso pamoja na wengine. Tafsiri hii huhifadhi maana hiyo bila kuongeza waziwazi “pamoja nami,” ambayo haipo kama maneno tofauti katika mstari huu.
- source_word: ὡς
  choice: kama
  rationale: Hutoa ulinganisho unaoeleza jinsi Timotheo anavyopaswa kushiriki katika mateso.
- source_word: καλὸς
  choice: mwema
  rationale: Katika muunganiko huu humaanisha askari mwenye sifa njema, anayefaa na wa kupongezwa; “mwema” ni ya kawaida na yenye hadhi katika Kiswahili.
- source_word: στρατιώτης
  choice: askari
  rationale: Ni neno la kawaida la Kiswahili kwa mwanajeshi na linafaa katika sitiari hii.
- source_word: Χριστοῦ
  choice: Masihi
  rationale: Χριστός hapa ni cheo, kwa hiyo maana ya cheo hicho imetafsiriwa badala ya kunukuliwa tu kama jina.
- source_word: Ἰησοῦ
  choice: Yesu
  rationale: Hili ndilo umbo la kawaida la jina Ἰησοῦς katika Kiswahili.
theological_decisions:
- issue: Jinsi ya kutafsiri Χριστοῦ Ἰησοῦ
  choice: Masihi Yesu
  alternative: Kristo Yesu
  rationale: Muundo huu una cheo Χριστός pamoja na jina Yesu. “Masihi Yesu” hudumisha maana ya cheo bila kukifanya kiwe jina tu.
- issue: Mshiriki asiyeelezwa wazi katika συγκακοπάθησον
  choice: Shiriki katika mateso
  alternative: Vumilia taabu pamoja nami
  rationale: Kiambishi συν- kinaonyesha ushirika katika taabu, lakini mstari wenyewe hautaji wazi “nami.” Matini kuu huhifadhi hali hiyo, na tanbihi inatoa uwezekano unaoeleweka kutokana na muktadha.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Shiriki katika mateso” ni wazi kwa msomaji wa kawaida na huhifadhi wazo la kushiriki kwa pamoja; “askari mwema” ni muunganiko wa asili katika Kiswahili.
