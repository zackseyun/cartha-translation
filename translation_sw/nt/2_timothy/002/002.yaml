  naturalness: “Na yale uliyoyasikia ... uyakabidhi kwa watu waaminifu” is idiomatic Standard East African Swahili and clearly connects the received teaching with the command. The revised first footnote also smooths an awkward phrase in the current note.
  terminology: '“Watu waaminifu” appropriately renders πιστοῖς ἀνθρώποις in Swahili: ἄνθρωποι can be generic human beings, while the note preserves the masculine grammatical form and the possible rendering “wanaume waaminifu.” “Uwezo wa kuwafundisha” naturally conveys ἱκανοὶ ... διδάξαι without adding institutional qualifications.'
