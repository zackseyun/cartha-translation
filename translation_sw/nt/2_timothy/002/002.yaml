source:
  edition: SBLGNT
  text: καὶ ἃ ἤκουσας παρ’ ἐμοῦ διὰ πολλῶν μαρτύρων, ταῦτα παράθου πιστοῖς ἀνθρώποις, οἵτινες ἱκανοὶ ἔσονται καὶ ἑτέρους διδάξαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/002.yaml
  text: And what you heard from me in the presence of many witnesses[a], entrust these things to faithful men[b], who will be competent to teach others also.
translation:
  language: sw
  text: Na yale uliyoyasikia kutoka kwangu mbele ya mashahidi wengi[a], uyakabidhi kwa watu waaminifu[b], ambao watakuwa na uwezo wa kuwafundisha wengine pia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mashahidi wengi wakiwapo.” Maneno ya Kigiriki yanaweza kusisitiza kwamba mafundisho ya Paulo yalitolewa hadharani, mashahidi wengi wakiwapo; maana nyingine inayowezekana, ingawa si yenye uwezekano mkubwa, ni “kupitia mashahidi wengi.”
    reason: lexical_alternative
  - marker: b
    text: Kigiriki, “watu waaminifu.” Neno “watu” linaweza kuwahusu wanadamu kwa ujumla, ingawa umbo la kisarufi la Kigiriki hapa ni la kiume; tafsiri mbadala ni “wanaume waaminifu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἃ
  choice: mambo uliyoyasikia
  rationale: Kiwakilishi cha uhusiano cha wingi wa kati kinarejelea maudhui ambayo Timotheo aliyasikia; “mambo uliyoyasikia” ni Kiswahili cha kawaida na huonyesha wazi kitu kinachorejelewa.
- source_word: ἤκουσας
  choice: uliyoyasikia
  rationale: Wakati uliopita wa Kigiriki unaelekeza kwenye mafundisho ambayo Timotheo alipokea hapo awali.
- source_word: παρ’ ἐμοῦ
  choice: kutoka kwangu
  rationale: 'Pamoja na kitenzi cha kusikia, παρά na hali ya genitivi huonyesha chanzo: Timotheo aliyasikia kutoka kwa Paulo.'
- source_word: διὰ πολλῶν μαρτύρων
  choice: mbele ya mashahidi wengi
  rationale: διά na genitivi hapa yaelekea kuonyesha mazingira ya hadharani ambamo mashahidi wengi walikuwapo; tafsiri hii pia ni ya asili katika Kiswahili.
- source_word: ταῦτα
  choice: mambo hayo
  rationale: Huendeleza nguvu ya kiashirio na kuunganisha agizo na maudhui yaliyotajwa katika kishazi kilichotangulia.
- source_word: παράθου
  choice: wakabidhi
  rationale: Agizo hili lina maana ya kuweka jambo chini ya uangalizi wa mwingine; “wakabidhi” huhifadhi dhana ya dhamana na wajibu.
- source_word: πιστοῖς
  choice: waaminifu
  rationale: πιστός inaweza kumaanisha waaminifu au wanaotegemeka; hapa sifa ya kutegemeka katika kupitisha mafundisho ndiyo iliyo mbele, huku neno likibaki na upana wake wa maana.
- source_word: ἀνθρώποις
  choice: watu
  rationale: ἄνθρωπος mara nyingi humaanisha binadamu au mtu kwa ujumla. Kiswahili “watu” huhifadhi maana hiyo bila kuingiza jinsia ambayo nomino yenyewe hailazimishi, ingawa umbo la Kigiriki hapa ni la kisarufi la kiume.
- source_word: οἵτινες
  choice: ambao
  rationale: Kiwakilishi hiki kinaanzisha sifa ya aina ya watu wanaokusudiwa; “ambao” ni ya kawaida, na sifa hiyo inaelezwa na kishazi kinachofuata.
- source_word: ἱκανοὶ ἔσονται
  choice: wataweza
  rationale: Muundo unaonyesha uwezo au ustahili watakaokuwa nao. “Wataweza” ni wa kawaida na huhifadhi wakati ujao bila kuongeza wazo rasmi la kuthibitishwa kuwa na sifa.
- source_word: ἑτέρους
  choice: wengine
  rationale: Ni kiwakilishi cha moja kwa moja kwa watu wengine watakaofundishwa.
theological_decisions:
- issue: Upeo wa kijinsia wa πιστοῖς ἀνθρώποις
  choice: watu waaminifu
  alternative: wanaume waaminifu
  rationale: Nomino ἄνθρωπος kwa msingi humaanisha mtu/binadamu na inaweza kutumiwa kwa uwakilishi, ingawa vivumishi na viwakilishi vya kifungu hiki vina umbo la kisarufi la kiume. “Watu waaminifu” huhifadhi maana ya kileksika bila kuamua kimya kimya kwamba kifungu kinawahusu wanaume pekee; tanbihi inaonyesha umbo na tafsiri mbadala.
- issue: Maana ya διὰ πολλῶν μαρτύρων
  choice: mbele ya mashahidi wengi
  alternative: kupitia mashahidi wengi
  rationale: Muktadha unaunga mkono zaidi mafundisho yaliyotolewa hadharani mashahidi wakiwa mbele kuliko wazo kwamba mashahidi ndio waliopitisha mafundisho kutoka kwa Paulo. Hata hivyo, uwezekano wa kisarufi wa maana ya upatanishi umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Wakabidhi” huonyesha dhamana ya mafundisho, na “wataweza” ni ya asili zaidi kuliko istilahi nzito kama “watakuwa na ujuzi wa kutosha.”
