  text: And if anyone also competes as an athlete[a], he is not crowned unless he competes according to the rules.
translation:
  language: sw
  text: Tena, mtu akishindana katika mashindano ya riadha, hapewi taji isipokuwa ashindane kwa kufuata kanuni.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa njia halali.” Kielezi cha Kigiriki kinaweza kumaanisha kutenda kwa njia inayopatana na sheria; hapa huenda kinarejelea kufuata kanuni za mashindano.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀθλῇ / ἀθλήσῃ
  choice: akishindana katika mashindano ya riadha / ameshindana
  rationale: Maneno haya yanadumisha mfano wa mashindano ya riadha badala ya kuugeuza kuwa juhudi za kawaida, huku kurudiwa kwa mzizi uleule wa Kigiriki kukionekana katika Kiswahili.
- source_word: τις
  choice: mtu
  rationale: Kiwakilishi hiki hakimtaji mtu maalumu; “mtu” ni usemi wa kawaida wa Kiswahili wenye maana ya yeyote katika hali hii.
- source_word: στεφανοῦται
  choice: havikwi taji
  rationale: Kauli tendwa inadumishwa, na “kuvikwa taji” huonyesha wazi heshima ya mshindi bila kufafanua taji kuwa thawabu fulani ya kiroho.
- source_word: νομίμως
  choice: kwa kufuata kanuni
  rationale: Katika muktadha wa mashindano, usemi huu unaeleza kushindana kwa namna inayokubalika kisheria au kwa mujibu wa kanuni; tafsiri hii ni wazi na ya kawaida kwa msomaji wa leo.
- source_word: καὶ
  choice: Tena
  rationale: Hapa καὶ inaendeleza mfululizo wa mifano; “Tena” huunganisha mfano huu na uliotangulia kwa Kiswahili cha asili.
- source_word: δὲ
  choice: Tena
  rationale: δέ ni kiunganishi cha mpito usio mkali. Pamoja na καὶ, kimetolewa kwa “Tena,” ambacho kinaendeleza hoja bila kuashiria upinzani mkubwa.
theological_decisions:
- issue: Maana ya mfano wa taji
  choice: Kudumisha picha ya mwanariadha anayevikwa taji bila kulitaja kuwa thawabu maalumu ya kiroho.
  alternative: Kulieleza taji moja kwa moja kuwa thawabu ya mwisho au kibali cha huduma.
  rationale: Aya yenyewe inatoa mfano wa mashindano na kusisitiza kufuata kanuni, lakini haitambulishi kwa uwazi taji hilo kuwa thawabu gani ya kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa kijinsia wa Kigiriki haujalazimishwa katika Kiswahili; “mtu … havikwi” ni wa jumla na wa asili.
