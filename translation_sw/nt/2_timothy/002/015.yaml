review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the imperative to earnest effort, divine approval, the worker image, and freedom from warranted shame. However, “ukilitumia kwa usahihi neno la kweli” can mean using the word correctly rather than handling/dealing with the word itself correctly; the rare participle calls for a rendering centered on proper treatment of the message.
  naturalness: The revised wording is idiomatic Standard East African Swahili and retains a dignified biblical register. “Kujionyesha mbele za Mungu” naturally expresses presenting oneself for God’s evaluation, while “kulishughulikia ... neno” clearly takes the word of truth as the object being handled.
  terminology: “Neno la kweli,” “mfanyakazi,” and “asiye na sababu ya kuaibika” are appropriate and preserve the Greek’s theological and occupational imagery without adding doctrinal interpretation. The footnote retains both the teaching-oriented alternative and the literal cutting-straight image.
  issues:
  - severity: medium
    issue: “ukilitumia kwa usahihi neno la kweli” is semantically imprecise.
    rationale: In Swahili, kutumia neno commonly means to use the word, whereas ὀρθοτομοῦντα has the word of truth as what is correctly handled, treated, or directed. “Ukilishughulikia kwa usahihi” better preserves that relation and the deliberate breadth of the Greek.
  - severity: low
    issue: The main clause omits the locative nuance of presenting oneself before God.
    rationale: Adding “mbele za Mungu” makes explicit the evaluative setting naturally associated with παραστῆσαι τῷ θεῷ, while remaining idiomatic.
  revised_text: Jitahidi kujionyesha mbele za Mungu kuwa umekubaliwa, ukiwa mfanyakazi asiye na sababu ya kuaibika, ukilishughulikia kwa usahihi neno la kweli.[a]
  revised_footnotes:
