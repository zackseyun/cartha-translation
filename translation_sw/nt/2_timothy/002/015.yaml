base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/015.yaml
  text: Be diligent to present yourself approved to God[a], a worker with no need to be ashamed, rightly handling the word of truth.
translation:
  language: sw
  text: Jitahidi kujionyesha mbele za Mungu kuwa umekubaliwa, ukiwa mfanyakazi asiye na sababu ya kuaibika, ukilishughulikia kwa usahihi neno la kweli.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ukilifundisha kwa usahihi”; kihalisi, “ukilikata neno la kweli kwa kunyooka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σπούδασον
  choice: Jitahidi
  rationale: Amri hii inadai bidii na juhudi ya dhati; “Jitahidi” ni ya kawaida, yenye nguvu, na haidhoofishi wito huo kuwa suala la kujaribu tu.
- source_word: σεαυτὸν δόκιμον παραστῆσαι τῷ θεῷ
  choice: kujionyesha kuwa umekubaliwa na Mungu
  rationale: Kirai hiki kinahifadhi wazo la mtu kujileta au kujionyesha kwa Mungu akiwa amethibitishwa na kukubalika. Kiswahili hiki ni cha asili zaidi kuliko tafsiri ya neno kwa neno ya “kujiwasilisha kuwa aliyekubaliwa.”
- source_word: ἐργάτην
  choice: mfanyakazi
  rationale: Linadumisha sitiari ya mtu anayefanya kazi kwa uaminifu, kwa lugha ya sasa na inayoeleweka.
- source_word: ἀνεπαίσχυντον
  choice: asiye na sababu ya kuaibika
  rationale: Neno hili halielezi tu hisia ya kutokuwa na aibu, bali hali ya kutokuwa na jambo linalostahili kumtia mtu aibu.
- source_word: ὀρθοτομοῦντα
  choice: ukilitumia kwa usahihi
  rationale: Kitenzi hiki adimu kina picha halisi ya “kukata kwa kunyooka,” lakini katika muktadha kinahusu kulishughulikia neno kwa njia sahihi. “Kulitumia kwa usahihi” ni pana vya kutosha kutofungamanisha maana na kufundisha pekee.
- source_word: τὸν λόγον τῆς ἀληθείας
  choice: neno la kweli
  rationale: Linahifadhi muundo na mwangwi wa usemi wa Kigiriki huku likibaki wazi na la kawaida katika Kiswahili cha kibiblia.
theological_decisions:
- issue: Maana ya ὀρθοτομοῦντα katika huduma ya Timotheo
  choice: ukilitumia kwa usahihi neno la kweli
  alternative: ukilifundisha kwa usahihi neno la kweli; kihalisi, ukilikata kwa kunyooka neno la kweli
  rationale: Tafsiri kuu inahifadhi maana pana ya kulishughulikia ujumbe kwa usahihi bila kuamua kwamba tendo linalokusudiwa ni kufundisha pekee. Tanbihi inadumisha picha halisi ya kitenzi na uwezekano wa tafsiri finyu zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wazi kwa msomaji wa kawaida, huku sitiari ya mfanyakazi na utata halisi wa ὀρθοτομοῦντα vikihifadhiwa.
