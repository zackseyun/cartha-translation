lexical_decisions:
- source_word: δοῦλον
  choice: mtumishi
  rationale: Neno δοῦλος linaweza kumaanisha mtumwa au mtumishi. Katika muktadha huu mkazo ni mwenendo wa mtu anayemtumikia Bwana, hivyo “mtumishi” ni la kawaida na wazi katika Kiswahili.
- source_word: κυρίου
  choice: wa Bwana
  rationale: Huhifadhi uhusiano wa kimilikishi katika δοῦλον κυρίου kwa Kiswahili cha kawaida na humtaja κύριος kuwa “Bwana.”
- source_word: οὐ δεῖ μάχεσθαι
  choice: hapaswi kugombana
  rationale: “Hapaswi” huwasilisha wajibu wa δεῖ pamoja na ukanushaji, na “kugombana” huonyesha ugomvi au mabishano yenye uhasama yanayokusudiwa hapa kuliko mapigano ya kimwili pekee.
- source_word: ἤπιον
  choice: mpole
  rationale: “Mpole” huonyesha tabia ya upole isiyo na ukali, kinyume cha kugombana.
- source_word: πρὸς πάντας
  choice: kwa watu wote
  rationale: Huwasilisha kwa njia ya kawaida upeo wa tabia hiyo kuelekezwa kwa kila mtu.
- source_word: διδακτικόν
  choice: mwenye uwezo wa kufundisha
  rationale: Neno hili humaanisha anayefaa au mwenye ustadi wa kufundisha, si mtu anayefundishika tu.
- source_word: ἀνεξίκακον
  choice: mwenye kuvumilia anapotendewa mabaya
  rationale: Hufafanua uwezo wa kustahimili kutendewa vibaya bila kulipiza kisasi; ni wazi zaidi kuliko “mvumilivu” peke yake.
theological_decisions:
- issue: Tafsiri ya δοῦλος katika maagizo kuhusu huduma
  choice: mtumishi
  alternative: mtumwa
  rationale: Muktadha unasisitiza mwenendo unaotakiwa wa anayemtumikia Bwana, si hasa hadhi ya kijamii ya utumwa. “Mtumishi” huwasilisha dhima hiyo bila kuondoa maana mbadala ya kileksia.
- issue: Tafsiri ya κύριος
  choice: Bwana
  alternative: bwana mkubwa
  rationale: “Bwana” ndiyo tafsiri ya kawaida na yenye hadhi ya κύριος katika muktadha huu, bila kuongeza ufafanuzi usiokuwapo katika maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi huhifadhi utofautishaji wa Kigiriki kati ya kutogombana na sifa chanya zinazofuata. Hakuna tanbihi iliyowekwa kwa sababu “mtumwa” si lazima iongezwe hapa ili aya ieleweke, na maandishi ya Kiswahili hayana alama ya tanbihi.
