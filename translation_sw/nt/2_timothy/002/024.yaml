  text: δοῦλον δὲ κυρίου οὐ δεῖ μάχεσθαι, ἀλλὰ ἤπιον εἶναι πρὸς πάντας, διδακτικόν, ἀνεξίκακον,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/024.yaml
  text: And the Lord’s servant must not quarrel[a], but must be gentle toward everyone, able to teach, patient when wronged,
translation:
  language: sw
  text: Lakini mtumishi[a] wa Bwana hapaswi kugombana, bali awe mpole kwa watu wote, mwenye uwezo wa kufundisha, na mwenye subira anapotendewa mabaya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtumwa.” Neno la Kigiriki doulos linaweza kumaanisha “mtumishi” au “mtumwa,” kutegemea muktadha.
