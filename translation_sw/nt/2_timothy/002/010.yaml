base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/010.yaml
  text: For this reason I endure everything for the sake of the elect[c][b][a], so that they also may obtain the salvation that is in Messiah Jesus with eternal glory.
translation:
  language: sw
  text: Kwa sababu hiyo, ninavumilia mambo yote kwa ajili ya wateule[a], ili wao pia wapate wokovu ulio katika Masihi[b] Yesu, pamoja na utukufu wa milele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “waliochaguliwa.” Neno la Kigiriki ni ἐκλεκτούς.
    reason: lexical_alternative
  - marker: b
    text: Kwa kawaida hutafsiriwa “Kristo.” Neno la Kigiriki Χριστός linamaanisha “Masihi” au “Mtiwa-mafuta.”
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Kwa sababu hiyo
  rationale: Kauli hii inaelekeza nyuma kwenye msingi uliotajwa katika muktadha uliotangulia na kuhifadhi maana ya kisababishi.
- source_word: πάντα
  choice: mambo yote
  rationale: Huhifadhi maana pana na jumuishi ya neno la Kigiriki kwa Kiswahili cha kawaida.
- source_word: ὑπομένω
  choice: ninavumilia
  rationale: Kitenzi hiki kinaonyesha kustahimili kwa uthabiti chini ya mateso au shida; “ninavumilia” ni cha asili na chenye uzito unaofaa.
- source_word: διὰ τοὺς ἐκλεκτούς
  choice: kwa ajili ya wateule
  rationale: διά pamoja na hali ya kushutumiwa hapa inaonyesha manufaa au kusudi. “Wateule” huhifadhi lugha ya kuchaguliwa iliyo wazi katika ἐκλεκτούς bila kuifafanua kwa mfumo fulani wa kiteolojia.
- source_word: ἵνα καὶ αὐτοὶ
  choice: ili wao pia
  rationale: “Ili” huhifadhi kusudi la ἵνα, “pia” huonyesha nguvu ya καί, na kiwakilishi “wao” hudumisha msisitizo wa αὐτοί.
- source_word: σωτηρίας τύχωσιν
  choice: wapate wokovu
  rationale: τυγχάνω pamoja na nomino katika hali ya umilikaji humaanisha kupata au kufikia; “wapate wokovu” ni Kiswahili cha kawaida kinachohifadhi maana hiyo.
- source_word: τῆς ἐν Χριστῷ Ἰησοῦ
  choice: ulio katika Masihi Yesu
  rationale: Kirai hiki kinafafanua wokovu. “Katika” huhifadhi lugha ya Paulo ya mahali au muungano, na “Masihi” huhifadhi maana ya cheo cha Χριστός.
- source_word: μετὰ δόξης αἰωνίου
  choice: pamoja na utukufu wa milele
  rationale: μετά pamoja na hali ya umilikaji huonyesha kuandamana; tafsiri hii inaonyesha kwamba utukufu wa milele unaambatana na wokovu unaopatikana.
theological_decisions:
- issue: Tafsiri ya ἐκλεκτούς
  choice: wateule
  alternative: waliochaguliwa
  rationale: “Wateule” huhifadhi kwa ufupi lugha ya uchaguzi iliyo katika maandishi bila kuamua mabishano kuhusu namna au msingi wa uteuzi huo.
- issue: Tafsiri ya Χριστῷ kama cheo
  choice: Masihi
  alternative: Kristo
  rationale: Χριστός linabeba maana ya cheo cha Mtiwa-Mafuta. “Masihi” huweka maana hiyo wazi, huku tanbihi ikitaja umbo la jadi “Kristo” bila kubadili maana.
- issue: Uhusiano wa μετὰ δόξης αἰωνίου na σωτηρίας τύχωσιν
  choice: wapate wokovu ... pamoja na utukufu wa milele
  alternative: wapate wokovu ... wenye utukufu wa milele
  rationale: Muundo mkuu unaonyesha utukufu ukiandamana na kupatikana kwa wokovu, lakini Kigiriki kinaweza pia kusomwa kwa ukaribu zaidi kama sifa ya wokovu; tanbihi huhifadhi uwezekano huo bila kuulazimisha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imeweka lugha nzito ya “wateule,” “wokovu,” na “utukufu wa milele,” lakini imetumia miundo inayoeleweka kwa msomaji wa kawaida. “Masihi Yesu” hudumisha mpangilio wa cheo na jina katika Kigiriki, ingawa “Kristo Yesu” limeelezwa katika tanbihi kama umbo la jadi.
