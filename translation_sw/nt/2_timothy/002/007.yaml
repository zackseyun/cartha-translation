  text: νόει ⸀ὃ λέγω· ⸀δώσει γάρ σοι ὁ κύριος σύνεσιν ἐν πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/007.yaml
  text: Consider what I am saying[b][a], for the Lord will give you understanding in all things.
translation:
  language: sw
  text: Tafakari ninayosema[a], kwa maana Bwana[b] atakupa ufahamu katika mambo yote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Fikiri kwa makini kuhusu ninayosema”; kitenzi hiki kinaweza pia kuwa na maana ya “elewa.”
    reason: lexical_alternative
  - marker: b
    text: Kigiriki hakisemi wazi zaidi “Bwana” ni nani; wengine huelewa kuwa ni Bwana Yesu hasa, na wengine kuwa ni Mungu kwa maana pana.
    reason: alternative_reading
lexical_decisions:
- source_word: νόει
  choice: Tafakari
  rationale: Amri hii inamtaka Timotheo afikirie kwa makini na kujishughulisha kiakili na mafundisho ya Paulo. “Tafakari” ni ya asili katika Kiswahili na haiondoi uwezekano wa maana ya “elewa,” unaotajwa katika tanbihi.
- source_word: ὃ λέγω
  choice: ninayosema
  rationale: Kiwakilishi cha uhusiano ὃ kinarejelea maudhui ya maneno ya Paulo, na wakati wa sasa wa λέγω unawakilishwa kwa kawaida na kwa ufupi kama “ninayosema.”
- source_word: δώσει ... σοι
  choice: atakupa
  rationale: Wakati ujao wa δίδωμι unaonyesha ahadi, na σοι ni mtendewa; “atakupa” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: γάρ
  choice: kwa maana
  rationale: Kiunganishi hiki kinatoa msingi wa agizo la kutafakari; “kwa maana” linaonyesha uhusiano huo wazi bila kuongeza tafsiri.
- source_word: ὁ κύριος
  choice: Bwana
  rationale: “Bwana” ndilo neno la kawaida la kibiblia kwa κύριος. Tafsiri haimtambulishi zaidi anayerejelewa kwa kuwa Kigiriki hakisemi wazi kama ni Yesu hasa au Mungu kwa maana pana.
- source_word: σύνεσιν
  choice: ufahamu
  rationale: Neno hili linamaanisha uwezo wa kuelewa au kushika maana. “Ufahamu” ni neno la kawaida, pana, na linalofaa katika muktadha huu.
- source_word: ἐν πᾶσιν
  choice: katika mambo yote
  rationale: Tafsiri hii inadumisha upana wa kirai cha Kigiriki bila kukifinya kihusishe mafundisho pekee.
theological_decisions:
- issue: Anayerejelewa na “Bwana” (ὁ κύριος)
  choice: Bwana
  alternative: Bwana Yesu; Mungu
  rationale: Kigiriki hakimtambulishi zaidi anayerejelewa. Ingawa matumizi ya Paulo mara nyingi yanaweza kumrejelea Yesu, tafsiri inadumisha utata halisi wa matini badala ya kuamua suala hilo kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni fupi na wazi; “Tafakari” inadumisha uzito wa agizo, huku tanbihi zikihifadhi wigo wa kitenzi na utata wa neno “Bwana.”
