  text: πιστὸς ὁ λόγος· εἰ γὰρ συναπεθάνομεν, καὶ συζήσομεν·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/011.yaml
  text: 'The saying is trustworthy: for if we died with him[c][b][a], we will also live with him.'
translation:
  language: sw
  text: Usemi huu ni wa kuaminika:[a] kwa maana ikiwa tulikufa pamoja naye,[b] tutaishi pia pamoja naye.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Neno hili ni la kuaminika” au “Kauli hii ni ya kutegemewa.”
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “ikiwa tulikufa pamoja na”; kitenzi ambatano cha Kigiriki kinaonyesha kushiriki kifo pamoja na Kristo.
    reason: lexical_alternative
  - marker: c
    text: Wakati ujao “tutaishi pamoja naye” unaweza kurejelea maisha ya ufufuo pamoja na Kristo, ushiriki wa sasa katika maisha yake, au yote mawili.
    reason: alternative_reading
lexical_decisions:
- source_word: πιστὸς
  choice: ni wa kuaminika
  rationale: Kirai hiki kinaonyesha kwamba usemi huo ni wa kutegemewa na unastahili kukubaliwa. Kiswahili cha kawaida ‘wa kuaminika’ kinafikisha maana hiyo bila kuufanya usemi kuwa kama mtu mwenye uaminifu.
- source_word: ὁ λόγος
  choice: usemi huu
  rationale: Katika nyaraka za kichungaji, kirai hiki hutambulisha tamko fupi lenye kukumbukwa. ‘Usemi huu’ ni cha asili zaidi katika Kiswahili kuliko tafsiri ya moja kwa moja ‘neno’ na kinaelekeza kwenye tamko linalofuata.
- source_word: εἰ γὰρ
  choice: kwa maana ikiwa
  rationale: ‘Ikiwa’ linahifadhi sharti linaloletwa na εἰ, na ‘kwa maana’ linaonyesha kazi ya γάρ ya kueleza kwa nini usemi huo ni wa kuaminika.
- source_word: συναπεθάνομεν
  choice: tulikufa pamoja naye
  rationale: Kitenzi ambatano chenye συν- kinaonyesha kushiriki kifo pamoja na mwingine. Muktadha unamtambulisha Kristo kuwa ndiye anayerejelewa, hivyo ‘naye’ huifanya maana iwe wazi kwa Kiswahili bila kufafanua wakati wa tendo kupita kiasi.
- source_word: καὶ
  choice: pia
  rationale: 'Hapa καί linaunganisha matokeo yanayolingana na sharti: kama tulikufa pamoja naye, tutaishi pia pamoja naye.'
- source_word: συζήσομεν
  choice: tutaishi pia pamoja naye
  rationale: Wakati ujao umehifadhiwa kwa ‘tutaishi,’ na συν- limetafsiriwa kwa ‘pamoja naye.’ Tafsiri hii haibani maisha hayo kuwa ya sasa pekee wala ya ufufuo wa baadaye pekee.
theological_decisions:
- issue: Anayerejelewa na viambishi vya συν- katika vitenzi
  choice: Kuweka wazi ‘pamoja naye’ katika vitenzi vyote viwili, ‘naye’ akimrejelea Kristo.
  alternative: 'Kuacha mshiriki huyo bila kutajwa: ‘ikiwa tulikufa, tutaishi pia.’'
  rationale: Ingawa hakuna kiwakilishi huru katika Kigiriki, vitenzi vyenye συν- vina maana ya kushiriki pamoja na mwingine, na muktadha unaomlenga Kristo unaonyesha kwamba ndiye anayerejelewa. ‘Pamoja naye’ huwasilisha maana ya vitenzi badala ya kuongeza fundisho jipya.
- issue: Maana ya wakati na ya kitheolojia ya kuishi pamoja na Kristo
  choice: Kutafsiri kwa upana ‘tutaishi pia pamoja naye’ bila kuamua kama ni maisha ya ufufuo wa baadaye, ushiriki wa sasa katika maisha yake, au yote mawili.
  alternative: Kufasiri kuwa maisha ya ufufuo wa baadaye pekee, au maisha ya kiroho ya sasa pekee.
  rationale: Wakati ujao wa συζήσομεν unaelekea mbele, lakini usemi wenyewe hauongezi maelezo yanayolazimisha tafsiri finyu. Tafsiri inadumisha upana na mvutano wa maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa sentensi umehifadhi usawa wa kishairi kati ya ‘tulikufa pamoja naye’ na ‘tutaishi pia pamoja naye,’ huku ukibaki rahisi kueleweka kwa wasomaji wa kawaida.
