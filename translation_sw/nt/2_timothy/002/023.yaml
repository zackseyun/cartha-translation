lexical_decisions:
- source_word: μωρὰς
  choice: ya kipumbavu
  rationale: Huwasilisha wazo la mambo yasiyo na busara kwa Kiswahili cha kawaida bila kutumia tusi kali lisilohitajika.
- source_word: ἀπαιδεύτους
  choice: yasiyo na msingi wa mafundisho
  rationale: Neno hili linaashiria ukosefu wa kufundishwa au kuelimishwa; kauli hii inaeleweka kwa urahisi na haipunguzi maana kuwa ukosefu wa akili tu.
- source_word: ζητήσεις
  choice: mabishano
  rationale: Ingawa neno linaweza kumaanisha maswali au mijadala, katika muktadha huu linahusu majadiliano yenye ubishi yanayosababisha ugomvi.
- source_word: παραιτοῦ
  choice: yakatae
  rationale: Amri hii inaonyesha kukataa kujihusisha nayo, kwa nguvu iliyo wazi na fupi.
- source_word: εἰδὼς
  choice: kwa kuwa unajua
  rationale: Hufanya uhusiano wa kisababu wa kishiriki hiki kuwa wa asili na wazi katika Kiswahili.
- source_word: γεννῶσι
  choice: huzaa
  rationale: Huhifadhi sitiari halisi ya kuzaa huku ikibaki ya kawaida katika Kiswahili kwa maana ya kusababisha.
- source_word: μάχας
  choice: ugomvi
  rationale: Katika muktadha wa mabishano ya maneno, 'ugomvi' hueleza migogoro inayotokea bila kudokeza mapigano ya kimwili pekee.
- source_word: δὲ
  choice: Lakini
  rationale: Huonyesha tofauti ndogo na mawaidha yaliyotangulia.
