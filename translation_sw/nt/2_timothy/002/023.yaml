review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the imperative, the causal participle, and the metaphor of γεννῶσι. However, “yasiyo na msingi wa mafundisho” adds the specific idea that the disputes lack a doctrinal basis; ἀπαιδεύτους denotes being uninstructed/uneducated, not necessarily doctrinally baseless. The plural μάχας is better represented by “magomvi.”
  naturalness: The sentence is otherwise clear and idiomatic Standard East African Swahili. “Mabishano ya kipumbavu na yasiyo na elimu” is direct, natural enough in this literary register, and avoids introducing a theological qualification.
  terminology: “Yakataa,” “mabishano,” and “huzaa” fit the source and register. Replacing “msingi wa mafundisho” with “elimu” preserves the semantic scope of ἀπαιδεύτους without turning it into a claim about doctrine.
  issues:
  - severity: medium
    issue: “yasiyo na msingi wa mafundisho” over-specifies ἀπαιδεύτους.
    rationale: The Greek refers to what is uninstructed or uneducated. It does not state that the controversies have no doctrinal foundation; that wording can import a theological judgment absent from the source.
  - severity: low
    issue: “ugomvi” is singular for plural μάχας.
    rationale: Although singular can function collectively in Swahili, “magomvi” more directly retains the source plural and is natural in context.
  - severity: low
    issue: Footnote a's alternative “mijadala isiyo na mafundisho” repeats the over-specific doctrinal wording.
    rationale: The lexical note should present alternatives without adding “mafundisho,” which is not required by ζητήσεις or ἀπαιδεύτους.
  revised_text: Lakini yakatae mabishano ya kipumbavu na yasiyo na elimu[a], kwa kuwa unajua kwamba huzaa magomvi[b].
