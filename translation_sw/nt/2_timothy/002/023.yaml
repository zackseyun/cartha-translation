  text: But refuse foolish and ignorant controversies[b][a], knowing that they produce quarrels.
translation:
  language: sw
  text: Lakini yakatae mabishano ya kipumbavu na yasiyo na elimu[a], kwa kuwa unajua kwamba huzaa magomvi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “maswali” au “mijadala”; neno la Kigiriki linaweza kumaanisha uchunguzi au maswali, lakini hapa yaelekea linarejelea mabishano badala ya uchunguzi wa dhati.
    reason: lexical_alternative
