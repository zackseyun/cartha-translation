  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὑπόμνησιν ⸀λαβὼν τῆς ἐν σοὶ ἀνυποκρίτου πίστεως, ἥτις ἐνῴκησεν πρῶτον ἐν τῇ μάμμῃ σου Λωΐδι καὶ τῇ μητρί σου Εὐνίκῃ, πέπεισμαι δὲ ὅτι καὶ ἐν σοί.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/005.yaml
  text: having been reminded of the sincere faith in you, which first lived in your grandmother Lois and your mother Eunice, I am persuaded that it is also in you.
translation:
  language: sw
  text: Nimekumbushwa kuhusu imani yako isiyo na unafiki, ambayo iliishi kwanza ndani ya bibi yako Loisi na mama yako Eunike; nami nina hakika kwamba imo ndani yako pia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπόμνησιν λαβών
  choice: Ninakumbuka
  rationale: Kirai hiki kwa maana halisi ni ‘nikiwa nimekumbushwa’ au ‘baada ya kukumbushwa’; katika Kiswahili cha kawaida, ‘Ninakumbuka’ huwasilisha kwa ufasaha wazo la jambo kurudishwa akilini katika muktadha huu.
- source_word: ἀνυποκρίτου πίστεως
  choice: imani ... isiyo na unafiki
  rationale: ‘Isiyo na unafiki’ huhifadhi maana ya kutokuwa kwa kujifanya au bandia, bila kuifupisha tu kuwa ‘ya kweli’.
- source_word: ἐνῴκησεν
  choice: ilikaa ... ndani ya
  rationale: Kitenzi hiki kina maana ya kukaa au kufanya makao ndani; ‘ilikaa ndani ya’ huhifadhi sitiari ya imani inayokaa ndani ya mtu.
- source_word: μάμμῃ
  choice: nyanya
  rationale: Ni neno la kawaida la Kiswahili kwa bibi wa upande wowote wa ukoo; hapa limetumiwa pamoja na jina Loisi ili kuepuka utata wa ‘bibi’.
- source_word: πέπεισμαι
  choice: nina hakika
  rationale: Huwasilisha hali timilifu ya kusadikishwa na kuwa na uhakika inayoelezwa na kitenzi cha Kigiriki.
theological_decisions:
- issue: Maana ya ‘imani ilikaa ndani ya’
  choice: Sitiari ya kukaa ndani imehifadhiwa bila kufafanua aina au kiwango cha imani.
  alternative: ‘walikuwa na imani ya kweli’
  rationale: Chanzo kinaihusisha imani moja na Loisi, Eunike, na Timotheo kwa sitiara ya kukaa ndani; tafsiri haipaswi kuongeza ufafanuzi wa kimadhehebu.
- issue: Uhakika wa Paulo kuhusu Timotheo
  choice: ‘nami nina hakika kwamba inakaa ndani yako pia’
  alternative: ‘nami nimeamini kwamba wewe pia unayo’
  rationale: Hii huhifadhi msisitizo wa πέπεισμαι na urejeo wa sitiari ya ἐνῴκησεν huku ikiweka wazi kwamba ‘in-’ inarejelea imani.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi zimegawanywa kwa usomaji wa kawaida, huku uhusiano wa mawazo na sitiari kuu za Kigiriki vikihifadhiwa.
