  text: δι’ ἣν αἰτίαν καὶ ταῦτα πάσχω, ἀλλ’ οὐκ ἐπαισχύνομαι, οἶδα γὰρ ᾧ πεπίστευκα, καὶ πέπεισμαι ὅτι δυνατός ἐστιν τὴν παραθήκην μου φυλάξαι εἰς ἐκείνην τὴν ἡμέραν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/012.yaml
  text: For this reason I also suffer these things[a], but I am not ashamed, for I know whom I have believed[c][b], and I am convinced that he is able to guard my deposit until that day.
translation:
  language: sw
  text: Kwa sababu hiyo pia ninapata mateso haya, lakini siaibiki, kwa maana ninamjua yule niliyemwamini[a], nami nina hakika kwamba anaweza kulinda amana yangu[b] mpaka siku ile.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “yule niliyemtumaini.”
    reason: lexical_alternative
  - marker: b
    text: “Amana yangu” ni kitu kilichowekwa chini ya uangalizi wa mwingine ili kihifadhiwe salama. Huenda ikawa kile ambacho Paulo alimkabidhi Mungu, au kile ambacho Paulo mwenyewe alikabidhiwa.
    reason: alternative_reading
  - marker: c
    text: Yaani, siku ya baadaye ya hukumu ya mwisho na ya kutetewa kwa haki na Mungu.
    reason: cross_reference
lexical_decisions:
- source_word: δι’ ἣν αἰτίαν
  choice: Kwa sababu hiyo
  rationale: Ni usemi wa kawaida wa Kiswahili unaohifadhi uhusiano wa kisababishi na yaliyotangulia.
- source_word: ταῦτα πάσχω
  choice: ninapata mateso haya
  rationale: Huwasilisha maana ya πάσχω kama kupata au kuvumilia mateso, huku ‘haya’ ikihifadhi kiwakilishi cha kuonyesha bila kuyafafanua mateso hayo.
- source_word: οὐκ ἐπαισχύνομαι
  choice: sioni aibu
  rationale: Ni usemi wa kawaida na wa sasa wa Kiswahili kwa hali ya kutokuwa na aibu; katika muktadha huu unahusu msimamo wa Paulo kuhusu mateso yake.
- source_word: οἶδα
  choice: ninamjua
  rationale: οἶδα ina nguvu ya hali ya sasa, na kiambishi cha nafsi ‘-m-’ kinafaa kwa yule anayejulikana kama mtu binafsi.
- source_word: ᾧ πεπίστευκα
  choice: yule niliyemwamini
  rationale: Huhifadhi mtendewa wa kibinafsi na hali ya imani iliyothibitika. ‘Kumwamini’ katika Kiswahili inaweza kujumuisha kumtegemea au kumtumaini bila kulazimisha ufafanuzi mmoja tu.
- source_word: πέπεισμαι
  choice: nina hakika
  rationale: Hutoa kwa Kiswahili cha kawaida hali endelevu ya usadikisho thabiti iliyo katika kauli timilifu ya Kiyunani.
- source_word: δυνατός ἐστιν
  choice: anaweza
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya uwezo, bila kuongeza maelezo yasiyomo katika chanzo.
- source_word: τὴν παραθήκην μου
  choice: amana yangu
  rationale: ‘Amana’ ni kitu kilichowekwa kwa mwingine ili akihifadhi. Usemi huu unaendeleza sitiari na kutatua kwa kiwango kidogo tu utata wa ikiwa ni kile Paulo alichokabidhi au kile alichokabidhiwa.
- source_word: φυλάξαι
  choice: kulinda
  rationale: Hulingana vizuri na wazo la kutunza amana salama na huhifadhi maana ya φυλάσσω ya kulinda au kuhifadhi.
- source_word: εἰς ἐκείνην τὴν ἡμέραν
  choice: mpaka siku ile
  rationale: Ni usemi wa kawaida wa wakati unaoelekeza mbele kwenye siku inayojulikana kwa muktadha, bila kuongeza herufi kubwa au utambulisho usiotajwa wazi.
theological_decisions:
- issue: Mrejelewa wa ᾧ (‘yule’) na mtenda aliyedokezwa katika ‘anaweza’
  choice: 'Mrejelewa anaachwa bila kutajwa kwa jina, kama katika Kiyunani: ‘yule’ na ‘anaweza.’'
  alternative: Kumtaja wazi kuwa Mungu au Kristo Yesu.
  rationale: Muktadha unaelekeza kwa nguvu kwa Mungu anayejulikana katika Kristo, lakini kifungu hiki hakimwiti kwa jina. Tafsiri inahifadhi kiwango kilekile cha ubainifu.
- issue: Maana ya παραθήκη μου
  choice: Usemi ‘amana yangu’ unahifadhi sitiari na utata wa Kiyunani.
  alternative: Injili au huduma aliyokabidhiwa Paulo; au maisha, nafsi, au wokovu ambao Paulo alimkabidhi Mungu.
  rationale: Muundo wa Kiyunani unaweza kueleweka kama kile kilichokabidhiwa kwa Paulo au kile Paulo alichokabidhi kwa Mungu. Matini kuu haichagui upande mmoja, na tanbihi inaeleza uwezekano huo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni rahisi kueleweka kwa wasomaji wa kawaida, huku ‘amana yangu’ ikidumisha sitiari na utata muhimu wa chanzo. Viwakilishi vya kibinafsi vinabaki bila kumtaja Mungu au Kristo moja kwa moja kwa sababu Kiyunani hakufanyi hivyo katika kifungu hiki.
