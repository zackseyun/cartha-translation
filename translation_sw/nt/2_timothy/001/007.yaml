  text: οὐ γὰρ ἔδωκεν ἡμῖν ὁ θεὸς πνεῦμα δειλίας, ἀλλὰ δυνάμεως καὶ ἀγάπης καὶ σωφρονισμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/007.yaml
  text: For God did not give us a spirit of cowardice[b][a], but of power and love and self-control.
translation:
  language: sw
  text: Kwa maana Mungu hakutupa roho[a] ya uoga[b], bali ya nguvu, ya upendo, na ya kujidhibiti[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Roho.” Neno la Kigiriki linaweza kumaanisha roho au mwelekeo wa ndani; muktadha haumtambui Roho Mtakatifu kwa uwazi.
    reason: theological_ambiguity
  - marker: b
    text: Au, “kuwa mwoga.” Neno la Kigiriki linamaanisha woga wa kukosa ujasiri, si hofu ya kawaida tu.
    reason: lexical_alternative
  - marker: c
    text: Au, “busara” au “nidhamu.” Neno la Kigiriki linajumuisha kuwa na akili timamu na uwezo wa kujitawala.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ γὰρ
  choice: Maana ... haku-
  rationale: ‘Maana’ linaendeleza uhusiano wa maelezo na himizo lililotangulia, huku kiambishi ‘-ku-’ katika ‘hakutupa’ kikikanusha tendo la wakati uliopita.
- source_word: ἔδωκεν ἡμῖν ὁ θεὸς
  choice: Mungu hakutupa
  rationale: Muundo huu ni wa kawaida na wenye mtiririko mzuri katika Kiswahili; ‘-tu-’ huonyesha yambwa ‘sisi,’ na aoristi imetafsiriwa kwa wakati uliopita.
- source_word: πνεῦμα
  choice: roho
  rationale: ‘Roho’ huhifadhi upana wa πνεῦμα, ambalo hapa linaweza kueleweka kuwa hali au mwelekeo wa ndani, bila kuondoa kabisa uwezekano wa kurejelea Roho wa Mungu.
- source_word: δειλίας
  choice: woga
  rationale: ‘Woga’ ni la kawaida na linaeleweka kwa urahisi; katika muktadha huu linamaanisha kuwa mwoga, si hofu ya kawaida tu.
- source_word: ἀλλὰ
  choice: bali
  rationale: ‘Bali’ linaonyesha kwa wazi ulinganisho mkali kati ya woga na sifa tatu zinazofuata.
- source_word: δυνάμεως
  choice: nguvu
  rationale: ‘Nguvu’ ni tafsiri ya moja kwa moja na ya kawaida ya δύναμις katika muktadha huu.
- source_word: ἀγάπης
  choice: upendo
  rationale: ‘Upendo’ ni neno la kawaida, la sasa na lenye hadhi kwa ἀγάπη.
- source_word: σωφρονισμοῦ
  choice: kujidhibiti
  rationale: Neno hili linaeleza kwa uwazi uwezo wa mtu kutawala mwenendo na misukumo yake, huku tanbihi ikihifadhi maana mbadala ya busara na nidhamu.
theological_decisions:
- issue: Kirejelewa cha πνεῦμα
  choice: roho kama hali au mwelekeo ambao Mungu hutoa
  alternative: Roho, yaani Roho Mtakatifu
  rationale: Kutokuwapo kwa kibainishi na virai vya ‘ya woga’ na ‘ya nguvu, upendo na kujidhibiti’ kunapendelea maana ya namna ya roho au mwelekeo. Hata hivyo, tafsiri kuu haijafungwa kiasi cha kuondoa uhusiano unaowezekana na kazi ya Roho Mtakatifu; uwezekano huo umeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye hadhi na unaoeleweka kwa wasomaji wa kawaida. Kurudiwa kwa ‘roho’ baada ya ‘bali’ kunafanya ulinganisho uwe wazi na wa asili katika Kiswahili.
