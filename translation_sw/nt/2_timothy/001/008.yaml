source:
  edition: SBLGNT
  text: Μὴ οὖν ἐπαισχυνθῇς τὸ μαρτύριον τοῦ κυρίου ἡμῶν μηδὲ ἐμὲ τὸν δέσμιον αὐτοῦ, ἀλλὰ συγκακοπάθησον τῷ εὐαγγελίῳ κατὰ δύναμιν θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/008.yaml
  text: Therefore, do not be ashamed of the testimony about our Lord, nor of me, his prisoner, but suffer hardship with the gospel according to the power of God,
translation:
  language: sw
  text: Kwa hiyo, usione aibu na ushuhuda kuhusu Bwana wetu,[a] wala mimi, mfungwa wake. Badala yake, shiriki mateso kwa ajili ya injili,[b] kwa kadiri ya nguvu za Mungu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ushuhuda wa Bwana wetu.” Muundo wa Kigiriki unaweza kumaanisha ushuhuda unaotolewa na Bwana, ingawa hapa huenda unamaanisha ushuhuda unaomhusu Bwana.
    reason: alternative_reading
  - marker: b
    text: Au, “jiunge katika kuteseka kwa ajili ya injili.” Kitenzi cha Kigiriki kinajumuisha wazo la kushiriki pamoja na wengine katika mateso.
    reason: lexical_alternative
  - marker: c
    text: Au, “kwa nguvu za Mungu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ οὖν
  choice: Kwa hiyo, usione
  rationale: οὖν linaonyesha hitimisho linalotokana na himizo lililotangulia; “Kwa hiyo” linaweka wazi uhusiano huo, na μή pamoja na aoristi subjunktivu limetafsiriwa kama katazo.
- source_word: ἐπαισχυνθῇς
  choice: usione aibu
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha kuona haya au kujiepusha kwa sababu ya aibu.
- source_word: τὸ μαρτύριον τοῦ κυρίου ἡμῶν
  choice: kuushuhudia ujumbe kuhusu Bwana wetu
  rationale: μαρτύριον ni ushuhuda unaomhusu Bwana; muundo huu ni wa asili kwa Kiswahili na unaonyesha tendo la kutoa ushuhuda bila kuufanya kuwa ushuhuda wa kisheria. Tanbihi inahifadhi uwezekano wa genitivi ya kiima.
- source_word: μηδὲ ἐμὲ τὸν δέσμιον αὐτοῦ
  choice: wala usione aibu kwa ajili yangu, mfungwa wake
  rationale: Kitenzi kilichodokezwa kimerudiwa ili Kiswahili kiwe wazi. “Mfungwa wake” kinahifadhi uhusiano wa Paulo na Bwana bila kuamua ikiwa maana kuu ni umiliki, ushirika, au kufungwa kwa ajili yake.
- source_word: συγκακοπάθησον
  choice: shiriki mateso
  rationale: Kitenzi ambatani kina wazo la kuingia pamoja na wengine katika taabu; “shiriki mateso” ni cha asili na kinahifadhi wazo hilo.
- source_word: τῷ εὐαγγελίῳ
  choice: kwa ajili ya injili
  rationale: Dativu baada ya συγκακοπάθησον ni fupi na yenye uwezekano wa mahusiano kadhaa; katika Kiswahili “kwa ajili ya injili” linaeleza sababu au jambo linalohusishwa na mateso kwa ufasaha.
- source_word: κατὰ δύναμιν θεοῦ
  choice: kwa kadiri ya nguvu za Mungu
  rationale: κατά pamoja na akusativi linaweza kuonyesha kipimo au ulingano; “kwa kadiri ya” linahifadhi upana huo kuliko kutafsiri moja kwa moja kuwa chombo cha kuwezesha.
theological_decisions:
- issue: Uhusiano wa “ushuhuda” na “Bwana wetu”
  choice: ushuhuda kuhusu Bwana wetu
  alternative: ushuhuda wa Bwana wetu
  rationale: Muktadha unaunga mkono genitivi ya yambwa—ushuhuda unaomhusu Bwana—lakini tanbihi inahifadhi uwezekano kwamba ni ushuhuda unaotolewa na Bwana.
- issue: Maana ya “mfungwa wake”
  choice: kuhifadhi usemi “mfungwa wake”
  alternative: mfungwa kwa ajili yake
  rationale: αὐτοῦ linaonyesha uhusiano na Bwana. Usemi wa umilikaji unaacha wazi ikiwa Paulo ni mfungwa anayemilikiwa naye kwa maana ya ushirika, aliyefungwa kwa ajili yake, au yote mawili.
- issue: Uhusiano wa mateso na injili
  choice: shiriki mateso kwa ajili ya injili
  alternative: teseka pamoja na injili
  rationale: Kiswahili cha kawaida hakisemi kwa urahisi kwamba mtu anateseka “pamoja na injili.” Tafsiri iliyochaguliwa inaweka wazi kwamba mateso yanahusiana na huduma ya injili, huku tanbihi ikihifadhi nguvu ya kiambishi συν- ya kushiriki pamoja.
- issue: Nguvu za Mungu kama kipimo au njia
  choice: kwa kadiri ya nguvu za Mungu
  alternative: kwa nguvu za Mungu
  rationale: κατά linaweza kueleza kadiri au ulingano, ilhali “kwa nguvu” lingeelekea kuamua kwamba nguvu hizo ni njia tu ya kuwezesha. Tanbihi inaonyesha uwezekano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Injili” limehifadhiwa kwa sababu ni neno la kawaida katika matumizi ya Kikristo; sentensi imegawanywa ili kuepuka mlolongo mzito, bila kupoteza uhusiano wa kimantiki.
