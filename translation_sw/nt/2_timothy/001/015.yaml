  text: Οἶδας τοῦτο ὅτι ἀπεστράφησάν με πάντες οἱ ἐν τῇ Ἀσίᾳ, ὧν ἐστιν Φύγελος καὶ Ἑρμογένης.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/015.yaml
  text: 'You know this: all those in Asia turned away from me[b][a], among whom are Phygelus and Hermogenes.'
translation:
  language: sw
  text: 'Unajua jambo hili: wote walio katika Asia[a] waliniacha[b]. Miongoni mwao ni Figelo na Hermogene.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Asia” hapa ni jimbo la Roma lililokuwa magharibi mwa Asia Ndogo, si bara la Asia la leo.
    reason: cultural_note
  - marker: b
    text: Au “walinitelekeza.” Kigiriki husema kwa taswira ya moja kwa moja kwamba waligeuka mbali nami.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἶδας τοῦτο ὅτι
  choice: 'Unajua jambo hili:'
  rationale: Muundo huu wa kawaida wa Kiswahili unahifadhi maana ya hali ya kujua pamoja na kiwakilishi kinachoelekeza kwenye habari inayofuata; alama ya nukta mbili inawakilisha kwa ufasaha ὅτι inayoanzisha maudhui.
- source_word: ἀπεστράφησάν με
  choice: waliniacha
  rationale: Katika muktadha huu kitenzi kinaonyesha kujitenga na Paulo kwa kuvunja uaminifu au msaada. ‘Waliniacha’ ni Kiswahili cha kawaida, huku tanbihi ikihifadhi taswira halisi ya ‘kunigeukia mbali.’
- source_word: πάντες οἱ ἐν τῇ Ἀσίᾳ
  choice: wote walio katika Asia
  rationale: Huhifadhi nguvu pana ya πάντες bila kuongeza mpaka wa kundi katika matini; muktadha ndio unaoamua watu wanaokusudiwa.
- source_word: Ἀσίᾳ
  choice: Asia
  rationale: Jina la kihistoria linahifadhiwa katika matini, na tanbihi inafafanua kuwa ni jimbo la Roma, si bara la kisasa.
- source_word: ὧν ἐστιν
  choice: miongoni mwao wakiwa
  rationale: Hutoa kwa Kiswahili cha asili maana ya kutaja watu wawili kama sehemu ya kundi lililotangulia.
- source_word: Φύγελος
  choice: Figelo
  rationale: Jina limetoholewa kwa tahajia na matamshi yanayofaa Kiswahili.
- source_word: Ἑρμογένης
  choice: Hermogene
  rationale: Jina limetoholewa kwa tahajia na matamshi yanayofaa Kiswahili.
theological_decisions:
- issue: Upeo wa ‘wote walio katika Asia’
  choice: Matini inahifadhi ‘wote’ bila kuifafanua kuwa kila mkazi au kila Mkristo wa jimbo hilo.
  alternative: Kusema wazi ‘wafuasi wangu wote katika Asia’ au kulainisha kuwa ‘wengi katika Asia.’
  rationale: πάντες ina nguvu pana lakini inaweza kuwa na mpaka unaotolewa na muktadha. Kutokuongeza ‘wafuasi’ wala kubadili kuwa ‘wengi’ kunahifadhi ukali na mvutano wa kauli ya Paulo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Waliniacha’ ni usemi wa sasa na wa asili; tanbihi inahifadhi taswira ya Kigiriki. Alama zote za tanbihi [a] na [b] zimewekwa katika matini kuu.
