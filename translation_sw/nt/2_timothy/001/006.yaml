  text: δι’ ἣν αἰτίαν ἀναμιμνῄσκω σε ἀναζωπυρεῖν τὸ χάρισμα τοῦ θεοῦ, ὅ ἐστιν ἐν σοὶ διὰ τῆς ἐπιθέσεως τῶν χειρῶν μου·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/006.yaml
  text: For this reason I remind you to rekindle the gift of God that is in you through the laying on of my hands[a].
translation:
  language: sw
  text: Kwa sababu hiyo, nakukumbusha uichochee upya karama ya Mungu iliyo ndani yako kwa njia ya kuwekewa mikono yangu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uipepee iwake tena.” Kitenzi cha Kigiriki kinatoa picha ya kuuchochea moto ili uwake tena kwa nguvu.
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ ἣν αἰτίαν
  choice: Kwa sababu hiyo
  rationale: Ni usemi wa kawaida wa Kiswahili unaohifadhi uhusiano wa kisababishi na yaliyotangulia.
- source_word: ἀναμιμνῄσκω
  choice: nakukumbusha
  rationale: Huwasilisha kwa kawaida kitenzi cha wakati wa sasa pamoja na yule anayekumbushwa.
- source_word: σε ἀναζωπυρεῖν
  choice: uichochee upya
  rationale: Huhifadhi picha ya moto unaochochewa ili uwake kwa nguvu tena, huku ikiwa lugha ya kawaida na inayoeleweka.
- source_word: τὸ χάρισμα τοῦ θεοῦ
  choice: karama ya Mungu
  rationale: Karama huonyesha zawadi inayotolewa kwa neema bila kuongeza ufafanuzi wa kidhehebu kama vile ‘karama ya kiroho.’
- source_word: ὅ ἐστιν ἐν σοὶ
  choice: iliyo ndani yako
  rationale: Hutambulisha karama kuwa imo kwa Timotheo wakati huo kwa Kiswahili cha kawaida.
- source_word: διὰ τῆς ἐπιθέσεως τῶν χειρῶν μου
  choice: kwa njia ya kuwekewa mikono yangu
  rationale: ‘Kwa njia ya’ hudumisha maana ya chombo au njia katika διά pamoja na genitivi; ‘kuwekewa mikono’ ni usemi unaotambulika wa tendo hilo.
theological_decisions:
- issue: Jinsi karama inavyohusiana na tendo la Paulo la kuweka mikono
  choice: kwa njia ya kuwekewa mikono yangu
  alternative: kwa kuwekewa mikono yangu
  rationale: Kauli hii inadumisha madai ya mstari kwamba karama ilihusishwa na kutolewa kwa njia ya Paulo kuweka mikono, bila kuingiza teolojia ya kisakramenti iliyoendelezwa zaidi ya yale yanayosemwa na mstari.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Karama’ ni istilahi iliyozoeleka na sahihi katika muktadha wa kibiblia; ‘uichochee upya’ huhifadhi sitiari ya moto bila kuwa ngumu kueleweka.
