translation:
  language: sw
  text: ambaye alituokoa na kutuita kwa mwito mtakatifu[a], si kwa msingi wa matendo yetu, bali kwa kusudi lake mwenyewe na neema yake, neema tuliyopewa katika Masihi Yesu[b] kabla ya zama za milele[c][d],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwenye mwito mtakatifu,” au “kwa njia ya mwito mtakatifu.” Dative ya Kigiriki inaweza kueleweka kwa njia zaidi ya moja.
    reason: lexical_alternative
  - marker: b
    text: Au, “katika Kristo Yesu.” Usemi “Masihi Yesu” umetumiwa hapa kwa sababu Χριστός linaeleweka kuwa cheo.
    reason: alternative_reading
  - marker: c
    text: Au, “kabla ya zama za milele,” “kabla ya zama kuanza,” au kwa lugha ya kinahau zaidi, “kabla ya wakati kuanza.”
    reason: lexical_alternative
  - marker: d
    text: Tafsiri nyingine ni “kabla ya nyakati za milele kuwapo.”
    reason: previous_rendering
lexical_decisions:
- source_word: σώσαντος
  choice: alituokoa
  rationale: Kitenzi ‘kuokoa’ ndicho kinachowasilisha kwa kawaida uzito wa maana ya σῴζω katika muktadha wa wokovu, bila kuongeza ufafanuzi usiomo katika chanzo.
- source_word: καλέσαντος
  choice: kutu­ita
  rationale: ‘Kuita’ huhifadhi maana ya mwito wa Mungu na usambamba wa vitenzi ‘alituokoa’ na ‘kutuita’.
- source_word: κλήσει ἁγίᾳ
  choice: kwa mwito mtakatifu
  rationale: Muundo huu ni wa kawaida katika Kiswahili na uko karibu na hali ya dative ya Kigiriki, ingawa unaweza kueleweka kama njia ya kuitwa; uwezekano mwingine umeonyeshwa katika tanbihi.
- source_word: οὐ κατὰ τὰ ἔργα ἡμῶν
  choice: si kwa kadiri ya matendo yetu
  rationale: ‘Kwa kadiri ya’ hufuata maana ya κατά kama kipimo au msingi, huku ‘matendo’ kikihifadhi istilahi muhimu ya Paulo.
- source_word: ἰδίαν πρόθεσιν
  choice: kusudi lake mwenyewe
  rationale: ‘Kusudi’ linawakilisha πρόθεσις kwa usahihi, na ‘lake mwenyewe’ hudhihirisha msisitizo wa ἰδίαν bila kuingiza wazo jipya.
- source_word: χάριν
  choice: neema yake
  rationale: ‘Neema’ ni istilahi ya kawaida na yenye uzito unaofaa kwa χάρις katika maandishi ya Paulo; kiwakilishi ‘yake’ kinaeleweka pamoja na ‘kusudi lake mwenyewe’.
- source_word: τὴν δοθεῖσαν ἡμῖν
  choice: Neema hiyo tulipewa
  rationale: Uambatano wa kisarufi wa Kigiriki unaelekeza kishiriki hiki kwa ‘neema.’ Sentensi mpya fupi inaondoa utata wa marejeo katika Kiswahili na kubaki karibu na maana ya chanzo.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: katika Masihi Yesu
  rationale: ‘Masihi’ hutafsiri Χριστός kama cheo chenye maana, na ‘katika’ huhifadhi muundo muhimu wa ἐν bila kuamua zaidi aina ya uhusiano.
- source_word: πρὸ χρόνων αἰωνίων
  choice: kabla ya nyakati za milele
  rationale: Tafsiri hii inadumisha usemi usio wa kawaida wa Kigiriki kuhusu nyakati au zama za milele; tanbihi zinatoa miundo mingine ya asili zaidi.
theological_decisions:
- issue: Iwapo Χριστός itafsiriwe kama cheo au itumike kama sehemu ya jina
  choice: Masihi Yesu
  alternative: Kristo Yesu
  rationale: Katika kifungu hiki Χριστός bado hubeba maana ya cheo; ‘Masihi’ huiwasilisha maana hiyo badala ya kuihamisha tu kwa sauti.
- issue: Nguvu ya kisarufi ya κλήσει ἁγίᾳ
  choice: kwa mwito mtakatifu
  alternative: kwenye mwito mtakatifu; kwa njia ya mwito mtakatifu
  rationale: Dative ya Kigiriki inaweza kuhusishwa na njia, hali, au lengo la kuitwa. Tafsiri kuu ni fupi na tanbihi huhifadhi uwezekano mwingine badala ya kuufunga.
- issue: Maana ya πρὸ χρόνων αἰωνίων
  choice: kabla ya nyakati za milele
  alternative: kabla ya zama kuanza; kabla ya wakati kuanza
  rationale: Usemi wa Kigiriki unaweza kutafsiriwa kwa ukaribu au kwa nahau. Tafsiri kuu huhifadhi taswira ya ‘nyakati,’ na tanbihi zinaonyesha tafsiri za kinahau.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa kifungu umehifadhiwa kama mwendelezo wa mstari uliotangulia, ndiyo sababu unaanza na ‘ambaye’ na kuishia kwa koma. Sentensi ya pili fupi inafafanua kwa usahihi kwamba τὴν δοθεῖσαν linarejelea neema.
