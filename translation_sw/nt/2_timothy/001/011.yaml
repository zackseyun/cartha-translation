translation:
  language: sw
  text: Kwa ajili ya jambo hili mimi niliteuliwa kuwa mpiga mbiu, mtume, na mwalimu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mhubiri.” Neno la Kigiriki humaanisha mtangazaji rasmi au mtu anayetoa tangazo hadharani.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ὃ
  choice: Kwa ajili ya hiyo
  rationale: Kifungu hiki kinarejelea injili iliyotajwa katika muktadha uliotangulia na kinaonyesha kusudi au jambo ambalo Paulo aliwekewa huduma.
- source_word: ἐτέθην
  choice: niliwekwa
  rationale: Katika muktadha wa majukumu yanayofuata, kitenzi hiki kina maana ya kuwekwa au kuteuliwa rasmi kwa huduma. “Niliwekwa” ni cha asili na pia kinadumisha taswira ya Kigiriki.
- source_word: ἐγὼ
  choice: mimi
  rationale: Kiwakilishi kilichotajwa wazi katika Kigiriki kina uzito wa msisitizo; kukiweka kama “mimi” kunahifadhi msisitizo huo kwa Kiswahili.
- source_word: κῆρυξ
  choice: mpiga mbiu
  rationale: Neno hili humaanisha mtu aliyepewa rasmi jukumu la kutangaza ujumbe hadharani. “Mpiga mbiu” linahifadhi wazo la mtangazaji rasmi kuliko “mhubiri,” ambalo linaweza kueleweka kama cheo cha kanisa.
- source_word: ἀπόστολος
  choice: mtume
  rationale: Katika Paulo kujitaja mwenyewe, hili ni jina linalotambulika la jukumu lake la kitume; “mtume” ndiyo tafsiri ya kawaida na sahihi.
- source_word: διδάσκαλος
  choice: mwalimu
  rationale: Hii ndiyo maana ya kawaida ya neno la Kigiriki na ni Kiswahili wazi, cha kawaida, na chenye heshima.
theological_decisions:
- issue: Iwapo κῆρυξ litafsiriwe kwa neno la kawaida la kikanisa “mhubiri” au kwa neno linaloonyesha mtangazaji rasmi
  choice: mpiga mbiu
  alternative: mhubiri
  rationale: “Mpiga mbiu” linaonyesha jukumu rasmi la kutangaza ujumbe hadharani na halipunguzi maana kuwa cheo cha baadaye cha kikanisa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo unahifadhi msisitizo wa “mimi” na orodha ya majukumu matatu bila kuingiza istilahi za dhehebu.
