  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: δῴη αὐτῷ ὁ κύριος εὑρεῖν ἔλεος παρὰ κυρίου ἐν ἐκείνῃ τῇ ἡμέρᾳ— καὶ ὅσα ἐν Ἐφέσῳ διηκόνησεν, βέλτιον σὺ γινώσκεις.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/018.yaml
  text: May the Lord grant him to find mercy from the Lord on that day—and you know better how much he served in Ephesus[a][b][c].
translation:
  language: sw
  text: Bwana amjalie kupata rehema kutoka kwa Bwana siku ile—nawe unajua vizuri zaidi jinsi alivyohudumu huko Efeso.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mbele za Bwana” au “pamoja na Bwana”; tafsiri “kutoka kwa Bwana” huchukua παρά κυρίου kuwa inaonyesha chanzo, ingawa wengine huielewa kuwa inasisitiza kuwapo mbele za Bwana.
    reason: lexical_alternative
  - marker: b
    text: “Siku ile” ni usemi unaotumiwa mara nyingi katika Agano Jipya kurejelea siku ijayo ya hukumu au kutetewa na Mungu.
    reason: cross_reference
  - marker: c
    text: Au, “huduma zote alizofanya.” Usemi wa Kigiriki unajumlisha kiwango cha huduma yake huko Efeso.
    reason: lexical_alternative
lexical_decisions:
- source_word: δῴη αὐτῷ ὁ κύριος
  choice: Bwana na amjalie
  rationale: Kauli ya kutakia au kuomba ya optative imewasilishwa kwa muundo wa Kiswahili wa ombi, “na amjalie,” ambao ni wa asili na wenye heshima.
- source_word: εὑρεῖν ἔλεος
  choice: kupata rehema
  rationale: Huhifadhi sitiari ya Kigiriki ya “kuipata rehema” bila kuibadili kuwa ufafanuzi wa “kupokea.”
- source_word: παρὰ κυρίου
  choice: kutoka kwa Bwana
  rationale: παρά pamoja na genitive hapa inaeleweka kwa kawaida kuwa chanzo. Kurudiwa kwa “Bwana” kumehifadhiwa badala ya kuondolewa.
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: siku ile
  rationale: Ni usemi wa kawaida na wa asili wa Kiswahili unaohifadhi rejeo lisilofafanuliwa la Kigiriki.
- source_word: ὅσα ... διηκόνησεν
  choice: jinsi alivyotumika
  rationale: Muundo huu unajumlisha ukubwa na namna ya huduma yake kwa Kiswahili cha kawaida, bila kuongeza aina mahususi ya huduma.
- source_word: ἐν Ἐφέσῳ
  choice: huko Efeso
  rationale: “Huko” ni kiashiria asilia cha mahali katika muktadha huu; jina la mahali limetolewa kwa umbo lililozoeleka la Kiswahili.
- source_word: βέλτιον σὺ γινώσκεις
  choice: nawe unajua vizuri zaidi
  rationale: Huhifadhi nguvu ya ulinganisho ya βέλτιον bila kuongeza wazi kitu cha kulinganishwa ambacho hakikutajwa katika Kigiriki.
theological_decisions:
- issue: Rejeo la neno “Bwana” lililorudiwa (ὁ κύριος ... παρὰ κυρίου)
  choice: Matukio yote mawili yametafsiriwa “Bwana” bila kubainisha nafsi tofauti.
  alternative: “Bwana” wa kwanza ni Kristo na wa pili ni Mungu Baba; au yote mawili yanamrejelea Kristo.
  rationale: Kigiriki hakitofautishi wazi marejeo hayo. Tafsiri inahifadhi urudiaji na utata wa kiteolojia.
- issue: Maana ya kieskatolojia ya “siku ile”
  choice: Usemi umeachwa kuwa “siku ile” bila ufafanuzi ndani ya mstari.
  alternative: “siku ya hukumu” au “siku ya mwisho.”
  rationale: Muktadha huenda unaelekeza kwenye siku ijayo ya hukumu au uthibitisho wa Mungu, lakini maandishi yenyewe yanasema tu “siku ile.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Na amjalie” hudumisha sauti ya ombi; “rehema,” “Bwana,” na “siku ile” huhifadhi istilahi na mkazo wa kibiblia bila kuongeza ufafanuzi wa kimadhehebu.
