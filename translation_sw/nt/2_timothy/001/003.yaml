  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Χάριν ἔχω τῷ θεῷ, ᾧ λατρεύω ἀπὸ προγόνων ἐν καθαρᾷ συνειδήσει, ὡς ἀδιάλειπτον ἔχω τὴν περὶ σοῦ μνείαν ἐν ταῖς δεήσεσίν μου, νυκτὸς καὶ ἡμέρας
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/003.yaml
  text: I thank God[a], whom I serve as my ancestors did with a clean conscience[c][b], as I constantly remember you in my prayers night and day.
translation:
  language: sw
  text: Ninamshukuru Mungu, ambaye ninamtumikia[a] kwa dhamiri safi kama walivyofanya mababu zangu[b], huku nikikukumbuka daima katika maombi yangu[c], usiku na mchana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ninamwabudu.” Kitenzi cha Kigiriki kinaweza kumaanisha huduma ya kidini au ibada inayotolewa kwa Mungu.
    reason: lexical_alternative
  - marker: b
    text: Kwa tafsiri ya karibu, “kutoka kwa mababu.” Kirai hiki kinaweza pia kutafsiriwa “katika mapokeo ya mababu zangu”; kinaonyesha mwendelezo wa imani na huduma ya mababu.
    reason: lexical_alternative
  - marker: c
    text: Kwa tafsiri ya karibu, “nina kumbukumbu isiyokoma kukuhusu katika dua zangu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Χάριν ἔχω τῷ θεῷ
  choice: Ninamshukuru Mungu
  rationale: Nahau ya Kigiriki χάριν ἔχω pamoja na yambwa katika hali ya dative ina maana ya kumshukuru mtu. Kiswahili cha moja kwa moja na cha kawaida ni “Ninamshukuru Mungu.”
- source_word: ᾧ λατρεύω
  choice: ambaye ninamtumikia
  rationale: λατρεύω hueleza huduma ya kidini inayotolewa kwa Mungu na pia inaweza kumaanisha kumwabudu. “Ninamtumikia” huhifadhi upana huo bila kuifanya kuwa ibada ya liturujia pekee.
- source_word: ἀπὸ προγόνων
  choice: kama walivyofanya mababu zangu
  rationale: Kirai hiki kinaonyesha mwendelezo kati ya huduma ya Paulo kwa Mungu na imani ya mababu zake. Tafsiri hii ni ya kawaida katika Kiswahili huku tanbihi ikihifadhi umbo halisi na uwezekano mwingine wa maana.
- source_word: ἐν καθαρᾷ συνειδήσει
  choice: kwa dhamiri safi
  rationale: Kirai kinaeleza namna Paulo anavyomtumikia Mungu. “Dhamiri safi” ni usemi wa asili, wazi, na wenye hadhi katika Kiswahili.
- source_word: ὡς
  choice: huku
  rationale: ὡς hapa huunganisha shukrani na hali ya Paulo kumkumbuka Timotheo katika maombi. “Huku” huhifadhi uhusiano huo bila kuufanya kwa lazima kuwa sababu au wakati maalumu.
- source_word: ἀδιάλειπτον ἔχω τὴν περὶ σοῦ μνείαν
  choice: nikikukumbuka daima
  rationale: Usemi wa Kigiriki ni wa kinomino, yaani kuwa na kumbukumbu isiyokoma kumhusu Timotheo. Kiswahili cha kitenzi “nikikukumbuka daima” ni cha kawaida na huwasilisha maana hiyo.
- source_word: ἐν ταῖς δεήσεσίν μου
  choice: katika maombi yangu
  rationale: δέησις hulenga ombi au dua, lakini “maombi” ni neno la kawaida na linalofaa katika muktadha huu.
- source_word: νυκτὸς καὶ ἡμέρας
  choice: usiku na mchana
  rationale: Huu ni usemi wa kawaida unaoonyesha kuendelea au kurudiwa mara kwa mara; “usiku na mchana” ni sawa na wa asili katika Kiswahili.
theological_decisions:
- issue: Uhusiano wa huduma ya Paulo kwa Mungu na urithi wa mababu zake katika ἀπὸ προγόνων
  choice: kama walivyofanya mababu zangu
  alternative: kutoka kwa mababu zangu; katika mapokeo ya mababu zangu
  rationale: Tafsiri inaonyesha mwendelezo na imani ya mababu bila kudai kwamba Paulo anategemea tu mapokeo yao, wala bila kuingiza madai ya ziada kuhusu nafasi ya urithi huo. Tanbihi huhifadhi hali ya kirai cha asili kuwa na zaidi ya uwezekano mmoja.
- issue: Maana ya λατρεύω
  choice: ninamtumikia
  alternative: ninamwabudu
  rationale: Kitenzi hiki kinaweza kueleza ibada pamoja na huduma takatifu kwa Mungu. “Ninamtumikia” huhifadhi wigo mpana, na “ninamwabudu” umetajwa katika tanbihi kama tafsiri halali.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imetumia “huku” ili kuunganisha shukrani na maombi bila kulazimisha maana ya sababu. “Mababu zangu” inaeleweka kwa wasomaji wa kawaida na huepuka usemi wa zamani au wenye ubaguzi wa kijinsia usio wa lazima.
