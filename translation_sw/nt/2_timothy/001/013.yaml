  terminology: “Kielelezo,” “Shikilia,” “imani,” “upendo,” and “Masihi Yesu” are appropriate. The traditional “Kristo Yesu” alternative is correctly retained. Footnote b is anchored at the full phrase whose syntactic attachment is disputed.
