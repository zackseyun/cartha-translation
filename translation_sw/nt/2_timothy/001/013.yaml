  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὑποτύπωσιν ἔχε ὑγιαινόντων λόγων ὧν παρ’ ἐμοῦ ἤκουσας ἐν πίστει καὶ ἀγάπῃ τῇ ἐν Χριστῷ Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/013.yaml
  text: Hold to the pattern of sound words that you heard from me[c][b][a], in the faith and love that are in Messiah Jesus.
translation:
  language: sw
  text: Shikilia kielelezo cha maneno yenye afya uliyoyasikia kutoka kwangu, kwa imani[a] na upendo vilivyo katika Masihi Yesu[c][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa uaminifu na upendo.” Neno la Kigiriki lililotafsiriwa “imani” linaweza pia kumaanisha “uaminifu” au “tumaini.”
    reason: lexical_alternative
  - marker: b
    text: Au, “Shikilia kielelezo cha maneno yenye afya uliyoyasikia kutoka kwangu kuhusu imani na upendo katika Masihi Yesu.” Muundo wa Kigiriki unaweza kueleweka kuwa unaonyesha ama namna Timotheo anavyopaswa kushikilia kielelezo, ama yaliyomo katika maneno hayo.
    reason: alternative_reading
  - marker: c
    text: 'Tafsiri ya jadi: “Kristo Yesu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποτύπωσιν
  choice: kielelezo
  rationale: Neno hili huonyesha mfano au mpangilio wa kufuatwa. “Kielelezo” ni la kawaida, lenye heshima, na halibani maana kuwa muhtasari tu.
- source_word: ἔχε
  choice: Shikilia
  rationale: Ingawa maana ya msingi ni “kuwa na,” amri hii inamtaka Timotheo aendelee kushika na kufuata kielelezo hicho; “shikilia” huwasilisha nguvu hiyo kwa Kiswahili cha kawaida.
- source_word: ὑγιαινόντων λόγων
  choice: maneno yenye uzima
  rationale: ὑγιαίνω hutumia picha ya afya au uzima kuonyesha yaliyo sahihi na yenye manufaa. “Maneno yenye uzima” huhifadhi picha hiyo na kubaki karibu na λόγων, “maneno,” bila kuifasiri moja kwa moja kuwa “mafundisho.”
- source_word: ὧν παρ’ ἐμοῦ ἤκουσας
  choice: uliyoyasikia kutoka kwangu
  rationale: παρά pamoja na hali ya genitive huonyesha chanzo hapa. Muundo huu ni wa kawaida na unaunganisha kishazi hicho na “maneno.”
- source_word: ἐν πίστει
  choice: kwa imani
  rationale: “Kwa” huonyesha namna ambayo Timotheo anapaswa kushikilia kielelezo. πίστις kwa kawaida ni “imani,” huku maana mbadala ya uaminifu ikihifadhiwa katika tanbihi.
- source_word: καὶ ἀγάπῃ
  choice: na upendo
  rationale: ἀγάπη limetafsiriwa moja kwa moja kuwa “upendo,” neno la kawaida na lenye upana unaofaa.
- source_word: τῇ ἐν Χριστῷ Ἰησοῦ
  choice: vilivyo katika Masihi Yesu
  rationale: Makubaliano ya wingi yanaonyesha kwamba imani na upendo kwa pamoja zinaelezwa kuwa katika Masihi Yesu, bila kuongeza maelezo ya kitheolojia yasiyomo wazi katika chanzo.
- source_word: Χριστῷ Ἰησοῦ
  choice: Masihi Yesu
  rationale: Χριστός bado ina nguvu ya cheo katika muundo huu. “Masihi” huwasilisha maana ya aliyetiwa mafuta, huku tafsiri ya jadi ikitajwa katika tanbihi.
theological_decisions:
- issue: Uhusiano wa ἐν πίστει καὶ ἀγάπῃ τῇ ἐν Χριστῷ Ἰησοῦ
  choice: 'Kirai kinaeleza namna au mazingira ya Timotheo kushikilia kielelezo: kwa imani na upendo vilivyo katika Masihi Yesu.'
  alternative: Kirai kinaweza kueleza yaliyomo katika maneno yenye uzima, yaani maneno kuhusu imani na upendo katika Masihi Yesu.
  rationale: Mtiririko wa himizo unaunga mkono zaidi maana ya namna Timotheo anavyopaswa kushikilia kielelezo, lakini sintaksia ya Kigiriki hairuhusu maana nyingine iondolewe; kwa hiyo imehifadhiwa katika tanbihi.
- issue: Tafsiri ya Χριστός
  choice: Masihi
  alternative: Kristo
  rationale: Hapa neno hilo linaendelea kufanya kazi kama cheo, hivyo “Masihi” huhifadhi maana yake wazi zaidi. “Kristo,” tafsiri iliyozoeleka, imetolewa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Shikilia” na “kielelezo” ni maneno yanayoeleweka kwa urahisi; “maneno yenye uzima” huhifadhi sitiari ya Kigiriki bila kutumia istilahi nzito ya kitaaluma. Alama zote za tanbihi zimewekwa moja kwa moja baada ya maneno au kishazi kinachohusika.
