  text: δῴη ἔλεος ὁ κύριος τῷ Ὀνησιφόρου οἴκῳ, ὅτι πολλάκις με ἀνέψυξεν, καὶ τὴν ἅλυσίν μου οὐκ ἐπαισχύνθη·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/016.yaml
  text: May the Lord grant mercy to the household of Onesiphorus[a], because he often refreshed me and was not ashamed of my chain.
translation:
  language: sw
  text: Bwana awajalie rehema watu wa nyumbani mwa Onesiforo, kwa sababu mara nyingi aliniburudisha, wala hakuuonea aibu mnyororo wangu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kifungo changu”; kihalisi, “mnyororo wangu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δῴη
  choice: na aujalie
  rationale: Kauli ya kutakia katika aoristi inaonyesha ombi au dua; “na aujalie” huwasilisha maana hiyo kwa Kiswahili cha kawaida na chenye heshima.
- source_word: ἔλεος
  choice: rehema
  rationale: “Rehema” ni neno la kawaida la kibiblia na la sasa kwa fadhili za Mungu kwa mwenye uhitaji.
- source_word: ὁ κύριος
  choice: Bwana
  rationale: Ni tafsiri ya kawaida ya cheo cha kimungu κύριος, bila kubainisha hapa kama anayerejelewa ni Baba au Yesu.
- source_word: τῷ Ὀνησιφόρου οἴκῳ
  choice: watu wa nyumbani mwa Onesiforo
  rationale: οἶκος hapa inaelekea kumaanisha jamaa au kaya, si jengo pekee; usemi huu ni wa asili katika Kiswahili na huhifadhi maana pana ya kaya.
- source_word: ὅτι
  choice: kwa sababu
  rationale: Huonyesha wazi sababu ya dua iliyotangulia.
- source_word: πολλάκις
  choice: mara nyingi
  rationale: Ni tafsiri ya kawaida na sahihi ya tendo lililorudiwa.
- source_word: ἀνέψυξεν
  choice: aliniburudisha
  rationale: Huhifadhi sitiari ya kumpa Paulo nafuu na nguvu mpya, huku ikiweza kujumuisha faraja na msaada.
- source_word: τὴν ἅλυσίν μου
  choice: mnyororo wangu
  rationale: Huhifadhi umoja na picha halisi ya ἅλυσις; huenda mnyororo huo ukawakilisha kifungo cha Paulo, jambo linalofafanuliwa katika tanbihi.
- source_word: οὐκ ἐπαισχύνθη
  choice: wala hakuuonea aibu
  rationale: Huonyesha kwamba Onesiforo hakufedheheka wala kujitenga na Paulo kwa sababu ya mnyororo wake.
theological_decisions:
- issue: Anayerejelewa na “Bwana” katika dua ya Paulo
  choice: Bwana
  alternative: Mungu Baba; au Bwana Yesu
  rationale: Kigiriki kinasema tu ὁ κύριος. Tafsiri haibainishi zaidi ili kuhifadhi kutotajwa wazi kwa mhusika katika mstari huu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa dua umehifadhiwa kwa “na aujalie,” na picha halisi ya mnyororo imeachwa katika matini kuu.
