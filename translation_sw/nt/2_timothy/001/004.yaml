  yaml_path: translation/nt/2_timothy/001/004.yaml
  text: longing to see you[a], remembering your tears, so that I may be filled with joy,
translation:
  language: sw
  text: ninatamani sana kukuona[a], nikiyakumbuka machozi yako, ili nijazwe furaha,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nina shauku kubwa ya kukuona.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιποθῶν
  choice: ninatamani sana
  rationale: Kitenzi hiki kinaonyesha hamu kubwa ya kibinafsi. ‘Ninatamani sana’ ni Kiswahili cha kawaida kinachohifadhi uzito wa hisia katika neno la Kigiriki.
- source_word: σε ἰδεῖν
  choice: kukuona
  rationale: Muundo huu unaonyesha kwamba jambo linalotamaniwa ni kumwona Timotheo. ‘Kukuona’ ni wa moja kwa moja na wa asili.
- source_word: μεμνημένος
  choice: nikiyakumbuka
  rationale: Hali timilifu ya kisarufi inaonyesha kumbukumbu inayoendelea kuwapo. ‘Nikiyakumbuka’ inaunganisha jambo hilo kwa kawaida na tamanio la kumwona.
- source_word: σου τῶν δακρύων
  choice: machozi yako
  rationale: Hii inarejelea moja kwa moja machozi ya Timotheo bila kufasiri zaidi kuwa kilio.
- source_word: ἵνα
  choice: ili
  rationale: ‘Ili’ huonyesha kusudi au matokeo yanayokusudiwa na kuhifadhi uhusiano wa kishazi bila kuamua kupita kiasi kati ya maana hizo.
- source_word: χαρᾶς
  choice: furaha
  rationale: Pamoja na kitenzi ‘kujazwa,’ Kiswahili cha asili husema ‘kujazwa furaha.’
- source_word: πληρωθῶ
  choice: nijazwe
  rationale: Huhifadhi nafsi ya kwanza, hali ya kutendwa, na utegemezi wa kishazi kinachoanzishwa na ἵνα.
