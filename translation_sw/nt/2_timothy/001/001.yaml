id: 2TI.1.1
reference: 2 Timothy 1:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Παῦλος ἀπόστολος ⸂Χριστοῦ Ἰησοῦ⸃ διὰ θελήματος θεοῦ κατ’ ἐπαγγελίαν ζωῆς τῆς ἐν Χριστῷ Ἰησοῦ
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/001.yaml
  text: Paul[a], an apostle of Messiah Jesus by the will of God, according to the promise of the life that is in Messiah Jesus,
translation:
  language: sw
  text: Paulo, mtume wa Masihi Yesu[a] kwa mapenzi ya Mungu, kwa mujibu wa ahadi ya uzima ulio katika Masihi Yesu,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kristo Yesu” katika sehemu zote mbili ambapo “Masihi Yesu” limetumika.
    reason: Tafsiri mbadala ya Χριστός inayotumia umbo la kawaida la mapokeo ya Kiswahili.
lexical_decisions:
- source_word: Παῦλος
  choice: Paulo
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili cha Biblia na matumizi mapana ya Kiswahili.
- source_word: ἀπόστολος
  choice: mtume
  rationale: Neno hili huhifadhi maana maalumu ya mtu aliyetumwa na kupewa mamlaka, hasa katika utambulisho wa Paulo.
- source_word: Χριστοῦ Ἰησοῦ / Χριστῷ Ἰησοῦ
  choice: Masihi Yesu
  rationale: Χριστός lina nguvu ya cheo katika vifungu vyote viwili; ‘Masihi’ hutafsiri cheo hicho badala ya kukitaja tu kwa umbo la mkopo.
- source_word: διὰ θελήματος θεοῦ
  choice: kwa mapenzi ya Mungu
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaoonyesha kwamba utume wake unatokana na mapenzi na mamlaka ya Mungu.
- source_word: κατ’ ἐπαγγελίαν
  choice: kwa mujibu wa ahadi
  rationale: Unahifadhi wazo la kupatana au kuwiana na ahadi bila kulazimisha uhusiano wa kusudi ambao maandishi hayasemi wazi.
- source_word: ζωῆς
  choice: ya uzima
  rationale: ‘Uzima’ hufaa katika muktadha wa maisha yanayotolewa au kupatikana katika Masihi na huhifadhi uzito wa kitheolojia wa ζωή.
- source_word: τῆς ἐν Χριστῷ Ἰησοῦ
  choice: ulio katika Masihi Yesu
  rationale: Kirai hiki kinabainisha uzima unaosemwa na kuhifadhi maana pana ya uhusiano ya ἐν bila kuifafanua kupita kiasi.
theological_decisions:
- issue: Tafsiri ya Χριστός
  choice: Masihi
  alternative: Kristo
  rationale: Katika salamu hii neno linaendelea kutambulika kama cheo; ‘Masihi’ huwasilisha maana hiyo moja kwa moja. ‘Kristo’ limetolewa katika tanbihi kwa kuwa ni umbo la kawaida la mapokeo ya Kiswahili.
- issue: Uhusiano wa κατ’ ἐπαγγελίαν na utume wa Paulo
  choice: kwa mujibu wa ahadi
  alternative: kwa ajili ya ahadi
  rationale: κατά hapa kwa kawaida huonyesha kuwiana na ahadi. Tafsiri iliyochaguliwa haiongezi dai kwamba ahadi ndiyo kusudi pekee la utume wake.
- issue: Maana ya ἐν Χριστῷ Ἰησοῦ
  choice: katika Masihi Yesu
  alternative: kwa kuunganishwa na Masihi Yesu
  rationale: Tafsiri ya moja kwa moja huhifadhi upana na mvutano wa usemi wa Paulo bila kuamua ikiwa msisitizo ni mahali, uhusiano, au muungano.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa salamu umehifadhiwa kama kishazi kinachoendelea, na msamiati wa kimapokeo umetumiwa pale unapobaki wazi na wa kawaida.
