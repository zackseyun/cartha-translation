base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/014.yaml
  text: Guard the good deposit through the Holy Spirit who dwells in us[a][b].
translation:
  language: sw
  text: Ilinde amana njema[a] kwa njia ya Roho Mtakatifu anayekaa ndani yetu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kile chema ulichokabidhiwa kukihifadhi.”
    reason: lexical_alternative
  - marker: b
    text: Au “kwa Roho Mtakatifu anayeishi ndani yetu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παραθήκην
  choice: amana
  rationale: Katika muktadha huu παραθήκη ni kitu cha thamani kilichokabidhiwa mtu akihifadhi. Neno “amana” ni la kawaida katika Kiswahili sanifu na linadumisha sitiari hiyo bila kutaja moja kwa moja kuwa ni injili au huduma.
- source_word: καλὴν
  choice: njema
  rationale: καλός hapa inaeleza ubora wa kile kilichokabidhiwa. “Njema” ni ya asili kwa “amana” na haifungi maana katika uzuri wa sura au thamani ya mali pekee.
- source_word: φύλαξον
  choice: Ilinde
  rationale: Kauli ya amri inataka ulinzi wa makusudi na wenye bidii. “Ilinde” ni ya moja kwa moja na yenye nguvu kuliko “itunze” peke yake.
- source_word: διὰ πνεύματος ἁγίου
  choice: kwa njia ya Roho Mtakatifu
  rationale: διά pamoja na hali ya genitive huonyesha njia au utendaji. “Kwa njia ya” inadumisha maana hiyo huku ikibaki Kiswahili cha kawaida.
- source_word: τοῦ ἐνοικοῦντος ἐν ἡμῖν
  choice: anayekaa ndani yetu
  rationale: Kitenzi-shirikishi cha wakati uliopo kinaonyesha kuwapo kunakoendelea. “Anayekaa ndani yetu” ni wazi na hakitumii istilahi nzito ya kitaalamu.
- source_word: ἐν ἡμῖν
  choice: ndani yetu
  rationale: Hii inadumisha maana ya kawaida ya uwepo wa Roho ndani ya watu bila kuamua kama “sisi” ni Paulo na Timotheo pekee au waamini kwa ujumla.
theological_decisions:
- issue: Kirejewa cha “amana njema”
  choice: Kirai kimeachwa kwa ujumla kama “amana njema.”
  alternative: Ujumbe wa injili uliokabidhiwa Timotheo; au huduma/agizo lake.
  rationale: Muktadha unaelekeza kwenye injili au hazina ya mafundisho ya kitume, lakini Kigiriki hakitaji kirejewa hicho wazi. Tafsiri haikifafanui kimadhehebu.
- issue: Upeo wa “yetu”
  choice: Kiwakilishi “yetu” kimehifadhiwa bila kukibana.
  alternative: Paulo na Timotheo hasa; au waamini wote kwa ujumla.
  rationale: ἡμῖν inaweza kumaanisha washiriki wa karibu wanaotajwa au jumuiya pana ya waamini. Tafsiri inadumisha utata huo.
- issue: Maana ya διά katika uhusiano na Roho Mtakatifu
  choice: “kwa njia ya”
  alternative: “kwa msaada wa” au “kwa nguvu za” Roho Mtakatifu.
  rationale: Tafsiri iliyochaguliwa inaonyesha njia au utendaji wa Roho bila kuongeza wazi dhana ya msaada au nguvu ambayo haikutajwa moja kwa moja.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye heshima na kinachoeleweka kwa msomaji wa kawaida. “Amana” hudumisha sitiari ya kitu kilichokabidhiwa kwa ajili ya kuhifadhiwa; “anayekaa ndani yetu” ni ya asili na inadumisha wazo la uwepo unaoendelea.
