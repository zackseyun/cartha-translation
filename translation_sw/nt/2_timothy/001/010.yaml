source:
  edition: SBLGNT
  text: φανερωθεῖσαν δὲ νῦν διὰ τῆς ἐπιφανείας τοῦ σωτῆρος ἡμῶν ⸂Ἰησοῦ Χριστοῦ⸃, καταργήσαντος μὲν τὸν θάνατον φωτίσαντος δὲ ζωὴν καὶ ἀφθαρσίαν διὰ τοῦ εὐαγγελίου,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/010.yaml
  text: but has now been revealed through the appearing of our Savior Jesus the Messiah[a], who indeed abolished death and brought life and incorruptibility to light through the gospel[b],
translation:
  language: sw
  text: lakini sasa imefunuliwa kwa kujitokeza kwa Mwokozi wetu, Yesu Masihi[a], ambaye aliibatilisha mauti na akafanya uzima na kutoharibika vijulikane[b] kwa njia ya injili,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Yesu Kristo.” Neno la Kigiriki Χριστός linaweza kutumika kama cheo (“Masihi”) au kama jina linalofanana na jina maalumu (“Kristo”).
    reason: alternative_reading
  - marker: b
    text: Au “kutokufa.” Neno la Kigiriki linasisitiza hali ya kutoharibika, kutooza, au kuwa huru kutokana na uharibifu.
    reason: lexical_alternative
lexical_decisions:
- source_word: φανερωθεῖσαν
  choice: imefunuliwa
  rationale: Kitenzi cha kutendwa kinarejelea neema ya Mungu katika mstari uliotangulia; “imefunuliwa” ni Kiswahili cha sasa, wazi, na kinahifadhi hali ya kutendwa.
- source_word: ἐπιφανείας
  choice: kutokea
  rationale: “Kutokea” linaeleza kujitokeza kwa Mwokozi katika historia bila kutumia neno la kitaalamu au kupanua maana kuwa mafundisho kuhusu ujio.
- source_word: σωτῆρος
  choice: Mwokozi
  rationale: Ni tafsiri iliyozoeleka na sahihi ya cheo hiki, ikihifadhi wazo la kuokoa.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesu Masihi
  rationale: Baada ya cheo “Mwokozi wetu,” Χριστός bado lina nguvu ya cheo cha Kimasihi; Kiswahili hakihitaji kibainishi kinacholingana na “the” ya Kiingereza.
- source_word: καταργήσαντος
  choice: aliibatilisha
  rationale: “Aliibatilisha” linaonyesha ushindi wenye uamuzi na kuondolewa kwa nguvu ya mauti bila kudai kwamba mauti haipo tena kabisa katika wakati huu.
- source_word: θάνατον
  choice: mauti
  rationale: “Mauti” ni neno la heshima na la kawaida katika sajili ya kibiblia ya Kiswahili, na linadumisha uzito wa kifungu.
- source_word: φωτίσαντος
  choice: kuudhihirisha
  rationale: Katika muktadha huu kitenzi kina maana ya kuleta wazi au kufanya ujulikane; “kuudhihirisha” ni cha asili na kinaunganika vizuri na “uzima.”
- source_word: ζωὴν
  choice: uzima
  rationale: Ni tafsiri ya moja kwa moja inayohifadhi uzito wa wokovu na wakati ujao bila kuufafanua kupita maandishi.
- source_word: ἀφθαρσίαν
  choice: kutoharibika
  rationale: Neno hili linahifadhi mkazo wa Kigiriki juu ya kutooza au kutoharibika kuliko “kutokufa,” ambalo linaweza kueleweka tu kuwa kuendelea kuwapo milele.
- source_word: διὰ τοῦ εὐαγγελίου
  choice: kwa njia ya injili
  rationale: “Kwa njia ya” linaonyesha njia au chombo, na “injili” ni neno sanifu, linaloeleweka, na lenye uzito unaofaa.
- source_word: μὲν ... δὲ
  choice: aliibatilisha ... na kuudhihirisha
  rationale: Muundo huu unaonyesha matendo mawili yanayotofautiana na kukamilishana; Kiswahili cha asili kinaweza kuyawasilisha kwa “na” bila uradidi mzito.
theological_decisions:
- issue: Maana ya Χριστοῦ katika mfuatano Ἰησοῦ Χριστοῦ
  choice: Yesu Masihi
  alternative: Yesu Kristo
  rationale: Muktadha baada ya “Mwokozi wetu” unaruhusu cheo cha Kimasihi kusikika wazi. Mbadala wa matumizi yanayofanana na jina umehifadhiwa katika tanbihi.
- issue: Nguvu ya καταργήσαντος kuhusiana na mauti
  choice: aliibatilisha mauti
  alternative: aliiondolea mauti nguvu
  rationale: Tafsiri hii inatangaza ushindi wa uamuzi wa Yesu juu ya mauti lakini haiondoi mvutano wa kitheolojia unaotokana na kuendelea kuwapo kwa mauti katika wakati huu.
- issue: Maana ya ἀφθαρσίαν
  choice: kutoharibika
  alternative: kutokufa
  rationale: “Kutoharibika” linaakisi kwa ukaribu zaidi uhuru kutokana na uharibifu au kuoza; “kutokufa” ni mbadala unaojulikana lakini mwembamba zaidi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo umebaki kuwa sehemu ya sentensi inayoendelea kutoka mstari uliotangulia. “Mauti” na “injili” yanadumisha sajili ya kibiblia iliyozoeleka bila kutumia lugha ya kale kupita kiasi.
