  text: Τιμοθέῳ ἀγαπητῷ τέκνῳ· χάρις, ἔλεος, εἰρήνη ἀπὸ θεοῦ πατρὸς καὶ Χριστοῦ Ἰησοῦ τοῦ κυρίου ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/002.yaml
  text: 'To Timothy[a], beloved child: grace, mercy, and peace from God the Father and Messiah Jesus our Lord.'
translation:
  language: sw
  text: 'Kwa Timotheo, mtoto mpendwa: neema, rehema, na amani kutoka kwa Mungu Baba na kwa Masihi Yesu Bwana wetu.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kristo Yesu.” Neno la Kigiriki Χριστός limetafsiriwa hapa kuwa “Masihi” ili kuhifadhi maana ya cheo hicho badala ya kutumia tu umbo la kimapokeo “Kristo.”
    reason: alternative_reading
lexical_decisions:
- source_word: Τιμοθέῳ
  choice: Kwa Timotheo
  rationale: Huwasilisha mlengwa wa barua kwa njia ya kawaida na ya wazi katika Kiswahili.
- source_word: ἀγαπητῷ τέκνῳ
  choice: mtoto mpendwa
  rationale: Neno τέκνον ni pana kuliko ‘mwana’ na hapa linaonyesha uhusiano wa kiroho; ‘mtoto mpendwa’ huhifadhi upendo na uzito wa salamu bila kuongeza ‘wangu,’ ambalo halipo katika Kigiriki.
- source_word: χάρις
  choice: neema
  rationale: Ni istilahi ya kawaida na sahihi kwa salamu hii ya Paulo.
- source_word: ἔλεος
  choice: rehema
  rationale: Huhifadhi dhana yake tofauti kando ya neema na amani.
- source_word: εἰρήνη
  choice: amani
  rationale: Ni tafsiri ya moja kwa moja inayobeba maana ya ustawi wa mahusiano na baraka za Mungu.
- source_word: ἀπὸ θεοῦ πατρὸς
  choice: kutoka kwa Mungu Baba
  rationale: Kigiriki hakina ‘wetu’ baada ya Baba; hivyo tafsiri haiongezi kimilikishi hicho.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Masihi Yesu
  rationale: Χριστός inatafsiriwa kama cheo ‘Masihi,’ huku Ἰησοῦ likihifadhiwa kama jina Yesu.
- source_word: κυρίου ἡμῶν
  choice: Bwana wetu
  rationale: Huhifadhi mamlaka na uzito wa kikristo wa κύριος pamoja na kimilikishi cha wingi.
theological_decisions:
- issue: Tafsiri ya Χριστοῦ Ἰησοῦ
  choice: Masihi Yesu
  alternative: Kristo Yesu
  rationale: Χριστός lina maana ya cheo ‘Masihi’; tafsiri hii huonyesha maana ya cheo badala ya kutegemea tu umbo la kimapokeo ‘Kristo.’ Mbadala huo umetajwa katika tanbihi.
- issue: Uhusiano unaoonyeshwa na τέκνῳ
  choice: mtoto mpendwa
  alternative: mwana mpendwa
  rationale: τέκνον halibainishi jinsia kisarufi kwa maana hii na linatumika kwa uhusiano wa kiroho; ‘mtoto’ huhifadhi upana wa sitiari hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Mpangilio wa salamu umehifadhiwa kwa ukaribu, huku ‘na kwa’ ikirudiwa kabla ya Masihi Yesu ili chanzo cha neema, rehema, na amani kisomeke kwa uwazi.
