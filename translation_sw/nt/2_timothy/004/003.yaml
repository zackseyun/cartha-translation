  text: ἔσται γὰρ καιρὸς ὅτε τῆς ὑγιαινούσης διδασκαλίας οὐκ ἀνέξονται, ἀλλὰ κατὰ τὰς ⸂ἰδίας ἐπιθυμίας⸃ ἑαυτοῖς ἐπισωρεύσουσιν διδασκάλους κνηθόμενοι τὴν ἀκοήν,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/003.yaml
  text: For the time will come when they will not put up with sound teaching[a], but according to their own desires they will heap up teachers for themselves[b], having itching ears.
translation:
  language: sw
  text: Kwa maana wakati utafika ambapo hawatavumilia mafundisho yenye afya[a]. Badala yake, kwa kufuata tamaa zao wenyewe, watajikusanyia walimu wengi, huku masikio yao yakiwashwa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “mafundisho yaliyo sahihi.” Kwa neno halisi: “mafundisho yenye afya.”'
    reason: lexical_alternative
  - marker: b
    text: Kwa neno halisi zaidi, “huku usikivu wao ukiwashwa.” Picha hii inaeleza hamu ya kusikia yale ambayo mtu anataka kuyasikia.
    reason: lexical_alternative
lexical_decisions:
- source_word: καιρὸς
  choice: wakati
  rationale: Neno hili hapa linamaanisha kipindi au wakati unaokuja; “wakati utafika” ni Kiswahili cha kawaida kinachoonyesha vizuri nguvu ya utabiri katika ἔσται.
- source_word: ὑγιαινούσης διδασκαλίας
  choice: mafundisho yenye uzima
  rationale: ὑγιαινούσης ina maana halisi ya kuwa na afya au uzima, na hapa imetumiwa kisitiari kuhusu mafundisho yaliyo sahihi na yenye kufaa. Tafsiri hii huhifadhi sitiari bila kutumia istilahi nzito.
- source_word: ἀνέξονται
  choice: hawatavumilia
  rationale: Kitenzi kina maana ya kustahimili, kuvumilia, au kukubali kuendelea na jambo; “hawatavumilia” ni wazi, cha asili, na huhifadhi wazo la kukataa.
- source_word: κατὰ τὰς ἰδίας ἐπιθυμίας
  choice: kwa kufuata tamaa zao wenyewe
  rationale: Kirai kinaonyesha kwamba tamaa zao binafsi ndizo zitakazoongoza uchaguzi wao. “Tamaa” hapa ni pana kuliko tamaa ya kingono pekee.
- source_word: ἑαυτοῖς ἐπισωρεύσουσιν διδασκάλους
  choice: watajikusanyia walimu wengi
  rationale: “Watajikusanyia” huhifadhi maana ya kujitafutia au kujilimbikizia, na “wengi” huwasilisha wazo la kuzidisha lililomo katika ἐπισωρεύσουσιν kwa Kiswahili cha kawaida.
- source_word: κνηθόμενοι τὴν ἀκοήν
  choice: huku masikio yao yakiwashwa
  rationale: Tafsiri hii huhifadhi picha ya kuwashwa kwa masikio na muundo wa kishirikishi, bila kulazimisha uhusiano wa sababu usiotajwa wazi katika Kigiriki.
theological_decisions:
- issue: Utoaji wa διδασκαλία katika muktadha wa nyaraka za kichungaji
  choice: mafundisho
  alternative: fundisho la imani
  rationale: “Mafundisho” ni ya kawaida na pana, na haiingizi maana ya kiufundi au msimamo wa kimadhehebu usiolazimishwa na neno la Kigiriki.
- issue: Nguvu ya κνηθόμενοι τὴν ἀκοήν
  choice: huku masikio yao yakiwashwa
  alternative: kwa sababu wanatamani kusikia yanayowapendeza
  rationale: Chaguo hili huhifadhi sitiari na hali ya kishirikishi ya Kigiriki, pamoja na utata wa uhusiano wake na kitenzi kikuu; mbadala hufafanua maana lakini huongeza sababu wazi zaidi kuliko maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imegawanywa baada ya kishazi cha kwanza ili isomeke kwa urahisi. Sitiari za “uzima” na “masikio kuwashwa” zimehifadhiwa, huku maelezo ya tanbihi yakisaidia ufahamu.
