source:
  edition: SBLGNT
  text: Λουκᾶς ἐστιν μόνος μετ’ ἐμοῦ. Μᾶρκον ἀναλαβὼν ἄγε μετὰ σεαυτοῦ, ἔστιν γάρ μοι εὔχρηστος εἰς διακονίαν,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/011.yaml
  text: Luke alone is with me. Pick up Mark and bring him with you, for he is useful to me for ministry.
translation:
  language: sw
  text: Luka peke yake yuko pamoja nami. Mchukue Marko, kisha uje naye, kwa maana ananifaa kwa ajili ya huduma.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa ajili ya utumishi.” Neno la Kigiriki διακονία linaweza kumaanisha utumishi kwa maana pana, ingawa hapa huenda linarejelea kazi ya huduma.
    reason: lexical_alternative
lexical_decisions:
- source_word: Λουκᾶς
  choice: Luka
  rationale: Umbo la kawaida la jina hili katika Kiswahili cha Biblia.
- source_word: μόνος
  choice: peke yake ndiye
  rationale: Huhifadhi msisitizo kwamba Luka ndiye mwandamani pekee aliyekuwa pamoja na Paulo wakati huo.
- source_word: μετ’ ἐμοῦ
  choice: aliye pamoja nami
  rationale: Hutoa maana ya kuandamana kwa lugha ya kawaida na yenye hadhi.
- source_word: Μᾶρκον
  choice: Marko
  rationale: Umbo la kawaida la jina hili katika Kiswahili cha Biblia.
- source_word: ἀναλαβὼν
  choice: Mchukue
  rationale: Kitenzi kishirikishi kinaonyesha kumchukua Marko ili aandamane na Timotheo kabla ya kuja naye.
- source_word: ἄγε μετὰ σεαυτοῦ
  choice: uje naye
  rationale: Katika muktadha huu agizo ni kwamba Timotheo aje akiwa ameandamana na Marko; Kiswahili hiki ni cha asili na huepuka urudiaji mzito.
- source_word: γάρ μοι
  choice: kwa maana ananifaa
  rationale: Huhifadhi sababu inayotolewa na pia uhusiano wa manufaa kwa Paulo.
- source_word: εὔχρηστος
  choice: ananifaa
  rationale: Hutoa maana ya kuwa mwenye manufaa au msaada kwa mtu fulani kwa Kiswahili cha kawaida, bila sauti ya kumdhalilisha mtu kama chombo.
- source_word: εἰς διακονίαν
  choice: katika huduma
  rationale: Huduma linaweza kurejelea kazi ya kuhudumu kwa upana na, katika muktadha huu, kazi ya huduma ya kitume; tanbihi huhifadhi uwezekano mpana zaidi.
theological_decisions:
- issue: Maana ya διακονία katika kauli kuhusu kufaa kwa Marko
  choice: huduma
  alternative: kutumikia / utumishi
  rationale: Muktadha unaelekea kwenye kazi ya huduma, lakini neno la Kigiriki halitaji cheo rasmi na linaweza kumaanisha kutumikia kwa upana. Tafsiri na tanbihi zinahifadhi upana huo bila kuingiza wadhifa wa kidini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na rahisi kueleweka. Muundo “peke yake ndiye” huhifadhi msisitizo wa Kigiriki, na “uje naye” ni agizo la kawaida katika muktadha wa safari.
