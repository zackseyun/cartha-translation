id: 2TI.4.1
reference: 2 Timothy 4:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ⸀Διαμαρτύρομαι ἐνώπιον τοῦ θεοῦ καὶ ⸂Χριστοῦ Ἰησοῦ⸃, τοῦ μέλλοντος κρίνειν ζῶντας καὶ νεκρούς, ⸀καὶ τὴν ἐπιφάνειαν αὐτοῦ καὶ τὴν βασιλείαν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/001.yaml
  text: 'I solemnly charge you before God and Messiah Jesus[a], who is about to judge the living and the dead[b], and by his appearing and his kingdom:'
translation:
  language: sw
  text: 'Nakuagiza kwa uzito mbele za Mungu na Masihi Yesu, aliye karibu kuwahukumu walio hai na waliokufa[a], na kwa kuonekana kwake na ufalme wake[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “atakayewahukumu walio hai na waliokufa.”
    reason: lexical_alternative
  - marker: b
    text: Au huenda, “na kuonekana kwake na ufalme wake,” huku uhusiano wake na agizo ukiachwa wazi zaidi kama ulivyo katika Kiyunani.
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: Διαμαρτύρομαι
  choice: Nakuagiza kwa uzito
  rationale: Katika muktadha huu wa kumpa Timotheo wajibu rasmi, kitenzi hiki kina maana ya kutoa agizo zito na la dhati, si kutoa ushahidi tu. Kiambishi cha yambwa katika “nakuagiza” kinaweka wazi mhusika anayeelekezwa, ambaye anaeleweka kutokana na muktadha.
- source_word: ἐνώπιον
  choice: mbele za
  rationale: Ni usemi wa kawaida na wenye heshima unaowasilisha wazo la kuwa katika uwepo na machoni pa Mungu na Masihi Yesu.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Masihi Yesu
  rationale: Χριστός hapa ina nguvu ya cheo cha kimasiya katika tamko rasmi la kitheolojia; “Masihi” huhifadhi maana hiyo kuliko kulitumia neno kama jina lisiloelezwa.
- source_word: τοῦ μέλλοντος κρίνειν
  choice: aliye karibu kuwahukumu
  rationale: Huhifadhi mchango wa μέλλω, unaoweza kuonyesha jambo linalokaribia au lililo mbele, badala ya kuufanya usemi kuwa wakati ujao wa kawaida tu. Uwezekano huo mwingine umetajwa katika tanbihi.
- source_word: ζῶντας καὶ νεκρούς
  choice: walio hai na waliokufa
  rationale: Ni Kiswahili cha kawaida kinachohifadhi makundi yote mawili yaliyo katika usemi wa Kiyunani.
- source_word: ἐπιφάνειαν
  choice: kutokea
  rationale: Katika muktadha huu wa wakati ujao, “kutokea” huwasilisha kujidhihirisha au kuonekana wazi bila kuingiza maelezo ya ziada kuhusu namna ya kuja.
- source_word: βασιλείαν
  choice: ufalme
  rationale: Ni tafsiri ya msingi na inafaa katika jozi ya mambo ya mwisho pamoja na kutokea kwake.
theological_decisions:
- issue: Jinsi ya kutafsiri Χριστός kama cheo cha kimasiya
  choice: Masihi Yesu
  alternative: Kristo Yesu
  rationale: “Masihi” huonyesha wazi kwamba Χριστός ni cheo cha Mtiwa-Mafuta, huku mpangilio wa maneno wa Kiyunani ukihifadhiwa.
- issue: Nguvu ya μέλλω katika hukumu ya wakati ujao
  choice: aliye karibu kuwahukumu
  alternative: atakayewahukumu
  rationale: Chaguo kuu huhifadhi mvutano wa Kiyunani kati ya kukaribia na kuwa jambo la wakati ujao bila kuweka ratiba ambayo andiko halijaweka; tafsiri ya wakati ujao imetolewa katika tanbihi.
- issue: Uhusiano wa “kutokea kwake na ufalme wake” na agizo
  choice: na kwa kutokea kwake na ufalme wake
  alternative: na kutokea kwake na ufalme wake
  rationale: Nomino hizi katika hali ya yambwa zinaeleweka vizuri kama msingi mwingine wa agizo zito, yaani “kwa”; hata hivyo, Kiyunani huacha uhusiano huo ukiwa wa ndani zaidi, kwa hiyo uratibu wa moja kwa moja umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya agizo rasmi lakini kinachoeleweka kwa msomaji wa kawaida. “Nakuagiza kwa uzito” huepuka lugha nzito kupita kiasi; “mbele za” na “ufalme” hudumisha sajili ya kibiblia iliyo ya kawaida.
