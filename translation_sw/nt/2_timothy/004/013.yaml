  text: τὸν φαιλόνην, ὃν ⸀ἀπέλιπον ἐν Τρῳάδι παρὰ Κάρπῳ, ἐρχόμενος φέρε, καὶ τὰ βιβλία, μάλιστα τὰς μεμβράνας.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/013.yaml
  text: When you come[a], bring the cloak that I left in Troas with Carpus, and the books[b], especially the parchments.
translation:
  language: sw
  text: Utakapokuja, niletee joho[a] nililoliacha Troa kwa Karpo, pamoja na vitabu[b], hasa hati za ngozi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya watafsiri hulielewa neno hili kuwa kifuko au kifuniko cha vitabu, lakini kwa kawaida neno la Kigiriki humaanisha vazi la nje.
    reason: lexical_alternative
  - marker: b
    text: Au “magombo”; neno la Kigiriki linaweza kumaanisha magombo yaliyoandikwa au maandishi mengine ya aina hiyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: φαιλόνην
  choice: joho
  rationale: Neno hili kwa kawaida humaanisha vazi la nje la kujikinga na baridi au hali ya hewa. “Joho” ni neno la Kiswahili linaloeleweka na halilazimishi maana isiyo ya kawaida ya kifuko cha vitabu.
- source_word: ἀπέλιπον
  choice: nililoliacha
  rationale: Kitenzi hiki ni nafsi ya kwanza umoja na humaanisha kuacha kitu mahali; umbo hili pia linapatana kisarufi na “joho.”
- source_word: ἐν Τρῳάδι
  choice: Troa
  rationale: Jina la mahali limetolewa kwa umbo lililozoeleka katika Kiswahili cha Biblia; kihusishi cha mahali kinaeleweka bila kuongeza “huko.”
- source_word: παρὰ Κάρπῳ
  choice: kwa Karpo
  rationale: παρά pamoja na dative hapa huonyesha kuwa kitu kiliachwa mahali alipo Karpo au chini ya uangalizi wake. “Kwa Karpo” huhifadhi upana huo kwa Kiswahili cha kawaida.
- source_word: ἐρχόμενος
  choice: Utakapokuja
  rationale: Kivumishi-itenzi hiki kina uhusiano wa wakati na agizo linalofuata; “utakapokuja” ni njia ya asili ya kueleza maana hiyo.
- source_word: φέρε
  choice: niletee
  rationale: Agizo la φέρω hapa linamtaka Timotheo avilete vitu kwa mwandishi. “Niletee” huweka wazi mwelekeo unaodokezwa na muktadha.
- source_word: τὰ βιβλία
  choice: vitabu
  rationale: βιβλία ni maandishi au vitabu, ambavyo katika ulimwengu wa kale mara nyingi vilikuwa katika umbo la magombo. “Vitabu” ni tafsiri pana na ya kawaida, huku uwezekano wa “magombo” ukihifadhiwa katika tanbihi.
- source_word: μάλιστα
  choice: hasa
  rationale: Neno hili linatoa msisitizo maalumu kwa vitu vinavyofuata; “hasa” ni sawa ya Kiswahili iliyo wazi na ya asili.
- source_word: τὰς μεμβράνας
  choice: hati za ngozi
  rationale: μεμβράνα hurejelea nyenzo za kuandikia zilizotengenezwa kwa ngozi iliyotayarishwa, au hati zilizoandikwa juu yake. “Hati za ngozi” ni sahihi na inaeleweka kuliko tafsiri halisi kama “utando.”
