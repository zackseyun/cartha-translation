  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo wa sentensi unafuata mtiririko wa Kigiriki bila kuwa mgumu; “kwa Karpo” huhifadhi uwezekano wa maana ya kuwa nyumbani kwake au chini ya uangalizi wake.
