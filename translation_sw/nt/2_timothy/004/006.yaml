  text: Ἐγὼ γὰρ ἤδη σπένδομαι, καὶ ὁ καιρὸς τῆς ⸂ἀναλύσεώς μου⸃ ἐφέστηκεν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/006.yaml
  text: For I am already being poured out as a drink offering[b][a], and the time of my departure has come.
translation:
  language: sw
  text: Kwa maana mimi tayari ninamiminwa kama sadaka ya kinywaji[a], na wakati wa kuondoka kwangu umefika[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “tayari ninamiminwa.” Kitenzi cha Kigiriki huleta picha ya sadaka ya kinywaji inayomiminwa katika dhabihu.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kigiriki linaweza pia kumaanisha “kuachiliwa” au “kufunguliwa.” Hapa “kuondoka” ni usemi wa kawaida unaorejelea kifo.
    reason: alternative_reading
lexical_decisions:
- source_word: σπένδομαι
  choice: ninamiminwa kama sadaka ya kinywaji
  rationale: Kitenzi hiki huleta picha ya kinywaji kinachomiminwa kama sadaka. Tafsiri hii inahifadhi taswira ya dhabihu inayohusishwa na kifo cha Paulo bila kuibadili kuwa kauli ya moja kwa moja kwamba anakufa.
- source_word: ἤδη
  choice: tayari
  rationale: Neno hili linaonyesha kwamba tendo hilo limeanza au linaonekana kuwa linaendelea sasa, huku kifo cha Paulo kikiwa karibu.
- source_word: καιρός
  choice: wakati
  rationale: Hapa linamaanisha wakati mahususi au wa kuamua; neno “wakati” ni la kawaida na muktadha unaonyesha kuwa ni wakati uliowadia.
- source_word: ἀναλύσεώς
  choice: kuondoka
  rationale: Nomino hii inaweza kuhusisha kuondoka, kufunguliwa, au kuachiliwa. “Kuondoka” ni usemi wa kawaida unaoweza kurejelea kifo huku ukihifadhi sitiari na kiwango fulani cha maana pana.
- source_word: ἐφέστηκεν
  choice: umefika
  rationale: Kauli ya wakati timilifu inaonyesha kwamba wakati huo umewadia na sasa upo; “umefika” huwasilisha hali hiyo kwa Kiswahili cha kawaida.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Inaendeleza uhusiano wa maelezo na mistari iliyotangulia kwa njia ya kawaida na yenye hadhi.
theological_decisions:
- issue: Maelezo ya kisitiari kuhusu kifo cha Paulo
  choice: Paulo anaeleza kifo chake kilicho karibu kwa taswira ya sadaka inayomiminwa na kwa usemi “kuondoka.”
  alternative: Kuyatafsiri maneno hayo moja kwa moja kuwa “ninakaribia kufa,” au kuyaelewa kuwa yanahusu mateso kwa ujumla tu.
  rationale: Muungano wa σπένδομαι na ἀνάλυσις unaelekeza kwa nguvu kwenye kifo kilicho karibu, lakini tafsiri inahifadhi sitiari zote mbili badala ya kuondoa mvutano wake wa kitheolojia kwa ufafanuzi wa moja kwa moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Sadaka ya kinywaji” inaeleweka zaidi kuliko istilahi ya kitaalamu, na “kuondoka” huhifadhi sitiari ya Kigiriki bila kufafanua kupita kiasi.
