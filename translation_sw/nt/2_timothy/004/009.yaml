  text: Make every effort to come to me quickly[a].
translation:
  language: sw
  text: Jitahidi kuja kwangu haraka[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Fanya bidii kuja kwangu upesi” au “Fanya kila uwezalo kuja kwangu haraka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Σπούδασον
  choice: Jitahidi
  rationale: Kitenzi hiki cha amri kinaonyesha bidii, nia thabiti, na juhudi ya dhati. “Jitahidi” ni Kiswahili cha kawaida kinachohifadhi maana hiyo bila kuifanya iwe amri ya kuongeza mwendo tu, jambo ambalo tayari linaonyeshwa na ταχέως.
- source_word: ἐλθεῖν
  choice: kuja
  rationale: Kitenzi hiki kisicho na nafsi kinategemea Σπούδασον. Pamoja na πρός με, “kuja” ndilo chaguo la kawaida kwa mwendo unaoelekezwa kwa msemaji.
- source_word: πρός
  choice: kwa-
  rationale: Pamoja na με, πρός huonyesha mwendo unaomwelekea mtu. Katika “kwangu,” maana ya “kuja kwangu” inatolewa kwa njia ya asili katika Kiswahili.
- source_word: με
  choice: -ngu
  rationale: Kiwakilishi cha nafsi ya kwanza umoja kimewakilishwa katika umbo la kimahali “kwangu,” yaani, kuelekea mahali alipo msemaji.
- source_word: ταχέως
  choice: haraka
  rationale: Kielezi hiki kinaweza kumaanisha kwa haraka au upesi. “Haraka” kinadumisha hisia ya uharaka na kukitofautisha na juhudi ya dhati inayotolewa na Σπούδασον.
