  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ⸀ῥύσεταί με ὁ κύριος ἀπὸ παντὸς ἔργου πονηροῦ καὶ σώσει εἰς τὴν βασιλείαν αὐτοῦ τὴν ἐπουράνιον· ᾧ ἡ δόξα εἰς τοὺς αἰῶνας τῶν αἰώνων, ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/018.yaml
  text: The Lord will rescue me from every evil deed and will bring me safely into his heavenly kingdom[a]. To him be the glory forever and ever[c][b]. Amen.
translation:
  language: sw
  text: Bwana ataniokoa kutoka katika kila tendo ovu, naye atanifikisha salama katika ufalme wake wa mbinguni.[a] Utukufu uwe kwake milele na milele.[b] Amina.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tafsiri nyingine: “naye ataniokoa ili niingie katika ufalme wake wa mbinguni.”'
    reason: lexical_alternative
  - marker: b
    text: 'Kwa neno kwa neno: “hata zama za zama.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥύσεταί
  choice: ataniokoa
  rationale: Kitenzi hiki humaanisha kuokoa au kukomboa kutoka hatarini. “Ataniokoa” ni usemi wa kawaida wa Kiswahili unaobakiza wazo la kuondolewa katika tishio.
- source_word: ἀπὸ παντὸς ἔργου πονηροῦ
  choice: kutoka katika kila tendo ovu
  rationale: “Tendo” linaeleza ἔργον kwa kawaida katika muktadha wa maadili, na “ovu” linabeba maana ya πονηροῦ bila kuifanya sentensi isikike kana kwamba Paulo anaahidiwa tu kulindwa dhidi ya watu waovu.
- source_word: σώσει εἰς
  choice: atanifikisha salama katika
  rationale: Kwa Kiswahili, tafsiri ya neno kwa neno kama “ataniokoa kuingia katika” si ya kawaida. Usemi huu unabeba pamoja maana ya kuhifadhi/kuokoa na mwelekeo wa kuingia katika lengo linaloonyeshwa na εἰς.
- source_word: τὴν βασιλείαν αὐτοῦ τὴν ἐπουράνιον
  choice: ufalme wake wa mbinguni
  rationale: Huu ni usemi wa kawaida na wenye heshima unaohifadhi umilikaji na sifa ya ufalme kuwa wa mbinguni.
- source_word: ᾧ ἡ δόξα
  choice: Utukufu uwe kwake
  rationale: Hii ni namna ya kawaida ya Kiswahili ya kutoa sifa katika tamko la ibada, huku ikihifadhi mwelekeo wa utukufu kwa mhusika huyo.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: milele na milele
  rationale: Ni nahau ya kawaida ya Kiswahili inayowasilisha nguvu ya muda usio na mwisho katika msemo wa Kigiriki.
- source_word: ἀμήν
  choice: Amina
  rationale: Umbo la kawaida la kiliturujia na la kibiblia katika Kiswahili.
theological_decisions:
- issue: Uhusiano kati ya kuokolewa na matendo maovu sasa na wokovu wa mwisho
  choice: Tafsiri inatofautisha kuokolewa kutoka katika kila tendo ovu na kufikishwa salama katika ufalme wa mbinguni, bila kuahidi kwamba Paulo hatafia kwa kuuawa.
  alternative: Kuelewa kwamba Bwana atamwokoa Paulo kutokana na kifo cha kimwili.
  rationale: Vitenzi ῥύσεταί na σώσει pamoja na mwelekeo “katika ufalme wake wa mbinguni” vinaweza kueleza ulinzi dhidi ya ushindi wa uovu na kufikishwa mwisho salama, si lazima kuponyoka kuuawa. Tafsiri inaacha mvutano huo bila kuutatua kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. “Atanifikisha salama” limetumiwa badala ya muundo usio wa kawaida wa tafsiri ya neno kwa neno, huku tanbihi ikihifadhi uwezekano huo wa kimuundo.
