  yaml_path: translation/nt/2_timothy/004/022.yaml
  text: The Lord be with your spirit[a]. Grace be with you all.
translation:
  language: sw
  text: Bwana awe pamoja na roho yako.[a] Neema iwe pamoja nanyi nyote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kigiriki hubadilika kutoka umoja kwenda wingi: “roho yako” (umoja) … “nanyi nyote” (wingi).'
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: Bwana
  rationale: Ni tafsiri ya kawaida ya κύριος katika Agano Jipya na inafaa kwa cheo cha Yesu katika baraka hii ya mwisho, bila kuongeza jina ambalo halipo katika Kigiriki.
- source_word: μετὰ
  choice: awe pamoja na / iwe pamoja na
  rationale: Kigiriki hakina kitenzi wazi, lakini muundo wa baraka unadokeza ombi. Kiswahili cha kawaida huhitaji kitenzi cha hali ya kutakia; upatanisho wa kisarufi unatoa ‘awe’ kwa Bwana na ‘iwe’ kwa neema.
- source_word: πνεύματός
  choice: roho
  rationale: Kiwakilishi ‘yako’ kinaelekeza kwa roho ya Timotheo; herufi ndogo na neno ‘roho’ huhifadhi maana hiyo bila kuitambulisha moja kwa moja kuwa Roho Mtakatifu.
- source_word: σου
  choice: yako
  rationale: Huhifadhi umoja wa kiwakilishi, kwa kuwa baraka ya kwanza inaelekezwa kwa Timotheo binafsi.
- source_word: χάρις
  choice: Neema
  rationale: ‘Neema’ ni neno la kawaida, lenye uzito wa kiteolojia, kwa χάρις katika salamu na baraka za Paulo; ‘fadhili’ lingewezekana lakini halingewasilisha kwa uwazi uleule mtindo wa baraka.
- source_word: ὑμῶν
  choice: nanyi nyote
  rationale: Huweka wazi wingi wa kiwakilishi na mabadiliko kutoka kwa Timotheo mmoja hadi kwa kundi pana, huku ‘nyote’ ikiondoa utata wa umoja/wingi unaoweza kuwapo katika ‘nanyi’ pekee.
theological_decisions:
- issue: Anayerejelewa na ‘Bwana’
  choice: Cheo kinachomrejelea Bwana Yesu katika baraka ya mwisho ya Paulo
  alternative: Rejeo la jumla zaidi kwa Mungu
  rationale: Katika miisho ya barua za Paulo, ‘Bwana’ mara nyingi humrejelea Yesu. Tafsiri inadumisha cheo chenyewe bila kuongeza ‘Yesu,’ kwa kuwa jina hilo halipo katika matini ya Kigiriki.
- issue: Mabadiliko ya idadi kati ya vifungu viwili
  choice: Kifungu cha kwanza kinamwelekea Timotheo mmoja; cha pili kinapanua ombi la neema kwa watu wengi
  alternative: Kuvichukulia vifungu vyote viwili kuwa vinamwelekea Timotheo peke yake
  rationale: Kigiriki kinatofautisha wazi σου ya umoja na ὑμῶν ya wingi. ‘Yako’ na ‘nanyi nyote’ huhifadhi tofauti hiyo ya kifasihi na ya maana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa baraka umewekwa kwa lugha ya kawaida na ya kueleweka, huku tofauti ya umoja na wingi ikihifadhiwa wazi.
