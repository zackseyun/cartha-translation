base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/016.yaml
  text: At my first defense no one stood with me[a], but all deserted me[c][b]. May it not be counted against them.
translation:
  language: sw
  text: Katika utetezi wangu wa kwanza[a], hakuna mtu aliyekuja kusimama pamoja nami[b], bali wote waliniacha. Jambo hilo lisihesabiwe dhidi yao.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakati wa kusikilizwa kwangu kwa mara ya kwanza” au “katika utetezi wangu wa kwanza wa kisheria.”
    reason: lexical_alternative
  - marker: b
    text: 'Kigiriki: “hakuna mtu aliyekuja kuwapo pamoja nami”; maana yake ni kwamba hakuna aliyejitokeza kumuunga mkono Paulo.'
    reason: lexical_alternative
  - marker: c
    text: Au “Jambo hilo lisihesabiwe kuwa kosa lao.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπολογίᾳ
  choice: utetezi
  rationale: Katika muktadha huu wa kisheria, neno hili linamaanisha kujitetea rasmi mbele ya mamlaka. “Utetezi” ni neno la kawaida na lenye hadhi linalohifadhi maana hiyo bila kulifanya kuwa maelezo ya jumla tu.
- source_word: πρώτῃ
  choice: wa kwanza
  rationale: Kivumishi hiki kinaonyesha tukio au hatua ya kwanza ya utetezi; tafsiri ya moja kwa moja “wa kwanza” pia inaacha wazi ikiwa ilikuwa kesi ya awali au kusikilizwa kwa mara ya kwanza.
- source_word: παρεγένετο
  choice: aliyekuja kusimama pamoja nami
  rationale: Kitenzi kimsingi huonyesha kuja na kuwapo. Katika utetezi wa kisheria, usemi huu unaonyesha pia kuwapo ili kumuunga mkono Paulo; “kusimama pamoja nami” huwasilisha kuwapo na mshikamano kwa Kiswahili cha asili.
- source_word: οὐδείς
  choice: hakuna mtu
  rationale: Hii ni tafsiri wazi na ya kawaida ya kiwakilishi hasi, yenye kufaa kwa sajili ya simulizi yenye hadhi.
- source_word: ἐγκατέλιπον
  choice: waliniacha
  rationale: Kitenzi kinaonyesha kumwacha mtu katika hali ngumu. “Waliniacha” ni cha asili na wazi, huku muktadha wenyewe ukionyesha uzito wa kutelekezwa huko.
- source_word: λογισθείη
  choice: lisihesabiwe dhidi yao
  rationale: Kauli hii inadumisha taswira ya jambo kuingizwa katika hesabu au kuhesabiwa kuwa kosa, na hali ya optative inaonyeshwa kama ombi au tamani kwa kutumia “lisihesabiwe.”
- source_word: μὴ αὐτοῖς λογισθείη
  choice: Jambo hilo lisihesabiwe dhidi yao
  rationale: “Jambo hilo” linaweka wazi kwa Kiswahili kwamba kinachorejelewa ni kitendo cha kumwacha Paulo, bila kuongeza maudhui mapya. Muundo wa kutakia unaendeleza sauti ya ombi la kutowahesabia kosa.
theological_decisions:
- issue: Sauti ya kauli ya mwisho ya Paulo kuhusu waliomwacha
  choice: 'Ombi au tamani ya kwamba kosa hilo lisihesabiwe dhidi yao: “Jambo hilo lisihesabiwe dhidi yao.”'
  alternative: 'Agizo lenye upole: “Jambo hilo lisihesabiwe kuwa kosa lao.”'
  rationale: Optative tendwa λογισθείη pamoja na μή kwa kawaida huonyesha ombi au tamani, si taarifa ya kawaida. Tafsiri hii inadumisha mwangwi wa lugha ya msamaha bila kuamua zaidi ya kile Kigiriki kinachosema.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wazi kwa msomaji wa kawaida huku ukihifadhi muktadha wa kisheria, uzito wa kuachwa, na sauti ya ombi katika kauli ya mwisho.
