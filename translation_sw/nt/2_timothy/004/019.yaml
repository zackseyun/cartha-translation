lexical_decisions:
- source_word: Ἄσπασαι
  choice: Wasalimu
  rationale: Kitenzi hiki ni amri ya moja kwa moja ya kufikisha salamu. “Wasalimu” ni Kiswahili cha kawaida na huhifadhi nguvu ya amri bila kuongeza wazo la uchangamfu lisilotajwa wazi.
- source_word: Πρίσκαν
  choice: Priska
  rationale: Huu ni unukuzi wa moja kwa moja wa jina Πρίσκαν (umbo la Πρίσκα), badala ya kutumia umbo jingine linalojulikana, Priskila.
- source_word: Ἀκύλαν
  choice: Akila
  rationale: Ni umbo la kawaida la Kiswahili la jina la Kigiriki Ἀκύλας.
- source_word: τὸν Ὀνησιφόρου οἶκον
  choice: watu wa nyumbani mwa Onesiforo
  rationale: Katika muktadha wa salamu, οἶκος humaanisha watu wa kaya au nyumba, si jengo lenyewe tu. Usemi huu ni wa kawaida katika Kiswahili na hauishii kwa ndugu wa damu pekee.
