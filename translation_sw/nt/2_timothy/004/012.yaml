  text: But I sent Tychicus to Ephesus[a].
translation:
  language: sw
  text: Lakini Tikiko nilimtuma Efeso[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nami nilimtuma Tikiko Efeso,” au “Basi nilimtuma Tikiko Efeso”; kiunganishi cha Kigiriki δέ kinaweza kuonyesha mwendelezo wa kawaida au utofautishaji mdogo.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τυχικὸν
  choice: Tikiko
  rationale: Jina la mtu limeandikwa kwa unukuzi unaopatana na matumizi ya kawaida ya majina ya Biblia katika Kiswahili.
- source_word: δὲ
  choice: Lakini
  rationale: Kiunganishi hiki kinaweza kuonyesha mwendelezo au utofautishaji mdogo; “Lakini” kinahifadhi uwezekano wa utofautishaji katika muktadha bila kuufanya kuwa mkali.
- source_word: ἀπέστειλα
  choice: nilimtuma
  rationale: Ni kitenzi cha wakati uliopita, nafsi ya kwanza umoja; “nilimtuma” ni Kiswahili cha kawaida na kiambishi cha yambwa kinamrejelea Tikiko.
- source_word: εἰς
  choice: Efeso
  rationale: Kwa jina la mji, uelekeo huwasilishwa kwa kawaida katika Kiswahili bila kihusishi cha ziada baada ya kitenzi “tuma.”
- source_word: Ἔφεσον
  choice: Efeso
  rationale: Jina la mahali limetolewa kwa umbo lililozoeleka katika Kiswahili cha Biblia.
