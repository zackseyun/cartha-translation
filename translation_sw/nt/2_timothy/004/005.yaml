  text: σὺ δὲ νῆφε ἐν πᾶσιν, κακοπάθησον, ἔργον ποίησον εὐαγγελιστοῦ, τὴν διακονίαν σου πληροφόρησον.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/005.yaml
  text: But as for you[a], keep a clear head in all things, endure hardship, do the work of an evangelist[c][b], fully carry out your ministry.
translation:
  language: sw
  text: Lakini wewe, uwe na akili timamu katika mambo yote[a], vumilia taabu[b], fanya kazi ya mtangazaji wa Habari Njema, na utekeleze huduma yako kikamilifu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uwe na kiasi,” “uwe na akili tulivu,” au “uendelee kuwa macho.” Kitenzi cha Kigiriki νῆφε humaanisha kihalisi kuwa na kiasi, lakini katika Agano Jipya hutumiwa hapa kwa maana ya kitamathali ya kuwa na akili timamu, kujitawala, na kubaki imara chini ya shinikizo.
    reason: lexical_alternative
  - marker: b
    text: Au, “teseka kwa kuvumilia taabu.”
    reason: lexical_alternative
  - marker: c
    text: Au, “ikamilishe huduma yako.” Kitenzi cha Kigiriki kina maana ya kuifikisha kwenye utimilifu wake.
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ δὲ
  choice: Lakini wewe
  rationale: δὲ huonyesha utofauti na watu waliotajwa katika mistari iliyotangulia, huku σὺ ikimkazia Timotheo binafsi.
- source_word: νῆφε
  choice: uwe na akili tulivu
  rationale: Kitenzi hiki, ingawa kimsingi kinaweza kumaanisha kutolewa na ulevi, katika Agano Jipya hutumiwa kwa maana ya kuwa na utambuzi, kujitawala, na kutoyumbishwa na shinikizo. Kauli hii ya Kiswahili inawasilisha hali hiyo bila kuleta wazo lisilokusudiwa la kujiepusha na pombe.
- source_word: ἐν πᾶσιν
  choice: katika mambo yote
  rationale: Inahifadhi upana wa usemi wa Kigiriki bila kuamua kimyakimya kama unalenga mazingira yote au nyakati zote.
- source_word: κακοπάθησον
  choice: vumilia taabu
  rationale: Inawasilisha mateso au magumu pamoja na wito wa kustahimili, si kueleza tu kwamba Timotheo atapata taabu.
- source_word: ἔργον ποίησον εὐαγγελιστοῦ
  choice: fanya kazi ya mtangazaji wa Habari Njema
  rationale: Usemi huu ni wa kawaida na unaeleweka katika Kiswahili cha sasa. 'Mtangazaji wa Habari Njema' hueleza kazi ya εὐαγγελιστής bila kulazimisha kwamba hapa ni cheo rasmi cha kikanisa.
- source_word: τὴν διακονίαν σου
  choice: huduma yako
  rationale: Katika muktadha huu διακονία ni wajibu wa huduma ya Timotheo aliyopewa, si huduma ya jumla isiyoainishwa.
- source_word: πληροφόρησον
  choice: utekeleze ... kikamilifu
  rationale: Inaleta wazi maana ya kuifikisha huduma katika utekelezaji kamili, huku ikibaki amri ya moja kwa moja na ya asili katika Kiswahili.
theological_decisions:
- issue: Ikiwa εὐαγγελιστοῦ inamaanisha cheo rasmi au kazi ya kutangaza Habari Njema
  choice: mtangazaji wa Habari Njema
  alternative: mwinjilisti
  rationale: Kigiriki kinaweza kumtaja mtu anayefanya kazi ya kutangaza Habari Njema bila hapa kufafanua muundo rasmi wa cheo. Tafsiri iliyochaguliwa inadumisha mkazo wa kazi na haiongezi mfumo maalumu wa madhehebu.
- issue: Maana ya διακονία katika agizo la Timotheo
  choice: huduma yako
  alternative: utumishi wako
  rationale: Muktadha unahusu kazi ya Injili na wajibu wa kichungaji aliokabidhiwa Timotheo. 'Huduma' inafaa kwa muktadha huo, ingawa neno la Kigiriki linaweza pia kuwa na maana pana ya utumishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima, na inayoeleweka kwa wasomaji wa kawaida. Sentensi inadumisha mfululizo wa amri fupi za kichungaji. 'Habari Njema' imeandikwa kwa herufi kubwa kama jina linalotambulika la ujumbe wa Injili, lakini hakuna istilahi ya kimadhehebu iliyoongezwa.
