  text: ὃν καὶ σὺ φυλάσσου, λίαν γὰρ ⸀ἀντέστη τοῖς ἡμετέροις λόγοις.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/015.yaml
  text: You also must beware of him[a], for he strongly opposed our words.
translation:
  language: sw
  text: Wewe pia jihadhari naye, kwa maana aliyapinga sana maneno yetu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au ‘ujumbe wetu’ au ‘mafundisho yetu.’ Kigiriki kinasema ‘maneno yetu.’
    reason: lexical_alternative
lexical_decisions:
- source_word: φυλάσσου
  choice: jihadhari naye
  rationale: Kauli ya amri ya wakati uliopo yenye hali ya kati inamtaka Timotheo aendelee kuwa mwangalifu kuhusu mtu huyo. ‘Jihadhari naye’ ni Kiswahili cha kawaida kinachohifadhi nguvu ya onyo na wajibu wa mtu binafsi.
- source_word: λίαν
  choice: sana
  rationale: Neno hili linaongeza nguvu ya kitenzi kinachofuata; ‘sana’ linaeleza kiwango kikubwa cha upinzani kwa Kiswahili cha kawaida.
- source_word: ἀντέστη
  choice: aliyapinga
  rationale: Kitenzi hiki humaanisha kujiweka dhidi ya jambo au kulipinga. ‘Aliyapinga’ ni wazi na kinaendana kwa kawaida na ‘maneno yetu.’
- source_word: τοῖς ἡμετέροις λόγοις
  choice: maneno yetu
  rationale: Tafsiri hii inabaki karibu na λόγοι bila kuamua kimya-kimya kwamba yalikuwa ujumbe rasmi, ushahidi wa mahakamani, au mafundisho ya kidini.
- source_word: ὃν
  choice: naye
  rationale: Kiwakilishi hiki kinamrejelea Aleksanda aliyetajwa katika mstari uliotangulia; ‘naye’ ni rejeo la kawaida baada ya ‘jihadhari.’
- source_word: καὶ σὺ
  choice: Wewe pia
  rationale: Muundo huu unahifadhi msisitizo unaowekwa kwa Timotheo na kuonyesha kwamba yeye pia anapaswa kuchukua tahadhari.
theological_decisions:
- issue: Maana na upeo wa ‘maneno yetu’
  choice: Maneno yaliyosemwa na Paulo na wenzake, bila kubainisha kama ni aina rasmi ya ushahidi, ujumbe, au mafundisho
  alternative: ushahidi wetu wa utetezi mahakamani; ujumbe wetu; mafundisho yetu
  rationale: Kirai cha Kigiriki hakibainishi mazingira mahsusi ya upinzani huo. Kwa hiyo tafsiri ‘maneno yetu’ inadumisha uwazi na mvutano wa asili badala ya kuufanya kuwa wa kisheria au wa kimafundisho pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Amri ‘jihadhari’ ni ya moja kwa moja lakini ya kawaida; ‘aliyapinga sana’ ni ya asili na hudumisha nguvu ya upinzani. Alama ya tanbihi imewekwa baada ya ‘maneno yetu,’ ambako mbadala wa kileksia unahusika.
