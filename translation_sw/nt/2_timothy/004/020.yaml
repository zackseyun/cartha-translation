  yaml_path: translation/nt/2_timothy/004/020.yaml
  text: Erastus remained in Corinth[a], but I left Trophimus sick in Miletus.
translation:
  language: sw
  text: Erasto alibaki Korintho, lakini nilimwacha Trofimo akiwa mgonjwa huko Mileto.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “lakini nilimwacha Trofimo huko Mileto alipokuwa mgonjwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔραστος
  choice: Erasto
  rationale: Jina la mtu limetoholewa kwa namna iliyozoeleka katika Kiswahili.
- source_word: ἔμεινεν
  choice: alibaki
  rationale: Kitenzi hiki hapa kinaonyesha kwamba Erasto alikaa au alisalia mahali hapo; “alibaki” ni ya kawaida na inaendana na taarifa ya safari.
- source_word: ἐν Κορίνθῳ
  choice: Korintho
  rationale: Muundo wa Kiswahili hauhitaji kihusishi kabla ya jina hili la mji katika sentensi hii.
- source_word: Τρόφιμον
  choice: Trofimo
  rationale: Jina la mtu limetoholewa kwa namna iliyozoeleka katika Kiswahili.
- source_word: δὲ
  choice: lakini
  rationale: Inaonyesha utofautishaji mdogo kati ya taarifa mbili za safari.
- source_word: ἀπέλιπον
  choice: nilimwacha
  rationale: Ni nafsi ya kwanza umoja na inaeleza wazi kwamba mwandishi alimwacha Trofimo mahali hapo bila kuongeza maana isiyo ya lazima.
- source_word: ἐν Μιλήτῳ
  choice: huko Mileto
  rationale: “Huko” huonyesha kwa kawaida mahali palipotajwa katika simulizi la safari, huku Mileto likiwa toleo la Kiswahili la jina la mji.
- source_word: ἀσθενοῦντα
  choice: akiwa mgonjwa
  rationale: Kirai hiki kinahifadhi hali ya Trofimo wakati alipoachwa na huwasilisha maana ya ugonjwa kwa Kiswahili cha kawaida.
