id: 2TI.4.8
reference: 2 Timothy 4:8
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: λοιπὸν ἀπόκειταί μοι ὁ τῆς δικαιοσύνης στέφανος, ὃν ἀποδώσει μοι ὁ κύριος ἐν ἐκείνῃ τῇ ἡμέρᾳ, ὁ δίκαιος κριτής, οὐ μόνον δὲ ἐμοὶ ἀλλὰ καὶ πᾶσιν τοῖς ἠγαπηκόσι τὴν ἐπιφάνειαν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/008.yaml
  text: From now on the crown of righteousness is laid up for me[a], which the Lord, the righteous judge, will award to me on that day—and not only to me, but also to all who have loved his appearing.
translation:
  language: sw
  text: Tangu sasa nimewekewa taji la haki[a], ambalo Bwana, Mwamuzi mwenye haki, atanipa siku ile—wala si mimi tu, bali pia wote ambao wamependa kudhihirika kwake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kirai cha Kiyunani “taji la haki” kinaweza kumaanisha taji linalohusiana na haki, taji ambalo ni haki yenyewe, au taji la kuthibitishwa kuwa mwenye haki.
    reason: Kuhifadhi utata halisi wa muundo wa Kiyunani; neno la Kiswahili “haki” pia linaweza kuhusisha unyoofu na uadilifu katika hukumu.
lexical_decisions:
- source_word: λοιπὸν
  choice: Tangu sasa
  rationale: Katika muktadha huu neno hilo linaelekeza kwenye jambo linalobaki mbele ya Paulo baada ya kumaliza mwendo wake, hivyo maana ya wakati inafaa kuliko maana ya kuhitimisha mada.
- source_word: ἀπόκειταί
  choice: nimewekewa
  rationale: Kitenzi kinaonyesha kitu kilichowekwa kando na kuhifadhiwa kwa ajili ya mtu; usemi huu ni wa kawaida katika Kiswahili na unadumisha hali ya sasa.
- source_word: ὁ τῆς δικαιοσύνης στέφανος
  choice: taji la haki
  rationale: Muundo huu unafuata kirai cha Kiyunani bila kuamua kama taji hutolewa kwa sababu ya haki, lina haki kama sifa yake, au ni haki yenyewe kama thawabu.
- source_word: ἀποδώσει
  choice: atanipa
  rationale: Katika picha ya taji, kitenzi kinamaanisha kumpa mtu kile kinachomstahili. ‘Atanipa’ ni cha asili na hakiongezi wazo la adhabu ambalo linaweza kuambatana na ‘atalipa.’
- source_word: ὁ δίκαιος κριτής
  choice: Mwamuzi mwenye haki
  rationale: Hili linamtambulisha Bwana kwa sifa yake katika kuhukumu. ‘Mwenye haki’ ni Kiswahili cha kawaida na chenye hadhi.
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: siku ile
  rationale: Usemi huu wa Kiswahili unadumisha rejeo la kieskatolojia bila kuongeza maelezo yasiyokuwamo katika maandishi.
- source_word: πᾶσιν τοῖς ἠγαπηκόσι
  choice: wote ambao wamependa
  rationale: Wakati timilifu wa Kiyunani unaonyesha upendo ulioanza na kudumu hadi sasa; ‘wamependa’ unahifadhi jambo hilo kuliko wakati uliopo sahili.
- source_word: ἐπιφάνειαν αὐτοῦ
  choice: kutokea kwake
  rationale: ‘Kutokea’ linafikisha maana ya kujidhihirisha au kuonekana wazi, bila kulifupisha neno kuwa ‘kuja’ tu.
theological_decisions:
- issue: Maana ya ‘taji la haki’
  choice: Kirai cha uhusiano kimehifadhiwa bila kuamua aina ya uhusiano kati ya ‘taji’ na ‘haki.’
  alternative: Taji linalotolewa kwa sababu ya haki; taji ambalo ni haki; au taji la kuthibitishwa kuwa mwenye haki.
  rationale: Muundo wa Kiyunani unaruhusu zaidi ya maana moja, kwa hiyo tafsiri haipaswi kuondoa mvutano huo.
- issue: Bwana anayehusika
  choice: Jina la cheo ‘Bwana’ limehifadhiwa, huku muktadha wa ‘kutokea kwake’ ukielekeza kwa Yesu Kristo.
  alternative: Mungu kwa maana ya jumla zaidi.
  rationale: Matumizi ya ‘kutokea’ katika Nyaraka za Kichungaji yanaelekeza sana kwa Kristo, lakini maandishi yenyewe yanasema ‘Bwana,’ hivyo hakuna ufafanuzi ulioingizwa katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inafuata mtiririko wa Kiyunani lakini imetumia miundo ya kawaida ya Kiswahili; em dash inaonyesha msisitizo wa nyongeza ya mwisho.
