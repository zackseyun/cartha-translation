  text: καὶ ἀπὸ μὲν τῆς ἀληθείας τὴν ἀκοὴν ἀποστρέψουσιν, ἐπὶ δὲ τοὺς μύθους ἐκτραπήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/004.yaml
  text: and they will turn away their hearing from the truth[b][a], and turn aside to myths.
translation:
  language: sw
  text: Nao wataugeuza usikivu wao mbali na kweli[a], nao watageukia hekaya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watageuza masikio yao mbali na kweli.”
    reason: lexical_alternative
  - marker: b
    text: Au, “ngano.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀληθείας
  choice: kweli
  rationale: Nomino “kweli” inadumisha upana wa neno la Kigiriki bila kulifafanua zaidi kuwa “mafundisho sahihi” au “injili.” Katika Kiswahili, umaalumu wake unaeleweka kutokana na muktadha bila kuhitaji “ile kweli.”
- source_word: ἀκοὴν
  choice: kuisikiliza
  rationale: Muundo wa kitenzi “kuisikiliza” unatoa Kiswahili cha kawaida na wazi kwa maana ya “usikivu/kusikia,” huku tanbihi ikihifadhi kwa ukaribu zaidi taswira ya Kigiriki ya kuugeuza usikivu au masikio.
- source_word: ἀποστρέψουσιν
  choice: wataacha
  rationale: Pamoja na “kuisikiliza,” neno hili linaeleza kitendo cha makusudi cha kuondoka katika kuisikiliza kweli. Tanbihi inaonyesha muundo wa karibu zaidi na Kigiriki, “wataugeuza usikivu wao mbali na.”
- source_word: μύθους
  choice: hekaya
  rationale: “Hekaya” ni neno la sasa linalofaa kwa masimulizi yaliyobuniwa au yasiyo na msingi ambayo yanatofautishwa na kweli; “ngano” limetolewa kama chaguo jingine.
- source_word: ἐκτραπήσονται
  choice: kugeukia
  rationale: 'Huhifadhi mwendo unaotofautishwa na kuondoka kwenye kweli: wanaiacha kweli na kuelekea kwenye hekaya, bila kuamua ikiwa wamejigeuza wenyewe au wamegeuzwa.'
- source_word: ἀπὸ μὲν ... ἐπὶ δὲ
  choice: wataacha ... na kugeukia
  rationale: Muundo huu wa Kiswahili unaonyesha kwa kawaida ulinganisho wa mwelekeo kutoka kwenye kweli kwenda kwenye hekaya.
theological_decisions:
- issue: Maana ya “kweli” katika muktadha
  choice: kweli
  alternative: mafundisho sahihi; kweli ya injili
  rationale: Ingawa muktadha unahusisha mafundisho ya kitume, neno la aya ni pana zaidi. Tafsiri haipunguzi maana yake kwa kuingiza ufafanuzi wa kiteolojia usiotajwa moja kwa moja.
- issue: Uhusika katika ἐκτραπήσονται
  choice: kugeukia
  alternative: watageuzwa kuelekea
  rationale: Umbo la Kigiriki linaweza kueleweka kwa maana ya kati au tendwa. Kiswahili “kugeukia” ni cha kawaida na hakisisitizi kupita kiasi mhusika aliyesababisha kugeuka huko.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Wataacha kuisikiliza kweli” ni cha kawaida zaidi kuliko muundo mzito wa “wataugeuza usikivu wao,” huku tanbihi ikihifadhi muundo na taswira ya Kigiriki.
