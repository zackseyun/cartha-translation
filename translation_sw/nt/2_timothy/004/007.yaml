  yaml_path: translation/nt/2_timothy/004/007.yaml
  text: I have fought the good fight[a], I have finished the race, I have kept the faith.
translation:
  language: sw
  text: Nimepambana katika pambano jema; nimemaliza mbio; nimeihifadhi imani.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nimeidumisha imani” au “nimeendelea kuwa mwaminifu.” Kigiriki τὴν πίστιν kinaweza kumaanisha imani aliyoihifadhi, au kwamba amedumisha uaminifu.
    reason: alternative_reading
lexical_decisions:
- source_word: καλὸν ἀγῶνα
  choice: pambano jema
  rationale: ἀγών ni pambano, shindano, au mapigano; “pambano jema” huhifadhi taswira ya kujitahidi kwa bidii bila kuibana iwe ya kijeshi pekee. καλός hapa ina maana ya jema au lenye heshima.
- source_word: ἠγώνισμαι
  choice: nimepambana
  rationale: Wakati timilifu wa Kigiriki unaonyesha tendo lililokamilika lenye matokeo yanayoendelea; umbo la Kiswahili “nime-” linafaa, na “pambana” huhifadhi uhusiano na “pambano.”
- source_word: δρόμον
  choice: mbio
  rationale: δρόμος hapa ni mwendo wa mashindano au mbio. “Mbio” ni neno la kawaida na wazi linalohifadhi taswira ya riadha.
- source_word: τετέλεκα
  choice: nimemaliza
  rationale: τελέω humaanisha kufikisha jambo mwisho wake. “Nimemaliza” ni la asili na linaonyesha kukamilika kwa mbio.
- source_word: πίστιν
  choice: imani
  rationale: πίστις inaweza kumaanisha imani inayoshikiliwa au uaminifu. “Imani” ndilo chaguo kuu lisiloingiza ufafanuzi wa kimadhehebu; utata halisi unaelezwa katika tanbihi.
- source_word: τετήρηκα
  choice: nimeishika
  rationale: τηρέω inaweza kuwa kushika, kutunza, kulinda, au kudumisha. “Nimeishika” ni ya asili pamoja na “imani” na haiondoi kabisa maana za kudumisha na kuwa mwaminifu.
theological_decisions:
- issue: Maana ya τὴν πίστιν
  choice: nimeishika imani
  alternative: nimeendelea kuwa mwaminifu
  rationale: Kirai kinaweza kurejelea imani ya Kikristo ambayo Paulo ameishika au uaminifu wake mwenyewe. Matini kuu inatumia “imani,” huku tanbihi ikihifadhi maana mbadala bila kuamua zaidi ya ushahidi wa Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa vipashio vitatu na wakati timilifu umehifadhiwa. “Katika” imeongezwa ili kishazi cha kwanza kiwe cha asili katika Kiswahili bila kubadili maana.
