id: 2TI.4.17
reference: 2 Timothy 4:17
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὁ δὲ κύριός μοι παρέστη καὶ ἐνεδυνάμωσέν με, ἵνα δι’ ἐμοῦ τὸ κήρυγμα πληροφορηθῇ καὶ ⸀ἀκούσωσιν πάντα τὰ ἔθνη, καὶ ἐρρύσθην ἐκ στόματος λέοντος.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/017.yaml
  text: But the Lord stood by me and strengthened me[a], so that through me the proclamation might be fully accomplished and all the Gentiles might hear[b], and I was rescued from the lion’s mouth.
translation:
  language: sw
  text: Lakini Bwana alisimama upande wangu na kunitia nguvu, ili kwa njia yangu ujumbe utangazwe kikamilifu na mataifa yote yaweze kusikia[a]. Nami niliokolewa kutoka kinywa cha simba[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watu wote wa mataifa mengine.” Neno la Kigiriki ἔθνη linaweza kumaanisha “mataifa” au watu wasio Wayahudi; hapa huenda linarejelea watu wasio Wayahudi wanaosikia habari njema.
    reason: lexical_alternative
  - marker: b
    text: Usemi “kutoka kinywa cha simba” huenda ni sitiari ya kuokolewa kutoka katika hatari ya kifo, wala si lazima urejelee simba halisi.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δὲ κύριός
  choice: Lakini Bwana
  rationale: Neno δέ linaonyesha utofauti na mstari uliotangulia, nalo κύριος limetafsiriwa kwa istilahi ya kawaida ya kibiblia “Bwana” bila kumtambulisha zaidi ya maandishi yenyewe.
- source_word: μοι παρέστη
  choice: alisimama upande wangu
  rationale: Usemi huu unaonyesha kuwapo karibu kwa ajili ya kumsaidia mtu, si kuwapo tu mahali pamoja.
- source_word: ἐνεδυνάμωσέν με
  choice: kunitia nguvu
  rationale: Ni usemi wa kawaida na wenye uzito unaowasilisha maana ya kuimarisha au kumpa mtu uwezo.
- source_word: ἵνα δι’ ἐμοῦ
  choice: ili kwa njia yangu
  rationale: “Ili” inadumisha dhumuni linaloletwa na ἵνα, na “kwa njia yangu” linaonyesha uwakala wa διά pamoja na hali ya umilikishi.
- source_word: τὸ κήρυγμα πληροφορηθῇ
  choice: ujumbe utangazwe kikamilifu
  rationale: Tafsiri hii inawasilisha κήρυγμα kama ujumbe unaotangazwa na πληροφορηθῇ kama kutekelezwa au kutimizwa kwa ukamilifu katika muktadha wa ushuhuda wa Paulo.
- source_word: ἀκούσωσιν πάντα τὰ ἔθνη
  choice: mataifa yote yaweze kusikia
  rationale: Muundo wa kusudi umehifadhiwa kwa “yaweze kusikia.” Neno ἔθνη linaweza kumaanisha mataifa au watu wasio Wayahudi; “mataifa yote” linadumisha upana wa maana ya Kigiriki.
- source_word: ἐρρύσθην
  choice: niliokolewa
  rationale: Neno hili linaonyesha kuondolewa katika hatari; “niliokolewa” ni la kawaida na wazi katika Kiswahili cha sasa.
- source_word: ἐκ στόματος λέοντος
  choice: kutoka kinywa cha simba
  rationale: Taswira ya chanzo imehifadhiwa bila kuamua kama simba ni halisi au ni sitiari ya hatari, mtawala, au nguvu nyingine.
theological_decisions:
- issue: Mhusika anayeitwa “Bwana” (κύριος)
  choice: Bwana
  alternative: Yesu hasa; au Mungu kwa maana pana zaidi
  rationale: Muktadha unaweza kueleweka kuwa unamrejelea Yesu aliyefufuka, lakini maandishi hayasemi wazi hapa. Tafsiri inadumisha jina lenyewe bila kuongeza utambulisho wa kifafanuzi.
- issue: Maana ya “kutoka kinywa cha simba”
  choice: Taswira halisi ya maneno imehifadhiwa
  alternative: Sitiari ya Nero; sitiari ya Shetani; hatari ya kuuawa na wanyama; au kwa jumla hatari ya kifo
  rationale: Maandishi hayaamui kati ya maelezo hayo. Kuhifadhi taswira kunadumisha utata wa kihistoria na kiteolojia uliopo katika chanzo.
- issue: Maana ya πάντα τὰ ἔθνη
  choice: mataifa yote
  alternative: watu wote wa mataifa mengine, yaani wasio Wayahudi
  rationale: ἔθνη linaweza kumaanisha mataifa kwa upana au watu wasio Wayahudi katika muktadha wa utume wa Paulo. Chaguo kuu linahifadhi upana huo, na maana nyingine inaonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo umefanywa kuwa wa asili bila kufuta urudiaji wa kusudi, uwakala wa Paulo, au taswira yenye utata ya simba.
