id: 2TI.4.14
reference: 2 Timothy 4:14
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἀλέξανδρος ὁ χαλκεὺς πολλά μοι κακὰ ἐνεδείξατο— ⸀ἀποδώσει αὐτῷ ὁ κύριος κατὰ τὰ ἔργα αὐτοῦ—
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/014.yaml
  text: Alexander the metalworker showed me many evils[c][b][a]; the Lord will repay him according to his works.
translation:
  language: sw
  text: Aleksanda, fundi wa metali,[a] alinitendea mabaya mengi.[b] Bwana atamlipa kulingana na matendo yake.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “fundi wa shaba.”
    reason: lexical_alternative
  - marker: b
    text: Kwa maana ya karibu zaidi na muundo wa Kigiriki, “alinionyesha mambo mengi mabaya”; au, “alinidhuru sana.”
    reason: lexical_alternative
  - marker: c
    text: Baadhi ya hati zinasoma, “Bwana na amlipe kulingana na matendo yake.”
    reason: textual_variant
lexical_decisions:
- source_word: χαλκεὺς
  choice: fundi wa metali
  rationale: Neno hili humaanisha fundi anayefanya kazi kwa metali, mara nyingi shaba au shaba nyeusi. “Fundi wa metali” linaepuka kutaja metali mahususi kuliko ushahidi unavyoruhusu.
- source_word: πολλά μοι κακὰ ἐνεδείξατο
  choice: alinitendea mabaya mengi
  rationale: Hii ni tafsiri ya asili katika Kiswahili ya tendo la kuonyesha au kudhihirisha mambo mabaya dhidi ya mtu. Inahifadhi wingi wa κακά bila kutoa maana isiyo ya kawaida kana kwamba Aleksanda alimwonyesha Paulo vitu vibaya tu.
- source_word: ἀποδώσει
  choice: atamlipa
  rationale: Kitenzi cha wakati ujao kinaeleza kulipa au kutoa malipo yanayolingana na matendo; “atamlipa” ni cha kawaida na kinahifadhi maana ya hukumu.
- source_word: κύριος
  choice: Bwana
  rationale: Jina hili la heshima linatafsiriwa kwa neno la kawaida la kibiblia “Bwana”; umahususi wa ὁ κύριος unaeleweka kwa jina lenyewe katika Kiswahili.
- source_word: κατὰ τὰ ἔργα αὐτοῦ
  choice: kulingana na matendo yake
  rationale: Usemi huu unaonyesha kwamba malipo yatawiana na matendo yake. “Matendo” linahifadhi maana ya ἔργα kwa lugha iliyo wazi na yenye hadhi.
theological_decisions:
- issue: Ikiwa ἀποδώσει ni taarifa ya wakati ujao au ombi kwamba Bwana amlipe
  choice: Bwana atamlipa
  alternative: Bwana na amlipe
  rationale: Maandishi ya SBLGNT yana ἀποδώσει, kitenzi cha wakati ujao katika hali elezi, kwa hiyo matini kuu inatoa taarifa ya malipo ya Mungu. Usomaji unaolifanya kuwa ombi umehifadhiwa katika tanbihi ili kutatua tofauti ya hati bila kuficha mvutano wake.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Alinitendea mabaya mengi” ni cha kawaida zaidi kuliko kunakili moja kwa moja nahau ya Kigiriki, huku tanbihi ikihifadhi muundo wake wa karibu. Jina “Aleksanda” limeendelezwa kwa tahajia ya Kiswahili.
