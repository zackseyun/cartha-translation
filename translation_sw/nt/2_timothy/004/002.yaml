base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/002.yaml
  text: Preach the word[a]; be ready in season and out of season; reprove, rebuke, exhort[c][b], with all patience and teaching.
translation:
  language: sw
  text: Lihubiri neno; uwe tayari[a] wakati ufaao na wakati usiofaa[b]; onyesha kosa, kemea, himiza[c], kwa saburi yote na mafundisho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “simama tayari” au “lisisitize jambo.” Kitenzi cha Kigiriki kinaweza kuonyesha kuwa tayari, kuwapo kwa ajili ya kazi, au kulisisitiza jambo.
    reason: lexical_alternative
  - marker: b
    text: Yaani, iwe wakati unaofaa au usiofaa.
    reason: lexical_alternative
  - marker: c
    text: Au “tia moyo” au “sihi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κήρυξον
  choice: Lihubiri
  rationale: Kitenzi cha amri κηρύσσω kinamaanisha kutangaza hadharani. “Lihubiri” ni usemi wa kawaida na wenye uzito unaofaa katika agizo hili.
- source_word: τὸν λόγον
  choice: neno
  rationale: Hapa λόγος inaelekea kumaanisha ujumbe wa kitume ambao Timotheo ameagizwa kuutangaza. “Neno” linadumisha upana na uzito wa usemi wa Kigiriki bila kuufafanua kimadhehebu kuwa injili au Maandiko pekee.
- source_word: ἐπίστηθι
  choice: uwe tayari
  rationale: Amri hii inaweza kumaanisha kuwa tayari, kuwapo kwa ajili ya kazi, au kulisisitiza jambo. “Uwe tayari” ni Kiswahili cha asili kinachoendana vizuri na jozi ya nyakati inayofuata.
- source_word: εὐκαίρως ἀκαίρως
  choice: wakati ufaao na wakati usiofaa
  rationale: Jozi hii inaonyesha kutenda bila kujali kama mazingira yanaonekana kufaa au kutofaa. Tafsiri hii inadumisha uwiano wa mkato wa Kigiriki.
- source_word: ἔλεγξον
  choice: karipia
  rationale: ἐλέγχω inahusu kufichua kosa na kulisahihisha. “Karipia” inatoa nguvu ya marekebisho, huku ikibaki tofauti na kemeo kali zaidi linalofuata.
- source_word: ἐπιτίμησον
  choice: kemea
  rationale: Hii ni amri kali ya kukabili kosa. “Kemea” ni neno fupi na la kawaida linalodumisha ukali huo.
- source_word: παρακάλεσον
  choice: himiza
  rationale: παρακαλέω inaweza kumaanisha kusihi, kuhimiza, kutia moyo, au kufariji kulingana na muktadha. “Himiza” hapa linafaa katika mfululizo wa maagizo ya huduma bila kuondoa kabisa wazo la kutia moyo.
- source_word: ἐν πάσῃ μακροθυμίᾳ
  choice: kwa uvumilivu wote
  rationale: μακροθυμία ni subira ya kudumu katika kushughulika na watu, na πάσῃ inasisitiza ukamilifu au kiwango chake chote. Usemi huu unadumisha msisitizo huo wa chanzo.
- source_word: καὶ διδαχῇ
  choice: na kwa kufundisha
  rationale: διδαχή hapa linaweza kueleza mafundisho yenyewe au tendo/namna ya kufundisha inayoambatana na maonyo. “Kwa kufundisha” ni ya asili katika sentensi na inaonyesha kuwa marekebisho yafanywe pamoja na maelekezo.
theological_decisions:
- issue: Upeo wa “neno”
  choice: Neno limetafsiriwa “neno” bila kupanuliwa kuwa “injili” au “Maandiko.”
  alternative: ujumbe; injili; Maandiko
  rationale: Muktadha unahusisha tangazo la kitume linalotegemea Maandiko, lakini λόγος yenyewe haijawekewa mpaka huo wazi katika mstari huu. Tafsiri pana inadumisha mvutano wa maana wa matini.
- issue: Nguvu ya παρακάλεσον
  choice: “Himiza” limetumiwa, huku tanbihi ikitaja “tia moyo.”
  alternative: tia moyo; sihi; fariji
  rationale: Katika muktadha wa karipio na kemeo, kitenzi kina nguvu ya kusihi au kuhimiza, lakini maana yake ya kutia moyo haipaswi kuondolewa kabisa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa moja kwa moja, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Mfululizo wa vitenzi vya amri na uwiano wa “wakati ufaao na wakati usiofaa” vimedumishwa. “Karipia” na “kemea” yametenganishwa ili kuonyesha kupanda kwa ukali bila kuleta istilahi za kimadhehebu.
