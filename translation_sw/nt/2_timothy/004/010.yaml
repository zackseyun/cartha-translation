id: 2TI.4.10
reference: 2 Timothy 4:10
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Δημᾶς γάρ με ⸀ἐγκατέλιπεν ἀγαπήσας τὸν νῦν αἰῶνα, καὶ ἐπορεύθη εἰς Θεσσαλονίκην, Κρήσκης εἰς Γαλατίαν, Τίτος εἰς Δαλματίαν·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/010.yaml
  text: For Demas deserted me[a], having loved the present age, and went to Thessalonica; Crescens to Galatia, Titus to Dalmatia.
translation:
  language: sw
  text: Kwa maana Dema alinitelekeza, akiipenda enzi hii ya sasa[a], akaenda Thesalonike; Kreske akaenda Galatia, na Tito akaenda Dalmatia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ulimwengu huu wa sasa.” Kigiriki kwa maana ya moja kwa moja zaidi hurejelea enzi au kipindi cha sasa.
    reason: lexical_alternative
lexical_decisions:
- source_word: γάρ
  choice: Kwa maana
  rationale: Inaendeleza uhusiano wa sababu na maelezo yaliyotangulia kwa njia ya kawaida na yenye hadhi katika Kiswahili.
- source_word: ἐγκατέλιπεν
  choice: alinitelekeza
  rationale: Kitenzi hiki kinaonyesha kumwacha mtu kwa namna nzito yenye lawama; ‘alinit­elekeza’ huhifadhi uzito huo bila kudai wazi kwamba Dema aliiacha imani.
- source_word: ἀγαπήσας
  choice: akiipenda
  rationale: Muundo huu huhifadhi uhusiano wa karibu kati ya kumpenda enzi ya sasa na kumtelekeza Paulo, bila kuufanya uhusiano huo kuwa wa sababu pekee kwa namna iliyo wazi zaidi kuliko Kigiriki.
- source_word: τὸν νῦν αἰῶνα
  choice: enzi hii ya sasa
  rationale: ‘Enzi’ huhifadhi maana ya wakati au kipindi katika αἰών na huepuka kuifanya kauli hiyo irejelee moja kwa moja ulimwengu wa kimaumbile.
- source_word: ἐπορεύθη
  choice: akaenda
  rationale: Ni usemi wa kawaida wa mwendo unaofaa orodha ya mahali walikokwenda, bila kuongeza maelezo yasiyomo katika chanzo.
- source_word: Θεσσαλονίκην
  choice: Thesalonike
  rationale: Ni umbo la kawaida la Kiswahili la jina hili la mahali.
- source_word: Κρήσκης
  choice: Kreske
  rationale: Ni uhawilishaji unaofaa wa jina hili katika Kiswahili.
- source_word: Γαλατίαν
  choice: Galatia
  rationale: Ni umbo la kawaida la Kiswahili la jina la eneo hili.
- source_word: Τίτος
  choice: Tito
  rationale: Ni umbo la kawaida la Kiswahili la jina hili.
- source_word: Δαλματίαν
  choice: Dalmatia
  rationale: Ni umbo la kawaida la Kiswahili la jina la eneo hili.
theological_decisions:
- issue: Iwapo kuondoka kwa Dema kutafsiriwe kuwa uasi dhidi ya imani au kumwacha Paulo tu
  choice: Imetafsiriwa ‘alinitelekeza,’ ikionyesha uzito wa kitendo chake bila kusema wazi kwamba aliikana imani.
  alternative: Kutumia kauli yenye nguvu zaidi inayodai kwamba Dema aliiacha imani, au kauli hafifu ‘aliniacha.’
  rationale: Aya inasema Dema alimwacha Paulo kwa kuwa aliipenda enzi ya sasa, lakini haisemi moja kwa moja kwamba uasi wake ulikuwa wa mwisho. Tafsiri inahifadhi lawama ya kimaadili na mvutano wa kiteolojia bila kuzidisha ushahidi wa maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa orodha umefupishwa kwa kufuata Kigiriki, huku ‘akaenda’ ikieleweka pia kwa Kreske na Tito.
