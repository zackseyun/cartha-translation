  source_fidelity: 'Tafsiri inafuata kwa uaminifu muundo na maana ya Kigiriki: γάρ ni “Kwa maana”; ἐγκατέλιπεν ni “alinitelekeza,” bila kudai uasi wa imani; ἀγαπήσας inaunganishwa kwa karibu na sababu ya kuondoka; na τὸν νῦν αἰῶνα inatafsiriwa “enzi hii ya sasa,” ikihifadhi maana ya kipindi cha sasa badala ya ulimwengu wa kimaumbile. Orodha ya mahali na udondoshaji wa kitenzi kwa Kreske na Tito pia vimehifadhiwa kwa namna inayoeleweka.'
