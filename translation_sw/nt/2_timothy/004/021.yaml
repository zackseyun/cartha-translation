id: 2TI.4.21
reference: 2 Timothy 4:21
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Σπούδασον πρὸ χειμῶνος ἐλθεῖν. Ἀσπάζεταί σε Εὔβουλος καὶ Πούδης καὶ Λίνος καὶ Κλαυδία καὶ οἱ ἀδελφοὶ πάντες.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/021.yaml
  text: Make every effort to come before winter. Eubulus sends greetings to you[a], and so do Pudens and Linus and Claudia and all the brothers.
translation:
  language: sw
  text: Jitahidi sana kuja kabla ya majira ya baridi. Eubulo anakusalimu, na pia Pudensi, Lino, Klaudia, na ndugu wote.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki lililotafsiriwa “ndugu” lina umbo la kiume, lakini hapa huenda linamaanisha waumini wote, wanaume na wanawake.
    reason: lexical_alternative
lexical_decisions:
- source_word: Σπούδασον
  choice: Jitahidi sana
  rationale: Amri hii inaonyesha bidii pamoja na uharaka. “Jitahidi sana” ni Kiswahili cha kawaida kinachobeba nguvu ya wito huo bila kuwa cha kimazoea kupita kiasi.
- source_word: πρὸ χειμῶνος
  choice: kabla ya majira ya baridi
  rationale: πρό pamoja na hali ya umilikaji huonyesha wakati unaotangulia msimu fulani. “Kabla ya majira ya baridi” ni usemi wa kawaida na ulio wazi katika Kiswahili cha Afrika Mashariki.
- source_word: ἐλθεῖν
  choice: kuja
  rationale: Kitenzi-jina kinakamilisha Σπούδασον na kinamaanisha Timotheo kufika aliko Paulo. “Kuja” huhifadhi mtazamo wa msemaji na ni tafsiri ya moja kwa moja.
- source_word: Ἀσπάζεταί σε
  choice: anakusalimu
  rationale: Katika salamu za barua, ἀσπάζομαι humaanisha kutoa au kutuma salamu. “Anakusalimu” ni ya asili, fupi, na inahifadhi hali ya kibinafsi ya salamu.
- source_word: Εὔβουλος
  choice: Eubulo
  rationale: Jina limetoholewa kwa tahajia na matamshi yanayofaa Kiswahili.
- source_word: Πούδης
  choice: Pude
  rationale: Jina limetoholewa kwa mfumo wa kawaida wa majina katika Kiswahili.
- source_word: Λίνος
  choice: Lino
  rationale: Jina limetoholewa kwa tahajia inayosomeka kwa urahisi katika Kiswahili.
- source_word: Κλαυδία
  choice: Klaudia
  rationale: Jina limetoholewa kwa karibu na umbo la Kigiriki huku likifuata tahajia ya Kiswahili.
- source_word: οἱ ἀδελφοὶ πάντες
  choice: ndugu wote
  rationale: “Ndugu” ndilo neno la kawaida la Kiswahili kwa wa ukoo au washiriki wenzako wa jumuiya, na kwa asili linaweza kuwahusu wanaume na wanawake. Hivyo linahifadhi vizuri uwezekano wa ἀδελφοί kumaanisha waumini wenzao wote bila kuongeza maneno yasiyokuwamo wazi katika chanzo.
theological_decisions:
- issue: Upeo wa ἀδελφοί katika salamu kwa jumuiya ya Kikristo
  choice: ndugu wote
  alternative: waumini wote
  rationale: Kigiriki kinatumia nomino ya wingi yenye umbo la kiume, lakini katika mazingira ya jumuiya inaweza kuwahusu waumini wa kiume na wa kike. Neno la Kiswahili “ndugu” halibainishi jinsia na kwa kawaida linaweza kubeba upana huo; tanbihi inaweka wazi utata uliopo katika chanzo badala ya kuamua kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa sentensi umewekwa mfupi kama salamu ya barua; majina yametoholewa kwa maumbo yanayosomeka kwa kawaida katika Kiswahili.
