  text: Ndugu zangu,[a] msiwe na imani ya Bwana wetu Yesu Masihi, Bwana wa utukufu,[b] huku mkiwatendea watu kwa upendeleo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki kina umbo la “ndugu zangu” la kiume, lakini mwito huu unaielekea jumuiya ya waumini kwa upana, wanaume na wanawake.
    reason: lexical_alternative
  - marker: b
    text: Au, “imani katika Bwana wetu Yesu Masihi.” Pia kirai cha mwisho kinaweza kutafsiriwa, “Bwana wetu mwenye utukufu, Yesu Masihi.”
