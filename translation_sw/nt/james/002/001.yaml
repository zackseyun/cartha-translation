lexical_decisions:
- source_word: Ἀδελφοί μου
  choice: Ndugu zangu
  rationale: “Ndugu” ni mwito wa kawaida na wenye heshima kwa waumini katika Kiswahili; neno hilo halilazimishi jinsia kisarufi kama wingi wa kiume wa Kigiriki, hivyo tanbihi inaeleza umbo la chanzo na upana wa hadhira.
- source_word: μὴ ... ἔχετε
  choice: msiwe na
  rationale: Kitenzi cha agizo pamoja na μὴ kinatoa katazo. “Msiwe na” ni Kiswahili cha kawaida na kinaendana moja kwa moja na kuwa na imani katika hali iliyokatazwa.
- source_word: ἐν προσωπολημψίαις
  choice: huku mkiwapendelea watu
  rationale: Kirai hiki kinaonyesha upendeleo unaodhihirishwa kwa watu. Tafsiri hii ni ya kawaida kuliko “katika mapendeleo” na inawakilisha wingi wa Kigiriki kwa maana ya matendo au mazoea ya upendeleo.
- source_word: τὴν πίστιν
  choice: imani
  rationale: “Imani” ndilo neno la kawaida la Kiswahili kwa πίστις. Kiswahili hakihitaji kibainishi kinacholingana na article ya Kigiriki hapa.
- source_word: τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: ya Bwana wetu Yesu Masihi
  rationale: “Ya” huhifadhi kwa kiasi uhusiano mpana wa genitive bila kuufanya moja kwa moja kuwa “katika.” Χριστός imetafsiriwa “Masihi” kwa kuwa inafanya kazi kama cheo katika mfululizo huu rasmi.
- source_word: τῆς δόξης
  choice: wa utukufu
  rationale: Tafsiri hii inahifadhi muundo wa genitive na uzito wa kristolojia bila kulazimisha maana moja kama “mwenye utukufu” au kuongeza wazi nomino nyingine ya “Bwana.”
theological_decisions:
- issue: Uhusiano wa genitive katika τὴν πίστιν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: imani ya Bwana wetu Yesu Masihi
  alternative: imani katika Bwana wetu Yesu Masihi
  rationale: “Ya” inafuata muundo wa chanzo na kuacha uhusiano wake ukiwa mpana; tanbihi inalinda usomaji wa kawaida unaoielewa kama imani inayomwelekea Yesu.
- issue: Uhusiano wa τῆς δόξης na Bwana Yesu Masihi
  choice: Yesu Masihi wa utukufu
  alternative: Bwana wetu mwenye utukufu, Yesu Masihi; au Yesu Masihi, Bwana wa utukufu
  rationale: “Wa utukufu” huhifadhi nahau iliyoinuliwa na mvutano wa kisintaksia wa chanzo. Tanbihi inaonyesha njia nyingine kuu za kuelewa kirai hicho.
- issue: Maana ya kijamii ya Ἀδελφοί
  choice: Ndugu zangu
  alternative: Ndugu zangu wa kiume na wa kike
  rationale: “Ndugu” ni la asili na jumuishi katika matumizi ya Kiswahili, huku tanbihi ikieleza kwamba umbo la Kigiriki ni la kiume lakini mwito unaelekea jumuiya pana ya waumini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Huku mkiwapendelea watu” huepuka tungo ngumu ya moja kwa moja kama “katika mapendeleo,” na “Masihi” huhifadhi Χριστός kama cheo. Alama zote za tanbihi zimewekwa katika matini kuu.
