  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἀβραὰμ ὁ πατὴρ ἡμῶν οὐκ ἐξ ἔργων ἐδικαιώθη, ἀνενέγκας Ἰσαὰκ τὸν υἱὸν αὐτοῦ ἐπὶ τὸ θυσιαστήριον;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/021.yaml
  text: Was not Abraham our father justified by works when he offered up Isaac his son on the altar?[a]
translation:
  language: sw
  text: Je, Abrahamu baba yetu hakuhesabiwa kuwa mwenye haki kwa matendo, alipomtoa Isaka mwanawe juu ya madhabahu?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alionyeshwa kuwa mwenye haki” au “alithibitishwa kuwa mwenye haki.” Kitenzi cha Kigiriki kinaweza kumaanisha kutangazwa kuwa mwenye haki au kuonyeshwa kuwa mwenye haki, kutegemea muktadha.
    reason: alternative_reading
lexical_decisions:
- source_word: πατὴρ ἡμῶν
  choice: baba yetu
  rationale: Huhifadhi lugha ya kifamilia na utambulisho wa agano, badala ya kuifanya kuwa neno pana zaidi la ‘babu yetu’ au ‘babu wa kale.’
- source_word: ἐξ ἔργων
  choice: kwa matendo
  rationale: Ni usemi mfupi na wa kawaida unaoonyesha msingi au njia inayohusishwa na matendo, huku ukihifadhi istilahi ya mjadala wa kifungu hiki.
- source_word: ἐδικαιώθη
  choice: alihesabiwa kuwa mwenye haki
  rationale: Huhifadhi wazo la kuhesabiwa au kutambuliwa kuwa mwenye haki bila kulazimisha maana ya kutangazwa tu au kuthibitishwa tu; utata halisi unaelezwa katika tanbihi.
- source_word: ἀνενέγκας
  choice: alipomtoa
  rationale: Hutoa kwa Kiswahili cha kawaida nguvu ya wakati ya kitenzi kishirikishi cha aoristi na, katika muktadha wa madhabahu, hudokeza tendo la kumtoa kama sadaka bila kuongeza maelezo marefu.
- source_word: θυσιαστήριον
  choice: madhabahu
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa mahali pa kutolea dhabihu.
- source_word: οὐκ ... ἐδικαιώθη;
  choice: Je, ... hakuhesabiwa kuwa mwenye haki ...?
  rationale: Muundo huu huhifadhi swali la balagha la Kigiriki linalotarajia jibu la kukubali.
theological_decisions:
- issue: Maana ya δικαιόω katika Yakobo 2:21 kuhusiana na matendo
  choice: alihesabiwa kuwa mwenye haki
  alternative: alionyeshwa kuwa mwenye haki; alithibitishwa kuwa mwenye haki; alitangazwa kuwa mwenye haki
  rationale: Chaguo la matini kuu linadumisha uhusiano na mjadala mpana kuhusu kuhesabiwa haki na halitatui kimya kimya mvutano kati ya maana ya kutangaza na ile ya kuonyesha au kuthibitisha. Maana nyingine zinazowezekana zimehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa swali ni wa kawaida na unaeleweka; istilahi ‘kwa matendo’ na ‘kuhesabiwa kuwa mwenye haki’ zinahifadhi mvutano wa kitheolojia wa matini.
