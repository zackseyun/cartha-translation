base_translation:
  language: en
  yaml_path: translation/nt/james/002/018.yaml
  text: But someone will say[a], “You have faith, and I have works.” Show me your faith apart from works[c][b], and I will show you my faith by my works.
translation:
  language: sw
  text: Lakini mtu atasema, “Wewe una imani, nami nina matendo.” Nionyeshe imani yako pasipo matendo[a], nami nitakuonyesha imani yangu kwa matendo yangu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “bila matendo.” Fungu la maneno ya Kigiriki linaweza kutafsiriwa “pasipo matendo” au “bila matendo.”
    reason: lexical_alternative
  - marker: b
    text: Au “kutokana na matendo yangu.” Kihusishi cha Kigiriki kinaweza kuonyesha chanzo au njia; “kwa matendo yangu” kinaonyesha kwamba matendo yanaifanya imani ionekane.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀλλ’
  choice: Lakini
  rationale: Kiunganishi hiki kinaonyesha pingamizi au tofauti katika hoja ya Yakobo; “Lakini” ni ya kawaida na ya moja kwa moja.
- source_word: ἐρεῖ τις
  choice: mtu atasema
  rationale: Wakati ujao wa Kigiriki unaanzisha msemaji wa kudhaniwa katika mtindo wa hoja; “atasema” huhifadhi umbo na nguvu hiyo ya balagha.
- source_word: πίστιν / πίστιν
  choice: imani
  rationale: “Imani” ndilo neno la kawaida katika Kiswahili kwa πίστις hapa na huhifadhi mvutano kati ya imani inayodaiwa na matendo yanayoionyesha bila kuamua mapema kuwa maana ni uaminifu.
- source_word: ἔργα / ἔργων
  choice: matendo
  rationale: “Matendo” ni tafsiri ya kawaida na inayoeleweka katika mjadala wa Yakobo kuhusu imani na matendo; pia hudumisha urudiaji wa neno katika aya.
- source_word: δεῖξόν μοι
  choice: Nionyeshe
  rationale: Amri hii inataka udhihirisho wa wazi; “Nionyeshe” ni ya moja kwa moja, ya asili, na haiongezi dhana kali zaidi ya kuthibitisha kabisa.
- source_word: χωρὶς τῶν ἔργων
  choice: pasipo matendo
  rationale: χωρίς inaweza kumaanisha “mbali na” au “bila”; “pasipo matendo” ni Kiswahili cha asili kinachohifadhi wazo la imani inayotengwa na matendo.
- source_word: κἀγώ σοι δείξω
  choice: nami nitakuonyesha
  rationale: “Nami” huhifadhi msisitizo na ulinganifu wa κἀγώ, huku “nitakuonyesha” ikifuata wakati ujao wa kitenzi.
- source_word: ἐκ τῶν ἔργων μου
  choice: kwa matendo yangu
  rationale: ἐκ hapa inaweza kuonyesha chanzo au njia; “kwa matendo yangu” hueleza kwa kawaida kwamba matendo ndiyo yanayoifanya imani ionekane.
theological_decisions:
- issue: Maana ya πίστις katika mjadala wa imani na matendo
  choice: imani
  alternative: tumaini; uaminifu
  rationale: “Imani” huhifadhi neno kuu la hoja ya Yakobo na mvutano wake wa kitheolojia. “Uaminifu” ungeelekeza tafsiri mapema kwenye tabia badala ya imani inayodaiwa.
- issue: Uhusiano kati ya imani na matendo katika χωρὶς na ἐκ
  choice: pasipo matendo ... kwa matendo yangu
  alternative: mbali na matendo ... kutokana na matendo yangu
  rationale: Tafsiri hii haiongezi dai kwamba matendo huumba au kustahilisha imani; inaacha hoja ya aya kwamba imani isiyoambatana na matendo haiwezi kuonyeshwa, na kwamba matendo huifanya imani ionekane.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa moja kwa moja na urudiaji wa “imani” na “matendo” umehifadhiwa ili kudumisha ulinganifu wa hoja ya Kigiriki.
