  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Εἰ μέντοι νόμον τελεῖτε βασιλικὸν κατὰ τὴν γραφήν Ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν, καλῶς ποιεῖτε·
base_translation:
  language: en
  yaml_path: translation/nt/james/002/008.yaml
  text: If[a], however, you are fulfilling the royal law according to the Scripture, “You shall love your neighbor as yourself,” you are doing well.
translation:
  language: sw
  text: Lakini ikiwa mnaitimiza sheria ya kifalme[a] kwa mujibu wa Andiko, “Mpende jirani yako kama unavyojipenda mwenyewe,” mnafanya vema.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sheria ya mfalme” au “sheria ya ufalme.” Kigiriki kinasema “sheria ya kifalme,” jambo linaloweza kusisitiza kwamba sheria hiyo inatoka kwa mfalme au kwamba ina hadhi kuu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ μέντοι
  choice: Hata hivyo, ikiwa
  rationale: Kauli hii inadumisha sharti linaloletwa na εἰ pamoja na tofauti au tahadhari ya upole inayodokezwa na μέντοι.
- source_word: νόμον ... βασιλικὸν
  choice: sheria ya kifalme
  rationale: Kivumishi βασιλικός kwa kawaida humaanisha kitu cha kifalme au kinachomhusu mfalme. Tafsiri hii haifungi maana iwe chanzo cha sheria, hadhi yake kuu, au uhusiano wake na ufalme.
- source_word: τελεῖτε
  choice: mnaitimiza
  rationale: Kitenzi τελέω hapa kina maana ya kutekeleza au kutimiza takwa; umbo la wakati uliopo na wingi limehifadhiwa.
- source_word: κατὰ τὴν γραφήν
  choice: kwa mujibu wa Andiko
  rationale: Kirai hiki kinaonyesha kupatana na yale yaliyoandikwa; ‘Andiko’ linahifadhi umoja na kibainishi cha neno la Kigiriki γραφή.
- source_word: Ἀγαπήσεις
  choice: Mpende
  rationale: Wakati ujao wa Kigiriki unatumiwa kama amri katika nukuu ya Walawi 19:18. Amri ya Kiswahili huwasilisha nguvu hiyo kwa njia ya kawaida.
- source_word: τὸν πλησίον σου
  choice: jirani yako
  rationale: ‘Jirani’ ni neno la kawaida na lililozoeleka kwa πλησίον katika maana hii ya kimaadili.
- source_word: ὡς σεαυτόν
  choice: kama unavyojipenda mwenyewe
  rationale: Kiswahili hiki cha kawaida kinaweka wazi ulinganisho uliokusudiwa bila kubadili maana yake.
- source_word: καλῶς ποιεῖτε
  choice: mnafanya vema
  rationale: Kirai hiki kinathibitisha kwamba tendo hilo ni sahihi na kinahifadhi wakati uliopo pamoja na nafsi ya wingi.
theological_decisions:
- issue: Maana ya ‘sheria ya kifalme’
  choice: Sheria inaelezwa kuwa ya kifalme bila kuamua iwapo msisitizo ni kwamba imetoka kwa Mfalme, ina hadhi kuu, au inahusiana na ufalme.
  alternative: Sheria iliyotolewa na Mfalme; sheria kuu kuliko sheria nyingine; sheria ya ufalme.
  rationale: Kivumishi βασιλικός kinaruhusu maana hizi zihusiane. Matini kuu na tanbihi zinahifadhi upana huo badala ya kulazimisha ufafanuzi mmoja wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaoeleweka kwa urahisi. ‘Kwa mujibu wa Andiko’ hudumisha umoja wa neno la chanzo, huku nukuu ya amri ikitolewa kwa Kiswahili cha kawaida.
