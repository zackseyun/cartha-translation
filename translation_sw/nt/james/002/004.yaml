translation:
  language: sw
  text: Je, hamjafanya ubaguzi miongoni mwenu[a] na mkawa waamuzi wenye mawazo maovu?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hamjawatofautisha watu miongoni mwenu kwa ubaguzi?” Kitenzi hiki kinaweza pia kumaanisha “kugawanyika” au, katika miktadha mingine, “kutia shaka”; lakini hapa muktadha unaelekeza kwenye kuwabagua watu.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “waamuzi wa mawazo au fikira maovu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διεκρίθητε
  choice: hamjafanya ubaguzi
  rationale: Katika muktadha wa Yakobo 2:1–3, kitenzi hiki kinahusu kutofautisha watu kwa upendeleo. Kiswahili ‘kufanya ubaguzi’ kinaweka wazi kitendo hicho bila kukihamishia kwenye maana ya ‘kutia shaka,’ ingawa kitenzi cha Kigiriki kinaweza kuwa na maana nyingine katika miktadha mingine.
- source_word: ἐν ἑαυτοῖς
  choice: miongoni mwenu
  rationale: Usemi huu hapa unafaa kueleweka kwa maana ya kijamii ndani ya jumuiya, ambako matajiri na maskini wanatendewa tofauti. ‘Miongoni mwenu’ ni ya kawaida na inaeleweka kwa urahisi.
- source_word: ἐγένεσθε
  choice: kuwa
  rationale: 'Kitenzi kinaonyesha matokeo ya kitendo kilichotangulia: kwa kufanya ubaguzi, wamekuwa waamuzi wa aina fulani. Katika muundo huu wa swali, ‘na kuwa’ ni Kiswahili cha asili na chenye ufupi.'
- source_word: κριταὶ
  choice: waamuzi
  rationale: ‘Waamuzi’ huhifadhi maana ya kisheria na ya kimaadili ya κριταί na inafaa kwa karipio la Yakobo.
- source_word: διαλογισμῶν πονηρῶν
  choice: wenye mawazo maovu
  rationale: Muundo wa Kigiriki ni kihalisi ‘waamuzi wa mawazo/mawazowazo maovu.’ ‘Wenye mawazo maovu’ ni wa kawaida katika Kiswahili na unaonyesha kwamba hukumu zao zinaongozwa au kutambulishwa na fikira mbaya, bila kuibana maana kuwa nia pekee.
- source_word: οὐ
  choice: Je, hamjafanya ...?
  rationale: Muundo hasi wa swali la balagha unatarajia jibu la ndiyo. ‘Je, hamjafanya...?’ huhifadhi nguvu ya karipio hilo katika Kiswahili.
theological_decisions:
- issue: Maana ya διακρίνω kuhusiana na upendeleo
  choice: Mstari unakemea ubaguzi unaofanywa ndani ya jumuiya ya waamini.
  alternative: Mstari unasema wamegawanyika moyoni au wametia shaka.
  rationale: Muktadha wa karibu, Yakobo 2:1–3, unaeleza kumstahi tajiri kuliko maskini. Kwa hiyo maana ya kutofautisha watu kwa ubaguzi ndiyo inayofaa zaidi hapa, huku tanbihi ikihifadhi uwezekano mpana wa kitenzi hicho.
- issue: Uhusiano wa διαλογισμῶν πονηρῶν na κριταὶ
  choice: ‘Waamuzi wenye mawazo maovu,’ ukiwasilisha genitivi kama sifa ya waamuzi.
  alternative: ‘Waamuzi wa mawazo maovu,’ tafsiri ya karibu zaidi na umbo la Kigiriki lakini yenye utata zaidi katika Kiswahili.
  rationale: Kigiriki kinaweza kueleweka kama waamuzi wanaotawaliwa au kutambulishwa na fikira mbaya. Tafsiri kuu iwe ya asili, huku tanbihi ikionyesha muundo halisi na kutohitimisha kwa lazima kuwa ni ‘nia’ pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Swali la balagha na karipio la mstari vimehifadhiwa. ‘Ubaguzi’ ni neno la wazi katika muktadha huu, na tanbihi zinatunza utata halisi wa maneno ya Kigiriki.
