review_pass:
  verdict: revise
  source_fidelity: The main clause and the rendering of θέλεις δὲ γνῶναι, ὅτι, πίστις, and χωρὶς τῶν ἔργων are faithful. However, “mtu usiye na akili” can denote a person lacking intelligence and is more psychologically specific than κενέ (“empty,” hence foolish/vain). “Mpumbavu” better conveys the rhetorical rebuke without asserting intellectual incapacity. “Haina faida” is defensible for ἀργή, but “haifanyi kazi” more directly retains the term’s sense of being inactive or ineffective.
  naturalness: The proposed revision is idiomatic, current Standard East African Swahili. “Ewe mtu mpumbavu” is a natural direct address in a serious literary register, and “imani bila matendo haifanyi kazi” is clear and suitably forceful without importing the nearby term “dead.”
  terminology: '“Imani” and “matendo” are established, neutral renderings. The revision avoids denominational interpretation: it neither calls the faith dead nor explains the faith-and-works relationship beyond the wording of the verse.'
  issues:
  - severity: medium
    issue: “mtu usiye na akili” over-specifies κενέ
    rationale: The Greek adjective literally denotes emptiness and functions here as a reproach such as “foolish” or “vain.” Saying that the person lacks intelligence can imply an inherent cognitive deficiency, which is not required by the source.
  - severity: low
    issue: “haina faida” is less direct for ἀργή
    rationale: Although “useless” is a legitimate contextual sense, ἀργή primarily denotes inactivity or ineffectiveness. “Haifanyi kazi” preserves this nuance naturally in Swahili.
  revised_text: Lakini je, unataka kujua, ewe mtu mpumbavu[a], kwamba imani bila matendo haifanyi kazi[b]?
