base_translation:
  language: en
  yaml_path: translation/nt/james/002/020.yaml
  text: But do you want to know[a], O foolish man[b], that faith apart from works is useless?
translation:
  language: sw
  text: Lakini je, unataka kujua, ewe mtu mpumbavu[a], kwamba imani bila matendo haifanyi kazi[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “ewe mtu mtupu.” Neno la Kigiriki hapa ni shutumu linaloweza kumaanisha mtu mpumbavu au mtu asiye na maana.
    reason: lexical_alternative
  - marker: b
    text: Au, “haina faida” au “haina matokeo.” Neno la Kigiriki humaanisha kuwa kitu hakitendi kazi, hakifanyi kazi, au hakizai matokeo.
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλεις δὲ γνῶναι
  choice: Lakini je, unataka kujua
  rationale: “Unataka” huhifadhi maana ya hiari katika θέλεις, “kujua” hutafsiri γνῶναι moja kwa moja, na “lakini” hubeba nguvu ya δέ katika mwendelezo wa hoja.
- source_word: ὦ ἄνθρωπε κενέ
  choice: ewe mtu usiye na akili
  rationale: “Ewe mtu” huhifadhi usemi wa moja kwa moja kwa mtu mmoja. Katika muktadha huu κενέ humaanisha mtu asiye na ufahamu au busara; tafsiri hii ni ya asili katika Kiswahili, huku maana halisi ya “mtupu” ikihifadhiwa katika tanbihi.
- source_word: ὅτι
  choice: kwamba
  rationale: ὅτι hapa hutambulisha jambo ambalo msikilizaji anapaswa kujua.
- source_word: ἡ πίστις
  choice: imani
  rationale: “Imani” ndiyo tafsiri ya kawaida na isiyoongeza ufafanuzi wa kimadhehebu katika hoja hii.
- source_word: χωρὶς τῶν ἔργων
  choice: bila matendo
  rationale: “Bila” huonyesha kutokuwapo au kutengwa kunakodokezwa na χωρίς, na “matendo” ni tafsiri ya kawaida ya ἔργων katika muktadha huu.
- source_word: ἀργή ἐστιν
  choice: haina faida
  rationale: ἀργή hueleza kitu kisichotenda, kisicho na matokeo, au kisichofaa. “Haina faida” huwasilisha nguvu ya kauli hiyo kwa Kiswahili cha sasa bila kuibadilisha kuwa “imekufa,” neno linalotumiwa katika mistari iliyo karibu lakini si hapa.
theological_decisions:
- issue: Uhusiano wa imani na matendo katika hoja ya Yakobo
  choice: 'Kauli imetafsiriwa moja kwa moja: imani bila matendo “haina faida.”'
  alternative: Kutafsiri kwa udhaifu zaidi kuwa “haitendi kazi,” au kwa nguvu zaidi kuwa “imekufa.”
  rationale: Neno la mstari huu ni ἀργή, si νεκρά. Tafsiri haipaswi kuingiza maelezo ya kimadhehebu wala kuunganisha kimya kimya lugha ya mstari huu na ile ya mistari iliyo karibu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Usemi wa moja kwa moja “ewe mtu” umehifadhiwa, lakini sitiari isiyo ya kawaida ya “mtu mtupu” imewekwa katika tanbihi ili maana na taswira ya Kigiriki zisipotee.
