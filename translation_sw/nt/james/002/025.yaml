  text: ὁμοίως δὲ καὶ Ῥαὰβ ἡ πόρνη οὐκ ἐξ ἔργων ἐδικαιώθη, ὑποδεξαμένη τοὺς ἀγγέλους καὶ ἑτέρᾳ ὁδῷ ἐκβαλοῦσα;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/025.yaml
  text: And likewise[b][a], was not Rahab the prostitute also justified by works when she welcomed the messengers and sent them out by another way?
translation:
  language: sw
  text: Vivyo hivyo, je, Rahabu, yule kahaba, naye hakuhesabiwa haki[a] kwa matendo, alipowakaribisha wale wajumbe[b] na kuwatuma waondoke kwa njia nyingine?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alionyeshwa kuwa mwenye haki,” au “alitangazwa kuwa mwenye haki.” Kigiriki kina neno linalotafsiriwa “alihesabiwa haki”; tafsiri hii huhifadhi neno hilo bila kuamua mjadala kuhusu kivuli chake cha maana hapa.
    reason: lexical_alternative
  - marker: b
    text: 'Kigiriki: “wajumbe.” Muktadha unawahusu wale wanaume Rahabu aliowapokea (Yoshua 2), si malaika wa mbinguni.'
    reason: cross_reference
lexical_decisions:
- source_word: ὁμοίως δὲ καὶ
  choice: Vivyo hivyo
  rationale: Inaunganisha mfano wa Rahabu na ule wa Abrahamu uliotangulia na kuonyesha ulinganisho; Kiswahili hiki ni cha kawaida na hakihitaji kurudia kiunganishi cha nyongeza ambacho kingefanya sentensi kuwa nzito.
- source_word: Ῥαὰβ
  choice: Rahabu
  rationale: Hili ndilo umbo la jina linalotumiwa kwa kawaida katika Biblia za Kiswahili.
- source_word: ἡ πόρνη
  choice: yule kahaba
  rationale: Neno πόρνη humaanisha mwanamke anayefanya ukahaba. ‘Kahaba’ ni neno la sasa, wazi, na lenye uzito wa kijamii na kimaadili wa asili.
- source_word: οὐκ ... ἐδικαιώθη
  choice: hakuhesabiwa kuwa mwenye haki
  rationale: Huwasilisha lugha ya δικαιόω kwa Kiswahili cha kawaida huku ikihifadhi maana ya hukumu au utambuzi wa kuwa mwenye haki; tanbihi inataja uwezekano mwingine bila kuamua mjadala wa kitheolojia.
- source_word: ἐξ ἔργων
  choice: kwa matendo
  rationale: ‘Kwa matendo’ huonyesha msingi au njia inayozungumziwa katika hoja ya Yakobo na kudumisha uhusiano wa istilahi na muktadha wa sura ya 2.
- source_word: ὑποδεξαμένη
  choice: alipowakaribisha
  rationale: Kitenzi kinaonyesha kuwapokea kwa ukarimu; ‘alipowakaribisha’ ni cha asili na huonyesha uhusiano wa tendo hilo na dai kuu.
- source_word: τοὺς ἀγγέλους
  choice: wale wajumbe
  rationale: ἄγγελος inaweza kumaanisha malaika au mjumbe. Katika simulizi la Rahabu, hawa ni watu waliotumwa, kwa hiyo ‘wajumbe’ huhifadhi maana ya neno bila kuongeza ufafanuzi wa ‘wapelelezi’ ndani ya matini.
- source_word: καὶ ἑτέρᾳ ὁδῷ ἐκβαλοῦσα
  choice: na kuwaondoa kwa njia nyingine
  rationale: Katika muktadha huu ἐκβάλλω ni kuwatoa au kuwaondosha, si kuwafukuza kwa nguvu. ‘Kwa njia nyingine’ huhifadhi tofauti ya ἑτέρᾳ ὁδῷ.
theological_decisions:
- issue: Maana ya δικαιόω katika Yakobo 2:25 kuhusiana na imani na matendo
  choice: Kuhesabiwa kuwa mwenye haki, pamoja na tanbihi inayotaja ‘kuonyeshwa kuwa mwenye haki’ na ‘kutangazwa kuwa mwenye haki.’
  alternative: Kuonyeshwa kuwa mwenye haki; kutangazwa kuwa mwenye haki.
  rationale: δικαιόω inaweza kueleweka kwa vivuli tofauti vya maana katika hoja hii. Matini kuu hutumia usemi mpana wa kawaida wa Kiswahili, huku tanbihi ikihifadhi uwezekano wa uthibitisho au tangazo bila kuufungamanisha mstari na mfumo fulani wa kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa swali la balagha umehifadhiwa. Alama zote za tanbihi zimewekwa katika matini kuu karibu na maneno yanayohusika.
