  naturalness: «Kuhesabiwa haki» ni usemi mfupi, wa kawaida, na unaotambulika katika Kiswahili Sanifu cha Biblia kuliko «kuhesabiwa kuwa mwenye haki». Kuongeza «naye» kunawakilisha nguvu ya nyongeza ya καὶ kwa mtiririko wa asili.
  terminology: «Rahabu», «kahaba», «matendo», na «wajumbe» zinafaa. «Kuhesabiwa haki» huhifadhi istilahi ya δικαιόω bila kuamua iwapo dhamira ni kutangazwa haki au kuonyeshwa kuwa haki. Tanbihi imerekebishwa ili isidai kwamba Kigiriki chenyewe ‘kinaweza kutafsiriwa’ kwa tafsiri za kiufafanuzi; badala yake, inaeleza kuwa hizo ni njia mbadala za kuelewa/kutafsiri neno hilo.
