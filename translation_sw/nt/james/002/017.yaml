  yaml_path: translation/nt/james/002/017.yaml
  text: So also faith[a], if it does not have works, is dead by itself.
translation:
  language: sw
  text: Vivyo hivyo, imani[a] ikiwa haina matendo, imekufa ikiwa peke yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “tumaini”; kwa uwezekano mdogo katika muktadha huu, “uaminifu.” Neno la Kigiriki pistis linaweza kuwa na maana hizi, lakini “imani” linafaa zaidi katika hoja ya Yakobo katika mstari huu.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως καὶ
  choice: Vivyo hivyo
  rationale: Huonyesha ulinganisho na hitimisho linalotokana na mfano uliotangulia, kwa Kiswahili cha kawaida na fasaha.
- source_word: ἡ πίστις
  choice: imani
  rationale: Katika hoja ya Yakobo, neno hili linamaanisha imani inayodaiwa kuwa ipo; “imani” huhifadhi uzito wa neno na mvutano wake na matendo bila kulifasiri kupita kiasi.
- source_word: ἐὰν μὴ ἔχῃ
  choice: ikiwa haina
  rationale: Huwasilisha kwa uwazi sharti hasi la Kigiriki katika Kiswahili cha sasa.
- source_word: ἔργα
  choice: matendo
  rationale: Humaanisha mambo yanayotendwa kwa nje yanayoonyesha imani, huku likihifadhi uhusiano wa kileksika na hoja pana ya Yakobo 2.
- source_word: νεκρά
  choice: imekufa
  rationale: Huhifadhi sitiari kali na ya moja kwa moja ya maandishi ya Kigiriki.
- source_word: καθ’ ἑαυτήν
  choice: yenyewe
  rationale: Huonyesha imani ikiwa peke yake, bila matendo, bila kuongeza ufafanuzi wa kiteolojia.
theological_decisions:
- issue: Tafsiri ya πίστις katika mjadala kuhusu imani na matendo
  choice: imani
  alternative: kutumaini; uaminifu
  rationale: “Imani” inafaa zaidi katika hoja hii kuhusu imani inayodaiwa lakini isiyo na matendo. Chaguo hili halisuluhishi kimadhehebu uhusiano wa imani na matendo, bali huhifadhi kauli kali ya Yakobo kwamba imani isiyo na matendo imekufa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo ni mfupi na wenye nguvu kama maandishi ya chanzo.
