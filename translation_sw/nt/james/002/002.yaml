  text: ἐὰν γὰρ εἰσέλθῃ ⸀εἰς συναγωγὴν ὑμῶν ἀνὴρ χρυσοδακτύλιος ἐν ἐσθῆτι λαμπρᾷ, εἰσέλθῃ δὲ καὶ πτωχὸς ἐν ῥυπαρᾷ ἐσθῆτι,
base_translation:
  language: en
  yaml_path: translation/nt/james/002/002.yaml
  text: For if a man wearing gold rings and bright clothing enters into your assembly[a], and a poor man in filthy clothing also enters,
translation:
  language: sw
  text: Kwa maana, ikiwa mwanamume mwenye pete za dhahabu, aliyevaa mavazi ya kung'aa, ataingia katika kusanyiko lenu[a], na mwanamume maskini aliyevaa mavazi machafu ataingia pia,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sinagogi.” Neno la Kigiriki ni synagōgē, yaani “sinagogi” au “kusanyiko.”
    reason: lexical_alternative
lexical_decisions:
- source_word: συναγωγήν
  choice: kusanyiko
  rationale: Neno hili huweza kumaanisha sinagogi au mkusanyiko. Katika mfano huu, “kusanyiko” linaeleza kwa kawaida mkutano wa waamini bila kulazimisha maana ya jengo au taasisi rasmi ya Kiyahudi; maana mbadala imehifadhiwa katika tanbihi.
- source_word: ἀνὴρ
  choice: mwanamume
  rationale: Nomino ya Kigiriki ni ya kiume na ya umoja; “mwanamume” huhifadhi jinsia iliyo wazi katika mfano.
- source_word: χρυσοδακτύλιος
  choice: mwenye pete za dhahabu
  rationale: Kivumishi hiki humweleza mtu aliyepambwa dhahabu vidoleni; Kiswahili hiki ni cha asili na kinadumisha picha ya utajiri unaoonekana.
- source_word: ἐσθῆτι λαμπρᾷ
  choice: aliyevaa mavazi ya kung'aa
  rationale: λαμπρός inaweza kueleza kitu chenye kung'aa, kizuri sana, au cha fahari. “Mavazi ya kung'aa” huhifadhi taswira ya macho bila kuondoa kabisa dokezo la hadhi.
- source_word: πτωχὸς
  choice: maskini
  rationale: Kivumishi hiki kimetumika kama nomino kumtaja mtu maskini. Kwa Kiswahili, “maskini” ni ya kawaida na inatosha katika ulinganifu huu.
- source_word: ῥυπαρᾷ ἐσθῆτι
  choice: mavazi machafu
  rationale: ῥυπαρός ina maana yenye nguvu ya uchafu; “machafu” ni ya moja kwa moja na haipunguzi maana kuwa mavazi yaliyochakaa tu.
- source_word: εἰσέλθῃ ... εἰσέλθῃ
  choice: akiingia ... akiingia pia
  rationale: Kurudia kitenzi huhifadhi muundo sambamba wa hali ya kudhaniwa katika Kigiriki.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Kirai hiki kinaunganisha mfano na katazo la upendeleo katika mstari uliotangulia, kikionyesha kuwa huu ni ufafanuzi wake.
theological_decisions:
- issue: Maana ya συναγωγή katika waraka unaowaandikia waamini
  choice: kusanyiko
  alternative: sinagogi
  rationale: Muktadha ni mkutano wa wale wanaosoma waraka, lakini neno lenyewe linaweza kuwa “sinagogi.” “Kusanyiko” huepuka kudai kwamba taasisi rasmi ya sinagogi ndiyo inayomaanishwa, huku tanbihi ikihifadhi uwezekano wa tafsiri ya moja kwa moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi umeachwa wazi kama kishazi kinachoendelea katika mstari unaofuata, kama ilivyo katika chanzo.
