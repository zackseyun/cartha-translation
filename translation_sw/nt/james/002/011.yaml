  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὁ γὰρ εἰπών Μὴ ⸀μοιχεύσῃς εἶπεν καί Μὴ ⸀φονεύσῃς· εἰ δὲ οὐ ⸂μοιχεύεις φονεύεις⸃ δέ, γέγονας παραβάτης νόμου.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/011.yaml
  text: For he who said, “Do not commit adultery,” also said, “Do not murder.” Now if you do not commit adultery but do murder, you have become a transgressor of the law.
translation:
  language: sw
  text: Kwa maana yeye aliyesema, “Usizini,” alisema pia, “Usiue.” Lakini ikiwa huzini lakini unaua, umekuwa mvunjaji wa sheria.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ... εἰπών
  choice: yeye aliyesema
  rationale: Kirai cha kisifa chenye kibainishi kimetumika kama nomino. Tafsiri hii inadumisha rejeo la kibinafsi kwa mtoa amri bila kuongeza wazi neno “Mungu,” ambalo halipo katika Kigiriki.
- source_word: Μὴ μοιχεύσῃς
  choice: Usizini
  rationale: Hii ni njia ya kawaida, wazi, na yenye hadhi ya kutoa katazo hili kwa Kiswahili, nayo inadumisha mwangwi wa amri.
- source_word: καί
  choice: pia
  rationale: Neno hili linaonyesha kwamba msemaji yuleyule alitoa amri ya pili pia, jambo ambalo ni msingi wa hoja ya Yakobo.
- source_word: Μὴ φονεύσῃς
  choice: Usiue
  rationale: Katika muktadha wa amri, “usiue” ndiyo kauli iliyozoeleka na hueleweka kama katazo la kumuua mtu isivyo halali; “usifanye mauaji” si ya asili sawa katika nukuu ya amri.
- source_word: εἰ δὲ
  choice: Basi ikiwa
  rationale: Inaashiria hatua inayofuata ya hoja na kuanzisha mfano wa sharti kwa Kiswahili cha kawaida.
- source_word: οὐ μοιχεύεις ... φονεύεις δέ
  choice: huzini lakini unaua
  rationale: Vitenzi vya wakati wa sasa vinawasilisha hali ya jumla, huku “lakini” ikidumisha ulinganisho mkali kati ya kutotenda kosa moja na kutenda jingine.
- source_word: γέγονας
  choice: umekuwa
  rationale: Wakati timilifu wa Kigiriki unaonyesha kuingia katika hali yenye matokeo yanayoendelea; “umekuwa” inadumisha maana hiyo kuliko “wewe ni” pekee.
- source_word: παραβάτης νόμου
  choice: mvunjaji wa sheria
  rationale: Ni Kiswahili cha sasa na kinachoeleweka kwa urahisi, huku kikidumisha sajili ya kisheria na kimaadili ya mtu anayekiuka sheria.
- source_word: νόμου
  choice: sheria
  rationale: Katika Kiswahili, “sheria” bila kiashiria kingine inarejelea kwa kawaida sheria ya Mungu inayojadiliwa katika muktadha; kuongeza “hiyo” kungeweza kuifanya ionekane kuwa amri moja tu.
theological_decisions:
- issue: Utambulisho wa msemaji wa amri
  choice: “yeye aliyesema” bila kuongeza “Mungu” katika matini
  alternative: “Mungu aliyesema”
  rationale: Muktadha unaonyesha wazi kwamba Mungu ndiye msemaji, lakini Kigiriki hakitaji jina “Mungu” hapa. Tafsiri inadumisha namna ya usemi ya chanzo bila kuficha rejeo hilo.
- issue: Upeo wa kuvunja sheria katika hoja ya Yakobo
  choice: “mvunjaji wa sheria”
  alternative: “mvunjaji wa amri hiyo”
  rationale: Yakobo anasema kwamba kuvunja amri moja humfanya mtu kuwa mvunjaji wa sheria, si wa amri hiyo pekee. Kauli pana ya chanzo imehifadhiwa.
- issue: Maana ya katazo φονεύω
  choice: “Usiue” katika nukuu ya amri
  alternative: “Usifanye mauaji” au “Usiue mtu isivyo halali”
  rationale: Kitenzi kinahusu kuua mtu kwa kosa, si kila aina ya kuua. Hata hivyo, katika Kiswahili nukuu iliyozoeleka “Usiue” hubeba nguvu ya amri bila kuingiza ufafanuzi mrefu ndani ya matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa hoja na tofauti kati ya amri mbili umehifadhiwa kwa ufupi na kwa uwazi.
