  text: You see that a man is justified by works and not by faith alone[a][b][c].
translation:
  language: sw
  text: Mnaona kwamba mtu huhesabiwa haki kwa matendo, wala si kwa imani peke yake[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “huonyeshwa kuwa mwadilifu” au “huthibitishwa kuwa mwenye haki.” Maneno ya Yakobo yamehifadhiwa bila kuamua mjadala wa jinsi yanavyohusiana na matumizi ya Paulo ya kitenzi hiki.
    reason: alternative_reading
  - marker: b
    text: Neno la Kigiriki linalotafsiriwa “imani” linaweza pia kumaanisha “uaminifu” au “kumtumaini,” lakini “imani” ndiyo tafsiri ya kawaida hapa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁρᾶτε
  choice: Mnaona
  rationale: Kitenzi cha wakati uliopo, nafsi ya pili wingi, kinawahutubia wasomaji moja kwa moja kwa msingi wa mfano uliotangulia. “Mnaona” ni Kiswahili cha kawaida na huhifadhi hali ya taarifa badala ya kukifanya kuwa amri.
- source_word: ἐξ ἔργων
  choice: kwa matendo
  rationale: ἐξ pamoja na hali ya umilikishi huonyesha msingi au njia katika hoja hii. “Kwa matendo” huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: δικαιοῦται
  choice: huhesabiwa kuwa mwadilifu
  rationale: δικαιόω inaweza kumaanisha kuhesabiwa au kutangazwa kuwa mwadilifu, au kuthibitishwa kuwa mwenye haki. Chaguo hili huhifadhi uzito wa istilahi na mvutano wa kitheolojia bila kuamua kimya-kimya kwamba maana yake hapa ni uthibitisho tu.
- source_word: ἄνθρωπος
  choice: mtu
  rationale: Ingawa nomino ya Kigiriki ni ya umoja na kisarufi ni ya kiume, hapa inatumiwa kwa maana ya jumla kuhusu mwanadamu. Kiswahili “mtu” ni tafsiri sahihi na ya asili isiyodokeza kuwa wanaume pekee ndio wanaokusudiwa.
- source_word: πίστεως
  choice: imani
  rationale: “Imani” ndiyo tafsiri ya kawaida ya πίστις katika muktadha huu na huhifadhi tofauti inayowekwa kati ya matendo na imani iliyo peke yake.
- source_word: μόνον
  choice: peke yake
  rationale: Kirai “imani peke yake” ni cha asili katika Kiswahili na huonyesha wazi upekee unaoelezwa na μόνον.
theological_decisions:
- issue: Maana ya δικαιοῦται na uhusiano wake na fundisho la kuhesabiwa haki
  choice: Kuhifadhi “huhesabiwa kuwa mwadilifu” katika matini kuu
  alternative: “huonyeshwa kuwa mwadilifu” au “huthibitishwa kuwa mwenye haki”
  rationale: Yakobo anaweza kuwa akitumia δικαιόω kwa maana ya kuhesabiwa mwadilifu au ya kuthibitishwa kuwa mwenye haki. Tafsiri kuu haiondoi mvutano huu kwa kuamua tafsiri moja ya kimadhehebu; tanbihi inaonyesha maana nyingine inayowezekana.
- issue: Maana ya jumla ya ἄνθρωπος
  choice: “mtu”
  alternative: “mwanadamu”
  rationale: Katika Kiswahili, “mtu” huwasilisha kwa usahihi matumizi ya uwakilishi ya ἄνθρωπος bila kufanya kauli hiyo ihusu jinsia ya kiume pekee.
- issue: Maana ya πίστις
  choice: “imani”
  alternative: “uaminifu” au “kumtumaini Mungu”
  rationale: “Imani” ndiyo maana ya msingi katika hoja hii. Hata hivyo, upana wa kimsamiati wa πίστις umetajwa katika tanbihi bila kuufanya uwe tafsiri inayopendelewa hapa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wa heshima na unaoeleweka kwa wasomaji wa kawaida. “Mtu” tayari ni neno la jumla katika Kiswahili, kwa hiyo tanbihi tofauti kuhusu jinsia haikuhitajika.
