base_translation:
  language: en
  yaml_path: translation/nt/james/002/009.yaml
  text: But if you show partiality[d][c][b][a], you commit sin and are convicted by the law as transgressors.
translation:
  language: sw
  text: Lakini ikiwa mnafanya ubaguzi[a], mnatenda dhambi, na sheria inawatia hatiani kuwa wavunjaji wa sheria[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mnawapendelea watu.” Kitenzi cha Kigiriki kinamaanisha kuwahukumu au kuwatendea watu kwa kutazama hadhi au hali yao ya nje.
    reason: lexical_alternative
  - marker: b
    text: Au, “sheria inawafichua” au “sheria inawakemea” kuwa wavunjaji wa sheria. Kitenzi cha Kigiriki kinaweza kumaanisha kufichua kosa na kuthibitisha hatia.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: Lakini ikiwa
  rationale: ‘Ikiwa’ huhifadhi sharti la εἰ, na ‘lakini’ huonyesha tofauti nyepesi au mwendelezo wa hoja unaoletwa na δέ.
- source_word: προσωπολημπτεῖτε
  choice: mnabagua watu
  rationale: Kitenzi hiki humaanisha kuwatendea watu kwa upendeleo kwa kutazama hadhi au hali yao ya nje. ‘Mnabagua watu’ ni Kiswahili cha kawaida na kinafaa katika muktadha wa tofauti kati ya tajiri na maskini.
- source_word: ἁμαρτίαν ἐργάζεσθε
  choice: mnatenda dhambi
  rationale: Muungano huu wa maneno humaanisha kufanya au kutenda dhambi; ‘mnatenda dhambi’ huhifadhi hali ya sasa na ni usemi wa asili katika Kiswahili.
- source_word: ἐλεγχόμενοι ὑπὸ τοῦ νόμου
  choice: sheria inawathibitisha
  rationale: Ingawa Kigiriki kina umbo la kutendwa, Kiswahili cha kutenda huonyesha kwa uwazi kwamba sheria ndiyo inayofichua kosa na kuthibitisha hatia.
- source_word: ὡς παραβάται
  choice: kuwa wakosaji
  rationale: παραβάται ni watu wanaovuka mpaka uliowekwa au wanaokiuka sheria. ‘Wakosaji’ ni la kawaida na lenye hadhi, huku tanbihi ikihifadhi chaguo la wazi zaidi ‘wavunjaji wa sheria.’
theological_decisions:
- issue: Maana ya νόμος katika hoja ya kimaadili ya Yakobo
  choice: sheria
  alternative: Sheria; sheria ya Mungu; Sheria ya Musa
  rationale: Kigiriki kinaitaja sheria kuwa kipimo kinachofichua ubaguzi kama dhambi, bila kubainisha hapa kuwa ni Sheria ya Musa au kuweka mfumo fulani wa agano. Tafsiri inaacha upeo huo wazi.
- issue: Nguvu ya ἐλεγχόμενοι
  choice: inawathibitisha kuwa wakosaji
  alternative: inawakemea; inawafichua; inawahukumu kuwa wakosaji
  rationale: Neno linaweza kujumuisha kufichua kosa, kukemea, na kuthibitisha hatia. Katika muktadha wa sheria na wakosaji, ‘inawathibitisha’ huhifadhi wazo la kosa kuletwa wazi na hatia kuonyeshwa bila kuongeza hukumu ya mwisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Wingi wa nafsi ya pili umehifadhiwa. Muundo wa kutenda ‘sheria inawathibitisha’ umetumiwa kwa ufasaha wa Kiswahili bila kupoteza uhusiano wa kisarufi na maana ya umbo la kutendwa katika Kigiriki.
