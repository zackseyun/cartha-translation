  text: εἴπῃ δέ τις αὐτοῖς ἐξ ὑμῶν· Ὑπάγετε ἐν εἰρήνῃ, θερμαίνεσθε καὶ χορτάζεσθε, μὴ δῶτε δὲ αὐτοῖς τὰ ἐπιτήδεια τοῦ σώματος, ⸀τί ὄφελος;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/016.yaml
  text: and one of you says to them[a], “Go in peace; keep warm and be filled,” but you do not give them the necessities of the body, what benefit is that?
translation:
  language: sw
  text: na mmoja wenu akiwaambia, “Nendeni kwa amani; mwe na joto na mshibe,” lakini msiwape mahitaji ya mwili, kuna faida gani?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἴπῃ δέ τις ... ἐξ ὑμῶν
  choice: na mmoja wenu akiwaambia
  rationale: Muundo huu unatoa mfano wa kudhaniwa. “Mmoja wenu” huwasilisha maana ya sehemu ya kundi kwa Kiswahili cha kawaida, na “na” hudumisha mtiririko bila kuzidisha nguvu ya δέ.
- source_word: Ὑπάγετε ἐν εἰρήνῃ
  choice: Nendeni kwa amani
  rationale: Hii ni kauli ya kawaida ya kuaga au kubariki; tafsiri hii ni ya asili kwa Kiswahili na inadumisha kejeli yake katika muktadha.
- source_word: θερμαίνεσθε
  choice: mpate joto
  rationale: Umbo la Kiyunani linaweza kueleweka kwa maana ya kati au ya kutendwa. “Mpate joto” ni ya asili na haibainishi ikiwa wanajipasha joto au wanapatiwa joto.
- source_word: χορτάζεσθε
  choice: kushiba
  rationale: Kitenzi humaanisha kujazwa au kutoshelezwa, hasa kwa chakula. “Kushiba” ni usemi wa kawaida wa Kiswahili unaofaa kwa hitaji la chakula katika muktadha.
- source_word: μὴ δῶτε δὲ αὐτοῖς
  choice: lakini msiwape
  rationale: “Lakini” huonyesha wazi tofauti kati ya maneno ya heri na kukosa kutoa msaada. Umbo la nafsi ya pili ya wingi linafuata moja kwa moja Kiyunani.
- source_word: τὰ ἐπιτήδεια τοῦ σώματος
  choice: mahitaji ya mwili
  rationale: ἐπιτήδεια ni vitu vya lazima au vinavyohitajika. “Mahitaji ya mwili” ni wazi, fupi, na huhifadhi msisitizo juu ya mahitaji halisi ya kimwili.
- source_word: τί ὄφελος;
  choice: kuna faida gani?
  rationale: Swali hili la Kiswahili ni la kawaida na huhifadhi wazo la ὄφελος, yaani manufaa au faida ya vitendo.
theological_decisions:
- issue: Maana ya kauli θερμαίνεσθε na χορτάζεσθε
  choice: “mpate joto na kushiba,” bila kubainisha mhusika anayewapatia joto au chakula
  alternative: “mjipashe joto na kujishibisha” au “mpashwe joto na kushibishwa”
  rationale: Hoja ya Yakobo ni ubatili wa maneno yasiyoambatana na msaada wa kimwili. Tafsiri hii huhifadhi kutobainika kwa maana ya kati au ya kutendwa badala ya kuamua kwamba wahitaji wajisaidie au wasaidiwe na wengine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. “Mpate joto na kushiba” huepuka usemi mgumu huku ikihifadhi utata halisi wa sauti ya vitenzi vya Kiyunani.
