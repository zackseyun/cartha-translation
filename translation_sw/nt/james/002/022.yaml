base_translation:
  language: en
  yaml_path: translation/nt/james/002/022.yaml
  text: You see that faith was working together with his works[b][a], and by the works faith was brought to completion.
translation:
  language: sw
  text: Unaona kwamba imani ilikuwa ikitenda kazi pamoja na matendo yake, na kwa matendo hayo imani ilikamilishwa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ilifikishwa kwenye ukamilifu” au “ilifanywa kamili”; kitenzi cha Kigiriki kinaweza kumaanisha kufikia lengo au ukomavu uliokusudiwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπεις
  choice: Unaona
  rationale: Kauli ya moja kwa moja kwa nafsi ya pili umoja inadumisha mtindo wa hoja wa Yakobo na ni ya kawaida katika Kiswahili.
- source_word: ἡ πίστις
  choice: imani
  rationale: “Imani” ndiyo maana ya kawaida hapa na inadumisha istilahi ya mjadala wa Yakobo bila kuamua kimbele kama mkazo ni uaminifu au kutumaini.
- source_word: συνήργει
  choice: ilitenda kazi pamoja na
  rationale: Muundo huu unahifadhi wazo la ushirikiano katika kitenzi συνεργέω na hali ya tendo lililokuwa likiendelea au kuambatana na matendo ya Abrahamu.
- source_word: τοῖς ἔργοις αὐτοῦ
  choice: matendo yake
  rationale: “Matendo” ni Kiswahili cha kawaida na chenye hadhi kwa ἔργα katika hoja hii; “yake” inadumisha rejeo kwa Abrahamu.
- source_word: ἐκ τῶν ἔργων
  choice: kwa matendo hayo
  rationale: “Kwa” huonyesha njia au chombo kwa ufasaha, na “hayo” hurejelea wazi matendo yaliyotajwa tayari.
- source_word: ἐτελειώθη
  choice: ilikamilishwa
  rationale: Kitenzi cha kutendwa kinadumishwa, na “ilikamilishwa” huwasilisha kufikia ukamilifu au kusudi lililokusudiwa bila kulazimisha wazo la kutokuwa na dosari kabisa.
theological_decisions:
- issue: Uhusiano wa imani na matendo katika hoja ya Yakobo
  choice: Imani ilitenda kazi pamoja na matendo na ilikamilishwa kwa matendo hayo.
  alternative: Matendo yalionyesha imani tu mbele ya watu; au matendo yalishirikiana na imani kama udhihirisho wake wa lazima.
  rationale: Kigiriki kinataja wazi ushirikiano na kukamilishwa, lakini hakitoi hapa mfumo mzima wa mafundisho kuhusu kuhesabiwa haki. Tafsiri inadumisha mvutano huo bila kuingiza msimamo wa dhehebu.
- issue: Maana ya πίστις katika muktadha unaobishaniwa kiteolojia
  choice: imani
  alternative: uaminifu; tumaini
  rationale: “Imani” inafaa zaidi katika mfululizo wa hoja ya Yakobo na huhifadhi maana pana ya neno bila kuifunga kwa uaminifu au hali ya kutumaini pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Mpangilio umewekwa wa karibu na Kigiriki huku ukibaki wa asili katika Kiswahili. Hakuna tanbihi tofauti kwa “imani” kwa kuwa “uaminifu” au “tumaini” ni uwezekano wa kileksia lakini si lazima katika mstari huu; uamuzi huo umeandikwa katika maamuzi ya kileksia.
