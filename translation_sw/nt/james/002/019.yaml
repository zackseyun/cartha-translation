base_translation:
  language: en
  yaml_path: translation/nt/james/002/019.yaml
  text: You believe that God is one[a]; you do well[b]. Even the demons believe—and shudder.
translation:
  language: sw
  text: Wewe unaamini kwamba Mungu ni mmoja[a]; unafanya vema. Hata pepo wanaamini—na wanatetemeka[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuna Mungu mmoja.” Kigiriki kinaweza kutafsiriwa kwa namna zote mbili; “Mungu ni mmoja” kinafuata kwa karibu zaidi mpangilio wake na huenda kikawa mwangwi wa ungamo la Kiyahudi kwamba Mungu ni mmoja.
    reason: alternative_reading
  - marker: b
    text: Au, “hutetemeka kwa hofu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ
  choice: Wewe
  rationale: Kiwakilishi kilichotajwa wazi katika Kigiriki kinaweka mkazo kwa anayesemeshwa; Kiswahili kinaweza kuuhifadhi kwa kutumia “Wewe” pamoja na kiambishi cha nafsi katika kitenzi.
- source_word: πιστεύεις
  choice: unaamini
  rationale: Kitenzi hiki hapa kinafuatwa na maudhui ya imani yanayoletwa na ὅτι; “unaamini” ni cha kawaida na hakiongezi wazo la kumtumaini binafsi.
- source_word: ὅτι
  choice: kwamba
  rationale: “Kwamba” huanzisha kwa kawaida maudhui ya kile kinachoaminiwa.
- source_word: εἷς ἐστιν ὁ θεός
  choice: Mungu ni mmoja
  rationale: Hufuata muundo wa Kigiriki kwa karibu na huhifadhi mwangwi unaowezekana wa ungamo la Kiyahudi kuhusu Mungu mmoja, bila kupanua maana.
- source_word: καλῶς ποιεῖς
  choice: unafanya vema
  rationale: Ni usemi mfupi, wa heshima na wa sasa unaohifadhi pongezi ya juu juu kabla ya hoja kali inayofuata.
- source_word: καὶ
  choice: Hata
  rationale: 'Hapa καί ina nguvu ya kupandisha hoja: hata pepo wana kiwango hiki cha kuamini.'
- source_word: τὰ δαιμόνια
  choice: pepo
  rationale: “Pepo” ni neno la kawaida la Kiswahili kwa viumbe waovu wa kiroho katika muktadha huu; halihitaji kuongeza kivumishi cha kufafanua.
- source_word: πιστεύουσιν
  choice: wanaamini
  rationale: Kurudia mzizi “amini” huhifadhi urudiaji muhimu wa Kigiriki na nguvu ya hoja ya Yakobo.
- source_word: φρίσσουσιν
  choice: kutetemeka
  rationale: Hueleza mwitikio wa hofu wa mwili kwa lugha ya kawaida; tanbihi inaonyesha pia uwezekano wa “kushtuka kwa hofu.”
theological_decisions:
- issue: Tafsiri ya ungamo εἷς ἐστιν ὁ θεός
  choice: Mungu ni mmoja
  alternative: Kuna Mungu mmoja
  rationale: Chaguo hili linakaribia zaidi mpangilio wa Kigiriki na kuhifadhi mwangwi unaowezekana wa ungamo la Israeli, huku mbadala wa kuwepo kwa Mungu mmoja ukibaki halali na kuonyeshwa katika tanbihi.
- issue: Nguvu ya ulinganisho kati ya imani ya mtu na ya pepo
  choice: Hata pepo wanaamini—na kutetemeka
  alternative: Pepo pia wanaamini na kutetemeka
  rationale: '“Hata” pamoja na dashibodi huonyesha ukali wa hoja bila kuongeza maudhui: kukubali kweli ya fundisho pekee si tofauti ambayo mtu anayesemeshwa anaweza kuitumia kujitenga na pepo.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni mfupi ili kuhifadhi ukali wa balagha ya mstari; urudiaji wa “amini” umehifadhiwa kimakusudi.
