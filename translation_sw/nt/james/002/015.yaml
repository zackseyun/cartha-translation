  text: ⸀ἐὰν ἀδελφὸς ἢ ἀδελφὴ γυμνοὶ ὑπάρχωσιν καὶ ⸀λειπόμενοι τῆς ἐφημέρου τροφῆς,
base_translation:
  language: en
  yaml_path: translation/nt/james/002/015.yaml
  text: If a brother or sister is poorly clothed and lacking daily food,[a]
translation:
  language: sw
  text: Ikiwa ndugu wa kiume au wa kike hana mavazi ya kutosha[a] na anakosa chakula cha kila siku,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “yuko uchi”; neno la Kigiriki linaweza kumaanisha kutokuwa na nguo kabisa, lakini hapa huenda linamaanisha kutokuwa na mavazi ya kutosha.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν
  choice: Ikiwa
  rationale: Huanzisha sharti la kudhaniwa; “ikiwa” ni ya kawaida na huhifadhi maana ya uwezekano.
- source_word: ἀδελφὸς ἢ ἀδελφή
  choice: ndugu wa kiume au wa kike
  rationale: Huhifadhi kwa uwazi jozi ya jinsia iliyotajwa katika Kigiriki na lugha ya kifamilia ya jumuiya ya waamini.
- source_word: γυμνοὶ
  choice: hana mavazi ya kutosha
  rationale: Katika muktadha wa uhitaji wa chakula, neno hili linaelekea kumaanisha kutokuwa na mavazi ya kutosha, ingawa linaweza pia kumaanisha kuwa uchi kabisa.
- source_word: ὑπάρχωσιν
  choice: hana
  rationale: Kitenzi kinafanya kazi pamoja na sifa inayofuata; muundo huu ni wa asili katika Kiswahili na unatumia umoja kwa wahusika waliotenganishwa kwa “au”.
- source_word: λειπόμενοι
  choice: anakosa
  rationale: Huonyesha hali inayoendelea ya kutokuwa na kile kinachohitajika; “anakosa” ni wazi na ya kawaida.
- source_word: τῆς ἐφημέρου τροφῆς
  choice: chakula cha kila siku
  rationale: Huwasilisha chakula au lishe inayohitajika siku kwa siku kwa lugha ya asili.
theological_decisions:
- issue: Upeo wa ἀδελφὸς ἢ ἀδελφή katika jumuiya ya Kikristo
  choice: Kuhifadhi “ndugu wa kiume au wa kike” kama lugha ya kifamilia, ambayo katika muktadha inaelekea kumrejelea mwamini mwenzao.
  alternative: Mwanadamu yeyote mwenye uhitaji kwa ujumla.
  rationale: Yakobo anatumia lugha ya kindugu kwa washiriki wa jumuiya ya waamini; tafsiri huhifadhi maneno hayo bila kupanua au kubana maana kupita ushahidi wa kifungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inaachwa wazi kwa koma kwa sababu mstari huu ni kishazi cha sharti kinachoendelea katika mstari unaofuata.
