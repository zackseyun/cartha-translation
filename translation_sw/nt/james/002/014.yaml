base_translation:
  language: en
  yaml_path: translation/nt/james/002/014.yaml
  text: What good is it[a], my brothers[c][b], if someone says he has faith but does not have works? Can that faith save him?
translation:
  language: sw
  text: Ndugu zangu,[a] kuna faida gani ikiwa mtu anasema ana imani[b] lakini hana matendo? Je, imani hiyo inaweza kumwokoa?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki hutumia ἀδελφοί, wingi wa kiume ambao unaweza kutumiwa kwa jumuiya nzima ya waamini; hapa “ndugu zangu” huwahusisha wanaume na wanawake.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kigiriki πίστις linaweza pia kumaanisha “uaminifu” katika miktadha fulani; hapa “imani” inafaa kwa sababu mtu anasema anayo.
    reason: lexical_alternative
  - marker: c
    text: Au, “Je, imani ya namna hiyo inaweza kumwokoa?” Kigiriki kina kibainishi kinachorejelea imani iliyotajwa—yaani, imani inayosemwa kuwa ipo lakini isiyo na matendo.
    reason: alternative_reading
lexical_decisions:
- source_word: Τί ὄφελος
  choice: kuna faida gani
  rationale: Ni swali la balagha linalotolewa kwa Kiswahili cha kawaida na kuhifadhi maana ya manufaa au faida halisi.
- source_word: ἀδελφοί μου
  choice: ndugu zangu
  rationale: Neno la Kiswahili “ndugu” ni la kawaida katika hotuba kwa jumuiya ya waamini na linaweza kuwajumuisha wanaume na wanawake bila kupoteza ukaribu wa “zangu”.
- source_word: πίστιν
  choice: imani
  rationale: “Imani” ndilo neno la kawaida na linalofaa hapa kwa kile ambacho mtu anasema anacho; “uaminifu” haifai sana katika muundo huu.
- source_word: λέγῃ τις ἔχειν
  choice: mtu akisema kwamba ana
  rationale: Hufuata kwa karibu dai lililotamkwa katika Kigiriki bila kuongeza maana kali zaidi ya “akidai kuwa ana.”
- source_word: ἔργα
  choice: matendo
  rationale: “Matendo” huhifadhi uhusiano wa istilahi katika hoja yote ya Yakobo 2 na tofauti yake na imani.
- source_word: μὴ ἔχῃ
  choice: hana
  rationale: Ni namna fupi, wazi, na ya kawaida ya kuonyesha kutokuwa na kitu.
- source_word: μὴ δύναται
  choice: Je, ... inaweza ...?
  rationale: Muundo wa swali huhifadhi swali la balagha ambalo katika Kigiriki linatarajia jibu hasi bila kulitamka moja kwa moja.
- source_word: ἡ πίστις
  choice: imani hiyo
  rationale: Kiwakilishi “hiyo” kinaonyesha kwamba swali linarejelea imani iliyotajwa—imani ambayo mtu anasema anayo lakini haina matendo—badala ya kutoa kauli pana kuhusu kila aina ya imani.
- source_word: σῶσαι αὐτόν
  choice: kumwokoa
  rationale: “Kuokoa” huhifadhi uzito wa kawaida wa σῴζω katika muktadha huu na ni Kiswahili cha kawaida.
theological_decisions:
- issue: Uhusiano wa imani na matendo katika swali la balagha
  choice: “imani hiyo” inarejelea imani inayodaiwa lakini isiyo na matendo
  alternative: “imani” kwa ujumla; au “imani ya namna hiyo”
  rationale: Kibainishi katika ἡ πίστις kinaelekeza nyuma kwenye imani iliyotajwa. Tafsiri hii huhifadhi mvutano wa kiteolojia bila kudai kwamba Yakobo anakanusha uwezo wa imani kwa ujumla kuokoa, wala bila kutatua hoja yake mapema.
- issue: Uwakilishi wa kijinsia katika ἀδελφοί μου na αὐτόν
  choice: Kutumia “ndugu zangu” na “kumwokoa”
  alternative: “ndugu zangu wa kiume”; au kutaja wazi “ndugu zangu wanaume na wanawake”
  rationale: “Ndugu” katika Kiswahili inaweza kutumiwa kwa jumuiya nzima na kwa hiyo huwasilisha matumizi wakilishi ya wingi wa kiume wa Kigiriki. “Kumwokoa” hudumisha mtu mmoja wa mfano bila kulazimisha jinsia katika Kiswahili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni ya kawaida kwa usomaji wa hadharani; “matendo,” “imani,” na “kuokoa” huhifadhi msamiati muhimu wa hoja bila kuingiza msimamo wa dhehebu.
