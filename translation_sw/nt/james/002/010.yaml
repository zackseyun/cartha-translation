base_translation:
  language: en
  yaml_path: translation/nt/james/002/010.yaml
  text: For whoever keeps the whole law but stumbles in one point has become guilty of all of it[a][b].
translation:
  language: sw
  text: Kwa maana mtu yeyote anayeishika sheria yote lakini akajikwaa katika jambo moja, amekuwa mwenye hatia kuhusiana na sheria yote.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akakosea katika jambo moja” au “akavunja sehemu moja ya sheria.” Kigiriki kinasema “akajikwaa katika jambo moja,” kikitumia sitiari ya kukosea kimaadili.
    reason: lexical_alternative
  - marker: b
    text: Au, “amewajibika kwa sheria yote.” Maana ni kwamba kuvunja sehemu moja humfanya mtu awajibike kuhusiana na sheria yote.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅστις
  choice: mtu yeyote anaye-
  rationale: Kiwakilishi hiki cha uhusiano kisicho maalumu kinaweka kanuni ya jumla; muundo huu ni wa kawaida katika Kiswahili na unadumisha maana ya ‘yeyote.’
- source_word: γὰρ
  choice: Kwa maana
  rationale: Kiunganishi hiki kinatoa sababu au maelezo ya kauli iliyotangulia; ‘Kwa maana’ kinaonyesha uhusiano huo kwa uwazi.
- source_word: ὅλον τὸν νόμον
  choice: sheria yote
  rationale: Muundo huu unadumisha msisitizo wa ὅλον kwamba sheria inatazamwa kwa ukamilifu wake.
- source_word: τηρήσῃ
  choice: anayeishika
  rationale: Katika muktadha wa sheria na amri, τηρέω humaanisha kushika au kutii; ‘kuishika sheria’ ni usemi wa asili na wenye hadhi katika Kiswahili.
- source_word: πταίσῃ
  choice: akajikwaa
  rationale: Neno hili lina maana halisi ya kujikwaa na maana ya kimfano ya kukosea kimaadili. ‘Akajikwaa’ inadumisha sitiari ya Yakobo.
- source_word: ἐν ἑνί
  choice: katika jambo moja
  rationale: Kirai hiki huonyesha eneo au jambo moja ambamo kosa limetokea; tafsiri hii haifungii maana kwenye amri fulani pekee.
- source_word: γέγονεν
  choice: amekuwa
  rationale: Wakati timilifu unaonyesha hali iliyotokana na tendo la kujikwaa; ‘amekuwa’ inadumisha wazo la hali hiyo ya matokeo.
- source_word: πάντων
  choice: kuhusu sheria yote
  rationale: Ingawa kihalisi ni ‘yote,’ rejeo lake ni sheria iliyotajwa. Kurudia ‘sheria’ hufanya Kiswahili kiwe wazi bila kudai kwamba mtu huyo ametenda kila kosa moja moja.
- source_word: ἔνοχος
  choice: na hatia
  rationale: ἔνοχος huonyesha kuwa mwenye hatia au anayewajibika kisheria. ‘Ana hatia kuhusu’ ni wazi na inadumisha uzito wa kimaadili na kisheria.
theological_decisions:
- issue: Upeo wa hatia kuhusiana na sheria
  choice: Kuvunja sehemu moja humfanya mtu awe na hatia kuhusu sheria yote.
  alternative: Kuvunja amri moja ni sawa kwa uzito na kuvunja kila amri moja moja.
  rationale: πάντων ἔνοχος huonyesha kuwajibika kuhusiana na sheria yote, lakini haisemi kwamba mtu ametenda kila kosa moja moja au kwamba makosa yote yana uzito uleule. Tafsiri inaacha mvutano huo bila kuingiza mfumo wa baadaye wa kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Akajikwaa’ huhifadhi sitiari ya Kigiriki, huku tanbihi ikifafanua maana yake ya kimaadili. Viashiria vyote vya tanbihi vimewekwa katika matini kuu.
