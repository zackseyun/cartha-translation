  text: ἀκούσατε, ἀδελφοί μου ἀγαπητοί. οὐχ ὁ θεὸς ἐξελέξατο τοὺς πτωχοὺς ⸂τῷ κόσμῳ⸃ πλουσίους ἐν πίστει καὶ κληρονόμους τῆς βασιλείας ἧς ἐπηγγείλατο τοῖς ἀγαπῶσιν αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/005.yaml
  text: 'Listen[c][b][a], my beloved brothers: has not God chosen those who are poor in the world to be rich in faith and heirs of the kingdom that he promised to those who love him?'
translation:
  language: sw
  text: 'Sikilizeni, ndugu[a] zangu wapendwa: Je, si Mungu aliyewachagua wale walio maskini kwa viwango vya ulimwengu[b] wawe matajiri katika imani[c] na warithi wa ufalme ambao aliwaahidi wale wanaompenda?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki lililotafsiriwa “ndugu” lina umbo la kiume katika wingi, lakini hapa huenda linawahusu waamini wote, wanaume na wanawake.
    reason: alternative_reading
  - marker: b
    text: Au “walio maskini kwa mtazamo wa ulimwengu” au “walio maskini machoni pa ulimwengu.”
    reason: lexical_alternative
  - marker: c
    text: “Imani” pia inaweza kuelezwa kama “kumwamini Mungu”; kwa uwezekano mdogo hapa, yaweza kumaanisha “uaminifu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσατε
  choice: Sikilizeni
  rationale: Ni amri ya wakati uliopita (aorist) katika wingi inayodai usikivu; “Sikilizeni” ni ya kawaida na yenye nguvu ya moja kwa moja katika Kiswahili.
- source_word: ἀδελφοί μου ἀγαπητοί
  choice: ndugu zangu wapendwa
  rationale: “Ndugu” ni neno la asili na lenye heshima katika Kiswahili, na linaweza kulihusu kusanyiko lote bila kulazimisha jinsia isiyoelezwa wazi katika matumizi ya muktadha.
- source_word: οὐχ ... ἐξελέξατο
  choice: Je, si Mungu aliyewachagua
  rationale: Muundo wa swali la balagha unatarajia jibu la ndiyo. “Aliwachagua” huhifadhi lugha ya uchaguzi wa Mungu bila kuongeza mfumo mpana wa mafundisho.
- source_word: τοὺς πτωχοὺς τῷ κόσμῳ
  choice: walio maskini kwa mtazamo wa ulimwengu
  rationale: 'Dativi τῷ κόσμῳ inaeleweka vyema kama kipimo au mtazamo: maskini kwa viwango au machoni pa ulimwengu. Tafsiri hii huepuka maana isiyo wazi ya “maskini katika ulimwengu.”'
- source_word: πλουσίους ἐν πίστει
  choice: matajiri katika imani
  rationale: Huhifadhi ulinganifu wa moja kwa moja kati ya umaskini wa kidunia na utajiri wa kiroho; “imani” ndiyo maana inayofaa zaidi ya πίστις hapa.
- source_word: κληρονόμους τῆς βασιλείας
  choice: warithi wa ufalme
  rationale: “Warithi” huhifadhi taswira ya kisheria na kifamilia ya κληρονόμοι kwa lugha ya kawaida ya kibiblia ya Kiswahili.
- source_word: ἧς ἐπηγγείλατο τοῖς ἀγαπῶσιν αὐτόν
  choice: aliowaahidi wale wanaompenda
  rationale: Muundo huu ni wa kawaida katika Kiswahili na hudumisha kwamba ufalme ndio ulioahidiwa kwa wale wanaompenda Mungu.
theological_decisions:
- issue: Maana ya uchaguzi wa Mungu katika ἐξελέξατο
  choice: Kutafsiri kwa urahisi “aliwachagua”
  alternative: Kutumia maneno yanayoelekeza wazi kwenye fundisho maalumu la kuamuliwa tangu awali
  rationale: Hoja ya Yakobo hapa ni jinsi Mungu anavyowathamini maskini kinyume na ubaguzi wa kibinadamu; tafsiri haipaswi kuingiza mfumo wa baadaye wa kiteolojia.
- issue: Upeo wa ἀδελφοί
  choice: Kutumia “ndugu,” neno linaloweza kulihusu kusanyiko lote katika Kiswahili
  alternative: Kutaja wazi “ndugu wa kiume na wa kike”
  rationale: Ingawa umbo la Kigiriki ni la kiume katika wingi, katika salamu na mawaidha linaweza kuwa jumuishi. “Ndugu” huhifadhi unatural wa Kiswahili na uwezekano huo, huku tanbihi ikiufafanua.
- issue: Maana ya πίστις
  choice: imani
  alternative: tumaini au uaminifu
  rationale: Katika kirai “matajiri katika imani,” maana ya kumwamini Mungu ndiyo inayowezekana zaidi; hata hivyo, upeo wa kileksia umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Swali la balagha na ulinganifu wa umaskini na utajiri vimehifadhiwa.
