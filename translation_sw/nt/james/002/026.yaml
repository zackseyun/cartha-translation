  text: ὥσπερ ⸀γὰρ τὸ σῶμα χωρὶς πνεύματος νεκρόν ἐστιν, οὕτως καὶ ἡ πίστις ⸀χωρὶς ἔργων νεκρά ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/026.yaml
  text: For just as the body without the spirit is dead[b][a], so also faith without works is dead.
translation:
  language: sw
  text: Kwa maana, kama vile mwili usio na roho[a] umekufa, vivyo hivyo na imani[b] isiyo na matendo imekufa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “pumzi.” Neno la Kigiriki linaweza kumaanisha “roho” au “pumzi.”
    reason: lexical_alternative
  - marker: b
    text: Au, “uaminifu.” Neno la Kigiriki pia linaweza kumaanisha kuamini au kuwa mwaminifu; hapa maandishi makuu yametumia tafsiri ya kawaida “imani.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: Kwa maana kama vile
  rationale: “Kwa maana” huhifadhi kiunganishi cha maelezo γὰρ, na “kama vile” huanzisha ulinganisho wa ὥσπερ kwa Kiswahili cha kawaida.
- source_word: τὸ σῶμα
  choice: mwili
  rationale: Ni tafsiri ya moja kwa moja ya mwili wa kimwili katika mfano huu.
- source_word: χωρὶς πνεύματος
  choice: bila roho
  rationale: χωρίς ni “bila,” na πνεῦμα hapa inaweza kumaanisha roho inayoupa mwili uhai; uwezekano wa “pumzi” umehifadhiwa katika tanbihi.
- source_word: νεκρόν ἐστιν
  choice: ni mfu
  rationale: Huhifadhi maana ya hali ya kuwa mfu na nguvu ya kivumishi cha Kigiriki bila kuifanya kuwa maelezo marefu.
- source_word: οὕτως καὶ
  choice: vivyo hivyo
  rationale: Huonyesha wazi sehemu ya pili inayolingana na sehemu ya kwanza ya ulinganisho.
- source_word: ἡ πίστις
  choice: imani
  rationale: “Imani” ndiyo tafsiri ya msingi katika muktadha huu; maana inayowezekana ya “uaminifu” haijaondolewa bali imewekwa katika tanbihi.
- source_word: χωρὶς ἔργων
  choice: bila matendo
  rationale: “Matendo” ni neno la kawaida na linaloeleweka kwa ἔργα katika hoja ya Yakobo, huku likihifadhi wazo la mambo yanayotendwa.
- source_word: νεκρά ἐστιν
  choice: ni mfu
  rationale: Kurudia maneno yale yale kunahifadhi usambamba na msisitizo wa sentensi ya Kigiriki.
theological_decisions:
- issue: Maana ya πνεύματος katika mfano
  choice: roho
  alternative: pumzi
  rationale: “Roho” huhifadhi upana wa neno la Kigiriki na picha ya kile kinachoupa mwili uhai. “Pumzi” pia inawezekana, kwa hiyo imeonyeshwa katika tanbihi bila kulazimisha uamuzi mmoja.
- issue: Maana ya πίστις katika Yakobo 2:26
  choice: imani
  alternative: uaminifu
  rationale: “Imani” huhifadhi tafsiri ya kawaida na hoja ya kifungu hiki, huku “uaminifu” ukiwa maana nyingine inayowezekana ya neno hilo na kuhifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Muundo wa ulinganisho na urudiaji wa “ni mfu” huhifadhi nguvu na usambamba wa Kigiriki.
