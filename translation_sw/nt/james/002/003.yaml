  text: ⸂ἐπιβλέψητε δὲ⸃ ἐπὶ τὸν φοροῦντα τὴν ἐσθῆτα τὴν λαμπρὰν καὶ ⸀εἴπητε· Σὺ κάθου ὧδε καλῶς, καὶ τῷ πτωχῷ εἴπητε· Σὺ στῆθι ⸂ἢ κάθου ἐκεῖ⸃ ὑπὸ τὸ ὑποπόδιόν μου,
base_translation:
  language: en
  yaml_path: translation/nt/james/002/003.yaml
  text: and if you pay attention to the one wearing the bright clothing and say[a], “You sit here in a good place,” and say to the poor man, “You stand there[b], or sit under my footstool,”
translation:
  language: sw
  text: na mkimwangalia kwa makini yule aliyevaa mavazi yanayong'aa[a] na kumwambia, “Wewe keti hapa mahali pazuri,” na kumwambia yule mwanamume maskini, “Wewe simama, au keti pale[b] chini ya kiti changu cha kuwekea miguu,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mavazi ya kifahari” au “mavazi maridadi.”
    reason: lexical_alternative
  - marker: b
    text: Baadhi ya hati za kale hazina maneno “au keti pale.”
    reason: textual_variant
lexical_decisions:
- source_word: ἐπιβλέψητε
  choice: mkamwangalia kwa makini
  rationale: Kitenzi hiki hapa kina maana ya kumpa mtu uangalifu wa pekee au wa upendeleo, si kumwona tu. Tafsiri hii ni ya kawaida katika Kiswahili na haijaingiza moja kwa moja neno ‘upendeleo,’ kwa kuwa mstari unasimulia matendo yanayouonyesha.
- source_word: φοροῦντα
  choice: aliyevaa
  rationale: Hii ndiyo tafsiri ya moja kwa moja na ya kawaida kwa mtu mwenye vazi mwilini.
- source_word: ἐσθῆτα τὴν λαμπράν
  choice: mavazi yanayong'aa
  rationale: ἐσθής ni vazi au mavazi, na λαμπρός inaweza kumaanisha yenye kung'aa, ya fahari, au maridadi. ‘Yanayong'aa’ huhifadhi picha ya kitu kinachoonekana wazi bila kufuta maana ya hadhi ya mavazi katika muktadha.
- source_word: Σὺ κάθου ὧδε καλῶς
  choice: Wewe keti hapa mahali pazuri
  rationale: Amri κάθου imetafsiriwa wazi kwa ‘keti,’ huku καλῶς ikionyesha kwamba mtu huyo anapewa nafasi nzuri au ya heshima.
- source_word: τῷ πτωχῷ
  choice: yule mwanamume maskini
  rationale: Muundo wa Kigiriki ni wa umoja wa kiume na unamrejelea mgeni fulani katika tukio hili; ‘mwanamume maskini’ huhifadhi jinsia na umoja huo.
- source_word: στῆθι
  choice: simama
  rationale: Hii ni amri rahisi ya kusimama; mahali au namna ya kusimama hujitokeza kutokana na maneno yanayoifuata.
- source_word: ἢ κάθου ἐκεῖ
  choice: au keti pale
  rationale: Tafsiri hii huhifadhi amri mbadala na umbali unaodokezwa na ἐκεῖ, ‘pale.’
- source_word: ὑπὸ τὸ ὑποπόδιόν μου
  choice: chini ya kiti changu cha kuwekea miguu
  rationale: ὑπό pamoja na hali ya accusative hapa kwa kawaida humaanisha ‘chini ya.’ Ingawa picha hiyo ni ya kudhalilisha na huenda ikasikika isiyo ya kawaida, tafsiri imeihifadhi badala ya kuipunguza kuwa ‘karibu na.’
theological_decisions:
- issue: Lugha ya upendeleo wa kijamii
  choice: Kuhifadhi tofauti halisi ya heshima katika jinsi tajiri na maskini wanavyosemeshwa, bila kutumia neno la kitheolojia ‘upendeleo’ ndani ya mstari huu.
  alternative: Kutafsiri ἐπιβλέψητε kwa maneno ya kufasiri zaidi, kama ‘mkampendelea.’
  rationale: Katika muktadha Yakobo anashutumu upendeleo, lakini mstari huu wenyewe unaonyesha upendeleo huo kupitia uangalifu, mahali pa kuketi, na amri zinazotolewa. Tafsiri inaacha hoja ya kitheolojia ijitokeze kutokana na vitendo hivyo.
- issue: Jinsia ya πτωχῷ
  choice: yule mwanamume maskini
  alternative: yule mtu maskini; yule maskini
  rationale: Neno la Kigiriki ni la umoja wa kiume na linamrejelea mgeni mahususi; tafsiri imehifadhi jinsia hiyo bila kuifanya kauli kuwa ya jumla.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Kiti cha kuwekea miguu’ kimetumiwa badala ya neno lisiloeleweka kwa urahisi kama ‘kibago,’ na ‘chini ya’ imehifadhiwa ili kuonyesha udhalilishaji ulio katika picha ya Kigiriki.
