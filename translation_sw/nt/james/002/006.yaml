source:
  edition: SBLGNT
  text: ὑμεῖς δὲ ἠτιμάσατε τὸν πτωχόν. οὐχ οἱ πλούσιοι καταδυναστεύουσιν ὑμῶν, καὶ αὐτοὶ ἕλκουσιν ὑμᾶς εἰς κριτήρια;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/006.yaml
  text: But you have dishonored the poor man[b][a]. Is it not the rich who oppress you and themselves drag you into courts?
translation:
  language: sw
  text: Lakini ninyi mmemdharau yule maskini.[a] Je, si matajiri ndio wanaowakandamiza, na wao wenyewe ndio wanaowaburuta mbele ya mahakama?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mtu maskini,” au kwa maana pana zaidi, “maskini.” Kigiriki kina umoja na huenda kinarejelea mfano wa mtu maskini katika mistari iliyotangulia, huku pia kikimwakilisha maskini kwa ujumla.
    reason: lexical_alternative
  - marker: b
    text: Au “kwenye mabaraza ya hukumu.” Kigiriki kinarejelea mahakama za kutoa hukumu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠτιμάσατε
  choice: mmemdharau
  rationale: Kitenzi hiki huonyesha kumnyima mtu heshima au kumtendea kwa dharau. “Mmemdharau” ni cha kawaida katika Kiswahili na kinahifadhi wazo la kuvunjiwa heshima.
- source_word: τὸν πτωχόν
  choice: yule maskini
  rationale: Umoja wenye kibainishi unarejelea kwa kawaida mtu maskini aliyeelezwa katika mfano wa mistari iliyotangulia, huku akiwa pia mwakilishi wa maskini kwa upana.
- source_word: οἱ πλούσιοι
  choice: matajiri
  rationale: Kivumishi kilichotumiwa kama nomino kinamaanisha kundi la watu matajiri; “matajiri” ni kifupi na cha kawaida.
- source_word: καταδυναστεύουσιν
  choice: wanaowakandamiza
  rationale: Neno linaashiria kutumia mamlaka kwa ukali dhidi ya wengine. “Kukandamiza” linahifadhi maana ya unyanyasaji wa mwenye nguvu.
- source_word: ἕλκουσιν
  choice: kuwaburuta
  rationale: Kitenzi kina picha ya kuvuta kwa nguvu; “kuwaburuta” kinadumisha ukali na shuruti katika muktadha wa kisheria.
- source_word: κριτήρια
  choice: mahakamani
  rationale: Katika muktadha huu neno linarejelea mahakama au mabaraza ya hukumu. “Mahakamani” ni usemi wa sasa unaoeleweka wazi.
- source_word: καὶ αὐτοὶ
  choice: na kuwaburuta ninyi wenyewe
  rationale: Muundo wa Kiswahili unaweka “ninyi wenyewe” kama shamirisho cha kuburutwa, lakini unaweza kueleweka kimakosa kuwa unasisitiza wanaoburutwa badala ya wahusika; msisitizo wa Kigiriki kwa kweli uko kwa matajiri wenyewe. Maana hiyo inalindwa zaidi na muktadha na swali la balagha.
- source_word: οὐχ ... ;
  choice: Je, si ... ndio ...?
  rationale: Muundo huu wa swali la balagha unatarajia jibu la kukubali na ni wa asili katika Kiswahili.
theological_decisions:
- issue: Rejeleo la umoja “yule maskini”
  choice: Mtu maskini anayewakilisha mfano uliotangulia, pamoja na matumizi mapana kwa maskini
  alternative: Umoja wa kijumla unaomaanisha maskini wote kama kundi
  rationale: Yakobo ametoka kueleza mtu mahususi maskini aliyeingia kusanyikoni (2:2–3). Kudumisha umoja kunalinda mtiririko huo bila kuondoa maana yake ya uwakilishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Yule maskini” huunganisha mstari na mfano uliotangulia; “kuwaburuta” huhifadhi picha ya shuruti. Alama zote za tanbihi zimewekwa katika matini.
