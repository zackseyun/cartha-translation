  text: Semeni hivyo, na tendeni hivyo, kama wale watakaohukumiwa kwa njia ya sheria ya uhuru.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως λαλεῖτε καὶ οὕτως ποιεῖτε
  choice: Semeni na kutenda hivyo
  rationale: Muundo huu unadumisha maagizo mawili sambamba—kusema na kutenda—kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: ὡς ... μέλλοντες κρίνεσθαι
  choice: kama watu watakaohukumiwa
  rationale: Huwasilisha hali inayotarajiwa ya hukumu bila kuongeza mhusika wa hukumu ambaye hajatajwa wazi katika mstari.
- source_word: διὰ νόμου ἐλευθερίας
  choice: kupitia sheria ya uhuru
  rationale: Neno ‘kupitia’ linatunza thamani ya msingi ya διά pamoja na hali ya umilikaji katika ‘sheria ya uhuru,’ bila kuibadili kuwa ‘sheria inayoweka huru.’
theological_decisions:
- issue: Jukumu la sheria ya uhuru katika hukumu
  choice: kupitia sheria ya uhuru
  alternative: kwa sheria ya uhuru
  rationale: Tafsiri iliyochaguliwa inahifadhi uwezekano wa διά kueleza njia au chombo ambacho hukumu inahusiana nacho, bila kufafanua zaidi ya maandishi jinsi sheria hiyo inavyotekeleza jukumu hilo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye hadhi na inayoeleweka kwa wasomaji wa kawaida. Urudiaji wa οὕτως umewakilishwa kwa ‘hivyo’ moja inayohusu kusema na kutenda kwa pamoja, ili sentensi isikike kwa kawaida bila kupoteza msisitizo wa jozi hiyo.
