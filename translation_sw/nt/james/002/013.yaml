  yaml_path: translation/nt/james/002/013.yaml
  text: For judgment is without mercy to the one who has shown no mercy[a]; mercy triumphs over judgment.
translation:
  language: sw
  text: Kwa maana hukumu haina huruma kwa mtu ambaye hakuonyesha huruma; huruma huishinda hukumu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Huruma hujisifu dhidi ya hukumu.” Kitenzi cha Kigiriki kinaweza kuwa na maana ya kujisifu au kufurahia ushindi dhidi ya kitu; hapa kimetafsiriwa kwa maana ya “huishinda.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίσις / κρίσεως
  choice: hukumu
  rationale: Neno hili linamaanisha tathmini ya kimahakama au ya Mungu. “Hukumu” huhifadhi uzito huo bila kulifanya kimahususi kuwa “adhabu.” Kutumia neno lilelile mara zote mbili kunadumisha ulinganifu wa ndani wa mstari.
- source_word: ἀνέλεος
  choice: haitakuwa na huruma
  rationale: Kivumishi hiki kinaeleza tabia ya hukumu. Muundo huu ni wa kawaida katika Kiswahili na unadumisha uhusiano wa wazi na ἔλεος, “huruma.” Wakati ujao unafaa kwa onyo la hukumu lililo katika muktadha, bila kubadili msingi wa kauli.
- source_word: τῷ μὴ ποιήσαντι ἔλεος
  choice: kwa mtu ambaye hakuonyesha huruma
  rationale: Usemi wa Kigiriki wa ‘kufanya huruma’ una maana ya kumwonyesha mtu huruma. Tafsiri hii ni ya asili katika Kiswahili na inadumisha uwajibikaji wa mtu anayehukumiwa.
- source_word: κατακαυχᾶται
  choice: huushinda
  rationale: Kitenzi hiki kinaweza kumaanisha kujisifu au kufurahia ushindi dhidi ya kitu. “Huushinda” huwasilisha kwa Kiswahili cha kawaida nguvu ya tamathali kwamba huruma inapata ushindi, huku maana halisi zaidi ikiwekwa katika tanbihi.
- source_word: ἔλεος
  choice: huruma
  rationale: Hili ndilo neno la kawaida, wazi na lenye hadhi kwa mercy. Kurudiwa kwake kunadumisha kiungo cha kimsamiati kati ya sehemu mbili za mstari.
theological_decisions:
- issue: Maana ya kishazi cha mwisho κατακαυχᾶται ἔλεος κρίσεως
  choice: 'Kanuni ya jumla: “huruma huushinda hukumu.”'
  alternative: “Huruma hujisifu dhidi ya hukumu.”
  rationale: Kishazi ni kifupi na cha kimethali. Tafsiri hii inadumisha mvutano kati ya onyo la hukumu na tumaini la huruma bila kuamua kama lengo hasa ni huruma ya Mungu, nafasi ya huruma katika hukumu, au kuthibitishwa kwa mtu aliyeonyesha huruma.
- issue: Wakati wa hukumu katika kishazi cha kwanza
  choice: “hukumu haitakuwa na huruma”
  alternative: “hukumu haina huruma”
  rationale: Muktadha wa karibu unatazamia kuhukumiwa, hivyo wakati ujao ni wa asili katika Kiswahili. Hata hivyo, kauli bado inawasilisha kanuni ya jumla na haisemi zaidi kuhusu namna au wakati wa hukumu hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, wazi na yenye hadhi. Muundo unadumisha urudiaji wa “hukumu” na “huruma,” ambao ndio msingi wa ulinganifu na utofautishaji wa mstari.
