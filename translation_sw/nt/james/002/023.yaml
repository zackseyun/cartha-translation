  text: καὶ ἐπληρώθη ἡ γραφὴ ἡ λέγουσα· Ἐπίστευσεν δὲ Ἀβραὰμ τῷ θεῷ, καὶ ἐλογίσθη αὐτῷ εἰς δικαιοσύνην, καὶ φίλος θεοῦ ἐκλήθη.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/023.yaml
  text: And the Scripture was fulfilled that says[a], “Abraham believed God, and it was counted to him as righteousness,” and he was called a friend of God.
translation:
  language: sw
  text: Na Andiko likatimizwa lisemalo, “Abrahamu alimwamini Mungu, na hilo likahesabiwa kwake kuwa haki[a],” naye akaitwa rafiki wa Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “likahesabiwa kwake kuwa uadilifu”; kitenzi cha Kigiriki kinaweza pia kumaanisha jambo kuhesabiwa au kukabidhiwa katika hesabu ya mtu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπληρώθη
  choice: likatimizwa
  rationale: Kauli ya kutendwa ya πληρόω katika muktadha wa Andiko ina maana ya kufikia utimilifu; “likatimizwa” ni ya kawaida, wazi, na ya karibu na chanzo.
- source_word: ἡ γραφή ἡ λέγουσα
  choice: Andiko ... lisemalo
  rationale: Umoja wa Kigiriki umehifadhiwa kwa “Andiko,” likimaanisha kifungu cha Maandiko Matakatifu; “lisemalo” linaendeleza muundo wa sentensi kwa Kiswahili cha heshima.
- source_word: Ἐπίστευσεν ... Ἀβραὰμ τῷ θεῷ
  choice: Abrahamu alimwamini Mungu
  rationale: Muundo huu unaonyesha kwamba Abrahamu alikubali kuwa ya kweli yale Mungu aliyosema, bila kuongeza kwa wazi maana pana zaidi ya “kumtumainia.”
- source_word: ἐλογίσθη αὐτῷ
  choice: hilo likahesabiwa kwake
  rationale: “Hilo” linarejelea tendo lililotangulia la Abrahamu kumwamini Mungu bila kutaja moja kwa moja jambo ambalo Kigiriki hakilitaji kama kiima; “likahesabiwa kwake” huhifadhi taswira ya kuhesabu au kuweka katika hesabu.
- source_word: εἰς δικαιοσύνην
  choice: kuwa haki
  rationale: “Haki” ndiyo istilahi ya kawaida na inayofaa katika dondoo hili la Mwanzo; “kuwa” huonyesha jambo hilo kuhesabiwa kama haki.
- source_word: φίλος θεοῦ
  choice: rafiki wa Mungu
  rationale: Tafsiri hii ni ya moja kwa moja, ya asili katika Kiswahili, na huhifadhi uhusiano unaoelezwa bila kuufafanua kupita kiasi.
- source_word: ἐκλήθη
  choice: akaitwa
  rationale: “Akaitwa” huhifadhi upana wa καλέω, iwe ni kupewa jina hilo au kutambuliwa kwa sifa hiyo.
theological_decisions:
- issue: Uhusiano wa imani ya Abrahamu na matendo yake katika hoja ya Yakobo
  choice: Kudumisha dai kwamba Andiko lilitimizwa bila kueleza zaidi jinsi imani na tendo la utii vinavyohusiana kimafundisho.
  alternative: Kutenganisha kabisa kuhesabiwa haki na matendo, au kufanya matendo yachukue nafasi ya imani.
  rationale: Aya inaunganisha Mwanzo 15:6 na hoja ya Yakobo kuhusu utii wa Abrahamu. Tafsiri inapaswa kuacha mvutano huo kama ulivyo badala ya kuamua mjadala wa kimadhehebu.
- issue: Maana ya δικαιοσύνη
  choice: haki
  alternative: uadilifu
  rationale: Katika dondoo hili, “haki” inafaa zaidi kwa lugha ya kuhesabiwa na kwa muktadha wa kukubaliwa kuwa mwenye haki; “uadilifu” ungeelekeza zaidi kwenye tabia ya kimaadili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Umoja wa “Andiko” umehifadhiwa kulingana na chanzo, na “hilo” limetumiwa ili kutobainisha kupita kiasi kiima kisichotajwa wazi katika Kigiriki.
