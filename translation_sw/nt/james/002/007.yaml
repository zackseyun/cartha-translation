  text: Do not they themselves blaspheme the good name that was called upon you?[a][b]
translation:
  language: sw
  text: Je, si wao wenyewe wanalikufuru jina jema lililoitwa juu yenu?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “jina lenye heshima” au “jina adhimu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “lililoitwa juu yenu”; usemi huu huenda unarejelea jina ambalo waamini wanatambulishwa kwalo, labda ukiwa na mwangwi wa lugha ya agano au ya ubatizo.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ αὐτοὶ
  choice: Je, si wao wenyewe
  rationale: Muundo huu unaendeleza swali la balagha linalotarajia jibu la ndiyo, huku neno “wenyewe” likihifadhi msisitizo wa αὐτοὶ kwa watu wale wale waliotajwa.
- source_word: βλασφημοῦσιν
  choice: wanalikufuru
  rationale: “Kulikufuru” huhifadhi uzito wa usemi wa kudharau au kunena vibaya kuhusu jina lenye heshima ya kidini; kiambishi cha yambwa “-li-” kinarejelea “jina.”
- source_word: τὸ καλὸν ὄνομα
  choice: jina jema
  rationale: Tafsiri hii ni ya moja kwa moja na haifungi maana ya καλός, ambayo hapa inaweza pia kuwa “lenye heshima” au “adhimu.”
- source_word: τὸ ἐπικληθὲν ἐφ’ ὑμᾶς
  choice: lililoitwa juu yenu
  rationale: Huhifadhi kauli tendwa na taswira ya jina kuitwa juu ya watu, bila kuibadili moja kwa moja kuwa “jina ambalo mnaitwa,” jambo ambalo lingefafanua zaidi ya Kigiriki.
theological_decisions:
- issue: Jina linalorejelewa na “jina jema”
  choice: Kuacha rejeo likiwa pana kama lilivyo katika Kigiriki, yaani jina lenye heshima lililowekwa juu ya waamini, ambalo katika muktadha huenda ni jina la Yesu/Bwana.
  alternative: Kutaja wazi “jina la Kristo,” “jina la Yesu,” au “jina la Mungu.”
  rationale: Kigiriki hakimtaji Yesu moja kwa moja katika mstari huu, ingawa Yakobo 2:1 inaelekeza kwa Bwana Yesu Kristo. Kutaja tu “jina jema” kunahifadhi mvutano na upana wa asili.
- issue: Maana ya jina “kuitwa juu” ya waamini
  choice: Kuhifadhi nahau “lililoitwa juu yenu” katika matini kuu.
  alternative: “Jina ambalo kwa hilo mnaitwa,” au kueleza wazi kuwa ni lugha ya ubatizo au agano.
  rationale: Usemi unaweza kuonyesha utambulisho wa jumuiya na huenda ukawa na mwangwi wa lugha ya agano au ubatizo, lakini mstari wenyewe hautaji mazingira hayo wazi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Swali la balagha limewasilishwa kwa “Je, si...?” na msisitizo wa αὐτοὶ umehifadhiwa kwa “wao wenyewe.” Alama zote za tanbihi zimewekwa katika matini kuu.
