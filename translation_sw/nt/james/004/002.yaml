  text: ἐπιθυμεῖτε, καὶ οὐκ ἔχετε· φονεύετε καὶ ζηλοῦτε, καὶ οὐ δύνασθε ἐπιτυχεῖν· μάχεσθε καὶ πολεμεῖτε. οὐκ ἔχετε διὰ τὸ μὴ αἰτεῖσθαι ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/james/004/002.yaml
  text: You desire and do not have[a]; you murder and envy and are not able to obtain; you fight and wage war[d][c][b]. You do not have because you do not ask.
translation:
  language: sw
  text: Mnatamani na hamna; mnafanya mauaji na mnahusudu, wala hamwezi kupata; mnapigana na kufanya vita. Hamna kwa sababu hamwombi[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: d
    text: Muktadha unaonyesha kwamba Mungu ndiye anayeombwa, ingawa matini ya Kigiriki haimtaji wazi katika mstari huu.
    reason: cross_reference
lexical_decisions:
- source_word: ἐπιθυμεῖτε
  choice: mnatamani
  rationale: Kitenzi hiki huonyesha tamaa au hamu kubwa. Katika muktadha huu tamaa hiyo ni mbaya, lakini “mnatamani” huhifadhi upana wa maana bila kuiwekea maana ya kingono au ya kutamani mali ya mwingine pekee.
- source_word: οὐκ ἔχετε
  choice: hamna kitu
  rationale: Hii ni tafsiri ya kawaida na ya moja kwa moja ya kutokuwa na kile kinachotamaniwa; “kitu” kinaweka sentensi katika Kiswahili cha asili bila kubainisha kitu mahususi ambacho Kigiriki hakikitaji.
- source_word: φονεύετε
  choice: mnaua
  rationale: Kitenzi cha Kigiriki kwa kawaida humaanisha kuua isivyo halali, yaani kufanya mauaji. Kiswahili “mnaua” kinahifadhi ukali wa kauli bila kuongeza ufafanuzi wa kiuhakimu usiotajwa katika chanzo.
- source_word: ζηλοῦτε
  choice: kuwaonea wengine wivu
  rationale: Katika mazingira ya tamaa iliyokosa kutimizwa na uhasama, maana hasi ya kuwaonea wengine wivu inafaa kuliko maana chanya ya kuwa na bidii.
- source_word: οὐ δύνασθε ἐπιτυχεῖν
  choice: hamwezi kupata mnachotaka
  rationale: Kirai hiki kinaonyesha kushindwa kufikia au kupata kitu kinacholengwa. Kutaja “mnachotaka” kunafanya lengo lililodokezwa lieleweke kwa kawaida katika Kiswahili.
- source_word: μάχεσθε καὶ πολεμεῖτε
  choice: mnapigana na kuendesha vita
  rationale: Maneno hayo mawili yanaonyesha mapambano na vita. Tafsiri hii huhifadhi uzito na kuongezeka kwa kiwango cha uhasama bila kuyafanya kuwa visawe kabisa.
- source_word: διὰ τὸ μὴ αἰτεῖσθαι ὑμᾶς
  choice: kwa sababu hamwombi
  rationale: Muundo wa Kigiriki unaonyesha sababu. “Hamwombi” ni wa kawaida na huacha yule anayeombwa akiwa amedokezwa, kama ilivyo katika chanzo.
theological_decisions:
- issue: Ikiwa φονεύετε ipunguzwe ukali kwa kuichukulia kama sitiari au mbinu ya balagha
  choice: Kuhifadhi kauli kali “mnaua” katika matini kuu
  alternative: mna chuki kali; au mnaua mioyoni mwenu
  rationale: Kitenzi cha Kigiriki chenyewe ni kikali. Ikiwa ni sitiari, chumvi ya usemi, au dokezo fulani ni suala la ufafanuzi, si jambo la kuingizwa kimya kimya katika tafsiri.
- issue: Ikiwa Mungu atajwe wazi kuwa ndiye anayeombwa
  choice: 'Kuacha yule anayeombwa akiwa amedokezwa: “hamwombi”'
  alternative: hamwombi Mungu
  rationale: Muktadha, hasa mstari unaofuata, unaonyesha kwamba Mungu ndiye anayeombwa, lakini neno “Mungu” halipo wazi katika mstari huu wa Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo wa vipashio umehifadhi msukumo wa kauli za Kigiriki, huku maneno yaliyodokezwa yakiongezwa kwa kiasi kidogo pale yanapohitajika ili Kiswahili kisomeke kwa kawaida.
