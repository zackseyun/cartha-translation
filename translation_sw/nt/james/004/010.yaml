  text: ταπεινώθητε ἐνώπιον ⸀κυρίου, καὶ ὑψώσει ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/010.yaml
  text: Humble yourselves before the Lord[b][a], and he will exalt you.
translation:
  language: sw
  text: Jinyenyekezeni mbele za Bwana[a], naye atawainua[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “katika uwepo wa Bwana.”
    reason: lexical_alternative
  - marker: b
    text: Au “atawatukuza.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ταπεινώθητε
  choice: Jinyenyekezeni
  rationale: Kitenzi hiki cha agizo kinaweza kuwa na maana ya kujirejelea katika muktadha huu. “Jinyenyekezeni” ni Kiswahili cha kawaida na cha heshima kinachoonyesha mwito wa kujishusha kwa hiari.
- source_word: ἐνώπιον
  choice: mbele za
  rationale: “Mbele za” huwasilisha maana ya kuwa mbele ya au katika uwepo wa mtu, na ni usemi wa kawaida katika sajili ya kibiblia ya Kiswahili.
- source_word: κυρίου
  choice: Bwana
  rationale: “Bwana” huhifadhi rejeo mahsusi la κύριος bila kuamua kama hapa ni Mungu au Bwana Yesu.
- source_word: ὑψώσει
  choice: atawainua
  rationale: Katika muktadha huu neno lina maana ya kuinua kwa heshima au cheo baada ya mtu kujinyenyekeza. “Atawainua” ni la asili na huhifadhi sitiari ya kuinuliwa.
- source_word: ὑμᾶς
  choice: -wa-
  rationale: Kiambishi cha yambwa “-wa-” katika “atawainua” kinaonyesha wazi kuwa wanaoambiwa ni wengi.
theological_decisions:
- issue: Rejeo la “Bwana”
  choice: Bwana
  alternative: Mungu; Bwana Yesu
  rationale: Matumizi ya κύριος katika Yakobo yanaweza kumrejelea Mungu au Yesu. Kirai hiki pekee hakilazimishi uchaguzi kati ya marejeo hayo, hivyo “Bwana” huhifadhi utata wa maandishi ya Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Agizo la wingi limewekwa wazi katika “Jinyenyekezeni,” na “mbele za Bwana” hudumisha mtindo wa kawaida wa lugha ya kibiblia bila kuwa mgumu.
