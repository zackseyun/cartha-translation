base_translation:
  language: en
  yaml_path: translation/nt/james/004/001.yaml
  text: From where come wars and from where come fights among you? Is it not from here—from your pleasures that wage war in your members?[a][b][c]
translation:
  language: sw
  text: Vita hutoka wapi, na mapigano hutoka wapi miongoni mwenu? Je, hayatoki hapa—katika raha zenu zinazopigana vita ndani ya viungo vyenu?[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “migogoro ... ugomvi.” Kigiriki kinatumia maneno ya kijeshi, kihalisi “vita” na “mapigano,” kuelezea mabishano ndani ya jumuiya.
    reason: lexical_alternative
  - marker: b
    text: Au “ndani yenu” katika kishazi cha kwanza; Kigiriki kinaweza kumaanisha migogoro kati ya wasomaji au ndani yao. Aya nzima inaunganisha ugomvi wa nje na raha za ndani.
    reason: alternative_reading
  - marker: c
    text: “Viungo” ni tafsiri ya moja kwa moja; vinaweza kuwa sehemu za mwili au, kwa maana pana zaidi, uwezo mbalimbali ndani ya mtu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πόθεν ... πόθεν
  choice: hutoka wapi? ... hayatoki hapa
  rationale: Linarudia wazo la chanzo katika swali la balagha kwa Kiswahili cha kawaida, huku sentensi ya pili ikielekeza kwenye chanzo kinachotajwa mara moja.
- source_word: πόλεμοι
  choice: vita
  rationale: Linahifadhi taswira kali ya kijeshi ya neno la Kigiriki, ingawa hapa huenda linarejelea migogoro mikubwa katika jumuiya.
- source_word: μάχαι
  choice: mapigano
  rationale: Linatofautisha neno hili na 'vita' huku likidumisha taswira ya pambano.
- source_word: ἐν ὑμῖν
  choice: miongoni mwenu
  rationale: Katika kishazi cha kwanza, muktadha unaelekea kwenye migogoro kati ya wasomaji kama jumuiya.
- source_word: οὐκ ἐντεῦθεν
  choice: Je, hayatoki hapa
  rationale: Linawasilisha swali linalotarajia jibu la kukubali na kuelekeza kwenye chanzo kinachofuata.
- source_word: ἡδονῶν
  choice: anasa
  rationale: Neno hili linaonyesha raha zinazotafutwa kwa ajili ya kujiridhisha; 'anasa' ni la asili na lenye uzito unaofaa katika Kiswahili, bila kulifanya kuwa 'tamaa' moja kwa moja.
- source_word: στρατευομένων
  choice: zinazopigana vita
  rationale: Linahifadhi kitendo kinachoendelea pamoja na taswira ya kijeshi inayounganisha kishazi hiki na 'vita' mwanzoni.
- source_word: ἐν τοῖς μέλεσιν ὑμῶν
  choice: ndani ya viungo vyenu
  rationale: Linadumisha sitiari ya viungo vya mwili na kuacha wazi kama inahusu sehemu za mwili au uwezo mbalimbali ndani ya mtu.
theological_decisions:
- issue: Iwapo migogoro ya mwanzo ni ya ndani tu au ni mabishano katika jumuiya
  choice: Kishazi cha kwanza kimetafsiriwa 'miongoni mwenu,' na cha mwisho 'ndani ya viungo vyenu.'
  alternative: Kutafsiri vyote kwa maana ya ndani, kama 'ndani yenu,' au kulainisha mwisho kuwa 'ndani yenu.'
  rationale: Yakobo anaunganisha ugomvi wa nje katika jumuiya na anasa zinazopigana ndani ya mtu; tafsiri inadumisha pande zote bila kuondoa mvutano huo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa maswali ya balagha ni wa asili, na istilahi za kijeshi pamoja na utata wa 'miongoni/ndani' na 'viungo' vimehifadhiwa.
