base_translation:
  language: en
  yaml_path: translation/nt/james/004/013.yaml
  text: Come now[a], you who say, “Today or tomorrow we will go into this city and spend a year there and do business and make a profit.”
translation:
  language: sw
  text: Basi sasa, ninyi msemao, “Leo au kesho tutakwenda katika mji huu[a], tutakaa huko kwa mwaka mmoja, tutafanya biashara na kupata faida.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa usemi wa kawaida zaidi, “mji fulani.” Kigiriki kinasema “mji huu,” kikitumia neno la kuonyesha mji maalumu katika mpango wa wasemaji.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄγε νῦν
  choice: Sikilizeni sasa
  rationale: Ni usemi wa kuvuta fikira unaoanzisha karipio au onyo. Kiswahili hiki ni cha moja kwa moja na cha kawaida kuliko tafsiri ya neno kwa neno kama ‘Njooni sasa’.
- source_word: οἱ λέγοντες
  choice: ninyi msemao
  rationale: Kivumishi-nenzi chenye kibainishi kinatumika kama mwito wa moja kwa moja kwa watu wanaosema maneno hayo.
- source_word: Σήμερον ἢ αὔριον
  choice: Leo au kesho
  rationale: ἢ ni kiunganishi cha uchaguzi, hivyo ‘au’ huhifadhi maana ya mipango ya wakati wa karibu.
- source_word: πορευσόμεθα
  choice: tutakwenda
  rationale: Kitenzi hiki hapa kina maana ya kawaida ya kwenda mahali fulani; ‘tutakwenda’ ni wazi na cha asili.
- source_word: εἰς τήνδε τὴν πόλιν
  choice: katika mji huu
  rationale: Kiwakilishi τήνδε kinaelekeza kwenye mji maalumu ulio katika mpango wa wasemaji. ‘Katika’ pia hulingana vizuri na wazo la kwenda na kukaa humo.
- source_word: ποιήσομεν ἐκεῖ ἐνιαυτόν
  choice: tutakaa huko mwaka mmoja
  rationale: ποιέω pamoja na kipindi cha wakati ni nahau ya kutumia au kupitisha muda. Katika Kiswahili, ‘tutakaa huko mwaka mmoja’ hutoa maana hiyo kwa kawaida.
- source_word: ἐμπορευσόμεθα
  choice: tutafanya biashara
  rationale: Kitenzi hiki humaanisha kufanya shughuli za kibiashara au biashara; usemi huu ni wa kawaida na mpana vya kutosha.
- source_word: κερδήσομεν
  choice: kupata faida
  rationale: Katika muktadha wa biashara, κερδαίνω humaanisha kupata faida ya kifedha. Muundo huu unaungana kwa kawaida na ‘tutafanya biashara’.
theological_decisions:
- issue: Sauti ya karipio la moja kwa moja
  choice: ‘ninyi msemao’ kama mwito wa moja kwa moja
  alternative: ‘wale wasemao’ kama maelezo yasiyo ya moja kwa moja
  rationale: Yakobo anawakabili moja kwa moja watu wanaojigamba kuhusu mipango yao; mwito wa nafsi ya pili huhifadhi nguvu hiyo bila kuongeza msimamo wa kidhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Sikilizeni sasa’ huleta nguvu ya karipio kwa njia ya asili; ‘ninyi msemao’ ni ya kifasihi kiasi lakini wazi na inafaa kwa maandiko.
