id: JAS.4.12
reference: James 4:12
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἷς ⸀ἐστιν νομοθέτης ⸂καὶ κριτής⸃, ὁ δυνάμενος σῶσαι καὶ ἀπολέσαι· σὺ δὲ τίς εἶ, ⸂ὁ κρίνων⸃ τὸν ⸀πλησίον;
base_translation:
  language: en
  yaml_path: translation/nt/james/004/012.yaml
  text: There is one Lawgiver and Judge, the one who is able to save and to destroy. But who are you, judging your neighbor?
translation:
  language: sw
  text: Mtoa sheria na hakimu ni mmoja tu, yeye awezaye kuokoa na kuangamiza. Lakini wewe ni nani, unayemhukumu jirani yako?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νομοθέτης
  choice: Mtoa sheria
  rationale: Huwasilisha kwa uwazi mtu mwenye mamlaka ya kuweka sheria, huku ikidumisha umoja na cheo cha mhusika katika muktadha.
- source_word: κριτής / κρίνων
  choice: Hakimu / unayemhukumu
  rationale: ‘Hakimu’ linafaa kwa cheo cha mwenye mamlaka ya hukumu; ‘unayemhukumu’ hudumisha uhusiano wa kileksia na kitenzi cha Kigiriki bila kufanya swali kuwa katazo la moja kwa moja.
- source_word: σῶσαι
  choice: kuokoa
  rationale: Ni kitenzi cha kawaida na chenye upana unaolingana na maana ya kuokoa au kuleta wokovu katika muktadha wa kitheolojia.
- source_word: ἀπολέσαι
  choice: kuangamiza
  rationale: Hudumisha nguvu ya kitenzi, ambacho hapa kiko katika ulinganifu wa wazi na ‘kuokoa’; ‘kuharibu’ ni mbadala unaowezekana lakini dhaifu kidogo.
- source_word: πλησίον
  choice: jirani yako
  rationale: Ni tafsiri ya kawaida na ya asili ya mtu wa karibu au mwenzako; kiwakilishi ‘yako’ kinatokana na muundo wa moja kwa moja kwa msomaji katika Kiswahili.
theological_decisions:
- issue: Utambulisho wa Mtoa sheria na Hakimu
  choice: Kudumisha kauli ‘ni mmoja tu’ bila kuongeza jina la Mungu
  alternative: Kusema wazi ‘Mungu peke yake ndiye Mtoa sheria na Hakimu’
  rationale: Muktadha unaelekeza kwa Mungu, lakini mstari wa Kigiriki haumtii jina moja kwa moja; tafsiri haipaswi kuongeza ufafanuzi wa kitheolojia ndani ya matini.
- issue: Nguvu ya swali la mwisho
  choice: ‘Lakini wewe ni nani, unayemhukumu jirani yako?’
  alternative: ‘Lakini wewe ni nani hata umhukumu jirani yako?’
  rationale: Muundo uliochaguliwa huakisi kishazi-shirikishi ὁ κρίνων na kudumisha mkazo wa kitendo kinachoendelea, bila kuligeuza kimyakimya kuwa swali la ruhusa au uwezo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Mtoa sheria’ ni wazi kwa wasomaji wa kawaida; herufi kubwa katika ‘Hakimu’ inaonyesha cheo kinachomrejelea mhusika yuleyule bila kuongeza jina ambalo halipo wazi katika mstari.
