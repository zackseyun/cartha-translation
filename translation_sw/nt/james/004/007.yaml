  yaml_path: translation/nt/james/004/007.yaml
  text: Submit yourselves[a], therefore, to God. But resist the devil, and he will flee from you.
translation:
  language: sw
  text: Kwa hiyo, jitiisheni[a] kwa Mungu. Lakini mpingeni Ibilisi, naye atawakimbia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Iweni chini ya mamlaka ya Mungu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποτάγητε
  choice: jitiisheni
  rationale: 'Kitenzi hiki cha amri kina nguvu ya kujirejelea katika himizo hili: wasomaji wanaitwa wajitie kwa hiari chini ya mamlaka ya Mungu. “Jitiisheni” ni Kiswahili cha kawaida na huhifadhi wazo la kunyenyekea chini ya mamlaka.'
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Huonyesha hitimisho linalotokana na hoja iliyotangulia; “Kwa hiyo” huunganisha mawazo hayo kwa uwazi.
- source_word: τῷ θεῷ
  choice: kwa Mungu
  rationale: Hukamilisha kitenzi ὑποτάγητε kwa kuonyesha yule ambaye wasomaji wanapaswa kujitiisha kwake.
- source_word: ἀντίστητε
  choice: mpingeni
  rationale: Ni amri ya kusimama dhidi ya mtu au kumpinga. “Mpingeni” ni fupi, ya asili, na inafaa katika himizo la kiroho.
- source_word: δὲ
  choice: Lakini
  rationale: Huonyesha utofautishaji kati ya kujitiisha kwa Mungu na kumpinga Ibilisi.
- source_word: τῷ διαβόλῳ
  choice: Ibilisi
  rationale: Hapa διάβολος ni jina la adui binafsi wa kiroho; “Ibilisi” ni istilahi ya kawaida na inayotambulika katika Kiswahili.
- source_word: καὶ
  choice: naye
  rationale: Huunganisha amri na matokeo yaliyoahidiwa, huku kiwakilishi kikimtaja tena Ibilisi kwa uwazi wa Kiswahili.
- source_word: φεύξεται
  choice: atawakimbia
  rationale: Wakati ujao huonyesha matokeo ya kumpinga; “atawakimbia” hutoa kwa kawaida wazo la kuondoka kwa kukimbia kutoka kwao.
- source_word: ἀφ’ ὑμῶν
  choice: -wa- katika “atawakimbia”
  rationale: Kihusishi chenye hali ya umilikishi huonyesha kuondoka kutoka kwa wasomaji; Kiswahili huwasilisha maana hiyo kwa kawaida kwa kiambishi cha yambwa katika “atawakimbia.”
theological_decisions:
- issue: Maana ya διάβολος
  choice: Ibilisi kama adui binafsi wa kiroho
  alternative: mchongezi, kwa maana ya kawaida au kama nguvu isiyo binafsi
  rationale: Neno hili lina kibainishi katika Kigiriki na muktadha unahusu mapambano ya kiroho. Matumizi yake hapa yanaelekeza kwa Ibilisi kama kiumbe binafsi, si kanuni ya uovu isiyo na nafsi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni mfupi na wa moja kwa moja kama maandishi ya Kigiriki; “jitiisheni” na “mpingeni” huhifadhi nguvu ya amri, na tanbihi huhifadhi uwezekano wa tafsiri ya hali ya kuwa chini ya mamlaka.
