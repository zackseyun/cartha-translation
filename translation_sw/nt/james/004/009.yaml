  text: ταλαιπωρήσατε καὶ πενθήσατε καὶ κλαύσατε· ὁ γέλως ὑμῶν εἰς πένθος ⸀μετατραπήτω καὶ ἡ χαρὰ εἰς κατήφειαν·
base_translation:
  language: en
  yaml_path: translation/nt/james/004/009.yaml
  text: Be miserable and mourn and weep[b][a]. Let your laughter be turned into mourning and your joy into gloom.
translation:
  language: sw
  text: Taabikeni, ombolezeni, na lieni. Kicheko chenu kigeuzwe kuwa maombolezo, na furaha yenu iwe huzuni.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hali ya kuvunjika moyo.” Neno la Kigiriki linaeleza hali ya mtu aliyeinamisha uso kwa huzuni au masikitiko.
    reason: lexical_alternative
lexical_decisions:
- source_word: ταλαιπωρήσατε
  choice: Taabikeni
  rationale: Amri hii inaeleza kuingia katika hali ya taabu au dhiki. “Taabikeni” inadumisha ukali wa mwito bila kuichanganya na vitenzi vinavyofuata vya kuomboleza na kulia.
- source_word: πενθήσατε
  choice: ombolezeni
  rationale: Neno hili linafaa kwa huzuni nzito, hasa katika muktadha wa toba, na linahifadhi uzito wa πενθέω.
- source_word: κλαύσατε
  choice: kulia
  rationale: “Kulia” ni usemi wa kawaida na wenye uzito wa kutosha, na unatofautisha machozi na kitendo kilichotangulia cha kuomboleza.
- source_word: ὁ γέλως ὑμῶν
  choice: kicheko chenu
  rationale: Tafsiri ya moja kwa moja na ya asili ya nomino pamoja na kimilikishi chake.
- source_word: εἰς πένθος
  choice: kuwa maombolezo
  rationale: “Maombolezo” hudumisha uhusiano wa kimaana na “ombolezeni” na uzito wa huzuni inayotakiwa.
- source_word: μετατραπήτω
  choice: na kigeuke
  rationale: Umbo hili la amri linaonyesha badiliko la hali; “na kigeuke” ni Kiswahili cha asili kinachohifadhi nguvu ya amri.
- source_word: ἡ χαρὰ
  choice: furaha yenu
  rationale: Ingawa ὑμῶν imetajwa wazi katika kishazi cha kwanza tu, muundo sambamba unaifanya ihusishwe kwa kawaida pia na “furaha.”
- source_word: εἰς κατήφειαν
  choice: kuwa huzuni
  rationale: κατήφεια ni hali ya kuwa mwenye uso ulioinama kwa masikitiko. “Huzuni” ni ya kawaida na inasomeka vizuri, huku tanbihi ikihifadhi maana mahsusi zaidi.
theological_decisions:
- issue: Lugha ya toba na nguvu ya kihisia
  choice: Kifungu kimetafsiriwa kama mwito mkali wa kuwa na huzuni ya toba, bila kupunguza nguvu ya amri.
  alternative: Kukitafsiri kama mwito mpole wa kuwa makini au mwenye kiasi.
  rationale: Katika muktadha wa Yakobo 4:6–10, amri hizi zinawaita wasomaji wajinyenyekeze mbele za Mungu. Tafsiri inadumisha ukali huo bila kuongeza maelezo ya kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa amri tatu umehifadhiwa, pamoja na usambamba kati ya kicheko/maombolezo na furaha/huzuni.
