  text: ἀντὶ τοῦ λέγειν ὑμᾶς· Ἐὰν ὁ κύριος ⸀θελήσῃ, καὶ ⸀ζήσομεν καὶ ⸀ποιήσομεν τοῦτο ἢ ἐκεῖνο.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/015.yaml
  text: Instead, you ought to say, “If the Lord wills, we will live and also do this or that.”
translation:
  language: sw
  text: Badala yake, mnapaswa kusema[a], “Bwana akipenda, tutaishi na pia tutafanya hili au lile.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya moja kwa moja zaidi, “badala ya ninyi kusema.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντὶ τοῦ λέγειν ὑμᾶς
  choice: Badala yake, mnapaswa kusema
  rationale: Muundo huu una maana ya moja kwa moja ya ‘badala ya ninyi kusema,’ lakini katika Kiswahili cha kawaida nguvu yake ya kusahihisha inaelezwa kwa uwazi na kwa ufasaha kwa ‘Badala yake, mnapaswa kusema.’
- source_word: Ἐὰν
  choice: aki-
  rationale: Katika kirai ‘Bwana akipenda,’ kiambishi cha hali ‘aki-’ kinaonyesha sharti la ‘ikiwa’ kwa njia ya asili katika Kiswahili.
- source_word: ὁ κύριος
  choice: Bwana
  rationale: ‘Bwana’ ndilo neno la kawaida la mradi kwa κύριος na halilazimishi utambulisho mahsusi zaidi ambao kifungu chenyewe hakitaji.
- source_word: θελήσῃ
  choice: akipenda
  rationale: ‘Akipenda’ ni usemi wa kawaida na wenye heshima unaoonyesha kwamba kuendelea kuishi na kutekeleza mipango kunategemea mapenzi ya Bwana.
- source_word: καὶ ζήσομεν
  choice: tutaishi
  rationale: Wakati ujao umehifadhiwa, ukionyesha kwamba hata kuendelea kuishi kunategemea mapenzi ya Bwana.
- source_word: καὶ ποιήσομεν
  choice: na pia tutafanya
  rationale: ‘Tutafanya’ huhifadhi kitenzi cha wakati ujao, na ‘pia’ huonyesha kwamba tendo linalopangwa, pamoja na kuishi, linategemea mapenzi ya Bwana.
- source_word: τοῦτο ἢ ἐκεῖνο
  choice: hili au lile
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaorejelea kwa ujumla shughuli mbalimbali zilizopangwa.
theological_decisions:
- issue: Anayerejelewa na ‘Bwana’ na nguvu ya kauli ya sharti
  choice: Bwana
  alternative: Mungu; Bwana Yesu
  rationale: Kigiriki kinasema tu ὁ κύριος. Tafsiri ‘Bwana’ huhifadhi mkazo juu ya enzi na mapenzi yake bila kuamua kimyakimya ikiwa Yakobo anamlenga Baba au Yesu hasa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Usemi ‘Bwana akipenda’ ni wa asili na unafaa muktadha wa utegemezi wa mapenzi ya Mungu.
