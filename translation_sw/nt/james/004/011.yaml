id: JAS.4.11
reference: James 4:11
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Μὴ καταλαλεῖτε ἀλλήλων, ἀδελφοί· ὁ καταλαλῶν ἀδελφοῦ ⸀ἢ κρίνων τὸν ἀδελφὸν αὐτοῦ καταλαλεῖ νόμου καὶ κρίνει νόμον· εἰ δὲ νόμον κρίνεις, οὐκ εἶ ποιητὴς νόμου ἀλλὰ κριτής.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/011.yaml
  text: Do not speak against one another[a], brothers. The one who speaks against a brother or judges his brother speaks against the law and judges the law. But if you judge the law[b], you are not a doer of the law but a judge.
translation:
  language: sw
  text: Ndugu[b], msiwaseme vibaya wenzenu[a]. Anayesema vibaya juu ya ndugu au anayemhukumu ndugu yake, husema vibaya juu ya sheria na kuihukumu. Lakini ukiihukumu sheria, wewe si mtendaji wa sheria, bali hakimu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “msisingiziane” au “msikashifiane”; kitenzi cha Kigiriki kinaweza kumaanisha kusema dhidi ya mtu kwa namna inayomharibia sifa.
    reason: lexical_alternative
  - marker: b
    text: “Ndugu” katika aya hii linaweza kuwahusu waamini wote, wanaume na wanawake.
    reason: lexical_alternative
lexical_decisions:
- source_word: καταλαλεῖτε / καταλαλῶν / καταλαλεῖ
  choice: msisemeane vibaya / anayemsema vibaya / anaisema vibaya
  rationale: Kitenzi hiki huhusu kusema dhidi ya mtu kwa nia mbaya au kwa namna inayomharibia sifa. ‘Kusema vibaya’ ni Kiswahili cha kawaida, hakifungi maana kwenye kashfa rasmi pekee, na kinahifadhi urudiaji wa kitenzi katika hoja ya aya.
- source_word: ἀλλήλων
  choice: -ane- katika ‘msisemeane’
  rationale: Kiambishi cha kutendeana ‘-ane-’ huonyesha kwa kawaida na kwa ufupi tendo la kufanyiana, yaani ‘ninyi kwa ninyi’.
- source_word: ἀδελφοί
  choice: Ndugu
  rationale: ‘Ndugu’ ni neno la kawaida la Kiswahili lisilobainisha jinsia, linafaa kwa mwito wa jumuiya nzima, na linadumisha taswira ya kifamilia ya Yakobo bila kulazimisha maana ya wanaume pekee.
- source_word: ἀδελφοῦ / τὸν ἀδελφὸν αὐτοῦ
  choice: ndugu yake
  rationale: Huhifadhi taswira ya kifamilia na ni ya asili katika Kiswahili. ‘Ndugu’ inaweza kumaanisha muumini mwenzake bila kubainisha jinsia.
- source_word: ἢ
  choice: au
  rationale: 'Inaonyesha matendo mawili yanayowekwa sambamba: kumsema vibaya ndugu au kumhukumu.'
- source_word: κρίνων / κρίνει / κρίνεις
  choice: anayemhukumu / kuihukumu / ukiihukumu
  rationale: ‘Kuhukumu’ huhifadhi urudiaji wa mzizi wa Kigiriki na upana wa maana; ‘kulaani’ kungeifanya maana kuwa finyu mno.
- source_word: νόμου / νόμον
  choice: sheria
  rationale: ‘Sheria’ ndilo neno la kawaida kwa νόμος. Aya yenyewe haisemi wazi kama ni Sheria ya Musa, sheria ya kifalme, au sheria ya Mungu kwa maelezo hayo, hivyo tafsiri haibainishi zaidi.
- source_word: ποιητὴς
  choice: mtendaji
  rationale: ‘Mtendaji wa sheria’ huonyesha mtu anayeitekeleza na huhifadhi tofauti ya moja kwa moja kati ya kuitenda sheria na kuwa hakimu wake.
- source_word: κριτής
  choice: hakimu
  rationale: ‘Hakimu’ ni nomino ya asili kwa mtu anayehukumu na huweka wazi tofauti na ‘mtendaji’.
theological_decisions:
- issue: Wanaorejelewa na ἀδελφοί
  choice: Kutumia ‘Ndugu,’ linaloweza kuhusisha jumuiya nzima ya waamini.
  alternative: ‘Ndugu wanaume’ au ‘ndugu zangu wanaume na wanawake.’
  rationale: Umbo la Kigiriki ni wingi wa kiume lakini katika muktadha linaelekea kuiambia jumuiya nzima. Kiswahili ‘ndugu’ huhifadhi lugha ya kifamilia na kutokuwa mahsusi kuhusu jinsia bila kuongeza maneno.
- issue: Rejeo la ‘sheria’
  choice: Kuacha kama ‘sheria’ bila kuifafanua zaidi.
  alternative: ‘Sheria ya Musa,’ ‘sheria ya kifalme,’ au ‘sheria ya Mungu.’
  rationale: Muktadha wa Yakobo unaelekeza kwenye maagizo ya Mungu, hasa upendo kwa jirani, lakini aya hii yenyewe hailifungi rejeo kwa mojawapo ya majina hayo.
- issue: Uhusiano wa kumhukumu ndugu na kuihukumu sheria
  choice: Kudumisha dai kali kwamba anayemhukumu ndugu anaihukumu sheria.
  alternative: Kulainisha kuwa mtu huyo ‘anajifanya mkuu kuliko sheria.’
  rationale: Maelezo hayo yanaweza kufafanua mantiki, lakini hayajasemwa moja kwa moja katika Kigiriki. Tafsiri inadumisha mvutano wa usemi wa mwandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umetanguliza mwito ‘Ndugu’ kwa mtiririko wa asili wa Kiswahili. Urudiaji wa ‘kusema vibaya,’ ‘kuhukumu,’ na ‘sheria’ umehifadhiwa ili mantiki na msisitizo wa Kigiriki ubaki wazi.
