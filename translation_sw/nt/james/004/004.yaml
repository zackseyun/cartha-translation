id: JAS.4.4
reference: James 4:4
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ⸀μοιχαλίδες, οὐκ οἴδατε ὅτι ἡ φιλία τοῦ κόσμου ἔχθρα τοῦ θεοῦ ἐστιν; ὃς ⸀ἐὰν οὖν βουληθῇ φίλος εἶναι τοῦ κόσμου, ἐχθρὸς τοῦ θεοῦ καθίσταται.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/004.yaml
  text: Adulteresses[a], do you not know that friendship with the world is hostility toward God? Therefore[d][c][b], whoever wants to be a friend of the world makes himself an enemy of God.
translation:
  language: sw
  text: Enyi wanawake wazinzi[a], je, hamjui kwamba urafiki na ulimwengu ni uadui dhidi ya Mungu? Kwa hiyo, yeyote anayetaka kuwa rafiki wa ulimwengu anakuwa adui wa Mungu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Neno la Kiyunani ni la kike wingi: “Enyi wanawake wazinzi.” Huenda limetumiwa kisitiari kuhusu kutokuwa waaminifu kwa Mungu, likirejelea lugha ya manabii kuhusu uaminifu wa agano.'
    reason: lexical_alternative
  - marker: b
    text: Au “huwa adui wa Mungu.”
    reason: alternative_reading
lexical_decisions:
- source_word: μοιχαλίδες
  choice: Enyi wazinzi
  rationale: Nomino ya wito, jinsia ya kike na wingi, imetafsiriwa moja kwa moja kwa neno lenye ukali wa sitiari ya kutokuwa waaminifu kwa Mungu; tanbihi inaeleza nguvu yake ya kiagano.
- source_word: οὐκ οἴδατε
  choice: je, hamjui
  rationale: Huhifadhi swali la balagha na kutoa Kiswahili cha kawaida na wazi.
- source_word: φιλία
  choice: urafiki
  rationale: Hulingana moja kwa moja na nomino ya Kiyunani na huhifadhi uhusiano wa kileksika na φίλος, ‘rafiki,’ katika sehemu inayofuata.
- source_word: κόσμου
  choice: ulimwengu
  rationale: Huhifadhi upana wa κόσμος bila kuingiza ufafanuzi ndani ya matini; hapa muktadha unaonyesha mpangilio wa kibinadamu unaompinga Mungu, si uumbaji wenyewe.
- source_word: ἔχθρα τοῦ θεοῦ
  choice: uadui dhidi ya Mungu
  rationale: 'Huwasilisha kwa uwazi uwezekano wenye nguvu wa genitivi elekezi: urafiki na ulimwengu ni uadui unaoelekezwa kwa Mungu.'
- source_word: ὃς ἐὰν οὖν
  choice: Kwa hiyo, yeyote
  rationale: ‘Kwa hiyo’ huhifadhi hitimisho la οὖν, na ‘yeyote’ huonyesha nguvu ya jumla ya kishazi cha uhusiano kisichoainishwa.
- source_word: βουληθῇ
  choice: anayetaka
  rationale: Hutoa kwa kawaida maana ya hiari au nia ya βούλομαι bila kuifanya kuwa uamuzi uliokamilika kuliko matini inavyosema.
- source_word: φίλος εἶναι τοῦ κόσμου
  choice: kuwa rafiki wa ulimwengu
  rationale: Huhifadhi muundo wa nomino na uhusiano wa maneno kati ya ‘urafiki’ na ‘rafiki.’
- source_word: ἐχθρὸς τοῦ θεοῦ
  choice: adui wa Mungu
  rationale: Ni tafsiri ya moja kwa moja na yenye nguvu, inayodumisha utofautishaji wa ‘rafiki wa ulimwengu’ na ‘adui wa Mungu.’
- source_word: καθίσταται
  choice: anajifanya kuwa
  rationale: Hueleza kujiweka katika hali hiyo kwa uchaguzi wake mwenyewe, huku tanbihi ikihifadhi uwezekano wa kutafsiri kwa urahisi zaidi kuwa ‘anakuwa.’
theological_decisions:
- issue: Nguvu ya kisitiari ya μοιχαλίδες
  choice: Kubakiza neno halisi ‘Enyi wazinzi’ katika matini na kueleza katika tanbihi kwamba huenda linamaanisha kutokuwa waaminifu kwa Mungu.
  alternative: Enyi watu msio waaminifu kwa Mungu
  rationale: Matumizi hayo yana uwezekano mkubwa wa kurudia lugha ya kinabii kuhusu kuvunja uaminifu wa agano, lakini kubadili sitiari kuwa ufafanuzi kungeondoa taswira kali ya chanzo.
- issue: Maana ya κόσμος
  choice: Kutafsiri ‘ulimwengu’ bila kuupanua katika matini kuu.
  alternative: mfumo wa ulimwengu unaompinga Mungu
  rationale: Katika muktadha huu neno linaashiria mpangilio wa kibinadamu unaompinga Mungu, lakini matini ya Kiyunani inasema tu ‘ulimwengu’; tafsiri haipaswi kufunga maana pana zaidi kuliko chanzo.
- issue: Uhusiano katika ἔχθρα τοῦ θεοῦ
  choice: uadui dhidi ya Mungu
  alternative: uadui na Mungu
  rationale: Muktadha unaunga mkono uadui unaoelekezwa kwa Mungu, ingawa muundo wa genitivi unaweza pia kuwasilishwa kwa Kiswahili kama hali ya kuwa katika uadui na Mungu.
- issue: Nguvu ya καθίσταται
  choice: anajifanya kuwa adui wa Mungu
  alternative: anakuwa adui wa Mungu
  rationale: Chaguo kuu linaonyesha wajibu wa mtu anayechagua urafiki na ulimwengu; chaguo jingine huhifadhi kwa ukaribu zaidi maana ya kuingia katika hali fulani bila kusisitiza namna hiyo inavyotokea.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. ‘Enyi’ huhifadhi wito wa moja kwa moja na mkali; ‘uadui dhidi ya Mungu’ ni wazi katika matumizi ya sasa. Alama zote za tanbihi zimewekwa katika matini kuu.
