id: JAS.4.16
reference: James 4:16
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: νῦν δὲ καυχᾶσθε ἐν ταῖς ἀλαζονείαις ὑμῶν· πᾶσα καύχησις τοιαύτη πονηρά ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/016.yaml
  text: But as it is[a], you boast in your arrogance. All such boasting is evil.
translation:
  language: sw
  text: Lakini sasa mnajisifu kwa majivuno yenu.[a] Kila kujisifu kwa namna hiyo ni ovu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa majidai yenu” au “kwa madai yenu ya kujidai.” Neno la Kigiriki linaweza kumaanisha majivuno au kujidai kwa kiburi; hapa huenda linarejelea hasa mipango ya kujiamini kupita kiasi iliyotajwa katika mistari iliyotangulia.
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν δὲ
  choice: Lakini sasa
  rationale: Huhifadhi maana ya wakati ya νῦν na nguvu ya utofautishaji ya δέ dhidi ya unyenyekevu unaotakiwa katika mstari uliotangulia.
- source_word: καυχᾶσθε
  choice: mnajisifu
  rationale: Ni kitenzi cha kawaida na cha moja kwa moja kwa kujivuna au kujisifu, na pia kinadumisha uhusiano na nomino καύχησις baadaye katika mstari.
- source_word: ἐν ταῖς ἀλαζονείαις ὑμῶν
  choice: kwa majivuno yenu
  rationale: Majivuno yanaonyesha kiburi cha kujidai na kujiamini kupita kiasi. Muundo huu ni wa kawaida katika Kiswahili na hauongezi wazi wazo la 'mipango' ambalo linatokana na muktadha, si neno lenyewe.
- source_word: πᾶσα καύχησις τοιαύτη
  choice: Kujisifu kote kwa namna hiyo
  rationale: Huwasilisha maana ya jumla ya πᾶσα pamoja na sifa ya τοιαύτη, huku ikitumia Kiswahili cha kawaida.
- source_word: πονηρά
  choice: ni uovu
  rationale: Huhifadhi hukumu ya kimaadili ya πονηρά, si maana dhaifu ya kitu kisichofaa tu.
theological_decisions:
- issue: Aina ya kujisifu inayohukumiwa
  choice: Kujisifu kunakotokana na majivuno na kujiamini katika mipango ya kibinadamu bila kujinyenyekeza kwa mapenzi ya Bwana
  alternative: Hukumu ya kila namna ya kujiamini, au hukumu inayohusu mipango ya biashara pekee
  rationale: Muktadha wa Yakobo 4:13–15 unahusu mipango ya kujitegemea kwa majivuno, lakini mstari huu unatoa hukumu ya jumla zaidi kuhusu kujisifu kwa namna hiyo. Tafsiri haibani maana kwenye biashara wala kuipanua hadi kila aina ya kujiamini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Majivuno” ni neno linaloeleweka kwa urahisi na linaonyesha kiburi cha kujidai bila kuongeza neno “mipango” katika matini kuu. Alama ya tanbihi imewekwa baada ya kishazi kinachofafanuliwa.
