id: JAS.4.5
reference: James 4:5
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἢ δοκεῖτε ὅτι κενῶς ἡ γραφὴ λέγει· Πρὸς φθόνον ἐπιποθεῖ τὸ πνεῦμα ὃ ⸀κατῴκισεν ἐν ἡμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/james/004/005.yaml
  text: Or do you think that the Scripture speaks in vain? The Spirit whom he caused to dwell in us yearns jealously[a].
translation:
  language: sw
  text: Au mnadhani kwamba Andiko linasema bure? Roho ambaye Mungu alimfanya akae ndani yetu anatamani sana kwa wivu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “roho ambayo Mungu aliifanya ikae ndani yetu hutamani kwa husuda.” Kigiriki kinaweza kumaanisha ama Roho Mtakatifu au roho ya mwanadamu; pia kirai kilichotafsiriwa “kwa wivu” kinaweza kutafsiriwa “kwa husuda.”
    reason: alternative_reading
lexical_decisions:
- source_word: κενῶς
  choice: bure
  rationale: Katika muktadha huu neno hilo linaeleza kusema pasipo kusudi au matokeo. “Bure” ni Kiswahili cha kawaida kinachohifadhi nguvu ya swali la balagha.
- source_word: ἡ γραφὴ
  choice: Andiko
  rationale: Umoja wenye kibainishi unarejelea Maandiko kama ufunuo wa maandishi wenye mamlaka. “Andiko” huhifadhi umoja wa muundo wa Kigiriki.
- source_word: Πρὸς φθόνον
  choice: kwa wivu
  rationale: Kirai hiki kigumu kinaweza kueleza namna ya kutamani sana. “Kwa wivu” kinaweza kumaanisha dai la haki na la kipekee, bila kuficha uwezekano wa maana hasi ya husuda, ambao umeonyeshwa katika tanbihi.
- source_word: ἐπιποθεῖ
  choice: anatamani sana
  rationale: Kitenzi kinaonyesha hamu au shauku yenye nguvu; “anatamani sana” ni cha kawaida, wazi, na chenye uzito unaofaa.
- source_word: τὸ πνεῦμα
  choice: Roho
  rationale: Matini kuu inachukua neno hili kuwa Roho Mtakatifu, kwa kuwa Mungu ndiye aliyemfanya akae ndani yetu. Hata hivyo, uwezekano wa kumaanisha roho ya mwanadamu umehifadhiwa katika tanbihi.
- source_word: κατῴκισεν
  choice: alimfanya akae
  rationale: 'Muundo huu unaonyesha maana ya kisababishi ya kitenzi: Mungu alisababisha Roho kukaa ndani yetu, badala ya kusema tu kwamba anakaa.'
- source_word: ἐν ἡμῖν
  choice: ndani yetu
  rationale: Hii huonyesha kukaa ndani ya waamini, badala ya uwepo wa kijamii tu miongoni mwao.
theological_decisions:
- issue: Kirejelewa cha τὸ πνεῦμα
  choice: “Roho” anamaanisha Roho Mtakatifu anayekaa ndani ya waamini.
  alternative: “roho” inaweza kumaanisha roho ya mwanadamu ambayo Mungu aliifanya ikae ndani yetu.
  rationale: Sarufi ya Kigiriki inaruhusu maana zote mbili. Matini kuu inafuata maana ya Roho Mtakatifu kwa sababu lugha ya Mungu kumfanya akae ndani yetu inalingana kwa kawaida na kukaa kwa Roho ndani ya waamini, lakini utata halisi umehifadhiwa katika tanbihi.
- issue: Maana ya kimaadili ya φθόνος
  choice: “kwa wivu” katika matini kuu
  alternative: “kwa husuda”
  rationale: “Husuda” kwa kawaida humaanisha tamaa mbaya, ilhali “wivu” unaweza pia kueleza dai la haki la kutaka uaminifu usiogawanyika. Kwa kuwa matini kuu inamrejelea Roho Mtakatifu, “kwa wivu” haimhusishi Mungu moja kwa moja na uovu; maana nyingine imetajwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Herufi kubwa katika “Roho” inaonyesha uamuzi wa matini kuu bila kufuta utata wa Kigiriki, ambao umeelezwa katika tanbihi.
