  text: ἐγγίσατε τῷ θεῷ, καὶ ⸀ἐγγιεῖ ὑμῖν. καθαρίσατε χεῖρας, ἁμαρτωλοί, καὶ ἁγνίσατε καρδίας, δίψυχοι.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/008.yaml
  text: Draw near to God[a], and he will draw near to you. Cleanse your hands, sinners, and purify your hearts, double-minded people.
translation:
  language: sw
  text: Mkaribieni Mungu, naye atawakaribia. Safisheni mikono yenu, enyi wenye dhambi, na takaseni mioyo yenu, enyi wenye nia mbili[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya neno kwa neno zaidi, “wenye nafsi mbili.” Neno hili linawaelezea watu waliogawanyika katika uaminifu au kujitoa kwao kwa ndani.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγγίσατε
  choice: Mkaribieni
  rationale: Kitenzi hiki ni amri kwa wingi ya kumkaribia Mungu. “Mkaribieni” ni Kiswahili cha kawaida kinachohifadhi maana ya uhusiano na mwito wa kiroho, pamoja na ulinganifu na ahadi inayofuata.
- source_word: τῷ θεῷ
  choice: Mungu
  rationale: Ni yambwa ya kitenzi ἐγγίζω; muundo wa Kiswahili “mkaribieni Mungu” unatoa maana ya kumjia au kumsogelea Mungu bila kuongeza ufafanuzi.
- source_word: ἐγγιεῖ
  choice: atawakaribia
  rationale: Ni wakati ujao, nafsi ya tatu umoja, na Mungu ndiye mtenda aliyedokezwa. Kurudia mzizi wa “karibia” kunahifadhi ulinganifu wa sentensi ya Kigiriki.
- source_word: καθαρίσατε
  choice: Safisheni
  rationale: Ni amri kali kwa wingi. “Safisheni” huhifadhi taswira ya kuondoa uchafu na inaweza kubeba maana za nje, kimaadili, na kiibada bila kuifafanua kupita kiasi.
- source_word: χεῖρας
  choice: mikono yenu
  rationale: “Yenu” inaeleweka kutokana na walioagizwa na ni ya kawaida katika Kiswahili. Taswira halisi ya mikono imehifadhiwa ili maana yake ya mwenendo wa nje ibaki wazi bila kufasiriwa moja kwa moja.
- source_word: ἁμαρτωλοί
  choice: enyi wenye dhambi
  rationale: Ni mwito wa moja kwa moja kwa wingi. “Enyi wenye dhambi” huhifadhi ukali wa karipio kwa lugha ya sasa na yenye heshima.
- source_word: ἁγνίσατε
  choice: takaseni
  rationale: “Takaseni” limetofautishwa na “safisheni” ili kuhifadhi utofauti wa καθαρίζω na ἁγνίζω, hasa katika ulinganifu wa mikono ya nje na mioyo ya ndani.
- source_word: καρδίας
  choice: mioyo yenu
  rationale: “Mioyo” huhifadhi taswira ya kibiblia ya utu wa ndani, nia, na uaminifu; “yenu” ni ya kawaida katika mwito huu wa moja kwa moja.
- source_word: δίψυχοι
  choice: enyi wenye nia mbili
  rationale: Neno hili lina maana ya watu waliogawanyika katika nia, uaminifu, au kujitoa kwao. “Wenye nia mbili” ni wazi kwa msomaji wa sasa, huku taswira halisi zaidi ikihifadhiwa katika tanbihi.
theological_decisions:
- issue: Taswira ya utakaso wa mikono na mioyo
  choice: Kuhifadhi “mikono” na “mioyo” katika matini bila kuzigeuza kuwa maelezo ya matendo ya nje na nia za ndani.
  alternative: Kufafanua moja kwa moja kuwa ni matendo ya nje na nia za ndani.
  rationale: Yakobo anatumia lugha ya utakaso yenye nguvu za kimaadili na huenda pia za kiibada. Kuhifadhi taswira kunaruhusu upana na mvutano huo kubaki bila kufungwa na tafsiri moja.
- issue: Maana ya δίψυχοι
  choice: “Enyi wenye nia mbili” katika matini kuu.
  alternative: “Enyi wenye nafsi mbili” au “enyi wenye moyo uliogawanyika.”
  rationale: Kigiriki kina taswira ya kuwa na “nafsi mbili,” yaani kugawanyika katika uaminifu wa ndani. “Wenye nia mbili” ni ya kueleweka na huhifadhi karipio, huku tanbihi ikitaja taswira halisi zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Amri za wingi na miito ya moja kwa moja zimehifadhiwa. Alama ya tanbihi imewekwa baada ya “wenye nia mbili,” ambako neno δίψυχοι linatokea.
