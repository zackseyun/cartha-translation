  text: εἰδότι οὖν καλὸν ποιεῖν καὶ μὴ ποιοῦντι, ἁμαρτία αὐτῷ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/017.yaml
  text: So[a], for the one who knows to do good and does not do it, it is sin for him.
translation:
  language: sw
  text: Kwa hiyo[a], mtu anayejua kutenda mema lakini hayatendi, kwake ni dhambi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Basi, yeyote anayejua mema ambayo anapaswa kuyatenda lakini hayatendi, kwake ni dhambi.”
    reason: Mbadala huu unaonyesha uwezekano wa kueleza participio ya Kigiriki kwa “yeyote” na kufanya wazi wazo la wajibu lililodokezwa katika kujua kutenda mema.
lexical_decisions:
- source_word: εἰδότι
  choice: mtu anayejua
  rationale: Kirai cha Kigiriki ni participio ya umoja katika hali ya dative inayotumiwa kama nomino; tafsiri hii inadumisha rejeleo la jumla kwa mtu mmoja na inaeleweka kwa kawaida katika Kiswahili.
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Huonyesha hitimisho linalotokana na mjadala uliotangulia; “Kwa hiyo” linaweka wazi uhusiano huo wa kimantiki.
- source_word: καλὸν ποιεῖν
  choice: kutenda mema
  rationale: καλόν hapa huhusu yaliyo mema au sahihi kimaadili. “Kutenda mema” ni usemi wa kawaida na mpana usioibana maana kwenye tendo moja tu.
- source_word: μὴ ποιοῦντι
  choice: lakini hayatendi
  rationale: Participio hii inatofautisha kujua yaliyo mema na kutoyafanya. “Lakini” huonyesha utofautishaji huo kwa Kiswahili cha kawaida, na “haya-” hurejelea “mema” bila kuongeza jambo jipya.
- source_word: ἁμαρτία
  choice: dhambi
  rationale: Nomino isiyo na kibainishi katika nafasi ya kiarifu inaweza kuwa na maana ya sifa; “ni dhambi” hueleza kwamba kutotenda huko ni dhambi, bila kulazimisha tafsiri ya “dhambi moja.”
- source_word: αὐτῷ
  choice: kwake huyo
  rationale: 'Dative hii ni ya rejeleo: kwa habari ya mtu huyo, kutotenda mema ni dhambi. “Kwake huyo” huhifadhi matumizi ya kibinafsi na msisitizo wa umoja.'
- source_word: ἐστιν
  choice: ni
  rationale: Kitenzi hiki huunganisha kitendo kilichoachwa na kiarifu “dhambi”; “ni” ni kiunganishi cha moja kwa moja katika Kiswahili.
theological_decisions:
- issue: Maana ya kutotenda mema yanayojulikana
  choice: Aya inasema kwamba mtu akijua kutenda mema lakini asiyatende, kwake ni dhambi, bila kuifungia kanuni hiyo katika mfumo maalumu wa mafundisho.
  alternative: Aya inaweza kueleweka kuwa inahusu tu muktadha wa karibu wa mipango ya kujivuna, au kuwa kanuni pana kuhusu dhambi ya kutotenda wajibu.
  rationale: Muktadha wa karibu unahusu mipango ya kiburi isiyomtegemea Mungu, lakini maneno ya aya ni ya jumla. Tafsiri inadumisha upana huo na mvutano kati ya matumizi ya kimuktadha na kanuni ya jumla.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Kutenda mema” ni cha kawaida na kinadumisha upeo mpana wa kimaadili; “kwake huyo” huhifadhi msisitizo wa dative ya Kigiriki.
