  text: μείζονα δὲ δίδωσιν χάριν· διὸ λέγει· Ὁ θεὸς ὑπερηφάνοις ἀντιτάσσεται ταπεινοῖς δὲ δίδωσιν χάριν.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/006.yaml
  text: But he gives greater grace. Therefore it says[a], “God opposes the proud, but gives grace to the humble.”
translation:
  language: sw
  text: Lakini yeye hutoa neema kubwa zaidi. Kwa hiyo husema[a], “Mungu huwapinga wenye kiburi, lakini huwapa wanyenyekevu neema.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa hiyo asema,” au, “Kwa hiyo Maandiko yasema.” Kiyunani hakitaji wazi mtendaji wa kitenzi “husema.”
    reason: alternative_reading
lexical_decisions:
- source_word: μείζονα
  choice: kubwa zaidi
  rationale: Huhifadhi nguvu ya ulinganisho ya kivumishi bila kuigeuza kuwa kiasi tu; kauli hii ni ya asili pamoja na “neema” katika Kiswahili.
- source_word: δίδωσιν χάριν
  choice: hutoa neema / huwapa neema
  rationale: Huhifadhi kitenzi cha kutoa na kurudia kwa wazo lilelile; katika sehemu ya pili, kiambishi cha yambwa “-wa-” huonyesha wazi kwamba wanyenyekevu ndio wapokeaji.
- source_word: διὸ
  choice: Kwa hiyo
  rationale: Huonyesha hitimisho linalotokana na kauli iliyotangulia kwa njia fupi na ya kawaida.
- source_word: λέγει
  choice: Maandiko yasema
  rationale: Ni fomula ya kawaida ya kunukuu Maandiko, lakini kwa kuwa Kiyunani hakitaji wazi mtendaji wa kitenzi, alama ya tanbihi huhifadhi uwezekano mwingine.
- source_word: ὑπερηφάνοις
  choice: wenye kiburi
  rationale: Hutoa maana ya watu wenye majivuno kwa lugha ya sasa na huunda ulinganifu wa wazi na “wanyenyekevu.”
- source_word: ἀντιτάσσεται
  choice: huwapinga
  rationale: Huonyesha upinzani wa Mungu ulio hai na wa moja kwa moja.
- source_word: ταπεινοῖς
  choice: wanyenyekevu
  rationale: Huwasilisha maana ya kimaadili katika muktadha bila kuifanya ihusu tu hali ya chini kijamii.
- source_word: δὲ
  choice: Lakini
  rationale: Huhifadhi nguvu ya ulinganisho mwanzoni mwa aya na ndani ya nukuu.
theological_decisions:
- issue: Mtendaji asiyeelezwa wazi wa λέγει katika fomula ya kunukuu
  choice: Kwa hiyo Maandiko yasema
  alternative: Kwa hiyo asema; Kwa hiyo yasema
  rationale: Muktadha unaonyesha nukuu ya Maandiko, hivyo “Maandiko yasema” ni wazi na ya kawaida kwa msomaji. Hata hivyo, tanbihi inaeleza kwamba Kiyunani huacha mtendaji bila kutajwa, ili tafsiri isifiche utata huo wa kimuundo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Yeye” katika sentensi ya kwanza imehifadhiwa ili kuonyesha kiima kilichomo katika kitenzi cha Kiyunani bila kukitambulisha zaidi. Mtindo wa “Maandiko yasema” ni wa kifasihi kwa kiasi lakini unaeleweka kwa urahisi katika usomaji wa Biblia.
