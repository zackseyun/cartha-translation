  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οἵτινες οὐκ ἐπίστασθε ⸀τὸ τῆς αὔριον ⸀ποία ἡ ζωὴ ὑμῶν· ἀτμὶς γάρ ⸀ἐστε ⸀ἡ πρὸς ὀλίγον φαινομένη, ⸀ἔπειτα καὶ ἀφανιζομένη·
base_translation:
  language: en
  yaml_path: translation/nt/james/004/014.yaml
  text: You do not know what tomorrow will bring[a]. What is your life? For you are a mist that appears for a little while and then vanishes.
translation:
  language: sw
  text: Ninyi hamjui yatakayotokea kesho. Maisha yenu ni nini? Kwa maana ninyi ni ukungu[a] unaoonekana kwa muda mfupi, kisha unatoweka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mvuke.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπίστασθε
  choice: hamjui
  rationale: Katika muktadha huu kitenzi kinaeleza kutokuwa na ujuzi kuhusu wakati ujao; “hamjui” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: τὸ τῆς αὔριον
  choice: yatakayotokea kesho
  rationale: Kirai hiki cha Kigiriki kimefupishwa na humaanisha mambo yanayohusu kesho. “Yatakayotokea kesho” kinaeleza maana hiyo kwa Kiswahili cha kawaida bila kuongeza uhakika usiomo katika matini.
- source_word: ποία ἡ ζωὴ ὑμῶν
  choice: Maisha yenu ni nini?
  rationale: Swali hili fupi linadumisha nguvu ya balagha ya Kigiriki, ambayo inauliza kuhusu hali au asili ya maisha yao.
- source_word: ἀτμὶς
  choice: ukungu
  rationale: “Ukungu” ni taswira inayoeleweka ya kitu kinachoonekana kwa muda mfupi kisha kutoweka. “Mvuke” pia ni tafsiri halali na imehifadhiwa katika tanbihi.
- source_word: πρὸς ὀλίγον
  choice: kwa muda mfupi
  rationale: Kirai hiki kinaonyesha muda mfupi; tafsiri hii ni ya asili na sahihi katika Kiswahili.
- source_word: φαινομένη
  choice: unaoonekana
  rationale: Neno hili linaeleza kuonekana kwa muda kwa ukungu na linadumisha taswira ya matini.
- source_word: ἔπειτα καὶ ἀφανιζομένη
  choice: kisha unatoweka
  rationale: “Kisha” huhifadhi mfuatano wa matukio, na “unatoweka” huwasilisha kwa uwazi kutokuonekana tena.
theological_decisions:
- issue: Taswira ya maisha ya binadamu kuwa ya muda mfupi
  choice: Kudumisha taswira ya ukungu kama maelezo ya kib Balagha kuhusu ufupi na kutotabirika kwa maisha ya binadamu.
  alternative: Kutafsiri kwa ufafanuzi kuwa “maisha yenu ni ya muda mfupi.”
  rationale: Taswira yenyewe inasisitiza mipaka ya binadamu katika kupanga mambo ya kesho bila kuingiza madai mengine ya kimafundisho kuhusu kifo au hukumu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo mfupi wa swali la balagha na taswira ya awali vimehifadhiwa.
