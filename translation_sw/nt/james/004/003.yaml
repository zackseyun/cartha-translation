  text: αἰτεῖτε καὶ οὐ λαμβάνετε, διότι κακῶς αἰτεῖσθε, ἵνα ἐν ταῖς ἡδοναῖς ὑμῶν δαπανήσητε.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/003.yaml
  text: You ask and do not receive[a], because you ask wrongly[b], so that you may spend it on your pleasures.
translation:
  language: sw
  text: Mnaomba lakini hampokei, kwa sababu mnaomba vibaya[a], ili mvitumie kwa anasa zenu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mnaomba kwa nia mbaya.”
    reason: lexical_alternative
  - marker: b
    text: Au, “katika anasa zenu”; “anasa” hapa zinaweza pia kumaanisha tamaa au hamu za kujifurahisha kupita kiasi.
    reason: lexical_alternative
lexical_decisions:
- source_word: αἰτεῖτε
  choice: mnaomba
  rationale: Kitenzi hiki ni cha wakati wa sasa, nafsi ya pili wingi. ‘Mnaomba’ ni tafsiri ya kawaida na ya moja kwa moja, huku mlengwa wa ombi akiachwa bila kutajwa kama ilivyo katika Kigiriki.
- source_word: οὐ λαμβάνετε
  choice: hampokei
  rationale: ‘Hampokei’ inadumisha uhusiano wa moja kwa moja kati ya kuomba na kupokea, kwa lugha ya kawaida yenye hadhi.
- source_word: διότι
  choice: kwa sababu
  rationale: Kiunganishi hiki kinaonyesha sababu ya kutopokea kwao.
- source_word: κακῶς αἰτεῖσθε
  choice: mnaomba vibaya
  rationale: ‘Vibaya’ huhifadhi maana pana ya κακῶς bila kuifupisha kuwa nia pekee; kishazi kinachofuata kinaeleza ubaya wa kusudi lao.
- source_word: ἵνα
  choice: ili
  rationale: ‘Ili’ huonyesha kusudi linalotolewa katika sentensi ya Kigiriki.
- source_word: δαπανήσητε
  choice: mvitumie
  rationale: Kitenzi kina maana ya kutumia au kugharimia. ‘Mvitumie’ ni cha kawaida katika Kiswahili na hakiongezi wazo kali zaidi la kufuja, huku kiambishi cha yambwa kikirejelea vitu vinavyoombwa.
- source_word: ἐν ταῖς ἡδοναῖς ὑμῶν
  choice: kwa anasa zenu
  rationale: Katika muktadha huu, ‘kwa anasa zenu’ huwasilisha matumizi yanayoelekezwa kwenye raha au tamaa za kujifurahisha; ‘anasa’ pia hubeba kidokezo hasi kinacholingana na muktadha.
theological_decisions:
- issue: Kama kutaja wazi kwamba maombi yanaelekezwa kwa Mungu
  choice: 'Mlengwa anaachwa bila kutajwa: ‘Mnaomba lakini hampokei’'
  alternative: Mnamwomba Mungu lakini hampokei
  rationale: Muktadha unaashiria kumwomba Mungu, lakini mstari wa Kigiriki haumtajii wazi. Kumwacha mlengwa bila kutajwa kunahifadhi muundo na kiwango cha uwazi cha chanzo.
- issue: Kama κακῶς ifafanuliwe moja kwa moja kuwa nia mbaya
  choice: mnaomba vibaya
  alternative: mnaomba kwa nia mbaya
  rationale: κακῶς ina maana pana ya kufanya jambo vibaya. Kishazi cha kusudi kinachofuata kinaonyesha nia inayofanya kuomba huko kuwe kubaya, hivyo tafsiri kuu haipaswi kuibana maana mapema.
- issue: Kiwango cha hukumu katika δαπανήσητε
  choice: mvitumie
  alternative: mvifuje
  rationale: δaπανήσητε yenyewe inaweza kumaanisha kutumia au kugharimia. Muktadha tayari unakemea matumizi hayo, kwa hiyo ‘mvitumie’ huepuka kuongeza ukali usiolazimishwa na kitenzi chenyewe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inadumisha urudiaji wa ‘mnaomba,’ sababu inayotolewa na διότι, na kusudi la ἵνα. Lugha ni rahisi kueleweka bila kumtaja Mungu mahali ambapo chanzo hakimtaji wazi.
