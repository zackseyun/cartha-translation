base_translation:
  language: en
  yaml_path: translation/nt/james/005/020.yaml
  text: let him know that whoever turns a sinner back from the error of his way will save his soul from death and will cover a multitude of sins[a][b].
translation:
  language: sw
  text: na ajue kwamba yeyote anayemrudisha mwenye dhambi kutoka katika upotovu wa njia yake ataokoa nafsi yake[a][b] kutoka mautini na atafunika wingi wa dhambi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ataokoa uhai wake kutoka mautini.” Neno la Kigiriki linaweza kumaanisha “nafsi” au “uhai.”
    reason: lexical_alternative
  - marker: b
    text: Kiwakilishi “yake” huenda kikamrejelea mwenye dhambi anayerudishwa; wengine hukielewa kuwa kinamrejelea anayemrudisha.
    reason: alternative_reading
lexical_decisions:
- source_word: γινωσκέτω
  choice: na ajue
  rationale: Amri ya nafsi ya tatu umoja imewasilishwa kama himizo la kawaida na lenye nguvu katika Kiswahili.
- source_word: ὁ ἐπιστρέψας
  choice: yeyote anayemrudisha
  rationale: Kirai cha kisifa chenye kiambishi bainishi kina maana ya jumla; “kumrudisha” hudokeza kumrejesha mtu aliyepotoka bila kuingiza maana ya kiufundi ya baadaye.
- source_word: ἁμαρτωλὸν
  choice: mwenye dhambi
  rationale: Nomino isiyo na kibainishi inatumiwa kijumla; “mwenye dhambi” ni Kiswahili cha kawaida na chenye heshima.
- source_word: ἐκ πλάνης ὁδοῦ αὐτοῦ
  choice: kutoka katika upotovu wa njia yake
  rationale: “Upotovu” huhifadhi maana za kukosea na kupotea, huku “njia” ikihifadhi taswira ya mwenendo wa maisha.
- source_word: σώσει
  choice: ataiokoa
  rationale: Kitenzi cha wakati ujao kimehifadhiwa; “kuokoa” hubeba maana ya kawaida na uzito wa kifungu.
- source_word: ψυχὴν αὐτοῦ
  choice: nafsi yake
  rationale: “Nafsi” huhifadhi upana wa ψυχή, ambayo pia inaweza kumaanisha uhai; “yake” huacha rejeo la kiwakilishi bila kubainishwa.
- source_word: ἐκ θανάτου
  choice: kutoka mautini
  rationale: Huhifadhi neno la jumla “mauti” bila kulifafanua kuwa kifo cha kimwili au cha kiroho pekee.
- source_word: καλύψει
  choice: atafunika
  rationale: Tafsiri ya moja kwa moja huhifadhi nahau ya kibiblia kuhusu dhambi kufunikwa.
- source_word: πλῆθος ἁμαρτιῶν
  choice: dhambi nyingi
  rationale: Huwasilisha kwa Kiswahili cha asili wingi mkubwa unaomaanishwa na πλῆθος bila kutumia tamko zito lisilo la kawaida.
theological_decisions:
- issue: Rejeo la αὐτοῦ katika ψυχὴν αὐτοῦ
  choice: Kiwakilishi kimetafsiriwa “yake” bila kubainisha mhusika katika matini kuu.
  alternative: Huenda ikawa nafsi ya mwenye dhambi anayerudishwa, au nafsi ya anayemrudisha.
  rationale: Sarufi ya Kigiriki inaruhusu rejeo zote mbili, ingawa kurejelea mwenye dhambi kunaelekea zaidi; tanbihi huhifadhi utata huo.
- issue: Maana ya ψυχή na θάνατος
  choice: “nafsi” na “mauti” zimehifadhiwa kwa maana pana.
  alternative: “uhai wake kutoka mautini,” au ufafanuzi wa mauti kuwa ya kiroho.
  rationale: Kifungu kinaweza kuhusisha kuokoa uhai, wokovu wa kiroho, au yote mawili; tafsiri haipaswi kukifungia katika mfumo mmoja wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo unahifadhi taswira za “njia,” “mauti,” na “kufunika,” huku “dhambi nyingi” ikitoa maana ya πλῆθος kwa lugha inayoeleweka kwa urahisi.
