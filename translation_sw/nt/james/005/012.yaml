  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Πρὸ πάντων δέ, ἀδελφοί μου, μὴ ὀμνύετε, μήτε τὸν οὐρανὸν μήτε τὴν γῆν μήτε ἄλλον τινὰ ὅρκον· ἤτω δὲ ὑμῶν τὸ Ναὶ ναὶ καὶ τὸ Οὒ οὔ, ἵνα μὴ ⸂ὑπὸ κρίσιν⸃ πέσητε.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/012.yaml
  text: But above all[a], my brothers, do not swear, either by heaven or by earth or by any other oath. Instead, let your yes be yes and your no, no[b], so that you may not fall under judgment.
translation:
  language: sw
  text: Lakini, zaidi ya yote, ndugu zangu,[a] msiape—wala kwa mbingu, wala kwa dunia, wala msiape kwa kiapo kingine chochote. Badala yake, “Ndiyo” yenu iwe ndiyo, na “Hapana” yenu iwe hapana, ili msije mkaanguka chini ya hukumu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki lililotafsiriwa “ndugu” lina umbo la kiume la wingi, lakini katika anwani kama hii kwa kawaida huwahusu waumini wote, wanaume na wanawake.
    reason: lexical_alternative
  - marker: b
    text: Au “ili msije mkaanguka chini ya hukumu ya adhabu.”
    reason: alternative_reading
lexical_decisions:
- source_word: Πρὸ πάντων
  choice: zaidi ya yote
  rationale: Ni usemi wa kawaida wa Kiswahili unaoweka msisitizo juu ya umuhimu mkuu wa himizo hili bila kulifanya kuwa mpangilio wa wakati.
- source_word: ἀδελφοί μου
  choice: ndugu zangu
  rationale: Neno la Kiswahili “ndugu” ni la kawaida, lenye hadhi, na halina jinsia kisarufi; linaweza kurejelea waumini wote wanaohutubiwa bila kuongeza maneno yasiyokuwamo katika Kigiriki.
- source_word: μὴ ὀμνύετε
  choice: msiape
  rationale: Kitenzi “kuapa” kinaonyesha wazi kufanya kiapo, si kutumia lugha chafu, na hali ya amri inahifadhi katazo la jumla.
- source_word: μήτε τὸν οὐρανὸν μήτε τὴν γῆν μήτε ἄλλον τινὰ ὅρκον
  choice: wala kwa mbingu, wala kwa dunia, wala kwa kiapo kingine chochote
  rationale: Urudiaji wa “wala” unahifadhi mfuatano wenye msisitizo wa Kigiriki, huku “kwa” ikieleza kwa kawaida kile ambacho mtu anaapia.
- source_word: ἤτω δὲ ὑμῶν τὸ Ναὶ ναὶ καὶ τὸ Οὒ οὔ
  choice: Badala yake, “Ndiyo” yenu iwe ndiyo, na “Hapana” yenu iwe hapana
  rationale: Tafsiri hii inadumisha utofautishaji wa δέ na mtindo mfupi wa kimethali unaosisitiza kusema kweli kwa uwazi.
- source_word: ἵνα μὴ ὑπὸ κρίσιν πέσητε
  choice: ili msije mkaanguka chini ya hukumu
  rationale: “Chini ya hukumu” hufuata picha ya ὑπό na “mkaanguka” huhifadhi sitiari ya πέσητε; “hukumu” ni pana kuliko “adhabu” au “hatia ya kuhukumiwa.”
theological_decisions:
- issue: 'Maana ya κρίσις: hukumu au kuhukumiwa/adhabu'
  choice: hukumu
  alternative: kuhukumiwa
  rationale: κρίσις inaweza kumaanisha tendo au hali ya hukumu kwa upana, na hapa hailazimishi maana nyembamba ya kuhukumiwa kwa adhabu. Neno “hukumu” linahifadhi upana huo.
- issue: Wanaohusika katika ἀδελφοί
  choice: ndugu zangu
  alternative: ndugu zangu wa kiume na wa kike
  rationale: Katika Kiswahili “ndugu” halibainishi jinsia na kwa kawaida linaweza kulihutubia kundi lote. Kwa hiyo linawakilisha kwa usahihi umbo la anwani na uwezekano mkubwa wa rejeo kwa jumuiya nzima bila ufafanuzi mzito ndani ya mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa moja kwa moja na unaosomeka kwa urahisi; urudiaji katika katazo na katika “ndiyo/hapana” umehifadhiwa kwa ajili ya msisitizo wa kifungu.
