  text: ἰδοὺ μακαρίζομεν τοὺς ⸀ὑπομείναντας· τὴν ὑπομονὴν Ἰὼβ ἠκούσατε, καὶ τὸ τέλος κυρίου ⸀εἴδετε, ὅτι πολύσπλαγχνός ἐστιν ⸂ὁ κύριος⸃ καὶ οἰκτίρμων.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/011.yaml
  text: Behold, we count those who have endured as blessed. You have heard of Job’s endurance, and you have seen the Lord’s outcome, that the Lord is very compassionate and merciful.
translation:
  language: sw
  text: Tazama, tunawaita wenye heri wale waliovumilia. Mmesikia kuhusu uvumilivu wa Ayubu, na mmeona matokeo ambayo Bwana alileta[a]—kwamba Bwana ni mwenye huruma nyingi na mwenye rehema.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “mwisho wa Bwana” au “matokeo ya Bwana.” Neno la Kigiriki linaweza kurejelea mwisho au matokeo yanayohusishwa na Bwana.'
    reason: Huhifadhi utata wa τὸ τέλος κυρίου bila kuongeza dhana ya ‘jinsi’ au kufungamanisha neno hilo na ‘hatima.’
lexical_decisions:
- source_word: μακαρίζομεν
  choice: tunawaita wenye heri
  rationale: Huwasilisha kitendo cha kuwatambua au kuwatangaza watu kuwa wenye heri, badala ya kudokeza tu kuwa tunawasifu.
- source_word: ὑπομείναντας / ὑπομονὴν
  choice: waliovumilia / uvumilivu
  rationale: Hudumisha uhusiano wa maneno katika Kigiriki na wazo la kustahimili kwa uthabiti chini ya mateso.
- source_word: τὸ τέλος κυρίου
  choice: jinsi Bwana alivyomaliza mambo
  rationale: τέλος hapa inaweza kumaanisha mwisho, matokeo, au kile Bwana alichokamilisha; usemi huu wa kawaida unaelekeza kwenye hitimisho lililoletwa na Bwana bila kulibadili kuwa 'kusudi'.
- source_word: πολύσπλαγχνος
  choice: mwingi wa huruma
  rationale: Hutoa maana ya huruma nyingi na ya ndani kwa Kiswahili cha sasa chenye heshima.
- source_word: οἰκτίρμων
  choice: mwenye rehema
  rationale: Hutofautisha neno hili na πολύσπλαγχνος huku likihifadhi jozi ya sifa za Bwana.
theological_decisions:
- issue: Maana ya τὸ τέλος κυρίου
  choice: jinsi Bwana alivyomaliza mambo
  alternative: matokeo ya Bwana; kusudi la Bwana; mwisho wa Bwana
  rationale: Muktadha wa Ayubu unaelekea kwenye mwisho au matokeo ambayo Bwana alileta. Tafsiri haichagui 'kusudi,' ambalo linaweza kuondoa utata halisi wa τέλος, wala 'mwisho wa Bwana,' ambao unaweza kueleweka vibaya kana kwamba ni mwisho uliompata Bwana.
- issue: Mhusika wa κυρίου katika kifungu cha Ayubu
  choice: Bwana
  alternative: Yahwe
  rationale: Cheo hicho kinahifadhiwa kama kilivyo katika maandishi ya Kigiriki na kinaendana kwa kawaida na rejeo la Mungu katika simulizi la Ayubu bila kuingiza jina ambalo halipo wazi katika mstari wa Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Tazama” huhifadhi msisitizo wa ἰδού; “wenye heri” ni ya kibiblia lakini bado inaeleweka kwa wasomaji wa kawaida. Alama ya [a] imewekwa katika matini kuu.
