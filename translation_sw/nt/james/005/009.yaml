  text: μὴ στενάζετε, ⸂ἀδελφοί, κατ’ ἀλλήλων⸃, ἵνα μὴ κριθῆτε· ἰδοὺ ὁ κριτὴς πρὸ τῶν θυρῶν ἕστηκεν.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/009.yaml
  text: Do not grumble against one another[a], brothers, so that you may not be judged. Look, the Judge is standing at the doors.
translation:
  language: sw
  text: Ndugu[a], msinung'unikiane, ili msije mkahukumiwa. Tazama, Mwamuzi amesimama milangoni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno “Ndugu” limetafsiri kutoka neno la Kigiriki adelphoi, ambalo linaweza kurejelea kusanyiko la waamini kwa pamoja, wakiwemo wanawake, kutegemea muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: στενάζετε
  choice: msinung’unikiane
  rationale: Katika muktadha wa κατ’ ἀλλήλων, kitenzi hiki kinaonyesha manung’uniko yenye chuki au kinyongo yanayoelekezwa kwa waamini wengine, si kuugua moyoni tu. Umbo la kutendeana linaonyesha wazi kuwa tendo hilo linafanywa dhidi ya mtu na mwenzake.
- source_word: ἀδελφοί
  choice: Ndugu
  rationale: “Ndugu” ni mwito wa kawaida na wenye heshima katika Kiswahili kwa waamini wenzao na unaweza kulihusu kusanyiko zima, wakiwemo wanawake, kulingana na muktadha.
- source_word: κατ’ ἀλλήλων
  choice: -an- katika “msinung’unikiane”
  rationale: κατά pamoja na ἀλλήλων huonyesha uelekeo wa upinzani kati ya mtu na mwenzake. Kiswahili cha asili huwasilisha maana hii kwa umbo la kutendeana katika kitenzi.
- source_word: κριθῆτε
  choice: msije mkahukumiwa
  rationale: Huhifadhi maana ya kauli tendwa na onyo la ἵνα μή bila kuifanya hukumu iwe lazima ni adhabu au kuangamizwa.
- source_word: κριτὴς
  choice: Mwamuzi
  rationale: Neno hili linamtaja yule anayetoa hukumu. Herufi kubwa inaonyesha matumizi yake kama jina la cheo katika muktadha huu bila kutaja wazi kama ni Mungu au Bwana/Christo.
- source_word: πρὸ τῶν θυρῶν
  choice: milangoni
  rationale: Huhifadhi wingi wa θυρῶν kwa njia fupi na ya asili katika Kiswahili, huku ikitoa picha ya ukaribu na tukio lililo karibu sana.
- source_word: ἕστηκεν
  choice: amesimama
  rationale: Wakati timilifu wa Kigiriki unaonyesha hali ya sasa iliyotokana na tendo lililokamilika; “amesimama” huwasilisha hali hiyo ya sasa na utayari kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Anayerejelewa kwa jina “Mwamuzi”
  choice: Kuacha rejeo likiwa “Mwamuzi,” likidokeza mwamuzi wa kimungu wa hukumu ya mwisho
  alternative: Kumtaja moja kwa moja kuwa Mungu au Bwana/Christo
  rationale: Muktadha wa Yakobo unaelekea kwa hukumu inayokaribia wakati wa kuja kwa Bwana, lakini Kigiriki hakumtaji Mwamuzi kwa jina katika aya hii. Tafsiri inadumisha nguvu hiyo ya kiteolojia bila kutatua zaidi utambulisho wake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi na chenye hadhi. “Msinung’unikiane” ni la asili na huunganisha manung’uniko na mwelekeo wake dhidi ya mtu na mwenzake. “Milangoni” huhifadhi wingi wa maandishi ya Kigiriki bila kufanya sentensi kuwa nzito.
