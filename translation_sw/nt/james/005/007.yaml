id: JAS.5.7
reference: James 5:7
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Μακροθυμήσατε οὖν, ἀδελφοί, ἕως τῆς παρουσίας τοῦ κυρίου. ἰδοὺ ὁ γεωργὸς ἐκδέχεται τὸν τίμιον καρπὸν τῆς γῆς, μακροθυμῶν ἐπ’ ⸀αὐτῷ ἕως ⸀λάβῃ πρόϊμον καὶ ὄψιμον.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/007.yaml
  text: Be patient[a], therefore, brothers, until the coming of the Lord. Look, the farmer waits for the precious fruit of the earth[b], being patient over it until it receives the early and late rains.
translation:
  language: sw
  text: Kwa hiyo, vumilieni, ndugu[a], hadi kuja kwa Bwana.[b] Tazama, mkulima hulingojea zao lenye thamani la ardhi, akiwa na subira kwa ajili yake mpaka lipokee mvua za mwanzo na za mwisho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki ni “ndugu” katika umbo la kiume, lakini mara nyingi hutumiwa kuiita jumuiya nzima ya waamini, wanaume na wanawake.
    reason: alternative_reading
  - marker: b
    text: Neno linalotafsiriwa “kuja” linaweza pia kumaanisha “kuwapo”; hapa huenda linamaanisha kufika kwa Bwana wakati ujao.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μακροθυμήσατε
  choice: vumilieni
  rationale: Amri hii inataka subira ya kudumu katika hali ngumu. “Vumilieni” ni ya kawaida na pia huruhusu kurudiwa kwa mzizi huo katika μακροθυμῶν.
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Inaonyesha hitimisho linalotokana na maelezo yaliyotangulia.
- source_word: ἀδελφοί
  choice: ndugu
  rationale: “Ndugu” ni mwito wa kawaida wa Kiswahili unaoweza kutumiwa kwa jumuiya nzima, huku tanbihi ikifafanua umbo la Kigiriki.
- source_word: παρουσίας
  choice: kuja
  rationale: Katika muktadha huu wa matarajio ya wakati ujao, “kuja” ni ya asili kuliko “kuwapo,” ingawa maana ya uwepo inawezekana kimsamiati.
- source_word: κυρίου
  choice: Bwana
  rationale: Ni tafsiri ya kawaida ya cheo κύριος.
- source_word: ἰδοὺ
  choice: Tazama
  rationale: Inadumisha nguvu ya neno la kuvuta fikira kwa lugha yenye heshima na inayoeleweka.
- source_word: γεωργὸς
  choice: mkulima
  rationale: Ni neno la kawaida kwa mtu anayelima ardhi.
- source_word: ἐκδέχεται
  choice: hungojea
  rationale: Huonyesha kungoja kunakoendelea kwa matarajio.
- source_word: τίμιον καρπὸν τῆς γῆς
  choice: mazao yenye thamani ya ardhi
  rationale: “Mazao” ni ya kawaida katika mfano wa mkulima, na “yenye thamani” hudumisha wazo la τίμιον bila kudokeza tu thamani ya fedha.
- source_word: μακροθυμῶν ἐπ’ αὐτῷ
  choice: akiyavumilia
  rationale: Hudumisha mwangwi wa μακροθυμ- na kueleza subira ya mkulima kuhusu mazao kwa Kiswahili cha asili.
- source_word: ἕως λάβῃ πρόϊμον καὶ ὄψιμον
  choice: mpaka yapokee mvua za mwanzo na za mwisho
  rationale: Kitenzi cha umoja kinaweza kuwa na καρπός kama kiima, hivyo “yapokee” hufuata “mazao”; “mvua” imeelezwa wazi kwa sababu vivumishi hivyo hutaja mvua za majira kwa ufupi.
theological_decisions:
- issue: Mwito ἀδελφοί una jinsia ya kiume kisarufi
  choice: ndugu
  alternative: ndugu wanaume na wanawake
  rationale: Kiswahili “ndugu” ni la kawaida na linaweza kujumuisha waamini wote bila kuingiza maelezo marefu katika matini; tanbihi huhifadhi taarifa ya umbo la Kigiriki.
- issue: παρουσία τοῦ κυρίου
  choice: kuja kwa Bwana
  alternative: kuwapo kwa Bwana
  rationale: Muktadha unaelekea kwenye kufika kwa Bwana wakati ujao, lakini tanbihi huhifadhi uwezekano wa kimsamiati wa “kuwapo.”
- issue: Kiima cha λάβῃ katika ushahidi tofauti wa matini
  choice: mazao yapokee mvua
  alternative: mkulima apokee mvua
  rationale: Usomaji λάβῃ unaruhusu καρπός kuwa kiima kinachopokea mvua. Tafsiri hii haibadili kiima kuwa mkulima na inafuata SBLGNT iliyotolewa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Kwa hiyo” huunganisha hoja na muktadha uliotangulia; “Tazama” hudumisha mwito wa kuzingatia mfano. Matini inatumia “mazao” badala ya “matunda” kwa uhalisia wa kilimo, na marudio ya “vumilieni/akiyavumilia” yanahifadhi mwangwi wa Kigiriki.
