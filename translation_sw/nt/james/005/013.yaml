id: JAS.5.13
reference: James 5:13
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Κακοπαθεῖ τις ἐν ὑμῖν; προσευχέσθω· εὐθυμεῖ τις; ψαλλέτω.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/013.yaml
  text: Is anyone among you suffering? Let him pray[a]. Is anyone cheerful? Let him sing praise.
translation:
  language: sw
  text: Je, kuna yeyote miongoni mwenu anayeteseka? Na aombe. Je, kuna yeyote mwenye moyo wa furaha? Na aimbe sifa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “aimbe zaburi”; kitenzi cha Kiyunani kinaweza kumaanisha hasa kuimba zaburi au, kwa upana zaidi, kuimba sifa.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κακοπαθεῖ
  choice: anayeteseka
  rationale: Kitenzi κακοπαθέω humaanisha kupitia mateso, shida au taabu. “Anayeteseka” ni usemi wa kawaida unaobaki mpana bila kuufanya mstari uzungumzie ugonjwa au mateso ya kidini pekee.
- source_word: τις
  choice: yeyote
  rationale: Kiwakilishi hiki kisichotaja mtu maalumu kina maana ya mtu yeyote mmoja katika jumuiya; “yeyote” huwasilisha maana hiyo kwa Kiswahili cha kawaida bila kuweka kikomo cha jinsia.
- source_word: ἐν ὑμῖν
  choice: miongoni mwenu
  rationale: Kirai hiki humweka mtu anayezungumziwa ndani ya jumuiya inayoandikiwa. “Miongoni mwenu” ni tafsiri ya moja kwa moja na ya asili.
- source_word: προσευχέσθω
  choice: na aombe
  rationale: Amri ya nafsi ya tatu umoja inamhimiza mtu huyo kuendelea au kujihusisha katika sala. Muundo “na aombe” huhifadhi nguvu ya himizo na umoja kwa Kiswahili fasaha.
- source_word: εὐθυμεῖ
  choice: mwenye moyo wa furaha
  rationale: εὐθυμέω humaanisha kuwa na moyo mzuri, kuwa na uchangamfu au kuwa katika hali njema ya moyo. “Mwenye moyo wa furaha” ni ya asili na hudumisha utofautishaji na anayeteseka.
- source_word: ψαλλέτω
  choice: na aimbe sifa
  rationale: Katika muktadha huu ψάλλω huelekeza kwenye sifa inayoimbwa kwa Mungu. “Na aimbe sifa” huwasilisha maana ya ibada kwa uwazi bila kuifunga kwa zaburi za kikanoni pekee, ingawa maana hiyo nyembamba inawezekana.
theological_decisions:
- issue: Himizo la umoja lisilowekewa jinsia
  choice: Kutumia “yeyote” pamoja na vitenzi vya umoja “aombe” na “aimbe”
  alternative: Kutumia wingi au kumtaja “mtu huyo” kila mara
  rationale: Kiyunani kina τις na amri za nafsi ya tatu umoja. Kiswahili kinaweza kuhifadhi umoja na maana ya jumla bila kutumia kiwakilishi cha jinsia, hivyo muundo huu ni sahihi na wa asili.
- issue: Maana ya ψαλλέτω
  choice: aimbe sifa
  alternative: aimbe zaburi
  rationale: Neno hilo linaweza kumaanisha kuimba zaburi au, kwa upana zaidi, kuimba sifa. Muktadha wa himizo unaunga mkono maana pana ya sifa kwa Mungu; tanbihi huhifadhi uwezekano wa maana nyembamba bila kuingiza agizo maalumu la kiliturujia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Maswali mawili sambamba na mahimizo mafupi yanahifadhi muundo wa Kiyunani. Alama ya tanbihi imewekwa baada ya “sifa,” neno ambalo tanbihi inalifafanua.
