id: JAS.5.18
reference: James 5:18
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ πάλιν προσηύξατο, καὶ ὁ οὐρανὸς ⸂ὑετὸν ἔδωκεν⸃ καὶ ἡ γῆ ἐβλάστησεν τὸν καρπὸν αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/018.yaml
  text: And he prayed again[a], and the sky gave rain[b], and the earth produced its fruit.
translation:
  language: sw
  text: Akaomba tena, anga ikatoa mvua, na ardhi ikazaa mazao yake.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάλιν
  choice: tena
  rationale: Kielezi hiki huonyesha kurudiwa kwa tendo; “tena” ni tafsiri fupi na ya kawaida, ikirejelea ombi jingine la Eliya.
- source_word: προσηύξατο
  choice: akaomba
  rationale: Kitenzi hiki humaanisha kuomba; hakuna msingi wa kuongeza “kwa bidii” katika mstari huu.
- source_word: ὁ οὐρανὸς
  choice: anga
  rationale: Katika muktadha wa hali ya hewa, οὐρανός humaanisha anga linalotoa mvua, si lazima makao ya mbinguni.
- source_word: ὑετὸν ἔδωκεν
  choice: ikatoa mvua
  rationale: Huhifadhi taswira ya Kigiriki ya anga ‘kutoa’ mvua na ni usemi wa asili katika Kiswahili.
- source_word: ἡ γῆ
  choice: ardhi
  rationale: γῆ inaweza kumaanisha dunia, nchi, au udongo; “ardhi” inafaa hapa kwa mazingira ya kilimo na inalingana vizuri na “anga.”
- source_word: ἐβλάστησεν
  choice: ikazaa
  rationale: Kitenzi hiki huonyesha kuota au kutokeza mimea; pamoja na καρπός, “ikazaa” huwasilisha kwa kawaida kutokezwa kwa mavuno.
- source_word: τὸν καρπὸν αὐτῆς
  choice: mazao yake
  rationale: Katika muktadha huu καρπός hurejelea mazao ya kilimo kwa upana; “mazao yake” ni wazi na ya kawaida kuliko tafsiri ya neno kwa neno “tunda lake.”
theological_decisions:
- issue: Ombi la Eliya na mwitikio wa Mungu
  choice: Kueleza matokeo yanayoonekana ya ombi bila kuongeza wazi kwamba Mungu ndiye aliyetuma mvua
  alternative: Kusema moja kwa moja, “Mungu akatuma mvua”
  rationale: Muktadha unaonyesha mwitikio wa Mungu, lakini maneno ya mstari huu yanasema anga lilitoa mvua na ardhi ikazaa. Tafsiri inahifadhi namna ya usemi wa chanzo bila kuongeza maelezo ya kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi wa kibiblia lakini kinachoeleweka kwa wasomaji wa kawaida. “Kisha” huunganisha tendo hili na ombi la awali; “nayo” huhifadhi uhusiano wa matokeo bila kufanya sentensi kuwa nzito.
