  text: Ἠλίας ἄνθρωπος ἦν ὁμοιοπαθὴς ἡμῖν, καὶ προσευχῇ προσηύξατο τοῦ μὴ βρέξαι, καὶ οὐκ ἔβρεξεν ἐπὶ τῆς γῆς ἐνιαυτοὺς τρεῖς καὶ μῆνας ἕξ·
base_translation:
  language: en
  yaml_path: translation/nt/james/005/017.yaml
  text: Elijah was a man with a nature like ours[a], and he prayed earnestly that it would not rain, and it did not rain on the land for three years and six months.
translation:
  language: sw
  text: Eliya alikuwa mwanadamu mwenye hali ya kibinadamu kama yetu[a]. Aliomba kwa bidii kwamba mvua isinyeshe, nayo haikunyesha katika nchi kwa miaka mitatu na miezi sita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Eliya alikuwa mwanadamu kama sisi,” au “Eliya alikuwa na hisia kama zetu.”
    reason: Njia mbadala za kutafsiri ὁμοιοπαθής, ambalo linaweza kuonyesha kushiriki hali ya kibinadamu kwa upana au hisia zinazofanana.
lexical_decisions:
- source_word: Ἠλίας
  choice: Eliya
  rationale: Hili ndilo umbo la kawaida la jina la nabii huyo katika Biblia za Kiswahili.
- source_word: ἄνθρωπος
  choice: mwanadamu
  rationale: Neno hili linamwonyesha Eliya kuwa binadamu wa kawaida; “mwanadamu” ni la asili na lenye heshima katika Kiswahili.
- source_word: ὁμοιοπαθὴς ἡμῖν
  choice: mwenye hali kama yetu
  rationale: Kauli hii inadumisha maana pana ya kushiriki hali na uzoefu uleule wa kibinadamu bila kuibana kwenye hisia au tamaa pekee.
- source_word: προσευχῇ προσηύξατο
  choice: aliomba kwa bidii
  rationale: Muundo wa maneno yenye mzizi mmoja unasisitiza tendo la kuomba; “kwa bidii” huwasilisha mkazo huo kwa Kiswahili cha kawaida.
- source_word: τοῦ μὴ βρέξαι
  choice: kwamba mvua isinyeshe
  rationale: Hueleza jambo lililoombwa kwa uwazi na kwa muundo wa kawaida wa Kiswahili.
- source_word: οὐκ ἔβρεξεν
  choice: haikunyesha
  rationale: Kitenzi hiki kinaendeleza kwa kawaida kiima “mvua” kilichotajwa katika kishazi kilichotangulia.
- source_word: ἐπὶ τῆς γῆς
  choice: katika nchi
  rationale: Katika muktadha wa simulizi la Eliya, γῆ inaelekea kumaanisha nchi iliyokumbwa na ukame kuliko dunia nzima.
- source_word: ἐνιαυτοὺς τρεῖς καὶ μῆνας ἕξ
  choice: kwa miaka mitatu na miezi sita
  rationale: “Kwa” huonyesha kwa kawaida muda ambao ukame uliendelea.
theological_decisions:
- issue: Maana ya ὁμοιοπαθὴς kuhusu ubinadamu wa Eliya
  choice: Eliya alikuwa mwanadamu mwenye hali kama yetu.
  alternative: Eliya alikuwa mwanadamu mwenye hisia au tamaa kama zetu.
  rationale: Maana iliyochaguliwa inahifadhi wazo pana kwamba Eliya alishiriki hali ya kawaida ya kibinadamu pamoja na wasomaji, bila kuondoa uwezekano wa kwamba hisia na maelekeo ya kibinadamu yanahusika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Muundo umegawanywa katika sentensi mbili ili usomeke kwa ufasaha bila kupoteza uhusiano wa mawazo katika Kigiriki.
