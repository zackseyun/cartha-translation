id: JAS.5.16
reference: James 5:16
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐξομολογεῖσθε ⸀οὖν ἀλλήλοις ⸂τὰς ἁμαρτίας⸃ καὶ ⸀εὔχεσθε ὑπὲρ ἀλλήλων, ὅπως ἰαθῆτε. πολὺ ἰσχύει δέησις δικαίου ἐνεργουμένη.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/016.yaml
  text: Therefore[a], confess your sins to one another and pray for one another, so that you may be healed. The prayer of a righteous person is very powerful as it is at work.
translation:
  language: sw
  text: Kwa hiyo, ungameni dhambi zenu ninyi kwa ninyi, na mwoombeane, ili mpate kuponywa. Ombi la mwenye haki, linapotenda kazi,[a] lina nguvu nyingi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ombi la mwenye haki lina nguvu nyingi linapokuwa likifanya kazi.”
    reason: Muundo wa ἐνεργουμένη unaweza kuelezwa kwa njia zaidi ya moja; mbadala huu unaonyesha hali ya ombi kuwa katika utendaji bila kuamua kama maana yake ni ya kutenda au ya kuwezeshwa.
lexical_decisions:
- source_word: ἐξομολογεῖσθε
  choice: ungamianeni
  rationale: Kitenzi hiki cha agizo pamoja na kiwakilishi cha kutendeana kinaonyesha kukiri dhambi waziwazi kwa mtu na mwenzake, bila kuingiza mazingira rasmi ya kisakramenti.
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Inaonyesha hitimisho linalotokana na muktadha uliotangulia kuhusu maombi, dhambi na kurejeshwa.
- source_word: ἀλλήλοις ... ὑπὲρ ἀλλήλων
  choice: -aneni ... kuombeana
  rationale: 'Viambishi vya kutendeana katika Kiswahili vinaonyesha wazi hali ya kila mmoja kumfanyia mwenzake: kuungamiana na kuombeana.'
- source_word: τὰς ἁμαρτίας
  choice: dhambi zenu
  rationale: Neno 'dhambi' ni tafsiri ya moja kwa moja; 'zenu' huwekwa wazi kwa kawaida kutokana na agizo la kutendeana.
- source_word: ὅπως ἰαθῆτε
  choice: ili mpate kuponywa
  rationale: Hifadhi maana ya kusudi au matokeo na upana wa uponyaji bila kuufanya kuwa wa mwili pekee au wa kiroho pekee.
- source_word: δέησις
  choice: ombi
  rationale: '''Ombi'' linaonyesha sala ya kusihi na pia linaunganika kwa urahisi na agizo la kuombeana.'
- source_word: δικαίου
  choice: mwenye haki
  rationale: Kivumishi cha Kigiriki kimetumiwa kama nomino kwa maana ya jumla; 'mwenye haki' ni cha kawaida, hakibainishi jinsia, na huhifadhi uzito wa kimaadili.
- source_word: πολὺ ἰσχύει
  choice: lina nguvu nyingi
  rationale: Kirai hiki kinaonyesha uwezo au nguvu kubwa ya kutenda, bila kutafsiri kupita kiasi kuwa matokeo fulani yaliyohakikishwa.
- source_word: ἐνεργουμένη
  choice: linapotenda kazi
  rationale: Huhifadhi wazo la ombi kuwa katika utendaji huku likiacha wazi mvutano wa kisarufi kati ya maana ya kutenda na ya kuwezeshwa.
theological_decisions:
- issue: Ikiwa mstari unaamuru ungamo la kisakramenti kwa viongozi wa dini au ungamo la kila mmoja kwa mwenzake
  choice: ungamo la kila mmoja kwa mwenzake
  alternative: ungamo linalopitia kwa viongozi waliowekwa wakfu
  rationale: Neno ἀλλήλοις linaonyesha wazi kutendeana ndani ya jumuiya. Tafsiri haiongezi mpangilio wa kiofisi ambao haujatajwa katika mstari.
- issue: Upeo wa ἰαθῆτε
  choice: kuponywa, kwa maana pana
  alternative: kuponywa kimwili pekee au kiroho pekee
  rationale: Muktadha unahusu ugonjwa wa mwili lakini pia unataja dhambi; neno pana 'kuponywa' huhifadhi mvutano huo.
- issue: Jinsia katika δικαίου
  choice: mwenye haki
  alternative: mwanamume mwenye haki
  rationale: Umbo la kiume la Kigiriki limetumiwa kwa maana ya jumla, kwa hiyo Kiswahili kisichobainisha jinsia kinaakisi kusudi lake vizuri.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. 'Ungamianeni' ni neno linaloeleweka katika muktadha wa dhambi na huhifadhi hali ya kutendeana; 'ombi' huepuka kubana δέησις katika istilahi ya dhehebu fulani.
