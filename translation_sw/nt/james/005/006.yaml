  text: Mmemhukumu na kumuua mwenye haki.[a] Je, hawapingi?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kauli “mwenye haki” inaweza kumaanisha mtu mwenye haki anayewakilisha wanaokandamizwa. Baadhi ya wafasiri pia huona hapa mwangwi unaowezekana wa Yesu, “Mwenye Haki.”
    reason: alternative_reading
  - marker: b
