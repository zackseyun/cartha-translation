lexical_decisions:
- source_word: κατεδικάσατε
  choice: Mmemhukumu
  rationale: Kitenzi hiki kina maana ya kutoa hukumu dhidi ya mtu au kumtia hatiani. Kauli ya wakati timilifu katika Kiswahili inaonyesha tendo lililofanywa na matokeo yake yanayohusika katika shtaka la Yakobo.
- source_word: ἐφονεύσατε
  choice: kumuua
  rationale: φονεύω hubeba uzito wa kuua isivyo halali. Katika muktadha huu, “kumuua” ni Kiswahili cha kawaida na cha moja kwa moja; shtaka lenyewe linaonyesha kwamba mauaji hayo ni ya uovu bila kuongeza maneno yasiyokuwamo katika Kigiriki.
- source_word: τὸν δίκαιον
  choice: mwenye haki
  rationale: Kivumishi cha umoja kilichotumiwa kama nomino kinamaanisha “mwenye haki.” Tafsiri hii ni ya moja kwa moja, inaweza kumwakilisha mtu mwadilifu anayekandamizwa, na hailazimishi kuitambua kauli hiyo kuwa cheo cha Yesu.
- source_word: οὐκ ἀντιτάσσεται ὑμῖν
  choice: Je, yeye hawapingi?
  rationale: ἀντιτάσσομαι humaanisha kujipanga dhidi ya mtu, kumpinga, au kumzuia. Tafsiri ya swali inafuata mpangilio na alama ya kuuliza ya SBLGNT, huku “yeye” ikirejelea mwenye haki.
theological_decisions:
- issue: Anayerejelewa na “mwenye haki”
  choice: Kauli imeachwa wazi, ikifaa kumaanisha kwa uwakilishi mtu mwenye haki anayekandamizwa na matajiri.
  alternative: Huenda ikawa mwangwi wa Yesu anayeitwa “Mwenye Haki.”
  rationale: Muktadha wa karibu unawalaumu matajiri wanaowakandamiza watu wenye haki, lakini umoja wa kauli unaweza pia kusikika kama mwangwi wa jina la Yesu. Tafsiri haifungi uwezekano wowote.
- issue: Muundo wa kishazi cha mwisho
  choice: 'Kimewasilishwa kama swali: “Je, yeye hawapingi?”'
  alternative: 'Kinaweza kueleweka kama taarifa: “Yeye hawapingi.”'
  rationale: SBLGNT hukipambanua kama swali, kwa hiyo matini kuu inahifadhi umbo hilo. Kwa kuwa muktadha unaweza kuruhusu maana ya taarifa kwamba mwenye haki hapingi, uwezekano huo umeelezwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi na inayoeleweka kwa urahisi. Muundo wa mashtaka mawili umeunganishwa kwa “na” ili usomeke kwa kawaida, huku uzito wa kauli ukihifadhiwa. Swali la mwisho linafuata matini ya Kigiriki na tanbihi inahifadhi usomaji wa taarifa.
