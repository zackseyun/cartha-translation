  text: Your wealth has rotted, and your clothes have become moth-eaten.
translation:
  language: sw
  text: Utajiri wenu umeoza, na nguo zenu zimeliwa na nondo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλοῦτος
  choice: utajiri
  rationale: “Utajiri” ni neno la kawaida na pana kwa mali nyingi, na linafaa katika shutuma ya Yakobo kwa matajiri.
- source_word: σέσηπεν
  choice: umeoza
  rationale: Kauli timilifu ya Kigiriki inaonyesha tendo lililotokea na hali inayodumu; “umeoza” huhifadhi picha halisi ya kuoza pamoja na matokeo yake ya sasa.
- source_word: ἱμάτια
  choice: nguo
  rationale: “Nguo” ni Kiswahili cha sasa, cha kawaida na chenye maana pana ya mavazi, bila kuibua aina maalumu ya vazi.
- source_word: σητόβρωτα
  choice: zimeliwa na nondo
  rationale: Kirai hiki kinaeleza wazi na kwa njia ya kawaida picha ya nguo zilizoharibiwa kwa kuliwa na nondo.
- source_word: γέγονεν
  choice: zimeliwa
  rationale: Muundo wa kauli timilifu “zimeliwa” unaonyesha jambo lililotokea na matokeo yake yanayoonekana sasa; katika Kiswahili cha kawaida ni wa asili zaidi kuliko tafsiri ya moja kwa moja ya “zimekuwa zimeliwa.”
