  text: Ἄγε νῦν οἱ πλούσιοι, κλαύσατε ὀλολύζοντες ἐπὶ ταῖς ταλαιπωρίαις ὑμῶν ταῖς ἐπερχομέναις.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/001.yaml
  text: Come now[a], you rich, weep[b], wailing over the miseries that are coming upon you.
translation:
  language: sw
  text: Sasa basi, enyi matajiri, lieni huku mkiomboleza kwa sauti kuu kwa sababu ya taabu zinazowajia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄγε νῦν
  choice: Sasa basi
  rationale: Ni kiashiria cha hotuba kinachoanzisha mwito mkali au shutuma; ‘Sasa basi’ ni usemi wa kawaida wa Kiswahili wenye nguvu hiyo.
- source_word: οἱ πλούσιοι
  choice: enyi matajiri
  rationale: Nomino hii imetumiwa kama mwito wa moja kwa moja; ‘enyi’ huonyesha wazi kwamba msemaji anawahutubia matajiri.
- source_word: κλαύσατε
  choice: lieni
  rationale: Amri hii inataka maombolezo ya wazi; ‘lieni’ ni ya kawaida, yenye uzito, na inafaa muktadha.
- source_word: ὀλολύζοντες
  choice: huku mkipiga yowe
  rationale: Kitenzi hiki huonyesha kilio kikubwa cha maombolezo; ‘kupiga yowe’ huhifadhi sauti ya juu na ya hadharani bila kudokeza sauti ya mnyama.
- source_word: ἐπὶ
  choice: kwa sababu ya
  rationale: Pamoja na hali ya dative hapa, kihusishi kinaonyesha msingi au sababu ya kuomboleza.
- source_word: ταλαιπωρίαις
  choice: taabu
  rationale: Neno hili linamaanisha shida kali, misiba, au hali za mateso; ‘taabu’ ni la kawaida na pana bila kupunguza uzito wa shutuma.
- source_word: ταῖς ἐπερχομέναις
  choice: zinazowajia
  rationale: Kirai hiki kinaeleza taabu zinazokaribia kuwafikia; ‘zinazowajia’ huhifadhi mwendo wa kuja bila kuongeza dai kwamba zitatokea mara moja.
theological_decisions:
- issue: Toni na walengwa wa mwito kwa matajiri
  choice: Shutuma ya kinabii kwa matajiri wanaokabiliwa na taabu au hukumu inayokuja, bila kubainisha kama ni waamini au wasioamini.
  alternative: Kuwatambulisha hasa kuwa wamiliki wa mashamba wasioamini wanaowakandamiza wengine, au washiriki matajiri wa jumuiya ya Kikristo.
  rationale: Mstari wenyewe unawahutubia ‘matajiri’ na kutangaza taabu zinazokuja, lakini hauelezi wazi hali yao ya kiimani; tafsiri haibani maana kuliko ushahidi wa mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Enyi matajiri’ huhifadhi mwito wa moja kwa moja; ‘huku mkipiga yowe’ huonyesha maombolezo makubwa ya hadharani. Hakuna tanbihi iliyohitajika kwa sababu chaguo kuu linaeleweka na kuhifadhi maana ya Kigiriki.
