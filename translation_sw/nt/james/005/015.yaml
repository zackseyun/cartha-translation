base_translation:
  language: en
  yaml_path: translation/nt/james/005/015.yaml
  text: And the prayer of faith will save the one who is sick[a], and the Lord will raise him up. And if he has committed sins[c][b], he will be forgiven.
translation:
  language: sw
  text: Na sala ya imani[b] itamwokoa mgonjwa[a], naye Bwana atamwinua. Na ikiwa ametenda dhambi[c], atasamehewa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “itamponya” au “itamrudishia afya”; Kigiriki, “itamwokoa.”
    reason: lexical_alternative
  - marker: b
    text: “Sala ya imani” yaweza pia kueleweka kuwa sala yenye kumtumaini Mungu au, ingawa si maana iliyo karibu zaidi hapa, sala yenye uaminifu.
    reason: lexical_alternative
  - marker: c
    text: Au, “hata ikiwa ametenda dhambi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐχὴ
  choice: sala
  rationale: Katika muktadha wa wazee kumwombea mgonjwa (mst. 14), neno hili linamaanisha sala, si nadhiri.
- source_word: πίστεως
  choice: ya imani
  rationale: Huhifadhi muundo wa Kigiriki na kueleza sala yenye sifa ya imani au kumtumaini Mungu.
- source_word: σώσει
  choice: itamwokoa
  rationale: Neno la Kigiriki linaweza kumaanisha kuokoa na, katika muktadha wa ugonjwa, kuponya au kumrudishia afya. ‘Itamwokoa’ huhifadhi upana huo huku muktadha ukionyesha pia kupona kimwili.
- source_word: τὸν κάμνοντα
  choice: mgonjwa
  rationale: Ingawa kitenzi kinaweza kuhusiana na kuchoka au kudhoofika, muktadha wa ugonjwa, kupakwa mafuta, na kuinuliwa unaunga mkono ‘mgonjwa.’
- source_word: ἐγερεῖ
  choice: atamwinua
  rationale: Huhifadhi taswira ya kumwinua mtu, huenda kutoka kitandani kwa sababu ya kupona, bila kuifupisha kuwa tiba pekee.
- source_word: κύριος
  choice: Bwana
  rationale: Hili ndilo neno la kawaida na lenye uzito wa kitheolojia kwa κύριος katika Agano Jipya.
- source_word: κἂν ἁμαρτίας ᾖ πεποιηκώς
  choice: ikiwa ametenda dhambi
  rationale: Huwasilisha sharti linalokubali uwezekano wa dhambi bila kudai kwamba ugonjwa wote unasababishwa na dhambi binafsi.
- source_word: ἀφεθήσεται
  choice: atasamehewa
  rationale: Kauli tendwa ya wakati ujao inaonyesha msamaha wa dhambi unaotolewa kwake; Kiswahili hiki ni cha asili na huhifadhi tendo la Mungu lisilotajwa moja kwa moja.
theological_decisions:
- issue: Iwapo σώσει itafsiriwe kwa maana finyu ya kuponya kimwili au kwa maana pana ya kuokoa na kurejesha
  choice: itamwokoa
  alternative: itamponya; itamrudishia afya
  rationale: Muktadha unahusu ugonjwa, lakini σῴζω ni pana kuliko kitenzi mahsusi cha tiba. Tafsiri hii huhifadhi maana pana na dokezo la kupona kimwili.
- issue: Iwapo mstari unaahidi kupona moja kwa moja kila sala inapotolewa
  choice: Kauli za wakati ujao zimetafsiriwa moja kwa moja bila kuongeza masharti wala madai ya uhakika yaliyo nje ya maandishi.
  alternative: anaweza kupona; bila shaka kila mgonjwa atapona
  rationale: Hii hudumisha nguvu ya kauli ya Kigiriki bila kuingiza fundisho la kimadhehebu kuhusu uponyaji wa lazima.
- issue: Iwapo msamaha unaonyesha kwamba kila ugonjwa husababishwa na dhambi binafsi
  choice: ikiwa ametenda dhambi, atasamehewa
  alternative: kwa sababu ametenda dhambi, atasamehewa
  rationale: Kigiriki kinaweka dhambi kama uwezekano wa masharti, si sababu ya lazima ya kila ugonjwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Sala ya imani’ na ‘Bwana atamwinua’ huhifadhi taswira na mvutano wa maandishi ya Kigiriki bila kuzifanya kuwa maelezo ya kimadhehebu.
