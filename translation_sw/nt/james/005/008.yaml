base_translation:
  language: en
  yaml_path: translation/nt/james/005/008.yaml
  text: You also be patient; strengthen your hearts[a], because the coming of the Lord has drawn near.
translation:
  language: sw
  text: Nanyi pia, vumilieni; iimarisheni mioyo yenu, kwa sababu kuja kwa Bwana kumekaribia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uwepo wa Bwana.” Neno la Kigiriki linaweza kumaanisha “uwepo” au “kuja”; katika muktadha huu linarejelea kufika kwa Bwana wakati wa mwisho.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακροθυμήσατε
  choice: vumilieni
  rationale: Kitenzi hiki ni amri kwa wingi na kinaeleza kuvumilia kwa subira katika shida au uchokozi. “Vumilieni” ni Kiswahili cha kawaida na kinaendana na mfano wa mkulima katika muktadha.
- source_word: καὶ ὑμεῖς
  choice: nanyi pia
  rationale: Huhifadhi kiunganishi pamoja na msisitizo wa kiwakilishi, na kuwaunganisha wasomaji na mfano uliotangulia.
- source_word: στηρίξατε
  choice: itieni nguvu
  rationale: Amri hii inaweza kumaanisha kuimarisha au kufanya imara. “Itieni nguvu” ni usemi wa asili unapounganishwa na “mioyo yenu” na unaonyesha azimio la ndani.
- source_word: τὰς καρδίας ὑμῶν
  choice: mioyo yenu
  rationale: Huhifadhi sitiari ya kibiblia ya moyo kama kitovu cha utu wa ndani, nia na ujasiri.
- source_word: ὅτι
  choice: kwa sababu
  rationale: Hutambulisha wazi sababu ya amri zilizotangulia.
- source_word: ἡ παρουσία
  choice: kuja
  rationale: Ingawa neno hili linaweza kumaanisha kuwapo au kuja, katika Yakobo 5:7–8 linarejelea kufika kwa Bwana kunakotarajiwa.
- source_word: τοῦ κυρίου
  choice: kwa Bwana
  rationale: “Bwana” ni tafsiri ya kawaida ya kichwa κύριος katika muktadha huu wa Agano Jipya.
- source_word: ἤγγικεν
  choice: kumekaribia
  rationale: Wakati timilifu wa Kigiriki unaonyesha hali ya ukaribu iliyokwisha kuanzishwa. “Kumekaribia” huhifadhi wazo hilo kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Maana ya παρουσία katika kauli kuhusu wakati wa mwisho na Bwana
  choice: kuja kwa Bwana
  alternative: kuwapo kwa Bwana
  rationale: Katika muktadha wa Yakobo 5:7–8, mawaidha yanaelekezwa kwenye kufika kwa Bwana kunakotarajiwa. Hata hivyo, maana mbadala ya kileksika imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa “itieni nguvu mioyo yenu” huhifadhi sitiari ya chanzo bila kuwa mgumu, na “kumekaribia” huhifadhi dhana ya ukaribu uliokwisha kuwa halisi.
