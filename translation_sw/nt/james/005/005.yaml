  text: ἐτρυφήσατε ἐπὶ τῆς γῆς καὶ ἐσπαταλήσατε, ἐθρέψατε τὰς καρδίας ⸀ὑμῶν ἐν ἡμέρᾳ σφαγῆς.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/005.yaml
  text: You have lived in luxury on the earth and indulged yourselves[d][c][b][a]; you have fattened your hearts in a day of slaughter.
translation:
  language: sw
  text: Mmeishi kwa anasa duniani na mmejisitiri kwa anasa;[a][b] mmenenepesha mioyo yenu katika siku ya kuchinjwa.[c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mmeishi kwa starehe.”
    reason: lexical_alternative
  - marker: b
    text: Au, “mmeishi kwa kujitimizia tamaa” badala ya “mmejisitiri kwa anasa.”
    reason: lexical_alternative
  - marker: c
    text: Picha ni ya wanyama wanaonenepeshwa kabla ya kuchinjwa, huenda ikidokeza hukumu inayokaribia.
    reason: cultural_note
  - marker: d
    text: Au, “kwa ajili ya siku ya kuchinjwa.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐτρυφήσατε
  choice: Mmeishi kwa anasa
  rationale: Kauli hii inaonyesha maisha ya starehe na anasa, si furaha ya kawaida tu, na inadumisha nguvu ya karipio.
- source_word: ἐπὶ τῆς γῆς
  choice: duniani
  rationale: Hapa γῆ inaeleweka kwa maana pana ya dunia; usemi huu ni wa kawaida na wa asili katika Kiswahili.
- source_word: ἐσπαταλήσατε
  choice: kujifurahisha kupita kiasi
  rationale: Kitenzi hiki kinaongeza wazo la kwanza kwa kuonyesha maisha ya kujitimizia tamaa na starehe bila kiasi. Muundo wa kujirejelea unahifadhiwa.
- source_word: ἐθρέψατε
  choice: mmeyanenepesha
  rationale: Ingawa τρέφω inaweza kumaanisha kulisha au kustawisha, picha ya mnyama anayenenepeshwa kabla ya kuchinjwa inaifanya 'kunenepesha' ifae zaidi hapa.
- source_word: τὰς καρδίας ὑμῶν
  choice: mioyo yenu
  rationale: Tafsiri ya moja kwa moja inadumisha sitiari na dhana ya kibiblia ya moyo kama kitovu cha utu wa ndani.
- source_word: ἐν ἡμέρᾳ σφαγῆς
  choice: katika siku ya kuchinjwa
  rationale: Hii inafuata kwa karibu kihusishi ἐν na kuhifadhi picha kali pamoja na utata wake, bila kuitafsiri wazi kuwa hukumu.
theological_decisions:
- issue: Nguvu ya kisitiari ya ‘siku ya kuchinjwa’
  choice: Kudumisha sitiari ya kuchinjwa kunakokaribia bila kutaja wazi anayechinjwa au kuifafanua kuwa hukumu ya Mungu katika matini kuu.
  alternative: Kutafsiri kwa uwazi kuwa siku ya hukumu ya Mungu, au kuiona kuwa kuchinjwa kwa wasio na hatia katika muktadha unaozunguka.
  rationale: Muktadha unaashiria sana hukumu inayokaribia, lakini Kigiriki kinatoa picha yenyewe bila kufafanua rejeleo lake. Kudumisha picha hiyo kunalinda mvutano wa kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Maneno ‘anasa,’ ‘kupita kiasi,’ na ‘kunenepesha mioyo’ yanadumisha karipio, ulinganifu wa vitenzi, na picha kali ya Kigiriki. Alama zote za tanbihi zimewekwa katika matini kuu.
