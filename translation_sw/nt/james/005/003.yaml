  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὁ χρυσὸς ὑμῶν καὶ ὁ ἄργυρος κατίωται, καὶ ὁ ἰὸς αὐτῶν εἰς μαρτύριον ὑμῖν ἔσται καὶ φάγεται τὰς σάρκας ὑμῶν· ὡς πῦρ ἐθησαυρίσατε ἐν ἐσχάταις ἡμέραις.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/003.yaml
  text: Your gold and silver have rusted[a], and their corrosion will be evidence against you and will eat your flesh like fire[b]. You have stored up treasure in the last days.
translation:
  language: sw
  text: Dhahabu yenu na fedha yenu zimeshika kutu[a], na kutu yao itakuwa ushahidi dhidi yenu na itakula nyama zenu kama moto[b]. Mmejiwekea hazina katika siku za mwisho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “zimeharibika kwa kutu.” Kitenzi cha Kigiriki kinaweza kumaanisha kuharibika au kufunikwa kwa kutu, ingawa dhahabu na fedha hazishiki kutu kwa maana finyu ya kisayansi.
    reason: lexical_alternative
  - marker: b
    text: Au, “Mmejiwekea hazina kama moto katika siku za mwisho.” Baadhi huunganisha “kama moto” na sehemu ya mwisho ya sentensi badala ya “itakula nyama zenu.”
    reason: alternative_reading
lexical_decisions:
- source_word: κατίωται
  choice: zimeshika kutu
  rationale: Kauli ya wakati timilifu inaonyesha hali ya sasa iliyotokana na tendo lililotangulia. Ingawa dhahabu na fedha hazipati kutu kwa maana finyu ya kisayansi, usemi huu wa kawaida unahifadhi picha ya kinabii ya mali iliyoharibika.
- source_word: ἰὸς
  choice: kutu
  rationale: Katika muktadha wa metali, neno hili linamaanisha kutu au zao la kuharibika kwa metali, si sumu. ‘Kutu’ ni neno la kawaida na lenye picha wazi katika Kiswahili.
- source_word: εἰς μαρτύριον ὑμῖν
  choice: itakuwa ushahidi dhidi yenu
  rationale: Kirai kina maana ya kimahakama. ‘Ushahidi dhidi yenu’ huwasilisha kwa kawaida kwamba kutu hiyo itawathibitishia hatia.
- source_word: φάγεται τὰς σάρκας ὑμῶν
  choice: itakula miili yenu
  rationale: ‘Itakula’ inadumisha picha kali na halisi ya kitenzi cha Kigiriki. ‘Miili’ ni ya kawaida zaidi katika Kiswahili kuliko ‘nyama zenu’ hapa, bila kuondoa picha ya maangamizi ya kimwili.
- source_word: ὡς πῦρ
  choice: kama moto
  rationale: Kwa uwezekano mkubwa, kirai hiki kinaeleza jinsi kutu itakavyokula miili yao; tafsiri hii inadumisha tashbihi ya hukumu yenye kuangamiza.
- source_word: ἐθησαυρίσατε
  choice: mmejiwekea hazina
  rationale: Kitenzi kina maana ya kuweka au kujikusanyia hazina. Tafsiri hii inabeba wazo la kujihifadhia mali bila kuongeza moja kwa moja neno lenye hukumu kama ‘mlilimbikiza kwa uchoyo.’
- source_word: ἐν ἐσχάταις ἡμέραις
  choice: katika siku za mwisho
  rationale: Huu ni usemi wa kawaida wa kieskatolojia na unaakisi Kigiriki moja kwa moja bila kuongeza ‘hizi,’ ambalo halijaandikwa wazi.
theological_decisions:
- issue: Uhusiano wa ὡς πῦρ katika sentensi
  choice: '‘Kama moto’ imeunganishwa na kirai kilichotangulia: kutu itakula miili yao kama moto.'
  alternative: '‘Kama moto’ inaweza kuunganishwa na kirai kinachofuata: ‘Mmejiwekea moto kuwa hazina katika siku za mwisho.’'
  rationale: Mpangilio wa karibu wa maneno na mtiririko wa maana unaunga mkono uhusiano na ‘itakula,’ hivyo kutoa picha thabiti ya hukumu yenye kuangamiza. Hata hivyo, uhusiano na kirai kinachofuata una historia katika tafsiri na unabaki uwezekano halisi, kwa hiyo umeandikwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. ‘Zimeshika kutu’ ni usemi hai na wa kawaida; ‘ushahidi dhidi yenu’ huhifadhi mwelekeo wa kimahakama. Alama zote za tanbihi zimewekwa katika matini kuu.
