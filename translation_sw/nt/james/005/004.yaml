id: JAS.5.4
reference: James 5:4
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἰδοὺ ὁ μισθὸς τῶν ἐργατῶν τῶν ἀμησάντων τὰς χώρας ὑμῶν ὁ ⸀ἀφυστερημένος ἀφ’ ὑμῶν κράζει, καὶ αἱ βοαὶ τῶν θερισάντων εἰς τὰ ὦτα Κυρίου Σαβαὼθ ⸀εἰσεληλύθασιν·
base_translation:
  language: en
  yaml_path: translation/nt/james/005/004.yaml
  text: Look[a], the wages of the workers who harvested your fields, which have been withheld by you, are crying out, and the cries of those who did the harvesting have entered into the ears of the Lord of Hosts.
translation:
  language: sw
  text: Tazama, ujira wa wafanyakazi waliovuna mashamba yenu, ambao mmeuzuia, unalia; na vilio vya waliovuna vimeingia masikioni mwa Bwana wa majeshi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Bwana Sabaoth.” Kigiriki kinahifadhi cheo cha Kiebrania Sabaoth, ambacho maana yake ni “majeshi.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: Tazama
  rationale: Ni neno la kusisitiza na kuvuta fikira; “Tazama” ni la kawaida katika Kiswahili cha kibiblia na bado linaeleweka kwa wasomaji wa leo.
- source_word: μισθὸς
  choice: ujira
  rationale: Humaanisha malipo wanayostahili wafanyakazi. Umoja wa “ujira” pia huhifadhi umbo la nomino ya Kigiriki na kupatana na kitenzi cha umoja.
- source_word: ἐργατῶν
  choice: wafanyakazi
  rationale: Ni neno la sasa na linaloeleweka kwa watu wanaofanya kazi, huku muktadha ukionyesha kuwa ni kazi ya shambani.
- source_word: ἀμησάντων
  choice: waliovuna
  rationale: Kitenzi hiki humaanisha kuvuna au kukata mazao; “waliovuna” ni cha kawaida na kinafaa katika muktadha wa mashamba.
- source_word: χώρας
  choice: mashamba
  rationale: Katika muktadha huu ni ardhi iliyolimwa ya wenye mali; “mashamba” hutoa maana hiyo kwa uwazi.
- source_word: ἀφυστερημένος ἀφ’ ὑμῶν
  choice: ambao mmeuzuia
  rationale: Huhifadhi shtaka la moja kwa moja kwamba wao wamezuia ujira uliodaiwa, bila kuongeza kwa dhahiri wazo la udanganyifu ambalo linadokezwa na muktadha.
- source_word: κράζει
  choice: unapaza sauti
  rationale: Huhifadhi umoja wa kitenzi na tamathali hai ya ujira wenyewe kulilia haki.
- source_word: βοαὶ
  choice: vilio
  rationale: Huonyesha sauti za dhiki na madai ya msaada au haki kwa lugha ya kawaida na yenye uzito.
- source_word: θερισάντων
  choice: waliovuna
  rationale: Kirai hiki kinawataja waliofanya kazi ya mavuno; umbo la kitenzi ni la asili zaidi katika Kiswahili kuliko nomino isiyotumiwa sana.
- source_word: εἰς τὰ ὦτα
  choice: vimeingia masikioni mwa
  rationale: Huhifadhi taswira halisi ya Kigiriki ya vilio kuingia masikioni, badala ya kuisawazisha kuwa “vimefika kwa.”
- source_word: Κυρίου Σαβαὼθ
  choice: Bwana wa majeshi
  rationale: Hutafsiri cheo cha Mungu kilichotokana na Kiebrania kwa Kiswahili kinachoeleweka, huku namna ya kulitamka jina hilo ikitolewa katika tanbihi.
- source_word: εἰσεληλύθασιν
  choice: vimeingia
  rationale: Wakati timilifu wa Kiswahili unaonyesha tendo lililotokea na athari yake inayodumu, na pia huhifadhi sitiari ya kuingia.
theological_decisions:
- issue: Tafsiri ya cheo cha Mungu Κυρίου Σαβαὼθ
  choice: Bwana wa majeshi
  alternative: Bwana Sabaothi
  rationale: Σαβαώθ ni umbo la Kigiriki linalohifadhi cheo cha Kiebrania chenye maana ya majeshi. Kutafsiri cheo hicho katika matini kuu huwasilisha maana yake wazi; unukuzi wa kimapokeo umehifadhiwa katika tanbihi bila kuamua zaidi aina ya majeshi yanayokusudiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imehifadhi urudiaji wa “waliovuna,” tamathali ya ujira unaopaza sauti, na picha ya vilio kuingia masikioni mwa Mungu. Alama ya tanbihi imewekwa baada ya cheo kinachohusika.
