lexical_decisions:
- source_word: Ἀδελφοί μου
  choice: Ndugu zangu
  rationale: “Ndugu” ni neno la kawaida na lenye heshima la kuwaita washiriki wa jumuiya; katika Kiswahili halibainishi jinsia, hivyo linaweza kuwakilisha wingi wa kiume wa Kigiriki unaoweza kujumuisha jumuiya nzima.
- source_word: ἐάν τις ἐν ὑμῖν
  choice: ikiwa mtu yeyote miongoni mwenu
  rationale: Hudumisha sharti na hali isiyobainishwa ya τις, kwa Kiswahili cha sasa na cha kawaida.
- source_word: πλανηθῇ ἀπὸ τῆς ἀληθείας
  choice: atakengeuka kutoka katika kweli
  rationale: “Atakengeuka” huonyesha kuondoka katika njia ya kweli kwa lugha ya asili. Umbo la Kigiriki linaweza pia kueleweka kwa maana ya kupotoshwa au kupotea, hivyo uwezekano huo umehifadhiwa katika tanbihi.
- source_word: καὶ ἐπιστρέψῃ τις αὐτόν
  choice: na mtu mwingine akamrudisha
  rationale: “Akamrudisha” huwasilisha maana ya kumgeuza au kumleta mtu huyo arudi, huku “mtu mwingine” ikionyesha mhusika mwingine asiyebainishwa.
theological_decisions:
- issue: 'Maana ya πλανηθῇ: kukengeuka au kupotoshwa'
  choice: atakengeuka kutoka katika kweli
  alternative: atapotoshwa na kuiacha kweli; atapotea kutoka katika kweli
  rationale: Kigiriki kinaruhusu wazo la kwenda kombo na pia la kudanganywa au kupotoshwa. Matini kuu inatumia Kiswahili cha kawaida bila kuamua chanzo cha kukengeuka; tanbihi inahifadhi maana ya kupokea kitendo.
- issue: Ujumuishaji wa Ἀδελφοί na αὐτόν
  choice: Ndugu zangu; akamrudisha
  alternative: Ndugu zangu wa kiume; akamrudisha mtu huyo
  rationale: Kiswahili hakibainishi jinsia katika “ndugu” wala katika kiambishi cha ngeli ya mtu “m-”. Kwa hiyo tafsiri ya asili haiwezi kuhifadhi umbo la kiume la Kigiriki bila kuongeza ubainishaji usiokuwamo wazi katika matumizi haya.
translation_notes:
