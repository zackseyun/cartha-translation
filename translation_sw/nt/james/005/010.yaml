  text: ὑπόδειγμα λάβετε, ⸀ἀδελφοί, τῆς κακοπαθίας καὶ τῆς μακροθυμίας τοὺς προφήτας, οἳ ἐλάλησαν ⸀ἐν τῷ ὀνόματι κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/010.yaml
  text: Brothers[a], take the prophets who spoke in the name of the Lord as an example of suffering and patience.
translation:
  language: sw
  text: Ndugu[a], chukueni manabii walionena kwa jina la Bwana kuwa mfano wa kuteseka na kuwa na subira.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki lililotafsiriwa “Ndugu” lina umbo la wingi wa kiume; katika muktadha huu huenda Yakobo anaihutubia jumuiya yote ya waamini, wakiwemo wanawake.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπόδειγμα λάβετε
  choice: chukueni ... kuwa mfano
  rationale: Muundo huu unahifadhi agizo la Kigiriki la kuwachukua manabii kuwa kielelezo cha kuigwa, huku ukibaki wazi katika Kiswahili cha sasa.
- source_word: ἀδελφοί
  choice: Ndugu
  rationale: “Ndugu” ndilo neno la kawaida na lenye hadhi kwa mwito huu katika Kiswahili. Ingawa umbo la Kigiriki ni wingi wa kiume, katika muktadha huu huenda linawahusu waamini wote; ufafanuzi umewekwa katika tanbihi.
- source_word: κακοπαθίας
  choice: kuteseka
  rationale: Neno hili linataja kupitia mateso au hali ngumu. “Kuteseka” ni la kawaida na linadumisha maana pana ya chanzo.
- source_word: μακροθυμίας
  choice: kuwa na subira
  rationale: Neno hili linaonyesha subira ya muda mrefu katika hali ngumu. Usemi huu ni wa kawaida na unaeleweka kwa urahisi.
- source_word: τοὺς προφήτας
  choice: manabii
  rationale: Hili ni tafsiri ya moja kwa moja ya watu wanaotajwa kuwa mfano.
- source_word: ἐλάλησαν
  choice: walionena
  rationale: “Walionena” huhifadhi maana rahisi ya kusema huku ikifaa kwa sajili yenye hadhi ya maandiko bila kuongeza wazo la kutangaza ambalo halijasemwa wazi.
- source_word: ἐν τῷ ὀνόματι κυρίου
  choice: kwa jina la Bwana
  rationale: Huu ni usemi wa kawaida wa kibiblia unaodokeza uwakilishi na mamlaka; umehifadhiwa bila kufafanuliwa kupita kiasi.
theological_decisions:
- issue: Mwito wa ἀδελφοί wenye umbo la kiume katika Kigiriki
  choice: Ndugu katika matini, pamoja na tanbihi kuhusu umbo la Kigiriki na uwezekano wa maana jumuishi
  alternative: Ndugu wanaume; ndugu wa kiume na wa kike
  rationale: Kiswahili “ndugu” hakionyeshi jinsia kwa lazima na ndilo neno la kawaida katika mwito wa jumuiya. Tanbihi inahifadhi taarifa kwamba chanzo kina umbo la kiume bila kudai kuwa Yakobo aliwahutubia wanaume peke yao.
- issue: Uhusiano wa manabii na ὑπόδειγμα
  choice: chukueni manabii ... kuwa mfano wa kuteseka na kuwa na subira
  alternative: manabii ... wawe mfano kwenu; waangalieni manabii kama mfano
  rationale: Manabii ndio wanaochukuliwa kuwa mfano, na kauli zinazofuata zinaeleza mambo ambayo katika hayo wao ni mfano. Muundo uliochaguliwa unahifadhi uhusiano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Walionena” kimetumiwa kwa sajili ya maandiko iliyo rasmi kiasi, lakini sentensi kwa ujumla imewekwa wazi na rahisi kueleweka.
