id: JAS.5.14
reference: James 5:14
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀσθενεῖ τις ἐν ὑμῖν; προσκαλεσάσθω τοὺς πρεσβυτέρους τῆς ἐκκλησίας, καὶ προσευξάσθωσαν ἐπ’ αὐτὸν ἀλείψαντες ⸀αὐτὸν ἐλαίῳ ἐν τῷ ὀνόματι τοῦ κυρίου·
base_translation:
  language: en
  yaml_path: translation/nt/james/005/014.yaml
  text: Is anyone among you sick? Let him call for the elders of the church[a], and let them pray over him[b], anointing him with oil in the name of the Lord.
translation:
  language: sw
  text: Je, kuna yeyote miongoni mwenu aliye mgonjwa?[a] Awaite wazee wa kanisa, nao wamwombee, wakimpaka mafuta[b] kwa jina la Bwana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliye dhaifu.” Kitenzi cha Kigiriki kinaweza kumaanisha udhaifu kwa upana zaidi, lakini hapa huenda kinarejelea ugonjwa kwa sababu ya maombi, kupakwa mafuta, na muktadha wa kuponywa katika mstari unaofuata.
    reason: lexical_alternative
  - marker: b
    text: Kupaka mafuta kunaweza kueleweka kuwa tendo la tiba, la ishara, au yote mawili; maandishi yenyewe hayaelezi namna mafuta hayo yanavyohusika.
    reason: cultural_note
lexical_decisions:
- source_word: ἀσθενεῖ
  choice: aliye mgonjwa
  rationale: Katika muktadha wa maombi, kupakwa mafuta, na kuponywa katika mstari unaofuata, maana kuu ni kuwa na ugonjwa wa mwili. Tanbihi inahifadhi maana pana inayowezekana ya kuwa dhaifu.
- source_word: τις ἐν ὑμῖν
  choice: kuna yeyote miongoni mwenu
  rationale: Huhifadhi maana ya mtu yeyote ndani ya jumuiya inayozungumziwa kwa Kiswahili cha kawaida na jumuishi.
- source_word: προσκαλεσάσθω
  choice: awaite
  rationale: 'Huwasilisha amri ya nafsi ya tatu kwa ufupi na kwa lugha ya kawaida: mgonjwa aombe wazee waje kwake.'
- source_word: τοὺς πρεσβυτέρους τῆς ἐκκλησίας
  choice: wazee wa kanisa
  rationale: Katika muundo huu, πρεσβύτεροι ni viongozi wanaotambuliwa wa jumuiya ya waumini, si wanaume wenye umri mkubwa tu.
- source_word: προσευξάσθωσαν ἐπ’ αὐτόν
  choice: nao wamwombee
  rationale: Ni Kiswahili cha kawaida kinachoonyesha kwamba wazee wanapaswa kusali kwa ajili ya mgonjwa. Kinaepuka usemi usio wa kawaida ‘wasali juu yake’ bila kuondoa mwelekeo wa maombi kwa mtu huyo.
- source_word: ἀλείψαντες αὐτὸν ἐλαίῳ
  choice: wakimpaka mafuta
  rationale: Kitenzi kinaeleza kumpaka mtu mafuta. Tafsiri hii haisuluhishi ikiwa tendo hilo lilikuwa la tiba, ishara, au yote mawili.
- source_word: ἐν τῷ ὀνόματι τοῦ κυρίου
  choice: kwa jina la Bwana
  rationale: Huhifadhi nahau ya kibiblia inayohusisha tendo hilo na nafsi na mamlaka ya Bwana bila kuifafanua kupita maandishi.
theological_decisions:
- issue: Maana ya ἀσθενεῖ katika muktadha
  choice: ugonjwa wa mwili ndio maana kuu
  alternative: udhaifu wa kiroho au udhaifu kwa maana pana
  rationale: Kutajwa kwa wazee, maombi, mafuta, na kuponywa au kuinuliwa katika mstari unaofuata kunaelekeza hasa kwenye ugonjwa wa mwili, lakini wigo mpana wa neno la Kigiriki umehifadhiwa katika tanbihi.
- issue: Kazi ya kupaka mafuta
  choice: kutaja tendo bila kuainisha utendaji wake
  alternative: tiba pekee, ishara pekee, au ibada yenye neema maalumu
  rationale: Andiko linasema mgonjwa apakwe mafuta, lakini halielezi wazi kama mafuta hayo ni dawa, ishara, au vyote viwili; kwa hiyo tafsiri haileti hitimisho la kimadhehebu.
- issue: Mhusika wa κύριος
  choice: Bwana
  alternative: kufafanua moja kwa moja kuwa ni Yesu au Mungu
  rationale: Jina la cheo katika Kigiriki limehifadhiwa. Muktadha wa Kikristo unaweza kuelekeza kwa Bwana Yesu, lakini mstari wenyewe unasema tu ‘Bwana.’
- issue: Jinsia ya τις na viwakilishi vinavyofuata
  choice: yeyote, kisha miundo ya Kiswahili isiyotaja jinsia
  alternative: mwanamume yeyote au viwakilishi vya kiume
  rationale: Kiswahili hakihitaji kutaja jinsia katika ‘aliye,’ ‘awaite,’ na ‘wamwombee.’ Hivyo maana jumuishi ya τις inahifadhiwa bila kuongeza jinsia ambayo haionekani lazima katika matumizi haya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo ‘Awaite … nao wamwombee’ unadumisha nguvu ya amri za Kigiriki kwa mtiririko wa kawaida wa Kiswahili. Alama za tanbihi zimewekwa mara baada ya maneno yanayofafanuliwa.
