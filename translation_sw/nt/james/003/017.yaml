  text: ἡ δὲ ἄνωθεν σοφία πρῶτον μὲν ἁγνή ἐστιν, ἔπειτα εἰρηνική, ἐπιεικής, εὐπειθής, μεστὴ ἐλέους καὶ καρπῶν ἀγαθῶν, ⸀ἀδιάκριτος, ἀνυπόκριτος·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/017.yaml
  text: But the wisdom from above is first pure[a], then peaceable, gentle, open to reason, full of mercy and good fruits, impartial, sincere.
translation:
  language: sw
  text: Lakini hekima itokayo juu kwanza ni safi; kisha ni yenye kupenda amani, ya upole, inayokubali kushauriwa, imejaa rehema na matunda mema, haina upendeleo[a], na haina unafiki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “isiyogawanyika”; kivumishi hiki cha Kigiriki kinaweza pia kueleweka kuwa “isiyo na shaka au kusitasita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνωθεν
  choice: itokayo juu
  rationale: Inahifadhi taswira ya mahali ya ‘kutoka juu’ na utofauti wake na hekima ya kidunia katika muktadha, bila kufafanua kupita kiasi kuwa ‘kutoka mbinguni.’
- source_word: σοφία
  choice: hekima
  rationale: Ni tafsiri ya kawaida na ya asili ya sifa au aina ya hekima inayofafanuliwa hapa.
- source_word: πρῶτον μὲν
  choice: kwanza
  rationale: Inaonyesha wazi sifa ya kwanza katika mpangilio wa maelezo.
- source_word: ἁγνή
  choice: safi
  rationale: Inaeleza usafi wa kimaadili na uadilifu usiochanganyika kwa lugha ya kawaida na yenye heshima.
- source_word: ἔπειτα
  choice: kisha
  rationale: Inadumisha mfuatano kati ya sifa ya kwanza na sifa zinazofuata.
- source_word: εἰρηνική
  choice: inapenda amani
  rationale: Inaonyesha mwelekeo wa kuleta na kutafuta amani, si hali ya utulivu tu.
- source_word: ἐπιεικής
  choice: ni ya upole
  rationale: ‘Upole’ ni neno linaloeleweka kwa urahisi na linabeba wazo la kutokuwa mkali au mshupavu, ingawa neno la Kigiriki linaweza pia kuhusisha ustahimilivu na kuzingatia wengine.
- source_word: εὐπειθής
  choice: iko tayari kusikiliza
  rationale: Inaonyesha hali ya kukubali kusikiliza au kushawishika kwa yaliyo ya haki, bila kudokeza udanganyifu au wepesi wa kuamini kila jambo.
- source_word: μεστὴ ἐλέους
  choice: imejaa rehema
  rationale: Inadumisha wazo la wingi lililo katika μεστή na kutumia usemi wa kawaida wa Kiswahili.
- source_word: καρπῶν ἀγαθῶν
  choice: matunda mema
  rationale: Inahifadhi wingi na sitiari ya matokeo yanayoonekana badala ya kuifasiri moja kwa moja kuwa matendo mema.
- source_word: ἀδιάκριτος
  choice: haina upendeleo
  rationale: Katika orodha hii ya kimaadili na kwa kuzingatia msisitizo wa Yakobo dhidi ya ubaguzi, tafsiri hii inafaa vizuri; maana nyingine halali zimehifadhiwa katika tanbihi.
- source_word: ἀνυπόκριτος
  choice: wala unafiki
  rationale: Usemi ‘haina ... wala unafiki’ unaonyesha moja kwa moja kutokuwapo kwa kujifanya au unafiki na unasikika kwa asili katika mfululizo huu.
theological_decisions:
- issue: Maana ya ἀδιάκριτος
  choice: haina upendeleo
  alternative: isiyogawanyika; isiyo na shaka au kusitasita
  rationale: Neno linaweza kueleweka kwa maana ya kutokuwa na upendeleo, kutogawanyika, au kutokuwa na shaka. Muktadha wa maadili na msisitizo wa Yakobo kuhusu upendeleo unaunga mkono chaguo la maandishi, huku tanbihi ikihifadhi utata halisi wa kileksika.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inafuata mfuatano wa Kigiriki lakini hutumia miundo ya Kiswahili inayosomeka kwa urahisi. Kiashiria [a] kimewekwa baada ya kirai kinachotafsiri ἀδιάκριτος.
