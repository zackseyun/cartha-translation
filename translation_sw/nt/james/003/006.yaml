  text: καὶ ἡ γλῶσσα πῦρ, ὁ κόσμος τῆς ⸀ἀδικίας ἡ γλῶσσα καθίσταται ἐν τοῖς μέλεσιν ἡμῶν, ἡ σπιλοῦσα ὅλον τὸ σῶμα καὶ φλογίζουσα τὸν τροχὸν τῆς γενέσεως καὶ φλογιζομένη ὑπὸ τῆς γεέννης.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/006.yaml
  text: And the tongue is a fire. The tongue is set among our members as a world of unrighteousness, staining the whole body and setting on fire the wheel of birth, and being set on fire by Gehenna.
translation:
  language: sw
  text: Nao ulimi ni moto. Ulimi umewekwa miongoni mwa viungo vyetu kama ulimwengu wa uovu; huchafua mwili wote[a], huwasha moto gurudumu la kuzaliwa[b], na huwashwa moto na Gehena[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “huutia unajisi mwili wote.”
    reason: lexical_alternative
  - marker: b
    text: Au, “mzunguko wa maisha” au “mwendo wa maisha.”
    reason: lexical_alternative
  - marker: c
    text: Gehena ni neno la Kigiriki; kwa desturi hutafsiriwa “jehanamu.”
    reason: alternative_reading
lexical_decisions:
- source_word: γλῶσσα
  choice: ulimi
  rationale: Neno la kiungo cha mwili limehifadhiwa kwa sababu Yakobo anaendeleza sitiari halisi ya ulimi, huku akimaanisha pia usemi.
- source_word: πῦρ
  choice: moto
  rationale: Huhifadhi sitiari fupi na yenye nguvu ya uharibifu; Kiswahili hakihitaji kiwakilishi kisichodhihirisha kama 'a' ya Kiingereza.
- source_word: κόσμος τῆς ἀδικίας
  choice: ulimwengu wa uovu
  rationale: Huhifadhi taswira pana ya κόσμος na maana ya kimaadili ya ἀδικία; 'uovu' ni ya asili na pana kuliko 'udhalimu' katika muktadha huu.
- source_word: καθίσταται ἐν τοῖς μέλεσιν ἡμῶν
  choice: umewekwa miongoni mwa viungo vyetu
  rationale: Huwasilisha nafasi ya ulimi kati ya sehemu za mwili bila kuifanya kauli kuwa ya kufasiri mno.
- source_word: σπιλοῦσα
  choice: huchafua
  rationale: Huwasilisha taswira ya kutia doa pamoja na unajisi wa kimaadili kwa lugha ya kawaida ya Kiswahili.
- source_word: ὅλον τὸ σῶμα
  choice: mwili wote
  rationale: Tafsiri ya moja kwa moja inayohifadhi nguvu ya ὅλον.
- source_word: φλογίζουσα
  choice: huuwasha moto
  rationale: Huhifadhi taswira inayorudiwa ya moto na kitendo cha kusababisha kitu kiwake.
- source_word: τὸν τροχὸν τῆς γενέσεως
  choice: mzunguko wa maisha
  rationale: Huhifadhi wazo la duara au gurudumu katika τροχός kwa Kiswahili kinachoeleweka, huku γένεσις hapa ikielekezwa kwa mwendo mzima wa maisha; usemi halisi zaidi umewekwa katika tanbihi.
- source_word: φλογιζομένη
  choice: wenyewe huwashwa moto
  rationale: Huhifadhi kauli tendwa na kuonyesha kwamba ulimi unaowasha mambo mengine nao hupokea moto kutoka chanzo kingine.
- source_word: ὑπὸ τῆς γεέννης
  choice: na Gehena
  rationale: Jina maalumu la Kigiriki limehifadhiwa badala ya kulisawazisha moja kwa moja na istilahi pana ya kitheolojia; maelezo yametolewa katika tanbihi.
theological_decisions:
- issue: Maana ya γέεννα
  choice: Gehena
  alternative: jehanamu
  rationale: Kuhifadhi jina la kihistoria kunatunza upekee wa neno la Kigiriki na kuepuka kuingiza bila lazima dhana zote zinazoweza kuambatana na neno pana 'jehanamu'.
- issue: Maana ya τὸν τροχὸν τῆς γενέσεως
  choice: mzunguko wa maisha
  alternative: gurudumu la kuzaliwa
  rationale: Kirai cha Kigiriki ni kigumu na kina taswira ya gurudumu au mzunguko. Tafsiri kuu inalenga uelewekaji bila kuondoa taswira hiyo kabisa, na tafsiri halisi zaidi imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi umerahisishwa kiasi ili usomeke kwa kawaida, lakini marudio ya 'ulimi' na 'moto' pamoja na taswira pana za Kigiriki yamehifadhiwa.
