base_translation:
  language: en
  yaml_path: translation/nt/james/003/015.yaml
  text: This wisdom is not coming down from above[a], but is earthly, unspiritual, demonic.
translation:
  language: sw
  text: Hekima hii haishuki kutoka juu, bali ni ya kidunia, isiyo ya kiroho,[a] na ya kishetani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ya asili.” Neno la Kigiriki linaweza kumaanisha kile kilicho cha uhai wa asili tu, tofauti na kile kilicho cha kiroho.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὕτη ἡ σοφία
  choice: Hekima hii
  rationale: Kiwakilishi pamoja na nomino yenye kibainishi kinaelekeza kwenye hekima iliyofafanuliwa katika muktadha uliotangulia. “Hekima hii” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: ἄνωθεν
  choice: kutoka juu
  rationale: Inahifadhi maana ya msingi na mwangwi wa asili ya kimungu unaopatikana pia katika Yakobo 1:17, bila kufafanua moja kwa moja kuwa “mbinguni.”
- source_word: κατερχομένη
  choice: inayoshuka
  rationale: Kitenzi cha wakati uliopo kinawasilishwa kwa usemi wa asili wa Kiswahili unaoonyesha mwendo wa kushuka.
- source_word: ἐπίγειος
  choice: ya kidunia
  rationale: Inahifadhi utofautishaji kati ya kile kinachotoka juu na kile kinachohusiana na dunia, bila kuongeza maana pana ya “kifalme cha ulimwengu” au maadili yasiyo katika neno lenyewe.
- source_word: ψυχική
  choice: isiyo ya kiroho
  rationale: Katika muktadha huu neno linatofautisha hekima hiyo na kile kilicho cha kiroho au kitokacho kwa Mungu. Tafsiri hii ni wazi kwa msomaji wa sasa, huku tanbihi ikihifadhi uwezekano wa maana ya “ya kiasili.”
- source_word: δαιμονιώδης
  choice: ya kishetani
  rationale: Usemi huu wa kawaida wa Kiswahili unaonyesha tabia au asili inayohusiana na pepo waovu. Hapa “kishetani” haimaanishi tu ubaya kwa ujumla, bali eneo la kipepo linalodokezwa na neno la Kigiriki.
theological_decisions:
- issue: Nguvu ya ψυχική katika utofautishaji wa kiroho na wa kiasili
  choice: isiyo ya kiroho
  alternative: ya kiasili
  rationale: “Isiyo ya kiroho” inaonyesha tathmini hasi katika mfululizo wa vivumishi na utofautishaji na hekima itokayo juu. Kwa kuwa ψυχική pia inaweza kumaanisha kilicho cha maisha ya kawaida ya asili, uwezekano huo umehifadhiwa katika tanbihi badala ya kuondolewa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo unabaki karibu na sentensi ya Kigiriki, lakini unatumia “si ile inayoshuka” ili sentensi isikike ya kawaida na wazi. Alama ya tanbihi imewekwa mara tu baada ya kirai kinachohusika.
