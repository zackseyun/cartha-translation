  yaml_path: translation/nt/james/003/018.yaml
  text: And the fruit of righteousness is sown in peace by those who make peace[a][b].
translation:
  language: sw
  text: Na tunda la haki hupandwa katika amani na wale wanaoleta amani.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “tunda la uadilifu.” Neno la Kigiriki linaweza kuhusisha mwenendo ulionyooka na pia haki katika mahusiano au sheria.
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa ajili ya wale wanaoleta amani.” Dativi ya Kigiriki inaweza kueleweka kwa njia hiyo, ingawa “na wale wanaoleta amani” inalingana vizuri zaidi na kitenzi cha hali tendwa hapa.
    reason: alternative_reading
lexical_decisions:
- source_word: καρπὸς
  choice: tunda
  rationale: “Tunda” linahifadhi sitiari na umbo la nomino ya umoja; “mavuno” yanawezekana kimuktadha lakini yangeipanua picha.
- source_word: δὲ
  choice: Na
  rationale: Hapa δέ ni kiunganishi hafifu, si utofautishaji mkali; “Na” linaendeleza wazo la hekima kutoka juu na matokeo yake.
- source_word: δικαιοσύνης
  choice: haki
  rationale: “Haki” ni neno la kawaida la Kiswahili kwa δικαιοσύνη na linaweza kubeba maana za uadilifu wa kimaadili pamoja na haki katika mahusiano au sheria, bila kuamua kwa lazima aina ya uhusiano wa genitivi.
- source_word: ἐν εἰρήνῃ
  choice: katika amani
  rationale: Tafsiri hii ya karibu inahifadhi uwezekano wa kuelewa amani kama mazingira au namna ya kupanda.
- source_word: σπείρεται
  choice: hupandwa
  rationale: “Hupandwa” ni hali tendwa ya sasa iliyo ya asili katika Kiswahili na inaweza kueleza jambo linalotokea kwa kawaida au kwa kuendelea.
- source_word: τοῖς ποιοῦσιν εἰρήνην
  choice: na wale wanaofanya amani
  rationale: 'Kwa kuhusishwa na kitenzi cha hali tendwa, dativi inaeleweka vizuri kama mtendaji: hao ndio wanaopanda. “Wanaofanya amani” linaakisi wazi ποιέω + εἰρήνην.'
theological_decisions:
- issue: Maana ya “tunda la haki”
  choice: Kudumisha usemi “tunda la haki” kama matokeo au mazao yenye sifa ya haki, yanayohusiana na hekima na mwenendo wa amani.
  alternative: Mavuno ambayo ni haki; au tunda linalozalisha haki.
  rationale: Muundo wa genitivi δικαιοσύνης unaweza kuwa wa maelezo au wa ulinganisho; tafsiri haubani uhusiano huo kwa maelezo moja tu.
- issue: Jukumu la wale wanaofanya amani
  choice: Kuwataja kama watendaji wa upandaji.
  alternative: Kuelewa tunda kuwa linapandwa kwa ajili ya wale wanaofanya amani.
  rationale: Dativi ina utata wa kisarufi, lakini maana ya mtendaji pamoja na kitenzi cha hali tendwa inafaa zaidi hapa; uwezekano mwingine umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Hupandwa” limetumiwa badala ya “linapandwa” ili sentensi iwe ya kawaida na ionyeshe tendo la kawaida au endelevu. Viashiria vyote vya tanbihi vimewekwa katika matini kuu.
