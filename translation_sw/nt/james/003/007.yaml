  text: πᾶσα γὰρ φύσις θηρίων τε καὶ πετεινῶν ἑρπετῶν τε καὶ ἐναλίων δαμάζεται καὶ δεδάμασται τῇ φύσει τῇ ἀνθρωπίνῃ·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/007.yaml
  text: For every kind of beast and bird[a], of reptile and sea creature, is being tamed and has been tamed by humankind.
translation:
  language: sw
  text: Kwa maana kila aina ya wanyama wa porini na ndege, ya viumbe vitambaavyo na viumbe wa baharini, hutiishwa na imetiishwa na wanadamu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa asili ya kibinadamu” au “na jamii ya wanadamu.” Kifungu cha Kigiriki τῇ φύσει τῇ ἀνθρωπίνῃ kinaweza kumaanisha wanadamu kwa ujumla, au kwa maana ya kidhahania zaidi asili au nyanja ya kibinadamu. Matini kuu imechukua maana ya wanadamu kwa ujumla.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσα ... φύσις
  choice: kila aina
  rationale: Katika orodha hii ya viumbe, φύσις ina maana ya aina au jamii; “kila aina” ni Kiswahili cha kawaida na huhifadhi nguvu ya πᾶσα.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Kiunganishi hiki kinaonyesha kuwa sentensi inaeleza kauli iliyotangulia.
- source_word: θηρίων
  choice: wanyama wa porini
  rationale: Neno hili kwa kawaida humaanisha wanyama wasiofugwa; tafsiri hii ni wazi na ya kawaida kuliko “hayawani.”
- source_word: πετεινῶν
  choice: ndege
  rationale: Hii ndiyo tafsiri ya kawaida na fupi ya viumbe warukao katika orodha hii.
- source_word: ἑρπετῶν
  choice: viumbe vitambaavyo
  rationale: Neno la Kigiriki linaweza kujumuisha viumbe mbalimbali vinavyotambaa, si reptilia pekee; usemi huu huhifadhi upana huo.
- source_word: ἐναλίων
  choice: viumbe wa baharini
  rationale: Neno hili linataja kwa upana viumbe wanaoishi baharini.
- source_word: δαμάζεται
  choice: inafugwa
  rationale: Wakati wa sasa wa kutendwa unaonyesha tendo linaloendelea au linalotokea kwa ujumla.
- source_word: δεδάμασται
  choice: imekwisha kufugwa
  rationale: Kauli timilifu ya kutendwa inaonyesha tendo lililokamilika lenye matokeo yanayoendelea; “imekwisha” hutofautisha kitenzi hiki na cha kwanza.
- source_word: τῇ φύσει τῇ ἀνθρωπίνῃ
  choice: na wanadamu
  rationale: Katika muktadha huu kifungu kinaeleweka kwa kawaida kama mtendaji wa pamoja, yaani jamii ya wanadamu; “na” huonyesha mtendaji katika sentensi ya kutendwa.
theological_decisions:
- issue: Maana ya τῇ φύσει τῇ ἀνθρωπίνῃ
  choice: na wanadamu
  alternative: kwa asili ya kibinadamu / na jamii ya wanadamu
  rationale: Matini kuu inachukua kifungu hiki kwa maana ya wanadamu kwa pamoja, huku tanbihi ikihifadhi uwezekano wa maana ya kidhahania zaidi ya asili au nyanja ya kibinadamu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa orodha na tofauti kati ya tendo linaloendelea na tendo lililokamilika zimehifadhiwa bila kufanya sentensi kuwa ngumu kupita kiasi.
