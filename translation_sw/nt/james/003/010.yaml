  yaml_path: translation/nt/james/003/010.yaml
  text: From the same mouth come blessing and cursing. My brothers[a], these things ought not to be so.
translation:
  language: sw
  text: Kutoka katika kinywa kilekile hutoka baraka na laana. Ndugu zangu[a], mambo haya hayapaswi kuwa hivyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki kinasema “ndugu zangu” kwa kutumia umbo la kiume; katika muktadha, huenda Yakobo anaiambia jumuiya yote ya waamini, wanaume na wanawake.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τοῦ αὐτοῦ στόματος
  choice: Katika kinywa kilekile
  rationale: Muundo huu wa Kiswahili unahifadhi picha ya maneno kutoka katika chanzo kilekile, yaani kinywa kimoja, kwa lugha ya kawaida na yenye hadhi.
- source_word: ἐξέρχεται
  choice: hutoka
  rationale: Huwasilisha tendo la maneno kutoka kinywani; hali ya mazoea inayodokezwa na muktadha inaelezwa kwa kiambishi hu-.
- source_word: εὐλογία
  choice: baraka
  rationale: Neno hili linadumisha maana ya usemi wa kubariki na tofauti yake ya moja kwa moja na laana.
- source_word: κατάρα
  choice: laana
  rationale: Ni neno la kawaida la Kiswahili kwa usemi wa kulaani na linaoana vizuri na 'baraka'.
- source_word: οὐ χρή
  choice: hayapaswi
  rationale: Hueleza kutofaa kwa jambo kimaadili na wajibu kwamba lisitendeke, bila kuzidisha nguvu ya kauli ya Kigiriki.
- source_word: ἀδελφοί μου
  choice: Ndugu zangu[a]
  rationale: '''Ndugu'' ni neno la asili na la kawaida katika Kiswahili; linaweza kutaja wanaume au jumuiya mchanganyiko. Tanbihi inaweka wazi kwamba umbo la Kigiriki ni la kiume kwa sarufi.'
- source_word: ταῦτα οὕτως γίνεσθαι
  choice: mambo haya hayapaswi kuwa hivyo
  rationale: Tafsiri hii inahifadhi wingi wa ταῦτα na maana ya οὕτως, huku ikitoa sentensi ya Kiswahili iliyo wazi na ya kawaida.
theological_decisions:
- issue: Kauli ya kindugu yenye jinsia katika ἀδελφοί μου
  choice: Ndugu zangu[a]
  alternative: Ndugu zangu wa kiume; ndugu zangu wa kiume na wa kike
  rationale: Umbo la Kigiriki ni la kiume kwa sarufi, lakini katika muktadha huenda Yakobo anaiambia jumuiya yote ya waamini. Kiswahili 'ndugu' huhifadhi lugha ya kifamilia bila kulazimisha jinsia ambayo neno la kawaida la Kiswahili halibainishi; tanbihi huhifadhi taarifa ya umbo la Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye hadhi na inayoeleweka kwa urahisi. Taswira ya kinywa kimoja kutoa baraka na laana imehifadhiwa, pamoja na msisitizo wa kutofaa kwa hali hiyo.
