id: JAS.3.9
reference: James 3:9
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐν αὐτῇ εὐλογοῦμεν τὸν ⸀κύριον καὶ πατέρα, καὶ ἐν αὐτῇ καταρώμεθα τοὺς ἀνθρώπους τοὺς καθ’ ὁμοίωσιν θεοῦ γεγονότας·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/009.yaml
  text: With it we bless the Lord and Father[b][a], and with it we curse people who have been made according to the likeness of God.
translation:
  language: sw
  text: Kwa ulimi huo tunambariki Bwana na Baba[a], na kwa ulimi huo tunawalaani watu[b] walioumbwa kwa mfano wa Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata muundo wa maneno kwa karibu zaidi, “Bwana na Baba”; kirai hiki kinaweza kueleweka kuwa “Bwana, ambaye ni Baba,” au kuwa utajo wenye majina mawili ya Mungu.
    reason: alternative_reading
  - marker: b
    text: Au “wanadamu”; neno la Kigiriki hapa linawahusu wanadamu kwa ujumla.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν αὐτῇ
  choice: kwa ulimi huo
  rationale: Kiwakilishi kinarejelea ulimi katika muktadha uliotangulia. Kutaja “ulimi” moja kwa moja kunafanya rejeo hilo liwe wazi na la kawaida katika Kiswahili, huku “kwa” ikionyesha chombo kinachotumiwa.
- source_word: εὐλογοῦμεν
  choice: tunambariki
  rationale: “Kubariki” inadumisha maana ya msingi na pia tofauti ya moja kwa moja na “kulaani” katika sehemu ya pili ya mstari.
- source_word: τὸν κύριον καὶ πατέρα
  choice: Bwana na Baba
  rationale: Muundo huu unahifadhi uratibu wa Kigiriki bila kulazimisha uamuzi kwamba majina hayo lazima yafafanuliwe waziwazi kuwa ya kiambatano au jozi.
- source_word: καταρώμεθα
  choice: tunawalaani
  rationale: Hili ni neno la moja kwa moja na lenye uzito unaolingana na kitenzi cha Kigiriki, huku likihifadhi tofauti dhidi ya “tunambariki.”
- source_word: τοὺς ἀνθρώπους
  choice: watu
  rationale: Neno la Kigiriki linawahusu wanadamu kwa ujumla, si wanaume pekee; “watu” ni tafsiri ya kawaida na jumuishi katika Kiswahili.
- source_word: τοὺς καθ’ ὁμοίωσιν θεοῦ γεγονότας
  choice: walioumbwa kwa mfano wa Mungu
  rationale: “Walioumbwa” huwasilisha hali iliyotokana na tendo la Mungu na mwangwi wa simulizi la uumbaji; “kwa mfano wa Mungu” huhifadhi lugha ya ulinganifu ya kirai cha Kigiriki.
theological_decisions:
- issue: Uhusiano kati ya “Bwana” na “Baba”
  choice: Bwana na Baba
  alternative: Bwana, yaani Baba
  rationale: Kigiriki kinaweza kueleweka kiambatano—Bwana ambaye ni Baba—au kama utajo wenye sehemu mbili. Tafsiri haifungi maana katika mojawapo bila ulazima.
- issue: Rejeo la jumla la ἀνθρώπους
  choice: watu
  alternative: wanadamu
  rationale: Mstari unawahusu wanadamu wote kama walioumbwa kwa mfano wa Mungu, hivyo “watu” huepuka kuifanya maana ihusu wanaume pekee.
- issue: Maana ya γεγονότας katika mwangwi wa uumbaji
  choice: walioumbwa
  alternative: waliopata kuwako
  rationale: Muktadha wa “mfano wa Mungu” unaelekeza kwenye uumbaji. “Walioumbwa” ni ya kawaida na yenye kueleweka, ingawa Kigiriki chenyewe kinaweza kutafsiriwa kwa upana zaidi kama kupata kuwako.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Kurudiwa kwa “kwa ulimi huo” kunahifadhi ulinganifu wa sentensi na kufanya chombo kinachotumiwa kiwe wazi. Alama zote za tanbihi zimewekwa baada ya maneno yanayohusika.
