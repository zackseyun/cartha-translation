source:
  edition: SBLGNT
  text: Τίς σοφὸς καὶ ἐπιστήμων ἐν ὑμῖν; δειξάτω ἐκ τῆς καλῆς ἀναστροφῆς τὰ ἔργα αὐτοῦ ἐν πραΰτητι σοφίας.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/013.yaml
  text: Who is wise and understanding among you? Let him show his works by his good conduct[b][a], in the meekness of wisdom.
translation:
  language: sw
  text: Ni nani aliye na hekima na ufahamu miongoni mwenu? Aonyeshe kwa mwenendo wake mzuri matendo yake katika upole wa hekima.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa upole utokanao na hekima.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τίς
  choice: Ni nani
  rationale: Hutanguliza swali la balagha linalotafuta mtu mwenye sifa zinazofuata; hii ndiyo Kiswahili cha kawaida na cha asili.
- source_word: σοφὸς
  choice: aliye na hekima
  rationale: Huwasilisha hekima ya kimaadili na ya kimatendo, si akili tu.
- source_word: ἐπιστήμων
  choice: ufahamu
  rationale: Hufaa kuambatana na 'hekima' na huonyesha mtu mwenye uelewa au maarifa ya kina katika muktadha huu wa maadili.
- source_word: ἐν ὑμῖν
  choice: miongoni mwenu
  rationale: Ni usemi wa kawaida unaoonyesha kuwa mtu huyo ni sehemu ya jumuiya inayozungumziwa.
- source_word: δειξάτω
  choice: Na aonyeshe
  rationale: Huhifadhi nguvu ya amri ya nafsi ya tatu umoja kwa Kiswahili cha asili, bila kulazimisha jinsia ambayo sarufi ya Kiswahili haiwekwi hapa.
- source_word: ἐκ τῆς καλῆς ἀναστροφῆς
  choice: kwa mwenendo wake mzuri
  rationale: ἐκ hapa huonyesha njia au chanzo, na ἀναστροφή ni mwenendo au namna ya maisha. Kiwakilishi 'wake' kinafafanua kwa kawaida kuwa ni mwenendo wa mtu huyo.
- source_word: τὰ ἔργα αὐτοῦ
  choice: matendo yake
  rationale: Hutoa maana ya vitendo halisi na huhifadhi umilikaji ulio wazi katika Kigiriki.
- source_word: ἐν πραΰτητι σοφίας
  choice: kwa upole utokanao na hekima
  rationale: 'Hutoa kwa asili uhusiano wenye uwezekano mkubwa kati ya πραΰτης na σοφία: upole unaotokana na hekima, huku tafsiri ya karibu zaidi ya kimuundo ikihifadhiwa katika tanbihi.'
theological_decisions:
- issue: Uhusiano wa πραΰτης na σοφία
  choice: kwa upole utokanao na hekima
  alternative: katika upole wa hekima
  rationale: Muundo wa Kigiriki unaweza kueleweka kuwa upole unaotokana na hekima au upole unaotambulishwa na hekima. Matini kuu inatumia Kiswahili cha asili, na tanbihi huhifadhi mbadala huo wa karibu zaidi na muundo wa asili.
- issue: Amri ya umoja yenye nguvu ya uwakilishi
  choice: Na aonyeshe
  alternative: Mtu huyo na aonyeshe
  rationale: Kigiriki kina amri ya umoja wa kiume yenye nguvu ya kumwakilisha mtu yeyote wa aina hiyo. Kiswahili hakihitaji kuonyesha jinsia katika muundo huu, lakini umoja na nguvu ya amri zimehifadhiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. 'Mwenendo' ni neno la kawaida katika muktadha wa maadili; 'upole utokanao na hekima' ni wa asili zaidi kuliko muundo mzito wa kijina.
