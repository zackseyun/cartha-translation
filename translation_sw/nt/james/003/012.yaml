  text: μὴ δύναται, ἀδελφοί μου, συκῆ ἐλαίας ποιῆσαι ἢ ἄμπελος σῦκα; ⸂οὔτε ἁλυκὸν⸃ γλυκὺ ποιῆσαι ὕδωρ.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/012.yaml
  text: My brothers[a], can a fig tree produce olives[c][b], or a grapevine figs? Neither can salt water produce fresh water.
translation:
  language: sw
  text: Ndugu zangu[a], je, mtini unaweza kuzaa zeituni, au mzabibu kuzaa tini? Wala maji ya chumvi[c] hayawezi kutoa maji yasiyo na chumvi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki hutumia umbo la wingi la kiume, “ndugu zangu,” lakini umbo hili linaweza kutumiwa kulihutubia kundi lenye wanaume na wanawake.
    reason: lexical_alternative
  - marker: b
    text: Kigiriki kinasema kihalisi “maji matamu”; hapa maana yake ni maji yasiyo na chumvi, kinyume cha maji ya chumvi.
    reason: lexical_alternative
  - marker: c
    text: 'Kishazi cha mwisho kimefupishwa katika Kigiriki. Kwa kuzingatia mfano wa chemchemi katika mstari uliotangulia, kinaweza pia kueleweka hivi: “Wala chemchemi yenye chumvi haiwezi kutoa maji yasiyo na chumvi.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀδελφοί μου
  choice: Ndugu zangu
  rationale: Hili ni neno la kawaida na lenye heshima la kuwataja waumini wenzake. Ingawa umbo la Kigiriki ni la kiume katika wingi, katika muktadha linaweza kulihusu kundi lote; tanbihi inahifadhi habari hiyo bila kufanya Kiswahili kisikike cha kulazimishwa.
- source_word: μὴ δύναται
  choice: je, ... unaweza ...?
  rationale: μή inaanzisha swali la balagha linalotarajia jibu hasi. Muundo wa swali katika Kiswahili unahifadhi nguvu hiyo kwa njia ya kawaida.
- source_word: συκῆ
  choice: mtini
  rationale: Neno hili linamaanisha mti unaozaa tini, si tunda lenyewe.
- source_word: ἐλαίας ποιῆσαι
  choice: kuzaa zeituni
  rationale: Katika habari ya mti na matunda, ποιέω ina maana ya kutoa au kuzaa. 'Kuzaa' ni kitenzi cha kawaida kwa mti kutoa matunda.
- source_word: ἄμπελος
  choice: mzabibu
  rationale: Hili ni jina la kawaida la mmea unaozaa zabibu na linadumisha mfano wa kilimo.
- source_word: σῦκα
  choice: tini
  rationale: Ni wingi wa tunda la mtini; katika Kiswahili jina 'tini' hutumika bila mabadiliko ya umbo.
- source_word: οὔτε ἁλυκὸν
  choice: Wala maji ya chumvi
  rationale: Kigiriki kina usemi uliofupishwa, yaani 'wala chenye chumvi.' Kutaja 'maji' kunakamilisha maana kwa kawaida, huku tanbihi ikionyesha uwezekano wa kuelewa 'chemchemi ya maji ya chumvi' kutokana na mstari uliotangulia.
- source_word: γλυκὺ ποιῆσαι ὕδωρ
  choice: kutoa maji matamu
  rationale: '''Matamu'' ndilo neno la moja kwa moja la γλυκύ, na katika muktadha wa maji linamaanisha maji yasiyo na chumvi, kinyume cha maji ya chumvi.'
