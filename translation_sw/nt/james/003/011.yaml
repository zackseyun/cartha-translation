  text: Does a spring pour out both sweet and bitter water from the same opening?[a]
translation:
  language: sw
  text: Je, chemchemi hutoa kutoka tundu lilelile maji matamu na maji machungu?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa tafsiri ya karibu zaidi na maneno ya asili: “Je, chemchemi hububujisha kilicho kitamu na kilicho kichungu kutoka tundu lilelile?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: μήτι
  choice: Je, ...?
  rationale: μήτι huanzisha swali la balagha linalotarajia jibu la kukataa. Katika Kiswahili, muundo wa “Je, ...?” pamoja na jambo lisilo la kawaida linaloulizwa huwasilisha nguvu hiyo kwa njia ya kawaida bila kuongeza kikanushi kisichotajwa wazi.
- source_word: πηγή
  choice: chemchemi
  rationale: πηγή hapa ni chanzo cha asili cha maji; “chemchemi” ndiyo istilahi ya kawaida na sahihi katika Kiswahili cha Afrika Mashariki.
- source_word: ἐκ τῆς αὐτῆς ὀπῆς
  choice: kutoka tundu lilelile
  rationale: ὀπή ni tundu au uwazi ambako maji hutokea. “Tundu lilelile” ni halisi, wazi, na huhifadhi mkazo wa αὐτῆς bila kuingiza sitiari ya “kinywa.”
- source_word: βρύει
  choice: hutoa
  rationale: βρύω humaanisha kububujika au kutiririka kutoka chanzo. “Hutoa” ni ya kawaida na inaeleweka hapa, huku maana halisi zaidi ya “hububujisha” ikihifadhiwa katika tanbihi.
- source_word: τὸ γλυκύ
  choice: maji matamu
  rationale: Kivumishi hiki kimetumiwa kama nomino na kinarejelea maji. Kuongeza “maji” ni ufafanuzi wa kisarufi unaohitajika katika Kiswahili na huhifadhi maana ya msingi ya “matamu.”
- source_word: τὸ πικρόν
  choice: maji machungu
  rationale: Kivumishi hiki kimetumiwa kama nomino sambamba na τὸ γλυκύ na kinarejelea maji; “maji machungu” huhifadhi utofautishaji wa moja kwa moja wa maandishi.
theological_decisions: []
