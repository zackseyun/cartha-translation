  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Swali la balagha limehifadhiwa kwa muundo wa kawaida wa “Je, ...?”; tanbihi inaonyesha kwa ukaribu zaidi vitenzi na vivumishi vilivyotumiwa kama nomino katika Kigiriki.
