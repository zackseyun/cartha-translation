base_translation:
  language: en
  yaml_path: translation/nt/james/003/014.yaml
  text: But if you have bitter jealousy and selfish ambition in your hearts[d][c][b][a], do not boast and lie against the truth.
translation:
  language: sw
  text: Lakini ikiwa mna wivu mchungu[a] na tamaa ya kujitafutia makuu[b] mioyoni mwenu,[c] msijisifu wala msiseme uongo dhidi ya kweli.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “bidii chungu” au “husuda chungu.”
    reason: lexical_alternative
  - marker: b
    text: Au “ushindani wa ubinafsi” au “roho ya mafarakano.”
    reason: lexical_alternative
  - marker: c
    text: Kwa neno kwa neno, “moyoni mwenu”; umoja wa Kigiriki unatumiwa kwa kila mmoja katika kundi.
    reason: source_form
  - marker: d
    text: Au “kusema uongo kinyume cha kweli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ζῆλον πικρὸν
  choice: wivu mchungu
  rationale: Katika muktadha huu ζῆλος ina maana hasi ya wivu, kwa kuwa imeunganishwa na ἐριθεία na inatofautishwa na hekima itokayo juu. “Mchungu” huhifadhi maana ya πικρόν.
- source_word: ἐριθείαν
  choice: tamaa ya kujitafutia makuu
  rationale: Kirai hiki kinaeleza msukumo wa ubinafsi wa kutafuta hadhi au faida binafsi, huku tanbihi ikihifadhi maana zinazohusiana za ushindani na mafarakano.
- source_word: ἐν τῇ καρδίᾳ ὑμῶν
  choice: mioyoni mwenu
  rationale: Ingawa Kigiriki kina nomino ya umoja pamoja na kiwakilishi cha wingi, huo ni umoja wa kigawanyo. Wingi “mioyoni mwenu” ni wa kawaida na wazi katika Kiswahili unapolihutubia kundi.
- source_word: μὴ κατακαυχᾶσθε
  choice: msijisifu
  rationale: Huwasilisha katazo la kujigamba au kujitukuza kwa kiburi kwa lugha ya kawaida na yenye heshima.
- source_word: ψεύδεσθε κατὰ τῆς ἀληθείας
  choice: kusema uongo dhidi ya kweli
  rationale: “Kusema uongo” huhifadhi nguvu ya ψεύδεσθε, na “dhidi ya kweli” huonyesha upinzani unaoletwa na κατά pamoja na nomino katika hali ya genitivi.
- source_word: εἰ δὲ
  choice: Lakini ikiwa
  rationale: Huonyesha tofauti na maelezo yaliyotangulia kuhusu hekima itokayo juu.
theological_decisions:
- issue: Maana ya “kweli”
  choice: kweli
  alternative: kweli ya Injili; njia ya kweli ya hekima; kusema mambo ya kweli
  rationale: 'Neno limeachwa na upana wake wa asili: linaweza kuhusisha kweli ya Mungu inayopingana na kujisifu kwa udanganyifu, bila kulibana kuwa mfumo maalumu wa mafundisho au uaminifu wa maneno pekee.'
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Mioyoni mwenu” ni usemi wa kawaida kwa kundi; “tamaa ya kujitafutia makuu” inaeleweka kwa wasomaji wa kawaida huku tanbihi zikihifadhi vivuli vya ushindani na mafarakano.
