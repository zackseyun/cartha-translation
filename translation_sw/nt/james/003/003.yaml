  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ⸂εἰ δὲ⸃ τῶν ἵππων τοὺς χαλινοὺς εἰς τὰ στόματα βάλλομεν ⸀εἰς τὸ πείθεσθαι αὐτοὺς ἡμῖν, καὶ ὅλον τὸ σῶμα αὐτῶν μετάγομεν.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/003.yaml
  text: If we put bits into the mouths of horses so that they obey us[a], we also guide their whole bodies.
translation:
  language: sw
  text: Ikiwa tunatia lijamu[a] vinywani mwa farasi ili watutii, tunaelekeza pia miili yao yote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “hatamu”; hapa neno hilo linarejelea hasa sehemu inayowekwa kinywani mwa farasi.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: Ikiwa
  rationale: Hutambulisha mfano wa sharti wenye kiunganishi hafifu. “Ikiwa” ni ya kawaida na huhifadhi maana ya sharti bila kuongeza neno la wakati lisilokuwapo katika chanzo.
- source_word: χαλινοὺς
  choice: lijamu
  rationale: Katika muktadha huu neno linarejelea hasa kifaa kinachowekwa kinywani mwa farasi ili kumwelekeza. “Lijamu” ni neno linalofaa na linaloeleweka katika Kiswahili sanifu.
- source_word: εἰς τὰ στόματα βάλλομεν
  choice: tunatia ... vinywani
  rationale: Muundo huu unaonyesha kuingiza au kuweka kitu ndani ya vinywa. “Tunatia ... vinywani” ni wa asili katika Kiswahili na huhifadhi wazo la mwendo wa kuingia ndani.
- source_word: εἰς τὸ πείθεσθαι αὐτοὺς ἡμῖν
  choice: ili watutii
  rationale: Muundo wa εἰς pamoja na kitenzi-jina unaonyesha kusudi au matokeo, na πείθεσθαι pamoja na ἡμῖν humaanisha kututii. “Ili watutii” huhifadhi maana hiyo bila kuzidisha kiwango cha usababishaji.
- source_word: καὶ ὅλον τὸ σῶμα αὐτῶν μετάγομεν
  choice: tunaelekeza pia miili yao yote
  rationale: μετάγομεν humaanisha kuelekeza au kuongoza mwendo. Ingawa σώμα ni umoja wa kigawanyo katika Kigiriki, “miili yao yote” ni Kiswahili cha kawaida kwa farasi wengi.
