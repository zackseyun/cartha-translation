source:
  edition: SBLGNT
  text: πολλὰ γὰρ πταίομεν ἅπαντες. εἴ τις ἐν λόγῳ οὐ πταίει, οὗτος τέλειος ἀνήρ, δυνατὸς χαλιναγωγῆσαι καὶ ὅλον τὸ σῶμα.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/002.yaml
  text: For we all stumble in many ways[a]. If anyone does not stumble in word, this one is a mature man[c][b], able also to bridle the whole body.
translation:
  language: sw
  text: Kwa maana sisi sote hujikwaa kwa njia nyingi. Ikiwa mtu hajikwai katika usemi,[a] huyo ni mtu[c] mkomavu[b], anayeweza pia kuutia mwili wote hatamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno halisi, “katika neno,” yaani, katika usemi au yale anayosema.
    reason: lexical_alternative
  - marker: b
    text: Au “mkamilifu” au “kamili.” Neno la Kigiriki τέλειος linaweza kumaanisha mkamilifu, kamili, au mkomavu; hapa huenda linamaanisha ukomavu wa maadili badala ya kutokuwa na dhambi kabisa.
    reason: lexical_alternative
  - marker: c
    text: Kigiriki kinasema “mwanamume” (ἀνήρ), lakini hapa neno hilo limetumiwa kwa uwakilishi katika kauli ya jumla inayomhusu mtu yeyote.
    reason: cultural_note
lexical_decisions:
- source_word: πολλὰ
  choice: kwa njia nyingi
  rationale: Ni matumizi ya kielezi yanayoonyesha kwamba kujikwaa hutokea kwa namna au katika maeneo mengi; tafsiri hii ni ya asili na haifanyi neno hilo kuwa shamirisho la moja kwa moja.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Inaendeleza sababu au maelezo yanayounga mkono onyo lililotangulia kuhusu walimu.
- source_word: πταίομεν / πταίει
  choice: hujikwaa / hajikwai
  rationale: Inahifadhi taswira ya kujikwaa huku ikidokeza kushindwa kimaadili, badala ya kuibadili moja kwa moja kuwa ‘kutenda dhambi.’
- source_word: ἅπαντες
  choice: sisi sote
  rationale: Inahifadhi msisitizo wa kujumuisha kila mtu, pamoja na mwandishi mwenyewe.
- source_word: εἴ τις
  choice: Ikiwa mtu
  rationale: Ni sharti la jumla linalomhusu mtu yeyote.
- source_word: ἐν λόγῳ
  choice: katika yale anayosema
  rationale: Katika muktadha huu λόγος inahusu usemi; tungo hii ni ya kawaida katika Kiswahili na inaeleza maana bila kuibana kuwa neno moja tu.
- source_word: οὗτος
  choice: huyo
  rationale: Inahifadhi nguvu ya kiwakilishi kionyeshi kinachomrejelea kwa msisitizo mtu aliyetajwa katika sharti.
- source_word: τέλειος
  choice: mkomavu
  rationale: Katika muktadha wa Yakobo, neno hili linaelekea kueleza ukomavu au utimilifu wa tabia, si hali ya kutokuwa na dhambi kabisa.
- source_word: ἀνήρ
  choice: mtu
  rationale: Ingawa neno la Kigiriki lina umbo la kiume, hapa limetumiwa katika kauli ya jumla baada ya εἴ τις; ‘mtu’ huwasilisha matumizi hayo ya uwakilishi kwa Kiswahili cha kawaida bila kubadili matumizi kuwa yanawahusu wanaume pekee.
- source_word: δυνατὸς
  choice: anayeweza
  rationale: Huwasilisha moja kwa moja uwezo wa kujitawala unaoelezwa.
- source_word: χαλιναγωγῆσαι
  choice: kuutia hatamu
  rationale: Inahifadhi taswira ya hatamu ambayo Yakobo anaendeleza katika mistari inayofuata.
- source_word: καὶ
  choice: pia
  rationale: 'Inaonyesha nyongeza: mtu huyo anaweza kutawala si usemi wake tu, bali mwili wote pia.'
theological_decisions:
- issue: Maana ya τέλειος katika muktadha wa maadili
  choice: mkomavu
  alternative: mkamilifu / kamili
  rationale: ‘Mkomavu’ huonyesha ukamilifu wa tabia unaokusudiwa bila kudai kutokuwa na dhambi kabisa, jambo ambalo lingepingana na kauli ya karibu kwamba sisi sote hujikwaa.
- issue: Matumizi ya uwakilishi ya ἀνήρ
  choice: mtu, huku umbo la kiume la Kigiriki likielezwa katika tanbihi
  alternative: mwanamume
  rationale: Kauli inaanza na ‘ikiwa mtu’ na inalenga hali ya jumla. ‘Mwanamume’ ingeweza kuifanya isikike kana kwamba inawahusu wanaume pekee, ilhali tanbihi inalinda taarifa kwamba Kigiriki kimetumia neno lenye umbo la kiume.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Hujikwaa’ na ‘kuutia hatamu’ zinahifadhi taswira za Kigiriki, huku ‘katika yale anayosema’ ikifanya usemi uwe wazi na wa kawaida kwa msomaji wa leo.
