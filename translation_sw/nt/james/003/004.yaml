base_translation:
  language: en
  yaml_path: translation/nt/james/003/004.yaml
  text: 'Look also at the ships: though they are so large and are driven by strong winds[a], they are steered by a very small rudder wherever the inclination of the one steering wills.'
translation:
  language: sw
  text: 'Angalieni pia meli: ingawa ni kubwa hivyo na husukumwa na pepo kali, huelekezwa kwa usukani mdogo sana kwenda popote anapotaka yule anayeiongoza.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa uhalisi zaidi: “popote msukumo wa yule anayeiongoza unapotaka”; yaani, popote anapotaka kwenda yule anayeshika usukani.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ καὶ τὰ πλοῖα
  choice: Angalieni pia meli
  rationale: “Angalieni” ni mwito wa kawaida wa kuelekeza fikira, na “pia” linaunganisha mfano huu na ule uliotangulia.
- source_word: τηλικαῦτα ὄντα
  choice: ingawa ni kubwa hivyo
  rationale: Muundo huu unaonyesha ukubwa wa meli na tofauti yake na udogo wa usukani.
- source_word: ὑπὸ ἀνέμων σκληρῶν ἐλαυνόμενα
  choice: husukumwa na pepo kali
  rationale: “Pepo kali” linaonyesha nguvu ya upepo, huku “husukumwa” likihifadhi hali ya kutendwa ya kitenzi cha Kigiriki.
- source_word: μετάγεται
  choice: huelekezwa
  rationale: Katika muktadha wa meli na usukani, neno hili linaeleza kugeuzwa au kuongozwa kuelekea upande fulani.
- source_word: ὑπὸ ἐλαχίστου πηδαλίου
  choice: kwa usukani mdogo sana
  rationale: “Mdogo sana” linaonyesha msisitizo wa ἐλαχίστου bila kudai kwamba huo ndio usukani mdogo kuliko wote kabisa.
- source_word: ὅπου ἡ ὁρμὴ τοῦ εὐθύνοντος βούλεται
  choice: kwenda popote anapotaka yule anayeiongoza
  rationale: Hii ni Kiswahili cha kawaida kinachowasilisha mahali panapokusudiwa na matakwa ya anayeongoza, bila kupoteza wazo la uamuzi wake.
theological_decisions:
- issue: Kiwango cha uhalisi katika maelezo ya nia ya anayeongoza
  choice: kwenda popote anapotaka yule anayeiongoza
  alternative: popote msukumo wa yule anayeiongoza unapotaka
  rationale: Tafsiri kuu inaepuka usemi usio wa kawaida wa kufanya “msukumo” kuwa mhusika anayetaka, lakini tanbihi inadumisha muundo halisi na upana wa maana wa ὁρμή. Hakuna fundisho maalumu la kidhehebu linaloingizwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Upatanisho wa kisarufi wa “meli” umetumiwa kwa namna ya kawaida ya Kiswahili.
