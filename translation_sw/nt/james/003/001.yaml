base_translation:
  language: en
  yaml_path: translation/nt/james/003/001.yaml
  text: Not many of you should become teachers[a], my brothers, knowing that we will receive a greater judgment.
translation:
  language: sw
  text: Ndugu zangu, si wengi wenu mnapaswa kuwa walimu,[a] mkijua kwamba tutapokea hukumu kubwa zaidi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno “ndugu” hapa yaelekea linawalenga washiriki wote wa jumuiya, wakiwemo wanawake.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ πολλοὶ
  choice: msiwe wengi wenu
  rationale: Μή pamoja na amri ya wakati uliopo hutoa katazo au onyo. Kauli hii ya Kiswahili inaelekeza katazo kwa wasikilizaji moja kwa moja na kuhifadhi wazo la kutokuwa wengi.
- source_word: διδάσκαλοι
  choice: walimu
  rationale: Neno hili humaanisha walimu; tafsiri hii ni ya kawaida na haiingizi dhana ya cheo rasmi ambayo haijaelezwa katika aya.
- source_word: γίνεσθε
  choice: kuwa
  rationale: Katika muundo huu, 'kuwa walimu' ni Kiswahili cha asili kinachoonyesha kuingia katika nafasi au jukumu la kufundisha.
- source_word: ἀδελφοί μου
  choice: Ndugu zangu
  rationale: '''Ndugu'' ni neno la kawaida na lenye heshima katika Kiswahili kwa watu wa jumuiya moja; linaweza kutumiwa kwa kundi linalojumuisha wanaume na wanawake, kama inavyowezekana katika muktadha huu.'
- source_word: εἰδότες
  choice: mkijua
  rationale: Huhifadhi umbo la kishirikishi na kuacha uhusiano wake na katazo ukiwa wazi bila kuulazimisha kuwa sababu kwa kutumia 'kwa sababu'.
- source_word: μεῖζον
  choice: kubwa zaidi
  rationale: Hutoa maana ya ulinganisho ya 'greater' kwa ukaribu, bila kufasiri mapema kuwa 'kali zaidi'.
- source_word: κρίμα
  choice: hukumu
  rationale: Ni neno pana linaloweza kumaanisha hukumu au uamuzi; haliongezi dhana maalumu ya kuhukumiwa adhabu ya mwisho.
- source_word: λημψόμεθα
  choice: sisi tutapokea
  rationale: Huhifadhi nafsi ya kwanza wingi na maana ya moja kwa moja ya 'tutapokea'; kiwakilishi 'sisi' kinakazia kwamba mwandishi anajihusisha na kundi hilo.
theological_decisions:
- issue: Upeo wa ἀδελφοί μου katika jumuiya yenye wanaume na wanawake
  choice: Ndugu zangu
  alternative: Ndugu zangu wa kiume / ndugu zangu wanaume kwa maandishi makuu, kisha ufafanuzi wa ujumuishi katika tanbihi
  rationale: Katika Kiswahili, 'ndugu zangu' kwa kawaida huweza kuiambia jumuiya nzima bila kubadili picha ya kifamilia ya Kigiriki. Tanbihi inaweka wazi kwamba wanawake huenda wanajumuishwa.
- issue: Nguvu ya κρίμα katika onyo kwa walimu
  choice: hukumu
  alternative: adhabu; kuhukumiwa
  rationale: Neno la Kigiriki halilazimishi maana maalumu ya hukumu ya adhabu ya mwisho. 'Hukumu' huhifadhi upana na mvutano wa kiteolojia wa onyo.
- issue: Maana ya μεῖζον κρίμα
  choice: hukumu kubwa zaidi
  alternative: hukumu kali zaidi
  rationale: Tafsiri iliyochaguliwa inafuata kwa karibu ulinganisho wa μεῖζον. 'Kali zaidi' ni tafsiri inayowezekana kimuktadha, lakini inaeleza namna ya ukali kwa uwazi zaidi kuliko Kigiriki chenyewe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mpangilio umewekwa kwa mtiririko wa asili wa Kiswahili huku ukihifadhi katazo, kishirikishi 'mkijua,' nafsi ya kwanza wingi, na upana wa neno 'hukumu'.
