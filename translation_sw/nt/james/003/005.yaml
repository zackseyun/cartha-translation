  source_fidelity: 'Tafsiri inadumisha picha ya msingi ya Kigiriki: ulimi ni kiungo kidogo lakini hujigamba kwa mambo makubwa, kisha mfano wa moto na ὕλη. Uamuzi wa kutafsiri ἡλίκον πῦρ kama “moto mdogo” ni wa kimuktadha badala ya ulinganifu wa kileksika wa moja kwa moja, lakini utata huo umehifadhiwa wazi katika tanbihi kwa kutaja usomaji wa “moto mkubwa.”'
