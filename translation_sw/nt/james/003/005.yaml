id: JAS.3.5
reference: James 3:5
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οὕτως καὶ ἡ γλῶσσα μικρὸν μέλος ἐστὶν καὶ ⸂μεγάλα αὐχεῖ⸃. Ἰδοὺ ⸀ἡλίκον πῦρ ἡλίκην ὕλην ἀνάπτει·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/005.yaml
  text: So also the tongue is a small member[a], and yet it boasts of great things[b]. See how small a fire sets ablaze so great a forest.
translation:
  language: sw
  text: Vivyo hivyo, ulimi ni kiungo kidogo cha mwili, lakini hujivunia mambo makubwa. Tazama jinsi moto mdogo[a] unavyowasha msitu mkubwa[b]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Tazama jinsi moto mkubwa unavyowasha…” Maneno ya Kiyunani yanaweza kueleweka kama mshangao kuhusu ukubwa wa moto; tafsiri kuu inafuata wazo la chanzo kidogo kuleta matokeo makubwa, linalolingana na ulimi kuwa kiungo kidogo.
    reason: alternative_reading
  - marker: b
    text: Au, “kuni nyingi,” “mbao nyingi,” au “kichaka kikubwa.” Neno la Kiyunani linaweza kumaanisha kwa upana msitu au vitu vinavyoweza kuwaka.
    reason: lexical_alternative
lexical_decisions:
- source_word: γλῶσσα
  choice: ulimi
  rationale: Neno halisi la kiungo cha mwili linadumisha mfano wa Yakobo; maana ya usemi inadokezwa bila kuondoa picha hiyo.
- source_word: μικρὸν μέλος
  choice: kiungo kidogo cha mwili
  rationale: Kauli hii ni wazi kwa msomaji wa kawaida na inadumisha picha ya ulimi kuwa sehemu ndogo ya mwili.
- source_word: μεγάλα αὐχεῖ
  choice: hujivunia mambo makubwa
  rationale: Inawasilisha majigambo au madai makubwa yanayoelezwa na kitenzi αὐχεῖ pamoja na μεγάλα.
- source_word: Ἰδοὺ
  choice: Tazama
  rationale: Ni mwito wa kawaida na wenye heshima unaoelekeza fikira kwenye mfano unaofuata.
- source_word: ἡλίκον πῦρ
  choice: jinsi moto mdogo
  rationale: Muktadha unalinganisha chanzo kidogo na matokeo makubwa, sawa na ulimi ulio kiungo kidogo; hata hivyo, umbo la Kiyunani linaweza kueleweka kwa namna nyingine, nayo imeonyeshwa katika tanbihi.
- source_word: ἡλίκην ὕλην
  choice: msitu mkubwa
  rationale: ὕλη inaweza kumaanisha msitu, kuni, au vitu vinavyoweza kuwaka; ‘msitu’ inatoa picha asilia na wazi ya eneo kubwa linaloteketezwa.
- source_word: ἀνάπτει
  choice: unavyowasha
  rationale: Kitenzi hiki ni cha kawaida katika Kiswahili na kinaeleza moto unaosababisha kitu kingine kushika moto.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima, na inayoeleweka kwa urahisi. ‘Kiungo kidogo cha mwili’ huepuka utata wa ‘kiungo kidogo’ peke yake, huku ‘hujivunia’ ikidumisha tashhisi ya ulimi.
