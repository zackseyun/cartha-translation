  text: ὅπου γὰρ ζῆλος καὶ ἐριθεία, ἐκεῖ ἀκαταστασία καὶ πᾶν φαῦλον πρᾶγμα.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/016.yaml
  text: For where jealousy and selfish ambition are[b][a], there is disorder and every vile practice.
translation:
  language: sw
  text: Kwa maana palipo na wivu[a] na tamaa ya kujitafutia makuu, hapo pana machafuko na kila tendo ovu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “husuda.” Neno la Kigiriki linaweza pia kumaanisha “juhudi,” lakini hapa muktadha wake ni hasi.
    reason: lexical_alternative
  - marker: b
    text: Au “kila jambo baya.” Kwa maana ya moja kwa moja, “kila jambo ovu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου
  choice: palipo na
  rationale: Muundo huu wa Kiswahili unaeleza hali ya jumla inayopatikana mahali fulani na unaendana kwa kawaida na ἐκεῖ, ‘hapo.’
- source_word: γὰρ
  choice: Kwa maana
  rationale: Inaendeleza maelezo yanayothibitisha hoja ya mstari uliotangulia.
- source_word: ζῆλος
  choice: wivu
  rationale: Katika muktadha wa 3:14–15 neno hili lina maana hasi. ‘Wivu’ ni neno la kawaida linaloweza kujumuisha husuda au hamu yenye uchungu dhidi ya mwingine.
- source_word: ἐριθεία
  choice: tamaa ya kujitafutia makuu
  rationale: Kirai hiki kinaonyesha kujitakia cheo au faida kwa ubinafsi na kushindana na wengine, badala ya kutumia ‘ubinafsi’ ambayo ni pana zaidi.
- source_word: ἐκεῖ
  choice: hapo
  rationale: 'Linadumisha ulinganifu wa kimaana na kimtindo: ‘palipo na … hapo pana …’'
- source_word: ἀκαταστασία
  choice: machafuko
  rationale: Neno hilo linaashiria hali ya vurugu, kutotulia, au kuvurugika kwa jamii, si kuchanganyikiwa kwa mawazo tu.
- source_word: πᾶν
  choice: kila
  rationale: Hii ndiyo tafsiri ya kawaida ya Kiswahili inapounganishwa na nomino ya umoja.
- source_word: φαῦλον
  choice: ovu
  rationale: Katika muktadha huu linaonyesha ubaya wa kimaadili; ‘ovu’ ni fupi, wazi, na lenye uzito unaofaa.
- source_word: πρᾶγμα
  choice: tendo
  rationale: Ingawa linaweza kumaanisha ‘jambo,’ hapa linarejelea matokeo halisi ya mwenendo mbaya; ‘tendo’ ni la asili zaidi katika Kiswahili.
theological_decisions:
- issue: Maana ya ζῆλος katika muktadha
  choice: Neno hasi la tabia, limetafsiriwa ‘wivu’
  alternative: ‘husuda’ au ‘juhudi’
  rationale: Mistari ya 14–15 inaweka ζῆλος pamoja na tamaa ya ubinafsi na hekima ya kidunia. Kwa hiyo maana chanya ya ‘juhudi’ haifai hapa, huku ‘husuda’ ikibaki kuwa uwezekano wa kileksika.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa ‘palipo na … hapo pana …’ umehifadhi mtindo wa kimethali wa Kigiriki, huku ‘tamaa ya kujitafutia makuu’ ikifafanua ἐριθεία bila kutumia istilahi ya kidhehebu.
