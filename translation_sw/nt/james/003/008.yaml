  text: τὴν δὲ γλῶσσαν οὐδεὶς ⸂δαμάσαι δύναται ἀνθρώπων⸃· ⸀ἀκατάστατον κακόν, μεστὴ ἰοῦ θανατηφόρου.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/008.yaml
  text: But no one among men is able to tame the tongue[a]. It is a restless evil[b], full of deadly poison.
translation:
  language: sw
  text: Lakini hakuna mwanadamu anayeweza kuufuga ulimi[a]. Ni uovu usiotulia[b], umejaa sumu iletayo mauti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa kufuata muundo wa Kigiriki kwa karibu zaidi: “hakuna hata mmoja miongoni mwa wanadamu anayeweza kuufuga ulimi.”'
    reason: alternative_reading
  - marker: b
    text: Au “usiodhibitika”; neno la Kigiriki pia linaweza kumaanisha kutokuwa thabiti au kutokuwa na utaratibu.
    reason: lexical_alternative
lexical_decisions:
- source_word: γλῶσσαν
  choice: ulimi
  rationale: Neno halisi la kiungo cha mwili limehifadhiwa kwa sababu Yakobo analitumia kama sitiari ya usemi wa binadamu na kwa sababu linaendeleza picha ya mistari inayozunguka.
- source_word: οὐδεὶς ... ἀνθρώπων
  choice: hakuna mwanadamu
  rationale: Hii ni Kiswahili cha kawaida na sahihi kwa maana ya ‘hakuna hata mmoja miongoni mwa wanadamu,’ bila kuifanya kauli ihusu wanaume pekee.
- source_word: δαμάσαι
  choice: kuufuga
  rationale: ‘Kuufuga’ huhifadhi picha ya kufuga wanyama na uhusiano wa kitenzi hiki na mjadala uliotangulia, badala ya kufasiri moja kwa moja kuwa ‘kuudhibiti.’
- source_word: ἀκατάστατον
  choice: usiotulia
  rationale: Neno hili linaweza kuonyesha kutotulia, kutokuwa thabiti, au kutodhibitika. ‘Usiotulia’ ni la kawaida katika muktadha huu na halifuti kabisa upana huo wa maana.
- source_word: κακόν
  choice: uovu
  rationale: ‘Uovu’ huhifadhi uzito wa kimaadili wa κακόν, si madhara pekee.
- source_word: μεστὴ
  choice: umejaa
  rationale: Ni tafsiri ya kawaida na yenye picha wazi kwa maana ya kujazwa kikamilifu.
- source_word: ἰοῦ θανατηφόρου
  choice: sumu iletayo mauti
  rationale: Katika muktadha huu ἰός ni sumu, na θανατηφόρος hueleza uwezo wake wa kuleta kifo. Usemi huu ni wa asili, wenye heshima, na huhifadhi nguvu ya picha.
theological_decisions:
- issue: Upeo wa οὐδεὶς pamoja na ἀνθρώπων
  choice: hakuna mwanadamu
  alternative: hakuna hata mmoja miongoni mwa wanadamu
  rationale: Muundo wa Kigiriki unamaanisha kwamba hakuna mtu katika jamii ya wanadamu anayeweza kufanya hivyo. Tafsiri teule ni ya kawaida zaidi katika Kiswahili na haibadili upeo wa kauli.
- issue: Kauli kamili kuhusu kutoweza kuufuga ulimi
  choice: anayeweza kuufuga ulimi
  alternative: awezaye kuudhibiti ulimi
  rationale: Tafsiri hailegezi madai ya mstari kuwa ushauri wa kujitahidi tu. Pia huhifadhi sitiari ya kufuga inayounganisha mstari huu na wanyama waliotajwa kabla yake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Kuufuga ulimi’ limekusudiwa kuwa tamathali yenye nguvu, kama katika Kigiriki, na ‘sumu iletayo mauti’ ni wazi kwa wasomaji wa kawaida bila kupunguza uzito wa kifungu.
