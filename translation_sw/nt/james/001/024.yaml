  text: κατενόησεν γὰρ ἑαυτὸν καὶ ἀπελήλυθεν καὶ εὐθέως ἐπελάθετο ὁποῖος ἦν.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/024.yaml
  text: For he looked at himself and went away[a], and immediately forgot what kind of person he was.
translation:
  language: sw
  text: Kwa maana alijitazama, akaondoka, na mara moja akasahau jinsi alivyokuwa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alikuwa mtu wa namna gani.” Usemi wa Kigiriki unahusu hali au namna ya mtu.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατενόησεν
  choice: alijitazama
  rationale: Kitenzi hiki kinaweza kumaanisha kutazama, kuchunguza, au kufikiri kwa makini. Katika mfano wa kioo, “alijitazama” ni ya asili na inadumisha tendo la mtu kujiona mwenyewe.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Kiunganishi hiki kinaeleza sababu au ufafanuzi wa ulinganisho uliotangulia; “Kwa maana” kinaonyesha uhusiano huo wazi.
- source_word: ἑαυτὸν
  choice: -ji- (katika “alijitazama”)
  rationale: Kiwakilishi rejeshi kinamaanisha “mwenyewe.” Kiambishi rejeshi “-ji-” kinatoa maana hiyo kwa Kiswahili bila kuongeza neno “uso,” ambalo halipo katika mstari huu.
- source_word: ἀπελήλυθεν
  choice: akaondoka
  rationale: Ingawa umbo la Kigiriki ni timilifu, katika mfuatano huu wa masimulizi linaonyesha kwamba mtu aliondoka baada ya kujitazama. “Akaondoka” ni ya kawaida na hudumisha mfuatano huo.
- source_word: εὐθέως
  choice: mara moja
  rationale: Maneno haya yanaonyesha kwamba kusahau kulitokea bila kukawia.
- source_word: ἐπελάθετο
  choice: akasahau
  rationale: Hii ndiyo tafsiri ya moja kwa moja na ya kawaida ya tendo la kuacha kukumbuka.
- source_word: ὁποῖος ἦν
  choice: jinsi alivyokuwa
  rationale: Usemi huu wa Kigiriki unahusu hali, namna, au sifa ya mtu, si utambulisho wake tu. “Jinsi alivyokuwa” ni Kiswahili cha asili na kinaacha upana huo wa maana.
theological_decisions:
- issue: Maana ya kijumla katika mfano wa mtu anayejiangalia kwenye kioo
  choice: jinsi alivyokuwa
  alternative: alikuwa mtu wa namna gani
  rationale: Ingawa Kigiriki kina umoja wa kiume kisarufi, mfano huu unamhusu mtu yeyote. Kiswahili hakihitaji kuingiza jinsia hapa, hivyo tafsiri inabaki ya kijumla kama kusudi la muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida wa masimulizi. “Alijitazama” huepuka kuongeza “uso,” huku “akaondoka” na “akasahau” vikidumisha mfuatano wa haraka wa matendo. Alama ya tanbihi imewekwa baada ya usemi unaoelezwa.
