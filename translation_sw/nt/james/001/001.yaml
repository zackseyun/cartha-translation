id: JAS.1.1
reference: James 1:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἰάκωβος θεοῦ καὶ κυρίου Ἰησοῦ Χριστοῦ δοῦλος ταῖς δώδεκα φυλαῖς ταῖς ἐν τῇ διασπορᾷ χαίρειν.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/001.yaml
  text: 'James[a], a servant of God and of the Lord Jesus the Messiah[c][b], to the twelve tribes in the Dispersion: greetings.'
translation:
  language: sw
  text: 'Yakobo, mtumwa[b] wa Mungu na wa Bwana Yesu Masihi[a], kwa makabila kumi na mawili yaliyotawanyika ugenini[c]: Salamu!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yesu Kristo.” Neno la Kiyunani Χριστός linaweza kutafsiriwa “Masihi” au, katika matumizi yanayofanana zaidi na jina, “Kristo.”
    reason: alternative_reading
  - marker: b
    text: Au, “mtumishi.” Neno la Kiyunani δοῦλος humaanisha mtu aliye chini ya mamlaka ya bwana wake na aliye mali yake; “mtumwa” limetumiwa hapa kuhifadhi maana hiyo yenye nguvu zaidi.
    reason: lexical_alternative
  - marker: c
    text: Yaani, makabila ya Israeli yaliyoishi nje ya nchi ya Israeli.
    reason: cultural_note
lexical_decisions:
- source_word: Ἰάκωβος
  choice: Yakobo
  rationale: Hili ndilo umbo la kawaida la Kiswahili la jina la Kiyunani Ἰάκωβος, ambalo kihistoria linalingana na Yakobo.
- source_word: θεοῦ
  choice: wa Mungu
  rationale: Genitivi rahisi inayoonyesha kuwa Yakobo ni mtumwa wa Mungu.
- source_word: κυρίου
  choice: Bwana
  rationale: Katika muktadha huu wa cheo cha Yesu, “Bwana” huhifadhi mamlaka inayodokezwa na κύριος na ni matumizi ya kawaida ya Agano Jipya.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesu Masihi
  rationale: “Yesu” linatafsiriwa kama jina, na Χριστός kama cheo “Masihi,” huku uhusiano wa genitivi ukionyeshwa na “wa.”
- source_word: δοῦλος
  choice: mtumwa
  rationale: Neno hili huhifadhi maana yenye nguvu ya mtu aliye chini ya mamlaka na anayemilikiwa na bwana wake, badala ya maana pana zaidi ya “mtumishi.”
- source_word: ταῖς δώδεκα φυλαῖς
  choice: kwa makabila kumi na mawili
  rationale: Tafsiri hii huhifadhi lugha ya kimapokeo ya makabila ya Israeli na kazi ya dative ya kutaja wapokeaji.
- source_word: διασπορᾷ
  choice: yaliyotawanyika ugenini
  rationale: Badala ya nomino nzito isiyo ya kawaida “Utawanyiko,” usemi huu wa asili unaeleza Wayahudi waliokuwa wakiishi nje ya nchi ya Israeli na huhifadhi wazo la kutawanywa.
- source_word: χαίρειν
  choice: Salamu!
  rationale: Hii ni fomula ya kawaida ya salamu mwanzoni mwa barua; kuitafsiri kihalisi kuwa “furahini” kungepotosha matumizi yake ya kiidioma.
theological_decisions:
- issue: Tafsiri ya Χριστοῦ katika utambulisho wa Yesu
  choice: Masihi
  alternative: Kristo
  rationale: Χριστός asili yake ni cheo kinachomaanisha Masihi. “Masihi” huhifadhi wazi maana hiyo, huku “Kristo” likibaki kuwa tafsiri mbadala iliyozoeleka.
- issue: Tafsiri ya δοῦλος katika utambulisho wa Yakobo
  choice: mtumwa
  alternative: mtumishi
  rationale: “Mtumwa” huhifadhi wazo lenye nguvu la kuwa mali ya bwana na la kujitoa kabisa kwa Mungu na kwa Bwana Yesu; “mtumishi” ni la kawaida zaidi lakini linaweza kupunguza nguvu ya neno la Kiyunani.
- issue: Utambulisho wa makabila kumi na mawili
  choice: kuhifadhi usemi “makabila kumi na mawili” bila kuamua kama ni halisi au wa kitamathali
  alternative: watu wote wa Mungu
  rationale: Andiko lenyewe linatumia lugha ya Israeli. Tafsiri haipaswi kuamua kimya-kimya ikiwa wapokeaji ni Wayahudi kihalisi au jamii ya waamini inayoelezwa kwa lugha ya Israeli.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya barua rasmi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo mfupi wa salamu umehifadhiwa; “yaliyotawanyika ugenini” ni wa asili zaidi kuliko istilahi nzito “Utawanyiko,” na hauondoi taswira ya diaspora.
