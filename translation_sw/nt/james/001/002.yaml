  text: Ndugu zangu[a], hesabuni kuwa ni furaha tupu kila mnapoangukia majaribu mbalimbali[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki lililotafsiriwa “ndugu” lina umbo la kiume, lakini wito huu yaelekea unawahusu waamini wote, wanaume na wanawake.
