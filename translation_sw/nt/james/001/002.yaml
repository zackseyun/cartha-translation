    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶσαν χαρὰν
  choice: furaha tupu
  rationale: Kirai hiki ni kijalizo cha ἡγήσασθε na kinaelekeza wayatazame majaribu kuwa furaha kabisa. “Furaha tupu” ni Kiswahili cha kawaida kinachokaribia maana ya “furaha yote” bila kulazimisha wazo la ukamilifu.
- source_word: ἡγήσασθε
  choice: hesabuni kuwa
  rationale: Kitenzi hiki cha amri, wingi, kinamaanisha kufanya tathmini au kuona jambo kwa namna fulani. “Hesabuni kuwa” kinadumisha nguvu ya amri na wazo la tathmini ya kiakili.
- source_word: ἀδελφοί μου
  choice: ndugu zangu
  rationale: “Ndugu” ni neno la kawaida na lenye heshima kwa jumuiya ya waamini; katika Kiswahili linaweza kuwahusu wanaume na wanawake bila kuondoa umbo la mwito wa kindugu.
- source_word: ὅταν
  choice: kila mnapo-
  rationale: Pamoja na hali tegemezi ya περιπέσητε, ὅταν ina maana ya wakati usio maalumu au unaoweza kujirudia. “Kila mnapo-” linaonyesha wazi maana ya “wakati wowote ambapo.”
- source_word: πειρασμοῖς
  choice: majaribu
  rationale: Neno la Kigiriki linaweza kumaanisha majaribu, vipimo, au vishawishi kulingana na muktadha. “Majaribu” linahifadhi upana huo, huku muktadha wa mstari huu ukielekea kwenye shida zinazojaribu imani.
- source_word: περιπέσητε
  choice: mnapoangukia
  rationale: Tafsiri hii inadumisha taswira hai ya kitenzi cha Kigiriki, yaani kuangukia au kujikuta katikati ya jambo, na bado inaeleweka katika Kiswahili cha sasa.
- source_word: ποικίλοις
  choice: mbalimbali
  rationale: Kivumishi hiki kinaonyesha utofauti wa aina. “Mbalimbali” ni kifupi, cha asili, na chenye maana inayolingana.
theological_decisions:
- issue: Upeo wa ἀδελφοί katika mwito kwa jumuiya
  choice: ndugu zangu
  alternative: ndugu zangu wa kiume na wa kike
  rationale: Ingawa neno la Kigiriki lina umbo la kiume, katika mwito wa barua linaweza kuihusu jumuiya nzima ya waamini. Neno la Kiswahili “ndugu” kwa asili linaweza kujumuisha jinsia zote, na tanbihi inaweka wazi suala hilo bila kuongeza maneno mazito katika matini.
- issue: Maana ya πειρασμοῖς katika muktadha huu
  choice: majaribu, yakieleweka hasa kama shida zinazopima imani
  alternative: vishawishi vya kutenda dhambi
  rationale: Muktadha unaofuata unazungumzia kujaribiwa kwa imani na ustahimilivu, ilhali Yakobo 1:13 inajadili wazi maana ya kushawishiwa kutenda dhambi. Hata hivyo, upana wa neno la asili umeelezwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “hesabuni kuwa ni furaha tupu” unadumisha amri na tathmini ya kiakili ya Kigiriki; “mnapoangukia” huhifadhi taswira ya matini chanzi. Alama za tanbihi zimewekwa karibu na maneno yanayofafanuliwa.
