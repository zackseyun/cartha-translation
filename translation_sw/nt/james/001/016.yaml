base_translation:
  language: en
  yaml_path: translation/nt/james/001/016.yaml
  text: Do not be deceived[a], my beloved brothers.
translation:
  language: sw
  text: Msidanganyike, ndugu zangu wapendwa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki lililotafsiriwa “ndugu” lina umbo la wingi wa kiume, lakini hapa linaweza kuwaita waamini wote kwa pamoja, wanawake na wanaume.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ πλανᾶσθε
  choice: Msidanganyike
  rationale: Kauli hii ya kukataza inaonya wasikubali kudanganywa au kushikilia wazo lisilo la kweli. “Msidanganyike” ni Kiswahili cha kawaida na huhifadhi maana inayoweza kueleweka kwa hali ya kutendwa.
- source_word: ἀδελφοί
  choice: ndugu
  rationale: Katika Kiswahili, “ndugu” ni neno la kawaida la kuwaita waamini wenzao kwa pamoja na halihitaji kutaja jinsia; linafaa kwa matumizi mapana ya ἀδελφοί katika jumuiya ya waamini.
- source_word: μου
  choice: zangu
  rationale: Kiwakilishi hiki huhifadhi uhusiano wa karibu na sauti ya kichungaji katika usemi “ndugu zangu.”
- source_word: ἀγαπητοί
  choice: wapendwa
  rationale: “Wapendwa” huwasilisha kwa kawaida na kwa hadhi joto la ἀγαπητοί bila kudhoofisha upendo unaoonyeshwa.
theological_decisions:
- issue: Anwani yenye umbo la kiume kwa hadhira ya waamini
  choice: Kutafsiri ἀδελφοί kuwa “ndugu” na kufafanua katika tanbihi kwamba inawahusu waamini wote, wanawake na wanaume.
  alternative: ndugu wa kiume; ndugu wa kiume na wa kike
  rationale: Neno la Kigiriki lina umbo la wingi wa kiume, lakini katika muktadha linaweza kuiita jumuiya nzima ya waamini. Kiswahili “ndugu” huhifadhi sitiari ya kifamilia na kwa asili linaweza kuwajumuisha wote bila kuongeza maneno katika matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha fupi, ya moja kwa moja, yenye hadhi na inayoeleweka kwa urahisi. Mpangilio “ndugu zangu wapendwa” ni wa kawaida na huhifadhi hisia ya upendo ya mwito wa Kigiriki.
