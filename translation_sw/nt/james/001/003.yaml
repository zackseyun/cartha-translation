  text: kwa maana mnajua kwamba kupimwa kwa imani yenu huleta ustahimilivu[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ubora wa imani yenu uliothibitishwa.” Neno la Kigiriki linaweza kumaanisha ama mchakato wa kupimwa, ama sifa inayodhihirishwa na upimaji.
