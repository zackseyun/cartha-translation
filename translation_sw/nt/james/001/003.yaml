lexical_decisions:
- source_word: γινώσκοντες
  choice: kwa maana mnajua
  rationale: Kirai shirikishi cha wakati uliopo kinaeleza msingi wa agizo la mstari wa 2. Kiswahili cha kawaida hutumia kirai cha sababu “kwa maana mnajua” ili kuonyesha uhusiano huo kwa uwazi.
- source_word: ὅτι
  choice: kwamba
  rationale: Hutambulisha maudhui ya jambo ambalo wasomaji wanalijua; “kwamba” ndiyo kiunganishi cha kawaida na wazi katika Kiswahili.
- source_word: τὸ δοκίμιον
  choice: kujaribiwa
  rationale: Neno hilo linaweza kumaanisha mchakato wa kupimwa au uhalisi uliothibitishwa kwa kupimwa. Katika muktadha wa majaribu, “kujaribiwa” huwasilisha mchakato huo kwa lugha ya kawaida, huku maana nyingine ikihifadhiwa katika tanbihi.
- source_word: ὑμῶν τῆς πίστεως
  choice: kwa imani yenu
  rationale: Muundo huu unaonyesha kwamba imani ya wasomaji ndiyo inayojaribiwa. “Imani” ni tafsiri ya kawaida na inayofaa hapa ya πίστις.
- source_word: κατεργάζεται
  choice: huleta
  rationale: Kitenzi kinaonyesha kusababisha matokeo. “Huleta” ni cha kawaida katika Kiswahili na kinaonyesha kwamba kujaribiwa kunatokeza uvumilivu.
- source_word: ὑπομονήν
  choice: uvumilivu
  rationale: Neno hili humaanisha kudumu kwa uthabiti chini ya shida. “Uvumilivu” ni neno la kawaida na pana, huku “ustahimilivu” na “sabrini thabiti” zikikaribia maana hiyo.
theological_decisions:
- issue: Tafsiri ya πίστις
  choice: imani
  alternative: tumaini au uaminifu
  rationale: Katika muktadha huu ni imani ya wasomaji inayopitia majaribu. “Imani” ndiyo tafsiri ya kawaida na hakuna shinikizo la kimuktadha la kuifanya iwe “uaminifu.”
- issue: Maana ya δοκίμιον
  choice: mchakato wa kujaribiwa
  alternative: uhalisi wa imani uliothibitishwa
  rationale: Muktadha wa majaribu katika mstari uliotangulia unaunga mkono maana ya mchakato, lakini neno la Kigiriki linaweza pia kutaja sifa au uhalisi unaodhihirishwa na jaribio; uwezekano huo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imeunganishwa kimantiki na mstari wa 2 kwa “kwa maana,” na tanbihi zimehifadhi utata halisi wa δοκίμιον na upana wa maana ya ὑπομονή.
