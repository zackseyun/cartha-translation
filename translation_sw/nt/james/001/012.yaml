  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Μακάριος ἀνὴρ ὃς ὑπομένει πειρασμόν, ὅτι δόκιμος γενόμενος λήμψεται τὸν στέφανον τῆς ζωῆς, ὃν ⸀ἐπηγγείλατο τοῖς ἀγαπῶσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/012.yaml
  text: Blessed is the man who endures trial[a], because after he has been approved, he will receive the crown of life[b], which he promised to those who love him.
translation:
  language: sw
  text: Heri mtu anayevumilia jaribu[a], kwa kuwa baada ya kuthibitika, atapokea taji ya uzima[b], ambayo Mungu aliwaahidi wale wanaompenda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kishawishi” au “kipimo.” Neno la Kigiriki linaweza kumaanisha jaribu linalompima mtu au linalomshawishi atende dhambi; hapa muktadha unasisitiza kuvumilia wakati wa kupimwa.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kigiriki linaweza kumaanisha shada la ushindi analopewa mshindi, si lazima taji ya kifalme.
    reason: cultural_note
lexical_decisions:
- source_word: Μακάριος
  choice: Heri
  rationale: “Heri” ni usemi wa kawaida wa baraka katika Biblia ya Kiswahili; unaonyesha hali ya kupendelewa na Mungu kuliko hisia ya furaha tu.
- source_word: ἀνὴρ
  choice: mtu
  rationale: Ingawa nomino ya Kigiriki ni ya kiume katika umoja, hapa inatumika kwa uwakilishi wa jumla. “Mtu” ni ya asili katika Kiswahili na haiwekei ahadi hii wanaume pekee.
- source_word: ὑπομένει
  choice: anayevumilia
  rationale: Huwasilisha kustahimili kwa uthabiti chini ya shinikizo kwa lugha fupi na ya kawaida.
- source_word: πειρασμόν
  choice: jaribu
  rationale: “Jaribu” linaweza kumaanisha hali inayomjaribu au kumpima mtu, hivyo linahifadhi upana wa neno la Kigiriki; muktadha hapa unasisitiza kustahimili wakati wa kupimwa.
- source_word: δόκιμος γενόμενος
  choice: akiisha kuthibitishwa kuwa amefaulu
  rationale: Kirai hiki huonyesha kwamba mtu ametoka katika kupimwa akiwa amethibitishwa kuwa wa kweli au anayekubalika. “Amefaulu” hufanya matokeo ya kupimwa yaeleweke bila kudai ukamilifu usio katika matini.
- source_word: λήμψεται
  choice: atapokea
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya wakati ujao wa λαμβάνω katika muktadha wa zawadi iliyoahidiwa.
- source_word: στέφανον
  choice: taji
  rationale: “Taji” ndiyo istilahi ya kawaida na yenye hadhi; maelezo ya chini yanafafanua kwamba inaweza kuwa taji ya mshindi badala ya taji ya kifalme.
- source_word: τῆς ζωῆς
  choice: ya uzima
  rationale: Huhifadhi muundo wa jenitivi wa Kigiriki na usemi wa kibiblia unaoeleweka katika Kiswahili.
- source_word: ἐπηγγείλατο
  choice: Mungu aliwaahidi
  rationale: Kitenzi hakitaji kiima kwa jina, lakini muktadha unaelekeza kwa Mungu. Kutaja “Mungu” huepusha utata usio wa asili katika Kiswahili kuhusu kiwakilishi “yeye,” huku kutodai kwamba Mungu ndiye antecedenti ya “taji.”
- source_word: τοῖς ἀγαπῶσιν αὐτόν
  choice: wale wanaompenda
  rationale: Huwasilisha dative ya walengwa na hali endelevu ya upendo unaowatambulisha.
theological_decisions:
- issue: Maana ya πειρασμός katika Yakobo 1:12
  choice: jaribu
  alternative: majaribu ya kushawishiwa kutenda dhambi; kupimwa
  rationale: Neno la Kigiriki linaweza kuhusisha kujaribiwa, kushawishiwa, au kupimwa. Muktadha wa kuvumilia na kuthibitishwa unasisitiza zaidi hali ya kupimwa, lakini “jaribu” pamoja na tanbihi huhifadhi mvutano wa maana.
- issue: Kiima kisichotajwa cha ἐπηγγείλατο
  choice: Mungu aliwaahidi
  alternative: ambayo aliwaahidi
  rationale: Kigiriki hakimtaji Mungu kwa jina katika mstari huu, lakini yeye ndiye kiima kinachoeleweka kwa kawaida. Kiswahili kinahitaji marejeo yaliyo wazi zaidi ili kuepuka kusomeka kana kwamba “taji” ndiyo iliyoahidi.
- issue: Uhusiano wa “taji” na “uzima”
  choice: taji ya uzima
  alternative: taji ambayo ni uzima; taji inayotoa uzima
  rationale: Jenitivi ya Kigiriki inaweza kufasiriwa kwa zaidi ya njia moja. Muundo wa moja kwa moja “ya uzima” huhifadhi utata huo badala ya kuufafanua kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo umewekwa wa moja kwa moja, huku tanbihi zikihifadhi upana wa “jaribu” na picha ya taji ya mshindi.
