  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀνέτειλεν γὰρ ὁ ἥλιος σὺν τῷ καύσωνι καὶ ἐξήρανεν τὸν χόρτον, καὶ τὸ ἄνθος αὐτοῦ ἐξέπεσεν καὶ ἡ εὐπρέπεια τοῦ προσώπου αὐτοῦ ἀπώλετο· οὕτως καὶ ὁ πλούσιος ἐν ταῖς πορείαις αὐτοῦ μαρανθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/011.yaml
  text: For the sun rose with its scorching heat and dried up the grass[a], and its flower fell off and the beauty of its appearance perished[b]; so also the rich man will wither away in the midst of his pursuits.
translation:
  language: sw
  text: Kwa maana jua lilichomoza pamoja na joto kali, likaikausha nyasi[a]; ua lake likaanguka, na uzuri wa sura yake ukatoweka. Vivyo hivyo, tajiri naye atanyauka akiwa katika shughuli zake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “pamoja na upepo wa joto kali.” Neno la Kigiriki linaweza kumaanisha joto kali lenye kuunguza na, katika baadhi ya miktadha, upepo wa joto unaoandamana nalo.
    reason: lexical_alternative
  - marker: b
    text: Kwa neno halisi, “katika safari zake.” Neno la Kigiriki linaweza kumaanisha safari au, kwa upana zaidi, shughuli na mwenendo wa mtu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέτειλεν
  choice: lilichomoza
  rationale: Kitenzi hiki kinaeleza kuchomoza kwa jua; wakati uliopita unadumisha mfano hai wa Kigiriki.
- source_word: σὺν τῷ καύσωνι
  choice: pamoja na joto lake kali
  rationale: καύσων inaweza kumaanisha joto kali lenye kuunguza au upepo wa joto. Katika muktadha huu jua ndilo kiima, hivyo tafsiri hii ni ya kawaida kwa Kiswahili huku tanbihi ikihifadhi uwezekano mwingine.
- source_word: ἐξήρανεν τὸν χόρτον
  choice: likaikausha majani
  rationale: Hueleza joto linalokausha uoto. ‘Majani’ ni neno la kawaida la Kiswahili kwa χόρτος katika picha hii ya uoto wa kondeni.
- source_word: τὸ ἄνθος αὐτοῦ ἐξέπεσεν
  choice: ua lake likaanguka
  rationale: Inadumisha picha halisi ya ua linaloanguka kutoka kwenye mmea bila kuifafanua kupita kiasi.
- source_word: ἡ εὐπρέπεια τοῦ προσώπου αὐτοῦ
  choice: uzuri wa sura yake
  rationale: Tafsiri hii inahifadhi kwa karibu ‘uzuri’ na ‘sura/mwonekano’ wa Kigiriki, na inasikika kwa kawaida katika Kiswahili.
- source_word: ἀπώλετο
  choice: ukatoweka
  rationale: Katika muktadha huu kitenzi kinaonyesha kupotea kwa uzuri wa ua; ‘ukatoweka’ ni wazi na chenye hadhi.
- source_word: ὁ πλούσιος
  choice: tajiri
  rationale: Nomino ya umoja inabaki kuwa mfano wa mtu tajiri bila kuongeza maana isiyokuwamo katika Kigiriki.
- source_word: ἐν ταῖς πορείαις αὐτοῦ
  choice: akiwa katika shughuli zake
  rationale: πορείαις inaweza kurejelea safari halisi au, kwa upana zaidi, mwenendo na shughuli za mtu. ‘Shughuli zake’ inaeleza maana ya kimuktadha bila kuibana kuwa safari pekee; tanbihi inadumisha maana halisi.
- source_word: μαρανθήσεται
  choice: atanyauka
  rationale: Inadumisha istiari ya uoto na nguvu ya kauli ya wakati ujao.
theological_decisions:
- issue: Rejeo la ὁ πλούσιος
  choice: tajiri
  alternative: mtu tajiri
  rationale: Kiswahili hutumia ‘tajiri’ kwa kawaida kama nomino ya mtu. Umoja wa mwakilishi unadumishwa bila kudokeza kwamba onyo linawahusu wanaume pekee.
- issue: Upeo wa πορείαις katika onyo kwa tajiri
  choice: shughuli zake
  alternative: safari zake
  rationale: Muktadha unaonyesha tajiri anayenyauka katikati ya mwendo na shughuli zake za maisha. Tafsiri pana haifungi onyo kwa kusafiri halisi, huku tanbihi ikihifadhi maana hiyo inayowezekana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi unadumisha mfululizo wa picha ya jua, majani na ua, kisha matumizi yake kwa tajiri. Alama zote za tanbihi zimewekwa katika matini kuu.
