id: JAS.1.5
reference: James 1:5
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Εἰ δέ τις ὑμῶν λείπεται σοφίας, αἰτείτω παρὰ τοῦ διδόντος θεοῦ πᾶσιν ἁπλῶς καὶ ⸀μὴ ὀνειδίζοντος, καὶ δοθήσεται αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/james/001/005.yaml
  text: But if any of you lacks wisdom[a], let him ask of God, who gives to all generously and without reproach[b], and it will be given to him.
translation:
  language: sw
  text: Lakini ikiwa yeyote kati yenu amepungukiwa na hekima, na aombe kwa Mungu, ambaye huwapa wote kwa ukarimu bila kuwakaripia[a], naye atapewa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “bila kuwalaumu” au “bila kuwashutumu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ δέ
  choice: Lakini ikiwa
  rationale: δέ inaendeleza wazo huku ikiweka tofauti ndogo na mstari uliotangulia; “Lakini ikiwa” ni ya asili na haiiongezi nguvu kupita kiasi.
- source_word: τις ὑμῶν
  choice: yeyote kati yenu
  rationale: Inahifadhi maana ya mtu yeyote ndani ya kundi linaloambiwa moja kwa moja.
- source_word: λείπεται σοφίας
  choice: amepungukiwa na hekima
  rationale: Kiswahili hiki cha kawaida huonyesha hali ya kukosa kiasi kinachohitajika bila kuibana maana ya hekima.
- source_word: αἰτείτω παρὰ τοῦ ... θεοῦ
  choice: na aombe kwa Mungu
  rationale: Umbo la amri la nafsi ya tatu linawakilishwa kwa “na aombe”; katika Kiswahili, “kuomba kwa Mungu” huwasilisha kwa kawaida chanzo ambacho mwombaji anamwendea.
- source_word: τοῦ διδόντος θεοῦ πᾶσιν
  choice: Mungu, ambaye huwapa wote
  rationale: “Huwapa” huonyesha tabia ya Mungu ya kutoa, na “wote” huhifadhi upana wa πᾶσιν.
- source_word: ἁπλῶς
  choice: kwa ukarimu
  rationale: Katika muktadha wa kutoa, neno hili linaelekea kumaanisha kutoa bila ubahili au kusitasita; “kwa ukarimu” ni wazi na la kawaida.
- source_word: μὴ ὀνειδίζοντος
  choice: bila kulaumu
  rationale: Huhifadhi wazo la kutomshutumu, kutomwaibisha, au kutomkaripia mwombaji kwa makosa yake.
- source_word: δοθήσεται αὐτῷ
  choice: naye atapewa
  rationale: Huhifadhi ahadi ya wakati ujao katika kauli tendwa; kitu kitakachotolewa kinaeleweka kutokana na “hekima.”
theological_decisions:
- issue: Umoja wenye maana ya jumla
  choice: yeyote ... na aombe ... naye atapewa
  alternative: wote wanaopungukiwa ... waombe ... watapewa
  rationale: Kigiriki humtaja mtu mmoja kwa maana inayomhusu mtu yeyote. Kiswahili kinaweza kuhifadhi umoja huo kwa njia ya kawaida bila kuashiria jinsia.
- issue: Maana ya namna Mungu anavyotoa katika ἁπλῶς
  choice: kwa ukarimu
  alternative: kwa moyo mmoja; kwa unyofu
  rationale: Muktadha wa kuomba na kupewa hekima unaunga mkono maana ya kutoa bila ubahili. Tafsiri haiongezi ahadi ya utajiri wala mafanikio ya kimwili.
- issue: μὴ ὀνειδίζοντος kama sifa ya Mungu
  choice: bila kulaumu
  alternative: bila kukaripia; bila kumhesabia mtu makosa
  rationale: Tafsiri inahifadhi kwamba Mungu hamwaibishi au kumshutumu mwombaji, bila kuondoa uwezekano wa vivuli vya maana vya kitenzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imehifadhi muundo wa sharti, amri ya nafsi ya tatu, maelezo ya tabia ya Mungu, na ahadi ya mwisho kwa lugha inayoeleweka kwa wasomaji wa kawaida.
