id: JAS.1.25
reference: James 1:25
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὁ δὲ παρακύψας εἰς νόμον τέλειον τὸν τῆς ἐλευθερίας καὶ παραμείνας, ⸀οὐκ ἀκροατὴς ἐπιλησμονῆς γενόμενος ἀλλὰ ποιητὴς ἔργου, οὗτος μακάριος ἐν τῇ ποιήσει αὐτοῦ ἔσται.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/025.yaml
  text: But the one who has looked intently into the perfect law[a], the law of freedom[c][b], and has continued in it—not becoming a forgetful hearer but a doer of the work—this one will be blessed in his doing.
translation:
  language: sw
  text: Lakini yule anayeitazama kwa makini sheria kamilifu, sheria ya uhuru[a], na kudumu nayo—asiye msikilizaji msahaulifu[b], bali atendaye kazi[c]—huyo atakuwa mwenye heri katika atendavyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sheria kamilifu ya uhuru.”
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “msikilizaji wa kusahau”; pia yaweza kutafsiriwa, “msikilizaji anayesahau.”
    reason: lexical_alternative
  - marker: c
    text: Kihalisi, “mtendaji wa kazi”; kwa Kiswahili cha kimatendo zaidi, “mtu atendaye” au “mtendaji wa tendo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακύψας
  choice: aliyeitazama kwa makini
  rationale: Kitenzi hiki kinaweza kuleta taswira ya kuinama ili kutazama ndani au kuchunguza kwa makini. Tafsiri hii huhifadhi wazo la kutazama kwa makini bila kuleta usemi mgumu usio wa kawaida katika Kiswahili.
- source_word: νόμον τέλειον τὸν τῆς ἐλευθερίας
  choice: sheria kamilifu, ile ya uhuru
  rationale: Muundo huu huhifadhi uhusiano wa ufafanuzi kati ya “sheria kamilifu” na “ile ya uhuru,” huku τέλειον ikitafsiriwa moja kwa moja kuwa “kamilifu.”
- source_word: παραμείνας
  choice: akadumu nayo
  rationale: Neno linaonyesha kuendelea au kubaki kwa uthabiti kuhusiana na sheria iliyotajwa. “Akadumu nayo” ni usemi wa kawaida unaohifadhi wazo la mwendelezo bila kuongeza tafsiri ya kiitikadi.
- source_word: οὐκ ἀκροατὴς ἐπιλησμονῆς γενόμενος
  choice: bila kuwa msikilizaji msahaulifu
  rationale: Huu ni uwasilishaji wa kawaida wa Kiswahili wa kirai halisi “msikilizaji wa kusahau,” na unadumisha tofauti kati ya kusikia na kutenda.
- source_word: ποιητὴς ἔργου
  choice: mtendaji wa kazi
  rationale: Tafsiri hii huhifadhi neno ἔργου, “kazi/tendo,” badala ya kulibadilisha kuwa “neno” kutokana na muktadha wa karibu. Ugumu mdogo wa kirai cha asili umehifadhiwa kwa makusudi.
- source_word: μακάριος
  choice: mwenye heri
  rationale: “Mwenye heri” huonyesha hali ya mtu anayehesabiwa kuwa katika hali njema au yenye kibali, na ni ya heshima na ya kawaida katika lugha ya Biblia ya Kiswahili.
- source_word: ἐν τῇ ποιήσει αὐτοῦ
  choice: katika kutenda kwake
  rationale: Muundo huu unahifadhi nomino ya kutenda na uhusiano wake wa kimatamshi na “mtendaji,” bila kuufanya kuwa ahadi pana isiyosemwa na maandishi.
- source_word: ὁ ... οὗτος
  choice: yule ... huyo
  rationale: Muundo huu huhifadhi msisitizo wa umoja wa kiwakilishi cha Kigiriki na kwa kawaida katika Kiswahili unaweza kumrejelea mtu yeyote bila kuzuia maana kwa wanaume pekee.
theological_decisions:
- issue: Maana ya “sheria ya uhuru”
  choice: ile ya uhuru
  alternative: sheria inayoleta uhuru
  rationale: Tafsiri imeacha wazi kama uhuru unaeleza tabia ya sheria, matokeo yake, au uhusiano mwingine wa kitheolojia. Hivyo haijabana kirai hiki kiwe injili pekee, sheria ya maadili pekee, au ufafanuzi mwingine wa kimadhehebu.
- issue: Nguvu ya μακάριος ἔσται
  choice: atakuwa mwenye heri
  alternative: atabarikiwa
  rationale: “Atakuwa mwenye heri” huhifadhi muundo wa hali uliopo katika Kigiriki na huepuka kulazimisha wazo la tendo mahususi la kubarikiwa, ingawa maana hizo zinakaribiana.
- issue: Uwakilishi wa jinsia katika umoja wa kiume wa Kigiriki
  choice: yule ... huyo
  alternative: mwanamume huyo
  rationale: Umoja wa kiume hapa ni wa kiwakilishi na unamhusu mtu yeyote anayesikia na kutenda; Kiswahili hakihitaji kuingiza jinsia ya kiume katika tafsiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kimaandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi na jozi “yule ... huyo” huhifadhi msisitizo wa asili; vistari virefu vinatenganisha tofauti kuu kati ya msikilizaji na mtendaji.
