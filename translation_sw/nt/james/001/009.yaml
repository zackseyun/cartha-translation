translation:
  language: sw
  text: Ndugu aliye katika hali ya chini na ajivunie kuinuliwa kwake.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki kina neno “ndugu” katika umoja wa kiume; katika muktadha huu huenda likatumika kiwakilishi kwa mwamini, mwanamume au mwanamke.
    reason: lexical_alternative
  - marker: b
    text: Au “hadhi yake ya juu.” Kauli hii huenda inaelekeza kwenye heshima au hadhi ya juu ya mwamini huyo mbele za Mungu, huku ikiacha wazi ugeuzaji wa hali wa sasa au wa wakati ujao.
    reason: alternative_reading
lexical_decisions:
- source_word: Καυχάσθω
  choice: na ajivunie
  rationale: Kauli ya kuamuru katika nafsi ya tatu inatoa himizo. “Ajivunie” inadumisha nguvu ya καυχάομαι, huku muktadha ukionyesha kuwa jambo la kujivunia ni kuinuliwa alikopewa, si kujikweza mwenyewe.
- source_word: δὲ
  choice: Lakini
  rationale: Neno hili linaonyesha mpito wenye ulinganisho au utofautishaji mdogo kuelekea jozi ya mtu wa hali ya chini na tajiri katika mstari huu na unaofuata.
- source_word: ὁ ἀδελφὸς
  choice: ndugu
  rationale: “Ndugu” ni neno la kawaida na lenye hadhi katika Kiswahili kwa mwamini mwenzao; linaweza kutumiwa kiwakilishi kwa mshiriki wa jumuiya ya waamini, ingawa Kigiriki kina umoja wa kiume.
- source_word: ὁ ταπεινὸς
  choice: wa hali ya chini
  rationale: Kauli hii inaeleza cheo au hali ya chini kijamii na kiuchumi bila kuifunga maana kwenye umaskini pekee au unyenyekevu wa tabia pekee.
- source_word: ἐν τῷ ὕψει αὐτοῦ
  choice: kuinuliwa kwake
  rationale: “Kuinuliwa” linahifadhi wazo la ὕψος la kuwa juu au kutukuzwa na linaonyesha ugeuzaji wa hali, bila kuamua kama kuinuliwa huku ni hadhi ya sasa mbele za Mungu, mabadiliko ya kijamii, au kutukuzwa kwa wakati ujao.
theological_decisions:
- issue: Maana ya “kuinuliwa” kwa ndugu wa hali ya chini
  choice: Kauli inahifadhi maana pana ya hadhi au heshima ya juu aliyo nayo mbele za Mungu, pamoja na uwezekano wa ugeuzaji wa hali sasa au wakati ujao.
  alternative: “cheo chake cha juu,” ambacho kinaweza kueleweka zaidi kama hadhi ya kijamii ya sasa
  rationale: Muktadha unalinganisha mtu wa hali ya chini na tajiri na kutumia lugha ya ugeuzaji wa hali. Tafsiri haipaswi kuifunga maana katika kuinuliwa kwa mali, hadhi ya kiroho ya sasa, au kutukuzwa kwa wakati ujao pekee.
- issue: Uwasilishaji wa jinsia ya ἀδελφός
  choice: “ndugu” katika matini kuu, huku tanbihi ikibainisha umoja wa kiume na matumizi yake yanayoweza kuwa wakilishi.
  alternative: “ndugu wa kiume” au “mwamini mwenzetu”
  rationale: Kigiriki kina nomino ya umoja wa kiume, lakini “ndugu” katika Kiswahili ni tafsiri ya asili zaidi na linaweza kutumika kwa maana pana katika jumuiya ya waamini; tanbihi inahifadhi taarifa ya kisarufi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Wa hali ya chini” ni wazi kwa msomaji wa kawaida na huhifadhi upana wa kijamii na kiuchumi wa ταπεινός. “Kuinuliwa kwake” ni asilia kuliko tafsiri halisi ya “urefu wake” na hudumisha mvutano wa kitheolojia wa kifungu.
