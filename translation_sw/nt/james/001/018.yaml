source:
  edition: SBLGNT
  text: βουληθεὶς ἀπεκύησεν ἡμᾶς λόγῳ ἀληθείας, εἰς τὸ εἶναι ἡμᾶς ἀπαρχήν τινα τῶν αὐτοῦ κτισμάτων.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/018.yaml
  text: Having willed it[a], he gave birth to us by the word of truth[b], so that we might be a kind of firstfruits of his creatures.
translation:
  language: sw
  text: Kwa hiari yake, alituzaa kwa neno la kweli, ili tuwe kama malimbuko ya viumbe vyake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Malimbuko” yalikuwa sehemu ya kwanza ya mavuno iliyotengwa na kutolewa kwa Mungu. Hapa waamini wanaonyeshwa kuwa kama sehemu ya kwanza iliyowekwa wakfu miongoni mwa viumbe vya Mungu.
    reason: cultural_note
lexical_decisions:
- source_word: βουληθεὶς
  choice: Kwa kuwa alitaka hivyo
  rationale: Kirai hiki kinaonyesha kuwa kutaka kwa Mungu kulitangulia tendo kuu na ndiko kulikolisababisha. Tafsiri hii ni ya asili katika Kiswahili na inadumisha uanzilishi wa Mungu bila kuingiza mfumo maalumu wa kiteolojia.
- source_word: ἀπεκύησεν
  choice: alituzaa
  rationale: Kitenzi kinamaanisha kuzaa au kuleta katika uzima. ‘Alituzaa’ kinahifadhi taswira ya uzazi na mwangwi wa Yakobo 1:15, ambako tamaa huzaa dhambi.
- source_word: λόγῳ ἀληθείας
  choice: kwa neno la kweli
  rationale: Hapa hali ya udativu inaonyesha njia au chombo. Kirai kinadumisha usemi wa kibiblia na kinaweza kurejelea ujumbe wa kweli wa Injili bila kuufafanua kupita maandishi.
- source_word: εἰς τὸ εἶναι ἡμᾶς
  choice: ili tuwe
  rationale: Muundo huu unaonyesha kusudi au matokeo yaliyokusudiwa. ‘Ili tuwe’ ni wa kawaida na wazi katika Kiswahili.
- source_word: ἀπαρχήν
  choice: malimbuko
  rationale: Neno hili huhusu sehemu ya kwanza ya mavuno iliyotengwa au kutolewa kwa Mungu. ‘Malimbuko’ linahifadhi sitiari ya mavuno na uhusiano wake wa kibiblia.
- source_word: τινα
  choice: kama
  rationale: τινα hapa hulegeza au kufafanua kiarifu kwa maana ya ‘aina fulani ya.’ Katika Kiswahili, ‘kama malimbuko’ huwasilisha maana hiyo kwa njia nyepesi na ya asili.
- source_word: τῶν αὐτοῦ κτισμάτων
  choice: ya viumbe vyake
  rationale: κτίσματα ni vitu au viumbe vilivyoumbwa. ‘Viumbe vyake’ kinahifadhi wingi na hakipunguzi upeo wake kuwa wanadamu peke yao.
theological_decisions:
- issue: Uanzilishi wa Mungu katika kuzaliwa upya
  choice: Kutaka kwa Mungu kunaonyeshwa kuwa sababu iliyotangulia tendo la kutuzaa.
  alternative: ‘Kwa hiari yake mwenyewe alituzaa’ au tafsiri inayotaja wazi fundisho fulani la kuzaliwa upya.
  rationale: Kigiriki kinasisitiza nia na tendo la Mungu lakini hakielezi mfumo mzima wa uteuzi au kuzaliwa upya; tafsiri inadumisha msisitizo huo bila kuamua zaidi ya maandishi.
- issue: Upeo wa κτισμάτων
  choice: ‘viumbe vyake’ limeachwa na maana pana.
  alternative: ‘wanadamu aliowaumba’ au ‘uumbaji wake wote.’
  rationale: Neno la Kigiriki halidhibitiwi kwa wanadamu pekee, na ni nomino ya wingi badala ya dhana ya jumla ya ‘uumbaji.’
- issue: Sitiari ya malimbuko
  choice: Sitiari imehifadhiwa na kufafanuliwa katika tanbihi.
  alternative: ‘sehemu ya kwanza iliyowekwa wakfu’ katika matini kuu.
  rationale: Malimbuko yanaonyesha sehemu ya kwanza na iliyotengwa ya mavuno; kubadili sitiari kuwa maelezo kungepoteza mwangwi wake wa kibiblia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo ni wa moja kwa moja, huku ‘malimbuko’ likihifadhi istilahi na sitiari muhimu ya kibiblia.
