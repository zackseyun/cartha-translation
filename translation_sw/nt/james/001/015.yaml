  text: εἶτα ἡ ἐπιθυμία συλλαβοῦσα τίκτει ἁμαρτίαν, ἡ δὲ ἁμαρτία ἀποτελεσθεῖσα ἀποκύει θάνατον.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/015.yaml
  text: Then desire[a], after it has conceived, gives birth to sin; and sin, when it is fully grown[b], brings forth death.
translation:
  language: sw
  text: Kisha tamaa, ikiisha kutunga mimba,[a] huzaa dhambi; nayo dhambi, ikiisha kukomaa kabisa,[b] huzaa kifo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “baada ya kutunga mimba.” Kishiriki cha Kigiriki kinaunganisha kwa karibu taswira ya kutunga mimba na tamaa.
    reason: lexical_alternative
  - marker: b
    text: Au, “ikiisha kukamilika” au “ikifikia upevu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶτα
  choice: Kisha
  rationale: Inaonyesha hatua inayofuata katika mfululizo wa kutoka kwenye tamaa hadi kifo, kwa lugha ya kawaida na yenye hadhi.
- source_word: ἐπιθυμία
  choice: tamaa
  rationale: Ni neno pana linalofaa katika muktadha huu; halipunguzi maana iwe tamaa ya kingono pekee.
- source_word: συλλαβοῦσα
  choice: ikiisha kutunga mimba
  rationale: Inahifadhi taswira ya kutungwa kwa mimba na kuonyesha kwamba tendo hilo linatangulia kuzaa dhambi.
- source_word: τίκτει
  choice: huzaa
  rationale: Inadumisha wazi taswira ya uzazi katika Kiswahili cha asili.
- source_word: ἁμαρτίαν
  choice: dhambi
  rationale: Ni tafsiri ya kawaida na sahihi ya uovu wa kimaadili unaotajwa hapa.
- source_word: δὲ
  choice: nayo
  rationale: Inaendeleza mfululizo huku ikihamisha kiima kutoka tamaa kwenda dhambi bila kuleta tofauti kali isiyokuwapo.
- source_word: ἀποτελεσθεῖσα
  choice: ikiisha kukomaa kabisa
  rationale: Inaeleza kufikia ukamilifu au upevu na kuendana na taswira hai ya kutungwa mimba na kuzaa.
- source_word: ἀποκύει
  choice: huzaa
  rationale: Inahifadhi sitiari ya uzazi ambayo kitenzi cha Kigiriki kinaendeleza; urudiaji huu unasikika kwa kawaida katika Kiswahili.
- source_word: θάνατον
  choice: kifo
  rationale: Ni tafsiri ya moja kwa moja; haibainishi bila msingi kama ni kifo cha kimwili, kiroho, au cha milele.
theological_decisions:
- issue: Taswira inayounganisha tamaa, dhambi, na kifo
  choice: Kuhifadhi taswira ya kutunga mimba, kuzaa, na kukomaa
  alternative: Kusema kwa ufupi kwamba tamaa husababisha dhambi na dhambi husababisha kifo
  rationale: Maelezo ya sababu pekee yangepunguza nguvu ya sitiari ya Kigiriki na kufuta mfululizo wake wa uzazi.
- issue: Maana ya θάνατος
  choice: kifo
  alternative: kifo cha kiroho au kifo cha milele
  rationale: Andiko la Kigiriki halibainishi aina ya kifo; tafsiri inapaswa kuhifadhi upana na uzito huo bila kuongeza hitimisho la kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi ni rahisi kueleweka huku ukihifadhi sitiari ya uzazi na ukomavu iliyomo katika Kigiriki.
