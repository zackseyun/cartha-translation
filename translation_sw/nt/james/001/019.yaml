  text: ⸀Ἴστε, ἀδελφοί μου ἀγαπητοί. ἔστω ⸀δὲ πᾶς ἄνθρωπος ταχὺς εἰς τὸ ἀκοῦσαι, βραδὺς εἰς τὸ λαλῆσαι, βραδὺς εἰς ὀργήν,
base_translation:
  language: en
  yaml_path: translation/nt/james/001/019.yaml
  text: 'Know this[a], my beloved brothers: let every man be quick to hear, slow to speak, slow to anger[c][b],'
translation:
  language: sw
  text: 'Lijueni hili,[a] ndugu zangu wapendwa: kila mtu awe mwepesi wa kusikiliza, asiwe mwepesi wa kusema, wala asiwe mwepesi wa kukasirika.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mnajua hili”; kitenzi cha mwanzo cha Kigiriki kinaweza kueleweka kuwa taarifa badala ya amri.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἴστε
  choice: Lijueni hili
  rationale: Umbo hili linaweza kueleweka kama amri au kama taarifa. Muktadha wa mawaidha unaunga mkono amri; kiwakilishi “hili” kimeongezwa ili Kiswahili kiwe cha kawaida na kuonyesha kazi ya usemi huu katika hoja.
- source_word: ἀδελφοί μου ἀγαπητοί
  choice: ndugu zangu wapendwa
  rationale: “Ndugu” ni neno la kawaida la Kiswahili linaloweza kutaja waumini wa kiume na wa kike, huku likihifadhi lugha ya kifamilia ya ἀδελφοί; “wapendwa” linatafsiri ἀγαπητοί kwa heshima na kwa kawaida.
- source_word: ἔστω δὲ πᾶς ἄνθρωπος
  choice: kila mtu awe
  rationale: “Awe” linawasilisha amri ya nafsi ya tatu, na “kila mtu” linatoa maana ya jumla ya πᾶς ἄνθρωπος bila kudokeza kwamba wanaume pekee ndio wanaolengwa. δέ ni kiunganishi chepesi na hakihitaji kiunganishi tofauti hapa.
- source_word: ταχὺς εἰς τὸ ἀκοῦσαι
  choice: mwepesi wa kusikiliza
  rationale: “Kusikiliza” linaonyesha usikivu unaokusudiwa na ἀκοῦσαι kwa Kiswahili cha kawaida, kuliko “kusikia,” ambalo pia linaweza kumaanisha kupokea sauti bila kuzingatia.
- source_word: βραδὺς εἰς τὸ λαλῆσαι
  choice: si mwepesi wa kusema
  rationale: Hii ni njia ya asili ya Kiswahili ya kueleza kuwa mtu asiharakie kusema; inahifadhi ulinganifu wa kimaana na “mwepesi wa kusikiliza” bila kutumia “mwepesi” kwa maana ya Kiingereza isiyo ya kawaida.
- source_word: βραδὺς εἰς ὀργήν
  choice: wala wa kukasirika
  rationale: Katika mfuatano huu, “wala wa kukasirika” kwa kawaida hutegemea “si mwepesi” na hivyo humaanisha asiwe mwepesi wa kukasirika. ὀργή linaweza kutaja hasira, na “kukasirika” ni usemi wa sasa unaoeleweka vizuri.
theological_decisions:
- issue: 'Umbo la Ἴστε: amri au taarifa'
  choice: 'Amri: “Lijueni hili”'
  alternative: 'Taarifa: “Mnajua hili”'
  rationale: Mtiririko wa mawaidha na amri inayofuata unaunga mkono maana ya amri, lakini umbo la Kigiriki linaweza pia kuchukuliwa kuwa taarifa; uwezekano huo umehifadhiwa katika tanbihi.
- issue: Lugha wakilishi ya kijinsia katika ἀδελφοί na πᾶς ἄνθρωπος
  choice: “ndugu” na “kila mtu”
  alternative: “ndugu wa kiume” na “kila mwanamume”
  rationale: Katika Kiswahili, “ndugu” halitengi jinsia, na ἄνθρωπος hapa limetumiwa kwa maana ya jumla ya mwanadamu. Uchaguzi huu unawasilisha hadhira na upeo wa Kigiriki bila kuufanya mstari uonekane kuwaelekea wanaume pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye heshima lakini kinachoeleweka kwa urahisi. Muundo wa mwisho “si mwepesi wa kusema, wala wa kukasirika” ni wa asili katika Kiswahili na huhifadhi mpangilio wa usikivu, usemi na hasira.
