  yaml_path: translation/nt/james/001/020.yaml
  text: For a man's anger does not produce God's righteousness.
translation:
  language: sw
  text: Kwa maana hasira ya mwanadamu haileti haki ya Mungu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀργὴ
  choice: hasira
  rationale: Neno la kawaida na lenye hadhi linalowakilisha hali ya kukasirika katika muktadha huu.
- source_word: ἀνδρὸς
  choice: ya mwanadamu
  rationale: Hapa genitivi ina maana ya jumla kuhusu binadamu, si lazima mwanamume mmoja; “mwanadamu” ni jumuishi na inafaa katika sentensi ya hekima.
- source_word: δικαιοσύνην θεοῦ
  choice: haki ya Mungu
  rationale: 'Huhifadhi muundo na uwezekano wa maana wa Kigiriki: haki inayotoka kwa Mungu, inayomhusu, au anayoitaka, bila kuifafanua kupita kiasi.'
- source_word: οὐκ ἐργάζεται
  choice: haitendi
  rationale: Huwasilisha wazo la kutekeleza au kuleta kwa matendo. “Haitendi haki” ni Kiswahili cha kawaida na huhifadhi mvutano wa kauli kuliko kufafanua kuwa ‘haileti matokeo ya haki.’
theological_decisions:
- issue: Maana ya δικαιοσύνην θεοῦ
  choice: haki ya Mungu
  alternative: haki anayoitaka Mungu
  rationale: Kirai cha Kigiriki kinaweza kumaanisha haki inayotoka kwa Mungu, iliyo yake, au inayokubalika kwake. Tafsiri fupi huhifadhi utata huo wa kweli badala ya kuamua maana moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, kifupi na chenye hadhi. Muundo unaendana na kauli ya hekima katika muktadha. Hakuna alama za tanbihi kwa kuwa hakuna tanbihi zilizohitajika.
