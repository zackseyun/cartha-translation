  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὅτι εἴ τις ἀκροατὴς λόγου ἐστὶν καὶ οὐ ποιητής, οὗτος ἔοικεν ἀνδρὶ κατανοοῦντι τὸ πρόσωπον τῆς γενέσεως αὐτοῦ ἐν ἐσόπτρῳ,
base_translation:
  language: en
  yaml_path: translation/nt/james/001/023.yaml
  text: For if anyone is a hearer of the word and not a doer, this one is like a man carefully looking at the face of his birth[a] in a mirror,
translation:
  language: sw
  text: Kwa maana, ikiwa mtu ni msikiaji wa neno wala si mtendaji, huyo ni kama mwanamume anayeutazama kwa makini uso wake wa asili[a] katika kioo,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uso aliozaliwa nao.” Kigiriki kinasema kihalisi, “uso wa kuzaliwa kwake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκροατὴς
  choice: msikiaji
  rationale: Neno hili linahifadhi ulinganifu wa nomino kati ya anayesikia na anayetenda, ingawa ‘anayesikia’ lingekuwa la kawaida zaidi.
- source_word: λόγου
  choice: wa neno
  rationale: Hii ndiyo tafsiri ya moja kwa moja ya λόγος na inadumisha mwendelezo na muktadha unaozungumzia neno la Mungu.
- source_word: ποιητής
  choice: mtendaji
  rationale: Nomino hii inadumisha tofauti ya kimaadili kati ya msikiaji na mtendaji bila kuigeuza kuwa kitenzi.
- source_word: ἔοικεν
  choice: ni kama
  rationale: Hii ni lugha ya kawaida ya Kiswahili kwa kitenzi chenye maana ya sasa cha kufanana.
- source_word: ἀνδρὶ
  choice: mwanamume
  rationale: ἀνήρ ni neno mahsusi la jinsia ya kiume; ‘mwanamume’ huhifadhi umbo hilo huku mfano ukiweza kueleweka kwa matumizi ya jumla.
- source_word: κατανοοῦντι
  choice: anayeutazama kwa makini
  rationale: Hutoa wazo la kutazama kwa uangalifu, si kutupia jicho tu.
- source_word: τὸ πρόσωπον
  choice: uso
  rationale: Ni maana ya kawaida na ya moja kwa moja katika muktadha wa kioo.
- source_word: τῆς γενέσεως αὐτοῦ
  choice: wake wa kuzaliwa
  rationale: Inahifadhi usemi usio wa kawaida wa Kigiriki, ‘uso wa kuzaliwa kwake,’ huku tanbihi ikifafanua maana yake ya uso wa asili aliozaliwa nao.
- source_word: ἐν ἐσόπτρῳ
  choice: katika kioo
  rationale: Ni tafsiri ya wazi na ya kawaida katika Kiswahili cha sasa.
theological_decisions:
- issue: Lugha wakilishi yenye jinsia katika ἀνδρὶ
  choice: mwanamume
  alternative: mtu
  rationale: Chanzo kinatumia ἀνήρ, neno mahsusi la mwanamume, hivyo tafsiri inadumisha jinsia ya usemi wa mfano bila kudai kwamba matumizi yake yanawahusu wanaume peke yao.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa ‘uso wake wa kuzaliwa’ umehifadhiwa kwa ukaribu na chanzo licha ya kutokuwa usemi wa kawaida, na maana yake imefafanuliwa katika tanbihi.
