  text: διὸ ἀποθέμενοι πᾶσαν ῥυπαρίαν καὶ περισσείαν κακίας ἐν πραΰτητι δέξασθε τὸν ἔμφυτον λόγον τὸν δυνάμενον σῶσαι τὰς ψυχὰς ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/021.yaml
  text: Therefore, having put away all filthiness and the overflow of wickedness, receive with meekness the implanted word, which is able to save your souls.
translation:
  language: sw
  text: Basi, mkiisha kuondoa uchafu wote na wingi wa uovu, lipokeeni kwa upole neno lililopandwa,[a] ambalo linaweza kuokoa nafsi zenu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “neno lililo la asili”; jadi, “neno lililopandikizwa.”
    reason: lexical_alternative
  - marker: b
    text: Au “maisha yenu” au “ninyi wenyewe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: Kwa hiyo
  rationale: Inaonyesha hitimisho linalotokana na mawaidha yaliyotangulia kwa lugha ya kawaida na yenye staha.
- source_word: ἀποθέμενοι
  choice: ondoeni ... kisha lipokeeni
  rationale: Kiswahili cha amri mbili zilizounganishwa huwasilisha kwa kawaida tendo la kuondoa linalotangulia au kuandamana na amri kuu, bila kulazimisha mpangilio mkali wa wakati.
- source_word: πᾶσαν ῥυπαρίαν
  choice: uchafu wote
  rationale: Hudumisha picha halisi ya uchafu na maana yake ya kimaadili.
- source_word: περισσείαν κακίας
  choice: wingi wa uovu
  rationale: περισσεία huonyesha wingi au ziada, na κακία hapa lina maana pana ya uovu kuliko chuki pekee.
- source_word: ἐν πραΰτητι
  choice: kwa upole
  rationale: Huonyesha upole wenye unyenyekevu na utayari wa kufundishwa; ni Kiswahili cha sasa na cha kawaida.
- source_word: δέξασθε
  choice: lipokeeni
  rationale: Ni amri ya kulipokea neno kwa hiari; kiambishi li- kinaonyesha wazi kuwa neno ndilo linalopokewa.
- source_word: τὸν ἔμφυτον λόγον
  choice: neno lililopandwa ndani yenu
  rationale: Hudumisha picha ya kitu kilichowekwa na kukita ndani bila kuamua ikiwa maana ni ‘kilichopandikizwa’ au ‘cha asili.’
- source_word: τὸν δυνάμενον σῶσαι
  choice: ambalo linaweza kuokoa
  rationale: Hudumisha kauli ya uwezo wa neno bila kuongeza maelezo kuhusu namna ya wokovu.
- source_word: τὰς ψυχὰς ὑμῶν
  choice: nafsi zenu
  rationale: Hudumisha istilahi ya ψυχή na uzito wake katika muktadha wa wokovu, huku tanbihi ikitaja uwezekano wa maana ya watu wenyewe au maisha yao.
theological_decisions:
- issue: Maana ya ψυχὰς ὑμῶν katika muktadha wa wokovu
  choice: nafsi zenu
  alternative: ninyi wenyewe; maisha yenu
  rationale: ‘Nafsi zenu’ hudumisha uzito wa lugha ya wokovu na uhusiano wake wa moja kwa moja na ψυχή, bila kukataa maana pana ya mtu mzima.
- issue: Maana ya ἔμφυτον λόγον
  choice: neno lililopandwa ndani yenu
  alternative: neno la asili ndani yenu; neno lililopandikizwa
  rationale: Tafsiri hii hudumisha uwezekano wa neno kuwekwa na Mungu na sasa kukaa ndani ya wasikilizaji, bila kubainisha zaidi ya Kigiriki.
- issue: Uhusiano wa ἀποθέμενοι na δέξασθε
  choice: ondoeni ... kisha lipokeeni
  alternative: mkisha kuondoa ... lipokeeni
  rationale: Muundo uliochaguliwa ni wa kawaida zaidi katika Kiswahili na bado huonyesha kuwa kuachana na uovu kunahusiana kwa karibu na kulipokea neno; ‘kisha’ haitakiwi kueleweka kuwa lazima ni hatua mbili zilizotenganishwa kwa muda mrefu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye staha na kinachoeleweka kwa wasomaji wa kawaida. ‘Kwa upole’ limependelewa kuliko ‘kwa unyenyekevu’ ili kudumisha upana wa πραΰτης, na ‘wingi wa uovu’ ni ya asili zaidi kuliko taswira isiyo ya lazima ya kufurika.
