  source_fidelity: 'Tafsiri inafuata kwa uaminifu muundo na maana ya Kigiriki: γάρ imehifadhiwa kwa “Kwa maana”; katazo la οἰέσθω limetolewa kwa kawaida na kwa nguvu inayofaa katika “asidhani”; ὅτι imewakilishwa na “kwamba”; wakati ujao wa λήμψεταί umehifadhiwa katika “atapokea”; na τι katika mazingira hasi imetolewa vizuri kama “kitu chochote.” “Kutoka kwa Bwana” huwakilisha παρὰ τοῦ κυρίου kwa usahihi bila kufafanua referenti kupita maandishi.'
