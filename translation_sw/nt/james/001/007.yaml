base_translation:
  language: en
  yaml_path: translation/nt/james/001/007.yaml
  text: For that man must not suppose that he will receive anything from the Lord,[a]
translation:
  language: sw
  text: Kwa maana mtu huyo[a] asidhani kwamba atapokea kitu chochote kutoka kwa Bwana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtu yule.” Kigiriki kinamtaja mtu mmoja wa kiume, lakini mtu huyo anamwakilisha yeyote mwenye shaka anayeelezwa katika mstari uliotangulia.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ γὰρ
  choice: Kwa maana ... asidhani
  rationale: γάρ inaonyesha sababu inayounganisha onyo hili na maelezo ya mstari uliotangulia. Muundo hasi wa amri umetafsiriwa kwa Kiswahili cha kawaida kwa kutumia ‘asidhani.’
- source_word: οἰέσθω
  choice: asidhani
  rationale: Kitenzi hiki humaanisha kufikiri au kudhani. ‘Asidhani’ kinahifadhi tendo la kiakili na nguvu ya onyo bila kulitafsiri mapema kuwa matarajio.
- source_word: ὁ ἄνθρωπος ἐκεῖνος
  choice: mtu huyo
  rationale: Kirai hiki kinamrejelea mtu mmoja aliyetajwa kwa maelezo katika mstari uliotangulia. ‘Mtu huyo’ ni rejeo la kawaida na la wazi katika Kiswahili, huku likihifadhi umoja wa chanzo.
- source_word: ὅτι
  choice: kwamba
  rationale: Neno hili linaanzisha maudhui ya jambo ambalo mtu huyo hapaswi kudhani.
- source_word: λήμψεταί
  choice: atapokea
  rationale: Wakati ujao wa λαμβάνω umehifadhiwa kwa ‘atapokea,’ neno la kawaida na lenye hadhi linalofaa pamoja na kirai kinachoonyesha chanzo.
- source_word: τι
  choice: kitu chochote
  rationale: 'Katika muktadha hasi, ‘kitu chochote’ linaonyesha upana wa maana: si hata kitu kimoja.'
- source_word: παρὰ τοῦ κυρίου
  choice: kutoka kwa Bwana
  rationale: παρά pamoja na hali ya genitivi huonyesha chanzo. ‘Bwana’ linahifadhi cheo κύριος bila kumtambulisha mhusika kwa uwazi zaidi kuliko maandishi ya Kigiriki.
theological_decisions:
- issue: Mhusika anayerejelewa na τοῦ κυρίου
  choice: Bwana
  alternative: Mungu; Bwana Mungu
  rationale: Kigiriki kinatumia κύριος bila ufafanuzi mwingine. ‘Bwana’ kinahifadhi cheo cha chanzo na kuepuka kuongeza utambulisho ambao mstari huu hautaji wazi.
- issue: Umoja na uwakilishi katika ὁ ἄνθρωπος ἐκεῖνος
  choice: mtu huyo
  alternative: mtu yule; mtu wa namna hiyo
  rationale: Chanzo kinamtaja mtu mmoja anayerejelewa kutoka muktadha wa karibu. ‘Mtu huyo’ kinahifadhi umoja huo; tanbihi inaeleza kuwa mtu huyo anamwakilisha yeyote mwenye shaka anayetajwa katika mstari uliotangulia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa maandiko. ‘Kwa maana’ linaweka wazi uhusiano wa sababu, na ‘asidhani’ linaonyesha onyo moja kwa moja bila lugha ya kizamani.
