  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: μηδεὶς πειραζόμενος λεγέτω ὅτι Ἀπὸ θεοῦ πειράζομαι· ὁ γὰρ θεὸς ἀπείραστός ἐστιν κακῶν, πειράζει δὲ αὐτὸς οὐδένα.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/013.yaml
  text: Let no one who is being tempted say[a], “I am being tempted by God,” for God is untemptable by evil, and he himself tempts no one.
translation:
  language: sw
  text: Mtu yeyote anayeshawishiwa kutenda maovu asiseme, “Ninashawishiwa na Mungu,” kwa maana Mungu hashawishiki na maovu[a], wala yeye mwenyewe hamshawishi mtu yeyote kutenda maovu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa usemi wa kawaida zaidi, “Mungu hawezi kushawishiwa na uovu.” Neno la Kigiriki lililotafsiriwa “hashawishiki” ni adimu, na kishazi hicho kwa karibu zaidi ni “Mungu hashawishiki na maovu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδεὶς ... λεγέτω
  choice: Mtu yeyote ... asiseme
  rationale: 'Muundo huu wa kukataza katika Kigiriki unawasilishwa kwa Kiswahili cha kawaida kwa kiima kisicho maalumu pamoja na hali ya kutenda yenye kukanusha: ‘Mtu yeyote ... asiseme.’'
- source_word: πειραζόμενος
  choice: anaposhawishiwa kutenda maovu
  rationale: Katika muktadha wa tamaa na dhambi (mstari wa 14–15), kitenzi hiki kinamaanisha kushawishiwa kufanya uovu, si kupewa mtihani kwa maana pana. ‘Anaposhawishiwa’ pia hudumisha hali ya kutendwa.
- source_word: Ἀπὸ θεοῦ πειράζομαι
  choice: Mungu ndiye anayenishawishi
  rationale: ἀπό huonyesha chanzo cha kishawishi. Muundo wenye ‘ndiye’ unasema kwa Kiswahili cha asili dai kwamba Mungu ndiye chanzo au mtendaji, huku ukidumisha msisitizo wa kauli hiyo.
- source_word: ἀπείραστός ... κακῶν
  choice: hashawishiki na maovu
  rationale: Kivumishi hiki adimu kinaonyesha kwamba Mungu haathiriwi na kishawishi cha maovu. Usemi mfupi ‘hashawishiki’ hudumisha umbo la kivumishi kwa kadiri inayowezekana katika Kiswahili, bila kuficha ugumu wa kishazi cha Kigiriki.
- source_word: πειράζει δὲ αὐτὸς οὐδένα
  choice: wala yeye mwenyewe hamshawishi mtu yeyote kutenda maovu
  rationale: ‘Yeye mwenyewe’ hudumisha msisitizo wa αὐτός, na ‘mtu yeyote’ huwasilisha οὐδένα kwa kawaida. Nyongeza ‘kutenda maovu’ huweka wazi maana ya kishawishi cha kimaadili katika Kiswahili.
theological_decisions:
- issue: Maana ya πειράζω katika mstari huu
  choice: Kutumia ‘kushawishi kutenda maovu’ katika matukio yote ya kitenzi hicho.
  alternative: Kutumia ‘kujaribu’ au kutofautisha kati ya ‘kujaribu’ na ‘kushawishi.’
  rationale: Muktadha unaofuata unaeleza tamaa inayozaa dhambi; hivyo hapa Yakobo anakataa kwamba Mungu ni chanzo cha kishawishi cha kutenda uovu. Tafsiri hii haikatai kwamba katika miktadha mingine Mungu anaweza kuwapima watu.
- issue: Maana ya ἀπείραστός ἐστιν κακῶν
  choice: ‘Mungu hashawishiki na maovu.’
  alternative: ‘Mungu hawezi kushawishiwa na uovu’; au, ‘Mungu hana uzoefu wa maovu.’
  rationale: Kishazi cha Kigiriki ni kigumu na neno ἀπείραστος ni adimu. Katika hoja ya mstari huu, maana inayofaa zaidi ni kwamba maovu hayawezi kumshawishi Mungu; maelezo ya chini yanahifadhi njia laini zaidi ya kusema hivyo bila kudai kwamba umbo la Kigiriki halina utata.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Kushawishiwa kutenda maovu’ limechaguliwa badala ya ‘kujaribiwa’ ili kuepuka kuchanganya kishawishi cha dhambi na kupimwa kwa imani. Alama ya tanbihi [a] imewekwa moja kwa moja baada ya kishazi kinachoelezwa.
