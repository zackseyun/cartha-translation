  text: θρησκεία καθαρὰ καὶ ἀμίαντος παρὰ ⸀τῷ θεῷ καὶ πατρὶ αὕτη ἐστίν, ἐπισκέπτεσθαι ὀρφανοὺς καὶ χήρας ἐν τῇ θλίψει αὐτῶν, ἄσπιλον ἑαυτὸν τηρεῖν ἀπὸ τοῦ κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/027.yaml
  text: 'Religion that is pure and undefiled before God the Father is this: to care for orphans and widows in their affliction[b][a], and to keep oneself unstained from the world.'
translation:
  language: sw
  text: 'Dini iliyo safi na isiyo na unajisi mbele za Mungu Baba ni hii: kuwajali yatima na wajane katika dhiki yao[a], na kujiweka pasipo doa la ulimwengu[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuwatembelea yatima na wajane katika dhiki yao”; kitenzi cha Kigiriki kinaweza kujumuisha kuwatembelea pamoja na kuwashughulikia kwa matendo.
    reason: lexical_alternative
  - marker: b
    text: “Ulimwengu” hapa unamaanisha utaratibu wenye ufisadi wa kimaadili unaompinga Mungu, wala si uumbaji wenyewe.
    reason: cultural_note
lexical_decisions:
- source_word: θρησκεία
  choice: dini
  rationale: Hurejelea utendaji wa nje wa ibada na uchaji; “dini” ni neno la kawaida la Kiswahili na hapa linafafanuliwa kwa matendo.
- source_word: καθαρὰ καὶ ἀμίαντος
  choice: iliyo safi na isiyo na unajisi
  rationale: Huhifadhi jozi ya usafi wa kidini na kimaadili bila kuyafanya maneno hayo kuwa visawe kamili.
- source_word: παρὰ τῷ θεῷ καὶ πατρὶ
  choice: mbele za Mungu Baba
  rationale: παρά pamoja na hali ya dative huonyesha tathmini mbele za Mungu; muundo huu unamtambulisha Mungu kuwa Baba.
- source_word: ἐπισκέπτεσθαι
  choice: kuwajali
  rationale: Katika muktadha huu kitenzi kinamaanisha kuwaendea wahitaji kwa lengo la kuwashughulikia na kuwasaidia, si kuwatembelea kijamii tu.
- source_word: ὀρφανοὺς καὶ χήρας
  choice: yatima na wajane
  rationale: Haya ndiyo maneno ya kawaida na ya moja kwa moja kwa makundi haya yaliyo hatarini.
- source_word: ἐν τῇ θλίψει αὐτῶν
  choice: katika dhiki yao
  rationale: “Dhiki” huhifadhi uzito wa shida, mateso, au taabu inayodokezwa na θλῖψις.
- source_word: ἄσπιλον ἑαυτὸν τηρεῖν
  choice: kujitunza mwenyewe usitiwe doa
  rationale: Usemi huu huhifadhi picha ya doa la kimaadili na wajibu wa mtu wa kuendelea kujilinda; “mwenyewe” huonyesha nguvu ya kiwakilishi cha kujirejelea.
- source_word: ἀπὸ τοῦ κόσμου
  choice: na ulimwengu
  rationale: Katika muundo wa Kiswahili, “usitiwe doa na ulimwengu” huonyesha chanzo cha uchafuzi huku ukihifadhi neno la wazi “ulimwengu” bila kulifafanua kupita kiasi.
theological_decisions:
- issue: Maana ya κόσμος katika muktadha wa maadili
  choice: Kudumisha “ulimwengu” katika andiko kuu, huku tanbihi ikieleza maana yake ya kimaadili.
  alternative: ufisadi wa ulimwengu; mfumo wa ulimwengu huu
  rationale: Hii huhifadhi mvutano wa usemi wa Yakobo na kuepuka kudokeza kuwa uumbaji wenyewe ni mchafu au kuingiza tafsiri ya kujitenga na jamii.
- issue: Nguvu ya jumla ya ἑαυτόν
  choice: 'Kutumia muundo wa nafsi ya pili wa jumla: “kujitunza mwenyewe usitiwe doa.”'
  alternative: kujiweka bila doa; kujilinda mtu mwenyewe
  rationale: Kauli ya Kigiriki ni kanuni inayomhusu kila mtu, si wanaume peke yao; nafsi ya pili ya jumla ni ya kawaida na wazi katika Kiswahili.
- issue: Uhusiano wa θεῷ καὶ πατρὶ
  choice: Mungu Baba
  alternative: Mungu na Baba; Mungu wetu na Baba
  rationale: Muktadha na muundo wa Kigiriki vinaunga mkono kumweleza mhusika mmoja kuwa Mungu ambaye ni Baba, bila kuongeza “wetu,” ambalo halipo wazi katika maandishi haya.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Dini” na “dhiki” ni maneno yanayoeleweka kwa upana; sentensi inahifadhi mlingano wa vipengele viwili vya uchaji wa kweli: kuwajali walio dhaifu na kujilinda dhidi ya uchafuzi wa kimaadili.'
