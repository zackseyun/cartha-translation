  text: αἰτείτω δὲ ἐν πίστει, μηδὲν διακρινόμενος, ὁ γὰρ διακρινόμενος ἔοικεν κλύδωνι θαλάσσης ἀνεμιζομένῳ καὶ ῥιπιζομένῳ·
base_translation:
  language: en
  yaml_path: translation/nt/james/001/006.yaml
  text: But let him ask in faith[a], doubting nothing, for the one who doubts is like a wave of the sea, driven by the wind and tossed about.
translation:
  language: sw
  text: Lakini na aombe kwa imani[a], bila kuwa na shaka yoyote, kwa maana mwenye shaka ni kama wimbi la bahari linalosukumwa na upepo na kupeperushwa huku na huku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa kumtumaini Mungu.” Katika muktadha huu, neno la Kigiriki linalotafsiriwa “imani” linaweza pia kumaanisha kumtegemea Mungu kwa moyo wa tumaini.
    reason: lexical_alternative
lexical_decisions:
- source_word: αἰτείτω
  choice: na aombe
  rationale: Kauli ya kuamuru kwa nafsi ya tatu ina nguvu ya himizo; katika muktadha, kinachoombwa ni hekima kutoka kwa Mungu.
- source_word: δὲ
  choice: Lakini
  rationale: Inaonyesha utofautishaji au hatua mpya yenye masharti baada ya ahadi ya mstari uliotangulia.
- source_word: ἐν πίστει
  choice: kwa imani
  rationale: Ni Kiswahili cha kawaida kinachoonyesha namna ya kuomba, huku kikihifadhi uzito wa πίστις kama imani na tegemeo kwa Mungu.
- source_word: μηδὲν διακρινόμενος
  choice: bila kuwa na shaka yoyote
  rationale: Katika muktadha huu διακρίνω inaonyesha kusitasita au kuwa na shaka moyoni; μηδέν inasisitiza kutokuwa na shaka hata kidogo.
- source_word: ὁ γὰρ διακρινόμενος
  choice: kwa maana mwenye shaka
  rationale: Kirai cha Kigiriki kinamtaja mtu yeyote mwenye hali hiyo; tafsiri hii ni ya jumla na ya asili katika Kiswahili.
- source_word: ἔοικεν
  choice: ni kama
  rationale: Huwasilisha ulinganisho huo kwa lugha rahisi na ya kawaida.
- source_word: κλύδωνι θαλάσσης
  choice: wimbi la bahari
  rationale: κλύδων hurejelea wimbi au msukosuko wa bahari; usemi huu ni wazi na wenye picha hai.
- source_word: ἀνεμιζομένῳ
  choice: linalosukumwa na upepo
  rationale: Huhifadhi hali ya kutendwa na kuonyesha upepo kama nguvu inayolisogeza wimbi.
- source_word: καὶ ῥιπιζομένῳ
  choice: na kurushwa huku na huku
  rationale: Huonyesha wazi kutokuwa thabiti na kuyumbishwa kwa wimbi bila kuongeza wazo lisilokuwapo katika chanzo.
theological_decisions:
- issue: Maana ya πίστις katika himizo la kuomba
  choice: imani
  alternative: tumaini lenye kutegemea / kumtumaini Mungu
  rationale: “Imani” hudumisha istilahi kuu ya πίστις na mwendelezo wake wa kitheolojia, huku tanbihi ikifafanua kuwa katika muktadha huu inahusisha kumtegemea Mungu kwa moyo wa tumaini.
- issue: Maana ya διακρινόμενος
  choice: mwenye shaka
  alternative: mwenye kusitasita / anayeyumba
  rationale: Katika ulinganisho na wimbi, neno linaashiria mgawanyiko wa ndani au kusitasita. “Mwenye shaka” ni wazi, lakini taswira ya kuyumba imeachwa ionekane kupitia wimbi badala ya kuingizwa moja kwa moja katika istilahi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Na aombe” huhifadhi himizo la Kigiriki; “huku na huku” hufanya taswira ya kutokuwa thabiti iwe wazi kwa msomaji wa kawaida. Alama ya tanbihi [a] imewekwa mara baada ya “imani”.
