  text: ἡ δὲ ὑπομονὴ ἔργον τέλειον ἐχέτω, ἵνα ἦτε τέλειοι καὶ ὁλόκληροι, ἐν μηδενὶ λειπόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/004.yaml
  text: And let endurance have its perfect work[a], so that you may be mature and complete, lacking in nothing.
translation:
  language: sw
  text: Saburi nayo na itimize kazi yake kikamilifu,[a] ili mpate kuwa wakomavu na watimilifu, bila kupungukiwa na kitu chochote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na iwe na kazi kamilifu.” Maneno ya Kigiriki yanayohusiana hapa yanaeleza kufikia lengo lililokusudiwa na kuwa mzima katika kila sehemu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπομονὴ
  choice: saburi
  rationale: Katika muktadha wa majaribu, neno hili linaonyesha ustahimilivu wa kudumu chini ya shinikizo. “Saburi” ni neno la kawaida na lenye hadhi katika Kiswahili, na hapa muktadha unaonyesha kuwa si kusubiri tu bali kudumu kwa uthabiti.
- source_word: ἔργον τέλειον
  choice: itimiza kazi yake kikamilifu
  rationale: Muundo huu unaeleza kazi ya saburi kufikia lengo lake kamili. Tafsiri hii ni ya asili katika Kiswahili kuliko muundo halisi “iwe na kazi kamilifu,” huku ikihifadhi wazo la kazi inayofikishwa kwenye ukamilifu.
- source_word: ἐχέτω
  choice: na itimize
  rationale: Huhifadhi nguvu ya amri ya nafsi ya tatu kwa muundo wa Kiswahili “na…,” bila kuifanya kuwa taarifa ya kawaida.
- source_word: ἵνα ἦτε
  choice: ili mpate kuwa
  rationale: Huhifadhi maana ya kusudi au matokeo inayobebwa na ἵνα pamoja na hali tegemezi.
- source_word: τέλειοι
  choice: wakomavu
  rationale: Kwa watu, τέλειοι hapa inaweza kumaanisha waliofikia ukomavu au lengo lililokusudiwa, si lazima ukamilifu usio na dhambi.
- source_word: ὁλόκληροι
  choice: watimilifu
  rationale: Neno hili linasisitiza kuwa kamili au mzima katika sehemu zote. “Watimilifu” linatofautishwa na “wakomavu” huku likidumisha wazo la ukamilifu wa jumla.
- source_word: ἐν μηδενὶ λειπόμενοι
  choice: bila kupungukiwa na kitu chochote
  rationale: Ni Kiswahili cha kawaida kinachohifadhi nguvu pana ya kutokuwa na upungufu katika jambo lolote.
- source_word: δὲ
  choice: Nayo
  rationale: Hapa δέ inaendeleza hoja ya mstari uliotangulia. “Nayo” huunganisha saburi na matokeo ya kujaribiwa kwa imani bila kuleta utofauti mkali.
theological_decisions:
- issue: Maana ya τέλειοι katika muktadha wa kukua kiroho
  choice: wakomavu
  alternative: wakamilifu
  rationale: “Wakomavu” huonyesha kufikia lengo na kukua kiroho bila kuamua kwamba mstari unafundisha hali ya kutokuwa na dhambi kabisa. Dokezo linahifadhi uhusiano wa maneno ya Kigiriki kuhusu ukamilifu na utimilifu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo “na itimize” huhifadhi amri huku “kazi yake kikamilifu” ikitoa Kiswahili asilia. Alama ya tanbihi [a] imewekwa baada ya kishazi kinachohusika.
