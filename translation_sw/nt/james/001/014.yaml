base_translation:
  language: en
  yaml_path: translation/nt/james/001/014.yaml
  text: But each one is tempted by his own desire[b][a], being drawn away and enticed.
translation:
  language: sw
  text: Lakini kila mtu hujaribiwa na tamaa yake mwenyewe[a], akivutwa na kushawishiwa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “hamu yake mwenyewe” au “uchu wake mwenyewe.” Neno la Kigiriki linaweza kumaanisha hamu kali kwa ujumla, si tamaa ya ngono pekee.
    reason: lexical_alternative
  - marker: b
    text: Vitenzi hivi viwili vinadokeza taswira ya kuvutwa mbali na kunaswa kwa chambo, kama katika uwindaji au uvuvi.
    reason: cultural_note
lexical_decisions:
- source_word: ἕκαστος
  choice: kila mtu
  rationale: Huhifadhi maana ya mgawanyo ya umoja—kila mmoja binafsi—kwa Kiswahili cha kawaida na cha asili.
- source_word: δὲ
  choice: Lakini
  rationale: 'Huonyesha utofautishaji wa kiasi na mstari uliotangulia: si Mungu anayemjaribu mtu; badala yake chanzo cha karibu ni tamaa ya mtu mwenyewe.'
- source_word: πειράζεται
  choice: hujaribiwa
  rationale: Katika muktadha huu kitenzi kinamaanisha kushawishiwa kutenda dhambi, si kupimwa tu, kama inavyoonekana katika mstari wa 13 na maendeleo ya dhambi katika mstari wa 15.
- source_word: ὑπὸ τῆς ἰδίας ἐπιθυμίας
  choice: na tamaa yake mwenyewe
  rationale: Kiambishi “na” kinaonyesha kisababishi au chanzo kinachotenda, huku “yake mwenyewe” kikisisitiza kuwa tamaa hiyo ni ya mtu huyo binafsi.
- source_word: ἐπιθυμίας
  choice: tamaa
  rationale: “Tamaa” huweza kumaanisha hamu kali yenye mwelekeo mbaya katika muktadha huu bila kuifungia maana kwenye tamaa ya ngono pekee.
- source_word: ἐξελκόμενος
  choice: anapovutwa
  rationale: Huhifadhi taswira ya kuvutwa kutoka mahali au kuelekezwa mbali, bila kuongeza kwa lazima wazo la nguvu kali lililo katika “kuburutwa.”
- source_word: καὶ δελεαζόμενος
  choice: na kushawishiwa
  rationale: Ni usemi wa asili unaowasilisha kuvutiwa kuelekea mtego; dokezo la chambo katika kitenzi cha Kigiriki linaelezwa katika tanbihi.
theological_decisions:
- issue: Chanzo cha jaribu kuhusiana na Mungu
  choice: Mstari unahusisha jaribu na tamaa ya mtu mwenyewe, wala si Mungu.
  alternative: Kutafsiri kwa maana ya hali za nje zinazompima mtu tu.
  rationale: Muktadha wa karibu katika mstari wa 13 unakana kuwa Mungu humjaribu mtu, na mstari huu unaeleza chanzo cha karibu cha jaribu bila kutoa kauli pana zaidi kuhusu visababishi vyote.
- issue: Umoja unaomwakilisha kila mtu
  choice: “kila mtu” pamoja na “yake mwenyewe”
  alternative: Kutumia muundo wa wingi kama “watu ... tamaa zao wenyewe.”
  rationale: Muundo wa umoja huhifadhi msisitizo wa Kigiriki juu ya wajibu wa kila mtu binafsi, huku Kiswahili kisihitaji kuweka jinsia ya kiume katika kiwakilishi kimilikishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa “anapovutwa na kushawishiwa” unaunganisha vishirikishi vya Kigiriki kwa njia ya asili huku ukihifadhi taswira na mfuatano wake. Alama zote za tanbihi zimewekwa katika maandishi makuu.
