  text: Πᾶσα δόσις ἀγαθὴ καὶ πᾶν δώρημα τέλειον ἄνωθέν ἐστιν, καταβαῖνον ἀπὸ τοῦ πατρὸς τῶν φώτων, παρ’ ᾧ οὐκ ἔνι παραλλαγὴ ἢ τροπῆς ἀποσκίασμα.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/017.yaml
  text: Every good gift and every perfect gift is from above[a], coming down from the Father of lights[b], with whom there is no variation or shadow of turning.
translation:
  language: sw
  text: Kila kipawa chema[a] na kila zawadi kamilifu hutoka juu, vinavyoshuka kutoka kwa Baba wa mianga, ambaye kwake hakuna badiliko wala kivuli cha mgeuko[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kila tendo jema la kutoa na kila zawadi kamilifu.” Nomino ya kwanza inaweza kusisitiza tendo la kutoa, ilhali ya pili inasisitiza zawadi yenyewe.
    reason: lexical_alternative
  - marker: b
    text: Au, “kivuli kinachosababishwa na mgeuko” au “kivuli kinachobadilika.” Huenda usemi huu unadokeza vivuli vinavyobadilika kutokana na mwendo wa mianga ya angani.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶσα δόσις ἀγαθὴ
  choice: Kila kipawa chema
  rationale: δόσις inaweza kumaanisha tendo la kutoa au kile kinachotolewa. “Kipawa” ni cha kawaida na cha asili katika Kiswahili, huku tanbihi ikihifadhi maana ya tendo la kutoa.
- source_word: πᾶν δώρημα τέλειον
  choice: kila zawadi kamilifu
  rationale: δώρημα hulenga hasa kitu kilichotolewa. “Zawadi” inakitofautisha kwa kiasi na “kipawa,” na “kamilifu” huhifadhi wazo la ukamilifu au wema usiopungua.
- source_word: ἄνωθέν ἐστιν
  choice: hutoka juu
  rationale: Usemi huu unaeleza chanzo cha vipawa na zawadi. “Hutoka juu” ni wa asili katika Kiswahili na huhifadhi maana ya ἄνωθεν.
- source_word: καταβαῖνον
  choice: vikishuka
  rationale: Kitenzi hiki kinaendeleza taswira ya vitu vinavyotoka juu na kushuka. Upatanisho wa wingi unarejelea kwa pamoja vipawa na zawadi zilizotajwa.
- source_word: ἀπὸ τοῦ πατρὸς τῶν φώτων
  choice: kutoka kwa Baba wa mianga
  rationale: “Baba wa mianga” huhifadhi sitiari na wingi wa φώτων bila kuamua wazi katika matini kuu kwamba ni mianga ya angani.
- source_word: παρ’ ᾧ οὐκ ἔνι παραλλαγὴ
  choice: ambaye kwake hakuna badiliko
  rationale: Muundo huu huhifadhi maana ya uhusiano katika παρ’ ᾧ na kauli ya kutokuwapo kwa badiliko bila kuibadili kuwa ufafanuzi mpana wa kimafundisho.
- source_word: ἢ τροπῆς ἀποσκίασμα
  choice: wala kivuli cha kugeuka
  rationale: “Kivuli cha kugeuka” huhifadhi kwa karibu taswira tata ya Kigiriki na uhusiano wa maneno hayo; tanbihi inaeleza uwezekano wa kivuli kinachobadilika.
theological_decisions:
- issue: Taswira ya “Baba wa mianga” na kutobadilika kwa Mungu
  choice: Kudumisha sitiari ya “Baba wa mianga” pamoja na kauli kwamba kwake hakuna badiliko wala kivuli cha kugeuka.
  alternative: Kufafanua “mianga” kuwa jua, mwezi na nyota, au kutafsiri kifungu cha mwisho kwa ujumla kuwa “Mungu habadiliki.”
  rationale: Kigiriki kinatofautisha Baba na mabadiliko yanayohusishwa na mianga na vivuli. Matini kuu inahifadhi taswira hiyo na mvutano wake bila kuipanua kuwa tamko la kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Kipawa” na “zawadi” zinatunza mlingano wa maneno mawili tofauti ya Kigiriki; “Baba wa mianga” na “kivuli cha kugeuka” zinahifadhi taswira ya asili, huku tanbihi zikifafanua utata wa kileksia.
