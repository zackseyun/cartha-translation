  yaml_path: translation/nt/james/001/010.yaml
  text: and the rich man in his humiliation[b][a], because like a flower of grass he will pass away.
translation:
  language: sw
  text: naye tajiri katika kushushwa kwake[a], kwa sababu atatoweka kama ua la nyasi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa kuweka wazi kitenzi kilichodokezwa kutoka mstari uliotangulia: “naye tajiri na ajivunie kushushwa kwake.”'
    reason: alternative_reading
  - marker: b
    text: “Ua la nyasi” ni tafsiri ya karibu ya taswira ya Kigiriki, inayokazia jinsi tajiri anavyotoweka upesi kama uoto uliochanua.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ πλούσιος
  choice: naye tajiri
  rationale: “Naye” huunganisha tajiri na ndugu wa hali ya chini katika mstari uliotangulia, huku ikidokeza utofautiano bila kuutia chumvi. Nomino ya Kigiriki imetumiwa kumaanisha mtu tajiri.
- source_word: ἐν τῇ ταπεινώσει αὐτοῦ
  choice: katika kushushwa kwake
  rationale: “Kushushwa” huhifadhi wazo la kuletwa chini au kupoteza hadhi, badala ya kulifanya hasa kuwa adili la unyenyekevu. Muundo huu pia unaacha kitenzi kilichodokezwa kutoka mstari wa 9 bila kukiongeza katika matini.
- source_word: ὅτι
  choice: kwa sababu
  rationale: 'Huwasilisha wazi uhusiano wa sababu: kutoweka kwa tajiri ndiko kunakoeleza kushushwa kwake.'
- source_word: ὡς ἄνθος χόρτου
  choice: kama ua la nyasi
  rationale: Huhifadhi kwa karibu taswira ya Kigiriki ya ua linalotokana na uoto wa muda mfupi. Ingawa “ua la porini” lingekuwa laini zaidi, lingeongeza wazo lisilotajwa moja kwa moja.
- source_word: παρελεύσεται
  choice: atatoweka
  rationale: Katika taswira hii kitenzi kinaonyesha kupita na kutokuwapo tena. “Atatoweka” ni Kiswahili cha kawaida kinachoonyesha hali ya muda mfupi bila kutoa maana ya kimahali ya “atapita kando.”
theological_decisions:
- issue: Kitenzi kilichodokezwa kutoka mstari uliotangulia
  choice: Matini inaacha kitenzi bila kutajwa, kama ilivyo katika Kigiriki, na kueleza uwezekano wa kukijaza katika tanbihi.
  alternative: “naye tajiri na ajivunie kushushwa kwake”
  rationale: Kigiriki cha mstari huu hutegemea agizo la mstari wa 9. Kukiongeza kungerahisisha usomaji, lakini kungeweka katika matini maneno yasiyopo katika mstari huu.
- issue: Maana ya kushushwa kwa tajiri
  choice: Kushushwa au kuletwa chini kwa tajiri kwa kuzingatia kutodumu kwa maisha na hadhi yake
  alternative: Unyenyekevu wa hiari au hali ya kawaida ya kuwa na hadhi ya chini
  rationale: Sababu inayofuata—kwamba tajiri atatoweka kama ua la nyasi—inaelekeza hasa kwenye kuporomoka kwa hadhi na kutodumu, si kwanza kwenye sifa ya kiroho ya unyenyekevu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. “Naye” hudumisha uhusiano na mstari wa 9; sentensi iliyokatika kimakusudi huhifadhi udondoshaji wa kitenzi uliopo katika Kigiriki. Alama zote za tanbihi zimewekwa mahali zinapohusika katika matini.
