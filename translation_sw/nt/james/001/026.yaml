revisions:
- from: Mtu akijiona kuwa ni mtu wa dini, lakini hauzuii kwa hatamu ulimi wake bali anadanganya moyo wake mwenyewe, dini ya mtu huyo haina faida.[a][b][c]
  to: Mtu akidhani[a] kuwa yeye ni mtu wa dini, lakini asipoutia ulimi wake hatamu[b], bali akidanganya moyo wake, dini ya mtu huyo ni bure[c].
  rationale: The revision corrects the grammatical agreement error, keeps the source’s bridle metaphor, uses ‘bure’ for the broader force of μάταιος, and moves every footnote marker to its corresponding expression. It maintains the generic singular scope naturally expressed by ‘Mtu’ in Swahili.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T07:59:11Z'
review_pass:
  verdict: revise
  source_fidelity: The draft conveys the principal contrast and preserves the concrete terms ‘ulimi’ and ‘moyo.’ However, ‘hauzuii’ has incorrect noun-class agreement for the person introduced by ‘Mtu’; it means something like ‘it does not restrain’ rather than ‘he/she does not bridle.’ The revision renders χαλιναγωγῶν with the direct bridle image and retains μάταιος as ‘bure.’
  naturalness: The revised conditional construction is idiomatic Standard East African Swahili. ‘Kuutilia ulimi hatamu’ is a clear, natural way to retain the Greek metaphor without flattening it to merely controlling speech.
  terminology: ‘Mtu wa dini’ / ‘dini’ appropriately preserves the lexical relationship between θρησκός and θρησκεία without reducing the expression to inward piety or a particular form of worship. ‘Moyo wake’ retains the biblical-personal sense of καρδία without unnecessarily expanding it to ‘mwenyewe.’
  issues:
  - severity: high
    issue: Incorrect subject agreement in ‘lakini hauzuii kwa hatamu ulimi wake.’
    rationale: With ‘Mtu’ as the antecedent, the negative verbal form must refer to that person (for example, ‘asipoutia ... hatamu’). The existing ‘hauzuii’ uses ngeli ya U/I and does not grammatically express the Greek participle’s human subject.
  - severity: medium
    issue: Footnote markers are all placed at the sentence end rather than on their respective translated expressions.
    rationale: 'This makes the lexical alternatives ambiguous. Each marker should directly follow the word or phrase it explains: δοκεῖ, χαλιναγωγῶν, and μάταιος.'
  - severity: low
    issue: The main rendering ‘haina faida’ is somewhat narrower than μάταιος.
    rationale: Μάταιος denotes futility, emptiness, or worthlessness, not only lack of practical benefit. ‘Ni bure’ more directly preserves this range in contemporary Swahili.
  revised_text: Mtu akidhani[a] kuwa yeye ni mtu wa dini, lakini asipoutia ulimi wake hatamu[b], bali akidanganya moyo wake, dini ya mtu huyo ni bure[c].
  revised_footnotes:
