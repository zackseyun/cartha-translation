source:
  edition: SBLGNT
  text: Εἴ τις δοκεῖ θρησκὸς ⸀εἶναι μὴ χαλιναγωγῶν γλῶσσαν ⸀αὐτοῦ ἀλλὰ ἀπατῶν καρδίαν ⸀αὐτοῦ, τούτου μάταιος ἡ θρησκεία.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/026.yaml
  text: If anyone thinks he is religious while not bridling his tongue but deceiving his heart[c][b][a], this person's religion is worthless.
translation:
  language: sw
  text: Mtu akidhani[a] kuwa yeye ni mtu wa dini, lakini asipoutia ulimi wake hatamu[b], bali akidanganya moyo wake, dini ya mtu huyo ni bure[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akijiona kuwa yeye ni mtu wa dini.”
    reason: lexical_alternative
  - marker: b
    text: Kigiriki hutumia taswira ya kuutia ulimi hatamu, kama mnyama anavyodhibitiwa kwa hatamu.
    reason: lexical_alternative
  - marker: c
    text: Au, “batili” au “isiyo na maana.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δοκεῖ
  choice: akijiona
  rationale: Huwasilisha tathmini ya mtu kujihusu katika muktadha huu, huku ikiacha nafasi ya maana ya ‘akidhani.’
- source_word: θρησκὸς
  choice: mtu wa dini
  rationale: Ni usemi wa kawaida na wenye kueleweka unaoelekeza kwenye utambulisho au mwenendo wa kidini bila kuufanya kuwa uchaji wa ndani pekee.
- source_word: χαλιναγωγῶν
  choice: hauzuii kwa hatamu
  rationale: Inahifadhi taswira halisi ya hatamu inayotumiwa kudhibiti mnyama na uhusiano wake na Yakobo 3:2.
- source_word: γλῶσσαν αὐτοῦ
  choice: ulimi wake
  rationale: Tafsiri halisi huhifadhi kiungo cha mwili na matumizi yake kama taswira ya usemi.
- source_word: ἀπατῶν καρδίαν αὐτοῦ
  choice: anadanganya moyo wake mwenyewe
  rationale: Inahifadhi ‘moyo’ kama nafsi ya ndani na kuweka wazi kuwa udanganyifu unamrudia mtu huyo.
- source_word: τούτου
  choice: ya mtu huyo
  rationale: Huhifadhi nguvu ya kiwakilishi cha kuonyesha kinachomrejelea mtu aliyefafanuliwa.
- source_word: μάταιος
  choice: haina faida
  rationale: Hutoa kwa Kiswahili cha sasa maana ya kuwa bure, batili, au kutokuwa na manufaa.
- source_word: ἡ θρησκεία
  choice: dini
  rationale: Ni kisawe cha moja kwa moja kinachohifadhi uhusiano wa kileksika na θρησκός na kurejelea mwenendo wa kidini.
theological_decisions:
- issue: Rejeo la jumla lenye umoja wa kiume katika Kigiriki
  choice: Mtu ... ulimi wake ... moyo wake mwenyewe
  alternative: Yeyote ... ulimi wao ... moyo wao
  rationale: Kiswahili hutumia ‘mtu’ na viambishi vya ngeli yake kwa maana ya jumla bila kulazimika kuingiza jinsia ya kiume; hivyo maana ya jumla na umoja wa chanzo huhifadhiwa kwa kawaida.
- issue: Maana ya θρησκεία/θρησκός
  choice: mtu wa dini / dini
  alternative: mcha Mungu / uchaji; mwabudu / ibada
  rationale: Chaguo hili huhifadhi kiungo kati ya kivumishi na nomino na halipunguzi maana iwe ibada pekee wala hali ya ndani ya uchaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo wa sentensi umewekwa wazi kwa msomaji wa kawaida, huku taswira ya hatamu, ‘ulimi,’ na ‘moyo’ ikihifadhiwa. Alama zote za tanbihi zimewekwa katika matini kuu.
