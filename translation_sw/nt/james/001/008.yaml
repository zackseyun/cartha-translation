translation:
  language: sw
  text: mtu wa nia mbili[a], asiye na msimamo katika njia zake zote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mwanamume wa nia mbili.” Nomino ya Kigiriki ni ya kiume katika umoja, lakini katika muktadha huu inatumika kwa maana wakilishi inayomhusu mtu yeyote.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνὴρ
  choice: mtu
  rationale: Ingawa nomino ya Kigiriki ni ya kiume na iko katika umoja, hapa inamrejelea kwa ujumla yule anayeomba aliyetajwa katika mstari uliotangulia. “Mtu” ni Kiswahili cha kawaida kinachowasilisha nguvu hiyo wakilishi bila kuifanya kauli ihusu wanaume pekee.
- source_word: δίψυχος
  choice: mwenye nia mbili
  rationale: Neno hili adimu lina wazo halisi la kuwa na “nafsi mbili,” yaani kugawanyika kwa ndani au katika uaminifu. “Mwenye nia mbili” ni usemi unaoeleweka na unaodumisha picha ya kutokuwa na moyo au mwelekeo mmoja.
- source_word: ἀκατάστατος
  choice: asiye na msimamo
  rationale: Katika muktadha huu neno linaonyesha kutotulia, kutokuwa thabiti, na kutegemeka kidogo. “Asiye na msimamo” linaeleza hali hiyo kwa Kiswahili cha kawaida bila kuongeza wazo la fujo za kijamii.
- source_word: ἐν πάσαις ταῖς ὁδοῖς αὐτοῦ
  choice: katika njia zake zote
  rationale: “Njia” inadumisha sitiari ya Kigiriki na hapa inahusu mwenendo na mfumo mzima wa maisha ya mtu.
theological_decisions:
- issue: Lugha ya kiume yenye maana wakilishi
  choice: Kutumia “mtu” katika matini kuu
  alternative: “mwanamume mwenye nia mbili, asiye na msimamo katika njia zake zote”
  rationale: Umbo la Kigiriki ni la kiume katika umoja, lakini katika muktadha linatumika kwa maana ya jumla kuhusu yeyote anayeomba huku akiwa na shaka. Kiswahili “mtu” kinawasilisha maana hiyo wakilishi kwa kawaida; tanbihi inahifadhi taarifa kuhusu umbo la Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Muundo mfupi wa kishazi umehifadhiwa kwa kuwa mstari huu unaendeleza sentensi ya mstari uliotangulia.
