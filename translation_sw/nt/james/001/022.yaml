  source_fidelity: “Lakini iweni watendaji wa neno, wala si wasikiaji tu, mkijidanganya wenyewe” faithfully conveys the present plural imperative Γίνεσθε, the contrast introduced by δέ, ποιηταὶ λόγου, and the participial warning παραλογιζόμενοι ἑαυτούς. “Iweni” appropriately expresses the continuing exhortation without forcing an ingressive sense.
