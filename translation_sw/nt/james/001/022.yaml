  text: Γίνεσθε δὲ ποιηταὶ λόγου καὶ μὴ ⸂ἀκροαταὶ μόνον⸃ παραλογιζόμενοι ἑαυτούς.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/022.yaml
  text: But be doers of the word[a], and not hearers only, deceiving yourselves.
translation:
  language: sw
  text: Lakini iweni watendaji wa neno, wala si wasikiaji tu, mkijidanganya wenyewe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mkijidanganya kwa hoja potovu” au “mkijiongoza wenyewe kwenye kosa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Γίνεσθε
  choice: iweni
  rationale: Kauli ya kuamuru ya wakati uliopo kwa wingi inatoa wito wa kuendelea kuwa na mwenendo huu; “iweni” ni ya asili na inadumisha nguvu ya amri.
- source_word: δὲ
  choice: Lakini
  rationale: 'Inaonyesha tofauti ya kiasi na onyo lililo katika muktadha: kulipokea neno kunapaswa kuongoza katika kulitenda.'
- source_word: ποιηταὶ
  choice: watendaji
  rationale: Inahifadhi tofauti fupi na ya moja kwa moja kati ya wale wanaotenda na wale wanaosikia.
- source_word: λόγου
  choice: wa neno
  rationale: “Neno” linaendeleza uhusiano na neno lililopandikizwa katika Yakobo 1:21 na kuhifadhi uzito wa kibiblia bila kulifafanua kwa namna finyu.
- source_word: ἀκροαταὶ μόνον
  choice: wasikiaji tu
  rationale: Tafsiri ya kawaida na iliyo wazi ambayo inahifadhi nguvu ya μόνον na tofauti yake na “watendaji.”
- source_word: παραλογιζόμενοι
  choice: mkijidanganya
  rationale: Inaeleza matokeo ya mtu kujiongoza kwenye kosa kwa mawazo yasiyo sahihi; maana hiyo ya ziada imeonyeshwa katika tanbihi.
- source_word: ἑαυτούς
  choice: wenyewe
  rationale: Inasisitiza kuwa udanganyifu huo unawalenga wao wenyewe.
theological_decisions:
- issue: Maana ya λόγος katika Yakobo 1:22
  choice: “neno” likimaanisha ujumbe wa Mungu uliopokewa
  alternative: “ujumbe” au “fundisho”
  rationale: Muktadha wa 1:21 unataja “neno lililopandikizwa”; “neno” huhifadhi mwendelezo huo na mwangwi wa kibiblia bila kuingiza dai finyu la kimadhehebu.
- issue: Nguvu ya amri Γίνεσθε
  choice: wito endelevu wa kuwa watu wanaolitenda neno
  alternative: “kuweni” kwa maana ya kuanza kuwa watendaji mara moja
  rationale: Kauli ya kuamuru ya wakati uliopo kwa kawaida inaelekeza kwenye desturi au mwenendo unaoendelea.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Watendaji” na “wasikiaji” vinahifadhi ulinganifu wa kisanaa wa Kigiriki; tanbihi inaweka wazi kidokezo cha kujidanganya kwa kutumia mawazo au hoja potovu.
