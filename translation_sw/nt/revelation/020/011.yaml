id: REV.20.11
reference: Revelation 20:11
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ εἶδον θρόνον μέγαν λευκὸν καὶ τὸν καθήμενον ⸂ἐπ’ αὐτοῦ⸃, οὗ ἀπὸ ⸀τοῦ προσώπου ἔφυγεν ἡ γῆ καὶ ὁ οὐρανός, καὶ τόπος οὐχ εὑρέθη αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/011.yaml
  text: And I saw a great white throne and the one seated on it[a], from whose presence the earth and heaven fled, and no place was found for them.
translation:
  language: sw
  text: Kisha nikaona kiti kikubwa cheupe cha enzi na yeye aliyeketi juu yake. Dunia na mbingu zilikimbia kutoka mbele yake[a], wala mahali hapakupatikana kwa ajili yao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa maana halisi zaidi, “kutoka uso wake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: θρόνον μέγαν λευκὸν
  choice: kiti kikubwa cheupe cha enzi
  rationale: ‘Kiti cha enzi’ ni usemi wa kawaida wa Kiswahili kwa θρόνος; ‘kikubwa cheupe’ huhifadhi sifa zote mbili kwa mpangilio wa asili na unaoeleweka.
- source_word: τὸν καθήμενον ἐπ’ αὐτοῦ
  choice: yeye aliyeketi juu yake
  rationale: Huhifadhi maelezo ya kishirikishi bila kumtambulisha kwa jina yule aliyeketi, na hivyo haiongezi utambulisho ambao mstari wenyewe hautaji.
- source_word: ἀπὸ τοῦ προσώπου
  choice: kutoka mbele za uso wake
  rationale: Huhifadhi taswira halisi ya πρόσωπον, huku ‘mbele za uso wake’ ikiwa njia yenye heshima na inayoeleweka ya kuonyesha kukimbia kutoka mbele ya mtu.
- source_word: ἔφυγεν
  choice: zilikimbia
  rationale: Huwakilisha kwa uwazi kitenzi φεύγω na kudumisha taswira hai ya dunia na mbingu zikikimbia, badala ya kukifasiri kuwa zilitoweka.
- source_word: ἡ γῆ καὶ ὁ οὐρανός
  choice: Dunia na mbingu
  rationale: ‘Mbingu’ ni tafsiri ya kawaida ya οὐρανός katika muktadha wa kiapokaliptiki; Kiswahili hakihitaji vibainishi vinavyolingana na artikeli za Kigiriki.
- source_word: τόπος οὐχ εὑρέθη αὐτοῖς
  choice: wala hapakupatikana mahali kwa ajili yake
  rationale: Huhifadhi muundo wa kutendwa wa Kigiriki. Kiwakilishi cha umoja ‘yake’ kinaweza kurejelea jozi ‘dunia na mbingu’ kama jumla moja ya uumbaji, ingawa rejeleo hilo linaweza pia kusemwa kwa uwazi zaidi.
theological_decisions:
- issue: Utambulisho wa aliyeketi kwenye kiti cha enzi
  choice: Umeachwa bila kutajwa kama ‘yeye aliyeketi juu yake.’
  alternative: Kumtaja kuwa Mungu, Baba, Kristo, au Hakimu wa kimungu.
  rationale: Mstari wenyewe haumtambui kwa jina; tafsiri inadumisha kutotajwa huko na mvutano wa kiteolojia uliopo.
- issue: Namna dunia na mbingu zinavyoondoka
  choice: ‘zilikimbia’
  alternative: ‘zilitoweka’
  rationale: Kigiriki hutumia φεύγω, ambacho kinasisitiza kukimbia kutoka mbele ya aliyeketi; ‘zilitoweka’ kingefasiri zaidi namna au matokeo ya tukio.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. ‘Kiti cha enzi’ ni istilahi ya kawaida ya kibiblia; sentensi inadumisha taswira nzito ya kiapokaliptiki bila kumtambulisha wazi aliyeketi.
