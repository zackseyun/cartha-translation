id: REV.20.8
reference: Revelation 20:8
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἐξελεύσεται πλανῆσαι τὰ ἔθνη τὰ ἐν ταῖς τέσσαρσι γωνίαις τῆς γῆς, τὸν Γὼγ ⸀καὶ Μαγώγ, συναγαγεῖν αὐτοὺς εἰς τὸν πόλεμον, ὧν ὁ ἀριθμὸς ⸀αὐτῶν ὡς ἡ ἄμμος τῆς θαλάσσης.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/008.yaml
  text: and he will go out to deceive the nations at the four corners of the earth—Gog and Magog—and to gather them for war[c][b][a], whose number is like the sand of the sea.
translation:
  language: sw
  text: naye atatoka ili kuyadanganya mataifa yaliyo katika pembe nne za dunia[a]—Gogu na Magogu[b]—na kuwakusanya kwa ajili ya vita[c]. Idadi yao ni kama mchanga wa bahari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuyapotosha.”
    reason: lexical_alternative
  - marker: b
    text: “Gogu na Magogu” yanatoa mwangwi wa Ezekieli 38–39 na huenda yakatumika kama majina ya kimfano kwa mataifa yanayokusanyika katika uasi wa mwisho.
    reason: cross_reference
  - marker: c
    text: Au, “kwa ajili ya pambano.” Neno la Kigiriki linaweza kumaanisha vita au pambano.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελεύσεται
  choice: atatoka
  rationale: Kitenzi hiki cha wakati ujao kinaendeleza taswira ya Shetani kutoka baada ya kufunguliwa katika mstari uliotangulia, bila kuongeza maelezo yasiyosemwa hapa.
- source_word: πλανῆσαι
  choice: ili kuyadanganya
  rationale: πλανάω inaweza kumaanisha kudanganya au kupotosha. “Kuyadanganya” ni Kiswahili cha kawaida na wazi katika muktadha huu, huku maana nyingine ikihifadhiwa katika tanbihi.
- source_word: τὰ ἔθνη
  choice: mataifa
  rationale: Neno hili linarejelea jamii za ulimwengu kwa ujumla; “mataifa” ni tafsiri ya kawaida na haibani maana kuwa watu wasio Wayahudi pekee.
- source_word: τὰ ἐν ταῖς τέσσαρσι γωνίαις τῆς γῆς
  choice: yaliyo katika pembe nne za dunia
  rationale: Hii inahifadhi nahau ya kibiblia inayomaanisha sehemu za mbali kabisa za ulimwengu, bila kuigeuza kuwa maelezo ya kijiografia ya moja kwa moja.
- source_word: τὸν Γὼγ καὶ Μαγώγ
  choice: Gogu na Magogu
  rationale: Majina yametoholewa kwa namna inayotambulika katika Kiswahili na yamewekwa kama utambulisho wa kimfano wa mataifa yaliyotajwa, bila kuamua zaidi maana yake ya kiapokaliptiki.
- source_word: συναγαγεῖν
  choice: na kuwakusanya
  rationale: Kitenzi hiki kinaonyesha kusudi linaloambatana na kudanganywa kwa mataifa. Kiambishi cha watu “-wa-” kinafuata mtazamo wa Kigiriki unaowaona wakaaji wa mataifa hayo kama watu wanaokusanywa.
- source_word: εἰς τὸν πόλεμον
  choice: kwa ajili ya vita
  rationale: πόλεμος inaweza kuwa vita au pambano. “Kwa ajili ya vita” ni ya kawaida, pana, na haiingizi umahususi zaidi ya unaolazimishwa na mstari.
- source_word: ὧν ὁ ἀριθμὸς αὐτῶν
  choice: Idadi yao
  rationale: Muundo huu wa Kiswahili ni wazi na wa asili, huku ukidumisha kwamba idadi inayotajwa ni ya wale waliokusanywa.
- source_word: ὡς ἡ ἄμμος τῆς θαλάσσης
  choice: ni kama mchanga wa bahari
  rationale: Tafsiri hii inahifadhi tashbihi ya kibiblia ya wingi usiohesabika na mwangwi wake katika Maandiko.
theological_decisions:
- issue: Mhusika aliyedokezwa katika “atatoka”
  choice: Kiwakilishi “naye” kinamrejelea Shetani kutoka mstari uliotangulia bila kulitaja jina lake upya.
  alternative: Kumtaja wazi Shetani katika mstari huu.
  rationale: Kigiriki hakina nomino ya mhusika katika mstari huu; muktadha wa Ufunuo 20:7 unaonyesha kuwa ni Shetani. “Naye” huhifadhi mwendelezo huo bila kuongeza nomino kwenye mstari.
- issue: Maana ya “Gogu na Magogu”
  choice: Majina yameachwa kama utambulisho wa mataifa yaliyodanganywa na kama mwangwi wa Ezekieli 38–39.
  alternative: Kuyafafanua kama alama za maadui wote wa mwisho au kama rejeo la moja kwa moja la kikabila na kijiografia.
  rationale: Kigiriki kinayaweka majina haya kwa namna ya ufafanuzi wa mataifa, lakini hakiamui ikiwa matumizi yake ni ya kiishara, ya kimfano, au ya kijiografia. Tafsiri inahifadhi mvutano huo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wazi kwa msomaji wa kawaida, huku taswira ya kiapokaliptiki, mwangwi wa Ezekieli, na uwezekano wa maana katika πλανάω na πόλεμος vikihifadhiwa. Alama za tanbihi zimewekwa moja kwa moja baada ya maneno yanayohusika.
