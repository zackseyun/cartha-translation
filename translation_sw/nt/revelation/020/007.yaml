  yaml_path: translation/nt/revelation/020/007.yaml
  text: And when the thousand years are completed, Satan will be released from his prison,
translation:
  language: sw
  text: Na ile miaka elfu itakapotimia, Shetani ataachiliwa kutoka gerezani mwake.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅταν
  choice: itakapotimia
  rationale: Kiunganishi cha wakati ὅταν pamoja na kitenzi cha hali tegemezi kinaeleza wakati ujao unaotarajiwa; muundo wa Kiswahili “itakapotimia” unawasilisha maana ya “wakati ... itakapotimia” kwa kawaida.
- source_word: τελεσθῇ
  choice: itakapotimia
  rationale: Kitenzi hiki cha kutendwa kinaonyesha kufikia ukamilifu kwa kipindi kilichowekwa. Katika Kiswahili, “miaka ... itakapotimia” ni usemi wa asili unaohifadhi wazo la kipindi kukamilika bila kulifanya ufafanuzi wa ziada.
- source_word: τὰ χίλια ἔτη
  choice: ile miaka elfu
  rationale: Kielezi “ile” kinaonyesha kipindi maalumu kilichotajwa awali, kama kifungu chenye kibainishi katika Kigiriki; “miaka elfu” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: λυθήσεται
  choice: ataachiliwa
  rationale: Huhifadhi wakati ujao na hali ya kutendwa, huku ikieleza kufunguliwa kutoka kifungoni bila maana chanya inayoweza kudokezwa na “kuwekwa huru.”
- source_word: Σατανᾶς
  choice: Shetani
  rationale: Hili ndilo umbo la kawaida la jina au cheo hiki katika Kiswahili cha Biblia na matumizi mapana ya Kiswahili.
- source_word: ἐκ τῆς φυλακῆς αὐτοῦ
  choice: kutoka gerezani mwake
  rationale: Katika muktadha huu φυλακή ni mahali pa kifungo. “Kutoka gerezani mwake” ni Kiswahili cha kawaida kinachohifadhi ἐκ na kiwakilishi cha umilikaji αὐτοῦ.
theological_decisions:
- issue: Asili ya ile miaka elfu
  choice: Kifungu kimetafsiriwa moja kwa moja kuwa “ile miaka elfu,” bila kuamua kama kipindi hicho ni halisi au cha kiishara.
  alternative: Kukifafanua kuwa utawala halisi wa miaka elfu au kipindi kirefu cha kiishara.
  rationale: Aya yenyewe hutaja kipindi maalumu lakini haisuluhishi mitazamo mbalimbali kuhusu milenia; tafsiri inadumisha utata huo wa kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo ni mfupi na wa asili, huku ukihifadhi mfuatano wa wakati na hali ya kutendwa ya maandishi ya Kigiriki.
