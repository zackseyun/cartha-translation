id: REV.20.5
reference: Revelation 20:5
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ⸀οἱ λοιποὶ τῶν νεκρῶν οὐκ ἔζησαν ἄχρι τελεσθῇ τὰ χίλια ἔτη. αὕτη ἡ ἀνάστασις ἡ πρώτη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/005.yaml
  text: The rest of the dead did not come to life until the thousand years were finished[a]. This is the first resurrection.
translation:
  language: sw
  text: Wafu wengine hawakurudi kuwa hai hadi ile miaka elfu ilipokwisha[a]. Huu ndio ufufuo wa kwanza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hawakuishi hadi ile miaka elfu ilipokwisha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ λοιποὶ τῶν νεκρῶν
  choice: Wafu wengine
  rationale: Muundo huu ni wa kawaida katika Kiswahili na unaonyesha kundi lililobaki tofauti na wale waliotajwa katika mstari uliotangulia.
- source_word: οὐκ ἔζησαν
  choice: hawakurudi kuwa hai
  rationale: Katika muktadha wa ufufuo, aoristi ya ζάω ina maana ya kuingia tena katika hali ya kuwa hai. Tafsiri hii ni wazi kwa msomaji wa kawaida bila kuongeza maelezo ya kimadhehebu.
- source_word: ἄχρι τελεσθῇ
  choice: hadi ... ilipokwisha
  rationale: Hii inaonyesha kikomo cha muda na kukamilika kwa kipindi husika kwa Kiswahili cha kawaida na cha asili.
- source_word: τὰ χίλια ἔτη
  choice: ile miaka elfu
  rationale: Kionyeshi “ile” kinabainisha kipindi maalumu cha miaka elfu ambacho tayari kinazungumziwa katika muktadha.
- source_word: αὕτη ἡ ἀνάστασις ἡ πρώτη
  choice: Huu ndio ufufuo wa kwanza
  rationale: “Ufufuo” ni istilahi ya kawaida kwa ἀνάστασις, na sentensi hii inahifadhi moja kwa moja msisitizo wa “kwanza.”
theological_decisions:
- issue: Kirejeo cha “Huu ndio ufufuo wa kwanza”
  choice: Kionyeshi “Huu” kinaachwa kirejelee jambo lililoelezwa katika muktadha bila kulifafanua zaidi.
  alternative: Kukibana kirejelee mashahidi wa mstari wa 4 pekee, kukipanua kwa wafu wote wenye haki, au kuufasiri ufufuo huo kuwa wa kiroho.
  rationale: Kigiriki hakifafanui mfumo maalumu wa miaka elfu; tafsiri inapaswa kuhifadhi mvutano huo wa kiteolojia.
- issue: Maana ya ἔζησαν katika muktadha
  choice: “hawakurudi kuwa hai”
  alternative: “hawakuishi” au maelezo ya kwamba walipata uzima wa kiroho
  rationale: Muktadha wa karibu unazungumzia kifo na ufufuo. Hata hivyo, tafsiri haiongezi maelezo yanayozidi kauli ya mstari wenyewe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima, na inayoeleweka kwa wasomaji wa kawaida. “Kurudi kuwa hai” ni usemi wa asili zaidi kuliko tafsiri ya neno kwa neno, huku tanbihi ikihifadhi uwezekano wa maana ya moja kwa moja “kuishi.”
