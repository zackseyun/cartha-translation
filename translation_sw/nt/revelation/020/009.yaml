reference: Revelation 20:9
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἀνέβησαν ἐπὶ τὸ πλάτος τῆς γῆς, καὶ ⸀ἐκύκλευσαν τὴν παρεμβολὴν τῶν ἁγίων καὶ τὴν πόλιν τὴν ἠγαπημένην. καὶ κατέβη πῦρ ⸂ἐκ τοῦ οὐρανοῦ⸃ καὶ κατέφαγεν αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/009.yaml
  text: And they came up over the breadth of the earth and surrounded the camp of the saints and the beloved city[c][b][a]. And fire came down from heaven and consumed them.
translation:
  language: sw
  text: Nao wakapanda juu ya upana wa dunia, wakazingira kambi ya watakatifu na mji unaopendwa[a]. Moto ukashuka kutoka mbinguni na kuwateketeza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Matini haitaji waziwazi mji unaopendwa ni mji gani; watafsiri wengi huuelewa kuwa Yerusalemu au, kwa maana pana zaidi, mji wa Mungu.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνέβησαν
  choice: wakapanda
  rationale: Kitenzi hiki kwa kawaida humaanisha kwenda au kupanda juu; “wakapanda” huhifadhi mwendo wa kuelekea juu bila kufafanua jiografia zaidi ya maandishi.
- source_word: ἐπὶ τὸ πλάτος τῆς γῆς
  choice: juu ya eneo lote pana la dunia
  rationale: Neno πλάτος humaanisha upana au eneo pana. Kauli hii ni ya asili katika Kiswahili, huhifadhi taswira ya eneo kubwa, na haiongezi wazo la uwanda ambalo halipo wazi katika Kigiriki.
- source_word: ἐκύκλευσαν
  choice: wakaizunguka
  rationale: Hutoa kwa uwazi maana ya kuzunguka pande zote; kiambishi cha kitu kinaelekea kwa kishazi chote kinachofuata, yaani kambi na mji.
- source_word: παρεμβολὴν
  choice: kambi
  rationale: Neno hili humaanisha kambi au mahali pa kupiga kambi, mara nyingi katika mazingira ya kijeshi; “kambi” ni fupi na haliongezi maelezo yasiyotajwa.
- source_word: τῶν ἁγίων
  choice: ya watakatifu
  rationale: “Watakatifu” ni tafsiri iliyozoeleka ya ἅγιοι na hudumisha mwendelezo wa istilahi katika Agano Jipya bila kufafanua zaidi.
- source_word: τὴν πόλιν τὴν ἠγαπημένην
  choice: mji unaopendwa
  rationale: Huhifadhi hali ya kutendwa ya ἠγαπημένην bila kumtaja moja kwa moja anayependa, ambaye maandishi hayamtaji katika kishazi hiki.
- source_word: κατέβη πῦρ ἐκ τοῦ οὐρανοῦ
  choice: moto ukashuka kutoka mbinguni
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida inayohifadhi taswira ya moto kushuka kutoka mbinguni.
- source_word: κατέφαγεν αὐτούς
  choice: kuwateketeza
  rationale: Κατεσθίω kihalisi ni kula kabisa na kwa moto humaanisha kuteketeza; uchaguzi huu ni wa kawaida katika Kiswahili na unaonyesha maangamizi kamili.
theological_decisions:
- issue: Utambulisho na uzito wa kitheolojia wa “mji unaopendwa”
  choice: Kutafsiri kwa ujumla kama “mji unaopendwa” bila kuutambulisha katika matini kuu.
  alternative: Yerusalemu; au mji/watu wa Mungu wa wakati wa mwisho.
  rationale: Kigiriki hakiutaji mji huo kwa jina katika aya hii. Kutaja Yerusalemu au kufafanua mji huo kuwa watu wa Mungu kungeamua jambo ambalo matini yenyewe inaliacha wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo umehifadhi mfululizo wa simulizi na taswira za Kigiriki huku ukiepuka usemi mgumu wa kihalisi na tafsiri ya kimadhehebu.
