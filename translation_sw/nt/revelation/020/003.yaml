  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἔβαλεν αὐτὸν εἰς τὴν ἄβυσσον, καὶ ἔκλεισεν καὶ ἐσφράγισεν ἐπάνω αὐτοῦ, ἵνα μὴ ⸀πλανήσῃ ἔτι τὰ ἔθνη, ἄχρι τελεσθῇ τὰ χίλια ἔτη· ⸀μετὰ ταῦτα δεῖ ⸂λυθῆναι αὐτὸν⸃ μικρὸν χρόνον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/003.yaml
  text: And he threw him into the abyss[a], and shut it and sealed it over him, so that he might no longer deceive the nations until the thousand years were finished[c][b]. After these things he must be released for a short time.
translation:
  language: sw
  text: Akamwtupa ndani ya kilindi[a], akalifunga na kulitia muhuri juu yake, ili asiyadanganye tena mataifa[b] mpaka ile miaka elfu moja itimie. Baada ya hayo, ni lazima afunguliwe kwa muda mfupi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “shimo lisilo na mwisho.”
    reason: lexical_alternative
  - marker: b
    text: Au “asiwapotoshe tena mataifa.”
    reason: lexical_alternative
  - marker: c
    text: Au “aachiliwe kwa kitambo kidogo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔβαλεν
  choice: akamtupa
  rationale: Kitenzi “kutupa” kinahifadhi nguvu ya tendo la βάλλω na ni Kiswahili cha kawaida cha sasa.
- source_word: ἄβυσσον
  choice: shimo lisilo na mwisho
  rationale: Katika Ufunuo neno hili ni jina la mahali pa kiapokaliptiki; usemi huu unaeleweka kwa urahisi na hauongezi maelezo ya kimafundisho.
- source_word: ἔκλεισεν
  choice: akalifunga
  rationale: “Kufunga” huwakilisha κλείω bila kuongeza wazo lisilotajwa la kutumia kufuli.
- source_word: ἐσφράγισεν ἐπάνω αὐτοῦ
  choice: kulitia muhuri juu yake
  rationale: Huhifadhi tendo la kutia muhuri na uhusiano wa mahali unaoonyeshwa na ἐπάνω αὐτοῦ; kiwakilishi cha shimo kimewekwa wazi kwa sarufi ya Kiswahili.
- source_word: ἵνα μὴ πλανήσῃ ἔτι τὰ ἔθνη
  choice: ili asipate tena kuyapotosha mataifa
  rationale: “Kupotosha” hujumuisha maana ya kudanganya au kuongoza katika njia isiyo sawa, huku “tena” ikihifadhi ἔτι.
- source_word: ἄχρι τελεσθῇ τὰ χίλια ἔτη
  choice: mpaka ile miaka elfu moja itimie
  rationale: “Itimie” huonyesha kufikia ukomo wa kipindi bila kuamua kama miaka hiyo ni halisi au ya mfano.
- source_word: μετὰ ταῦτα
  choice: Baada ya hayo
  rationale: Ni mpito wa wakati ulio wazi, wa heshima, na unaolingana kwa karibu na Kigiriki.
- source_word: δεῖ
  choice: ni lazima
  rationale: Huhifadhi wazo la ulazima bila kueleza chanzo au utaratibu wake.
- source_word: λυθῆναι αὐτὸν
  choice: afunguliwe
  rationale: Katika muktadha wa kufungwa, “afunguliwe” ni mwafaka kwa hali ya kutendwa ya λύω na huonyesha kuondolewa kwa kifungo.
- source_word: μικρὸν χρόνον
  choice: kwa muda mfupi
  rationale: Ni usemi wa kawaida unaohifadhi maana ya kipindi kifupi.
theological_decisions:
- issue: Asili ya “miaka elfu moja”
  choice: Kutafsiri moja kwa moja kama “ile miaka elfu moja” bila maelezo ya ufafanuzi.
  alternative: Kuitaja wazi kuwa milenia halisi au kipindi kirefu cha mfano.
  rationale: Kigiriki hakisuluhishi mjadala huo katika mstari huu; tafsiri inaacha mvutano wa kiufafanuzi wazi.
- issue: Nguvu ya δεῖ katika muktadha wa kiapokaliptiki
  choice: “ni lazima”
  alternative: Kufafanua kuwa ni amri ya Mungu au tukio lisiloepukika katika simulizi.
  rationale: Neno linaonyesha ulazima, lakini mstari hauelezi wazi msingi wa ulazima huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kifasihi. Mfuatano wa vitenzi umehifadhiwa kwa mtindo wa simulizi, na lugha imeepuka istilahi za dhehebu au ufafanuzi unaosuluhisha mjadala wa milenia.
