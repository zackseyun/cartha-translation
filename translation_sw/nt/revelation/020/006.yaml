id: REV.20.6
reference: Revelation 20:6
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: μακάριος καὶ ἅγιος ὁ ἔχων μέρος ἐν τῇ ἀναστάσει τῇ πρώτῃ· ἐπὶ τούτων ὁ δεύτερος θάνατος οὐκ ἔχει ἐξουσίαν, ἀλλ’ ἔσονται ἱερεῖς τοῦ θεοῦ καὶ τοῦ χριστοῦ, καὶ βασιλεύσουσιν μετ’ αὐτοῦ ⸀χίλια ἔτη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/006.yaml
  text: Blessed and holy is the one who has a share in the first resurrection. Over these the second death has no authority[a], but they will be priests of God and of Messiah, and they will reign with him for a thousand years.
translation:
  language: sw
  text: Heri na mtakatifu ni yule aliye na sehemu katika ufufuo wa kwanza. Mauti ya pili haina mamlaka juu yao, bali watakuwa makuhani wa Mungu na wa Masihi, nao watatawala pamoja naye kwa miaka elfu moja.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μακάριος
  choice: Heri
  rationale: Neno la kawaida la Kiswahili katika kauli za baraka; linaonyesha hali ya kupata kibali na baraka, si hisia ya furaha tu.
- source_word: ἅγιος
  choice: mtakatifu
  rationale: Linadumisha maana ya kuwekwa wakfu kwa Mungu pamoja na uzito wake wa kimaadili na kidini.
- source_word: ὁ ἔχων μέρος
  choice: yule aliye na sehemu
  rationale: Muundo huu ni wa asili katika Kiswahili na unahifadhi umoja wa kishiriki cha Kigiriki pamoja na wazo la kushiriki katika ufufuo.
- source_word: ἐν τῇ ἀναστάσει τῇ πρώτῃ
  choice: katika ufufuo wa kwanza
  rationale: Tafsiri ya moja kwa moja na inayoeleweka ya kishazi hiki bila kufafanua aina ya ufufuo zaidi ya yanayosemwa na aya.
- source_word: ἐπὶ τούτων
  choice: Juu ya hao
  rationale: Inaeleza mamlaka juu ya watu wanaotajwa, huku ikidumisha ufupi na msisitizo wa Kigiriki.
- source_word: ὁ δεύτερος θάνατος
  choice: mauti ya pili
  rationale: Ni istilahi ya kiapokaliptiki iliyozoeleka katika Kiswahili cha Biblia na inadumisha uhusiano wa kifasihi na kifungu kizima.
- source_word: οὐκ ἔχει ἐξουσίαν
  choice: haina mamlaka
  rationale: ἐξουσία hapa ni mamlaka au uwezo wa kutawala, si nguvu ghafi pekee.
- source_word: ἱερεῖς
  choice: makuhani
  rationale: Neno hili linataja moja kwa moja watu wenye huduma ya ukuhani na kuhifadhi taswira ya kifalme na kikuhani.
- source_word: τοῦ θεοῦ καὶ τοῦ χριστοῦ
  choice: wa Mungu na wa Masihi
  rationale: Masihi inadumisha matumizi ya Χριστός kama cheo cha Mpakwa Mafuta katika muundo huu rasmi.
- source_word: βασιλεύσουσιν
  choice: watatawala
  rationale: Ni Kiswahili cha kawaida na chenye hadhi kwa tendo la kutawala kifalme; hakiongezi maelezo yasiyokuwamo katika kitenzi.
- source_word: μετ’ αὐτοῦ
  choice: pamoja naye
  rationale: Inaonyesha ushirika wao naye katika kutawala; kiwakilishi kinamrejelea Masihi katika muktadha.
- source_word: χίλια ἔτη
  choice: kwa miaka elfu moja
  rationale: Kihusishi kwa kinaonyesha muda wa kutawala bila kuamua mjadala mpana kuhusu namna ya kuielewa milenia.
theological_decisions:
- issue: Tafsiri ya Χριστός
  choice: Masihi
  alternative: Kristo
  rationale: Katika kifungu hiki Χριστός inafanya kazi wazi kama cheo katika usemi “wa Mungu na wa Masihi.” “Masihi” huhifadhi maana hiyo ya cheo bila kukifanya jina tu.
- issue: Muda wa miaka elfu moja
  choice: kwa miaka elfu moja
  alternative: miaka elfu moja
  rationale: Tafsiri inadumisha taarifa ya muda iliyo wazi katika aya, bila kuamua ikiwa miaka hiyo inapaswa kufasiriwa kihalisi, kiishara, au kwa mfumo fulani wa kieskatolojia.
- issue: Uhusiano wa mauti ya pili na washiriki wa ufufuo wa kwanza
  choice: Juu ya hao, mauti ya pili haina mamlaka
  alternative: Mauti ya pili haina nguvu juu yao
  rationale: “Mamlaka” huhifadhi wazo la ἐξουσία kama mamlaka au utawala halali, bila kudokeza tu ukosefu wa nguvu za kutenda.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kibiblia lakini kinachoeleweka kwa msomaji wa kawaida. “Heri,” “mauti,” “makuhani,” na “Masihi” hudumisha uzito wa kifungu; sentensi haiongezi ufafanuzi wa kimadhehebu kuhusu ufufuo wa kwanza au miaka elfu moja.
