id: REV.20.4
reference: Revelation 20:4
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ εἶδον θρόνους, καὶ ἐκάθισαν ἐπ’ αὐτούς, καὶ κρίμα ἐδόθη αὐτοῖς, καὶ τὰς ψυχὰς τῶν πεπελεκισμένων διὰ τὴν μαρτυρίαν Ἰησοῦ καὶ διὰ τὸν λόγον τοῦ θεοῦ, καὶ οἵτινες οὐ προσεκύνησαν τὸ θηρίον οὐδὲ τὴν εἰκόνα αὐτοῦ καὶ οὐκ ἔλαβον τὸ χάραγμα ἐπὶ τὸ μέτωπον καὶ ἐπὶ τὴν χεῖρα αὐτῶν· καὶ ἔζησαν καὶ ἐβασίλευσαν μετὰ τοῦ χριστοῦ ⸀χίλια ἔτη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/004.yaml
  text: And I saw thrones[a], and they sat on them, and judgment was given to them, and the souls of those who had been beheaded because of the testimony of Jesus and because of the word of God, and those who had not worshiped the beast or its image and had not received the mark on their forehead and on their hand[b]; and they came to life and reigned with the Messiah for a thousand years.
translation:
  language: sw
  text: Nikaona viti vya enzi, nao wakaketi juu ya viti hivyo, wakapewa hukumu. Pia nikaona roho za wale waliokuwa wamekatwa vichwa kwa sababu ya ushuhuda wa Yesu[a] na kwa sababu ya neno la Mungu, na wale ambao hawakuwa wamemwabudu yule mnyama wala sanamu yake, wala hawakuwa wameipokea ile alama kwenye vipaji vya nyuso zao wala mikononi mwao. Wakawa hai, wakatawala pamoja na Masihi[b] kwa miaka elfu moja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa sababu ya ushuhuda wao kumhusu Yesu.” Kirai cha Kiyunani “ushuhuda wa Yesu” kinaweza kumaanisha ushuhuda uliotolewa na Yesu au ushuhuda unaomhusu Yesu.
    reason: alternative_reading
  - marker: b
    text: Au, “Kristo.” Cheo cha Kiyunani Χριστός kimetafsiriwa hapa kuwa “Masihi” kwa sababu kinatumika kama cheo.
    reason: lexical_alternative
lexical_decisions:
- source_word: θρόνους
  choice: viti vya enzi
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya viti vya kifalme katika lugha ya maono.
- source_word: ἐκάθισαν ἐπ’ αὐτούς
  choice: nao wakaketi juu yake
  rationale: Kitenzi tendaji cha wingi kinahifadhi kutotajwa wazi kwa walioketi, bila kuwatambulisha kwa tafsiri.
- source_word: κρίμα ἐδόθη αὐτοῖς
  choice: wakapewa hukumu
  rationale: Inahifadhi neno pana 'hukumu' bila kulifafanua kimakusudi kuwa mamlaka ya kuhukumu, haki ya kuhukumu, au uamuzi wa mahakama.
- source_word: ψυχὰς
  choice: roho
  rationale: Inadumisha taswira ya kinabii ya mwonaji kuwaona roho za waliouawa badala ya kuisawazisha kuwa watu au maisha.
- source_word: πεπελεκισμένων
  choice: waliokuwa wamekatwa vichwa
  rationale: Inaeleza kwa usahihi kuuawa kwa kukatwa kichwa, bila kuongeza maelezo yasiyo ya lazima kuhusu chombo kilichotumiwa.
- source_word: διὰ τὴν μαρτυρίαν Ἰησοῦ
  choice: kwa sababu ya ushuhuda wa Yesu
  rationale: ‘Kwa sababu ya’ huonyesha sababu, huku ‘ushuhuda wa Yesu’ ukihifadhi uwezekano wa ushuhuda uliotolewa na Yesu au ushuhuda unaomhusu Yesu.
- source_word: διὰ τὸν λόγον τοῦ θεοῦ
  choice: kwa sababu ya neno la Mungu
  rationale: Ni tafsiri ya kawaida inayohifadhi maana ya kisababishi ya διά pamoja na kishtaki.
- source_word: προσεκύνησαν
  choice: hawakuwa wamemwabudu
  rationale: Inaonyesha tendo la kidini la kuabudu na kwamba kukataa huko kulitangulia kuwa kwao hai katika mfuatano wa maono.
- source_word: θηρίον
  choice: mnyama
  rationale: Ni neno la moja kwa moja na lililozoeleka kwa mhusika huyu katika lugha ya kinabii ya Ufunuo.
- source_word: εἰκόνα
  choice: sanamu
  rationale: Katika muktadha wa kitu kinachoabudiwa, ‘sanamu’ ni Kiswahili cha kawaida na wazi; hakimaanishi picha ya kawaida tu.
- source_word: χάραγμα
  choice: alama
  rationale: Ni tafsiri wazi na ya kawaida katika muktadha wa Ufunuo, bila kubainisha isivyohitajika kama chapa au kovu.
- source_word: ἔζησαν
  choice: wakawa hai
  rationale: Inaonyesha badiliko la kuingia katika hali ya uhai bila kuongeza maelezo ya kimafundisho kuhusu namna ya ufufuo.
- source_word: χριστοῦ
  choice: Masihi
  rationale: Χριστός inatumika hapa kama cheo, hivyo ‘Masihi’ hudhihirisha maana yake badala ya kuitumia kama jina tu.
theological_decisions:
- issue: Walioketi kwenye viti vya enzi na waliopewa hukumu ni akina nani
  choice: 'Wameachwa bila kutambuliwa kwa jina: ‘nao wakaketi ... wakapewa hukumu.’'
  alternative: Kuwatambulisha kuwa wafia imani, watakatifu wote, mitume, au viumbe wa baraza la mbinguni.
  rationale: Kiyunani kina kiima kilichodokezwa tu; kukitaja wazi kungeingiza uamuzi wa kifasiri usiosemwa katika mstari.
- issue: Maana ya διὰ τὴν μαρτυρίαν Ἰησοῦ
  choice: ‘kwa sababu ya ushuhuda wa Yesu’ katika matini kuu
  alternative: ‘kwa sababu ya ushuhuda wao kumhusu Yesu’
  rationale: Muundo wa umilikishi unaweza kumaanisha ushuhuda unaotolewa na Yesu au ushuhuda unaomhusu Yesu; matini kuu na tanbihi zinahifadhi uwezekano huo.
- issue: Uhusiano wa ‘roho za waliokatwa vichwa’ na ‘wale ambao hawakuwa wamemwabudu mnyama’
  choice: Makundi yameunganishwa kwa ‘na wale ambao’ bila kutamka wazi ikiwa ni kundi moja au makundi yanayopatana.
  alternative: Kuyafanya kwa dhahiri kuwa kundi moja la wafia imani au makundi mawili tofauti.
  rationale: Muundo wa Kiyunani unaweza kujadiliwa; tafsiri haipaswi kuamua uhusiano huo zaidi ya maneno yenyewe.
- issue: Maana ya ἔζησαν
  choice: ‘wakawa hai’
  alternative: ‘wakaishi’ au ‘wakafufuka’
  rationale: ‘Wakawa hai’ huhifadhi nguvu ya tukio katika muktadha bila kutaja kwa upana zaidi aina au hatua ya ufufuo.
- issue: Tafsiri ya Χριστός
  choice: Masihi
  alternative: Kristo
  rationale: Neno hilo linafanya kazi kama cheo hapa; ‘Masihi’ huwasilisha maana ya cheo huku tanbihi ikitaja istilahi nyingine iliyozoeleka.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya lugha ya maono lakini kinachoeleweka kwa wasomaji wa kawaida. Sentensi zimepangwa kwa mtiririko wa asili bila kutaja utambulisho ambao Kiyunani kimeuacha wazi. Alama za tanbihi zimewekwa moja kwa moja baada ya vifungu vinavyohusika.
