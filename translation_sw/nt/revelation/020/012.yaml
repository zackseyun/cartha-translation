id: REV.20.12
reference: Revelation 20:12
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ εἶδον τοὺς νεκρούς, τοὺς μεγάλους καὶ τοὺς μικρούς, ἑστῶτας ἐνώπιον τοῦ θρόνου, καὶ βιβλία ἠνοίχθησαν· καὶ ἄλλο βιβλίον ἠνοίχθη, ὅ ἐστιν τῆς ζωῆς· καὶ ἐκρίθησαν οἱ νεκροὶ ἐκ τῶν γεγραμμένων ἐν τοῖς βιβλίοις κατὰ τὰ ἔργα αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/012.yaml
  text: And I saw the dead[a], the great and the small, standing before the throne, and books were opened. And another book was opened, which is the book of life. And the dead were judged from what had been written in the books[b], according to their works.
translation:
  language: sw
  text: Nami nikawaona wafu, wakubwa kwa wadogo, wamesimama mbele ya kiti cha enzi, na vitabu[a] vikafunguliwa. Kitabu kingine kikafunguliwa, yaani, kitabu cha uzima. Wafu wakahukumiwa kutokana na mambo yaliyoandikwa katika vitabu hivyo, kulingana na matendo yao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Vitabu” vinaweza pia kutafsiriwa “magombo,” yakirejelea hati zilizokunjwa zilizotumiwa nyakati za kale.
    reason: cultural_note
lexical_decisions:
- source_word: νεκρούς / νεκροὶ
  choice: wafu
  rationale: Nomino-kivumishi hii inawataja kwa pamoja watu waliokufa; “wafu” ni fupi, ya kawaida, na yenye uzito unaofaa.
- source_word: μεγάλους καὶ τοὺς μικρούς
  choice: wakubwa kwa wadogo
  rationale: Ni usemi unaojumuisha watu wa kila cheo au hadhi. “Wakubwa kwa wadogo” ni usemi wa asili wa Kiswahili unaohifadhi maana hiyo.
- source_word: ἑστῶτας
  choice: wamesimama
  rationale: Kauli timilifu ya Kigiriki inaonyesha hali iliyopo baada ya kusimama; “wamesimama” inawasilisha hali yao mbele ya kiti cha enzi.
- source_word: ἐνώπιον τοῦ θρόνου
  choice: mbele ya kiti cha enzi
  rationale: Tafsiri hii ni ya moja kwa moja na haiongezi wazo la “kiti cha hukumu,” ambalo halijasemwa wazi katika θρόνος.
- source_word: βιβλία
  choice: vitabu
  rationale: “Vitabu” ni tafsiri pana na inayoeleweka; tanbihi inaonyesha kwamba katika mazingira ya kale huenda vilikuwa hati za kukunjwa.
- source_word: ἠνοίχθησαν / ἠνοίχθη
  choice: vikafunguliwa / kikafunguliwa
  rationale: Vitenzi vya kutendwa vinahifadhi maana ya moja kwa moja ya ἀνοίγω bila kuongeza wazo maalumu la kuondoa muhuri.
- source_word: ἄλλο βιβλίον
  choice: kitabu kingine
  rationale: Inaonyesha kitabu cha ziada kilicho tofauti na vitabu vilivyotajwa kwanza.
- source_word: ὅ ἐστιν τῆς ζωῆς
  choice: yaani, kitabu cha uzima
  rationale: Kigiriki kinaacha neno βιβλίον lieleweke katika kishazi hiki; kulirudia kwa Kiswahili kunaleta uwazi na kuhifadhi istilahi “kitabu cha uzima.”
- source_word: ἐκρίθησαν
  choice: wakahukumiwa
  rationale: Kitenzi kina maana ya kutoa hukumu katika muktadha wa kimahakama. “Wakahukumiwa” hakisemi mapema kama hukumu hiyo ilikuwa ya kuachiliwa au ya kuadhibiwa.
- source_word: ἐκ τῶν γεγραμμένων ἐν τοῖς βιβλίοις
  choice: kutokana na mambo yaliyoandikwa katika vitabu hivyo
  rationale: “Kutokana na” linaonyesha msingi wa hukumu, na “yaliyoandikwa” linahifadhi wazo la kumbukumbu iliyokwisha kuandikwa.
- source_word: κατὰ τὰ ἔργα αὐτῶν
  choice: kulingana na matendo yao
  rationale: Katika Kiswahili cha sasa, “matendo” huwasilisha kwa asili maana ya ἔργα kama yale ambayo watu wamefanya, bila kuyawekea maelezo ya kiteolojia yasiyomo katika mstari.
theological_decisions:
- issue: Hukumu kulingana na matendo
  choice: kulingana na matendo yao
  alternative: kulingana na yale waliyoyafanya
  rationale: Mstari unasema wazi kwamba hukumu inalingana na matendo yao. Tafsiri inadumisha kauli hiyo bila kuipunguza au kuisuluhisha kwa kuingiza mfumo mpana wa mafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa masimulizi “nikawaona … vikafunguliwa … wakahukumiwa” unafaa mtiririko wa maono. Tanbihi isiyolingana katika safu ya Kiingereza baada ya “the dead” haikuhamishwa, kwa kuwa haielezi neno νεκρούς; tanbihi ya chombo cha maandishi imewekwa moja kwa moja baada ya “vitabu.”
