  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ εἶδον ἄγγελον καταβαίνοντα ἐκ τοῦ οὐρανοῦ, ἔχοντα τὴν κλεῖν τῆς ἀβύσσου καὶ ἅλυσιν μεγάλην ἐπὶ τὴν χεῖρα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/001.yaml
  text: And I saw an angel coming down from heaven[a], holding the key to the abyss and a great chain in his hand.
translation:
  language: sw
  text: Nikamwona malaika akishuka kutoka mbinguni, akiwa na ufunguo wa lindi[a] na mnyororo mkubwa mkononi mwake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuzimu.” Neno la Kigiriki ni abyssos, yaani “lindi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Kisha
  rationale: Katika mfululizo wa maono, kiunganishi hiki kinaendeleza simulizi. “Kisha” ni cha kawaida katika Kiswahili na hakiongezi uhusiano wa kisababu.
- source_word: εἶδον
  choice: nikamwona
  rationale: Kitenzi hiki cha nafsi ya kwanza katika simulizi la maono kinatafsiriwa kwa namna ya moja kwa moja na ya asili.
- source_word: ἄγγελον
  choice: malaika
  rationale: Muktadha unaonyesha kiumbe wa mbinguni, hivyo “malaika” linafaa kuliko neno la jumla “mjumbe.”
- source_word: καταβαίνοντα ἐκ τοῦ οὐρανοῦ
  choice: akishuka kutoka mbinguni
  rationale: Huhifadhi tendo linaloendelea la kushuka na mahali anapotoka kwa Kiswahili cha kawaida.
- source_word: ἔχοντα
  choice: akiwa na
  rationale: Hueleza kwamba malaika alikuwa amebeba au kumiliki vitu vilivyotajwa bila kulazimisha kwamba vyote vilishikwa kwa namna ileile.
- source_word: τὴν κλεῖν τῆς ἀβύσσου
  choice: ufunguo wa kuzimu
  rationale: “Ufunguo wa” ni uhusiano wa kawaida wa Kiswahili. “Kuzimu” hapa hutaja eneo la kina lisilo na mipaka linalofungwa, si lazima makao ya mwisho ya adhabu; tanbihi inahifadhi maana halisi ya neno la Kigiriki.
- source_word: ἅλυσιν μεγάλην
  choice: mnyororo mkubwa
  rationale: Ni tafsiri ya moja kwa moja na ya asili inayohifadhi ukubwa au uzito wa taswira.
- source_word: ἐπὶ τὴν χεῖρα αὐτοῦ
  choice: mkononi mwake
  rationale: Hii ndiyo namna ya kawaida ya Kiswahili ya kueleza kitu kilichobebwa au kushikwa mkononi.
theological_decisions:
- issue: Maana ya ἄβυσσος katika muktadha wa kiapokaliptiki
  choice: kuzimu
  alternative: lindi lisilo na mwisho
  rationale: “Kuzimu” ni neno linaloeleweka kwa wasomaji wengi kwa eneo la kina la ulimwengu wa chini, lakini linaweza kuchanganywa na mahali pa mwisho pa adhabu. Kwa hiyo tanbihi inaeleza kwa uwazi zaidi neno la Kigiriki na kuhifadhi taswira yake bila kuamua zaidi ya matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa simulizi la kiapokaliptiki. Muundo wa sentensi unahifadhi mfululizo wa maono na vishazi vya Kigiriki bila kuwa mgumu.
