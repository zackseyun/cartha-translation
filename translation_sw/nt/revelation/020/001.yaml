- from: Kisha nikamwona malaika akishuka kutoka mbinguni, akiwa na ufunguo wa kuzimu[a] na mnyororo mkubwa mkononi mwake.
  to: Nikamwona malaika akishuka kutoka mbinguni, akiwa na ufunguo wa lindi[a] na mnyororo mkubwa mkononi mwake.
