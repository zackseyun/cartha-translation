  text: καὶ εἴ τις οὐχ εὑρέθη ἐν ⸂τῇ βίβλῳ⸃ τῆς ζωῆς γεγραμμένος, ἐβλήθη εἰς τὴν λίμνην τοῦ πυρός.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/015.yaml
  text: And if anyone was not found written in the book of life[b][a], he was thrown into the lake of fire.
translation:
  language: sw
  text: Na ikiwa mtu yeyote hakupatikana kuwa ameandikwa katika kitabu cha uzima[a], alitupwa katika ziwa la moto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hati-kunjo ya uzima.” Neno la Kigiriki linaweza kumaanisha kitabu au hati-kunjo.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ τις
  choice: mtu yeyote ambaye
  rationale: Kauli hii inaonyesha sharti linalomhusu mtu yeyote bila kumtaja mtu fulani; muundo huu ni wa kawaida na wazi katika Kiswahili.
- source_word: οὐχ εὑρέθη
  choice: hakupatikana
  rationale: Huhifadhi hali ya kutendwa na maana ya kubainika katika muktadha wa hukumu bila kuongeza ufafanuzi.
- source_word: ἐν τῇ βίβλῳ τῆς ζωῆς
  choice: katika kitabu cha uzima
  rationale: βίβλος inaweza kumaanisha kitabu au hati-kunjo. ‘Kitabu cha uzima’ ni usemi wazi na unaoeleweka kwa kawaida katika muktadha huu.
- source_word: γεγραμμένος
  choice: ameandikwa
  rationale: Huhifadhi moja kwa moja hali timilifu ya kutendwa ya kitenzi γράφω na humrejelea mtu ambaye jina lake limeandikwa.
- source_word: ἐβλήθη
  choice: alitupwa
  rationale: Ni tafsiri ya moja kwa moja na ya sasa ya hali ya kutendwa ya βάλλω, ikihifadhi wazo la kutupwa kwa nguvu bila kutia chumvi.
- source_word: εἰς τὴν λίμνην τοῦ πυρός
  choice: katika ziwa la moto
  rationale: Huhifadhi taswira ya kiapokaliptiki kama ilivyo; katika Kiswahili, ‘kutupwa katika’ ni muundo wa kawaida wa kueleza kuingizwa ndani ya mahali.
theological_decisions:
- issue: Umoja wa uwakilishi unaomhusu mtu yeyote
  choice: alitupwa
  alternative: mtu huyo alitupwa
  rationale: Kiswahili hutumia ngeli ya mtu yenye umoja bila kulazimika kuonyesha jinsia ya kiume. Hivyo umoja wa Kigiriki umehifadhiwa kwa kawaida bila kuingiza utata usiokuwapo katika lugha lengwa.
- issue: Taswira ya hukumu ya mwisho
  choice: ziwa la moto
  alternative: ziwa lenye moto
  rationale: Tafsiri inahifadhi taswira yenyewe bila kufafanua kwa mtazamo wa dhehebu kuhusu asili au muda wa adhabu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye staha na inayoeleweka kwa wasomaji wa kawaida. Muundo wa umoja umehifadhiwa, huku mfumo wa ngeli za Kiswahili ukiepuka hitaji la kiwakilishi chenye jinsia.
