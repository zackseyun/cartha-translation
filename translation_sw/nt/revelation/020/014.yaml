  text: καὶ ὁ θάνατος καὶ ὁ ᾅδης ἐβλήθησαν εἰς τὴν λίμνην τοῦ πυρός. οὗτος ὁ ⸂θάνατος ὁ δεύτερός⸃ ἐστιν, ἡ λίμνη τοῦ πυρός.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/014.yaml
  text: And Death and Hades were thrown into the lake of fire. This is the second death[a], the lake of fire.
translation:
  language: sw
  text: Na Kifo na Kuzimu[a] vilitupwa katika ziwa la moto. Hiki ndicho kifo cha pili, ziwa la moto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Hadesi” au “kaburi.” Neno la Kigiriki ni Hadesi, ambalo hapa linatofautishwa na “ziwa la moto”; kwa hiyo kulitafsiri “jehanamu” kunaweza kupotosha katika muktadha huu.
    reason: lexical_alternative
lexical_decisions:
- source_word: θάνατος
  choice: Kifo / kifo
  rationale: Katika sehemu ya kwanza, “Kifo” kimeandikwa kwa herufi kubwa ili kuonyesha uhuishaji wake pamoja na Kuzimu; katika “kifo cha pili,” limetumiwa kama jina la hali au hukumu.
- source_word: ᾅδης
  choice: Kuzimu
  rationale: “Kuzimu” ni neno la kawaida la Kiswahili kwa makao ya wafu na hapa linatofautishwa wazi na ziwa la moto. Halitafsiriwi “jehanamu,” jambo ambalo lingeunganisha taswira mbili tofauti katika mstari huu.
- source_word: ἐβλήθησαν
  choice: zikatupwa
  rationale: Huhifadhi hali ya kutendwa na wazo la kuondolewa kwa nguvu, kwa Kiswahili cha kawaida na chenye mtiririko wa simulizi.
- source_word: λίμνη τοῦ πυρός
  choice: ziwa la moto
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya taswira hii ya kiapokaliptiki.
- source_word: οὗτος
  choice: Hiki ndicho
  rationale: Kiwakilishi kimewekwa wazi na kupatanishwa na nomino “kifo,” huku kauli ya utambulisho ikihifadhiwa.
- source_word: θάνατος ὁ δεύτερος
  choice: kifo cha pili
  rationale: Ni Kiswahili cha asili kinachohifadhi usemi maalumu wa Ufunuo.
- source_word: ἡ λίμνη τοῦ πυρός
  choice: ziwa la moto
  rationale: Kirai kimerudiwa kama katika Kigiriki; “yaani” huonyesha uhusiano wa ufafanuzi bila kubadili taswira.
theological_decisions:
- issue: Tafsiri ya ᾅδης katika muktadha wa hukumu ya mwisho
  choice: Kuzimu
  alternative: Hadesi; kaburi; jehanamu
  rationale: Mstari unatofautisha Kuzimu na ziwa la moto. “Jehanamu” ingeweza kufuta tofauti hiyo, huku “kaburi” likipunguza maana kuwa mahali pa kuzikia tu. “Kuzimu” huhifadhi wazo la makao ya wafu bila kuamua zaidi kuhusu hali yake.
- issue: Uhuishaji wa θάνατος
  choice: “Kifo” katika kishazi cha kwanza, lakini “kifo” katika “kifo cha pili”
  alternative: Herufi ndogo kila mahali; herufi kubwa kila mahali
  rationale: Kishazi cha kwanza kinaonyesha Kifo na Kuzimu kama vitu vinavyotendewa tendo, hivyo herufi kubwa huonyesha uhuishaji wa kifasihi. Usemi “kifo cha pili” unataja hali au hukumu na hauhitaji kuhuishwa.
- issue: Uhusiano wa “kifo cha pili” na “ziwa la moto”
  choice: yaani ziwa la moto
  alternative: kifo cha pili, ziwa la moto
  rationale: Kigiriki kina kirai cha ufafanuzi kinacholitambulisha ziwa la moto kuwa kifo cha pili. “Yaani” huwasilisha uhusiano huo kwa Kiswahili kinachoeleweka bila kuongeza maelezo ya kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa msomaji wa kawaida. “Kuzimu” limetumiwa kama neno linalojulikana zaidi kuliko unukuzi “Hadesi,” na tofauti yake na ziwa la moto imefafanuliwa katika tanbihi.
