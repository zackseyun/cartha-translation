id: REV.20.13
reference: Revelation 20:13
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἔδωκεν ἡ θάλασσα τοὺς νεκροὺς τοὺς ἐν αὐτῇ, καὶ ὁ θάνατος καὶ ὁ ᾅδης ἔδωκαν τοὺς νεκροὺς τοὺς ἐν αὐτοῖς, καὶ ἐκρίθησαν ἕκαστος κατὰ τὰ ἔργα αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/013.yaml
  text: And the sea gave up the dead who were in it[a], and Death and Hades gave up the dead who were in them, and each one was judged according to their deeds.
translation:
  language: sw
  text: Bahari ikawatoa wafu waliokuwa ndani yake, nayo Mauti na Kuzimu[a] zikawatoa wafu waliokuwa ndani yao. Kila mmoja akahukumiwa kulingana na matendo yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “makao ya wafu.” Neno la Kigiriki ni ᾅδης (Hades), ambalo ni tofauti na maneno yanayotafsiriwa mara nyingi kuwa “jehanamu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδωκεν / ἔδωκαν
  choice: ikawatoa / zikawatoa
  rationale: Ingawa kitenzi δίδωμι kwa msingi humaanisha ‘kutoa’ au ‘kupa,’ hapa kinaonyesha bahari, Mauti na Kuzimu kuwaachilia wafu ili wahukumiwe. ‘Kuwatoa’ ni ya asili katika Kiswahili na inafaa muktadha huu.
- source_word: ἡ θάλασσα
  choice: Bahari
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa θάλασσα, nalo linadumisha urejelezi maalumu wa nomino yenye kibainishi katika Kigiriki.
- source_word: τοὺς νεκρούς
  choice: wafu
  rationale: Kivumishi hiki kimetumika kama nomino. ‘Wafu’ ni tafsiri fupi, wazi na ya kawaida katika Kiswahili.
- source_word: τοὺς ἐν αὐτῇ
  choice: waliokuwa ndani yake
  rationale: Kirai hiki kinawatambulisha wafu waliokuwa baharini. Kishazi rejeshi kinaeleza uhusiano huo kwa Kiswahili cha asili.
- source_word: ὁ θάνατος
  choice: Mauti
  rationale: Katika maono haya θάνατος imewasilishwa kama nguvu au mamlaka inayowatoa wafu. ‘Mauti’ hudumisha uzito wa lugha ya kiapokaliptiki na herufi kubwa inaonyesha uhuishaji huo.
- source_word: ὁ ᾅδης
  choice: Kuzimu
  rationale: ‘Kuzimu’ ni istilahi ya kawaida ya Kiswahili kwa makao au ulimwengu wa wafu. Haichanganyi ᾅδης na maneno ya adhabu ya mwisho kama γέεννα au ziwa la moto.
- source_word: τοὺς ἐν αὐτοῖς
  choice: wafu waliokuwa ndani yao
  rationale: Kiwakilishi cha Kigiriki ni cha wingi na kinarejelea Mauti na Kuzimu. ‘Ndani yao’ kinadumisha wingi huo bila kuamua zaidi namna ya kuelewa uhusiano wa viwili hivyo.
- source_word: ἐκρίθησαν ἕκαστος
  choice: Kila mmoja akahukumiwa
  rationale: Kitenzi cha Kigiriki ni cha wingi, lakini ἕκαστος hugawa hukumu kwa mtu mmoja mmoja. Kiswahili hutumia kwa asili muundo wa umoja ‘kila mmoja akahukumiwa.’
- source_word: κατὰ τὰ ἔργα αὐτῶν
  choice: kulingana na matendo yake
  rationale: ‘Matendo’ yanawasilisha ἔργα kwa Kiswahili cha kawaida katika muktadha wa hukumu. Kiwakilishi cha umoja ‘yake’ kinakubaliana na ‘kila mmoja’ huku maana ya kugawa kwa watu wote ikibaki.
theological_decisions:
- issue: Tafsiri ya ᾅδης katika muktadha wa hukumu ya mwisho
  choice: Kuzimu
  alternative: makao ya wafu; jehanamu
  rationale: ‘Kuzimu’ hudumisha tofauti kati ya ᾅδης na adhabu ya mwisho inayotajwa kama ziwa la moto katika muktadha wa karibu. ‘Jehanamu’ ingeweza kuingiza maana ya γέεννα isiyodaiwa na Kigiriki.
- issue: Uhuishaji wa θάνατος
  choice: Mauti
  alternative: mauti; kifo
  rationale: Herufi kubwa na neno ‘Mauti’ vinaonyesha kwamba maono yanaiwasilisha kama nguvu au mamlaka inayowatoa wafu, bila kuongeza dai jingine la kimafundisho.
- issue: Msingi wa hukumu unaoelezwa na κατὰ τὰ ἔργα
  choice: kulingana na matendo yake
  alternative: kwa sababu ya matendo yake; kwa kadiri ya matendo yake
  rationale: ‘Kulingana na’ hudumisha uhusiano mpana wa κατὰ bila kufafanua kimfumo jinsi matendo yanavyohusiana na hukumu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa asili na hadhi inayofaa maono ya kiapokaliptiki. Muundo wa sentensi unadumisha urudiaji wa chanzo na mgawanyo wa hukumu kwa kila mtu. Alama ya tanbihi imewekwa baada ya ‘Kuzimu,’ neno linalofafanuliwa na tanbihi.
