  text: καὶ ἐκράτησεν τὸν δράκοντα, ⸂ὁ ὄφις ὁ ἀρχαῖος⸃, ὅς ἐστιν Διάβολος καὶ ὁ ⸀Σατανᾶς, καὶ ἔδησεν αὐτὸν χίλια ἔτη,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/002.yaml
  text: And he seized the dragon—that ancient serpent[a], who is the Devil and Satan—and bound him for a thousand years,
translation:
  language: sw
  text: Akamkamata yule joka—yule nyoka wa kale[a][b], ambaye ni Ibilisi na Shetani—akamfunga kwa miaka elfu moja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nyoka wa zamani” au “yule nyoka wa tangu kale.”
    reason: lexical_alternative
  - marker: b
    text: Nakala za kale hutofautiana kuhusu maneno “yule nyoka wa kale.”
    reason: textual_variant
lexical_decisions:
- source_word: ἐκράτησεν
  choice: akamkamata
  rationale: Kitenzi hiki hapa kinaonyesha kumtia mtu mkononi kwa nguvu na kwa uamuzi; “akamkamata” ni cha kawaida na chenye nguvu katika Kiswahili.
- source_word: δράκοντα
  choice: joka
  rationale: “Joka” huhifadhi taswira ya kiapokaliptiki na mwendelezo wa istilahi ndani ya Ufunuo.
- source_word: ὁ ὄφις ὁ ἀρχαῖος
  choice: yule nyoka wa kale
  rationale: Kirai hiki kinamtambulisha joka kwa maelezo ya ziada. “Yule” hurejelea nyoka anayejulikana tangu zamani na “wa kale” huwasilisha ἀρχαῖος bila kufafanua zaidi ya maandishi.
- source_word: Διάβολος
  choice: Ibilisi
  rationale: Hili ndilo jina la kawaida la Kiswahili kwa Διάβολος na linahifadhi utambulisho tofauti katika mfululizo wa majina.
- source_word: Σατανᾶς
  choice: Shetani
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
- source_word: ἔδησεν
  choice: akamfunga
  rationale: “Akamfunga” huhifadhi picha halisi ya kumfunga bila kuamua namna au kiwango cha kuzuiwa kwake.
- source_word: χίλια ἔτη
  choice: kwa miaka elfu moja
  rationale: “Kwa” huonyesha muda, na “miaka elfu moja” huwasilisha maana ya wazi bila kuamua kama kipindi hicho ni halisi au cha mfano.
theological_decisions:
- issue: Asili ya miaka elfu moja
  choice: Kutafsiri χίλια ἔτη moja kwa moja kuwa “miaka elfu moja.”
  alternative: Kuitafsiri wazi kuwa kipindi halisi cha miaka elfu moja au kuwa kipindi cha mfano.
  rationale: Maandishi yenyewe hayaamui hapa mjadala wa kama kipindi hicho ni halisi au cha mfano; tafsiri inahifadhi mvutano huo.
- issue: Utambulisho wa joka
  choice: 'Kuhifadhi mfululizo mzima: joka, nyoka wa kale, Ibilisi, na Shetani.'
  alternative: Kufupisha majina hayo kuwa utambulisho mmoja tu.
  rationale: Aya yenyewe inatoa kila jina katika mfululizo wa utambulisho, kwa hiyo yote yanapaswa kuhifadhiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa masimulizi wenye “aka-” unaakisi mfululizo wa vitendo vya Kigiriki kwa ufasaha. Vistari virefu vinatenga maelezo ya utambulisho bila kuvuruga mtiririko.
