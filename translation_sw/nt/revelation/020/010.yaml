source:
  edition: SBLGNT
  text: καὶ ὁ διάβολος ὁ πλανῶν αὐτοὺς ἐβλήθη εἰς τὴν λίμνην τοῦ πυρὸς καὶ θείου, ὅπου καὶ τὸ θηρίον καὶ ὁ ψευδοπροφήτης, καὶ βασανισθήσονται ἡμέρας καὶ νυκτὸς εἰς τοὺς αἰῶνας τῶν αἰώνων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/010.yaml
  text: And the devil[a], who was deceiving them, was thrown into the lake of fire and sulfur, where also the beast and the false prophet are[b], and they will be tormented day and night forever and ever.
translation:
  language: sw
  text: Naye Ibilisi, aliyekuwa akiwapotosha, akatupwa ndani ya ziwa la moto na kiberiti,[a] ambamo pia wamo yule mnyama na nabii wa uongo; nao watateswa mchana na usiku milele na milele.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ziwa la moto na salfa.”
    reason: lexical_alternative
  - marker: b
    text: 'Kigiriki: “hadi enzi za enzi,” usemi unaosisitiza muda usio na mwisho.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διάβολος
  choice: Ibilisi
  rationale: Ni jina la kawaida na linaloeleweka katika Kiswahili kwa mhusika anayerejelewa hapa, si maelezo ya jumla tu ya mchongezi.
- source_word: ὁ πλανῶν αὐτοὺς
  choice: aliyekuwa akiwapotosha
  rationale: Muundo huu unaonyesha shughuli yake ya kuendelea katika simulizi; ‘kupotosha’ huhifadhi maana ya kudanganya na kuwaongoza watu waache njia iliyo sawa.
- source_word: ἐβλήθη
  choice: akatupwa
  rationale: Huhifadhi hali ya kutendwa na nguvu ya kuingizwa kwa lazima katika hukumu, kwa Kiswahili cha sasa na cha kawaida.
- source_word: λίμνην τοῦ πυρὸς καὶ θείου
  choice: ziwa la moto na kiberiti
  rationale: ‘Kiberiti’ ni neno la kawaida la Kiswahili kwa sulfur katika picha hii ya kibiblia; tanbihi inaweka wazi maana hiyo.
- source_word: ὅπου καὶ τὸ θηρίον καὶ ὁ ψευδοπροφήτης
  choice: ambamo pia yumo yule mnyama na nabii wa uongo
  rationale: Kigiriki hakina kitenzi wazi. ‘Yumo’ huwasilisha kwa kawaida kuwamo kwao kunakoendelea bila kugeuza kishazi kuwa cha wakati uliopita.
- source_word: θηρίον
  choice: yule mnyama
  rationale: Ni tafsiri ya kawaida ya mhusika huyu wa kiapokaliptiki; ‘yule’ huonyesha kuwa tayari ametambulishwa katika muktadha.
- source_word: ψευδοπροφήτης
  choice: nabii wa uongo
  rationale: Ni kisawe cha moja kwa moja, cha kawaida na kinachoeleweka katika Kiswahili.
- source_word: βασανισθήσονται
  choice: watateswa
  rationale: Huonyesha mateso makali ya hukumu bila kuongeza namna maalumu ya kuwatesa ambayo haijaelezwa.
- source_word: ἡμέρας καὶ νυκτός
  choice: mchana na usiku
  rationale: Ni nahau ya Kiswahili inayoonyesha kuendelea bila kukoma.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: milele na milele
  rationale: Ni usemi wa kawaida wa Kiswahili unaolingana na nahau ya Kigiriki inayosisitiza muda usio na mwisho.
theological_decisions:
- issue: Muda wa adhabu ya mwisho unaoelezwa na εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: milele na milele
  alternative: kwa nyakati za nyakati
  rationale: Tafsiri inahifadhi nguvu ya nahau ya Kigiriki kwa Kiswahili cha kawaida bila kuipunguza wala kuamua mijadala mingine ya kimafundisho iliyo nje ya mstari huu.
- issue: Kitenzi kinachodokezwa katika ὅπου καὶ τὸ θηρίον καὶ ὁ ψευδοπροφήτης
  choice: ambamo pia yumo yule mnyama na nabii wa uongo
  alternative: ambamo pia walitupwa yule mnyama na nabii wa uongo
  rationale: Kwa kuwa Kigiriki hakitaji kitenzi, ‘yumo’ hukamilisha sarufi ya Kiswahili huku kikihifadhi dokezo la kuwamo kwao kunakoendelea kutoka muktadha uliotangulia, bila kuongeza tendo jipya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa simulizi umetumia ‘akatupwa,’ huku vishazi vingine vikihifadhi hali ya kuendelea na nguvu ya taswira ya maandishi ya Kigiriki.
