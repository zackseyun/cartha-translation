  text: καὶ λέγει μοι· Ὅρα μή· σύνδουλός σού εἰμι καὶ τῶν ἀδελφῶν σου τῶν προφητῶν καὶ τῶν τηρούντων τοὺς λόγους τοῦ βιβλίου τούτου· τῷ θεῷ προσκύνησον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/009.yaml
  text: And he says to me[a], “Do not do that! I am a fellow servant with you and with your brothers the prophets, and with those who keep the words of this book[c][b]. Worship God.”
translation:
  language: sw
  text: Naye akaniambia, “Usifanye hivyo![a] Mimi ni mtumwa mwenzako, pamoja na ndugu zako walio manabii na wale wanaoyashika maneno ya kitabu hiki.[c] Mwabudu Mungu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kigiriki kina katazo fupi, kwa karibu: ‘Angalia, usije’; maana yake katika muktadha huu ni ‘Usifanye hivyo,’ yaani, usimwabudu malaika.'
    reason: lexical_alternative
  - marker: c
    text: 'Linganisha Ufunuo 19:10, ambako malaika anatoa onyo hilohilo: ‘Mwabudu Mungu.’'
    reason: cross_reference
lexical_decisions:
- source_word: Ὅρα μή
  choice: Usifanye hivyo!
  rationale: Hii ni kauli fupi na kali ya kukataza. Kitendo kinachokatazwa kinaeleweka kutokana na muktadha kuwa ni jaribio la Yohana kumwabudu malaika; Kiswahili cha kawaida huhitaji kitendo hicho kidokezwe wazi.
- source_word: σύνδουλός
  choice: mtumwa mwenzenu
  rationale: Neno hili linaonyesha hali ya pamoja ya kuwa watumwa chini ya bwana mmoja. Umbo la wingi ‘mwenzenu’ linawaunganisha Yohana, ndugu zake walio manabii, na wale wanaoyashika maneno ya kitabu hiki, kama inavyofanya orodha ya Kigiriki.
- source_word: ἀδελφῶν σου τῶν προφητῶν
  choice: ndugu zako walio manabii
  rationale: Kirai ‘walio manabii’ kinawatambulisha ndugu wanaokusudiwa bila kupanua maana ya maandishi au kufanya ‘manabii’ kuwa kundi tofauti.
- source_word: τηρούντων
  choice: wanaoyashika
  rationale: '‘Kuyashika’ huhifadhi wigo wa τηρέω: kuyatunza kwa uaminifu na kuyaishi kwa utiifu, bila kuibana maana kuwa kutii tu au kulinda tu.'
- source_word: λόγους τοῦ βιβλίου τούτου
  choice: maneno ya kitabu hiki
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya yaliyomo katika kitabu; ‘kitabu’ kinaeleweka vizuri kuliko kueleza umbo lake la kale kuwa hati-kunjo.
- source_word: τῷ θεῷ προσκύνησον
  choice: Mwabudu Mungu
  rationale: Katika muktadha huu προσκυνέω ni ibada ambayo haipaswi kuelekezwa kwa malaika bali kwa Mungu. ‘Mwabudu’ huwasilisha wazi tofauti hiyo.
theological_decisions:
- issue: Hali inayoonyeshwa na σύνδουλος
  choice: Kutumia ‘mtumwa mwenzenu’ ili kuonyesha wazi kuwa malaika na watu waliotajwa wote wako chini ya Mungu.
  alternative: mtumishi mwenzenu
  rationale: Hoja ya malaika ni kwamba yeye si wa kuabudiwa, kwa kuwa pia yuko chini ya mamlaka ya Bwana mmoja. ‘Mtumwa’ huhifadhi uzito wa hali hiyo kuliko ‘mtumishi,’ bila kuongeza dai la kimadhehebu.
- issue: Kitendo kilichodokezwa katika Ὅρα μή
  choice: Kusema ‘Usifanye hivyo!’
  alternative: Angalia usifanye
  rationale: Kigiriki kina katazo lililoachwa bila kutaja kitendo, lakini muktadha unaonyesha kuwa kinachokatazwa ni kumwabudu malaika. Kiswahili hiki kinaeleza maana ya katazo kwa kawaida bila kulifanya kuwa amri pana isiyo na muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Naye akaniambia’ huwasilisha καὶ λέγει μοι kwa mtiririko wa simulizi wa Kiswahili. Alama ya mstari mrefu baada ya ‘mwenzenu’ hufafanua kwa kawaida wale wote ambao malaika anajiita mwenzao, huku ikihifadhi mpangilio na mvutano wa maandishi ya Kigiriki.
