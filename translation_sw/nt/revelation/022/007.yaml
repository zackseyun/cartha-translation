base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/007.yaml
  text: And behold[a], I am coming soon[b]. Blessed is the one who keeps the words of the prophecy of this book.
translation:
  language: sw
  text: “Tazama, ninakuja hivi karibuni[a]. Heri mtu anayeyashika maneno ya unabii wa kitabu hiki[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au ‘ninakuja kwa upesi’; neno la Kigiriki linaweza kusisitiza ama ukaribu wa wakati (‘hivi karibuni’) ama kuja kwa haraka au ghafula.
    reason: lexical_alternative
  - marker: b
    text: Au ‘gombo hili.’
    reason: cultural_note
lexical_decisions:
- source_word: ἰδοὺ
  choice: Tazama
  rationale: Linahifadhi nguvu ya neno la kuvuta usikivu na uzito wa tangazo, huku likiwa la kawaida na lenye heshima katika Kiswahili.
- source_word: ἔρχομαι
  choice: ninakuja
  rationale: Wakati wa sasa wenye mwelekeo wa wakati ujao katika muktadha huu unawakilishwa kwa kawaida na ‘ninakuja,’ bila kuongeza utambulisho wa msemaji.
- source_word: ταχύ
  choice: hivi karibuni
  rationale: Katika muktadha huu, maana kuu ni ukaribu wa wakati. Maana inayowezekana ya kuja kwa upesi au ghafula imehifadhiwa katika tanbihi.
- source_word: μακάριος
  choice: Heri
  rationale: ‘Heri’ ni tafsiri ya kawaida ya kauli za baraka na inadumisha uzito wa kiroho na wa wakati wa mwisho kuliko neno linaloeleza hisia za furaha pekee.
- source_word: ὁ τηρῶν
  choice: mtu anayeyashika
  rationale: Muundo huu unaonyesha mhusika yeyote kwa ujumla. ‘Kuyashika’ huhifadhi wazo la kutunza, kuzingatia na kutii bila kulifanya kuwa utii pekee.
- source_word: τοὺς λόγους
  choice: maneno
  rationale: Tafsiri ya moja kwa moja ya wingi ambayo haiyafupishi maneno hayo kuwa ujumbe mmoja.
- source_word: τῆς προφητείας
  choice: ya unabii
  rationale: Inahifadhi uhusiano wa kisarufi na aina ya ujumbe wa kinabii bila ufafanuzi wa ziada.
- source_word: τοῦ βιβλίου τούτου
  choice: wa kitabu hiki
  rationale: ‘Kitabu’ ni neno la kawaida na linaloeleweka kwa rejeo hili; uwezekano wa kitu cha kale kilichoandikwa kama gombo umeonyeshwa katika tanbihi.
theological_decisions:
- issue: Utambulisho wa msemaji wa ‘ninakuja hivi karibuni’
  choice: Kutotaja jina la msemaji ndani ya aya, bali kudumisha nafsi ya kwanza kama ilivyo katika Kigiriki.
  alternative: Kuongeza wazi kwamba msemaji ni Yesu.
  rationale: Maandishi ya Kigiriki hayana jina katika aya hii. Muktadha wa kifasihi ndio unaomtambulisha msemaji, kwa hiyo tafsiri haipaswi kuingiza jina lisilokuwamo katika chanzo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. ‘Tazama’ na ‘Heri’ vinadumisha uzito wa tangazo la kiapokaliptiki bila kutumia lugha ya kizamani kupita kiasi. Alama za tanbihi zimewekwa baada ya maneno yanayohusika moja kwa moja.
