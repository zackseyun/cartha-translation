  source_fidelity: 'Tafsiri inawakilisha kwa uaminifu vipengele vyote vya Kigiriki: kiashirio cha kuvuta usikivu (καὶ ἰδού), nafsi ya kwanza ya ἔρχομαι bila kutaja jina la msemaji, ταχύ kwa maana ya ukaribu wa wakati, heri ya μακάριος, na usemi wa jumla ὁ τηρῶν. “Maneno ya unabii wa kitabu hiki” hudumisha wingi wa λόγους na uhusiano wa kijinifu wa τῆς προφητείας τοῦ βιβλίου τούτου.'
