id: REV.22.13
reference: Revelation 22:13
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐγὼ τὸ Ἄλφα καὶ τὸ Ὦ, ὁ πρῶτος καὶ ὁ ἔσχατος, ⸀ἡ ἀρχὴ καὶ ⸀τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/013.yaml
  text: I am the Alpha and the Omega[a], the first and the last, the beginning and the end.
translation:
  language: sw
  text: Mimi ni Alfa na Omega, wa kwanza na wa mwisho, mwanzo na mwisho.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “chanzo na lengo.”
    reason: Mbadala huu unaonyesha uwezekano wa ἀρχή kumaanisha chanzo na τέλος kumaanisha lengo au kusudi la mwisho.
lexical_decisions:
- source_word: ἐγὼ
  choice: Mimi
  rationale: Kiwakilishi cha wazi katika Kigiriki kina mkazo; “Mimi” kinahifadhi mkazo huo katika tamko hili la heshima.
- source_word: τὸ Ἄλφα
  choice: Alfa
  rationale: Jina la herufi ya kwanza ya alfabeti ya Kigiriki limehifadhiwa kwa kuwa ni cheo cha kifumbo kilichozoeleka katika Ufunuo.
- source_word: τὸ Ὦ
  choice: Omega
  rationale: Jina la herufi ya mwisho ya alfabeti ya Kigiriki limehifadhiwa ili kudumisha jozi ya kiishara “Alfa na Omega.”
- source_word: ὁ πρῶτος
  choice: wa kwanza
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya kivumishi kinachotumiwa kama cheo; ngeli ya ‘wa’ humrejelea msemaji aliye nafsi.
- source_word: ὁ ἔσχατος
  choice: wa mwisho
  rationale: “Wa mwisho” ni kinyume cha kawaida na chenye ulinganifu wa “wa kwanza.”
- source_word: ἡ ἀρχὴ
  choice: mwanzo
  rationale: “Mwanzo” huhifadhi ulinganifu wa kifasihi na “mwisho” pamoja na maana ya msingi ya ἀρχή katika jozi hii.
- source_word: τὸ τέλος
  choice: mwisho
  rationale: “Mwisho” ni mwenzi wa kawaida wa “mwanzo,” huku maana inayowezekana ya lengo ikihifadhiwa katika tanbihi.
theological_decisions:
- issue: Kuhifadhi majina matatu ya jozi yanayoonyesha ukamilifu wa mamlaka na umilele bila kufafanua kupita kiasi maana yake ya kimetafizikia
  choice: Mimi ni Alfa na Omega, wa kwanza na wa mwisho, mwanzo na mwisho.
  alternative: Mimi ni Alfa na Omega, wa kwanza na wa mwisho, chanzo na lengo.
  rationale: Muundo wa Kigiriki unaweka jozi tatu sambamba. Tafsiri iliyochaguliwa inadumisha ufupi na ulinganifu wake, bila kuingiza ufafanuzi wa kiteolojia usiotajwa wazi. Maana zinazowezekana za ἀρχή kama ‘chanzo’ na τέλος kama ‘lengo’ zimeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima, mfupi na wa sasa. “Alfa na Omega” zimehifadhiwa kama majina ya herufi za Kigiriki na vyeo vya kiishara. Alama ya tanbihi imewekwa baada ya jozi inayohusika moja kwa moja, “mwanzo na mwisho.”
