  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὁ ἀδικῶν ἀδικησάτω ἔτι, καὶ ὁ ῥυπαρὸς ⸀ῥυπαρευθήτω ἔτι, καὶ ὁ δίκαιος δικαιοσύνην ποιησάτω ἔτι, καὶ ὁ ἅγιος ἁγιασθήτω ἔτι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/011.yaml
  text: Let the one who does wrong still do wrong, and the filthy still be made filthy, and the righteous still practice righteousness, and the holy still be made holy.
translation:
  language: sw
  text: Anayetenda yasiyo haki na azidi kutenda yasiyo haki; aliye mchafu na azidi kuchafuliwa[a]; mwenye haki na azidi kutenda haki[b]; na aliye mtakatifu na azidi kutakaswa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na azidi kuwa mchafu.” Kitenzi cha Kigiriki kiko katika kauli ya kutendwa, yaani “kuchafuliwa,” ingawa kinaweza kutafsiriwa kwa usemi wa hali.
    reason: lexical_alternative
  - marker: b
    text: Au, “na azidi kutenda uadilifu.” Neno la Kigiriki δικαιοσύνη linaweza kumaanisha haki au uadilifu.
    reason: lexical_alternative
  - marker: c
    text: Au, “na azidi kufanywa mtakatifu.” Kitenzi cha Kigiriki kiko katika kauli ya kutendwa na kinaweza kumaanisha kutakaswa au kufanywa mtakatifu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἀδικῶν … ἀδικησάτω ἔτι
  choice: Anayetenda yasiyo haki na azidi kutenda yasiyo haki
  rationale: Kirai cha kisifa chenye kibainishi kimetafsiriwa kama mtu kwa ujumla. “Kutenda yasiyo haki” huhifadhi nguvu ya kitendo cha ἀδικέω bila kukiweka tu kama sifa ya kudumu; “na azidi” huonyesha amri ya nafsi ya tatu pamoja na wazo la kuendelea katika ἔτι.
- source_word: ὁ ῥυπαρός
  choice: aliye mchafu
  rationale: Kivumishi kilichotumiwa kama nomino kinatafsiriwa kwa usemi wa kawaida wa Kiswahili, huku kikihifadhi maana za uchafu wa kimaadili na unajisi.
- source_word: ῥυπαρευθήτω ἔτι
  choice: na azidi kuchafuliwa
  rationale: “Kuchafuliwa” huhifadhi kauli ya kutendwa ya kitenzi cha Kigiriki na kuacha mtendaji bila kutajwa; “azidi” huwasilisha kuendelea kunakoonyeshwa na ἔτι.
- source_word: ὁ δίκαιος … δικαιοσύνην ποιησάτω ἔτι
  choice: mwenye haki na azidi kutenda haki
  rationale: “Mwenye haki” ni usemi wa kawaida kwa kivumishi kilichotumiwa kama nomino, na “kutenda haki” huonyesha mwenendo hai unaoelezwa na ποιεῖν δικαιοσύνην.
- source_word: ὁ ἅγιος … ἁγιασθήτω ἔτι
  choice: aliye mtakatifu na azidi kutakaswa
  rationale: “Aliye mtakatifu” huhifadhi sifa ya ἅγιος, na “kutakaswa” huhifadhi kauli ya kutendwa ya ἁγιασθήτω kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Nguvu ya amri katika muktadha wa hali ya mwisho ya kimaadili
  choice: Vitenzi vyote vinne vimetolewa kama amri za nafsi ya tatu kwa muundo “na azidi …”
  alternative: Kuvitafsiri kama taarifa za wakati ujao, kwa mfano, “ataendelea kutenda …”
  rationale: Maumbo ya Kigiriki ni amri, si taarifa elekezi. Tafsiri inahifadhi sauti hiyo nzito bila kudai kwamba uovu unaidhinishwa.
- issue: Kauli ya kutendwa katika ῥυπαρευθήτω na ἁγιασθήτω
  choice: Kuhifadhi kauli ya kutendwa kwa “kuchafuliwa” na “kutakaswa”
  alternative: “Aendelee kuwa mchafu” na “aendelee kuwa mtakatifu”
  rationale: Maumbo yote mawili ni ya kauli ya kutendwa. Kuyahifadhi kunaacha utendaji wake bila kutajwa na hakutatui kimya kimya mvutano wa kiteolojia uliomo katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa vifungu vinne na marudio ya “na azidi” umehifadhiwa ili kuonyesha ulinganifu na msisitizo wa maandishi ya Kigiriki. Semikoloni zimetumiwa kutenganisha vifungu vya ulinganifu kwa uwazi.
