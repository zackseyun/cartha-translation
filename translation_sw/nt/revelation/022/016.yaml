id: REV.22.16
reference: Revelation 22:16
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἐγὼ Ἰησοῦς ἔπεμψα τὸν ἄγγελόν μου μαρτυρῆσαι ὑμῖν ταῦτα ἐπὶ ταῖς ἐκκλησίαις. ἐγώ εἰμι ἡ ῥίζα καὶ τὸ γένος Δαυίδ, ὁ ἀστὴρ ὁ λαμπρός, ὁ πρωϊνός.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/016.yaml
  text: I[a], Jesus, have sent my angel to testify to you these things for the churches[b]. I am the root and the descendant of David, the bright morning star.
translation:
  language: sw
  text: “Mimi, Yesu, nimemtuma malaika wangu ili ayashuhudie mambo haya kwenu kwa ajili ya makanisa[a]. Mimi ndiye mzizi na mzao wa Daudi[b], nyota angavu ya asubuhi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika makanisa,” au “kuhusu makanisa.” Kirai cha Kigiriki ἐπὶ ταῖς ἐκκλησίαις kinaweza kuwa na vivuli hivi tofauti vya maana.
    reason: lexical_alternative
  - marker: b
    text: Au, “mzizi na uzao wa Daudi.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐγὼ Ἰησοῦς
  choice: Mimi, Yesu,
  rationale: Kiwakilishi kilichotajwa wazi pamoja na jina kinaonyesha msisitizo wa kujitambulisha. Muundo wa kibainishi, “Mimi, Yesu,” ni wa kawaida na wenye hadhi katika Kiswahili, bila kuongeza kitenzi kisichokuwapo hapa.
- source_word: ἔπεμψα
  choice: nimemtuma
  rationale: 'Wakati timilifu wa Kiswahili unaonyesha tendo lililokamilika lenye umuhimu unaoendelea katika muktadha huu: Yesu amempa malaika utume wa kuwasilisha ufunuo.'
- source_word: ἄγγελόν μου
  choice: malaika wangu
  rationale: Katika mazingira ya kiapokaliptiki ya Ufunuo, ἄγγελος hapa inaeleweka kwa kawaida kuwa kiumbe wa mbinguni, si mjumbe wa kibinadamu.
- source_word: μαρτυρῆσαι ὑμῖν ταῦτα
  choice: ili awashuhudie mambo haya
  rationale: “Ili” huonyesha kusudi la kutumwa; “awashuhudie” hujumuisha walengwa wa ushuhuda, na “mambo haya” huhifadhi wingi wa ταῦτα na rejeo lake kwa yaliyomo katika ufunuo.
- source_word: ἐπὶ ταῖς ἐκκλησίαις
  choice: kwa ajili ya makanisa
  rationale: Kirai hiki cha Kigiriki kinaweza kuonyesha kusudi, eneo, au jambo linalohusika. “Kwa ajili ya makanisa” huwasilisha kwa Kiswahili cha kawaida kwamba ushuhuda huu umekusudiwa makanisa bila kulazimisha maana finyu zaidi.
- source_word: ἡ ῥίζα
  choice: mzizi
  rationale: Tafsiri ya moja kwa moja huhifadhi taswira ya chanzo au asili iliyomo katika cheo hiki cha Kimasihi.
- source_word: τὸ γένος Δαυίδ
  choice: mzao wa Daudi
  rationale: γένος inaweza kutaja nasaba au uzao. “Mzao” ni ya asili kwa mtu mmoja na inaeleza wazi uhusiano wa Yesu na nasaba ya Daudi.
- source_word: ὁ ἀστὴρ ὁ λαμπρός, ὁ πρωϊνός
  choice: nyota angavu ya asubuhi
  rationale: Muundo huu wa Kiswahili huhifadhi sifa zote mbili—kung'aa na kuwa ya asubuhi—kwa namna fupi, hai, na ya kawaida.
theological_decisions:
- issue: Kujitambulisha kwa Kimasihi kuhusiana na Daudi
  choice: mzizi na mzao wa Daudi
  alternative: chanzo na mzao wa Daudi
  rationale: Maandishi yanamtaja Yesu kuwa mzizi wa Daudi na pia mzao wake. Tafsiri huhifadhi fumbo na mvutano huo badala ya kuufafanua kwa kuondoa mojawapo ya maana zake.
- issue: Cheo cha Kikristo “nyota ya asubuhi”
  choice: nyota angavu ya asubuhi
  alternative: nyota ya asubuhi yenye kung'aa
  rationale: Kirai kimehifadhiwa kama Yesu anavyojitaja moja kwa moja, bila kuongeza ufafanuzi wa kimadhehebu au mafundisho yasiyotajwa katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wazi kwa wasomaji wa kawaida, huku taswira za “mzizi” na “nyota angavu ya asubuhi” na utata halisi wa kirai kinachohusu makanisa vikihifadhiwa.
