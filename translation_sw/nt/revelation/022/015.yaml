  text: ἔξω οἱ κύνες καὶ οἱ φάρμακοι καὶ οἱ πόρνοι καὶ οἱ φονεῖς καὶ οἱ εἰδωλολάτραι καὶ πᾶς φιλῶν καὶ ποιῶν ψεῦδος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/015.yaml
  text: Outside are the dogs and the sorcerers and the sexually immoral and the murderers and the idolaters[b][a], and everyone who loves and practices falsehood.
translation:
  language: sw
  text: Nje wako mbwa[b], wachawi, waasherati, wauaji, waabudu sanamu, na kila mtu anayependa na kutenda uongo[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kila mtu anayependa na kutenda jambo la uongo.”
    reason: lexical_alternative
  - marker: b
    text: Huenda “mbwa” limetumiwa hapa kwa njia ya mfano kuonyesha watu waliotengwa na walio najisi kimaadili; baadhi ya wafafanuzi hulihusisha na kundi maalumu zaidi.
    reason: cultural_note
lexical_decisions:
- source_word: ἔξω
  choice: Nje wako
  rationale: Kielezi kimetangulizwa kwa mkazo na kinaonyesha kutengwa na mji unaotajwa katika muktadha; kitenzi “wako” kinakamilisha sentensi kwa Kiswahili cha kawaida.
- source_word: κύνες
  choice: mbwa
  rationale: Inahifadhi picha halisi ya Kigiriki, ambayo hapa ina matumizi ya kisitiari, bila kuamua kimya-kimya ni kundi gani mahususi linalomaanishwa.
- source_word: φάρμακοι
  choice: wachawi
  rationale: Katika Ufunuo neno hili linawahusu watendaji wa uchawi; “wachawi” ni neno fupi na linaloeleweka katika Kiswahili sanifu.
- source_word: πόρνοι
  choice: waasherati
  rationale: Huwataja watu wenye mwenendo wa uasherati kwa maana pana, bila kulifunga neno kwa tendo moja tu la ngono.
- source_word: φονεῖς
  choice: wauaji
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida kwa watu wanaoua.
- source_word: εἰδωλολάτραι
  choice: waabudu sanamu
  rationale: Ni usemi wa sasa na ulio wazi unaoeleza wanaoabudu miungu kwa njia ya sanamu, huku ukihifadhi kipengele cha orodha ya maovu.
- source_word: πᾶς φιλῶν καὶ ποιῶν ψεῦδος
  choice: kila mtu anayependa na kutenda uongo
  rationale: “Kila mtu anaye...” huwakilisha vizuri πᾶς pamoja na vivumishi-tendo; “anayependa na kutenda” huhifadhi vitenzi vyote viwili na wazo la mwelekeo pamoja na mwenendo.
- source_word: ψεῦδος
  choice: uongo
  rationale: Neno “uongo” laweza kumaanisha jambo lisilo la kweli kwa upana au uwongo mmoja; hivyo linahifadhi kiasi cha utata wa neno la Kigiriki.
theological_decisions:
- issue: Ikiwa “mbwa” ifafanuliwe katika matini kuwa kundi maalumu badala ya kutafsiriwa kihalisi.
  choice: Kuhifadhi “mbwa” katika matini kuu.
  alternative: Watu najisi; watu wasio na haya; kundi jingine maalumu lililotengwa.
  rationale: Kigiriki kinatumia picha dhahiri ya κύνες, na Ufunuo hutumia sana lugha ya picha. Kuiacha picha hiyo huepuka kuingiza ufafanuzi mmoja wenye mjadala katika matini.
- issue: Ikiwa ψεῦδος itafsiriwe kwa maana pana ya uongo au kama uwongo mmoja.
  choice: Kutumia “uongo.”
  alternative: Uwongo mmoja.
  rationale: Muktadha wa “kupenda na kutenda” unaelekea kuonyesha mwelekeo na mwenendo wa kudumu, lakini umbo la Kigiriki pia linaweza kueleweka kama “uwongo”; tanbihi inahifadhi uwezekano huo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo wa orodha na utangulizi wenye mkazo “Nje wako” umehifadhiwa; istilahi zenye mjadala zimeachwa bila kufafanuliwa kupita kiasi katika matini kuu.
