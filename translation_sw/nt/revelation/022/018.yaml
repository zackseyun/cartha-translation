id: REV.22.18
reference: Revelation 22:18
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Μαρτυρῶ ἐγὼ παντὶ τῷ ἀκούοντι τοὺς λόγους τῆς προφητείας τοῦ βιβλίου τούτου· ἐάν τις ἐπιθῇ ἐπ’ αὐτά, ⸀ἐπιθήσει ὁ θεὸς ἐπ’ αὐτὸν τὰς πληγὰς τὰς γεγραμμένας ἐν τῷ βιβλίῳ τούτῳ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/018.yaml
  text: 'I testify to everyone who hears the words of the prophecy of this book: if anyone adds to them[b][a], God will add to him the plagues that are written in this book.'
translation:
  language: sw
  text: 'Ninatoa ushuhuda kwa kila mtu anayesikia maneno ya unabii wa kitabu hiki[a]: mtu yeyote akiyaongezea, Mungu atamwongezea mapigo yaliyoandikwa katika kitabu hiki.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “hati-kunjo” badala ya “kitabu”; neno la Kigiriki linaweza kurejelea maandishi katika umbo la hati-kunjo lililotumiwa zamani.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μαρτυρῶ
  choice: Ninamshuhudia
  rationale: Huhifadhi lugha ya kutoa ushuhuda kwa uzito, badala ya kuifasiri moja kwa moja kuwa onyo tu.
- source_word: παντὶ τῷ ἀκούοντι
  choice: kila mtu anayesikia
  rationale: Ni Kiswahili cha kawaida kinachowakilisha vizuri kishiriki cha wakati wa sasa na anayelengwa na ushuhuda.
- source_word: τοὺς λόγους τῆς προφητείας
  choice: maneno ya unabii
  rationale: Huhifadhi kwa uwazi marejeo ya yaliyomo kwa maneno na tabia yake ya kinabii.
- source_word: τοῦ βιβλίου τούτου / ἐν τῷ βιβλίῳ τούτῳ
  choice: wa kitabu hiki / katika kitabu hiki
  rationale: “Kitabu” ni neno la kawaida na linaloeleweka leo; limetumiwa kwa uthabiti katika sehemu zote mbili.
- source_word: ἐάν τις ἐπιθῇ ἐπ’ αὐτά
  choice: mtu yeyote akiyaongezea
  rationale: Hutoa maana ya kuongeza kitu juu ya maneno hayo kwa Kiswahili fasaha; kiambishi “-ya-” kinarejelea maneno.
- source_word: ἐπιθήσει ὁ θεὸς ἐπ’ αὐτὸν
  choice: Mungu atamwongezea
  rationale: 'Kurudia mzizi “ongeza” kunahifadhi ulinganifu wa kimakusudi wa kitenzi cha Kigiriki: anayeongeza, Mungu atamwongezea.'
- source_word: τὰς πληγὰς τὰς γεγραμμένας
  choice: mapigo yaliyoandikwa
  rationale: “Mapigo” linafaa kwa hukumu zinazoelezwa katika Ufunuo, huku “yaliyoandikwa” kikihifadhi hali ya mambo yaliyoandikwa na yanayodumu hivyo.
theological_decisions:
- issue: Kauli ya mwanzo ni ushuhuda au onyo
  choice: Ninamshuhudia
  alternative: Ninamwonya
  rationale: Kitenzi cha Kigiriki ni lugha ya ushuhuda; uzito wa onyo unatokana wazi na hukumu inayofuata bila kubadili ushuhuda kuwa maelezo ya kifasiri.
- issue: Ulinganifu kati ya tendo la mtu na tendo la Mungu
  choice: akiyaongezea ... Mungu atamwongezea
  alternative: akiongeza ... Mungu atamletea
  rationale: Huhifadhi marudio ya kitenzi kilekile katika chanzo na uzito wa ulinganifu wa hukumu bila kuufafanua zaidi ya maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa moja kwa moja lakini wa asili; “Ninamshuhudia” huhifadhi uzito wa lugha ya ushuhuda, na marudio ya “-ongezea” huhifadhi balagha ya chanzo.
