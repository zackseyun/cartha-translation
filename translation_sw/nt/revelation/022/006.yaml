id: REV.22.6
reference: Revelation 22:6
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ ⸀εἶπέν μοι· Οὗτοι οἱ λόγοι πιστοὶ καὶ ἀληθινοί, καὶ ⸀ὁ κύριος, ὁ θεὸς τῶν πνευμάτων τῶν προφητῶν, ἀπέστειλεν τὸν ἄγγελον αὐτοῦ δεῖξαι τοῖς δούλοις αὐτοῦ ἃ δεῖ γενέσθαι ἐν τάχει·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/006.yaml
  text: And he said to me[a], “These words are trustworthy and true, and the Lord, the God of the spirits of the prophets[b], sent his angel to show his servants what must happen soon.”
translation:
  language: sw
  text: Akaniambia, “Maneno haya ni ya kuaminika na ya kweli. Bwana, Mungu wa roho za manabii, alimtuma malaika wake kuwaonyesha watumwa wake[b] mambo ambayo lazima yatukie hivi karibuni[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa upesi.” Kirai cha Kigiriki kinaweza kusisitiza ama ukaribu wa wakati (“hivi karibuni”) au kasi ya kutokea kwa mambo hayo (“kwa upesi”).
    reason: alternative_reading
  - marker: b
    text: Au “watumishi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστοὶ
  choice: ya kuaminika
  rationale: Katika Kiswahili cha kawaida, “ya kuaminika” hueleza kwa kawaida kwamba maneno hayo yanastahili kuaminiwa na ni yenye kutegemewa.
- source_word: ἀληθινοί
  choice: ya kweli
  rationale: Hili ni neno la moja kwa moja na la asili linalodumisha dai la ukweli wa maneno hayo.
- source_word: κύριος
  choice: Bwana
  rationale: “Bwana” ni tafsiri ya kawaida ya cheo hiki cha Mungu na inadumisha uzito wake wa kibiblia.
- source_word: θεὸς τῶν πνευμάτων τῶν προφητῶν
  choice: Mungu wa roho za manabii
  rationale: Muundo huu unadumisha uhusiano wa viambishi vya Kigiriki bila kuamua kimafafanuzi ikiwa maana ni kwamba Mungu huwavuvia manabii au anatawala roho zao.
- source_word: ἄγγελον
  choice: malaika
  rationale: Muktadha wa maono katika Ufunuo unaonyesha mjumbe wa mbinguni, hivyo “malaika” inafaa kuliko “mjumbe.”
- source_word: δούλοις
  choice: watumwa
  rationale: “Watumwa” inadumisha maana ya watu walio chini ya mamlaka ya mwingine na wanaomilikiwa naye; hapa ni wale walio wa Mungu. “Watumishi” ni mbadala wa kawaida lakini dhaifu zaidi kwa upande wa hali ya kuwa mali ya bwana.
- source_word: δεῖξαι
  choice: kuwaonyesha
  rationale: Ni tafsiri ya moja kwa moja na ya asili katika muktadha wa maono.
- source_word: ἃ δεῖ γενέσθαι
  choice: mambo ambayo lazima yatukie
  rationale: Hii inadumisha ulazima unaoonyeshwa na δεῖ na kutokea kwa matukio kunakoonyeshwa na γενέσθαι.
- source_word: ἐν τάχει
  choice: hivi karibuni
  rationale: Katika muktadha huu, “hivi karibuni” huwasilisha ukaribu wa wakati kwa uwazi; uwezekano wa maana ya kutukia kwa upesi umehifadhiwa katika tanbihi.
- source_word: Καὶ εἶπέν μοι
  choice: Akaniambia
  rationale: Kiswahili huunganisha kiima kisichotajwa wazi, mtendewa, na kitenzi kwa kawaida katika neno moja. Tafsiri hii haiongezi utambulisho wa msemaji ambao Kigiriki hakijautaja katika kishazi hiki.
theological_decisions:
- issue: Maana ya ἐν τάχει katika muktadha wa matukio ya mwisho
  choice: hivi karibuni
  alternative: kwa upesi
  rationale: Kirai kinaweza kusisitiza ukaribu wa wakati au kasi ya kutokea kwa matukio. Matini kuu inatumia maana ya ukaribu, huku tanbihi ikihifadhi maana nyingine bila kumaliza mjadala wa kiteolojia.
- issue: Nguvu ya δούλοι kwa watu wa Mungu
  choice: watumwa
  alternative: watumishi
  rationale: “Watumwa” hudumisha wazo la kuwa chini ya mamlaka na kumilikiwa na Mungu, ambalo limo katika δούλοι. “Watumishi” limetajwa kama mbadala wa kawaida wa Kiswahili.
- issue: Uhusiano katika θεὸς τῶν πνευμάτων τῶν προφητῶν
  choice: Mungu wa roho za manabii
  alternative: Mungu anayewavuvia manabii
  rationale: Tafsiri rasmi kiasi inadumisha uwezekano mbalimbali wa uhusiano huo badala ya kuufanya kwa lazima kuwa kauli kuhusu uvuvio.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kimaandiko lakini kinachoeleweka kwa wasomaji wa kawaida. “Akaniambia” ni ya asili kuliko kutaja kiwakilishi cha jinsia, na “mambo ambayo lazima yatukie” huepuka mtindo wa kizamani bila kupoteza maana ya ulazima.
