  text: Λέγει ὁ μαρτυρῶν ταῦτα· Ναί· ἔρχομαι ταχύ. Ἀμήν· ⸀ἔρχου, κύριε Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/020.yaml
  text: The one who testifies to these things says[a], “Yes, I am coming soon.” Amen. Come, Lord Jesus.
translation:
  language: sw
  text: Yeye anayeshuhudia mambo haya anasema, “Ndiyo, ninakuja upesi[a].” Amina. Njoo, Bwana Yesu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ninakuja karibuni,” au “ninakuja kwa haraka.” Kielezi cha Kigiriki kinaweza kusisitiza ama ukaribu wa wakati ama kasi ya kuwasili au kutenda.
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγει
  choice: anasema
  rationale: Wakati wa sasa wa kitenzi umetafsiriwa kwa usemi wa kawaida wa Kiswahili unaotambulisha maneno yanayofuata.
- source_word: ὁ μαρτυρῶν
  choice: yeye anayeshuhudia
  rationale: Muundo huu unamtambulisha mhusika kwa tendo lake la kutoa ushuhuda, huku ukihifadhi maana ya ushahidi iliyo katika μαρτυρέω.
- source_word: ταῦτα
  choice: mambo haya
  rationale: Wingi wa kiwakilishi unaelekeza kwenye yaliyomo katika ufunuo uliotangulia.
- source_word: Ναί
  choice: Ndiyo
  rationale: Ni jibu la moja kwa moja la kuthibitisha bila kuongeza uzito wa maana usio lazima.
- source_word: ἔρχομαι
  choice: ninakuja
  rationale: Wakati wa sasa wenye mwelekeo wa wakati ujao unaelezwa kwa kawaida na kwa uwazi katika Kiswahili kwa “ninakuja.”
- source_word: ταχύ
  choice: upesi
  rationale: “Upesi” ni neno la Kiswahili linaloweza kueleweka kuwa baada ya muda mfupi au kwa mwendo wa haraka, hivyo linadumisha kwa kiasi fulani upeo wa maana ya Kigiriki; tanbihi inaeleza utata huo wazi.
- source_word: Ἀμήν
  choice: Amina
  rationale: Umbo lililozoeleka katika Kiswahili linahifadhi jibu la kukubali na sauti ya kiliturujia.
- source_word: ἔρχου
  choice: Njoo
  rationale: Amri ya nafsi ya pili umoja imetolewa kwa ufupi na kwa msisitizo wa ombi la moja kwa moja.
- source_word: κύριε
  choice: Bwana
  rationale: Cheo hiki cha heshima kwa Yesu kinatafsiriwa kwa neno la kawaida la Agano Jipya la Kiswahili.
- source_word: Ἰησοῦ
  choice: Yesu
  rationale: Jina limetolewa kwa umbo lake la kawaida katika Kiswahili.
theological_decisions:
- issue: Maana ya ταχύ katika ahadi ya kuja kwa Kristo
  choice: upesi
  alternative: karibuni; kwa haraka
  rationale: Kielezi hiki kinaweza kusisitiza ukaribu wa wakati au kasi ya kuwasili na kutenda. “Upesi” ni tafsiri asilia inayoruhusu vivuli vyote kwa kiasi fulani, na tanbihi inahifadhi wazi mvutano muhimu wa kieskatolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na rahisi kueleweka. Muundo mfupi na wa dharura wa mazungumzo ya mwisho umehifadhiwa.
