  yaml_path: translation/nt/revelation/022/021.yaml
  text: The grace of the Lord Jesus be with all[a].
translation:
  language: sw
  text: Neema ya Bwana Yesu iwe pamoja na wote.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati zina, “Neema ya Bwana Yesu iwe pamoja na watakatifu wote,” na nyingine, “iwe pamoja nanyi nyote.”
    reason: textual_variant
lexical_decisions:
- source_word: χάρις
  choice: neema
  rationale: Neno la kawaida na lenye hadhi katika Kiswahili cha Biblia kwa χάρις; hapa linafaa katika baraka ya kumalizia na kuhifadhi maana ya fadhili ya Mungu bila ufafanuzi wa ziada.
- source_word: κυρίου
  choice: Bwana
  rationale: Huhifadhi κύριος kama cheo cha Kikristo kinachomhusu Yesu na ni matumizi ya kawaida katika Kiswahili sanifu.
- source_word: Ἰησοῦ
  choice: Yesu
  rationale: Jina hili linatolewa kwa umbo lake lililozoeleka katika Kiswahili.
- source_word: μετὰ
  choice: iwe pamoja na
  rationale: Kigiriki hakina kitenzi kilichoandikwa, lakini Kiswahili cha baraka huhitaji kitenzi; 'iwe pamoja na' ni nyongeza ndogo inayodokezwa na muundo huo.
- source_word: πάντων
  choice: wote
  rationale: Huhifadhi upana wa neno la Kigiriki bila kuongeza 'ninyi' wala 'watakatifu,' maneno ambayo hayamo katika usomaji wa SBLGNT.
theological_decisions:
- issue: Iwapo watajwe wazi wanaopokea baraka
  choice: wote
  alternative: ninyi nyote; watakatifu wote
  rationale: Usomaji uliotolewa una πάντων pekee, yaani 'wote.' Tafsiri haibainishi kundi ambalo matini hii haijalitaja, hivyo inadumisha upana na utata halisi wa kauli.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo mfupi, wa heshima, na wa kawaida kwa baraka ya kumalizia. Alama ya tanbihi [a] imewekwa katika matini kuu.
