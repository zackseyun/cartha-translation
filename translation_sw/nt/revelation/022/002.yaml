id: REV.22.2
reference: Revelation 22:2
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐν μέσῳ τῆς πλατείας αὐτῆς· καὶ τοῦ ποταμοῦ ἐντεῦθεν καὶ ἐκεῖθεν ξύλον ζωῆς ποιοῦν καρποὺς δώδεκα, κατὰ μῆνα ἕκαστον ⸀ἀποδιδοῦν τὸν καρπὸν αὐτοῦ, καὶ τὰ φύλλα τοῦ ξύλου εἰς θεραπείαν τῶν ἐθνῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/002.yaml
  text: in the middle of its street[a], and on this side and on that side of the river, was the tree of life, bearing twelve fruits, yielding its fruit each month[c][b]. And the leaves of the tree are for the healing of the nations.
translation:
  language: sw
  text: Katikati ya barabara yake[a], na upande huu na upande ule wa mto, ulikuwapo mti wa uzima, ukizaa matunda kumi na mawili[b] na kutoa tunda lake kila mwezi.[c] Majani ya mti huo ni kwa ajili ya uponyaji wa mataifa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki kina mpangilio uliobanwa, na kinaweza pia kueleweka kuwa mti ulikuwa “kandokando ya mto, upande huu na upande ule.”
    reason: syntactical_alternative
  - marker: b
    text: Au, “ukizaa aina kumi na mbili za matunda.” Usemi huo unaweza kumaanisha aina kumi na mbili au mzunguko kamili na mwingi wa kuzaa matunda.
    reason: lexical_alternative
  - marker: c
    text: Taswira hii inatoa mwangwi wa mti wa uzima katika Mwanzo 2:9 na wa miti katika Ezekieli 47:12.
    reason: cross_reference
lexical_decisions:
- source_word: ἐν μέσῳ
  choice: katikati ya
  rationale: Huhifadhi maana ya mahali kwa Kiswahili cha kawaida na cha moja kwa moja.
- source_word: πλατείας
  choice: barabara
  rationale: Neno linaweza kumaanisha barabara pana au eneo la wazi la umma; “barabara” linaendana kwa kawaida na taswira ya mji bila kulazimisha maana ya uwanja.
- source_word: ἐντεῦθεν καὶ ἐκεῖθεν
  choice: upande huu na upande ule
  rationale: Hufuata kwa karibu usemi wa Kigiriki na kuhifadhi mgawanyo wa mahali bila kusawazisha taswira kuwa “pande zote mbili.”
- source_word: ξύλον ζωῆς
  choice: mti wa uzima
  rationale: Ingawa ξύλον inaweza kumaanisha mti au kuni, muktadha wa Mwanzo na Ufunuo unaelekeza wazi kwenye mti unaojulikana kama mti wa uzima.
- source_word: ποιοῦν καρποὺς δώδεκα
  choice: ukizaa matunda kumi na mawili
  rationale: “Kuzaa matunda” ni usemi wa kawaida wa kilimo. Tafsiri haiongezi neno “aina,” ambalo halipo wazi katika Kigiriki, hivyo inaacha uwezekano wa mazao, matunda, au aina kumi na mbili.
- source_word: κατὰ μῆνα ἕκαστον
  choice: kila mwezi
  rationale: Ni tafsiri fupi na ya kawaida ya usemi wa mgawanyo unaoonyesha kurudiwa kila mwezi.
- source_word: ἀποδιδοῦν τὸν καρπὸν αὐτοῦ
  choice: kutoa tunda lake
  rationale: Huhifadhi umoja wa τὸν καρπόν na maana ya mti kutoa mazao yake, kwa Kiswahili kinachoeleweka kwa urahisi.
- source_word: τὰ φύλλα τοῦ ξύλου
  choice: majani ya mti huo
  rationale: Ni usemi wa kawaida wa kibotania; “huo” humrejelea kwa uwazi mti wa uzima uliotajwa.
- source_word: εἰς θεραπείαν
  choice: kwa ajili ya kuyaponya
  rationale: Huwasilisha kusudi la εἰς na maana ya θεραπεία kama kuponya au kurejesha afya kwa Kiswahili cha kawaida.
- source_word: τῶν ἐθνῶν
  choice: mataifa
  rationale: Katika Ufunuo, ἔθνη hapa ina upeo mpana wa mataifa au jamii za dunia, si lazima watu wasio Wayahudi pekee.
theological_decisions:
- issue: Mvutano wa kisintaksia kuhusu mahali mti ulipo kuhusiana na barabara na mto
  choice: Taswira imeachwa ikiwa na mti mmoja wa uzima, unaohusishwa na katikati ya barabara na upande huu na upande ule wa mto.
  alternative: Kutafsiri “miti ya uzima” kwa wingi, au kupanga upya sentensi ili kusema wazi kuwa mti uko kwenye pande zote mbili za mto.
  rationale: Kigiriki kina taswira ya kinabii iliyobanwa na isiyo rahisi kijiografia. Umoja wa “mti” huheshimu maandishi yaliyopokelewa na mwangwi wa Mwanzo bila kutatua kwa lazima mvutano wa taswira.
- issue: Maana ya “matunda kumi na mawili”
  choice: Kutotaja wazi “aina” kumi na mbili.
  alternative: “Aina kumi na mbili za matunda.”
  rationale: Kigiriki kinasema καρποὺς δώδεκα, yaani “matunda kumi na mawili,” na kinaweza kudokeza aina, mazao, au mzunguko kamili wa kuzaa. Tafsiri imehifadhi upana huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imehifadhi mpangilio wa mahali na fumbo la taswira ya Kigiriki, huku ikitumia maneno ya kawaida kama “barabara,” “ukizaa,” na “kila mwezi.”
