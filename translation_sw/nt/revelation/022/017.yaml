base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/017.yaml
  text: And the Spirit and the bride say[a], “Come.” And let the one who hears say, “Come.” And let the one who is thirsty come[c][b]; let the one who desires take the water of life freely.
translation:
  language: sw
  text: Roho na bibi-arusi wanasema, “Njoo.” Naye anayesikia aseme, “Njoo.” Mwenye kiu na aje; naye anayetaka achukue maji ya uzima bure[a].[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “bila malipo” au “kama zawadi.”
    reason: lexical_alternative
  - marker: b
    text: Miito miwili ya kwanza, “Njoo,” mara nyingi hueleweka kuwa ombi la Bwana aje; kisha mwenye kiu anaalikwa kuja, na anayetaka anaagizwa kuchukua maji ya uzima.
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ πνεῦμα
  choice: Roho
  rationale: Katika muktadha wa Ufunuo, nomino yenye kibainishi inamrejelea kwa kawaida Roho Mtakatifu; herufi kubwa inaonyesha rejeleo hilo bila kuongeza neno lisilokuwapo katika Kigiriki.
- source_word: ἡ νύμφη
  choice: bibi-arusi
  rationale: Huhifadhi taswira ya νύμφη bila kuifafanua moja kwa moja kuwa kanisa, watu wa Mungu, au Yerusalemu Mpya.
- source_word: λέγουσιν
  choice: wanasema
  rationale: Wakati uliopo wa Kigiriki umetafsiriwa kwa wakati uliopo wa kawaida na wa asili katika Kiswahili.
- source_word: Ἔρχου
  choice: Njoo
  rationale: Amri ya nafsi ya pili imewasilishwa moja kwa moja, bila kumtaja anayeambiwa kwa kuwa matini yenyewe haimtaji wazi.
- source_word: ὁ ἀκούων
  choice: anayesikia
  rationale: Muundo huu wa kawaida wa Kiswahili unawakilisha kishiriki chenye kibainishi na unabaki wa kijumla.
- source_word: εἰπάτω
  choice: na aseme
  rationale: Muundo wa 'na' pamoja na kiima cha utegemezi huwasilisha kwa asili amri ya nafsi ya tatu.
- source_word: ὁ διψῶν
  choice: mwenye kiu
  rationale: Ni usemi wa asili unaohifadhi sitiari ya kiu na hali ya uhitaji.
- source_word: ἐρχέσθω
  choice: na aje
  rationale: Huwasilisha mwaliko au amri ya nafsi ya tatu bila kuufanya mkali kupita kiasi.
- source_word: ὁ θέλων
  choice: yeyote anayetaka
  rationale: Huwasilisha utashi au tamaa ya θέλω bila kuongeza kiwakilishi cha kitu ambacho hakimo wazi katika Kigiriki.
- source_word: λαβέτω
  choice: na achukue
  rationale: Huhifadhi maana ya msingi ya kuchukua, inayofaa taswira ya maji yanayotolewa kwa uhuru; 'apokee' pia ingewezekana.
- source_word: ὕδωρ ζωῆς
  choice: maji ya uzima
  rationale: Hufuata muundo wa uhusiano wa Kigiriki na istilahi iliyozoeleka ya Kiyohana, badala ya kubadili kuwa 'maji yaliyo hai.'
- source_word: δωρεάν
  choice: bure
  rationale: Neno hili la kawaida la Kiswahili huonyesha wazi kwamba maji yanapatikana bila malipo, yaani kama zawadi.
theological_decisions:
- issue: Anayeambiwa “Njoo” katika miito miwili ya kwanza
  choice: Matini haimtaji wazi; miito imeachwa wazi kama ilivyo katika Kigiriki.
  alternative: Kumtaja Yesu au Bwana moja kwa moja, au kuelewa miito yote kuwa mwaliko kwa wenye kiu.
  rationale: Miito miwili ya kwanza ni amri za nafsi ya pili, kisha matini inahamia amri za nafsi ya tatu kwa mwenye kiu na anayetaka. Kutotaja anayeambiwa kunahifadhi uwezekano wenye tabaka na mvutano wa matini.
- issue: Rejeleo la mfano la “bibi-arusi”
  choice: Taswira ya bibi-arusi imehifadhiwa katika matini kuu.
  alternative: kanisa; watu wa Mungu; Yerusalemu Mpya
  rationale: Ufunuo unaunganisha taswira hizi kwa namna yenye tabaka; kuzibadilisha kuwa ufafanuzi mmoja kungeondoa upana wa mfano.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa kurudiwa kwa “Njoo” na mfuatano wa amri umehifadhiwa. Alama za tanbihi [a] na [b] zimewekwa baada ya kishazi kinachohusika ili kuepuka kukatiza mwaliko wa mwisho.
