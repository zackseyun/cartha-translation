id: REV.22.14
reference: Revelation 22:14
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Μακάριοι οἱ ⸂πλύνοντες τὰς στολὰς αὐτῶν⸃, ἵνα ἔσται ἡ ἐξουσία αὐτῶν ἐπὶ τὸ ξύλον τῆς ζωῆς καὶ τοῖς πυλῶσιν εἰσέλθωσιν εἰς τὴν πόλιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/014.yaml
  text: Blessed are those who wash their robes[c][b][a], so that they may have the right to the tree of life and may enter the city by the gates.
translation:
  language: sw
  text: Heri wale wanaofua mavazi yao[a][b], ili wawe na haki ya kuufikia mti wa uzima, na waingie mjini kwa malango[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati zina, “Heri wale wanaozitekeleza amri zake,” au “wanaozishika amri zake,” badala ya “wanaofua mavazi yao.”
    reason: textual_variant
  - marker: b
    text: Picha ya kufua mavazi inaakisi Ufunuo 7:14, ambako mavazi yanafuliwa na kufanywa meupe katika damu ya Mwana-kondoo.
    reason: cross_reference
  - marker: c
    text: Au, “kupitia malango.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Μακάριοι
  choice: Heri
  rationale: Ni usemi wa kawaida wa baraka katika Kiswahili cha Biblia; una uzito wa kiagano na wa wakati wa mwisho kuliko ‘wenye furaha.’
- source_word: πλύνοντες
  choice: wanaofua
  rationale: Kitenzi hiki kinadumisha picha halisi ya kufua mavazi na kinaonyesha watu wanaotambulishwa na tendo hilo, bila kuongeza tafsiri ya kitheolojia.
- source_word: στολὰς
  choice: mavazi
  rationale: ‘Mavazi’ ni neno la kawaida, lenye heshima, linalofaa kwa vazi la mfano katika maono; halibani maana kwa aina maalumu ya joho.
- source_word: ἵνα
  choice: ili
  rationale: Kinaonyesha kwa uwazi uhusiano wa kusudi au matokeo unaotolewa na kifungu cha Kigiriki.
- source_word: ἔσται ἡ ἐξουσία αὐτῶν
  choice: wawe na haki
  rationale: Katika muktadha huu ἐξουσία ni ruhusa au haki ya kufikia, si mamlaka ya kutawala; muundo huu ni wa kawaida katika Kiswahili.
- source_word: ἐπὶ τὸ ξύλον τῆς ζωῆς
  choice: ya kuufikia mti wa uzima
  rationale: ‘Kuufikia’ huwasilisha haki ya kufika kwenye mti bila kudokeza kuitawala wala kuongeza wazo la kula ambalo halijasemwa katika mstari huu.
- source_word: τοῖς πυλῶσιν
  choice: kwa malango
  rationale: Huhifadhi muundo mfupi wa hali ya kuingilia au njia ya kuingia; ‘kupitia malango’ ni uwezekano mwingine wa wazi zaidi.
- source_word: εἰσέλθωσιν εἰς τὴν πόλιν
  choice: waingie mjini
  rationale: Ni Kiswahili cha kawaida na chenye hadhi kwa kuingia ndani ya mji, huku hali ya utegemezi baada ya ἵνα ikidumishwa kwa ‘waingie.’
theological_decisions:
- issue: Tofauti ya maandishi katika kishazi cha kwanza
  choice: Kutafsiri maandishi ya SBLGNT, ‘wale wanaofua mavazi yao.’
  alternative: ‘wale wanaozitekeleza amri zake’ au ‘wale wanaozishika amri zake’
  rationale: Chanzo kilichotolewa kina πλύνοντες τὰς στολὰς αὐτῶν. Tofauti maarufu kuhusu amri imehifadhiwa katika tanbihi badala ya kubadilisha maandishi ya msingi.
- issue: Uhusiano kati ya kufua mavazi na kuufikia mti wa uzima
  choice: Kudumisha uhusiano unaotajwa na mstari bila kufafanua utaratibu wa kitheolojia.
  alternative: Kueleza tendo hilo moja kwa moja kuwa tendo la kustahili, au kuongeza katika maandishi kwamba mavazi yanafuliwa katika damu ya Mwana-kondoo.
  rationale: Mstari wenyewe hauielezi njia hiyo kikamilifu. Tafsiri inahifadhi mvutano huo, huku tanbihi ikionyesha mwangwi wa Ufunuo 7:14.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Heri’ hudumisha mtindo wa tamko la baraka; ‘wanaofua mavazi yao’ ni halisi na rahisi kueleweka; na muundo wa sentensi hauongezi ufafanuzi wa kimadhehebu.
