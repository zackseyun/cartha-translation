id: REV.22.19
reference: Revelation 22:19
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἐάν τις ἀφέλῃ ἀπὸ τῶν λόγων τοῦ βιβλίου τῆς προφητείας ταύτης, ⸀ἀφελεῖ ὁ θεὸς τὸ μέρος αὐτοῦ ἀπὸ τοῦ ξύλου τῆς ζωῆς καὶ ἐκ τῆς πόλεως τῆς ἁγίας, τῶν γεγραμμένων ἐν τῷ βιβλίῳ τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/019.yaml
  text: and if anyone takes away from the words of the book of this prophecy[a], God will take away his share from the tree of life and from the holy city, which are written in this book.
translation:
  language: sw
  text: Na mtu yeyote akiondoa katika maneno ya kitabu cha unabii huu, Mungu ataiondoa sehemu yake kutoka katika mti wa uzima[a] na kutoka katika mji mtakatifu, ambayo yameandikwa katika kitabu hiki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati zina “kitabu cha uzima” badala ya “mti wa uzima.”
    reason: textual_variant
lexical_decisions:
- source_word: ἀφέλῃ / ἀφελεῖ
  choice: akiondoa / atamwondolea
  rationale: Muundo huu unahifadhi ulinganifu wa kimakusudi kati ya kitendo cha mtu kuondoa na hatua ya Mungu ya kumwondolea. 'Akiondoa' pia huwasilisha sharti la ἐάν pamoja na aoristi tegemezi.
- source_word: λόγων
  choice: maneno
  rationale: '''Maneno'' ni tafsiri ya moja kwa moja na ya kawaida kwa yaliyomo katika unabii, na inafaa kwa onyo kuhusu kubadili maandishi.'
- source_word: βιβλίου
  choice: kitabu
  rationale: '''Kitabu'' ni neno la kawaida na linaloeleweka sasa; ingawa βιβλίον yaweza kumaanisha hati-kunjo, hapa si lazima kubainisha umbo la kitu hicho.'
- source_word: προφητείας
  choice: unabii
  rationale: '''Unabii'' huhifadhi aina na uzito wa ujumbe bila kuongeza ufafanuzi usiomo katika chanzo.'
- source_word: μέρος
  choice: fungu
  rationale: '''Fungu'' huonyesha sehemu anayostahili au ushiriki aliopewa, maana inayofaa zaidi hapa kuliko ''sehemu'' ya kitu kwa ujumla.'
- source_word: ξύλου τῆς ζωῆς
  choice: mti wa uzima
  rationale: Katika muktadha wa Ufunuo 22, ξύλον humaanisha mti wa uzima; 'uzima' huhifadhi mtindo wa kibiblia ulio wa kawaida na wenye hadhi.
- source_word: πόλεως τῆς ἁγίας
  choice: mji mtakatifu
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya jina hili la kiapokaliptiki.
- source_word: τῶν γεγραμμένων ἐν τῷ βιβλίῳ τούτῳ
  choice: ambavyo vimeandikwa katika kitabu hiki
  rationale: Wingi wa 'ambavyo' unaunganisha kirai na mti wa uzima pamoja na mji mtakatifu, huku 'vimeandikwa' ikihifadhi hali timilifu ya tendo la kuandika.
theological_decisions:
- issue: Tofauti ya maandishi kati ya 'mti wa uzima' na 'kitabu cha uzima'
  choice: mti wa uzima
  alternative: kitabu cha uzima
  rationale: SBLGNT ina ξύλου τῆς ζωῆς, 'mti wa uzima,' usomaji unaoungwa mkono na matoleo hakiki na unaolingana na muktadha wa karibu wa Ufunuo 22. Usomaji mwingine unaojulikana umewekwa katika tanbihi badala ya kuingizwa katika matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Mtu yeyote' ni ya kawaida na jumuishi; 'fungu lake' huwasilisha ushiriki au urithi bila kuamua zaidi maana ya kitheolojia. Alama ya tanbihi imewekwa mara tu baada ya 'mti wa uzima' ili ionyeshe wazi mahali pa tofauti ya maandishi.
source_grounding:
  english_pob_role: consult_only
