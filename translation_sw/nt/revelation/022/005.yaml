base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/005.yaml
  text: And night will be no more[a], and they will have no need of lamplight or sunlight, because the Lord God will shine on them[b], and they will reign forever and ever.
translation:
  language: sw
  text: Na usiku hautakuwapo tena. Hawatahitaji nuru ya taa wala nuru ya jua, kwa maana Bwana Mungu atawaangazia, nao watatawala milele na milele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa karibu zaidi, Kiyunani: “kwa nyakati za nyakati,” nahau inayomaanisha muda usio na mwisho.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νὺξ οὐκ ἔσται ἔτι
  choice: usiku hautakuwapo tena
  rationale: Huwasilisha kwa kawaida na kwa uzito wazo la kwamba usiku hautakuwapo tena.
- source_word: οὐκ ἔχουσιν χρείαν
  choice: hawahitaji
  rationale: Wakati uliopo wa Kiyunani umehifadhiwa katika maelezo haya ya kinabii; Kiswahili kinaweza kuutumia kwa kawaida katikati ya vitenzi vinavyoelekeza wakati ujao.
- source_word: φωτὸς λύχνου καὶ φῶς ἡλίου
  choice: nuru ya taa wala mwanga wa jua
  rationale: Katika sentensi kanushi, “wala” huonyesha kwa kawaida kwamba hakuna mojawapo ya vyanzo hivyo viwili vya mwanga inayohitajika.
- source_word: κύριος ὁ θεός
  choice: Bwana Mungu
  rationale: Hili ndilo jina la heshima la kawaida na linaloeleweka vizuri katika Kiswahili.
- source_word: φωτίσει ἐπ’ αὐτούς
  choice: atawaangazia
  rationale: Huhifadhi taswira ya nuru ya Mungu inayowaelekea na kuwaangazia watu wake.
- source_word: βασιλεύσουσιν
  choice: watatawala
  rationale: Hutoa maana ya kutawala bila kuongeza maelezo yasiyotajwa wazi kuhusu cheo chao.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: milele na milele
  rationale: Ni nahau ya Kiswahili ya muda usio na mwisho na inalingana na msisitizo wa usemi wa Kiyunani.
theological_decisions:
- issue: Wakati wa οὐκ ἔχουσιν χρείαν katika maono yanayohusu wakati ujao
  choice: hawahitaji
  alternative: hawatahitaji
  rationale: Kiyunani hutumia wakati uliopo ingawa vitenzi vinavyoizunguka vinaelekeza wakati ujao. Kiswahili cha maelezo ya kinabii kinaweza kuhifadhi badiliko hilo bila kufanya sentensi isiwe ya kawaida.
- issue: Maana ya φωτίσει ἐπ’ αὐτούς
  choice: atawaangazia
  alternative: atawapa nuru
  rationale: Chaguo hili huhifadhi mwelekeo wa nuru kuwa juu yao bila kuamua zaidi ya maandishi kama nuru hiyo inapaswa kufafanuliwa kwa namna nyingine ya kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Mgawanyo wa sentensi huepuka mfululizo mzito bila kupoteza viunganishi vya wazo. Alama ya tanbihi imewekwa baada ya kifungu kinachoifafanua.
