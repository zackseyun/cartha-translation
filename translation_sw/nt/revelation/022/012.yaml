  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἰδοὺ ἔρχομαι ταχύ, καὶ ὁ μισθός μου μετ’ ἐμοῦ, ἀποδοῦναι ἑκάστῳ ὡς τὸ ἔργον ⸀ἐστὶν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/012.yaml
  text: Behold[a], I am coming soon, and my reward is with me, to repay each one according to what his work is.
translation:
  language: sw
  text: Tazama, ninakuja karibuni[a], na thawabu yangu iko pamoja nami, ili nimlipe kila mmoja kulingana na jinsi kazi yake ilivyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ninakuja kwa haraka.” Neno la Kigiriki ταχύ linaweza kusisitiza ama ukaribu wa wakati (“karibuni”) au kasi na hali ya kuja ghafula (“kwa haraka”).
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Tazama
  rationale: Ni neno la kuvuta fikira linalofaa katika unabii na ufunuo; linadumisha uzito wa kauli huku likieleweka kwa urahisi katika Kiswahili cha sasa.
- source_word: ἔρχομαι
  choice: ninakuja
  rationale: Wakati uliopo wa Kigiriki unaelekeza kwenye kuja kunakotarajiwa; “ninakuja” ni usemi wa kawaida na wa moja kwa moja katika Kiswahili.
- source_word: ταχύ
  choice: karibuni
  rationale: Katika muktadha huu linaweza kuonyesha ukaribu wa wakati au kasi ya kuja. “Karibuni” linaweka maana ya ukaribu katika matini kuu, huku maana ya “kwa haraka” ikihifadhiwa katika tanbihi.
- source_word: ὁ μισθός μου
  choice: thawabu yangu
  rationale: μισθός inaweza kumaanisha malipo, ujira, au thawabu. “Thawabu” linafaa kwa muktadha wa hukumu na malipo ya Mungu bila kuifanya kauli isikike kama shughuli ya kibiashara.
- source_word: μετ’ ἐμοῦ
  choice: iko pamoja nami
  rationale: Kitenzi cha kuwa hakijaandikwa wazi katika kishazi cha Kigiriki lakini kinaeleweka; “iko pamoja nami” kinakamilisha wazo kwa Kiswahili cha kawaida.
- source_word: ἀποδοῦναι
  choice: ili nimlipe
  rationale: 'Kitenzi-jina kinaonyesha kusudi la kuja kwake: kumpa kila mmoja malipo yanayolingana na kazi yake. “Nimlipe” kinadumisha wazo la kutoa malipo yanayostahili.'
- source_word: ἑκάστῳ
  choice: kila mmoja
  rationale: Linahifadhi maana ya ugawaji kwa mtu mmoja mmoja na hivyo uwajibikaji wa kila mtu.
- source_word: ὡς
  choice: kulingana na
  rationale: Hutambulisha kipimo au msingi wa malipo; “kulingana na” ni sahihi na ya kawaida katika Kiswahili.
- source_word: τὸ ἔργον ἐστὶν αὐτοῦ
  choice: kazi yake
  rationale: Linahifadhi nomino ἔργον kama “kazi.” Muundo kamili wa neno kwa neno, “kama kazi yake ilivyo,” ungekuwa mzito; maana ya ἐστὶν imewasilishwa kwa kawaida ndani ya “kulingana na kazi yake.”
theological_decisions:
- issue: Uwakilishi wa kijinsia katika ἑκάστῳ ... αὐτοῦ
  choice: kila mmoja ... kazi yake
  alternative: kila mtu ... matendo yake
  rationale: Kigiriki kina maumbo ya umoja wa kiume yenye matumizi wakilishi. Kiswahili hakilazimishi jinsia katika “kila mmoja” na “yake,” hivyo tafsiri hii inahifadhi umoja na uwajibikaji wa mtu binafsi bila kuongeza jinsia ambayo sarufi ya Kiswahili haiihitaji.
- issue: Asili ya lugha ya malipo
  choice: thawabu ... ili nimlipe kila mmoja kulingana na kazi yake
  alternative: ujira ... kumpa kila mmoja kulingana na matendo yake
  rationale: Tafsiri inadumisha kauli kwamba malipo yanahusiana na kazi ya kila mmoja, bila kuingiza hitimisho la kimadhehebu kuhusu msingi wa wokovu wa mwisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa heshima, wa kinabii, na unaoeleweka kwa msomaji wa kawaida. “Tazama” linadumisha uzito wa ufunuo, huku sentensi nyingine ikitumia muundo wa sasa na wa kawaida.
