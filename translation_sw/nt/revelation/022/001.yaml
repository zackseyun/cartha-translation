reference: Revelation 22:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ ἔδειξέν μοι ⸀ποταμὸν ὕδατος ζωῆς λαμπρὸν ὡς κρύσταλλον, ἐκπορευόμενον ἐκ τοῦ θρόνου τοῦ θεοῦ καὶ τοῦ ἀρνίου
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/001.yaml
  text: And he showed me a river of the water of life[a], bright as crystal[b], flowing out from the throne of God and of the Lamb.
translation:
  language: sw
  text: Kisha akanionyesha mto wa maji ya uzima, wenye kung’aa kama kristali, ukitiririka kutoka katika kiti cha enzi cha Mungu na cha Mwanakondoo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔδειξέν μοι
  choice: akanionyesha
  rationale: Kitenzi cha wakati uliopita pamoja na yambwa ‘mimi’ kimetafsiriwa kwa njia ya kawaida ya Kiswahili; ‘aka-’ kinaendeleza mfululizo wa maono bila kuongeza wazo la ufunuo lisiloelezwa wazi.
- source_word: ποταμὸν ὕδατος ζωῆς
  choice: mto wa maji ya uzima
  rationale: Muundo wa viambishi umedumishwa ili kuhifadhi taswira ya kibiblia ya ‘maji ya uzima’ bila kuifafanua kuwa maji yanayotoa uzima.
- source_word: λαμπρὸν
  choice: wenye kung’aa
  rationale: λαμπρός hapa hudokeza uangavu au mng’ao; ‘kung’aa’ ni Kiswahili cha sasa na cha kawaida kuliko tafsiri inayosisitiza uwazi pekee.
- source_word: ὡς κρύσταλλον
  choice: kama kioo cha thamani
  rationale: ὡς ni kiashiria cha ulinganisho. ‘Kioo cha thamani’ kinaeleza κρύσταλλος kwa Kiswahili kinachoeleweka na kuzuia kuchanganya na kioo cha kawaida, huku kikihifadhi taswira ya kitu chenye kung’aa kama kristali.
- source_word: ἐκπορευόμενον
  choice: ukitiririka kutoka
  rationale: Kauli ya wakati wa sasa inayoeleza mto imetolewa kwa ‘ukitiririka,’ neno la kawaida na lenye picha hai kwa mwendo wa mto.
- source_word: ἐκ τοῦ θρόνου
  choice: kutoka katika kiti cha enzi
  rationale: ἐκ huonyesha chanzo; ‘kutoka katika’ huwasilisha kwa kawaida kwamba mto unatoka kwenye kiti cha enzi.
- source_word: τοῦ θεοῦ καὶ τοῦ ἀρνίου
  choice: cha Mungu na cha Mwanakondoo
  rationale: Viambishi vyote viwili vimehifadhiwa, na ἀρνίον imetafsiriwa kama cheo ‘Mwanakondoo,’ taswira kuu ya Kikristo katika Ufunuo.
theological_decisions:
- issue: Kiti kimoja cha enzi cha Mungu na Mwanakondoo
  choice: kiti cha enzi cha Mungu na cha Mwanakondoo
  alternative: viti vya enzi vya Mungu na Mwanakondoo
  rationale: Kigiriki kina nomino ya umoja ‘kiti cha enzi’ ikifuatiwa na viambishi viwili vilivyounganishwa. Tafsiri inadumisha kiti kimoja bila kufafanua zaidi namna kinavyohusiana na Mungu na Mwanakondoo; kutumia wingi kungepingana na umbo la chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo umewekwa wa asili bila kuwa mgumu; taswira za ‘maji ya uzima,’ ‘kiti cha enzi,’ na ‘Mwanakondoo’ zimehifadhiwa.
