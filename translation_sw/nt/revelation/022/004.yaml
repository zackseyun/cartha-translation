  yaml_path: translation/nt/revelation/022/004.yaml
  text: and they will see his face[b][a], and his name will be on their foreheads.
translation:
  language: sw
  text: Nao watauona uso wake[b][a], na jina lake litakuwa kwenye vipaji vyao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watautazama uso wake.”
    reason: lexical_alternative
  - marker: b
    text: Viwakilishi vya umoja “wake” na “lake” vinaweza kumrejelea Mungu, au vinaweza kuakisi utawala wa kiungu unaoshirikiwa na Mungu na Mwanakondoo katika muktadha wa karibu.
    reason: alternative_reading
lexical_decisions:
- source_word: ὄψονται
  choice: watauona
  rationale: Kitenzi hiki ni wakati ujao wa ὁράω na hapa kina maana ya kawaida ya kuona. “Watauona” ni Kiswahili cha sasa na cha asili; “watautazama” ni uwezekano mwingine wenye mkazo zaidi.
- source_word: πρόσωπον
  choice: uso
  rationale: Maana ya msingi hapa ni “uso.” Muundo wa “kuuona uso” huhifadhi nguvu ya kuona na ya uhusiano iliyo katika Kigiriki kuliko tafsiri pana ya “kuwapo.”
- source_word: ὄνομα
  choice: jina
  rationale: “Jina” ni tafsiri ya moja kwa moja. Linaweza kudokeza utambulisho, umiliki au tabia, lakini tafsiri haiongezi maana hizo ndani ya matini.
- source_word: ἐπὶ τῶν μετώπων αὐτῶν
  choice: kwenye vipaji vya nyuso zao
  rationale: ἐπί pamoja na hali ya genitivi huonyesha mahali kitu kilipo. “Kwenye vipaji vya nyuso zao” ni usemi wa kawaida wa Kiswahili na huhifadhi wingi wa μετώπων.
- source_word: καὶ
  choice: na / nao
  rationale: Viunganishi vyote viwili vinahifadhi uratibu wa kuongezea wa Kigiriki; “nao” mwanzoni huunganisha sentensi hii kwa kawaida na muktadha uliotangulia.
- source_word: αὐτοῦ
  choice: wake / lake
  rationale: Viwakilishi vinatafsiriwa moja kwa moja bila kubadilishwa kuwa “wa Mungu” au “la Mungu,” hivyo rejeleo lake linaachwa liamuliwe na muktadha kama katika Kigiriki.
theological_decisions:
- issue: Rejeleo la viwakilishi vya umoja katika “uso wake” na “jina lake”
  choice: Kuhifadhi viwakilishi vya umoja bila kutaja anayerejelewa kwa jina.
  alternative: Kusema wazi “uso wa Mungu” na “jina la Mungu,” au kuhusisha usemi huo na Mungu na Mwanakondoo katika utawala wao wa pamoja.
  rationale: Muktadha wa karibu unawataja Mungu na Mwanakondoo kwa uhusiano wa karibu (hasa Ufunuo 22:3). Viwakilishi vya umoja katika mstari huu havipaswi kufafanuliwa kwa namna nyembamba kuliko Kigiriki; kuvihifadhi hudumisha utata halisi na mvutano wa kiteolojia wa matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Vipaji vya nyuso” limetumiwa kwa maana ya sehemu za mbele za vichwa, na alama zote za tanbihi zimewekwa mara baada ya “uso wake,” kwa kufuata uhusiano wao na kirai hicho huku tanbihi [b] ikihusu pia “jina lake.”
