id: REV.22.8
reference: Revelation 22:8
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Κἀγὼ Ἰωάννης ὁ ἀκούων καὶ βλέπων ταῦτα. καὶ ὅτε ἤκουσα καὶ ἔβλεψα, ἔπεσα προσκυνῆσαι ἔμπροσθεν τῶν ποδῶν τοῦ ἀγγέλου τοῦ δεικνύοντός μοι ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/008.yaml
  text: And I[a], John, am the one hearing and seeing these things. And when I heard and saw, I fell down to worship before the feet of the angel who was showing me these things.
translation:
  language: sw
  text: Nami, Yohana, ndiye ninayesikia na kuyaona mambo haya. Na niliposikia na kuona, nilianguka ili kuabudu[a] mbele ya miguu ya malaika aliyekuwa akinionesha mambo haya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kuinama mbele ya” au “kutoa heshima.” Kitenzi cha Kigiriki kinaweza kumaanisha tendo la kujitupa chini au kuonyesha heshima; hapa kimetafsiriwa “kuabudu” kwa sababu ya matumizi yake ya kawaida katika Ufunuo na kwa sababu ya karipio linalofuata.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κἀγὼ
  choice: Nami
  rationale: Huhifadhi kiunganishi καί pamoja na msisitizo wa kiwakilishi ἐγώ kwa Kiswahili cha kawaida na chenye mtiririko.
- source_word: Ἰωάννης
  choice: Yohana
  rationale: Hutumia umbo la jina lililozoeleka katika mapokeo ya Biblia ya Kiswahili.
- source_word: ὁ ἀκούων καὶ βλέπων
  choice: ndiye ninayesikia na kuyaona
  rationale: Huhifadhi vitenzi-vumishi vya wakati wa sasa na muundo unaomtambulisha Yohana kuwa ndiye anayesikia na kuona.
- source_word: ταῦτα
  choice: mambo haya
  rationale: Huhifadhi wingi wa kiwakilishi cha Kigiriki na kurejelea maono na ufunuo uliosimuliwa.
- source_word: ὅτε
  choice: nilipo-
  rationale: Muundo wa wakati wa Kiswahili huwasilisha maana ya ‘wakati nilipo’ bila kuifanya iwe ‘baada ya.’
- source_word: ἤκουσα καὶ ἔβλεψα
  choice: niliposikia na kuona
  rationale: Huwasilisha vitenzi vya aoristi kwa tendo la wakati uliopita kwa namna ya asili katika Kiswahili.
- source_word: ἔπεσα
  choice: nilianguka
  rationale: Huhifadhi tendo halisi la kuanguka; muktadha unaonyesha kuwa ni kujitupa chini mbele ya malaika.
- source_word: προσκυνῆσαι
  choice: ili kuabudu
  rationale: ‘Kuabudu’ huhifadhi uzito wa kawaida wa kitenzi hiki katika Ufunuo na mvutano unaofafanuliwa na karipio la mstari unaofuata.
- source_word: ἔμπροσθεν τῶν ποδῶν
  choice: mbele ya miguu
  rationale: Hufuata kwa karibu kihusishi na kutaja wazi miguu, badala ya kufupisha kuwa ‘miguuni.’
- source_word: τοῦ ἀγγέλου
  choice: ya malaika
  rationale: Katika muktadha huyu ni kiumbe wa mbinguni, hivyo ‘malaika’ ndiyo tafsiri mwafaka kuliko ‘mjumbe.’
- source_word: τοῦ δεικνύοντός μοι ταῦτα
  choice: aliyekuwa akinionesha mambo haya
  rationale: Muundo endelevu huhifadhi hali isiyokamilika ya kitenzi-vumishi cha sasa na jukumu linaloendelea la malaika katika maono.
theological_decisions:
- issue: Maana ya προσκυνέω inapoelekezwa kwa malaika
  choice: kuabudu
  alternative: kuinama mbele ya; kutoa heshima
  rationale: Kitenzi kinaweza kumaanisha kujitupa chini au kutoa heshima, lakini katika Ufunuo mara nyingi hubeba maana ya ibada. Karipio linalofuata linaonyesha kuwa tendo hilo halifai kuelekezwa kwa malaika; kwa hiyo tafsiri hailegezi mvutano huo wa kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umehifadhi urudiaji wa ‘mambo haya,’ utofauti kati ya vitenzi vya sasa na vya wakati uliopita, na uzito wa neno ‘kuabudu’ bila kutangulia kufafanua karipio la mstari unaofuata.
