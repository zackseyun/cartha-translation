  text: Καὶ λέγει μοι· Μὴ σφραγίσῃς τοὺς λόγους τῆς προφητείας τοῦ βιβλίου τούτου, ὁ καιρὸς γὰρ ἐγγύς ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/010.yaml
  text: And he says to me[a], “Do not seal up the words of the prophecy of this book[c][b], for the time is near.”
translation:
  language: sw
  text: Naye ananiambia, “Usiyatie muhuri maneno ya unabii wa kitabu hiki,[a][b] kwa maana wakati umekaribia.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Usiyafunge kwa muhuri” au “Usiyafiche.” Usemi huu unarudia lugha ya kinabii kuhusu ufunuo kufungwa au kuachwa wazi.
    reason: lexical_alternative
  - marker: b
    text: Linganisha Danieli 12:4, ambako Danieli anaagizwa kuyafunga maneno na kukitia kitabu muhuri; hapa amri ni kinyume chake.
    reason: cross_reference
  - marker: c
    text: Au “kwa maana wakati uliowekwa umekaribia.” Neno la Kiyunani καιρός linaweza kumaanisha wakati muhimu au uliowekwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει μοι
  choice: ananiambia
  rationale: Wakati wa sasa wa Kiyunani umehifadhiwa kama wakati wa sasa wa kisimulizi, ambao ni wa asili na wenye uhai katika Kiswahili.
- source_word: Μὴ σφραγίσῃς
  choice: Usiyatie muhuri
  rationale: Huhifadhi taswira halisi ya kuweka muhuri huku muktadha ukionyesha kutofungia au kutoficha ufunuo.
- source_word: τοὺς λόγους
  choice: maneno
  rationale: Huhifadhi wingi halisi wa λόγοι badala ya kuufupisha kuwa ujumbe.
- source_word: τῆς προφητείας τοῦ βιβλίου τούτου
  choice: ya unabii wa kitabu hiki
  rationale: Huonyesha kwa njia ya kawaida ya Kiswahili kwamba maneno hayo ni ya unabii uliomo au unaohusishwa na kitabu hiki, bila kubadili βιβλίον kuwa hati-kunjo.
- source_word: ὁ καιρὸς
  choice: wakati
  rationale: Ni neno pana na la kawaida linalohifadhi uwezekano wa maana ya wakati maalumu au uliowekwa bila kuiingiza moja kwa moja katika matini kuu.
- source_word: ἐγγύς ἐστιν
  choice: umekaribia
  rationale: Ni usemi wa kawaida wa Kiswahili unaodumisha dai la ukaribu bila kulifafanua kuwa ratiba maalumu ya matukio.
theological_decisions:
- issue: Lugha ya ukaribu katika muktadha wa kiapokaliptiki
  choice: kwa maana wakati umekaribia
  alternative: kwa maana wakati uliowekwa umekaribia
  rationale: Tafsiri inadumisha mvutano wa dai kwamba wakati uko karibu bila kuupunguza, kuahirisha, au kuufafanua kwa mfumo fulani wa nyakati za mwisho.
- issue: Amri iliyo kinyume cha Danieli 12:4
  choice: Usiyatie muhuri maneno
  alternative: Usiyafiche maneno
  rationale: Taswira ya muhuri imehifadhiwa ili mwangwi wa lugha ya kinabii, hasa utofauti na Danieli 12:4, ubaki wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa sasa wa kisimulizi umehifadhiwa, na taswira ya muhuri pamoja na mvutano wa ukaribu wa wakati havijafafanuliwa kupita kiasi.
