id: REV.22.3
reference: Revelation 22:3
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ πᾶν κατάθεμα οὐκ ἔσται ἔτι. καὶ ὁ θρόνος τοῦ θεοῦ καὶ τοῦ ἀρνίου ἐν αὐτῇ ἔσται, καὶ οἱ δοῦλοι αὐτοῦ λατρεύσουσιν αὐτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/003.yaml
  text: And there will no longer be any curse[a]. And the throne of God and of the Lamb will be in it, and his servants will worship him[d][c][b],
translation:
  language: sw
  text: Wala hakutakuwa tena na laana yoyote[a]. Kiti cha enzi cha Mungu na cha Mwanakondoo kitakuwa ndani yake, na watumwa wake[c] watamwabudu[d][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kitu chochote kilicholaaniwa” au “chochote kilicho chini ya laana.”
    reason: lexical_alternative
  - marker: b
    text: 'Kigiriki kina miundo ya umoja: “kiti cha enzi” cha “Mungu na cha Mwanakondoo” ... “watumwa wake watamwabudu.” Hivyo kinahifadhi utofauti kati ya Mungu na Mwanakondoo pamoja na utawala wao wa pamoja.'
    reason: alternative_reading
  - marker: c
    text: Au, “watumishi” au “watumishi walio mali ya bwana.”
    reason: lexical_alternative
  - marker: d
    text: Au, “watamtumikia” au “watamtolea utumishi mtakatifu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν κατάθεμα
  choice: laana yoyote
  rationale: Hutoa maana pana ya kutokuwapo tena kwa laana, huku tanbihi ikihifadhi uwezekano wa nomino hiyo kumaanisha kitu kilicholaaniwa.
- source_word: οὐκ ἔσται ἔτι
  choice: hakutakuwa tena na
  rationale: Ni usemi wa kawaida wa Kiswahili unaohifadhi wakati ujao na maana ya kutokuwapo tena.
- source_word: θρόνος
  choice: kiti cha enzi
  rationale: Ni tafsiri sanifu na ya asili katika Kiswahili; umoja wa nomino umehifadhiwa.
- source_word: τοῦ θεοῦ καὶ τοῦ ἀρνίου
  choice: cha Mungu na cha Mwanakondoo
  rationale: Vihusishi vyote viwili vimeonyeshwa wazi, na taswira ya ἀρνίον imehifadhiwa kwa jina lililozoeleka katika Ufunuo, ‘Mwanakondoo.’
- source_word: ἐν αὐτῇ
  choice: ndani yake
  rationale: Kiwakilishi kinarejelea mji; ‘ndani yake’ ni Kiswahili cha kawaida bila kulazimisha kurudia ‘mji.’
- source_word: δοῦλοι
  choice: watumwa
  rationale: ‘Watumwa’ huhifadhi maana ya kuwa chini ya mamlaka na mali ya bwana iliyo katika δοῦλοι; ‘watumishi’ imewekwa kama mbadala katika tanbihi.
- source_word: λατρεύσουσιν
  choice: watamwabudu
  rationale: Katika mazingira ya kiti cha enzi na huduma takatifu, kitenzi kinaelekea kumaanisha ibada inayotolewa kwa Mungu; maana ya ‘kutumikia’ imehifadhiwa katika tanbihi.
- source_word: αὐτοῦ ... αὐτῷ
  choice: wake ... watamwabudu
  rationale: Miundo ya umoja imehifadhiwa kama ilivyo katika Kigiriki, bila kuondoa mvutano kati ya Mungu na Mwanakondoo waliotajwa kwa utofauti na utawala wao wa pamoja.
theological_decisions:
- issue: Kiti kimoja cha enzi chenye viambishi vinavyomtaja Mungu na Mwanakondoo, kikifuatiwa na viwakilishi vya umoja
  choice: 'Kuhifadhi umoja: ‘Kiti cha enzi ... watumwa wake ... watamwabudu’'
  alternative: 'Kutumia wingi: ‘kiti chao ... watumwa wao watawaabudu,’ au kufafanua kwa maneno mengine ili kuepuka mvutano huo'
  rationale: Kigiriki kinawatofautisha Mungu na Mwanakondoo, lakini kinatumia kiti kimoja cha enzi na viwakilishi vya umoja. Tafsiri inahifadhi hali hiyo bila kuiamua kwa ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kifasihi lakini kinachoeleweka kwa msomaji wa kawaida. ‘Kiti cha enzi’ na ‘Mwanakondoo’ ni istilahi za kibiblia zilizozoeleka. Muundo wa sentensi umewekwa wazi na wa asili huku umoja wenye uzito wa kiteolojia ukihifadhiwa.
