id: REV.13.1
reference: Revelation 13:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ εἶδον ἐκ τῆς θαλάσσης θηρίον ἀναβαῖνον, ἔχον κέρατα δέκα καὶ κεφαλὰς ἑπτά, καὶ ἐπὶ τῶν κεράτων αὐτοῦ δέκα διαδήματα, καὶ ἐπὶ τὰς κεφαλὰς αὐτοῦ ⸀ὀνόματα βλασφημίας.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/001.yaml
  text: And I saw a beast coming up out of the sea[a], having ten horns and seven heads, and on its horns ten crowns[b], and on its heads names of blasphemy.
translation:
  language: sw
  text: Nami nikamwona mnyama akitokea baharini, mwenye pembe kumi na vichwa saba. Juu ya pembe zake kulikuwa na taji kumi za kifalme[a], na juu ya vichwa vyake kulikuwa na majina ya kufuru[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “diadema kumi.”
    reason: lexical_alternative
  - marker: b
    text: Au, “majina yenye kufuru.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδον
  choice: nikamwona
  rationale: Kitenzi cha wakati uliopita katika mfululizo wa simulizi kimetafsiriwa kwa -ka-; kiambishi cha yambwa kinaonyesha kwamba Yohana alimwona huyo mnyama bila kuongeza wazo la ‘katika maono,’ ambalo halijasemwa hapa.
- source_word: ἐκ τῆς θαλάσσης
  choice: kutoka baharini
  rationale: ‘Kutoka’ pamoja na ‘akipanda’ huonyesha kwamba mnyama anaibuka ndani ya bahari na kwenda juu, kulingana na nguvu ya ἐκ.
- source_word: θηρίον
  choice: mnyama
  rationale: ‘Mnyama’ ni neno la kawaida na lenye hadhi linalohifadhi taswira ya kiapokaliptiki bila kuifasiri kuwa dola, mtawala, au kiumbe kingine maalumu.
- source_word: ἀναβαῖνον
  choice: akipanda
  rationale: Umbo la kuendelea la kishirikishi limehifadhiwa kwa ‘akipanda,’ likionyesha tendo lililokuwa likitokea Yohana alipomwona.
- source_word: ἔχον
  choice: mwenye
  rationale: ‘Mwenye’ ni Kiswahili cha asili na wazi kwa kuonyesha sifa ya mnyama bila mfuatano mzito wa vishirikishi.
- source_word: κέρατα δέκα
  choice: pembe kumi
  rationale: Taswira imetafsiriwa moja kwa moja na kuachwa bila ufafanuzi wa kiishara.
- source_word: κεφαλὰς ἑπτά
  choice: vichwa saba
  rationale: Tafsiri ya moja kwa moja huhifadhi idadi na taswira ya maandishi ya chanzo.
- source_word: διαδήματα
  choice: taji za kifalme
  rationale: διάδημα ni taji inayohusishwa hasa na mamlaka ya kifalme; ‘taji za kifalme’ ni wazi zaidi katika Kiswahili cha kawaida kuliko neno la kitaalamu ‘diademu.’
- source_word: ἐπὶ τῶν κεράτων αὐτοῦ
  choice: juu ya pembe zake
  rationale: Kirai hiki kinahifadhi maana ya mahali ya ἐπί na uhusiano wa pembe hizo na mnyama.
- source_word: ἐπὶ τὰς κεφαλὰς αὐτοῦ
  choice: juu ya vichwa vyake
  rationale: ‘Juu ya’ hutoa maana ya mahali kwa njia ya kawaida na ya wazi katika Kiswahili.
- source_word: ὀνόματα βλασφημίας
  choice: majina ya kumkufuru Mungu
  rationale: Genitivi imewasilishwa kwa kirai kinachoeleweka kwa wasomaji wa kawaida. ‘Kumkufuru Mungu’ huweka wazi mwelekeo wa kawaida wa βλασφημία katika muktadha huu, huku mbadala wa kisarufi ukihifadhiwa katika tanbihi.
theological_decisions:
- issue: Taswira ya kiishara ya kiapokaliptiki
  choice: Kuhifadhi maneno ‘mnyama,’ ‘pembe,’ ‘vichwa,’ na ‘taji’ bila kuyatambulisha moja kwa moja na dola, mfalme, au nguvu ya kishetani.
  alternative: Kufasiri alama hizo ndani ya maandishi kuwa ufalme, dola, mtawala, au wakala wa Shetani.
  rationale: Aya yenyewe inatoa taswira ya maono lakini haitoi utambulisho kamili hapa; tafsiri haipaswi kuondoa mvutano huo wa kitheolojia.
- issue: Maana ya ὀνόματα βλασφημίας
  choice: ‘majina ya kumkufuru Mungu’ katika maandishi, pamoja na mbadala ‘majina ya kufuru’ katika tanbihi.
  alternative: ‘majina ya kufuru’ au ‘majina yenye kukufuru.’
  rationale: Kiswahili kwa kawaida humtaja anayelengwa na tendo la kukufuru; ‘Mungu’ inaeleza maana inayodokezwa katika muktadha wa Ufunuo, lakini tanbihi huhifadhi muundo mpana zaidi wa Kigiriki.
- issue: Taji za διάδημα
  choice: Kutumia ‘taji za kifalme’ na kuweka ‘diademu’ katika tanbihi.
  alternative: ‘taji’ pekee au ‘diademu.’
  rationale: Hii hudumisha wazo la mamlaka ya kifalme na pia hutofautisha διάδημα na istilahi nyingine za taji zinazotumiwa katika Ufunuo bila kufanya maandishi yawe ya kitaalamu kupita kiasi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imegawanywa ili taswira yenye vipashio vingi isomeke kwa urahisi; marudio ya ‘juu ya’ yanahifadhi ulinganifu wa Kigiriki. Viambishi vya ngeli ya mnyama (‘mwenye,’ ‘zake,’ ‘vyake’) vimetumiwa kwa ufasaha wa Kiswahili.
