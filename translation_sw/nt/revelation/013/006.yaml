id: REV.13.6
reference: Revelation 13:6
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἤνοιξε τὸ στόμα αὐτοῦ εἰς ⸀βλασφημίας πρὸς τὸν θεόν, βλασφημῆσαι τὸ ὄνομα αὐτοῦ καὶ τὴν σκηνὴν αὐτοῦ, τοὺς ἐν τῷ οὐρανῷ σκηνοῦντας.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/006.yaml
  text: And it opened its mouth in blasphemies against God[a], to blaspheme his name and his dwelling[b], those dwelling in heaven.
translation:
  language: sw
  text: Naye akafungua kinywa chake kwa makufuru dhidi ya Mungu, ili kufuru jina lake na makao yake[b], wale wanaokaa mbinguni.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “na wale wanaokaa mbinguni,” ikiwa kifungu cha mwisho kinaeleweka kuwa kitu cha tatu kinachokufuriwa, badala ya kuwa ufafanuzi wa “makao yake.”'
    reason: alternative_reading
  - marker: b
    text: “Makao” yanaweza pia kutafsiriwa “maskani” au “hema.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤνοιξε τὸ στόμα αὐτοῦ
  choice: akafungua kinywa chake
  rationale: Inahifadhi taswira ya moja kwa moja ya Kigiriki kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: εἰς βλασφημίας πρὸς τὸν θεόν
  choice: kusema maneno ya kumkufuru Mungu
  rationale: Muundo huu ni wa asili katika Kiswahili na unahifadhi wazo la matamshi mengi ya kufuru pamoja na mwelekeo wake dhidi ya Mungu.
- source_word: βλασφημῆσαι
  choice: ili kulikufuru
  rationale: ‘Ili’ inaonyesha kusudi au matokeo yanayoweza kuonyeshwa na kitenzi-jina cha Kigiriki bila kulazimisha tofauti hiyo.
- source_word: τὸ ὄνομα αὐτοῦ
  choice: jina lake
  rationale: Tafsiri ya moja kwa moja inadumisha maana ya kibiblia ya utambulisho na heshima ya Mungu.
- source_word: τὴν σκηνὴν αὐτοῦ
  choice: makao yake
  rationale: ‘Makao’ ni neno la sasa na linaloeleweka, huku likihifadhi maana ya mahali anapokaa Mungu bila kulazimisha taswira ya kiibada ya maskani.
- source_word: τοὺς ἐν τῷ οὐρανῷ σκηνοῦντας
  choice: wale wanaokaa mbinguni
  rationale: Ni Kiswahili cha asili na kinadumisha uhusiano wa kimaana kati ya ‘makao’ na ‘wanaokaa.’
- source_word: αὐτοῦ
  choice: chake / lake / yake
  rationale: 'Upatanisho wa kisarufi wa Kiswahili umefuatwa kulingana na kila rejeo: kinywa cha mnyama, jina la Mungu, na makao ya Mungu.'
theological_decisions:
- issue: Uhusiano kati ya ‘makao yake’ na ‘wale wanaokaa mbinguni’
  choice: Kifungu cha mwisho kimetafsiriwa kama ufafanuzi unaofuata ‘makao yake,’ bila kuongeza neno kama ‘yaani.’
  alternative: 'Kukitafsiri kama kitu cha tatu kinachokufuriwa: ‘na wale wanaokaa mbinguni.’'
  rationale: Kigiriki kinaweza kueleweka kama apposition inayofafanua ‘makao yake’ au kama kitu cha tatu sambamba na ‘jina lake’ na ‘makao yake.’ Koma na kutokuwepo kwa kiunganishi cha ziada kunahifadhi uwezekano wa kwanza bila kuficha uwezekano wa pili, ambao umewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo umehifadhi taswira ya kufungua kinywa na urudiaji wa mzizi wa ‘kufuru,’ huku sintaksia iliyobana ya Kigiriki ikifanywa iwe ya asili bila kuondoa utata wa kifungu cha mwisho.
