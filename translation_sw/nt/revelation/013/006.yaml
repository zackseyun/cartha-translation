revisions:
- from: Naye akafungua kinywa chake kusema maneno ya kumkufuru Mungu, ili kulikufuru jina lake na makao yake[b], wale wanaokaa mbinguni.[a]
  to: Naye akafungua kinywa chake kwa makufuru dhidi ya Mungu, ili kufuru jina lake na makao yake[b], wale wanaokaa mbinguni.[a]
  rationale: The revision removes a modest but unnecessary expansion, renders the plural blasphemies directly as “makufuru,” and clarifies the scope of the infinitive over both “jina lake” and “makao yake.” It retains the source's compressed, ambiguous final phrase with a comma and preserves the alternative coordinate reading in footnote a.
  reviewer_model: gpt-5.6-terra
