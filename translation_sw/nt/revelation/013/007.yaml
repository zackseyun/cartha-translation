id: REV.13.7
reference: Revelation 13:7
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἐδόθη αὐτῷ ποιῆσαι πόλεμον μετὰ τῶν ἁγίων καὶ νικῆσαι αὐτούς, καὶ ἐδόθη αὐτῷ ἐξουσία ἐπὶ πᾶσαν φυλὴν καὶ λαὸν καὶ γλῶσσαν καὶ ἔθνος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/007.yaml
  text: And it was given to him to make war against the saints and to conquer them[c][b][a], and authority was given to him over every tribe and people and language and nation.
translation:
  language: sw
  text: Naye akapewa kupigana vita dhidi ya watakatifu[a] na kuwashinda[b], naye akapewa mamlaka juu ya makabila yote, watu wote, lugha zote, na mataifa yote[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kupigana vita na watakatifu”; hapa maana yake ni ya uhasama, yaani, “dhidi ya watakatifu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kushinda dhidi yao.”
    reason: lexical_alternative
  - marker: c
    text: 'Tafsiri ya kimapokeo: “ulimi” badala ya “lugha.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδόθη αὐτῷ
  choice: akapewa
  rationale: Huhifadhi kauli tendwa na kutomtaja aliyetoa, huku kiambishi cha nafsi kikitoa maana ya ‘yeye’ kwa Kiswahili cha kawaida.
- source_word: ποιῆσαι πόλεμον
  choice: kupigana vita
  rationale: Ni usemi wa asili na wazi wa Kiswahili kwa kuendesha vita, bila kupanua maana ya Kigiriki.
- source_word: μετὰ τῶν ἁγίων
  choice: dhidi ya watakatifu
  rationale: Katika muktadha wa vita, μετά inaonyesha uhasama; ‘dhidi ya’ huweka hilo wazi. ‘Watakatifu’ ni neno lililozoeleka kwa watu wa Mungu waliowekwa wakfu.
- source_word: νικῆσαι αὐτούς
  choice: kuwashinda
  rationale: ‘Kuwashinda’ ni ya asili katika Kiswahili na huhifadhi wazo la νικάω la kupata ushindi juu yao bila kudai kwamba waliangamizwa kabisa.
- source_word: ἐξουσία
  choice: mamlaka
  rationale: Huonyesha haki au uwezo wa kutawala uliotolewa, si nguvu ghafi tu.
- source_word: φυλή
  choice: kabila
  rationale: Ni kisawe cha kawaida cha kundi lenye uhusiano wa ukoo katika orodha hii.
- source_word: λαός
  choice: jamaa
  rationale: Katika orodha hii ya makundi ya wanadamu, ‘jamaa’ hutumika kwa jamii au kundi la watu na huepuka muundo usio wa asili ‘kila watu.’
- source_word: γλῶσσα
  choice: lugha
  rationale: Hutoa maana iliyokusudiwa kwa Kiswahili cha sasa; ‘ulimi’ hapa ungeweza kueleweka kwanza kama kiungo cha mwili.
- source_word: ἔθνος
  choice: taifa
  rationale: Ni kisawe cha kawaida na cha asili katika orodha ya makundi ya wanadamu.
theological_decisions:
- issue: Kauli tendwa isiyomtaja mtendaji katika ἐδόθη iliyotumiwa mara mbili
  choice: 'Kuhifadhi kauli tendwa: ‘akapewa ... akapewa,’ bila kumtaja mtoaji.'
  alternative: ‘Aliruhusiwa,’ au kumtaja Mungu kuwa ndiye aliyempa.
  rationale: Kigiriki hakimtaji mtoaji moja kwa moja. Kauli tendwa huhifadhi mvutano wa kifundisho kati ya enzi kuu ya Mungu na uovu ulioruhusiwa, bila kuutatua kwa tafsiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Naye’ huunganisha mstari huu na muktadha uliotangulia. Sentensi imegawanywa mara mbili kwa usomaji wa asili, huku urudiaji wa ‘akapewa’ ukihifadhi muundo na msisitizo wa Kigiriki.
