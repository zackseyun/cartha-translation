id: REV.13.12
reference: Revelation 13:12
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ τὴν ἐξουσίαν τοῦ πρώτου θηρίου πᾶσαν ποιεῖ ἐνώπιον αὐτοῦ. καὶ ⸀ποιεῖ τὴν γῆν καὶ τοὺς ἐν αὐτῇ κατοικοῦντας ἵνα ⸀προσκυνήσουσιν τὸ θηρίον τὸ πρῶτον, οὗ ἐθεραπεύθη ἡ πληγὴ τοῦ θανάτου αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/012.yaml
  text: And it exercises all the authority of the first beast in its presence[a]. And it causes the earth and those who dwell on it to worship the first beast[b], whose mortal wound was healed.
translation:
  language: sw
  text: Naye anatumia mamlaka yote ya yule mnyama wa kwanza mbele yake[a]. Naye anasababisha dunia na wale wakaao juu yake wamwabudu yule mnyama wa kwanza, ambaye jeraha lake la mauti liliponywa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akiwa mbele yake.” Maneno haya yanaweza kusisitiza kwamba mnyama wa pili anatenda chini ya macho ya mnyama wa kwanza au akiwa karibu naye.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “jeraha la mauti yake liliponywa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξουσίαν
  choice: mamlaka
  rationale: Neno hili linaonyesha haki au uwezo wa kutawala na kutenda, si nguvu ghafi tu.
- source_word: πᾶσαν
  choice: yote
  rationale: Linaonyesha ukamilifu wa mamlaka ya mnyama wa kwanza inayotumiwa na mnyama wa pili.
- source_word: ποιεῖ (first occurrence)
  choice: anatumia
  rationale: Katika muundo ποιεῖ τὴν ἐξουσίαν maana ni kutumia au kutekeleza mamlaka; “anatumia mamlaka” ni Kiswahili cha kawaida na cha wazi.
- source_word: ἐνώπιον αὐτοῦ
  choice: mbele yake
  rationale: 'Huhifadhi maana ya mahali au uhusiano: mnyama wa pili anatenda akiwa mbele ya mnyama wa kwanza au chini ya macho yake.'
- source_word: ποιεῖ (second occurrence)
  choice: anasababisha
  rationale: Pamoja na ἵνα, kitenzi kina maana ya kusababisha jambo litokee. Chaguo hili haliongezi kwa lazima wazo la kulazimisha ambalo halijaelezwa wazi hapa.
- source_word: τὴν γῆν
  choice: dunia
  rationale: Katika muktadha wa Ufunuo, γῆ hapa ina maana pana ya dunia, si eneo maalumu la nchi.
- source_word: τοὺς ἐν αὐτῇ κατοικοῦντας
  choice: wale wanaokaa ndani yake
  rationale: Huhifadhi muundo wa kitenzi κατοικέω na mtindo unaojirudia katika Ufunuo kuhusu wakaaji wa dunia.
- source_word: ἵνα προσκυνήσουσιν
  choice: wamwabudu
  rationale: Baada ya “anasababisha,” hali tegemezi ya Kiswahili inaeleza kwa kawaida tendo linalosababishwa.
- source_word: θηρίον
  choice: mnyama
  rationale: Ni tafsiri ya moja kwa moja na iliyozoeleka ya θηρίον katika lugha ya kinabii ya Ufunuo.
- source_word: πρῶτον
  choice: wa kwanza
  rationale: Humtofautisha mnyama huyu na mnyama wa pili katika muktadha wa karibu.
- source_word: ἐθεραπεύθη
  choice: liliponywa
  rationale: Huhifadhi wazi lugha ya kuponywa iliyo katika kitenzi cha Kigiriki cha hali ya kutendwa.
- source_word: ἡ πληγὴ τοῦ θανάτου αὐτοῦ
  choice: jeraha lake la kufisha
  rationale: Ni Kiswahili cha kawaida kinachoeleza jeraha linalosababisha kifo, huku tanbihi ikihifadhi muundo halisi zaidi wa Kigiriki.
theological_decisions:
- issue: Nguvu ya tendo la mnyama wa pili kwa dunia na wakaaji wake
  choice: anasababisha ... wamwabudu
  alternative: anawalazimisha ... wamwabudu
  rationale: Muundo wa Kigiriki unaonyesha kwamba mnyama wa pili analeta matokeo ya ibada hiyo, lakini mstari huu wenyewe haubainishi kiwango kamili cha shuruti. “Anasababisha” huhifadhi maana hiyo bila kuingiza dai lenye nguvu zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Naye” na “Pia” zinaendeleza mfululizo wa simulizi bila kuwa nzito; viwakilishi vya ngeli ya mnyama vimetumiwa kwa uthabiti, huku “wamwabudu” kikionyesha kwamba ibada inaelekezwa kwa mnyama huyo.
