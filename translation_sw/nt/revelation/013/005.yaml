id: REV.13.5
reference: Revelation 13:5
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ ἐδόθη αὐτῷ στόμα λαλοῦν μεγάλα καὶ ⸀βλασφημίας, καὶ ἐδόθη αὐτῷ ⸀ἐξουσία ποιῆσαι μῆνας ⸀τεσσεράκοντα δύο.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/005.yaml
  text: And a mouth was given to him[a], speaking great things and blasphemies[b], and authority was given to him to act for forty-two months.
translation:
  language: sw
  text: Naye akapewa kinywa cha kunena makuu[b] na makufuru, naye akapewa mamlaka ya kutenda kwa muda wa miezi arobaini na miwili.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, katika baadhi ya hati za kale na tafsiri, “akapewa mamlaka ya kuendelea kwa miezi arobaini na miwili.”
    reason: textual_variant
  - marker: b
    text: Katika muktadha huu, “makuu” huenda yanamaanisha maneno ya kiburi au ya kujisifu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδόθη
  choice: akapewa
  rationale: Kauli tendwa inaonyesha kwamba mamlaka na uwezo wa kusema vilitolewa kwake, si kwamba alikuwa navyo kwa asili. Kurudia “akapewa” kunahifadhi muundo unaosisitizwa katika Kigiriki.
- source_word: στόμα
  choice: kinywa
  rationale: Tafsiri halisi inahifadhi taswira dhahiri ya kinabii badala ya kuibadili kuwa dhana ya jumla kama “uwezo wa kusema.”
- source_word: λαλοῦν
  choice: kilichonena
  rationale: Kitenzi hiki kinarejelea “kinywa.” “Kunena” ni lugha ya sasa iliyo na hadhi inayofaa muktadha wa Maandiko.
- source_word: μεγάλα
  choice: makuu
  rationale: Neno hili kwa msingi linamaanisha mambo makubwa au makuu. Katika muktadha linadokeza majivuno, lakini tafsiri kuu haiongezi waziwazi maana ya “majivuno” ambayo haikutajwa moja kwa moja.
- source_word: βλασφημίας
  choice: makufuru
  rationale: Neno hili linahifadhi maana ya matamshi yanayomvunjia Mungu heshima na pia wingi wa nomino ya Kigiriki.
- source_word: ἐξουσία
  choice: mamlaka
  rationale: “Mamlaka” huonyesha ruhusa au uwezo uliokabidhiwa vizuri zaidi kuliko “nguvu,” ambayo ingeweza kudokeza uwezo wa kimwili tu.
- source_word: ποιῆσαι
  choice: ya kutenda
  rationale: Kitenzi hiki kina maana pana ya kufanya au kutenda. “Kutenda” kinahifadhi upana huo bila kuingiza “kuendelea,” ambalo ni somo la mapokeo mengine ya maandishi.
- source_word: μῆνας τεσσεράκοντα δύο
  choice: kwa miezi arobaini na miwili
  rationale: “Kwa” huwasilisha kwa kawaida kipindi cha muda kinachoonyeshwa na hali ya kushutumiwa katika Kigiriki.
theological_decisions:
- issue: Maana ya μεγάλα katika maelezo ya maneno ya mnyama
  choice: makuu
  alternative: maneno ya majivuno
  rationale: Muktadha unadokeza hotuba ya kiburi inayompinga Mungu, lakini neno la Kigiriki lenyewe ni pana zaidi. “Makuu” linahifadhi mvutano huo, huku tanbihi ikieleza dokezo la kimuktadha.
- issue: Maana ya ποιῆσαι pamoja na kipindi cha miezi arobaini na miwili
  choice: ya kutenda kwa miezi arobaini na miwili
  alternative: ya kuendelea kwa miezi arobaini na miwili
  rationale: Matini kuu inafuata somo la SBLGNT, ποιῆσαι. Tafsiri ya “kuendelea” imehifadhiwa katika tanbihi kama mapokeo yanayotegemea tofauti ya matini badala ya kuingizwa katika matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye hadhi na unaoeleweka. Muundo wa kurudiwa wa “akapewa” na taswira ya “kinywa” vimehifadhiwa; “kunena makuu” ni fupi, asilia, na hudumisha pia dokezo la majivuno bila kulifanya kuwa maana pekee.
