id: REV.13.15
reference: Revelation 13:15
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἐδόθη ⸀αὐτῷ ⸂δοῦναι πνεῦμα⸃ τῇ εἰκόνι τοῦ θηρίου, ἵνα καὶ λαλήσῃ ἡ εἰκὼν τοῦ θηρίου καὶ ποιήσῃ ⸀ἵνα ὅσοι ἐὰν μὴ προσκυνήσωσιν τῇ εἰκόνι τοῦ θηρίου ἀποκτανθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/015.yaml
  text: And it was given to him to give breath to the image of the beast[b][a], so that the image of the beast might even speak and cause those who would not worship the image of the beast to be killed.
translation:
  language: sw
  text: Naye akapewa uwezo wa kuipa sanamu ya yule mnyama pumzi[a], ili sanamu hiyo hata iweze kusema na kusababisha wote wasioiabudu sanamu ya yule mnyama wauawe.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “roho” au “uhai.”
    reason: lexical_alternative
  - marker: b
    text: Au, “na kufanya kwamba wote wasioiabudu sanamu ya yule mnyama wauawe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδόθη αὐτῷ
  choice: akapewa uwezo
  rationale: Muundo wa kutendwa unamhifadhi mpokeaji wa uwezo huku ukimwacha mtoaji bila kutajwa, kama ilivyo katika Kigiriki. Neno “uwezo” linafanya sentensi iwe ya kawaida kwa Kiswahili bila kumtambulisha anayetoa.
- source_word: δοῦναι πνεῦμα
  choice: kuipa pumzi
  rationale: Katika muktadha wa sanamu kuwezeshwa kusema, “pumzi” inahifadhi maana halisi inayoweza kudokeza kuhuishwa bila kudai wazi kwamba sanamu ilipewa uhai wa kweli au roho binafsi.
- source_word: εἰκών
  choice: sanamu
  rationale: “Sanamu” ni neno la kawaida na linaloeleweka katika muktadha wa ibada; halilazimishi umbo maalumu kama vile kinyago au mchongo.
- source_word: θηρίον
  choice: mnyama
  rationale: Hili ndilo neno lililozoeleka katika lugha ya kinabii ya Ufunuo na haliongezi tafsiri kama “jitu.”
- source_word: ἵνα καὶ λαλήσῃ
  choice: ili ... hata iweze kusema
  rationale: “Ili” linaonyesha kusudi au matokeo, na “hata” linaonyesha jambo la kushangaza kwamba sanamu iliweza kusema.
- source_word: ποιήσῃ ἵνα
  choice: na kusababisha ... wauawe
  rationale: Huu ni usemi wa asili wa Kiswahili unaohifadhi nguvu ya kisababishi ya ποιέω pamoja na kishazi cha ἵνα.
- source_word: ὅσοι ἐὰν μὴ προσκυνήσωσιν
  choice: wote wasioiabudu
  rationale: Muundo huu unaonyesha kwa lugha ya kawaida kundi lote la wale ambao hawaiabudu sanamu.
- source_word: προσκυνήσωσιν
  choice: waiabudu
  rationale: Katika Ufunuo, kitenzi hiki hapa kina maana ya ibada ya kidini, si kuinama tu kwa heshima.
- source_word: ἀποκτανθῶσιν
  choice: wauawe
  rationale: Kauli ya kutendwa imehifadhiwa kwa usemi mfupi, wazi, na wa kisasa.
theological_decisions:
- issue: Maana ya πνεῦμα katika kuhuishwa kwa sanamu ya mnyama
  choice: pumzi
  alternative: roho; uhai
  rationale: “Pumzi” inadumisha uwezekano wa picha ya sanamu kuhuishwa ili iseme bila kuamua kwamba ilipokea roho binafsi au uhai wa kweli.
- issue: Mtendaji katika kauli ya kutendwa ἐδόθη
  choice: Mtoaji hakutajwa
  alternative: Kumtaja Mungu au Shetani kuwa mtoaji
  rationale: Kigiriki hakimtaji mtoaji. Tafsiri kwa hiyo haiongezi utambulisho wa kitheolojia ambao mstari wenyewe haujaueleza.
- issue: Nguvu ya ποιήσῃ ἵνα katika adhabu ya kifo
  choice: kusababisha ... wauawe
  alternative: kufanya kwamba ... wauawe
  rationale: Chaguo hili linahifadhi usababishaji bila kubainisha njia, utaratibu, au mtendaji wa mauaji zaidi ya kile kinachosemwa na maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Naye” linaunganisha mstari na simulizi lililotangulia; “akapewa uwezo” ni la asili zaidi kuliko muundo mgumu wa neno kwa neno, huku likihifadhi kauli ya kutendwa na mtoaji asiyeainishwa.
