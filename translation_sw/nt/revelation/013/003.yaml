  text: καὶ μίαν ἐκ τῶν κεφαλῶν αὐτοῦ ⸀ὡς ἐσφαγμένην εἰς θάνατον, καὶ ἡ πληγὴ τοῦ θανάτου αὐτοῦ ἐθεραπεύθη. καὶ ⸀ἐθαυμάσθη ⸂ὅλη ἡ γῆ⸃ ὀπίσω τοῦ θηρίου,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/003.yaml
  text: And one of its heads was as if slaughtered to death[a], and its deadly wound was healed. And the whole earth marveled and followed after the beast[b],
translation:
  language: sw
  text: Na kimoja cha vichwa vyake kilikuwa kana kwamba kimechinjwa hadi kufa[a], na jeraha lake la mauti likaponywa. Dunia yote ikastaajabu na kumfuata yule mnyama[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kilionekana kana kwamba kimechinjwa hadi kufa.” Neno la Kigiriki linalomaanisha “kana kwamba” linaweza kuonyesha mwonekano au ufanano badala ya kutoa dai la moja kwa moja.
    reason: lexical_alternative
  - marker: b
    text: Au, “Nchi yote,” ingawa katika muktadha huu wa kiapokaliptiki “Dunia yote” inaelekea zaidi kuwa maana iliyokusudiwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: μίαν ἐκ τῶν κεφαλῶν αὐτοῦ
  choice: kichwa chake kimoja
  rationale: Hii ni tafsiri ya asili ya Kiswahili kwa muundo wa Kigiriki unaomaanisha kimoja kati ya vichwa vyake.
- source_word: ὡς ἐσφαγμένην εἰς θάνατον
  choice: kilionekana kana kwamba kilikuwa kimechinjwa hadi kufa
  rationale: “Kana kwamba” huhifadhi ulinganisho au mwonekano unaoonyeshwa na ὡς, huku “kimechinjwa hadi kufa” ikihifadhi nguvu ya σφάζω na εἰς θάνατον.
- source_word: ἡ πληγὴ τοῦ θανάτου αὐτοῦ
  choice: jeraha lake la mauti
  rationale: Ni usemi mfupi na wa kawaida unaowasilisha jeraha lenye tabia ya kuleta kifo bila kuamua ikiwa kifo hicho kilikuwa halisi au kilionekana tu.
- source_word: ἐθεραπεύθη
  choice: likaponywa
  rationale: Kitenzi hiki cha kutendwa kinaonyesha kwamba jeraha lilipata uponyaji au kurekebishwa.
- source_word: ἐθαυμάσθη
  choice: ikastaajabu
  rationale: Huwasilisha mshangao mkubwa bila kuamua ikiwa mwitikio huo ulikuwa wa kuvutiwa, kuogopa, au kuabudu.
- source_word: ὅλη ἡ γῆ
  choice: Dunia yote
  rationale: Katika muktadha huu wa kiapokaliptiki, maana ya upeo mpana wa dunia inafaa zaidi, ingawa γῆ pia inaweza kumaanisha nchi.
- source_word: ὀπίσω τοῦ θηρίου
  choice: kumfuata yule mnyama
  rationale: Hutoa Kiswahili cha kawaida chenye maana ya kwenda nyuma yake na pia uwezekano wa kujifungamanisha naye.
- source_word: θηρίου
  choice: mnyama
  rationale: Hii ndiyo tafsiri ya kawaida ya θηρίον katika taswira ya Ufunuo.
theological_decisions:
- issue: Asili ya kufa na kupona kwa mnyama kunakoonekana
  choice: Taswira imetafsiriwa kama kichwa kilichoonekana kana kwamba kimechinjwa hadi kufa na jeraha lake kuponywa, bila kufafanua tukio hilo zaidi.
  alternative: Kusema wazi kuwa kilikufa na kufufuka, kuwa ni urejesho wa kisiasa wa mfano, au kuwa ni udanganyifu uliopangwa.
  rationale: Neno ὡς linaacha nafasi ya mwonekano au ufanano, na kifungu hakiamui kati ya ufufuo halisi, urejesho wa mfano, au udanganyifu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wenye heshima na unaoeleweka. “Mnyama” limeachwa bila herufi kubwa kwa kuwa si jina rasmi katika Kigiriki. Viashiria vyote vya tanbihi vimewekwa katika matini.
