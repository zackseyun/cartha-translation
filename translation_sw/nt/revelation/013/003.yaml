- from: Na kichwa chake kimoja kilionekana kana kwamba kilikuwa kimechinjwa hadi kufa[a], lakini jeraha lake la mauti likaponywa. Dunia yote ikastaajabu na kumfuata yule mnyama[b],
  to: Na kimoja cha vichwa vyake kilikuwa kana kwamba kimechinjwa hadi kufa[a], na jeraha lake la mauti likaponywa. Dunia yote ikastaajabu na kumfuata yule mnyama[b],
  rationale: The text is revised only to represent ὡς directly with “kana kwamba” rather than adding a separate ‘appeared’ verb, and to retain the source’s additive connection (‘na’) rather than introducing ‘lakini.’ The revised wording preserves the passage’s ambiguity concerning the nature of the apparent slaughter and subsequent healing.
