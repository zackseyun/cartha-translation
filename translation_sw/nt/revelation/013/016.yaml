id: REV.13.16
reference: Revelation 13:16
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ποιεῖ πάντας, τοὺς μικροὺς καὶ τοὺς μεγάλους, καὶ τοὺς πλουσίους καὶ τοὺς πτωχούς, καὶ τοὺς ἐλευθέρους καὶ τοὺς δούλους, ἵνα ⸀δῶσιν αὐτοῖς ⸀χάραγμα ἐπὶ τῆς χειρὸς αὐτῶν τῆς δεξιᾶς ἢ ἐπὶ τὸ μέτωπον αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/016.yaml
  text: And it causes everyone—the small and the great[a], and the rich and the poor, and the free and the servants—to be given a mark on their right hand or on their forehead,
translation:
  language: sw
  text: Naye anasababisha watu wote—wadogo na wakubwa, matajiri na maskini, walio huru na watumwa—wapewe alama[a] kwenye mkono wao wa kulia au kwenye paji lao la uso,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya karibu zaidi, “ili wawape alama.” Muundo wa Kigiriki una kitenzi cha kutoa katika wingi, lakini hautaji wazi ni nani anayetoa alama hiyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιεῖ
  choice: anasababisha
  rationale: Katika muundo huu wenye ἵνα na kitenzi cha hali tegemezi, ποιεῖ huonyesha kusababisha jambo litendeke. “Anasababisha” ni Kiswahili cha kawaida na hakiongezi kwa lazima wazo la kulazimisha.
- source_word: πάντας
  choice: watu wote
  rationale: Jozi za makundi zinazofuata zinaonyesha kwamba rejeo ni la watu wa kila hali; “watu wote” huwasilisha upeo huo kwa uwazi.
- source_word: τοὺς μικροὺς καὶ τοὺς μεγάλους
  choice: wadogo na wakubwa
  rationale: Usemi huu wa jozi unahusu watu wa hadhi zote. Tafsiri ya karibu inadumisha urari na mtindo wa Ufunuo bila kuamua kwa undani aina ya hadhi inayokusudiwa.
- source_word: τοὺς πλουσίους καὶ τοὺς πτωχούς
  choice: matajiri na maskini
  rationale: Hii ni jozi ya kawaida inayoonyesha tofauti ya hali ya kiuchumi.
- source_word: τοὺς ἐλευθέρους καὶ τοὺς δούλους
  choice: walio huru na watumwa
  rationale: Tofauti ya moja kwa moja na “walio huru” inaonyesha hali ya kijamii na kisheria ya utumwa, hivyo “watumwa” ni sahihi kuliko “watumishi” hapa.
- source_word: ἵνα δῶσιν αὐτοῖς χάραγμα
  choice: wapewe alama
  rationale: Muundo wa Kigiriki unasema kwa karibu zaidi “ili wawape alama,” lakini mtendaji wa kutoa alama hajatajwa wazi. Kauli tendwa ya Kiswahili huwasilisha tukio kwa ufasaha bila kuongeza utambulisho wa mtendaji.
- source_word: χάραγμα
  choice: alama
  rationale: “Alama” linafaa kwa chapa, mchoro, au ishara ya utambulisho na ni neno la kawaida katika muktadha huu wa Ufunuo.
- source_word: ἐπὶ τῆς χειρὸς αὐτῶν τῆς δεξιᾶς
  choice: kwenye mkono wao wa kulia
  rationale: Umoja wa “mkono” umetumiwa kwa maana ya mgawanyo—mkono wa kila mtu—kama katika Kigiriki.
- source_word: ἢ ἐπὶ τὸ μέτωπον αὐτῶν
  choice: au kwenye paji lao la uso
  rationale: “Paji la uso” ni usemi wa kawaida wa Kiswahili; umoja umetumiwa kwa maana ya paji la kila mtu.
theological_decisions:
- issue: Tafsiri ya δοῦλος katika jozi ya hali za kijamii
  choice: watumwa
  alternative: watumishi
  rationale: Kwa kuwa δοῦλος inatofautishwa na “walio huru,” kifungu kinasisitiza hali ya kuwa chini ya utumwa, si huduma kwa ujumla.
- issue: Namna ya kuwasilisha ἵνα δῶσιν αὐτοῖς χάραγμα
  choice: wapewe alama
  alternative: ili wawape alama
  rationale: Kauli tendwa ni ya kawaida katika Kiswahili na haimlazimishi msomaji kudhani mtendaji maalumu ambaye Kigiriki hakumtaji wazi. Tafsiri ya karibu zaidi imehifadhiwa katika tanbihi ili kutunza ugumu wa matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Jozi za kijamii zimehifadhiwa kwa urari wa kifasihi. “Naye” huendeleza kiunganishi καί na kurejelea mhusika aliyetajwa katika muktadha uliotangulia.
