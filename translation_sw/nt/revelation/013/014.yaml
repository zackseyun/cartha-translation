id: REV.13.14
reference: Revelation 13:14
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ πλανᾷ ⸀τοὺς κατοικοῦντας ἐπὶ τῆς γῆς διὰ τὰ σημεῖα ἃ ἐδόθη αὐτῷ ποιῆσαι ἐνώπιον τοῦ θηρίου, λέγων τοῖς κατοικοῦσιν ἐπὶ τῆς γῆς ποιῆσαι εἰκόνα τῷ θηρίῳ, ⸂ὃς ἔχει⸃ τὴν πληγὴν ⸂τῆς μαχαίρης καὶ ἔζησεν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/014.yaml
  text: And it deceives those who dwell on the earth because of the signs that it was given to perform in the presence of the beast[c][b][a], telling those who dwell on the earth to make an image for the beast that had the wound of the sword and yet lived.
translation:
  language: sw
  text: Naye huwadanganya[a] wale wanaoishi duniani kwa ishara alizopewa kuzifanya mbele ya yule mnyama. Huwaambia wale wanaoishi duniani watengeneze sanamu kwa ajili ya yule mnyama[b], ambaye ana jeraha la upanga, naye aliishi.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “huwapotosha wale wanaoishi duniani.”
    reason: lexical_alternative
  - marker: b
    text: Au, “sanamu ya yule mnyama.” Kwa karibu zaidi, Kigiriki husema, “sanamu kwa ajili ya yule mnyama.”
    reason: lexical_alternative
  - marker: c
    text: Au, “aliyekuwa na jeraha la upanga, kisha akarudi kuwa hai.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πλανᾷ
  choice: huwadanganya
  rationale: Neno hili lina maana ya kudanganya au kupotosha. “Huwadanganya” ni la kawaida na linaeleza wazi kitendo cha kuwafanya watu waamini lisilo kweli; maana mbadala imehifadhiwa katika tanbihi.
- source_word: κατοικοῦντας / κατοικοῦσιν ἐπὶ τῆς γῆς
  choice: wale wanaoishi duniani
  rationale: Huhifadhi muundo wa kitenzi na usemi unaorudiwa katika Ufunuo, huku ikiwa Kiswahili cha kawaida na kinachoeleweka.
- source_word: διὰ τὰ σημεῖα
  choice: kwa ishara
  rationale: “Kwa” linaweza kubeba maana ya njia au msingi wa udanganyifu bila kulazimisha uchaguzi mkali kati ya maana ya kisababishi na ya chombo.
- source_word: σημεῖα
  choice: ishara
  rationale: Hutafsiri neno lenyewe bila kuongeza kivumishi kama “za kimiujiza,” ingawa muktadha unaonyesha matendo yasiyo ya kawaida.
- source_word: ἐδόθη αὐτῷ ποιῆσαι
  choice: alizopewa kuzifanya
  rationale: Muundo wa kutendwa umehifadhiwa bila kumtaja aliyetoa uwezo au ruhusa, kama ilivyo katika Kigiriki.
- source_word: ἐνώπιον τοῦ θηρίου
  choice: mbele ya yule mnyama
  rationale: Ni usemi wa kawaida wa Kiswahili unaohifadhi maana ya kutenda katika uwepo wa mnyama.
- source_word: λέγων
  choice: huwaambia
  rationale: Huunganisha kiasili kauli inayofuata bila kuongeza nguvu ya “kuamuru,” ambayo haijaelezwa moja kwa moja.
- source_word: ποιῆσαι εἰκόνα τῷ θηρίῳ
  choice: watengeneze sanamu kwa ajili ya yule mnyama
  rationale: “Kwa ajili ya” huhifadhi dativu ya Kigiriki, ambayo inaweza kuonyesha sanamu iliyowekwa au kutengenezwa kwa heshima ya mnyama, badala ya kuibadili moja kwa moja kuwa umilikaji.
- source_word: εἰκόνα
  choice: sanamu
  rationale: Katika muktadha huu wa kitu kinachotengenezwa na baadaye kupewa pumzi, “sanamu” ni neno la asili na wazi kwa wasomaji wa Kiswahili, ingawa εἰκών linaweza pia kumaanisha taswira au mfano.
- source_word: ὃς ἔχει τὴν πληγὴν τῆς μαχαίρης
  choice: aliyekuwa na jeraha la upanga
  rationale: Kiswahili cha wakati uliopita kinaunganisha kwa kawaida jeraha hilo na tukio lililotangulia, huku kikihifadhi jeraha la upanga kama sifa inayomtambulisha mnyama.
- source_word: μάχαιρα
  choice: upanga
  rationale: Ni tafsiri ya kawaida na inayofaa katika Ufunuo bila kubainisha kupita kiasi aina maalumu ya silaha.
- source_word: καὶ ἔζησεν
  choice: lakini akaishi
  rationale: “Akaishi” huhifadhi tendo la wakati uliopita; “lakini” huonyesha tofauti inayodokezwa kati ya jeraha hilo na kuishi kwake bila kudai wazi ufufuo.
theological_decisions:
- issue: Mtendaji asiyeelezwa katika ἐδόθη
  choice: Kudumisha kauli ya kutendwa katika “alizopewa kuzifanya” bila kumtaja Mungu.
  alternative: Mungu alimpa uwezo wa kuzifanya; aliruhusiwa kuzifanya.
  rationale: Kumtaja Mungu au kufafanua kuwa ni ruhusa kungevuka maneno ya aya. Kauli ya kutendwa huhifadhi mvutano wa mamlaka na ruhusa katika maandishi ya kiapokaliptiki.
- issue: Maana ya ἔζησεν baada ya jeraha
  choice: “lakini akaishi”
  alternative: akafufuka; akarudi kuwa hai; akaendelea kuishi
  rationale: Aya inaonyesha uzima baada ya jeraha, lakini haielezi bila utata kama mnyama alinusurika au alirudishwa kuwa hai. Tafsiri kuu haifanyi dai maalumu la ufufuo, na uwezekano mwingine umeonyeshwa katika tanbihi.
- issue: Uhusiano wa sanamu na mnyama katika τῷ θηρίῳ
  choice: “sanamu kwa ajili ya yule mnyama”
  alternative: sanamu ya yule mnyama
  rationale: Dativu ya Kigiriki inaelekea kueleza sanamu iliyotengenezwa kwa ajili ya mnyama, ingawa kwa maana inaweza kuwa sanamu inayomwakilisha. Tafsiri haibadili dativu kuwa genitivi bila tahadhari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa sasa, wenye heshima na unaosomeka kwa urahisi. Kurudiwa kwa “wale wanaoishi duniani” kumehifadhiwa kwa sababu ni usemi wenye umuhimu wa kimada katika Ufunuo. “Yule mnyama” hutofautisha mhusika huyu katika muktadha bila kuingiza jinsia ya kibayolojia.
