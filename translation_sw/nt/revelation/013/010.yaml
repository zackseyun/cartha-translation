- from: Ikiwa yeyote ni wa kwenda matekani, ataenda matekani[a]; ikiwa yeyote ni wa kuuawa kwa upanga, lazima auawe kwa upanga[b]. Hapa ndipo penye uvumilivu na imani[c] ya watakatifu.
  to: Ikiwa yeyote amekusudiwa kwenda matekani, ataenda matekani[a]; ikiwa yeyote anapaswa kuuawa kwa upanga, lazima auawe kwa upanga[b]. Hapa ndipo ulipo uvumilivu na imani[c] ya watakatifu.
  rationale: The revision makes the first conditional natural in Standard East African Swahili while preserving the source text's repeated ‘into captivity’ and its descriptive/appointed-destiny ambiguity. It also improves the idiomatic rendering of the final demonstrative clause. No doctrinal conclusion about nonresistance or retribution has been added.
