review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the conditional, the repeated captivity expression, passive killing by the sword, and the closing reference to the saints' endurance and faith. However, “ni wa kwenda matekani” is unnatural and does not clearly convey the Greek's elliptical sense of being destined/assigned for captivity. “Hapa ndipo penye” is less direct than the demonstrative force of ὧδέ ἐστιν.
  naturalness: Replace the awkward ‘ni wa kwenda matekani’ with ‘amekusudiwa kwenda matekani,’ retaining both the destiny nuance and the repetition. Use ‘Hapa ndipo ulipo’ for a natural, emphatic Swahili equivalent of ‘Here is.’
  terminology: “Matekani,” “kwa upanga,” “uvumilivu,” “imani,” and “watakatifu” are suitable Standard East African Swahili choices. The faithfulness alternative remains appropriately footnoted.
  issues:
  - severity: medium
    issue: ‘ni wa kwenda matekani’ is idiomatically strained and semantically underdetermined.
    rationale: It can sound like a personal characteristic or intention (‘one who is going’) rather than the source's compressed statement of appointed captivity. ‘amekusudiwa kwenda matekani’ expresses the intended destiny reading without turning the line into a command.
  - severity: low
    issue: ‘Hapa ndipo penye uvumilivu...’ is less natural and less precise as a rendering of ὧδέ ἐστιν.
    rationale: ‘Hapa ndipo ulipo uvumilivu na imani ya watakatifu’ is idiomatic and more directly signals that this is where those qualities are called for or seen.
  - severity: low
    issue: Footnote a’s alternative is not quite parallel to the revised main-text construction.
    rationale: It should state the direct alternative ‘Ikiwa yeyote anaenda matekani...’ while retaining the note about appointed destiny versus command.
  revised_text: Ikiwa yeyote amekusudiwa kwenda matekani, ataenda matekani[a]; ikiwa yeyote anapaswa kuuawa kwa upanga, lazima auawe kwa upanga[b]. Hapa ndipo ulipo uvumilivu na imani[c] ya watakatifu.
