id: REV.13.10
reference: Revelation 13:10
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἴ τις ⸂εἰς αἰχμαλωσίαν, εἰς αἰχμαλωσίαν⸃ ὑπάγει· εἴ τις ἐν μαχαίρῃ ⸀ἀποκτανθῆναι αὐτὸν ἐν μαχαίρῃ ἀποκτανθῆναι. ὧδέ ἐστιν ἡ ὑπομονὴ καὶ ἡ πίστις τῶν ἁγίων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/010.yaml
  text: If anyone is for captivity[a], into captivity he goes; if anyone is to be killed with the sword, with the sword he must be killed[c][b]. Here is the endurance and the faith of the saints.
translation:
  language: sw
  text: Ikiwa yeyote amekusudiwa kwenda matekani, ataenda matekani[a]; ikiwa yeyote anapaswa kuuawa kwa upanga, lazima auawe kwa upanga[b]. Hapa ndipo ulipo uvumilivu na imani[c] ya watakatifu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ikiwa yeyote anaenda matekani, ataenda matekani.” Mstari huu pia unaweza kueleweka kuwa kauli kuhusu hatima iliyowekwa, wala si amri.
    reason: alternative_reading
  - marker: b
    text: Baadhi ya hati au namna nyingine za kusoma kifungu hiki hutofautiana, kutia ndani ile isemayo, “Ikiwa yeyote anaua kwa upanga, lazima auawe kwa upanga.” Hapa tumefuata matini iliyowekwa, lakini tofauti hiyo ni muhimu katika kufasiri.
    reason: textual_variant
  - marker: c
    text: Au, “uaminifu wa watakatifu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ τις
  choice: ikiwa yeyote
  rationale: Ni usemi wa sharti usiomwekea mtu maalumu; “yeyote” huhifadhi maana yake ya jumla kwa Kiswahili cha sasa.
- source_word: εἰς αἰχμαλωσίαν ... ὑπάγει
  choice: ni wa kwenda matekani ... ataenda matekani
  rationale: Muundo huu unahifadhi urudiaji wenye mkazo wa εἰς αἰχμαλωσίαν na kutaja wazi kitendo cha ὑπάγει, bila kuugeuza moja kwa moja kuwa amri.
- source_word: αἰχμαλωσία
  choice: matekani
  rationale: “Mateka” huonyesha hali ya kushikwa na kupelekwa chini ya mamlaka ya adui, kwa ufasaha zaidi kuliko “utumwa,” ambao unaweza kudokeza hasa hali ya kuwa mtumwa.
- source_word: ἐν μαχαίρῃ
  choice: kwa upanga
  rationale: Hutoa maana ya chombo au njia ya kuuawa na kudumisha lugha ya hukumu inayojulikana katika Biblia.
- source_word: ἀποκτανθῆναι
  choice: kuuawa / auawe
  rationale: Huhifadhi hali ya kutendwa ya kitenzi cha Kigiriki kwa lugha ya kawaida na iliyo wazi.
- source_word: αὐτὸν
  choice: lazima auawe
  rationale: Kiwakilishi hicho kiko katika muundo mkato wa Kigiriki; “lazima auawe” huunda sentensi ya Kiswahili iliyoeleweka huku ikihifadhi hali ya kutendwa na wazo la jambo lisiloepukika.
- source_word: ὧδέ ἐστιν
  choice: Hapa ndipo penye
  rationale: Ni usemi wa asili wa Kiswahili unaoelekeza fikira kwa jambo linalofuata bila kuongeza maelezo yasiyomo.
- source_word: ὑπομονή
  choice: uvumilivu
  rationale: Huonyesha kudumu kwa uthabiti chini ya mateso au shinikizo, na ni neno la kawaida linaloeleweka.
- source_word: πίστις
  choice: imani
  rationale: “Imani” ndiyo maana kuu inayofaa katika matini; maana inayowezekana ya “uaminifu” imehifadhiwa katika tanbihi.
- source_word: τῶν ἁγίων
  choice: ya watakatifu
  rationale: Hurejelea watu watakatifu wa Mungu kwa usemi mfupi, wa heshima, na unaotambulika katika Kiswahili cha Biblia.
theological_decisions:
- issue: 'Maana ya vifungu viwili vya kwanza: jambo lililowekwa au amri'
  choice: Kauli ya jambo linalomkabili mtu au hatima ya hukumu
  alternative: Amri ya kutopinga kwa nguvu, au kanuni ya kwamba wanaowateka na kuwaua wengine watalipizwa vivyo hivyo
  rationale: Matini iliyotolewa ni fupi na ina ugumu wa kimatini, lakini muundo wake unaelekea kuwa kauli ya kimethali kuhusu yatakayompata mtu. Tafsiri haijaingiza moja kwa moja fundisho la kutolipa kisasi wala la kulipiza kisasi.
- issue: Maana ya πίστις katika kifungu cha mwisho
  choice: imani
  alternative: uaminifu
  rationale: “Imani” huhifadhi maana ya msingi bila kufunga uwezekano wa kwamba, katika muktadha wa kuvumilia mateso, neno hilo pia linaweza kusisitiza uaminifu; uwezekano huo umetajwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa kimethali na urudiaji wa matini ya Kigiriki umehifadhiwa kadiri inavyowezekana bila kufanya sentensi kuwa ngumu kupita kiasi. “Matekani” limechaguliwa badala ya “utumwani” ili kuonyesha wazi kuchukuliwa mateka, na “watakatifu” limetumiwa kwa maana ya watu wa Mungu.
