id: REV.13.13
reference: Revelation 13:13
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ποιεῖ σημεῖα μεγάλα, ⸂ἵνα καὶ πῦρ ποιῇ⸃ ἐκ τοῦ οὐρανοῦ ⸂καταβαίνειν εἰς⸃ τὴν γῆν ἐνώπιον τῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/013.yaml
  text: And it performs great signs[b][a], even causing fire to come down from heaven to the earth before people.
translation:
  language: sw
  text: Naye anafanya ishara kubwa[a], hata anasababisha moto ushuke kutoka mbinguni hadi duniani mbele ya watu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au “miujiza mikubwa” au “maajabu makubwa”; Kigiriki: “ishara.”'
    reason: lexical_alternative
  - marker: b
    text: Au “machoni pa watu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιεῖ
  choice: anafanya
  rationale: Katika Kiswahili, “kufanya ishara” ni usemi wa kawaida unaobaki karibu na kitenzi cha Kigiriki ποιέω bila kulazimisha kwamba matendo hayo ni miujiza halisi.
- source_word: σημεῖα μεγάλα
  choice: ishara kubwa
  rationale: “Ishara” huhifadhi maana ya matendo yenye kuashiria jambo na yanayoweza kudanganya katika muktadha huu; “miujiza” au “maajabu” yangeweza kuamua mapema asili yake.
- source_word: ἵνα καὶ πῦρ ποιῇ
  choice: hata anasababisha moto
  rationale: “Hata” huonyesha kwamba kushusha moto ni mfano wa kushangaza hasa wa ishara hizo; “anasababisha” huwasilisha kwa Kiswahili cha asili nguvu ya ποιῇ katika muundo huu.
- source_word: πῦρ
  choice: moto
  rationale: Hii ni tafsiri ya moja kwa moja inayohifadhi mwangwi wa matukio ya kinabii ya moto kutoka mbinguni.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: kutoka mbinguni
  rationale: “Mbinguni” inafaa sajili ya kiapokaliptiki na haifungi maana kuwa anga la kawaida tu.
- source_word: καταβαίνειν εἰς τὴν γῆν
  choice: ushuke ... hadi duniani
  rationale: “Ushuke” huonyesha mwendo wa kwenda chini, na “hadi duniani” huhifadhi kikomo cha mwendo kilicho wazi katika εἰς τὴν γῆν.
- source_word: ἐνώπιον τῶν ἀνθρώπων
  choice: mbele ya watu
  rationale: Huwasilisha tendo linalofanyika hadharani na kuonekana na watu; “watu” linawahusu wanadamu kwa jumla bila kudokeza wanaume pekee.
theological_decisions:
- issue: Asili ya kufanya ishara
  choice: Kutaja ishara kubwa na moto kushuka mbele ya watu bila kubainisha kama chanzo chake ni nguvu ya kimuujiza au udanganyifu wa namna fulani.
  alternative: Kutumia “miujiza” ili kudokeza nguvu halisi ya kimuujiza, au kutumia maneno yanayosisitiza kwamba ni hila tupu.
  rationale: Aya inaeleza jambo linalofanywa na kuonekana hadharani, lakini haielezi hapa utaratibu au asili yake; tafsiri huhifadhi mvutano huo wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Naye” huendeleza mhusika wa muktadha, huku “ishara” na “mbinguni” vikihifadhi sajili ya Ufunuo. Alama zote za tanbihi zimewekwa katika matini kuu.
