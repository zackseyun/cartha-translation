id: REV.13.11
reference: Revelation 13:11
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ εἶδον ἄλλο θηρίον ἀναβαῖνον ἐκ τῆς γῆς, καὶ εἶχεν κέρατα δύο ὅμοια ἀρνίῳ, καὶ ἐλάλει ὡς δράκων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/011.yaml
  text: And I saw another beast coming up out of the earth[a], and it had two horns like a lamb, and it was speaking like a dragon.
translation:
  language: sw
  text: Kisha nikaona mnyama mwingine akipanda kutoka duniani[a]. Alikuwa na pembe mbili kama za mwanakondoo, naye alikuwa akinena kama joka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akipanda kutoka nchini.” Neno la Kigiriki γῆ linaweza kumaanisha “dunia” au “nchi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλο θηρίον
  choice: mnyama mwingine
  rationale: “Mnyama” huhifadhi taswira ya kiapokaliptiki ya θηρίον katika Ufunuo, huku “mwingine” ikitafsiri ἄλλο moja kwa moja.
- source_word: ἀναβαῖνον ἐκ τῆς γῆς
  choice: akipanda kutoka katika dunia
  rationale: Muundo wa “akipanda” unaonyesha tendo linaloendelea la kuibuka; “dunia” hudumisha tofauti pana ya kiishara na mnyama aliyetoka baharini, ingawa γῆ pia inaweza kumaanisha nchi.
- source_word: εἶχεν κέρατα δύο
  choice: alikuwa na pembe mbili
  rationale: Hii ni tafsiri ya kawaida na ya moja kwa moja ya maelezo hayo; pembe huhifadhi taswira ya mamlaka au nguvu katika maandishi ya kiapokaliptiki.
- source_word: ὅμοια ἀρνίῳ
  choice: kama za mwanakondoo
  rationale: Kisarufi, ὅμοια hurejelea pembe. “Kama za mwanakondoo” huonyesha wazi kwamba pembe hizo ndizo zinazofananishwa na pembe za mwanakondoo, huku ikihifadhi mwangwi wa taswira ya Mwanakondoo katika Ufunuo.
- source_word: ἐλάλει ὡς δράκων
  choice: alikuwa akisema kama joka
  rationale: “Alikuwa akisema” huakisi hali endelevu ya kitenzi cha wakati usiotimilifu, na “kama joka” huhifadhi ulinganisho bila kudai kwamba mnyama huyo ndiye joka.
theological_decisions:
- issue: Tafsiri ya ἀρνίον katika muktadha unaoweza kurejelea taswira ya Mwanakondoo katika Ufunuo
  choice: mwanakondoo
  alternative: kondoo mdogo
  rationale: “Mwanakondoo” ni ya kawaida, yenye hadhi, na huhifadhi mwangwi wa Mwanakondoo bila kulazimisha utambulisho; “kondoo mdogo” ingeweza kusisitiza udogo usiolengwa hapa.
- issue: Tafsiri ya γῆ
  choice: dunia
  alternative: nchi
  rationale: Maana zote mbili zinawezekana. “Dunia” inafaa zaidi kwa tofauti pana ya kiapokaliptiki na bahari, huku tanbihi ikihifadhi uwezekano wa “nchi” bila kuuficha.
- issue: Uhusiano wa ὅμοια na κέρατα δύο
  choice: pembe mbili kama za mwanakondoo
  alternative: pembe mbili kama mwanakondoo
  rationale: Chaguo hili linafuata upatanisho wa kisarufi wa ὅμοια na “pembe” na kuepuka taswira isiyo wazi kana kwamba pembe hizo zinafanana na mwanakondoo mzima.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Kisha nikaona” ni simulizi ya kawaida ya maono; “joka” hutumiwa kwa δράκων. Kiunganishi “lakini” kinaonyesha kwa njia ya asili tofauti kati ya mwonekano wa mwanakondoo na usemi wa joka, bila kubadili hoja ya msingi ya Kigiriki.
