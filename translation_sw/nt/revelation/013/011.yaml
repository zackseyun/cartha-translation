- from: Kisha nikaona mnyama mwingine akipanda kutoka katika dunia[a]. Alikuwa na pembe mbili kama za mwanakondoo, lakini alikuwa akisema kama joka.
  to: Kisha nikaona mnyama mwingine akipanda kutoka duniani[a]. Alikuwa na pembe mbili kama za mwanakondoo, naye alikuwa akinena kama joka.
  rationale: The revision removes the unsupported adversative conjunction, improves the idiom of the emergence phrase, and retains the source’s descriptive past/imperfect sense and the lamb/dragon comparison without resolving its symbolism.
