  text: καὶ προσεκύνησαν τῷ δράκοντι ⸂ὅτι ἔδωκεν⸃ τὴν ἐξουσίαν τῷ θηρίῳ, καὶ προσεκύνησαν τῷ θηρίῳ λέγοντες· Τίς ὅμοιος τῷ θηρίῳ, καὶ τίς ⸀δύναται πολεμῆσαι μετ’ αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/004.yaml
  text: And they worshiped the dragon because he had given authority to the beast[a], and they worshiped the beast, saying, “Who is like the beast[c][b], and who is able to make war with it?”
translation:
  language: sw
  text: Nao wakamsujudia yule joka kwa sababu alikuwa amempa yule mnyama mamlaka; nao wakamsujudia pia yule mnyama, wakisema, “Ni nani aliye kama yule mnyama?[a][c] Na ni nani awezaye kupigana vita dhidi yake?[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ni nani anayeweza kulinganishwa na yule mnyama?”
    reason: lexical_alternative
  - marker: b
    text: Au, “Ni nani anayeweza kupigana vita dhidi yake?”
    reason: lexical_alternative
  - marker: c
    text: Kauli hii huenda ikawa mwangwi wa lugha ya Agano la Kale kuhusu Mungu kutolinganishwa na yeyote (kwa mfano, Kutoka 15:11; Zaburi 35:10), lakini hapa inatumiwa kwa yule mnyama kwa njia ya kukufuru.
    reason: cross_reference
lexical_decisions:
- source_word: προσεκύνησαν
  choice: wakamsujudia
  rationale: Katika Ufunuo, kitenzi hiki kwa kawaida humaanisha ibada ya kidini, si kuinama tu; “kusujudia” linaonyesha tendo la ibada ya sanamu kwa lugha ya kawaida na yenye hadhi.
- source_word: δράκοντι
  choice: yule joka
  rationale: “Joka” ni tafsiri ya moja kwa moja ya taswira hii ya kiapokaliptiki; kiashiria “yule” kinasaidia kurejelea mhusika ambaye tayari ametajwa katika muktadha.
- source_word: ὅτι ἔδωκεν
  choice: kwa sababu alikuwa amempa
  rationale: ὅτι hapa inaeleza sababu ya kumsujudia joka, na wakati uliotangulia katika Kiswahili unaweka wazi kwamba kutoa mamlaka kulitangulia ibada hiyo.
- source_word: ἐξουσίαν
  choice: mamlaka
  rationale: “Mamlaka” huhifadhi wazo la uwezo au haki ya kutawala iliyotolewa, badala ya nguvu kwa maana pana tu.
- source_word: θηρίῳ
  choice: yule mnyama
  rationale: “Mnyama” ni tafsiri ya moja kwa moja na iliyozoeleka ya θηρίον katika taswira ya Ufunuo, bila kufasiri utambulisho wake.
- source_word: Τίς ὅμοιος τῷ θηρίῳ
  choice: Ni nani aliye kama yule mnyama?
  rationale: Muundo huu wa kawaida wa Kiswahili huhifadhi swali la balagha na mwangwi unaowezekana wa kauli za Maandiko kuhusu kutolinganishwa kwa Mungu.
- source_word: δύναται πολεμῆσαι μετ’ αὐτοῦ
  choice: ni nani awezaye kupigana vita naye?
  rationale: “Kupigana vita” huhifadhi maana ya kijeshi ya πολεμέω, na “naye” ni marejeo ya asili katika Kiswahili kwa nomino ya ngeli ya A-WA “mnyama” bila kulazimisha uamuzi wa ziada kuhusu ubinafsishaji wake.
theological_decisions:
- issue: Namna ya kurejelea mnyama kwa kiwakilishi
  choice: Kutumia “naye” kulingana na sarufi ya kawaida ya Kiswahili kwa “mnyama”
  alternative: Kutumia “dhidi yake” ili kupunguza hisia ya ubinafsishaji
  rationale: Kiswahili hakina kiwakilishi cha moja kwa moja kinacholingana na tofauti ya Kiingereza ya “it/him” hapa; upatanisho wa “mnyama” kwa kawaida ni wa ngeli ya A-WA. Tafsiri haiongezi dai kwamba mnyama ni mtu halisi.
- issue: Mwangwi wa lugha kuhusu Mungu kutolinganishwa
  choice: Kuhifadhi “Ni nani aliye kama yule mnyama?” bila ufafanuzi ndani ya aya
  alternative: Kufafanua katika matini kwamba kauli hiyo ni mwigo wa kukufuru
  rationale: Maneno yanaweza kuwa mwangwi wa kauli za Agano la Kale kuhusu upekee wa Mungu. Kuyaacha katika umbo lake la swali huhifadhi mvutano na dokezo hilo, huku tanbihi ikitoa msaada wa rejea.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Kusujudia” limetumiwa kwa nguvu ya ibada katika muktadha huu; “joka,” “mnyama,” na “mamlaka” huhifadhi taswira na istilahi za chanzo. Alama zote za tanbihi [a], [b], na [c] zimewekwa katika matini kuu.
