  yaml_path: translation/nt/revelation/013/009.yaml
  text: If anyone has an ear[a], let him hear.
translation:
  language: sw
  text: Yeyote aliye na sikio, na asikie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἴ τις
  choice: Yeyote aliye
  rationale: Ingawa muundo wa Kigiriki ni wa masharti, yaani ‘ikiwa mtu fulani’, Kiswahili cha kawaida hutumia kwa ufasaha ‘yeyote aliye’ katika mwito huu wa jumla, bila kupunguza maana yake.
- source_word: ἔχει
  choice: aliye na
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaoonyesha kuwa mtu ana kitu; hapa unaunganishwa kiasili na kiwakilishi ‘yeyote’.
- source_word: οὖς
  choice: sikio
  rationale: Umoja wa Kigiriki umehifadhiwa. Katika msemo huu, ‘sikio’ linadokeza uwezo na utayari wa kusikia kwa makini.
- source_word: ἀκουσάτω
  choice: na asikie
  rationale: Muundo huu wa Kiswahili unatoa amri au himizo kwa nafsi ya tatu na kuhifadhi kitenzi ‘kusikia’, pamoja na maana yake ya kuitikia kwa makini, bila kuifafanua kupita kiasi kuwa ‘aelewe’.
theological_decisions:
- issue: Mwito wa kusikia unamhusu mtu yeyote bila kubainisha jinsia
  choice: Yeyote aliye na sikio, na asikie
  alternative: Mtu akiwa na sikio, na asikie
  rationale: Kiwakilishi cha Kigiriki τις ni cha jumla. Kiswahili hakihitaji kuingiza kiwakilishi cha jinsia katika sehemu ya mwisho, hivyo tafsiri inahifadhi umoja na upeo wa jumla wa mwito bila kuongeza tofauti ya kijinsia isiyo lazima katika sarufi ya Kiswahili.
- issue: Nguvu ya kimethali na kinabii ya ‘kusikia’
  choice: asikie
  alternative: asikilize; aelewe
  rationale: ‘Asikie’ huhifadhi mwangwi wa mwito wa kinabii wa kupokea ujumbe kwa makini. ‘Aelewe’ ungefunga maana kwenye ufahamu wa kiakili, na ‘asikilize’ ingeondoa kiasi fulani mwangwi wa kitenzi kilekile cha kusikia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo mfupi, wenye hadhi na unaofaa mwito wa kinabii. Hakuna tanbihi inayohitajika kwa sababu Kiswahili huonyesha rejeo la jumla bila kulazimika kuchagua kiwakilishi chenye jinsia.
