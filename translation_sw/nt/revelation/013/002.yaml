id: REV.13.2
reference: Revelation 13:2
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ τὸ θηρίον ὃ εἶδον ἦν ὅμοιον παρδάλει, καὶ οἱ πόδες αὐτοῦ ὡς ἄρκου, καὶ τὸ στόμα αὐτοῦ ὡς στόμα λέοντος. καὶ ἔδωκεν αὐτῷ ὁ δράκων τὴν δύναμιν αὐτοῦ καὶ τὸν θρόνον αὐτοῦ καὶ ἐξουσίαν μεγάλην.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/002.yaml
  text: And the beast that I saw was like a leopard[a], and its feet were like a bear's, and its mouth was like a lion's mouth. And the dragon gave it his power and his throne and great authority.
translation:
  language: sw
  text: Na yule mnyama niliyemwona alikuwa kama chui[a]; miguu yake ilikuwa kama ya dubu, na kinywa chake kama kinywa cha simba. Na yule joka akampa nguvu zake, kiti chake cha enzi, na mamlaka kubwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Taswira ya chui, dubu, na simba inakumbusha maono ya wanyama katika Danieli 7.
    reason: cross_reference
lexical_decisions:
- source_word: θηρίον
  choice: mnyama
  rationale: Katika Ufunuo neno hili humaanisha kiumbe cha kutisha cha kiapokaliptiki. “Mnyama” ni neno la kawaida na lenye uzito wa kiishara katika Kiswahili; muktadha unaonyesha kuwa si mnyama wa kawaida.
- source_word: ὅμοιον παρδάλει
  choice: kama chui
  rationale: Muundo ὅμοιος pamoja na hali ya dative huonyesha ufanano. “Kama chui” ni usemi wa asili unaohifadhi ulinganisho bila kuufafanua kupita kiasi.
- source_word: πόδες
  choice: miguu
  rationale: πούς humaanisha mguu au miguu. “Miguu” hufuata neno la Kigiriki kuliko “makucha” na inafaa katika taswira hii.
- source_word: ὡς ἄρκου
  choice: kama ya dubu
  rationale: Kigiriki kina ulinganisho uliodokezwa baada ya “miguu yake.” “Kama ya dubu” hukamilisha maana hiyo kwa Kiswahili cha kawaida bila kuongeza habari.
- source_word: στόμα ... ὡς στόμα λέοντος
  choice: kinywa ... kama kinywa cha simba
  rationale: Kurudia “kinywa” kunalingana na kurudiwa kwa στόμα katika Kigiriki na kuhifadhi uwiano na uhai wa maono.
- source_word: δράκων
  choice: joka
  rationale: “Joka” ndilo neno la kawaida la kibiblia na la Kiswahili kwa kiumbe huyu wa kiapokaliptiki, bila kulifanya kuwa maelezo ya kawaida ya nyoka tu.
- source_word: ἔδωκεν
  choice: akampa
  rationale: δίδωμι ni “kutoa.” Kiambishi cha yambwa katika “akampa” kinaonyesha kwa kawaida kwamba joka alimpa mnyama vitu vilivyotajwa.
- source_word: δύναμιν
  choice: nguvu
  rationale: δύναμις hapa ni uwezo au nguvu tendaji. “Nguvu” ni tafsiri ya moja kwa moja na inabaki tofauti na ἐξουσία.
- source_word: θρόνον
  choice: kiti cha enzi
  rationale: “Kiti cha enzi” ni usemi wa kawaida wa Kiswahili kwa θρόνος na huhifadhi maana ya utawala wa kifalme.
- source_word: ἐξουσίαν μεγάλην
  choice: mamlaka kubwa
  rationale: ἐξουσία ni haki au uwezo wa kutawala ulioidhinishwa, tofauti na δύναμις. “Mamlaka kubwa” huhifadhi tofauti hiyo.
- source_word: αὐτοῦ
  choice: yake / zake / chake
  rationale: Ngeli za Kiswahili huamua maumbo ya vimilikishi. Marejeo ya joka katika “nguvu zake” na “kiti chake” yanaonyesha kuwa vitu hivyo ni vya joka, huku “miguu yake” na “kinywa chake” vikirejelea mnyama kulingana na muktadha.
theological_decisions:
- issue: Uhusiano kati ya joka na mnyama katika marejeo ya viwakilishi
  choice: Muktadha na ngeli hutofautisha mnyama na joka; “akampa” humtaja mnyama kama mpokeaji, na “nguvu zake, kiti chake” humrejelea joka.
  alternative: Kurudia nomino kila mahali, kama “nguvu za joka na kiti cha enzi cha joka,” ili kuondoa uwezekano wote wa utata.
  rationale: Kigiriki hutumia viwakilishi vinavyofanana, lakini mpangilio wa sentensi unaonyesha kwamba joka ndiye mtoaji na mnyama ndiye mpokeaji. Kiswahili cha asili kinaweza kuhifadhi marejeo hayo bila kuongeza ufafanuzi wa kiteolojia.
- issue: Kuhifadhi taswira changamano ya wanyama bila kuipanua kiufafanuzi
  choice: Ulinganisho na chui, dubu, na simba umetafsiriwa moja kwa moja; dokezo la Danieli 7 limewekwa katika tanbihi.
  alternative: Kuingiza katika matini kuu maelezo kwamba taswira inarejelea Danieli 7.
  rationale: Matini ya Kigiriki haitoi ufafanuzi huo moja kwa moja. Kutenganisha tafsiri na tanbihi huhifadhi taswira na nafasi yake ya kufasiriwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wazi kwa msomaji wa kawaida, huku marudio ya “kinywa” na tofauti kati ya “nguvu” na “mamlaka” vikihifadhiwa. Alama ya tanbihi [a] imewekwa mara tu baada ya “chui,” mahali panapohusika.
