id: REV.13.8
reference: Revelation 13:8
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ προσκυνήσουσιν ⸀αὐτὸν πάντες οἱ κατοικοῦντες ἐπὶ τῆς γῆς, ⸀οὗ οὐ γέγραπται τὸ ὄνομα ⸀αὐτοῦ ἐν τῷ βιβλίῳ τῆς ζωῆς τοῦ ἀρνίου τοῦ ἐσφαγμένου ἀπὸ καταβολῆς κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/008.yaml
  text: And all who dwell on the earth will worship him—everyone whose name has not been written in the book of life of the Lamb who was slain from the foundation of the world[a].
translation:
  language: sw
  text: Na wote wakaao duniani watamwabudu—yaani, kila mtu ambaye jina lake halijaandikwa katika kitabu cha uzima cha Mwana-Kondoo aliyechinjwa tangu kuwekwa misingi ya ulimwengu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kila mtu ambaye jina lake halijaandikwa tangu kuwekwa misingi ya ulimwengu katika kitabu cha uzima cha Mwana-Kondoo aliyechinjwa.” Kigiriki kinaweza kueleweka kwamba maneno “tangu kuwekwa misingi ya ulimwengu” yanaambatana ama na “aliyechinjwa” au na “halijaandikwa.”
    reason: alternative_reading
lexical_decisions:
- source_word: προσκυνήσουσιν
  choice: watamsujudia
  rationale: Katika Ufunuo, kitenzi hiki huonyesha kusujudu kwa ibada au heshima ya kidini. “Watamsujudia” huhifadhi tendo la kuinama na nguvu ya ibada katika muktadha huu.
- source_word: κατοικοῦντες ἐπὶ τῆς γῆς
  choice: wanaoishi duniani
  rationale: Ni Kiswahili cha kawaida na wazi kinachohifadhi maana ya watu wanaokaa duniani, usemi unaojirudia katika Ufunuo.
- source_word: οὗ οὐ γέγραπται τὸ ὄνομα αὐτοῦ
  choice: kila mtu ambaye jina lake halijaandikwa
  rationale: Muundo wa Kigiriki ni wa umoja baada ya kauli ya wote; “kila mtu ambaye” huonyesha wazi kwamba kinachozungumziwa ni jina la kila mmoja. “Halijaandikwa” huhifadhi hali inayotokana na tendo lililotangulia iliyo katika wakati timilifu.
- source_word: βιβλίῳ τῆς ζωῆς
  choice: kitabu cha uzima
  rationale: Huu ni usemi wa kibiblia unaoeleweka na unaotumika kwa kawaida katika Kiswahili, huku ukihifadhi taswira ya maandishi ya mbinguni.
- source_word: τοῦ ἀρνίου
  choice: cha Mwana-Kondoo
  rationale: “Mwana-Kondoo” huhifadhi cheo na taswira ya Kikristo ya dhabihu inayotumiwa kwa Yesu katika Ufunuo.
- source_word: τοῦ ἐσφαγμένου
  choice: aliyechinjwa
  rationale: Kitenzi cha Kigiriki kinaashiria kuuawa kwa nguvu na pia kina mwangwi wa dhabihu. “Aliyechinjwa” huhifadhi vipengele hivyo kuliko “aliyeuawa” pekee.
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: tangu kuwekwa msingi wa ulimwengu
  rationale: Hutoa kwa Kiswahili cha asili wazo la wakati unaoanzia kuanzishwa kwa ulimwengu na kuhifadhi sitiari ya “msingi” iliyo katika Kigiriki.
theological_decisions:
- issue: Mahali pa kuunganisha kirai “tangu kuwekwa msingi wa ulimwengu”
  choice: Katika matini kuu kimeunganishwa na “Mwana-Kondoo aliyechinjwa.”
  alternative: 'Kinaweza kuunganishwa na kuandikwa kwa jina: “ambaye jina lake halijaandikwa tangu kuwekwa msingi wa ulimwengu katika kitabu cha uzima cha Mwana-Kondoo aliyechinjwa.”'
  rationale: Mpangilio wa maneno ya Kigiriki unaweza kukiunganisha kwa karibu na kishiriki “aliyechinjwa,” lakini Ufunuo 17:8 unaunga mkono uwezekano wa kukiunganisha na kuandikwa kwa majina. Utata halisi umehifadhiwa kwa tanbihi badala ya kuamuliwa kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kimaandiko lakini kinachoeleweka kwa wasomaji wa kawaida. “Kusujudia,” “kitabu cha uzima,” na “Mwana-Kondoo” hudumisha msamiati na taswira muhimu za Ufunuo bila kuingiza ufafanuzi wa dhehebu.
