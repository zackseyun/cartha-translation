id: REV.13.18
reference: Revelation 13:18
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὧδε ἡ σοφία ἐστίν· ὁ ἔχων νοῦν ψηφισάτω τὸν ἀριθμὸν τοῦ θηρίου, ἀριθμὸς γὰρ ἀνθρώπου ἐστίν· καὶ ὁ ἀριθμὸς ⸀αὐτοῦ ⸂ἑξακόσιοι ἑξήκοντα ἕξ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/018.yaml
  text: 'Here is wisdom: let the one who has understanding calculate the number of the beast[a], for it is the number of a man[b], and its number is six hundred sixty-six.'
translation:
  language: sw
  text: 'Hapa ndipo penye hekima: aliye na ufahamu na aihesabu namba ya yule mnyama, kwa maana ni namba ya mtu[a], nayo namba yake ni mia sita sitini na sita.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “namba ya kibinadamu.”
    reason: alternative_reading
  - marker: b
    text: Baadhi ya hati zina “mia sita na kumi na sita” (616) badala ya “mia sita sitini na sita” (666).
    reason: textual_variant
lexical_decisions:
- source_word: ὧδε ἡ σοφία ἐστίν
  choice: Hapa ndipo penye hekima
  rationale: Muundo huu wa kawaida wa Kiswahili unadumisha nguvu ya mahali au hatua ya matumizi inayodokezwa na ὧδε, bila kuwa wa kizamani.
- source_word: ὁ ἔχων νοῦν
  choice: aliye na ufahamu
  rationale: νοῦς hapa ni uwezo wa kuelewa na kupambanua, si akili kama kiungo au uwezo wa jumla pekee.
- source_word: ψηφισάτω
  choice: na aihesabu
  rationale: Amri hii inamtaka msomaji afanye hesabu ili kupata au kutambua thamani ya namba; muundo wa 'na a-' unatoa himizo la nafsi ya tatu kwa Kiswahili cha kawaida.
- source_word: τὸν ἀριθμὸν τοῦ θηρίου
  choice: namba ya yule mnyama
  rationale: Neno 'namba' linaeleweka kwa urahisi katika muktadha wa thamani ya tarakimu, na 'yule mnyama' humrejelea kiumbe maalumu wa maono hayo.
- source_word: ἀριθμὸς γὰρ ἀνθρώπου ἐστίν
  choice: kwa maana ni namba ya mwanadamu
  rationale: Neno 'mwanadamu' linadumisha uwezekano wa maana ya mtu fulani au maana ya kibinadamu kwa ujumla bila kuamua mjadala ndani ya matini kuu.
- source_word: καὶ ὁ ἀριθμὸς αὐτοῦ
  choice: nayo namba yake
  rationale: Kiwakilishi 'yake' kinarejelea yule mnyama kwa kawaida katika Kiswahili na kuendeleza urudiaji wa 'namba' uliomo katika Kigiriki.
- source_word: ἑξακόσιοι ἑξήκοντα ἕξ
  choice: mia sita sitini na sita
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya tarakimu 666 katika Kiswahili.
theological_decisions:
- issue: Maana ya ἀνθρώπου katika ἀριθμὸς γὰρ ἀνθρώπου ἐστίν
  choice: namba ya mwanadamu
  alternative: namba ya mtu mmoja; au, namba ya kibinadamu
  rationale: Umilikishi wa Kigiriki unaweza kumaanisha namba inayomhusu mtu fulani au namba yenye tabia ya kibinadamu. Matini kuu inadumisha upana huo kadiri iwezekanavyo, na tanbihi inaonyesha tafsiri nyingine halali.
- issue: Tofauti ya nakala kuhusu namba
  choice: mia sita sitini na sita katika matini kuu
  alternative: mia sita na kumi na sita
  rationale: Ushahidi mkuu wa matini unaunga mkono 666, lakini baadhi ya hati zina 616; tofauti hiyo muhimu imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. 'Namba' imetumiwa kwa uthabiti kwa ἀριθμός, na sintaksia imewekwa ya asili bila kuondoa utata wa kifungu cha ἀνθρώπου.
