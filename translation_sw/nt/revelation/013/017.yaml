  text: καὶ ἵνα μή τις ⸀δύνηται ἀγοράσαι ἢ πωλῆσαι εἰ μὴ ὁ ἔχων τὸ χάραγμα, τὸ ὄνομα τοῦ θηρίου ἢ τὸν ἀριθμὸν τοῦ ὀνόματος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/017.yaml
  text: so that no one can buy or sell unless he has the mark[b][a], the name of the beast or the number of its name.
translation:
  language: sw
  text: na ili mtu yeyote asiweze kununua wala kuuza isipokuwa yule aliye na alama, jina la yule mnyama au namba ya jina lake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Muundo wa Kigiriki unaweza pia kueleweka: “alama, yaani jina la yule mnyama au namba ya jina lake.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἵνα μή τις δύνηται
  choice: na ili mtu yeyote asiweze
  rationale: Neno καί linaendeleza sentensi iliyotangulia, ἵνα linaonyesha kusudi au matokeo, μή τις linamaanisha kutokuwapo kwa mtu yeyote, na δύνηται linaeleza uwezo.
- source_word: ἀγοράσαι ἢ πωλῆσαι
  choice: kununua wala kuuza
  rationale: Vitenzi hivi vinahusu shughuli za kawaida za biashara. Katika kishazi hasi, “wala” ni ya asili katika Kiswahili na inahifadhi jozi ya kununua na kuuza.
- source_word: εἰ μὴ ὁ ἔχων
  choice: isipokuwa yule aliye na
  rationale: εἰ μή linaanzisha hali pekee ya kuondolewa katika katazo, na ὁ ἔχων ni kirai cha jumla kinachomaanisha mtu aliye na kitu hicho.
- source_word: τὸ χάραγμα
  choice: alama
  rationale: χάραγμα inaweza kuwa alama, chapa, au kitu kilichochorwa au kugongwa. “Alama” ni neno wazi na lililozoeleka katika muktadha huu wa Ufunuo.
- source_word: τὸ ὄνομα τοῦ θηρίου
  choice: jina la yule mnyama
  rationale: Hili ni jengo la umilikaji la moja kwa moja. “Yule mnyama” linaonyesha kuwa ni yule mhusika wa mfano aliyetajwa katika muktadha, si mnyama wa kawaida tu.
- source_word: ἢ τὸν ἀριθμὸν τοῦ ὀνόματος αὐτοῦ
  choice: au namba ya jina lake
  rationale: Kifungu hiki kinaeleza namba inayohusiana na jina la yule mnyama. “Jina lake” ni ya asili katika Kiswahili; kiwakilishi cha Kiswahili hakilazimishi uchaguzi wa Kiingereza kati ya “his” na “its.”
theological_decisions:
- issue: Uhusiano wa “alama,” “jina,” na “namba”
  choice: alama, jina la yule mnyama au namba ya jina lake
  alternative: alama, yaani jina la yule mnyama au namba ya jina lake
  rationale: Muundo wa Kigiriki unaweza kusomwa kama mfululizo wa vitambulisho au kama “jina” na “namba” vinavyoifafanua alama. Koma huhifadhi mvutano huo bila kuingiza “yaani,” ambalo lingeamua kuwa ni ufafanuzi.
- issue: Maana ya kijumla ya ὁ ἔχων
  choice: yule aliye na
  alternative: mtu aliye na
  rationale: Ingawa Kigiriki kina umbo la kiume la umoja, matumizi yake hapa ni ya kijumla. Kiswahili hakihitaji kuweka jinsia ya mtu huyo, hivyo “yule aliye na” huhifadhi umoja na maana ya jumla bila kuongeza jinsia isiyobainishwa na maana ya kifungu.
- issue: Mrejeo wa αὐτοῦ
  choice: jina lake
  alternative: jina la yule mnyama
  rationale: Mrejeo wa karibu ni θηρίον, “mnyama.” Kiswahili “lake” linarejelea huyo mnyama kwa kawaida bila kulazimisha tofauti ya “his/its” ya Kiingereza.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Namba” limetumiwa kwa sababu ni la kawaida na wazi kwa wasomaji wengi; sentensi imehifadhi “na ili” ya Kigiriki ili kuonyesha mwendelezo kutoka kifungu kilichotangulia.
