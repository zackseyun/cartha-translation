  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ βλέπουσιν ἐκ τῶν λαῶν καὶ φυλῶν καὶ γλωσσῶν καὶ ἐθνῶν τὸ πτῶμα αὐτῶν ἡμέρας τρεῖς ⸀καὶ ἥμισυ, καὶ τὰ πτώματα αὐτῶν οὐκ ⸀ἀφίουσιν τεθῆναι εἰς μνῆμα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/009.yaml
  text: And some from the peoples and tribes and languages and nations look at their dead bodies for three and a half days[a], and they do not allow them to be laid in a tomb.
translation:
  language: sw
  text: Baadhi ya watu kutoka katika makundi ya watu, makabila, lugha na mataifa wanaitazama maiti yao kwa siku tatu na nusu[a], nao hawaruhusu maiti zao kuwekwa katika kaburi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki kwanza husema “maiti yao” kwa umoja, kisha “maiti zao” kwa wingi. Matumizi ya umoja yanaweza kuwaonyesha mashahidi hao wawili kama shahidi mmoja wa pamoja kabla ya kurejea kwenye miili yao mmoja-mmoja.
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπουσιν
  choice: wanaitazama
  rationale: Kitenzi hiki kinaonyesha tendo la kuona au kutazama linaloendelea; “wanaitazama” ni Kiswahili cha kawaida na huhifadhi hali ya sasa yenye uhai.
- source_word: ἐκ τῶν λαῶν καὶ φυλῶν καὶ γλωσσῶν καὶ ἐθνῶν
  choice: Baadhi ya watu kutoka katika jamaa za watu, makabila, lugha na mataifa
  rationale: Kirai chenye ἐκ kinaonyesha sehemu ya watu waliotoka katika makundi hayo, si kila mtu wa kila kundi. “Baadhi ya watu kutoka katika” huweka wazi maana hiyo ya sehemu bila kuifanya kuwa ya wote.
- source_word: λαῶν
  choice: jamaa za watu
  rationale: Uwingi wa λαοί unahusu makundi ya watu. “Jamaa za watu” huitofautisha na ἐθνῶν, iliyotafsiriwa “mataifa,” ingawa usemi huu si mwepesi kama “watu.”
- source_word: φυλῶν
  choice: makabila
  rationale: “Makabila” ni tafsiri ya kawaida na inayofaa ya φυλαί katika orodha za watu katika Ufunuo.
- source_word: γλωσσῶν
  choice: lugha
  rationale: “Lugha” ni neno la sasa na la kawaida kwa makundi yanayotofautishwa kwa lugha zao.
- source_word: ἐθνῶν
  choice: mataifa
  rationale: Katika orodha hii ya Ufunuo, “mataifa” ndiyo tafsiri ya kawaida na pana; “watu wa mataifa” ingeweza kuwa finyu au kujirudia.
- source_word: τὸ πτῶμα αὐτῶν
  choice: maiti yao
  rationale: Nomino ya Kigiriki iko katika umoja ingawa inawahusu mashahidi wawili. Kiswahili kinahifadhi umoja kwa “maiti yao” pamoja na upatanisho wa umoja katika “wanaitazama.”
- source_word: ἡμέρας τρεῖς καὶ ἥμισυ
  choice: kwa siku tatu na nusu
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaoonyesha muda uliotajwa katika Kigiriki.
- source_word: τὰ πτώματα αὐτῶν
  choice: maiti zao
  rationale: Sehemu ya pili inabadilika na kutumia wingi. “Maiti zao” pamoja na kiambishi cha wingi -za- huonyesha mabadiliko hayo.
- source_word: οὐκ ἀφίουσιν
  choice: hawaruhusu
  rationale: Katika muktadha huu ἀφίημι humaanisha kutoa ruhusa, si kuacha au kusamehe.
- source_word: τεθῆναι εἰς μνῆμα
  choice: kuwekwa kaburini
  rationale: Tafsiri hii huhifadhi wazo mahususi la kuiweka maiti katika mahali pa maziko badala ya kutumia tu kitenzi kipana “kuzikwa.”
theological_decisions:
- issue: Umoja wa πτῶμα katika kishazi cha kwanza na wingi wa πτώματα katika kishazi cha pili
  choice: Kuhifadhi umoja kwanza (“maiti yao,” “wanaitazama”) na kisha wingi (“maiti zao”)
  alternative: Kutumia wingi “maiti zao” katika sehemu zote kwa mtiririko mwepesi zaidi
  rationale: Maandishi ya Kigiriki yenyewe hubadilika kutoka umoja hadi wingi. Kuyahifadhi mabadiliko hayo hakuamui ikiwa umoja unawaonyesha mashahidi wawili kama ushuhuda mmoja wa pamoja, bali huacha uwezekano huo wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Nao” huunganisha vishazi kwa mtiririko wa kawaida. Upatanisho wa kisarufi umetumiwa kufanya tofauti ya umoja na wingi ionekane wazi.
