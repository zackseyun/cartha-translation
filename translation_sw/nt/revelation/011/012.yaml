  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ⸀ἤκουσαν ⸂φωνῆς μεγάλης⸃ ἐκ τοῦ οὐρανοῦ ⸀λεγούσης αὐτοῖς· ⸀Ἀνάβατε ὧδε, καὶ ἀνέβησαν εἰς τὸν οὐρανὸν ἐν τῇ νεφέλῃ, καὶ ἐθεώρησαν αὐτοὺς οἱ ἐχθροὶ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/012.yaml
  text: And they heard a loud voice from heaven saying to them, “Come up here,” and they went up to heaven in the cloud, and their enemies watched them.
translation:
  language: sw
  text: Nao wakasikia sauti kubwa kutoka mbinguni ikiwaambia, “Pandeni huku.” Nao wakapanda kwenda mbinguni katika wingu,[a] na adui zao wakawatazama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “katika lile wingu.” Kigiriki kina “katika wingu,” kwa kibainishi, ambacho huenda kikadokeza pia taswira za kibiblia za uwepo wa Mungu na kuthibitishwa kwa watumishi wake.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσαν
  choice: wakasikia
  rationale: Kitenzi hiki kinaeleza tukio la kuisikia sauti, si tendo la kuisikiliza kwa muda.
- source_word: φωνῆς μεγάλης
  choice: sauti kubwa
  rationale: Katika Kiswahili cha kawaida, “sauti kubwa” hueleza kwa asili sauti yenye nguvu au inayosikika sana.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: kutoka mbinguni
  rationale: Katika mazingira haya ya maono na usemi wa kimungu, οὐρανός ni mbinguni, si anga tu.
- source_word: λεγούσης αὐτοῖς
  choice: ikiwaambia
  rationale: Muundo huu wa Kiswahili unaonyesha kwa uwazi kwamba sauti hiyo iliwaelekea wao.
- source_word: Ἀνάβατε ὧδε
  choice: Pandeni huku
  rationale: Wingi wa amri umehifadhiwa; “pandeni huku” ni mwito wa asili wa kuja juu mahali alipo msemaji.
- source_word: ἀνέβησαν εἰς τὸν οὐρανὸν
  choice: wakapanda kwenda mbinguni
  rationale: Huhifadhi mwendo wa kuelekea juu na lengo la kufika mbinguni bila kutumia istilahi nzito isiyohitajika.
- source_word: ἐν τῇ νεφέλῃ
  choice: ndani ya lile wingu
  rationale: “Lile” huhifadhi umaalumu wa kihusishi cha Kigiriki na uwezekano wa dokezo la wingu linalotambulika katika matukio ya uwepo wa Mungu, bila kulazimisha tafsiri hiyo.
- source_word: ἐθεώρησαν
  choice: wakawaona
  rationale: θεωρέω hapa ni kuwaona kwa kutazama tukio; “wakawaona” ni wazi na ya kawaida, ingawa maana inaweza kujumuisha kuwatazama kwa makini.
- source_word: οἱ ἐχθροὶ αὐτῶν
  choice: adui zao
  rationale: Huu ni usemi wa kawaida na wa moja kwa moja wa umilikaji katika Kiswahili.
theological_decisions:
- issue: Dokezo linalowezekana katika “lile wingu”
  choice: Kudumisha umaalumu katika matini kuu kwa “lile wingu”
  alternative: ndani ya wingu moja
  rationale: Kibainishi cha Kigiriki kinaweza kuelekeza kwenye taswira inayojulikana ya kibiblia ya wingu linalohusishwa na uwepo wa Mungu na kuthibitishwa kwa watumishi wake. Tafsiri inadumisha uwezekano huo bila kuufanya kuwa tafsiri pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Masimulizi yametumia mfululizo wa “nao... waka-” unaofaa mtindo wa kifungu, huku amri ya wingi na umaalumu wa wingu vikihifadhiwa.
