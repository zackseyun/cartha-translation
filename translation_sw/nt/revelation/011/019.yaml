id: REV.11.19
reference: Revelation 11:19
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ ἠνοίγη ὁ ναὸς τοῦ θεοῦ ⸀ὁ ἐν τῷ οὐρανῷ, καὶ ὤφθη ἡ κιβωτὸς τῆς διαθήκης ⸀αὐτοῦ ἐν τῷ ναῷ αὐτοῦ· καὶ ἐγένοντο ἀστραπαὶ καὶ φωναὶ καὶ βρονταὶ ⸂καὶ σεισμὸς⸃ καὶ χάλαζα μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/019.yaml
  text: And the temple of God in heaven was opened[a], and the ark of his covenant was seen in his temple[c][b]; and there were flashes of lightning and voices and peals of thunder and an earthquake and great hail.
translation:
  language: sw
  text: Hekalu la Mungu lililoko mbinguni likafunguliwa[a], na sanduku la agano lake likaonekana ndani ya hekalu lake[b]. Kisha kukawa na mimweko ya umeme, sauti[c], ngurumo za radi, tetemeko la ardhi na mvua kubwa ya mawe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mahali patakatifu.” Neno la Kigiriki ναός linaweza kusisitiza sehemu takatifu ya ndani, si eneo lote la hekalu.
    reason: lexical_alternative
  - marker: b
    text: Au “sanduku la agano.” Kigiriki kinasema wazi “agano lake,” yaani agano la Mungu.
    reason: lexical_alternative
  - marker: c
    text: Au “milio.” Katika Ufunuo, neno hili hutumiwa mara nyingi katika matukio yanayoonyesha ukuu na hukumu ya Mungu; linaweza kumaanisha sauti za viumbe au sauti nyingine zinazosikika.
    reason: lexical_alternative
lexical_decisions:
- source_word: ναὸς
  choice: hekalu
  rationale: “Hekalu” ni neno la kawaida na linaloeleweka kwa nyumba takatifu ya Mungu; dokezo linaonyesha kwamba ναός linaweza kusisitiza sehemu takatifu ya ndani.
- source_word: ὁ ἐν τῷ οὐρανῷ
  choice: lililoko mbinguni
  rationale: Muundo huu unaunganisha mahali pa hekalu na mbingu kwa Kiswahili cha kawaida bila kuongeza maelezo yasiyomo katika Kigiriki.
- source_word: ἠνοίγη
  choice: likafunguliwa
  rationale: Kauli tendwa inadumisha tendo la kufunguliwa bila kumtaja wazi mtendaji, kama ilivyo katika Kigiriki.
- source_word: ὤφθη
  choice: likaonekana
  rationale: Huhifadhi maana ya kuwa wazi kwa kuonekana bila kudai kwamba sanduku lenyewe lilijitokeza kwa kitendo chake.
- source_word: κιβωτὸς τῆς διαθήκης αὐτοῦ
  choice: sanduku la agano lake
  rationale: “Sanduku” na “agano” ni istilahi za kawaida za kibiblia, na “lake” linahifadhi kiwakilishi cha Kigiriki kinacholihusisha agano na Mungu.
- source_word: ἐν τῷ ναῷ αὐτοῦ
  choice: ndani ya hekalu lake
  rationale: “Ndani ya” huonyesha mahali kwa uwazi, huku “hekalu” likirudiwa kama katika chanzo na kiwakilishi “lake” kikihifadhiwa.
- source_word: ἐγένοντο
  choice: kisha kukawa na
  rationale: Huu ni usemi wa asili wa Kiswahili unaoonyesha kuanza au kutokea kwa matukio yanayoorodheshwa.
- source_word: ἀστραπαὶ
  choice: mimweko ya umeme
  rationale: Huhifadhi wingi na kueleza kwa kawaida miale ya umeme wa radi.
- source_word: φωναὶ
  choice: sauti
  rationale: “Sauti” huhifadhi upana wa φωναί, ambalo linaweza kueleweka kuwa sauti za viumbe au milio katika mandhari hii ya ufunuo wa Mungu.
- source_word: βρονταὶ
  choice: ngurumo za radi
  rationale: Ni usemi wa kawaida wa Kiswahili unaowasilisha wingi na nguvu ya radi.
- source_word: σεισμὸς
  choice: tetemeko la ardhi
  rationale: Ni tafsiri sanifu na iliyo wazi ya σεισμός katika muktadha huu.
- source_word: χάλαζα μεγάλη
  choice: mvua kubwa ya mawe
  rationale: Huwasilisha kwa Kiswahili cha kawaida ukubwa wa mvua ya mawe bila kubadili picha ya chanzo.
theological_decisions:
- issue: Maana ya hekalu la mbinguni (ναός)
  choice: hekalu
  alternative: mahali patakatifu; patakatifu pa ndani
  rationale: “Hekalu” ni la kawaida na halilazimishi maelezo mahususi kuhusu muundo wa makao ya mbinguni; maana nyembamba zaidi imetajwa katika dokezo.
- issue: Maana ya φωναὶ katika mfululizo wa ishara za ufunuo wa Mungu
  choice: sauti
  alternative: milio; sauti za viumbe
  rationale: “Sauti” inadumisha utata wa asili na mtindo unaojirudia katika Ufunuo badala ya kuamua kimya kimya kwamba ni maneno yanayosemwa au ni milio ya dhoruba pekee.
- issue: Utambulisho wa agano katika κιβωτὸς τῆς διαθήκης αὐτοῦ
  choice: agano lake
  alternative: agano
  rationale: Kiwakilishi cha Kigiriki kimehifadhiwa ili kuonyesha kwamba ni agano la Mungu, bila kuondoa uwezekano wa usemi unaojulikana “sanduku la agano.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kifasihi lakini kinachoeleweka kwa msomaji wa kawaida. Viunganishi na vitenzi vya mfululizo (“likafunguliwa,” “likaonekana,” “kukawa”) vinadumisha mwendo wa simulizi. Istilahi za kibiblia “hekalu,” “sanduku la agano,” na “tetemeko la ardhi” zimetumiwa bila kuingiza msimamo wa kimadhehebu.
