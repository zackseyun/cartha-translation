id: REV.11.6
reference: Revelation 11:6
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οὗτοι ἔχουσιν ⸂τὴν ἐξουσίαν κλεῖσαι τὸν οὐρανόν⸃, ἵνα μὴ ὑετὸς βρέχῃ τὰς ἡμέρας τῆς προφητείας αὐτῶν, καὶ ἐξουσίαν ἔχουσιν ἐπὶ τῶν ὑδάτων στρέφειν αὐτὰ εἰς αἷμα καὶ πατάξαι τὴν γῆν ⸂ἐν πάσῃ πληγῇ ὁσάκις ἐὰν θελήσωσιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/006.yaml
  text: These have the authority to shut the sky so that no rain may fall during the days of their prophecy[a], and they have authority over the waters to turn them into blood and to strike the earth with every plague as often as they wish.
translation:
  language: sw
  text: Hawa wana mamlaka ya kufunga anga, ili mvua isinyeshe katika siku za unabii wao[a]. Pia wana mamlaka juu ya maji kuyageuza kuwa damu na kuipiga dunia kwa kila pigo, kila watakapotaka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kufunga mbingu.” Neno la Kigiriki οὐρανός linaweza kumaanisha “mbingu” au “anga”; hapa “anga” limetumiwa kwa sababu muktadha unahusu mvua.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξουσίαν
  choice: mamlaka
  rationale: Neno hili linaonyesha haki au uwezo waliopewa kutenda, si nguvu ya kimwili tu.
- source_word: κλεῖσαι τὸν οὐρανόν
  choice: kufunga anga
  rationale: Katika muktadha wa kuzuia mvua, “anga” linaeleza maana inayokusudiwa kwa uwazi; “mbingu” pia inawezekana na imehifadhiwa katika tanbihi.
- source_word: ἵνα μὴ ὑετὸς βρέχῃ
  choice: ili mvua isinyeshe
  rationale: Ni Kiswahili cha kawaida kinachohifadhi kusudi au matokeo ya kufungwa kwa anga.
- source_word: τὰς ἡμέρας τῆς προφητείας αὐτῶν
  choice: katika siku za unabii wao
  rationale: Inahifadhi muundo na wazo la kipindi ambacho wanatoa unabii bila kulifasiri zaidi.
- source_word: ἐπὶ τῶν ὑδάτων
  choice: juu ya maji
  rationale: Pamoja na “mamlaka,” usemi huu unaonyesha eneo ambalo mamlaka yao inatawala; “maji” linaweza kuwa na maana ya jumla katika Kiswahili.
- source_word: στρέφειν αὐτὰ εἰς αἷμα
  choice: kuyageuza kuwa damu
  rationale: Tafsiri ya moja kwa moja na ya kawaida inayohifadhi taswira ya mabadiliko.
- source_word: πατάξαι τὴν γῆν
  choice: kuipiga dunia
  rationale: “Kuipiga” ni ya kisasa na wazi, huku “dunia” ikihifadhi upeo mpana wa γῆ katika Ufunuo.
- source_word: ἐν πάσῃ πληγῇ
  choice: kwa kila pigo
  rationale: Inafuata kwa karibu usemi wa Kigiriki bila kuongeza “aina ya”; “kwa” linaonyesha njia au chombo cha kupiga.
- source_word: ὁσάκις ἐὰν θελήσωσιν
  choice: mara nyingi kadiri watakavyo
  rationale: Inahifadhi wazo la tendo linaloweza kurudiwa kila wanapotaka.
- source_word: οὗτοι
  choice: Hawa
  rationale: Kiwakilishi cha kuonyesha kimetafsiriwa bila kuongeza “wawili,” kwa kuwa neno hilo halijarudiwa katika mstari huu.
theological_decisions:
- issue: Lugha yenye mwangwi wa matendo ya Eliya na Musa
  choice: Matendo ya kimiujiza yamewasilishwa moja kwa moja bila kuyapunguza au kuyafafanua kuwa ishara pekee.
  alternative: Kuyatafsiri waziwazi kama matendo ya mfano tu.
  rationale: Mstari unayaonyesha kama sehemu ya mamlaka waliyopewa mashahidi. Tafsiri inapaswa kudumisha taswira na mvutano wa kiapokaliptiki kuhusu kama ni halisi, ya mfano, au yote mawili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Mamlaka,” “anga,” na “pigo” ni maneno ya sasa na yaliyo wazi; muundo umegawanywa katika sentensi mbili ili usomeke kwa urahisi bila kupoteza uhusiano wa vipengele vya Kigiriki.
