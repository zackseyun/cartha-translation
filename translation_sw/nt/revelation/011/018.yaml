id: REV.11.18
reference: Revelation 11:18
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ τὰ ἔθνη ὠργίσθησαν, καὶ ἦλθεν ἡ ὀργή σου καὶ ὁ καιρὸς τῶν νεκρῶν κριθῆναι καὶ δοῦναι τὸν μισθὸν τοῖς δούλοις σου τοῖς προφήταις καὶ τοῖς ἁγίοις καὶ τοῖς φοβουμένοις τὸ ὄνομά σου, ⸂τοὺς μικροὺς καὶ τοὺς μεγάλους⸃, καὶ διαφθεῖραι τοὺς διαφθείροντας τὴν γῆν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/018.yaml
  text: And the nations became angry[a], and your wrath came, and the time for the dead to be judged, and to give the reward to your servants—the prophets, the saints, and those who fear your name[b], the small and the great—and to destroy those who destroy the earth.
translation:
  language: sw
  text: Mataifa yalikasirika, na ghadhabu yako ikaja, na wakati ukafika wa wafu kuhukumiwa, na wa kuwapa thawabu watumishi wako[a]—manabii, watakatifu, na wale wanaoliogopa jina lako, wadogo na wakubwa—na wa kuwaangamiza wale wanaoiangamiza dunia.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watumwa wako.” Neno la Kigiriki doulos linaweza kumaanisha mtumishi au mtumwa kutegemea muktadha.
    reason: alternative_reading
  - marker: b
    text: Au, “wale wanaoiharibu nchi.” Kitenzi cha Kigiriki kinaweza pia kumaanisha kuharibu au kufisidi, na neno gē linaweza kumaanisha dunia, nchi, au ardhi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθνη
  choice: mataifa
  rationale: Hurejelea kwa pamoja mataifa ya ulimwengu; “mataifa” ni neno la kawaida na linafaa katika muktadha wa hukumu ya ulimwengu.
- source_word: ὠργίσθησαν
  choice: yakakasirika
  rationale: Kitenzi kinaonyesha kwamba mataifa yalipatwa na hasira; tafsiri hii ni ya kawaida bila kuzidisha kiwango cha hisia.
- source_word: ὀργή
  choice: ghadhabu
  rationale: “Ghadhabu” huhifadhi uzito wa hukumu ya Mungu na kuitofautisha kwa mtindo na hasira ya mataifa.
- source_word: καιρός
  choice: wakati ukafika
  rationale: Katika muktadha huu ni wakati maalumu wa hukumu; muundo huu wa Kiswahili unaonyesha kwamba wakati huo uliwasili bila kuongeza maelezo yasiyo katika matini.
- source_word: τῶν νεκρῶν κριθῆναι
  choice: wafu kuhukumiwa
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kauli tendwa yenye maana ya kimahakama.
- source_word: μισθός
  choice: thawabu
  rationale: Katika muktadha wa Mungu kuwalipa watu wake, “thawabu” ni ya kawaida kuliko “mshahara” na haidokezi ajira ya kibiashara.
- source_word: δούλοις
  choice: watumishi
  rationale: Hapa ni jina la heshima kwa watu walio wa Mungu, hasa manabii; “watumishi” linafaa katika matini kuu, huku “watumwa” likihifadhiwa kama uwezekano katika tanbihi.
- source_word: προφήταις
  choice: manabii
  rationale: Ni jina la kawaida la kundi hili linalotambulika.
- source_word: ἁγίοις
  choice: watakatifu
  rationale: Huhifadhi maana ya watu waliowekwa wakfu kwa Mungu na ni istilahi ya kawaida ya kibiblia katika Kiswahili.
- source_word: φοβουμένοις τὸ ὄνομά σου
  choice: wale wanaoliogopa jina lako
  rationale: Huhifadhi nahau ya chanzo kuhusu hofu yenye uchaji kwa Mungu badala ya kuifafanua kimahubiri.
- source_word: τοὺς μικροὺς καὶ τοὺς μεγάλους
  choice: wadogo na wakubwa
  rationale: Huhifadhi jozi ya chanzo na kuonyesha watu wa kila daraja kwa Kiswahili cha kawaida.
- source_word: διαφθεῖραι τοὺς διαφθείροντας
  choice: kuwaangamiza wale wanaoiangamiza
  rationale: Kurudia kitenzi kunahifadhi mchezo wa kimakusudi wa mzizi mmoja katika Kigiriki na ulinganifu wa hukumu.
- source_word: τὴν γῆν
  choice: dunia
  rationale: Muktadha wa kiapokaliptiki na hukumu ya ulimwengu mzima unaunga mkono “dunia”; “nchi” bado inawezekana kileksika.
theological_decisions:
- issue: Maana ya δοῦλος kama jina la watu wa Mungu
  choice: watumishi
  alternative: watumwa
  rationale: Mkazo hapa ni utambulisho wao kuwa wa Mungu na kupokea thawabu, si hali yao ya utumwa. Hata hivyo, maana ya “watumwa” ni halisi kileksika na imehifadhiwa katika tanbihi.
- issue: Upeo wa γῆ
  choice: dunia
  alternative: nchi
  rationale: Muktadha wa hukumu ya mwisho unaelekea kwenye upeo wa ulimwengu mzima, lakini neno la Kigiriki linaweza pia kumaanisha nchi au ardhi; uwezekano huo umeonyeshwa katika tanbihi.
- issue: Uhusiano wa “wadogo na wakubwa” na makundi yaliyotangulia
  choice: imeachwa baada ya orodha bila kuifafanua zaidi
  alternative: kuongeza “wote” au “sawasawa”
  rationale: Muundo wa Kigiriki unaweza kueleweka kuwa unasisitiza upeo wa wale wanaoliogopa jina la Mungu au wa orodha kwa ujumla. Tafsiri haiongezi neno linalofunga maana kwa upande mmoja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka. Mfuatano wa vifungu umehifadhiwa kadiri inavyowezekana, huku sentensi ikigawanywa baada ya “ikaja” ili isomeke kwa urahisi. Alama zote za tanbihi zimewekwa mahali zinapohusika katika matini kuu.
