id: REV.11.1
reference: Revelation 11:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ ἐδόθη μοι κάλαμος ὅμοιος ῥάβδῳ, λέγων· ⸀Ἔγειρε καὶ μέτρησον τὸν ναὸν τοῦ θεοῦ καὶ τὸ θυσιαστήριον καὶ τοὺς προσκυνοῦντας ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/001.yaml
  text: And I was given a reed like a rod[a], saying, “Rise and measure the temple of God and the altar and those who worship in it.”
translation:
  language: sw
  text: Nami nikapewa mwanzi ulio kama fimbo, akisema, “Inuka, upime hekalu[a] la Mungu, madhabahu, na wale wanaoabudu humo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “patakatifu pa Mungu”; neno la Kigiriki ναός linaweza kumaanisha hasa sehemu takatifu ya ndani, si eneo lote la hekalu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδόθη μοι
  choice: nikapewa
  rationale: Kauli tendwa pamoja na kiwakilishi cha nafsi inadumisha mkazo wa Kigiriki juu ya kitu alichopewa mwonaji bila kumtaja aliyekitoa.
- source_word: κάλαμος
  choice: mwanzi
  rationale: Hii ndiyo maana ya msingi ya neno hilo; tafsiri haifanyi mwanzi kuwa kifaa cha kupimia kabla ya amri inayofuata.
- source_word: ὅμοιος ῥάβδῳ
  choice: ulio kama fimbo
  rationale: Inahifadhi ulinganisho wa wazi wa Kigiriki kati ya mwanzi na fimbo bila kuongeza ufafanuzi.
- source_word: λέγων
  choice: huku ikisemwa
  rationale: Muundo huu unawasilisha tendo la kusema bila kumtambulisha msemaji, ambaye habainishwi wazi katika Kigiriki.
- source_word: Ἔγειρε
  choice: Inuka
  rationale: Ni amri fupi, ya kawaida, na yenye hadhi inayolingana na mazingira ya maono.
- source_word: μέτρησον
  choice: ukapime
  rationale: Kitenzi kinaendeleza amri baada ya 'Inuka' kwa Kiswahili cha asili huku kikihifadhi maana ya kupima.
- source_word: ναὸν τοῦ θεοῦ
  choice: hekalu la Mungu
  rationale: Ni tafsiri ya kawaida na ya asili; tanbihi inahifadhi uwezekano kwamba ναός humaanisha hasa patakatifu pa ndani.
- source_word: θυσιαστήριον
  choice: madhabahu
  rationale: Neno hili halibainishi hapa ikiwa ni madhabahu ya uvumba au ya dhabihu, kwa hiyo tafsiri haiongezi utofautishaji huo.
- source_word: τοὺς προσκυνοῦντας
  choice: wale wanaoabudu
  rationale: Inadumisha nguvu ya kitenzi katika kirai cha Kigiriki na ni lugha ya kawaida ya Kiswahili.
- source_word: ἐν αὐτῷ
  choice: humo
  rationale: Kielezi hiki cha mahali kinarejelea kwa kawaida hekalu na kuonyesha kwamba waabudu wako ndani yake.
theological_decisions:
- issue: Maana ya ναός katika muktadha wa kiapokaliptiki
  choice: hekalu la Mungu
  alternative: patakatifu pa Mungu
  rationale: Aya yenyewe haisuluhishi ikiwa hekalu ni la kidunia, la mbinguni, au ishara ya watu wa Mungu. Tafsiri kuu haitangulizi msimamo wowote wa kieskatolojia.
- issue: Utambulisho wa msemaji unaodokezwa na λέγων
  choice: huku ikisemwa
  alternative: malaika akisema; sauti ikisema; nikaambiwa
  rationale: Kigiriki hakimtaji msemaji wazi. Muundo uliochaguliwa unaacha utambulisho huo wazi badala ya kuongeza malaika, sauti, au mhusika mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi ni wa asili kadiri iwezekanavyo huku ukihifadhi kauli tendwa, taswira ya mwanzi na fimbo, pamoja na kutotajwa wazi kwa msemaji.
