id: REV.11.7
reference: Revelation 11:7
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ ὅταν τελέσωσιν τὴν μαρτυρίαν αὐτῶν, τὸ θηρίον τὸ ἀναβαῖνον ἐκ τῆς ἀβύσσου ποιήσει μετ’ αὐτῶν πόλεμον καὶ νικήσει αὐτοὺς καὶ ἀποκτενεῖ αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/007.yaml
  text: And when they finish their testimony[a], the beast that comes up out of the abyss will make war with them and conquer them and kill them.
translation:
  language: sw
  text: Nao watakapomaliza ushuhuda wao, yule mnyama anayepanda kutoka katika shimo lisilo na mwisho atapigana nao[a], atawashinda na kuwaua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “atafanya vita dhidi yao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τελέσωσιν
  choice: watakapomaliza
  rationale: 'Muundo wa ὅταν pamoja na aoristi tegemezi unaonyesha tukio la wakati ujao: ‘watakapomaliza.’ Neno hili linaeleza kukamilisha ushuhuda wao kwa Kiswahili cha kawaida.'
- source_word: μαρτυρίαν
  choice: ushuhuda
  rationale: ‘Ushuhuda’ huhifadhi maana ya kutoa ushahidi na pia husikika kwa kawaida kama kitu kinachoweza kumalizwa.
- source_word: θηρίον
  choice: mnyama
  rationale: ‘Mnyama’ ni neno la kawaida na linalofaa kwa kiumbe huyu wa kiishara katika Ufunuo; hakuna ulazima wa kuongeza ‘mkali’ au ‘wa mwituni,’ jambo ambalo lingeongeza maana isiyotajwa hapa.
- source_word: ἀναβαῖνον
  choice: anayepanda
  rationale: Kitenzi cha wakati uliopo kilichotumika kama kivumishi kimetafsiriwa kwa kishazi cha uhusiano, kikidumisha taswira hai ya mnyama anayepanda.
- source_word: ἀβύσσου
  choice: vilindi
  rationale: ‘Vilindi’ huwasilisha wazo la ἀβύσσου kama kina kisichopimika bila kukitambulisha moja kwa moja na kuzimu au kuongeza maelezo ya ‘shimo lisilo na mwisho.’
- source_word: ποιήσει μετ’ αὐτῶν πόλεμον
  choice: atapigana nao
  rationale: Hii ni njia ya asili ya Kiswahili ya kueleza kuanzisha vita nao. ‘Nao’ inaakisi μετά pamoja na hali milikishi, huku muktadha na vitenzi vinavyofuata vikionyesha wazi uhasama.
- source_word: νικήσει
  choice: atawashinda
  rationale: ‘Atawashinda’ huhifadhi maana ya kuwashinda katika pambano na inalingana na taswira ya vita katika mstari huu.
- source_word: ἀποκτενεῖ
  choice: kuwaua
  rationale: ‘Kuwaua’ ni tafsiri ya moja kwa moja, ya sasa, na inayoeleweka kwa urahisi ya ἀποκτενεῖ.
theological_decisions:
- issue: Uhusiano wa kiuhasama katika ποιήσει μετ’ αὐτῶν πόλεμον
  choice: atapigana nao
  alternative: atafanya vita dhidi yao
  rationale: Kigiriki hutumia μετά kwa maana ya ‘nao’ ndani ya nahau ya kufanya vita. Kiswahili ‘atapigana nao’ ni cha kawaida na huhifadhi muundo huo bila kuficha uhasama, ambao unawekwa wazi na ‘atawashinda’ na ‘kuwaua.’
- issue: Maana ya ἀβύσσου
  choice: vilindi
  alternative: shimo lisilo na mwisho
  rationale: ‘Vilindi’ hudumisha taswira pana ya kina kisichopimika na huepuka kuingiza ufafanuzi wa kimapokeo kana kwamba ni sehemu ya neno lenyewe.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Mpangilio wa sentensi unabaki karibu na Kigiriki lakini umetumia ‘atapigana nao’ kwa ufasaha wa Kiswahili. Alama ya tanbihi imewekwa kwenye kishazi cha vita ambacho tanbihi inakihusu.
