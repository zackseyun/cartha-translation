id: REV.11.5
reference: Revelation 11:5
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ εἴ τις αὐτοὺς θέλει ἀδικῆσαι, πῦρ ἐκπορεύεται ἐκ τοῦ στόματος αὐτῶν καὶ κατεσθίει τοὺς ἐχθροὺς αὐτῶν· καὶ εἴ τις ⸂θελήσῃ αὐτοὺς⸃ ἀδικῆσαι, οὕτως δεῖ αὐτὸν ἀποκτανθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/005.yaml
  text: And if anyone wants to harm them[a], fire comes out of their mouth and devours their enemies; and if anyone should want to harm them, in this way he must be killed.
translation:
  language: sw
  text: Na mtu yeyote akitaka kuwadhuru, moto hutoka katika kinywa chao[a] na kuwateketeza adui zao. Na mtu yeyote akitaka kuwadhuru, ni lazima auawe vivyo hivyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “vinywa vyao.” Kigiriki kinasema kihalisi “kinywa chao”: nomino “kinywa” ni ya umoja, nayo ina kielezi cha umilikaji cha wingi, “chao.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδικῆσαι
  choice: kuwadhuru
  rationale: Katika muktadha huu wa kinabii, kitenzi kinamaanisha kuwatendea mashahidi hao jambo la kuwaumiza au kuwaangamiza; “kuwadhuru” ni Kiswahili cha kawaida na hakibainishi kupita kiasi aina ya shambulio.
- source_word: πῦρ
  choice: moto
  rationale: Huhifadhi taswira halisi na yenye nguvu ya maandishi bila kuifasiri kuwa usemi wa mfano.
- source_word: ἐκπορεύεται ἐκ τοῦ στόματος αὐτῶν
  choice: hutoka katika kinywa chao
  rationale: Hufuata karibu muundo wa Kigiriki, ambamo “kinywa” ni umoja ingawa mwenye nacho ni wingi; tanbihi inaonyesha uwezekano wa Kiswahili cha kawaida zaidi, “vinywa vyao.”
- source_word: κατεσθίει
  choice: kuwateketeza
  rationale: Katika muktadha wa moto, “kuwateketeza” huwasilisha kwa asili nguvu ya kuangamiza ya kitenzi, badala ya tafsiri ya moja kwa moja isiyo ya kawaida “kuwala kabisa.”
- source_word: ἐχθροὺς
  choice: adui
  rationale: Ni neno la kawaida na wazi kwa wale wanaowapinga mashahidi.
- source_word: θέλει / θελήσῃ
  choice: akitaka
  rationale: Muundo wa masharti “akitaka” ni wa kawaida katika Kiswahili na unaweza kutumika katika vifungu vyote viwili; tofauti ndogo ya hali za vitenzi vya Kigiriki haiwezi kudumishwa kwa kawaida bila kufanya sentensi kuwa nzito.
- source_word: οὕτως
  choice: vivyo hivyo
  rationale: Hurejelea namna ya kifo iliyoelezwa mara moja kabla, yaani kuteketezwa na moto, huku ikibaki fupi na ya kawaida.
- source_word: δεῖ
  choice: ni lazima
  rationale: Hudumisha maana ya ulazima au jambo lisiloepukika bila kuongeza chanzo chake kwa tafsiri.
- source_word: ἀποκτανθῆναι
  choice: auawe
  rationale: Ni hali tendwa iliyo wazi, ya moja kwa moja, na ya kawaida katika Kiswahili cha sasa.
theological_decisions:
- issue: Iwapo moto unaotoka kinywani ufasiriwe kuwa halisi au wa mfano
  choice: 'Taswira imehifadhiwa moja kwa moja: “moto hutoka katika kinywa chao.”'
  alternative: Kuifafanua kuwa maneno au hukumu yenye kuangamiza.
  rationale: Maandishi yenyewe yanatoa taswira bila kuieleza; tafsiri haipaswi kuamua kama ni moto halisi au ishara ya hukumu.
- issue: Nguvu ya ulazima katika δεῖ
  choice: “ni lazima auawe”
  alternative: “atauawa” au “anapaswa kuuawa”
  rationale: “Ni lazima” huhifadhi nguvu ya ulazima wa kinabii bila kubainisha kama ni amri, hatima, au ulazima wa kimungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. “Hutoka” na “kuwateketeza” huhifadhi uhai wa taswira ya kiapokaliptiki. Umoja usio wa kawaida “kinywa chao” umehifadhiwa katika matini kwa uaminifu kwa chanzo, huku tanbihi ikitoa wingi wa kawaida zaidi.
