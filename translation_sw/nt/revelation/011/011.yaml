id: REV.11.11
reference: Revelation 11:11
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ μετὰ τὰς τρεῖς ἡμέρας καὶ ἥμισυ πνεῦμα ζωῆς ἐκ τοῦ θεοῦ εἰσῆλθεν ⸂ἐν αὐτοῖς⸃, καὶ ἔστησαν ἐπὶ τοὺς πόδας αὐτῶν, καὶ φόβος μέγας ⸀ἐπέπεσεν ἐπὶ τοὺς θεωροῦντας αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/011.yaml
  text: And after the three and a half days[a], a breath of life from God entered into them, and they stood on their feet, and great fear fell on those watching them.
translation:
  language: sw
  text: Baada ya zile siku tatu na nusu, pumzi ya uzima kutoka kwa Mungu[a] ikaingia ndani yao. Wakasimama kwa miguu yao, na hofu kuu ikawapata wale waliokuwa wakiwatazama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “roho ya uzima kutoka kwa Mungu”; huenda “Roho wa uzima kutoka kwa Mungu.” Neno la Kigiriki πνεῦμα linaweza kumaanisha pumzi, roho, au Roho.
    reason: alternative_reading
lexical_decisions:
- source_word: μετὰ τὰς τρεῖς ἡμέρας καὶ ἥμισυ
  choice: Baada ya zile siku tatu na nusu
  rationale: μετά pamoja na hali ya accusative huonyesha wakati unaofuata. Neno “zile” linaakisi kibainishi cha Kigiriki na kuonyesha kipindi mahususi kilichotajwa katika muktadha wa kinabii.
- source_word: πνεῦμα ζωῆς
  choice: pumzi ya uzima
  rationale: πνεῦμα inaweza kumaanisha pumzi, roho, au Roho. Katika tukio hili la kurudishwa kwenye uhai, “pumzi ya uzima” ni ya asili katika Kiswahili na inadumisha mwangwi wa picha ya kufufuliwa katika Ezekieli 37 bila kulazimisha utambulisho mahususi kuwa Roho Mtakatifu.
- source_word: ἐκ τοῦ θεοῦ
  choice: kutoka kwa Mungu
  rationale: Hii inaonyesha wazi kwamba Mungu ndiye chanzo; “kutoka kwa Mungu” ni usemi wa kawaida na sahihi katika Kiswahili.
- source_word: εἰσῆλθεν ἐν αὐτοῖς
  choice: ikaingia ndani yao
  rationale: Usemi huu unaonyesha kuingia kwa ndani kwa njia ya kawaida katika Kiswahili, bila kufifisha maana ya kitenzi εἰσέρχομαι.
- source_word: ἔστησαν ἐπὶ τοὺς πόδας αὐτῶν
  choice: Wakasimama kwa miguu yao
  rationale: Hii ni tafsiri ya kawaida ya Kiswahili inayohifadhi tendo la wao wenyewe kusimama na picha ya kurejeshwa kwenye uhai.
- source_word: φόβος μέγας
  choice: hofu kuu
  rationale: Tafsiri ya moja kwa moja inayohifadhi uzito wa μέγας bila kuongeza dhana mahususi ya taharuki au woga uliopitiliza.
- source_word: ἐπέπεσεν ἐπὶ
  choice: ikawapata
  rationale: Ingawa kitenzi cha Kigiriki kina picha ya kuangukia, “hofu ikawapata” ni usemi wa asili wa Kiswahili unaowasilisha kwa uaminifu hofu iliyowajia watu hao.
- source_word: τοὺς θεωροῦντας αὐτούς
  choice: wale waliokuwa wakiwatazama
  rationale: Muundo wa kuendelea “waliokuwa wakiwatazama” unahifadhi hali endelevu ya participle θεωροῦντας na wazo la kutazama kwa makini.
theological_decisions:
- issue: Ikiwa πνεῦμα ζωῆς itafsiriwe kama pumzi inayotoa uhai au itambulishwe wazi kuwa Roho Mtakatifu
  choice: pumzi ya uzima kutoka kwa Mungu
  alternative: roho ya uzima kutoka kwa Mungu; au Roho wa uzima kutoka kwa Mungu
  rationale: Andiko linataja kwamba chanzo ni Mungu lakini halimtambulishi wazi Roho Mtakatifu. Matini kuu inatumia “pumzi ya uzima” ili kuhifadhi picha ya kupewa uhai na mwangwi wa Ezekieli 37, huku tanbihi ikidumisha maana nyingine halali za πνεῦμα na mvutano wa kiteolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni wazi kwa msomaji wa kawaida, huku ikihifadhi mfuatano wa matendo na uzito wa lugha ya kinabii.
