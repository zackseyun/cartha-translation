  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ τὴν αὐλὴν τὴν ἔξωθεν τοῦ ναοῦ ἔκβαλε ⸀ἔξωθεν, καὶ μὴ αὐτὴν μετρήσῃς, ὅτι ἐδόθη τοῖς ἔθνεσιν, καὶ τὴν πόλιν τὴν ἁγίαν πατήσουσιν μῆνας ⸀τεσσεράκοντα δύο.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/002.yaml
  text: But leave out the court outside the temple[a], and do not measure it, because it has been given to the nations[b], and they will trample the holy city for forty-two months.
translation:
  language: sw
  text: Na ua ulio nje ya hekalu[a], uuache nje; usiupime, kwa sababu umepewa mataifa[b], nayo yataukanyaga mji mtakatifu kwa miezi arobaini na miwili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “patakatifu.” Neno la Kigiriki ναός linaweza kumaanisha hasa sehemu takatifu ya ndani, badala ya eneo lote la hekalu.
    reason: lexical_alternative
  - marker: b
    text: Au, “watu wasio Wayahudi.” Neno la Kigiriki ἔθνεσιν linaweza kumaanisha “mataifa” au watu wasio Wayahudi, kutegemea muktadha.
    reason: alternative_reading
lexical_decisions:
- source_word: αὐλή
  choice: ua
  rationale: Katika muktadha wa hekalu, “ua” humaanisha eneo la wazi lililozungukwa na majengo au kuta, wala si uwanja wa kawaida.
- source_word: ἔξωθεν τοῦ ναοῦ
  choice: ulio nje ya hekalu
  rationale: Kifungu hiki kinaeleza mahali ua ulipo kuhusiana na ναός; tafsiri hii ni ya kawaida na inadumisha utofautishaji wa maeneo.
- source_word: ναός
  choice: hekalu
  rationale: “Hekalu” ni neno la kawaida na linaloeleweka kwa urahisi, huku maana finyu zaidi ya “patakatifu” ikihifadhiwa katika tanbihi.
- source_word: ἔκβαλε ἔξωθεν
  choice: uuache nje
  rationale: Katika muktadha huu amri inamaanisha kuutenga ua huo na upimaji, si kuutupa kihalisi. “Uuache nje” pia huhifadhi msisitizo wa ἔξωθεν.
- source_word: μὴ αὐτὴν μετρήσῃς
  choice: wala usiupime
  rationale: Huhifadhi katazo la moja kwa moja katika nafsi ya pili umoja na kuunganika kwake na amri iliyotangulia.
- source_word: ἐδόθη
  choice: umekabidhiwa
  rationale: Huhifadhi kauli tendwa na wazo la kuwekwa chini ya mamlaka ya wengine, bila kumtaja anayekabidhi.
- source_word: τοῖς ἔθνεσιν
  choice: kwa mataifa
  rationale: “Mataifa” huhifadhi maana pana ya kisiasa na ya kiunabii ya ἔθνη; maana ya “watu wa mataifa” imeonyeshwa katika tanbihi.
- source_word: πόλιν τὴν ἁγίαν
  choice: mji mtakatifu
  rationale: Ni tafsiri ya kawaida na sahihi isiyotaja moja kwa moja mji unaokusudiwa katika maono.
- source_word: πατήσουσιν
  choice: yataukanyaga
  rationale: “Kukanyaga” huhifadhi picha yenye nguvu ya kutawala kwa uhasama au kunajisi; kiwakilishi kinarejelea mji.
- source_word: μῆνας τεσσεράκοντα δύο
  choice: kwa muda wa miezi arobaini na miwili
  rationale: Huweka wazi kwamba hali hiyo itaendelea kwa kipindi hicho, kama inavyodokezwa na hali ya muda katika Kigiriki.
theological_decisions:
- issue: Upekee wa maana ya ναός katika taswira ya hekalu ya kiapokaliptiki
  choice: “Hekalu” katika matini kuu, na “patakatifu” kama uwezekano katika tanbihi.
  alternative: patakatifu
  rationale: ναός linaweza kumaanisha hasa jengo takatifu la ndani badala ya eneo lote la hekalu. Matini kuu inabaki ya kawaida na inayoeleweka, huku tanbihi ikihifadhi tofauti inayoweza kuathiri ufasiri wa maono.
- issue: Maana ya ἔθνεσιν
  choice: “Mataifa” katika matini kuu.
  alternative: watu wa mataifa
  rationale: Neno la Kigiriki linaweza kumaanisha mataifa kwa ujumla au watu wasio Wayahudi. “Mataifa” ni pana zaidi na linafaa kwa mtindo wa kiunabii wa Ufunuo, huku maana nyingine ikihifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo “ua … uuache nje” huhifadhi msisitizo na uradidi wa Kigiriki bila kuwa mgumu kupita kiasi; “nayo” huonyesha wazi kwamba mataifa ndiyo yatakayoukanyaga mji.
