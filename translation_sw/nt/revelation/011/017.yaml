id: REV.11.17
reference: Revelation 11:17
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: λέγοντες· Εὐχαριστοῦμέν σοι, κύριε, ὁ θεός, ὁ παντοκράτωρ, ὁ ὢν καὶ ὁ ἦν, ὅτι εἴληφας τὴν δύναμίν σου τὴν μεγάλην καὶ ἐβασίλευσας.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/017.yaml
  text: saying[a], “We give thanks to you, Lord God Almighty, who is and who was[b], because you have taken your great power and begun to reign.”
translation:
  language: sw
  text: wakisema, “Tunakushukuru, Bwana Mungu Mwenyezi, uliyeko na uliyekuwapo[a], kwa sababu umetwaa uweza wako mkuu na umeanza kutawala[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “yeye aliyeko na aliyekuwapo.” Baadhi ya hati na tafsiri hujumuisha mahali pengine katika Ufunuo maneno “na atakayekuja,” lakini maandishi ya Kigiriki hapa hayana maneno hayo.
    reason: textual_variant
  - marker: b
    text: Au, “umetawala” au “umekuwa Mfalme.” Kitenzi cha Kigiriki kinaweza kusisitiza kuanza au kutekeleza utawala wa kifalme; hapa huenda kinakazia kudhihirishwa wazi kwa utawala wa Mungu.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: wakisema
  rationale: Kirai cha kushiriki cha wakati uliopo, wingi, huunganisha maneno haya na tendo la wazee katika mstari uliotangulia. ‘Wakisema’ ni muunganisho wa kawaida na wa asili katika Kiswahili.
- source_word: Εὐχαριστοῦμέν σοι
  choice: Tunakushukuru
  rationale: Huwasilisha moja kwa moja maana ya kumtolea Mungu shukrani, huku kikibaki cha heshima na cha kawaida katika ibada.
- source_word: κύριε, ὁ θεός, ὁ παντοκράτωρ
  choice: Bwana Mungu Mwenyezi
  rationale: Huhifadhi mfuatano wa majina ya Mungu na neno la heshima ‘Bwana’; ‘Mwenyezi’ ni tafsiri ya kawaida na yenye nguvu ya παντοκράτωρ.
- source_word: ὁ ὢν καὶ ὁ ἦν
  choice: uliyeko na uliyekuwapo
  rationale: Huhifadhi mpangilio wa hali ya sasa na hali ya wakati uliopita katika cheo hiki cha Mungu bila kuongeza kirai ‘atakayekuja,’ ambacho hakipo katika maandishi ya Kigiriki ya mstari huu.
- source_word: ὅτι
  choice: kwa sababu
  rationale: 'Hapa kiunganishi kinaeleza sababu ya shukrani: Mungu amechukua hatua inayotajwa baada yake.'
- source_word: εἴληφας
  choice: umetwaa
  rationale: Wakati timilifu wa Kigiriki unaonyesha tendo lililotimizwa lenye matokeo ya sasa. ‘Umetwaa’ ni la heshima na linafaa kwa kitendo cha kuchukua mamlaka kwa madhumuni ya kuitumia.
- source_word: τὴν δύναμίν σου τὴν μεγάλην
  choice: uweza wako mkuu
  rationale: Huhifadhi umoja wa δύναμις pamoja na kivumishi ‘mkuu,’ na ni usemi wa asili kuhusu uwezo wa Mungu.
- source_word: ἐβασίλευσας
  choice: umeanza kutawala
  rationale: Katika muktadha huu aoristi inaweza kusisitiza kuanza au kudhihirishwa kwa utawala wa kifalme. Tafsiri hii inaonyesha mwanzo wa utekelezaji wa wazi wa utawala bila kudai kwamba hapo awali Mungu hakuwa na enzi.
theological_decisions:
- issue: Cheo cha Mungu kisichokuwa na kirai ‘atakayekuja’
  choice: uliyeko na uliyekuwapo
  alternative: uliyeko, uliyekuwapo, na atakayekuja
  rationale: SBLGNT katika mstari huu ina ὁ ὢν καὶ ὁ ἦν pekee. Tafsiri haikioanishi kifungu hiki na namna ndefu inayopatikana mahali pengine katika Ufunuo.
- issue: Maana ya ἐβασίλευσας kuhusiana na ufalme wa Mungu
  choice: umeanza kutawala
  alternative: umetawala; umekuwa Mfalme
  rationale: Muktadha unasherehekea kudhihirishwa kwa wazi na kwa uamuzi kwa utawala wa Mungu. Tafsiri hii haimaanishi kwamba Mungu alipata enzi kwa mara ya kwanza, huku tanbihi ikihifadhi uwezekano wa tafsiri zisizo na maana ya kuanza.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kiibada lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Umetwaa uweza wako mkuu’ hudumisha uzito wa lugha ya sifa, na ‘umeanza kutawala’ huwasilisha kwa uwazi nguvu inayoweza kuwa ya kuanza katika kitenzi cha Kigiriki.
