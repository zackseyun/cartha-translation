  text: Ἡ οὐαὶ ἡ δευτέρα ἀπῆλθεν· ⸂ἰδοὺ ἡ οὐαὶ ἡ τρίτη⸃ ἔρχεται ταχύ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/014.yaml
  text: The second woe has passed; behold[a], the third woe is coming quickly.
translation:
  language: sw
  text: Ole wa pili umepita; tazama, ole wa tatu unakuja haraka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hivi karibuni.” Neno la Kigiriki ταχύ linaweza kusisitiza ukaribu wa wakati au kasi ya kutokea kwa jambo.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐαί
  choice: ole
  rationale: “Ole” ni neno la kawaida la kibiblia la maombolezo na tangazo la maafa yanayokuja; hapa pia linahifadhi mpangilio wa zile ole zinazohesabiwa katika Ufunuo.
- source_word: δευτέρα
  choice: ya pili
  rationale: Namba ya mpangilio inarejelea moja kwa moja “ole” na imetafsiriwa kwa njia ya kawaida ya Kiswahili.
- source_word: ἀπῆλθεν
  choice: imepita
  rationale: Katika muktadha huu kitenzi kinaonyesha kwamba ole ya pili imekwisha; “imepita” ni ya asili na inahifadhi maana hiyo.
- source_word: ἰδού
  choice: tazama
  rationale: “Tazama” huvuta fikira za msomaji kwa dharura huku ikidumisha sauti nzito ya kinabii.
- source_word: τρίτη
  choice: ya tatu
  rationale: Namba ya mpangilio inarejelea moja kwa moja “ole” na imetafsiriwa wazi.
- source_word: ἔρχεται
  choice: inakuja
  rationale: Wakati wa sasa wa Kigiriki unaonyesha kwa uhai tukio linalokuja bila kuongeza dai kwamba liko karibu kuanza kuliko maneno yenyewe yanavyosema.
- source_word: ταχύ
  choice: kwa haraka
  rationale: “Kwa haraka” huhifadhi wazo la kasi au ghafula bila kulazimisha tafsiri ya ukaribu wa wakati; uwezekano wa maana “hivi karibuni” umeonyeshwa katika tanbihi.
theological_decisions:
- issue: Maana ya ταχύ katika muktadha wa mambo ya mwisho
  choice: kwa haraka
  alternative: hivi karibuni
  rationale: Neno ταχύ linaweza kueleweka kuwa linahusu kasi ya kutokea kwa jambo au ukaribu wake wa wakati. Matini kuu inadumisha dharura bila kuamua ratiba fulani ya mambo ya mwisho, na tanbihi inahifadhi uwezekano mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Tazama” na “ole” zinadumisha sauti nzito ya kinabii bila kufanya sentensi kuwa ngumu kwa msomaji wa kawaida.
