id: REV.11.10
reference: Revelation 11:10
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ οἱ κατοικοῦντες ἐπὶ τῆς γῆς χαίρουσιν ἐπ’ αὐτοῖς καὶ ⸀εὐφραίνονται, καὶ δῶρα ⸀πέμψουσιν ἀλλήλοις, ὅτι οὗτοι οἱ δύο προφῆται ἐβασάνισαν τοὺς κατοικοῦντας ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/010.yaml
  text: And those who dwell on the earth rejoice over them and celebrate[a], and they will send gifts to one another[b], because these two prophets tormented those who dwell on the earth.
translation:
  language: sw
  text: Nao wakaao duniani[a] wanafurahi kuhusu hao na hushangilia[b], nao watatumiana zawadi, kwa sababu manabii hawa wawili waliwatesa wakaao duniani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakazi wa dunia.” Katika Ufunuo, msemo huu hutumiwa mara nyingi kumaanisha ulimwengu unaomwasi Mungu.
    reason: lexical_alternative
  - marker: b
    text: Au “kufanya sherehe.” Kitenzi cha Kigiriki kinakazia furaha yenye hali ya sherehe.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ κατοικοῦντες ἐπὶ τῆς γῆς / τοὺς κατοικοῦντας ἐπὶ τῆς γῆς
  choice: wakaao duniani
  rationale: Huhifadhi muundo wa kitenzi kishirikishi na kurudia kwa msemo uleule katika aya, huku ‘duniani’ ikiwa Kiswahili cha kawaida kuliko ‘juu ya dunia.’
- source_word: χαίρουσιν ἐπ’ αὐτοῖς
  choice: wanafurahi kwa sababu yao
  rationale: ‘Wanafurahi’ hudumisha wakati uliopo wa Kigiriki; ‘kwa sababu yao’ huonyesha kwamba hao manabii—katika muktadha, kifo chao—ndio sababu ya furaha bila kuongeza maelezo hayo moja kwa moja katika matini.
- source_word: εὐφραίνονται
  choice: kushangilia
  rationale: Hutofautisha kitenzi hiki na χαίρουσιν na kuwasilisha furaha ya wazi yenye hali ya sherehe kwa Kiswahili cha sasa.
- source_word: δῶρα
  choice: zawadi
  rationale: Ni tafsiri ya kawaida na ya asili; muktadha unaonyesha kupeana zawadi kwa ajili ya sherehe.
- source_word: πέμψουσιν ἀλλήλοις
  choice: watatumiana
  rationale: Huhifadhi wakati ujao na wazo la kutendeana lililo katika ἀλλήλοις, kwa usemi mfupi na wa asili wa Kiswahili.
- source_word: οὗτοι οἱ δύο προφῆται
  choice: manabii hawa wawili
  rationale: Hufuata wazi kiwakilishi kionyeshi na idadi katika mpangilio wa asili wa Kiswahili.
- source_word: ἐβασάνισαν
  choice: waliwatesa
  rationale: Huhifadhi uzito wa βασανίζω na hailegezi maana kuwa ‘waliwasumbua’ tu.
theological_decisions:
- issue: Msemo unaorudiwa katika Ufunuo kuhusu wakaao duniani
  choice: wakaao duniani
  alternative: wakazi wa dunia
  rationale: Msemo wa kishirikishi umehifadhiwa mara zote mbili bila kuutafsiri moja kwa moja kuwa kundi la waasi dhidi ya Mungu; dokezo linaeleza matumizi yake mapana katika Ufunuo.
- issue: Ukali wa athari ya manabii hao kwa watu wa dunia
  choice: waliwatesa
  alternative: waliwasumbua
  rationale: Kigiriki kinaonyesha mateso au maumivu makali. Tafsiri haipaswi kupunguza nguvu hiyo wala kueleza zaidi namna mateso hayo yalivyotokea.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Wakaao’ limetumiwa kwa sauti ya kibiblia iliyoeleweka na ili kuhifadhi nguvu ya muundo unaorudiwa; ‘watatumiana’ ni usemi wa kawaida unaoonyesha kutendeana.
