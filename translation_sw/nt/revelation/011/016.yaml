id: REV.11.16
reference: Revelation 11:16
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ οἱ εἴκοσι τέσσαρες πρεσβύτεροι οἱ ἐνώπιον τοῦ ⸂θεοῦ καθήμενοι⸃ ἐπὶ τοὺς θρόνους αὐτῶν ἔπεσαν ἐπὶ τὰ πρόσωπα αὐτῶν καὶ προσεκύνησαν τῷ θεῷ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/016.yaml
  text: And the twenty-four elders, who were seated before God on their thrones, fell on their faces and worshiped God,
translation:
  language: sw
  text: Nao wale wazee ishirini na wanne waliokuwa wameketi mbele za Mungu kwenye viti vyao vya enzi, wakaanguka kifudifudi, wakamwabudu Mungu,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρεσβύτεροι
  choice: wazee
  rationale: Katika Ufunuo neno hili linawarejelea wahusika wa baraza la mbinguni wanaojulikana kama wazee, si watu wenye umri mkubwa tu.
- source_word: ἐνώπιον
  choice: mbele za
  rationale: Usemi huu wa kawaida na wenye heshima unaonyesha kuwa walikuwa katika uwepo wa Mungu.
- source_word: καθήμενοι
  choice: waliokuwa wameketi
  rationale: Unahifadhi hali yao ya kuendelea kuketi wakati tendo kuu lilipotokea.
- source_word: ἐπὶ τοὺς θρόνους αὐτῶν
  choice: juu ya viti vyao vya enzi
  rationale: Hii ni tafsiri ya kawaida inayoonyesha mahali walipoketi na kutofautisha θρόνοι na viti vya kawaida.
- source_word: ἔπεσαν ἐπὶ τὰ πρόσωπα αὐτῶν
  choice: wakaanguka kifudifudi
  rationale: Kiswahili cha asili huonyesha wazi mkao wa kujilaza uso chini kwa heshima na ibada.
- source_word: προσεκύνησαν
  choice: kumwabudu
  rationale: Kwa kuwa tendo linaelekezwa kwa Mungu katika mandhari ya kiti cha enzi cha mbinguni, maana ya ibada ndiyo inayofaa.
- source_word: θεῷ / θεοῦ
  choice: Mungu
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa θεός katika miundo yote miwili ya kisarufi.
- source_word: οἱ εἴκοσι τέσσαρες
  choice: wale ... ishirini na wanne
  rationale: “Wale” linaonyesha kundi mahususi linalojulikana tayari katika maono, huku idadi ikitolewa kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Maana ya προσκυνέω katika ibada ya mbinguni
  choice: kumwabudu
  alternative: kumsujudia / kuinama mbele yake
  rationale: Mungu ndiye anayepokea tendo hilo, hivyo maana ya kidini ya kuabudu ni ya msingi; tafsiri hii haidhoofishi tendo hilo wala kuongeza fundisho lisilokuwapo katika matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wa heshima na unaosomeka kwa urahisi. “Mbele za Mungu” na “viti vya enzi” hudumisha hadhi ya mandhari, na “kifudifudi” huwasilisha mkao kwa ufasaha bila maelezo marefu.
