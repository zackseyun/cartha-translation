id: REV.11.15
reference: Revelation 11:15
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ ὁ ἕβδομος ἄγγελος ἐσάλπισεν· καὶ ἐγένοντο φωναὶ μεγάλαι ἐν τῷ οὐρανῷ ⸀λέγοντες· Ἐγένετο ἡ βασιλεία τοῦ κόσμου τοῦ κυρίου ἡμῶν καὶ τοῦ χριστοῦ αὐτοῦ, καὶ βασιλεύσει εἰς τοὺς αἰῶνας τῶν αἰώνων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/015.yaml
  text: And the seventh angel sounded his trumpet[a], and there were loud voices in heaven, saying, “The kingdom of the world has become that of our Lord and of his Messiah[c][b], and he will reign forever and ever.”
translation:
  language: sw
  text: Malaika wa saba akapiga tarumbeta, na kukawa na sauti kubwa mbinguni, zikisema, “Ufalme wa ulimwengu[a] umekuwa wa Bwana wetu na wa Masihi wake[b], na atatawala milele na milele.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Baadhi ya hati zinasema, “falme za ulimwengu zimekuwa,” au “ufalme wa ulimwengu huu umekuwa.” Maandishi ya SBLGNT yana umoja: “ufalme wa ulimwengu umekuwa.”'
    reason: textual_variant
  - marker: b
    text: Au “Kristo wake.” Neno la Kigiriki Χριστός limetafsiriwa “Masihi” hapa ili kuhifadhi maana yake kama cheo.
    reason: lexical_alternative
  - marker: c
    text: Kihalisi, Kigiriki kinasema, “hadi zama za zama,” usemi unaomaanisha muda usio na mwisho.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσάλπισεν
  choice: akapiga tarumbeta
  rationale: Kitenzi σαλπίζω humaanisha kupiga au kutoa sauti ya tarumbeta. Kiswahili cha kawaida hutumia ‘kupiga tarumbeta’; chombo kinachodokezwa na kitenzi cha Kigiriki kimewekwa wazi bila kuongeza maana ngeni.
- source_word: φωναὶ μεγάλαι
  choice: sauti kubwa
  rationale: Kwa kuwa sauti hizo zinafuatiwa na ‘zikisema,’ zinawakilisha usemi unaosikika. ‘Sauti kubwa’ ni usemi wa kawaida wa Kiswahili unaowasilisha nguvu ya μεγάλαι.
- source_word: ἐν τῷ οὐρανῷ
  choice: mbinguni
  rationale: Katika mazingira haya ya Ufunuo, οὐρανός ni makao ya mbinguni, si anga la kawaida.
- source_word: λέγοντες
  choice: zikisema
  rationale: Uundaji wa kishirikishi umetafsiriwa kwa mtiririko wa kawaida wa Kiswahili. Upatanisho usio wa kawaida wa kisarufi kati ya λέγοντες na φωναί katika Kigiriki hauhitaji kuigwa kwa namna isiyo ya asili.
- source_word: Ἐγένετο ἡ βασιλεία τοῦ κόσμου
  choice: Ufalme wa ulimwengu umekuwa
  rationale: Maandishi ya SBLGNT yana βασιλεία katika umoja, kwa hiyo ‘ufalme,’ si ‘falme.’ ‘Umekuwa’ linawasilisha tangazo la jambo lililotimia na ambalo matokeo yake yapo sasa.
- source_word: τοῦ κυρίου ἡμῶν
  choice: wa Bwana wetu
  rationale: Muundo huu unaonyesha kuwa ufalme sasa ni mali au chini ya mamlaka ya Bwana wetu. ‘Wa Bwana wetu’ ni wa kawaida na wazi katika Kiswahili.
- source_word: τοῦ χριστοῦ αὐτοῦ
  choice: wa Masihi wake
  rationale: Χριστός hapa ni cheo cha mteule aliyetiwa mafuta, hasa katika uhusiano wa ‘Masihi wake,’ hivyo ‘Masihi’ huhifadhi maana hiyo ya cheo.
- source_word: καὶ βασιλεύσει
  choice: na atatawala
  rationale: Kitenzi cha Kigiriki kiko katika umoja na hakina kiwakilishi cha wazi. Kiswahili pia kinaweza kuacha mtendaji akidokezwa na kiambishi a-, hivyo hudumisha umoja bila kufafanua zaidi ya maandishi mtendaji hasa ni nani.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: milele na milele
  rationale: Huu ni usemi wa Kigiriki unaoonyesha muda usio na mwisho. ‘Milele na milele’ ni Kiswahili cha asili chenye mkazo unaolingana.
theological_decisions:
- issue: Tafsiri ya Χριστός
  choice: Masihi
  alternative: Kristo
  rationale: Neno hili linatumika kama cheo, si kama jina tu. ‘Masihi wake’ hudumisha dhana ya mteule aliyetiwa mafuta na uhusiano unaoonyeshwa na αὐτοῦ.
- issue: Mtendaji wa βασιλεύσει
  choice: na atatawala
  alternative: nao watatawala / Bwana na Masihi wake watatawala
  rationale: Kitenzi βασιλεύσει kiko katika umoja, lakini Kigiriki hakimtaji mtendaji kwa uwazi. Tafsiri inadumisha umoja na ufupi huo badala ya kuamua kwamba ni watu wawili au kumtaja mmoja kwa wazi zaidi kuliko chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imeundwa kwa mtiririko wa tangazo la kifalme bila kutumia lugha ya kizamani. ‘Sauti kubwa zikasikika’ imeweka wazi tukio la sauti kuwapo mbinguni kwa Kiswahili cha asili, huku ‘zikisema’ ikihifadhi yaliyomo katika tangazo.
