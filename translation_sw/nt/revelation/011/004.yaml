base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/004.yaml
  text: These are the two olive trees and the two lampstands standing before the Lord of the earth[a][b].
translation:
  language: sw
  text: Hawa ndio miti miwili ya mizeituni na vinara viwili vya taa, waliosimama mbele za Bwana wa dunia.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hii inadokeza Zekaria 4, ambako taswira ya miti ya mizeituni na kinara cha taa inawakilisha watumishi waliowekwa na Mungu na kutiwa nguvu na Roho wake.
    reason: cross_reference
  - marker: b
    text: Au, “ambao wamesimama mbele za Bwana wa dunia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὗτοί
  choice: Hawa
  rationale: Kiwakilishi cha kuonyesha cha wingi katika ngeli ya watu kinawarejelea mashahidi wawili waliotangulia, bila kuingiza neno “mashahidi” lisilokuwamo wazi katika mstari huu.
- source_word: ἐλαῖαι
  choice: miti ya mizeituni
  rationale: Huhifadhi taswira ya miti, si matunda pekee, na mwangwi wa Zekaria 4.
- source_word: λυχνίαι
  choice: vinara vya taa
  rationale: Neno hili humaanisha vyombo vinavyoshikilia taa, wala si taa zenyewe; tafsiri hii pia huhifadhi taswira muhimu katika Ufunuo.
- source_word: ἐνώπιον
  choice: mbele za
  rationale: Ni usemi wa kawaida na wenye heshima unaoonyesha kusimama katika uwepo wa mwenye mamlaka.
- source_word: κυρίου
  choice: Bwana
  rationale: Huhifadhi cheo cha heshima na uzito wake wa kitheolojia katika kifungu hiki.
- source_word: γῆς
  choice: dunia
  rationale: Katika upeo wa Ufunuo, maana ya ulimwengu wa nchi kavu kwa ujumla inafaa kuliko “nchi” fulani, na huonyesha mamlaka ya Bwana yaliyoenea pote.
- source_word: ἑστῶτες
  choice: waliosimama
  rationale: Hutoa kishazi tegemezi cha asili kwa Kiswahili na kuhifadhi hali ya kuwa wamesimama, huku pia ikiakisi upatanisho wa kiume wa participio ya Kigiriki unaoweza kuwarejelea wale watu wawili.
theological_decisions:
- issue: Uhusiano wa taswira na Zekaria 4 pamoja na utambulisho wa mashahidi wawili
  choice: 'Taswira imetolewa moja kwa moja: “ile miti miwili ya mizeituni na vile vinara viwili vya taa,” bila kuifafanua katika matini kuu.'
  alternative: “Mashahidi hawa wawili ni kama miti miwili ya mizeituni na vinara viwili vya taa.”
  rationale: Kigiriki kinawatambulisha kwa taswira ya kinabii badala ya kutumia tashbihi ya wazi. Kudumisha sitiari huhifadhi mwangwi wa Zekaria 4 na kutoamua maana yake kwa niaba ya msomaji.
- issue: Kirejeleo cha ἑστῶτες
  choice: “waliosimama,” kikirejelea wale wawili wanaotajwa kwa “Hawa.”
  alternative: “vinavyosimama,” kikihusisha moja kwa moja miti na vinara.
  rationale: Participio ya Kigiriki ni ya kiume katika wingi, ingawa nomino za “miti ya mizeituni” na “vinara” ni za kike katika Kigiriki. Kiswahili haliwezi kuonyesha tofauti hiyo kwa namna ileile bila ufafanuzi; chaguo hili linahifadhi uwezekano wa kirejeleo cha watu, huku tanbihi ikionyesha tafsiri mbadala.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Mbele za Bwana” ni usemi wa kibiblia unaoeleweka kwa urahisi; “vinara vya taa” huepuka kuchanganya vinara na taa zenyewe. Viashiria “ile/vile” vinapatana na nomino zinazotambulishwa baada ya “Hawa ndio” na kudumisha ufasaha wa Kiswahili.
