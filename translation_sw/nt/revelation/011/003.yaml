id: REV.11.3
reference: Revelation 11:3
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ δώσω τοῖς δυσὶν μάρτυσίν μου, καὶ προφητεύσουσιν ἡμέρας χιλίας διακοσίας ἑξήκοντα, ⸀περιβεβλημένοι σάκκους.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/003.yaml
  text: And I will grant to my two witnesses[a], and they will prophesy for one thousand two hundred sixty days[b], clothed in sackcloth.
translation:
  language: sw
  text: Nami nitawapa mashahidi wangu wawili, nao watatoa unabii kwa muda wa siku elfu moja mia mbili na sitini, wakiwa wamevaa nguo za magunia[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Nguo za magunia zilihusishwa na maombolezo, toba, na maombolezo ya kinabii.
    reason: cultural_note
lexical_decisions:
- source_word: δώσω
  choice: nitawapa
  rationale: Kitenzi kinamaanisha kihalisi ‘nitatoa/nitawapa.’ Kiswahili kinaweza kuacha kitu kinachotolewa bila kutajwa kwa namna inayoeleweka kuliko Kiingereza, hivyo tafsiri hii inalinda utata wa Kigiriki bila kuongeza ‘mamlaka’ au ‘agizo.’
- source_word: τοῖς δυσὶν μάρτυσίν μου
  choice: mashahidi wangu wawili
  rationale: Hii ni tungo ya kawaida ya umilikaji katika Kiswahili na inadumisha maana ya ushuhuda ya μάρτυς.
- source_word: προφητεύσουσιν
  choice: watatoa unabii
  rationale: Ni usemi wa kawaida na wazi katika Kiswahili unaowasilisha tendo la kusema ujumbe wa kinabii.
- source_word: ἡμέρας χιλίας διακοσίας ἑξήκοντα
  choice: kwa muda wa siku elfu moja mia mbili na sitini
  rationale: Hali ya accusative inaonyesha muda; ‘kwa muda wa’ huifanya maana hiyo iwe wazi na ya asili katika Kiswahili.
- source_word: περιβεβλημένοι
  choice: wakiwa wamevaa
  rationale: 'Inawakilisha hali endelevu inayoonyeshwa na participle ya wakati timilifu: walikuwa katika hali ya kuwa wamevikwa.'
- source_word: σάκκους
  choice: nguo za magunia
  rationale: Kigiriki kinatumia wingi wa ‘magunia,’ lakini hapa ni mavazi ya kitambaa kigumu cha magunia. ‘Nguo za magunia’ ni wazi kwa msomaji wa kawaida huku ikihifadhi taswira ya kale.
theological_decisions:
- issue: Kitu kisichotajwa baada ya δώσω
  choice: Kudumisha usemi ‘nitawapa’ bila kutaja kitu walichopewa
  alternative: nitawapa mamlaka; nitawaagiza
  rationale: Kigiriki hakitaji kitu kinachotolewa. Muktadha unaunganisha utoaji huo na kutoa unabii, lakini kuongeza ‘mamlaka’ au ‘agizo’ kungeamua jambo ambalo maandishi yameliacha wazi. Kiswahili kinaruhusu usemi huu kwa uzito wa kinabii unaoeleweka.
- issue: Maana ya ishara ya σάκκους
  choice: Kuhifadhi taswira ‘nguo za magunia’ katika matini kuu
  alternative: wakiwa wamevaa mavazi ya maombolezo
  rationale: Nguo za magunia zilihusishwa na maombolezo, toba, na kilio cha kinabii, lakini aya yenyewe haitafsiri ishara hiyo. Maelezo yanawekwa tanbihani ili kuepuka kufunga maana yake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka. ‘Nami’ hudumisha kiunganishi καὶ kwa mtiririko wa kinabii. ‘Nguo za magunia’ huepuka neno la kitaalamu lisiloeleweka kwa urahisi.
