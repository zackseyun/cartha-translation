id: REV.11.13
reference: Revelation 11:13
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἐν ἐκείνῃ τῇ ⸀ὥρᾳ ἐγένετο σεισμὸς μέγας, καὶ τὸ δέκατον τῆς πόλεως ἔπεσεν, καὶ ἀπεκτάνθησαν ἐν τῷ σεισμῷ ὀνόματα ἀνθρώπων χιλιάδες ἑπτά, καὶ οἱ λοιποὶ ἔμφοβοι ἐγένοντο καὶ ἔδωκαν δόξαν τῷ θεῷ τοῦ οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/013.yaml
  text: And in that hour there was a great earthquake[a], and a tenth of the city fell, and seven thousand people were killed in the earthquake, and the rest became terrified and gave glory to the God of heaven.
translation:
  language: sw
  text: Na katika saa ile kulitokea tetemeko kubwa la ardhi; sehemu moja ya kumi ya mji ikaanguka, na watu elfu saba[a] wakauawa katika tetemeko hilo. Wale waliosalia wakaingiwa na hofu kuu, wakampa Mungu wa mbinguni utukufu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri halisi, “majina ya watu, elfu saba”—usemi unaomaanisha watu elfu saba walihesabiwa miongoni mwa waliokufa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: katika saa ile
  rationale: Huhifadhi alama ya wakati iliyo wazi na ya ghafla katika lugha ya maono, huku ikiwa Kiswahili cha kawaida.
- source_word: ἐγένετο σεισμὸς μέγας
  choice: kulitokea tetemeko kubwa la ardhi
  rationale: “Kulitokea” huwasilisha tukio kwa ufasaha, na “tetemeko kubwa la ardhi” ni tafsiri ya moja kwa moja na inayoeleweka ya σεισμὸς μέγας.
- source_word: τὸ δέκατον τῆς πόλεως
  choice: sehemu moja ya kumi ya mji
  rationale: Huhifadhi kiwango kamili cha sehemu kinachotajwa na Kigiriki.
- source_word: ἔπεσεν
  choice: ikaanguka
  rationale: Ni kisawe cha moja kwa moja kinachoacha namna hasa ya uharibifu bila kuifafanua zaidi kuwa kubomoka.
- source_word: ὀνόματα ἀνθρώπων χιλιάδες ἑπτά
  choice: watu elfu saba
  rationale: Kirai halisi “majina ya watu” kinatumika kwa maana ya watu wanaohesabiwa; Kiswahili cha kawaida husema “watu elfu saba,” huku umbo halisi likielezwa katika tanbihi.
- source_word: οἱ λοιποὶ
  choice: wale waliosalia
  rationale: Hutoa maana ya “wengine waliosalia” kwa kawaida bila kuongeza dai la kitheolojia kuhusu hali yao.
- source_word: ἔμφοβοι ἐγένοντο
  choice: wakaingiwa na hofu kuu
  rationale: Huwasilisha kuanza kwa hali ya hofu pamoja na uzito wa ἔμφοβοι kwa lugha ya kawaida na yenye hadhi.
- source_word: ἔδωκαν δόξαν
  choice: wakampa utukufu
  rationale: Huhifadhi nahau ya kibiblia ya kumpa Mungu utukufu badala ya kuitafsiri moja kwa moja kuwa toba au imani.
- source_word: τῷ θεῷ τοῦ οὐρανοῦ
  choice: Mungu wa mbinguni
  rationale: Huhifadhi cheo cha Kigiriki na ni usemi wa kawaida wa kibiblia katika Kiswahili.
theological_decisions:
- issue: Iwapo tendo la wale waliosalia linaonyesha toba ya kweli au imani iokoayo
  choice: wakaingiwa na hofu kuu, wakampa utukufu Mungu wa mbinguni
  alternative: walitubu na kumwamini Mungu; au walikiri tu nguvu zake kwa hofu
  rationale: Kigiriki kinataja hofu na kumpa Mungu utukufu, lakini hakielezi wazi ubora wa ndani wa mwitikio wao. Tafsiri inadumisha mvutano huo bila kuamua kwamba waliongoka au kwamba kukiri kwao kulikuwa kwa nje tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa masimulizi ya maono umehifadhiwa kwa vitenzi vinavyofuatana, huku nahau isiyo ya kawaida ya “majina ya watu” ikiwekwa katika tanbihi.
