id: REV.11.8
reference: Revelation 11:8
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ τὸ πτῶμα αὐτῶν ἐπὶ τῆς πλατείας τῆς πόλεως τῆς μεγάλης, ἥτις καλεῖται πνευματικῶς Σόδομα καὶ Αἴγυπτος, ὅπου καὶ ὁ κύριος αὐτῶν ἐσταυρώθη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/008.yaml
  text: And their dead bodies lie in the street of the great city[a], which is spiritually called Sodom and Egypt[c][b], where also their Lord was crucified.
translation:
  language: sw
  text: Na maiti yao[a] itakuwa katika barabara ya mji ule mkubwa[b], ambao kwa maana ya kiroho[c] unaitwa Sodoma na Misri, ambako pia Bwana wao alisulubiwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki kinasema kwa umoja, “maiti yao,” ingawa kinawarejelea mashahidi wawili; huenda kinawatazama kama kitu kimoja. Tafsiri nyingine husema “maiti zao.”
    reason: alternative_reading
  - marker: b
    text: Maneno “ambako pia Bwana wao alisulubiwa” yanaelekeza Yerusalemu, ingawa andiko linahifadhi jina la kiishara “mji ule mkubwa.”
    reason: cross_reference
  - marker: c
    text: Au, “kwa njia ya mfano.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ πτῶμα αὐτῶν
  choice: mwili wao uliokufa
  rationale: Neno πτῶμα humaanisha mwili ulioanguka au maiti. Umoja wa Kigiriki umehifadhiwa ili kuonyesha kwamba mashahidi hao wawili wanatazamwa kwa pamoja; ‘mwili uliokufa’ ni wa heshima na unaeleweka katika Kiswahili cha kawaida.
- source_word: ἐπὶ τῆς πλατείας
  choice: katika barabara
  rationale: πλατεῖα inaweza kuwa barabara pana au uwanja wa wazi wa mjini. ‘Katika barabara’ ni tafsiri ya kawaida isiyofunga maana kwa uwanja maalumu.
- source_word: τῆς πόλεως τῆς μεγάλης
  choice: ya mji ule mkubwa
  rationale: Inahifadhi jina la kiapokaliptiki ‘mji ule mkubwa’ badala ya kuutaja moja kwa moja kuwa Yerusalemu.
- source_word: πνευματικῶς
  choice: kwa maana ya kiroho
  rationale: Hutoa kwa uwazi maana ya msingi ya kielezi hicho bila kuipunguza iwe tamathali ya lugha tu; uwezekano wa ‘kwa njia ya mfano’ umewekwa katika tanbihi.
- source_word: Σόδομα καὶ Αἴγυπτος
  choice: Sodoma na Misri
  rationale: Majina yametolewa kwa maumbo yaliyozoeleka katika Kiswahili, huku uhusiano wao wa kiishara ukiachwa ndani ya usemi wa Yohana.
- source_word: ὁ κύριος αὐτῶν
  choice: Bwana wao
  rationale: ‘Bwana’ huhifadhi uzito wa cheo κύριος na kiwakilishi ‘wao’ kinarejelea mashahidi wawili.
- source_word: ἐσταυρώθη
  choice: alisulubiwa
  rationale: Ni tafsiri ya kawaida ya kitenzi cha wakati uliopita katika hali ya kutendwa, ikirejelea tukio la kihistoria.
theological_decisions:
- issue: Umoja wa πτῶμα huku wenye mwili wakiwa mashahidi wawili
  choice: mwili wao uliokufa
  alternative: miili yao iliyokufa
  rationale: Kigiriki kina nomino ya umoja, ambayo huenda inawasilisha mashahidi hao wawili kama kitu kimoja. Umoja umehifadhiwa, na tanbihi inafafanua usemi huo usio wa kawaida.
- issue: Maana ya πνευματικῶς katika kuitaja Sodoma na Misri
  choice: kwa maana ya kiroho
  alternative: kwa njia ya mfano
  rationale: Tafsiri hii inafuata kielezi cha Kigiriki kwa karibu na kuhifadhi mvutano kati ya maana ya kiroho na ya kiishara badala ya kuamua kwamba ni tamathali tu.
- issue: Utambulisho wa ‘mji ule mkubwa’
  choice: kuacha utambulisho wake ndani ya lugha ya kiishara ya andiko
  alternative: kutaja Yerusalemu waziwazi
  rationale: Maneno ‘ambako pia Bwana wao alisulubiwa’ yanaelekeza Yerusalemu, lakini andiko lenyewe linaendelea kutumia jina la kiapokaliptiki. Tanbihi inaeleza uhusiano huo bila kubadili matini.
- issue: Kukosekana kwa kitenzi wazi katika kishazi cha Kigiriki
  choice: utakuwa katika barabara
  alternative: utalala barabarani
  rationale: Kigiriki kina kishazi cha kinomino bila kitenzi kilichoandikwa hapa. Kiswahili huhitaji kiarifu ili sentensi iwe ya kawaida; ‘utakuwa’ kinakamilisha sarufi bila kuongeza taswira mahususi ya kulala.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa kiapokaliptiki na umoja usio wa kawaida wa ‘mwili wao’ umehifadhiwa; tanbihi zimewekwa mara tu baada ya maneno yanayohusika.
