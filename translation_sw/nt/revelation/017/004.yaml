  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἡ γυνὴ ἦν περιβεβλημένη πορφυροῦν καὶ κόκκινον, ⸀καὶ κεχρυσωμένη ⸀χρυσίῳ καὶ λίθῳ τιμίῳ καὶ μαργαρίταις, ἔχουσα ποτήριον χρυσοῦν ἐν τῇ χειρὶ αὐτῆς γέμον βδελυγμάτων καὶ τὰ ἀκάθαρτα τῆς πορνείας αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/004.yaml
  text: And the woman was clothed in purple and scarlet[a], and adorned with gold and precious stones and pearls, holding in her hand a golden cup full of abominations and the unclean things of her sexual immorality.
translation:
  language: sw
  text: Mwanamke huyo alikuwa amevaa nguo za rangi ya zambarau na nyekundu angavu, naye alikuwa amepambwa kwa dhahabu, mawe ya thamani na lulu. Mkononi mwake alikuwa ameshika kikombe cha dhahabu kilichojaa machukizo na vitu vichafu vya uasherati wake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ukahaba” au “uzinzi.” Katika Ufunuo, neno la Kigiriki linaweza kumaanisha uasherati halisi na pia kutumiwa kwa mfano kuhusu kutokuwa mwaminifu kiroho.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιβεβλημένη
  choice: alikuwa amevaa nguo
  rationale: Muundo wa hali timilifu unaeleza hali yake ya kuwa amevalishwa; Kiswahili hiki ni cha kawaida na kinaweka wazi kwamba rangi hizo ni za mavazi.
- source_word: πορφυροῦν καὶ κόκκινον
  choice: za rangi ya zambarau na nyekundu
  rationale: Huhifadhi rangi mbili za anasa na fahari bila kuongeza maana ya kifalme ambayo haijasemwa wazi.
- source_word: κεχρυσωμένη
  choice: alikuwa amepambwa
  rationale: Hutoa maana ya kupambwa au kurembeshwa, badala ya kudai kwamba mwili au mavazi yake yalifunikwa kabisa kwa dhahabu.
- source_word: χρυσίῳ καὶ λίθῳ τιμίῳ καὶ μαργαρίταις
  choice: kwa dhahabu, mawe ya thamani na lulu
  rationale: Ni orodha ya mapambo ya gharama kubwa; ‘mawe ya thamani’ ni usemi wa kawaida wa Kiswahili kwa maana ya kijumla ya λίθῳ τιμίῳ.
- source_word: ποτήριον χρυσοῦν
  choice: kikombe cha dhahabu
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya chombo kilichotengenezwa kwa dhahabu.
- source_word: γέμον
  choice: kilichojaa
  rationale: Huhifadhi hali ya kikombe kuwa kimejaa na huunganisha kwa kawaida yaliyomo ndani yake.
- source_word: βδελυγμάτων
  choice: machukizo
  rationale: Neno hili lina uzito mkubwa wa kimaadili na kidini unaolingana na matumizi ya kiapokaliptiki.
- source_word: τὰ ἀκάθαρτα
  choice: vitu vichafu
  rationale: Hufuata nomino ya wingi iliyotumiwa kama kitu na kuhifadhi wazo la uchafu wa kimaadili au kidini bila kulipunguza kuwa ‘uchafu’ wa kawaida pekee.
- source_word: πορνείας
  choice: uasherati
  rationale: Ni neno pana na linaloeleweka kwa upotovu wa kingono, huku muktadha wa Ufunuo ukiruhusu pia nguvu yake ya mfano kuhusu kutokuwa mwaminifu kiroho.
theological_decisions:
- issue: Maana ya πορνεία katika taswira ya kiapokaliptiki ya mwanamke
  choice: uasherati
  alternative: ukahaba
  rationale: ‘Uasherati’ huhifadhi upana wa makosa ya kingono na bado inaweza kubeba taswira ya kutokuwa mwaminifu kiroho. ‘Ukahaba’ ungeelekeza zaidi kwenye biashara ya ngono na hivyo kuifanya maana kuwa finyu kuliko Kigiriki kinavyolazimisha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imegawanywa mara mbili ili kuepuka msururu mzito wa viunganishi huku mpangilio wa taswira na uhusiano wa vipashio ukihifadhiwa.
