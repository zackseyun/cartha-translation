id: REV.17.17
reference: Revelation 17:17
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὁ γὰρ θεὸς ἔδωκεν εἰς τὰς καρδίας αὐτῶν ποιῆσαι τὴν γνώμην αὐτοῦ, καὶ ποιῆσαι ⸂μίαν γνώμην⸃ καὶ δοῦναι τὴν βασιλείαν αὐτῶν τῷ θηρίῳ, ἄχρι ⸀τελεσθήσονται οἱ λόγοι τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/017.yaml
  text: For God put it into their hearts to carry out his purpose[a], and to act with one purpose and to give their kingdom to the beast[b], until the words of God are fulfilled.
translation:
  language: sw
  text: Kwa maana Mungu aliweka mioyoni mwao kutimiza kusudi lake, kuwa na kusudi moja, na kumpa yule mnyama ufalme wao, mpaka maneno ya Mungu yatimie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔδωκεν εἰς τὰς καρδίας αὐτῶν
  choice: aliweka mioyoni mwao
  rationale: Hii ni nahau inayoonyesha Mungu akiwachochea kwa ndani; ‘aliweka mioyoni mwao’ ni Kiswahili cha kawaida kinachohifadhi taswira ya moyo bila kudokeza uhamisho halisi.
- source_word: ποιῆσαι τὴν γνώμην αὐτοῦ
  choice: kutimiza kusudi lake
  rationale: γνώμη hapa ni nia au kusudi la Mungu, na ποιῆσαι ina maana ya kulitekeleza. ‘Kutimiza kusudi lake’ ni ya asili na inaendana na muktadha wa unabii.
- source_word: ποιῆσαι μίαν γνώμην
  choice: kuwa na kusudi moja
  rationale: Usemi wa Kigiriki ni mfupi, kihalisi ‘kufanya kusudi moja.’ Tafsiri hii inaonyesha umoja wa nia ya wafalme huku ikiepuka Kiswahili kisicho cha kawaida.
- source_word: δοῦναι τὴν βασιλείαν αὐτῶν
  choice: kumpa yule mnyama ufalme wao
  rationale: ‘Ufalme wao’ huhifadhi umoja wa βασιλεία pamoja na kiwakilishi cha wingi, na ‘kumpa’ hudumisha tendo la kukabidhi linalotajwa na δοῦναι.
- source_word: τῷ θηρίῳ
  choice: yule mnyama
  rationale: ‘Mnyama’ huhifadhi taswira kuu na istilahi inayorudiwa katika Ufunuo; ‘yule’ humtambulisha mnyama anayejulikana katika muktadha.
- source_word: ἄχρι τελεσθήσονται οἱ λόγοι τοῦ θεοῦ
  choice: mpaka maneno ya Mungu yatimie
  rationale: Kitenzi cha hali ya kutendwa τελεσθήσονται kinaonyesha kufikia ukamilifu au kutimia. ‘Maneno ya Mungu yatimie’ ni usemi wa kawaida wa kinabii na hauongezi ufafanuzi usiotajwa.
theological_decisions:
- issue: Enzi kuu ya Mungu na uwajibikaji wa wafalme
  choice: Kusema wazi kwamba Mungu aliweka jambo hilo mioyoni mwao, huku wafalme wenyewe wakitimiza kusudi hilo, wakawa na kusudi moja, na wakampa mnyama ufalme wao.
  alternative: Kulainisha tendo la Mungu kwa kusema ‘aliwaruhusu,’ au kuongeza lugha ya ulazimishaji ambayo haimo katika Kigiriki.
  rationale: Aya inashikilia pamoja tendo la Mungu linalosababisha na matendo halisi ya watawala. Tafsiri haiondoi mvutano huo wa kiteolojia wala kuuzidisha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wazi kwa wasomaji wa kawaida, huku marudio ya ‘kusudi’ yakihifadhi uhusiano wa γνώμη katika vifungu vyote viwili.
