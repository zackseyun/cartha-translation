  text: οἱ πέντε ἔπεσαν, ὁ εἷς ἔστιν, ὁ ἄλλος οὔπω ἦλθεν, καὶ ὅταν ἔλθῃ ὀλίγον ⸂αὐτὸν δεῖ⸃ μεῖναι,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/010.yaml
  text: Five have fallen[a], one is, the other has not yet come; and when he comes, he must remain for a little while.
translation:
  language: sw
  text: Watano wameanguka[a], mmoja yuko, mwingine bado hajaja; atakapokuja, lazima adumu kwa muda mfupi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa uwazi zaidi katika muktadha: “Wafalme watano wameanguka, mfalme mmoja yuko, na mfalme mwingine bado hajaja.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πέντε
  choice: Watano
  rationale: Kiambishi cha ngeli ya watu kinaonyesha kwamba wanaorejelewa ni wale wafalme saba waliotajwa katika mstari uliotangulia; Kiswahili hakihitaji kurudia nomino hapa.
- source_word: ἔπεσαν
  choice: wameanguka
  rationale: Wakati timilifu unaeleza kuanguka kwao kama tukio lililokamilika lenye matokeo yanayoendelea, bila kufafanua zaidi aina ya kuondolewa kwao.
- source_word: ὁ εἷς ἔστιν
  choice: mmoja yupo
  rationale: Huhifadhi usemi mfupi wa Kigiriki na huepuka kuufasiri kimyakimya kuwa ‘anatawala’ au ‘amesalia.’
- source_word: ὁ ἄλλος
  choice: yule mwingine
  rationale: ‘Yule mwingine’ humtenganisha mfalme anayefuata katika mlolongo na wale waliotangulia.
- source_word: οὔπω ἦλθεν
  choice: bado hajaja
  rationale: Ni usemi wa kawaida wa Kiswahili kwa ujio unaotarajiwa ambao haujatokea mpaka sasa.
- source_word: ὅταν ἔλθῃ
  choice: atakapokuja
  rationale: Huonyesha tukio la baadaye linalotarajiwa, kama muundo wa ὅταν pamoja na hali tegemezi unavyodokeza.
- source_word: ὀλίγον
  choice: kwa muda mfupi
  rationale: Kielezi hiki kinaonyesha ufupi wa muda wa kukaa bila kuongeza mkazo usio lazima kama ‘muda mfupi tu.’
- source_word: αὐτὸν δεῖ μεῖναι
  choice: lazima akae
  rationale: Huwasilisha ulazima wa δεῖ kwa Kiswahili cha kawaida na chenye hadhi; ‘akae’ hapa ni kukaa au kudumu kwa kipindi fulani.
theological_decisions:
- issue: Kiwango cha ufafanuzi wa mfano wa wafalme saba
  choice: Kuhifadhi usemi mfupi wa mstari bila kuwataja wafalme hao katika matini kuu wala kuwahusisha na mpangilio fulani wa kihistoria.
  alternative: Kutafsiri wazi zaidi, ‘Wafalme watano wameanguka, mfalme mmoja yupo, na mfalme yule mwingine bado hajaja,’ au kuwatambulisha kuwa watawala maalumu wa Roma.
  rationale: Muktadha wa karibu unaonyesha kwamba wanaorejelewa ni wafalme, lakini mstari wenyewe una usemi uliodondoshwa. Tafsiri inahifadhi utata huo halisi na haimalizi mjadala wa utambulisho wao.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo mfupi wa asili umehifadhiwa; tanbihi inafafanua kwamba wanaorejelewa ni wafalme bila kuingiza utambulisho wa kimadhehebu au wa kihistoria.
