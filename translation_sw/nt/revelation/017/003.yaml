  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἀπήνεγκέν με εἰς ἔρημον ἐν πνεύματι. καὶ εἶδον γυναῖκα καθημένην ἐπὶ θηρίον κόκκινον, ⸀γέμοντα ὀνόματα βλασφημίας, ⸀ἔχων κεφαλὰς ἑπτὰ καὶ κέρατα δέκα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/003.yaml
  text: And he carried me away in the Spirit into a wilderness. And I saw a woman sitting on a scarlet beast[a], full of blasphemous names, having seven heads and ten horns.
translation:
  language: sw
  text: Naye akanichukua katika Roho[a] hadi nyikani. Nikamwona mwanamke ameketi juu ya mnyama mwekundu, aliyejaa majina ya makufuru, mwenye vichwa saba na pembe kumi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “katika roho.” Kifungu cha Kigiriki kinaweza kumaanisha hali ya kiroho au kuchukuliwa na Roho; katika kitabu cha Ufunuo mara nyingi hutambulisha tukio la maono.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπήνεγκέν
  choice: akanichukua
  rationale: Kitenzi hiki kinaonyesha kuhamishwa au kupelekwa mahali pengine. “Akanichukua” ni Kiswahili cha kawaida kinachohifadhi wazo la kusafirishwa katika maono.
- source_word: εἰς ἔρημον
  choice: mpaka nyikani
  rationale: ἔρημος ni eneo lisilokaliwa, nyika au jangwa. “Nyikani” hakulazimishi picha ya jangwa la mchanga, na “mpaka” huonyesha mwelekeo wa kuingia huko.
- source_word: ἐν πνεύματι
  choice: katika Roho
  rationale: Katika Ufunuo, kifungu hiki hutambulisha hali ya kinabii au tukio la maono. Herufi kubwa inaonyesha uwezekano mkubwa wa kumrejelea Roho, huku tanbihi ikihifadhi maana mbadala.
- source_word: γυναῖκα καθημένην ἐπὶ θηρίον κόκκινον
  choice: mwanamke ameketi juu ya mnyama mwekundu
  rationale: Tafsiri hii inahifadhi picha halisi ya mwanamke akiwa juu ya θηρίον; “mwekundu” ni neno la kawaida na wazi kwa rangi ya κόκκινος.
- source_word: γέμοντα ὀνόματα βλασφημίας
  choice: aliyejaa majina ya makufuru
  rationale: “Aliyejaa” hudumisha maana ya γέμοντα, nayo “majina ya makufuru” huhifadhi muundo na uzito wa kidini wa βλασφημία bila kuongeza mhusika au mlengwa ambaye hajatajwa wazi.
- source_word: ἔχων κεφαλὰς ἑπτὰ καὶ κέρατα δέκα
  choice: mwenye vichwa saba na pembe kumi
  rationale: “Mwenye” ni njia ya asili ya Kiswahili ya kuendeleza maelezo ya mnyama, huku idadi na taswira za kiapokaliptiki zikihifadhiwa moja kwa moja.
theological_decisions:
- issue: Maana ya ἐν πνεύματι
  choice: katika Roho
  alternative: katika roho
  rationale: Matumizi ya kifungu hiki katika Ufunuo mara nyingi huashiria maono ya kinabii yanayohusishwa na Roho. Kwa kuwa hati za Kigiriki hazitofautishi herufi kubwa na ndogo kwa namna hii, tanbihi inadumisha uwezekano wa kuelewa hali ya kiroho bila kuamua mvutano huo kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida lakini wa heshima. “Nyikani” limetumiwa badala ya neno linaloweza kudokeza jangwa la mchanga pekee. Muundo wa maono na taswira zake umehifadhiwa bila ufafanuzi wa kimadhehebu.
