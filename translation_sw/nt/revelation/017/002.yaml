id: REV.17.2
reference: Revelation 17:2
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: μεθ’ ἧς ἐπόρνευσαν οἱ βασιλεῖς τῆς γῆς, καὶ ἐμεθύσθησαν οἱ κατοικοῦντες τὴν γῆν ἐκ τοῦ οἴνου τῆς πορνείας αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/002.yaml
  text: with whom the kings of the earth committed sexual immorality[d][c][b][a], and those who dwell on the earth became drunk from the wine of her sexual immorality.
translation:
  language: sw
  text: ambaye wafalme wa dunia walifanya uasherati naye,[a][b] na wale wakaao duniani wakalewa kwa mvinyo wa uasherati wake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walifanya ukahaba naye.”
    reason: lexical_alternative
  - marker: b
    text: Hapa lugha ya uasherati huenda ikatumika kwa mfano kumaanisha ushirika wa kifisadi, wa kuabudu sanamu, au usio mwaminifu, huku taswira ya ngono ikiendelea kuwa na nguvu.
    reason: cultural_note
lexical_decisions:
- source_word: μεθ’ ἧς
  choice: ambaye ... naye
  rationale: Muundo huu unahifadhi uhusiano wa kiwakilishi na mwanamke aliyetajwa katika mstari uliotangulia, huku ukiwa wa kawaida katika Kiswahili.
- source_word: ἐπόρνευσαν
  choice: walifanya ... uasherati
  rationale: Neno hili linadumisha taswira ya ngono na pia linaweza kubeba maana ya mfano ya ibada ya sanamu, ufisadi, au kutokuwa mwaminifu bila kuifafanua kupita kiasi.
- source_word: οἱ βασιλεῖς τῆς γῆς
  choice: wafalme wa dunia
  rationale: Katika Ufunuo, γῆ mara nyingi hurejelea dunia kwa upana; tafsiri hii pia inadumisha kishazi kinachojirudia kitabuni.
- source_word: ἐμεθύσθησαν
  choice: walilewa
  rationale: Hii ni tafsiri ya asili na yenye kueleweka ya hali iliyotokana na kunywa, bila kulazimisha katika Kiswahili muundo wa kutendwa.
- source_word: οἱ κατοικοῦντες τὴν γῆν
  choice: wakaao duniani
  rationale: Huhifadhi umbo la kitenzi la kishazi maalumu kinachojirudia katika Ufunuo na ni lugha ya heshima inayoeleweka.
- source_word: ἐκ τοῦ οἴνου
  choice: kwa mvinyo
  rationale: ἐκ hapa huonyesha chanzo au kisababishi; 'kwa mvinyo' ni ya kawaida katika Kiswahili na huonyesha kilichowalewesha.
- source_word: τῆς πορνείας αὐτῆς
  choice: wa uasherati wake
  rationale: Inalingana na kitenzi cha awali na kuhifadhi upana wa maana pamoja na taswira ya ngono; muktadha unaweza kuipa nguvu ya mfano.
theological_decisions:
- issue: Iwapo πορνεύω/πορνεία yafafanuliwe moja kwa moja kuwa ibada ya sanamu au ushirika wa kisiasa na kidini usio mwaminifu
  choice: Kudumisha taswira ya uasherati katika matini kuu bila kuibadili kuwa ufafanuzi
  alternative: walifanya uzinzi wa kiroho naye / waliungana naye katika ibada ya sanamu na ufisadi
  rationale: Ufunuo hutumia kimakusudi taswira ya ngono kuonyesha kutokuwa mwaminifu na ufisadi. Kudumisha sitiari huacha wazi mkazo wake wa kingono, kisiasa, na kidini bila kuufungia katika tafsiri moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Wakaao' limetumiwa kudumisha kishazi kinachojirudia katika Ufunuo; 'walifanya naye uasherati' ni wazi na ya kawaida. Alama zote za tanbihi zilizotolewa zinaonekana katika matini kuu.
