id: REV.17.12
reference: Revelation 17:12
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ τὰ δέκα κέρατα ἃ εἶδες δέκα βασιλεῖς εἰσιν, οἵτινες βασιλείαν οὔπω ἔλαβον, ἀλλὰ ἐξουσίαν ὡς βασιλεῖς μίαν ὥραν λαμβάνουσιν μετὰ τοῦ θηρίου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/012.yaml
  text: And the ten horns that you saw are ten kings[a], who have not yet received a kingdom, but they receive authority as kings for one hour with the beast.
translation:
  language: sw
  text: Na zile pembe kumi ulizoziona ni wafalme kumi, ambao bado hawajapokea ufalme, lakini wanapokea mamlaka kama wafalme kwa saa moja[a] pamoja na yule mnyama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa muda mfupi.” Huenda usemi “saa moja” unaashiria kipindi kifupi na chenye mipaka katika taswira ya kiapokaliptiki.
    reason: lexical_alternative
lexical_decisions:
- source_word: κέρατα
  choice: pembe
  rationale: Tafsiri halisi inadumisha taswira ya kiapokaliptiki; mstari wenyewe unatambulisha pembe hizo kuwa wafalme.
- source_word: βασιλεῖς
  choice: wafalme
  rationale: Hili ndilo neno la kawaida na la moja kwa moja; haliondoi uwezekano kwamba wafalme hao ni ishara ya watawala au mamlaka za kisiasa.
- source_word: βασιλείαν
  choice: ufalme
  rationale: Inadumisha tofauti ya kimaana kati ya ufalme ambao bado hawajaupokea na mamlaka wanayopewa baadaye katika sentensi.
- source_word: οὔπω ἔλαβον
  choice: bado hawajapokea
  rationale: Muundo huu wa Kiswahili unaonyesha kwa kawaida hali ya kutopokea mpaka wakati unaozungumziwa, huku ukidumisha matarajio ya baadaye.
- source_word: ἐξουσίαν
  choice: mamlaka
  rationale: Neno hili linaonyesha uwezo au haki ya kutawala iliyopewa, bila kulichanganya na ‘ufalme’.
- source_word: ὡς βασιλεῖς
  choice: kama wafalme
  rationale: Tafsiri ya moja kwa moja inadumisha uwezekano wa maana ya namna au hadhi ambayo kwa hiyo wanapokea mamlaka.
- source_word: μίαν ὥραν
  choice: kwa saa moja
  rationale: Inadumisha usemi halisi wa kiapokaliptiki; uwezekano wa kumaanisha kipindi kifupi unaelezwa katika tanbihi.
- source_word: λαμβάνουσιν
  choice: wanapokea
  rationale: Wakati wa sasa wa Kigiriki umedumishwa kwa usemi wa sasa wa Kiswahili, unaofaa mtindo hai wa maono.
- source_word: μετὰ τοῦ θηρίου
  choice: pamoja na yule mnyama
  rationale: ‘Pamoja na’ huonyesha ushirika wao na mnyama; ‘yule’ humrejelea mnyama maalumu ambaye tayari anajulikana katika muktadha.
- source_word: θηρίου
  choice: mnyama
  rationale: Hili ni neno la kawaida la Kiswahili linalodumisha taswira inayotumiwa katika kitabu cha Ufunuo.
theological_decisions:
- issue: Iwapo wafalme kumi watafsiriwe katika matini kuwa wafalme halisi au watawala/nguvu za kiishara
  choice: Kudumisha ‘wafalme kumi’ bila ufafanuzi wa ziada katika matini.
  alternative: ‘watawala kumi’ au ‘mamlaka kumi za kisiasa’
  rationale: Kigiriki kinasema wazi ‘wafalme kumi,’ ilhali muktadha wa kiapokaliptiki unaacha wazi uwezekano wa ishara. Tafsiri haipaswi kuondoa mvutano huo.
- issue: Iwapo μίαν ὥραν ni saa halisi au kipindi kifupi cha kiishara
  choice: Kutafsiri ‘kwa saa moja’ katika matini na kueleza maana nyingine katika tanbihi.
  alternative: ‘kwa muda mfupi’
  rationale: Usemi halisi ni ‘saa moja,’ lakini katika taswira ya kiapokaliptiki huenda unaashiria kipindi kifupi na chenye mipaka. Tanbihi inadumisha uwezekano huo bila kuamua maana katika matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa moja kwa moja lakini wa kawaida, na istilahi ‘pembe,’ ‘wafalme,’ ‘ufalme,’ ‘mamlaka,’ na ‘mnyama’ zinadumisha taswira na tofauti za kileksika za chanzo.
