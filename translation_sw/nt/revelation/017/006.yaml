  text: καὶ εἶδον τὴν γυναῖκα μεθύουσαν ἐκ τοῦ αἵματος τῶν ἁγίων ⸀καὶ ἐκ τοῦ αἵματος τῶν μαρτύρων Ἰησοῦ. Καὶ ἐθαύμασα ἰδὼν αὐτὴν θαῦμα μέγα·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/006.yaml
  text: And I saw the woman drunk with the blood of the saints and with the blood of the martyrs of Jesus. And seeing her[a], I marveled greatly.
translation:
  language: sw
  text: Nikamwona yule mwanamke amelewa kwa damu ya watakatifu na kwa damu ya mashahidi wa Yesu.[a] Nilipomwona, nikastaajabu sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wafia-imani wa Yesu.” Neno la Kigiriki linaweza kumaanisha “mashahidi” au “wafia-imani”; hapa kutajwa kwa damu yao kunafanya maana ya wafia-imani ifae hasa.
    reason: lexical_alternative
lexical_decisions:
- source_word: μεθύουσαν
  choice: amelewa
  rationale: Kitenzi hiki kinaeleza hali ya mwanamke. ‘Amelewa’ ni Kiswahili cha kawaida na chenye nguvu, na kinadumisha taswira ya kushtua ya kuleweshwa na damu.
- source_word: ἐκ τοῦ αἵματος
  choice: kwa damu ya
  rationale: Ingawa ἐκ kimsingi huonyesha chanzo, katika muundo huu ‘kwa damu’ ni usemi wa asili unaoonyesha kile kilichomlevya bila kuondoa taswira ya chanzo.
- source_word: τῶν ἁγίων
  choice: watakatifu
  rationale: Katika Ufunuo neno hili kwa kawaida huwarejelea watu wa Mungu waliowekwa wakfu. ‘Watakatifu’ ni fupi, ya heshima, na imezoeleka katika Kiswahili cha Biblia.
- source_word: τῶν μαρτύρων Ἰησοῦ
  choice: mashahidi wa Yesu
  rationale: μάρτυς kimsingi humaanisha shahidi, ingawa katika muktadha wa damu pia hubeba maana ya mtu aliyeuawa kwa sababu ya ushuhuda wake. ‘Wa Yesu’ inadumisha ufupi na uwezekano wa kumaanisha walio wake au wanaomshuhudia.
- source_word: ἐθαύμασα
  choice: nikastaajabu
  rationale: Neno hili huonyesha mshangao mkubwa. ‘Nikastaajabu’ ni la asili, la heshima, na halidokezi tu hali ya kutokuwa na uhakika.
- source_word: ἰδὼν αὐτὴν
  choice: Nilipomwona
  rationale: Kishirikishi cha aoristi kimetafsiriwa kwa kishazi cha wakati, ambacho ni cha asili katika Kiswahili na kinaonyesha wazi uhusiano wake na kitendo kikuu.
- source_word: θαῦμα μέγα
  choice: sana
  rationale: Huu ni mtindo wa kusisitiza kitenzi kwa nomino yenye mzizi mmoja. ‘Sana’ huwasilisha msisitizo huo kwa Kiswahili cha kawaida bila kutokeza kirai kisicho cha asili.
theological_decisions:
- issue: Maana ya μάρτυρες katika muktadha wa mateso ya kiapokaliptiki
  choice: mashahidi wa Yesu
  alternative: wafia-imani wa Yesu
  rationale: Maana ya msingi ya neno ni ‘mashahidi,’ na Ufunuo hukazia ushuhuda. Kutajwa kwa damu yao kunafanya maana ya kufa kwa ajili ya imani kuwapo katika muktadha, hivyo mbadala huo umehifadhiwa katika tanbihi bila kulazimisha maana moja katika matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa masimulizi ‘Nikamwona ... Nilipomwona, nikastaajabu’ ni wa asili na hudumisha mfuatano wa Kigiriki. Tanbihi imewekwa baada ya kirai kinachohusika moja kwa moja.
