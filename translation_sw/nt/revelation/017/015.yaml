id: REV.17.15
reference: Revelation 17:15
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ λέγει μοι· Τὰ ὕδατα ἃ εἶδες, οὗ ἡ πόρνη κάθηται, λαοὶ καὶ ὄχλοι εἰσὶν καὶ ἔθνη καὶ γλῶσσαι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/015.yaml
  text: And he says to me, “The waters that you saw, where the prostitute sits, are peoples and crowds and nations and languages.”
translation:
  language: sw
  text: Naye akaniambia, “Maji yale uliyoyaona, mahali ambapo yule kahaba ameketi, ni jamii, makutano, mataifa, na lugha.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει μοι
  choice: akaniambia
  rationale: Kitenzi cha wakati uliopo katika simulizi la Kigiriki kimetafsiriwa kwa wakati uliopita wa kisimulizi, ambao ni wa kawaida na wa asili katika Kiswahili.
- source_word: Τὰ ὕδατα
  choice: Yale maji
  rationale: Kiwakilishi cha kuonyesha kinarejelea maji ambayo Yohana alikuwa ameyaona tayari.
- source_word: ἡ πόρνη
  choice: yule kahaba
  rationale: “Kahaba” ni neno la kawaida, la moja kwa moja, na lenye hadhi ya kifasihi kwa πόρνη katika muktadha huu wa mfano.
- source_word: λαοί
  choice: jamaa za watu
  rationale: Hutofautisha λαοί, makundi ya watu yenye utambulisho wa pamoja, na ὄχλοι, umati wa watu.
- source_word: ὄχλοι
  choice: umati wa watu
  rationale: Huwasilisha maana ya makundi makubwa au mikusanyiko ya watu bila kuichanganya na “mataifa.”
- source_word: ἔθνη
  choice: mataifa
  rationale: Ni tafsiri ya kawaida na sahihi ya ἔθνη katika orodha hii.
- source_word: γλῶσσαι
  choice: lugha
  rationale: Katika orodha ya makundi ya wanadamu, γλῶσσαι humaanisha lugha, na kwa upanuzi watu wanaozizungumza.
theological_decisions:
- issue: Utambulisho wa maji ya mfano
  choice: “ni jamaa za watu, umati wa watu, mataifa, na lugha”
  alternative: Kuyafafanua maji kama falme au mamlaka za kisiasa
  rationale: Tafsiri inahifadhi ufafanuzi wenyewe wa maandiko bila kuongeza utambulisho wa kitheolojia au kisiasa usiotajwa katika mstari.
- issue: Maana ya “lugha”
  choice: Kuhifadhi neno halisi “lugha”
  alternative: “watu wa kila lugha”
  rationale: Neno la Kigiriki ni γλῶσσαι; tafsiri halisi inadumisha taswira na muundo wa orodha bila kuufafanua kupita kiasi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umefanywa wa asili kwa Kiswahili huku orodha ya makundi manne na lugha ya mfano ya chanzo vikihifadhiwa.
