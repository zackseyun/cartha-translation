id: REV.17.14
reference: Revelation 17:14
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οὗτοι μετὰ τοῦ ἀρνίου πολεμήσουσιν, καὶ τὸ ἀρνίον νικήσει αὐτούς, ὅτι κύριος κυρίων ἐστὶν καὶ βασιλεὺς βασιλέων, καὶ οἱ μετ’ αὐτοῦ κλητοὶ καὶ ἐκλεκτοὶ καὶ πιστοί.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/014.yaml
  text: These will make war against the Lamb[a], and the Lamb will conquer them, because he is Lord of lords and King of kings, and those with him are called and chosen and faithful.
translation:
  language: sw
  text: Hawa watapigana dhidi ya Mwana-Kondoo[a], na Mwana-Kondoo atawashinda, kwa sababu yeye ni Bwana wa mabwana na Mfalme wa wafalme; na walio pamoja naye ni walioitwa, waliochaguliwa, na waaminifu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki, kwa maana ya neno, ‘watapigana na Mwana-Kondoo’; katika muktadha huu maana yake ni kwamba watapigana dhidi yake.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτοι
  choice: Hawa
  rationale: Kiwakilishi hiki cha kuonyesha kinarejelea wafalme na majeshi yaliyotajwa katika muktadha uliotangulia, na kinahifadhi nguvu ya urejeleaji ya neno la Kigiriki.
- source_word: μετὰ τοῦ ἀρνίου πολεμήσουσιν
  choice: watapigana dhidi ya Mwana-Kondoo
  rationale: Ingawa μετά pamoja na hali ya genitivi kwa kawaida humaanisha ‘pamoja na,’ ikiwa na πολεμέω katika muktadha huu wa vita ina maana ya kupigana dhidi ya mtu. ‘Dhidi ya’ huepuka wazo lisilo sahihi kwamba wako upande mmoja na Mwana-Kondoo.
- source_word: ἀρνίον
  choice: Mwana-Kondoo
  rationale: Hili ni jina la kikristo linalotumika mara kwa mara katika Ufunuo. ‘Mwana-Kondoo’ ni tafsiri ya kawaida, yenye hadhi, na inayoeleweka katika Kiswahili cha Biblia.
- source_word: νικήσει
  choice: atawashinda
  rationale: Kitenzi νικάω ni neno muhimu linalojirudia katika Ufunuo. ‘Kuwashinda’ kinafaa katika muktadha wa vita na kinahifadhi wazo la ushindi bila kuongeza maelezo.
- source_word: ὅτι
  choice: kwa sababu
  rationale: Kiunganishi hiki kinatoa sababu ya ushindi wa Mwana-Kondoo; ‘kwa sababu’ huonyesha uhusiano huo wa kisababishi kwa uwazi.
- source_word: κύριος κυρίων
  choice: Bwana wa mabwana
  rationale: Tafsiri hii inahifadhi muundo wa cheo unaoonyesha mamlaka kuu kabisa. Herufi kubwa inaonyesha matumizi yake kama cheo cha Mwana-Kondoo.
- source_word: βασιλεὺς βασιλέων
  choice: Mfalme wa wafalme
  rationale: Tafsiri hii ya kawaida inahifadhi muundo wa Kigiriki unaoonyesha ukuu wa mamlaka ya kifalme.
- source_word: οἱ μετ’ αὐτοῦ
  choice: walio pamoja naye
  rationale: Hii ni tafsiri ya kawaida na ya moja kwa moja kwa watu walio upande wa Mwana-Kondoo.
- source_word: κλητοὶ καὶ ἐκλεκτοὶ καὶ πιστοί
  choice: walioitwa, waliochaguliwa, na waaminifu
  rationale: Maneno haya yanahifadhi sifa zote tatu tofauti kwa lugha ya kawaida bila kuziunganisha na mfumo fulani wa kimadhehebu kuhusu mwito au uteule.
theological_decisions:
- issue: Cheo cha Mwana-Kondoo na lugha ya ushindi
  choice: Kutumia ‘Mwana-Kondoo’ na ‘atawashinda.’
  alternative: ‘mwanakondoo ... atawashinda kabisa’ au ‘Mwana-Kondoo ... atapata ushindi juu yao’
  rationale: Ufunuo humtaja Yesu kwa jina la ἀρνίον na hutumia νικάω kama dhamira inayojirudia. Tafsiri hii inadumisha mshikamano huo bila kuongeza wazo ambalo halijasemwa wazi.
- issue: Maana ya κλητοὶ καὶ ἐκλεκτοὶ καὶ πιστοί
  choice: ‘walioitwa, waliochaguliwa, na waaminifu’
  alternative: ‘walioalikwa, wateule, na waaminifu’
  rationale: Tafsiri inadumisha sifa zote tatu na mvutano wake wa kiteolojia bila kuamua mabishano kuhusu namna mwito na uteule vinavyohusiana.
- issue: Uhusiano wa wale walio pamoja na Mwana-Kondoo na sifa tatu
  choice: ‘walio pamoja naye ni walioitwa, waliochaguliwa, na waaminifu’
  alternative: ‘pamoja naye wako walioitwa, waliochaguliwa, na waaminifu’
  rationale: Kigiriki kinaweka wale walio pamoja naye sambamba na sifa tatu bila kitenzi kilichoandikwa wazi. Kitenzi ‘ni’ kinahitajika kwa Kiswahili cha kawaida lakini hakiongezi utambulisho mwingine zaidi ya ule unaodokezwa na sarufi ya asili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa aya umehifadhi lugha ya kiapokaliptiki na vyeo vya kifalme, huku ‘dhidi ya’ ikiondoa utata usio wa maana unaoweza kudokeza ushirika badala ya uadui.
