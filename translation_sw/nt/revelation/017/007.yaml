id: REV.17.7
reference: Revelation 17:7
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ εἶπέν μοι ὁ ἄγγελος· Διὰ τί ἐθαύμασας; ἐγὼ ἐρῶ σοι τὸ μυστήριον τῆς γυναικὸς καὶ τοῦ θηρίου τοῦ βαστάζοντος αὐτήν, τοῦ ἔχοντος τὰς ἑπτὰ κεφαλὰς καὶ τὰ δέκα κέρατα·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/007.yaml
  text: And the angel said to me[a], “Why did you marvel? I will tell you the mystery of the woman and of the beast that carries her, which has the seven heads and the ten horns.”
translation:
  language: sw
  text: Malaika akaniambia, “Kwa nini ulistaajabu? Nitakuambia siri ya huyo mwanamke na ya yule mnyama anayembeba[a], mwenye vichwa saba na pembe kumi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “anayemchukua.”
    reason: Njia nyingine ya kutafsiri βαστάζοντος, ambayo inaweza kumaanisha kubeba au kuchukua.
lexical_decisions:
- source_word: ἐθαύμασας
  choice: umestaajabu
  rationale: Kitenzi ‘kustaajabu’ kinaonyesha mshangao mkubwa kuliko udadisi wa kawaida, na wakati timilifu ni wa asili katika Kiswahili kwa swali hili kuhusu mwitikio uliotokea.
- source_word: μυστήριον
  choice: siri
  rationale: Hapa ni jambo lililofichika ambalo sasa linafunuliwa, si fumbo la kuteguliwa tu.
- source_word: γυναικός
  choice: mwanamke
  rationale: Muktadha unamhusu mwanamke wa mfano, wala hauonyeshi uhusiano wa ndoa unaohitaji tafsiri ‘mke.’
- source_word: θηρίου
  choice: mnyama
  rationale: ‘Mnyama’ ni neno la kawaida na lenye hadhi linalohifadhi taswira ya kiumbe wa kutisha katika Ufunuo.
- source_word: βαστάζοντος
  choice: anayembeba
  rationale: Hili linaeleza wazi taswira ya mnyama anayemchukua mwanamke juu yake, huku likihifadhi maana ya msingi ya kubeba.
- source_word: ἔχοντος
  choice: mwenye
  rationale: ‘Mwenye’ huunganisha kwa Kiswahili cha asili vichwa na pembe na mnyama anayevimiliki.
- source_word: κεφαλάς
  choice: vichwa
  rationale: Tafsiri halisi inahifadhi taswira muhimu ya ono.
- source_word: κέρατα
  choice: pembe
  rationale: Tafsiri halisi inahifadhi ishara ya kiapokaliptiki inayotumiwa katika Ufunuo.
- source_word: Διὰ τί
  choice: Kwa nini
  rationale: Hii ndiyo njia fupi na ya kawaida ya kuuliza sababu katika Kiswahili.
- source_word: ἐρῶ σοι
  choice: Nitakuambia
  rationale: Inaonyesha moja kwa moja kwamba malaika anakaribia kufunua maana ya ono.
theological_decisions:
- issue: Kirejeleo cha maelezo ‘mwenye vichwa saba na pembe kumi’
  choice: Maelezo yameunganishwa wazi na ‘mnyama.’
  alternative: Kuacha maelezo hayo yakiwa yanaweza kudhaniwa kumhusu mwanamke au siri kwa ujumla.
  rationale: Vivumishi shiriki vya Kigiriki τοῦ βαστάζοντος na τοῦ ἔχοντος vinapatana kisarufi na θηρίου, si γυναικός; kwa hiyo tafsiri inapaswa kuonyesha wazi kwamba mnyama ndiye anayembeba mwanamke na ndiye mwenye vichwa na pembe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi, na rahisi kueleweka. Muundo wa sentensi umewekwa wa asili bila kupoteza uhusiano wa kisarufi na taswira za ono.
