  text: καὶ ἡ γυνὴ ἣν εἶδες ἔστιν ἡ πόλις ἡ μεγάλη ἡ ἔχουσα βασιλείαν ἐπὶ τῶν βασιλέων τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/018.yaml
  text: And the woman whom you saw is the great city that has dominion over the kings of the earth[a].
translation:
  language: sw
  text: Na yule mwanamke uliyemwona ni ule mji mkubwa una mamlaka juu ya wafalme wa dunia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ulio na ufalme juu ya wafalme wa dunia.” Usemi wa Kigiriki unasema kihalisi “ulio na ufalme,” ambao pia unaweza kueleweka kuwa wenye utawala au mamlaka ya kifalme.
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνή
  choice: mwanamke
  rationale: Katika maono huyu ni mhusika wa kike wa kiishara, hivyo “mwanamke” ni tafsiri ya kawaida isiyoongeza wazo la kuwa mke.
- source_word: ἣν εἶδες
  choice: uliyemwona
  rationale: Kishazi hiki kinamtambulisha moja kwa moja mwanamke ambaye Yohana alikuwa amemwona; umbo hili ni la kawaida na wazi katika Kiswahili.
- source_word: πόλις ἡ μεγάλη
  choice: ule mji mkubwa
  rationale: “Mji” ndiyo maana ya kawaida ya πόλις, na “ule” huendeleza utambulisho wa moja kwa moja na mwanamke aliyetajwa.
- source_word: ἔχουσα βασιλείαν
  choice: wenye mamlaka
  rationale: Kirai hiki kihalisi ni “wenye ufalme/utawala”; katika muktadha wa kuwa juu ya wafalme, “wenye mamlaka” huwasilisha uwezo wa kutawala bila kuufanya mji kuwa eneo la ufalme.
- source_word: βασιλεία
  choice: mamlaka
  rationale: Neno linaweza kumaanisha ufalme, utawala, au mamlaka ya kifalme. Hapa msisitizo ni mamlaka inayotumiwa juu ya wafalme, huku tanbihi ikihifadhi tafsiri ya karibu zaidi na umbo la Kigiriki.
- source_word: ἐπὶ τῶν βασιλέων
  choice: juu ya wafalme
  rationale: Pamoja na hali ya genitivi, ἐπί hapa huonyesha mamlaka au ukuu juu ya wafalme.
- source_word: τῆς γῆς
  choice: wa dunia
  rationale: Katika Ufunuo neno γῆ mara nyingi lina upeo mpana wa dunia, si nchi fulani; “wa dunia” ni usemi wa kawaida wa Kiswahili.
theological_decisions:
- issue: Aina ya utambulisho kati ya mwanamke na mji
  choice: “mwanamke ... ni ule mji mkubwa”
  alternative: “mwanamke ... anawakilisha ule mji mkubwa”
  rationale: Kigiriki kinatumia kitenzi sahili ἔστιν, “ni.” Kudumisha “ni” huhifadhi utambulisho wa kiishara kama ulivyosemwa bila kuugeuza kuwa ufafanuzi wa kitafsiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wazi kwa wasomaji wa kawaida, huku “mamlaka” ikitoa maana ya kimuktadha na tanbihi ikihifadhi uwezekano wa “ufalme” au utawala wa kifalme.
