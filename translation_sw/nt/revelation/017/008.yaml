id: REV.17.8
reference: Revelation 17:8
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: τὸ θηρίον ὃ εἶδες ἦν καὶ οὐκ ἔστιν, καὶ μέλλει ἀναβαίνειν ἐκ τῆς ἀβύσσου, καὶ εἰς ἀπώλειαν ⸀ὑπάγει· καὶ ⸀θαυμασθήσονται οἱ κατοικοῦντες ἐπὶ τῆς γῆς, ὧν οὐ γέγραπται ⸂τὸ ὄνομα⸃ ἐπὶ τὸ βιβλίον τῆς ζωῆς ἀπὸ καταβολῆς κόσμου, βλεπόντων ⸂τὸ θηρίον ὅτι ἦν⸃ καὶ οὐκ ἔστιν καὶ παρέσται.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/008.yaml
  text: The beast that you saw was[a], and is not, and is about to come up out of the abyss and go to destruction. And those who dwell on the earth, whose name has not been written in the book of life from the foundation of the world, will marvel when they see the beast[c][b], because it was and is not and will be present.
translation:
  language: sw
  text: Mnyama uliyemwona alikuwako, naye hayuko; yuko karibu kupanda kutoka vilindini na kwenda kwenye maangamizi. Wale wanaoishi duniani—ambao jina lao halijaandikwa katika kitabu cha uzima tangu kuwekwa kwa msingi wa ulimwengu—watastaajabu watakapomwona mnyama, kwa sababu alikuwako, hayuko, naye atakuwapo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watastaajabu watakapomwona mnyama kwamba alikuwako, hayuko, naye atakuja [au, atatokea].” Kigiriki kinaweza kueleza sababu ya kustaajabu kwao au jambo linalowastaajabisha; neno la mwisho pia linaweza kumaanisha “atakuwapo,” “atakuja,” au “atatokea.”
    reason: alternative_reading
lexical_decisions:
- source_word: θηρίον
  choice: mnyama
  rationale: Hili ndilo neno la kawaida na linaloeleweka katika lugha ya kinabii ya Ufunuo; muktadha wenyewe unaonyesha kuwa si mnyama wa kawaida bali kiumbe cha mfano chenye kutisha.
- source_word: ἦν καὶ οὐκ ἔστιν
  choice: alikuwako, naye hayuko
  rationale: Linadumisha utofautishaji mkali wa kuwako zamani na kutokuwako sasa bila kuufafanua kupita kiasi.
- source_word: μέλλει ἀναβαίνειν
  choice: anakaribia kupanda
  rationale: ‘Anakaribia’ linaonyesha ukaribu unaodokezwa na μέλλει, huku ‘kupanda’ likihifadhi mwendo wa kuelekea juu.
- source_word: ἄβυσσος
  choice: vilindi
  rationale: ‘Vilindi’ linaonyesha eneo la kina lisilopimika bila kuingiza maelezo ya kimapokeo ya ‘shimo lisilo na mwisho.’
- source_word: εἰς ἀπώλειαν ὑπάγει
  choice: kwenda kwenye maangamizi
  rationale: Linaonyesha mwendo unaoelekea kwenye mwisho wa kuangamizwa kwa lugha ya kawaida na yenye uzito.
- source_word: θαυμασθήσονται
  choice: watastaajabu
  rationale: Linawasilisha mshangao mkubwa unaokusudiwa na kitenzi hiki na ni la asili katika Kiswahili cha sasa.
- source_word: οἱ κατοικοῦντες ἐπὶ τῆς γῆς
  choice: wale wanaoishi duniani
  rationale: Ni usemi wa asili unaohifadhi maana ya kundi la watu wanaokaa duniani.
- source_word: ὧν οὐ γέγραπται τὸ ὄνομα
  choice: ambao jina lao halijaandikwa
  rationale: Linahifadhi umoja wa Kigiriki ‘jina’ huku likitumia muundo wa Kiswahili unaoweza kurejelea watu wengi kwa namna ya kila mmoja wao.
- source_word: ἐπὶ τὸ βιβλίον τῆς ζωῆς
  choice: katika kitabu cha uzima
  rationale: Kiswahili hutumia ‘katika kitabu’ kwa jambo lililoandikwa ndani yake; tafsiri ya moja kwa moja ‘juu ya kitabu’ ingeleta maana isiyokusudiwa.
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: tangu kuwekwa msingi wa ulimwengu
  rationale: Linahifadhi taswira ya msingi wa ulimwengu na uhusiano wa wakati na kuandikwa kwa jina.
- source_word: βλεπόντων
  choice: watakapomwona
  rationale: Muundo wa wakati unaonyesha kwa ufasaha kwamba kustaajabu kwao kunatokea wanapomwona mnyama.
- source_word: παρέσται
  choice: atakuwapo
  rationale: Linahifadhi maana ya wakati ujao ya ‘kuwapo’ na mlingano wake na ‘alikuwako’ na ‘hayuko,’ badala ya kuibadili moja kwa moja kuwa ufufuo au kurudi.
theological_decisions:
- issue: Uhusiano wa ‘tangu kuwekwa msingi wa ulimwengu’
  choice: Usemi huu umeunganishwa na kutokuandikwa kwa jina katika kitabu cha uzima.
  alternative: Kuufasiri kupitia mafundisho mapana kuhusu uteuzi au kuuhusisha na wazo jingine lisilotajwa katika sentensi hii.
  rationale: Mpangilio wa Kigiriki unaweka usemi huu mara baada ya taarifa kuhusu jina kutokuandikwa katika kitabu cha uzima. Tafsiri inahifadhi uhusiano huo bila kutatua mvutano wake wa kiteolojia kwa mfumo fulani wa kimadhehebu.
- issue: Maana ya ὅτι na παρέσται katika kifungu cha mwisho
  choice: ‘kwa sababu ... atakuwapo’
  alternative: ‘kwamba ... atakuja/atatokea’
  rationale: ὅτι inaweza kueleza sababu ya kustaajabu au maudhui wanayoyaona, na παρέσται inaweza kusisitiza kuwapo au kuja/kutokea. Maandishi makuu yanatumia maana ya sababu na kuwapo ili kuhifadhi mlingano wa nyakati; tanbihi inadumisha uwezekano mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Sentensi inahifadhi marudio ya kimakusudi ya ‘alikuwako, hayuko, naye atakuwapo’ na haitulizi fumbo la mnyama kwa maelezo ya ziada.
