id: REV.17.1
reference: Revelation 17:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ ἦλθεν εἷς ἐκ τῶν ἑπτὰ ἀγγέλων τῶν ἐχόντων τὰς ἑπτὰ φιάλας, καὶ ἐλάλησεν μετ’ ἐμοῦ λέγων· Δεῦρο, δείξω σοι τὸ κρίμα τῆς πόρνης τῆς μεγάλης τῆς καθημένης ἐπὶ ⸀ὑδάτων πολλῶν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/001.yaml
  text: Then one of the seven angels who had the seven bowls came and spoke with me[a], saying, “Come[b], I will show you the judgment of the great prostitute who sits on many waters,”
translation:
  language: sw
  text: Kisha mmoja wa wale malaika saba waliokuwa na mabakuli saba akaja, akazungumza nami, akisema, “Njoo, nitakuonyesha hukumu[a] ya kahaba mkuu anayeketi juu ya maji mengi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutiwa hatiani kwa kahaba mkuu” au “adhabu ya kahaba mkuu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Kisha
  rationale: Inaonyesha mwendelezo wa simulizi kwa Kiswahili cha kawaida huku ikihifadhi nguvu ya kiunganishi.
- source_word: ἦλθεν
  choice: akaja
  rationale: Wakati wa aoristi hapa unasimulia tukio lililofuata; ‘akaja’ ni tafsiri ya moja kwa moja na ya asili.
- source_word: εἷς ἐκ τῶν ἑπτὰ ἀγγέλων
  choice: mmoja wa wale malaika saba
  rationale: Ni muundo wa sehemu ya kundi; ‘mmoja wa’ ni Kiswahili sanifu na ‘wale’ hurejelea malaika waliotajwa awali.
- source_word: τῶν ἐχόντων τὰς ἑπτὰ φιάλας
  choice: waliokuwa na mabakuli saba
  rationale: Kishazi hiki kinawatambulisha malaika husika. ‘Mabakuli’ huhifadhi taswira ya vyombo vipana vya Ufunuo bila kuvibadili kuwa vikombe.
- source_word: ἐλάλησεν μετ’ ἐμοῦ
  choice: akasema nami
  rationale: ‘Nami’ huhifadhi maana ya μετά pamoja na nafsi ya kwanza; ‘akasema’ ni utangulizi wa usemi ulio wa asili katika Kiswahili.
- source_word: λέγων
  choice: akasema
  rationale: Kirai tegemezi cha Kigiriki kimeunganishwa kwa kawaida na kitenzi cha kusema katika Kiswahili, bila kurudia ‘akizungumza ... akisema’.
- source_word: Δεῦρο
  choice: Njoo
  rationale: Ni mwito mfupi na wa moja kwa moja unaolingana na amri ya Kigiriki.
- source_word: δείξω σοι
  choice: nitakuonyesha
  rationale: Huhifadhi hali ya wakati ujao na yambwa ya nafsi ya pili kwa ufupi wa kawaida wa Kiswahili.
- source_word: τὸ κρίμα
  choice: hukumu
  rationale: ‘Hukumu’ inaweza kumaanisha uamuzi wa kimahakama na matokeo yake, hivyo haiibani maana kuwa tu kutiwa hatiani au adhabu.
- source_word: τῆς πόρνης τῆς μεγάλης
  choice: ya yule kahaba mkuu
  rationale: ‘Kahaba’ ni neno la sasa, linaloeleweka, na huhifadhi nguvu ya sitiari ya kinabii; ‘mkuu’ hapa huonyesha ukubwa/umashuhuri wa mhusika.
- source_word: τῆς καθημένης ἐπὶ ὑδάτων πολλῶν
  choice: anayeketi juu ya maji mengi
  rationale: Huhifadhi taswira ya kuketi ‘juu ya’ maji bila kuitafsiri mapema; ufafanuzi wa ishara hiyo unakuja baadaye katika sura.
theological_decisions:
- issue: Tafsiri ya jina la kisitiari πόρνη kwa Babeli
  choice: kahaba mkuu
  alternative: malaya mkuu
  rationale: ‘Kahaba’ huhifadhi sitiari kali ya kingono ya manabii kuhusu ukosefu wa uaminifu na ufisadi, bila kuamua mapema utambulisho maalumu wa Babeli. ‘Malaya’ linaweza kuwa pana zaidi au kutumiwa kama tusi lisilo mahususi.
- issue: Maana ya κρίμα katika muktadha wa kiapokaliptiki
  choice: hukumu
  alternative: adhabu; kutiwa hatiani
  rationale: ‘Hukumu’ huhifadhi upana wa kitendo cha kimahakama cha Mungu, ikijumuisha uamuzi na uwezekano wa utekelezaji wake, bila kuibana maana mapema.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo umefanywa wa asili kwa Kiswahili huku taswira na utata wa κρίμα vikihifadhiwa.
