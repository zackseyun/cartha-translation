  text: καὶ τὸ θηρίον ὃ ἦν καὶ οὐκ ἔστιν. καὶ ⸀αὐτὸς ὄγδοός ἐστιν καὶ ἐκ τῶν ἑπτά ἐστιν, καὶ εἰς ἀπώλειαν ὑπάγει.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/011.yaml
  text: And the beast that was and is not is itself an eighth and is from the seven[b][a], and it goes to destruction.
translation:
  language: sw
  text: Na yule mnyama aliyekuwako na hayuko, yeye mwenyewe ni wa nane[a] na anatokana na wale saba[b], naye anaenda kwenye maangamizi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “yeye mwenyewe ni mfalme wa nane.” Nomino “mfalme” inadokezwa na muktadha lakini haijatajwa katika Kigiriki.
    reason: alternative_reading
  - marker: b
    text: Au, “ni mmoja wa wale saba.” Kigiriki kinasema kihalisi zaidi “kutokana na wale saba,” jambo linaloweza kuonyesha asili, uanachama, au uhusiano wa karibu.
    reason: lexical_alternative
lexical_decisions:
- source_word: θηρίον
  choice: mnyama
  rationale: Katika Ufunuo, neno hili ni istilahi ya kiapokaliptiki kwa kiumbe cha kutisha kinachowakilisha mamlaka inayompinga Mungu. “Mnyama” ni neno la kawaida na lenye uzito wa kifasihi katika Kiswahili.
- source_word: ὃ ἦν καὶ οὐκ ἔστιν
  choice: aliyekuwako na hayuko
  rationale: Muundo huu unadumisha ulinganifu mkali wa vitenzi vya Kigiriki na mwangwi wa kauli inayojirudia katika sura hii, bila kufafanua zaidi hali yake ya kutokuwapo.
- source_word: αὐτὸς
  choice: yeye mwenyewe
  rationale: Kiwakilishi cha msisitizo kinaelekezwa kwa “mnyama.” Kiswahili hutumia “yeye mwenyewe” kwa kawaida kuhusu mnyama aliyefanywa kama mhusika, huku msisitizo wa Kigiriki ukihifadhiwa.
- source_word: ὄγδοός
  choice: wa nane
  rationale: Kivumishi hiki hakina nomino iliyotajwa wazi katika Kigiriki. “Wa nane” kinaacha nomino ieleweke kutokana na muktadha badala ya kuongeza “mfalme” katika matini.
- source_word: ἐκ τῶν ἑπτά
  choice: anatokana na wale saba
  rationale: Tafsiri hii inahifadhi wazo la asili au uhusiano na wale saba bila kulazimisha maana mahususi zaidi ya kwamba ni mmoja wao.
- source_word: εἰς ἀπώλειαν
  choice: kwenye maangamizi
  rationale: “Maangamizi” huwasilisha hukumu na uharibifu wa mwisho kwa lugha ya sasa, iliyo wazi na yenye uzito.
- source_word: ὑπάγει
  choice: anaenda
  rationale: Kitenzi cha wakati uliopo kimetafsiriwa kwa usemi rahisi na hai, bila kuongeza ufafanuzi wa namna au muda ambao haupo katika matini.
theological_decisions:
- issue: Iwapo nomino inayodokezwa iongezwe kuwa “mfalme wa nane”
  choice: Kuacha usemi kuwa “wa nane” bila kuongeza “mfalme” katika matini kuu.
  alternative: mfalme wa nane
  rationale: Muktadha wa karibu unazungumzia wafalme, hivyo “mfalme” inawezekana kueleweka; hata hivyo, nomino βασιλεύς haipo katika mstari huu. Kuiacha bila kutajwa kunahifadhi ufupi na utata wa matini.
- issue: Iwapo ἐκ τῶν ἑπτά ifafanuliwe kuwa “mmoja wa wale saba”
  choice: Kutafsiri kuwa “anatokana na wale saba.”
  alternative: ni mmoja wa wale saba
  rationale: Kirai kinaweza kuonyesha asili, uanachama, au uhusiano wa karibu. Tafsiri iliyochaguliwa haifungi ishara hii katika utambulisho mmoja mahususi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo unahifadhi uradidi na utata wa lugha ya kiapokaliptiki huku ukibaki wazi kwa msomaji wa kawaida.
