  text: καὶ τὰ δέκα κέρατα ἃ εἶδες καὶ τὸ θηρίον, οὗτοι μισήσουσι τὴν πόρνην, καὶ ἠρημωμένην ποιήσουσιν αὐτὴν καὶ ⸀γυμνήν, καὶ τὰς σάρκας αὐτῆς φάγονται, καὶ αὐτὴν κατακαύσουσιν ἐν πυρί·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/016.yaml
  text: And the ten horns that you saw[a], and the beast—these will hate the prostitute, and they will make her desolate and naked, and they will eat her flesh[b], and they will burn her up with fire.
translation:
  language: sw
  text: Na zile pembe kumi ulizoziona, pamoja na yule mnyama—hao watamchukia yule kahaba. Watamfanya awe ukiwa na uchi[a], watakula nyama yake[b], na watamteketeza kabisa kwa moto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akiwa amevuliwa nguo.” Kigiriki kinasema “uchi,” likiwa na wazo la kufedhehishwa hadharani na kuwekwa wazi.
    reason: lexical_alternative
  - marker: b
    text: “Nyama” ni tafsiri halisi hapa; katika taswira ya kiapokaliptiki ya Ufunuo, kauli hii inaonyesha kuangamizwa kabisa kwa ukatili.
    reason: cultural_note
lexical_decisions:
- source_word: κέρατα
  choice: pembe
  rationale: Neno la mfano limetafsiriwa moja kwa moja kama “pembe,” bila kulibadili kuwa wafalme au mamlaka, kwa kuwa mstari wenyewe unahifadhi ishara hiyo ya kiapokaliptiki.
- source_word: θηρίον
  choice: mnyama
  rationale: “Mnyama” ni tafsiri ya kawaida na ya moja kwa moja inayohifadhi taswira ya kutisha bila kuifafanua kupita maandishi.
- source_word: πόρνην
  choice: kahaba
  rationale: “Kahaba” ni neno la sasa, linaloeleweka kwa urahisi na lenye hadhi inayofaa kwa tafsiri ya Biblia.
- source_word: ἠρημωμένην ποιήσουσιν
  choice: watamwacha katika hali ya ukiwa
  rationale: Kauli hii inaonyesha kusababisha hali ya kuharibiwa na kuachwa bila kitu. Muundo huu wa Kiswahili ni wa kawaida zaidi kuliko tafsiri ya neno kwa neno isiyo laini.
- source_word: γυμνήν
  choice: uchi
  rationale: “Uchi” huhifadhi maana ya moja kwa moja ya kivumishi cha Kigiriki, pamoja na wazo la kufedheheshwa na kuwekwa wazi.
- source_word: σάρκας
  choice: nyama ya mwili wake
  rationale: Kauli hii huhifadhi taswira halisi ya “flesh” na kuepuka kueleweka tu kama chakula cha kawaida.
- source_word: φάγονται
  choice: watakula
  rationale: Hii ni tafsiri ya moja kwa moja ya kitenzi, bila kukibadili kuwa “watameza” au “watatafuna.”
- source_word: κατακαύσουσιν ἐν πυρί
  choice: watamteketeza kabisa kwa moto
  rationale: “Kutekeza kabisa” huonyesha nguvu ya kitenzi changamani κατακαίω, na “kwa moto” ni Kiswahili cha kawaida kwa ἐν πυρί.
- source_word: οὗτοι
  choice: hao
  rationale: Kiwakilishi hiki cha kurejelea kwa mkazo kinawahusisha kwa pamoja pembe na mnyama kama watendaji waliobinafsishwa, huku kikihifadhi urejeleo wa msisitizo wa Kigiriki.
theological_decisions:
- issue: Uhusiano wa “pembe kumi” na “mnyama” na vitenzi vya wingi
  choice: 'Kuhifadhi somo la pamoja kisha kutumia kiwakilishi cha msisitizo: “pamoja na yule mnyama—hao wata...”'
  alternative: Kulainisha kuwa “pembe kumi ulizoziona na yule mnyama wata...” bila kiwakilishi cha kurejelea
  rationale: Kigiriki kinatumia kiwakilishi cha wingi οὗτοι baada ya kutaja pembe na mnyama. Muundo wa Kiswahili unahifadhi msisitizo huo na kuwaonyesha kama mawakala wanaotenda pamoja.
- issue: Asili ya taswira ya kuangamizwa kwa kahaba
  choice: Kuhifadhi lugha ya mfano ya kiapokaliptiki bila kumtambulisha kahaba moja kwa moja kama mji au mfumo fulani
  alternative: Kufasiri ishara hiyo moja kwa moja katika maandishi makuu
  rationale: Mstari wenyewe unatoa taswira ya hukumu kwa lugha ya mfano; tafsiri haipaswi kuamua kimya-kimya maana ya ishara ambayo kifungu kinaiacha katika umbo lake la kiapokaliptiki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye staha na inayoeleweka kwa wasomaji wa kawaida. Alama ya mkato mrefu inahifadhi msisitizo wa kiwakilishi cha Kigiriki. Taswira kali haijalainishwa wala kufasiriwa kimadhehebu.
