source:
  edition: SBLGNT
  text: Ὧδε ὁ νοῦς ὁ ἔχων σοφίαν. αἱ ἑπτὰ κεφαλαὶ ἑπτὰ ὄρη εἰσίν, ὅπου ἡ γυνὴ κάθηται ἐπ’ αὐτῶν. καὶ βασιλεῖς ⸂ἑπτά εἰσιν⸃·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/009.yaml
  text: 'Here is the mind that has wisdom: the seven heads are seven mountains on which the woman sits[a], and they are seven kings.'
translation:
  language: sw
  text: 'Hapa ndipo ilipo akili yenye hekima: vichwa saba ni milima saba ambayo juu yake mwanamke huyo ameketi[a], nayo ni wafalme saba.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “vilima saba.” Neno la Kigiriki linaweza kumaanisha milima au vilima; “milima” ndiyo tafsiri ya moja kwa moja zaidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὧδε
  choice: Hapa ndipo panapohitaji
  rationale: Katika muktadha huu neno hilo linatanguliza hitaji la utambuzi; muundo huu ni wa asili katika Kiswahili na unaendeleza nguvu ya 'hapa' bila kuifanya sentensi kuwa ngumu.
- source_word: ὁ νοῦς ὁ ἔχων σοφίαν
  choice: akili yenye hekima
  rationale: Huhifadhi maneno ya msingi ya νοῦς na σοφία na wazo la uwezo wa kuelewa ishara, bila kuyafasiri zaidi.
- source_word: αἱ ἑπτὰ κεφαλαὶ
  choice: vichwa saba
  rationale: Huhifadhi moja kwa moja taswira ya kiishara bila kuitolea ufafanuzi ndani ya tafsiri.
- source_word: ἑπτὰ ὄρη
  choice: milima saba
  rationale: ὄρη kwa kawaida humaanisha milima; 'vilima' ni uwezekano wa kileksika unaowekwa katika tanbihi ili kuepuka kulazimisha utambulisho wa Roma.
- source_word: ὅπου ... κάθηται ἐπ’ αὐτῶν
  choice: ambayo mwanamke huyo ameketi juu yake
  rationale: Huunganisha kwa Kiswahili cha kawaida wazo la mahali na ἐπί, huku ikihifadhi wazi kwamba mwanamke ameketi juu ya hiyo milima.
- source_word: ἡ γυνὴ
  choice: mwanamke huyo
  rationale: Kiashiria 'huyo' kinamrejelea mwanamke wa maono ambaye tayari ametajwa, bila kuongeza tafsiri ya utambulisho wake.
- source_word: καὶ βασιλεῖς ἑπτά εἰσιν
  choice: nayo ni wafalme saba
  rationale: Kiambishi 'nayo' kinarejelea vichwa saba na kuhifadhi utambulisho wa pili wa kiishara badala ya kutenganisha kauli kuwa 'kuna wafalme saba'.
theological_decisions:
- issue: Utambulisho wa kiishara wa vichwa saba
  choice: Kuhifadhi ulinganifu wa vichwa, milima, na wafalme bila kubainisha wahusika wa kihistoria
  alternative: Kutafsiri milima saba kuwa vilima saba vya Roma, au wafalme saba kuwa watawala au falme fulani
  rationale: Aya yenyewe inatoa ulinganifu wa kiishara lakini haitaji wazi rejeleo lake la kihistoria; tafsiri haipaswi kutatua mvutano huo kimadhehebu au kiufafanuzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo 'Hapa ndipo panapohitaji...' ni wa kawaida na unaeleweka, huku msamiati wa kiishara wa aya ukihifadhiwa.
