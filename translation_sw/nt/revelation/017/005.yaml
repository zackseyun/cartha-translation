base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/005.yaml
  text: 'And on her forehead a name was written: Mystery[a], Babylon the Great, the mother of prostitutes and of the abominations of the earth.'
translation:
  language: sw
  text: 'Na kwenye paji la uso wake jina lilikuwa limeandikwa: “Siri[a], Babeli Mkuu, mama wa makahaba na wa machukizo ya dunia.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “Na kwenye paji la uso wake jina lilikuwa limeandikwa: siri—Babeli Mkuu, mama wa makahaba na wa machukizo ya dunia,” ikiwa neno “siri” linaeleweka kuwa linatanguliza maana ya kiishara ya jina hilo badala ya kuwa sehemu ya maandishi yenyewe.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπὶ τὸ μέτωπον αὐτῆς
  choice: juu ya paji la uso wake
  rationale: Huwasilisha wazi mahali palipoandikwa jina, kwa Kiswahili cha kawaida na chenye kuhifadhi taswira ya maandishi kwenye paji la uso.
- source_word: ὄνομα γεγραμμένον
  choice: palikuwa pameandikwa jina hili
  rationale: Muundo huu wa Kiswahili ni wa asili na huhifadhi hali ya kutendwa pamoja na matokeo ya kitendo cha kuandika; ‘hili’ hutambulisha maandishi yanayofuata bila kuongeza maana ya msingi.
- source_word: μυστήριον
  choice: Siri
  rationale: ‘Siri’ ni neno la kawaida na lenye hadhi linalowasilisha jambo lililofichika au lenye maana ya ndani katika muktadha wa kiapokaliptiki; limeandikwa kama sehemu ya jina, huku uwezekano mwingine ukihifadhiwa katika tanbihi.
- source_word: Βαβυλὼν ἡ μεγάλη
  choice: Babeli Mkuu
  rationale: ‘Babeli’ ni umbo la jina lililozoeleka katika Kiswahili cha Biblia, na ‘Mkuu’ hulifanya kuwa cheo cha jina hilo kwa mtiririko wa asili.
- source_word: ἡ μήτηρ
  choice: mama
  rationale: Huhifadhi sitiari ya moja kwa moja ya chanzo au mzazi katika maandishi.
- source_word: τῶν πορνῶν
  choice: wa makahaba
  rationale: ‘Makahaba’ ni tafsiri ya moja kwa moja, ya sasa, na inayoeleweka ya πόρναι bila kuipanua kuwa uasherati kwa ujumla.
- source_word: τῶν βδελυγμάτων
  choice: wa machukizo
  rationale: ‘Machukizo’ huhifadhi uzito wa kimaadili na wa kiibada wa βδελύγματα katika lugha ya Biblia.
- source_word: τῆς γῆς
  choice: ya dunia
  rationale: Katika upeo wa kimataifa wa Ufunuo, ‘dunia’ inafaa zaidi kuliko ‘nchi’; muundo wa sentensi unaunganisha usemi huu na makahaba pamoja na machukizo.
theological_decisions:
- issue: Kama μυστήριον ni sehemu ya maandishi ya jina au ni maelezo yanayotanguliza maana yake ya mfano
  choice: 'Imewekwa kama sehemu ya jina: “Siri, Babeli Mkuu...”'
  alternative: '“jina lilikuwa limeandikwa, likiwa siri: Babeli Mkuu...” ambapo ‘siri’ hutambulisha maana ya mfano ya jina badala ya kuwa sehemu ya jina lenyewe.'
  rationale: Kigiriki hakina alama za uakifishaji za kuamua suala hili, na mpangilio wa maneno unaruhusu ‘Siri’ kuwa sehemu ya jina. Uwezekano mwingine ni halali, kwa hiyo umehifadhiwa katika tanbihi badala ya kuondolewa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Lugha ya kiapokaliptiki na uzito wa taswira umehifadhiwa bila kuongeza ufafanuzi wa kimadhehebu.
