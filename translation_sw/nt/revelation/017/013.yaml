id: REV.17.13
reference: Revelation 17:13
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οὗτοι μίαν ⸂γνώμην ἔχουσιν⸃, καὶ τὴν δύναμιν ⸀καὶ ἐξουσίαν αὐτῶν τῷ θηρίῳ διδόασιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/013.yaml
  text: These are of one mind[a], and they give their power and authority to the beast.
translation:
  language: sw
  text: Hawa wana nia moja[a], nao wanampa yule mnyama nguvu na mamlaka yao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wana kusudi moja.” Kirai cha Kigiriki kinasema kihalisi kwamba “wana fikra moja,” na kinaweza kueleza azimio au kusudi la pamoja.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτοι
  choice: Hawa
  rationale: Kiwakilishi hiki kinawarejelea wafalme kumi waliotajwa kabla; “Hawa” ni cha kawaida na kinahifadhi nguvu ya urejezi.
- source_word: μίαν γνώμην ἔχουσιν
  choice: wana nia moja
  rationale: Kirai hiki kinaweza kumaanisha kuwa na mtazamo, azimio, au kusudi la pamoja. “Wana nia moja” ni Kiswahili cha asili kinachohifadhi wazo la umoja wa fikra na azimio bila kulibana kuwa kusudi pekee.
- source_word: δύναμιν
  choice: nguvu
  rationale: Katika muktadha huu wa kisiasa na kiapokaliptiki, neno hili linamaanisha uwezo au nguvu ya kutenda.
- source_word: ἐξουσίαν
  choice: mamlaka
  rationale: Neno hili linaonyesha mamlaka au haki ya kutawala, na hivyo linabaki tofauti na “nguvu.”
- source_word: τὴν δύναμιν καὶ ἐξουσίαν αὐτῶν
  choice: nguvu na mamlaka yao
  rationale: Muundo huu wa Kiswahili ni wa kawaida na unahifadhi dhana zote mbili tofauti huku kivumishi kimilikishi kikihusu zote.
- source_word: τῷ θηρίῳ
  choice: yule mnyama
  rationale: “Mnyama” ndilo neno la kawaida kwa sura hii ya kiapokaliptiki; “yule” linaonyesha kuwa ni mnyama aliyekwisha tajwa.
- source_word: διδόασιν
  choice: wanampa
  rationale: Wakati uliopo wa Kigiriki umehifadhiwa; kiambishi cha mtendewa ni cha asili katika Kiswahili na kinaonyesha wazi kwamba mnyama ndiye anayepokea.
theological_decisions:
- issue: Maana ya kirai μίαν γνώμην ἔχουσιν katika muktadha wa kisiasa wa kiapokaliptiki
  choice: wana nia moja
  alternative: wana kusudi moja
  rationale: Kirai kinaweza kueleza mtazamo, azimio, au kusudi la pamoja. “Nia moja” kinaacha upana huo badala ya kuamua kwamba maana ni kusudi pekee.
- issue: Kutofautisha δύναμις na ἐξουσία
  choice: nguvu na mamlaka
  alternative: uwezo na haki ya kutawala
  rationale: Kutumia nomino mbili tofauti kunahifadhi tofauti kati ya nguvu yenye matokeo na mamlaka ya kutawala.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, ya heshima, na inayoeleweka kwa urahisi. “Nao” linaunganisha vifungu kwa mtiririko wa kawaida; “yule mnyama” linadumisha urejezi kwa mhusika aliyekwisha tajwa.
