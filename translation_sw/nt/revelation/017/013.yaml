  source_fidelity: Tafsiri inawakilisha kwa uaminifu οὗτοι, μίαν γνώμην ἔχουσιν, na utofauti wa δύναμις na ἐξουσία. “Hawa wana nia moja” huhifadhi umoja wa mtazamo/azimio bila kuufunga kwenye “kusudi” pekee; “nguvu na mamlaka yao” hutunza nomino zote mbili na umilikishi wao; na “wanampa yule mnyama” hutoa kwa kawaida tendo la sasa la διδόασιν na mpokeaji mwenye artikeli.
