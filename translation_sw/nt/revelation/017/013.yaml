  terminology: “Mnyama” ni istilahi thabiti na inayotambulika kwa θηρίον katika Ufunuo. “Nguvu” na “mamlaka” hutofautisha kwa usahihi δύναμις na ἐξουσία. Tanbihi inaeleza mbadala wa kimsamiati bila kuamua kupita kiasi maana ya γνώμη.
