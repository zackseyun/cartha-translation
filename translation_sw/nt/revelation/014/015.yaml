id: REV.14.15
reference: Revelation 14:15
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἄλλος ἄγγελος ἐξῆλθεν ἐκ τοῦ ναοῦ κράζων ἐν φωνῇ μεγάλῃ τῷ καθημένῳ ἐπὶ τῆς νεφέλης· Πέμψον τὸ δρέπανόν σου καὶ θέρισον, ὅτι ἦλθεν ἡ ὥρα θερίσαι, ὅτι ἐξηράνθη ὁ θερισμὸς τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/015.yaml
  text: And another angel came out from the sanctuary, crying out with a loud voice to the one seated on the cloud, “Send your sickle and reap, because the hour to reap has come, because the harvest of the earth is ripe.”
translation:
  language: sw
  text: Kisha malaika mwingine akatoka hekaluni, akipaza sauti kubwa kwa yule aliyeketi juu ya wingu, “Tuma mundu wako, ukavune, kwa maana saa ya kuvuna imefika, kwa sababu mavuno ya dunia yamekauka[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, yamefikia hali ya kuvunwa; neno la Kigiriki hasa husema “yamekauka.”
    reason: Huhifadhi taswira ya ἐξηράνθη (“yamekauka”) huku ikifafanua matumizi yake ya kimuktadha kuhusu mavuno yaliyo tayari kuvunwa.
lexical_decisions:
- source_word: ναός
  choice: hekalu
  rationale: Katika muktadha wa Ufunuo, neno hili linaonyesha patakatifu/hekaluni pa Mungu; “hekalu” ni la kawaida na lenye hadhi katika Kiswahili, bila kulazimisha ufafanuzi mwembamba zaidi.
- source_word: Πέμψον τὸ δρέπανόν σου
  choice: Tuma mundu wako
  rationale: Huhifadhi kitenzi cha Kigiriki “tuma” na picha halisi ya mundu, badala ya kukibadili kuwa “tumia” au “chukua”.
- source_word: θέρισον / θερίσαι
  choice: ukavune / kuvuna
  rationale: Huwasilisha kwa kawaida tendo la kuvuna huku ikidumisha urudiaji wa mzizi uliopo katika Kigiriki.
- source_word: ἐξηράνθη
  choice: yamekomaa
  rationale: Kihalisi kina wazo la kukauka; kuhusu mavuno, maana ya kimuktadha ni kuwa tayari kuvunwa. “Yamekomaa” ni Kiswahili cha kawaida kinachohifadhi maana hiyo bila kuingiza wazo lisilo hakika la “kuiva kupita kiasi”.
- source_word: ὁ θερισμὸς τῆς γῆς
  choice: mavuno ya dunia
  rationale: “Mavuno” linaweza kumaanisha mazao yaliyo tayari kuvunwa, na “dunia” huhifadhi upeo mpana wa γῆς katika muktadha huu.
theological_decisions:
- issue: Utambulisho na mamlaka ya yule aliyeketi juu ya wingu
  choice: yule aliyeketi juu ya wingu
  alternative: Mwana wa Adamu aliyeketi juu ya wingu
  rationale: Aya hii yenyewe hutumia kirai elezi bila kurudia utambulisho wa aya iliyotangulia; tafsiri haipaswi kuongeza jina hapa.
- issue: Hali ya mavuno
  choice: mavuno ya dunia yamekomaa
  alternative: mavuno ya dunia yamekauka / yameiva kupita kiasi
  rationale: Huhifadhi picha ya wakati mwafaka wa hukumu au uvunaji bila kuamua kuwa mazao yameharibika au yamepitwa na wakati, jambo ambalo Kigiriki hakilazimishi waziwazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kisimulizi na hadhi ya maandiko. Muundo wa “akatoka… akamwambia” ni wa kawaida na wazi; “mundu” huhifadhi taswira ya kilimo. Hakuna alama za tanbihi kwa kuwa hakuna tanbihi zinazohitajika.
