id: REV.14.17
reference: Revelation 14:17
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ ἄλλος ἄγγελος ἐξῆλθεν ἐκ τοῦ ναοῦ τοῦ ἐν τῷ οὐρανῷ, ἔχων καὶ αὐτὸς δρέπανον ὀξύ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/017.yaml
  text: And another angel came out from the temple in heaven[a], also having a sharp sickle.
translation:
  language: sw
  text: Kisha malaika mwingine akatoka katika hekalu lililo mbinguni[a]; yeye pia alikuwa na mundu mkali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “patakatifu palipo mbinguni.” Neno la Kigiriki ναός linaweza kumaanisha hasa sehemu ya ndani ya hekalu, yaani patakatifu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλος ἄγγελος
  choice: malaika mwingine
  rationale: Hutoa kwa kawaida maana ya malaika mwingine wa aina ileile na kuendeleza mfuatano wa wahusika katika maono.
- source_word: ἐξῆλθεν
  choice: akatoka
  rationale: Kitenzi kinaonyesha kutoka ndani ya mahali fulani; “akatoka” ni cha asili na kinaendeleza usimulizi.
- source_word: ναοῦ
  choice: hekalu
  rationale: “Hekalu” ni tafsiri ya kawaida na inayoeleweka, huku tanbihi ikihifadhi maana mahususi zaidi ya patakatifu pa ndani.
- source_word: τοῦ ἐν τῷ οὐρανῷ
  choice: lililo mbinguni
  rationale: Kishazi hiki kinatambulisha mahali hekalu lilipo kwa uwazi na kwa Kiswahili cha asili.
- source_word: ἔχων καὶ αὐτὸς
  choice: yeye pia alikuwa na
  rationale: Inahifadhi msisitizo kwamba malaika huyu pia, kama mhusika aliyetangulia, alikuwa na mundu.
- source_word: δρέπανον
  choice: mundu
  rationale: “Mundu” ni neno la kawaida la Kiswahili kwa chombo chenye upindo kinachotumiwa kuvunia.
- source_word: ὀξύ
  choice: mkali
  rationale: Kivumishi hiki kinaeleza ukali wa mundu kwa lugha ya kawaida na yenye picha wazi.
theological_decisions:
- issue: Asili ya taswira ya hekalu la mbinguni
  choice: Kutafsiri ναός moja kwa moja kuwa “hekalu” bila maelezo ya kiufafanuzi.
  alternative: Kutafsiri “patakatifu” ili kusisitiza sehemu ya ndani ya hekalu, au kufafanua kama makao ya mbinguni yenye maana ya mfano.
  rationale: Maandishi yanaweka taswira ya kiapokaliptiki bila kuamua kama hekalu hilo lieleweke kwa maana ya usanifu, ishara, au ibada. Tafsiri inahifadhi mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. “Kisha” huendeleza mfuatano wa maono, na muundo wa “yeye pia alikuwa na” huweka wazi msisitizo wa καὶ αὐτός.
