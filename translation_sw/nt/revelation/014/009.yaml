id: REV.14.9
reference: Revelation 14:9
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ ἄλλος ἄγγελος τρίτος ἠκολούθησεν αὐτοῖς λέγων ἐν φωνῇ μεγάλῃ· Εἴ τις προσκυνεῖ τὸ θηρίον καὶ τὴν εἰκόνα αὐτοῦ, καὶ λαμβάνει χάραγμα ἐπὶ τοῦ μετώπου αὐτοῦ ἢ ἐπὶ τὴν χεῖρα αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/009.yaml
  text: And another angel[a], a third, followed them, saying with a loud voice, “If anyone worships the beast and its image[b], and receives a mark on his forehead or on his hand,”
translation:
  language: sw
  text: Kisha malaika mwingine, wa tatu, akawafuata, akisema kwa sauti kuu, “Mtu yeyote akimwabudu yule mnyama na sanamu yake, na akipokea alama kwenye paji la uso wake au kwenye mkono wake,”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλλος ἄγγελος τρίτος
  choice: malaika mwingine, wa tatu
  rationale: Huhifadhi maneno yote mawili, ἄλλος na τρίτος, na kuonyesha kwamba huyu ni malaika mwingine, naye ni wa tatu katika mfululizo.
- source_word: ἠκολούθησεν αὐτοῖς
  choice: akawafuata
  rationale: Hutoa kwa kawaida mfuatano wa simulizi unaoonyeshwa na kitenzi cha wakati uliopita; kiambishi -wa- kinarejelea waliotangulia.
- source_word: λέγων ἐν φωνῇ μεγάλῃ
  choice: akisema kwa sauti kuu
  rationale: Ni Kiswahili cha kawaida na chenye hadhi kinachohifadhi nguvu na uwazi wa tangazo la malaika.
- source_word: Εἴ τις
  choice: Mtu yeyote aki-
  rationale: Muundo huu huwasilisha sharti lisilomhusu mtu maalumu na upeo wa jumla wa onyo.
- source_word: προσκυνεῖ
  choice: akimwabudu
  rationale: Katika muktadha huu kitenzi kinaonyesha ibada na utiifu wa kidini kwa mnyama, si kuinama kimwili tu.
- source_word: τὸ θηρίον
  choice: yule mnyama
  rationale: ‘Mnyama’ ndilo neno la kawaida la Kiswahili kwa kiumbe huyu wa kiapokaliptiki; ‘yule’ humtambulisha yule anayejulikana tayari katika muktadha.
- source_word: τὴν εἰκόνα αὐτοῦ
  choice: sanamu yake
  rationale: Katika muktadha wa ibada, ‘sanamu’ huwasilisha picha au mfano unaoabudiwa kwa Kiswahili cha asili kuliko ‘picha’.
- source_word: λαμβάνει χάραγμα
  choice: kupokea alama
  rationale: ‘Kupokea’ huonyesha kukubali au kutiwa alama, huku ‘alama’ likihifadhi maana pana ya χάραγμα bila kuifafanua kupita kiasi.
- source_word: ἐπὶ τοῦ μετώπου αὐτοῦ ἢ ἐπὶ τὴν χεῖρα αὐτοῦ
  choice: kwenye paji la uso wake au kwenye mkono wake
  rationale: Huhifadhi mahali panapotajwa na umoja wa viwakilishi vya Kigiriki kwa muundo wa Kiswahili unaoeleweka.
theological_decisions:
- issue: Nguvu ya kidini ya προσκυνέω kwa mnyama
  choice: akimwabudu
  alternative: akimsujudia
  rationale: Muktadha unahusu ibada ya sanamu na utii kwa mnyama. ‘Kumwabudu’ huonyesha wazi uzito wa kidini; ‘kumsujudia’ lingeweza kueleweka kama tendo la mwili pekee.
- issue: Rejeo la αὐτοῦ baada ya τις
  choice: paji la uso wake ... mkono wake
  alternative: paji la uso ... mkono
  rationale: Kiswahili hutumia ‘wake’ kwa umoja bila kuweka jinsia ya mtu; hivyo huhifadhi umoja wa chanzo na kutotaja jinsia ambayo Kiswahili haihitaji.
- issue: εἰκών katika mazingira ya ibada ya mnyama
  choice: sanamu yake
  alternative: picha yake
  rationale: ‘Sanamu’ huonyesha mfano unaopewa ibada bila kuamua umbo au nyenzo yake kwa undani zaidi ya muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi umehifadhi kwamba mstari huu unaendelea hadi mstari unaofuata; hakuna tanbihi iliyohitajika kwa kuwa tofauti muhimu zinaweza kuwasilishwa wazi katika matini.
