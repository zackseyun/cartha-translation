id: REV.14.3
reference: Revelation 14:3
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ᾄδουσιν ⸀ὡς ᾠδὴν καινὴν ἐνώπιον τοῦ θρόνου καὶ ἐνώπιον τῶν τεσσάρων ζῴων καὶ τῶν πρεσβυτέρων· καὶ οὐδεὶς ἐδύνατο μαθεῖν τὴν ᾠδὴν εἰ μὴ αἱ ἑκατὸν τεσσεράκοντα τέσσαρες χιλιάδες, οἱ ἠγορασμένοι ἀπὸ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/003.yaml
  text: And they are singing what seemed to be a new song before the throne and before the four living creatures and the elders[a]. And no one was able to learn the song except the one hundred forty-four thousand[b], those who had been purchased from the earth.
translation:
  language: sw
  text: Nao wanaimba wimbo ulioonekana kuwa mpya[a] mbele ya kiti cha enzi na mbele ya wale viumbe hai wanne na wale wazee. Wala hakuna mtu aliyeweza kujifunza wimbo huo isipokuwa wale elfu mia moja arobaini na nne[b], ambao walikuwa wamenunuliwa kutoka duniani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kama wimbo mpya.” Kigiriki kinatumia lugha ya mwonekano inayopatikana mara nyingi katika maono ya Ufunuo.
    reason: lexical_alternative
  - marker: b
    text: Au, “waliokuwa wamekombolewa kutoka duniani.” Kitenzi cha Kigiriki kwa maana halisi ni “kununua.”
    reason: alternative_reading
lexical_decisions:
- source_word: ᾄδουσιν
  choice: wanaimba
  rationale: Wakati uliopo wa Kigiriki umetafsiriwa kwa wakati uliopo wa Kiswahili, unaofaa kwa usimulizi hai wa maono katika Ufunuo.
- source_word: ὡς ᾠδὴν καινὴν
  choice: wimbo ulioonekana kuwa mpya
  rationale: Huhifadhi ὡς kama lugha ya mtazamaji katika maono bila kukana kwamba kwa kweli ulikuwa wimbo mpya; mpangilio umefanywa wa asili katika Kiswahili.
- source_word: ἐνώπιον
  choice: mbele ya
  rationale: Ni usemi mfupi na wa kawaida unaodumisha maana ya kuwa katika uwepo wa kiti cha enzi na viumbe wa mbinguni.
- source_word: τῶν τεσσάρων ζῴων
  choice: wale viumbe hai wanne
  rationale: Huwatambulisha viumbe wa mbinguni wanaozunguka kiti cha enzi, bila kutumia neno linaloweza kueleweka tu kuwa wanyama.
- source_word: τῶν πρεσβυτέρων
  choice: wazee
  rationale: Ni jina la kawaida la kundi hili linalotambulika katika baraza la mbinguni katika Ufunuo.
- source_word: οὐδεὶς ἐδύνατο μαθεῖν
  choice: Hakuna mtu aliyeweza kujifunza
  rationale: Huhifadhi hali ya kutoweza iliyotolewa na kitenzi cha Kigiriki pamoja na maana ya msingi ya μαθεῖν.
- source_word: αἱ ἑκατὸν τεσσεράκοντα τέσσαρες χιλιάδες
  choice: wale mia moja arobaini na nne elfu
  rationale: Idadi imeandikwa kwa maneno kwa hadhi ya kifasihi na uwazi, huku kiashiria cha kundi maalumu kikihifadhiwa kwa 'wale'.
- source_word: οἱ ἠγορασμένοι ἀπὸ τῆς γῆς
  choice: ambao walikuwa wamenunuliwa kutoka duniani
  rationale: Huhifadhi sitiari ya biashara ya ἀγοράζω na maana ya ἀπό kama kutoka, bila kuingiza moja kwa moja istilahi pana zaidi ya kitheolojia.
theological_decisions:
- issue: Nguvu ya ὡς katika maelezo ya maono
  choice: wimbo ulioonekana kuwa mpya
  alternative: kama wimbo mpya
  rationale: Tafsiri hii hudumisha lugha ya mtazamaji katika maono bila kutoa uamuzi kwamba wimbo huo haukuwa mpya kwa hakika; mbadala halisi zaidi umewekwa katika tanbihi.
- issue: Tafsiri ya ἠγορασμένοι
  choice: wamenunuliwa
  alternative: wamekombolewa
  rationale: Neno la Kigiriki linatumia moja kwa moja sitiari ya kununua. 'Wamekombolewa' linafaa kitheolojia katika muktadha mpana, lakini linaongeza ufafanuzi zaidi ya maana ya msingi; kwa hiyo limehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi zimepangwa kwa mtiririko wa kawaida wa Kiswahili, huku urudiaji wa 'mbele ya' na hali ya kimafumbo ya maono vikihifadhiwa. Viashiria vyote vya tanbihi vimo katika matini kuu.
