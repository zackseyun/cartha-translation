id: REV.14.8
reference: Revelation 14:8
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ ἄλλος ⸂δεύτερος ἄγγελος⸃ ἠκολούθησεν λέγων· Ἔπεσεν, ⸀ἔπεσεν Βαβυλὼν ἡ μεγάλη, ⸀ἣ ἐκ τοῦ οἴνου τοῦ θυμοῦ τῆς πορνείας αὐτῆς πεπότικεν πάντα τὰ ἔθνη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/008.yaml
  text: And another[a], a second angel, followed, saying, “Fallen, fallen is Babylon the great[c][b], she who has made all the nations drink from the wine of the passion of her sexual immorality.”
translation:
  language: sw
  text: Na malaika mwingine, wa pili, akafuata, akisema, “Imeanguka, imeanguka Babeli ule mkuu, ambaye amefanya mataifa yote yanywe divai ya ghadhabu[a] ya uasherati wake[b].”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “tamaa kali ya uasherati wake” au “hasira kali ya uasherati wake.” Neno la Kigiriki θυμός linaweza kumaanisha ghadhabu, hasira kali, au msukumo mkali wa hisia.
    reason: lexical_alternative
  - marker: b
    text: “Uasherati” wa Babeli unaweza kuwa taswira ya ushawishi wake mpotovu, ibada ya sanamu, au ukosefu wa uaminifu; hata hivyo, mstari huu hauifungi taswira hiyo kwenye maana moja tu.
    reason: cultural_note
  - marker: c
    text: Au, “ameyalewesha mataifa yote.” Kigiriki kinasema kihalisi kwamba amefanya mataifa yote yanywe.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλος … δεύτερος ἄγγελος
  choice: malaika mwingine, wa pili
  rationale: Huhifadhi maneno yote mawili, ‘mwingine’ na ‘wa pili,’ huku kishazi cha ufafanuzi kikisikika kwa kawaida katika Kiswahili.
- source_word: ἠκολούθησεν λέγων
  choice: akafuata, akisema
  rationale: Muundo huu unaonyesha mfuatano wa tukio katika maono na pia unahifadhi uhusiano wa kitenzi kishirikishi λέγων na tendo la kufuata.
- source_word: Ἔπεσεν, ἔπεσεν
  choice: Imeanguka, imeanguka
  rationale: Wakati timilifu wa Kiswahili unawasilisha tangazo la kuanguka lililotimia na lenye athari ya sasa; urudiaji unahifadhi mkazo wa tangazo la kinabii.
- source_word: Βαβυλὼν ἡ μεγάλη
  choice: Babeli mkuu
  rationale: ‘Babeli’ ndilo umbo la jina lililozoeleka katika Kiswahili cha Biblia, na ‘mkuu’ huhifadhi hadhi ya kimajina ya ἡ μεγάλη.
- source_word: ἣ
  choice: ambaye
  rationale: Kiwakilishi hiki humrejelea Babeli aliyefanywa kama mhusika binafsi, badala ya kuifanya rejeo hiyo kuwa kitu kisicho na uhai.
- source_word: ἐκ τοῦ οἴνου τοῦ θυμοῦ
  choice: divai ya jazba
  rationale: ‘Jazba’ inaweza kuashiria msukumo mkali wa hisia, hasira, au shauku, hivyo huhifadhi kiasi cha utata wa θυμός kuliko kuifunga maana kwa ‘ghadhabu’ au ‘tamaa’ pekee.
- source_word: τῆς πορνείας αὐτῆς
  choice: ya uasherati wake
  rationale: ‘Uasherati’ ni neno la sasa na pana linaloweza kubeba maana halisi na pia taswira ya ukosefu wa uaminifu na ibada ya sanamu bila kuifafanua kupita maandishi.
- source_word: πεπότικεν πάντα τὰ ἔθνη
  choice: amefanya mataifa yote yanywe
  rationale: Huhifadhi maana sababishi ya ποτίζω na upeo wa ‘mataifa yote’; muundo wa wakati timilifu huonyesha tendo lililotimizwa lenye matokeo yanayoendelea.
theological_decisions:
- issue: Nguvu ya kisitiari ya πορνεία ya Babeli
  choice: uasherati
  alternative: ibada ya sanamu; ukosefu wa uaminifu; ukahaba
  rationale: Maandishi yenyewe yanadumisha taswira ya kingono bila kuifasiri hapa kama dhambi moja maalumu; tafsiri inadumisha mvutano huo.
- issue: Maana ya θυμός katika ‘divai ya θυμός ya uasherati wake’
  choice: jazba
  alternative: ghadhabu; hasira kali; tamaa kali
  rationale: Neno la Kigiriki linaweza kueleza hasira kali au msukumo wenye nguvu. ‘Jazba’ hudumisha uwezekano wa shauku yenye kuwapotosha mataifa na pia dokezo la ukali au ghadhabu.
- issue: Babeli kama mhusika wa kike katika maandishi ya Kigiriki
  choice: ambaye
  alternative: ambayo
  rationale: ‘Ambaye’ hudumisha ubinafsishaji wa mji kama mwanamke, ingawa Kiswahili hakilazimishi jinsia ya kike katika kiwakilishi hiki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mtindo wa tangazo la kinabii umehifadhiwa kwa urudiaji ‘Imeanguka, imeanguka,’ huku sentensi ikibaki wazi kwa msomaji wa kawaida.
