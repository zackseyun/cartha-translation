  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ αὐτὸς πίεται ἐκ τοῦ οἴνου τοῦ θυμοῦ τοῦ θεοῦ τοῦ κεκερασμένου ἀκράτου ἐν τῷ ποτηρίῳ τῆς ὀργῆς αὐτοῦ, καὶ βασανισθήσεται ἐν πυρὶ καὶ θείῳ ἐνώπιον ⸂ἀγγέλων ἁγίων⸃ καὶ ἐνώπιον τοῦ ἀρνίου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/010.yaml
  text: he also will drink from the wine of God's wrath[a], mixed undiluted in the cup of his anger[b], and he will be tormented with fire and sulfur before the holy angels and before the Lamb.
translation:
  language: sw
  text: yeye pia atakunywa divai ya ghadhabu kali ya Mungu, iliyotayarishwa katika kikombe cha hasira yake bila kutiwa maji[a]. Naye atateswa kwa moto na kiberiti[b] mbele ya malaika watakatifu na mbele ya Mwanakondoo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa kufuata muundo wa Kigiriki kwa karibu zaidi: “iliyochanganywa, isiyotiwa maji.” Maneno hayo yanasisitiza kwamba divai ya hukumu haijapunguzwa nguvu hata kidogo.'
    reason: lexical_alternative
  - marker: b
    text: Kiberiti ni salfa (sulfur); tafsiri za kale za Kiingereza mara nyingi hutumia “brimstone.”
    reason: lexical_clarification
lexical_decisions:
- source_word: καὶ αὐτός
  choice: yeye pia
  rationale: Kiwakilishi kimetiliwa mkazo na καί kinaonyesha nyongeza; “yeye pia” hurejelea wazi mtu aliyetajwa katika mstari uliotangulia.
- source_word: πίεται ἐκ τοῦ οἴνου
  choice: atakunywa divai
  rationale: Hii ni Kiswahili cha kawaida kwa tendo la kunywa kiasi kutoka katika divai; kutafsiri ἐκ moja kwa moja kuwa “kutoka katika divai” kungekuwa kwa kukakamaa.
- source_word: θυμοῦ τοῦ θεοῦ
  choice: ghadhabu kali ya Mungu
  rationale: θυμός hapa ni hasira yenye nguvu katika hukumu ya Mungu; “ghadhabu kali” huhifadhi uzito huo na pia kuitofautisha na ὀργή baadaye.
- source_word: τοῦ κεκερασμένου ἀκράτου
  choice: iliyotayarishwa ... bila kuchanganywa na maji
  rationale: Kirai cha Kigiriki huunganisha divai iliyotayarishwa au kuchanganywa na divai isiyotiwa maji. Tafsiri hii inaeleza kwa Kiswahili cha kawaida kwamba divai iko tayari kikombeni lakini haijapunguzwa nguvu kwa maji.
- source_word: ἐν τῷ ποτηρίῳ τῆς ὀργῆς αὐτοῦ
  choice: katika kikombe cha hasira yake
  rationale: “Katika” hufuata ἐν, huku “hasira” ikihifadhi tofauti fulani kati ya ὀργή na θυμός.
- source_word: βασανισθήσεται
  choice: atateswa
  rationale: Kitenzi cha wakati ujao na kauli ya kutendwa kinaonyesha mateso makali ya adhabu.
- source_word: ἐν πυρὶ καὶ θείῳ
  choice: kwa moto na kiberiti
  rationale: “Kiberiti” ni neno la sasa na linaloeleweka kwa sulfur katika taswira hii ya hukumu.
- source_word: ἐνώπιον ἀγγέλων ἁγίων καὶ ἐνώπιον τοῦ ἀρνίου
  choice: mbele ya malaika watakatifu na mbele ya Mwanakondoo
  rationale: Kurudia “mbele ya” huhifadhi urudiaji wa ἐνώπιον na kuweka makundi yote mawili wazi.
theological_decisions:
- issue: Kutofautisha θυμός na ὀργή katika mstari mmoja
  choice: θυμός imetafsiriwa “ghadhabu kali,” na ὀργή “hasira.”
  alternative: Kutafsiri yote mawili kuwa “ghadhabu,” au θυμός kuwa “hasira kali” na ὀργή kuwa “ghadhabu.”
  rationale: Maneno hayo yanahusiana lakini si sawa kabisa. Kutumia maneno tofauti kunahifadhi nguvu ya usemi wa Kigiriki bila kujenga tofauti ya kimafundisho iliyo kubwa kuliko maandishi.
- issue: Nguvu ya τοῦ κεκερασμένου ἀκράτου
  choice: “iliyotayarishwa ... bila kuchanganywa na maji”
  alternative: “iliyochanganywa bila kuchanganywa” au “iliyomiminwa ikiwa na nguvu kamili.”
  rationale: Kigiriki kina mvutano wa kimakusudi kati ya divai iliyotayarishwa au kuchanganywa na iliyo ἄκρατος, yaani isiyotiwa maji. Tafsiri kuu inafanya picha ieleweke, na tanbihi inahifadhi muundo wa karibu zaidi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imegawanywa baada ya picha ya kikombe ili isomeke kwa urahisi bila kupoteza uhusiano wa matendo. “Mwanakondoo” imeandikwa kwa herufi kubwa kwa kuwa ni jina la kimajazi linalomrejelea Kristo katika Ufunuo.
