id: REV.14.13
reference: Revelation 14:13
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ ἤκουσα φωνῆς ἐκ τοῦ οὐρανοῦ λεγούσης· Γράψον· Μακάριοι οἱ νεκροὶ οἱ ἐν κυρίῳ ἀποθνῄσκοντες ἀπ’ ἄρτι. ⸂ναί, λέγει⸃ τὸ πνεῦμα, ἵνα ⸀ἀναπαήσονται ἐκ τῶν κόπων αὐτῶν, τὰ ⸀γὰρ ἔργα αὐτῶν ἀκολουθεῖ μετ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/013.yaml
  text: 'And I heard a voice from heaven saying[a], “Write: Blessed are the dead who die in the Lord from now on.” “Yes,” says the Spirit, “so that they may rest from their labors[b], for their deeds follow with them.”'
translation:
  language: sw
  text: 'Nami nikasikia sauti kutoka mbinguni ikisema, “Andika: Heri wafu wanaokufa katika Bwana tangu sasa.” “Naam,” asema Roho, “ili wapumzike kutokana na taabu zao[a], kwa maana matendo yao yanaambatana nao[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kazi zao ngumu.” Neno la Kigiriki linaweza kumaanisha kazi, jasho, au taabu yenye kuchosha.
    reason: lexical_alternative
  - marker: b
    text: Au, “matendo yao yanawafuata.”
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνῆς ἐκ τοῦ οὐρανοῦ λεγούσης
  choice: sauti kutoka mbinguni ikisema
  rationale: ‘Sauti’ ni tafsiri ya kawaida ya φωνή, na ‘kutoka mbinguni’ huonyesha chanzo kilichowekwa wazi na ἐκ τοῦ οὐρανοῦ; ‘ikisema’ huhifadhi kishiriki λεγούσης kwa Kiswahili cha asili.
- source_word: Γράψον
  choice: Andika
  rationale: Ni amri ya moja kwa moja katika nafsi ya pili umoja; hakuna haja ya kuongeza yambwa lisilokuwapo katika Kigiriki.
- source_word: Μακάριοι
  choice: Heri
  rationale: ‘Heri’ ni lugha ya kawaida ya hali ya kubarikiwa katika tafsiri za baraka, yenye uzito wa kidini bila kuifanya iwe hisia ya furaha tu.
- source_word: οἱ νεκροὶ
  choice: wafu
  rationale: Kivumishi hiki kimetumiwa kama nomino; ‘wafu’ ni Kiswahili cha kawaida na sahihi.
- source_word: οἱ ἐν κυρίῳ ἀποθνῄσκοντες
  choice: wanaokufa katika Bwana
  rationale: Muundo huu huhifadhi maana pana ya ἐν κυρίῳ bila kuifafanua kuwa uaminifu, umiliki, au muungano pekee.
- source_word: ἀπ’ ἄρτι
  choice: tangu sasa
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha mwanzo wa hali kuanzia wakati huu na kuendelea.
- source_word: ναί, λέγει τὸ πνεῦμα
  choice: Naam, asema Roho
  rationale: ‘Naam’ huhifadhi uthibitisho wenye mkazo wa ναί; ‘Roho’ hubaki mhusika aliyetajwa wazi.
- source_word: ἵνα ἀναπαήσονται
  choice: ili wapumzike
  rationale: ‘Ili’ huonyesha kusudi au tokeo la ἵνα, huku hali ya kitenzi ‘wapumzike’ ikiwa ya kawaida katika Kiswahili baada ya ‘ili’; haitatui kupita kiasi tofauti ndogo ya kusudi na tokeo.
- source_word: ἐκ τῶν κόπων αὐτῶν
  choice: kutokana na taabu zao
  rationale: κόπος inaweza kumaanisha kazi yenye kuchosha, taabu, au jasho; ‘taabu zao’ ni ya asili na inajumuisha uchovu na mateso bila kuishusha kuwa huzuni ya kihisia tu.
- source_word: τὰ γὰρ ἔργα αὐτῶν
  choice: kwa maana matendo yao
  rationale: ἔργα humaanisha kazi au matendo; ‘matendo’ ni ya asili katika muktadha wa mwenendo wa kimaadili na huepuka dhana finyu ya ajira.
- source_word: ἀκολουθεῖ μετ’ αὐτῶν
  choice: yanafuatana nao
  rationale: ‘Yanafuatana nao’ huhifadhi wazo la kufuata pamoja nao lililo katika μετά, badala ya kulifanya tu kuwa ‘yanawafuata.’
theological_decisions:
- issue: Maana ya ‘katika Bwana’ kuhusu wafu
  choice: katika Bwana
  alternative: wakiwa wa Bwana; wakiwa waaminifu kwa Bwana
  rationale: Tafsiri ya karibu huhifadhi upana wa lugha kuhusu uhusiano, kuwa mali ya Bwana, au muungano naye bila kulazimisha maana moja.
- issue: Nguvu ya ἵνα ἀναπαήσονται
  choice: ili wapumzike
  alternative: hivyo watapumzika; wapate kupumzika
  rationale: Muundo wa Kiswahili huhifadhi uwezekano wa kusudi au tokeo bila kugeuza sentensi kuwa amri wala kuondoa kabisa mwelekeo wake wa mbele.
- issue: Uhusiano wa matendo na wafu walio heri
  choice: matendo yao yanafuatana nao
  alternative: matendo yao yanawafuata
  rationale: Aya inasema matendo yao yanaambatana nao lakini haielezi kama ni msingi wa thawabu, ushuhuda, au utaratibu wa wokovu; tafsiri haiongezi fundisho hilo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa msomaji wa kawaida. ‘Heri,’ ‘Naam,’ na ‘Roho’ hudumisha sauti ya kifungu bila kutumia lugha ya kizamani kupita kiasi. Alama zote za tanbihi [a] na [b] zimewekwa katika matini kuu.
