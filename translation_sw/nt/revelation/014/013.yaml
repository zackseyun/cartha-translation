revisions:
- from: 'Kisha nikasikia sauti kutoka mbinguni ikisema, “Andika: Heri wafu wanaokufa katika Bwana tangu sasa.” “Naam,” asema Roho, “ili wapumzike kutokana na taabu zao[a], kwa maana matendo yao yanafuatana nao[b].”'
  to: 'Nami nikasikia sauti kutoka mbinguni ikisema, “Andika: Heri wafu wanaokufa katika Bwana tangu sasa.” “Naam,” asema Roho, “ili wapumzike kutokana na taabu zao[a], kwa maana matendo yao yanaambatana nao[b].”'
  rationale: 'The revision makes two small, safe improvements: it renders the opening καί neutrally as “Nami,” and it replaces the less idiomatic “yanafuatana nao” with “yanaambatana nao,” which better expresses that the deeds accompany the dead. No theological inference has been added, and the textual ambiguity of the ἵνα clause remains intact.'
