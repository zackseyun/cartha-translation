review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately represents the Greek: the heavenly voice, the imperative “Andika,” the beatitude for those dying “katika Bwana,” the temporal “tangu sasa,” the Spirit’s confirmation, rest from κόποι, and the accompanying works are all retained. “Ili wapumzike” appropriately preserves the purpose/result openness of ἵνα with the future verb.'
  naturalness: The register is clear, reverent Standard East African Swahili. However, “matendo yao yanafuatana nao” is somewhat awkward and can suggest that the deeds follow one another. “Matendo yao yanaambatana nao” is more idiomatic while still preserving μετά (“with them”). “Nami nikasikia” is a natural narrative rendering of Καὶ ἤκουσα without adding the stronger temporal sequence suggested by “Kisha.”
  terminology: “Heri,” “wafu,” “katika Bwana,” “Roho,” and “matendo” are appropriate established biblical terms. “Taabu zao” is a suitably broad rendering of κόποι and the footnote appropriately identifies the labor/toil nuance.
  issues:
  - severity: low
    issue: “Kisha” gives Καὶ a more explicitly sequential sense than is necessary.
    rationale: The Greek connective is simply καί. “Nami” retains the narrative connection more neutrally and idiomatically.
  - severity: medium
    issue: “Yanafuatana nao” is less natural and may be semantically imprecise for ἀκολουθεῖ μετ’ αὐτῶν.
    rationale: The Greek says that their works follow/accompany with them. “Yanaambatana nao” clearly conveys accompaniment and preserves the force of μετά without implying that the deeds follow each other.
  revised_text: 'Nami nikasikia sauti kutoka mbinguni ikisema, “Andika: Heri wafu wanaokufa katika Bwana tangu sasa.” “Naam,” asema Roho, “ili wapumzike kutokana na taabu zao[a], kwa maana matendo yao yanaambatana nao[b].”'
  revised_footnotes:
  - marker: a
    text: Au, “kazi zao ngumu.” Neno la Kigiriki linaweza kumaanisha kazi, jasho, au taabu yenye kuchosha.
    reason: lexical_alternative
  - marker: b
    text: Au, “matendo yao yanawafuata.”
    reason: lexical_alternative
  revision_rationale: 'The revision makes two small, safe improvements: it renders the opening καί neutrally as “Nami,” and it replaces the less idiomatic “yanafuatana nao” with “yanaambatana nao,” which better expresses that the deeds accompany the dead. No theological inference has been added, and the textual ambiguity of the ἵνα clause remains intact.'
