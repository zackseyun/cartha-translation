id: REV.14.20
reference: Revelation 14:20
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἐπατήθη ἡ ληνὸς ἔξωθεν τῆς πόλεως, καὶ ἐξῆλθεν αἷμα ἐκ τῆς ληνοῦ ἄχρι τῶν χαλινῶν τῶν ἵππων ἀπὸ σταδίων χιλίων ἑξακοσίων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/020.yaml
  text: And the winepress was trodden outside the city[b][a], and blood came out from the winepress up to the horses’ bridles for one thousand six hundred stadia.
translation:
  language: sw
  text: Nalo shinikizo la kukamulia divai likakanyagwa nje ya mji, na damu ikatoka[b] katika shinikizo hilo, ikafika hadi kwenye hatamu za farasi kwa umbali wa stadia elfu moja na mia sita.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Stadion ilikuwa kipimo cha umbali cha zamani; stadia 1,600 ni takriban kilomita 296.
    reason: cultural_note
  - marker: b
    text: Au, “damu ikatiririka kutoka katika shinikizo hilo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπατήθη
  choice: likakanyagwa
  rationale: Kitenzi hiki cha kauli ya kutendwa huhifadhi picha halisi ya kukanyaga yaliyomo katika shinikizo la divai, badala ya kuieleza kwa jumla kuwa ‘lilikamuliwa.’
- source_word: ληνός / ληνοῦ
  choice: shinikizo la divai
  rationale: Ni istilahi ya kawaida na inayoeleweka kwa kifaa au mahali pa kukamulia zabibu, huku ikihifadhi taswira ya mavuno na hukumu.
- source_word: ἔξωθεν τῆς πόλεως
  choice: nje ya mji
  rationale: Huwasilisha kwa uwazi na kwa Kiswahili cha kawaida mahali palipoelezwa katika chanzo.
- source_word: ἐξῆλθεν αἷμα
  choice: damu ikatoka
  rationale: Hufuata maana ya moja kwa moja ya ἐξέρχομαι, ‘kutoka,’ bila kuongeza namna ya mwendo wa damu; ‘ikatiririka’ imewekwa kama uwezekano katika tanbihi.
- source_word: ἄχρι τῶν χαλινῶν τῶν ἵππων
  choice: ikafika hadi kwenye hatamu za farasi
  rationale: Huhifadhi kipimo hai cha kiwango kilichofikiwa na damu bila kufafanua zaidi iwapo ni kina au taswira nyingine ya kiwango.
- source_word: ἀπὸ σταδίων χιλίων ἑξακοσίων
  choice: kwa umbali wa stadia elfu moja na mia sita
  rationale: Huwasilisha ukubwa wa eneo au umbali kwa Kiswahili cha kawaida huku ikihifadhi kipimo cha kale cha maandishi ya chanzo.
theological_decisions:
- issue: Iwapo taswira ya hukumu ya kiapokaliptiki ilainishwe au ifafanuliwe
  choice: Kudumisha picha halisi ya damu, hatamu za farasi na stadia
  alternative: Kuifafanua kwa jumla kuwa hukumu kubwa mno
  rationale: Maandishi yenyewe yanatoa taswira kali na ya makusudi. Tafsiri haipaswi kuamua maana yake ya kiishara wala kupunguza mvutano wake.
- issue: Iwapo ἄχρι inaeleza kwa hakika kina cha damu
  choice: 'Kutafsiri kwa lugha isiyoamua zaidi: ‘ikafika hadi kwenye hatamu za farasi’'
  alternative: ‘ilikuwa na kina kilichofika kwenye hatamu za farasi’
  rationale: Chanzo kinataja kiwango kilichofikiwa lakini hakitumii neno mahususi la ‘kina’; tafsiri inadumisha uwezekano huo bila kuufanya kuwa wazi kuliko Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo wa sentensi umebaki karibu na Kigiriki, lakini viunganishi na mpangilio vimewekwa kwa namna ya kawaida katika Kiswahili. ‘Nalo’ huendeleza simulizi, na ‘shinikizo hilo’ huepusha urudiaji mzito bila kupoteza rejeleo.
