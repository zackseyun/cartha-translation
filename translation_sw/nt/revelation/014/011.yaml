id: REV.14.11
reference: Revelation 14:11
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ὁ καπνὸς τοῦ βασανισμοῦ αὐτῶν εἰς αἰῶνας αἰώνων ἀναβαίνει, καὶ οὐκ ἔχουσιν ἀνάπαυσιν ἡμέρας καὶ νυκτός, οἱ προσκυνοῦντες τὸ θηρίον καὶ τὴν εἰκόνα αὐτοῦ, καὶ εἴ τις λαμβάνει τὸ χάραγμα τοῦ ὀνόματος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/011.yaml
  text: And the smoke of their torment goes up forever and ever[a], and they have no rest day and night, those who worship the beast and its image[b], and whoever receives the mark of its name.
translation:
  language: sw
  text: Na moshi wa mateso yao unapanda milele na milele[a], nao hawana pumziko mchana na usiku—wale wanaomwabudu yule mnyama na sanamu yake, na ikiwa mtu yeyote anapokea alama ya jina lake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata maneno yenyewe kwa ukaribu zaidi, “kwa zama za zama.”
    reason: lexical_alternative
  - marker: b
    text: Kigiriki kinamalizia kwa ghafla kwa maneno “na ikiwa mtu yeyote anapokea alama ya jina lake,” ambayo huenda yanaendeleza maelezo ya wale walio chini ya hukumu. Tafsiri nyingine hulainisha kuwa “na yeyote anayeipokea.”
    reason: alternative_reading
lexical_decisions:
- source_word: καπνὸς
  choice: moshi
  rationale: Nomino halisi na ya moja kwa moja inayohifadhi taswira ya kiapokaliptiki.
- source_word: βασανισμοῦ
  choice: mateso
  rationale: Neno la kawaida na lenye hadhi linaloonyesha maumivu makali katika muktadha wa hukumu bila kubainisha njia maalumu ya kutesa.
- source_word: εἰς αἰῶνας αἰώνων
  choice: milele na milele
  rationale: Nahau hii ya Kiswahili huwasilisha kwa kawaida nguvu ya usemi wa Kigiriki unaoonyesha muda usio na mwisho; tafsiri halisi zaidi imewekwa katika tanbihi.
- source_word: ἀναβαίνει
  choice: unapanda juu
  rationale: Wakati uliopo unahifadhi taswira hai na endelevu ya moshi unaoinuka.
- source_word: ἀνάπαυσιν
  choice: pumziko
  rationale: Ni kisawe cha moja kwa moja kinachohifadhi tofauti kati ya kupumzika na mateso yasiyokoma.
- source_word: ἡμέρας καὶ νυκτός
  choice: mchana na usiku
  rationale: Nahau ya kawaida ya Kiswahili inayoonyesha mwendelezo wa wakati.
- source_word: προσκυνοῦντες
  choice: wanaomwabudu
  rationale: Katika Ufunuo kitenzi hiki kinaonyesha ibada na utii wa kidini, si kuinama tu kimwili.
- source_word: θηρίον
  choice: mnyama
  rationale: Tafsiri iliyo wazi na iliyozoeleka kwa taswira hii ya Ufunuo; kiashiria 'yule' husaidia kurejelea mhusika maalumu.
- source_word: εἰκόνα
  choice: sanamu
  rationale: Katika muktadha wa kuabudu, 'sanamu' ni ya asili zaidi kuliko 'picha' na huhifadhi maana ya kitu kinachowakilisha mnyama bila kukifunga kwa umbo maalumu.
- source_word: εἴ τις λαμβάνει
  choice: ikiwa mtu yeyote anaipokea
  rationale: Inafuata badiliko la ghafla la Kigiriki kutoka maelezo ya wingi hadi sharti la umoja, badala ya kulainisha kuwa kishazi cha kawaida cha uhusiano.
- source_word: χάραγμα
  choice: alama
  rationale: Ni neno pana na la kawaida linalofaa ishara ya utambulisho katika Ufunuo.
- source_word: τοῦ ὀνόματος αὐτοῦ
  choice: ya jina lake
  rationale: Huhifadhi muundo wa Kigiriki bila kuufafanua zaidi kuwa alama inayobeba jina.
theological_decisions:
- issue: Muda wa hukumu katika εἰς αἰῶνας αἰώνων
  choice: milele na milele
  alternative: kwa zama za zama
  rationale: Nahau ya Kigiriki katika Ufunuo ina nguvu ya muda unaoendelea bila mwisho. Tafsiri kuu huhifadhi nguvu hiyo, huku tanbihi ikionyesha umbo la maneno lililo halisi zaidi bila kuingiza mfumo maalumu wa kimafundisho.
- issue: Rejeleo na sintaksia ya kishazi cha mwisho
  choice: na ikiwa mtu yeyote anaipokea alama ya jina lake
  alternative: na yeyote anayeipokea alama ya jina lake
  rationale: Kigiriki hubadilika kutoka kwa kivumishi-shirikishi cha wingi hadi sharti lisilo na mhusika maalumu katika umoja. Tafsiri imehifadhi ukali huo wa ghafla, na tanbihi inaeleza kwamba kishazi kinaelekea kuendeleza maelezo ya walio chini ya hukumu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi umehifadhi marudio na ukali wa kifungu cha Kigiriki; vistari virefu vinasaidia kutenganisha maelezo ya kundi bila kuficha badiliko la kisintaksia. Kila alama ya tanbihi ipo katika matini kuu.
