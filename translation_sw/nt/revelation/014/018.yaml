  to: Malaika mwingine akatoka kwenye madhabahu, akiwa na mamlaka juu ya moto. Akaita kwa sauti kubwa yule aliyekuwa na mundu mkali, akisema, “Tuma mundu wako mkali[a], na uvune vishada vya mzabibu wa dunia[b], kwa maana zabibu zake zimeiva.”
