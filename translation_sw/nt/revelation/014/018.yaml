id: REV.14.18
reference: Revelation 14:18
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἄλλος ⸀ἄγγελος ἐκ τοῦ θυσιαστηρίου, ⸀ὁ ἔχων ἐξουσίαν ἐπὶ τοῦ πυρός, καὶ ἐφώνησεν ⸀φωνῇ μεγάλῃ τῷ ἔχοντι τὸ δρέπανον τὸ ὀξὺ λέγων· Πέμψον σου τὸ δρέπανον τὸ ὀξὺ καὶ τρύγησον τοὺς βότρυας τῆς ἀμπέλου τῆς γῆς, ὅτι ἤκμασαν αἱ σταφυλαὶ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/018.yaml
  text: And another angel came out from the altar[a], the one who has authority over the fire, and he called out with a loud voice to the one who had the sharp sickle, saying, “Send out your sharp sickle and gather the clusters of the vine of the earth[b], because its grapes are ripe.”
translation:
  language: sw
  text: Malaika mwingine akatoka kwenye madhabahu, akiwa na mamlaka juu ya moto. Akaita kwa sauti kubwa yule aliyekuwa na mundu mkali, akisema, “Tuma mundu wako mkali[a], na uvune vishada vya mzabibu wa dunia[b], kwa maana zabibu zake zimeiva.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Tia mundu wako mkali.” Kitenzi cha Kigiriki maana yake ya msingi ni “tuma,” lakini katika taswira ya mavuno wengine hutafsiri kwa namna ya kawaida zaidi, “tia.”
    reason: lexical_alternative
  - marker: b
    text: “Mzabibu wa dunia” ni taswira ya kiapokaliptiki. Mstari huu hautaji wazi unachowakilisha, ingawa muktadha unaozunguka ni wa hukumu.
    reason: cross_reference
lexical_decisions:
- source_word: ἄλλος ἄγγελος
  choice: malaika mwingine
  rationale: Katika maono ya Ufunuo, ἄγγελος kwa kawaida humaanisha kiumbe wa mbinguni; “mwingine” inadumisha mfuatano wa simulizi.
- source_word: ἐκ τοῦ θυσιαστηρίου
  choice: akatoka kwenye madhabahu
  rationale: “Madhabahu” ni neno la kawaida kwa θυσιαστήριον, na “kutoka kwenye” ni Kiswahili cha asili kinachohifadhi uhusiano wa malaika na madhabahu bila kudokeza kwamba alikuwa ndani yake.
- source_word: ὁ ἔχων ἐξουσίαν ἐπὶ τοῦ πυρός
  choice: naye alikuwa na mamlaka juu ya moto
  rationale: Kirai hiki kinamtambulisha malaika kwa mamlaka au udhibiti alio nao kuhusiana na moto. Wakati uliopita unaendana kwa kawaida na simulizi ya Kiswahili bila kubadili maana ya sifa hiyo.
- source_word: ἐφώνησεν φωνῇ μεγάλῃ
  choice: Akamwita kwa sauti kubwa
  rationale: Huhifadhi kitendo cha kumwita mtu pamoja na msisitizo wa wazi wa sauti kubwa, kwa lugha ya kawaida na yenye heshima.
- source_word: τῷ ἔχοντι τὸ δρέπανον τὸ ὀξὺ
  choice: yule aliyekuwa na mundu mkali
  rationale: “Mundu” hueleza δρέπανον, chombo cha kuvunia, na “mkali” imehifadhiwa kwa sababu inarudiwa kwa msisitizo katika mstari.
- source_word: Πέμψον σου τὸ δρέπανον τὸ ὀξὺ
  choice: Tuma mundu wako mkali
  rationale: “Tuma” hufuata maana ya msingi ya πέμπω na kuhifadhi picha isiyo ya kawaida ya mundu kutumwa; njia ya kusema kitendo cha kuvuna kwa Kiswahili imetolewa katika tanbihi.
- source_word: τρύγησον τοὺς βότρυας
  choice: ukavune vishada
  rationale: τρυγάω humaanisha kuvuna zabibu hasa, na βότρυες ni vishada vya zabibu. “Vishada” kinaeleweka kutokana na kutajwa kwa mzabibu na zabibu katika muktadha wa karibu.
- source_word: τῆς ἀμπέλου τῆς γῆς
  choice: vya mzabibu wa dunia
  rationale: Muundo wa uhusiano wa maneno ya Kigiriki umehifadhiwa, pamoja na taswira ya kiapokaliptiki, bila kuifasiri kuwa kundi fulani la watu.
- source_word: ἤκμασαν αἱ σταφυλαὶ αὐτῆς
  choice: zabibu zake zimeiva
  rationale: ἀκμάζω hapa huonyesha kufikia hali ya kuiva. “Zimeiva” ni Kiswahili cha kawaida kisichoongeza msisitizo wa “kabisa” ambao haujalazimishwa na kitenzi.
theological_decisions:
- issue: Utambulisho wa “mzabibu wa dunia” katika taswira ya kiapokaliptiki
  choice: Taswira imehifadhiwa kama “mzabibu wa dunia” bila kutaja wazi watu inaowakilisha.
  alternative: Kuitafsiri moja kwa moja kuwa waovu wa dunia au wanadamu wanaohukumiwa.
  rationale: Muktadha unaonyesha hukumu, lakini mstari wenyewe unatoa sitiari bila kuitambulisha wazi. Tafsiri inahifadhi mvutano huo wa kiteolojia badala ya kuutatua kimafundisho.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wazi, wa sasa na wenye heshima. Maneno ya picha kama “mundu,” “vishada,” na “mzabibu wa dunia” yamehifadhiwa ili kutoondoa taswira ya mavuno na hukumu.
