review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the sequence of another angel coming from the altar, his authority over the fire, the loud address to the bearer of the sharp sickle, the repeated adjective “sharp,” the grape-harvest imagery, and the unexplained metaphor of “the vine of the earth.” A small adjustment is warranted because Greek ὁ ἔχων is a present descriptive participle (“having authority”), better represented by “akiwa na mamlaka” than the past narrative “alikuwa na mamlaka.”
  naturalness: The Swahili is clear and suitably formal. “Akamwita kwa sauti kubwa” is natural, though “akaita kwa sauti kubwa” more directly represents calling out. “Na uvune” gives the two Greek imperatives equal, direct force more naturally than the consecutive “ukavune.”
  terminology: “Malaika,” “madhabahu,” “mamlaka,” “moto,” “mundu,” “vishada,” and “mzabibu wa dunia” are appropriate Standard East African Swahili terms. The apocalyptic metaphor is retained without doctrinally identifying its referent. The footnote markers are attached to the relevant command and image.
  issues:
  - severity: low
    issue: Past-tense description of the angel’s authority
    rationale: “Naye alikuwa na mamlaka” can be read simply as narrative past, but ὁ ἔχων describes the angel as presently having authority. “Akiwa na mamlaka” preserves the descriptive force without awkwardness.
  - severity: low
    issue: Coordination of the two commands
    rationale: Greek has two imperatives, Πέμψον and τρύγησον. In Swahili, “Tuma ... na uvune ...” preserves their equal imperative force more directly than “ukavune.”
  revised_text: Malaika mwingine akatoka kwenye madhabahu, akiwa na mamlaka juu ya moto. Akaita kwa sauti kubwa yule aliyekuwa na mundu mkali, akisema, “Tuma mundu wako mkali[a], na uvune vishada vya mzabibu wa dunia[b], kwa maana zabibu zake zimeiva.”
