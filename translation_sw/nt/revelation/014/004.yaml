id: REV.14.4
reference: Revelation 14:4
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οὗτοί εἰσιν οἳ μετὰ γυναικῶν οὐκ ἐμολύνθησαν, παρθένοι γάρ εἰσιν· ⸀οὗτοι οἱ ἀκολουθοῦντες τῷ ἀρνίῳ ὅπου ἂν ⸀ὑπάγῃ· ⸁οὗτοι ἠγοράσθησαν ἀπὸ τῶν ἀνθρώπων ἀπαρχὴ τῷ θεῷ καὶ τῷ ἀρνίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/004.yaml
  text: These are the ones who have not defiled themselves with women[a], for they are virgins. These are the ones who follow the Lamb wherever he goes. These were purchased from among mankind as firstfruits to God and to the Lamb[b],
translation:
  language: sw
  text: Hawa ndio wale ambao hawakujitia unajisi na wanawake[a], kwa maana wao ni mabikira. Hawa ndio wanaomfuata Mwanakondoo kokote aendako. Hawa walinunuliwa kutoka miongoni mwa wanadamu[b], wakiwa malimbuko kwa Mungu na kwa Mwanakondoo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au huenda taswira hii inaashiria usafi wa kiroho au kujiepusha na unajisi unaotokana na ibada ya sanamu, badala ya kuwa kauli inayohusu tu kujiepusha na mahusiano ya kingono.
    reason: alternative_reading
  - marker: b
    text: Yaani, kutoka miongoni mwa binadamu au watu. Neno la Kigiriki linawahusu binadamu kwa jumla, si wanaume pekee.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμολύνθησαν
  choice: hawakutiwa unajisi
  rationale: Kauli tendwa ya Kigiriki imehifadhiwa, pamoja na maana ya unajisi wa kimaadili au wa kiibada, bila kuamua kama taswira hiyo ni halisi au ya kiroho.
- source_word: μετὰ γυναικῶν
  choice: pamoja na wanawake
  rationale: μετά pamoja na hali ya umilikishi humaanisha ‘pamoja na’; ‘wanawake’ linafaa kuliko ‘wake’ kwa kuwa maandishi hayasemi wazi kuhusu hali ya ndoa.
- source_word: παρθένοι
  choice: mabikira
  rationale: Neno hili linahifadhi maana halisi na taswira thabiti ya παρθένοι badala ya kuibadilisha kuwa tafsiri ya kiroho kama ‘walio safi’.
- source_word: ἀκολουθοῦντες
  choice: wanaomfuata
  rationale: Muundo wa wakati uliopo unaonyesha tendo linalowatambulisha na linaloendelea; Kiswahili cha wakati uliopo kinawasilisha maana hiyo kwa kawaida.
- source_word: ἀρνίῳ
  choice: Mwanakondoo
  rationale: Katika Ufunuo hili ni jina-taswira la Kikristo kwa Yesu; herufi kubwa inaonyesha matumizi yake kama cheo huku taswira ya dhabihu ikihifadhiwa.
- source_word: ὅπου ἂν ὑπάγῃ
  choice: kokote aendako
  rationale: Kauli hii ya Kiswahili inatoa maana isiyo na mpaka ya ‘mahali popote anapoenda’ kwa lugha ya asili na yenye hadhi.
- source_word: ἠγοράσθησαν
  choice: walinunuliwa
  rationale: Huhifadhi sitiari ya kibiashara ya ἀγοράζω bila kuingiza moja kwa moja tafsiri ya kiteolojia ‘walikombolewa’.
- source_word: ἀπὸ τῶν ἀνθρώπων
  choice: kutoka miongoni mwa wanadamu
  rationale: ἄνθρωποι hapa inawahusu binadamu kwa jumla, si wanaume pekee; ‘wanadamu’ ni sahihi kijinsia na inafaa sajili ya kifungu.
- source_word: ἀπαρχὴ
  choice: malimbuko
  rationale: ‘Malimbuko’ ni istilahi ya kawaida ya sehemu ya kwanza ya mazao inayotolewa kwa Mungu na huhifadhi taswira ya mavuno na sadaka.
theological_decisions:
- issue: Iwapo kutotiwa unajisi pamoja na wanawake na kuwa mabikira kutafsiriwe kihalisi au kufafanuliwa kiishara katika matini kuu
  choice: Maneno halisi na taswira thabiti zimehifadhiwa katika matini kuu.
  alternative: Kuyafafanua moja kwa moja kuwa usafi wa kiroho au kutoshiriki ibada ya sanamu.
  rationale: Kigiriki kina lugha thabiti, lakini mazingira ya Ufunuo yanaweza kuipa nguvu ya kiishara. Tafsiri haipaswi kuondoa mvutano huo; uwezekano wa maana ya kiishara umeelezwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye hadhi na unaoeleweka. Miundo ‘kokote aendako’ na ‘wakiwa malimbuko’ ni ya asili, huku istilahi muhimu za kiapokaliptiki na kiibada—‘Mwanakondoo,’ ‘unajisi,’ na ‘malimbuko’—zikihifadhiwa.
