  text: καὶ ἔβαλεν ὁ καθήμενος ἐπὶ ⸂τῆς νεφέλης⸃ τὸ δρέπανον αὐτοῦ ἐπὶ τὴν γῆν, καὶ ἐθερίσθη ἡ γῆ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/016.yaml
  text: And the one seated on the cloud cast his sickle upon the earth[c][b][a], and the earth was harvested.
translation:
  language: sw
  text: Yule aliyeketi juu ya lile wingu akautupa mundu wake juu ya dunia[a], nayo dunia ikavunwa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akauelekeza mundu wake kuelekea dunia.” Kitenzi cha Kigiriki kwa maana yake ya msingi ni “kutupa,” lakini katika muktadha huu wa kuvuna huonyesha kuutumia mundu kuanza kuvuna.
    reason: lexical_alternative
  - marker: b
    text: Au, “nayo dunia ikakatwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔβαλεν
  choice: akapeleka
  rationale: Kitenzi βάλλω kwa msingi humaanisha kutupa au kuelekeza kitu; hapa, pamoja na mundu na muktadha wa mavuno, ‘akapeleka mundu wake’ huonyesha kuutumia kuelekea dunia bila kudokeza kwamba aliutupa na kuuachilia.
- source_word: ὁ καθήμενος ἐπὶ τῆς νεφέλης
  choice: Yule aliyekuwa ameketi juu ya lile wingu
  rationale: Huhifadhi kirai elezi chenye nomino iliyodokezwa na haimtambulishi mhusika kwa jina ambalo mstari huu wenyewe hautaji.
- source_word: νεφέλης
  choice: lile wingu
  rationale: Kibainishi cha Kigiriki na muktadha wa mstari uliotangulia vinaelekeza kwenye wingu lililokwisha tajwa.
- source_word: δρέπανον
  choice: mundu
  rationale: ‘Mundu’ ni kifaa chenye umbo la kupinda cha kuvunia na huhifadhi taswira halisi ya kilimo.
- source_word: ἐπὶ τὴν γῆν
  choice: juu ya dunia
  rationale: ἐπί pamoja na hali ya kuelekea huonyesha mwendo unaoelekezwa kwenye dunia; tafsiri hii huhifadhi picha na pia kiasi cha uwazi wa kirai cha Kigiriki.
- source_word: ἐθερίσθη
  choice: ikavunwa
  rationale: Huhifadhi kauli tendwa ya aoristi ya θερίζω na taswira ya mavuno.
- source_word: ἡ γῆ
  choice: dunia
  rationale: Katika muktadha wa kiapokaliptiki wa Ufunuo, ‘dunia’ inafaa kuliko ‘nchi’ na marudio yake yamehifadhiwa.
theological_decisions:
- issue: Utambulisho wa mvunaji aliyeketi juu ya wingu
  choice: Kumweleza tu kama ‘Yule aliyekuwa ameketi juu ya lile wingu.’
  alternative: Kumtambulisha wazi kuwa Mwana wa Adamu/Masihi au wakala wa kimalaika.
  rationale: Muktadha uliotangulia unaweza kuelekeza kwa Mwana wa Adamu, lakini mstari huu wenyewe hautaji jina; kwa hiyo tafsiri haiongezi utambulisho wa kifasiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kifasihi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Lile wingu’ huunganisha mstari huu na wingu lililotajwa katika muktadha uliotangulia; ‘mundu’ huhifadhi taswira ya kifaa cha kuvunia.
