  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἤκουσα φωνὴν ἐκ τοῦ οὐρανοῦ ὡς φωνὴν ὑδάτων πολλῶν καὶ ὡς φωνὴν βροντῆς μεγάλης, καὶ ἡ φωνὴ ἣν ἤκουσα ὡς κιθαρῳδῶν κιθαριζόντων ἐν ταῖς κιθάραις αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/002.yaml
  text: And I heard a sound from heaven like the sound of many waters and like the sound of loud thunder[c][b][a], and the sound that I heard was like harpists playing on their harps.
translation:
  language: sw
  text: Nikasikia sauti kutoka mbinguni, kama sauti ya maji mengi na kama sauti ya ngurumo kuu; na sauti niliyoisikia ilikuwa kama wapiga vinubi wakipiga vinubi vyao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki κιθάρα linataja ala ya kale ya nyuzi iliyofanana zaidi na zeze; kwa kawaida hutafsiriwa “kinubi.”
    reason: cultural_note
lexical_decisions:
- source_word: φωνή
  choice: sauti
  rationale: Katika Kiswahili, “sauti” huweza kumaanisha sauti ya kiumbe, kelele, au mlio kwa upana; hivyo inafaa kwa kulinganisha jambo lililosikika na maji, radi, na ala za muziki bila kulazimisha maana ya sauti inayotamka maneno.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: kutoka mbinguni
  rationale: Katika muktadha wa Ufunuo, οὐρανός inaelekea kumaanisha makao ya mbinguni, si anga tu; “kutoka mbinguni” ni usemi wa kawaida na wenye hadhi.
- source_word: ὡς
  choice: kama
  rationale: “Kama” huonyesha wazi kwamba haya ni mafananisho, kama ilivyo katika Kigiriki.
- source_word: ὑδάτων πολλῶν
  choice: maji mengi
  rationale: Tafsiri hii huhifadhi taswira ya kibiblia na mwangwi wake wa kimaandiko bila kuibadili kuwa maelezo kama “maji yanayovuma.”
- source_word: βροντῆς μεγάλης
  choice: radi kubwa
  rationale: μέγας hapa huonyesha ukubwa au nguvu ya radi. “Radi kubwa” huhifadhi upeo wa neno bila kuongeza kivumishi kisichokuwa lazima.
- source_word: κιθαρῳδῶν
  choice: wapiga vinubi
  rationale: Muktadha unaeleza wazi kwamba watu hao wanapiga ala zao. “Wapiga vinubi” ni fasiri fupi, ya kawaida, na inayoendana na istilahi iliyozoeleka katika tafsiri za Biblia.
- source_word: κιθαριζόντων
  choice: wakipiga
  rationale: Kitenzi hiki hutaja tendo la kupiga ala; “wakipiga” ni Kiswahili cha kawaida na cha moja kwa moja.
- source_word: ἐν ταῖς κιθάραις αὐτῶν
  choice: vinubi vyao
  rationale: Kiswahili husema kwa kawaida “kupiga kinubi”; si lazima kutafsiri ἐν kwa kihusishi tofauti. Muundo huu huhifadhi umiliki wa ala hizo.
theological_decisions:
- issue: Asili ya jambo lililosikika kutoka mbinguni
  choice: Kutumia “sauti” katika kila kutokea kwa φωνή.
  alternative: Kutumia “mlio” au kuchanganya “sauti” na “mlio.”
  rationale: “Sauti” katika Kiswahili ina upana unaotosha kujumuisha maji, radi, na muziki. Hivyo haidai kwamba ni sauti ya mtu anayesema, wala haiondoi uwezekano huo kupita kiwango cha maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Marudio ya “sauti” na “vinubi” yamehifadhiwa kwa sababu ni sehemu ya mtindo na msisitizo wa maandishi ya Kigiriki.
