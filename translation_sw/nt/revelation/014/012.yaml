  text: Ὧδε ἡ ὑπομονὴ τῶν ἁγίων ἐστίν, οἱ τηροῦντες τὰς ἐντολὰς τοῦ θεοῦ καὶ τὴν πίστιν Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/012.yaml
  text: Here is the endurance of the saints[a], those who keep the commandments of God and the faith of Jesus.
translation:
  language: sw
  text: Hapa ndipo penye uvumilivu wa watakatifu[a], wale wanaozishika amri za Mungu na imani ya Yesu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “imani katika Yesu”; pia yaweza kuwa “uaminifu wa Yesu.” Kirai cha Kigiriki kina maana zaidi ya moja.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὧδε
  choice: Hapa ndipo penye
  rationale: Huonyesha kwamba hali iliyoelezwa ndiyo mahali au mazingira ambamo uvumilivu wa watakatifu unaonekana; usemi huu ni wa asili katika Kiswahili na unahifadhi msisitizo wa Kigiriki.
- source_word: ὑπομονὴ
  choice: uvumilivu
  rationale: Neno hili lina maana ya kudumu kwa uthabiti chini ya majaribu; “uvumilivu” ni neno la kawaida, lenye heshima, na linalofaa katika muktadha.
- source_word: ἁγίων
  choice: watakatifu
  rationale: Ni jina la kawaida la Agano Jipya kwa watu wa Mungu waliowekwa wakfu kwake.
- source_word: τηροῦντες
  choice: wanaozishika
  rationale: Katika muktadha huu linamaanisha kuzitii na kuendelea kuzifuata amri za Mungu.
- source_word: ἐντολὰς
  choice: amri
  rationale: Linarejelea maagizo yenye mamlaka ya Mungu; “amri” ni tafsiri ya kawaida na ya moja kwa moja.
- source_word: πίστιν
  choice: imani
  rationale: “Imani” huhifadhi maana ya msingi bila kuamua kimyakimya kama hapa ni kumwamini Yesu au uaminifu unaohusishwa naye.
- source_word: Ἰησοῦ
  choice: ya Yesu
  rationale: Muundo wa “ya Yesu” unawakilisha hali ya umilikishi ya Kigiriki kwa ukaribu na kuhifadhi utata wake halisi.
theological_decisions:
- issue: Maana ya τὴν πίστιν Ἰησοῦ
  choice: imani ya Yesu
  alternative: imani katika Yesu; au uaminifu wa Yesu
  rationale: Kirai cha Kigiriki kinaweza kumaanisha imani inayoelekezwa kwa Yesu au imani/uaminifu unaohusishwa na Yesu. Matini kuu inabaki karibu na muundo wa Kigiriki, huku tanbihi ikihifadhi fasiri mbadala.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Yaani” hufanya kirai kishirikishi kinachofuata kiwe wazi kwa msomaji wa kawaida bila kubadili uhusiano wake wa ufafanuzi na “watakatifu.”
