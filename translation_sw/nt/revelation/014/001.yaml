id: REV.14.1
reference: Revelation 14:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ εἶδον, καὶ ἰδοὺ τὸ ἀρνίον ⸀ἑστὸς ἐπὶ τὸ ὄρος Σιών, καὶ μετ’ ⸀αὐτοῦ ἑκατὸν τεσσεράκοντα τέσσαρες χιλιάδες ἔχουσαι τὸ ὄνομα αὐτοῦ καὶ τὸ ὄνομα τοῦ πατρὸς αὐτοῦ γεγραμμένον ἐπὶ τῶν μετώπων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/001.yaml
  text: Then I looked[a], and behold, the Lamb was standing on Mount Zion, and with him were one hundred forty-four thousand who had his name and his Father's name written on their foreheads.
translation:
  language: sw
  text: Kisha nikaona, na tazama, Mwanakondoo alikuwa amesimama juu ya Mlima Sayuni. Pamoja naye walikuwa watu elfu mia moja arobaini na nne, waliokuwa na jina lake na jina la Baba yake yameandikwa kwenye vipaji vya nyuso zao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Baadhi ya hati zina maneno haya tu: “jina la Baba yake limeandikwa kwenye vipaji vya nyuso zao.”'
    reason: textual_variant
lexical_decisions:
- source_word: Καὶ εἶδον
  choice: Kisha nikaona
  rationale: Kauli hii inaendeleza mfululizo wa maono kwa Kiswahili cha kawaida huku ikihifadhi maana ya moja kwa moja ya εἶδον, ‘niliona.’
- source_word: ἰδοὺ
  choice: na tazama
  rationale: Inahifadhi mwito wa kuelekeza uangalifu na uzito wa mtindo wa kinabii wa Ufunuo.
- source_word: τὸ ἀρνίον
  choice: Mwanakondoo
  rationale: Hili ndilo neno la kawaida na lenye heshima kwa cheo hiki cha Kristo katika Ufunuo, bila kuongeza ufafanuzi usiomo katika mstari.
- source_word: ἑστὸς
  choice: alikuwa amesimama
  rationale: Muundo huu unaonyesha hali iliyokuwapo kutokana na tendo la kusimama, kulingana na thamani ya kitenzi kamilifu cha Kigiriki.
- source_word: ἐπὶ τὸ ὄρος Σιών
  choice: juu ya Mlima Sayuni
  rationale: Ni usemi wa asili wa Kiswahili kwa mahali hapo na unahifadhi jina Sayuni kwa unukuzi wa kawaida.
- source_word: μετ’ αὐτοῦ
  choice: Pamoja naye walikuwa
  rationale: Kitenzi kilichodokezwa katika Kigiriki kimewekwa wazi ili sentensi iwe ya kawaida na inayoeleweka kwa Kiswahili.
- source_word: ἑκατὸν τεσσεράκοντα τέσσαρες χιλιάδες
  choice: watu laki moja na elfu arobaini na nne
  rationale: Inahifadhi idadi kamili ya 144,000 na kuitoa kwa maneno ya kawaida ya Kiswahili; ‘watu’ huweka wazi kundi la watu linalodokezwa na sarufi ya Kigiriki.
- source_word: ἔχουσαι
  choice: waliokuwa na
  rationale: Kirai tegemezi kinaonyesha wazi kwamba maelezo haya yanawahusu wale watu laki moja na elfu arobaini na nne.
- source_word: τὸ ὄνομα αὐτοῦ καὶ τὸ ὄνομα τοῦ πατρὸς αὐτοῦ
  choice: jina lake na jina la Baba yake
  rationale: Inahifadhi majina mawili yaliyounganishwa katika Kigiriki na kutofautisha Mwanakondoo na Baba yake bila kuyafanya kuwa jina moja.
- source_word: γεγραμμένον
  choice: yameandikwa
  rationale: Inaonyesha kwamba majina hayo tayari yameandikwa na hali hiyo inaendelea; upatanisho wa wingi unafuata majina mawili katika tafsiri.
- source_word: ἐπὶ τῶν μετώπων αὐτῶν
  choice: kwenye vipaji vya nyuso zao
  rationale: Ni tafsiri ya wazi ya mahali pa maandishi hayo na inahifadhi taswira muhimu ya mstari.
theological_decisions:
- issue: Utambulisho wa τὸ ἀρνίον
  choice: Mwanakondoo
  alternative: Mwanakondoo wa dhabihu
  rationale: Muktadha wa Ufunuo humtambulisha kama Kristo, lakini kuongeza ‘wa dhabihu’ kungeingiza ufafanuzi ambao haujatamkwa katika mstari huu.
- issue: Uhusiano wa majina mawili
  choice: jina lake na jina la Baba yake
  alternative: jina lake, yaani jina la Baba yake
  rationale: Kigiriki kinaunganisha majina mawili kama vitu tofauti; tafsiri haiyafanyi kuwa majina yanayofanana wala haiondoi uhusiano wao wa karibu.
- issue: Tofauti ya maandishi kuhusu maandishi kwenye vipaji vya nyuso
  choice: Matini kuu ina ‘jina lake na jina la Baba yake.’
  alternative: ‘jina la Baba yake’ pekee
  rationale: SBLGNT inajumuisha majina yote mawili. Tofauti muhimu ya baadhi ya hati imehifadhiwa katika tanbihi badala ya kubadili matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. ‘Na tazama’ limehifadhiwa kwa makusudi kama usemi wa juu kidogo unaofaa mtindo wa maono ya Ufunuo. Alama ya tanbihi imewekwa baada ya sehemu ya maandishi inayohusika na tofauti ya hati.
