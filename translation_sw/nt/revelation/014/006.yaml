id: REV.14.6
reference: Revelation 14:6
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ εἶδον ⸀ἄλλον ἄγγελον πετόμενον ἐν μεσουρανήματι, ἔχοντα εὐαγγέλιον αἰώνιον εὐαγγελίσαι ⸀ἐπὶ τοὺς καθημένους ἐπὶ τῆς γῆς καὶ ἐπὶ πᾶν ἔθνος καὶ φυλὴν καὶ γλῶσσαν καὶ λαόν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/006.yaml
  text: And I saw another angel flying in midheaven[a], having an eternal gospel to proclaim to those who dwell on the earth, and to every nation and tribe and language and people[b],
translation:
  language: sw
  text: Nikaona malaika mwingine akiruka katikati ya anga[a], akiwa na injili ya milele ya kuwahubiria wale wanaokaa duniani[b], na kwa kila taifa na kabila na lugha na watu,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “katikati ya mbingu” au “juu angani”; neno la Kigiriki ni usemi wa pekee unaotumiwa katika lugha ya maono ya kiapokaliptiki.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “wale wanaoketi juu ya dunia”; katika Ufunuo usemi huu hutumiwa kwa maana ya wakaaji wa dunia.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ εἶδον
  choice: Kisha nikamwona
  rationale: Kauli hii inaendeleza mfululizo wa maono. “Kisha” ni ya kawaida katika simulizi la Kiswahili, na “nikamwona” huhifadhi nafsi ya kwanza na tukio la kuona.
- source_word: ἄλλον ἄγγελον
  choice: malaika mwingine
  rationale: Katika muktadha wa maono ya Ufunuo, ἄγγελος ni kiumbe wa mbinguni, na ἄλλον huonyesha malaika mwingine katika mfululizo.
- source_word: πετόμενον
  choice: akiruka
  rationale: Kauli endelevu huonyesha malaika akiwa katika mwendo; “akiruka” ni Kiswahili cha kawaida na cha moja kwa moja.
- source_word: ἐν μεσουρανήματι
  choice: katikati ya anga
  rationale: Neno hili la kiapokaliptiki huelekeza kwenye sehemu ya kati au ya juu ya anga. Tafsiri hii huhifadhi taswira bila kutumia istilahi isiyo ya kawaida kwa wasomaji wengi.
- source_word: ἔχοντα
  choice: akiwa na
  rationale: Huhifadhi maana ya kuwa na au kumiliki ujumbe bila kuongeza taswira ya kuushika kwa mikono.
- source_word: εὐαγγέλιον αἰώνιον
  choice: injili ya milele
  rationale: “Injili” huhifadhi mwangwi wa neno la Kikristo εὐαγγέλιον, huku “ya milele” ikieleza sifa ya αἰώνιον bila kulazimisha udhahiri ambao haupo katika Kigiriki.
- source_word: εὐαγγελίσαι
  choice: ya kuwatangazia
  rationale: Kitenzi-jina kinaonyesha kusudi la kuwa na injili. “Kuwatangazia” huepuka marudio yasiyo ya kawaida huku maana ya habari njema ikibebwa na “injili.”
- source_word: ἐπὶ τοὺς καθημένους ἐπὶ τῆς γῆς
  choice: wale wanaokaa duniani
  rationale: Ingawa καθημένους kimsingi ni “walioketi,” katika Ufunuo usemi huu huwarejelea wakaaji wa dunia. “Wanaokaa duniani” huhifadhi maana hiyo na pia mwangwi wa usemi unaojirudia.
- source_word: πᾶν ἔθνος καὶ φυλὴν καὶ γλῶσσαν καὶ λαόν
  choice: kila taifa na kabila na lugha na watu
  rationale: Tafsiri hii huhifadhi wigo wa ulimwengu wote na urudiaji wa viunganishi katika orodha ya Kigiriki.
theological_decisions:
- issue: Kutafsiri εὐαγγέλιον αἰώνιον kwa istilahi ya jadi ya Kikristo au kwa usemi wa jumla
  choice: injili ya milele
  alternative: habari njema ya milele
  rationale: “Injili” huhifadhi uhusiano wa kikanoni na kiteolojia wa neno la Kigiriki bila kuongeza maudhui ya kimadhehebu; ukosefu wa kibainishi katika Kigiriki haugeuzwi kuwa dai lenye udhahiri zaidi.
- issue: Maana ya wale walioelezwa kwa τοὺς καθημένους ἐπὶ τῆς γῆς
  choice: wale wanaokaa duniani
  alternative: wale walioketi juu ya dunia
  rationale: Katika Ufunuo huu ni usemi wa kiapokaliptiki kuhusu wakaaji wa dunia, si hasa mkao wao wa mwili. Tafsiri iliyochaguliwa huhifadhi kundi hilo la kimuktadha bila kuondoa kabisa uwezekano wa maana halisi, ambao umeelezwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Muundo wa orodha na urudiaji wa “na” umehifadhiwa ili kuakisi mdundo na uratibu wa Kigiriki; koma ya mwisho imeachwa kwa kuwa mstari unaendelea katika aya inayofuata.
