revisions:
- from: Kisha nikamwona malaika mwingine akiruka katikati ya anga[a], akiwa na injili ya milele ya kuwatangazia wale wanaokaa duniani[b], na kila taifa na kabila na lugha na watu,
  to: Nikaona malaika mwingine akiruka katikati ya anga[a], akiwa na injili ya milele ya kuwahubiria wale wanaokaa duniani[b], na kwa kila taifa na kabila na lugha na watu,
  rationale: The revision removes the added temporal force of “Kisha,” makes the second coordinated recipient phrase explicit with “kwa,” and uses the natural gospel-specific verb “kuwahubiria.” The revised footnote preserves the literal participial sense accurately while explaining its idiomatic force in Revelation. No doctrinal interpretation has been added.
