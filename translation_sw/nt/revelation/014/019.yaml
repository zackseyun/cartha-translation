id: REV.14.19
reference: Revelation 14:19
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἔβαλεν ὁ ἄγγελος τὸ δρέπανον αὐτοῦ εἰς τὴν γῆν, καὶ ἐτρύγησεν τὴν ἄμπελον τῆς γῆς, καὶ ἔβαλεν εἰς τὴν ληνὸν τοῦ θυμοῦ τοῦ θεοῦ τὸν μέγαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/019.yaml
  text: And the angel swung his sickle over the earth, and harvested the vine of the earth, and threw it into the great winepress of the wrath of God.
translation:
  language: sw
  text: Malaika akautupa mundu wake juu ya nchi, akauvuna mzabibu wa nchi, na kuutupa katika shinikizo kubwa la ghadhabu ya Mungu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔβαλεν ... τὸ δρέπανον ... εἰς τὴν γῆν
  choice: akakivurumisha mundu wake juu ya dunia
  rationale: Katika muktadha huu βάλλω inaeleza tendo la kupeleka au kuvurumisha mundu ili uvune, si kuutupa na kuuacha; “juu ya dunia” linaonyesha eneo linalofikiwa na mundu bila kudokeza kuwa umechimbiwa ardhini.
- source_word: ἐτρύγησεν
  choice: akavuna
  rationale: Kitenzi hiki hutumiwa hasa kwa kuvuna zabibu; Kiswahili “akavuna” ni cha kawaida na kinaendana na taswira ya mzabibu.
- source_word: τὴν ἄμπελον τῆς γῆς
  choice: mzabibu wa dunia
  rationale: “Mzabibu” huhifadhi taswira ya umoja katika Kigiriki na uhusiano wake na dunia.
- source_word: τὴν ληνὸν ... τὸν μέγαν
  choice: shinikizo kubwa la divai
  rationale: ληνός ni mahali au chombo cha kukamulia zabibu; “shinikizo la divai” ni usemi unaoeleweka unaohifadhi picha ya utengenezaji wa divai.
- source_word: τοῦ θυμοῦ τοῦ θεοῦ
  choice: la ghadhabu ya Mungu
  rationale: “Ghadhabu” huwasilisha hasira kali ya hukumu katika muktadha huu kwa lugha yenye hadhi.
theological_decisions:
- issue: Uhusiano kati ya shinikizo la divai na ghadhabu ya Mungu
  choice: shinikizo kubwa la divai la ghadhabu ya Mungu
  alternative: shinikizo kubwa la divai, yaani ghadhabu ya Mungu
  rationale: Muundo wa umilikaji wa Kigiriki umehifadhiwa bila kuamua wazi kama ni sitiari ya utambulisho kamili au picha ya chombo cha kutekeleza ghadhabu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kisimulizi na hadhi ya maandiko. Mfululizo wa “aka-” unaakisi matendo yanayofuatana katika mstari. Hakuna alama za tanbihi kwa kuwa hakuna tanbihi inayohitajika.
