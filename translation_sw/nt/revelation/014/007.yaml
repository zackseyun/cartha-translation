id: REV.14.7
reference: Revelation 14:7
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: λέγων ἐν φωνῇ μεγάλῃ· Φοβήθητε τὸν ⸀θεὸν καὶ δότε αὐτῷ δόξαν, ὅτι ἦλθεν ἡ ὥρα τῆς κρίσεως αὐτοῦ, καὶ προσκυνήσατε ⸂τῷ ποιήσαντι⸃ τὸν οὐρανὸν καὶ τὴν γῆν ⸀καὶ θάλασσαν καὶ πηγὰς ὑδάτων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/007.yaml
  text: saying with a loud voice[a], “Fear God and give him glory, because the hour of his judgment has come[b], and worship the one who made heaven and earth and sea and springs of waters.”
translation:
  language: sw
  text: akisema kwa sauti kubwa, “Mcheni Mungu[a] na mpeni utukufu, kwa sababu saa ya hukumu yake imefika. Mwabuduni yeye aliyezifanya mbingu, dunia, bahari na chemchemi za maji[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mheshimuni Mungu kwa kicho.” Kitenzi cha Kigiriki kinaweza kumaanisha kicho cha heshima na pia hofu mbele ya hukumu.
    reason: lexical_alternative
  - marker: b
    text: Kigiriki kina usemi wa wingi unaomaanisha kihalisi “chemchemi za maji.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων ἐν φωνῇ μεγάλῃ
  choice: akisema kwa sauti kubwa
  rationale: ‘Akisema’ inadumisha uhusiano wa kitenzi-shirikishi na kifungu kilichotangulia, huku ‘kwa sauti kubwa’ ikionyesha kwa kawaida nguvu ya sauti.
- source_word: Φοβήθητε
  choice: Mcheni
  rationale: '‘Mcheni’ huhifadhi maana mbili zinazoweza kuambatana hapa: hofu mbele ya hukumu na kicho cha ibada kwa Mungu.'
- source_word: τὸν θεὸν
  choice: Mungu
  rationale: Ni yambwa ya moja kwa moja ya amri na ndiyo tafsiri ya kawaida ya θεός katika muktadha huu.
- source_word: δότε αὐτῷ δόξαν
  choice: mpeni utukufu
  rationale: Usemi huu wa kawaida wa kibiblia huhifadhi wazo la δόξα kuliko kulipanua kuwa heshima kwa ujumla.
- source_word: ὅτι ἦλθεν ἡ ὥρα
  choice: kwa sababu saa ... imefika
  rationale: ‘Kwa sababu’ inaonyesha sababu ya amri, na ‘saa’ huhifadhi uzito na uharaka wa kiapokaliptiki wa ὥρα.
- source_word: τῆς κρίσεως αὐτοῦ
  choice: ya hukumu yake
  rationale: Huhifadhi kwa ufupi uwezekano wa hukumu kuwa yake, yaani inayomhusu kama Hakimu na inayotoka kwake.
- source_word: προσκυνήσατε
  choice: Mwabuduni
  rationale: Katika Ufunuo kitenzi hiki hutumiwa kwa ibada ya kidini; ‘mwabuduni’ hakipunguzi nguvu hiyo kuwa kuinama au kutoa heshima tu.
- source_word: τῷ ποιήσαντι
  choice: yeye aliyezifanya
  rationale: Huwakilisha kirai cha kitenzi-shirikishi kama mtu anayelengwa na ibada na kuhifadhi tendo la kufanya vitu vilivyotajwa.
- source_word: τὸν οὐρανὸν καὶ τὴν γῆν καὶ θάλασσαν
  choice: mbingu, dunia, bahari
  rationale: Maneno haya yanaakisi lugha ya uumbaji kwa Kiswahili cha sasa; orodha yenye koma ni ya asili bila kupoteza vipengele vya Kigiriki.
- source_word: πηγὰς ὑδάτων
  choice: chemchemi za maji
  rationale: Ni usemi wa kawaida wa Kiswahili unaowakilisha chemchemi na pia umbo la Kigiriki ‘za maji.’
theological_decisions:
- issue: Maana ya amri Φοβήθητε τὸν θεόν
  choice: Mcheni Mungu
  alternative: Mheshimuni Mungu kwa kicho
  rationale: ‘Mcheni’ hudumisha mvutano kati ya kicho cha ibada na hofu mbele ya hukumu inayokuja, badala ya kuamua kuwa ni heshima pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Amri za wingi ‘Mcheni,’ ‘mpeni,’ na ‘Mwabuduni’ ni wazi na za kawaida. Alama ya tanbihi [b] imewekwa baada ya ‘chemchemi za maji,’ mahali panapolingana na maelezo yake.
