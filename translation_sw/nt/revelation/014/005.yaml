translation:
  language: sw
  text: Na katika vinywa vyao haukupatikana uongo; hawana lawama.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wasio na dosari” au “wasio na lawama”; neno la Kigiriki linaweza kuhusisha taswira ya usafi wa dhabihu pamoja na kutokuwa na lawama kimaadili.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ στόματι αὐτῶν
  choice: katika vinywa vyao
  rationale: Huhifadhi taswira ya Kigiriki inayohusu yale yaliyomo kinywani, yaani usemi wao, huku wingi wa Kiswahili ukiwa wa kawaida kwa kundi la watu.
- source_word: οὐχ εὑρέθη
  choice: hapakupatikana
  rationale: Muundo huu wa kutendwa huhifadhi mkazo wa Kigiriki kwamba uongo haukuonekana ndani ya usemi wao, bila kugeuza sentensi kuwa maelezo tendaji.
- source_word: ψεῦδος
  choice: uongo
  rationale: Ni tafsiri ya moja kwa moja, ya kawaida, na pana vya kutosha kwa kauli isiyo ya kweli.
- source_word: ἄμωμοί
  choice: hawana lawama
  rationale: Hutoa maana ya uadilifu wa kimaadili kwa Kiswahili cha kawaida bila kudai wazi kutokuwa na dhambi kabisa; uwezekano wa taswira ya kutokuwa na dosari umehifadhiwa katika tanbihi.
- source_word: καὶ
  choice: Na
  rationale: Kiunganishi kimehifadhiwa kuonyesha kwamba kauli hii inaendeleza maelezo yaliyotangulia.
theological_decisions:
- issue: Kutafsiri ἄμωμοί huku tukihifadhi lugha ya utakatifu bila kuzidisha maana na kudai kutokuwa na dhambi kabisa
  choice: hawana lawama
  alternative: hawana dosari; hawana hatia
  rationale: Neno hilo linaweza kueleza uadilifu wa kimaadili na pia kuibua taswira ya dhabihu isiyo na dosari. “Hawana lawama” ni wazi na asilia, huku tanbihi ikihifadhi maana nyingine halali.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Katika vinywa vyao” huhifadhi taswira ya chanzo bila kuwa nzito kupita kiasi; “hapakupatikana” na “hawana lawama” ni miundo inayoeleweka kwa wasomaji wa kawaida.
