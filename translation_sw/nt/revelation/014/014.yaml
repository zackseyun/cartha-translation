  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ εἶδον, καὶ ἰδοὺ νεφέλη λευκή, καὶ ἐπὶ τὴν νεφέλην καθήμενον ὅμοιον ⸀υἱὸν ἀνθρώπου, ἔχων ἐπὶ τῆς κεφαλῆς αὐτοῦ στέφανον χρυσοῦν καὶ ἐν τῇ χειρὶ αὐτοῦ δρέπανον ὀξύ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/014.yaml
  text: And I looked[a], and behold, a white cloud, and seated on the cloud was one like a son of man[b], having on his head a golden crown and in his hand a sharp sickle.
translation:
  language: sw
  text: Nikaona, na tazama, wingu jeupe; na juu ya wingu hilo ameketi mmoja aliye kama mwana wa binadamu[a], akiwa na taji la dhahabu[b] kichwani mwake na mundu mkali mkononi mwake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “mmoja aliye kama Mwana wa Adamu.” Kirai hiki kina mwangwi wa Danieli 7:13 na mara nyingi hueleweka kuwa cheo cha Kimasihi, ingawa Kiyunani hapa hakina kibainishi: “kama mwana wa binadamu.”'
    reason: alternative_reading
  - marker: b
    text: Neno la Kiyunani lililotafsiriwa “taji” ni stephanos, ambalo mara nyingi humaanisha taji la ushindi badala ya taji la kifalme.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: na tazama
  rationale: Inadumisha msisitizo wa ghafla unaomwelekeza msomaji kwenye jambo jipya katika maono, kwa lugha ya heshima inayofaa Ufunuo.
- source_word: νεφέλη λευκή
  choice: wingu jeupe
  rationale: Ni tafsiri ya moja kwa moja ya kirai cha Kiyunani na inadumisha taswira pamoja na maana yake ya kiishara bila kuipanua kuwa ‘wingu linalong'aa.’
- source_word: ἐπὶ τὴν νεφέλην καθήμενον
  choice: juu ya wingu hilo alikuwa ameketi
  rationale: Ni Kiswahili cha kawaida na chenye heshima kinachoonyesha wazi mahali na hali ya aliyekuwa katika maono.
- source_word: ὅμοιον υἱὸν ἀνθρώπου
  choice: mmoja aliye kama mwana wa binadamu
  rationale: Inahifadhi muundo wa ‘mmoja aliye kama’ na usemi usio na kibainishi maalumu katika Kiyunani, huku ikiacha mwangwi wa Danieli 7:13 usikike bila kuufanya wazi zaidi kuliko matini yenyewe.
- source_word: στέφανον χρυσοῦν
  choice: taji la dhahabu
  rationale: ‘Taji’ ni neno la kawaida na linaloeleweka; tofauti kati ya stephanos, ambalo mara nyingi ni taji la ushindi, na taji la kifalme inaelezwa katika tanbihi.
- source_word: δρέπανον ὀξύ
  choice: mundu mkali
  rationale: ‘Mundu’ ni neno la kawaida la Kiswahili kwa chombo cha kuvunia na linafaa taswira ya mavuno katika muktadha unaofuata.
theological_decisions:
- issue: Iwapo υἱὸν ἀνθρώπου itafsiriwe waziwazi kama cheo cha Kikristo
  choice: mmoja aliye kama mwana wa binadamu
  alternative: mmoja aliye kama Mwana wa Adamu
  rationale: Kiyunani hakina kibainishi kabla ya kirai hiki, kwa hiyo matini kuu haikifanyi moja kwa moja kuwa cheo maalumu. Hata hivyo, mwangwi wa Danieli 7:13 na uelewaji wake wa Kimasihi umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mgawanyo wa sentensi umefanywa kwa usomaji wa kawaida bila kupoteza mfuatano wa maono. Viashiria vya tanbihi vimewekwa moja kwa moja baada ya maneno vinayoyafafanua.
