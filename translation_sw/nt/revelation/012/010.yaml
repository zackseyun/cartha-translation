id: REV.12.10
reference: Revelation 12:10
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ ἤκουσα φωνὴν μεγάλην ἐν τῷ οὐρανῷ λέγουσαν· Ἄρτι ἐγένετο ἡ σωτηρία καὶ ἡ δύναμις καὶ ἡ βασιλεία τοῦ θεοῦ ἡμῶν καὶ ἡ ἐξουσία τοῦ χριστοῦ αὐτοῦ, ὅτι ἐβλήθη ὁ ⸀κατήγωρ τῶν ἀδελφῶν ἡμῶν, ὁ κατηγορῶν ⸀αὐτοὺς ἐνώπιον τοῦ θεοῦ ἡμῶν ἡμέρας καὶ νυκτός.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/010.yaml
  text: And I heard a loud voice in heaven saying[a], “Now have come the salvation and the power and the kingdom of our God, and the authority of his Messiah, because the accuser of our brothers has been thrown down[b], the one who accuses them before our God day and night.”
translation:
  language: sw
  text: Nami nikasikia sauti kubwa mbinguni ikisema, “Sasa kumekuja wokovu na nguvu na ufalme wa Mungu wetu, na mamlaka ya Masihi wake[a], kwa sababu mshtaki wa ndugu zetu[b] ametupwa chini—yule anayewashtaki mbele za Mungu wetu mchana na usiku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kristo.” Neno la Kigiriki Χριστός (Christos) hapa ni cheo kinachomaanisha Mtiwa-Mafuta wa Mungu.
    reason: alternative_reading
  - marker: b
    text: “Ndugu” hapa inaweza kuwataja waamini kwa ujumla, wakiwemo wanawake na wanaume.
    reason: cultural_note
lexical_decisions:
- source_word: φωνὴν μεγάλην
  choice: sauti kubwa
  rationale: Katika Kiswahili, “sauti kubwa” hueleza kwa kawaida sauti yenye nguvu au inayosikika sana, kulingana na maana ya msemo wa Kigiriki.
- source_word: Ἄρτι
  choice: Sasa
  rationale: Huonyesha wakati wa sasa wenye uamuzi katika tangazo hili la mbinguni.
- source_word: ἐγένετο
  choice: vimekuja
  rationale: Kitenzi kina maana ya kutokea au kufika kwa hali iliyotangazwa. Upatanisho wa “vi-” unafaa kwa orodha ya nomino za ngeli tofauti zilizounganishwa kuwa kiima kimoja.
- source_word: ἡ σωτηρία
  choice: wokovu
  rationale: Ni neno la kawaida, wazi, na lenye hadhi kwa tendo la Mungu la kuokoa.
- source_word: ἡ δύναμις
  choice: nguvu
  rationale: Huhifadhi wazo la uwezo wenye matokeo na kulitofautisha na mamlaka halali inayotajwa baadaye.
- source_word: ἡ βασιλεία τοῦ θεοῦ ἡμῶν
  choice: ufalme wa Mungu wetu
  rationale: “Ufalme” huhifadhi taswira ya kifalme na ya kiapokaliptiki, huku ikiweza kumaanisha pia utawala wa Mungu.
- source_word: ἡ ἐξουσία
  choice: mamlaka
  rationale: Hueleza haki au uwezo halali wa kutawala, tofauti na “nguvu” (δύναμις).
- source_word: τοῦ χριστοῦ αὐτοῦ
  choice: ya Masihi wake
  rationale: Χριστός hapa ni cheo cha Mtiwa-Mafuta wa Mungu; “Masihi” huwasilisha maana hiyo ya cheo kwa Kiswahili.
- source_word: κατήγωρ
  choice: mshtaki
  rationale: Neno hili linaonyesha mtu anayeleta mashtaka, jambo linalolingana na mazingira ya kimahakama ya mstari huu.
- source_word: ἐβλήθη
  choice: ametupwa chini
  rationale: Huwasilisha kutupwa kwa nguvu na mwelekeo wa chini unaoeleweka katika muktadha wa kufukuzwa kutoka mbinguni.
- source_word: ἡμέρας καὶ νυκτός
  choice: mchana na usiku
  rationale: Ni usemi wa kawaida wa Kiswahili unaohifadhi wazo la mashtaka yasiyokoma.
theological_decisions:
- issue: Tafsiri ya Χριστός
  choice: Masihi
  alternative: Kristo
  rationale: Katika kirai “Masihi wake,” neno hilo linafanya kazi wazi kama cheo cha Mtiwa-Mafuta wa Mungu, si kama jina tu. Tanbihi inahifadhi tafsiri nyingine iliyozoeleka.
- issue: Upeo wa ἀδελφῶν
  choice: ndugu zetu
  alternative: ndugu zetu wa kiume na wa kike
  rationale: “Ndugu zetu” ni ya asili na yenye hadhi katika Kiswahili, na inaweza kutaja waamini kwa pamoja bila kuingiza ufafanuzi mrefu katika matini kuu.
- issue: Maana ya βασιλεία
  choice: ufalme
  alternative: utawala
  rationale: “Ufalme” huhifadhi taswira ya kifalme ya Ufunuo bila kuondoa uwezekano kwamba neno linakazia utawala wa Mungu unaotekelezwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa sasa, wenye hadhi, na unaofaa tangazo la kiapokaliptiki. Mpangilio wa marudio umehifadhiwa kwa kiasi kinachosomeka kwa urahisi, na alama za tanbihi zimewekwa moja kwa moja baada ya maneno yanayofafanuliwa.
