  yaml_path: translation/nt/revelation/012/002.yaml
  text: And she was pregnant[a], and she cries out[c][b], suffering birth pains and being tormented to give birth.
translation:
  language: sw
  text: Naye alikuwa mjamzito[a], anapaza sauti kwa uchungu wa kuzaa[b], akiteseka ili ajifungue[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “akiwa na mimba tumboni”; au, “alikuwa na mimba.”
    reason: lexical_alternative
  - marker: b
    text: Au, “akiwa na utungu wa kuzaa.”
    reason: lexical_alternative
  - marker: c
    text: Au, “akiteseka katika kujifungua.”
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: ἐν γαστρὶ ἔχουσα
  choice: alikuwa mjamzito
  rationale: Nahau hii, kihalisi ‘akiwa na tumboni,’ ni usemi wa kawaida wa kueleza ujauzito. ‘Alikuwa mjamzito’ ni Kiswahili cha sasa, wazi na cha asili.
- source_word: κράζει
  choice: akapaza sauti
  rationale: Kitenzi cha wakati uliopo katika maono kinaonyesha tukio kwa uhai. ‘Akapaza sauti’ hudumisha nguvu ya kilio na kuunganisha kwa kawaida mfululizo wa maono katika Kiswahili.
- source_word: ὠδίνουσα
  choice: kwa uchungu wa kuzaa
  rationale: Kirai hiki kinaonyesha maumivu ya utungu waziwazi, badala ya kutumia ‘akiwa katika leba,’ ambalo ni neno la mkopo na si la hadhi sawa katika muktadha huu.
- source_word: βασανιζομένη
  choice: akiteswa sana
  rationale: Huhifadhi ukali wa hali inayoelezwa na kitenzi cha Kiyunani bila kuufanya kuwa maumivu ya kawaida tu.
- source_word: τεκεῖν
  choice: akitaka kujifungua
  rationale: Infinitivu inaeleza jambo ambalo mateso hayo yanaelekea kwalo. ‘Akitaka kujifungua’ ni ya asili katika Kiswahili, huku dokezo la chini likihifadhi uwezekano wa uhusiano wa moja kwa moja zaidi wa kusudi.
- source_word: καὶ ... καὶ
  choice: naye ... aka- ... aki-
  rationale: Miunganisho ya Kiswahili na mfuatano wa vitenzi huhifadhi mkusanyiko na uhai wa maelezo bila kuunda sentensi nzito isiyo ya asili.
theological_decisions:
- issue: Ukali na asili ya mateso ya mwanamke katika maono
  choice: Kutafsiri βασανιζομένη kwa nguvu kuwa ‘akiteswa sana,’ bila kumtambulisha mwanamke huyo kiishara.
  alternative: ‘akiwa katika dhiki’ au ‘akiwa na maumivu makali’
  rationale: Aya inaeleza mateso yake kwa nguvu, lakini yenyewe haitoi utambulisho wake wa kiishara wala maana ya kitheolojia ya uchungu huo. Tafsiri haipaswi kuingiza mfumo maalumu wa ufafanuzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Mjamzito,’ ‘uchungu wa kuzaa,’ na ‘kujifungua’ vinaeleweka kwa urahisi; ‘akiteswa sana’ huhifadhi ukali wa maandishi ya Kiyunani. Alama zote za tanbihi zimewekwa katika matini kuu.
