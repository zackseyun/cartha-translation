id: REV.12.18
reference: Revelation 12:18
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ⸀ἐστάθη ἐπὶ τὴν ἄμμον τῆς θαλάσσης.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/018.yaml
  text: And he stood on the sand of the sea[a].
translation:
  language: sw
  text: Naye akasimama juu ya mchanga wa bahari.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati zinasema, “Nami nikasimama juu ya mchanga wa bahari.”
    reason: textual_variant
lexical_decisions:
- source_word: καὶ
  choice: Naye
  rationale: Kiunganishi kinaendeleza simulizi na wakati huohuo kinadokeza kuwa mtendaji ni yule aliyetajwa katika mstari uliotangulia; ni Kiswahili cha kawaida na chenye mtiririko mzuri.
- source_word: ἐστάθη
  choice: akasimama
  rationale: Umbo la aoristi lenye maana isiyo ya kutendwa hapa linaeleza tendo la kusimama. Nafsi ya tatu inafuatwa kulingana na matini ya SBLGNT, huku tofauti ya nafsi ya kwanza ikihifadhiwa katika tanbihi.
- source_word: ἐπὶ
  choice: juu ya
  rationale: Pamoja na hali ya akusativi, kirai hiki kinaonyesha mahali aliposimama; “juu ya” kinaakisi picha halisi ya kusimama kwenye mchanga.
- source_word: τὴν ἄμμον
  choice: mchanga
  rationale: Neno la Kigiriki linamaanisha mchanga moja kwa moja; halijapanuliwa kuwa “ufuo,” ili kuhifadhi taswira maalumu ya matini.
- source_word: τῆς θαλάσσης
  choice: wa bahari
  rationale: Muundo wa umilikaji unahifadhi uhusiano wa Kigiriki kati ya mchanga na bahari kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Utambulisho wa mtendaji na tofauti ya matini katika kitenzi
  choice: 'Matini kuu inafuata nafsi ya tatu: “Naye akasimama,” ambayo katika muktadha inaelekea kumrejelea joka wa mstari uliotangulia.'
  alternative: 'Baadhi ya hati zina nafsi ya kwanza: “Nami nikasimama.”'
  rationale: SBLGNT iliyotolewa ina ἐστάθη, nafsi ya tatu. Tofauti mashuhuri ya ἐστάθην haipaswi kufichwa wala kuingizwa katika matini kuu, bali ihifadhiwe katika tanbihi ili kuonyesha ushahidi wa kimatini bila kuondoa mvutano wa tafsiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Naye akasimama” hudumisha mwendelezo wa simulizi; “mchanga wa bahari” huhifadhi taswira ya Kigiriki bila kuibadili kuwa “ufuo.”
