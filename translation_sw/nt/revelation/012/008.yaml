  text: καὶ οὐκ ⸀ἴσχυσεν, οὐδὲ τόπος εὑρέθη ⸀αὐτῶν ἔτι ἐν τῷ οὐρανῷ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/008.yaml
  text: But he was not strong enough[a], nor was any place found for them any longer in heaven.
translation:
  language: sw
  text: Lakini yeye hakushinda[a], wala mahali hapakupatikana tena mbinguni kwao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hakuwa na nguvu za kutosha.” Kitenzi cha Kigiriki kinaweza kumaanisha kuwa na nguvu, kuweza, au kushinda.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Lakini
  rationale: Katika muktadha wa pambano la mstari uliotangulia, kiunganishi hiki kina nguvu ya kuonyesha kinyume au matokeo yasiyotarajiwa; “Lakini” ni ya asili katika Kiswahili.
- source_word: οὐκ ἴσχυσεν
  choice: yeye hakushinda
  rationale: ἰσχύω inaweza kumaanisha kuwa na nguvu, kuweza, au kushinda. Katika muktadha wa vita, “hakushinda” ni ya asili na huhifadhi maana ya kutofaulu katika pambano; tanbihi inahifadhi uwezekano wa maana ya kutokuwa na nguvu za kutosha.
- source_word: οὐδὲ
  choice: wala
  rationale: “Wala” huunganisha kwa kawaida kishazi hiki hasi na kile kilichotangulia.
- source_word: τόπος
  choice: mahali
  rationale: τόπος hapa humaanisha mahali au nafasi katika ulimwengu wa mbinguni; “mahali” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: εὑρέθη
  choice: hapakupatikana
  rationale: Huhifadhi hali ya kutendwa ya kitenzi cha Kigiriki, yaani “hakupatikana,” kwa muundo wa Kiswahili unaolingana na nomino ya mahali.
- source_word: αὐτῶν
  choice: kwa ajili yao
  rationale: Katika muundo huu, kiwakilishi hicho humaanisha mahali palipokuwa pa wao—joka na malaika zake—na “kwa ajili yao” ni usemi wazi wa Kiswahili.
- source_word: ἔτι
  choice: tena
  rationale: Pamoja na ukanushi, “tena” huonyesha kwamba hawakuwa na mahali huko baada ya pambano.
- source_word: ἐν τῷ οὐρανῷ
  choice: mbinguni
  rationale: οὐρανός hapa ni ulimwengu wa mbinguni, si anga linaloonekana; “mbinguni” ni usemi wa kawaida wa Kiswahili.
theological_decisions:
- issue: Kirejeleo cha kitenzi cha umoja ἴσχυσεν
  choice: “yeye” humrejelea joka wa mstari uliotangulia, huku “yao” ikirejelea joka pamoja na malaika zake.
  alternative: 'Kutafsiri kwa wingi: “wao hawakuwa na nguvu za kutosha.”'
  rationale: Kigiriki kina kitenzi cha umoja kinachoendeleza mtendaji wa umoja, joka, kisha kinatumia kiwakilishi cha wingi kwa kundi lote. Tafsiri ya umoja huhifadhi sarufi na mtiririko huo.
- issue: Upana wa maana ya ἰσχύω
  choice: “hakushinda” katika maandishi, huku maana ya nguvu/uwezo ikihifadhiwa katika tanbihi.
  alternative: “hakuwa na nguvu za kutosha” au “hakuweza.”
  rationale: Muktadha wa pambano unaunga mkono “hakushinda,” lakini kitenzi chenyewe kinaweza kuhusisha nguvu au uwezo; tanbihi huepuka kuficha utata huo wa kileksika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wazi kwa msomaji wa kawaida, huku hali ya kutendwa katika εὑρέθη na tofauti kati ya umoja “yeye” na wingi “yao” zikihifadhiwa.
