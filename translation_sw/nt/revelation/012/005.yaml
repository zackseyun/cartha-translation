  terminology: “Kuchunga,” “mataifa,” “fimbo ya chuma,” “Mungu,” na “kiti cha enzi” ni istilahi sahihi na za kawaida. Tanbihi hudumisha tofauti kati ya sitiari ya Kigiriki ya kuchunga na maana yake ya kifalme katika mwangwi wa Zaburi 2, bila kulazimisha tafsiri ya kidhehebu.
