id: REV.12.5
reference: Revelation 12:5
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἔτεκεν υἱόν, ⸀ἄρσεν, ὃς μέλλει ποιμαίνειν πάντα τὰ ἔθνη ἐν ῥάβδῳ σιδηρᾷ· καὶ ἡρπάσθη τὸ τέκνον αὐτῆς πρὸς τὸν θεὸν καὶ πρὸς τὸν θρόνον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/005.yaml
  text: And she gave birth to a son, a male child, who is about to shepherd all the nations with an iron rod; and her child was snatched up to God and to his throne.
translation:
  language: sw
  text: Naye akazaa mwana, mtoto wa kiume, ambaye yuko karibu kuyachunga[a] mataifa yote kwa fimbo ya chuma; naye mtoto wake akanyakuliwa kwenda kwa Mungu na kwenye kiti chake cha enzi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “atayatawala mataifa yote kwa fimbo ya chuma.” Kitenzi cha Kigiriki humaanisha kihalisi “kuchunga,” lakini hapa kina mwangwi wa Zaburi 2 na hubeba maana ya mamlaka ya kifalme.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔτεκεν
  choice: akazaa
  rationale: Kitenzi hiki cha kawaida na cha asili katika Kiswahili kinahifadhi picha halisi ya kujifungua.
- source_word: υἱόν, ἄρσεν
  choice: mwana, mtoto wa kiume
  rationale: Maneno yote mawili ya Kigiriki yametafsiriwa ili kuhifadhi msisitizo wa makusudi bila kufanya Kiswahili kuwa kigumu.
- source_word: μέλλει ποιμαίνειν
  choice: ambaye atayachunga
  rationale: Wakati ujao wa Kiswahili unaeleza tendo linalotarajiwa au lililokusudiwa kwa njia ya asili; maana ya kuwa karibu kutenda si lazima katika muktadha huu wa kinabii.
- source_word: ποιμαίνειν
  choice: kuyachunga
  rationale: Huhifadhi sitiari ya mchungaji katika Kigiriki, huku maana yake ya mamlaka ya kifalme ikielezwa katika tanbihi.
- source_word: πάντα τὰ ἔθνη
  choice: mataifa yote
  rationale: Hurejelea mataifa ya ulimwengu kwa upana na kuhifadhi mwangwi wa Zaburi 2.
- source_word: ἐν ῥάβδῳ σιδηρᾷ
  choice: kwa fimbo ya chuma
  rationale: Huhifadhi maana ya kifaa kinachotumiwa na taswira ya Zaburi 2 kwa Kiswahili cha kawaida.
- source_word: ἡρπάσθη
  choice: akanyakuliwa
  rationale: Hueleza kuondolewa kwa ghafula na kwa nguvu, kama inavyodokezwa na hali ya kutendwa ya ἁρπάζω.
- source_word: τὸ τέκνον αὐτῆς
  choice: mtoto wake
  rationale: Huhifadhi badiliko la Kigiriki kutoka υἱός kwenda neno la jumla zaidi τέκνον.
- source_word: πρὸς τὸν θεὸν καὶ πρὸς τὸν θρόνον αὐτοῦ
  choice: kwenda kwa Mungu na kwenye kiti chake cha enzi
  rationale: Hueleza mwendo kuelekea kwa Mungu na kuelekea kiti chake cha enzi kwa Kiswahili cha asili.
theological_decisions:
- issue: Mwangwi wa Kimasihi wa Zaburi 2 katika ποιμαίνειν ... ἐν ῥάβδῳ σιδηρᾷ
  choice: Kuhifadhi sitiari ya kuchunga katika matini kuu na kufafanua maana ya kutawala katika tanbihi.
  alternative: atayatawala mataifa yote kwa fimbo ya chuma
  rationale: Kigiriki kinatumia ποιμαίνω, ‘kuchunga,’ ingawa katika mwangwi huu wa Zaburi 2 neno hilo hubeba mamlaka ya kifalme. Tafsiri haipaswi kufuta sitiari hiyo.
- issue: Nguvu ya μέλλει
  choice: atayachunga
  alternative: yuko karibu kuyachunga; amekusudiwa kuyachunga
  rationale: μέλλω pamoja na kitenzi-jina inaweza kuonyesha wakati ujao uliokusudiwa au ulio karibu. Katika muktadha huu wa kiapokaliptiki, wakati ujao wa Kiswahili huhifadhi maana bila kuamua kwamba tendo hilo ni la mara moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kishairi-kiapokaliptiki umehifadhiwa bila kuwa mzito; ‘kiti cha enzi’ limetumiwa badala ya neno la mkopo.
