id: REV.12.14
reference: Revelation 12:14
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἐδόθησαν τῇ γυναικὶ ⸀αἱ δύο πτέρυγες τοῦ ἀετοῦ τοῦ μεγάλου, ἵνα πέτηται εἰς τὴν ἔρημον εἰς τὸν τόπον αὐτῆς, ⸂ὅπου τρέφεται⸃ ἐκεῖ καιρὸν καὶ καιροὺς καὶ ἥμισυ καιροῦ ἀπὸ προσώπου τοῦ ὄφεως.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/014.yaml
  text: And the woman was given the two wings of the great eagle, so that she might fly into the wilderness to her place, where she is nourished there for a time and times and half a time, away from the presence of the serpent.
translation:
  language: sw
  text: Mwanamke huyo akapewa mabawa mawili ya tai yule mkubwa, ili aruke kwenda nyikani hadi mahali pake, ambapo huko analishwa kwa wakati, nyakati, na nusu wakati, mbali na uwepo wa nyoka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αἱ δύο πτέρυγες τοῦ ἀετοῦ τοῦ μεγάλου
  choice: mabawa mawili ya tai mkubwa
  rationale: Huhifadhi maelezo ya Kigiriki kwa lugha ya kawaida na yenye hadhi; kauli bainifu ya Kigiriki inaeleweka bila kulazimisha matumizi yasiyo ya kawaida ya kiambishi cha uainishaji katika Kiswahili.
- source_word: ἔρημον
  choice: nyikani
  rationale: Hutoa maana ya eneo la ukiwa lisilokaliwa bila kulifanya lazima kuwa jangwa la mchanga.
- source_word: τρέφεται
  choice: analishwa
  rationale: Kauli tendwa ya wakati wa sasa inadumishwa; mtendaji habainishwi, kama ilivyo katika chanzo.
- source_word: καιρὸν καὶ καιροὺς καὶ ἥμισυ καιροῦ
  choice: kwa wakati mmoja, nyakati mbili, na nusu wakati
  rationale: Huhifadhi usemi wa kifumbo na mpangilio wake bila kuufasiri moja kwa moja kuwa miaka mitatu na nusu.
- source_word: ἀπὸ προσώπου τοῦ ὄφεως
  choice: mbali na uso wa yule nyoka
  rationale: Huhifadhi taswira halisi ya 'uso/uwepo' katika Kigiriki, huku 'mbali na' ikionyesha kujisitiri au kutengwa naye.
theological_decisions:
- issue: Utambulisho wa mwanamke, tai, na kipindi cha wakati
  choice: Taswira na kipindi vinaachwa katika lugha ya kifumbo ya kifungu
  alternative: Kuvitambulisha wazi na Israeli, kanisa, ulinzi wa Mungu, au miaka mitatu na nusu
  rationale: Mstari wenyewe hautoi utambulisho huo moja kwa moja; tafsiri haipaswi kuingiza msimamo wa kimadhehebu.
- issue: Mtendaji wa kumlisha mwanamke
  choice: Kauli tendwa 'analishwa' bila kumtaja mtendaji
  alternative: Mungu anamlisha
  rationale: Chanzo kina kauli tendwa na hakimtaji mtendaji, hivyo uwezekano wa kitheolojia unabaki bila kufafanuliwa kupita maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Marudio ya 'huko' yamedumishwa kwa sababu ἐκεῖ limo wazi katika maandishi ya Kigiriki, ingawa Kiswahili kingeweza kuliacha bila kupoteza maana ya msingi.
