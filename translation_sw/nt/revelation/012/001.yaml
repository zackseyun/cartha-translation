source:
  edition: SBLGNT
  text: Καὶ σημεῖον μέγα ὤφθη ἐν τῷ οὐρανῷ, γυνὴ περιβεβλημένη τὸν ἥλιον, καὶ ἡ σελήνη ὑποκάτω τῶν ποδῶν αὐτῆς, καὶ ἐπὶ τῆς κεφαλῆς αὐτῆς στέφανος ἀστέρων δώδεκα,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/001.yaml
  text: 'And a great sign appeared in heaven: a woman clothed with the sun[a], and the moon under her feet, and on her head a crown of twelve stars,'
translation:
  language: sw
  text: 'Na ishara kubwa ikaonekana mbinguni: mwanamke aliyevikwa jua, mwezi chini ya miguu yake, na juu ya kichwa chake taji[a] la nyota kumi na mbili.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “shada” au “taji la ushindi”; neno la Kigiriki ni στέφανος, ambalo ni tofauti na taji ya kifalme.
    reason: lexical_alternative
lexical_decisions:
- source_word: σημεῖον μέγα
  choice: ishara kubwa
  rationale: “Ishara” huhifadhi maana ya alama ya kinabii inayoonekana katika maono, bila kuifanya tu kuwa muujiza; “kubwa” huonyesha ukubwa na umuhimu wake.
- source_word: ὤφθη ἐν τῷ οὐρανῷ
  choice: ikaonekana mbinguni
  rationale: Kitenzi cha kutendwa kimewasilishwa kwa Kiswahili cha kawaida kama “ikaonekana,” nacho kinahifadhi tukio la kufunuliwa kwa maono; “mbinguni” inafaa muktadha wa maono ya Ufunuo kuliko “angani.”
- source_word: γυνὴ περιβεβλημένη τὸν ἥλιον
  choice: mwanamke aliyevikwa jua
  rationale: “Mwanamke” haitangulizi utambulisho wa mfano huu, na “aliyevikwa jua” huhifadhi taswira ya kuvikwa au kuzungukwa na jua.
- source_word: ἡ σελήνη ὑποκάτω τῶν ποδῶν αὐτῆς
  choice: mwezi ulikuwa chini ya miguu yake
  rationale: Muundo huu ni wa asili katika Kiswahili na huhifadhi wazi uhusiano wa mahali katika taswira.
- source_word: στέφανος
  choice: taji
  rationale: “Taji” ndilo neno linaloeleweka zaidi katika matini kuu; tanbihi inaeleza kuwa neno la Kigiriki linaweza kumaanisha shada la ushindi na ni tofauti na taji la kifalme.
- source_word: ἀστέρων δώδεκα
  choice: la nyota kumi na mbili
  rationale: Huhifadhi muundo na taswira ya taji lenye au linaloundwa na nyota kumi na mbili bila kuongeza ufafanuzi wa kiishara.
theological_decisions:
- issue: Utambulisho wa kiishara wa mwanamke
  choice: Kutomtambulisha katika tafsiri; anaelezwa tu kama mwanamke anayeonekana katika ishara.
  alternative: Israeli, Maria, watu wa Mungu, au kanisa.
  rationale: Aya yenyewe haitaji wazi mwanamke huyo ni nani. Tafsiri ya maelezo huhifadhi utata na mvutano wa kitheolojia bila kuingiza msimamo wa dhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Kisha” limetumika kuendeleza simulizi la maono; sentensi imehifadhi mpangilio wa taswira za Kigiriki huku ikisomeka kwa urahisi. Alama ya tanbihi imewekwa moja kwa moja baada ya “taji.”
