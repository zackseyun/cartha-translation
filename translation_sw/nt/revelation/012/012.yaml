  text: διὰ τοῦτο εὐφραίνεσθε, ⸀οἱ οὐρανοὶ καὶ οἱ ἐν αὐτοῖς σκηνοῦντες. οὐαὶ ⸂τὴν γῆν καὶ τὴν θάλασσαν⸃, ὅτι κατέβη ὁ διάβολος πρὸς ὑμᾶς, ἔχων θυμὸν μέγαν, εἰδὼς ὅτι ὀλίγον καιρὸν ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/012.yaml
  text: Therefore rejoice[a], O heavens, and you who dwell in them. Woe to the earth and the sea, because the devil has come down to you with great fury[c][b], knowing that he has only a little time.
translation:
  language: sw
  text: Kwa hiyo furahini, enyi mbingu, ninyi mnaokaa ndani yake. Ole kwa dunia[a] na bahari, kwa maana Ibilisi ameshuka kwenu akiwa na ghadhabu kuu[b], akijua kwamba ana wakati mchache tu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nchi.” Neno la Kigiriki γῆ linaweza kumaanisha “dunia” au “nchi”; hapa “dunia” imechaguliwa kwa sababu muktadha unahusu ulimwengu mzima.
    reason: lexical_alternative
  - marker: b
    text: Au, “akiwa na hasira kali.”
    reason: lexical_alternative
  - marker: c
    text: Kihalisi, “ana wakati mchache.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Kwa hiyo
  rationale: Inaonyesha hitimisho linalotokana na ushindi wa mbinguni uliotangulia, kwa Kiswahili cha kawaida na chenye uzito.
- source_word: εὐφραίνεσθε
  choice: furahini
  rationale: Inahifadhi nguvu ya amri kwa wingi na mwito wa kuwa na furaha.
- source_word: οἱ οὐρανοὶ
  choice: enyi mbingu
  rationale: Nominativi imetumiwa kama mwito wa moja kwa moja; “enyi” huonyesha wazi mtindo huo wa kishairi na wa kinabii.
- source_word: οἱ ἐν αὐτοῖς σκηνοῦντες
  choice: nanyi mnaokaa humo
  rationale: σκηνόω hapa humaanisha kukaa au kuishi; “humo” ni ya asili zaidi kuliko tafsiri isiyoeleweka ya kujenga au kukaa katika hema.
- source_word: οὐαὶ
  choice: Ole wa
  rationale: Ni kauli ya kawaida ya kinabii inayotangaza msiba au hukumu inayokuja.
- source_word: τὴν γῆν καὶ τὴν θάλασσαν
  choice: dunia na bahari
  rationale: γῆ inaweza kuwa “dunia” au “nchi”; muktadha mpana wa kiulimwengu na kuunganishwa kwake na bahari unaunga mkono “dunia.”
- source_word: κατέβη
  choice: ameshuka
  rationale: Wakati timilifu wa Kiswahili unaonyesha tendo lililotimia hivi karibuni na ambalo matokeo yake yanaendelea katika muktadha.
- source_word: ὁ διάβολος
  choice: Ibilisi
  rationale: Hili ndilo jina la kawaida la Kiswahili kwa cheo hiki cha Shetani katika muktadha huu.
- source_word: πρὸς ὑμᾶς
  choice: kwenu
  rationale: Inaonyesha mwendo na kufika katika eneo la wale wanaoonywa, bila kuongeza maana ya “dhidi yenu” ambayo kirai chenyewe hakilazimishi.
- source_word: ἔχων θυμὸν μέγαν
  choice: akiwa na ghadhabu kuu
  rationale: Inabaki karibu na muundo wa Kigiriki na kuwasilisha ukali wa θυμός kwa lugha yenye hadhi.
- source_word: εἰδὼς
  choice: akijua
  rationale: Inahifadhi muundo wa kishiriki unaoeleza hali inayoambatana na kushuka kwake.
- source_word: ὀλίγον καιρὸν ἔχει
  choice: ana wakati mchache tu
  rationale: Inafuata maana na mpangilio wa Kigiriki kwa karibu, huku “tu” ikikazia ufupi wa muda uliobaki.
theological_decisions:
- issue: Mrejelewa wa “kwenu” katika “Ibilisi ameshuka kwenu”
  choice: Kisintaksia, “kwenu” inahusishwa kwa karibu na dunia na bahari zilizotangazwa kuwa na ole.
  alternative: Inaweza kuchukuliwa kuwa mwito unaendelea kuwaelekea mbingu na wakaaji wake kwa mtindo wa balagha.
  rationale: Mfuatano wa karibu unaonyesha kwa kawaida kwamba onyo linahusu ulimwengu wa chini unaowakilishwa na dunia na bahari. Tafsiri haiongezi “wakaaji wa dunia,” hivyo inadumisha kiwango fulani cha mvutano uliomo katika maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mtindo wa kinabii umehifadhiwa kwa “enyi” na “ole,” huku sentensi ikibaki wazi kwa msomaji wa kawaida.
