base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/003.yaml
  text: And another sign appeared in heaven[a], and behold, a great red dragon, having seven heads and ten horns, and on his heads seven diadems[b],
translation:
  language: sw
  text: 'Na ishara nyingine ikaonekana mbinguni: tazama, joka kubwa jekundu kama moto[a], lenye vichwa saba na pembe kumi, na juu ya vichwa vyake kulikuwa na taji saba za kifalme[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “joka kubwa jekundu.” Neno la Kigiriki πυρρός humaanisha rangi nyekundu inayofanana na mwali wa moto.
    reason: lexical_alternative
  - marker: b
    text: Au, “taji.” Hasa zaidi, neno la Kigiriki διάδημα humaanisha utepe wa kichwani au taji ya kifalme, tofauti na taji ya mshindi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὤφθη
  choice: ikaonekana
  rationale: Katika simulizi la maono, kitenzi hiki cha kutendwa hutumika kwa maana ya kitu kujitokeza ili kionekane; “ikaonekana” ni sahihi na ya kawaida katika Kiswahili.
- source_word: ἄλλο σημεῖον
  choice: ishara nyingine
  rationale: “Ishara” huhifadhi maana ya kitu cha maono chenye umuhimu wa kiishara bila kukitafsiri zaidi.
- source_word: ἐν τῷ οὐρανῷ
  choice: mbinguni
  rationale: Katika mazingira ya maono ya Ufunuo, “mbinguni” huhifadhi mandhari ya ulimwengu wa juu; neno la Kigiriki pia linaweza kumaanisha angani.
- source_word: ἰδοὺ
  choice: tazama
  rationale: “Tazama” ni kiashiria cha kuvuta usikivu, chenye hadhi na nguvu inayofaa simulizi la maono.
- source_word: δράκων
  choice: joka
  rationale: “Joka” ni neno la kawaida la Kiswahili kwa kiumbe huyu mkubwa wa mfano wa nyoka.
- source_word: μέγας πυρρός
  choice: kubwa jekundu kama moto
  rationale: “Kubwa” huhifadhi ukubwa wa δράκων, na “jekundu kama moto” huonyesha rangi nyekundu yenye kufanana na moto inayodokezwa na πυρρός.
- source_word: ἔχων κεφαλὰς ἑπτὰ καὶ κέρατα δέκα
  choice: lenye vichwa saba na pembe kumi
  rationale: Muundo wa “lenye” ni wa asili katika Kiswahili na huhifadhi maelezo ya kiumbe bila kufasiri ishara zake.
- source_word: ἐπὶ τὰς κεφαλὰς αὐτοῦ ἑπτὰ διαδήματα
  choice: juu ya vichwa vyake kulikuwa na taji saba za kifalme
  rationale: Huhifadhi mahali pa taji juu ya vichwa na kutofautisha διάδημα, alama ya mamlaka ya kifalme, na taji kwa maana pana.
theological_decisions:
- issue: Maana ya rangi πυρρός
  choice: jekundu kama moto
  alternative: jekundu
  rationale: Neno hilo linamaanisha rangi nyekundu inayofanana na moto. Tafsiri iliyochaguliwa huhifadhi taswira hiyo bila kuipa maana ya kiishara isiyotajwa.
- issue: Aina ya taji katika διάδηματα
  choice: taji za kifalme
  alternative: taji
  rationale: διάδημα ni utepe au taji ya mamlaka ya kifalme, tofauti na στέφανος, ambayo mara nyingi ni taji ya ushindi. Tafsiri haielezi uhalali wa mamlaka hayo, bali aina ya alama inayoonekana.
- issue: Kirejeshi αὐτοῦ kwa δράκων
  choice: vichwa vyake
  alternative: vichwa vya joka hilo
  rationale: Kiswahili hakilazimishi jinsia katika kirejeshi hiki; “vyake” ni ya asili na haisisitizi wala kufuta hali ya kiumbe huyo kama mhusika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa maono ulio wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. “Tazama” huhifadhi msisitizo wa ghafla wa ἰδοὺ; “joka” na “pembe” zimeachwa bila kufasiriwa kiishara.
