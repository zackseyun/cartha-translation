id: REV.12.17
reference: Revelation 12:17
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ὠργίσθη ὁ δράκων ἐπὶ τῇ γυναικί, καὶ ἀπῆλθεν ποιῆσαι πόλεμον μετὰ τῶν λοιπῶν τοῦ σπέρματος αὐτῆς, τῶν τηρούντων τὰς ἐντολὰς τοῦ θεοῦ καὶ ἐχόντων τὴν μαρτυρίαν Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/017.yaml
  text: And the dragon became enraged with the woman[a], and went away to make war with the rest of her offspring, those who keep the commandments of God and hold to the testimony of Jesus.
translation:
  language: sw
  text: Joka hilo likamkasirikia sana mwanamke huyo, likaondoka kwenda kupigana vita dhidi ya wazao wake waliobaki, yaani wale wanaozishika amri za Mungu na kushikilia ushuhuda wa Yesu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ushuhuda kumhusu Yesu”; pia inaweza kuwa “ushuhuda alioutoa Yesu.” Muundo wa Kigiriki unaweza kueleweka kwa zaidi ya njia moja.
    reason: alternative_reading
lexical_decisions:
- source_word: ὠργίσθη
  choice: likamkasirikia sana
  rationale: Kitenzi hiki huonyesha kuingiwa na hasira. Neno “sana” linafikisha ukali wa mwitikio wa chuki katika muktadha huu wa kinabii bila kwenda nje ya maana yake.
- source_word: ὁ δράκων
  choice: Joka hilo
  rationale: “Joka” ndiyo tafsiri ya kawaida ya δράκων na inadumisha taswira ya kiishara ya Ufunuo. “Hilo” humrejelea joka aliyekwisha kutajwa.
- source_word: ἐπὶ τῇ γυναικί
  choice: mwanamke huyo
  rationale: Muundo “kumkasirikia mwanamke huyo” unatoa kwa Kiswahili maana ya hasira iliyoelekezwa kwa mwanamke maalumu aliyetajwa tayari.
- source_word: ἀπῆλθεν
  choice: likaondoka kwenda
  rationale: “Likaondoka” hudumisha mwendo wa simulizi na dhana ya kwenda zake, huku “kwenda” ikiunganisha kwa kawaida kusudi linalofuata.
- source_word: ποιῆσαι πόλεμον
  choice: kupigana vita
  rationale: Hii ni nahau ya kawaida ya Kiswahili kwa kuanzisha au kuendesha vita na inahifadhi taswira wazi ya vita.
- source_word: μετὰ τῶν λοιπῶν
  choice: dhidi ya ... waliobaki
  rationale: Ingawa μετά pamoja na jenitivi kimsingi ni “pamoja na/na,” katika muungano wake na kufanya vita ina maana ya upinzani; “dhidi ya” huifanya maana hiyo iwe ya kawaida na wazi kwa Kiswahili.
- source_word: τοῦ σπέρματος αὐτῆς
  choice: wazao wake
  rationale: σπέρμα hapa humaanisha uzao. “Wazao” ni ya kawaida, inadumisha uhusiano wa kifamilia, na haileti maana finyu isiyokusudiwa ya mbegu halisi.
- source_word: τηρούντων
  choice: wanaozishika
  rationale: τηρέω hapa ni kutii na kuendelea kuzifuata amri kwa uaminifu. “Kuzishika amri” ni usemi wa kawaida wa kibiblia na wa Kiswahili sanifu.
- source_word: τὰς ἐντολὰς
  choice: amri
  rationale: “Amri” hufikisha uzito wa maagizo ya Mungu kwa lugha ya sasa na yenye hadhi.
- source_word: ἐχόντων
  choice: kushikilia
  rationale: Ingawa ἔχω kimsingi ni “kuwa na,” hapa “kushikilia” huonyesha uaminifu wa kudumu kwa ushuhuda bila kuufanya ufafanuzi kuwa finyu mno.
- source_word: τὴν μαρτυρίαν Ἰησοῦ
  choice: ushuhuda wa Yesu
  rationale: 'Muundo wa Kiswahili “wa Yesu” unadumisha utata halisi wa jenitivi ya Kigiriki: unaweza kuwa ushuhuda kumhusu Yesu au ushuhuda unaotolewa na Yesu.'
theological_decisions:
- issue: Maana ya jenitivi katika τὴν μαρτυρίαν Ἰησοῦ
  choice: ushuhuda wa Yesu
  alternative: ushuhuda kumhusu Yesu; au ushuhuda alioutoa Yesu
  rationale: Jenitivi ya Kigiriki inaweza kueleweka kama Yesu ndiye anayeshuhudiwa au ndiye anayetoa ushuhuda. Matini kuu inadumisha uwezekano huo wa maana mbili, na tanbihi inaueleza badala ya kuamua upande mmoja.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Upatanisho wa kisarufi wa “joka” umetumia ngeli ya LI-YA (“hilo,” “lika-”), huku sentensi ikibaki wazi kwa msomaji wa kawaida. “Yaani” inaonyesha kwamba kishazi cha mwisho kinawatambulisha wazao waliobaki.
