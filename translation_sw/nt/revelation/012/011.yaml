  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ αὐτοὶ ἐνίκησαν αὐτὸν διὰ τὸ αἷμα τοῦ ἀρνίου καὶ διὰ τὸν λόγον τῆς μαρτυρίας αὐτῶν, καὶ οὐκ ἠγάπησαν τὴν ψυχὴν αὐτῶν ἄχρι θανάτου·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/011.yaml
  text: And they conquered him by the blood of the Lamb and by the word of their testimony[b][a], and they did not love their life even unto death.
translation:
  language: sw
  text: Nao wakamshinda[a] kwa damu ya Mwana-Kondoo na kwa neno la ushuhuda wao; nao hawakuyapenda maisha yao[b] hata kufa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakapata ushindi juu yake.”
    reason: lexical_alternative
  - marker: b
    text: Au, “nafsi zao.” Neno la Kigiriki psychē linaweza kumaanisha “maisha,” “nafsi,” au “mtu mwenyewe.” Hapa linahusu maisha yao wanapokabili kifo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνίκησαν
  choice: wakamshinda
  rationale: Kitenzi hiki humaanisha kushinda au kupata ushindi juu ya mtu. “Wakamshinda” ni cha kawaida, chenye nguvu, na kinahifadhi taswira ya mapambano katika Ufunuo.
- source_word: διὰ τὸ αἷμα
  choice: kwa damu
  rationale: “Kwa” linaweza kuonyesha njia au msingi wa ushindi, hivyo linahifadhi kwa ufupi upeo wa διά pamoja na hali ya damu ya Mwana-Kondoo kuwa ndiyo inayowezesha ushindi.
- source_word: τοῦ ἀρνίου
  choice: ya Mwana-Kondoo
  rationale: Katika Ufunuo, ἀρνίον ni cheo kinachomhusu Kristo. “Mwana-Kondoo” kinahifadhi taswira ya dhabihu na matumizi yanayotambulika katika Kiswahili cha Biblia.
- source_word: τὸν λόγον τῆς μαρτυρίας αὐτῶν
  choice: neno la ushuhuda wao
  rationale: Tafsiri hii inahifadhi λόγος na μαρτυρία bila kupunguza kishazi kuwa “ushuhuda wao” tu. “Neno” hapa linaweza kueleweka kuwa ujumbe walioutoa kwa ushuhuda.
- source_word: οὐκ ἠγάπησαν
  choice: hawakuyapenda
  rationale: Inadumisha maana ya kawaida ya ἀγαπάω, “kupenda,” badala ya kuifafanua kuwa kushikilia au kuthamini na hivyo kuondoa mvutano wa usemi wa asili.
- source_word: τὴν ψυχὴν αὐτῶν
  choice: maisha yao
  rationale: Katika muktadha wa kifo cha mashahidi, ψυχή inahusu maisha yao ya duniani. “Maisha yao” ni ya kawaida katika Kiswahili na haingizi bila sababu wazo la utofauti kati ya mwili na roho.
- source_word: ἄχρι θανάτου
  choice: hata kufa
  rationale: Usemi huu unaonyesha kuwa uaminifu wao ulifikia hatua ya kifo. “Hata kufa” ni mfupi, wenye uzito, na unaeleweka kwa urahisi.
theological_decisions:
- issue: Ushindi “kwa damu ya Mwana-Kondoo”
  choice: Imetafsiriwa “kwa damu” ili kuonyesha damu ya Mwana-Kondoo kuwa njia au msingi wa ushindi bila kuongeza maelezo ya kimafundisho yasiyosemwa moja kwa moja.
  alternative: “kwa sababu ya damu ya Mwana-Kondoo”
  rationale: διά pamoja na hali ya kushutumiwa (accusative) inaweza kuwa na maana ya kisababishi, lakini katika muktadha huu “kwa” ni pana vya kutosha kudumisha uwezekano wa njia na msingi bila kuamua zaidi ya maandishi.
- issue: Maana ya ψυχή katika muktadha wa ushahidi unaofikia kifo
  choice: Imetafsiriwa “maisha yao.”
  alternative: “nafsi zao”
  rationale: Muktadha unahusu kutokuwa na tamaa ya kuhifadhi uhai wakati wa kukabili kifo. “Maisha” hutoa maana hiyo wazi bila kudokeza kwamba kifungu kinafundisha mgawanyo maalumu wa mwili na nafsi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa moja kwa moja na wa kishairi kiasi, unaofaa mtindo wa Ufunuo. “Mwana-Kondoo” limehifadhiwa kama cheo, na “neno la ushuhuda wao” limeachwa katika muundo wa karibu na Kigiriki ili kutunza maana zake mbili za ujumbe na ushahidi.
