id: REV.12.9
reference: Revelation 12:9
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἐβλήθη ὁ δράκων ὁ μέγας, ὁ ὄφις ὁ ἀρχαῖος, ὁ καλούμενος Διάβολος καὶ ⸀ὁ Σατανᾶς, ὁ πλανῶν τὴν οἰκουμένην ὅλην— ἐβλήθη εἰς τὴν γῆν, καὶ οἱ ἄγγελοι αὐτοῦ μετ’ αὐτοῦ ἐβλήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/009.yaml
  text: And the great dragon was thrown down—the ancient serpent[a], the one called the Devil and Satan, who deceives the whole world. He was thrown down to the earth[b], and his angels were thrown down with him.
translation:
  language: sw
  text: Joka kubwa likatupwa chini—yule nyoka wa kale[b], aitwaye Ibilisi na Shetani, anayeupotosha ulimwengu wote[a]. Likatupwa duniani, na malaika zake wakatupwa pamoja nalo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “anayeupotosha ulimwengu wote unaokaliwa na watu.”
    reason: lexical_alternative
  - marker: b
    text: “Nyoka wa kale” inarejelea taswira ya nyoka katika Mwanzo 3.
    reason: cross_reference
lexical_decisions:
- source_word: ἐβλήθη / ἐβλήθησαν
  choice: likatupwa chini / wakatupwa
  rationale: Kitenzi cha kutenda kwa kulazimisha kimehifadhiwa, pamoja na marudio yake katika mstari. “Chini” huonyesha kufukuzwa kutoka juu katika muktadha huu.
- source_word: δράκων ὁ μέγας
  choice: joka kubwa
  rationale: “Joka” huhifadhi taswira ya kiapokaliptiki ya δράκων, na “kubwa” ni tafsiri ya moja kwa moja na ya kawaida ya μέγας.
- source_word: ὁ ὄφις ὁ ἀρχαῖος
  choice: yule nyoka wa zamani
  rationale: “Nyoka” ni Kiswahili cha kawaida na chenye hadhi kwa ὄφις; “wa zamani” huhifadhi maana ya kale bila kuifanya kwa lazima kuwa “wa mwanzo kabisa.”
- source_word: ὁ καλούμενος
  choice: aitwaye
  rationale: Hutambulisha majina au vyeo vinavyotumiwa kumhusu joka kwa njia fupi na ya kawaida katika Kiswahili.
- source_word: Διάβολος
  choice: Ibilisi
  rationale: Katika muktadha huu neno hilo ni jina au cheo kinachotambulika; “Ibilisi” ndiyo namna ya kawaida ya kibiblia katika Kiswahili.
- source_word: Σατανᾶς
  choice: Shetani
  rationale: Jina hili limetolewa kwa umbo lake la kawaida katika Kiswahili bila kuongeza ufafanuzi wa kimafundisho.
- source_word: ὁ πλανῶν
  choice: anayeupotosha
  rationale: πλανάω inaweza kumaanisha kudanganya au kupotosha; “kupotosha” huhifadhi wazo la kuwaongoza watu waende njia isiyo sahihi.
- source_word: τὴν οἰκουμένην ὅλην
  choice: ulimwengu wote
  rationale: Ni usemi wa kawaida unaowasilisha upeo wa jumla wa οἰκουμένη katika muktadha wa kiapokaliptiki, huku maana halisi zaidi ikitajwa katika tanbihi.
- source_word: εἰς τὴν γῆν
  choice: duniani
  rationale: Katika muktadha wa kufukuzwa kutoka mbinguni, γῆ humaanisha dunia badala ya eneo fulani la nchi.
- source_word: οἱ ἄγγελοι αὐτοῦ
  choice: malaika zake
  rationale: Muktadha wa kiapokaliptiki unaonyesha viumbe wa kiroho wanaoshirikiana na joka, si wajumbe wa kibinadamu.
- source_word: μετ’ αὐτοῦ
  choice: pamoja nalo
  rationale: Huhifadhi maana ya kuandamana naye; kiwakilishi cha ngeli ya “joka” kinaendelea kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Kutaja Διάβολος na Σατανᾶς kwa pamoja
  choice: aitwaye Ibilisi na Shetani
  alternative: aitwaye Msingiziaji na Mpinzani
  rationale: Kigiriki kinayaweka kama majina au vyeo vinavyomtambulisha joka. Maumbo yaliyozoeleka ya Kiswahili huhifadhi utambulisho huo bila kuingiza maelezo ya ziada ya kimafundisho.
- issue: Upeo wa οἰκουμένη
  choice: ulimwengu wote
  alternative: ulimwengu wote wenye watu
  rationale: Tafsiri kuu inahifadhi upeo mpana wa kifungu katika Ufunuo; tanbihi inaonyesha kwa uwazi zaidi dhana ya ulimwengu unaokaliwa bila kuupunguza kimakusudi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kishairi wa majina yanayofuatana na marudio ya “likatupwa/wakatupwa” umehifadhiwa; viwakilishi vya joka vinafuata ngeli yake ya kisarufi.
