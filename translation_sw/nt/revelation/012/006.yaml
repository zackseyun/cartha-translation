  text: καὶ ἡ γυνὴ ἔφυγεν εἰς τὴν ἔρημον, ὅπου ἔχει ἐκεῖ τόπον ἡτοιμασμένον ⸀ἀπὸ τοῦ θεοῦ, ἵνα ἐκεῖ ⸀τρέφωσιν αὐτὴν ἡμέρας χιλίας διακοσίας ἑξήκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/006.yaml
  text: And the woman fled into the wilderness[a], where she has there a place prepared by God, so that there they might nourish her for one thousand two hundred sixty days.
translation:
  language: sw
  text: Na yule mwanamke akakimbilia nyikani, ambako ana mahali palipotayarishwa na Mungu, ili huko wamtunze kwa siku elfu moja mia mbili na sitini.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ili atunzwe huko kwa siku elfu moja mia mbili na sitini.” Kigiriki kina kitenzi cha nafsi ya tatu wingi bila kumtaja mtendaji; kihalisi, “ili huko wamtunze.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἔφυγεν
  choice: akakimbilia
  rationale: Kitenzi hiki huonyesha kukimbia au kutoroka. “Akakimbilia” ni cha kawaida katika Kiswahili na, pamoja na “nyikani,” kinaonyesha mwendo wa haraka kuelekea mahali pa usalama bila kuongeza maelezo yasiyokuwamo.
- source_word: ἔρημον
  choice: nyikani
  rationale: ἔρημος inaweza kumaanisha jangwa au eneo la upweke lisilokaliwa. “Nyikani” huhifadhi upana huo na mwangwi wa kibiblia bila kudokeza lazima eneo lenye mchanga.
- source_word: τόπον
  choice: mahali
  rationale: Neno la kawaida na la moja kwa moja kwa τόπος katika muktadha huu.
- source_word: ἡτοιμασμένον ἀπὸ τοῦ θεοῦ
  choice: palipotayarishwa na Mungu
  rationale: Huhifadhi hali ya mahali kuwa tayari kutokana na tendo lililokamilishwa, na humtaja Mungu kwa usahihi kuwa mtendaji.
- source_word: ἵνα
  choice: ili
  rationale: “Ili” huonyesha kusudi kwa Kiswahili cha kawaida na chenye mtiririko mzuri.
- source_word: τρέφωσιν αὐτὴν
  choice: wamlee
  rationale: τρέφω inaweza kumaanisha kulisha au kutunza kwa kumpa mahitaji ya kuishi. “Wamlee” hapa huwasilisha utunzaji endelevu na huhifadhi kitenzi cha nafsi ya tatu wingi chenye mtendaji asiyetajwa.
- source_word: ἡμέρας χιλίας διακοσίας ἑξήκοντα
  choice: kwa siku elfu moja mia mbili na sitini
  rationale: “Kwa siku” huonyesha muda unaoendelea, na kuandika idadi kwa maneno kunafaa katika matini ya Biblia.
- source_word: ἔχει ἐκεῖ
  choice: ambako ana mahali
  rationale: “Ambako” tayari hubeba maana ya “huko,” hivyo muundo huu ni wa asili katika Kiswahili bila kupoteza mkazo wa mahali uliomo katika Kigiriki.
theological_decisions:
- issue: Mtendaji asiyetajwa wa τρέφωσιν
  choice: 'Kuhifadhi wingi usio na mtendaji aliyetajwa: “wamlee.”'
  alternative: “ili alelewe huko” au “ili Mungu amlee huko”
  rationale: Kigiriki kina kitenzi cha nafsi ya tatu wingi bila kutaja mtendaji. Kutaja Mungu kungefasiri zaidi ya matini; kutumia kauli ya kutendwa kungeficha muundo wa wingi usiotajwa. “Wamlee” huhifadhi utata huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya maandiko. “Nyikani” hudumisha taswira pana ya eneo lisilokaliwa; “wamlee” ni rahisi kueleweka na huhifadhi kutotajwa kwa watendaji. Alama ya tanbihi imewekwa baada ya sentensi kwa kuwa tanbihi inahusu kishazi cha mwisho, si neno “nyikani” pekee.
