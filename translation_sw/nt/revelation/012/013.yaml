  text: Καὶ ὅτε εἶδεν ὁ δράκων ὅτι ἐβλήθη εἰς τὴν γῆν, ἐδίωξεν τὴν γυναῖκα ἥτις ἔτεκεν τὸν ἄρσενα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/013.yaml
  text: And when the dragon saw that he had been thrown down to the earth[b][a], he pursued the woman who had given birth to the male child.
translation:
  language: sw
  text: Joka alipoona kwamba alikuwa ametupwa chini duniani, alimwandama yule mwanamke aliyemzaa mtoto wa kiume.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “yule wa kiume”; neno “mtoto” limedokezwa na muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: δράκων
  choice: joka
  rationale: Katika Kiswahili cha Biblia na lugha ya maono, “joka” hudumisha taswira ya kiumbe huyo wa kutisha bila kuibadili kuwa “nyoka,” ingawa anatambulishwa hivyo mahali pengine.
- source_word: ἐβλήθη
  choice: alikuwa ametupwa chini
  rationale: Kauli hii inadumisha hali ya kutendwa na wazo la kuondolewa kwa nguvu; wakati timilifu unaonyesha kuwa kutupwa kulitangulia kuona kwake.
- source_word: εἰς τὴν γῆν
  choice: duniani
  rationale: Katika muktadha wa tofauti kati ya mbingu na dunia, γῆ inamaanisha dunia; “kutupwa chini duniani” ni usemi wa kawaida na huhifadhi mwelekeo wa kushushwa.
- source_word: ἐδίωξεν
  choice: alimwandama
  rationale: “Kumwandama” linaweza kuonyesha kumfuata kwa nia mbaya na pia kumsumbua au kumtesa, hivyo linahifadhi upana wa διώκω katika muktadha huu.
- source_word: γυναῖκα
  choice: mwanamke
  rationale: Ni tafsiri ya moja kwa moja inayohifadhi taswira ya kifumbo bila kutaja utambulisho wake.
- source_word: ἥτις
  choice: aliyekuwa
  rationale: Huunganisha kishazi elezi kwa Kiswahili cha kawaida bila kuongeza ufafanuzi wa kiutafsiri.
- source_word: ἔτεκεν
  choice: amemzaa
  rationale: Kitenzi “kuzaa” hutoa maana ya τίκτω kwa ufupi na kwa lugha ya kawaida; muundo wa wakati unaonyesha tendo lililotangulia.
- source_word: τὸν ἄρσενα
  choice: mtoto wa kiume
  rationale: Kigiriki kinasema kihalisi “yule wa kiume.” Kiswahili kinahitaji nomino iliyodokezwa na muktadha, kwa hiyo “mtoto” imeongezwa huku msisitizo wa jinsia ya kiume ukihifadhiwa.
theological_decisions:
- issue: Utambulisho wa kifumbo wa mwanamke na mtoto
  choice: Kuhifadhi maneno “mwanamke” na “mtoto wa kiume” bila maelezo ya utambulisho wao
  alternative: Kumtambulisha mwanamke kuwa Mariamu, Israeli, au watu wa Mungu/kanisa, na kumfafanua mtoto kwa jina
  rationale: Aya yenyewe hutumia taswira ya kifumbo, na tafsiri haipaswi kuamua kati ya mitazamo mbalimbali ya kitheolojia ambayo maandishi hayaelezi wazi hapa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. “Alimwandama” limechaguliwa ili kubeba kwa pamoja maana ya kufuatilia kwa uadui na kutesa. Alama ya tanbihi [a] imewekwa mara tu baada ya “mtoto wa kiume.”
