source:
  edition: SBLGNT
  text: καὶ ἐβοήθησεν ἡ γῆ τῇ γυναικί, καὶ ἤνοιξεν ἡ γῆ τὸ στόμα αὐτῆς καὶ κατέπιεν τὸν ποταμὸν ὃν ἔβαλεν ὁ δράκων ἐκ τοῦ στόματος αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/016.yaml
  text: And the earth helped the woman[b][a], and the earth opened its mouth and swallowed the river that the dragon had thrown from his mouth.
translation:
  language: sw
  text: Nayo dunia ikamsaidia yule mwanamke[a]. Dunia ikafungua kinywa chake na kuumeza mto ambao yule joka alioutupa kutoka kinywani mwake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nchi” au “ardhi.” Neno la Kiyunani γῆ linaweza kumaanisha dunia, nchi, au ardhi.
    reason: lexical_alternative
  - marker: b
    text: Au, “mto ambao yule joka aliutoa kinywani mwake” au “aliourusha kutoka kinywani mwake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβοήθησεν
  choice: ikamsaidia
  rationale: Kitenzi hiki humaanisha ‘kusaidia’ au ‘kuja kumsaidia.’ ‘Ikamsaidia’ ni tafsiri ya moja kwa moja, ya kawaida, na inadumisha mtiririko wa simulizi.
- source_word: ἡ γῆ
  choice: dunia
  rationale: Neno γῆ linaweza kumaanisha dunia, nchi, au ardhi. ‘Dunia’ linafaa zaidi katika taswira pana ya kiapokaliptiki na linahifadhi urudiaji wa kiima katika aya.
- source_word: τῇ γυναικί
  choice: yule mwanamke
  rationale: Hii inamrejelea mwanamke ambaye tayari ametambulishwa katika simulizi. ‘Yule mwanamke’ ni ya asili katika Kiswahili na haiifafanui ishara hiyo kupita maandishi.
- source_word: ἤνοιξεν ... τὸ στόμα αὐτῆς
  choice: ikafungua kinywa chake
  rationale: Tafsiri hii inadumisha uhuishaji wa dunia katika taswira ya kiapokaliptiki bila kuugeuza kuwa maelezo ya kimafumbo.
- source_word: κατέπιεν
  choice: kuumeza
  rationale: καταπίνω humaanisha kumeza. ‘Kuumeza’ ni fupi, ya moja kwa moja, na kiambishi chake kinarejelea mto.
- source_word: τὸν ποταμόν
  choice: mto
  rationale: ποταμός kwa kawaida ni ‘mto.’ Tafsiri hii haiongezi wazo la mafuriko ambalo, ingawa linawezekana katika muktadha, halijaelezwa moja kwa moja na nomino yenyewe.
- source_word: ὃν ἔβαλεν
  choice: ambao ... alikuwa ameutupa
  rationale: βάλλω ina maana pana ya kutupa au kurusha. ‘Alikuwa ameutupa’ inadumisha nguvu ya kitendo na wakati uliotangulia tendo la kuumeza.
- source_word: ὁ δράκων
  choice: yule joka
  rationale: ‘Joka’ ni neno la kawaida la Kiswahili kwa δράκων katika taswira ya Ufunuo; ‘yule’ humrejelea kiumbe ambaye tayari ametambulishwa.
- source_word: ἐκ τοῦ στόματος αὐτοῦ
  choice: kutoka kinywani mwake
  rationale: Hii ni tafsiri ya asili ya kirai cha Kiyunani na inaonyesha wazi chanzo cha mto.
theological_decisions:
- issue: Uhuishaji wa dunia katika taswira ya kiapokaliptiki
  choice: Kudumisha dunia ikiwa inatenda kama kiumbe—inafungua kinywa na kumeza—bila kufafanua ishara hiyo.
  alternative: Kuitafsiri dunia kuwa watu, eneo fulani, au njia ya Mungu ya kumwokoa mwanamke.
  rationale: Maandishi yenyewe yanatoa taswira hai lakini hayaelezi maana yake ya kiishara katika aya hii. Tafsiri inapaswa kuhifadhi mvutano na uwazi huo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi ni rahisi kueleweka, huku uhuishaji na taswira ya kiapokaliptiki ya maandishi ya Kiyunani vikidumishwa.
