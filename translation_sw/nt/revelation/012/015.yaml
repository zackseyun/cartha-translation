  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἔβαλεν ὁ ὄφις ἐκ τοῦ στόματος αὐτοῦ ὀπίσω τῆς γυναικὸς ὕδωρ ὡς ποταμόν, ἵνα αὐτὴν ποταμοφόρητον ποιήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/015.yaml
  text: And the serpent hurled water like a river out of his mouth after the woman[b][a], so that he might cause her to be swept away by the river.
translation:
  language: sw
  text: Na yule nyoka akayatupa maji kama mto kutoka kinywani mwake kumfuata yule mwanamke[a], ili amfanye asombwe na mto[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nyuma ya yule mwanamke.” Neno la Kigiriki linaweza kueleza mahali nyuma yake au mwendo wa kumfuata.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “amfanye awe mwenye kubebwa na mto.” Maana yake ni kusombwa au kubebwa na mkondo wa mto.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔβαλεν
  choice: akamwaga
  rationale: Katika muktadha wa maji yanayotoka kinywani, “akamwaga” ni Kiswahili cha kawaida na chenye picha dhahiri; kinahifadhi tendo lenye nguvu bila kutumia “akatupa maji,” ambalo si la kawaida sana.
- source_word: ὁ ὄφις
  choice: yule nyoka
  rationale: “Nyoka” ndiyo tafsiri ya kawaida ya ὄφις na inahifadhi utambulisho wa mhusika aliyetajwa katika muktadha wa karibu.
- source_word: ἐκ τοῦ στόματος αὐτοῦ
  choice: kutoka kinywani mwake
  rationale: Ni tafsiri ya moja kwa moja na ya asili ya kirai cha chanzo.
- source_word: ὀπίσω τῆς γυναικός
  choice: yakimfuata yule mwanamke
  rationale: ὀπίσω pamoja na jenitivi inaweza kueleza mahali nyuma au mwendo wa kumfuata mtu. Muundo huu unaonyesha kuwa maji yanaelekezwa kumfuata mwanamke huku tanbihi ikihifadhi uwezekano wa maana ya mahali.
- source_word: ὕδωρ ὡς ποταμόν
  choice: maji kama mto
  rationale: Inahifadhi tashbihi ya ὡς na picha mahususi ya ποταμός bila kuibadili kuwa “gharika.”
- source_word: ἵνα
  choice: ili
  rationale: “Ili” huonyesha kwa kawaida kusudi la kitendo katika Kiswahili.
- source_word: ποταμοφόρητον ποιήσῃ
  choice: amfanye achukuliwe na mto
  rationale: Muundo wa kisababishi unawakilisha ποιήσῃ, na “achukuliwe na mto” unahifadhi maana adimu ya ποταμοφόρητος, yaani kubebwa au kuchukuliwa na mkondo wa mto, bila kuongeza wazo maalumu la kuzama.
theological_decisions:
- issue: Taswira ya kiapokaliptiki ya shambulio la nyoka
  choice: Kuhifadhi taswira yenyewe ya maji kama mto na mwanamke kuchukuliwa na mto.
  alternative: Kufasiri maji moja kwa moja kuwa majeshi, mateso, uongo, au machafuko.
  rationale: Chanzo hakifafanui ishara ndani ya mstari huu; tafsiri haipaswi kuingiza mfumo mmoja wa ufafanuzi katika matini.
- issue: Nguvu ya ἵνα kama kusudi au matokeo
  choice: “ili,” ikionyesha kusudi la nyoka.
  alternative: “hata,” ambayo ingeweza kusisitiza zaidi matokeo.
  rationale: Muktadha wa shambulio la makusudi unaunga mkono kusudi, ingawa ἵνα wakati mwingine inaweza kugusa matokeo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Yule” hudumisha urejeo kwa wahusika wanaojulikana katika simulizi, na mpangilio wa sentensi huhifadhi taswira na kusudi la Kigiriki.
