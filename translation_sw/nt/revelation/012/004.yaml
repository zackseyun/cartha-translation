id: REV.12.4
reference: Revelation 12:4
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἡ οὐρὰ αὐτοῦ σύρει τὸ τρίτον τῶν ἀστέρων τοῦ οὐρανοῦ, καὶ ἔβαλεν αὐτοὺς εἰς τὴν γῆν. καὶ ὁ δράκων ἕστηκεν ἐνώπιον τῆς γυναικὸς τῆς μελλούσης τεκεῖν, ἵνα ὅταν τέκῃ τὸ τέκνον αὐτῆς καταφάγῃ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/004.yaml
  text: And his tail sweeps away a third of the stars of heaven and threw them to the earth. And the dragon stood before the woman who was about to give birth, so that when she gave birth, he might devour her child.
translation:
  language: sw
  text: Mkia wake unakokota theluthi moja ya nyota za mbinguni, na akazitupa duniani. Joka hilo limesimama mbele ya yule mwanamke aliyekuwa karibu kuzaa, ili atakapojifungua, ammeze mtoto wake.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σύρει
  choice: unakokota
  rationale: Kitenzi cha wakati uliopo kinadumishwa na kinaonyesha mkia ukizivuta nyota kwa nguvu; pia kinahifadhi mabadiliko ya wakati wa kitenzi yanayofuata.
- source_word: τὸ τρίτον
  choice: theluthi moja
  rationale: Hii ndiyo njia ya kawaida na iliyo wazi ya kueleza sehemu moja kati ya tatu kwa Kiswahili.
- source_word: δράκων
  choice: joka
  rationale: Neno la kawaida la kibiblia kwa kiumbe huyu mkubwa wa mfano, bila kulifasiri moja kwa moja kama Shetani ndani ya mstari huu.
- source_word: καταφάγῃ
  choice: ammeze
  rationale: Huwasilisha tendo la kumla kabisa kwa lugha ya kawaida na yenye nguvu katika muktadha wa joka na mtoto.
theological_decisions:
- issue: Maana ya nyota
  choice: nyota
  alternative: malaika
  rationale: Mstari unasema nyota; tafsiri haibadilishi picha hiyo kuwa utambulisho wa kitheolojia usiotajwa moja kwa moja hapa.
- issue: Mabadiliko ya nyakati za vitenzi σύρει na ἔβαλεν
  choice: unakokota ... akazitupa
  alternative: ulikokota ... ukazitupa / unakokota ... unazitupa
  rationale: Mabadiliko ya wakati uliopo kwenda wakati uliopita katika maandishi ya Kigiriki yanahifadhiwa badala ya kusawazishwa kimya kimya.
- issue: Mhusika wa kitenzi καταφάγῃ
  choice: joka ndiye anayekusudia kummeza mtoto
  alternative: kauli isiyomtaja wazi mtendaji
  rationale: Muundo wa Kigiriki unaendeleza joka kama mtendaji wa kusimama na kusudi la kummeza mtoto.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio wa sentensi umefanywa kuwa wa kawaida kwa msomaji wa Kiswahili huku taswira, mfuatano wa matukio, na mabadiliko yasiyo ya kawaida ya nyakati za vitenzi katika chanzo yakihifadhiwa.
