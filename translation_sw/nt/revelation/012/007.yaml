base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/007.yaml
  text: 'And war broke out in heaven: Michael and his angels fought against the dragon[a]. And the dragon and his angels fought back[c][b],'
translation:
  language: sw
  text: 'Vita vikazuka mbinguni[a]: Mikaeli na malaika zake wakapigana na yule joka[b]. Yule joka na malaika zake nao wakapigana[c],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kulikuwa na vita mbinguni,” au “Vita vilitokea mbinguni.”
    reason: lexical_alternative
  - marker: b
    text: Kwa muundo wa Kigiriki kwa karibu zaidi, kifungu husema “Mikaeli na malaika zake—kupigana na yule joka.” Kigiriki kinatumia kitenzi-jina chenye kibainishi katika muundo uliobanwa kueleza tendo linalohusika.
    reason: lexical_alternative
  - marker: c
    text: 'Kwa kufuata mpangilio wa Kigiriki kwa karibu zaidi: “Yule joka akapigana, na malaika zake pia.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο πόλεμος
  choice: Vita vikazuka
  rationale: Muundo wa γίνομαι pamoja na nomino unaonyesha kutokea au kuanza kwa tukio. “Vita vikazuka” ni Kiswahili cha kawaida kinachohifadhi maana ya kuanza kwa vita.
- source_word: ἐν τῷ οὐρανῷ
  choice: mbinguni
  rationale: Katika muktadha huu οὐρανός ni makao ya mbinguni, si anga linaloonekana.
- source_word: Μιχαὴλ
  choice: Mikaeli
  rationale: Jina limetoholewa kwa umbo lililozoeleka katika Kiswahili cha Biblia bila kuongeza cheo au utambulisho wa kiufafanuzi.
- source_word: οἱ ἄγγελοι αὐτοῦ
  choice: malaika zake
  rationale: Kauli milikishi inaonyesha kwa uwazi malaika walio upande wa Mikaeli, na baadaye wale walio upande wa joka.
- source_word: τοῦ πολεμῆσαι μετὰ τοῦ δράκοντος
  choice: wakapigana na yule joka
  rationale: Kitenzi-jina chenye kibainishi katika Kigiriki kinaeleza tendo kwa muundo uliobanwa. Kauli yenye kitenzi kamili ni ya asili katika Kiswahili. “Kupigana na” huonyesha uhasama kwa wazi katika muktadha huu.
- source_word: δράκοντος / δράκων
  choice: yule joka
  rationale: “Joka” huhifadhi taswira ya kiapokaliptiki, na “yule” humrejelea kiumbe aliyetajwa tayari katika muktadha.
- source_word: ἐπολέμησεν
  choice: nao wakapigana
  rationale: “Nao” huonyesha upande wa pili kushiriki katika pambano bila kuongeza kwa lazima wazo la kujilinda linaloweza kudokezwa na “wakajibu mapigo.”
- source_word: καὶ οἱ ἄγγελοι αὐτοῦ
  choice: Yule joka na malaika zake
  rationale: Muundo huu ni wa kawaida katika Kiswahili na unahifadhi ulinganifu wa pande mbili, kila mmoja akiwa pamoja na malaika zake.
theological_decisions:
- issue: Utambulisho na hadhi ya Mikaeli
  choice: Jina “Mikaeli” limetajwa bila ufafanuzi wa ziada.
  alternative: Kumwita malaika mkuu au kumtambulisha kuwa Kristo kulingana na baadhi ya mapokeo ya ufafanuzi.
  rationale: Aya yenyewe inamtaja Mikaeli lakini hapa haisemi cheo chake wala kumtambulisha kuwa Kristo. Tafsiri haipaswi kuingiza hitimisho la kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Vita vikazuka” na “wakapigana” ni rahisi kueleweka, huku “yule joka” ikihifadhi rejeo maalumu na taswira ya kifungu. Alama zote za tanbihi zimewekwa katika matini.
