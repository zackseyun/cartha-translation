  text: ἐκ φυλῆς Ἰούδα δώδεκα χιλιάδες ⸀ἐσφραγισμένοι, ἐκ φυλῆς Ῥουβὴν δώδεκα χιλιάδες, ἐκ φυλῆς Γὰδ δώδεκα χιλιάδες,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/005.yaml
  text: from the tribe of Judah[a], twelve thousand were sealed; from the tribe of Reuben, twelve thousand; from the tribe of Gad, twelve thousand.
translation:
  language: sw
  text: kutoka katika kabila la Yuda, watu elfu kumi na mbili walitiwa muhuri[a]; kutoka katika kabila la Rubeni, watu elfu kumi na mbili; kutoka katika kabila la Gadi, watu elfu kumi na mbili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata muundo wa Kigiriki kwa karibu zaidi, “kutoka katika kabila la Yuda, watu elfu kumi na mbili waliotiwa muhuri.” Kigiriki kinatumia kishirikishi cha kutendwa (“waliotiwa muhuri”) baada ya idadi ya kabila la kwanza.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ
  choice: kutoka katika
  rationale: Huonyesha chanzo au kundi ambalo watu hao walitoka, na hudumisha muundo unaorudiwa katika orodha.
- source_word: φυλῆς
  choice: kabila
  rationale: Katika muktadha wa koo za Israeli, neno hili humaanisha kabila, si ukoo mdogo.
- source_word: Ἰούδα
  choice: Yuda
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili cha Biblia.
- source_word: δώδεκα χιλιάδες
  choice: watu elfu kumi na mbili
  rationale: Idadi imetafsiriwa moja kwa moja; neno 'watu' linawekwa wazi kwa Kiswahili cha kawaida kwa kuwa wanaohesabiwa ni watu.
- source_word: ἐσφραγισμένοι
  choice: walitiwa muhuri
  rationale: Huhifadhi hali ya kutendwa ya kishirikishi cha Kigiriki na kueleza kwa kawaida kwamba kundi lilipokea muhuri.
- source_word: Ῥουβὴν
  choice: Rubeni
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili cha Biblia.
- source_word: Γὰδ
  choice: Gadi
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili cha Biblia.
theological_decisions:
- issue: Nguvu na upeo wa ἐσφραγισμένοι katika orodha ya makabila
  choice: Kutafsiri wazi 'walitiwa muhuri' katika kipashio cha kwanza, huku vipashio vinavyofuata vikibaki na kitenzi kilichoachwa lakini kinachoeleweka.
  alternative: '''watu elfu kumi na mbili waliotiwa muhuri,'' au kurudia ''walitiwa muhuri'' baada ya kila kabila.'
  rationale: Kigiriki kinaweka kishirikishi baada ya idadi ya kwanza, lakini katika muktadha kinawaelezea wanaohesabiwa katika orodha nzima. Tafsiri hii inaweka wazi hali ya kutendwa bila kuongeza marudio yasiyokuwamo katika matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa orodha na marudio ya 'kutoka katika kabila la' yamedumishwa; 'watu' limeongezwa kwa uwazi wa kawaida wa Kiswahili.
