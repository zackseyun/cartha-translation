id: REV.7.9
reference: Revelation 7:9
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Μετὰ ταῦτα εἶδον, καὶ ἰδοὺ ὄχλος πολύς, ὃν ἀριθμῆσαι ⸀αὐτὸν οὐδεὶς ἐδύνατο, ἐκ παντὸς ἔθνους καὶ φυλῶν καὶ λαῶν καὶ γλωσσῶν, ⸀ἑστῶτες ἐνώπιον τοῦ θρόνου καὶ ἐνώπιον τοῦ ἀρνίου, περιβεβλημένους στολὰς λευκάς, καὶ ⸀φοίνικες ἐν ταῖς χερσὶν αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/009.yaml
  text: After these things I looked[a], and behold, a great multitude that no one was able to count, from every nation and tribe and people and language, standing before the throne and before the Lamb, clothed in white robes, with palm branches in their hands.
translation:
  language: sw
  text: Baada ya mambo hayo nikaona, na tazama, umati mkubwa ambao hakuna mtu aliyeweza kuuhesabu, kutoka katika kila taifa, kabila, jamii ya watu, na lugha, wamesimama mbele ya kiti cha enzi na mbele ya Mwana-Kondoo, wamevaa mavazi meupe, na wakiwa na matawi ya mitende mikononi mwao.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: Baada ya mambo hayo
  rationale: Huhifadhi wingi wa ταῦτα na mfuatano wa maono kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: εἶδον, καὶ ἰδοὺ
  choice: nikaona, na tazama
  rationale: “Nikaona” hufuata tendo la kuona katika maono, huku “na tazama” ikihifadhi ἰδού kama mwito wa msomaji kuelekeza fikira zake kwenye jambo linalofuata.
- source_word: ὄχλος πολύς
  choice: umati mkubwa
  rationale: “Umati” ni neno la asili na lenye hadhi linalofaa kusanyiko kubwa; “mkubwa” huwasilisha πολύς bila kuongeza wazo la idadi lisilokuwapo wazi katika kirai hiki.
- source_word: ὃν ἀριθμῆσαι αὐτὸν οὐδεὶς ἐδύνατο
  choice: ambao hakuna mtu aliyeweza kuuhesabu
  rationale: Huwasilisha kutoweza kwa mtu yeyote kuhesabu umati, na kiambishi “-u-” hurejelea “umati” kwa uwazi.
- source_word: ἐκ παντὸς ἔθνους καὶ φυλῶν καὶ λαῶν καὶ γλωσσῶν
  choice: kutoka katika kila taifa, na makabila, na jamii za watu, na lugha
  rationale: Huhifadhi, kadiri Kiswahili kinavyoruhusu, badiliko la Kiyunani kutoka umoja “kila taifa” kwenda makundi ya wingi. “Jamii za watu” hutofautisha λαῶν na “mataifa” na “makabila” bila kuifanya kuwa “watu” kwa maana ya watu binafsi tu.
- source_word: ἑστῶτες
  choice: Walikuwa wamesimama
  rationale: Kitenzi cha wingi hufuata maana ya umati wenye watu wengi na huleta hali ya tukio kwa Kiswahili cha kawaida.
- source_word: ἐνώπιον τοῦ θρόνου καὶ ἐνώπιον τοῦ ἀρνίου
  choice: mbele ya kiti cha enzi na mbele ya Mwana-Kondoo
  rationale: Kurudia “mbele ya” huhifadhi urudiaji na uzito wa ἐνώπιον; “kiti cha enzi” ni usemi wa kawaida wenye hadhi kwa θρόνος.
- source_word: περιβεβλημένους στολὰς λευκάς
  choice: wamevaa mavazi meupe
  rationale: “Wamevaa” huwasilisha hali inayotokana na kuvaa, na “mavazi” ni pana vya kutosha kwa στολαί bila kulazimisha umbo mahsusi la vazi.
- source_word: φοίνικες ἐν ταῖς χερσὶν αὐτῶν
  choice: mikononi mwao walikuwa na matawi ya mitende
  rationale: φοίνικες humaanisha matawi ya mitende katika muktadha huu. Usemi huu wa Kiswahili huhifadhi mahali yalipokuwa bila kudai zaidi kwamba walikuwa wakiyainua au kuyapunga.
theological_decisions:
- issue: Uwasilishaji wa ἀρνίον kama cheo cha Kikristo katika Ufunuo
  choice: Mwana-Kondoo
  alternative: mwanakondoo mdogo
  rationale: Katika Ufunuo, ἀρνίον hutumika kama cheo maalumu cha Kristo. “Mwana-Kondoo” ni wazi, chenye uzito, na hakiongezi msisitizo usio wa lazima juu ya udogo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo umegawanywa katika sentensi mbili ili kupunguza uzito wa sentensi ndefu ya Kiyunani bila kupoteza mfuatano wa maono. Alama [a] imewekwa moja kwa moja kwenye kirai kinachofafanuliwa na tanbihi.
