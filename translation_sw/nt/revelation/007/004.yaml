  text: Καὶ ἤκουσα τὸν ἀριθμὸν τῶν ἐσφραγισμένων, ⸀ἑκατὸν τεσσεράκοντα τέσσαρες χιλιάδες, ⸀ἐσφραγισμένοι ἐκ πάσης φυλῆς υἱῶν Ἰσραήλ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/004.yaml
  text: 'And I heard the number of those who had been sealed: one hundred forty-four thousand[a], sealed from every tribe of the sons of Israel.'
translation:
  language: sw
  text: 'Nikasikia idadi ya wale waliotiwa muhuri: mia moja arobaini na nne elfu, waliotiwa muhuri kutoka katika kila kabila la wana wa Israeli.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watoto wa Israeli.” Kigiriki kinasema “wana wa Israeli,” kikihifadhi usemi wa kiume unaohusu nasaba.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσα
  choice: Nikasikia
  rationale: Kitenzi hiki katika wakati uliopita wa simulizi kinaeleza tukio linalofuata katika maono; “nikasikia” ni cha kawaida na sahihi katika Kiswahili cha masimulizi.
- source_word: ἀριθμὸν
  choice: idadi
  rationale: “Idadi” hueleza jumla ya kundi lililohesabiwa kwa usahihi na kwa lugha ya kawaida.
- source_word: τῶν ἐσφραγισμένων / ἐσφραγισμένοι
  choice: wale waliokuwa wametiwa muhuri / waliotiwa muhuri
  rationale: Kauli tendwa inahifadhi kwamba tendo lilifanywa kwao. “Waliokuwa wametiwa muhuri” huonyesha tendo lililokamilika na hali yake inayoendelea; urudiaji wa pili umehifadhiwa kwa mtindo wa asili.
- source_word: ἑκατὸν τεσσεράκοντα τέσσαρες χιλιάδες
  choice: watu mia moja arobaini na nne elfu
  rationale: Hii ni namna ya asili ya Kiswahili ya kutaja idadi ya watu; “watu” hufanya rejeo la kundi la wanadamu lieleweke bila kubadili jumla iliyotajwa.
- source_word: ἐκ
  choice: kutoka katika
  rationale: Huonyesha chanzo au asili ya wale waliotiwa muhuri na inasomeka kwa kawaida katika muundo huu.
- source_word: πάσης φυλῆς
  choice: kila kabila
  rationale: 'Umoja wenye πᾶς hapa una maana ya mgawanyo: waliotiwa muhuri wanatoka katika kila kabila.'
- source_word: υἱῶν Ἰσραήλ
  choice: wana wa Israeli
  rationale: “Wana” huhifadhi neno la Kigiriki la kiume na ladha ya ukoo katika orodha ya makabila, bila kuligeuza kuwa usemi mpana zaidi.
theological_decisions:
- issue: Tafsiri ya υἱῶν Ἰσραήλ katika muktadha wa makabila
  choice: wana wa Israeli
  alternative: watoto wa Israeli; watu wa Israeli
  rationale: Kigiriki kinatumia wazi nomino ya kiume inayohusiana na nasaba. “Wana wa Israeli” huhifadhi usemi huo na muktadha wa kikabila bila kuingiza mfumo fulani wa tafsiri ya matukio ya mwisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa simulizi “Nikasikia” unaendana na mtiririko wa maono; urudiaji wa kutiwa muhuri umehifadhiwa. Alama ya tanbihi [a] imewekwa baada ya kirai kinachohusika.
