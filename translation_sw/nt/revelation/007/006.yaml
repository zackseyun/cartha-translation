  text: ἐκ φυλῆς Ἀσὴρ δώδεκα χιλιάδες, ἐκ φυλῆς Νεφθαλὶμ δώδεκα χιλιάδες, ἐκ φυλῆς Μανασσῆ δώδεκα χιλιάδες,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/006.yaml
  text: from the tribe of Asher[a], twelve thousand; from the tribe of Naphtali, twelve thousand; from the tribe of Manasseh, twelve thousand;
translation:
  language: sw
  text: Kutoka katika kabila la Asheri, elfu kumi na mbili;[a] kutoka katika kabila la Naftali, elfu kumi na mbili; kutoka katika kabila la Manase, elfu kumi na mbili;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa kueleza wazi zaidi maana inayotokana na muktadha: “kutoka katika kabila la Asheri, elfu kumi na mbili walitiwa muhuri” (na vivyo hivyo kwa makabila yanayofuata). Kigiriki cha aya hii hakirudii kitenzi.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκ
  choice: kutoka katika
  rationale: Kihusishi hiki kinaonyesha chanzo au asili; katika orodha hii, msemo huu unaonyesha kwamba waliotajwa wanatoka katika kila kabila.
- source_word: φυλῆς
  choice: kabila
  rationale: Katika muktadha wa nasaba ya Israeli, neno hili linamaanisha mojawapo ya makabila ya Israeli.
- source_word: Ἀσὴρ
  choice: Asheri
  rationale: Jina la kabila limetoholewa kwa umbo linalotambulika na linalotumika kwa kawaida katika Kiswahili.
- source_word: δώδεκα χιλιάδες
  choice: elfu kumi na mbili
  rationale: Hii ni tafsiri ya moja kwa moja ya idadi; kitenzi kama “walitiwa muhuri” hakijaongezwa katika matini kuu kwa sababu hakirudiwi katika Kigiriki cha aya hii.
- source_word: Νεφθαλὶμ
  choice: Naftali
  rationale: Umbo la kawaida la Kiswahili la jina la kabila hili.
- source_word: Μανασσῆ
  choice: Manase
  rationale: Umbo la kawaida la Kiswahili la jina la kabila hili.
theological_decisions:
- issue: Iwapo kuongeza kitenzi kinachoeleweka kutokana na muktadha, kama “walitiwa muhuri”
  choice: Kutoongeza kitenzi katika matini kuu, bali kuhifadhi muundo mfupi wa orodha wa Kigiriki.
  alternative: kutoka katika kabila la Asheri, elfu kumi na mbili walitiwa muhuri; na vivyo hivyo kwa makabila yanayofuata
  rationale: Muktadha uliotangulia unaonyesha kwamba idadi hizi ni za waliotiwa muhuri, lakini Kigiriki cha aya hii hakirudii kitenzi. Tanbihi inaeleza maana inayodokezwa bila kuingiza maneno hayo katika matini kuu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na rahisi kueleweka. Muundo wa orodha usio na kitenzi umehifadhiwa kwa uaminifu kwa matini ya Kigiriki; alama ya tanbihi imewekwa mwishoni mwa aya ili isivunje mtiririko wa majina na idadi.
