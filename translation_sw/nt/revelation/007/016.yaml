  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οὐ πεινάσουσιν ἔτι ⸀οὐδὲ διψήσουσιν ἔτι, οὐδὲ μὴ πέσῃ ἐπ’ αὐτοὺς ὁ ἥλιος οὐδὲ πᾶν καῦμα,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/016.yaml
  text: They will hunger no more[a], nor thirst anymore; the sun will not strike them, nor any scorching heat.
translation:
  language: sw
  text: Hawatakuwa na njaa tena, wala hawatakuwa na kiu tena; jua halitawapiga kamwe, wala joto kali lolote.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πεινάσουσιν
  choice: hawatakuwa na njaa
  rationale: Hii ni njia ya kawaida na ya asili katika Kiswahili ya kueleza kitenzi cha Kigiriki kinachomaanisha kuona njaa, huku ikihifadhi ahadi ya wakati ujao.
- source_word: ἔτι
  choice: tena
  rationale: Pamoja na ukanushaji, “tena” huonyesha kwamba hali hiyo haitatokea kuanzia hapo na kuendelea.
- source_word: οὐδὲ
  choice: wala
  rationale: “Wala” huunganisha vifungu hasi kwa ufasaha na kuhifadhi mkusanyiko wa makanusho katika Kigiriki.
- source_word: διψήσουσιν
  choice: hawatakuwa na kiu
  rationale: Ni usemi wa kawaida wa Kiswahili unaolingana kimuundo na “hawatakuwa na njaa.”
- source_word: οὐδὲ μὴ πέσῃ
  choice: halitawapiga kamwe
  rationale: Muundo οὐδὲ μή pamoja na kitenzi tegemezi una ukanushaji wenye msisitizo wa wakati ujao. “Kamwe” huhifadhi msisitizo huo, na “kupiga” hutoa kwa kawaida athari ya jua kuwaangukia watu kwa nguvu.
- source_word: ἐπ’ αὐτούς
  choice: kuwapiga
  rationale: Kiambishi cha yambwa “-wa-” huonyesha kwamba athari ya jua inawaelekea wao, kwa Kiswahili cha kawaida.
- source_word: ὁ ἥλιος
  choice: jua
  rationale: Tafsiri ya moja kwa moja na ya kawaida.
- source_word: πᾶν καῦμα
  choice: joto lolote kali
  rationale: καῦμα ni joto linalochoma au kali, na πᾶν katika muktadha hasi hutafsiriwa kwa kawaida kuwa “lolote.”
theological_decisions:
- issue: Dokezo la Isaya 49:10 na lugha ya urejesho wa mwisho
  choice: Kuhifadhi taswira halisi ya njaa, kiu, jua na joto kali bila kuifafanua kupita kiasi kuwa ya kiroho.
  alternative: Kutafsiri njaa na kiu hasa kama hamu ya kiroho.
  rationale: Muktadha unatoa faraja ya mwisho kwa kutumia lugha inayokumbusha ahadi ya urejesho katika Isaya. Tafsiri inaacha taswira yenyewe ibebe maana zake zote bila kuongeza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Ulinganifu wa “njaa” na “kiu” umehifadhiwa, na “kamwe” imetumika kuonyesha ukanushaji wenye msisitizo katika Kigiriki.
