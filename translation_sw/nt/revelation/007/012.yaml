id: REV.7.12
reference: Revelation 7:12
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: λέγοντες· Ἀμήν· ἡ εὐλογία καὶ ἡ δόξα καὶ ἡ σοφία καὶ ἡ εὐχαριστία καὶ ἡ τιμὴ καὶ ἡ δύναμις καὶ ἡ ἰσχὺς τῷ θεῷ ἡμῶν εἰς τοὺς αἰῶνας τῶν αἰώνων· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/012.yaml
  text: saying[a], “Amen! The blessing and the glory and the wisdom and the thanksgiving and the honor and the power and the might be to our God forever and ever. Amen.”
translation:
  language: sw
  text: wakisema, “Amina! Baraka, utukufu, hekima, shukrani, heshima, uweza na nguvu viwe kwa Mungu wetu milele na milele.[a] Amina.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au kwa kufuata muundo wa Kigiriki kwa karibu zaidi, “kwa enzi za enzi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: wakisema
  rationale: Kitenzi-partisipio cha wakati uliopo kinatambulisha maneno ya sifa; “wakisema” ni tafsiri fupi na ya kawaida inayohifadhi uhusiano wake na tendo lililotangulia.
- source_word: Ἀμήν / ἀμήν
  choice: Amina
  rationale: Katika ibada na maneno ya sifa, neno hili hutoholewa kwa kawaida kuwa “Amina”; kurudiwa kwake kunafungua na kufunga tamko.
- source_word: ἡ εὐλογία
  choice: Baraka
  rationale: “Baraka” huhifadhi maana ya sifa au baraka inayoelekezwa kwa Mungu bila kuibana kuwa “sifa” pekee.
- source_word: ἡ δόξα
  choice: utukufu
  rationale: Hili ndilo neno la kawaida na lenye hadhi kwa δόξα katika muktadha wa kumsifu Mungu.
- source_word: ἡ σοφία
  choice: hekima
  rationale: “Hekima” ni sawia ya kawaida na ya moja kwa moja katika Kiswahili.
- source_word: ἡ εὐχαριστία
  choice: shukrani
  rationale: Nomino “shukrani” inahifadhi tendo na hali ya kutoa asante na inafaa katika orodha ya sifa.
- source_word: ἡ τιμή
  choice: heshima
  rationale: Katika lugha ya ibada, neno hili linamaanisha heshima anayopewa Mungu, si thamani ya kifedha.
- source_word: ἡ δύναμις
  choice: uweza
  rationale: “Uweza” huonyesha uwezo au nguvu ya kutenda na pia husaidia kulitofautisha neno hili na ἰσχύς.
- source_word: ἡ ἰσχύς
  choice: nguvu
  rationale: “Nguvu” huhifadhi wazo la nguvu kuu na kutofautisha kwa kiasi jozi ya maneno yanayokaribiana, δύναμις na ἰσχύς.
- source_word: τῷ θεῷ ἡμῶν
  choice: viwe kwa Mungu wetu
  rationale: Dativu inaonyesha anayeelekezewa au kupewa sifa. “Viwe kwa Mungu wetu” hujaliza kitenzi kisichotajwa katika Kigiriki huku ikihifadhi nguvu ya kumwabudu Mungu.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: milele na milele
  rationale: Hii ni namna ya asili ya Kiswahili ya kueleza muda usio na mwisho na inalingana na nguvu ya msemo wa Kigiriki.
theological_decisions:
- issue: Kujaliza kitenzi kisichotajwa katika tamko la sifa
  choice: viwe kwa Mungu wetu
  alternative: ni vya Mungu wetu
  rationale: Kigiriki hakina kitenzi katika sehemu hii. “Viwe kwa” huhifadhi maana ya kuelekeza sifa kwa Mungu bila kuamua kwa nguvu zaidi kwamba orodha yote inaeleza umiliki tu.
- issue: Kutofautisha δύναμις na ἰσχύς
  choice: uweza ... nguvu
  alternative: nguvu ... uwezo mkuu
  rationale: Maneno haya yana maana zinazokaribiana lakini yametajwa tofauti katika orodha ya sifa. Kutumia “uweza” na “nguvu” kunahifadhi wingi wa kimakusudi wa usemi bila kuyafanya yawe dhana moja.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kiibada lakini kinachoeleweka kwa wasomaji wa kawaida. Vihusishi na makala vinavyorudiwa katika Kigiriki havijaigwa kwa namna isiyo ya asili; orodha imehifadhiwa kwa nomino saba na mdundo wake wa sifa.
