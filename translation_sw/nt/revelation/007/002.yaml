id: REV.7.2
reference: Revelation 7:2
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ εἶδον ἄλλον ἄγγελον ἀναβαίνοντα ἀπὸ ἀνατολῆς ἡλίου, ἔχοντα σφραγῖδα θεοῦ ζῶντος, καὶ ἔκραξεν φωνῇ μεγάλῃ τοῖς τέσσαρσιν ἀγγέλοις οἷς ἐδόθη αὐτοῖς ἀδικῆσαι τὴν γῆν καὶ τὴν θάλασσαν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/002.yaml
  text: And I saw another angel coming up from the east[a], having the seal of the living God, and he cried out with a loud voice to the four angels to whom it had been given to harm the earth and the sea,
translation:
  language: sw
  text: Kisha nikamwona malaika mwingine akipanda kutoka mashariki[a], akiwa na muhuri wa Mungu aliye hai. Akalia kwa sauti kubwa kwa wale malaika wanne ambao walipewa kuidhuru dunia na bahari,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri halisi, “kutoka maawio ya jua.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλον ἄγγελον
  choice: malaika mwingine
  rationale: Hutambulisha malaika wa ziada aliye tofauti na wale wanne waliotajwa awali; ni usemi wa kawaida na sahihi katika Kiswahili.
- source_word: ἀναβαίνοντα
  choice: akipanda
  rationale: Huhifadhi wazo la mwendo wa kuelekea juu katika maono bila kuongeza mahali anapoelekea.
- source_word: ἀπὸ ἀνατολῆς ἡλίου
  choice: kutoka mashariki
  rationale: Kirai hiki hufanya kazi kama maelezo ya upande; taswira yake halisi ya kuchomoza kwa jua imehifadhiwa katika tanbihi.
- source_word: ἔχοντα σφραγῖδα
  choice: akiwa na muhuri
  rationale: Hutafsiri ἔχοντα bila kudai kwamba malaika alikuwa ameushika mkononi; “muhuri” huhifadhi taswira halisi ya σφραγίς.
- source_word: θεοῦ ζῶντος
  choice: wa Mungu aliye hai
  rationale: Ni tafsiri ya kawaida, ya asili, na yenye kuhifadhi uzito wa usemi wa Kigiriki.
- source_word: ἔκραξεν φωνῇ μεγάλῃ
  choice: Akawaita kwa sauti kubwa
  rationale: Katika muktadha huu kilio kinaelekezwa kwa malaika wanne; “akawaita kwa sauti kubwa” ni Kiswahili cha asili kinachohifadhi nguvu na walengwa wa kauli.
- source_word: τοῖς τέσσαρσιν ἀγγέλοις
  choice: wale malaika wanne
  rationale: Kiwakilishi “wale” huwafanya malaika hawa warejelee kwa kawaida wale waliotajwa katika mstari uliotangulia.
- source_word: οἷς ἐδόθη αὐτοῖς
  choice: ambao walipewa
  rationale: Hufuata kauli tendwa ya Kigiriki bila kuongeza nomino kama “nguvu” wala kumtaja aliyetoa.
- source_word: ἀδικῆσαι
  choice: kuidhuru
  rationale: Katika muktadha huu kitenzi kinamaanisha kusababisha madhara kwa uumbaji, si kutenda ukosefu wa haki kwa maana ya kinadharia.
- source_word: τὴν γῆν καὶ τὴν θάλασσαν
  choice: dunia na bahari
  rationale: “Dunia” inafaa upeo wa mandhari ya ulimwengu katika Ufunuo na huungana kwa kawaida na “bahari.”
theological_decisions:
- issue: Maana ya mamlaka au ruhusa katika ἐδόθη
  choice: walipewa kuidhuru
  alternative: walipewa uwezo wa kuidhuru; waliruhusiwa kuidhuru
  rationale: Kauli “walipewa” huhifadhi hali ya mamlaka iliyokabidhiwa huku ikiepuka kuongeza “uwezo” au kufafanua tendo hilo moja kwa moja kuwa ruhusa; pia haimtaji mtoaji ambaye Kigiriki hakumtaji.
- issue: Kirai cha upande ἀπὸ ἀνατολῆς ἡλίου
  choice: kutoka mashariki
  alternative: kutoka maawio ya jua; kutoka upande wa kuchomoza kwa jua
  rationale: “Kutoka mashariki” huwasilisha maana ya upande kwa Kiswahili cha kawaida, huku taswira halisi ikihifadhiwa katika tanbihi bila kuamua umuhimu wake wa kiishara.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imegawanywa baada ya “aliye hai” ili isomeke kwa urahisi, bila kubadili mfuatano wa maono. Alama [a] imewekwa mara tu baada ya “mashariki.”
