  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: λέγων· Μὴ ἀδικήσητε τὴν γῆν μήτε τὴν θάλασσαν μήτε τὰ δένδρα, ⸀ἄχρι σφραγίσωμεν τοὺς δούλους τοῦ θεοῦ ἡμῶν ἐπὶ τῶν μετώπων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/003.yaml
  text: saying[a], “Do not harm the earth or the sea or the trees until we have sealed the servants of our God on their foreheads.”
translation:
  language: sw
  text: akisema, “Msiidhuru dunia, wala bahari, wala miti, mpaka tutakapowatia muhuri watumwa[a] wa Mungu wetu katika vipaji vya nyuso zao.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watumishi.” Neno la Kigiriki doulous linaweza kumaanisha watu walio chini ya mamlaka ya bwana na walio mali yake; hapa “watumwa” linahifadhi nguvu hiyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: akisema
  rationale: Kitenzi endelevu kinaunganisha maneno haya moja kwa moja na tendo la malaika katika muktadha uliotangulia.
- source_word: ἀδικήσητε
  choice: msiidhuru
  rationale: Katika muktadha huu vitu vinavyotajwa ni dunia, bahari na miti; kwa hiyo maana ni kuleta madhara, si kutenda udhalimu wa kimaadili dhidi ya watu.
- source_word: γῆν
  choice: dunia
  rationale: Katika orodha ya dunia, bahari na miti ndani ya maono ya hukumu yenye upeo mpana, “dunia” inafaa kuliko “nchi,” ambalo linaweza kueleweka kama eneo maalumu.
- source_word: θάλασσαν
  choice: bahari
  rationale: Hili ndilo neno la kawaida na la moja kwa moja katika Kiswahili.
- source_word: δένδρα
  choice: miti
  rationale: Tafsiri ya moja kwa moja na ya kawaida ya wingi huu.
- source_word: ἄχρι
  choice: mpaka
  rationale: 'Inaonyesha kikomo cha muda cha katazo: madhara yazuiliwe hadi tendo la kutia muhuri litimizwe.'
- source_word: σφραγίσωμεν
  choice: tutakapowatia muhuri
  rationale: Muundo huu wa Kiswahili unaonyesha tendo linalopaswa kutimizwa kabla ya katazo kuondolewa, huku ukihifadhi nafsi ya kwanza wingi.
- source_word: δούλους
  choice: watumwa
  rationale: Neno δοῦλος linaonyesha watu walio chini ya mamlaka ya bwana na walio mali yake; katika muktadha wa kutiwa alama kuwa wa Mungu, “watumwa” huhifadhi nguvu hiyo kuliko “watumishi.”
- source_word: τοῦ θεοῦ ἡμῶν
  choice: wa Mungu wetu
  rationale: Huhifadhi uhusiano wa kuwa mali ya Mungu pamoja na kiwakilishi “wetu” kilicho katika matini.
- source_word: ἐπὶ τῶν μετώπων αὐτῶν
  choice: kwenye vipaji vya nyuso zao
  rationale: Ni usemi wa kawaida na sahihi wa Kiswahili unaotaja mahali muhuri unapowekwa.
theological_decisions:
- issue: Tafsiri ya δοῦλος katika muktadha wa kumilikiwa na Mungu
  choice: watumwa
  alternative: watumishi
  rationale: Kutiwa muhuri kunasisitiza kwamba watu hawa ni wa Mungu na wako chini ya mamlaka yake. “Watumwa” huhifadhi mvutano na uzito wa sitiari ya Kigiriki; “watumishi” ni mbadala laini zaidi lakini inaweza kufifisha wazo la kumilikiwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Urudiaji wa “wala” umehifadhi msisitizo wa katazo la Kigiriki, na “vipaji vya nyuso” ni usemi unaoeleweka kwa forehead katika muktadha huu.
