  text: ἐκ φυλῆς Ζαβουλὼν δώδεκα χιλιάδες, ἐκ φυλῆς Ἰωσὴφ δώδεκα χιλιάδες, ἐκ φυλῆς Βενιαμὶν δώδεκα χιλιάδες ⸀ἐσφραγισμένοι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/008.yaml
  text: from the tribe of Zebulun[a], twelve thousand; from the tribe of Joseph, twelve thousand; from the tribe of Benjamin, twelve thousand, having been sealed.
translation:
  language: sw
  text: kutoka kabila la Zabuloni, elfu kumi na mbili; kutoka kabila la Yosefu, elfu kumi na mbili; kutoka kabila la Benyamini, elfu kumi na mbili, wakiwa wametiwa muhuri.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “waliotiwa muhuri.” Kishiriki cha Kigiriki kilicho mwishoni kinaeleza kwa muhtasari makundi yote yaliyoorodheshwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ
  choice: kutoka
  rationale: Huonyesha chanzo au asili na kudumisha mtindo unaorudiwa wa orodha.
- source_word: φυλῆς
  choice: kabila
  rationale: Katika muktadha wa mgawanyo wa Israeli, neno hili linamaanisha kabila.
- source_word: Ζαβουλών
  choice: Zabuloni
  rationale: Jina limetolewa kwa umbo linalotumiwa kwa kawaida katika Kiswahili.
- source_word: δώδεκα χιλιάδες
  choice: elfu kumi na mbili
  rationale: Tafsiri ya moja kwa moja ya idadi, inayohifadhi muundo wa orodha ya Kigiriki.
- source_word: Ἰωσήφ
  choice: Yosefu
  rationale: Maandishi yenyewe yanasema Yosefu; tafsiri haibadilishi jina hilo kuwa Efraimu au Manase.
- source_word: Βενιαμίν
  choice: Benyamini
  rationale: Jina limetolewa kwa umbo la kawaida la Kiswahili.
- source_word: ἐσφραγισμένοι
  choice: wakiwa wametiwa muhuri
  rationale: Huonyesha hali iliyotokana na tendo lililokamilika na kutendwa kwao, huku kishiriki cha mwisho kikifupisha hali ya makundi yote yaliyoorodheshwa.
theological_decisions:
- issue: Rejeo na nguvu ya kishiriki cha mwisho ἐσφραγισμένοι
  choice: Kimetafsiriwa mwishoni kama “wakiwa wametiwa muhuri,” kikihusu makundi yote matatu yaliyoorodheshwa.
  alternative: “waliotiwa muhuri” au “ambao walikuwa wametiwa muhuri”
  rationale: Nafasi yake mwishoni mwa sentensi inadumishwa ili kuhifadhi athari ya kifasihi ya Kigiriki. Tafsiri haiongezi maelezo kuhusu maana au namna ya kutiwa muhuri.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya sasa, ya heshima na inayoeleweka. Muundo unaorudiwa wa orodha umehifadhiwa; “watu” haijaongezwa kwa kuwa muktadha na kishiriki cha wingi vinaonyesha wanaohesabiwa.
