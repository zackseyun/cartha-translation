base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/010.yaml
  text: And they cry out with a loud voice[a], saying, “Salvation belongs to our God, who sits on the throne, and to the Lamb!”
translation:
  language: sw
  text: Nao wanalia kwa sauti kuu, wakisema, “Wokovu ni wa Mungu wetu, anayeketi juu ya kiti cha enzi, na wa Mwanakondoo!”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au kwa tafsiri halisi zaidi, “Wokovu kwa Mungu wetu, anayeketi juu ya kiti cha enzi, na kwa Mwanakondoo!”
    reason: lexical_alternative
lexical_decisions:
- source_word: κράζουσι
  choice: wanapaza sauti
  rationale: Kitenzi cha wakati uliopo kinaonyesha tendo hai na lenye nguvu; ‘wanapaza sauti’ ni Kiswahili cha kawaida kinachowasilisha kuita kwa sauti kuu bila kudhoofisha maana.
- source_word: φωνῇ μεγάλῃ
  choice: sauti kubwa
  rationale: Kirai hiki cha namna/chombo kinaungana kiasili na ‘wanapaza sauti’ na kuhifadhi wazo la sauti yenye nguvu.
- source_word: λέγοντες
  choice: wakisema
  rationale: Hali ya kuendelea inaingiza maneno yaliyomo katika kilio hicho kwa Kiswahili cha kawaida.
- source_word: Ἡ σωτηρία
  choice: Wokovu ni wa
  rationale: Kauli ya Kigiriki haina kitenzi na inaelekeza wokovu kwa Mungu na Mwanakondoo. ‘Ni wa’ huwasilisha uhusiano huo kwa uwazi huku tanbihi ikihifadhi muundo halisi zaidi.
- source_word: τῷ θεῷ ἡμῶν
  choice: Mungu wetu
  rationale: Dativi humtaja yule ambaye wokovu unahusishwa naye; katika sentensi nzima hii imeelezwa kwa ‘ni wa Mungu wetu.’
- source_word: τῷ καθημένῳ ἐπὶ τῷ θρόνῳ
  choice: anayeketi kwenye kiti cha enzi
  rationale: Kirai hiki kinamfafanua Mungu wetu. ‘Anayeketi’ hudumisha taswira hai ya tukio, na ‘kiti cha enzi’ ni istilahi ya kawaida ya kifalme katika Kiswahili cha Biblia.
- source_word: τῷ ἀρνίῳ
  choice: Mwanakondoo
  rationale: Jina hili la kimajazi la Yesu katika Ufunuo limetafsiriwa ili kuhifadhi picha ya dhabihu na Masihi; herufi kubwa inaonyesha matumizi yake kama cheo.
theological_decisions:
- issue: Uhusiano wa wokovu na Mungu pamoja na Mwanakondoo
  choice: “Wokovu ni wa Mungu wetu ... na wa Mwanakondoo!”
  alternative: “Wokovu kwa Mungu wetu ... na kwa Mwanakondoo!”
  rationale: Kauli inahusisha wokovu kwa pamoja na Mungu na Mwanakondoo bila kufafanua zaidi namna ya uhusiano huo. Tafsiri hii huhifadhi nguvu ya sifa na uzito wa nafasi ya Mwanakondoo, huku muundo halisi zaidi ukionyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Wanapaza sauti kubwa’ ni usemi wa kawaida wenye nguvu; ‘kiti cha enzi’ na ‘Mwanakondoo’ huhifadhi msamiati na taswira zilizozoeleka katika maandiko.
