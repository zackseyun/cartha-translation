id: REV.7.1
reference: Revelation 7:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ⸀Μετὰ τοῦτο εἶδον τέσσαρας ἀγγέλους ἑστῶτας ἐπὶ τὰς τέσσαρας γωνίας τῆς γῆς, κρατοῦντας τοὺς τέσσαρας ἀνέμους τῆς γῆς, ἵνα μὴ πνέῃ ἄνεμος ἐπὶ τῆς γῆς μήτε ἐπὶ τῆς θαλάσσης μήτε ἐπὶ ⸀πᾶν δένδρον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/001.yaml
  text: After this I saw four angels standing at the four corners of the earth[b][a], holding back the four winds of the earth so that no wind might blow on the earth or on the sea or on any tree.
translation:
  language: sw
  text: Baada ya hayo[a], nikaona malaika wanne wamesimama kwenye pembe nne za dunia[b], wakizizuia pepo nne za dunia, ili upepo wowote usivume juu ya dunia, wala juu ya bahari, wala juu ya mti wowote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa namna rasmi zaidi, “Baada ya mambo haya nikaona.”
    reason: lexical_alternative
  - marker: b
    text: “Pembe nne za dunia” ni usemi wa kawaida unaomaanisha miisho ya dunia au pande zake nne.
    reason: cultural_note
lexical_decisions:
- source_word: Μετὰ τοῦτο
  choice: Baada ya hayo
  rationale: Ni kiashiria cha kawaida cha mfuatano katika simulizi ya maono. “Baada ya hayo” ni Kiswahili cha sasa na cha asili, huku kikihifadhi mfuatano wa wakati.
- source_word: εἶδον
  choice: nikaona
  rationale: Kitenzi hiki kinaripoti moja kwa moja alichoona Yohana katika maono. Muundo wa “nikaona” unaunganisha tukio hili kwa kawaida na yaliyotangulia bila kuongeza wazo la kwamba alitazama kwanza.
- source_word: τέσσαρας ἀγγέλους
  choice: malaika wanne
  rationale: Tafsiri ya moja kwa moja ya namba pamoja na nomino.
- source_word: ἑστῶτας
  choice: wamesimama
  rationale: Hueleza hali ya kuwa wamesimama; “wamewekwa” au “wamelinda vituo” kungeongeza maana isiyodaiwa moja kwa moja na Kigiriki.
- source_word: ἐπὶ τὰς τέσσαρας γωνίας τῆς γῆς
  choice: kwenye pembe nne za dunia
  rationale: Huhifadhi taswira ya kimafumbo ya maandishi, huku “kwenye” ikiwa ya kawaida zaidi katika Kiswahili kuliko tafsiri ngumu ya kihusishi hicho.
- source_word: κρατοῦντας
  choice: wakizizuia
  rationale: Muktadha unaonyesha kwamba malaika wanazuia pepo zisivume. Chaguo hili linaweka wazi maana ya kuzuia bila kuongeza jinsi walivyofanya hivyo.
- source_word: τοὺς τέσσαρας ἀνέμους τῆς γῆς
  choice: pepo nne za dunia
  rationale: Huhifadhi usemi wa kimafumbo unaorejelea pepo kutoka pande nne. Wingi wa “upepo” ni “pepo” katika Kiswahili sanifu.
- source_word: ἵνα μὴ πνέῃ ἄνεμος
  choice: ili upepo wowote usivume
  rationale: “Ili” huonyesha kusudi au matokeo yanayokusudiwa, na “upepo wowote usivume” huwasilisha kwa Kiswahili cha kawaida kwamba hakuna upepo unaopaswa kuvuma.
- source_word: ἐπὶ τῆς γῆς μήτε ἐπὶ τῆς θαλάσσης μήτε ἐπὶ πᾶν δένδρον
  choice: juu ya nchi, wala juu ya bahari, wala juu ya mti wowote
  rationale: “Wala … wala” hudumisha uratibu wa maeneo matatu yaliyo chini ya ukanushaji. “Mti wowote” huonyesha maana ya kigawanyo ya πᾶν δένδρον.
theological_decisions:
- issue: Upeo wa γῆ katika maono ya kiapokaliptiki
  choice: Katika misemo ya ulimwengu mzima limetafsiriwa “dunia,” na katika mfululizo unaolitofautisha na bahari limetafsiriwa kwa Kiswahili cha kawaida “nchi.”
  alternative: Kutumia “nchi” kila mahali
  rationale: Taswira ya pembe nne na pepo nne ina upeo wa ulimwengu mzima, hivyo “dunia” huepuka kuifanya iwe nchi au eneo fulani. Katika kauli “juu ya nchi … bahari,” “nchi” ndiyo usemi wa asili zaidi wa Kiswahili na bado haiwekei maono mpaka wa taifa au eneo maalumu.
- issue: Asili ya lugha ya “pembe nne za dunia”
  choice: Taswira ya pembe nne imehifadhiwa katika maandishi, pamoja na tanbihi ya ufafanuzi.
  alternative: Miisho minne ya dunia; pande nne za dunia
  rationale: Usemi wa asili ni taswira ya kawaida ya kimafumbo kuhusu miisho au pande nne za dunia. Kuubadili moja kwa moja kuwa maelezo kungepunguza nguvu ya taswira; kuuhifadhi hakulazimishi dai la kisayansi kuhusu umbo la dunia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa sentensi umehifadhi mwendo wa maono na urudiaji wa taswira, huku “wala … wala” ukitoa uratibu wa asili chini ya ukanushaji.
