id: REV.7.15
reference: Revelation 7:15
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: διὰ τοῦτό εἰσιν ἐνώπιον τοῦ θρόνου τοῦ θεοῦ, καὶ λατρεύουσιν αὐτῷ ἡμέρας καὶ νυκτὸς ἐν τῷ ναῷ αὐτοῦ, καὶ ὁ καθήμενος ἐπὶ ⸂τοῦ θρόνου⸃ σκηνώσει ἐπ’ αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/015.yaml
  text: For this reason they are before the throne of God[a], and they serve him day and night in his temple, and the one seated on the throne will spread his tent over them.
translation:
  language: sw
  text: Kwa sababu hiyo wako mbele ya kiti cha enzi cha Mungu, nao wanamtumikia mchana na usiku katika hekalu lake; na yeye anayeketi juu ya kiti cha enzi atatandaza hema lake juu yao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ataweka maskani yake juu yao” au “atawafunika na kuwalinda.” Kitenzi cha Kigiriki kinahusiana na taswira ya hema au maskani.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτό
  choice: Kwa sababu hiyo
  rationale: Huonyesha uhusiano wa kisababu na maelezo yaliyotangulia kwa njia ya wazi na ya kawaida katika Kiswahili.
- source_word: ἐνώπιον
  choice: mbele ya
  rationale: Ni usemi mfupi na wa kawaida unaodumisha wazo la kuwa katika uwepo wa kiti cha enzi cha Mungu.
- source_word: λατρεύουσιν
  choice: wanamtumikia
  rationale: Kitenzi hiki kinaweza kumaanisha huduma takatifu inayotolewa kwa Mungu. 'Wanamtumikia' huhifadhi upana huo, huku mazingira ya hekalu yakionyesha kuwa ni huduma ya ibada.
- source_word: ἡμέρας καὶ νυκτός
  choice: mchana na usiku
  rationale: Hudumisha picha ya huduma isiyokoma kwa usemi wa kawaida wa Kiswahili.
- source_word: ναῷ
  choice: hekalu
  rationale: Ni neno linaloeleweka kwa urahisi kwa patakatifu pa Mungu; mazingira yanaonyesha kuwa hapa ni hekalu la mbinguni.
- source_word: ὁ καθήμενος ἐπὶ τοῦ θρόνου
  choice: yeye anayeketi juu ya kiti cha enzi
  rationale: Hudumisha nguvu ya jina la cheo la kishiriki na hali ya tendo linaloendelea kwa Kiswahili cha sasa.
- source_word: σκηνώσει ἐπ’ αὐτούς
  choice: atatandaza hema lake juu yao
  rationale: Huhifadhi taswira ya hema au maskani pamoja na wazo la uwepo wa Mungu unaowafunika na kuwalinda, bila kuibadili kuwa maelezo ya moja kwa moja pekee.
theological_decisions:
- issue: Maana ya σκηνώσει kuhusiana na taswira ya uwepo wa Mungu
  choice: atatandaza hema lake juu yao
  alternative: atakaa pamoja nao; atawafunika na kuwalinda
  rationale: Chaguo hili huhifadhi taswira ya hema au maskani ya uwepo wa Mungu na maana inayowezekana ya ulinzi, bila kulazimisha tafsiri moja na kuondoa mvutano wa sitiari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo umebaki karibu na Kigiriki, lakini umetumia mtiririko wa asili wa Kiswahili. Alama ya tanbihi imewekwa mara baada ya kishazi kinachohusika.
