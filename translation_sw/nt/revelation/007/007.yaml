id: REV.7.7
reference: Revelation 7:7
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐκ φυλῆς Συμεὼν δώδεκα χιλιάδες, ἐκ φυλῆς Λευὶ δώδεκα χιλιάδες, ἐκ φυλῆς Ἰσσαχὰρ δώδεκα χιλιάδες,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/007.yaml
  text: from the tribe of Simeon[a], twelve thousand; from the tribe of Levi, twelve thousand; from the tribe of Issachar, twelve thousand.
translation:
  language: sw
  text: kutoka katika kabila la Simeoni, watu elfu kumi na mbili; kutoka katika kabila la Lawi, watu elfu kumi na mbili; kutoka katika kabila la Isakari, watu elfu kumi na mbili.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκ
  choice: kutoka katika
  rationale: Huonyesha chanzo au asili ya watu waliohesabiwa, huku ikihifadhi muundo unaorudiwa katika orodha.
- source_word: φυλῆς
  choice: kabila
  rationale: Katika muktadha wa nasaba ya Israeli, neno hili linamaanisha mgawanyiko wa kikabila.
- source_word: Συμεὼν
  choice: Simeoni
  rationale: Jina limetolewa kwa umbo lililozoeleka katika Kiswahili cha Biblia.
- source_word: δώδεκα χιλιάδες
  choice: watu elfu kumi na mbili
  rationale: Nambari imeandikwa kwa maneno kwa usomaji wa kifasihi; kuongeza 'watu' kwa njia ya wazi na ya asili katika Kiswahili kunaonyesha wale wanaohesabiwa bila kubadili idadi.
- source_word: Λευὶ
  choice: Lawi
  rationale: Jina limetolewa kwa umbo la kawaida la Kiswahili; kutajwa kwake katika orodha kumehifadhiwa bila maelezo ya kiufafanuzi.
- source_word: Ἰσσαχὰρ
  choice: Isakari
  rationale: Jina limetolewa kwa umbo lililozoeleka katika Kiswahili cha Biblia.
theological_decisions:
- issue: Muundo unaorudiwa wa orodha ya makabila
  choice: Kuhifadhi kishazi kinachorudiwa, 'kutoka katika kabila la ..., watu elfu kumi na mbili,' kwa kila kabila.
  alternative: Kufupisha kuwa 'kutoka katika makabila ya Simeoni, Lawi na Isakari, watu elfu kumi na mbili kutoka kila moja.'
  rationale: Kigiriki hurudia muundo kwa kila kabila; urudiaji huo ni sehemu ya mwendo wa kuhesabu katika maandishi haya ya kinabii.
- issue: Kujumuishwa kwa Lawi katika orodha ya makabila
  choice: Kutafsiri Lawi moja kwa moja bila kuongeza ufafanuzi katika matini.
  alternative: Kuongeza maelezo kuhusu sababu ya Lawi kujumuishwa.
  rationale: Aya yenyewe inamtaja Lawi tu miongoni mwa makabila; ufafanuzi wa sababu ungeingiza tafsiri isiyotajwa na chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Urudiaji wa makusudi umehifadhiwa. 'Kutoka katika' ni wa asili zaidi kuliko 'nje ya' katika muktadha huu, hivyo dokezo la mbadala la Kiingereza halihitajiki.
