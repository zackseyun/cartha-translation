id: REV.7.13
reference: Revelation 7:13
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ ἀπεκρίθη εἷς ἐκ τῶν πρεσβυτέρων λέγων μοι· Οὗτοι οἱ περιβεβλημένοι τὰς στολὰς τὰς λευκὰς τίνες εἰσὶν καὶ πόθεν ἦλθον;
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/013.yaml
  text: Then one of the elders answered[a], saying to me, “These who are clothed in the white robes—who are they, and where have they come from?”
translation:
  language: sw
  text: Kisha mmoja wa wale wazee akajibu, akaniambia, “Hawa waliovikwa mavazi meupe ni nani, nao wametoka wapi?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: Kisha
  rationale: Kiunganishi hiki kinaendeleza mfululizo wa maono; “Kisha” ni cha asili katika simulizi la Kiswahili.
- source_word: ἀπεκρίθη ... λέγων μοι
  choice: akaniambia
  rationale: Kigiriki hutumia kitenzi cha ‘kujibu’ hata bila swali lililotangulia waziwazi. Kiswahili cha kawaida hutumia “akaniambia” katika muktadha huu bila kupotosha kazi ya usemi huo.
- source_word: εἷς ἐκ τῶν πρεσβυτέρων
  choice: mmoja wa wale wazee
  rationale: Huhifadhi muundo wa sehemu ya kundi na kurejelea wazee waliokwisha kutajwa.
- source_word: οἱ περιβεβλημένοι
  choice: waliovikwa
  rationale: Huwasilisha hali iliyotokana na tendo lililotangulia, kama inavyoashiriwa na participio timilifu ya Kigiriki.
- source_word: τὰς στολὰς τὰς λευκάς
  choice: mavazi meupe
  rationale: στολή ni vazi refu au rasmi; “mavazi” ni neno la kawaida na lenye hadhi, linalofaa taswira inayojirudia katika Ufunuo.
- source_word: τίνες εἰσὶν
  choice: ni nani
  rationale: Hii ndiyo namna ya kawaida ya Kiswahili kuuliza utambulisho wa watu wengi.
- source_word: πόθεν ἦλθον
  choice: wametoka wapi
  rationale: Huuliza mahali au asili walikotoka na kudumisha umuhimu wa kufika kwao katika tukio la sasa.
theological_decisions:
- issue: Nyanja ya wakati ya ἦλθον
  choice: wametoka wapi
  alternative: walitoka wapi
  rationale: Ingawa aoristi ya Kigiriki inaelekeza kwenye tendo lililopita, wakati timilifu wa Kiswahili unaonyesha kwa kawaida tendo la kutoka lenye matokeo yanayoonekana katika maono ya sasa. Hili ni chaguo la kimtindo, si uamuzi wa kimafundisho.
- issue: Maana ya ἀπεκρίθη bila swali lililotangulia moja kwa moja
  choice: akaniambia
  alternative: akanijibu, akisema
  rationale: “Akaniambia” ni ya asili zaidi katika Kiswahili na haidai kuwa Yohana alikuwa ameuliza swali lisilotajwa; hata hivyo, Kigiriki halisi hutumia kitenzi cha kujibu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa urahisi. Mpangilio wa maswali mawili na taswira ya mavazi meupe vimehifadhiwa.
