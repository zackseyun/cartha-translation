id: REV.7.14
reference: Revelation 7:14
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ⸀εἴρηκα αὐτῷ· Κύριέ μου, σὺ οἶδας. καὶ εἶπέν μοι· Οὗτοί εἰσιν οἱ ἐρχόμενοι ἐκ τῆς θλίψεως τῆς μεγάλης, καὶ ἔπλυναν τὰς στολὰς αὐτῶν καὶ ἐλεύκαναν ⸀αὐτὰς ἐν τῷ αἵματι τοῦ ἀρνίου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/014.yaml
  text: And I said to him[a], “My lord, you know.” And he said to me, “These are the ones coming out of the great tribulation[b]. They washed their robes and made them white in the blood of the Lamb.”
translation:
  language: sw
  text: Nikamwambia, “Bwana wangu, wewe unajua.” Naye akaniambia, “Hawa ndio wanaotoka katika ile dhiki kuu.[a] Walifua majoho yao na kuyafanya meupe katika damu ya Mwanakondoo.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “katika ile taabu kuu” au “katika yale mateso makuu.” Neno la Kigiriki linaweza kumaanisha shinikizo, dhiki, taabu, au mateso.
    reason: lexical_alternative
  - marker: b
    text: 'Maneno “katika damu ya Mwanakondoo” yamehifadhiwa kwa makusudi. Kigiriki kinaweza pia kueleweka kwa maana ya njia, “kwa damu,” lakini tafsiri hii inadumisha taswira ya Ufunuo iliyo ya fumbo: damu ndiyo inayosafisha na kufanya meupe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴρηκα
  choice: Nikamwambia
  rationale: Ingawa kitenzi hiki kina umbo la wakati timilifu, katika masimulizi ya Kiyohana kinaweza kutumika kama utangulizi wa mazungumzo; wakati uliopita wa Kiswahili unasomeka kwa kawaida hapa.
- source_word: Κύριέ μου
  choice: Bwana wangu
  rationale: Ni namna ya heshima ya kumwambia yule mzee wa mbinguni. Muktadha haumtambui kama Mungu au Kristo, hivyo maana haipaswi kuongezewa uzito wa kimungu.
- source_word: σὺ οἶδας
  choice: wewe unajua
  rationale: Kiwakilishi kilicho wazi katika Kigiriki kina mkazo wa kiasi; kukitaja kwa ‘wewe’ kunahifadhi mkazo huo na heshima ya jibu.
- source_word: οἱ ἐρχόμενοι
  choice: wanaotoka
  rationale: Umbo la participio ya wakati wa sasa linawasilisha tendo linaloendelea au linalowatambulisha, si tukio lililowekwa tu katika wakati uliopita.
- source_word: ἐκ τῆς θλίψεως τῆς μεγάλης
  choice: katika ile dhiki kuu
  rationale: ‘Dhiki’ ni neno la kawaida na lenye hadhi linaloweza kumaanisha mateso, taabu, au shinikizo. ‘Ile’ inasaidia kuonyesha kishazi bainifu cha Kigiriki bila kukifungamanisha na mfumo fulani wa nyakati za mwisho.
- source_word: ἔπλυναν
  choice: walifua
  rationale: Kitenzi cha aoristi kinaonyesha tendo kama jambo lililokamilika; ‘walifua’ ndilo neno la kawaida kwa kusafisha mavazi.
- source_word: στολάς
  choice: majoho
  rationale: Neno hili humaanisha mavazi marefu au ya heshima; ‘majoho’ yanahifadhi taswira hiyo kuliko neno la jumla ‘mavazi.’
- source_word: ἐλεύκαναν
  choice: kuyafanya meupe
  rationale: Tafsiri hii inahifadhi maana ya kisababishi ya kufanya majoho yawe meupe na ni ya kawaida katika Kiswahili cha sasa.
- source_word: ἐν τῷ αἵματι
  choice: katika damu
  rationale: ‘Katika’ linahifadhi taswira ya kushangaza ya kutakaswa ndani ya damu. Ingawa Kigiriki kinaweza pia kueleweka kwa maana ya njia, yaani ‘kwa damu,’ kutafsiri ‘katika’ hakufuti fumbo la taswira.
- source_word: τοῦ ἀρνίου
  choice: ya Mwanakondoo
  rationale: Katika Ufunuo, jina hili linamtaja Yesu kama cheo; herufi kubwa inaonyesha matumizi hayo ya kichwa bila kubadili maana ya neno.
theological_decisions:
- issue: Namna ya kutafsiri κύριος anapoambiwa yule mzee
  choice: Bwana wangu
  alternative: Mheshimiwa; Bwana wangu kwa herufi kubwa yenye dhana ya wazi zaidi ya kimungu
  rationale: Kauli hiyo inadumisha heshima huku muktadha ukionyesha kuwa Yohana anamjibu mmoja wa wazee, si kwamba anamwita waziwazi Mungu au Masihi.
- issue: Maana ya ‘ile dhiki kuu’
  choice: ile dhiki kuu
  alternative: ile taabu kuu; yale mateso makuu
  rationale: Tafsiri ya kileksia inaacha wazi ikiwa maneno haya yanahusu kipindi maalumu cha mwisho, mateso mapana ya waamini, au vyote viwili; haichagui mfumo mmoja wa kieskatolojia.
- issue: Taswira ya kufanya meupe katika damu
  choice: katika damu ya Mwanakondoo
  alternative: kwa damu ya Mwanakondoo
  rationale: ‘Katika’ huhifadhi kwa karibu kihusishi cha Kigiriki na fumbo la Ufunuo la damu inayotakasa, huku tanbihi ikitaja uwezekano wa maana ya njia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa mazungumzo ni wa kawaida, ‘majoho’ yanahifadhi taswira ya vazi refu, na ‘wanaotoka’ linadumisha tendo linaloendelea. Alama zote za tanbihi zimewekwa baada ya vifungu vinavyohusika.
