id: REV.7.11
reference: Revelation 7:11
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ πάντες οἱ ἄγγελοι εἱστήκεισαν κύκλῳ τοῦ θρόνου καὶ τῶν πρεσβυτέρων καὶ τῶν τεσσάρων ζῴων, καὶ ἔπεσαν ἐνώπιον τοῦ θρόνου ἐπὶ τὰ πρόσωπα αὐτῶν καὶ προσεκύνησαν τῷ θεῷ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/011.yaml
  text: And all the angels were standing around the throne and the elders and the four living creatures[a], and they fell before the throne on their faces and worshiped God,
translation:
  language: sw
  text: Na malaika wote walikuwa wamesimama kuzunguka kiti cha enzi, wazee, na vile viumbe hai vinne[a]. Wakaanguka kifudifudi mbele ya kiti cha enzi na kumwabudu Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “viumbe vyenye uhai vinne.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες οἱ ἄγγελοι
  choice: malaika wote
  rationale: Hutoa maana ya moja kwa moja ya πάντες pamoja na nomino yenye kibainishi; “malaika” ndilo neno la kawaida na linalofaa katika Ufunuo.
- source_word: εἱστήκεισαν
  choice: walikuwa wamesimama
  rationale: Umbo hili linaonyesha hali ya kuwa katika mkao wa kusimama, si tendo la kusimama tu.
- source_word: κύκλῳ τοῦ θρόνου
  choice: kuizunguka kiti cha enzi
  rationale: Hueleza nafasi ya malaika pande zote za kiti cha enzi kwa Kiswahili cha kawaida.
- source_word: τῶν πρεσβυτέρων
  choice: wale wazee
  rationale: “Wazee” ni tafsiri iliyozoeleka ya kundi hili la mbinguni; “wale” husaidia kutambulisha washiriki waliokwisha tajwa katika muktadha.
- source_word: τῶν τεσσάρων ζῴων
  choice: vile viumbe hai vinne
  rationale: “Viumbe hai” huhifadhi uhai na hali ya viumbe hawa bila kuwapunguza kuwa wanyama; “vile” linaendana na kundi maalumu lililokwisha tajwa.
- source_word: ἔπεσαν ... ἐπὶ τὰ πρόσωπα αὐτῶν
  choice: wakaanguka kifudifudi
  rationale: Nahau “kifudifudi” huwasilisha kwa asili tendo la kuanguka huku nyuso zikiwa chini.
- source_word: ἐνώπιον τοῦ θρόνου
  choice: mbele ya kiti cha enzi
  rationale: Ni uwasilishaji wa kawaida wa maana ya mahali ya ἐνώπιον.
- source_word: προσεκύνησαν τῷ θεῷ
  choice: kumwabudu Mungu
  rationale: Kwa kuwa mlengwa ni Mungu na kujitupa chini tayari kumeelezwa, kitenzi hapa kinamaanisha ibada, si kuinama kwa heshima tu.
theological_decisions:
- issue: Utambulisho wa ζῷα katika chumba cha kiti cha enzi
  choice: viumbe hai
  alternative: viumbe vyenye uhai
  rationale: Tafsiri hii huhifadhi taswira ya kinabii bila kuwaita wanyama wala kuongeza utambulisho wa kiteolojia usiotajwa.
- issue: Nguvu ya προσκυνέω inapomhusu Mungu
  choice: kumwabudu Mungu
  alternative: kuinama mbele za Mungu
  rationale: Muktadha umetaja tayari kusujudu kifudifudi, na Mungu ndiye mlengwa; hivyo maana kamili ya ibada inafaa hapa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Muundo umegawanywa katika sentensi mbili ili usomeke kwa kawaida; “pamoja na” huepusha dhana kwamba wazee na viumbe hai ndio wanaozungukwa kama vitu tofauti, huku ikihifadhi mpangilio wa eneo la kiti cha enzi.
