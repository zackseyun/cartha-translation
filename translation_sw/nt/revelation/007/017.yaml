id: REV.7.17
reference: Revelation 7:17
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὅτι τὸ ἀρνίον τὸ ἀνὰ μέσον τοῦ θρόνου ⸀ποιμανεῖ αὐτούς, καὶ ⸀ὁδηγήσει αὐτοὺς ἐπὶ ζωῆς πηγὰς ὑδάτων· καὶ ἐξαλείψει ὁ θεὸς πᾶν δάκρυον ἐκ τῶν ὀφθαλμῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/017.yaml
  text: because the Lamb in the midst of the throne will shepherd them[a], and he will guide them to springs of the water of life[c][b], and God will wipe away every tear from their eyes.
translation:
  language: sw
  text: kwa sababu Mwana-Kondoo aliye katikati ya kiti cha enzi[a] atawachunga, naye atawaongoza[b] kwenye chemchemi za maji ya uzima[c]; na Mungu atafuta kila chozi machoni mwao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliye kwenye kiini cha kiti cha enzi.”
    reason: lexical_alternative
  - marker: b
    text: Au, “atawaelekeza.”
    reason: lexical_alternative
  - marker: c
    text: Au, “kwenye chemchemi za maji yaliyo hai.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρνίον
  choice: Mwana-Kondoo
  rationale: Ni jina la kimasiha na la kikristolojia linalotumiwa kwa uthabiti katika Ufunuo. Linahifadhi taswira ya dhabihu bila kutoa hisia ya udogo isiyofaa.
- source_word: ἀνὰ μέσον τοῦ θρόνου
  choice: aliye katikati ya kiti cha enzi
  rationale: Tafsiri hii inahifadhi taswira ya nafasi ya kati kuhusiana na kiti cha enzi na ni ya kawaida katika Kiswahili sanifu.
- source_word: ποιμανεῖ
  choice: atawachunga
  rationale: Kitenzi hiki kinawasilisha tendo la mchungaji na kuhifadhi fumbo la makusudi kwamba Mwana-Kondoo ndiye anayewachunga.
- source_word: ὁδηγήσει
  choice: atawaongoza
  rationale: ‘Atawaongoza’ ni tafsiri ya kawaida na inayoeleweka ya tendo la kuelekeza au kuongoza watu hadi mahali fulani.
- source_word: ἐπὶ ζωῆς πηγὰς ὑδάτων
  choice: kwenye chemchemi za maji ya uzima
  rationale: ‘Chemchemi’ inafaa kwa taswira ya chanzo cha asili cha maji, huku ‘maji ya uzima’ ikihifadhi uhusiano wa maneno ya Kigiriki bila kuamua kimya kimya kama ζωῆς ina maana ya maji yanayotoa uzima au maji yaliyo hai.
- source_word: ἐξαλείψει
  choice: atafuta
  rationale: Katika muktadha huu wa faraja, ‘atafuta’ ni usemi wa kawaida wa kuondoa chozi kwa upole; haileti maana ya kisheria ya kufuta rekodi.
- source_word: πᾶν δάκρυον
  choice: kila chozi
  rationale: Umoja pamoja na πᾶν unaelezwa kwa kawaida kama ‘kila chozi,’ ukisisitiza ukamilifu kwa namna binafsi na yenye picha hai.
- source_word: ἐκ τῶν ὀφθαλμῶν αὐτῶν
  choice: katika macho yao
  rationale: Huu ni usemi wa kawaida wa Kiswahili kwa kufuta machozi yanayotoka machoni, bila kulazimisha muundo wa Kigiriki usio wa kawaida katika Kiswahili.
theological_decisions:
- issue: Fumbo la kikristolojia la Mwana-Kondoo kuwa mchungaji
  choice: Mwana-Kondoo ... atawachunga
  alternative: Mwana-Kondoo ... atawatunza / atawatawala
  rationale: Tafsiri inahifadhi kwa makusudi taswira ya Mwana-Kondoo anayefanya kazi ya mchungaji. ‘Atawatawala’ ingeongeza mkazo wa kifalme na kudhoofisha uhusiano na kuwaongoza kwenye maji.
- issue: Uhusiano wa Mungu na Mwana-Kondoo katika kishazi cha mwisho
  choice: na Mungu atafuta kila chozi katika macho yao
  alternative: Kuendeleza Mwana-Kondoo kama mtendaji aliyedokezwa
  rationale: Kigiriki kinamtaja ὁ θεός waziwazi kuwa kiima cha kitenzi cha mwisho. Kumtaja Mungu kunahifadhi utofauti wa wahusika katika maono bila kuongeza ufafanuzi wa kimadhehebu.
- issue: Maana ya ζωῆς katika taswira ya maji
  choice: maji ya uzima
  alternative: maji yaliyo hai
  rationale: Muundo wa Kigiriki unaweza kuwasilisha maji yenye sifa ya uzima au maji yanayotoa uzima. Matini kuu inatumia usemi wa kawaida wa kibiblia, huku tanbihi ikihifadhi uwezekano mwingine.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kifasihi lakini kinachoeleweka kwa msomaji wa kawaida. ‘Mwana-Kondoo,’ ‘kiti cha enzi,’ na ‘maji ya uzima’ huhifadhi msamiati na taswira kuu za Ufunuo; sentensi imeunganishwa kwa mtiririko wa kawaida wa Kiswahili.
