    text: Au, “nikaona.”
    reason: lexical_alternative
  - marker: b
    text: 'Kigiriki: “makumi ya maelfu mara makumi ya maelfu, na maelfu mara maelfu,” usemi unaoonyesha umati mkubwa mno; pia unaweza kutafsiriwa, “elfu kumi mara elfu kumi, na maelfu mara maelfu.”'
    reason: lexical_alternative
  revision_rationale: The revision retains the draft’s sound lexical and theological choices, while more closely reflecting the Greek connective and avoiding a nonessential progressive temporal nuance. The numerical footnote now also supplies the literal “ten thousand” alternative represented in the audit trail.
