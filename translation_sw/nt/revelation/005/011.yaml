id: REV.5.11
reference: Revelation 5:11
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ εἶδον, καὶ ⸀ἤκουσα φωνὴν ἀγγέλων πολλῶν κύκλῳ τοῦ θρόνου καὶ τῶν ζῴων καὶ τῶν πρεσβυτέρων, καὶ ἦν ὁ ἀριθμὸς αὐτῶν μυριάδες μυριάδων καὶ χιλιάδες χιλιάδων,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/011.yaml
  text: And I looked[a], and I heard the voice of many angels around the throne and the living creatures and the elders, and their number was myriads of myriads and thousands of thousands[b],
translation:
  language: sw
  text: Nami nikatazama[a], nikasikia sauti ya malaika wengi wakizunguka kiti cha enzi, viumbe hai, na wazee. Idadi yao ilikuwa makumi ya maelfu mara makumi ya maelfu, na maelfu mara maelfu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nikaona.”
    reason: lexical_alternative
  - marker: b
    text: 'Kigiriki: “makumi ya maelfu mara makumi ya maelfu, na maelfu mara maelfu,” usemi unaoonyesha umati mkubwa mno; pia unaweza kutafsiriwa, “elfu kumi mara elfu kumi, na maelfu mara maelfu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδον
  choice: nikatazama
  rationale: Katika mfululizo wa maono, kitenzi hiki kinaonyesha Yohana akielekeza macho yake kwenye tukio kisha akisikia; “nikaona” pia inawezekana na imewekwa katika tanbihi.
- source_word: ἤκουσα
  choice: nikasikia
  rationale: Ni tafsiri ya kawaida ya kitenzi katika usimulizi wa tukio lililopita na inaendeleza mfuatano wa maono.
- source_word: φωνὴν ἀγγέλων πολλῶν
  choice: sauti ya malaika wengi
  rationale: Muundo huu wa kawaida unahifadhi umoja wa neno “sauti” huku ukionyesha kwamba ilitolewa na malaika wengi.
- source_word: κύκλῳ
  choice: waliokuwa kuzunguka
  rationale: Hutoa kwa Kiswahili cha kawaida nafasi ya malaika kuizunguka sehemu yote ya kundi la kiti cha enzi, viumbe hai, na wazee.
- source_word: θρόνου
  choice: kile kiti cha enzi
  rationale: “Kiti cha enzi” ni tafsiri ya kawaida; kiashiria “kile” kinarejelea kiti maalumu katika maono.
- source_word: ζῴων
  choice: wale viumbe hai
  rationale: Inadumisha utambulisho wa viumbe wanne wa maono na kuepuka kuwafanya waonekane kuwa wanyama wa kawaida.
- source_word: πρεσβυτέρων
  choice: wale wazee
  rationale: Ni tafsiri ya kawaida katika mandhari ya chumba cha kiti cha enzi; kiashiria kinawatambulisha wale waliotajwa katika maono.
- source_word: ἦν ὁ ἀριθμὸς αὐτῶν
  choice: Idadi yao ilikuwa
  rationale: Ni Kiswahili cha kawaida kinachohifadhi taarifa ya wazi kuhusu idadi yao.
- source_word: μυριάδες μυριάδων
  choice: makumi ya maelfu mara makumi ya maelfu
  rationale: Neno μυριάς linaweza kutaja elfu kumi au kundi kubwa sana; usemi huu unahifadhi picha ya namba iliyozidishwa bila kuibadili moja kwa moja kuwa “isiyohesabika.”
- source_word: χιλιάδες χιλιάδων
  choice: maelfu mara maelfu
  rationale: Inahifadhi urudiaji na wazo la idadi kubwa mno katika usemi wa Kigiriki.
theological_decisions:
- issue: Utambulisho wa ζῷα katika maono ya kiti cha enzi
  choice: viumbe hai
  alternative: viumbe; viumbe wenye uhai
  rationale: “Viumbe hai” ni sahihi na ya kawaida, inawatofautisha na wanyama wa kawaida bila kuongeza ufafanuzi wa kimadhehebu.
- issue: Kiwango cha idadi ya malaika
  choice: makumi ya maelfu mara makumi ya maelfu, na maelfu mara maelfu
  alternative: mamilioni na maelfu mengi sana; makundi yasiyohesabika
  rationale: Tafsiri inatunza usemi mkubwa wa kihesabu wa maandishi badala ya kuamua kwamba ni namba kamili au kauli ya kutohesabika kabisa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo umegawanywa katika sentensi mbili ili kusomeka kwa kawaida bila kupoteza mfuatano wa Kigiriki. Viashiria “kile” na “wale” vinasaidia kuonyesha kwamba wahusika na kiti cha enzi tayari wanajulikana katika maono.
