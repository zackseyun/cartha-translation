id: REV.5.12
reference: Revelation 5:12
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: λέγοντες φωνῇ μεγάλῃ· Ἄξιόν ἐστιν τὸ ἀρνίον τὸ ἐσφαγμένον λαβεῖν τὴν δύναμιν ⸀καὶ πλοῦτον καὶ σοφίαν καὶ ἰσχὺν καὶ τιμὴν καὶ δόξαν καὶ εὐλογίαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/012.yaml
  text: saying with a loud voice[c][b][a], “Worthy is the Lamb who was slain to receive power and wealth and wisdom and might and honor and glory and blessing.”
translation:
  language: sw
  text: wakisema kwa sauti kubwa, “Mwana-Kondoo aliyechinjwa[a] anastahili kupokea nguvu, utajiri[b], hekima, uweza[c], heshima, utukufu na baraka.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “aliyeuawa.” Tafsiri “aliyechinjwa” inaonyesha kwa uwazi zaidi taswira ya kitenzi cha Kigiriki na ya dhabihu.
    reason: lexical_alternative
  - marker: b
    text: Au “mali.”
    reason: lexical_alternative
  - marker: c
    text: Au “nguvu.” Neno “uweza” limetumiwa hapa ili kulitofautisha na neno la awali lililotafsiriwa “nguvu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: wakisema
  rationale: Kitenzi kishirikishi cha wakati uliopo kinaunganisha kauli hii na umati uliotajwa katika mstari uliotangulia bila kuongeza taarifa ya hali ya tendo.
- source_word: φωνῇ μεγάλῃ
  choice: kwa sauti kubwa
  rationale: Ni usemi wa kawaida wa Kiswahili unaohifadhi taswira halisi ya sauti badala ya kutumia kielezi pekee.
- source_word: Ἄξιόν ἐστιν
  choice: anastahili
  rationale: Muundo huu ni wa asili katika Kiswahili na unaonyesha kwamba Mwana-Kondoo ndiye mwenye kustahili kupokea mambo yanayoorodheshwa.
- source_word: τὸ ἀρνίον
  choice: Mwana-Kondoo
  rationale: Hili ni jina la kimasiha linalotambulika katika Ufunuo; herufi kubwa zinaonyesha matumizi yake kama cheo cha Yesu katika muktadha huu.
- source_word: τὸ ἐσφαγμένον
  choice: aliyechinjwa
  rationale: Kitenzi hiki kinahifadhi maana ya kifo cha kikatili na taswira ya dhabihu iliyomo katika σφάζω, huku kikibaki cha heshima katika wimbo wa ibada.
- source_word: λαβεῖν
  choice: kupokea
  rationale: Katika wimbo huu mambo hayo yanatolewa au kutambuliwa kuwa ya Mwana-Kondoo; ‘kupokea’ linafaa kuliko ‘kuchukua,’ ingawa kitenzi cha Kigiriki kinaweza kuwa na maana zote mbili.
- source_word: δύναμιν
  choice: nguvu
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya δύναμις katika muktadha huu.
- source_word: πλοῦτον
  choice: utajiri
  rationale: Neno hili la kawaida linaonyesha wingi wa mali au rasilimali bila kubana maana kuwa vitu vinavyohesabika pekee.
- source_word: σοφίαν
  choice: hekima
  rationale: Ni tafsiri ya moja kwa moja na iliyozoeleka.
- source_word: ἰσχὺν
  choice: uweza
  rationale: ‘Uweza’ linatofautisha ἰσχύς na δύναμις iliyotafsiriwa ‘nguvu,’ na kuhifadhi utofauti wa kimtindo katika orodha.
- source_word: τιμὴν
  choice: heshima
  rationale: Linaeleza heshima inayotolewa kwa anayetambuliwa kuwa mwenye thamani.
- source_word: δόξαν
  choice: utukufu
  rationale: Ni tafsiri ya kawaida ya kibiblia, hasa katika muktadha wa ibada.
- source_word: εὐλογίαν
  choice: baraka
  rationale: Katika muktadha wa sifa, neno hili linaweza kumaanisha baraka au sifa njema; ‘baraka’ huhifadhi upana huo na matumizi yaliyozoeleka ya kibiblia.
theological_decisions:
- issue: Cheo cha Kikristo cha ἀρνίον
  choice: Mwana-Kondoo
  alternative: mwana-kondoo
  rationale: Katika Ufunuo neno hili linamtaja Yesu aliyeuawa na kutukuzwa. Herufi kubwa zinaonyesha kwamba limetumiwa kama cheo bila kuongeza dai jingine la kimafundisho.
- issue: Lugha ya kifo cha Mwana-Kondoo
  choice: aliyechinjwa
  alternative: aliyeuawa
  rationale: ‘Aliyechinjwa’ huhifadhi taswira yenye nguvu ya σφάζω na uhusiano wake na mwana-kondoo wa dhabihu, bila kufafanua namna maalumu ya upatanisho.
- issue: Uhusiano wa Mwana-Kondoo na orodha ya sifa saba
  choice: anastahili kupokea
  alternative: anastahili kuchukua
  rationale: ‘Kupokea’ huonyesha kukabidhiwa au kutambuliwa kwa nguvu, utajiri, hekima, uweza, heshima, utukufu na baraka katika ibada, huku kutodai kwamba Mwana-Kondoo hakuwa navyo hapo awali.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na wa kiibada lakini kinachoeleweka kwa msomaji wa kawaida. Mpangilio wa maneno umefanywa wa asili katika Kiswahili, huku orodha ya sifa saba na tofauti kati ya δύναμις na ἰσχύς zikihifadhiwa.
