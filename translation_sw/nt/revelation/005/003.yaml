  text: καὶ οὐδεὶς ἐδύνατο ἐν τῷ ⸀οὐρανῷ ⸂οὐδὲ ἐπὶ τῆς γῆς οὐδὲ⸃ ὑποκάτω τῆς γῆς ἀνοῖξαι τὸ βιβλίον οὔτε βλέπειν αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/003.yaml
  text: And no one in heaven or on the earth or under the earth was able to open the scroll or to look at it[a].
translation:
  language: sw
  text: Na hakuna yeyote mbinguni, wala duniani, wala chini ya dunia, aliyeweza kukifungua kile kitabu cha kukunjwa au kukitazama.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kitabu.” Neno la Kigiriki linaweza kumaanisha hati iliyoandikwa kwa ujumla, lakini katika mazingira haya “kitabu cha kukunjwa” kinaafiki zaidi taswira ya kale.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς
  choice: hakuna yeyote
  rationale: Ni usemi wa kawaida na wenye hadhi unaowasilisha wazi kukanusha kwa mtu yeyote.
- source_word: ἐδύνατο
  choice: aliyeweza
  rationale: Huwasilisha uwezo uliokanushwa katika simulizi la wakati uliopita bila kuongeza maana.
- source_word: ἐν τῷ οὐρανῷ
  choice: mbinguni
  rationale: Ni usemi wa asili wa Kiswahili kwa mahali pa kimbingu na unadumisha sehemu ya kwanza ya mgawanyo wa ulimwengu.
- source_word: ἐπὶ τῆς γῆς
  choice: juu ya dunia
  rationale: Huhifadhi kwa uwazi maana ya mahali na ulinganifu wa maeneo matatu.
- source_word: ὑποκάτω τῆς γῆς
  choice: chini ya dunia
  rationale: Ni tafsiri ya moja kwa moja inayohifadhi taswira ya maeneo matatu ya ulimwengu.
- source_word: ἀνοῖξαι
  choice: kukifungua
  rationale: Kiwakilishi cha ngeli kinarejelea kitabu cha kukunjwa kwa njia ya kawaida katika Kiswahili.
- source_word: τὸ βιβλίον
  choice: kile kitabu cha kukunjwa
  rationale: Katika maono haya neno linarejelea hati ya kale iliyokunjwa; usemi huu unaeleweka kwa wasomaji wa kawaida na huepuka taswira ya kitabu cha kurasa, huku tanbihi ikihifadhi maana pana ya neno la Kigiriki.
- source_word: οὔτε βλέπειν αὐτό
  choice: au kukitazama
  rationale: Huhifadhi uratibu hasi wa kitenzi cha pili na maana ya kuelekeza macho kwenye hati, bila kuongeza neno lisilo wazi katika Kigiriki kama ‘hata’.
theological_decisions:
- issue: Upeo wa viumbe wasioweza kukifungua kitabu cha kukunjwa
  choice: 'Kudumisha maeneo matatu: “mbinguni, wala juu ya dunia, wala chini ya dunia.”'
  alternative: Kufupisha kwa kusema “mahali popote katika uumbaji.”
  rationale: Mpangilio wa maeneo matatu unasisitiza kutoweza kwa viumbe wote na kuhifadhi taswira ya kiapokaliptiki bila kuibadili kuwa wazo la jumla.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Marudio ya “wala” yanadumisha mkazo na upeo wa maeneo matatu; sentensi haiongezi “hata,” kwa kuwa halijaonyeshwa wazi katika matini ya Kigiriki.
