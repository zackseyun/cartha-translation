id: REV.5.6
reference: Revelation 5:6
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ εἶδον ἐν μέσῳ τοῦ θρόνου καὶ τῶν τεσσάρων ζῴων καὶ ἐν μέσῳ τῶν πρεσβυτέρων ἀρνίον ⸀ἑστηκὸς ὡς ἐσφαγμένον, ⸀ἔχων κέρατα ἑπτὰ καὶ ὀφθαλμοὺς ἑπτά, ⸀οἵ εἰσιν τὰ ἑπτὰ πνεύματα τοῦ θεοῦ, ⸀ἀπεσταλμένοι εἰς πᾶσαν τὴν γῆν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/006.yaml
  text: And I saw[a], in the midst of the throne and of the four living creatures, and in the midst of the elders, a Lamb standing as though it had been slain, having seven horns and seven eyes[b], which are the seven Spirits of God sent out into all the earth.
translation:
  language: sw
  text: Nami nikaona, katikati ya kiti cha enzi na ya wale viumbe hai wanne, na katikati ya wale wazee, Mwana-kondoo aliyesimama kama aliyechinjwa,[a] akiwa na pembe saba na macho saba. Macho hayo ndiyo roho saba za Mungu[b] zilizotumwa katika dunia yote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa ukaribu zaidi na maneno ya Kigiriki, “kama aliyechinjwa.”
    reason: lexical_alternative
  - marker: b
    text: Usemi “roho saba za Mungu” umehifadhiwa kama ulivyoandikwa; wengine huuelewa kuwa njia ya kiishara ya kumtaja Roho Mtakatifu katika utimilifu wa namna saba.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν μέσῳ ... καὶ ... ἐν μέσῳ
  choice: katikati ya ... na katikati ya
  rationale: Inahifadhi urudiaji wa maneno ya mahali katika Kigiriki na mpangilio wa mandhari ya maono.
- source_word: ζῴων
  choice: viumbe hai
  rationale: Katika Ufunuo neno hili linawataja viumbe wa mbinguni wanaokizunguka kiti cha enzi, si wanyama wa kawaida.
- source_word: πρεσβυτέρων
  choice: wazee
  rationale: Ni jina la kundi linalotambulika katika mandhari ya mbinguni, na 'wazee' ni tafsiri ya kawaida na ya asili.
- source_word: ἀρνίον
  choice: Mwana-kondoo
  rationale: Inahifadhi taswira ya dhabihu na ya Kimasihi bila kuifanya isikike kuwa duni; herufi kubwa inaonyesha kuwa hapa ni cheo cha mhusika maalumu.
- source_word: ἑστηκὸς
  choice: amesimama
  rationale: Kauli timilifu ya Kigiriki humwonyesha Mwana-kondoo akiwa katika hali ya kusimama; 'amesimama' ni ya asili na hudumisha hali hiyo.
- source_word: ὡς ἐσφαγμένον
  choice: kana kwamba alikuwa amechinjwa
  rationale: Inahifadhi maana ya mwonekano au ulinganisho katika ὡς na hali ya kitendo kilichokamilika yenye matokeo yanayoendelea.
- source_word: ἐσφαγμένον
  choice: amechinjwa
  rationale: '''Kuchinjwa'' hudumisha ukali wa kifo na mwangwi wa dhabihu ulio katika σφάζω kuliko neno la jumla ''kuuawa.'''
- source_word: ἔχων κέρατα ἑπτὰ
  choice: akiwa na pembe saba
  rationale: Inahifadhi pembe kuwa taswira halisi ya kiapokaliptiki bila kutafsiri moja kwa moja maana yake ya kiishara.
- source_word: ὀφθαλμοὺς ἑπτά
  choice: macho saba
  rationale: Tafsiri ya moja kwa moja inafaa kwa kuwa sentensi inayofuata ndiyo inayotoa utambulisho wa kiishara.
- source_word: οἵ εἰσιν
  choice: Macho hayo ndiyo
  rationale: Inafanya wazi kwa Kiswahili rejeo linalowezekana zaidi la kiwakilishi, yaani 'macho saba,' bila kuongeza ufafanuzi wa kiteolojia.
- source_word: τὰ ἑπτὰ πνεύματα τοῦ θεοῦ
  choice: roho saba za Mungu
  rationale: Inahifadhi umbo la wingi la Kigiriki na kutolifupisha kuwa 'Roho wa Mungu katika utimilifu wa namna saba.' Kiswahili hakitumii tofauti ya herufi kubwa na ndogo katikati ya sentensi kuamua maana ya neno hili.
- source_word: ἀπεσταλμένοι
  choice: zilizotumwa
  rationale: Inahifadhi kauli tendwa na wingi unaopatana na 'roho saba'; 'kutumwa' ni ya kawaida na sahihi hapa.
- source_word: εἰς πᾶσαν τὴν γῆν
  choice: katika dunia yote
  rationale: Huwasilisha upeo wa utume katika γῆ, hapa ukieleweka kwa kawaida kuwa dunia yote.
theological_decisions:
- issue: Rejeo la maneno 'ambazo ndizo roho saba za Mungu'
  choice: Kishazi kimetafsiriwa kikiyatambulisha macho saba na roho saba za Mungu.
  alternative: Kishazi kinaweza kueleweka kwa upana kuwa kinarejelea pembe na macho kwa pamoja.
  rationale: Rejeo la karibu zaidi na lenye mshikamano wa taswira ni 'macho saba.' Tafsiri inalifanya hilo lisomeke kwa uwazi wa kawaida wa Kiswahili bila kuongeza ufafanuzi wa mafundisho.
- issue: Maana ya 'roho saba za Mungu'
  choice: Usemi wa wingi 'roho saba za Mungu' umehifadhiwa kama ulivyo katika maandishi.
  alternative: Roho wa Mungu katika utimilifu wa namna saba.
  rationale: Utambulisho kamili wa usemi huu unajadiliwa. Maandishi yenyewe yanasema 'roho saba za Mungu,' hivyo tafsiri haipaswi kugeuza taswira hiyo kimya kimya kuwa ufafanuzi wa kiteolojia.
- issue: Kitendawili cha Mwana-kondoo aliyesimama lakini aliyechinjwa
  choice: Amesimama kana kwamba alikuwa amechinjwa.
  alternative: Amesimama akiwa amechinjwa.
  rationale: Tafsiri inahifadhi kwa pamoja hali ya kuwa hai na kusimama, mwonekano wa kuchinjwa, na alama ya ulinganisho iliyo katika ὡς.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Urudiaji wa 'katikati ya' umehifadhiwa kwa sababu ni sehemu ya muundo wa maono. 'Mwana-kondoo' limetumiwa kama jina la cheo, na 'viumbe hai' huepuka kuwafanya viumbe wa kiti cha enzi waonekane kuwa wanyama wa kawaida.
