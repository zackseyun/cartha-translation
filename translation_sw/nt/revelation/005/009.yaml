id: REV.5.9
reference: Revelation 5:9
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ᾄδουσιν ᾠδὴν καινὴν λέγοντες· Ἄξιος εἶ λαβεῖν τὸ βιβλίον καὶ ἀνοῖξαι τὰς σφραγῖδας αὐτοῦ, ὅτι ἐσφάγης καὶ ἠγόρασας τῷ ⸀θεῷ ἐν τῷ αἵματί σου ἐκ πάσης φυλῆς καὶ γλώσσης καὶ λαοῦ καὶ ἔθνους,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/009.yaml
  text: And they sing a new song[a], saying, “You are worthy to take the scroll and to open its seals, because you were slain[c][b], and by your blood you purchased for God people from every tribe and language and people and nation,”
translation:
  language: sw
  text: 'Nao wanaimba wimbo mpya wakisema,


    “Unastahili kutwaa gombo

    na kufungua mihuri yake,

    kwa sababu ulichinjwa,

    na kwa damu yako ukamnunulia Mungu watu[a]

    kutoka katika kila kabila, lugha, jamaa na taifa.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno “watu” halitajwi wazi katika Kigiriki, bali linadokezwa na muktadha.
    reason: textual_clarity
lexical_decisions:
- source_word: ᾄδουσιν
  choice: wanaimba
  rationale: Kauli ya wakati uliopo imetafsiriwa kwa wakati uliopo wa Kiswahili, unaofaa katika simulizi hili lenye uhai; hakuna sababu ya kuongeza maana ya ‘kusifu’ ambayo haimo wazi katika kitenzi.
- source_word: ᾠδὴν καινὴν
  choice: wimbo mpya
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja inayohifadhi dhana ya kibiblia ya wimbo mpya.
- source_word: Ἄξιος εἶ
  choice: Unastahili
  rationale: Ni Kiswahili cha sasa, cha heshima na cha kawaida kwa tamko la moja kwa moja la kustahili.
- source_word: τὸ βιβλίον
  choice: kitabu cha kukunjwa
  rationale: Katika muktadha huu βιβλίον ni hati iliyokunjwa na kutiwa mihuri. Usemi huu unaeleza umbo la kitu cha kale bila kukifanya kuwa kitabu cha kurasa za kisasa.
- source_word: ἀνοῖξαι τὰς σφραγῖδας αὐτοῦ
  choice: kufungua mihuri yake
  rationale: Huhifadhi usemi wa Kigiriki ‘kufungua mihuri yake.’ ‘Kuvunja mihuri’ ingekuwa ufafanuzi unaowezekana lakini ungeongeza kitendo kisichotajwa moja kwa moja.
- source_word: ἐσφάγης
  choice: ulichinjwa
  rationale: ‘Kuchinjwa’ huhifadhi kwa pamoja ukali wa kuuawa na mwangwi wa dhabihu uliomo katika σφάζω.
- source_word: ἠγόρασας
  choice: ukamnunulia
  rationale: Kitenzi cha Kiswahili chenye kiambishi cha utendea kinahifadhi maana kuu ya kibiashara ya ‘kununua’ na kumtaja Mungu kama anayenufaika au anayepokea, bila kubadilisha neno kuwa istilahi ya kitheolojia kama ‘kukomboa.’
- source_word: τῷ θεῷ
  choice: Mungu
  rationale: Katika ‘ukamnunulia Mungu,’ muundo wa utendea unaonyesha kwamba ununuzi ulifanywa kwa ajili ya Mungu au ili watu wawe wake; hii ni njia ya kawaida ya Kiswahili ya kuwakilisha dativu ya Kigiriki hapa.
- source_word: ἐν τῷ αἵματί σου
  choice: kwa damu yako
  rationale: ‘Kwa’ huonyesha damu kuwa njia au gharama ya ununuzi kwa Kiswahili cha kawaida huku ikihifadhi taswira halisi ya damu.
- source_word: ἐκ πάσης φυλῆς καὶ γλώσσης καὶ λαοῦ καὶ ἔθνους
  choice: kutoka katika kila kabila, lugha, jamaa na taifa
  rationale: Huhifadhi orodha ya vipengele vinne na upeo wake wa ulimwengu mzima. ‘Jamaa’ hapa hutofautisha λαός na ‘kabila’ pamoja na ‘taifa’ bila kurudia tu neno ‘watu,’ ambalo tayari limetumiwa kama yambwa inayodokezwa.
theological_decisions:
- issue: Yambwa ya ἠγόρασας haikutajwa wazi katika maandishi ya Kigiriki
  choice: 'Kuongeza ‘watu’ kama yambwa inayodokezwa: ‘ukamnunulia Mungu watu’'
  alternative: 'Kuacha yambwa bila kutajwa: ‘ukamnunulia Mungu kutoka katika kila kabila...’'
  rationale: Kigiriki kinaweza kuacha yambwa idokezwe, lakini Kiswahili hicho kingekuwa kigumu na kingeweza kueleweka kana kwamba makabila yenyewe ndiyo yanayonunuliwa. ‘Watu’ hufanya maana ya muktadha iwe wazi bila kubainisha idadi au kundi kwa namna finyu kuliko maandishi.
- issue: Lugha ya upatanisho katika ἐν τῷ αἵματί σου
  choice: Kuhifadhi ‘kwa damu yako’
  alternative: Kufafanua kuwa ‘kwa kifo chako’
  rationale: Andiko lenyewe linataja damu ya Mwana-Kondoo kuwa njia au gharama ya ununuzi. Tafsiri haibadili taswira hiyo kuwa fomula pana ya kimafundisho.
- issue: Dativu τῷ θεῷ
  choice: Kuitafsiri kwa muundo wa utendea ‘ukamnunulia Mungu’
  alternative: ‘ukawanunua watu kwa ajili ya Mungu’
  rationale: Chaguo kuu ni la asili zaidi katika Kiswahili na linaacha wazi uhusiano wa kunufaika au kupokea uliomo katika dativu, badala ya kuamua zaidi ya ilivyo lazima.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa heshima na unaosomeka kwa sauti. Mpangilio wa kishairi umehifadhiwa ili kuonyesha kwamba maneno haya ni wimbo. ‘Kitabu cha kukunjwa’ kinaeleweka zaidi kuliko istilahi ya kitaalamu, na ‘ulichinjwa’ huhifadhi uzito wa taswira ya Mwana-Kondoo.
