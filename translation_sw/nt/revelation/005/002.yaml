  text: καὶ εἶδον ἄγγελον ἰσχυρὸν κηρύσσοντα ἐν φωνῇ μεγάλῃ· Τίς ⸀ἄξιος ἀνοῖξαι τὸ βιβλίον καὶ λῦσαι τὰς σφραγῖδας αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/002.yaml
  text: And I saw a mighty angel proclaiming with a loud voice[a], “Who is worthy to open the scroll and break its seals?”
translation:
  language: sw
  text: Nami nikamwona malaika mwenye nguvu akitangaza kwa sauti kubwa, “Ni nani anayestahili kulifungua gombo[a] na kuzivunja mihuri yake?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kitabu.” Neno la Kigiriki βιβλίον linaweza kumaanisha hati iliyoandikwa kwa ujumla, lakini hapa “gombo” linafaa zaidi kwa kitu kilichofungwa kwa mihuri mingi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄγγελον ἰσχυρόν
  choice: malaika mwenye nguvu
  rationale: ἰσχυρός huonyesha nguvu au uwezo. ‘Mwenye nguvu’ ni Kiswahili cha kawaida na chenye heshima, bila kuongeza wazo lisilokuwamo katika chanzo.
- source_word: κηρύσσοντα
  choice: akitangaza
  rationale: κηρύσσω humaanisha kutangaza hadharani kama mjumbe. ‘Akitangaza’ linafaa kwa tangazo hili kuu kuliko ‘akihubiri.’
- source_word: ἐν φωνῇ μεγάλῃ
  choice: kwa sauti kubwa
  rationale: Hii ni nahau ya kusema kwa sauti yenye nguvu na inayosikika wazi; ‘kwa sauti kubwa’ ni usemi wa asili katika Kiswahili.
- source_word: Τίς ἄξιος
  choice: Ni nani anayestahili
  rationale: ἄξιος hapa huhusu kustahili au kufaa kutekeleza jukumu hili zito. ‘Anayestahili’ huhifadhi uzito wa maana bila kulifafanua kupita kiasi.
- source_word: ἀνοῖξαι τὸ βιβλίον
  choice: kukifungua kitabu cha kukunjwa
  rationale: βιβλίον ni hati iliyoandikwa na katika taswira hii yenye mihuri mingi inaeleweka vizuri kama kitu cha kukunjwa. ‘Kitabu cha kukunjwa’ ni wazi kwa wasomaji wa Kiswahili kuliko kuazima neno lisilo la kawaida.
- source_word: λῦσαι τὰς σφραγῖδας αὐτοῦ
  choice: na kuzivunja mihuri yake
  rationale: λύω kimsingi ni kufungua, kulegeza, au kuondoa kifungo. Kwa mihuri, ‘kuzivunja’ hutoa picha halisi ya kuondoa vizuizi ili hati ifunguliwe.
theological_decisions:
- issue: Maana ya βιβλίον katika maono ya chumba cha enzi
  choice: kitabu cha kukunjwa
  alternative: kitabu; hati
  rationale: Hali ya kitu kilichofungwa kwa mihuri mingi katika mazingira ya karne ya kwanza inaelekea kuonyesha hati ya kukunjwa. Huu ni uamuzi wa kileksika na kihistoria, si ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na kinachoeleweka kwa urahisi. Muundo ‘Kisha nikamwona’ unaendeleza simulizi kwa kawaida; ‘malaika mwenye nguvu’ huepuka usemi mzito au wa kizamani. Hakuna tanbihi iliyohitajika kwa kuwa ‘kitabu cha kukunjwa’ huweka maana muhimu moja kwa moja katika matini.
