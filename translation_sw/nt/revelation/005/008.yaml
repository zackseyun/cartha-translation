id: REV.5.8
reference: Revelation 5:8
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ὅτε ἔλαβεν τὸ βιβλίον, τὰ τέσσαρα ζῷα καὶ οἱ εἴκοσι τέσσαρες πρεσβύτεροι ἔπεσαν ἐνώπιον τοῦ ἀρνίου, ἔχοντες ἕκαστος κιθάραν καὶ φιάλας χρυσᾶς γεμούσας θυμιαμάτων, αἵ εἰσιν ⸀αἱ προσευχαὶ τῶν ἁγίων·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/008.yaml
  text: And when he took the scroll[a], the four living creatures and the twenty-four elders fell down before the Lamb, each holding a harp and golden bowls full of incense[b], which are the prayers of the saints.
translation:
  language: sw
  text: Naye alipokitwaa kile kitabu cha kukunjwa, wale viumbe hai wanne na wale wazee ishirini na wanne wakaanguka mbele ya Mwanakondoo. Kila mmoja alikuwa na kinubi[a] na mabakuli ya dhahabu yaliyojaa uvumba; hayo ni sala za watakatifu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, zeze.
    reason: lexical_alternative
  - marker: b
    text: Au, watu watakatifu.
    reason: lexical_alternative
lexical_decisions:
- source_word: βιβλίον
  choice: kitabu cha kukunjwa
  rationale: Katika mandhari ya Ufunuo, neno hili linamaanisha maandishi ya kale yaliyokunjwa. Usemi huu ni wazi kwa msomaji wa kawaida na unaepuka picha ya kitabu cha kisasa chenye kurasa zilizofungwa pamoja.
- source_word: ζῷα
  choice: viumbe hai
  rationale: Hawa ni viumbe wa mbinguni wanaokizunguka kiti cha enzi, si wanyama kwa maana ya kudhalilisha. Tafsiri hii huhifadhi uhai na hadhi yao.
- source_word: πρεσβύτεροι
  choice: wazee
  rationale: Neno hili linawataja wale wazee ishirini na wanne wa mbinguni bila kuingiza cheo maalumu cha baadaye cha kikanisa.
- source_word: ἐνώπιον
  choice: mbele ya
  rationale: Ni usemi wa kawaida unaoonyesha mahali walipo na pia hali ya kumwabudu Mwanakondoo.
- source_word: ἀρνίου
  choice: Mwanakondoo
  rationale: Hili ni jina la kimasiha la Yesu katika Ufunuo; herufi kubwa inaonyesha matumizi yake kama cheo huku maana ya kondoo wa dhabihu ikihifadhiwa.
- source_word: ἔχοντες ἕκαστος
  choice: Kila mmoja alikuwa na
  rationale: Huhifadhi nguvu ya mgawanyo ya ἕκαστος na ni Kiswahili cha kawaida. Muundo wa Kigiriki unaweza kuhusishwa kwa jumla na viumbe hai na wazee, hivyo tafsiri haubani rejeo kwa wazee pekee.
- source_word: κιθάραν
  choice: kinubi
  rationale: κιθάρα ni ala ya nyuzi. “Kinubi” ni jina linalotambulika katika Kiswahili cha Biblia, huku “zeze” likitajwa kama mbadala unaowezekana.
- source_word: φιάλας χρυσᾶς
  choice: mabakuli ya dhahabu
  rationale: φιάλη ni bakuli au chombo kipana na kifupi, si chupa ndogo. “Mabakuli” ni wazi na yanafaa kwa vyombo vilivyojaa uvumba.
- source_word: γεμούσας θυμιαμάτων
  choice: yaliyojaa uvumba
  rationale: θυμίαμα humaanisha uvumba unaofukizwa. Kiswahili hutumia “uvumba” kama nomino ya jumla kwa wingi wa Kigiriki.
- source_word: αἵ εἰσιν αἱ προσευχαὶ τῶν ἁγίων
  choice: hayo ni sala za watakatifu
  rationale: Kiwakilishi cha Kigiriki αἵ ni cha kike na cha wingi, kikirejelea mabakuli (φιάλας). “Hayo” huhifadhi rejeo hilo na kauli ya moja kwa moja ya utambulisho, bila kuibadilisha kuwa “yanawakilisha.” “Watakatifu” hapa ni watu wa Mungu waliowekwa wakfu.
theological_decisions:
- issue: Utambulisho wa kiishara kati ya mabakuli yenye uvumba na sala
  choice: hayo ni sala za watakatifu
  alternative: hayo yanawakilisha sala za watakatifu
  rationale: Kigiriki kinatumia kauli ya moja kwa moja αἵ εἰσιν (“hayo ni”). Tafsiri inahifadhi mkazo huo wa lugha ya kiufunuo badala ya kuudhoofisha kwa maelezo ya kifasiri.
- issue: Maana ya ἅγιοι
  choice: watakatifu
  alternative: watu watakatifu
  rationale: “Watakatifu” ni tafsiri sahihi na iliyozoeleka kwa watu wa Mungu waliowekwa wakfu; hapa haimaanishi tu watu waliotangazwa rasmi kuwa watakatifu katika mapokeo fulani.
- issue: Rejeo la kisarufi la αἵ
  choice: “hayo” linarejelea mabakuli ya dhahabu yaliyojaa uvumba
  alternative: “ambao” linarejelea uvumba
  rationale: Ingawa uvumba ndio picha inayohusishwa kwa karibu na sala, jinsia na idadi ya αἵ katika Kigiriki vinapatana na φιάλας (“mabakuli”), si θυμιαμάτων (“uvumba”). Tafsiri huhifadhi ushahidi huu wa kisarufi na mvutano wa picha badala ya kuusawazisha kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya ibada bila kuwa kigumu. “Kitabu cha kukunjwa” kinaeleweka kwa urahisi kuliko istilahi fupi isiyozoeleka, na “kinubi” hudumisha msamiati wa heshima unaofahamika katika mazingira ya Biblia. Alama za tanbihi zimewekwa baada ya maneno yanayohusika moja kwa moja.
