  text: Καὶ εἶδον ἐπὶ τὴν δεξιὰν τοῦ καθημένου ἐπὶ τοῦ θρόνου βιβλίον γεγραμμένον ἔσωθεν καὶ ⸀ὄπισθεν, κατεσφραγισμένον σφραγῖσιν ἑπτά.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/001.yaml
  text: And I saw in the right hand of the one seated on the throne a scroll written within and on the back[b][a], sealed with seven seals.
translation:
  language: sw
  text: Nami nikaona katika mkono wa kuume wa yule aliyeketi juu ya kiti cha enzi gombo[b] lililoandikwa kwa ndani na upande wa nyuma[a], likiwa limetiwa mihuri saba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “lililoandikwa kwa ndani na upande wa nyuma.” Baadhi ya tafsiri husema kwa ujumla zaidi, “ndani na nje.”
    reason: lexical_alternative
  - marker: b
    text: Neno la Kigiriki βιβλίον laweza pia kutafsiriwa “kitabu,” lakini katika muktadha huu yaelekea kuwa gombo.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδον
  choice: nikaona
  rationale: Wakati uliopita wa kisimulizi unaendelezwa kwa kiunganishi cha Kiswahili “Kisha” na kitenzi “nikaona,” kwa mtindo wa kawaida wa simulizi.
- source_word: ἐπὶ τὴν δεξιὰν
  choice: katika mkono wa kuume
  rationale: Ingawa ἐπί inaweza kumaanisha “juu ya,” hapa usemi unaonyesha mahali au umiliki katika mkono; “katika mkono wa kuume” ni wa asili na wazi kwa Kiswahili sanifu.
- source_word: τοῦ καθημένου ἐπὶ τοῦ θρόνου
  choice: wa yule aliyeketi juu ya kiti cha enzi
  rationale: Huhifadhi maelezo ya mhusika bila kumtaja moja kwa moja wala kuingiza utambulisho wa kitheolojia usiotajwa katika aya.
- source_word: βιβλίον
  choice: gombo
  rationale: Katika mazingira haya, neno hilo linaelekea kumaanisha hati iliyokunjwa kuliko kitabu cha kurasa; taswira ya kuandikwa pande mbili na kutiwa mihuri inaunga mkono “gombo.”
- source_word: γεγραμμένον
  choice: lililoandikwa
  rationale: Huwakilisha hali iliyotokana na tendo lililokamilika la kuandika kwa namna ya kawaida katika Kiswahili.
- source_word: ἔσωθεν καὶ ὄπισθεν
  choice: ndani na upande wa nyuma
  rationale: Huhifadhi taswira halisi ya maandishi yaliyokuwa ndani na kwenye upande wa nyuma wa gombo, bila kugeuza ὄπισθεν kwa ujumla kuwa “nje.”
- source_word: κατεσφραγισμένον
  choice: likiwa limetiwa mihuri
  rationale: Huonyesha hali iliyokamilika ya kufungwa kwa mihuri, kwa Kiswahili cha sasa na kinachoeleweka.
- source_word: σφραγῖσιν ἑπτά
  choice: mihuri saba
  rationale: Huwasilisha idadi na chombo cha kufungia kwa ufupi; kitenzi “limetiwa” hufanya uhusiano huo uwe wazi.
theological_decisions:
- issue: Utambulisho wa aliyeketi kwenye kiti cha enzi
  choice: yule aliyeketi juu ya kiti cha enzi
  alternative: Mungu aliyeketi juu ya kiti cha enzi
  rationale: Kigiriki kinamweleza mhusika bila kutumia jina la Mungu katika aya hii; tafsiri inadumisha namna hiyo ya kifasihi na haiongezi utambulisho ambao haukutajwa wazi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya kifasihi lakini kinachoeleweka kwa wasomaji wa kawaida. “Kiti cha enzi,” “gombo,” na “mihuri” hudumisha taswira ya kifalme na ya hati ya kale. Alama zote za tanbihi zimewekwa katika matini kuu.
