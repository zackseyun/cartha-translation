  yaml_path: translation/nt/revelation/005/004.yaml
  text: And I was weeping greatly because no one was found worthy to open the scroll or to look into it.
translation:
  language: sw
  text: Nami nilikuwa nikilia sana kwa sababu hakuna mtu aliyepatikana kuwa anastahili kulifungua gombo[a] wala kulitazama[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kitabu.” Neno la Kigiriki βιβλίον linaweza kumaanisha kitabu au gombo; katika muktadha huu, taswira ya kulifungua inaunga mkono “gombo.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kuangalia ndani yake.” Maneno hayo yanaweza kumaanisha kulitazama tu, lakini katika muktadha yanaweza pia kudokeza kuona yaliyomo.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἐγώ
  choice: Nami
  rationale: Inaendeleza simulizi huku ikidumisha msisitizo wa kiwakilishi ἐγώ kwa Kiswahili cha kawaida.
- source_word: ἔκλαιον
  choice: nililia
  rationale: Wakati usiotimilika unaonyesha tendo lililokuwa likiendelea; katika Kiswahili, muundo huu pamoja na kielezi 'sana' huwasilisha hali hiyo kwa kawaida bila kuongeza kwamba kilio kilianza wakati huo.
- source_word: πολὺ
  choice: sana
  rationale: Ni kielezi cha kawaida kinachoongeza nguvu ya kulia bila kuongeza maana ya kulia kwa sauti au kwa uchungu, ambazo hazijaelezwa wazi.
- source_word: οὐδεὶς
  choice: hakuna yeyote
  rationale: Huwasilisha ukosefu wa mtu hata mmoja mwenye ustahili unaotakiwa.
- source_word: ἄξιος
  choice: anastahili
  rationale: Hudumisha uzito wa kustahili mbele za Mungu, badala ya kupunguza maana kuwa uwezo au sifa za kiutendaji tu.
- source_word: εὑρέθη
  choice: aliyepatikana kuwa
  rationale: Huhifadhi hali ya kutendwa ya kitenzi bila kubainisha ni nani aliyefanya utafutaji.
- source_word: ἀνοῖξαι
  choice: kukifungua
  rationale: Ni tafsiri ya moja kwa moja ya tendo ambalo linahitaji ustahili.
- source_word: τὸ βιβλίον
  choice: kile kitabu cha kukunjwa
  rationale: Katika mazingira haya βιβλίον ni hati iliyokunjwa; 'kitabu cha kukunjwa' ni Kiswahili kinachoeleweka na kinafaa kwa taswira ya kufunguliwa.
- source_word: οὔτε βλέπειν αὐτό
  choice: wala kukitazama
  rationale: Huhifadhi uratibu hasi wa οὔτε na maana ya msingi ya βλέπειν bila kulazimisha wazo la kuchunguza yaliyomo, ingawa muktadha unaweza kulidokeza.
- source_word: ὅτι
  choice: kwa sababu
  rationale: Huonyesha wazi sababu ya Yohana kulia.
theological_decisions:
- issue: Maana ya ἄξιος katika mandhari ya kiti cha enzi
  choice: anastahili
  alternative: anafaa; ana sifa zinazohitajika
  rationale: 'Muktadha unahusu zaidi ya uwezo wa kiutendaji: ni ustahili wa kutekeleza kusudi la Mungu. ''Anastahili'' huhifadhi uzito huo bila kufafanua teolojia zaidi ya andiko.'
- issue: Aina ya βιβλίον katika Ufunuo 5
  choice: kitabu cha kukunjwa
  alternative: kitabu; hati ya kukunjwa
  rationale: Taswira ya kale na tendo la kukifungua vinaonyesha hati iliyokunjwa, si lazima kitabu cha kurasa za mtindo wa kisasa.
- issue: Upeo wa βλέπειν αὐτό
  choice: kukitazama
  alternative: kuangalia ndani yake
  rationale: Maana ya msingi ni kukitazama; muktadha unaweza kuhusisha kuona yaliyomo, lakini tafsiri kuu haipaswi kuondoa utata huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imeundwa kwa urahisi wa kusomeka kwa sauti; 'Nami' ni ya kawaida katika simulizi la kibiblia bila kuwa ya kizamani kupita kiasi.
