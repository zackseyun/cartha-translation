  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ εἷς ἐκ τῶν πρεσβυτέρων λέγει μοι· Μὴ κλαῖε· ἰδοὺ ἐνίκησεν ὁ λέων ὁ ἐκ τῆς φυλῆς Ἰούδα, ἡ ῥίζα Δαυίδ, ⸀ἀνοῖξαι τὸ βιβλίον καὶ τὰς ἑπτὰ σφραγῖδας αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/005.yaml
  text: And one of the elders says to me[a], “Do not weep. Behold, the Lion from the tribe of Judah, the Root of David, has conquered[c][b], to open the scroll and its seven seals.”
translation:
  language: sw
  text: Kisha mmoja wa wale wazee akaniambia, “Usilie. Tazama, Simba kutoka kabila la Yuda, Mzizi wa Daudi, ameshinda ili kulifungua gombo na mihuri yake saba.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρεσβυτέρων
  choice: wazee
  rationale: Katika Ufunuo neno hili ni jina la kundi maalumu la mbinguni, si maelezo ya umri tu.
- source_word: λέγει μοι
  choice: akaniambia
  rationale: Ingawa Kigiriki kina wakati wa sasa wa kisimulizi, wakati uliopita wa kisimulizi ni wa kawaida na wenye ufasaha zaidi katika Kiswahili bila kubadili maana.
- source_word: Μὴ κλαῖε
  choice: Usilie
  rationale: Ni kauli ya kawaida, ya moja kwa moja, na yenye uzito unaofaa kwa κλαίω.
- source_word: ἰδοὺ
  choice: Tazama
  rationale: Huhifadhi nguvu ya kiashiria kinachovuta usikivu kwa lugha ya heshima na inayoeleweka.
- source_word: ἐνίκησεν
  choice: ameshinda
  rationale: Huhifadhi wazo kuu la ushindi katika Ufunuo na hali ya tendo lililokamilika lenye matokeo ya sasa.
- source_word: ὁ λέων ὁ ἐκ τῆς φυλῆς Ἰούδα
  choice: Simba kutoka kabila la Yuda
  rationale: Neno “kutoka” linaakisi ἐκ na kutambulisha asili au uhusiano wake na kabila la Yuda.
- source_word: ἡ ῥίζα Δαυίδ
  choice: Shina la Daudi
  rationale: “Shina” ni taswira ya kimasiya inayoeleweka katika Kiswahili na inaweza kumaanisha chimbuko au chipukizi la ukoo; herufi kubwa inaonyesha matumizi yake kama cheo.
- source_word: ἀνοῖξαι
  choice: ili kukifungua
  rationale: Infinitivu inaunganishwa na ushindi kama kusudi au matokeo; “ili” ni ya asili katika Kiswahili huku ikiacha uhusiano huo bila kuongeza wazi uwezo au ustahili.
- source_word: τὸ βιβλίον
  choice: kitabu cha kukunjwa
  rationale: Hutambulisha kwa usahihi maandishi ya umbo la gombo bila kutumia neno lisilo la kawaida kwa wasomaji wengi.
- source_word: σφραγῖδας αὐτοῦ
  choice: mihuri yake
  rationale: “Mihuri” ni istilahi ya kawaida kwa vifungo vinavyokifunga kitabu hicho, na “yake” hurejelea kitabu cha kukunjwa.
theological_decisions:
- issue: Vyeo vya Kimasihi vinavyomhusu Yesu
  choice: 'Kuhifadhi vyeo vyote viwili: “Simba kutoka kabila la Yuda, Shina la Daudi.”'
  alternative: Kuvifafanua kwa maneno ya ziada au kupunguza kimoja kuwa maelezo ya kawaida.
  rationale: Kigiriki kinakusanya kwa makusudi picha mbili za kifalme na za Kimasihi kutoka Maandiko ya Israeli; kuzihifadhi moja kwa moja hudumisha uzito wake bila kuongeza fundisho lisilotajwa.
- issue: Nguvu ya ἀνοῖξαι baada ya ἐνίκησεν
  choice: “ameshinda ili kukifungua”
  alternative: “ameshinda na anaweza kukifungua” au “ameshinda, akakifungua.”
  rationale: “Ili” huhifadhi uwezekano wa kusudi au matokeo katika infinitivu na kuunganisha ushindi na kufunguliwa kwa kitabu bila kuongeza wazi wazo la uwezo au ustahili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. “Kitabu cha kukunjwa” kimetumiwa badala ya “kitabu” pekee ili kuonyesha umbo la kale la maandishi. Muundo wa Kigiriki unaanza kwa kiunganishi; “Kisha” hutoa mwendelezo wa kisimulizi kwa Kiswahili cha asili.
