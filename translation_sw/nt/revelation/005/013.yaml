id: REV.5.13
reference: Revelation 5:13
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ πᾶν κτίσμα ὃ ἐν τῷ οὐρανῷ καὶ ἐπὶ τῆς γῆς καὶ ὑποκάτω τῆς γῆς καὶ ἐπὶ τῆς ⸀θαλάσσης, καὶ τὰ ἐν αὐτοῖς ⸀πάντα, ἤκουσα λέγοντας· Τῷ καθημένῳ ἐπὶ ⸂τῷ θρόνῳ⸃ καὶ τῷ ἀρνίῳ ἡ εὐλογία καὶ ἡ τιμὴ καὶ ἡ δόξα καὶ τὸ κράτος εἰς τοὺς αἰῶνας τῶν ⸀αἰώνων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/013.yaml
  text: And I heard every creature in heaven and on the earth and under the earth and on the sea[a], and all that is in them, saying[b], “To the one seated on the throne and to the Lamb be blessing and honor and glory and dominion forever and ever.”
translation:
  language: sw
  text: Nami nikasikia kila kiumbe[a] kilicho mbinguni, duniani, chini ya dunia na baharini, pamoja na vyote vilivyomo humo, kikisema, “Baraka, heshima, utukufu na uweza viwe kwa yeye aliyeketi juu ya kiti cha enzi na kwa Mwana-Kondoo, milele na milele.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kila kitu kilichoumbwa.”
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “kwa enzi za enzi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν κτίσμα
  choice: kila kiumbe
  rationale: Huhifadhi maana ya distributive ya πᾶν na wazo la kiumbe kilichoumbwa; pia inafaa kwa viumbe vinavyosikika vikitoa sifa.
- source_word: ὃ ἐν τῷ οὐρανῷ ... καὶ τὰ ἐν αὐτοῖς πάντα
  choice: kilicho mbinguni, duniani, chini ya dunia na baharini, pamoja na vyote vilivyomo humo
  rationale: Orodha hii inaonyesha uumbaji wote kwa kutaja maeneo yake mbalimbali. “Humo” hurejelea kwa kawaida maeneo yote yaliyotajwa bila kuongeza ufafanuzi usiomo katika matini.
- source_word: ἤκουσα λέγοντας
  choice: nikasikia ... kikisema
  rationale: Kiswahili cha kawaida kinaweza kuoanisha kitenzi na nomino ya umoja “kila kiumbe,” huku maana ikiendelea kujumuisha viumbe vyote.
- source_word: Τῷ καθημένῳ ἐπὶ τῷ θρόνῳ
  choice: kwa yeye aliyeketi juu ya kiti cha enzi
  rationale: Hutoa kwa uwazi maana ya kirai nomino chenye participio na kudumisha taswira ya kifalme ya Ufunuo.
- source_word: τῷ ἀρνίῳ
  choice: kwa Mwana-Kondoo
  rationale: “Mwana-Kondoo” ni jina la kimasiha lililozoeleka katika Ufunuo na huhifadhi taswira yake ya dhabihu na utukufu.
- source_word: ἡ εὐλογία
  choice: baraka
  rationale: Katika tamko la ibada, “baraka” ni ulinganifu wa moja kwa moja na unaoeleweka wa εὐλογία.
- source_word: ἡ τιμή
  choice: heshima
  rationale: “Heshima” hueleza kwa kawaida thamani na staha inayotolewa katika sifa.
- source_word: ἡ δόξα
  choice: utukufu
  rationale: “Utukufu” ni neno la kawaida na lenye uzito unaofaa kwa δόξα katika mazingira ya ibada.
- source_word: τὸ κράτος
  choice: uweza
  rationale: κράτος huonyesha nguvu yenye kutenda au kutawala. “Uweza” huhifadhi maana hiyo kwa lugha fupi, yenye hadhi, bila kuibana kuwa mamlaka ya kisheria pekee.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: milele na milele
  rationale: Ni nahau ya asili ya Kiswahili inayoeleza muda usio na mwisho; maana halisi zaidi imeonyeshwa katika tanbihi.
theological_decisions:
- issue: Tamko moja la sifa linaelekezwa kwa Mungu na kwa Mwana-Kondoo pamoja
  choice: “viwe kwa yeye aliyeketi juu ya kiti cha enzi na kwa Mwana-Kondoo”
  alternative: Kutenganisha tamko hilo na kurudia kitenzi kwa kila mmoja
  rationale: Kigiriki kinaelekeza sifa zilezile kwa wote wawili katika tamko moja. Tafsiri inadumisha muundo huo bila kuongeza maelezo ya kidhehebu.
- issue: Rejeleo la κτίσμα katika tukio la sifa za ulimwengu wote
  choice: “kila kiumbe”
  alternative: “kila kitu kilichoumbwa” au “uumbaji wote”
  rationale: Muktadha unaonyesha wanaotoa sifa kwa sauti; “kila kiumbe” huhifadhi upeo wa wote na pia tendo lao la kusema.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kiibada bila kuwa cha kizamani. Muundo wa orodha na tamko la pamoja umehifadhiwa, huku upatanisho wa kisarufi wa “kila kiumbe ... kikisema” ukifanya sentensi isomeke kwa kawaida.
