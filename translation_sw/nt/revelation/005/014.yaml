base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/014.yaml
  text: And the four living creatures were saying[a], “Amen.” And the elders fell down and worshiped.
translation:
  language: sw
  text: Na viumbe hai vinne vilikuwa vikisema, “Amina.” Nao wazee wakaanguka na kuabudu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati zinaongeza baada ya “kuabudu” maneno yanayomtaja wazi anayeabudiwa, kama vile “Yeye aliye hai milele na milele” au “yeye.” Maandishi makuu yanafuata usomaji mfupi wa SBLGNT, ambao unamwacha anayeabudiwa aeleweke kutokana na muktadha.
    reason: textual_variant
lexical_decisions:
- source_word: ζῷα
  choice: viumbe hai
  rationale: Katika Ufunuo neno hili linawataja viumbe wa mbinguni wanaokizunguka kiti cha enzi, si wanyama wa kawaida; pia linadumisha uhusiano na maono ya kiti cha enzi katika Ezekieli.
- source_word: ἔλεγον
  choice: walikuwa wakisema
  rationale: Kauli ya wakati usiotimilika inadokeza tendo lililokuwa likiendelea au kurudiwa; tafsiri hii inadumisha hali hiyo kwa Kiswahili cha kawaida.
- source_word: Ἀμήν
  choice: Amina
  rationale: Hili ni tamko la ibada linalotambulika katika Kiswahili; linahifadhi umbo na matumizi yake ya kiliturujia.
- source_word: πρεσβύτεροι
  choice: wazee
  rationale: Katika Ufunuo ni jina la kundi maalumu la mbinguni, si maelezo tu ya umri.
- source_word: ἔπεσαν
  choice: wakaanguka chini
  rationale: Maneno haya yanaonyesha tendo la kujitupa chini katika muktadha wa ibada, kwa namna ya asili katika Kiswahili.
- source_word: προσεκύνησαν
  choice: kuabudu
  rationale: Katika mandhari ya kiti cha enzi, kitenzi hiki kinaonyesha heshima ya kidini na ibada, wala si kuinama kimwili tu.
theological_decisions:
- issue: Yule anayeabudiwa hajaelezwa wazi
  choice: Kuacha yule anayeabudiwa bila kutajwa, kama katika maandishi ya SBLGNT
  alternative: wakaabudu yeye / wakaabudu Mungu / wakaabudu Yeye aishiye milele na milele
  rationale: Maandishi ya Kigiriki yanaishia kwa καὶ προσεκύνησαν bila kitu cha moja kwa moja. Kiswahili kinaweza kuhifadhi matumizi hayo kwa kusema “kuabudu” bila kuongeza maneno kutoka mapokeo mengine ya maandishi au kuyachukua kutoka muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Nao” na mfuatano wa “waka-” vinatoa usimulizi wa asili; “walikuwa wakisema” huhifadhi hali endelevu ya ἔλεγον. Alama ya tanbihi [a] imewekwa baada ya “kuabudu,” ambako tofauti ya hati inahusika.
