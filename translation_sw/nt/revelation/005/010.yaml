id: REV.5.10
reference: Revelation 5:10
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἐποίησας αὐτοὺς τῷ θεῷ ἡμῶν ⸀βασιλείαν καὶ ἱερεῖς, καὶ ⸀βασιλεύουσιν ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/010.yaml
  text: and you made them a kingdom and priests to our God[b][a], and they reign on the earth.
translation:
  language: sw
  text: nawe ukawafanya wawe ufalme[a] na makuhani kwa ajili ya Mungu wetu, nao wanatawala duniani.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati zina “wafalme na makuhani” badala ya “ufalme na makuhani.”
    reason: textual_variant
  - marker: b
    text: Baadhi ya hati zina “watatawala duniani” badala ya “wanatawala duniani.”
    reason: textual_variant
lexical_decisions:
- source_word: ἐποίησας
  choice: ukawafanya wawe
  rationale: Kitenzi cha wakati uliopita kinaonyesha tendo lililotimizwa; muundo “ukawafanya wawe” ni wa kawaida katika Kiswahili na unaweka wazi kwamba waliwekwa katika hali au nafasi inayofuata.
- source_word: αὐτοὺς
  choice: wa-
  rationale: Kiambishi cha yambwa katika “ukawafanya” kinawarejelea watu waliokombolewa waliotajwa katika mstari uliotangulia.
- source_word: τῷ θεῷ ἡμῶν
  choice: kwa ajili ya Mungu wetu
  rationale: Dativi hapa inaonyesha kwamba ufalme na ukuhani wao ni kwa Mungu wetu. “Kwa ajili ya” ni Kiswahili cha asili na huepuka utata wa “kwa Mungu,” ambao ungeweza kueleweka kuwa Mungu ndiye mtendaji.
- source_word: βασιλείαν
  choice: ufalme
  rationale: 'Nomino ya umoja ina maana ya kijumla: waliokombolewa wamefanywa kuwa ufalme. Hii inafuata matini iliyopokelewa ya SBLGNT badala ya tofauti ya “wafalme.”'
- source_word: ἱερεῖς
  choice: makuhani
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa ἱερεῖς na linahifadhi uhusiano wake na lugha ya Kutoka 19:6 na Ufunuo 1:6.
- source_word: βασιλεύουσιν
  choice: wanatawala
  rationale: Umbo lililo katika matini iliyotolewa, βασιλεύουσιν, ni wakati wa sasa, nafsi ya tatu wingi; kwa hiyo limetafsiriwa “wanatawala.” Tofauti ya wakati ujao imehifadhiwa katika tanbihi.
- source_word: ἐπὶ τῆς γῆς
  choice: duniani
  rationale: Hii ni tafsiri ya kawaida na ya asili ya “juu ya nchi/dunia” katika muktadha huu, bila kulazimisha maana yenye nguvu zaidi ya kutawala “juu ya” dunia.
theological_decisions:
- issue: Utambulisho wa waliokombolewa kama βασιλείαν
  choice: ufalme
  alternative: wafalme
  rationale: Matini ya SBLGNT iliyotolewa ina βασιλείαν, “ufalme,” si βασιλεῖς, “wafalme.” Tofauti inayojulikana ya hati imeonyeshwa katika tanbihi bila kubadili matini kuu.
- issue: Wakati wa kutawala kwa watakatifu
  choice: wanatawala
  alternative: watatawala
  rationale: Matini ya Kigiriki iliyotolewa ina βασιλεύουσιν, umbo la wakati wa sasa. Tafsiri hiyo imehifadhiwa bila kuamua kwa njia ya tafsiri maswali mapana ya kieskatolojia; tofauti ya wakati ujao imewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya lugha ya ibada lakini kinachoeleweka kwa msomaji wa kawaida. Muundo “nawe ukawafanya” unaendeleza wimbo kutoka mstari uliotangulia; “nao” huunganisha kishazi cha pili kwa ufasaha. Alama zote za tanbihi zimewekwa mara moja katika matini kuu karibu na maneno yanayohusika.
