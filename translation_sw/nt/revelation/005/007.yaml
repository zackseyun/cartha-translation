  text: And he came and took it from the right hand of the one seated on the throne.
translation:
  language: sw
  text: Akaja, akakichukua kutoka katika mkono wa kulia wa yule aliyeketi kwenye kiti cha enzi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦλθεν
  choice: Akaja
  rationale: Kitenzi hiki kinasimulia mwendo wa Mwana-Kondoo kuelekea kwa yule aliyeketi kwenye kiti cha enzi. “Akaja” ni tafsiri ya kawaida ya simulizi na haiongezi wazo la “kukaribia” lisilotajwa wazi.
- source_word: εἴληφεν
  choice: akakichukua
  rationale: Ingawa umbo la Kigiriki ni timilifu, katika mfululizo huu wa simulizi ya maono Kiswahili cha kawaida hutumia wakati uliopita wa mfululizo. Kiambishi “-ki-” kinaonyesha kitu kinachodokezwa na muktadha, yaani kile kitabu cha kukunjwa cha mstari wa 1.
- source_word: ἐκ
  choice: kutoka katika
  rationale: Huonyesha chanzo au mahali kitu kilipotolewa. “Kutoka katika mkono” ni Kiswahili cha kawaida na huhifadhi taswira ya kitu kuchukuliwa mkononi.
- source_word: τῆς δεξιᾶς
  choice: mkono wa kulia
  rationale: Katika muundo huu δεξιά humaanisha mkono wa kulia, si upande wa kulia tu; hivyo taswira halisi ya maono inahifadhiwa.
- source_word: τοῦ καθημένου
  choice: yule aliyeketi
  rationale: Kirai hiki cha kushirikisha kimetumika kama nomino. “Yule aliyeketi” ni cha sasa, cha heshima, na kinatofautisha wazi Mwana-Kondoo na mwenye kuketi kwenye kiti cha enzi.
- source_word: ἐπὶ τοῦ θρόνου
  choice: kwenye kiti cha enzi
  rationale: Hapa ἐπί ina maana ya mahali. “Kwenye kiti cha enzi” ni usemi wa asili katika Kiswahili cha sasa, bila uzito wa lugha ya kizamani.
theological_decisions:
- issue: Yambwa lisilotajwa wazi la εἴληφεν
  choice: Kutumia “akakichukua,” ambapo kiambishi “-ki-” kinarejelea kitabu cha kukunjwa kilichotajwa katika muktadha wa karibu.
  alternative: “Akaja, akachukua kutoka katika mkono...”
  rationale: Kigiriki kinaacha yambwa likieleweka kutokana na muktadha. Kiswahili huhitaji rejeo la yambwa ili sentensi iwe wazi na ya kawaida; kiambishi “-ki-” hakiongezi habari mpya.
- issue: Jinsi ya kumtaja mwenye kuketi kwenye kiti cha enzi
  choice: “yule aliyeketi kwenye kiti cha enzi”
  alternative: “yeye aketiye kwenye kiti cha enzi”
  rationale: Huhifadhi tofauti kati ya Mwana-Kondoo na mwenye kuketi kwenye kiti cha enzi bila kuongeza ufafanuzi wa kimafundisho, na ni ya kawaida zaidi katika Kiswahili cha kisasa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa “aka-” huhifadhi mfululizo wa matendo katika simulizi la maono. Hakuna alama za tanbihi zinazohitajika katika mstari huu.
