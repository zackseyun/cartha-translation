  text: ⸂καὶ ὁ καθήμενος⸃ ὅμοιος ὁράσει λίθῳ ἰάσπιδι καὶ σαρδίῳ, καὶ ἶρις κυκλόθεν τοῦ θρόνου ⸂ὅμοιος ὁράσει σμαραγδίνῳ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/003.yaml
  text: And the one seated there was in appearance like jasper and sardius stone[b][a], and around the throne was a rainbow in appearance like emerald.
translation:
  language: sw
  text: Yule aliyeketi alikuwa, kwa mwonekano, kama jiwe la yaspi na akiki nyekundu.[a] Na kuzunguka kiti cha enzi kulikuwa na upinde wa mvua[b], kwa mwonekano kama zumaridi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sardio,” jina la jadi la jiwe la thamani linaloitwa hapa “akiki nyekundu.”
    reason: lexical_alternative
  - marker: b
    text: Au “mng’ao wa duara kama upinde wa mvua”; neno la Kigiriki linaweza kumaanisha mng’ao unaofanana na upinde wa mvua.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ καθήμενος
  choice: Yule aliyekuwa ameketi
  rationale: Kirai hiki cha hali ya kushiriki kimetumiwa kama nomino kumtaja aliye juu ya kiti cha enzi. Tafsiri hii ni ya kawaida katika Kiswahili na inadumisha hali yake ya kuendelea kuketi.
- source_word: ὅμοιος ὁράσει
  choice: alionekana kama
  rationale: Hueleza ufanano wa kile kilichoonekana katika maono, wala si kwamba mwenye kuketi alikuwa ametengenezwa kwa mawe hayo.
- source_word: λίθῳ ἰάσπιδι
  choice: jiwe la yaspi
  rationale: “Yaspi” ndilo jina la kawaida la jiwe hili la thamani katika Kiswahili cha Biblia, huku neno λίθῳ likiwakilishwa wazi kwa “jiwe.”
- source_word: σαρδίῳ
  choice: jiwe la akiki nyekundu
  rationale: “Akiki nyekundu” ni jina linaloeleweka zaidi kwa wasomaji wa sasa kuliko “sardio” na linaonyesha aina ya jiwe la thamani linalokusudiwa bila kulifanya kuwa rubi.
- source_word: ἶρις
  choice: upinde wa mvua
  rationale: Katika maono haya neno hilo kwa kawaida humaanisha upinde wa mvua au mng’ao unaofanana nao. Maana iliyo ya moja kwa moja imewekwa katika matini, na uwezekano mwingine umeonyeshwa katika tanbihi.
- source_word: κυκλόθεν τοῦ θρόνου
  choice: Kiti cha enzi kilizungukwa na
  rationale: Muundo huu wa Kiswahili unaeleza wazi kwamba upinde wa mvua ulikuwa umeenea kuzunguka kiti cha enzi pande zote.
- source_word: ὅμοιος ὁράσει σμαραγδίνῳ
  choice: ulioonekana kama zumaridi
  rationale: Tafsiri inadumisha ufanano wa kimwonekano badala ya kudai kwamba upinde huo ulikuwa zumaridi halisi.
theological_decisions:
- issue: Kumweleza aliyeketi kwa tashbihi badala ya maelezo ya moja kwa moja ya mwili wake
  choice: Kudumisha lugha ya ufanano kwa kusema “alionekana kama”
  alternative: Kusema kwamba alikuwa mawe hayo au kwamba mwili wake ulikuwa na rangi zake
  rationale: Kigiriki hutumia lugha ya ufanano wa kimwonekano mara mbili. Tafsiri haipaswi kugeuza maono ya ufanano kuwa dai kuhusu asili ya kimwili ya aliyeketi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa msomaji wa kawaida. Majina ya mawe “yaspi,” “akiki nyekundu,” na “zumaridi” yametumiwa kwa uwazi; sentensi zimepangwa kwa mtiririko wa asili bila kuondoa lugha ya maono na tashbihi.
