id: REV.4.1
reference: Revelation 4:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Μετὰ ταῦτα εἶδον, καὶ ἰδοὺ θύρα ἠνεῳγμένη ἐν τῷ οὐρανῷ, καὶ ἡ φωνὴ ἡ πρώτη ἣν ἤκουσα ὡς σάλπιγγος λαλούσης μετ’ ἐμοῦ, λέγων· Ἀνάβα ὧδε, καὶ δείξω σοι ἃ δεῖ γενέσθαι. μετὰ ταῦτα
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/001.yaml
  text: After these things I looked[a], and behold, a door standing open in heaven, and the first voice that I had heard, like a trumpet speaking with me, said, “Come up here[c][b], and I will show you what must take place after these things.”
translation:
  language: sw
  text: Baada ya mambo haya[a] nilitazama, na tazama, mlango ulikuwa umefunguliwa mbinguni, nayo ile sauti ya kwanza[b] niliyokuwa nimeisikia, kama tarumbeta iliyokuwa ikisema nami[c], ikasema, “Panda uje huku, nami nitakuonyesha mambo ambayo lazima yatukie baada ya mambo haya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au kwa mtindo wa kawaida zaidi, “Baada ya hili … baada ya hili.” Kigiriki kinarudia kirai cha wingi “baada ya mambo haya” mwanzoni na mwishoni mwa mstari.
    reason: lexical_alternative
  - marker: b
    text: Huenda maneno “ile sauti ya kwanza” yanarejelea sauti ambayo Yohana aliisikia hapo awali (tazama Ufunuo 1:10).
    reason: cross_reference
  - marker: c
    text: Au “iliyokuwa ikisema kwangu.” Kigiriki kinasema kwa karibu zaidi “iliyokuwa ikisema nami.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: Baada ya mambo haya
  rationale: Huhifadhi wingi wa ταῦτα na marudio ya kirai kilekile mwanzoni na mwishoni mwa mstari, bila kuamua kama mfuatano huo ni wa kifasihi, wa maono, au wa matukio ya wakati ujao.
- source_word: εἶδον
  choice: nilitazama
  rationale: Katika muktadha wa maono unaofuatwa na ἰδοὺ, ‘nilitazama’ ni Kiswahili cha kawaida zaidi kuliko ‘niliona, na tazama,’ huku kikihifadhi tendo la kuelekeza macho.
- source_word: ἰδοὺ
  choice: na tazama
  rationale: Huhifadhi alama ya ghafla ya kuvuta fikira na hadhi ya lugha ya maono ya Ufunuo.
- source_word: θύρα ἠνεῳγμένη
  choice: mlango ulikuwa umefunguliwa
  rationale: Huwasilisha hali ya mlango kuwa wazi kutokana na tendo lililotangulia, kama inavyoonyeshwa na participio timilifu ya kutendwa.
- source_word: ἐν τῷ οὐρανῷ
  choice: mbinguni
  rationale: Muktadha unahusu makao ya mbinguni, si anga linaloonekana.
- source_word: ἡ φωνὴ ἡ πρώτη
  choice: ile sauti ya kwanza
  rationale: Huhifadhi kwa uwazi kivumishi πρώτη na uwezekano wa kurejelea sauti iliyosikika hapo awali.
- source_word: ἣν ἤκουσα
  choice: niliyokuwa nimeisikia
  rationale: Muundo huu unaonyesha kuwa kusikia huko kulitangulia tukio la sasa la sauti kusema.
- source_word: ὡς σάλπιγγος
  choice: kama tarumbeta
  rationale: Huhifadhi tashbihi bila kudai kuwa sauti hiyo ilikuwa tarumbeta yenyewe.
- source_word: λαλούσης μετ’ ἐμοῦ
  choice: ikisema nami
  rationale: ‘Nami’ huhifadhi kwa kiasi cha kawaida maana ya μετά, ‘pamoja nami,’ badala ya kuibadili moja kwa moja kuwa ‘ikisema kwangu.’
- source_word: λέγων
  choice: ikasema
  rationale: Participio inayoanzisha maneno ya moja kwa moja imewasilishwa kwa kitenzi kamili, jambo la kawaida na la asili katika Kiswahili.
- source_word: Ἀνάβα ὧδε
  choice: Panda uje huku
  rationale: Hueleza mwito wa kupanda kuelekea mahali alipo msemaji; ‘uje huku’ huhifadhi mtazamo wa msemaji kuliko ‘nenda huko.’
- source_word: δείξω σοι
  choice: nitakuonyesha
  rationale: Ni ahadi ya wakati ujao iliyoelezwa kwa Kiswahili cha kawaida.
- source_word: ἃ δεῖ γενέσθαι
  choice: mambo ambayo lazima yatukie
  rationale: Huhifadhi wazo la ulazima katika δεῖ na kutokea kwa matukio katika γενέσθαι.
theological_decisions:
- issue: Nguvu ya wakati katika marudio ya μετὰ ταῦτα
  choice: Kirai kimetafsiriwa mara zote mbili kuwa ‘baada ya mambo haya.’
  alternative: ‘Baada ya hili’ au ‘baadaye,’ kwa marudio yasiyo wazi sana.
  rationale: Kuhifadhi marudio ya Kigiriki huepuka kuamua kimbele kama mfuatano ni wa kifasihi, wa maono, wa kihistoria, au wa mpango maalumu wa nyakati za mwisho.
- issue: Rejeo la ‘ile sauti ya kwanza’
  choice: Maneno yamehifadhiwa kwa uwazi bila kutaja moja kwa moja ni sauti gani.
  alternative: ‘Sauti niliyoisikia mwanzoni,’ ikifafanua kuwa inarejelea Ufunuo 1:10.
  rationale: Ingawa rejeo la Ufunuo 1:10 linaelekea kuwa ndilo linalokusudiwa, tafsiri kuu haipaswi kufunga uwezekano huo kwa maelezo ya ziada yasiyomo wazi katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kifasihi inayofaa maono ya Ufunuo. ‘Na tazama’ limehifadhiwa kama tamko la kuvuta fikira, huku miundo mingine ikifanywa ya kawaida na inayoeleweka kwa msomaji wa leo. Mistari mirefu imetenganishwa kwa alama za mkato ili sauti na tashbihi yake zisomwe kwa uwazi.
