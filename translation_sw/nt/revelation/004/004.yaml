id: REV.4.4
reference: Revelation 4:4
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ κυκλόθεν τοῦ θρόνου ⸀θρόνοι εἴκοσι τέσσαρες, καὶ ἐπὶ τοὺς ⸀θρόνους εἴκοσι τέσσαρας πρεσβυτέρους καθημένους περιβεβλημένους ⸀ἐν ἱματίοις λευκοῖς, καὶ ἐπὶ τὰς κεφαλὰς αὐτῶν στεφάνους χρυσοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/004.yaml
  text: And around the throne were twenty-four thrones[a], and on the thrones were seated twenty-four elders, clothed in white garments, and on their heads were golden crowns.
translation:
  language: sw
  text: Kukizunguka kile kiti cha enzi kulikuwa na viti vya enzi ishirini na vinne. Juu ya viti hivyo walikuwa wameketi wazee ishirini na wanne, wakiwa wamevaa mavazi meupe, na vichwani mwao walikuwa na taji[a] za dhahabu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, mashada ya ushindi ya dhahabu; neno la Kigiriki linaweza kumaanisha taji au shada linalotolewa kwa ajili ya heshima au ushindi, si taji la kifalme pekee.
    reason: lexical_alternative
lexical_decisions:
- source_word: κυκλόθεν
  choice: kukizunguka
  rationale: Inaonyesha mpangilio unaokizunguka kiti cha enzi na kuhifadhi taswira ya eneo lote linalokizunguka.
- source_word: θρόνοι
  choice: viti vya enzi
  rationale: Neno lilelile la Kigiriki limetumiwa kwa kiti kikuu na kwa viti ishirini na vinne; tafsiri hii inadumisha taswira ya kifalme au ya hukumu bila kuvifanya kuwa viti vya kawaida tu.
- source_word: εἴκοσι τέσσαρες
  choice: ishirini na vinne
  rationale: Hii ndiyo namna ya kawaida ya kutaja idadi hiyo kwa Kiswahili, ikifuata upatanisho wa kisarufi wa nomino husika.
- source_word: ἐπὶ τοὺς θρόνους
  choice: juu ya viti hivyo
  rationale: Inaeleza mahali wazee walipoketi kwa Kiswahili cha kawaida; neno “hivyo” linaunganisha wazi viti hivi na vile ishirini na vinne vilivyotajwa.
- source_word: πρεσβυτέρους
  choice: wazee
  rationale: Katika Ufunuo hili ni jina la kundi maalumu la mbinguni; “wazee” huhifadhi jina hilo bila kuamua utambulisho wao.
- source_word: καθημένους
  choice: walikuwa wameketi
  rationale: Inawasilisha hali yao ya kuketi kwa muundo wa Kiswahili unaosomeka kwa urahisi katika taarifa ya maono.
- source_word: περιβεβλημένους
  choice: wakiwa wamevaa
  rationale: Inahifadhi hali endelevu inayodokezwa na kauli timilifu ya Kigiriki na ni usemi wa kawaida na wenye hadhi.
- source_word: ἐν ἱματίοις λευκοῖς
  choice: mavazi meupe
  rationale: ἱμάτια humaanisha mavazi kwa ujumla; “mavazi” huepuka kubainisha bila ushahidi kwamba yalikuwa majoho.
- source_word: στεφάνους
  choice: taji
  rationale: “Taji” ndiyo tafsiri wazi na ya kawaida katika mandhari hii, huku maana mbadala ya shada la heshima au ushindi ikihifadhiwa katika tanbihi.
- source_word: χρυσοῦς
  choice: za dhahabu
  rationale: Ni Kiswahili cha kawaida kinachoeleza kwa usahihi kwamba taji hizo zilikuwa za dhahabu.
theological_decisions:
- issue: Asili ya viti ishirini na vinne vinavyozunguka kiti kikuu cha enzi
  choice: Vimetafsiriwa “viti vya enzi,” si “viti” tu.
  alternative: “Viti” inaweza kutumiwa ili kuepuka kudokeza kwamba wenye kuvikaa wana mamlaka sawa na mwenye kiti kikuu cha enzi.
  rationale: Kigiriki kinarudia nomino θρόνος. Kudumisha neno lilelile huhifadhi uhusiano wa kimatamshi na taswira ya kifalme au ya hukumu, bila kufuta ukuu wa kiti kimoja kilicho katikati.
- issue: Utambulisho wa wazee ishirini na wanne
  choice: Wameitwa tu “wazee,” bila maelezo ya kiufafanuzi.
  alternative: Wameelezwa kwa namna mbalimbali kuwa wawakilishi wa kanisa, viumbe wa kimalaika, au wawakilishi wa Israeli na mitume.
  rationale: Aya yenyewe inawataja kama πρεσβύτεροι lakini haielezi utambulisho wao; tafsiri inapaswa kuhifadhi hali hiyo bila kuingiza msimamo fulani wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umegawanywa katika sentensi mbili ili kurahisisha usomaji bila kupoteza mfululizo wa maono. “Kile kiti cha enzi” hurejelea kiti kilichotajwa katika muktadha uliotangulia, na “viti hivyo” huweka marejeo wazi.
