base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/005.yaml
  text: And from the throne come flashes of lightning and sounds and peals of thunder[a]; and before the throne were seven lamps of fire burning[c][b], which are the seven spirits of God.
translation:
  language: sw
  text: Na kutoka katika kiti cha enzi hutoka miale ya radi, sauti, na mingurumo ya radi[a]; na mbele ya kiti cha enzi kuna taa saba za moto zinazowaka[b], nazo ndizo roho saba za Mungu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sauti za watu” badala ya “sauti.”
    reason: lexical_alternative
  - marker: b
    text: Au “mienge saba ya moto inayowaka mbele ya kiti cha enzi.”
    reason: lexical_alternative
  - marker: c
    text: Wengi huelewa “roho saba za Mungu” kuwa njia ya mfano ya kueleza utimilifu wa Roho Mtakatifu mmoja; lakini maandishi ya Kigiriki yenyewe yanasema “roho saba.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκπορεύονται
  choice: kunatokea
  rationale: Kitenzi cha wakati wa sasa kinaonyesha matukio yanayotoka katika kiti cha enzi; “kunatokea” ni Kiswahili cha kawaida na kinahifadhi hali hiyo endelevu bila sauti ya kitaalamu.
- source_word: ἀστραπαὶ
  choice: miale ya radi
  rationale: Huwakilisha mianga ya radi inayojirudia na ni usemi wa kawaida wa Kiswahili.
- source_word: φωναὶ
  choice: sauti
  rationale: φωνή inaweza kumaanisha sauti au sauti za viumbe; “sauti” huhifadhi upana huo bila kudokeza moja kwa moja kwamba ni maneno yanayosemwa.
- source_word: βρονταί
  choice: mingurumo ya radi
  rationale: Wingi unaonyesha milio mikubwa inayojirudia; “mingurumo ya radi” ni ya asili na yenye hadhi katika Kiswahili.
- source_word: λαμπάδες πυρὸς
  choice: taa saba za moto
  rationale: Hufuata kwa karibu muundo wa Kigiriki na kuacha uwezekano wa λαμπάδες kuwa taa au mienge; mbadala umewekwa katika tanbihi.
- source_word: καιόμεναι
  choice: zilikuwa zinawaka
  rationale: Kishiriki cha wakati wa sasa kinaonyesha kuwaka kunakoendelea; muundo huu ni wa asili katika simulizi la Kiswahili.
- source_word: ἐνώπιον τοῦ θρόνου
  choice: mbele ya kile kiti cha enzi
  rationale: Ni tafsiri ya kawaida ya mahali katika mandhari ya chumba cha kiti cha enzi.
- source_word: ἅ εἰσιν
  choice: hizo ndizo
  rationale: Kiwakilishi kinarejelea taa saba na kuanzisha utambulisho wake wa mfano kwa Kiswahili fasaha.
- source_word: τὰ ἑπτὰ πνεύματα τοῦ θεοῦ
  choice: roho saba za Mungu
  rationale: Huhifadhi wingi ulio wazi katika Kigiriki badala ya kuingiza tafsiri ya “Roho mwenye utimilifu wa aina saba.”
theological_decisions:
- issue: Maana ya τὰ ἑπτὰ πνεύματα τοῦ θεοῦ
  choice: roho saba za Mungu
  alternative: Roho wa Mungu katika utimilifu wake; au Roho wa Mungu mwenye sifa saba
  rationale: Kigiriki kinasema wazi “roho saba.” Maandishi makuu yanahifadhi tamko na mvutano huo wa kitheolojia; tanbihi inaeleza uelewa wa kawaida wa kiishara bila kuufanya kuwa tafsiri yenyewe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi umegawanywa kwa usomaji wa kawaida huku uhusiano wa picha ukihifadhiwa. “Kile kiti cha enzi” hutumiwa kurejelea kiti kilichotajwa tayari katika muktadha.
