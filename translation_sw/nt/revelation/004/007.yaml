  text: καὶ τὸ ζῷον τὸ πρῶτον ὅμοιον λέοντι, καὶ τὸ δεύτερον ζῷον ὅμοιον μόσχῳ, καὶ τὸ τρίτον ζῷον ⸀ἔχων ⸂τὸ πρόσωπον ὡς⸃ ἀνθρώπου, καὶ τὸ τέταρτον ζῷον ὅμοιον ἀετῷ πετομένῳ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/007.yaml
  text: And the first living creature was like a lion, and the second living creature like a calf, and the third living creature had a face like a man, and the fourth living creature was like an eagle in flight.
translation:
  language: sw
  text: Na kiumbe hai cha kwanza kilikuwa kama simba, na kiumbe hai cha pili kilikuwa kama ndama, na kiumbe hai cha tatu kilikuwa na uso kama wa mwanadamu,[a] na kiumbe hai cha nne kilikuwa kama tai arukaye.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uso kama wa mtu.” Kigiriki husema kihalisi, “uso kama wa mwanadamu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ζῷον
  choice: kiumbe hai
  rationale: Huwasilisha kiumbe kilicho hai na kukitofautisha na ‘mnyama’ anayetumiwa kwa viumbe wa uovu baadaye katika Ufunuo.
- source_word: ὅμοιον
  choice: kama
  rationale: Huhifadhi maana ya kufanana bila kudai kuwa viumbe hao walikuwa wanyama hao hasa.
- source_word: λέοντι
  choice: simba
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya neno hili.
- source_word: μόσχῳ
  choice: ndama
  rationale: μόσχος kwa kawaida humaanisha ndama au ng’ombe mchanga; ‘ndama’ ni sahihi bila kubainisha jinsia au maana ya dhabihu.
- source_word: ἔχων
  choice: alikuwa na
  rationale: Kitenzi kishirikishi kimetafsiriwa kwa muundo wa kawaida wa Kiswahili unaohifadhi maelezo yake.
- source_word: τὸ πρόσωπον ὡς ἀνθρώπου
  choice: uso kama wa mwanadamu
  rationale: Huhifadhi πρόσωπον kuwa ‘uso’ na ὡς kuwa ulinganisho; ‘mwanadamu’ ni ya kawaida na huwasilisha ἄνθρωπος bila kubana maana kwa jinsia.
- source_word: ἀετῷ
  choice: tai
  rationale: ‘Tai’ ndiyo tafsiri ya kawaida na inayofaa taswira hii ya kinabii.
- source_word: πετομένῳ
  choice: anayeruka
  rationale: Huwasilisha moja kwa moja hali ya tai akiwa katika tendo la kuruka.
theological_decisions:
- issue: Maana ya ἀνθρώπου katika maelezo ya kiumbe wa tatu
  choice: uso kama wa mwanadamu
  alternative: uso kama wa mtu
  rationale: Neno linaweza kumaanisha mwanadamu kwa ujumla. Tafsiri kuu inahifadhi ulinganisho wa Kigiriki huku ikiepuka kuifanya jinsia kuwa sehemu ya lazima ya taswira; badala iliyo katika tanbihi huhifadhi usemi mwingine wa kawaida.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Marudio ya ‘kiumbe hai’ yamehifadhiwa ili kuakisi muundo wa mstari na kuzuia mkanganyiko.
