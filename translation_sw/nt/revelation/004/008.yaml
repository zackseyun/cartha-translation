id: REV.4.8
reference: Revelation 4:8
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ τὰ τέσσαρα ζῷα, ἓν ⸂καθ’ ἓν⸃ ⸀αὐτῶν ⸀ἔχων ἀνὰ πτέρυγας ἕξ, κυκλόθεν καὶ ἔσωθεν γέμουσιν ὀφθαλμῶν· καὶ ἀνάπαυσιν οὐκ ἔχουσιν ἡμέρας καὶ νυκτὸς λέγοντες· Ἅγιος ἅγιος ἅγιος κύριος, ὁ θεός, ὁ παντοκράτωρ, ὁ ἦν καὶ ὁ ὢν καὶ ὁ ἐρχόμενος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/008.yaml
  text: 'And the four living creatures[a], each one of them having six wings, are full of eyes all around and within; and they have no rest day and night, saying: “Holy, holy, holy is the Lord God, the Almighty, who was and who is and who is coming.”'
translation:
  language: sw
  text: 'Na wale viumbe hai wanne, kila mmoja wao akiwa na mabawa sita, wamejaa macho pande zote na ndani; nao hawapumziki mchana wala usiku, wakisema: “Mtakatifu, mtakatifu, mtakatifu ni Bwana Mungu, Mwenyezi, aliyekuwako, aliyeko na anayekuja.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa usemi wa kimapokeo zaidi, “aliyekuwako, aliyeko na atakayekuja.”
    reason: Tafsiri hii mbadala hutoa usemi wa wakati ujao uliozoeleka, huku matini kuu ikihifadhi hali ya sasa ya ὁ ἐρχόμενος.
lexical_decisions:
- source_word: ζῷα
  choice: viumbe hai
  rationale: Katika Ufunuo neno hili linamaanisha viumbe wa mbinguni walio hai, si wanyama kwa maana ya kawaida; “viumbe hai” linahifadhi taswira hiyo bila kuwapotosha wasomaji.
- source_word: ἓν καθ’ ἓν αὐτῶν
  choice: kila mmoja wao
  rationale: Usemi huu wa kugawa unasisitiza kwamba maelezo yanamhusu kila kiumbe mmoja mmoja.
- source_word: ἔχων ἀνὰ πτέρυγας ἕξ
  choice: akiwa na mabawa sita
  rationale: Hueleza kwa Kiswahili cha kawaida kwamba kila mmoja wa wale viumbe ana mabawa sita.
- source_word: κυκλόθεν καὶ ἔσωθεν
  choice: pande zote na ndani
  rationale: 'Huhifadhi vipengele vyote viwili vya mahali: kuzunguka kwa nje na sehemu ya ndani.'
- source_word: γέμουσιν ὀφθαλμῶν
  choice: wamejaa macho
  rationale: γέμω pamoja na uhusika huu humaanisha kuwa umejaa kitu; tafsiri hii inahifadhi taswira dhahiri ya kinabii.
- source_word: ἀνάπαυσιν οὐκ ἔχουσιν
  choice: hawapumziki
  rationale: Ni Kiswahili cha asili kinachoeleza kwamba hawana pumziko, bila kuifanya kauli imaanishe tu kwamba hawaachi kusema.
- source_word: ἡμέρας καὶ νυκτός
  choice: mchana wala usiku
  rationale: Katika sentensi hasi, “mchana wala usiku” hutoa kwa kawaida maana ya tendo lisilokoma wakati wote.
- source_word: λέγοντες
  choice: wakisema
  rationale: Hutambulisha maneno wanayotamka bila kuongeza wazo la kupaza sauti ambalo halijaelezwa wazi na kitenzi.
- source_word: Ἅγιος ἅγιος ἅγιος
  choice: Mtakatifu, mtakatifu, mtakatifu
  rationale: Marudio ya mara tatu yamehifadhiwa kikamilifu kwa sababu yana uzito wa kisanaa na kiteolojia.
- source_word: κύριος, ὁ θεός
  choice: Bwana Mungu
  rationale: Huu ni ulinganifu wa kawaida na wenye heshima wa majina haya ya Mungu katika muktadha wa ibada.
- source_word: ὁ παντοκράτωρ
  choice: Mwenyezi
  rationale: “Mwenyezi” ni jina la Mungu lililozoeleka katika Kiswahili, likieleza mamlaka na uwezo wake juu ya yote.
theological_decisions:
- issue: Tafsiri ya kauli ya wakati kuhusu Mungu, ὁ ἦν καὶ ὁ ὢν καὶ ὁ ἐρχόμενος
  choice: aliyekuwako, aliyeko na anayekuja
  alternative: aliyekuwako, aliyeko na atakayekuja
  rationale: “Anayekuja” huhifadhi hali ya sasa ya kitenzi-shirikishi ὁ ἐρχόμενος na hisia ya kuja kwake kunakoendelea au kuwa karibu, badala ya kuibadili kimya kimya kuwa wakati ujao tu. Usemi wa kimapokeo wenye “atakayekuja” umetolewa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wazi kwa wasomaji wa kawaida huku marudio ya kiliturujia na taswira ya kinabii vikihifadhiwa.
