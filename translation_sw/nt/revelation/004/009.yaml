id: REV.4.9
reference: Revelation 4:9
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ὅταν ⸀δώσουσιν τὰ ζῷα δόξαν καὶ τιμὴν καὶ εὐχαριστίαν τῷ καθημένῳ ἐπὶ ⸂τῷ θρόνῳ⸃, τῷ ζῶντι εἰς τοὺς αἰῶνας τῶν αἰώνων,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/009.yaml
  text: And whenever the living creatures give glory and honor and thanksgiving to the one seated on the throne[a], to the one who lives forever and ever,
translation:
  language: sw
  text: Na kila mara vile viumbe hai wanapompa utukufu, heshima na shukrani yeye anayeketi juu ya kiti cha enzi, yeye aishiye milele na milele[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au kwa kufuata muundo wa maneno kwa karibu zaidi, “kwa enzi za enzi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: kila mara ... wanapompa
  rationale: Muundo huu unaonyesha tendo linalotokea mara kwa mara au wakati wowote linapotokea, badala ya tukio moja tu.
- source_word: δώσουσιν
  choice: wanapompa
  rationale: Kitenzi δίδωμι kimehifadhiwa kwa maana yake ya kawaida ya ‘kumpa’; kiambishi cha yambwa ‘-m-’ kinamrejelea aliyeketi kwenye kiti cha enzi.
- source_word: τὰ ζῷα
  choice: wale viumbe hai
  rationale: Katika muktadha wa Ufunuo, maneno haya yanawataja viumbe wa chumba cha enzi waliotangulia kutambulishwa, si wanyama wa kawaida. ‘Wale’ huonyesha kuwa tayari wanajulikana katika muktadha bila kuongeza idadi yao katika mstari huu.
- source_word: δόξαν
  choice: utukufu
  rationale: ‘Utukufu’ ni neno la kawaida na lenye hadhi katika muktadha wa ibada, nalo halibadili maana kuwa tendo la kusifu pekee.
- source_word: τιμήν
  choice: heshima
  rationale: ‘Heshima’ ni kisawe cha moja kwa moja na cha kawaida cha τιμή, na kinaendana vizuri na utukufu na shukrani.
- source_word: εὐχαριστίαν
  choice: shukrani
  rationale: ‘Shukrani’ huonyesha tendo la kutoa asante, na huhifadhi mpangilio wa nomino tatu katika chanzo.
- source_word: τῷ καθημένῳ ἐπὶ τῷ θρόνῳ
  choice: yeye aliyeketi juu ya kiti cha enzi
  rationale: Usemi huu wa asili unaonyesha hali ya kuketi na kuhifadhi taswira ya kiti cha enzi kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: τῷ ζῶντι
  choice: yeye aishiye
  rationale: Uhusiano wa wazi wa kifafanuzi umehifadhiwa, na umbo hili linaunganika kwa urahisi na kirai kinachofuata cha muda usio na mwisho.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: milele na milele
  rationale: Huu ni usemi wa asili na unaoeleweka wazi katika Kiswahili kwa muda usio na mwisho; tafsiri ya karibu zaidi na muundo wa Kigiriki imewekwa katika tanbihi.
theological_decisions:
- issue: Kutafsiri jina la kifalme la Mungu bila kuongeza utambulisho usiotajwa wazi
  choice: yeye aliyeketi juu ya kiti cha enzi, yeye aishiye milele na milele
  alternative: Mungu aliyeketi juu ya kiti cha enzi, anayeishi milele na milele
  rationale: Chanzo kinamtambulisha mhusika kwa kuketi kwake kwenye kiti cha enzi na kwa kuishi milele, bila kutumia neno ‘Mungu’ katika mstari huu. Tafsiri imehifadhi muundo huo wa ufafanuzi bila kuongeza jina.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio wa ibada wa ‘utukufu, heshima na shukrani’ umehifadhiwa, pamoja na urudiaji wa ‘yeye’ unaoakisi virai viwili vya Kigiriki vinavyomfafanua mhusika mmoja.
