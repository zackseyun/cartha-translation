  text: καὶ ἐνώπιον τοῦ θρόνου ὡς θάλασσα ὑαλίνη ὁμοία κρυστάλλῳ. Καὶ ἐν μέσῳ τοῦ θρόνου καὶ κύκλῳ τοῦ θρόνου τέσσαρα ζῷα γέμοντα ὀφθαλμῶν ἔμπροσθεν καὶ ὄπισθεν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/006.yaml
  text: And before the throne was something like a sea of glass[a], like crystal. And in the midst of the throne and around the throne were four living creatures[c][b], full of eyes in front and behind.
translation:
  language: sw
  text: Na mbele ya kiti cha enzi palikuwa na kitu kama bahari ya kioo[a], kama fuwele. Na katikati ya kiti cha enzi na kukizunguka kiti cha enzi[c] palikuwa na viumbe hai wanne[b], waliojaa macho mbele na nyuma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “bahari kama kioo.” Kigiriki kinatoa ulinganisho: “kitu kama bahari ya kioo.”'
    reason: lexical_alternative
  - marker: b
    text: Au, “viumbe wenye uhai wanne.” Neno la Kigiriki hapa halimaanishi “wanyama wa kutisha” wanaotajwa baadaye katika Ufunuo.
    reason: lexical_alternative
  - marker: c
    text: Maneno “katikati ya kiti cha enzi na kukizunguka kiti cha enzi” yanaeleza nafasi kwa njia iliyo ngumu kuielewa; huenda Kigiriki kinaonyesha mtazamo wa kimaono, kwa hiyo tafsiri imeachwa karibu na chanzo kwa makusudi.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐνώπιον
  choice: mbele ya
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha mahali kuhusiana na kiti cha enzi bila kuongeza wazo lisilotajwa la ‘uwepo.’
- source_word: ὡς
  choice: kitu kama
  rationale: Huonyesha ulinganisho wa maono, si kwamba kitu hicho kilikuwa bahari halisi.
- source_word: θάλασσα ὑαλίνη
  choice: bahari ya kioo
  rationale: Huhifadhi taswira yenye nguvu ya Kigiriki; tanbihi inaonyesha uwezekano wa kuelewa pia ‘bahari kama kioo.’
- source_word: ὁμοία κρυστάλλῳ
  choice: kama bilauri
  rationale: ‘Bilauri’ hapa hueleza kioo angavu chenye mng’ao, na kudumisha ulinganisho wa pili wa chanzo.
- source_word: ἐν μέσῳ τοῦ θρόνου καὶ κύκλῳ τοῦ θρόνου
  choice: katikati ya kiti cha enzi na kukizunguka kiti hicho
  rationale: Huhifadhi maelezo magumu ya nafasi katika maono badala ya kuyasawazisha kwa tafsiri fulani.
- source_word: ζῷα
  choice: viumbe hai
  rationale: Hutaja viumbe vilivyo hai bila maana hasi ya ‘wanyama wakali’ inayoweza kuvichanganya na wanyama wenye uadui katika sehemu za baadaye za Ufunuo.
- source_word: γέμοντα ὀφθαλμῶν
  choice: waliojaa macho
  rationale: Ni tafsiri ya karibu na ya kawaida ya Kiswahili ya muundo wa Kigiriki.
- source_word: ἔμπροσθεν καὶ ὄπισθεν
  choice: mbele na nyuma
  rationale: Ni jozi ya kawaida ya vielezi vya mahali na huhifadhi taswira ya chanzo.
theological_decisions:
- issue: Jinsi ya kutafsiri ζῷα katika maono ya mbinguni kuhusu kiti cha enzi
  choice: viumbe hai
  alternative: viumbe wenye uhai; wanyama
  rationale: ‘Viumbe hai’ hudumisha hadhi ya viumbe hawa wa maono na mwangwi wa maono ya Ezekieli bila kuingiza maana hasi ya wanyama wenye uadui.
- issue: Jinsi ya kushughulikia ugumu wa nafasi katika ἐν μέσῳ τοῦ θρόνου καὶ κύκλῳ τοῦ θρόνου
  choice: kuhifadhi ‘katikati ya kiti cha enzi na kukizunguka kiti hicho’
  alternative: kulainisha kuwa ‘kukizunguka kiti cha enzi, karibu na katikati yake’ au kutafsiri kuwa ‘kati ya kiti na mzunguko wake’
  rationale: Chanzo kina maelezo magumu au mtazamo wa kimaono. Tafsiri haipaswi kulazimisha mpangilio mmoja wa nafasi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. ‘Kiti cha enzi’ ni istilahi iliyozoeleka; ‘bilauri’ imetumiwa kwa maana ya crystal, si chombo cha kunywea. Alama zote za tanbihi zimewekwa katika matini kuu.
