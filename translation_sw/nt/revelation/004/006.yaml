  source_fidelity: 'Mstari wa kwanza unahifadhi vizuri ulinganisho wa mara mbili wa Kigiriki: kitu kilicho kama bahari ya kioo, kisha kama kristali. Hata hivyo, “bilauri” kwa matumizi ya kawaida humaanisha hasa glasi au chombo cha kunywea, si κρύσταλλος (‘kristali/fuwele’). Katika kifungu cha pili, “kukizunguka kiti hicho” hubadilisha kwa kiasi muundo wa vielezi vya mahali kuwa kitendo cha viumbe; “kukiizunguka” (bila kuhitaji kitenzi kingine) hudumisha kwa karibu zaidi mvutano wa mahali ulio katika chanzo.'
