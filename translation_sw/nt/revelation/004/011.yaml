  text: Ἄξιος εἶ, ὁ κύριος καὶ ὁ θεὸς ⸀ἡμῶν, λαβεῖν τὴν δόξαν καὶ τὴν τιμὴν καὶ τὴν δύναμιν, ὅτι σὺ ἔκτισας ⸀τὰ πάντα, καὶ διὰ τὸ θέλημά σου ἦσαν καὶ ἐκτίσθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/011.yaml
  text: You are worthy[a], our Lord and God, to receive the glory and the honor and the power, because you created all things[b], and by your will they existed and were created.
translation:
  language: sw
  text: “Unastahili[a], Bwana na Mungu wetu, kupokea utukufu, heshima na nguvu, kwa sababu wewe uliumba vitu vyote, na kwa sababu ya mapenzi yako vilikuwapo na vikaumbwa.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kigiriki kinaanza kwa neno “Unastahili” ili kulisisitiza; kwa kufuata mpangilio huo kwa karibu zaidi: “Unastahili wewe, Bwana na Mungu wetu.”'
    reason: lexical_alternative
  - marker: b
    text: Au, “na kwa mapenzi yako vilikuwapo na vikaumbwa.” Kifungu cha Kigiriki διὰ τὸ θέλημά σου kwa kawaida kinaonyesha sababu (“kwa sababu ya mapenzi yako”); tafsiri hii mbadala inaweza pia kueleweka kwa maana hiyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄξιος εἶ
  choice: Unastahili
  rationale: Kauli hii inaeleza kustahili kwa anayeambiwa. Kiswahili cha moja kwa moja na cha sasa kinahifadhi nguvu ya sifa hiyo; tanbihi inaonyesha msisitizo unaotokana na mpangilio wa Kigiriki.
- source_word: ὁ κύριος καὶ ὁ θεὸς ἡμῶν
  choice: Bwana na Mungu wetu
  rationale: Katika muktadha huu muundo wenye vibainishi unatumika kama mwito wa moja kwa moja. Tafsiri hii inahifadhi vyeo vyote viwili na umilikishi wa wingi bila kuongeza neno la mwito lisilokuwamo katika Kigiriki.
- source_word: λαβεῖν
  choice: kupokea
  rationale: Kitenzi-jina baada ya ἄξιος kinaonyesha kile anayeambiwa anastahili kupokea. “Kupokea” linafaa kwa muktadha wa ibada kuliko “kuchukua.”
- source_word: τὴν δόξαν καὶ τὴν τιμὴν καὶ τὴν δύναμιν
  choice: utukufu, heshima na nguvu
  rationale: Maneno haya yanataja sifa tatu zinazotolewa katika ibada. Kiswahili hakihitaji vibainishi vinavyolingana na makala za Kigiriki, na orodha hii ni ya asili huku ikihifadhi vipengele vyote vitatu.
- source_word: ὅτι
  choice: kwa sababu
  rationale: Kiunganishi hiki kinatoa msingi wa kustahili kwa Mungu; “kwa sababu” linaonyesha uhusiano wa kisababishi wazi katika Kiswahili cha sasa.
- source_word: ἔκτισας τὰ πάντα
  choice: wewe uliumba vitu vyote
  rationale: κτίζω ni “kuumba,” na τὰ πάντα ina upeo wa jumla. Kiwakilishi “wewe” kinahifadhi msisitizo wa σὺ katika Kigiriki.
- source_word: διὰ τὸ θέλημά σου
  choice: kwa sababu ya mapenzi yako
  rationale: διά pamoja na hali ya kushutumiwa kwa kawaida huonyesha sababu. Tafsiri hii inaweka wazi kwamba mapenzi ya Mungu ndiyo sababu ya kuwapo na kuumbwa kwa vitu bila kulazimisha maana ya chombo.
- source_word: ἦσαν καὶ ἐκτίσθησαν
  choice: vilikuwapo na vikaumbwa
  rationale: 'Vitenzi viwili vimehifadhiwa tofauti: cha kwanza kinaeleza kuwapo, na cha pili tendo la kuumbwa. Upatanisho wa ngeli unarejelea “vitu vyote.”'
theological_decisions:
- issue: Muundo wa majina ya Mungu unaofanya kazi kama mwito
  choice: Bwana na Mungu wetu
  alternative: Ee Bwana na Mungu wetu; Bwana wetu na Mungu wetu
  rationale: Muktadha wa ibada unaonyesha kuwa maneno haya yanaelekezwa kwa yule aliyeketi kwenye kiti cha enzi. Tafsiri iliyochaguliwa inahifadhi mwito na vyeo bila kuongeza “Ee” wala kurudia kimakusudi kiwakilishi cha umilikishi.
- issue: Uhusiano wa mapenzi ya Mungu na uumbaji katika διὰ τὸ θέλημά σου
  choice: kwa sababu ya mapenzi yako
  alternative: kwa mapenzi yako
  rationale: 'διά pamoja na accusative inaelekea kuonyesha sababu: vitu vilikuwapo na kuumbwa kwa sababu ya mapenzi ya Mungu. Mbadala unaweza kueleweka kwa maana ya sababu au chombo; tanbihi inahifadhi uwezekano huo bila kutatua zaidi mvutano wa kifungu.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kiibada lakini kinachoeleweka kwa wasomaji wa kawaida. “Mapenzi” limetumiwa kwa maana ya nia au kusudi la Mungu, kama ilivyo kawaida katika Kiswahili cha kibiblia. Alama za tanbihi [a] na [b] zimewekwa katika matini kuu.
