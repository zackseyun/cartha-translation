  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: πεσοῦνται οἱ εἴκοσι τέσσαρες πρεσβύτεροι ἐνώπιον τοῦ καθημένου ἐπὶ τοῦ θρόνου, καὶ προσκυνήσουσιν τῷ ζῶντι εἰς τοὺς αἰῶνας τῶν αἰώνων, καὶ βαλοῦσιν τοὺς στεφάνους αὐτῶν ἐνώπιον τοῦ θρόνου, λέγοντες·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/010.yaml
  text: 'the twenty-four elders will fall down before the one seated on the throne[a], and they will worship the one who lives forever and ever, and they will cast their crowns before the throne[b], saying:'
translation:
  language: sw
  text: 'wale wazee ishirini na wanne wataanguka mbele ya yule anayeketi kwenye kiti cha enzi, nao watamwabudu yule aliye hai milele na milele[a], na watatupa taji zao mbele ya kiti cha enzi[b], wakisema:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya karibu zaidi na maneno ya Kigiriki, “kwa enzi za enzi.”
    reason: lexical_alternative
  - marker: b
    text: Neno la Kigiriki lililotafsiriwa “taji” linaweza pia kumaanisha mashada ya ushindi yaliyotolewa kama ishara ya heshima.
    reason: lexical_alternative
lexical_decisions:
- source_word: πεσοῦνται
  choice: wataanguka chini
  rationale: Huhifadhi tendo halisi la kuanguka chini katika muktadha wa ibada bila kulifafanua kupita kiasi kuwa kusujudu kikamilifu.
- source_word: οἱ εἴκοσι τέσσαρες πρεσβύτεροι
  choice: wale wazee ishirini na wanne
  rationale: “Wazee” ni neno la kawaida na linaloeleweka kwa πρεσβύτεροι katika baraza la mbinguni la Ufunuo.
- source_word: ἐνώπιον
  choice: mbele ya
  rationale: Ni tafsiri fupi na ya kawaida inayofaa katika sehemu zote mbili za mstari.
- source_word: τοῦ καθημένου ἐπὶ τοῦ θρόνου
  choice: yeye anayeketi kwenye kiti cha enzi
  rationale: Huhifadhi muundo wa jina unaotokana na kitenzi na hali endelevu ya kuketi kwenye kiti cha enzi bila kumtaja mhusika kwa jina ambalo halipo katika mstari.
- source_word: προσκυνήσουσιν
  choice: watamwabudu
  rationale: Katika muktadha huu wa kimungu, kitenzi kinamaanisha ibada, si kutoa heshima ya kawaida tu.
- source_word: τῷ ζῶντι
  choice: yeye aliye hai
  rationale: Huhifadhi cheo kinachotokana na kitenzi na kusisitiza utambulisho wake kama aliye hai.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: milele na milele
  rationale: Ni nahau ya Kiswahili ya kawaida na ya heshima kwa muda usio na mwisho; tafsiri ya karibu zaidi na muundo wa Kigiriki imewekwa katika tanbihi.
- source_word: βαλοῦσιν
  choice: watatupa
  rationale: Huhifadhi nguvu na uwazi wa tendo la βάλλω kuliko “wataweka,” bila kutumia neno la kizamani.
- source_word: τοὺς στεφάνους αὐτῶν
  choice: taji zao
  rationale: “Taji” ni tafsiri ya kawaida katika mazingira haya ya heshima na utawala, huku maana ya shada la ushindi ikielezwa katika tanbihi.
- source_word: λέγοντες
  choice: wakisema
  rationale: Huunganisha kwa kawaida matendo yaliyotangulia na maneno yanayofuata.
theological_decisions:
- issue: Mhusika anayeketi kwenye kiti cha enzi na aliye hai
  choice: Kutumia maelezo “yeye anayeketi kwenye kiti cha enzi” na “yeye aliye hai milele na milele.”
  alternative: Kumtaja wazi kuwa Mungu Baba.
  rationale: Muktadha unaonyesha Mungu aliyeketi kwenye kiti cha enzi, lakini Kigiriki cha mstari huu kinatumia maelezo badala ya jina maalumu; tafsiri hailazimishi utambulisho wa kiteolojia ulio wazi zaidi kuliko matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa wakati ujao umehifadhiwa katika vitenzi vikuu, na maelezo ya mhusika yameachwa bila ufafanuzi wa kimadhehebu.
