  text: ⸀εὐθέως ἐγενόμην ἐν πνεύματι· καὶ ἰδοὺ θρόνος ἔκειτο ἐν τῷ οὐρανῷ, καὶ ἐπὶ τὸν θρόνον καθήμενος,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/002.yaml
  text: Immediately I was in the Spirit[a], and behold, a throne stood in heaven, and one seated on the throne,
translation:
  language: sw
  text: Mara moja nikawa katika Roho[a], na tazama, kiti cha enzi kilikuwa kimewekwa mbinguni, na mmoja alikuwa ameketi juu ya kiti hicho cha enzi,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika roho.” Kirai cha Kigiriki hakina kibainishi, hivyo kinaweza kumaanisha kuwa katika Roho Mtakatifu au kuwa katika hali ya kiroho au ya maono.
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθέως
  choice: Mara moja
  rationale: Hueleza kwamba jambo lilitokea bila kuchelewa; ni usemi wa kawaida wa Kiswahili unaodumisha mpito wa haraka katika maono ya Yohana.
- source_word: ἐγενόμην
  choice: nikawa
  rationale: Kitenzi hiki huonyesha kuingia katika hali fulani, si kuwapo tu katika hali isiyobadilika. “Nikawa” ni cha asili katika Kiswahili na kinadumisha wazo hilo la mpito.
- source_word: ἐν πνεύματι
  choice: katika Roho
  rationale: Katika Ufunuo, kirai hiki huashiria hali ya kinabii au maono yanayohusishwa na Roho. Herufi kubwa inaonyesha maana inayowezekana zaidi, huku maana nyingine ikihifadhiwa katika tanbihi.
- source_word: ἰδοὺ
  choice: tazama
  rationale: Neno hili huvuta usikivu kwa jambo jipya katika maono; “tazama” lina uzito unaofaa kwa lugha ya kinabii na ya heshima.
- source_word: θρόνος
  choice: kiti cha enzi
  rationale: Hili ndilo neno la kawaida na linaloeleweka katika Kiswahili kwa kiti cha kifalme chenye mamlaka.
- source_word: ἔκειτο
  choice: kilikuwa kimewekwa
  rationale: Kitenzi kinaeleza kitu kilichowekwa au kilichopo mahali pake. Tafsiri hii inafaa kwa kiti cha enzi na haidokezi kwamba kilikuwa kimelala.
- source_word: ἐν τῷ οὐρανῷ
  choice: mbinguni
  rationale: Muktadha wa maono unaonyesha makao ya mbinguni, si anga la kawaida.
- source_word: καθήμενος
  choice: mmoja alikuwa ameketi
  rationale: Kirai hiki kinamtaja aliyeketi bila kumfafanua zaidi. “Mmoja” hudumisha kutotajwa kwa utambulisho wake katika Kigiriki, na “alikuwa ameketi” ni Kiswahili cha asili.
theological_decisions:
- issue: Ikiwa ἐν πνεύματι inamtaja Roho Mtakatifu au hali ya kiroho/maono kwa ujumla
  choice: katika Roho
  alternative: katika roho
  rationale: Matumizi ya kirai hiki katika Ufunuo yanaunga mkono uhusiano na Roho katika hali ya kinabii ya maono. Hata hivyo, Kigiriki hakina kibainishi, hivyo uwezekano wa maana ya jumla zaidi umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Tazama” hudumisha mtindo wa juu wa lugha ya maono bila kuwa wa kizamani kupita kiasi. Alama ya mwisho ya koma imehifadhiwa kwa sababu mstari unaendelea kisarufi katika mstari unaofuata.
