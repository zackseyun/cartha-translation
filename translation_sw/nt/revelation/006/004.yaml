id: REV.6.4
reference: Revelation 6:4
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἐξῆλθεν ἄλλος ἵππος πυρρός, καὶ τῷ καθημένῳ ἐπ’ αὐτὸν ἐδόθη αὐτῷ λαβεῖν τὴν εἰρήνην ἐκ τῆς γῆς ⸀καὶ ἵνα ἀλλήλους ⸀σφάξουσιν, καὶ ἐδόθη αὐτῷ μάχαιρα μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/004.yaml
  text: And another horse came out[a], fiery red; and to the one sitting on it, it was given to take peace from the earth, so that they would slaughter one another[c][b], and a great sword was given to him.
translation:
  language: sw
  text: Kisha farasi mwingine, mwekundu kama moto[a], akatoka. Yule aliyeketi juu yake akapewa kuiondoa amani duniani[b], ili watu wachinjane[c]. Naye akapewa upanga mkubwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “farasi mwekundu.” Neno la Kigiriki πυρρός hasa hudokeza rangi nyekundu kama ya moto.
    reason: lexical_alternative
  - marker: b
    text: Au “nchini.” Neno la Kigiriki γῆ linaweza kumaanisha “dunia” au “nchi”; hapa “dunia” inalingana na upeo mpana wa maono ya Ufunuo.
    reason: lexical_alternative
  - marker: c
    text: Kitenzi cha Kigiriki kilichotafsiriwa “wachinjane” ni chenye nguvu kuliko neno la kawaida la “kuuana”; kinaonyesha mauaji ya kikatili na umwagaji damu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλος
  choice: mwingine
  rationale: Katika mfululizo wa maono, neno hili humtambulisha farasi anayefuata na aliye tofauti na yule wa kwanza.
- source_word: ἵππος πυρρός
  choice: farasi mwingine, mwekundu kama moto
  rationale: πυρρός humaanisha rangi nyekundu inayofanana na moto. Kauli “mwekundu kama moto” ni ya kawaida katika Kiswahili na inadumisha taswira hiyo hai.
- source_word: τῷ καθημένῳ ἐπ’ αὐτὸν
  choice: Yule aliyeketi juu yake
  rationale: Hii inadumisha muundo wa kirai cha Kigiriki bila kuubadili kwa tafsiri ya kiufafanuzi zaidi kama “mpanda farasi.”
- source_word: ἐδόθη αὐτῷ
  choice: akapewa
  rationale: Kauli tendwa inadumishwa bila kumtaja mtoaji, sawa na mtindo unaorudiwa katika Ufunuo.
- source_word: λαβεῖν τὴν εἰρήνην ἐκ τῆς γῆς
  choice: kuiondoa amani duniani
  rationale: “Kuiondoa amani” hutoa kwa Kiswahili maana ya kuichukua amani isiwepo tena; “duniani” inafaa upeo mpana wa maono haya, huku uwezekano wa “nchini” ukitajwa katika tanbihi.
- source_word: ἵνα ἀλλήλους σφάξουσιν
  choice: ili watu wachinjane
  rationale: “Ili” huhifadhi uhusiano wa kusudi au matokeo bila kuulazimisha upande mmoja. “Wachinjane” huonyesha umwagaji damu wa kikatili ulio katika σφάζω na pia maana ya kutendeana.
- source_word: μάχαιρα μεγάλη
  choice: upanga mkubwa
  rationale: “Upanga” ni neno wazi na la kawaida kwa μάχαιρα katika taswira hii; “mkubwa” hudumisha μεγάλη bila kufafanua kama ukubwa wa kimwili pekee au umuhimu.
theological_decisions:
- issue: Kauli tendwa katika vifungu viwili vya ἐδόθη
  choice: Kutumia “akapewa” bila kumtaja aliyetoa
  alternative: “Mungu akampa” au “akapewa mamlaka”
  rationale: Andiko halimtaji mtoaji wala halitumii nomino “mamlaka.” Kauli tendwa huhifadhi dokezo la enzi au ruhusa ya Mungu bila kulifanya dokezo hilo kuwa tamko la wazi.
- issue: Uhusiano unaoonyeshwa na ἵνα
  choice: “ili watu wachinjane”
  alternative: “na matokeo yake watu wakachinjana”
  rationale: ἵνα inaweza kuonyesha kusudi au matokeo katika muktadha huu. “Ili” hudumisha mvutano huo kwa ufupi badala ya kuamua kwamba ni matokeo tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Sentensi zimegawanywa ili zisomeke kwa urahisi, huku marudio ya “akapewa” yakihifadhiwa kwa sababu ni sehemu ya mtindo wa kifungu.
