id: REV.6.16
reference: Revelation 6:16
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ λέγουσιν τοῖς ὄρεσιν καὶ ταῖς πέτραις· Πέσετε ἐφ’ ἡμᾶς καὶ κρύψατε ἡμᾶς ἀπὸ προσώπου τοῦ καθημένου ἐπὶ τοῦ θρόνου καὶ ἀπὸ τῆς ὀργῆς τοῦ ἀρνίου,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/016.yaml
  text: and they say to the mountains and to the rocks[a], “Fall on us and hide us from the face of the One seated on the throne and from the wrath of the Lamb,”
translation:
  language: sw
  text: nao wanaziambia milima na miamba, “Tuangukieni na mtufiche tusiuone uso wa Yule aliyeketi juu ya kiti cha enzi[a], wala ghadhabu ya Mwana-Kondoo,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtufiche tusimwone Yule aliyeketi juu ya kiti cha enzi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγουσιν
  choice: wanaiambia
  rationale: Wakati wa sasa wa Kigiriki umehifadhiwa kama wakati wa sasa wenye uhai katika simulizi ya kinabii. Muundo huu pia unaonyesha kwamba maneno yanaelekezwa kwa milima na miamba kwa pamoja.
- source_word: ὄρεσιν
  choice: milima
  rationale: ὄρος kwa kawaida humaanisha mlima; 'milima' huhifadhi ukubwa wa taswira kuliko 'vilima'.
- source_word: πέτραις
  choice: miamba
  rationale: πέτρα hapa ni miamba au majabali makubwa, si mawe madogo. 'Miamba' ni ya kawaida na inafaa kwa mahali pa kujisitiri.
- source_word: Πέσετε ἐφ’ ἡμᾶς
  choice: Tuangukieni
  rationale: Amri ya wingi yenye uharaka imehifadhiwa. Kiambishi '-ni' huonyesha tendo la kuanguka juu yao.
- source_word: κρύψατε ἡμᾶς
  choice: kutuficha
  rationale: Kitenzi hiki ni cha moja kwa moja na cha kawaida; uratibu na 'Tuangukieni' unaruhusu muundo wa 'na kutuficha' kueleza ombi la pili kwa ufasaha.
- source_word: ἀπὸ προσώπου
  choice: mbali na uso wa
  rationale: Tafsiri hii huhifadhi taswira halisi na ya kibinafsi ya πρόσωπον. Maana mbadala ya kuwapo mbele zake imewekwa katika tanbihi.
- source_word: τοῦ καθημένου ἐπὶ τοῦ θρόνου
  choice: Yule aliyeketi juu ya kiti cha enzi
  rationale: Huwakilisha kirai cha Kigiriki kinachomtaja mwenye kuketi, huku ikihifadhi hali yake ya kuwa ametawazwa.
- source_word: ὀργῆς
  choice: ghadhabu
  rationale: Katika muktadha wa hukumu, 'ghadhabu' hubeba uzito mkubwa kuliko 'hasira' ya kawaida.
- source_word: τοῦ ἀρνίου
  choice: Mwana-Kondoo
  rationale: Hili ni jina la Kikristo lililozoeleka katika Ufunuo na huhifadhi fumbo la yule mwenye hali ya dhabihu kuwa pia mwenye ghadhabu ya hukumu.
theological_decisions:
- issue: Wahusika wa hukumu katika taswira ya kiapokaliptiki
  choice: Kuhifadhi kwa kutofautisha lakini kuratibu 'Yule aliyeketi juu ya kiti cha enzi' na 'Mwana-Kondoo' kama wale ambao watu wanataka kufichwa mbali nao.
  alternative: Kuyafanya maneno hayo kuwa rejeo la jumla kwa Mungu pekee, au kulainisha 'ghadhabu ya Mwana-Kondoo'.
  rationale: 'Kigiriki kina virai viwili vilivyoratibiwa kwa ἀπό: kimoja kinamhusu Yule aliyeketi juu ya kiti cha enzi, na kingine Mwana-Kondoo. Tafsiri inahifadhi mvutano wa kitheolojia kwamba Mwana-Kondoo wa dhabihu pia anahusishwa na ghadhabu ya hukumu.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Miamba' huepuka wazo la mawe madogo; 'ghadhabu' huhifadhi uzito wa hukumu. Alama ya tanbihi imewekwa mara tu baada ya kirai kinachofafanuliwa.
