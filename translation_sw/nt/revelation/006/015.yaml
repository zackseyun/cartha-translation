id: REV.6.15
reference: Revelation 6:15
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ οἱ βασιλεῖς τῆς γῆς καὶ οἱ μεγιστᾶνες καὶ οἱ χιλίαρχοι καὶ οἱ πλούσιοι καὶ οἱ ἰσχυροὶ καὶ πᾶς δοῦλος καὶ ἐλεύθερος ἔκρυψαν ἑαυτοὺς εἰς τὰ σπήλαια καὶ εἰς τὰς πέτρας τῶν ὀρέων·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/015.yaml
  text: And the kings of the earth[a], and the great men, and the commanders, and the rich, and the strong, and every servant and free person[b], hid themselves in the caves and among the rocks of the mountains.
translation:
  language: sw
  text: Nao wafalme wa dunia, wakuu, makamanda wa jeshi, matajiri, wenye nguvu, na kila mtumwa na mtu huru[a], wakajificha katika mapango na miongoni mwa miamba ya milima.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kigiriki kinatumia jozi ya umoja wa kiume yenye maana ya uwakilishi: “kila mtumwa na mtu huru.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: βασιλεῖς τῆς γῆς
  choice: wafalme wa dunia
  rationale: Katika muktadha wa hukumu yenye upeo mpana katika Ufunuo, γῆ linaeleweka vizuri kuwa “dunia,” si eneo fulani la nchi.
- source_word: μεγιστᾶνες
  choice: wakuu
  rationale: Neno hili humaanisha watu wenye cheo au hadhi kubwa; “wakuu” ni la asili katika Kiswahili na halidokezi lazima tabaka la urithi.
- source_word: χιλίαρχοι
  choice: makamanda wa jeshi
  rationale: Ingawa kihalisi ni makamanda wa elfu, hapa cheo cha kijeshi kinaelezwa kwa njia wazi na ya kawaida bila kutumia istilahi ngeni.
- source_word: πλούσιοι
  choice: matajiri
  rationale: Hili ndilo neno la kawaida na fupi kwa watu wenye mali nyingi.
- source_word: ἰσχυροὶ
  choice: wenye nguvu
  rationale: Linahifadhi maana ya msingi ya nguvu au uwezo bila kulichanganya kabisa na hadhi ya kijamii.
- source_word: πᾶς δοῦλος καὶ ἐλεύθερος
  choice: kila mtumwa na mtu huru
  rationale: Tofauti kati ya utumwa na uhuru inaonyesha wazi hali za kijamii zinazopinganishwa. Umoja wa kisarufi una nguvu ya uwakilishi kwa watu wote.
- source_word: ἔκρυψαν ἑαυτοὺς
  choice: wakajificha
  rationale: Kitenzi cha kujirejelea “kujificha” kinawasilisha kwa kawaida maana ya kuficha nafsi zao.
- source_word: εἰς τὰ σπήλαια
  choice: katika mapango
  rationale: Baada ya “wakajificha,” Kiswahili cha kawaida hutumia “katika” kueleza mahali walipoingia na kujisitiri.
- source_word: εἰς τὰς πέτρας τῶν ὀρέων
  choice: miongoni mwa miamba ya milima
  rationale: Kauli hii inaeleza kujificha katikati ya miamba au mipasuko ya maeneo ya milimani kwa Kiswahili cha asili.
theological_decisions:
- issue: Utafsiri wa δοῦλος katika jozi ya mtumwa na mtu huru
  choice: mtumwa
  alternative: mtumishi
  rationale: Upinzani wa moja kwa moja na ἐλεύθερος unaonyesha kuwa hali ya kutokuwa huru ndiyo inayokusudiwa, hivyo “mtumwa” huhifadhi uzito wa kijamii wa maneno hayo.
- issue: Uwakilishi wa kijinsia katika πᾶς δοῦλος καὶ ἐλεύθερος
  choice: kila mtumwa na mtu huru
  alternative: kila mtumwa na mwanaume huru
  rationale: Ingawa Kigiriki kina maumbo ya umoja wa kiume, jozi hii ya kawaida ya kijamii ina nguvu ya uwakilishi na inawahusu watu wote; “mtu huru” haitilii mkazo jinsia ambayo muktadha hautaki kuibainisha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi na kinachoeleweka kwa urahisi. Orodha ya makundi ya kijamii imehifadhiwa, huku “makamanda wa jeshi” ikifafanua cheo cha kijeshi na “wakuu” ikiepuka maana finyu ya tabaka la kiurithi.
