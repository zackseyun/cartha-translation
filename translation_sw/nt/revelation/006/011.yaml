id: REV.6.11
reference: Revelation 6:11
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἐδόθη αὐτοῖς ἑκάστῳ στολὴ λευκή, καὶ ἐρρέθη αὐτοῖς ἵνα ⸀ἀναπαύσονται ἔτι χρόνον ⸀μικρόν, ἕως ⸀πληρωθῶσιν καὶ οἱ σύνδουλοι αὐτῶν καὶ οἱ ἀδελφοὶ ⸀αὐτῶν οἱ μέλλοντες ⸀ἀποκτέννεσθαι ὡς καὶ αὐτοί.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/011.yaml
  text: And a white robe was given to each of them[a], and they were told that they should rest a little longer, until their fellow servants and their brothers, who are about to be killed just as they were[c][b], should also be completed.
translation:
  language: sw
  text: Kila mmoja wao akapewa joho jeupe, nao wakaambiwa wapumzike kwa muda mfupi zaidi, mpaka watumwa wenzao na ndugu zao[b], ambao wanakaribia kuuawa, kama wao walivyouawa, watakapokamilishwa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mpaka watumwa wenzao na ndugu zao pia watimie,” au, “mpaka idadi kamili ya watumwa wenzao na ndugu zao itimie.” Kigiriki husema kwa ufupi, “mpaka ... wakamilishwe/watimizwe.”
    reason: alternative_reading
  - marker: b
    text: Neno la Kigiriki lililotafsiriwa “ndugu” lina umbo la wingi wa kiume, lakini hapa linaweza kutaja waumini wenzao kwa upana zaidi, wakiwemo wanawake.
    reason: lexical_alternative
lexical_decisions:
- source_word: στολὴ λευκή
  choice: joho jeupe
  rationale: στολή ni vazi refu au joho; “joho jeupe” ni Kiswahili cha kawaida na chenye hadhi kinachohifadhi taswira ya vazi.
- source_word: ἑκάστῳ
  choice: kila mmoja wao
  rationale: Huhifadhi maana ya mgawanyo kwa kila mtu mmoja mmoja.
- source_word: ἐρρέθη αὐτοῖς
  choice: wakaambiwa
  rationale: Ni usemi wa kawaida wa Kiswahili unaohifadhi hali ya kutendwa bila kumtaja msemaji.
- source_word: ἀναπαύσονται ἔτι χρόνον μικρόν
  choice: wapumzike kwa muda mfupi zaidi
  rationale: “Wapumzike” huhifadhi maana ya ἀναπαύω, na “kwa muda mfupi zaidi” huonyesha kwamba kipindi kingine kifupi bado kilibaki.
- source_word: πληρωθῶσιν
  choice: watakapokamilishwa
  rationale: Huhifadhi hali ya kutendwa na wazo pana la kukamilishwa bila kuongeza neno “idadi,” ambalo halipo wazi katika Kigiriki.
- source_word: σύνδουλοι
  choice: watumwa wenzao
  rationale: Huhifadhi uhusiano wa watu walio chini ya bwana yuleyule unaobebwa na σύνδουλοι, badala ya kuufifisha kuwa utumishi wa hiari tu.
- source_word: ἀδελφοί
  choice: ndugu zao
  rationale: “Ndugu” ni neno la asili na lenye upana katika Kiswahili; linaweza kutaja waumini wenzao bila kulazimisha jinsia ambayo muktadha hauifafanui kikamilifu.
- source_word: μέλλοντες ἀποκτέννεσθαι
  choice: ambao wanakaribia kuuawa
  rationale: Huonyesha tukio linalotarajiwa au lililo karibu bila kuongeza kwa lazima wazo kali la kuamuliwa tangu awali.
- source_word: ὡς καὶ αὐτοί
  choice: kama wao pia walivyouawa
  rationale: Huweka wazi kwa Kiswahili kwamba kulinganishwa ni kuuawa kwa wenzao na kuuawa kwao wenyewe.
theological_decisions:
- issue: Maana ya πληρωθῶσιν kuhusu watumwa wenzao na ndugu zao
  choice: watakapokamilishwa
  alternative: mpaka idadi kamili ya watumwa wenzao na ndugu zao itimie
  rationale: Kigiriki hakitaji “idadi” moja kwa moja. Tafsiri kuu inadumisha utata kati ya kukamilishwa kwa kundi na kutimia kwa idadi yake.
- issue: Upeo wa ἀδελφοί
  choice: ndugu zao
  alternative: ndugu zao wa kiume
  rationale: Ingawa Kigiriki kina umbo la wingi wa kiume, katika matumizi ya Kikristo neno linaweza kuhusisha jumuiya pana ya waumini. “Ndugu” katika Kiswahili huhifadhi maana hiyo bila kuongeza “wa kiume” au “wa kike.”
- issue: Taswira ya σύνδουλοι
  choice: watumwa wenzao
  alternative: watumishi wenzao
  rationale: “Watumwa wenzao” huhifadhi kwa uwazi zaidi hali ya kuwa chini ya bwana mmoja, ambayo ni muhimu katika taswira ya Ufunuo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa sasa, wenye hadhi na unaoeleweka. Mpangilio wa sentensi unaweka kishazi cha kuuawa karibu na “watumwa wenzao na ndugu zao,” huku tanbihi zikihifadhi utata wa πληρωθῶσιν.
