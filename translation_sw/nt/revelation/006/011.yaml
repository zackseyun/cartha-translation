  to: Kila mmoja wao akapewa joho jeupe, nao wakaambiwa wapumzike kwa muda mfupi zaidi, mpaka watumwa wenzao na ndugu zao[b], ambao wanakaribia kuuawa, kama wao walivyouawa, watakapokamilishwa[a].
