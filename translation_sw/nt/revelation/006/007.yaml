  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ ὅτε ἤνοιξεν τὴν σφραγῖδα τὴν τετάρτην, ἤκουσα ⸀φωνὴν τοῦ τετάρτου ζῴου λέγοντος· ⸀Ἔρχου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/007.yaml
  text: And when he opened the fourth seal[a], I heard the voice of the fourth living creature saying, “Come.”
translation:
  language: sw
  text: Alipofungua muhuri wa nne, nilisikia sauti ya kiumbe hai cha nne ikisema, “Njoo.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, labda, “Nenda mbele.” Kigiriki kinasema kwa maana ya moja kwa moja “Njoo,” lakini kuna maoni tofauti kuhusu ikiwa amri hii inaelekezwa kwa Yohana au kwa mpanda farasi.
    reason: alternative_reading
lexical_decisions:
- source_word: ἤνοιξεν
  choice: alipofungua
  rationale: 'Kitenzi cha wakati uliopita katika kishazi cha ὅτε kimetafsiriwa kwa muundo wa kawaida wa Kiswahili unaoonyesha tukio lililotangulia: “alipofungua.”'
- source_word: σφραγῖδα
  choice: muhuri
  rationale: “Muhuri” ni istilahi sahihi na iliyozoeleka kwa kifungo cha hati kinachofunguliwa katika muktadha huu wa Ufunuo.
- source_word: τετάρτην / τετάρτου
  choice: wa nne
  rationale: Namba ya mpangilio imetafsiriwa kwa namna ileile katika matukio yote mawili, huku upatanisho wa kisarufi ukifuata nomino husika.
- source_word: φωνὴν
  choice: sauti
  rationale: “Sauti” ni tafsiri ya kawaida ya φωνή; kirai “ya kiumbe hai wa nne” kinaitambulisha bila kuhitaji kibainishi tofauti katika Kiswahili.
- source_word: ζῴου
  choice: kiumbe hai
  rationale: Hutofautisha viumbe wa karibu na kiti cha enzi na wanyama wa kawaida au “mnyama” wa θηρίον.
- source_word: λέγοντος
  choice: ikisema
  rationale: Muundo huu wa Kiswahili huunganisha kwa kawaida “sauti” na maneno yaliyosikika, huku ukidumisha maana ya participio.
- source_word: Ἔρχου
  choice: Njoo
  rationale: Ni maana ya moja kwa moja ya amri ἔρχου na haimtaji anayeamriwa, hivyo utata wa chanzo unabaki.
theological_decisions:
- issue: Anayeambiwa amri Ἔρχου
  choice: Kutafsiri “Njoo” bila kumtaja anayeambiwa
  alternative: “Nenda mbele,” au kueleza wazi kuwa Yohana au mpanda farasi ndiye anayeambiwa
  rationale: Kigiriki hakimtaji anayeambiwa. Tafsiri ya moja kwa moja inadumisha utata wa simulizi na mvutano wa kiteolojia badala ya kuutatua kimafafanuzi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imeundwa kwa mtiririko wa kawaida wa simulizi; “kiumbe hai” inadumisha istilahi ya kiufunuo, na amri fupi “Njoo” inalinda utata wa maandishi ya Kigiriki.
