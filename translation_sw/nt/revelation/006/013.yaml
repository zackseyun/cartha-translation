  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ οἱ ἀστέρες τοῦ οὐρανοῦ ἔπεσαν εἰς τὴν γῆν, ὡς συκῆ ⸀βάλλει τοὺς ὀλύνθους αὐτῆς ὑπὸ ἀνέμου μεγάλου σειομένη,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/013.yaml
  text: and the stars of heaven fell to the earth[a], as a fig tree drops its unripe figs when shaken by a strong wind,
translation:
  language: sw
  text: na nyota za mbinguni zikaanguka duniani, kama vile mtini unavyodondosha tini zake ambazo hazijaiva[a] unapotikiswa na upepo mkali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “tini za majira ya baridi,” “tini mbichi,” au “tini za mwisho”; neno la Kigiriki linarejelea tini ambazo hazijakomaa na hudondoshwa kabla ya kuiva.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀστέρες
  choice: nyota
  rationale: Maana ya kawaida ni “nyota.” Taswira ya kiapokaliptiki imehifadhiwa bila kuifasiri kuwa viumbe wa kiroho au watawala.
- source_word: τοῦ οὐρανοῦ
  choice: za mbinguni
  rationale: “Mbinguni” inadumisha uzito wa taswira ya ulimwengu mzima katika Ufunuo, huku ikiendelea kuruhusu maana ya anga.
- source_word: ἔπεσαν εἰς τὴν γῆν
  choice: zikaanguka duniani
  rationale: Kitenzi cha wakati uliopita pamoja na εἰς kinaonyesha mwendo kuelekea duniani; usemi huu ni wa kawaida na wenye nguvu katika Kiswahili.
- source_word: ὡς
  choice: kama vile
  rationale: Huanzisha mlinganisho wazi na wa asili katika Kiswahili.
- source_word: συκῆ
  choice: mtini
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa mti wa tini.
- source_word: βάλλει
  choice: unavyodondosha
  rationale: Ingawa kitenzi kinaweza kumaanisha kutupa, katika muktadha wa matunda ya mti “kudondosha” ni cha asili na huonyesha matokeo ya kutikiswa.
- source_word: ὀλύνθους
  choice: tini zake ambazo hazijaiva
  rationale: Neno hilo linarejelea tini ambazo bado hazijakomaa na huweza kudondoshwa kabla ya kuiva; ufasiri huu unaeleweka wazi kwa wasomaji wa kisasa.
- source_word: ὑπὸ ἀνέμου μεγάλου
  choice: na upepo mkali
  rationale: “Upepo mkali” huwasilisha nguvu ya upepo kwa Kiswahili cha kawaida bila kupoteza maana ya μέγας.
- source_word: σειομένη
  choice: unapotikiswa
  rationale: Kauli tendwa ya wakati mmoja na tendo kuu imewasilishwa kwa njia ya asili, ikirejelea mtini.
theological_decisions:
- issue: Taswira ya kiapokaliptiki ya nyota kuanguka
  choice: Kuhifadhi taswira ya moja kwa moja “nyota za mbinguni zikaanguka duniani” bila maelezo ya kuifasiri.
  alternative: Kufasiri “nyota” kuwa viumbe wa kimalaika au watawala.
  rationale: Mstari unaweza kuwa na maana ya mfano, lakini tafsiri haipaswi kuamua utambulisho wa nyota. Taswira na mvutano wa kitheolojia wa maandishi ya chanzo vimehifadhiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na wa sasa. Muundo wa sentensi ni wa asili huku taswira ya kiapokaliptiki na mlinganisho wa maandishi ya Kigiriki vikihifadhiwa.
