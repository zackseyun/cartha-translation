  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ ὅτε ἤνοιξεν τὴν πέμπτην σφραγῖδα, εἶδον ὑποκάτω τοῦ θυσιαστηρίου τὰς ψυχὰς τῶν ἐσφαγμένων διὰ τὸν λόγον τοῦ θεοῦ καὶ διὰ τὴν ⸀μαρτυρίαν ἣν εἶχον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/009.yaml
  text: And when he opened the fifth seal[b][a], I saw under the altar the souls of those who had been slaughtered because of the word of God and because of the testimony they had.
translation:
  language: sw
  text: Na alipofungua muhuri wa tano, niliona chini ya madhabahu roho za wale waliokuwa wamechinjwa[a] kwa sababu ya neno la Mungu na kwa sababu ya ushuhuda[b] waliokuwa nao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “waliokuwa wameuawa.” Neno la Kigiriki lina nguvu ya kuchinja au kuua kikatili, na katika muktadha huu linaweza pia kuwa na mwangwi wa dhabihu.
    reason: lexical_alternative
  - marker: b
    text: Au, “ushahidi.” Neno la Kigiriki linaweza kumaanisha ushuhuda au ushahidi wa kile kilichoshuhudiwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤνοιξεν
  choice: alipofungua
  rationale: Hutoa maana ya kawaida ya ἀνοίγω katika mfululizo wa kufunguliwa kwa mihuri, bila kuongeza wazo la kuivunja.
- source_word: σφραγῖδα
  choice: muhuri
  rationale: Ni neno la kawaida na sahihi katika Kiswahili kwa picha ya muhuri katika fasihi ya maono.
- source_word: ὑποκάτω
  choice: chini ya
  rationale: Ni usemi wa kawaida wa mahali unaolingana moja kwa moja na maana ya neno la Kigiriki.
- source_word: θυσιαστηρίου
  choice: madhabahu
  rationale: Huhifadhi picha ya ibada na dhabihu bila kuamua ikiwa madhabahu hiyo ni ya mbinguni au ya duniani.
- source_word: ψυχὰς
  choice: roho
  rationale: Katika maono haya ya waliokufa walio chini ya madhabahu, ‘roho’ huhifadhi picha maalumu ya andiko bila kuigeuza kuwa kauli pana kuhusu hali ya mwanadamu.
- source_word: ἐσφαγμένων
  choice: waliokuwa wamechinjwa
  rationale: Kitenzi σφάζω kina nguvu kuliko ‘kuua’ na kinaweza kuwa na mwangwi wa dhabihu; ‘kuchinjwa’ huhifadhi maana hiyo pamoja na picha ya madhabahu.
- source_word: διὰ τὸν λόγον τοῦ θεοῦ
  choice: kwa sababu ya neno la Mungu
  rationale: διά pamoja na hali ya accusative hapa huonyesha sababu; usemi huu ni wazi na wa kawaida katika Kiswahili.
- source_word: μαρτυρίαν
  choice: ushuhuda
  rationale: Huhifadhi maana ya jambo waliloshuhudia au walilokiri, bila kulifanya moja kwa moja kuwa tendo la kutoa ushahidi.
- source_word: ἣν εἶχον
  choice: waliokuwa nao
  rationale: Ni tafsiri ya karibu ya kitenzi ‘walikuwa nao’ na haiongezi wazo la ‘kutoa’ au ‘kushikilia’ ambalo halijaelezwa wazi.
theological_decisions:
- issue: Maana ya ψυχὰς katika maono
  choice: Kutumia ‘roho’ katika matini kuu.
  alternative: ‘uhai’ au ‘watu’
  rationale: ‘Roho’ huhifadhi taswira ya waliokufa wanaoonekana chini ya madhabahu, lakini haitoi hitimisho la ziada kuhusu antropolojia au hali ya wafu nje ya maono haya.
- issue: Nguvu na mwangwi wa ἐσφαγμένων
  choice: Kutumia ‘waliokuwa wamechinjwa’.
  alternative: ‘waliokuwa wameuawa’
  rationale: ‘Kuchinjwa’ huhifadhi ukali wa kitenzi na mwangwi wake wa dhabihu unaopatana na picha ya madhabahu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umebaki karibu na sentensi ya Kigiriki huku ukisomeka kwa kawaida. Kiima cha ‘alipofungua’ hakijatajwa kwa jina ili kuhifadhi namna chanzo kinavyokitegemeza kwa muktadha.
