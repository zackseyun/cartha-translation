  text: Καὶ εἶδον ⸀ὅτε ἤνοιξεν τὸ ἀρνίον μίαν ἐκ τῶν ἑπτὰ σφραγίδων, καὶ ἤκουσα ἑνὸς ἐκ τῶν τεσσάρων ζῴων λέγοντος ὡς φωνῇ βροντῆς· ⸀Ἔρχου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/001.yaml
  text: And I saw when the Lamb opened one of the seven seals[a], and I heard one of the four living creatures saying with a voice like thunder, “Come.”
translation:
  language: sw
  text: Nikaona Mwanakondoo alipofungua muhuri mmoja kati ya ile mihuri saba, nami nikamsikia mmoja wa wale viumbe hai wanne akisema kwa sauti kama ya radi, “Njoo.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Toka,” ikiwa amri hii inaeleweka kuwa inaelekezwa kwa mpanda farasi badala ya Yohana.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀρνίον
  choice: Mwanakondoo
  rationale: Katika Ufunuo, neno hili linatumika kama cheo cha Kikristo cha Yesu. “Mwanakondoo” ni tafsiri ya kawaida na yenye heshima bila kusisitiza isivyohitajika maana ya udogo.
- source_word: μίαν ἐκ τῶν ἑπτὰ σφραγίδων
  choice: muhuri mmoja kati ya ile mihuri saba
  rationale: Muundo huu unaonyesha sehemu moja kutoka katika jumla ya saba; Kiswahili hiki ni cha asili na huhifadhi maana hiyo.
- source_word: ζῴων
  choice: viumbe hai
  rationale: Hapa neno hili linataja viumbe wa chumba cha enzi, si wanyama wa kawaida. “Viumbe hai” huepuka maana finyu ya kinyama.
- source_word: ὡς φωνῇ βροντῆς
  choice: kwa sauti kama ya radi
  rationale: Tafsiri hii huhifadhi ulinganisho wa sauti ya kiumbe huyo na radi kwa Kiswahili cha kawaida.
- source_word: Ἔρχου
  choice: Njoo
  rationale: Amri hii kwa maana yake ya moja kwa moja ni “Njoo.” Kwa kuwa anayelengwa hatajwi wazi, tafsiri kuu haongezi ufafanuzi; uwezekano wa “Nenda” umewekwa katika tanbihi.
- source_word: ὅτε
  choice: wakati ... alipofungua
  rationale: Huonyesha wakati wa kile Yohana alichoona bila kukifanya kitendo hicho kiwe cha baadaye au cha kabla.
- source_word: εἶδον
  choice: nikaona
  rationale: Umbo la simulizi limetafsiriwa kwa kitenzi rahisi kinachoendeleza mfuatano wa matukio.
- source_word: ἤκουσα
  choice: nikamsikia
  rationale: Tafsiri ya kawaida katika simulizi; kiambishi cha yambwa kinaelekezwa kwa mmoja wa wale viumbe hai.
- source_word: λέγοντος
  choice: akisema
  rationale: Huhifadhi maana rahisi ya kusema bila kuongeza wazo la kupaza sauti, ambalo halimo wazi katika kitenzi hiki.
theological_decisions:
- issue: Anayelengwa na maana ya amri Ἔρχου
  choice: “Njoo,” bila kumtaja anayelengwa katika matini kuu
  alternative: “Nenda,” ikiwa amri inaeleweka kuwa inaelekezwa kwa mpanda farasi badala ya Yohana
  rationale: Kigiriki hakimtaji wazi anayelengwa, na maana ya moja kwa moja ya amri ni “Njoo.” Kuacha jambo hilo wazi huhifadhi utata halisi wa matini badala ya kuamua tafsiri yake kimbele.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa simulizi umetumia “kisha nikaona” na “nami nikamsikia” kwa mtiririko wa kawaida; istilahi “Mwanakondoo,” “muhuri,” na “viumbe hai” zinafaa muktadha wa Ufunuo.
