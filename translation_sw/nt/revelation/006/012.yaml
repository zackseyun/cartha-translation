id: REV.6.12
reference: Revelation 6:12
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ εἶδον ὅτε ἤνοιξεν τὴν σφραγῖδα τὴν ἕκτην, καὶ σεισμὸς μέγας ἐγένετο, καὶ ὁ ἥλιος ⸂ἐγένετο μέλας⸃ ὡς σάκκος τρίχινος, καὶ ἡ σελήνη ὅλη ἐγένετο ὡς αἷμα,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/012.yaml
  text: And I saw when he opened the sixth seal[a], and there was a great earthquake, and the sun became black like sackcloth made of hair, and the whole moon became like blood,
translation:
  language: sw
  text: Nikaona alipofungua muhuri wa sita, kukawa na tetemeko kubwa la ardhi; jua likawa jeusi kama gunia la singa[a], na mwezi wote ukawa kama damu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kama gunia la nywele”; hapa ni kitambaa kigumu cha gunia kilichofumwa kwa singa, ambacho kwa kawaida kilihusishwa na maombolezo.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδον
  choice: nikaona
  rationale: Kitenzi hiki katika Ufunuo hutambulisha jambo aliloliona Yohana katika maono; “nikaona” ni tafsiri ya kawaida na ya asili katika masimulizi ya Kiswahili.
- source_word: ὅτε ἤνοιξεν
  choice: alipofungua
  rationale: Muundo huu unaonyesha wakati tendo lilipotokea na kuhifadhi mhusika wa umoja bila kumtaja zaidi kuliko Kigiriki.
- source_word: σφραγῖδα τὴν ἕκτην
  choice: muhuri wa sita
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya nomino pamoja na namba ya mpangilio.
- source_word: σεισμὸς μέγας ἐγένετο
  choice: kukawa na tetemeko kubwa la ardhi
  rationale: σεισμός hapa inaeleweka kwa kawaida kuwa tetemeko la ardhi; “kukawa na” huwasilisha kwa Kiswahili cha asili maana ya tukio lililotokea.
- source_word: ὁ ἥλιος ἐγένετο μέλας
  choice: jua likawa jeusi
  rationale: μέλας humaanisha “jeusi,” si “lenye giza” tu, na “likawa” huhifadhi maana ya mabadiliko iliyo katika ἐγένετο.
- source_word: ὡς σάκκος τρίχινος
  choice: kama nguo ya gunia iliyotengenezwa kwa manyoya
  rationale: ὡς huhifadhi tashbihi; σάκκος ni nguo nzito ya gunia, na τρίχινος inaeleza kwamba ilitengenezwa kwa manyoya. Tafsiri haiongezi kwamba yalikuwa manyoya ya mbuzi, kwa kuwa Kigiriki hakitaji mnyama.
- source_word: ἡ σελήνη ὅλη
  choice: mwezi wote
  rationale: Huhifadhi msisitizo wa ὅλη kwamba mwezi kwa ujumla wake ulionekana hivyo, huku ikiepuka “mwezi mzima,” ambayo kwa Kiswahili inaweza kueleweka hasa kuwa awamu ya mwezi mpevu.
- source_word: ἐγένετο ὡς αἷμα
  choice: ukawa kama damu
  rationale: Neno ὡς linaonyesha ulinganisho; mwezi ulikuwa kama damu, bila kudai kwamba uligeuka kihalisi kuwa damu.
theological_decisions:
- issue: Asili ya ishara za anga
  choice: Taswira imetafsiriwa moja kwa moja kama jambo la kinabii lililoonekana katika maono, bila kuamua ikiwa ni tukio halisi la anga, ishara, au vyote viwili.
  alternative: Kuzitafsiri waziwazi ama kama maafa halisi ya anga ya nyakati za mwisho ama kama alama tu za hukumu ya Mungu na misukosuko ya kisiasa.
  rationale: Kigiriki kinatoa taswira kali kwa kutumia ulinganisho “kama,” lakini hakitatui mjadala mpana wa jinsi ishara hizo zinavyopaswa kufasiriwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imegawanywa baada ya “muhuri wa sita” ili mlolongo wa maono usomeke kwa urahisi bila kupoteza uhusiano wa matukio. Alama ya tanbihi imewekwa baada ya kirai kinachohusika moja kwa moja, yaani nguo ya gunia ya manyoya.
