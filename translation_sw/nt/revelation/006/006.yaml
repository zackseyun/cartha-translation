id: REV.6.6
reference: Revelation 6:6
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἤκουσα ⸀ὡς φωνὴν ἐν μέσῳ τῶν τεσσάρων ζῴων λέγουσαν· Χοῖνιξ σίτου δηναρίου, καὶ τρεῖς χοίνικες ⸀κριθῶν δηναρίου· καὶ τὸ ἔλαιον καὶ τὸν οἶνον μὴ ἀδικήσῃς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/006.yaml
  text: And I heard what seemed to be a voice in the midst of the four living creatures[a], saying, “A quart of wheat for a denarius, and three quarts of barley for a denarius[c][b]; and do not harm the oil and the wine.”
translation:
  language: sw
  text: Nikasikia kitu kilichokuwa kama sauti katikati ya wale viumbe hai wanne, kikisema, “Lita moja hivi ya ngano kwa dinari moja[a], na lita tatu hivi za shayiri kwa dinari moja[b]; wala usidhuru mafuta ya zeituni na divai[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dinari kwa kawaida ilikuwa malipo ya siku moja kwa mfanyakazi; bei hizi zinaonyesha upungufu mkubwa wa chakula.
    reason: cultural_note
  - marker: b
    text: Neno la Kigiriki χοῖνιξ linataja kipimo kikavu cha karibu lita moja, ambacho mara nyingi kilitosha kuwa mgao wa nafaka wa mtu mmoja kwa siku.
    reason: cultural_note
  - marker: c
    text: Au “usiharibu mafuta ya zeituni na divai.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς φωνὴν
  choice: kitu kama sauti
  rationale: Kauli hii inaonyesha jinsi Yohana alivyoisikia sauti bila kuamua kwa uhakika utambulisho wa msemaji; pia inadumisha maana ya kufanana iliyomo katika ὡς.
- source_word: ἐν μέσῳ τῶν τεσσάρων ζῴων
  choice: katikati ya wale viumbe hai wanne
  rationale: “Katikati ya” inawasilisha mahali panapoonyeshwa na ἐν μέσῳ, na “viumbe hai” inawatofautisha viumbe hawa wa karibu na kiti cha enzi na wale wanyama wakali wanaotokea baadaye katika Ufunuo.
- source_word: Χοῖνιξ
  choice: lita moja hivi
  rationale: χοῖνιξ ilikuwa kipimo kikavu cha karibu lita moja. Kipimo cha lita kinaeleweka kwa wasomaji wa Afrika Mashariki, huku “hivi” kikiepuka kudai usawa kamili.
- source_word: σίτου
  choice: ngano
  rationale: σῖτος hapa ni ngano, ikilinganishwa moja kwa moja na shayiri.
- source_word: δηναρίου
  choice: kwa dinari moja
  rationale: Hii inawasilisha hali ya umilikishi inayoonyesha bei, huku jina la sarafu ya kale likihifadhiwa.
- source_word: τρεῖς χοίνικες κριθῶν
  choice: lita tatu hivi za shayiri
  rationale: Kipimo kimerudiwa kwa uthabiti katika mfumo unaoeleweka, na κριθαί ni shayiri.
- source_word: μὴ ἀδικήσῃς
  choice: usidhuru
  rationale: ἀδικέω inaweza kumaanisha kutenda isivyo haki, kudhuru, au kuharibu. “Usidhuru” inadumisha upana wake huku ikifaa kwa mazao yanayotajwa.
- source_word: τὸ ἔλαιον
  choice: mafuta ya zeituni
  rationale: Katika mazingira haya ἔλαιον ni mafuta ya zeituni; kutaja zeituni huzuia “mafuta” kueleweka kwa upana mno katika Kiswahili cha sasa.
- source_word: τὸν οἶνον
  choice: divai
  rationale: Hili ni neno la kawaida, la sasa, na lenye heshima kwa οἶνος.
theological_decisions:
- issue: Utambulisho wa sauti katikati ya viumbe hai
  choice: kitu kama sauti
  alternative: sauti iliyotoka katikati ya viumbe hai
  rationale: Matini haisemi wazi msemaji ni nani wala kwamba sauti “ilitoka” hapo. Tafsiri iliyochaguliwa inadumisha mtazamo wa kimafumbo na tahadhari ya ὡς.
- issue: Tafsiri ya ζῴων katika taswira ya kiti cha enzi
  choice: viumbe hai
  alternative: wanyama
  rationale: “Viumbe hai” inafaa kwa viumbe wa maono walio karibu na kiti cha enzi na haichanganyi taswira yao na wanyama wakali wenye uhasama wanaotokea baadaye.
- issue: Kiwango cha ubainishaji wa kipimo na sarafu za kale
  choice: Kubadili χοῖνιξ kuwa takriban lita moja, lakini kuhifadhi dinari
  alternative: Kutohariri istilahi zote mbili na kusema koiniksi na dinari
  rationale: “Lita moja hivi” huwasilisha ujazo kwa njia inayoeleweka bila kudai usahihi bandia; dinari imehifadhiwa kwa sababu thamani yake ya kihistoria na uhusiano wake na mshahara wa siku moja huelezwa vizuri katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wa heshima, na unaosomeka kwa urahisi. “Kikisema” kinapatana kisarufi na “kitu,” huku “kitu kama sauti” kikihifadhi hali ya Yohana kutotaja msemaji kwa uhakika. “Lita ... hivi” ni ulinganisho wa kipimo, si ubadilishaji unaodai usawa kamili.
