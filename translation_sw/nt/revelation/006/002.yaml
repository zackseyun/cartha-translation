- from: Kisha nikaona, na tazama, farasi mweupe! Yule aliyekuwa amempanda[b] alikuwa na upinde. Akapewa taji[a], naye akatoka akishinda na ili ashinde.
  to: Nikaona, na tazama, farasi mweupe! Yule aliyeketi juu yake[b] alikuwa na upinde. Akapewa taji[a], naye akatoka akishinda, ili ashinde.
  rationale: The revision replaces a perfect-like expression for mounting with wording that directly represents the rider as seated on the horse. It also makes the final purpose clause idiomatic while preserving the Greek contrast between going out conquering and the following ἵνα clause. No identity or theological interpretation has been introduced.
