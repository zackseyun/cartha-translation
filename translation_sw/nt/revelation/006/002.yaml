id: REV.6.2
reference: Revelation 6:2
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ⸂εἶδον, καὶ⸃ ἰδοὺ ἵππος λευκός, καὶ ὁ καθήμενος ἐπ’ αὐτὸν ἔχων τόξον, καὶ ἐδόθη αὐτῷ στέφανος, καὶ ἐξῆλθεν νικῶν καὶ ἵνα νικήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/002.yaml
  text: And I looked[a], and behold, a white horse, and the one sitting on it had a bow, and a crown was given to him[b], and he went out conquering and to conquer.
translation:
  language: sw
  text: Nikaona, na tazama, farasi mweupe! Yule aliyeketi juu yake[b] alikuwa na upinde. Akapewa taji[a], naye akatoka akishinda, ili ashinde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “taji la mshindi.” Neno la Kigiriki στέφανος mara nyingi humaanisha shada au taji linalohusishwa na ushindi, si lazima taji la kifalme.
    reason: lexical_alternative
  - marker: b
    text: Andiko halitaji mpanda farasi huyu ni nani. Amefasiriwa kwa njia mbalimbali.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶδον
  choice: nikaona
  rationale: Kitenzi hiki humaanisha kuona; katika mfululizo wa maono, “nikaona” ni cha kawaida, wazi, na kinadumisha mtazamo wa Yohana.
- source_word: ἰδοὺ
  choice: tazama
  rationale: “Tazama” huhifadhi mwito wa ghafla wa kuelekeza fikira na uzito wa lugha ya maono bila kutumia Kiswahili cha kizamani.
- source_word: ἵππος λευκός
  choice: farasi mweupe
  rationale: Hii ni tafsiri ya moja kwa moja ya kirai hicho na inamtambulisha farasi anayeonekana kwa mara ya kwanza katika maono.
- source_word: ὁ καθήμενος ἐπ’ αὐτὸν
  choice: yule aliyekuwa amempanda
  rationale: Katika Kiswahili, “kumpanda farasi” ni njia ya asili ya kueleza kuketi juu yake; kirai hiki hakiongezi utambulisho wowote wa mpanda farasi.
- source_word: ἔχων τόξον
  choice: alikuwa na upinde
  rationale: Huhifadhi maana ya kuwa na silaha hiyo bila kudai kwa lazima kwamba alikuwa ameishika kwa mkono wakati huo.
- source_word: ἐδόθη αὐτῷ στέφανος
  choice: akapewa taji
  rationale: Muundo wa kutendwa unahifadhi kwamba taji hilo alipewa, huku mtendaji akibaki bila kutajwa kama katika Kigiriki.
- source_word: ἐξῆλθεν
  choice: akatoka
  rationale: Ni tafsiri fupi na ya kawaida ya tendo la kutoka katika mfululizo wa simulizi.
- source_word: νικῶν
  choice: akishinda
  rationale: Hali ya kuendelea ya kitenzi-shirikishi inawasilishwa kama tendo linaloambatana na kutoka kwake.
- source_word: ἵνα νικήσῃ
  choice: na ili ashinde
  rationale: “Ili” hudumisha wazi nguvu ya kusudi inayowezekana katika ἵνα pamoja na hali tegemezi, badala ya kuifanya tu kuwa marudio ya “akishinda.”
theological_decisions:
- issue: Utambulisho wa aliyempanda farasi mweupe
  choice: Tafsiri haimtambulishi mpanda farasi.
  alternative: Aweza kufasiriwa kuwa Kristo au mfano wake, mtawala au dola yenye kushinda, au mpinga Kristo/mshindi mdanganyifu.
  rationale: Andiko la Kigiriki linaeleza silaha, taji, na matendo yake lakini halitaji yeye ni nani; hivyo tafsiri haipaswi kuamua mjadala huo.
- issue: Nguvu ya ἵνα νικήσῃ
  choice: “ili ashinde,” ikionyesha kusudi
  alternative: “hata akashinde,” ikiweza kusisitiza matokeo
  rationale: ἵνα pamoja na hali tegemezi inaweza kuonyesha kusudi au matokeo. Tafsiri kuu inatumia maana ya kusudi, huku kutokuwepo kwa kikomo au mlengwa wa ushindi kukiachwa kama katika chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kifasihi lakini kinachoeleweka kwa msomaji wa kawaida. “Tazama” huhifadhi msisimko wa maono. Muundo “akishinda na ili ashinde” umeachwa kwa makusudi ili kudumisha tofauti ya Kigiriki kati ya tendo linaloendelea na kusudi, ingawa una uradidi wa kimtindo.
