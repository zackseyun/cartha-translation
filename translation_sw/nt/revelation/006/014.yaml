  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ὁ οὐρανὸς ἀπεχωρίσθη ὡς βιβλίον ἑλισσόμενον, καὶ πᾶν ὄρος καὶ νῆσος ἐκ τῶν τόπων αὐτῶν ἐκινήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/014.yaml
  text: And the sky vanished like a scroll being rolled up[c][b][a], and every mountain and island was moved from its place.
translation:
  language: sw
  text: Kisha anga ikatengana kama gombo linaloviringishwa[a], na kila mlima na kila kisiwa vilihamishwa kutoka mahali pake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “anga likaondoka” au “anga likatoweka.” Kitenzi cha Kigiriki kinaweza kumaanisha kutengana au kujiondoa/kuondoka.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐρανὸς
  choice: anga
  rationale: Katika maono haya ya misukosuko ya ulimwengu, neno hili linaelekea kumaanisha anga linaloonekana kuliko makao ya Mungu; “anga” ni la kawaida na lenye hadhi katika Kiswahili.
- source_word: ἀπεχωρίσθη
  choice: ikatengana
  rationale: Kitenzi kinaweza kueleza kutengwa, kuachana, au kuondoka. “Ikatengana” huhifadhi taswira ya anga kugawanyika bila kulazimisha maana ya kutoweka kabisa.
- source_word: βιβλίον
  choice: hati
  rationale: Katika mazingira ya karne ya kwanza, neno hili humaanisha hati iliyokunjwa, si kitabu cha kisasa chenye kurasa zilizofungwa. Pamoja na “ya kukunjwa,” “hati” huwasilisha taswira hiyo kwa Kiswahili cha asili.
- source_word: ἑλισσόμενον
  choice: ya kukunjwa
  rationale: 'Hii ni hali ya tendo linaloendelea: hati inakunjwa au kuviringishwa. Usemi huu ni wazi na wa kawaida.'
- source_word: πᾶν ὄρος καὶ νῆσος
  choice: kila mlima na kisiwa
  rationale: 'πᾶν pamoja na nomino za umoja ina maana ya mgawanyo: kila mlima na kila kisiwa.'
- source_word: ἐκ τῶν τόπων αὐτῶν
  choice: mahali pake
  rationale: Ingawa Kigiriki kina wingi, Kiswahili hutumia umoja wa mgawanyo baada ya “kila”; kila kimoja kiliondolewa mahali pake.
- source_word: ἐκινήθησαν
  choice: vikaondolewa
  rationale: Katika muktadha wa kuhamishwa kutoka mahali, kitenzi kinaonyesha kubadilishwa mahali, si kutikisika tu.
theological_decisions:
- issue: Istilahi ya ulimwengu katika maono ya kiapokaliptiki
  choice: Kutafsiri οὐρανός kuwa “anga”
  alternative: “mbingu”
  rationale: “Anga” huelekeza kwenye eneo linaloonekana juu ya dunia na huepuka kudokeza bila lazima kwamba makao ya Mungu ndiyo yanayobadilishwa.
- issue: Jinsi anga lilivyotendewa
  choice: Kutafsiri ἀπεχωρίσθη kwa maana ya kutengana
  alternative: “likatoweka” au “likaondoka”
  rationale: Kigiriki kinaweza kumaanisha kutengwa au kuondoka. “Ikatengana” huhifadhi utata na taswira ya hati inayokunjwa bila kuamua kwamba anga liliangamizwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Hati ya kukunjwa” limetumiwa badala ya “kitabu” ili kuonyesha kifaa cha kale kilichoviringishwa. Upatanisho wa “vikaondolewa” unafuata nomino mbili za ngeli tofauti zilizounganishwa, huku “mahali pake” ikiwa umoja wa mgawanyo baada ya “kila”.
