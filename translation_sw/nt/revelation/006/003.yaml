  yaml_path: translation/nt/revelation/006/003.yaml
  text: And when he opened the second seal[a], I heard the second living creature saying, “Come.”
translation:
  language: sw
  text: Alipofungua muhuri wa pili, nikamsikia kiumbe hai cha pili akisema, “Njoo.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Nenda.” Baadhi huelewa kuwa amri hii inaelekezwa kwa mpanda farasi, badala ya kuwa mwito wa kuja mbele.
    reason: alternative_reading
lexical_decisions:
- source_word: Καὶ
  choice: (haijatafsiriwa kwa neno tofauti)
  rationale: Katika Kiswahili, mtiririko wa simulizi unaendelea kwa kawaida bila kuanza kwa kiunganishi “Na”; uhusiano wa matukio umehifadhiwa katika tungo ya wakati.
- source_word: ὅτε ἤνοιξεν
  choice: Alipofungua
  rationale: Muundo wa Kiswahili unaunganisha kiunganishi cha wakati na kitenzi kwa kawaida, huku ukihifadhi maana ya “wakati alipofungua,” si “alipovunja.”
- source_word: τὴν σφραγῖδα τὴν δευτέραν
  choice: muhuri wa pili
  rationale: Hii ndiyo njia ya kawaida na wazi ya kuonyesha muhuri wa pili katika mfululizo.
- source_word: ἤκουσα
  choice: nikamsikia
  rationale: Hutoa maana ya kusikia katika simulizi na kiambishi cha yambwa humrejelea kiumbe hai anayesema.
- source_word: τοῦ δευτέρου ζῴου
  choice: kiumbe hai wa pili
  rationale: “Kiumbe hai” huepuka kumfanya aeleweke kuwa mnyama wa kawaida na inafaa kwa viumbe walio karibu na kiti cha enzi katika Ufunuo.
- source_word: λέγοντος
  choice: akisema
  rationale: Huhifadhi tendo la kusema lililoambatana na kusikia kwa Kiswahili cha kawaida.
- source_word: Ἔρχου
  choice: Njoo
  rationale: Maana ya moja kwa moja ya amri hii ni “Njoo”; uwezekano wa kimuktadha wa “Nenda” umewekwa katika tanbihi.
theological_decisions:
- issue: Maana ya Ἔρχου katika kufunguliwa kwa muhuri
  choice: Njoo
  alternative: Nenda
  rationale: “Njoo” ndiyo maana ya kawaida ya kitenzi cha Kigiriki. Kwa kuwa muktadha hauweki wazi kabisa anayelengwa na amri hiyo, tafsiri haiondoi mvutano huo; uwezekano mwingine umetajwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni mfupi na wa kisimulizi. Alama ya tanbihi imewekwa mara baada ya kauli inayohusika.
