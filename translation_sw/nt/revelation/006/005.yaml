  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ ὅτε ἤνοιξε τὴν σφραγῖδα τὴν τρίτην, ἤκουσα τοῦ τρίτου ζῴου λέγοντος· Ἔρχου. καὶ ⸀εἶδον, καὶ ἰδοὺ ἵππος μέλας, καὶ ὁ καθήμενος ἐπ’ αὐτὸν ἔχων ζυγὸν ἐν τῇ χειρὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/005.yaml
  text: And when he opened the third seal[a], I heard the third living creature saying, “Come.” And I looked, and behold, a black horse[b], and the one sitting on it had a pair of scales in his hand.
translation:
  language: sw
  text: Naye alipofungua muhuri wa tatu, nikamsikia kiumbe hai cha tatu akisema, “Njoo.”[a] Nikaangalia, na tazama, farasi mweusi! Yule aliyeketi juu yake alikuwa na mizani[b] mkononi mwake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Njoo huku.” Amri hii inaweza kueleweka kuwa inaelekezwa kwa Yohana, au kuwa inamwita farasi pamoja na mpandaji wake.
    reason: alternative_reading
  - marker: b
    text: Neno la Kigiriki pia linaweza kumaanisha “nira”; lakini katika muktadha huu yaelekea linamaanisha mizani iliyotumiwa kupimia chakula.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤνοιξε
  choice: alipofungua
  rationale: Kitenzi hiki kinatafsiri kwa kawaida tendo la kufungua muhuri; muundo wa wakati ‘alipofungua’ unaunganisha tukio hili kwa mtiririko wa maono.
- source_word: σφραγῖδα τὴν τρίτην
  choice: muhuri wa tatu
  rationale: Tafsiri ya moja kwa moja inayohifadhi mpangilio wa mihuri katika maono.
- source_word: ζῴου
  choice: kiumbe hai
  rationale: Katika Ufunuo neno hili linawataja viumbe walio hai wanaozunguka kiti cha enzi, si wanyama wa kawaida.
- source_word: Ἔρχου
  choice: Njoo
  rationale: Amri fupi imehifadhiwa bila kutaja anayeambiwa, kwa kuwa Kigiriki hakumtaji wazi.
- source_word: εἶδον
  choice: Nikaangalia
  rationale: Ingawa kitenzi kinaweza kumaanisha ‘nikaona,’ ‘nikaangalia’ huleta kwa kawaida hatua ya maono kabla ya ἰδού na huepuka marudio yasiyo ya lazima.
- source_word: ἰδοὺ
  choice: na tazama
  rationale: Inahifadhi nguvu ya usemi wa kuvuta fikira katika maono ya kinabii.
- source_word: ἵππος μέλας
  choice: farasi mweusi
  rationale: Tafsiri ya moja kwa moja inayohifadhi rangi yenye umuhimu katika picha ya maono.
- source_word: ὁ καθήμενος ἐπ’ αὐτὸν
  choice: Yule aliyekuwa amempanda
  rationale: Inafuata kwa karibu usemi wa Kigiriki unaomtaja yule aliyeketi juu ya farasi, huku ikiwa ya kawaida katika Kiswahili.
- source_word: ζυγὸν
  choice: mizani
  rationale: Katika muktadha wa kupima mgao wa chakula katika mstari unaofuata, neno linamaanisha kifaa cha kupimia uzito, si nira.
- source_word: ἐν τῇ χειρὶ αὐτοῦ
  choice: mkononi mwake
  rationale: Tafsiri ya moja kwa moja na ya kawaida katika Kiswahili.
theological_decisions:
- issue: Anayeamriwa na neno Ἔρχου
  choice: Amri imetafsiriwa tu kuwa ‘Njoo’ bila kumtaja anayeambiwa.
  alternative: Inaweza kueleweka kuwa Yohana anaagizwa aje, au farasi na mpandaji wake wanaitwa watokee.
  rationale: Kigiriki kinamwacha anayeambiwa bila kutajwa; tafsiri inahifadhi utata huo badala ya kuutatua kwa tafsiri ya kiufafanuzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. Muundo wa maono umehifadhiwa, pamoja na amri fupi na usemi wa kuvuta fikira ‘tazama.’
