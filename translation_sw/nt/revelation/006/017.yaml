  yaml_path: translation/nt/revelation/006/017.yaml
  text: because the great day of their wrath has come[a], and who is able to stand?
translation:
  language: sw
  text: kwa maana siku kuu ya ghadhabu yao imefika[a], na ni nani anayeweza kusimama?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya tafsiri za kiufafanuzi husema “ghadhabu yake”; Kigiriki kinasema “ghadhabu yao,” kikirejelea kwa pamoja Yeye aliyeketi kwenye kiti cha enzi na Mwanakondoo.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: kwa maana
  rationale: Kiunganishi hiki kinaonyesha sababu ya hofu iliyoelezwa katika mstari uliotangulia; “kwa maana” ni cha kawaida na chenye hadhi katika Kiswahili.
- source_word: ἦλθεν
  choice: imefika
  rationale: Kauli hiyo inaonyesha tukio ambalo sasa limetimia na matokeo yake yapo; “imefika” ni ya asili kwa kuja kwa siku iliyotarajiwa.
- source_word: ἡ ἡμέρα ἡ μεγάλη
  choice: siku kuu
  rationale: Huhifadhi uzito wa usemi wa kieskatolojia kwa Kiswahili cha kawaida bila kufuata mpangilio wa Kigiriki kwa namna isiyo ya asili.
- source_word: τῆς ὀργῆς
  choice: ya ghadhabu
  rationale: “Ghadhabu” inafaa kwa hasira kali yenye muktadha wa hukumu kuliko neno la kawaida “hasira.”
- source_word: αὐτῶν
  choice: yao
  rationale: Huhifadhi kiwakilishi cha wingi cha Kigiriki kinachorejelea Yeye aliyeketi kwenye kiti cha enzi na Mwanakondoo, bila kuondoa mvutano wa kisarufi na kiteolojia.
- source_word: τίς
  choice: ni nani
  rationale: Hutoa swali la balagha kwa Kiswahili cha asili na wazi.
- source_word: δύναται
  choice: anayeweza
  rationale: Huonyesha uwezo kwa uwazi huku ikifungamana kwa kawaida na “ni nani.”
- source_word: σταθῆναι
  choice: kusimama
  rationale: Huhifadhi maana ya msingi; katika muktadha wa hukumu inadokeza kubaki imara au kustahimili bila kuongeza ufafanuzi ndani ya matini.
theological_decisions:
- issue: Kiwakilishi cha wingi kinachoambatana na “ghadhabu” na kurejelea Yeye aliyeketi kwenye kiti cha enzi pamoja na Mwanakondoo
  choice: Kuhifadhi usemi wa wingi “ghadhabu yao”
  alternative: Kutafsiri “ghadhabu yake” kwa kuunganisha utendaji wa hukumu kuwa wa mhusika mmoja
  rationale: Kigiriki kinasema wazi αὐτῶν, “yao,” kikirejelea wahusika wawili waliotajwa katika Ufunuo 6:16. Tafsiri inapaswa kuhifadhi mvutano huo na tendo lao la pamoja la hukumu badala ya kuupatanisha kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. “Kwa maana,” “ghadhabu,” na swali “ni nani anayeweza kusimama?” hudumisha uzito wa tamko la hukumu bila kuwa la kizamani.
