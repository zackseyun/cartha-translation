review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the causal ὅτι, the realized arrival of the day, the judicial force of ὀργή, and especially the plural αὐτῶν (‘their’). However, ‘naye’ introduces a third-person referent (‘and he/she’) that is absent from καί and is not appropriate before the rhetorical question.
  naturalness: ‘Kwa maana siku kuu ya ghadhabu yao imefika’ is clear and suitably solemn in Standard East African Swahili. Replacing ‘naye ni nani’ with ‘na ni nani’ gives the ordinary, source-faithful coordination and natural rhetorical question.
  terminology: ‘Ghadhabu’ appropriately conveys divine judicial wrath; ‘siku kuu’ preserves the eschatological weight; and ‘kusimama’ retains the intentionally unexpanded sense of standing/enduring. The footnote correctly preserves the plural reference to the enthroned one and the Lamb.
  issues:
  - severity: medium
    issue: ‘naye’ in the final clause
    rationale: Greek καί means simply ‘and.’ In Swahili, ‘naye’ normally means ‘and he/she also’ and implies a singular personal subject. ‘Na ni nani anayeweza kusimama?’ accurately and naturally renders καὶ τίς δύναται σταθῆναι.
  revised_text: kwa maana siku kuu ya ghadhabu yao imefika[a], na ni nani anayeweza kusimama?
