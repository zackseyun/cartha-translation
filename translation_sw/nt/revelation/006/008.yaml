id: REV.6.8
reference: Revelation 6:8
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ⸂εἶδον, καὶ⸃ ἰδοὺ ἵππος χλωρός, καὶ ὁ καθήμενος ἐπάνω αὐτοῦ ὄνομα αὐτῷ ὁ Θάνατος, καὶ ὁ ᾅδης ἠκολούθει ⸂μετ’ αὐτοῦ⸃, καὶ ἐδόθη ⸀αὐτοῖς ἐξουσία ἐπὶ τὸ τέταρτον τῆς γῆς, ἀποκτεῖναι ἐν ῥομφαίᾳ καὶ ἐν λιμῷ καὶ ἐν θανάτῳ καὶ ὑπὸ τῶν θηρίων τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/008.yaml
  text: And I looked, and behold, a pale green horse, and the name of the one seated on it was Death, and Hades was following with him. And authority was given to them over a fourth of the earth, to kill with sword and with famine and with pestilence and by the wild beasts of the earth.
translation:
  language: sw
  text: Kisha nikaona, na tazama, farasi wa rangi ya kijani iliyofifia[a]. Yule aliyeketi juu yake aliitwa Kifo, na Kuzimu ilikuwa ikimfuata. Nao wakapewa mamlaka juu ya robo ya dunia, kuua kwa upanga, kwa njaa, kwa tauni[b], na kwa wanyama wa mwitu wa dunia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “farasi mwenye rangi iliyofifia.” Neno la Kigiriki χλωρός kimsingi humaanisha rangi ya kijani au kijani kilichofifia, na linaweza kudokeza rangi ya mtu mgonjwa au maiti.'
    reason: lexical_alternative
  - marker: b
    text: 'Au: “kwa kifo.” Hapa “tauni” inaonyesha maana ya kimethali ya θανάτῳ katika orodha ya hukumu inayotoa mwangwi wa Ezekieli 14.'
    reason: alternative_reading
lexical_decisions:
- source_word: χλωρός
  choice: wa kijani kilichofifia
  rationale: Neno hili huonyesha rangi ya kijani au kijani kilichofifia; hapa linadokeza pia rangi yenye kufisha. Tafsiri hii inalinda maana ya rangi badala ya kuisema tu kuwa hafifu.
- source_word: ὁ καθήμενος ἐπάνω αὐτοῦ
  choice: yule aliyeketi juu yake
  rationale: Hufuata wazi muundo wa Kigiriki huku ikiwa Kiswahili cha kawaida na chenye kueleweka.
- source_word: ὄνομα αὐτῷ ὁ Θάνατος
  choice: aliitwa Kifo
  rationale: Ni namna ya asili ya Kiswahili ya kueleza kwamba jina la aliyeketi juu ya farasi lilikuwa Kifo.
- source_word: Θάνατος
  choice: Kifo
  rationale: Kifo kimewasilishwa kama mhusika mwenye jina, hivyo herufi kubwa inaonyesha uhuishaji huo.
- source_word: ᾅδης
  choice: Kuzimu
  rationale: Kuzimu hapa ni makao ya wafu, tofauti na hukumu ya mwisho; neno hili huepuka kuitafsiri moja kwa moja kuwa jehanamu.
- source_word: μετ’ αὐτοῦ
  choice: ikimfuata
  rationale: Ingawa μετά kwa kawaida ni 'pamoja naye,' kitenzi cha kufuata kinafanya maana ya kuandamana nyuma yake iwe ya asili katika Kiswahili.
- source_word: ἐδόθη αὐτοῖς ἐξουσία
  choice: wakapewa mamlaka
  rationale: Mamlaka huonyesha haki au uwezo uliokabidhiwa, na hali ya kutendwa inadumisha wazo kwamba walipewa na mwingine.
- source_word: ἐπὶ τὸ τέταρτον τῆς γῆς
  choice: juu ya robo ya dunia
  rationale: Robo ni usemi wa kawaida wa sehemu moja kati ya nne, na dunia inafaa upeo mpana wa tukio.
- source_word: ἀποκτεῖναι
  choice: kuua
  rationale: Ni tafsiri ya moja kwa moja, ya sasa, na inayoeleweka kwa urahisi.
- source_word: ἐν ῥομφαίᾳ
  choice: kwa upanga
  rationale: Kwa upanga huonyesha chombo au njia ya kuua na kudumisha mfuatano wa sentensi.
- source_word: ἐν λιμῷ
  choice: kwa njaa
  rationale: Katika muktadha wa hukumu, njaa hapa ni ukosefu mkubwa wa chakula, yaani baa la njaa.
- source_word: ἐν θανάτῳ
  choice: kwa tauni
  rationale: Katika orodha za hukumu zinazolingana na Ezekieli 14, 'kifo' kinaweza kutumika kwa maana ya tauni au maradhi ya kuambukiza; tanbihi inalinda tafsiri halisi.
- source_word: ὑπὸ τῶν θηρίων τῆς γῆς
  choice: kwa wanyama wakali wa dunia
  rationale: Hutofautisha θηρία na wanyama kwa jumla na kueleza wazi chanzo cha mauaji.
theological_decisions:
- issue: Maana ya ᾅδης
  choice: Kuzimu
  alternative: makao ya wafu; kaburi; jehanamu
  rationale: Kifungu kinatofautisha Kifo, mpanda farasi aliyehuishwa, na Kuzimu inayomfuata. 'Jehanamu' ingeweza kuingiza wazo la hukumu ya mwisho lisilosemwa moja kwa moja hapa.
- issue: Maana ya ἐν θανάτῳ katika orodha ya hukumu
  choice: kwa tauni
  alternative: kwa kifo
  rationale: Mwangwi wa orodha ya hukumu katika Ezekieli unaunga mkono maana ya kimethali ya tauni. Hata hivyo, maana halisi ya 'kifo' imehifadhiwa katika tanbihi ili kutoficha utata wa neno.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa maono na hali ya kutendwa vimehifadhiwa bila lugha ya kizamani isiyo ya lazima.
