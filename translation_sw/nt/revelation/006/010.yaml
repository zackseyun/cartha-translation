id: REV.6.10
reference: Revelation 6:10
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἔκραξαν φωνῇ μεγάλῃ λέγοντες· Ἕως πότε, ὁ δεσπότης ὁ ἅγιος καὶ ἀληθινός, οὐ κρίνεις καὶ ἐκδικεῖς τὸ αἷμα ἡμῶν ἐκ τῶν κατοικούντων ἐπὶ τῆς γῆς;
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/010.yaml
  text: And they cried out with a loud voice[a], saying, “How long, Master, holy and true[b], will you refrain from judging and avenging our blood on those who dwell on the earth?”
translation:
  language: sw
  text: Nao wakapaza sauti kwa sauti kubwa, wakisema, “Mpaka lini, Ee Mtawala, uliye mtakatifu na wa kweli, hutawahukumu wale wanaokaa duniani na kulipiza kisasi kwa sababu ya damu yetu?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “...kulipiza kisasi kwa sababu ya damu yetu kutoka kwa wale wanaokaa duniani.” Kirai cha Kigiriki kinaweza kuonyesha wale ambao kisasi kinatolewa dhidi yao au wale ambao kisasi kinadaiwa kutoka kwao. “Wale wanaokaa duniani” ni usemi unaorudiwa katika Ufunuo.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔκραξαν φωνῇ μεγάλῃ
  choice: wakapaza sauti kwa nguvu
  rationale: Usemi huu wa kawaida wa Kiswahili unaonyesha kilio cha sauti kubwa na cha dharura bila kuwa mzito kama tafsiri ya neno kwa neno.
- source_word: Ἕως πότε
  choice: Mpaka lini
  rationale: Huu ndio usemi wa kawaida wa Kiswahili katika ombi la maombolezo kuhusu hatua iliyocheleweshwa.
- source_word: δεσπότης
  choice: Mtawala Mkuu
  rationale: Huhifadhi wazo la mamlaka kamili na kutofautisha cheo hiki na κύριος, ambacho kwa kawaida hutafsiriwa “Bwana.”
- source_word: ἅγιος καὶ ἀληθινός
  choice: uliye mtakatifu na wa kweli
  rationale: Hutoa sifa zote mbili moja kwa moja na kwa mwito wa asili katika Kiswahili.
- source_word: οὐ κρίνεις καὶ ἐκδικεῖς
  choice: hutahukumu na kulipiza kisasi
  rationale: Wakati uliopo wa Kigiriki katika swali hili unaelekea kwenye hatua inayosubiriwa; muundo wa Kiswahili unaonyesha ombi kuhusu kuchelewa kwa hukumu bila kulainisha wazo la kisasi cha haki.
- source_word: τὸ αἷμα ἡμῶν
  choice: damu yetu
  rationale: Huhifadhi nahau ya kibiblia inayorejelea kuuawa kwao kwa nguvu.
- source_word: ἐκ τῶν κατοικούντων ἐπὶ τῆς γῆς
  choice: dhidi ya wale wanaokaa duniani
  rationale: “Dhidi ya” huonyesha kwa kawaida walengwa wa hukumu na kisasi, huku “wale wanaokaa duniani” ikihifadhi usemi wa mada unaorudiwa katika Ufunuo.
theological_decisions:
- issue: Cheo cha Mungu δεσπότης
  choice: Mtawala Mkuu
  alternative: Bwana Mwenye Enzi
  rationale: “Mtawala Mkuu” huonyesha mamlaka kamili na kuepuka kufuta tofauti ya kileksia kati ya δεσπότης na κύριος. “Bwana Mwenye Enzi” pia inawezekana lakini inaingiza “Bwana,” neno lisilopo moja kwa moja hapa.
- issue: Nguvu ya ombi la wafia imani kuhusu haki
  choice: hutahukumu na kulipiza kisasi kwa ajili ya damu yetu
  alternative: hutahukumu na kuitetea damu yetu
  rationale: Kitenzi ἐκδικέω katika muktadha huu kinahusu adhabu ya haki kwa umwagaji damu. Tafsiri haipunguzi mvutano wa ombi lao, wala hailifanyi kuwa ruhusa ya kisasi binafsi.
- issue: Uhusiano wa ἐκ na wakazi wa dunia
  choice: dhidi ya wale wanaokaa duniani
  alternative: kutoka kwa wale wanaokaa duniani
  rationale: Kirai kinaweza kuonyesha chanzo au walengwa wa kulipiziwa kisasi. Matini kuu hutumia Kiswahili cha kawaida kinachoonyesha walengwa, na tanbihi huhifadhi uwezekano wa muundo wa karibu zaidi na Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Ee” huweka wazi mwito wa moja kwa moja; “wakapaza sauti kwa nguvu” ni ya kawaida na inaonyesha uzito wa kilio. Tanbihi moja tu imetumiwa, na alama yake [a] imo katika matini kuu.
