id: REV.9.4
reference: Revelation 9:4
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἐρρέθη αὐταῖς ἵνα μὴ ⸀ἀδικήσουσιν τὸν χόρτον τῆς γῆς οὐδὲ πᾶν χλωρὸν οὐδὲ πᾶν δένδρον, εἰ μὴ τοὺς ἀνθρώπους οἵτινες οὐκ ἔχουσι τὴν σφραγῖδα τοῦ θεοῦ ἐπὶ τῶν ⸀μετώπων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/004.yaml
  text: And they were told not to harm the grass of the earth[a], or any green thing, or any tree, but only the people who do not have the seal of God on their foreheads.
translation:
  language: sw
  text: Nao wakaambiwa wasidhuru majani ya nchi, wala kitu chochote cha kijani, wala mti wowote, bali wawadhuru tu watu ambao hawana muhuri wa Mungu juu ya vipaji vya uso wao.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐρρέθη αὐταῖς
  choice: wakaambiwa
  rationale: Muundo wa kutendwa pamoja na kiwakilishi cha yambwa unaelezwa kwa Kiswahili cha kawaida bila kumtaja msemaji ambaye Kigiriki hakumtaji.
- source_word: ἵνα μὴ ἀδικήσουσιν
  choice: wasidhuru
  rationale: Katika muktadha huu wa hukumu, ἀδικέω ina maana ya kuleta madhara; “kudhuru” ni ya asili na yenye upeo unaofaa.
- source_word: τὸν χόρτον τῆς γῆς
  choice: majani ya dunia
  rationale: χόρτος hapa ni majani au uoto wa chini; “majani ya dunia” huhifadhi uhusiano wa maneno na upeo wa maono.
- source_word: οὐδὲ πᾶν χλωρόν
  choice: wala kitu chochote cha kijani
  rationale: χλωρόν ni kivumishi kilichotumika kama nomino, yaani kitu cha kijani; tafsiri hii haiibani kimya kimya kuwa mmea pekee.
- source_word: οὐδὲ πᾶν δένδρον
  choice: wala mti wowote
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya δένδρον katika mfululizo wa vitu vya uoto.
- source_word: εἰ μὴ τοὺς ἀνθρώπους
  choice: bali wawadhuru tu watu
  rationale: εἰ μή huonyesha wale pekee walioruhusiwa kudhuriwa; kitenzi kimerudiwa kwa uwazi wa Kiswahili, na ἀνθρώπους ni watu kwa jumla, si wanaume pekee.
- source_word: τὴν σφραγῖδα τοῦ θεοῦ
  choice: muhuri wa Mungu
  rationale: “Muhuri” huhifadhi taswira muhimu ya alama ya umiliki au ulinzi wa Mungu katika Ufunuo.
- source_word: ἐπὶ τῶν μετώπων
  choice: kwenye vipaji vya nyuso zao
  rationale: μέτωπον ni kipaji cha uso; umbo la wingi linafuata watu wanaotajwa.
theological_decisions:
- issue: Upeo wa ἀνθρώπους
  choice: watu kwa jumla
  alternative: wanaume
  rationale: Muktadha unatofautisha uoto na wanadamu wenye muhuri au wasiokuwa nao; hakuna kizuizi cha kuwahusu wanaume pekee.
- issue: Msemaji wa agizo la kutendwa
  choice: msemaji hakutajwa
  alternative: kutaja wazi kuwa Mungu ndiye aliyewaamuru
  rationale: ἐρρέθη ni muundo wa kutendwa unaomwacha msemaji bila kutajwa; tafsiri haiongezi mhusika ambaye matini haimtaji.
- issue: Walengwa wa madhara baada ya εἰ μή
  choice: wawadhuru tu watu wasiokuwa na muhuri
  alternative: isipokuwa watu wasiokuwa na muhuri
  rationale: Kurudia kitenzi huweka wazi katika Kiswahili kwamba watu hao ndio pekee wanaoruhusiwa kudhuriwa, bila kubadili nguvu ya kauli.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi huhifadhi urudiaji wa “wala” na tofauti kati ya uoto na watu. Hakuna tanbihi iliyohitajika; “kitu chochote cha kijani” huhifadhi upana wa πᾶν χλωρόν katika matini yenyewe.
