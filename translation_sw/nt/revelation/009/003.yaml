reference: Revelation 9:3
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἐκ τοῦ καπνοῦ ἐξῆλθον ἀκρίδες εἰς τὴν γῆν, καὶ ἐδόθη αὐταῖς ἐξουσία ὡς ἔχουσιν ἐξουσίαν οἱ σκορπίοι τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/003.yaml
  text: And out of the smoke came locusts onto the earth[a], and authority was given to them, as the scorpions of the earth have authority.
translation:
  language: sw
  text: Na kutoka katika moshi wakatoka nzige, wakaja juu ya dunia; nao wakapewa mamlaka[a] kama vile nge wa duniani walivyo na mamlaka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nguvu.” Neno la Kigiriki linaweza kumaanisha mamlaka, haki, au uwezo; “mamlaka” limetumiwa hapa kuonyesha ruhusa au uwezo waliokabidhiwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τοῦ καπνοῦ
  choice: katika moshi
  rationale: Kihusishi ἐκ kinaonyesha kutoka ndani ya moshi; muundo wa Kiswahili pamoja na kitenzi ‘wakatoka’ unahifadhi taswira hiyo kwa kawaida.
- source_word: ἐξῆλθον
  choice: wakatoka
  rationale: Huwasilisha moja kwa moja mwendo wa kutoka na kuendeleza mfululizo wa matukio kwa kiunganishi ‘waka-’.
- source_word: ἀκρίδες
  choice: nzige
  rationale: Hili ndilo neno la kawaida na sahihi la Kiswahili kwa ἀκρίδες katika muktadha wa kibiblia na wa kinabii.
- source_word: εἰς τὴν γῆν
  choice: wakaenda juu ya dunia
  rationale: Huhifadhi mwelekeo wa εἰς kuelekea duniani; ‘dunia’ linafaa zaidi hapa kuliko ‘nchi,’ na ‘juu ya’ linaonyesha walifika kwenye uso wake.
- source_word: ἐδόθη αὐταῖς ἐξουσία
  choice: wakapewa mamlaka
  rationale: ‘Mamlaka’ huonyesha uwezo au ruhusa iliyokabidhiwa. Muundo wa kutendwa unahifadhi kutotajwa kwa mtoaji katika Kigiriki.
- source_word: ὡς ἔχουσιν ἐξουσίαν
  choice: kama vile ... walivyo na mamlaka
  rationale: Muundo huu unaonyesha ulinganisho wa ὡς na kurudia ‘mamlaka’ kama Kigiriki kinavyorudia ἐξουσία.
- source_word: οἱ σκορπίοι τῆς γῆς
  choice: nge wa duniani
  rationale: Ni Kiswahili cha asili kinachohifadhi tofauti kati ya nzige waliotoka katika moshi na nge walio duniani bila kuifanya genitivi kuwa nzito.
theological_decisions:
- issue: Asili ya uwezo waliopewa nzige
  choice: Kutafsiri ἐξουσία kuwa ‘mamlaka’ na kudumisha ‘wakapewa’ bila kumtaja mtoaji.
  alternative: Kutumia ‘nguvu’ au kumtaja Mungu waziwazi kuwa mtoaji.
  rationale: Kigiriki kinaweza kumaanisha mamlaka, haki, au uwezo, lakini muundo wa kutendwa unaelekea kwenye ruhusa iliyotolewa. Kutomtaja mtoaji kunahifadhi tahadhari na utata wa maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Wakatoka ... wakaenda’ huepuka muundo usio wa kawaida ‘wakatoka juu ya dunia’ na bado huhifadhi kutoka ndani ya moshi na kuelekea duniani.
