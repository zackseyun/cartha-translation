  text: καὶ ὁ ἀριθμὸς τῶν στρατευμάτων τοῦ ⸀ἱππικοῦ ⸀δισμυριάδες μυριάδων· ἤκουσα τὸν ἀριθμὸν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/016.yaml
  text: And the number of the troops of the cavalry was two hundred million; I heard their number.
translation:
  language: sw
  text: Na idadi ya vikosi vya wapanda farasi ilikuwa milioni mia mbili[a]; niliisikia idadi yao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki, kwa maana halisi, “makumi elfu mawili ya makumi elfu,” yaani milioni mia mbili.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀριθμὸς
  choice: idadi
  rationale: Neno hili lina maana ya idadi au jumla; “idadi” ni la kawaida na linaweza kurudiwa kama katika Kigiriki.
- source_word: στρατευμάτων
  choice: vikosi
  rationale: Wingi huu unarejelea makundi ya kijeshi; “vikosi” ni Kiswahili cha kawaida na kinafaa pamoja na “wapanda farasi.”
- source_word: ἱππικοῦ
  choice: wapanda farasi
  rationale: Hurejelea jeshi la askari wanaopigana wakiwa juu ya farasi. “Wapanda farasi” ni wazi zaidi kwa msomaji wa kawaida kuliko istilahi ya kijeshi “kavaleria.”
- source_word: δισμυριάδες μυριάδων
  choice: milioni mia mbili
  rationale: Kirai hicho kinawakilisha mara mbili ya elfu kumi mara elfu kumi, yaani 200,000,000. Namba ya kisasa huwasilisha maana kwa uwazi, huku muundo halisi ukihifadhiwa katika tanbihi.
- source_word: ἤκουσα
  choice: niliisikia
  rationale: Ni kitenzi cha masimulizi katika wakati uliopita; kiambishi “-i-” kinarejelea idadi iliyotajwa.
- source_word: αὐτῶν
  choice: yao
  rationale: Kiwakilishi hiki kinarejelea vikosi vya wapanda farasi na kwa kawaida huwasilishwa kwa umilikishi “yao.”
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Wapanda farasi” limetumiwa badala ya istilahi ya mkopo “kavaleria” ili mstari ueleweke kwa urahisi bila kupoteza maana ya kijeshi.
