  text: Καὶ τὰ ὁμοιώματα τῶν ἀκρίδων ὅμοια ἵπποις ἡτοιμασμένοις εἰς πόλεμον, καὶ ἐπὶ τὰς κεφαλὰς αὐτῶν ὡς στέφανοι ⸂ὅμοιοι χρυσῷ⸃, καὶ τὰ πρόσωπα αὐτῶν ὡς πρόσωπα ἀνθρώπων,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/007.yaml
  text: And the appearance of the locusts was like horses prepared for battle[a], and on their heads were what seemed to be crowns like gold, and their faces were like human faces[b],
translation:
  language: sw
  text: Mwonekano wa nzige hao ulikuwa kama wa farasi walioandaliwa kwa vita, na juu ya vichwa vyao kulikuwa na taji zilizokuwa kama dhahabu[a], na nyuso zao zilikuwa kama nyuso za wanadamu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “shada za ushindi”; neno la Kigiriki στέφανοι linaweza kumaanisha taji au shada linalohusishwa na heshima au ushindi.
    reason: lexical_alternative
  - marker: b
    text: Kigiriki, “nyuso za wanadamu”; usemi huo unawahusu binadamu kwa ujumla, si wanaume pekee.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμοιώματα
  choice: mwonekano
  rationale: Neno hili linaweza kumaanisha umbo, mfano, au mwonekano. Hapa linaanzisha maelezo ya kile kinachoonekana katika maono, bila kudai kuwa nzige hao walikuwa farasi kihalisi.
- source_word: ἀκρίδων
  choice: nzige
  rationale: Hii ndiyo maana ya kawaida ya ἀκρίς na inafaa pia katika muktadha huu wa maono.
- source_word: ὅμοια ἵπποις ἡτοιμασμένοις εἰς πόλεμον
  choice: kama wa farasi walioandaliwa kwa vita
  rationale: Muundo huu huhifadhi ulinganisho na hali ya farasi kuwa tayari kwa mapigano.
- source_word: στέφανοι
  choice: taji
  rationale: στέφανος ni taji au shada la heshima, mara nyingi likihusishwa na ushindi. ‘Taji’ ni neno la kawaida na linaloeleweka; maana mahususi zaidi imewekwa katika tanbihi.
- source_word: ὅμοιοι χρυσῷ
  choice: zilizofanana na dhahabu
  rationale: Maneno ya Kigiriki yanaonyesha kufanana na dhahabu, si lazima kwamba taji hizo zilitengenezwa kwa dhahabu.
- source_word: πρόσωπα ἀνθρώπων
  choice: nyuso za wanadamu
  rationale: ἄνθρωπος limetumiwa kwa maana ya jumla ya binadamu, si wanaume pekee.
theological_decisions:
- issue: Lugha ya ulinganisho katika maono ya kiapokaliptiki
  choice: 'Kuhifadhi viashiria vya ulinganisho: ‘kama,’ ‘vitu kama,’ na ‘zilizofanana na’'
  alternative: Kueleza nzige hao, taji, na dhahabu kana kwamba ni vitu halisi bila ulinganisho
  rationale: Aya hutumia ὅμοια na ὡς mara kadhaa. Tafsiri hii inadumisha hali ya maono na haifanyi taswira hiyo kuwa halisi kuliko inavyosema matini.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaoeleweka kwa urahisi. ‘Mwonekano’ hudumisha hali ya kile kilichoonekana katika maono, huku miundo ya ‘kama’ ikihifadhi ulinganisho unaorudiwa katika Kigiriki.
