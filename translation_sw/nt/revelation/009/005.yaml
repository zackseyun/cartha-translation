reference: Revelation 9:5
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἐδόθη ⸀αὐτοῖς ἵνα μὴ ἀποκτείνωσιν αὐτούς, ἀλλ’ ἵνα ⸀βασανισθήσονται μῆνας πέντε· καὶ ὁ βασανισμὸς αὐτῶν ὡς βασανισμὸς σκορπίου, ὅταν παίσῃ ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/005.yaml
  text: And it was given to them that they should not kill them[a], but that they should be tormented for five months[b]; and their torment was like the torment of a scorpion when it strikes a man.
translation:
  language: sw
  text: Nao wakapewa ruhusa, si ya kuwaua, bali ili wateswe kwa miezi mitano; na mateso yao yalikuwa kama mateso ya nge inapomchoma mtu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐδόθη αὐτοῖς
  choice: wakapewa
  rationale: Huhifadhi kauli tendwa bila kumtaja wazi mtoaji, huku Kiswahili kikionyesha kwa kawaida kwamba walipewa ruhusa au uwezo.
- source_word: ἵνα μὴ ἀποκτείνωσιν αὐτούς
  choice: wasiwaue
  rationale: 'Huwasilisha kwa ufupi na kwa kawaida kusudi au mpaka uliowekwa: kutowaua watu waliotajwa katika muktadha.'
- source_word: ἀλλ’ ἵνα βασανισθήσονται
  choice: bali wawatie matesoni
  rationale: Ingawa Kigiriki kina umbo tendwa lisilo la kawaida baada ya ἵνα, muktadha unaonyesha kwamba mawakala hao ndio wanaosababisha mateso. Kiswahili cha kutenda kinaweka uhusiano huo wazi bila kuongeza mhusika mpya.
- source_word: μῆνας πέντε
  choice: kwa miezi mitano
  rationale: Hueleza muda unaoendelea kwa Kiswahili cha kawaida.
- source_word: βασανισθήσονται / βασανισμός
  choice: wawatie matesoni / mateso
  rationale: Mzizi wa neno umerudiwa kadiri inavyowezekana ili kudumisha mshikamano wa Kigiriki; “mateso” yanaonyesha maumivu makali bila kubana maana kuwa adhabu ya kisheria.
- source_word: ὁ βασανισμὸς αὐτῶν
  choice: mateso waliyosababisha
  rationale: Kiwakilishi αὐτῶν kinaweza kuhusishwa na mateso yao au mateso wanayosababisha; muktadha wa mawakala wanaowatesa watu unaunga mkono maana ya mateso wanayosababisha.
- source_word: ὡς βασανισμὸς σκορπίου
  choice: kama maumivu ya nge
  rationale: Katika ulinganisho wa nge, “maumivu” ni Kiswahili cha asili zaidi kuliko kurudia “mateso,” huku kikihifadhi nguvu ya picha.
- source_word: ὅταν παίσῃ
  choice: inapomchoma
  rationale: παίω kimsingi ni kupiga, lakini kwa nge tendo linalokusudiwa kimuktadha ni kuchoma; “choma” ndiyo kauli ya kawaida na dhahiri katika Kiswahili.
- source_word: ἄνθρωπον
  choice: mtu
  rationale: ἄνθρωπος hapa ina maana ya jumla ya mwanadamu; “mtu” huhifadhi umoja na maana jumuishi ya neno.
theological_decisions:
- issue: Kauli tendwa kuhusu mamlaka katika hukumu ya kiapokaliptiki
  choice: wakapewa
  alternative: Mungu akawapa ruhusa
  rationale: Kigiriki hakimtaji mtoaji. Kutomtaja Mungu wazi kunahifadhi utata wa makusudi na mvutano kati ya enzi ya Mungu na utendaji wa mawakala wa hukumu.
- issue: Mhusika anayepata mateso katika ἀλλ’ ἵνα βασανισθήσονται
  choice: wawatie matesoni
  alternative: bali wateswe
  rationale: Umbo la Kigiriki baada ya ἵνα si la kawaida, lakini viwakilishi na muktadha vinaelekeza kwa watu kutendewa na mawakala hao. Tafsiri tendaji ni ya kawaida zaidi katika Kiswahili na haitaji chanzo kipya cha tendo.
- issue: Maana ya jumla ya ἄνθρωπον
  choice: mtu
  alternative: mwanamume
  rationale: Katika muktadha huu neno linawakilisha binadamu yeyote, si jinsia ya kiume pekee; “mtu” ni sahihi kimaana na kisarufi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imehifadhi kauli tendwa ya “wakapewa” na taswira kali ya nge, huku ikiepuka lugha ya kale au ya kimadhehebu.
