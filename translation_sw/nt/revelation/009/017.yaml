id: REV.9.17
reference: Revelation 9:17
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ οὕτως εἶδον τοὺς ἵππους ἐν τῇ ὁράσει καὶ τοὺς καθημένους ἐπ’ αὐτῶν, ἔχοντας θώρακας πυρίνους καὶ ὑακινθίνους καὶ θειώδεις· καὶ αἱ κεφαλαὶ τῶν ἵππων ὡς κεφαλαὶ λεόντων, καὶ ἐκ τῶν στομάτων αὐτῶν ἐκπορεύεται πῦρ καὶ καπνὸς καὶ θεῖον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/017.yaml
  text: And this is how I saw the horses in the vision, and those sitting on them[a]—they had breastplates fiery red and hyacinth-blue and sulfur-yellow; and the heads of the horses were like lions’ heads[b], and out of their mouths come fire and smoke and sulfur.
translation:
  language: sw
  text: Ndivyo nilivyowaona farasi katika maono, na wale walioketi juu yao, wakiwa na dirii za kifuani za rangi ya moto, ya samawati iliyokolea, na ya kiberiti; vichwa vya farasi vilikuwa kama vichwa vya simba, na katika vinywa vyao hutoka moto, moshi, na kiberiti.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως
  choice: hivi
  rationale: Huwasilisha namna ambavyo Yohana aliwaona farasi kwa Kiswahili cha kawaida, huku ikidumisha nguvu ya kielezi ya neno la Kigiriki.
- source_word: ἐν τῇ ὁράσει
  choice: katika maono
  rationale: Katika muktadha wa Ufunuo, kifungu hiki kinarejelea tukio la kinabii aliloonyeshwa, si mwonekano wa kawaida tu.
- source_word: καθημένους ἐπ’ αὐτῶν
  choice: wale walioketi juu yao
  rationale: Tafsiri hii inahifadhi umbo la wazi la kirai cha Kigiriki badala ya kukifupisha kuwa ‘wapanda-farasi.’
- source_word: θώρακας
  choice: dirii za kifuani
  rationale: ‘Dirii’ ni neno la kawaida la silaha ya kujikinga, na ‘za kifuani’ huweka wazi sehemu inayolindwa.
- source_word: πυρίνους
  choice: zenye rangi kama moto
  rationale: Neno linaweza kumaanisha za moto, zenye kuwaka, au zenye rangi ya moto; uundaji huu unahifadhi taswira bila kuibana iwe nyekundu pekee.
- source_word: ὑακινθίνους
  choice: yakuti samawati
  rationale: Hurejelea rangi inayohusishwa na jiwe au ua linaloitwa hyacinth/jacinth, kwa kawaida samawati iliyokolea au samawati yenye urujuani; ‘yakuti samawati’ ni ya kueleweka zaidi katika Kiswahili.
- source_word: θειώδεις
  choice: kiberiti
  rationale: Katika orodha ya mwonekano wa dirii, neno linaonyesha sifa au rangi inayohusishwa na kiberiti; tafsiri haiongezi ‘njano’ kana kwamba ndiyo maana pekee.
- source_word: ὡς κεφαλαὶ λεόντων
  choice: kama vichwa vya simba
  rationale: Huhifadhi ulinganisho wa moja kwa moja wa Kigiriki kwa lugha ya kawaida ya Kiswahili.
- source_word: ἐκπορεύεται
  choice: hutoka
  rationale: Wakati uliopo unaonyesha kitendo katika picha ya maono; ‘hutoka’ ni wa asili na unaweza kutumika na orodha ya vitu vinavyofuata.
- source_word: θεῖον
  choice: kiberiti
  rationale: Maana ya moja kwa moja ni sulfur; ‘kiberiti’ ndilo neno la kawaida la Kiswahili.
theological_decisions:
- issue: Maana ya vivumishi vitatu vinavyoeleza dirii
  choice: Kuvitafsiri kama maelezo ya mwonekano—‘zenye rangi kama moto, yakuti samawati, na kiberiti’—bila kutaja kwa uhakika nyekundu au njano.
  alternative: ‘Za moto, za rangi ya hyacinth, na za kiberiti,’ au kwa ufafanuzi zaidi, ‘nyekundu kama moto, samawati kama hyacinth, na njano kama kiberiti.’
  rationale: Muktadha wa maono unaunga mkono maelezo ya rangi au mwonekano, lakini maneno ya Kigiriki yanaweza pia kueleza sifa zinazohusiana na moto na kiberiti. Tafsiri hii inasaidia ufahamu bila kuondoa utata halisi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inadumisha mtiririko wa taswira ya kinabii na wakati uliopo wa ‘hutoka.’ Hakuna alama za tanbihi kwa sababu hakuna tanbihi iliyohitajika katika rasimu hii.
