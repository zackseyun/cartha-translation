  source_fidelity: Rasimu inafuata muundo na taswira ya Kigiriki kwa ujumla, ikihifadhi maono, wapanda farasi, dirii, vichwa kama vya simba, na moto, moshi, na kiberiti vinavyotoka vinywani. Hata hivyo, mpangilio wa “niliwaona hivi farasi” si wa asili katika Kiswahili, na orodha ya “rangi kama moto, yakuti samawati, na kiberiti” si sambamba kisarufi wala wazi kuwa yote ni maelezo ya rangi/mwonekano wa dirii.
  naturalness: Marekebisho yanatumia “Ndivyo nilivyowaona...” kwa namna ya kawaida ya Kiswahili Sanifu, na yanaweka vivumishi vya dirii katika muundo sambamba. “Samawati iliyokolea” huwasilisha kwa kawaida thamani ya rangi ya ὑακινθίνους bila kudai utambulisho sahihi wa jiwe au ua.
  terminology: “Maono,” “dirii za kifuani,” “kiberiti,” na “vichwa vya simba” zinafaa. “Dirii za kifuani” ni sahihi ingawa “dirii” tayari hurejelea kinga ya kifua; imehifadhiwa ili kutafsiri θώρακες kwa uwazi. Hakuna tanbihi inayohitajika kwa aya hii.
