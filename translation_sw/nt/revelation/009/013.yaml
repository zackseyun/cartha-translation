id: REV.9.13
reference: Revelation 9:13
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ ὁ ἕκτος ἄγγελος ἐσάλπισεν· καὶ ἤκουσα φωνὴν μίαν ἐκ ⸀τῶν κεράτων τοῦ θυσιαστηρίου τοῦ χρυσοῦ τοῦ ἐνώπιον τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/013.yaml
  text: And the sixth angel blew his trumpet[a], and I heard one voice from the horns of the golden altar that is before God,
translation:
  language: sw
  text: Malaika wa sita akapiga tarumbeta yake, nami nikasikia sauti moja[a] kutoka katika pembe za madhabahu ya dhahabu iliyo mbele ya Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sauti moja tu.” Kigiriki kinasisitiza kwamba sauti hiyo ilikuwa moja.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσάλπισεν
  choice: akapiga tarumbeta yake
  rationale: Kitenzi σαλπίζω humaanisha kupiga au kutoa sauti kwa tarumbeta. Kutaja ‘tarumbeta yake’ ni Kiswahili cha kawaida na kinaweka wazi chombo kinachodokezwa na kitenzi katika muktadha huu.
- source_word: φωνὴν μίαν
  choice: sauti moja
  rationale: Tafsiri hii inahifadhi msisitizo wa neno μίαν kuhusu umoja wa sauti bila kubainisha mwenye sauti hiyo.
- source_word: ἐκ τῶν κεράτων
  choice: kutoka katika pembe
  rationale: ἐκ huonyesha chanzo, na κέρατα ni sehemu zinazofanana na pembe zilizokuwa kwenye madhabahu. Kauli hii inahifadhi taswira ya ibada.
- source_word: θυσιαστηρίου τοῦ χρυσοῦ
  choice: madhabahu ya dhahabu
  rationale: Hii ni tafsiri ya asili na iliyo wazi katika Kiswahili, huku ikihifadhi rejeo maalumu la madhabahu hiyo.
- source_word: τοῦ ἐνώπιον τοῦ θεοῦ
  choice: iliyo mbele ya Mungu
  rationale: ἐνώπιον huonyesha kuwapo au kuwa mahali mbele ya mtu. Tafsiri hii ni ya karibu na asili na inafaa katika taswira ya patakatifu pa mbinguni.
- source_word: ἄγγελος
  choice: malaika
  rationale: Katika maono ya Ufunuo, neno hili linamtaja kiumbe wa mbinguni, si mjumbe wa kibinadamu.
theological_decisions:
- issue: Utambulisho wa sauti
  choice: sauti moja
  alternative: sauti ya Mungu; sauti ya malaika; sauti inayohusishwa na madhabahu
  rationale: Kigiriki kinasema tu kwamba Yohana alisikia sauti moja kutoka katika pembe za madhabahu. Tafsiri haimtambulishi mwenye sauti na hivyo inahifadhi utata wa matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa simulizi ‘akapiga … nikasikia’ unasomeka kwa urahisi, na istilahi ‘madhabahu’ inadumisha taswira ya patakatifu bila kuongeza maelezo ya kimadhehebu.
