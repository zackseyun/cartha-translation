id: REV.9.11
reference: Revelation 9:11
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ⸂ἔχουσιν ἐπ’ αὐτῶν βασιλέα τὸν⸃ ἄγγελον τῆς ἀβύσσου· ὄνομα αὐτῷ Ἑβραϊστὶ Ἀβαδδών ⸂καὶ ἐν⸃ τῇ Ἑλληνικῇ ὄνομα ἔχει Ἀπολλύων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/011.yaml
  text: They have over them as king the angel of the abyss[a]. His name in Hebrew is Abaddon[c][b], and in Greek he has the name Apollyon.
translation:
  language: sw
  text: Wana malaika wa lindi kuwa mfalme juu yao[a]. Jina lake kwa Kiebrania ni Abadoni[b], na kwa Kigiriki ana jina Apolioni[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “shimo lisilo na mwisho.”
    reason: lexical_alternative
  - marker: b
    text: Abadoni ni jina la Kiebrania linalohusishwa na uharibifu.
    reason: lexical_alternative
  - marker: c
    text: Apolioni ni jina la Kigiriki linalomaanisha “Mwangamizaji.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχουσιν ἐπ’ αὐτῶν βασιλέα
  choice: Wana mfalme juu yao
  rationale: Muundo huu unahifadhi kitenzi ‘wana,’ nafasi ya mamlaka ‘juu yao,’ na taswira halisi ya kifalme katika βασιλέα.
- source_word: τὸν ἄγγελον τῆς ἀβύσσου
  choice: malaika wa lindi
  rationale: ἄγγελος hapa ni ‘malaika,’ kama ilivyo kawaida katika Ufunuo. ‘Lindi’ linawakilisha ἄβυσσος kwa ufupi bila kuongeza moja kwa moja wazo la kutokuwa na mwisho.
- source_word: Ἑβραϊστὶ
  choice: kwa Kiebrania
  rationale: Hii ni njia ya kawaida na ya asili ya kusema kwamba jina limetolewa katika lugha ya Kiebrania.
- source_word: Ἀβαδδών
  choice: Abadoni
  rationale: Jina limetoholewa kwa tahajia inayosomeka kwa Waswahili badala ya kutafsiriwa katika matini kuu; maana yake inaelezwa katika tanbihi.
- source_word: καὶ ἐν τῇ Ἑλληνικῇ ὄνομα ἔχει
  choice: na kwa Kigiriki ana jina
  rationale: Tafsiri inadumisha ulinganifu kati ya Kiebrania na Kigiriki pamoja na urudiaji wa wazo la ‘jina’ katika Kigiriki.
- source_word: Ἀπολλύων
  choice: Apolioni
  rationale: Jina la Kigiriki limetoholewa kwa namna inayotamkika katika Kiswahili, huku maana yake ya ‘Mwangamizaji’ ikiwekwa katika tanbihi.
theological_decisions:
- issue: Kutafsiri au kutohoa majina Ἀβαδδών na Ἀπολλύων
  choice: Majina yote mawili yametoholewa katika matini kuu kuwa ‘Abadoni’ na ‘Apolioni.’
  alternative: Kuyatafsiri kuwa ‘Uharibifu’ na ‘Mwangamizaji.’
  rationale: Katika mstari huu maneno hayo yanatumika kama majina ya malaika. Kutohoa kunadumisha kazi hiyo ya kisarufi, na maana muhimu ya majina imehifadhiwa katika tanbihi.
- issue: Jinsi ya kutafsiri ἀβύσσου
  choice: lindi
  alternative: shimo lisilo na mwisho
  rationale: ‘Lindi’ ni tafsiri ya moja kwa moja inayohifadhi taswira ya kina kisichopimika bila kuamua wazi kwamba neno lenyewe linamaanisha ‘lisilo na mwisho.’ Tafsiri ya jadi imeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaoeleweka. ‘Yaani’ linaonyesha wazi kwamba ‘malaika wa lindi’ ndiye mfalme anayetajwa, kama apposition ya Kigiriki. Majina yametoholewa kwa mfumo wa sauti unaofaa Kiswahili.
