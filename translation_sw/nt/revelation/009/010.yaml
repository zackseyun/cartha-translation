base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/010.yaml
  text: And they have tails like scorpions[a], and stingers; and in their tails is their power to harm people for five months.
translation:
  language: sw
  text: Nao wana mikia kama ya nge, yenye miiba; na katika mikia yao umo uwezo wao wa kuwadhuru watu kwa muda wa miezi mitano.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐρὰς
  choice: mikia
  rationale: Neno la moja kwa moja la sehemu ya mwili; wingi wa Kigiriki umehifadhiwa.
- source_word: ὁμοίας σκορπίοις
  choice: kama ya nge
  rationale: Muundo huu wa kawaida wa Kiswahili unaonyesha ufanano wa mikia yao na mikia ya nge bila kuongeza maelezo yasiyokuwapo katika picha.
- source_word: κέντρα
  choice: miiba
  rationale: Katika picha ya nge, neno hili linamaanisha ncha kali za kudunga; “miiba” ni neno la kawaida na linaloeleweka kwa Kiswahili.
- source_word: ἐξουσία
  choice: uwezo
  rationale: Hapa neno linaeleza uwezo wenye matokeo wa kudhuru kupitia mikia, si hasa mamlaka ya kisheria.
- source_word: ἀδικῆσαι
  choice: kuwadhuru
  rationale: Katika muktadha wa pigo hili, kitenzi kinamaanisha kusababisha madhara, wala si kutenda ukosefu wa haki kwa maana ya jumla.
- source_word: τοὺς ἀνθρώπους
  choice: watu
  rationale: ἄνθρωποι hapa linarejelea wanadamu kwa ujumla; “watu” ni tafsiri ya asili na jumuishi katika Kiswahili cha sasa.
- source_word: μῆνας πέντε
  choice: kwa muda wa miezi mitano
  rationale: Hufanya wazi matumizi ya hali ya kushutumiwa yanayoonyesha muda ambao madhara yanaendelea.
theological_decisions:
- issue: Maana ya ἐξουσία katika picha ya pigo la kinabii
  choice: uwezo
  alternative: mamlaka
  rationale: Mstari unakazia uwezo wao wa kuleta madhara kwa mikia. “Uwezo” huwasilisha maana hiyo bila kukataa kwamba uwezo huo umeruhusiwa ndani ya maono.
- issue: Upeo wa τοὺς ἀνθρώπους
  choice: watu
  alternative: wanadamu
  rationale: Nomino hiyo ya Kigiriki ni ya kijumla katika muktadha huu. “Watu” haisemi kwamba wanaume pekee ndio wanaolengwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaosomeka kwa urahisi. Mpangilio wa sentensi umebakiza mkazo wa maandishi ya Kigiriki kwamba uwezo wa kudhuru umo katika mikia yao.
