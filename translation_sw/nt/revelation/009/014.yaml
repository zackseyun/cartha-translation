base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/014.yaml
  text: saying to the sixth angel[a], the one who had the trumpet, “Release the four angels who are bound at the great river Euphrates.”
translation:
  language: sw
  text: ikimwambia malaika wa sita, yule mwenye tarumbeta, “Wafungue wale malaika wanne waliofungwa[a] penye mto mkubwa Frati.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, ‘ambao wamefungwa’ au ‘waliokwisha fungwa’; umbo timilifu la Kigiriki linasisitiza hali yao ya sasa inayotokana na kufungwa hapo awali.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντα
  choice: ikisema
  rationale: Kirai endelevu kinaungana na sauti iliyotajwa katika mstari uliotangulia; ‘ikisema’ ni ya kawaida kwa sauti na huhifadhi tendo la kusema.
- source_word: τῷ ἕκτῳ ἀγγέλῳ
  choice: na malaika wa sita
  rationale: Kihusishi ‘na’ kinaonyesha anayeambiwa; mpangilio huu ni wa asili katika Kiswahili.
- source_word: ὁ ἔχων τὴν σάλπιγγα
  choice: yule aliyekuwa na tarumbeta
  rationale: Hutambulisha wazi malaika anayelengwa huku ikitoa umilikaji kwa Kiswahili cha kawaida katika simulizi la wakati uliopita.
- source_word: Λῦσον
  choice: Wafungue
  rationale: Amri hii inaagiza kuondolewa kwa kifungo; ‘wafungue’ ni ya moja kwa moja na ya asili kwa watu waliofungwa.
- source_word: τοὺς τέσσαρας ἀγγέλους
  choice: wale malaika wanne
  rationale: Huhifadhi namba na hutumia ‘wale’ kwa kundi maalumu ambalo linaelezwa zaidi.
- source_word: τοὺς δεδεμένους
  choice: waliofungwa
  rationale: Huonyesha hali yao ya sasa inayotokana na tendo la kufungwa lililotangulia; tanbihi inadokeza uzito wa hali timilifu ya Kigiriki.
- source_word: ἐπὶ τῷ ποταμῷ
  choice: kwenye mto
  rationale: ἐπί pamoja na dativu ni ya mahali hapa; ‘kwenye’ hudumisha kutokubainishwa kama ni ukingoni, karibu, au katika eneo la mto.
- source_word: τῷ μεγάλῳ Εὐφράτῃ
  choice: mto mkubwa Frati
  rationale: Huu ni mpangilio wa kawaida wa Kiswahili kwa jina la mto pamoja na sifa yake; ‘Frati’ ni jina linalotumika katika Kiswahili.
theological_decisions:
- issue: Utambulisho na hali ya kimaadili ya malaika wanne
  choice: malaika wanne
  alternative: malaika wanne walioanguka; malaika wanne waliowekwa kwa ajili ya hukumu
  rationale: Mstari unawaita malaika waliofungwa tu. Kuongeza kwamba ni waovu, walioanguka, au waliowekwa kwa hukumu kungeamua jambo ambalo matini yenyewe haijabainisha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo unafuata kwa karibu sintaksia na maana ya Kigiriki bila kuwa mgumu kusomeka. Alama ya tanbihi [a] imewekwa mara moja baada ya neno linalohusika.
