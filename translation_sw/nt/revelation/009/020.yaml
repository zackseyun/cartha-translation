id: REV.9.20
reference: Revelation 9:20
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ οἱ λοιποὶ τῶν ἀνθρώπων, οἳ οὐκ ἀπεκτάνθησαν ἐν ταῖς πληγαῖς ταύταις, ⸀οὐδὲ μετενόησαν ἐκ τῶν ἔργων τῶν χειρῶν αὐτῶν, ἵνα μὴ ⸀προσκυνήσουσιν τὰ δαιμόνια καὶ τὰ εἴδωλα τὰ χρυσᾶ καὶ τὰ ἀργυρᾶ καὶ τὰ χαλκᾶ καὶ τὰ λίθινα καὶ τὰ ξύλινα, ἃ οὔτε βλέπειν ⸀δύνανται οὔτε ἀκούειν οὔτε περιπατεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/020.yaml
  text: And the rest of humanity[a], who were not killed by these plagues, did not even repent of the works of their hands, so as not to worship demons and the idols of gold and silver and bronze and stone and wood[c][b], which can neither see nor hear nor walk.
translation:
  language: sw
  text: Na wanadamu waliobaki[a], ambao hawakuuawa kwa mapigo hayo, wala hawakutubu kwa kuyaacha matendo ya mikono yao[b], ili wasiwaabudu[c] pepo na sanamu za dhahabu, fedha, shaba, mawe, na miti, ambazo haziwezi kuona, kusikia, wala kutembea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wanadamu wengine.”
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “hawakutubu kutoka katika matendo ya mikono yao.” Usemi huu unarejelea hasa yale waliyoyatengeneza na kuyaabudu, ingawa unaweza kuwa mpana zaidi.
    reason: lexical_alternative
  - marker: c
    text: Au, “ili waache kuyaabudu.” Kishazi cha Kigiriki kinaweza kuonyesha kusudi au tokeo lililokusudiwa la toba.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ λοιποὶ τῶν ἀνθρώπων
  choice: wanadamu wengine
  rationale: Hutaja wanadamu waliobaki baada ya wale waliouawa; “wanadamu” ni ya kijumla na haiwahusu wanaume peke yao.
- source_word: ἀπεκτάνθησαν
  choice: hawakuuawa
  rationale: Huwasilisha moja kwa moja kauli tendwa ya ἀποκτείνω kwa Kiswahili cha sasa.
- source_word: πληγαῖς
  choice: mapigo
  rationale: Katika Ufunuo neno hili hutaja mapigo ya hukumu; “mapigo” ni pana na linafaa katika muktadha huu.
- source_word: οὐδὲ μετενόησαν
  choice: hawakutubu hata kidogo
  rationale: “Hata kidogo” huonyesha mkazo wa οὐδέ baada ya kunusurika mapigo, bila kugeuza kiunganishi kuwa sentensi mpya.
- source_word: ἐκ τῶν ἔργων τῶν χειρῶν αὐτῶν
  choice: na kuziacha kazi za mikono yao
  rationale: ἐκ huonyesha kugeuka kutoka katika matendo hayo; “kazi za mikono yao” huhifadhi taswira halisi inayotanguliza sanamu walizotengeneza na kuabudu.
- source_word: ἵνα μὴ προσκυνήσουσιν
  choice: ili wasiwaabudu
  rationale: Huhifadhi uwezekano wa maana ya kusudi au tokeo lililokusudiwa bila kulazimisha ufafanuzi wa kuacha ibada ambao haujasemwa wazi katika umbo la kitenzi.
- source_word: τὰ δαιμόνια
  choice: pepo
  rationale: “Pepo” ni neno la kawaida la kibiblia la Kiswahili kwa viumbe wa kiroho waovu katika muktadha huu.
- source_word: τὰ εἴδωλα
  choice: sanamu
  rationale: Katika muktadha wa ibada, “sanamu” humaanisha vitu vinavyoabudiwa, si picha zisizo na maana ya kidini.
- source_word: τὰ χρυσᾶ καὶ τὰ ἀργυρᾶ καὶ τὰ χαλκᾶ καὶ τὰ λίθινα καὶ τὰ ξύλινα
  choice: za dhahabu, fedha, shaba, mawe na miti
  rationale: Orodha hii ya vifaa ni ya kawaida kwa Kiswahili na huhifadhi mfululizo wa Kigiriki.
- source_word: ἃ οὔτε βλέπειν δύνανται οὔτε ἀκούειν οὔτε περιπατεῖν
  choice: ambazo haziwezi kuona, kusikia wala kutembea
  rationale: Huhifadhi dhihaka ya kutokuwa na uwezo kwa sanamu pamoja na matendo yote matatu, ikiwemo maana halisi ya “kutembea.”
theological_decisions:
- issue: Maana ya kijumla ya ἀνθρώπων
  choice: wanadamu
  alternative: watu
  rationale: “Wanadamu” huonyesha wazi kwamba neno linawahusu binadamu kwa ujumla, bila kulifanya kuwa maalumu kwa wanaume.
- issue: Uhusiano wa toba na ibada ya sanamu katika ἵνα μὴ προσκυνήσουσιν
  choice: ili wasiwaabudu
  alternative: ili waache kuwaabudu
  rationale: Chaguo kuu huhifadhi maana ya kusudi au tokeo lililokusudiwa katika ἵνα μή; mbadala huweka wazi zaidi wazo la kusitisha ibada lakini huongeza kipengele kisichotajwa moja kwa moja.
- issue: Kitu kinachomaanishwa na “kazi za mikono yao”
  choice: kuhifadhi nahau huku kuziacha kukiwekwa wazi
  alternative: vitu walivyovitengeneza kwa mikono yao
  rationale: Muktadha unaelekeza hasa kwa sanamu, lakini usemi unaweza pia kuwa mpana kuliko vitu vyenyewe; tafsiri haubani maana yake kwa mafundisho fulani.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umehifadhi taswira ya “kazi za mikono,” orodha ya vifaa, na mfuatano wa kuona, kusikia na kutembea. Alama zote za tanbihi [a], [b], na [c] zimo katika matini kuu.
