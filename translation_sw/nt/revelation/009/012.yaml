reference: Revelation 9:12
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἡ οὐαὶ ἡ μία ἀπῆλθεν· ἰδοὺ ἔρχεται ἔτι δύο οὐαὶ μετὰ ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/012.yaml
  text: The first woe has passed[a]. Behold[b], two woes are still coming after these things.
translation:
  language: sw
  text: Ole ya kwanza imepita.[a] Tazama,[b] bado ole mbili zinakuja baada ya mambo haya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ole ile moja imepita.” Kigiriki kinasema kihalisi “ole ile moja,” lakini katika muktadha maana yake ni ole ya kwanza katika mfululizo.
    reason: lexical_alternative
  - marker: b
    text: Au, “Bado ole mbili zinakuja baada ya haya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐαί
  choice: ole
  rationale: Neno “ole” linahifadhi uzito wa tangazo la kinabii la hukumu na maafa yanayokuja, badala ya kulifanya kuwa jina la tukio tu.
- source_word: ἡ μία
  choice: ya kwanza
  rationale: Ingawa kwa umbo ni “ile moja,” katika muktadha huu linatofautisha ole ya kwanza kati ya mfululizo wa ole tatu; “ya kwanza” ni Kiswahili cha kawaida na sahihi kimuktadha.
- source_word: ἀπῆλθεν
  choice: imepita
  rationale: Kitenzi kinaonyesha kuwa ole ya kwanza imefikia mwisho; “imepita” ni ya kawaida kwa tukio au kipindi kilichokamilika na huepuka maana ya mahali ya “imeondoka.”
- source_word: ἰδού
  choice: Tazama
  rationale: Linavuta fikira kwa msisitizo kuelekea yanayofuata na linafaa sajili ya kinabii ya Ufunuo.
- source_word: ἔτι ... ἔρχεται
  choice: bado ... zinakuja
  rationale: “Bado” huonyesha kuwa ole nyingine zimesalia, na “zinakuja” hudumisha hisia hai ya ukaribu wa matukio hayo huku ikifuata sarufi ya kawaida ya Kiswahili kwa ole mbili.
- source_word: μετὰ ταῦτα
  choice: baada ya mambo haya
  rationale: Tafsiri hii inadumisha wingi wa kiwakilishi cha Kigiriki na mpangilio wa matukio unaojirudia katika Ufunuo.
theological_decisions:
- issue: Mpangilio wa kiapokaliptiki wa ole tatu
  choice: Mstari unaonyesha kuwa ole ya kwanza iliyotangazwa imekamilika na kwamba ole nyingine mbili bado zinakuja.
  alternative: Kutafsiri “ole” kwa ujumla kuwa “hukumu” au “maafa” bila kudumisha fomula inayorudiwa.
  rationale: Kigiriki kinasisitiza mfululizo uliohesabiwa wa ole ndani ya maono ya Yohana. Kudumisha “ole” na “ya kwanza” kunahifadhi muundo wa kifasihi na uzito wa hukumu bila kuongeza maelezo ya kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kinabii. “Tazama” na “ole” hudumisha uzito wa lugha ya Ufunuo bila kutumia maneno ya kizamani yasiyoeleweka kwa urahisi.
