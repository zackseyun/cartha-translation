  terminology: ‘Dirii za chuma,’ ‘mabawa,’ ‘sauti,’ ‘magari ya vita,’ ‘farasi,’ na ‘vitani’ zinafaa kwa register ya Kiswahili Sanifu. ‘Yakikokotwa’ ni sahihi kwa magari ya vita yanayovutwa na farasi.
