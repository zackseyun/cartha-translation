  text: καὶ εἶχον θώρακας ὡς θώρακας σιδηροῦς, καὶ ἡ φωνὴ τῶν πτερύγων αὐτῶν ὡς φωνὴ ἁρμάτων ἵππων πολλῶν τρεχόντων εἰς πόλεμον·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/009.yaml
  text: And they had breastplates like iron breastplates[a], and the sound of their wings was like the sound of many chariots with horses rushing into battle.
translation:
  language: sw
  text: Walikuwa na dirii kama dirii za chuma, na sauti ya mabawa yao ilikuwa kama sauti ya magari ya vita yakikokotwa na farasi wengi wakikimbilia vitani.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θώρακας
  choice: dirii za kifuani
  rationale: Neno θώραξ linamaanisha silaha ya kujikinga inayofunika kifua au kiwiliwili. “Dirii za kifuani” ni sahihi zaidi kuliko “ngao,” ambayo kwa kawaida hushikwa mkononi.
- source_word: ὡς θώρακας σιδηροῦς
  choice: kama dirii za chuma
  rationale: “Kama” linadumisha ulinganisho unaoonyeshwa na ὡς, na “za chuma” linatafsiri σιδηροῦς kwa njia ya kawaida ya Kiswahili.
- source_word: φωνὴ
  choice: sauti
  rationale: Katika muktadha huu φωνή ni kitu kinachosikika kutoka kwa mabawa na magari ya vita, hivyo “sauti” linafaa kuliko “sauti ya kusema” au “kelele.”
- source_word: πτερύγων
  choice: mabawa
  rationale: Hii ndiyo maana ya moja kwa moja ya πτέρυξ, na muundo wa Kigiriki unatoa “sauti ya mabawa yao.”
- source_word: ἁρμάτων
  choice: magari ya vita yanayokokotwa na farasi
  rationale: ἅρμα ni gari la kale la vita. Kutaja kuwa linakokotwa na farasi huzuia “magari ya vita” kueleweka kama magari ya kisasa na hudumisha uhusiano wake na ἵππων.
- source_word: ἵππων πολλῶν
  choice: magari mengi ya vita yanayokokotwa na farasi
  rationale: Katika sentensi kuu, wingi umeonyeshwa kwa magari ili kutoa picha ya kawaida na wazi ya msafara mkubwa wa magari ya farasi. Tafsiri ya karibu zaidi na mpangilio wa Kigiriki imehifadhiwa katika tanbihi.
- source_word: τρεχόντων
  choice: yakikimbilia
  rationale: τρέχω humaanisha kukimbia. “Yakikimbilia” huonyesha mwendo wa haraka kuelekea mapambanoni bila kuongeza wazo lisilokuwapo katika maandishi.
- source_word: εἰς πόλεμον
  choice: vitani
  rationale: Katika picha hii ya magari yanayosonga kwa kasi, “vitani” ni Kiswahili cha kawaida kinachowasilisha maana ya kuelekea kwenye vita au mapambano.
theological_decisions:
- issue: Asili ya picha katika maono ya Yohana
  choice: Maelezo yametafsiriwa kama ulinganisho wa kimaono bila kutambulisha viumbe hivi kuwa mashine, pepo, au jeshi fulani.
  alternative: Kufafanua picha hiyo kuwa vifaa halisi vya kijeshi au alama yenye rejeo moja maalumu.
  rationale: Neno ὡς (“kama”) limetumiwa mara mbili. Tafsiri inadumisha ulinganisho na kutouondolea maandishi mvutano na uwazi wake wa kiapokaliptiki.
- issue: Mhusika wa τρεχόντων katika kifungu cha magari na farasi
  choice: Sentensi kuu inaonyesha magari yakikimbilia vitani, huku tanbihi ikihifadhi muundo unaoweza kuhusisha moja kwa moja farasi wengi.
  alternative: Kutaja bila utata kwamba farasi pekee ndio wanaokimbia.
  rationale: Kwa kuwa ἁρμάτων na ἵππων ni maumbo ya jenitivi ya wingi ya jinsia ya kiume, kisarufi τρεχόντων inaweza kuhusishwa na mojawapo; taswira kwa ujumla ni ya magari na farasi wake wakisonga vitani.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaoeleweka. “Dirii za kifuani” ni neno sahihi la silaha inayofunika kifua; “magari ya vita yanayokokotwa na farasi” linafafanua aina ya gari la kale bila kugeuza taswira kuwa vifaa vya kijeshi vya kisasa.
