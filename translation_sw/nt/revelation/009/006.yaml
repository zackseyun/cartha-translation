id: REV.9.6
reference: Revelation 9:6
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἐν ταῖς ἡμέραις ἐκείναις ζητήσουσιν οἱ ἄνθρωποι τὸν θάνατον καὶ οὐ μὴ εὑρήσουσιν αὐτόν, καὶ ἐπιθυμήσουσιν ἀποθανεῖν καὶ ⸀φεύγει ⸂ὁ θάνατος ἀπ’ αὐτῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/006.yaml
  text: And in those days people will seek death and will certainly not find it[a], and they will long to die, but death flees from them.
translation:
  language: sw
  text: Na katika siku hizo watu watatafuta kifo, wala hawatakipata kamwe; watatamani kufa, lakini kifo kinawakimbia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: katika siku hizo
  rationale: Ni usemi wa kawaida wa wakati unaohifadhi rejeo la siku hizo maalumu.
- source_word: ζητήσουσιν
  choice: watatafuta
  rationale: Kitenzi hiki kinaonyesha jitihada yenye kusudi ya kukipata kifo.
- source_word: οἱ ἄνθρωποι
  choice: watu
  rationale: Katika muktadha huu ἄνθρωποι inawahusu wanadamu kwa ujumla, si wanaume pekee; “watu” ni tafsiri sahihi na ya kawaida katika Kiswahili.
- source_word: τὸν θάνατον
  choice: kifo
  rationale: “Kifo” ndilo neno la kawaida la Kiswahili, na linaweza pia kubeba taswira ya uhuishaji inayofuata.
- source_word: οὐ μὴ εὑρήσουσιν αὐτόν
  choice: hawatakipata kamwe
  rationale: Muundo οὐ μή pamoja na kitenzi cha wakati ujao ni ukanushaji wenye mkazo; “kamwe” unaonyesha mkazo huo kwa Kiswahili cha kawaida.
- source_word: ἐπιθυμήσουσιν ἀποθανεῖν
  choice: watatamani kufa
  rationale: Huhifadhi hamu kubwa inayodokezwa na ἐπιθυμέω bila kuongeza maana isiyokuwapo.
- source_word: φεύγει ὁ θάνατος ἀπ’ αὐτῶν
  choice: kifo kitawakimbia
  rationale: Huhifadhi kifo kama mtendaji aliyehuishwa na mwendo wa kukimbia mbali nao; wakati ujao ni wa kawaida katika mfuatano wa unabii wa Kiswahili, ingawa Kigiriki kinatumia wakati wa sasa wa kisanaa.
theological_decisions:
- issue: Uhuishaji wa kifo katika hukumu ya kiapokaliptiki
  choice: kifo kitawakimbia
  alternative: hawataweza kufa
  rationale: Kigiriki kinakitaja kifo waziwazi kuwa kiima cha φεύγει. Taswira hiyo imehifadhiwa badala ya kufafanua tu matokeo yake.
- issue: Maana ya kijumla ya οἱ ἄνθρωποι
  choice: watu
  alternative: wanaume
  rationale: Neno hilo hapa linawahusu wanadamu wanaopatwa na hukumu kwa ujumla. “Watu” huepuka kudokeza bila msingi kwamba ni wanaume pekee.
- issue: Wakati wa sasa katika φεύγει
  choice: kitawakimbia
  alternative: kinawakimbia
  rationale: Kigiriki kinatumia wakati wa sasa wenye uhai baada ya vitenzi vya wakati ujao. Kiswahili cha kawaida hufuata mfululizo wa wakati ujao hapa, huku taswira yenyewe ya kukimbia ikibaki bila kubadilishwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi ya maandiko. Ukanushaji wenye mkazo umetolewa kwa “kamwe,” na uhuishaji wa kifo umehifadhiwa moja kwa moja.
