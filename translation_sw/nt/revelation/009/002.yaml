id: REV.9.2
reference: Revelation 9:2
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἤνοιξεν τὸ φρέαρ τῆς ἀβύσσου, καὶ ἀνέβη καπνὸς ἐκ τοῦ φρέατος ὡς καπνὸς καμίνου ⸀μεγάλης, καὶ ⸀ἐσκοτώθη ὁ ἥλιος καὶ ὁ ἀὴρ ἐκ τοῦ καπνοῦ τοῦ φρέατος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/002.yaml
  text: And he opened the shaft of the abyss[a], and smoke went up from the shaft like the smoke of a great furnace, and the sun and the air were darkened by the smoke from the shaft.
translation:
  language: sw
  text: Akafungua shimo linaloelekea kwenye vilindi[a], na moshi ukapanda kutoka katika shimo hilo kama moshi wa tanuru kubwa. Jua na hewa vikatiwa giza kwa moshi uliotoka katika shimo hilo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “shimo la vilindi”; kwa mapokeo, “shimo lisilo na mwisho.”
    reason: Huonyesha uwezekano wa kutafsiri φρέαρ τῆς ἀβύσσου kwa namna ya karibu zaidi na muundo wa Kigiriki, na hutaja usemi wa kimapokeo bila kuufanya kuwa tafsiri kuu.
lexical_decisions:
- source_word: ἤνοιξεν
  choice: akafungua
  rationale: Kitenzi hiki humaanisha kufungua; hakielezi hasa kwamba kulikuwa na kufuli, hivyo ‘akafungua’ huepuka kuongeza jambo lisilosemwa.
- source_word: φρέαρ
  choice: shimo linaloingia
  rationale: φρέαρ inaweza kuwa kisima au shimo. Katika taswira hii ni njia ya wima inayoingia katika ἄβυσσος; usemi huu unatofautisha njia hiyo na shimo lisilo na mwisho lenyewe.
- source_word: ἀβύσσου
  choice: shimo lisilo na mwisho
  rationale: Huu ni usemi wa asili na unaoeleweka kwa msomaji wa Kiswahili kwa eneo la kina lisilopimika; haudai moja kwa moja kwamba φρέαρ na ἄβυσσος ni kitu kilekile.
- source_word: ἀνέβη
  choice: ukapanda
  rationale: Huhifadhi wazi mwendo wa moshi kuelekea juu.
- source_word: καπνὸς
  choice: moshi
  rationale: Ni kisawe cha kawaida na kimerudiwa kwa uthabiti katika mstari.
- source_word: ὡς καπνὸς καμίνου μεγάλης
  choice: kama moshi wa tanuru kubwa
  rationale: Huhifadhi ulinganisho wa ὡς na taswira ya tanuru kubwa kwa Kiswahili cha kawaida.
- source_word: ἐσκοτώθη
  choice: vikatiwa giza
  rationale: Huhifadhi hali ya kutendwa iliyo katika Kigiriki na inaafikiana kiasili na kiima ambatani ‘jua na hewa.’
- source_word: ὁ ἥλιος
  choice: jua
  rationale: Kisawe cha moja kwa moja katika Kiswahili.
- source_word: ὁ ἀὴρ
  choice: hewa
  rationale: ἀήρ ni hewa au angahewa; ‘hewa’ ni sahihi zaidi kuliko ‘anga’ hapa.
- source_word: ἐκ τοῦ καπνοῦ τοῦ φρέατος
  choice: kwa moshi uliotoka katika shimo hilo
  rationale: Hueleza kwa kawaida uhusiano wa chanzo na sababu unaowezekana katika ἐκ, huku ukibainisha kwamba moshi ulitoka kwenye njia hiyo.
theological_decisions:
- issue: Kutafsiri istilahi ya mahali katika maono bila kuchanganya φρέαρ na ἄβυσσος
  choice: shimo linaloingia katika shimo lisilo na mwisho
  alternative: shimo la kuzimu; kisima cha shimo lisilo na mwisho
  rationale: Tafsiri hii inadumisha tofauti kati ya uwazi au njia ya kuingilia (φρέαρ) na eneo lenye kina kisichopimika (ἄβυσσος), bila kuingiza kwa lazima maana ya jehanamu au fundisho maalumu kuhusu mahali hapo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ya maono na hadhi ya lugha ya Maandiko. Kurudiwa kwa ‘shimo’ na ‘moshi’ kumehifadhiwa kwa sababu ni sehemu ya msisitizo wa Kigiriki; ‘hilo’ na ‘uliotoka’ vimetumiwa kuweka marejeo wazi kwa Kiswahili cha sasa.
