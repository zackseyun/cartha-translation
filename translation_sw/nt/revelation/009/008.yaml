  text: καὶ εἶχον τρίχας ὡς τρίχας γυναικῶν, καὶ οἱ ὀδόντες αὐτῶν ὡς λεόντων ἦσαν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/008.yaml
  text: And they had hair like women’s hair[a], and their teeth were like lions’ teeth,
translation:
  language: sw
  text: Walikuwa na nywele kama nywele za wanawake, na meno yao yalikuwa kama meno ya simba.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶχον
  choice: Walikuwa na
  rationale: Wakati uliopita usiotimilika katika maelezo ya ono unatolewa kwa wakati uliopita wa kawaida wa Kiswahili, ambao unasomeka kwa u自然 katika simulizi.
- source_word: τρίχας
  choice: nywele
  rationale: Ingawa neno la Kigiriki ni la wingi, ‘nywele’ ndilo neno la kawaida la Kiswahili kwa maelezo haya.
- source_word: ὡς τρίχας γυναικῶν
  choice: kama nywele za wanawake
  rationale: ‘Kama’ huhifadhi ulinganisho wa ὡς, na ‘nywele za wanawake’ ni usemi wa kawaida na wa wazi katika Kiswahili.
- source_word: οἱ ὀδόντες αὐτῶν
  choice: meno yao
  rationale: Muundo wa umilikaji wa Kiswahili unatoa kwa kawaida maana ya nomino yenye kiwakilishi cha umilikaji.
- source_word: ὡς λεόντων
  choice: kama meno ya simba
  rationale: Nomino ‘meno’ imerudiwa ili kuweka wazi kwamba meno yao yanalinganishwa na meno ya simba, badala ya simba kwa ujumla.
- source_word: ἦσαν
  choice: yalikuwa
  rationale: Huu ni wakati uliopita wa kitenzi ‘kuwa,’ ukipatana kisarufi na ‘meno.’
theological_decisions:
- issue: Asili ya taswira katika maelezo ya kiapokaliptiki
  choice: Milinganisho imehifadhiwa moja kwa moja bila kuifafanua kiishara.
  alternative: Kutumia lugha ya kufasiri inayodai kueleza maana ya mfano wa nywele na meno.
  rationale: Kigiriki kinatoa milinganisho ya ono bila kueleza ishara zake; tafsiri inahifadhi taswira na mvutano wake bila kuamua maana yake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Hakuna tanbihi iliyohitajika, kwa kuwa ‘kama nywele za wanawake’ tayari inalingana kwa karibu na muundo rasmi wa Kigiriki na ni ya kawaida katika Kiswahili.
