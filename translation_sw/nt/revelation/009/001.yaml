  text: Καὶ ὁ πέμπτος ἄγγελος ἐσάλπισεν· καὶ εἶδον ἀστέρα ἐκ τοῦ οὐρανοῦ πεπτωκότα εἰς τὴν γῆν, καὶ ἐδόθη αὐτῷ ἡ κλεὶς τοῦ φρέατος τῆς ἀβύσσου·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/001.yaml
  text: And the fifth angel sounded the trumpet[a], and I saw a star that had fallen from heaven to the earth[c][b], and the key to the shaft of the abyss was given to him.
translation:
  language: sw
  text: Malaika wa tano akapiga tarumbeta, nami nikaona nyota[b] iliyokuwa imeanguka kutoka mbinguni hadi duniani[a]. Na huyo akapewa ufunguo wa shimo la vilindi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nyota iliyoanguka kutoka mbinguni hadi duniani.” Muundo wa Kigiriki yaelekea unaonyesha kwamba kuanguka kulikuwa kumekwisha kutokea Yohana alipoiona.
    reason: lexical_alternative
  - marker: b
    text: 'Huenda “nyota” hiyo ikawakilisha kiumbe binafsi, kwa kuwa Kigiriki kinaendelea kwa kutumia kiwakilishi cha kiume: “kwake.”'
    reason: alternative_reading
  - marker: c
    text: 'Tafsiri nyingine: “shimo la kuzimu”; mapokeo mengine: “shimo lisilo na mwisho.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσάλπισεν
  choice: akapiga tarumbeta
  rationale: Kitenzi hiki humaanisha kupiga au kutoa sauti kwa tarumbeta. Usemi “akapiga tarumbeta” ni wa kawaida na unaeleweka katika Kiswahili.
- source_word: ἀστέρα
  choice: nyota
  rationale: Maana ya moja kwa moja ni “nyota.” Ingawa katika maono hii huenda ikawakilisha kiumbe binafsi, tafsiri haipaswi kutanguliza utambulisho huo katika matini.
- source_word: πεπτωκότα
  choice: iliyokuwa imeanguka
  rationale: Kauli timilifu inaonyesha kwamba kuanguka kulikuwa kumekwisha kutokea na nyota ilikuwa katika hali hiyo Yohana alipoiona.
- source_word: ἐκ τοῦ οὐρανοῦ ... εἰς τὴν γῆν
  choice: kutoka mbinguni hadi duniani
  rationale: “Mbinguni” linafaa kwa mazingira ya maono ya Ufunuo, na “duniani” linadumisha utofautishaji wa maeneo hayo mawili.
- source_word: ἐδόθη αὐτῷ
  choice: nayo ikapewa
  rationale: Kauli tendwa inadumishwa bila kumtaja mtoaji, kama ilivyo katika Kigiriki. Kiambishi “i-” kinarejelea nyota bila kuamua wazi kama ni kiumbe binafsi.
- source_word: ἡ κλεὶς
  choice: ufunguo
  rationale: Hili ndilo neno la kawaida na la moja kwa moja la Kiswahili kwa κλείς; muktadha unaonyesha ufunguo mahususi.
- source_word: τοῦ φρέατος τῆς ἀβύσσου
  choice: wa shimo la vilindi
  rationale: φρέαρ inaweza kumaanisha shimo, kisima, au njia wima inayoingia chini; “shimo” ni la kawaida hapa. “Vilindi” linahifadhi taswira ya ἄβυσσος bila kuongeza moja kwa moja wazo la kutokuwa na mwisho.
theological_decisions:
- issue: Kama “nyota” itambulishwe kuwa malaika au Shetani
  choice: Taswira ya “nyota” imedumishwa bila kuitambulisha
  alternative: malaika; kiumbe cha kishetani; Shetani
  rationale: Mstari unatumia taswira ya nyota, kisha Kigiriki kinatumia kiwakilishi cha kiume, jambo linaloweza kuashiria kiumbe binafsi. Hata hivyo, mstari wenyewe hautoi utambulisho wake.
- issue: Kama mtoaji wa ufunguo atajwe kuwa Mungu
  choice: Kauli tendwa “ikapewa” imedumishwa
  alternative: Mungu akaipa ufunguo
  rationale: Kigiriki hakimtaji mtoaji. Kumtaja Mungu moja kwa moja kungeondoa ukimya wenye maana wa matini na kufanya hitimisho la kitafsiri kuwa sehemu ya tafsiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mtindo wa usimulizi wa maono umedumishwa kwa “akapiga,” “nikaona,” na “ikapewa.” “Vilindi” ni neno la kifasihi linaloeleweka na linalofaa kwa taswira ya kiapokaliptiki; tanbihi inatoa usemi wa kimapokeo “kuzimu.”
