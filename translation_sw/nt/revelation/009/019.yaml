id: REV.9.19
reference: Revelation 9:19
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἡ γὰρ ἐξουσία τῶν ἵππων ἐν τῷ στόματι αὐτῶν ἐστιν καὶ ἐν ταῖς οὐραῖς αὐτῶν· αἱ γὰρ οὐραὶ αὐτῶν ὅμοιαι ⸀ὄφεσιν, ἔχουσαι κεφαλάς, καὶ ἐν αὐταῖς ἀδικοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/019.yaml
  text: For the power of the horses is in their mouths and in their tails[a]; for their tails are like serpents, having heads[b], and with them they do harm.
translation:
  language: sw
  text: Kwa maana uwezo wa farasi hao uko vinywani mwao na mikiani mwao; kwa maana mikia yao ni kama nyoka, ina vichwa, na kwa mikia hiyo huleta madhara.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξουσία
  choice: nguvu
  rationale: Katika maono haya neno hilo linaonyesha uwezo wenye matokeo wa kusababisha madhara, si hasa mamlaka ya kisheria.
- source_word: στόματι
  choice: vinywa
  rationale: Ingawa Kigiriki kina umoja unaotumika kwa mgawanyo, wingi ni wa kawaida katika Kiswahili kwa kuwa unarejelea farasi wengi.
- source_word: οὐραῖς / οὐραὶ
  choice: mikia
  rationale: Hili ndilo neno la kawaida na linaendeleza wazi taswira ya maono.
- source_word: ὅμοιαι ὄφεσιν
  choice: ni kama nyoka
  rationale: “Nyoka” ni lugha ya kawaida ya sasa na inadumisha taswira ya kiumbe huyo bila kuingiza tafsiri ya kiishara.
- source_word: ἔχουσαι κεφαλάς
  choice: nayo ina vichwa
  rationale: Upatanisho wa kisarufi wa “ina” unarejelea “mikia,” na sentensi inadumisha mfuatano hai wa maelezo ya Kigiriki.
- source_word: ἀδικοῦσιν
  choice: huleta madhara
  rationale: Katika muktadha huu kitenzi kina maana ya kuumiza au kusababisha madhara, si kutenda dhuluma kwa maana ya kisheria tu.
- source_word: ἐν αὐταῖς
  choice: kwa mikia hiyo
  rationale: ἐν hapa inaeleweka kwa maana ya chombo au njia; kutaja mikia tena huifanya rejeo la kiwakilishi cha kike cha wingi katika Kigiriki lieleweke kwa Kiswahili.
- source_word: γὰρ
  choice: kwa maana
  rationale: Matumizi yote mawili ni ya kutoa maelezo. La pili limewasilishwa kwa kuanza sentensi mpya ili Kiswahili kisomeke kwa urahisi bila kupoteza uhusiano wa maelezo.
theological_decisions:
- issue: Taswira ya mikia ya farasi iliyo kama nyoka na yenye vichwa
  choice: Kuitafsiri taswira hiyo moja kwa moja bila kuieleza kwa fumbo
  alternative: Kuitambulisha mikia kuwa mafundisho ya uongo, nguvu za pepo, au ishara nyingine maalumu
  rationale: Kigiriki kinatoa maelezo ya maono bila kufafanua maana yake ya kiishara; tafsiri haipaswi kuingiza ufafanuzi wa kimadhehebu.
- issue: Mtendaji wa tendo la kuleta madhara katika καὶ ἐν αὐταῖς ἀδικοῦσιν
  choice: Kuacha mtendaji akiwa amedokezwa katika kitenzi “huleta,” huku mikia ikitajwa kuwa njia ya tendo
  alternative: Kutaja wazi “farasi hao huleta madhara” au kufanya mikia yenyewe kuwa mtendaji
  rationale: Kigiriki hakitaji nomino mpya kama kiima cha ἀδικοῦσιν. Kiswahili kinaweza kudumisha kutotajwa huko, huku “kwa mikia hiyo” ikionyesha wazi chombo kinachotumiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. “Nyoka” limetumiwa badala ya neno la kifasihi au la kale zaidi. Sentensi ya pili imeanzishwa upya kwa mtiririko wa kawaida wa Kiswahili.
