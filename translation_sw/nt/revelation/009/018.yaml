  text: ἀπὸ τῶν τριῶν πληγῶν τούτων ἀπεκτάνθησαν τὸ τρίτον τῶν ἀνθρώπων, ⸀ἐκ τοῦ πυρὸς καὶ τοῦ καπνοῦ καὶ τοῦ θείου τοῦ ἐκπορευομένου ἐκ τῶν στομάτων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/018.yaml
  text: By these three plagues a third of mankind was killed—by the fire and the smoke and the sulfur coming out of their mouths[a][b].
translation:
  language: sw
  text: Kwa mapigo haya matatu, theluthi moja ya wanadamu waliuawa—kwa moto, moshi, na kiberiti[a] vinavyotoka katika vinywa vyao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sulfuri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ τῶν τριῶν πληγῶν τούτων
  choice: Kwa mapigo haya matatu
  rationale: Hapa ἀπό inaonyesha kisababishi au njia iliyosababisha vifo. “Kwa” ni ya asili katika Kiswahili na “haya” inadumisha τούτων.
- source_word: ἀπεκτάνθησαν
  choice: waliuawa
  rationale: Kitenzi ni cha wakati uliopita na hali tendwa; “waliuawa” kinadumisha maana hiyo na kupatana na “wanadamu” katika Kiswahili.
- source_word: τὸ τρίτον τῶν ἀνθρώπων
  choice: theluthi moja ya wanadamu
  rationale: τὸ τρίτον ina maana ya sehemu moja kati ya tatu, na ἀνθρώπων inawahusu binadamu kwa ujumla, si wanaume pekee.
- source_word: ἐκ τοῦ πυρὸς καὶ τοῦ καπνοῦ καὶ τοῦ θείου
  choice: kwa moto, moshi, na kiberiti
  rationale: ἐκ hapa inaonyesha vitu vilivyokuwa chanzo au njia ya mauti. “Kiberiti” ni neno la kawaida la kisasa kwa θεῖον katika muktadha huu.
- source_word: τοῦ ἐκπορευομένου ἐκ τῶν στομάτων αὐτῶν
  choice: vilivyotoka katika vinywa vyao
  rationale: Kirai kinaonyesha vitu hivyo vikitoka kwenye vinywa vya viumbe waliotangulia kutajwa. Wingi wa “vilivyotoka” unarejelea moto, moshi, na kiberiti kwa pamoja.
theological_decisions:
- issue: Maana ya ἀνθρώπων katika hukumu ya kiapokaliptiki
  choice: wanadamu
  alternative: watu
  rationale: “Wanadamu” linaonyesha jamii ya binadamu kwa ujumla bila kuifanya ἀνθρώπων ihusu wanaume pekee, huku likidumisha uzito wa kifungu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi unadumisha urudiaji wa vipengele vitatu vya hukumu bila kuwa mzito kupita kiasi.
