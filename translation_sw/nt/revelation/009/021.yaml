  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ οὐ μετενόησαν ἐκ τῶν φόνων αὐτῶν οὔτε ἐκ τῶν ⸀φαρμάκων αὐτῶν οὔτε ἐκ τῆς πορνείας αὐτῶν οὔτε ἐκ τῶν κλεμμάτων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/021.yaml
  text: And they did not repent of their murders[a], or of their sorceries, or of their sexual immorality, or of their thefts.
translation:
  language: sw
  text: Nao hawakutubu kwa kuacha mauaji yao, wala matendo yao ya uchawi[a], wala uasherati wao, wala wizi wao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno hili la Kigiriki linaweza pia kurejelea dawa au mchanganyiko wa kichawi, sumu, au vitendo vya kutia sumu.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετενόησαν ἐκ
  choice: hawakutubu na kuacha
  rationale: Katika muktadha huu, kitenzi pamoja na ἐκ kinaonyesha si kubadili mawazo tu, bali kutubu na kugeuka kutoka katika dhambi zilizotajwa. Kauli hii ni ya kawaida na inaeleweka wazi katika Kiswahili.
- source_word: φόνων
  choice: mauaji
  rationale: Neno hili humaanisha mauaji au kuua; katika orodha hii ya maovu, “mauaji” linabeba uzito wa kimaadili wa neno la Kigiriki na kuhifadhi wingi wake.
- source_word: φαρμάκων
  choice: matendo ya uchawi
  rationale: Katika Ufunuo na katika orodha hii ya maovu, maana inayowezekana zaidi ni matumizi ya uchawi au mbinu za kichawi. “Matendo ya uchawi” ni Kiswahili cha sasa kilicho wazi kuliko nomino ya kizamani au yenye maana finyu.
- source_word: πορνείας
  choice: uasherati
  rationale: “Uasherati” ni neno la Kiswahili linalotambulika kwa mwenendo mpotovu wa kingono na linafaa katika orodha hii ya maovu, bila kulifunga neno kwa tendo moja pekee.
- source_word: κλεμμάτων
  choice: wizi
  rationale: Katika orodha ya maovu, “wizi” huonyesha kwa kawaida matendo ya kuiba au vitu vilivyoibwa, ingawa Kiswahili hutumia nomino hii hasa katika umoja wa kisarufi.
- source_word: οὔτε ... οὔτε ... οὔτε
  choice: wala ... wala ... wala
  rationale: Baada ya kauli iliyokanushwa, urudiaji wa “wala” unaakisi muundo wa Kigiriki kwa Kiswahili cha kawaida na chenye mtiririko mzuri.
theological_decisions:
- issue: Upana wa maana ya φαρμάκων katika orodha ya maovu ya kiapokaliptiki
  choice: matendo ya uchawi
  alternative: dawa za kichawi, sumu, au vitendo vya kutia sumu
  rationale: Matumizi ya neno hili na maneno ya ukoo wake katika Ufunuo yanaelekea kwenye uchawi na udanganyifu wa kichawi. Hata hivyo, uhusiano wake wa kale na dawa, mchanganyiko wa dawa, au sumu umehifadhiwa katika tanbihi badala ya kuondolewa kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Hawakutubu na kuacha” limetumiwa ili kuonyesha wazi nguvu ya μετενόησαν ἐκ, huku “wala” ikihifadhi mfuatano wa orodha. Alama ya tanbihi imewekwa baada ya “uchawi,” ambako neno φαρμάκων linatokea.
