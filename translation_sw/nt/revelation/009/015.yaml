  text: καὶ ἐλύθησαν οἱ τέσσαρες ἄγγελοι οἱ ἡτοιμασμένοι εἰς τὴν ὥραν ⸀καὶ ἡμέραν καὶ μῆνα καὶ ἐνιαυτόν, ἵνα ἀποκτείνωσιν τὸ τρίτον τῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/015.yaml
  text: And the four angels who had been prepared for the hour and day and month and year were released[b][a], so that they might kill a third of humanity.
translation:
  language: sw
  text: Malaika wale wanne, waliokuwa wameandaliwa kwa ajili ya saa, siku, mwezi na mwaka[a], wakafunguliwa ili waue theluthi moja ya wanadamu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa ajili ya saa hiyo, siku hiyo, mwezi huo na mwaka huo.” Kigiriki kinaweza kusisitiza wakati maalumu kabisa uliowekwa.
    reason: lexical_alternative
  - marker: b
    text: Yaani, binadamu kwa ujumla, si wanaume pekee.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλύθησαν
  choice: wakafunguliwa
  rationale: Kitenzi hiki ni aoristi ya kutendwa kutoka λύω. Kwa kuwa malaika hao walikuwa wamefungwa katika mstari uliotangulia, “wakafunguliwa” ni Kiswahili cha kawaida kinachohifadhi hali ya kutendwa.
- source_word: ἄγγελοι
  choice: malaika
  rationale: Katika muktadha huu wa kiapokaliptiki, neno hili linawahusu viumbe wa rohoni, si wajumbe wa kibinadamu.
- source_word: ἡτοιμασμένοι
  choice: waliokuwa wameandaliwa
  rationale: Hali timilifu ya kutendwa inaonyesha maandalizi yaliyokuwa yamefanyika tayari na hali ya utayari iliyoendelea.
- source_word: εἰς τὴν ὥραν καὶ ἡμέραν καὶ μῆνα καὶ ἐνιαυτόν
  choice: kwa ajili ya saa, siku, mwezi na mwaka huo
  rationale: Mpangilio wa vipimo vya wakati umehifadhiwa ili kuonyesha usahihi unaokusanyika hatua kwa hatua. “Huo” linaonyesha wakati maalumu bila kuufanya kwa lazima kuwa jumla ya kipindi cha vipimo hivyo.
- source_word: ἵνα
  choice: ili
  rationale: “Ili” ni kiunganishi cha kawaida kinachoonyesha kusudi la kufunguliwa kwao.
- source_word: ἀποκτείνωσιν
  choice: waue
  rationale: Hiki ni kitenzi cha kutenda chini ya ἵνα; “waue” ni tafsiri ya moja kwa moja, ya sasa na iliyo wazi.
- source_word: τὸ τρίτον τῶν ἀνθρώπων
  choice: theluthi moja ya wanadamu
  rationale: τὸ τρίτον ni usemi wa sehemu unaomaanisha theluthi moja, na ἀνθρώπων inawahusu binadamu kwa ujumla, si wanaume pekee.
theological_decisions:
- issue: Maana ya kishazi cha wakati “saa, siku, mwezi na mwaka”
  choice: Wakati maalumu uliowekwa unaonyeshwa kwa vipimo vinavyokusanyika kwa usahihi.
  alternative: Kipindi chenye jumla ya mwaka mmoja, mwezi mmoja, siku moja na saa moja.
  rationale: Kigiriki kina kirai kimoja kinachoongozwa na kibainishi kabla ya ὥραν, jambo linaloelekea kuonyesha wakati uliowekwa. Tafsiri inadumisha mpangilio wa maneno bila kulazimisha ratiba fulani ya kiapokaliptiki.
- issue: Upeo wa ἀνθρώπων
  choice: wanadamu
  alternative: watu; wanaume
  rationale: Neno hilo linamaanisha binadamu kwa ujumla. “Wanadamu” linahifadhi maana ya kijumla bila kudokeza kwamba wanaume pekee ndio wanaokusudiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa simulizi “wakafunguliwa” unaendana na mtiririko wa kifungu, huku “waliokuwa wameandaliwa” ukihifadhi hali ya maandalizi yaliyotangulia. “Theluthi moja” ni usemi wa kawaida na sahihi kwa sehemu hiyo.
