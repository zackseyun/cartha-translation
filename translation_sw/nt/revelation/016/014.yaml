id: REV.16.14
reference: Revelation 16:14
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἰσὶν γὰρ πνεύματα δαιμονίων ποιοῦντα σημεῖα, ἃ ἐκπορεύεται ἐπὶ τοὺς βασιλεῖς τῆς οἰκουμένης ὅλης, συναγαγεῖν αὐτοὺς εἰς τὸν πόλεμον τῆς ⸀ἡμέρας τῆς μεγάλης τοῦ θεοῦ τοῦ παντοκράτορος—
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/014.yaml
  text: For they are spirits of demons[a], performing signs, which go out to the kings of the whole world[b], to gather them for the battle of the great day of God the Almighty—
translation:
  language: sw
  text: Kwa maana hizo ni roho za mashetani[a] zinazofanya ishara, nazo huenda kwa wafalme wa ulimwengu wote[b] ili kuwakusanya kwa ajili ya vita vya siku ile kuu ya Mungu Mwenyezi—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “roho za kishetani.”
    reason: lexical_alternative
  - marker: b
    text: Au, “wafalme wa ulimwengu wote unaokaliwa na watu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεύματα δαιμονίων
  choice: roho za mashetani
  rationale: Muundo huu unaakisi kwa karibu kirai cha Kigiriki na unabaki wa kawaida katika Kiswahili; haubainishi kupita kiasi kama genitivi ni ya sifa au asili.
- source_word: ποιοῦντα σημεῖα
  choice: zinazofanya ishara
  rationale: ‘Kufanya ishara’ huhifadhi maana ya matendo yenye uzito wa ajabu bila kuyaita moja kwa moja miujiza ya kimungu au hila tu.
- source_word: ἃ ἐκπορεύεται
  choice: nazo huenda
  rationale: Ingawa kitenzi cha Kigiriki kina umbo la umoja lisiloafikiana na kiwakilishi cha wingi, tafsiri inafuata rejeleo la wingi, yaani roho.
- source_word: ἐπὶ τοὺς βασιλεῖς
  choice: kwa wafalme
  rationale: Pamoja na kitenzi cha mwendo, ἐπί hapa huonyesha kuelekea kwa wafalme ambao roho zinakusudia kuwakusanya.
- source_word: τῆς οἰκουμένης ὅλης
  choice: wa ulimwengu wote
  rationale: Ni Kiswahili cha kawaida kwa wazo la dunia yote inayokaliwa au mpangilio wa ulimwengu wa wanadamu, huku maana ya mwisho ikihifadhiwa katika tanbihi.
- source_word: συναγαγεῖν
  choice: ili kuwakusanya
  rationale: ‘Ili’ huonyesha wazi kusudi la kutoka kwa roho hizo.
- source_word: εἰς τὸν πόλεμον
  choice: kwa ajili ya vita
  rationale: Hueleza lengo la kukusanywa kwa wafalme; ‘vita’ linaweza kutaja pambano hilo la mwisho bila kulazimisha neno la umoja lisilo la kawaida katika Kiswahili.
- source_word: τῆς ἡμέρας τῆς μεγάλης
  choice: vya siku ile kuu
  rationale: Kiunganishi hiki kinahusianisha vita na siku kuu; ‘ile’ huipa kauli uzito wa kieskatolojia ulio wa kawaida na wa asili katika Kiswahili.
- source_word: τοῦ θεοῦ τοῦ παντοκράτορος
  choice: ya Mungu Mwenyezi
  rationale: ‘Mwenyezi’ ni cheo cha Mungu kilichozoeleka na chenye hadhi kwa παντοκράτωρ.
theological_decisions:
- issue: Asili ya ishara zinazofanywa na roho
  choice: Ishara zimetajwa moja kwa moja kama matendo ya roho za mashetani, bila kufafanua utendaji wake.
  alternative: Kuzitaja kuwa hila za kuonekana tu, au miujiza halisi kwa maana ileile ya miujiza ya Mungu.
  rationale: σημεῖα humaanisha ‘ishara’; mstari hauamui kama ni maajabu ya kweli ya nguvu zisizo za Mungu, ishara bandia, au vyote viwili.
- issue: Uhusiano katika πνεύματα δαιμονίων
  choice: roho za mashetani
  alternative: roho za kishetani
  rationale: Genitivi inaweza kueleweka kuwa ya uhusiano/asili au ya sifa. Muundo wa ‘za mashetani’ hudumisha ukaribu na Kigiriki na kiasi fulani cha utata huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inadumisha mwendelezo wa kisarufi na alama ya mwisho ya mkwaju, kwa kuwa aya inaelekea moja kwa moja katika tamko la aya inayofuata.
