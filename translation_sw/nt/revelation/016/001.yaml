id: REV.16.1
reference: Revelation 16:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ ἤκουσα ⸂μεγάλης φωνῆς⸃ ἐκ τοῦ ναοῦ λεγούσης τοῖς ἑπτὰ ἀγγέλοις· Ὑπάγετε καὶ ⸀ἐκχέετε τὰς ἑπτὰ φιάλας τοῦ θυμοῦ τοῦ θεοῦ εἰς τὴν γῆν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/001.yaml
  text: And I heard a loud voice from the sanctuary saying to the seven angels[b][a], “Go and pour out the seven bowls of the wrath of God onto the earth.”
translation:
  language: sw
  text: Kisha nikasikia sauti kubwa kutoka patakatifu[a] ikiwaambia wale malaika saba, “Nendeni mkamimine juu ya dunia yale mabakuli saba[b] ya ghadhabu ya Mungu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Hekalu.” Neno la Kigiriki ναός mara nyingi humaanisha hasa patakatifu pa ndani kuliko eneo lote la Hekalu.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kigiriki humaanisha mabakuli, yaani vyombo vipana na vifupi.
    reason: lexical_clarification
lexical_decisions:
- source_word: μεγάλης φωνῆς
  choice: sauti kubwa
  rationale: Katika muktadha huu μέγας pamoja na φωνή huonyesha ukubwa wa sauti, yaani sauti yenye nguvu na inayosikika wazi; “sauti kubwa” ni usemi wa kawaida na wenye hadhi katika Kiswahili.
- source_word: ναοῦ
  choice: patakatifu
  rationale: ναός mara nyingi humaanisha sehemu takatifu ya ndani, si eneo lote la Hekalu; “patakatifu” huhifadhi umahususi huo katika mandhari ya mbinguni ya Ufunuo.
- source_word: λεγούσης τοῖς ἑπτὰ ἀγγέλοις
  choice: ikiwaambia wale malaika saba
  rationale: Kirai elezi kinakubaliana na “sauti”; Kiswahili cha asili husema sauti “ikiwaambia” watu, na hivyo huhifadhi tendo la kusema pamoja na walengwa wake.
- source_word: Ὑπάγετε
  choice: Nendeni
  rationale: Amri ya wingi inawaagiza malaika waondoke ili kutekeleza tendo linalofuata; “Nendeni” ni wazi na ya kawaida.
- source_word: ἐκχέετε
  choice: mkamimine
  rationale: Umbo hili linaunganisha kwa kawaida amri ya kwenda na kusudi au tendo linalofuata. “Kumimina” huhifadhi taswira ya kuondoa yaliyomo katika vyombo.
- source_word: φιάλας
  choice: mabakuli
  rationale: φιάλη ni bakuli au chombo kipana na kifupi, wala si kichupa; “mabakuli” ni sahihi na inaeleweka katika Kiswahili cha sasa.
- source_word: θυμοῦ τοῦ θεοῦ
  choice: ghadhabu ya Mungu
  rationale: θυμός hapa ni hasira kali ya Mungu katika hukumu. “Ghadhabu” huhifadhi uzito na hadhi ya usemi bila kuongeza dai la kimadhehebu.
- source_word: εἰς τὴν γῆν
  choice: juu ya dunia
  rationale: Pamoja na kitenzi “kumimina,” εἰς huonyesha mwendo unaoelekezwa juu ya dunia. “Dunia” inafaa kwa upeo wa hukumu katika muktadha huu kuliko “nchi.”
theological_decisions:
- issue: Maana ya ναός katika mandhari ya mbinguni
  choice: patakatifu
  alternative: Hekalu
  rationale: “Patakatifu” hutofautisha sehemu takatifu ya ndani na eneo pana la Hekalu, huku tanbihi ikihifadhi tafsiri mbadala halali.
- issue: Maana ya θυμός τοῦ θεοῦ
  choice: ghadhabu ya Mungu
  alternative: hasira ya Mungu
  rationale: “Ghadhabu” huwasilisha uzito wa hukumu ya Mungu na upinzani wake mkali dhidi ya uovu, bila kufafanua zaidi ya matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio “Nendeni mkamimine” ni wa kawaida na huhifadhi uhusiano wa amri mbili za Kigiriki. Viashiria vyote vya tanbihi vimewekwa mara tu baada ya maneno yanayohusika.
