review_pass:
  verdict: revise
  source_fidelity: Draft accurately conveys the hail, its descent from heaven upon humanity, the people's blasphemy of God, and the causal relation to the hail-plague. However, the final verb should retain the Greek present tense (ἐστίν), not shift to past tense (“lilikuwa”). The wording about a talent should also make clear in natural Swahili that the extraordinary weight pertains to the hailstones, rather than to the rainfall as a whole.
  naturalness: “Mvua ya mawe makubwa” is more natural and more precise than “mvua kubwa ya mawe” for hail made up of exceptionally large stones. “Inashuka ... juu ya watu” is direct, idiomatic, and adequately renders the directional force without the somewhat awkward “na kuwaangukia.”
  terminology: “Kumkufuru Mungu,” “pigo,” “mbinguni,” and “talanta” are appropriate Standard East African Swahili choices and suit Revelation’s elevated register. “Pigo lake ni kali mno” naturally conveys μεγάλη ... σφόδρα while retaining the present state in the Greek.
  issues:
  - severity: medium
    issue: 'The final clause uses past tense: “pigo lake lilikuwa kali mno.”'
    rationale: 'The source reads μεγάλη ἐστὶν ἡ πληγὴ αὐτῆς σφόδρα, with present-tense ἐστίν. The preceding aorist of blasphemy may remain past in Swahili, but the final explanatory assertion should be present: “pigo lake ni kali mno.”'
  - severity: low
    issue: “Mvua kubwa ya mawe, yenye uzito wa karibu talanta moja” can grammatically suggest that the rainstorm itself, rather than its individual stones, weighs a talent.
    rationale: The Greek expression denotes hail of talent-like weight; the audit trail appropriately explains this as roughly the weight of a talent for each stone. Explicitly referring to each stone prevents an avoidable Swahili ambiguity.
  revised_text: Na mvua ya mawe makubwa[a], kila jiwe likiwa na uzito wa karibu talanta moja, inashuka kutoka mbinguni juu ya watu. Watu wakamkufuru Mungu kwa sababu ya pigo la mvua hiyo ya mawe, kwa maana pigo lake ni kali mno.[b]
