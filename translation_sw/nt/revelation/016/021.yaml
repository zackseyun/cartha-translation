  to: Na mvua ya mawe makubwa[a], kila jiwe likiwa na uzito wa karibu talanta moja, inashuka kutoka mbinguni juu ya watu. Watu wakamkufuru Mungu kwa sababu ya pigo la mvua hiyo ya mawe, kwa maana pigo lake ni kali mno.[b]
