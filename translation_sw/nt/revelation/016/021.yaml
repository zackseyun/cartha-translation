id: REV.16.21
reference: Revelation 16:21
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ χάλαζα μεγάλη ὡς ταλαντιαία καταβαίνει ἐκ τοῦ οὐρανοῦ ἐπὶ τοὺς ἀνθρώπους· καὶ ἐβλασφήμησαν οἱ ἄνθρωποι τὸν θεὸν ἐκ τῆς πληγῆς τῆς χαλάζης, ὅτι μεγάλη ἐστὶν ἡ πληγὴ αὐτῆς σφόδρα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/021.yaml
  text: And great hail[a], about a talent in weight, comes down from heaven upon the people; and the people blasphemed God because of the plague of the hail[b], because its plague is exceedingly severe.
translation:
  language: sw
  text: Na mvua ya mawe makubwa[a], kila jiwe likiwa na uzito wa karibu talanta moja, inashuka kutoka mbinguni juu ya watu. Watu wakamkufuru Mungu kwa sababu ya pigo la mvua hiyo ya mawe, kwa maana pigo lake ni kali mno.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mvua ya mawe makubwa yenye uzito wa karibu talanta moja.” Kigiriki kinaonyesha ulinganisho wa uzito, si kipimo sahihi kabisa; maana yake ni kwamba kila jiwe lilikuwa na uzito wa takriban talanta moja.
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa maana pigo lake ni kubwa sana.”
    reason: lexical_alternative
lexical_decisions:
- source_word: χάλαζα μεγάλη
  choice: mvua kubwa ya mawe
  rationale: Neno χάλαζα ni nomino ya mkusanyiko; usemi huu ni wa kawaida katika Kiswahili na unaonyesha ukubwa wa mvua hiyo bila kulazimisha wingi wa ‘mawe’ kama vitu binafsi.
- source_word: ὡς ταλαντιαία
  choice: yenye uzito wa karibu talanta moja
  rationale: Hueleza ulinganisho wa uzito, si kipimo sahihi kabisa. ‘Karibu’ huhifadhi nguvu ya ὡς, huku ‘talanta’ ikihifadhi kipimo cha kale.
- source_word: καταβαίνει
  choice: inashuka
  rationale: Wakati uliopo wa Kigiriki umehifadhiwa ili kuonyesha uhai na upeo wa maono ya kinabii.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: kutoka mbinguni
  rationale: ‘Mbinguni’ huhifadhi maana ya mwelekeo kutoka juu pamoja na sajili ya kiteolojia ya Ufunuo; ‘angani’ pia ingewezekana katika maana ya hali ya hewa.
- source_word: ἐπὶ τοὺς ἀνθρώπους
  choice: na kuwaangukia watu
  rationale: ‘Watu’ ni tafsiri jumuishi ya ἄνθρωποι, na ‘kuwaangukia’ huonyesha kwa Kiswahili sanifu kwamba mvua hiyo ilishuka juu yao.
- source_word: ἐβλασφήμησαν
  choice: wakamkufuru
  rationale: ‘Kumkufuru Mungu’ huwasilisha uzito wa kusema dhidi ya Mungu kwa dharau, badala ya maana nyepesi ya kutukana tu.
- source_word: ἐκ τῆς πληγῆς τῆς χαλάζης
  choice: kwa sababu ya pigo la mvua hiyo ya mawe
  rationale: ἐκ ina nguvu ya kisababishi hapa. ‘Pigo’ linafaa katika muktadha wa hukumu za Ufunuo na ni la asili zaidi kuliko ‘tauni’ kwa madhara ya mvua ya mawe.
- source_word: ὅτι μεγάλη ἐστὶν ἡ πληγὴ αὐτῆς σφόδρα
  choice: kwa maana pigo lake lilikuwa kali mno
  rationale: Usemi huu unaonyesha ukali uliosisitizwa na μεγάλη ... σφόδρα kwa Kiswahili cha kawaida, bila kurudia ‘kubwa sana’ kwa namna isiyo laini.
theological_decisions:
- issue: Maana ya οὐρανός katika hukumu ya kinabii
  choice: kutoka mbinguni
  alternative: kutoka angani
  rationale: Muktadha unaweza kurejelea anga kimazingira, lakini ‘mbinguni’ huhifadhi pia sura ya hukumu inayotoka juu iliyo ya kawaida katika Ufunuo, bila kufuta uwezekano wa maana ya anga.
- issue: Ujumuishi wa ἄνθρωποι
  choice: watu
  alternative: wanadamu
  rationale: Neno hilo linawahusu watu kwa jumla, si wanaume pekee; ‘watu’ ni la kawaida na sahihi katika muktadha huu.
- issue: Uhusiano wa ὅτι na sentensi iliyotangulia
  choice: kwa maana
  alternative: kwa sababu
  rationale: ‘Kwa maana’ linaonyesha kuwa kishazi cha mwisho kinaeleza kwa nini pigo la mvua ya mawe lilichochea kufuru, bila kuamua zaidi ya uhusiano wa kisababishi/ufafanuzi uliopo katika ὅτι.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Talanta’ imehifadhiwa kama kipimo cha kale; tanbihi inaeleza kuwa uzito ni wa kukadiriwa. Alama zote za tanbihi zimo katika matini kuu.
