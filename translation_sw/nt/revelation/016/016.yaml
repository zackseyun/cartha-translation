  text: καὶ συνήγαγεν αὐτοὺς εἰς τὸν τόπον τὸν καλούμενον Ἑβραϊστὶ Ἁρμαγεδών.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/016.yaml
  text: And he gathered them to the place that in Hebrew is called Armageddon[a][b].
translation:
  language: sw
  text: Kisha akawakusanya[a] mahali panapoitwa kwa Kiebrania Armagedoni[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki kina kitenzi cha umoja chenye maana ya “akawakusanya.” Mtendaji mmoja hajatajwa wazi; hata hivyo, aya 13–14 zimetaja roho wachafu wanaotoka kwenda kuwakusanya wafalme.
    reason: alternative_reading
  - marker: b
    text: Au “katika lugha ya Kiebrania/Kiaramu.” Katika Ufunuo, usemi “kwa Kiebrania” unaweza kuonyesha umbo la jina katika lugha ya Kisemiti bila kulazimisha tofauti kali kati ya Kiebrania na Kiaramu.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήγαγεν
  choice: akawakusanya
  rationale: Kitenzi cha Kigiriki kiko katika umoja, ‘alikusanya/akawakusanya.’ Kiswahili kinaacha mtendaji bila kutajwa kwa kiwakilishi huru, lakini kiambishi a- kinahifadhi umoja wa kisarufi; hivyo tafsiri haibadili umoja kuwa wingi kwa kutegemea tu muktadha wa aya 13–14.
- source_word: αὐτούς
  choice: -wa-
  rationale: Kiambishi cha yambwa -wa- kinarejelea watu wengi waliokusanywa, yaani wafalme na majeshi yao katika muktadha.
- source_word: τόπον
  choice: mahali
  rationale: ‘Mahali’ ni tafsiri ya kawaida na ya asili ya τόπος katika Kiswahili, bila kudokeza kwa lazima aina maalumu ya eneo.
- source_word: καλούμενον
  choice: panapoitwa
  rationale: Muundo wa kutendwa unaonyesha kwamba mahali hapo ‘panaitwa’ kwa jina hilo na unaunganika kwa kawaida na nomino ya mahali.
- source_word: Ἑβραϊστί
  choice: kwa Kiebrania
  rationale: Hii ni tafsiri wazi ya maana ya msingi ‘katika lugha ya Kiebrania’; tanbihi inahifadhi uwezekano mpana wa jina la Kisemiti, kutia ndani Kiaramu.
- source_word: Ἁρμαγεδών
  choice: Armagedoni
  rationale: Jina limetoholewa kwa tahajia na matamshi yanayoeleweka katika Kiswahili huku likibaki jina maalumu.
theological_decisions:
- issue: Mtendaji wa tendo la kukusanya
  choice: akawakusanya (mtendaji mmoja ambaye hajatajwa wazi)
  alternative: wakawakusanya (roho wachafu wa aya 13–14)
  rationale: Kigiriki kina kitenzi cha umoja, kwa hiyo maandishi makuu yanahifadhi umoja huo bila kumtambulisha mtendaji. Muktadha unaweza kuhusisha tendo hili na roho wachafu walio wengi, lakini kubadili kitenzi kuwa wingi kungesuluhisha kimya kimya mvutano uliomo katika maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wenye heshima na unaosomeka kwa urahisi. ‘Kisha’ linaendeleza simulizi; muundo haumtaji mtendaji kwa jina na hivyo unahifadhi utata wa kifungu cha Kigiriki.
