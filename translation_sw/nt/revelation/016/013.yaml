  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ εἶδον ἐκ τοῦ στόματος τοῦ δράκοντος καὶ ἐκ τοῦ στόματος τοῦ θηρίου καὶ ἐκ τοῦ στόματος τοῦ ψευδοπροφήτου πνεύματα ⸂τρία ἀκάθαρτα⸃ ὡς βάτραχοι·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/013.yaml
  text: And I saw three unclean spirits like frogs coming out of the mouth of the dragon[a], out of the mouth of the beast, and out of the mouth of the false prophet.
translation:
  language: sw
  text: Nikaona roho tatu chafu kama vyura zikitoka katika kinywa cha yule joka, katika kinywa cha yule mnyama, na katika kinywa cha yule nabii wa uongo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nikaona, kutoka katika kinywa cha yule joka, kutoka katika kinywa cha yule mnyama, na kutoka katika kinywa cha yule nabii wa uongo, roho tatu chafu kama vyura.” Kigiriki huweka vifungu vinavyorudiwa vya kuonyesha chanzo kabla ya maneno “roho tatu chafu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδον
  choice: nikaona
  rationale: Wakati uliopita wa kisimulizi unaendelezwa kwa kitenzi cha Kiswahili chenye kiunganishi cha mfululizo “-ka-”; ni usemi wa kawaida katika taarifa ya maono.
- source_word: ἐκ ... τοῦ στόματος
  choice: z ikitoka katika kinywa cha
  rationale: ἐκ huonyesha chanzo au mwendo wa kutoka ndani. “Zikitoka katika kinywa cha” huwasilisha uhusiano huo kwa Kiswahili cha kawaida bila kupoteza urudiaji wa vifungu vitatu vya chanzo.
- source_word: δράκοντος
  choice: yule joka
  rationale: “Joka” huhifadhi taswira ya kiapokaliptiki; “yule” humrejelea mhusika ambaye tayari ametambulishwa katika muktadha.
- source_word: θηρίου
  choice: yule mnyama
  rationale: “Mnyama” ni tafsiri ya kawaida na yenye kueleweka ya θηρίον katika Ufunuo, na huhifadhi ishara bila kuifafanua zaidi.
- source_word: ψευδοπροφήτου
  choice: yule nabii wa uongo
  rationale: Huwasilisha moja kwa moja maana ya nomino ambatani ψευδοπροφήτης na kudumisha hadhi yake kama jina la mhusika wa kiishara.
- source_word: πνεύματα
  choice: roho
  rationale: Katika muktadha huu neno linataja viumbe wa kiroho; “roho” ni istilahi ya kawaida ya kibiblia na umbo lake halibadiliki katika wingi.
- source_word: τρία ἀκάθαρτα
  choice: tatu chafu
  rationale: “Chafu” huhifadhi maana za uchafu wa kidini na wa kiroho za ἀκάθαρτα; upatanisho wa Kiswahili kwa ngeli ya “roho” ni “tatu chafu.”
- source_word: ὡς βάτραχοι
  choice: zilizokuwa kama vyura
  rationale: “Kama vyura” huonyesha wazi kuwa huu ni ulinganisho, si utambulisho; kishazi huifanya sentensi isomeke kwa kawaida.
theological_decisions:
- issue: Asili ya πνεύματα ἀκάθαρτα katika taswira ya kiapokaliptiki
  choice: roho tatu chafu, zilizokuwa kama vyura
  alternative: roho tatu za pepo zilizofanana na vyura
  rationale: Aya yenyewe inasema “roho ... kama vyura.” Haitaji wazi hapa kwamba ni roho za pepo, ingawa aya inayofuata hufafanua hivyo; tafsiri inaacha muktadha utoe ufafanuzi huo.
- issue: Uhusiano wa ὡς βάτραχοι na roho
  choice: zilizokuwa kama vyura
  alternative: vyura watatu wachafu
  rationale: ὡς ni alama ya ulinganisho. Tafsiri haizifanyi roho hizo kuwa vyura kihalisi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kifasihi lakini kinachoeleweka kwa wasomaji wa kawaida. Mpangilio umebadilishwa kidogo kwa ufasaha, huku tanbihi ikihifadhi mpangilio wa Kigiriki. Kirejeleo “yule” kinatumika kwa wahusika wa kiishara waliokwisha kutambulishwa.
