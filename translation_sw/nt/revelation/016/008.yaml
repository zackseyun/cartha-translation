id: REV.16.8
reference: Revelation 16:8
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ ὁ ⸀τέταρτος ἐξέχεεν τὴν φιάλην αὐτοῦ ἐπὶ τὸν ἥλιον· καὶ ἐδόθη αὐτῷ καυματίσαι ⸂τοὺς ἀνθρώπους ἐν πυρί⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/008.yaml
  text: And the fourth poured out his bowl on the sun[a], and it was given to it to scorch the people with fire.
translation:
  language: sw
  text: Na wa nne akamimina bakuli lake juu ya jua, nalo likapewa uwezo wa kuwaunguza watu kwa moto.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ τέταρτος
  choice: wa nne
  rationale: Kivumishi chenye kibainishi kimetumika kama nomino na katika muktadha kinamtaja malaika wa nne; “wa nne” huhifadhi ufupi wa Kigiriki bila kuongeza “malaika” katika mstari huu.
- source_word: ἐξέχεεν
  choice: akamimina
  rationale: Ni kitenzi cha kawaida na cha asili kwa kumimina yaliyomo katika bakuli, na kinafaa kwa mtindo unaojirudia katika sura hii.
- source_word: φιάλην
  choice: bakuli
  rationale: “Bakuli” ni neno la sasa na linaloeleweka kwa chombo kipana kinachomiminwa; huepuka neno la kizamani lisilo la kawaida.
- source_word: ἐπὶ τὸν ἥλιον
  choice: juu ya jua
  rationale: ἐπί pamoja na hali ya accusative huonyesha shabaha ya kumiminwa; “juu ya jua” ni Kiswahili cha asili kinachohifadhi picha hiyo.
- source_word: ἐδόθη αὐτῷ
  choice: nalo likapewa uwezo
  rationale: “Nalo” linarejelea jua, ambalo ndilo rejeleo la karibu na linalofaa kimuktadha. “Uwezo” huwekwa wazi kwa Kiswahili kile kinachotolewa ili sentensi iwe ya kawaida, huku hali tendwa ikihifadhiwa na mtoaji asitajwe.
- source_word: καυματίσαι
  choice: kuwaunguza
  rationale: Kitenzi hiki huonyesha kusababisha joto kali linalochoma; “kuwaunguza” ni cha kawaida na sahihi katika muktadha wa hukumu ya jua.
- source_word: τοὺς ἀνθρώπους
  choice: watu
  rationale: Neno hili linawahusu wanadamu kwa ujumla, si wanaume pekee; “watu” ni tafsiri ya kawaida na isiyobagua kijinsia.
- source_word: ἐν πυρί
  choice: kwa moto
  rationale: Kirai kinaonyesha njia au namna ya kuunguza; “kwa moto” ni cha asili katika Kiswahili na huhifadhi taswira ya moto.
theological_decisions:
- issue: Mtendaji wa kimungu aliyedokezwa katika ἐδόθη
  choice: Hali tendwa “likapewa” imehifadhiwa bila kumtaja Mungu moja kwa moja.
  alternative: Mungu akalipa uwezo; jua likarusiwa
  rationale: Ufunuo hutumia mara nyingi hali tendwa kudokeza ruhusa au mamlaka kutoka kwa Mungu. Kumtaja Mungu wazi kungeongeza jambo lisilotajwa moja kwa moja katika kifungu.
- issue: Rejeleo la αὐτῷ
  choice: 'Kiwakilishi kinarejelea jua: “nalo.”'
  alternative: Malaika wa nne; mtendaji asiyeainishwa
  rationale: Jua ndilo rejeleo la karibu, na tendo la kuwaunguza watu linaendana na jua kama chombo cha hukumu.
- issue: Maana jumuishi ya ἀνθρώπους
  choice: “watu”
  alternative: wanaume; wanadamu
  rationale: Neno la Kigiriki ni la kijumla hapa; “watu” huwasilisha maana hiyo kwa Kiswahili cha kawaida bila kuifanya iwe ya wanaume pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa masimulizi “akamimina … likapewa” unafaa mfululizo wa matukio ya sura hii. Hakuna tanbihi iliyoongezwa kwa sababu rejeleo la jua linaweza kuwasilishwa wazi kwa ngeli ya Kiswahili bila kuondoa hali tendwa ya Kigiriki.
