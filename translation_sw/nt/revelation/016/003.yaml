id: REV.16.3
reference: Revelation 16:3
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ ὁ ⸀δεύτερος ἐξέχεεν τὴν φιάλην αὐτοῦ εἰς τὴν θάλασσαν· καὶ ἐγένετο αἷμα ὡς νεκροῦ, καὶ πᾶσα ψυχὴ ⸀ζωῆς ἀπέθανεν ⸀τὰ ἐν τῇ θαλάσσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/003.yaml
  text: And the second poured out his bowl into the sea[a], and it became blood like that of a dead man, and every living creature in the sea died.
translation:
  language: sw
  text: Kisha wa pili akamimina bakuli lake ndani ya bahari; bahari ikawa damu kama damu ya maiti,[a] na kila kiumbe hai baharini kikafa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “damu kama ya mtu aliyekufa”; Kigiriki kwa neno kwa neno, “damu kama ya mtu aliyekufa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δεύτερος
  choice: wa pili
  rationale: Kivumishi chenye kibainishi kimetumiwa kama nomino na kinamrejelea malaika wa pili katika muktadha, lakini neno ‘malaika’ halipo wazi katika mstari huu; ‘wa pili’ huhifadhi udondoshaji huo.
- source_word: ἐξέχεεν
  choice: akamimina
  rationale: Hili ni neno la kawaida na la asili kwa kumwaga yaliyomo katika bakuli, huku likihifadhi taswira ya hukumu.
- source_word: φιάλην
  choice: bakuli lake
  rationale: φιάλη lilikuwa chombo kipana kama bakuli; ‘bakuli’ ni sahihi na linaeleweka kuliko chupa ndogo.
- source_word: εἰς τὴν θάλασσαν
  choice: baharini
  rationale: Huonyesha yaliyomo yakimiminwa ndani ya bahari na ni usemi wa Kiswahili ulio wa asili.
- source_word: ἐγένετο αἷμα
  choice: ikawa damu
  rationale: Hufuata moja kwa moja muundo wa Kigiriki unaosema bahari ikawa damu, si kwamba ilionekana tu kama damu.
- source_word: ὡς νεκροῦ
  choice: kama ya mtu aliyekufa
  rationale: Neno ‘damu’ linaeleweka baada ya ‘kama ya’; uchaguzi huu huhifadhi umoja na urejeo wa kibinadamu wa νεκροῦ bila kulazimisha maana ya damu kutoka katika maiti.
- source_word: πᾶσα ψυχὴ ζωῆς
  choice: kila kiumbe hai
  rationale: Katika muktadha wa viumbe vya baharini, msemo huu humaanisha kila kiumbe chenye uhai; ‘nafsi’ ingetoa dhana finyu au ya kibinadamu isiyokusudiwa.
- source_word: ἀπέθανεν
  choice: kikafa
  rationale: Ni tafsiri ya moja kwa moja ya kitenzi cha kufa, ikiwa katika upatanisho wa kisarufi na ‘kiumbe’.
- source_word: τὰ ἐν τῇ θαλάσσῃ
  choice: baharini
  rationale: Kirai hiki kinaonyesha mahali viumbe vilivyotajwa vilikokuwa; kukiunganisha na ‘kila kiumbe hai’ ni Kiswahili cha asili.
theological_decisions:
- issue: Asili ya taswira ya pigo
  choice: Kutafsiri kuwa bahari ikawa damu katika maono bila kupunguza ukali wa lugha ya hukumu.
  alternative: 'Kutafsiri kwa mtazamo wa mwonekano tu: ‘ilionekana kama damu.’'
  rationale: Kigiriki kinasema ‘ikawa damu’ kisha kinaifananisha na damu ya mtu aliyekufa. Tafsiri inahifadhi nguvu na mvutano wa taswira hiyo ya hukumu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wazi kwa wasomaji wa kawaida, huku ‘wa pili’ ukihifadhi udondoshaji uliopo katika Kigiriki na tanbihi ikihifadhi uwezekano mwingine wa ὡς νεκροῦ.
