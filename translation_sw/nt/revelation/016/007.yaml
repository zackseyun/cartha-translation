  text: καὶ ἤκουσα τοῦ θυσιαστηρίου λέγοντος· Ναί, κύριε, ὁ θεός, ὁ παντοκράτωρ, ἀληθιναὶ καὶ δίκαιαι αἱ κρίσεις σου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/007.yaml
  text: And I heard the altar saying[a], “Yes, Lord God, the Almighty, true and just are your judgments.”
translation:
  language: sw
  text: Nami nikasikia madhabahu ikisema[a], “Ndiyo, Bwana Mungu, Mwenyezi, hukumu zako ni za kweli na za haki.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “Nikasikia kutoka madhabahuni: ...” Kigiriki kinaweza kuonyesha chanzo cha kile Yohana alichosikia, ingawa muundo wake kwa kawaida zaidi huiwasilisha madhabahu yenyewe kama inayosema.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσα
  choice: nikaisikia
  rationale: 'Kitenzi hiki kinaonyesha tukio rahisi lililotokea wakati uliopita: Yohana alisikia. Kiambishi cha ngeli “-i-” kinaelekeza tendo kwa “madhabahu” bila kuongeza wazo la kusikiliza kwa makusudi.'
- source_word: τοῦ θυσιαστηρίου λέγοντος
  choice: madhabahu ikisema
  rationale: Muundo huu unaiwasilisha madhabahu yenyewe kama msemaji, hivyo unahifadhi uhuishaji wa picha ya kinabii ya Ufunuo. Maana mbadala ya kusikia kitu kikitoka madhabahuni imewekwa katika tanbihi.
- source_word: Ναί
  choice: Ndiyo
  rationale: Hili ni neno thabiti la kukubali au kuthibitisha, na “Ndiyo” linaendeleza dhima yake ya kuitikia kwa Kiswahili cha kawaida.
- source_word: κύριε
  choice: Bwana
  rationale: Hili ndilo neno la kawaida na lenye heshima la kumwita Mungu moja kwa moja.
- source_word: ὁ θεός
  choice: Mungu
  rationale: Ni cheo kinachofuata “Bwana” katika mwito wa moja kwa moja; “Bwana Mungu” ni mtiririko wa asili wa Kiswahili.
- source_word: ὁ παντοκράτωρ
  choice: Mwenyezi
  rationale: “Mwenyezi” ni neno sanifu la Kiswahili linaloonyesha uwezo na utawala wa Mungu juu ya yote, na linafaa kama cheo kinachofuata “Bwana Mungu.”
- source_word: ἀληθιναὶ
  choice: za kweli
  rationale: Kwa kurejelea hukumu, usemi huu unaonyesha kuwa hukumu hizo ni halisi, za kutegemewa, na zinapatana na ukweli.
- source_word: δίκαιαι
  choice: za haki
  rationale: Usemi huu unahifadhi uzito wa kisheria na kimaadili wa hukumu za Mungu bila kudhoofisha maana kuwa ni ‘za usawa’ tu.
- source_word: αἱ κρίσεις σου
  choice: hukumu zako
  rationale: “Hukumu” linahifadhi maana ya maamuzi au matendo ya kimahakama na linafaa katika muktadha wa hukumu za mabakuli.
theological_decisions:
- issue: Madhabahu kuwasilishwa kama msemaji
  choice: “nikaisikia madhabahu ikisema”
  alternative: “nikasikia kutoka madhabahuni, ikisema”
  rationale: Kigiriki kinataja madhabahu kuwa chanzo cha kilichosikiwa na kinaunganisha nayo kitenzi cha kusema. Tafsiri kuu inahifadhi uhuishaji huo wa picha badala ya kuongeza neno “sauti,” lisilopatikana katika mstari huu; uwezekano wa maana ya chanzo umehifadhiwa katika tanbihi.
- issue: Vyeo vya Mungu katika mwito wa moja kwa moja
  choice: “Bwana Mungu, Mwenyezi”
  alternative: “Bwana, Mungu Mwenyezi”
  rationale: Kigiriki kina vipengele vitatu katika mfululizo—Bwana, Mungu, Mwenyezi. Tafsiri hii inavihifadhi vyote bila kuvichanganya kuwa cheo kimoja na inaonyesha kwa koma kwamba “Mwenyezi” ni cheo kinachofuata.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi umewekwa wa asili bila kuondoa picha hai ya kinabii wala uzito wa lugha ya hukumu.
