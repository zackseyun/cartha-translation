id: REV.16.5
reference: Revelation 16:5
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἤκουσα τοῦ ἀγγέλου τῶν ὑδάτων λέγοντος· Δίκαιος εἶ, ὁ ὢν καὶ ὁ ἦν, ⸀ὁ ὅσιος, ὅτι ταῦτα ἔκρινας,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/005.yaml
  text: And I heard the angel of the waters saying[a], “Righteous are you, the one who is and who was, the Holy One[c][b], because you have judged these things.”
translation:
  language: sw
  text: Kisha nikamsikia malaika wa maji akisema[a], “Wewe ni mwenye haki[b], uliyeko na uliyewako, Mtakatifu, kwa sababu umehukumu mambo haya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati zina jina refu zaidi, kama vile “uliyeko na uliyewako na atakayekuja,” huenda likiwa limelinganishwa na maneno yanayofanana mahali pengine katika Ufunuo. Matini iliyotumika hapa inasema, “uliyeko na uliyewako, Mtakatifu.”
    reason: textual_variant
  - marker: b
    text: Au, “Wewe hutenda kwa haki.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ ἀγγέλου τῶν ὑδάτων
  choice: malaika wa maji
  rationale: Muundo wa kimilikishi umetafsiriwa kwa karibu kama ‘malaika wa maji.’ Katika muktadha unaweza kumaanisha malaika mwenye mamlaka juu ya maji, lakini tafsiri hii inadumisha namna ya Kigiriki bila kuifafanua kupita kiasi.
- source_word: Δίκαιος
  choice: mwenye haki
  rationale: Neno hili linaweza kumaanisha mwenye haki au mwenye kutenda kwa haki. ‘Mwenye haki’ linafaa kwa sifa ya Mungu na halipunguzi maana yake hadi uadilifu wa kimahakama pekee.
- source_word: ὁ ὢν καὶ ὁ ἦν
  choice: uliye na uliyekuwako
  rationale: Huu ni utambulisho wa Mungu unaorudiwa katika Ufunuo. Tafsiri hii inahifadhi tofauti kati ya kuwapo kwake sasa na kuwapo kwake wakati uliopita kwa Kiswahili cha kawaida.
- source_word: ὁ ὅσιος
  choice: Wewe Uliye Mtakatifu
  rationale: ὅσιος humtaja aliye mtakatifu katika tabia na uaminifu wake. Muundo huu unasomeka kama jina la heshima linalomwelekea Mungu moja kwa moja na unaepuka kuchanganya kisarufi na kivumishi kilichotangulia.
- source_word: ὅτι
  choice: kwa sababu
  rationale: Kiunganishi hiki kinatoa sababu ya tamko kwamba Mungu ni mwenye haki.
- source_word: ταῦτα
  choice: mambo haya
  rationale: Kigiriki kinasema kwa ujumla ‘haya’ badala ya kurudia wazi ‘hukumu hizi’; ‘mambo haya’ kinahifadhi upana huo.
- source_word: ἔκρινας
  choice: umehukumu
  rationale: Kauli ya wakati uliopita imetafsiriwa kwa hali timilifu, ikionyesha tendo lililotimizwa ambalo umuhimu wake unaendelea katika tangazo hili.
theological_decisions:
- issue: Jina la Mungu lisilo na kipengele kinachotarajia wakati ujao
  choice: uliye na uliyekuwako, Wewe Uliye Mtakatifu
  alternative: uliye na uliyekuwako na atakayekuja
  rationale: Matini ya SBLGNT ina ὁ ὢν καὶ ὁ ἦν, ὁ ὅσιος, si fomula ndefu inayopatikana kwingine katika Ufunuo. Tafsiri inafuata matini hiyo badala ya kuilinganisha kimakusudi na vifungu vingine; tofauti ya hati imeelezwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya ibada lakini kinachoeleweka kwa wasomaji wa kawaida. Mpangilio wa majina ya Mungu umehifadhiwa kwa karibu, huku uakifishaji ukisaidia uwazi. Herufi kubwa katika ‘Wewe Uliye Mtakatifu’ zinaonyesha matumizi kama jina la heshima, si kuingiza fundisho la dhehebu.
