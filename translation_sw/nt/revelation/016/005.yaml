review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the angel associated with the waters, God's righteousness, the shortened divine designation in the SBLGNT text, the causal clause, and the aorist judgment. However, “uliye na” does not idiomatically express ὁ ὢν (“the one who is”); it can suggest “who has.” “uliyeko” accurately conveys continuing existence/presence in this formula.
  naturalness: The register is suitably formal and clear. Replacing “uliye na” with “uliyeko” makes the divine title grammatical and natural in Standard East African Swahili. “Mtakatifu” as an appositional title is concise and reflects the Greek ὁ ὅσιος without introducing an unnecessary additional finite relative clause.
  terminology: “Malaika wa maji,” “mwenye haki,” “Mtakatifu,” “mambo haya,” and “umehukumu” are appropriate. The textual-variant note rightly preserves the absence of the future element in the printed Greek text.
  issues:
  - severity: medium
    issue: “uliye na” is not an adequate Swahili rendering of ὁ ὢν.
    rationale: In this context it is liable to be understood as “you who have,” rather than “you who are.” The established and idiomatic form “uliyeko” preserves the divine designation's existential/present sense.
  revised_text: Kisha nikamsikia malaika wa maji akisema[a], “Wewe ni mwenye haki[b], uliyeko na uliyewako, Mtakatifu, kwa sababu umehukumu mambo haya.”
  revised_footnotes:
  - marker: a
    text: Baadhi ya hati zina jina refu zaidi, kama vile “uliyeko na uliyewako na atakayekuja,” huenda likiwa limelinganishwa na maneno yanayofanana mahali pengine katika Ufunuo. Matini iliyotumika hapa inasema, “uliyeko na uliyewako, Mtakatifu.”
    reason: textual_variant
  - marker: b
    text: Au, “Wewe hutenda kwa haki.”
    reason: lexical_alternative
  revision_rationale: 'Marekebisho yanahitajika tu kwa uaminifu wa maana na ufasaha wa Kiswahili: “uliyeko” hutafsiri ὁ ὢν kwa usahihi, na “uliyewako” hutafsiri ὁ ἦν. “Mtakatifu” huhifadhi cheo cha ὁ ὅσιος na usomaji mfupi wa SBLGNT. Tanbihi imerekebishwa sambamba na matini mpya na nanga zake zimehifadhiwa.'
