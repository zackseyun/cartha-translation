  to: Kisha nikamsikia malaika wa maji akisema[a], “Wewe ni mwenye haki[b], uliyeko na uliyewako, Mtakatifu, kwa sababu umehukumu mambo haya.”
  rationale: 'Marekebisho yanahitajika tu kwa uaminifu wa maana na ufasaha wa Kiswahili: “uliyeko” hutafsiri ὁ ὢν kwa usahihi, na “uliyewako” hutafsiri ὁ ἦν. “Mtakatifu” huhifadhi cheo cha ὁ ὅσιος na usomaji mfupi wa SBLGNT. Tanbihi imerekebishwa sambamba na matini mpya na nanga zake zimehifadhiwa.'
