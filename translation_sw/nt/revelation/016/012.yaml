id: REV.16.12
reference: Revelation 16:12
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ ὁ ἕκτος ἐξέχεεν τὴν φιάλην αὐτοῦ ἐπὶ τὸν ποταμὸν τὸν μέγαν ⸀τὸν Εὐφράτην· καὶ ἐξηράνθη τὸ ὕδωρ αὐτοῦ, ἵνα ἑτοιμασθῇ ἡ ὁδὸς τῶν βασιλέων τῶν ἀπὸ ἀνατολῆς ἡλίου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/012.yaml
  text: And the sixth poured out his bowl on the great river Euphrates[a], and its water was dried up, so that the way of the kings from the rising of the sun might be prepared.
translation:
  language: sw
  text: Kisha yule wa sita akamimina bakuli lake juu ya mto mkubwa, Frati, na maji yake yakakauka, ili njia ya wafalme watokao mawio ya jua[a] iandaliwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au kwa ufupi, “kutoka mashariki.” Kihalisi, “kutoka mawio ya jua.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἕκτος
  choice: yule wa sita
  rationale: Kigiriki kina kivumishi cha mpangilio chenye kibainishi bila nomino; “yule wa sita” kinahifadhi udondoshaji huo huku kikirejelea mhusika wa sita katika muktadha bila kuongeza “malaika.”
- source_word: ἐξέχεεν
  choice: akamimina
  rationale: “Kumimina” ni Kiswahili cha kawaida kwa kutoa kilichomo kwenye chombo na kinahifadhi taswira ya hukumu za mabakuli katika Ufunuo.
- source_word: φιάλην
  choice: bakuli
  rationale: Neno hili humaanisha chombo kipana, si kichupa; “bakuli” ni sahihi na linaeleweka katika Kiswahili cha sasa.
- source_word: ἐπὶ τὸν ποταμὸν τὸν μέγαν τὸν Εὐφράτην
  choice: juu ya mto mkubwa, Frati
  rationale: “Juu ya” linaonyesha mahali ambapo yaliyomo yalimiminwa; “Frati” ni jina la Kiswahili linalotumika kwa Euphrates, na koma inaonyesha kwamba jina hilo linafafanua mto mkubwa.
- source_word: ἐξηράνθη
  choice: yakakauka
  rationale: Kitenzi hiki kinaeleza maji kuondolewa kwa kukauka. Kiswahili hutumia kwa kawaida muundo tendaji wa hali “maji yakakauka,” ambao unawasilisha tukio na matokeo bila kulazimisha Kiswahili kisicho cha kawaida.
- source_word: τὸ ὕδωρ αὐτοῦ
  choice: maji yake
  rationale: Kiwakilishi kinarejelea mto; “maji yake” ni muundo wa kawaida na wazi wa Kiswahili.
- source_word: ἵνα ἑτοιμασθῇ
  choice: ili ... iandaliwe
  rationale: “Ili” linahifadhi dhumuni la ἵνα, na “iandaliwe” linatunza hali ya kutendwa ya kitenzi cha Kigiriki.
- source_word: ἡ ὁδὸς
  choice: njia
  rationale: “Njia” linaweza kumaanisha njia halisi au ya kitamathali, hivyo halifungi mapema maana ya taswira ya kiapokaliptiki.
- source_word: τῶν βασιλέων
  choice: ya wafalme
  rationale: Muundo huu unahifadhi uhusiano wa genitivi na “njia” bila kuufafanua kupita kiasi kuwa umiliki au manufaa pekee.
- source_word: τῶν ἀπὸ ἀνατολῆς ἡλίου
  choice: watokao upande wa mawio ya jua
  rationale: Hifadhi taswira halisi ya mahali jua linapochomoza, huku “upande wa” ikifanya usemi uwe wa kawaida na wazi katika Kiswahili. Tanbihi inatoa maana rahisi “mashariki.”
theological_decisions:
- issue: Kama “yule wa sita” atambulishwe wazi kuwa malaika
  choice: Imeachwa “yule wa sita” bila kuongeza “malaika.”
  alternative: malaika wa sita
  rationale: Muktadha unaonyesha kuwa wahusika ni malaika, lakini mstari huu hauirudii nomino hiyo. Kutoiingiza kunahifadhi udondoshaji wa Kigiriki na kuepuka nyongeza ya kifafanuzi.
- issue: Kama kukauka kwa Frati na kuja kwa wafalme kufafanuliwe kiishara
  choice: Taswira imetafsiriwa moja kwa moja bila maelezo ya kiishara ndani ya mstari.
  alternative: Tafsiri ya maelezo inayotaja uvamizi au mkusanyiko wa mwisho
  rationale: Mstari wenyewe hautoi ufafanuzi kamili wa ishara hizi. Tafsiri inaacha mvutano na uwazi wa kiapokaliptiki badala ya kuamua maana yake kwa niaba ya msomaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi wa kibiblia lakini kinachoeleweka kwa wasomaji wa sasa. “Frati” limetumiwa badala ya umbo la Kiingereza “Euphrates”; “mawio ya jua” yanahifadhi taswira ya Kigiriki, huku tanbihi ikitoa usemi wa kawaida zaidi.
