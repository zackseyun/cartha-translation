id: REV.16.17
reference: Revelation 16:17
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ ὁ ἕβδομος ἐξέχεεν τὴν φιάλην αὐτοῦ ἐπὶ τὸν ἀέρα— καὶ ἐξῆλθεν φωνὴ μεγάλη ⸀ἐκ τοῦ ⸀ναοῦ ἀπὸ τοῦ θρόνου λέγουσα· Γέγονεν—
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/017.yaml
  text: And the seventh poured out his bowl into the air[a], and a loud voice came out from the sanctuary, from the throne, saying[b], “It has come to pass.”
translation:
  language: sw
  text: Na wa saba akamimina bakuli lake hewani, na sauti kubwa ikatoka patakatifu[a], kutoka kwenye kiti cha enzi, ikisema, “Imetendeka.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutoka hekaluni.” Neno la Kigiriki ναός linamaanisha hasa patakatifu pa hekalu, wala si eneo lote la hekalu.
    reason: lexical_alternative
  - marker: b
    text: Au, “Imekwisha.”
    reason: alternative_rendering
lexical_decisions:
- source_word: ὁ ἕβδομος
  choice: wa saba
  rationale: Kigiriki kinatumia namba ya mpangilio pekee yenye kibainishi. Muktadha unaonyesha kuwa ni malaika wa saba, lakini neno “malaika” halipo katika mstari huu; kwa hiyo udondoshaji huo umehifadhiwa.
- source_word: ἐξέχεεν
  choice: akamimina
  rationale: Ni kitenzi cha kawaida na cha asili kwa kumwaga kilichomo katika bakuli, na kinadumisha mtindo unaorudiwa katika sura hii.
- source_word: φιάλην
  choice: bakuli
  rationale: Neno hilo linamaanisha chombo kipana na kifupi; “bakuli” ni neno la sasa linaloeleweka vizuri kuliko tafsiri inayoweza kudokeza kichupa.
- source_word: ἐπὶ τὸν ἀέρα
  choice: hewani
  rationale: Katika muktadha wa kumimina, “hewani” ni Kiswahili cha kawaida kinachoonyesha mahali ambako yaliyomo yalimiminwa bila uliteralishaji usio wa asili.
- source_word: ἐξῆλθεν φωνὴ μεγάλη
  choice: sauti kubwa ikatoka
  rationale: “Sauti kubwa” ni usemi wa kawaida wa Kiswahili kwa sauti yenye nguvu, huku “ikatoka” ikihifadhi wazo la mwendo kutoka mahali fulani.
- source_word: ἐκ τοῦ ναοῦ
  choice: katika patakatifu
  rationale: ναός humaanisha hasa sehemu takatifu ya hekalu, si jengo au eneo lote la hekalu. “Patakatifu” huhifadhi umahususi huo.
- source_word: ἀπὸ τοῦ θρόνου
  choice: kutoka kwenye kiti cha enzi
  rationale: Kirai hiki kimehifadhiwa pamoja na chanzo cha kwanza cha sauti bila kuvifanya kuwa chanzo kimoja.
- source_word: λέγουσα
  choice: ikisema
  rationale: Kitenzi hiki kinarejelea “sauti”; muundo wa Kiswahili “sauti ... ikisema” ni wazi na wa asili.
- source_word: Γέγονεν
  choice: Imetendeka
  rationale: Kauli timilifu ya γίνομαι inaonyesha tukio lililofanyika na matokeo yake yaliyopo. “Imetendeka” huhifadhi maana hiyo bila kufafanua wazi jambo lisilotajwa.
theological_decisions:
- issue: Maana ya ναός katika taswira ya hekalu la mbinguni
  choice: patakatifu
  alternative: hekalu
  rationale: “Patakatifu” huhifadhi tofauti ya kileksika kati ya ναός, yaani sehemu takatifu yenyewe, na neno linaloweza kumaanisha eneo pana la hekalu. Tanbihi inahifadhi tafsiri pana inayowezekana.
- issue: Kauli ya mwisho Γέγονεν
  choice: Imetendeka
  alternative: Imekwisha
  rationale: “Imetendeka” inabaki karibu na maana ya γίνομαι na hali timilifu bila kuamua kwa niaba ya msomaji iwapo msisitizo mkuu ni kutokea kwa jambo au kukamilika kwake. “Imekwisha” imehifadhiwa kama uwezekano unaosisitiza ukamilisho.
translation_notes:
  register: 'Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa sasa. Muundo “wa saba” umeacha jina “malaika” bila kuliongeza, kama ilivyo katika Kigiriki. Sentensi imehifadhi maelezo mawili ya chanzo cha sauti: patakatifu na kiti cha enzi.'
