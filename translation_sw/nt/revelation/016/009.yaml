id: REV.16.9
reference: Revelation 16:9
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἐκαυματίσθησαν οἱ ἄνθρωποι καῦμα μέγα· καὶ ⸀ἐβλασφήμησαν τὸ ὄνομα τοῦ θεοῦ τοῦ ἔχοντος ⸀τὴν ἐξουσίαν ἐπὶ τὰς πληγὰς ταύτας, καὶ οὐ μετενόησαν δοῦναι αὐτῷ δόξαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/009.yaml
  text: And the people were scorched with great heat[a], and they blasphemed the name of God, who has authority over these plagues[b], and they did not repent to give him glory.
translation:
  language: sw
  text: Nao watu wakaunguzwa kwa joto kali, wakalitukana jina la Mungu, aliye na mamlaka juu ya mapigo haya, wala hawakutubu ili kumpa utukufu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκαυματίσθησαν
  choice: wakaunguzwa
  rationale: Kitenzi hiki cha hali ya kutendwa kinaonyesha kuunguzwa kwa joto; “wakaunguzwa” ni cha kawaida na hakidokezi kwamba waliteketezwa kabisa.
- source_word: οἱ ἄνθρωποι
  choice: watu
  rationale: Ingawa umbo la Kigiriki ni la kiume kwa sarufi, hapa linawarejelea wanadamu kwa ujumla, si wanaume pekee.
- source_word: καῦμα μέγα
  choice: kwa joto kali
  rationale: Kirai kinaonyesha chombo au kiwango cha kuunguzwa; “joto kali” ni Kiswahili cha asili kinachoeleza uzito wa joto.
- source_word: ἐβλασφήμησαν
  choice: wakalikufuru
  rationale: Kwa kuwa tendo linaelekezwa kwa jina la Mungu, “kukufuru” huhifadhi uzito wa kidini wa usemi wa kumvunjia Mungu heshima.
- source_word: τὸ ὄνομα τοῦ θεοῦ
  choice: jina la Mungu
  rationale: Huhifadhi nahau ya kibiblia ambamo jina linawakilisha utambulisho na heshima ya Mungu.
- source_word: τοῦ ἔχοντος τὴν ἐξουσίαν ἐπὶ τὰς πληγὰς ταύτας
  choice: aliye na mamlaka juu ya mapigo haya
  rationale: “Aliye na” huakisi hali ya sasa ya ἔχοντος, na “mamlaka juu ya” huwasilisha ἐξουσία na uhusiano wake na mapigo bila kupanua dai la maandiko.
- source_word: πληγὰς
  choice: mapigo
  rationale: “Mapigo” ni neno la kawaida la kibiblia kwa hukumu hizi na huhifadhi mwangwi wa mapigo ya Kutoka.
- source_word: οὐ μετενόησαν
  choice: wala hawakutubu
  rationale: Katika muktadha wa hukumu, μετανοέω ni toba ya kimaadili na kiroho, si kubadili tu mawazo.
- source_word: δοῦναι αὐτῷ δόξαν
  choice: ili kumpa utukufu
  rationale: Kirai hiki huhifadhi picha ya kibiblia ya kumpa Mungu utukufu na kueleza tendo ambalo toba ilipaswa kuelekea kwalo.
theological_decisions:
- issue: Upeo wa οἱ ἄνθρωποι
  choice: watu, ikiwa ni rejeleo jumuishi la wanadamu
  alternative: wanaume
  rationale: Muktadha unaonyesha watu walio chini ya hukumu kwa ujumla, wala hautengi wanaume pekee.
- issue: Mamlaka ya Mungu katika τοῦ ἔχοντος τὴν ἐξουσίαν ἐπὶ τὰς πληγὰς ταύτας
  choice: Mungu ana mamlaka juu ya mapigo haya
  alternative: Mungu anahusishwa tu na mapigo haya
  rationale: Maandishi yanamtaja Mungu moja kwa moja kuwa mwenye ἐξουσία juu ya mapigo; tafsiri hailainishi wala kupanua dai hilo.
- issue: Uhusiano wa δοῦναι αὐτῷ δόξαν na kutubu
  choice: ili kumpa utukufu
  alternative: na hivyo kumpa utukufu
  rationale: Infinitivu inaweza kuonyesha kusudi au matokeo yanayotarajiwa ya toba. “Ili” ni ya asili na huhifadhi uhusiano huo bila kuufafanua kupita kiasi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo wa sentensi unahifadhi mfululizo wa matendo ya Kigiriki huku ukitumia viunganishi vya kawaida vya Kiswahili.
