review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately represents the sequence and principal meanings of the Greek: people are scorched by severe heat, blaspheme God''s name, acknowledge neither repentance nor giving him glory, and God is described as having authority over these plagues. “Watu,” “mapigo,” and “mamlaka juu ya” are sound choices. The purpose/result relation expressed by δοῦναι is acceptably conveyed by “ili.”'
  naturalness: The sentence is generally fluent Standard East African Swahili. However, “wakalikufuru jina la Mungu” is less idiomatic and can suggest renouncing or rejecting the name/faith rather than reviling it. “Wakalitukana jina la Mungu” is clearer, natural biblical Swahili for blaspheming God's name.
  terminology: “Kutubu,” “utukufu,” “mapigo,” and “mamlaka” are appropriate established biblical terms. Replacing “kufuru” with “kutukana” at this point better conveys βλασφημέω without narrowing it to apostasy.
  issues:
  - severity: medium
    issue: Rendering of ἐβλασφήμησαν
    rationale: “Wakalikufuru jina la Mungu” is grammatically possible, but “kukufuru” commonly denotes rejecting God, faith, or religion. In this construction the Greek specifically says that they spoke abusively against God's name. “Wakalitukana jina la Mungu” directly preserves that object and force.
  revised_text: Nao watu wakaunguzwa kwa joto kali, wakalitukana jina la Mungu, aliye na mamlaka juu ya mapigo haya, wala hawakutubu ili kumpa utukufu.
