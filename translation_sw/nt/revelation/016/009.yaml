  to: Nao watu wakaunguzwa kwa joto kali, wakalitukana jina la Mungu, aliye na mamlaka juu ya mapigo haya, wala hawakutubu ili kumpa utukufu.
  rationale: A single lexical revision clarifies the act of blasphemy against God's name while retaining the source text's syntax, scope, register, and theological restraint. No footnotes are required in the Swahili text.
