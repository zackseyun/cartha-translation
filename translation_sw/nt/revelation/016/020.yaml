translation:
  language: sw
  text: Na kila kisiwa kikakimbia[a], na milima haikupatikana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kikatoweka.” Kitenzi cha Kigiriki kihalisi humaanisha “kilikimbia,” na hivyo huhifadhi uhuishaji wenye nguvu katika mstari huu.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσα νῆσος
  choice: kila kisiwa
  rationale: 'Nomino ya umoja pamoja na πᾶσα ina maana ya kugawa: kila kisiwa kimoja baada ya kingine.'
- source_word: ἔφυγεν
  choice: kikakimbia
  rationale: Kitenzi φεύγω kimsingi humaanisha kukimbia au kutoroka; tafsiri hii inadumisha uhuishaji wenye nguvu wa lugha ya kinabii, badala ya kuifafanua moja kwa moja kuwa kutoweka.
- source_word: ὄρη
  choice: milima
  rationale: Wingi wa ὄρος unamaanisha milima; hakuna haja ya kuongeza kiashirio kisichomo katika Kigiriki.
- source_word: οὐχ εὑρέθησαν
  choice: haikuonekana
  rationale: Kauli tendwa ya εὑρίσκω pamoja na ukanushi ina maana kwamba milima haikupatikana au haikuonekana; katika Kiswahili cha kawaida, 'haikuonekana' huwasilisha kwa ufupi hali ya kutopatikana bila kuongeza maelezo.
- source_word: καὶ ... καὶ
  choice: Na ... na
  rationale: Kurudia kiunganishi kunahifadhi mtindo wa kuunganisha matukio mfululizo unaotambulika katika Ufunuo.
theological_decisions:
- issue: Iwapo lugha ya kinabii kuhusu kisiwa kukimbia ifafanuliwe moja kwa moja kuwa kutoweka
  choice: Kudumisha taswira halisi ya 'kikakimbia'
  alternative: kikatoweka
  rationale: Kigiriki kinatumia taswira thabiti yenye uhuishaji. Tafsiri haipaswi kuamua iwapo tukio hilo ni la moja kwa moja au la mfano.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa simulizi 'kikakimbia' unaendeleza mfululizo wa maono, huku 'haikuonekana' ukisomeka kwa kawaida na kudumisha maana ya kutopatikana.
