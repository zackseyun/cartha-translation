id: REV.16.18
reference: Revelation 16:18
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἐγένοντο ἀστραπαὶ καὶ ⸂φωναὶ καὶ βρονταί⸃, καὶ σεισμὸς ⸀ἐγένετο μέγας, οἷος οὐκ ἐγένετο ἀφ’ οὗ ⸂ἄνθρωποι ἐγένοντο⸃ ἐπὶ τῆς γῆς τηλικοῦτος σεισμὸς οὕτω μέγας,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/018.yaml
  text: And there were flashes of lightning and sounds and peals of thunder, and there was a great earthquake, such as had not happened since men came to be on the earth—so great was that earthquake.
translation:
  language: sw
  text: Kukatokea mimweko ya radi, sauti, na milio ya ngurumo. Kukawa na tetemeko kubwa la ardhi, ambalo halikuwa limewahi kutokea tangu wanadamu walipoanza kuwapo duniani—tetemeko hilo lilikuwa kubwa mno.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀστραπαὶ
  choice: mimweko ya radi
  rationale: Huwakilisha hali ya wingi na matukio ya kurudiwa ya mwanga wa radi kwa Kiswahili cha kawaida na chenye uhai.
- source_word: φωναὶ
  choice: sauti
  rationale: Neno hili la Kiswahili huhifadhi uwezekano wa maana ya sauti kwa ujumla bila kulazimisha kwamba ni maneno yanayosemwa; hivyo linafaa katika mfululizo wa radi na ngurumo.
- source_word: βρονταί
  choice: milio ya ngurumo
  rationale: Hutoa maana ya wingi na ya ngurumo zinazosikika mara kadhaa kwa mtindo wa asili wa Kiswahili.
- source_word: σεισμὸς μέγας
  choice: tetemeko kubwa la ardhi
  rationale: Ni usemi wazi na wa kawaida kwa tetemeko lenye ukubwa mkubwa, huku ukihifadhi uzito wa μέγας.
- source_word: οἷος οὐκ ἐγένετο
  choice: ambalo halikuwa limewahi kutokea
  rationale: Huonyesha kwamba tukio hilo halikuwa na kifani katika kipindi kinachotajwa, bila kuongeza maelezo yasiyomo katika chanzo.
- source_word: ἀφ’ οὗ ἄνθρωποι ἐγένοντο ἐπὶ τῆς γῆς
  choice: tangu wanadamu walipoanza kuwapo duniani
  rationale: “Wanadamu” huonyesha kwa usahihi maana jumuishi ya ἄνθρωποι, na “walipoanza kuwapo” hudokeza kuingia kwao katika hali ya kuwapo kama ilivyo katika ἐγένοντο.
- source_word: τηλικοῦτος σεισμὸς οὕτω μέγας
  choice: tetemeko hilo lilikuwa kubwa mno
  rationale: Huhifadhi msisitizo wa kurudiwa kuhusu ukubwa usio wa kawaida wa tetemeko kwa Kiswahili cha asili.
theological_decisions:
- issue: Maana jumuishi ya ἄνθρωποι katika ulinganisho wa historia ya wanadamu
  choice: wanadamu
  alternative: watu
  rationale: Muktadha unarejelea jamii yote ya kibinadamu, si wanaume pekee. “Wanadamu” ni sahihi, wenye hadhi, na haubadili maana hiyo kuwa ya kijinsia.
- issue: Uwezekano wa φωναὶ kumaanisha sauti au sauti za viumbe wanaosema
  choice: sauti
  alternative: sauti za watu
  rationale: Chanzo hakitaji wazi kwamba ni kauli au maneno ya watu. “Sauti” huhifadhi upana huo wa maana na mvutano wa taswira ya kiapokaliptiki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi na inayoeleweka kwa urahisi. Marudio ya “tetemeko” yamehifadhiwa ili kuonyesha msisitizo wa Kigiriki, huku sentensi ndefu ya chanzo ikigawanywa kwa mtiririko wa kawaida wa Kiswahili.
