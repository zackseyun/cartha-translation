id: REV.16.10
reference: Revelation 16:10
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ ὁ πέμπτος ἐξέχεεν τὴν φιάλην αὐτοῦ ἐπὶ τὸν θρόνον τοῦ θηρίου· καὶ ἐγένετο ἡ βασιλεία αὐτοῦ ἐσκοτωμένη, καὶ ἐμασῶντο τὰς γλώσσας αὐτῶν ἐκ τοῦ πόνου,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/010.yaml
  text: And the fifth poured out his bowl on the throne of the beast[a], and its kingdom became darkened, and they were gnawing their tongues because of the pain[b],
translation:
  language: sw
  text: Yule wa tano akamimina bakuli lake juu ya kiti cha enzi cha yule mnyama, na ufalme wake[a] ukawa umetiwa giza[b]. Nao wakawa wakitafuna ndimi zao kwa sababu ya maumivu,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “eneo lake la utawala.”
    reason: Βασιλεία yaweza kusisitiza ufalme wenyewe au mamlaka na eneo linalotawaliwa.
  - marker: b
    text: Au, “ukatumbukizwa gizani.”
    reason: Hii ni tafsiri yenye mkazo zaidi ya hali iliyotokana na ἐσκοτωμένη.
lexical_decisions:
- source_word: ὁ πέμπτος
  choice: Yule wa tano
  rationale: Nakala ya Kigiriki ina namba ya mpangilio yenye kibainishi, bila kutaja wazi “malaika.” “Yule wa tano” ni Kiswahili cha kawaida kinachohifadhi jambo hilo huku muktadha ukionyesha anayelengwa.
- source_word: ἐξέχεεν τὴν φιάλην αὐτοῦ
  choice: akamimina bakuli lake
  rationale: “Kumimina” linafaa kwa ἐκχέω katika mfululizo wa hukumu za mabakuli, na “bakuli” ni neno la sasa na linaloeleweka kwa φιάλη, chombo kipana na kifupi.
- source_word: ἐπὶ τὸν θρόνον τοῦ θηρίου
  choice: juu ya kiti cha enzi cha yule mnyama
  rationale: “Juu ya” linaonyesha mahali tendo lilipoelekezwa; “kiti cha enzi” na “yule mnyama” vinahifadhi taswira ya kifalme na ya kinabii ya Ufunuo.
- source_word: ἡ βασιλεία αὐτοῦ
  choice: ufalme wake
  rationale: “Ufalme” ni kisawe cha moja kwa moja cha βασιλεία na hapa huonyesha eneo au mamlaka ya utawala wa yule mnyama. Kiwakilishi “wake” hakilazimishi jinsia katika Kiswahili.
- source_word: ἐγένετο ... ἐσκοτωμένη
  choice: ukatiwa giza
  rationale: Muundo huu unaonyesha kuingia katika hali iliyosababishwa ya kuwa na giza. “Ukatiwa giza” huhifadhi hali ya kutendwa na mwanzo wa matokeo bila kuongeza taswira isiyokuwamo.
- source_word: ἐμασῶντο τὰς γλώσσας αὐτῶν
  choice: wakawa wakiumauma ndimi zao
  rationale: Wakati wa kitenzi cha Kigiriki unaonyesha tendo linaloendelea. “Wakawa wakiumauma” huwasilisha kurudiwa na kuendelea kwa tendo kutokana na uchungu mkubwa.
- source_word: ἐκ τοῦ πόνου
  choice: kwa sababu ya maumivu
  rationale: ἐκ hapa huonyesha chanzo au sababu; usemi huu ni wa asili na wazi katika Kiswahili.
theological_decisions:
- issue: Kiwakilishi kinachomhusu yule mnyama
  choice: ufalme wake
  alternative: ufalme wa yule mnyama
  rationale: Kigiriki hutumia kiwakilishi kinachorudi kwa θηρίον. Kiswahili “wake” ni cha asili na hakitatui kimakusudi swali la uanadamu au jinsia ya yule mnyama.
- issue: Kiwango cha taswira katika hukumu ya giza
  choice: ukatiwa giza
  alternative: ukatumbukizwa gizani
  rationale: Kigiriki kinasema kwamba ufalme uliwekwa katika hali ya kutiwa giza. Chaguo kuu huhifadhi nguvu ya hali ya kutendwa bila kuongeza sitiari ya kutumbukizwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Yule wa tano” huepuka kuongeza “malaika,” ambalo linaeleweka kwa muktadha lakini halipo wazi katika mstari huu. Uakifishaji wa mwisho huhifadhi mwendelezo wa sentensi ya Kigiriki kuelekea mstari unaofuata.
