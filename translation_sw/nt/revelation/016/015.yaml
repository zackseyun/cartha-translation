id: REV.16.15
reference: Revelation 16:15
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἰδοὺ ἔρχομαι ὡς κλέπτης. μακάριος ὁ γρηγορῶν καὶ τηρῶν τὰ ἱμάτια αὐτοῦ, ἵνα μὴ γυμνὸς περιπατῇ καὶ βλέπωσιν τὴν ἀσχημοσύνην αὐτοῦ—
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/015.yaml
  text: Behold[a], I am coming like a thief. Blessed is the one who stays awake and keeps his garments[b], so that he may not walk about naked and they see his shame—
translation:
  language: sw
  text: “Tazama, ninakuja kama mwizi. Heri mtu anayekesha[a] na kuyatunza mavazi yake, ili asije akatembea uchi na waione aibu yake[b]—”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “anayekaa macho” au “anayelinda zamu.”
    reason: lexical_alternative
  - marker: b
    text: Au “uchi wake wa aibu”; neno la Kigiriki linaweza kumaanisha kufunuliwa kwa namna ya aibu au isiyofaa.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Tazama
  rationale: Ni tamko la kuvuta usikivu linalodumisha uzito wa onyo la kinabii kwa Kiswahili cha sasa.
- source_word: ἔρχομαι
  choice: ninakuja
  rationale: Wakati wa sasa wa Kigiriki una nguvu ya tukio linalokaribia; “ninakuja” hudumisha uhai na ukaribu huo.
- source_word: ὡς κλέπτης
  choice: kama mwizi
  rationale: Hudumisha tashbihi ya kuja kusikotarajiwa bila kudokeza kwamba tabia ya msemaji inafananishwa kimaadili na ya mwizi.
- source_word: μακάριος
  choice: Heri
  rationale: “Heri” ni usemi wa kawaida wa baraka katika kauli za namna hii na una uzito mpana kuliko furaha ya kihisia pekee.
- source_word: ὁ γρηγορῶν
  choice: mtu anayekesha
  rationale: “Kukesha” hudumisha picha halisi ya kutolala na maana ya kuwa macho au mwangalifu.
- source_word: τηρῶν
  choice: kuyatunza
  rationale: Kitenzi hiki kinaweza kumaanisha kutunza, kulinda, au kuhifadhi; “kuyatunza” hakibani maana kwa tendo moja tu.
- source_word: τὰ ἱμάτια αὐτοῦ
  choice: mavazi yake
  rationale: “Mavazi” ni neno la heshima na la kawaida linalodumisha pia uwezekano wa maana ya mfano katika Ufunuo.
- source_word: ἵνα μὴ
  choice: ili asije
  rationale: Muundo huu wa Kiswahili huonyesha kusudi hasi na hatari inayokusudiwa kuepukwa.
- source_word: γυμνὸς περιπατῇ
  choice: akatembea uchi
  rationale: Hudumisha picha halisi ya mtu anayetembea akiwa uchi.
- source_word: βλέπωσιν
  choice: waione
  rationale: Kiima cha wingi hakikutajwa katika Kigiriki; Kiswahili kinaweza kukiacha bila kukitambulisha kuwa “watu” au “wengine.”
- source_word: ἀσχημοσύνην αὐτοῦ
  choice: aibu yake
  rationale: Hufikisha fedheha inayotokana na kufunuliwa bila kuifafanua kupita kiasi kuwa uchi au sehemu fulani za mwili.
theological_decisions:
- issue: Maana ya mfano ya mavazi na uchi katika muktadha wa kiapokaliptiki
  choice: Kudumisha picha halisi za “mavazi,” “uchi,” na “aibu” bila kuzifafanua kimafundisho katika matini kuu.
  alternative: Kufasiri mavazi kuwa mwenendo wa haki au utayari wa kiroho, na uchi kuwa fedheha ya hukumu ya mwisho.
  rationale: Kigiriki kinatoa picha hizo bila kuzifumbua moja kwa moja; tafsiri inaacha mvutano na maana zake za mfano wazi.
- issue: Rejeo la mtu mmoja katika muundo wa kiume wa Kigiriki
  choice: Kutumia “mtu” na viambishi vya umoja.
  alternative: Kubadili kuwa wingi, kama “watu wanaokesha na kuyatunza mavazi yao.”
  rationale: Muundo wa Kigiriki ni wa umoja wenye maana wakilishi; Kiswahili cha “mtu” hudumisha umoja huo bila kulazimisha jinsia katika nomino.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya usemi wa kinabii lakini kinachoeleweka kwa msomaji wa kawaida. Alama za tanbihi [a] na [b] zimewekwa baada ya maneno yanayohusika, na kistari cha mwisho kimedumishwa kwa kuwa sentensi inaingia kama kauli ya ghafla katika muktadha.
