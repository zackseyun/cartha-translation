  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ ἀπῆλθεν ὁ πρῶτος καὶ ἐξέχεεν τὴν φιάλην αὐτοῦ εἰς τὴν γῆν· καὶ ἐγένετο ἕλκος κακὸν καὶ πονηρὸν ἐπὶ τοὺς ἀνθρώπους τοὺς ἔχοντας τὸ χάραγμα τοῦ θηρίου καὶ τοὺς προσκυνοῦντας τῇ εἰκόνι αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/002.yaml
  text: And the first went and poured out his bowl onto the earth[a], and a harmful and grievous sore came upon the people who had the mark of the beast and who worshiped its image.
translation:
  language: sw
  text: Yule wa kwanza akaenda akalimwaga bakuli lake juu ya nchi. Ndipo kidonda kibaya na cha kutisha[a] kikawapata watu wenye alama ya yule mnyama na wanaoiabudu sanamu yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kidonda chenye madhara na kiovu.” Kigiriki kinatumia vivumishi viwili vyenye nguvu, κακόν na πονηρόν, kusisitiza ukali wa pigo hilo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆλθεν
  choice: akaenda
  rationale: Kitenzi hiki kinaendeleza mfuatano wa simulizi. “Akaenda” ni Kiswahili cha kawaida na hakiongezi wazo la kuondoka kabisa.
- source_word: ὁ πρῶτος
  choice: Yule wa kwanza
  rationale: Kivumishi chenye kibainishi kimetumiwa kama nomino na kinamrejelea wa kwanza kati ya wale saba. Tafsiri hii haiingizi neno “malaika” ambalo halipo wazi katika mstari huu.
- source_word: ἐξέχεεν
  choice: akalimwaga
  rationale: “Kumwaga” linaonyesha kwa kawaida tendo la kutoa kimiminika kutoka chomboni; kiambishi “-li-” kinalirejelea bakuli kwa mtiririko wa asili wa Kiswahili.
- source_word: φιάλην
  choice: bakuli
  rationale: “Bakuli” ni neno linaloeleweka kwa chombo kipana cha kumwagia na linafaa kwa matumizi yanayojirudia katika Ufunuo kuliko “chupa” au “kibakuli.”
- source_word: εἰς τὴν γῆν
  choice: juu ya nchi
  rationale: εἰς hapa linaonyesha shabaha ya kumwagwa. “Juu ya nchi” ni ya kawaida na linaacha γῆ likimaanisha dunia/nchi bila kulibana kuwa eneo fulani.
- source_word: ἐγένετο ἕλκος
  choice: Ndipo kidonda ... kikawapata
  rationale: Muundo huu unaonyesha kidonda kutokea kama matokeo ya kumwagwa na kuwafikia watu waliotajwa. Umoja wa “kidonda” umehifadhiwa kama usemi wa pamoja wa pigo.
- source_word: κακὸν καὶ πονηρὸν
  choice: kibaya na chenye kuumiza sana
  rationale: Maneno mawili yenye nguvu yamehifadhiwa ili kusisitiza ubaya na uzito wa kidonda. “Chenye kuumiza sana” kinaeleza athari yake bila kukipa kidonda uovu wa kimaadili.
- source_word: ἐπὶ τοὺς ἀνθρώπους
  choice: kikawapata watu
  rationale: “Watu” linawahusu wanadamu kwa ujumla bila kubana jinsia; “kikawapata” linaonyesha pigo kuwajia wale waliotajwa.
- source_word: τοὺς ἔχοντας τὸ χάραγμα τοῦ θηρίου
  choice: waliokuwa na alama ya yule mnyama
  rationale: Muundo wa kishirikishi umetafsiriwa kwa kishazi cha uhusiano cha asili. “Alama ya yule mnyama” huhifadhi istilahi muhimu ya Ufunuo.
- source_word: τοὺς προσκυνοῦντας τῇ εἰκόνι αὐτοῦ
  choice: waliokuwa wakiiabudu sanamu yake
  rationale: Hali endelevu ya kishirikishi cha sasa imeonyeshwa kwa “walikuwa wakiiabudu.” “Sanamu” hapa huwasilisha picha iliyofanywa kuwa kitu cha kuabudiwa.
theological_decisions:
- issue: Maana ya vivumishi viwili κακὸν καὶ πονηρὸν vinavyoeleza ἕλκος
  choice: kidonda kibaya na chenye kuumiza sana
  alternative: kidonda chenye madhara na cha kutisha
  rationale: Maandishi yanaweka pamoja maneno mawili yanayokaribiana ili kuongeza uzito wa pigo. Tafsiri inahifadhi msisitizo huo bila kuamua kwamba kidonda chenyewe kina uovu wa kimaadili.
- issue: Watu wanaopatwa na pigo
  choice: watu waliokuwa na alama ya yule mnyama na waliokuwa wakiiabudu sanamu yake
  alternative: wale wenye alama ... na wanaoiabudu ...
  rationale: Mstari unalielekeza pigo kwa watu waliofungamana na yule mnyama kwa kuwa na alama yake na kuiabudu sanamu yake. Tafsiri haipanui hukumu iwahusu watu wasiobainishwa na maandishi.
- issue: Utambulisho wa ὁ πρῶτος
  choice: Yule wa kwanza
  alternative: Malaika wa kwanza
  rationale: Muktadha unaonyesha kuwa ni malaika wa kwanza, lakini maandishi ya mstari huu yana kivumishi kilichotumiwa kama nomino. “Yule wa kwanza” huhifadhi namna hiyo ya usemi bila kuongeza nomino kutoka muktadhani.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi wa “aka-” na lugha ya heshima inayoeleweka kwa wasomaji wa kawaida. “Yule mnyama” na “sanamu yake” zimetumiwa kwa uthabiti kama istilahi za kimuktadha katika Ufunuo.
