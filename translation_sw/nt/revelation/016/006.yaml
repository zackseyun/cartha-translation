base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/006.yaml
  text: because they poured out the blood of saints and prophets[a], and you have given them blood to drink[b]; they are worthy.
translation:
  language: sw
  text: kwa sababu walimwaga damu ya watakatifu na manabii[a], nawe umewapa damu wanywe; wanastahili.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walimwaga damu ya watakatifu na manabii.” Kitenzi cha Kigiriki humaanisha hasa “kumwaga,” na pia kina mwangwi wa mabakuli ya hukumu yanayomwagwa katika muktadha unaozunguka.
    reason: lexical_alternative
  - marker: b
    text: Yaani, wanastahili hukumu hiyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: kwa sababu
  rationale: Huonyesha sababu ya tamko la malaika katika mstari uliotangulia na ni Kiswahili cha kawaida chenye maana wazi ya kisababishi.
- source_word: αἷμα
  choice: damu
  rationale: Imetafsiriwa moja kwa moja katika sehemu zote mbili ili kuhifadhi urudiaji unaosisitiza hukumu ya kulipiza kwa kipimo kinacholingana.
- source_word: ἁγίων
  choice: watakatifu
  rationale: Katika Ufunuo neno hili kwa kawaida linamaanisha watu wa Mungu waliowekwa wakfu kwake, si kundi maalumu la watu waliotangazwa watakatifu baadaye.
- source_word: προφητῶν
  choice: manabii
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya wale waliotoa ujumbe wa Mungu.
- source_word: ἐξέχεαν
  choice: waliimwaga
  rationale: Huhifadhi picha halisi ya ‘kumwaga’ na mwangwi wake wa hukumu za mabakuli yanayomwagwa katika muktadha, huku damu ikiwa yambwa wazi.
- source_word: αὐτοῖς
  choice: wao katika umewapa
  rationale: Kiambishi -wa- huonyesha walengwa wale wale waliomwaga damu.
- source_word: δέδωκας
  choice: umewapa
  rationale: Wakati timilifu wa Kiswahili unaonyesha tendo lililokamilika lenye matokeo yanayoendelea, sawasawa na hali timilifu ya Kigiriki.
- source_word: πιεῖν
  choice: wanywe
  rationale: Muundo wa utegemezi baada ya ‘umewapa damu’ ni wa asili katika Kiswahili na huhifadhi maana ya kunywa.
- source_word: ἄξιοί εἰσιν
  choice: wanastahili hayo
  rationale: ‘Wanastahili’ huhifadhi tamko la tathmini; ‘hayo’ linaweka wazi kwa njia ya kawaida ya Kiswahili jambo linalodokezwa na muktadha bila kuligeuza kuwa sifa ya wema.
theological_decisions:
- issue: Lugha ya hukumu inayolipiza
  choice: Kudumisha kauli ya moja kwa moja kwamba wamepewa damu wanywe na wanastahili hayo.
  alternative: Umewalipa kwa kuwapa damu wanywe; wanapata walichostahili.
  rationale: Kigiriki kinaonyesha hukumu kali na inayolingana na tendo lao. Tafsiri haipunguzi ukali huo wala kuongeza kitenzi cha ‘kulipa’ ambacho hakipo wazi katika matini.
- issue: Maana ya ‘watakatifu’
  choice: Kutumia ‘watakatifu’ kwa maana pana ya kibiblia ya watu wa Mungu.
  alternative: Watu watakatifu
  rationale: Neno la kawaida la kibiblia linahifadhi dhana ya watu waliowekwa wakfu kwa Mungu bila kuingiza mfumo wa baadaye wa kuwatangaza watu fulani kuwa watakatifu.
- issue: Maana ya ‘wanastahili’
  choice: Kueleza katika tanbihi kuwa wanastahili hukumu hii, si kwamba wana sifa njema.
  alternative: Wanastahili adhabu hiyo.
  rationale: Matini ya Kigiriki haikutaji moja kwa moja yambwa la kustahili. Matini kuu inahifadhi ufupi wa tamko, na tanbihi inazuia maana potovu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka. ‘Waliimwaga damu’ ni ya asili na huhifadhi taswira ya Kigiriki; ‘umewapa damu wanywe’ ni muundo mfupi na wenye uzito wa hukumu. Alama zote za tanbihi zimewekwa katika matini kuu.
