  verdict: revise
  source_fidelity: Tafsiri inawakilisha kwa usahihi βλασφημέω, cheo τὸν θεὸν τοῦ οὐρανοῦ, na nguvu ya kisababishi ya ἐκ katika maumivu na vidonda. Hata hivyo, kiunganishi “lakini” huongeza upinzani ambao kiuhalisia unaonekana katika muktadha lakini haujaelezwa na καί; “wala” hufuata kiunganishi cha Kigiriki kwa karibu zaidi huku ikilingana na kauli hasi inayofuata. Uwekaji wa alama za tanbihi pia lazima urekebishwe, kwa kuwa tanbihi ya kukufuru inapaswa kuambatanishwa na kitenzi husika.
  naturalness: Kiswahili ni sanifu, cha asili, na kina hadhi inayofaa Ufunuo. “Hawakutubu na kuacha matendo yao” ni usemi unaoeleweka unaoonyesha maana ya kutubu kutoka katika matendo; umehifadhiwa kwa sababu ni wa kawaida zaidi kuliko tafsiri ya neno kwa neno “kutoka katika matendo yao.”
  terminology: “Wakamkufuru,” “Mungu wa mbinguni,” “maumivu,” “vidonda,” “kutubu,” na “matendo” ni istilahi zinazofaa. Tanbihi ya “majipu” si mbadala sahihi wa karibu wa ἕλκη, ambalo hasa ni vidonda/vilonda au ulcers; imebadilishwa kuwa “vilonda.”
  issues:
