    rationale: Tanbihi a hutoa mbadala wa ἐβλασφήμησαν; lazima imtie nanga msomaji kwenye neno hilo, si baada ya “vidonda.”
  - severity: low
    issue: “Lakini” hutafsiri καί kwa upinzani wa wazi zaidi.
    rationale: Muktadha una tofauti ya maana, lakini Kigiriki hutumia καί. “Wala” hudumisha muundo wa kuunganisha katika kauli hasi bila kuongeza kiunganishi cha upinzani.
  - severity: low
    issue: Tanbihi b hutaja “majipu.”
    rationale: Ἕλκη ni sores/ulcers, si hasa majipu (boils). “Vilonda” ni mbadala wa Kiswahili unaokaribia zaidi maana ya chanzo.
