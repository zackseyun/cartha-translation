  text: καὶ ἐβλασφήμησαν τὸν θεὸν τοῦ οὐρανοῦ ἐκ τῶν πόνων αὐτῶν καὶ ἐκ τῶν ἑλκῶν αὐτῶν, καὶ οὐ μετενόησαν ἐκ τῶν ἔργων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/011.yaml
  text: And they blasphemed the God of heaven because of their pains and their sores[c][b][a], and they did not repent of their deeds.
translation:
  language: sw
  text: Nao wakamkufuru[a] Mungu wa mbinguni kwa sababu ya maumivu yao na vidonda vyao,[b] wala hawakutubu na kuacha matendo yao.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakamtukana” au “wakasema mabaya juu ya” Mungu wa mbinguni.
    reason: lexical_alternative
  - marker: b
    text: Au “kwa sababu ya vilonda vyao.”
    reason: lexical_alternative
  - marker: c
    text: 'Kwa tafsiri ya karibu zaidi na maneno ya Kigiriki: “hawakutubu kutoka katika matendo yao.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβλασφήμησαν
  choice: wakamkufuru
  rationale: Kitenzi “kukufuru” kinahifadhi maana ya kusema kwa dharau au kwa kumvunjia Mungu heshima, huku kikieleweka katika Kiswahili cha kawaida cha kidini.
- source_word: τὸν θεὸν τοῦ οὐρανοῦ
  choice: Mungu wa mbinguni
  rationale: Hili ni jina la heshima linalofuata kwa karibu muundo wa Kigiriki na kudumisha sauti nzito ya kinabii.
- source_word: ἐκ τῶν πόνων αὐτῶν
  choice: kwa sababu ya maumivu yao
  rationale: Katika muktadha huu ἐκ ina nguvu ya kisababishi; πόνοι ni maumivu makali, si kazi au taabu ya kufanya kazi.
- source_word: ἑλκῶν
  choice: vidonda
  rationale: “Vidonda” ni neno la kawaida na pana linalofaa kwa ἕλκος bila kuingiza maelezo ya kitabibu yasiyothibitishwa.
- source_word: μετενόησαν
  choice: hawakutubu
  rationale: Katika Ufunuo kitenzi hiki kina maana ya kimaadili na kidini ya kutubu, si kubadili maoni tu.
- source_word: ἐκ τῶν ἔργων αὐτῶν
  choice: na kuacha matendo yao
  rationale: ἐκ baada ya μετανοέω huonyesha kugeuka kutoka katika matendo; “kutubu na kuacha” huwasilisha uhusiano huo kwa Kiswahili cha asili, huku tanbihi ikihifadhi umbo la karibu zaidi na Kigiriki.
theological_decisions:
- issue: Nguvu ya kisababishi na ya kujitenga katika virai vya ἐκ
  choice: Walimkufuru Mungu kwa sababu ya maumivu na vidonda vyao, lakini hawakutubu na kuacha matendo yao.
  alternative: Walimkufuru Mungu kutokana na maumivu na vidonda vyao, wala hawakutubu kutoka katika matendo yao.
  rationale: Katika virai viwili vya kwanza ἐκ inaeleweka kiasili kuwa ya kisababishi; katika kirai cha mwisho inaonyesha kugeuka na kuyaacha matendo. Tafsiri inadumisha tofauti hiyo bila kuongeza hitimisho la kimadhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi na inayoeleweka kwa wasomaji wa kawaida. “Nao” na “lakini” zinaendeleza mtiririko na kuonyesha tofauti kati ya kukufuru na kutotubu.
