id: REV.16.4
reference: Revelation 16:4
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ ὁ τρίτος ἐξέχεεν τὴν φιάλην αὐτοῦ εἰς τοὺς ποταμοὺς ⸀καὶ τὰς πηγὰς τῶν ὑδάτων· καὶ ἐγένετο αἷμα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/004.yaml
  text: And the third poured out his bowl into the rivers and the springs of water[a], and it became blood.
translation:
  language: sw
  text: Na wa tatu akamimina bakuli lake ndani ya mito na chemchemi za maji, nayo yakawa damu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ τρίτος
  choice: wa tatu
  rationale: Kigiriki kina kivumishi cha mpangilio chenye kibainishi bila kutaja nomino; muktadha unaonyesha mhusika wa tatu. Kiswahili kinaweza kuhifadhi udondoshaji huo kwa usemi wa kawaida ‘wa tatu’ bila kuongeza ‘malaika’.
- source_word: ἐξέχεεν
  choice: akamimina
  rationale: Kitenzi hiki humaanisha kumimina kimiminika kutoka chomboni; ‘akamimina’ ni cha kawaida na kinafaa kwa tendo linalofanywa kwa bakuli.
- source_word: φιάλην
  choice: bakuli
  rationale: Neno hili hutaja chombo kipana na kifupi; ‘bakuli’ ni sawia ya kisasa kuliko maneno yanayodokeza chupa ndogo.
- source_word: εἰς τοὺς ποταμούς
  choice: ndani ya mito
  rationale: εἰς pamoja na hali ya accusative huonyesha mwendo kuelekea ndani; ‘ndani ya mito’ huhifadhi maana hiyo kwa Kiswahili cha kawaida.
- source_word: πηγὰς τῶν ὑδάτων
  choice: chemchemi za maji
  rationale: πηγή ni chemchemi au chanzo cha maji. ‘Chemchemi za maji’ ni usemi wa kawaida unaohifadhi muundo wa Kigiriki.
- source_word: ἐγένετο αἷμα
  choice: nayo yakawa damu
  rationale: Kigiriki kina kitenzi cha umoja na kiarifu ‘damu,’ kikitoa muhtasari wa matokeo kwa maji yaliyotajwa. Kiswahili kinahitaji upatanisho wa wazi; ‘yakawa’ linarejelea kwa kawaida maji ya mito na chemchemi na kuhifadhi maana ya kubadilika kuwa damu.
theological_decisions:
- issue: Kiima kilichodokezwa cha ἐγένετο
  choice: Maji ya mito na chemchemi yakawa damu
  alternative: Kitu hicho kikawa damu / ikawa damu
  rationale: Muktadha wa karibu ni mito na chemchemi za maji, ilhali Kigiriki hutumia kitenzi cha umoja kujumlisha maji hayo. Kiswahili cha kawaida hutumia ngeli ya maji, ‘yakawa,’ hivyo huonyesha rejeo bila kuongeza fundisho au kuficha badiliko linaloelezwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imehifadhi udondoshaji wa ‘malaika’ uliopo katika Kigiriki na haijaongeza maelezo yasiyotajwa. Hakuna tanbihi inayohitajika kwa kuwa upatanisho wa ‘maji … yakawa’ ni wa kawaida na wazi katika Kiswahili.
