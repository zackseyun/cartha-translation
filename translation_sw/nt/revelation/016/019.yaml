  to: Mji ule mkubwa ukagawanyika katika sehemu tatu, nayo miji ya mataifa ikaanguka. Babeli Mkuu akakumbukwa mbele ya Mungu[a], ili Mungu ampe kikombe cha divai ya ukali wa ghadhabu yake.
