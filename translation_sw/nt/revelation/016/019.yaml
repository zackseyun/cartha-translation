  - severity: low
    issue: Cheo «Babeli ule mkubwa»
    rationale: «Ule» halipatani kwa kawaida na jina Babeli katika cheo hiki. «Babeli Mkuu» ni uundaji wa Kiswahili wa asili unaohifadhi cheo cha Βαβυλὼν ἡ μεγάλη.
  - severity: low
    issue: Mtendaji wa «ili ampe» hajawekwa wazi
    rationale: Ingawa anaweza kudokezwa na muktadha, «ili Mungu ampe» huwasilisha kwa uwazi Mungu kama mtendaji wa δοῦναι bila kubadili maana.
