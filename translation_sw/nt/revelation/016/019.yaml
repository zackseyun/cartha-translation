id: REV.16.19
reference: Revelation 16:19
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἡ πόλις ἡ μεγάλη εἰς τρία μέρη, καὶ αἱ πόλεις τῶν ἐθνῶν ἔπεσαν· καὶ Βαβυλὼν ἡ μεγάλη ἐμνήσθη ἐνώπιον τοῦ θεοῦ δοῦναι αὐτῇ τὸ ποτήριον τοῦ οἴνου τοῦ θυμοῦ τῆς ὀργῆς αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/019.yaml
  text: And the great city was split into three parts[a], and the cities of the nations fell. And Babylon the great was remembered before God, to give her the cup of the wine of the fury of his wrath.
translation:
  language: sw
  text: Mji ule mkubwa ukagawanyika katika sehemu tatu, nayo miji ya mataifa ikaanguka. Babeli Mkuu akakumbukwa mbele ya Mungu[a], ili Mungu ampe kikombe cha divai ya ukali wa ghadhabu yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya neno kwa neno zaidi, “akaja kukumbukwa mbele ya Mungu.” Huu ni msemo wa kibiblia unaomaanisha kuingia chini ya uangalizi wa Mungu kwa ajili ya hukumu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ... εἰς τρία μέρη
  choice: ukagawanyika katika sehemu tatu
  rationale: 'Muundo huu unaonyesha hali iliyotokea: mji ukawa katika sehemu tatu. ‘Ukagawanyika’ huwasilisha matokeo hayo kwa Kiswahili cha kawaida bila kupoteza picha ya mgawanyiko.'
- source_word: ἡ πόλις ἡ μεγάλη
  choice: Mji ule mkubwa
  rationale: ‘Mji’ huhifadhi taswira ya kiapokaliptiki, na ‘ule mkubwa’ ni mpangilio wa kawaida wa Kiswahili unaoendeleza rejeleo maalumu la mji unaozungumziwa.
- source_word: αἱ πόλεις τῶν ἐθνῶν
  choice: miji ya mataifa
  rationale: ‘Mataifa’ linafaa katika muktadha wa hukumu ya ulimwengu mzima na halibanwi na maana ya kidini ya ‘watu wa Mataifa.’
- source_word: ἔπεσαν
  choice: ikaanguka
  rationale: Tafsiri hii huhifadhi usemi mfupi na wenye nguvu wa kiapokaliptiki; haiongezi ufafanuzi kwamba miji ilibomoka kabisa.
- source_word: Βαβυλὼν ἡ μεγάλη
  choice: Babeli ule mkubwa
  rationale: Huhifadhi jina na cheo kinachorudiwa katika Ufunuo, huku upatanisho wa ‘ule’ ukifuata maana ya Babeli kama mji.
- source_word: ἐμνήσθη ἐνώπιον τοῦ θεοῦ
  choice: ukakumbukwa mbele za Mungu
  rationale: Huhifadhi nahau ya kibiblia badala ya kuifafanua moja kwa moja kuwa Mungu aliukumbuka kwa ajili ya hukumu; muktadha unaonyesha kusudi la kukumbukwa huko.
- source_word: δοῦναι αὐτῇ
  choice: ili ampe
  rationale: ‘Ili’ huonyesha kusudi la kitenzi-jina, ‘ampe’ ikimhifadhi Mungu kama mtendaji anayeeleweka na Babeli iliyohusishwa kama mwanamke kuwa mpokeaji.
- source_word: τὸ ποτήριον τοῦ οἴνου
  choice: kikombe cha divai
  rationale: Huhifadhi mfano wa kibiblia wa kikombe kama fungu lililotolewa, pamoja na taswira ya divai.
- source_word: τοῦ θυμοῦ τῆς ὀργῆς αὐτοῦ
  choice: ya ukali wa ghadhabu yake
  rationale: ‘Ukali’ huwasilisha nguvu ya θυμός, huku ‘ghadhabu’ ikiwakilisha ὀργή katika muktadha wa hukumu. Muundo huu ni wa asili zaidi kwa Kiswahili kuliko kurudia visawe vya hasira kwa namna nzito.
theological_decisions:
- issue: Nahau ya hukumu ἐμνήσθη ἐνώπιον τοῦ θεοῦ
  choice: ukakumbukwa mbele za Mungu
  alternative: Mungu akaukumbuka ili auhukumu
  rationale: 'Tafsiri iliyochaguliwa huhifadhi nahau na mvutano wake: haisemi kana kwamba Mungu alikuwa amesahau, wala haiongezi neno ‘hukumu’ ndani ya matini, ingawa muktadha unaonyesha wazi kuwa kukumbukwa huko kunaleta hukumu.'
- issue: Uhusiano wa θυμός na ὀργή
  choice: ukali wa ghadhabu yake
  alternative: ghadhabu ya hasira yake
  rationale: 'Maneno yote mawili hayafupishwi kuwa neno moja: ‘ukali’ huonyesha nguvu au mlipuko, na ‘ghadhabu’ huonyesha hasira ya hukumu. Hivyo msisitizo wa Kigiriki unabaki bila kutokeza Kiswahili kisicho cha kawaida.'
- issue: Babeli kuhusishwa kama mwanamke katika αὐτῇ
  choice: ili ampe
  alternative: ili aipe
  rationale: ‘Ampe’ huhifadhi uhusishaji wa Babeli kama mwanamke unaoonekana katika muktadha mpana wa Ufunuo, badala ya kuifanya kuwa mahali pasipo nafsi tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Viunganishi ‘nayo’ na ‘ili’ vinadumisha mtiririko wa masimulizi na uhusiano wa kusudi. Alama ya tanbihi imewekwa baada ya nahau inayofafanuliwa.
