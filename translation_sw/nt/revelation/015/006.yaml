source:
  edition: SBLGNT
  text: καὶ ἐξῆλθον οἱ ἑπτὰ ἄγγελοι οἱ ἔχοντες τὰς ἑπτὰ πληγὰς ἐκ τοῦ ναοῦ, ⸀ἐνδεδυμένοι ⸀λίνον καθαρὸν λαμπρὸν καὶ περιεζωσμένοι περὶ τὰ στήθη ζώνας χρυσᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/006.yaml
  text: And the seven angels who had the seven plagues came out from the sanctuary[a], clothed in clean, bright linen[c][b], and wrapped around the chest with golden sashes.
translation:
  language: sw
  text: Na wale malaika saba waliokuwa na yale mapigo saba wakatoka katika patakatifu[a], wakiwa wamevaa mavazi ya kitani safi yenye kung’aa[b], na wamefungwa mikanda ya dhahabu kuzunguka vifua vyao[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hekalu.” Neno la Kigiriki ναός mara nyingi humaanisha patakatifu pa ndani badala ya eneo lote la hekalu.
    reason: lexical_alternative
  - marker: b
    text: Au, “mavazi ya kitani yaliyo safi na yenye kung’aa.”
    reason: lexical_alternative
  - marker: c
    text: Au, “wakiwa wamefungwa mikanda ya dhahabu kifuani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθον
  choice: wakatoka
  rationale: Kitenzi hiki kinaonyesha mwendo kutoka ndani kwenda nje; “wakatoka” ni Kiswahili cha kawaida kinachohifadhi mwelekeo huo.
- source_word: ἄγγελοι
  choice: malaika
  rationale: Katika maono haya ya mbinguni, neno hili linawarejelea wazi viumbe wa mbinguni, si wajumbe wa kibinadamu.
- source_word: πληγάς
  choice: mapigo
  rationale: Neno hili humaanisha mapigo au maafa yanayoletwa kama hukumu. “Mapigo” huhifadhi picha ya msingi ya kupiga bila kuifanya iwe ugonjwa pekee.
- source_word: ναοῦ
  choice: patakatifu
  rationale: ναός huelekea kumaanisha sehemu takatifu ya ndani, si eneo lote la hekalu. “Patakatifu” huhifadhi maana hiyo mahsusi.
- source_word: ἐνδεδυμένοι
  choice: wakiwa wamevaa
  rationale: Kauli hii inaeleza hali ya malaika kuwa wamevikwa; “wakiwa wamevaa” ni ya asili na yenye hadhi katika Kiswahili.
- source_word: λίνον
  choice: mavazi ya kitani
  rationale: λίνον ni kitani. Kuongeza “mavazi ya” hufanya sentensi iwe wazi katika Kiswahili bila kuongeza sifa ya “laini” ambayo haipo wazi katika matini.
- source_word: καθαρὸν λαμπρὸν
  choice: safi, yenye kung’aa
  rationale: Maneno haya mawili yanaonyesha usafi na mwangaza wa kitani; tafsiri hii inahifadhi sifa zote mbili kwa lugha ya kawaida.
- source_word: περιεζωσμένοι περὶ τὰ στήθη
  choice: wamejifunga ... kuzunguka vifua vyao
  rationale: Kauli hii inaonyesha kujifunga au kufungwa kuzunguka sehemu ya kifua; tafsiri hii huhifadhi mahali na picha ya kitendo.
- source_word: ζώνας χρυσᾶς
  choice: mikanda ya dhahabu
  rationale: ζώνη inaweza kuwa mkanda au utepe wa kujifunga. “Mikanda” ni wazi na inafafanuliwa na mahali pake, yaani kuzunguka vifua.
theological_decisions:
- issue: Maana ya ναός katika mazingira ya hekalu la mbinguni
  choice: patakatifu
  alternative: hekalu
  rationale: “Patakatifu” huhifadhi maana mahsusi ya sehemu takatifu ya ndani ambayo ναός inaweza kuonyesha, huku tanbihi ikidumisha uwezekano wa tafsiri pana zaidi ya “hekalu.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi unabaki karibu na mfuatano wa Kigiriki, lakini umetumiwa kwa namna ya asili katika Kiswahili. “Mapigo” yamechaguliwa badala ya “tauni” ili kutopunguza maana kuwa magonjwa pekee.
