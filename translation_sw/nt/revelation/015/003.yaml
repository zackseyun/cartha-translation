    reason: textual_variant
  revision_rationale: The sole revision replaces “wa milele” with “wa zama” in the text and corresponding footnote. This more closely renders αἰώνων (‘ages’) and maintains the contrast with the variant ‘nations.’ All other wording is faithful and natural.
