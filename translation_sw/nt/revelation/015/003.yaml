id: REV.15.3
reference: Revelation 15:3
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ᾄδουσιν τὴν ᾠδὴν Μωϋσέως τοῦ δούλου τοῦ θεοῦ καὶ τὴν ᾠδὴν τοῦ ἀρνίου λέγοντες· Μεγάλα καὶ θαυμαστὰ τὰ ἔργα σου, κύριε, ὁ θεός, ὁ παντοκράτωρ· δίκαιαι καὶ ἀληθιναὶ αἱ ὁδοί σου, ὁ βασιλεὺς τῶν ⸀αἰώνων·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/003.yaml
  text: 'And they sing the song of Moses[a], the servant of God, and the song of the Lamb, saying: “Great and marvelous are your works, Lord God, the Almighty; righteous and true are your ways, O King of the ages.”'
translation:
  language: sw
  text: 'Nao wanaimba wimbo wa Musa, mtumwa wa Mungu, na wimbo wa Mwanakondoo, wakisema: “Matendo yako ni makuu na ya ajabu, Ee Bwana Mungu, Mwenyezi; njia zako ni za haki na za kweli, Ee Mfalme wa zama.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati zina “Ee Mfalme wa mataifa” badala ya “Ee Mfalme wa zama.”
    reason: textual_variant
lexical_decisions:
- source_word: ᾄδουσιν
  choice: wanaimba
  rationale: Wakati wa sasa wa kitenzi unafaa kutafsiriwa moja kwa moja kama tendo linaloonekana katika maono.
- source_word: ᾠδὴν
  choice: wimbo
  rationale: Hili ndilo neno la kawaida na la asili kwa wimbo, bila kuongeza dhana maalumu ya kiliturujia.
- source_word: Μωϋσέως
  choice: Musa
  rationale: Jina hili limetolewa kwa umbo lake la kawaida katika Kiswahili cha Biblia.
- source_word: δούλου
  choice: mtumwa
  rationale: Neno hili linadumisha maana ya kuwa mali ya Mungu na chini ya mamlaka yake, badala ya kulainishwa kuwa ‘mtumishi’; katika cheo hiki halimaanishi kudhalilishwa kwa Musa.
- source_word: ἀρνίου
  choice: Mwanakondoo
  rationale: Katika Ufunuo hili ni jina la kimasiha la Kristo na linahifadhi taswira ya dhabihu.
- source_word: λέγοντες
  choice: wakisema
  rationale: Hutambulisha kwa njia ya kawaida maneno yanayoimbwa.
- source_word: Μεγάλα καὶ θαυμαστὰ τὰ ἔργα σου
  choice: Matendo yako ni makuu na ya ajabu
  rationale: Muundo huu ni wa asili katika Kiswahili na unahifadhi sifa zote mbili za matendo ya Mungu.
- source_word: κύριε, ὁ θεός, ὁ παντοκράτωρ
  choice: Ee Bwana Mungu, Mwenyezi
  rationale: Unahifadhi vipengele vyote vitatu vya jina na cheo cha Mungu kwa mtindo wa heshima unaofaa wimbo.
- source_word: δίκαιαι καὶ ἀληθιναὶ αἱ ὁδοί σου
  choice: njia zako ni za haki na za kweli
  rationale: ‘Za haki’ huhifadhi maana ya kimaadili na ya hukumu, huku ‘za kweli’ ikitafsiri ἀληθιναί bila kupanua maana.
- source_word: ὁ βασιλεὺς τῶν αἰώνων
  choice: Ee Mfalme wa milele
  rationale: Hii ni tafsiri ya asili ya Kiswahili ya wazo la ‘Mfalme wa zama zote,’ huku ikihifadhi utawala usio na mwisho unaodokezwa na αἰώνων.
theological_decisions:
- issue: Tafsiri ya δοῦλος kama cheo cha Musa
  choice: mtumwa wa Mungu
  alternative: mtumishi wa Mungu
  rationale: ‘Mtumwa’ huhifadhi nguvu ya kuwa chini ya umiliki na mamlaka ya Mungu. ‘Mtumishi’ ni laini na ya kawaida zaidi, lakini inaweza kuficha sehemu hiyo ya maana.
- issue: Tofauti ya maandishi katika cheo cha mwisho cha Mungu
  choice: Mfalme wa milele
  alternative: Mfalme wa mataifa
  rationale: Maandishi ya SBLGNT yaliyotolewa yana αἰώνων, ‘zama/milele.’ Usomaji ἐθνῶν, ‘mataifa,’ ni tofauti muhimu ya hati na umeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya wimbo wa sifa lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Nao’ huunganisha mstari na simulizi lililotangulia; ‘Ee’ huonyesha mwito wa moja kwa moja. Alama ya tanbihi imewekwa baada ya kirai kinachohusika.
