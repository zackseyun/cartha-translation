  to: 'Nao wanaimba wimbo wa Musa, mtumwa wa Mungu, na wimbo wa Mwanakondoo, wakisema: “Matendo yako ni makuu na ya ajabu, Ee Bwana Mungu, Mwenyezi; njia zako ni za haki na za kweli, Ee Mfalme wa zama.[a]”'
