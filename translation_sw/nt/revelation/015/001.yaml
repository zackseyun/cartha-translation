id: REV.15.1
reference: Revelation 15:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ εἶδον ἄλλο σημεῖον ἐν τῷ οὐρανῷ μέγα καὶ θαυμαστόν, ἀγγέλους ἑπτὰ ἔχοντας πληγὰς ἑπτὰ τὰς ἐσχάτας, ὅτι ἐν αὐταῖς ἐτελέσθη ὁ θυμὸς τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/001.yaml
  text: 'And I saw another sign in heaven[a], great and marvelous: seven angels having seven last plagues[b], because in them the wrath of God was finished.'
translation:
  language: sw
  text: 'Nami nikaona ishara nyingine mbinguni, kubwa na ya kustaajabisha: malaika saba waliokuwa na mapigo saba ya mwisho, kwa sababu katika hayo ghadhabu ya Mungu ilikamilishwa.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ilifikia mwisho.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σημεῖον
  choice: ishara
  rationale: “Ishara” ni neno la kawaida na wazi kwa tukio linaloonekana lenye maana ya kiishara katika Ufunuo.
- source_word: ἐν τῷ οὐρανῷ
  choice: mbinguni
  rationale: Katika muktadha huu wa kinabii, neno hilo linaelekea kumaanisha makao ya mbinguni, si anga tu.
- source_word: μέγα καὶ θαυμαστόν
  choice: kubwa na ya kustaajabisha
  rationale: Maneno haya yanahifadhi ukubwa wa ishara na mshangao unaosababishwa nayo kwa Kiswahili cha sasa na chenye hadhi.
- source_word: ἀγγέλους ἑπτὰ ἔχοντας
  choice: malaika saba waliokuwa na
  rationale: Muundo huu unaonyesha wazi kwamba malaika ndio waliokuwa na mapigo, huku ukibaki wa asili katika Kiswahili.
- source_word: πληγὰς ἑπτὰ τὰς ἐσχάτας
  choice: mapigo saba ya mwisho
  rationale: “Mapigo” ni istilahi ya kibiblia inayoeleweka kwa hukumu zinazoletwa na Mungu; “ya mwisho” huhifadhi wazo la mpangilio na ukomo.
- source_word: ὅτι ἐν αὐταῖς
  choice: kwa sababu katika hayo
  rationale: Huhifadhi uhusiano wa sababu na pia taswira ya ghadhabu kufikia ukamilifu ndani ya mapigo hayo.
- source_word: ἐτελέσθη
  choice: ilikamilishwa
  rationale: Kitenzi hiki cha kutendwa kinaonyesha kwamba ghadhabu ilifikishwa kwenye ukamilifu wake, bila kueleza zaidi ya mstari wenyewe.
- source_word: ὁ θυμὸς τοῦ θεοῦ
  choice: ghadhabu ya Mungu
  rationale: “Ghadhabu” huhifadhi uzito wa hasira kali ya Mungu katika hukumu bila kuipunguza wala kuiongeza.
theological_decisions:
- issue: Lugha ya hukumu ya Mungu katika muktadha wa kiapokaliptiki
  choice: ghadhabu ya Mungu
  alternative: hasira ya Mungu
  rationale: “Ghadhabu” huhifadhi uzito na hadhi ya θυμός kama hukumu kali ya Mungu; “hasira” ni sahihi pia lakini inaweza kuwa nyepesi zaidi katika muktadha huu.
- issue: Maana ya ἐτελέσθη kuhusiana na ghadhabu ya Mungu
  choice: ilikamilishwa
  alternative: ilifikia mwisho
  rationale: “Ilikamilishwa” huhifadhi hali ya kutendwa na wazo la kufikishwa kwenye ukamilifu, bila kudai kwamba kila aina ya hukumu yote imekwisha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa maandiko ya kinabii. Muundo wa sentensi unahifadhi mfuatano na uzito wa Kigiriki bila kuwa mgumu kupita kiasi.
