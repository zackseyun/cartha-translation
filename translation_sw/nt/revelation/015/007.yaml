base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/007.yaml
  text: And one of the four living creatures gave to the seven angels seven golden bowls full of the wrath of God[b][a], who lives forever and ever.
translation:
  language: sw
  text: Na mmoja wa wale viumbe hai wanne akawapa wale malaika saba mabakuli saba ya dhahabu[a], yaliyojaa ghadhabu ya Mungu, anayeishi milele na milele[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “vibakuli” au “beseni”; neno la Kigiriki humaanisha chombo chenye umbo la bakuli.
    reason: lexical_alternative
  - marker: b
    text: Kwa neno kwa neno, “hata zama za zama.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἓν ἐκ τῶν τεσσάρων ζῴων
  choice: mmoja wa wale viumbe hai wanne
  rationale: Katika Ufunuo, ζῷον humaanisha viumbe walio hai katika mazingira ya kiti cha enzi; “viumbe hai” pia hutofautisha neno hili na θηρίον, yaani mnyama wa Ufunuo.
- source_word: ἔδωκεν τοῖς ἑπτὰ ἀγγέλοις
  choice: akawapa wale malaika saba
  rationale: Kitenzi δίδωμι kimetafsiriwa kwa maana yake ya kawaida, “kupa”; kiambishi cha ngeli ya watu katika “akawapa” kinaonyesha kwamba malaika saba ndio waliopokea.
- source_word: ἑπτὰ φιάλας χρυσᾶς
  choice: mabakuli saba ya dhahabu
  rationale: φιάλη ni chombo kipana na kifupi kama bakuli, wala si lazima chupa; “ya dhahabu” ni usemi wa kawaida na wazi unaoonyesha nyenzo iliyotumiwa.
- source_word: γεμούσας τοῦ θυμοῦ τοῦ θεοῦ
  choice: yaliyojaa ghadhabu ya Mungu
  rationale: γεμούσας huonyesha hali ya kujaa, na θυμός hapa ni hasira kali ya Mungu katika hukumu; “ghadhabu” inadumisha uzito huo kwa Kiswahili cha heshima.
- source_word: τοῦ ζῶντος εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: anayeishi milele na milele
  rationale: Kirai hiki kinamfafanua Mungu kuwa ndiye aishiye bila mwisho; “milele na milele” ni kisawe cha asili cha nahau ya Kigiriki huku kikidumisha msisitizo wake.
theological_decisions:
- issue: Istilahi ya ghadhabu ya Mungu
  choice: ghadhabu ya Mungu
  alternative: hasira ya Mungu; ukali wa Mungu
  rationale: “Ghadhabu” inaonyesha hasira kali inayohusiana na hukumu bila kuifanya kuwa hisia ya ghafla tu au kuongeza dai la kimadhehebu.
- issue: Uhai wa Mungu na umilele wake
  choice: Mungu, anayeishi milele na milele
  alternative: Mungu aliye hai hata milele na milele
  rationale: Muundo huu unaunganisha wazi τοῦ ζῶντος na Mungu na kuonyesha muda usio na mwisho, bila kuongeza maelezo yasiyokuwamo katika Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Kisha” kinaendeleza simulizi; “wale” huonyesha kundi lililotajwa tayari. Alama ya tanbihi [a] imewekwa mara tu baada ya kirai kinachohusika.
