id: REV.15.4
reference: Revelation 15:4
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: τίς οὐ μὴ ⸀φοβηθῇ, κύριε, καὶ ⸀δοξάσει τὸ ὄνομά σου, ὅτι μόνος ⸀ὅσιος; ὅτι πάντα τὰ ἔθνη ἥξουσιν καὶ προσκυνήσουσιν ἐνώπιόν σου, ὅτι τὰ δικαιώματά σου ἐφανερώθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/004.yaml
  text: Who will not fear[a], Lord, and glorify your name? For you alone are holy. For all the nations will come and worship before you, because your righteous acts have been revealed.
translation:
  language: sw
  text: Ni nani ambaye hatakuogopa, Ee Bwana, na kulitukuza jina lako? Kwa maana wewe peke yako ndiwe mtakatifu. Kwa maana mataifa yote yatakuja na kuabudu mbele zako, kwa sababu matendo yako ya haki[a] yamedhihirishwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hukumu zako za haki.” Neno la Kigiriki linaweza pia kumaanisha hukumu au maagizo, lakini hapa huenda linarejelea matendo ya Mungu ya haki ambayo sasa yamedhihirishwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς οὐ μὴ φοβηθῇ
  choice: Ni nani ambaye hatakuogopa
  rationale: Swali la balagha lenye οὐ μή linatarajia jibu ‘hakuna’; muundo huu wa Kiswahili unadumisha msisitizo huo na mwelekeo wa wakati ujao.
- source_word: κύριε
  choice: Ee Bwana
  rationale: Hii ni hali ya kuitana ya κύριος; ‘Ee Bwana’ ni namna ya kawaida, yenye heshima, ya kumwambia mhusika moja kwa moja.
- source_word: δοξάσει τὸ ὄνομά σου
  choice: kulitukuza jina lako
  rationale: ‘Kulitukuza jina lako’ huhifadhi nahau ya kibiblia ya kulipa jina la Mungu utukufu na heshima.
- source_word: μόνος ὅσιος
  choice: wewe peke yako ndiwe mtakatifu
  rationale: ὅσιος hapa humweleza Mungu kuwa mtakatifu na safi kimaadili; ‘peke yako’ huhifadhi upekee unaosisitizwa na μόνος.
- source_word: πάντα τὰ ἔθνη
  choice: mataifa yote
  rationale: Huhifadhi maana jumuishi ya makundi yote ya kitaifa na kikabila katika muktadha wa ibada ya siku zijazo.
- source_word: ἥξουσιν
  choice: yatakuja
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya tendo la kuja katika usemi wa kinabii.
- source_word: προσκυνήσουσιν ἐνώπιόν σου
  choice: kuabudu mbele zako
  rationale: προσκυνέω katika muktadha huu wa liturujia humaanisha ibada; ‘mbele zako’ huhifadhi ἐνώπιόν σου kwa Kiswahili cha kawaida cha kibiblia.
- source_word: τὰ δικαιώματά σου
  choice: matendo yako ya haki
  rationale: δικαιώματα inaweza kumaanisha matendo ya haki, hukumu, au maagizo. Muktadha unasisitiza udhihirisho wa haki ya Mungu, hivyo uchaguzi huu huhifadhi upana wake bila kuifungia kwenye maana ya kisheria pekee.
- source_word: ἐφανερώθησαν
  choice: yamedhihirishwa
  rationale: Kauli tendwa huhifadhiwa, na wakati timilifu unaonyesha tendo lililotimia ambalo matokeo yake yanaonekana sasa.
theological_decisions:
- issue: Maana ya ὅσιος katika sifa kwa Mungu
  choice: mtakatifu
  alternative: mwaminifu; mcha Mungu
  rationale: Katika muktadha wa ibada na sifa kwa Mungu, ‘mtakatifu’ huwasilisha kwa kawaida zaidi usafi wake wa kiadili na upekee wake bila kupunguza maana iwe uaminifu pekee.
- issue: Maana ya δικαιώματα katika muktadha wa hukumu za kiapokaliptiki
  choice: matendo ya haki
  alternative: hukumu za haki; maagizo
  rationale: ‘Matendo ya haki’ huhifadhi upana wa neno na kuonyesha haki ya Mungu iliyowekwa wazi, huku tanbihi ikidumisha uwezekano halisi wa maana ya hukumu au maamuzi ya haki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Marudio ya ‘Kwa maana’ yamehifadhiwa ili kuonyesha hoja tatu zinazotambulishwa na ὅτι. ‘Ee Bwana’ na ‘mbele zako’ hudumisha sauti ya moja kwa moja ya wimbo wa ibada.
