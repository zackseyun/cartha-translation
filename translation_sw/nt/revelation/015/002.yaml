id: REV.15.2
reference: Revelation 15:2
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ εἶδον ὡς θάλασσαν ὑαλίνην μεμιγμένην πυρί, καὶ τοὺς νικῶντας ἐκ τοῦ θηρίου καὶ ἐκ τῆς εἰκόνος αὐτοῦ καὶ ἐκ τοῦ ἀριθμοῦ τοῦ ὀνόματος αὐτοῦ ἑστῶτας ἐπὶ τὴν θάλασσαν τὴν ὑαλίνην, ἔχοντας κιθάρας τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/002.yaml
  text: And I saw what appeared to be a sea of glass mixed with fire[a], and those who were victorious over the beast and over its image and over the number of its name, standing on the sea of glass[b], holding harps of God.
translation:
  language: sw
  text: Kisha nikaona kitu kama bahari ya kioo iliyochanganyika na moto, na wale waliomshinda yule mnyama, sanamu yake, na ile namba ya jina lake,[a] wakiwa wamesimama juu ya ile bahari ya kioo, huku wameshika vinubi vya Mungu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wale waliokuwa wakimshinda mnyama, sanamu yake, na namba ya jina lake”; kwa maana halisi zaidi, “wale walioshinda kutoka kwa mnyama ...” Muundo wa Kigiriki unaweza kukazia ushindi dhidi ya mnyama au kutoka katika mamlaka yake.
    reason: alternative_reading
  - marker: b
    text: Yaani, vinubi ambavyo ni vya Mungu, vinavyotoka kwake, au vilivyowekwa wakfu kwake; muundo wa Kigiriki unaweza kuwa na maana yoyote kati ya hizo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: kitu kama
  rationale: Huonyesha ulinganisho wa ono badala ya kutambulisha kitu hicho moja kwa moja; ni usemi wa kawaida na wazi katika Kiswahili.
- source_word: θάλασσαν ὑαλίνην
  choice: bahari ya kioo
  rationale: Inahifadhi taswira ya ajabu ya maandishi na kurudiwa kwake baadaye katika aya.
- source_word: μεμιγμένην πυρί
  choice: iliyochanganyika na moto
  rationale: Inawakilisha hali inayoelezwa na participio timilifu bila kufasiri maana ya taswira hiyo.
- source_word: τοὺς νικῶντας
  choice: wale waliomshinda
  rationale: Kitenzi 'kushinda' ni cha kawaida na chenye nguvu, na katika muktadha huu huonyesha kuwa walipata ushindi dhidi ya mamlaka ya mnyama.
- source_word: ἐκ τοῦ θηρίου ... καὶ ἐκ τῆς εἰκόνος αὐτοῦ καὶ ἐκ τοῦ ἀριθμοῦ τοῦ ὀνόματος αὐτοῦ
  choice: yule mnyama, sanamu yake, na ile namba ya jina lake
  rationale: Baada ya 'waliomshinda,' viambajengo hivi vinaeleweka kwa kawaida kuwa vitu walivyovishinda. Tanbihi inadumisha uwezekano wa ἐκ kusisitiza kutoka au kuponyoka katika mamlaka yake.
- source_word: ἑστῶτας ἐπὶ τὴν θάλασσαν τὴν ὑαλίνην
  choice: wakiwa wamesimama juu ya ile bahari ya kioo
  rationale: '''Juu ya'' huhifadhi taswira ya kushangaza ya ἐπί pamoja na accusative badala ya kuilegeza kuwa ''kando ya.'''
- source_word: κιθάρας τοῦ θεοῦ
  choice: vinubi vya Mungu
  rationale: Muundo wa 'vya Mungu' unadumisha uwezekano wa umiliki, chanzo, au kuwekwa wakfu bila kuchagua maana moja.
theological_decisions:
- issue: Uhusiano wa washindi na mnyama unaoonyeshwa na νικῶντας pamoja na ἐκ inayorudiwa
  choice: Wanaonyeshwa kuwa wamemshinda mnyama, sanamu yake, na namba ya jina lake.
  alternative: Wametoka au wameponyoka katika mamlaka ya mnyama, sanamu yake, na namba ya jina lake.
  rationale: Katika Kiswahili, 'kumshinda' huleta kwa kawaida kile kilichoshindwa moja kwa moja. Hata hivyo, kwa kuwa ἐκ kwa msingi humaanisha 'kutoka,' tanbihi huhifadhi mvutano wa maana bila kuufuta.
- issue: Maana ya genitive katika κιθάρας τοῦ θεοῦ
  choice: vinubi vya Mungu
  alternative: vinubi vilivyotolewa na Mungu au vilivyowekwa wakfu kwake
  rationale: Tafsiri ya kimuundo haibani genitive hiyo kuwa umiliki pekee, hivyo inadumisha utata halisi wa maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. 'Mnyama,' 'sanamu,' 'namba,' na 'vinubi' ni maneno ya kawaida ya kibiblia yasiyoegemea dhehebu. Alama zote za tanbihi zimewekwa mara moja katika matini kuu karibu na vifungu vinavyohusika.
