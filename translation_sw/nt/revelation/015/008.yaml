id: REV.15.8
reference: Revelation 15:8
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἐγεμίσθη ὁ ναὸς καπνοῦ ἐκ τῆς δόξης τοῦ θεοῦ καὶ ἐκ τῆς δυνάμεως αὐτοῦ, καὶ οὐδεὶς ἐδύνατο εἰσελθεῖν εἰς τὸν ναὸν ἄχρι τελεσθῶσιν αἱ ἑπτὰ πληγαὶ τῶν ἑπτὰ ἀγγέλων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/008.yaml
  text: And the sanctuary was filled with smoke from the glory of God and from his power[a], and no one was able to enter the sanctuary until the seven plagues of the seven angels were finished.
translation:
  language: sw
  text: Hekalu[a] likajazwa moshi uliotokana na utukufu wa Mungu na nguvu zake, wala hakuna mtu aliyeweza kuingia hekaluni mpaka mapigo saba ya malaika saba yatimizwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mahali patakatifu”; neno la Kigiriki naos linaweza kurejelea hasa makao matakatifu ya ndani, si eneo lote la hekalu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ναὸς
  choice: hekalu
  rationale: Katika muktadha huu neno hili linamaanisha mahali patakatifu pa ndani, makao ya Mungu. Kiswahili cha kawaida hutumia “hekalu” kwa njia ya asili zaidi; maana mahususi inaelezwa katika tanbihi.
- source_word: ἐγεμίσθη
  choice: likajaa
  rationale: Huonyesha tendo la wakati uliopita la hekalu kujazwa; “likajaa” ni la asili katika simulizi la Kiswahili na huhifadhi mfuatano wa matukio.
- source_word: καπνοῦ
  choice: moshi
  rationale: Hii ndiyo maana ya kawaida na inayofaa kwa taswira ya kudhihirika kwa Mungu.
- source_word: ἐκ τῆς δόξης τοῦ θεοῦ καὶ ἐκ τῆς δυνάμεως αὐτοῦ
  choice: uliotoka katika utukufu wa Mungu na katika nguvu zake
  rationale: “Uliotoka” huweka wazi kuwa ἐκ inaonyesha chanzo cha moshi, huku urudiaji wa “katika” ukihifadhi muundo wa Kigiriki.
- source_word: οὐδεὶς ἐδύνατο εἰσελθεῖν
  choice: hakuna mtu aliyeweza kuingia
  rationale: Huhifadhi maana ya kutoweza kuingia kwa muda uliotajwa na ni Kiswahili wazi, chenye hadhi.
- source_word: ἄχρι τελεσθῶσιν
  choice: mpaka ... yalipokuwa yamekamilika
  rationale: Huonyesha kikomo cha wakati na hali ya mapigo yote saba kufikia ukamilisho.
- source_word: πληγαὶ
  choice: mapigo
  rationale: “Mapigo” ni neno la kibiblia na la kawaida kwa maafa au hukumu zinazoletwa; pia huhifadhi wigo mpana wa πληγή kuliko “tauni”.
- source_word: τῶν ἑπτὰ ἀγγέλων
  choice: ya wale malaika saba
  rationale: Huonyesha uhusiano wa mapigo hayo na malaika saba bila kufafanua zaidi ikiwa ni umiliki au uwakala.
theological_decisions:
- issue: Maana ya ναός katika mazingira ya ibada ya mbinguni
  choice: hekalu
  alternative: mahali patakatifu pa hekalu
  rationale: “Hekalu” ni tafsiri ya kawaida na ya asili katika Kiswahili, lakini ναός hapa huenda ikalenga hasa sehemu takatifu ya ndani, si eneo lote la hekalu; tanbihi huhifadhi utofauti huo bila kuongeza dai la kimadhehebu.
- issue: Uhusiano wa mapigo saba na malaika saba
  choice: mapigo saba ya wale malaika saba
  alternative: mapigo saba yaliyobebwa na wale malaika saba
  rationale: Muundo wa kumilikisha huhifadhi utata wa jenitivi ya Kigiriki badala ya kuamua kwamba malaika ndio waliobeba au kutekeleza mapigo hayo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wazi na wenye hadhi. Tanbihi ya [a] inapaswa kuhusishwa na kutokea kwa kwanza kwa “Hekalu” katika maandishi.
