id: REV.15.5
reference: Revelation 15:5
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ μετὰ ταῦτα εἶδον, καὶ ἠνοίγη ὁ ναὸς τῆς σκηνῆς τοῦ μαρτυρίου ἐν τῷ οὐρανῷ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/005.yaml
  text: And after these things I saw[a], and the temple of the tabernacle of the testimony in heaven was opened[b],
translation:
  language: sw
  text: Baada ya mambo hayo nikaona, na hekalu[a] la hema la ushuhuda[b] mbinguni likafunguliwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “patakatifu.” Neno la Kigiriki ναός linaweza kusisitiza sehemu takatifu ya ndani, si eneo lote la hekalu.
    reason: lexical_alternative
  - marker: b
    text: “Hema la ushuhuda” linaakisi lugha ya Agano la Kale kuhusu patakatifu, hasa hema la jangwani lililohusishwa na ushuhuda wa agano la Mungu.
    reason: cross_reference
lexical_decisions:
- source_word: Καὶ μετὰ ταῦτα
  choice: Baada ya mambo hayo
  rationale: Huhifadhi wingi wa ταῦτα na mpangilio wa simulizi la maono kwa Kiswahili cha kawaida; kiunganishi kinachofuata katika sentensi pia kinaendeleza mtindo wa kuunganisha vifungu.
- source_word: εἶδον
  choice: nikaona
  rationale: Kitenzi hiki kinaeleza kuona katika maono; umbo la -ka- linaonyesha hatua inayofuata katika simulizi bila kuibadili kuwa tendo la kutazama kwa makusudi.
- source_word: ἠνοίγη
  choice: likafunguliwa
  rationale: Huhifadhi hali ya kutendwa ya aoristi na kuonyesha kuwa hekalu lilifunguliwa, bila kutaja mtendaji ambaye Kigiriki hakumtaji.
- source_word: ναὸς
  choice: hekalu
  rationale: Ni neno linaloeleweka na linalotumiwa kwa kawaida, ingawa hapa ναός inaweza kusisitiza sehemu takatifu ya ndani; uwezekano huo umeonyeshwa katika tanbihi.
- source_word: τῆς σκηνῆς
  choice: la hema
  rationale: Katika muktadha wa ibada, σκηνή ni hema takatifu la jangwani. “Hema” ni neno la asili na la kawaida la Kiswahili linalodumisha mwangwi huo wa Agano la Kale.
- source_word: τοῦ μαρτυρίου
  choice: la ushuhuda
  rationale: “Ushuhuda” huhifadhi lugha ya kiibada inayohusishwa na ushuhuda wa Mungu na agano, badala ya kuifafanua zaidi ya maandishi.
- source_word: ἐν τῷ οὐρανῷ
  choice: mbinguni
  rationale: Ni usemi wa kawaida wa Kiswahili unaoweka hekalu katika ulimwengu wa mbinguni.
theological_decisions:
- issue: Taswira ya kiibada ya patakatifu pa mbinguni
  choice: hekalu la hema la ushuhuda mbinguni
  alternative: patakatifu pa mbinguni
  rationale: Mfuatano wa viambishi vya Kigiriki umehifadhiwa kadiri Kiswahili kinavyoruhusu ili kudumisha taswira ya hekalu, hema, na ushuhuda, bila kuirahisisha kuwa wazo moja la kifafanuzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo usio wa kawaida kidogo “hekalu la hema la ushuhuda” umehifadhiwa kwa makusudi ili kuonyesha msongamano wa taswira za kiibada katika Kigiriki.
