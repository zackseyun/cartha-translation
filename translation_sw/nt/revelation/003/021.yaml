  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὁ νικῶν δώσω αὐτῷ καθίσαι μετ’ ἐμοῦ ἐν τῷ θρόνῳ μου, ὡς κἀγὼ ἐνίκησα καὶ ἐκάθισα μετὰ τοῦ πατρός μου ἐν τῷ θρόνῳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/021.yaml
  text: The one who conquers—I will grant him to sit with me on my throne[b][a], just as I also conquered and sat down with my Father on his throne.
translation:
  language: sw
  text: Yule anayeshinda[a], nitampa[b] kuketi pamoja nami juu ya kiti changu cha enzi, kama vile mimi pia nilivyoshinda, nikaketi pamoja na Baba yangu juu ya kiti chake cha enzi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yule ashindaye.” Kitenzi cha Kigiriki νικάω kimetumiwa mara mbili katika mstari huu; “anayeshinda” limechaguliwa ili kuhifadhi urudiaji wa dhamira ya ushindi.
    reason: lexical_alternative
  - marker: b
    text: Katika Kigiriki, “yule anayeshinda” na kiwakilishi kinachorejelea mtu huyo viko katika umoja wa kiume kwa maana ya uwakilishi. Ahadi hii ni kwa kila mwamini anayeshinda; Kiswahili “yule” na “nitampa” havibainishi jinsia.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ νικῶν
  choice: Yule anayeshinda
  rationale: Kirai cha Kigiriki ni kitenzi-ushiriki cha wakati uliopo kilichotumiwa kama nomino katika umoja. “Anayeshinda” ni Kiswahili cha kawaida na kinahifadhi wazo la ushindi linalorudiwa katika mstari huu na katika Ufunuo.
- source_word: δώσω αὐτῷ καθίσαι
  choice: nitampa kuketi
  rationale: Muundo wa δίδωμι pamoja na kitenzi-jina una maana ya kumpa mtu ruhusa au fursa. “Nitampa kuketi” unahifadhi kwa ufupi muundo na maana hiyo bila kuongeza maelezo.
- source_word: μετ’ ἐμοῦ
  choice: pamoja nami
  rationale: Neno “pamoja” linaonyesha wazi ushirika unaoelezwa na μετά pamoja na hali ya umilikaji.
- source_word: ἐν τῷ θρόνῳ μου
  choice: juu ya kiti changu cha enzi
  rationale: Ingawa ἐν mara nyingi ni “katika,” Kiswahili cha kawaida husema mtu anaketi “juu ya” kiti. Tafsiri hii inahifadhi picha ya kuketi katika mamlaka ya kifalme.
- source_word: ὡς κἀγὼ
  choice: kama vile mimi pia
  rationale: “Kama vile” linaonyesha ulinganisho, na “pia” linawakilisha καί iliyounganishwa katika κἀγώ.
- source_word: ἐνίκησα
  choice: nilivyoshinda
  rationale: Mzizi uleule wa “kushinda” umetumiwa kama katika νικῶν ili kuhifadhi urudiaji wa makusudi na dhamira ya ushindi.
- source_word: ἐκάθισα μετὰ τοῦ πατρός μου
  choice: kuketi pamoja na Baba yangu
  rationale: Tafsiri hii inahifadhi tendo lililokamilika la kuketi na uhusiano wa ushirika na Baba, bila kuongeza ufafanuzi wa kiteolojia.
- source_word: ἐν τῷ θρόνῳ αὐτοῦ
  choice: juu ya kiti chake cha enzi
  rationale: Uteuzi huu unalingana na kirai cha awali na kutumia namna ya kawaida ya Kiswahili ya kusema mtu ameketi juu ya kiti.
theological_decisions:
- issue: Umoja wa kiume unaowakilisha wote katika ahadi kwa mshindi
  choice: 'Kutumia umoja usio na alama ya jinsia katika Kiswahili: “Yule anayeshinda” na “nitampa”'
  alternative: Kutaja “mwanamume anayeshinda” au kutumia wingi
  rationale: Kigiriki kina umoja wa kiume wenye maana ya uwakilishi. Kiswahili hakilazimishi jinsia katika viwakilishi hivi; umoja umehifadhiwa, huku tanbihi ikifafanua kwamba ahadi inamhusu kila mwamini anayeshinda.
- issue: Uhusiano kati ya mshindi na kiti cha enzi cha Kristo, na kati ya Kristo na kiti cha enzi cha Baba
  choice: Kuhifadhi ulinganifu moja kwa moja bila kuupunguza wala kuufafanua kupita maandishi
  alternative: Kueleza katika tafsiri kwamba kuketi ni kwa mfano tu, au kuongeza ufafanuzi wa tofauti za kiungu
  rationale: Mstari wenyewe unaweka ulinganifu wenye nguvu wa ushiriki katika ushindi na utawala. Tafsiri inapaswa kuacha nguvu na mvutano huo wa kiteolojia bila kuingiza maelezo ya kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imehifadhi umoja, ulinganifu wa sehemu mbili, na urudiaji wa mzizi “shinda.” “Kiti cha enzi” ni istilahi iliyoeleweka kwa urahisi na inayofaa rejista ya kifalme ya kifungu.
