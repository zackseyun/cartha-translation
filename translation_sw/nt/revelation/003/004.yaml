  text: ἀλλὰ ⸂ἔχεις ὀλίγα⸃ ὀνόματα ἐν Σάρδεσιν ἃ οὐκ ἐμόλυναν τὰ ἱμάτια αὐτῶν, καὶ περιπατήσουσιν μετ’ ἐμοῦ ἐν λευκοῖς, ὅτι ἄξιοί εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/004.yaml
  text: But you have a few names in Sardis who have not soiled their garments[a], and they will walk with me in white[c][b], because they are worthy.
translation:
  language: sw
  text: 'Lakini una majina machache[a] katika Sardi: watu ambao hawajayachafua mavazi yao[b]. Nao watatembea pamoja nami wakiwa wamevaa meupe[c], kwa sababu wanastahili.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, watu wachache. Kigiriki kinasema kihalisi “majina machache.”
    reason: lexical_alternative
  - marker: b
    text: Au, “hawajayanajisi mavazi yao.”
    reason: lexical_alternative
  - marker: c
    text: Kigiriki kinasema kwa ufupi “katika meupe,” yaelekea kikimaanisha mavazi meupe.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Lakini
  rationale: Inaonyesha utofauti mkubwa na karipio lililotangulia, kwa lugha ya kawaida na fupi.
- source_word: ἔχεις ὀλίγα ὀνόματα
  choice: una majina machache
  rationale: Inahifadhi usemi halisi na wa kushtua kidogo wa Kigiriki, ambapo “majina” yanawakilisha watu wanaotambulika mmoja mmoja.
- source_word: ἐν Σάρδεσιν
  choice: huko Sardi
  rationale: “Huko” huunganisha mahali kwa kawaida na mhusika anayeambiwa, huku Sardi likiwa jina la mji linalotumika katika Kiswahili cha Biblia.
- source_word: ἃ οὐκ ἐμόλυναν τὰ ἱμάτια αὐτῶν
  choice: ambayo hayajachafua mavazi yao
  rationale: Kiwakilishi “ambayo” kinakubaliana na “majina,” ingawa majina hayo yanawakilisha watu; “kuchafua mavazi” huhifadhi taswira ya madoa na uchafu wa kimaadili.
- source_word: περιπατήσουσιν μετ’ ἐμοῦ
  choice: watatembea pamoja nami
  rationale: Inahifadhi taswira halisi ya kutembea na wazo la ushirika pamoja na Kristo.
- source_word: ἐν λευκοῖς
  choice: wakiwa wamevaa meupe
  rationale: Kigiriki kinasema kwa ufupi “katika meupe”; Kiswahili huhitaji kidokezo cha kuvaa ili usemi uwe wa kawaida bila kutaja wazi nomino ambayo chanzo kimeiacha.
- source_word: ὅτι ἄξιοί εἰσιν
  choice: kwa sababu wanastahili
  rationale: Inatoa sababu iliyo katika maandishi na kuhifadhi dai la wazi la kustahili bila kulifafanua kwa mfumo fulani wa kiteolojia.
theological_decisions:
- issue: Iwapo ὀνόματα itafsiriwe kiidioma kuwa “watu” au kihalisi kuwa “majina”
  choice: majina machache
  alternative: watu wachache
  rationale: “Majina” huhifadhi sitiari ya chanzo na huenda yakasisitiza watu binafsi wanaojulikana ndani ya kanisa; tanbihi hufafanua maana yake.
- issue: Nguvu ya μολύνω katika taswira ya mavazi
  choice: hayajachafua mavazi yao
  alternative: hayajanajisi mavazi yao
  rationale: “Kuchafua” ni ya sasa, inaeleweka kwa urahisi, na huhifadhi taswira ya mavazi; “kunajisi” yenye mkazo zaidi wa kiibada au kimaadili imewekwa katika tanbihi.
- issue: Iwapo ἄξιοί εἰσιν ipunguzwe ili kuepuka maana ya kustahili kwa matendo
  choice: wanastahili
  alternative: wanafaa
  rationale: Tafsiri inapaswa kuhifadhi kauli ya mstari bila kuiongezea au kuipunguza kwa msimamo wa kidhehebu kuhusu wokovu na kustahili.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Usemi “majina machache” umeachwa kwa makusudi ili kuhifadhi upekee wa chanzo; tanbihi inaufafanua. Alama zote za tanbihi zimetumiwa katika matini kuu.
