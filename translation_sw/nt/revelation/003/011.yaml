base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/011.yaml
  text: I am coming soon[a]; hold fast what you have[b], so that no one may take your crown.
translation:
  language: sw
  text: Ninakuja hivi karibuni[a]. Shikilia sana ulichonacho, ili mtu asichukue taji yako[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa upesi.” Kielezi cha Kigiriki kinaweza kusisitiza ama ukaribu wa wakati ama kasi ya tendo.
    reason: alternative_reading
  - marker: b
    text: Neno la Kigiriki linamaanisha shada la mshindi au taji la heshima, si hasa taji la kifalme.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχομαι
  choice: Ninakuja
  rationale: Kauli ya wakati uliopo hapa ina maana ya kuja kunakotarajiwa; “Ninakuja” ni ya asili katika Kiswahili na inadumisha hisia ya kuwasili kunakokaribia.
- source_word: ταχύ
  choice: hivi karibuni
  rationale: Kielezi hiki kinaweza kumaanisha ukaribu wa wakati au kasi ya tendo. “Hivi karibuni” kinafaa katika muktadha huu wa ahadi na onyo, huku maana nyingine ikihifadhiwa katika tanbihi.
- source_word: κράτει
  choice: Shikilia sana
  rationale: Amri hii inataka mtu aendelee kushika kwa uthabiti. “Shikilia sana” ni Kiswahili cha kawaida chenye nguvu ya himizo.
- source_word: ὃ ἔχεις
  choice: ulicho nacho
  rationale: Tafsiri hii inaacha kitu kinachorejelewa bila kutajwa wazi, kama ilivyo katika Kigiriki, ili muktadha ukifafanue.
- source_word: ἵνα μηδεὶς λάβῃ
  choice: ili mtu yeyote asiichukue
  rationale: Muundo huu unaonyesha kusudi au matokeo yasiyotakiwa ambayo yanapaswa kuzuiwa.
- source_word: στέφανόν
  choice: taji
  rationale: “Taji” ni neno linaloeleweka kwa urahisi, lakini hapa στέφανος hasa ni shada la ushindi au taji la heshima, si lazima taji la kifalme; tofauti hiyo imeelezwa katika tanbihi.
theological_decisions:
- issue: Maana ya ταχύ katika ahadi ya kuja kwa Kristo
  choice: hivi karibuni
  alternative: kwa upesi
  rationale: Kigiriki kinaweza kusisitiza kwamba kuja huko ni karibu kwa wakati au kwamba kutatokea kwa kasi. Maandishi makuu yanatumia maana ya ukaribu wa wakati, huku tanbihi ikihifadhi uwezekano wa maana ya kasi bila kuondoa mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo ni mfupi na wa moja kwa moja kama chanzo; fumbo la “ulicho nacho” limehifadhiwa.
