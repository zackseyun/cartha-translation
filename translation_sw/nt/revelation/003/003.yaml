id: REV.3.3
reference: Revelation 3:3
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: μνημόνευε οὖν πῶς εἴληφας καὶ ἤκουσας καὶ τήρει, καὶ μετανόησον· ἐὰν οὖν μὴ γρηγορήσῃς, ⸀ἥξω ὡς κλέπτης, καὶ οὐ μὴ ⸀γνῷς ποίαν ὥραν ἥξω ἐπὶ σέ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/003.yaml
  text: Therefore remember how you have received and heard[a]; keep it, and repent. So if you do not stay awake, I will come like a thief[c][b], and you will certainly not know at what hour I will come upon you.
translation:
  language: sw
  text: Kwa hiyo, kumbuka jinsi ulivyopokea na kusikia[a]; yashike, na utubu. Basi, usipokuwa macho[b], nitakuja kama mwizi[c], nawe hakika hutajua ni saa gani nitakapokujia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kumbuka kile ulichopokea na kusikia.” Kigiriki kinasema “jinsi,” ambako kunaweza kusisitiza namna walivyopokea, ingawa wengine huelewa kuwa kunarejelea ujumbe wenyewe.
    reason: alternative_reading
  - marker: b
    text: “Kuwa macho” pia kunaweza kutafsiriwa “kukesha” au “kuwa mwangalifu.”
    reason: lexical_alternative
  - marker: c
    text: Onyo “nitakuja kama mwizi” linarudia lugha inayotumiwa mahali pengine kuhusu ujio wa ghafula na usiotarajiwa. Mstari wenyewe haubainishi kama ni hukumu ya mwisho au hatua ya karibu zaidi ya nidhamu.
    reason: cross_reference
lexical_decisions:
- source_word: μνημόνευε
  choice: kumbuka
  rationale: Amri ya wakati uliopo inahimiza kuendelea kukumbuka; “kumbuka” ni ya kawaida, wazi, na yenye uzito unaofaa.
- source_word: οὖν
  choice: kwa hiyo
  rationale: Inaonyesha hitimisho linalotokana na karipio lililotangulia na kuhifadhi uhusiano wa kimantiki.
- source_word: πῶς
  choice: jinsi
  rationale: Neno hili kwa kawaida linaelekeza kwenye namna walivyopokea na kusikia; “jinsi” huhifadhi maana hiyo bila kuibadili kuwa “kile”.
- source_word: εἴληφας
  choice: ulivyopokea
  rationale: Muundo huu unaunganika kiasili na “jinsi” na unaonyesha tendo la kupokea lenye umuhimu unaoendelea.
- source_word: ἤκουσας
  choice: kusikia
  rationale: Ni tafsiri ya moja kwa moja ya tendo lao la awali la kuusikia ujumbe.
- source_word: τήρει
  choice: shika hayo
  rationale: τηρέω inaweza kumaanisha kushika, kutunza, au kuzingatia. “Shika hayo” huhifadhi kwa pamoja wazo la kuyatunza na kuyatii yale waliyopokea na kusikia bila kulazimisha nomino isiyotajwa katika Kigiriki.
- source_word: μετανόησον
  choice: utubu
  rationale: “Tubu” ni neno la kawaida la Agano Jipya kwa kugeuka kutoka dhambini; umbo lenye “u-” linafuata kwa ufasaha mfululizo wa amri katika sentensi.
- source_word: γρηγορήσῃς
  choice: usipokuwa macho
  rationale: Huhifadhi picha ya kukesha na kuwa tayari, huku ikiwa lugha ya kawaida ya Kiswahili inayoendana na mfano wa mwizi.
- source_word: ἥξω ὡς κλέπτης
  choice: nitakuja kama mwizi
  rationale: Huhifadhi tashbihi ya Kigiriki na wazo la kuja ghafula na bila kutarajiwa.
- source_word: οὐ μὴ γνῷς
  choice: hakika hutajua
  rationale: “Hakika” huonyesha ukanushaji wenye mkazo wa οὐ μή bila kutumia kauli isiyo ya kawaida katika Kiswahili.
- source_word: ποίαν ὥραν
  choice: ni saa gani
  rationale: Huhifadhi marejeo mahususi ya “saa” na ni usemi wa kawaida wa Kiswahili.
- source_word: ἐπὶ σέ
  choice: nitakapokujia
  rationale: Kitenzi “kukujia” huonyesha kuja kumfikia mhusika na hudumisha uzito wa onyo bila kuamua kama kuja huko ni hukumu ya mwisho au adhabu ya karibu.
theological_decisions:
- issue: Maana ya πῶς εἴληφας καὶ ἤκουσας
  choice: “kumbuka jinsi ulivyopokea na kusikia”
  alternative: “kumbuka kile ulichopokea na kusikia”
  rationale: Kigiriki kina πῶς, yaani “jinsi/namna gani.” Tafsiri inadumisha uwezekano kwamba msisitizo uko katika namna ya mapokezi ya kwanza, ingawa wengine huielewa kuwa inarejelea ujumbe wenyewe.
- issue: Aina ya onyo katika “nitakuja kama mwizi”
  choice: Kuacha kuwa onyo la kuja kusikotarajiwa bila kubainisha aina ya kuja huko
  alternative: Kulieleza wazi kuwa kuja kwa mwisho kwa Kristo, au kuwa hukumu ya karibu kwa kusanyiko hilo
  rationale: Mstari wenyewe haubainishi kama ni ujio wa mwisho, hukumu ya kihistoria, au tendo la nidhamu. Lugha ya picha imehifadhiwa ili kutoondoa mvutano huo wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. “Usipokuwa macho” ni ya asili zaidi kuliko “usipokesha” katika muktadha huu, huku tanbihi ikihifadhi picha ya kukesha. “Nitakapokujia” ni ya kawaida na yenye uzito wa onyo bila kuingiza ufafanuzi wa kimadhehebu.
