id: REV.3.7
reference: Revelation 3:7
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ τῷ ἀγγέλῳ τῆς ἐν Φιλαδελφείᾳ ἐκκλησίας γράψον· Τάδε λέγει ὁ ἅγιος, ὁ ἀληθινός, ὁ ἔχων τὴν κλεῖν ⸀Δαυίδ, ὁ ἀνοίγων καὶ οὐδεὶς κλείσει, ⸂καὶ κλείων⸃ καὶ οὐδεὶς ⸀ἀνοίγει·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/007.yaml
  text: 'And write to the angel of the church in Philadelphia: These things says the Holy One[a], the True One, the one who has the key of David, who opens and no one will shut[b], and who shuts and no one opens:'
translation:
  language: sw
  text: '“Kwa malaika[a] wa kanisa lililoko Filadelfia andika: Haya ndiyo asemayo Yule Mtakatifu, Yeye aliye wa kweli, mwenye ufunguo wa Daudi[b], anayefungua na hakuna atakayefunga, naye anayefunga na hakuna anayefungua:”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mjumbe.” Neno la Kigiriki ἀγγέλῳ linaweza kumaanisha malaika au mjumbe.
    reason: alternative_reading
  - marker: b
    text: Kirai “ufunguo wa Daudi” yaelekea kurejelea Isaya 22:22, taswira ya mamlaka ya kifalme ya kufungua na kufunga.
    reason: cross_reference
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: malaika
  rationale: Neno hili linaweza kumaanisha malaika wa mbinguni au mjumbe wa kibinadamu. “Malaika” linafuata maana ya kawaida katika mfumo unaorudiwa wa jumbe kwa makanisa saba bila kuondoa uwezekano mwingine, ambao umeonyeshwa katika tanbihi.
- source_word: ἐκκλησίας
  choice: kanisa
  rationale: Katika anwani hii, neno hili linamaanisha jumuiya ya waamini; “kanisa” ndilo neno la kawaida na linaloeleweka vizuri katika Kiswahili cha sasa.
- source_word: Τάδε λέγει
  choice: Haya ndiyo asemayo
  rationale: Kauli hii inadumisha uzito wa utangulizi wa kinabii na nguvu ya kiwakilishi τάδε, huku ikiwa ya asili katika Kiswahili cha heshima.
- source_word: ὁ ἅγιος
  choice: Yule Mtakatifu
  rationale: Kivumishi chenye kibainishi kimetumiwa kama cheo cha msemaji. “Yule Mtakatifu” huhifadhi umbo hilo la cheo.
- source_word: ὁ ἀληθινός
  choice: Yule wa Kweli
  rationale: Tafsiri hii huhifadhi maana pana ya aliye wa kweli, halisi na wa hakika, bila kuibana iwe tu “mwaminifu” au “asemaye kweli.”
- source_word: κλεῖν Δαυίδ
  choice: ufunguo wa Daudi
  rationale: Hii ni tafsiri ya moja kwa moja inayohifadhi taswira ya mamlaka ya kifalme na mwangwi wake wa Isaya 22:22.
- source_word: ἀνοίγων
  choice: anayefungua
  rationale: Kauli ya sasa inaendeleza mfululizo wa sifa za msemaji kwa Kiswahili cha kawaida.
- source_word: κλείσει
  choice: atakayefunga
  rationale: Wakati ujao wa kitenzi cha Kigiriki umehifadhiwa, ukionyesha kwamba hakuna mtu atakayeweza kufunga kile anachofungua.
- source_word: κλείων
  choice: anayefunga
  rationale: Kauli ya sasa imetafsiriwa kwa kishazi tegemezi cha asili kinachoendelea kumfafanua msemaji.
- source_word: ἀνοίγει
  choice: anayefungua
  rationale: 'Wakati wa sasa umehifadhiwa ili kudumisha jozi ya matendo: yeye hufungua na hakuna atakayefunga; yeye hufunga na hakuna anayefungua.'
theological_decisions:
- issue: Vyeo vya Kristo ὁ ἅγιος na ὁ ἀληθινός
  choice: 'Yametafsiriwa kama vyeo rasmi vya Yesu aliyefufuka: “Yule Mtakatifu, Yule wa Kweli.”'
  alternative: “aliye mtakatifu na wa kweli,” kama maelezo ya kawaida badala ya vyeo
  rationale: Msemaji katika mfumo huu wa ujumbe ni Kristo, na miundo yenye kibainishi inafanya kazi kama vyeo. Tafsiri hii huhifadhi uzito wa Kikristo wa kifungu bila kuongeza madai yasiyosemwa na maandishi.
- issue: Mwangwi wa “ufunguo wa Daudi”
  choice: Taswira ya ufunguo imehifadhiwa katika maandishi bila kufafanuliwa kwa maneno mengine.
  alternative: “mamlaka juu ya ufalme wa Daudi”
  rationale: Kirai kinaelekea kurejelea Isaya 22:22 na mamlaka ya kifalme ya ukoo wa Daudi, lakini tafsiri inapaswa kuhifadhi taswira ya kibiblia; ufafanuzi umetolewa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na uzito wa kinabii. “Asemayo” hudumisha hadhi ya kauli bila kuwa ya kizamani kupita kiasi. Alama za tanbihi zimewekwa karibu na maneno yanayohusika moja kwa moja, na sentensi imeachwa na nukta mbili kwa sababu inaanzisha ujumbe unaofuata.
