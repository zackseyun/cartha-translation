  text: The one who has an ear[b][a], let him hear what the Spirit says to the churches.
translation:
  language: sw
  text: Yeyote aliye na sikio, na asikie kile anachosema Roho kwa makanisa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἔχων
  choice: Yeyote aliye na
  rationale: Kirai chenye kibainishi na kitenzi-shirikishi kinamtaja kila mtu anayesifiwa kwa hali hii; “yeyote aliye na” ni Kiswahili cha sasa na huhifadhi nguvu ya mwito wa kimethali.
- source_word: οὖς
  choice: sikio
  rationale: Nomino ya Kigiriki iko katika umoja. “Sikio” huhifadhi umoja huo na inaeleweka katika msemo huu wa mwito wa kusikiliza kwa makini.
- source_word: ἀκουσάτω
  choice: na asikie
  rationale: Ni amri ya nafsi ya tatu umoja. “Na asikie” huwasilisha amri hiyo kwa Kiswahili cha heshima na pia inaweza kudokeza kusikia kwa kuitikia, si kupokea sauti tu.
- source_word: τί
  choice: yale ambayo
  rationale: Hutambulisha maudhui ya maneno yanayosemwa. “Yale ambayo” ni ya asili katika muundo huu wa Kiswahili na inapatana na ngeli ya mambo yanayoambiwa makanisa.
- source_word: τὸ πνεῦμα
  choice: Roho
  rationale: Katika fomula inayorudiwa ya Ufunuo, neno hili humrejelea Roho Mtakatifu; herufi kubwa inaonyesha rejeo hilo bila kuongeza “Mtakatifu,” ambalo halipo wazi katika mstari.
- source_word: λέγει
  choice: anayaambia
  rationale: Kitenzi cha wakati wa sasa kinaeleza tendo la Roho kuelekeza ujumbe kwa wapokeaji. “Anayaambia” ni cha asili kwa Kiswahili na huunganisha yaliyosemwa na makanisa yanayoambiwa.
- source_word: ταῖς ἐκκλησίαις
  choice: makanisa
  rationale: Hali ya dativu hutaja wapokeaji wa ujumbe. “Makanisa” ndilo neno la kawaida na linalofaa katika muktadha wa jumbe kwa makanisa saba, ingawa “makusanyiko” linawezekana kileksika.
theological_decisions:
- issue: Rejeo la “Roho”
  choice: Roho Mtakatifu anayesema na makanisa
  alternative: roho ya mwanadamu, au roho ya unabii inayoeleweka bila nafsi
  rationale: Katika mwito huu unaorudiwa katika Ufunuo, “Roho” anaeleweka vizuri zaidi kuwa Roho Mtakatifu anayeyafikishia makanisa ujumbe wa kinabii. Tafsiri inaandika “Roho” kwa herufi kubwa lakini haiongezi neno lisilokuwapo katika Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Umoja wa “sikio” na amri ya nafsi ya tatu umehifadhiwa; hakuna tanbihi inayohitajika kwa mstari huu.
