id: REV.3.16
reference: Revelation 3:16
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οὕτως, ὅτι χλιαρὸς εἶ καὶ ⸀οὔτε ζεστὸς οὔτε ψυχρός, μέλλω σε ἐμέσαι ἐκ τοῦ στόματός μου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/016.yaml
  text: So[a], because you are lukewarm, and neither hot nor cold, I am about to vomit you out of my mouth.
translation:
  language: sw
  text: Basi, kwa sababu wewe ni vuguvugu, wala si moto wala si baridi, niko karibu kukutapika kutoka kinywani mwangu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως
  choice: Basi
  rationale: Neno hili linaonyesha matokeo yanayotokana na maelezo yaliyotangulia; “Basi” ni la kawaida na huhifadhi nguvu hiyo ya kimantiki.
- source_word: ὅτι
  choice: kwa sababu
  rationale: Hapa linaonyesha sababu ya hukumu inayotangazwa.
- source_word: χλιαρός
  choice: vuguvugu
  rationale: Ni neno la kawaida la Kiswahili kwa kitu kisicho moto wala baridi na linahifadhi taswira ya kiwango cha joto.
- source_word: οὔτε ζεστὸς οὔτε ψυχρός
  choice: wala si moto wala si baridi
  rationale: Huhifadhi ulinganifu na utofautishaji wa maneno ya Kigiriki bila kufasiri taswira kupita kiasi.
- source_word: μέλλω
  choice: niko karibu
  rationale: Huwasilisha tendo linalokaribia kutokea na hivyo kuhifadhi uzito na uharaka wa onyo.
- source_word: ἐμέσαι
  choice: kukutapika
  rationale: Kitenzi hiki humaanisha kutapika; tafsiri hii ya moja kwa moja haipunguzi makali ya taswira ya Kigiriki.
- source_word: ἐκ τοῦ στόματός μου
  choice: kutoka kinywani mwangu
  rationale: Huhifadhi taswira halisi ya kufukuzwa kutoka kinywani na ni Kiswahili cha asili.
theological_decisions:
- issue: Ukali wa taswira ya hukumu katika ἐμέσαι
  choice: kukutapika
  alternative: kukutoa kwa nguvu; kukutema
  rationale: Kigiriki kinatumia taswira kali na ya kushtua ya kutapika. “Kukutema” ingepunguza uzito wa onyo, na fasiri nyingine ingeondoa picha yake halisi.
- issue: Nguvu ya wakati katika μέλλω
  choice: niko karibu
  alternative: nitakutapika; ninakwenda kukutapika
  rationale: Ujenzi wa Kigiriki unaonyesha tendo linalokaribia, si kauli ya jumla tu ya wakati ujao. Tafsiri hii huhifadhi uharaka wa hukumu inayotangazwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wa heshima na unaoeleweka kwa wasomaji wa kawaida. Taswira kali ya chanzo imehifadhiwa bila kulainishwa. Hakuna tanbihi iliyohitajika, kwa kuwa “kutapika” ni wazi na sahihi katika Kiswahili.
