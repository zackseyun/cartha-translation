id: REV.3.5
reference: Revelation 3:5
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὁ νικῶν ⸀οὕτως περιβαλεῖται ἐν ἱματίοις λευκοῖς, καὶ οὐ μὴ ἐξαλείψω τὸ ὄνομα αὐτοῦ ἐκ τῆς βίβλου τῆς ζωῆς, καὶ ὁμολογήσω τὸ ὄνομα αὐτοῦ ἐνώπιον τοῦ πατρός μου καὶ ἐνώπιον τῶν ἀγγέλων αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/005.yaml
  text: The one who conquers will thus be clothed in white garments[a], and I will certainly not erase his name from the book of life[d][c][b], and I will confess his name before my Father and before his angels.
translation:
  language: sw
  text: Yule anayeshinda[a] vivyo hivyo atavikwa mavazi meupe. Sitafuta kamwe[b] jina lake kutoka katika kitabu cha uzima[c], nami nitalikiri jina lake[d] mbele ya Baba yangu na mbele ya malaika wake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “yule anayeshinda.” Kirai hiki kinaweza pia kumaanisha yule anayeshinda au kushinda kwa kudumu.
    reason: lexical_alternative
  - marker: b
    text: Au, “kamwe sitafuta jina lake kutoka katika kitabu cha uzima.” Kigiriki kinatumia ukanushaji wenye mkazo mkubwa.
    reason: lexical_alternative
  - marker: c
    text: Yaani, daftari la mbinguni la wale walio wa Mungu na wanaourithi uzima.
    reason: cultural_note
  - marker: d
    text: Au, “nitalitambua wazi jina lake.” Linganisha Mathayo 10:32.
    reason: cross_reference
lexical_decisions:
- source_word: ὁ νικῶν
  choice: Yule anayeshinda
  rationale: Kirai hiki ni kitenzi cha wakati uliopo kilichotumiwa kama nomino. Tafsiri hii ni ya kawaida katika Kiswahili na inadumisha wazo la ushindi linalomtambulisha mtu, kama ilivyo katika dhamira ya ushindi katika Ufunuo.
- source_word: οὕτως
  choice: hivyo
  rationale: Neno hili limehifadhiwa kwa kuwa linaunganisha ahadi hii na maelezo au ahadi iliyotangulia.
- source_word: περιβαλεῖται
  choice: atavikwa
  rationale: Umbo hili la kitenzi linaeleweka hapa kwa maana ya kutendwa; ‘atavikwa’ ni la asili katika Kiswahili na linaonyesha kupokea vazi.
- source_word: ἱματίοις λευκοῖς
  choice: mavazi meupe
  rationale: ‘Mavazi’ ni neno pana linalolingana na ἱμάτια bila kuyafanya mahususi kuwa majoho; rangi nyeupe imehifadhiwa kama ilivyo.
- source_word: οὐ μὴ ἐξαλείψω
  choice: Hakika sitalifuta kamwe
  rationale: οὐ μή pamoja na kitenzi cha wakati ujao ni ukanushaji wenye mkazo mkubwa. ‘Hakika ... kamwe’ linafikisha mkazo huo kwa Kiswahili wazi.
- source_word: τὸ ὄνομα αὐτοῦ
  choice: jina lake
  rationale: Tafsiri ya moja kwa moja inadumisha umoja na muundo wa kiume wa kisarufi wa chanzo, unaotumiwa kwa maana wakilishi.
- source_word: ἐκ τῆς βίβλου τῆς ζωῆς
  choice: katika kitabu cha uzima
  rationale: ‘Kitabu cha uzima’ ni usemi wa kibiblia unaotambulika na unafaa kwa picha ya daftari la mbinguni.
- source_word: ὁμολογήσω
  choice: nitalikiri
  rationale: Kitenzi hiki humaanisha kukiri au kutambua waziwazi. ‘Nitalikiri’ kinahifadhi uzito wa tangazo la hadharani na uhusiano wa kimatamshi na Mathayo 10:32.
- source_word: ἐνώπιον
  choice: mbele ya
  rationale: Ni tafsiri fupi, sanifu na ya asili kwa matumizi yote mawili.
- source_word: τοῦ πατρός μου
  choice: Baba yangu
  rationale: Tafsiri ya moja kwa moja inadumisha uhusiano wa Yesu na Baba bila kuongeza maelezo.
- source_word: τῶν ἀγγέλων αὐτοῦ
  choice: malaika wake
  rationale: Kiwakilishi kinarejelea kwa kawaida ‘Baba yangu’ katika muundo wa karibu wa sentensi; hakijabadilishwa kuwa ‘malaika wa Mungu.’
theological_decisions:
- issue: Maana ya kutofutwa kwa jina katika kitabu cha uzima katika mjadala kuhusu kudumu katika imani au kuasi
  choice: Kauli imetafsiriwa moja kwa moja kama ahadi yenye nguvu kwa anayeshinda, bila kuamua iwapo waamini wa kweli wanaweza au hawawezi kuanguka kabisa.
  alternative: Kuifasiri kama uthibitisho wa lazima wa kudumu kwa watakatifu, au kama onyo la wazi kwamba wokovu unaweza kupotezwa.
  rationale: Mstari wenyewe unatoa ahadi kwa picha ya daftari la mbinguni, lakini peke yake hausuluhishi bila utata mjadala mpana wa kitheolojia.
- issue: Jinsia katika muundo wa umoja wa kiume
  choice: jina lake
  alternative: jina lao
  rationale: Umoja wa chanzo umehifadhiwa. Katika Kiswahili, ‘lake’ halionyeshi jinsia ya mwenye jina, lakini linadumisha idadi ya umoja na maana wakilishi bila kulazimisha jinsia isiyowekwa na sarufi ya Kiswahili.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imegawanywa ili iwe wazi kwa msomaji wa kawaida, huku ‘hivyo’ na viunganishi vikidumisha mtiririko wa Kigiriki. ‘Bali’ linaonyesha kwa njia ya asili mwelekeo chanya unaofuata ahadi ya kutofuta, bila kubadili maudhui yake.
