id: REV.3.1
reference: Revelation 3:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ τῷ ἀγγέλῳ τῆς ἐν Σάρδεσιν ἐκκλησίας γράψον· Τάδε λέγει ὁ ἔχων τὰ ἑπτὰ πνεύματα τοῦ θεοῦ καὶ τοὺς ἑπτὰ ἀστέρας· Οἶδά σου τὰ ἔργα, ὅτι ὄνομα ἔχεις ὅτι ζῇς, καὶ νεκρὸς εἶ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/001.yaml
  text: 'And write to the angel of the church in Sardis: These things says the one who has the seven spirits of God and the seven stars: I know your works[a]; you have a name that you are alive[d][c][b], but you are dead.'
translation:
  language: sw
  text: '“Na kwa malaika[a] wa kanisa lililo Sardi andika: ‘Haya ndiyo asemayo yeye aliye na roho saba za Mungu[b] na nyota saba: Nayajua matendo yako; una sifa ya kuwa hai[c], lakini umekufa.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mjumbe.” Neno la Kigiriki linaweza kumaanisha malaika au mjumbe, ingawa “malaika” linafaa zaidi katika mazingira ya kiapokaliptiki ya Ufunuo.
    reason: alternative_reading
  - marker: b
    text: Kirai “roho saba za Mungu” kimehifadhiwa kama kilivyo. Huenda kikaashiria ukamilifu wa Roho wa Mungu, ingawa wengine hukielewa kuwa roho saba za mbinguni.
    reason: alternative_reading
  - marker: c
    text: Kwa tafsiri ya karibu zaidi na maneno ya Kigiriki, “una jina kwamba unaishi.” Maana yake ni kwamba una sifa ya kuwa hai.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: malaika
  rationale: Neno hili kwa kawaida humaanisha ‘malaika’ na linafaa katika mazingira ya kiapokaliptiki ya Ufunuo; maana ya ‘mjumbe’ imehifadhiwa katika tanbihi.
- source_word: ἐκκλησίας
  choice: kanisa
  rationale: Hili ndilo neno la kawaida na linaloeleweka kwa jumuiya ya waamini katika Sardi.
- source_word: Τάδε λέγει
  choice: Haya ndiyo asemayo
  rationale: Kauli hii inahifadhi mtindo rasmi wa kinabii huku ikiwa ya asili katika Kiswahili.
- source_word: ὁ ἔχων
  choice: yeye aliye na
  rationale: Inawakilisha kirai cha Kigiriki kwa njia ya kawaida na yenye hadhi katika Kiswahili.
- source_word: τὰ ἑπτὰ πνεύματα τοῦ θεοῦ
  choice: roho saba za Mungu
  rationale: Wingi wa Kigiriki umehifadhiwa ili tafsiri isiamue kimyakimya maana ya ishara hiyo.
- source_word: τοὺς ἑπτὰ ἀστέρας
  choice: nyota saba
  rationale: Ni tafsiri ya moja kwa moja ya maneno ya Kigiriki bila kuingiza ufafanuzi wa ishara.
- source_word: Οἶδά σου τὰ ἔργα
  choice: Nayajua matendo yako
  rationale: ‘Matendo’ ni Kiswahili cha asili na hudumisha kauli ya tathmini inayorudiwa katika Ufunuo.
- source_word: ὄνομα ἔχεις ὅτι ζῇς
  choice: una sifa kwamba uko hai
  rationale: ‘Una sifa’ huwasilisha maana ya kuwa na jina au sifa inayojulikana, bila kutafsiri kirai hicho kwa Kiswahili kisicho cha kawaida.
- source_word: νεκρὸς εἶ
  choice: umekufa
  rationale: Kauli hii ni ya moja kwa moja na yenye nguvu, na inahifadhi ulinganifu mkali na ‘uko hai.’
theological_decisions:
- issue: Maana ya ‘roho saba za Mungu’
  choice: Kudumisha ‘roho saba za Mungu’ katika matini kuu.
  alternative: ‘Roho wa Mungu katika ukamilifu wake’ au roho saba za mbinguni.
  rationale: Kigiriki kina wingi, na maana ya ishara inabishaniwa; tafsiri haipaswi kuamua suala hilo.
- issue: Mhusika anayeitwa ἀγγέλῳ
  choice: malaika
  alternative: mjumbe au mwakilishi wa kibinadamu wa kanisa
  rationale: ‘Malaika’ ni maana ya kawaida na inafaa katika mazingira ya Ufunuo, lakini uwezekano wa ‘mjumbe’ umeonyeshwa katika tanbihi.
- issue: Hali ya kanisa la Sardi
  choice: Kuhifadhi tofauti kati ya sifa ya kuwa hai na hukumu kwamba limekufa.
  alternative: Kufafanua moja kwa moja kuwa ni uhai na kifo cha kiroho.
  rationale: Matini yenyewe haitaji wazi ‘kiroho’; sitiari inapaswa kubaki bila kuongezewa ufafanuzi wa kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo rasmi na wenye hadhi lakini unaoeleweka kwa msomaji wa kawaida. ‘Haya ndiyo asemayo’ huhifadhi sauti ya kinabii; ‘una sifa’ huepuka kirai kigumu ‘una jina kwamba unaishi.’
