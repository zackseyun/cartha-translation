id: REV.3.17
reference: Revelation 3:17
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὅτι λέγεις ⸀ὅτι Πλούσιός εἰμι καὶ πεπλούτηκα καὶ ⸀οὐδὲν χρείαν ἔχω, καὶ οὐκ οἶδας ὅτι σὺ εἶ ὁ ταλαίπωρος ⸀καὶ ἐλεεινὸς καὶ πτωχὸς καὶ τυφλὸς καὶ γυμνός,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/017.yaml
  text: because you say[a], ‘I am rich, and I have become wealthy[b], and I have need of nothing,’ and you do not know that you are wretched and pitiable and poor and blind and naked.
translation:
  language: sw
  text: kwa sababu unasema, “Mimi ni tajiri, nimepata utajiri, wala sina haja ya kitu chochote,” na hujui kwamba wewe ni mwenye taabu, wa kusikitikiwa, maskini, kipofu, na uchi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι λέγεις ὅτι
  choice: kwa sababu unasema, “…”
  rationale: ὅτι ya kwanza inaeleza sababu, na ya pili inaanzisha yaliyosemwa; nukuu ya moja kwa moja ni ya kawaida na wazi katika Kiswahili.
- source_word: Πλούσιός εἰμι
  choice: Mimi ni tajiri
  rationale: Neno “Mimi” linaweka wazi madai ya msemaji, huku “tajiri” likihifadhi maana ya moja kwa moja ya utajiri.
- source_word: πεπλούτηκα
  choice: nimejipatia utajiri
  rationale: Kauli hii huonyesha kupata utajiri na hali inayotokana na tendo hilo; pia huitofautisha na dai lililotangulia, “ni tajiri.”
- source_word: οὐδὲν χρείαν ἔχω
  choice: wala sihitaji kitu chochote
  rationale: Hii ni kauli ya kawaida ya Kiswahili inayohifadhi msisitizo wa kutokuwa na hitaji lolote.
- source_word: οὐκ οἶδας
  choice: hujui
  rationale: Inahifadhi kitenzi cha kujua bila kukifasiri kwa neno kama “hutambui.”
- source_word: σὺ εἶ ὁ ταλαίπωρος
  choice: wewe ndiye mtu mwenye taabu
  rationale: “Wewe ndiye” huonyesha msisitizo wa σὺ na namna yenye kulenga moja kwa moja ya usemi wenye kibainishi ὁ; “mtu mwenye taabu” ni Kiswahili cha asili kuliko muundo wa kivumishi peke yake.
- source_word: ἐλεεινός
  choice: wa kusikitikiwa
  rationale: Humaanisha mtu anayestahili kusikitikiwa na kulitofautisha neno hili na ταλαίπωρος.
- source_word: πτωχὸς καὶ τυφλὸς καὶ γυμνός
  choice: maskini, kipofu na aliye uchi
  rationale: Maneno ya umaskini, upofu na uchi yameachwa kama yalivyo bila kuongeza ufafanuzi wa kiroho; “aliye uchi” ni muundo wa kawaida unaopatana na “mtu.”
theological_decisions:
- issue: Iwapo tofauti kati ya utajiri unaodaiwa na hali halisi ifafanuliwe kuwa ya kiroho
  choice: Maneno ya utajiri, umaskini, upofu na uchi yamehifadhiwa bila kuongeza “kiroho.”
  alternative: Mimi ni tajiri kiroho … wewe ni maskini kiroho
  rationale: Matini yenyewe hujenga kejeli na mvutano huo; kuongeza “kiroho” kungeamua tafsiri ambayo haijaelezwa moja kwa moja katika mstari.
- issue: Nguvu ya ὁ ταλαίπωρος katika orodha ya sifa
  choice: wewe ndiye mtu mwenye taabu
  alternative: wewe ni mwenye taabu
  rationale: Muundo uliochaguliwa unawakilisha msisitizo wa kiwakilishi σὺ na kibainishi ὁ kwa Kiswahili cha kawaida bila kuifanya sifa hiyo kuwa cheo au utambulisho wa kidhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa urahisi. “Lakini” limetumiwa kuonyesha tofauti kali iliyomo katika muktadha, ingawa Kigiriki kina καί. Hakuna tanbihi iliyohitajika kwa kuwa tofauti za kimaandishi zilizoonyeshwa hazibadili maana ya msingi ya tafsiri hii.
