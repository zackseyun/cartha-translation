id: REV.3.12
reference: Revelation 3:12
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὁ νικῶν ποιήσω αὐτὸν στῦλον ἐν τῷ ναῷ τοῦ θεοῦ μου, καὶ ἔξω οὐ μὴ ἐξέλθῃ ἔτι, καὶ γράψω ἐπ’ αὐτὸν τὸ ὄνομα τοῦ θεοῦ μου καὶ τὸ ὄνομα τῆς πόλεως τοῦ θεοῦ μου, τῆς καινῆς Ἰερουσαλήμ, ἡ ⸀καταβαίνουσα ἐκ τοῦ οὐρανοῦ ἀπὸ τοῦ θεοῦ μου, καὶ τὸ ὄνομά μου τὸ καινόν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/012.yaml
  text: The one who conquers—I will make him a pillar in the temple of my God[a], and he will never go out from it anymore. And I will write on him the name of my God, and the name of the city of my God, the new Jerusalem, which comes down out of heaven from my God[c][b], and my own new name.
translation:
  language: sw
  text: Yeye anayeshinda, nitamfanya kuwa nguzo katika hekalu la Mungu wangu, naye hatatoka humo tena kamwe.[a] Nitaandika juu yake jina la Mungu wangu, jina la mji wa Mungu wangu, yaani, Yerusalemu mpya inayoshuka kutoka mbinguni, kutoka kwa Mungu wangu, na jina langu jipya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kigiriki kina ukanushaji wenye mkazo: “kwa hakika hatatoka tena kamwe.”'
    reason: lexical_alternative
  - marker: b
    text: Au “jina langu, lile jipya.” Muundo wa Kigiriki unalitilia mkazo jina hili jipya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ νικῶν
  choice: Yeye anayeshinda
  rationale: Kishiriki cha wakati wa sasa kilichotumiwa kama nomino kinaeleza mtu anayeshinda kwa uaminifu; pia kinadumisha dhamira ya νικάω inayorudiwa katika Ufunuo.
- source_word: ποιήσω αὐτὸν στῦλον
  choice: nitamfanya kuwa nguzo
  rationale: Muundo huu unaonyesha kumfanya au kumweka mtu awe nguzo, huku ukihifadhi taswira halisi ya kudumu na heshima.
- source_word: ἐν τῷ ναῷ
  choice: katika hekalu
  rationale: ναός huelekeza hasa kwenye hekalu au patakatifu, si eneo lote la viwanja vya hekalu; 'hekalu' ni neno la kawaida na linaloeleweka vizuri.
- source_word: ἔξω οὐ μὴ ἐξέλθῃ ἔτι
  choice: hatatoka humo tena kamwe
  rationale: Maneno 'tena kamwe' yanaonyesha ukanushaji mkazo wa οὐ μή pamoja na mwisho wa kutoka; 'humo' linaweka wazi rejeo linalodokezwa la hekalu.
- source_word: γράψω ἐπ’ αὐτὸν
  choice: nitaandika juu yake
  rationale: Tafsiri hii inadumisha picha ya kuandika au kutia jina juu ya mtu bila kufafanua zaidi maana yake.
- source_word: τὸ ὄνομα τῆς πόλεως τοῦ θεοῦ μου
  choice: jina la mji wa Mungu wangu
  rationale: Muundo wa moja kwa moja unahifadhi ulinganifu wa vifungu vitatu vinavyotaja jina.
- source_word: τῆς καινῆς Ἰερουσαλήμ
  choice: yaani, Yerusalemu mpya
  rationale: Kirai hiki kinaitambulisha mji uliotajwa kuwa Yerusalemu mpya; 'yaani' huonyesha uhusiano huo kwa Kiswahili cha kawaida.
- source_word: ἡ καταβαίνουσα ἐκ τοῦ οὐρανοῦ ἀπὸ τοῦ θεοῦ μου
  choice: inayoshuka kutoka mbinguni kwa Mungu wangu
  rationale: Kishiriki cha sasa kinatafsiriwa kwa 'inayoshuka.' 'Kutoka mbinguni kwa Mungu wangu' kinadumisha kwa njia ya kawaida tofauti kati ya mahali inakotoka na Mungu aliye chanzo chake.
- source_word: τὸ ὄνομά μου τὸ καινόν
  choice: jina langu mwenyewe jipya
  rationale: '''Mwenyewe'' huakisi mkazo wa muundo wa Kigiriki huku ''jipya'' likibaki kivumishi cha ''jina,'' bila kukisia jina hilo ni nini.'
theological_decisions:
- issue: Umoja wa kiume katika kauli ya ahadi
  choice: 'Kutumia umoja unaomrejelea mtu: ''yeye,'' ''nitamfanya,'' na ''juu yake'''
  alternative: Kutumia wingi kama 'wale wanaoshinda'
  rationale: Kigiriki kina kishiriki na viwakilishi vya umoja wa kiume vinavyotumiwa kiuwakilishi. Kiswahili hakina jinsia katika viwakilishi hivi, hivyo umoja unaweza kuhifadhiwa bila kuongeza ubainishaji wa kijinsia usio wa lazima.
- issue: Kurudiwa kwa 'Mungu wangu' katika maneno ya Yesu aliyetukuzwa
  choice: Kuhifadhi kila tukio la 'Mungu wangu' lililopo katika Kigiriki
  alternative: Kupunguza marudio kwa ufasaha wa kimtindo
  rationale: Marudio hayo yako wazi na yana uzito wa kithiolojia; hayapaswi kulainishwa au kufafanuliwa kwa mafundisho ya nje.
- issue: Kirai cha mwisho kuhusu jina
  choice: '''jina langu mwenyewe jipya'''
  alternative: '''jina langu jipya'''
  rationale: Neno 'mwenyewe' linaonyesha mkazo wa τὸ ὄνομά μου τὸ καινόν, huku fumbo la jina hilo likiachwa kama lilivyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini cha kawaida na kinachoeleweka. Taswira za 'nguzo' na 'kuandika juu yake' zimehifadhiwa. Marudio ya 'Mungu wangu' yamedumishwa, na sintaksia imepangwa ili iwe ya asili bila kuondoa mkazo au fumbo la maandishi.
