id: REV.3.8
reference: Revelation 3:8
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Οἶδά σου τὰ ἔργα— ἰδοὺ δέδωκα ἐνώπιόν σου θύραν ἠνεῳγμένην, ἣν οὐδεὶς δύναται κλεῖσαι αὐτήν— ὅτι μικρὰν ἔχεις δύναμιν, καὶ ἐτήρησάς μου τὸν λόγον, καὶ οὐκ ἠρνήσω τὸ ὄνομά μου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/008.yaml
  text: I know your works. Look[a], I have set before you an open door, which no one is able to shut, because you have little strength, and you have kept my word, and have not denied my name.
translation:
  language: sw
  text: Ninajua matendo yako. Tazama, nimeweka mbele yako mlango uliofunguliwa[a], ambao hakuna mtu anayeweza kuufunga, kwa sababu una nguvu kidogo, na umelishika neno langu, na hukulikana jina langu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mlango ulio wazi” au “mlango unaobaki wazi.” Kivumishi-kitenzi cha Kigiriki kinaonyesha kwamba mlango huo umefunguliwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἶδά σου τὰ ἔργα
  choice: Ninajua matendo yako
  rationale: οἶδα ina umbo la wakati timilifu lakini maana ya wakati wa sasa; “ninajua” ni Kiswahili cha kawaida. “Matendo” huhifadhi nomino halisi ya wingi na mtindo unaorudiwa katika Ufunuo.
- source_word: ἰδοὺ
  choice: Tazama
  rationale: Ni alama ya usemi inayovuta fikira. “Tazama” ni ya sasa, yenye hadhi, na hudumisha nguvu ya mwito bila kutumia lugha ya kizamani isiyoeleweka.
- source_word: δέδωκα ἐνώπιόν σου
  choice: nimeweka mbele yako
  rationale: Ingawa δέδωκα kwa msingi ni “nimetoa,” muundo wake pamoja na θύραν na ἐνώπιόν σου una maana ya kuweka mlango mbele ya mtu. Wakati timilifu “nimeweka” huhifadhi tendo lililotimizwa lenye matokeo ya sasa.
- source_word: θύραν ἠνεῳγμένην
  choice: mlango uliofunguliwa
  rationale: 'Kirai hiki huhifadhi nguvu ya kitenzi ya participio timilifu: mlango umefunguliwa na unabaki wazi. Dokezo linaonyesha mbadala wa Kiswahili ulio wa kawaida zaidi.'
- source_word: ἣν οὐδεὶς δύναται κλεῖσαι αὐτήν
  choice: ambao hakuna mtu anayeweza kuufunga
  rationale: Huhifadhi wazi wazo la uwezo katika δύναται na kutaja mlango kwa kiwakilishi cha ngeli kinachofaa.
- source_word: ὅτι μικρὰν ἔχεις δύναμιν
  choice: kwa sababu una nguvu kidogo
  rationale: ὅτι inaeleweka kwa kawaida kama sababu, na δύναμις hapa ni uwezo au nguvu iliyo ndogo bila kulazimisha maana ya kisiasa.
- source_word: καὶ ἐτήρησάς μου τὸν λόγον
  choice: lakini umelishika neno langu
  rationale: Katika muktadha huu καί yaweza kuwa na nguvu ya kutofautisha hali ya nguvu kidogo na uaminifu wa kanisa; “lakini” hufanya uhusiano huo kuwa wa kawaida katika Kiswahili. “Kulishika neno” huhifadhi upana wa τηρέω—kutii, kutunza, na kudumu kwa uaminifu—bila kuufupisha kuwa maana moja tu.
- source_word: καὶ οὐκ ἠρνήσω τὸ ὄνομά μου
  choice: na hukulikana jina langu
  rationale: “Kulikana jina langu” hudumisha taswira ya Kigiriki ya kukataa au kujitenga na jina, ambalo hapa linawakilisha uaminifu kwa Kristo. Umbo “hukulikana” linaeleza tendo la wakati uliopita lenye umuhimu unaoendelea kwa njia ya asili ya Kiswahili.
theological_decisions:
- issue: Maana ya taswira ya “mlango uliofunguliwa”
  choice: Taswira imetafsiriwa moja kwa moja bila kubainisha inamaanisha fursa ya utume, njia ya kuingia katika wokovu au ufalme, ulinzi, au fursa nyingine ya kimungu.
  alternative: Kuifafanua kama fursa ya kuhubiri, kuingia katika ufalme, au fursa ya jumla.
  rationale: Aya yenyewe haitoi ufafanuzi mmoja wa taswira hiyo; tafsiri inapaswa kuhifadhi utata wake halisi na mvutano wake wa kitheolojia.
- issue: Uhusiano kati ya “nguvu kidogo” na uaminifu wa kanisa
  choice: 'καί ya kwanza baada ya kirai hicho imetafsiriwa “lakini,” ikionyesha tofauti ya kimuktadha: licha ya nguvu kidogo, wamelishika neno.'
  alternative: Kutafsiri viunganishi vyote kwa “na,” na hivyo kuacha uhusiano ukiwa wa kuorodhesha tu.
  rationale: Kigiriki καί kinaweza kuwa cha kuongezea au cha kutofautisha kulingana na muktadha. “Lakini” ni Kiswahili cha kawaida na huonyesha tofauti inayodokezwa bila kubadili madai ya aya.
- issue: Nguvu ya maumbo timilifu
  choice: “Nimeweka” na “umelishika” zimetumiwa kuonyesha matendo yaliyotimizwa yenye umuhimu unaoendelea; “hukulikana” ni ukanushi wa asili unaobeba maana hiyo katika muktadha.
  alternative: Kutumia wakati uliopita sahili katika kila kishazi.
  rationale: Maumbo haya yanaendeleza umuhimu wa sasa wa tendo la Kristo na uaminifu wa kanisa, huku yakibaki ya kawaida katika Kiswahili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imehifadhi mtiririko wa hotuba ya kinabii na taswira halisi bila kuifafanua kimadhehebu. Kiashiria cha dokezo [a] kimewekwa mara tu baada ya kirai kinachohusika.
