id: REV.3.20
reference: Revelation 3:20
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἰδοὺ ἕστηκα ἐπὶ τὴν θύραν καὶ κρούω· ἐάν τις ἀκούσῃ τῆς φωνῆς μου καὶ ἀνοίξῃ τὴν θύραν, ⸀καὶ εἰσελεύσομαι πρὸς αὐτὸν καὶ δειπνήσω μετ’ αὐτοῦ καὶ αὐτὸς μετ’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/020.yaml
  text: Look[a], I stand at the door and knock. If anyone hears my voice and opens the door, I will come in to him and dine with him[c][b], and he with me.
translation:
  language: sw
  text: Tazama[a], nimesimama mlangoni na ninabisha. Mtu yeyote akiisikia sauti yangu na kuufungua mlango, nitaingia kwake[b] na kula chakula pamoja naye[c], naye pamoja nami.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Tazama, nimesimama mlangoni na ninaendelea kubisha.” Kigiriki hutumia kitenzi timilifu chenye maana ya hali ya sasa kwa “nimesimama,” na kitenzi cha wakati wa sasa kwa “ninabisha,” hivyo kusisitiza hali na tendo vinavyoendelea.
    reason: lexical_alternative
  - marker: b
    text: Kwa maana ya karibu, “nitaingia kwa mtu huyo.” Maneno haya yanasisitiza kumjia mtu, si kuingia mahali tu.
    reason: lexical_alternative
  - marker: c
    text: Taswira ya kula pamoja inaonyesha ushirika wa karibu wa pande zote. Wafasiri hutofautiana kuhusu kama inarejelea hasa Meza ya Bwana, kuongoka, au kurejeshwa kwa ushirika; andiko lenyewe haliamui hilo waziwazi.
    reason: cross_reference
lexical_decisions:
- source_word: ἰδοὺ
  choice: Tazama
  rationale: Ni neno la kuvuta usikivu. “Tazama” ni la kawaida katika Kiswahili sanifu chenye hadhi na linahifadhi msisitizo wa ghafla wa tamko.
- source_word: ἕστηκα
  choice: nimesimama
  rationale: Kitenzi kiko katika hali timilifu yenye maana ya hali inayoendelea sasa. “Nimesimama” kinaonyesha kwamba msemaji amechukua nafasi mlangoni na bado yupo hapo.
- source_word: ἐπὶ τὴν θύραν
  choice: mlangoni
  rationale: Hii ndiyo kauli ya asili katika Kiswahili kwa kueleza kuwa mtu yuko kwenye nafasi ya kuingilia, bila kutafsiri kihalisi kuwa yuko juu ya mlango.
- source_word: κρούω
  choice: ninabisha
  rationale: Wakati wa sasa unaonyesha tendo linaloendelea. “Ninabisha” linaweka wazi kwamba kubisha kunaendelea sambamba na kusimama mlangoni.
- source_word: ἐάν τις
  choice: Mtu yeyote aki-
  rationale: Muundo huu wa sharti ni wa asili katika Kiswahili na unahifadhi mwaliko ulio wazi kwa mtu yeyote bila kuingiza tofauti ya kijinsia.
- source_word: ἀκούσῃ τῆς φωνῆς μου
  choice: akiisikia sauti yangu
  rationale: φωνή hapa ni “sauti,” na kitenzi “kusikia” hakiongezi wazo la kutii ambalo halijasemwa wazi katika kirai hiki.
- source_word: ἀνοίξῃ τὴν θύραν
  choice: na kuufungua mlango
  rationale: Muundo unaendelea chini ya sharti la “aki-” na kutoa kwa uwazi tendo la kufungua mlango.
- source_word: καὶ εἰσελεύσομαι πρὸς αὐτόν
  choice: nitaingia kwake
  rationale: “Kwake” linahifadhi mwelekeo wa kibinafsi wa πρὸς αὐτόν; si kuingia tu mahali pasipotajwa, bali kuingia kwa mtu huyo.
- source_word: δειπνήσω
  choice: kula chakula
  rationale: Kitenzi kinamaanisha kula mlo mkuu, mara nyingi wa jioni. “Kula chakula” ni cha asili na kinaeleweka kwa upana katika Afrika Mashariki bila kulazimisha aina maalumu ya mlo.
- source_word: μετ’ αὐτοῦ καὶ αὐτὸς μετ’ ἐμοῦ
  choice: pamoja naye, naye pamoja nami
  rationale: Muundo huu unahifadhi usemi uliodondoshwa katika sehemu ya pili na kusisitiza ushirika wa pande zote bila kuongeza maneno yasiyokuwapo.
theological_decisions:
- issue: Taswira ya kula pamoja kama ushirika
  choice: Taswira imetafsiriwa moja kwa moja kuwa kula chakula pamoja, bila kuitambulisha kwa ibada au hatua fulani ya kiroho.
  alternative: Kuifanya irejelee hasa Meza ya Bwana, kuongoka, au kurejeshwa kwa ushirika na mwamini au kanisa.
  rationale: Andiko linaonyesha ukaribu na ushirika wa pande zote, lakini halisemi wazi ikiwa mlo huo ni Meza ya Bwana, mwanzo wa imani, au ushirika uliorejeshwa. Tafsiri haifungi maana kwenye fasiri moja.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Tazama” kinadumisha mwito wa usikivu wa maandiko bila kuwa kigumu, huku “mlangoni,” “ninabisha,” na “kula chakula pamoja” vikiwa vya kawaida na vinavyoeleweka kwa wasomaji wengi. Muundo wa mwisho unahifadhi msisitizo wa ushirika wa pande zote.
