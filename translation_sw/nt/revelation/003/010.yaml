id: REV.3.10
reference: Revelation 3:10
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὅτι ἐτήρησας τὸν λόγον τῆς ὑπομονῆς μου, κἀγώ σε τηρήσω ἐκ τῆς ὥρας τοῦ πειρασμοῦ τῆς μελλούσης ἔρχεσθαι ἐπὶ τῆς οἰκουμένης ὅλης, πειράσαι τοὺς κατοικοῦντας ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/010.yaml
  text: Because you have kept my word of endurance[a], I also will keep you from the hour of testing that is about to come upon the whole inhabited world[b], to test those who dwell on the earth.
translation:
  language: sw
  text: Kwa sababu umelishika neno langu la uvumilivu[a], mimi pia nitakulinda dhidi ya saa ya kujaribiwa[b] inayokaribia kuja juu ya ulimwengu wote unaokaliwa na watu, ili kuwajaribu wale wanaokaa duniani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “neno kuhusu uvumilivu wangu,” au, “ujumbe wangu unaowataka mvumilie.” Kirai cha Kigiriki kinaweza kueleweka kwa njia kadhaa zinazohusiana kwa karibu.
    reason: lexical_alternative
  - marker: b
    text: Au, “nitakuhifadhi katika saa ya kujaribiwa,” au, “nitakuepusha na saa ya kujaribiwa.” Kigiriki hutumia usemi wenye maana ya “nitakulinda kutoka/mbali na,” na usemi huo peke yake hauamui jinsi ulinzi huu utakavyotokea.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐτήρησας
  choice: umelishika
  rationale: Wakati timilifu wa Kiswahili unaonyesha tendo lililotimizwa lenye umuhimu wa sasa; ‘kushika’ pia huhifadhi uhusiano wa kitenzi na τηρήσω baadaye katika mstari.
- source_word: τὸν λόγον τῆς ὑπομονῆς μου
  choice: neno langu la uvumilivu
  rationale: 'Tafsiri hii iliyo karibu na muundo wa Kigiriki huhifadhi utata wa kirai cha umilikaji: kinaweza kumaanisha neno linalohusu uvumilivu wa Yesu, neno linalotaka uvumilivu, au neno lenye sifa ya uvumilivu.'
- source_word: κἀγώ
  choice: mimi pia
  rationale: 'Huwasilisha mkazo na ulinganifu wa ahadi: kwa sababu wao wamelishika neno, yeye pia atawalinda.'
- source_word: τηρήσω ἐκ
  choice: nitakulinda na
  rationale: ‘Kulinda na’ ni usemi wa kawaida wa Kiswahili unaokaribia maana ya kulinda dhidi ya au kutokana na jambo, bila kuamua kama ulinzi huo ni kuondolewa kabla ya kipindi hicho au kuhifadhiwa ndani yake.
- source_word: ὥρας
  choice: saa
  rationale: Neno la moja kwa moja ‘saa’ limehifadhiwa kwa kuwa linafaa katika lugha ya kinabii, ingawa hapa linaweza kuashiria kipindi cha wakati.
- source_word: πειρασμοῦ
  choice: kujaribiwa
  rationale: Huhifadhi maana pana ya kupimwa au kujaribiwa bila kuibana kuwa kishawishi cha kimaadili.
- source_word: τῆς μελλούσης ἔρχεσθαι
  choice: inayokaribia kuja
  rationale: Huwasilisha nguvu ya matarajio au ukaribu wa μέλλω pamoja na kitenzi-jina.
- source_word: ἐπὶ τῆς οἰκουμένης ὅλης
  choice: juu ya ulimwengu wote unaokaliwa na watu
  rationale: Huhifadhi tofauti ya οἰκουμένη kama ulimwengu unaokaliwa na watu, badala ya ulimwengu wote kwa maana ya maumbile yote.
- source_word: πειράσαι
  choice: ili kuwajaribu
  rationale: ‘Ili’ huonyesha kusudi la kuja kwa kipindi hicho, na ‘kuwajaribu’ hudumisha uhusiano wa kileksia na πειρασμοῦ.
- source_word: τοὺς κατοικοῦντας ἐπὶ τῆς γῆς
  choice: wale wanaokaa duniani
  rationale: Huhifadhi muundo wa kitenzi wa usemi unaorudiwa katika Ufunuo na maana yake ya kifasihi na kitheolojia.
theological_decisions:
- issue: Maana ya τηρήσω ἐκ katika muktadha wa mambo ya mwisho
  choice: nitakulinda na
  alternative: nitakuhifadhi katika kipindi hicho; nitakuepusha na kipindi hicho
  rationale: Tafsiri kuu haifungi mjadala kuhusu kuondolewa kabla ya jaribu, kuhifadhiwa wakati wa jaribu, au kuepushwa na nguvu yake. Tanbihi inaweka wazi uwezekano huo bila kuingiza mpango maalumu wa mambo ya mwisho.
- issue: Maana ya umilikaji katika τὸν λόγον τῆς ὑπομονῆς μου
  choice: neno langu la uvumilivu
  alternative: neno kuhusu uvumilivu wangu; ujumbe wangu unaowataka mvumilie
  rationale: Muundo wa Kigiriki unaruhusu maana kadhaa zinazohusiana; maandishi makuu yanahifadhi mvutano huo badala ya kuchagua maana moja pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kimaandiko bila kuwa kigumu. ‘Neno langu la uvumilivu’ na ‘saa ya kujaribiwa’ zimehifadhiwa kwa sababu ya uzito wa lugha ya Ufunuo; tanbihi zinaeleza utata halisi wa chanzo.
