  text: ἐγὼ ὅσους ἐὰν φιλῶ ἐλέγχω καὶ παιδεύω· ⸀ζήλευε οὖν καὶ μετανόησον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/019.yaml
  text: Those whom I love[a], I rebuke and discipline[c][b]. Therefore be zealous and repent.
translation:
  language: sw
  text: Wote ninaowapenda[a], mimi huwakemea na kuwaadibisha[b]. Kwa hiyo, uwe na bidii[c] na utubu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “yeyote ninayempenda.”
    reason: lexical_alternative
  - marker: b
    text: “Kuwaadibisha” hapa ni kuwapa nidhamu inayowarekebisha na kuwafundisha, si kuwaadhibu tu.
    reason: cultural_note
  - marker: c
    text: Au, “uwe na juhudi ya dhati.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγὼ
  choice: mimi
  rationale: Kiwakilishi kilicho wazi katika Kigiriki kina mkazo; ‘mimi’ kinauhifadhi kwa njia ya kawaida katika Kiswahili bila kutumia tamko zito lisilo la lazima.
- source_word: ὅσους ἐὰν
  choice: wote ninaowapenda
  rationale: Muundo huu una maana ya kundi lisiloainishwa, ‘wote ambao’ au ‘yeyote ambaye.’ ‘Wote ninaowapenda’ ni wa asili na huhifadhi upana wa usemi.
- source_word: φιλῶ
  choice: ninaowapenda
  rationale: Kitenzi kinaonyesha upendo wa kweli na wa karibu. ‘Kupenda’ ni neno la kawaida lenye uzito unaofaa, bila kulazimisha tofauti ya kitaalamu na ἀγαπάω.
- source_word: ἐλέγχω
  choice: huwakemea
  rationale: Katika muktadha huu maana ni kuwaonyesha kosa kwa lengo la kuwarekebisha. ‘Kukemea’ ni wazi na ya kawaida kuliko ‘kukanya,’ ingawa inaweza kujumuisha karipio.
- source_word: παιδεύω
  choice: kuwaadibisha
  rationale: ‘Kuadibisha’ hapa hubeba wazo la nidhamu ya kurekebisha na kufundisha, si adhabu peke yake; tanbihi inaweka maana hiyo wazi.
- source_word: ζήλευε
  choice: uwe na bidii
  rationale: Amri hii inataka juhudi ya dhati na moyo wenye hamasa. ‘Uwe na bidii’ ni Kiswahili cha kawaida na huhifadhi nguvu ya agizo.
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Huonyesha hitimisho linalotokana na kukemea na kuadibisha kwa upendo.
- source_word: μετανόησον
  choice: utubu
  rationale: ‘Kutubu’ ni tafsiri ya kawaida na sahihi katika muktadha wa mabadiliko ya kimaadili na kiroho.
theological_decisions:
- issue: Asili ya upendo unaotajwa na φιλῶ kuhusiana na marekebisho ya Mungu
  choice: Kutafsiri kama ‘kupenda’ bila kuudhoofisha kuwa hisia ya urafiki tu
  alternative: kuwa na mapenzi kwa
  rationale: Mstari unaweka kukemea na kuadibisha juu ya msingi wa upendo wa kweli. Tafsiri hii hailazimishi tofauti ya kitekniki kati ya φιλέω na ἀγαπάω.
- issue: Maana ya παιδεύω
  choice: kuwaadibisha kwa maana ya nidhamu inayorekebisha na kufundisha
  alternative: kuwaadhibu; kuwafundisha
  rationale: Neno linajumuisha malezi ya kurekebisha, si adhabu pekee wala mafundisho yasiyo na karipio. Tanbihi inalinda upana huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Mpangilio umefanywa wa asili kwa Kiswahili huku mkazo wa ἐγώ ukihifadhiwa kwa ‘mimi.’
