source:
  edition: SBLGNT
  text: Οἶδά σου τὰ ἔργα, ὅτι οὔτε ψυχρὸς εἶ οὔτε ζεστός. ὄφελον ψυχρὸς ἦς ἢ ζεστός.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/015.yaml
  text: 'I know your works: you are neither cold nor hot[a]. I wish that you were cold or hot.'
translation:
  language: sw
  text: 'Ninajua matendo yako: wewe si baridi wala moto. Laiti[a] ungekuwa baridi au moto.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Natamani ungekuwa baridi au moto.”
    reason: Mbadala wa kileksia wa ὄφελον; “laiti” na “natamani” zote huonyesha tamanio lenye nguvu.
lexical_decisions:
- source_word: Οἶδά
  choice: Ninajua
  rationale: Kitenzi οἶδα kina maana ya hali ya sasa; “ninajua” ni Kiswahili cha kawaida kinachodumisha sauti ya moja kwa moja ya tathmini.
- source_word: τὰ ἔργα
  choice: matendo yako
  rationale: “Matendo” ni tafsiri ya kawaida ya ἔργα katika kauli za tathmini za Ufunuo, na inadumisha uzito wa kimaadili bila kufafanua kupita kiasi.
- source_word: ψυχρὸς
  choice: baridi
  rationale: Neno halisi la halijoto linahifadhi sitiari na utofautishaji wake na “moto” bila kuingiza tafsiri fulani ya kiroho.
- source_word: ζεστός
  choice: moto
  rationale: “Moto” ni kinyume cha kawaida na cha asili cha “baridi” katika Kiswahili na kinahifadhi picha ya halijoto.
- source_word: ὄφελον
  choice: Laiti ungekuwa
  rationale: ὄφελον huonyesha tamanio lisiloendana na hali iliyopo; “laiti ungekuwa” ni kauli ya Kiswahili iliyo wazi na yenye nguvu inayofaa.
- source_word: ἢ
  choice: au
  rationale: “Au” huwasilisha uteuzi kati ya hali hizo mbili kwa urahisi na kwa ufasaha.
theological_decisions:
- issue: Maana ya sitiari ya halijoto (“baridi” na “moto”)
  choice: Kudumisha sitiari halisi bila kuifafanua katika maandishi makuu.
  alternative: Kufasiri “baridi” kuwa kutomwamini au kutojali kiroho na “moto” kuwa kuwa na bidii ya kiroho; au kuziona zote mbili kuwa hali zenye manufaa kwa namna tofauti.
  rationale: Mstari wenyewe haufafanui maana kamili ya hali hizi mbili. Kutumia “baridi” na “moto” huhifadhi utata na mvutano wa kitheolojia uliomo katika chanzo bila kuingiza mtazamo maalumu wa kifafanuzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo ni wa moja kwa moja na unaeleweka kwa wasomaji wa kawaida; sitiari ya halijoto imeachwa bila kufasiriwa.
