id: REV.3.9
reference: Revelation 3:9
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἰδοὺ ⸀διδῶ ἐκ τῆς συναγωγῆς τοῦ Σατανᾶ, τῶν λεγόντων ἑαυτοὺς Ἰουδαίους εἶναι, καὶ οὐκ εἰσὶν ἀλλὰ ψεύδονται— ἰδοὺ ποιήσω αὐτοὺς ἵνα ⸂ἥξουσιν καὶ προσκυνήσουσιν⸃ ἐνώπιον τῶν ποδῶν σου, καὶ γνῶσιν ὅτι ⸀ἐγὼ ἠγάπησά σε.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/009.yaml
  text: Look[a], I am giving some from the synagogue of Satan—those who call themselves Jews and are not, but are lying—look, I will make them come and bow down before your feet[b], and they will know that I have loved you.
translation:
  language: sw
  text: Tazama, ninatoa baadhi ya watu kutoka katika sinagogi la Shetani[a]—wale wanaojiita Wayahudi, lakini si Wayahudi, bali wanasema uongo—tazama, nitawafanya waje na kuinama kifudifudi mbele ya miguu yako,[b] nao watajua kwamba nimekupenda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watu wa sinagogi la Shetani.” Kigiriki kinasema kihalisi, “ninatoa kutoka katika sinagogi la Shetani,” jambo ambalo huenda linamaanisha kwamba baadhi ya watu kutoka katika kundi hilo watafanywa waje.
    reason: lexical_alternative
  - marker: b
    text: Au, “kusujudu mbele ya miguu yako.” Kitenzi cha Kigiriki kinaweza kumaanisha “kuinama kifudifudi” au “kuabudu”; hapa “kuinama kifudifudi” limetumiwa ili kuepuka kudokeza kwamba waamini wanapokea ibada ya kimungu.
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: Tazama
  rationale: Ni neno la kawaida na lenye hadhi la kuvuta usikivu; limerudiwa mara mbili kama katika Kigiriki.
- source_word: διδῶ ἐκ τῆς συναγωγῆς τοῦ Σατανᾶ
  choice: ninatoa baadhi ya watu kutoka katika sinagogi la Shetani
  rationale: Wakati uliopo wa διδῶ umehifadhiwa kwa “ninatoa.” “Baadhi ya watu” linakamilisha sentensi kwa Kiswahili huku likihifadhi maana ya ἐκ kwamba watu fulani kutoka katika kundi hilo ndio wanaolengwa, si lazima kundi lote.
- source_word: συναγωγῆς
  choice: sinagogi
  rationale: Neno hili linataja mahali au jumuiya ya Kiyahudi na ndilo neno mahususi linaloeleweka katika muktadha huu.
- source_word: τῶν λεγόντων ἑαυτοὺς Ἰουδαίους εἶναι
  choice: wale wanaojiita Wayahudi
  rationale: “Wanaojiita” linaonyesha kwa njia ya kawaida dai lao wenyewe kama lilivyo katika muundo wa Kigiriki.
- source_word: καὶ οὐκ εἰσὶν ἀλλὰ ψεύδονται
  choice: lakini si Wayahudi, bali wanasema uongo
  rationale: Neno “Wayahudi” limerudiwa kwa uwazi wa Kiswahili bila kuongeza ufafanuzi wa aina ya utambulisho unaokanushwa; upinzani mkali wa sentensi umehifadhiwa.
- source_word: ποιήσω αὐτοὺς ἵνα ἥξουσιν
  choice: nitawafanya waje
  rationale: Huhifadhi nguvu ya kusababisha ya ποιήσω na tendo la kuja la ἥξουσιν kwa Kiswahili cha kawaida.
- source_word: προσκυνήσουσιν
  choice: kuinama kifudifudi
  rationale: Kitenzi kinaweza kumaanisha kusujudu kwa ibada au kujiangusha chini kwa heshima. Hapa tafsiri inaonyesha tendo la mwili bila kudokeza moja kwa moja kwamba waamini wanapokea ibada ya kimungu.
- source_word: ἐνώπιον τῶν ποδῶν σου
  choice: mbele ya miguu yako
  rationale: Ni tafsiri ya karibu ya kirai cha Kigiriki na inadumisha picha yake wazi.
- source_word: γνῶσιν ὅτι ἐγὼ ἠγάπησά σε
  choice: watajua kwamba nimekupenda
  rationale: “Watajua” linaonyesha matokeo yaliyokusudiwa; “nimekupenda” linaendeleza tendo la wakati uliopita lenye umuhimu wa sasa.
theological_decisions:
- issue: Maana ya “wale wanaojiita Wayahudi, lakini si Wayahudi”
  choice: Kauli kali ya matini imehifadhiwa bila kufafanua kama ni kukanusha asili ya kikabila au dai kuhusu utambulisho wa agano.
  alternative: Kuitafsiri wazi kuwa ufafanuzi wa “Myahudi wa kiroho,” au kuwa kukanusha asili ya Kiyahudi.
  rationale: Kigiriki kinatoa hukumu kali lakini hakielezi hapa aina kamili ya ukanushaji. Tafsiri haipaswi kuongeza madai dhidi ya Wayahudi ambayo hayajasemwa na mstari wenyewe.
- issue: Nguvu ya προσκυνήσουσιν mbele ya miguu ya mwamini
  choice: kuinama kifudifudi
  alternative: kusujudu au kuabudu mbele ya miguu yako
  rationale: Chaguo hili linahifadhi ishara ya kujinyenyekeza au kutoa heshima, huku likiepuka kudokeza bila lazima kwamba ibada ya kimungu inatolewa kwa mwamini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inadumisha marudio ya “Tazama,” ukali wa lugha ya asili, na sintaksia inayosomeka kwa wasomaji wa kawaida bila kupanua madai yake ya kitheolojia.
