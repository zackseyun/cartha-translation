  source_fidelity: 'Tafsiri inafuata kwa uaminifu muundo na maana ya Kigiriki: marudio ya “Tazama,” wakati uliopo wa διδῶ, nguvu ya sehemu ya ἐκ kwa “baadhi ya watu,” dai la “wanaojiita Wayahudi,” kauli kali “si Wayahudi, bali wanasema uongo,” pamoja na matokeo ya kuja, kuinama mbele ya miguu, na kutambua upendo wa Kristo. Kurudiwa kwa “Wayahudi” baada ya “si” ni ufafanuzi wa kisintaksia unaokubalika katika Kiswahili, wala hakuamui kwa ziada aina ya utambulisho unaokanushwa.'
