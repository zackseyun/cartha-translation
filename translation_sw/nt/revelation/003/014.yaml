id: REV.3.14
reference: Revelation 3:14
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ τῷ ἀγγέλῳ τῆς ἐν Λαοδικείᾳ ἐκκλησίας γράψον· Τάδε λέγει ὁ Ἀμήν, ὁ μάρτυς ὁ πιστὸς ⸀καὶ ἀληθινός, ἡ ἀρχὴ τῆς κτίσεως τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/014.yaml
  text: 'And write to the angel of the church in Laodicea: These things says the Amen[a], the faithful and true witness[b], the beginning of the creation of God.'
translation:
  language: sw
  text: '“Na kwa malaika[a] wa kanisa lililoko Laodikia andika: ‘Haya ndiyo asemayo yeye aliye Amina, Shahidi mwaminifu na wa kweli, Mwanzo[b] wa uumbaji wa Mungu.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mjumbe” wa kanisa lililoko Laodikia.
    reason: lexical_alternative
  - marker: b
    text: Au “Chanzo/asili ya uumbaji wa Mungu,” au “Mtawala wa uumbaji wa Mungu.” Neno la Kiyunani archē linaweza kumaanisha “mwanzo,” “asili/chanzo,” au “mtawala.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: malaika
  rationale: Neno hili linaweza kumaanisha malaika wa mbinguni au mjumbe wa kibinadamu. Katika muundo unaorudiwa wa ujumbe kwa makanisa saba katika Ufunuo, “malaika” ndilo chaguo la kawaida zaidi; uwezekano wa “mjumbe” umeonyeshwa katika tanbihi.
- source_word: Τάδε λέγει
  choice: Haya ndiyo asemayo
  rationale: Hii inadumisha mtindo rasmi wa tangazo la kinabii huku ikibaki ya asili na inayoeleweka katika Kiswahili.
- source_word: ὁ Ἀμήν
  choice: yeye aliye Amina
  rationale: “Amina” limehifadhiwa kama jina la cheo la kipekee, lenye maana ya uthabiti na ukweli, badala ya kufafanuliwa na hivyo kupoteza mwangwi wake wa Kiebrania na matumizi yake ya kiibada.
- source_word: μάρτυς
  choice: Shahidi
  rationale: “Shahidi” ni tafsiri ya kawaida na ya asili, na inadumisha maana za kutoa ushuhuda na kuthibitisha ukweli.
- source_word: πιστὸς
  choice: mwaminifu
  rationale: “Mwaminifu” linaonyesha uaminifu wa binafsi na kutegemeka kunakokusudiwa katika cheo hiki.
- source_word: ἀληθινός
  choice: wa kweli
  rationale: “Wa kweli” linaeleweka kwa urahisi na linaonyesha kile kilicho halisi na kinacholingana kikamilifu na ukweli.
- source_word: ἀρχὴ
  choice: Mwanzo
  rationale: Neno la Kiyunani linaweza kumaanisha mwanzo, asili au chanzo, na katika mazingira fulani mtawala. “Mwanzo” ndiyo tafsiri ya moja kwa moja zaidi na haiondoi mvutano wa kitafsiri uliomo.
- source_word: κτίσεως
  choice: uumbaji
  rationale: “Uumbaji” ni tafsiri ya moja kwa moja ya κτίσις na inafaa kwa muundo huu wa sentensi.
- source_word: τοῦ θεοῦ
  choice: wa Mungu
  rationale: Muundo wa umilikishi umetafsiriwa kwa njia rahisi na ya moja kwa moja bila kuongeza ufafanuzi.
theological_decisions:
- issue: Maana ya ἡ ἀρχὴ τῆς κτίσεως τοῦ θεοῦ kama cheo kinachomhusu Kristo
  choice: Mwanzo wa uumbaji wa Mungu
  alternative: Chanzo/asili ya uumbaji wa Mungu; au Mtawala wa uumbaji wa Mungu
  rationale: Kwa kuwa ἀρχή lina maana kadhaa na kifungu hiki kimekuwa na mjadala wa kiteolojia, matini kuu inadumisha tafsiri ya moja kwa moja “Mwanzo” badala ya kuamua kimya-kimya kuwa ni “Chanzo” au “Mtawala.” Tanbihi inaweka wazi maana nyingine zinazowezekana bila kuingiza msimamo wa kimadhehebu katika matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa heshima, wa sasa na unaosomeka kwa urahisi. Herufi kubwa katika “Shahidi” na “Mwanzo” zinaonyesha matumizi yake kama vyeo katika mfululizo huu, bila kuongeza dai la kitafsiri. Alama za tanbihi zimepangwa kulingana na mahali zinapotokea katika matini ya Kiswahili.
