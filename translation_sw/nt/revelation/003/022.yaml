  yaml_path: translation/nt/revelation/003/022.yaml
  text: The one who has an ear[b][a], let him hear what the Spirit says to the churches.
translation:
  language: sw
  text: Yeye aliye na sikio, na asikie[a] yale ambayo Roho[b] anayaambia makanisa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yeyote aliye na sikio, asikie.”
    reason: lexical_alternative
  - marker: b
    text: 'Kiyunani: “roho”; hapa muktadha unaonyesha kuwa anayelengwa ni Roho Mtakatifu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἔχων
  choice: Yeye aliye na
  rationale: Kirai chenye kibainishi na kitenzi-jina cha wakati uliopo kinatumika kama nomino. “Yeye aliye na” kinadumisha umoja na maana ya mtu anayewakilisha wote, kwa Kiswahili cha kawaida na chenye heshima.
- source_word: οὖς
  choice: sikio
  rationale: Nomino ya Kiyunani iko katika umoja. Kiswahili pia huweza kutumia umoja katika wito huu wa kisitiari wa kuwa tayari kusikiliza na kuelewa.
- source_word: ἀκουσάτω
  choice: na asikie
  rationale: Ni amri ya nafsi ya tatu, umoja. “Na asikie” ni namna ya kawaida ya Kiswahili ya kutoa wito au amri kwa nafsi ya tatu bila kuifanya kuwa ushauri dhaifu tu.
- source_word: τί
  choice: yale ambayo
  rationale: Hutambulisha maudhui yanayopaswa kusikiwa. “Yale ambayo” ni ya asili katika sentensi hii na inakubaliana na ujumbe unaoelekezwa kwa makanisa.
- source_word: τὸ πνεῦμα
  choice: Roho
  rationale: Katika kibwagizo hiki cha Ufunuo 2–3, muktadha humtambulisha anayesema kuwa Roho Mtakatifu. Herufi kubwa huonyesha rejeo hilo bila kuongeza neno lisilokuwamo katika mstari.
- source_word: λέγει
  choice: anayaambia
  rationale: Kitenzi cha wakati uliopo kinaonyesha usemi wa Roho unaoelekezwa kwa wapokeaji. “Anayaambia” ni Kiswahili cha kawaida na huweka wazi uhusiano na makanisa.
- source_word: ταῖς ἐκκλησίαις
  choice: makanisa
  rationale: Hali ya dative inaonyesha wapokeaji wa maneno ya Roho. “Makanisa” ni neno lililozoeleka na linalofaa kwa makusanyiko yanayoandikiwa katika Ufunuo 2–3.
theological_decisions:
- issue: Umoja wa usemi unaomwakilisha kila msikilizaji
  choice: Yeye aliye na sikio, na asikie
  alternative: Yeyote aliye na sikio, asikie
  rationale: Kiyunani kina umoja wa kisarufi na usemi wake unamhusu kila mtu kwa uwakilishi. Tafsiri iliyochaguliwa inadumisha umbo hilo bila kulibadili kuwa wingi.
- issue: Rejeo la τὸ πνεῦμα
  choice: Roho
  alternative: roho
  rationale: Katika kibwagizo cha ujumbe kwa makanisa, muktadha unaonyesha kuwa huyu ni Roho Mtakatifu. Kuandika “Roho” kwa herufi kubwa hudhihirisha rejeo hilo la kimuktadha huku kukidumisha kifupi cha asili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Umoja wa “sikio” na nguvu ya amri ya nafsi ya tatu vimedumishwa; mtindo wa kibwagizo cha makanisa umehifadhiwa.
