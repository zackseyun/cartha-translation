  text: γίνου γρηγορῶν, καὶ στήρισον τὰ λοιπὰ ἃ ⸂ἔμελλον ἀποθανεῖν⸃, οὐ γὰρ εὕρηκά σου ⸀τὰ ἔργα πεπληρωμένα ἐνώπιον τοῦ θεοῦ μου·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/002.yaml
  text: Wake up, and strengthen what remains, which was about to die, for I have not found your works completed in the sight of my God.
translation:
  language: sw
  text: Amka, uimarishe yaliyobaki yaliyokuwa karibu kufa, kwa maana sijazikuta kazi zako zimekamilika mbele ya Mungu wangu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γίνου γρηγορῶν
  choice: Amka
  rationale: Kirai hiki kihalisi kina wazo la kuwa macho au kukesha, lakini katika muktadha wa hali ya kiroho ya Sardisi, amri ya asili ina nguvu ya ‘amka’; tafsiri hii ni ya kawaida na ya moja kwa moja katika Kiswahili.
- source_word: στήρισον
  choice: uimarishe
  rationale: Huwasilisha wazo la kufanya yaliyobaki yawe imara na thabiti.
- source_word: τὰ λοιπά
  choice: yaliyobaki
  rationale: Inahifadhi hali ya jumla ya nomino ya Kigiriki bila kuongeza kwa kubainisha ni watu, mambo, au kazi zipi zilizobaki.
- source_word: ἔμελλον ἀποθανεῖν
  choice: yalikuwa karibu kufa
  rationale: Hutoa kwa kawaida dhana ya jambo lililokaribia kufa, huku wakati uliopita ukihifadhiwa.
- source_word: πεπληρωμένα
  choice: zimekamilika
  rationale: Huwakilisha tendo lililofikishwa kwenye ukamilifu; umbo la hali timilifu linaonyesha tathmini ya sasa ya kazi hizo.
- source_word: ἐνώπιον τοῦ θεοῦ μου
  choice: mbele za Mungu wangu
  rationale: Ni usemi wa kawaida na wenye heshima unaohifadhi mtazamo wa hukumu au tathmini mbele ya Mungu.
theological_decisions:
- issue: Utambulisho wa ‘yaliyobaki’
  choice: yaliyobaki
  alternative: watu waliobaki / mambo yaliyobaki
  rationale: Neuta ya wingi τὰ λοιπά inaweza kuelekeza kwa vitu, hali, au kwa ujumla kile kilichosalia. Kutobainisha kunahifadhi utata wa matini.
- issue: Maana ya kazi kutokamilika mbele za Mungu
  choice: sijazikuta kazi zako zimekamilika
  alternative: sijaziona kazi zako kuwa kamilifu
  rationale: Tafsiri iliyochaguliwa inaweka mkazo katika kutofikishwa kwa kazi kwenye ukamilifu bila kuamua iwapo tatizo ni kiwango cha maadili, nia, au kutotimizwa kwa wajibu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi na chenye hadhi. Amri zimetolewa kwa umoja kama katika Kigiriki, na mpangilio wa sentensi umehifadhi uzito wa onyo la asili.
