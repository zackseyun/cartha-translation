id: REV.3.18
reference: Revelation 3:18
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: συμβουλεύω σοι ἀγοράσαι ⸂παρ’ ἐμοῦ χρυσίον⸃ πεπυρωμένον ἐκ πυρὸς ἵνα πλουτήσῃς, καὶ ἱμάτια λευκὰ ἵνα περιβάλῃ καὶ μὴ φανερωθῇ ἡ αἰσχύνη τῆς γυμνότητός σου, καὶ κολλούριον ⸀ἐγχρῖσαι τοὺς ὀφθαλμούς σου ἵνα βλέπῃς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/018.yaml
  text: I counsel you to buy from me gold refined by fire so that you may become rich[a], and white garments so that you may clothe yourself and the shame of your nakedness may not be exposed[c][b], and eye salve to anoint your eyes so that you may see.
translation:
  language: sw
  text: Nakushauri ununue kwangu dhahabu iliyosafishwa kwa moto ili upate kuwa tajiri,[a] na mavazi meupe ili ujivike, na aibu ya uchi wako isionekane,[b] na dawa ya macho ili upake dawa hiyo machoni, upate kuona.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ili uwe tajiri.”
    reason: lexical_alternative
  - marker: b
    text: Au “na fedheha ya uchi wako isifichuliwe.”
    reason: lexical_alternative
  - marker: c
    text: “Dawa ya macho” hapa ni dawa iliyotumiwa kwa kupakwa machoni.
    reason: cultural_note
lexical_decisions:
- source_word: συμβουλεύω
  choice: Nakushauri
  rationale: Kitenzi hiki kinaonyesha shauri lenye uzito kutoka kwa msemaji; “nakushauri” ni Kiswahili cha kawaida na chenye hadhi.
- source_word: ἀγοράσαι παρ’ ἐμοῦ
  choice: ununue kwangu
  rationale: Huhifadhi taswira ya kununua na huonyesha wazi kwamba msemaji ndiye chanzo cha vitu hivyo.
- source_word: χρυσίον πεπυρωμένον ἐκ πυρός
  choice: dhahabu iliyosafishwa kwa moto
  rationale: Huhifadhi taswira ya kuyeyusha na kuondoa uchafu kwa moto; usemi huu ni wa kawaida katika Kiswahili.
- source_word: ἵνα πλουτήσῃς
  choice: ili upate kuwa tajiri
  rationale: “Upate kuwa” huonyesha kuingia katika hali ya utajiri, kwa kufuatia nguvu inayowezekana ya kitenzi cha Kigiriki.
- source_word: ἱμάτια λευκά
  choice: mavazi meupe
  rationale: “Mavazi” ni neno pana linalolingana na ἱμάτια bila kulibana kuwa majoho pekee.
- source_word: ἵνα περιβάλῃ
  choice: ili ujivike
  rationale: Umbo la kujirejelea la “ujivike” linaakisi vizuri hali ya kati ya kitenzi cha Kigiriki.
- source_word: μὴ φανερωθῇ ἡ αἰσχύνη τῆς γυμνότητός σου
  choice: aibu ya uchi wako isionekane
  rationale: Tafsiri hii ni ya moja kwa moja na ya asili, huku ikihifadhi uhusiano kati ya uchi na aibu.
- source_word: κολλούριον
  choice: dawa ya macho
  rationale: Neno hili lilitaja dawa iliyopakwa machoni; “dawa ya macho” linaeleweka kwa urahisi katika Kiswahili cha sasa.
- source_word: ἐγχρῖσαι τοὺς ὀφθαλμούς σου
  choice: ili uyapake macho yako
  rationale: Katika muktadha wa dawa, “kupaka” hutoa maana halisi ya kutumia dawa kwa kuipaka, bila kuingiza wazo la ibada lisilotajwa wazi.
- source_word: ἵνα βλέπῃς
  choice: upate kuona
  rationale: Huhifadhi kusudi la kupakwa dawa na pia huacha taswira hiyo wazi kwa maana yake ya kiishara.
theological_decisions:
- issue: Maana ya kiishara ya dhahabu, mavazi meupe, na dawa ya macho
  choice: Taswira zimehifadhiwa bila kufafanuliwa ndani ya mstari.
  alternative: Kuzitafsiri moja kwa moja kuwa utajiri wa kiroho, haki au usafi, na utambuzi wa kiroho.
  rationale: Andiko la Kigiriki halifafanui hapa kwa uwazi kila kitu kinachowakilishwa na bidhaa hizo; kutunza taswira kunalinda uwazi na mvutano wa andiko.
- issue: Mwangwi unaowezekana wa ἐγχρῖσαι
  choice: Kutumia “kupaka” katika muktadha wa dawa.
  alternative: Kutumia “kutia mafuta” au “kupaka mafuta,” jambo ambalo lingeweza kusikika kama tendo rasmi la kidini.
  rationale: “Kupaka” hutoa tendo la kimatibabu linalotajwa na kitenzi bila kuingiza maana ya kisakramenti, huku ishara ya kuona ikibaki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inahifadhi mfuatano wa mashauri matatu na taswira zake bila kuongeza ufafanuzi wa kimadhehebu.
