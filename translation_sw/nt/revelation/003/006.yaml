  text: The one who has an ear[a], let him hear what the Spirit says to the churches.
translation:
  language: sw
  text: Yeyote aliye na sikio[a], na asikie kile ambacho Roho anasema kwa makanisa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kigiriki: “Yule aliye na sikio, na asikie.” Muundo wa umoja wa kiume katika Kigiriki ni himizo la jumla linaloelekezwa kwa mtu yeyote.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἔχων
  choice: Yeyote aliye na
  rationale: Kirai chenye nomino iliyodokezwa, kihalisi ‘yule aliye na,’ kinatoa wito wa jumla kwa kila mtu. ‘Yeyote aliye na’ ni Kiswahili cha kawaida na hudumisha maana hiyo bila kuufanya wito uhusu wanaume pekee.
- source_word: οὖς
  choice: sikio
  rationale: Umoja wa Kigiriki umehifadhiwa. Ingawa ‘masikio’ ingekuwa nahau laini zaidi kwa Kiswahili, ‘sikio’ hudumisha muundo wa kimethali wa chanzo.
- source_word: ἀκουσάτω
  choice: na asikie
  rationale: Amri ya nafsi ya tatu umoja imetafsiriwa kwa muundo wa Kiswahili wa kuhimiza, ‘na asikie,’ unaohifadhi nguvu ya wito bila kuzidisha kuwa lazima.
- source_word: τί
  choice: yale ambayo
  rationale: Katika Kiswahili, ‘yale ambayo’ huwasilisha kwa kawaida maudhui ya kile kinachosemwa na kukubaliana na ngeli ya mambo yaliyodokezwa.
- source_word: τὸ πνεῦμα
  choice: Roho
  rationale: Muktadha wa kiitikio kinachorudiwa katika Ufunuo 2–3 unaelekeza kwa Roho Mtakatifu; herufi kubwa inaonyesha rejeo hilo bila kuongeza jina lisilokuwapo katika mstari.
- source_word: λέγει
  choice: anayaambia
  rationale: Kitenzi cha wakati wa sasa kimetolewa kwa kauli ya kawaida inayofaa Kiswahili. Muundo huu unaonyesha Roho akielekeza ujumbe kwa makanisa.
- source_word: ταῖς ἐκκλησίαις
  choice: makanisa
  rationale: Hili ndilo neno la kawaida la Agano Jipya kwa jumuiya za waamini na linafaa kwa makanisa saba ya Ufunuo.
theological_decisions:
- issue: Rejeo la τὸ πνεῦμα
  choice: Roho, yaani Roho Mtakatifu
  alternative: roho fulani
  rationale: Katika kiitikio kinachorudiwa katika Ufunuo 2–3, Roho ndiye anayesema kwa makanisa kupitia ujumbe wa kinabii. Herufi kubwa inaashiria rejeo hili linalowezekana sana.
- issue: Umoja wa jumla katika himizo
  choice: Yeyote aliye na sikio, na asikie
  alternative: Wenye masikio, na wasikie
  rationale: Chanzo kina kishiriki na amri katika umoja wa jumla. Tafsiri inadumisha umoja na wakati huohuo ‘yeyote’ inaonyesha wazi kwamba wito unamhusu kila mtu, si wanaume tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ‘na asikie’ hudumisha sauti ya himizo la kimethali; ‘Yeyote’ huweka wazi matumizi ya jumla. Alama ya tanbihi [a] imewekwa baada ya ‘sikio’.
