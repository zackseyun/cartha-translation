id: REV.8.6
reference: Revelation 8:6
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ οἱ ἑπτὰ ἄγγελοι οἱ ἔχοντες τὰς ἑπτὰ σάλπιγγας ἡτοίμασαν ⸀αὑτοὺς ἵνα σαλπίσωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/006.yaml
  text: And the seven angels who had the seven trumpets prepared themselves to sound them[a].
translation:
  language: sw
  text: Kisha wale malaika saba waliokuwa na tarumbeta saba wakajiandaa kuzipiga[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuzipuliza.” Kitenzi cha Kigiriki humaanisha kutoa sauti kwa tarumbeta.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄγγελοι
  choice: malaika
  rationale: Katika muktadha huu wa maono ya Ufunuo, neno hili linamaanisha viumbe wa mbinguni, si wajumbe wa kibinadamu.
- source_word: ἔχοντες
  choice: waliokuwa na
  rationale: Kishiriki cha wakati uliopo kimewasilishwa kwa kishazi rejeshi cha asili katika Kiswahili, kikionyesha kwamba walikuwa na tarumbeta hizo.
- source_word: σάλπιγγας
  choice: tarumbeta
  rationale: Hili ndilo neno la kawaida na linaloeleweka kwa ala zinazotajwa katika picha hii ya kinabii.
- source_word: ἡτοίμασαν αὑτοὺς
  choice: wakajiandaa
  rationale: Kitenzi cha kujirejelea kinaonyesha wazi kwamba malaika walijiweka tayari; ‘wakajiandaa’ ni cha asili na chenye hadhi katika Kiswahili.
- source_word: ἵνα σαλπίσωσιν
  choice: kuzipiga
  rationale: Muundo wa kusudi umeonyeshwa kwa ‘ku-’; kiambishi ‘-zi-’ kinarejelea tarumbeta saba, na ‘kupiga tarumbeta’ ni usemi wa kawaida wa Kiswahili kwa kuzitoa sauti.
theological_decisions:
- issue: Maana ya ἄγγελοι katika muktadha wa maono
  choice: malaika wa mbinguni
  alternative: wajumbe wa kibinadamu
  rationale: Mandhari ya Ufunuo 8 na kukabidhiwa kwao tarumbeta saba yanaunga mkono wazi maana ya malaika wa mbinguni bila kuongeza dai jingine la kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Kisha’ huendeleza simulizi kwa kawaida; ‘wakajiandaa kuzipiga’ ni fupi na ya asili huku ikihifadhi kusudi la ἵνα.
