  text: Καὶ ⸀ὅταν ἤνοιξεν τὴν σφραγῖδα τὴν ἑβδόμην, ἐγένετο σιγὴ ἐν τῷ οὐρανῷ ὡς ἡμιώριον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/001.yaml
  text: And when he opened the seventh seal[b][a], there was silence in heaven for about half an hour.
translation:
  language: sw
  text: Alipofungua[a] muhuri wa saba, kukawa na ukimya mbinguni kwa muda wa karibu nusu saa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alipouvunja na kuufungua muhuri wa saba.” Kigiriki husema tu, “alipofungua muhuri wa saba.”
    reason: lexical_alternative
  - marker: b
    text: Au, “ukimya ukatokea mbinguni kwa muda wa karibu nusu saa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: alipofungua
  rationale: Katika simulizi hili la tukio moja maalumu, ὅταν linaeleza wakati; muundo wa Kiswahili “alipofungua” ni wa kawaida na huhifadhi maana hiyo bila kudokeza kurudiwa-rudiwa.
- source_word: ἤνοιξεν
  choice: alipofungua
  rationale: ἀνοίγω maana yake ya msingi ni “fungua.” Tafsiri hii haiongezi wazo la kuvunja muhuri, ingawa tendo hilo linaweza kueleweka katika muktadha.
- source_word: σφραγῖδα
  choice: muhuri
  rationale: σφραγίς ni “muhuri,” neno linalofaa kwa kila kifungo kilichowekwa kwenye hati-kunjo katika muktadha wa Ufunuo.
- source_word: τὴν ἑβδόμην
  choice: wa saba
  rationale: Kivumishi hiki cha ordinali kinabainisha kuwa ni muhuri wa saba.
- source_word: ἐγένετο
  choice: kukawa na
  rationale: γίνομαι hapa huonyesha kutokea kwa hali. “Kukawa na” ni Kiswahili cha asili kinachohifadhi wazo la hali kuanza kuwapo.
- source_word: σιγὴ
  choice: ukimya
  rationale: σιγή hueleza ukimya au hali ya kunyamaza; “ukimya” huhifadhi uzito wa tukio kuliko “utulivu.”
- source_word: ἐν τῷ οὐρανῷ
  choice: mbinguni
  rationale: οὐρανός hapa ni makao ya mbinguni, si anga la kawaida; “mbinguni” ndiyo usemi wa kawaida wa Kiswahili.
- source_word: ὡς
  choice: karibu
  rationale: ὡς pamoja na kipimo cha wakati huonyesha makadirio; “karibu” huwasilisha maana hiyo kwa kawaida.
- source_word: ἡμιώριον
  choice: nusu saa
  rationale: ἡμιώριον ni kipindi cha nusu saa; “nusu saa” ni usemi wa kawaida wa Kiswahili.
theological_decisions:
- issue: Mhusika asiye tajwa wazi katika ἤνοιξεν
  choice: Mhusika ameachwa bila kutajwa kwa jina kupitia muundo “alipofungua.”
  alternative: “Mwanakondoo alipofungua” au “yeye alipofungua”
  rationale: Kitenzi cha Kigiriki kina mhusika wa nafsi ya tatu umoja ambaye hatamkwi wazi na anaeleweka kutokana na muktadha kuwa Mwanakondoo. Kiswahili huruhusu muundo huu bila kuongeza jina ambalo halipo katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “kukawa na ukimya” ni wa kawaida katika simulizi na unadumisha uzito wa kimandhari. Alama zote za tanbihi zimewekwa katika matini kuu.
