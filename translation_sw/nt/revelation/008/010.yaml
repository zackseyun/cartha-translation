  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ ὁ τρίτος ἄγγελος ἐσάλπισεν· καὶ ἔπεσεν ἐκ τοῦ οὐρανοῦ ἀστὴρ μέγας καιόμενος ὡς λαμπάς, καὶ ἔπεσεν ἐπὶ τὸ τρίτον τῶν ποταμῶν καὶ ἐπὶ τὰς πηγὰς τῶν ὑδάτων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/010.yaml
  text: And the third angel sounded his trumpet[a], and a great star fell from heaven, burning like a torch[c][b], and it fell on a third of the rivers and on the springs of the waters.
translation:
  language: sw
  text: Malaika wa tatu akapiga tarumbeta, na nyota kubwa[c] ikaanguka kutoka mbinguni[a], ikiwaka kama mwenge[b], na ikaanguka juu ya theluthi moja ya mito na juu ya chemchemi za maji.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kutoka angani.” Neno la Kigiriki linaweza kumaanisha mbingu au anga; “mbinguni” limetumiwa hapa kwa sababu linafaa zaidi katika mazingira ya maono ya kiapokaliptiki.
    reason: lexical_alternative
  - marker: b
    text: Au “ikiwaka kama taa.” Neno la Kigiriki linaweza kumaanisha mwenge au taa; “mwenge” linafaa zaidi kwa picha ya nyota inayowaka na kuanguka.
    reason: lexical_alternative
  - marker: c
    text: Picha ya “nyota” haijafasiriwa kiishara. Wafafanuzi hutofautiana kuhusu kama inawakilisha kiumbe cha kimalaika, kitu kama kimondo, au mamlaka ya kiishara.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐσάλπισεν
  choice: akapiga tarumbeta
  rationale: Kitenzi σαλπίζω humaanisha kupiga au kutoa sauti kwa tarumbeta. Usemi huu ni wa kawaida katika Kiswahili na unaendeleza mfuatano wa maono.
- source_word: ἀστὴρ μέγας
  choice: nyota kubwa
  rationale: Tafsiri ya moja kwa moja inayohifadhi picha ya nyota bila kuamua kwamba ni kiumbe, kitu cha angani, au mamlaka ya mfano.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: kutoka mbinguni
  rationale: Neno οὐρανός linaweza kumaanisha mbingu au anga. “Mbinguni” linafaa kwa sajili ya kinabii na mazingira ya maono, huku uwezekano wa “angani” ukielezwa katika tanbihi.
- source_word: καιόμενος ὡς λαμπάς
  choice: ikiwaka kama mwenge
  rationale: καιόμενος huonyesha kitu kinachowaka, na λαμπάς mara nyingi ni mwenge. Usemi huu huhifadhi tashbihi wazi na kwa Kiswahili cha kawaida.
- source_word: ἔπεσεν ... καὶ ἔπεσεν
  choice: ikaanguka ... Ikaanguka
  rationale: 'Kurudia kitenzi kunahifadhi mdundo na msisitizo wa Kigiriki: kwanza kushuka kutoka mbinguni, kisha kuangukia maji duniani.'
- source_word: ἐπὶ τὸ τρίτον τῶν ποταμῶν
  choice: juu ya theluthi moja ya mito
  rationale: τὸ τρίτον katika muktadha huu ni sehemu moja kati ya tatu. “Theluthi moja ya mito” ni ya kawaida na sahihi kwa kiasi kinachotajwa.
- source_word: πηγὰς τῶν ὑδάτων
  choice: chemchemi za maji
  rationale: πηγή ni chemchemi au chanzo kinachobubujisha maji. “Chemchemi za maji” ni sahihi, wazi, na yenye hadhi katika Kiswahili cha sasa.
theological_decisions:
- issue: Kitu kinachowakilishwa na nyota inayoanguka
  choice: Picha imetafsiriwa moja kwa moja kuwa “nyota kubwa” bila kuitambulisha zaidi.
  alternative: Kiumbe cha kimalaika, kitu kama kimondo, au mtawala au mamlaka ya mfano.
  rationale: Aya yenyewe huiita nyota lakini haitoi utambulisho dhahiri wa kile inachowakilisha. Tafsiri inaacha mvutano huo wazi badala ya kuingiza fasiri fulani.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, wazi na yenye hadhi. Muundo unahifadhi urudiaji wa “ikaanguka” na picha za kiapokaliptiki bila kuzifafanua kupita maandiko.
