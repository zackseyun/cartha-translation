id: REV.8.8
reference: Revelation 8:8
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ ὁ δεύτερος ἄγγελος ἐσάλπισεν· καὶ ὡς ὄρος μέγα ⸀πυρὶ καιόμενον ἐβλήθη εἰς τὴν θάλασσαν· καὶ ἐγένετο τὸ τρίτον τῆς θαλάσσης αἷμα,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/008.yaml
  text: And the second angel sounded the trumpet[a], and something like a great mountain burning with fire was thrown into the sea, and a third of the sea became blood.
translation:
  language: sw
  text: Malaika wa pili akapiga tarumbeta, na kitu kama mlima mkubwa unaowaka moto[a] kikatupwa baharini; na theluthi moja ya bahari ikawa damu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na kama mlima mkubwa unaowaka moto”; neno la Kigiriki linaonyesha ufanano, si lazima kwamba kitu hicho kilikuwa mlima halisi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσάλπισεν
  choice: akapiga tarumbeta
  rationale: Kitenzi hiki humaanisha kupiga au kutoa sauti ya tarumbeta. Katika mfululizo huu, “akapiga tarumbeta” ni Kiswahili cha kawaida na huweka wazi ala inayodokezwa na kitenzi.
- source_word: ὡς
  choice: kitu kama
  rationale: Neno hili linaonyesha ufanano badala ya utambulisho wa moja kwa moja. “Kitu kama” hutoa sentensi ya asili katika Kiswahili huku kikihifadhi kwamba Yohana anaeleza mwonekano wa kitu hicho.
- source_word: ὄρος μέγα
  choice: mlima mkubwa
  rationale: Hii ni tafsiri ya moja kwa moja na yenye hadhi ya kirai hicho, bila kuamua kama mlima huo ulikuwa halisi au wa kiishara.
- source_word: πυρὶ καιόμενον
  choice: unaowaka moto
  rationale: Kirai hiki kinahifadhi taswira dhahiri ya kitu kinachowaka moto bila kukitambulisha kama volkano, kimondo, au ishara fulani.
- source_word: ἐβλήθη
  choice: kikatupwa
  rationale: Kauli tendwa ya Kigiriki inaonyesha kwamba kitu hicho kilitupwa. “Kikatupwa” ni ya sasa na ya kawaida, bila kuongeza nguvu inayoweza kudokezwa na “kikavurumishwa.”
- source_word: εἰς τὴν θάλασσαν
  choice: baharini
  rationale: Hii ni tafsiri ya kawaida na fupi inayoonyesha kuingia ndani ya bahari.
- source_word: τὸ τρίτον τῆς θαλάσσης
  choice: theluthi moja ya bahari
  rationale: Hii ni namna ya kawaida ya Kiswahili ya kueleza sehemu hiyo na huhifadhi kiwango cha hukumu kinachotajwa katika Ufunuo.
- source_word: αἷμα
  choice: damu
  rationale: Nomino hii humaanisha damu moja kwa moja; hakuna sababu ya kuongeza ufafanuzi wa kiishara.
theological_decisions:
- issue: Asili ya kitu kinachofanana na mlima
  choice: Kuhifadhi ulinganisho bila kukitambulisha kitu hicho kihalisi au kiishara zaidi ya maneno ya Kigiriki.
  alternative: Kukitambulisha kuwa mlima halisi, kitu kama kimondo, au ishara maalumu ya hukumu.
  rationale: Neno ὡς linaonyesha ufanano. Tafsiri haipaswi kuamua kama taswira hiyo ni halisi, ya kiishara, au yote mawili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Akapiga tarumbeta” ni usemi wa kawaida; “kitu kama” hufanya ulinganisho uwe wazi bila kutatua fumbo la maono.
