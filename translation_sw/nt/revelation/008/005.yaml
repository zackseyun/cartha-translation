id: REV.8.5
reference: Revelation 8:5
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ εἴληφεν ὁ ἄγγελος τὸν λιβανωτόν, καὶ ἐγέμισεν αὐτὸν ἐκ τοῦ πυρὸς τοῦ θυσιαστηρίου, καὶ ἔβαλεν εἰς τὴν γῆν· καὶ ἐγένοντο βρονταὶ καὶ φωναὶ καὶ ἀστραπαὶ καὶ σεισμός.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/005.yaml
  text: And the angel took the censer[a], and filled it with fire from the altar, and threw it onto the earth; and there came peals of thunder and sounds and flashes of lightning and an earthquake.
translation:
  language: sw
  text: Kisha malaika akachukua chetezo cha uvumba, akakijaza kwa moto wa madhabahu, akakitupa duniani. Kukawa na ngurumo, sauti[a], mimweko ya umeme na tetemeko la ardhi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sauti zilizotamkwa.” Neno la Kigiriki linaweza kumaanisha sauti zilizotamkwa au sauti/kelele kwa ujumla katika taswira ya uwepo wa Mungu.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴληφεν
  choice: akachukua
  rationale: Ingawa kitenzi cha Kigiriki kiko katika hali timilifu, hapa kinaendeleza mfululizo wa simulizi; wakati uliopita wa Kiswahili unatoa maana hiyo kwa kawaida bila kupoteza matokeo ya tendo.
- source_word: λιβανωτόν
  choice: chetezo cha uvumba
  rationale: Ni chombo cha ibada kilichotumiwa kufukizia uvumba na kubebea makaa; kirai hiki ni wazi zaidi kwa msomaji wa sasa kuliko ‘chetezo’ peke yake.
- source_word: ἐγέμισεν αὐτὸν ἐκ τοῦ πυρὸς τοῦ θυσιαστηρίου
  choice: akakijaza moto uliotoka madhabahuni
  rationale: Hueleza kwa Kiswahili cha kawaida kwamba moto uliowekwa katika chetezo ulitoka kwenye madhabahu, huku ikihifadhi umuhimu wa chanzo chake.
- source_word: θυσιαστηρίου
  choice: madhabahuni
  rationale: ‘Madhabahu’ ni istilahi sanifu ya Kiswahili kwa altar katika mazingira ya ibada; hali ya mahali inafaa baada ya ‘uliotoka’.
- source_word: ἔβαλεν εἰς τὴν γῆν
  choice: akakitupa duniani
  rationale: ‘Akitupa’ huhifadhi nguvu ya tendo, na ‘duniani’ huonyesha upeo mpana wa γῆ katika tukio hili la hukumu badala ya kuufanya kuwa udongo tu.
- source_word: ἐγένοντο
  choice: kukawa na
  rationale: Ni muundo wa kawaida wa Kiswahili unaoonyesha kutokea kwa ghafula kwa matukio yanayofuata.
- source_word: βρονταὶ
  choice: mingurumo ya radi
  rationale: Huwasilisha wingi wa ngurumo kwa lugha ya kawaida na ya kueleweka.
- source_word: φωναὶ
  choice: sauti
  rationale: Neno hili linaweza kumaanisha sauti kwa ujumla au sauti za watu; ‘sauti’ hudumisha kutobainika huko bila kudai kwamba kulikuwa na wasemaji.
- source_word: ἀστραπαὶ
  choice: mimweko ya umeme
  rationale: Ni usemi wa kawaida unaoonyesha kwa uwazi miale ya ghafla ya radi iliyo katika wingi.
- source_word: σεισμός
  choice: tetemeko la ardhi
  rationale: Ni tafsiri sanifu na ya kawaida ya tukio hili la kijiolojia.
theological_decisions:
- issue: Maana ya γῆ katika mazingira ya hukumu ya kiapokaliptiki
  choice: duniani
  alternative: ardhini; katika nchi
  rationale: Mandhari yana taswira ya hukumu yenye upeo mpana, na ‘duniani’ hulingana na matumizi mapana ya neno hilo katika Ufunuo bila kulibana kuwa udongo au eneo fulani.
- issue: Maana ya φωναί katika mfululizo wa ishara za uwepo wa Mungu
  choice: sauti
  alternative: sauti za watu
  rationale: Kwa kuwa hakuna wasemaji waliotajwa, ‘sauti’ huhifadhi uwezekano wa kelele au sauti zilizotamkwa bila kuamua jambo ambalo matini yenyewe haijaamua; maana nyingine imewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa sentensi ni wa moja kwa moja na wenye mwendo wa kisimulizi; istilahi ya ibada ‘chetezo cha uvumba’ imefafanuliwa ndani ya matini ili ieleweke kwa wasomaji wa kawaida.
