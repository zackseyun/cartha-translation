id: REV.8.11
reference: Revelation 8:11
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ τὸ ὄνομα τοῦ ἀστέρος λέγεται· ⸀ὁ Ἄψινθος. καὶ ἐγένετο τὸ τρίτον τῶν ὑδάτων εἰς ἄψινθον, καὶ πολλοὶ τῶν ἀνθρώπων ἀπέθανον ἐκ τῶν ὑδάτων, ὅτι ἐπικράνθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/011.yaml
  text: And the name of the star is called Wormwood[a]. And a third of the waters became wormwood, and many of the people died from the waters[b], because they had been made bitter.
translation:
  language: sw
  text: Jina la nyota hiyo huitwa Pakanga[a]. Theluthi moja ya maji ikawa pakanga, na wengi miongoni mwa watu wakafa kutokana na maji hayo[b], kwa sababu yalikuwa yamefanywa machungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Apsintho.” Neno la Kiyunani Ἄψινθος/ἄψινθον linamaanisha pakanga, mmea wenye uchungu; kurudiwa kwa neno hilo kunaunganisha jina la nyota na uchungu wa maji.
    reason: lexical_alternative
  - marker: b
    text: Kiyunani hakisemi wazi kwamba watu walikufa baada ya kuyanywa maji hayo; kinasema walikufa “kutokana na maji.”
    reason: source_clarity
lexical_decisions:
- source_word: ὄνομα τοῦ ἀστέρος
  choice: jina la nyota hiyo
  rationale: Hutoa maana ya moja kwa moja na ya asili ya jina la nyota inayotajwa katika maono.
- source_word: λέγεται
  choice: huitwa
  rationale: Ni namna ya kawaida na fasaha ya Kiswahili ya kuonyesha jina analopewa mtu au kitu, huku ikihifadhi hali ya sasa ya kitenzi cha Kiyunani.
- source_word: Ἄψινθος / ἄψινθον
  choice: Pakanga / pakanga
  rationale: Pakanga ni jina la Kiswahili lililozoeleka katika tafsiri za Biblia kwa mmea wenye uchungu unaoitwa wormwood. Kurudia neno lilelile kunahifadhi uhusiano kati ya jina la nyota na mabadiliko ya maji.
- source_word: τὸ τρίτον τῶν ὑδάτων
  choice: theluthi moja ya maji
  rationale: Ni usemi wa kawaida wa Kiswahili unaohifadhi kiwango cha sehemu moja kati ya tatu.
- source_word: ἐγένετο ... εἰς ἄψινθον
  choice: ikawa pakanga
  rationale: Inahifadhi taswira halisi ya Kiyunani ya maji kuwa pakanga badala ya kuifafanua tu kuwa maji yalikuwa machungu.
- source_word: πολλοὶ τῶν ἀνθρώπων
  choice: wengi miongoni mwa watu
  rationale: Inahifadhi maana ya mgawanyo katika Kiyunani na inaonyesha kwamba ἄνθρωποι ni watu kwa ujumla, si wanaume pekee.
- source_word: ἀπέθανον ἐκ τῶν ὑδάτων
  choice: wakafa kutokana na maji hayo
  rationale: Neno kutokana na linaonyesha chanzo au kisababishi cha vifo bila kuongeza wazo la kuyanywa, ambalo halijaelezwa wazi katika Kiyunani.
- source_word: ὅτι ἐπικράνθησαν
  choice: kwa sababu yalikuwa yamefanywa machungu
  rationale: Kiwakilishi ya- kinarejelea maji, na muundo wa kutendwa unahifadhi hali tendwa na matokeo yanayoonyeshwa na kitenzi cha Kiyunani.
theological_decisions:
- issue: Kirejelewa cha kitenzi tendwa ἐπικράνθησαν
  choice: Kitenzi kinarejelea maji yaliyofanywa machungu.
  alternative: Kitenzi kinarejelea watu kuwa na uchungu au kuugua.
  rationale: Kwa sarufi, maji ndiyo nomino ya wingi iliyo karibu zaidi; pia muktadha unaonyesha kuwa watu walikufa kutokana na maji hayo. Tafsiri haiongezi maelezo kuhusu namna walivyoyatumia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. Neno “Pakanga” limeandikwa kwa herufi kubwa kama jina la nyota, na “pakanga” kwa herufi ndogo linapotaja kilichoyapata maji.
