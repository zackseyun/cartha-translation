id: REV.8.3
reference: Revelation 8:3
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ ἄλλος ἄγγελος ἦλθεν καὶ ἐστάθη ἐπὶ τοῦ θυσιαστηρίου ἔχων λιβανωτὸν χρυσοῦν, καὶ ἐδόθη αὐτῷ θυμιάματα πολλὰ ἵνα ⸀δώσει ταῖς προσευχαῖς τῶν ἁγίων πάντων ἐπὶ τὸ θυσιαστήριον τὸ χρυσοῦν τὸ ἐνώπιον τοῦ θρόνου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/003.yaml
  text: And another angel came and stood at the altar[a], holding a golden censer[b], and much incense was given to him so that he might offer it with the prayers of all the saints on the golden altar before the throne.
translation:
  language: sw
  text: 'Malaika mwingine akaja, akasimama kwenye madhabahu, akiwa na chetezo cha dhahabu[a]. Akapewa uvumba mwingi ili autoe pamoja na sala za watakatifu wote[b] juu ya madhabahu ya dhahabu iliyo mbele ya kiti cha enzi.


    [a] Au, “chombo cha dhahabu cha kufukizia uvumba.”

    [b] Tafsiri ya neno kwa neno ni, “ili autoe kwa sala za watakatifu wote.” Katika muktadha huu, uvumba unatolewa pamoja na sala zao au unaongezwa kwenye sala hizo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “chombo cha dhahabu cha kufukizia uvumba.”
    reason: lexical_alternative
  - marker: b
    text: Tafsiri ya neno kwa neno ni, “ili autoe kwa sala za watakatifu wote.” Katika muktadha huu, uvumba unatolewa pamoja na sala zao au unaongezwa kwenye sala hizo.
    reason: alternative_reading
lexical_decisions:
- source_word: ἄλλος ἄγγελος
  choice: Malaika mwingine
  rationale: ἄλλος humtambulisha malaika wa ziada katika mfuatano, si kiumbe wa aina tofauti. Hii ni Kiswahili cha kawaida na sahihi.
- source_word: ἐστάθη ἐπὶ τοῦ θυσιαστηρίου
  choice: akasimama kwenye madhabahu
  rationale: ἐστάθη inaonyesha alisimama au akachukua nafasi yake; ἐπί pamoja na uhusika huu hapa inaeleweka kwa kawaida kuwa karibu na madhabahu, si juu yake kimwili.
- source_word: λιβανωτὸν χρυσοῦν
  choice: chetezo cha dhahabu
  rationale: λιβανωτός ni chombo cha kuchomea uvumba. “Chetezo” ni neno fupi na la kawaida katika lugha ya kibiblia; maelezo ya wazi zaidi yametolewa katika tanbihi.
- source_word: ἐδόθη αὐτῷ θυμιάματα πολλὰ
  choice: Akapewa uvumba mwingi
  rationale: θυμιάματα hapa ni uvumba au vitu vya kufukizia; Kiswahili hutumia “uvumba” kama nomino isiyohesabika, hivyo “uvumba mwingi” ni ya asili na huhifadhi kauli tendwa ya Kigiriki.
- source_word: ἵνα δώσει
  choice: ili autoe
  rationale: Ingawa δίδωμι kwa msingi ni “kutoa/kupa,” katika mazingira ya ibada yenye uvumba na madhabahu ina maana ya kuwasilisha kama sadaka. “Ili” huhifadhi kusudi la kishazi.
- source_word: ταῖς προσευχαῖς τῶν ἁγίων πάντων
  choice: pamoja na sala za watakatifu wote
  rationale: Uhusika wa dative hapa una utata wa kisintaksia. “Pamoja na” huonyesha uvumba ukiambatana na sala bila kulazimisha ufafanuzi wa kiteolojia usioelezwa wazi; tafsiri halisi zaidi imehifadhiwa katika tanbihi.
- source_word: ἅγιοι
  choice: watakatifu
  rationale: Katika Ufunuo neno hili kwa kawaida linawahusu watu wa Mungu waliowekwa wakfu. “Watakatifu” ni tafsiri iliyokita mizizi na inayoeleweka katika Kiswahili.
- source_word: ἐπὶ τὸ θυσιαστήριον τὸ χρυσοῦν
  choice: juu ya madhabahu ya dhahabu
  rationale: ἐπί pamoja na accusative baada ya tendo la kutoa huonyesha mwelekeo wa kupeleka au kuweka uvumba juu ya madhabahu.
- source_word: τὸ ἐνώπιον τοῦ θρόνου
  choice: iliyo mbele ya kiti cha enzi
  rationale: ἐνώπιον inaonyesha mahali au uhusiano wa kuwa mbele ya kitu; tafsiri hii ni ya kawaida na sahihi.
theological_decisions:
- issue: Kazi ya uvumba kuhusiana na sala za watakatifu
  choice: Uvumba unatolewa pamoja na sala za watakatifu wote.
  alternative: Uvumba unatolewa “kwa” sala za watakatifu wote, kwa kufuata dative kwa ukaribu zaidi.
  rationale: Muundo wa Kigiriki umebanwa na una utata, lakini taswira ya hekalu na ibada katika muktadha inaelekeza kwenye uvumba unaoambatana na sala au kuongezwa kwazo. Tanbihi huhifadhi ugumu wa kisintaksia bila kuingiza fundisho lililokuzwa kuhusu upatanishi wa malaika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa msomaji wa kawaida. “Chetezo” limehifadhiwa kama istilahi fupi ya ibada na kufafanuliwa katika tanbihi. Alama za tanbihi zimewekwa moja kwa moja baada ya vifungu vinavyohusika.
