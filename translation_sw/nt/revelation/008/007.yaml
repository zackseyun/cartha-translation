id: REV.8.7
reference: Revelation 8:7
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ ὁ πρῶτος ἐσάλπισεν· καὶ ἐγένετο χάλαζα καὶ πῦρ μεμιγμένα ἐν αἵματι, καὶ ἐβλήθη εἰς τὴν γῆν· καὶ τὸ τρίτον τῆς γῆς κατεκάη, καὶ τὸ τρίτον τῶν δένδρων κατεκάη, καὶ πᾶς χόρτος χλωρὸς κατεκάη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/007.yaml
  text: And the first sounded his trumpet[a], and there came hail and fire mixed with blood, and it was thrown onto the earth. And a third of the earth was burned up, and a third of the trees was burned up[b], and all the green grass was burned up.
translation:
  language: sw
  text: Wa kwanza akapiga tarumbeta yake. Mvua ya mawe na moto vilivyokuwa vimechanganyika na damu vikatokea, navyo vikatupwa juu ya dunia.[a] Theluthi moja ya dunia ikateketea, theluthi moja ya miti ikateketea, na nyasi zote za kijani zikateketea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nchi”; neno la Kigiriki linaweza kumaanisha “dunia,” “nchi,” au “ardhi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πρῶτος
  choice: Wa kwanza
  rationale: Huhifadhi usemi wa Kigiriki usiotaja nomino; kutokana na muktadha ni wa kwanza kati ya malaika saba, lakini neno “malaika” halijaongezwa.
- source_word: ἐσάλπισεν
  choice: akapiga tarumbeta yake
  rationale: Kitenzi hiki humaanisha kupiga tarumbeta; usemi huu ni wa kawaida na wazi katika Kiswahili, huku “yake” ikieleweka kutokana na muktadha wa malaika wenye tarumbeta.
- source_word: ἐγένετο
  choice: vikatokea
  rationale: Huwasilisha kwa Kiswahili cha masimulizi nguvu ya tukio jipya kuanza, badala ya kutoa tu hali tuli.
- source_word: χάλαζα καὶ πῦρ
  choice: mvua ya mawe na moto
  rationale: Ni tafsiri ya moja kwa moja inayohifadhi picha halisi na kali ya maono.
- source_word: μεμιγμένα ἐν αἵματι
  choice: vilivyokuwa vimechanganyika na damu
  rationale: Huhifadhi hali ya vitu hivyo kuwa vimechanganyika na damu bila kueleza damu hiyo kiishara.
- source_word: ἐβλήθη εἰς τὴν γῆν
  choice: navyo vikatupwa juu ya dunia
  rationale: Kigiriki kina kitenzi cha umoja kinachoweza kuuchukulia mkusanyiko mzima kama tukio moja; Kiswahili hutumia wingi kwa upatanisho wa kawaida na “mvua ya mawe na moto.” “Juu ya” huonyesha mwendo kuelekea uso wa dunia.
- source_word: τὸ τρίτον τῆς γῆς
  choice: theluthi moja ya dunia
  rationale: Ni usemi wa kawaida wa Kiswahili kwa sehemu moja kati ya tatu na huhifadhi upeo mpana unaowezekana katika maono haya.
- source_word: κατεκάη
  choice: ikateketea
  rationale: “Kuteteketea” huonyesha kuchomwa kabisa au kuangamizwa kwa moto, hivyo huwasilisha nguvu ya kitenzi κατακαίω.
- source_word: τὸ τρίτον τῶν δένδρων
  choice: theluthi moja ya miti
  rationale: Ni tafsiri ya asili ya muundo wa Kigiriki unaotaja sehemu ya jumla.
- source_word: πᾶς χόρτος χλωρός
  choice: majani yote mabichi
  rationale: χόρτος inaweza kumaanisha nyasi au majani ya mimea; “majani yote mabichi” ni usemi wa kawaida unaohifadhi picha ya uoto mchanga wa kijani bila kuupanua kuwa mimea yote kwa ujumla.
theological_decisions:
- issue: Upeo wa γῆ katika picha ya hukumu ya kiapokaliptiki
  choice: dunia
  alternative: nchi
  rationale: γῆ inaweza kumaanisha dunia au nchi/ardhi. Muktadha mpana wa hukumu za tarumbeta unaunga mkono “dunia,” lakini tanbihi inahifadhi uwezekano halisi wa “nchi.”
- issue: Mtendaji anayetajwa kama ὁ πρῶτος
  choice: Wa kwanza
  alternative: Malaika wa kwanza
  rationale: Muktadha unaonyesha kwamba huyu ni malaika wa kwanza kati ya wale saba, lakini Kigiriki cha mstari huu hakirudii nomino “malaika”; tafsiri haiongezi neno hilo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mfuatano wa vishazi umehifadhi mwendo wa haraka wa simulizi la maono, huku upatanisho wa kisarufi ukifanywa kuwa wa kawaida katika Kiswahili. Tanbihi ya Kiingereza iliyowekwa baada ya “tarumbeta” ilikuwa haihusiani na mahali pa alama; hapa imewekwa baada ya “dunia,” ambako mbadala wa γῆ unahusika. Tanbihi ya Kiingereza kuhusu “mingled with blood” haikuongezwa kwa kuwa ni tofauti ya mtindo wa Kiingereza, si maana mbadala ya msingi inayohitaji tanbihi ya Kiswahili.
