id: REV.8.12
reference: Revelation 8:12
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ ὁ τέταρτος ἄγγελος ἐσάλπισεν· καὶ ἐπλήγη τὸ τρίτον τοῦ ἡλίου καὶ τὸ τρίτον τῆς σελήνης καὶ τὸ τρίτον τῶν ἀστέρων, ἵνα σκοτισθῇ τὸ τρίτον αὐτῶν καὶ ⸂ἡ ἡμέρα μὴ φάνῃ τὸ τρίτον αὐτῆς⸃, καὶ ἡ νὺξ ὁμοίως.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/012.yaml
  text: And the fourth angel sounded the trumpet[a], and a third of the sun and a third of the moon and a third of the stars was struck, so that a third of them was darkened, and the day did not shine for a third of it, and the night likewise.
translation:
  language: sw
  text: Malaika wa nne akapiga tarumbeta, na theluthi ya jua, theluthi ya mwezi, na theluthi ya nyota vikapigwa, ili theluthi ya mianga hiyo itiwe giza, na mchana usiangaze kwa theluthi ya muda wake,[a] na usiku vivyo hivyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hivyo theluthi ya mianga hiyo ikatiwa giza, na mchana haukuangaza kwa theluthi ya muda wake.” Muundo wa Kigiriki unaweza kueleza kusudi au matokeo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσάλπισεν
  choice: akapiga tarumbeta
  rationale: Kitenzi σαλπίζω humaanisha kupiga tarumbeta; usemi huu ni wa kawaida na wazi katika Kiswahili.
- source_word: ἐπλήγη
  choice: vikapigwa
  rationale: Kauli tendwa ya πλήσσω imehifadhiwa, pamoja na taswira ya hukumu. Upatanisho wa wingi unarejelea jua, mwezi, na nyota kwa pamoja.
- source_word: τὸ τρίτον
  choice: theluthi
  rationale: ‘Theluthi’ ni usemi wa kawaida wa Kiswahili kwa sehemu moja kati ya tatu na huhifadhi kipimo kinachorudiwa katika mstari.
- source_word: ἥλιος / σελήνη / ἀστέρες
  choice: jua ... mwezi ... nyota
  rationale: Majina haya ya mianga ya angani yametafsiriwa moja kwa moja.
- source_word: ἵνα
  choice: ili
  rationale: ἵνα inaweza kuonyesha kusudi au matokeo. ‘Ili’ huhifadhi mwelekeo wa kusudi unaowezekana bila kuondoa uhusiano wa matokeo katika muktadha.
- source_word: σκοτισθῇ
  choice: itiwe giza
  rationale: Usemi huu huhifadhi kauli tendwa ya Kigiriki na wazo la kusababishiwa giza.
- source_word: αὐτῶν
  choice: yake
  rationale: Ingawa Kigiriki kina kiwakilishi cha wingi kinachorejelea jua, mwezi, na nyota kwa pamoja, Kiswahili hutumia ngeli tofauti kwa majina hayo; ‘yake’ inarejelea kwa urahisi jumla iliyotajwa, yaani sehemu iliyopigwa, bila sentensi nzito.
- source_word: ἡ ἡμέρα μὴ φάνῃ
  choice: mchana usiangaze
  rationale: Katika muktadha wa kutiwa giza kwa mianga ya angani, φαίνω ina maana ya kuangaza; ‘mchana usiangaze’ huhifadhi pia hali ya utegemezi baada ya ἵνα.
- source_word: τὸ τρίτον αὐτῆς
  choice: kwa theluthi yake
  rationale: Usemi huu huhifadhi kiwango au muda ulioathiriwa, huku Kiswahili ‘kwa’ kikiruhusu maana ya sehemu ya kipindi bila ufafanuzi wa ziada.
- source_word: ἡ νὺξ ὁμοίως
  choice: na usiku vivyo hivyo
  rationale: Huu ni ulinganifu mfupi na wa asili unaoonyesha kuwa athari hiyo hiyo ilihusu usiku.
theological_decisions:
- issue: Asili ya taswira ya hukumu ya ulimwengu
  choice: Taswira ya kutiwa giza kwa mianga ya angani imetolewa moja kwa moja bila kuamua kama ni halisi, ya mfano, au yote mawili.
  alternative: Kuifafanua kuwa tukio la kiastronomia tu au ishara ya kisiasa na kiulimwengu tu.
  rationale: Mstari wenyewe hautoi ufafanuzi huo; tafsiri inapaswa kuhifadhi taswira na mvutano wake wa kitheolojia.
- issue: Nuansi ya ἵνα pamoja na vitenzi vya hali tegemezi
  choice: ‘Ili ... itiwe giza ... usiangaze’
  alternative: ‘Hivyo ... ikatiwa giza ... haukuangaza’
  rationale: Muundo wa Kigiriki unaweza kueleweka kwa upande wa kusudi au matokeo. Matini kuu imehifadhi nuansi ya kusudi, na tanbihi inaonyesha uwezekano wa matokeo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye staha na inayoeleweka kwa wasomaji wa kawaida. Urudiaji wa ‘theluthi’ umehifadhiwa kwa ajili ya msisitizo wa matini. Alama ya tanbihi [a] imewekwa baada ya kishazi kinachohusika.
