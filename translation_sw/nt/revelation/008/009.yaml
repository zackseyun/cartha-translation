id: REV.8.9
reference: Revelation 8:9
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἀπέθανε τὸ τρίτον ⸀τῶν κτισμάτων τῶν ἐν τῇ θαλάσσῃ, τὰ ἔχοντα ψυχάς, καὶ τὸ τρίτον τῶν πλοίων ⸀διεφθάρησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/009.yaml
  text: And a third of the creatures in the sea—the ones that have living souls—died[a], and a third of the ships were destroyed.
translation:
  language: sw
  text: Na theluthi moja ya viumbe vilivyokuwa baharini—vile vyenye uhai—vikafa[a], na theluthi moja ya meli zikaharibiwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au “vile vyenye nafsi” au “viumbe hai.” Kigiriki: “vile vyenye nafsi/uhai.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέθανε
  choice: vikafa
  rationale: Kitenzi hiki humaanisha kufa moja kwa moja; umbo la wingi linapatana kwa kawaida na “viumbe” katika Kiswahili.
- source_word: τὸ τρίτον
  choice: theluthi moja
  rationale: Hii ni njia ya kawaida na wazi ya Kiswahili ya kuonyesha sehemu moja kati ya tatu.
- source_word: κτισμάτων
  choice: viumbe
  rationale: Katika muktadha huu, neno linarejelea viumbe hai vya baharini, si vitu vyote vilivyoumbwa.
- source_word: τῶν ἐν τῇ θαλάσσῃ
  choice: vilivyokuwa baharini
  rationale: Tafsiri hii huonyesha mahali vilipokuwa na kuunganika kwa kawaida na “viumbe”.
- source_word: τὰ ἔχοντα ψυχάς
  choice: vile vyenye uhai
  rationale: Kirai hiki kinabainisha viumbe vyenye uhai. “Uhai” ni Kiswahili cha kawaida hapa na hakilazimishi maana ya kitaalamu ya nafsi.
- source_word: ψυχάς
  choice: uhai
  rationale: Katika muktadha wa viumbe vya baharini, ψυχή huonyesha uhai au kuwa kiumbe hai; tanbihi huhifadhi uwezekano wa tafsiri ya karibu zaidi ya kileksia, “nafsi.”
- source_word: πλοίων
  choice: meli
  rationale: “Meli” ni neno la kawaida na linaloeleweka kwa vyombo vya majini katika muktadha huu.
- source_word: διεφθάρησαν
  choice: zikaharibiwa
  rationale: Hapa kitenzi cha kutendwa kinaonyesha uharibifu wa meli, si upotovu wa kimaadili.
theological_decisions:
- issue: Jinsi ya kutafsiri ψυχάς inapowahusu viumbe vya baharini
  choice: vyenye uhai
  alternative: vyenye nafsi; viumbe hai
  rationale: Muktadha unaonyesha uhai wa viumbe, wala si lazima kutoa dai la kiufundi kuhusu asili ya nafsi za wanyama. Tanbihi huhifadhi upana wa neno la Kigiriki bila kuingiza fundisho maalumu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa viunganishi “vikafa… zikaharibiwa” unahifadhi mtiririko wa simulizi, na vistari virefu vinabainisha kirai elezi bila kukifanya kuwa dai tofauti.
source_grounding:
  english_pob_role: consult_only
