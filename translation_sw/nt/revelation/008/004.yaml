source:
  edition: SBLGNT
  text: καὶ ἀνέβη ὁ καπνὸς τῶν θυμιαμάτων ταῖς προσευχαῖς τῶν ἁγίων ἐκ χειρὸς τοῦ ἀγγέλου ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/004.yaml
  text: And the smoke of the incense went up with the prayers of the saints from the hand of the angel before God[a][b].
translation:
  language: sw
  text: Na moshi wa uvumba ukapaa[a] pamoja na maombi ya watakatifu[b] kutoka mkononi mwa malaika, mbele za Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ukainuka.”
    reason: lexical_alternative
  - marker: b
    text: 'Kigiriki: “pamoja na maombi ya watakatifu.” Maneno hayo yanahusianisha moshi wa uvumba na maombi bila kusema wazi katika mstari huu kwamba moshi huo ni maombi yenyewe.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνέβη
  choice: ukapaa
  rationale: Kitenzi hiki kinaeleza mwendo wa kwenda juu. “Ukapaa” ni Kiswahili cha kawaida kinachohifadhi taswira halisi ya moshi ukielekea juu.
- source_word: καπνὸς
  choice: moshi
  rationale: Maana ya kawaida ni moshi halisi, na hakuna haja ya kuifasiri taswira hii ya kinabii kwa neno jingine.
- source_word: θυμιαμάτων
  choice: wa uvumba
  rationale: Ingawa Kigiriki kina umbo la wingi, “uvumba” ni nomino ya jumla ya kawaida katika Kiswahili na inahifadhi maana ya kitu cha kunukia kinachoteketezwa katika ibada.
- source_word: ταῖς προσευχαῖς
  choice: pamoja na maombi
  rationale: Hii inaonyesha uhusiano kati ya moshi na maombi bila kubainisha kupita kiasi kama uvumba unayawakilisha, unaambatana nayo, au unayabeba.
- source_word: τῶν ἁγίων
  choice: ya watakatifu
  rationale: “Watakatifu” ni istilahi ya kawaida ya kibiblia kwa watu waliowekwa wakfu kwa Mungu; hapa haimaanishi tu watu waliotangazwa watakatifu na mapokeo fulani.
- source_word: ἐκ χειρὸς τοῦ ἀγγέλου
  choice: kutoka mkononi mwa malaika
  rationale: Tafsiri hii inahifadhi taswira ya kitu kinachotoka katika mkono wa malaika na inafuata muundo wa Kigiriki kwa Kiswahili cha asili.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: mbele za Mungu
  rationale: Usemi huu wa kawaida wa kibiblia una maana ya kuwa katika uwepo wa Mungu na unafaa mazingira ya ibada ya maono haya.
theological_decisions:
- issue: Uhusiano kati ya uvumba na maombi
  choice: “moshi wa uvumba ukapaa pamoja na maombi ya watakatifu”
  alternative: “moshi wa uvumba, yaani maombi ya watakatifu, ukapaa” au “moshi ukapaa kwa ajili ya maombi ya watakatifu”
  rationale: Muundo wa Kigiriki unahusianisha moshi wa uvumba na maombi, lakini katika mstari huu hauyasawazishi waziwazi. Tafsiri inahifadhi utata huo badala ya kuufafanua kiteolojia.
- issue: Wanaorejelewa na “watakatifu”
  choice: “watakatifu” kwa maana pana ya watu wa Mungu
  alternative: “watu watakatifu wa Mungu”
  rationale: Katika muktadha huu neno linawarejelea watu wa Mungu waliowekwa wakfu, bila kulipatia maana finyu ya kimadhehebu au ya watu waliotangazwa rasmi kuwa watakatifu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. “Ukapaa,” “uvumba,” na “mbele za Mungu” hudumisha uzito wa maono ya ibada bila kufanya sentensi kuwa ngumu au ya kizamani.
