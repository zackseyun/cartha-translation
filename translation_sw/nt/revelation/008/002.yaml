  text: καὶ εἶδον τοὺς ἑπτὰ ἀγγέλους οἳ ἐνώπιον τοῦ θεοῦ ἑστήκασιν, καὶ ἐδόθησαν αὐτοῖς ἑπτὰ σάλπιγγες.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/002.yaml
  text: And I saw the seven angels who stand before God[a], and seven trumpets were given to them.
translation:
  language: sw
  text: Nami nikawaona wale malaika saba wanaosimama mbele za Mungu[a], nao wakapewa tarumbeta saba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ambao wamesimama mbele za Mungu.” Kitenzi cha Kigiriki kiko katika wakati timilifu na kinakazia kusimama kwao kuwa hali inayoendelea.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδον
  choice: nikawaona
  rationale: Katika simulizi la maono, umbo la aoristi la ὁράω linaelezwa kwa kawaida kama tendo la kuona; “nikawaona” ni la asili katika Kiswahili na linaendeleza mfululizo wa maono.
- source_word: τοὺς ἑπτὰ ἀγγέλους
  choice: wale malaika saba
  rationale: Neno bainishi pamoja na namba linatambulisha kundi maalumu; “wale malaika saba” linaonyesha wazi umaalumu huo.
- source_word: ἀγγέλους
  choice: malaika
  rationale: Muktadha wa mbinguni unaonyesha kuwa hawa ni viumbe wa kiroho, si wajumbe wa kibinadamu.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: mbele za Mungu
  rationale: Hii ni nahau ya kawaida na yenye heshima katika Kiswahili, ikihifadhi maana ya kuwa mbele au katika uwepo wa Mungu.
- source_word: ἑστήκασιν
  choice: wanaosimama
  rationale: Wakati timilifu wa Kigiriki unaonyesha hali inayoendelea ya kusimama; wakati wa sasa wa Kiswahili unaiwasilisha kwa kawaida bila kulazimisha tafsiri ya wakati uliopita.
- source_word: ἐδόθησαν αὐτοῖς
  choice: wakapewa
  rationale: Kauli tendwa inamhifadhi mtoaji bila kutajwa kama ilivyo katika Kigiriki, huku kiunganishi -ka- kikiendeleza simulizi kwa ufasaha.
- source_word: σάλπιγγες
  choice: tarumbeta
  rationale: “Tarumbeta” ni neno la kawaida la Kiswahili kwa ala hizi katika taswira ya tangazo na hukumu; “baragumu” pia hutumika katika lugha ya Biblia lakini si la kawaida kwa wasomaji wote wa sasa.
theological_decisions:
- issue: Utambulisho na hadhi ya wale malaika saba
  choice: wale malaika saba wanaosimama mbele za Mungu
  alternative: wale malaika wakuu saba
  rationale: Andiko linawataja kama kundi maalumu la malaika mbele za Mungu, lakini haliwaiti malaika wakuu wala halibainishi cheo chao; tafsiri haiongezi mapokeo ya baadaye.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. “Mbele za Mungu” huhifadhi maana ya kimahali na ya kuwapo katika uwepo wake; “tarumbeta” limechaguliwa kwa uwazi wa kisasa.
