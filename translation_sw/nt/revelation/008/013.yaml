id: REV.8.13
reference: Revelation 8:13
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ εἶδον, καὶ ἤκουσα ἑνὸς ἀετοῦ πετομένου ἐν μεσουρανήματι λέγοντος φωνῇ μεγάλῃ· Οὐαὶ οὐαὶ οὐαὶ ⸂τοὺς κατοικοῦντας⸃ ἐπὶ τῆς γῆς ἐκ τῶν λοιπῶν φωνῶν τῆς σάλπιγγος τῶν τριῶν ἀγγέλων τῶν μελλόντων σαλπίζειν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/013.yaml
  text: And I saw[a], and I heard one eagle flying in midheaven, saying with a loud voice, “Woe, woe, woe to those who dwell on the earth[b], because of the remaining trumpet-blasts of the three angels who are about to sound!”
translation:
  language: sw
  text: Nikaona, nikasikia tai mmoja[a] akiruka katikati ya anga[b], akisema kwa sauti kubwa, “Ole, ole, ole kwa wale wanaokaa duniani, kwa sababu ya milio iliyosalia ya tarumbeta za wale malaika watatu ambao wako karibu kuzipiga!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati zina “malaika mmoja” badala ya “tai mmoja.”
    reason: textual_variant
  - marker: b
    text: Au, “angani juu kabisa”; neno la Kigiriki hurejelea anga la katikati au la juu angani.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀετοῦ
  choice: tai
  rationale: Neno hili kwa kawaida humaanisha tai. Hakuna muktadha unaolazimisha maana ya ndege mla mizoga, na taswira ya maono inaunga mkono ‘tai.’
- source_word: μεσουρανήματι
  choice: katikati ya anga
  rationale: Hurejelea anga la wazi lililo juu sana. Usemi huu unahifadhi taswira ya ulimwengu wa juu katika maono huku ukieleweka kwa urahisi katika Kiswahili.
- source_word: φωνῇ μεγάλῃ
  choice: kwa sauti kubwa
  rationale: Ni usemi wa kawaida na wa asili wa Kiswahili unaowasilisha nguvu ya tangazo la hadharani.
- source_word: Οὐαὶ οὐαὶ οὐαὶ
  choice: Ole, ole, ole
  rationale: Marudio yote matatu yamehifadhiwa ili kudumisha mkazo wa kinabii na uzito wa onyo.
- source_word: τοὺς κατοικοῦντας ἐπὶ τῆς γῆς
  choice: kwa wale wanaokaa duniani
  rationale: Usemi huu unadumisha kirai kinachojirudia katika Ufunuo; ‘kwa’ huifanya sentensi ya Kiswahili kuwa ya asili baada ya ‘ole.’
- source_word: ἐκ τῶν λοιπῶν φωνῶν τῆς σάλπιγγος
  choice: kwa sababu ya milio iliyobaki ya tarumbeta
  rationale: Katika muktadha huu ἐκ inaonyesha sababu. Ingawa φωναί kihalisi ni sauti, ‘milio’ ni neno la kawaida kwa sauti za tarumbeta na linahifadhi taswira hiyo.
- source_word: τῶν τριῶν ἀγγέλων
  choice: za wale malaika watatu
  rationale: Katika muktadha huu wa kiapokaliptiki, ἄγγελοι ni malaika, si wajumbe wa kibinadamu.
- source_word: τῶν μελλόντων σαλπίζειν
  choice: ambao wako karibu kuzipiga
  rationale: Muundo wa μέλλω pamoja na kitenzi-jina unaonyesha jambo lililo karibu kutokea. Kiwakilishi ‘zi-’ kinarejelea tarumbeta na kufanya Kiswahili kiwe cha asili.
theological_decisions:
- issue: Toleo la maandishi kuhusu mhubiri anayeruka
  choice: tai mmoja
  alternative: malaika mmoja
  rationale: Maandishi makuu yanafuata SBLGNT, yenye ἀετοῦ (‘tai’). Kwa kuwa baadhi ya hati zina ‘malaika,’ tofauti hiyo imehifadhiwa katika tanbihi bila kuingizwa katika maandishi makuu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye heshima na unaoeleweka. Marudio ya ‘Ole’ yamehifadhiwa kwa uzito wa kinabii, na viashiria vya tanbihi vimewekwa moja kwa moja baada ya maneno yanayohusika.
