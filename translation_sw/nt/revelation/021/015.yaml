reference: Revelation 21:15
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ ὁ λαλῶν μετ’ ἐμοῦ εἶχεν μέτρον κάλαμον χρυσοῦν, ἵνα μετρήσῃ τὴν πόλιν καὶ τοὺς πυλῶνας αὐτῆς καὶ τὸ τεῖχος αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/015.yaml
  text: And the one speaking with me had a golden measuring rod[a], so that he might measure the city and its gates and its wall.
translation:
  language: sw
  text: Yule aliyekuwa akizungumza nami alikuwa na fimbo ya dhahabu ya kupimia[a], ili aupime mji, malango yake na ukuta wake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mwanzi wa dhahabu wa kupimia.” Neno la Kigiriki κάλαμος kwa maana halisi ni “mwanzi,” uliotumiwa kama fimbo ya kupimia.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λαλῶν μετ’ ἐμοῦ
  choice: Yule aliyekuwa akizungumza nami
  rationale: Kirai cha kisifa chenye kitenzi cha wakati uliopo kinamtaja mhusika kwa tendo lake. Kiswahili cha wakati uliopita endelevu kinaendana kwa kawaida na simulizi na hakiongezi neno ‘malaika,’ ambalo halipo katika mstari huu.
- source_word: εἶχεν
  choice: alikuwa na
  rationale: Hii ndiyo maana ya moja kwa moja ya kitenzi ἔχω katika hali ya wakati uliopita usiotimilika; haiongezi dhana kwamba alikuwa ameishika mkononi.
- source_word: μέτρον κάλαμον χρυσοῦν
  choice: fimbo ya dhahabu ya kupimia
  rationale: Kirai kinataja kifaa cha kupimia kilichotengenezwa kwa dhahabu. ‘Fimbo ... ya kupimia’ ni ya kawaida na wazi kwa msomaji wa kisasa, huku tanbihi ikihifadhi maana halisi ya κάλαμος, ‘mwanzi.’
- source_word: ἵνα μετρήσῃ
  choice: ili aupime
  rationale: ‘Ili’ inaonyesha wazi kusudi la ἵνα pamoja na kitenzi tegemezi; kiambishi ‘u-’ kinarejelea mji.
- source_word: τὴν πόλιν
  choice: mji
  rationale: Ni tafsiri ya kawaida ya πόλις; haiongezi jina ‘Yerusalemu Mpya,’ ambalo halitajwi moja kwa moja katika mstari huu.
- source_word: τοὺς πυλῶνας αὐτῆς
  choice: malango yake
  rationale: πυλών inaweza kumaanisha lango au njia ya lango; ‘malango’ ni neno la kawaida na linafaa katika maelezo haya ya mji.
- source_word: τὸ τεῖχος αὐτῆς
  choice: ukuta wake
  rationale: τεῖχος hapa ni ukuta wa mji; ‘ukuta’ ni sahihi bila kuongeza maelezo ya kiufafanuzi.
theological_decisions:
- issue: Kumtambulisha anayezungumza waziwazi kuwa malaika
  choice: Kudumisha maelezo ‘Yule aliyekuwa akizungumza nami’ bila kuongeza ‘malaika.’
  alternative: Malaika aliyekuwa akizungumza nami
  rationale: Ingawa muktadha mpana unamtambulisha mhusika kuwa mmoja wa malaika, Kigiriki cha mstari huu kinatumia kirai cha kisifa badala ya nomino ‘malaika.’ Tafsiri inafuata wording ya mstari bila kuingiza utambulisho wa kimuktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kawaida, wa heshima na unaosomeka kwa urahisi. Muundo ‘alikuwa na’ unahifadhi maana ya εἶχεν, na ‘ili aupime’ unaweka wazi kusudi bila kuwa mzito.
