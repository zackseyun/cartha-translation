id: REV.21.2
reference: Revelation 21:2
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ τὴν πόλιν τὴν ἁγίαν Ἰερουσαλὴμ καινὴν εἶδον καταβαίνουσαν ἐκ τοῦ οὐρανοῦ ἀπὸ τοῦ θεοῦ, ἡτοιμασμένην ὡς νύμφην κεκοσμημένην τῷ ἀνδρὶ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/002.yaml
  text: And I saw the holy city[a], new Jerusalem, coming down out of heaven from God[c][b], prepared like a bride adorned for her husband.
translation:
  language: sw
  text: Nami nikauona mji mtakatifu, Yerusalemu mpya, ukishuka kutoka mbinguni, kutoka kwa Mungu, ukiwa umeandaliwa kama bibi-arusi aliyepambwa kwa ajili ya mume wake.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πόλιν τὴν ἁγίαν
  choice: mji mtakatifu
  rationale: ‘Mji’ hudumisha taswira halisi ya jumuiya ya mjini, na ‘mtakatifu’ huhifadhi maana ya kutengwa kwa ajili ya Mungu.
- source_word: Ἰερουσαλὴμ καινὴν
  choice: Yerusalemu mpya
  rationale: Jina limetoholewa kwa umbo linalotumika katika Kiswahili, huku καινήν likitafsiriwa kama ‘mpya.’ Herufi ndogo katika ‘mpya’ huhifadhi uwezekano wa kuisoma kama sifa ya Yerusalemu badala ya kuamua kwamba ni sehemu ya cheo rasmi.
- source_word: εἶδον
  choice: nikauona
  rationale: Umbo hili ni la kawaida katika masimulizi ya Kiswahili na linaonyesha tendo la Yohana kuona, huku kiambishi cha ngeli kikirejelea ‘mji.’
- source_word: καταβαίνουσαν
  choice: ukishuka
  rationale: ‘Kushuka’ ni tafsiri ya moja kwa moja na ya asili ya mwendo unaoelezwa na καταβαίνω.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: kutoka mbinguni
  rationale: ‘Kutoka’ huhifadhi wazo la mwendo unaoanzia ndani au upande wa mbinguni.
- source_word: ἀπὸ τοῦ θεοῦ
  choice: kutoka kwa Mungu
  rationale: Kirai hiki kinaonyesha chanzo au asili bila kuongeza wazo lisilotajwa wazi, kama vile ‘kutoka mbele za Mungu.’
- source_word: ἡτοιμασμένην
  choice: ukiwa umeandaliwa
  rationale: 'Muundo huu unaonyesha hali iliyotokana na tendo lililokamilika: mji unaonekana tayari ukiwa umeandaliwa.'
- source_word: ὡς νύμφην
  choice: kama bibi-arusi
  rationale: ‘Kama’ huonyesha wazi kuwa hapa kuna ulinganisho; ‘bibi-arusi’ ni neno la kawaida la Kiswahili kwa mwanamke katika taswira ya harusi.
- source_word: κεκοσμημένην
  choice: aliyepambwa
  rationale: Neno hili huhifadhi hali tendwa na taswira ya mapambo ya harusi bila kuipanua kuwa maelezo ya aina maalumu ya mavazi.
- source_word: τῷ ἀνδρὶ αὐτῆς
  choice: kwa ajili ya mume wake
  rationale: Katika muktadha wa bibi-arusi, ἀνήρ humaanisha kwa kawaida ‘mume’; ‘kwa ajili ya’ hueleza kusudi la maandalizi kwa Kiswahili cha asili.
theological_decisions:
- issue: Iwapo ‘Yerusalemu mpya’ ichukuliwe kuwa cheo rasmi
  choice: Imetafsiriwa ‘Yerusalemu mpya’ katika mtiririko wa sentensi
  alternative: Yerusalemu Mpya
  rationale: Kiyunani kina jina Yerusalemu pamoja na kivumishi ‘mpya.’ Kutotumia herufi kubwa katika kivumishi huhifadhi nguvu yake ya kimaelezo bila kukataa uwezekano wa kuitumia kama cheo katika mazingira mengine.
- issue: Iwapo taswira ya bibi-arusi ifafanuliwe moja kwa moja kuwa kanisa au watu wa Mungu
  choice: 'Ulinganisho umeachwa kama ulivyo: ‘kama bibi-arusi’'
  alternative: Kuongeza utambulisho wa bibi-arusi kuwa kanisa au watu wa Mungu
  rationale: Aya yenyewe inatoa tashbihi bila kuufafanua moja kwa moja utambulisho wake. Kuongeza ufafanuzi huo kungeondoa mvutano wa kitheolojia uliomo katika maono.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kifasihi lakini kinachoeleweka kwa wasomaji wa kawaida. Marudio ya ‘kutoka’ yamehifadhiwa ili kutofautisha kwa uwazi mbinguni kama mahali mji unakoshuka kutoka na Mungu kama chanzo chake.
