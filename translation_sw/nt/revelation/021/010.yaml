id: REV.21.10
reference: Revelation 21:10
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἀπήνεγκέν με ἐν πνεύματι ἐπὶ ὄρος μέγα καὶ ὑψηλόν, καὶ ἔδειξέν μοι τὴν ⸀πόλιν τὴν ἁγίαν Ἰερουσαλὴμ καταβαίνουσαν ἐκ τοῦ οὐρανοῦ ἀπὸ τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/010.yaml
  text: And he carried me away in the Spirit onto a great and high mountain[a], and showed me the holy city, Jerusalem, coming down out of heaven from God,
translation:
  language: sw
  text: Akanichukua katika Roho[a] hadi kwenye mlima mkubwa na mrefu, akanionyesha mji mtakatifu, Yerusalemu, ukishuka kutoka mbinguni, kutoka kwa Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika roho.” Kirai cha Kigiriki kinaweza kumaanisha hali ya maono; katika Ufunuo mara nyingi hutanguliza maono ya kinabii.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπήνεγκέν
  choice: akanichukua
  rationale: Kitenzi hiki kinaeleza kuhamishwa kutoka mahali pamoja hadi pengine katika mazingira ya maono; “akanichukua” ni Kiswahili cha kawaida na huonyesha tendo hilo bila kuongeza namna ya usafiri.
- source_word: ἐν πνεύματι
  choice: katika Roho
  rationale: Huhifadhi muundo wa Kigiriki na fomula ya maono inayojirudia katika Ufunuo; herufi kubwa inaonyesha uwezekano mkubwa wa Roho Mtakatifu, huku tanbihi ikihifadhi maana mbadala ya hali ya kiroho.
- source_word: ἐπὶ ὄρος μέγα καὶ ὑψηλόν
  choice: mpaka kwenye mlima mkubwa na mrefu
  rationale: “Mpaka kwenye” huonyesha mwendo kuelekea mahali pa maono; “mkubwa” na “mrefu” huhifadhi vivumishi vyote viwili vya Kigiriki.
- source_word: ἔδειξέν μοι
  choice: akanionyesha
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya δείκνυμι bila kuongeza dhana isiyotajwa wazi ya ufunuo.
- source_word: πόλιν
  choice: mji
  rationale: Katika muktadha huu πόλις ni mji wa wakati ujao; “mji” ndiyo istilahi ya kawaida ya Kiswahili.
- source_word: ἁγίαν
  choice: mtakatifu
  rationale: “Mtakatifu” huhifadhi maana ya kibiblia na kitheolojia ya ἅγιος.
- source_word: Ἰερουσαλήμ
  choice: Yerusalemu
  rationale: Jina la mahali limetolewa kwa umbo lake la kawaida katika Kiswahili.
- source_word: καταβαίνουσαν
  choice: ukishuka
  rationale: Umbo la kuendelea linaonyesha mji ukiwa katika tendo la kushuka na linapatana kisarufi na “mji.”
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: kutoka mbinguni
  rationale: Hueleza chanzo cha kushuka kwa lugha ya asili ya Kiswahili; muktadha wenyewe unaonyesha mwendo kutoka ndani ya mbingu.
- source_word: ἀπὸ τοῦ θεοῦ
  choice: kwa Mungu
  rationale: Katika Kiswahili, “kutoka mbinguni kwa Mungu” hutofautisha chanzo cha kimahali na chanzo cha kiungu bila kurudia “kutoka”; haiongezi wazo la “uwepo wa Mungu.”
theological_decisions:
- issue: Kirejewa cha ἐν πνεύματι katika fomula ya maono
  choice: “katika Roho,” ikielekea kumrejelea Roho Mtakatifu
  alternative: “katika roho,” yaani katika hali ya kiroho au katika roho ya Yohana
  rationale: Matumizi yanayojirudia katika Ufunuo yanaashiria maono ya kinabii kwa utendaji wa Roho, lakini Kigiriki hakiondoi kabisa maana ya hali ya kiroho. Tafsiri kuu na tanbihi zinahifadhi mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inadumisha mtiririko wa simulizi na mpangilio wa maelezo ya Kigiriki bila kuwa ngumu kwa msomaji wa kawaida.
