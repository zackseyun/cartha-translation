  text: καὶ οὐ μὴ εἰσέλθῃ εἰς αὐτὴν πᾶν κοινὸν καὶ ⸀ποιῶν βδέλυγμα καὶ ψεῦδος, εἰ μὴ οἱ γεγραμμένοι ἐν τῷ βιβλίῳ τῆς ζωῆς τοῦ ἀρνίου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/027.yaml
  text: And nothing unclean will ever enter it[a], nor anyone who does what is detestable or false[b], but only those written in the Lamb’s book of life.
translation:
  language: sw
  text: Na kamwe chochote kilicho najisi hakitaingia ndani yake[a], wala mtu yeyote anayefanya chukizo au uongo[b], bali wale tu walioandikwa katika kitabu cha uzima cha Mwanakondoo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “chochote kisicho kitakatifu” au “chochote kilichotiwa unajisi” kwa maneno “chochote kilicho najisi” (πᾶν κοινόν).
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “anayefanya chukizo na uongo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μὴ εἰσέλθῃ
  choice: kamwe hakitaingia
  rationale: Muundo οὐ μή pamoja na aoristi tegemezi ni ukanushaji wenye mkazo mkubwa. “Kamwe hakitaingia” huonyesha kwa Kiswahili cha kawaida kwamba kuingia huko hakutatokea kabisa.
- source_word: αὐτὴν
  choice: ndani yake
  rationale: Kiwakilishi kinarejelea mji, Yerusalemu Mpya. “Ndani yake” ni ya kawaida kwa kuingia katika mji na haiingizi uhuishaji usio wa lazima.
- source_word: πᾶν κοινὸν
  choice: chochote kilicho najisi
  rationale: Umoja wa jinsi ya kati pamoja na πᾶν una maana jumuishi ya “chochote.” Katika muktadha wa Kiyahudi wa usafi, κοινός humaanisha kilicho cha kawaida kwa maana ya najisi, kilichotiwa unajisi, au kisicho kitakatifu.
- source_word: ποιῶν βδέλυγμα καὶ ψεῦδος
  choice: mtu yeyote anayefanya jambo la kuchukiza au la uongo
  rationale: Kitenzi-shirikishi kinatumika kama nomino na kumtaja mtu mwenye mazoea hayo. “Jambo la kuchukiza au la uongo” ni Kiswahili cha asili kinachoonyesha makundi yote mawili chini ya ukanushaji, huku tanbihi ikihifadhi muundo wa karibu zaidi wa Kigiriki.
- source_word: εἰ μὴ
  choice: bali ... tu
  rationale: Hapa εἰ μή huanzisha kundi pekee lisilo chini ya katazo. “Bali wale tu” huonyesha upekee na utofautishaji kwa uwazi.
- source_word: οἱ γεγραμμένοι
  choice: wale walioandikwa
  rationale: Kitenzi-shirikishi timilifu tendwa huonyesha hali iliyopo kutokana na kuandikwa. Tafsiri haiongezi neno “majina,” ambalo linaeleweka katika taswira lakini halitajwi wazi katika mstari huu.
- source_word: ἐν τῷ βιβλίῳ τῆς ζωῆς τοῦ ἀρνίου
  choice: katika kitabu cha uzima cha Mwanakondoo
  rationale: “Kitabu cha uzima” ni usemi sahihi na unaotambulika, na “cha Mwanakondoo” huhifadhi umilikaji pamoja na cheo muhimu cha Kikristo katika Ufunuo.
theological_decisions:
- issue: Upeo wa wanaozuiwa kuingia Yerusalemu Mpya
  choice: Mstari unazuia chochote kilicho najisi na pia mtu yeyote mwenye kutenda mambo ya kuchukiza au ya uongo.
  alternative: Kuchukulia sehemu ya kwanza kuwa inahusu vitu visivyo na uhai pekee, kisha sehemu ya pili watu pekee.
  rationale: Kigiriki kina umbo la jinsi ya kati, “chochote kilicho najisi,” na pia kitenzi-shirikishi kinachotumiwa kama nomino kumaanisha mtu. Tafsiri inahifadhi vipengele vyote bila kuvifanya kuwa kitu kimoja.
- issue: Kinachomaanishwa na “walioandikwa”
  choice: wale walioandikwa
  alternative: wale ambao majina yao yameandikwa
  rationale: Taswira ya kitabu inadokeza majina, lakini neno “majina” halipo wazi katika Kigiriki cha mstari huu; kwa hiyo halijaongezwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. “Kamwe hakitaingia” huweka mkazo wa ukanushaji; “jambo la kuchukiza au la uongo” huepuka Kiswahili kigumu cha “kutenda uongo,” na tanbihi huhifadhi muundo halisi zaidi.
