  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἔχουσα τεῖχος μέγα καὶ ὑψηλόν, ἔχουσα πυλῶνας δώδεκα, καὶ ἐπὶ ⸂τοῖς πυλῶσιν⸃ ἀγγέλους δώδεκα, καὶ ὀνόματα ἐπιγεγραμμένα ἅ ⸀ἐστιν τῶν δώδεκα ⸀φυλῶν υἱῶν Ἰσραήλ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/012.yaml
  text: having a great and high wall, having twelve gates, and at the gates twelve angels, and names inscribed, which are those of the twelve tribes of the sons of Israel.
translation:
  language: sw
  text: Likiwa na ukuta mkubwa na mrefu, malango kumi na mawili, na kwenye malango hayo malaika kumi na wawili, na majina yaliyoandikwa, ambayo ni ya makabila kumi na mawili ya wana wa Israeli.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa usemi wa kimapokeo zaidi, “watoto wa Israeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχουσα
  choice: Ulikuwa na
  rationale: Kitenzi kishirikishi cha kike katika Kigiriki kinaurejelea mji wa mstari uliotangulia. Kiswahili cha kawaida kinahitaji kishazi chenye kitenzi kamili, hivyo 'Ulikuwa na' kinadumisha uhusiano huo kwa uwazi.
- source_word: τεῖχος μέγα καὶ ὑψηλόν
  choice: ukuta mkubwa na mrefu
  rationale: '''Mkubwa'' na ''mrefu'' zinahifadhi sifa zote mbili; kwa ukuta, ''mrefu'' ni usemi wa kawaida wa kueleza kwenda juu bila kuashiria lazima urefu wa upande mmoja hadi mwingine.'
- source_word: πυλῶνας δώδεκα
  choice: malango kumi na mawili
  rationale: '''Malango'' ni neno la kawaida na linalofaa kwa maingilio makubwa ya mji.'
- source_word: ἐπὶ τοῖς πυλῶσιν
  choice: Kwenye malango hayo
  rationale: ἐπί pamoja na hali ya dative ni ya mahali hapa. 'Kwenye' huhifadhi uwezekano wa kuwa katika eneo la malango bila kulazimisha picha ya malaika kusimama juu kabisa ya malango.
- source_word: ἀγγέλους δώδεκα
  choice: malaika kumi na wawili
  rationale: Tafsiri ya moja kwa moja na ya kawaida ya Kiswahili.
- source_word: ὀνόματα ἐπιγεγραμμένα
  choice: majina yalikuwa yameandikwa juu yake
  rationale: Kitenzi ἐπιγράφω kina wazo la kuandika juu ya kitu. Usemi huu ni wa asili zaidi katika Kiswahili kuliko 'yalikuwa yamechongwa,' ambalo lingeongeza namna ya uandishi isiyotajwa.
- source_word: ἅ ἐστιν τῶν δώδεκα φυλῶν
  choice: majina ya makabila kumi na mawili
  rationale: Kigiriki kinayatambulisha majina kuwa ya makabila hayo. Kurudia 'majina' baada ya kistari kunafanya uhusiano huo uwe wazi na wa kawaida katika Kiswahili bila kuongeza taarifa mpya.
- source_word: υἱῶν Ἰσραήλ
  choice: wana wa Israeli
  rationale: Huhifadhi neno la kifamilia la kiume υἱῶν na jina la pamoja la kibiblia, bila kuligeuza kimya kimya kuwa 'watu wa Israeli.'
theological_decisions:
- issue: Tafsiri ya jina la pamoja υἱῶν Ἰσραήλ
  choice: wana wa Israeli
  alternative: watoto wa Israeli
  rationale: Kigiriki kinasema kihalisi 'wana.' Maandishi makuu yanahifadhi neno hilo la kifamilia na mvutano wake wa kimaana; tanbihi inatoa tafsiri pana ya kimapokeo inayoweza kujumuisha kizazi chote.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Sentensi imegawanywa kwa alama za uakifishaji ili kuepuka mfululizo mzito wa vishazi, huku mpangilio wa maelezo ya Kigiriki ukihifadhiwa.
