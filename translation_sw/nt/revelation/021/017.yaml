  text: καὶ ἐμέτρησεν τὸ τεῖχος αὐτῆς ἑκατὸν τεσσεράκοντα τεσσάρων πηχῶν, μέτρον ἀνθρώπου, ὅ ἐστιν ἀγγέλου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/017.yaml
  text: And he measured its wall[a], 144 cubits by human measure, which is also an angel’s measure.
translation:
  language: sw
  text: Akaupima ukuta wake[a] kuwa dhiraa 144, kwa kipimo cha kibinadamu, ambacho pia ni kipimo cha malaika.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa kipimo cha mwanadamu, yaani, cha malaika.” Kigiriki kinaweza kusisitiza ama kwamba malaika alitumia kipimo cha kibinadamu ama kwamba kipimo cha wanadamu na cha malaika vinalingana hapa.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐμέτρησεν
  choice: akaupima
  rationale: Kitenzi hiki kinaonyesha tendo la kupima; muundo wa ‘aka-’ unaendeleza mfululizo wa masimulizi katika muktadha.
- source_word: τὸ τεῖχος αὐτῆς
  choice: ukuta wake
  rationale: τεῖχος ni ukuta wa mji, na kiwakilishi kinarejelea ule mji; ‘wake’ ndiyo namna ya kawaida ya Kiswahili ya kuonyesha umilikaji huo.
- source_word: ἑκατὸν τεσσεράκοντα τεσσάρων πηχῶν
  choice: dhiraa 144
  rationale: ‘Dhiraa’ huhifadhi kipimo cha kale πῆχυς bila kukibadili kuwa kipimo cha kisasa; tarakimu hurahisisha usomaji.
- source_word: μέτρον ἀνθρώπου
  choice: kwa kipimo cha kibinadamu
  rationale: ἀνθρώπου imetumiwa kwa maana ya jumla ya mwanadamu, si lazima mwanaume; usemi huu ni wa asili na unaeleweka katika Kiswahili cha sasa.
- source_word: ὅ ἐστιν ἀγγέλου
  choice: ambacho pia ni kipimo cha malaika
  rationale: Kitenzi na nomino iliyodokezwa katika Kigiriki zimewekwa wazi kwa Kiswahili, huku ‘pia’ ikionyesha ulinganifu bila kufafanua kupita kiasi.
theological_decisions:
- issue: Maana ya μέτρον ἀνθρώπου, ὅ ἐστιν ἀγγέλου
  choice: Kipimo kinaelezwa kuwa cha kibinadamu na pia cha malaika.
  alternative: Kwa kipimo cha mwanadamu, yaani, cha malaika mwenyewe.
  rationale: Kigiriki kimebanwa na kinaweza kusisitiza ama kwamba malaika alitumia kipimo cha kibinadamu ama kwamba vipimo vya wanadamu na malaika vinalingana hapa. Tafsiri kuu inadumisha uhusiano huo bila kuamua jambo ambalo matini haijaweka wazi kabisa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa msomaji wa kawaida. ‘Dhiraa’ limedumishwa kama kipimo cha kale; ‘kibinadamu’ huepuka kuifanya ἀνθρώπου iwe ya jinsia ya kiume pekee.
