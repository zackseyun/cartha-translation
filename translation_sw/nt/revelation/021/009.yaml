id: REV.21.9
reference: Revelation 21:9
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ ἦλθεν εἷς ἐκ τῶν ἑπτὰ ἀγγέλων τῶν ἐχόντων τὰς ἑπτὰ φιάλας, ⸂τῶν γεμόντων⸃ τῶν ἑπτὰ πληγῶν τῶν ἐσχάτων, καὶ ἐλάλησεν μετ’ ἐμοῦ λέγων· Δεῦρο, δείξω σοι τὴν ⸂νύμφην τὴν γυναῖκα⸃ τοῦ ἀρνίου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/009.yaml
  text: Then one of the seven angels who had the seven bowls full of the seven last plagues came and spoke with me[a], saying, “Come, I will show you the bride[b], the wife of the Lamb.”
translation:
  language: sw
  text: Kisha mmoja wa wale malaika saba waliokuwa na mabakuli saba yaliyojaa mapigo saba ya mwisho akaja, akazungumza nami[a], “Njoo, nitakuonyesha bibi-arusi, mke wa Mwanakondoo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “akasema kwangu.” Kigiriki kinasema kihalisi “akazungumza nami.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Kisha
  rationale: Katika mfululizo huu wa masimulizi, “Kisha” linaonyesha hatua inayofuata huku likihifadhi nguvu ya kiunganishi.
- source_word: εἷς ἐκ τῶν ἑπτὰ ἀγγέλων
  choice: mmoja wa wale malaika saba
  rationale: Hii ni namna ya kawaida ya Kiswahili ya kuonyesha mmoja kutoka katika kundi la saba; “wale” hurejelea malaika waliotajwa awali.
- source_word: τῶν ἐχόντων τὰς ἑπτὰ φιάλας
  choice: waliokuwa na mabakuli saba
  rationale: Kirai hiki kinawatambulisha malaika kwa vyombo walivyokuwa navyo. “Mabakuli” huonyesha umbo la φιάλας kwa usahihi kuliko chupa ndogo.
- source_word: τῶν γεμόντων τῶν ἑπτὰ πληγῶν τῶν ἐσχάτων
  choice: yaliyojaa mapigo saba ya mwisho
  rationale: γεμόντων ni ‘yaliyojaa’; πληγῶν katika Ufunuo ni ‘mapigo,’ na ἐσχάτων inaonyesha kwamba ndiyo ya mwisho katika mfululizo.
- source_word: ἐλάλησεν μετ’ ἐμοῦ
  choice: akasema nami
  rationale: “Nami” huhifadhi maana ya msingi ya μετά, ‘pamoja nami,’ katika Kiswahili cha kawaida; “akasema kwangu” pia inawezekana kimuktadha.
- source_word: Δεῦρο
  choice: Njoo
  rationale: Amri fupi na ya moja kwa moja inayolingana na mwaliko wa Kigiriki.
- source_word: δείξω σοι
  choice: nitakuonyesha
  rationale: Huhifadhi moja kwa moja kauli ya wakati ujao na yambwa ya nafsi ya pili.
- source_word: τὴν νύμφην
  choice: bibi-arusi
  rationale: Neno hili la kawaida na lenye hadhi linaonyesha mwanamke katika taswira ya arusi.
- source_word: τὴν γυναῖκα τοῦ ἀρνίου
  choice: mke wa Mwanakondoo
  rationale: Katika uhusiano huu wa ndoa, γυναῖκα ni ‘mke,’ na “Mwanakondoo” huhifadhi cheo cha Kristo katika Ufunuo.
theological_decisions:
- issue: Uhusiano kati ya νύμφην na γυναῖκα
  choice: bibi-arusi, mke wa Mwanakondoo
  alternative: bibi-arusi wa Mwanakondoo
  rationale: Majina yote mawili yamehifadhiwa kama yalivyo katika uhusiano wa ufafanuzi katika Kigiriki, bila kuyabana kuwa jina moja au kupunguza taswira ya ndoa.
- issue: ἀρνίον kama cheo cha Kristo
  choice: Mwanakondoo
  alternative: mwana-kondoo
  rationale: Herufi kubwa inaonyesha matumizi yake kama cheo maalumu cha Yesu katika Ufunuo bila kuongeza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi umefanywa wa kawaida kwa wasomaji wa leo, huku marudio ya ‘saba,’ taswira ya mapigo, na majina mawili ya bibi-arusi yakihifadhiwa.
