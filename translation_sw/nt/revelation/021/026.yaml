  text: καὶ οἴσουσιν τὴν δόξαν καὶ τὴν τιμὴν τῶν ἐθνῶν εἰς αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/026.yaml
  text: and they will bring the glory and the honor of the nations into it[a].
translation:
  language: sw
  text: Nao wataleta ndani yake utukufu na heshima ya mataifa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: Nao
  rationale: Kiunganishi kinaendeleza moja kwa moja maono ya mstari uliotangulia; “Nao” ni muunganisho wa asili katika Kiswahili na pia hubeba kiwakilishi cha wingi kilichomo katika kitenzi cha Kigiriki.
- source_word: οἴσουσιν
  choice: wataleta
  rationale: Ni wakati ujao wa φέρω. “Wataleta” linaonyesha kwa kawaida mwendo wa kitu kutoka nje kwenda ndani ya mji.
- source_word: τὴν δόξαν
  choice: utukufu
  rationale: “Utukufu” huhifadhi maana pana ya δόξα, ikijumuisha fahari na hadhi, pamoja na mwangwi wake wa kibiblia.
- source_word: τὴν τιμὴν
  choice: heshima
  rationale: “Heshima” ndilo neno la kawaida na linalofaa katika jozi hii na “utukufu”; halibani maana kuwa mali au thamani ya vitu.
- source_word: τῶν ἐθνῶν
  choice: ya mataifa
  rationale: “Mataifa” huonyesha makundi ya watu kwa upana bila kuingiza bila sababu utofauti mahsusi kati ya Wayahudi na watu wa mataifa.
- source_word: εἰς αὐτήν
  choice: ndani yake
  rationale: Kiwakilishi kinarejelea mji, Yerusalemu Mpya. Kiswahili hutumia kwa kawaida “yake” kwa mji; muundo huu pia hauna mgongano wa lazima kati ya rejeo la kisarufi na taswira ya mji kama bibi-arusi.
theological_decisions:
- issue: Rejeo na uhuishaji wa αὐτήν
  choice: “ndani yake,” ikirejelea Yerusalemu Mpya/mji
  alternative: “ndani yake huyo,” kwa kusisitiza zaidi uhuishaji wa mji kama mwanamke
  rationale: Kigiriki kina kiwakilishi cha kike kwa sababu πόλις ni nomino ya kike na mji pia unaonyeshwa kama bibi-arusi. Kiswahili hakihitaji kuweka jinsia ya kike katika kiwakilishi hiki; “ndani yake” ni ya kawaida na bado inaruhusu uhuishaji wa muktadha kubaki.
- issue: Maana ya “utukufu na heshima ya mataifa”
  choice: Kuacha kauli ikiwa pana bila kuifafanua kuwa mali, utamaduni, au kodi ya heshima
  alternative: mali ya mataifa; fahari na mema ya pekee ya mataifa; heshima inayotolewa na mataifa
  rationale: Kauli ya Kigiriki ina upana wa kimaanisho, na muktadha haulazimishi tafsiri moja ya kieskatolojia. Tafsiri pana huhifadhi taswira na mvutano wa andiko.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Hakuna tanbihi iliyoongezwa kwa sababu tofauti ya jinsia ya kisarufi ya Kigiriki haihamishiki kwa njia ya moja kwa moja au ya asili katika mfumo wa viwakilishi vya Kiswahili.
