id: REV.21.24
reference: Revelation 21:24
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ περιπατήσουσιν τὰ ἔθνη διὰ τοῦ φωτὸς αὐτῆς· καὶ οἱ βασιλεῖς τῆς γῆς φέρουσιν ⸂τὴν δόξαν αὐτῶν⸃ εἰς αὐτήν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/024.yaml
  text: And the nations will walk by its light[c][b][a], and the kings of the earth will bring their glory into it.
translation:
  language: sw
  text: Mataifa yatatembea kwa nuru yake[a], na wafalme wa dunia wataleta utukufu wao[b] ndani yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kupitia nuru yake.”
    reason: lexical_alternative
  - marker: b
    text: Au, “fahari yao” au “heshima yao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: περιπατήσουσιν
  choice: yatatembea
  rationale: Huhifadhi picha halisi ya kutembea inayoambatana na nuru, badala ya kuigeuza kuwa usemi wa jumla kama ‘yataishi.’
- source_word: τὰ ἔθνη
  choice: Mataifa
  rationale: Huwakilisha maana ya pamoja ya makundi ya watu na tawala zao, na huhifadhi mwangwi wa kinabii wa Agano la Kale.
- source_word: διὰ τοῦ φωτὸς αὐτῆς
  choice: kwa nuru yake
  rationale: ‘Kwa’ linaonyesha kwamba nuru ya mji ndiyo njia au uwezo unaowawezesha mataifa kutembea; pia ni Kiswahili cha kawaida na cha asili.
- source_word: οἱ βασιλεῖς τῆς γῆς
  choice: wafalme wa dunia
  rationale: Ni tafsiri ya kawaida ya usemi huu wa kiapokaliptiki katika Ufunuo na humaanisha watawala wa kidunia.
- source_word: φέρουσιν
  choice: wataleta
  rationale: Ingawa umbo la Kigiriki ni la wakati wa sasa, katika maono haya tendo linaunganishwa na kitenzi cha wakati ujao ‘yatatembea’; wakati ujao hutoa mtiririko wa asili wa Kiswahili bila kupoteza tukio linalotazamiwa.
- source_word: τὴν δόξαν αὐτῶν
  choice: utukufu wao
  rationale: ‘Utukufu’ huhifadhi upana wa δόξα—fahari, heshima na adhama—pamoja na mwangwi wake wa kibiblia.
- source_word: εἰς αὐτήν
  choice: ndani yake
  rationale: Huonyesha mwendo wa kuingia mjini. Kiwakilishi ‘yake’ kinarejelea mji kwa njia ya kawaida katika Kiswahili bila kulazimisha ubinafsishaji wa mji.
theological_decisions:
- issue: Kiwakilishi cha kike kinachorejelea Yerusalemu mpya
  choice: Kutumia ‘yake’ kwa mji
  alternative: Kutumia lugha inayoubinafsisha mji kama mwanamke au bibi-arusi
  rationale: Kigiriki hutumia kiwakilishi cha kike kwa sababu πόλις (‘mji’) ni nomino ya kike kisarufi. Kiswahili hakihitaji kuonyesha jinsia hiyo hapa; muktadha wa karibu unasisitiza mji kama mahali penye nuru na pa kuingiliwa, bila kuondoa taswira pana ya bibi-arusi katika sura hii.
- issue: Maana ya utukufu unaoletwa na wafalme
  choice: Kuacha neno ‘utukufu’ likiwa na maana pana
  alternative: Kulibainisha kuwa mali, fahari pekee, au heshima pekee
  rationale: δόξα linaweza kujumuisha fahari, adhama na heshima. Tafsiri pana huepuka kuamua bila ulazima ni kipengele gani pekee kinacholetwa mjini.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi huhifadhi taswira ya mataifa kutembea kwa nuru ya mji na wafalme kuleta utukufu wao ndani yake; ‘ndani yake’ ni ya kawaida kwa mji na haiongezi ubinafsishaji usio lazima.
