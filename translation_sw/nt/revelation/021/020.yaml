  text: ὁ πέμπτος σαρδόνυξ, ὁ ἕκτος σάρδιον, ὁ ἕβδομος χρυσόλιθος, ὁ ὄγδοος βήρυλλος, ὁ ἔνατος τοπάζιον, ὁ δέκατος χρυσόπρασος, ὁ ἑνδέκατος ὑάκινθος, ὁ δωδέκατος ἀμέθυστος·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/020.yaml
  text: the fifth[a], sardonyx; the sixth, sardius; the seventh, chrysolite; the eighth, beryl; the ninth, topaz; the tenth[b], chrysoprase; the eleventh, jacinth; the twelfth, amethyst.
translation:
  language: sw
  text: wa tano, sardoniki; wa sita, sardi[a]; wa saba, krisolito; wa nane, berili; wa tisa, topazi; wa kumi, krisopraso; wa kumi na moja, yakinto[b]; wa kumi na mbili, amethisto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akiki.” Utambulisho kamili wa jiwe hili la kale hauna uhakika.
    reason: lexical_alternative
  - marker: b
    text: Pia huitwa “hiasinto”; neno la Kigiriki hapa linamaanisha jiwe la thamani, si ua.
    reason: lexical_alternative
lexical_decisions:
- source_word: πέμπτος, ἕκτος, ἕβδομος, ὄγδοος, ἔνατος, δέκατος, ἑνδέκατος, δωδέκατος
  choice: wa tano, wa sita, wa saba, wa nane, wa tisa, wa kumi, wa kumi na moja, wa kumi na mbili
  rationale: Nomino inayotajwa katika muktadha ni “msingi,” kwa hiyo viambishi vya ngeli ya M-WA vinatumika. Muundo wa kurudiwa-rudiwa unahifadhi mfuatano na mahadhi ya Kigiriki.
- source_word: σαρδόνυξ
  choice: sardoniki
  rationale: Jina la jiwe limewasilishwa kwa umbo la mkopo linalotambulika na linalolitofautisha na σάρδιον.
- source_word: σάρδιον
  choice: sardi
  rationale: Umbo la jadi la jina la jiwe linahifadhi utofauti wake na sardoniki; utambulisho kamili wa jiwe hili la kale hauna uhakika.
- source_word: χρυσόλιθος
  choice: krisolito
  rationale: Jina la kawaida la jiwe limetumiwa badala ya tafsiri ya moja kwa moja “jiwe la dhahabu,” ambayo ingeweza kupotosha kuhusu aina yake.
- source_word: βήρυλλος
  choice: berili
  rationale: Hili ni jina la kawaida la madini haya katika Kiswahili.
- source_word: τοπάζιον
  choice: topazi
  rationale: Hili ni jina la kawaida la jiwe hili katika Kiswahili.
- source_word: χρυσόπρασος
  choice: krisopraso
  rationale: Jina la jiwe limetoholewa kwa Kiswahili; kutafsiri vipashio vya jina kihalisi kungekuwa kusikoeleweka.
- source_word: ὑάκινθος
  choice: yakinto
  rationale: Umbo hili linaonyesha kuwa neno linarejelea jiwe la thamani katika orodha hii, si ua.
- source_word: ἀμέθυστος
  choice: amethisto
  rationale: Jina la jiwe limetoholewa kwa namna inayolingana na majina mengine ya vito katika orodha.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi na kinachoeleweka. Orodha imeachwa kama mwendelezo wa sentensi ya mstari uliotangulia, kama ilivyo katika Kigiriki. Majina ya vito yametoholewa kwa uthabiti, huku tanbihi zikihifadhi kutokuwa na uhakika kuhusu utambulisho wa baadhi ya mawe ya kale.
