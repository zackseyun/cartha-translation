  text: Καὶ εἶπεν ὁ καθήμενος ἐπὶ τῷ θρόνῳ· Ἰδοὺ ⸂καινὰ ποιῶ πάντα⸃. καὶ ⸀λέγει· Γράψον, ὅτι οὗτοι οἱ λόγοι ⸂πιστοὶ καὶ ἀληθινοί⸃ εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/005.yaml
  text: And the one seated on the throne said[a], “Behold, I am making all things new.” And he said, “Write[b], because these words are trustworthy and true.”
translation:
  language: sw
  text: Yule aliyeketi juu ya kiti cha enzi akasema, “Tazama, ninafanya kila kitu kuwa kipya.”[a] Naye akasema, “Andika, kwa maana maneno haya ni ya kuaminika na ya kweli.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ninafanya vitu vyote kuwa vipya.” Kigiriki kinaweza kutafsiriwa kwa namna zote mbili; “kila kitu” ni ya kawaida zaidi katika Kiswahili na bado inaonyesha upeo mpana wa usemi huo.
    reason: lexical_alternative
  - marker: b
    text: Usemi uliotafsiriwa “ya kuaminika” unaweza pia kutafsiriwa “aminifu.” Katika muktadha wa maneno, “ya kuaminika” hueleza kwa kawaida zaidi kwamba yanaweza kutegemewa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ καθήμενος ἐπὶ τῷ θρόνῳ
  choice: yule aliyeketi kwenye kiti cha enzi
  rationale: Huhifadhi taswira ya mtawala aliyeketi kwenye kiti cha enzi kwa Kiswahili cha kawaida na chenye hadhi, bila kuongeza utambulisho usiotajwa moja kwa moja katika mstari huu.
- source_word: Ἰδοὺ
  choice: Tazama
  rationale: Ni mwito wa kuelekeza fikira wenye uzito unaofaa usemi wa kinabii; ni wa asili zaidi katika Kiswahili sanifu kuliko tafsiri ya kawaida mno kama ‘Angalia’.
- source_word: καινὰ ποιῶ πάντα
  choice: ninafanya kila kitu kuwa kipya
  rationale: ‘Ninafanya’ huonyesha tendo linalotangazwa katika wakati wa sasa na hubaki karibu na ποιῶ bila kuingiza dhana mahsusi ya ‘kuumba.’ ‘Kila kitu’ huwasilisha upeo mpana wa πάντα, huku ‘kuwa kipya’ kikiacha wazi kama kinachosisitizwa ni kufanywa upya au hali mpya kabisa.
- source_word: Γράψον
  choice: Andika
  rationale: Huhifadhi amri ya moja kwa moja bila kuongeza yambwa lisilokuwapo wazi katika Kigiriki.
- source_word: ὅτι
  choice: kwa maana
  rationale: Katika muktadha huu huonyesha sababu ya amri ya kuandika kwa Kiswahili fasaha; maneno hayo yanapaswa kuandikwa kwa kuwa ni ya kutegemewa.
- source_word: οὗτοι οἱ λόγοι
  choice: maneno haya
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya λόγοι inapomaanisha ujumbe au matamko yaliyotolewa.
- source_word: πιστοὶ καὶ ἀληθινοί
  choice: ya kuaminika na ya kweli
  rationale: ‘Ya kuaminika’ hueleza kwa kawaida kwamba maneno hayo yanaweza kutegemewa, na ‘ya kweli’ huhifadhi maana ya ἀληθινοί pamoja na nguvu ya jozi hiyo.
theological_decisions:
- issue: Upeo na namna ya upya katika καινὰ ποιῶ πάντα
  choice: ninafanya kila kitu kuwa kipya
  alternative: ninafanya vitu vyote kuwa vipya
  rationale: Tafsiri iliyochaguliwa ni ya kawaida na pana katika Kiswahili. Haikati shauri ikiwa uumbaji unabadilishwa kabisa au unafanywa upya, hivyo huhifadhi mvutano wa kitheolojia uliomo katika usemi wa Kigiriki.
- issue: Utambulisho wa msemaji kwa taswira ya kiti cha enzi
  choice: yule aliyeketi kwenye kiti cha enzi
  alternative: yeye aketiye juu ya kiti cha enzi
  rationale: Humtambulisha msemaji kwa taswira iliyopo katika mstari bila kuingiza maelezo ya ziada ya kimafundisho.
- issue: Wakati wa kitenzi katika καὶ λέγει
  choice: Kisha akasema
  alternative: Naye anasema
  rationale: Kigiriki kinatumia wakati wa sasa wa kisimulizi baada ya kitenzi cha wakati uliopita. Kiswahili huendeleza simulizi kwa kawaida kwa ‘akasema’; chaguo hili halibadili msemaji wala maudhui ya usemi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Tazama’ huhifadhi uzito wa usemi wa kinabii, huku sentensi nyingine zikitumia miundo ya kawaida inayoeleweka kwa wasomaji wa leo.
