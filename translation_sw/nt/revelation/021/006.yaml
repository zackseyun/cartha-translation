  source_fidelity: Tafsiri inawakilisha kwa uaminifu SBLGNT. “Mambo hayo yametimia” hudumisha wingi wa Γέγοναν na maana yake ya utimilifu; “Mimi ni Alfa na Omega, mwanzo na mwisho” huhifadhi vyeo na uunganisho wa asili; na ahadi kwa mwenye kiu, chemchemi ya maji ya uzima, na utoaji wa bure vyote vimehifadhiwa.
  naturalness: Kiswahili ni sanifu, cha sasa, na chenye mtiririko wa heshima unaofaa kwa Ufunuo. “Naye akaniambia,” “mwenye kiu,” na “kutoka katika chemchemi ya maji ya uzima” ni miundo ya asili. Nafasi ya “bure” mwishoni inaeleweka vizuri kama sifa ya utoaji.
