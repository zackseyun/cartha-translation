id: REV.21.6
reference: Revelation 21:6
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ εἶπέν μοι· ⸂Γέγοναν. ἐγὼ⸃ τὸ Ἄλφα καὶ τὸ Ὦ, ἡ ἀρχὴ καὶ τὸ τέλος. ἐγὼ τῷ διψῶντι δώσω ἐκ τῆς πηγῆς τοῦ ὕδατος τῆς ζωῆς δωρεάν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/006.yaml
  text: And he said to me[a], “It is done. I am the Alpha and the Omega, the beginning and the end[b]. To the one who is thirsty I will give from the spring of the water of life freely.”
translation:
  language: sw
  text: Naye akaniambia, “Mambo hayo yametimia[a]. Mimi ni Alfa na Omega, mwanzo na mwisho. Mwenye kiu nitampa maji kutoka katika chemchemi ya maji ya uzima, bure[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au kwa tafsiri iliyozoeleka, “Imekwisha.” Kitenzi cha Kigiriki kiko katika wingi: “yametukia” au “mambo haya yametukia.”'
    reason: alternative_reading
  - marker: b
    text: Au “bila malipo” au “kama zawadi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Γέγοναν
  choice: Mambo hayo yametimia
  rationale: Kitenzi cha Kigiriki kiko katika wingi na hali timilifu. Tafsiri hii inaonyesha kwamba mambo yaliyotangazwa yametokea na kufikia utimilifu, badala ya kuyafanya kuwa jambo moja tu.
- source_word: τὸ Ἄλφα καὶ τὸ Ὦ
  choice: Alfa na Omega
  rationale: Majina ya herufi za kwanza na za mwisho za alfabeti ya Kigiriki yamehifadhiwa kama cheo cha mfano kilichozoeleka katika Ufunuo; kirai kinachofuata kinafafanua maana yake.
- source_word: ἡ ἀρχὴ καὶ τὸ τέλος
  choice: mwanzo na mwisho
  rationale: Ni tafsiri ya kawaida na ya asili inayohifadhi upeo wa kirai bila kuongeza ufafanuzi wa kiteolojia.
- source_word: τῷ διψῶντι
  choice: mwenye kiu
  rationale: Kirai hiki cha Kiswahili ni cha asili, kinamtaja mtu mmoja mwenye sifa ya kuwa na kiu, na hakilazimishi maana kuwa kiu ya kimwili pekee.
- source_word: δώσω
  choice: nitampa
  rationale: Huhifadhi ahadi rahisi ya wakati ujao na pia yambwa ya mtu anayepokea.
- source_word: ἐκ τῆς πηγῆς
  choice: kutoka katika chemchemi
  rationale: Chemchemi ni neno la kawaida kwa chanzo cha maji yanayotoka ardhini na linafaa kwa taswira ya maji yatoayo uzima.
- source_word: τοῦ ὕδατος τῆς ζωῆς
  choice: ya maji ya uzima
  rationale: Huhifadhi muundo na taswira ya kibiblia ya chanzo cha maji ya uzima badala ya kuifafanua kuwa maji yanayotoa uzima.
- source_word: δωρεάν
  choice: bure
  rationale: Neno hili linaonyesha kwa ufupi kwamba maji hayo yanatolewa bila kudai malipo; tanbihi inahifadhi pia dhana ya zawadi.
theological_decisions:
- issue: Tamko la Mungu Γέγοναν likiwa katika wingi
  choice: Mambo hayo yametimia
  alternative: Imekwisha
  rationale: Wingi wa Kigiriki unaelekeza kwa mambo kadhaa yaliyotangazwa kuhusu uumbaji mpya. Kutaja “mambo hayo” kunafanya wingi huo ueleweke kwa Kiswahili bila kuubadili kuwa tamko la umoja.
- issue: Kuhifadhi taswira ya Alfa na Omega kama cheo cha Mungu
  choice: Alfa na Omega
  alternative: A na Z
  rationale: Kuhifadhi majina ya herufi za Kigiriki kunadumisha taswira maalumu na mwangwi wake katika kitabu cha Ufunuo, huku “mwanzo na mwisho” ikieleza nguvu ya mfano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Naye akaniambia” na “mwenye kiu” ni miundo ya kawaida yenye mtiririko wa kibiblia bila kuwa ya kizamani. Alama za tanbihi zimewekwa moja kwa moja baada ya maneno yanayohusika.
