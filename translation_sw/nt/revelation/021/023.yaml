id: REV.21.23
reference: Revelation 21:23
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἡ πόλις οὐ χρείαν ἔχει τοῦ ἡλίου οὐδὲ τῆς σελήνης, ἵνα φαίνωσιν αὐτῇ, ἡ γὰρ δόξα τοῦ θεοῦ ἐφώτισεν αὐτήν, καὶ ὁ λύχνος αὐτῆς τὸ ἀρνίον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/023.yaml
  text: And the city has no need of the sun or of the moon to shine on it[a], for the glory of God gave it light, and its lamp is the Lamb.
translation:
  language: sw
  text: Na mji huo hauhitaji jua wala mwezi kuuangaza[a], kwa maana utukufu wa Mungu uliutia nuru, na taa yake ni Mwanakondoo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuupatia nuru.” Kigiriki kinasema kihalisi “kuangaza kwa ajili yake/juu yake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πόλις
  choice: mji
  rationale: Ni maana ya kawaida katika muktadha wa Yerusalemu Mpya, na ni tafsiri ya moja kwa moja na ya asili katika Kiswahili.
- source_word: οὐ χρείαν ἔχει
  choice: hauhitaji
  rationale: Huwasilisha kwa Kiswahili cha kawaida maana ya nahau ya Kigiriki ya kutokuwa na haja ya kitu.
- source_word: τοῦ ἡλίου οὐδὲ τῆς σελήνης
  choice: jua wala mwezi
  rationale: Muundo wa 'wala' unaonyesha ukanushaji wa vitu vyote viwili kwa ufupi na kwa ufasaha.
- source_word: ἵνα φαίνωσιν αὐτῇ
  choice: kuuangaza
  rationale: Kwa kuwa jua na mwezi ndio watendaji, φαίνω hubeba maana ya kuangaza; kiambishi -u- kinarejelea mji. Tanbihi huhifadhi uwezekano wa kuelewa dative αὐτῇ kama 'kwa ajili yake'.
- source_word: δόξα
  choice: utukufu
  rationale: Ni istilahi sanifu yenye uzito wa kiteolojia na inafaa kwa taswira ya Ufunuo.
- source_word: ἐφώτισεν
  choice: uliuangazia
  rationale: Hutofautisha kwa kiasi na 'kuuangaza' huku ikibaki katika uwanja halisi wa nuru na kudumisha umbo la wakati uliopita la aoristi.
- source_word: λύχνος
  choice: taa
  rationale: Neno hili humaanisha taa, si nuru kwa ujumla wala kinara cha taa; linahifadhi taswira hususa ya maandiko.
- source_word: ἀρνίον
  choice: Mwanakondoo
  rationale: Katika Ufunuo ni jina la kimasiha la Yesu; herufi kubwa huonyesha matumizi hayo kama cheo bila kuongeza maelezo.
theological_decisions:
- issue: Uhusiano wa kisitiari katika 'taa yake ni Mwanakondoo'
  choice: 'Kudumisha sitiari moja kwa moja: ''taa yake ni Mwanakondoo.'''
  alternative: '''Mwanakondoo ndiye nuru yake'' au ''Mwanakondoo ndiye taa yake.'''
  rationale: Kigiriki hutumia λύχνος, 'taa,' si neno la jumla la nuru. Muundo huu pia hudumisha tofauti kati ya utukufu wa Mungu unaouangazia mji na Mwanakondoo aliye taa yake.
- issue: Taswira ya nuru ya Mungu
  choice: Kutafsiri bila kuongeza ufafanuzi wa kinadharia kuhusu nyakati za mwisho.
  alternative: Kupanua kwa kusema kwamba Mungu anachukua nafasi ya mianga yote iliyoumbwa.
  rationale: Aya yenyewe inasema tu kwamba mji hauhitaji jua wala mwezi kwa sababu utukufu wa Mungu uliuangazia na Mwanakondoo ni taa yake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. 'Na ule mji' hudumisha kiunganishi καί na urejeleo maalumu wa ἡ πόλις; 'wala' ni muundo wa asili wa jozi iliyokanushwa.
