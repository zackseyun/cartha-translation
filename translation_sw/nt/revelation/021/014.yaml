  text: καὶ τὸ τεῖχος τῆς πόλεως ⸀ἔχων θεμελίους δώδεκα, καὶ ἐπ’ αὐτῶν δώδεκα ὀνόματα τῶν δώδεκα ἀποστόλων τοῦ ἀρνίου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/014.yaml
  text: And the wall of the city had twelve foundations[a], and on them were the twelve names of the twelve apostles of the Lamb.
translation:
  language: sw
  text: Na ukuta wa mji ulikuwa na misingi kumi na miwili[a], na juu ya misingi hiyo kulikuwa na majina kumi na mawili ya mitume kumi na wawili wa Mwanakondoo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mawe kumi na mawili ya msingi.” Neno la Kigiriki θεμελίους linaweza kumaanisha misingi au mawe ya msingi katika mazingira ya ujenzi.
    reason: lexical_alternative
lexical_decisions:
- source_word: τεῖχος
  choice: ukuta
  rationale: Katika muktadha huu neno hilo linamaanisha ukuta wa mji; ‘ukuta’ ni tafsiri ya kawaida na sahihi kwa Kiswahili.
- source_word: πόλεως
  choice: wa mji
  rationale: 'Huwakilisha uhusiano wa umilikaji au kuhusiana: ukuta unaouhusu mji.'
- source_word: ἔχων
  choice: ulikuwa na
  rationale: Ingawa Kigiriki kina umbo la kitenzi tegemezi lenye maana ya ‘ukiwa na,’ sentensi kamili ‘ulikuwa na’ ni ya asili katika simulizi la maono.
- source_word: θεμελίους δώδεκα
  choice: misingi kumi na miwili
  rationale: θεμέλιος inaweza kumaanisha misingi au mawe ya msingi. ‘Misingi’ ni tafsiri ya moja kwa moja, huku maana nyingine ikihifadhiwa katika tanbihi.
- source_word: ἐπ’ αὐτῶν
  choice: juu yake
  rationale: Kiwakilishi kinarejelea misingi; katika Kiswahili ‘juu yake’ ni ya kawaida kwa nomino ya ngeli ya MI katika wingi.
- source_word: ὀνόματα
  choice: majina
  rationale: Maandishi yanasema ‘majina’ bila kueleza wazi kuwa yalikuwa maandishi yaliyochongwa, hivyo hakuna maelezo ya ziada yanayoingizwa.
- source_word: ἀποστόλων
  choice: mitume
  rationale: ‘Mitume’ ndilo neno la kawaida la Kibiblia na la Kiswahili kwa cheo hiki maalumu cha Agano Jipya.
- source_word: τοῦ ἀρνίου
  choice: wa Mwanakondoo
  rationale: ‘Mwanakondoo’ huhifadhi jina la kimfano linalotumiwa kwa Yesu katika Ufunuo, na ‘wa’ huwasilisha hali ya Kigiriki ya kuhusiana au kuwa mali ya.
theological_decisions:
- issue: Jina la Kikristo ἀρνίου
  choice: Mwanakondoo
  alternative: mwanakondoo
  rationale: Katika Ufunuo, ἀρνίον hutumiwa mara kwa mara kama jina la kimfano la Yesu aliyetukuzwa. Herufi kubwa huonyesha matumizi hayo kama jina bila kuongeza maana isiyokuwamo katika maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo unaendeleza mtiririko wa maono kwa ‘Na,’ na marudio ya ‘kumi na miwili/kumi na mawili/kumi na wawili’ yanahifadhiwa kulingana na upatanisho wa kisarufi wa Kiswahili.
