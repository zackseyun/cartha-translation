base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/007.yaml
  text: The one who overcomes will inherit these things[a], and I will be his God[b], and he will be my son.
translation:
  language: sw
  text: Yeye anayeshinda atarithi mambo haya[a], nami nitakuwa Mungu wake, naye atakuwa mwanangu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yeye ashindaye.” Kitenzi cha Kigiriki νικάω kinajirudia katika Ufunuo kwa maana ya kushinda au kupata ushindi, hasa katika kudumu kwa uaminifu.
    reason: lexical_alternative
  - marker: b
    text: Kigiriki, “atakuwa mwanangu.” Neno la kiume huenda linatumika hapa kwa nguvu ya uwakilishi, lakini tafsiri imehifadhi lugha ya mwana iliyomo katika matini ya chanzo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ νικῶν
  choice: Yeye anayeshinda
  rationale: Kirai hiki cha Kigiriki ni kishiriki cha wakati uliopo chenye kazi ya nomino, kikimtaja mtu anayetambulika kwa kushinda. “Yeye anayeshinda” ni Kiswahili cha kawaida na huhifadhi wazo la kuendelea kuwa mshindi kwa uaminifu katika matumizi ya neno hili yanayojirudia katika Ufunuo.
- source_word: κληρονομήσει
  choice: atarithi
  rationale: Kitenzi hiki humaanisha kupokea au kumiliki kama urithi. “Atarithi” ni tafsiri ya moja kwa moja inayohifadhi pia maana ya kifamilia na ya agano inayoungana na kauli inayofuata kuhusu Mungu na mwana.
- source_word: ταῦτα
  choice: mambo haya
  rationale: Kiwakilishi hiki cha wingi humaanisha kihalisi “haya” au “mambo haya” na kinarejelea mambo yaliyotangulia katika maono. “Mambo haya” huhifadhi wingi wa Kigiriki na ni cha asili katika Kiswahili.
- source_word: ἔσομαι αὐτῷ θεὸς
  choice: nitakuwa Mungu wake
  rationale: Muundo huu una nguvu ya uhusiano na unaakisi kauli ya agano. “Nitakuwa Mungu wake” ni Kiswahili cha kawaida kinachowasilisha uhusiano huo bila kuongeza ufafanuzi.
- source_word: αὐτὸς ἔσται μοι υἱός
  choice: naye atakuwa mwanangu
  rationale: Muundo huu unaeleza uhusiano wa mwana na unaakisi lugha ya agano na urithi. “Atakuwa mwanangu” ni wa asili katika Kiswahili na huhifadhi taswira ya kifamilia ya chanzo.
- source_word: υἱός
  choice: mwana
  rationale: Neno la Kigiriki ni la kiume na linamaanisha “mwana.” Hapa linaweza kumwakilisha yeyote anayeshinda, lakini “mwana” huhifadhi kwa usahihi lugha ya urithi na uhusiano wa kifamilia badala ya kuibadili kuwa “mtoto.”
theological_decisions:
- issue: Lugha ya “mwana” katika ahadi inayomhusu kwa ujumla anayeshinda
  choice: Kuhifadhi “mwanangu” katika matini kuu
  alternative: mtoto wangu
  rationale: Kigiriki kinatumia wazi nomino ya kiume υἱός. Ingawa hapa inaelekea kuwa na nguvu ya uwakilishi, taswira ya mwana inahusiana moja kwa moja na urithi na agano, hivyo haipaswi kusawazishwa kimya kimya katika matini kuu.
- issue: Mwangwi wa kauli ya agano
  choice: “nitakuwa Mungu wake, naye atakuwa mwanangu”
  alternative: “nitakuwa Mungu kwake, naye atakuwa mwana kwangu”
  rationale: Tafsiri iliyochaguliwa ni ya asili zaidi katika Kiswahili huku ikihifadhi uhusiano wa agano na wa kifamilia uliomo katika Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Muundo ni mfupi na wa moja kwa moja kama chanzo; lugha ya agano, urithi na mwana imehifadhiwa bila kuingiza msimamo wa dhehebu.
