id: REV.21.19
reference: Revelation 21:19
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ⸀οἱ θεμέλιοι τοῦ τείχους τῆς πόλεως παντὶ λίθῳ τιμίῳ κεκοσμημένοι· ὁ θεμέλιος ὁ πρῶτος ἴασπις, ὁ δεύτερος σάπφιρος, ὁ τρίτος χαλκηδών, ὁ τέταρτος σμάραγδος,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/019.yaml
  text: 'The foundations of the wall of the city were adorned with every kind of precious stone: the first foundation was jasper[a], the second sapphire, the third chalcedony, the fourth emerald[b],'
translation:
  language: sw
  text: 'Misingi ya ukuta wa jiji ilikuwa imepambwa kwa kila aina ya jiwe la thamani[a]: msingi wa kwanza ulikuwa yaspi, wa pili yakuti samawi, wa tatu kalkedoni[b], na wa nne zumaridi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa kila jiwe la thamani.” Kishazi cha Kigiriki kinaweza kueleweka kwa maana ya mgawanyo, yaani, “kwa kila aina ya jiwe la thamani.”
    reason: lexical_alternative
  - marker: b
    text: “Kalkedoni” ni tafsiri ya kimapokeo ya neno la Kigiriki; utambulisho kamili wa baadhi ya vito vya kale hauna uhakika.
    reason: cultural_note
lexical_decisions:
- source_word: θεμέλιοι
  choice: misingi
  rationale: Nomino ya wingi inarejelea misingi ya ukuta wa jiji; “misingi” ni tafsiri ya kawaida na ya asili kuliko kuongeza “mawe ya msingi,” jambo ambalo lingeifanya tafsiri iwe ya kufafanua zaidi.
- source_word: τεῖχος
  choice: ukuta
  rationale: Hii ndiyo maana ya kawaida ya neno hilo katika muktadha huu; hakuna haja ya kuongeza wazo la ngome lisilotajwa wazi.
- source_word: πόλεως
  choice: jiji
  rationale: Katika maono haya πόλις ni jiji la kieskatolojia; “jiji” linaonyesha vizuri ukubwa na hadhi yake kuliko “mji.”
- source_word: παντὶ λίθῳ τιμίῳ
  choice: kwa kila aina ya jiwe la thamani
  rationale: Muundo wa Kigiriki unaonyesha kile kilichotumiwa kupambia. “Kila aina ya” huwasilisha kwa Kiswahili maana inayoweza kuwa ya mgawanyo, huku tanbihi ikihifadhi uwezekano wa tafsiri ya moja kwa moja zaidi.
- source_word: κεκοσμημένοι
  choice: ilikuwa imepambwa
  rationale: Kauli timilifu tendwa inaonyesha hali iliyotokana na tendo lililokamilika. “Ilikuwa imepambwa” huhifadhi hali hiyo na mtindo wenye hadhi.
- source_word: ὁ θεμέλιος ὁ πρῶτος
  choice: msingi wa kwanza
  rationale: Umoja hapa unaanza kuhesabu kila msingi mmoja baada ya mwingine. Kiswahili hiki ni cha moja kwa moja bila kuongeza “jiwe” lisilotajwa wazi.
- source_word: ἴασπις
  choice: yaspi
  rationale: Hili ndilo jina la kawaida la Kiswahili la jiwe hili katika mapokeo ya Biblia.
- source_word: σάπφιρος
  choice: yakuti samawi
  rationale: Ni jina la kawaida la Kiswahili kwa sapphire na hutofautisha jiwe hili kwa uwazi katika orodha.
- source_word: χαλκηδών
  choice: kalkedoni
  rationale: Uhamishaji huu wa jina huhifadhi istilahi ya kimapokeo kwa sababu utambulisho kamili wa jiwe la kale hauna uhakika.
- source_word: σμάραγδος
  choice: zumaridi
  rationale: Hili ndilo jina la kawaida na linaloeleweka la Kiswahili kwa emerald, ingawa utambulisho wa baadhi ya vito vya kale unaweza kuwa wa kukadiria.
theological_decisions:
- issue: Uwasilishaji wa orodha ya vito katika maelezo ya kiapokaliptiki
  choice: Kutafsiri majina ya vito moja kwa moja bila kuyawekea maana za kiishara katika matini kuu.
  alternative: Kuyafasiri mawe hayo kama ishara za makabila ya Israeli, mitume, au mavazi ya kikuhani.
  rationale: Aya yenyewe inataja mapambo lakini haifafanui ishara ya kila jiwe. Tafsiri inapaswa kuhifadhi taswira na kutoweka mfumo wa kiteolojia ambao haujaelezwa wazi katika Kigiriki.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa msomaji wa kawaida. Muundo wa sentensi unahifadhi mpangilio wa Kigiriki huku ukitumia majina ya vito yanayotambulika katika Kiswahili cha Biblia.
