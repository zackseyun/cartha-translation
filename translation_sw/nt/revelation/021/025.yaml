translation:
  language: sw
  text: Na malango yake hayatafungwa kamwe wakati wa mchana, kwa maana huko hakutakuwa na usiku.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa namna ya kusisitiza zaidi: “Malango yake kwa hakika hayatafungwa kamwe wakati wa mchana.” Kigiriki kinatumia ukanushaji wenye mkazo.'
