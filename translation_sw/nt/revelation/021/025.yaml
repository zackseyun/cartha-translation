lexical_decisions:
- source_word: πυλῶνες
  choice: malango
  rationale: Katika muktadha wa mji, neno hili linamaanisha malango au miundo ya kuingilia mjini; “malango” ni neno la kawaida na linalofaa kwa taswira ya Yerusalemu Mpya.
- source_word: οὐ μὴ κλεισθῶσιν
  choice: hayatafungwa kamwe
  rationale: Muundo οὐ μή pamoja na kitenzi cha hali tegemezi unatoa ukanushaji wenye mkazo kuhusu wakati ujao; “hayatafungwa kamwe” huwasilisha nguvu hiyo kwa Kiswahili cha kawaida.
- source_word: ἡμέρας
  choice: wakati wa mchana
  rationale: Hapa ni matumizi ya wakati yanayotofautisha mchana na usiku unaotajwa baadaye.
- source_word: νὺξ γὰρ οὐκ ἔσται ἐκεῖ
  choice: kwa maana huko hakutakuwa na usiku
  rationale: “Kwa maana” huhifadhi kazi ya γάρ ya kutoa sababu, na “hakutakuwa na usiku” huhifadhi maana ya uwepo iliyo katika ἔσται.
- source_word: καὶ
  choice: Na
  rationale: Kiunganishi rahisi kinachounganisha sentensi hii na maelezo yaliyotangulia.
- source_word: αὐτῆς
  choice: yake
  rationale: Kiwakilishi hiki kinarejelea mji. Kiswahili hakihitaji kuingiza jinsia ya kisarufi ya Kigiriki; “yake” ni ya kawaida na huhifadhi rejeleo kwa mji.
theological_decisions:
- issue: Kiwango cha kuupa Yerusalemu Mpya sifa za kibinadamu
  choice: Kutumia “malango yake” bila kuonyesha jinsia ya kike
  alternative: Kutumia usemi unaosisitiza taswira ya mji kama mwanamke au bibi-arusi
  rationale: Kiwakilishi cha Kigiriki ni cha kike kwa sababu ya upatanisho wa kisarufi na neno la mji. Katika Kiswahili, “yake” ni ya kawaida na haifuti wala kulazimisha taswira ya bibi-arusi ambayo haijasisitizwa katika kishazi hiki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. “Wakati wa mchana” limetumiwa kwa uwazi, na “kwa maana” limehifadhi uhusiano wa sababu unaoonyeshwa na γάρ.
