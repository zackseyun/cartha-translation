source:
  edition: SBLGNT
  text: καὶ ἤκουσα φωνῆς μεγάλης ἐκ τοῦ ⸀θρόνου λεγούσης· Ἰδοὺ ἡ σκηνὴ τοῦ θεοῦ μετὰ τῶν ἀνθρώπων, καὶ σκηνώσει μετ’ αὐτῶν, καὶ αὐτοὶ ⸀λαοὶ αὐτοῦ ἔσονται, καὶ αὐτὸς ὁ θεὸς ⸂μετ’ αὐτῶν ἔσται⸃,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/003.yaml
  text: And I heard a loud voice from the throne saying[a], “Behold, the dwelling place of God is with humanity, and he will dwell with them, and they will be his peoples[d][c][b], and God himself will be with them.”
translation:
  language: sw
  text: Kisha nikasikia sauti kubwa kutoka kwenye kiti cha enzi ikisema, “Tazama! Makao ya Mungu yako pamoja na wanadamu,[a] naye atakaa pamoja nao.[b] Wao watakuwa watu wake,[c] na Mungu mwenyewe atakuwa pamoja nao.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno halisi zaidi, “Hema la Mungu liko pamoja na wanadamu.” Neno la Kigiriki σκηνή linaibua taswira ya hema takatifu, yaani maskani ya Mungu.
    reason: lexical_alternative
  - marker: b
    text: Kitenzi cha Kigiriki kinahusiana na neno “hema”; kwa neno halisi zaidi, “atapiga hema pamoja nao.”
    reason: lexical_alternative
  - marker: c
    text: Kigiriki kina λαοί, “watu wake,” katika wingi—yaani “peoples”—badala ya umoja wa kimapokeo “people.” Kiswahili “watu wake” halionyeshi tofauti hiyo kwa uwazi.
    reason: alternative_reading
lexical_decisions:
- source_word: φωνῆς μεγάλης
  choice: sauti kubwa
  rationale: Katika muktadha huu μέγας inaonyesha nguvu au ukubwa wa sauti; ‘sauti kubwa’ ni Kiswahili cha kawaida na chenye hadhi.
- source_word: ἐκ τοῦ θρόνου
  choice: kutoka kwenye kiti cha enzi
  rationale: Huhifadhi chanzo cha sauti na taswira ya chumba cha kiti cha enzi katika Ufunuo.
- source_word: Ἰδοὺ
  choice: Tazama!
  rationale: Ni mwito wa kuzingatia tangazo linalofuata, na ni wa asili zaidi katika Kiswahili cha sasa kuliko ‘Angalia’ katika muktadha huu wa kinabii.
- source_word: ἡ σκηνὴ τοῦ θεοῦ
  choice: Makao ya Mungu
  rationale: σκηνή ni hema au maskani, lakini hapa linaonyesha mahali Mungu anapokaa; ‘makao’ ni wazi huku dokezo likihifadhi taswira ya hema.
- source_word: μετὰ τῶν ἀνθρώπων
  choice: pamoja na wanadamu
  rationale: ἄνθρωποι hapa inawahusu binadamu kwa ujumla bila kuwalenga wanaume pekee.
- source_word: σκηνώσει
  choice: atakaa
  rationale: Hutoa maana ya msingi ya kukaa miongoni mwao kwa Kiswahili cha kawaida; dokezo linaeleza uhusiano wake na σκηνή na taswira ya kupiga hema.
- source_word: λαοὶ αὐτοῦ
  choice: watu wake wa mataifa mbalimbali
  rationale: Hufanya wingi wa λαοί usikike kwa Kiswahili cha asili bila kutumia ‘watu wake’ pekee, ambako tofauti ya umoja na wingi haionekani wazi.
- source_word: αὐτὸς ὁ θεός
  choice: Mungu mwenyewe
  rationale: ‘Mwenyewe’ huhifadhi msisitizo wa αὐτός juu ya kuwapo kwa Mungu binafsi.
- source_word: μετ’ αὐτῶν ἔσται
  choice: atakuwa pamoja nao
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kauli ya wakati ujao kuhusu kuwapo kwa Mungu pamoja nao.
theological_decisions:
- issue: Wingi wa λαοί dhidi ya tafsiri ya kimapokeo ya umoja
  choice: watu wake wa mataifa mbalimbali
  alternative: watu wake
  rationale: Maandishi ya SBLGNT yana λαοί katika wingi. Kiswahili ‘watu’ hakionyeshi wazi tofauti ya umoja na wingi katika maana hii, kwa hiyo ‘wa mataifa mbalimbali’ huonyesha kwa kawaida kwamba makundi mengi ya watu yanakusudiwa bila kuyafanya taifa moja tu.
- issue: Taswira ya hema katika σκηνή / σκηνόω
  choice: Makao ya Mungu ... atakaa pamoja nao
  alternative: Hema la Mungu ... atapiga hema pamoja nao
  rationale: Matini kuu inatanguliza uwazi wa Kiswahili cha sasa, huku dokezo likihifadhi mwangwi muhimu wa hema takatifu na kukaa kwa Mungu kati ya wanadamu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Makao’ na ‘atakaa’ vinaweka sentensi wazi kwa wasomaji wa kawaida; madokezo yanahifadhi taswira ya hema. ‘Watu wake wa mataifa mbalimbali’ hutumiwa ili wingi wa Kigiriki usipotee katika neno la Kiswahili ‘watu’, ambalo linaweza kuficha tofauti hiyo.
