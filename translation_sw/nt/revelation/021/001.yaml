id: REV.21.1
reference: Revelation 21:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ εἶδον οὐρανὸν καινὸν καὶ γῆν καινήν· ὁ γὰρ πρῶτος οὐρανὸς καὶ ἡ πρώτη γῆ ἀπῆλθαν, καὶ ἡ θάλασσα οὐκ ἔστιν ἔτι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/001.yaml
  text: And I saw a new heaven and a new earth[a], for the first heaven and the first earth had passed away[b], and the sea is no more.
translation:
  language: sw
  text: Kisha nikaona mbingu mpya na dunia mpya, kwa maana mbingu ya kwanza na dunia ya kwanza[a] zilikuwa zimepita, na bahari haikuwapo tena[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mbingu ya zamani na dunia ya zamani.” Kigiriki kinasema “mbingu ya kwanza na dunia ya kwanza,” huenda kikimaanisha mpangilio wa awali ukilinganishwa na ule mpya.
    reason: lexical_alternative
  - marker: b
    text: “Bahari” inaweza kueleweka kihalisi, ingawa katika kitabu cha Ufunuo inaweza pia kuhusishwa na machafuko, hatari, au utengano.
    reason: cultural_note
lexical_decisions:
- source_word: εἶδον
  choice: nikaona
  rationale: Aoristi ya ὁράω imetafsiriwa kwa wakati uliopita wa masimulizi; kiunganishi “ni-” baada ya “Kisha” kinaendeleza mtiririko wa maono kwa Kiswahili cha kawaida.
- source_word: οὐρανὸν ... γῆν
  choice: mbingu ... dunia
  rationale: Katika muktadha huu wa ulimwengu wote, maneno haya yanahusu mpangilio wa uumbaji, si anga na ardhi pekee. “Mbingu na dunia” ni jozi ya kawaida na yenye hadhi katika Kiswahili.
- source_word: καινὸν ... καινήν
  choice: mpya ... mpya
  rationale: “Mpya” huhifadhi maana ya καινός bila kuamua kama uumbaji umebadilishwa kabisa au umefanywa upya.
- source_word: ὁ πρῶτος οὐρανὸς καὶ ἡ πρώτη γῆ
  choice: mbingu ya kwanza na dunia ya kwanza
  rationale: “Ya kwanza” ni tafsiri ya moja kwa moja ya πρῶτος na inadumisha utofautishaji kati ya mpangilio wa awali na ule mpya; “ya zamani” pia inawezekana lakini ina tafsiri zaidi ndani yake.
- source_word: ἀπῆλθαν
  choice: zilikuwa zimepita
  rationale: Muundo huu unaonyesha kwamba kutoweka kwa mbingu na dunia ya kwanza kulitangulia hali ambayo Yohana aliiona, huku “kupita” kikihifadhi picha ya kuondoka bila kuongeza maelezo.
- source_word: ἡ θάλασσα
  choice: bahari
  rationale: Hii ndiyo maana ya moja kwa moja ya θάλασσα. Uwezekano wa maana ya kiishara haujaingizwa katika matini kuu.
- source_word: οὐκ ἔστιν ἔτι
  choice: haikuwapo tena
  rationale: Ni usemi wa kawaida na wazi unaowasilisha hali ya kutokuwapo tena katika maono hayo.
theological_decisions:
- issue: Asili ya “mbingu mpya na dunia mpya”
  choice: Neno “mpya” limetumiwa bila kubainisha kama uumbaji wa kwanza umebadilishwa kwa mwingine au umefanywa upya.
  alternative: Kutafsiri kwa maneno yanayoonyesha ama uingizwaji kamili ama kufanywa upya kwa uumbaji uliopo.
  rationale: καινός huonyesha upya, lakini mstari wenyewe hauamui kati ya uingizwaji na mabadiliko; tafsiri inadumisha mvutano huo.
- issue: Maana ya kutokuwapo kwa bahari
  choice: Kauli halisi “bahari haikuwapo tena” imedumishwa katika matini kuu.
  alternative: Kueleza moja kwa moja kuwa machafuko, uovu, hatari, au utengano umeondolewa.
  rationale: Picha ya bahari inaweza kuwa halisi au kuwa na mwangwi wa kiishara katika Ufunuo. Matini kuu haipaswi kulazimisha mojawapo ya maana hizo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa urahisi. “Kisha nikaona” hudumisha mtiririko wa simulizi; “wala” huunganisha kwa asili kauli ya mwisho yenye ukanushi.
