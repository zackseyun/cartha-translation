  text: And the material of its wall was jasper[a], and the city was pure gold[b], like pure glass.
translation:
  language: sw
  text: Na nyenzo ya ukuta wake ilikuwa yaspi[a], na mji ulikuwa wa dhahabu safi, kama kioo safi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ujenzi wa ukuta wake ulikuwa yaspi,” au “muundo wa ukuta wake ulikuwa yaspi.” Neno la Kigiriki linaweza kumaanisha ujenzi au muundo, ama nyenzo ambayo kitu kimejengwa nayo.
    reason: lexical_alternative
  - marker: b
    text: Au, “kama kioo wazi,” au “kama kioo kinachopenya nuru.” Ulinganisho unakazia uwazi na uangavu wa mji.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνδώμησις
  choice: ujenzi
  rationale: Neno linaweza kumaanisha ujenzi, muundo, au kitu ambacho ukuta umejengwa nacho. “Ujenzi wa ukuta wake ulikuwa wa yaspi” ni Kiswahili cha kawaida kinachodokeza nyenzo ya ukuta bila kuondoa maana mbadala ya muundo wake.
- source_word: τεῖχος
  choice: ukuta
  rationale: Hapa neno linamaanisha ukuta wa mji; “ukuta” ndilo neno la kawaida na sahihi katika muktadha huu.
- source_word: ἴασπις
  choice: yaspi
  rationale: Jina la jiwe limetoholewa kuwa “yaspi,” istilahi inayotambulika katika Kiswahili cha Biblia, huku ikihifadhi jina la kale bila kulilinganisha kwa uhakika na aina ya kisasa.
- source_word: χρυσίον
  choice: dhahabu
  rationale: Neno linataja dhahabu kama nyenzo; “dhahabu” ni tafsiri ya kawaida na ya moja kwa moja.
- source_word: καθαρόν
  choice: safi
  rationale: Kwa dhahabu, “safi” huonyesha kutokuwa na mchanganyiko au uchafu, si usafi wa kiibada.
- source_word: ὅμοιον
  choice: kama
  rationale: “Kama” huleta ulinganisho kwa njia fupi na ya kawaida katika Kiswahili.
- source_word: ὑάλῳ καθαρῷ
  choice: kioo safi
  rationale: Tafsiri hii inafuata kwa karibu maneno ya Kigiriki na mwangwi wa καθαρόν iliyotumiwa kwa dhahabu. Katika muktadha huu, “safi” inaweza pia kudokeza uangavu au uwazi wa kioo.
