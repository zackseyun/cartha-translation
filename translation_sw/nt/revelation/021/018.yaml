  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Mpangilio wa vifungu viwili sambamba umehifadhiwa. “Ujenzi” na “kioo safi” huhifadhi kwa makusudi upana wa maana ya Kigiriki; maelezo ya chini yanaonyesha tafsiri mbadala.
