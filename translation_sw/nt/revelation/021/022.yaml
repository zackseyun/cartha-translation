  text: Καὶ ναὸν οὐκ εἶδον ἐν αὐτῇ, ὁ γὰρ κύριος, ὁ θεός, ὁ παντοκράτωρ, ναὸς αὐτῆς ἐστιν, καὶ τὸ ἀρνίον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/022.yaml
  text: And I saw no temple in it[a], for the Lord God, the Almighty[b], is its temple, and the Lamb.
translation:
  language: sw
  text: Sikuona hekalu ndani yake[a], kwa maana Bwana Mungu Mwenyezi ndiye hekalu lake, naye Mwanakondoo pia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “patakatifu.” Neno la Kigiriki ναός linaweza kurejelea hasa eneo takatifu la ndani ya hekalu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ναὸν / ναὸς
  choice: hekalu
  rationale: “Hekalu” ni neno la kawaida na lenye heshima kwa ναός katika muktadha huu; linadumisha utofauti kati ya kutokuwapo kwa hekalu la jengo na Mungu pamoja na Mwanakondoo kuwa hekalu la mji.
- source_word: οὐκ εἶδον
  choice: Sikuona
  rationale: Hii inawakilisha moja kwa moja kitenzi cha wakati uliopita chenye ukanushi na ni Kiswahili cha asili na kifupi.
- source_word: ἐν αὐτῇ
  choice: ndani yake
  rationale: Kiwakilishi kinarejelea mji; “ndani yake” ni namna ya kawaida ya Kiswahili bila kuhamisha jinsia ya kisarufi ya Kigiriki.
- source_word: κύριος, ὁ θεός, ὁ παντοκράτωρ
  choice: Bwana Mungu Mwenyezi
  rationale: Huhifadhi mfuatano wa majina ya Mungu kwa lugha ya kawaida ya kibiblia; παντοκράτωρ imetafsiriwa “Mwenyezi,” ikionyesha mamlaka na uwezo mkuu.
- source_word: ναὸς αὐτῆς ἐστιν
  choice: ndiye hekalu lake
  rationale: Muundo wa “ndiye” unadumisha msisitizo wa utambulisho, huku “lake” likirejelea jiji kwa njia ya kawaida katika Kiswahili.
- source_word: καὶ τὸ ἀρνίον
  choice: pamoja na Mwanakondoo
  rationale: “Pamoja na” humhusisha Mwanakondoo katika kauli ya kuwa hekalu la mji bila kulazimisha kitenzi cha wingi ambacho hakipo katika Kigiriki; pia ni ya asili kuliko kuacha kishazi kisichokamilika kwa Kiswahili.
theological_decisions:
- issue: Jinsi ya kuelewa “ναὸς αὐτῆς ἐστιν, καὶ τὸ ἀρνίον”
  choice: Bwana Mungu Mwenyezi ndiye hekalu la mji, pamoja na Mwanakondoo.
  alternative: Bwana Mungu Mwenyezi na Mwanakondoo ndio hekalu lake.
  rationale: Kigiriki kina kitenzi cha umoja ἐστιν kabla ya nyongeza “na Mwanakondoo.” Tafsiri iliyochaguliwa inadumisha mpangilio huo na wakati huohuo haipunguzi ushiriki wa Mwanakondoo katika kuwa hekalu la mji. Haiongezi ufafanuzi wa kimadhehebu wala kutatua kabisa mvutano wa kisintaksia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. “Mwanakondoo” limehifadhiwa kama jina la kimafumbo la Kristo katika Ufunuo.
