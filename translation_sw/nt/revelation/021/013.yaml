  text: ἀπὸ ⸀ἀνατολῆς πυλῶνες τρεῖς, καὶ ἀπὸ βορρᾶ πυλῶνες τρεῖς, καὶ ἀπὸ νότου πυλῶνες τρεῖς, καὶ ἀπὸ δυσμῶν πυλῶνες τρεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/013.yaml
  text: On the east[a], three gates; and on the north, three gates; and on the south, three gates; and on the west, three gates.
translation:
  language: sw
  text: Upande wa mashariki[a] kulikuwa na malango matatu, na upande wa kaskazini malango matatu, na upande wa kusini malango matatu, na upande wa magharibi malango matatu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa tafsiri ya karibu zaidi na muundo wa Kigiriki: “Kutoka mashariki ... kutoka kaskazini ... kutoka kusini ... kutoka magharibi.” Hapa maneno hayo yametafsiriwa kwa Kiswahili cha kawaida ili kuonyesha upande ambako malango yako.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ ἀνατολῆς
  choice: upande wa mashariki
  rationale: Katika maelezo haya ya mpangilio wa mji, ἀπό pamoja na mwelekeo huonyesha upande ambako malango yapo. Kiswahili cha kawaida hutumia “upande wa mashariki”; tafsiri ya neno kwa neno “kutoka mashariki” ingeweza kueleweka kuwa ni mwendo au asili.
- source_word: πυλῶνες
  choice: malango
  rationale: πυλών inaweza kumaanisha lango au njia yenye muundo wa lango. Katika ukuta wa Yerusalemu Mpya, “malango” ni wazi, ya kawaida, na haiongezi maelezo yasiyothibitishwa kuhusu umbo lake.
- source_word: τρεῖς
  choice: matatu
  rationale: Ni namba ya kawaida, na imerudiwa kwa kila upande ili kuhifadhi mpangilio wa kimakusudi na ulinganifu wa Kigiriki.
- source_word: ἀπὸ βορρᾶ
  choice: upande wa kaskazini
  rationale: Hueleza upande wa mji ambako malango yako, si mwendo unaotoka kaskazini.
- source_word: ἀπὸ νότου
  choice: upande wa kusini
  rationale: Imetafsiriwa kwa ulinganifu na vifungu vingine vya mielekeo, huku maana ya mahali ikihifadhiwa.
- source_word: ἀπὸ δυσμῶν
  choice: upande wa magharibi
  rationale: δυσμαί huhusishwa kihalisi na machweo na hapa humaanisha magharibi. “Upande wa magharibi” ni usemi wa kawaida wa mahali katika Kiswahili.
- source_word: καὶ ... καὶ ... καὶ ...
  choice: na ... na ... na ...
  rationale: Marudio ya kiunganishi yamehifadhiwa ili kudumisha mtindo wa kuorodhesha wenye kipimo na ulinganifu katika chanzo.
theological_decisions:
- issue: Maelezo ya mahali pa malango ya Yerusalemu Mpya
  choice: Orodha ya moja kwa moja ya malango matatu katika kila upande kati ya pande nne
  alternative: Kueleza wazi katika tafsiri ishara zinazoweza kuhusishwa na mpangilio wa makabila ya Israeli au ono la mji wa Ezekieli
  rationale: Aya yenyewe inaorodhesha tu malango kwa mielekeo minne. Mahusiano ya kiishara yanaweza kujadiliwa katika ufafanuzi, lakini hayapaswi kuingizwa katika matini na hivyo kuzuia uwezekano mwingine wa kuelewa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Kulikuwa na” huifanya sentensi isiyo na kitenzi katika Kigiriki iwe ya kawaida katika Kiswahili bila kubadili maana; marudio ya “malango matatu” na “na” yanahifadhi ulinganifu wa aya.
