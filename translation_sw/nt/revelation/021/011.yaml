id: REV.21.11
reference: Revelation 21:11
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἔχουσαν τὴν δόξαν τοῦ θεοῦ· ὁ φωστὴρ αὐτῆς ὅμοιος λίθῳ τιμιωτάτῳ, ὡς λίθῳ ἰάσπιδι κρυσταλλίζοντι·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/011.yaml
  text: having the glory of God[a]; its radiance was like a most precious stone, like a jasper stone[b], clear as crystal.
translation:
  language: sw
  text: ukiwa na utukufu wa Mungu; mwangaza wake ulikuwa kama jiwe la thamani kubwa mno, kama jiwe la yaspi, angavu kama fuwele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ling'aalo kama fuwele.” Neno la Kigiriki linaweza kueleza uangavu, uwazi, au mng'ao unaofanana na fuwele.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχουσαν
  choice: ukiwa na
  rationale: Kirai hiki cha hali ya kuendelea kinarejelea mji wa mstari uliotangulia na kuhifadhi uhusiano wa kisarufi wa kitenzi kishirikishi bila kuongeza tafsiri isiyomo.
- source_word: τὴν δόξαν τοῦ θεοῦ
  choice: utukufu wa Mungu
  rationale: “Utukufu” ni istilahi ya kawaida ya kibiblia inayohifadhi uzito wa δόξα kama udhihirisho wa ukuu na uwepo wa Mungu, si uzuri wa kuona tu.
- source_word: ὁ φωστὴρ αὐτῆς
  choice: mwangaza wake
  rationale: φωστήρ inaweza kumaanisha kitu kinachotoa nuru au uangavu wake. Katika maelezo ya sura ya mji, “mwangaza wake” ni ya kawaida na inaonyesha athari inayoonekana bila kuamua kuwa ni chanzo maalumu cha nuru.
- source_word: λίθῳ τιμιωτάτῳ
  choice: jiwe la thamani kubwa mno
  rationale: Huhifadhi maana ya λίθος, “jiwe,” na nguvu ya hali ya juu ya τιμιωτάτῳ, yaani lenye thamani kubwa sana.
- source_word: ὡς λίθῳ ἰάσπιδι
  choice: kama jiwe la yaspi
  rationale: Huhifadhi kurudiwa kwa “jiwe” katika Kigiriki na jina la jiwe ἴασπις bila kulifanya kwa lazima lilingane kabisa na yaspi ya kisasa.
- source_word: κρυσταλλίζοντι
  choice: linalong’aa kama fuwele
  rationale: Kitenzi hiki kinaeleza hali inayofanana na fuwele, iwe kwa uangavu, mng’ao, au uwazi; tafsiri hii ni ya asili kwa Kiswahili huku tanbihi ikihifadhi uwezekano wa “wazi kama fuwele.”
theological_decisions:
- issue: Maana ya δόξα τοῦ θεοῦ katika maono ya kiapokaliptiki
  choice: utukufu wa Mungu
  alternative: fahari ya Mungu
  rationale: “Utukufu” huhifadhi maana pana ya uwepo na ukuu wa Mungu unaodhihirishwa, badala ya kuufanya usemi huu kuwa maelezo ya uzuri wa nje pekee.
- issue: Uhusiano wa utukufu wa Mungu na φωστήρ ya mji
  choice: Kutafsiri kama vipashio viwili vinavyohusiana bila kuvifanya vifanane kabisa
  alternative: Kutafsiri φωστήρ moja kwa moja kuwa “utukufu” au “nuru ya Mungu”
  rationale: Kigiriki kwanza husema mji una utukufu wa Mungu, kisha hueleza mwangaza wake. Kutenganisha vipashio hivyo huhifadhi mpangilio na mvutano wa maandishi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Yaspi” limetumiwa kama jina la jadi la jiwe la kibiblia; “fuwele” ni neno la kawaida zaidi kwa taswira ya crystal. Alama ya tanbihi imewekwa mara moja baada ya kirai kinachohusika.
