id: REV.21.4
reference: Revelation 21:4
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἐξαλείψει πᾶν δάκρυον ⸀ἐκ τῶν ὀφθαλμῶν αὐτῶν, καὶ ὁ θάνατος οὐκ ἔσται ἔτι· οὔτε πένθος οὔτε κραυγὴ οὔτε πόνος οὐκ ἔσται ⸀ἔτι. τὰ πρῶτα ἀπῆλθαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/004.yaml
  text: And he will wipe away every tear from their eyes[a], and death will be no more; neither mourning nor crying nor pain will be any more[c][b]. The former things have passed away.
translation:
  language: sw
  text: Naye atafuta kila chozi kutoka machoni pao[a], na kifo hakitakuwapo tena; wala maombolezo, wala kilio, wala maumivu hayatakuwapo tena[b]. Mambo ya zamani yamepita[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “machozi yote.” Umoja wa Kigiriki una maana ya kila chozi moja moja.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kigiriki lililotafsiriwa “kilio” linaweza pia kumaanisha “kilio kikubwa” au “kelele ya kilio.”
    reason: lexical_alternative
  - marker: c
    text: Au, “mambo ya kwanza yamepita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξαλείψει
  choice: atafuta
  rationale: Katika muktadha wa kuondoa machozi machoni, kitenzi hiki hutafsiriwa kwa Kiswahili cha kawaida na chenye mguso wa kibinafsi kuwa “atafuta,” badala ya maana nyingine kama kufuta maandishi.
- source_word: πᾶν δάκρυον
  choice: kila chozi
  rationale: Umoja wenye πᾶν una maana ya kugawa kwa kila moja; “kila chozi” huhifadhi msisitizo huo kwa kawaida.
- source_word: ἐκ τῶν ὀφθαλμῶν αὐτῶν
  choice: kutoka machoni pao
  rationale: Hueleza kuondolewa kwa machozi kutoka kwenye macho yao kwa Kiswahili sanifu na cha kawaida.
- source_word: ὁ θάνατος
  choice: kifo
  rationale: Nomino hii inaeleza kifo kwa ujumla; “kifo” huhifadhi kauli ya kuondolewa kwake kabisa.
- source_word: οὐκ ἔσται ἔτι
  choice: hakitakuwapo tena / hayatakuwapo tena
  rationale: Muundo huu unaonyesha kukoma kabisa. Upatanisho wa kisarufi hubadilika kulingana na nomino, huku maana ileile ikihifadhiwa.
- source_word: πένθος
  choice: maombolezo
  rationale: Neno hili linafaa kwa huzuni inayoonyeshwa, hasa kuhusiana na msiba, na linaendana na mfuatano wa kifo, kilio na maumivu.
- source_word: κραυγή
  choice: kilio
  rationale: “Kilio” ni neno la kawaida linaloweza kumaanisha kulia au sauti ya kilio; uwezekano wa “kilio kikubwa” umewekwa katika tanbihi.
- source_word: πόνος
  choice: maumivu
  rationale: Katika orodha hii ya mateso yatakayoondolewa, “maumivu” ni tafsiri wazi inayoweza kuhusisha maumivu ya mwili na mateso kwa upana.
- source_word: τὰ πρῶτα
  choice: mambo ya kwanza
  rationale: Tafsiri hii hudumisha maana ya msingi na pia utata wa iwapo inarejelea mambo ya kwanza au hali ya zamani, bila kuingiza ufafanuzi wa ziada.
- source_word: ἀπῆλθαν
  choice: yamepita
  rationale: Hueleza kuondoka kwa mambo hayo kama jambo lililotimia, kwa mtindo wa kawaida wa tangazo la kinabii.
theological_decisions:
- issue: Mtendaji wa “atafuta” hajatajwa kwa nomino katika mstari huu bali anaeleweka kutokana na muktadha uliotangulia.
  choice: Naye atafuta
  alternative: Mungu atafuta
  rationale: Kitenzi cha Kigiriki kina kiima cha nafsi ya tatu umoja kinachoeleweka kutoka Ufunuo 21:3. Kutumia kiwakilishi kilichodokezwa na “Naye” huepuka kuongeza nomino “Mungu” ndani ya mstari huu.
- issue: Upeo wa kukoma kwa kifo, maombolezo, kilio na maumivu.
  choice: hakitakuwapo tena / hayatakuwapo tena
  alternative: havitaendelea tena
  rationale: Kigiriki kinatangaza kutokuwapo kabisa, si kupungua tu au kutotawala; lugha ya moja kwa moja huhifadhi ukamilifu huo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi hudumisha urudiaji na uzito wa tangazo la Kigiriki, huku upatanisho wa ngeli ukifanya orodha isomeke kwa kawaida.
