id: REV.21.8
reference: Revelation 21:8
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: τοῖς δὲ δειλοῖς καὶ ⸀ἀπίστοις καὶ ἐβδελυγμένοις καὶ φονεῦσι καὶ πόρνοις καὶ φαρμάκοις καὶ εἰδωλολάτραις καὶ πᾶσι τοῖς ψευδέσιν τὸ μέρος αὐτῶν ἐν τῇ λίμνῃ τῇ καιομένῃ πυρὶ καὶ θείῳ, ὅ ἐστιν ὁ θάνατος ὁ δεύτερος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/008.yaml
  text: But for the cowardly and unbelieving and detestable and murderers and sexually immoral and sorcerers and idolaters and all liars[a], their portion will be in the lake burning with fire and sulfur[c][b], which is the second death.
translation:
  language: sw
  text: Lakini waoga, wasioamini[a], wenye kuchukiza, wauaji, waasherati, wachawi, waabudu sanamu, na waongo wote, sehemu yao itakuwa katika ziwa linalowaka kwa moto na kiberiti; hilo ndilo mauti ya pili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wasio waaminifu.”
    reason: alternative_reading
lexical_decisions:
- source_word: δειλοῖς
  choice: waoga
  rationale: Neno hili linamaanisha watu wenye woga wa aibu au wa kukosa ujasiri wa kimaadili, si watu wanaohisi hofu ya kawaida tu. “Waoga” ndilo neno fupi na la kawaida zaidi katika orodha hii.
- source_word: ἀπίστοις
  choice: wasioamini
  rationale: Katika orodha hii ya hukumu, maana ya moja kwa moja ni wale wasioamini. Hata hivyo, neno la Kigiriki linaweza pia kumaanisha wasio waaminifu; maana hiyo imehifadhiwa katika tanbihi.
- source_word: ἐβδελυγμένοις
  choice: wenye machukizo
  rationale: Kauli hii huwataja watu wanaotambulishwa na mambo yenye kuchukiza na kunajisi. “Wenye machukizo” huhifadhi uzito wa kimaadili kuliko usemi dhaifu kama “wenye kuchukiza.”
- source_word: φονεῦσι
  choice: wauaji
  rationale: Katika muktadha huu neno linamaanisha watu wanaoua kwa uhalifu; “wauaji” ni neno la kawaida la Kiswahili na halipanui maana hadi kila aina ya kuua.
- source_word: πόρνοις
  choice: waasherati
  rationale: Neno hili linawahusu wanaotenda uasherati kwa maana pana. “Waasherati” ni fupi, linaeleweka, na linaendana kisarufi na majina mengine katika orodha.
- source_word: φαρμάκοις
  choice: wachawi
  rationale: Katika Ufunuo neno hili linawahusu watendaji wa uchawi au mambo ya kiuganga wa kichawi, si wataalamu wa dawa. “Wachawi” hutoa maana hiyo kwa uwazi.
- source_word: εἰδωλολάτραις
  choice: waabudu sanamu
  rationale: Hili ni tamko la moja kwa moja kwa watu wanaoabudu sanamu; muundo huu ni wa kawaida na wazi katika Kiswahili cha sasa.
- source_word: πᾶσι τοῖς ψευδέσιν
  choice: waongo wote
  rationale: Kivumishi cha Kigiriki kimetumiwa kama jina kumaanisha watu waongo. “Waongo wote” ni usemi wa asili na huhifadhi msisitizo wa πᾶσι.
- source_word: τὸ μέρος αὐτῶν
  choice: sehemu yao itakuwa
  rationale: μέρος hapa ni fungu au hatima waliyopewa. Kitenzi “itakuwa” kinakamilisha kishazi kisicho na kitenzi wazi katika Kigiriki na kukifanya kiwe cha kawaida kwa Kiswahili.
- source_word: ἐν τῇ λίμνῃ τῇ καιομένῃ πυρὶ καὶ θείῳ
  choice: katika ziwa linalowaka kwa moto na kiberiti
  rationale: Muundo huu huhifadhi picha ya ziwa linalowaka na hutafsiri θείον kwa “kiberiti,” neno la kawaida la Kiswahili kwa sulfur.
- source_word: ὅ ἐστιν ὁ θάνατος ὁ δεύτερος
  choice: hilo ndilo mauti ya pili
  rationale: Kiwakilishi kinarejelea ziwa lililotajwa na kulitambulisha kuwa mauti ya pili. “Hilo ndilo” huonyesha urejeo huo kwa kawaida katika Kiswahili.
theological_decisions:
- issue: Maana ya ἄπιστος katika orodha ya hukumu
  choice: wasioamini
  alternative: wasio waaminifu
  rationale: Muktadha unaunga mkono kutokuamini, lakini neno linaweza pia kueleza kutokuwa mwaminifu. Tanbihi huhifadhi uwezekano huo bila kuamua mvutano wa maana kimya kimya.
- issue: Urejeo wa ὅ katika kauli kuhusu mauti ya pili
  choice: hilo ndilo mauti ya pili
  alternative: hiyo ndiyo mauti ya pili
  rationale: Muundo wa karibu zaidi unarejelea ziwa linalowaka; upatanisho wa Kiswahili kwa “ziwa” unaifanya “hilo” iwe wazi, huku kitambulisho cha kitheolojia cha ziwa kama mauti ya pili kikihifadhiwa.
- issue: Picha ya θείῳ
  choice: kiberiti
  alternative: sulfuri
  rationale: “Kiberiti” ni neno la kawaida na la kibiblia katika Kiswahili kwa madini yanayowaka yanayokusudiwa hapa; “sulfuri” ni istilahi ya kisayansi zaidi na si ya lazima katika matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Orodha imehifadhiwa kwa majina mafupi ya wingi ili kudumisha uzito na mfuatano wa Kigiriki. Alama ya tanbihi [a] imewekwa mara moja moja kwa moja baada ya neno linalohusika.
