id: REV.21.16
reference: Revelation 21:16
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἡ πόλις τετράγωνος κεῖται, καὶ τὸ μῆκος αὐτῆς ⸀ὅσον τὸ πλάτος. καὶ ἐμέτρησεν τὴν πόλιν τῷ καλάμῳ ἐπὶ ⸀σταδίους δώδεκα ⸀χιλιάδων· τὸ μῆκος καὶ τὸ πλάτος καὶ τὸ ὕψος αὐτῆς ἴσα ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/016.yaml
  text: 'And the city lies foursquare[a], and its length is as great as its width. And he measured the city with the measuring rod: twelve thousand stadia[c][b]. Its length and width and height are equal.'
translation:
  language: sw
  text: 'Mji huo una umbo la mraba[a]; urefu wake ni sawa na upana wake. Naye akaupima mji kwa mwanzi wa kupimia[b]: stadia elfu kumi na mbili[c]. Urefu, upana na kimo chake ni sawa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa kuwa baadaye inaelezwa kwamba urefu, upana na kimo cha mji ni sawa, maelezo haya yanaweza kufupishwa kwa kusema, “mji ni mchemraba kamili.” Hata hivyo, Kigiriki chenyewe kinataja moja kwa moja usawa wa vipimo hivyo.
    reason: alternative_reading
  - marker: b
    text: Au, “kwa mwanzi.” Neno la Kigiriki linaweza kumaanisha mwanzi, lakini hapa mwanzi huo unatumiwa kama kifaa cha kupimia.
    reason: lexical_alternative
  - marker: c
    text: Stadion ilikuwa kipimo cha umbali cha kale. Stadia elfu kumi na mbili ni takriban kilomita 2,220, ingawa hesabu hiyo hutegemea urefu unaokadiriwa wa stadion.
    reason: cultural_note
lexical_decisions:
- source_word: τετράγωνος
  choice: una umbo la mraba
  rationale: Neno hili linaonyesha umbo lenye pande nne sawa. Tafsiri hii ni ya kawaida na wazi katika Kiswahili, bila kutanguliza mapema hitimisho kwamba mji ni mchemraba.
- source_word: κεῖται
  choice: una
  rationale: Katika maelezo haya ya mpangilio au umbo la mji, maana ya kitenzi hiki imewasilishwa kwa Kiswahili cha kawaida kupitia kirai ‘una umbo’; tafsiri ya neno kwa neno kama ‘umelala’ ingekuwa isiyo ya kawaida na yenye kupotosha.
- source_word: τὸ μῆκος αὐτῆς ὅσον τὸ πλάτος
  choice: urefu wake ni sawa na upana wake
  rationale: ὅσον inaonyesha usawa wa vipimo. ‘Ni sawa na’ ni wazi na ya kawaida katika Kiswahili.
- source_word: ἐμέτρησεν
  choice: akaupima
  rationale: Ni kitenzi rahisi cha masimulizi; kiambishi cha nafsi kinamrejelea malaika anayetajwa katika muktadha wa karibu.
- source_word: τῷ καλάμῳ
  choice: kwa mwanzi wa kupimia
  rationale: κάλαμος kimsingi ni mwanzi, lakini hapa unatumiwa kama kifaa cha kupimia. Kirai hiki kinahifadhi picha ya kitu halisi na kuweka wazi kazi yake.
- source_word: ἐπὶ σταδίους δώδεκα χιλιάδων
  choice: stadia elfu kumi na mbili
  rationale: Kirai hiki kinatoa kipimo kilichopatikana. Kihusishi kinaingizwa kwa kawaida katika muundo wa Kiswahili bila kutafsiriwa kwa neno tofauti.
- source_word: στάδιος
  choice: stadia
  rationale: Jina la kipimo cha kale limehifadhiwa badala ya kubadilishwa kuwa kipimo cha kisasa chenye makadirio yanayotofautiana.
- source_word: τὸ μῆκος καὶ τὸ πλάτος καὶ τὸ ὕψος αὐτῆς ἴσα ἐστίν
  choice: Urefu, upana na kimo chake ni sawa
  rationale: Tafsiri hii inasema moja kwa moja, kama Kigiriki, kwamba vipimo vyote vitatu ni sawa.
theological_decisions:
- issue: Iwapo kipimo cha kale kibaki au kibadilishwe kuwa kipimo cha kisasa katika matini kuu
  choice: Kuhifadhi ‘stadia elfu kumi na mbili’ katika matini kuu
  alternative: Takriban kilomita 2,220
  rationale: Kigiriki kinatumia kipimo cha kale, na thamani yake kamili kwa kilomita hutegemea urefu unaokadiriwa wa stadion. Kwa hiyo makadirio ya kisasa yanafaa kuwekwa katika tanbihi.
- issue: Jinsi ya kueleza usawa wa vipimo vitatu vya mji
  choice: Kusema kwamba urefu, upana na kimo chake ni sawa
  alternative: Kusema kwamba mji ni mchemraba kamili
  rationale: Ingawa usawa wa vipimo hivyo unaashiria umbo la mchemraba, Kigiriki kinataja vipimo moja kwa moja badala ya kutumia jina hilo la kijiometri. Matini kuu inahifadhi namna hiyo ya usemi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa heshima, wa sasa na unaoeleweka. ‘Umbo la mraba’ ni wazi zaidi kuliko usemi wa kale au wa kiufundi; ‘mwanzi wa kupimia’ huhifadhi picha ya asili huku ikifafanua matumizi yake. Mpangilio wa alama za tanbihi umewekwa karibu na maneno yanayohusika.
