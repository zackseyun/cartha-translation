  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ οἱ δώδεκα πυλῶνες δώδεκα μαργαρῖται, ἀνὰ εἷς ἕκαστος τῶν πυλώνων ἦν ἐξ ἑνὸς μαργαρίτου· καὶ ἡ πλατεῖα τῆς πόλεως χρυσίον καθαρὸν ὡς ὕαλος διαυγής.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/021.yaml
  text: And the twelve gates were twelve pearls; each one of the gates was from a single pearl. And the street of the city was pure gold[a], like transparent glass.
translation:
  language: sw
  text: Na malango yale kumi na mawili yalikuwa lulu kumi na mbili; kila lango lilitokana na lulu moja. Na barabara ya mji ilikuwa dhahabu safi[a], kama kioo chenye uwazi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “barabara pana ya mji,” au “uwanja wa mji.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πυλῶνες
  choice: malango
  rationale: Katika maelezo ya usanifu wa Yerusalemu Mpya, neno hili linamaanisha malango au miundo ya kuingilia; “malango” ni la kawaida na linafaa kwa picha hii.
- source_word: μαργαρῖται / μαργαρίτου
  choice: lulu / lulu
  rationale: Neno hilo linamaanisha lulu moja au nyingi. Kiswahili hakibadili umbo la “lulu” katika wingi, lakini hesabu zinaonyesha wazi tofauti hiyo.
- source_word: ἀνὰ εἷς ἕκαστος
  choice: kila lango
  rationale: Kirai hiki kina nguvu ya mgawanyo, yaani kila moja peke yake. “Kila lango” ni ya asili na huhifadhi msisitizo huo.
- source_word: ἐξ ἑνὸς μαργαρίτου
  choice: lilikuwa la lulu moja
  rationale: ἐξ huonyesha kitu kilikotokana nacho au nyenzo yake. “La lulu moja” ni fupi, ya asili, na haiongezi wazi kitenzi cha kutengenezwa ambacho hakipo katika Kigiriki.
- source_word: πλατεῖα
  choice: barabara
  rationale: Neno hili linaweza kumaanisha njia au barabara pana ya umma, na wakati mwingine eneo la wazi. “Barabara” inasomeka kwa urahisi huku tanbihi ikihifadhi maana mbadala.
- source_word: χρυσίον καθαρὸν
  choice: dhahabu safi
  rationale: Hii ndiyo tafsiri ya kawaida na ya moja kwa moja ya dhahabu yenye usafi.
- source_word: ὡς ὕαλος διαυγής
  choice: kama kioo kiangavu
  rationale: διαυγής huonyesha uangavu unaoruhusu kuona ndani au kupitia. “Kioo kiangavu” huhifadhi taswira ya ajabu bila kutumia istilahi nzito.
theological_decisions:
- issue: Taswira ya πλατεῖα katika mji
  choice: barabara ya mji
  alternative: barabara pana ya mji; uwanja wa mji
  rationale: Hili hasa ni suala la kileksika, si la mafundisho. Tafsiri kuu haibainishi kupita kiasi mpangilio wa mji, na tanbihi huhifadhi uwezekano halisi wa maana nyingine.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Muundo wa marudio wa malango kumi na mawili na lulu kumi na mbili umehifadhiwa, pamoja na umoja wa kila lulu.
