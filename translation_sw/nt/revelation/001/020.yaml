id: REV.1.20
reference: Revelation 1:20
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: τὸ μυστήριον τῶν ἑπτὰ ἀστέρων ⸀οὓς εἶδες ἐπὶ τῆς δεξιᾶς μου, καὶ τὰς ἑπτὰ λυχνίας τὰς χρυσᾶς· οἱ ἑπτὰ ἀστέρες ἄγγελοι τῶν ἑπτὰ ἐκκλησιῶν εἰσίν, καὶ αἱ λυχνίαι αἱ ἑπτὰ ἑπτὰ ἐκκλησίαι εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/020.yaml
  text: 'As for the mystery of the seven stars that you saw in my right hand[a], and the seven golden lampstands: the seven stars are the angels of the seven churches, and the seven lampstands are the seven churches.'
translation:
  language: sw
  text: 'Kuhusu fumbo la zile nyota saba ulizoziona katika mkono wangu wa kuume, na vile vinara saba vya dhahabu: zile nyota saba ni malaika[a] wa yale makanisa saba, na vile vinara saba ni yale makanisa saba.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wajumbe wa yale makanisa saba.” Neno la Kigiriki linaweza kumaanisha malaika au wajumbe wa kibinadamu.
    reason: alternative_reading
lexical_decisions:
- source_word: μυστήριον
  choice: fumbo
  rationale: Neno “fumbo” linahifadhi dhana ya jambo lililofichika ambalo maana yake inafunuliwa, bila kulirahisisha kuwa “maana ya mfano” pekee.
- source_word: ἀστέρων / ἀστέρες
  choice: nyota
  rationale: Ni tafsiri ya moja kwa moja ya ishara ya maono, ambayo maana yake inaelezwa katika sehemu inayofuata.
- source_word: οὓς εἶδες
  choice: ulizoziona
  rationale: Muundo huu wa Kiswahili ni wa kawaida na unahifadhi kishazi rejeshi kinachozielezea nyota.
- source_word: ἐπὶ τῆς δεξιᾶς μου
  choice: katika mkono wangu wa kuume
  rationale: Katika muktadha huu wa maono, “katika mkono wangu wa kuume” ni usemi wa kawaida unaopatana na picha iliyotangulia ya kuzishika nyota.
- source_word: λυχνίας
  choice: vinara
  rationale: Neno hili linamaanisha vitu vya kuwekea taa, si taa zenyewe; “vinara” linahifadhi picha hiyo kwa Kiswahili cha kawaida.
- source_word: χρυσᾶς
  choice: vya dhahabu
  rationale: Hii ni tafsiri ya asili na iliyo wazi ya kivumishi kinachoonyesha vinara kuwa vya dhahabu.
- source_word: ἄγγελοι
  choice: malaika
  rationale: Ingawa neno la Kigiriki linaweza kumaanisha malaika au wajumbe, katika Ufunuo mara nyingi hurejelea viumbe wa mbinguni. Utata wa maana umehifadhiwa kwa tanbihi.
- source_word: ἐκκλησιῶν / ἐκκλησίαι
  choice: makanisa
  rationale: “Makanisa” ni neno sanifu na la kawaida kwa makusanyiko ya waamini yanayoandikiwa katika Ufunuo.
- source_word: τὸ μυστήριον ... καὶ ...
  choice: 'Kuhusu fumbo la ... na ...:'
  rationale: Muundo huu unaweka mada kwanza kisha unatanguliza maelezo yake, kama ulivyo muundo wa Kigiriki, bila kuongeza dai lisilotajwa wazi.
theological_decisions:
- issue: Kirejelewa cha ἄγγελοι τῶν ἑπτὰ ἐκκλησιῶν
  choice: malaika wa yale makanisa saba
  alternative: wajumbe wa yale makanisa saba
  rationale: Ἄγγελος linaweza kumaanisha kiumbe wa mbinguni au mjumbe wa kibinadamu. Kwa kuwa Ufunuo hulitumia mara nyingi kwa viumbe wa mbinguni na mstari huu hauwatambulishi wazi kuwa viongozi wa kibinadamu, “malaika” limewekwa katika matini, huku “wajumbe” likihifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Zile/vile/yale” hutumiwa kuendeleza rejeo la vitu vilivyokwisha tajwa na kuifanya sentensi ndefu isomeke kwa urahisi.
