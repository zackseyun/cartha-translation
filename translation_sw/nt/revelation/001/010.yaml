  text: ἐγενόμην ἐν πνεύματι ἐν τῇ κυριακῇ ἡμέρᾳ, καὶ ἤκουσα ⸂ὀπίσω μου φωνὴν⸃ μεγάλην ὡς σάλπιγγος
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/010.yaml
  text: I came to be in the Spirit on the Lord’s day[a], and I heard behind me a loud voice like a trumpet[b],
translation:
  language: sw
  text: Nikawa katika Roho[b] siku ya Bwana[a], nami nikasikia nyuma yangu sauti kubwa kama tarumbeta,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa uwezekano mdogo, “siku ya Bwana” ikimaanisha siku ya Bwana ya wakati wa mwisho. Hapa Kigiriki kinasema κυριακῇ ἡμέρᾳ (“siku iliyo ya Bwana”), si usemi wa kawaida zaidi wa Kigiriki unaotaja siku ya Bwana ya wakati wa mwisho.
    reason: alternative_reading
  - marker: b
    text: Au “katika roho.” Huenda usemi huu unamaanisha kuwa chini ya uvuvio wa kinabii wa Roho Mtakatifu; maandishi hayasemi wazi “katika hali ya njozi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγενόμην
  choice: Nikawa
  rationale: Kitenzi hiki kinaonyesha kuingia katika hali fulani. “Nikawa” kinahifadhi maana hiyo kwa Kiswahili cha kawaida bila kuongeza wazo la kuwa katika njozi au kuzimia.
- source_word: ἐν πνεύματι
  choice: katika Roho
  rationale: Katika muktadha wa maono ya Ufunuo, inaelekea kumrejelea Roho Mtakatifu. Hata hivyo, tafsiri haiongezi maneno kama “katika hali ya njozi,” ambayo hayapo wazi katika Kigiriki.
- source_word: ἐν τῇ κυριακῇ ἡμέρᾳ
  choice: siku ya Bwana
  rationale: Kivumishi κυριακός humaanisha kitu kilicho cha Bwana. Kiswahili “siku ya Bwana” ni cha kawaida, ingawa kwa umbo kinaweza kufanana na usemi wa kieskatolojia; tanbihi inaeleza tofauti ya miundo ya Kigiriki.
- source_word: ἤκουσα
  choice: nikasikia
  rationale: Hapa ἀκούω inaeleza kutambua sauti kwa kusikia, si kitendo cha kusikiliza kwa makini.
- source_word: ὀπίσω μου
  choice: nyuma yangu
  rationale: 'Maana ya mahali inafaa katika muktadha: sauti ilitoka upande wa nyuma wa Yohana.'
- source_word: φωνὴν μεγάλην
  choice: sauti kubwa
  rationale: Katika muunganiko huu μέγας huonyesha ukubwa au nguvu ya sauti. “Sauti kubwa” ni usemi wa kawaida na unaoeleweka katika Kiswahili.
- source_word: ὡς σάλπιγγος
  choice: kama tarumbeta
  rationale: Huu ni ulinganisho wa sauti na tarumbeta. Tafsiri hii haiongezi neno kama “mlio,” ambalo halijatajwa moja kwa moja.
theological_decisions:
- issue: Iwapo ἐν πνεύματι ielezwe kuwa hali ya njozi au itafsiriwe kwa ukaribu zaidi na maneno ya Kigiriki
  choice: katika Roho
  alternative: katika roho; katika hali ya njozi
  rationale: Usemi huo huenda unaonyesha uvuvio wa kinabii wa Roho Mtakatifu, lakini Kigiriki hakisemi wazi kwamba Yohana alikuwa katika hali ya njozi au kupagawa. Tafsiri inahifadhi mvutano huo.
- issue: Iwapo κυριακῇ ἡμέρᾳ ni siku ya kila juma inayohusishwa na Bwana au siku ya Bwana ya wakati wa mwisho
  choice: siku ya Bwana
  alternative: siku ile ya Bwana
  rationale: Kigiriki kimetumia kivumishi κυριακός, yaani “iliyo ya Bwana,” badala ya muundo wa kawaida zaidi unaotumiwa kwa “siku ya Bwana” ya kieskatolojia. Tafsiri haibainishi zaidi siku hiyo ilikuwa ipi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini wa kawaida. “Nikawa” limetumiwa kuhifadhi wazo la kuingia katika hali fulani, na “tarumbeta” ni neno la kisasa linaloeleweka kwa urahisi. Alama [b] imewekwa baada ya “Roho,” ambako tanbihi yake inahusika, huku [a] ikibaki baada ya “siku ya Bwana.”
