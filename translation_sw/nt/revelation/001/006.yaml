id: REV.1.6
reference: Revelation 1:6
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἐποίησεν ἡμᾶς βασιλείαν, ἱερεῖς τῷ θεῷ καὶ πατρὶ αὐτοῦ— αὐτῷ ἡ δόξα καὶ τὸ κράτος εἰς τοὺς αἰῶνας ⸂τῶν αἰώνων⸃· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/006.yaml
  text: and made us a kingdom[a], priests to his God and Father—to him be the glory and the dominion forever and ever[b]. Amen.
translation:
  language: sw
  text: naye akatufanya kuwa ufalme, makuhani kwa Mungu wake na Baba yake.[b] Utukufu na mamlaka ni vyake milele na milele.[a] Amina.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa tafsiri ya neno kwa neno zaidi: “hata enzi za enzi.”'
    reason: lexical_alternative
  - marker: b
    text: Baadhi ya hati za baadaye zinasoma “wafalme na makuhani” badala ya “ufalme, makuhani.” Maandishi makuu yanafuata usomaji wa Kigiriki uliotolewa.
    reason: textual_variant
lexical_decisions:
- source_word: ἐποίησεν
  choice: akatufanya
  rationale: Kauli ya aoristi imetafsiriwa kwa wakati uliopita wa masimulizi, ikiendeleza tendo la Yesu linalotajwa katika muktadha bila kuongeza kwa wazi wazo la matokeo yanayoendelea.
- source_word: βασιλείαν
  choice: kuwa ufalme
  rationale: Nomino ya umoja inamaanisha ufalme au milki, si ‘wafalme’; muundo huu unahifadhi utambulisho wa pamoja wa waamini.
- source_word: ἱερεῖς
  choice: makuhani
  rationale: Hili ndilo neno la kawaida na sahihi kwa huduma na utambulisho wa kikuhani unaokusudiwa hapa.
- source_word: τῷ θεῷ καὶ πατρὶ αὐτοῦ
  choice: kwa Mungu wake na Baba yake
  rationale: ‘Kwa’ linaonyesha uhusiano na huduma ya makuhani kwa Mungu; viwakilishi vinahifadhi kwamba Mungu ndiye Mungu na Baba wa Yesu bila kulainisha usemi wa Kigiriki.
- source_word: αὐτῷ ἡ δόξα καὶ τὸ κράτος
  choice: utukufu na mamlaka ni vyake
  rationale: Muundo huu ni asili katika Kiswahili kwa tamko la sifa lisilo na kitenzi katika Kigiriki; ‘mamlaka’ linaonyesha nguvu ya kutawala ya κράτος.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: milele na milele
  rationale: Ni usemi wa kawaida wa Kiswahili unaowasilisha muda usio na mwisho wa nahau ya Kigiriki.
- source_word: ἀμήν
  choice: Amina
  rationale: Neno la kiliturujia lililozoeleka katika Kiswahili, likitumika kama uthibitisho wa dhati.
theological_decisions:
- issue: Mhusika wa ‘Mungu wake na Baba yake’
  choice: 'Usemi unarejelea Yesu Kristo: waliokombolewa wamefanywa ufalme na makuhani kwa Mungu wake na Baba yake.'
  alternative: Kusema ‘kwa Mungu Baba yake,’ jambo ambalo lingeweza kuficha kwamba kiwakilishi kinahusiana na nomino zote mbili.
  rationale: Mhusika wa karibu katika muktadha ni Yesu Kristo. Tafsiri inadumisha maneno yenye mvutano wa Kikristo na uhusiano unaoonyeshwa na Kigiriki bila kuyasawazisha kidogma.
- issue: Hadhi ya jumuiya
  choice: ‘ufalme, makuhani’
  alternative: ‘wafalme na makuhani’
  rationale: SBLGNT inasoma βασιλείαν, ἱερεῖς (‘ufalme, makuhani’). Tafsiri haingizi usomaji wa baadaye wa ‘wafalme na makuhani.’
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Naye akatufanya’ linaunganisha sentensi na muktadha wa aya iliyotangulia. Alama zote za tanbihi zimewekwa katika maandishi; tanbihi ya nahau ya muda imewekwa baada ya ‘milele na milele,’ na tanbihi ya lahaja ya hati baada ya ‘Amina.’
