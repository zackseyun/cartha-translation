  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἔχων ἐν τῇ δεξιᾷ ⸂χειρὶ αὐτοῦ⸃ ἀστέρας ἑπτά, καὶ ἐκ τοῦ στόματος αὐτοῦ ῥομφαία δίστομος ὀξεῖα ἐκπορευομένη, καὶ ἡ ὄψις αὐτοῦ ὡς ὁ ἥλιος φαίνει ἐν τῇ δυνάμει αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/016.yaml
  text: And he had seven stars in his right hand[a], and from his mouth came a sharp two-edged sword[b], and his appearance was like the sun shining in its strength.
translation:
  language: sw
  text: Naye alikuwa na nyota saba katika mkono wake wa kuume, na kutoka kinywani mwake ulitoka upanga mkali wenye makali kuwili, na mwonekano wake ulikuwa kama jua linapong’aa kwa nguvu zake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa nguvu zake zote.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχων
  choice: alikuwa na
  rationale: Kitenzi hiki cha hali endelevu kinaunganishwa na maelezo ya maono; “alikuwa na” ni Kiswahili cha kawaida kinachohifadhi hali hiyo ya kimaelezo.
- source_word: ἐν τῇ δεξιᾷ χειρὶ αὐτοῦ
  choice: katika mkono wake wa kuume
  rationale: Neno χείρ limetajwa wazi, na “mkono wa kuume” ni usemi wa kawaida na wenye heshima katika Kiswahili.
- source_word: ἀστέρας ἑπτά
  choice: nyota saba
  rationale: Tafsiri ya moja kwa moja kwa mpangilio wa kawaida wa Kiswahili.
- source_word: ῥομφαία
  choice: upanga
  rationale: Ingawa neno linaweza kumaanisha upanga mkubwa, “upanga” ni wazi na haliongezi maelezo yasiyotajwa moja kwa moja.
- source_word: δίστομος
  choice: wenye makali kuwili
  rationale: Maana ya nahau ni upanga uliokata pande zote mbili; usemi huu ni wa kawaida na unaeleweka katika Kiswahili.
- source_word: ὀξεῖα
  choice: mkali
  rationale: Huhifadhi sifa ya ukali iliyo tofauti na kuwa na makali kuwili.
- source_word: ἐκπορευομένη
  choice: ulikuwa ukitoka
  rationale: Huhifadhi taswira endelevu ya upanga unaotoka kinywani mwake bila kuifasiri.
- source_word: ἡ ὄψις αὐτοῦ
  choice: sura yake
  rationale: ὄψις huonyesha mwonekano unaoonekana; “sura” inaweza kumaanisha mwonekano kwa ujumla bila kuilazimisha taswira kuwa uso pekee.
- source_word: ὡς ὁ ἥλιος φαίνει
  choice: kama jua linapong’aa
  rationale: Ni ulinganisho wa asili katika Kiswahili unaohifadhi mng’ao wa jua.
- source_word: ἐν τῇ δυνάμει αὐτοῦ
  choice: kwa nguvu zake
  rationale: Hufuata kwa karibu wazo la δύναμις kama nguvu au ukali wa mng’ao wa jua; maana ya “nguvu zake zote” imewekwa kama mbadala katika tanbihi.
theological_decisions:
- issue: Taswira ya upanga unaotoka kinywani
  choice: Kudumisha sitiari ya maono bila maelezo ya kiufafanuzi
  alternative: Kuutambulisha wazi upanga kuwa neno la Kristo la hukumu
  rationale: Aya yenyewe inatoa taswira ya kiapokaliptiki bila kuifafanua; tafsiri haipaswi kuingiza maana ya kitheolojia kutoka sehemu nyingine ndani ya matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi unadumisha mtiririko wa maelezo ya maono na picha zake bila kuzifafanua zaidi.
