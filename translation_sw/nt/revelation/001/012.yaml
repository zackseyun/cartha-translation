id: REV.1.12
reference: Revelation 1:12
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ⸀Καὶ ἐπέστρεψα βλέπειν τὴν φωνὴν ἥτις ἐλάλει μετ’ ἐμοῦ· καὶ ἐπιστρέψας εἶδον ἑπτὰ λυχνίας χρυσᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/012.yaml
  text: And I turned to see the voice that was speaking with me[a], and when I turned, I saw seven golden lampstands,
translation:
  language: sw
  text: Nikageuka ili niione sauti iliyokuwa ikisema nami[a]. Nilipogeuka, nikaona vinara saba vya taa vya dhahabu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “iliyokuwa ikisema kwangu.” Kigiriki kinasema kihalisi, “iliyokuwa ikisema nami.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέστρεψα
  choice: Nikageuka
  rationale: Kitenzi hiki kinaeleza kugeuka kimwili; ‘nikageuka’ ni cha kawaida na hakiongezi wazo la kuzunguka kabisa lisilolazimishwa na Kigiriki.
- source_word: βλέπειν
  choice: ili niione
  rationale: Infinitivu inaonyesha kusudi la kugeuka. Ingawa sauti haisemwi kwa kawaida kuwa kitu kinachoonekana, muundo huo wa makusudi katika Kigiriki umehifadhiwa.
- source_word: φωνὴν
  choice: sauti
  rationale: Katika muktadha wa usemi, φωνή ni ‘sauti.’ Kiswahili ‘sauti’ pia huhifadhi taswira ya ajabu ya kugeuka ili kuiona sauti.
- source_word: ἐλάλει μετ’ ἐμοῦ
  choice: iliyokuwa ikisema nami
  rationale: Muundo wa wakati unaoendelea umeonyeshwa kwa ‘ilikuwa ikisema’; ‘nami’ huhifadhi kwa karibu μετά pamoja na hali ya ushirika, bila kuzuia maana ya kawaida ya kusema na mtu.
- source_word: ἐπιστρέψας
  choice: Nilipogeuka
  rationale: Kirai hiki huonyesha tendo lililotangulia kuona; ‘nilipogeuka’ ni muundo wa asili unaodumisha mpangilio huo.
- source_word: εἶδον
  choice: nikaona
  rationale: Tafsiri ya moja kwa moja ya tendo la kuona, huku ‘nika-’ ikiunganisha kwa kawaida matukio yaliyofuatana.
- source_word: ἑπτὰ λυχνίας χρυσᾶς
  choice: vinara saba vya taa vya dhahabu
  rationale: λυχνία ni kinara kinachoshikilia taa, si taa yenyewe. ‘Vinara vya taa’ ni wazi kwa wasomaji wa kisasa, na ‘vya dhahabu’ huonyesha nyenzo kwa usahihi.
theological_decisions:
- issue: Utambulisho wa λυχνίας katika taswira ya kiapokaliptiki
  choice: vinara vya taa
  alternative: taa
  rationale: Neno linapaswa kubaki kitu halisi kinachoshikilia taa, kwa kuwa Ufunuo 1:20 baadaye huvifafanua vinara hivyo kiishara. ‘Taa’ ingechanganya taa na kinara chake.
- issue: Taswira ya ‘kuiona sauti’
  choice: ili niione sauti
  alternative: ili nimwone aliyekuwa akisema
  rationale: Kigiriki kwa makusudi kinasema kuona ‘sauti.’ Kutaja msemaji kungeondoa taswira isiyo ya kawaida na kuongeza jambo ambalo halijaelezwa wazi katika mstari.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo usio wa kawaida wa ‘kuiona sauti’ umehifadhiwa kwa sababu unatokana na maandishi yenyewe; alama ya tanbihi imewekwa baada ya kirai husika.
