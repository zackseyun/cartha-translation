id: REV.1.1
reference: Revelation 1:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἀποκάλυψις Ἰησοῦ Χριστοῦ, ἣν ἔδωκεν αὐτῷ ὁ θεὸς δεῖξαι τοῖς δούλοις αὐτοῦ, ἃ δεῖ γενέσθαι ἐν τάχει, καὶ ἐσήμανεν ἀποστείλας διὰ τοῦ ἀγγέλου αὐτοῦ τῷ δούλῳ αὐτοῦ Ἰωάννῃ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/001.yaml
  text: The revelation of Jesus the Messiah[a], which God gave him to show his servants what must happen soon, and he made it known by sending it through his angel to his servant John[d][c][b],
translation:
  language: sw
  text: Ufunuo wa Yesu Masihi[a], ambao Mungu alimpa ili awaonyeshe watumwa wake mambo ambayo lazima yatukie hivi karibuni[b]. Naye aliufanya ujulikane[c] kwa kumtuma malaika wake kwa mtumwa wake Yohana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Ufunuo kutoka kwa Yesu Masihi,” au “Ufunuo kumhusu Yesu Masihi.” Muundo wa Kigiriki unaweza kueleweka kwa zaidi ya njia moja.
    reason: alternative_reading
  - marker: b
    text: Au “kwa upesi.” Kirai hiki kinaweza kumaanisha kwamba mambo haya yatatukia karibuni, au kwamba yatatukia kwa kasi yatakapoanza.
    reason: lexical_alternative
  - marker: c
    text: Kitenzi cha Kigiriki kinaweza pia kutafsiriwa “aliuonyesha kwa ishara.” Maana hiyo inafaa tabia ya kiishara ya kitabu hiki.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀποκάλυψις
  choice: Ufunuo
  rationale: Neno hili humaanisha kufunuliwa au kuwekwa wazi kwa jambo lililokuwa limefichwa. “Ufunuo” ni neno la kawaida na lenye hadhi katika Kiswahili na linafaa kwa muktadha wa maono.
- source_word: Ἰησοῦ Χριστοῦ
  choice: wa Yesu Masihi
  rationale: “Masihi” linatunza Χριστός kama cheo, si kama jina la ukoo. Kiunganishi “wa” kinaacha wazi ikiwa ufunuo unatoka kwa Yesu, unamhusu Yesu, au ni wake.
- source_word: ἣν ἔδωκεν αὐτῷ ὁ θεὸς
  choice: ambao Mungu alimpa
  rationale: Kiwakilishi cha yambwa katika “alimpa” kinamrejelea Yesu Masihi, huku “ambao” likirejelea “ufunuo.” Muundo huu unatofautisha Mungu na Yesu bila kuongeza ufafanuzi wa kiteolojia.
- source_word: δεῖξαι
  choice: ili awaonyeshe
  rationale: Muundo wa kusudi unawakilishwa kwa “ili,” na “awaonyeshe” linafaa kwa mazingira ya maono.
- source_word: τοῖς δούλοις αὐτοῦ
  choice: watumwa wake
  rationale: “Watumwa” linatunza maana ya watu walio chini ya mamlaka na walio mali ya bwana wao kwa nguvu zaidi kuliko “watumishi.”
- source_word: ἃ δεῖ γενέσθαι
  choice: mambo ambayo lazima yatukie
  rationale: Huu ni usemi wa asili wa Kiswahili unaotunza wingi wa mambo na ulazima unaoonyeshwa na δεῖ.
- source_word: ἐν τάχει
  choice: hivi karibuni
  rationale: Katika muktadha huu usemi huu unaweza kuonyesha ukaribu wa wakati; uwezekano wa maana ya kasi umetajwa katika tanbihi.
- source_word: ἐσήμανεν
  choice: aliufahamisha
  rationale: Kitenzi kinamaanisha kufanya jambo lijulikane na kinaweza pia kudokeza kulionyesha kwa ishara. “Aliufahamisha” ni wazi na cha asili, huku kidokezo cha ishara kikihifadhiwa katika tanbihi.
- source_word: ἀποστείλας διὰ τοῦ ἀγγέλου αὐτοῦ
  choice: kwa kumtuma malaika wake
  rationale: 'Kirai hiki kinaonyesha njia iliyotumiwa kufanya ufunuo ujulikane: Yesu alimtuma malaika wake. Muundo huu ni wa kawaida katika Kiswahili na hautoi picha isiyo ya asili ya ‘kutuma ufunuo kupitia malaika.’'
- source_word: τῷ δούλῳ αὐτοῦ Ἰωάννῃ
  choice: kwa mtumwa wake Yohana
  rationale: “Kwa” linamtambulisha Yohana kama mpokeaji, na “mtumwa” linadumisha uchaguzi uleule wa δοῦλος uliotumiwa mapema.
theological_decisions:
- issue: Maana ya umilikishi katika Ἀποκάλυψις Ἰησοῦ Χριστοῦ
  choice: Ufunuo wa Yesu Masihi
  alternative: Ufunuo kutoka kwa Yesu Masihi; Ufunuo kumhusu Yesu Masihi
  rationale: Umilikishi wa Kigiriki unaweza kueleweka kwa zaidi ya njia moja. “Wa” katika Kiswahili pamoja na tanbihi unatunza utata huo badala ya kuamua kimya-kimya kwamba Yesu ndiye chanzo au mada pekee.
- issue: Tafsiri ya δοῦλος
  choice: mtumwa/watumwa
  alternative: mtumishi/watumishi
  rationale: Katika kifungu hiki uhusiano wa kuwa chini ya bwana na kuwa mali yake ni muhimu. “Mtumwa” linatunza nguvu ya neno la Kigiriki, ingawa “mtumishi” lingekuwa laini zaidi katika matumizi ya kawaida.
- issue: Mhusika wa ἐσήμανεν
  choice: “Naye” linamrejelea Yesu Masihi
  alternative: Kumchukulia Mungu kuwa mhusika
  rationale: Mtiririko wa sentensi unamtaja Yesu kama aliyepokea ufunuo ili awaonyeshe watumwa wake; kwa hiyo ndiye mhusika wa kawaida wa kitendo cha kuufahamisha kwa njia ya malaika wake. Tafsiri haiongezi jina lake tena, hivyo inadumisha muundo wa chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa msomaji wa kawaida. Sentensi imegawanywa baada ya “hivi karibuni” ili kuepuka msururu mzito wa vishazi, bila kubadili uhusiano wa kimantiki. “Naye” linaendeleza uratibu wa Kigiriki na kumrejelea Yesu Masihi.
