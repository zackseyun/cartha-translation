id: REV.1.8
reference: Revelation 1:8
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἐγώ εἰμι τὸ Ἄλφα καὶ τὸ Ὦ, λέγει κύριος, ὁ θεός, ὁ ὢν καὶ ὁ ἦν καὶ ὁ ἐρχόμενος, ὁ παντοκράτωρ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/008.yaml
  text: “I am the Alpha and the Omega,” says the Lord God[a], “the one who is and who was and who is coming, the Almighty.”
translation:
  language: sw
  text: “Mimi ni Alfa na Omega,” asema Bwana Mungu, “yeye aliyeko, aliyekuwako, na anayekuja[a], Mwenyezi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “atakayekuja.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγώ εἰμι
  choice: Mimi ni
  rationale: Kiwakilishi huru ‘Mimi’ pamoja na ‘ni’ kinahifadhi mkazo wa Ἐγώ katika tamko hili la heshima bila kulifanya kuwa zito.
- source_word: τὸ Ἄλφα καὶ τὸ Ὦ
  choice: Alfa na Omega
  rationale: Majina ya herufi za Kigiriki yanadumishwa kwa sababu yana maana ya kiishara katika muktadha huu na ndiyo istilahi inayotambulika katika Kiswahili cha Biblia.
- source_word: λέγει
  choice: asema
  rationale: Wakati wa sasa katika kanuni ya kunukuu unawakilishwa kwa njia ya kawaida na yenye hadhi kwa ‘asema’.
- source_word: κύριος, ὁ θεός
  choice: Bwana Mungu
  rationale: Huhifadhi vyeo viwili vya kimungu vilivyowekwa pamoja katika Kigiriki kwa mtindo wa kawaida wa Kiswahili.
- source_word: ὁ ὢν καὶ ὁ ἦν καὶ ὁ ἐρχόμενος
  choice: yeye aliyeko, aliyekuwako, na anayekuja
  rationale: Muundo huu unahifadhi mpangilio wa sehemu tatu na kutafsiri ἐρχόμενος kama tendo linaloendelea la kuja, badala ya kuligeuza kimya kimya kuwa wakati ujao tu.
- source_word: ὁ παντοκράτωρ
  choice: Mwenyezi
  rationale: ‘Mwenyezi’ ni neno la kawaida, lenye hadhi, linaloeleza mamlaka na uwezo mkuu wa Mungu bila kutumia tafsiri sisisi isiyo ya kawaida.
theological_decisions:
- issue: Jinsi ya kutafsiri ὁ ἐρχόμενος katika tamko kuhusu kuwako kwa Mungu na kuja kwake
  choice: anayekuja
  alternative: atakayekuja / ajaye
  rationale: ‘Anayekuja’ huakisi moja kwa moja zaidi participio ya wakati wa sasa na kuhifadhi wazo la kuja kunakoendelea au kwa hakika. ‘Atakayekuja’ ni tafsiri halali inayosisitiza tukio la baadaye, lakini inaweza kupunguza hali ya sasa ya umbo la Kigiriki; kwa hiyo imeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na rahisi kueleweka. ‘Aliyekuwako’ limetumiwa badala ya ‘aliyekuwa’ ili kudumisha ulinganifu wa tamko la kuwako, na ‘Mwenyezi’ limetengwa kama cheo cha mwisho cha Mungu.
