id: REV.1.18
reference: Revelation 1:18
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ὁ ζῶν— καὶ ἐγενόμην νεκρὸς καὶ ἰδοὺ ζῶν εἰμι εἰς τοὺς αἰῶνας τῶν ⸀αἰώνων— καὶ ἔχω τὰς κλεῖς τοῦ θανάτου καὶ τοῦ ᾅδου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/018.yaml
  text: and the Living One—I became dead[a], and behold[c][b], I am alive forever and ever—and I have the keys of death and of Hades.
translation:
  language: sw
  text: na Aliye Hai—nilikufa[a], na tazama, niko hai milele na milele[b]—nami nina funguo za mauti na za kuzimu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa kufuata muundo wa Kigiriki kwa karibu zaidi, “nikawa nimekufa.” Kitenzi hicho kinakazia mpito wa kuingia katika kifo, si kusema tu kwamba nilikuwa nimekufa.
    reason: lexical_alternative
  - marker: b
    text: Kwa kufuata maneno ya Kigiriki, “hata enzi za enzi,” nahau inayomaanisha muda usio na mwisho.
    reason: lexical_alternative
  - marker: c
    text: “Kuzimu” hapa ni makao au ulimwengu wa wafu, si hasa mahali pa adhabu ya mwisho.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ζῶν
  choice: Aliye Hai
  rationale: Kivumishi-ambatani chenye kibainishi kimetumika kama jina la cheo. “Aliye Hai” huhifadhi uzito wa cheo hicho na ni Kiswahili cha kawaida, chenye hadhi.
- source_word: ἐγενόμην νεκρός
  choice: nilikufa
  rationale: Ingawa muundo wa karibu zaidi ni “nikawa mfu,” “nilikufa” huonyesha kwa kawaida na wazi badiliko la kuingia katika hali ya kifo, tofauti na usemi wa hali tu, “nilikuwa nimekufa.”
- source_word: ἰδού
  choice: tazama
  rationale: Huhifadhi nguvu ya neno la kuvuta fikira katika mtindo wenye hadhi unaofaa Ufunuo.
- source_word: ζῶν εἰμι
  choice: niko hai
  rationale: Ni usemi wa kawaida wa Kiswahili unaoeleza hali ya sasa na kuhifadhi tofauti yake na “nilikufa.”
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: milele na milele
  rationale: Ni nahau ya kawaida ya Kiswahili kwa usemi wa Kigiriki unaosisitiza muda usio na mwisho.
- source_word: κλεῖς
  choice: funguo
  rationale: Ni kisawe cha moja kwa moja; katika picha hii funguo zinaashiria mamlaka au udhibiti.
- source_word: τοῦ θανάτου
  choice: za mauti
  rationale: Huhifadhi umbo la uhusiano baada ya “funguo.” “Mauti” lina hadhi ya kifasihi bila kulazimisha uhusishaji wa kifo kama nafsi.
- source_word: τοῦ ᾅδου
  choice: za Kuzimu
  rationale: “Kuzimu” humaanisha makao au ulimwengu wa wafu na huepuka kuifanya ᾅδης iwe kaburi la mwili tu au adhabu ya mwisho.
theological_decisions:
- issue: Tafsiri ya ᾅδης katika muktadha wa mambo ya mwisho
  choice: Kuzimu
  alternative: kaburi; makao ya wafu; jehanamu
  rationale: “Kuzimu” hudumisha tofauti kati ya mauti na ᾅδης kama mambo yanayohusiana lakini yasiyofanana. Huepuka kuingiza maana maalumu ya adhabu ya mwisho iliyomo katika “jehanamu,” na pia haipunguzi dhana hiyo kuwa kaburi la kimwili pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mistari mirefu hutunza mikato ya msisitizo ya maandishi ya Kigiriki; “tazama” huhifadhi sauti ya kinabii bila kuwa ya kizamani kupita kiasi.
