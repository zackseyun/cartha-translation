id: REV.1.9
reference: Revelation 1:9
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἐγὼ Ἰωάννης, ὁ ἀδελφὸς ὑμῶν καὶ ⸀συγκοινωνὸς ἐν τῇ θλίψει καὶ βασιλείᾳ καὶ ὑπομονῇ ⸀ἐν Ἰησοῦ, ἐγενόμην ἐν τῇ νήσῳ τῇ καλουμένῃ Πάτμῳ διὰ τὸν λόγον τοῦ θεοῦ ⸀καὶ τὴν μαρτυρίαν ⸀Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/009.yaml
  text: I[a], John, your brother and fellow participant in the tribulation and kingdom and endurance in Jesus, was on the island called Patmos because of the word of God and the testimony of Jesus.
translation:
  language: sw
  text: Mimi Yohana, ndugu yenu na mshiriki pamoja nanyi katika dhiki na ufalme na uvumilivu katika Yesu, nilikuwa katika kisiwa kiitwacho Patmo kwa sababu ya neno la Mungu na ushuhuda wa Yesu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ushuhuda kuhusu Yesu.” Muundo wa Kigiriki unaweza kumaanisha ushuhuda uliotolewa na Yesu au ushuhuda unaomhusu Yesu.
    reason: alternative_reading
lexical_decisions:
- source_word: συγκοινωνός
  choice: mshiriki pamoja nanyi
  rationale: Neno hili linaonyesha kushiriki hali moja na wengine. Kauli hii ya Kiswahili inaweka wazi kwamba Yohana anashiriki pamoja na wasomaji wake katika mambo matatu yanayotajwa, bila kuleta maana ya kibiashara inayoweza kuwamo katika ‘mshirika.’
- source_word: ἐν τῇ θλίψει καὶ βασιλείᾳ καὶ ὑπομονῇ
  choice: katika dhiki na ufalme na uvumilivu
  rationale: ‘Dhiki’ inahifadhi uzito wa θλῖψις katika muktadha wa ufunuo; ‘uvumilivu’ ni tafsiri fupi na sahihi ya ὑπομονή. Kurudiwa kwa ‘na’ kunahifadhi uratibu wa nomino hizo tatu.
- source_word: ἐν Ἰησοῦ
  choice: katika Yesu
  rationale: Kauli hii inaeleweka vyema kuwa inahusiana na dhiki, ufalme na uvumilivu vilivyotangulia. Tafsiri fupi ‘katika Yesu’ inahifadhi usemi wa kiteolojia bila kuufafanua kupita kiasi.
- source_word: ἐγενόμην ἐν τῇ νήσῳ
  choice: nilikuwa katika kisiwa
  rationale: Katika muktadha huu γίνομαι hutumika kwa hali ya kuwapo mahali. Tafsiri hii ni ya kawaida na haiamui namna Yohana alivyofika kisiwani.
- source_word: τῇ καλουμένῃ Πάτμῳ
  choice: kiitwacho Patmo
  rationale: Ni kauli ya kawaida na yenye hadhi kwa kutaja jina la kisiwa, huku ikifuata kazi ya kisarufi ya participio ya Kigiriki.
- source_word: διὰ τὸν λόγον τοῦ θεοῦ
  choice: kwa sababu ya neno la Mungu
  rationale: διά pamoja na hali ya akusativi inaonyesha sababu. ‘Kwa sababu ya’ huacha wazi kama sababu hiyo ilikuwa kutangaza neno, kulishikilia, au kuteswa kwa ajili yake.
- source_word: τὴν μαρτυρίαν Ἰησοῦ
  choice: ushuhuda wa Yesu
  rationale: Muundo wa umilikishi wa Kigiriki unaweza kumaanisha ushuhuda uliotolewa na Yesu au ushuhuda unaomhusu Yesu. ‘Ushuhuda wa Yesu’ unahifadhi utata huo katika matini kuu.
- source_word: ἀδελφὸς ὑμῶν
  choice: ndugu yenu
  rationale: Yohana anajitambulisha kuwa na uhusiano wa kifamilia wa kiimani na wasomaji wake. ‘Ndugu yenu’ ni ya moja kwa moja na ya kawaida katika Kiswahili.
theological_decisions:
- issue: Utata wa muundo wa umilikishi katika μαρτυρίαν Ἰησοῦ
  choice: ushuhuda wa Yesu
  alternative: ushuhuda kuhusu Yesu
  rationale: Kigiriki kinaweza kueleweka kuwa Yesu ndiye anayetoa ushuhuda au ndiye anayeshuhudiwa. Matini kuu inahifadhi mvutano huo, na tanbihi inatoa maana nyingine inayowezekana bila kuamua mjadala.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umehifadhi mfululizo wa ‘dhiki na ufalme na uvumilivu’ pamoja na usemi mfupi ‘katika Yesu,’ huku sentensi ikibaki wazi kwa msomaji wa kawaida. Alama ya tanbihi imewekwa baada ya ‘ushuhuda wa Yesu,’ ambako utata unaoelezwa unatokea.
