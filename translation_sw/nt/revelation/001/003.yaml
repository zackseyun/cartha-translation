id: REV.1.3
reference: Revelation 1:3
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: μακάριος ὁ ἀναγινώσκων καὶ οἱ ἀκούοντες τοὺς λόγους τῆς προφητείας καὶ τηροῦντες τὰ ἐν αὐτῇ γεγραμμένα, ὁ γὰρ καιρὸς ἐγγύς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/003.yaml
  text: Blessed is the one who reads aloud[a], and those who hear the words of this prophecy and keep what is written in it[b], for the time is near.
translation:
  language: sw
  text: Heri asomaye kwa sauti[a], na wale wanaosikia maneno ya unabii huu na kuyashika yale yaliyoandikwa humo, kwa maana wakati umekaribia.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “asomaye”; Kiyunani huenda kinamrejelea msomaji wa hadhara katika kusanyiko, ndiyo maana imetafsiriwa “asomaye kwa sauti.”
    reason: lexical_alternative
  - marker: b
    text: Au, “wakati uliowekwa umekaribia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριος
  choice: Heri
  rationale: “Heri” ni lugha ya kawaida ya baraka katika kauli za heri za Biblia; inaonyesha kibali na baraka ya kiroho, si hisia ya furaha pekee.
- source_word: ὁ ἀναγινώσκων
  choice: mtu anayesoma kwa sauti
  rationale: Umoja wa msomaji ukilinganishwa na wingi wa wasikilizaji unaelekea kuonyesha usomaji wa hadhara katika kusanyiko. “Kwa sauti” huweka wazi mazingira hayo yanayodokezwa na Kiyunani.
- source_word: οἱ ἀκούοντες
  choice: wale wanaosikia
  rationale: “Wanaosikia” hudumisha maana ya kupokea maneno yanayosomwa na kuendana moja kwa moja na msomaji wa hadhara.
- source_word: τοὺς λόγους τῆς προφητείας
  choice: maneno ya unabii huu
  rationale: “Maneno” hutafsiri λόγους bila kuyafanya kwa ujumla kuwa “ujumbe,” na “huu” huonyesha unabii uliomo katika kitabu kinachorejelewa.
- source_word: τηροῦντες
  choice: kuzingatia
  rationale: “Kuzingatia” hapa huwasilisha maana ya kuyatunza na kuyafuata kwa uaminifu yaliyoandikwa, bila kuibana maana kuwa kutii amri pekee.
- source_word: τὰ ἐν αὐτῇ γεγραμμένα
  choice: yaliyoandikwa humo
  rationale: Ni Kiswahili cha asili kinachorejelea mambo yaliyoandikwa ndani ya unabii au kitabu hicho; pia hudumisha hali ya maandishi ambayo tayari yameandikwa.
- source_word: ὁ γὰρ καιρὸς
  choice: kwa maana wakati
  rationale: “Wakati” huacha wazi kama καιρός inasisitiza wakati maalumu uliowekwa, huku “kwa maana” ikionyesha sababu inayoletwa na γάρ.
- source_word: ἐγγύς
  choice: umekaribia
  rationale: Hii ni njia ya kawaida na wazi ya Kiswahili ya kueleza ukaribu wa wakati bila kuingiza ratiba fulani ya matukio ya mwisho.
theological_decisions:
- issue: Mazingira ya usomaji wa hadhara yanayodokezwa na msomaji mmoja na wasikilizaji wengi
  choice: Kutafsiri ἀναγινώσκων kuwa “anayesoma kwa sauti.”
  alternative: “anayesoma” bila kutaja kusoma kwa sauti
  rationale: Tofauti kati ya msomaji mmoja na wasikilizaji wengi inadokeza kwa nguvu usomaji katika kusanyiko. Tafsiri inaweka wazi dokezo hilo bila kuongeza fundisho la kidhehebu.
- issue: Nguvu ya kieskatolojia ya καιρός ἐγγύς
  choice: “wakati umekaribia”
  alternative: “wakati uliowekwa umekaribia”
  rationale: Andiko linatangaza ukaribu wa wakati lakini halielezi mpangilio wa kina wa utimilifu. Tafsiri hudumisha dai na mvutano huo bila kuamua mfumo fulani wa matukio ya mwisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa msomaji mmoja na wasikilizaji wengi umehifadhiwa, na lugha haijaamua mabishano kuhusu wakati wa utimilifu wa unabii.
