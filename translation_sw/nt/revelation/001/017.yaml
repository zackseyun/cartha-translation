base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/017.yaml
  text: And when I saw him[a], I fell at his feet like a dead man. And he placed his right hand on me, saying, “Do not fear[b]. I am the First and the Last,”
translation:
  language: sw
  text: Nami nilipomwona, nikaanguka miguuni pake kama mtu aliyekufa.[a] Akaweka mkono wake wa kulia juu yangu, akisema, “Usiogope.[b] Mimi ndiye wa Kwanza na wa Mwisho,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kana kwamba amekufa.”
    reason: lexical_alternative
  - marker: b
    text: Au, “Usiwe na hofu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ὅτε εἶδον αὐτόν
  choice: Nami nilipomwona
  rationale: “Nami” linaendeleza simulizi kwa kuwakilisha καί, na “nilipomwona” linatoa kwa kawaida uhusiano wa wakati unaoonyeshwa na ὅτε pamoja na tendo la kuona.
- source_word: ἔπεσα πρὸς τοὺς πόδας αὐτοῦ
  choice: nikaanguka miguuni pake
  rationale: Hii ni nahau ya kawaida ya Kiswahili inayoonyesha kuanguka mbele ya miguu ya mtu bila kuongeza sababu ya kuanguka.
- source_word: ὡς νεκρός
  choice: kama mtu aliyekufa
  rationale: Inahifadhi ulinganisho wa wazi wa ὡς na haidai kwamba Yohana alikufa kihalisi.
- source_word: ἔθηκεν τὴν δεξιὰν αὐτοῦ ἐπ’ ἐμέ
  choice: Akaweka mkono wake wa kulia juu yangu
  rationale: “Akaweka” linawakilisha tendo la τίθημι kwa lugha ya kawaida, huku “mkono wake wa kulia” likihifadhi maelezo ya moja kwa moja yenye umuhimu katika kifungu.
- source_word: λέγων
  choice: akisema
  rationale: Linadumisha hali ya tendo linaloandamana na kuwekwa kwa mkono, kama ilivyo katika kitenzi-shirikishi cha Kigiriki.
- source_word: Μὴ φοβοῦ
  choice: Usiogope
  rationale: Ni amri ya kawaida, ya moja kwa moja, na yenye hadhi katika Kiswahili; inabeba maana ya φοβέομαι bila uzito usio wa lazima.
- source_word: ἐγώ εἰμι
  choice: Mimi ndiye
  rationale: Muundo huu wa Kiswahili unahifadhi msisitizo wa kiwakilishi ἐγώ na kutambulisha kwa kawaida vyeo vinavyofuata.
- source_word: ὁ πρῶτος καὶ ὁ ἔσχατος
  choice: wa Kwanza na wa Mwisho
  rationale: Vivumishi vyenye vibainishi vinatenda kama vyeo. Herufi kubwa zinaonyesha matumizi hayo ya cheo bila kuongeza maudhui yasiyokuwamo katika Kigiriki.
theological_decisions:
- issue: Matumizi ya ὁ πρῶτος καὶ ὁ ἔσχατος kama cheo
  choice: wa Kwanza na wa Mwisho
  alternative: wa kwanza na wa mwisho
  rationale: Katika muktadha huu maneno hayo ni kujitambulisha kwa cheo. Herufi kubwa zinaashiria nguvu hiyo ya cheo huku maana ya asili ikibaki bila kufafanuliwa zaidi ya kifungu chenyewe.
- issue: Nguvu ya msisitizo katika ἐγώ εἰμι
  choice: Mimi ndiye
  alternative: Mimi ni
  rationale: “Mimi ndiye” ni njia ya kawaida ya Kiswahili ya kujitambulisha kwa msisitizo kabla ya kirai cha cheo. Inahifadhi uzito wa kifasihi na kitheolojia bila kuifanya kauli kuwa dokezo mahususi lisilotajwa wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye hadhi na unaoeleweka kwa urahisi. Mfuatano wa vitenzi kwa “nika- / aka-” unaendeleza simulizi kwa kawaida, huku taswira na vyeo vya maandishi ya Kigiriki vikihifadhiwa.
