id: REV.1.13
reference: Revelation 1:13
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἐν μέσῳ ⸀τῶν λυχνιῶν ὅμοιον ⸀υἱὸν ἀνθρώπου, ἐνδεδυμένον ποδήρη καὶ περιεζωσμένον πρὸς τοῖς μαστοῖς ζώνην χρυσᾶν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/013.yaml
  text: and in the midst of the lampstands[a], one like a son of man, clothed in a robe reaching to the feet and girded across the chest with a golden sash.
translation:
  language: sw
  text: na katikati ya vile vinara vya taa, mmoja aliye kama mwana wa binadamu[a], akiwa amevaa joho lililofika miguuni na akiwa amefungwa mkanda wa dhahabu kifuani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mmoja aliye kama Mwana wa Adamu.” Maneno ya Kigiriki yana mwangwi wa Danieli 7:13, na hapa yanatumiwa kumhusu Yesu aliyetukuzwa.
    reason: Usomaji mbadala unaohifadhi uelewaji wa maneno hayo kama cheo cha Kikristo.
lexical_decisions:
- source_word: ἐν μέσῳ
  choice: katikati ya
  rationale: Huhifadhi maana ya mahali iliyo katika Kigiriki na inafaa kwa mtindo wa maono.
- source_word: λυχνιῶν
  choice: vinara vya taa
  rationale: λυχνία ni kinara kinachobeba taa, si taa yenyewe; tafsiri hii pia hudumisha taswira ya muktadha wa Ufunuo.
- source_word: ὅμοιον υἱὸν ἀνθρώπου
  choice: mmoja aliye kama mwana wa binadamu
  rationale: Huhifadhi muundo usio na kibainishi wa Kigiriki na mwangwi wa Danieli 7:13 bila kuufanya wazi zaidi kuwa cheo katika matini kuu.
- source_word: ἐνδεδυμένον
  choice: akiwa amevaa
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha hali ya mhusika kuwa amevalishwa vazi hilo.
- source_word: ποδήρη
  choice: joho lililofika miguuni
  rationale: Neno hilo hueleza vazi linalofika kwenye nyayo; ‘joho lililofika miguuni’ huwasilisha maana hiyo kwa lugha wazi na yenye hadhi.
- source_word: περιεζωσμένον
  choice: amefungwa
  rationale: Huhifadhi taswira ya mkanda uliozungushwa mwilini bila kutumia usemi wa kizamani au usio wa kawaida.
- source_word: πρὸς τοῖς μαστοῖς
  choice: kifuani
  rationale: Hueleza kwa Kiswahili cha kawaida mahali pa mkanda juu ya kiwiliwili huku ikiepuka usemi wa kianatomia unaoweza kusikika usio wa kawaida katika muktadha huu.
- source_word: ζώνην χρυσᾶν
  choice: mkanda wa dhahabu
  rationale: ζώνη linaweza kuwa mshipi au mkanda; ‘mkanda’ ni neno la kawaida na linafaa kwa kitu kilichofungwa kifuani.
theological_decisions:
- issue: Nguvu ya Kikristo ya ὅμοιον υἱὸν ἀνθρώπου
  choice: Matini kuu inasema ‘mmoja aliye kama mwana wa binadamu,’ huku usomaji wa cheo ukiwekwa katika tanbihi.
  alternative: mmoja aliye kama Mwana wa Adamu
  rationale: Muundo huu huhifadhi sintaksia ya Kigiriki na dokezo la Danieli 7:13 bila kuingiza katika matini kuu cheo kilicho wazi zaidi kuliko maneno yenyewe. Tanbihi huhifadhi usomaji wa jadi unaomhusu Kristo, kwa kuwa maono haya yanamhusu Yesu aliyetukuzwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Joho’ na ‘mkanda wa dhahabu’ hudumisha uzito wa maono bila kuwa vya kizamani. Kiwakilishi ‘vile’ kinaleta urejeleo wa vinara vilivyotajwa tayari katika muktadha.
