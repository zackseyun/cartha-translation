base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/015.yaml
  text: and his feet were like burnished bronze[a], as if refined in a furnace, and his voice was like the sound of many waters[b],
translation:
  language: sw
  text: na miguu yake ilikuwa kama shaba iliyong’arishwa[a], kana kwamba imetiwa moto katika tanuru, na sauti yake ilikuwa kama sauti ya maji mengi[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki lililotumiwa hapa ni adimu, na aina kamili ya metali inayomaanishwa haijulikani. Huenda likamaanisha shaba au mchanganyiko wa metali uliosafishwa sana na wenye kung’aa.
    reason: lexical_alternative
  - marker: b
    text: Neno lilelile la Kigiriki limetafsiriwa “sauti” mara zote mbili; hapa pia lingeweza kutafsiriwa “mvumo wa maji mengi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πόδες
  choice: miguu
  rationale: Neno πούς kwa kawaida humaanisha ‘mguu’; wingi wake umetafsiriwa moja kwa moja kama ‘miguu,’ kulingana na taswira ya maono.
- source_word: ὅμοιοι
  choice: ilikuwa kama
  rationale: ὅμοιος huonyesha ufanano. Muundo huu ni wa kawaida katika Kiswahili na unaendeleza wazi tashbihi ya maandishi ya Kigiriki.
- source_word: χαλκολιβάνῳ
  choice: shaba iliyong’arishwa
  rationale: Hili ni neno adimu ambalo maana yake mahususi haijulikani kwa hakika, lakini huenda linataja shaba au mchanganyiko wa metali wenye mng’ao mkubwa. ‘Shaba iliyong’arishwa’ huwasilisha mng’ao huo bila kudai kwa uhakika aina maalumu ya metali; kutokuwa na uhakika kumeelezwa katika tanbihi.
- source_word: ὡς ἐν καμίνῳ πεπυρωμένης
  choice: kana kwamba imesafishwa kwa moto katika tanuru
  rationale: κάμινος ni tanuru, na kitenzi πυρόομαι kinaweza kueleza kutiwa motoni, kupashwa moto sana, au kusafishwa kwa moto. Tafsiri hii inadumisha taswira ya kimetali kwa Kiswahili cha kawaida, huku tanbihi ikitaja uwezekano wa maana ya kung’aa kwa joto.
- source_word: φωνή
  choice: sauti
  rationale: φωνή linaweza kumaanisha ‘sauti’ au ‘mvumo.’ Katika matumizi ya kwanza linahusu sauti yake binafsi, kwa hiyo ‘sauti’ ndiyo tafsiri ya moja kwa moja na ya kawaida.
- source_word: ὡς φωνὴ ὑδάτων πολλῶν
  choice: kama sauti ya maji mengi
  rationale: Kurudia ‘sauti’ kunadumisha urudiaji wa φωνή katika Kigiriki, na ‘maji mengi’ kunahifadhi taswira pana ya kibiblia bila kuibana kuwa mawimbi ya bahari au maporomoko ya maji.
theological_decisions:
- issue: Tafsiri ya φωνή iliyorudiwa katika tashbihi ya mwisho
  choice: sauti yake ilikuwa kama sauti ya maji mengi
  alternative: sauti yake ilikuwa kama mvumo wa maji mengi
  rationale: Kurudia ‘sauti’ kunaakisi maandishi ya Kigiriki na kuhifadhi uzito wa taswira ya ukuu wa Mwana wa Adamu aliyetukuzwa. ‘Mvumo’ ni Kiswahili chenye nguvu lakini huongeza wazo la kishindo ambalo halijaelezwa wazi na neno lenyewe.
- issue: Utambulisho wa metali inayotajwa na χαλκολίβανον
  choice: shaba iliyong’arishwa
  alternative: metali nyangavu; shaba safi
  rationale: Kwa kuwa maana kamili ya neno hili adimu haijulikani, tafsiri haipaswi kulifanya kuwa aina maalumu ya aloi kwa uhakika. Chaguo hili linahifadhi mng’ao wa taswira na tanbihi inaweka wazi kutokuwa na uhakika wa kileksika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo unabaki karibu na urudiaji na taswira za Kigiriki, huku ukisomeka kwa urahisi. ‘Tanuru’ limetumiwa kwa sababu ni neno linaloeleweka katika muktadha wa kuyeyusha au kusafisha metali.
