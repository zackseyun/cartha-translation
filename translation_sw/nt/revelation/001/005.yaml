id: REV.1.5
reference: Revelation 1:5
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἀπὸ Ἰησοῦ Χριστοῦ, ὁ μάρτυς ὁ πιστός, ὁ πρωτότοκος τῶν νεκρῶν καὶ ὁ ἄρχων τῶν βασιλέων τῆς γῆς. Τῷ ἀγαπῶντι ἡμᾶς καὶ ⸀λύσαντι ἡμᾶς ⸀ἐκ τῶν ἁμαρτιῶν ἡμῶν ἐν τῷ αἵματι αὐτοῦ—
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/005.yaml
  text: and from Jesus the Messiah[a], the faithful witness, the firstborn of the dead, and the ruler of the kings of the earth[b]. To him who loves us and freed us from our sins by his blood—
translation:
  language: sw
  text: na kutoka kwa Yesu Masihi[a], shahidi mwaminifu, mzaliwa wa kwanza wa wafu, na mtawala wa wafalme wa dunia. Kwake yeye anayetupenda na aliyetuweka huru kutoka katika dhambi zetu kwa damu yake[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yesu Kristo.” Neno la Kigiriki ni cheo kinachomaanisha “Masihi.”
    reason: lexical_alternative
  - marker: b
    text: Baadhi ya hati zina “aliyetutakasa kutoka katika dhambi zetu kwa damu yake” badala ya “aliyetuweka huru kutoka katika dhambi zetu kwa damu yake.”
    reason: textual_variant
lexical_decisions:
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesu Masihi
  rationale: Masihi linatafsiri Χριστός kama cheo, si kana kwamba ni jina la ukoo; muundo huu ni wa kawaida na wenye hadhi katika Kiswahili.
- source_word: μάρτυς ὁ πιστός
  choice: shahidi mwaminifu
  rationale: Shahidi humaanisha anayetoa ushuhuda, bila kuingiza maana ya lazima ya kuuawa; mwaminifu huhifadhi wazo la uaminifu na kutegemeka.
- source_word: ὁ πρωτότοκος τῶν νεκρῶν
  choice: mzaliwa wa kwanza wa wafu
  rationale: Tafsiri hii huhifadhi sitiari ya πρωτότοκος na muundo wa jenitivi τῶν νεκρῶν bila kuufafanua kupita kiasi.
- source_word: ὁ ἄρχων τῶν βασιλέων τῆς γῆς
  choice: mtawala wa wafalme wa dunia
  rationale: Mtawala huonyesha mamlaka yake juu ya wafalme; dunia inafaa upeo mpana wa Ufunuo kuliko nchi.
- source_word: ἀγαπῶντι
  choice: anayetupenda
  rationale: Wakati wa sasa wa kitenzi kishirikishi unaonyesha upendo unaoendelea, kwa Kiswahili cha kawaida.
- source_word: λύσαντι ἡμᾶς ἐκ τῶν ἁμαρτιῶν ἡμῶν
  choice: aliyetuweka huru kutoka katika dhambi zetu
  rationale: Kuweka huru huwasilisha kwa kawaida taswira ya kufunguliwa au kuachiliwa iliyomo katika λύω, huku ἐκ ikionyesha kutenganishwa na dhambi.
- source_word: ἐν τῷ αἵματι αὐτοῦ
  choice: kwa damu yake
  rationale: Kwa linaonyesha damu yake kuwa njia au chombo cha kutuweka huru, maana inayofaa ya ἐν hapa.
theological_decisions:
- issue: Tofauti ya maandishi katika kitenzi baada ya “anayetupenda”
  choice: aliyetuweka huru
  alternative: aliyetuosha
  rationale: SBLGNT iliyotolewa ina λύσαντι, “aliyetuweka huru/aliyetufungua.” Tofauti inayojulikana λούσαντι, “aliyetuosha,” imehifadhiwa katika tanbihi bila kubadili matini kuu.
- issue: Uwasilishaji wa cheo Χριστός
  choice: Masihi
  alternative: Kristo
  rationale: Hapa Χριστός ni cheo cha Yesu; Masihi huwasilisha cheo hicho moja kwa moja, huku umbo la kimapokeo Kristo likitajwa katika tanbihi.
- issue: Maana ya πρωτότοκος τῶν νεκρῶν
  choice: mzaliwa wa kwanza wa wafu
  alternative: wa kwanza kufufuka kutoka kwa wafu
  rationale: Matini kuu huhifadhi sitiari na uwezekano wake wa kuonyesha hadhi na utangulizi, badala ya kuifupisha kuwa maelezo ya mpangilio wa ufufuo pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imeachwa ikiendelea kwa kistari kirefu kwa sababu wazo la Kigiriki linaendelea katika mstari unaofuata. “Kwake yeye” huhifadhi dative Τῷ na kutayarisha sifa inayofuata.
