lexical_decisions:
- source_word: δὲ
  choice: na
  rationale: Kiunganishi hafifu kinachoendeleza maelezo; ‘na’ ni cha kawaida katika Kiswahili na hakiongezi dhana ya wakati isiyokuwapo katika Kigiriki.
- source_word: κεφαλὴ
  choice: kichwa
  rationale: Neno la kawaida la kiungo cha mwili, lililohifadhiwa moja kwa moja katika maono.
- source_word: τρίχες
  choice: nywele
  rationale: Kiswahili hutumia ‘nywele’ kwa maana ya jumla kwa maelezo ya sura.
- source_word: λευκαὶ
  choice: vyeupe
  rationale: Huhifadhi rangi ya msingi na msisitizo wa weupe bila kuongeza tafsiri ya mfano.
- source_word: ὡς ἔριον λευκόν
  choice: kama sufu nyeupe
  rationale: Huhifadhi tashbihi iliyo wazi na uhusiano wa kivumishi ‘nyeupe’ na ‘sufu’.
- source_word: ὡς χιών
  choice: kama theluji
  rationale: Huhifadhi tashbihi ya pili na picha inayolimbikiza wazo la weupe.
- source_word: ὀφθαλμοὶ
  choice: macho
  rationale: Tafsiri ya kawaida na ya moja kwa moja ya kiungo hiki.
- source_word: ὡς φλὸξ πυρός
  choice: kama mwali wa moto
  rationale: Tafsiri ya karibu na ya kawaida inayohifadhi picha hai ya Kigiriki.
theological_decisions:
- issue: Maelezo ya mfano ya Mwana wa Adamu aliyetukuzwa
  choice: Picha za maono zimehifadhiwa moja kwa moja bila kufafanua ishara zake katika matini kuu.
  alternative: Kupanua tafsiri kwa kutaja wazi usafi, umilele, au hukumu.
  rationale: Aya inatoa tashbihi za maono, si ufafanuzi wa moja kwa moja wa mafundisho; kuzihifadhi kunatunza mvutano wa kiteolojia bila kuingiza fasiri ya ziada.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Alama zote za tanbihi zimewekwa katika matini kuu.
