- from: ambaye alilishuhudia neno la Mungu na ushuhuda wa Yesu Masihi[a]—yote aliyoyaona.
  to: ambaye alitoa ushuhuda kuhusu neno la Mungu, ushuhuda wa Yesu Masihi[a], na yote aliyoyaona.
  rationale: The revision uses an explicit testimony construction for ἐμαρτύρησεν, retains the source’s coordinated objects, and preserves the unresolved relationship expressed by “ushuhuda wa Yesu Masihi.” It also makes the alternative-reading footnote idiomatic in Standard East African Swahili.
