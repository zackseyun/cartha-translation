  text: ὃς ἐμαρτύρησεν τὸν λόγον τοῦ θεοῦ καὶ τὴν μαρτυρίαν Ἰησοῦ Χριστοῦ, ὅσα εἶδεν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/002.yaml
  text: who testified to the word of God and to the testimony of Jesus the Messiah[a], all that he saw.
translation:
  language: sw
  text: ambaye alitoa ushuhuda kuhusu neno la Mungu, ushuhuda wa Yesu Masihi[a], na yote aliyoyaona.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ushuhuda kutoka kwa Yesu Masihi,” au “ushuhuda kuhusu Yesu Masihi.” Kigiriki kinaweza kueleweka kwa mojawapo ya njia hizi.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐμαρτύρησεν
  choice: alilishuhudia
  rationale: Kitenzi hiki kinadumisha maana ya kutoa ushuhuda au kuthibitisha jambo kama shahidi, na pia kinahifadhi uhusiano wa kimatamshi na nomino ‘ushuhuda’ inayofuata.
- source_word: λόγον
  choice: neno
  rationale: ‘Neno la Mungu’ ni usemi wa kawaida na unaoeleweka katika Kiswahili cha Biblia, huku ukidumisha maana ya ujumbe wa Mungu uliowasilishwa.
- source_word: μαρτυρίαν
  choice: ushuhuda
  rationale: ‘Ushuhuda’ ni nomino ya kawaida inayolingana na maana ya μαρτυρία na kuhifadhi uhusiano wake na kitenzi ‘alilishuhudia.’
- source_word: Ἰησοῦ Χριστοῦ
  choice: Yesu Masihi
  rationale: Χριστός imetumiwa hapa kama cheo; ‘Masihi’ huwasilisha maana hiyo moja kwa moja katika Kiswahili cha sasa. Kiswahili hakihitaji kibainishi kinacholingana na ‘the’ ya Kiingereza.
- source_word: ὅσα εἶδεν
  choice: yote aliyoyaona
  rationale: ‘Yote’ linaonyesha upana wa ὅσα, na kishazi hiki kinafanya kazi kama muhtasari wa yale yaliyotangulia.
- source_word: τὸν λόγον τοῦ θεοῦ καὶ τὴν μαρτυρίαν Ἰησοῦ Χριστοῦ
  choice: neno la Mungu na ushuhuda wa Yesu Masihi
  rationale: Vitu viwili vilivyounganishwa vinadumishwa kama yambwa za kitenzi. Muundo ‘ushuhuda wa Yesu Masihi’ hauamui kimabavu kama ushuhuda unatoka kwake au unamhusu.
theological_decisions:
- issue: Utata wa umilikishi katika μαρτυρίαν Ἰησοῦ Χριστοῦ
  choice: ushuhuda wa Yesu Masihi
  alternative: ushuhuda kutoka kwa Yesu Masihi; ushuhuda kuhusu Yesu Masihi
  rationale: Umbo la Kigiriki linaweza kumaanisha ushuhuda unaotoka kwa Yesu au ushuhuda unaomhusu Yesu. Matini kuu inadumisha utata huo, na tanbihi inaeleza njia zote mbili.
- issue: Kutafsiri Χριστοῦ kama cheo
  choice: Masihi
  alternative: Kristo
  rationale: Katika muktadha huu maana ya cheo bado iko wazi; ‘Masihi’ huiwasilisha badala ya kulifanya neno lionekane tu kama sehemu ya jina.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Kistari kirefu kinaonyesha kuwa ‘yote aliyoyaona’ ni muhtasari wa mambo mawili yaliyotangulia bila kuongeza kiunganishi cha ufafanuzi kisichopo wazi katika Kigiriki.
