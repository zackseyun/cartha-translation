  text: λεγούσης· Ὃ βλέπεις γράψον εἰς βιβλίον καὶ πέμψον ταῖς ἑπτὰ ἐκκλησίαις, εἰς Ἔφεσον καὶ εἰς Σμύρναν καὶ εἰς Πέργαμον καὶ εἰς Θυάτειρα καὶ εἰς Σάρδεις καὶ εἰς Φιλαδέλφειαν καὶ εἰς Λαοδίκειαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/011.yaml
  text: 'saying[a], “What you see[b], write in a book and send it to the seven churches: to Ephesus and to Smyrna and to Pergamum and to Thyatira and to Sardis and to Philadelphia and to Laodicea.”'
translation:
  language: sw
  text: 'ikisema, “Kile unachokiona, kiandike katika kitabu[a], kisha ukitume kwa makanisa saba: kwa Efeso, kwa Smirna, kwa Pergamo, kwa Thiatira, kwa Sardi, kwa Filadelfia, na kwa Laodikia.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “katika gombo”; neno la Kigiriki βιβλίον linaweza kumaanisha gombo, kitabu, au hati iliyoandikwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: λεγούσης
  choice: ikisema
  rationale: Kirai hiki cha kitenzi endelevu kinaendeleza maelezo ya sauti katika mstari uliotangulia. “Ikisema” hudumisha uhusiano huo bila kutaja upya mtendaji.
- source_word: Ὃ βλέπεις
  choice: Unachokiona
  rationale: Hii ni tafsiri ya kawaida na pana ya kirai husika, ikirejelea maono bila kuyawekea mipaka isiyomo katika Kigiriki.
- source_word: γράψον
  choice: kiandike
  rationale: Amri ya moja kwa moja ya kuandika; kiambishi “ki-” kinarejelea kile kinachoonekana na kinachopaswa kuwekwa kwa maandishi.
- source_word: εἰς βιβλίον
  choice: katika kitabu
  rationale: βιβλίον inaweza kumaanisha kitabu, hati, au gombo. “Kitabu” ni neno la sasa linaloeleweka kwa urahisi, huku uwezekano wa “gombo” ukihifadhiwa katika tanbihi.
- source_word: πέμψον
  choice: ukitume
  rationale: Kitenzi ni amri ya kutuma; yambwa inayodokezwa ni hicho kilichoandikwa, kwa hiyo umoja umetumiwa.
- source_word: ταῖς ἑπτὰ ἐκκλησίαις
  choice: kwa makanisa saba
  rationale: “Makanisa” hapa ni makusanyiko mahususi ya waamini katika miji iliyotajwa, bila kudokeza dhehebu fulani.
- source_word: εἰς Ἔφεσον ... εἰς Λαοδίκειαν
  choice: kwa kanisa la Efeso, na kwa kanisa la Smirna, na kwa kanisa la Pergamo, na kwa kanisa la Thiatira, na kwa kanisa la Sardi, na kwa kanisa la Filadelfia, na kwa kanisa la Laodikia
  rationale: Kurudiwa kwa “kwa kanisa la” kunawakilisha kurudiwa kwa εἰς na kuweka wazi kwamba kila jina la mji linamaanisha kanisa lililoko huko.
theological_decisions:
- issue: Maana ya ἐκκλησίαις katika Ufunuo 1:11
  choice: makanisa
  alternative: makusanyiko
  rationale: Muktadha unaonyesha makusanyiko halisi ya Wakristo yaliyoandikiwa ujumbe. “Makanisa” ni neno la kawaida na linaloeleweka bila kuingiza msimamo wa dhehebu fulani.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya heshima na inayoeleweka kwa wasomaji wa kawaida. Marudio ya majina ya makanisa yamehifadhiwa kwa kiasi kikubwa ili kuonyesha mpangilio na msisitizo wa Kigiriki.
