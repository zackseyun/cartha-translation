  text: Ἰωάννης ταῖς ἑπτὰ ἐκκλησίαις ταῖς ἐν τῇ Ἀσίᾳ· χάρις ὑμῖν καὶ εἰρήνη ⸀ἀπὸ ὁ ὢν καὶ ὁ ἦν καὶ ὁ ἐρχόμενος, καὶ ἀπὸ τῶν ἑπτὰ πνευμάτων ἃ ἐνώπιον τοῦ θρόνου αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/004.yaml
  text: 'John, to the seven churches in Asia: Grace to you and peace from him who is, and who was, and who is coming, and from the seven spirits who are before his throne,'
translation:
  language: sw
  text: 'Yohana, kwa makanisa saba yaliyoko Asia: Neema na amani ziwe kwenu kutoka kwake yeye aliyeko, aliyekuwako, na anayekuja,[a] na kutoka kwa zile roho saba zilizo mbele ya kiti chake cha enzi,[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa usemi wa kimapokeo zaidi, “kutoka kwake yeye aliyeko, aliyekuwako, na atakayekuja.”
    reason: lexical_alternative
  - marker: b
    text: “Roho saba” huenda zikamaanisha kwa njia ya ishara utimilifu wa Roho Mtakatifu, au roho saba za mbinguni; matini ya Kigiriki yenyewe inasema “roho saba.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰωάννης
  choice: Yohana
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili cha Biblia.
- source_word: ταῖς ἑπτὰ ἐκκλησίαις
  choice: kwa makanisa saba
  rationale: Katika muktadha huu wa barua kwa jumuiya za Kikristo, “makanisa” ni tafsiri ya kawaida na ya asili ya ἐκκλησίαις.
- source_word: ἐν τῇ Ἀσίᾳ
  choice: yaliyoko Asia
  rationale: “Asia” linahifadhi jina la Kigiriki; hapa linamaanisha jimbo la Kirumi la Asia, si bara lote la kisasa.
- source_word: χάρις ὑμῖν καὶ εἰρήνη
  choice: Neema na amani ziwe kwenu
  rationale: Hii ni baraka ya kawaida ya barua, iliyotolewa kwa Kiswahili cha asili huku ὑμῖν ikionyeshwa wazi kwa “kwenu.”
- source_word: ἀπὸ ὁ ὢν καὶ ὁ ἦν καὶ ὁ ἐρχόμενος
  choice: kutoka kwake yeye aliyeko, aliyekuwako, na anayekuja
  rationale: Tafsiri hii inadumisha cheo cha kimungu na nguvu ya hali ya sasa ya ὁ ἐρχόμενος, “anayekuja,” bila kusawazisha kabisa muundo wa Kigiriki ulio wa makusudi na usio wa kawaida.
- source_word: τῶν ἑπτὰ πνευμάτων
  choice: zile roho saba
  rationale: Kigiriki kina wingi halisi, “roho saba”; tafsiri haibadili usemi huo kuwa “Roho mwenye sura saba,” jambo ambalo lingetatua mapema utambulisho unaobishaniwa.
- source_word: ἃ ἐνώπιον τοῦ θρόνου αὐτοῦ
  choice: zilizo mbele ya kiti chake cha enzi
  rationale: “Zilizo” inapatana na nomino ya Kiswahili “roho” na “mbele ya kiti chake cha enzi” huwasilisha mahali pa heshima mbele ya kiti cha enzi.
theological_decisions:
- issue: Utambulisho wa “aliyeko, aliyekuwako, na anayekuja”
  choice: Kudumisha usemi huo kama cheo cha kimungu kinachomtaja Mungu kwa namna ya binafsi.
  alternative: “yeye aliyeko, aliyekuwako, na atakayekuja”
  rationale: “Anayekuja” hufuata hali ya sasa ya kitenzi-shiriki ὁ ἐρχόμενος kwa karibu zaidi, huku tanbihi ikihifadhi tafsiri ya kimapokeo ya wakati ujao.
- issue: Utambulisho wa “roho saba”
  choice: Kuhifadhi “roho saba” katika matini kuu.
  alternative: Utimilifu wa Roho Mtakatifu kwa lugha ya ishara, au roho saba za mbinguni
  rationale: Matini ya Kigiriki yenyewe inasema “roho saba,” na utambulisho wake unabishaniwa; hivyo tafsiri haipaswi kuamua suala hilo kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kimaandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Alama za tanbihi zote zimewekwa katika matini kuu.
