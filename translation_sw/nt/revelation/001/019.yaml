  text: Therefore write what you have seen[a], and what is, and what is about to happen after these things.
translation:
  language: sw
  text: Kwa hiyo, andika mambo uliyoyaona, mambo yaliyopo, na mambo yaliyo karibu kutokea[a] baada ya mambo haya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mambo yatakayotokea baada ya mambo haya.” Katika baadhi ya miktadha, kitenzi hiki kinaweza kutumika karibu sawa na wakati ujao wa kawaida, ingawa mara nyingi hubeba maana ya jambo lililo karibu kutokea.
    reason: alternative_reading
lexical_decisions:
- source_word: γράψον
  choice: andika
  rationale: Kitenzi hiki ni amri ya moja kwa moja kwa mtu mmoja. “Andika” kinahifadhi nguvu ya agizo bila kuongeza wazo lisilokuwamo katika Kigiriki.
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Kiunganishi hiki kinaonyesha hitimisho au mwendelezo unaotokana na maono na agizo yaliyotangulia. “Kwa hiyo” kinaweka wazi uhusiano huo.
- source_word: ἃ εἶδες
  choice: mambo uliyoyaona
  rationale: Kiwakilishi cha uhusiano pamoja na kitenzi cha wakati uliopita kinarejelea yaliyomo katika maono ambayo Yohana tayari ameona. Usemi huu ni wa kawaida na wazi katika Kiswahili.
- source_word: ἃ εἰσὶν
  choice: mambo yaliyopo
  rationale: Hili linadumisha maana ya hali au mambo ya sasa bila kuongeza neno kama “sasa,” ambalo halijaelezwa moja kwa moja katika matini.
- source_word: μέλλει γίνεσθαι
  choice: mambo yaliyo karibu kutokea
  rationale: Muundo wa μέλλω pamoja na kitenzi-jina mara nyingi una maana ya jambo linalokaribia au lililo mbele kutokea. Tafsiri hii inadumisha hisia hiyo ya ukaribu badala ya kuifanya kuwa wakati ujao wa kawaida tu.
- source_word: μετὰ ταῦτα
  choice: baada ya hayo
  rationale: Ni usemi wa wakati unaorejelea mambo yaliyotajwa. “Baada ya hayo” ni wa asili katika Kiswahili na bado unaonyesha rejeleo la wingi.
theological_decisions:
- issue: Nguvu ya wakati ya μέλλει katika muktadha wa ufunuo wa kinabii
  choice: mambo yaliyo karibu kutokea
  alternative: mambo yatakayotokea
  rationale: Kigiriki kinaweza kubeba wazo la jambo linalokaribia kutokea, ingawa katika baadhi ya miktadha μέλλω hukaribia kuwa wakati ujao wa kawaida. Matini kuu inadumisha hisia ya ukaribu, na tanbihi inaonyesha uwezekano mwingine bila kutatua kimakusudi mvutano wa kieskatolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Kurudiwa kwa “mambo” kunahifadhi muundo wa vipashio vitatu vya Kigiriki na kufanya orodha iwe wazi.
