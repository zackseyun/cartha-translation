id: REV.1.7
reference: Revelation 1:7
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἰδοὺ ἔρχεται μετὰ τῶν νεφελῶν, καὶ ὄψεται αὐτὸν πᾶς ὀφθαλμὸς καὶ οἵτινες αὐτὸν ἐξεκέντησαν, καὶ κόψονται ἐπ’ αὐτὸν πᾶσαι αἱ φυλαὶ τῆς γῆς. ναί, ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/007.yaml
  text: Look[a], he is coming with the clouds, and every eye will see him, even those who pierced him, and all the tribes of the earth will mourn over him. Yes, amen.
translation:
  language: sw
  text: Tazama, anakuja pamoja na mawingu, na kila jicho litamwona, hata wale waliomchoma; na makabila yote ya dunia[a] yatamwombolezea. Naam, amina.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “makabila yote ya nchi yatamwombolezea.” Maneno haya huenda yakawa na mwangwi wa Zekaria 12:10–12, ambako “nchi” inaweza kufaa kulingana na muktadha.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Tazama
  rationale: Ni mwito wenye nguvu wa kuelekeza fikira. “Tazama” ni neno la sasa, lenye hadhi, na linalohifadhi uzito wa Kigiriki bila kuwa la kizamani kupita kiasi.
- source_word: ἔρχεται
  choice: anakuja
  rationale: Wakati wa sasa wa Kigiriki unaonyesha tukio lijalo kwa uhai na ukaribu; “anakuja” huhifadhi athari hiyo kwa Kiswahili cha kawaida.
- source_word: μετὰ τῶν νεφελῶν
  choice: pamoja na mawingu
  rationale: Huhifadhi picha ya kuja akiwa na mawingu na mwangwi wa Danieli 7:13 bila kuifanya iwe maelezo ya mahali pekee.
- source_word: ὄψεται
  choice: litamwona
  rationale: Kitenzi cha wakati ujao kimetafsiriwa kwa ulinganifu wa kawaida wa Kiswahili, kikikubaliana na “kila jicho.”
- source_word: πᾶς ὀφθαλμὸς
  choice: kila jicho
  rationale: Huhifadhi taswira halisi na mgawanyo wa umoja wa Kigiriki badala ya kuibadili kuwa “kila mtu.”
- source_word: οἵτινες αὐτὸν ἐξεκέντησαν
  choice: wale waliomchoma
  rationale: “Wale” hutaja kundi maalumu ndani ya wote watakaomwona, na “waliomchoma” huhifadhi uhusiano wa kimatamshi na Zekaria 12:10 na Yohana 19:37.
- source_word: κόψονται ἐπ’ αὐτὸν
  choice: yatamwombolezea
  rationale: Kitenzi hiki cha Kiswahili huonyesha kuomboleza juu yake au kwa sababu yake bila kulazimisha ishara maalumu ya kimwili kama kujipiga kifua.
- source_word: πᾶσαι αἱ φυλαὶ τῆς γῆς
  choice: makabila yote ya dunia
  rationale: “Makabila” huhifadhi umaalumu wa φυλαί, na “dunia” inafaa upeo wa kijumla wa aya. Maana mbadala ya “nchi” imehifadhiwa katika tanbihi kwa sababu ya mwangwi wa Zekaria.
- source_word: ναί, ἀμήν
  choice: Naam, amina
  rationale: Huhifadhi uthibitisho maradufu wenye uzito. “Amina” ni neno linaloeleweka sana katika Kiswahili na lina uzito wa kiliturujia.
theological_decisions:
- issue: Upeo wa τῆς γῆς katika πᾶσαι αἱ φυλαὶ τῆς γῆς
  choice: makabila yote ya dunia
  alternative: makabila yote ya nchi
  rationale: Kuonekana kwake na “kila jicho” kunapendelea upeo wa dunia nzima. Hata hivyo, kwa kuwa maneno haya yana mwangwi wa Zekaria 12:10–12, ambako “nchi” inaweza kufaa kimuktadha, uwezekano huo haujaondolewa bali umewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo unadumisha taswira halisi za “kila jicho,” “mawingu,” na “makabila,” huku ukisomeka kwa kawaida kwa wasomaji wa leo.
