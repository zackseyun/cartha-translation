  text: ἰδοὺ βάλλω αὐτὴν εἰς κλίνην, καὶ τοὺς μοιχεύοντας μετ’ αὐτῆς εἰς θλῖψιν μεγάλην, ἐὰν μὴ ⸀μετανοήσωσιν ἐκ τῶν ἔργων αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/022.yaml
  text: Look[a], I am throwing her onto a bed, and those who commit adultery with her into great affliction[b], unless they repent of her works.
translation:
  language: sw
  text: Tazama, nitamtupa kitandani[a], na wale wanaozini pamoja naye nitawatupa katika dhiki kubwa[b], wasipotubu na kuyaacha matendo yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwenye kitanda cha ugonjwa.” Kigiriki kinasema kihalisi “kitandani”; katika muktadha, wengi hukielewa kuwa kitanda cha mateso au ugonjwa kama hukumu.
    reason: lexical_alternative
  - marker: b
    text: Au, “katika mateso makali.” Hapa neno hilo linamaanisha taabu, mateso, au huzuni kali.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: Tazama
  rationale: Kihisishi hiki kinavuta usikivu kwa lugha ya heshima na iliyozoeleka katika Kiswahili cha Biblia.
- source_word: βάλλω
  choice: nitamtupa / nitawatupa
  rationale: Wakati uliopo wa Kigiriki una nguvu ya jambo lililo karibu kutokea katika tangazo la hukumu; wakati ujao wa Kiswahili unaonyesha kwa kawaida hukumu hiyo inayokaribia. Kitenzi kimerudiwa ili sentensi iwe wazi na ya asili.
- source_word: αὐτὴν εἰς κλίνην
  choice: nitamtupa kitandani
  rationale: κλίνη ni kitanda au kochi. Tafsiri kuu inadumisha maana ya moja kwa moja bila kuongeza dhana ya ugonjwa, ingawa muktadha wa hukumu unaweza kuashiria kitanda cha mateso.
- source_word: τοὺς μοιχεύοντας μετ’ αὐτῆς
  choice: wale wanaozini pamoja naye
  rationale: Kitenzi μοιχεύω kinamaanisha kufanya uzinzi. Muundo huu unadumisha tendo lenyewe bila kuamua kama linakusudiwa kihalisi, kiishara, au kwa namna zote mbili.
- source_word: εἰς θλῖψιν μεγάλην
  choice: katika dhiki kubwa
  rationale: Dhiki ni neno la kawaida na lenye heshima linaloweza kueleza mateso, taabu, au huzuni kali bila kulazimisha maana maalumu ya kieskatolojia.
- source_word: ἐὰν μὴ μετανοήσωσιν
  choice: wasipotubu
  rationale: Huu ni muundo mfupi na wa asili wa Kiswahili unaowasilisha sharti hasi la Kigiriki, ‘ikiwa hawatatubu’ au ‘isipokuwa watubu.’
- source_word: ἐκ τῶν ἔργων αὐτῆς
  choice: na kuziacha matendo yake
  rationale: ἐκ baada ya μετανοέω huonyesha kugeuka kutoka katika jambo fulani. Kuongeza ‘kuziacha’ kunafanya mwelekeo huo uwe wazi kwa Kiswahili cha kawaida, huku ‘matendo yake’ kikidumisha uhusiano wa matendo hayo na huyo mwanamke.
theological_decisions:
- issue: Ikiwa κλίνη itafsiriwe wazi kuwa kitanda cha mgonjwa kama hukumu
  choice: Kudumisha ‘kitandani’ katika matini kuu
  alternative: kwenye kitanda cha ugonjwa
  rationale: Muktadha unaonyesha hukumu, lakini κλίνη yenyewe haimaanishi lazima kitanda cha ugonjwa. Tafsiri kuu haiongezi ufafanuzi huo; uwezekano huo umewekwa katika tanbihi.
- issue: Ikiwa μοιχεύοντας ni uzinzi halisi, ukosefu wa uaminifu wa kiroho kwa njia ya mfano, au yote mawili
  choice: Kutafsiri kwa maana ya moja kwa moja ‘wanaozini’ na kuacha upeo wa kiishara uamuliwe na muktadha
  alternative: wanaofanya uasherati pamoja naye / wasio waaminifu pamoja naye
  rationale: μοιχεύω hutaja uzinzi moja kwa moja. Ufunuo unaweza kutumia picha hiyo kiishara pia, lakini tafsiri haipaswi kuondoa neno halisi wala kuamua kimya-kimya upeo wake.
- issue: Mhusika wa matendo katika αὐτῆς
  choice: ‘matendo yake,’ yaani matendo ya huyo mwanamke
  alternative: matendo yao
  rationale: Kiwakilishi cha Kigiriki ni umoja wa kike. Kusoma ‘matendo yao’ kungefuata tofauti ya maandishi au kurahisisha mantiki, lakini hakuwakilishi matini iliyotolewa ya SBLGNT.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa moja kwa moja lakini wa asili; ‘nitawatupa’ limerudiwa baada ya kiunganishi ili kuzuia utata wa kisarufi. Alama zote za tanbihi zimewekwa katika matini kuu.
