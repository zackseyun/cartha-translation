id: REV.2.15
reference: Revelation 2:15
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οὕτως ἔχεις καὶ σὺ κρατοῦντας τὴν ⸀διδαχὴν Νικολαϊτῶν ὁμοίως.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/015.yaml
  text: So you also have those who hold to the teaching of the Nicolaitans likewise[a].
translation:
  language: sw
  text: Hivyo, wewe pia una watu wanaoshikilia fundisho la Wanikolai vivyo hivyo[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kadhalika” au “kwa namna inayofanana.” Kigiriki kinaweza kusisitiza kwamba wanashikilia fundisho hili kwa namna inayofanana na wale waliotajwa katika mstari uliotangulia.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: Hivyo
  rationale: Neno hili linaunganisha kauli na karipio la mstari uliotangulia. “Hivyo” ni la kawaida katika Kiswahili na linahifadhi nguvu ya kuhitimisha au kulinganisha.
- source_word: ἔχεις
  choice: una watu
  rationale: Kitenzi kihalisi ni “una,” lakini katika muktadha kinamaanisha kwamba watu hao wamo miongoni mwa kusanyiko. “Una watu” ni wazi na cha kawaida bila kupanua maana kupita kiasi.
- source_word: καὶ σὺ
  choice: wewe pia
  rationale: Muundo huu unasisitiza kwamba wao, kama wale waliotajwa kabla, wana watu wa namna hiyo miongoni mwao.
- source_word: κρατοῦντας
  choice: wanaoshikilia
  rationale: Kitenzi hiki kinaonyesha kuendelea kushikamana na fundisho au kulidumisha. “Kushikilia” ni cha kawaida na kinatunza picha ya Kigiriki.
- source_word: διδαχὴν
  choice: fundisho
  rationale: “Fundisho” ni neno la sasa na linaloeleweka, nalo linaepuka uzito wa istilahi ya kitaasisi kama “doktrini.”
- source_word: Νικολαϊτῶν
  choice: Wanikolai
  rationale: Hili ni jina la kundi; “Wanikolai” ni uhawilishaji unaofuata muundo wa kawaida wa majina ya makundi katika Kiswahili.
- source_word: ὁμοίως
  choice: vivyo hivyo
  rationale: Kielezi hiki kinaonyesha ulinganisho. Kuwekwa mwishoni kunahifadhi kwa kiasi fulani uwezekano wa kukihusisha na namna ya kushikilia fundisho au na ulinganisho mpana na mstari uliotangulia.
theological_decisions:
- issue: Uhusiano wa ὁμοίως na sentensi nzima
  choice: Kuweka “vivyo hivyo” mwishoni mwa sentensi, bila kubainisha zaidi kinacholinganishwa.
  alternative: “Vivyo hivyo, wewe pia una watu wanaoshikilia fundisho la Wanikolai” au “Hivyo, wewe pia una watu ambao, kama hao, wanashikilia fundisho la Wanikolai.”
  rationale: Kigiriki kina utata mdogo kuhusu kama ὁμοίως inaeleza moja kwa moja namna wanavyoshikilia fundisho au inarejelea ulinganisho mpana na watu wa mstari wa 14. Tafsiri iliyochaguliwa haumalizi utata huo kimyakimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo mfupi na wa moja kwa moja unafuata ukali wa kauli ya Kigiriki, huku tanbihi ikihifadhi utata wa kielezi cha mwisho.
