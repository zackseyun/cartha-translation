id: REV.2.23
reference: Revelation 2:23
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ τὰ τέκνα αὐτῆς ἀποκτενῶ ἐν θανάτῳ· καὶ γνώσονται πᾶσαι αἱ ἐκκλησίαι ὅτι ἐγώ εἰμι ὁ ἐραυνῶν νεφροὺς καὶ καρδίας, καὶ δώσω ὑμῖν ἑκάστῳ κατὰ τὰ ἔργα ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/023.yaml
  text: And I will kill her children with death[a], and all the churches will know that I am the one who searches hearts and minds[b], and I will give to each of you according to your works.
translation:
  language: sw
  text: Nami nitawaua watoto wake kwa mauti[a], na makanisa yote yatajua kwamba mimi ndiye ninayechunguza figo na mioyo[b], nami nitampa kila mmoja wenu kulingana na matendo yenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa tauni.” Kigiriki kinasema kihalisi “kwa mauti,” usemi unaoweza kusisitiza hukumu hiyo au kutoa mwangwi wa lugha ya hukumu katika Agano la Kale.
    reason: lexical_alternative
  - marker: b
    text: “Figo na mioyo” ni usemi wa kibiblia kuhusu utu wa ndani, kutia ndani nia, mawazo, hisia na tamaa zilizofichika.
    reason: cultural_note
lexical_decisions:
- source_word: τέκνα
  choice: watoto
  rationale: Neno hili kwa kawaida humaanisha watoto au wazao; “watoto” linaacha wazi iwapo ni watoto halisi au wafuasi wa mfano.
- source_word: ἀποκτενῶ
  choice: nitawaua
  rationale: Kitenzi hiki humaanisha kuua moja kwa moja, na umbo la Kiswahili linaonyesha kuwa wahusika ni wengi.
- source_word: ἐν θανάτῳ
  choice: kwa kifo
  rationale: Huhifadhi usemi usio wa kawaida wa Kigiriki, “kuua kwa kifo,” pamoja na mwangwi wake wa lugha ya hukumu ya Maandiko; uwezekano wa “tauni” umewekwa katika tanbihi.
- source_word: γνώσονται
  choice: yatajua
  rationale: Hueleza matokeo ya kutambua au kujua, na linaendana na nomino ya ngeli ya makanisa.
- source_word: ἐκκλησίαι
  choice: makanisa
  rationale: Katika Ufunuo neno hili hurejelea makusanyiko ya waamini; “makanisa” ni neno la kawaida na linaloeleweka katika Kiswahili.
- source_word: ὁ ἐραυνῶν
  choice: ndiye nichunguzaye
  rationale: Huhifadhi utambulisho wenye mkazo na tendo endelevu la kuchunguza kwa kina, katika muktadha wa hukumu.
- source_word: νεφροὺς
  choice: figo
  rationale: Tafsiri halisi huhifadhi taswira ya kibiblia ya viungo vya ndani kama makao ya nia na hisia zilizofichika; tanbihi inaeleza maana yake.
- source_word: καρδίας
  choice: mioyo
  rationale: Huhifadhi taswira ya asili na matumizi ya kawaida ya kibiblia kwa utu wa ndani, mawazo, mapenzi na tamaa.
- source_word: δώσω
  choice: nitampa
  rationale: Kigiriki kinasema kihalisi “nitatoa/nitampa”; Kiswahili hiki kinaeleza ugawaji kwa kila mmoja bila kubadili kitenzi kuwa “kulipa.”
- source_word: ἑκάστῳ
  choice: kila mmoja wenu
  rationale: Huhifadhi maana ya ugawaji kwa mtu mmoja mmoja ndani ya kundi linalosemewa.
- source_word: κατὰ τὰ ἔργα ὑμῶν
  choice: kulingana na matendo yenu
  rationale: “Matendo” ni Kiswahili cha kawaida kwa ἔργα katika kauli hii ya hukumu na huwasilisha mambo ambayo watu wamefanya.
theological_decisions:
- issue: Utambulisho wa msemaji kuwa anayechunguza utu wa ndani
  choice: Kudumisha kauli ya nafsi ya kwanza, “mimi ndiye nichunguzaye figo na mioyo,” kama dai la Yesu aliyefufuka la kuwa na ujuzi wa ndani unaohusika na hukumu.
  alternative: Kufafanua kwa upole kuwa msemaji anafahamu au anaona tu mambo ya watu.
  rationale: Kigiriki kina utambulisho wenye nguvu na haki ya kuchunguza utu wa ndani; tafsiri haipaswi kupunguza uzito huo wa kiteolojia.
- issue: Maana ya “watoto wake”
  choice: Kuacha usemi huo uweze kumaanisha watoto halisi au wafuasi kwa njia ya mfano.
  alternative: Kutaja wazi kuwa ni watoto wa kuzaa, au kutaja wazi kuwa ni wafuasi/wanafunzi wake.
  rationale: Muktadha unaweza kuelekeza kwa wafuasi wa “Yezebeli,” lakini Kigiriki hakilazimishi ufafanuzi mmoja; utata halisi umehifadhiwa.
- issue: Mpangilio na maana ya “figo na mioyo”
  choice: Kuhifadhi mpangilio na taswira halisi ya Kigiriki katika matini, huku maana ya nahau ikielezwa katika tanbihi.
  alternative: Kutafsiri moja kwa moja kwa maana, kama “nia na mioyo” au “mawazo na tamaa.”
  rationale: Taswira hii ni sehemu ya lugha ya kibiblia kuhusu utu wa ndani. Tanbihi huwezesha usomaji wa kawaida bila kufuta usemi wa chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi na kinachoeleweka kwa msomaji wa kawaida. “Nichunguzaye” lina ladha ya kifasihi inayofaa sauti nzito ya Ufunuo, bila kuwa la kizamani kupita kiasi. Viashiria vyote vya tanbihi vimewekwa katika matini.
