translation:
  language: sw
  text: 'Lakini nina jambo hili dhidi yako: umeuacha upendo wako wa kwanza[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “umeacha upendo wako wa kwanza.” Maneno haya yanaweza kumaanisha upendo uliokuwa nao hapo mwanzo—iwe kwa Bwana, kwa wengine, au vyote viwili.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Lakini
  rationale: Kiunganishi hiki kinaonyesha tofauti yenye nguvu na sifa iliyotangulia; “Lakini” ni ya kawaida na wazi katika Kiswahili cha sasa.
- source_word: ἔχω κατὰ σοῦ
  choice: nina jambo hili dhidi yako
  rationale: Nahau hii inaonyesha kuwa msemaji ana shtaka au malalamiko dhidi ya mtu. Tafsiri hii ni ya asili na inadumisha uzito wa kukemea.
- source_word: ὅτι
  choice: ': umeuacha'
  rationale: ὅτι inaanzisha maudhui ya jambo lililo dhidi yao. Nukta mbili zinawasilisha uhusiano huo kwa Kiswahili cha kawaida bila kuufasiri kuwa sababu.
- source_word: ἀγάπην
  choice: upendo
  rationale: Hili ndilo neno la kawaida na linalofaa kwa ἀγάπη katika muktadha huu.
- source_word: τὴν πρώτην
  choice: wa kwanza
  rationale: Tafsiri ya moja kwa moja inadumisha uwezekano wa kumaanisha upendo wa hapo mwanzo bila kuamua kimya kimya kitu au mtu anayelengwa na upendo huo.
- source_word: ἀφῆκες
  choice: umeuacha
  rationale: Katika muktadha huu kitenzi kinamaanisha kuacha nyuma au kutoshikilia tena. “Umeuacha” ni cha asili, chenye uzito unaofaa, na pia kinahifadhi mbadala wa kileksika bila kuzidisha maana.
theological_decisions:
- issue: Maana ya “upendo wako wa kwanza”
  choice: Maneno yametafsiriwa kwa uwazi wake wa asili bila kutaja anayelengwa na upendo huo.
  alternative: “upendo wako wa kwanza kwangu,” “upendo uliokuwa nao hapo mwanzo,” au “upendo wako wa zamani”
  rationale: Kigiriki hakisemi wazi kama ni upendo kwa Bwana, kwa waamini wenzao, au vyote viwili. Tafsiri inahifadhi utata huo halisi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo ni mfupi na wenye nguvu kama Kigiriki.
