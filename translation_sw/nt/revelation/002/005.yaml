id: REV.2.5
reference: Revelation 2:5
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: μνημόνευε οὖν πόθεν ⸀πέπτωκας, καὶ μετανόησον καὶ τὰ πρῶτα ἔργα ποίησον· εἰ δὲ μή, ἔρχομαί ⸀σοι, καὶ κινήσω τὴν λυχνίαν σου ἐκ τοῦ τόπου αὐτῆς, ἐὰν μὴ μετανοήσῃς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/005.yaml
  text: Therefore remember from where you have fallen[a], and repent, and do the works you did at first. But if not, I am coming to you, and I will remove your lampstand from its place[b], unless you repent.
translation:
  language: sw
  text: Kwa hiyo, kumbuka ulipoanguka kutoka wapi[a], utubu, na ufanye matendo uliyofanya mwanzoni. Lakini usipofanya hivyo, ninakuja kwako, nami nitakiondoa kinara chako cha taa kutoka mahali pake[b], usipotubu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kumbuka ulipoanguka kutoka mahali gani pa juu.” Kigiriki kinasema kihalisi “ulipoanguka kutoka wapi”; wengine huona kuwa sitiari hiyo inadokeza mahali pa juu.
    reason: lexical_alternative
  - marker: b
    text: “Kinara cha taa” ni taswira inayotumiwa kumaanisha kanisa katika Ufunuo 1:20.
    reason: cross_reference
lexical_decisions:
- source_word: μνημόνευε
  choice: kumbuka
  rationale: Amri ya wakati uliopo inahimiza kuendelea kukumbuka; “kumbuka” ni ya kawaida na ya asili katika Kiswahili.
- source_word: οὖν
  choice: kwa hiyo
  rationale: Inaonyesha hitimisho linalotokana na karipio lililotangulia.
- source_word: πόθεν πέπτωκας
  choice: ni wapi ulikoanguka kutoka
  rationale: Inahifadhi usemi halisi na sitiari ya Kigiriki bila kuongeza waziwazi wazo la “kimo” au “mahali pa juu.”
- source_word: μετανόησον / μετανοήσῃς
  choice: utubu / usipotubu
  rationale: “Kutubu” ni neno la kawaida katika muktadha wa mabadiliko ya kimaadili na kiroho.
- source_word: τὰ πρῶτα ἔργα ποίησον
  choice: ufanye matendo uliyofanya mwanzoni
  rationale: Hutoa kwa Kiswahili cha asili maana ya matendo yaliyotambulisha hali yao ya awali.
- source_word: εἰ δὲ μή
  choice: lakini usipofanya hivyo
  rationale: Huonyesha sharti la onyo kwa uwazi huku “hivyo” ikirejelea maagizo yaliyotangulia.
- source_word: ἔρχομαί σοι
  choice: ninakuja kwako
  rationale: Inahifadhi uhai na ukaribu wa wakati wa sasa wa Kigiriki bila kuongeza maana ya “dhidi yako,” ambayo haijasemwa wazi.
- source_word: κινήσω
  choice: nitakiondoa
  rationale: Katika muktadha wa kukisogeza kinara kutoka mahali pake kama hukumu, “kuondoa” huwasilisha athari ya tendo hilo kwa uwazi.
- source_word: τὴν λυχνίαν σου
  choice: kinara chako cha taa
  rationale: λυχνία ni kitu cha kuwekea taa, si taa yenyewe; taswira ya kinara imehifadhiwa.
- source_word: ἐκ τοῦ τόπου αὐτῆς
  choice: mahali pake
  rationale: Ni usemi wa asili wa Kiswahili unaohifadhi maana ya kuondolewa kutoka mahali kilipo.
theological_decisions:
- issue: Asili ya onyo kuhusu kinara cha taa
  choice: Kudumisha taswira ya kuondolewa kwa kinara cha kanisa bila kuifafanua kuwa ni kupoteza wokovu au kupoteza ushuhuda pekee.
  alternative: Kuifasiri moja kwa moja kama kupoteza ushuhuda wa kanisa, hukumu juu ya kuwepo au hadhi ya kanisa, au kupoteza wokovu.
  rationale: Ufunuo 1:20 unatambulisha vinara vya taa kuwa makanisa, lakini aya hii yenyewe haitoi hitimisho la kimfumo kuhusu wokovu wa mtu binafsi; hivyo tafsiri inadumisha taswira na mvutano wa kiteolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa moja kwa moja na unaeleweka kwa wasomaji wa kawaida; taswira za chanzo na ukali wa onyo vimehifadhiwa bila kuingiza msimamo wa dhehebu.
