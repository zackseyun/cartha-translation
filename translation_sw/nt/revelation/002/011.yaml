id: REV.2.11
reference: Revelation 2:11
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὁ ἔχων οὖς ἀκουσάτω τί τὸ πνεῦμα λέγει ταῖς ἐκκλησίαις. ὁ νικῶν οὐ μὴ ἀδικηθῇ ἐκ τοῦ θανάτου τοῦ δευτέρου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/011.yaml
  text: The one who has an ear[a], let him hear what the Spirit says to the churches[b]. The one who conquers will certainly not be harmed by the second death.
translation:
  language: sw
  text: Yeye aliye na sikio, na asikie yale ambayo Roho anayaambia makanisa. Yeye anayeshinda[a] kamwe hatadhuriwa na mauti ya pili.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yeye ashindaye.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kamwe hataumizwa na mauti ya pili”; kwa karibu zaidi, “kamwe hatadhuriwa na mauti ya pili.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἔχων οὖς
  choice: Yeye aliye na sikio
  rationale: Muundo wa umoja wenye maana wakilishi umehifadhiwa, na neno la Kigiriki οὖς likatafsiriwa kwa umoja kuwa “sikio.”
- source_word: ἀκουσάτω
  choice: na asikie
  rationale: Huu ni wakati timilifu wa amri, nafsi ya tatu umoja. “Na asikie” ni muundo wa kawaida wa Kiswahili unaohifadhi nguvu ya himizo.
- source_word: τὸ πνεῦμα
  choice: Roho
  rationale: Katika kibwagizo hiki cha Ufunuo, msemaji anaeleweka kuwa Roho Mtakatifu; herufi kubwa inaonyesha rejeleo hilo bila kuongeza ufafanuzi ndani ya aya.
- source_word: λέγει ταῖς ἐκκλησίαις
  choice: anayaambia makanisa
  rationale: “Anayaambia” kwa njia ya kawaida huwasilisha kusema ujumbe kwa walengwa, nao ἐκκλησίαι hapa ni makusanyiko ya waamini, yaani makanisa.
- source_word: ὁ νικῶν
  choice: Yeye anayeshinda
  rationale: Kitenzi endelevu cha Kigiriki kinamtaja mtu mwenye sifa ya kushinda. “Anayeshinda” ni cha moja kwa moja na kinafaa katika muktadha wa Ufunuo.
- source_word: οὐ μὴ
  choice: kamwe ... hata-
  rationale: Muunganiko huu wa kukanusha kwa mkazo umeonyeshwa kwa “kamwe” pamoja na kitenzi cha kukanusha cha wakati ujao.
- source_word: ἀδικηθῇ
  choice: hatadhuriwa
  rationale: Kauli tendwa imehifadhiwa, na “dhuriwa” huwasilisha kupata madhara badala ya maana finyu ya kutendewa isivyo haki.
- source_word: ἐκ τοῦ θανάτου τοῦ δευτέρου
  choice: na mauti ya pili
  rationale: Katika muundo huu wa kauli tendwa, ἐκ huonyesha chanzo au kisababishi cha madhara. “Na” ni muundo wa kawaida wa Kiswahili baada ya “dhuriwa,” huku usemi muhimu “mauti ya pili” ukihifadhiwa.
theological_decisions:
- issue: Rejeleo la “Roho”
  choice: Roho kama msemaji wa kiungu anayeyaambia makanisa
  alternative: roho ya kinabii kwa maana pana zaidi
  rationale: Kibwagizo kinachorudiwa katika Ufunuo 2–3 kinamtambulisha Roho kama msemaji wa kiungu. Tafsiri haiongezi neno “Mtakatifu,” hivyo haipanuzi waziwazi maandishi ya Kigiriki.
- issue: Maana ya “mauti ya pili”
  choice: kuhifadhi usemi bila maelezo ya ndani ya aya
  alternative: kuifafanua kuwa hukumu ya mwisho au adhabu ya milele
  rationale: Ufunuo wenyewe huendeleza maana ya usemi huu baadaye; kuufafanua hapa kungeingiza hitimisho la kitheolojia ndani ya tafsiri.
- issue: Nguvu ya ukanushaji katika οὐ μὴ
  choice: kamwe hatadhuriwa
  alternative: hakika hatadhuriwa
  rationale: “Kamwe” huonyesha kwa uwazi ukanushaji wenye mkazo bila kuufanya usemi kuwa wa kizamani.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Muundo wa kibwagizo cha kinabii umehifadhiwa. Alama za tanbihi zimewekwa baada ya maneno yanayohusika moja kwa moja, badala ya kufuata nafasi zisizolingana katika safu ya ushauri ya Kiingereza.
