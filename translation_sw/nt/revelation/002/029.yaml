  text: Yeyote aliye na sikio, na asikie yale ambayo Roho anayoyasema kwa makanisa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἔχων
  choice: Yeyote aliye na
  rationale: Kirai chenye kibainishi na kitenzi-shirikishi kinamtaja mtu mwenye sifa hiyo. “Yeyote aliye na” ni Kiswahili cha sasa, cha kawaida, na kinahifadhi nguvu ya mwito wa kimethali bila kulazimisha jinsia.
- source_word: οὖς
  choice: sikio
  rationale: Nomino ya Kigiriki iko katika umoja. “Sikio” linahifadhi umoja huo na linafaa katika usemi huu wa kimethali kuhusu uwezo na utayari wa kusikia.
- source_word: ἀκουσάτω
  choice: na asikie
  rationale: Ni amri ya nafsi ya tatu, umoja. “Na asikie” huwasilisha mwito wa amri kwa Kiswahili cha heshima na hudumisha urudiaji wenye uzito wa kifungu hiki katika Ufunuo.
- source_word: τί
  choice: yale ambayo
  rationale: Hutambulisha maudhui ya kile kinachosemwa. “Yale ambayo” ni muundo wa asili katika sentensi hii na huepuka tafsiri ngumu ya neno kwa neno.
- source_word: τὸ πνεῦμα
  choice: Roho
  rationale: Katika kiitikio kinachorudiwa cha Ufunuo 2–3, neno hili humrejelea Roho wa Mungu. Herufi kubwa huonyesha rejeo hilo bila kuongeza ufafanuzi ndani ya matini.
- source_word: λέγει
  choice: anayaambia
  rationale: Kitenzi cha wakati uliopo kinaonyesha usemi unaoendelea au wa kawaida. Kwa kuwa kinafuatwa na walengwa katika hali ya utoaji, “anayaambia” ni Kiswahili cha asili kinachobeba maana ya kusema kwa makutaniko.
- source_word: ταῖς ἐκκλησίαις
  choice: makutaniko
  rationale: Katika Ufunuo 2–3, ἐκκλησίαις ni jumuiya za waamini zinazoandikiwa. “Makutaniko” huonyesha vikundi vilivyokusanyika bila kuingiza wazo la majengo.
theological_decisions:
- issue: Rejeo la τὸ πνεῦμα
  choice: Roho, yaani Roho wa Mungu anayesema na makutaniko
  alternative: roho ya mwanadamu au roho/ujumbe wa Yesu
  rationale: Katika ujumbe unaorudiwa katika Ufunuo 2–3, Roho anaonyeshwa kuwa msemaji wa kimungu anayeyaelekeza makutaniko yote. Tafsiri “Roho” huhifadhi utambulisho huo bila kuongeza maneno ya ufafanuzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo wa amri “na asikie” umehifadhi uzito wa kiitikio cha kinabii.
