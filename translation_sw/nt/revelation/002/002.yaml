  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Οἶδα τὰ ἔργα σου, καὶ τὸν ⸀κόπον καὶ τὴν ὑπομονήν σου, καὶ ὅτι οὐ δύνῃ βαστάσαι κακούς, καὶ ἐπείρασας τοὺς λέγοντας ἑαυτοὺς ⸀ἀποστόλους, καὶ οὐκ εἰσίν, καὶ εὗρες αὐτοὺς ψευδεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/002.yaml
  text: I know your works[a], your labor, and your endurance, and that you cannot tolerate evil people. You tested those who call themselves apostles and are not[b], and you found them to be false.
translation:
  language: sw
  text: Ninayajua matendo yako, kazi yako ngumu na uvumilivu wako, na kwamba huwezi kuwavumilia watu waovu. Uliwapima wale wanaojiita mitume, lakini si mitume, ukagundua kwamba ni waongo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οἶδα
  choice: Ninayajua / Najua
  rationale: Kitenzi hiki kinaeleza hali ya sasa ya kujua. Upatanisho wa yambwa katika “Ninayajua matendo” ni wa kawaida katika Kiswahili, huku “Najua pia kwamba” ikitambulisha kishazi kinachofuata kwa uwazi.
- source_word: ἔργα
  choice: matendo
  rationale: “Matendo” yanahifadhi maana pana ya shughuli na mambo yaliyofanywa, na ni ya kawaida katika muktadha wa tathmini ya kiroho.
- source_word: κόπον
  choice: kazi yako ngumu
  rationale: κόπος hudokeza kazi yenye juhudi na uchovu. “Kazi ngumu” ni wazi na ya kawaida kuliko tafsiri nzito au ya kale.
- source_word: ὑπομονήν
  choice: uvumilivu
  rationale: Neno hili linaeleza kudumu kwa uthabiti chini ya shida; “uvumilivu” ni neno la kawaida na lenye heshima katika Kiswahili.
- source_word: οὐ δύνῃ βαστάσαι
  choice: huwezi kuwavumilia
  rationale: Ingawa βαστάζω kimsingi inaweza kumaanisha kubeba, hapa ina maana ya kukataa kustahimili au kuvumilia watu wa aina hiyo.
- source_word: κακούς
  choice: watu waovu
  rationale: Kivumishi cha Kigiriki kimetumiwa kama nomino kwa watu. “Watu waovu” huepuka kuingiza jinsia isiyokusudiwa na huonyesha wazi kwamba kinachorejelewa ni watu.
- source_word: ἐπείρασας
  choice: uliwapima
  rationale: Katika muktadha huu kitenzi kinamaanisha kuchunguza ukweli wa madai yao. “Kuwapima” huhifadhi taswira ya jaribio na ni ya kawaida katika lugha ya kibiblia ya kisasa.
- source_word: λέγοντας ἑαυτοὺς ἀποστόλους
  choice: wale wanaojiita mitume
  rationale: 'Tafsiri hii inadumisha nguvu ya kiwakilishi cha kujirejelea: wao wenyewe ndio wanaodai cheo hicho.'
- source_word: ἀποστόλους
  choice: mitume
  rationale: Katika muktadha wa makanisa, maana ya cheo cha wajumbe wenye mamlaka ndiyo inayowezekana zaidi kuliko maana ya jumla ya wajumbe.
- source_word: ψευδεῖς
  choice: wa uongo
  rationale: “Wa uongo” hudumisha sifa ya kwamba watu hao si wa kweli bila kulazimisha tafsiri kali zaidi ya “waongo,” ambayo inaweza kusisitiza tendo la kusema uongo.
theological_decisions:
- issue: Hadhi ya wale wanaodai kuwa mitume
  choice: Kutumia cheo “mitume” na kusema wazi kwamba si mitume
  alternative: “Wajumbe” au “wanaodai kuwa mitume” bila kurudia kwamba si mitume
  rationale: Muktadha unaelekea kwenye dai la mamlaka ya kitume. Tafsiri inadumisha kukataliwa wazi kwa dai hilo bila kuingiza nadharia ya baadaye kuhusu ofisi ya kitume.
- issue: Maana ya ψευδεῖς kuhusu wadai hao
  choice: “wa uongo”
  alternative: “waongo” au “mitume bandia”
  rationale: “Wa uongo” huhifadhi uwezekano kwamba neno linahukumu ama watu hao wenyewe ama uhalali wa madai yao, badala ya kulifanya hasa kuwa shtaka kuhusu kauli za uongo.
- issue: Jinsia ya κακούς
  choice: “watu waovu”
  alternative: “wanaume waovu”
  rationale: Umasculine wa Kigiriki hapa unatumika kwa watu kwa ujumla; hakuna ushahidi wa kutosha kwamba wanaume pekee ndio waliokusudiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ndefu ya Kigiriki imegawanywa ili iwe wazi kwa msomaji wa kawaida, huku uhusiano wa mawazo na msisitizo wa Kristo wa kujua matendo, kazi ngumu, uvumilivu na utambuzi wa kanisa ukihifadhiwa.
