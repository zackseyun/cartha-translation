id: REV.2.10
reference: Revelation 2:10
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ⸀μηδὲν φοβοῦ ἃ μέλλεις ⸀πάσχειν. ⸀ἰδοὺ μέλλει ⸀βάλλειν ὁ διάβολος ἐξ ὑμῶν εἰς φυλακὴν ἵνα πειρασθῆτε, καὶ ⸀ἕξετε θλῖψιν ἡμερῶν δέκα. γίνου πιστὸς ἄχρι θανάτου, καὶ δώσω σοι τὸν στέφανον τῆς ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/010.yaml
  text: Do not fear what you are about to suffer[a]. Look, the devil is about to throw some of you into prison so that you may be tested, and you will have tribulation for ten days. Be faithful until death[c][b], and I will give you the crown of life.
translation:
  language: sw
  text: Usiogope mateso unayokaribia kupata. Tazama, Ibilisi anakaribia kuwatupa baadhi yenu gerezani ili mjaribiwe[a], nanyi mtapata dhiki kwa siku kumi. Uwe mwaminifu hadi kufa[b], nami nitakupa taji ya uzima[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki linaweza kumaanisha kupimwa, kufanyiwa mtihani, au kushawishiwa kutenda mabaya.
    reason: lexical_alternative
  - marker: b
    text: Maneno “hadi kufa” yanaweza pia kumaanisha “hata kufikia hatua ya kufa,” yaani, kuendelea kuwa mwaminifu hata ikiwa itakubidi kuuawa kwa ajili ya imani.
    reason: alternative_reading
  - marker: c
    text: Neno la Kigiriki linalotafsiriwa “taji” (stephanos) linamaanisha shada au tuzo aliyopewa mshindi, si taji la kifalme.
    reason: cultural_note
lexical_decisions:
- source_word: μηδὲν φοβοῦ ἃ μέλλεις πάσχειν
  choice: Usiogope mateso yaliyo karibu kukupata
  rationale: Hili ni katazo la kuogopa mateso yanayokaribia. Muundo huu ni wa kawaida katika Kiswahili na unahifadhi maana ya ukaribu wa wakati inayotolewa na μέλλω, bila kutumia tafsiri ya neno kwa neno isiyo ya asili.
- source_word: ἰδοὺ
  choice: Tazama
  rationale: Neno hili linavuta fikira za msomaji kwa jambo linalofuata; “Tazama” lina uzito unaofaa na linaeleweka katika Kiswahili cha sasa.
- source_word: μέλλει βάλλειν ὁ διάβολος ἐξ ὑμῶν εἰς φυλακήν
  choice: Ibilisi anakaribia kuwatupa baadhi yenu gerezani
  rationale: “Anakaribia” huhifadhi hali ya jambo lililo karibu kutokea; “kuwatupa ... gerezani” hudumisha nguvu ya βάλλειν, na “baadhi yenu” huonyesha kuwa ni sehemu ya kundi.
- source_word: ἵνα πειρασθῆτε
  choice: ili mjaribiwe
  rationale: Kitenzi “jaribu” katika Kiswahili kinaweza kuonyesha kupimwa, kufanyiwa mtihani, au kushawishiwa kutenda mabaya, hivyo kinahifadhi kwa ustadi upana wa maana wa πειράζω.
- source_word: ἕξετε θλῖψιν ἡμερῶν δέκα
  choice: mtapata dhiki kwa siku kumi
  rationale: “Dhiki” linaonyesha mateso na shinikizo zito linalodokezwa na θλῖψις, huku “kwa siku kumi” ikieleza muda.
- source_word: γίνου πιστὸς ἄχρι θανάτου
  choice: Uwe mwaminifu hadi kufa
  rationale: “Uwe mwaminifu” ni amri ya kudumu katika hali ya uaminifu. “Hadi kufa” hudumisha maana ya moja kwa moja na haifungi kifungu hicho kwa kifo cha kawaida tu au kwa kuuawa kwa ajili ya imani tu.
- source_word: τὸν στέφανον τῆς ζωῆς
  choice: taji ya uzima
  rationale: Huu ni usemi mfupi na wenye hadhi unaohifadhi uhusiano wa kisarufi na kitheolojia wa “taji” na “uzima”; maana ya kitamaduni ya στέφανος inaelezwa katika tanbihi.
theological_decisions:
- issue: Maana ya πειρασθῆτε katika muktadha wa mateso yanayoletwa na Ibilisi
  choice: mjaribiwe
  alternative: mpimwe; mfanyiwe mtihani; mshawishiwe
  rationale: “Mjaribiwe” linaweza kubeba wazo la imani kupimwa pamoja na uwezekano wa kushawishiwa. Hivyo tafsiri haiondoi kimya kimya utata uliopo katika neno la Kigiriki.
- issue: Nguvu ya ἄχρι θανάτου
  choice: hadi kufa
  alternative: hata kufikia hatua ya kufa; hata kama itakulazimu kufa
  rationale: Tafsiri iliyochaguliwa inahifadhi mwito wa kuendelea kuwa mwaminifu mpaka kifo na pia inaruhusu uwezekano wa kuuawa kwa ajili ya imani bila kuifanya hiyo kuwa maana pekee.
- issue: Taswira ya στέφανος
  choice: taji ya uzima
  alternative: shada la ushindi la uzima
  rationale: “Taji” ni neno linalotambulika na kuhifadhi usemi wa kibiblia, lakini tanbihi inaweka wazi kuwa taswira ya Kigiriki ni tuzo au shada la mshindi, si taji la kifalme.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wa kawaida, na wenye hadhi. Umoja katika “Uwe” na “nitakupa” umehifadhiwa kwa sababu msemaji anamwelekeza mjumbe wa kanisa, huku wingi katika “baadhi yenu” na “mjaribiwe” ukiihusu jumuiya. Alama zote za tanbihi zimewekwa mara moja katika sehemu husika za matini.
