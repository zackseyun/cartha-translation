id: REV.2.14
reference: Revelation 2:14
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀλλὰ ἔχω κατὰ σοῦ ὀλίγα, ὅτι ἔχεις ἐκεῖ κρατοῦντας τὴν διδαχὴν Βαλαάμ, ὃς ⸂ἐδίδασκεν τῷ⸃ Βαλὰκ βαλεῖν σκάνδαλον ἐνώπιον τῶν υἱῶν Ἰσραήλ, ⸀φαγεῖν εἰδωλόθυτα καὶ πορνεῦσαι·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/014.yaml
  text: 'But I have a few things against you: you have there some who hold to the teaching of Balaam[a], who taught Balak to put a stumbling block before the sons of Israel, to eat food sacrificed to idols and to commit sexual immorality.'
translation:
  language: sw
  text: 'Lakini nina mambo machache dhidi yako: una huko watu wanaoshikilia fundisho la Balaamu, aliyemfundisha Balaki kuweka kikwazo mbele ya wana wa Israeli[a], ili wale vyakula vilivyotolewa sadaka kwa sanamu na wafanye uasherati.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watoto wa Israeli” au “Waisraeli.” Kigiriki kinasema “wana wa Israeli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀλίγα
  choice: mambo machache
  rationale: Kivumishi cha wingi kisicho na nomino kimetumiwa kama nomino; “mambo machache” huweka wazi maana iliyodokezwa na ni Kiswahili cha kawaida.
- source_word: κρατοῦντας
  choice: wanaoshikilia
  rationale: Hapa κρατέω humaanisha kuendelea kuambatana na fundisho, si kushika kitu kimwili.
- source_word: τὴν διδαχὴν Βαλαάμ
  choice: fundisho la Balaamu
  rationale: “Fundisho” ni neno la kawaida na linaloeleweka, huku majina yakifuata tahajia zilizozoeleka katika Kiswahili.
- source_word: ἐδίδασκεν τῷ Βαλὰκ
  choice: aliyemfundisha Balaki
  rationale: Wakati usiotimilifu wa Kigiriki katika masimulizi haya unatolewa kwa wakati uliopita wa kawaida wa Kiswahili bila kulazimisha dhana ya tendo lililoendelea.
- source_word: βαλεῖν σκάνδαλον
  choice: kuweka kikwazo
  rationale: Huhifadhi sitiari ya kitu kinachosababisha mtu ajikwae au aanguke kimaadili na kiroho, bila kuifafanua kupita kiasi kuwa “mtego.”
- source_word: τῶν υἱῶν Ἰσραήλ
  choice: wana wa Israeli
  rationale: Huhifadhi kwa usahihi umbo la kiume la Kigiriki na pia ni usemi wa kibiblia unaoeleweka katika Kiswahili.
- source_word: φαγεῖν εἰδωλόθυτα
  choice: ili wale vyakula vilivyotolewa sadaka kwa sanamu
  rationale: Hueleza kwa Kiswahili cha sasa vyakula vilivyotolewa katika ibada ya sanamu; “ili” huonyesha kwamba hivi ndivyo kikwazo kilivyowashawishi kutenda.
- source_word: πορνεῦσαι
  choice: wafanye uasherati
  rationale: “Uasherati” ni neno pana na linaloeleweka kwa mwenendo wa kingono usio halali, bila kuubana kwa aina moja tu.
theological_decisions:
- issue: Iwapo τῶν υἱῶν Ἰσραήλ itafsiriwe kwa usemi usioonyesha jinsia
  choice: wana wa Israeli
  alternative: watoto wa Israeli; Waisraeli
  rationale: Maandishi ya Kigiriki yanasema kihalisi “wana”; tafsiri kuu huhifadhi umbo hilo, huku maneno ya kawaida zaidi yakitajwa katika tanbihi.
- issue: Iwapo σκάνδαλον itafsiriwe kisitiari au kifafanuzi
  choice: kikwazo
  alternative: mtego; kishawishi cha kutenda dhambi
  rationale: “Kikwazo” huhifadhi picha ya Kigiriki ya kujikwaa na kuanguka bila kuamua kimya kimya aina kamili ya ushawishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa kawaida kwa wasomaji wa leo, lakini huhifadhi sitiari ya “kikwazo,” usemi “wana wa Israeli,” na uhusiano wa vitendo viwili vinavyofuata.
