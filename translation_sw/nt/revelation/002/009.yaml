  verdict: revise
  source_fidelity: The draft accurately preserves the coordinated objects of "I know," the unqualified paradox of poverty and richness, the source sense of ἐκ as the origin of hostile speech, and the literal phrase "sinagogi la Shetani." However, "kashfa" ordinarily denotes a scandal in contemporary Standard East African Swahili and is less precise for βλασφημία here. "Matukano" naturally conveys hostile reviling. The explicit repetition "si Wayahudi" is grammatically possible, but goes beyond the Greek's elliptical "are not" and can sound like a direct ethnic denial; "si hivyo" retains the stated polemical contrast without supplying an additional formulation.
  naturalness: '"Dhiki" is a more idiomatic singular equivalent for θλῖψις in this context than "mateso," while "matukano" is clearer and more natural than "kashfa" for abusive/defamatory speech. "Wanaosema kuwa wao ni Wayahudi, nao si hivyo" is fluent Standard East African Swahili and reflects the reflexive claim and subsequent denial.'
  terminology: Use "dhiki" for θλῖψις, "umaskini" for πτωχεία, "tajiri" without qualification for πλούσιος, "matukano" for βλασφημία in this human-directed context, and retain "sinagogi la Shetani" literally. The footnote preserves "kashfa" and "makufuru" as alternatives without making either govern the main text.
  issues:
  - severity: medium
    issue: '"Kashfa" as the main rendering of βλασφημία'
    rationale: In current Swahili, "kashfa" commonly means scandal or disgrace rather than specifically hostile reviling/defamatory speech. "Matukano" more reliably conveys the contextual sense of βλασφημία.
  - severity: low
    issue: '"lakini si Wayahudi" explicitly restates the denied predicate'
    rationale: The Greek says καὶ οὐκ εἰσίν, literally "and are not," leaving the predicate elliptical. The explicit repetition is defensible for clarity, but "nao si hivyo" is closer to the form and avoids an unnecessarily categorical ethnic-sounding expression.
