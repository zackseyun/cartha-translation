source:
  edition: SBLGNT
  text: Οἶδά ⸀σου τὴν θλῖψιν καὶ τὴν πτωχείαν, ἀλλὰ πλούσιος εἶ, καὶ τὴν βλασφημίαν ἐκ τῶν λεγόντων Ἰουδαίους εἶναι ἑαυτούς, καὶ οὐκ εἰσίν, ἀλλὰ συναγωγὴ τοῦ Σατανᾶ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/009.yaml
  text: I know your affliction and your poverty—but you are rich—and the slander of those who say that they are Jews and are not[b][a], but are a synagogue of Satan.
translation:
  language: sw
  text: Ninajua dhiki yako na umaskini wako—lakini wewe ni tajiri—na matukano[a] kutoka kwa wale wanaosema kuwa wao ni Wayahudi, nao si hivyo, bali ni sinagogi[b] la Shetani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kashfa” au “makufuru.” Hapa neno linamaanisha maneno ya uadui yanayowalenga waamini; ndiyo maana “matukano” limetumiwa katika matini.
    reason: lexical_alternative
  - marker: b
    text: Usemi “sinagogi la Shetani” umehifadhiwa kihalisi. Neno “sinagogi” linaweza pia kumaanisha “kusanyiko” au “mkusanyiko.”
    reason: lexical_alternative
lexical_decisions:
- source_word: θλῖψιν
  choice: mateso
  rationale: Neno hili hueleza dhiki, shinikizo, au taabu inayovumiliwa. “Mateso” ni Kiswahili cha kawaida na chenye hadhi kinachofaa muktadha bila kuingiza maana maalumu ya matukio ya mwisho.
- source_word: πτωχείαν
  choice: umaskini
  rationale: Hii ndiyo tafsiri ya moja kwa moja na ya kawaida ya hali ya kutokuwa na mali.
- source_word: πλούσιος
  choice: tajiri
  rationale: Inahifadhi mkazo wa kinyume kati ya umaskini unaoonekana na utajiri ambao haujaelezwa zaidi katika Kigiriki.
- source_word: βλασφημίαν
  choice: kashfa
  rationale: Katika muktadha huu neno linahusu maneno ya uadui yanayowachafua waamini. “Kashfa” huwasilisha uchongezi huo bila kudokeza lazima kuwa ni maneno yanayomkufuru Mungu moja kwa moja.
- source_word: ἐκ τῶν λεγόντων
  choice: kutoka kwa wale wanaosema
  rationale: ἐκ huonyesha chanzo cha kashfa, na muundo huu wa Kiswahili unafuata maana hiyo kwa uwazi.
- source_word: Ἰουδαίους εἶναι ἑαυτούς
  choice: kwamba wao ni Wayahudi
  rationale: Huwasilisha dai lao kwa Kiswahili cha kawaida bila kuongeza sifa kama “wa kweli,” ambayo haipo katika matini.
- source_word: συναγωγὴ
  choice: sinagogi
  rationale: Inahifadhi umahususi wa kihistoria na usemi mkali wa matini; neno linaweza pia kumaanisha kusanyiko.
- source_word: τοῦ Σατανᾶ
  choice: la Shetani
  rationale: Ni uwasilishaji wa kawaida wa hali ya umilikaji au uhusiano katika Kiswahili na huhifadhi ukali wa usemi.
theological_decisions:
- issue: Kauli kuhusu wale wanaosema kuwa wao ni Wayahudi lakini si Wayahudi
  choice: Kudumisha “Wayahudi” kihalisi na kurudia nomino hiyo katika sehemu ya ukanushaji kwa uwazi wa Kiswahili.
  alternative: wale wanaodai kuwa watu wa Mungu lakini si watu wake; wale wanaosema kuwa wao ni Wayahudi wa kweli lakini si hivyo
  rationale: Ἰουδαίους iko wazi katika Kigiriki. Tafsiri haipaswi kugeuza kauli hii kuwa hukumu iliyoelezwa zaidi kuhusu kabila wala kuongeza “wa kweli.” Inadumisha mvutano wa kiteolojia wa matini bila kuutatua.
- issue: Iwapo kufafanua kwamba utajiri ni wa kiroho
  choice: Kuacha “wewe ni tajiri” bila kivumishi cha ufafanuzi.
  alternative: lakini wewe ni tajiri kiroho
  rationale: Muktadha unaashiria utajiri usio wa mali, lakini Kigiriki hakisemi “kiroho”; kuiongeza kungefanya dokezo kuwa kauli ya wazi.
- issue: Utambulisho wa “sinagogi la Shetani”
  choice: Kuhifadhi usemi huo bila kuupanua kuwa madai kuhusu Wayahudi wote.
  alternative: kusanyiko linalomilikiwa na Shetani
  rationale: Kauli ya Kigiriki inalenga kundi maalumu linalotajwa katika muktadha. Tafsiri inahifadhi maneno yake makali bila kuyapanua zaidi ya matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Dashi ndefu zinahifadhi kauli ya pembeni yenye mkazo, “lakini wewe ni tajiri.” Alama zote za tanbihi zimewekwa katika matini kuu.
