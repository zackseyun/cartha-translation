  text: and he will shepherd them with an iron rod[a], as clay vessels are shattered[b],
translation:
  language: sw
  text: naye atawachunga kwa fimbo ya chuma[a], kama vyombo vya udongo vinavyovunjwa vipande vipande[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “atawatawala kwa fimbo ya chuma.” Kitenzi hicho kwa maana ya moja kwa moja ni “kuchunga,” lakini katika mwangwi huu wa Zaburi 2 pia kina maana ya kutawala kama mfalme.
    reason: alternative_reading
  - marker: b
    text: Huu ni mwangwi wa Zaburi 2:9, ambako mataifa yanavunjwa kama vyombo vya mfinyanzi.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ
  choice: naye
  rationale: Kiunganishi hiki kinahifadhi uhusiano na ahadi katika mstari uliotangulia; “naye” ni ya asili katika Kiswahili na humrejelea mhusika anayezungumziwa.
- source_word: ποιμανεῖ
  choice: atawachunga
  rationale: Kitenzi hiki kimsingi humaanisha kufanya kazi ya mchungaji. “Atawachunga” huhifadhi taswira hiyo, huku muktadha wa Zaburi 2 na fimbo ya chuma ukibeba pia maana ya mamlaka ya kifalme.
- source_word: ἐν ῥάβδῳ σιδηρᾷ
  choice: kwa fimbo ya chuma
  rationale: “Fimbo” inaweza kuwa chombo cha mchungaji au ishara ya mamlaka, na hivyo huhifadhi upana wa taswira ya Kigiriki na mwangwi wa Zaburi 2.
- source_word: ὡς
  choice: kama
  rationale: Hutoa ulinganisho wa moja kwa moja kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: τὰ σκεύη τὰ κεραμικὰ
  choice: vyombo vya udongo
  rationale: Tafsiri hii ni ya asili na inaonyesha kuwa vyombo hivyo ni vya kufinyangwa na vyenye kuvunjika kwa urahisi.
- source_word: συντρίβεται
  choice: vinavyovunjwa vipandevipande
  rationale: Huwasilisha nguvu ya συντρίβω, yaani kuvunja kabisa, badala ya kuvunja kwa kiwango kidogo. Upatanisho wa wingi umetumiwa kwa mujibu wa sarufi ya Kiswahili.
theological_decisions:
- issue: Mwangwi wa kifalme na Kimasihi wa Zaburi 2:9 katika ποιμανεῖ na taswira ya fimbo ya chuma
  choice: Kudumisha taswira ya uchungaji katika matini kuu kwa “atawachunga,” huku mamlaka ya kutawala ikifafanuliwa katika tanbihi.
  alternative: “Atawatawala kwa fimbo ya chuma”
  rationale: Kigiriki kimetumia ποιμαίνω, si kitenzi cha kawaida tu cha kutawala. Tafsiri hii inahifadhi mvutano kati ya uchungaji, utawala wa kifalme, na hukumu badala ya kuufuta.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa urahisi. “Vipandevipande” huhifadhi ukali wa tendo la kuvunja, na “atawachunga” hudumisha taswira na utata halisi wa chanzo.
