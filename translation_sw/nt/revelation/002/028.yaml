base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/028.yaml
  text: just as I also have received from my Father[a], and I will give him the morning star.
translation:
  language: sw
  text: kama vile mimi pia nilivyopokea kutoka kwa Baba yangu; nami nitampa nyota ya asubuhi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nyota ya alfajiri.” Usemi huu unaweza kudokeza taswira ya kifalme ya Kimasihi, na pia unaweza kutazamia Ufunuo 22:16, ambako Yesu anajitambulisha kuwa “nyota ya asubuhi yenye kung’aa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς κἀγὼ
  choice: kama vile mimi pia
  rationale: Huhifadhi ulinganisho wa ὡς na maana ya nyongeza na msisitizo katika κἀγώ, huku ikisomeka kwa Kiswahili cha kawaida.
- source_word: εἴληφα
  choice: nilivyopokea
  rationale: Katika muundo wa ulinganisho, kitenzi hiki huonyesha kwamba Mwana amekwisha kupokea kutoka kwa Baba. Kiswahili hakilazimiki kuiga hali timilifu ya Kigiriki kwa umbo maalumu; ‘nilivyopokea’ huwasilisha tendo lililotimia na uhusiano wake na ahadi inayofuata.
- source_word: παρὰ τοῦ πατρός μου
  choice: kutoka kwa Baba yangu
  rationale: παρά pamoja na hali ya umilikishi huonyesha chanzo. Tafsiri hii huhifadhi wazi uhusiano wa Mwana na Baba bila kuongeza ufafanuzi wa kiteolojia.
- source_word: καὶ δώσω αὐτῷ
  choice: nami nitampa
  rationale: Huwasilisha wakati ujao na yule anayepokea zawadi kwa mtiririko wa kawaida wa Kiswahili. ‘Nami’ huunganisha ahadi hii na kauli iliyotangulia.
- source_word: τὸν ἀστέρα τὸν πρωϊνόν
  choice: nyota ya asubuhi
  rationale: Ni usemi wa kawaida na unaoeleweka kwa ‘morning star,’ nao huhifadhi taswira bila kuamua maana yake ya kiishara ndani ya matini.
theological_decisions:
- issue: Utambulisho na maana ya ‘nyota ya asubuhi’
  choice: Kudumisha sitiari ‘nyota ya asubuhi’ bila kuitambulisha moja kwa moja katika matini kuu.
  alternative: Kuifafanua kuwa Kristo mwenyewe, ishara ya ufalme wa Kimasihi, au tuzo ya utukufu wa mwisho.
  rationale: Aya yenyewe haifafanui ishara hii. Ufunuo 22:16 unaweza kuhusishwa nayo, lakini tafsiri kuu inapaswa kuhifadhi uwezekano na mvutano huo wa kiteolojia.
- issue: Uhusiano wa Kristo na Baba katika ‘kutoka kwa Baba yangu’
  choice: Kutafsiri maneno hayo moja kwa moja bila kuongeza aina ya mamlaka au maelezo ya uhusiano wao.
  alternative: Kuongeza kwamba alipokea mamlaka iliyokabidhiwa na Baba au kuufafanua uhusiano huo kwa istilahi za baadaye za mafundisho.
  rationale: Matini hutaja kupokea na uhusiano wa Mwana na Baba, lakini haiongezi ufafanuzi huo katika aya hii.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Alama ya tanbihi imewekwa baada ya ‘nyota ya asubuhi,’ ambako maelezo yake yanahusika.
