  text: Καὶ τῷ ἀγγέλῳ ⸀τῆς ἐν Σμύρνῃ ἐκκλησίας γράψον· Τάδε λέγει ὁ πρῶτος καὶ ὁ ἔσχατος, ὃς ἐγένετο νεκρὸς καὶ ἔζησεν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/008.yaml
  text: 'And to the angel of the church in Smyrna write: These things says the First and the Last[b][a], who became dead and lived again:'
translation:
  language: sw
  text: '“Na kwa malaika[a] wa kanisa lililoko Smirna andika: Haya ndiyo asemayo wa Kwanza na wa Mwisho, aliyekufa, akawa hai tena:[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mjumbe” wa kanisa lililoko Smirna.
    reason: alternative_reading
  - marker: b
    text: Au, “aliyekuwa amekufa, naye akawa hai.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: malaika
  rationale: Katika muktadha wa kinabii wa Ufunuo, “malaika” ndiyo maana inayofaa zaidi; “mjumbe” pia inawezekana kileksika.
- source_word: ἐκκλησίας
  choice: kanisa
  rationale: Neno hili hapa linamaanisha jumuiya ya waamini katika Smirna; “kanisa” ni tafsiri ya kawaida, ya asili, na inayoeleweka katika Kiswahili.
- source_word: Τάδε λέγει
  choice: Haya ndiyo asemayo
  rationale: Kauli hii inahifadhi uzito wa fomula ya ujumbe wa kinabii huku ikiwa ya asili katika Kiswahili cha heshima.
- source_word: ὁ πρῶτος καὶ ὁ ἔσχατος
  choice: wa Kwanza na wa Mwisho
  rationale: Herufi kubwa zinaonyesha kuwa maneno haya yanatumika kama cheo cha Kristo, huku muundo wa Kigiriki ukihifadhiwa kwa uwazi.
- source_word: ἐγένετο νεκρὸς
  choice: aliyekufa
  rationale: Kiswahili cha asili hueleza kuingia kwake katika hali ya kifo kwa “aliyekufa”; tafsiri ya neno kwa neno kama “aliyekuwa mfu” ingekuwa nzito au isiyo ya kawaida.
- source_word: ἔζησεν
  choice: akawa hai tena
  rationale: Tafsiri hii inadhihirisha mabadiliko kutoka kifo kwenda uzimani na kuwasilisha maana ya ufufuo iliyo katika muktadha.
theological_decisions:
- issue: Cheo cha Kikristo na maneno kuhusu kifo na ufufuo
  choice: wa Kwanza na wa Mwisho, aliyekufa kisha akawa hai tena
  alternative: wa kwanza na wa mwisho, aliyekuwa amekufa na akarudi kwenye uzima
  rationale: Tafsiri inahifadhi cheo cha juu cha Kristo na ushuhuda wa kifo na ufufuo wake bila kuongeza maelezo ya kimadhehebu. “Kisha” huonyesha mfuatano unaodokezwa na utofauti wa vitenzi bila kufafanua zaidi ya maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo “Haya ndiyo asemayo” umetumiwa kudumisha sauti rasmi ya ujumbe wa kinabii. Alama ya tanbihi [a] imewekwa baada ya kifungu kinachohusika.
