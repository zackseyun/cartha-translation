  text: καὶ ὁ νικῶν καὶ ὁ τηρῶν ἄχρι τέλους τὰ ἔργα μου, δώσω αὐτῷ ἐξουσίαν ἐπὶ τῶν ἐθνῶν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/026.yaml
  text: And to the one who conquers and keeps my works until the end[a], I will give authority over the nations[c][b],
translation:
  language: sw
  text: Na yeye ashindaye[a] na ayashikaye matendo yangu[b] hadi mwisho, nitampa mamlaka juu ya mataifa,[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “anayeshinda” au “mshindi.”
    reason: lexical_alternative
  - marker: b
    text: “Matendo yangu” yanaweza kumaanisha matendo yaliyo ya Yesu au yanayopatana naye—matendo yake, makusudi yake, au matendo anayoyataka; Kigiriki hakifafanui zaidi uhusiano huo.
    reason: lexical_alternative
  - marker: c
    text: Kigiriki kinatumia maumbo ya umoja wa kiume (“yeye ashindaye ... nitampa”), lakini yametumiwa hapa kwa uwakilishi na hayawahusu wanaume pekee.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ νικῶν
  choice: yeye ashindaye
  rationale: Kishiriki cha wakati uliopo chenye kibainishi kinamtaja mtu anayejulikana kwa kushinda. “Ashindaye” huhifadhi taswira hai ya mapambano iliyo ya kawaida katika Ufunuo.
- source_word: ὁ τηρῶν
  choice: ayashikaye
  rationale: τηρέω inaweza kumaanisha kushika, kutunza, kuzingatia, au kulinda. “Ayashikaye” huhifadhi upana huo bila kuifanya iwe kutii amri pekee.
- source_word: ἄχρι τέλους
  choice: hadi mwisho
  rationale: Huu ni usemi wa wakati unaosisitiza kudumu mpaka kufikia kikomo; “hadi mwisho” ni Kiswahili cha kawaida na cha wazi.
- source_word: τὰ ἔργα μου
  choice: matendo yangu
  rationale: 'Tafsiri hii inafuata muundo wa Kigiriki na kudumisha utata wa uhusiano: yanaweza kuwa matendo ya Yesu, yanayopatana naye au anayoyataka, bila kuamua maana moja kimyakimya.'
- source_word: δώσω αὐτῷ
  choice: nitampa
  rationale: Kitenzi cha Kiswahili huonyesha nafsi ya kwanza ya wakati ujao na mtendewa mmoja, hivyo kinawasilisha kwa ufupi maana ya “nitampa yeye.”
- source_word: ἐξουσίαν
  choice: mamlaka
  rationale: ἐξουσία hapa ni mamlaka au haki ya kutawala, si uwezo kwa maana pana tu.
- source_word: ἐπὶ τῶν ἐθνῶν
  choice: juu ya mataifa
  rationale: Katika muktadha huu, ἔθνη ni mataifa au jamii za ulimwengu, na ἐπί pamoja na jenitivi huonyesha mamlaka ya kutawala juu yao.
theological_decisions:
- issue: Umoja wa kiume unaotumika kwa uwakilishi
  choice: Kutumia “yeye” na “-m-” za umoja bila kuingiza jinsia
  alternative: Kutumia wingi kama “wale washindao”
  rationale: Kigiriki kina maumbo ya umoja wa kiume yanayotumika kwa uwakilishi. Kiswahili hakitofautishi jinsia katika “yeye” au kiambishi cha ngeli ya mtu, hivyo umoja unahifadhiwa bila kudokeza kuwa ahadi hiyo ni ya wanaume pekee.
- issue: Maana ya “matendo yangu”
  choice: Kudumisha usemi “matendo yangu”
  alternative: “matendo ninayoyaagiza” au “mambo niliyowaamuru”
  rationale: Kigiriki hakifafanui ikiwa haya ni matendo anayofanya Yesu, anayoyataka, au yanayopatana na mfano na kusudi lake. Tafsiri haipaswi kubana uhusiano huo kwa tafsiri moja ya kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa msomaji wa kawaida. Muundo “ashindaye ... ayashikaye” unadumisha ulinganifu wa vishiriki vya Kigiriki; “matendo yangu” limeachwa kwa makusudi bila ufafanuzi unaoondoa utata wa asili.
