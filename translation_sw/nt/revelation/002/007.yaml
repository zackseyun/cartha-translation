id: REV.2.7
reference: Revelation 2:7
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὁ ἔχων οὖς ἀκουσάτω τί τὸ πνεῦμα λέγει ταῖς ἐκκλησίαις. τῷ νικῶντι δώσω αὐτῷ φαγεῖν ἐκ τοῦ ξύλου τῆς ζωῆς, ὅ ἐστιν ἐν τῷ παραδείσῳ τοῦ ⸀θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/007.yaml
  text: The one who has an ear[a], let him hear what the Spirit says to the churches. To the one who conquers I will give to eat from the tree of life, which is in the paradise of God.
translation:
  language: sw
  text: Mwenye sikio na asikie yale ambayo Roho anayaambia makanisa. Yule anayeshinda[a], nitampa kula kutoka katika mti wa uzima ulio katika paradiso ya Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, yule ashindaye.
    reason: Njia nyingine ya kutafsiri muundo wa kishiriki τῷ νικῶντι huku maana ya kushinda ikibaki wazi.
lexical_decisions:
- source_word: ὁ ἔχων οὖς
  choice: Mwenye sikio
  rationale: Muundo huu wa umoja ni wa kawaida na unaeleweka katika Kiswahili, huku ukihifadhi taswira halisi ya neno οὖς, ‘sikio.’
- source_word: ἀκουσάτω
  choice: na asikie
  rationale: Huhifadhi nguvu ya amri ya nafsi ya tatu na ni mwito wa kawaida na wa heshima katika Kiswahili.
- source_word: τὸ πνεῦμα
  choice: Roho
  rationale: Katika kiitikio hiki cha Ufunuo 2–3, neno hili linamrejelea Roho Mtakatifu; herufi kubwa inaonyesha rejeleo hilo bila kuongeza jina lisilokuwamo hapa.
- source_word: λέγει ταῖς ἐκκλησίαις
  choice: anayaambia makanisa
  rationale: Kitenzi cha wakati wa sasa kimetafsiriwa kwa hali ya sasa, na ἐκκλησίαις kwa ‘makanisa,’ neno la kawaida katika muktadha huu.
- source_word: τῷ νικῶντι
  choice: Yule anayeshinda
  rationale: ‘Anayeshinda’ huhifadhi hali ya kitendo inayoendelea ya kitenzi νικάω na taswira ya ushindi inayojirudia katika Ufunuo.
- source_word: δώσω αὐτῷ φαγεῖν
  choice: nitampa kula
  rationale: Hufuata kwa karibu muundo wa Kigiriki, ‘nitampa yeye kula,’ bila kuongeza wazo la ‘haki’ au ‘ruhusa’ ambalo halijaelezwa moja kwa moja.
- source_word: ἐκ τοῦ ξύλου τῆς ζωῆς
  choice: kutoka katika mti wa uzima
  rationale: ‘Kutoka katika’ huwakilisha ἐκ kama chanzo, na ξύλον katika muktadha huu ni ‘mti,’ si mbao.
- source_word: παραδείσῳ τοῦ θεοῦ
  choice: paradiso ya Mungu
  rationale: ‘Paradiso’ huhifadhi uzito wa kieskatolojia na mwangwi wa bustani ya Mungu, huku ‘ya Mungu’ ikiwakilisha uhusiano wa umilikaji au ushirika wa genitivi.
theological_decisions:
- issue: Rejeleo la τὸ πνεῦμα
  choice: Roho, yaani Roho Mtakatifu
  alternative: roho kwa maana ya roho isiyotajwa bayana
  rationale: Kiitikio kinachorudiwa katika Ufunuo 2–3 ni ujumbe wa kimungu kwa makanisa; kwa hiyo herufi kubwa ‘Roho’ inaafiki muktadha.
- issue: Maana ya νικάω katika ahadi
  choice: anayeshinda
  alternative: mshindi
  rationale: Muundo wa kitenzi huhifadhi vizuri zaidi wazo la mtu anayeshinda kuliko nomino ‘mshindi,’ bila kufafanua kimadhehebu aina ya ushindi huo.
- issue: Umoja wenye maana ya uwakilishi
  choice: Mwenye sikio ... Yule anayeshinda
  alternative: Wenye masikio ... wale wanaoshinda
  rationale: Kigiriki kiko katika umoja, lakini kinamwalika kila msikilizaji; Kiswahili kinaweza kuhifadhi umoja huo bila kutumia kiwakilishi cha kijinsia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo wa kiitikio umehifadhiwa, na maneno ya kitheolojia ‘Roho,’ ‘mti wa uzima,’ na ‘paradiso ya Mungu’ yametumiwa kwa uthabiti.
