id: REV.2.16
reference: Revelation 2:16
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: μετανόησον οὖν· εἰ δὲ μή, ἔρχομαί σοι ταχύ, καὶ πολεμήσω μετ’ αὐτῶν ἐν τῇ ῥομφαίᾳ τοῦ στόματός μου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/016.yaml
  text: Therefore repent[a]. But if not, I am coming to you quickly[b], and I will make war against them with the sword of my mouth.
translation:
  language: sw
  text: Kwa hiyo, tubu. Lakini usipotubu, ninakuja kwako upesi, nami nitawapiga vita[a] kwa upanga wa kinywa changu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “pamoja nao”; baada ya kitenzi “kupiga vita,” maana katika muktadha ni “dhidi yao.”
    reason: lexical_alternative
  - marker: b
    text: “Upanga wa kinywa changu” ni taswira ya kiapokaliptiki ya neno au tamko la Kristo linalotekeleza hukumu.
    reason: cross_reference
lexical_decisions:
- source_word: μετανόησον
  choice: tubu
  rationale: Ni amri ya nafsi ya pili umoja inayotaka toba ya dhati na ya kuamua; “tubu” ni kifupi, cha kawaida, na kinahifadhi uzito wa kimaadili na kiroho.
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Inaonyesha hitimisho linalotokana na karipio lililotangulia na kuhifadhi uhusiano wa kimantiki.
- source_word: εἰ δὲ μή
  choice: Lakini kama sivyo
  rationale: Inahifadhi sharti na utofautishaji wa onyo bila kuongeza kwa lazima maneno yasiyo katika kifungu hiki.
- source_word: ἔρχομαί σοι
  choice: ninakuja kwako
  rationale: Wakati uliopo una nguvu ya tukio linalokaribia; “kwako” huhifadhi tofauti kati ya kuja kwake kwa anayeandikiwa na hatua yake dhidi ya “wao.”
- source_word: ταχύ
  choice: upesi
  rationale: Neno hili laweza kuonyesha ukaribu wa wakati au kasi ya kutokea; “upesi” linaacha upeo huo wazi.
- source_word: πολεμήσω μετ’ αὐτῶν
  choice: nitapigana dhidi yao
  rationale: Huhifadhi ukali wa lugha ya vita na kuweka wazi kuwa hao ndio wanaolengwa, si washirika wake.
- source_word: ἐν τῇ ῥομφαίᾳ
  choice: kwa upanga
  rationale: “Kwa” linaonyesha chombo kinachotumiwa huku picha ya upanga ikidumishwa.
- source_word: τοῦ στόματός μου
  choice: wa kinywa changu
  rationale: Tafsiri hii inafuata muundo wa umilikaji wa Kigiriki na kudumisha taswira ya kiapokaliptiki badala ya kuifafanua kuwa “neno langu.”
theological_decisions:
- issue: Hatua ya Kristo dhidi ya kanisa na wale wanaokosea
  choice: Onyo linatofautisha kuja kwa Kristo “kwako” na kupigana kwake “dhidi yao.”
  alternative: Kusema kwamba anakuja dhidi ya kanisa lote, au kwamba kuja kwake hakulihusu kanisa hata kidogo.
  rationale: Kigiriki kinamwelekea anayeandikiwa kwa umoja katika “kwako,” lakini kinawataja wengine kwa wingi katika hatua ya vita. Tafsiri haifuti mvutano huo.
- issue: Upanga unaohusishwa na kinywa cha Kristo
  choice: Taswira ya “upanga wa kinywa changu” imehifadhiwa.
  alternative: Kuifafanua moja kwa moja kuwa “neno langu” au “nguvu ya maneno yangu.”
  rationale: Ufunuo hutumia taswira ya kiapokaliptiki yenye uzito wa hukumu; kuibadili kuwa maelezo ya moja kwa moja kungepunguza nguvu na uwezekano wa maana ya matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Ninakuja” hudumisha hali ya sasa ya Kigiriki, na “upesi” huepuka kuamua kama mkazo ni ‘hivi karibuni’ au ‘kwa kasi.’ Alama za tanbihi zimewekwa karibu na maneno yanayofafanuliwa.
