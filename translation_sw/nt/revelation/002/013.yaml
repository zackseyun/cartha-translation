id: REV.2.13
reference: Revelation 2:13
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ⸀Οἶδα ποῦ κατοικεῖς, ὅπου ὁ θρόνος τοῦ Σατανᾶ, καὶ κρατεῖς τὸ ὄνομά μου, καὶ οὐκ ἠρνήσω τὴν πίστιν μου ⸀καὶ ἐν ταῖς ⸀ἡμέραις Ἀντιπᾶς, ὁ μάρτυς μου, ὁ πιστός ⸀μου, ὃς ἀπεκτάνθη παρ’ ὑμῖν, ὅπου ὁ Σατανᾶς κατοικεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/013.yaml
  text: I know where you live—where Satan’s throne is[a]. Yet you hold fast my name, and you did not deny faith in me, even in the days of Antipas, my witness, my faithful one, who was killed among you[b], where Satan lives.
translation:
  language: sw
  text: Najua unakoishi, pale kilipo kiti cha enzi cha Shetani. Lakini unalishikilia sana jina langu, wala hukuikana imani yangu[a], hata katika siku za Antipa, shahidi wangu[b], yule mwaminifu wangu, aliyeuawa miongoni mwenu, pale anapoishi Shetani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “imani kwangu” au “uaminifu wangu.” Usemi wa Kigiriki “imani yangu” ni mfupi na unaweza kueleweka kwa zaidi ya njia moja.
    reason: alternative_reading
  - marker: b
    text: Au “mfia-imani wangu.” Neno la Kigiriki linaweza kumaanisha “shahidi,” na katika muktadha wa mateso au kifo linaweza pia kuwa na maana ya “mfia-imani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἶδα
  choice: Najua
  rationale: Kitenzi hiki kina maana ya wakati uliopo katika muktadha huu; “Najua” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: κατοικεῖς
  choice: unakoishi
  rationale: κατοικέω humaanisha kuishi au kukaa mahali; “unakoishi” ni Kiswahili cha sasa na huunganika vizuri na ποῦ.
- source_word: ὅπου ὁ θρόνος τοῦ Σατανᾶ
  choice: pale kilipo kiti cha enzi cha Shetani
  rationale: Inadumisha taswira kali ya kiapokaliptiki bila kueleza kiti hicho kinawakilisha nini.
- source_word: κρατεῖς τὸ ὄνομά μου
  choice: unalishikilia sana jina langu
  rationale: “Kushikilia sana” huonyesha ushikamanifu thabiti unaodokezwa na κρατέω, huku “jina langu” likihifadhi tamathali ya asili.
- source_word: οὐκ ἠρνήσω
  choice: wala hukuikana
  rationale: ἀρνέομαι hapa ni kukana; umbo hili linaeleza kwamba hawakufanya hivyo wakati wa jaribu.
- source_word: τὴν πίστιν μου
  choice: imani yangu
  rationale: Huhifadhi muundo mfupi wa Kigiriki na utata wa uhusiano wa μου badala ya kuamua kimya kimya kuwa ni imani kwa Kristo au uaminifu wake.
- source_word: ἐν ταῖς ἡμέραις Ἀντιπᾶς
  choice: hata katika siku za Antipa
  rationale: Hufuata usemi wa muda wa chanzo bila kuongeza maelezo kuhusu siku hizo.
- source_word: ὁ μάρτυς μου
  choice: shahidi wangu
  rationale: Maana ya msingi ya μάρτυς ni shahidi; muktadha wa kuuawa unawezesha pia maana ya mfia-imani, iliyohifadhiwa katika tanbihi.
- source_word: ὁ πιστός μου
  choice: yule mwaminifu wangu
  rationale: Huhifadhi πιστός kama maelezo tofauti yenye hadhi ya nomino, badala ya kuiunganisha kimya kimya na “shahidi.”
- source_word: ἀπεκτάνθη παρ’ ὑμῖν
  choice: aliyeuawa miongoni mwenu
  rationale: “Aliyeuawa” ni tafsiri wazi ya kauli tendwa, na “miongoni mwenu” huepuka kudokeza kwamba waumini wenyewe ndio waliomuua.
theological_decisions:
- issue: Maana ya τὴν πίστιν μου
  choice: “imani yangu” katika matini kuu
  alternative: “imani kwangu” au “uaminifu wangu”
  rationale: Kiwakilishi cha umilikaji cha Kigiriki kinaweza kueleweka kwa zaidi ya njia moja. Matini kuu inahifadhi usemi wake mfupi, na tanbihi inataja tafsiri kuu zinazowezekana.
- issue: Maana ya μάρτυς katika muktadha wa kifo
  choice: “shahidi” katika matini kuu
  alternative: “mfia-imani”
  rationale: “Shahidi” ndiyo maana ya msingi ya neno, lakini kwa kuwa Antipa aliuawa, maana ya “mfia-imani” pia inafaa kutajwa bila kuifanya kuwa tafsiri pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inadumisha marudio ya mahali anapoishi Shetani na taswira ya “kiti cha enzi,” huku ikiepuka ufafanuzi wa kimadhehebu.
