source:
  edition: SBLGNT
  text: ὑμῖν δὲ λέγω τοῖς λοιποῖς τοῖς ἐν Θυατείροις, ὅσοι οὐκ ἔχουσιν τὴν διδαχὴν ταύτην, οἵτινες οὐκ ἔγνωσαν τὰ βαθέα τοῦ Σατανᾶ, ὡς λέγουσιν, οὐ βάλλω ἐφ’ ὑμᾶς ἄλλο βάρος·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/024.yaml
  text: 'But to the rest of you in Thyatira I say: all who do not hold this teaching[a], who have not known the deep things of Satan, as they call them—I am not laying any other burden on you.'
translation:
  language: sw
  text: 'Lakini ninawaambia ninyi wengine mlioko Thiatira: wale wote wasiolishikilia fundisho hili, ambao hawajayajua “mambo ya kina ya Shetani,” kama wasemavyo[a]—sitawatwika mzigo mwingine.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “vilindi vya Shetani.” Usemi wa Kigiriki huenda unaakisi kwa kejeli dai la kuwa na ufahamu wa kiroho wa “kina,” dai ambalo Yohana analikataa.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῖς λοιποῖς
  choice: ninyi wengine
  rationale: Huwatofautisha waumini waliobaki na wale wanaolishikilia fundisho linalotajwa, huku ikiwa lugha ya kawaida ya Kiswahili.
- source_word: ἐν Θυατείροις
  choice: mlioko Thiatira
  rationale: Jina la mahali limetoholewa kwa namna inayotambulika katika Kiswahili, na muundo huu unaonyesha wazi kuwa watu hao wako Thiatira.
- source_word: ἔχουσιν τὴν διδαχὴν ταύτην
  choice: wanalishikilia fundisho hili
  rationale: Kitenzi ἔχω pamoja na διδαχή hapa kina maana ya kulikubali na kudumu katika fundisho, si kuwa nalo tu.
- source_word: οἵτινες οὐκ ἔγνωσαν
  choice: ambao hawajayajua
  rationale: Huhifadhi wazo la kutofikia ujuzi au uzoefu unaodaiwa bila kueleza kwa undani zaidi ya Kigiriki.
- source_word: τὰ βαθέα τοῦ Σατανᾶ
  choice: mambo ya kina ya Shetani
  rationale: Huhifadhi taswira ya mambo ya ndani au ya kina na mwangwi unaowezekana wa dai la kuwa na ufahamu wa siri wa kiroho.
- source_word: ὡς λέγουσιν
  choice: yale waitayo
  rationale: Huonyesha kuwa usemi huo ni jina au maelezo yanayotumiwa na watu fulani, bila kuamua kikamilifu ni nani anayeyatumia au kwa nia gani.
- source_word: οὐ βάλλω ἐφ’ ὑμᾶς ἄλλο βάρος
  choice: Sitawatwika mzigo mwingine
  rationale: “Kutwika mzigo” ni nahau ya asili ya Kiswahili inayohifadhi wazo la kuweka wajibu juu ya mtu.
theological_decisions:
- issue: Mrejeo na nguvu ya usemi τὰ βαθέα τοῦ Σατανᾶ, ὡς λέγουσιν
  choice: mambo ya kina ya Shetani, yale waitayo
  alternative: mafumbo ya Shetani, kama wasemavyo
  rationale: Tafsiri inadumisha usemi wa taarifa wenye kejeli inayowezekana bila kuamua kama walimu wa uongo walidai kuwa na maarifa ya “kina” ambayo Yohana anayataja kuwa ya Shetani, au kama usemi wote ni jina la kejeli.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Alama za kunukuu zinaonyesha usemi unaoripotiwa bila kufuta utata wa msemaji au nia yake.
