id: REV.2.19
reference: Revelation 2:19
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Οἶδά σου τὰ ἔργα, καὶ τὴν ⸂ἀγάπην καὶ τὴν πίστιν⸃ καὶ τὴν διακονίαν καὶ τὴν ὑπομονήν σου, καὶ τὰ ἔργα σου τὰ ἔσχατα πλείονα τῶν πρώτων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/019.yaml
  text: I know your works[a], your love and faith and service and endurance, and that your last works are more than the first.
translation:
  language: sw
  text: Ninajua matendo yako, upendo wako, imani yako[a], huduma yako na uvumilivu wako. Pia ninajua kwamba matendo yako ya mwisho ni mengi kuliko yale ya kwanza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uaminifu.” Neno la Kigiriki linaweza kumaanisha imani au uaminifu katika muktadha huu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἶδά
  choice: Ninajua
  rationale: Kitenzi οἶδα kina maana ya hali ya sasa, ‘kujua’; ‘Ninajua’ ni usemi wa kawaida na unaolingana na kauli inayorudiwa kwa makanisa katika Ufunuo.
- source_word: ἔργα
  choice: matendo
  rationale: Neno ἔργα hapa linamaanisha vitendo vinavyoonekana. ‘Matendo’ ni Kiswahili cha kawaida na huhifadhi kurudiwa kwa neno hilo katika mstari huu.
- source_word: ἀγάπην
  choice: upendo
  rationale: Neno ἀγάπη hapa ni wema wa upendo unaotendwa kama sifa ya Kikristo; ‘upendo’ ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: πίστιν
  choice: imani
  rationale: Neno πίστις linaweza kumaanisha imani au uaminifu katika muktadha huu. ‘Imani’ limewekwa katika matini kuu, huku maana nyingine ikihifadhiwa katika tanbihi.
- source_word: διακονίαν
  choice: huduma
  rationale: Neno διακονία linamaanisha kutumikia au huduma ya vitendo. ‘Huduma’ linaeleweka kwa urahisi na halilazimishi wazo la cheo rasmi.
- source_word: ὑπομονήν
  choice: uvumilivu
  rationale: Neno ὑπομονή katika Ufunuo hubeba maana ya kudumu kwa uthabiti chini ya shinikizo; ‘uvumilivu’ ni neno la kawaida linalowasilisha maana hiyo.
- source_word: τὰ ἔργα σου τὰ ἔσχατα
  choice: matendo yako ya mwisho
  rationale: Kifungu hiki kinatofautisha matendo ya kipindi cha baadaye na yale ya mwanzo. ‘Ya mwisho’ huhifadhi ulinganisho wa Kigiriki bila kuyafanya kuwa matendo ya wakati ujao.
- source_word: πλείονα τῶν πρώτων
  choice: ni mengi kuliko yale ya kwanza
  rationale: Neno πλείονα ni la ulinganisho na linaweza kuonyesha wingi au kiwango kikubwa zaidi. ‘Ni mengi kuliko yale ya kwanza’ huhifadhi kwa uwazi maana ya msingi ya ulinganisho.
theological_decisions:
- issue: Maana ya πίστις katika orodha ya sifa
  choice: imani
  alternative: uaminifu
  rationale: Katika orodha hii πίστις linaweza kumaanisha kumwamini Mungu au uaminifu unaoonekana katika mwenendo. Matini kuu inatumia ‘imani,’ na tanbihi inahifadhi uwezekano halisi wa ‘uaminifu’ bila kuondoa mvutano huo wa kimaana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Sentensi ndefu ya Kigiriki imegawanywa katika sentensi mbili ili isomwe kwa urahisi, huku mpangilio wa sifa na ulinganisho wa matendo ya mwisho na ya kwanza ukihifadhiwa.
