id: REV.2.12
reference: Revelation 2:12
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ τῷ ἀγγέλῳ τῆς ἐν Περγάμῳ ἐκκλησίας γράψον· Τάδε λέγει ὁ ἔχων τὴν ῥομφαίαν τὴν δίστομον τὴν ὀξεῖαν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/012.yaml
  text: 'And to the angel of the church in Pergamum write: These things says the one who has the sharp, double-edged sword:[a]'
translation:
  language: sw
  text: '“Na kwa malaika wa kanisa lililo Pergamo andika: Haya ndiyo asemayo yule aliye na upanga mkali wenye makali kuwili:[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mjumbe” badala ya “malaika.” Wafafanuzi hutofautiana kuhusu kama anayerejelewa ni kiumbe wa mbinguni au mwakilishi wa kibinadamu wa kanisa.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: malaika
  rationale: Neno linaweza kumaanisha kiumbe wa mbinguni au mjumbe wa kibinadamu. ‘Malaika’ linaendeleza istilahi ya Ufunuo na kuhifadhi utata wa rejeleo.
- source_word: ἐκκλησίας
  choice: kanisa
  rationale: Katika muktadha huu ni jumuiya ya waamini wa Kristo; ‘kanisa’ ni neno la kawaida na la asili katika Kiswahili cha sasa.
- source_word: γράψον
  choice: andika
  rationale: Ni amri ya moja kwa moja; yaliyomo yanafuata katika tamko linalonukuliwa.
- source_word: Τάδε λέγει
  choice: Haya ndiyo asemayo
  rationale: Kauli hii inaendeleza uzito wa utangulizi rasmi wa kinabii huku ikisomeka kwa heshima katika Kiswahili.
- source_word: ὁ ἔχων
  choice: yule aliye na
  rationale: Inahifadhi nguvu ya usemi wa kumtambulisha msemaji kwa sifa yake.
- source_word: ῥομφαίαν
  choice: upanga
  rationale: ‘Upanga’ ni kisawe wazi bila kuongeza kwa lazima wazo la ukubwa au aina maalumu ambayo muktadha hauhitaji.
- source_word: δίστομον
  choice: wenye makali kuwili
  rationale: Hutoa maana ya ‘wenye ncha/makali pande mbili’ kwa Kiswahili cha kawaida na cha picha.
- source_word: ὀξεῖαν
  choice: mkali
  rationale: Katika muktadha wa upanga, ‘mkali’ ni namna ya asili ya kueleza kuwa una uwezo wa kukata.
- source_word: Περγάμῳ
  choice: Pergamo
  rationale: ‘Pergamo’ ni umbo la jina la mahali linalotumika kwa kawaida katika mapokeo ya Biblia ya Kiswahili.
theological_decisions:
- issue: Utambulisho wa ‘malaika’ wa kanisa
  choice: Kuweka ‘malaika’ katika matini bila kubainisha kama ni wa mbinguni au mwakilishi wa kibinadamu.
  alternative: mjumbe; kiongozi wa kanisa; mwakilishi wa mbinguni
  rationale: ἄγγελος inaruhusu maana zaidi ya moja, na mstari wenyewe hautatui rejeleo hilo. Tafsiri inapaswa kuhifadhi utata huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kifasihi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo ‘Haya ndiyo asemayo’ unadumisha sauti rasmi ya tamko, na ‘wenye makali kuwili’ ni wa asili kuliko tafsiri ya neno kwa neno ya ‘wenye vinywa viwili.’
