  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ τῷ ἀγγέλῳ ⸀τῆς ἐν Θυατείροις ἐκκλησίας γράψον· Τάδε λέγει ὁ υἱὸς τοῦ θεοῦ, ὁ ἔχων τοὺς ὀφθαλμοὺς αὐτοῦ ὡς φλόγα πυρός, καὶ οἱ πόδες αὐτοῦ ὅμοιοι χαλκολιβάνῳ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/018.yaml
  text: 'And to the angel of the church in Thyatira write: These things says the Son of God[a], the one who has his eyes like a flame of fire[b], and his feet like burnished bronze:'
translation:
  language: sw
  text: 'Na kwa malaika[a] wa kanisa lililoko Thiatira andika: “Haya ndiyo asemayo Mwana wa Mungu, yeye aliye na macho kama mwali wa moto, na miguu yake kama shaba iliyong’arishwa[b]:”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mjumbe.”
    reason: alternative_reading
  - marker: b
    text: Neno la Kigiriki lililotafsiriwa “shaba iliyong’arishwa” ni adimu; huenda kwa ujumla zaidi linamaanisha metali au aloi iliyosafishwa na inayong’aa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: malaika
  rationale: Katika mtindo unaorudiwa wa ujumbe kwa makanisa saba, “malaika” linafaa zaidi katika muktadha wa maono ya Ufunuo. Hata hivyo, neno la Kigiriki linaweza pia kumaanisha “mjumbe,” hivyo uwezekano huo umewekwa katika tanbihi.
- source_word: ἐκκλησίας
  choice: kanisa
  rationale: Hapa neno linamaanisha jumuiya ya waamini wa Kikristo; “kanisa” ni tafsiri ya kawaida, ya asili na inayoeleweka katika Kiswahili cha sasa.
- source_word: Τάδε λέγει
  choice: Haya ndiyo asemayo
  rationale: Kauli hii inadumisha uzito wa mtindo rasmi wa kinabii wa Kigiriki huku ikibaki ya kawaida na yenye hadhi katika Kiswahili.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: Mwana wa Mungu
  rationale: Tafsiri ya moja kwa moja inadumisha kikamilifu cheo cha msemaji na uhusiano wa kimwana unaotajwa wazi katika Kigiriki.
- source_word: ὁ ἔχων
  choice: yeye aliye na
  rationale: Kauli hii inaonyesha kwamba maelezo yanayofuata yanamtambulisha zaidi msemaji, kama ilivyo katika kishiriki chenye kibainishi cha Kigiriki.
- source_word: ὀφθαλμοὺς ... ὡς φλόγα πυρός
  choice: macho kama mwali wa moto
  rationale: Tafsiri hii inadumisha tashbihi na taswira kali ya kinabii bila kuibadili kuwa maelezo ya moja kwa moja.
- source_word: πόδες
  choice: miguu
  rationale: Hii ndiyo tafsiri ya moja kwa moja na ya kawaida ya neno hilo katika muktadha huu.
- source_word: ὅμοιοι
  choice: kama
  rationale: “Kama” huwasilisha ulinganisho kwa ufupi na kwa kawaida katika Kiswahili.
- source_word: χαλκολιβάνῳ
  choice: shaba iliyong’arishwa
  rationale: Neno hili adimu la Kigiriki huenda linamaanisha metali au aloi iliyosafishwa na inayong’aa. “Shaba iliyong’arishwa” inadumisha taswira ya metali angavu bila kudai uhakika usiokuwapo kuhusu metali hususa.
theological_decisions:
- issue: Cheo cha Kikristo katika kujitambulisha moja kwa moja
  choice: Mwana wa Mungu
  alternative: Hakuna tafsiri mbadala iliyowekwa katika matini
  rationale: Kigiriki kinatumia wazi cheo “Mwana wa Mungu.” Tafsiri inakidumisha bila kukipunguza kuwa cheo cha kazi au kukifafanua kwa mafundisho ya dhehebu fulani.
- issue: Anayerejelewa na ἀγγέλῳ katika ujumbe kwa Thiatira
  choice: malaika
  alternative: mjumbe
  rationale: “Malaika” inadumisha maana inayowezekana zaidi katika muktadha wa maono ya Ufunuo, lakini “mjumbe” pia inawezekana kileksika. Tanbihi inadumisha utata huo badala ya kuutatua kidogma.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa sasa, wenye hadhi na unaosomeka kwa urahisi. “Haya ndiyo asemayo” inadumisha sauti rasmi ya kinabii, na taswira za maono zimehifadhiwa bila kuzifafanua kupita kiasi.
