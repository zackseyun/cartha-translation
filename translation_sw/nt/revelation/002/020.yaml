revisions:
- from: 'Lakini nina neno hili dhidi yako: unamvumilia yule mwanamke Yezebeli[a], anayejiita nabii wa kike[b]. Anawafundisha na kuwapotosha[c] watumwa wangu ili wafanye uasherati na kula vyakula vilivyotolewa dhabihu kwa sanamu.'
  to: 'Lakini nina jambo hili dhidi yako: unamvumilia yule mwanamke Yezebeli[a], anayejiita nabii wa kike[b], na anayewafundisha na kuwapotosha[c] watumwa wangu kufanya uasherati na kula vyakula vilivyotolewa dhabihu kwa sanamu.'
  rationale: The revision removes the purpose implication introduced by “ili,” restores the Greek’s close coordination of Jezebel’s self-claim, teaching, and misleading, and uses a more natural Swahili expression for the charge. Footnote c is aligned with the alternative nuance of πλανᾷ (“leads astray”) rather than offering a less precise alternative.
