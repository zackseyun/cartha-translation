id: REV.2.20
reference: Revelation 2:20
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀλλὰ ἔχω κατὰ σοῦ ὅτι ἀφεῖς τὴν ⸀γυναῖκα Ἰεζάβελ, ἡ ⸀λέγουσα ἑαυτὴν προφῆτιν, καὶ διδάσκει καὶ πλανᾷ τοὺς ἐμοὺς δούλους πορνεῦσαι καὶ φαγεῖν εἰδωλόθυτα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/020.yaml
  text: 'But I have this against you: you tolerate the woman Jezebel[c][b][a], who calls herself a prophetess and teaches and deceives my servants to commit sexual immorality and to eat food sacrificed to idols.'
translation:
  language: sw
  text: 'Lakini nina jambo hili dhidi yako: unamvumilia yule mwanamke Yezebeli[a], anayejiita nabii wa kike[b], na anayewafundisha na kuwapotosha[c] watumwa wangu kufanya uasherati na kula vyakula vilivyotolewa dhabihu kwa sanamu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati zina “mke wako Yezebeli” badala ya “yule mwanamke Yezebeli.”
    reason: textual_variant
  - marker: b
    text: Au, “anayedai kuwa nabii wa kike.”
    reason: lexical_alternative
  - marker: c
    text: Au, “kuwaongoza katika upotovu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Lakini
  rationale: Kiunganishi hiki kinaonyesha tofauti kali na sifa zilizotangulia, na “Lakini” ni usemi wa kawaida na wa moja kwa moja katika Kiswahili.
- source_word: ἔχω κατὰ σοῦ
  choice: nina neno hili dhidi yako
  rationale: Huu ni msemo wa kuonyesha shtaka au jambo la kulaumu; tafsiri hii ni ya asili katika Kiswahili na inadumisha uzito wake.
- source_word: ἀφεῖς
  choice: unamvumilia
  rationale: Katika muktadha huu kitenzi kinamaanisha kuruhusu hali yenye madhara iendelee, si kusamehe tu au kumwacha mtu.
- source_word: τὴν γυναῖκα Ἰεζάβελ
  choice: yule mwanamke Yezebeli
  rationale: Inadumisha rejeo la “mwanamke Yezebeli” bila kuingiza usomaji tofauti wa “mke wako Yezebeli”; “yule” hufanya kirai kisikike kwa kawaida katika Kiswahili.
- source_word: ἡ λέγουσα ἑαυτὴν προφῆτιν
  choice: anayejiita nabii wa kike
  rationale: “Anayejiita” inadumisha kwamba cheo hicho kinatokana na madai yake mwenyewe, na “nabii wa kike” inaonyesha wazi umbo la kike lililo katika Kigiriki.
- source_word: διδάσκει
  choice: anawafundisha
  rationale: Wakati uliopo unaonyesha shughuli inayoendelea au tabia yake ya kawaida.
- source_word: πλανᾷ
  choice: kuwapotosha
  rationale: Kitenzi hiki kinamaanisha kuwaongoza watu waache kweli au mwenendo ulio sawa; “kuwapotosha” inadumisha wazo la kuwaongoza katika njia isiyofaa.
- source_word: τοὺς ἐμοὺς δούλους
  choice: watumwa wangu
  rationale: “Watumwa” inadumisha nguvu ya δοῦλος na wazo la kuwa mali ya Kristo na kuwa chini ya mamlaka yake, badala ya kulifanya neno kuwa “watumishi” tu.
- source_word: πορνεῦσαι
  choice: ili wafanye uasherati
  rationale: Kirai hiki kinaeleza kushiriki katika mwenendo wa kingono usio halali kwa lugha ya sasa na inayoeleweka.
- source_word: φαγεῖν εἰδωλόθυτα
  choice: kula vyakula vilivyotolewa dhabihu kwa sanamu
  rationale: Hii inaeleza kwa uwazi vyakula vilivyohusishwa na dhabihu zilizotolewa kwa sanamu.
theological_decisions:
- issue: Utambulisho wa “Yezebeli”
  choice: Jina Yezebeli limeachwa kama lilivyo bila kuamua kama ni jina lake halisi au jina la mfano.
  alternative: Huenda alikuwa mwanamke aliyeitwa Yezebeli, au jina hilo likawa dokezo la mfano kwa Yezebeli wa Agano la Kale.
  rationale: Aya yenyewe haisuluhishi suala hilo; tafsiri inadumisha utata huo badala ya kuingiza hitimisho la kimafundisho.
- issue: Tafsiri ya δοῦλος
  choice: watumwa wangu
  alternative: watumishi wangu
  rationale: Kiwakilishi “wangu” kinasisitiza kuwa wao ni wa Kristo na wako chini ya mamlaka yake; “watumwa” inadumisha nguvu hiyo ya umiliki na utiifu.
- issue: Hali ya madai yake ya kuwa nabii
  choice: anayejiita nabii wa kike
  alternative: anayedai kuwa nabii wa kike
  rationale: Tafsiri kuu inafuata kwa karibu λέγουσα ἑαυτὴν bila kuongeza moja kwa moja hukumu kuhusu ukweli wa madai hayo, ingawa muktadha unayatia shaka.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Sentensi imegawanywa baada ya maelezo ya Yezebeli ili kupunguza uzito wa kirai kirefu bila kubadili uhusiano wa kimantiki.
