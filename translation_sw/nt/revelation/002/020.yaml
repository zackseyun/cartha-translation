review_pass:
  verdict: revise
  source_fidelity: Draft follows the SBLGNT reading, including “the woman Jezebel” rather than the variant “your wife Jezebel,” preserves her self-designation as a female prophet, and accurately renders her teaching and misleading of Christ’s slaves in relation to sexual immorality and idol-sacrificial food. The conjunction “ili” can imply a purpose not explicit in the Greek infinitives; a direct infinitival construction better preserves the syntax and avoids that added nuance.
  naturalness: The Swahili is generally clear and appropriately formal. “Jambo hili” is more idiomatic than “neno hili” in this accusatory construction, and keeping the actions in one sentence more naturally reflects the Greek’s coordinated predicates. “Kuwapotosha ... kufanya” is clear Standard East African Swahili.
  terminology: “Yezebeli,” “nabii wa kike,” “watumwa wangu,” “uasherati,” and “vyakula vilivyotolewa dhabihu kwa sanamu” are suitable and retain the intended theological and historical terminology. “Watumwa wangu” appropriately represents δούλους in this context.
  issues:
  - severity: low
    issue: “Ili wafanye” adds a possible purpose nuance.
    rationale: The Greek infinitives πορνεῦσαι and φαγεῖν state what her teaching and deception lead the slaves to do, without explicitly marking Jezebel’s purpose. A direct infinitive is closer and more neutral.
  - severity: low
    issue: “Neno hili dhidi yako” is less idiomatic in contemporary Swahili.
    rationale: “Nina jambo hili dhidi yako” naturally conveys the complaint/charge expressed by ἔχω κατὰ σοῦ while retaining the accusatory register.
  revised_text: 'Lakini nina jambo hili dhidi yako: unamvumilia yule mwanamke Yezebeli[a], anayejiita nabii wa kike[b], na anayewafundisha na kuwapotosha[c] watumwa wangu kufanya uasherati na kula vyakula vilivyotolewa dhabihu kwa sanamu.'
