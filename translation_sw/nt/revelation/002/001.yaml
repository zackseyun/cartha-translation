source:
  edition: SBLGNT
  text: Τῷ ἀγγέλῳ ⸀τῆς ἐν Ἐφέσῳ ἐκκλησίας γράψον· Τάδε λέγει ὁ κρατῶν τοὺς ἑπτὰ ἀστέρας ἐν τῇ δεξιᾷ αὐτοῦ, ὁ περιπατῶν ἐν μέσῳ τῶν ἑπτὰ λυχνιῶν τῶν χρυσῶν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/001.yaml
  text: 'To the angel of the church in Ephesus write: These things says the one who holds the seven stars in his right hand[a], who walks among the seven golden lampstands:'
translation:
  language: sw
  text: '“Kwa malaika[a] wa kanisa lililoko Efeso andika: Haya ndiyo asemayo yeye anayezishika nyota saba katika mkono wake wa kuume, yeye anayetembea katikati ya vinara saba vya taa vya dhahabu:”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mjumbe.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: malaika
  rationale: Neno hili linaweza kumaanisha malaika wa mbinguni au mjumbe wa kibinadamu. ‘Malaika’ linafaa katika muktadha wa maono ya Ufunuo, huku maana nyingine ikihifadhiwa katika tanbihi.
- source_word: ἐκκλησίας
  choice: kanisa
  rationale: Katika muktadha huu wa jumuiya ya Kikristo, ‘kanisa’ ni neno la kawaida na linaloeleweka wazi katika Kiswahili cha sasa.
- source_word: γράψον
  choice: andika
  rationale: Ni amri ya moja kwa moja kwa Yohana, na ‘andika’ hutoa maana hiyo kwa ufupi na kwa kawaida.
- source_word: Τάδε λέγει
  choice: Haya ndiyo asemayo
  rationale: Kauli hii inadumisha uzito wa mtindo wa kinabii huku ikibaki ya asili na yenye hadhi katika Kiswahili.
- source_word: κρατῶν
  choice: anayezishika
  rationale: Inawasilisha tendo la kuzishika nyota na wazo la kuwa nazo chini ya mamlaka yake bila kuongeza ufafanuzi usiotajwa wazi.
- source_word: δεξιᾷ
  choice: mkono wake wa kuume
  rationale: Ni tafsiri ya moja kwa moja inayohifadhi picha halisi na maana zake za kiishara bila kuzifafanua ndani ya aya.
- source_word: περιπατῶν
  choice: anayetembea
  rationale: Inahifadhi picha hai ya mtu anayetembea, badala ya kuibadili kuwa uwepo usio na mwendo.
- source_word: ἐν μέσῳ
  choice: katikati ya
  rationale: Ni usemi wa kawaida wa Kiswahili unaowasilisha kuwa yuko miongoni mwa vinara hivyo.
- source_word: λυχνιῶν
  choice: vinara vya taa
  rationale: Neno la Kigiriki linamaanisha vifaa vinavyobeba taa, si taa zenyewe; ‘vinara vya taa’ linaweka tofauti hiyo wazi.
- source_word: χρυσῶν
  choice: vya dhahabu
  rationale: Ni Kiswahili cha kawaida kinachoonyesha kuwa vinara hivyo ni vya dhahabu.
theological_decisions:
- issue: Anayerejelewa na ‘malaika wa kanisa’
  choice: Kuweka ‘malaika’ katika matini kuu
  alternative: mjumbe
  rationale: Neno la Kigiriki ἄγγελος linaweza kurejelea malaika au mjumbe. Muktadha wa kiapokaliptiki unaunga mkono ‘malaika,’ lakini kwa kuwa utambulisho wake unabishaniwa, uwezekano wa ‘mjumbe’ umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wa heshima na wa kinabii. Muundo wa sentensi umewekwa karibu na Kigiriki bila kuifanya iwe ngumu kueleweka; alama ya tanbihi imewekwa baada ya neno ‘malaika’ ambalo tanbihi inalifafanua.
