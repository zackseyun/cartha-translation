  yaml_path: translation/nt/revelation/002/006.yaml
  text: 'But this you have: you hate the works of the Nicolaitans[a], which I also hate.'
translation:
  language: sw
  text: 'Lakini hili unalo: unachukia matendo ya Wanikolai[a], ambayo mimi pia ninayachukia.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kazi.” Neno la Kigiriki hapa linamaanisha vitendo au mienendo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Lakini
  rationale: Kiunganishi hiki kinaonyesha utofautishaji na yaliyotangulia; “Lakini” ni tafsiri ya kawaida na ya moja kwa moja katika Kiswahili.
- source_word: τοῦτο ἔχεις
  choice: una jambo hili
  rationale: Huhifadhi maana ya msingi ya “una hili” huku “jambo” likifanya usemi uwe wa kawaida na wazi katika Kiswahili bila kuingiza wazo la ziada la sifa.
- source_word: ὅτι
  choice: ':'
  rationale: Hapa ὅτι inaanzisha maelezo ya jambo walilo nalo; nukta mbili huwasilisha uhusiano huo kwa Kiswahili cha kawaida.
- source_word: μισεῖς
  choice: unachukia
  rationale: Kitenzi μισέω kina maana ya “kuchukia”; hakijalainishwa, na mzizi huohuo unarudiwa katika kifungu kinachofuata.
- source_word: τὰ ἔργα
  choice: matendo
  rationale: Katika muktadha huu ἔργα ni vitendo au mienendo ya kundi hilo. “Matendo” ni neno la kawaida la kibiblia na la sasa, na linaweka wazi kuwa kinachochukiwa ni wanachofanya.
- source_word: τῶν Νικολαϊτῶν
  choice: ya Wanikolai
  rationale: Jina la kundi limetoholewa kwa muundo wa kawaida wa majina ya watu katika Kiswahili; “Wanikolai” linaeleweka kama wafuasi au kundi linaloitwa hivyo.
- source_word: ἃ
  choice: ambayo
  rationale: Kiwakilishi hiki kinarejelea “matendo,” nomino ya ngeli ya 6 katika Kiswahili.
- source_word: κἀγὼ
  choice: mimi pia
  rationale: Huhifadhi msisitizo wa ἐγώ na maana ya καί, yaani kwamba msemaji pia anashiriki msimamo huo.
- source_word: μισῶ
  choice: ninayachukia
  rationale: Huhifadhi kitenzi kilekile cha “kuchukia” na kurejelea wazi “matendo” kwa kiambishi -ya-.
theological_decisions:
- issue: Kinachochukiwa
  choice: Matendo ya Wanikolai ndiyo yanayotajwa wazi kuwa yanachukiwa.
  alternative: Tafsiri pana ingeweza kudokeza kwamba watu wenyewe ndio wanaochukiwa.
  rationale: τὰ ἔργα ndiyo yambwa ya moja kwa moja ya μισεῖς; kwa hiyo tafsiri inapaswa kutenganisha matendo yao na watu wenyewe bila kuongeza dai lisilosemwa katika mstari.
- issue: Msemaji kushiriki msimamo wa kanisa
  choice: “ambayo mimi pia ninayachukia”
  alternative: “ambayo hata mimi ninayachukia”
  rationale: κἀγὼ huonyesha kwamba Yesu pia anayakataa matendo hayo. “Mimi pia” huhifadhi maana hiyo moja kwa moja bila kudokeza mshangao unaoweza kuletwa na “hata mimi.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo “una jambo hili” unahifadhi mkazo wa τοῦτο bila kuwa mgumu kupita kiasi; “matendo” linafaa zaidi kimuktadha kuliko “kazi.”
