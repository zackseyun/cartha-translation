id: REV.2.17
reference: Revelation 2:17
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὁ ἔχων οὖς ἀκουσάτω τί τὸ πνεῦμα λέγει ταῖς ἐκκλησίαις. τῷ νικῶντι δώσω ⸀αὐτῷ τοῦ μάννα τοῦ κεκρυμμένου, καὶ δώσω αὐτῷ ψῆφον λευκήν, καὶ ἐπὶ τὴν ψῆφον ὄνομα καινὸν γεγραμμένον ὃ οὐδεὶς οἶδεν εἰ μὴ ὁ λαμβάνων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/017.yaml
  text: The one who has an ear[a], let him hear what the Spirit says to the churches. To the one who conquers I will give some of the hidden manna, and I will give him a white stone, and a new name written on it[c][b], which no one knows except the one who receives it.
translation:
  language: sw
  text: Yeye aliye na sikio, na asikie yale ambayo Roho anayoyasema kwa makanisa. Yeye anayeshinda nitampa sehemu ya mana iliyofichwa, nami nitampa jiwe jeupe[a], ambalo juu yake limeandikwa jina jipya, ambalo hakuna mtu anayelijua isipokuwa mpokeaji.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jiwe jeupe huenda likadokeza jiwe la kupigia kura, ishara ya kuachiliwa huru, au kibali cha kuingia; lakini maandishi yenyewe hayasemi ni mazingira gani yaliyokusudiwa.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ ἔχων οὖς
  choice: Mwenye sikio
  rationale: Inahifadhi usemi wa Kigiriki katika umoja huku ikiwa kauli ya kawaida na ya kueleweka katika Kiswahili.
- source_word: ἀκουσάτω
  choice: na asikie
  rationale: Muundo huu wa Kiswahili unawakilisha amri ya nafsi ya tatu kwa kawaida na kwa uzito unaofaa.
- source_word: τὸ πνεῦμα
  choice: Roho
  rationale: Kigiriki kinasema ‘Roho’ bila kuongeza wazi ‘Mtakatifu’; herufi kubwa inaonyesha rejeo la kimungu katika muktadha.
- source_word: ταῖς ἐκκλησίαις
  choice: makanisa
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa makusanyiko ya waamini yanayozungumziwa katika Ufunuo.
- source_word: τῷ νικῶντι
  choice: Yeye anayeshinda
  rationale: Linahifadhi maana ya ushindi ya νικάω na hali endelevu ya kitenzi-jina cha wakati uliopo bila kufafanua ushindi huo kupita kiasi.
- source_word: τοῦ μάννα τοῦ κεκρυμμένου
  choice: sehemu ya mana iliyofichwa
  rationale: ‘Sehemu ya’ inaonyesha matumizi ya genitivi yenye maana ya kupewa kiasi au fungu la mana; ‘iliyofichwa’ huhifadhi hali ya kitu kilichowekwa kwa siri.
- source_word: ψῆφον λευκήν
  choice: kijiwe cheupe
  rationale: ψῆφος ni jiwe dogo; ‘kijiwe’ ni sahihi na hakilazimishi maana maalumu ya kiishara.
- source_word: ἐπὶ τὴν ψῆφον
  choice: juu yake
  rationale: Inaonyesha mahali jina lilipoandikwa huku ikitoa mtiririko wa kawaida wa Kiswahili.
- source_word: ὄνομα καινὸν γεγραμμένον
  choice: limeandikwa jina jipya
  rationale: ‘Jina jipya’ huhifadhi maana ya καινός, na muundo huu unaeleza kwa kawaida kwamba maandishi yapo juu ya kijiwe.
- source_word: ὃ οὐδεὶς οἶδεν εἰ μὴ ὁ λαμβάνων
  choice: ambalo hakuna mtu anayelijua isipokuwa yule anayelipokea
  rationale: Kiwakilishi ‘ambalo’ kinarejelea jina, kama ilivyo katika Kigiriki. ‘Anayelipokea’ huacha wazi kwa kiasi fulani ikiwa kinachopokewa kinatazamwa kuwa jina au kijiwe chenye jina, kwa kuwa nomino zote mbili ni za ngeli moja katika Kiswahili.
theological_decisions:
- issue: Maana ya ishara ya ψῆφος λευκή
  choice: Kutafsiri kwa kiasi kidogo kama ‘kijiwe cheupe’ bila kuamua ishara yake
  alternative: Kukitaja kuwa jiwe la kura, ishara ya kuachiliwa huru, au kibali cha kuingia
  rationale: Mstari wenyewe hauelezi matumizi maalumu ya kijiwe; tanbihi inahifadhi uwezekano wa mazingira mbalimbali bila kutatua fumbo kimadhehebu.
- issue: Mhusika wa ahadi katika umoja
  choice: Kutumia ‘yeye anayeshinda’ na miundo ya umoja isiyoainisha jinsia
  alternative: Kutaja wazi mwanaume kwa kiwakilishi cha kijinsia
  rationale: Kigiriki kina umoja wa kisarufi wenye matumizi ya jumla. Kiswahili huwasilisha umoja huo kwa usahihi bila kulazimika kuongeza jinsia ambayo lugha lengwa haihitaji.
- issue: Kitu kinachopokewa katika kishazi cha mwisho
  choice: Kuhifadhi hali ya kutotajwa wazi kwa kitu katika Kigiriki kwa ‘anayelipokea’
  alternative: Kufafanua kuwa anapokea kijiwe au jina
  rationale: Kigiriki hakina nomino ya kitu baada ya ὁ λαμβάνων. Kwa kuwa ‘jina’ na ‘jiwe’ ni nomino za ngeli moja, Kiswahili kinaweza kudumisha mvutano huo badala ya kuutatua kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi umefanywa wa kawaida katika Kiswahili bila kuondoa urudiaji, fumbo, au mvutano wa kitheolojia wa maandishi ya Kigiriki.
