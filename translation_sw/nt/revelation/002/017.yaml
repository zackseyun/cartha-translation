  terminology: «Roho», «makanisa», «mana iliyofichwa», na «jiwe jeupe» ni istilahi sahihi na za kawaida. «Jiwe jeupe» ni la asili zaidi kuliko «kijiwe cheupe» katika muktadha huu, huku likidumisha upana wa ψῆφος. Tanbihi inaacha maana ya ishara wazi bila kuilazimisha.
