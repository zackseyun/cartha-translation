  source_fidelity: 'Rasimu inafuata maana ya msingi kwa uaminifu: wito wa kusikia, usemi wa Roho kwa makanisa, mana iliyofichwa, jiwe jeupe, jina jipya, na upekee wa mpokeaji. Hata hivyo, kitenzi «anayaambia» huelekeza maana ya ‘kuwaambia’ badala ya λέγει, ‘kusema’; kinapaswa kuwa «anayoyasema». Pia kiwakilishi katika «anayelipokea» hurejelea jina (ngeli LI), hivyo kinatatua utata wa Kigiriki kuhusu kinachopokewa. «Mpokeaji» huhifadhi kutotajwa kwa kitu kinachopokewa.'
