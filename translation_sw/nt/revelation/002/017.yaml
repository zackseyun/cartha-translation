  - severity: medium
    issue: «isipokuwa yule anayelipokea»
    rationale: Kiambishi -li- kinarejelea «jina» na hivyo huamua kwamba jina ndilo linapokewa. Mshiriki wa Kigiriki ὁ λαμβάνων hana kitu kilichotajwa; «mpokeaji» hudumisha utata huo.
  - severity: low
