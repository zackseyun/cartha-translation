base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/021.yaml
  text: And I gave her time to repent[a], but she is not willing to repent of her sexual immorality.
translation:
  language: sw
  text: Nikampa muda ili atubu, lakini hataki kutubu na kuacha uasherati wake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri iliyo karibu zaidi na maneno ya Kigiriki, “kutubu kutoka katika uasherati wake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδωκα αὐτῇ χρόνον
  choice: Nikampa muda
  rationale: Kauli ya wakati uliopita inawasilisha tendo la kumpa muda; kiambishi -m- kinaonyesha mtendewa wa kike kwa njia ya kawaida ya Kiswahili.
- source_word: ἵνα μετανοήσῃ
  choice: ili atubu
  rationale: ἵνα pamoja na hali tegemezi huonyesha kusudi; “ili atubu” ni ya asili na huhifadhi maana hiyo.
- source_word: οὐ θέλει
  choice: hataki
  rationale: θέλω hapa huonyesha kutotaka au kutokuwa tayari. “Hataki” ni lugha ya kawaida yenye nguvu inayofaa bila kuongeza dhana ambayo haijasemwa wazi.
- source_word: μετανοῆσαι ἐκ
  choice: kutubu na kuacha
  rationale: Muundo wenye ἐκ una wazo la kugeuka kutoka au kuacha jambo; “kutubu na kuacha” huwasilisha uhusiano huo kwa Kiswahili cha asili.
- source_word: τῆς πορνείας αὐτῆς
  choice: uasherati wake
  rationale: πορνεία hurejelea mwenendo mpotovu wa kingono. “Uasherati” ni neno la Kiswahili sanifu, lenye heshima na linalofaa katika muktadha wa kibiblia, huku muktadha ukibeba uwezekano wa maana ya kitamathali.
theological_decisions:
- issue: Maana ya πορνεία katika karipio la kiapokaliptiki
  choice: uasherati wake
  alternative: upotovu wake wa kingono; ukahaba wake
  rationale: Tafsiri kuu inadumisha maana halisi ya msingi bila kuamua kwamba neno hilo ni fumbo la ibada ya sanamu pekee. Hivyo mvutano kati ya maana halisi na ya kitamathali unabaki kwa muktadha.
- issue: Uhusiano wa toba na ἐκ τῆς πορνείας
  choice: kutubu na kuacha uasherati wake
  alternative: kutubu uasherati wake; kutubu kutoka katika uasherati wake
  rationale: “Na kuacha” hufanya nguvu ya ἐκ ieleweke katika Kiswahili cha kawaida bila kudai kuwa kuacha ni tendo lisilohusiana na toba; tanbihi inahifadhi muundo wa karibu zaidi na Kigiriki.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Kurudiwa kwa wazo la kutubu kumehifadhiwa kama katika Kigiriki; “hataki” huepuka kuongeza kwa nguvu zaidi wazo la kukataa kabisa.
