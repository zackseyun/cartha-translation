translation:
  language: sw
  text: Lakini[a] shikeni imara mlichonacho mpaka nitakapokuja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ila tu, shikeni imara mlichonacho mpaka nitakapokuja.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: Lakini
  rationale: Hutambulisha kauli ya utofautishaji au ya kuweka mpaka baada ya maneno yaliyotangulia. “Lakini” ni ya kawaida na yenye hadhi katika Kiswahili; uwezekano wa maana “Ila tu” umehifadhiwa katika tanbihi.
- source_word: ὃ ἔχετε
  choice: kile mlicho nacho
  rationale: Kiwakilishi cha uhusiano cha jinsia ya kati pamoja na ἔχετε hurejelea kwa ujumla kile ambacho waamini tayari wanacho. Usemi huu ni wa asili na haubainishi zaidi ya Kigiriki.
- source_word: κρατήσατε
  choice: shikeni sana
  rationale: Amri hii inataka waendelee kushikilia kwa uthabiti. “Shikeni sana” huwasilisha nguvu ya kuhifadhi bila kuingiza kitu mahsusi kisichotajwa.
- source_word: ἄχρι οὗ ἂν
  choice: mpaka
  rationale: Muundo huu huweka mpaka wa wakati ujao; “mpaka” unaeleza mpaka huo kwa Kiswahili cha kawaida.
- source_word: ἥξω
  choice: nitakapokuja
  rationale: Kitenzi hiki kinaonyesha kuja au kuwasili kwa msemaji. “Nitakapokuja” kinaendana kiasili na “mpaka” na hakiamui aina wala wakati wa kuja huko.
theological_decisions:
- issue: Ikiwa kauli ya Yesu inarejelea hasa kuja kwake kwa mwisho au kuja kwake katika hukumu/ziara kwa kanisa hili
  choice: mpaka nitakapokuja
  alternative: mpaka nitakapokuja kuhukumu; mpaka kuja kwangu kwa mwisho
  rationale: Kigiriki hakifafanui hapa namna wala wakati wa kuja huko. Tafsiri inaacha mvutano huo wa kitheolojia bila kuutatua kwa kuongeza maelezo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Wingi wa amri umehifadhiwa kwa “shikeni,” na hakuna ufafanuzi wa kimadhehebu ulioongezwa.
