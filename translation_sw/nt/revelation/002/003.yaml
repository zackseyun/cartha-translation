  text: And you have endurance[a], and have borne up for my name[b], and have not grown weary.
translation:
  language: sw
  text: Nawe una uvumilivu, na umestahimili kwa ajili ya jina langu[a], wala hujachoka[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa sababu ya jina langu” au “kwa ajili ya jina langu.”
    reason: lexical_alternative
  - marker: b
    text: 'Au “hujalegea.” Kitenzi hiki kinaweza pia kueleweka kwa uhusiano na kazi: “hujachoka kwa kufanya kazi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπομονὴν
  choice: uvumilivu
  rationale: Neno hili linaonyesha uthabiti wa kuendelea chini ya majaribu. “Uvumilivu” ni la kawaida na lenye hadhi katika Kiswahili, bila kulifanya kuwa kusubiri tu au kuliongezea wazo lisilotajwa.
- source_word: ἔχεις
  choice: una
  rationale: 'Huwasilisha moja kwa moja hali ya sasa inayosifiwa: mhusika ana uvumilivu.'
- source_word: ἐβάστασας
  choice: umevumilia
  rationale: Katika muktadha huu βαστάζω ina maana ya kustahimili au kubeba taabu. “Umevumilia” ni ya asili katika Kiswahili na inaonyesha tendo lililotokea, huku muktadha ukilitofautisha na nomino “uvumilivu.”
- source_word: διὰ τὸ ὄνομά μου
  choice: kwa ajili ya jina langu
  rationale: Huhifadhi nahau ya kibiblia ya kustahimili kwa sababu ya, au kwa manufaa ya, jina la Yesu bila kuamua kabisa ikiwa διά inaonyesha sababu au kusudi.
- source_word: οὐ κεκοπίακες
  choice: wala hukuchoka
  rationale: κοπιάω hapa yaweza kueleza kuchoka au kulegea baada ya kazi nzito. “Hukuchoka” ni usemi wa kawaida unaowasilisha hali ya kutokulegea, huku uwezekano wa kuhusishwa na kufanya kazi ukibaki katika tanbihi.
theological_decisions:
- issue: Maana ya lugha ya uvumilivu na kustahimili katika sifa hii
  choice: Aya inasifu uvumilivu endelevu na kustahimili kwa ajili ya jina la Yesu, bila kutaja aina maalumu ya mateso au kazi.
  alternative: 'Kishazi cha mwisho kinaweza kueleweka hasa kwa uhusiano na kazi: “hukuchoshwa na kazi” au “hukulegea kwa kufanya kazi.”'
  rationale: Tafsiri inahifadhi sifa iliyomo katika maandishi bila kuingiza fundisho maalumu kuhusu mateso, huduma, au thawabu. Muundo sambamba unaelekea kwenye uvumilivu chini ya taabu, lakini hautoi maelezo zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umewekwa wazi na wa kawaida kwa wasomaji wengi; “Tena” huendeleza kaί ya mwanzo, na “wala” huunganisha kishazi hasi kwa mtiririko wa asili.
