  text: καὶ περιβεβλημένος ἱμάτιον ⸀βεβαμμένον αἵματι, καὶ ⸀κέκληται τὸ ὄνομα αὐτοῦ ὁ Λόγος τοῦ Θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/013.yaml
  text: And he is clothed in a robe dipped in blood[a], and his name is called the Word of God.
translation:
  language: sw
  text: Naye amevaa joho lililochovywa katika damu[a], na jina lake linaitwa Neno la Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “lililotiwa madoa ya damu.” Kitenzi cha Kigiriki kwa maana ya moja kwa moja zaidi ni “kuchovya” au “kutia rangi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: περιβεβλημένος
  choice: amevaa
  rationale: Kitenzi hiki katika hali timilifu kinaeleza hali yake ya sasa akiwa amevikwa vazi; “amevaa” ni Kiswahili cha kawaida kinachodumisha hali hiyo.
- source_word: ἱμάτιον
  choice: joho
  rationale: Neno hili humaanisha vazi la nje kwa ujumla. “Joho” linafaa katika muktadha wenye hadhi wa maono bila kulifafanua vazi hilo kupita kiasi.
- source_word: βεβαμμένον αἵματι
  choice: lililochovywa katika damu
  rationale: Kitenzi βάπτω kimsingi humaanisha kuchovya au kutia ndani ya kimiminika. Tafsiri hii inadumisha taswira kali ya Kigiriki; uwezekano wa maana ya kutiwa madoa umewekwa katika tanbihi.
- source_word: κέκληται
  choice: linaitwa
  rationale: Hali timilifu tendwa ya καλέω hapa inaonyesha jina au cheo kinachodumu; “linaitwa” ni usemi wa kawaida na wa moja kwa moja.
- source_word: τὸ ὄνομα αὐτοῦ
  choice: jina lake
  rationale: Hii ndiyo tafsiri ya kawaida ya Kiswahili ya muundo wa Kigiriki unaoonyesha umilikaji.
- source_word: ὁ Λόγος τοῦ Θεοῦ
  choice: Neno la Mungu
  rationale: Λόγος hapa ni jina la cheo la huyo mpanda farasi, si ujumbe tu. Herufi kubwa inaonyesha matumizi hayo ya cheo bila kuongeza maelezo yasiyomo katika maandishi.
theological_decisions:
- issue: Cheo cha Kikristo λόγος
  choice: Neno la Mungu
  alternative: ujumbe wa Mungu
  rationale: Katika muktadha huu wa maono, ὁ Λόγος τοῦ Θεοῦ ni cheo cha kibinafsi cha mpanda farasi. “Neno la Mungu” linahifadhi uzito wa cheo hicho na mwangwi wake katika maandishi ya Kiyohana bila kulifanya kuwa fasiri ya kifafanuzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “Naye amevaa” unaendeleza simulizi la maono; “joho” na “Neno la Mungu” vinadumisha sajili iliyoinuliwa bila kuwa vya kizamani.
