id: REV.19.9
reference: Revelation 19:9
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ λέγει μοι· Γράψον· Μακάριοι οἱ εἰς τὸ δεῖπνον τοῦ γάμου τοῦ ἀρνίου κεκλημένοι. καὶ λέγει μοι· Οὗτοι οἱ λόγοι ἀληθινοὶ τοῦ θεοῦ εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/009.yaml
  text: 'And he says to me[a], “Write: Blessed are those who have been invited to the wedding supper of the Lamb.” And he says to me[c][b], “These are the true words of God.”'
translation:
  language: sw
  text: 'Naye ananiambia, “Andika: Heri wale walioalikwa[a] kwenye karamu ya arusi[b] ya Mwanakondoo.” Naye ananiambia, “Haya ni maneno ya kweli[c] ya Mungu.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “walioitwa.”
    reason: lexical_alternative
  - marker: b
    text: 'Kwa tafsiri ya karibu zaidi: “mlo wa arusi.”'
    reason: lexical_alternative
  - marker: c
    text: Au “ya kuaminika”; usemi huu unathibitisha kwamba maneno haya ni ya kweli na yanaweza kutegemewa.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ λέγει μοι
  choice: Naye ananiambia
  rationale: Muundo huu unadumisha wakati wa sasa wa kihistoria wa λέγει na kurudia kwake katika aya, huku ukisomeka kwa kawaida katika simulizi la Kiswahili.
- source_word: Γράψον
  choice: Andika
  rationale: Ni amri ya moja kwa moja katika umoja, sawasawa na aoristi ya kuamuru ya γράφω, bila kuongeza kitu kisichokuwapo katika chanzo.
- source_word: Μακάριοι
  choice: Heri
  rationale: “Heri” ni lugha ya kawaida na yenye hadhi kwa matamko ya baraka katika Biblia ya Kiswahili; inaonyesha hali ya kupendelewa kuliko hisia tu ya furaha.
- source_word: οἱ ... κεκλημένοι
  choice: wale walioalikwa
  rationale: Katika muktadha wa karamu, kitenzi καλέω kina maana ya kualika. Hali timilifu ya participio inadokeza watu ambao wamekwisha alikwa na bado wako katika hali hiyo.
- source_word: δεῖπνον
  choice: karamu
  rationale: Neno hilo hutaja mlo mkuu na hapa ni mlo wa sherehe ya arusi; “karamu” huwasilisha kwa kawaida ukubwa na furaha ya tukio bila kufungamanisha mlo huo na saa fulani ya siku.
- source_word: γάμου
  choice: ya arusi
  rationale: Kwa kuwa γάμου inahusishwa na δεῖπνον, “ya arusi” ni usemi wa kawaida wa Kiswahili kwa karamu inayoadhimisha kufunga ndoa.
- source_word: τοῦ ἀρνίου
  choice: ya Mwanakondoo
  rationale: “Mwanakondoo” huhifadhi cheo muhimu cha Kikristo cha ἀρνίον katika Ufunuo na mwangwi wake wa dhabihu na Masihi.
- source_word: Οὗτοι οἱ λόγοι
  choice: Haya ni maneno
  rationale: Kiwakilishi “Haya” kinakubaliana kiasili na nomino ya ngeli ya maneno na kudumisha msisitizo wa Οὗτοι.
- source_word: ἀληθινοὶ
  choice: ya kweli
  rationale: Hili ndilo badiliko la moja kwa moja zaidi, likithibitisha ukweli wa maneno hayo huku maana inayokaribiana ya kutegemeka ikihifadhiwa katika tanbihi.
- source_word: τοῦ θεοῦ
  choice: ya Mungu
  rationale: Huhifadhi muundo wa genitivi bila kuamua kimya kimya kama unasisitiza umiliki, asili, au mamlaka ya Mungu.
theological_decisions:
- issue: Maana ya κεκλημένοι katika karamu ya wokovu ya nyakati za mwisho
  choice: walioalikwa
  alternative: walioitwa
  rationale: Katika muktadha wa karamu, “walioalikwa” ndiyo maana ya kawaida ya neno hilo na haingizi dai maalumu la kimadhehebu kuhusu mwito wenye matokeo yasiyozuilika. “Walioitwa” bado inawezekana na imehifadhiwa katika tanbihi.
- issue: Tafsiri ya δεῖπνον τοῦ γάμου
  choice: karamu ya arusi
  alternative: mlo wa arusi
  rationale: “Karamu ya arusi” ni Kiswahili cha kawaida na chenye hadhi kwa mlo wa sherehe unaoelezwa hapa. “Mlo wa arusi” ni wa karibu zaidi kimofimu lakini hausikiki kwa uzito uleule.
- issue: Nguvu ya ἀληθινοὶ katika maneno ya Mungu
  choice: ya kweli
  alternative: ya kuaminika
  rationale: “Ya kweli” hudumisha dai la moja kwa moja kuhusu ukweli; “ya kuaminika” hufafanua athari yake ya kutegemeka lakini inaweza kuwa ya kiufafanuzi zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Wakati wa sasa wa kihistoria katika “ananiambia” umehifadhiwa kwa sababu λέγει imerudiwa mara mbili katika chanzo. “Heri” na “Mwanakondoo” hudumisha sajili ya kibiblia bila kuwa ya kizamani.
