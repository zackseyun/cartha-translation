  text: χαίρωμεν καὶ ⸀ἀγαλλιῶμεν, καὶ ⸀δώσομεν τὴν δόξαν αὐτῷ, ὅτι ἦλθεν ὁ γάμος τοῦ ἀρνίου, καὶ ἡ γυνὴ αὐτοῦ ἡτοίμασεν ἑαυτήν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/007.yaml
  text: Let us rejoice and exult[a], and let us give glory to him, because the marriage of the Lamb has come[b], and his bride has made herself ready.
translation:
  language: sw
  text: Tufurahi na tushangilie, na tumpe utukufu[b], kwa maana arusi ya Mwanakondoo imefika, na bibi-arusi wake[a] amejiweka tayari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mke wake.” Neno la Kigiriki γυνή linaweza kumaanisha “mwanamke,” “mke,” au, katika muktadha wa arusi, “bibi-arusi.”
    reason: lexical_alternative
  - marker: b
    text: Au, “tutampa utukufu.” Kitenzi cha Kigiriki kiko katika wakati ujao, ingawa hapa huenda kinatumika kwa nguvu ya himizo sambamba na “tufurahi” na “tushangilie.”
    reason: alternative_reading
lexical_decisions:
- source_word: χαίρωμεν
  choice: Tufurahi
  rationale: Kauli tegemezi ya nafsi ya kwanza wingi ina nguvu ya kuhimiza; “Tufurahi” ni mwito wa kawaida na wa heshima katika Kiswahili.
- source_word: ἀγαλλιῶμεν
  choice: kushangilia
  rationale: Neno hili linaonyesha furaha kubwa inayodhihirishwa wazi na hivyo linatofautishwa na χαίρωμεν bila kufanya jozi hiyo kuwa marudio tupu.
- source_word: δώσομεν τὴν δόξαν αὐτῷ
  choice: tumpe utukufu
  rationale: Ingawa δώσομεν ni umbo la wakati ujao, katika mfuatano huu wa mwito wa ibada linaeleweka kwa kawaida kama himizo sambamba na vitenzi vilivyotangulia. Kiswahili “tumpe” huhifadhi nguvu hiyo.
- source_word: δόξαν
  choice: utukufu
  rationale: “Utukufu” ndilo neno la kawaida la Kiswahili kwa δόξα katika muktadha wa sifa na ibada.
- source_word: ἦλθεν
  choice: imefika
  rationale: Kauli ya aoristi inaonyesha kuwasili kwa tukio; “imefika” huwasilisha tukio lililotimia lenye umuhimu wa sasa.
- source_word: γάμος
  choice: arusi
  rationale: Katika Kiswahili cha sasa, “arusi” hutaja tukio la kuoana linalotarajiwa katika picha hii. Haiongezi wazo la karamu, ambalo linatajwa wazi katika muktadha unaofuata.
- source_word: ἀρνίου
  choice: Mwanakondoo
  rationale: Hili ndilo jina la cheo la Kikristo lililozoeleka kwa ἀρνίον katika Ufunuo; herufi kubwa inaonyesha matumizi yake kama cheo.
- source_word: γυνὴ αὐτοῦ
  choice: bibi-arusi wake
  rationale: γυνή linaweza kumaanisha mwanamke, mke, au bibi-arusi. Kwa kuwa muktadha ni kufika kwa arusi na kujitayarisha, “bibi-arusi” ni chaguo la asili zaidi, huku uwezekano wa “mke” ukihifadhiwa katika tanbihi.
- source_word: ἡτοίμασεν ἑαυτήν
  choice: amejiweka tayari
  rationale: Kauli hii ni ya kawaida katika Kiswahili na huhifadhi maana rejea kwamba yeye mwenyewe amefanya maandalizi.
theological_decisions:
- issue: Maana ya γυνὴ αὐτοῦ katika taswira ya arusi
  choice: bibi-arusi wake
  alternative: mke wake
  rationale: Taswira inasisitiza maandalizi ya arusi, hivyo “bibi-arusi” inafaa zaidi kimuktadha. Hata hivyo, γυνή pia linaweza kumaanisha “mke,” kwa hiyo uwezekano huo haujaondolewa bali umewekwa katika tanbihi.
- issue: Nguvu ya δώσομεν katika mfuatano wa mahimizo
  choice: tumpe utukufu
  alternative: tutampa utukufu
  rationale: Umbo la Kigiriki ni la wakati ujao, lakini nafasi yake baada ya mahimizo mawili inaunga mkono kulisoma kama mwito mmoja wa pamoja wa sifa. Chaguo la wakati ujao linabaki kuwa uwezekano halisi na limehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaofaa tangazo la ibada. Jozi “tufurahi na kushangilia” ni ya asili na huhifadhi kuongezeka kwa nguvu ya maneno ya Kigiriki. Alama zote za tanbihi zimewekwa katika matini kuu.
