id: REV.19.2
reference: Revelation 19:2
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὅτι ἀληθιναὶ καὶ δίκαιαι αἱ κρίσεις αὐτοῦ· ὅτι ἔκρινεν τὴν πόρνην τὴν μεγάλην ἥτις ⸀ἔφθειρεν τὴν γῆν ἐν τῇ πορνείᾳ αὐτῆς, καὶ ἐξεδίκησεν τὸ αἷμα τῶν δούλων αὐτοῦ ἐκ χειρὸς αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/002.yaml
  text: because his judgments are true and just; because he judged the great prostitute who corrupted the earth with her sexual immorality[a], and he avenged the blood of his servants from her hand.
translation:
  language: sw
  text: kwa maana hukumu zake ni za kweli na za haki; kwa maana amemhukumu yule kahaba mkuu aliyeiharibu dunia kwa uasherati wake, naye ameilipizia kisasi damu ya watumwa wake kutoka mkononi mwake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watumishi wake.” Neno la Kigiriki doulos linaweza kumaanisha “mtumwa” au “mtumishi”; “watumwa” limetumiwa hapa kuhifadhi maana yenye nguvu ya kuwa chini ya mamlaka ya bwana.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀληθιναὶ καὶ δίκαιαι
  choice: za kweli na za haki
  rationale: Vivumishi hivi vinaeleza hukumu za Mungu kuwa zinapatana na ukweli na haki; msemo huu ni wa kawaida na wenye hadhi katika Kiswahili.
- source_word: κρίσεις
  choice: hukumu
  rationale: Neno hili linahifadhi maana ya maamuzi na matendo ya kimahakama ya Mungu; umbo la Kiswahili linaweza kuwa sawa katika umoja na wingi kulingana na upatanisho wa kisarufi.
- source_word: ἔκρινεν
  choice: amemhukumu
  rationale: Wakati timilifu unaonyesha tendo lililokamilika ambalo ndilo msingi wa sifa inayotolewa sasa, bila kulazimisha maana finyu ya 'amemlaani.'
- source_word: πόρνην τὴν μεγάλην
  choice: yule kahaba mkuu
  rationale: Kahaba ni neno la sasa na la moja kwa moja kwa πόρνη; 'yule' husaidia kuonyesha mhusika maalumu anayejulikana katika muktadha.
- source_word: ἔφθειρεν
  choice: aliyeipotosha
  rationale: Katika muunganiko na uasherati wake, kitenzi kinaonyesha uharibifu wa kimaadili na kiroho. 'Aliyeipotosha' ni cha asili zaidi kuliko 'aliyeifisidi' kwa wasomaji wengi, huku maana ya kuharibu ikibaki.
- source_word: τὴν γῆν
  choice: dunia
  rationale: Muktadha wa Ufunuo una upeo wa ulimwengu mzima; 'dunia' huepuka maana ya eneo dogo inayoweza kusikika katika 'nchi.'
- source_word: ἐν τῇ πορνείᾳ αὐτῆς
  choice: kwa uasherati wake
  rationale: Uasherati ni tafsiri pana na inayoeleweka ya πορνεία, huku taswira yake ya kutokuwa mwaminifu kiibada ikiachwa wazi katika muktadha.
- source_word: ἐξεδίκησεν τὸ αἷμα
  choice: amelipiza kisasi kwa ajili ya damu ... iliyomwagwa
  rationale: Kitenzi kinaonyesha utekelezaji wa haki dhidi ya mkosaji. Kuongeza 'iliyomwagwa' kunafanya nahau ya damu iwe wazi kwa Kiswahili bila kubadili mhusika au msingi wa kisasi.
- source_word: τῶν δούλων αὐτοῦ
  choice: ya watumwa wake
  rationale: Watumwa huhifadhi nguvu ya δοῦλοι kama watu walio chini ya mamlaka na walio mali ya bwana, badala ya kuipunguza kuwa huduma ya hiari tu.
- source_word: ἐκ χειρὸς αὐτῆς
  choice: kwa mkono wake
  rationale: Nahau hii inahifadhi taswira ya mkono na inaonyesha kwamba huyo kahaba ndiye aliyesababisha kumwagika kwa damu.
theological_decisions:
- issue: Maana ya πορνεία katika taswira ya kahaba mkuu
  choice: uasherati
  alternative: ukahaba; kutokuwa mwaminifu kwa Mungu
  rationale: Neno kuu linahifadhi maana ya kijinsia ya neno la Kigiriki na pia linaweza kubeba taswira ya kutokuwa mwaminifu kiibada bila kuamua kimya-kimya kwamba maana moja pekee ndiyo iliyokusudiwa.
- issue: Tafsiri ya δοῦλοι kwa watu wa Mungu
  choice: watumwa wake
  alternative: watumishi wake
  rationale: Uchaguzi huu unahifadhi wazo lenye nguvu la kuwa chini ya Bwana na kuwa mali yake. Kwa kuwa 'watumwa' linaweza kueleweka hasa kwa muktadha wa utumwa wa kibinadamu, mbadala wa 'watumishi' umeelezwa katika tanbihi.
- issue: Uhusiano wa ἐξεδίκησεν na damu
  choice: amelipiza kisasi kwa ajili ya damu iliyomwagwa
  alternative: ameipatia haki damu; amelipiza kisasi cha damu
  rationale: Uundaji huu unaonyesha kwamba Mungu anamwadhibu mhusika kwa haki kwa sababu ya mauaji ya watu wake, bila kudokeza kisasi kisicho cha haki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa marudio “kwa maana ... kwa maana ...” umehifadhiwa kwa sababu unaonyesha mtiririko wa sifa katika Kigiriki. Alama ya tanbihi [a] imewekwa baada ya kishazi kinachohusu damu ya watumwa wake.
