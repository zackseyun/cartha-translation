  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Μετὰ ταῦτα ἤκουσα ὡς φωνὴν μεγάλην ὄχλου πολλοῦ ἐν τῷ οὐρανῷ λεγόντων· Ἁλληλουϊά· ἡ σωτηρία καὶ ἡ ⸂δόξα καὶ ἡ δύναμις⸃ τοῦ θεοῦ ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/001.yaml
  text: After these things I heard what seemed to be the loud voice of a great multitude in heaven[a], saying, “Hallelujah! Salvation and glory and power belong to our God,”
translation:
  language: sw
  text: Baada ya mambo hayo, nilisikia sauti kubwa kama sauti ya umati mkubwa mbinguni, wakisema, “Haleluya![a] Wokovu na utukufu na nguvu ni vya Mungu wetu,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Msifuni Yah,” yaani, “Msifuni BWANA.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: Baada ya mambo hayo
  rationale: Inahifadhi wingi wa kiwakilishi na mfuatano wa maono kwa Kiswahili cha kawaida.
- source_word: ἤκουσα
  choice: nilisikia
  rationale: Wakati uliopita unaendeleza simulizi kwa uwazi.
- source_word: ὡς φωνὴν μεγάλην ὄχλου πολλοῦ
  choice: sauti kama ya umati mkubwa
  rationale: ὡς inaonyesha ulinganisho wa kile kilichosikika, si lazima utambulisho kamili; μεγάλην katika muktadha wa sauti pia hudokeza sauti kuu, huku umati mkubwa ukieleza chanzo chake.
- source_word: ἐν τῷ οὐρανῷ
  choice: mbinguni
  rationale: Hapa οὐρανός ni makao ya mbinguni, si anga la kawaida.
- source_word: λεγόντων
  choice: wakisema
  rationale: Inalingana na umati kama kundi la watu wengi na kutambulisha maneno yao.
- source_word: Ἁλληλουϊά
  choice: Haleluya
  rationale: Umbo hili la kiliturujia limetambulika katika Kiswahili na linahifadhi mwangwi wa tamko la Kiebrania; maana yake inaelezwa katika tanbihi.
- source_word: ἡ σωτηρία καὶ ἡ δόξα καὶ ἡ δύναμις
  choice: Wokovu na utukufu na nguvu
  rationale: Maneno ya kawaida ya Kiswahili yanahifadhi orodha ya sifa tatu na urudiaji wa kiunganishi wa Kigiriki.
- source_word: τοῦ θεοῦ ἡμῶν
  choice: ni vya Mungu wetu
  rationale: Inaweka wazi uhusiano wa umiliki au sifa unaoonyeshwa na hali ya umilikaji ya Kigiriki kwa namna ya asili ya Kiswahili.
theological_decisions:
- issue: Namna ya kutafsiri tamko la ibada Ἁλληλουϊά
  choice: Haleluya
  alternative: Msifuni Yah / Msifuni BWANA
  rationale: Unukuzi unahifadhi tabia yake kama tamko la kale la ibada bila kulazimisha namna moja ya kuwakilisha jina la Mungu; maana ya kileksika imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya ibada lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo “sauti kama ya” huhifadhi tahadhari ya ὡς, na “ni vya Mungu wetu” ni asili kuliko tafsiri sisisi ya hali ya umilikaji.
