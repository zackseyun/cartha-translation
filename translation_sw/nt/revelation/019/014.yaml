  text: καὶ τὰ στρατεύματα ⸀τὰ ἐν τῷ οὐρανῷ ἠκολούθει αὐτῷ ἐφ’ ἵπποις λευκοῖς, ἐνδεδυμένοι βύσσινον λευκὸν καθαρόν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/014.yaml
  text: And the armies in heaven were following him on white horses[a], clothed in fine linen, white and clean.
translation:
  language: sw
  text: Na majeshi yaliyo mbinguni yalikuwa yakimfuata juu ya farasi weupe[a], yakiwa yamevaa kitani bora, cheupe na safi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “majeshi ya mbinguni.” Kirai cha Kigiriki, neno kwa neno, ni “majeshi, yale yaliyo mbinguni.”
    reason: lexical_alternative
lexical_decisions:
- source_word: στρατεύματα
  choice: majeshi
  rationale: Nomino ya wingi inaashiria vikosi vya kijeshi vilivyopangwa; “majeshi” ni neno la kawaida, la moja kwa moja, na linafaa katika muktadha wa vita wa maono haya.
- source_word: τὰ ἐν τῷ οὐρανῷ
  choice: yaliyokuwa mbinguni
  rationale: Kirai hiki ni cha mahali na kinaonyesha majeshi yalipokuwa bila kuyaainisha kuwa malaika au watakatifu.
- source_word: ἠκολούθει αὐτῷ
  choice: yakawa yakimfuata
  rationale: Muundo huu unaonyesha tendo lililokuwa likiendelea katika maono, kulingana na hali ya wakati usiotimilika ya kitenzi cha Kigiriki.
- source_word: ἐφ’ ἵπποις λευκοῖς
  choice: juu ya farasi weupe
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaoonyesha kwamba walikuwa wamewapanda farasi, huku ukihifadhi rangi nyeupe.
- source_word: ἐνδεδυμένοι
  choice: yakiwa yamevaa
  rationale: Umoja wa kisarufi wa Kigiriki unaeleza hali ya majeshi kuwa katika mavazi; Kiswahili cha sasa hutumia kwa kawaida “yamevaa.”
- source_word: βύσσινον
  choice: kitani safi
  rationale: Neno hili linamaanisha kitambaa cha kitani bora na cha thamani; “kitani safi” ni cha asili na kinaendana na taswira inayojirudia katika Ufunuo.
- source_word: λευκὸν καθαρόν
  choice: cheupe na kisicho na doa
  rationale: “Cheupe” huhifadhi taswira ya rangi, na “kisicho na doa” hueleza usafi unaoonekana bila kulazimisha tafsiri ya kiadili pekee.
theological_decisions:
- issue: Utambulisho wa majeshi yaliyo mbinguni
  choice: Kuyataja kwa maelezo tu kuwa “majeshi yaliyokuwa mbinguni.”
  alternative: “majeshi ya mbinguni,” au kuyatambulisha moja kwa moja kuwa malaika au watakatifu waliotukuzwa
  rationale: Andiko linataja mahali yalipo na mavazi yao lakini halisemi wazi katika mstari huu wao ni nani; tafsiri haipaswi kuamua mvutano huo wa kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa tendo linaloendelea umehifadhiwa, na utambulisho wa majeshi haujafafanuliwa zaidi ya andiko.
