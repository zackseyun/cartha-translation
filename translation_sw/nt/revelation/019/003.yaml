  text: καὶ δεύτερον ⸀εἴρηκαν· Ἁλληλουϊά· καὶ ὁ καπνὸς αὐτῆς ἀναβαίνει εἰς τοὺς αἰῶνας τῶν αἰώνων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/003.yaml
  text: And a second time they said[a], “Hallelujah!” And her smoke goes up forever and ever.
translation:
  language: sw
  text: Nao wakasema mara ya pili, “Haleluya!” Na moshi wake unapanda juu milele na milele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kigiriki: “kwa enzi za enzi,” nahau inayomaanisha muda usio na mwisho.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δεύτερον
  choice: mara ya pili
  rationale: Huhifadhi maana ya kurudiwa kwa mpangilio—si kusema tu kwamba walirudia, bali kwamba hii ilikuwa mara ya pili.
- source_word: εἴρηκαν
  choice: wakasema
  rationale: Ingawa kitenzi cha Kigiriki kiko katika hali timilifu, wakati uliopita wa kisimulizi unasikika kwa kawaida zaidi katika Kiswahili bila kuongeza nguvu isiyomo katika kitenzi.
- source_word: Ἁλληλουϊά
  choice: Haleluya
  rationale: Hili ni tamko la ibada linalotambulika sana katika Kiswahili; kunakili umbo lake huhifadhi hadhi yake kama kauli maalumu ya sifa.
- source_word: ὁ καπνὸς αὐτῆς
  choice: moshi wake
  rationale: Kiwakilishi kinarejelea Babeli anayewakilishwa kama mwanamke na mji. Kiswahili hakionyeshi jinsia katika ‘wake,’ lakini rejeo la muktadha linabaki bila kuongeza maneno yasiyokuwamo.
- source_word: ἀναβαίνει
  choice: unapanda juu
  rationale: Wakati wa sasa huhifadhi taswira hai na inayoendelea ya moshi kupanda; usemi huu ni wazi na wa kawaida katika Kiswahili.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: milele na milele
  rationale: Hii ndiyo njia ya kawaida na yenye hadhi ya kueleza nahau ya Kigiriki inayomaanisha muda usio na mwisho; umbo la karibu zaidi na maneno ya asili linaonyeshwa katika tanbihi.
theological_decisions:
- issue: Muda unaoelezwa na εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: milele na milele
  alternative: kwa enzi za enzi
  rationale: Katika muktadha huu wa hukumu ya mwisho, nahau ya Kigiriki kwa kawaida huonyesha muda usio na mwisho. Tafsiri haisawazishi au kupunguza nguvu hiyo, huku tanbihi ikionyesha muundo wa Kigiriki kwa uwazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kawaida lakini wenye hadhi. Mpangilio ‘mara ya pili’ huhifadhi msisitizo wa mfuatano, na ‘Haleluya’ huhifadhi tamko la ibada linalojulikana.
