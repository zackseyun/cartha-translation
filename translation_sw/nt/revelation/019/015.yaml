review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the sharp sword, purpose clause, nations, shepherding metaphor, iron rod, and present-tense winepress image. However, it unnecessarily compresses the distinct paired terms θυμός and ὀργή into “ghadhabu kali.” The revision retains the source’s intensification as “ukali wa ghadhabu.”
  naturalness: “Na katika kinywa chake unatoka” is not idiomatic Swahili word order for this image; “Na kutoka kinywani mwake unatoka” is natural and clear. “Shinikizo la divai” is also unnatural in Standard East African Swahili; “shinikizo la kukamulia divai” clearly denotes a winepress.
  terminology: “Upanga mkali,” “mataifa,” “atayachunga,” “fimbo ya chuma,” and “Mungu Mwenyezi” are appropriate. The Psalm 2 allusion is responsibly retained through “atayachunga,” with “atayatawala” supplied only as an alternative in the footnote.
  issues:
  - severity: medium
    issue: The main text reduces θυμοῦ τῆς ὀργῆς to “ghadhabu kali.”
    rationale: The Greek deliberately uses two related terms, θυμός and ὀργή. A rendering such as “ukali wa ghadhabu” better preserves the layered intensification without becoming unidiomatic.
  - severity: medium
    issue: “Na katika kinywa chake unatoka” is awkward Swahili.
    rationale: The phrase should locate the origin with “kutoka kinywani mwake”; this also avoids the unnatural implication that the sword is simply situated in his mouth.
  - severity: low
    issue: “Shinikizo la divai” is not a natural designation for a winepress.
    rationale: “Shinikizo la kukamulia divai” is clearer and idiomatic while preserving ληνός and its established prophetic imagery.
  revised_text: Na kutoka kinywani mwake unatoka upanga mkali, ili kwa huo ayapige mataifa; naye mwenyewe atayachunga kwa fimbo ya chuma[a]. Naye mwenyewe anakanyaga shinikizo la kukamulia divai ya ukali wa ghadhabu ya Mungu Mwenyezi[b].
