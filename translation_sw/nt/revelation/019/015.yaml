id: REV.19.15
reference: Revelation 19:15
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἐκ τοῦ στόματος αὐτοῦ ἐκπορεύεται ⸀ῥομφαία ὀξεῖα, ἵνα ἐν αὐτῇ πατάξῃ τὰ ἔθνη, καὶ αὐτὸς ποιμανεῖ αὐτοὺς ἐν ῥάβδῳ σιδηρᾷ· καὶ αὐτὸς πατεῖ τὴν ληνὸν τοῦ οἴνου τοῦ θυμοῦ τῆς ὀργῆς τοῦ θεοῦ τοῦ παντοκράτορος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/015.yaml
  text: And from his mouth comes a sharp sword[a], so that with it he may strike the nations, and he himself will shepherd them with an iron rod[b]; and he himself treads the winepress of the wine of the fury of the wrath of God the Almighty.
translation:
  language: sw
  text: Na kutoka kinywani mwake unatoka upanga mkali, ili kwa huo ayapige mataifa; naye mwenyewe atayachunga kwa fimbo ya chuma[a]. Naye mwenyewe anakanyaga shinikizo la kukamulia divai ya ukali wa ghadhabu ya Mungu Mwenyezi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “atayatawala kwa fimbo ya chuma.” Kitenzi cha Kigiriki kwa maana halisi ni “kuchunga kama mchungaji,” lakini hapa pia kinadokeza utawala wa kifalme, kwa mwangwi wa Zaburi 2.
    reason: alternative_reading
  - marker: b
    text: 'Kwa kufuata muundo wa Kigiriki kwa karibu zaidi: “divai ya ukali wa ghadhabu ya Mungu Mwenyezi.” Maneno mawili yanayokaribiana kwa maana yanatumiwa kusisitiza ukali wa hukumu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκπορεύεται
  choice: unatoka
  rationale: Huhifadhi taswira hai ya wakati wa sasa ya upanga unaotoka kinywani mwake, kwa Kiswahili cha kawaida na wazi.
- source_word: ῥομφαία ὀξεῖα
  choice: upanga mkali
  rationale: ῥομφαία ni upanga mkubwa, lakini ‘upanga’ ni neno la asili na lisilofafanua kupita kiasi; ὀξεῖα limehifadhiwa kwa ‘mkali.’
- source_word: ἵνα ἐν αὐτῇ πατάξῃ
  choice: ili kwa huo ayapige
  rationale: ‘Ili’ huonyesha kusudi la ἵνα, ‘kwa huo’ ni matumizi ya kifaa, na ‘ayapige’ huhifadhi πατάξῃ bila kuongeza dhana isiyotajwa wazi ya kuyaangusha.
- source_word: τὰ ἔθνη
  choice: mataifa
  rationale: Katika Ufunuo neno hili linarejelea mataifa kwa ujumla, si lazima watu wasio Wayahudi pekee.
- source_word: ποιμανεῖ
  choice: atayachunga
  rationale: Huhifadhi sitiari halisi ya kichungaji huku muktadha wa kifalme na wa hukumu ukibaki wazi kupitia fimbo ya chuma.
- source_word: ἐν ῥάβδῳ σιδηρᾷ
  choice: kwa fimbo ya chuma
  rationale: ‘Kwa’ huonyesha chombo, na ‘fimbo ya chuma’ ni Kiswahili cha kawaida kinachohifadhi taswira ya Kigiriki.
- source_word: πατεῖ
  choice: anakanyaga
  rationale: Wakati wa sasa na taswira ya kukanyaga zabibu katika shinikizo la divai zimehifadhiwa.
- source_word: τὴν ληνὸν
  choice: shinikizo la divai
  rationale: Hurejelea mahali au kifaa ambamo zabibu hukanyagwa ili kukamua divai; usemi huu unaeleweka kuliko mkopo usio wa kawaida.
- source_word: τοῦ οἴνου τοῦ θυμοῦ τῆς ὀργῆς
  choice: divai ya ghadhabu kali
  rationale: Muundo huu wa asili una maneno mawili yanayokaribiana kwa maana na kuongeza ukali. Kiswahili ‘ghadhabu kali’ huwasilisha mkazo huo kwa kawaida; tanbihi inaonyesha marudio ya karibu zaidi ya muundo.
- source_word: τοῦ θεοῦ τοῦ παντοκράτορος
  choice: ya Mungu Mwenyezi
  rationale: ‘Mwenyezi’ ni cheo cha kawaida na chenye heshima kwa παντοκράτωρ katika Kiswahili.
theological_decisions:
- issue: ποιμανεῖ katika mwangwi wa Zaburi 2 na muktadha wa hukumu
  choice: atayachunga kwa fimbo ya chuma
  alternative: atayatawala kwa fimbo ya chuma
  rationale: Kitenzi humaanisha hasa kufanya kazi ya mchungaji, lakini hapa pia hubeba mamlaka ya kifalme. Maandishi makuu yanahifadhi sitiari na mvutano huo; maana ya ‘kutawala’ imeelezwa katika tanbihi.
- issue: Mkazo maradufu wa θυμοῦ τῆς ὀργῆς
  choice: ghadhabu kali
  alternative: ukali wa ghadhabu
  rationale: Maneno mawili yanayokaribiana yanasisitiza ukali wa hukumu ya Mungu. Kiswahili cha maandishi makuu kinatoa maana hiyo kwa ufasaha, huku tanbihi ikihifadhi namna ya karibu zaidi ya muundo wa Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umegawanywa katika sentensi mbili ili usomeke kwa urahisi bila kupoteza urudiaji wenye mkazo wa αὐτός (‘mwenyewe’). Alama zote za tanbihi [a] na [b] zimo katika maandishi makuu.
