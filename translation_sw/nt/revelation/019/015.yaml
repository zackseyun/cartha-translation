revisions:
- from: Na katika kinywa chake unatoka upanga mkali, ili kwa huo ayapige mataifa; naye mwenyewe atayachunga kwa fimbo ya chuma[a]. Naye mwenyewe anakanyaga shinikizo la divai, yaani, divai ya ghadhabu kali ya Mungu Mwenyezi[b].
  to: Na kutoka kinywani mwake unatoka upanga mkali, ili kwa huo ayapige mataifa; naye mwenyewe atayachunga kwa fimbo ya chuma[a]. Naye mwenyewe anakanyaga shinikizo la kukamulia divai ya ukali wa ghadhabu ya Mungu Mwenyezi[b].
  rationale: The revision corrects idiomatic Swahili expression for the sword’s emergence and for “winepress,” while preserving the source’s repeated emphatic “he himself,” the present tense of “treads,” the pastoral metaphor of ποιμανεῖ, and the doubled wrath expression. Footnote anchors remain present and correctly support the relevant alternatives.
