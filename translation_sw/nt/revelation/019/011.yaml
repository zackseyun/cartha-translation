id: REV.19.11
reference: Revelation 19:11
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ εἶδον τὸν οὐρανὸν ἠνεῳγμένον, καὶ ἰδοὺ ἵππος λευκός, καὶ ὁ καθήμενος ἐπ’ αὐτὸν ⸂πιστὸς καλούμενος⸃ καὶ ἀληθινός, καὶ ἐν δικαιοσύνῃ κρίνει καὶ πολεμεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/011.yaml
  text: And I saw heaven opened[a], and behold, a white horse, and the one sitting on it is called Faithful and True, and in righteousness he judges and wages war.
translation:
  language: sw
  text: Kisha nikaona mbingu zimefunguliwa, na tazama, farasi mweupe! Yule aliyeketi juu yake anaitwa Mwaminifu na wa Kweli. Yeye kwa haki huhukumu na kupigana vita.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa uadilifu.”
    reason: Mbadala huu huhifadhi maana pana ya δικαιοσύνη, ambayo inaweza kueleweka kama haki au uadilifu.
lexical_decisions:
- source_word: ἠνεῳγμένον
  choice: ikiwa imefunguliwa
  rationale: Huhifadhi hali inayotokana na tendo lililokamilika, kama inavyoonyeshwa na kauli timilifu tendwa, kwa Kiswahili cha kawaida.
- source_word: ἰδοὺ
  choice: tazama
  rationale: Huhifadhi msisitizo na uhai wa maono ya kinabii.
- source_word: ἵππος λευκός
  choice: farasi mweupe
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kirai hiki.
- source_word: ὁ καθήμενος ἐπ’ αὐτὸν
  choice: Yule aliyeketi juu yake
  rationale: Hufuata muundo wa kirai cha Kigiriki bila kuongeza kwa wazi neno la kufasiri kama ‘mpanda-farasi.’
- source_word: πιστὸς καλούμενος καὶ ἀληθινός
  choice: anaitwa Mwaminifu na wa Kweli
  rationale: Huwasilisha maneno hayo kama majina au vyeo vya mhusika huku yakibaki ya asili katika Kiswahili.
- source_word: ἐν δικαιοσύνῃ
  choice: kwa haki
  rationale: Katika muktadha huu kirai kinaonyesha namna anavyohukumu na kupigana vita; ‘kwa haki’ ni fupi, ya kawaida, na huhifadhi wazo la uadilifu wa kimaadili na hukumu ya haki.
- source_word: κρίνει
  choice: huhukumu
  rationale: Wakati wa sasa unaonyesha tendo lake kwa urahisi bila kuongeza kielezi kisichokuwapo katika chanzo.
- source_word: πολεμεῖ
  choice: kupigana vita
  rationale: Huhifadhi maana kamili ya shughuli ya kivita kuliko neno la jumla ‘kupigana.’
theological_decisions:
- issue: Utambulisho na uwasilishaji wa vyeo vya aliyeketi juu ya farasi
  choice: Mwaminifu na wa Kweli
  alternative: mwaminifu na wa kweli kama sifa za kawaida
  rationale: Katika muktadha wa karibu wa Ufunuo, maneno haya yanafanya kazi kama majina au vyeo. Herufi kubwa zinaonyesha matumizi hayo bila kumtaja mhusika kwa jina ambalo aya yenyewe haitoi.
- issue: Maana ya δικαιοσύνη
  choice: kwa haki
  alternative: kwa uadilifu
  rationale: Neno linaweza kusisitiza haki katika hukumu au uadilifu wa kimaadili. Tafsiri kuu ‘kwa haki’ inafaa muktadha wa kuhukumu na kupigana vita, huku mbadala ukihifadhi upana wa maana katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi na kinachoeleweka kwa urahisi. ‘Tazama’ huhifadhi mtindo wa maono ya kinabii; sentensi zimegawanywa ili zisomeke kwa uwazi bila kupoteza mfuatano wa chanzo.
