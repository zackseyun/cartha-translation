id: REV.19.5
reference: Revelation 19:5
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ φωνὴ ἀπὸ τοῦ θρόνου ἐξῆλθεν λέγουσα· Αἰνεῖτε ⸂τῷ θεῷ⸃ ἡμῶν, πάντες οἱ δοῦλοι αὐτοῦ, ⸀καὶ οἱ φοβούμενοι αὐτόν, οἱ μικροὶ καὶ οἱ μεγάλοι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/005.yaml
  text: And a voice came from the throne[a], saying, “Praise our God, all his servants, and those who fear him[b], the small and the great.”
translation:
  language: sw
  text: Na sauti ikatoka kwenye kiti cha enzi, ikisema, “Msifuni Mungu wetu, enyi watumwa wake wote[a], na ninyi mnaomcha[b], wadogo na wakubwa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watumishi wake wote.” Neno la Kigiriki δοῦλοι linaweza kumaanisha watumwa au watumishi kulingana na muktadha.
    reason: lexical_alternative
  - marker: b
    text: Au “mnaomheshimu kwa kicho.” Kumcha Mungu ni msemo wa kibiblia unaomaanisha hofu yenye heshima na kujitoa kwa uaminifu kwake.
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνὴ
  choice: sauti
  rationale: Kwa kuwa sauti hiyo inasemwa kuwa inanena, “sauti” ndilo neno la kawaida na linalofaa zaidi kuliko “mlio.”
- source_word: ἀπὸ τοῦ θρόνου ἐξῆλθεν
  choice: ikatoka katika kiti cha enzi
  rationale: Muundo huu unaonyesha kwamba kiti cha enzi ndicho chanzo cha sauti, huku ukibaki wa kawaida katika Kiswahili.
- source_word: Αἰνεῖτε τῷ θεῷ ἡμῶν
  choice: Msifuni Mungu wetu
  rationale: Kitenzi cha amri kwa wingi kinawataka wasikilizaji wote wamsifu Mungu; Kiswahili hakihitaji kihusishi kabla ya yule anayesifiwa.
- source_word: πάντες οἱ δοῦλοι αὐτοῦ
  choice: enyi watumwa wake wote
  rationale: “Watumwa” linahifadhi maana yenye nguvu ya kuwa mali ya bwana na kumtii kabisa, huku “enyi” likionyesha wazi kundi linaloagizwa.
- source_word: οἱ φοβούμενοι αὐτόν
  choice: ninyi mnaomcha
  rationale: “Kumcha Mungu” ni msemo wa kibiblia unaohifadhi wazo la hofu yenye heshima, unyenyekevu, na uaminifu.
- source_word: οἱ μικροὶ καὶ οἱ μεγάλοι
  choice: wadogo na wakubwa
  rationale: Tafsiri hii inafuata jozi ya Kigiriki na kujumuisha watu wa hadhi zote bila kuifanya kuwa ngazi ya umri pekee.
theological_decisions:
- issue: Maana ya δοῦλοι katika mazingira ya ibada na utii kwa Mungu
  choice: watumwa
  alternative: watumishi
  rationale: “Watumwa” linadumisha maana ya kuwa chini ya mamlaka na umiliki wa Mungu; tanbihi inaonyesha tafsiri mbadala ya kawaida bila kudhoofisha maandishi makuu.
- issue: Maana ya kumcha Mungu
  choice: mnaomcha
  alternative: mnaomheshimu kwa kicho
  rationale: Maandishi makuu yanahifadhi msemo wa kibiblia na mvutano wake wa hofu pamoja na heshima; tanbihi inafafanua maana bila kuibadilisha kimya kimya.
- issue: Uhusiano wa “wadogo na wakubwa” na makundi yaliyotangulia
  choice: imeachwa mwishoni kama katika Kigiriki
  alternative: ninyi nyote, wadogo kwa wakubwa
  rationale: Mpangilio huu unahifadhi uwezekano kwamba maneno hayo yanafafanua wote wanaomcha Mungu, bila kulazimisha ufafanuzi finyu wa kisintaksia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kifasihi. “Kiti cha enzi,” “Msifuni,” na “kumcha Mungu” ni misemo inayoeleweka katika sajili ya Biblia. Muundo unabaki karibu na Kigiriki lakini unasomeka kwa urahisi kwa wasomaji wa kawaida.
