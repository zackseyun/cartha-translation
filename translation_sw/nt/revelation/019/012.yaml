id: REV.19.12
reference: Revelation 19:12
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οἱ δὲ ὀφθαλμοὶ ⸀αὐτοῦ φλὸξ πυρός, καὶ ἐπὶ τὴν κεφαλὴν αὐτοῦ διαδήματα πολλά, ⸀ἔχων ὄνομα γεγραμμένον ὃ οὐδεὶς οἶδεν εἰ μὴ αὐτός,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/012.yaml
  text: His eyes were a flame of fire, and on his head were many crowns, and he had a name written that no one knows except himself.
translation:
  language: sw
  text: Macho yake yalikuwa mwali wa moto, na kichwani mwake kulikuwa na taji nyingi za kifalme. Alikuwa na jina lililoandikwa ambalo hakuna mtu anayelijua isipokuwa yeye mwenyewe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ ... ὀφθαλμοὶ αὐτοῦ
  choice: Macho yake
  rationale: Muundo wa kawaida na wa asili wa Kiswahili unaowakilisha nomino yenye kiwakilishi cha umilikaji.
- source_word: δὲ
  choice: —
  rationale: Hapa ni kiunganishi chepesi kinachoendeleza maelezo; Kiswahili hakihitaji kitafsiriwe wazi.
- source_word: φλὸξ πυρός
  choice: mwali wa moto
  rationale: Huhifadhi taswira ya kirai nomino cha Kigiriki bila kuongeza wazi neno la ulinganisho ambalo halipo katika matini.
- source_word: ἐπὶ τὴν κεφαλὴν αὐτοῦ
  choice: kichwani mwake
  rationale: Ni usemi wa Kiswahili wa kawaida unaoonyesha mahali, yaani juu ya kichwa chake.
- source_word: διαδήματα πολλά
  choice: taji nyingi za kifalme
  rationale: διάδημα ni taji ya mamlaka ya kifalme; ufafanuzi huu ni sahihi zaidi kuliko 'taji' peke yake na unaeleweka kuliko neno la kitaalamu 'diademu'.
- source_word: ἔχων
  choice: Alikuwa na
  rationale: Kitenzi kamili kinaendeleza maelezo kwa Kiswahili cha asili huku kikihifadhi maana ya kishirikishi cha Kigiriki.
- source_word: ὄνομα γεγραμμένον
  choice: jina lililoandikwa
  rationale: Huhifadhi hali ya matokeo ya kishirikishi timilifu tendwa na kufuata mpangilio wa asili wa Kiswahili.
- source_word: ὃ οὐδεὶς οἶδεν
  choice: ambalo hakuna mtu anayelijua
  rationale: Hutoa kwa Kiswahili cha kawaida maana ya kishazi rejeshi na nguvu ya wakati uliopo ya οἶδεν.
- source_word: εἰ μὴ αὐτός
  choice: isipokuwa yeye mwenyewe
  rationale: Huhifadhi upekee wenye msisitizo bila kupanua maana ya kifungu.
theological_decisions:
- issue: Mhusika wa kishazi kinachosema hakuna mwingine anayelijua jina
  choice: Ni yeye mwenyewe pekee anayelijua jina lililoandikwa.
  alternative: Kusisitiza kwa ujumla kwamba jina hilo haliwezi kufahamika.
  rationale: Kigiriki kinasema wazi 'hakuna mtu anayejua isipokuwa yeye mwenyewe.' Tafsiri inadumisha upekee huo bila kufafanua zaidi fumbo au maana yake ya kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. 'Taji za kifalme' limetumiwa kuwasilisha kwa usahihi διαδήματα bila kutegemea neno la kitaalamu lisilo la kawaida.
