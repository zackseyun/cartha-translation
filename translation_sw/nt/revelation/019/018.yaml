id: REV.19.18
reference: Revelation 19:18
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἵνα φάγητε σάρκας βασιλέων καὶ σάρκας χιλιάρχων καὶ σάρκας ἰσχυρῶν καὶ σάρκας ἵππων καὶ τῶν καθημένων ἐπ’ ⸀αὐτῶν, καὶ σάρκας πάντων ἐλευθέρων τε καὶ δούλων καὶ μικρῶν ⸀καὶ μεγάλων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/018.yaml
  text: so that you may eat the flesh of kings[a], the flesh of commanders, the flesh of the mighty, the flesh of horses and of those who sit on them, and the flesh of all, both free and servant, and small and great.
translation:
  language: sw
  text: ili mle nyama ya wafalme, nyama ya makamanda, nyama ya wenye nguvu, nyama ya farasi na ya wale wanaowapanda, na nyama ya watu wote, walio huru na watumwa, wadogo na wakubwa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα φάγητε
  choice: ili mle
  rationale: Muundo huu unaendeleza kusudi la mwito wa aya iliyotangulia na kuwakilisha hali tegemezi ya kitenzi kwa Kiswahili cha kawaida.
- source_word: σάρκας
  choice: nyama
  rationale: Katika mandhari hii ya hukumu neno linamaanisha nyama ya miili halisi; kurudiwa kwake kunadumisha msisitizo wa orodha ya Kigiriki.
- source_word: βασιλέων
  choice: ya wafalme
  rationale: Neno linawataja wafalme hasa, si watawala kwa ujumla.
- source_word: χιλιάρχων
  choice: ya makamanda
  rationale: Linamaanisha maofisa wa kijeshi wenye amri; 'makamanda' ni wazi na la sasa bila kuingiza cheo kisichoeleweka.
- source_word: ἰσχυρῶν
  choice: ya wenye nguvu
  rationale: Kivumishi kimetumiwa kama nomino kwa watu wenye nguvu au uwezo; tafsiri hii inadumisha upana huo.
- source_word: ἵππων
  choice: ya farasi
  rationale: Ni rejeo halisi kwa farasi katika taswira ya vita.
- source_word: τῶν καθημένων ἐπ’ αὐτῶν
  choice: ya wale wanaowapanda
  rationale: Katika muktadha wa farasi, usemi wa kuketi juu yao hutafsiriwa kwa kawaida kuwa kuwapanda, huku wahusika wenyewe wakibaki wazi.
- source_word: πάντων
  choice: ya watu wote
  rationale: Ingawa Kigiriki kinasema 'wote,' kuongeza 'watu' kunafanya rejeo la makundi ya kibinadamu lisiwe na utata katika Kiswahili.
- source_word: ἐλευθέρων τε καὶ δούλων
  choice: walio huru na watumwa
  rationale: Jozi hii inatofautisha hadhi za kijamii; 'watumwa' inaonyesha hali ya utumwa iliyo kinyume cha uhuru.
- source_word: μικρῶν καὶ μεγάλων
  choice: wadogo kwa wakubwa
  rationale: Ni usemi unaojumuisha watu wa kila daraja au hadhi, na msemo huu ni wa kawaida na wenye hadhi katika Kiswahili.
theological_decisions:
- issue: Tafsiri ya δοῦλος katika jozi ya hadhi za kijamii
  choice: watumwa
  alternative: watumishi
  rationale: Kinyume chake ni watu walio huru, hivyo maana ya kuwa chini ya utumwa ndiyo inayotawala hapa; 'watumishi' ingefifisha utofauti huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Marudio ya 'nyama' yamehifadhiwa ili kubeba nguvu ya balagha ya orodha ya asili. Hakuna tanbihi iliyohitajika; alama ya tanbihi katika English POB inaonekana kutowekwa mahali panapolingana na maelezo yake, na maana ya wapanda-farasi inaweza kutolewa kwa uwazi katika matini kuu.
