id: REV.19.10
reference: Revelation 19:10
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἔπεσα ἔμπροσθεν τῶν ποδῶν αὐτοῦ προσκυνῆσαι αὐτῷ. καὶ λέγει μοι· Ὅρα μή· σύνδουλός σού εἰμι καὶ τῶν ἀδελφῶν σου τῶν ἐχόντων τὴν μαρτυρίαν Ἰησοῦ· τῷ θεῷ προσκύνησον· ἡ γὰρ ⸀μαρτυρία Ἰησοῦ ἐστιν τὸ πνεῦμα τῆς προφητείας.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/010.yaml
  text: And I fell before his feet to worship him[a]. But he says to me, “See that you do not! I am a fellow servant with you and with your brothers who hold the testimony of Jesus. Worship God[c][b], for the testimony of Jesus is the spirit of prophecy.”
translation:
  language: sw
  text: Nami nikaanguka miguuni pake ili nimwabudu. Lakini akaniambia, “Usifanye hivyo! Mimi ni mtumwa mwenzako[c], na mtumwa mwenza wa ndugu zako[b] walio na ushuhuda wa Yesu.[a] Mwabudu Mungu! Kwa maana ushuhuda wa Yesu ndio roho ya unabii.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kirai “ushuhuda wa Yesu” kinaweza kumaanisha “ushuhuda kuhusu Yesu” au “ushuhuda wa Yesu mwenyewe.” Utata huohuo unahusu kirai hicho mwishoni mwa mstari.
    reason: alternative_reading
  - marker: b
    text: Hapa “ndugu” inaweza kuwajumuisha waamini wenzake, wanaume na wanawake.
    reason: lexical_alternative
  - marker: c
    text: Au “mtumishi mwenzako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπεσα ἔμπροσθεν τῶν ποδῶν αὐτοῦ
  choice: nikaanguka miguuni pake
  rationale: Hii ni Kiswahili cha kawaida kinachoonyesha tendo na mahali pa kuanguka. Tafsiri neno kwa neno, “mbele ya miguu yake,” ingekuwa nzito na isiyo ya kawaida katika Kiswahili.
- source_word: προσκυνῆσαι αὐτῷ / προσκύνησον
  choice: ili nimwabudu / Mwabudu
  rationale: Katika muktadha huu malaika anakataa tendo hilo na kulielekeza kwa Mungu; kwa hiyo “kuabudu” inaonyesha wazi nguvu ya kidini ya προσκυνέω kuliko “kuinama.”
- source_word: Ὅρα μή
  choice: Usifanye hivyo!
  rationale: Hili ni katazo la ghafla na lenye mkazo. Kauli hii ni ya asili na wazi katika Kiswahili bila kuongeza wazo lisilokuwamo.
- source_word: σύνδουλός
  choice: mtumwa mwenzako / mtumwa mwenzao
  rationale: Neno hili linaonyesha mtu anayeshiriki hali ya utumwa na mwingine. “Mtumwa mwenza” huhifadhi mkazo wa kuwa chini ya mamlaka ya Mungu, ambao ndio msingi wa malaika kukataa kuabudiwa.
- source_word: ἀδελφῶν σου
  choice: ndugu zako
  rationale: “Ndugu” ni tafsiri ya kawaida ya ἀδελφοί na katika Kiswahili inaweza kutumiwa kwa waamini wenzake bila kulazimika kubainisha jinsia katika matini kuu.
- source_word: τῶν ἐχόντων τὴν μαρτυρίαν Ἰησοῦ
  choice: walio na ushuhuda wa Yesu
  rationale: “Walio na” huwakilisha ἐχόντων kwa uwazi. Muundo “ushuhuda wa Yesu” huhifadhi uwezekano kwamba ni ushuhuda kuhusu Yesu au ushuhuda unaotoka kwa Yesu.
- source_word: μαρτυρία Ἰησοῦ
  choice: ushuhuda wa Yesu
  rationale: Kirai hiki kinahifadhi utata halisi wa umilikishi wa Kigiriki katika sehemu zote mbili za mstari badala ya kuamua kimyakimya maana moja.
- source_word: πνεῦμα τῆς προφητείας
  choice: roho ya unabii
  rationale: Tafsiri hii hudumisha neno la kitheolojia πνεῦμα na uhusiano wake na “unabii,” bila kulipunguza kuwa “kiini” au “msukumo.”
theological_decisions:
- issue: Maana ya umilikishi katika μαρτυρία Ἰησοῦ
  choice: Kuhifadhi “ushuhuda wa Yesu” katika matini kuu
  alternative: “ushuhuda kuhusu Yesu” au “ushuhuda wa Yesu mwenyewe”
  rationale: Umilikishi wa Kigiriki unaweza kueleweka kwa maana ya ushuhuda unaomhusu Yesu au ushuhuda unaotolewa na Yesu. Chanzo hakilazimishi uchaguzi mmoja, kwa hiyo utata huo umehifadhiwa.
- issue: Tafsiri ya σύνδουλος
  choice: mtumwa mwenzako / mtumwa mwenzao
  alternative: mtumishi mwenzako / mtumishi mwenzao
  rationale: Malaika anasisitiza kwamba yeye pamoja na Yohana na waamini wengine wako chini ya Mungu, si kwamba yeye ni wa kuabudiwa. “Mtumwa mwenza” huhifadhi kwa nguvu zaidi hali hiyo ya pamoja ya kuwa chini ya mamlaka.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi, kimetumiwa. Katazo ni fupi na la moja kwa moja; muundo wa “ushuhuda wa Yesu” na “roho ya unabii” umeachwa wazi ili kuhifadhi utata na uzito wa chanzo.
