  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ εἶδον τὸ θηρίον καὶ τοὺς βασιλεῖς τῆς γῆς καὶ τὰ στρατεύματα αὐτῶν συνηγμένα ποιῆσαι ⸀τὸν πόλεμον μετὰ τοῦ καθημένου ἐπὶ τοῦ ἵππου καὶ μετὰ τοῦ στρατεύματος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/019.yaml
  text: And I saw the beast and the kings of the earth and their armies gathered to make war against the one seated on the horse and against his army[a][b].
translation:
  language: sw
  text: Nami nikamwona yule mnyama, na wafalme wa dunia pamoja na majeshi yao, wakiwa wamekusanywa[a] ili kupigana vita dhidi ya yule aliyeketi juu ya farasi na dhidi ya jeshi lake[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakiwa wamekusanyika pamoja.”
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “kufanya vita na”; katika muktadha huu maana yake ni kupigana dhidi ya yule aliyeketi juu ya farasi na dhidi ya jeshi lake.
    reason: lexical_alternative
lexical_decisions:
- source_word: θηρίον
  choice: yule mnyama
  rationale: Katika Ufunuo neno hili ni istilahi ya kiapokaliptiki yenye uzito wa kiishara na wa kutisha; “yule mnyama” hulihifadhi bila kulifanya tu “mnyama wa porini.”
- source_word: βασιλεῖς τῆς γῆς
  choice: wafalme wa dunia
  rationale: Ingawa γῆ pia laweza kumaanisha nchi, muktadha wa Ufunuo una upeo wa dunia nzima na unawahusu watawala wa ulimwengu wanaompinga Mungu.
- source_word: στρατεύματα
  choice: majeshi
  rationale: Muktadha wa πόλεμος ni wa kijeshi, hivyo “majeshi” ni tafsiri ya kawaida na yenye nguvu inayofaa.
- source_word: συνηγμένα
  choice: wakiwa wamekusanyika
  rationale: Kauli timilifu tendwa huonyesha hali ya kuwa tayari wameletwa pamoja; Kiswahili hiki huhifadhi hali hiyo kwa njia ya kawaida.
- source_word: ποιῆσαι τὸν πόλεμον
  choice: ili kupigana vita
  rationale: Hii ni nahau ya kushiriki katika vita. “Kupigana vita” ni Kiswahili cha sasa na cha kawaida kuliko tafsiri ya neno kwa neno “kufanya vita.”
- source_word: μετὰ τοῦ καθημένου ἐπὶ τοῦ ἵππου
  choice: na yule aliyeketi juu ya farasi
  rationale: Baada ya kitenzi cha kupigana, “na” kwa kawaida hueleweka kuwa upande pinzani, huku ikihifadhi kwa karibu μετά ya Kigiriki na mvutano wake wa kimsamiati.
- source_word: τοῦ καθημένου
  choice: yule aliyeketi
  rationale: Usemi wa kitenzi-jina umehifadhiwa badala ya kuufasiri moja kwa moja kuwa “mpanda farasi” au kuingiza cheo cha Kikristo kisichotajwa hapa.
- source_word: ἐπὶ τοῦ ἵππου
  choice: juu ya farasi
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya maana ya mahali.
- source_word: μετὰ τοῦ στρατεύματος αὐτοῦ
  choice: na jeshi lake
  rationale: Umoja wa στρατεύματος umehifadhiwa kwa “jeshi”; katika muktadha wa kupigana, “na” humaanisha dhidi ya jeshi hilo, lakini tanbihi inaweka wazi maana ya uhasama.
theological_decisions:
- issue: Anayerejelewa na “yule aliyeketi juu ya farasi”
  choice: Usemi wa maelezo umehifadhiwa bila kubadilishwa kuwa cheo cha Kikristo.
  alternative: dhidi ya Masihi; dhidi ya Kristo
  rationale: Muktadha wa karibu unamtambulisha huyo aliyeketi, lakini mstari wenyewe hutumia usemi wa maelezo. Kuuhifadhi huepuka kuingiza jina au cheo kisichopo katika Kigiriki huku kukiruhusu kifungu kisomwe kulingana na muktadha wake wa Kikristo.
- issue: Maana ya μετά katika nahau ya vita
  choice: “na” imetumiwa katika matini, huku maana ya uhasama ikifafanuliwa katika tanbihi.
  alternative: dhidi ya
  rationale: μετά pamoja na jenitifu kwa kawaida humaanisha “pamoja na/na,” lakini ndani ya nahau ya kupigana vita mhusika anayefuata ndiye mpinzani. Muundo wa Kiswahili “kupigana vita na” ni wa kawaida na huhifadhi kwa kiasi fulani umbo na maana zote mbili.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Kisha nikamwona” ni simulizi la kawaida; “yule mnyama” hudumisha istilahi ya kiishara ya Ufunuo. Alama zote za tanbihi zimewekwa katika matini.
