base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/016.yaml
  text: 'And he has a name written on his robe and on his thigh: King of kings and Lord of lords[a].'
translation:
  language: sw
  text: 'Naye ana jina lililoandikwa kwenye joho lake na kwenye paja lake: “MFALME WA WAFALME NA BWANA WA MABWANA.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “jina lililonakshiwa.” Kigiriki kinasema kihalisi, “jina lililoandikwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχει
  choice: ana
  rationale: Wakati wa sasa wa kitenzi umehifadhiwa kwa ‘ana,’ ukiendeleza uhai wa ono bila kuingiza maana ya ‘amevaa.’
- source_word: ἐπὶ τὸ ἱμάτιον
  choice: kwenye joho lake
  rationale: ‘Joho’ linafaa kwa vazi la mfalme-shujaa katika muktadha huu; ‘lake’ linaweka wazi uhusiano unaodokezwa na sentensi na ulinganifu na ‘paja lake.’
- source_word: ἐπὶ τὸν μηρὸν αὐτοῦ
  choice: kwenye paja lake
  rationale: Tafsiri ya moja kwa moja inahifadhi mahali pa pili panapotajwa bila kueleza jinsi jina lilivyowekwa.
- source_word: ὄνομα γεγραμμένον
  choice: jina lililoandikwa
  rationale: Huhifadhi maana ya hali inayotokana na tendo lililokamilika katika γεγραμμένον, bila kubainisha zaidi kuwa ni mchoro au nakshi.
- source_word: Βασιλεὺς βασιλέων
  choice: Mfalme wa wafalme
  rationale: Huhifadhi muundo wa Kigiriki na nguvu ya cheo cha kifalme kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: κύριος κυρίων
  choice: Bwana wa mabwana
  rationale: ‘Bwana’ ni tafsiri ya kawaida ya κύριος katika cheo hiki, na muundo wa uradidi wa Kigiriki umehifadhiwa.
theological_decisions:
- issue: Iwapo vyeo vitafsiriwe moja kwa moja au vifafanuliwe kwa maneno ya ukuu
  choice: Mfalme wa wafalme na Bwana wa mabwana
  alternative: Mfalme Mkuu kuliko wote na Bwana Mkuu kuliko wote
  rationale: Tafsiri ya moja kwa moja huhifadhi jina/cheo kilichoandikwa, lugha ya kifalme, na uzito wake wa kikristolojia bila kuongeza ufafanuzi.
- issue: 'Jinsi ya kushughulikia mahali pawili: kwenye joho na kwenye paja'
  choice: Kutaja mahali pote pawili moja kwa moja
  alternative: Kwenye joho lake, yaani sehemu inayofunika paja lake
  rationale: Kigiriki kina virai viwili tofauti vya ἐπί. Tafsiri haipaswi kuamua jinsi maandishi yanavyohusiana na joho na paja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Herufi kubwa katika cheo zinaonyesha kwamba hayo ndiyo maneno ya jina/cheo yaliyoandikwa; hazibadili maana ya Kigiriki.
