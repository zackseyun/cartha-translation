id: REV.19.17
reference: Revelation 19:17
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ εἶδον ⸀ἕνα ἄγγελον ἑστῶτα ἐν τῷ ἡλίῳ, καὶ ⸀ἔκραξεν φωνῇ μεγάλῃ λέγων πᾶσι τοῖς ὀρνέοις τοῖς πετομένοις ἐν μεσουρανήματι· Δεῦτε συνάχθητε εἰς τὸ δεῖπνον τὸ μέγα τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/017.yaml
  text: And I saw one angel standing in the sun[a], and he cried out with a loud voice, saying to all the birds flying in midheaven, “Come, gather for the great supper of God,”
translation:
  language: sw
  text: Kisha nikamwona malaika mmoja amesimama ndani ya jua, naye akapaza sauti kubwa, akiwaambia ndege wote warukao katikati ya anga[a], “Njooni, mkusanyike kwa ajili ya karamu kuu ya Mungu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “juu angani” au “katikati ya mbingu.” Neno la Kigiriki ni μεσουράνημα, usemi wa pekee wa kiapokaliptiki unaotumiwa katika Ufunuo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕνα ἄγγελον
  choice: malaika mmoja
  rationale: Neno la hesabu ἕνα limetafsiriwa wazi kuwa “mmoja” ili kuhifadhi namna mahususi ya maono hayo, badala ya kulainishwa kuwa “malaika.”
- source_word: ἑστῶτα ἐν τῷ ἡλίῳ
  choice: amesimama ndani ya jua
  rationale: “Ndani ya jua” huhifadhi taswira ya moja kwa moja na ya kushangaza ya ἐν τῷ ἡλίῳ bila kuibadili kimafafanuzi kuwa “mbele ya jua.”
- source_word: ἔκραξεν φωνῇ μεγάλῃ
  choice: akapaza sauti kubwa
  rationale: Hii ni semi ya kawaida na yenye nguvu katika Kiswahili kwa kilio au mwito wa sauti kubwa.
- source_word: πᾶσι τοῖς ὀρνέοις
  choice: ndege wote
  rationale: ὄρνεον humaanisha ndege kwa ujumla; maana ya ndege wala mizoga inatokana na muktadha, si neno lenyewe.
- source_word: τοῖς πετομένοις ἐν μεσουρανήματι
  choice: waliokuwa wakiruka katikati ya anga
  rationale: Tafsiri hii huhifadhi wazo la sehemu ya kati au ya juu ya anga linalobebwa na μεσουράνημα, huku ikiwa ya kawaida na inayoeleweka katika Kiswahili.
- source_word: Δεῦτε
  choice: Njooni
  rationale: Wingi wa amri umehifadhiwa kwa mwito wa moja kwa moja unaowaelekea ndege wote.
- source_word: συνάχθητε
  choice: mkusanyike
  rationale: Umbo hili linaonyesha amri ya kukutana pamoja; “mkusanyike” ni la asili na hudumisha maana hiyo.
- source_word: εἰς τὸ δεῖπνον τὸ μέγα τοῦ θεοῦ
  choice: kwa ajili ya karamu kuu ya Mungu
  rationale: “Karamu” hufaa kwa mlo mkubwa wa sherehe au tukio rasmi na hudumisha uhusiano wa kimuktadha na karamu iliyotajwa awali; muundo “ya Mungu” huhifadhi genitivi ya Kigiriki.
theological_decisions:
- issue: Uwasilishaji wa taswira ya kiapokaliptiki ya mahali
  choice: amesimama ndani ya jua
  alternative: amesimama mbele ya jua
  rationale: Maneno ya Kigiriki yanatoa taswira ya makusudi yenye kushangaza. Tafsiri imeihifadhi badala ya kuifanya kuwa maelezo salama zaidi ya mahali.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imebaki na uzito wa maono ya kiapokaliptiki bila kutumia msamiati wa kimadhehebu. “Kisha” imetumiwa kuendeleza simulizi kwa kawaida; “karamu” ni ya asili zaidi kuliko “chakula cha jioni” katika tukio hili kubwa la kiishara.
