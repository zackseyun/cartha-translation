  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἐδόθη αὐτῇ ἵνα περιβάληται βύσσινον ⸀λαμπρὸν καθαρόν, τὸ γὰρ βύσσινον τὰ δικαιώματα τῶν ἁγίων ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/008.yaml
  text: And it was given to her to clothe herself with fine linen[a], bright and clean, for the fine linen is the righteous deeds of the saints.
translation:
  language: sw
  text: Na akapewa kujivika kitani bora, kinachong’aa na safi, kwa maana kitani hicho bora ni matendo ya haki[a] ya watakatifu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au ‘matendo ya uadilifu.’ Neno la Kigiriki linaweza pia kumaanisha ‘matakwa ya haki’ katika miktadha mingine, lakini hapa kwa kawaida zaidi linarejelea matendo ya haki ya watakatifu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδόθη αὐτῇ
  choice: akapewa
  rationale: Kauli tendwa inadumisha kutotajwa kwa mtoaji, huku kiwakilishi cha kike kikimrejelea bibi-arusi katika muktadha. Kiswahili kwa kawaida humweka mpokeaji kuwa kiima cha kauli tendwa.
- source_word: ἵνα περιβάληται
  choice: kujivika
  rationale: Kitenzi cha kati kina maana ya kujitendea; ‘kujivika’ kinahifadhi hali hiyo badala ya kusema tu ‘kuvikwa.’ Muundo wenye ἵνα unaeleza kusudi au matokeo ya kile alichopewa.
- source_word: βύσσινον
  choice: kitani bora
  rationale: Neno hili hutaja kitani laini cha thamani kubwa. ‘Kitani bora’ ni wazi na cha kawaida zaidi kwa wasomaji kuliko istilahi ya kiufundi, na limerudiwa katika sehemu zote mbili kama ilivyo katika Kigiriki.
- source_word: λαμπρὸν
  choice: ing’arayo
  rationale: Linadumisha taswira ya mwangaza au mng’ao wa vazi bila kuingiza maana ya ziada.
- source_word: καθαρόν
  choice: safi
  rationale: ‘Safi’ linaeleza hali ya kitani moja kwa moja na halibadili mapema taswira ya vazi kuwa kauli ya kimaadili.
- source_word: δικαιώματα
  choice: matendo ya haki
  rationale: Katika wingi na katika maelezo haya ya mfano, neno linaelekea zaidi kumaanisha matendo yanayopatana na haki kuliko masharti au hukumu za kisheria. Tanbihi inadumisha mbadala wa karibu.
- source_word: τῶν ἁγίων
  choice: ya watakatifu
  rationale: ‘Watakatifu’ ni istilahi ya kawaida ya Agano Jipya kwa watu walio wakfu kwa Mungu, bila kudokeza kundi maalumu la baadaye.
theological_decisions:
- issue: Maana ya δικαιώματα katika uhusiano na vazi la bibi-arusi
  choice: Kitani kinafananishwa na matendo ya haki ya watakatifu.
  alternative: Matendo ya uadilifu; au, kwa maana pana isiyofaa sana hapa, matakwa ya haki yanayowahusu watakatifu.
  rationale: 'Wingi wa δικαιώματα na maelezo ya mfano katika muktadha yanaunga mkono ‘matendo ya haki.’ Tafsiri pia inadumisha mvutano wa andiko: kitani kinapewa, lakini wakati huohuo kinawakilisha matendo ya watakatifu.'
- issue: Mtoaji katika kauli tendwa ἐδόθη
  choice: 'Mtoaji hatajwi: ‘akapewa.’'
  alternative: Mungu alimpa.
  rationale: Inawezekana kauli tendwa inadokeza kwamba Mungu ndiye mtoaji, lakini Kigiriki hakimtaji wazi; hivyo tafsiri haiongezi kiima.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kifasihi lakini kinachoeleweka kwa msomaji wa kawaida. ‘Naye akapewa kujivika’ huhifadhi kauli tendwa na maana ya kujitendea, bila kumtaja mtoaji wala kulifanya bibi-arusi kuwa mpokeaji asiye na ushiriki.
