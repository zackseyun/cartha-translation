id: REV.19.4
reference: Revelation 19:4
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἔπεσαν οἱ πρεσβύτεροι οἱ εἴκοσι τέσσαρες καὶ τὰ τέσσαρα ζῷα, καὶ προσεκύνησαν τῷ θεῷ τῷ καθημένῳ ἐπὶ ⸂τῷ θρόνῳ⸃ λέγοντες· Ἀμήν, Ἁλληλουϊά.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/004.yaml
  text: And the twenty-four elders and the four living creatures fell down and worshiped God[a], the one seated on the throne, saying, “Amen! Hallelujah!”
translation:
  language: sw
  text: Ndipo wale wazee ishirini na wanne na wale viumbe hai wanne wakaanguka chini na kumwabudu Mungu, yeye aliyeketi kwenye kiti cha enzi, wakisema, “Amina! Haleluya![a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Msifuni BWANA!” Ni tamko la ibada la Kiebrania; kwa neno halisi, “Msifuni Yah!”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπεσαν
  choice: wakaanguka chini
  rationale: Katika muktadha wa ibada, kitenzi kinaonyesha kujitupa chini kwa heshima; ‘wakaanguka chini’ ni cha asili na hudokeza wazi tendo hilo.
- source_word: πρεσβύτεροι οἱ εἴκοσι τέσσαρες
  choice: wale wazee ishirini na wanne
  rationale: ‘Wazee’ ndilo neno la kawaida katika Ufunuo kwa viongozi hawa wa mbinguni, huku ‘wale’ ikionyesha kundi linalojulikana tayari.
- source_word: τὰ τέσσαρα ζῷα
  choice: wale viumbe hai wanne
  rationale: ‘Viumbe hai’ hutofautisha hawa viumbe wa chumba cha enzi na wanyama wa kawaida na kubaki karibu na maana ya ζῷα.
- source_word: προσεκύνησαν
  choice: kumwabudu
  rationale: Kwa kuwa Mungu ndiye anayelengwa na tendo hili, maana hapa ni ibada, si kutoa heshima ya kawaida tu.
- source_word: τῷ θεῷ
  choice: Mungu
  rationale: Muundo wa Kiswahili ‘kumwabudu Mungu’ huwasilisha yambwa ya Kigiriki kwa kawaida bila kihusishi cha ziada.
- source_word: τῷ καθημένῳ ἐπὶ τῷ θρόνῳ
  choice: yeye aliyeketi kwenye kiti cha enzi
  rationale: Kirai hiki kinamtambulisha Mungu na kuhifadhi picha ya kuketi juu ya kiti cha enzi kwa Kiswahili cha kawaida.
- source_word: λέγοντες
  choice: wakisema
  rationale: Huhifadhi umbo la kishiriki na kuunganisha tendo la kuabudu na tamko linalofuata.
- source_word: Ἀμήν
  choice: Amina
  rationale: ‘Amina’ ni umbo la kiliturujia lililozoeleka katika Kiswahili na linafaa zaidi kuliko kulifafanua ndani ya mstari.
- source_word: Ἁλληλουϊά
  choice: Haleluya
  rationale: ‘Haleluya’ ni tamko la ibada lililozoeleka katika Kiswahili; maana yake ya Kiebrania imewekwa katika tanbihi.
theological_decisions:
- issue: Jinsi ya kutafsiri Ἁλληλουϊά, tamko la ibada la Kiebrania lililoingizwa katika maandishi ya Kigiriki
  choice: Haleluya
  alternative: Msifuni BWANA! / Msifuni Yah!
  rationale: Utohozi huhifadhi tabia yake kama tamko maalumu la ibada na unatambulika kwa urahisi katika Kiswahili. Tanbihi inaeleza maana yake bila kuamua kimyakimya namna ya kuwakilisha jina la Mungu lililofupishwa ndani ya tamko hilo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo unaweka mtiririko wa simulizi kwa ‘Ndipo’ na vitenzi vya mfululizo, huku ukihifadhi lugha ya chumba cha enzi na tamko la ibada.
