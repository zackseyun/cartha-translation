id: REV.19.6
reference: Revelation 19:6
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἤκουσα ὡς φωνὴν ὄχλου πολλοῦ καὶ ὡς φωνὴν ὑδάτων πολλῶν καὶ ὡς φωνὴν βροντῶν ἰσχυρῶν, ⸀λεγόντων· Ἁλληλουϊά, ὅτι ἐβασίλευσεν κύριος, ὁ ⸀θεός, ὁ παντοκράτωρ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/006.yaml
  text: And I heard what seemed to be the voice of a great multitude[a], and like the voice of many waters, and like the voice of mighty thunders, saying, “Hallelujah! For the Lord God, the Almighty[b], reigns.”
translation:
  language: sw
  text: Nami nikasikia sauti iliyokuwa kama ya umati mkubwa[a], kama sauti ya maji mengi, na kama sauti ya ngurumo zenye nguvu, wakisema, “Haleluya! Kwa maana Bwana Mungu, Mwenyezi[b], anatawala.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati zina maneno “Bwana Mungu wetu, Mwenyezi,” lakini matini ya Kigiriki iliyochapishwa hapa inasema kwa karibu zaidi, “Bwana, Mungu, Mwenyezi.”
    reason: textual_variant
  - marker: b
    text: Au “ametawala,” “amekuwa Mfalme,” au “ameanza kutawala”; kitenzi cha Kigiriki kinaweza kueleweka kuwa kinasherehekea udhihirisho wa kuamua wa utawala wa Mungu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσα
  choice: nikasikia
  rationale: Kitenzi cha wakati uliopita katika mfuatano wa simulizi kinatafsiriwa moja kwa moja kama ‘nikasikia.’
- source_word: ὡς φωνὴν
  choice: sauti iliyokuwa kama / kama sauti
  rationale: ὡς inaonyesha ulinganisho, si utambulisho kamili; Kiswahili hiki kinadumisha mtindo wa maono uliojaa tashbihi.
- source_word: ὄχλου πολλοῦ
  choice: umati mkubwa
  rationale: Ni usemi wa kawaida na wenye hadhi kwa kundi kubwa sana la watu.
- source_word: ὑδάτων πολλῶν
  choice: maji mengi
  rationale: Tafsiri ya karibu inayohifadhi taswira ya kibiblia ya sauti kuu na yenye fahari.
- source_word: βροντῶν ἰσχυρῶν
  choice: ngurumo zenye nguvu
  rationale: ἰσχυρῶν husisitiza nguvu; usemi huu ni wa kawaida na wazi katika Kiswahili.
- source_word: λεγόντων
  choice: ikisema
  rationale: Ingawa umbo la Kigiriki ni la wingi na linaweza kuhusishwa na umati, kisarufi ‘sauti’ ndiyo kiini cha usemi wa Kiswahili; umoja huu unaacha uhusiano huo wazi bila kuongeza ‘wakisema.’
- source_word: Ἁλληλουϊά
  choice: Haleluya
  rationale: Unukuzi huu wa tamko la kiliturujia umezoeleka katika Kiswahili cha Biblia na ibada.
- source_word: ὅτι
  choice: Kwa maana
  rationale: Hutambulisha sababu ya sifa ya ‘Haleluya’ kwa lugha yenye hadhi na iliyo ya kawaida.
- source_word: ἐβασίλευσεν
  choice: anatawala
  rationale: Katika tangazo hili la ushindi, wakati uliopita wa Kigiriki unaweza kutangaza kwa msisitizo utawala wa Mungu uliodhihirishwa kwa uamuzi. ‘Anatawala’ ni ya asili katika Kiswahili na haiongezi kwa lazima wazo kwamba utawala wake umeanza tu sasa.
- source_word: κύριος, ὁ θεός, ὁ παντοκράτωρ
  choice: Bwana Mungu, Mwenyezi
  rationale: Huhifadhi vyeo vitatu vya Mungu kwa Kiswahili cha kawaida chenye hadhi, bila kuongeza ‘wetu,’ ambalo halipo katika matini iliyochapishwa hapa.
theological_decisions:
- issue: Maana ya ἐβασίλευσεν kuhusu utawala wa Mungu
  choice: anatawala
  alternative: ametawala; amekuwa Mfalme; ameanza kutawala
  rationale: Hii inadumisha tangazo la ushindi wa utawala wa Mungu bila kuamua kwamba enzi yake yenyewe ilianza wakati huo. Tanbihi inahifadhi upana wa kitenzi cha Kigiriki na uwezekano wa kudhihirishwa kwa utawala huo kwa uamuzi.
- issue: Kuwepo au kutokuwepo kwa kiwakilishi ‘wetu’
  choice: Bwana Mungu, Mwenyezi
  alternative: Bwana Mungu wetu, Mwenyezi; Bwana, Mungu, Mwenyezi
  rationale: SBLGNT iliyotolewa haina ἡμῶν (‘wetu’), kwa hiyo matini kuu inafuata ushahidi huo. Usomaji wenye ‘wetu’ umetajwa katika tanbihi kwa uwazi wa kimatini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kifasihi lakini kinachoeleweka kwa urahisi. Muundo wa kurudiwa ‘kama sauti... na kama sauti...’ unahifadhi mahadhi na taswira za Ufunuo. Alama zote za tanbihi zimewekwa katika matini kuu.
