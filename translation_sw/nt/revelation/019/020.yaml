id: REV.19.20
reference: Revelation 19:20
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἐπιάσθη τὸ θηρίον καὶ ⸂μετ’ αὐτοῦ ὁ⸃ ψευδοπροφήτης ὁ ποιήσας τὰ σημεῖα ἐνώπιον αὐτοῦ, ἐν οἷς ἐπλάνησεν τοὺς λαβόντας τὸ χάραγμα τοῦ θηρίου καὶ τοὺς προσκυνοῦντας τῇ εἰκόνι αὐτοῦ· ζῶντες ἐβλήθησαν οἱ δύο εἰς τὴν λίμνην τοῦ πυρὸς ⸂τῆς καιομένης⸃ ἐν θείῳ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/020.yaml
  text: And the beast was captured[a], and with it the false prophet who had performed the signs in its presence, by which he deceived those who had received the mark of the beast and those who worshiped its image[b]. The two of them were thrown alive into the lake of fire that burns with sulfur.
translation:
  language: sw
  text: Mnyama akakamatwa, na pamoja naye akakamatwa yule nabii wa uongo aliyefanya ishara mbele yake. Kwa ishara hizo aliwadanganya wale waliopokea alama ya mnyama na wale walioiabudu sanamu yake. Wote wawili wakatupwa wakiwa hai ndani ya ziwa la moto linalowaka kwa kiberiti.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιάσθη
  choice: akakamatwa
  rationale: Kitenzi hiki ni aoristi tendwa na kinaeleza kushikwa au kutiwa mikononi; “akakamatwa” ni Kiswahili cha kawaida kinachohifadhi hali ya kutendwa.
- source_word: τὸ θηρίον
  choice: yule mnyama
  rationale: “Mnyama” huhifadhi taswira ya kiapokaliptiki ya Ufunuo; “yule” humtambulisha mhusika aliyekwisha tajwa katika muktadha.
- source_word: μετ’ αὐτοῦ
  choice: pamoja naye
  rationale: Kiswahili kwa kawaida hutumia ngeli ya A-WA kwa mnyama anayewasilishwa kama mhusika mwenye utendaji; “naye” ni rejeo la kisarufi bila kulazimisha tafsiri ya ziada kuhusu asili yake.
- source_word: ψευδοπροφήτης
  choice: nabii wa uongo
  rationale: Ni tafsiri ya moja kwa moja, ya kawaida na inayoeleweka ya nomino ambatano.
- source_word: ὁ ποιήσας τὰ σημεῖα
  choice: aliyefanya ishara
  rationale: Muundo wa kishirikishi unaonyesha kitendo kinachomtambulisha nabii wa uongo; “ishara” huhifadhi wazo la σημεῖα kuliko “miujiza” pekee.
- source_word: ἐνώπιον αὐτοῦ
  choice: mbele yake
  rationale: Hutoa maana ya kufanya ishara mbele ya au katika uwepo wa mnyama, huku ikibaki ya asili katika Kiswahili.
- source_word: ἐν οἷς ἐπλάνησεν
  choice: Kwa ishara hizo aliwadanganya
  rationale: 'ἐν οἷς ina nguvu ya kimatumizi hapa: ishara ndizo njia alizotumia kudanganya. Kurudia “ishara” huondoa utata wa kiwakilishi katika Kiswahili.'
- source_word: τοὺς λαβόντας τὸ χάραγμα
  choice: wale waliopokea alama
  rationale: “Waliopokea” huonyesha tendo lililotangulia, na “alama” ndiyo istilahi ya kawaida kwa χάραγμα katika Ufunuo.
- source_word: τοὺς προσκυνοῦντας τῇ εἰκόνι αὐτοῦ
  choice: wale walioiabudu sanamu yake
  rationale: Katika muktadha huu προσκυνέω ina maana ya ibada, na εἰκών ni sanamu/picha inayowakilisha mnyama; “sanamu” linafaa kwa kitu kinachoabudiwa.
- source_word: ζῶντες ἐβλήθησαν οἱ δύο
  choice: Wote wawili wakatupwa wakiwa hai
  rationale: Huhifadhi msisitizo kwamba wahusika wote wawili walitupwa wangali hai.
- source_word: τὴν λίμνην τοῦ πυρὸς τῆς καιομένης ἐν θείῳ
  choice: ziwa la moto linalowaka kwa kiberiti
  rationale: Huhifadhi taswira halisi ya hukumu; θεῖον ni sulfuri/kiberiti, na “kiberiti” ni neno la kawaida la Kiswahili.
theological_decisions:
- issue: Rejeo la viwakilishi kwa mnyama
  choice: Kutumia “naye/yake” kulingana na mfumo wa ngeli wa Kiswahili
  alternative: Kutumia muundo usio wa nafsi kama “pamoja na huyo mnyama” kila mara
  rationale: Tofauti ya Kiingereza kati ya “it” na “him” haihamishiki moja kwa moja katika Kiswahili. Nomino “mnyama” kwa kawaida huchukua upatanisho wa A-WA inapowasilishwa kama kiumbe mwenye utendaji; uchaguzi huu ni wa kisarufi na hauamui kwamba mnyama ni mtu halisi.
- issue: Taswira ya hukumu ya mwisho
  choice: Kuhifadhi “ziwa la moto linalowaka kwa kiberiti”
  alternative: Kufafanua kama jehanamu au mateso ya milele
  rationale: Aya yenyewe inatoa taswira thabiti ya kiapokaliptiki. Tafsiri haiingizi maelezo ya kimafundisho yasiyotajwa wazi katika aya hii.
- issue: Maana ya εἰκών katika ibada ya mnyama
  choice: “sanamu yake”
  alternative: “mfano wake” au “picha yake”
  rationale: “Sanamu” huwasilisha kwa kawaida kitu kinachowakilisha mwingine na kuabudiwa, bila kuongeza madai kuhusu umbo au nyenzo yake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ndefu ya Kigiriki imegawanywa ili isomeke kwa urahisi bila kupoteza uhusiano wa ishara na udanganyifu. Kiashiria cha tanbihi [a] kimewekwa baada ya “kiberiti.”
