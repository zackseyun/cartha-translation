id: REV.19.21
reference: Revelation 19:21
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ οἱ λοιποὶ ἀπεκτάνθησαν ἐν τῇ ῥομφαίᾳ τοῦ καθημένου ἐπὶ τοῦ ἵππου τῇ ἐξελθούσῃ ἐκ τοῦ στόματος αὐτοῦ, καὶ πάντα τὰ ὄρνεα ἐχορτάσθησαν ἐκ τῶν σαρκῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/021.yaml
  text: And the rest were killed by the sword of the one seated on the horse[a], the sword that came out from his mouth[b], and all the birds were filled from their flesh.
translation:
  language: sw
  text: Na wale wengine wakauawa[a] kwa upanga wa yule aliyeketi juu ya farasi—upanga uliotoka kinywani mwake[b]—na ndege wote wakashiba kwa nyama zao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakachinjwa.”
    reason: lexical_alternative
  - marker: b
    text: “Upanga” unaotoka kinywani mwake ni taswira ya kiapokaliptiki; linganisha Ufunuo 19:15.
    reason: cross_reference
lexical_decisions:
- source_word: οἱ λοιποὶ
  choice: wale wengine
  rationale: Ni Kiswahili cha kawaida kinachorejelea watu waliosalia baada ya mnyama na nabii wa uongo kushughulikiwa katika muktadha uliotangulia.
- source_word: ἀπεκτάνθησαν
  choice: wakauawa
  rationale: Kitenzi cha kutendwa kinahifadhiwa kwa namna ya kawaida ya masimulizi ya Kiswahili; maana ni kuuawa, si kufa tu.
- source_word: ἐν τῇ ῥομφαίᾳ
  choice: kwa upanga
  rationale: ‘Kwa’ huonyesha chombo kilichotumiwa na huhifadhi taswira halisi ya upanga mkubwa katika Ufunuo.
- source_word: τοῦ καθημένου ἐπὶ τοῦ ἵππου
  choice: wa yule aliyeketi juu ya farasi
  rationale: Hufuata muundo wa kirai cha Kigiriki kwa uwazi bila kupunguza mhusika kuwa ‘mpanda farasi’ pekee.
- source_word: τῇ ἐξελθούσῃ ἐκ τοῦ στόματος αὐτοῦ
  choice: upanga uliotoka kinywani mwake
  rationale: Kurudia ‘upanga’ kunadhihirisha wazi kile kinachofafanuliwa; ‘kinywani mwake’ ni Kiswahili asilia kinachohifadhi chanzo kilichoonyeshwa na ἐκ.
- source_word: πάντα τὰ ὄρνεα
  choice: ndege wote
  rationale: Kigiriki kinasema ndege bila kuongeza wazi ‘wala nyama’ au ‘ndege wawindaji’; muktadha wenyewe unaonyesha aina ya ulaji.
- source_word: ἐχορτάσθησαν
  choice: wakashiba
  rationale: χορτάζω hapa humaanisha kula mpaka kutosheka. ‘Wakashiba’ ni ya kawaida, yenye nguvu inayofaa, na hudumisha umbo la kutendwa/hali iliyosababishwa na kula.
- source_word: ἐκ τῶν σαρκῶν αὐτῶν
  choice: kwa nyama zao
  rationale: Ingawa ἐκ huonyesha chanzo, Kiswahili asilia husema mtu ameshiba ‘kwa’ chakula fulani. ‘Nyama zao’ hapa ni miili halisi, si maana ya kitheolojia ya asili ya dhambi.
theological_decisions:
- issue: Asili ya upanga unaotoka kinywani mwa aliyeketi juu ya farasi
  choice: Taswira halisi ya kiapokaliptiki ‘upanga uliotoka kinywani mwake’ imehifadhiwa bila kufasiri ishara ndani ya matini kuu.
  alternative: Kuifafanua kuwa neno lake au hukumu yake.
  rationale: Mstari wenyewe unatoa taswira ya ishara; tafsiri haipaswi kuamua maana yake ya kitheolojia kwa kuongeza ufafanuzi katika matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa masimulizi wenye ‘waka-’ unaunganisha matukio kwa kawaida. ‘Wakashiba kwa nyama zao’ hutanguliza uasilia wa Kiswahili huku ikidumisha dhana ya kwamba nyama hizo ndizo chanzo cha kushiba.
