id: REV.10.10
reference: Revelation 10:10
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἔλαβον τὸ ⸀βιβλαρίδιον ἐκ τῆς χειρὸς τοῦ ἀγγέλου καὶ κατέφαγον αὐτό, καὶ ἦν ἐν τῷ στόματί μου ὡς μέλι γλυκύ· καὶ ὅτε ἔφαγον αὐτό, ἐπικράνθη ἡ κοιλία μου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/010.yaml
  text: And I took the little scroll from the hand of the angel and ate it, and in my mouth it was sweet like honey; and when I had eaten it, my stomach was made bitter.
translation:
  language: sw
  text: Kisha nikachukua hati ndogo ya kukunjwa[a] kutoka mkononi mwa malaika, nikaila. Kinywani mwangu ilikuwa tamu kama asali; na nilipokwisha kuila, tumbo langu likawa chungu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kijitabu.” Neno la Kigiriki ni la udogo na linaweza kumaanisha hati ndogo iliyoandikwa; “hati ndogo ya kukunjwa” hufaa umbo la hati katika ulimwengu wa kale.
    reason: lexical_alternative
  - marker: b
    text: Au “tumbo langu likawa na uchungu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: βιβλαρίδιον
  choice: kitabu kidogo cha kukunjwa
  rationale: Neno la Kigiriki ni la udogo na linamaanisha hati ndogo iliyoandikwa; usemi huu unaonyesha udogo wake na umbo linalowezekana la hati ya kale.
- source_word: ἐκ τῆς χειρὸς τοῦ ἀγγέλου
  choice: kutoka mkononi mwa malaika
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaohifadhi picha ya kukipokea moja kwa moja kutoka mkononi mwa malaika.
- source_word: κατέφαγον
  choice: kukila
  rationale: Kitenzi 'kula' kinatoa maana wazi na ya asili bila kuzidisha nguvu ya kitenzi kuwa 'kukimeza kwa pupa.'
- source_word: ὡς μέλι γλυκύ
  choice: kitamu kama asali
  rationale: Inahifadhi ulinganisho wa Kigiriki kwa Kiswahili cha kawaida na chenye kueleweka.
- source_word: ὅτε ἔφαγον αὐτό
  choice: nilipokwisha kukila
  rationale: 'Inaonyesha wazi mfuatano wa matukio: uchungu ulitokea baada ya kukila.'
- source_word: ἐπικράνθη
  choice: likawa chungu
  rationale: Ni Kiswahili cha asili kinachoeleza mabadiliko yaliyotokea tumboni bila kulazimisha mtendaji ambaye hajatajwa katika Kigiriki.
- source_word: κοιλία
  choice: tumbo
  rationale: Ni neno la kawaida na linalofaa kwa sehemu ya ndani ya mwili inayokusudiwa hapa.
theological_decisions:
- issue: Tendo la mfano la kula kitabu kidogo cha kukunjwa
  choice: Taswira imetafsiriwa moja kwa moja bila kuifafanua ndani ya aya.
  alternative: Kueleza utamu na uchungu kuwa furaha na hukumu au athari nyingine ya ujumbe wa kinabii.
  rationale: Aya yenyewe haitoi ufafanuzi kamili wa alama hizo; kuacha taswira isimame kunahifadhi utata na mvutano wa kiteolojia wa matini.
- issue: Kauli ya ἐπικράνθη
  choice: likawa chungu
  alternative: lilifanywa kuwa chungu
  rationale: Umbo la Kigiriki linaweza kuwakilishwa kwa maana ya kuingia katika hali ya uchungu. Kiswahili 'likawa chungu' ni cha asili na hakiongezi wazi mtendaji asiyeainishwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa simulizi na taswira ya mwili vimehifadhiwa bila kuongeza ufafanuzi wa ishara.
