  text: καὶ ἔχων ἐν τῇ χειρὶ αὐτοῦ ⸀βιβλαρίδιον ἠνεῳγμένον. καὶ ἔθηκεν τὸν πόδα αὐτοῦ τὸν δεξιὸν ἐπὶ τῆς θαλάσσης, τὸν δὲ εὐώνυμον ἐπὶ τῆς γῆς,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/002.yaml
  text: and having in his hand a little scroll that had been opened[a]. And he placed his right foot on the sea, and his left on the land[b],
translation:
  language: sw
  text: Naye, akiwa ameshika mkononi mwake gombo dogo[a] lililokuwa limefunguliwa, akaweka mguu wake wa kulia juu ya bahari, na wa kushoto juu ya nchi kavu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kitabu kidogo.” Neno la Kigiriki βιβλαρίδιον ni neno la udogo linaloweza kumaanisha gombo dogo au kitabu kidogo.
    reason: lexical_alternative
  - marker: b
    text: Au, “dunia.” Neno la Kigiriki γῆ linaweza kumaanisha nchi kavu, ardhi, au dunia; hapa “nchi kavu” limetumiwa kwa sababu linalinganishwa na bahari.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχων
  choice: alikuwa ameshika
  rationale: Kitenzi hiki kinaendeleza maelezo ya malaika mwenye nguvu katika mstari uliotangulia. Usemi huu ni wa kawaida katika Kiswahili na unaonyesha kwamba gombo lilikuwa mkononi mwake.
- source_word: ἐν τῇ χειρὶ αὐτοῦ
  choice: mkononi mwake
  rationale: Huhifadhi umoja wa ‘mkono’ katika Kigiriki na ni usemi wa kawaida wa Kiswahili.
- source_word: βιβλαρίδιον
  choice: gombo dogo
  rationale: Neno hili la udogo linaweza kumaanisha gombo au kitabu kidogo. ‘Gombo dogo’ huhifadhi picha ya hati ya kukunjwa inayofaa mazingira ya Ufunuo.
- source_word: ἠνεῳγμένον
  choice: lililokuwa limefunguliwa
  rationale: 'Kauli timilifu tendwa inaonyesha tendo lililokamilika pamoja na hali inayoendelea: gombo lilikuwa tayari limefunguliwa.'
- source_word: ἔθηκεν
  choice: akaweka
  rationale: Huwasilisha tendo la makusudi na pia kuendeleza mfululizo wa masimulizi kwa njia ya kawaida katika Kiswahili.
- source_word: τὸν πόδα αὐτοῦ τὸν δεξιὸν
  choice: mguu wake wa kulia
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida, inayohifadhi umoja wa neno ‘mguu.’
- source_word: ἐπὶ τῆς θαλάσσης
  choice: juu ya bahari
  rationale: Huhifadhi picha dhahiri ya malaika kusimama juu ya bahari.
- source_word: τὸν δὲ εὐώνυμον
  choice: na wa kushoto
  rationale: Kiswahili kinaweza kutorudia neno ‘mguu’ kwa kuwa linaeleweka wazi kutokana na muundo sambamba.
- source_word: ἐπὶ τῆς γῆς
  choice: juu ya nchi kavu
  rationale: Katika ulinganifu na bahari, ‘nchi kavu’ huonyesha wazi eneo lisilo bahari bila kulazimisha maana pana ya ulimwengu wote.
theological_decisions:
- issue: Maana ya γῆ inapolinganishwa na θάλασσα
  choice: nchi kavu
  alternative: dunia
  rationale: Maono yanaonyesha mguu mmoja juu ya bahari na mwingine juu ya eneo kavu. Tafsiri hii huhifadhi utofautishaji wa mahali huku tanbihi ikitunza uwezekano wa maana pana ya ‘dunia.’
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaoeleweka kwa wasomaji wa kawaida. Muundo ni wa asili katika Kiswahili lakini unahifadhi picha, mfuatano, na hali ya kitenzi cha Kigiriki.
