lexical_decisions:
- source_word: ἄγγελος
  choice: malaika
  rationale: Katika muktadha wa Ufunuo, anayerejelewa ni kiumbe wa mbinguni; kwa hiyo “malaika” ni sahihi na ya kawaida kuliko “mjumbe.”
- source_word: ἑστῶτα
  choice: amesimama
  rationale: Kauli hii inaeleza hali au mkao wa malaika wakati Yohana alipomwona; “amesimama” ni ya asili katika Kiswahili na inadumisha maana ya hali iliyopo.
- source_word: ἐπὶ τῆς θαλάσσης
  choice: juu ya bahari
  rationale: Hifadhi picha dhahiri ya malaika akiwa juu ya bahari kama ilivyo katika Kigiriki na muktadha uliotangulia.
- source_word: ἐπὶ τῆς γῆς
  choice: juu ya nchi kavu
  rationale: Katika ulinganisho wa moja kwa moja na bahari, “nchi kavu” huonyesha eneo la nchi kwa uwazi na kwa Kiswahili cha kawaida; uwezekano wa maana pana ya “dunia” umehifadhiwa katika tanbihi.
- source_word: ἦρεν
  choice: akainua
  rationale: “Akainua” ni tafsiri fupi na ya kawaida ya tendo hili, nalo katika muktadha ni ishara ya kuapa.
- source_word: τὴν χεῖρα αὐτοῦ τὴν δεξιὰν
  choice: mkono wake wa kulia
  rationale: Tafsiri hii ya kawaida inadumisha utajo mahsusi wa mkono wa kulia.
- source_word: εἰς τὸν οὐρανόν
  choice: kuelekea mbinguni
  rationale: Kirai hiki huonyesha mwelekeo wa ishara bila kudokeza kwamba mkono uliingia mbinguni; “mbinguni” pia hudumisha uzito wa kiteolojia wa muktadha.
theological_decisions:
- issue: Maana ya γῆ inapolinganishwa na θάλασσα
  choice: nchi kavu
  alternative: dunia
  rationale: Taswira ya karibu ni ya malaika akiwa juu ya maeneo mawili, bahari na nchi kavu. Hata hivyo, γῆ inaweza pia kuwa na maana pana ya “dunia,” hivyo maana hiyo imewekwa katika tanbihi badala ya kuondolewa.
- issue: Maana ya οὐρανός
  choice: mbinguni
  alternative: angani
  rationale: Ishara hii inatangulia kiapo kinachomhusu Muumba katika mstari unaofuata. “Mbinguni” hudumisha maana ya eneo la mbinguni na uzito wa kiteolojia, tofauti na “angani,” ambalo lingeweza kueleweka kuwa anga la kawaida tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi ni wa asili, huku taswira ya kinabii, mkao wa malaika, mkono wa kulia, na mwelekeo wa ishara vikihifadhiwa.
