  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ ἡ φωνὴ ἣν ἤκουσα ἐκ τοῦ οὐρανοῦ, πάλιν ⸀λαλοῦσαν μετ’ ἐμοῦ καὶ ⸀λέγουσαν· Ὕπαγε λάβε τὸ ⸀βιβλίον τὸ ἠνεῳγμένον ἐν τῇ χειρὶ τοῦ ἀγγέλου τοῦ ἑστῶτος ἐπὶ τῆς θαλάσσης καὶ ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/008.yaml
  text: And the voice that I heard from heaven spoke to me again and said[a], “Go[b], take the scroll that is opened in the hand of the angel who is standing on the sea and on the land.”
translation:
  language: sw
  text: 'Na ile sauti niliyoisikia kutoka mbinguni ikasema nami tena: “Nenda ukachukue hati-kunjo[a] iliyofunguliwa, iliyo mkononi mwa malaika aliyesimama juu ya bahari na juu ya nchi kavu[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “hati-kunjo ndogo.” Aya za karibu zinatumia neno lenye maana ya udogo, lakini aya hii ina βιβλίον, “hati-kunjo.”
    reason: alternative_reading
  - marker: b
    text: Au “dunia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνὴ
  choice: sauti
  rationale: Katika muktadha huu φωνή ni sauti inayosema kutoka mbinguni, si mlio tu.
- source_word: πάλιν
  choice: tena
  rationale: Neno hili linaonyesha kwamba sauti hiyo inamsemesha Yohana mara nyingine.
- source_word: λαλοῦσαν μετ’ ἐμοῦ καὶ λέγουσαν
  choice: ikasema nami tena
  rationale: “Kusema nami” ni Kiswahili cha asili kinachohifadhi wazo la μετά + hali ya umilikishi, huku vishirikishi viwili vikisawazishwa kwa sentensi inayosomeka vizuri.
- source_word: Ὕπαγε λάβε
  choice: Nenda ukachukue
  rationale: Vitenzi viwili vya amri vinahifadhiwa; muundo wa “nenda uka-” ni wa kawaida katika Kiswahili na unaonyesha kwenda kwa kusudi la kuchukua.
- source_word: βιβλίον
  choice: hati-kunjo
  rationale: Katika mazingira ya kihistoria na maono ya Ufunuo, neno hili linaashiria hati iliyokunjwa, si kitabu cha kurasa za kisasa. Umbo la neno katika aya hii si la udogo.
- source_word: ἠνεῳγμένον
  choice: iliyofunguliwa
  rationale: Hali timilifu ya kutendwa inaonyesha hati iliyokwisha kufunguliwa na inayobaki katika hali hiyo.
- source_word: ἐν τῇ χειρὶ
  choice: iliyo mkononi
  rationale: Huhifadhi mahali panapoelezwa na ἐν bila kuongeza wazi wazo la “kutoka mkononi,” ambalo linaeleweka kutokana na amri ya kuichukua.
- source_word: ἄγγελος
  choice: malaika
  rationale: Muktadha wa maono ya Ufunuo unaonyesha kiumbe wa mbinguni, si mjumbe wa kibinadamu.
- source_word: ἑστῶτος
  choice: aliyesimama
  rationale: Hueleza hali endelevu ya malaika kuwa amesimama.
- source_word: ἐπὶ τῆς θαλάσσης καὶ ἐπὶ τῆς γῆς
  choice: juu ya bahari na juu ya nchi kavu
  rationale: Kurudia “juu ya” kunafuata muundo wa Kigiriki na kuhifadhi picha dhahiri; “nchi kavu” huonyesha vizuri tofauti ya kimahali na bahari.
theological_decisions:
- issue: Maana ya γῆ katika picha ya kiapokaliptiki
  choice: nchi kavu
  alternative: dunia
  rationale: Picha ya karibu ni ya malaika aliyesimama juu ya bahari na sehemu yake kinyume, yaani nchi kavu. “Dunia” bado ni maana inayowezekana na imewekwa katika tanbihi bila kulazimisha dai la kikosmolojia.
- issue: Maana ya βιβλίον kwa kulinganisha na muktadha wa aya jirani
  choice: hati-kunjo
  alternative: hati-kunjo ndogo; kitabu
  rationale: Aya hii ina βιβλίον, si umbo la udogo βιβλαρίδιον linalotokea katika muktadha wa karibu. Kwa hiyo maandishi makuu hayajaingiza “ndogo,” lakini uwezekano huo wa kimuktadha umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Hati-kunjo” ni wazi kuliko “kitabu” kwa kitu cha kale kilichokunjwa. Muundo “Nenda ukachukue” ni wa kawaida na huhifadhi amri zote mbili. Alama zote za tanbihi zimewekwa katika maandishi makuu.
