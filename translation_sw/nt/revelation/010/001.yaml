id: REV.10.1
reference: Revelation 10:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ εἶδον ⸀ἄλλον ἄγγελον ἰσχυρὸν καταβαίνοντα ἐκ τοῦ οὐρανοῦ, περιβεβλημένον νεφέλην, καὶ ἡ ἶρις ἐπὶ ⸂τὴν κεφαλὴν⸃ αὐτοῦ, καὶ τὸ πρόσωπον αὐτοῦ ὡς ὁ ἥλιος, καὶ οἱ πόδες αὐτοῦ ὡς στῦλοι πυρός,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/001.yaml
  text: And I saw another mighty angel coming down from heaven[a], clothed with a cloud, with the rainbow over his head, and his face was like the sun[b], and his feet like pillars of fire.
translation:
  language: sw
  text: Nami nikamwona malaika mwingine hodari[a] akishuka kutoka mbinguni, akiwa amevaa wingu. Upinde wa mvua[b] ulikuwa juu ya kichwa chake, uso wake ulikuwa kama jua, na miguu yake ilikuwa kama nguzo za moto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “malaika mwingine mwenye nguvu.”
    reason: lexical_alternative
  - marker: b
    text: Neno la Kigiriki linaweza pia kumaanisha mng’ao unaozunguka kitu, lakini kwa kawaida humaanisha “upinde wa mvua,” na maana hiyo inafaa taswira za kitabu cha Ufunuo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλον ἄγγελον
  choice: malaika mwingine
  rationale: Ingawa ἄγγελος inaweza kumaanisha “malaika” au “mjumbe,” katika maono haya anayeshuka kutoka mbinguni anaeleweka kwa kawaida kuwa malaika.
- source_word: ἰσχυρὸν
  choice: hodari
  rationale: “Hodari” linaonyesha nguvu za pekee na linafaa katika maelezo ya kinabii bila kuwa nzito au isiyo ya kawaida.
- source_word: καταβαίνοντα ἐκ τοῦ οὐρανοῦ
  choice: akishuka kutoka mbinguni
  rationale: Linahifadhi mwendo wa kuelekea chini kutoka mbinguni kwa Kiswahili cha kawaida na chenye uhai.
- source_word: περιβεβλημένον νεφέλην
  choice: akiwa amevikwa wingu
  rationale: Linadumisha taswira ya wingu kama vazi linalomfunika, bila kuibadili kuwa maelezo ya kawaida tu ya kuzungukwa na wingu.
- source_word: ἡ ἶρις
  choice: upinde wa mvua
  rationale: Maana ya kawaida ya ἶρις ni upinde wa mvua, na taswira hiyo inapatana na matumizi yake mengine katika Ufunuo, ingawa neno linaweza kueleweka pia kuwa mng’ao unaozunguka kitu.
- source_word: ἐπὶ τὴν κεφαλὴν αὐτοῦ
  choice: juu ya kichwa chake
  rationale: Linawasilisha kwa kawaida nafasi ya upinde wa mvua juu ya kichwa chake.
- source_word: τὸ πρόσωπον αὐτοῦ ὡς ὁ ἥλιος
  choice: uso wake ulikuwa kama jua
  rationale: Kitenzi “ulikuwa” kinaongezwa kwa ulaini wa Kiswahili huku ulinganisho wa uso na jua ukihifadhiwa.
- source_word: οἱ πόδες αὐτοῦ
  choice: miguu yake
  rationale: Katika Kiswahili “miguu” ndilo neno la kawaida kwa sehemu za chini za mwili na linawasilisha taswira vizuri zaidi kuliko jaribio la kutaja nyayo pekee.
- source_word: στῦλοι πυρός
  choice: nguzo za moto
  rationale: Linahifadhi moja kwa moja taswira hai ya nguzo zilizofanyizwa au kuonekana kama moto.
theological_decisions:
- issue: Utambulisho wa malaika hodari
  choice: Kutafsiri bila kuegemea upande wowote kuwa “malaika mwingine hodari.”
  alternative: Kumtambulisha wazi kuwa kiumbe wa kimalaika aliyeumbwa au kuwa udhihirisho wa Masihi/Kristo.
  rationale: Maandishi ya Kigiriki yanamwita tu ἄλλον ἄγγελον ἰσχυρόν. Kwa kuwa utambulisho wake unabishaniwa, tafsiri haipaswi kutatua jambo ambalo mstari wenyewe huliacha wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi ya kifasihi. Marudio ya “ulikuwa/ilikuwa” yanasaidia uwazi wa sentensi ndefu, huku taswira za maono zikihifadhiwa. Alama za tanbihi [a] na [b] zimewekwa moja kwa moja baada ya maneno yanayohusika.
