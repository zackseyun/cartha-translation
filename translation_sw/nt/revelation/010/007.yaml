id: REV.10.7
reference: Revelation 10:7
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀλλ’ ἐν ταῖς ἡμέραις τῆς φωνῆς τοῦ ἑβδόμου ἀγγέλου, ὅταν μέλλῃ σαλπίζειν, καὶ ἐτελέσθη τὸ μυστήριον τοῦ θεοῦ, ὡς εὐηγγέλισεν τοὺς ⸂ἑαυτοῦ δούλους⸃ τοὺς προφήτας.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/007.yaml
  text: but in the days of the voice of the seventh angel[a], when he is about to sound the trumpet, then the mystery of God is fulfilled, just as he proclaimed the good news to his own servants, the prophets.
translation:
  language: sw
  text: Lakini katika siku za sauti ya malaika wa saba, atakapokuwa karibu kupiga tarumbeta, ndipo siri ya Mungu itakapotimizwa, kama alivyowatangazia watumwa wake mwenyewe[a], yaani manabii, habari njema.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watumishi wake mwenyewe.” Neno la Kigiriki linaweza kumaanisha “watumishi” au “watumwa”; hapa linasisitiza kuwa wao ni mali ya Mungu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Lakini
  rationale: Kiunganishi hiki kinaonyesha utofauti na kauli inayotangulia kuhusu kutokuwapo kwa kuchelewa tena.
- source_word: ἐν ταῖς ἡμέραις
  choice: katika siku
  rationale: Kauli hii inadumisha mtindo rasmi wa kinabii na bado inaeleweka katika Kiswahili cha kawaida.
- source_word: τῆς φωνῆς τοῦ ἑβδόμου ἀγγέλου
  choice: za sauti ya malaika wa saba
  rationale: Neno φωνή linaweza kumaanisha sauti; kulihifadhi hivyo huepuka kulifanya mapema kuwa tendo la kupiga tarumbeta.
- source_word: ὅταν μέλλῃ σαλπίζειν
  choice: wakati atakapokuwa karibu kupiga tarumbeta
  rationale: μέλλῃ pamoja na kitenzi-jina huonyesha tendo linalokaribia, na σαλπίζειν hapa ni kupiga tarumbeta.
- source_word: καὶ ἐτελέσθη
  choice: ndipo ... itakapotimizwa
  rationale: Ingawa umbo la Kigiriki ni wakati uliopita, katika kishazi cha wakati kinachoelekea mbele linaeleza utimilifu wenye hakika; Kiswahili hutumia wakati ujao kwa mfuatano huu kwa ufasaha.
- source_word: τὸ μυστήριον τοῦ θεοῦ
  choice: siri ya Mungu
  rationale: Katika muktadha huu μυστήριον ni mpango wa Mungu uliokuwa umefichika, si fumbo lisiloweza kueleweka; ‘siri’ ni neno la kawaida na lenye heshima.
- source_word: ὡς εὐηγγέλισεν
  choice: kama alivyowatangazia habari njema
  rationale: Tafsiri hii inadumisha maana ya εὐαγγελίζω ya kutangaza habari njema bila kuibana kuwa istilahi ya kidhehebu.
- source_word: τοὺς ἑαυτοῦ δούλους
  choice: watumwa wake mwenyewe
  rationale: δοῦλος inaweza kuwa mtumwa au mtumishi; pamoja na ἑαυτοῦ, hapa inasisitiza kuwa wao ni mali ya Mungu na wako chini ya mamlaka yake.
- source_word: τοὺς προφήτας
  choice: yaani manabii
  rationale: Kirai hiki kinawatambulisha watumwa waliotajwa; ‘yaani’ huweka uhusiano huo wazi na wa kawaida katika Kiswahili.
theological_decisions:
- issue: Maana ya δοῦλος kuhusu manabii wa Mungu
  choice: watumwa wake mwenyewe
  alternative: watumishi wake mwenyewe
  rationale: Uchaguzi wa ‘watumwa’ huhifadhi msisitizo wa kuwa mali ya Mungu unaotiwa nguvu na ἑαυτοῦ, huku tanbihi ikitoa ‘watumishi’ kama tafsiri nyingine halali na ya kawaida.
- issue: Nguvu ya ἐτελέσθη pamoja na μυστήριον katika kishazi kinachoelekea wakati ujao
  choice: itakapotimizwa
  alternative: ilikamilishwa / itakapokamilishwa
  rationale: ‘Itakapotimizwa’ huonyesha kutimia kwa kusudi la Mungu katika muktadha wa siku ambazo malaika wa saba atakuwa karibu kupiga tarumbeta, bila kuamua mfumo maalumu wa matukio ya mwisho.
- issue: Maana ya μυστήριον τοῦ θεοῦ
  choice: siri ya Mungu
  alternative: kusudi la Mungu lililofichwa
  rationale: ‘Siri’ huhifadhi istilahi ya kifungu na uwezekano wake mpana badala ya kuifafanua kabisa ndani ya maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kinabii ulio rasmi lakini unaoeleweka kwa wasomaji wa kawaida. Muundo ‘katika siku za sauti’ umehifadhiwa kwa sababu ni picha halisi ya Kigiriki, ingawa si usemi wa kawaida kabisa.
