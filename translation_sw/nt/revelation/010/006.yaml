id: REV.10.6
reference: Revelation 10:6
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ⸀ὤμοσεν τῷ ζῶντι εἰς τοὺς αἰῶνας τῶν αἰώνων, ὃς ἔκτισεν τὸν οὐρανὸν καὶ τὰ ἐν αὐτῷ καὶ τὴν γῆν καὶ τὰ ἐν αὐτῇ καὶ τὴν θάλασσαν καὶ τὰ ἐν αὐτῇ, ὅτι χρόνος οὐκέτι ἔσται·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/006.yaml
  text: and swore by the one who lives forever and ever[a], who created heaven and the things in it, and the earth and the things on it, and the sea and the things in it, that there will no longer be any delay.
translation:
  language: sw
  text: akaapa kwa yule anayeishi milele na milele, aliyeumba mbingu na vitu vilivyomo, dunia na vitu vilivyomo, na bahari na vitu vilivyomo, kwamba hakutakuwa tena na kukawia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri iliyo halisi zaidi, “wakati hautakuwapo tena.” Hapa neno la Kigiriki χρόνος linaeleweka katika muktadha kuwa “kukawia” au kipindi cha kusubiri kabla ya tendo la mwisho la Mungu.
    reason: alternative_reading
lexical_decisions:
- source_word: ὤμοσεν
  choice: akaapa
  rationale: Kitenzi hiki kinaeleza kufanya kiapo; “akaapa” ni tafsiri fupi, ya kawaida, na yenye uzito unaofaa mandhari hii.
- source_word: τῷ ζῶντι εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: kwa yule anayeishi milele na milele
  rationale: Hali ya udativo inaonyesha yule ambaye kiapo kinaapwa kwake, na msemo “milele na milele” unawakilisha muda usio na mwisho kwa Kiswahili cha kawaida.
- source_word: ἔκτισεν
  choice: aliyeumba
  rationale: Katika kauli hii kuhusu ulimwengu mzima, “kuumba” linaonyesha wazi tendo la Muumba.
- source_word: τὸν οὐρανὸν
  choice: mbingu
  rationale: Katika muundo wa uumbaji unaotaja mbingu, dunia, na bahari, “mbingu” ni neno la kawaida na la asili katika Kiswahili.
- source_word: τὰ ἐν αὐτῷ / τὰ ἐν αὐτῇ
  choice: vitu vilivyomo
  rationale: Tafsiri hii inahifadhi urudiaji wa muundo wa Kigiriki bila kuongeza neno “vyote,” ambalo halijaelezwa moja kwa moja.
- source_word: γῆν
  choice: dunia
  rationale: Katika utatu wa mbingu, dunia, na bahari, neno hili linamaanisha dunia, si eneo fulani la nchi.
- source_word: θάλασσαν
  choice: bahari
  rationale: “Bahari” ni kisawe cha moja kwa moja na kinahifadhi umoja wa nomino ya Kigiriki.
- source_word: ὅτι
  choice: kwamba
  rationale: Baada ya kitenzi cha kuapa, neno hili linaanzisha yaliyomo katika kiapo.
- source_word: χρόνος οὐκέτι ἔσται
  choice: hakutakuwa tena na kukawia
  rationale: Katika muktadha wa aya inayofuata, χρόνος inaeleweka kuwa muda wa kusubiri au kukawia kabla ya kutimizwa kwa kusudi la Mungu, si kukoma kwa wakati wenyewe.
theological_decisions:
- issue: Maana ya χρόνος katika yaliyomo ya kiapo
  choice: hakutakuwa tena na kukawia
  alternative: wakati hautakuwapo tena
  rationale: Muktadha wa karibu, hasa tangazo la kutimizwa kwa siri ya Mungu katika aya ya 7, unaunga mkono maana ya kwamba kipindi cha kusubiri kimefikia mwisho. Tanbihi inadumisha tafsiri iliyo halisi zaidi na hivyo kuhifadhi uwezekano wa kimaana bila kudai kwamba wakati wenyewe utakoma.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa mara tatu—mbingu, dunia, na bahari pamoja na vitu vilivyomo—umehifadhiwa kwa urudiaji wa makusudi. Alama ya tanbihi imewekwa baada ya kishazi kinachohusika nayo.
