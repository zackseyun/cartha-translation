id: REV.10.3
reference: Revelation 10:3
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἔκραξεν φωνῇ μεγάλῃ ὥσπερ λέων μυκᾶται. καὶ ὅτε ἔκραξεν, ἐλάλησαν αἱ ἑπτὰ βρονταὶ τὰς ἑαυτῶν φωνάς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/003.yaml
  text: And he cried out with a loud voice[a], just as a lion roars. And when he cried out, the seven thunders spoke with their own voices.
translation:
  language: sw
  text: Naye akapaza sauti kubwa kama simba angurumavyo. Naye alipopaza sauti, zile ngurumo saba zikanena kwa sauti zao wenyewe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔκραξεν
  choice: akapaza sauti
  rationale: Kitenzi κράζω kinaonyesha kilio au mwito wenye nguvu. ‘Akapaza sauti’ ni Kiswahili cha kawaida kinachohifadhi uzito wa tendo bila kudokeza huzuni pekee.
- source_word: φωνῇ μεγάλῃ
  choice: sauti kubwa
  rationale: Kirai hiki kinaeleza namna ya kupaza sauti na kinahifadhi nomino φωνή kwa tafsiri ya moja kwa moja na ya asili.
- source_word: ὥσπερ λέων μυκᾶται
  choice: kama simba angurumavyo
  rationale: ‘Kama’ linadumisha tashbihi, na ‘angurumavyo’ ndilo neno la kawaida kwa sauti kali ya simba huku hali ya sasa ya μυκᾶται ikihifadhiwa.
- source_word: ὅτε
  choice: alipopaza sauti
  rationale: Muundo wa ‘-lipo-’ unaonyesha wakati bila kuongeza wazo la sababu au kuchelewa.
- source_word: αἱ ἑπτὰ βρονταὶ
  choice: zile ngurumo saba
  rationale: ‘Zile’ linaonyesha kwamba ni vitu maalumu vya maono, na ‘ngurumo saba’ linahifadhi taswira ya chanzo.
- source_word: ἐλάλησαν
  choice: zikanena
  rationale: ‘Kunena’ linafaa kwa mtindo wenye hadhi na linahifadhi uhusishaji wa ngurumo na tendo la kusema.
- source_word: τὰς ἑαυτῶν φωνάς
  choice: kwa sauti zao wenyewe
  rationale: Tafsiri hii inahifadhi msisitizo wa kiwakilishi ἑαυτῶν na uhuishaji wa ngurumo, huku ikiwa ya kueleweka katika Kiswahili.
theological_decisions:
- issue: Uhuishaji wa zile ngurumo saba
  choice: Kudumisha kauli kwamba ngurumo ‘zikanena kwa sauti zao wenyewe’
  alternative: Ngurumo saba zikavuma au zikatoa ujumbe wao
  rationale: Kigiriki kinazipa ngurumo tendo la kunena na sauti zao wenyewe (ἐλάλησαν ... φωνάς). Taswira hiyo ya kinabii haipaswi kubadilishwa kuwa sauti ya kawaida wala kufafanuliwa kuwa ujumbe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Akapaza sauti’ ni ya asili kuliko tafsiri ngumu ya ‘alilia kwa sauti kubwa’; ‘zikanena’ hudumisha uhuishaji wa maandishi ya Kigiriki.
