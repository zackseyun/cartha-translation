id: REV.10.9
reference: Revelation 10:9
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ⸀ἀπῆλθα πρὸς τὸν ἄγγελον λέγων αὐτῷ δοῦναί μοι τὸ ⸀βιβλαρίδιον. καὶ λέγει μοι· Λάβε καὶ κατάφαγε αὐτό, καὶ πικρανεῖ σου τὴν κοιλίαν, ἀλλ’ ἐν τῷ στόματί σου ἔσται γλυκὺ ὡς μέλι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/009.yaml
  text: So I went to the angel[a], telling him to give me the little scroll. And he says to me, “Take and eat it, and it will make your stomach bitter[c][b], but in your mouth it will be sweet like honey.”
translation:
  language: sw
  text: Basi nikamwendea malaika, nikamwambia anipe lile gombo dogo[a]. Naye ananiambia[b], “Lichukue ukale lote. Litafanya tumbo lako liwe chungu, lakini kinywani mwako litakuwa tamu kama asali.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kile kitabu kidogo.” Neno la Kigiriki ni neno la udogo linaloweza kumaanisha gombo dogo au kitabu kidogo.
    reason: lexical_alternative
  - marker: b
    text: Au, “akaniambia.” Kigiriki kinatumia wakati uliopo wa kihistoria ili kuufanya usimulizi uwe hai zaidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆλθα πρὸς τὸν ἄγγελον
  choice: nikamwendea malaika
  rationale: Kitenzi hiki kinaonyesha Yohana akisogea alikokuwa malaika. ‘Nikamwendea’ ni Kiswahili cha kawaida kinachoonyesha mwendo kuelekea kwake bila kuongeza wazo la kuondoka kabisa.
- source_word: λέγων αὐτῷ δοῦναί μοι
  choice: nikamwambia anipe
  rationale: Muundo huu unaeleza maneno yaliyoambatana na tendo la kumwendea malaika. ‘Nikamwambia anipe’ ni wa asili na hauongezi dhana ya ombi la heshima ambayo haijaonyeshwa wazi katika Kigiriki.
- source_word: βιβλαρίδιον
  choice: gombo dogo
  rationale: Neno la Kigiriki ni la udogo na linaweza kumaanisha gombo dogo au kitabu kidogo. ‘Gombo dogo’ linaendeleza dhana ya kitu cha kukunjwa katika mazingira ya kale pamoja na maana ya udogo.
- source_word: λέγει μοι
  choice: ananiambia
  rationale: Wakati uliopo wa kihistoria umetunzwa ili kuendeleza uhai na ukaribu wa simulizi la Kigiriki. Tanbihi inatoa namna ya kawaida zaidi ya kusimulia kwa wakati uliopita.
- source_word: Λάβε καὶ κατάφαγε αὐτό
  choice: Lichukue ulile lote
  rationale: ‘Lichukue’ linarejelea gombo, na ‘ulile lote’ linaonyesha nguvu ya kitenzi ambatani κατάφαγε—kulila kabisa—bila kutumia lugha kali zaidi ya ‘kulimeza kwa pupa.’
- source_word: πικρανεῖ σου τὴν κοιλίαν
  choice: Litafanya tumbo lako liwe chungu
  rationale: Tafsiri hii inatunza picha halisi ya ulaji na hali ya uchungu ndani ya tumbo, bila kuibadili kuwa maelezo ya maumivu au tafsiri ya kiishara.
- source_word: γλυκὺ ὡς μέλι
  choice: tamu kama asali
  rationale: Hii ni tashbihi ya moja kwa moja, ya asili katika Kiswahili, inayohifadhi utofauti kati ya utamu mdomoni na uchungu tumboni.
theological_decisions:
- issue: Tendo la kiishara la kula gombo
  choice: Agizo halisi ‘Lichukue ulile lote’ limetunzwa bila kufafanua ishara yake ndani ya matini.
  alternative: Kulifafanua tendo hilo kama kuupokea au kuutia moyoni ujumbe wa Mungu.
  rationale: Aya yenyewe inatoa tendo la kinabii kwa picha halisi. Kulifasiri ndani ya tafsiri kungeongeza ufafanuzi ambao matini haisemi moja kwa moja na kungepunguza mvutano kati ya utamu na uchungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Gombo’ linafaa kwa kitu kilichokunjwa katika mazingira ya kale, huku tanbihi ikitoa ‘kitabu kidogo’ kwa wasomaji wanaofahamu zaidi istilahi hiyo. Wakati uliopo ‘ananiambia’ umetunzwa kwa makusudi ili kuakisi uhai wa simulizi la Kigiriki.
