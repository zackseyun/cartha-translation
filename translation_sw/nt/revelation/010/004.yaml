  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ὅτε ἐλάλησαν αἱ ἑπτὰ βρονταί, ἤμελλον γράφειν· καὶ ἤκουσα φωνὴν ἐκ τοῦ οὐρανοῦ λέγουσαν· Σφράγισον ἃ ἐλάλησαν αἱ ἑπτὰ βρονταί, καὶ μὴ αὐτὰ γράψῃς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/004.yaml
  text: And when the seven thunders spoke[a], I was about to write; and I heard a voice from heaven saying, “Seal up what the seven thunders spoke, and do not write them.”
translation:
  language: sw
  text: Na zile ngurumo saba ziliposema, nilikuwa karibu kuandika; nikasikia sauti kutoka mbinguni ikisema, “Yatie muhuri mambo yaliyosemwa na zile ngurumo saba, wala usiyaandike.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλάλησαν
  choice: ziliposema / yaliyosemwa
  rationale: Kitenzi ‘sema’ ni cha kawaida na cha sasa katika Kiswahili, huku kikihifadhi picha ya ngurumo saba kama watendaji wanaosema.
- source_word: αἱ ἑπτὰ βρονταί
  choice: zile ngurumo saba
  rationale: ‘Ngurumo’ huonyesha sauti ya radi na kudumisha taswira ya kiapokaliptiki ambamo ngurumo saba zinatajwa kana kwamba zinaweza kusema.
- source_word: ἤμελλον γράφειν
  choice: nilikuwa karibu kuandika
  rationale: Hii inaonyesha kwamba Yohana alikuwa anakaribia kuandika wakati alipozuiwa, kulingana na maana ya μέλλω pamoja na kitenzi-jina.
- source_word: φωνὴν ἐκ τοῦ οὐρανοῦ
  choice: sauti kutoka mbinguni
  rationale: Ni usemi wa kawaida unaohifadhi chanzo cha sauti bila kumtambulisha msemaji.
- source_word: Σφράγισον
  choice: Yatie muhuri
  rationale: Kauli hii ya amri inaonyesha kuyafunga au kuyahifadhi mambo hayo yasifunuliwe, bila kuongeza maelezo yasiyokuwamo katika maandishi.
- source_word: ἃ ἐλάλησαν αἱ ἑπτὰ βρονταί
  choice: mambo yaliyosemwa na zile ngurumo saba
  rationale: ‘Mambo’ huonyesha wazi kwamba kiwakilishi cha Kigiriki kinarejelea yaliyosemwa, na pia huruhusu upatanisho wa wingi katika amri inayofuata.
- source_word: μὴ αὐτὰ γράψῃς
  choice: wala usiyaandike
  rationale: Kiambishi ‘-ya-’ kinarejelea ‘mambo’ kwa wingi na hivyo kuhifadhi wingi wa αὐτά kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Utambulisho wa sauti iliyotoka mbinguni
  choice: sauti kutoka mbinguni
  alternative: sauti ya Mungu kutoka mbinguni
  rationale: Andiko linataja chanzo cha sauti lakini halimtambulishi wazi msemaji; tafsiri haiongezi utambulisho wa kitheolojia.
- issue: Maana ya kuyatia muhuri yaliyosemwa
  choice: Yatie muhuri mambo yaliyosemwa
  alternative: Yafiche mambo yaliyosemwa
  rationale: ‘Yatie muhuri’ huhifadhi sitiari ya Kigiriki na amri ya kutoyatangaza, badala ya kuibadili kuwa ufafanuzi pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Zile ngurumo saba’ huhifadhi urejeo mahsusi na uhuishaji wa taswira; ‘mambo ... usiyaandike’ huwasilisha wingi wa Kigiriki kwa njia ya asili bila kuhitaji tanbihi.
