id: REV.10.11
reference: Revelation 10:11
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ λέγουσίν μοι· Δεῖ σε πάλιν προφητεῦσαι ἐπὶ λαοῖς ⸀καὶ ἔθνεσιν καὶ γλώσσαις καὶ βασιλεῦσιν πολλοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/011.yaml
  text: And they say to me, “You must prophesy again about many peoples and nations and languages and kings.”
translation:
  language: sw
  text: Nao wakaniambia, “Ni lazima utoe unabii tena kuhusu watu, mataifa, lugha, na wafalme wengi.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγουσίν μοι
  choice: wakaniambia
  rationale: Kitenzi cha wingi kimetafsiriwa kwa wingi, huku wakati wa sasa wa kihistoria ukitolewa kwa wakati uliopita unaosikika kawaida katika masimulizi ya Kiswahili.
- source_word: Δεῖ σε
  choice: Ni lazima
  rationale: Huonyesha ulazima unaomhusu Yohana bila kuongeza chanzo au aina ya ulazima huo.
- source_word: πάλιν προφητεῦσαι
  choice: utoe unabii tena
  rationale: Huhifadhi maana ya kutangaza ujumbe wa kinabii na kurudiwa kunakoonyeshwa na πάλιν.
- source_word: ἐπὶ
  choice: kuhusu
  rationale: Katika muktadha huu inaweza kuonyesha mada au walengwa wa unabii; “kuhusu” huhifadhi usomaji wa mada bila kuufanya ujumbe kuwa lazima umeelekezwa moja kwa moja kwa vikundi hivyo.
- source_word: λαοῖς καὶ ἔθνεσιν καὶ γλώσσαις καὶ βασιλεῦσιν πολλοῖς
  choice: watu wengi, mataifa, lugha na wafalme
  rationale: “Wengi” limewekwa baada ya “watu” kwa Kiswahili cha kawaida lakini linaeleweka kuhusiana na orodha nzima, kama πολλοῖς ilivyo mwishoni mwa orodha ya Kigiriki.
theological_decisions:
- issue: Maana ya ἐπὶ pamoja na vikundi vinne
  choice: kuhusu
  alternative: kwa / mbele ya
  rationale: “Kuhusu” linaendana na uwezekano wa unabii unaohusu watu, mataifa, lugha na wafalme, huku kuepuka kudai bila shaka kwamba wote ndio hadhira ya moja kwa moja.
- issue: Mhusika wa kitenzi cha wingi λέγουσίν
  choice: wakaniambia
  alternative: akaniambia
  rationale: Nakala ya SBLGNT ina kitenzi cha wingi, kwa hiyo wingi umehifadhiwa ingawa waliolisema hawatajwi wazi katika mstari huu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo ni mfupi na wa kimantiki, bila kuongeza maelezo ya kimadhehebu.
