id: REV.18.23
reference: Revelation 18:23
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ φῶς λύχνου οὐ μὴ φάνῃ ἐν σοὶ ἔτι, καὶ φωνὴ νυμφίου καὶ νύμφης οὐ μὴ ἀκουσθῇ ἐν σοὶ ἔτι· ὅτι οἱ ἔμποροί σου ἦσαν οἱ μεγιστᾶνες τῆς γῆς, ὅτι ἐν τῇ φαρμακείᾳ σου ἐπλανήθησαν πάντα τὰ ἔθνη,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/023.yaml
  text: And the light of a lamp will never shine in you again[a], and the voice of bridegroom and bride will never be heard in you again; for your merchants were the great ones of the earth[b], because by your sorcery all the nations were led astray.
translation:
  language: sw
  text: Nuru ya taa haitang’aa ndani yako kamwe tena, wala sauti ya bwana arusi na bibi arusi haitasikika ndani yako kamwe tena; kwa maana wafanyabiashara wako walikuwa wakuu wa dunia[a], kwa maana kwa uchawi wako[b] mataifa yote yalipotoshwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watu wenye mamlaka duniani.” Neno la Kigiriki linamaanisha watu wenye hadhi au uwezo mkubwa.
    reason: lexical_alternative
  - marker: b
    text: Au “matendo yako ya kichawi” au “ulozi wako.” Neno la Kigiriki φαρμακεία linahusu uchawi au udanganyifu wa kichawi.
    reason: lexical_alternative
lexical_decisions:
- source_word: φῶς λύχνου
  choice: nuru ya taa
  rationale: Muundo huu wa kawaida unawakilisha kirai cha Kigiriki kwa uwazi; “taa” linafaa kwa λύχνος katika muktadha huu.
- source_word: οὐ μὴ φάνῃ ... ἔτι
  choice: haitang’aa ... kamwe tena
  rationale: “Kamwe tena” linaonyesha kwa Kiswahili cha kawaida msisitizo na ukomo wa οὐ μή pamoja na ἔτι.
- source_word: ἐν σοὶ
  choice: ndani yako
  rationale: Linaendeleza usemi wa moja kwa moja kwa Babeli iliyowasilishwa kama mtu, bila kugeuza maana kuwa maelezo.
- source_word: φωνὴ νυμφίου καὶ νύμφης
  choice: sauti ya bwana arusi na bibi arusi
  rationale: “Sauti” huhifadhi maana ya φωνή na mwangwi wa lugha ya hukumu ya kinabii; “bwana arusi na bibi arusi” ni istilahi zinazoeleweka na zilizozoeleka.
- source_word: οὐ μὴ ἀκουσθῇ ... ἔτι
  choice: haitasikika ... kamwe tena
  rationale: Kauli tendwa na ukataa wenye msisitizo vinahifadhiwa kwa Kiswahili cha asili.
- source_word: οἱ ἔμποροί σου
  choice: wafanyabiashara wako
  rationale: Neno hili linaonyesha watu wanaojishughulisha na biashara na linafaa katika taswira pana ya kibiashara ya sura hii.
- source_word: οἱ μεγιστᾶνες τῆς γῆς
  choice: wakuu wa dunia
  rationale: “Wakuu” linaacha wazi kama ukuu wao ulikuwa wa mamlaka, hadhi, au utajiri, kama lilivyo neno la Kigiriki.
- source_word: ἐν τῇ φαρμακείᾳ σου
  choice: kwa uchawi wako
  rationale: φαρμακεία hapa linahusu uchawi au matendo ya kichawi; tafsiri hii haipunguzi maana kuwa matumizi ya dawa ya kisasa.
- source_word: ἐπλανήθησαν
  choice: yalipotoshwa
  rationale: Kauli tendwa inaonyesha kwamba mataifa yaliongozwa mbali na kweli, huku ikihifadhi wazo la udanganyifu na upotoshaji.
- source_word: πάντα τὰ ἔθνη
  choice: mataifa yote
  rationale: Hii ndiyo tafsiri ya kawaida na ya kijumla ya peoples or nations katika muktadha wa Ufunuo.
theological_decisions:
- issue: Maana ya φαρμακεία katika hukumu ya kiapokaliptiki
  choice: uchawi
  alternative: matendo ya kichawi
  rationale: Neno linaweza kuhusisha ulozi, dawa au mchanganyiko uliotumiwa katika uganga, lakini hapa linasisitiza njia za kichawi na za udanganyifu za Babeli; “uchawi” huhifadhi upana huo bila kulihusisha kimakosa na dawa za kisasa.
- issue: Nguvu ya vishazi viwili vya οὐ μή
  choice: kamwe tena
  alternative: haitaendelea tena
  rationale: “Kamwe tena” linaonyesha hukumu ya mwisho na ukataa wenye msisitizo bila kufanya Kiswahili kuwa kigumu.
- issue: Uhusiano wa sababu unaoletwa na ὅτι mara mbili
  choice: kwa maana ... kwa maana
  alternative: kwa sababu ... na kwa uchawi wako
  rationale: 'Kurudia huku kunahifadhi muundo wa chanzo na mvutano wake: ukuu wa wafanyabiashara na upotoshaji wa mataifa kwa uchawi vyote vinatajwa kama sababu zinazohusiana na hukumu.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kifasihi lakini kinachoeleweka kwa urahisi. Marudio ya “kamwe tena” na “kwa maana” yamehifadhiwa kwa sababu yana uzito wa kimakusudi katika tangazo la hukumu. Alama za tanbihi zimepangwa kulingana na mahali maneno husika yanapotokea katika tafsiri.
