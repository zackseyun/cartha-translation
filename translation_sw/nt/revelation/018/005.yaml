translation:
  language: sw
  text: kwa maana dhambi zake zimerundikana mpaka mbinguni[a], na Mungu ameyakumbuka matendo yake maovu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “zimeunganishwa pamoja mpaka mbinguni.” Kitenzi cha Kigiriki humaanisha kihalisi “kushikamana” au “kuunganishwa”; hapa kinaonyesha dhambi zilizokusanyika kuwa rundo kubwa.
    reason: lexical_alternative
  - marker: b
    text: 'Neno “ameyakumbuka” hapa lina nguvu ya kimahakama katika muktadha: Mungu hakuyapuuza matendo yake maovu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: kwa maana
  rationale: Kishazi hiki kinatoa sababu ya agizo lililotangulia na kuhifadhi nguvu ya kisababishi kwa Kiswahili cha kawaida.
- source_word: ἐκολλήθησαν
  choice: zimerundikana
  rationale: Kitenzi kimsingi humaanisha kuunganishwa, kugandishwa, au kushikamana. Katika taswira ya dhambi kufika mbinguni, 'zimerundikana' huwasilisha kwa kawaida mkusanyiko uliofikia kimo kikubwa huku tanbihi ikihifadhi taswira halisi.
- source_word: αἱ ἁμαρτίαι
  choice: dhambi zake
  rationale: Hii ni tafsiri ya kawaida ya ἁμαρτίαι, na kiwakilishi huonyesha wazi kuwa ni dhambi za yule mwanamke/mji anayezungumziwa.
- source_word: ἄχρι τοῦ οὐρανοῦ
  choice: mpaka mbinguni
  rationale: Huhifadhi kikomo na taswira ya wima ya maneno ya Kigiriki kwa usemi wa asili wa Kiswahili.
- source_word: ἐμνημόνευσεν
  choice: ameyakumbuka
  rationale: Huhifadhi kitenzi 'kukumbuka' bila kukipanua kuwa 'amehukumu,' ingawa muktadha unaonyesha kuwa kukumbuka huku kuna matokeo ya hukumu.
- source_word: ὁ θεός
  choice: Mungu
  rationale: Tafsiri ya moja kwa moja na ya kawaida.
- source_word: τὰ ἀδικήματα
  choice: matendo yake maovu
  rationale: Huwasilisha vitendo vya uovu au makosa na kudumisha tofauti ya kimatamshi na 'dhambi' iliyotangulia, bila kuyabana kuwa uhalifu wa kisheria pekee.
theological_decisions:
- issue: Kutofautisha ἁμαρτίαι na ἀδικήματα katika mstari mmoja
  choice: Kutumia 'dhambi' na 'matendo maovu'
  alternative: Kutafsiri yote mawili kwa 'dhambi' au 'maovu'
  rationale: Maneno ya Kigiriki yanahusiana lakini si sawa. Maneno mawili ya Kiswahili yanahifadhi utajiri wa balagha bila kulazimisha tofauti kali ya kiteolojia.
- issue: Nguvu ya Mungu 'kukumbuka'
  choice: Kutafsiri ἐμνημόνευσεν kuwa 'ameyakumbuka'
  alternative: Ameleta hukumuni; ameyapatiliza
  rationale: Katika muktadha, kukumbuka kwa Mungu kuna nguvu ya kimahakama na huashiria hatua, lakini kitenzi chenyewe ni 'kukumbuka.' Tafsiri inadumisha mvutano huo badala ya kuufafanua kwa kuingiza adhabu moja kwa moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo unafuata kwa karibu sababu, taswira ya dhambi kufika mbinguni, na usemi wa kibiblia wa Mungu kukumbuka.
