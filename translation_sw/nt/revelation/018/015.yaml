  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οἱ ἔμποροι τούτων, οἱ πλουτήσαντες ἀπ’ αὐτῆς, ἀπὸ μακρόθεν στήσονται διὰ τὸν φόβον τοῦ βασανισμοῦ αὐτῆς κλαίοντες καὶ πενθοῦντες,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/015.yaml
  text: The merchants of these things[a], who became rich from her, will stand far off because of the fear of her torment, weeping and mourning,
translation:
  language: sw
  text: Wafanyabiashara wa bidhaa hizi[a], waliotajirika kupitia yeye, watasimama mbali kwa hofu ya mateso yake, wakilia na kuomboleza,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wa vitu hivi” au “wa mali hizi”; usemi huu unarejelea vitu vya anasa vilivyoorodheshwa katika muktadha unaozunguka.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔμποροι
  choice: wafanyabiashara
  rationale: Neno hili humaanisha watu wanaojishughulisha na biashara; “wafanyabiashara” ni la kawaida, wazi, na linafaa katika muktadha huu wa hukumu ya kiuchumi.
- source_word: τούτων
  choice: wa vitu hivi
  rationale: Kiwakilishi hiki cha umilikishi kinarejelea vitu vya anasa vilivyotajwa katika muktadha; tafsiri hii inabaki karibu na Kigiriki bila kufafanua kupita kiasi.
- source_word: πλουτήσαντες
  choice: ambao walitajirika
  rationale: Kitenzi kishirikishi kinaonyesha kwamba walipata utajiri hapo awali kupitia kwake; “walitajirika” ni ya asili na haiingizi maana ya kutendwa isiyo wazi katika Kigiriki.
- source_word: ἀπ’ αὐτῆς
  choice: kutokana naye
  rationale: ἀπό huonyesha chanzo; usemi huu unaonyesha kwamba huyo mwanamke, yaani Babeli katika muktadha, alikuwa chanzo cha utajiri wao.
- source_word: ἀπὸ μακρόθεν
  choice: mbali
  rationale: Nahau hii huonyesha umbali wa mahali; “mbali” ni fupi na ya kawaida, huku sababu inayofuata ikionyesha kuwa wanajiweka huko kwa hofu.
- source_word: στήσονται
  choice: watasimama
  rationale: Wakati ujao wa ἵστημι hapa humaanisha kusimama au kujiweka mahali; “watasimama” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: διὰ τὸν φόβον
  choice: kwa kuogopa
  rationale: διά pamoja na hali ya akusativi huonyesha sababu; “kwa kuogopa” ni Kiswahili cha asili kinachowasilisha sababu hiyo kwa uwazi.
- source_word: βασανισμοῦ
  choice: mateso
  rationale: Katika Ufunuo neno hili huonyesha mateso makali yanayohusiana na hukumu; “mateso” huhifadhi uzito wake bila kuingiza dhana finyu ya utesaji unaofanywa na wanadamu.
- source_word: κλαίοντες
  choice: wakilia
  rationale: Neno hili huonyesha kulia kwa huzuni, mara nyingi kwa sauti; “wakilia” ni wazi na linafaa katika sajili ya kifungu.
- source_word: πενθοῦντες
  choice: kuomboleza
  rationale: πενθέω hukazia maombolezo kwa sababu ya hasara; “kuomboleza” hudumisha tofauti yake na “kulia.”
theological_decisions:
- issue: Maana ya βασανισμός katika lugha ya hukumu ya kiapokaliptiki
  choice: Imetafsiriwa “mateso” bila kuipunguza kuwa huzuni ya kihisia au hasara ya kiuchumi pekee.
  alternative: adhabu; taabu
  rationale: Muktadha wa karibu unahusu hukumu ya Babeli, na Ufunuo hutumia βασανισμός kwa mateso makali ya hukumu. Tafsiri hii huhifadhi uzito wa hukumu bila kuongeza fundisho la kina ambalo mstari wenyewe haulitamki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa maandiko. Muundo wa sentensi na jozi ya “wakilia na kuomboleza” huhifadhi mwendo na utofautishaji wa Kigiriki. Alama ya tanbihi [a] imewekwa baada ya kirai husika.
