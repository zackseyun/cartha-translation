id: REV.18.2
reference: Revelation 18:2
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἔκραξεν ⸀ἐν ἰσχυρᾷ φωνῇ λέγων· Ἔπεσεν, ⸀ἔπεσεν Βαβυλὼν ἡ μεγάλη, καὶ ἐγένετο κατοικητήριον ⸀δαιμονίων καὶ φυλακὴ παντὸς πνεύματος ἀκαθάρτου καὶ φυλακὴ παντὸς ὀρνέου ἀκαθάρτου ⸂καὶ φυλακὴ παντὸς θηρίου ἀκαθάρτου⸃ καὶ μεμισημένου,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/002.yaml
  text: And he cried out with a mighty voice[a], saying, “Fallen, fallen is Babylon the great! She has become a dwelling place of demons, a prison of every unclean spirit, a prison of every unclean bird[b], and a prison of every unclean and hated beast.”
translation:
  language: sw
  text: Naye akapaza sauti kwa nguvu, akisema, “Umeanguka, umeanguka, Babeli mkuu! Umekuwa makao ya mashetani, gereza la kila roho chafu[a], gereza la kila ndege mchafu, na gereza la kila mnyama mchafu na anayechukiwa.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “maskani ya kila roho chafu ... kila ndege mchafu ... kila mnyama mchafu na anayechukiwa.” Neno la Kigiriki lililotafsiriwa “gereza” linaweza pia kumaanisha mahali panapokaliwa au panapotembelewa mara kwa mara.
    reason: lexical_alternative
  - marker: b
    text: Baadhi ya hati hazina maneno “na gereza la kila mnyama mchafu na anayechukiwa.”
    reason: textual_variant
lexical_decisions:
- source_word: ἔκραξεν ἐν ἰσχυρᾷ φωνῇ
  choice: akalia kwa sauti yenye nguvu
  rationale: Huwasilisha kilio cha sauti kubwa na uzito wa ἰσχυρᾷ kwa Kiswahili cha kawaida lakini chenye hadhi.
- source_word: Ἔπεσεν, ἔπεσεν
  choice: Umeanguka, umeanguka
  rationale: Urudiaji umehifadhiwa ili kudumisha mkazo na mahadhi ya tangazo la kinabii; wakati timilifu wa Kiswahili unaonyesha anguko lenye matokeo yanayoendelea.
- source_word: Βαβυλὼν ἡ μεγάλη
  choice: Babeli mkuu
  rationale: Huhifadhi jina la kiishara na sifa yake kama cheo, bila kuongeza neno lisilokuwamo kama ‘mji.’
- source_word: κατοικητήριον δαιμονίων
  choice: makao ya mashetani
  rationale: ‘Makao’ ni usemi wa asili kwa mahali pa kukaa, na ‘mashetani’ hutafsiri δαιμόνια moja kwa moja kuliko usemi mpana ‘roho waovu.’
- source_word: φυλακή
  choice: gereza
  rationale: Neno hili linaweza kumaanisha mahali pa kufungia au pa kuweka chini ya ulinzi. ‘Gereza’ linaweka wazi maana hiyo, huku maana nyingine inayowezekana ikitolewa katika tanbihi.
- source_word: παντὸς πνεύματος ἀκαθάρτου
  choice: kila roho chafu
  rationale: Huhifadhi lugha ya kibiblia ya uchafu na muundo wa jumla wa παντός.
- source_word: παντὸς ὀρνέου ἀκαθάρτου
  choice: kila ndege mchafu
  rationale: ὄρνεον ni ndege; tafsiri haiongezi wazo la ndege mla mizoga ambalo halijaelezwa moja kwa moja.
- source_word: παντὸς θηρίου ἀκαθάρτου καὶ μεμισημένου
  choice: kila mnyama mchafu na anayechukiwa
  rationale: ‘Mnyama’ hapa ni nomino ya kawaida, na ‘anayechukiwa’ huhifadhi hali ya kauli tendwa ya μεμισημένου badala ya kuibadili tu kuwa sifa ya tathmini.
theological_decisions:
- issue: Iwapo θηρίου ni cheo cha mpinzani wa kiapokaliptiki au nomino ya kawaida
  choice: nomino ya kawaida ‘mnyama’
  alternative: ‘Mnyama’ kama cheo maalumu
  rationale: Muundo wa ‘kila mnyama’ na kuorodheshwa pamoja na roho na ndege unaonyesha wanyama kwa ujumla, si yule Mnyama mmoja wa kiishara.
- issue: Maana ya φυλακή katika picha hii ya hukumu
  choice: gereza
  alternative: maskani au maficho
  rationale: ‘Gereza’ huhifadhi maana ya mahali pa kufungia au kuweka, lakini tanbihi inaacha wazi uwezekano wa mahali panapokaliwa au kutembelewa mara kwa mara.
- issue: Uhusiano wa ‘Babeli’ na viambishi vya nafsi
  choice: Umeanguka ... Umekuwa
  alternative: Imeanguka ... Imekuwa
  rationale: Viambishi vya ngeli ya kwanza vinaendeleza uhuishaji wa Babeli kama mhusika wa kike katika muktadha, bila kulazimisha kuongeza ‘mji’ katika maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mahadhi ya tangazo la kiapokaliptiki lakini kinachoeleweka kwa wasomaji wa kawaida. Urudiaji wa ‘gereza’ umehifadhiwa kwa sababu ni sehemu ya muundo wa msisitizo wa Kigiriki.
