id: REV.18.19
reference: Revelation 18:19
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἔβαλον χοῦν ἐπὶ τὰς κεφαλὰς αὐτῶν καὶ ⸀ἔκραξαν κλαίοντες καὶ ⸀πενθοῦντες λέγοντες· Οὐαὶ οὐαί, ἡ πόλις ἡ μεγάλη, ἐν ᾗ ἐπλούτησαν πάντες οἱ ἔχοντες τὰ πλοῖα ἐν τῇ θαλάσσῃ ἐκ τῆς τιμιότητος αὐτῆς, ὅτι μιᾷ ὥρᾳ ἠρημώθη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/019.yaml
  text: And they threw dust on their heads and cried out[a], weeping and mourning, saying, “Woe, woe, the great city, in which all who had ships on the sea became rich from her wealth[b], because in one hour she has been laid waste.”
translation:
  language: sw
  text: Nao wakatupa mavumbi juu ya vichwa vyao, wakapaza sauti huku wakilia na kuomboleza, wakisema, “Ole, ole[a], mji ule mkubwa, ambamo wote waliokuwa na meli baharini walitajirika kutokana na utajiri wake[b]! Kwa maana katika saa moja umefanywa ukiwa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Aa, aa!” Kihisishi cha Kigiriki kinaweza kuwa kilio cha maombolezo; “Ole, ole” kimetumiwa hapa ili kuhifadhi pia uzito wa kinabii wa hukumu.
    reason: lexical_alternative
  - marker: b
    text: Au, “kutokana na anasa zake za gharama kubwa” au “kutokana na fahari yake.” Neno la Kigiriki linaweza kumaanisha thamani kubwa, fahari, au utajiri.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔβαλον χοῦν ἐπὶ τὰς κεφαλὰς αὐτῶν
  choice: wakatupa mavumbi juu ya vichwa vyao
  rationale: Inahifadhi wazi tendo la kawaida la kuomboleza linaloelezwa katika Kigiriki, kwa Kiswahili cha kawaida na cha asili.
- source_word: ἔκραξαν
  choice: wakapaza sauti
  rationale: Inaonyesha kilio kikubwa cha hadharani bila kuchanganya kitenzi hiki na κλαίοντες, ambacho kimetafsiriwa ‘wakilia.’
- source_word: κλαίοντες καὶ πενθοῦντες
  choice: huku wakilia na kuomboleza
  rationale: Inadumisha tofauti kati ya kutoa machozi au kilio na hali pana ya maombolezo.
- source_word: Οὐαὶ οὐαί
  choice: Ole, ole
  rationale: ‘Ole’ ni kilio cha majonzi chenye pia uzito wa tangazo la hukumu; kurudiwa kwake kunahifadhi msisitizo wa matini.
- source_word: ἡ πόλις ἡ μεγάλη
  choice: mji ule mkubwa
  rationale: Muundo huu ni wa asili katika Kiswahili na unadumisha urejeleaji maalumu wa mji unaolalamikiwa.
- source_word: ἐν ᾗ
  choice: ambamo
  rationale: Inafuata maana ya msingi ya mahali, ‘ndani ya ambao,’ bila kuibadili kimya kuwa uhusiano wa chombo au njia.
- source_word: ἐπλούτησαν
  choice: walitajirika
  rationale: Ni kitenzi cha moja kwa moja na cha kawaida kinachoonyesha kwamba walipata kuwa matajiri.
- source_word: οἱ ἔχοντες τὰ πλοῖα ἐν τῇ θαλάσσῃ
  choice: wote waliokuwa na meli baharini
  rationale: Inabaki karibu na Kigiriki bila kulazimisha kwamba ἔχοντες humaanisha umiliki wa kisheria pekee.
- source_word: ἐκ τῆς τιμιότητος αὐτῆς
  choice: kutokana na utajiri wake
  rationale: Katika muktadha wa biashara ya baharini, ‘utajiri’ huwasilisha kwa uwazi thamani na gharama kubwa zinazowawezesha wenye meli kutajirika, huku tanbihi ikihifadhi maana nyingine zinazowezekana.
- source_word: ὅτι μιᾷ ὥρᾳ
  choice: Kwa maana katika saa moja
  rationale: Inaonyesha sababu ya maombolezo na kuhifadhi msisitizo wa ghafla wa ‘saa moja.’
- source_word: ἠρημώθη
  choice: umeachwa ukiwa
  rationale: Inahifadhi hali ya ukiwa inayosababishwa na tendo la uharibifu pamoja na sauti ya kutendwa ya kitenzi cha Kigiriki.
theological_decisions:
- issue: Nguvu ya kilio Οὐαὶ οὐαί katika muktadha wa maombolezo na hukumu ya kiapokaliptiki
  choice: Ole, ole
  alternative: Lo! Lo! / Aa, ole!
  rationale: ‘Ole’ hubeba kwa pamoja majonzi na uzito wa hukumu ya kinabii, bila kupunguza mstari kuwa huzuni pekee wala kuongeza fundisho lisilotajwa.
- issue: Uhusiano unaoonyeshwa na ἐν ᾗ kati ya mji na waliotajirika
  choice: ambamo
  alternative: ambao kupitia kwake
  rationale: ‘Ambamo’ huhifadhi maana ya mahali ya ἐν ᾗ na fumbo la jinsi shughuli za mji zilivyowatajirisha, badala ya kuamua moja kwa moja kwamba mji ni chombo pekee cha utajiri wao.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mpangilio wa vitenzi na ‘huku’ hufanya sentensi ndefu isomeke kwa urahisi, huku ‘Ole, ole’ na ‘umeachwa ukiwa’ zikidumisha uzito wa lugha ya kiunabii.
