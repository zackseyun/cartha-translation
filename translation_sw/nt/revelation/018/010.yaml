id: REV.18.10
reference: Revelation 18:10
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀπὸ μακρόθεν ἑστηκότες διὰ τὸν φόβον τοῦ βασανισμοῦ αὐτῆς λέγοντες· Οὐαὶ οὐαί, ἡ πόλις ἡ μεγάλη, Βαβυλὼν ἡ πόλις ἡ ἰσχυρά, ὅτι μιᾷ ὥρᾳ ἦλθεν ἡ κρίσις σου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/010.yaml
  text: standing far off because of the fear of her torment[a], saying, ‘Woe, woe, the great city, Babylon[b], the strong city! For in one hour your judgment has come.’
translation:
  language: sw
  text: Wakiwa wamesimama mbali kwa sababu ya hofu ya mateso yake, wakisema, “Ole, ole,[a] mji mkubwa, Babeli, mji wenye nguvu![b] Kwa maana katika saa moja hukumu yako imekuja.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Aa, aa.” Neno la Kigiriki linaweza kuonyesha maombolezo pamoja na tangazo la maangamizi; “Ole, ole” huhifadhi nguvu ya kinabii na ya maono.
    reason: lexical_alternative
  - marker: b
    text: Au, “mji wenye uweza” au “mji imara.” Kivumishi cha Kigiriki kinaweza kumaanisha nguvu, uwezo, au uweza.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ μακρόθεν ἑστηκότες
  choice: Wakiwa wamesimama mbali
  rationale: Huwasilisha hali na mahali pa wahusika kwa Kiswahili cha kawaida, huku hali timilifu ya kitenzi ikieleweka kama mkao unaoendelea.
- source_word: διὰ τὸν φόβον τοῦ βασανισμοῦ αὐτῆς
  choice: kwa kuogopa mateso yake
  rationale: διά pamoja na hali ya kushutumiwa huonyesha sababu; usemi huu ni wa asili katika Kiswahili na βασανισμός hapa ni mateso makali.
- source_word: λέγοντες
  choice: wakisema
  rationale: Kishirikishi hiki kinaunganisha kitendo cha kusema na kusimama kwa wahusika wale wale.
- source_word: Οὐαὶ οὐαί
  choice: Ole, ole
  rationale: “Ole” huhifadhi kwa pamoja kilio cha huzuni na tangazo la maangamizi katika muktadha wa kinabii na wa maono.
- source_word: ἡ πόλις ἡ μεγάλη
  choice: mji mkuu
  rationale: μέγας hapa hueleza ukubwa au ukuu wa mji; “mji mkuu” ni usemi wa asili, na muktadha huonyesha kuwa maana si lazima iwe mji wa makao ya serikali.
- source_word: Βαβυλὼν
  choice: Babeli
  rationale: Hili ndilo umbo la kawaida la jina la kibiblia Babylon katika Kiswahili.
- source_word: ἡ πόλις ἡ ἰσχυρά
  choice: mji wenye nguvu
  rationale: ἰσχυρός huonyesha nguvu, uwezo, au uweza; tafsiri hii ni wazi na haiongezi aina maalumu ya nguvu.
- source_word: ὅτι μιᾷ ὥρᾳ
  choice: Kwa maana katika saa moja
  rationale: ὅτι inaleta sababu ya kilio, na μιᾷ ὥρᾳ husisitiza jinsi hukumu ilivyokuja kwa ghafula.
- source_word: ἦλθεν ἡ κρίσις σου
  choice: hukumu yako imekuja
  rationale: Hali timilifu ya Kiswahili huonyesha kuwasili kwa hukumu kama tukio lililotimia lenye athari ya sasa, bila kubadili maana ya aoristi ya Kigiriki.
theological_decisions:
- issue: Maana ya kilio Οὐαὶ
  choice: Ole, ole
  alternative: Aa, aa; Lo, lo
  rationale: “Ole” huhifadhi mvutano kati ya maombolezo na tangazo la hukumu bila kuifanya kauli iwe huzuni tupu.
- issue: Wakati na hali ya ἦλθεν
  choice: imekuja
  alternative: ilikuja
  rationale: Katika usemi wa moja kwa moja kuhusu hukumu iliyowasili, “imekuja” huonyesha tukio lililotimia na umuhimu wake wa sasa; huu ni uamuzi wa lugha, si ufafanuzi wa mafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kifasihi. Muundo wa kilio cha kinabii umehifadhiwa, huku sentensi ikibaki wazi na rahisi kusomeka.
