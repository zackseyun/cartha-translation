id: REV.18.21
reference: Revelation 18:21
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ ἦρεν εἷς ἄγγελος ἰσχυρὸς λίθον ὡς ⸀μύλινον μέγαν, καὶ ἔβαλεν εἰς τὴν θάλασσαν λέγων· Οὕτως ὁρμήματι βληθήσεται Βαβυλὼν ἡ μεγάλη πόλις, καὶ οὐ μὴ εὑρεθῇ ἔτι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/021.yaml
  text: And one mighty angel lifted up a stone like a great millstone and threw it into the sea[a], saying, “So will Babylon the great city be thrown down with violence, and it will never be found again.”
translation:
  language: sw
  text: Kisha malaika mmoja mwenye nguvu akainua jiwe kama jiwe kubwa la kusagia, akalitupa baharini, akisema, “Kwa namna hiyo Babiloni, mji ule mkubwa, utatupwa kwa nguvu[a], wala hautapatikana tena kamwe.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa msukumo,” “kwa ghafula,” au “kwa nguvu nyingi.” Neno la Kigiriki linaonyesha mwendo wa ghafula wenye nguvu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦρεν
  choice: akainua
  rationale: Kitenzi hiki kinaonyesha malaika akilinyanyua jiwe kwa kusudi la kulitupa; ‘akainua’ ni cha kawaida na kinahifadhi tendo la kimwili.
- source_word: εἷς ἄγγελος ἰσχυρὸς
  choice: malaika mmoja mwenye nguvu
  rationale: ‘Mmoja’ linahifadhi εἷς, na ‘mwenye nguvu’ ni Kiswahili cha sasa kinachoeleweka vizuri bila kupunguza hadhi ya mtindo wa kinabii.
- source_word: λίθον ὡς μύλινον μέγαν
  choice: jiwe kama jiwe kubwa la kusagia
  rationale: ‘Kama’ linahifadhi ulinganisho wa ὡς badala ya kudai kwamba lilikuwa jiwe la kusagia lenyewe; ‘jiwe kubwa la kusagia’ linaonyesha uzito na ukubwa wa taswira.
- source_word: ἔβαλεν εἰς τὴν θάλασσαν
  choice: akalitupa baharini
  rationale: ‘Akalitupa’ linawasilisha tendo lenye nguvu la βάλλω kwa Kiswahili cha kawaida, na ‘baharini’ ni uwasilishaji wa asili wa εἰς τὴν θάλασσαν.
- source_word: Οὕτως
  choice: Hivi ndivyo
  rationale: Maneno haya yanaunganisha tendo la mfano na hukumu inayotangazwa kwa namna ya asili katika Kiswahili.
- source_word: ὁρμήματι
  choice: kwa kishindo
  rationale: Katika muktadha wa kuanguka kwa ghafla na kwa nguvu, ‘kwa kishindo’ linafikisha mwendo mkali na athari ya kuangushwa, huku tanbihi ikihifadhi uwezekano mwingine wa kimaana.
- source_word: βληθήσεται
  choice: utakavyotupwa chini
  rationale: Kauli tendwa ya wakati ujao inahifadhiwa, na ‘chini’ linaonyesha mwelekeo wa kuangushwa na kuharibiwa unaodokezwa na muktadha huku likirudia taswira ya kutupwa.
- source_word: Βαβυλὼν ἡ μεγάλη πόλις
  choice: Babiloni, ule mji mkubwa
  rationale: Muundo huu unahifadhi jina na maelezo yake ya kiambatisho, huku ‘ule’ likifanya sentensi isomeke kwa kawaida katika Kiswahili.
- source_word: οὐ μὴ εὑρεθῇ ἔτι
  choice: wala hautapatikana tena kamwe
  rationale: ‘Tena kamwe’ linaonyesha mkazo mkubwa wa οὐ μή pamoja na ἔτι na kuwasilisha ukomo wa hukumu bila kudhoofisha msisitizo.
theological_decisions:
- issue: Asili ya Babiloni na taswira ya kuangamizwa kwake
  choice: Hukumu imewasilishwa kuwa ya ghafla, yenye nguvu, na ya mwisho bila kuamua ikiwa Babiloni ni mji halisi, ishara, au vyote viwili.
  alternative: Kuitambulisha Babiloni moja kwa moja kuwa mji wa kihistoria pekee au mfumo wa ulimwengu unaompinga Mungu pekee.
  rationale: Aya yenyewe inatoa tendo la kiishara na tangazo la kuanguka kabisa. Tafsiri inapaswa kuhifadhi taswira na mvutano huo bila kuingiza mpangilio maalumu wa nyakati za mwisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa simulizi umetumia ‘Kisha ... aka-’ kwa mtiririko wa kawaida, huku lugha ya hukumu ikibaki nzito na wazi.
