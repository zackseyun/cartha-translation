  text: ὅτι μιᾷ ὥρᾳ ἠρημώθη ὁ τοσοῦτος πλοῦτος. Καὶ πᾶς κυβερνήτης καὶ πᾶς ὁ ἐπὶ τόπον πλέων, καὶ ναῦται καὶ ὅσοι τὴν θάλασσαν ἐργάζονται, ἀπὸ μακρόθεν ἔστησαν
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/017.yaml
  text: for in one hour such great wealth has been laid waste. And every shipmaster, and everyone sailing to a place, and sailors, and as many as work the sea, stood far off
translation:
  language: sw
  text: Kwa maana kwa saa moja, utajiri mkubwa namna hii umeharibiwa. Na kila nahodha, kila anayesafiri kwa meli kwenda mahali[a], mabaharia, na wote wanaofanya kazi baharini, walisimama kwa mbali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kila anayesafiri kwa meli popote,” au “kila anayesafiri kwa meli kuelekea bandarini.” Usemi wa Kigiriki unaweza kumaanisha kwa upana watu wanaosafiri baharini kuelekea sehemu mbalimbali.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Kwa maana
  rationale: Inaendeleza maelezo au sababu ya kilio kilicho katika muktadha unaotangulia.
- source_word: μιᾷ ὥρᾳ
  choice: kwa saa moja tu
  rationale: Huhifadhi wazo la muda mmoja mfupi na kusisitiza ghafla ya maangamizi bila kudai kwamba muda huo ni wa mfano au halisi.
- source_word: ἠρημώθη
  choice: umeharibiwa kabisa
  rationale: Kauli hii ya kutendwa inaonyesha kuachwa ukiwa au kuangamizwa; Kiswahili hiki ni cha kawaida na huhifadhi uzito wa uharibifu.
- source_word: ὁ τοσοῦτος πλοῦτος
  choice: utajiri mkubwa namna hii
  rationale: Huwasilisha nguvu ya τοσοῦτος, yaani ukubwa wa ajabu wa utajiri unaoliliwa.
- source_word: πᾶς κυβερνήτης
  choice: kila nahodha
  rationale: Nahodha ni neno la kawaida la Kiswahili kwa mwenye kuongoza au kusimamia chombo cha baharini.
- source_word: πᾶς ὁ ἐπὶ τόπον πλέων
  choice: kila anayesafiri kwa meli kwenda mahali fulani
  rationale: Hubaki karibu na muundo wa Kigiriki na kuonyesha safari ya baharini yenye mahali pa kufikiwa bila kuifanya kundi hili kuwa abiria au wafanyabiashara pekee.
- source_word: ναῦται
  choice: mabaharia
  rationale: Ni neno la sasa na linaloeleweka kwa wafanyakazi wa melini.
- source_word: ὅσοι τὴν θάλασσαν ἐργάζονται
  choice: wote wanaofanya kazi baharini
  rationale: Huhifadhi upana wa kundi hili kuliko mabaharia pekee, bila kuongeza kwamba lazima wapate riziki yao yote kutoka baharini.
- source_word: ἀπὸ μακρόθεν ἔστησαν
  choice: wakasimama mbali
  rationale: Hutoa kwa Kiswahili cha kawaida tendo la kusimama wakiwa katika umbali.
theological_decisions:
- issue: Upeo wa makundi ya watu wa baharini katika kilio juu ya Babeli
  choice: 'Makundi yameachwa yakiwa tofauti: manahodha, wasafiri wa baharini, mabaharia, na wote wanaofanya kazi baharini.'
  alternative: Kuyajumlisha yote kuwa ‘watu wote wa baharini,’ au kulifanya kundi la pili kuwa abiria au wafanyabiashara pekee.
  rationale: Kigiriki kinaorodhesha makundi kadhaa yanayounganishwa lakini yasiyofananishwa. Kuyatofautisha huhifadhi picha ya athari pana za kuanguka kwa Babeli bila kuingiza ufafanuzi wa kidhehebu au wa kiuchumi usiotajwa wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Neno “tu” linasisitiza ufupi wa muda kwa njia ya kawaida; orodha imehifadhiwa bila kuifanya kuwa nzito isivyo lazima. Alama ya tanbihi [a] imewekwa baada ya kirai husika.
