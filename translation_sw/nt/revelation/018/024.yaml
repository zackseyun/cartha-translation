id: REV.18.24
reference: Revelation 18:24
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἐν αὐτῇ ⸀αἷμα προφητῶν καὶ ἁγίων εὑρέθη καὶ πάντων τῶν ἐσφαγμένων ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/024.yaml
  text: And in her was found the blood of prophets and saints[c][b][a], and of all who have been slaughtered on the earth.
translation:
  language: sw
  text: Ndani yake[c] ilipatikana damu ya manabii na ya watakatifu[a], na damu ya wote waliochinjwa[b] duniani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watu watakatifu” au “watu watakatifu wa Mungu.”
    reason: lexical_alternative
  - marker: b
    text: Au “waliouawa.” Kitenzi cha Kiyunani kina nguvu kuliko neno la kawaida la kuua na kinaweza kumaanisha kuchinjwa.
    reason: lexical_alternative
  - marker: c
    text: “Yake” inamrejelea Babeli, anayeonyeshwa kama mwanamke katika maono yanayozunguka kifungu hiki.
    reason: cross_reference
lexical_decisions:
- source_word: ἐν αὐτῇ
  choice: ndani yake
  rationale: Kiwakilishi cha Kiyunani ni cha kike na kinamrejelea Babeli, anayeonyeshwa kama mwanamke na mji katika maono. Kiswahili hakitofautishi jinsia katika “yake,” kwa hiyo tanbihi inaweka wazi rejeleo hilo bila kulazimisha ufafanuzi ndani ya sentensi.
- source_word: αἷμα
  choice: damu
  rationale: Hii ndiyo maana ya moja kwa moja na ya kawaida, nayo inadumisha pia wazo la hatia ya kumwaga damu katika muktadha.
- source_word: προφητῶν
  choice: manabii
  rationale: Ni tafsiri ya kawaida na ya wazi ya neno hili katika muktadha wa Ufunuo.
- source_word: ἁγίων
  choice: watakatifu
  rationale: Katika Ufunuo neno hili kwa kawaida linamaanisha watu waliowekwa wakfu kwa Mungu. “Watakatifu” ni neno fupi, la kawaida katika Kiswahili cha Biblia, huku tanbihi ikionyesha maana mbadala iliyo wazi zaidi.
- source_word: εὑρέθη
  choice: ilipatikana
  rationale: Inadumisha hali ya kutendwa ya kitenzi na wazo la kufunuliwa au kugunduliwa kwa ushahidi.
- source_word: πάντων τῶν ἐσφαγμένων
  choice: wote waliochinjwa
  rationale: Kitenzi σφάζω ni chenye nguvu kuliko kusema tu “waliouawa”; “waliochinjwa” kinahifadhi picha ya mauaji ya kikatili iliyo katika kifungu.
- source_word: ἐπὶ τῆς γῆς
  choice: duniani
  rationale: Katika muktadha wa kiapokaliptiki wa Ufunuo, γῆ hapa lina upeo mpana wa dunia, si eneo maalumu la nchi.
theological_decisions:
- issue: Rejeleo na upeo wa hatia ya Babeli
  choice: Sentensi inamhusisha Babeli na damu ya manabii, watakatifu, na wote waliochinjwa duniani, kwa lugha pana ya hukumu ya kiapokaliptiki.
  alternative: Kauli ya mwisho inaweza kueleweka kuwa taswira ya jumla inayomfanya Babeli awakilishe mifumo yote yenye hatia ya umwagaji damu, au inaweza kuchukuliwa kwa upeo wa moja kwa moja zaidi ndani ya ishara za maono.
  rationale: Maandishi ya Kiyunani yanaweka shtaka pana bila kueleza kikamilifu jinsi ishara hiyo inavyolingana na historia. Tafsiri haipunguzi upeo wala kutatua mvutano huo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo “damu ya … na damu ya …” unarudia nomino kwa uwazi na unasawazisha vipashio viwili vya shtaka bila kubadili maana ya Kiyunani.
