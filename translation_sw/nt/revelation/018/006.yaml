base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/006.yaml
  text: Pay her back as she herself has paid back[a], and repay her double according to her works; in the cup that she mixed[b], mix a double portion for her.
translation:
  language: sw
  text: Mlipeni kama yeye mwenyewe alivyolipa, na mlipeni maradufu[a] kwa kadiri ya matendo yake; katika kikombe alichoandaa kwa kuchanganya[b], mchanganyieni maradufu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “fanyeni maradufu yaliyo maradufu kwa ajili yake”; usemi wa Kigiriki umebanwa na una msisitizo mkubwa, na unaweza kuonyesha malipo yaliyozidishwa.
    reason: lexical_alternative
  - marker: b
    text: Yaani, kikombe alichoandaa kwa kuchanganya; huenda taswira hii inarejelea kinywaji cha hukumu kilichoandaliwa.
    reason: cultural_note
lexical_decisions:
- source_word: ἀπόδοτε αὐτῇ
  choice: Mlipeni
  rationale: Kitenzi cha amri kinaonyesha kumrudishia malipo ya matendo yake; “mlipeni” ni cha asili katika Kiswahili na kinahifadhi maana ya kulipiza.
- source_word: ὡς καὶ αὐτὴ ἀπέδωκεν
  choice: kama yeye mwenyewe alivyolipa
  rationale: “Yeye mwenyewe” linaakisi msisitizo wa αὐτή, na “alivyolipa” linahifadhi ulinganifu wa kitenzi kilekile katika Kigiriki.
- source_word: διπλώσατε τὰ διπλᾶ
  choice: mlipeni mara mbili
  rationale: Usemi wa Kigiriki umebanwa na una nguvu ya balagha. Tafsiri hii inaeleweka kwa urahisi huku ikihifadhi wazo la malipo yaliyoongezwa maradufu.
- source_word: κατὰ τὰ ἔργα αὐτῆς
  choice: kulingana na matendo yake
  rationale: “Matendo” ni neno la kawaida na lenye hadhi kwa ἔργα, nalo linadumisha sauti ya hukumu inayolingana na aliyoyafanya.
- source_word: ἐν τῷ ποτηρίῳ ᾧ ἐκέρασεν
  choice: katika kikombe alichokichanganya
  rationale: “Kikombe” kinahifadhi taswira ya kiishara, na “alichokichanganya” linaonyesha kitendo cha kuandaa kinywaji kwa kukichanganya.
- source_word: κεράσατε αὐτῇ διπλοῦν
  choice: mchanganyieni sehemu maradufu
  rationale: Muundo huu unarudia kitenzi cha kuchanganya na kueleza διπλοῦν kwa Kiswahili cha asili kama kiasi au sehemu iliyoongezwa maradufu.
theological_decisions:
- issue: Asili ya amri ya malipo maradufu
  choice: Kuhifadhi taswira ya malipo ya hukumu yaliyo maradufu bila kuifanya kanuni halisi ya kihesabu
  alternative: Kutafsiri “mara mbili” kama adhabu yenye kiwango halisi cha kihesabu, au kuondoa taswira hiyo kwa kusema tu kwamba haki itatendeka
  rationale: Lugha ya hukumu ya kiapokaliptiki inaweza kuonyesha malipo makali na yanayolingana na matendo. Tafsiri haipunguzi ukali wala kuamua kama maradufu ni kiasi halisi au msisitizo wa balagha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Marudio ya “lipa” na “changanya” yamehifadhiwa ili kuakisi ulinganifu wa maneno katika Kigiriki; lugha ya hukumu haijalainishwa.
