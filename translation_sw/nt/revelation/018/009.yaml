id: REV.18.9
reference: Revelation 18:9
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ κλαύσουσιν καὶ κόψονται ἐπ’ αὐτὴν οἱ βασιλεῖς τῆς γῆς οἱ μετ’ αὐτῆς πορνεύσαντες καὶ στρηνιάσαντες, ὅταν βλέπωσιν τὸν καπνὸν τῆς πυρώσεως αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/009.yaml
  text: And the kings of the earth who committed sexual immorality and lived in luxury with her will weep and mourn over her when they see the smoke of her burning[b][a],
translation:
  language: sw
  text: Nao wafalme wa dunia, waliofanya uasherati na kuishi kwa anasa pamoja naye[b], watalia na kuomboleza kwa ajili yake[a] watakapouona moshi wa kuungua kwake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watajipiga kwa huzuni”; kitenzi cha Kigiriki kinaonyesha maombolezo ya wazi.
    reason: lexical_alternative
  - marker: b
    text: Uasherati huo pamoja naye huenda ni picha ya ushirika wa kifisadi na wa kuabudu sanamu unaotajwa mara kwa mara katika Ufunuo, huku lugha ya kingono ikidumishwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: κλαύσουσιν
  choice: watalia
  rationale: Huonyesha kilio cha huzuni kinachosikika; “watalia” ni Kiswahili cha kawaida na chenye nguvu inayofaa.
- source_word: κόψονται
  choice: wataomboleza
  rationale: Katika muktadha huu kitenzi kinaeleza maombolezo ya wazi, si lazima kitendo halisi cha kujikata.
- source_word: ἐπ’ αὐτὴν
  choice: kwa ajili yake
  rationale: Pamoja na vitenzi vya kuomboleza, kirai hiki humtaja yule anayeliliwa; usemi huu ni wa asili katika Kiswahili.
- source_word: οἱ βασιλεῖς τῆς γῆς
  choice: wafalme wa dunia
  rationale: Ni usemi wa kiapokaliptiki unaowataja watawala wa ulimwengu, si watawala wa eneo moja tu.
- source_word: πορνεύσαντες
  choice: waliofanya uasherati
  rationale: Huhifadhi picha yenye maana ya kingono ambayo katika Ufunuo pia inaweza kuashiria ushirika wa kifisadi na wa kuabudu sanamu.
- source_word: στρηνιάσαντες
  choice: kuishi kwa anasa
  rationale: Huwasilisha maisha ya kujifurahisha kupita kiasi na fahari yanayokosolewa katika muktadha.
- source_word: μετ’ αὐτῆς
  choice: pamoja naye
  rationale: Kirai hiki cha ushirika kinaeleweka kwa kawaida kuwa kinahusiana na vitendo vyote viwili vilivyoratibiwa.
- source_word: ὅταν βλέπωσιν
  choice: watakapouona
  rationale: Hutoa tukio la wakati ujao linalotarajiwa katika unabii; umbo hili ni la kawaida na fasaha.
- source_word: τὸν καπνὸν
  choice: moshi
  rationale: Ni kisawe cha moja kwa moja na cha kawaida.
- source_word: τῆς πυρώσεως αὐτῆς
  choice: wa kuungua kwake
  rationale: Huhifadhi wazo la kuteketezwa kwa moto bila kuongeza maelezo ambayo hayapo wazi katika mstari huu.
theological_decisions:
- issue: Maana ya picha ya uasherati wa Babeli
  choice: Kudumisha lugha ya uasherati katika maandishi huku dokezo likitaja uwezekano wa maana ya mfano.
  alternative: Kutafsiri kwa dhana pana kama “walishirikiana naye kwa uovu” au “hawakuwa waaminifu pamoja naye.”
  rationale: Ufunuo hutumia mara kwa mara picha ya uasherati kwa ushirika wa kifisadi na ibada ya sanamu; kutunza istilahi hiyo huhifadhi picha na mvutano wa kifasihi.
- issue: Tafsiri ya κόψονται
  choice: wataomboleza
  alternative: watajipiga kwa huzuni / watajipiga vifua
  rationale: Kitenzi katika nahau hii kinaonyesha maombolezo ya wazi. Tafsiri ya moja kwa moja mno inaweza kudokeza kujidhuru badala ya huzuni ya kimila.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umewekwa wazi kwa msomaji wa kawaida, huku picha ya kinabii na uwezekano wa maana ya mfano vikihifadhiwa.
