id: REV.18.20
reference: Revelation 18:20
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Εὐφραίνου ἐπ’ αὐτῇ, οὐρανέ, καὶ οἱ ἅγιοι καὶ οἱ ἀπόστολοι καὶ οἱ προφῆται, ὅτι ἔκρινεν ὁ θεὸς τὸ κρίμα ὑμῶν ἐξ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/020.yaml
  text: Rejoice over her[a], O heaven, and you saints and apostles and prophets, because God has judged your judgment from her.
translation:
  language: sw
  text: “Furahi juu yake, ee mbingu, nanyi watakatifu, mitume, na manabii, kwa maana Mungu ametoa hukumu kwa ajili yenu dhidi yake.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kigiriki kina usemi mkato: kwa neno kwa neno, “Mungu amehukumu hukumu yenu kutoka kwake.” Kwa maelezo zaidi unaweza kumaanisha, “Mungu amemhukumu kwa ajili yenu,” au “Mungu amewalipizia kisasi juu yake.”'
    reason: alternative_reading
lexical_decisions:
- source_word: Εὐφραίνου
  choice: Furahi
  rationale: Kitenzi cha amri katika umoja kinamhutubia mbingu moja kwa moja; “furahi” ni cha kawaida, wazi, na kinahifadhi nguvu ya wito.
- source_word: ἐπ’ αὐτῇ
  choice: kwa sababu yake
  rationale: Pamoja na kitenzi cha kufurahi, ἐπί pamoja na hali ya dative huonyesha kitu au tukio linalosababisha furaha. Kiswahili “juu yake” kingekuwa tafsiri ya neno kwa neno lakini si ya kawaida katika maana hii.
- source_word: οὐρανέ
  choice: ee mbingu
  rationale: Huhifadhi hali ya mwito wa moja kwa moja kwa mbingu iliyowasilishwa kama mhusika.
- source_word: οἱ ἅγιοι
  choice: watakatifu
  rationale: Ni tafsiri fupi na iliyozoeleka kwa watu wa Mungu katika Ufunuo, bila kuongeza ufafanuzi usiokuwamo katika neno lenyewe.
- source_word: οἱ ἀπόστολοι
  choice: mitume
  rationale: Katika orodha hii pamoja na manabii, maana maalumu ya mitume ndiyo inayofaa kuliko maana ya jumla ya wajumbe.
- source_word: οἱ προφῆται
  choice: manabii
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja ya προφῆται.
- source_word: ὅτι
  choice: kwa maana
  rationale: Hutambulisha sababu ya mwito wa kufurahi kwa mtindo wa asili na wenye hadhi.
- source_word: ἔκρινεν
  choice: ametoa hukumu
  rationale: Huwasilisha tendo la Mungu la kimahakama lililotimizwa, huku likibaki na uzito wake kwa hali ya sasa.
- source_word: τὸ κρίμα ὑμῶν
  choice: hukumu yenu
  rationale: Huhifadhi uhusiano wa moja kwa moja wa hukumu na wale wanaohutubiwa bila kuigeuza waziwazi kuwa kisasi.
- source_word: ἐξ αὐτῆς
  choice: dhidi yake
  rationale: Katika muundo huu mgumu wa kimahakama, “dhidi yake” huwasilisha kwamba hukumu inayowahusu walioonewa imetolewa juu ya Babeli; tanbihi inadumisha ukandamizaji na uwezekano wa miundo mingine ya Kigiriki.
theological_decisions:
- issue: Jinsi ya kueleza tendo la Mungu la kimahakama dhidi ya Babeli kwa niaba ya watakatifu
  choice: Mungu ametoa hukumu yenu dhidi yake
  alternative: Mungu amewalipizia kisasi kwake; Mungu amemhukumu kwa ajili yenu; kwa neno kwa neno, Mungu amehukumu hukumu yenu kutoka kwake
  rationale: Tafsiri kuu inadumisha msamiati wa hukumu wa κρίνω/κρίμα na uhusiano wake na walioonewa, lakini haiongezi waziwazi wazo la kisasi ambalo halitajwi kwa kitenzi maalumu katika Kigiriki. Tanbihi inaonyesha kwamba usemi wa asili umebanwa na unaweza kufafanuliwa kwa namna zaidi ya moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Ee” huhifadhi mwito wa kishairi, huku sentensi nyingine ikibaki wazi kwa wasomaji wa kawaida. Alama ya tanbihi [a] imewekwa baada ya kishazi cha hukumu kwa sababu tanbihi inaeleza hasa usemi huo uliobanwa.
