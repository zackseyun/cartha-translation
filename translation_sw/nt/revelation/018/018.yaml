  text: καὶ ⸀ἔκραξαν βλέποντες τὸν καπνὸν τῆς πυρώσεως αὐτῆς λέγοντες· Τίς ὁμοία τῇ πόλει τῇ μεγάλῃ;
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/018.yaml
  text: And they cried out as they saw the smoke of her burning[a], saying, “What city is like the great city?”
translation:
  language: sw
  text: Nao walipouona moshi wa kuungua kwake, wakapaza sauti wakisema, “Ni mji gani ulio kama mji ule mkubwa?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔκραξαν
  choice: wakapaza sauti
  rationale: Kitenzi hiki kinaonyesha kilio au sauti kubwa; usemi huu ni wa kawaida na wenye hadhi katika Kiswahili.
- source_word: βλέποντες
  choice: walipouona
  rationale: Kirai hiki kinaonyesha tendo lililotokea wakati mmoja na kupaza sauti; muundo wa -lipO- unatoa uhusiano huo wa wakati kwa Kiswahili cha kawaida.
- source_word: τὸν καπνὸν τῆς πυρώσεως αὐτῆς
  choice: moshi wa kuungua kwake
  rationale: Huhifadhi picha ya moshi unaotokana na mji kuteketea bila kubadili πύρωσις kuwa tu ‘moto.’ Kiambishi ‘-ke’ kinaweza kurejelea mji na kuendeleza ubinafsishaji wake kwa njia ya kawaida ya Kiswahili.
- source_word: λέγοντες
  choice: wakisema
  rationale: Ni tafsiri ya moja kwa moja na ya asili ya kishirikishi kinachoanzisha maneno yaliyonukuliwa.
- source_word: Τίς ὁμοία τῇ πόλει τῇ μεγάλῃ;
  choice: Ni mji gani ulio kama ule mji mkuu?
  rationale: Kigiriki ni cha kidokezo na hakitaji nomino baada ya τίς. Kiswahili kinahitaji kuifanya hoja ya ulinganisho iwe wazi; ‘mji gani’ hutolewa kutokana na τῇ πόλει. ‘Ulio’ haifungi swali kwa wakati uliopita, kwa kuwa Kigiriki hakina kitenzi cha kuonyesha wakati hapa.
- source_word: τῇ πόλει τῇ μεγάλῃ
  choice: ule mji mkuu
  rationale: ‘Ule’ humtambulisha mji unaojulikana katika muktadha, na ‘mji mkuu’ hapa humaanisha mji mkubwa au mashuhuri, si lazima makao makuu ya nchi.
theological_decisions:
- issue: Ubinafsishaji wa Babeli/mji
  choice: kuungua kwake
  alternative: kuungua kwa mji huo
  rationale: Kiswahili hakina viwakilishi vya kijinsia sawa na ‘her’; ‘kwake’ huhifadhi rejeo la kibinafsi kadiri sarufi ya Kiswahili inavyoruhusu bila kuongeza tafsiri ya kimadhehebu.
- issue: Wakati wa ulinganisho katika swali la balagha
  choice: Ni mji gani ulio kama ule mji mkuu?
  alternative: Ni mji gani uliokuwa kama ule mji mkuu?
  rationale: Kigiriki ni cha kidokezo na hakina kitenzi cha kuunganisha chenye wakati. Muundo ‘ulio kama’ huhifadhi utata huo badala ya kulazimisha wakati uliopita au uliopo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inadumisha mwendo wa simulizi na nguvu ya kilio cha balagha. Hakuna tanbihi iliyohitajika kwa kuwa Kiswahili kinaweza kutoa ulinganisho wa Kigiriki bila kulazimisha wakati maalumu.
