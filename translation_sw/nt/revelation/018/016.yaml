  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ⸀λέγοντες· Οὐαὶ οὐαί, ἡ πόλις ἡ μεγάλη, ἡ περιβεβλημένη βύσσινον καὶ πορφυροῦν καὶ κόκκινον καὶ ⸀κεχρυσωμένη χρυσίῳ καὶ λίθῳ τιμίῳ καὶ ⸀μαργαρίτῃ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/016.yaml
  text: saying[a], “Woe, woe, the great city, clothed in fine linen and purple and scarlet, and adorned with gold and precious stones and pearls,”
translation:
  language: sw
  text: wakisema[a], “Ole, ole, mji ule mkubwa, uliovikwa kitani safi, nguo za rangi ya zambarau na nyekundu, na kupambwa kwa dhahabu, mawe ya thamani na lulu,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walikuwa wakisema.”
    reason: Kitenzi kishirikishi cha Kigiriki kinaweza kutafsiriwa kwa kishazi kamili katika Kiswahili, ingawa “wakisema” huhifadhi muunganiko wake na mstari uliotangulia.
lexical_decisions:
- source_word: λέγοντες
  choice: wakisema
  rationale: Kitenzi kishirikishi cha wakati uliopo, wingi, kinachounganisha maneno haya na wahusika wa mstari uliotangulia bila kuongeza kiima kisichotajwa hapa.
- source_word: Οὐαὶ οὐαί
  choice: Ole, ole
  rationale: “Ole” huhifadhi sauti ya maombolezo ya kinabii pamoja na uzito wa hukumu; “Maskini!” linawezekana lakini lingeweza kudhoofisha toni hiyo.
- source_word: ἡ πόλις ἡ μεγάλη
  choice: mji mkuu
  rationale: Ni usemi wa kawaida na wenye mkazo unaowasilisha ukubwa au umuhimu wa mji, si lazima mji wenye makao ya serikali.
- source_word: περιβεβλημένη
  choice: uliovikwa
  rationale: Huwasilisha hali endelevu inayodokezwa na kitenzi kishirikishi cha timilifu na hudumisha taswira ya mji kama mwanamke aliyevaa mavazi ya fahari.
- source_word: βύσσινον
  choice: kitani safi
  rationale: Hutaja kitambaa bora na cha gharama kubwa, si kitani cha kawaida tu.
- source_word: πορφυροῦν
  choice: nguo za rangi ya zambarau
  rationale: Kuongeza “nguo za” hufanya orodha ya mavazi iwe ya asili katika Kiswahili na kuhifadhi uhusiano wa rangi hii na anasa na hadhi.
- source_word: κόκκινον
  choice: nyekundu
  rationale: Ni neno la kawaida na linaloeleweka kwa rangi hii; katika muktadha linaonyesha nguo nyekundu yenye fahari.
- source_word: κεχρυσωμένη
  choice: kupambwa kwa
  rationale: Ingawa kitenzi kinaweza kumaanisha kufunikwa kwa dhahabu, orodha inayofuata inajumuisha dhahabu, mawe na lulu, hivyo “kupambwa kwa” huwasilisha mapambo yote kwa usahihi.
- source_word: χρυσίῳ
  choice: dhahabu
  rationale: Tafsiri ya moja kwa moja ya nyenzo ya mapambo.
- source_word: λίθῳ τιμίῳ
  choice: mawe ya thamani
  rationale: Umoja wa Kigiriki unaweza kutumiwa kwa maana ya jumla; wingi ni wa asili zaidi katika Kiswahili ndani ya orodha ya mapambo ya anasa.
- source_word: μαργαρίτῃ
  choice: lulu
  rationale: “Lulu” inaweza kutumiwa bila kubainisha idadi na hivyo huhifadhi maana ya jumla ya nyenzo ya thamani bila kulazimisha lulu moja tu.
theological_decisions:
- issue: Toni ya maombolezo juu ya kuanguka kwa Babeli
  choice: Kutafsiri οὐαί kama “Ole” ili kuhifadhi maombolezo na hukumu
  alternative: “Maskini, maskini” au “Lo, lo” ili kusisitiza huzuni
  rationale: Muktadha ni tamko la hukumu katika Ufunuo. “Ole” hubeba huzuni na pia onyo la kinabii, bila kuufanya usemi kuwa majonzi pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kifasihi. Muundo wa maombolezo na taswira ya mji uliovikwa umehifadhiwa; maneno ya kawaida yametumiwa ili kifungu kisikike kwa urahisi bila kupoteza sauti ya kinabii.
