id: REV.18.3
reference: Revelation 18:3
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὅτι ἐκ τοῦ οἴνου τοῦ θυμοῦ τῆς πορνείας αὐτῆς ⸀πέπτωκαν πάντα τὰ ἔθνη, καὶ οἱ βασιλεῖς τῆς γῆς μετ’ αὐτῆς ἐπόρνευσαν, καὶ οἱ ἔμποροι τῆς γῆς ἐκ τῆς δυνάμεως τοῦ στρήνους αὐτῆς ἐπλούτησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/003.yaml
  text: For all the nations have drunk from the wine of the wrath of her sexual immorality[a], and the kings of the earth committed sexual immorality with her[c][b], and the merchants of the earth grew rich from the power of her luxury.
translation:
  language: sw
  text: Kwa maana mataifa yote yameanguka[a] kwa sababu ya divai ya ghadhabu[b] ya uasherati wake, nao wafalme wa dunia walifanya uasherati pamoja naye[c], na wafanyabiashara wa dunia walitajirika kutokana na nguvu ya anasa yake ya kupita kiasi.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya nakala za maandishi zina maana, “mataifa yote yamekunywa divai.” Maandishi yaliyotumika hapa yanasema, “yameanguka.”
    reason: textual_variant
  - marker: b
    text: Au, “divai ya hamu kali ya uasherati wake.” Mfuatano wa maneno ya Kigiriki unaweza kueleweka kwa njia zaidi ya moja, na θυμός linaweza kumaanisha “ghadhabu” au “hamu kali.”
    reason: lexical_alternative
  - marker: c
    text: Hapa lugha ya “uasherati” huenda ni ya mfano, ikimaanisha ushirika fisadi, wa ibada ya sanamu na wa unyonyaji; tafsiri imehifadhi taswira ya kingono ya Kigiriki.
    reason: alternative_reading
  - marker: d
    text: “Anasa ya kupita kiasi” inamaanisha maisha ya kujifurahisha kwa ufujaji na kupindukia, si starehe au mali ya kawaida tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Kwa maana
  rationale: Inaendeleza sababu ya tangazo lililotangulia huku ikisomeka kwa kawaida katika Kiswahili.
- source_word: ἐκ τοῦ οἴνου ... πέπτωκαν
  choice: yameanguka kwa sababu ya divai
  rationale: Maandishi ya SBLGNT yaliyotolewa yana πέπτωκαν, ‘yameanguka’; ἐκ hapa imewasilishwa kwa maana ya chanzo au kisababishi.
- source_word: θυμοῦ
  choice: ghadhabu
  rationale: Neno hilo linaweza kumaanisha ghadhabu au msukumo mkali; ‘ghadhabu’ linafaa katika mazingira ya hukumu ya Ufunuo, huku uwezekano mwingine ukitajwa katika tanbihi.
- source_word: πορνείας / ἐπόρνευσαν
  choice: uasherati / walifanya uasherati
  rationale: Huhifadhi taswira ya kingono ya Kigiriki bila kuifasiri moja kwa moja kuwa ibada ya sanamu au ushirika wa kisiasa.
- source_word: ἔμποροι
  choice: wafanyabiashara
  rationale: Ni neno la kawaida na wazi kwa wauzaji na wafanyabiashara katika muktadha wa biashara wa sura hii.
- source_word: ἐκ τῆς δυνάμεως
  choice: kutokana na nguvu ya
  rationale: Huhifadhi wazo la δύναμις kama nguvu au uwezo wenye matokeo badala ya kulibadili moja kwa moja kuwa mali.
- source_word: στρήνους
  choice: anasa zake za kupita kiasi
  rationale: Huwasilisha anasa yenye kiburi, kujifurahisha na kupindukia, si starehe ya kawaida tu.
- source_word: ἐπλούτησαν
  choice: walitajirika
  rationale: Ni Kiswahili cha kawaida kinachoeleza matokeo ya kupata utajiri.
theological_decisions:
- issue: Iwapo πορνεία na πορνεύω yafasiriwe moja kwa moja kuwa ibada ya sanamu, uasi wa kiroho, au ushirika fisadi
  choice: Kudumisha lugha ya uasherati katika matini kuu
  alternative: ibada ya sanamu; uzinzi wa kiroho; ushirika fisadi
  rationale: Ufunuo hutumia kwa makusudi taswira ya kingono kwa mahusiano ya kidini, kisiasa na kiuchumi yenye ufisadi; tafsiri haipaswi kuifungia taswira hiyo katika maana moja tu.
- issue: Tofauti ya maandishi kati ya πέπτωκαν na usomaji unaotoa maana ya kunywa
  choice: Kufuata πέπτωκαν (‘yameanguka’) katika SBLGNT iliyotolewa
  alternative: yamekunywa divai
  rationale: Chanzo kilichotolewa kinasomeka πέπτωκαν waziwazi na kina alama ya tofauti ya maandishi; usomaji mwingine umehifadhiwa katika tanbihi bila kubadili matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inadumisha mtiririko wa kishairi wa vifungu vitatu, huku tanbihi zikihifadhi utata wa msamiati na tofauti ya maandishi.
