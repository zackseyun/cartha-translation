id: REV.18.11
reference: Revelation 18:11
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ οἱ ἔμποροι τῆς γῆς ⸂κλαίουσιν καὶ πενθοῦσιν⸃ ἐπ’ ⸀αὐτήν, ὅτι τὸν γόμον αὐτῶν οὐδεὶς ἀγοράζει οὐκέτι,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/011.yaml
  text: And the merchants of the earth weep and mourn over her[a], because no one buys their cargo anymore[b],
translation:
  language: sw
  text: Nao wafanyabiashara wa dunia[a] wanamlilia na kumwombolezea, kwa sababu hakuna mtu anayenunua tena shehena yao[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wa nchi.” Neno la Kigiriki linaweza kumaanisha “dunia” au “nchi”; katika Ufunuo mara nyingi huwa na maana pana ya dunia nzima.
    reason: lexical_alternative
  - marker: b
    text: Au “bidhaa zao.” Neno la Kigiriki linaweza kumaanisha mzigo wa meli au bidhaa za biashara; hapa “shehena” inakazia mazingira ya biashara.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔμποροι
  choice: wafanyabiashara
  rationale: Ni neno la kawaida na lenye heshima kwa watu wanaojishughulisha na biashara; linafaa katika muktadha wa biashara ya bidhaa za anasa katika Ufunuo 18.
- source_word: τῆς γῆς
  choice: wa dunia
  rationale: γῆ inaweza kumaanisha “dunia” au “nchi.” Katika muktadha huu wa hukumu yenye upeo mpana, “dunia” inadumisha upeo wa kimataifa bila kuondoa maana nyingine inayowezekana.
- source_word: κλαίουσιν καὶ πενθοῦσιν
  choice: wanamlilia na kumwombolezea
  rationale: 'Vitenzi vyote viwili vimedumishwa ili kuhifadhi msisitizo wa usemi: cha kwanza kinaonyesha kulia, na cha pili kuomboleza kwa huzuni.'
- source_word: ἐπ’ αὐτήν
  choice: wanamlilia na kumwombolezea
  rationale: Kiambishi cha yambwa “-m-” na umbo “-ea” vinaelekeza maombolezo kwa Babeli aliyewasilishwa kama mwanamke, kwa Kiswahili cha asili.
- source_word: γόμον
  choice: shehena
  rationale: γόμος hurejelea mzigo unaosafirishwa, hasa wa meli. “Shehena” ni sahihi katika muktadha wa biashara na inaandaa orodha ya bidhaa inayofuata.
- source_word: οὐδεὶς ἀγοράζει οὐκέτι
  choice: hakuna mtu anayenunua tena
  rationale: Usemi huu unahifadhi tendo la wakati wa sasa na wazo la kusitishwa kabisa linalobebwa na οὐκέτι.
- source_word: αὐτῶν
  choice: yao
  rationale: Kiwakilishi hiki ni cha umilikaji na kinawarejelea wafanyabiashara.
theological_decisions:
- issue: Mhusika na taswira ya Babeli
  choice: Babeli anarejelewa kwa kiambishi cha ngeli ya mtu katika “wanamlilia,” kinachodumisha uhuishaji wake kama mwanamke/mji.
  alternative: Kumrejelea kama kitu kisicho na uhai kwa kutumia “wanaulilia.”
  rationale: Ufunuo humwasilisha Babeli kama mwanamke na mji. Kumrejelea kama mtu kunahifadhi taswira hiyo ya kifasihi na kiteolojia bila kufafanua zaidi utambulisho wake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Wafanyabiashara,” “kumwombolezea,” na “shehena” ni maneno yanayoeleweka na yanayofaa kwa usomaji wa hadharani. Alama za tanbihi zimepangwa kufuatana na mahali pa maneno husika katika aya.
