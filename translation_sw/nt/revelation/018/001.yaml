id: REV.18.1
reference: Revelation 18:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Μετὰ ταῦτα εἶδον ἄλλον ἄγγελον καταβαίνοντα ἐκ τοῦ οὐρανοῦ, ἔχοντα ἐξουσίαν μεγάλην, καὶ ἡ γῆ ἐφωτίσθη ἐκ τῆς δόξης αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/001.yaml
  text: After these things I saw another angel coming down out of heaven[a], having great authority[b], and the earth was illuminated by his glory.
translation:
  language: sw
  text: Baada ya mambo haya nilimwona malaika mwingine akishuka kutoka mbinguni, akiwa na mamlaka kuu, nayo dunia ikaangazwa na utukufu wake.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: Baada ya mambo haya
  rationale: Huhifadhi wingi wa ταῦτα na mfuatano wa maono kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: εἶδον
  choice: nilimwona
  rationale: Ni tafsiri ya moja kwa moja ya aoristi ya ὁράω; kiambishi cha yambwa -mw- kinafaa kwa malaika aliye mtu.
- source_word: ἄλλον ἄγγελον
  choice: malaika mwingine
  rationale: Hutoa maana ya malaika mwingine katika mfuatano wa maono bila kuongeza ufafanuzi usiomo katika Kigiriki.
- source_word: καταβαίνοντα ἐκ τοῦ οὐρανοῦ
  choice: akishuka kutoka mbinguni
  rationale: Muundo wa -ki- unaonyesha tendo lililokuwa likitendeka wakati Yohana alipomwona; “kutoka mbinguni” huwasilisha chanzo kinachoonyeshwa na ἐκ kwa Kiswahili cha asili.
- source_word: ἔχοντα ἐξουσίαν μεγάλην
  choice: akiwa na mamlaka kuu
  rationale: “Mamlaka” huhifadhi maana ya ἐξουσία kama haki au uwezo wa kuamuru, si nguvu ghafi tu; “kuu” ni ya kawaida na yenye hadhi.
- source_word: ἡ γῆ
  choice: dunia
  rationale: Muktadha wa nuru yenye upeo mpana unaunga mkono maana ya ulimwengu wa nchi kavu kwa ujumla kuliko eneo maalumu.
- source_word: ἐφωτίσθη
  choice: ikaangazwa
  rationale: Huhifadhi kauli ya kutendwa ya φωτίζω na picha ya dunia kupewa nuru.
- source_word: ἐκ τῆς δόξης αὐτοῦ
  choice: na utukufu wake
  rationale: Katika Kiswahili, “ikaangazwa na utukufu wake” huonyesha kwa kawaida chanzo au kisababishi cha mwanga, huku ikihifadhi uhusiano wa karibu na ἐκ.
theological_decisions:
- issue: Asili ya mamlaka na mng'ao wa malaika
  choice: Aya inasema wazi kwamba malaika ana mamlaka kuu na utukufu unaoiangazia dunia, bila kumtambulisha kuwa wa kiungu.
  alternative: Utukufu wake unaweza kueleweka kwa namna iliyotukuzwa sana kwa sababu dunia inaangazwa nao.
  rationale: Tafsiri haipunguzi maneno ya “mamlaka” au “utukufu,” wala haiongezi kauli kwamba mamlaka hayo yamekabidhiwa na Mungu, jambo ambalo halijasemwa moja kwa moja katika aya hii.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wazi kwa msomaji wa kawaida; “akishuka” na “akiwa” huunganisha vishazi elezi kwa mtiririko wa asili. Hakuna tanbihi iliyohitajika kwa kuwa tofauti za “kutoka/akishuka kutoka” na chanzo cha nuru zinaweza kuwasilishwa wazi katika matini yenyewe.
