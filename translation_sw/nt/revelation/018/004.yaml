  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ ἤκουσα ἄλλην φωνὴν ἐκ τοῦ οὐρανοῦ λέγουσαν· ⸀Ἐξέλθατε, ⸂ὁ λαός μου, ἐξ αὐτῆς⸃, ἵνα μὴ συγκοινωνήσητε ταῖς ἁμαρτίαις αὐτῆς, καὶ ἐκ τῶν πληγῶν αὐτῆς ἵνα μὴ λάβητε·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/004.yaml
  text: And I heard another voice from heaven saying[a], “Come out of her, my people, so that you may not share in her sins[b], and so that you may not receive any of her plagues.”
translation:
  language: sw
  text: Nami nikasikia sauti nyingine kutoka mbinguni ikisema, “Tokeneni humo, enyi watu wangu, ili msishiriki katika dhambi zake, na ili msipate sehemu ya mapigo yake.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλλην φωνὴν
  choice: sauti nyingine
  rationale: Hueleza sauti ya ziada iliyo tofauti na msemaji aliyetangulia, kwa Kiswahili cha kawaida na sahihi.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: kutoka mbinguni
  rationale: Katika muktadha huu οὐρανός ni makao ya mbinguni, si anga la kawaida.
- source_word: Ἐξέλθατε … ἐξ αὐτῆς
  choice: Tokeni kwake
  rationale: Amri ya wingi inawaita watu waondoke katika uhusiano au eneo lake; ‘kwake’ ni ya asili kwa Kiswahili na inadumisha rejeo la kike kwa Babeli aliyefananishwa na mwanamke.
- source_word: ὁ λαός μου
  choice: enyi watu wangu
  rationale: ‘Enyi’ huonyesha wazi nguvu ya mwito wa moja kwa moja bila kutumia mtindo wa kizamani.
- source_word: ἵνα μὴ συγκοινωνήσητε ταῖς ἁμαρτίαις αὐτῆς
  choice: ili msishiriki katika dhambi zake
  rationale: συγκοινωνέω humaanisha kushiriki au kuwa na sehemu katika jambo; tafsiri hii huonyesha ushirika katika hatia bila kuongeza ufafanuzi.
- source_word: ἐκ τῶν πληγῶν αὐτῆς ἵνα μὴ λάβητε
  choice: na ili msipate sehemu ya mapigo yake
  rationale: ‘Kupata sehemu ya’ huakisi ἐκ pamoja na λαμβάνω, yaani kupata fungu kutokana na mapigo hayo, na ni Kiswahili cha asili.
- source_word: πληγῶν
  choice: mapigo
  rationale: Katika Ufunuo neno hili hueleza mapigo ya hukumu ya Mungu na huhifadhi mwangwi wa lugha ya kibiblia.
theological_decisions:
- issue: Rejeo na taswira ya αὐτῆς
  choice: Kutumia ‘kwake’ na ‘zake’ kwa Babeli aliyefananishwa na mwanamke.
  alternative: Kutumia lugha ya kitu, kama ‘humo’ au ‘yake,’ kwa kusisitiza mji au mfumo.
  rationale: Muktadha wa Ufunuo humwonyesha Babeli kama mwanamke na pia kama mji. Kiswahili hakina viwakilishi vya jinsia kama Kigiriki, lakini ‘kwake’ hudumisha kwa kadiri iwezekanavyo dhana ya mhusika binafsi bila kuongeza tafsiri.
- issue: Nguvu ya vifungu viwili vya ἵνα μή
  choice: Kurudia ‘ili msi… na ili msi…’
  alternative: Kutumia ‘msije mka…’ katika vifungu vyote viwili.
  rationale: Kurudia ‘ili’ huhifadhi uratibu, kusudi na onyo la vifungu viwili vya Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa asili kwa msomaji wa kawaida huku marudio ya Kigiriki yakihifadhiwa. Hakuna tanbihi inayohitajika, kwa kuwa tofauti ya ‘come out/go out’ ya Kiingereza haihitaji kuelezwa katika Kiswahili.
