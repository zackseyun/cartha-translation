  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: διὰ τοῦτο ἐν μιᾷ ἡμέρᾳ ἥξουσιν αἱ πληγαὶ αὐτῆς, θάνατος καὶ πένθος καὶ λιμός, καὶ ἐν πυρὶ κατακαυθήσεται· ὅτι ἰσχυρὸς κύριος ὁ θεὸς ὁ κρίνας αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/008.yaml
  text: 'For this reason, in one day her plagues will come: death and mourning and famine, and she will be burned up with fire; because strong is the Lord God who judged her.'
translation:
  language: sw
  text: 'Kwa sababu hiyo, mapigo yake yatakuja katika siku moja: kifo, maombolezo na njaa; naye atateketezwa kwa moto, kwa sababu Bwana Mungu aliyemhukumu ni mwenye nguvu.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Kwa sababu hiyo
  rationale: Inaonyesha wazi kuwa hukumu hii inatokana na majivuno na madai yaliyotangulia, bila kuongeza ufafanuzi usio katika maandishi.
- source_word: ἐν μιᾷ ἡμέρᾳ
  choice: kwa siku moja
  rationale: Tafsiri ya karibu na muundo wa Kigiriki, ikihifadhi wazo la ghafla na ukamilifu wa hukumu.
- source_word: αἱ πληγαὶ αὐτῆς
  choice: mapigo yake
  rationale: Neno “mapigo” linafaa kwa πληγαί katika muktadha wa hukumu za Ufunuo na ni la kawaida katika Kiswahili cha Biblia.
- source_word: πένθος
  choice: maombolezo
  rationale: Huwakilisha hali au tendo la kuomboleza linalotokana na kifo na maafa.
- source_word: ἐν πυρὶ κατακαυθήσεται
  choice: atateketezwa kwa moto
  rationale: Kitenzi κατακαίω kina maana ya kuchoma kabisa; “kuteketezwa” huhifadhi nguvu hiyo.
- source_word: ἰσχυρός
  choice: mwenye nguvu
  rationale: Huwasilisha maana ya uwezo au nguvu bila kubadilisha kuwa cheo maalumu.
- source_word: ὁ κρίνας αὐτήν
  choice: aliyemhukumu
  rationale: Kishirikishi cha wakati uliopita kimetafsiriwa moja kwa moja, kikihifadhi mtazamo wa hukumu kama tendo lililofanywa.
theological_decisions:
- issue: Uhusiano wa ὅτι na kauli inayotangulia
  choice: kwa sababu
  alternative: kwa kuwa
  rationale: 'ὅτι hapa inatoa msingi wa uhakika wa hukumu: Bwana Mungu anayehukumu ana nguvu za kuitekeleza.'
- issue: Nguvu ya kuteketezwa kwa moto
  choice: atateketezwa kwa moto
  alternative: atachomwa kwa moto
  rationale: “Atateketezwa” huonyesha kuangamizwa kabisa kwa moto bila kuongeza maelezo kuhusu jinsi tukio hilo litakavyotokea.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo umegawanywa katika sentensi mbili ili kusomeka kwa urahisi huku uhusiano wa kimantiki wa maandishi ya Kigiriki ukihifadhiwa.
