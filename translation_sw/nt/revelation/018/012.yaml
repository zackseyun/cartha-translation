id: REV.18.12
reference: Revelation 18:12
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: γόμον χρυσοῦ καὶ ἀργύρου καὶ λίθου τιμίου καὶ ⸀μαργαριτῶν καὶ βυσσίνου καὶ ⸀πορφύρας καὶ σιρικοῦ καὶ κοκκίνου, καὶ πᾶν ξύλον θύϊνον καὶ πᾶν σκεῦος ἐλεφάντινον καὶ πᾶν σκεῦος ἐκ ξύλου τιμιωτάτου καὶ χαλκοῦ καὶ σιδήρου καὶ μαρμάρου,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/012.yaml
  text: cargo of gold and silver and precious stones and pearls and fine linen and purple cloth and silk and scarlet cloth[a], and every kind of citron wood and every kind of ivory vessel and every kind of vessel made from very precious wood and bronze and iron and marble,
translation:
  language: sw
  text: shehena ya dhahabu, fedha, vito vya thamani, lulu, kitani safi, vitambaa vya rangi ya zambarau, hariri, vitambaa vya rangi nyekundu kali, na kila aina ya mbao yenye harufu nzuri[a], kila aina ya vitu vilivyotengenezwa kwa pembe za ndovu, na kila aina ya vitu vilivyotengenezwa kwa mbao za thamani kubwa sana, shaba, chuma, na marumaru,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mbao ya thyine,” jina la jadi la mbao ya gharama yenye harufu nzuri; utambulisho wake mahususi wa kibotania hauna uhakika.
    reason: lexical_alternative
lexical_decisions:
- source_word: γόμον
  choice: shehena
  rationale: Neno hili humaanisha mzigo wa meli au bidhaa zinazosafirishwa. “Shehena” linafaa kwa orodha hii ya biashara na linahifadhi maana ya pamoja ya umoja.
- source_word: λίθου τιμίου
  choice: vito vya thamani
  rationale: Ingawa Kigiriki kina umoja wa kimofolojia, hapa jina hilo lina maana ya nyenzo kwa ujumla; wingi ni wa kawaida na wazi zaidi katika Kiswahili.
- source_word: μαργαριτῶν
  choice: lulu
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa pearls; umbo lake linaweza kutumiwa kwa umoja au wingi kulingana na muktadha.
- source_word: βυσσίνου
  choice: kitani safi
  rationale: Hurejelea kitambaa bora cha kitani; “kitani safi” ni lugha inayoeleweka na inadokeza ubora wake.
- source_word: πορφύρας
  choice: vitambaa vya rangi ya zambarau
  rationale: Katika orodha ya bidhaa, neno linaweza kumaanisha rangi, kitambaa, au vazi la zambarau. Kutaja vitambaa kunafanya bidhaa inayouzwa iwe wazi bila kuondoa rangi yake.
- source_word: σιρικοῦ
  choice: hariri
  rationale: Hii ndiyo tafsiri ya kawaida na ya asili ya bidhaa ya silk.
- source_word: κοκκίνου
  choice: vitambaa vya rangi nyekundu
  rationale: Neno hurejelea nyenzo yenye rangi nyekundu kali. Katika orodha ya biashara, “vitambaa” huweka wazi kuwa ni bidhaa ya nguo.
- source_word: πᾶν ξύλον θύϊνον
  choice: kila aina ya mbao yenye harufu nzuri
  rationale: Utambulisho mahususi wa mti wa θύϊνος hauna uhakika wa kutosha kwa jina la kawaida la Kiswahili. Tafsiri ya kimaelezo inawasilisha sifa yake inayojulikana ya kuwa mbao ya gharama yenye harufu nzuri, huku tanbihi ikihifadhi jina la jadi.
- source_word: πᾶν σκεῦος ἐλεφάντινον
  choice: kila aina ya vyombo vya pembe za ndovu
  rationale: σκεῦος ni neno pana kwa chombo au kitu kilichotengenezwa. “Vyombo” ni la kawaida na linaendana na urudiaji wa muundo wa sentensi.
- source_word: πᾶν σκεῦος ἐκ ξύλου τιμιωτάτου
  choice: kila aina ya vyombo vilivyotengenezwa kwa mbao za thamani kubwa
  rationale: Maneno haya yanaonyesha vyombo vilivyotengenezwa kwa mbao zenye thamani ya juu sana. “Thamani kubwa” ni Kiswahili cha asili kinachobeba nguvu ya umbo la kiwango cha juu τιμιωτάτου.
- source_word: χαλκοῦ
  choice: shaba
  rationale: χαλκός inaweza kumaanisha copper au bronze. “Shaba” ni neno pana na la kawaida katika Kiswahili, bila kulazimisha utambulisho wa aloi usio wazi katika neno la Kigiriki.
- source_word: σιδήρου
  choice: chuma
  rationale: Hii ndiyo tafsiri ya kawaida ya iron katika Kiswahili.
- source_word: μαρμάρου
  choice: marumaru
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa marble.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini wa kawaida. Orodha imetolewa kwa majina yanayotambulika kwa urahisi katika biashara na maisha ya kila siku. Alama ya tanbihi imewekwa moja kwa moja baada ya “mbao yenye harufu nzuri,” ambako mbadala wa kileksika unahusika.
