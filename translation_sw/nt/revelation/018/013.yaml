id: REV.18.13
reference: Revelation 18:13
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ κιννάμωμον ⸂καὶ ἄμωμον⸃ καὶ θυμιάματα καὶ μύρον καὶ λίβανον καὶ οἶνον καὶ ἔλαιον καὶ σεμίδαλιν καὶ σῖτον καὶ ⸂κτήνη καὶ πρόβατα⸃, καὶ ἵππων καὶ ῥεδῶν καὶ σωμάτων, καὶ ψυχὰς ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/013.yaml
  text: and cinnamon and spice and incense and perfume and frankincense and wine and olive oil and fine flour and wheat and cattle and sheep[a], and horses and chariots and servants, that is[b], human souls.
translation:
  language: sw
  text: na mdalasini, na kiungo cha kunukia[a], na uvumba, na marashi, na ubani, na divai, na mafuta ya zeituni, na unga laini, na ngano, na ng’ombe, na kondoo, na farasi, na magari ya kukokotwa, na miili[b], na nafsi za wanadamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “amomumu,” mmea wa bei ghali wenye harufu nzuri.
    reason: lexical_alternative
  - marker: b
    text: “Miili” hapa inamaanisha wanadamu waliouzwa kama watumwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: κιννάμωμον
  choice: mdalasini
  rationale: Ni jina la bidhaa ya kunukia iliyoagizwa kutoka mbali; “mdalasini” ni neno la kawaida na sahihi katika Kiswahili.
- source_word: ἄμωμον
  choice: kiungo cha kunukia
  rationale: Utambulisho mahususi wa mmea huu wa bei ghali hauna uhakika wa kutosha; tafsiri hii inaeleza aina ya bidhaa bila kuifanya kuwa iliki kimyakimya.
- source_word: θυμιάματα
  choice: uvumba
  rationale: Katika orodha ya biashara, neno hili linamaanisha vitu vinavyofukizwa ili kutoa harufu, si tendo la kuvitoa kama sadaka.
- source_word: μύρον
  choice: marashi
  rationale: Neno hili hurejelea mafuta au dawa yenye harufu nzuri na ya thamani; “marashi” ni la asili na linaloeleweka kwa wasomaji wa leo.
- source_word: λίβανον
  choice: ubani
  rationale: Hurejelea hasa resini ya frankincense, tofauti na neno pana la uvumba lililotangulia.
- source_word: ἔλαιον
  choice: mafuta ya zeituni
  rationale: Muktadha wa Mediterania unaonyesha mafuta ya zeituni; kuyaainisha huepusha utata wa neno “mafuta.”
- source_word: σεμίδαλιν
  choice: unga laini
  rationale: Ni unga bora uliosagwa vizuri, bidhaa ya thamani.
- source_word: σῖτον
  choice: ngano
  rationale: Ingawa neno linaweza kumaanisha nafaka kwa upana, hapa maana mahususi inayowezekana zaidi ni ngano.
- source_word: κτήνη
  choice: ng’ombe
  rationale: Neno linaweza kumaanisha wanyama wakubwa wa kufugwa; “ng’ombe” linadumisha tofauti na kondoo wanaotajwa baadaye.
- source_word: πρόβατα
  choice: kondoo
  rationale: Maana yake ya moja kwa moja ni kondoo.
- source_word: ῥεδῶν
  choice: magari
  rationale: Neno hurejelea magari ya magurudumu manne, yaelekeayo kuwa magari ya usafiri au ya kifahari kuliko magari ya vita.
- source_word: σωμάτων
  choice: miili
  rationale: Tafsiri ya moja kwa moja inadumisha mshtuko wa kuwafanya wanadamu bidhaa; tanbihi inaeleza matumizi yake kuhusu watumwa.
- source_word: ψυχὰς ἀνθρώπων
  choice: nafsi za wanadamu
  rationale: Tafsiri hii inadumisha tofauti na pia uhusiano wenye mvutano kati ya “miili” na “nafsi za wanadamu,” bila kuufanya usemi kuwa ufafanuzi wa wazi kuliko Kigiriki.
theological_decisions:
- issue: Uhusiano wa σωμάτων καὶ ψυχὰς ἀνθρώπων
  choice: miili, na nafsi za wanadamu
  alternative: watumwa, yaani, wanadamu
  rationale: Kigiriki kinaunganisha “miili” na “nafsi za wanadamu” kwa καί; hakina neno la moja kwa moja linalomaanisha “yaani.” Kudumisha muundo huo kunahifadhi ukali wa biashara ya wanadamu na utata wa kisintaksia badala ya kuamua kimyakimya kuwa kifungu cha pili ni ufafanuzi tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa orodha ya kibiashara na hadhi ya kifasihi. “Magari” limetumiwa kwa chombo cha magurudumu manne bila kuingiza maana ya gari la vita. Alama zote za tanbihi zimewekwa mara moja katika matini.
