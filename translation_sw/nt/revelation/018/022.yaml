id: REV.18.22
reference: Revelation 18:22
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ φωνὴ κιθαρῳδῶν καὶ μουσικῶν καὶ αὐλητῶν καὶ σαλπιστῶν οὐ μὴ ἀκουσθῇ ἐν σοὶ ἔτι, καὶ πᾶς τεχνίτης πάσης τέχνης οὐ μὴ εὑρεθῇ ἐν σοὶ ἔτι, καὶ φωνὴ μύλου οὐ μὴ ἀκουσθῇ ἐν σοὶ ἔτι,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/022.yaml
  text: And the sound of harpists and musicians and flute players and trumpeters will never be heard in you again[a], and no craftsman of any craft will ever be found in you again, and the sound of a mill will never be heard in you again[b],
translation:
  language: sw
  text: Na sauti ya wapiga vinubi, wanamuziki, wapiga filimbi, na wapiga tarumbeta haitasikika tena ndani yako kamwe[a]. Wala fundi yeyote wa kazi ya aina yoyote hatapatikana tena ndani yako kamwe. Na sauti ya kinu haitasikika tena ndani yako kamwe[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wapiga filimbi za kale.” Neno la Kigiriki linarejelea wapiga αὐλός, ala ya kale ya kupuliza ambayo haikuwa sawa kabisa na filimbi ya kisasa.
    reason: lexical_alternative
  - marker: b
    text: Au, “sauti ya jiwe la kusagia.” Neno la Kigiriki linaweza kurejelea kinu kwa ujumla au, kwa maana mahususi zaidi, jiwe lake la kusagia.
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνὴ
  choice: sauti
  rationale: Katika muktadha huu neno hilo linamaanisha sauti inayosikika, si lazima sauti ya usemi; pia linadumisha marudio yanayounganisha muziki na kinu.
- source_word: κιθαρῳδῶν
  choice: wapiga vinubi
  rationale: Neno la Kigiriki linarejelea watendaji waliotumia kinanda cha nyuzi aina ya kithara; 'wapiga vinubi' ni usemi unaoeleweka kwa urahisi na kudumisha picha ya wanamuziki wa ala za nyuzi.
- source_word: μουσικῶν
  choice: wanamuziki
  rationale: Ni neno pana kwa watu wanaofanya muziki na linafaa katika orodha hii bila kulibana kuwa waimbaji pekee.
- source_word: αὐλητῶν
  choice: wapiga filimbi
  rationale: Hawa ni wapiga αὐλός, ala ya kale ya kupuliza. 'Wapiga filimbi' ni tafsiri ya kawaida na inayoeleweka, huku tanbihi ikieleza tofauti ya ala hiyo.
- source_word: σαλπιστῶν
  choice: wapiga tarumbeta
  rationale: Tafsiri ya moja kwa moja, ya kawaida, kwa watu wanaopiga tarumbeta.
- source_word: οὐ μὴ ἀκουσθῇ ... ἔτι
  choice: haitasikika tena ... kamwe
  rationale: Muundo οὐ μή pamoja na ἔτι unaonyesha ukataaji wenye msisitizo na mwisho wa kudumu; mpangilio huu wa Kiswahili unaonyesha kwamba sauti hiyo haitarudi kabisa.
- source_word: ἐν σοὶ
  choice: ndani yako
  rationale: Inahifadhi usemi wa nafsi ya pili kwa Babeli iliyowasilishwa kama mtu, na huonyesha eneo la ndani ya mji.
- source_word: πᾶς τεχνίτης πάσης τέχνης
  choice: fundi wa ufundi wowote
  rationale: Inahifadhi urudiaji na upana wa Kigiriki kwa njia ya Kiswahili iliyo wazi na yenye hadhi.
- source_word: εὑρεθῇ
  choice: hatapatikana
  rationale: Katika kauli ya ukataaji wenye msisitizo, neno hili linaonyesha kutokuwapo kabisa kwa fundi yeyote.
- source_word: μύλου
  choice: kinu
  rationale: Neno hili linaweza kumaanisha kifaa cha kusagia au jiwe lake; 'kinu' kinatoa picha pana na ya asili ya shughuli ya kusaga, huku tanbihi ikihifadhi uwezekano wa maana mahususi zaidi.
theological_decisions:
- issue: Picha ya hukumu ya Babeli
  choice: Kudumisha matangazo matatu ya kukoma kabisa kwa sauti za muziki, kazi za ufundi, na shughuli ya kusaga katika mji uliohukumiwa.
  alternative: Kuchukulia vitu vilivyoorodheshwa kuwa mapambo ya lugha tu yasiyo na uzito wa picha ya ukiwa.
  rationale: Marudio ya οὐ μή ... ἔτι yanasisitiza ukiwa kamili na usioweza kubadilishwa. Tafsiri inahifadhi picha halisi bila kuipa kila kitu maana ya fumbo isiyotajwa katika maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Marudio ya 'tena ndani yako kamwe' yamehifadhiwa ili kuonyesha muundo wa kinabii na msisitizo wa chanzo.
