id: REV.18.14
reference: Revelation 18:14
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἡ ὀπώρα ⸂σου τῆς ἐπιθυμίας τῆς ψυχῆς⸃ ἀπῆλθεν ἀπὸ σοῦ, καὶ πάντα τὰ λιπαρὰ καὶ τὰ λαμπρὰ ἀπώλετο ἀπὸ σοῦ, καὶ ⸀οὐκέτι ⸂οὐ μὴ αὐτὰ εὑρήσουσιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/014.yaml
  text: And the fruit of your soul’s desire has gone away from you[a], and all the rich and splendid things have perished from you[b], and they will never be found again.
translation:
  language: sw
  text: Na tunda la tamaa ya nafsi yako limeondoka kwako, na vitu vyote vya anasa na vya fahari vimepotea kwako; kamwe havitapatikana tena.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hawatavipata tena kamwe.” Kigiriki kina kitenzi cha nafsi ya tatu wingi bila mtendaji aliyetajwa.
    reason: alternative_reading
lexical_decisions:
- source_word: ὀπώρα
  choice: matunda
  rationale: Neno hili humaanisha matunda, hasa yaliyoiva au ya mwishoni mwa majira. Wingi wa Kiswahili unafaa kwa jina la jumla na unadumisha picha ya mazao yaliyotamaniwa.
- source_word: σου τῆς ἐπιθυμίας τῆς ψυχῆς
  choice: ambayo nafsi yako iliyatamani
  rationale: Muundo huu wa asili unahifadhi ψυχή kama “nafsi” na wazo la hamu kubwa, huku ukiifanya sentensi isomeke kwa Kiswahili cha kawaida.
- source_word: ἀπῆλθεν ἀπὸ σοῦ
  choice: yameondoka kwako
  rationale: Kauli hii inaonyesha kuondoka ambako matokeo yake yanaendelea kuwapo; wakati timilifu wa Kiswahili unaonyesha hali hiyo vizuri.
- source_word: πάντα τὰ λιπαρὰ
  choice: vitu vyote vya anasa
  rationale: Katika orodha ya bidhaa za Babeli, λιπαρά inaelekea kumaanisha vitu vya kifahari au vya anasa kwa upana, si vyakula vyenye mafuta pekee.
- source_word: τὰ λαμπρὰ
  choice: vya fahari
  rationale: Hapa λαμπρά hueleza vitu vyenye mng’ao, uzuri wa kujionyesha, au utukufu wa mali; “vya fahari” ni cha asili katika muktadha wa anasa.
- source_word: ἀπώλετο ἀπὸ σοῦ
  choice: vimekupotea
  rationale: Kitenzi kinaweza kumaanisha kuangamia au kupotea. “Vimekupotea” huonyesha kwamba Babeli amevipoteza bila kulazimisha wazo la namna vilivyoharibiwa.
- source_word: οὐκέτι οὐ μὴ
  choice: kamwe ... tena
  rationale: Mkusanyiko huu wa ukanushi unasisitiza mwisho usioweza kubadilishwa; muundo wa Kiswahili “kamwe ... tena” huwasilisha msisitizo huo kwa kawaida.
- source_word: αὐτὰ εὑρήσουσιν
  choice: havitapatikana
  rationale: Kitenzi cha nafsi ya tatu wingi hakitaji mtendaji. Kauli ya kutendwa ya Kiswahili huwasilisha maana isiyo na mtendaji maalumu bila kuongeza mtu ambaye hakutajwa katika Kigiriki.
theological_decisions:
- issue: Mtendaji asiyeelezwa wa εὑρήσουσιν
  choice: 'Kauli isiyo na mtendaji maalumu: “havitapatikana”'
  alternative: “watu hawatavipata”
  rationale: Kigiriki kina nafsi ya tatu wingi bila kutaja mtendaji, ambayo inaweza kutumiwa kwa maana isiyo maalumu. Kauli ya Kiswahili “havitapatikana” huhifadhi kutotajwa huko na kusisitiza kutorejea kwa mali hizo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Nafsi” imedumishwa ili kuonyesha kina cha hamu; “vitu vya anasa na vya fahari” kinaakisi muktadha wa biashara na utajiri wa Babeli.
