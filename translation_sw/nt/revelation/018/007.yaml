id: REV.18.7
reference: Revelation 18:7
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὅσα ἐδόξασεν αὑτὴν καὶ ἐστρηνίασεν, τοσοῦτον δότε αὐτῇ βασανισμὸν καὶ πένθος. ὅτι ἐν τῇ καρδίᾳ αὐτῆς λέγει ὅτι Κάθημαι βασίλισσα, καὶ χήρα οὐκ εἰμί, καὶ πένθος οὐ μὴ ἴδω.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/007.yaml
  text: As much as she glorified herself and lived in luxury[a], give her that much torment and mourning. For she says in her heart, ‘I sit as a queen, and I am not a widow[b], and I will certainly never see mourning.’
translation:
  language: sw
  text: Kwa kadiri alivyojitukuza mwenyewe na kuishi kwa anasa[a], kwa kadiri hiyo hiyo mpeni mateso na maombolezo. Kwa maana anasema moyoni mwake, ‘Nimeketi kama malkia; mimi si mjane, wala hakika sitaona maombolezo kamwe.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuishi kwa kujifurahisha kupita kiasi” au “kuishi kwa anasa za kupindukia.” Kitenzi cha Kigiriki kinaweza kumaanisha maisha ya fahari, anasa na kujiachia.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσα ... τοσοῦτον
  choice: Kwa kadiri ... kwa kadiri iyo hiyo
  rationale: Inahifadhi muundo wa ulinganifu unaoonyesha kwamba adhabu inalingana na kiwango cha kujitukuza na kuishi kwa anasa.
- source_word: ἐδόξασεν αὑτὴν
  choice: alivyojitukuza mwenyewe
  rationale: Kitenzi cha kujirejelea kinaonyesha wazi kujikweza kwa Babeli; ‘kujitukuza mwenyewe’ ni Kiswahili cha kawaida na chenye uzito unaofaa.
- source_word: ἐστρηνίασεν
  choice: kuishi kwa anasa
  rationale: Kinawasilisha maisha ya fahari na kujifurahisha kupita kiasi bila kukifanya kitenzi kihusu uasherati pekee.
- source_word: δότε αὐτῇ
  choice: mpeni
  rationale: Ni amri ya moja kwa moja yenye toni ya hukumu, na inaendana kwa kawaida na ‘mateso na maombolezo.’
- source_word: βασανισμὸν
  choice: mateso
  rationale: Neno hili linadumisha ukali wa hukumu bila kuibana maana iwe mateso ya kimwili pekee.
- source_word: πένθος
  choice: maombolezo
  rationale: Linafaa kwa huzuni nzito inayotokana na hasara au hukumu, na limerudiwa katika sehemu zote mbili kama ilivyo katika Kigiriki.
- source_word: ἐν τῇ καρδίᾳ αὐτῆς λέγει
  choice: anasema moyoni mwake
  rationale: Inahifadhi nahau ya kibiblia kuhusu majivuno na uhakika wa ndani.
- source_word: Κάθημαι βασίλισσα
  choice: Nimeketi kama malkia
  rationale: Inahifadhi picha ya kuketi katika cheo cha kifalme na hali ya usalama inayodhaniwa; wakati timilifu wa Kiswahili unaeleza hali ya sasa inayotokana na kuketi huko.
- source_word: χήρα οὐκ εἰμί
  choice: mimi si mjane
  rationale: Ni tafsiri ya moja kwa moja inayohifadhi picha ya mwanamke anayedai kutoweza kupatwa na upweke au hasara.
- source_word: οὐ μὴ ἴδω
  choice: wala hakika sitaona ... kamwe
  rationale: Mchanganyiko wa ‘hakika’ na ‘kamwe’ unawakilisha ukanushaji wa Kigiriki wenye mkazo mkubwa na majivuno ya uhakika.
theological_decisions:
- issue: Babeli kuwasilishwa kama mwanamke, malkia na mjane
  choice: Kudumisha nafsi ya kike katika ‘malkia’ na ‘mjane,’ huku kiwakilishi kikieleweka kupitia muktadha wa Kiswahili.
  alternative: Kuifanya Babeli kuwa mji au mfumo usio na taswira ya mwanamke.
  rationale: Kigiriki kinadumisha taswira ya Babeli kama mwanamke, nayo ni muhimu kwa nguvu ya kifasihi na kiteolojia ya kifungu.
- issue: Lugha ya hukumu katika βασανισμός
  choice: mateso
  alternative: maumivu; kuteswa kikatili
  rationale: ‘Mateso’ yanaonyesha ukali wa malipo ya hukumu bila kuingiza njia maalumu ya mateso ambayo kifungu hakitaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kifasihi. Muundo wa uwiano, taswira ya kifalme na ukanushaji wenye mkazo vimedumishwa bila kufanya sentensi kuwa ngumu isivyo lazima.
