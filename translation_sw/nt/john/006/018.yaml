lexical_decisions:
- source_word: ἥ τε θάλασσα
  choice: Nayo bahari
  rationale: θάλασσα ni “bahari.” Ingawa muktadha ni Bahari ya Galilaya, Kigiriki kimetumia nomino ya kawaida, hivyo “bahari” imedumishwa. τε ni kiunganishi hafifu, kinachowakilishwa kwa kawaida na “nayo.”
- source_word: ἀνέμου μεγάλου
  choice: upepo mkali
  rationale: ἄνεμος ni “upepo,” na μέγας katika muktadha wa hali ya hewa hutafsiriwa kwa Kiswahili cha kawaida kuwa “mkali,” bila kuongeza maana ya uharibifu ambayo haijasemwa wazi.
- source_word: πνέοντος
  choice: ulikuwa ukivuma
  rationale: Kitenzi-ushiriki cha wakati uliopo kinaonyesha hali iliyoendelea na kinahusiana na ἀνέμου. Kishazi “kwa sababu ... ulikuwa ukivuma” kinaeleza kwa Kiswahili cha asili uhusiano wa kisababishi na hali endelevu.
- source_word: διεγείρετο
  choice: ilikuwa ikichafuka
  rationale: Kauli tendwa ya wakati usiotimilifu inaonyesha mchakato uliokuwa ukiendelea kuathiri bahari. “Ilikuwa ikichafuka” ni usemi wa kawaida kuhusu maji yanayovurugwa na upepo na hudumisha wazo la hali inayoendelea bila kuingiza taswira isiyoelezwa wazi.
