id: JHN.6.37
reference: John 6:37
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: πᾶν ὃ δίδωσίν μοι ὁ πατὴρ πρὸς ἐμὲ ἥξει, καὶ τὸν ἐρχόμενον πρός ⸀με οὐ μὴ ἐκβάλω ἔξω,
base_translation:
  language: en
  yaml_path: translation/nt/john/006/037.yaml
  text: All that the Father gives me will come to me[b][a], and the one who comes to me I will certainly not cast out.
translation:
  language: sw
  text: Kila ambacho Baba ananipa kitakuja kwangu,[a] nami yule anayekuja kwangu sitamtupa nje kamwe.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wote ambao Baba ananipa watakuja kwangu.” Kigiriki kinatumia usemi wa umoja wenye maana ya kijumla.
    reason: lexical_alternative
  - marker: b
    text: Au, “hakika sitamtupa nje” au “kwa vyovyote sitamtupa nje.” Usemi wa Kigiriki una ukanushi wenye mkazo.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν ὃ
  choice: Kila ambacho
  rationale: Muundo wa Kigiriki ni umoja wa jinsia isiyo ya kiume wala ya kike wenye maana ya kijumla. “Kila ambacho” huhifadhi kwa kiasi kikubwa umbo hilo bila kuligeuza moja kwa moja kuwa “kila mtu ambaye.”
- source_word: δίδωσίν μοι
  choice: ananipa
  rationale: Wakati uliopo wa Kigiriki umetafsiriwa kwa wakati uliopo wa Kiswahili, bila kuamua kama tendo hilo linaendelea au limekamilika.
- source_word: ὁ πατήρ
  choice: Baba
  rationale: Huhifadhi jina lenye kibainishi katika matumizi ya Yohana bila kuongeza kimilikishi “yangu,” ambacho hakipo wazi katika Kigiriki.
- source_word: πρὸς ἐμὲ ἥξει
  choice: kitakuja kwangu
  rationale: Ni Kiswahili cha kawaida kinachoonyesha kuja kwa Yesu na kinapatana na umoja wa kijumla wa “kila ambacho.”
- source_word: τὸν ἐρχόμενον πρός με
  choice: yule anayekuja kwangu
  rationale: Huwakilisha kirai cha Kigiriki chenye kibainishi na kitenzi-jina cha wakati uliopo, huku kikibaki cha kawaida na wazi kwa msomaji.
- source_word: οὐ μὴ ἐκβάλω ἔξω
  choice: sitamtupa nje kamwe
  rationale: “Kamwe” huonyesha ukanushi mkazo wa οὐ μή, na “kumtupa nje” huhifadhi maana ya kufukuza au kuondoa iliyo katika ἐκβάλω ἔξω.
theological_decisions:
- issue: Umoja wa kijumla usio wa kibinafsi katika πᾶν ὃ kuhusu kutoa kwa Baba na kuja kwa Yesu
  choice: Kila ambacho Baba ananipa
  alternative: Kila mtu ambaye Baba ananipa
  rationale: Tafsiri hii huhifadhi muundo wa Kigiriki wa umoja wa kijumla na haimalizi kimyakimya mvutano wa iwapo kundi linatazamwa kwa pamoja au watu binafsi wanakusudiwa katika muktadha.
- issue: Nguvu ya ahadi katika οὐ μὴ ἐκβάλω ἔξω
  choice: sitamtupa nje kamwe
  alternative: hakika sitamtupa nje
  rationale: Huhifadhi ukanushi wenye mkazo na hakikisho la Yesu kwa anayekuja kwake, bila kulipanua kuwa tamko la mfumo fulani wa kimadhehebu kuhusu kudumu au kuanguka kutoka katika imani.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Kila ambacho” ni cha karibu na muundo wa chanzo lakini kinaweza kusikika kisicho cha kawaida kidogo; tanbihi inaonyesha tafsiri ya kibinafsi iliyo ya kawaida zaidi. Alama za tanbihi zimewekwa karibu na vifungu vinavyohusika.
