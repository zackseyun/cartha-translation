  source_fidelity: “Kila ambacho Baba ananipa” appropriately retains the Greek neuter singular collective force of πᾶν ὃ without deciding that the referent must be expressed as individual people. “Ananipa” preserves the present tense, “kitakuja kwangu” accurately renders the future coming, and “sitamtupa nje kamwe” clearly conveys the emphatic οὐ μὴ ... ἔξω.
  naturalness: The wording is clear, grammatical Standard East African Swahili, with a suitably dignified biblical register. Although “Kila ambacho” is more formal and slightly less conversational than a personal plural rendering, it is appropriate here because it reflects the source construction; the footnote supplies the more personal alternative.
  terminology: “Baba,” “kwangu,” and “kumtupa nje” are established, natural biblical terminology. The phrasing does not introduce doctrinal conclusions beyond the verse. Footnote markers are correctly placed and each footnote corresponds to its marked expression.
