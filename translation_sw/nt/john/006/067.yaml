  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἶπεν οὖν ὁ Ἰησοῦς τοῖς δώδεκα· Μὴ καὶ ὑμεῖς θέλετε ὑπάγειν;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/067.yaml
  text: So Jesus said to the Twelve[a], “You do not want to go away too, do you?”
translation:
  language: sw
  text: Basi Yesu akawaambia wale Kumi na Wawili, “Ninyi pia hamtaki kuondoka, sivyo?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Je, ninyi pia mnataka kuondoka?” Swali la Kigiriki limetumia μή, neno ambalo mara nyingi huonyesha kwamba msemaji anatazamia jibu la “hapana.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Basi
  rationale: Inaonyesha mwendelezo na hitimisho linalotokana na kuondoka kwa wanafunzi wengi katika muktadha uliotangulia, kwa lugha ya kawaida na yenye hadhi.
- source_word: τοῖς δώδεκα
  choice: wale Kumi na Wawili
  rationale: Kirai hiki ni jina linalotambulika la kundi la ndani la wanafunzi wa Yesu. Neno “wale” linasaidia kukifanya kiwe cha asili katika Kiswahili bila kuongeza neno lisilokuwapo kama “wanafunzi.”
- source_word: Μὴ καὶ ὑμεῖς
  choice: Ninyi pia hamtaki ... sivyo?
  rationale: μή katika swali kwa kawaida hutazamia jibu la kukataa. Muundo huu wa Kiswahili unaonyesha matarajio hayo bila kuyafanya kuwa kauli ya uhakika; “ninyi pia” huhifadhi καί na msisitizo wa ὑμεῖς.
- source_word: θέλετε
  choice: mnataka
  rationale: Katika muktadha huu kitenzi kinaeleza kutaka au kuwa tayari kufanya jambo. “Kutaka” ni sawa la kawaida na la moja kwa moja katika Kiswahili cha kisasa.
- source_word: ὑπάγειν
  choice: kuondoka
  rationale: Katika muktadha wa wanafunzi walioacha kumfuata Yesu, “kuondoka” huonyesha kwenda zao bila kufafanua kupita kiasi kwamba wanamwacha Yesu moja kwa moja.
theological_decisions:
- issue: Nguvu ya swali la Yesu linaloanzishwa na μή
  choice: Swali hasi linalodokeza kwamba Yesu anatazamia jibu la “hapana,” bila kulifanya kuwa dai la uhakika
  alternative: 'Swali lisiloegemea upande wowote: “Je, ninyi pia mnataka kuondoka?”'
  rationale: Katika maswali ya Kigiriki, μή kwa kawaida huonyesha matarajio ya jibu hasi. “Hamtaki ... sivyo?” huhifadhi kidokezo hicho na pia mvutano wa swali, bila kuamua jibu kwa niaba ya wale Kumi na Wawili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, ya kawaida na yenye hadhi. Muundo wa swali umechaguliwa ili usikike wa asili huku ukihifadhi matarajio ya jibu hasi yaliyo katika Kigiriki.
