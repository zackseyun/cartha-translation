  source_fidelity: '"Basi" appropriately represents οὖν as narrative/logical continuation. "wale Kumi na Wawili" retains the recognized designation τοῖς δώδεκα without unnecessarily supplying "wanafunzi." The negative question "Ninyi pia hamtaki kuondoka, sivyo?" accurately conveys μή, καί, the emphatic ὑμεῖς, θέλετε, and ὑπάγειν, including the expectation of a negative answer without making it certain.'
  naturalness: The wording is clear, idiomatic Standard East African Swahili, and appropriately dignified for direct speech. The tag "sivyo?" naturally communicates the negatively oriented question.
