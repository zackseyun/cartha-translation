base_translation:
  language: en
  yaml_path: translation/nt/john/006/029.yaml
  text: 'Jesus answered and said to them[b][a], “This is the work of God: that you believe in the one whom he has sent.”'
translation:
  language: sw
  text: 'Yesu akajibu na kuwaambia, “Hii ndiyo kazi ya Mungu[a]: kwamba mmwamini[b] yule ambaye Mungu amemtuma.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kazi anayoitaka Mungu” au “kazi anayoifanya Mungu.” Usemi wa Kigiriki “kazi ya Mungu” unaweza kueleweka kwa njia zaidi ya moja; maneno ya matini kuu yanadumisha utata huo.
    reason: alternative_reading
  - marker: b
    text: Au “mmtumainie.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη … καὶ εἶπεν αὐτοῖς
  choice: akajibu na kuwaambia
  rationale: Inahifadhi vitenzi viwili vya Kigiriki kwa Kiswahili cha kawaida cha masimulizi, huku ‘kuwaambia’ ikionyesha wazi walengwa wa maneno yake.
- source_word: Τοῦτό ἐστιν
  choice: Hii ndiyo
  rationale: Muundo huu wa kawaida unadumisha msisitizo wa kiwakilishi cha kuonyesha pamoja na kitenzi kishirikishi.
- source_word: τὸ ἔργον τοῦ θεοῦ
  choice: kazi ya Mungu
  rationale: Tafsiri hii iliyo karibu na Kigiriki inadumisha uwezekano wa kuelewa usemi huo kuwa kazi anayoitaka Mungu au kazi anayoifanya Mungu.
- source_word: ἵνα πιστεύητε
  choice: kwamba mmwamini
  rationale: ‘Kwamba’ hutambulisha yaliyomo katika kauli iliyotangulia, na ‘mmwamini’ huonyesha wazi nafsi ya pili wingi iliyomo katika kitenzi cha Kigiriki.
- source_word: εἰς ὃν
  choice: yule ambaye
  rationale: Pamoja na kitenzi ‘kuamini,’ muundo huu unatoa kwa kawaida maana ya kumwamini mtu na kudumisha kwamba kinachoaminiwa ni mtu.
- source_word: ἀπέστειλεν ἐκεῖνος
  choice: Mungu amemtuma
  rationale: Kurudia ‘Mungu’ kunaondoa utata usio wa lazima wa viwakilishi katika Kiswahili na kuweka wazi kwamba Mungu ndiye aliyemtuma huyo mtu; wakati timilifu unaonyesha tendo lililofanyika lenye umuhimu unaoendelea.
theological_decisions:
- issue: Maana ya ‘kazi ya Mungu’ (τοῦ θεοῦ)
  choice: Kudumisha usemi ‘kazi ya Mungu’ katika matini kuu.
  alternative: kazi anayoitaka Mungu; kazi anayoifanya Mungu
  rationale: Umilikishi wa Kigiriki unaweza kueleweka kwa zaidi ya njia moja. Muktadha unaweza kuelekeza ama kwenye kazi ambayo Mungu anawataka watu wafanye ama kwenye kazi ambayo Mungu mwenyewe anaifanya. Tafsiri haichagui kimya kimya upande mmoja.
- issue: Maana ya πιστεύητε εἰς
  choice: mmwamini
  alternative: mweke tumaini lenu katika
  rationale: ‘Kumwamini’ ni tafsiri ya kawaida, wazi, na ya moja kwa moja ya πιστεύω εἰς katika Yohana, huku wazo la kumtumainia likitajwa kama maana mbadala ya kileksika.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. Muundo ‘akajibu na kuwaambia’ unadumisha vitenzi viwili vya chanzo bila kuwa mzito, na ‘kazi ya Mungu’ huhifadhi mvutano wa maana uliopo katika Kigiriki.
