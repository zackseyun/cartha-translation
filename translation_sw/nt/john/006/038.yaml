  text: ὅτι καταβέβηκα ⸀ἀπὸ τοῦ οὐρανοῦ οὐχ ἵνα ποιῶ τὸ θέλημα τὸ ἐμὸν ἀλλὰ τὸ θέλημα τοῦ πέμψαντός με·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/038.yaml
  text: For I have come down from heaven, not to do my own will, but the will of the one who sent me.
translation:
  language: sw
  text: Kwa maana nimeshuka kutoka mbinguni, si ili nifanye mapenzi yangu mwenyewe, bali mapenzi ya yule aliyenituma.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: Kwa maana
  rationale: Katika muktadha huu neno hili linaanzisha sababu au maelezo ya kauli iliyotangulia; “Kwa maana” ni ya kawaida na huhifadhi uhusiano huo wa kimantiki.
- source_word: καταβέβηκα
  choice: nimeshuka
  rationale: Kauli ya wakati timilifu inaonyesha tendo lililotimia lenye umuhimu wa sasa. “Nimeshuka” huhifadhi maana hiyo kwa Kiswahili cha kawaida.
- source_word: ἀπὸ τοῦ οὐρανοῦ
  choice: kutoka mbinguni
  rationale: Hii ni tafsiri ya kawaida na ya asili inayohifadhi taswira ya asili ya mbinguni.
- source_word: οὐχ ἵνα ποιῶ
  choice: si ili nifanye
  rationale: Muundo huu unaonyesha kusudi lililokanushwa. “Si ili nifanye” huwasilisha wazi maana ya kusudi bila kuwa mzito.
- source_word: τὸ θέλημα τὸ ἐμὸν
  choice: mapenzi yangu mwenyewe
  rationale: “Mapenzi” huhifadhi uzito wa θέλημα, na “mwenyewe” huonyesha mkazo wa kiwakilishi na kuimarisha utofautishaji unaofuata.
- source_word: ἀλλὰ
  choice: bali
  rationale: “Bali” huonyesha kwa uwazi upinzani kati ya kusudi lililokanushwa na kusudi halisi.
- source_word: τὸ θέλημα τοῦ πέμψαντός με
  choice: mapenzi ya yule aliyenituma
  rationale: Kirai cha kisifa chenye kibainishi kimetafsiriwa kwa usemi wa kawaida wa Kiswahili bila kumtaja wazi zaidi ya jinsi Kigiriki kinavyofanya.
theological_decisions:
- issue: Kushuka kwa Yesu kutoka mbinguni na maana yake ya kikristo
  choice: Kauli imetafsiriwa moja kwa moja kuwa “nimeshuka kutoka mbinguni.”
  alternative: Kuifanya kuwa sitiari tu ya kutumwa na Mungu
  rationale: Andiko lenyewe linaeleza asili yake kwa lugha ya kutoka mbinguni; tafsiri haipaswi kudhoofisha kauli hiyo wala kuongeza ufafanuzi wa kimafundisho.
- issue: Uhusiano kati ya mapenzi ya Yesu na mapenzi ya aliyemtuma
  choice: Neno “mapenzi” limetumiwa katika sehemu zote mbili, na utofautishaji umehifadhiwa.
  alternative: Kutafsiri kwa upanuzi kama “ninachotaka” na “anachotaka”
  rationale: Ulinganifu na mvutano wa andiko kuhusu utume na utiifu vinahifadhiwa bila kuvieleza kwa mfumo wa baadaye wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi unahifadhi ulinganifu na utofautishaji wa Kigiriki bila kuwa mgumu.
