  yaml_path: translation/nt/john/006/049.yaml
  text: Your fathers ate the manna in the wilderness[a], and they died.
translation:
  language: sw
  text: Baba zenu[a] walikula mana jangwani, na wakafa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mababu zenu.” Kigiriki husema hasa “baba zenu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πατέρες ὑμῶν
  choice: Baba zenu
  rationale: Neno πατέρες kwa maana ya msingi ni “baba,” lakini hapa linawarejelea mababu wa Waisraeli wa kizazi cha jangwani. “Baba zenu” ni usemi wa kibiblia unaoeleweka katika Kiswahili na unadumisha umbo na nguvu ya kihistoria ya Kigiriki bila kulipanua kuwa neno lisilo na jinsia.
- source_word: ἔφαγον
  choice: walikula
  rationale: Kitenzi cha wakati uliopita kinaeleza tukio kamili la kihistoria; “walikula” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: ἐν τῇ ἐρήμῳ
  choice: jangwani
  rationale: “Jangwani” ni usemi wa kawaida wa kibiblia kwa eneo la Israeli wakati wa kutoka Misri na unasikika kwa kawaida katika Kiswahili sanifu.
- source_word: τὸ μάννα
  choice: mana
  rationale: “Mana” ndilo neno lililozoeleka katika Kiswahili kwa chakula kilichotolewa kutoka mbinguni. Kiswahili hakihitaji kibainishi kinacholingana moja kwa moja na τὸ katika muktadha huu.
- source_word: καὶ ἀπέθανον
  choice: lakini walikufa
  rationale: 'Ingawa καί kwa kawaida ni “na,” hapa inaunganisha kauli kwa utofautishaji wa wazi: walikula mana, hata hivyo wakafa. “Lakini” huwasilisha uhusiano huo kwa Kiswahili cha kawaida bila kubadili hoja ya sentensi.'
theological_decisions:
- issue: Rejeo kwa kizazi cha Israeli kilichokuwa jangwani
  choice: Baba zenu
  alternative: Mababu zenu
  rationale: “Baba zenu” hudumisha usemi wa Kigiriki na nguvu ya Yesu kuwaunganisha wasikilizaji wake na waliowatangulia jangwani. Katika muktadha huu lina maana ya mababu, lakini si lazima maana hiyo mbadala iingizwe katika matini.
- issue: Utofauti kati ya kula mana na kufa
  choice: lakini walikufa
  alternative: na walikufa
  rationale: Muktadha unaweka mana iliyoliwa jangwani kinyume na mkate unaotoa uzima. “Lakini” huonyesha utofauti uliokusudiwa na καί katika mfuatano huu bila kuongeza dai la kitheolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa, fasaha na chenye hadhi. Sentensi ni fupi na ya moja kwa moja; “jangwani” na “mana” huhifadhi mwangwi wa simulizi la Kutoka.
