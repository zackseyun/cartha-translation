lexical_decisions:
- source_word: Ὡς δὲ
  choice: ilipofika
  rationale: Muundo huu unaanzisha hatua mpya ya simulizi kwa kutaja wakati. Kishazi cha Kiswahili “Jioni ilipofika” kinatoa maana ya asili kwa ufasaha bila kuongeza neno la wazi lisilokuwapo katika Kigiriki.
- source_word: ὀψία ἐγένετο
  choice: Jioni ilipofika
  rationale: Hii ni nahau inayomaanisha kuingia kwa wakati wa jioni; “Jioni ilipofika” ni Kiswahili cha kawaida na chenye hadhi.
- source_word: κατέβησαν
  choice: walishuka
  rationale: Kitenzi kinaonyesha mwendo wa kuelekea chini. “Walishuka” kinahifadhi maana hiyo na kinafaa kwa mtazamo wa simulizi.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: wanafunzi wake
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaowasilisha kwa usahihi nomino pamoja na umilikaji.
- source_word: ἐπὶ τὴν θάλασσαν
  choice: kwenda baharini
  rationale: Baada ya kitenzi cha mwendo, ἐπί pamoja na hali ya accusative huonyesha kuelekea mahali. “Kwenda baharini” linaonyesha wazi mwelekeo huo, huku “baharini” likihifadhi θάλασσα, yaani “bahari.”
