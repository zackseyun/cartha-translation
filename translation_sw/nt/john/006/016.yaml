  text: Jioni ilipofika, wanafunzi wake walishuka kwenda baharini[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ziwani.” Mkusanyiko huu wa maji ni Bahari ya Galilaya, ambayo kitaalamu ni ziwa, lakini maandishi ya Kigiriki yanasema “bahari” (θάλασσα).
