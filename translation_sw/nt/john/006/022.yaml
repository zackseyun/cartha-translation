id: JHN.6.22
reference: John 6:22
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Τῇ ἐπαύριον ὁ ὄχλος ὁ ἑστηκὼς πέραν τῆς θαλάσσης ⸀εἶδον ὅτι πλοιάριον ἄλλο οὐκ ἦν ἐκεῖ εἰ μὴ ⸀ἕν, καὶ ὅτι οὐ συνεισῆλθεν τοῖς μαθηταῖς αὐτοῦ ὁ Ἰησοῦς εἰς τὸ ⸀πλοῖον ἀλλὰ μόνοι οἱ μαθηταὶ αὐτοῦ ἀπῆλθον·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/022.yaml
  text: On the next day[a], the crowd that had been standing on the other side of the sea saw that no other small boat had been there except one, and that Jesus had not gone with his disciples into the boat[b], but that his disciples had gone away alone.
translation:
  language: sw
  text: Siku iliyofuata, umati uliokuwa umesimama ng’ambo ya bahari uliona kwamba hapakuwa na mashua nyingine ndogo[a] isipokuwa moja tu, na kwamba Yesu hakuwa ameingia katika mashua[b] pamoja na wanafunzi wake, bali wanafunzi wake walikuwa wameondoka peke yao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mashua”; neno la Kigiriki πλοιάριον lina umbo la udogo.
    reason: lexical_alternative
  - marker: b
    text: Baadhi ya hati na matoleo hutofautiana kati ya “mashua ndogo” (πλοιάριον) na “mashua” (πλοῖον) katika mstari huu; tafsiri hii inafuata maneno ya maandishi ya Kigiriki yaliyochapishwa katika kila kishazi.
    reason: textual_variant
lexical_decisions:
- source_word: Τῇ ἐπαύριον
  choice: Siku iliyofuata
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha mpito wa wakati kwenda siku inayofuata.
- source_word: ὁ ὄχλος ὁ ἑστηκὼς
  choice: umati uliokuwa ukibaki
  rationale: Kitenzi kishirikishi cha wakati timilifu kinaonyesha hali inayoendelea baada ya kusimama au kubaki mahali; ‘uliokuwa ukibaki’ ni ya asili na inafaa muktadha.
- source_word: πέραν τῆς θαλάσσης
  choice: ng’ambo ya bahari
  rationale: Hueleza mahali upande wa pili wa bahari kwa Kiswahili cha kawaida na kifupi.
- source_word: εἶδον
  choice: uliona
  rationale: Hudumisha maana ya msingi ya utambuzi kwa kuona; upatanisho wa umoja unafuata nomino ya Kiswahili ‘umati’.
- source_word: πλοιάριον
  choice: mashua ndogo
  rationale: Huhifadhi umbo la udogo la neno la Kigiriki bila kutumia usemi usio wa kawaida.
- source_word: ἄλλο οὐκ ἦν ἐκεῖ εἰ μὴ ἕν
  choice: hapakuwa na mashua nyingine ndogo isipokuwa moja tu
  rationale: Huhifadhi msisitizo wa kwamba kulikuwa na mashua moja pekee.
- source_word: συνεισῆλθεν
  choice: hakuwa ameingia ... pamoja na
  rationale: Huhifadhi maana ya kuingia pamoja na wengine, huku muktadha ukionyesha kuingia katika mashua.
- source_word: εἰς τὸ πλοῖον
  choice: katika mashua
  rationale: Neno πλοῖον si umbo la udogo; ‘mashua’ ni tafsiri ya kawaida na inahifadhi tofauti na ‘mashua ndogo’ katika kishazi cha kwanza.
- source_word: μόνοι
  choice: peke yao
  rationale: Huonyesha wazi kuwa wanafunzi waliondoka bila Yesu.
- source_word: ἀπῆλθον
  choice: walikuwa wameondoka
  rationale: Wakati timilifu wa Kiswahili unafaa mtazamo wa umati kuhusu tukio lililokuwa limetokea tayari.
