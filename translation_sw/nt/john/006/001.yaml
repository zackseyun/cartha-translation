id: JHN.6.1
reference: John 6:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Μετὰ ταῦτα ἀπῆλθεν ὁ Ἰησοῦς πέραν τῆς θαλάσσης τῆς Γαλιλαίας τῆς Τιβεριάδος.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/001.yaml
  text: After these things[a], Jesus went away to the other side of the Sea of Galilee[b], which is the Sea of Tiberias.
translation:
  language: sw
  text: Baada ya hayo, Yesu akaenda ng’ambo ya Bahari ya Galilaya, yaani, Bahari ya Tiberia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bahari ya Galilaya pia ilijulikana kama Bahari ya Tiberia; majina yote mawili yanataja eneo lilelile la maji.
    reason: cultural_note
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: Baada ya hayo
  rationale: Huhifadhi usemi wa mpito wa Yohana na wingi wa ταῦτα kwa Kiswahili cha kawaida na chenye heshima.
- source_word: ἀπῆλθεν
  choice: akaenda
  rationale: Katika muktadha huu, kitenzi kinaonyesha Yesu kuondoka na kwenda mahali pengine; “akaenda” ni cha asili katika usimulizi wa Kiswahili bila kupoteza mwendo huo.
- source_word: πέραν
  choice: ng’ambo ya
  rationale: Ni usemi wa kawaida wa Kiswahili kwa kwenda upande wa pili wa eneo la maji.
- source_word: τῆς θαλάσσης τῆς Γαλιλαίας
  choice: Bahari ya Galilaya
  rationale: Ingawa kijiografia ni ziwa, θάλασσα na jina lililozoeleka katika mapokeo ya Biblia vinaungwa vizuri na “Bahari ya Galilaya.”
- source_word: τῆς Τιβεριάδος
  choice: yaani, Bahari ya Tiberia
  rationale: Kirai hiki kinaweka jina la pili kwa bahari ileile; “yaani” huonyesha uhusiano huo kwa uwazi na kwa Kiswahili cha asili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida wa simulizi na hadhi inayofaa maandiko. Muundo wa Kigiriki wenye majina mawili ya bahari umefafanuliwa kwa “yaani” bila kubadili rejeo lake.
