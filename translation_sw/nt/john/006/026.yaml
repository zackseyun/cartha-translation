  text: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς καὶ εἶπεν· Ἀμὴν ἀμὴν λέγω ὑμῖν, ζητεῖτέ με οὐχ ὅτι εἴδετε σημεῖα ἀλλ’ ὅτι ἐφάγετε ἐκ τῶν ἄρτων καὶ ἐχορτάσθητε·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/026.yaml
  text: Jesus answered them[a], “Truly, truly, I say to you, you are seeking me not because you saw signs, but because you ate of the loaves and were filled.
translation:
  language: sw
  text: Yesu akawajibu, “Kweli, kweli, nawaambia, mnanitafuta si kwa sababu mliona ishara, bali kwa sababu mlikula mikate ile mkashiba.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς καὶ εἶπεν
  choice: Yesu akawajibu
  rationale: Kauli ya Kigiriki ‘akajibu na kusema’ ni utangulizi maradufu wa usemi; ‘akawajibu’ ni Kiswahili cha asili na usemi unaofuata unawakilisha kikamilifu tendo la kusema.
- source_word: Ἀμὴν ἀμὴν
  choice: Kweli, kweli
  rationale: Inahifadhi uradidi wenye msisitizo wa Yesu katika Injili ya Yohana huku maana yake ikiwa wazi kwa msomaji wa Kiswahili cha sasa.
- source_word: λέγω ὑμῖν
  choice: nawaambia
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kauli hii nzito ya utangulizi.
- source_word: ζητεῖτέ με
  choice: mnanitafuta
  rationale: Wakati wa sasa wa Kigiriki unaonyesha tendo linaloendelea; umbo la Kiswahili ‘mnanitafuta’ linawasilisha hilo kwa kawaida.
- source_word: οὐχ ὅτι ... ἀλλ’ ὅτι
  choice: si kwa sababu ... bali kwa sababu
  rationale: Muundo huu unaonyesha utofautishaji wa sababu au nia, nao unasikika wazi na wa asili kwa Kiswahili.
- source_word: εἴδετε
  choice: mliona
  rationale: Inadumisha maana ya kuona bila kuongeza wazo la kuelewa kiroho ambalo halijaelezwa moja kwa moja na kitenzi.
- source_word: σημεῖα
  choice: ishara
  rationale: ‘Ishara’ huhifadhi msamiati muhimu wa Yohana wa matendo yanayoelekeza kwenye maana iliyo zaidi ya tendo lenyewe; ‘miujiza’ ingepunguza wigo huo.
- source_word: ἐφάγετε ἐκ τῶν ἄρτων
  choice: mlikula mikate
  rationale: Kiswahili cha asili hakihitaji kutafsiri ἐκ kwa ‘kutoka katika’ hapa. Wingi ‘mikate’ unahifadhi ἄρτων na rejeo kwa mikate iliyozidishwa.
- source_word: ἐχορτάσθητε
  choice: mkashiba
  rationale: Kitenzi ‘kushiba’ huonyesha kwa usahihi kula hadi kutosheka, na ni cha kawaida zaidi kuliko tafsiri ya kimofolojia kama ‘mlijazwa’.
theological_decisions:
- issue: Maana ya σημεῖα katika muktadha wa Yohana
  choice: ishara
  alternative: miujiza; ishara za kimiujiza
  rationale: Yohana hutumia neno hili kwa matendo ya Yesu ambayo yana maana ya ufunuo na kuelekeza zaidi ya tukio lenyewe. ‘Ishara’ huhifadhi mvutano huo bila kuongeza ufafanuzi katika matini.
- issue: Utangulizi maradufu ἀπεκρίθη ... καὶ εἶπεν
  choice: Yesu akawajibu
  alternative: Yesu akawajibu na kusema
  rationale: Hili ni jambo la mtindo, si la fundisho. Kiswahili cha kawaida hufupisha uradidi huu bila kupoteza tendo la kusema, ambalo linaonekana wazi katika nukuu inayofuata.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Mtindo unadumisha uzito wa kauli ‘Kweli, kweli’ na msamiati wa Kiyohana ‘ishara’ bila kuwa mgumu au wa kidhehebu.
