id: JHN.6.5
reference: John 6:5
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐπάρας οὖν ⸂τοὺς ὀφθαλμοὺς ὁ Ἰησοῦς⸃ καὶ θεασάμενος ὅτι πολὺς ὄχλος ἔρχεται πρὸς αὐτὸν λέγει ⸀πρὸς Φίλιππον· Πόθεν ⸀ἀγοράσωμεν ἄρτους ἵνα φάγωσιν οὗτοι;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/005.yaml
  text: So Jesus[a], lifting up his eyes and seeing that a large crowd was coming toward him, said to Philip[c][b], “Where are we to buy bread so that these may eat?”
translation:
  language: sw
  text: Basi Yesu akainua macho, akaona kwamba umati mkubwa ulikuwa ukimjia, akamwambia Filipo, “Tutanunua wapi mikate[a] ili watu hawa wale?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mkate.” Neno la Kigiriki linaweza kumaanisha mkate kwa ujumla au mikate mmoja mmoja.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπάρας ... τοὺς ὀφθαλμοὺς
  choice: akainua macho
  rationale: Huhifadhi nahau ya Kigiriki kwa Kiswahili cha kawaida na kueleweka, bila kuongeza wazo lisilokuwapo katika matini.
- source_word: οὖν
  choice: Basi
  rationale: Huonyesha mwendelezo wa simulizi na uhusiano wake na yaliyotangulia kwa njia ya kawaida katika Kiswahili.
- source_word: θεασάμενος
  choice: akaona
  rationale: Kitenzi hiki kinaonyesha kuona kwa makini; “akaona” ni cha asili katika mtiririko wa simulizi na hakidhoofishi maana.
- source_word: πολὺς ὄχλος
  choice: umati mkubwa
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kundi kubwa la watu.
- source_word: ἔρχεται πρὸς αὐτόν
  choice: ulikuwa ukimjia
  rationale: Huwasilisha tendo lililokuwa likiendelea na mwelekeo wa umati kuja kwa Yesu.
- source_word: λέγει πρὸς Φίλιππον
  choice: akamwambia Filipo
  rationale: Wakati uliopo wa kihistoria umetafsiriwa kwa wakati wa simulizi wa Kiswahili; kiambishi “-mw-” huhifadhi kwamba Filipo ndiye aliyeambiwa.
- source_word: Πόθεν ἀγοράσωμεν
  choice: Tutanunua wapi
  rationale: Ingawa Πόθεν kwa umbo ni “kutoka wapi,” swali la Kiswahili “tutanunua wapi” huwasilisha kwa kawaida mjadala wa mahali au chanzo cha kununulia.
- source_word: ἄρτους
  choice: mikate
  rationale: Huhifadhi wingi wa nomino ya Kigiriki na inafaa katika muktadha wa vyakula vilivyogawanywa, huku uwezekano wa maana ya jumla “mkate” ukibainishwa katika tanbihi.
- source_word: ἵνα φάγωσιν οὗτοι
  choice: ili watu hawa wale
  rationale: “Ili” huonyesha kusudi, na “watu hawa” huweka wazi rejeo la kiwakilishi bila kulibadili kuwa “umati” kwa lazima.
theological_decisions:
- issue: Mpangilio wa vitenzi tegemezi na wakati uliopo wa kihistoria katika simulizi
  choice: 'Vitendo vimepangwa kwa mfuatano wa kawaida wa Kiswahili: “akainua... akaona... akamwambia.”'
  alternative: 'Muundo rasmi zaidi: “Yesu, alipoinua macho na kuona..., anamwambia Filipo.”'
  rationale: Uamuzi huu unaboresha uasilia wa simulizi la Kiswahili bila kuongeza tafsiri ya kiteolojia au kubadili mfuatano wa matendo katika Kigiriki.
- issue: Nguvu ya swali la ἀγοράσωμεν
  choice: “Tutanunua wapi”
  alternative: “Tununue kutoka wapi”
  rationale: Hali ya kutafakari kuhusu hatua inayopaswa kuchukuliwa inabaki wazi katika swali la kawaida la Kiswahili; haijaamuliwa kimbele ikiwa swali linaonyesha kutoweza, jaribio, au nia nyingine ambayo aya inayofuata inaweza kufafanua.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mtindo wa simulizi ni wa kawaida kwa wasomaji wengi; umeepuka lugha ya kizamani na ufafanuzi wa kimadhehebu.
