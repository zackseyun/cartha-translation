  yaml_path: translation/nt/john/006/004.yaml
  text: The Passover[a], the feast of the Jews, was near.
translation:
  language: sw
  text: Pasaka[a], sikukuu ya Wayahudi, ilikuwa karibu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sikukuu ya Wayudea.” Neno la Kigiriki linaweza kumaanisha Wayahudi kwa ujumla au Wayudea hasa, kutegemea muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: (haijatafsiriwa kwa neno maalumu)
  rationale: Kiunganishi hiki dhaifu kinaendeleza simulizi. Katika Kiswahili mstari unasomeka kwa kawaida bila kuongeza “basi” au “wakati huo,” ambazo zingeweza kusisitiza zaidi ya Kigiriki.
- source_word: ἐγγὺς
  choice: ilikuwa imekaribia
  rationale: Pamoja na ἦν, neno hili linaonyesha ukaribu wa wakati; usemi huu ni wa kawaida na wazi katika Kiswahili.
- source_word: πάσχα
  choice: Pasaka
  rationale: Hili ndilo jina la kawaida la Kiswahili kwa sikukuu ya Kiyahudi inayotajwa hapa.
- source_word: ἑορτὴ
  choice: sikukuu
  rationale: Neno hili huonyesha maadhimisho ya kidini; “sikukuu” ni la asili na lenye heshima katika Kiswahili cha sasa.
- source_word: τῶν Ἰουδαίων
  choice: ya Wayahudi
  rationale: Katika muktadha huu Pasaka inaelezwa kuwa sikukuu ya taifa na dini ya Wayahudi kwa ujumla, si ya wakazi wa Yudea pekee.
theological_decisions:
- issue: Maana ya Ἰουδαίων katika simulizi la Yohana
  choice: ya Wayahudi
  alternative: ya Wayudea
  rationale: Ingawa neno la Kigiriki linaweza kumaanisha Wayahudi kwa ujumla au Wayudea hasa kutegemea muktadha, hapa Pasaka ni sikukuu ya Wayahudi kwa upana. Tanbihi inahifadhi uwezekano wa maana ya kijiografia bila kuuingiza katika matini kuu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; lugha ni ya sasa, wazi, yenye heshima, na inaendeleza muundo wa maelezo ya ziada katika Kigiriki.
