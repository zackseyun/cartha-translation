id: JHN.6.31
reference: John 6:31
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οἱ πατέρες ἡμῶν τὸ μάννα ἔφαγον ἐν τῇ ἐρήμῳ, καθώς ἐστιν γεγραμμένον· Ἄρτον ἐκ τοῦ οὐρανοῦ ἔδωκεν αὐτοῖς φαγεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/031.yaml
  text: 'Our fathers ate the manna in the wilderness[b][a], just as it is written: ‘He gave them bread from heaven to eat.’'
translation:
  language: sw
  text: 'Baba zetu[a] walikula mana jangwani[b], kama ilivyoandikwa: “Aliwapa mkate kutoka mbinguni ili wale.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Mababu zetu.” Kigiriki kinasema kihalisi “baba zetu.”
    reason: lexical_alternative
  - marker: b
    text: “Jangwani” pia inaweza kutafsiriwa “nyikani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πατέρες ἡμῶν
  choice: Baba zetu
  rationale: Huhifadhi kwa karibu maana halisi ya ‘baba zetu’ na mtazamo wa wasemaji kwa watangulizi wa Israeli. ‘Mababu zetu’ ni mbadala wa kawaida zaidi katika Kiswahili na umeelezwa katika tanbihi.
- source_word: τὸ μάννα
  choice: mana
  rationale: ‘Mana’ ndilo jina lililozoeleka katika Kiswahili kwa chakula walichopewa Waisraeli jangwani.
- source_word: ἔφαγον
  choice: walikula
  rationale: Wakati uliopita sahili unawakilisha vizuri tendo la kihistoria linalotajwa na kitenzi cha Kigiriki cha aoristi.
- source_word: ἐν τῇ ἐρήμῳ
  choice: jangwani
  rationale: ‘Jangwani’ ni usemi wa kawaida na unaoeleweka katika muktadha wa safari ya Israeli; ‘nyikani’ pia inawezekana na imewekwa katika tanbihi.
- source_word: καθώς ἐστιν γεγραμμένον
  choice: kama ilivyoandikwa
  rationale: Ni fomula ya kawaida na ya asili ya Kiswahili ya kuingiza nukuu ya Maandiko, huku ikidumisha wazo la ushuhuda ulioandikwa.
- source_word: Ἄρτον
  choice: mkate
  rationale: ‘Mkate’ ni kisawe cha kawaida cha ἄρτος na hapa kinataja chakula kilichotolewa, si lazima mkate mmoja maalumu.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: kutoka mbinguni
  rationale: Huhifadhi wazi chanzo cha mbinguni kwa lugha ya kawaida ya kibiblia ya Kiswahili.
- source_word: ἔδωκεν αὐτοῖς φαγεῖν
  choice: Aliwapa ... ili wale
  rationale: Muundo huu wa Kiswahili ni wa asili na unaendeleza maana ya kuwapa kitu cha kula bila kuongeza maelezo yasiyokuwapo katika Kigiriki.
theological_decisions:
- issue: Kutafsiri nukuu kuhusu mana bila kuingiza mapema ufafanuzi wa Kikristo wa baadaye katika hotuba
  choice: Kauli imeachwa kama dai la kihistoria na la kimaandiko kuhusu mkate uliotolewa kutoka mbinguni.
  alternative: Kutumia herufi kubwa au maneno ya ufafanuzi yanayomtambulisha Yesu mapema kuwa ndiye mkate wa kweli.
  rationale: Katika mstari huu wasemaji wanarejelea mana ya jangwani. Maana ya kina inayofuata katika mazungumzo inapaswa kujitokeza katika simulizi lenyewe, si kuingizwa katika nukuu hii.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Nukuu imetafsiriwa kwa lugha ya kawaida bila kupoteza muundo wake wa kimaandiko.
