id: JHN.6.27
reference: John 6:27
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐργάζεσθε μὴ τὴν βρῶσιν τὴν ἀπολλυμένην ἀλλὰ τὴν βρῶσιν τὴν μένουσαν εἰς ζωὴν αἰώνιον, ἣν ὁ υἱὸς τοῦ ἀνθρώπου ὑμῖν δώσει, τοῦτον γὰρ ὁ πατὴρ ἐσφράγισεν ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/027.yaml
  text: Do not work for the food that perishes[a], but for the food that remains to eternal life, which the Son of Man will give to you[b]; for God the Father has set his seal on him.
translation:
  language: sw
  text: Msifanye kazi kwa ajili ya chakula kinachoharibika, bali kwa ajili ya chakula kinachodumu kwa uzima wa milele[a], ambacho Mwana wa Adamu atawapa; kwa maana Mungu Baba amemtia muhuri wake[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kinachodumu hata kufikia uzima wa milele.”
    reason: lexical_alternative
  - marker: b
    text: Kigiriki, “amemtia muhuri”; msemo huu hudokeza kwamba Mungu amemuidhinisha au amemthibitisha.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐργάζεσθε μὴ ... ἀλλὰ
  choice: Msifanye kazi ... bali
  rationale: Huhifadhi nguvu ya amri kwa wingi na utofautishaji wa katazo, kwa Kiswahili cha kawaida.
- source_word: βρῶσιν
  choice: chakula
  rationale: Katika muktadha huu neno linamaanisha chakula, si tendo la kula.
- source_word: ἀπολλυμένην
  choice: kinachoharibika
  rationale: Hueleza chakula chenye kuharibika na kupita bila kulifupisha wazo kuwa kuoza tu.
- source_word: μένουσαν
  choice: kinachodumu
  rationale: Huhifadhi utofauti na chakula kinachoharibika na ni lugha ya sasa iliyo wazi.
- source_word: εἰς ζωὴν αἰώνιον
  choice: kwa uzima wa milele
  rationale: Huwasilisha mwelekeo au matokeo yanayodokezwa na εἰς bila kufafanua kupita kiasi uhusiano wake na chakula kinachodumu.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  rationale: Ni tafsiri ya kawaida ya cheo hiki na huhifadhi mwangwi wake wa kibiblia na kitheolojia.
- source_word: ὑμῖν δώσει
  choice: atawapa
  rationale: Huwasilisha kwa kawaida kitenzi cha wakati ujao na yambwa ya watu wengi.
- source_word: ἐσφράγισεν
  choice: amemtia muhuri wake
  rationale: Huhifadhi picha ya muhuri katika Kigiriki; maana ya kuidhinisha au kuthibitisha inaelezwa katika tanbihi.
- source_word: ὁ πατὴρ ... ὁ θεός
  choice: Mungu Baba
  rationale: Ni Kiswahili cha kawaida kinachohifadhi utambulisho wa kiambatisho cha Kigiriki bila kuongeza maelezo ya kimadhehebu.
theological_decisions:
- issue: Kiambatisho ὁ πατὴρ ... ὁ θεός
  choice: Mungu Baba
  alternative: Baba, yaani Mungu
  rationale: Ujenzi wa Kigiriki unamtambulisha Baba kuwa Mungu; ‘Mungu Baba’ ni wa kawaida na hauongezi zaidi ya matini.
- issue: Maana ya ἐσφράγισεν kuhusu Mwana wa Adamu
  choice: amemtia muhuri wake
  alternative: amemthibitisha / amempa mamlaka
  rationale: Picha halisi ya muhuri imehifadhiwa badala ya kubadilishwa kabisa kuwa ufafanuzi mmoja; tanbihi inaonyesha maana zinazowezekana za kuidhinisha na kuthibitisha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Wingi wa amri umehifadhiwa katika “Msifanye,” na sitiari ya muhuri imeachwa katika matini huku maana yake ikifafanuliwa kwa tanbihi.
