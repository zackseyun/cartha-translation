  yaml_path: translation/nt/john/006/046.yaml
  text: Not that anyone has seen the Father[a], except the one who is from God; he has seen the Father.
translation:
  language: sw
  text: Si kwamba mtu yeyote amemwona Baba, isipokuwa yule anayetoka kwa Mungu[a]; huyo ndiye amemwona Baba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliye kutoka mbele za Mungu,” au “aliye pamoja na Mungu.” Kirai cha Kigiriki kinaweza kuonyesha ukaribu wa kibinafsi pamoja na chimbuko.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ ὅτι
  choice: Si kwamba
  rationale: Ni utangulizi wa ufafanuzi unaosahihisha uwezekano wa kuelewa vibaya kauli iliyotangulia; si kishazi cha sababu.
- source_word: τὸν πατέρα
  choice: Baba
  rationale: Hili ndilo jina la kawaida katika Injili ya Yohana kwa Mungu akiwa Baba; herufi kubwa inaonyesha kuwa ni rejeo la kimungu.
- source_word: ἑώρακέν τις
  choice: kuna mtu ambaye amemwona
  rationale: Katika muktadha huu hasi, τις humaanisha mtu yeyote; wakati timilifu wa Kigiriki unaonyesha tendo lililotokea lenye umuhimu unaoendelea, na 'amemwona' hulifikisha kwa kawaida katika Kiswahili.
- source_word: εἰ μὴ
  choice: isipokuwa
  rationale: Hapa kifungu hiki kinaonyesha hali ya kuondoa mmoja katika kauli ya jumla, wala si sharti.
- source_word: ὁ ὢν
  choice: yule anaye-
  rationale: Kirai hiki kinamtambulisha mtu kwa uhusiano au hali inayoendelea; kimeunganishwa kwa kawaida na 'anayetoka' katika Kiswahili.
- source_word: παρὰ τοῦ θεοῦ
  choice: anayetoka kwa Mungu
  rationale: παρά pamoja na hali ya genitivi inaweza kuonyesha chimbuko au alikotoka mtu. Kauli hii ni ya asili katika Kiswahili na bado hairuhusu maana ya ukaribu wa kibinafsi kupotea kabisa; maana hiyo imeelezwa katika tanbihi.
- source_word: οὗτος
  choice: huyo ndiye
  rationale: Hurejelea kwa msisitizo mtu aliyetajwa mara moja kabla; 'huyo ndiye' huhifadhi msisitizo huo kwa Kiswahili cha kawaida.
- source_word: ἑώρακεν
  choice: aliyemwona
  rationale: Huwasilisha tendo lililokamilika la kuona huku muundo wa sentensi ukionyesha upekee na umuhimu wake unaoendelea.
theological_decisions:
- issue: Uhusiano wa huyo mmoja na Mungu katika παρὰ τοῦ θεοῦ
  choice: anayetoka kwa Mungu
  alternative: aliye mbele za Mungu; aliye pamoja na Mungu
  rationale: Matini kuu inadumisha wazo la chimbuko au kutoka kwa Mungu bila kufafanua kupita kiasi hali ya kimetafizikia. Tanbihi huhifadhi uwezekano wa maana ya ukaribu wa kibinafsi au uwepo pamoja na Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Muundo 'Si kwamba ... isipokuwa' huhifadhi ufafanuzi wa kihoja wa Kigiriki; 'huyo ndiye' huhifadhi msisitizo wa οὗτος.
