id: JHN.6.12
reference: John 6:12
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὡς δὲ ἐνεπλήσθησαν λέγει τοῖς μαθηταῖς αὐτοῦ· Συναγάγετε τὰ περισσεύσαντα κλάσματα, ἵνα μή τι ἀπόληται.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/012.yaml
  text: And when they were filled[a], he says to his disciples, “Gather up the leftover pieces[d][c][b], so that nothing may be lost.”
translation:
  language: sw
  text: Nao walipokwisha kushiba[a], anawaambia[b] wanafunzi wake, “Kusanyeni vipande[c] vilivyobaki, ili chochote kisipotee[d].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “walipotosheka” au “walipokula wakashiba.”
    reason: lexical_alternative
  - marker: b
    text: Kigiriki kinatumia wakati uliopo wa kihistoria, yaani, “anawaambia.” Kwa Kiswahili cha simulizi inaweza pia kutafsiriwa “aliwaambia.”
    reason: lexical_alternative
  - marker: c
    text: Au “vipande vilivyovunjika.” Neno la Kigiriki humaanisha vipande vilivyomegwa au kuvunjwa.
    reason: lexical_alternative
  - marker: d
    text: Au “ili chochote kisitupwe bure.” Kigiriki kinasema kwa maana ya moja kwa moja zaidi, “ili chochote kisipotee.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ
  choice: Nao walipokwisha
  rationale: “Nao” huendeleza simulizi kwa upole, huku muundo wa “walipokwisha” ukionyesha wakati wa tendo linalofuata bila kuifanya δέ kuwa nzito kupita kiasi.
- source_word: ἐνεπλήσθησαν
  choice: kushiba
  rationale: Katika muktadha wa chakula, kitenzi hiki kina maana ya kujazwa au kutosheka kwa kula. “Kushiba” ni Kiswahili cha kawaida na sahihi kuliko tafsiri ya neno kwa neno ya “kujazwa.”
- source_word: λέγει
  choice: anawaambia
  rationale: Wakati uliopo wa Kigiriki umehifadhiwa kama wakati uliopo wa kihistoria, unaolifanya tukio lionekane hai katika simulizi.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: wanafunzi wake
  rationale: “Wanafunzi” ndilo neno sanifu na mahususi kwa μαθηταί katika Injili; “wake” huhifadhi αὐτοῦ.
- source_word: Συναγάγετε
  choice: Kusanyeni
  rationale: Hii ni amri ya moja kwa moja kwa watu wengi. “Kusanyeni” ni ya asili katika muktadha wa kuokota na kuweka pamoja mabaki ya chakula.
- source_word: τὰ περισσεύσαντα κλάσματα
  choice: vipande vilivyobaki
  rationale: “Vilivyobaki” huwasilisha wazo la mabaki baada ya watu kula, na “vipande” huonyesha κλάσματα bila kuongeza maelezo yasiyotajwa wazi katika mstari huu.
- source_word: ἵνα μή τι ἀπόληται
  choice: ili chochote kisipotee
  rationale: Tafsiri hii hudumisha maana ya msingi ya ἀπόλλυμι, “kupotea,” na kutafsiri τι ya hali ya kati kwa “chochote,” bila kuibadili kimyakimya kuwa wazo la kuharibika au kutupwa bure.
theological_decisions:
- issue: Uwezekano wa kuipa ἀπόληται maana ya kiwokovu katika muktadha wa ishara
  choice: kisichopotee
  alternative: kisiharibike au kisitupwe bure
  rationale: Mrejeo wa karibu ni vipande vya chakula vilivyobaki. Hata hivyo, kwa kuwa Yohana hutumia kitenzi hiki pia katika miktadha yenye uzito wa kitheolojia, “kisichopotee” huhifadhi mwangwi unaowezekana bila kuufanya kuwa tafsiri ya lazima.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa maandiko. Wakati uliopo wa kihistoria umehifadhiwa katika “anawaambia,” huku tanbihi ikitoa namna laini zaidi ya simulizi. “Kushiba” huepuka usemi usio wa asili wa “kujazwa” katika muktadha wa kula.
