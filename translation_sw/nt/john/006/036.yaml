  text: But I told you that you have even seen me[a], and yet you do not believe.
translation:
  language: sw
  text: Lakini niliwaambia kwamba, ingawa mmeniona, hamwamini.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλ’
  choice: Lakini
  rationale: Kiunganishi hiki kinaonyesha utofauti na kauli iliyotangulia; “Lakini” ni tafsiri ya kawaida na ya moja kwa moja.
- source_word: εἶπον ὑμῖν
  choice: niliwaambia
  rationale: Muundo huu wa Kiswahili unaunganisha kitenzi na yambwa ya watu wengi kwa njia ya kawaida, huku ukidumisha rejeo la kauli iliyotolewa awali.
- source_word: ὅτι
  choice: kwamba
  rationale: Kinatumika kuanzisha maudhui ya yale Yesu aliyowaambia.
- source_word: καὶ ἑωράκατέ με
  choice: ingawa mmeniona
  rationale: 'καί ya kwanza ina nguvu ya kusisitiza jambo la kushangaza katika muktadha: wamemwona Yesu, lakini bado hawaamini. Muundo wa concessive ni wa kawaida zaidi katika Kiswahili; tafsiri rasmi zaidi imehifadhiwa katika tanbihi.'
- source_word: καὶ οὐ πιστεύετε
  choice: bado hamwamini
  rationale: “Bado” huonyesha utofauti unaoletwa na uratibu wa pili, na wakati wa sasa wa πιστεύετε unaonyesha hali yao ya kutokuamini inayoendelea.
theological_decisions:
- issue: Nguvu ya καί ya kwanza katika καὶ ἑωράκατέ με
  choice: ingawa mmeniona
  alternative: kwa kweli mmeniona, lakini hamwamini
  rationale: Kigiriki kinaweza kueleweka kama msisitizo (“kwa kweli”) au kuwasilishwa kwa nguvu ya concessive (“ingawa”). Tafsiri kuu inatumia Kiswahili cha kawaida kinachoonyesha tofauti ya kimantiki, huku tanbihi ikihifadhi muundo ulio karibu zaidi na uratibu wa Kigiriki.
- issue: Tafsiri ya πιστεύω
  choice: amini
  alternative: kuwa na imani; tumaini
  rationale: “Amini” ni kitenzi cha moja kwa moja na kilichozoeleka kwa πιστεύω katika Injili ya Yohana, bila kukifafanua kwa namna finyu kuwa kukubali kiakili tu au kukipanua kwa kuongeza maana isiyotajwa wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. “Niliwaambia” na “mmeniona” ni miundo ya kawaida ya mazungumzo yenye hadhi; tanbihi huhifadhi uwezekano wa tafsiri rasmi zaidi bila kuondoa mvutano wa sentensi ya Kigiriki.
