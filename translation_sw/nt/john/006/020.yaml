lexical_decisions:
- source_word: ὁ δὲ
  choice: Lakini aka-
  rationale: δέ ni kiunganishi chepesi kinachoonyesha hatua mpya au utofautishaji katika simulizi; “lakini” ni ya asili hapa. ὁ inamtaja Yesu kwa namna ya kiwakilishi, jambo linalowakilishwa katika kiambishi cha nafsi kwenye kitenzi cha Kiswahili.
- source_word: λέγει
  choice: akawaambia
  rationale: Ingawa Kigiriki kimetumia wakati uliopo wa kihistoria, wakati wa masimulizi wa Kiswahili unasomeka kwa kawaida zaidi hapa. “Waambia” pia huwasilisha αὐτοῖς bila kurudia waziwazi “wanafunzi.”
- source_word: αὐτοῖς
  choice: -wa- katika “akawaambia”
  rationale: Kiwakilishi hiki ni cha wingi na muktadha ndio unaowatambulisha wanaorejelewa; kiambishi yambwa “-wa-” hutafsiri maana hiyo moja kwa moja bila kuongeza “wanafunzi.”
- source_word: Ἐγώ εἰμι
  choice: Ni mimi
  rationale: Katika muktadha wa karibu, Yesu anajitambulisha kwa wanafunzi waliokuwa wameogopa. “Ni mimi” ni usemi wa kawaida na wazi wa Kiswahili, huku tafsiri halisi zaidi “Mimi niko” ikihifadhiwa katika tanbihi kwa sababu ya mwangwi wake unaowezekana katika Injili ya Yohana.
- source_word: μὴ φοβεῖσθε
  choice: msiogope
  rationale: Hili ni katazo linalowaelekea watu wengi. “Msiogope” ni Kiswahili cha kawaida, kifupi, na kinachofaa katika hali hii ya hofu.
theological_decisions:
- issue: Iwapo Ἐγώ εἰμι itafsiriwe kama kujitambulisha kwa kawaida au kwa namna halisi zaidi yenye mwangwi wa kiteolojia
  choice: 'Katika matini kuu: “Ni mimi”'
  alternative: “Mimi niko”
  rationale: Muktadha unaonyesha kwamba Yesu anawatuliza wanafunzi kwa kujitambulisha. Hata hivyo, usemi ἐγώ εἰμι katika Yohana unaweza kuwa na maana pana zaidi; tanbihi inahifadhi uwezekano huo bila kuulazimisha kuwa maana pekee ya mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo ni wa asili katika simulizi huku ukihifadhi utata halisi wa Ἐγώ εἰμι kwa tanbihi.
