  text: Lakini akawaambia[a], “Ni mimi; msiogope.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa karibu zaidi na Kigiriki, “Mimi ni.” Katika Yohana, usemi huu unaweza kuwa njia ya kawaida ya mtu kujitambulisha, na pia huenda ukawa na mwangwi wa mada pana zaidi za kiteolojia.
