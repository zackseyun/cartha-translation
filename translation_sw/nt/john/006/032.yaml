  text: εἶπεν οὖν αὐτοῖς ὁ Ἰησοῦς· Ἀμὴν ἀμὴν λέγω ὑμῖν, οὐ Μωϋσῆς ⸀δέδωκεν ὑμῖν τὸν ἄρτον ἐκ τοῦ οὐρανοῦ, ἀλλ’ ὁ πατήρ μου δίδωσιν ὑμῖν τὸν ἄρτον ἐκ τοῦ οὐρανοῦ τὸν ἀληθινόν·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/032.yaml
  text: So Jesus said to them[a], “Truly, truly, I say to you, Moses has not given you the bread from heaven[b], but my Father gives you the true bread from heaven.”
translation:
  language: sw
  text: Basi Yesu akawaambia, “Kweli, kweli, ninawaambia, si Musa aliyewapa mkate kutoka mbinguni,[a] bali Baba yangu ndiye anayewapa mkate wa kweli kutoka mbinguni.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Musa hakuwapa mkate kutoka mbinguni.” Katika Kigiriki, neno la kukanusha linatangulia “Musa,” hivyo tofauti ya anayetoa inasisitizwa hasa.
    reason: lexical_alternative
  - marker: b
    text: “Mkate wa kweli” pia unaweza kumaanisha mkate “halisi” au “wa hakika.” Usemi huu hutofautisha mkate huu na mana ya awali, iliyokuwa ishara.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Basi
  rationale: Kiunganishi hiki kinaendeleza na kuhusianisha jibu la Yesu na mazungumzo yaliyotangulia kwa Kiswahili cha kawaida.
- source_word: Ἀμὴν ἀμὴν
  choice: Kweli, kweli
  rationale: Huhifadhi urudiaji wa kauli ya mkazo ya Yohana na kuwasilisha uthabiti wake kwa lugha inayoeleweka.
- source_word: λέγω ὑμῖν
  choice: ninawaambia
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja inayofaa ndani ya utangulizi huu wa kauli nzito.
- source_word: οὐ Μωϋσῆς δέδωκεν ὑμῖν
  choice: si Musa aliyewapa
  rationale: Muundo huu unaweka uk否kanaji kwa Musa kama ulivyo katika Kigiriki na kuonyesha wazi tofauti ya mtendaji bila kulazimisha ufafanuzi zaidi.
- source_word: τὸν ἄρτον ἐκ τοῦ οὐρανοῦ
  choice: mkate kutoka mbinguni
  rationale: Huhifadhi picha ya mkate na asili yake ya mbinguni kwa Kiswahili cha asili.
- source_word: ἀλλ’ ὁ πατήρ μου δίδωσιν ὑμῖν
  choice: bali Baba yangu ndiye anayewapa
  rationale: ‘Bali’ na ‘ndiye’ zinaonyesha tofauti ya mtendaji, huku ‘anayewapa’ ikihifadhi tendo la wakati wa sasa la δίδωσιν.
- source_word: τὸν ἀληθινόν
  choice: wa kweli
  rationale: Huhifadhi maana pana ya ἀληθινός—wa kweli, halisi, au kamili—bila kuamua kimafafanuzi maana moja tu.
theological_decisions:
- issue: Tofauti ya mtendaji na wakati kati ya Musa na Baba
  choice: si Musa aliyewapa ... Baba yangu ndiye anayewapa
  alternative: Musa hakuwapa ... Baba yangu anawapa
  rationale: Tafsiri iliyochaguliwa inahifadhi mkazo wa uk否kanaji ulio kabla ya ‘Musa’ na kutofautisha utoaji wa zamani unaohusishwa na Musa na utoaji wa Baba unaoendelea sasa.
- issue: Maana ya ‘mkate wa kweli’
  choice: mkate wa kweli
  alternative: mkate halisi / mkate wa hakika
  rationale: ‘Wa kweli’ huhifadhi mvutano wa Kiyohana kati ya mana ya awali na zawadi ya mwisho au timilifu bila kuibana maana kuwa ‘halisi’ pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ‘si Musa aliyewapa ... ndiye anayewapa’ ni wa kawaida na unaweka wazi mkazo wa Kigiriki. Alama zote za tanbihi [a] na [b] zimewekwa katika matini kuu.
