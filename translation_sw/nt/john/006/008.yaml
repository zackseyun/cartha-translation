  text: Mmoja wa wanafunzi wake, Andrea, ndugu wa Simoni Petro, akamwambia,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: akamwambia
  rationale: Ingawa Kigiriki kinatumia wakati uliopo wa kisimulizi, Kiswahili cha masimulizi hutumia kwa kawaida kiambishi cha mfululizo -ka-. Kitenzi “mwambia” pia kinajumuisha maana ya αὐτῷ, yaani kusema kwake.
- source_word: αὐτῷ
  choice: -mw- katika “akamwambia”
  rationale: Kiwakilishi cha yambwa kinarejelea Yesu na kimewakilishwa kwa kiambishi cha yambwa -mw- kwa Kiswahili cha kawaida.
- source_word: εἷς ἐκ τῶν μαθητῶν αὐτοῦ
  choice: Mmoja wa wanafunzi wake
  rationale: Hii ni tafsiri ya kawaida na sahihi ya muundo unaoonyesha mmoja kutoka katika kundi.
- source_word: μαθητῶν
  choice: wanafunzi
  rationale: “Wanafunzi” ni istilahi ya kawaida ya Injili na hudumisha maana ya watu wanaojifunza chini ya mwalimu na kumfuata.
- source_word: Ἀνδρέας
  choice: Andrea
  rationale: Jina limetoholewa kwa umbo linalotumiwa kwa kawaida katika Biblia za Kiswahili.
- source_word: ὁ ἀδελφὸς Σίμωνος Πέτρου
  choice: ndugu yake Simoni Petro
  rationale: Kirai hiki kinamtambulisha Andrea kwa uhusiano wake wa kindugu na Simoni Petro. “Ndugu yake” ni cha asili katika Kiswahili na muktadha unaelekeza kwa ndugu wa kiume.
- source_word: Σίμωνος Πέτρου
  choice: Simoni Petro
  rationale: Majina yote mawili yamehifadhiwa pamoja kama utambulisho unaojulikana wa mtu huyo.
