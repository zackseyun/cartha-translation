  text: τοῦτο ⸀γάρ ἐστιν τὸ θέλημα τοῦ ⸂πατρός μου⸃ ἵνα πᾶς ὁ θεωρῶν τὸν υἱὸν καὶ πιστεύων εἰς αὐτὸν ἔχῃ ζωὴν αἰώνιον, καὶ ἀναστήσω αὐτὸν ⸀ἐγὼ τῇ ἐσχάτῃ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/040.yaml
  text: 'For this is the will of my Father: that everyone who sees the Son and believes in him may have eternal life[b][a], and I myself will raise him up on the last day.'
translation:
  language: sw
  text: 'Kwa maana haya ndiyo mapenzi ya Baba yangu: kwamba kila mtu anayemtazama Mwana na kumwamini awe na uzima wa milele,[a] nami mwenyewe nitamfufua siku ya mwisho.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kila mtu anayemwona Mwana na kumwamini.” Kitenzi cha Kigiriki kinaweza kumaanisha kutazama au kuona kwa makini, si kuona kwa macho tu.
    reason: lexical_alternative
  - marker: b
    text: 'Au, “nami nitamfufua.” Kigiriki kinatumia kiwakilishi “mimi” kwa msisitizo: “nami mwenyewe nitamfufua.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο γάρ ἐστιν
  choice: Kwa maana haya ndiyo
  rationale: Kauli hii inaendeleza na kueleza yaliyotangulia; “Kwa maana” inahifadhi nguvu ya ufafanuzi ya γάρ kwa Kiswahili cha kawaida.
- source_word: τὸ θέλημα τοῦ πατρός μου
  choice: mapenzi ya Baba yangu
  rationale: “Mapenzi” ni usemi wa kawaida wa Kiswahili kwa θέλημα katika muktadha wa kusudi au nia ya Mungu, huku “Baba yangu” ikihifadhi uhusiano wa Yesu na Baba.
- source_word: ἵνα
  choice: kwamba
  rationale: Hapa ἵνα inaanzisha maudhui na kusudi la mapenzi ya Baba; “kwamba” linaunganisha sentensi kwa ufasaha bila kuondoa kabisa mwelekeo wake wa kusudi.
- source_word: πᾶς ὁ θεωρῶν τὸν υἱὸν
  choice: kila mtu anayemtazama Mwana
  rationale: “Anayemtazama” linaonyesha kuona kwa makusudi au kwa makini kuliko kuona kwa macho tu, na linahifadhi hali ya jumla ya kirai cha kisifa.
- source_word: καὶ πιστεύων εἰς αὐτὸν
  choice: na kumwamini
  rationale: “Kumwamini” ni Kiswahili cha asili kinachoonyesha imani au tumaini linaloelekezwa kwa mtu, sawasawa na πιστεύω εἰς.
- source_word: ἔχῃ ζωὴν αἰώνιον
  choice: awe na uzima wa milele
  rationale: “Awe na” linawakilisha hali ya utegemezi ya ἔχῃ chini ya ἵνα; “uzima wa milele” ni usemi ulio wazi na wa kawaida kwa ζωὴ αἰώνιος.
- source_word: καὶ ἀναστήσω αὐτὸν ἐγὼ
  choice: nami mwenyewe nitamfufua
  rationale: “Mwenyewe” linahifadhi msisitizo wa kiwakilishi ἐγώ, na “nitamfufua” linaeleza kwa kawaida ufufuo wa wakati ujao.
- source_word: τῇ ἐσχάτῃ ἡμέρᾳ
  choice: siku ya mwisho
  rationale: Huu ni usemi wa kawaida wa Kiswahili kwa wakati unaotajwa na kirai hiki.
theological_decisions:
- issue: Upeo na masharti katika πᾶς ὁ θεωρῶν ... καὶ πιστεύων
  choice: kila mtu anayemtazama Mwana na kumwamini awe na uzima wa milele
  alternative: yeyote anayemwona Mwana na kumwamini ana uzima wa milele
  rationale: Tafsiri inadumisha muundo wa jumla unaowahusu wote wenye sifa ya kumtazama na kumwamini Mwana, pamoja na hali ya utegemezi ya kitenzi, bila kuamua mjadala wa kimadhehebu kuhusu uchaguzi au hiari.
- issue: Msisitizo wa ἐγώ katika ahadi ya ufufuo
  choice: nami mwenyewe nitamfufua
  alternative: nami nitamfufua
  rationale: Neno “mwenyewe” linahifadhi msisitizo wa wazi wa ἐγώ na kuonyesha utendaji binafsi wa Yesu bila kuongeza dai lisilokuwamo katika matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Mpangilio wa alama za tanbihi umewekwa karibu na vifungu vinavyohusika.
