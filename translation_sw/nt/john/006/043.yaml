  text: ⸀ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτοῖς· Μὴ γογγύζετε μετ’ ἀλλήλων.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/043.yaml
  text: Jesus answered and said to them[b][a], “Do not grumble among yourselves.”
translation:
  language: sw
  text: Yesu akawajibu, akasema, “Msinung’unike miongoni mwenu.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ninyi kwa ninyi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: akawajibu
  rationale: Kitenzi hiki kwa kawaida humaanisha ‘kujibu.’ Muundo wa ‘akawajibu’ unaonyesha wazi kuwa jibu liliwalenga wao na unafaa katika simulizi la Kiswahili.
- source_word: εἶπεν
  choice: akasema
  rationale: Neno hili humaanisha ‘alisema.’ Kulihifadhi pamoja na ‘akawajibu’ kunaakisi fomula ya Kigiriki ‘alijibu na kusema’ kwa mtiririko wa kawaida wa simulizi la Kiswahili.
- source_word: Μὴ γογγύζετε
  choice: Msinung’unike
  rationale: Amri ya sasa yenye μή inaweza kukataza tendo linaloendelea au kutoa katazo la jumla. ‘Msinung’unike’ huhifadhi maana ya kunung’unika kwa kutoridhika bila kuamua kwa lazima kwamba maana ni ‘acheni kunung’unika.’ Pia inadumisha mwangwi wa lugha ya simulizi za jangwani.
- source_word: μετ’ ἀλλήλων
  choice: miongoni mwenu
  rationale: Kirai hiki kinaonyesha tendo linalofanyika ndani ya kundi na kwa kuhusiana wao kwa wao. ‘Miongoni mwenu’ ni Kiswahili cha kawaida na cha asili katika muktadha huu.
- source_word: Ἰησοῦς
  choice: Yesu
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ‘akawajibu, akasema’ unahifadhi vitenzi vyote viwili vya Kigiriki bila kuwa mzito kupita kiasi. ‘Msinung’unike’ limechaguliwa badala ya ‘msilalamike’ ili kudumisha maana na mwangwi wa kibiblia wa γογγύζω.
