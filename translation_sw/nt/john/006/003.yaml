  text: Then Jesus went up on the mountain, and there he sat with his disciples.
translation:
  language: sw
  text: Kisha Yesu akapanda mlimani, na huko akaketi pamoja na wanafunzi wake.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνῆλθεν
  choice: akapanda
  rationale: Kitenzi hiki katika simulizi kinaonyesha kwenda juu. “Akapanda” ni Kiswahili cha kawaida na sahihi kwa mwendo wa kupanda mlima.
- source_word: δὲ
  choice: Kisha
  rationale: Hapa δέ inaendeleza simulizi badala ya kuonyesha utofautishaji mkubwa; “Kisha” linaonyesha mfuatano wa matukio kwa ufasaha.
- source_word: εἰς τὸ ὄρος
  choice: mlimani
  rationale: Pamoja na kitenzi cha kupanda, usemi huu unaonyesha kwenda juu kwenye mlima au mteremko wake. “Mlimani” ni wa kawaida na hauashirii lazima mlima wenye jina.
- source_word: Ἰησοῦς
  choice: Yesu
  rationale: Hili ndilo umbo la kawaida la jina hilo katika Kiswahili.
- source_word: ἐκεῖ
  choice: huko
  rationale: Kielezi hiki cha mahali kinarejelea mahali alikopanda Yesu; “huko” ni cha kawaida katika muktadha huu.
- source_word: ἐκάθητο
  choice: akaketi
  rationale: Kitenzi kinaweza kumaanisha kuketi au kuwa ameketi. “Akaketi” kinafaa katika mtiririko wa simulizi bila kuongeza maana isiyokuwapo.
- source_word: μετὰ τῶν μαθητῶν αὐτοῦ
  choice: pamoja na wanafunzi wake
  rationale: μετά pamoja na hali ya umilikishi humaanisha “pamoja na,” na μαθηταί ni “wanafunzi” katika uhusiano wa mwalimu na wafuasi wake.
