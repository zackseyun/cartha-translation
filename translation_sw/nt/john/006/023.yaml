  yaml_path: translation/nt/john/006/023.yaml
  text: But boats came from Tiberias near the place where they ate the bread after the Lord had given thanks[a].
translation:
  language: sw
  text: Lakini mashua ndogo zilikuja kutoka Tiberia karibu na mahali ambapo walikula mkate baada ya Bwana kutoa shukrani.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλὰ
  choice: Lakini
  rationale: Kiunganishi hiki kinaonyesha tofauti na hali iliyoelezwa kabla, na “Lakini” ni cha kawaida na cha moja kwa moja katika Kiswahili.
- source_word: ἦλθεν
  choice: zilikuja
  rationale: Kitenzi hiki kinasimulia kuwasili kwa mashua; upatanisho wa ngeli unafuata “mashua.”
- source_word: πλοιάρια
  choice: mashua ndogo
  rationale: Nomino ya Kiyunani ina umbo la kudunisha linaloweza kuonyesha mashua ndogo; Kiswahili kinaweza kudumisha maana hiyo kwa njia ya kawaida bila tanbihi.
- source_word: ἐκ Τιβεριάδος
  choice: kutoka Tiberia
  rationale: Hii inaeleza mahali mashua zilipotoka; “Tiberia” ni umbo la jina linalotumika kwa mji huo katika Kiswahili.
- source_word: ἐγγὺς τοῦ τόπου
  choice: mpaka karibu na mahali
  rationale: “Karibu na mahali” huhifadhi wazo la ukaribu, huku “mpaka” ikifanya kuja kwa mashua kutoka Tiberia kuelekea eneo hilo kuwe wazi kwa Kiswahili cha kawaida.
- source_word: ὅπου
  choice: ambapo
  rationale: Kielezi rejeshi hiki ni cha asili baada ya “mahali.”
- source_word: ἔφαγον τὸν ἄρτον
  choice: walikula mikate
  rationale: Aoristi imetafsiriwa kwa wakati uliopita wa kawaida. Katika muktadha wa kulishwa kwa watu, “mikate” ni ya kawaida zaidi kwa vipande vya mkate vilivyotajwa hapo awali, ingawa Kiyunani kina umoja wa kijumla.
- source_word: εὐχαριστήσαντος
  choice: baada ya ... kushukuru
  rationale: Kirai kishirikishi cha aoristi kinaonyesha kitendo cha Bwana kilichotangulia kula; muundo huu unaweka wazi uhusiano huo wa wakati.
- source_word: τοῦ κυρίου
  choice: Bwana
  rationale: Huhifadhi cheo cha heshima κύριος kinachomrejelea Yesu na mwangwi wake wa Kikristo bila kukipanua kwa tafsiri.
theological_decisions:
- issue: Tafsiri ya κύριος
  choice: Bwana
  alternative: mkuu
  rationale: “Bwana” ndilo neno la kawaida la Kiswahili kwa cheo hiki kinapomhusu Yesu; linahifadhi heshima na uzito wa Kikristo bila kuondoa uwezekano wa maana ya cheo katika simulizi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umetunza tofauti ya mwanzo na mpangilio wa matukio. Maana ya udogo katika πλοιάρια imeingizwa moja kwa moja kama “mashua ndogo,” hivyo hakuna tanbihi inayohitajika.
