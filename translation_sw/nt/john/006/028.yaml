  text: Then they said to him[a], “What must we do so that we may work the works of God?”
translation:
  language: sw
  text: Basi wakamwambia[a], “Tufanye nini ili tufanye kazi za Mungu?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Tufanye nini ili tutende kazi za Mungu?” Maneno “kazi za Mungu” yanaweza pia kumaanisha “kazi anazotaka Mungu.”
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπον
  choice: wakamwambia
  rationale: Kauli hii ya wakati uliopita inaendeleza simulizi kwa njia ya kawaida; umoja wa yule anayeambiwa unaonyeshwa katika kiambishi -m-.
- source_word: οὖν
  choice: Basi
  rationale: Neno hili linaonyesha mwendelezo au hitimisho linalotokana na mazungumzo yaliyotangulia bila kulazimisha maana ya hoja kali.
- source_word: πρὸς αὐτόν
  choice: -mwambia
  rationale: Pamoja na kitenzi cha kusema, πρός na hali ya kushutumiwa humtambulisha anayeambiwa; Kiswahili huonyesha jambo hilo kwa kiambishi cha mtendewa.
- source_word: Τί
  choice: nini
  rationale: Kiwakilishi hiki cha kuuliza kinataka kujua tendo linalohitajika, si sababu ya tendo.
- source_word: ποιῶμεν
  choice: Tufanye
  rationale: Hali tegemezi katika swali hili la kujadiliana inauliza tendo linalowapasa kufanya; ‘tufanye’ ni ya kawaida na haiongezi ulazima usioelezwa wazi.
- source_word: ἵνα
  choice: ili
  rationale: Huanzisha kusudi la tendo kwa Kiswahili cha kawaida na wazi.
- source_word: ἐργαζώμεθα
  choice: tutende
  rationale: Kitenzi kina maana ya kufanya, kutekeleza, au kutimiza kazi. ‘Tutende’ kinaambatana kwa kawaida na ‘kazi’ na bado kinaonyesha utekelezaji hai.
- source_word: τὰ ἔργα
  choice: kazi
  rationale: ‘Kazi’ ni neno la kawaida na lenye upana unaofaa kwa ἔργα; halipunguzi maana kuwa matendo ya kimaadili pekee wala majukumu maalumu.
- source_word: τοῦ θεοῦ
  choice: za Mungu
  rationale: Muundo huu wa umilikaji unaacha wazi kama ni kazi anazotaka Mungu, zinazomhusu Mungu, au zinazotoka kwake, badala ya kuamua maana ambayo Kigiriki hakijaifunga.
theological_decisions:
- issue: Maana ya muundo wa umilikaji katika τὰ ἔργα τοῦ θεοῦ
  choice: kazi za Mungu
  alternative: kazi anazotaka Mungu; kazi zinazomhusu Mungu; kazi anazofanya Mungu
  rationale: Muundo wa Kigiriki una uwezekano wa maana kadhaa, na mstari unaofuata unatumia hali hiyo katika jibu la Yesu. Tafsiri kuu inadumisha mvutano huo wa kimaana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Basi’ huendeleza simulizi kwa kawaida, na ‘tutende kazi’ ni muunganiko unaoeleweka kwa wasomaji wa kawaida huku ukihifadhi upana wa maana ya maneno ya Kigiriki.
