id: JHN.6.19
reference: John 6:19
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐληλακότες οὖν ὡς σταδίους εἴκοσι πέντε ἢ τριάκοντα θεωροῦσιν τὸν Ἰησοῦν περιπατοῦντα ἐπὶ τῆς θαλάσσης καὶ ἐγγὺς τοῦ πλοίου γινόμενον, καὶ ἐφοβήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/019.yaml
  text: So when they had rowed about twenty-five or thirty stadia[a], they saw Jesus walking on the sea and coming near the boat[b], and they were afraid.
translation:
  language: sw
  text: Basi, baada ya kupiga makasia kwa umbali wa karibu stadia ishirini na tano au thelathini[a], wakamwona Yesu akitembea juu ya bahari[b], akikaribia mashua; nao wakaogopa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Stadia ilikuwa kipimo cha kale cha umbali; stadia ishirini na tano au thelathini ni takriban maili tatu hadi nne (karibu kilomita tano hadi sita).
    reason: cultural_note
  - marker: b
    text: Au, “juu ya maji.” Kigiriki kinasema kihalisi, “juu ya bahari.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐληλακότες
  choice: walipokuwa wamepiga makasia
  rationale: Katika muktadha wa kusafiri kwa mashua, kitenzi ἐλαύνω humaanisha kuisukuma mashua kwa makasia. Muundo huu pia unaonyesha kwamba kupiga makasia kulitangulia tendo la kumwona Yesu.
- source_word: οὖν
  choice: Basi
  rationale: Kiunganishi hiki kinaendeleza simulizi kutokana na yaliyotangulia; “Basi” ni cha kawaida na chenye hadhi katika Kiswahili cha simulizi.
- source_word: ὡς
  choice: karibu
  rationale: Kikiwa pamoja na kipimo, ὡς huonyesha makadirio.
- source_word: σταδίους εἴκοσι πέντε ἢ τριάκοντα
  choice: stadia ishirini na tano au thelathini
  rationale: Kipimo cha kale kimehifadhiwa katika matini kuu ili kufuata chanzo; thamani yake katika vipimo vya sasa imefafanuliwa katika tanbihi.
- source_word: θεωροῦσιν
  choice: wakamwona
  rationale: Katika muktadha huu maana kuu ni kuona; “wakamwona” ni ya kawaida na inaendeleza mfululizo wa simulizi kwa ufasaha.
- source_word: περιπατοῦντα ἐπὶ τῆς θαλάσσης
  choice: akitembea juu ya bahari
  rationale: Tafsiri hii huhifadhi neno θάλασσα, “bahari,” na maana ya kutembea juu yake, bila kulainisha tukio au kulibadili kuwa kutembea kando ya bahari.
- source_word: ἐγγὺς τοῦ πλοίου γινόμενον
  choice: na kuja karibu na mashua
  rationale: γίνομαι pamoja na ἐγγύς huonyesha kusogea hadi kuwa karibu, hivyo “kuja karibu” ni bora kuliko maelezo yasiyoonyesha mwendo.
- source_word: πλοίου
  choice: mashua
  rationale: Katika mazingira ya Ziwa la Galilaya, “mashua” linafaa zaidi kuliko “meli,” ambalo hudokeza chombo kikubwa zaidi.
- source_word: ἐφοβήθησαν
  choice: nao wakaogopa
  rationale: Huu ni usemi wa kawaida unaoonyesha mwitikio wao wa hofu mara baada ya kumwona Yesu.
theological_decisions:
- issue: Kueleza muujiza bila kupunguza maana yake ya wazi
  choice: akitembea juu ya bahari
  alternative: akitembea kando ya bahari; akitembea juu ya maji
  rationale: ἐπί pamoja na hali ya umilikishi hapa, kwa kuzingatia mazingira ya wanafunzi kuwa baharini, humaanisha Yesu alikuwa akitembea juu ya bahari yenyewe. “Kando ya bahari” haipatani na mazingira, na “juu ya maji” ni tafsiri halali ya maana lakini hubadili neno halisi θάλασσα, “bahari.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa simulizi ulio wazi, wa sasa na wenye hadhi. “Kupiga makasia” ni usemi unaoeleweka kwa urahisi, huku kipimo cha kale “stadia” kikihifadhiwa na kufafanuliwa katika tanbihi.
