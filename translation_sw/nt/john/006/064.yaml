base_translation:
  language: en
  yaml_path: translation/nt/john/006/064.yaml
  text: But there are some among you who do not believe[a]. For Jesus knew from the beginning who those were who did not believe[b], and who it was who would betray him.
translation:
  language: sw
  text: Lakini baadhi yenu hawaamini. Kwa maana Yesu alijua tangu mwanzo ni akina nani waliokuwa hawaamini, na ni nani ambaye angemsaliti[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya karibu zaidi, “ambaye angemkabidhi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Lakini
  rationale: Kiunganishi hiki kinaonyesha utofautishaji na kauli iliyotangulia; “Lakini” ni ya kawaida na ya wazi katika Kiswahili.
- source_word: ἐξ ὑμῶν τινες
  choice: baadhi yenu
  rationale: Huu ni usemi wa asili wa Kiswahili unaoonyesha kwamba watu hao ni sehemu ya kundi linalosemeshwa, bila tafsiri ngumu ya neno kwa neno.
- source_word: οἳ οὐ πιστεύουσιν
  choice: hawaamini
  rationale: Wakati wa sasa wa kitenzi unaonyesha hali inayoendelea; “hawaamini” huiwasilisha kwa ufupi na kwa kawaida.
- source_word: ᾔδει
  choice: alijua
  rationale: Umbo hili la οἶδα linaeleza hali ya kujua katika wakati uliopita; wakati uliopita wa kawaida unafaa katika simulizi la Kiswahili.
- source_word: ἐξ ἀρχῆς
  choice: tangu mwanzo
  rationale: Huhifadhi maana ya wakati bila kufafanua kwa lazima ni mwanzo gani unaokusudiwa.
- source_word: οἱ μὴ πιστεύοντες
  choice: waliokuwa hawaamini
  rationale: Huwasilisha hali endelevu ya kutokuamini wakati Yesu alipokuwa anawajua, huku sentensi ikibaki ya kawaida katika Kiswahili.
- source_word: παραδώσων αὐτόν
  choice: ambaye angemsaliti
  rationale: Katika muktadha wa Yohana, tendo la kumkabidhi Yesu lina tabia ya usaliti. “Angemsaliti” huonyesha tendo la baadaye kwa mtazamo wa wakati uliopita na uzito wake wa kimahusiano; maana halisi zaidi imewekwa katika tanbihi.
theological_decisions:
- issue: Maana ya πιστεύω katika mwitikio wa wanafunzi kwa Yesu
  choice: kuamini
  alternative: kumtumaini
  rationale: “Kuamini” lina upana unaofaa katika matumizi ya Yohana na halipunguzi maana iwe ya kiakili pekee au ya kimahusiano pekee.
- issue: Tafsiri ya παραδίδωμι inapomhusu Yuda
  choice: kumsaliti
  alternative: kumkabidhi
  rationale: Muktadha unatambulisha kukabidhi huku kuwa tendo la hiana. Tafsiri “kumsaliti” huonyesha uzito wa simulizi, huku tanbihi ikihifadhi maana ya moja kwa moja zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, ya heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo “baadhi yenu” umechaguliwa badala ya “kuna baadhi miongoni mwenu” ili kuepuka uzito usio wa lazima.
