  text: ⸂ἠκολούθει δὲ⸃ αὐτῷ ὄχλος πολύς, ὅτι ⸀ἐθεώρουν τὰ σημεῖα ἃ ἐποίει ἐπὶ τῶν ἀσθενούντων.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/002.yaml
  text: And a large crowd was following him[a], because they were seeing the signs that he was doing on those who were sick.
translation:
  language: sw
  text: Umati mkubwa ulikuwa ukimfuata, kwa sababu walikuwa wakiziona ishara[a] alizokuwa akifanya kwa wagonjwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “miujiza” au “ishara za kimiujiza.” Neno “ishara,” analolitumia Yohana, linasisitiza yale ambayo matendo haya yanafunua kuhusu Yesu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠκολούθει
  choice: ulikuwa ukimfuata
  rationale: Kauli ya wakati usiotimilika inaonyesha tendo lililokuwa likiendelea zamani; muundo huu ni wa asili katika Kiswahili na unahifadhi hali hiyo.
- source_word: δὲ
  choice: (haikutafsiriwa kwa neno maalumu)
  rationale: Hapa δέ ni kiunganishi hafifu cha kuendeleza simulizi. Katika Kiswahili, kuanza moja kwa moja na kiima ni kwa kawaida na hakupotezi uhusiano wa simulizi.
- source_word: ὄχλος πολύς
  choice: umati mkubwa
  rationale: Huwakilisha kundi kubwa la watu kwa lugha ya kawaida na yenye heshima.
- source_word: ἐθεώρουν
  choice: walikuwa wakiziona
  rationale: Muundo huu unahifadhi tendo la kuona lililoendelea au lililorudiwa; katika muktadha huu kuona kunahusisha kushuhudia matendo hayo.
- source_word: σημεῖα
  choice: ishara
  rationale: Neno hili linadumisha msisitizo wa Yohana kwamba matendo hayo yanaelekeza kwenye maana inayomfunua Yesu, badala ya kutaja tu hali yake ya kimiujiza.
- source_word: ἐποίει
  choice: alizokuwa akifanya
  rationale: Huhifadhi hali endelevu ya kitenzi cha Kigiriki na kuunganika kwa kawaida na 'ishara'.
- source_word: ἐπὶ τῶν ἀσθενούντων
  choice: kwa wagonjwa
  rationale: Hueleza kwa Kiswahili cha asili kwamba wagonjwa ndio waliopokea au kunufaika na matendo hayo, bila kutumia muundo mgumu wa moja kwa moja.
- source_word: ἀσθενούντων
  choice: wagonjwa
  rationale: Katika muktadha huu neno linarejelea watu waliokuwa na maradhi ya mwili; 'wagonjwa' ni wazi na la kawaida.
theological_decisions:
- issue: Matumizi ya σημεῖα katika Injili ya Yohana
  choice: ishara
  alternative: miujiza; ishara za kimiujiza
  rationale: ‘Ishara’ huhifadhi maana ya matendo yanayoonyesha jambo kuhusu Yesu, bila kupunguza matendo hayo kuwa maajabu tu wala kuongeza ufafanuzi ndani ya maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha kawaida na chenye heshima. Miundo ya wakati unaoendelea imetumiwa kuhifadhi hali ya vitenzi vya Kigiriki bila kufanya sentensi kuwa nzito.
