translation:
  language: sw
  text: Anayekula nyama yangu[a] na kunywa damu yangu hukaa ndani yangu[b], nami ndani yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “anayetafuna”; kitenzi cha Kigiriki kina picha iliyo wazi zaidi kuliko neno la kawaida la kula.
    reason: lexical_alternative
  - marker: b
    text: 'Tafsiri za jadi: “hukaa ndani yangu, nami hukaa ndani yake.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ τρώγων
  choice: Anayeila
  rationale: Kifungu chenye kibainishi na kitenzi-jina cha wakati uliopo kinamtaja mtu anayejulikana kwa tendo hili. Muundo wa ‘anaye-’ unahifadhi umoja na hali ya tendo linaloendelea au kurudiwa.
- source_word: τρώγων
  choice: anayeila
  rationale: Kitenzi τρώγω kinaweza kuwa na picha iliyo wazi zaidi ya kula, kutafuna au kuguguna. ‘Kuila’ ni Kiswahili cha kawaida na chenye heshima katika muktadha huu; uzito wa kitenzi cha Kigiriki umeonyeshwa katika tanbihi bila kulazimisha tafsiri fulani ya kitheolojia.
- source_word: μου τὴν σάρκα
  choice: nyama yangu
  rationale: ‘Nyama’ linadumisha maana halisi na yenye kushtua ya σάρξ katika usemi huu kuliko ‘mwili,’ ambalo linaweza kueleweka kwa upana zaidi. Hapa neno halimaanishi tabia ya dhambi.
- source_word: καὶ πίνων μου τὸ αἷμα
  choice: na kuinywa damu yangu
  rationale: Muundo huu unaendeleza usambamba wa vitenzi viwili vya wakati uliopo na kuhifadhi picha halisi ya kunywa damu bila kuifafanua kwa mtazamo wa dhehebu fulani.
- source_word: ἐν ἐμοὶ μένει
  choice: hukaa ndani yangu
  rationale: ‘Hukaa’ ni usemi wa kawaida wa Kiswahili unaoweza kuonyesha uhusiano unaoendelea, na unadumisha dhana muhimu ya Yohana inayobebwa na μένω.
- source_word: κἀγὼ ἐν αὐτῷ
  choice: nami ndani yake
  rationale: Kigiriki hakirudii kitenzi katika sehemu hii. Kiswahili pia kinaweza kuhifadhi udondoshaji huo kwa kawaida bila kuongeza ‘hukaa.’
- source_word: αὐτῷ
  choice: yake
  rationale: Kiwakilishi hiki kinamrejelea mtu mmoja aliyetajwa kwa ‘anayeila.’ Kiswahili hakilazimiki kuonyesha jinsia katika kiwakilishi hiki.
theological_decisions:
- issue: Tafsiri ya kisakramenti dhidi ya tafsiri ya kimfano ya kula nyama na kunywa damu
  choice: Kuhifadhi maneno halisi ‘kuila nyama yangu’ na ‘kuinywa damu yangu’ bila maelezo ya kufasiri.
  alternative: Kuyafafanua wazi kuwa Meza ya Bwana, au kuyageuza kuwa tamathali inayomaanisha kumwamini Yesu.
  rationale: Kigiriki kinatumia picha hizi halisi lakini mstari wenyewe hausuluhishi mabishano ya kitheolojia kuhusu namna ya kuzielewa. Tafsiri haipaswi kuingiza msimamo wa dhehebu.
- issue: Lugha ya Yohana kuhusu kukaa kwa pande mbili
  choice: Kutafsiri μένει kuwa ‘hukaa ndani yangu’ na kuhifadhi ‘nami ndani yake.’
  alternative: ‘Huungana nami’ au ‘hudumu ndani yangu, nami hudumu ndani yake.’
  rationale: ‘Hukaa ndani’ huhifadhi wazo la uhusiano unaoendelea bila kulibadili kuwa kauli ya mfumo fulani wa kitheolojia; pia muundo wa sehemu ya pili unafuata udondoshaji wa kitenzi katika Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Nyama yangu’ limechaguliwa ili kuhifadhi maana thabiti ya σάρξ na ukali wa picha ya mstari huu; ‘hukaa ndani’ ni lugha ya kawaida na inayoeleweka kwa wasomaji wengi.
