  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οὐδεὶς δύναται ἐλθεῖν πρός ⸀με ἐὰν μὴ ὁ πατὴρ ὁ πέμψας με ἑλκύσῃ αὐτόν, κἀγὼ ἀναστήσω αὐτὸν ἐν τῇ ἐσχάτῃ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/044.yaml
  text: No one is able to come to me unless the Father who sent me draws him[b][a], and I will raise him up on the last day.
translation:
  language: sw
  text: Hakuna mtu awezaye kuja kwangu isipokuwa Baba aliyenituma amvute[a]; nami nitamfufua siku ya mwisho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “amkokote” au “amvute kwa nguvu.” Kitenzi cha Kigiriki kinaweza kuwa na maana yenye nguvu ya kuvuta; “amvute” limetumiwa katika andiko kuu ili kutolazimisha ufafanuzi fulani wa kitheolojia kuhusu jinsi Baba anavyomleta mtu kwa Mwana.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς δύναται
  choice: Hakuna mtu awezaye
  rationale: Huhifadhi ukanushi wa jumla pamoja na wazo la uwezo, kwa Kiswahili cha kawaida na chenye heshima.
- source_word: ἐλθεῖν πρός με
  choice: kuja kwangu
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya mwendo kuelekea kwa Yesu, bila kufafanua zaidi maana yake katika muktadha.
- source_word: ἐὰν μὴ
  choice: isipokuwa
  rationale: Huonyesha kwa ufasaha sharti hasi linalowekwa na sentensi ya Kigiriki.
- source_word: ὁ πατὴρ ὁ πέμψας με
  choice: Baba aliyenituma
  rationale: Kirai kishirikishi cha Kigiriki kimetolewa kama kishazi rejeshi cha asili katika Kiswahili, huku jina la uhusiano “Baba” likihifadhiwa.
- source_word: ἑλκύσῃ
  choice: amvute
  rationale: “Amvute” huhifadhi maana ya kusababisha mtu asogee au aje bila kuamua kimbele kama tendo hilo linapaswa kueleweka kuwa la kulazimisha; uwezekano wa maana yenye nguvu zaidi umeelezwa katika tanbihi.
- source_word: αὐτόν
  choice: am- / -m-
  rationale: Kiswahili humrejelea mtu wa ngeli ya kwanza kwa viambishi hivi bila kubainisha jinsia; hivyo rejeo la umoja limehifadhiwa bila kuingiza jinsia isiyotamkwa kiasili katika lugha lengwa.
- source_word: κἀγὼ
  choice: nami
  rationale: Huunganisha kaί na ἐγώ kwa ufupi na kwa mkazo wa kawaida wa Kiswahili.
- source_word: ἀναστήσω αὐτόν
  choice: nitamfufua
  rationale: Hutoa wazi maana ya kumrudisha mtu kutoka kwa wafu katika muktadha wa ufufuo, huku kiwakilishi cha umoja kikihifadhiwa.
- source_word: ἐν τῇ ἐσχάτῃ ἡμέρᾳ
  choice: siku ya mwisho
  rationale: Ni usemi wa kawaida wa Kiswahili unaohifadhi rejeo la kieskatolojia la Kigiriki.
theological_decisions:
- issue: Maana ya ἑλκύσῃ katika muktadha wenye mjadala wa kisoteriolojia
  choice: amvute
  alternative: amkokote; amvute kwa nguvu
  rationale: Kitenzi kinaweza kuonyesha kuvuta kwa nguvu katika baadhi ya miktadha, lakini “amvute” huhifadhi wigo wa maana bila kulazimisha hitimisho la kimadhehebu kuhusu namna Baba humleta mtu kwa Mwana.
- issue: Kiwakilishi cha kiume αὐτόν kinapotumiwa kwa uwakilishi wa jumla
  choice: 'viambishi vya umoja vya mtu: am- / -m-'
  alternative: mtu huyo
  rationale: Kiswahili hakibainishi jinsia katika viambishi hivi. Muundo huu huhifadhi umoja na rejeo la mtu bila kuongeza ufafanuzi usio wa lazima.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Muundo “Hakuna mtu awezaye” huhifadhi mkazo wa kutoweza, na “nami” huendeleza kwa ufasaha msisitizo wa Yesu. Tanbihi ya jinsia ya Kiingereza haijahitajika kwa sababu viambishi vya Kiswahili vya ngeli ya mtu havibainishi jinsia.
