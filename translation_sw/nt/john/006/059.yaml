  text: Alisema mambo haya alipokuwa akifundisha katika sinagogi huko Kapernaumu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταῦτα
  choice: mambo hayo
  rationale: Kiwakilishi hiki cha wingi wa jinsi ya kati kinarejelea maneno au mambo yaliyotangulia kama mkusanyo; “mambo hayo” huhifadhi wingi na urejeo wake.
- source_word: εἶπεν
  choice: Alisema
  rationale: Wakati uliopita wa λέγω unatafsiriwa moja kwa moja kwa “alisema”; mtenda asiyeandikwa wazi anaeleweka katika muktadha kuwa Yesu bila kulazimika kuongeza jina lake.
- source_word: ἐν συναγωγῇ
  choice: katika sinagogi
  rationale: Ingawa nomino haina kibainishi katika Kigiriki, muundo huu unaweza kurejelea sinagogi maalumu la mahali hapo; Kiswahili hakihitaji kutofautisha hapa kati ya kibainishi bainifu na kisichobainifu.
- source_word: διδάσκων
  choice: alipokuwa akifundisha
  rationale: Kivumishi-tendo cha wakati wa sasa kinaonyesha tendo lililoendelea sambamba na kusema; muundo huu wa Kiswahili huonyesha uhusiano huo kwa kawaida na kwa uwazi.
- source_word: ἐν Καφαρναούμ
  choice: huko Kapernaumu
  rationale: Kiambishi “huko” kinaonyesha mahali na hufanya sentensi ya Kiswahili iwe ya kawaida, huku jina la mahali likinakiliwa kwa umbo la Kiswahili “Kapernaumu.”
