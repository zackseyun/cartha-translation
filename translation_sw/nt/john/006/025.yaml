  text: Καὶ εὑρόντες αὐτὸν πέραν τῆς θαλάσσης εἶπον αὐτῷ· Ῥαββί, πότε ὧδε γέγονας;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/025.yaml
  text: And when they found him on the other side of the sea[a], they said to him, “Rabbi, when did you get here?”
translation:
  language: sw
  text: Nao walipomkuta ng’ambo ya bahari, wakamwambia, “Rabi, ulifika hapa lini?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Umekuja hapa lini?” Kitenzi cha Kigiriki kiko katika wakati timilifu na kinaweza kutafsiriwa hivyo kwa kufuata muundo wake kwa karibu zaidi; katika muktadha huu maana ya kawaida ni kuuliza wakati wa kufika.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Nao
  rationale: Kiunganishi hiki kinaendeleza simulizi kwa njia ya kawaida katika Kiswahili bila kuongeza maana mpya.
- source_word: εὑρόντες
  choice: walipomkuta
  rationale: Kauli ya kushiriki ya wakati uliopita inaonyesha tendo lililotangulia kauli kuu; muundo wa “walipomkuta” unaonyesha uhusiano huo wa wakati kwa Kiswahili cha kawaida.
- source_word: πέραν τῆς θαλάσσης
  choice: ng’ambo ya bahari
  rationale: Kirai hiki kinaonyesha mahali upande mwingine wa bahari; “ng’ambo ya bahari” ni fasaha, wazi, na kinadumisha tofauti ya kijiografia.
- source_word: εἶπον αὐτῷ
  choice: wakamwambia
  rationale: Hutafsiri moja kwa moja tendo la kusema kwa mtu, huku mfululizo wa simulizi ukionyeshwa kwa kiambishi “ka-”.
- source_word: Ῥαββί
  choice: Rabi
  rationale: Jina hili la heshima limetoholewa badala ya kutafsiriwa “Mwalimu,” ili kudumisha mazingira ya Kiyahudi na namna maalumu ya kumwita.
- source_word: πότε
  choice: lini
  rationale: Hili ndilo neno la kawaida la Kiswahili la kuuliza wakati.
- source_word: ὧδε
  choice: hapa
  rationale: Kielezi hiki cha mahali kinatafsiriwa kwa kawaida na kwa ufupi kuwa “hapa.”
- source_word: γέγονας
  choice: ulifika
  rationale: Ingawa ni kitenzi cha wakati timilifu cha γίνομαι, katika muktadha huu kinaeleza kufika au kuwapo mahali; “ulifika” ni Kiswahili cha kawaida katika swali kuhusu wakati wa kuwasili.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Nao” na “wakamwambia” hudumisha mtiririko wa kisimulizi; “Rabi” huhifadhi mazingira ya Kiyahudi.
