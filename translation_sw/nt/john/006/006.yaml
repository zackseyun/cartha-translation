translation:
  language: sw
  text: Lakini alisema hivyo ili kumjaribu[a], kwa maana yeye mwenyewe alijua alichokuwa karibu kufanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ili kumpima.” Kitenzi hiki kinaweza pia kumaanisha “kumshawishi atende dhambi,” lakini hapa maana yake ni kumweka katika jaribio au kumpima.
