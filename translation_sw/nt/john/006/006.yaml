lexical_decisions:
- source_word: τοῦτο δὲ ἔλεγεν
  choice: Lakini alisema hivyo
  rationale: δέ inaonyesha tofauti nyepesi na swali lililotangulia, huku τοῦτο ikirejelea jambo alilosema Yesu. Kiswahili cha masimulizi hutumia wakati uliopita sahili kwa kawaida, bila kulazimisha hali ya kuendelea ya ἔλεγεν.
- source_word: πειράζων αὐτόν
  choice: ili kumjaribu
  rationale: Katika muktadha huu kitenzi kina maana ya kumpima au kumweka katika jaribio, si kumshawishi atende dhambi. Muundo wa kusudi ‘ili’ unaonyesha kwa kawaida nguvu ya kielezi ya nomino-ambatani.
- source_word: αὐτὸς γὰρ ᾔδει
  choice: kwa maana yeye mwenyewe alijua
  rationale: ‘Kwa maana’ huleta maelezo yanayoanzishwa na γάρ, na ‘yeye mwenyewe’ huhifadhi msisitizo wa αὐτός.
- source_word: τί ἔμελλεν ποιεῖν
  choice: alichokuwa karibu kufanya
  rationale: Huhifadhi maana ya tendo lililokaribia au lililokusudiwa katika μέλλω pamoja na kitenzi-jina, bila kuamua kupita kiasi kati ya ukaribu na kusudi.
theological_decisions:
- issue: Maana ya πειράζων kuhusu tendo la Yesu kwa Filipo
  choice: kumjaribu
  alternative: kumshawishi; kumpima
  rationale: Muktadha unaonyesha kwamba Yesu alikuwa akipima uelewa au imani ya Filipo, si kumshawishi atende uovu. Tanbihi huhifadhi upana wa kimsamiati.
- issue: Msisitizo juu ya kujua kwa Yesu
  choice: yeye mwenyewe alijua
  alternative: alijua
  rationale: Kiwakilishi cha Kigiriki αὐτός kimetajwa wazi kwa msisitizo; tafsiri inahifadhi msisitizo huo bila kuongeza dai la kiteolojia lisilosemwa moja kwa moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa na chenye heshima. ‘Alisema hivyo’ ni cha kawaida zaidi katika masimulizi kuliko kuiga moja kwa moja hali ya kuendelea ya Kigiriki, na ‘alichokuwa karibu kufanya’ huhifadhi mtazamo wa mbele wa ἔμελλεν ποιεῖν.
