id: JHN.6.61
reference: John 6:61
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἰδὼς δὲ ὁ Ἰησοῦς ἐν ἑαυτῷ ὅτι γογγύζουσιν περὶ τούτου οἱ μαθηταὶ αὐτοῦ εἶπεν αὐτοῖς· Τοῦτο ὑμᾶς σκανδαλίζει;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/061.yaml
  text: But Jesus[a], knowing in himself that his disciples were grumbling about this, said to them, “Does this offend you?"
translation:
  language: sw
  text: Lakini Yesu, akijua moyoni mwake kwamba wanafunzi wake walikuwa wakinung’unika kuhusu jambo hilo, akawaambia, “Je, jambo hili linawakwaza[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “linawafanya mjikwae?”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: akijua
  rationale: Muundo wa kitenzi kishirikishi unaonyesha kwamba Yesu alikuwa na ufahamu huo wakati aliposema; “akijua” ni wa asili na huhifadhi uhusiano huo wa wakati.
- source_word: ἐν ἑαυτῷ
  choice: moyoni mwake
  rationale: Katika Kiswahili cha kawaida, “moyoni mwake” huwasilisha kwa ufasaha ufahamu wa ndani wa Yesu, bila kudokeza kwamba alipewa taarifa na mtu mwingine.
- source_word: γογγύζουσιν
  choice: walikuwa wakinung’unika
  rationale: Kitenzi hiki huonyesha maneno ya chini chini ya kutoridhika; “kunung’unika” huhifadhi maana hiyo kuliko neno la jumla “kulalamika.”
- source_word: περὶ τούτου
  choice: kuhusu jambo hilo
  rationale: Hurejelea yaliyotangulia katika mafundisho ya Yesu. Kuongeza “jambo” ni njia ya kawaida ya Kiswahili bila kufafanua zaidi ya chanzo.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: wanafunzi wake
  rationale: Ni tafsiri ya kawaida na haibani maana kwa wale Kumi na Wawili pekee.
- source_word: Τοῦτο
  choice: jambo hili
  rationale: Kiswahili cha kawaida huhitaji nomino ya kuandamana na kiashiria katika sentensi hii; “jambo hili” huacha rejeleo lake kwa yaliyotangulia bila kulifasiri kuwa fundisho maalumu.
- source_word: σκανδαλίζει
  choice: linawakwaza
  rationale: '“Kukwaza” huhifadhi kwa kiasi kikubwa upana wa kitenzi cha Kigiriki: kuudhi au kuwa sababu ya kujikwaa na kuacha kuamini. Tanbihi inaweka wazi maana ya pili.'
theological_decisions:
- issue: Maana ya σκανδαλίζει katika muktadha wa uwezekano wa kukataa maneno ya Yesu
  choice: Je, jambo hili linawakwaza?
  alternative: Je, jambo hili linawafanya mjikwae?
  rationale: Kigiriki kinaweza kumaanisha kuchukizwa na pia kusababishwa kujikwaa kiimani. “Linawakwaza” ni ya asili na bado ina mwangwi wa sitiari; tanbihi huhifadhi wazi uwezekano wenye uzito zaidi wa kuanguka au kuacha kuamini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa asili kwa wasomaji wa kawaida; “kunung’unika” huhifadhi sauti ya malalamiko ya chini chini, na “moyoni mwake” huepuka tafsiri ngumu ya neno kwa neno.
