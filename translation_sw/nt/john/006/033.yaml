  yaml_path: translation/nt/john/006/033.yaml
  text: For the bread of God is the one who comes down from heaven and gives life to the world[a].
translation:
  language: sw
  text: Kwa maana mkate wa Mungu ndiye anayeshuka kutoka mbinguni na kuupa ulimwengu uzima.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kile kinachoshuka kutoka mbinguni na kuupa ulimwengu uzima.” Maneno ya Kigiriki yanaweza kueleweka kwa namna isiyo ya kibinafsi, lakini viambishi vya kiume vinaelekea zaidi kwa mhusika binafsi.
    reason: alternative_reading
lexical_decisions:
- source_word: γὰρ
  choice: Kwa maana
  rationale: Inaonyesha kuwa kauli hii inatoa msingi au ufafanuzi wa kauli iliyotangulia kwa Kiswahili cha kawaida.
- source_word: ἄρτος
  choice: mkate
  rationale: Inahifadhi taswira halisi na sitiari kuu ya mazungumzo haya badala ya kuipanua kuwa ‘chakula.’
- source_word: τοῦ θεοῦ
  choice: wa Mungu
  rationale: Inafuata muundo wa uhusiano wa Kigiriki bila kuamua kimya kimya ikiwa maana hasa ni chanzo, umiliki, au utoaji.
- source_word: ὁ καταβαίνων
  choice: yeye anayeshuka
  rationale: Viambishi vya Kigiriki ni vya kiume, umoja, na vinaelekea kwa mhusika binafsi. ‘Anayeshuka’ pia huhifadhi tendo linaloendelea au la kitabia kwa Kiswahili cha asili.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: kutoka mbinguni
  rationale: Ni usemi wa kawaida wa Kiswahili unaohifadhi maana ya chanzo au asili.
- source_word: ζωὴν
  choice: uzima
  rationale: ‘Uzima’ ni neno la kawaida na lenye uzito katika muktadha wa Yohana, likidokeza zaidi ya kuwepo kimwili pekee bila kulifafanua kupita kiasi.
- source_word: διδοὺς
  choice: kuupa
  rationale: Muundo huu unaunganisha tendo la kutoa uzima na mhusika yuleyule anayeshuka, kwa mtiririko wa kawaida wa Kiswahili.
- source_word: τῷ κόσμῳ
  choice: ulimwengu
  rationale: Inahifadhi upana na mvutano wa neno κόσμος katika Yohana bila kulipunguza kuwa ‘wanadamu’ au ‘watu wote.’
theological_decisions:
- issue: Rejeo la kibinafsi au lisilo la kibinafsi katika ὁ καταβαίνων ... καὶ ζωὴν διδοὺς
  choice: yeye anayeshuka kutoka mbinguni na kuupa ulimwengu uzima
  alternative: kile kinachoshuka kutoka mbinguni na kuupa ulimwengu uzima
  rationale: Viambishi vya Kigiriki ni vya kiume umoja na kwa kawaida vinaelekeza kwa mhusika binafsi, jambo linalotangulia kujitambulisha kwa Yesu kama mkate; tanbihi inahifadhi uwezekano wa kuelewa sentensi kwa namna isiyo ya kibinafsi.
- issue: Upeo wa κόσμος
  choice: ulimwengu
  alternative: wanadamu / watu wote
  rationale: Neno hili huhifadhi upana wa kauli yenyewe bila kuamua mabishano ya kiteolojia kuhusu upeo au matumizi ya uzima unaotolewa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. ‘Yeye anayeshuka’ limetumiwa kwa uwazi wa rejeo la kibinafsi; ‘kuupa ulimwengu uzima’ ni mpangilio wa asili unaohifadhi ‘uzima’ kama kitu kinachotolewa.
