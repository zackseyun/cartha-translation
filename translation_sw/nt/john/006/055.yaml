  text: ἡ γὰρ σάρξ μου ⸀ἀληθής ἐστι βρῶσις, καὶ τὸ αἷμά μου ⸁ἀληθής ἐστι πόσις.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/055.yaml
  text: For my flesh is true food[a], and my blood is true drink.
translation:
  language: sw
  text: Kwa maana mwili wangu ni chakula cha kweli[a], na damu yangu ni kinywaji cha kweli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “chakula halisi” na “kinywaji halisi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: Kwa maana
  rationale: Inaonyesha kuwa kauli hii inaeleza na kuthibitisha yaliyotangulia, kwa njia ya kawaida na yenye heshima katika Kiswahili.
- source_word: σάρξ
  choice: mwili
  rationale: Katika Kiswahili cha kawaida, “mwili” huwasilisha kwa uwazi σάρξ ya Yesu katika mlingano wa mwili na damu; “nyama” hapa ingeweza kueleweka hasa kama nyama ya kuliwa na hivyo kuwa finyu au isiyo ya kawaida.
- source_word: ἀληθής
  choice: cha kweli
  rationale: Huhifadhi maana ya moja kwa moja ya kivumishi na uzito wake katika matumizi ya Yohana bila kuamua kimakusudi mabishano ya kiteolojia; “halisi” pia inawezekana.
- source_word: βρῶσις
  choice: chakula
  rationale: Muundo wa kiarifu pamoja na ἀληθής na ulinganifu wake na πόσις unaelekeza kwa kile kinacholiwa, si tendo la kula.
- source_word: αἷμα
  choice: damu
  rationale: Ni tafsiri ya moja kwa moja inayohifadhi ulinganifu wa mwili na damu bila kulainisha usemi.
- source_word: πόσις
  choice: kinywaji
  rationale: Katika muundo huu neno linaelekea kumaanisha kile kinachonywewa; “kinywaji” ni mwenza wa kawaida wa “chakula” katika Kiswahili.
theological_decisions:
- issue: Iwapo ἀληθής itafsiriwe “cha kweli” au “halisi” katika muktadha wenye mjadala kuhusu sakramenti
  choice: cha kweli
  alternative: halisi
  rationale: “Cha kweli” hufuata kwa karibu nguvu ya neno la Kigiriki na huhifadhi mvutano wa kiteolojia wa kifungu bila kulazimisha hitimisho fulani; tanbihi inataja tafsiri nyingine halali.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, fasaha na chenye heshima. Ulinganifu wa “mwili/damu” na “chakula/kinywaji” umehifadhiwa, pamoja na urudiaji wa “cha kweli” unaolingana na muundo wa Kigiriki.
