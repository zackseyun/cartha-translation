  yaml_path: translation/nt/john/006/062.yaml
  text: Then what if you were to see the Son of Man ascending to where he was before?[a]
translation:
  language: sw
  text: Basi, itakuwaje ikiwa mtamwona Mwana wa Adamu akipaa kwenda mahali alipokuwa hapo awali?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Basi, ikiwa mtamwona Mwana wa Adamu akipaa kwenda mahali alipokuwa hapo awali?” Kigiriki kina swali la balagha lenye sharti.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: Basi, itakuwaje ikiwa
  rationale: Muundo huu unaendeleza hoja kutokana na muktadha uliotangulia na kuwasilisha sharti kama swali la balagha kwa Kiswahili cha kawaida.
- source_word: θεωρῆτε
  choice: mtamwona
  rationale: Kitenzi kina maana ya kuona au kutazama kwa makini; katika sharti hili lenye mwelekeo wa jambo linaloweza kutokea, 'mtamwona' ni wazi na asilia.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  rationale: Hili ni jina la kujitambulisha la Yesu lililozoeleka katika Injili; linahifadhi pia mwangwi wake wa Kimasihi na wa kitabu cha Danieli.
- source_word: ἀναβαίνοντα
  choice: akipaa
  rationale: '''Akipaa'' huonyesha mwendo wa kwenda juu na kuhifadhi uwezekano wa maana ya kupaa mbinguni bila kuongeza mahali pasipotajwa wazi.'
- source_word: ὅπου ἦν τὸ πρότερον
  choice: kwenda mahali alipokuwa hapo awali
  rationale: Maneno haya yanahifadhi wazo la mahali au hali ya awali bila kulitaja wazi kuwa mbinguni au kwa Baba.
theological_decisions:
- issue: Iwapo kupaa kwa Yesu kufafanuliwe wazi kuwa kurudi mbinguni au kwa Baba
  choice: kwenda mahali alipokuwa hapo awali
  alternative: kurudi mbinguni, alikokuwa hapo awali; kurudi kwa Baba, alikokuwa hapo awali
  rationale: Kigiriki hudokeza kwa nguvu kuwako kwake hapo awali na kupaa kwake, lakini hakitaji wazi mbingu wala Baba. Tafsiri inaacha nguvu hiyo ya Kikristo isimame bila kuongeza ufafanuzi wa kitheolojia.
- issue: Iwapo sharti la Kigiriki liwasilishwe kama swali la balagha
  choice: Basi, itakuwaje ikiwa ...?
  alternative: Basi, ikiwa mtamwona ...?
  rationale: Sentensi ya Kigiriki ina umbo la swali la kisharti, na tafsiri iliyochaguliwa hulifanya hilo lieleweke kwa kawaida bila kuamua wazi jibu linalodokezwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. 'Itakuwaje ikiwa' hutumiwa kuonyesha swali la balagha kwa uwazi; 'hapo awali' ni ya kawaida lakini yenye hadhi, na 'akipaa' huhifadhi taswira ya mwendo wa kwenda juu.
