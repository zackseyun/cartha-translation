  text: οὗτός ἐστιν ὁ ἄρτος ὁ ⸀ἐξ οὐρανοῦ καταβάς, οὐ καθὼς ἔφαγον οἱ ⸀πατέρες καὶ ἀπέθανον· ὁ τρώγων τοῦτον τὸν ἄρτον ⸀ζήσει εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/058.yaml
  text: This is the bread that came down from heaven[a], not as the fathers ate and died[b]; the one who eats this bread will live forever.
translation:
  language: sw
  text: Huu ndio mkate ulioshuka kutoka mbinguni, wala si kama ule ambao baba[a] walikula, wakafa; anayekula mkate huu ataishi milele.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mababu.” Neno la Kigiriki ni la wingi, “baba,” na yaelekea linawarejelea mababu wa Israeli waliokula mana.
    reason: lexical_alternative
  - marker: b
    text: Kwa karibu, “ataishi mpaka enzi zote.” Huu ni usemi wa Kigiriki unaomaanisha kuishi milele.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτός ἐστιν ὁ ἄρτος
  choice: Huu ndio mkate
  rationale: Muundo huu ni wa kawaida katika Kiswahili na unahifadhi kish demonstrative pamoja na mkate maalumu unaozungumziwa katika muktadha.
- source_word: ὁ ἐξ οὐρανοῦ καταβάς
  choice: ulioshuka kutoka mbinguni
  rationale: Kirai cha Kiswahili chenye kitenzi cha uhusiano kinawasilisha vizuri kitenzi-shirikishi cha wakati uliopita na kuhifadhi maana ya kutoka mbinguni.
- source_word: οὐ καθὼς ἔφαγον οἱ πατέρες καὶ ἀπέθανον
  choice: si kama ule ambao baba walikula, nao wakafa
  rationale: Kiswahili huhitaji kukamilisha ulinganisho kwa njia ya kawaida; “ule” hurejelea mkate ulioliwa bila kubadili hoja. “Nao wakafa” huhifadhi mfuatano na ulinganisho wa Kigiriki.
- source_word: οἱ πατέρες
  choice: baba
  rationale: Huhifadhi neno la Kigiriki lenye jinsia ya kiume na dokezo la baba wa Israeli waliokula mana; “mababu” limetolewa kama uwezekano katika tanbihi.
- source_word: ὁ τρώγων τοῦτον τὸν ἄρτον
  choice: Anayekula mkate huu
  rationale: Huwasilisha kitenzi-shirikishi cha sasa kwa kauli ya jumla na ya kawaida, bila kuongeza maana ya kisakramenti au ya kimafumbo.
- source_word: ζήσει εἰς τὸν αἰῶνα
  choice: ataishi milele
  rationale: Ni usemi wa kawaida wa Kiswahili unaowasilisha kwa usahihi nahau ya Kiyohane kuhusu uhai usio na mwisho.
theological_decisions:
- issue: Wanaorejelewa na neno οἱ πατέρες katika ulinganisho wa mkate wa jangwani
  choice: baba
  alternative: mababu
  rationale: “Baba” huhifadhi umbo la kiume la Kigiriki na dokezo la baba wa Israeli, huku tanbihi ikionyesha kuwa maana ya ukoo, yaani mababu, inawezekana.
- issue: Nguvu ya τρώγων katika mafundisho kuhusu mkate wa uzima
  choice: anayekula
  alternative: anayejilisha kwa / anayeshiriki
  rationale: “Anayekula” ni ya moja kwa moja na isiyoegemea upande wowote; haifungi kifungu katika tafsiri ya kisakramenti pekee wala ya kimafumbo pekee.
- issue: Maana ya εἰς τὸν αἰῶνα
  choice: milele
  alternative: hata kwenye enzi
  rationale: “Milele” ni tafsiri ya kawaida ya nahau hii na inaeleza uhai unaodumu bila kuifanya tungo ya Kiswahili kuwa ngumu; umbo halisi limeelezwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Sentensi inatumia “ule” kukamilisha ulinganisho kwa ufasaha wa Kiswahili, na viashiria vya tanbihi vimewekwa moja kwa moja baada ya maneno yanayofafanuliwa.
