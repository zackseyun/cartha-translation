id: JHN.6.60
reference: John 6:60
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Πολλοὶ οὖν ἀκούσαντες ἐκ τῶν μαθητῶν αὐτοῦ εἶπαν· Σκληρός ἐστιν ⸂ὁ λόγος οὗτος⸃· τίς δύναται αὐτοῦ ἀκούειν;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/060.yaml
  text: Therefore many of his disciples[a], when they heard it, said, “This word is hard[b]; who can listen to it?”
translation:
  language: sw
  text: Kwa hiyo, wengi miongoni mwa wanafunzi wake waliposikia hayo, walisema, “Neno hili ni gumu[a]; ni nani anayeweza kulisikiliza?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Kauli hii ni ngumu,” “Ujumbe huu ni mgumu,” au “Fundisho hili ni gumu.” Neno la Kigiriki λόγος linaweza kuwa na maana hizo katika muktadha huu.
    reason: lexical_alternative
  - marker: b
    text: Au “ni nani anayeweza kulisikia?” Kitenzi cha Kigiriki kinaweza kumaanisha kusikia, kusikiliza, au kutii/kukubali, kutegemea muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πολλοὶ
  choice: wengi
  rationale: Ni kiashiria cha idadi kubwa ndani ya kundi la wanafunzi, na “wengi” ni tafsiri fupi na ya kawaida.
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Inaonyesha uhusiano wa hoja na maelezo ya Yesu yaliyotangulia, badala ya kuwa kiashiria cha wakati tu.
- source_word: ἀκούσαντες
  choice: waliposikia hayo
  rationale: Kirai tegemezi cha wakati ni cha asili katika Kiswahili. “Hayo” limetolewa na muktadha na linaelekeza kwenye maelezo yaliyotangulia.
- source_word: ἐκ τῶν μαθητῶν αὐτοῦ
  choice: miongoni mwa wanafunzi wake
  rationale: Inaweka wazi kwamba waliosema walikuwa sehemu ya kundi pana la wanafunzi wake.
- source_word: Σκληρός
  choice: gumu
  rationale: “Gumu” linaweza kueleza jambo lisilo rahisi kuelewa, kuvumilia, au kukubali, hivyo halifungi maana katika aina moja tu ya ugumu.
- source_word: ὁ λόγος οὗτος
  choice: Neno hili
  rationale: Linadumisha umoja wa λόγος na ukaribu wake wa kimuundo, huku likiruhusu maana ya kauli, ujumbe, au fundisho katika muktadha.
- source_word: τίς δύναται
  choice: ni nani anayeweza
  rationale: Ni njia ya kawaida na yenye hadhi ya kuuliza kuhusu uwezo.
- source_word: αὐτοῦ ἀκούειν
  choice: kulisikiliza
  rationale: “Kulisikiliza” linadumisha uhusiano na tendo la kusikia, huku likidokeza usikivu wa makusudi bila kutafsiri moja kwa moja kuwa kukubali.
theological_decisions:
- issue: Maana ya pingamizi la wanafunzi kuhusu maneno ya Yesu
  choice: Kauli hiyo inaeleza kwamba neno au fundisho la Yesu ni gumu kupokelewa au kustahimili, bila kubainisha kama ugumu huo ni wa kiakili, kimaadili, au unasababisha kukwazika.
  alternative: Kulieleza kuwa ni jambo gumu kuelewa tu, au kuwa ni fundisho la kuudhi na lisilovumilika tu.
  rationale: σκληρός linaweza kuwa na maana ya ugumu, ukali, au jambo lisilokubalika kwa urahisi. “Gumu” linahifadhi mvutano huo wa maana.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Miongoni mwa” linaonyesha kwa usahihi kuwa wasemaji walitoka ndani ya kundi la wanafunzi. “Neno hili ni gumu” limehifadhiwa ili kuepuka kufunga λόγος katika maana nyembamba ya “fundisho” pekee; tanbihi inaeleza mbadala wa kawaida.
source_grounding:
  english_pob_role: consult_only
