  text: τοῦτο δέ ἐστιν τὸ θέλημα τοῦ πέμψαντός ⸀με ἵνα πᾶν ὃ δέδωκέν μοι μὴ ἀπολέσω ἐξ αὐτοῦ ἀλλὰ ἀναστήσω ⸀αὐτὸ τῇ ἐσχάτῃ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/039.yaml
  text: 'And this is the will of the one who sent me: that I should lose nothing of all that he has given me[a], but should raise it up on the last day.'
translation:
  language: sw
  text: 'Na haya ndiyo mapenzi ya yule aliyenituma: nisipoteze chochote cha kile chote alichonipa[a], bali nikifufue siku ya mwisho.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kurejelea watu wazi zaidi, “nisimpoteze yeyote kati ya wote alionipa ... bali niwafufue.” Kigiriki kimetumia usemi wa umoja wenye maana ya mkusanyiko, kihalisi, “kile chote ambacho ... hicho.”
    reason: alternative_reading
lexical_decisions:
- source_word: θέλημα
  choice: mapenzi
  rationale: “Mapenzi” ni neno la kawaida katika Kiswahili kwa nia au kusudi la Mungu; hapa halimaanishi tamaa ya kawaida tu wala halilazimishi maana maalumu ya kiteolojia.
- source_word: τοῦ πέμψαντός με
  choice: ya yule aliyenituma
  rationale: Tafsiri hii inahifadhi nguvu ya kitenzi πέμπω na uhusiano unaoelezwa na kirai cha Kigiriki, huku ikisomeka kwa kawaida katika Kiswahili.
- source_word: ἵνα
  choice: nisipoteze ... bali nikifufue
  rationale: Muundo wa hali tegemezi baada ya nukta mbili unaonyesha yaliyomo katika mapenzi hayo na pia unadumisha kivuli cha kusudi kilicho katika ἵνα.
- source_word: πᾶν ὃ δέδωκέν μοι
  choice: kile chote alichonipa
  rationale: “Kile chote” kinahifadhi kadiri iwezekanavyo umoja wenye maana ya mkusanyiko wa πᾶν ὃ, badala ya kuugeuza moja kwa moja kuwa rejeo la watu mmoja mmoja.
- source_word: δέδωκέν
  choice: alichonipa
  rationale: Kiswahili hakitofautishi moja kwa moja wakati timilifu wa Kigiriki katika muundo huu; umbo hili linaonyesha tendo lililokamilika, na muktadha unaendeleza matokeo yake.
- source_word: μὴ ἀπολέσω ἐξ αὐτοῦ
  choice: nisipoteze chochote katika kile chote
  rationale: Katika muktadha huu ἀπόλλυμι ina maana ya kupoteza, si kuangamiza. “Chochote katika kile chote” huwasilisha maana ya kutopoteza sehemu yoyote ya jumla hiyo.
- source_word: ἀναστήσω αὐτό
  choice: nikifufue
  rationale: “Kufufua” linaonyesha kuinuliwa kutoka kwa wafu katika siku ya mwisho. Kiambishi cha ngeli “-ki-” kinarejelea kwa umoja kile kilichotajwa, hivyo kinahifadhi umoja wa αὐτό kadiri Kiswahili kinavyoruhusu.
- source_word: τῇ ἐσχάτῃ ἡμέρᾳ
  choice: siku ya mwisho
  rationale: Huu ni usemi wa kawaida, wazi, na wenye hadhi kwa rejeo la kieskatolojia katika Yohana.
theological_decisions:
- issue: Iwapo jumla iliyotolewa itafsiriwe wazi kama watu wengi au ihifadhiwe kama usemi wa umoja wenye maana ya mkusanyiko.
  choice: kile chote alichonipa ... nikifufue
  alternative: wote alionipa ... niwafufue
  rationale: Kigiriki kina maumbo ya umoja wa jinsia isiyo ya kiume wala ya kike (πᾶν, ὃ, αὐτό). Tafsiri kuu inahifadhi muundo huo na haiamui kimya kimya kwamba usemi huo lazima uelezwe kwa namna ya watu mmoja mmoja, ingawa muktadha unaweza kuwarejelea watu. Tanbihi inatoa tafsiri ya kibinafsi iliyo wazi zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “kile chote ... nikifufue” una ukakasi mdogo wa makusudi ili kuhifadhi umoja wenye maana ya mkusanyiko wa Kigiriki; tanbihi inafafanua tafsiri ya kawaida zaidi inayowarejelea watu.
