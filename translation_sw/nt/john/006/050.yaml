  text: οὗτός ἐστιν ὁ ἄρτος ὁ ἐκ τοῦ οὐρανοῦ καταβαίνων ἵνα τις ἐξ αὐτοῦ φάγῃ καὶ μὴ ἀποθάνῃ·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/050.yaml
  text: This is the bread that comes down from heaven[b][a], so that anyone may eat from it and not die.
translation:
  language: sw
  text: Huu ndio mkate unaoshuka kutoka mbinguni, ili mtu yeyote ale mkate huo na asife.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Usemi “asife” umeachwa ukiwa na maana pana; katika muktadha, unaweza kueleweka kwa namna mbalimbali kuwa kutokufa kiroho, kuepushwa na kifo cha mwisho, au kuepushwa na maangamizi ya wakati ujao.
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτός
  choice: Huu
  rationale: Kiwakilishi cha kuonyesha kinarejelea mkate unaotambuliwa na Yesu; “huu” ni cha kawaida na huhifadhi ukaribu wa usemi wa Kigiriki.
- source_word: ἄρτος
  choice: mkate
  rationale: Hii ndiyo maana ya kawaida ya neno hilo, na huhifadhi nguvu yake halisi na ya sitiari katika Yohana 6 bila kulifafanua kupita kiasi.
- source_word: ὁ ἐκ τοῦ οὐρανοῦ καταβαίνων
  choice: unaoshuka kutoka mbinguni
  rationale: Kirai cha wakati uliopo kinaonyesha tendo la kushuka; muundo wa kishazi tegemezi ni wa asili katika Kiswahili.
- source_word: οὐρανός
  choice: mbinguni
  rationale: Katika muktadha huu linaashiria makao ya Mungu ya mbinguni, si anga la kawaida.
- source_word: ἵνα
  choice: ili
  rationale: Huwasilisha kusudi au matokeo kwa Kiswahili cha kawaida na kwa ufupi.
- source_word: τις
  choice: mtu yeyote
  rationale: Huhifadhi maana ya jumla ya kiwakilishi kisichotaja mtu maalumu.
- source_word: ἐξ αὐτοῦ
  choice: sehemu yake
  rationale: Pamoja na kitenzi cha kula, ἐξ huonyesha kula kutokana na mkate huo; “ale sehemu yake” ni usemi wa asili unaohifadhi wazo hilo.
- source_word: φάγῃ
  choice: ale
  rationale: Huhifadhi hali ya utegemezi ndani ya kishazi cha kusudi bila kuongeza wazo la tendo linalorudiwa.
- source_word: μὴ ἀποθάνῃ
  choice: wala asife
  rationale: Tafsiri ya moja kwa moja ya kitenzi “kufa” huhifadhi upana na mvutano wa maana bila kuingiza tafsiri ya “kuangamia.”
theological_decisions:
- issue: Asili ya kifo katika usemi “asife”
  choice: Kudumisha usemi mpana “asife” bila kubainisha aina ya kifo.
  alternative: asife kiroho; asiangamie milele
  rationale: Mstari wenyewe haubainishi wazi ikiwa kifo kinachokusudiwa ni cha kimwili, kiroho, au cha mwisho. Usemi mpana huhifadhi kina na mvutano wa kitheolojia wa muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wazi kwa msomaji wa kawaida huku ukihifadhi sitiari ya mkate, hali ya tendo linaloendelea katika “unaoshuka,” na kutobainishwa kwa aina ya kifo.
