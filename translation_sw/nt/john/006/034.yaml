  yaml_path: translation/nt/john/006/034.yaml
  text: So they said to him[a], “Lord, always give us this bread.”
translation:
  language: sw
  text: Basi wakamwambia, “Bwana[a], utupe mkate huu daima.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Mheshimiwa.” Cheo hiki cha Kigiriki kinaweza kutumiwa kama namna ya heshima na pia kumaanisha “Bwana.”
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπον
  choice: wakamwambia
  rationale: Kitenzi hiki cha usimulizi kinaonyesha kwamba wao walisema naye; umoja wa yule aliyeambiwa umeonyeshwa katika kiambishi -mw-.
- source_word: οὖν
  choice: Basi
  rationale: Neno hili linaunganisha ombi lao na mazungumzo yaliyotangulia kwa mtiririko wa kawaida wa Kiswahili.
- source_word: Κύριε
  choice: Bwana
  rationale: “Bwana” huhifadhi uwezekano wa cheo hiki kuwa namna ya heshima na pia kuwa na maana ya kina zaidi kumhusu Yesu.
- source_word: πάντοτε
  choice: daima
  rationale: “Daima” huonyesha ombi la kupewa mkate huo wakati wote au kwa kuendelea.
- source_word: δὸς ἡμῖν
  choice: utupe
  rationale: Umbo hili la ombi linaunganisha kwa kawaida maana ya “toa” na yule anayepokea, yaani “sisi.”
- source_word: τὸν ἄρτον τοῦτον
  choice: mkate huu
  rationale: Tafsiri hii huhifadhi neno “mkate” na kiashiria kinachorejelea mkate uliozungumziwa.
theological_decisions:
- issue: Maana ya Κύριε katika kumwambia Yesu moja kwa moja
  choice: Bwana
  alternative: Mheshimiwa
  rationale: “Bwana” huhifadhi upana wa maana ya cheo cha Kigiriki bila kudai kwamba wasemaji tayari walielewa kikamilifu hadhi ya Yesu; tanbihi inaonyesha kwamba inaweza pia kuwa namna ya heshima.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya kawaida lakini yenye staha. “Basi” na “wakamwambia” huleta mtiririko wa simulizi, huku “utupe” ikiwa ombi la moja kwa moja na la asili.
