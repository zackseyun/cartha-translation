  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καθὼς ἀπέστειλέν με ὁ ζῶν πατὴρ κἀγὼ ζῶ διὰ τὸν πατέρα, καὶ ὁ τρώγων με κἀκεῖνος ⸀ζήσει δι’ ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/057.yaml
  text: Just as the living Father sent me[a], and I live because of the Father[b], so also the one who feeds on me will live because of me.
translation:
  language: sw
  text: Kama vile Baba aliye hai alivyonituma, nami ninaishi kwa sababu ya Baba[a], vivyo hivyo yule anayenila ataishi kwa sababu yangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ninaishi kupitia Baba,” na “ataishi kupitia mimi.” Kihusishi cha Kigiriki kinaweza kueleweka kwa maana ya sababu au ya njia; hapa maandishi yametumia maana ya sababu ili kuhifadhi ulinganifu kati ya Baba na Mwana, na kati ya Mwana na yule anayemla.
    reason: alternative_reading
lexical_decisions:
- source_word: καθὼς
  choice: Kama vile ... vivyo hivyo
  rationale: Muundo huu wa Kiswahili unaonyesha wazi ulinganisho unaotawala sentensi nzima na kuwakilisha nguvu ya κἀκεῖνος katika sehemu ya pili.
- source_word: ὁ ζῶν πατὴρ
  choice: Baba aliye hai
  rationale: Ni tafsiri ya moja kwa moja ya kirai chenye kivumishi-shirikishi, na haiingizi maana ya ziada ya ‘anayetoa uhai.’
- source_word: ἀπέστειλέν με
  choice: alivyonituma
  rationale: Wakati uliopita rahisi unafaa kwa aoristi, na umbo hili linaingia kwa kawaida katika muundo wa ulinganisho ‘kama vile ... alivyo-’.
- source_word: κἀγὼ ζῶ
  choice: nami ninaishi
  rationale: ‘Nami’ huhifadhi msisitizo wa ‘mimi pia,’ huku ‘ninaishi’ ikidumisha hali endelevu ya wakati uliopo.
- source_word: διὰ τὸν πατέρα
  choice: kwa sababu ya Baba
  rationale: διά pamoja na hali ya akusativi inaweza kuonyesha sababu au msingi; hapa tafsiri ya kisababu huhifadhi ulinganifu na δι’ ἐμέ.
- source_word: ὁ τρώγων με
  choice: yule anayenila
  rationale: τρώγω ni kitenzi halisi na chenye nguvu cha kula. ‘Anayenila’ huhifadhi taswira hiyo bila kuamua ikiwa maana ni ya kisakramenti au ya sitiari.
- source_word: κἀκεῖνος
  choice: vivyo hivyo yule
  rationale: Huwakilisha msisitizo wa ‘yule pia’ kwa Kiswahili cha kawaida na kusawazisha muundo ulioanzishwa na καθὼς.
- source_word: ζήσει
  choice: ataishi
  rationale: Huhifadhi wakati ujao na ulinganifu wa kitenzi cha kuishi.
- source_word: δι’ ἐμέ
  choice: kwa sababu yangu
  rationale: Tafsiri ya kisababu inalingana na ‘kwa sababu ya Baba’ na kuhifadhi ulinganifu wa Baba–Mwana na Mwana–anayemla.
theological_decisions:
- issue: Maana ya uhusiano wa uhai wa Yesu na Baba katika διὰ τὸν πατέρα
  choice: ‘Ninaishi kwa sababu ya Baba,’ bila kuongeza hitimisho kuhusu hali ya ontolojia ya Mwana.
  alternative: ‘Ninaishi kupitia Baba.’
  rationale: Kisababu ndicho kinacholingana vizuri na διά pamoja na akusativi na na kirai sambamba δι’ ἐμέ. Tafsiri inaacha kauli yenyewe isimame bila kuingiza fundisho la uduni wa Mwana au ufafanuzi wa ziada.
- issue: Nguvu ya kisakramenti au ya sitiari ya ὁ τρώγων με
  choice: ‘Yule anayenila,’ kwa lugha halisi na yenye nguvu.
  alternative: ‘Yule anayejilisha kwangu’ au ‘yule anayeshiriki nami.’
  rationale: Kitenzi cha Kigiriki kinataja kula kwa namna dhahiri. Tafsiri halisi huhifadhi mvutano wa kitheolojia na haifungii mstari katika fasiri ya kisakramenti pekee wala ya sitiari pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Anayenila’ ni halisi na wazi kama Kigiriki; hakuna istilahi ya kimadhehebu iliyoingizwa. Alama ya tanbihi [a] imewekwa baada ya kirai cha kwanza kinachohusika, na tanbihi inaeleza pia kirai sambamba cha mwisho.
