  text: εἶπον οὖν αὐτῷ· Τί οὖν ποιεῖς σὺ σημεῖον, ἵνα ἴδωμεν καὶ πιστεύσωμέν σοι; τί ἐργάζῃ;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/030.yaml
  text: So they said to him[a], “Then what sign are you doing, so that we may see and believe you? What work are you doing?”
translation:
  language: sw
  text: Kwa hiyo wakamwambia, “Basi, ni ishara gani unayoifanya ili tuione na kukuamini[a]? Ni kazi gani unayoifanya?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuamini unayosema,” au “kukutegemea.” Kigiriki kinasema kwa maana ya moja kwa moja zaidi “kukuamini,” kikitumia kiwakilishi katika hali ya dativu badala ya usemi wa kawaida zaidi katika Yohana wa “kuamini katika yeye.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπον οὖν αὐτῷ
  choice: Kwa hiyo wakamwambia
  rationale: ‘Kwa hiyo’ linaonyesha uhusiano wa kimantiki na maneno yaliyotangulia, huku ‘wakamwambia’ likiwa simulizi la kawaida na la heshima katika Kiswahili.
- source_word: Τί οὖν
  choice: Basi, ni ... gani
  rationale: ‘Basi’ linahifadhi οὖν ya pili na msisitizo wa swali lao linalomkabili Yesu.
- source_word: ποιεῖς σὺ σημεῖον
  choice: ni ishara gani unayoifanya
  rationale: ‘Ishara’ huhifadhi istilahi muhimu ya Yohana σημεῖον bila kuongeza kwa ufafanuzi kwamba ni muujiza; umbo la sasa ‘unayoifanya’ linaendana na ποιεῖς.
- source_word: ἵνα ἴδωμεν καὶ πιστεύσωμέν σοι
  choice: ili tuione na kukuamini[a]
  rationale: ‘Ili’ linaonyesha kusudi la ἵνα; ‘tuione’ linarejelea ishara, na ‘kukuamini’ linaacha wazi maana ya kumwamini mtu au kuyaamini madai yake, kama ilivyo katika πιστεύω pamoja na kiwakilishi cha udativu.
- source_word: τί ἐργάζῃ
  choice: Ni kazi gani unayoifanya?
  rationale: Neno ‘kazi’ linawakilisha dhana ya ἐργάζομαι na kulitofautisha kwa kiasi na swali la kwanza, huku marudio ya ‘unayoifanya’ yakihifadhi usambamba wa maswali.
theological_decisions:
- issue: Maana ya πιστεύω pamoja na σοι ya udativu
  choice: kukuamini
  alternative: kuamini katika wewe; kukutumaini
  rationale: Muundo wa Kigiriki hauna εἰς, ambao Yohana hutumia mara nyingi kwa maana ya ‘kuamini katika.’ Kiswahili ‘kukuamini’ huhifadhi maana ya moja kwa moja bila kulazimisha tafsiri ya kiteolojia iliyo pana zaidi; tanbihi inaonyesha uwezekano wa maana.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Marudio ya ‘Kwa hiyo/Basi’ na ya ‘unayoifanya’ yamehifadhiwa kwa sababu yanaakisi msukumo na usambamba wa maandishi ya Kigiriki.
