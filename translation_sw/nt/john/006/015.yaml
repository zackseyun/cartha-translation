base_translation:
  language: en
  yaml_path: translation/nt/john/006/015.yaml
  text: So Jesus[a], knowing that they were about to come and seize him in order to make him king, withdrew again to the mountain by himself.
translation:
  language: sw
  text: Kwa hiyo Yesu, akijua kwamba walikuwa karibu kuja na kumkamata kwa nguvu ili wamfanye mfalme, akajiondoa tena kwenda mlimani, akiwa peke yake.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Inaendeleza simulizi kwa kuonyesha matokeo ya tukio lililotangulia, huku ikidumisha nguvu ya kiunganishi cha Kigiriki.
- source_word: γνοὺς
  choice: akijua
  rationale: Kirai hiki cha kitenzi kinaeleza hali iliyosababisha Yesu kuondoka; “akijua” ni sahihi na ya kawaida katika Kiswahili.
- source_word: μέλλουσιν ἔρχεσθαι
  choice: walikuwa karibu kuja
  rationale: Inaonyesha kwamba kitendo kilikuwa kinakaribia kutokea, bila kukigeuza kuwa nia tu.
- source_word: ἁρπάζειν
  choice: kumkamata
  rationale: “Kumkamata” huonyesha kumtia mtu mikononi bila ridhaa yake; dokezo linaweka wazi zaidi maana ya kutumia nguvu iliyomo katika kitenzi cha Kigiriki.
- source_word: ἵνα ποιήσωσιν βασιλέα
  choice: ili wamfanye mfalme
  rationale: “Ili” inaonyesha wazi kusudi linaloelezwa na ἵνα pamoja na kitenzi cha hali tegemezi.
- source_word: ἀνεχώρησεν
  choice: akaondoka
  rationale: Katika muktadha huu linaonyesha Yesu kujiondoa mahali na kuepuka mpango wa umati; “akaondoka” ni ya asili katika simulizi la Kiswahili.
- source_word: πάλιν
  choice: tena
  rationale: Inahifadhi wazo la kurudiwa kwa tendo.
- source_word: εἰς τὸ ὄρος
  choice: kwenda mlimani
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha mwendo kuelekea eneo la mlima bila kulibainisha kupita maandishi.
- source_word: αὐτὸς μόνος
  choice: akiwa peke yake
  rationale: Inaonyesha kwa kawaida na kwa mkazo kwamba Yesu hakuwa pamoja na mtu mwingine.
theological_decisions:
- issue: Namna umati ulivyokusudia kumfanya Yesu mfalme
  choice: kumkamata ili wamfanye mfalme
  alternative: kumchukua kwa nguvu ili wamfanye mfalme
  rationale: Kitenzi ἁρπάζειν kinaonyesha tendo lisilo la hiari na lenye nguvu. Tafsiri kuu haifanyi tukio hili kuwa mwaliko wa kawaida, na dokezo linaweka wazi zaidi uzito wa matumizi ya nguvu bila kuingiza maelezo ya kidhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa simulizi ni wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. Muundo “akiwa peke yake” ni wa asili zaidi kuliko kurudia maneno yenye maana moja.
