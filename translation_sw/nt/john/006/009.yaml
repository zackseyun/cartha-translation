  yaml_path: translation/nt/john/006/009.yaml
  text: There is a boy here who has five barley loaves and two fish[a], but what are these for so many?
translation:
  language: sw
  text: Kuna mvulana hapa aliye na mikate mitano ya shayiri na samaki wawili, lakini hivi ni nini kwa watu wengi kiasi hiki?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Hivi vinatosha nini kwa watu wengi kiasi hiki?”
    reason: Hutoa kwa uwazi maana ya tathmini ya utoshelevu inayowezekana katika swali la balagha, bila kuifanya kuwa tafsiri pekee ya maneno ya msingi.
lexical_decisions:
- source_word: παιδάριον
  choice: mvulana
  rationale: Neno hili humaanisha mtoto au kijana wa kiume. “Mvulana” ni la kawaida na la sasa bila kuongeza wazo lisilo lazima kwamba alikuwa mdogo sana.
- source_word: ὧδε
  choice: hapa
  rationale: Ni kielezi cha mahali, na “hapa” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: ὃς ἔχει
  choice: aliye na
  rationale: Kishazi hiki kinamtambulisha mvulana kwa kile alicho nacho; “aliye na” ni Kiswahili cha asili na wazi.
- source_word: ἄρτους κριθίνους
  choice: mikate mitano ya shayiri
  rationale: ἄρτους hurejelea mikate, huku κριθίνους ikibainisha kuwa ilitengenezwa kwa shayiri.
- source_word: ὀψάρια
  choice: samaki wawili
  rationale: Katika muktadha huu neno linarejelea samaki walioliwa pamoja na mkate. Tafsiri “samaki” ni wazi bila kulazimisha maana ya kwamba walikuwa wadogo.
- source_word: ἀλλὰ
  choice: lakini
  rationale: Huonyesha tofauti kati ya chakula kilichopo na wingi wa watu.
- source_word: ταῦτα τί ἐστιν
  choice: hivi ni nini
  rationale: Inadumisha muundo na nguvu ya swali la balagha bila kufafanua kimya-kimya kama linahusu kiasi, manufaa, au utoshelevu.
- source_word: εἰς τοσούτους
  choice: kwa watu wengi hivi
  rationale: Kirai hiki kinaonyesha kutotosha kwa vitu hivyo kuhusiana na idadi kubwa ya watu; tafsiri hii ni ya kawaida na huhifadhi maana hiyo.
