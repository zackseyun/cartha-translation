  text: καὶ ἔλεγεν· Διὰ τοῦτο εἴρηκα ὑμῖν ὅτι οὐδεὶς δύναται ἐλθεῖν πρός με ἐὰν μὴ ᾖ δεδομένον αὐτῷ ἐκ τοῦ ⸀πατρός.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/065.yaml
  text: And he was saying[b][a], “For this reason I have told you that no one is able to come to me unless it has been given to him from the Father.”
translation:
  language: sw
  text: Naye alikuwa akisema, “Kwa sababu hii nimewaambia kwamba hakuna mtu anayeweza kuja kwangu isipokuwa awe amepewa kutoka kwa Baba.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγεν
  choice: alikuwa akisema
  rationale: Kauli ya wakati uliopita usiotimilika inaonyesha usemi uliokuwa ukiendelea katika muktadha; tafsiri hii inahifadhi hali hiyo kwa Kiswahili cha kawaida.
- source_word: Διὰ τοῦτο
  choice: Kwa sababu hii
  rationale: Kirai hiki kinarejelea yaliyoelezwa kabla na kutambulisha sababu ya kauli inayofuata.
- source_word: εἴρηκα ὑμῖν
  choice: nimewaambia
  rationale: Wakati timilifu unaonyesha kauli iliyotolewa awali ambayo bado ina umuhimu; kiambishi -wa- kinawakilisha ὑμῖν kwa ufasaha.
- source_word: οὐδεὶς δύναται
  choice: hakuna mtu anayeweza
  rationale: Hueleza kutoweza, si kukosa ruhusa; muundo huu ni wazi na wa kawaida.
- source_word: ἐλθεῖν πρός με
  choice: kuja kwangu
  rationale: Ni tafsiri ya kawaida inayohifadhi wazo la kumjia Yesu bila kulifafanua zaidi kiteolojia.
- source_word: ἐὰν μὴ ᾖ δεδομένον αὐτῷ
  choice: isipokuwa awe amepewa
  rationale: Muundo huu unahifadhi sharti na hali ya kutendwa ya δεδομένον. Kiswahili huweka mpokeaji ndani ya umbo la kitenzi, hivyo hakuna haja ya kurudia kiwakilishi kinacholingana na αὐτῷ.
- source_word: ἐκ τοῦ πατρός
  choice: na Baba
  rationale: Ingawa ἐκ huonyesha chanzo, katika muundo wa Kiswahili wa kutendwa, 'na Baba' humtaja kwa kawaida yule ambaye kwake utoaji unatoka; 'kutoka kwa Baba' pia inawezekana lakini ni nzito zaidi hapa.
theological_decisions:
- issue: Kuwezeshwa na Mungu na uwezo wa mwanadamu kumjia Yesu
  choice: Kauli imetafsiriwa kama kutoweza kumjia Yesu isipokuwa mtu awe amepewa jambo hilo na Baba, bila kufafanua namna au kiwango cha utoaji huo.
  alternative: Kuitafsiri kwa maneno yanayoeleza utoaji huo kuwa mwito wenye matokeo yasiyozuilika, au neema inayotangulia na inayoweza kukataliwa.
  rationale: Kiyunani kinaweka sharti la lazima lakini hakiamui hapa mabishano ya baadaye kuhusu uhusiano wa tendo la Mungu na mwitikio wa mwanadamu.
- issue: Kirejeleo cha kiume cha umoja αὐτῷ chenye maana ya jumla
  choice: Maana ya mtu mmoja imehifadhiwa kupitia 'awe amepewa', bila kuweka jinsia ya kiume isiyolazimika katika sarufi ya Kiswahili.
  alternative: Kutumia 'apewe yeye' au 'apewe mtu huyo'.
  rationale: Kiswahili hakihitaji kuonyesha jinsia katika kiambishi cha nafsi ya tatu; umoja na maana ya jumla vinahifadhiwa bila kupotosha chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. 'Alikuwa akisema' huhifadhi hali ya tendo linaloendelea, huku 'Naye' ikiunganisha mstari huu na mazungumzo yaliyotangulia. Kitenzi 'amepewa' kimeachwa bila kitu kilichotajwa, kama ilivyo katika Kiyunani, ili kutohitimisha kwa siri ikiwa kinachotolewa ni uwezo, ruhusa, au jambo jingine.
