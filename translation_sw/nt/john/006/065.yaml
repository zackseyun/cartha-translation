review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the imperfect ἔλεγεν, the perfect εἴρηκα, the inability expressed by οὐδεὶς δύναται, and the necessary condition. However, the final phrase should retain ἐκ as source ('kutoka kwa') rather than rendering it as the agentive 'na Baba.'
  naturalness: The wording is clear, idiomatic Standard East African Swahili, and suitably formal. 'Isipokuwa awe amepewa kutoka kwa Baba' preserves the source’s deliberately unstated thing given while remaining understandable.
  terminology: '''Baba'' is appropriate in this Johannine context. The supplied footnote alternative ''aruhusiwe'' means ''be permitted'' and can weaken or shift the sense of δεδομένον (''has been given/granted''); it should be removed rather than retained as a lexical alternative.'
  issues:
  - severity: medium
    issue: The main text renders ἐκ τοῦ πατρός as 'na Baba.'
    rationale: In this passive construction, 'na Baba' normally marks agency ('by the Father'), whereas ἐκ marks source/origin. 'Kutoka kwa Baba' more directly preserves the Greek preposition and avoids the shift noted in the English audit trail.
  - severity: medium
    issue: Footnote a gives 'aruhusiwe' ('be permitted') as an alternative.
    rationale: Permission is not an adequately close lexical alternative for δεδομένον, a passive form of 'give.' It may introduce a distinction between permission and divine giving that the Greek wording does not make.
  revised_text: Naye alikuwa akisema, “Kwa sababu hii nimewaambia kwamba hakuna mtu anayeweza kuja kwangu isipokuwa awe amepewa kutoka kwa Baba.”
