  to: Naye alikuwa akisema, “Kwa sababu hii nimewaambia kwamba hakuna mtu anayeweza kuja kwangu isipokuwa awe amepewa kutoka kwa Baba.”
  rationale: The revision changes only the final prepositional phrase to preserve the source sense of ἐκ ('from') and removes an alternative footnote that is semantically misleading. It leaves the unspecified neuter subject of δεδομένον unexpanded, preserving the Greek ambiguity and avoiding theological elaboration.
