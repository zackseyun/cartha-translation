  yaml_path: translation/nt/john/006/013.yaml
  text: So they gathered them[b][a], and filled twelve baskets with pieces from the five barley loaves left over by those who had eaten.
translation:
  language: sw
  text: Basi wakavikusanya, wakajaza vikapu kumi na viwili kwa vipande[a] vya ile mikate mitano ya shayiri vilivyobaki baada ya wale waliokuwa wamekula.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “vipande vilivyovunjika.”
    reason: lexical_alternative
  - marker: b
    text: Kwa halisi, “vilivyokuwa vya ziada kwa wale waliokuwa wamekula”; maana yake katika muktadha ni vipande vilivyobaki baada ya mlo.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήγαγον οὖν
  choice: Basi wakavikusanya
  rationale: “Basi” linaonyesha matokeo ya agizo la Yesu katika mstari uliotangulia; kiambishi “-vi-” kinarejelea vipande vilivyotajwa katika muktadha.
- source_word: ἐγέμισαν δώδεκα κοφίνους
  choice: wakajaza vikapu kumi na viwili
  rationale: Tafsiri ya moja kwa moja na ya kawaida; “vikapu” hakiongezi umahususi usiothibitishwa kuhusu aina au ukubwa wake.
- source_word: κλασμάτων
  choice: vipande
  rationale: Neno linaonyesha vipande vilivyovunjwa vya mikate; “vipande” ni Kiswahili cha kawaida na kinachoeleweka.
- source_word: ἐκ τῶν πέντε ἄρτων τῶν κριθίνων
  choice: vya ile mikate mitano ya shayiri
  rationale: Huhifadhi idadi na aina ya nafaka, huku “ile” ikirejelea mikate iliyokwisha tajwa katika simulizi.
- source_word: ἃ ἐπερίσσευσαν τοῖς βεβρωκόσιν
  choice: vilivyowazidia wale waliokuwa wamekula
  rationale: Hufuata muundo amilifu wa Kigiriki na kuhifadhi uhusiano wa dative bila kuufanya kwa lazima kuwa kauli ya kutendwa; maana katika muktadha ni vipande vilivyobaki baada ya watu kula.
theological_decisions:
- issue: Uhusiano wa ἐπερίσσευσαν na τοῖς βεβρωκόσιν
  choice: vilivyowazidia wale waliokuwa wamekula
  alternative: vilivyobaki baada ya watu kula
  rationale: Chaguo kuu linahifadhi kwa karibu zaidi usemi wa Kigiriki, ambao kwa halisi una wazo la kuzidi/kuwa tele kwa waliokula; tanbihi inaeleza maana ya kimuktadha bila kuondoa mvutano huo katika matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa masimulizi “Basi waka-” ni wa asili; msamiati umewekwa wazi kwa wasomaji wa kawaida bila kupoteza hali ya usemi wa Kigiriki.
