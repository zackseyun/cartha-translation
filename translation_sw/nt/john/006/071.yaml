base_translation:
  language: en
  yaml_path: translation/nt/john/006/071.yaml
  text: He was speaking about Judas[a], the son of Simon Iscariot, for this one was about to betray him, being one of the Twelve.
translation:
  language: sw
  text: Alikuwa akisema kuhusu Yuda[a], mwana wa Simoni Iskariote, kwa maana huyo ndiye aliyekuwa karibu kumsaliti, mmoja wa wale Kumi na Wawili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa tafsiri ya karibu zaidi na neno la asili: “kumkabidhi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν δὲ τὸν Ἰούδαν
  choice: Alikuwa akisema habari za Yuda
  rationale: Kauli ya wakati uliopita unaoendelea (ἔλεγεν) hapa ni ufafanuzi wa msimulizi; “alikuwa akisema habari za” ni Kiswahili cha kawaida kinachoonyesha kuwa Yesu alikuwa akimrejelea Yuda. δέ haihitaji kiunganishi cha wazi katika muktadha huu.
- source_word: Σίμωνος Ἰσκαριώτου
  choice: mwana wa Simoni Iskariote
  rationale: Viambishi vya umilikaji vinaeleweka kwa kawaida kuwa vinamtambulisha Yuda kwa uhusiano wa mwana na baba, huku “Iskariote” ikimhusu Simoni kisarufi.
- source_word: οὗτος γὰρ
  choice: kwa maana huyo ndiye
  rationale: “Kwa maana” huleta sababu ya ufafanuzi, na “huyo ndiye” huhifadhi msisitizo wa kiwakilishi demonstrativi οὗτος bila kuwa kizito.
- source_word: ἔμελλεν παραδιδόναι αὐτόν
  choice: aliyekuwa karibu kumsaliti
  rationale: “Alikuwa karibu” huhifadhi mtazamo wa tendo lililokuwa mbele na karibu kutokea; “kumsaliti” huwasilisha maana ya παραδίδωμι katika simulizi la Yuda kwa lugha wazi.
- source_word: εἷς ἐκ τῶν δώδεκα
  choice: ingawa alikuwa mmoja wa wale Kumi na Wawili
  rationale: Kirai hiki kinasisitiza hali ya kushangaza kwamba msaliti alikuwa ndani ya kundi la wale Kumi na Wawili. “Ingawa” huifanya sentensi iwe ya kawaida na kuonyesha mvutano uliomo katika muktadha.
theological_decisions:
- issue: Maana ya παραδιδόναι kuhusu tendo la Yuda
  choice: kumsaliti
  alternative: kumkabidhi
  rationale: Kitenzi kinaweza kumaanisha “kumkabidhi,” lakini katika muktadha wa Yuda kinaeleza usaliti. Tanbihi huhifadhi maana yake halisi zaidi bila kuongeza dai la kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa kawaida kwa msomaji wa jumla; “wale Kumi na Wawili” linahifadhi jina la kundi maalumu.
