base_translation:
  language: en
  yaml_path: translation/nt/john/006/035.yaml
  text: Jesus said to them, “I am the bread of life; the one who comes to me will never hunger, and the one who believes in me will never thirst again.”
translation:
  language: sw
  text: Yesu aliwaambia, “Mimi ndimi mkate wa uzima. Yeyote anayekuja kwangu hataona njaa kamwe, na yeyote anayeniamini hataona kiu kamwe.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kigiriki kinasisitiza ukanushaji huu: “hataona kiu kamwe, hata wakati wowote.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν αὐτοῖς
  choice: akawaambia
  rationale: Katika simulizi, muundo huu wa Kiswahili unawasilisha kwa kawaida kitenzi cha wakati uliopita pamoja na yambwa ‘wao,’ bila kuongeza maudhui yasiyokuwapo.
- source_word: Ἐγώ εἰμι
  choice: Mimi ndimi
  rationale: Huhifadhi msisitizo wa kiwakilishi Ἐγώ na utambulisho wa moja kwa moja kwa Kiswahili cha heshima na cha kawaida katika kauli nzito ya kujitambulisha.
- source_word: ὁ ἄρτος τῆς ζωῆς
  choice: mkate wa uzima
  rationale: Ni tafsiri ya karibu na ya kawaida inayohifadhi muundo wa kisitiari na haubadili usemi kuwa ufafanuzi wa ‘mkate unaotoa uzima.’
- source_word: ὁ ἐρχόμενος πρὸς ἐμέ
  choice: yeyote anayekuja kwangu
  rationale: Huwakilisha kishiriki chenye matumizi ya nomino kwa usemi wa jumla na wa asili katika Kiswahili.
- source_word: οὐ μὴ πεινάσῃ
  choice: hataona njaa kamwe
  rationale: ‘Kuona njaa’ ni nahau ya kawaida ya Kiswahili; ‘kamwe’ huwasilisha ukanushaji wenye nguvu wa οὐ μή.
- source_word: ὁ πιστεύων εἰς ἐμέ
  choice: yeyote anayeniamini
  rationale: ‘Kumwamini’ mtu ni Kiswahili cha kawaida kwa πιστεύω εἰς katika maana ya kumtegemea au kuweka imani kwake, bila kulazimisha ufafanuzi wa kimadhehebu.
- source_word: οὐ μὴ διψήσει πώποτε
  choice: hataona kiu kamwe
  rationale: Huhifadhi maana ya kutopata kiu wakati wowote; ‘kamwe’ huwasilisha pamoja nguvu ya οὐ μή na πώποτε bila kuingiza maana ya ‘tena,’ ambayo haimo wazi katika neno la Kigiriki.
theological_decisions:
- issue: Maana ya πιστεύων εἰς ἐμέ
  choice: anayeniamini
  alternative: anayeniwekea tumaini
  rationale: Chaguo kuu ni la moja kwa moja, la kawaida, na huhifadhi lugha ya kuamini katika Injili ya Yohana. Chaguo la ‘tumaini’ linaonyesha kipengele cha utegemezi lakini linafafanua zaidi kuliko chanzo.
- issue: Nguvu ya utambulisho Ἐγώ εἰμι
  choice: Mimi ndimi
  alternative: Mimi ni
  rationale: ‘Mimi ndimi’ huhifadhi msisitizo wa kiwakilishi na kauli ya kujitambulisha bila kuongezea ufafanuzi wa kitheolojia.
- issue: Upeo wa ahadi kuhusu njaa na kiu
  choice: hataona njaa kamwe ... hataona kiu kamwe
  alternative: hatakuwa na njaa kabisa ... hatakuwa na kiu wakati wowote
  rationale: Tafsiri inahifadhi ukanushaji mkali wa Kigiriki na sitiari katika muktadha, bila kueleza kimyakimya kama ahadi hiyo ni ya kimwili, ya kiroho, au yote mawili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Mkate wa uzima’ huhifadhi sitiari iliyozoeleka; ‘kuona njaa/kiu’ ni usemi wa kawaida unaoeleweka kwa urahisi. Alama ya tanbihi [a] imewekwa baada ya kishazi inachokifafanua.
