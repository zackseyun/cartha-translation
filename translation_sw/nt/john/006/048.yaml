lexical_decisions:
- source_word: ἐγώ εἰμι
  choice: Mimi ndimi
  rationale: Muundo huu wa Kiswahili unatoa utambulisho wa moja kwa moja na wenye msisitizo wa kawaida unaolingana na kiwakilishi cha wazi ἐγώ pamoja na εἰμι. Pia unasikika kwa heshima na kwa kawaida katika kauli hii nzito.
- source_word: ὁ ἄρτος
  choice: mkate
  rationale: “Mkate” ndilo neno la kawaida na linaloeleweka kwa ἄρτος. Kiswahili hakina kibainishi maalumu kinacholingana moja kwa moja na ὁ; katika sentensi hii, muundo wa utambulisho “ndimi mkate” unahifadhi dhima yake ya kumtambulisha Yesu bila kuongeza neno lisilohitajika.
- source_word: τῆς ζωῆς
  choice: wa uzima
  rationale: “Wa uzima” huhifadhi kwa ufupi uhusiano wa kimilikishi/kiuhusiano wa Kigiriki bila kuufasiri wazi kuwa “unaotoa uzima.” “Uzima” linafaa katika muktadha wa Yohana, ambako ζωή mara nyingi humaanisha zaidi ya kuwapo kimwili tu.
theological_decisions:
- issue: Nguvu ya kauli ya kujitambulisha ya ἐγώ εἰμι
  choice: Mimi ndimi
  alternative: Mimi ni; Ni mimi niliye
  rationale: Tafsiri inahifadhi kujitambulisha kwa nguvu kwa Yesu lakini haipanui kauli hii kana kwamba ni matumizi huru ya ἐγώ εἰμι; hapa kuna kiarifu wazi, “mkate wa uzima.”
- issue: Maana ya τῆς ζωῆς
  choice: wa uzima
  alternative: unaotoa uzima
  rationale: Muundo wa Kigiriki unaacha uhusiano huo ukiwa mfupi na wenye kina. Kutafsiri “unaotoa uzima” kungechagua maana moja inayowezekana na hivyo kupunguza utata halisi wa msemo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha fupi, ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Hakuna tanbihi zinazohitajika kwa mstari huu.
