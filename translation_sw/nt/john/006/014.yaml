reference: John 6:14
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οἱ οὖν ἄνθρωποι ἰδόντες ⸂ὃ ἐποίησεν σημεῖον⸃ ⸀ἔλεγον ὅτι Οὗτός ἐστιν ἀληθῶς ὁ προφήτης ὁ ἐρχόμενος εἰς τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/014.yaml
  text: So when the people saw the sign that he had done[a], they were saying[b], “This truly is the Prophet who is coming into the world.”
translation:
  language: sw
  text: Basi, watu walipoiona ishara aliyofanya[a], walikuwa wakisema, “Hakika huyu ndiye yule Nabii anayekuja ulimwenguni.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “muujiza aliyofanya.” Yohana hutumia mara kwa mara neno “ishara” (σημεῖον) kusisitiza maana ya ufunuo katika matendo ya Yesu, wala si hali yake ya kimiujiza tu.
    reason: lexical_alternative
  - marker: b
    text: Huenda “yule Nabii” linamrejelea nabii kama Musa ambaye alitarajiwa kuja (Kumbukumbu la Torati 18:15–18).
    reason: cross_reference
lexical_decisions:
- source_word: οἱ οὖν ἄνθρωποι
  choice: Basi, watu
  rationale: Neno ἄνθρωποι hapa linarejelea watu kwa ujumla, si wanaume pekee; “Basi” linaonyesha mwendelezo na hitimisho la simulizi linalodokezwa na οὖν.
- source_word: ἰδόντες
  choice: walipoiona
  rationale: Muundo huu wa wakati unawasilisha kitendo cha kuona kilichotangulia kauli yao kwa Kiswahili cha kawaida na chenye mtiririko mzuri.
- source_word: ὃ ἐποίησεν σημεῖον
  choice: ishara aliyofanya
  rationale: “Ishara” huhifadhi maana ya σημεῖον katika Yohana kama tendo linalofunua utambulisho na kazi ya Yesu, badala ya kusisitiza tu hali yake ya kimiujiza.
- source_word: ἔλεγον
  choice: walikuwa wakisema
  rationale: Muundo huu huhifadhi hali endelevu au ya kurudiwa-rudiwa ya kitenzi cha wakati usiotimilika.
- source_word: ἀληθῶς
  choice: Hakika
  rationale: “Hakika” huonyesha uthibitisho wenye msisitizo kwa lugha ya asili na yenye hadhi.
- source_word: ὁ προφήτης
  choice: yule Nabii
  rationale: “Yule” pamoja na herufi kubwa katika “Nabii” huonyesha kuwa ni mtu maalumu aliyetazamiwa, bila kumtambulisha zaidi ya matini ya Kigiriki.
- source_word: ὁ ἐρχόμενος εἰς τὸν κόσμον
  choice: anayekuja ulimwenguni
  rationale: Tafsiri hii huhifadhi hali ya sasa ya kishirikishi na usemi wa Kiyohana bila kuamua kwa ziada wakati au namna ya kuja kwake.
theological_decisions:
- issue: Utambulisho wa “yule Nabii”
  choice: yule Nabii
  alternative: nabii kama Musa
  rationale: Kauli hiyo huenda inadokeza nabii aliyetazamiwa katika Kumbukumbu la Torati 18:15–18, lakini matini yenyewe haisemi wazi “kama Musa.” Tafsiri inahifadhi cheo hicho na kutatua dokezo hilo katika tanbihi badala ya kuliongeza katika matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. “Walikuwa wakisema” limechaguliwa kuhifadhi hali endelevu ya ἔλεγον; “yule Nabii” linaashiria mtu maalumu bila kuingiza utambulisho usiotajwa wazi katika matini.
