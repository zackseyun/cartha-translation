  text: ἔλαβεν ⸀οὖν τοὺς ἄρτους ὁ Ἰησοῦς καὶ εὐχαριστήσας ⸀διέδωκεν τοῖς ἀνακειμένοις, ὁμοίως καὶ ἐκ τῶν ὀψαρίων ὅσον ἤθελον.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/011.yaml
  text: So Jesus took the loaves[a], and after giving thanks he distributed them to those who were reclining; likewise also from the fish[b], as much as they wanted.
translation:
  language: sw
  text: Basi Yesu akaichukua mikate, na baada ya kushukuru akawagawia wale waliokuwa wameketi kula[a]; vivyo hivyo akawagawia samaki[b] kadiri walivyotaka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “waliokuwa wamejiegemeza.” Kigiriki husema kwa karibu zaidi “waliokuwa wamejiegemeza,” mkao wa kawaida wa kula chakula wakati huo.
    reason: lexical_alternative
  - marker: b
    text: Au “samaki wadogo.” Neno la Kigiriki linaweza kumaanisha samaki walioliwa pamoja na mkate, na huenda walikuwa samaki wadogo.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Basi
  rationale: Kiunganishi hiki kinaendeleza simulizi na kuonyesha matokeo ya yaliyotangulia; “Basi” ni cha kawaida na cha heshima katika Kiswahili.
- source_word: τοὺς ἄρτους
  choice: mikate
  rationale: Wingi wa ἄρτος katika tukio hili unarejelea mikate iliyokuwapo, si dhana ya mkate kwa ujumla.
- source_word: εὐχαριστήσας
  choice: baada ya kushukuru
  rationale: Huwakilisha tendo lililotangulia tendo kuu bila kuongeza mtendewa “Mungu,” ambaye hajatajwa wazi katika Kigiriki.
- source_word: διέδωκεν
  choice: akawagawia
  rationale: Kitenzi kina maana ya kugawa miongoni mwa watu; umbo lenye kiambishi cha watendewa ni la asili katika Kiswahili.
- source_word: τοῖς ἀνακειμένοις
  choice: wale waliokuwa wameketi kula
  rationale: ἀνάκειμαι humaanisha kuwa katika mkao wa kula, kihalisi mara nyingi kujiegemeza au kulala mezani. “Wameketi kula” ni Kiswahili cha asili huku tanbihi ikihifadhi picha halisi ya desturi hiyo.
- source_word: ὁμοίως καὶ
  choice: akafanya vivyo hivyo na
  rationale: Huhifadhi ulinganifu kati ya kugawa mikate na kugawa samaki kwa mtiririko wa kawaida wa Kiswahili.
- source_word: ἐκ τῶν ὀψαρίων
  choice: samaki
  rationale: ὀψάριον inaweza kumaanisha samaki wa kuliwa pamoja na mkate na huenda samaki wadogo; “samaki” huepuka kubainisha ukubwa usio na uhakika.
- source_word: ὅσον ἤθελον
  choice: kila mmoja akapata kadiri alivyotaka
  rationale: Hutoa wazi maana ya kiasi kisichozuiliwa kulingana na matakwa ya waliokula; umoja wa jumla ni wa asili katika Kiswahili.
theological_decisions:
- issue: Mwangwi unaowezekana wa Ekaristi katika εὐχαριστήσας
  choice: “baada ya kushukuru” bila ufafanuzi wa kisakramenti
  alternative: “baada ya kubariki” au kueleza wazi maana ya Ekaristi
  rationale: Kitenzi chenyewe kinasema kutoa shukrani. Tafsiri haipaswi kuingiza hitimisho la kisakramenti wala kubadilisha neno ili kulilinganisha na masimulizi mengine.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa simulizi wenye “aka-” unaendeleza mfululizo wa matendo kwa ufasaha. Tanbihi zote zimewekewa alama katika matini kuu.
