base_translation:
  language: en
  yaml_path: translation/nt/john/006/070.yaml
  text: Jesus answered them[a], “Did I not choose you, the Twelve? Yet one of you is a devil.”
translation:
  language: sw
  text: Yesu akawajibu, “Je, si mimi niliyewachagua ninyi Kumi na Wawili? Hata hivyo, mmoja wenu ni ibilisi[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mchongezi.” Neno la Kigiriki linaweza kumaanisha mshtaki wa uongo, na katika miktadha mingi humaanisha Ibilisi. Hapa linamtaja mtu huyo kwa sifa yake badala ya kumtambulisha moja kwa moja kuwa Shetani mwenyewe.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: akawajibu
  rationale: Ni kitenzi cha kawaida cha masimulizi kinachoonyesha jibu la Yesu kwa waliokuwa wakizungumza naye.
- source_word: Οὐκ ἐγὼ ὑμᾶς ... ἐξελεξάμην;
  choice: Je, si mimi niliyewachagua ninyi
  rationale: Muundo wa swali unatarajia jibu la ndiyo na unahifadhi msisitizo wa ἐγώ, yaani kwamba Yesu mwenyewe ndiye aliyewachagua.
- source_word: ὑμᾶς τοὺς δώδεκα
  choice: ninyi, wale Kumi na Wawili
  rationale: Kauli hii inarejelea kundi linalotambulika la wanafunzi kumi na wawili; “wale Kumi na Wawili” ni ya asili na yenye hadhi katika Kiswahili.
- source_word: καὶ
  choice: Hata hivyo
  rationale: Ingawa maana ya msingi ni “na,” hapa kiunganishi kinaonyesha utofauti kati ya kuchaguliwa kwao na hali ya mmoja wao.
- source_word: ἐξ ὑμῶν εἷς
  choice: mmoja wenu
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaowasilisha maana ya mmoja kutoka miongoni mwao.
- source_word: διάβολός
  choice: ibilisi
  rationale: Neno hili linahifadhi ukali wa kauli ya Kigiriki. Herufi ndogo na tanbihi husaidia kuonyesha kwamba hapa ni sifa ya mmoja wao, si lazima utambulisho wa moja kwa moja na Ibilisi mwenyewe.
theological_decisions:
- issue: Ikiwa διάβολός humtambulisha mtu huyo moja kwa moja kuwa Shetani au humweleza kwa sifa
  choice: ni ibilisi
  alternative: ni mchongezi; ni Ibilisi
  rationale: Nomino ya Kigiriki haina kibainishi na katika nafasi hii ina nguvu ya kisifa. Tafsiri “ni ibilisi” inadumisha ukali na mvutano wa kauli bila kusema wazi kwamba mtu huyo ni Shetani mwenyewe; tanbihi inahifadhi pia maana ya “mchongezi.”
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Wale Kumi na Wawili” limetumiwa kama jina la kundi linalotambulika. “Ibilisi” limeandikwa kwa herufi ndogo kwa matumizi ya kisifa, huku tanbihi ikihifadhi maana nyingine inayowezekana.
