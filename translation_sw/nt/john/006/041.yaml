  text: Ἐγόγγυζον οὖν οἱ Ἰουδαῖοι περὶ αὐτοῦ ὅτι εἶπεν· Ἐγώ εἰμι ὁ ἄρτος ὁ καταβὰς ἐκ τοῦ οὐρανοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/john/006/041.yaml
  text: So the Jews were grumbling about him because he said[a], “I am the bread that came down from heaven.”
translation:
  language: sw
  text: Basi Wayahudi[a] walikuwa wakinung’unika kumhusu kwa sababu alisema, “Mimi ndiye mkate ulioshuka kutoka mbinguni.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watu wa Yudea,” au, katika baadhi ya miktadha, “viongozi wa Kiyahudi.” Usemi wa Yohana “Wayahudi” unaweza kumaanisha kundi fulani lililompinga Yesu, wala si Wayahudi wote kwa ujumla.
    reason: Usomaji mbadala na ufafanuzi wa upeo wa rejeleo, ili kuepuka kuuelewa usemi huo kama lawama dhidi ya Wayahudi wote.
lexical_decisions:
- source_word: Ἐγόγγυζον
  choice: walikuwa wakinung’unika
  rationale: Kauli ya wakati usiotimilika inaonyesha tendo lililokuwa likiendelea au kurudiwa. Muundo huu unahifadhi hali hiyo pamoja na maana ya kulalamika kwa sauti ya chini.
- source_word: οὖν
  choice: Basi
  rationale: Neno hili linaunganisha kauli hiyo na yaliyotangulia kwa mtiririko wa kisimulizi na kimantiki, bila kufanya hitimisho hilo lionekane rasmi kupita kiasi.
- source_word: οἱ Ἰουδαῖοι
  choice: Wayahudi
  rationale: Hili ndilo neno la moja kwa moja na la kawaida kwa usemi wa Kigiriki. Muktadha unaweza kulenga kundi fulani la Wayahudi waliompinga Yesu, si Wayahudi wote kwa ujumla; jambo hilo limefafanuliwa katika tanbihi bila kuibana maana katika matini kuu.
- source_word: περὶ αὐτοῦ
  choice: juu yake
  rationale: περί pamoja na hali milikishi humaanisha ‘kuhusu’ au ‘juu ya.’ Usemi huu ni wa kawaida katika Kiswahili na hauongezi moja kwa moja maana ya ‘dhidi yake.’
- source_word: ὅτι
  choice: kwa sababu
  rationale: Hapa ὅτι inatambulisha sababu ya kunung’unika kwao, hivyo ‘kwa sababu’ inaonyesha wazi uhusiano huo.
- source_word: εἶπεν
  choice: alisema
  rationale: Wakati uliopita sahili unafaa kwa aoristi ya Kigiriki na unaendeleza simulizi kwa Kiswahili cha kawaida.
- source_word: Ἐγώ εἰμι
  choice: Mimi ndiye
  rationale: Muundo huu unahifadhi msisitizo wa kiwakilishi Ἐγώ na utambulisho mahsusi wa Yesu kuwa mkate unaotajwa.
- source_word: ὁ ἄρτος
  choice: mkate
  rationale: Pamoja na ‘ndiye,’ tafsiri hii inaonyesha kuwa Yesu anajitambulisha kuwa mkate huo mahsusi, si mkate kwa maana ya jumla tu.
- source_word: ὁ καταβὰς
  choice: ulioshuka
  rationale: Kishiriki chenye kibainishi kinachoueleza mkate kimetafsiriwa kwa kishazi rejeshi cha kawaida, huku tendo la kushuka likionyeshwa kuwa limetimia.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: kutoka mbinguni
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaohifadhi maana ya chanzo au asili iliyo katika ἐκ pamoja na hali milikishi.
theological_decisions:
- issue: Rejeleo na tafsiri ya οἱ Ἰουδαῖοι katika Injili ya Yohana
  choice: Wayahudi katika matini kuu
  alternative: Wayudea; viongozi wa Kiyahudi
  rationale: Matini kuu inafuata usemi wa Kigiriki bila kulibana rejeleo kuwa viongozi pekee au kulipa maana ya kijiografia isiyodaiwa wazi na mstari huu. Tanbihi inaeleza kwamba katika Yohana usemi huo unaweza kutaja kundi maalumu linalompinga Yesu, wala si Wayahudi wote bila ubaguzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Walinung’unika’ linaendelezwa kwa ‘walikuwa wakinung’unika’ ili kuonyesha tendo endelevu la imperfecti; ‘Mimi ndiye’ huhifadhi msisitizo bila kuwa nzito au ya kizamani.
