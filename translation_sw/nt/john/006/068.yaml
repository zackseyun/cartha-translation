lexical_decisions:
- source_word: ἀπεκρίθη αὐτῷ
  choice: akamjibu
  rationale: Kitenzi pamoja na kiwakilishi chake kimetafsiriwa kwa muundo wa kawaida wa Kiswahili unaoonyesha kwamba Petro alimjibu Yesu.
- source_word: Σίμων Πέτρος
  choice: Simoni Petro
  rationale: Majina yametolewa kwa maumbo yaliyozoeleka katika Biblia za Kiswahili.
- source_word: Κύριε
  choice: Bwana
  rationale: Huhifadhi maana ya heshima na pia uzito wa kiteolojia wa κύριος katika Injili ya Yohana.
- source_word: πρὸς τίνα ἀπελευσόμεθα
  choice: tutakwenda kwa nani?
  rationale: Ni swali la kawaida na la moja kwa moja katika Kiswahili, huku likihifadhi mhusika anayelengwa na kwenda huko.
- source_word: ῥήματα
  choice: maneno
  rationale: Huhifadhi wingi na maana ya maneno yaliyosemwa bila kutumia lugha nzito isiyo ya lazima.
- source_word: ζωῆς αἰωνίου
  choice: ya uzima wa milele
  rationale: Ni usemi wa kawaida wa Kiyohana katika Kiswahili na huhifadhi muundo wa uhusiano wa Kigiriki.
- source_word: ἔχεις
  choice: una
  rationale: Ni usemi wa moja kwa moja na wa asili wa kuonyesha kuwa maneno hayo yako kwa Yesu.
theological_decisions:
- issue: Nguvu ya Κύριε kama namna ya kumwita Yesu
  choice: Bwana
  alternative: Mwalimu Mkuu
  rationale: “Bwana” huhifadhi kwa pamoja heshima ya namna ya kumwita Yesu na mwangwi wa kikristo wa cheo hicho, bila kulazimisha maana iliyo nje ya mstari.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “akamjibu” ni wa kisimulizi na wa kawaida; “tutakwenda kwa nani?” ni wa asili na huhifadhi nguvu ya swali la Petro.
