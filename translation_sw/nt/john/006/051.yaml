  text: ἐγώ εἰμι ὁ ἄρτος ὁ ζῶν ὁ ἐκ τοῦ οὐρανοῦ καταβάς· ἐάν τις φάγῃ ἐκ τούτου τοῦ ἄρτου ⸀ζήσει εἰς τὸν αἰῶνα, καὶ ὁ ἄρτος δὲ ὃν ἐγὼ δώσω ἡ σάρξ μού ⸀ἐστιν ὑπὲρ τῆς τοῦ κόσμου ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/051.yaml
  text: I am the living bread that came down from heaven[a]. If anyone eats of this bread, he will live forever[c][b]. And the bread that I will give for the life of the world is my flesh.
translation:
  language: sw
  text: Mimi ndiye mkate ulio hai, ulioshuka kutoka mbinguni. Mtu yeyote akila mkate huu, ataishi milele. Na mkate nitakaoutoa kwa ajili ya uzima wa ulimwengu ni nyama yangu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kiyunani: “nyama yangu” (σάρξ), si “mwili” (σῶμα). Neno hilo ni halisi na lenye ukali wa makusudi katika muktadha huu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἄρτος ὁ ζῶν
  choice: mkate ulio hai
  rationale: Hutafsiri kishiriki ζῶν kama sifa ya mkate na kuepuka kuingiza usemi tofauti wa karibu, ‘mkate wa uzima.’
- source_word: ὁ ἐκ τοῦ οὐρανοῦ καταβάς
  choice: ulioshuka kutoka mbinguni
  rationale: Huwasilisha tendo lililokamilika la kushuka kwa kishazi rejeshi cha kawaida katika Kiswahili.
- source_word: ἐάν τις φάγῃ ἐκ τούτου τοῦ ἄρτου
  choice: Mtu yeyote akila sehemu ya mkate huu
  rationale: Muundo wa ‘akila’ unaonyesha sharti la jumla; ‘sehemu ya’ huwasilisha ἐκ kwa Kiswahili cha kawaida bila kudai kwamba mkate wote unaliwa.
- source_word: ζήσει εἰς τὸν αἰῶνα
  choice: ataishi milele
  rationale: ‘Milele’ ndiyo njia ya kawaida na wazi ya kueleza nahau ya Kiyunani yenye maana ya kudumu bila mwisho.
- source_word: ὁ ἄρτος δὲ ὃν ἐγὼ δώσω
  choice: Na mkate nitakaoutoa
  rationale: ‘Na’ huendeleza hoja bila kuunda utofautishaji mkali; wakati ujao huhifadhi kujitoa kunakokuja.
- source_word: ἡ σάρξ μού ἐστιν
  choice: ni mwili wangu
  rationale: Katika Kiswahili cha kawaida, ‘mwili’ ndiyo tafsiri ya kimuktadha ya σάρξ inayobaki halisi na thabiti; ‘nyama yangu’ ingesikika kana kwamba inarejelea nyama kama chakula na ingeweza kupotosha.
- source_word: ὑπὲρ τῆς τοῦ κόσμου ζωῆς
  choice: kwa ajili ya uzima wa ulimwengu
  rationale: Huhifadhi maana ya manufaa au kusudi ya ὑπέρ na upana wa κόσμος kwa lugha ya kawaida.
- source_word: κόσμος
  choice: ulimwengu
  rationale: Huhifadhi istilahi ya Yohana bila kuipunguza kimafafanuzi kuwa ‘wanadamu’ pekee.
theological_decisions:
- issue: Maana ya σάρξ katika kujieleza kwa Yesu
  choice: ‘mwili’ katika andiko kuu, na ‘nyama’ katika tanbihi kama ulinganifu wa karibu zaidi wa neno
  alternative: nyama yangu
  rationale: σάρξ ni neno halisi na lenye makusudi ya kushtua katika muktadha. Hata hivyo, ‘nyama yangu’ katika Kiswahili cha sasa inaweza kueleweka hasa kama nyama ya kuliwa; ‘mwili wangu’ huhifadhi rejeo halisi kwa ubinadamu wa Yesu, huku tanbihi ikionyesha ukali wa neno la Kiyunani bila kuuficha.
- issue: Upeo wa ‘ulimwengu’
  choice: kuhifadhi ‘ulimwengu’ bila kuubana
  alternative: wanadamu; wateule
  rationale: Andiko lina usemi mpana ‘uzima wa ulimwengu’; tafsiri haipaswi kuamua mfumo mwembamba wa kitheolojia.
- issue: Nguvu ya Kikristo ya ‘ulioshuka kutoka mbinguni’
  choice: kutafsiri moja kwa moja kama kushuka kutoka mbinguni
  alternative: kutumwa tu na Mungu kwa maana ya mfano
  rationale: Usemi wa Kiyunani unadai asili na kushuka kwa Yesu kutoka mbinguni; tafsiri inaacha dai hilo lisikike bila kulirahisisha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Ndiye’ huweka mkazo wa ἐγώ εἰμι. Muundo wa sentensi umewekwa wazi kwa usomaji wa kawaida, huku tanbihi zikihifadhi ukaribu wa misemo yenye utata wa kileksika.
