  text: ἔστιν γεγραμμένον ἐν τοῖς προφήταις· Καὶ ἔσονται πάντες διδακτοὶ θεοῦ· ⸀πᾶς ὁ ⸀ἀκούσας παρὰ τοῦ πατρὸς καὶ μαθὼν ἔρχεται πρὸς ⸀ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/045.yaml
  text: It is written in the Prophets[a], ‘And they will all be taught by God.’ Everyone who has heard from the Father and has learned comes to me.
translation:
  language: sw
  text: 'Imeandikwa katika Manabii: “Nao wote watafundishwa na Mungu.” Kila mtu ambaye amesikia kutoka kwa Baba na amejifunza huja kwangu.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔστιν γεγραμμένον
  choice: Imeandikwa
  rationale: Ni usemi wa kawaida na wenye heshima wa Kiswahili unaowasilisha hali ya maandiko yaliyoandikwa na yenye mamlaka ya kudumu.
- source_word: ἐν τοῖς προφήταις
  choice: katika Manabii
  rationale: Herufi kubwa inaonyesha kwa uwezekano mkubwa sehemu inayotambuliwa ya Maandiko ya kinabii, si manabii kama watu tu.
- source_word: ἔσονται πάντες διδακτοὶ θεοῦ
  choice: Nao wote watafundishwa na Mungu
  rationale: Huhifadhi wakati ujao na wazo la Mungu kuwa mtendaji au chanzo cha kufundishwa; “Nao” pia huakisi Καὶ ya nukuu kwa Kiswahili cha kawaida.
- source_word: πᾶς ὁ
  choice: Kila mtu ambaye
  rationale: Huwasilisha umoja wenye maana ya jumla kwa lugha iliyo wazi na ya sasa.
- source_word: ἀκούσας παρὰ τοῦ πατρὸς
  choice: amesikia kutoka kwa Baba
  rationale: Wakati timilifu wa Kiswahili huonyesha tendo lililotangulia kuja, na “kutoka kwa Baba” huhifadhi παρά pamoja na umilikishi kama chanzo.
- source_word: καὶ μαθὼν
  choice: na kujifunza
  rationale: Muundo huu wa kawaida unaunganisha kusikia na kujifunza bila kuongeza kitu kinachofundishwa ambacho hakikutajwa wazi.
- source_word: ἔρχεται πρὸς ἐμέ
  choice: huja kwangu
  rationale: “Huja” huhifadhi hali ya sasa yenye maana ya kawaida au ya tabia, na “kwangu” huonyesha kuelekea kwa Yesu kwa Kiswahili asilia.
theological_decisions:
- issue: Uhusiano kati ya kufundishwa na Mungu na kuja kwa Yesu
  choice: 'Mfuatano wa andiko umehifadhiwa: anayesikia kutoka kwa Baba na kujifunza huja kwa Yesu.'
  alternative: Tafsiri yenye kauli dhahiri zaidi ya uamuzi wa Mungu pekee, au tafsiri inayosisitiza zaidi uchaguzi wa mwanadamu.
  rationale: Kigiriki kinaeleza uhusiano huo lakini hakifafanui utaratibu wake wa kimetafizikia; tafsiri haipaswi kutatua mvutano huo wa kiteolojia.
- issue: Utambulisho wa Baba na mamlaka ya Yesu
  choice: Majina “Baba” na “kwangu” yamehifadhiwa katika uhusiano wa moja kwa moja.
  alternative: Kupanua maana kwa ufafanuzi wa Kikristo usiotamkwa moja kwa moja katika mstari.
  rationale: Hii huhifadhi nguvu ya Kikristo ya kauli kwamba kujifunza kweli kutoka kwa Baba huongoza kwa Yesu, bila kuongeza zaidi ya andiko.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Hakuna tanbihi iliyoongezwa kwa sababu Kiswahili “watafundishwa na Mungu” huwasilisha maana ya διδακτοὶ θεοῦ kwa kawaida; mbadala wa Kiingereza “God-taught” hauna ulazima wa kuchapishwa kama tofauti tofauti ya maana katika Kiswahili.
