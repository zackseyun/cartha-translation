  text: Kweli, kweli, ninawaambia, anayeamini[a] ana uzima wa milele.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “yeyote anayeamini.” Kigiriki kina umbo la kitenzi cha wakati uliopo lenye kibainishi, kihalisi “yule anayeamini.”
