lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: Kweli, kweli
  rationale: Marudio hayo yanaendeleza msisitizo wa tamko la dhati katika Yohana kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: λέγω ὑμῖν
  choice: ninawaambia
  rationale: Huwasilisha kitenzi cha wakati uliopo pamoja na kiwakilishi cha wingi kwa namna ya asili katika Kiswahili.
- source_word: ὁ πιστεύων
  choice: anayeamini
  rationale: Huwakilisha kirai cha Kigiriki chenye kibainishi na kitenzi-shirikishi cha wakati uliopo, kikimtaja mtu mwenye sifa ya kuamini bila kuongeza kiambajengo kisichokuwamo katika mstari huu.
- source_word: ἔχει
  choice: anao
  rationale: Huhifadhi dai la wakati uliopo kwamba uzima huo ni milki ya sasa, badala ya kuugeuza kuwa ahadi ya wakati ujao.
- source_word: ζωὴν αἰώνιον
  choice: uzima wa milele
  rationale: Ni usemi wa kawaida na wa asili katika Kiswahili unaowasilisha uzima usio na mwisho huku ukibaki wazi kwa kina cha maana ya Kiyohana.
theological_decisions:
- issue: Kuwa na uzima wa milele sasa
  choice: anao uzima wa milele
  alternative: atakuwa na uzima wa milele
  rationale: Kigiriki kimetumia ἔχει katika wakati uliopo; tafsiri inahifadhi mvutano wa Kiyohana wa uzima wa milele kuwa wa sasa bila kuufanya wa wakati ujao pekee.
- issue: Mhusika wa kuamini
  choice: anayeamini
  alternative: yeyote anayeamini
  rationale: Kirai cha Kigiriki ni ὁ πιστεύων, kihalisi ‘yule anayeamini.’ ‘Anayeamini’ ni cha asili na kinaendeleza upeo wa jumla bila kulazimisha neno la ziada ‘yeyote.’
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa sasa, wenye hadhi na rahisi kueleweka. Marudio ya ‘Kweli, kweli’ yamehifadhiwa kwa ajili ya mdundo na msisitizo wa Yohana.
