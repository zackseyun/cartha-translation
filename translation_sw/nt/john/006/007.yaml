  rationale: Huwasilisha maana kwamba kiasi hicho cha mikate hakingewatosha watu waliokuwa mbele yao; umoja wa kitenzi cha Kiswahili huafikiana na dhana ya jumla ya mikate kama chakula.
- source_word: ἵνα ἕκαστος βραχύ τι λάβῃ
  choice: hata kila mmoja apate kidogo
  rationale: 'Huhifadhi wazo la matokeo au kiwango kinachokusudiwa: hata mgao mdogo kwa kila mtu haungepatikana kwa kutosha.'
