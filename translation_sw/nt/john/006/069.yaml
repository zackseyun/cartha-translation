  yaml_path: translation/nt/john/006/069.yaml
  text: And we have believed and have come to know that you are the Holy One of God[a][b].
translation:
  language: sw
  text: Nasi tumeamini na tumepata kujua kwamba wewe ndiwe Mtakatifu wa Mungu[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati zina, “Masihi, Mwana wa Mungu aliye hai.”
    reason: textual_variant
  - marker: b
    text: Au “Mtakatifu kutoka kwa Mungu.” Hali ya umilikishi katika Kigiriki inaweza kuonyesha uhusiano au asili.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς
  choice: nasi
  rationale: Kiwakilishi cha wazi kina msisitizo; “nasi” kinauhifadhi kwa Kiswahili cha kawaida na pia kuunganisha jibu hili na muktadha.
- source_word: πεπιστεύκαμεν
  choice: tumeamini
  rationale: Kauli ya wakati timilifu inaonyesha tendo la kuamini lililotokea na hali yake inayoendelea; “tumeamini” huhifadhi vipengele hivyo kwa lugha ya kawaida.
- source_word: ἐγνώκαμεν
  choice: tumepata kujua
  rationale: Huonyesha kwamba walifikia maarifa ambayo sasa wanayo. “Tumepata kujua” ni ya asili zaidi hapa kuliko “tumejua” na haiondoi nguvu ya hali iliyopatikana.
- source_word: ὅτι
  choice: kwamba
  rationale: Inaingiza maudhui ya kile walichoamini na kujua, si sababu.
- source_word: ὁ ἅγιος
  choice: Mtakatifu
  rationale: Ni cheo mahsusi cha Kristo kinachoonyesha aliyewekwa kando na mwenye utakatifu; herufi kubwa husaidia kuonyesha matumizi yake kama cheo.
- source_word: τοῦ θεοῦ
  choice: wa Mungu
  rationale: Huhifadhi uhusiano mpana wa hali ya umilikishi katika Kigiriki bila kuufanya kwa lazima kuwa asili pekee (“kutoka kwa Mungu”).
theological_decisions:
- issue: Cheo cha Kristo katika Yohana 6:69
  choice: Mtakatifu wa Mungu
  alternative: Mtakatifu kutoka kwa Mungu; Masihi, Mwana wa Mungu aliye hai
  rationale: SBLGNT inasoma ὁ ἅγιος τοῦ θεοῦ. Tafsiri hii inalifuata andiko hilo moja kwa moja bila kulipatanisha kimyakimya na Mathayo 16:16 au mapanuzi ya hati za baadaye. “Wa Mungu” pia hudumisha upana wa uhusiano unaoweza kuonyeshwa na genitivi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “wewe ndiwe” huhifadhi msisitizo wa σὺ εἶ kwa namna ya kawaida. “Nasi” na vitenzi vya wakati timilifu hudumisha msisitizo na hali inayoendelea bila kufanya sentensi iwe nzito.
