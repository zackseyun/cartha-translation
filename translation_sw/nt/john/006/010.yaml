  text: ⸀εἶπεν ὁ Ἰησοῦς· Ποιήσατε τοὺς ἀνθρώπους ἀναπεσεῖν. ἦν δὲ χόρτος πολὺς ἐν τῷ τόπῳ. ἀνέπεσαν οὖν οἱ ἄνδρες τὸν ἀριθμὸν ⸀ὡς πεντακισχίλιοι.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/010.yaml
  text: Jesus said, “Have the people sit down.” Now there was plenty of grass in the place. So the men sat down, about five thousand in number.
translation:
  language: sw
  text: Yesu akasema, “Waketisheni watu.[a]” Mahali pale palikuwa na nyasi nyingi. Basi wanaume wakaketi, wapatao elfu tano.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki kwanza kinasema “watu” (ἀνθρώπους), lakini baadaye kinasema “wanaume” (ἄνδρες); jambo hilo linaonyesha kwamba hesabu ya wapatao elfu tano inawahusu hasa wanaume.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ποιήσατε τοὺς ἀνθρώπους ἀναπεσεῖν
  choice: Waketisheni watu
  rationale: Muundo wa ποιέω pamoja na kitenzi-jina unaonyesha kusababisha au kuagiza kitendo. Kiswahili ‘waketisheni’ ni cha asili na huhifadhi nguvu ya amri.
- source_word: τοὺς ἀνθρώπους
  choice: watu
  rationale: ἄνθρωποι hapa ni neno pana linalohusu umati kwa ujumla, tofauti na ἄνδρες inayotajwa baadaye.
- source_word: ἀναπεσεῖν / ἀνέπεσαν
  choice: waketisheni / wakaketi
  rationale: Kitenzi kinaweza kumaanisha kuketi au kujiegemeza wakati wa kula. Katika simulizi hili la nje, ‘kuketi’ ni Kiswahili cha kawaida na kinachoeleweka vizuri.
- source_word: χόρτος πολὺς
  choice: majani mengi
  rationale: χόρτος hapa humaanisha nyasi au majani ya ardhini; ‘majani mengi’ ni usemi wa kawaida wa Kiswahili unaoonyesha wingi huo.
- source_word: ἐν τῷ τόπῳ
  choice: mahali pale
  rationale: Hutoa maana ya mahali palipotajwa kwa mtindo wa asili wa Kiswahili.
- source_word: οἱ ἄνδρες
  choice: wanaume
  rationale: ἀνήρ ni neno mahsusi kwa wanaume, hivyo linatofautishwa na ‘watu’ iliyotumiwa mwanzoni.
- source_word: τὸν ἀριθμὸν ὡς πεντακισχίλιοι
  choice: nao walikuwa karibu elfu tano
  rationale: ‘Karibu’ huhifadhi ukadiriaji unaoonyeshwa na ὡς, huku sentensi ikiwa ya kawaida katika Kiswahili.
theological_decisions:
- issue: Hesabu inayowahusu wanaume katika simulizi la kulishwa kwa umati
  choice: Kutofautisha ‘watu’ (ἀνθρώπους) na ‘wanaume’ (ἄνδρες).
  alternative: Kutafsiri maneno yote mawili kuwa ‘watu’.
  rationale: Chanzo cha Kigiriki kinabadilika kutoka neno pana la umati hadi neno mahsusi kwa wanaume katika hesabu. Tofauti hiyo imehifadhiwa bila kudai kwamba wanawake au watoto hawakuwapo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na rahisi kueleweka. ‘Kuketi’ limetumiwa badala ya ‘kujiegemeza’ kwa kuwa ndilo neno la kawaida katika muktadha huu; tofauti kati ya watu wote na wanaume waliohesabiwa imehifadhiwa.
