id: JHN.6.66
reference: John 6:66
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἐκ τούτου πολλοὶ ⸀ἐκ ⸂τῶν μαθητῶν αὐτοῦ ἀπῆλθον⸃ εἰς τὰ ὀπίσω καὶ οὐκέτι μετ’ αὐτοῦ περιεπάτουν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/066.yaml
  text: From this time many of his disciples went back and no longer walked with him[a].
translation:
  language: sw
  text: Tangu wakati huo, wengi miongoni mwa wanafunzi wake walirudi nyuma, na hawakutembea tena pamoja naye.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa sababu ya hayo, wengi miongoni mwa wanafunzi wake waliondoka.” Maneno ya mwanzo ya Kigiriki yanaweza kueleweka kuwa yanaonyesha sababu, ingawa katika muktadha “Tangu wakati huo” yanaonyesha vizuri zaidi hatua hii ya mabadiliko.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐκ τούτου
  choice: Tangu wakati huo
  rationale: Katika muktadha huu, kirai hiki kinaonyesha mwanzo wa badiliko lililotokea baada ya maneno ya Yesu. Kiswahili hiki kinawasilisha maana ya wakati bila kuondoa uwezekano wa maana ya kisababishi.
- source_word: πολλοὶ ἐκ τῶν μαθητῶν αὐτοῦ
  choice: wengi miongoni mwa wanafunzi wake
  rationale: 'Neno “miongoni mwa” linahifadhi wazi maana ya kigawanyo ya ἐκ: walioondoka walikuwa sehemu ya kundi kubwa la wanafunzi wake.'
- source_word: ἀπῆλθον εἰς τὰ ὀπίσω
  choice: walirudi nyuma
  rationale: Muungano huu unaonyesha kujiondoa au kuacha mwendo waliokuwa wameufuata, si kuondoka mahali tu. “Walirudi nyuma” ni ya kawaida na inadumisha taswira ya Kigiriki.
- source_word: οὐκέτι
  choice: hawaku... tena
  rationale: Muundo huu wa Kiswahili unaonyesha kuwa kitendo kilikoma kuanzia wakati huo.
- source_word: μετ’ αὐτοῦ περιεπάτουν
  choice: hawakutembea tena pamoja naye
  rationale: Tafsiri hii inadumisha sitiari ya kutembea pamoja na Yesu na pia maana ya ushirika na ufuasi unaoendelea, bila kuifafanua kupita kiasi kuwa “kumfuata” tu.
theological_decisions:
- issue: Iwapo μαθηταί hapa inapaswa kutafsiriwa kwa namna inayowatambulisha wale Kumi na Wawili au waamini wa kweli pekee
  choice: wanafunzi
  alternative: wafuasi
  rationale: Andiko linawaita wanafunzi wa Yesu lakini haliwatambulishi kuwa wale Kumi na Wawili, wala halitoi hapa uamuzi wa kitheolojia kuhusu ukweli wa imani yao. “Wanafunzi” linahifadhi mvutano huo wa simulizi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Miongoni mwa” linaweka wazi maana ya sehemu ya kundi; “walirudi nyuma” na “kutembea pamoja naye” zinahifadhi taswira za Kigiriki kwa lugha inayoeleweka.
