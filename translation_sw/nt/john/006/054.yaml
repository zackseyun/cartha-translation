id: JHN.6.54
reference: John 6:54
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὁ τρώγων μου τὴν σάρκα καὶ πίνων μου τὸ αἷμα ἔχει ζωὴν αἰώνιον, κἀγὼ ἀναστήσω αὐτὸν τῇ ἐσχάτῃ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/054.yaml
  text: The one who eats my flesh and drinks my blood has eternal life[b][a], and I will raise him up on the last day.
translation:
  language: sw
  text: Anayekula[a] mwili wangu na kunywa damu yangu ana uzima wa milele, nami nitamfufua siku ya mwisho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa msisitizo ulio dhahiri zaidi, “anayetafuna.” Kitenzi cha Kigiriki τρώγω ni halisi zaidi kuliko neno la kawaida tu la kula.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ τρώγων
  choice: Anayekula
  rationale: Kifungu chenye kibainishi na kitenzi-ushiriki kinamtaja mtu anayejulikana kwa tendo hilo. Muundo wa Kiswahili “anayekula” ni wa asili, unabaki katika umoja, na unaweza kuonyesha tendo linaloendelea au la kawaida.
- source_word: μου τὴν σάρκα
  choice: mwili wangu
  rationale: Katika Kiswahili sanifu, “mwili wangu” ni tafsiri ya kawaida na yenye heshima katika muktadha huu; inaacha usemi huo ukiwa halisi bila kuufasiri kuwa wa kisakramenti au kuwa sitiari ya kuamini.
- source_word: καὶ πίνων μου τὸ αἷμα
  choice: na kunywa damu yangu
  rationale: Tafsiri hii inadumisha usambamba na “anayekula” na kuacha “damu” ikiwa halisi, bila kulainisha lugha ya chanzo.
- source_word: ἔχει ζωὴν αἰώνιον
  choice: ana uzima wa milele
  rationale: “Ana” huakisi wakati wa sasa wa Kigiriki, na “uzima wa milele” ni usemi wa kawaida wa Kiyohana unaowasilisha uzima unaomilikiwa sasa na wenye kudumu.
- source_word: κἀγὼ ἀναστήσω αὐτὸν
  choice: nami nitamfufua
  rationale: “Nami” huhifadhi uunganishi na msisitizo wa ἐγώ, huku “nitamfufua” ikieleza wazi maana ya kufufua kutoka kwa wafu na kurejelea mtu yuleyule katika umoja.
- source_word: τῇ ἐσχάτῃ ἡμέρᾳ
  choice: siku ya mwisho
  rationale: Huu ni usemi wa kieskatolojia ulio wazi na wa kawaida katika Kiswahili cha Biblia na cha sasa.
theological_decisions:
- issue: Iwapo lugha ya kula mwili na kunywa damu ifasiriwe moja kwa moja kuwa ya Meza ya Bwana au kuwa sitiari ya kuamini
  choice: Lugha halisi ya kula, mwili, kunywa, na damu imehifadhiwa bila ufafanuzi wa kimadhehebu.
  alternative: Kuifanya tafsiri iseme wazi kuwa ni kushiriki Meza ya Bwana, au kuibadili iwe “kuamini.”
  rationale: Chanzo chenyewe kinatumia lugha halisi na yenye mvutano wa kitheolojia. Tafsiri haipaswi kuamua kimya-kimya kati ya fasiri za kisakramenti na za kisitiari.
- issue: Urejeleaji wa αὐτόν katika umoja
  choice: nimetamfufua kama “nitamfufua,” ikirejelea mtu mmoja aliyetajwa kwa “anayekula.”
  alternative: Kutumia muundo wa wingi au kuirudia nomino “mtu huyo.”
  rationale: Kiambishi “-m-” ni njia ya kawaida ya Kiswahili ya kuhifadhi urejeleaji wa mtu katika umoja bila kuingiza jinsia isiyoonyeshwa kimaumbile na mfumo wa Kiswahili.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imehifadhi muundo wa mtu mmoja na wakati wa sasa, huku “nami” ikiendeleza mtiririko wa hoja. “Mwili wangu” limechaguliwa badala ya “nyama yangu” kwa sababu ni la asili na lenye heshima katika Kiswahili, bila kuondoa uzito wa lugha halisi unaoimarishwa na “damu yangu.”
