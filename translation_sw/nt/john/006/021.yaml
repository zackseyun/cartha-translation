  text: ἤθελον οὖν λαβεῖν αὐτὸν εἰς τὸ πλοῖον, καὶ εὐθέως ⸂ἐγένετο τὸ πλοῖον⸃ ἐπὶ τῆς γῆς εἰς ἣν ὑπῆγον.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/021.yaml
  text: So they were willing to take him into the boat[a], and immediately the boat was at the land to which they were going.
translation:
  language: sw
  text: Basi walikuwa tayari kumpokea ndani ya mashua, na mara moja mashua ikawa kwenye nchi kavu ambayo walikuwa wakielekea.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na mara moja mashua ikafika ufukweni walikokuwa wakielekea.”
    reason: Muktadha unaruhusu ἐπὶ τῆς γῆς kueleweka kama kufika ufukweni, ingawa neno γῆ lina maana pana zaidi ya nchi kavu.
lexical_decisions:
- source_word: ἤθελον
  choice: walikuwa tayari
  rationale: Huwasilisha hali ya utayari au nia katika muktadha huu, badala ya kufanya kauli hiyo ionekane kuwa tamaa ya ghafula tu.
- source_word: οὖν
  choice: Basi
  rationale: Huunganisha tukio hili na yaliyotangulia kwa namna ya kawaida na fasaha katika simulizi la Kiswahili.
- source_word: λαβεῖν αὐτὸν εἰς τὸ πλοῖον
  choice: kumpokea ndani ya mashua
  rationale: ‘Kumpokea’ linaonyesha kumruhusu au kumchukua aingie mashuani; ‘ndani ya mashua’ huhifadhi mwelekeo wa εἰς.
- source_word: πλοῖον
  choice: mashua
  rationale: Ni neno la kawaida na linalofaa kwa chombo kilichotumiwa katika mazingira ya Bahari ya Galilaya.
- source_word: εὐθέως
  choice: mara hiyo hiyo
  rationale: Huhifadhi msisitizo wa ghafula na wa papo hapo uliomo katika εὐθέως.
- source_word: ἐγένετο τὸ πλοῖον ἐπὶ τῆς γῆς
  choice: mashua ikawa imefika kwenye nchi
  rationale: Huhifadhi hali ya matokeo na ghafula ya usemi wa Kigiriki bila kusema kwamba mashua ilikuwa juu ya nchi kavu; ‘imefika’ hufanya sentensi ieleweke kwa Kiswahili cha kawaida.
- source_word: γῆς
  choice: nchi
  rationale: ‘Nchi’ ni kisawe cha karibu cha γῆ na hapa hurejelea eneo la nchi kavu walilolenga; ‘ufukwe’ ni uwezekano wa kimuktadha unaotolewa katika tanbihi.
- source_word: εἰς ἣν ὑπῆγον
  choice: waliyokuwa wakiiendea
  rationale: Huhifadhi wazo la safari iliyokuwa ikiendelea kuelekea mahali maalumu.
theological_decisions:
- issue: Iwapo kishazi cha pili kifafanuliwe kwa namna inayopunguza hali ya ghafula inayoweza kuonekana kuwa ya kimuujiza
  choice: Kuhifadhi ‘mara hiyo hiyo’ na usemi wa moja kwa moja kwamba mashua ikawa imefika kwenye nchi
  alternative: mashua ikafika ufukweni
  rationale: Kigiriki kinasimulia tukio hilo kwa ufupi na kwa msisitizo wa papo hapo. Tafsiri haipaswi kulainisha au kueleza mbali mvutano huo wa simulizi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Basi’ na ‘mara hiyo hiyo’ ni vya kawaida katika simulizi; muundo unahifadhi ufupi na hali ya ghafula ya chanzo.
