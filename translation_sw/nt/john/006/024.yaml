  text: ὅτε οὖν εἶδεν ὁ ὄχλος ὅτι Ἰησοῦς οὐκ ἔστιν ἐκεῖ οὐδὲ οἱ μαθηταὶ αὐτοῦ, ἐνέβησαν αὐτοὶ εἰς τὰ ⸀πλοιάρια καὶ ἦλθον εἰς Καφαρναοὺμ ζητοῦντες τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/024.yaml
  text: So when the crowd saw that Jesus was not there[a], nor his disciples, they themselves got into the boats and came to Capernaum, looking for Jesus.
translation:
  language: sw
  text: Basi umati ulipoona kwamba Yesu hakuwa pale, wala wanafunzi wake, wao wenyewe wakaingia katika mashua zile, wakaenda Kapernaumu wakimtafuta Yesu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτε οὖν
  choice: Basi ... ulipoona
  rationale: “Basi” linaonyesha mwendelezo au hitimisho la simulizi linaloletwa na οὖν, huku “ulipoona” likihifadhi uhusiano wa wakati wa ὅτε kwa Kiswahili cha kawaida.
- source_word: ὁ ὄχλος
  choice: umati
  rationale: Neno hili humaanisha kundi kubwa la watu waliokusanyika; “umati” ni la kawaida, lenye heshima, na linafaa katika mazingira haya.
- source_word: εἶδεν
  choice: ulipoona
  rationale: Tafsiri hii inahifadhi maana ya moja kwa moja ya kuona, bila kuiongeza kuwa “kutambua” au “kugundua.” Umoja wa kitenzi unaafikiana na nomino ya mkusanyiko “umati.”
- source_word: οὐκ ἔστιν ἐκεῖ
  choice: hakuwa pale
  rationale: Ingawa Kigiriki kina kitenzi cha wakati wa sasa katika simulizi, Kiswahili cha kawaida hurudisha hali hiyo katika wakati uliopita baada ya “ulipoona.”
- source_word: οὐδὲ οἱ μαθηταὶ αὐτοῦ
  choice: wala wanafunzi wake
  rationale: Muundo huu mfupi unahifadhi uratibu hasi wa οὐδέ bila kurudia kitenzi kisichohitajika katika Kiswahili.
- source_word: ἐνέβησαν
  choice: wakaingia katika
  rationale: Katika muktadha wa vyombo vya majini, neno hili linamaanisha kuingia au kupanda chombo; “wakaingia katika” ni wazi na la kawaida.
- source_word: αὐτοὶ
  choice: wao wenyewe
  rationale: Huhifadhi msisitizo wa kiwakilishi cha Kigiriki kwamba watu wa umati wenyewe ndio walioingia katika mashua.
- source_word: τὰ πλοιάρια
  choice: mashua
  rationale: “Mashua” ni neno la kawaida la Kiswahili kwa vyombo hivi. Umbo la Kigiriki linaweza kuwa la udogo, jambo linalohifadhiwa katika tanbihi bila kufanya matini kuu kuwa nzito.
- source_word: ἦλθον εἰς Καφαρναούμ
  choice: na kwenda Kapernaumu
  rationale: “Kwenda Kapernaumu” ni simulizi la kawaida kwa mwendo kuelekea mahali hapo na linawasilisha maana ya ἔρχομαι pamoja na εἰς.
- source_word: ζητοῦντες τὸν Ἰησοῦν
  choice: wakimtafuta Yesu
  rationale: Hii inaonyesha kitendo kinachoendelea cha kujaribu kumpata Yesu, bila kuingiza maana ya kiroho ambayo muktadha hauilazimishi.
