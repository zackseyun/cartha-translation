base_translation:
  language: en
  yaml_path: translation/nt/john/006/052.yaml
  text: So the Jews were arguing among themselves[a], saying[b], “How can this man give us his flesh to eat?”
translation:
  language: sw
  text: Basi Wayahudi[a] walikuwa wakibishana wao kwa wao, wakisema, “Mtu huyu anawezaje kutupa nyama yake[b] ili tule?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watu wa Yudea,” au, kulingana na muktadha, “viongozi wa Kiyahudi.” Kigiriki kinasema tu “Wayahudi.”
    reason: alternative_reading
  - marker: b
    text: Au “mwili wake.” Neno la Kigiriki ni “nyama” (σάρξ); neno hili limehifadhiwa hapa ili kudumisha usemi wa wazi na mvutano wa kifungu hiki.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐμάχοντο
  choice: walibishana
  rationale: Kitenzi cha wakati usiotimilika kinaonyesha mabishano yaliyokuwa yakiendelea. “Walibishana” linaonyesha mzozo wa maneno bila kudokeza mapigano ya mwili.
- source_word: οὖν
  choice: Basi
  rationale: Neno hili linaunganisha mabishano na maneno yaliyotangulia na kuendeleza simulizi kwa Kiswahili cha kawaida.
- source_word: πρὸς ἀλλήλους
  choice: wao kwa wao
  rationale: Hii ni namna ya kawaida ya Kiswahili ya kuonyesha kwamba walibishana miongoni mwao.
- source_word: οἱ Ἰουδαῖοι
  choice: Wayahudi
  rationale: Tafsiri ya moja kwa moja ya maneno ya Kigiriki, bila kuamua katika matini kuu kama yanawalenga watu wa Yudea au viongozi wa Kiyahudi.
- source_word: λέγοντες
  choice: wakisema
  rationale: Kishiriki hiki kinaanzisha maneno yaliyokuwa sehemu ya mabishano yao.
- source_word: Πῶς δύναται
  choice: anawezaje
  rationale: Ni usemi wa kawaida wa Kiswahili kwa swali linalohusu uwezekano au uwezo.
- source_word: οὗτος
  choice: mtu huyu
  rationale: Kinahifadhi sauti ya kumweka Yesu mbali au kumtaja kwa namna yenye dharau kidogo kuliko kiwakilishi “yeye.”
- source_word: ἡμῖν
  choice: kutupa
  rationale: Kiambishi “-tu-” kinawakilisha yambwa “sisi” kwa njia ya asili katika Kiswahili.
- source_word: δοῦναι
  choice: kupa
  rationale: Hili ndilo maana ya msingi ya kitenzi, bila kuliongeza au kulipunguza.
- source_word: τὴν σάρκα αὐτοῦ
  choice: nyama yake
  rationale: “Nyama” kinahifadhi taswira halisi na ya kushitua ya σάρξ katika muktadha huu; “mwili” lingeweza kulainisha mvutano wa kauli hiyo.
- source_word: φαγεῖν
  choice: tule
  rationale: Muundo “kutupa ... tule” ni wa asili katika Kiswahili na unaonyesha kusudi la kutoa nyama hiyo.
theological_decisions:
- issue: Tafsiri ya σάρξ katika muktadha wenye mvutano wa kiteolojia
  choice: nyama
  alternative: mwili
  rationale: “Nyama” kinahifadhi lugha halisi na concrete ya Kigiriki pamoja na mshangao wa wasikilizaji, bila kuingiza mapema tafsiri fulani ya kisakramenti.
- issue: Upeo wa οἱ Ἰουδαῖοι katika Injili ya Yohana
  choice: Wayahudi
  alternative: watu wa Yudea; viongozi wa Kiyahudi
  rationale: Matini kuu inafuata wazi maneno ya Kigiriki. Tanbihi inataja uwezekano wa maana finyu zaidi bila kuutatua kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni rahisi kueleweka kwa msomaji wa kawaida; “nyama yake” limechaguliwa kwa makusudi ili kuhifadhi ukali wa picha ya asili.
