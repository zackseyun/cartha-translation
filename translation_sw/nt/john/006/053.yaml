base_translation:
  language: en
  yaml_path: translation/nt/john/006/053.yaml
  text: So Jesus said to them[a], “Truly, truly, I say to you, unless you eat the flesh of the Son of Man and drink his blood[b], you do not have life in yourselves.”
translation:
  language: sw
  text: Basi Yesu akawaambia, “Kweli, kweli, nawaambia, msipokula nyama[a] ya Mwana wa Adamu na kunywa damu yake, hamna uzima ndani yenu.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mwili.” Neno la Kigiriki ni σάρξ, yaani “nyama,” ambalo huhifadhi ukali halisi wa kauli hii.
    reason: lexical_alternative
  - marker: b
    text: Aya hii inasema tu “uzima,” si “uzima wa milele,” ingawa mara nyingi muktadha mpana katika Yohana unahusianisha uzima huu na uzima wa milele.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Basi
  rationale: Huonyesha mwendelezo wenye matokeo kutoka katika mazungumzo yaliyotangulia, kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: Ἀμὴν ἀμὴν
  choice: Kweli, kweli
  rationale: Huhifadhi urudiaji wa mkazo katika tamko hili la Yesu badala ya kuufupisha.
- source_word: ἐὰν μὴ φάγητε
  choice: msipoula
  rationale: Ni uundaji wa kawaida wa sharti hasi kwa Kiswahili na huhifadhi maana halisi ya kula.
- source_word: σάρκα
  choice: mwili
  rationale: Katika muktadha huu, 'mwili' ni neno la Kiswahili linaloeleweka kwa kawaida kwa nyama ya mtu aliye hai; tanbihi inaonyesha kwamba Kigiriki kimetumia σάρξ, yaani 'nyama,' ili nguvu yake halisi isifichwe.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: wa Mwana wa Adamu
  rationale: Huhifadhi jina la kujitambulisha la Yesu lililozoeleka katika Biblia ya Kiswahili na mwangwi wake wa Kimasihi.
- source_word: πίητε αὐτοῦ τὸ αἷμα
  choice: kuinywa damu yake
  rationale: Huhifadhi taswira ya moja kwa moja na yenye kushtua ya kunywa damu bila kuifasiri kisakramenti au kisitiari.
- source_word: ζωὴν
  choice: uzima
  rationale: '''Uzima'' huwasilisha ζωὴ kwa kawaida katika muktadha wa Yohana bila kuongeza kivumishi ''wa milele'' ambacho hakipo hapa.'
- source_word: ἐν ἑαυτοῖς
  choice: ndani yenu
  rationale: Huhifadhi wazo la kuwa na uzima ndani yao wenyewe kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Iwapo lugha ya kula na kunywa itafsiriwe moja kwa moja au ifafanuliwe kwa mtazamo wa kisakramenti au kisitiari
  choice: Kuhifadhi maneno ya moja kwa moja ya kula mwili na kunywa damu
  alternative: Kutumia maneno ya kufasiri kama 'kushiriki,' 'kupokea,' au lugha iliyo waziwazi ya Ekaristi
  rationale: Kauli ya Kigiriki ni halisi kwa maneno na imekusudiwa kuwa kali. Tafsiri haipaswi kuamua mjadala wa kama maana yake ni ya kisakramenti, kisitiari, au yote mawili.
- issue: Iwapo ζωὴν ipanuliwe kuwa 'uzima wa milele' kutokana na muktadha mpana wa Yohana
  choice: Kutumia 'uzima' pekee katika matini kuu
  alternative: uzima wa milele
  rationale: Kifungu hiki hakina αἰώνιον ('wa milele'); kuongeza maneno hayo kungeingiza ufafanuzi usiotajwa wazi katika chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Urudiaji 'Kweli, kweli' na taswira kali ya kula na kunywa zimehifadhiwa. Alama zote za tanbihi zimewekwa katika matini kuu.
