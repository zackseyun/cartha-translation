base_translation:
  language: en
  yaml_path: translation/nt/john/006/017.yaml
  text: They got into a boat and were heading across the sea to Capernaum[a]. And it had already become dark[c][b], and Jesus had not yet come to them.
translation:
  language: sw
  text: Walipanda mashua, wakaendelea kuvuka bahari[a] kuelekea Kapernaumu. Giza lilikuwa tayari limeingia,[b] na Yesu alikuwa bado hajawajia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuelekea upande wa pili wa bahari.”
    reason: lexical_alternative
  - marker: b
    text: Au, “Tayari kulikuwa na giza.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμβάντες εἰς πλοῖον
  choice: Walipanda mashua
  rationale: Kitenzi kishirikishi cha wakati uliopita kinaonyesha tendo lililotangulia mwendo wa kuvuka. Muundo huu wa Kiswahili ni wa kawaida na unaendeleza mfuatano bila kulazimisha tafsiri ya neno kwa neno.
- source_word: ἤρχοντο πέραν τῆς θαλάσσης
  choice: wakawa wakivuka bahari
  rationale: Muundo wa ‘wakawa wakivuka’ unaonyesha mwendo uliokuwa unaendelea, kama hali ya kitenzi cha Kigiriki katika wakati usiotimilika. ‘Bahari’ huhifadhi neno θάλασσα na matumizi ya Yohana.
- source_word: εἰς Καφαρναούμ
  choice: kuelekea Kapernaumu
  rationale: Kihusishi kinaonyesha mwelekeo au mahali walipokusudia kwenda. ‘Kuelekea’ kinafaa kwa safari ambayo bado ilikuwa ikiendelea; jina limetoholewa kwa namna iliyozoeleka katika Kiswahili.
- source_word: σκοτία ἤδη ἐγεγόνει
  choice: Giza lilikuwa tayari limeingia
  rationale: Kauli hii ya kawaida ya Kiswahili inaonyesha kwamba mabadiliko ya kuwa giza yalikuwa tayari yametokea na hali yake iliendelea, hivyo kuhifadhi maana ya wakati timilifu uliopita.
- source_word: οὔπω ἐληλύθει πρὸς αὐτοὺς ὁ Ἰησοῦς
  choice: Yesu alikuwa bado hajawajia
  rationale: Tafsiri hii inahifadhi οὔπω (‘bado ... haja-’) na maana ya kuja kwao bila kufasiri zaidi kwamba Yesu alikuwa amejiunga nao.
theological_decisions:
- issue: Mfuatano wa matukio na hali ya vitendo
  choice: Kupanda mashua kunaonyeshwa kama tendo la kwanza, kuvuka kama mwendo uliokuwa ukiendelea, na kuingia kwa giza pamoja na kutowajia kwa Yesu kama hali zilizokuwapo kufikia wakati huo.
  alternative: Kutafsiri vitendo vyote kwa wakati rahisi, kama ‘walivuka’ na ‘kulikuwa na giza.’
  rationale: Uchaguzi huu huhifadhi hali za vitenzi vya Kigiriki na mvutano wa simulizi bila kuongeza dai lolote la kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Mashua’ ni neno la kawaida kwa πλοῖον katika mazingira haya; ‘wakawa wakivuka’ huhifadhi mwendo unaoendelea bila kuwa mzito.
