  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἔλεγον· ⸀Οὐχ οὗτός ἐστιν Ἰησοῦς ὁ υἱὸς Ἰωσήφ, οὗ ἡμεῖς οἴδαμεν τὸν πατέρα καὶ τὴν μητέρα; πῶς ⸀νῦν ⸀λέγει ὅτι Ἐκ τοῦ οὐρανοῦ καταβέβηκα;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/042.yaml
  text: And they were saying, “Is this not Jesus, the son of Joseph, whose father and mother we know? How does he now say, ‘I have come down from heaven’?”
translation:
  language: sw
  text: Nao walikuwa wakisema, “Je, huyu si Yesu, mwana wa Yosefu, ambaye sisi tunawajua baba yake na mama yake? Inakuwaje sasa anasema, ‘Nimeshuka kutoka mbinguni’?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: walikuwa wakisema
  rationale: Huhifadhi hali endelevu au ya kurudiwa-rudiwa ya wakati usiotimilifu wa Kigiriki, bila kuifanya kuwa kauli moja tu ya wakati uliopita.
- source_word: Οὐχ οὗτός ἐστιν
  choice: Je, huyu si
  rationale: Ni swali hasi la kawaida katika Kiswahili linalohifadhi nguvu ya swali linalotarajia kukubaliwa.
- source_word: ὁ υἱὸς Ἰωσήφ
  choice: mwana wa Yosefu
  rationale: Ni tafsiri ya moja kwa moja na ya asili ya muundo wa Kigiriki, ikisisitiza utambulisho wa Yesu kwa familia yake ya kibinadamu inayodhaniwa kujulikana.
- source_word: οὗ ἡμεῖς οἴδαμεν τὸν πατέρα καὶ τὴν μητέρα
  choice: ambaye sisi tunawajua baba yake na mama yake
  rationale: Huhifadhi kishazi husishi na msisitizo wa ἡμεῖς (“sisi”), pamoja na dai lao kwamba wanawajua wazazi wake.
- source_word: πῶς νῦν λέγει
  choice: Inakuwaje sasa anasema
  rationale: Hutoa πῶς kwa namna ya kawaida ya Kiswahili bila kuongeza wazo la uwezo lililo katika tafsiri kama “anawezaje,” na huhifadhi νῦν pamoja na wakati wa sasa wa λέγει.
- source_word: Ἐκ τοῦ οὐρανοῦ
  choice: kutoka mbinguni
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha chanzo au asili kulingana na ἐκ pamoja na hali ya umilikishi.
- source_word: καταβέβηκα
  choice: Nimeshuka
  rationale: Wakati timilifu wa Kiswahili unaonyesha tendo la kushuka lililokamilika lenye umuhimu katika hali ya sasa, kwa kufuata wakati timilifu wa Kigiriki.
theological_decisions:
- issue: Dai la Yesu kwamba ametoka mbinguni
  choice: Nimeshuka kutoka mbinguni
  alternative: Nilitoka mbinguni
  rationale: Tafsiri inahifadhi dai la moja kwa moja la asili ya mbinguni na picha ya kushuka, bila kulifanya kuwa sitiari wala kulifafanua kwa mafundisho ya ziada.
- issue: Utambulisho wa Yosefu kama baba anayejulikana na umati
  choice: ambaye sisi tunawajua baba yake na mama yake
  alternative: ambaye tunamjua baba yake na mama yake
  rationale: Kauli ya wahusika imeachwa kama dai lao wenyewe, bila kutatua mvutano kati ya mtazamo wao kuhusu ukoo wa Yesu na dai lake la kushuka kutoka mbinguni.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. “Inakuwaje sasa anasema” imetumiwa kuhifadhi swali la jinsi bila kuingiza dhana ya kutoweza.
