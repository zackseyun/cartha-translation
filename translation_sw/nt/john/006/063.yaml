base_translation:
  language: en
  yaml_path: translation/nt/john/006/063.yaml
  text: It is the Spirit who gives life[a]; the flesh benefits nothing[c][b]. The words that I have spoken to you are spirit and are life.
translation:
  language: sw
  text: Roho ndiye atoaye uzima[a]; mwili hauna faida yoyote[b]. Maneno niliyowaambia ni roho na ni uzima[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “roho ndiyo itoayo uzima.” Neno la Kigiriki πνεῦμα linaweza kumaanisha “Roho” au “roho”; hapa muktadha unaelekeza zaidi kwa Roho Mtakatifu.
    reason: alternative_reading
  - marker: b
    text: “Mwili” hapa unaweza kurejelea kwa upana kile ambacho ni cha kibinadamu tu; kulitafsiri kuwa “asili ya dhambi” kungeongeza ufafanuzi ambao Kigiriki hakilazimishi.
    reason: lexical_alternative
  - marker: c
    text: Au, “ni Roho na ni uzima,” au “ni ya kiroho na huleta uzima.” Usemi wa Kigiriki umebanwa na una nguvu ya kisifa.
    reason: alternative_reading
lexical_decisions:
- source_word: πνεῦμα
  choice: Roho
  rationale: Katika kishazi cha kwanza, muktadha wa Yohana na matumizi ya kiarifu yenye kibainishi yanaelekeza zaidi kwa Roho Mtakatifu. Herufi kubwa inaonyesha maana hiyo inayowezekana zaidi bila kuongeza jina “Mtakatifu,” ambalo halipo wazi katika Kigiriki.
- source_word: ζῳοποιοῦν
  choice: atoaye uzima
  rationale: Kitenzi-shirikishi hiki humaanisha kutoa uzima au kufanya hai. “Atoaye uzima” ni Kiswahili cha kawaida na kinadumisha tendo la Roho kama mhusika.
- source_word: σὰρξ
  choice: mwili
  rationale: “Mwili” ndilo neno la kawaida la Kiswahili kwa σάρξ katika utofautishaji huu. Linaacha maana pana ya kile kilicho cha kibinadamu au cha kimwili bila kuingiza tafsiri finyu ya “asili ya dhambi.”
- source_word: ὠφελεῖ οὐδέν
  choice: hauleti faida yoyote
  rationale: Kauli hii inadumisha ukanushaji kamili wa Kigiriki huku ikisikika kwa kawaida katika Kiswahili cha sasa.
- source_word: ῥήματα
  choice: maneno
  rationale: Neno hili linarejelea matamshi au mambo yaliyosemwa; “maneno” ni tafsiri ya moja kwa moja na ya kawaida katika muktadha huu.
- source_word: λελάληκα
  choice: nimewaambia
  rationale: Wakati timilifu wa Kigiriki unaonyesha maneno yaliyosemwa yenye umuhimu unaoendelea. “Nimewaambia” hudumisha hali hiyo kwa Kiswahili cha kawaida.
- source_word: πνεῦμά ἐστιν
  choice: ni roho
  rationale: Kiarifu kisicho na kibainishi kinaweza kuwa cha kisifa. “Ni roho” inadumisha usemi mfupi na mkali wa Kigiriki bila kuufafanua kupita kiasi kuwa “ni ya kiroho” au kuutambulisha moja kwa moja na Roho Mtakatifu.
- source_word: ζωή
  choice: uzima
  rationale: “Uzima” ni neno la kawaida katika Yohana kwa ζωή na linahifadhi kina chake cha maana bila ufafanuzi wa ziada.
theological_decisions:
- issue: Anayerejelewa na πνεῦμα katika kishazi cha kwanza
  choice: “Roho” inaeleweka kuwa Roho Mtakatifu
  alternative: “roho” kama kanuni ya kiroho kwa ujumla au roho ya mwanadamu
  rationale: Muktadha wa Injili ya Yohana huhusisha utoaji wa uzima na Roho, na muundo wenye kibainishi unaunga mkono mrejelewa mahususi. Tafsiri inaonyesha uwezekano huo huku tanbihi ikihifadhi maana nyingine.
- issue: Maana ya σὰρξ inapolinganishwa na Roho
  choice: “mwili” limehifadhiwa kama neno lenye maana pana
  alternative: “asili ya dhambi,” “nguvu za kibinadamu pekee,” au “mwili wa nyama”
  rationale: Kifungu hakipaswi kufungwa kwenye mfumo mmoja wa teolojia ya mwanadamu. “Mwili” huhifadhi mvutano uliopo katika usemi wa Yesu, na tanbihi huzuia maana yake isichukuliwe kwa ufinyu usiolazimishwa na Kigiriki.
- issue: Nguvu ya kiarifu ya πνεῦμά ἐστιν katika kishazi cha mwisho
  choice: 'Maana ya kisifa: maneno ya Yesu “ni roho na ni uzima”'
  alternative: Maana ya utambulisho, “ni Roho na uzima,” au ufafanuzi, “ni ya kiroho na huleta uzima”
  rationale: Kutokuwapo kwa kibainishi mbele ya kiarifu kunaunga mkono maana ya kisifa. Tafsiri inadumisha usemi uliobanwa wa Kigiriki na tanbihi inaonyesha tafsiri nyingine zinazowezekana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. “Atoaye uzima” na “hauleti faida yoyote” ni wazi kwa wasomaji wa kawaida. Muundo “ni roho na ni uzima” umeachwa kwa makusudi ukiwa mfupi ili kuhifadhi mkazo na utata halisi wa Kigiriki.
