id: JHN.21.20
reference: John 21:20
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ⸀Ἐπιστραφεὶς ὁ Πέτρος βλέπει τὸν μαθητὴν ὃν ἠγάπα ὁ Ἰησοῦς ἀκολουθοῦντα, ὃς καὶ ἀνέπεσεν ἐν τῷ δείπνῳ ἐπὶ τὸ στῆθος αὐτοῦ καὶ εἶπεν· Κύριε, τίς ἐστιν ὁ παραδιδούς σε;
base_translation:
  language: en
  yaml_path: translation/nt/john/021/020.yaml
  text: Peter turned and saw the disciple whom Jesus loved following[a], who had also leaned back against his chest at the supper and said, “Lord[b], who is the one betraying you?”
translation:
  language: sw
  text: Petro alipogeuka, akamwona yule mwanafunzi ambaye Yesu alimpenda akifuata[a]—ambaye pia alijiegemeza kifuani mwa Yesu wakati wa chakula cha jioni[b] na akasema, “Bwana, ni nani anayekusaliti?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki hakitaji wazi anayefuatwa; inaweza kueleweka “akimfuata,” “akiwafuata,” au kwa ujumla “akifuata.”
    reason: lexical_alternative
  - marker: b
    text: Kigiriki kinaonyesha desturi ya kuegemea mezani wakati wa kula; pia inaweza kutafsiriwa, “alijilaza kwa kuegemea kifuani mwa Yesu.”
    reason: cultural_clarification
lexical_decisions:
- source_word: Ἐπιστραφεὶς
  choice: alipogeuka
  rationale: Kishirikishi cha wakati uliopita kinaonyesha kitendo kinachotangulia kuona; muundo huu ni wa kawaida na unaweka wazi mfuatano wa matendo.
- source_word: βλέπει
  choice: akamwona
  rationale: Wakati uliopo wa kihistoria umetafsiriwa kwa wakati uliopita wa masimulizi, kama ilivyo kawaida katika Kiswahili, bila kubadili maana.
- source_word: μαθητὴν
  choice: mwanafunzi
  rationale: Hili ndilo neno la kawaida la Kiyohana kwa mtu anayejifunza na kumfuata Yesu; linadumisha mwendelezo wa istilahi.
- source_word: ὃν ἠγάπα ὁ Ἰησοῦς
  choice: ambaye Yesu alimpenda
  rationale: Tafsiri ya moja kwa moja na ya kawaida ya kishazi hiki, ikihifadhi kitenzi cha upendo bila kuongeza utambulisho wa mwanafunzi.
- source_word: ἀκολουθοῦντα
  choice: akiwa anafuata
  rationale: Hifadhi kitendo cha kufuata bila kutaja anayefuatwa, kwa kuwa Kigiriki hakina yambwa wazi katika kishirikishi hiki.
- source_word: ἀνέπεσεν
  choice: alikuwa ... amejiegemeza
  rationale: Katika muktadha wa mlo, kitenzi kinaonyesha kuketi kwa kuegemea na tendo la kujiegemeza karibu na kifua cha Yesu; Kiswahili hiki ni cha asili na kinaeleweka.
- source_word: ἐν τῷ δείπνῳ
  choice: wakati wa chakula cha jioni
  rationale: Hutoa mazingira ya mlo kwa lugha ya sasa na yenye heshima bila kuingiza maana ya kiibada isiyokuwamo katika neno.
- source_word: ἐπὶ τὸ στῆθος αὐτοῦ
  choice: kifuani pa Yesu
  rationale: Jina Yesu limerudiwa ili kuondoa utata wa kiwakilishi usio wa lazima katika Kiswahili; στῆθος ni eneo la kifua.
- source_word: Κύριε
  choice: Bwana
  rationale: Ni tafsiri ya kawaida ya κύριος katika kumwita Yesu, ikihifadhi heshima na uzito wa Kiyohana.
- source_word: ὁ παραδιδούς σε
  choice: anayekusaliti
  rationale: Katika muktadha wa mateso ya Yesu, παραδίδωμι humaanisha kumsaliti au kumkabidhi kwa hila; muundo wa wakati unaoendelea umehifadhiwa kwa 'anaye-'.
theological_decisions:
- issue: Yambwa lisilotajwa la ἀκολουθοῦντα
  choice: akiwa anafuata
  alternative: akimfuata / akiwafuata
  rationale: Kigiriki hakisemi wazi kama mwanafunzi anamfuata Yesu au anawafuata Yesu na Petro. Tafsiri haiongezi yambwa, hivyo inadumisha utata halisi wa maandishi.
- issue: Wakati uliopo wa kihistoria katika βλέπει
  choice: akamwona
  alternative: anamwona
  rationale: Huu ni uamuzi wa mtindo wa masimulizi, si ufafanuzi wa kiteolojia. Wakati uliopita unaendana vizuri na masimulizi ya Kiswahili bila kupoteza nguvu ya tukio.
- issue: Utambulisho wa mwanafunzi aliyependwa
  choice: yule mwanafunzi ambaye Yesu alimpenda
  alternative: Yohana
  rationale: Mstari haumtambui mwanafunzi huyo kwa jina; tafsiri inadumisha namna ya kumrejelea iliyotumiwa na mwandishi badala ya kuingiza hitimisho la kimapokeo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa masimulizi ni wa asili kwa wasomaji wa kawaida; utata wa yambwa la ‘kufuata’ umehifadhiwa na kufafanuliwa katika tanbihi.
