base_translation:
  language: en
  yaml_path: translation/nt/john/021/011.yaml
  text: So Simon Peter went aboard and pulled the net onto the shore[a], full of large fish, one hundred fifty-three; and though there were so many[b], the net was not torn.
translation:
  language: sw
  text: Basi Simoni Petro akapanda[a], akauvuta wavu mpaka nchi kavu, ukiwa umejaa samaki wakubwa mia moja hamsini na watatu. Ingawa walikuwa wengi hivyo, wavu haukuchanika.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akaingia ndani ya mashua.” Kitenzi cha Kigiriki kwa maana ya msingi ni “akapanda,” lakini katika muktadha huenda kinamaanisha kwamba Simoni Petro alipanda ndani au juu ya mashua ili kuuvuta wavu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέβη
  choice: akapanda
  rationale: Kitenzi hiki kwa maana ya msingi ni ‘alipanda.’ Muktadha unaashiria kupanda ndani au juu ya mashua, lakini kwa kuwa mashua haitajwi wazi katika mstari huu, tafsiri kuu inahifadhi usemi wa Kigiriki na tanbihi inaeleza maana inayowezekana.
- source_word: οὖν
  choice: Basi
  rationale: Kiunganishi hiki kinaonyesha mwendelezo au matokeo katika simulizi; ‘Basi’ ni cha kawaida na chenye hadhi katika Kiswahili cha simulizi.
- source_word: εἵλκυσεν
  choice: kulivuta
  rationale: ‘Kulivuta’ linaeleza moja kwa moja tendo la kuvuta wavu bila kuongeza wazo la kuukokota ardhini.
- source_word: τὸ δίκτυον
  choice: wavu
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa kifaa hiki cha kuvulia samaki.
- source_word: εἰς τὴν γῆν
  choice: mpaka ufuoni
  rationale: Kihalisi ni ‘hadi nchi/kavu’; katika mazingira ya uvuvi, ‘ufuoni’ huwasilisha kwa kawaida mahali ambapo wavu ulivutwa kutoka majini.
- source_word: μεστὸν ἰχθύων μεγάλων
  choice: likiwa limejaa samaki wakubwa
  rationale: Muundo huu ni wa kawaida katika Kiswahili na unahifadhi maelezo kwamba wavu ulikuwa umejaa samaki wenye ukubwa mkubwa.
- source_word: ἑκατὸν πεντήκοντα τριῶν
  choice: '153'
  rationale: Inahifadhi idadi kamili iliyotajwa katika chanzo kwa namna iliyo wazi kwa msomaji wa sasa.
- source_word: τοσούτων ὄντων
  choice: Ingawa walikuwa wengi hivyo
  rationale: 'Muundo huu unaonyesha hali ya kukubali jambo linalotarajiwa kuwa kikwazo: licha ya wingi wao, wavu haukuchanika.'
- source_word: οὐκ ἐσχίσθη
  choice: wavu haukuchanika
  rationale: ‘Haukuchanika’ ni usemi wa asili wa Kiswahili unaowasilisha kwa usahihi hali ya wavu kutoraruka.
