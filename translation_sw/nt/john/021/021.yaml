  yaml_path: translation/nt/john/021/021.yaml
  text: So when Peter saw him, he says to Jesus, “Lord, what about this man?”
translation:
  language: sw
  text: Basi Petro alipomwona, anamwambia Yesu, “Bwana, na huyu je?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτον … ἰδών
  choice: alipomwona
  rationale: Kiwakilishi kinamrejelea mwanafunzi aliyetajwa katika muktadha uliotangulia; Kiswahili kinaweza kuhifadhi rejeo hilo kwa kiambishi cha yambwa bila kulazimika kuongeza ‘mtu huyu’.
- source_word: οὖν
  choice: Basi
  rationale: Huonyesha mwendelezo na matokeo ya simulizi kutokana na mstari uliotangulia.
- source_word: λέγει
  choice: akamwuliza
  rationale: Ingawa kitenzi ni ‘anasema,’ maneno yanayofuata ni swali; katika simulizi ya Kiswahili ‘akamwuliza’ ni ya kawaida na huwasilisha kazi ya kauli bila kubadili maana.
- source_word: Κύριε
  choice: Bwana
  rationale: Ndiyo namna ya kawaida na yenye heshima ya kumwita Yesu katika muktadha huu.
- source_word: οὗτος δὲ τί;
  choice: na huyu je?
  rationale: Ni usemi mfupi wa Kiswahili unaohifadhi ufupi na kutokukamilika kwa swali la Kigiriki, ambalo kwa muktadha linamaanisha ‘itakuwaje kwake?’
theological_decisions:
- issue: Jambo ambalo Petro anauliza kuhusu mwanafunzi mwingine halijaelezwa wazi.
  choice: na huyu je?
  alternative: itakuwaje kwa huyu?
  rationale: Tafsiri inahifadhi ufupi na utata wa asili badala ya kuamua kwamba Petro anauliza hasa kuhusu hatima, huduma, au namna ya kifo cha mwanafunzi huyo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ‘na huyu je?’ ni wa kawaida, mfupi, na unafaa katika mazungumzo.
