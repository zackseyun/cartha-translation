  text: Οὗτός ἐστιν ὁ μαθητὴς ὁ μαρτυρῶν περὶ τούτων καὶ ⸀ὁ γράψας ταῦτα, καὶ οἴδαμεν ὅτι ἀληθὴς ⸂αὐτοῦ ἡ μαρτυρία ἐστίν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/024.yaml
  text: This is the disciple who testifies about these things and who wrote these things[a], and we know that his testimony is true.
translation:
  language: sw
  text: Huyu ndiye mwanafunzi anayeshuhudia[a] kuhusu mambo haya na aliyeandika mambo haya; nasi tunajua kwamba ushuhuda wake ni wa kweli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiyunani hutumia maneno yanayohusiana katika “anayeshuhudia” na “ushuhuda” katika aya hii.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὗτός
  choice: Huyu
  rationale: Kiwakilishi cha kuonyesha kinamrejelea mwanafunzi aliyetajwa; “Huyu” ni cha kawaida na huhifadhi nguvu ya utambulisho.
- source_word: μαθητὴς
  choice: mwanafunzi
  rationale: Ni neno la kawaida katika Yohana kwa mfuasi wa Yesu; “mwanafunzi” ni sahihi na linaeleweka katika Kiswahili cha sasa.
- source_word: μαρτυρῶν
  choice: anayeshuhudia
  rationale: Kivumishi-tendo cha wakati wa sasa kinaweza kuonyesha tendo linaloendelea au tabia ya kudumu; “anayeshuhudia” huhifadhi maana hiyo pamoja na uhusiano wake na “ushuhuda”.
- source_word: περὶ τούτων
  choice: kuhusu mambo haya
  rationale: Tafsiri ya moja kwa moja na ya asili inayounganisha usemi na mambo yaliyoandikwa katika Injili.
- source_word: ὁ γράψας ταῦτα
  choice: aliyeandika mambo haya
  rationale: Kivumishi-tendo cha aoristi kinaonyesha tendo la kuandika lililokamilika; kishazi hiki ni cha asili katika Kiswahili.
- source_word: οἴδαμεν
  choice: tunajua
  rationale: Kitenzi hiki chenye umbo la perfect kina maana ya sasa katika Kiyunani cha Koine; tafsiri hii haibainishi wale wanaosema “sisi”.
- source_word: ἀληθὴς
  choice: wa kweli
  rationale: Kivumishi hiki kinaeleza ushuhuda kuwa wa kweli; chaguo hili ni la moja kwa moja na linafaa katika muktadha wa Yohana.
- source_word: αὐτοῦ ἡ μαρτυρία
  choice: ushuhuda wake
  rationale: Muundo wa umilikaji ni wa kawaida katika Kiswahili na huhifadhi maana ya ushahidi au tamko la shahidi.
- source_word: μαρτυρία
  choice: ushuhuda
  rationale: “Ushuhuda” huhifadhi uhusiano wa kimzizi na kitenzi “anayeshuhudia” kama ilivyo katika Kiyunani.
theological_decisions:
- issue: Utambulisho na sauti ya “tunajua”
  choice: Kutafsiri nafsi ya kwanza wingi moja kwa moja kuwa “tunajua” bila kubainisha wasemaji.
  alternative: Mwinjilisti akizungumza kwa mtindo wa uhariri, au jumuiya ya mashahidi ikithibitisha ushuhuda wa mwanafunzi mpendwa.
  rationale: Kiyunani kinatumia wazi nafsi ya kwanza wingi lakini hakiwatambulishi wanaorejelewa; tafsiri inapaswa kuhifadhi hali hiyo badala ya kuamua suala la uandishi au jumuiya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo ni wa ulinganifu bora, ukihifadhi marudio ya “mambo haya” na kutobainisha utambulisho wa “sisi” katika “tunajua.”
