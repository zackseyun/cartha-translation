  text: λέγει αὐτοῖς Σίμων Πέτρος· Ὑπάγω ἁλιεύειν· λέγουσιν αὐτῷ· Ἐρχόμεθα καὶ ἡμεῖς σὺν σοί. ἐξῆλθον καὶ ἐνέβησαν εἰς τὸ ⸀πλοῖον, καὶ ἐν ἐκείνῃ τῇ νυκτὶ ἐπίασαν οὐδέν.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/003.yaml
  text: Simon Peter said to them[a], “I am going to fish.” They said to him, “We are also coming with you.” They went out and got into the boat, and that night they caught nothing.
translation:
  language: sw
  text: Simoni Petro akawaambia[a], “Ninaenda kuvua samaki.” Wakamwambia, “Sisi pia tunakwenda pamoja nawe.” Wakatoka, wakapanda mashua, na usiku huo hawakuvua chochote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki kinatumia wakati uliopo wa kihistoria (“Simoni Petro anawaambia ... wanamwambia”), mtindo wa kawaida wa kisimulizi ambao hapa umetafsiriwa kwa wakati uliopita katika Kiswahili.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει αὐτοῖς
  choice: akawaambia
  rationale: Kauli hii ya wakati uliopo wa kihistoria imetafsiriwa kwa wakati uliopita wa kisimulizi, ambao ni wa kawaida na wa asili katika Kiswahili; ‘akawaambia’ pia huendeleza mtiririko wa matukio.
- source_word: Ὑπάγω ἁλιεύειν
  choice: Ninaenda kuvua samaki
  rationale: ‘Ninaenda’ huonyesha tendo analolikusudia Petro, na ‘kuvua samaki’ ni usemi wa kawaida unaoweka wazi maana ya ἁλιεύειν katika muktadha huu.
- source_word: Ἐρχόμεθα καὶ ἡμεῖς σὺν σοί
  choice: Sisi pia tunakwenda pamoja nawe
  rationale: ‘Sisi pia’ huhifadhi msisitizo wa καὶ ἡμεῖς, huku ‘pamoja nawe’ ikiwakilisha σύν σοί. Kiswahili hutumia ‘tunakwenda’ kwa kawaida wanapoungana na mtu anayeondoka kwenda mahali fulani.
- source_word: ἐξῆλθον
  choice: Wakatoka
  rationale: Huhifadhi maana ya msingi ya kutoka na kuendeleza mfuatano wa kisimulizi.
- source_word: ἐνέβησαν εἰς τὸ πλοῖον
  choice: wakaingia ndani ya mashua
  rationale: Ni Kiswahili cha kawaida kwa tendo la kupanda na kuingia katika chombo; ‘mashua’ inafaa kwa chombo cha uvuvi katika mazingira haya kuliko ‘meli’.
- source_word: ἐν ἐκείνῃ τῇ νυκτί
  choice: usiku huo
  rationale: Hii ndiyo namna ya asili ya kutafsiri kirai cha wakati katika Kiswahili.
- source_word: ἐπίασαν οὐδέν
  choice: hawakupata chochote
  rationale: Katika muktadha wa uvuvi, πιάζω humaanisha kupata au kuvua kilichonaswa. ‘Hawakupata chochote’ ni ya kawaida na huhifadhi kutofaulu kabisa.
