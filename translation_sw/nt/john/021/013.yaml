  text: ⸀ἔρχεται ⸀ὁ Ἰησοῦς καὶ λαμβάνει τὸν ἄρτον καὶ δίδωσιν αὐτοῖς, καὶ τὸ ὀψάριον ὁμοίως.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/013.yaml
  text: Jesus comes and takes the bread and gives it to them[b][a], and the fish likewise.
translation:
  language: sw
  text: Yesu anakuja, anachukua mkate na anawapa[a], na samaki vivyo hivyo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yesu akaja, akachukua mkate na akawapa.” Kigiriki kinatumia wakati uliopo wa kihistoria.
    reason: lexical_alternative
  - marker: b
    text: Au, “na samaki kwa namna iyo hiyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται
  choice: anakuja
  rationale: Wakati uliopo wa kihistoria umehifadhiwa ili kuakisi mtindo hai wa simulizi la Yohana; maana ya wakati uliopita imeonyeshwa katika tanbihi.
- source_word: λαμβάνει
  choice: anachukua
  rationale: Kitenzi hiki kinaonyesha tendo rahisi la Yesu kuuchukua mkate kabla ya kuwapa wanafunzi, bila kuongeza wazo pana zaidi la kuwahudumia.
- source_word: τὸν ἄρτον
  choice: mkate
  rationale: Kiswahili kwa kawaida hakihitaji neno la kuonyesha uainifu kama ilivyo kwa kibainishi cha Kigiriki; muktadha unaonyesha kuwa ni mkate uliokuwapo hapo.
- source_word: δίδωσιν αὐτοῖς
  choice: na kuwapa
  rationale: Kiambishi wa- kinawakilisha αὐτοῖς, nao mkate ndio kitu kinachoeleweka kuwa kinatolewa. Muundo huu ni wa kawaida katika Kiswahili na hauongezi tafsiri ya 'kuwahudumia'.
- source_word: τὸ ὀψάριον
  choice: samaki
  rationale: Katika muktadha huu neno linamaanisha samaki kama chakula. 'Samaki' ni fasiri wazi bila kuongeza kwamba alikuwa amepikwa, jambo ambalo neno lenyewe halilazimishi.
- source_word: ὁμοίως
  choice: vivyo hivyo
  rationale: Kauli hii fupi inaonyesha kwamba Yesu alifanya kwa samaki yale aliyofanya kwa mkate, huku ikihifadhi ulinganifu mfupi wa Kigiriki.
theological_decisions:
- issue: Vitenzi vya wakati uliopo katika simulizi la Yesu kufufuka na kuwatokea wanafunzi
  choice: 'Kuhifadhi wakati uliopo wa kihistoria: “anakuja, anachukua ... kuwapa”'
  alternative: 'Kutumia wakati uliopita wa kisimulizi: “akaja, akachukua ... akawapa”'
  rationale: Huu ni uamuzi wa kimtindo, si wa kimafundisho. Wakati uliopo wa kihistoria huhifadhi upekee na uhai wa simulizi la Kigiriki bila kubadili maana ya tukio.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo “na kuwapa” ni wa kawaida na unaepuka kurudia kiwakilishi cha kitu ambacho tayari kinaeleweka kuwa mkate. Kauli ya mwisho imeachwa fupi kama ilivyo katika Kigiriki.
