  text: ἐξῆλθεν οὖν ⸂οὗτος ὁ λόγος⸃ εἰς τοὺς ἀδελφοὺς ὅτι ὁ μαθητὴς ἐκεῖνος οὐκ ἀποθνῄσκει. ⸂οὐκ εἶπεν δὲ⸃ αὐτῷ ὁ Ἰησοῦς ὅτι οὐκ ἀποθνῄσκει ἀλλ’· Ἐὰν αὐτὸν θέλω μένειν ἕως ἔρχομαι, τί πρὸς σέ;
base_translation:
  language: en
  yaml_path: translation/nt/john/021/023.yaml
  text: So this report spread among the brothers that that disciple would not die. Yet Jesus did not say to him that he would not die, but, “If I want him to remain until I come, what is that to you?”
translation:
  language: sw
  text: Kwa hiyo, habari hii[a] ikaenea miongoni mwa ndugu[b] kwamba mwanafunzi huyo hangekufa. Lakini Yesu hakumwambia kwamba hangekufa, bali alisema, “Nikimtaka abaki mpaka nitakapokuja, hilo linakuhusu nini?”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kauli hii ikaenea.” Neno la Kigiriki λόγος linaweza kumaanisha “neno,” “kauli,” au “habari.”
    reason: lexical_alternative
  - marker: b
    text: “Ndugu” hapa inarejelea jumuiya ya wanafunzi; Kigiriki kimetumia nomino ya kiume katika wingi.
    reason: cultural_note
  - marker: c
    text: 'Yaani, Yesu hakuahidi kwamba mwanafunzi huyo hangekufa kamwe; alisema kwa sharti: “Nikimtaka abaki mpaka nitakapokuja…”'
    reason: cross_reference
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: ikaenea
  rationale: Katika muktadha huu kitenzi kinaeleza habari iliyosambaa katika kundi; “ikaenea” ni Kiswahili cha kawaida na sahihi kuliko tafsiri ya moja kwa moja “ikatoka.”
- source_word: οὗτος ὁ λόγος
  choice: habari hii
  rationale: λόγος hapa ni ujumbe uliokuwa ukisambazwa, si neno lenye maana maalumu ya kitheolojia. “Habari hii” inafaa kwa dai lililoenea, huku tanbihi ikihifadhi uwezekano wa “kauli hii.”
- source_word: εἰς τοὺς ἀδελφοὺς
  choice: miongoni mwa ndugu
  rationale: Kirai hiki kinaonyesha kuenea kwa habari ndani ya jumuiya ya wanafunzi. “Ndugu” huhifadhi umbo la kiume la wingi la Kigiriki bila kuongeza jinsia isiyotajwa wazi.
- source_word: ὁ μαθητὴς ἐκεῖνος
  choice: mwanafunzi huyo
  rationale: “Huyo” huhifadhi rejeleo mahsusi la ἐκεῖνος kwa mwanafunzi anayezungumziwa.
- source_word: οὐκ ἀποθνῄσκει
  choice: hangekufa
  rationale: Katika taarifa isiyo ya moja kwa moja inayofuata simulizi la wakati uliopita, “hangekufa” huwasilisha kwa kawaida maudhui ya dai lililoenea.
- source_word: οὐκ εἶπεν δὲ
  choice: Lakini Yesu hakumwambia
  rationale: δέ inaingiza usahihishaji wenye utofautishaji; “Lakini” huonyesha wazi kwamba Yesu hakutoa ahadi iliyodhaniwa.
- source_word: Ἐὰν αὐτὸν θέλω μένειν
  choice: Nikimtaka abaki
  rationale: Muundo huu wa Kiswahili huhifadhi sharti la ἐάν na hiari inayoonyeshwa na θέλω, bila kugeuza kauli kuwa ahadi.
- source_word: ἕως ἔρχομαι
  choice: mpaka nitakapokuja
  rationale: Wakati ujao wa Kiswahili ni wa kawaida katika kishazi hiki na unabaki karibu na “nitakapokuja,” bila kuongeza tafsiri ya “kurudi.”
- source_word: τί πρὸς σέ
  choice: hilo linakuhusu nini?
  rationale: Hii ni tafsiri ya kawaida na ya moja kwa moja ya nahau inayokataa kwamba jambo hilo ni jukumu la Petro.
theological_decisions:
- issue: Asili ya dai lililoenea kuhusu mwanafunzi huyo
  choice: Kulieleza kama habari iliyosambaa, kisha kuhifadhi usahihishaji wa wazi kwamba Yesu hakusema mwanafunzi huyo hangekufa.
  alternative: Kutafsiri kwa uhalisi zaidi, “neno hili likatoka,” au kutumia “kauli hii ikaenea.”
  rationale: Mstari wenyewe hutofautisha dai la jumuiya na maneno halisi ya Yesu. Tafsiri haipaswi kulifanya dai hilo kuwa ahadi ya Yesu.
- issue: Hali ya sharti katika maneno ya Yesu
  choice: “Nikimtaka abaki mpaka nitakapokuja”
  alternative: “Ikiwa ninataka abaki mpaka nitakapokuja”
  rationale: Muundo wa “ni-ki-” ni wa kawaida katika Kiswahili na huhifadhi hali ya kudhaniwa ya sharti; hauhakikishi kwamba mwanafunzi angebaki hai hadi kuja kwa Yesu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini rahisi kueleweka. “Habari hii ikaenea” ni usemi wa kawaida; “mwanafunzi huyo” na “mpaka nitakapokuja” huhifadhi mtindo na rejeleo la maandishi ya Kigiriki.
