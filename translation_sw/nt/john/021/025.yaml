  text: ἔστιν δὲ καὶ ἄλλα πολλὰ ⸀ἃ ἐποίησεν ὁ Ἰησοῦς, ἅτινα ἐὰν γράφηται καθ’ ἕν, οὐδ’ αὐτὸν οἶμαι τὸν κόσμον ⸀χωρήσειν τὰ γραφόμενα ⸀βιβλία.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/025.yaml
  text: There are also many other things that Jesus did[a], which, if they were written down one by one, I suppose that not even the world itself would have room for the books being written.
translation:
  language: sw
  text: Pia kuna mambo mengine mengi ambayo Yesu alifanya. Kama yangeandikwa moja baada ya jingine, nadhani hata ulimwengu wenyewe usingekuwa na nafasi ya vitabu ambavyo vingeandikwa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hata ulimwengu wenyewe usingeweza kutoshea vitabu ambavyo vingeandikwa.” Kitenzi cha Kigiriki kinaweza kumaanisha “kuwa na nafasi ya” au “kutoshea.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ καὶ ἄλλα πολλὰ
  choice: Pia kuna mambo mengine mengi
  rationale: Kauli hii inaendeleza na kuhitimisha simulizi kwa njia ya kawaida katika Kiswahili, huku ikihifadhi wazo la matendo mengine mengi zaidi ya yaliyoandikwa.
- source_word: ἃ ἐποίησεν ὁ Ἰησοῦς
  choice: ambayo Yesu alifanya
  rationale: Kitenzi ποιέω hapa kinarejelea kwa upana matendo ya Yesu; “alifanya” ni cha kawaida na hakifinyanzi maana.
- source_word: ἐὰν γράφηται καθ’ ἕν
  choice: Kama yangeandikwa moja baada ya jingine
  rationale: Muundo huu unahifadhi hali ya kudhaniwa ya ἐάν pamoja na nguvu ya mgawanyo ya καθ’ ἕν kwa Kiswahili cha kawaida.
- source_word: οἶμαι
  choice: nadhani
  rationale: Inahifadhi kauli ya kibinafsi na ya kutafakari ya mwandishi bila kuongeza uhakika usiokuwapo katika Kigiriki.
- source_word: οὐδ’ αὐτὸν ... τὸν κόσμον
  choice: hata ulimwengu wenyewe
  rationale: “Mwenyewe” inawakilisha mkazo wa αὐτόν, na “hata” inahifadhi nguvu ya οὐδέ.
- source_word: χωρήσειν
  choice: usingekuwa na nafasi ya
  rationale: Inadumisha taswira ya χωρέω ya kuwa na nafasi ya kitu, badala ya kufuta chumvi ya usemi kuwa kauli tu kuhusu wingi.
- source_word: τὰ γραφόμενα βιβλία
  choice: vitabu ambavyo vingeandikwa
  rationale: Ingawa kishiriki ni cha wakati uliopo kwa umbo, katika sharti hili la kudhaniwa kinataja vitabu ambavyo vingetokana na kuandikwa kwa matendo hayo; Kiswahili cha hali ya masharti ni cha asili zaidi.
theological_decisions:
- issue: Chumvi ya usemi kuhusu uwezo wa ulimwengu kuwa na vitabu
  choice: Imehifadhiwa kama “hata ulimwengu wenyewe usingekuwa na nafasi ya vitabu”
  alternative: “vitabu vingekuwa vingi sana”
  rationale: Taswira yenye mkazo inayofunga Injili imehifadhiwa bila kuigeuza kuwa hesabu halisi wala kuipunguza kuwa taarifa ya jumla kuhusu wingi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ndefu ya Kigiriki imegawanywa katika sentensi mbili ili isomeke kwa urahisi bila kupoteza uhusiano wa mawazo. Alama ya tanbihi imewekwa baada ya sehemu inayohusika moja kwa moja na tofauti ya kimsamiati.
