  text: ἦσαν ὁμοῦ Σίμων Πέτρος καὶ Θωμᾶς ὁ λεγόμενος Δίδυμος καὶ Ναθαναὴλ ὁ ἀπὸ Κανὰ τῆς Γαλιλαίας καὶ οἱ τοῦ Ζεβεδαίου καὶ ἄλλοι ἐκ τῶν μαθητῶν αὐτοῦ δύο.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/002.yaml
  text: Simon Peter[a], Thomas called Didymus, Nathanael from Cana of Galilee, the sons of Zebedee, and two others of his disciples were together.
translation:
  language: sw
  text: Simoni Petro, Tomaso aitwaye Pacha[a], Nathanaeli kutoka Kana ya Galilaya, wana wa Zebedayo, na wengine wawili miongoni mwa wanafunzi wake walikuwa pamoja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kigiriki: Δίδυμος (Didymos), maana yake “Pacha.”'
    reason: Tanbihi inahifadhi umbo la Kigiriki la Δίδυμος huku matini kuu ikitoa maana yake kwa Kiswahili.
lexical_decisions:
- source_word: ἦσαν ὁμοῦ
  choice: walikuwa pamoja
  rationale: Kauli hii inaeleza hali ya wakati uliopita na kuwa kwao mahali pamoja; Kiswahili hiki ni cha kawaida na kinatunza maana ya Kigiriki.
- source_word: Σίμων Πέτρος
  choice: Simoni Petro
  rationale: Majina yametoholewa kwa namna iliyozoeleka katika Kiswahili cha Biblia.
- source_word: Θωμᾶς ὁ λεγόμενος Δίδυμος
  choice: Tomaso aitwaye Pacha[a]
  rationale: λεγόμενος ni ‘aitwaye,’ na Δίδυμος humaanisha ‘Pacha.’ Kutafsiri maana ya jina la utambulisho humwezesha msomaji kuelewa kauli hiyo moja kwa moja; tanbihi inahifadhi umbo la Kigiriki ‘Didimo.’
- source_word: Ναθαναὴλ ὁ ἀπὸ Κανὰ τῆς Γαλιλαίας
  choice: Nathanaeli kutoka Kana ya Galilaya
  rationale: ἀπό inaonyesha mahali alikotoka Nathanaeli; ‘Kana ya Galilaya’ inatunza utambulisho wa kijiografia.
- source_word: οἱ τοῦ Ζεβεδαίου
  choice: wana wa Zebedayo
  rationale: Usemi wa Kigiriki unamaanisha wale walio wa Zebedayo; katika muktadha huu ni wanawe, hivyo nomino ‘wana’ imewekwa wazi kwa Kiswahili cha kawaida.
- source_word: ἄλλοι ἐκ τῶν μαθητῶν αὐτοῦ δύο
  choice: wengine wawili miongoni mwa wanafunzi wake
  rationale: ‘Miongoni mwa’ inatunza maana ya ἐκ ya kwamba watu hao wawili walitoka katika kundi la wanafunzi wake.
- source_word: καί ... καί
  choice: orodha yenye koma na ‘na’ kabla ya kipengele cha mwisho
  rationale: Viunganishi vinavyorudiwa katika Kigiriki vimewasilishwa kwa muundo wa orodha ulio wa kawaida katika Kiswahili bila kupoteza uratibu wa vipengele.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini wa kawaida na unaoeleweka. Mpangilio wa orodha umefanywa kuwa wa asili katika Kiswahili, huku maana ya kuwa pamoja na maana ya sehemu ya kundi katika ‘miongoni mwa wanafunzi wake’ zikihifadhiwa.
