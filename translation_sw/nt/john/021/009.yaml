  text: Ὡς οὖν ἀπέβησαν εἰς τὴν γῆν βλέπουσιν ἀνθρακιὰν κειμένην καὶ ὀψάριον ἐπικείμενον καὶ ἄρτον.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/009.yaml
  text: So when they got out onto the land[a], they saw a charcoal fire laid there, and fish lying on it[b], and bread.
translation:
  language: sw
  text: Basi, walipofika nchi kavu[a], wakaona moto wa makaa[b] uliokuwa hapo, na samaki akiwa juu yake, pamoja na mkate.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walipofika ufuoni.” Kigiriki kwa karibu zaidi husema, “walitoka wakaingia nchi kavu.”
    reason: lexical_alternative
  - marker: b
    text: “Moto wa makaa” hutafsiri neno lilelile linalotumiwa pia katika Yohana 18:18, likiunganisha kwa urudiaji wa maneno tukio hili na mazingira ya Petro kumkana Yesu awali.
    reason: cross_reference
lexical_decisions:
- source_word: Ὡς οὖν
  choice: Basi, walipo-
  rationale: “Basi” linaendeleza mtiririko wa simulizi wa οὖν, na muundo wa “walipo-” unaonyesha wakati unaotolewa na ὡς kwa Kiswahili cha kawaida.
- source_word: ἀπέβησαν εἰς τὴν γῆν
  choice: waliposhuka kutoka kwenye mashua na kufika nchi kavu
  rationale: Kitenzi kinamaanisha kutoka chomboni hadi nchi kavu. Kutaja mashua kunafanya tendo hilo lieleweke kwa kawaida katika Kiswahili, huku “nchi kavu” likihifadhi maana ya γῆ kuliko kulifanya kuwa ‘ufukwe’ tu.
- source_word: βλέπουσιν
  choice: wakaona
  rationale: Wakati uliopo wa Kigiriki umetumika kama wakati uliopo wa kisimulizi; wakati uliopita ni wa kawaida na wenye mtiririko mzuri katika simulizi la Kiswahili.
- source_word: ἀνθρακιὰν κειμένην
  choice: moto wa makaa ukiwa umewashwa hapo
  rationale: ἀνθρακιά ni moto wa makaa au makaa yanayowaka. Kiswahili cha kawaida husema moto ‘umewashwa’ badala ya moto ‘umelazwa,’ huku wazo la kuwapo kwake hapo likihifadhiwa.
- source_word: ὀψάριον ἐπικείμενον
  choice: samaki amewekwa juu yake
  rationale: ὀψάριον humaanisha samaki kama chakula katika muktadha huu, na ἐπικείμενον huonyesha kwamba alikuwa juu ya moto wa makaa. Umoja wa neno la Kigiriki umehifadhiwa bila kuongeza kwamba tayari alikuwa ameiva.
- source_word: ἄρτον
  choice: mkate
  rationale: “Mkate” ni tafsiri ya kawaida ya ἄρτος na hailazimishi umbo au kiasi ambacho hakijaelezwa wazi.
theological_decisions:
- issue: Wakati uliopo wa kisimulizi katika βλέπουσιν
  choice: 'Kutafsiri kwa wakati uliopita: “wakaona”'
  alternative: 'Kuhifadhi wakati uliopo wenye uhai: “wanaona”'
  rationale: Hili ni jambo la mtindo wa simulizi, si fundisho la kiteolojia. Wakati uliopita unasikika kwa kawaida katika Kiswahili huku mpangilio wa matukio ukihifadhiwa.
- issue: Kiungo cha kimaandishi cha ἀνθρακιά na Yohana 18:18
  choice: Kutumia “moto wa makaa” na kueleza kiungo hicho katika tanbihi [b]
  alternative: Kutotaja uhusiano huo kwa kuwa haujaelezwa moja kwa moja katika mstari
  rationale: Kurudia neno hilo la pekee kunaweza kuwa muhimu katika simulizi la Petro, lakini tanbihi inaeleza tu uhusiano wa maneno bila kulazimisha hitimisho la kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Tanbihi [a] imewekwa baada ya “nchi kavu,” na [b] inahusu “moto wa makaa” ingawa alama yake imewekwa moja kwa moja baada ya kirai hicho katika toleo la kuchapishwa.
