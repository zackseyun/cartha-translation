  text: λέγει αὐτοῖς ὁ Ἰησοῦς· Δεῦτε ἀριστήσατε. οὐδεὶς ⸀δὲ ἐτόλμα τῶν μαθητῶν ἐξετάσαι αὐτόν· Σὺ τίς εἶ; εἰδότες ὅτι ὁ κύριός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/012.yaml
  text: Jesus said to them[a], “Come, eat breakfast.” But none of the disciples dared to ask him[b], “Who are you?” knowing that it was the Lord.
translation:
  language: sw
  text: Yesu akawaambia, “Njooni mle kifungua kinywa[a].” Lakini hakuna hata mmoja wa wanafunzi aliyethubutu kumwuliza[b], “Wewe ni nani?” wakijua kwamba yeye ndiye Bwana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kitenzi cha Kigiriki kinahusu hasa kula mlo wa asubuhi.
    reason: lexical_alternative
  - marker: b
    text: Kitenzi kilichotafsiriwa “kumwuliza” kinaweza pia kumaanisha “kumhoji” au “kumchunguza kwa makini.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Δεῦτε
  choice: Njooni
  rationale: Ni mwaliko wa moja kwa moja kwa watu wengi; “Njooni” ni ya kawaida na huhifadhi nguvu ya amri-mwaliko.
- source_word: ἀριστήσατε
  choice: mle kifungua kinywa
  rationale: Kitenzi hiki kinahusu kula mlo wa asubuhi, hivyo tafsiri hii huhifadhi umahususi wake badala ya kusema tu “mle.”
- source_word: οὐδεὶς δὲ
  choice: Lakini hakuna hata mmoja
  rationale: δέ inaonyesha mpito wenye utofautishaji mdogo; “Lakini” ni ya kawaida katika muktadha huu, na “hata mmoja” inasisitiza kutokuwapo kwa yeyote.
- source_word: ἐτόλμα
  choice: aliyethubutu
  rationale: Hutoa maana ya kuwa na ujasiri wa kufanya jambo, na inafaa katika muundo unaofuatwa na kitenzi-jina.
- source_word: ἐξετάσαι
  choice: kumwuliza
  rationale: Katika muktadha wa swali la moja kwa moja, maana ya msingi hapa ni kumuuliza; dokezo lake la kumhoji au kumchunguza kwa makini limehifadhiwa katika tanbihi.
- source_word: Σὺ τίς εἶ;
  choice: Wewe ni nani?
  rationale: Kiswahili huweza kutaja kiwakilishi “Wewe” kwa kawaida huku kikihifadhi msisitizo wa Σὺ katika Kigiriki.
- source_word: εἰδότες ὅτι
  choice: wakiwa wanajua kwamba
  rationale: Muundo huu huhifadhi hali ya kishirikishi ya Kigiriki bila kuamua wazi kwamba ujuzi wao ulikuwa sababu pekee ya kutouliza.
- source_word: ὁ κύριός
  choice: Bwana
  rationale: “Bwana” ni tafsiri ya kawaida ya κύριος inapomtaja Yesu na huhifadhi uzito wa kikristo wa utambulisho huo.
theological_decisions:
- issue: Tafsiri ya κύριος inapomtaja Yesu
  choice: Bwana
  alternative: bwana mkubwa
  rationale: “Bwana” ndiyo istilahi ya kawaida, yenye heshima, na huhifadhi uzito wa utambulisho wa Yesu katika simulizi la baada ya ufufuo bila kuongeza ufafanuzi wa kimadhehebu.
- issue: Uhusiano wa εἰδότες na kutothubutu kuuliza
  choice: wakiwa wanajua kwamba
  alternative: kwa sababu walijua kwamba
  rationale: Kishirikishi cha Kigiriki kinaweza kueleweka kuwa cha kimazingira au cha kisababishi. Tafsiri iliyochaguliwa huhifadhi mvutano huo badala ya kulazimisha maana ya sababu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Kifungua kinywa” ni istilahi inayoeleweka kwa upana kwa mlo wa asubuhi; “wakiwa wanajua” huhifadhi muundo na uwezekano wa maana wa kishirikishi cha Kigiriki.
