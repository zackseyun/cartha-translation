base_translation:
  language: en
  yaml_path: translation/nt/john/021/006.yaml
  text: But he said to them[a], “Cast the net on the right side of the boat, and you will find some.” So they cast it, and they were no longer able to haul it in because of the multitude of fish.
translation:
  language: sw
  text: Lakini akawaambia, “Tupeni wavu upande wa kulia wa mashua, nanyi mtapata.”[a] Basi wakautupa, nao hawakuweza tena kuuvuta kwa sababu ya wingi wa samaki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nanyi mtapata samaki”; Kigiriki hakitaji yambwa waziwazi, bali samaki wanaeleweka kutokana na muktadha wa uvuvi.
    reason: lexical_alternative
lexical_decisions:
- source_word: Βάλετε
  choice: Tupeni
  rationale: Amri hii katika muktadha wa uvuvi humaanisha kutupa wavu; ‘tupeni’ ni Kiswahili cha kawaida na chenye nguvu ya amri ya Kigiriki.
- source_word: τὰ δεξιὰ μέρη τοῦ πλοίου
  choice: upande wa kulia wa mashua
  rationale: Hutoa maana ya eneo la kulia la chombo kwa lugha ya kawaida bila kutumia istilahi nzito ya ubaharia.
- source_word: πλοίου
  choice: mashua
  rationale: Katika mazingira ya uvuvi wa Galilaya, ‘mashua’ ni ya asili zaidi kuliko ‘meli’.
- source_word: τὸ δίκτυον
  choice: wavu
  rationale: Neno hili linamaanisha wavu wa kuvulia samaki, katika umoja.
- source_word: εὑρήσετε
  choice: mtapata
  rationale: Kigiriki hakitaji yambwa; Kiswahili kinaweza pia kuacha kinachopatikana kieleweke kutokana na muktadha wa uvuvi.
- source_word: οὐκέτι αὐτὸ ἑλκύσαι ἴσχυον
  choice: hawakuweza tena kuuvuta
  rationale: Huwasilisha kwa kawaida kutokuwa na uwezo au nguvu za kuuvuta wavu; kiambishi ‘-u-’ humrejelea wavu.
- source_word: ἀπὸ τοῦ πλήθους τῶν ἰχθύων
  choice: kwa sababu ya wingi wa samaki
  rationale: Huhifadhi maana ya sababu na ya idadi kubwa bila kuongeza maelezo yasiyokuwamo katika matini.
