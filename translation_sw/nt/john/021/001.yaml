  text: Μετὰ ταῦτα ἐφανέρωσεν ἑαυτὸν πάλιν ⸀ὁ Ἰησοῦς τοῖς μαθηταῖς ἐπὶ τῆς θαλάσσης τῆς Τιβεριάδος· ἐφανέρωσεν δὲ οὕτως.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/001.yaml
  text: After these things[a], Jesus revealed himself again to the disciples by the Sea of Tiberias, and he revealed himself in this way.
translation:
  language: sw
  text: Baada ya mambo hayo, Yesu alijidhihirisha tena kwa wanafunzi kando ya Bahari ya Tiberia; naye alijidhihirisha kwa njia hii.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: Baada ya mambo hayo
  rationale: Inahifadhi wingi wa ταῦτα na mtindo wa mpito wa kisimulizi wa Yohana, huku ikiwa Kiswahili cha kawaida.
- source_word: ἐφανέρωσεν ἑαυτὸν
  choice: alijifunua
  rationale: Kitenzi hiki kinahifadhi nguvu ya kujirejelea na wazo la Yesu kujifanya aonekane au ajulikane; ni pana kuliko kusema tu ‘alitokea’.
- source_word: πάλιν
  choice: tena
  rationale: Huonyesha kwamba huku ni kujifunua kulikofuata matukio ya awali baada ya ufufuo.
- source_word: τοῖς μαθηταῖς
  choice: kwa wanafunzi
  rationale: Haiingizi kimilikishi ‘wake,’ ambacho hakijaelezwa wazi katika Kigiriki.
- source_word: ἐπὶ τῆς θαλάσσης τῆς Τιβεριάδος
  choice: kando ya Bahari ya Tiberia
  rationale: ‘Kando ya’ huwasilisha kwa kawaida mahali panapoonyeshwa na ἐπί pamoja na umilikishi; jina la mahali linafuata namna ya Yohana.
- source_word: ἐφανέρωσεν δὲ οὕτως
  choice: naye alijifunua kwa njia hii
  rationale: Inarudia kitenzi kama Kigiriki kwa mshikamano wa kifasihi, huku οὕτως ikitanguliza namna ya tukio linalofuata.
theological_decisions:
- issue: Lugha ya kutokea kwa Yesu baada ya ufufuo
  choice: alijifunua
  alternative: alitokea; alijidhihirisha
  rationale: ‘Alijifunua’ huhifadhi mkazo wa φανερόω juu ya kujionyesha au kujifanya ajulikane bila kupunguza tukio kuwa mwonekano wa macho tu, wala kulieleza kupita ushahidi wa matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Bahari ya Tiberia’ limetumiwa kama jina maalumu la eneo. Hakuna tanbihi iliyohitajika kwa kuwa ‘alijifunua’ huhifadhi vizuri upana wa kitenzi cha Kigiriki bila kufanya sentensi isiwe ya kawaida.
