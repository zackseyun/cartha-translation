  text: So Jesus said to them[a], “Children, you do not have any fish, do you?” They answered him, “No.”
translation:
  language: sw
  text: Basi Yesu akawaambia[a], “Watoto, hamna samaki, sivyo?” Wakamjibu, “Hapana.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “chakula chochote.” Neno la Kigiriki προσφάγιον hasa hurejelea chakula kinacholiwa pamoja na mkate; katika muktadha huu wa uvuvi huenda likimaanisha samaki.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Basi
  rationale: Kiunganishi cha kawaida cha simulizi kinachoendeleza tukio kwa njia ya asili bila kulazimisha maana nzito ya hitimisho.
- source_word: Παιδία
  choice: Watoto
  rationale: Hifadhi ya namna ya moja kwa moja ya wito wa kirafiki na wenye upendo; mbadala kama ‘marafiki’ ungekuwa wa kufasiri zaidi.
- source_word: μή τι
  choice: hamna ... sivyo?
  rationale: Muundo huu wa swali unadokeza jibu hasi, kama μή katika swali la Kigiriki.
- source_word: προσφάγιον
  choice: samaki wa kula
  rationale: Neno humaanisha chakula kinacholiwa pamoja na mkate; katika mazingira haya ya uvuvi, samaki ndio maana inayowezekana zaidi. ‘Wa kula’ huhifadhi wazo la chakula bila kulifanya neno kuwa samaki tu.
- source_word: ἔχετε
  choice: hamna
  rationale: Kitenzi cha kumiliki kimetolewa kwa kawaida ndani ya swali hasi la Kiswahili.
- source_word: ἀπεκρίθησαν αὐτῷ
  choice: Wakamjibu
  rationale: Ni namna fupi na ya asili ya simulizi ya kusema kwamba walimjibu yeye.
- source_word: Οὔ
  choice: Hamna
  rationale: Jibu fupi hasi linalolingana moja kwa moja na swali la kuwa na samaki.
