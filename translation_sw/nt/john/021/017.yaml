  text: λέγει αὐτῷ τὸ τρίτον· Σίμων ⸀Ἰωάννου, φιλεῖς με; ἐλυπήθη ὁ Πέτρος ὅτι εἶπεν αὐτῷ τὸ τρίτον· Φιλεῖς με; καὶ ⸀εἶπεν αὐτῷ· Κύριε, ⸂πάντα σὺ⸃ οἶδας, σὺ γινώσκεις ὅτι φιλῶ σε. λέγει αὐτῷ ⸀ὁ Ἰησοῦς· Βόσκε τὰ ⸀πρόβατά μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/017.yaml
  text: He said to him the third time[a], “Simon, son of John, do you love me?” Peter was grieved because he said to him the third time, “Do you love me?” And he said to him, “Lord, you know all things; you know that I love you.” Jesus said to him[b], “Feed my sheep.”
translation:
  language: sw
  text: Akamwambia mara ya tatu[a], “Simoni, mwana wa Yohana, unanipenda?” Petro alihuzunika kwa sababu Yesu alimwuliza mara ya tatu, “Unanipenda?” Akamjibu, “Bwana, wewe unajua mambo yote; wewe unajua kwamba ninakupenda.”[b] Yesu akamwambia, “Lisha kondoo wangu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hapa Kigiriki kinatumia φιλέω (‘kupenda, kuwa na mapenzi kwa’), ilhali katika maswali mawili ya kwanza Yesu alikuwa ametumia ἀγαπάω. Baadhi ya wafafanuzi huona tofauti yenye maana; wengine huona vitenzi hivyo vina maana zinazoingiliana katika muktadha huu. Tafsiri imetumia ‘kupenda’ bila kulazimisha tofauti kali kuliko ile ambayo Kigiriki kinaonyesha kwa uhakika.
    reason: lexical_alternative
  - marker: b
    text: 'Katika jibu la Petro, Kigiriki kinatumia vitenzi viwili vya ‘kujua’: οἶδα na γινώσκω. Kiswahili cha kawaida hutumia ‘kujua’ kwa vyote hapa. Huenda marudio hayo yakadokeza tofauti fulani, lakini si tofauti inayoweza kuonyeshwa kwa kawaida bila kufasiri kupita kiasi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ τρίτον
  choice: mara ya tatu
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha kwamba swali hili lilirudiwa kwa mara ya tatu.
- source_word: Σίμων Ἰωάννου
  choice: Simoni, mwana wa Yohana
  rationale: Nomino Ἰωάννου iko katika hali ya umilikaji na hapa inaeleweka kiasili kama jina la baba; usomaji huu unasema Yohana, si Yona.
- source_word: φιλεῖς / φιλῶ
  choice: unanipenda / ninakupenda
  rationale: Kitenzi φιλέω huonyesha upendo au mapenzi. ‘Kupenda’ ni cha asili na chenye uzito unaofaa katika Kiswahili, bila kulazimisha tofauti kali na ἀγαπάω iliyotumiwa mapema katika mazungumzo.
- source_word: ἐλυπήθη
  choice: alihuzunika
  rationale: Neno hili linaonyesha huzuni au maumivu ya moyo; ‘alihuzunika’ ni wazi, la kawaida, na linafaa kwa uzito wa tukio.
- source_word: Κύριε
  choice: Bwana
  rationale: Katika muktadha wa Petro akizungumza na Yesu aliyefufuka, ‘Bwana’ huhifadhi uzito wa προσφώνηση hii kuliko salamu ya heshima tu.
- source_word: πάντα σὺ οἶδας
  choice: wewe unajua mambo yote
  rationale: Huhifadhi upana wa πάντα na msisitizo wa kiwakilishi σὺ kwa Kiswahili cha asili.
- source_word: οἶδας ... γινώσκεις
  choice: unajua ... unajua
  rationale: Vitenzi vyote viwili vinahusu kujua. Kutumia kitenzi kilekile katika Kiswahili huhifadhi marudio bila kubuni tofauti ya maana isiyo hakika.
- source_word: Βόσκε
  choice: Lisha
  rationale: βόσκω humaanisha hasa kulisha au kuwapa malisho, hivyo ‘Lisha’ huhifadhi umahususi wake.
- source_word: πρόβατά
  choice: kondoo
  rationale: πρόβατα ni kondoo, si hasa wana-kondoo; uchaguzi huu pia huhifadhi tofauti na ἀρνία katika mstari wa 15.
theological_decisions:
- issue: Ikiwa tofauti kali kati ya φιλέω na ἀγαπάω ionyeshwe katika mazungumzo ya Yesu na Petro
  choice: Kutumia ‘kupenda’ bila kutaja aina tofauti ya upendo katika maandishi makuu
  alternative: Kutofautisha kwa maneno kama ‘kupenda’ na ‘kuwa na mapenzi kwa’
  rationale: Katika Kigiriki cha Koine, maana za vitenzi hivi zinaweza kuingiliana, na haijathibitika kwamba tofauti hiyo imekusudiwa kuwa ya kiteolojia hapa. Tanbihi inadumisha uwezekano wa tofauti bila kuufanya kuwa uamuzi wa tafsiri.
- issue: Nguvu ya ungamo la Petro, πάντα σὺ οἶδας
  choice: ‘wewe unajua mambo yote’
  alternative: Kulipunguza kuwa ‘wewe unajua kila kitu kuhusu jambo hili’ au kulipanua kwa maelezo ya wazi ya fundisho la kujua yote
  rationale: Kigiriki kinasema kwa upana ‘mambo yote.’ Tafsiri inahifadhi dai hilo lenye nguvu bila kulipunguza wala kuliongezea ufafanuzi wa kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Mtindo wa masimulizi umetumia mfuatano wa ‘aka-’, huku majina ya wahusika yakitajwa pale inaposaidia kuzuia utata wa kiima. Lugha ya kichungaji ya ‘Lisha kondoo wangu’ imehifadhiwa moja kwa moja.
