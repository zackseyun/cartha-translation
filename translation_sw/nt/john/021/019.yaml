  text: τοῦτο δὲ εἶπεν σημαίνων ποίῳ θανάτῳ δοξάσει τὸν θεόν. καὶ τοῦτο εἰπὼν λέγει αὐτῷ· Ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/019.yaml
  text: He said this to indicate by what kind of death he would glorify God[a]. And after saying this, he says to him[b], “Follow me.”
translation:
  language: sw
  text: Alisema hayo kuonyesha ni kwa kifo cha namna gani angempa Mungu utukufu[a]. Baada ya kusema hayo, anamwambia[b], “Nifuate.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa aina gani ya kifo.”
    reason: lexical_alternative
  - marker: b
    text: 'Kigiriki kinatumia wakati uliopo wa kihistoria: “anamwambia.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: σημαίνων
  choice: kuonyesha
  rationale: Kitenzi hiki kinaeleza kwamba maneno ya Yesu yalidokeza au kuweka wazi kwa njia isiyo ya moja kwa moja; “kuonyesha” ni Kiswahili cha kawaida na wazi.
- source_word: ποίῳ θανάτῳ
  choice: kwa kifo cha namna gani
  rationale: Huhifadhi maana ya sifa au namna ya kifo, si kutaja kifo kwa ujumla tu.
- source_word: δοξάσει τὸν θεόν
  choice: angempa Mungu utukufu
  rationale: Huhifadhi maana ya wakati ujao ndani ya taarifa inayosimuliwa baada ya kitenzi cha wakati uliopita, kwa Kiswahili cha asili.
- source_word: καὶ τοῦτο εἰπὼν
  choice: Baada ya kusema hayo
  rationale: Huwasilisha kwa kawaida uhusiano wa wakati uliomo katika kishiriki cha aoristi.
- source_word: λέγει αὐτῷ
  choice: anamwambia
  rationale: Huhifadhi wakati uliopo wa kihistoria wa Kigiriki na mtindo hai wa simulizi ya Yohana.
- source_word: Ἀκολούθει μοι
  choice: Nifuate
  rationale: Ni amri ya kawaida na ya moja kwa moja inayoweza kubeba wito wa papo hapo pamoja na ufuasi unaoendelea.
theological_decisions:
- issue: Maana ya kumpa Mungu utukufu kupitia kifo cha Petro
  choice: 'Maneno yanaachwa bila ufafanuzi wa ziada: kifo chake kingempa Mungu utukufu.'
  alternative: Kueleza wazi kwamba ushahidi wa uaminifu katika kuuawa kwake ndio ungemtukuza Mungu.
  rationale: Aya haisemi wazi utaratibu ambao kifo hicho kingempa Mungu utukufu; tafsiri inahifadhi uzito na mvutano huo bila kuingiza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. “Hayo” limetumiwa kurejelea maneno yaliyotangulia; wakati uliopo wa kihistoria umehifadhiwa katika “anamwambia.”
