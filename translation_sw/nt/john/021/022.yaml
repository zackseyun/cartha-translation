base_translation:
  language: en
  yaml_path: translation/nt/john/021/022.yaml
  text: Jesus said to him[a], “If I want him to remain until I come[b], what is that to you? You follow me.”
translation:
  language: sw
  text: Yesu akamwambia, “Nikitaka yeye abaki mpaka nitakapokuja[a], hilo linakuhusu nini? Wewe nifuate.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maneno “mpaka nitakapokuja” yameachwa wazi kwa makusudi; kuna maoni tofauti kuhusu kama yanarejelea kuja kwa Yesu katika tukio fulani la kihistoria au kuja kwake kwa mwisho.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: Yesu akamwambia
  rationale: Kauli ya Kigiriki ya wakati uliopo wa kisimulizi imetafsiriwa kwa wakati wa simulizi unaotumika kwa kawaida katika Kiswahili.
- source_word: Ἐὰν
  choice: Niki-
  rationale: Kiambishi cha masharti katika “nikitaka” kinawasilisha sharti la Kigiriki kwa Kiswahili cha asili.
- source_word: θέλω
  choice: nataka
  rationale: “Kutaka” huwasilisha maana ya hamu au nia bila kuifanya kauli kuwa amri au uamuzi usiobadilika.
- source_word: μένειν
  choice: abaki
  rationale: “Kubaki” huhifadhi maana ya jumla ya μένω bila kuifasiri moja kwa moja kuwa ‘aendelee kuishi.’
- source_word: ἕως ἔρχομαι
  choice: mpaka nitakapokuja
  rationale: Tafsiri hii ni ya kawaida katika Kiswahili na haiamui kuja huko kunarejelea tukio gani.
- source_word: τί πρὸς σέ;
  choice: hilo linakuhusu nini?
  rationale: Hii ni njia ya asili na ya moja kwa moja ya kuonyesha kwamba jambo hilo si jukumu la Petro.
- source_word: σύ μοι ἀκολούθει
  choice: Wewe nifuate
  rationale: “Wewe” huhifadhi msisitizo wa kiwakilishi cha Kigiriki na kukitofautisha na “yeye”; “nifuate” ni amri ya kawaida yenye maana endelevu inayotokana na muktadha.
theological_decisions:
- issue: Maana ya kuja kwa Yesu katika ἕως ἔρχομαι
  choice: Imetafsiriwa kwa ujumla kuwa “mpaka nitakapokuja.”
  alternative: Kuifafanua kuwa kuja katika tukio la kihistoria, hukumu, au kuja kwake kwa mwisho.
  rationale: Mstari wenyewe hautaji wazi kuja huku ni tukio gani; tafsiri inalinda utata huo badala ya kuutatua kidhehebu.
- issue: Maana ya kubaki kwa mwanafunzi huyo
  choice: “abaki”
  alternative: “aendelee kuishi”
  rationale: Neno la Kigiriki linaweza kudokeza kuendelea kuishi katika muktadha, lakini halisemi hivyo moja kwa moja; “abaki” huepuka kuongeza ufafanuzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “Nikitaka yeye abaki” umetumiwa ili kuweka “yeye” wazi na kuhifadhi tofauti yenye msisitizo kati yake na “Wewe.”
