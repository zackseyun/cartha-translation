  text: Πρωΐας δὲ ἤδη ⸀γενομένης ⸀ἔστη Ἰησοῦς εἰς τὸν αἰγιαλόν· οὐ μέντοι ᾔδεισαν οἱ μαθηταὶ ὅτι Ἰησοῦς ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/004.yaml
  text: When daybreak had already come[a], Jesus stood on the shore; yet the disciples did not know that it was Jesus.
translation:
  language: sw
  text: Mapambazuko yalipokuwa tayari yamefika, Yesu akasimama ufuoni; lakini wanafunzi hawakujua[a] kwamba alikuwa Yesu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hawakutambua kwamba alikuwa Yesu.” Kigiriki hutumia neno linalomaanisha “kujua.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρωΐας δὲ ἤδη γενομένης
  choice: Kulipopambazuka
  rationale: Kirai huru cha umilikishi kinaonyesha wakati. Kitenzi ‘kulipopambazuka’ ni cha kawaida katika Kiswahili na kinaeleza kuingia kwa mapambazuko; muktadha wake tayari una wazo la ἤδη bila kulazimisha usemi mzito kama ‘mapambazuko yalipokuwa tayari yamefika.’ δέ ni kiunganishi hafifu cha masimulizi na hakihitaji neno tofauti hapa.
- source_word: ἔστη
  choice: akasimama
  rationale: Wakati uliopita wa ἵστημι unaelezwa kama tukio la masimulizi. ‘Akasimama’ ni ya kawaida na huendeleza simulizi bila kuongeza maana ya kuwasili.
- source_word: εἰς τὸν αἰγιαλόν
  choice: ufuoni
  rationale: Pamoja na kitenzi cha kusimama, εἰς inaweza kuonyesha mahali. ‘Ufuoni’ hutoa kwa ufupi maana ya αἰγιαλός, yaani kandokando ya maji.
- source_word: οὐ μέντοι
  choice: lakini ... hawaku-
  rationale: Muundo huu unaonyesha tofauti kati ya kuwapo kwa Yesu na kutotambuliwa kwake. ‘Lakini’ pamoja na ukanushi wa kitenzi ni muundo wa kawaida wa Kiswahili.
- source_word: ᾔδεισαν
  choice: hawakujua
  rationale: Neno la Kigiriki ni οἶδα, ‘kujua.’ Tafsiri hii inalinda usemi halisi wa chanzo, ingawa katika muktadha inaweza kumaanisha kutomtambua.
- source_word: οἱ μαθηταὶ
  choice: wanafunzi
  rationale: Kundi linalojulikana linadhihirika katika muktadha; Kiswahili hakihitaji kibainishi wala kimilikishi kilichoongezwa.
- source_word: ὅτι Ἰησοῦς ἐστιν
  choice: kwamba alikuwa Yesu
  rationale: Huu ni usemi wa kawaida wa Kiswahili wa kumtambulisha mtu katika masimulizi ya wakati uliopita, bila kuongeza kwamba Yesu alikuwa mahali fulani.
theological_decisions:
- issue: Kutotambuliwa kwa Yesu baada ya kufufuka
  choice: hawakujua kwamba alikuwa Yesu
  alternative: hawakutambua kwamba alikuwa Yesu
  rationale: Aya inasema kwamba wanafunzi hawakujua, lakini haielezi sababu. Tafsiri inahifadhi upana wa οἶδα na haiongezi maelezo ya kiteolojia kuhusu sura ya Yesu au uwezo wa wanafunzi kumwona.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa kawaida kwa msomaji wa jumla; ‘ufuoni’ huepuka usemi mrefu, na tanbihi huhifadhi tofauti kati ya ‘kujua’ na ‘kutambua.’
