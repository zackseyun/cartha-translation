id: JHN.21.7
reference: John 21:7
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: λέγει οὖν ὁ μαθητὴς ἐκεῖνος ὃν ἠγάπα ὁ Ἰησοῦς τῷ Πέτρῳ· Ὁ κύριός ἐστιν. Σίμων οὖν Πέτρος, ἀκούσας ὅτι ὁ κύριός ἐστιν, τὸν ἐπενδύτην διεζώσατο, ἦν γὰρ γυμνός, καὶ ἔβαλεν ἑαυτὸν εἰς τὴν θάλασσαν·
base_translation:
  language: en
  yaml_path: translation/nt/john/021/007.yaml
  text: So that disciple whom Jesus loved said to Peter[a], “It is the Lord.” Therefore, when Simon Peter heard that it was the Lord, he tied his outer garment around himself (for he was lightly clothed) and threw himself into the sea.
translation:
  language: sw
  text: Basi yule mwanafunzi ambaye Yesu alimpenda akamwambia Petro, “Ni Bwana!” Simoni Petro aliposikia kwamba ni Bwana, akajifunga vazi lake la nje kiunoni—kwa maana hakuwa amevaa nguo za kutosha[a]—kisha akajitupa baharini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alikuwa uchi.” Neno la Kigiriki γυμνός linaweza kumaanisha kuwa uchi kabisa au kutovaa nguo za kutosha, kutegemea muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει οὖν
  choice: Basi ... akamwambia
  rationale: “Basi” linaonyesha mwendelezo na hitimisho la simulizi kwa Kiswahili cha kawaida; “akamwambia” linafikisha kitendo cha kusema kwa Petro.
- source_word: ὁ μαθητὴς ἐκεῖνος ὃν ἠγάπα ὁ Ἰησοῦς
  choice: yule mwanafunzi ambaye Yesu alimpenda
  rationale: “Yule” linahifadhi nguvu ya kiashiria ἐκεῖνος, na kauli nzima inadumisha jina bainifu la Kiyohana.
- source_word: Ὁ κύριός ἐστιν
  choice: Ni Bwana!
  rationale: “Bwana” huhifadhi maana ya kawaida na uzito wa kimasiha wa κύριος; muundo “Ni Bwana” ni wa asili katika Kiswahili.
- source_word: Σίμων οὖν Πέτρος, ἀκούσας
  choice: Simoni Petro aliposikia
  rationale: Kishiriki cha aoristi ἀκούσας kimetafsiriwa kama kishazi cha wakati; mwendelezo wa οὖν unabebwa kwa mtiririko wa vitenzi vya simulizi.
- source_word: τὸν ἐπενδύτην
  choice: vazi lake la nje
  rationale: Hili linaonyesha vazi la kuvaliwa juu bila kulifanya kwa uhakika kuwa koti, kanzu, au vazi maalumu la mvuvi.
- source_word: διεζώσατο
  choice: akajifunga ... kiunoni
  rationale: Linahifadhi maana ya kujizungushia na kufunga vazi pamoja na hali ya kati ya kitenzi.
- source_word: ἦν γὰρ γυμνός
  choice: kwa maana hakuwa amevaa nguo za kutosha
  rationale: γυμνός inaweza kumaanisha kuwa uchi au kutovaa nguo za kutosha. Katika mazingira ya kazi ndani ya mashua, tafsiri hii ni ya asili huku maana halisi ya “uchi” ikihifadhiwa katika tanbihi.
- source_word: ἔβαλεν ἑαυτὸν εἰς τὴν θάλασσαν
  choice: akajitupa baharini
  rationale: “Akajitupa” linahifadhi nguvu na uhai wa βάλλω pamoja na kiwakilishi rejeshi; “baharini” linafuata θάλασσα katika matumizi ya kifungu hiki.
theological_decisions:
- issue: Tafsiri ya κύριος katika kumtambua Yesu
  choice: Bwana
  alternative: Mwalimu Mkuu
  rationale: “Bwana” huhifadhi cheo cha kawaida na uzito wake wa Kikristo katika tukio la kumtambua Yesu aliyefufuka bila kuongeza maelezo ya kiteolojia.
- issue: Maana ya γυμνός kuhusu hali ya Petro
  choice: hakuwa amevaa nguo za kutosha
  alternative: alikuwa uchi
  rationale: Chanzo kinaruhusu maana zote mbili kulingana na muktadha. Maana ya kutovaa nguo za kutosha inafaa mazingira ya uvuvi, lakini uwezekano wa maana halisi umehifadhiwa wazi katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mtiririko wa simulizi umetolewa kwa vitenzi vya mfululizo; alama ya mshangao katika “Ni Bwana!” inaonyesha utambuzi wa ghafla bila kuongeza maudhui.
