  yaml_path: translation/nt/john/021/008.yaml
  text: But the other disciples came in the small boat[a], for they were not far from the land, but about two hundred cubits away[c][b], dragging the net of fish.
translation:
  language: sw
  text: Lakini wanafunzi wengine walikuja kwa mashua ndogo, kwa maana hawakuwa mbali na nchi kavu[b], bali walikuwa umbali wa karibu dhiraa mia mbili[a] kutoka nchi kavu, huku wakikokota wavu wenye samaki[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dhiraa mia mbili ni takriban mita 90.
    reason: cultural_note
  - marker: b
    text: Au, “ufuo.”
    reason: lexical_alternative
  - marker: c
    text: Kihalisi zaidi, “wavu wa samaki.” Maneno ya Kigiriki huenda yakamaanisha wavu uliokuwa na samaki ndani yake.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ἄλλοι μαθηταὶ
  choice: Lakini wanafunzi wengine
  rationale: Neno δέ linaonyesha tofauti na tendo la Petro katika mstari uliotangulia; “lakini” linaweka tofauti hiyo wazi kwa Kiswahili cha kawaida.
- source_word: τῷ πλοιαρίῳ
  choice: ndani ya mashua ndogo
  rationale: πλοιάριον ni umbo la udogo la neno la mashua; “mashua ndogo” linahifadhi maana hiyo, na “ndani ya” linaonyesha walitumia mashua hiyo kufika.
- source_word: ἦλθον
  choice: walikuja
  rationale: Kitenzi hiki katika simulizi kinaeleza mwendo wao kuja mahali Yesu alipokuwa.
- source_word: οὐ γὰρ ἦσαν μακρὰν ἀπὸ τῆς γῆς
  choice: kwa maana hawakuwa mbali na nchi kavu
  rationale: γάρ linatoa sababu, na γῆ hapa ni nchi kavu iliyo kinyume na maji, ingawa kimuktadha inaweza kuitwa ufuo.
- source_word: ἀλλὰ ὡς ἀπὸ πηχῶν διακοσίων
  choice: bali walikuwa karibu dhiraa mia mbili kutoka huko
  rationale: ὡς linaonyesha makadirio. Kipimo cha kale “dhiraa” kinahifadhi mazingira ya chanzo, huku tanbihi ikitoa makadirio ya kisasa.
- source_word: σύροντες
  choice: huku wakikokota
  rationale: Kauli ya wakati uliopo inaonyesha tendo lililoendelea wakati walipokuwa wakija; “kukokota” linafaa kwa kuvuta wavu mzito majini.
- source_word: τὸ δίκτυον τῶν ἰχθύων
  choice: wavu wenye samaki
  rationale: Uhusiano wa umilikishi katika Kigiriki unaeleweka kwa kawaida kuwa wa yaliyomo ndani ya wavu. “Wavu wenye samaki” ni Kiswahili cha asili bila kuongeza kwamba ulikuwa umejaa.
