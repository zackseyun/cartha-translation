source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω σοι, ὅτε ἦς νεώτερος, ἐζώννυες σεαυτὸν καὶ περιεπάτεις ὅπου ἤθελες· ὅταν δὲ γηράσῃς, ἐκτενεῖς τὰς χεῖράς σου, καὶ ἄλλος ⸂σε ζώσει⸃ καὶ οἴσει ὅπου οὐ θέλεις.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/018.yaml
  text: Truly[a], truly, I say to you, when you were younger, you used to dress yourself and walk where you wanted; but when you grow old, you will stretch out your hands[c][b], and another will dress you and carry you where you do not want to go.
translation:
  language: sw
  text: '“Amin, amin, ninakuambia: Ulipokuwa kijana, ulikuwa ukijifunga mwenyewe[a] na kwenda kokote ulipotaka. Lakini utakapokuwa mzee, utanyosha mikono yako[b], na mtu mwingine atakufunga na kukupeleka[c] usikotaka kwenda.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ulikuwa ukijifunga mshipi mwenyewe.” Kitenzi cha Kigiriki humaanisha hasa kufunga au kukaza nguo mwilini; hapa Petro kujifunga mwenyewe kunatofautishwa na kufungwa na mtu mwingine baadaye.
    reason: lexical_alternative
  - marker: b
    text: Maneno “utanyosha mikono yako” mara nyingi hueleweka kuwa dokezo la kifo cha Petro kwa kusulubiwa. Mstari unaofuata unaeleza kwamba Yesu alisema hayo kuonyesha aina ya kifo ambacho Petro angempa Mungu utukufu.
    reason: cross_reference
  - marker: c
    text: Au “kukuchukua” au “kukubeba.” Kitenzi cha Kigiriki kinaweza kumaanisha kubebwa au kuchukuliwa mpaka mahali ambako mtu hataki kwenda.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: Amin, amin
  rationale: Inahifadhi urudiaji wenye msisitizo na uzito wa kauli maalumu ya Yesu katika Yohana; “Amin” linaeleweka katika Kiswahili cha Biblia bila kufuta ladha ya asili.
- source_word: λέγω σοι
  choice: ninakuambia
  rationale: Ni Kiswahili cha kawaida na cha moja kwa moja kinachohifadhi usemi unaomlenga Petro binafsi.
- source_word: ὅτε ἦς νεώτερος
  choice: ulipokuwa kijana
  rationale: Hutoa kwa Kiswahili cha kawaida maana ya umri wa awali unaotofautishwa na uzee unaotajwa baadaye; tafsiri ya neno kwa neno “mdogo zaidi” ingekuwa nzito bila kitu cha kulinganishwa kilichotajwa wazi.
- source_word: ἐζώννυες σεαυτόν
  choice: ulikuwa ukijifunga nguo mwenyewe
  rationale: Kitenzi kinamaanisha kujifunga au kujikaza nguo. Muundo wa mazoea “ulikuwa uki-” unaonyesha tendo la zamani lililorudiwa, na “mwenyewe” huhifadhi tofauti kati ya uhuru wake wa awali na utegemezi wa baadaye.
- source_word: περιεπάτεις ὅπου ἤθελες
  choice: na kwenda kokote ulipotaka
  rationale: Katika muktadha huu περιπατέω ni kwenda au kutembea kwa kawaida, si mwenendo wa kimaadili. “Kwenda kokote” ni ya asili na huonyesha uhuru wa Petro.
- source_word: ὅταν δὲ γηράσῃς
  choice: Lakini utakapokuwa mzee
  rationale: Muundo huu unaonyesha wakati ujao kwa kawaida katika Kiswahili, huku “Lakini” ikihifadhi utofautishaji wa δέ.
- source_word: ἐκτενεῖς τὰς χεῖράς σου
  choice: utanyosha mikono yako
  rationale: Ni tafsiri ya moja kwa moja inayohifadhi picha bila kuitafsiri wazi kuwa kusulubiwa ndani ya mstari wenyewe.
- source_word: ἄλλος σε ζώσει
  choice: mtu mwingine atakufunga nguo
  rationale: Huhifadhi ulinganifu wa kitenzi kilekile cha kujifunga nguo kilichotumiwa awali na tofauti kati ya kujitendea mwenyewe na kutendewa na mwingine.
- source_word: οἴσει
  choice: kukupeleka
  rationale: Ingawa kitenzi kinaweza kumaanisha kubeba au kuchukua, “kukupeleka” hutoa kwa Kiswahili cha asili wazo la kuondoshwa kuelekea mahali pasipotakiwa bila kuamua kwa kupita kiasi namna halisi ya tendo hilo.
- source_word: ὅπου οὐ θέλεις
  choice: usikotaka kwenda
  rationale: “Kwenda” linaongezwa kama kitenzi kinachodokezwa ili sentensi iwe wazi na ya kawaida katika Kiswahili, bila kubadili maana ya mahali pasipotakiwa.
theological_decisions:
- issue: Ikiwa maneno haya yataelezwa wazi katika mstari wenyewe kuwa unabii wa kusulubiwa kwa Petro
  choice: Kuhifadhi taswira halisi na isiyoelezwa moja kwa moja katika matini kuu
  alternative: Kutafsiri “utanyosha mikono yako” na kufungwa au kupelekwa kama taarifa ya wazi kwamba Petro atasulubiwa
  rationale: Mstari unaofuata ndio unaoeleza kwamba Yesu alisema hayo kuonyesha aina ya kifo ambacho Petro angempa Mungu utukufu. Kuhifadhi taswira hapa kunaacha simulizi lenyewe litoe ufafanuzi huo kwa mpangilio wake na hakufuti mvutano wa maneno ya Yesu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya usomaji wa Maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi umehifadhi urudiaji, utofautishaji, na taswira za Kigiriki bila kuingiza ufafanuzi wa mstari unaofuata ndani ya matini kuu.
