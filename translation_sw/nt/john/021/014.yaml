  text: This was now the third time Jesus was revealed to the disciples after he had been raised from the dead[a].
translation:
  language: sw
  text: Hii ilikuwa tayari mara ya tatu Yesu alipofunuliwa kwa wanafunzi, baada ya kufufuliwa kutoka kwa wafu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Hii ilikuwa tayari mara ya tatu Yesu alipojitokeza kwa wanafunzi, baada ya kufufuliwa kutoka kwa wafu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: Hii
  rationale: Kiwakilishi hiki kinarejelea tukio la kujifunua lililosimuliwa mara tu kabla yake; “Hii” ni ya kawaida na huhifadhi rejeo hilo.
- source_word: ἤδη
  choice: sasa
  rationale: Neno hili linaonyesha kwamba idadi ya matukio imefikia hatua hii katika simulizi.
- source_word: τρίτον
  choice: mara ya tatu
  rationale: Hapa neno la mp क्रम? ordinal limetumiwa kielezi; “mara ya tatu” ndiyo usemi wa kawaida wa Kiswahili.
- source_word: ἐφανερώθη
  choice: alipofunuliwa
  rationale: Huhifadhi hali ya kutendwa ya kitenzi φανερόω na msamiati wa Yohana; “alipojitokeza” ni tafsiri mbadala inayowezekana katika muktadha.
- source_word: ὁ Ἰησοῦς
  choice: Yesu
  rationale: Jina maalumu lenye kibainishi katika Kigiriki hutafsiriwa kwa kawaida kama “Yesu.”
- source_word: τοῖς μαθηταῖς
  choice: kwa wanafunzi
  rationale: Hufuata Kigiriki, ambacho hakisemi wazi “wanafunzi wake,” ingawa hilo linaeleweka kutokana na muktadha.
- source_word: ἐγερθεὶς
  choice: baada ya kufufuliwa
  rationale: Hueleza tendo lililotangulia tendo kuu na kuhifadhi hali ya kutendwa ya kitenzi cha Kigiriki.
- source_word: ἐκ νεκρῶν
  choice: kutoka kwa wafu
  rationale: Ni usemi wa kawaida wa kibiblia wa kueleza ufufuo, huku ukihifadhi dhana ya kutoka miongoni mwa waliokufa.
theological_decisions:
- issue: Tafsiri ya lugha ya ufufuo katika ἐγερθεὶς ἐκ νεκρῶν
  choice: baada ya kufufuliwa kutoka kwa wafu
  alternative: baada ya kufufuka kutoka kwa wafu
  rationale: Kirai cha Kigiriki kiko katika hali ya kutendwa, kwa hiyo matini kuu inahifadhi hali hiyo badala ya kukibadili kuwa kitenzi kisicho na mtendaji cha “kufufuka.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo “alipofunuliwa” umechaguliwa ili kuhifadhi hali ya kutendwa, ingawa “alipojitokeza” ni wa kawaida zaidi na umetolewa katika tanbihi.
