base_translation:
  language: en
  yaml_path: translation/nt/john/021/016.yaml
  text: He said to him again a second time[a], “Simon, son of John, do you love me?” He said to him, “Yes, Lord; you know that I love you.” He said to him[b], “Shepherd my sheep.”
translation:
  language: sw
  text: Akamwambia tena kwa mara ya pili, “Simoni, mwana wa Yohana, je, unanipenda?” Akamjibu, “Ndiyo, Bwana; wewe unajua kwamba ninakupenda.”[a] Akamwambia, “Chunga kondoo wangu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika Kigiriki, Yesu anauliza kwa kitenzi agapaō, lakini Petro anajibu kwa kitenzi phileō. Baadhi ya wafafanuzi huona tofauti ya maana; wengine huona kuwa ni ubadilishaji wa kimtindo. Matini kuu imetumia ‘penda’ kwa vitenzi vyote viwili ili isizidishe tofauti hiyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν δεύτερον
  choice: tena kwa mara ya pili
  rationale: Maneno yote mawili yanaonyesha kurudiwa kwa swali na kwamba hii ni mara ya pili. Tafsiri hii inahifadhi msisitizo wa Kigiriki ingawa ina uradidi wa kimakusudi.
- source_word: Σίμων Ἰωάννου
  choice: Simoni, mwana wa Yohana
  rationale: Huu ni usemi wa kumtambulisha Simoni kwa jina la baba yake. Ἰωάννου ni ‘Yohana,’ si ‘Yona,’ katika matini hii.
- source_word: ἀγαπᾷς / φιλῶ
  choice: unanipenda / ninakupenda
  rationale: Vitenzi vyote viwili vinaweza kutafsiriwa kwa kawaida kuwa ‘penda’ katika muktadha huu. Kutumia vitenzi tofauti katika matini kuu kungeweza kulazimisha tofauti ya maana ambayo haiko wazi; tofauti ya maneno imeonyeshwa katika tanbihi.
- source_word: Ναί, κύριε
  choice: Ndiyo, Bwana
  rationale: ‘Ndiyo’ ni jibu la kawaida la kukubali, na ‘Bwana’ linafaa kwa namna Petro anavyomwita Yesu katika Injili ya Yohana.
- source_word: σὺ οἶδας
  choice: wewe unajua
  rationale: Kiwakilishi cha wazi σὺ kinaongeza mkazo mdogo; ‘wewe unajua’ kinauhifadhi kwa Kiswahili cha kawaida.
- source_word: Ποίμαινε
  choice: Chunga
  rationale: Kitenzi hiki kinahusu kazi ya mchungaji ya kulinda, kuongoza, na kutunza; ‘chunga’ kinahifadhi taswira hiyo.
- source_word: τὰ πρόβατά μου
  choice: kondoo wangu
  rationale: Tafsiri halisi inahifadhi taswira ya kichungaji na kuonyesha kwamba kondoo ni wa Yesu.
theological_decisions:
- issue: Iwapo ἀγαπάω na φιλέω zitafsiriwe kwa vitenzi tofauti
  choice: Zote zimetafsiriwa kwa kitenzi ‘penda’ katika matini kuu, huku tofauti ya Kigiriki ikielezwa katika tanbihi.
  alternative: Kutafsiri ἀγαπάω kuwa ‘penda’ na φιλέω kuwa ‘kuwa na upendo wa kirafiki’ au ‘penda kwa urafiki.’
  rationale: Kuna tofauti halisi ya msamiati, lakini matumizi ya Yohana yanaonyesha kuwa vitenzi hivi vinaweza kuingiliana kimaana. Kutenganisha maana zake kwa nguvu kungeingiza ufafanuzi wa kisaikolojia au kiteolojia usiothibitishwa wazi na mstari huu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Uradidi katika ‘tena kwa mara ya pili’ umehifadhiwa kwa sababu unatokana moja kwa moja na πάλιν δεύτερον. ‘Chunga kondoo wangu’ huhifadhi sitiari ya mchungaji bila kuibadili kuwa maelezo ya kitaasisi.
