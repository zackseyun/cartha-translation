base_translation:
  language: en
  yaml_path: translation/nt/john/021/015.yaml
  text: So when they had eaten breakfast[a], Jesus said to Simon Peter, “Simon, son of John, do you love me more than these?” He said to him, “Yes, Lord; you know that I love you.” He said to him[b], “Feed my lambs.”
translation:
  language: sw
  text: Basi, walipokwisha kula kifungua kinywa, Yesu akamwambia Simoni Petro, “Simoni mwana wa Yohana, je, unanipenda kuliko hawa?[b]” Akamjibu, “Ndiyo, Bwana; wewe unajua kwamba ninakupenda.[a]” Yesu akamwambia, “Walishe wana-kondoo wangu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yesu anatumia kitenzi cha Kigiriki ἀγαπάω (“penda”), naye Petro anajibu kwa φιλέω (“penda, kuwa na upendo wa kirafiki”). Wafafanuzi fulani huona tofauti ya maana; wengine huona ni utofauti wa kimtindo. Matini imetumia “penda” kwa vyote viwili ili isitie mkazo usio wazi katika muktadha.
    reason: lexical_alternative
  - marker: b
    text: 'Kigiriki kina usemi usiofafanua wazi ulinganisho: unaweza kumaanisha “kuliko watu hawa wanavyonipenda,” “kuliko unavyowapenda watu hawa,” au “kuliko unavyovipenda vitu hivi.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἠρίστησαν
  choice: walipokwisha kula kifungua kinywa
  rationale: Kitenzi ἀριστάω kinarejelea kula mlo wa asubuhi; usemi huu ni wa kawaida katika Kiswahili na unahifadhi uhusiano wa wakati.
- source_word: Σίμων Ἰωάννου
  choice: Simoni mwana wa Yohana
  rationale: Hali ya umilikishi Ἰωάννου hapa ni jina la baba; tafsiri hii inafuata moja kwa moja maandishi ya Kigiriki bila kuingiza namna tofauti ya kimapokeo.
- source_word: ἀγαπᾷς / φιλῶ
  choice: unanipenda / ninakupenda
  rationale: Vitenzi vyote vinaweza kutafsiriwa kwa kawaida kuwa ‘penda’ katika muktadha huu. Tofauti ya msamiati imehifadhiwa katika tanbihi bila kulazimisha tofauti ya maana isiyo wazi.
- source_word: πλέον τούτων
  choice: kuliko hawa au hivi
  rationale: τούτων inaweza kurejelea watu au vitu, na kigezo cha ulinganisho hakijaelezwa wazi. Kiswahili hulazimisha uchaguzi wa ngeli, hivyo chaguo zote mbili zinawekwa katika matini ili kuhifadhi utata wa Kigiriki.
- source_word: Βόσκε τὰ ἀρνία μου
  choice: Walishe wana-kondoo wangu
  rationale: βόσκω humaanisha hasa kulisha, na ἀρνία ni wana-kondoo; tafsiri hii inadumisha taswira ya kichungaji na umilikaji wa Yesu.
theological_decisions:
- issue: Iwapo ἀγαπάω na φιλέω zitofautishwe kwa ukali
  choice: Zote zimetafsiriwa kwa ‘penda’ katika matini, huku tofauti ya vitenzi vya Kigiriki ikielezwa katika tanbihi.
  alternative: Kutafsiri ἀγαπάω kama ‘penda’ na φιλέω kama ‘kuwa na upendo wa kirafiki’ au ‘kuwa na mahaba’.
  rationale: Haijulikani kwa hakika kama Yohana anakusudia ngazi mbili tofauti za upendo au anatumia utofauti wa kimtindo. Kutumia ‘penda’ kwa zote huepuka kuingiza fundisho lisilothibitishwa na maneno yenyewe.
- issue: Maana ya πλέον τούτων
  choice: Kuhifadhi uwezekano wa kurejelea watu au vitu kwa ‘kuliko hawa au hivi’.
  alternative: ‘Kuliko hawa wanavyonipenda’ au ‘kuliko unavyovipenda hivi.’
  rationale: Kigiriki hakitaji wazi kinacholinganishwa wala uhusiano kamili wa ulinganisho. Tafsiri haipaswi kuchagua kimya kimya mojawapo ya fasiri hizo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Walipokwisha kula kifungua kinywa’ ni usemi wa kawaida; ‘wana-kondoo’ huhifadhi taswira ya kichungaji. Kwa sababu Kiswahili hutofautisha ngeli za watu na vitu, ‘hawa au hivi’ limetumiwa kudumisha utata halisi wa τούτων.
