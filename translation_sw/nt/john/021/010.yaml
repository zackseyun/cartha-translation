  yaml_path: translation/nt/john/021/010.yaml
  text: Jesus said to them[a], “Bring some of the fish that you have now caught.”
translation:
  language: sw
  text: Yesu akawaambia, “Leteni baadhi ya samaki mliowavua sasa hivi.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: akawaambia
  rationale: Hali ya sasa ya kihistoria katika simulizi imetafsiriwa kwa wakati uliopita wa usimulizi; kiambishi cha mtendewa kinaonyesha kwa kawaida kwamba alisema kwao.
- source_word: Ἐνέγκατε
  choice: Leteni
  rationale: Amri ya wingi inaeleza kuwaleta samaki mahali Yesu alipo kwa lugha ya kawaida na ya moja kwa moja.
- source_word: ἀπὸ τῶν ὀψαρίων
  choice: baadhi ya samaki
  rationale: Muundo huu una maana ya kuchukua sehemu kutoka katika samaki wote waliovuliwa; ‘baadhi ya’ ni Kiswahili cha asili kinachohifadhi maana hiyo.
- source_word: ὀψαρίων
  choice: samaki
  rationale: Katika muktadha huu neno linamaanisha samaki waliovuliwa; kutaja ukubwa au hali ya kupikwa kungezidisha yaliyo katika matini.
- source_word: ὧν ἐπιάσατε
  choice: mliowavua
  rationale: Kishazi rejeshi kinawatambulisha samaki husika kuwa wale ambao wanafunzi walivua.
- source_word: νῦν
  choice: sasa hivi
  rationale: Kirai hiki kinaonyesha kwamba uvuvi umetokea muda mfupi tu uliopita na kinaunganisha tendo lililokamilika na wakati wa sasa.
