translation:
  language: sw
  text: Hawakuelewa kwamba alikuwa akiwaambia kuhusu Baba[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Hawakujua kwamba alikuwa akiwaambia kuhusu Baba.”
    reason: Mbadala wa kimsamiati kwa οὐκ ἔγνωσαν, ambayo inaweza kumaanisha “hawakujua” au, katika muktadha huu, “hawakuelewa”.
lexical_decisions:
- source_word: οὐκ ἔγνωσαν
  choice: Hawakuelewa
  rationale: Ingawa γινώσκω mara nyingi humaanisha ‘kujua’, hapa inaonyesha kwamba hawakufahamu maana ya maneno ya Yesu. ‘Hawakuelewa’ ni Kiswahili cha kawaida na huwasilisha vizuri nguvu ya kauli hiyo.
- source_word: ὅτι
  choice: kwamba
  rationale: Neno hili linaanzisha kishazi kinachoeleza jambo ambalo hawakuelewa.
- source_word: τὸν πατέρα
  choice: Baba
  rationale: Katika muktadha wa Yohana, jina hili linamtaja Mungu kama Baba ya Yesu. Herufi kubwa inaonyesha rejeo hilo bila kuongeza maelezo yasiyomo katika Kigiriki.
- source_word: αὐτοῖς
  choice: nao
  rationale: Pamoja na kitenzi λέγω, kiwakilishi hiki kinaonyesha watu walioelekezewa maneno. Kiswahili cha kawaida hutumia ‘kusema nao’ katika muundo huu.
- source_word: ἔλεγεν
  choice: alikuwa akisema
  rationale: Wakati usiotimilifu wa Kigiriki unaonyesha tendo lililokuwa likiendelea; ‘alikuwa akisema’ huhifadhi hali hiyo kwa Kiswahili cha asili.
theological_decisions:
- issue: Rejeo la ‘Baba’
  choice: Yesu alikuwa akisema kuhusu Mungu, Baba yake.
  alternative: Yesu alikuwa akisema kuhusu baba wa kibinadamu.
  rationale: Muktadha wa karibu katika Yohana hutumia ‘Baba’ kumtaja Mungu kama Baba ya Yesu. Tafsiri hii hufuata muktadha bila kuingiza ufafanuzi wa kimadhehebu.
- issue: Maana ya γινώσκω katika muktadha
  choice: Kutafsiri ‘hawakuelewa’.
  alternative: ‘Hawakujua’ au ‘hawakutambua’.
  rationale: Muktadha unaonyesha kwamba wasikilizaji hawakufahamu Yesu alikuwa akimtaja nani. Hata hivyo, maana ya msingi ya ‘kujua’ imehifadhiwa katika tanbihi kama tafsiri mbadala halali.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na kinachoeleweka kwa urahisi. Muundo ‘alikuwa akisema’ huhifadhi hali endelevu ya ἔλεγεν, na tanbihi huhifadhi uwezekano halisi wa maana ya ‘kujua’.
