base_translation:
  language: en
  yaml_path: translation/nt/john/008/058.yaml
  text: Jesus said to them[a], “Truly, truly, I say to you, before Abraham came to be[b], I am.”
translation:
  language: sw
  text: Yesu aliwaambia, “Amin, amin, nawaambia, kabla Abrahamu hajakuwako[a], mimi niko[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hajazaliwa.” Kitenzi cha Kigiriki ni kipana zaidi na kinaweza kumaanisha “kuja kuwako” au “kuanza kuwako.”
    reason: lexical_alternative
  - marker: b
    text: Au, “nimekuwako.” Kigiriki kinasema kwa hali ya wakati uliopo, “mimi niko,” kikidumisha umbo hilo na mwangwi wake wa kitheolojia unaowezekana.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν αὐτοῖς Ἰησοῦς
  choice: Yesu aliwaambia
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya utangulizi wa simulizi, huku ikidumisha kwamba Yesu alisema maneno hayo kwao.
- source_word: Ἀμὴν ἀμὴν
  choice: Amin, amin
  rationale: Hudumisha kwa uwazi na kwa mtindo wenye heshima kauli ya Kiyohana iliyorudiwa mara mbili kwa ajili ya msisitizo.
- source_word: λέγω ὑμῖν
  choice: ninawaambia
  rationale: Ni usemi wa kawaida wa Kiswahili unaowasilisha kauli ya moja kwa moja kwa wingi bila kupunguza uzito wake.
- source_word: πρὶν
  choice: kabla
  rationale: Ni kiunganishi cha kawaida cha wakati kinachoonyesha kwamba jambo moja lilitangulia jingine.
- source_word: Ἀβραὰμ
  choice: Abrahamu
  rationale: Ni umbo la kawaida la jina hili katika Biblia za Kiswahili na matumizi ya Kikristo ya Afrika Mashariki.
- source_word: γενέσθαι
  choice: hajapata kuwako
  rationale: Kitenzi γίνομαι hapa ni kipana kuliko kuzaliwa tu. Usemi huu wa Kiswahili unaonyesha kuanza kuwako na pia unadumisha tofauti ya kitenzi na kauli inayofuata, ingawa hauwezi kuiga kikamilifu muundo wa Kigiriki.
- source_word: ἐγὼ εἰμί
  choice: mimi niko
  rationale: Huhifadhi wakati uliopo, kiwakilishi chenye msisitizo, na hali ya kauli isiyo na kijalizo. Pia huacha mwangwi wake wa kitheolojia uonekane bila kuufafanua ndani ya matini.
theological_decisions:
- issue: Tafsiri ya ἐγὼ εἰμί katika muktadha wenye uzito wa kikristolojia
  choice: mimi niko
  alternative: nimekuwako
  rationale: Kigiriki kina wakati uliopo na kauli yake ni ya moja kwa moja isiyo na kijalizo. “Mimi niko” huhifadhi hali hiyo na uwezekano wa mwangwi wa kujitambulisha kwa Mungu, bila kuamua kwa msomaji maana yake yote. “Nimekuwako” ni Kiswahili laini zaidi katika muktadha wa wakati, lakini hubadili umbo la wakati na kuelekeza maana hasa kwenye kuwako kabla.
- issue: Maana ya γενέσθαι kuhusu Abrahamu
  choice: hajapata kuwako
  alternative: hajazaliwa
  rationale: Kitenzi cha Kigiriki kinaweza kuhusisha kuja kuwako na hakitumiwi kwa namna inayolazimisha maana finyu ya kuzaliwa. Tafsiri kuu inadumisha upana huo; chaguo la kuzaliwa linawekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Amin, amin” limedumishwa kama fomula nzito ya Yesu katika Injili ya Yohana. “Hajapata kuwako” ni ya kawaida kiasi na pana kuliko “hajazaliwa,” huku “mimi niko” ikihifadhi mkazo na mvutano wa kauli ya Kigiriki.
