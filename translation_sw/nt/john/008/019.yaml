base_translation:
  language: en
  yaml_path: translation/nt/john/008/019.yaml
  text: So they were saying to him[a], “Where is your Father?” Jesus answered, “You know neither me nor my Father. If you knew me, you would know my Father also.”
translation:
  language: sw
  text: Basi walikuwa wakimuuliza, “Baba yako yuko wapi?” Yesu akajibu, “Hamnijui mimi wala Baba yangu. Kama mngenijua, mngemjua Baba yangu pia.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “Kama mngalikuwa mmenijua, mngalikuwa mmemjua Baba yangu pia.” Muundo wa masharti katika Kigiriki unaweza kutafsiriwa kwa namna inayosisitiza hali iliyo kinyume na ukweli; mbadala huu unaweza kusikika zaidi kuwa wa wakati uliopita.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: walikuwa wakimuuliza
  rationale: Kauli ya wakati usiotimilika inaonyesha usemi uliokuwa ukiendelea au kurudiwa. Kwa kuwa usemi wenyewe ni swali, ‘wakimuuliza’ ni Kiswahili cha asili kuliko tafsiri nyembamba ya ‘wakimwambia’.
- source_word: οὖν
  choice: Basi
  rationale: Neno hili linaunganisha swali lao na hoja iliyotangulia; ‘Basi’ ni kiunganishi cha kawaida na chenye hadhi katika simulizi.
- source_word: Ποῦ ἐστιν ὁ πατήρ σου;
  choice: Baba yako yuko wapi?
  rationale: Huhifadhi swali la moja kwa moja. Herufi kubwa katika ‘Baba’ inadokeza kwamba anayelengwa ni Mungu, kama muktadha wa Yohana unavyoonyesha.
- source_word: ἀπεκρίθη
  choice: akajibu
  rationale: Ni namna ya kawaida ya Kiswahili ya kuendeleza simulizi na kutaja jibu la Yesu.
- source_word: Οὔτε ἐμὲ οἴδατε οὔτε τὸν πατέρα μου
  choice: Hamnijui mimi wala Baba yangu
  rationale: Muundo ‘... wala ...’ unawakilisha οὔτε...οὔτε kwa Kiswahili cha asili, huku ‘mimi’ ikihifadhi msisitizo wa kiwakilishi cha Kigiriki.
- source_word: οἶδατε / ᾔδειτε
  choice: mnajua / mngejua
  rationale: Mzizi ‘jua’ huhifadhi upana wa maana unaoweza kujumuisha kumtambua na kuwa na ufahamu wa mtu, bila kuufinyanga kuwa uelewa wa kiakili pekee.
- source_word: εἰ ἐμὲ ᾔδειτε, καὶ τὸν πατέρα μου ἂν ᾔδειτε
  choice: Kama mngenijua, mngemjua Baba yangu pia
  rationale: Muundo wa ‘kama ... -nge-’ unaonyesha hali ya sasa isiyo halisi kwa Kiswahili cha kawaida. ‘Pia’ huwakilisha καί na kudumisha uhusiano kati ya kumjua Yesu na kumjua Baba.
theological_decisions:
- issue: Kuandika ‘Baba’ kwa herufi kubwa inapomhusu Mungu
  choice: ‘Baba’ limeandikwa kwa herufi kubwa katika sehemu zote mbili
  alternative: Kuandika ‘baba’ kwa herufi ndogo
  rationale: Muktadha unamtambulisha Baba ya Yesu kuwa Mungu. Herufi kubwa humsaidia msomaji kuona rejeo hilo bila kuongeza maelezo yasiyokuwamo katika matini.
- issue: Maana ya kumjua Yesu na Baba
  choice: Kutumia kitenzi kipana ‘kujua’
  alternative: Kutumia ‘kutambua’ au ‘kuelewa’
  rationale: ‘Kujua’ huhifadhi mvutano na upana wa maana katika Yohana, bila kuamua kwamba kauli hiyo inahusu utambuzi tu au uelewa wa kiakili tu.
- issue: Nguvu ya hali isiyo halisi katika sentensi ya masharti
  choice: Kama mngenijua, mngemjua Baba yangu pia
  alternative: Kama mngalikuwa mmenijua, mngalikuwa mmemjua Baba yangu pia
  rationale: Muundo uliochaguliwa unasomeka kwa kawaida kama hali ya sasa iliyo kinyume na ukweli; mbadala unaweza kusikika kana kwamba unalenga wakati uliopita, ingawa unaweza kutumiwa kusisitiza zaidi hali isiyotimia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Walikuwa wakimuuliza’ huhifadhi hali ya tendo lililoendelea bila kulazimisha maana ya kurudia-rudia sana; ‘-nge-’ ni ya kawaida na wazi kwa wasomaji wengi.
