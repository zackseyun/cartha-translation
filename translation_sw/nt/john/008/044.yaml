  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὑμεῖς ἐκ τοῦ πατρὸς τοῦ διαβόλου ἐστὲ καὶ τὰς ἐπιθυμίας τοῦ πατρὸς ὑμῶν θέλετε ποιεῖν. ἐκεῖνος ἀνθρωποκτόνος ἦν ἀπ’ ἀρχῆς, καὶ ἐν τῇ ἀληθείᾳ ⸂οὐκ ἔστηκεν⸃, ὅτι οὐκ ἔστιν ἀλήθεια ἐν αὐτῷ. ὅταν λαλῇ τὸ ψεῦδος, ἐκ τῶν ἰδίων λαλεῖ, ὅτι ψεύστης ἐστὶν καὶ ὁ πατὴρ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/044.yaml
  text: You are from your father[a], the devil, and you want to do your father's desires. He was a murderer from the beginning, and he has not stood in the truth, because there is no truth in him. Whenever he speaks the lie, he speaks from his own nature[c][b], because he is a liar and the father of it.
translation:
  language: sw
  text: Ninyi mmetokana na baba yenu, Ibilisi, nanyi mnataka kutenda tamaa za baba yenu. Yeye alikuwa muuaji tangu mwanzo, na hajasimama katika kweli, kwa sababu hamna kweli ndani yake. Kila anaposema uongo[a], husema kutokana na yaliyo yake mwenyewe[b], kwa sababu yeye ni mwongo na baba wa uongo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa kufuata umbo la Kigiriki kwa karibu zaidi: “Kila anaposema huo uongo.” Pia inaweza kutafsiriwa, “Kila anapodanganya.”'
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “husema kutokana na yaliyo yake mwenyewe,” yaani kutokana na kile kilicho chake kwa tabia au hulka.
    reason: lexical_alternative
  - marker: c
    text: Kihalisi, “na baba yake.” Kiwakilishi hicho kinaeleweka kwa kawaida kumrejelea “uongo”; wengine hutafsiri kwa upana, “baba wa uongo wote.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκ τοῦ πατρὸς τοῦ διαβόλου
  choice: mmetokana na baba yenu, Ibilisi
  rationale: Muundo wa ἐκ pamoja na εἰμί unaonyesha chanzo au uhusiano. “Mmetokana na” ni Kiswahili cha kawaida kinachohifadhi nguvu ya kauli bila kudai uzazi wa kimwili.
- source_word: ἐπιθυμίας
  choice: tamaa
  rationale: “Tamaa” linaweza kumaanisha matakwa yenye nguvu na mwelekeo mbaya wa kimaadili hapa; halifungwi kwa maana ya kingono pekee.
- source_word: θέλετε ποιεῖν
  choice: mnataka kutenda
  rationale: Huwasilisha wazi nia na utashi wa kufanya.
- source_word: ἀνθρωποκτόνος
  choice: muuaji
  rationale: Ni neno la kawaida na la moja kwa moja kwa mtu anayeua binadamu katika muktadha huu wa kimaadili.
- source_word: ἀπ’ ἀρχῆς
  choice: tangu mwanzo
  rationale: Huhifadhi maana ya wakati na mwangwi wa lugha ya Yohana.
- source_word: ἐν τῇ ἀληθείᾳ οὐκ ἔστηκεν
  choice: hakusimama katika kweli
  rationale: Huhifadhi taswira ya kusimama na haiongezi kwa lazima wazo kwamba hapo awali alikuwa katika kweli kisha akaiacha.
- source_word: ὅταν λαλῇ τὸ ψεῦδος
  choice: kila anaposema uongo
  rationale: Ni Kiswahili cha asili kwa kauli ya Kigiriki “anaposema huo uongo”; udhahiri wa kifungu cha Kigiriki umeelezwa katika tanbihi.
- source_word: ἐκ τῶν ἰδίων λαλεῖ
  choice: husema kutokana na yaliyo yake mwenyewe
  rationale: Hufuata kwa karibu nahau ya Kigiriki bila kuingiza moja kwa moja tafsiri finyu ya “asili yake”; maana yake imefafanuliwa katika tanbihi.
- source_word: ψεύστης
  choice: mwongo
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: ὁ πατὴρ αὐτοῦ
  choice: baba wa uongo
  rationale: Kiwakilishi kinaeleweka kwa kawaida kumrejelea “uongo” uliotajwa karibu; Kiswahili hiki kinaonyesha chanzo cha uongo bila kuongeza wingi wa “uongo mbalimbali.”
theological_decisions:
- issue: Kirejelewa cha ὁ πατὴρ αὐτοῦ
  choice: “Baba wa uongo,” yaani Ibilisi ndiye chanzo cha uongo.
  alternative: “Baba yake,” au kwa ujumla zaidi “baba wa uongo wote.”
  rationale: Kirejelewa cha karibu na chenye mshikamano zaidi ni τὸ ψεῦδος, “uongo.” Tafsiri “baba yake” ingezua dai lisilo wazi na la kubahatisha kuhusu baba wa Ibilisi.
- issue: Kama maneno kuhusu kusimama katika kweli yanamaanisha Ibilisi aliwahi kuwa katika kweli
  choice: “Hakusimama katika kweli,” bila kuamua kama alikuwa humo hapo awali.
  alternative: “Hakudumu katika kweli,” ambalo linaweza kudokeza kwamba hapo awali alikuwamo.
  rationale: Kigiriki kinahifadhi taswira ya kusimama lakini hakilazimishi wazi simulizi la hali ya awali; tafsiri haipaswi kutatua mvutano huo kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi huhifadhi ukali wa maneno ya Yesu, taswira ya “kusimama katika kweli,” na utata halisi wa vifungu vya mwisho bila kuingiza msimamo wa dhehebu.
