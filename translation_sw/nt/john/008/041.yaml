  text: ὑμεῖς ποιεῖτε τὰ ἔργα τοῦ πατρὸς ὑμῶν. ⸀εἶπαν αὐτῷ· Ἡμεῖς ἐκ πορνείας ⸂οὐ γεγεννήμεθα⸃· ἕνα πατέρα ἔχομεν τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/041.yaml
  text: You are doing the works of your father.” They said to him[a], “We were not born of sexual immorality; we have one Father—God.”
translation:
  language: sw
  text: “Ninyi mnafanya matendo ya baba yenu.” Wakamwambia, “Sisi hatukuzaliwa kutokana na uasherati[a]; tunaye Baba mmoja—Mungu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Sisi si watoto wa nje ya ndoa.” Kigiriki kinasema moja kwa moja, “Hatukuzaliwa kutokana na uasherati.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιεῖτε
  choice: mnafanya
  rationale: Kitenzi cha wakati uliopo kinaonyesha tendo linaloendelea au linalowatambulisha katika muktadha huu.
- source_word: τὰ ἔργα
  choice: matendo
  rationale: ‘Matendo’ ni Kiswahili cha kawaida na chenye hadhi kwa maana ya mambo yanayofanywa, na kinaendana kiasili na kitenzi ‘mnafanya.’
- source_word: τοῦ πατρὸς ὑμῶν
  choice: ya baba yenu
  rationale: ‘Baba’ huhifadhi lugha ya uhusiano na mvutano kuhusu nasaba au chanzo cha kiroho bila kuufafanua kupita kiasi.
- source_word: ἐκ πορνείας
  choice: kutokana na uasherati
  rationale: ‘Uasherati’ huwakilisha maana pana ya πορνεία, na ‘kutokana na’ huhifadhi wazo la asili ya kuzaliwa linaloonyeshwa na ἐκ.
- source_word: οὐ γεγεννήμεθα
  choice: hatukuzaliwa
  rationale: Hii ni tafsiri ya kawaida ya Kiswahili ya kauli timilifu tendwa katika usemi huu wa kuzaliwa.
- source_word: ἕνα πατέρα ἔχομεν
  choice: tunaye Baba mmoja
  rationale: ‘Mmoja’ huhifadhi msisitizo wa ἕνα, na ‘tunaye’ ni muundo wa asili wa Kiswahili unapomrejelea mtu.
- source_word: τὸν θεόν
  choice: Mungu
  rationale: ‘Mungu’ anamtambulisha Baba huyo mmoja; dashibodi ndefu huonyesha uhusiano wa ufafanuzi bila kuongeza maneno.
theological_decisions:
- issue: Iwapo usemi wa kuzaliwa kutokana na πορνεία ufafanuliwe moja kwa moja kuwa hali ya kuwa watoto wasio halali
  choice: Kuhifadhi usemi wa moja kwa moja, ‘hatukuzaliwa kutokana na uasherati,’ katika matini kuu
  alternative: Sisi si watoto wa nje ya ndoa
  rationale: Usemi huo wa Kigiriki huenda unakanusha kuzaliwa nje ya ndoa na huenda una ukali wa mabishano, lakini matini yenyewe hutaja kuzaliwa kutokana na πορνεία. Tafsiri ya moja kwa moja huhifadhi utata na mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi na inayoeleweka kwa urahisi. ‘Baba’ imeandikwa kwa herufi kubwa inapomtaja Mungu, lakini kwa herufi ndogo katika ‘baba yenu’ ili kutodokeza utambulisho ambao muktadha bado unauweka katika mvutano.
