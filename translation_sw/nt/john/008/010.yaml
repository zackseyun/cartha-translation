  yaml_path: translation/nt/john/008/010.yaml
  text: Then Jesus[a] straightened up, and seeing no one except the woman, said to her, "Woman, where are those accusers of yours? Has no one condemned you?"
translation:
  language: sw
  text: Kisha Yesu[a] akajiinua, na hakuona mtu yeyote isipokuwa yule mwanamke; akamwambia, “Mwanamke, wako wapi wale waliokushutumu? Je, hakuna mtu aliyekuhukumu?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mstari huu ni sehemu ya habari ya mwanamke aliyekutwa akizini (Yohana 7:53–8:11), ambayo haipatikani katika hati za kale zaidi za Kigiriki. Tazama maelezo katika Yohana 7:53.
    reason: textual_critical
lexical_decisions:
- source_word: ἀνακύψας
  choice: akajiinua
  rationale: Inaonyesha Yesu aliinua mwili wake baada ya kuinama na kuandika ardhini; ‘akajiinua’ ni ya asili na haidai kwamba alisimama kabisa.
- source_word: θεασάμενος
  choice: alipomwona
  rationale: Hutoa maana ya utambuzi wa kuona katika kishazi tegemezi, kulingana na hali ya Yesu kutazama baada ya kujiinua.
- source_word: κατήγοροί
  choice: waliokushutumu
  rationale: Huhifadhi maana ya washitaki katika muktadha wa kisheria bila kutumia istilahi nzito isiyo ya lazima.
- source_word: κατέκρινεν
  choice: aliyekuhukumu
  rationale: Katika muktadha huu kitenzi kinamaanisha kutoa hukumu ya hatia; ‘kuhukumu’ ni neno la kawaida linalodumisha uzito wa kisheria.
