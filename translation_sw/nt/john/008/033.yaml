base_translation:
  language: en
  yaml_path: translation/nt/john/008/033.yaml
  text: They answered him[a], “We are Abraham’s offspring and have never been enslaved to anyone. How can you say[c][b], ‘You will become free’?”
translation:
  language: sw
  text: Wakamjibu, “Sisi ni uzao wa Abrahamu[a], wala hatujawahi kuwa watumwa wa mtu yeyote[b]. Wewe unawezaje kusema, ‘Mtakuwa huru[c]’?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mbegu ya Abrahamu.” Kigiriki kinatumia neno la umoja lenye maana ya pamoja kuhusu nasaba ya kimwili.
    reason: lexical_alternative
  - marker: b
    text: Au “hatujawahi kumtumikia mtu yeyote.” Kitenzi kinaweza kumaanisha kutumikia, lakini hapa tofauti kati ya utumwa na uhuru ndiyo inayotawala.
    reason: lexical_alternative
  - marker: c
    text: 'Kwa karibu zaidi, kitenzi cha Kigiriki hudokeza kufanyika au kuingia katika hali ya uhuru: “mtakuwa huru.”'
    reason: lexical_nuance
lexical_decisions:
- source_word: ἀπεκρίθησαν πρὸς αὐτόν
  choice: Wakamjibu
  rationale: Ni Kiswahili cha kawaida kinachoonyesha kwamba jibu lilielekezwa kwake bila kufuata kisarufi muundo wa Kigiriki kwa namna isiyo ya asili.
- source_word: Σπέρμα Ἀβραάμ
  choice: uzao wa Abrahamu
  rationale: “Uzao” ni neno la pamoja linaloeleweka kwa urahisi na linaonyesha dai la nasaba ya kimwili, huku likihifadhi kwa kiasi cha asili umoja wa συλλογική wa σπέρμα.
- source_word: οὐδενὶ δεδουλεύκαμεν πώποτε
  choice: hatujawahi kuwa watumwa wa mtu yeyote
  rationale: Huhifadhi hali timilifu na mkazo wa πώποτε kwa “hatujawahi,” na katika muktadha wa uhuru dhidi ya utumwa, “kuwa watumwa” lina nguvu inayofaa kuliko “kutumikia.”
- source_word: πῶς σὺ λέγεις
  choice: Wewe unawezaje kusema
  rationale: “Unawezaje kusema” huonyesha mshangao na upinzani wa swali, na “wewe” huhifadhi mkazo wa kiwakilishi cha Kigiriki σὺ.
- source_word: Ἐλεύθεροι γενήσεσθε
  choice: Mtakuwa huru
  rationale: Ni Kiswahili cha asili kwa hali ya baadaye; katika muktadha kinaweza kuonyesha kuingia katika hali ya uhuru, ingawa γενήσεσθε kwa karibu zaidi hubeba wazo la ‘kuwa/kufanyika.’
theological_decisions:
- issue: Maana ya δουλεύω katika tofauti kati ya uhuru na utumwa
  choice: kuwa watumwa
  alternative: kumtumikia mtu
  rationale: Muktadha wa karibu wa Yohana 8:34–36 unahusu utumwa na uhuru. Chaguo hili linahifadhi uzito wa kifungo bila kupunguza kitenzi kuwa huduma ya kawaida.
- issue: Maana ya Σπέρμα Ἀβραάμ
  choice: uzao wa Abrahamu
  alternative: mbegu ya Abrahamu; wazao wa Abrahamu
  rationale: “Uzao” huonyesha nasaba wanayodai bila kuingiza maana maalumu ya kitheolojia kutoka katika vifungu vingine; pia ni ya asili zaidi kuliko “mbegu” na karibu zaidi na hali ya pamoja kuliko wingi wa “wazao.”
- issue: Nguvu ya γενήσεσθε katika kauli kuhusu uhuru
  choice: Mtakuwa huru
  alternative: Mtapata kuwa huru
  rationale: “Mtakuwa huru” ni ya sasa na ya kawaida katika Kiswahili, huku muktadha ukiweka wazi mabadiliko kutoka utumwani kwenda uhuru. Tanbihi inalinda wazo la kuingia katika hali hiyo bila kutumia usemi mzito au usio wa kawaida.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Uzao,” “watumwa,” na “huru” ni maneno yanayoeleweka kwa wasomaji wa kawaida. Mpangilio “Wewe unawezaje kusema” huhifadhi mkazo wa msemaji bila kuwa mgumu.
