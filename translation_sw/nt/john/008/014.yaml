  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτοῖς· Κἂν ἐγὼ μαρτυρῶ περὶ ἐμαυτοῦ, ἀληθής ἐστιν ἡ μαρτυρία μου, ὅτι οἶδα πόθεν ἦλθον καὶ ποῦ ὑπάγω· ὑμεῖς δὲ οὐκ οἴδατε πόθεν ἔρχομαι ⸀ἢ ποῦ ὑπάγω.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/014.yaml
  text: Jesus answered and said to them[a], “Even if I testify about myself, my testimony is true, because I know where I came from and where I am going[b]; but you do not know where I come from or where I am going.”
translation:
  language: sw
  text: Yesu akawajibu, akasema, “Hata kama ninatoa ushuhuda kuhusu mimi mwenyewe[a], ushuhuda wangu ni wa kweli, kwa sababu ninajua nilikotoka na ninakokwenda. Lakini ninyi hamjui ninakotoka au[b] ninakokwenda.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ninashuhudia kuhusu mimi mwenyewe.”
    reason: lexical_alternative
  - marker: b
    text: Baadhi ya hati zina “na” badala ya “au.”
    reason: textual_variant
lexical_decisions:
- source_word: ἀπεκρίθη ... καὶ εἶπεν
  choice: akawajibu, akasema
  rationale: Inahifadhi vitenzi vyote viwili vya simulizi la Kiyohana kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: Κἂν
  choice: Hata kama
  rationale: Inaonyesha maana ya kukubali jambo kwa hoja bila kukiri kwamba ushuhuda huo si wa kweli.
- source_word: μαρτυρῶ περὶ ἐμαυτοῦ
  choice: ninatoa ushuhuda juu yangu mwenyewe
  rationale: Inahifadhi maana ya kutoa ushuhuda kuhusu nafsi yake na pia ladha ya kisheria ya neno hilo bila kuifanya kuwa finyu mno.
- source_word: ἀληθής ... ἡ μαρτυρία μου
  choice: ushuhuda wangu ni wa kweli
  rationale: ‘Wa kweli’ huwasilisha dai la ukweli moja kwa moja bila kulibana kuwa uhalali wa kisheria pekee.
- source_word: ὅτι οἶδα
  choice: kwa sababu ninajua
  rationale: Inaonyesha wazi uhusiano wa kisababishi na dai la Yesu la kujua.
- source_word: πόθεν ἦλθον
  choice: nilikotoka
  rationale: Ni usemi wa asili wa Kiswahili unaoonyesha chanzo au asili ya kuja kwake.
- source_word: ποῦ ὑπάγω
  choice: ninakokwenda
  rationale: Huonyesha mwendo wenye mwelekeo unaoendelea kwa Kiswahili cha kawaida.
- source_word: ὑμεῖς δὲ οὐκ οἴδατε
  choice: Lakini ninyi hamjui
  rationale: Inahifadhi utofauti na msisitizo wa kiwakilishi ninyi uliomo katika Kigiriki.
theological_decisions:
- issue: Asili ya ushuhuda wa Yesu kuhusu yeye mwenyewe
  choice: Dai limeelezwa kuwa ushuhuda wake ni wa kweli kwa sababu anajua alikotoka na anakokwenda.
  alternative: Kutumia lugha inayosisitiza uhalali wa kisheria pekee, au kutaja wazi asili ya mbinguni.
  rationale: Aya yenyewe inaunganisha ukweli wa ushuhuda na ujuzi wa Yesu kuhusu asili na mwisho wa safari yake; tafsiri haiongezi ufafanuzi wa kimafundisho ambao haujasemwa moja kwa moja hapa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi na chenye hadhi. Muundo wa ‘akawajibu, akasema’ unatunza jozi ya vitenzi vya Kigiriki; sentensi imegawanywa kabla ya ‘Lakini’ ili iwe rahisi kusomwa bila kupoteza utofauti wa hoja.
