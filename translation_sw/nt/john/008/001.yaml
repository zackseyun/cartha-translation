  text: Lakini Yesu[a] akaenda kwenye Mlima wa Mizeituni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mstari huu ni mwendelezo wa simulizi la mwanamke aliyekutwa akizini (Yohana 7:53–8:11). Tazama maelezo kwenye Yohana 7:53 kuhusu ushahidi wa maandishi ya kale.
    reason: textual_critical
lexical_decisions:
- source_word: πορεύομαι
  choice: akaenda
  rationale: Kitenzi hiki cha wakati uliopita kina maana tendaji hapa na kinaonyesha mwendo rahisi kuelekea mahali fulani. Umbo la mfululizo “akaenda” linaunganisha tendo hili kwa kawaida na simulizi lililotangulia.
- source_word: ὄρος
  choice: Mlima
  rationale: Katika jina la mahali “Mlima wa Mizeituni,” neno hili linafasiriwa kwa maana yake ya kawaida na inayotambulika katika Kiswahili.
- source_word: ἐλαιῶν
  choice: Mizeituni
  rationale: Huu ni wingi katika hali ya umilikaji, ukirejelea miti ya mizeituni; “Mlima wa Mizeituni” ni jina la mahali lililo wazi na la kawaida katika Kiswahili.
- source_word: δέ
  choice: Lakini
  rationale: Kiunganishi hiki kinaendeleza simulizi huku kikionyesha utofauti kati ya watu kwenda nyumbani kwao katika mstari uliotangulia na Yesu kwenda Mlima wa Mizeituni.
