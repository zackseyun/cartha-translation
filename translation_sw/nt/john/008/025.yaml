  yaml_path: translation/nt/john/008/025.yaml
  text: So they were saying to him, “Who are you?” Jesus said to them, “Just what I have been telling you from the beginning.”
translation:
  language: sw
  text: Basi wakawa wakimwuliza, “Wewe ni nani?” Yesu akawaambia, “Ndiyo yale ambayo nimekuwa nikiwaambia tangu mwanzo.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: wakamwuliza
  rationale: Ingawa kitenzi chenyewe ni ‘walikuwa wakisema’, katika muktadha huu maneno yanayofuata ni swali linaloelekezwa kwa Yesu; Kiswahili cha kawaida hutumia ‘kuuliza’ kwa namna ya asili.
- source_word: Σὺ τίς εἶ;
  choice: Wewe ni nani?
  rationale: Huhifadhi msisitizo wa kiwakilishi Σὺ kwa kuweka ‘Wewe’ wazi.
- source_word: Τὴν ἀρχὴν ὅ τι καὶ λαλῶ ὑμῖν
  choice: Ni yale yale ambayo nimekuwa nikiwaambia tangu mwanzo
  rationale: Kirai cha Kigiriki kina ugumu na kinaweza kufasiriwa kwa njia kadhaa. Tafsiri hii inafuata maana inayowezekana ya Yesu kurejelea ujumbe ambao amekuwa akiwaambia tangu mwanzo, huku καὶ ikionyeshwa kwa ‘yale yale’.
theological_decisions:
- issue: Jibu la Yesu linaweza kueleweka ama kama kurejelea yale aliyosema tangu mwanzo, ama kama swali lenye maana ya ‘Kwa nini hata ninasema nanyi?’
  choice: Ni yale yale ambayo nimekuwa nikiwaambia tangu mwanzo.
  alternative: Kwa nini hata ninasema nanyi?
  rationale: Mpangilio na maana ya Τὴν ἀρχὴν ὅ τι καὶ λαλῶ ὑμῖν ni tata. Maandishi makuu yanachagua uelewa unaolingana na muktadha wa Yesu kujitambulisha kwa yale ambayo tayari amekuwa akisema, bila kuongeza jina au dai la kiteolojia lisilo wazi katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Nimekuwa nikiwaambia’ huonyesha tendo endelevu la λαλῶ katika kipindi kinachoanzia ‘tangu mwanzo’; ‘yale yale’ hufanya jibu lisikike la kawaida na kuakisi msisitizo wa καὶ.
