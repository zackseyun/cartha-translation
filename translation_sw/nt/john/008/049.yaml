  text: ἀπεκρίθη Ἰησοῦς· Ἐγὼ δαιμόνιον οὐκ ἔχω, ἀλλὰ τιμῶ τὸν πατέρα μου, καὶ ὑμεῖς ἀτιμάζετέ με.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/049.yaml
  text: Jesus answered[a], “I do not have a demon, but I honor my Father, and you dishonor me.”
translation:
  language: sw
  text: Yesu akajibu[a], “Mimi sina pepo, bali ninamheshimu Baba yangu, nanyi mnanivunjia heshima.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri yenye kufafanua zaidi, “Mimi sijapagawa na pepo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: akajibu
  rationale: Kitenzi cha kawaida cha masimulizi kinachoonyesha jibu katika mazungumzo; muundo wa ‘aka-’ unaendeleza simulizi kwa Kiswahili cha kawaida.
- source_word: δαιμόνιον
  choice: pepo
  rationale: ‘Pepo’ ni neno la kawaida la Kiswahili kwa kiumbe cha kiroho kiovu katika muktadha huu, na pamoja na ‘kuwa na’ linahifadhi nahau ya Kigiriki.
- source_word: οὐκ ἔχω
  choice: sina
  rationale: Ni ulinganifu wa moja kwa moja na wa asili wa ‘sina/si na’; unahifadhi usemi halisi ‘kuwa na pepo’ badala ya kuufasiri moja kwa moja kuwa kupagawa.
- source_word: Ἐγὼ
  choice: Mimi
  rationale: Kiwakilishi huru kinahifadhi mkazo wa Ἐγώ ulio wazi katika Kigiriki.
- source_word: τιμῶ
  choice: ninamheshimu
  rationale: ‘Kuheshimu’ huwasilisha maana ya kumpa mtu heshima na hudumisha utofautishaji na ἀτιμάζω.
- source_word: τὸν πατέρα μου
  choice: Baba yangu
  rationale: Katika muktadha wa Yohana, Yesu anamrejelea Mungu; herufi kubwa katika ‘Baba’ inaonyesha rejeo hilo bila kuongeza maelezo ndani ya kifungu.
- source_word: ἀτιμάζετέ
  choice: mnanivunjia heshima
  rationale: Usemi huu wa asili una maana ya kumkosea au kumnyima mtu heshima na unaendeleza kwa uwazi utofautishaji na ‘ninamheshimu.’
- source_word: με
  choice: -ni-
  rationale: Kiambishi cha yambwa katika ‘mnanivunjia’ kinawakilisha moja kwa moja ‘mimi’ kama anayevunjiwa heshima.
theological_decisions:
- issue: Rejeo la ‘Baba yangu’
  choice: ‘Baba’ limeandikwa kwa herufi kubwa likimrejelea Mungu katika usemi wa Yesu.
  alternative: ‘baba yangu’ kama rejeo la kawaida la kifamilia
  rationale: Muktadha wa karibu wa Injili ya Yohana humtambulisha Mungu kuwa Baba wa Yesu; herufi kubwa hufanya rejeo hilo liwe wazi bila kubadili maneno.
- issue: Maana ya ‘kuwa na pepo’
  choice: Nahau ya moja kwa moja ‘sina pepo’ imehifadhiwa katika matini kuu.
  alternative: ‘sijapagawa na pepo’
  rationale: Kigiriki kinasema moja kwa moja ‘sina pepo.’ Tafsiri ya kupagawa inaeleza maana inayowezekana lakini ni ya kifafanuzi zaidi, hivyo imewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. ‘Mimi’ huhifadhi mkazo wa kiwakilishi cha Kigiriki; ‘bali’ huonyesha utofautishaji mkali; ‘mnanivunjia heshima’ ni ya kawaida na hudumisha ulinganifu wa heshima dhidi ya kuvunjiwa heshima.
