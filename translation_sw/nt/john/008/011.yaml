  text: She[a] said, "No one, Lord." And Jesus said, "Neither do I condemn you; go, and sin no more."
translation:
  language: sw
  text: Naye akasema, “Hakuna mtu, Bwana.” Yesu akamwambia, “Wala mimi sikuhukumu kuwa na hatia. Nenda, na usitende dhambi tena.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Huu ndio mstari wa mwisho wa simulizi la mwanamke aliyekamatwa akizini (Yohana 7:53–8:11). Tazama maelezo kwenye Yohana 7:53.
    reason: textual_critical
lexical_decisions:
- source_word: κύριε
  choice: Bwana
  rationale: Neno hili la kumwita Yesu linaweza pia kuwa la heshima kama ‘bwana’, lakini ‘Bwana’ linahifadhi kwa kawaida utambuzi wa mamlaka yake bila kulazimisha maana zaidi ya muktadha.
- source_word: κατακρίνω
  choice: hukumu kuwa na hatia
  rationale: Hii inawasilisha maana ya kimahakama ya kutoa hukumu ya hatia dhidi ya mtu, inayofaa katika muktadha huu.
- source_word: μηκέτι ἁμάρτανε
  choice: tangu sasa usitende dhambi tena
  rationale: Kauli hii inaonyesha kuacha kutenda dhambi kuanzia wakati huu na kuendelea; ‘usitende dhambi tena’ ni ya asili na wazi kwa wasomaji wa Kiswahili.
- source_word: πορεύου
  choice: Nenda
  rationale: Amri fupi ‘Nenda’ inalingana moja kwa moja na Kiyunani na inasikika kwa kawaida katika Kiswahili.
theological_decisions:
- issue: Maana ya κύριε kama namna ya kumwita Yesu
  choice: Bwana
  alternative: bwana wangu / mheshimiwa
  rationale: ‘Bwana’ huhifadhi uwezekano wa heshima na wa kutambua mamlaka ya Yesu bila kufafanua kwa lazima kiwango cha uelewa wa mwanamke.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umewekwa wazi na wa kawaida, huku lugha ya kimahakama katika κατακρίνω na uzito wa muda katika μηκέτι vikihifadhiwa.
