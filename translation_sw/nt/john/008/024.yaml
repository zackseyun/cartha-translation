  yaml_path: translation/nt/john/008/024.yaml
  text: So I told you that you will die in your sins. For unless you believe that I am[a], you will die in your sins.
translation:
  language: sw
  text: Kwa hiyo niliwaambia kwamba mtakufa katika dhambi zenu. Kwa maana msipoamini kwamba mimi ndiye[a], mtakufa katika dhambi zenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya karibu zaidi na maneno ya Kigiriki, “kwamba mimi ni.” Kigiriki hakitaji kiarifu baada ya “mimi ni,” na usemi huu unaweza kuwa na mwangwi wa maana ya kina zaidi katika Injili ya Yohana.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπον οὖν ὑμῖν
  choice: Kwa hiyo niliwaambia
  rationale: οὖν inaunganisha kauli hii na yaliyotangulia kwa hitimisho; “Kwa hiyo” ni ya kawaida na wazi. εἶπον pamoja na ὑμῖν imetafsiriwa kwa kawaida kuwa “niliwaambia.”
- source_word: ἀποθανεῖσθε
  choice: mtakufa
  rationale: Ni wakati ujao wa ἀποθνῄσκω na humaanisha moja kwa moja “mtakufa”; “mtaangamia” ingeongeza maana isiyo lazima.
- source_word: ἐν ταῖς ἁμαρτίαις ὑμῶν
  choice: katika dhambi zenu
  rationale: Inahifadhi wingi wa ἁμαρτίαις na hali ya kubaki ndani ya dhambi; ni usemi wa kawaida na sahihi katika Kiswahili cha Biblia.
- source_word: ἐὰν γὰρ μὴ
  choice: Kwa maana msipo-
  rationale: “Kwa maana” huonyesha sababu inayoletwa na γάρ, na muundo wa masharti hasi “msipo-” huwasilisha ἐὰν μή kwa Kiswahili cha asili.
- source_word: πιστεύσητε
  choice: amini
  rationale: “Amini” ndilo neno la kawaida kwa πιστεύω katika muktadha wa Yohana, huku maana ya kumtumainia ikiweza kuwamo bila kuongezwa wazi.
- source_word: ὅτι ἐγώ εἰμι
  choice: kwamba mimi ndiye
  rationale: Kiswahili huhitaji kwa kawaida ukamilisho wa kujitambulisha; “mimi ndiye” huonyesha utambulisho bila kutaja kiarifu kisichokuwapo katika Kigiriki. Usomaji halisi zaidi “mimi niko” umehifadhiwa katika tanbihi ili kutofuta mwangwi mpana wa usemi huo katika Injili ya Yohana.
theological_decisions:
- issue: Kutafsiri usemi wa Yohana ἐγώ εἰμι usio na kiarifu kilichotajwa wazi
  choice: kwamba mimi ndiye
  alternative: kwamba mimi niko
  rationale: “Mimi ndiye” ni utambulisho wa asili katika Kiswahili lakini hautaji yeye ni nani, hivyo hauongezi kiarifu maalumu. Tanbihi huhifadhi umbo halisi zaidi “mimi niko” na uwezekano wa mwangwi wa kina wa kitheolojia bila kuamua maana hiyo kimabavu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Marudio ya “mtakufa katika dhambi zenu” yamehifadhiwa kama yalivyo katika Kigiriki. Kiashiria [a] kimewekwa mara tu baada ya usemi unaofafanuliwa.
