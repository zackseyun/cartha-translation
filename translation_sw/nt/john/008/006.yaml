  yaml_path: translation/nt/john/008/006.yaml
  text: They[a] were saying this to test him, so that they might have an accusation against him. But Jesus, bending down, wrote on the ground with his finger, paying no attention.
translation:
  language: sw
  text: Walisema hayo[a] ili kumjaribu, wapate shtaka dhidi yake. Lakini Yesu aliinama chini, akaandika ardhini kwa kidole chake, bila kuwatilia maanani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mstari huu ni sehemu ya simulizi la mwanamke aliyekutwa akifanya uzinzi (Yohana 7:53–8:11). Tazama maelezo katika Yohana 7:53.
    reason: textual_critical
lexical_decisions:
- source_word: πειράζοντες
  choice: ili kumjaribu
  rationale: Katika muktadha huu, neno linaonyesha jaribio lenye nia mbaya la kumtega Yesu ili wapate msingi wa shtaka; “kumjaribu” huhifadhi maana ya msingi bila kufafanua zaidi ya Kigiriki.
- source_word: κατηγορίαν
  choice: sababu ya kumshtaki
  rationale: Neno linahusu shtaka dhidi ya mtu. Muundo huu ni wa kawaida katika Kiswahili na unaonyesha kwamba walitaka msingi wa kuleta shtaka dhidi yake.
- source_word: κάτω κύψας
  choice: aliinama chini
  rationale: Huwakilisha kwa njia ya kawaida tendo la Yesu la kuinama kuelekea chini.
- source_word: ἔγραφεν εἰς τὴν γῆν
  choice: akaandika ardhini
  rationale: Kauli hii hutafsiri tendo la kuandika juu ya ardhi bila kudokeza alichoandika, ambacho chanzo hakitaji.
- source_word: μὴ προσποιούμενος
  choice: bila kuwajali
  rationale: Katika muktadha, kirai hiki kinaonyesha Yesu kutowapa usikivu. Tafsiri hii ni ya asili katika Kiswahili, ingawa usomaji huu haupo katika baadhi ya mapokeo ya maandishi.
theological_decisions:
- issue: Kusudi la jaribio lao
  choice: ili kumjaribu, wapate sababu ya kumshtaki
  alternative: ili kumtega, wapate shtaka dhidi yake
  rationale: “Kumjaribu” huhifadhi upana wa πειράζω, huku sentensi inayofuata ikibainisha nia yao mbaya bila kuingiza suluhisho maalumu la mtego wa kisheria au kisiasa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Kiashiria [a] kimewekwa baada ya “hayo” ili kisikatize kiwakilishi cha mwanzo. Muundo wa vitenzi mfululizo “aliinama … akaandika” ni wa kawaida na wazi kwa wasomaji wa kawaida.
