  text: Ἀπεκρίθησαν καὶ εἶπαν αὐτῷ· Ὁ πατὴρ ἡμῶν Ἀβραάμ ἐστιν. λέγει αὐτοῖς ὁ Ἰησοῦς· Εἰ τέκνα τοῦ Ἀβραάμ ⸀ἐστε, τὰ ἔργα τοῦ Ἀβραὰμ ⸀ἐποιεῖτε·
base_translation:
  language: en
  yaml_path: translation/nt/john/008/039.yaml
  text: They answered and said to him[a], “Abraham is our father.” Jesus says to them, “If you are Abraham’s children, you would be doing Abraham’s works.”
translation:
  language: sw
  text: Wakajibu, wakamwambia, “Baba yetu ni Abrahamu.” Yesu anawaambia, “Kama mngekuwa watoto wa Abrahamu, mngetenda matendo ya Abrahamu.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “Kama ni watoto wa Abrahamu, mnatenda matendo ya Abrahamu.” Kitenzi cha kwanza cha Kigiriki kiko katika wakati uliopo, na cha mwisho katika wakati usiotimilika. Muundo huu unaweza kueleweka kuwa unadokeza sharti lililo kinyume na uhalisi: “Kama mngekuwa watoto wa Abrahamu, mngetenda matendo ya Abrahamu.”'
    reason: Huhifadhi uwezekano wa kusoma sharti kwa namna ya moja kwa moja au kama sharti kinyume na uhalisi.
lexical_decisions:
- source_word: Ἀπεκρίθησαν καὶ εἶπαν αὐτῷ
  choice: Wakajibu wakamwambia
  rationale: Inahifadhi vitenzi viwili vya Kigiriki—kujibu na kusema—kwa muundo wa Kiswahili unaosikika wa kawaida.
- source_word: Ὁ πατὴρ ἡμῶν Ἀβραάμ ἐστιν
  choice: Baba yetu ni Abrahamu
  rationale: Ni mpangilio wa kawaida wa Kiswahili unaohifadhi dai lao la ukoo kwa Abrahamu.
- source_word: λέγει αὐτοῖς ὁ Ἰησοῦς
  choice: Yesu anawaambia
  rationale: Wakati uliopo unahifadhi uhai wa wakati uliopo wa kihistoria katika simulizi la Kigiriki.
- source_word: τέκνα τοῦ Ἀβραάμ
  choice: watoto wa Abrahamu
  rationale: Neno τέκνα linawahusu watoto bila kubainisha jinsia na linaonyesha uhusiano wa kifamilia.
- source_word: τὰ ἔργα τοῦ Ἀβραὰμ
  choice: matendo ya Abrahamu
  rationale: ‘Matendo’ ni ya kawaida na wazi katika Kiswahili, na yanahifadhi maana ya mwenendo unaolinganishwa na dai la kuwa watoto wake.
- source_word: Εἰ ... ἐστε ... ἐποιεῖτε
  choice: Kama mngekuwa ... mngekuwa mkitenda
  rationale: Muundo huu unaonyesha sharti linalodokeza hali iliyo kinyume na uhalisi na pia unahifadhi hali endelevu ya kitenzi cha mwisho.
theological_decisions:
- issue: Maana ya kuwa watoto wa Abrahamu katika jibu la Yesu
  choice: Lugha ya uhusiano na ukoo imetafsiriwa moja kwa moja, huku matendo yakitumika kama kipimo katika kauli ya Yesu.
  alternative: Kufafanua wazi kuwa Yesu anakataa ukoo wao wa kimwili au anazungumzia tu uana wa kiroho.
  rationale: Mstari unalinganisha dai lao la kuwa na Abrahamu kama baba na matendo yao; hautoi hapa ufafanuzi kamili wa aina ya uana unaokusudiwa. Tafsiri haipaswi kutatua mvutano huo kimadhehebu.
- issue: Nguvu ya sharti katika Εἰ ... ἐστε ... ἐποιεῖτε
  choice: Kama mngekuwa ... mngekuwa mkitenda
  alternative: Kama ninyi ni watoto wa Abrahamu, tendeni matendo ya Abrahamu / mnatenda matendo ya Abrahamu.
  rationale: Kitenzi cha mwisho cha wakati usiotimilika kinaweza kuashiria sharti lisilo halisi, lakini umbo la kwanza ni la wakati uliopo; tanbihi inahifadhi uwezekano wa usomaji wa moja kwa moja bila kuficha utata wa kisarufi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. ‘Mngekuwa mkitenda’ huhifadhi hali ya kuendelea ya ἐποιεῖτε, ingawa ‘mngefanya’ ni mbadala mfupi na wa kawaida zaidi.
