  text: ταῦτα αὐτοῦ λαλοῦντος πολλοὶ ἐπίστευσαν εἰς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/030.yaml
  text: As he was saying these things[b][a], many believed in him.
translation:
  language: sw
  text: Alipokuwa akisema mambo hayo[a], wengi walimwamini[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Alipokuwa akinena mambo hayo.”
    reason: lexical_alternative
  - marker: b
    text: Au, “wengi waliweka imani yao kwake.”
    reason: alternative_reading
lexical_decisions:
- source_word: ταῦτα
  choice: mambo hayo
  rationale: Kiwakilishi hiki cha wingi kinarejelea yaliyomo katika maneno ya Yesu yaliyotangulia; “mambo hayo” huhifadhi wingi na uhusiano wa kimuktadha kwa Kiswahili cha kawaida.
- source_word: αὐτοῦ λαλοῦντος
  choice: Alipokuwa akisema
  rationale: Muundo wa genitive absolute wenye kitenzi-nyambulisho cha wakati uliopo unaonyesha tendo lililokuwa likiendelea wakati uleule; “alipokuwa akisema” ni wa asili na hudumisha maana hiyo.
- source_word: πολλοὶ
  choice: wengi
  rationale: Kivumishi kimetumiwa kama nomino; “wengi” ni tafsiri fupi na ya kawaida bila kuongeza kirai kisichokuwapo wazi katika chanzo.
- source_word: ἐπίστευσαν
  choice: walimwamini
  rationale: Aoristi inaeleza tukio la kuamini kwa ujumla. Kiswahili huunganisha kwa kawaida kitenzi “amini” na yule anayeaminiwa kwa kiambishi cha yambwa.
- source_word: εἰς αὐτόν
  choice: -mwamini
  rationale: Katika muundo πιστεύω εἰς αὐτόν, imani inaelekezwa kwa Yesu binafsi. “Walimwamini” ni Kiswahili cha asili kinachowasilisha kumtegemea au kuweka imani kwake, si kukubali tu kwamba taarifa fulani ni kweli.
theological_decisions:
- issue: Tafsiri ya πιστεύω εἰς αὐτόν katika matumizi ya Yohana
  choice: walimwamini
  alternative: waliweka imani yao kwake
  rationale: “Walimwamini” huhifadhi mwelekeo wa imani kwa Yesu binafsi bila kuamua kimbele kina au kudumu kwa imani hiyo, jambo ambalo muktadha unaofuata unaweza kulichunguza. “Waliamini maneno yake” lingepunguza maana kuwa kukubali tu alichosema.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Akisema” ni cha kawaida na wazi; “akinena” limehifadhiwa kama badala katika tanbihi. Mpangilio wa alama za tanbihi umewekwa karibu na maneno yanayohusika.
