  yaml_path: translation/nt/john/008/043.yaml
  text: Why do you not understand my way of speaking? Because you are not able to hear my word[a][b].
translation:
  language: sw
  text: Kwa nini hamwelewi jinsi ninavyosema? Ni kwa sababu hamwezi kusikia neno langu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “usemi wangu” au “lugha yangu.” Neno la Kigiriki hapa linahusu namna ya Yesu ya kusema, likitofautishwa na “neno langu” katika kishazi kinachofuata.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαλιὰν
  choice: jinsi ninavyosema
  rationale: Kirai hiki cha asili kinahusu namna ya Yesu ya kusema, na tafsiri hii ya kawaida hutofautisha namna hiyo na ‘neno’ (λόγος) katika kishazi kinachofuata.
- source_word: γινώσκετε
  choice: hamwelewi
  rationale: Katika muktadha huu kitenzi kinamaanisha kufahamu usemi wa Yesu, si kumjua au kuutambua tu.
- source_word: ἀκούειν
  choice: kulisikia
  rationale: Maana ya msingi ni ‘kusikia.’ Tafsiri haiongezi moja kwa moja wazo la kukubali au kutii, ingawa muktadha unaweza kudokeza kutopokea ujumbe.
- source_word: λόγον
  choice: neno
  rationale: ‘Neno’ linaweza kumaanisha neno au ujumbe wa Yesu na linadumisha tofauti na namna yake ya kusema katika kishazi cha kwanza.
- source_word: οὐ δύνασθε
  choice: hamwezi
  rationale: Hii inaeleza kutoweza, si kutotaka tu; ‘hamwezi’ ni ya asili na wazi katika Kiswahili.
- source_word: ὅτι
  choice: Ni kwa sababu
  rationale: ὅτι inatoa sababu ya swali lililotangulia; ‘Ni kwa sababu’ huunganisha sentensi hizo kwa uwazi.
- source_word: τὴν ἐμὴν / τὸν ἐμόν
  choice: ninavyosema / langu
  rationale: Umilikaji umeonyeshwa kwa namna ya kawaida ya Kiswahili, huku ulinganifu wa ‘usemi wangu’ na ‘neno langu’ ukihifadhiwa kimaana.
theological_decisions:
- issue: Asili ya kutoweza katika ‘hamwezi kulisikia neno langu’
  choice: Kauli imetafsiriwa moja kwa moja kuwa kutoweza bila kueleza sababu yake ya kiteolojia.
  alternative: Kuitafsiri kama kutotaka kimaadili, kutiwa ugumu kwa hukumu, au kutokuwa na uwezo wa kiroho.
  rationale: Aya yenyewe inasema kuwa hawawezi, lakini haifafanui kikamilifu chanzo au utendaji wa hali hiyo. Tafsiri inadumisha mvutano huo bila kuamua mjadala ulio nje ya maneno ya aya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Jinsi ninavyosema’ ni ya kawaida kwa wasomaji wengi; ‘kulisikia neno langu’ huhifadhi taswira na utata wa asili bila kuibadili kuwa ‘kulikubali’ au ‘kulitii.’
