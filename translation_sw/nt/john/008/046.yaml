  yaml_path: translation/nt/john/008/046.yaml
  text: Which one of you convicts me of sin? If I speak the truth[c][b][a], why do you not believe me?
translation:
  language: sw
  text: Ni nani kati yenu ananiweka hatiani kwa dhambi?[a] Ikiwa ninasema kweli, kwa nini hamniamini?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ni nani kati yenu anayeonyesha kwamba nina dhambi?”
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa nini hamnitumaini?” Neno la Kigiriki linaweza kumaanisha kumwamini mtu anayesema au kumtumaini.
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς ἐξ ὑμῶν
  choice: Ni nani kati yenu
  rationale: Hii ni njia ya kawaida na ya moja kwa moja katika Kiswahili ya kuuliza ni mtu gani miongoni mwa wasikilizaji.
- source_word: ἐλέγχει με περὶ ἁμαρτίας
  choice: anayethibitisha kuwa nina hatia ya dhambi
  rationale: ἐλέγχω hapa ina nguvu ya kuthibitisha kosa au hatia, si kukemea tu. Muundo huu unaonyesha changamoto yenye mwelekeo wa kimahakama huku ukibaki wazi kuhusu dhambi kwa ujumla.
- source_word: εἰ ἀλήθειαν λέγω
  choice: Ikiwa ninasema kweli
  rationale: ‘Ikiwa’ huhifadhi umbo la sharti la εἰ bila kulibadili kimyakimya kuwa ‘kwa kuwa,’ ingawa swali lina nguvu ya hoja ya kimajibu.
- source_word: διὰ τί
  choice: kwa nini
  rationale: Hii ndiyo tafsiri ya kawaida na ya asili ya swali linalotaka sababu.
- source_word: πιστεύετέ μοι
  choice: hamniamini
  rationale: Muundo wa Kiswahili unahifadhi maana ya kumwamini msemaji, huku muktadha ukiruhusu pia wazo la kumtumaini.
theological_decisions:
- issue: Nguvu ya dai la Yesu kuhusu kutokuwa na dhambi na kusema kweli
  choice: Maswali yametafsiriwa moja kwa moja bila kufafanua dai lililodokezwa.
  alternative: ‘Je, kuna yeyote kati yenu anayeweza kuthibitisha kuwa nimetenda dhambi yoyote?’
  rationale: Tafsiri ya moja kwa moja huhifadhi changamoto kali ya Yesu na uhusiano anaoweka kati ya kutopatikana na hatia na ukweli wa maneno yake, bila kuongeza maelezo yasiyosemwa wazi katika Kigiriki.
- issue: Maana ya πιστεύω pamoja na yambwa katika hali ya dative
  choice: hamniamini
  alternative: hamnitumaini
  rationale: Kigiriki kinaweza kumaanisha kuamini ushuhuda wa mtu au kumtumaini mtu huyo. Maandishi makuu yanatumia usemi mpana wa kawaida, na tanbihi huhifadhi maana mbadala.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. ‘Kuthibitisha kuwa nina hatia’ hutumiwa badala ya istilahi nzito ya kisheria, na ‘hamniamini’ ni ya kawaida bila kuondoa maana inayowezekana ya kumtumaini.
