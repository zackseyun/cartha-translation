source:
  edition: SBLGNT
  text: εἶπεν ⸀οὖν ὁ Ἰησοῦς· Ὅταν ὑψώσητε τὸν υἱὸν τοῦ ἀνθρώπου, τότε γνώσεσθε ὅτι ἐγώ εἰμι, καὶ ἀπ’ ἐμαυτοῦ ποιῶ οὐδέν, ἀλλὰ καθὼς ἐδίδαξέν με ὁ ⸀πατὴρ ταῦτα λαλῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/028.yaml
  text: So Jesus said[a], “When you lift up the Son of Man, then you will know that I am he, and that I do nothing from myself, but just as the Father taught me[b], I speak these things.”
translation:
  language: sw
  text: Basi Yesu akasema, “Mtakapomwinua[a] Mwana wa Adamu, ndipo mtakapojua kwamba mimi ndiye[b], na kwamba sifanyi chochote kwa nafsi yangu mwenyewe, bali Baba alivyonifundisha, ndivyo ninavyosema mambo haya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Kumwinua” kunaweza kumaanisha kuinuliwa kimwili na pia kutukuzwa, kama neno hili linavyotumiwa katika Injili ya Yohana.
    reason: lexical_alternative
  - marker: b
    text: Kigiriki ni usemi wa “mimi ni” (ἐγώ εἰμι), bila kiarifu kilichotajwa wazi.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Basi
  rationale: Inaendeleza hoja kutokana na mazungumzo yaliyotangulia kwa kiunganishi cha kawaida na cha asili katika Kiswahili.
- source_word: Ὅταν ὑψώσητε
  choice: Mtakapomwinua
  rationale: 'Muundo huu unaelekeza kwenye tukio maalumu la wakati ujao. Kitenzi “-inua” kinahifadhi maana mbili zinazowezekana: kuinuliwa kimwili na kutukuzwa.'
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  rationale: Hili ndilo jina la cheo lililozoeleka katika Injili na linahifadhi mwangwi wake wa kimaandiko.
- source_word: τότε γνώσεσθε
  choice: ndipo mtakapojua
  rationale: “Ndipo” linaonyesha uhusiano wa wakati na matokeo, huku “mtakapojua” likieleza utambuzi wa baadaye.
- source_word: ἐγώ εἰμι
  choice: mimi ndiye
  rationale: Ni Kiswahili cha asili kwa usemi wenye kiarifu kilichoachwa wazi, bila kutaja moja kwa moja kiarifu ambacho Kigiriki hakikutaja. Usomaji wa neno kwa neno umewekwa katika tanbihi.
- source_word: ἀπ’ ἐμαυτοῦ ποιῶ οὐδέν
  choice: sifanyi chochote kwa kujitegemea mwenyewe
  rationale: Inaeleza kwamba chanzo au msukumo wa matendo si Yesu akiwa huru mbali na Baba; Kiswahili hiki ni cha kueleweka bila kuugeuza usemi kuwa dai kuhusu uwezo.
- source_word: καθὼς ἐδίδαξέν με ὁ πατὴρ
  choice: sawasawa na vile Baba alivyonifundisha
  rationale: “Sawasawa na vile” linahifadhi nguvu ya ulinganisho ya καθώς, na “Baba” linafaa katika muktadha wa Yohana.
- source_word: ταῦτα λαλῶ
  choice: ninasema mambo haya
  rationale: Linahifadhi kiwakilishi ταῦτα na kueleza kwa Kiswahili cha kawaida tendo la kunena mambo hayo.
theological_decisions:
- issue: Usemi usio na kiarifu dhahiri ἐγώ εἰμι
  choice: mimi ndiye
  alternative: mimi niko
  rationale: “Mimi ndiye” ni usemi wa kawaida wa Kiswahili lakini hauongezi utambulisho maalumu. Tanbihi inahifadhi umbo la Kigiriki lisilo na kiarifu na uwezekano wa mwangwi wa kujitambulisha kwa Mungu.
- issue: Maana ya ὑψώσητε katika Yohana
  choice: mtakapomwinua
  alternative: mtakapomsulubisha; mtakapomtukuza
  rationale: “Kumwinua” hakufungi maana kwenye kusulubishwa pekee wala kutukuzwa pekee, hivyo kinahifadhi mvutano wa kimakusudi wa lugha ya Yohana.
- issue: Uhusiano wa matendo na maneno ya Yesu na Baba
  choice: sifanyi chochote kwa kujitegemea mwenyewe ... Baba alivyonifundisha
  alternative: sifanyi chochote kwa mamlaka yangu mwenyewe
  rationale: Tafsiri inaonyesha utegemezi na asili ya utendaji bila kudai kwamba Yesu hana uwezo, wala kuingiza maelezo ya kimadhehebu kuhusu uhusiano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Sentensi imehifadhi mtiririko na marudio ya chanzo, huku miundo isiyo ya kawaida katika Kiswahili ikifanywa ieleweke. Alama za tanbihi zimewekwa mara tu baada ya maneno yanayohusika.
