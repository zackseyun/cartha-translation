  text: οἶδα ὅτι σπέρμα Ἀβραάμ ἐστε· ἀλλὰ ζητεῖτέ με ἀποκτεῖναι, ὅτι ὁ λόγος ὁ ἐμὸς οὐ χωρεῖ ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/037.yaml
  text: I know that you are Abraham’s offspring[a]; but you are seeking to kill me[b], because my word has no place in you.
translation:
  language: sw
  text: Ninajua kwamba ninyi ni uzao wa Abrahamu[a]. Lakini mnatafuta kuniua, kwa sababu neno langu halina nafasi ndani yenu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wazao wa Abrahamu.”
    reason: lexical_alternative
  - marker: b
    text: Au “neno langu halipati nafasi ndani yenu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σπέρμα Ἀβραάμ
  choice: uzao wa Abrahamu
  rationale: “Uzao” ni nomino ya kijumla inayoweza kueleza nasaba ya kimwili na hivyo kuhifadhi umoja wa σπέρμα bila kuigeuza moja kwa moja kuwa “watoto,” neno ambalo lingeweza kuingiza mapema maana ya uhusiano wa kiroho.
- source_word: ζητεῖτέ με ἀποκτεῖναι
  choice: mnatafuta kuniua
  rationale: Huhifadhi nguvu ya ζητέω pamoja na kitenzi-jina, na hali ya tendo linaloendelea ya wakati wa sasa, bila kuamua zaidi ya maandishi kama ni tamaa au jaribio pekee.
- source_word: ὁ λόγος ὁ ἐμὸς
  choice: neno langu
  rationale: Ni tafsiri ya moja kwa moja inayohifadhi msamiati wa Yohana na uwezekano wa maana pana kuliko “ujumbe wangu” au “ninayosema.”
- source_word: οὐ χωρεῖ ἐν ὑμῖν
  choice: halina nafasi ndani yenu
  rationale: Huhifadhi picha ya kutokuwepo kwa nafasi au upokeaji wa ndani, bila kuibana maana kuwa tu kutokuelewa, kutokushika, au kutosonga mbele.
- source_word: ἀλλὰ
  choice: lakini
  rationale: Inaonyesha wazi utofauti mkubwa kati ya kukubaliwa kwa nasaba yao na nia yao ya kumuua Yesu.
- source_word: οἶδα ὅτι
  choice: ninajua kwamba
  rationale: Ni uwasilishaji wa kawaida na wa moja kwa moja wa kishazi cha Kigiriki.
theological_decisions:
- issue: Uhusiano kati ya nasaba ya kimwili kutoka kwa Abrahamu na kuwa kweli sambamba na Abrahamu
  choice: 'Kutafsiri σπέρμα Ἀβραάμ kwa maana dhahiri ya nasaba: “uzao wa Abrahamu.”'
  alternative: “watoto wa Abrahamu”
  rationale: Katika muktadha huu Yesu anakubali nasaba yao ya kimwili huku akipinga mwenendo wao. “Uzao” hudumisha mvutano huo bila kuingiza mapema tofauti kati ya watoto wa kimwili na wa kiroho inayoendelezwa katika mistari inayofuata.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Ndani yenu” limetumiwa badala ya “miongoni mwenu” ili kuhifadhi kwa kadiri iwezekanavyo picha ya upokeaji wa ndani inayowezekana katika ἐν ὑμῖν. Alama zote za tanbihi zimo katika maandishi makuu.
