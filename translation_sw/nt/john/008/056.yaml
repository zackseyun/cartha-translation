  text: Ἀβραὰμ ὁ πατὴρ ὑμῶν ἠγαλλιάσατο ἵνα ἴδῃ τὴν ἡμέραν τὴν ἐμήν, καὶ εἶδεν καὶ ἐχάρη.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/056.yaml
  text: Abraham your father rejoiced to see my day[b][a]; he saw it and was glad.
translation:
  language: sw
  text: Abrahamu, baba yenu, alishangilia kuiona siku yangu.[a][b] Aliiona, akafurahi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alishangilia ili aione siku yangu,” au “alishangilia kwamba angeiona siku yangu.” Kishazi cha Kigiriki kinaweza kutafsiriwa kwa njia kadhaa zinazokaribiana.
    reason: lexical_alternative
  - marker: b
    text: “Siku yangu” huenda ikarejelea kwa upana siku ya Yesu au utimilifu wa ahadi za Kimasihi; mstari wenyewe hauelezi hasa tukio au wakati unaokusudiwa.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀβραὰμ
  choice: Abrahamu
  rationale: Hili ndilo umbo la kawaida la jina la mzee huyo katika Kiswahili cha Biblia.
- source_word: ὁ πατὴρ ὑμῶν
  choice: baba yenu
  rationale: Ni Kiswahili cha kawaida kinachohifadhi uhusiano ambao Yesu anautaja kati ya Abrahamu na wasikilizaji wake.
- source_word: ἠγαλλιάσατο
  choice: alishangilia
  rationale: Kitenzi hiki huonyesha furaha kubwa; “alishangilia” ni cha asili na chenye nguvu kuliko “alifurahi” pekee.
- source_word: ἵνα ἴδῃ
  choice: kwa kutazamia kuiona
  rationale: Huhifadhi mwelekeo wa mbele wa hamu na matarajio, huku tanbihi ikionyesha uwezekano wa kuelewa kishazi kama kusudi au jambo lililosababisha shangwe.
- source_word: τὴν ἡμέραν τὴν ἐμήν
  choice: siku yangu
  rationale: Tafsiri ya karibu na ya kawaida inayohifadhi maana pana ya kiteolojia bila kutaja tukio fulani.
- source_word: καὶ εἶδεν
  choice: Aliiona
  rationale: Kiambishi cha kitu “-i-” kinarejelea wazi siku iliyotajwa, kama inavyodokezwa na Kigiriki.
- source_word: καὶ ἐχάρη
  choice: akafurahi
  rationale: Hutofautisha χαίρω na ἀγαλλιάω ya awali, bila kurudia “alishangilia.”
theological_decisions:
- issue: Maana ya “siku yangu” katika kauli ya Yesu kuhusu Abrahamu
  choice: Kuhifadhi maneno halisi “siku yangu” bila kutaja tukio au wakati maalumu.
  alternative: Kuitafsiri kuwa siku ya kuzaliwa kwa Yesu, huduma yake duniani, utimilifu wa Kimasihi, kifo na ufufuo wake, au siku ya mwisho.
  rationale: Mstari wenyewe haubainishi hasa siku hiyo ni ipi; tafsiri haipaswi kuondoa upana huo wa maana.
- issue: Nguvu ya ἵνα katika shangwe ya Abrahamu
  choice: “kwa kutazamia kuiona,” ikionyesha matarajio ya mbele.
  alternative: “ili aione,” “kwamba angeiona,” au “kuiona.”
  rationale: Kishazi cha ἵνα kinaweza kueleweka kama kusudi au kama kijalizo kinachoeleza jambo lililomshangilisha; tanbihi huhifadhi uwezekano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Kwa kutazamia kuiona” ni wazi kwa msomaji wa kawaida na huonyesha matarajio bila kuyafanya kuwa tafsiri pekee; alama zote za tanbihi zimewekwa katika matini.
