  text: ⸀Ἀπεκρίθησαν οἱ Ἰουδαῖοι καὶ εἶπαν αὐτῷ· Οὐ καλῶς λέγομεν ἡμεῖς ὅτι Σαμαρίτης εἶ σὺ καὶ δαιμόνιον ἔχεις;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/048.yaml
  text: The Jews answered and said to him[c][b][a], “Are we not right in saying that you are a Samaritan and have a demon?”
translation:
  language: sw
  text: Wayahudi[a] wakajibu, wakamwambia, “Je, sisi hatusemi kwa usahihi kwamba wewe ni Msamaria na una pepo[c]?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, katika baadhi ya miktadha, “Wayudea” au “viongozi wa Kiyahudi.” Katika Injili ya Yohana, “Wayahudi” mara nyingi humaanisha kundi fulani lililompinga Yesu, wala si kila Myahudi bila ubaguzi.
    reason: alternative_reading
  - marker: b
    text: Au, “Je, sisi hatusemi sawa kwamba …?”
    reason: lexical_alternative
  - marker: c
    text: Kihalisi, “una pepo”; baadhi ya tafsiri hufafanua zaidi kuwa “umepagawa na pepo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπεκρίθησαν
  choice: wakamjibu
  rationale: Kitenzi hiki chenye umbo la wakati uliopita humaanisha ‘walijibu.’ ‘Wakamjibu’ kinafuata mtiririko wa simulizi na kinaonyesha wazi kuwa walikuwa wakimjibu Yesu.
- source_word: οἱ Ἰουδαῖοι
  choice: Wayahudi
  rationale: Kigiriki kinasema moja kwa moja ‘Wayahudi.’ Ingawa katika Injili ya Yohana neno hili mara nyingi humaanisha kundi fulani la Wayahudi waliompinga Yesu, mstari huu wenyewe hausemi wazi ‘viongozi wa Kiyahudi’ wala ‘Wayudea’; kwa hiyo maana hiyo haijawekwa kwa lazima katika matini kuu.
- source_word: εἶπαν αὐτῷ
  choice: na kumwambia
  rationale: Huhifadhi kitenzi cha pili cha usemi kilicho katika Kigiriki, hata kama katika Kiswahili kuna urudiaji fulani baada ya ‘wakamjibu.’ Muundo huu bado ni wa kawaida na unaeleweka katika usimulizi wa kibiblia.
- source_word: Οὐ καλῶς λέγομεν ἡμεῖς
  choice: Je, si sawa tunaposema
  rationale: Swali hasi linatarajia jibu la kukubali. Muundo huu ni Kiswahili cha kawaida na huhifadhi wazo la kusema kwa usahihi au kwa haki bila kufanya sentensi kuwa nzito.
- source_word: Σαμαρίτης
  choice: Msamaria
  rationale: Ni jina la moja kwa moja la utambulisho wa kikabila na kidini, linalotumiwa hapa kama shutuma.
- source_word: δαιμόνιον ἔχεις
  choice: una pepo
  rationale: Hii hufuata kwa karibu maana halisi ya Kigiriki, ‘una pepo,’ badala ya kuifafanua zaidi kuwa ‘umepagawa na pepo.’
theological_decisions:
- issue: Kirejelewa cha οἱ Ἰουδαῖοι katika Yohana
  choice: Wayahudi
  alternative: Wayudea; viongozi wa Kiyahudi
  rationale: Matini kuu inafuata usemi wa Kigiriki bila kuamua kimya-kimya kuwa ni viongozi pekee au wakazi wa Yudea. Tanbihi inaeleza kuwa katika Yohana neno hili mara nyingi hurejelea kundi maalumu la wapinzani wa Yesu, si kila Myahudi bila ubaguzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Urudiaji wa ‘wakamjibu na kumwambia’ umehifadhiwa ili kuakisi vitenzi vyote viwili vya Kigiriki, huku swali lenyewe likiwekwa katika muundo wa kawaida wa Kiswahili.
