  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ⸀εἶπεν αὐτοῖς ὁ Ἰησοῦς· Εἰ ὁ θεὸς πατὴρ ὑμῶν ἦν ἠγαπᾶτε ἂν ἐμέ, ἐγὼ γὰρ ἐκ τοῦ θεοῦ ἐξῆλθον καὶ ἥκω· οὐδὲ γὰρ ἀπ’ ἐμαυτοῦ ἐλήλυθα, ἀλλ’ ἐκεῖνός με ἀπέστειλεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/042.yaml
  text: Jesus said to them[a], “If God were your Father, you would love me, because I came from God and am here. For I have not come from myself[b], but he sent me.”
translation:
  language: sw
  text: Yesu akawaambia, “Kama Mungu angekuwa Baba yenu, mngenipenda, kwa sababu nilitoka kwa Mungu nami niko hapa.[a] Kwa maana sikuja kwa nafsi yangu mwenyewe,[b] bali yeye ndiye aliyenituma.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa muundo rasmi zaidi, “nilitoka kwa Mungu na nimekuja.”
    reason: lexical_alternative
  - marker: b
    text: Au, “sikuja kutoka kwangu mwenyewe” au “sikuja kwa uamuzi wangu mwenyewe.” Kigiriki kinaweza kukazia chanzo au kwamba hakuja kwa kujitegemea.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ ... ἦν ... ἠγαπᾶτε ἂν
  choice: Kama Mungu angekuwa Baba yenu, mngenipenda
  rationale: Muundo huu ni sharti lisilo halisi; ‘angekuwa ... mngenipenda’ huwasilisha kwa Kiswahili cha kawaida hali inayokanushwa katika muktadha.
- source_word: θεὸς πατὴρ ὑμῶν
  choice: Mungu angekuwa Baba yenu
  rationale: ‘Baba’ ni jina la uhusiano wa kimungu hapa, na muundo huu ni wa asili katika Kiswahili.
- source_word: ἐκ τοῦ θεοῦ ἐξῆλθον καὶ ἥκω
  choice: nilitoka kwa Mungu nami niko hapa
  rationale: ‘Nilitoka kwa Mungu’ huhifadhi wazo la asili au chanzo bila kuingiza istilahi za kiteolojia za baadaye; ‘nami niko hapa’ huonyesha kufika pamoja na hali ya sasa inayodokezwa na ἥκω.
- source_word: οὐδὲ γὰρ ἀπ’ ἐμαυτοῦ ἐλήλυθα
  choice: Kwa maana sikuja kwa uamuzi wangu mwenyewe
  rationale: Katika Kiswahili, tafsiri ya neno kwa neno ‘kutoka kwangu mwenyewe’ inaweza kueleweka vibaya kuwa mahali alikotoka. ‘Kwa uamuzi wangu mwenyewe’ huwasilisha kwa uwazi wazo la kutotenda kwa msukumo au mamlaka binafsi; maana ya chanzo imehifadhiwa katika tanbihi.
- source_word: ἀλλ’ ἐκεῖνός με ἀπέστειλεν
  choice: bali yeye ndiye aliyenituma
  rationale: ‘Yeye ndiye’ huhifadhi mkazo wa ἐκεῖνος, huku ‘aliyenituma’ ikidumisha lugha ya utume.
theological_decisions:
- issue: Lugha kuhusu asili ya Yesu bila kufafanua kupita kiasi kwa makundi ya mafundisho ya baadaye
  choice: nilitoka kwa Mungu nami niko hapa
  alternative: nilitoka kwa Mungu na nimekuja
  rationale: Tafsiri inathibitisha asili na utume wa Yesu kama mstari unavyosema, lakini haitumii istilahi za kiimani za baadaye ambazo kitenzi cha Kigiriki chenyewe hakilazimishi.
- issue: Maana ya ἀπ’ ἐμαυτοῦ
  choice: sikuja kwa uamuzi wangu mwenyewe
  alternative: sikuja kutoka kwangu mwenyewe
  rationale: Kirai kinaweza kukazia chanzo au hatua ya kujitegemea. Matini kuu inatanguliza Kiswahili kinachoeleweka na wazo la kutotenda kwa kujianzishia; tanbihi huhifadhi uwezekano wa mkazo wa chanzo na mvutano wake na ‘nilitoka kwa Mungu.’
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ‘angekuwa ... mngenipenda’ ni wa kawaida na huonyesha sharti lisilo halisi. ‘Yeye ndiye’ huhifadhi mkazo wa kiwakilishi cha Kigiriki. Alama zote za tanbihi zimewekwa katika matini kuu.
