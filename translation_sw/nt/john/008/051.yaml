base_translation:
  language: en
  yaml_path: translation/nt/john/008/051.yaml
  text: Truly, truly, I say to you, if anyone keeps my word, he will certainly never see death forever.
translation:
  language: sw
  text: Kweli, kweli, nawaambia, mtu yeyote akilishika neno langu hataona kifo kamwe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: Kweli kabisa
  rationale: Marudio ya Kiyunani yanasisitiza uhakika na uzito wa tamko; Kiswahili cha asili huwasilisha msisitizo huo kwa “kweli kabisa” bila kuwa kizito kwa kurudia neno.
- source_word: τηρήσῃ
  choice: akilishika
  rationale: Katika muktadha huu maana ni kulizingatia, kulitii, na kudumu katika neno la Yesu; “kulishika” huhifadhi upana huo.
- source_word: τὸν ἐμὸν λόγον
  choice: neno langu
  rationale: Hufuata umoja wa λόγον na lugha ya kawaida ya Yohana kuhusu ujumbe au mafundisho ya Yesu.
- source_word: θάνατον ... θεωρήσῃ
  choice: hataona kifo
  rationale: Hudumisha sitiari ya chanzo badala ya kuifafanua kuwa “hatakufa,” jambo ambalo lingeondoa mvutano wa kimakusudi katika muktadha.
- source_word: οὐ μὴ ... εἰς τὸν αἰῶνα
  choice: kamwe
  rationale: Muundo huu ni ukano wenye nguvu unaomaanisha “kamwe”; Kiswahili “kamwe” huwasilisha nguvu na upeo wa usemi kwa kawaida.
theological_decisions:
- issue: Maana ya “hataona kifo” licha ya waamini kufa kimwili
  choice: Sitiari imehifadhiwa bila kufafanuliwa ndani ya aya.
  alternative: “Hatakufa milele” au “hatapata kifo cha milele.”
  rationale: Chanzo kinasema “kuona kifo,” na muktadha wa Yohana unaacha mvutano kati ya kifo cha kimwili na uzima wa milele; tafsiri haipaswi kuamua kimya-kimya kuwa aina fulani tu ya kifo ndiyo inayokusudiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Nawaambia” ni ya kawaida na wazi; “mtu yeyote” huhifadhi wigo wa ἐάν τις.
