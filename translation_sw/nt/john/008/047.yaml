  text: ὁ ὢν ἐκ τοῦ θεοῦ τὰ ῥήματα τοῦ θεοῦ ἀκούει· διὰ τοῦτο ὑμεῖς οὐκ ἀκούετε ὅτι ἐκ τοῦ θεοῦ οὐκ ἐστέ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/047.yaml
  text: The one who is from God hears the words of God[a]. For this reason you do not hear[b], because you are not from God.
translation:
  language: sw
  text: Yule anayetoka kwa Mungu huyasikia maneno ya Mungu. Ndiyo sababu ninyi hamsikii, kwa kuwa hamtoki kwa Mungu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ὢν
  choice: Yule aliye
  rationale: Kirai hiki chenye kibainishi na kitenzi-jina kinamtaja mtu wa aina fulani kwa umoja; “Yule aliye” huhifadhi muundo huo kwa Kiswahili cha kawaida.
- source_word: ἐκ τοῦ θεοῦ
  choice: aliyetoka kwa Mungu / hamjatoka kwa Mungu
  rationale: ἐκ huonyesha chanzo au asili. Kiswahili “kutoka kwa Mungu” ni cha asili na huhifadhi tofauti ya Kiyohana bila kuibadili kuwa umiliki tu.
- source_word: τὰ ῥήματα τοῦ θεοῦ
  choice: maneno ya Mungu
  rationale: ῥήματα ni wingi unaomaanisha maneno au yale yanenwayo; “maneno ya Mungu” ni wazi, yenye heshima, na ya kawaida.
- source_word: ἀκούει / ἀκούετε
  choice: huyasikia / hamsikii
  rationale: “Kusikia” huhifadhi maana ya msingi na urudiaji wa kitenzi katika mstari. Muktadha unaweza kudokeza kupokea au kutii, lakini hilo halijaingizwa moja kwa moja katika tafsiri.
- source_word: διὰ τοῦτο
  choice: Ndiyo sababu
  rationale: Hutoa kwa kawaida uhusiano wa sababu au hitimisho unaoonyeshwa na kirai cha Kigiriki.
- source_word: ὑμεῖς
  choice: ninyi
  rationale: Kiwakilishi kimeelezwa wazi katika Kigiriki kwa mkazo; “ninyi” huhifadhi mkazo huo.
- source_word: ὅτι
  choice: kwa kuwa
  rationale: Hapa ὅτι inaeleweka vizuri zaidi kwa maana ya kisababishi, ikieleza kwa nini hawasikii.
- source_word: ἐκ τοῦ θεοῦ οὐκ ἐστέ
  choice: hamjatoka kwa Mungu
  rationale: Huhifadhi lugha ya chanzo/asili ya ἐκ pamoja na hali ya sasa inayosemwa kuhusu wasikilizaji; umbo la Kiswahili ni la kawaida na halifungii usemi katika mfumo maalumu wa mafundisho.
theological_decisions:
- issue: Maana ya kuwa “kutoka kwa Mungu”
  choice: Kuhifadhi usemi wa chanzo/asili, “kutoka kwa Mungu.”
  alternative: Kuwa wa Mungu; kuzaliwa na Mungu kwa maana maalumu ya wokovu.
  rationale: Mstari wenyewe hutumia lugha ya chanzo na huacha upeo wake wa kitheolojia uamuliwe na muktadha mpana; tafsiri haipaswi kuufungia katika fundisho moja maalumu.
- issue: Nguvu ya ἀκούω
  choice: Kutafsiri “kusikia.”
  alternative: Kusikiliza; kutii.
  rationale: Katika muktadha kusikia kwa kweli huenda kukahusisha kuitikia, lakini kitenzi chenyewe ni “kusikia”; tafsiri huhifadhi mvutano huo.
- issue: Maana ya ὅτι
  choice: 'Kuisoma kwa maana ya kisababishi: “kwa kuwa.”'
  alternative: 'Kuisoma kama “kwamba”: “hamsikii kwamba hamjatoka kwa Mungu.”'
  rationale: Maana ya kisababishi inafaa zaidi katika hoja ya sentensi, ingawa kimuundo maana ya “kwamba” inawezekana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa moja kwa moja na unaeleweka kwa msomaji wa kawaida. “Huyasikia” hurejelea wazi “maneno,” huku “ninyi” ikihifadhi mkazo wa kiwakilishi cha Kigiriki.
