  text: '[a] Katika Sheria yetu, Musa aliamuru wanawake wa namna hiyo wapigwe mawe. Basi, wewe unasema nini?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mwendelezo wa simulizi la mwanamke aliyekutwa katika uzinzi (Yohana 7:53–8:11). Tazama tanbihi ya Yohana 7:53.
    reason: textual_critical
lexical_decisions:
- source_word: Ἐν δὲ τῷ νόμῳ ἡμῶν
  choice: Lakini katika Sheria yetu
  rationale: δὲ huonyesha mwendelezo wenye utofautishaji mdogo; “Lakini” ni kiunganishi cha kawaida hapa. “Sheria” imetumiwa kwa herufi kubwa kumaanisha Sheria ya Musa.
- source_word: τὰς τοιαύτας
  choice: wanawake wa namna hiyo
  rationale: Kivumishi hiki ni cha kike, wingi, na katika muktadha kinarejelea wanawake wa aina hiyo, yaani waliopatikana katika uzinzi, bila kuongeza maelezo hayo moja kwa moja katika mstari.
- source_word: ἐνετείλατο
  choice: aliamuru
  rationale: Huwasilisha agizo lenye mamlaka lililohusishwa na Musa.
- source_word: λιθοβολεῖσθαι
  choice: wapigwe mawe
  rationale: Ni usemi wa kawaida wa Kiswahili kwa adhabu ya kuua kwa mawe; hali ya kutendwa ya infinitivu ya Kigiriki imehifadhiwa.
- source_word: σὺ οὖν τί λέγεις;
  choice: Basi, wewe wasemaje?
  rationale: “Basi” huwakilisha οὖν kama hitimisho au changamoto inayotokana na dai lililotangulia; “wewe” imewekwa wazi ili kuhifadhi msisitizo wa σὺ.
theological_decisions:
- issue: Je, kutaja “wanawake” kunapanua au kuficha madai ya wasemaji kuhusu Sheria ya Musa?
  choice: wanawake wa namna hiyo
  alternative: watu wa namna hiyo
  rationale: Umbo la Kigiriki τὰς τοιαύτας ni la kike wingi, kwa hiyo tafsiri inalinda dai lao kama lilivyotamkwa bila kulisahihisha kwa kuingiza masharti mengine ya sheria kuhusu wahusika wa uzinzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Wasemaje?” ni kifupi cha heshima na cha kawaida katika matini ya kibiblia; msisitizo uko kwa “wewe.” Alama [a] imewekwa mwanzoni ili kuhusisha mstari mzima na tanbihi ya uhakiki wa matini.
