id: JHN.8.23
reference: John 8:23
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ⸀ἔλεγεν αὐτοῖς· Ὑμεῖς ἐκ τῶν κάτω ἐστέ, ἐγὼ ἐκ τῶν ἄνω εἰμί· ὑμεῖς ἐκ ⸂τούτου τοῦ κόσμου⸃ ἐστέ, ἐγὼ οὐκ εἰμὶ ἐκ τοῦ κόσμου τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/023.yaml
  text: And he was saying to them[a], “You are from below; I am from above. You are from this world[b]; I am not from this world.”
translation:
  language: sw
  text: Naye aliwaambia, “Nyinyi mnatoka chini; mimi natoka juu.[a] Nyinyi mnatoka katika ulimwengu huu;[b] mimi sitoki katika ulimwengu huu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nyinyi ni wa yaliyo chini; mimi ni wa yaliyo juu.”
    reason: lexical_alternative
  - marker: b
    text: Katika Injili ya Yohana, “ulimwengu” mara nyingi haumaanishi dunia ya kimwili tu, bali pia mpangilio wa wanadamu waliojitenga na Mungu.
    reason: cultural_note
lexical_decisions:
- source_word: ἔλεγεν
  choice: aliwaambia
  rationale: Kauli hii ya kawaida ya Kiswahili inatambulisha maneno yaliyofuata kwa ufasaha. Ingawa wakati usiotimilifu wa Kigiriki unaweza kuonyesha tendo lililoendelea, hapa muktadha haudai tafsiri nzito kama ‘aliendelea kuwaambia’.
- source_word: Ὑμεῖς / ἐγὼ
  choice: Nyinyi / mimi
  rationale: Viwakilishi vilivyo wazi vimehifadhiwa ili kusisitiza tofauti kali iliyomo katika Kigiriki kati ya wasikilizaji na Yesu.
- source_word: ἐκ τῶν κάτω / ἐκ τῶν ἄνω
  choice: mnatoka chini / natoka juu
  rationale: ‘Kutoka’ huhifadhi wazo la chanzo au asili katika ἐκ, huku ‘chini’ na ‘juu’ vikidumisha taswira ya mielekeo miwili bila kuifafanua kupita kiasi kuwa ya kimaadili au ya maeneo mahususi.
- source_word: κόσμος
  choice: ulimwengu
  rationale: ‘Ulimwengu’ ni neno pana na la kawaida linaloweza kumaanisha dunia na pia mpangilio wa kibinadamu; hivyo linaacha maana ya Kiyohana ibainishwe na muktadha.
- source_word: τούτου τοῦ κόσμου / τοῦ κόσμου τούτου
  choice: ulimwengu huu
  rationale: Kiashiria ‘huu’ kimehifadhiwa katika sehemu zote mbili, na mpangilio wa maneno ni wa kawaida katika Kiswahili.
- source_word: οὐκ εἰμὶ ἐκ τοῦ κόσμου τούτου
  choice: mimi sitoki katika ulimwengu huu
  rationale: Tafsiri hii inahifadhi muundo unaorudiwa wa ἐκ na mkazo wa chanzo, badala ya kuubadili moja kwa moja kuwa kauli ya kuwa sehemu ya ulimwengu.
theological_decisions:
- issue: Maana ya tofauti kati ya ‘chini/juu’ na ‘ulimwengu huu’
  choice: Lugha ya chanzo na taswira ya juu na chini imehifadhiwa bila kuongezewa ufafanuzi wa kimafundisho.
  alternative: Tafsiri ingeweza kutaja wazi tofauti ya kimaadili au ya mbinguni dhidi ya duniani.
  rationale: Kigiriki kinaweka tofauti ya Kiyohana iliyo kali, lakini hakifafanui hapa kwa maneno ya moja kwa moja kila upande wa taswira hiyo. Tafsiri inapaswa kuhifadhi mvutano huo wa kiteolojia na upekee wa Yesu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ‘anatoka katika…’ ni wa kawaida kwa kueleza chanzo au asili, na urudiaji wake unadumisha ulinganifu wa sentensi ya Kigiriki.
