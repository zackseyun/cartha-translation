  text: πολλὰ ἔχω περὶ ὑμῶν λαλεῖν καὶ κρίνειν· ἀλλ’ ὁ πέμψας με ἀληθής ἐστιν, κἀγὼ ἃ ἤκουσα παρ’ αὐτοῦ ταῦτα ⸀λαλῶ εἰς τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/026.yaml
  text: I have many things to say and to judge concerning you[a]. But the one who sent me is true, and what I heard from him[b], these things I speak to the world.
translation:
  language: sw
  text: Nina mambo mengi ya kusema na ya kuhukumu kuwahusu ninyi. Lakini yule aliyenituma ni wa kweli, nami, mambo niliyoyasikia kwake, hayo ndiyo ninayoyasema kwa ulimwengu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολλὰ
  choice: mambo mengi
  rationale: Kivumishi cha wingi kisicho na nomino kimetumiwa kama nomino; “mambo mengi” ni Kiswahili cha kawaida na huhifadhi wingi wake.
- source_word: περὶ ὑμῶν
  choice: kuwahusu ninyi
  rationale: περί pamoja na jenitivi huonyesha mada au rejeleo. “Kuwahusu ninyi” ni ya asili na msisitizo wa kiwakilishi unawakilisha ὑμῶν.
- source_word: λαλεῖν
  choice: ya kusema
  rationale: Katika jozi ya vitenzi visivyo na kikomo, “kusema” husikika kwa kawaida pamoja na “kuhukumu” na huwakilisha tendo la kunena.
- source_word: κρίνειν
  choice: ya kuhukumu
  rationale: “Kuhukumu” huhifadhi maana pana ya κρίνω bila kuibana iwe “kulaani,” jambo ambalo muktadha haulazimishi.
- source_word: ὁ πέμψας με
  choice: yule aliyenituma
  rationale: Kirai cha participio chenye artikeli kimetafsiriwa kwa kirai cha kawaida cha Kiswahili bila kumtaja Baba moja kwa moja, kwa kuwa jina hilo halipo katika sentensi ya Kigiriki.
- source_word: ἀληθής
  choice: wa kweli
  rationale: “Wa kweli” huhifadhi uwezekano wa kumaanisha mwenye kusema kweli, wa kuaminika, au halisi bila kuufanya usemi kuwa mwembamba kupita kiasi.
- source_word: ἃ ἤκουσα παρ’ αὐτοῦ
  choice: mambo yale niliyosikia kwake
  rationale: Kirai hiki hueleza yaliyosikiwa kutoka kwa mtumaji; “kwake” ni njia ya kawaida ya kueleza chanzo cha kibinafsi katika Kiswahili.
- source_word: ταῦτα
  choice: mambo yale
  rationale: Kionyeshi cha Kigiriki kimehifadhiwa ili kurejelea kwa msisitizo yaliyotangulia, ingawa mpangilio wa Kiswahili umeunganisha kirai hicho na kiambishi cha yambwa katika “ninauambia.”
- source_word: λαλῶ
  choice: ninauambia
  rationale: Kitenzi cha wakati uliopo kimewasilishwa kama tendo la sasa; muundo wa “kuambia ulimwengu mambo” ni wa asili zaidi katika Kiswahili kuliko “kusema mambo kwa ulimwengu.”
- source_word: εἰς τὸν κόσμον
  choice: ulimwengu
  rationale: Baada ya “ninauambia,” ulimwengu unaelezwa kama hadhira ya ujumbe. Hii inahifadhi mwelekeo wa εἰς kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Mrejelewa wa “yule aliyenituma”
  choice: Mrejelewa, yaani Baba, ameachwa akieleweka kutokana na muktadha bila kutajwa wazi katika tafsiri.
  alternative: Lakini Baba aliyenituma ni wa kweli.
  rationale: Muktadha wa Yohana humtambulisha mtumaji, lakini Kigiriki hakitumii nomino “Baba” katika mstari huu; hivyo tafsiri haiongezi jina lisilokuwamo.
- issue: Nguvu ya κρίνειν
  choice: kuhukumu
  alternative: kulaani; kutoa hukumu juu yenu
  rationale: κρίνω ina wigo mpana wa kuamua au kuhukumu. “Kuhukumu” huhifadhi upana huo bila kudai kwamba hapa maana yake lazima iwe kulaani.
- issue: Maana ya ἀληθής
  choice: wa kweli
  alternative: mwaminifu; mwenye kusema kweli
  rationale: Usemi mpana “wa kweli” huhifadhi mvuto wa kiteolojia wa lugha ya Yohana na utata halisi kati ya ukweli, uaminifu, na uhalisi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umefanywa kuwa wa kawaida kwa Kiswahili kwa kutumia “ninauambia ulimwengu mambo yale,” huku maana na msisitizo wa ταῦτα vikihifadhiwa. Hakuna tanbihi iliyohitajika kwa sababu tofauti za kimsamiati zinaweza kuhifadhiwa katika maandishi na maamuzi ya tafsiri bila kulemea mstari.
