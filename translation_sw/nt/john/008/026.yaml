    issue: The explicit demonstrative ταῦτα is not independently represented in the final clause.
    rationale: In “ninauambia ulimwengu mambo yale niliyosikia kwake,” “mambo yale” represents the things heard, but it does not clearly retain the Greek's resumption, ‘what I heard from him—these things I speak.’ A Swahili resumptive “hayo ndiyo” preserves this emphasis naturally.
