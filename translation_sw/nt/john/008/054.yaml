id: JHN.8.54
reference: John 8:54
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς· Ἐὰν ἐγὼ ⸀δοξάσω ἐμαυτόν, ἡ δόξα μου οὐδέν ἐστιν· ἔστιν ὁ πατήρ μου ὁ δοξάζων με, ὃν ὑμεῖς λέγετε ὅτι θεὸς ⸀ἡμῶν ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/john/008/054.yaml
  text: Jesus answered[a], “If I glorify myself, my glory is nothing. My Father is the one who glorifies me, he whom you say is our God,”
translation:
  language: sw
  text: Yesu akajibu, “Nikijitukuza mwenyewe, utukufu wangu si kitu. Baba yangu ndiye anayenitukuza, ambaye ninyi mnasema kuwa ni Mungu wetu[a],”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati zina “Mungu wenu” badala ya “Mungu wetu.”
    reason: textual_variant
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: akajibu
  rationale: Ni simulizi la kawaida na la asili la Kiswahili kwa jibu katika mazungumzo; kiambishi -ka- kinaendeleza mtiririko wa tukio.
- source_word: δοξάσω
  choice: nikijitukuza
  rationale: Kitenzi “kutukuza” kinahifadhi uzito wa δοξάζω na dhamira ya utukufu katika Injili ya Yohana; umbo la kujirejelea linaonyesha ἐμαυτόν.
- source_word: ἡ δόξα μου οὐδέν ἐστιν
  choice: utukufu wangu si kitu
  rationale: Tafsiri hii inafuata kwa karibu muundo na nguvu ya οὐδέν ἐστιν huku ikiwa wazi na ya kawaida katika Kiswahili.
- source_word: ὁ πατήρ μου
  choice: Baba yangu
  rationale: Huhifadhi jina la uhusiano analotumia Yesu kwa Mungu; herufi kubwa inaonyesha kuwa hapa ni jina la kimungu katika muktadha.
- source_word: ὁ δοξάζων με
  choice: ndiye anayenitukuza
  rationale: Muundo wa “ndiye anaye-” unawakilisha kishiriki chenye kibainishi na msisitizo wa kwamba Baba ndiye anayemtukuza Yesu.
- source_word: ὃν ὑμεῖς λέγετε ὅτι θεὸς ἡμῶν ἐστιν
  choice: ambaye ninyi mnasema kuwa ni Mungu wetu
  rationale: Huhifadhi kishazi tegemezi, usemi wa moja kwa moja kwa wapinzani, na usomaji wa SBLGNT ἡμῶν bila kuongeza nukuu au kufafanua mvutano uliopo.
- source_word: θεὸς
  choice: Mungu
  rationale: Katika muktadha huu neno linamtaja Mungu wa Israeli, hivyo “Mungu” ndilo chaguo la kawaida na linalofaa.
- source_word: ἡμῶν
  choice: wetu
  rationale: Hufuata matini msingi ya SBLGNT; tofauti ya “wenu” imehifadhiwa katika tanbihi.
theological_decisions:
- issue: Kiwakilishi katika θεὸς ἡμῶν/ὑμῶν ἐστιν
  choice: Mungu wetu
  alternative: Mungu wenu
  rationale: Matini kuu inafuata ἡμῶν ya SBLGNT. Kwa kuwa baadhi ya hati zina ὑμῶν, usomaji huo wenye umuhimu katika mabishano haya umewekwa katika tanbihi badala ya kuamuliwa kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. “Kutukuza/utukufu” kimetumiwa kwa uthabiti ili kuhifadhi uhusiano wa maneno na dhamira ya Yohana. Alama ya tanbihi imewekwa mara tu baada ya usomaji unaohusika.
