  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: νῦν δὲ ζητεῖτέ με ἀποκτεῖναι, ἄνθρωπον ὃς τὴν ἀλήθειαν ὑμῖν λελάληκα ἣν ἤκουσα παρὰ τοῦ θεοῦ· τοῦτο Ἀβραὰμ οὐκ ἐποίησεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/040.yaml
  text: But now you are seeking to kill me, a man who has told you the truth that I heard from God. Abraham did not do this.
translation:
  language: sw
  text: Lakini sasa mnatafuta kuniua, mimi, mtu ambaye nimewaambia ukweli niliousikia kutoka kwa Mungu. Abrahamu hakufanya hivyo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νῦν δὲ
  choice: Lakini sasa
  rationale: Inahifadhi tofauti ya wakati katika νῦν na nguvu ya upinzani ya δέ kwa Kiswahili cha kawaida.
- source_word: ζητεῖτέ με ἀποκτεῖναι
  choice: mnatafuta kuniua
  rationale: Inadumisha wazo la jitihada au nia inayoendelea la ζητέω pamoja na kitenzi-jina, bila kuongeza dhana ya kisheria ambayo haijaelezwa.
- source_word: ἀποκτεῖναι
  choice: kuniua
  rationale: Ni tafsiri ya moja kwa moja; maneno kama ‘kunifisha’ au ‘kuninyonga’ yangeongeza namna au mazingira yasiyotajwa.
- source_word: ἄνθρωπον
  choice: mimi, mtu
  rationale: Inahifadhi maana ya mtu wa kiume katika jinsi Yesu anavyojirejelea, huku apposition ya ‘mimi’ ikifanya sentensi iwe wazi na ya kawaida kwa Kiswahili.
- source_word: τὴν ἀλήθειαν
  choice: ukweli
  rationale: Nomino ‘ukweli’ kwa kawaida haitumii kibainishi katika Kiswahili, lakini bado inaonyesha ujumbe mahususi ambao Yesu amesema.
- source_word: ὑμῖν λελάληκα
  choice: nimewaambia
  rationale: Wakati timilifu wa Kiswahili unaonyesha tendo lililofanyika ambalo bado lina umuhimu katika hali ya sasa.
- source_word: ἣν ἤκουσα παρὰ τοῦ θεοῦ
  choice: niliousikia kutoka kwa Mungu
  rationale: ‘Kutoka kwa’ linaonyesha Mungu kuwa chanzo cha ujumbe, kama παρά pamoja na umilikishi, bila kulipanua kuwa ‘kutoka mbele za Mungu.’
- source_word: τοῦτο Ἀβραὰμ οὐκ ἐποίησεν
  choice: Abrahamu hakufanya hivyo
  rationale: Ni Kiswahili cha kawaida kinachohifadhi rejeo la τοῦτο kwa kitendo kilichotangulia na tofauti kati ya wasikilizaji na Abrahamu.
theological_decisions:
- issue: Jinsi ya kutafsiri ἄνθρωπον Yesu anapojieleza
  choice: mimi, mtu
  alternative: mwanadamu
  rationale: ‘Mtu’ huhifadhi maana ya kawaida na halisi ya neno katika rejeo hili la Yesu mwenyewe bila kufifisha ubinadamu wake wala kutoa dai lolote lisilosemwa kuhusu uungu wake.
- issue: Chanzo cha ujumbe wa Yesu katika παρὰ τοῦ θεοῦ
  choice: kutoka kwa Mungu
  alternative: kutoka kwa Baba
  rationale: Maandishi yanasema ‘Mungu,’ si ‘Baba’; hivyo tafsiri haiongezi cheo maalumu cha kiteolojia ambacho hakipo katika mstari huu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ‘mimi, mtu ambaye’ unatunza msisitizo wa kujitambulisha uliopo katika Kigiriki huku ukiendelea kueleweka kwa msomaji wa kawaida.
