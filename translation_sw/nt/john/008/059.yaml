base_translation:
  language: en
  yaml_path: translation/nt/john/008/059.yaml
  text: So they picked up stones to throw at him[a], but Jesus hid himself and went out of the temple.
translation:
  language: sw
  text: Basi wakachukua mawe ili wamtupie mawe, lakini Yesu akajificha, akatoka katika hekalu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki ἱερόν hapa humaanisha eneo lote la hekalu, au nyua za hekalu, si sehemu takatifu ya ndani pekee.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦραν
  choice: wakaokota
  rationale: Katika muktadha huu αἴρω inaonyesha kuyachukua mawe kutoka chini ili kuyatumia; “wakaokota” ni ya kawaida na huonyesha tendo hilo wazi.
- source_word: οὖν
  choice: Basi
  rationale: Huonyesha matokeo ya kauli iliyotangulia kwa njia ya kawaida na yenye mtiririko mzuri katika Kiswahili.
- source_word: λίθους
  choice: mawe
  rationale: Ni tafsiri ya kawaida ya λίθος na inafaa katika muktadha wa jaribio la kumpiga mtu kwa mawe.
- source_word: ἵνα βάλωσιν ἐπ’ αὐτόν
  choice: ili wamtupie
  rationale: ἵνα pamoja na kitenzi tegemezi huonyesha kusudi; “ili wamtupie” huhifadhi kusudi na shabaha ya tendo hilo kwa Kiswahili cha kawaida.
- source_word: ἐκρύβη
  choice: akajificha
  rationale: Ingawa umbo la Kigiriki ni la kutendwa, hapa linaweza kuwa na maana ya kujitendea; “akajificha” ni ya asili bila kudokeza kwamba mtu mwingine alimficha.
- source_word: ἐξῆλθεν
  choice: akatoka
  rationale: Huwasilisha kwa uwazi mwendo wa kutoka mahali hapo na kuendeleza mfululizo wa matendo.
- source_word: ἐκ τοῦ ἱεροῦ
  choice: katika hekalu
  rationale: “Hekalu” ni fupi na linaeleweka katika matini kuu; tanbihi inafafanua kwamba ἱερόν hapa ni eneo lote la hekalu, si patakatifu pa ndani pekee.
theological_decisions:
- issue: Jinsi Yesu alivyoondoka
  choice: Kusema tu kwamba Yesu alijificha na kutoka
  alternative: Kuongeza kwamba alipita katikati yao kwa muujiza au kwamba alifanyika asiyeonekana
  rationale: Matini ya SBLGNT inasema tu kwamba Yesu alijificha na kutoka katika hekalu; haielezi tukio hilo kuwa muujiza wala kusema kwamba alifanyika asiyeonekana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Muundo “wakaokota… akajificha, akatoka” unaendeleza matendo kwa mtiririko wa masimulizi bila kuongeza maelezo yasiyomo katika chanzo.
