lexical_decisions:
- source_word: Ἄγουσιν (ἄγω)
  choice: wakamleta
  rationale: Wakati uliopo wa kihistoria katika Kigiriki umetafsiriwa kwa wakati uliopita wa masimulizi, kwa mtiririko wa kawaida wa Kiswahili; kiambishi cha mtendwa kinaonyesha mwanamke aliletwa kwa Yesu.
- source_word: οἱ γραμματεῖς
  choice: waandishi wa sheria
  rationale: Katika muktadha huu neno linawahusu wataalamu na walimu wa Sheria, si waandishi kwa maana ya kawaida tu.
- source_word: ἐν μοιχείᾳ κατειλημμένην (καταλαμβάνω)
  choice: aliyekutwa akizini
  rationale: Kauli timilifu tendwa inaonyesha kuwa aligunduliwa katika tendo la uzinzi; usemi huu ni wa kawaida na wazi katika Kiswahili.
- source_word: στήσαντες (ἵστημι)
  choice: wakamsimamisha
  rationale: Neno linaeleza kitendo cha kumweka akiwa amesimama mbele ya waliokusanyika; muundo wa mfululizo wa vitenzi unafaa masimulizi ya Kiswahili.
- source_word: ἐν μέσῳ (μέσος)
  choice: katikati yao
  rationale: Hueleza kuwekwa kwake katikati ya kundi lililokuwapo; ‘yao’ hufanya maana hiyo iwe wazi kwa Kiswahili bila kubadili tukio.
