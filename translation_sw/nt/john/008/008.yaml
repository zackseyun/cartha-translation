lexical_decisions:
- source_word: πάλιν
  choice: tena
  rationale: Huonyesha kwamba Yesu alirudia tendo lililotajwa kabla.
- source_word: κάτω κύψας
  choice: akainama
  rationale: Kirai hiki kinaeleza kuinamisha mwili kuelekea chini; katika Kiswahili, ‘akainama’ huwasilisha tendo hilo kwa kawaida bila uradidi usiohitajika.
- source_word: ἔγραφεν
  choice: kuandika
  rationale: Kitenzi cha wakati usiotimilika kinaweza kuonyesha tendo lililoendelea. Muundo ‘akainama ... na kuandika’ ni wa kawaida katika simulizi la Kiswahili na hauongezi maelezo kuhusu alichoandika.
- source_word: εἰς τὴν γῆν
  choice: chini
  rationale: Katika muktadha huu γῆ ni uso wa ardhi aliokuwa akiandikia. ‘Chini’ ni usemi wa kawaida wa Kiswahili kwa kuandika juu ya ardhi, ingawa ‘ardhini’ pia linawezekana.
