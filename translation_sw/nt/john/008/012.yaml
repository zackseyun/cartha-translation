id: JHN.8.12
reference: John 8:12
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Πάλιν οὖν αὐτοῖς ⸂ἐλάλησεν ὁ Ἰησοῦς⸃ λέγων· Ἐγώ εἰμι τὸ φῶς τοῦ κόσμου· ὁ ἀκολουθῶν ⸀ἐμοὶ οὐ μὴ περιπατήσῃ ἐν τῇ σκοτίᾳ, ἀλλ’ ἕξει τὸ φῶς τῆς ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/012.yaml
  text: So Jesus spoke to them again[a], saying, “I am the light of the world. The one who follows me will certainly not walk in the darkness[b], but will have the light of life.”
translation:
  language: sw
  text: Basi Yesu akazungumza nao tena, akisema, “Mimi ni nuru ya ulimwengu. Anayenifuata hatatembea kamwe gizani[a], bali atakuwa na nuru ya uzima[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hakika hatatembea gizani.” Kigiriki kinatumia ukanushaji wenye nguvu (οὐ μή).
    reason: lexical_alternative
  - marker: b
    text: “Nuru ya uzima” inaweza pia kueleweka kuwa “nuru inayotoa uzima.”
    reason: alternative_reading
lexical_decisions:
- source_word: Πάλιν οὖν
  choice: Basi ... tena
  rationale: “Basi” huendeleza mtiririko wa habari bila kufanya οὖν iwe hitimisho kali, na “tena” huonyesha kurudiwa kwa kusema.
- source_word: αὐτοῖς ἐλάλησεν ὁ Ἰησοῦς λέγων
  choice: Yesu akazungumza nao ... akisema
  rationale: “Akazungumza nao” huwakilisha λαλέω pamoja na kiwakilishi cha walengwa, huku “akisema” kikihifadhi kazi ya λέγων ya kuanzisha maneno ya moja kwa moja.
- source_word: Ἐγώ εἰμι
  choice: Mimi ni
  rationale: Hii ni tafsiri ya moja kwa moja ya kirai chenye kiwakilishi kinachosisitizwa; haiongezi kwa wazi dokezo la jina la Mungu lisilodaiwa na sarufi ya sentensi hii.
- source_word: τὸ φῶς τοῦ κόσμου
  choice: nuru ya ulimwengu
  rationale: Ni usemi wa kawaida na sahihi unaohifadhi muundo wa Kigiriki na taswira ya nuru.
- source_word: ὁ ἀκολουθῶν ἐμοὶ
  choice: Anayenifuata
  rationale: Huwakilisha kitenzi-shirikishi chenye kibainishi kama mtu mmoja wa mfano, kwa Kiswahili cha kawaida na cha asili.
- source_word: οὐ μὴ περιπατήσῃ ἐν τῇ σκοτίᾳ
  choice: hatatembea kamwe gizani
  rationale: “Kamwe” huonyesha ukanushaji wenye nguvu wa οὐ μή, na “kutembea gizani” huhifadhi sitiari ya mwenendo wa maisha.
- source_word: ἕξει
  choice: atakuwa na
  rationale: Ni namna ya kawaida ya Kiswahili ya kueleza kuwa mtu atakuwa na au atamiliki kitu.
- source_word: τὸ φῶς τῆς ζωῆς
  choice: nuru ya uzima
  rationale: Tafsiri hii fupi huhifadhi uhusiano wenye uwezekano wa maana zaidi ya moja katika genitivi τῆς ζωῆς badala ya kuufanya uwe maana moja tu.
theological_decisions:
- issue: Nguvu ya kujitambulisha kwa Yesu katika Ἐγώ εἰμι
  choice: “Mimi ni” ndani ya kauli “Mimi ni nuru ya ulimwengu”
  alternative: Kutumia msisitizo wa ziada ili kuonyesha wazi dokezo linalowezekana la jina la Mungu
  rationale: Katika mstari huu Ἐγώ εἰμι imeunganishwa kisarufi na kiarifu “nuru ya ulimwengu.” Tafsiri inaonyesha muundo huo bila kuzuia wasomaji kuona mwangwi mpana wa kiteolojia.
- issue: Maana ya τὸ φῶς τῆς ζωῆς
  choice: “nuru ya uzima”
  alternative: “nuru inayotoa uzima”
  rationale: Genitivi inaweza kueleweka kwa zaidi ya namna moja. Usemi halisi huhifadhi utajiri na mvutano huo badala ya kuamua kwamba nuru ndiyo tu inayosababisha uzima.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Akazungumza nao” ni cha asili na huhifadhi wazo la kusema kwa walengwa; “gizani” ni matumizi ya kawaida ya Kiswahili, ingawa Kigiriki kina kibainishi kinachoweza kuonyesha giza kama eneo au hali.
