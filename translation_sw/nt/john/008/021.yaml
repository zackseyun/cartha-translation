base_translation:
  language: en
  yaml_path: translation/nt/john/008/021.yaml
  text: So he said to them again[a], “I am going away, and you will seek me, and you will die in your sin. Where I am going[c][b], you are not able to come.”
translation:
  language: sw
  text: Basi akawaambia tena, “Mimi ninaondoka, nanyi mtanitafuta[a], na mtakufa katika dhambi yenu[b]. Ninakokwenda, ninyi hamwezi kuja[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mtanisaka.” Kitenzi hiki kinaweza kumaanisha kumtafuta mtu, na katika Yohana huenda pia kikawa na maana ya ndani zaidi ya kiroho.
    reason: lexical_alternative
  - marker: b
    text: 'Kigiriki kina umoja: “katika dhambi yenu.” Tafsiri nyingine hutumia “katika dhambi zenu,” lakini umoja unaweza kusisitiza hali inayoendelea badala ya matendo mbalimbali.'
    reason: lexical_alternative
  - marker: c
    text: Au “ninyi hamna uwezo wa kuja.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Basi
  rationale: Kiunganishi hiki kinaendeleza hoja na tukio lililotangulia kwa njia ya kawaida katika Kiswahili.
- source_word: πάλιν
  choice: tena
  rationale: Kinadumisha wazi wazo la kurudia kusema.
- source_word: Ἐγὼ ὑπάγω
  choice: Mimi ninaondoka
  rationale: Kiwakilishi “Mimi” kinahifadhi msisitizo wa Ἐγώ, na “ninaondoka” huonyesha kuondoka kwa Yesu bila kutaja mapema anakoenda.
- source_word: ζητήσετέ με
  choice: mtanitafuta
  rationale: “Kutafuta” linaweza kumaanisha kumtafuta mtu kihalisi na pia kubeba maana pana zaidi katika Injili ya Yohana.
- source_word: ἐν τῇ ἁμαρτίᾳ ὑμῶν
  choice: katika dhambi yenu
  rationale: Linahifadhi kihusishi ἐν na umoja wa ἁμαρτίᾳ, ambao unaweza kuelekeza kwenye hali inayoendelea badala ya matendo mengi tofauti.
- source_word: ἀποθανεῖσθε
  choice: mtakufa
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya kitenzi cha wakati ujao.
- source_word: ὅπου ἐγὼ ὑπάγω
  choice: Ninakokwenda
  rationale: Usemi huu ni wa asili katika Kiswahili na huhifadhi wazo la mahali Yesu anakoelekea bila kulifafanua zaidi.
- source_word: οὐ δύνασθε ἐλθεῖν
  choice: ninyi hamwezi kuja
  rationale: “Hamwezi” huhifadhi dhana ya kutokuwa na uwezo katika δύνασθε; “ninyi” inawakilisha msisitizo wa kiwakilishi cha Kigiriki.
theological_decisions:
- issue: Umoja wa ἁμαρτίᾳ dhidi ya wingi unaoweza kuwa wa kawaida zaidi
  choice: katika dhambi yenu
  alternative: katika dhambi zenu
  rationale: Maandishi ya Kigiriki yana nomino katika umoja. Kudumisha umoja kunalinda uwezekano kwamba Yesu anazungumzia hali ya dhambi, huku maandishi yenyewe yasiweke wazi tafsiri hiyo.
- issue: Maana ya kuondoka kwa Yesu katika ὑπάγω
  choice: Mimi ninaondoka
  alternative: Mimi ninakwenda
  rationale: “Ninaondoka” hudokeza kuondoka kwake kwa uzito unaofaa katika muktadha wa Yohana, bila kuingiza moja kwa moja maelezo kuhusu kifo, ufufuo, au kurudi kwa Baba.
- issue: Nguvu ya οὐ δύνασθε ἐλθεῖν
  choice: ninyi hamwezi kuja
  alternative: ninyi hamtaweza kuja
  rationale: Wakati wa sasa wa δύνασθε umehifadhiwa; sentensi inaeleza kutoweza kwao, bila kueleza moja kwa moja sababu ya hali hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa kawaida kwa wasomaji wa jumla, huku “Mimi” na “ninyi” zikihifadhi misisitizo halisi ya viwakilishi vya Kigiriki. Alama zote za tanbihi zimewekwa katika maandishi makuu.
