  text: μὴ σὺ μείζων εἶ τοῦ πατρὸς ἡμῶν Ἀβραάμ, ὅστις ἀπέθανεν; καὶ οἱ προφῆται ἀπέθανον· τίνα ⸀σεαυτὸν ποιεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/053.yaml
  text: Surely you are not greater than our father Abraham[a], who died? The prophets also died[b]. Who do you make yourself out to be?
translation:
  language: sw
  text: Je, wewe si mkuu kuliko baba yetu Ibrahimu, ambaye alikufa?[a] Manabii pia walikufa. Unajifanya kuwa nani?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata kwa karibu zaidi muundo wa Kigiriki, “Je, wewe si mkuu kuliko baba yetu Ibrahimu...?” Swali la Kigiriki limeundwa likitarajia jibu la “hapana.”
    reason: lexical_alternative
  - marker: b
    text: Au, “Unajifanya nani?” Kauli hii inaweza kumaanisha, “Unadai kuwa nani?”
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ σὺ
  choice: Wewe si ... sivyo?
  rationale: Muundo huu unaonyesha kwamba swali linatarajia jibu la kukataa, huku ukihifadhi sauti ya changamoto na shutuma kwa Kiswahili cha kawaida.
- source_word: μείζων
  choice: mkuu kuliko
  rationale: Neno hili la kulinganisha linahusu ukuu au hadhi. “Mkuu kuliko” ni pana vya kutosha bila kufafanua kupita kiasi aina ya ukuu unaokusudiwa.
- source_word: τοῦ πατρὸς ἡμῶν Ἀβραάμ
  choice: kuliko baba yetu Abrahamu
  rationale: “Baba yetu Abrahamu” huhifadhi dai la ukoo wa Kiyahudi na heshima ya Abrahamu kama babu wa taifa.
- source_word: ὅστις ἀπέθανεν
  choice: ambaye alikufa
  rationale: Kitenzi cha wakati uliopita kinataja moja kwa moja tukio la kihistoria la kifo cha Abrahamu.
- source_word: καὶ οἱ προφῆται ἀπέθανον
  choice: Manabii pia walikufa
  rationale: '“Pia” huonyesha hoja sambamba: Abrahamu alikufa, na manabii nao walikufa.'
- source_word: τίνα σεαυτὸν ποιεῖς
  choice: Unajifanya kuwa nani?
  rationale: Hii ni kauli ya shutuma kuhusu mtu kujionyesha au kudai kuwa mwenye hadhi fulani. Tafsiri hii ni ya kawaida katika Kiswahili na haiamui dai hilo ni lipi.
theological_decisions:
- issue: Changamoto kuhusu hadhi ya Yesu ikilinganishwa na Abrahamu na manabii
  choice: Swali limetafsiriwa kama pingamizi kali linalotarajia jibu la kukataa.
  alternative: Je, wewe ni mkuu kuliko baba yetu Abrahamu...?
  rationale: μή huonyesha kwamba wasemaji wanatarajia jibu la “la.” Tafsiri inadumisha mvutano kuhusu utambulisho na mamlaka ya Yesu bila kuuingiza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo “Wewe si ... sivyo?” umechaguliwa ili kuwasilisha kwa kawaida matarajio ya jibu la kukataa na sauti ya makabiliano.
