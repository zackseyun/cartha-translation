base_translation:
  language: en
  yaml_path: translation/nt/john/008/045.yaml
  text: But because I tell the truth[a], you do not believe me.
translation:
  language: sw
  text: Lakini kwa sababu mimi nasema kweli,[a] hamniamini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata muundo wa Kigiriki kwa karibu zaidi, “Lakini mimi, kwa sababu nasema kweli, hamniamini.” Kiunganishi cha Kigiriki kinaweza pia kutafsiriwa “kwamba,” lakini hapa maana yake inaeleweka vizuri zaidi kuwa “kwa sababu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγὼ
  choice: mimi
  rationale: Kiwakilishi cha wazi kimedumishwa ili kuhifadhi msisitizo na utofautishaji wa Yesu na wasikilizaji wake.
- source_word: δὲ
  choice: Lakini
  rationale: Hapa kiunganishi kinaonyesha utofautishaji na muktadha uliotangulia; “Lakini” ni ya kawaida na yenye nguvu inayofaa.
- source_word: ὅτι
  choice: kwa sababu
  rationale: 'Katika muundo huu, maana ya kisababishi ndiyo inayofaa zaidi: hawamwamini Yesu kwa sababu anasema kweli.'
- source_word: τὴν ἀλήθειαν
  choice: kweli
  rationale: “Kweli” ni tafsiri ya kawaida na ya asili katika usemi wa Kiswahili “kusema kweli.”
- source_word: λέγω
  choice: nasema
  rationale: Wakati uliopo umehifadhiwa, na “nasema kweli” ni usemi wa kawaida wa Kiswahili.
- source_word: οὐ πιστεύετέ μοι
  choice: hamniamini
  rationale: Muundo huu unahifadhi maana ya kumwamini mtu moja kwa moja, bila kuupanua kuwa “hamyaamini ninayosema.”
theological_decisions:
- issue: Maana ya ὅτι kuhusiana na kusema kweli kwa Yesu na kutokuamini kwa wasikilizaji
  choice: 'kisababishi: “kwa sababu mimi nasema kweli”'
  alternative: 'tamko la kwamba: “kwamba mimi nasema kweli”'
  rationale: 'Muktadha wa mazungumzo unaunga mkono maana ya kisababishi na kuhifadhi kejeli kali ya sentensi: kusema kwa Yesu kweli ndiko kunakohusishwa na kukataliwa kwake. Huu ni uamuzi wa kisintaksia na kimuktadha, si kuingiza fundisho la dhehebu.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. “Hamniamini” ni fupi na ya asili, huku “mimi” ikihifadhi msisitizo wa kiwakilishi katika Kigiriki.
