  text: Οἱ δὲ ἀκούσαντες, καὶ ὑπὸ τῆς συνειδήσεως ἐλεγχόμενοι, ἐξήρχοντο εἷς καθ' εἷς, ἀρξάμενοι ἀπὸ τῶν πρεσβυτέρων ἕως τῶν ἐσχάτων· καὶ κατελείφθη μόνος ὁ Ἰησοῦς, καὶ ἡ γυνὴ ἐν μέσῳ ἑστῶσα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/008/009.yaml
  text: But those[a] who heard it, being convicted by their conscience, went out one by one, beginning with the older ones down to the last. And Jesus was left alone, with the woman standing in the midst.
translation:
  language: sw
  text: Lakini waliposikia hayo[a], wakihukumiwa na dhamiri zao, walitoka mmoja mmoja, kuanzia wale wenye umri mkubwa hadi wale wa mwisho. Yesu akabaki peke yake, naye yule mwanamke akiwa amesimama katikati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mstari huu ni sehemu ya simulizi kuhusu mwanamke aliyekutwa katika uzinzi (Yohana 7:53–8:11). Tazama maelezo kwenye Yohana 7:53.
    reason: textual_critical
lexical_decisions:
- source_word: συνείδησις
  choice: dhamiri
  rationale: Neno “dhamiri” ndilo neno la kawaida na sahihi katika Kiswahili kwa uwezo wa ndani wa kutambua mema na mabaya na kutoa ushuhuda wa kimaadili.
- source_word: ἐλέγχω
  choice: wakihukumiwa
  rationale: Katika muundo wa ‘ὑπὸ τῆς συνειδήσεως ἐλεγχόμενοι,’ neno hili linaeleza dhamiri zao zikiwathibitishia kosa na kuwahukumu ndani; “wakihukumiwa na dhamiri zao” ni Kiswahili cha asili kinachohifadhi wazo hilo.
- source_word: πρεσβύτερος
  choice: wale wenye umri mkubwa
  rationale: Hapa neno linaonekana kutaja umri au ukubwa badala ya cheo rasmi cha uongozi. Kauli hii huepuka utata wa “wazee” kama viongozi wa jamii au dini.
- source_word: ἐξήρχοντο εἷς καθ' εἷς
  choice: walitoka mmoja mmoja
  rationale: Hii ni njia ya kawaida ya Kiswahili ya kueleza kwamba kila mmoja aliondoka kwa zamu.
- source_word: ἐν μέσῳ ἑστῶσα
  choice: akiwa amesimama katikati
  rationale: Tafsiri hii hudumisha hali ya mwanamke kusimama mahali pa kati bila kuongeza maelezo yasiyomo katika chanzo.
theological_decisions:
- issue: Utambulisho wa πρεσβύτεροι
  choice: wale wenye umri mkubwa
  alternative: wazee
  rationale: Muktadha unaonyesha mpangilio unaoanza na wenye umri mkubwa, si lazima kundi lenye cheo rasmi; kwa hiyo tafsiri haipaswi kuingiza wazo la viongozi wa kidini.
- issue: Nguvu ya ἐλεγχόμενοι katika toleo la Byzantine
  choice: wakihukumiwa na dhamiri zao
  alternative: wakisadiki kwamba wana hatia
  rationale: Tafsiri imehifadhi dhamiri kama chombo kinachowakabili ndani bila kufafanua zaidi chanzo au kiwango cha hatia yao.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Wale wenye umri mkubwa” limetumiwa badala ya “wazee” ili lisidokeze cheo rasmi. Muundo wa sentensi umefuata mwendo wa simulizi la Kigiriki huku ukibaki wa asili katika Kiswahili.
