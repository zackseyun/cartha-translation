lexical_decisions:
- source_word: λέγουσιν
  choice: Wakamwambia
  rationale: Ingawa Kigiriki kimetumia wakati wa sasa wa kihistoria, wakati uliopita wa kisimulizi unasikika kwa kawaida katika Kiswahili; kiambishi cha wingi kinaendeleza wahusika wa muktadha.
- source_word: Διδάσκαλε
  choice: Mwalimu
  rationale: Ni namna ya kawaida na yenye heshima ya kumwita mtu anayefundisha.
- source_word: κατείληπται
  choice: amekamatwa
  rationale: Wakati timilifu tendwa unaonyesha tendo lililokamilika ambalo matokeo yake bado yana umuhimu katika tukio hili.
- source_word: ἐπαυτοφώρῳ
  choice: akiwa katika tendo lenyewe
  rationale: Huwasilisha maana ya kunaswa wakati kosa likitendeka bila kutumia nahau isiyo ya lazima.
- source_word: μοιχευομένη
  choice: akifanya uzinzi
  rationale: Kirai endelevu kinaeleza kile mwanamke alichokuwa akifanya alipokamatwa; ‘uzinzi’ hapa ni kuvunja uaminifu wa ndoa.
