  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς· Ἀμὴν ἀμὴν λέγω ὑμῖν ὅτι πᾶς ὁ ποιῶν τὴν ἁμαρτίαν δοῦλός ἐστιν τῆς ἁμαρτίας·
base_translation:
  language: en
  yaml_path: translation/nt/john/008/034.yaml
  text: Jesus answered them[a], “Truly, truly, I say to you[b], everyone who practices sin is a servant of sin.”
translation:
  language: sw
  text: Yesu akawajibu, “Kweli, kweli, ninawaambia, kila mtu atendaye dhambi[a] ni mtumwa wa dhambi[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya karibu zaidi ya muundo wa Kigiriki, “kila mtu anayefanya dhambi.” Kitenzi hicho kinaweza kuonyesha tendo linaloendelea au mwenendo wa kawaida.
    reason: lexical_alternative
  - marker: b
    text: Au, “mtumishi wa dhambi.” Neno la Kigiriki δοῦλος linaweza kumaanisha mtumwa au mtumishi; hapa “mtumwa” linaonyesha kwa nguvu zaidi hali ya kuwa chini ya mamlaka ya dhambi.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς
  choice: Yesu akawajibu
  rationale: Muundo wa kawaida na wa asili wa masimulizi ya mazungumzo katika Kiswahili; unaonyesha kwamba Yesu aliitikia maneno yao.
- source_word: Ἀμὴν ἀμὴν
  choice: Kweli, kweli
  rationale: Inahifadhi urudiaji na mkazo wa fomula hii maalumu katika Injili ya Yohana, huku ikieleweka kwa urahisi katika Kiswahili cha sasa.
- source_word: λέγω ὑμῖν
  choice: ninawaambia
  rationale: Tafsiri ya moja kwa moja na ya kawaida inayodumisha uzito wa tamko la Yesu.
- source_word: πᾶς ὁ ποιῶν τὴν ἁμαρτίαν
  choice: kila mtu atendaye dhambi
  rationale: Kitenzi cha wakati wa sasa katika Kigiriki kinaweza kueleza tendo linaloendelea au tabia ya kawaida. ‘Atendaye dhambi’ ni lugha ya asili yenye heshima na haifungi maana kwa tendo moja pekee wala kuingiza ufafanuzi usiosemwa wazi.
- source_word: δοῦλος
  choice: mtumwa
  rationale: ‘Mtumwa’ hudumisha nguvu ya sitiari ya kuwa chini ya mamlaka na kifungo cha dhambi; ‘mtumishi’ ingedhoofisha wazo hilo.
- source_word: τῆς ἁμαρτίας
  choice: wa dhambi
  rationale: Inaonyesha kuwa mtu huyo yuko chini ya umiliki au mamlaka ya dhambi, kwa muundo wa kawaida wa Kiswahili.
theological_decisions:
- issue: Je, kauli hiyo inaeleza tendo moja la dhambi au mwenendo unaoendelea?
  choice: kila mtu atendaye dhambi
  alternative: kila mtu anayezoea kutenda dhambi
  rationale: Kishiriki cha wakati wa sasa ποιῶν kinaweza kuwa na maana ya tendo linaloendelea au la kitabia, lakini kuongeza ‘anayezoea’ kungeamua kwa nguvu zaidi jambo ambalo muundo wa Kigiriki unaacha likiwa pana kiasi. Tafsiri kuu inadumisha mvutano huo.
- issue: Nguvu ya sitiari ya δοῦλος
  choice: mtumwa wa dhambi
  alternative: mtumishi wa dhambi
  rationale: Hoja ya Yesu inahusu kifungo na kutawaliwa na dhambi. ‘Mtumwa’ huonyesha hali hiyo kwa nguvu bila kuifanya kuwa kauli ya kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Urudiaji ‘Kweli, kweli’ umehifadhiwa kwa sababu ni sehemu muhimu ya mtindo wa Yesu katika Yohana. ‘Atendaye’ lina sauti ya kifasihi inayofahamika kwa urahisi bila kuwa ya kizamani kupita kiasi.
