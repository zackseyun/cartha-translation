  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ οὐκ ἐγνώκατε αὐτόν, ἐγὼ δὲ οἶδα αὐτόν· κἂν εἴπω ὅτι οὐκ οἶδα αὐτόν, ἔσομαι ὅμοιος ⸀ὑμῖν ψεύστης· ἀλλὰ οἶδα αὐτὸν καὶ τὸν λόγον αὐτοῦ τηρῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/055.yaml
  text: Yet you have not known him[a], but I know him. If I were to say that I do not know him, I would be a liar like you. But I do know him[c][b], and I keep his word.
translation:
  language: sw
  text: Lakini ninyi hamjamjua[a], bali mimi namjua. Kama ningesema[b] kwamba simjui, ningekuwa mwongo kama ninyi. Lakini namjua, na ninalishika neno lake[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hamjui.” Umbo la Kigiriki ni la wakati timilifu na linaweza kusisitiza kwamba hadi sasa hawajafikia hali ya kumjua kweli.
    reason: lexical_alternative
  - marker: b
    text: Au, “Kama nisema.” Muundo wa Kigiriki unaeleza hali ya kudhaniwa; “kama ningesema” huonyesha wazi zaidi kwamba dai hilo si la kweli.
    reason: lexical_alternative
  - marker: c
    text: “Kulishika” kunaweza pia kutafsiriwa “kulitii” au “kulizingatia.” Katika Yohana, kitenzi hiki mara nyingi huhusisha kulihifadhi na kulitii neno la Mungu kwa uaminifu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγνώκατε
  choice: hamjamjua
  rationale: Kauli ya wakati timilifu inaonyesha kwamba hadi sasa hawajafikia hali ya kumjua kweli; ‘hamjamjua’ ni ya kawaida katika Kiswahili na inadumisha athari hiyo.
- source_word: οἶδα
  choice: ninamjua
  rationale: Ingawa umbo lake la Kigiriki ni la wakati timilifu, kitenzi hiki hutumika kwa maana ya hali ya sasa, ‘kujua.’ Kiambishi cha yambwa ‘-m-’ kinaonyesha kwamba anayejulikana ni mtu.
- source_word: κἂν εἴπω
  choice: Kama ningesema
  rationale: Muundo huu unaweka hali ya kudhaniwa ambayo si kweli. ‘Kama ningesema’ huwasilisha maana hiyo kwa Kiswahili cha kawaida bila kuifanya kuwa dai halisi.
- source_word: ἔσομαι
  choice: ningekuwa
  rationale: Ingawa kitenzi ni cha wakati ujao kwa umbo, kiko katika jibu la sharti la kudhaniwa; ‘ningekuwa’ ndilo umbo la kawaida la Kiswahili katika muktadha huu.
- source_word: ὅμοιος ὑμῖν
  choice: kama ninyi
  rationale: Maneno haya yanadumisha ulinganisho wa moja kwa moja na mkali kati ya Yesu na wale anaowahutubia.
- source_word: ψεύστης
  choice: mwongo
  rationale: Nomino hii humaanisha mtu asemaye uongo, si mtu aliyekosea tu.
- source_word: τὸν λόγον αὐτοῦ
  choice: neno lake
  rationale: ‘Neno lake’ huhifadhi msamiati mpana wa Yohana unaoweza kumaanisha kauli na pia ujumbe wa Mungu.
- source_word: τηρῶ
  choice: ninalishika
  rationale: ‘Kulishika neno’ hujumuisha kulitii, kulizingatia kwa uaminifu, na kulihifadhi; hivyo haipunguzi maana hadi utiifu wa amri pekee.
- source_word: καὶ ... δὲ
  choice: Lakini ... ila
  rationale: Viunganishi hivi vinabainisha tofauti kati ya kutomjua kwa wapinzani na kumjua kwa Yesu. ‘Lakini ... ila’ ni ya asili katika Kiswahili na inadumisha mkazo huo.
theological_decisions:
- issue: Dai la Yesu kwamba anamjua Mungu, tofauti na wapinzani wake
  choice: Kauli imetafsiriwa moja kwa moja kuwa dai la kumjua Mungu kweli na kulishika neno lake.
  alternative: Kuongeza maelezo kuhusu uhusiano wa kipekee wa Mwana na Baba, au kupunguza ‘kujua’ kuwa kufahamiana tu.
  rationale: Aya yenyewe inasisitiza tofauti kati ya Yesu na wapinzani wake kuhusu kumjua Mungu na kulishika neno lake. Tafsiri inadumisha ukali huo bila kuongeza ufafanuzi wa kimadhehebu au wa kiteolojia usiotajwa wazi katika aya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa sentensi unadumisha ukinzani mkali wa aya bila kuwa mgumu au wa kale.
