base_translation:
  language: en
  yaml_path: translation/nt/john/008/016.yaml
  text: But even if I do judge[a], my judgment is true, because I am not alone, but I and the Father who sent me.
translation:
  language: sw
  text: Lakini hata nikihukumu[a], hukumu yangu ni ya kweli, kwa sababu siko peke yangu, bali mimi na Baba aliyenituma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au “ikiwa ninahukumu” au “ikiwa nitahukumu.” Muundo wa masharti katika Kigiriki unaweza kutafsiriwa kwa namna rasmi zaidi, lakini hapa huenda una maana ya kukubali jambo kwa hoja: “hata nikihukumu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν κρίνω
  choice: hata nikihukumu
  rationale: Muundo wa ἐὰν pamoja na kitenzi cha hali tegemezi unaonyesha uwezekano wa masharti; katika muktadha huu, “hata nikihukumu” huleta maana ya kukubali jambo kwa hoja bila kuondoa uwezekano wa tafsiri rasmi zaidi.
- source_word: δὲ
  choice: Lakini
  rationale: δὲ hapa inaonyesha ugeuko wa kulinganisha na kauli iliyotangulia; “Lakini” ni ya kawaida na wazi katika Kiswahili.
- source_word: ἡ κρίσις ἡ ἐμὴ
  choice: hukumu yangu
  rationale: Huhifadhi maana ya kimahakama ya κρίσις na ni muundo wa kawaida wa Kiswahili.
- source_word: ἀληθινή
  choice: ya kweli
  rationale: Huhifadhi maana pana ya ἀληθινή kuwa yenye ukweli, halisi, na yenye uhalali bila kuifupisha kuwa uhalali wa kisheria pekee.
- source_word: μόνος οὐκ εἰμί
  choice: siko peke yangu
  rationale: Ni usemi wa kawaida unaohifadhi hoja kwamba Yesu hayuko wala hatendi akiwa peke yake.
- source_word: ἀλλ’ ἐγὼ καὶ ὁ πέμψας με πατήρ
  choice: bali niko pamoja na Baba aliyenituma
  rationale: Tafsiri ya neno kwa neno “bali mimi na Baba” si kamili kimuundo katika Kiswahili. “Niko pamoja na” huonyesha kwa kawaida kwamba Yesu na Baba wanahusika pamoja, huku “aliyenituma” ikihifadhi kazi ya kishazi cha Kigiriki cha kumtambulisha Baba.
theological_decisions:
- issue: Uhusiano wa hukumu ya Yesu na Baba anayeshuhudia pamoja naye
  choice: Hukumu ya Yesu ni ya kweli kwa sababu hayuko peke yake, bali yuko pamoja na Baba aliyemtuma.
  alternative: Kauli inaweza kueleweka kwa maana finyu zaidi kama hoja kuhusu mashahidi wanaotakiwa kisheria tu.
  rationale: Maneno ya aya yenyewe yanaunganisha ukweli wa hukumu ya Yesu na kutokuwa kwake peke yake pamoja na Baba. Tafsiri haiongezi ufafanuzi wa kimadhehebu wala kuondoa maana inayoweza kuwa ya kisheria katika muktadha.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. “Hukumu” imetumiwa badala ya “uamuzi” ili kuhifadhi mkazo wa kimahakama; muundo “niko pamoja na Baba” umechaguliwa kwa ufasaha wa Kiswahili bila kufuta wazo la ushirika katika ushuhuda na hukumu.
