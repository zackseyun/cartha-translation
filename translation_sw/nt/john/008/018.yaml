  yaml_path: translation/nt/john/008/018.yaml
  text: I am the one who testifies about myself[a], and the Father who sent me testifies about me.
translation:
  language: sw
  text: Mimi ndiye ninayejishuhudia mwenyewe, na Baba aliyenituma ananishuhudia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγώ εἰμι ὁ μαρτυρῶν
  choice: Mimi ndiye ninayeshuhudia
  rationale: Kiwakilishi ἐγώ kina mkazo, na kirai cha kitenzi pamoja na participio yenye kibainishi humtambulisha Yesu kuwa ndiye anayetoa ushuhuda. Muundo huu ni wa asili na wazi katika Kiswahili.
- source_word: περὶ ἐμαυτοῦ
  choice: juu yangu mwenyewe
  rationale: περί pamoja na jenitivi hapa humaanisha kuhusu au juu ya. Neno 'mwenyewe' linahifadhi maana ya kiwakilishi rejeshi ἐμαυτοῦ bila kuongeza wazo la kujitetea.
- source_word: μαρτυρεῖ περὶ ἐμοῦ
  choice: ananishuhudia
  rationale: Kitenzi 'kushuhudia' kinahifadhi lugha ya ushahidi yenye mwelekeo wa kimahakama. Muundo wenye kiambishi cha yambwa ni Kiswahili cha kawaida na humaanisha kutoa ushuhuda juu yangu.
- source_word: ὁ πέμψας με πατήρ
  choice: Baba aliyenituma
  rationale: Participio ya aoristi yenye kibainishi inafasiriwa kwa kishazi rejeshi 'aliyenituma.' Tafsiri inadumisha 'Baba' bila kuongeza 'Baba yangu' au 'Mungu Baba,' ambayo hayajasemwa wazi hapa.
- source_word: καί
  choice: naye
  rationale: Kiunganishi kinaunganisha shahidi wa pili na wa kwanza; 'naye' huonyesha wazi kwamba Baba pia anatoa ushuhuda huku sentensi ikisomeka kwa ufasaha.
theological_decisions:
- issue: Utambulisho wa 'Baba' katika muktadha wa Yohana
  choice: Baba aliyenituma
  alternative: Baba yangu aliyenituma; Mungu Baba aliyenituma
  rationale: Maandishi yanasema ὁ ... πατήρ, yaani 'Baba.' Tafsiri inahifadhi dai la uhusiano na kutumwa bila kuingiza ufafanuzi wa kiteolojia usiotajwa katika mstari huu.
- issue: Nguvu ya kimahakama ya lugha ya ushuhuda
  choice: Kutumia mzizi 'shuhudia' katika vifungu vyote viwili
  alternative: kutoa ushahidi; kunena habari
  rationale: Kurudia mzizi huakisi kurudiwa kwa μαρτυρέω na kudumisha taswira ya mashahidi wawili iliyo katika muktadha, bila kuifanya lugha kuwa ya kiufundi kupita kiasi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. 'Mimi ndiye' huhifadhi mkazo wa ἐγώ, huku 'ananishuhudia' ikiwa fupi na ya kawaida. Tanbihi inatoa muundo mpana unaoweka wazi urudiaji wa lugha ya ushuhuda.
