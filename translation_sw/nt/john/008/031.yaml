  text: Ἔλεγεν οὖν ὁ Ἰησοῦς πρὸς τοὺς πεπιστευκότας αὐτῷ Ἰουδαίους· Ἐὰν ὑμεῖς μείνητε ἐν τῷ λόγῳ τῷ ἐμῷ, ἀληθῶς μαθηταί μού ἐστε,
base_translation:
  language: en
  yaml_path: translation/nt/john/008/031.yaml
  text: So Jesus was saying to the Jews who had believed him[a], “If you remain in my word, you are truly my disciples,”
translation:
  language: sw
  text: Basi Yesu alikuwa akiwaambia Wayahudi waliomwamini[a], “Ikiwa ninyi mtadumu katika neno langu, kwa kweli ninyi ni wanafunzi wangu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wayahudi waliokuwa na imani kwake.” Kigiriki kinasema kihalisi “waliomwamini.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἔλεγεν
  choice: akawaambia
  rationale: Kauli ya wakati usiotimilika inaonyesha Yesu alikuwa akiendelea kusema; “akawaambia” ni simulizi la asili la Kiswahili linalobeba mwendelezo huo bila kuwa zito.
- source_word: οὖν
  choice: Basi
  rationale: Inaendeleza hoja na simulizi kwa njia ya kawaida bila kuifanya ionekane kuwa hitimisho kali la kimantiki.
- source_word: πρὸς τοὺς πεπιστευκότας αὐτῷ Ἰουδαίους
  choice: Wayahudi waliokuwa wamemwamini
  rationale: Kauli “waliokuwa wamemwamini” huonyesha imani iliyotangulia na matokeo yake yanayoendelea. Pia haiongezi kihusishi kisichopo katika Kigiriki.
- source_word: Ἐὰν ὑμεῖς
  choice: Ninyi mki-
  rationale: Muundo wa “mki-” unaonyesha sharti kwa Kiswahili cha kawaida, na “ninyi” huhifadhi msisitizo wa kiwakilishi kilichotajwa wazi katika Kigiriki.
- source_word: μείνητε
  choice: mkidumu
  rationale: “Kudumu” huonyesha kuendelea na kubaki kwa uthabiti, maana muhimu ya μένω katika muktadha huu.
- source_word: ἐν τῷ λόγῳ τῷ ἐμῷ
  choice: katika neno langu
  rationale: “Neno langu” huhifadhi msamiati wa Yohana na mwangwi wake mpana kuliko tafsiri ya ufafanuzi kama “mafundisho yangu.”
- source_word: ἀληθῶς
  choice: kwa kweli
  rationale: Hueleza uhalisi wa kuwa wanafunzi, si dai la juu juu tu.
- source_word: μαθηταί μού ἐστε
  choice: ni wanafunzi wangu
  rationale: “Wanafunzi” ni neno la kawaida na sahihi katika muktadha wa Injili; mpangilio huu ni wa asili katika Kiswahili.
theological_decisions:
- issue: Maana ya πιστεύω pamoja na kiwakilishi cha udativu αὐτῷ
  choice: waliokuwa wamemwamini
  alternative: waliokuwa na imani kwake
  rationale: Kigiriki hakitumii εἰς (“katika”) hapa. Kiswahili “kumwamini” kinaweza kuhusisha kukubali asemacho au kuwa na imani kwake; hivyo maandishi makuu yanahifadhi kwa kiasi fulani uwazi wa maana ya asili, huku tanbihi ikitaja uwezekano mwingine bila kuamua mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. “Mkidumu katika neno langu” huhifadhi picha na msamiati wa Yohana, ingawa ni wa kibiblia kidogo kuliko usemi wa mazungumzo ya kila siku.
