lexical_decisions:
- source_word: γνώσεσθε
  choice: mtaijua
  rationale: Ni kitenzi cha wakati ujao cha γινώσκω. ‘Mtaijua’ ni tafsiri ya moja kwa moja na ya kawaida; pia haiondoi uwezekano wa maana ya kuja kuijua kadiri muda unavyopita.
- source_word: ἀλήθειαν / ἀλήθεια
  choice: kweli
  rationale: Kiswahili hakihitaji kibainishi kinacholingana na ‘the’. Kurudia ‘kweli’ katika vifungu vyote viwili kunahifadhi msisitizo na mpangilio wa Kigiriki.
- source_word: ἐλευθερώσει
  choice: itawaweka huru
  rationale: Hii ni kauli ya wakati ujao yenye maana ya kusababisha uhuru. ‘Itawaweka huru’ ni Kiswahili cha kawaida na huhifadhi nguvu hiyo bila kufafanua aina ya uhuru ndani ya mstari wenyewe.
- source_word: ὑμᾶς
  choice: -wa- katika ‘itawaweka’
  rationale: Kiambishi ‘-wa-’ kinaonyesha kwamba walengwa ni watu wengi, kama ilivyo katika nafsi ya pili wingi ya Kigiriki.
- source_word: καὶ ... καὶ
  choice: nanyi ... nayo
  rationale: Viunganishi hivi vinahifadhi mwendelezo na muundo sambamba wa sentensi. ‘Nanyi’ na ‘nayo’ ni vya asili katika Kiswahili na vinaonyesha uhusiano wa vifungu bila kuongeza ‘basi’ isiyokuwapo wazi katika chanzo.
theological_decisions:
- issue: Aina ya uhuru katika kauli ‘kweli itawaweka huru’
  choice: Kutotaja katika matini kuu kwamba ni uhuru wa kisiasa, kisaikolojia, au wa kiroho pekee.
  alternative: ‘Kweli itawaweka huru kutoka katika dhambi.’
  rationale: Mstari wenyewe haukitaji kitu ambacho watu wanawekwa huru kutoka nacho. Muktadha unaofuata unahusianisha uhuru huo na dhambi, lakini tafsiri inaacha muktadha ufafanue kauli badala ya kuingiza ufafanuzi huo katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo mfupi na marudio ya ‘kweli’ yanahifadhi mdundo wa chanzo.
