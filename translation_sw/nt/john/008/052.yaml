  text: ⸀εἶπον αὐτῷ οἱ Ἰουδαῖοι· Νῦν ἐγνώκαμεν ὅτι δαιμόνιον ἔχεις. Ἀβραὰμ ἀπέθανεν καὶ οἱ προφῆται, καὶ σὺ λέγεις· Ἐάν τις τὸν λόγον μου τηρήσῃ, οὐ μὴ γεύσηται θανάτου εἰς τὸν αἰῶνα·
base_translation:
  language: en
  yaml_path: translation/nt/john/008/052.yaml
  text: The Jews said to him[a], “Now we know that you have a demon. Abraham died, and the prophets also, yet you say, ‘If anyone keeps my word[c][b], he will certainly never taste death forever.’”
translation:
  language: sw
  text: Wayahudi wakamwambia, “Sasa tunajua kwamba una pepo.[a] Abrahamu alikufa, na manabii pia, lakini wewe unasema, ‘Mtu yeyote akilishika neno langu, hakika hataonja mauti kamwe.’[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tafsiri nyingine: “umepagawa na pepo.” Kigiriki kinasema moja kwa moja, “una pepo.”'
    reason: lexical_alternative
  - marker: b
    text: 'Kigiriki kina ukanushaji wenye mkazo mkubwa: “hakika hataonja mauti kamwe,” yaani, hataonja hata kidogo wakati wowote.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ Ἰουδαῖοι
  choice: Wayahudi
  rationale: Ni tafsiri ya moja kwa moja ya kundi linalompinga Yesu katika muktadha huu; ‘viongozi wa Wayahudi’ ingeongeza ufafanuzi ambao hauko wazi katika maneno yenyewe.
- source_word: Νῦν ἐγνώκαμεν
  choice: Sasa tunajua
  rationale: Huonyesha hali ya sasa iliyotokana na kufikia utambuzi, kwa Kiswahili cha kawaida na cha asili.
- source_word: δαιμόνιον ἔχεις
  choice: una pepo mchafu
  rationale: Hufuata kwa karibu muundo wa Kigiriki, ‘una pepo,’ huku ‘mchafu’ ikibainisha maana ya δαιμόνιον katika matumizi ya Kiswahili na kuzuia kuchanganywa na roho kwa maana pana.
- source_word: Ἀβραὰμ ἀπέθανεν καὶ οἱ προφῆται
  choice: Abrahamu alikufa, na manabii pia
  rationale: Hutoa tendo la wakati uliopita kwa urahisi na kuonyesha kwamba manabii pia walikufa.
- source_word: καὶ σὺ λέγεις
  choice: lakini wewe unasema
  rationale: 'Kiunganishi kina nguvu ya kuonyesha tofauti katika muktadha: Abrahamu na manabii walikufa, lakini Yesu anatoa dai hili.'
- source_word: Ἐάν τις
  choice: Mtu yeyote aki-
  rationale: Huhifadhi sharti la jumla linalomhusu mtu yeyote.
- source_word: τὸν λόγον μου τηρήσῃ
  choice: akilishika neno langu
  rationale: ‘Kulishika’ huhifadhi wazo la τηρέω la kutunza, kuzingatia, na kudumu katika neno bila kulifanya kuwa utii pekee; ‘neno’ huhifadhi lugha ya Yohana ya λόγος.
- source_word: οὐ μὴ γεύσηται θανάτου
  choice: hakika hataonja mauti
  rationale: ‘Hakika hata-’ huwasilisha ukanushaji mkali wa οὐ μή, na ‘kuonja mauti’ huhifadhi sitiari ya Kigiriki bila kuitafsiri kimafundisho.
- source_word: εἰς τὸν αἰῶνα
  choice: kamwe
  rationale: Katika muundo huu wa ukanushaji, ‘kamwe’ ni Kiswahili cha asili kinachoonyesha kwamba jambo hilo halitatokea wakati wowote; huepuka usemi usio wa kawaida kama ‘hataonja mauti milele.’
theological_decisions:
- issue: Maana ya ahadi ya Yesu kuhusu mauti
  choice: Kuhifadhi usemi wa sitiari ‘kuonja mauti’ bila kubainisha aina ya mauti
  alternative: Kuitafsiri moja kwa moja kuwa kifo cha mwili, kifo cha kiroho, au mauti ya mwisho
  rationale: Wapinzani wa Yesu wanaelewa maneno hayo kwa maana ya kawaida ya kufa, lakini Injili ya Yohana mara nyingi ina maana zenye tabaka. Tafsiri inadumisha mvutano huo badala ya kuutatua kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Mauti’ imetumiwa katika usemi wa kibiblia ‘kuonja mauti’; ‘alikufa’ imetumiwa awali kwa simulizi la kawaida. Alama zote za tanbihi zimewekwa katika matini kuu.
