  text: But I do not seek my own glory[b][a]; there is One who seeks it and judges.
translation:
  language: sw
  text: Lakini mimi sitafuti utukufu wangu mwenyewe; yupo anayeutafuta na anayehukumu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγὼ δὲ
  choice: Lakini mimi
  rationale: “Lakini” linaonyesha utofauti na muktadha uliotangulia, na kiwakilishi “mimi” kimehifadhiwa ili kuonyesha mkazo wa ἐγώ.
- source_word: οὐ ζητῶ
  choice: sitafuti
  rationale: Wakati wa sasa na ukanushi umetafsiriwa kwa hali ya sasa ya kawaida; mzizi “tafuta” pia umehifadhiwa katika kishazi kinachofuata.
- source_word: τὴν δόξαν μου
  choice: utukufu wangu mwenyewe
  rationale: δόξα hapa ni utukufu au heshima ya mtu. “Mwenyewe” huonyesha kwa Kiswahili cha kawaida kwamba Yesu hakusudii kujitafutia utukufu, bila kubadili maana ya kisarufi ya μου.
- source_word: ἔστιν ὁ ζητῶν
  choice: yupo anayeutafuta
  rationale: Muundo huu ni wa kawaida na wa heshima katika Kiswahili, huku ukiacha mhusika bila kutajwa kama ilivyo katika Kigiriki. Kiambishi “-u-” kinaelekeza kwa “utukufu” uliotajwa katika kishazi cha kwanza.
- source_word: καὶ κρίνων
  choice: na kuhukumu
  rationale: Kitenzi kimeunganishwa na “anayeutafuta” kwa njia ya asili ya Kiswahili; “kuhukumu” huhifadhi maana ya kimahakama ya κρίνω katika muktadha.
theological_decisions:
- issue: Utambulisho wa mhusika asiyetajwa ambaye anatafuta na kuhukumu
  choice: 'Mhusika ameachwa bila kutajwa wazi: “yupo anayeutafuta na kuhukumu.”'
  alternative: “Yupo Baba anayeutafuta na kuhukumu.”
  rationale: Muktadha unaweza kuelekeza kwa Baba, lakini Kigiriki cha mstari huu hakimtaji wazi. Tafsiri kwa hiyo haiongezi utambulisho huo wala kuondoa mvutano uliopo katika matini.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Yupo” limetumiwa kwa kuwa mhusika ni mtu; sentensi imebaki fupi na yenye uzito wa kauli ya Yesu.
