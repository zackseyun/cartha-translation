base_translation:
  language: en
  yaml_path: translation/nt/john/008/029.yaml
  text: And the one who sent me is with me[a]. He has not left me alone[b], because I always do what is pleasing to him.
translation:
  language: sw
  text: Naye aliyenituma yuko pamoja nami. Hakuniacha peke yangu, kwa sababu sikuzote nafanya mambo yanayompendeza.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ πέμψας με
  choice: aliyenituma
  rationale: Kishiriki chenye kibainishi kinatumika kama nomino, yaani ‘yule aliyenituma.’ ‘Aliyenituma’ ni Kiswahili cha kawaida na kinahifadhi namna ya uhusiano iliyotumiwa na Yohana bila kuongeza wazi ‘Baba.’
- source_word: μετ’ ἐμοῦ ἐστιν
  choice: yuko pamoja nami
  rationale: μετά pamoja na hali ya umilikishi huonyesha kuwapo pamoja. ‘Yuko pamoja nami’ linaeleza kwa kawaida uwepo unaoendelea.
- source_word: οὐκ ἀφῆκέν με μόνον
  choice: Hakuniacha peke yangu
  rationale: Muundo huu unamaanisha kutomwacha mtu akiwa peke yake. Wakati uliopita wa ‘hakuniacha’ unaakisi aoristi ya Kigiriki, huku muktadha ukionyesha kwamba uwepo huo unaendelea.
- source_word: ὅτι
  choice: kwa sababu
  rationale: Hapa ὅτι inaleta sababu ya kutomwacha Yesu peke yake; ‘kwa sababu’ huonyesha uhusiano huo wazi.
- source_word: τὰ ἀρεστὰ αὐτῷ
  choice: yanayompendeza
  rationale: Kirai hiki cha wingi kisicho na nomino iliyotajwa wazi kinamaanisha ‘mambo yanayompendeza.’ Kiswahili kinaweza kuwasilisha maana hiyo kwa kawaida kwa ‘yanayompendeza’ baada ya kitenzi ‘nafanya.’
- source_word: ποιῶ πάντοτε
  choice: sikuzote nafanya
  rationale: Wakati uliopo unaonyesha tendo la kawaida au linaloendelea, na πάντοτε huonyesha uthabiti wake. ‘Sikuzote nafanya’ ni mpangilio wa asili katika Kiswahili.
theological_decisions:
- issue: Anayerejelewa na ‘aliyenituma’
  choice: Maneno ya uhusiano yamehifadhiwa bila kubadilishwa kuwa ‘Baba.’
  alternative: ‘Baba aliyenituma’
  rationale: Muktadha unamtambulisha Baba kuwa ndiye aliyemtuma Yesu, lakini maandishi ya Kigiriki hayatumii neno ‘Baba’ hapa. Kuhifadhi ‘aliyenituma’ kunadumisha mtindo wa Yohana na kuepuka kuongeza ufafanuzi ndani ya maandishi.
- issue: Uhusiano wa sababu katika ὅτι
  choice: ‘kwa sababu’
  alternative: ‘kwamba’
  rationale: Katika muktadha huu, ὅτι inaeleweka zaidi kuwa inatoa sababu ya Baba kutomwacha Yesu peke yake. Tafsiri hiyo imewekwa wazi bila kupanua kauli zaidi ya maandishi.
- issue: Wakati wa ἀφῆκεν
  choice: ‘Hakuniacha’
  alternative: ‘Hajaniacha’
  rationale: ‘Hakuniacha’ linafuata aoristi ya Kigiriki kwa karibu zaidi. Kauli inayotangulia, ‘yuko pamoja nami,’ tayari inaonyesha matokeo na uwepo unaoendelea, hivyo maana ya sasa haipotei.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Sentensi imehifadhi mpangilio na msisitizo wa chanzo bila kuwa ngumu; ‘pamoja nami’ na ‘peke yangu’ ni misemo inayoeleweka kwa wasomaji wa kawaida.
