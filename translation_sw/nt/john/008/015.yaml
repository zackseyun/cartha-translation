translation:
  language: sw
  text: Ninyi mnahukumu kwa jinsi ya mwili[a]; mimi simhukumu mtu yeyote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa viwango vya kibinadamu,” au “kwa kuangalia sura ya nje.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: Ninyi
  rationale: Kiwakilishi cha nafsi ya pili wingi kimetajwa wazi na kinaweka mkazo wa kulinganisha na ἐγώ; “Ninyi” huhifadhi utofautishaji huo kwa Kiswahili cha kawaida.
- source_word: κατὰ τὴν σάρκα
  choice: kwa kufuata mwili
  rationale: Usemi huu huhifadhi neno la Kiyunani σάρξ (“mwili”) na mvutano wake wa kimaana, bila kuufafanua moja kwa moja kuwa hali ya dhambi. Katika muktadha unaweza kumaanisha kuhukumu kwa vipimo vya kibinadamu au kwa sura ya nje.
- source_word: κρίνετε
  choice: mnahukumu
  rationale: Kitenzi cha wakati uliopo, nafsi ya pili wingi; “mnahukumu” ni tafsiri ya moja kwa moja na ya asili.
- source_word: ἐγὼ
  choice: mimi
  rationale: Kiwakilishi kimetajwa wazi ili kuonyesha utofauti na ὑμεῖς; “mimi” huhifadhi mkazo huo.
- source_word: οὐ κρίνω οὐδένα
  choice: simhukumu mtu yeyote
  rationale: Hutoa kwa njia ya asili katika Kiswahili ukanushi wenye maana ya kutomhukumu yeyote, huku ikihifadhi ufupi na nguvu ya kauli ya Kiyunani.
theological_decisions:
- issue: Maana ya σάρξ katika κατὰ τὴν σάρκα
  choice: “mwili” imehifadhiwa katika matini kuu ndani ya usemi “kwa kufuata mwili.”
  alternative: “kwa vipimo vya kibinadamu” au “kwa kuangalia sura ya nje.”
  rationale: Katika Yohana 8:15 usemi huo huenda unarejelea hukumu inayotegemea vipimo vya kibinadamu, vya kidunia, au mwonekano wa nje. Kuhifadhi “mwili” hakufungi maana katika tafsiri moja wala kuifanya kuwa istilahi maalumu ya “asili ya dhambi.”
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kulinganisha “Ninyi ...; mimi ...” umehifadhiwa, na alama ya tanbihi [a] imewekwa mara tu baada ya usemi unaohusika.
