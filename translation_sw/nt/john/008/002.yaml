  yaml_path: translation/nt/john/008/002.yaml
  text: At dawn he came again to the temple, and all the people were coming to him; and he sat down and began to teach them.
translation:
  language: sw
  text: Kulipopambazuka, alikuja tena hekaluni, na watu wote walikuwa wakimjia. Akaketi, akaanza kuwafundisha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mstari huu ni mwendelezo wa simulizi kuhusu mwanamke aliyekutwa akizini (Yohana 7:53–8:11), ambalo halimo katika hati za kale zaidi za Kigiriki. Tazama maelezo kwenye Yohana 7:53.
    reason: textual_critical
lexical_decisions:
- source_word: Ὄρθρου
  choice: Kulipopambazuka
  rationale: Nomino hii katika hali ya wakati inaonyesha mapambazuko, muda wa karibu na kuchomoza kwa jua; usemi huu ni wa kawaida na wazi katika Kiswahili.
- source_word: παρεγένετο
  choice: alikuja
  rationale: Kitenzi kinaonyesha kufika mahali; “alikuja” kinaendana kwa kawaida na mwelekeo wa kwenda hekaluni.
- source_word: ἱερόν
  choice: hekaluni
  rationale: Neno hili linamaanisha eneo lote la Hekalu, kutia ndani nyua ambako mafundisho ya hadharani yalitolewa, si patakatifu pa ndani pekee.
- source_word: πᾶς ὁ λαὸς
  choice: watu wote
  rationale: Hutoa maana ya jumla ya umati wa watu bila kulazimisha dai kwamba kila mtu mmoja mmoja alikuwepo.
- source_word: ἤρχετο
  choice: walikuwa wakimjia
  rationale: 'Wakati usiotimilika unaonyesha tendo lililokuwa likiendelea: watu waliendelea kuja kwake.'
- source_word: καθίσας
  choice: Akaketi
  rationale: Tendo la kuketi linatangulia tendo la kufundisha na linaakisi mkao wa kawaida wa mwalimu wakati wa kufundisha.
- source_word: ἐδίδασκεν
  choice: akaanza kuwafundisha
  rationale: Wakati usiotimilika unaweza kueleweka kuwa wa kuanza au wa kuendelea; hapa muktadha baada ya kuketi unaunga mkono maana ya kuanza kufundisha, ingawa “akawa akiwafundisha” pia inawezekana.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. “Hekaluni” limetumiwa kwa eneo la Hekalu kwa ujumla; “walikuwa wakimjia” huhifadhi hali ya tendo linaloendelea. Alama ya tanbihi imewekwa mwishoni mwa mstari ili isikatize usemi wa ufunguzi.
