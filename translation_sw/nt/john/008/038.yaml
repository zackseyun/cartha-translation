  text: ⸂ἃ ἐγὼ⸃ ἑώρακα παρὰ τῷ ⸀πατρὶ λαλῶ· καὶ ὑμεῖς οὖν ⸂ἃ ἠκούσατε⸃ παρὰ ⸂τοῦ πατρὸς⸃ ποιεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/038.yaml
  text: I speak what I have seen with the Father[a], and you, then, do what you have heard from your father.
translation:
  language: sw
  text: Ninasema yale niliyoyaona nikiwa pamoja na Baba[a]; nanyi basi, mnafanya yale mliyoyasikia kutoka kwa baba yenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “Ninasema yale niliyoyaona mbele za Baba; nanyi basi, fanyeni yale mliyoyasikia kutoka kwa baba yenu.” “Pamoja na Baba” pia inaweza kutafsiriwa “mbele za Baba.” Umbo la Kigiriki linalotafsiriwa “mnafanya” linaweza pia kumaanisha “fanyeni.”'
    reason: Huhifadhi maana mbadala ya παρά pamoja na dativu na utata halisi wa kimaumbo wa ποιεῖτε kati ya taarifa na amri.
lexical_decisions:
- source_word: ἃ
  choice: yale
  rationale: Kiwakilishi hiki cha wingi kisicho cha ngeli maalumu kinafanya kazi kama yambwa; “yale” ni cha asili katika Kiswahili na hudokeza “mambo yale” bila kuongeza nomino isiyokuwapo wazi.
- source_word: ἑώρακα
  choice: niliyoyaona
  rationale: Kauli timilifu inaonyesha kuona kulikotokea na ambako bado kuna umuhimu; umbo hili la Kiswahili linaunganisha tendo hilo kwa kawaida na yale anayosema sasa.
- source_word: παρὰ τῷ πατρὶ
  choice: nikiwa pamoja na Baba
  rationale: παρά pamoja na hali ya dativu huonyesha ukaribu au kuwapo mbele ya mtu. “Nikiwa pamoja na Baba” huhifadhi maana ya uwepo badala ya kuibadili kuwa chanzo tu.
- source_word: λαλῶ
  choice: Ninasema
  rationale: Kitenzi humaanisha kusema au kunena. “Ninasema” ni cha sasa, cha kawaida, na kinaweza kuchukua “yale” moja kwa moja kama yambwa.
- source_word: οὖν
  choice: basi
  rationale: “Basi” huonyesha muunganisho wa hitimisho au mwendelezo bila kuufanya kuwa hoja rasmi kupita kiasi.
- source_word: ἠκούσατε
  choice: mliyoyasikia
  rationale: Wakati aoristi unaeleza kusikia kulikotokea; umbo hili la uhusiano linaungana kwa kawaida na “yale” na linaacha matokeo yake ya sasa yaeleweke katika muktadha.
- source_word: παρὰ τοῦ πατρὸς
  choice: kwa baba yenu
  rationale: παρά pamoja na jenitivi huonyesha chanzo. Katika Kiswahili, “kwa baba yenu” hueleza kwa kawaida kuwa waliyasikia kutoka kwake; “yenu” huweka wazi tofauti inayodokezwa na muktadha bila kumtaja baba huyo mapema.
- source_word: ποιεῖτε
  choice: fanyeni
  rationale: Umbo la Kigiriki linaweza kueleweka kama amri au taarifa kwa sababu maumbo hayo yanafanana hapa. “Fanyeni” linafuata uhusiano wa kimantiki unaowezekana sana na οὖν, huku tanbihi ikihifadhi uwezekano wa taarifa.
- source_word: πατήρ / πατρὸς
  choice: Baba / baba
  rationale: “Baba” ya kwanza inaanza kwa herufi kubwa kwa kuwa inamtaja Mungu katika uhusiano wake na Yesu; ya pili inaachwa kwa herufi ndogo ili kuhifadhi tofauti ya kimuktadha bila kutangulia ufafanuzi wa mstari wa 44.
theological_decisions:
- issue: Kumtambulisha wazi baba wa pili kuwa Ibilisi
  choice: Kutumia “baba yenu” bila kutaja Ibilisi
  alternative: “kwa baba” au “kwa Ibilisi”
  rationale: Mstari wa 44 utamtambulisha wazi, lakini mstari huu huacha utambulisho huo ukiendelea kujitokeza katika hoja. “Baba yenu” ni Kiswahili cha asili na huhifadhi maendeleo hayo ya balagha.
- issue: Iwapo ποιεῖτε ni amri au taarifa
  choice: “fanyeni” (amri)
  alternative: “mnafanya” (taarifa)
  rationale: 'οὖν na ulinganifu wa kauli vinaweza kuunga mkono amri: kama Yesu anavyosema alichokiona kwa Baba, wao wafanye walichosikia kwa baba yao. Hata hivyo, Kigiriki chenyewe kina utata wa kimaumbo, kwa hiyo mbadala umehifadhiwa katika tanbihi.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni ya kawaida kwa wasomaji wengi, huku “Baba/baba” na tanbihi vikihifadhi utofauti na utata wa maandishi ya Kigiriki.
