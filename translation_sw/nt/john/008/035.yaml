id: JHN.8.35
reference: John 8:35
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὁ δὲ δοῦλος οὐ μένει ἐν τῇ οἰκίᾳ εἰς τὸν αἰῶνα· ⸀ὁ υἱὸς μένει εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/035.yaml
  text: The servant does not remain in the household forever[b][a]; the son remains forever.
translation:
  language: sw
  text: Mtumwa[a] habaki katika nyumba milele; mwana[b] hubaki milele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mtumishi”; neno la Kigiriki doulos linaweza kutumiwa kwa maana zote mbili, lakini hapa “mtumwa” linaonyesha vizuri zaidi tofauti ya hadhi yake na ya mwana katika nyumba.
    reason: lexical_alternative
  - marker: b
    text: Katika muktadha huu, “mwana” huenda pia likawa dokezo lisilo la moja kwa moja kwa Yesu, ingawa kauli yenyewe ina muundo wa kimethali.
    reason: alternative_reading
lexical_decisions:
- source_word: δοῦλος
  choice: mtumwa
  rationale: Neno hili linaonyesha mtu aliye katika hali ya utumwa, si mtumishi wa kawaida tu; hivyo linahifadhi tofauti ya hadhi kati yake na mwana katika nyumba.
- source_word: μένει
  choice: habaki / hubaki
  rationale: Kitenzi “-baki” kimetumiwa katika sehemu zote mbili ili kuhifadhi urudiaji wa Kigiriki na wazo la kuendelea kuwa na nafasi katika nyumba.
- source_word: οἰκία
  choice: nyumba
  rationale: “Nyumba” ni tafsiri ya kawaida na ya asili, na katika muktadha huu inaweza kumaanisha si jengo tu bali pia watu na mahusiano ya nyumbani.
- source_word: εἰς τὸν αἰῶνα
  choice: milele
  rationale: “Milele” linaeleza kwa ufupi na kwa kawaida hali ya kudumu inayokusudiwa katika vifungu vyote viwili.
- source_word: υἱός
  choice: mwana
  rationale: “Mwana” linahifadhi umoja na tofauti ya hadhi ya kifamilia dhidi ya mtumwa, bila kulifanya moja kwa moja kuwa cheo rasmi cha Kikristo.
- source_word: δὲ
  choice: —
  rationale: Kiunganishi hiki hakikutafsiriwa kwa neno tofauti kwa sababu utofautishaji tayari unaonekana wazi katika mpangilio wa sentensi mbili; kuongeza “sasa” kungeweza kudokeza maana ya wakati isiyokuwapo katika chanzo.
theological_decisions:
- issue: Dokezo linalowezekana kwamba “mwana” anamrejelea Yesu
  choice: mwana kwa herufi ndogo
  alternative: Mwana kwa herufi kubwa
  rationale: Kauli hiyo inaweza kusikika kama methali kuhusu hadhi katika nyumba, huku muktadha pia ukiandaa matumizi yake kwa Yesu katika mstari unaofuata. Herufi ndogo inahifadhi mvutano huo bila kuamua mapema kuwa hapa ni cheo rasmi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo mfupi wa kimethali na urudiaji wa “-baki” umehifadhiwa; “nyumba” hapa inaweza kubeba maana ya makao pamoja na jumuiya ya nyumbani.
