  text: But when[a] they continued questioning him, he straightened up and said to them, "Let the one among you who is without sin be the first to throw a stone at her."
translation:
  language: sw
  text: Lakini walipoendelea kumuuliza, alijiinua, akawaambia, “Yeye asiye na dhambi miongoni mwenu na awe wa kwanza kumtupia jiwe.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mstari huu ni sehemu ya simulizi kuhusu mwanamke aliyekutwa akizini (Yohana 7:53–8:11), ambalo halimo katika hati za kale zaidi za Kigiriki. Tazama maelezo kwenye Yohana 7:53.
    reason: textual_critical
lexical_decisions:
- source_word: ἐπέμενον ἐρωτῶντες
  choice: waliendelea kumuuliza
  rationale: Muundo wa kitenzi cha wakati usiotimilika pamoja na kirai cha wakati uliopo unaonyesha kwamba waliendelea kumhoji bila kukoma; usemi huu ni wa asili katika Kiswahili sanifu.
- source_word: ἀνακύψας
  choice: alijiinua
  rationale: Neno hili linaonyesha Yesu akiinua mwili kutoka hali ya kuinama iliyotajwa katika muktadha; “alijiinua” ni fasaha na haliongezi wazo la kusimama kabisa lisilosemwa wazi.
- source_word: ἀναμάρτητος
  choice: asiye na dhambi
  rationale: Huhifadhi maana pana ya kutokuwa na dhambi bila kuibana kuwa kutokuwa na hatia katika kosa hili pekee.
- source_word: πρῶτος ... τὸν λίθον βαλέτω
  choice: na awe wa kwanza kumtupia jiwe
  rationale: Huwasilisha kwa kawaida amri ya nafsi ya tatu katika Kigiriki na kudumisha mkazo wa kuwa wa kwanza kutekeleza hukumu.
theological_decisions:
- issue: Upeo wa ἀναμάρτητος
  choice: asiye na dhambi
  alternative: asiye na hatia katika jambo hili
  rationale: Kigiriki kinasema kwa upana “asiye na dhambi”; tafsiri haipaswi kuamua kimya kimya kwamba Yesu alimaanisha kosa hili pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Yeyote miongoni mwenu” ni wazi kwa wasomaji wa kawaida, na “kumtupia jiwe” ni usemi wa asili unaohifadhi tendo halisi la maandishi.
