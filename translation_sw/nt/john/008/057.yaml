base_translation:
  language: en
  yaml_path: translation/nt/john/008/057.yaml
  text: So the Jews said to him, “You are not yet fifty years old, and you have seen Abraham?”
translation:
  language: sw
  text: Basi Wayahudi[a] wakamwambia, “Bado hujafikisha umri wa miaka hamsini, nawe umemwona Abrahamu?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watu wa Yudea,” au “viongozi wa Kiyahudi,” kutegemea jinsi Yohana anavyokusudia neno hili lieleweke katika muktadha.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ Ἰουδαῖοι
  choice: Wayahudi
  rationale: Hili ndilo neno la moja kwa moja na la kawaida kwa kundi linalotajwa katika simulizi. Ingawa katika Injili ya Yohana linaweza kumaanisha Wayudea au viongozi wa Kiyahudi kulingana na muktadha, mstari huu wenyewe hauwataji viongozi pekee.
- source_word: οὖν
  choice: Basi
  rationale: Linaonyesha mwendelezo wa kimantiki kutoka kwa kauli iliyotangulia, kwa lugha ya kawaida na yenye hadhi.
- source_word: πεντήκοντα ἔτη οὔπω ἔχεις
  choice: Bado hujafikisha umri wa miaka hamsini
  rationale: Hii ni njia ya asili ya Kiswahili ya kueleza nahau ya Kigiriki inayotumia kitenzi ‘kuwa na’ kuhusiana na miaka ya umri.
- source_word: ἑώρακας
  choice: umemwona
  rationale: Kauli timilifu ya Kiswahili inaakisi hali timilifu ya kitenzi cha Kigiriki na kudumisha mshangao wa swali.
- source_word: καὶ
  choice: nawe
  rationale: Inahifadhi kiunganishi cha Kigiriki huku ikionyesha kwa njia ya kawaida ya Kiswahili utofauti unaosisitizwa katika swali la kutokuamini.
- source_word: Ἀβραὰμ
  choice: Abrahamu
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili cha Biblia.
theological_decisions:
- issue: Maana ya οἱ Ἰουδαῖοι katika Injili ya Yohana
  choice: Wayahudi
  alternative: Wayudea; viongozi wa Kiyahudi
  rationale: Neno la Kigiriki ni pana na mstari huu haulibani wazi kuwa viongozi pekee. Tafsiri kuu inahifadhi uteuzi wa moja kwa moja, huku tanbihi ikionyesha uwezekano wa maana nyingine kulingana na matumizi ya Yohana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “Bado hujafikisha umri wa miaka hamsini” ni wa kawaida, na “nawe umemwona Abrahamu?” hudumisha nguvu ya swali la mshangao bila kulifafanua kupita maandishi ya Kigiriki.
