  text: So if the Son sets you free[a], you will be truly free.
translation:
  language: sw
  text: Kwa hiyo, Mwana akiwaweka huru, mtakuwa huru kweli[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “huru kwa hakika” au “huru kweli kweli.” Kielezi cha Kigiriki kinasisitiza kwamba uhuru huo ni wa kweli na kamili.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: Kwa hiyo, ... akiwa-
  rationale: οὖν inaonyesha hitimisho kutokana na hoja iliyotangulia, na ἐὰν huanzisha sharti. Muundo wa Kiswahili wenye ‘akiwaweka’ unaeleza sharti hilo kwa lugha ya kawaida na yenye mtiririko mzuri.
- source_word: ὁ υἱὸς
  choice: Mwana
  rationale: Katika muktadha wa Yohana, jina hili linamtaja Yesu kwa cheo chake maalumu; herufi kubwa inaonyesha matumizi hayo bila kuongeza ufafanuzi usio katika mstari.
- source_word: ὑμᾶς
  choice: -wa- / mta-
  rationale: Viwakilishi hivi vinaonyesha wazi wingi wa nafsi ya pili uliopo katika Kigiriki.
- source_word: ἐλευθερώσῃ
  choice: akiwaweka huru
  rationale: Huhifadhi tendo la kuwaondoa katika hali ya utumwa na ni usemi wa kawaida wa Kiswahili katika muktadha huu.
- source_word: ὄντως
  choice: kweli
  rationale: Neno hili linasisitiza kwamba uhuru huo ni wa hakika na halisi.
- source_word: ἐλεύθεροι
  choice: huru
  rationale: Ni kivumishi kinachoeleza hali itakayopatikana, si tendo pekee, na pia kinadumisha uhusiano wa kimsamiati na ‘akiwaweka huru.’
- source_word: ἔσεσθε
  choice: mtakuwa
  rationale: Huwasilisha wakati ujao na wingi wa nafsi ya pili kwa Kiswahili sanifu cha sasa.
theological_decisions:
- issue: Utambulisho wa ‘Mwana’
  choice: Cheo kinachomtaja Yesu kwa namna ya pekee
  alternative: mwana yeyote kwa maana ya kawaida
  rationale: Katika muktadha wa Yohana, ‘Mwana’ ni sehemu ya kujifunua kwa Yesu na hoja yake kuhusu mamlaka, nafasi katika nyumba, na uhuru wa kweli.
- issue: Asili na upeo wa uhuru unaotajwa
  choice: Uhuru wa kweli bila kuubana katika tafsiri kuwa wa kisiasa, kijamii, au wa ndani pekee
  alternative: uhuru wa kiroho pekee au uhuru wa kijamii pekee
  rationale: Muktadha wa karibu unahusu utumwa wa dhambi, lakini mstari wenyewe unaeleza matokeo kwa upana; ‘huru kweli’ huhifadhi uzito huo bila kuongeza ufafanuzi unaozidi matini.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa, cha heshima, na kinachoeleweka kwa wasomaji wa kawaida. Muundo ‘akiwaweka’ ni sharti la kawaida la Kiswahili; ‘huru kweli’ huhifadhi msisitizo wa Kigiriki kwa ufupi.
