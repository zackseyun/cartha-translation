  text: ταῦτα τὰ ῥήματα ⸀ἐλάλησεν ἐν τῷ γαζοφυλακίῳ διδάσκων ἐν τῷ ἱερῷ· καὶ οὐδεὶς ἐπίασεν αὐτόν, ὅτι οὔπω ἐληλύθει ἡ ὥρα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/020.yaml
  text: He spoke these words in the treasury while teaching in the temple[a], and no one seized him[b], because his hour had not yet come.
translation:
  language: sw
  text: Yesu alisema maneno haya katika hazina alipokuwa akifundisha hekaluni[a]. Na hakuna mtu aliyemkamata, kwa sababu saa yake[b] ilikuwa bado haijafika.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika maeneo ya hekalu”; neno la Kigiriki hapa linarejelea eneo lote la hekalu, si patakatifu pa ndani pekee.
    reason: lexical_alternative
  - marker: b
    text: Katika Injili ya Yohana, “saa yake” hurejelea wakati uliowekwa wa mateso yake na kutukuzwa kwake; pia inaweza kutafsiriwa, “wakati wake uliowekwa.”
    reason: cross_reference
lexical_decisions:
- source_word: ταῦτα τὰ ῥήματα
  choice: maneno haya
  rationale: Hurejelea maneno ambayo Yesu alikuwa ametoka kusema; tafsiri hii ni ya kawaida na haiiongezei maana isiyokuwapo.
- source_word: ἐλάλησεν
  choice: alisema
  rationale: Katika Kiswahili, “alisema maneno haya” ni usemi wa asili na huwasilisha tendo la kunena kwa uwazi.
- source_word: ἐν τῷ γαζοφυλακίῳ
  choice: katika eneo la hazina
  rationale: γαζοφυλάκιον inaweza kumaanisha hazina au eneo la hazina ya hekalu, si lazima sanduku moja la sadaka; “eneo la hazina” huepuka picha finyu kupita kiasi.
- source_word: διδάσκων
  choice: alipokuwa akifundisha
  rationale: Huwasilisha tendo lililoendelea wakati uleule ambapo Yesu alisema maneno hayo.
- source_word: ἐν τῷ ἱερῷ
  choice: hekaluni
  rationale: Ni tafsiri ya kawaida ya Kiswahili, huku tanbihi ikifafanua kwamba ἱερόν hapa inaweza kurejelea eneo lote la hekalu.
- source_word: οὐδεὶς ἐπίασεν αὐτόν
  choice: hakuna mtu aliyemkamata
  rationale: πιάζω ina maana ya kumshika au kumkamata mtu kwa nguvu; “kumkamata” ni ya asili katika muktadha huu bila kulazimisha taratibu rasmi za kisheria.
- source_word: οὔπω ἐληλύθει
  choice: ilikuwa bado haijafika
  rationale: Huwakilisha hali iliyotangulia katika simulizi na kudumisha tamathali ya wakati unaofika.
- source_word: ἡ ὥρα αὐτοῦ
  choice: saa yake
  rationale: Tafsiri ya karibu huhifadhi matumizi yenye uzito wa kimada katika Injili ya Yohana badala ya kuyapunguza kuwa “wakati wake” tu.
theological_decisions:
- issue: Matumizi ya Yohana ya “saa yake”
  choice: Kuhifadhi usemi “saa yake” katika matini kuu.
  alternative: wakati wake uliowekwa
  rationale: Usemi huo unaelekeza kwenye wakati uliowekwa wa mateso na kutukuzwa kwa Yesu. Kuuhifadhi kunadumisha mvutano na mwangwi wa kimada wa Injili bila kuufafanua kupita kiasi ndani ya matini.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi na wenye staha. “Eneo la hazina” linaeleweka kwa msomaji wa kawaida na linaakisi maana pana inayowezekana ya mahali; “saa yake” inadumisha lugha ya kimada ya Yohana.
