  text: ἔλεγον οὖν οἱ Ἰουδαῖοι· Μήτι ἀποκτενεῖ ἑαυτὸν ὅτι λέγει· Ὅπου ἐγὼ ὑπάγω ὑμεῖς οὐ δύνασθε ἐλθεῖν;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/022.yaml
  text: So the Jews were saying[a], “Surely he will not kill himself, since he says, ‘Where I am going, you cannot come’?”
translation:
  language: sw
  text: Basi Wayahudi walikuwa wakisema[a], “Kweli hatajiua, kwa kuwa anasema, ‘Ninakoenda, ninyi hamwezi kuja’?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, yawezekana katika muktadha wa Yohana, “watu wa Yudea” au “viongozi wa Kiyahudi,” kutegemea jinsi Yohana alivyokusudia rejeo hili lieleweke hapa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: walikuwa wakisema
  rationale: Kauli ya wakati uliopita usiotimilika inadokeza usemi uliokuwa ukiendelea au kurudiwa; muundo huu unahifadhi hali hiyo kwa Kiswahili cha kawaida.
- source_word: οὖν
  choice: Basi
  rationale: Neno hili linaunganisha kauli yao na maneno yaliyotangulia kwa kuonyesha mwendelezo au hitimisho la kisimulizi.
- source_word: οἱ Ἰουδαῖοι
  choice: Wayahudi
  rationale: Huu ndio maana ya moja kwa moja ya kirai cha Kigiriki. Katika Yohana kinaweza kutaja hasa Wayahudi wa Uyahudi au viongozi wapinzani, lakini mstari huu wenyewe hauweki mpaka huo wazi.
- source_word: Μήτι
  choice: Kweli hatajiua ...?
  rationale: Μήτι huanzisha swali linalotazamia jibu la kukataa. Muundo huu wa Kiswahili unaonyesha mshangao wenye matarajio kwamba hatajiua.
- source_word: ἀποκτενεῖ ἑαυτόν
  choice: hatajiua
  rationale: Kitenzi na kiwakilishi rejeshi vinamaanisha moja kwa moja kwamba atajiua; usemi huu ni wa sasa, wazi, na wa kawaida.
- source_word: ὅτι
  choice: kwa kuwa
  rationale: 'Hapa linaanzisha msingi wa dhana yao: wanafikiri hivyo kutokana na maneno anayosema.'
- source_word: λέγει
  choice: anasema
  rationale: Wakati uliopo wa Kigiriki umehifadhiwa, nao unaendana vizuri na simulizi la moja kwa moja.
- source_word: Ὅπου ἐγὼ ὑπάγω
  choice: Ninakoenda
  rationale: Muundo huu ni wa asili katika Kiswahili na unahifadhi maana ya kwenda bila kuongeza kwa lazima wazo la kuondoka.
- source_word: οὐ δύνασθε ἐλθεῖν
  choice: ninyi hamwezi kuja
  rationale: Unatoa kwa ufupi na kwa kawaida maana ya kutokuwa na uwezo wa kuja; kiwakilishi kimewekwa ili kuhifadhi msisitizo na utofautishaji.
theological_decisions:
- issue: Wanaorejelewa na οἱ Ἰουδαῖοι katika Injili ya Yohana
  choice: Wayahudi
  alternative: Watu wa Uyahudi; viongozi wa Kiyahudi
  rationale: Tafsiri ya moja kwa moja inahifadhi upana wa kirai cha Kigiriki. Tanbihi inaarifu uwezekano wa maana finyu katika muktadha wa Yohana bila kuuingiza kama uhakika katika matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Walikuwa wakisema” huhifadhi hali endelevu ya kitenzi, na “Kweli hatajiua?” huwasilisha swali linalotazamia jibu la kukataa bila kutumia lugha ya kizamani.
