  text: καὶ ἐν τῷ νόμῳ δὲ τῷ ὑμετέρῳ γέγραπται ὅτι δύο ἀνθρώπων ἡ μαρτυρία ἀληθής ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/017.yaml
  text: And even in your law it is written that the testimony of two men is true[a].
translation:
  language: sw
  text: Na hata katika sheria yenu imeandikwa kwamba ushuhuda wa watu wawili ni wa kweli[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “unakubalika.” Katika muktadha huu wa kisheria, “wa kweli” unaweza kumaanisha kwamba ushuhuda huo unatambuliwa kuwa halali.
    reason: lexical_alternative
lexical_decisions:
- source_word: νόμῳ
  choice: sheria
  rationale: Neno hili hapa linarejelea sheria au maandiko ya Kiyahudi ambayo Yesu anayatumia kama msingi wa hoja. Herufi ndogo huhifadhi maana hiyo bila kulifanya lazima kuwa jina rasmi la Torati pekee.
- source_word: ὑμετέρῳ
  choice: yenu
  rationale: Huhifadhi usemi wa moja kwa moja na umbali wa kimajadiliano katika maneno ya Yesu bila kuongeza mkazo wa ‘yenu wenyewe.’
- source_word: γέγραπται
  choice: imeandikwa
  rationale: Huu ni usemi wa kawaida wa kunukuu Maandiko, nao pia unaonyesha kuwa kilichoandikwa kinaendelea kuwa na nguvu.
- source_word: δύο ἀνθρώπων
  choice: watu wawili
  rationale: ἄνθρωπος humaanisha binadamu au mtu; katika kanuni hii ya kisheria, ‘watu wawili’ ni ya asili katika Kiswahili na haiongezi maana ya wanaume pekee ambayo neno la Kigiriki halilazimishi.
- source_word: μαρτυρία
  choice: ushuhuda
  rationale: ‘Ushuhuda’ linafaa kwa muktadha wa kisheria na linaungana kwa ufasaha na kirai ‘wa watu wawili.’
- source_word: ἀληθής
  choice: wa kweli
  rationale: Huhifadhi maana ya moja kwa moja ya neno la Kigiriki, huku dokezo la chini likieleza maana yake ya kukubalika au kuwa halali kisheria.
- source_word: καὶ ... δὲ
  choice: Tena, hata
  rationale: Muunganiko huu unaendeleza hoja na kuongeza mkazo mdogo; ‘Tena, hata’ huleta nguvu hiyo kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Nguvu ya kimajadiliano ya ‘sheria yenu’
  choice: Kuhifadhi ‘sheria yenu’ kama ilivyo katika usemi wa Yesu kwa wasikilizaji wake.
  alternative: sheria; sheria yenu wenyewe
  rationale: Kivumishi cha nafsi ya pili kipo wazi katika Kigiriki. Kukihifadhi kunadumisha mvutano wa mazungumzo bila kudokeza kwamba Yesu anaikataa sheria, wala kuongeza mkazo usiokuwapo wazi.
- issue: Maana ya ἀνθρώπων katika kanuni ya kisheria
  choice: watu wawili
  alternative: wanaume wawili; binadamu wawili
  rationale: Neno la chanzo ni ἄνθρωπος, si ἀνήρ, na linaweza kutaja watu kwa ujumla. ‘Watu wawili’ huhifadhi upana huo na ni usemi wa kawaida wa kisheria katika Kiswahili.
- issue: Maana ya ἀληθής katika muktadha wa kisheria
  choice: ni wa kweli
  alternative: unakubalika; ni halali
  rationale: Tafsiri kuu huhifadhi maana ya moja kwa moja ‘wa kweli,’ bila kuondoa dokezo la uhalali wa kisheria; dokezo linaweka wazi uwezekano huo wa kimuktadha.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini rahisi kueleweka. Muundo ‘imeandikwa kwamba’ huhifadhi mtindo wa kunukuu Maandiko, na ‘Tena, hata’ huendeleza hoja kwa ufasaha.
