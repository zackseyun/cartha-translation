base_translation:
  language: en
  yaml_path: translation/nt/john/008/013.yaml
  text: So the Pharisees said to him, “You are testifying about yourself; your testimony is not true.”
translation:
  language: sw
  text: Kwa hiyo Mafarisayo wakamwambia, “Wewe unatoa ushuhuda juu yako mwenyewe; ushuhuda wako si wa kweli.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ushuhuda wako si halali.” Kigiriki kinasema “si wa kweli,” jambo ambalo katika muktadha huu linaweza pia kuwa na maana ya kutokuwa halali kisheria.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Huonyesha mwendelezo wa kimantiki kutoka kauli iliyotangulia, huku ikibaki ya kawaida na wazi katika Kiswahili.
- source_word: εἶπον ... αὐτῷ οἱ Φαρισαῖοι
  choice: Mafarisayo wakamwambia
  rationale: Muundo huu wa simulizi ni wa asili katika Kiswahili na unahifadhi mtendwa wa kiume katika αὐτῷ bila kuongeza jina la Yesu.
- source_word: Σὺ περὶ σεαυτοῦ μαρτυρεῖς
  choice: Wewe unajishuhudia mwenyewe
  rationale: “Wewe” pamoja na “mwenyewe” hudumisha msisitizo wa Σὺ na σεαυτοῦ; “unajishuhudia” ni usemi mfupi unaoeleweka kuwa anatoa ushuhuda kuhusu nafsi yake.
- source_word: ἡ μαρτυρία σου
  choice: ushuhuda wako
  rationale: Hudumisha uhusiano wa kileksika na kitenzi cha kushuhudia na maana ya ushahidi katika mabishano haya.
- source_word: οὐκ ἔστιν ἀληθής
  choice: si wa kweli
  rationale: Ni tafsiri ya moja kwa moja ya ἀληθής na haibani maana kuwa uhalali wa kisheria pekee.
theological_decisions:
- issue: Maana ya pingamizi la Mafarisayo kuhusu mtu kujishuhudia mwenyewe
  choice: ushuhuda wako si wa kweli
  alternative: ushuhuda wako si halali
  rationale: Muktadha una ladha ya kisheria, lakini ἀληθής ni pana kuliko istilahi maalumu ya uhalali. “Si wa kweli” huhifadhi mvutano kati ya ukweli wa ushuhuda na kukubalika kwake.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa mazungumzo ni wa kawaida kwa wasomaji wengi, huku msisitizo na maana ya ushuhuda zikihifadhiwa.
