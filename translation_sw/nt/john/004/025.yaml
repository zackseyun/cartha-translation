  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ἡ γυνή· Οἶδα ὅτι Μεσσίας ἔρχεται, ὁ λεγόμενος χριστός· ὅταν ἔλθῃ ἐκεῖνος, ἀναγγελεῖ ἡμῖν ⸀ἅπαντα.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/025.yaml
  text: The woman said to him[a], “I know that Messiah is coming” (the one called Messiah). “When he comes, he will tell us all things.”
translation:
  language: sw
  text: Mwanamke akamwambia, “Ninajua kwamba Masihi anakuja, yule aitwaye Kristo.[a] Atakapokuja huyo, atatueleza mambo yote.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Masihi” ni cheo cha Kisemiti; “Kristo” ni cheo cha Kigiriki. Vyote viwili vinamaanisha “Mtiwa-Mafuta.”
    reason: Kuhifadhi na kueleza ufafanuzi wa lugha mbili uliomo katika maandishi ya Kigiriki.
lexical_decisions:
- source_word: λέγει
  choice: akamwambia
  rationale: Ingawa Kigiriki kinatumia wakati uliopo wa kihistoria, ‘akamwambia’ ni simulizi la kawaida la Kiswahili na pia linaonyesha anayelengwa na maneno hayo.
- source_word: γυνή
  choice: mwanamke
  rationale: Katika muktadha huu neno hilo linamtaja mwanamke Msamaria, wala si mke.
- source_word: Οἶδα
  choice: ninajua
  rationale: Hili ni tamko la moja kwa moja na la kawaida la kuwa na ufahamu wa jambo.
- source_word: Μεσσίας
  choice: Masihi
  rationale: Ni umbo linalotambulika katika Kiswahili la cheo cha Kisemiti kinachomaanisha Mtiwa-Mafuta.
- source_word: ἔρχεται
  choice: anakuja
  rationale: Wakati uliopo wenye maana ya wakati ujao umehifadhiwa kwa namna ya kawaida na yenye hisia ya ukaribu.
- source_word: ὁ λεγόμενος χριστός
  choice: yaani, yule aitwaye Kristo
  rationale: Huhifadhi ufafanuzi wa Yohana unaoweka sambamba cheo cha Kisemiti ‘Masihi’ na cheo cha Kigiriki ‘Kristo’ bila kuvifanya viwe maneno yaleyale katika maandishi.
- source_word: ὅταν ἔλθῃ ἐκεῖνος
  choice: atakapokuja
  rationale: Hutoa kwa Kiswahili cha kawaida maana ya tukio la wakati ujao; kiambishi cha nafsi kinatosha kurejelea mhusika huyo.
- source_word: ἀναγγελεῖ
  choice: atatueleza
  rationale: Katika muktadha wa mazungumzo kuhusu ibada, kitenzi hiki kina maana ya kufanya mambo yajulikane au kuyafafanua.
- source_word: ἡμῖν ἅπαντα
  choice: mambo yote
  rationale: ‘Atatueleza’ tayari hujumuisha mtendewa ‘sisi’; ‘mambo yote’ huhifadhi nguvu pana ya ἅπαντα kwa Kiswahili cha asili.
theological_decisions:
- issue: Uwasilishaji wa Μεσσίας na χριστός katika kifungu kimoja
  choice: Kutumia ‘Masihi’ kwa Μεσσίας na ‘Kristo’ kwa χριστός katika ufafanuzi wa mabano wa kimantiki.
  alternative: Kutafsiri yote mawili kuwa ‘Masihi,’ jambo ambalo lingeficha tofauti ya lugha iliyo katika chanzo.
  rationale: Chanzo chenyewe kinatoa cheo cha Kisemiti kisha kukifafanua kwa cheo cha Kigiriki. Kutunza ‘Masihi’ na ‘Kristo’ huhifadhi muundo huo wa lugha mbili bila kudai kuwa ni vyeo viwili tofauti kiteolojia.
- issue: Upeo wa ‘mambo yote’
  choice: Kuacha kauli pana bila kuifafanua kuwa mafundisho fulani pekee.
  alternative: Kuandika ‘atatufafanulia mambo yote kuhusu ibada.’
  rationale: ἅπαντα ni pana katika maandishi; muktadha unaweza kuielekeza, lakini tafsiri haipaswi kupunguza upeo wake kimya-kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Akamwambia’ inafaa mtiririko wa simulizi; ‘ninajua’ na ‘atatueleza’ ni maneno ya kawaida na yanayoeleweka kwa wasomaji wengi.
