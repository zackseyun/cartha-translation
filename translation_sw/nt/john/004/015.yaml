  text: λέγει πρὸς αὐτὸν ἡ γυνή· Κύριε, δός μοι τοῦτο τὸ ὕδωρ, ἵνα μὴ διψῶ μηδὲ ⸀διέρχωμαι ἐνθάδε ἀντλεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/015.yaml
  text: The woman said to him[a], “Lord, give me this water, so that I may not be thirsty or come here to draw.”
translation:
  language: sw
  text: Mwanamke akamwambia[a], “Bwana, nipe maji hayo, ili nisiwe na kiu wala nisije hapa kuteka maji.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mheshimiwa, nipe maji hayo …”
    reason: Maana nyingine inayowezekana ya κύριε kama namna ya heshima ya kumwita mtu katika mazungumzo haya.
lexical_decisions:
- source_word: λέγει πρὸς αὐτὸν ἡ γυνή
  choice: Mwanamke akamwambia
  rationale: Ingawa λέγει ni wakati wa sasa wa kihistoria, Kiswahili cha masimulizi hutumia kwa kawaida kiambishi cha mfululizo -ka-. Kiambishi cha yambwa katika “akamwambia” kinawakilisha πρὸς αὐτόν kwa njia ya kawaida bila kurudia “yeye” isivyohitajika.
- source_word: Κύριε
  choice: Bwana
  rationale: “Bwana” huhifadhi maana ya msingi ya κύριος na pia uwezekano wa maana yenye kina katika Injili ya Yohana; katika mazungumzo haya inaweza vilevile kuwa namna ya heshima ya kumwita mtu.
- source_word: δός μοι
  choice: nipe
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya amri “nipe.”
- source_word: τοῦτο τὸ ὕδωρ
  choice: maji hayo
  rationale: Katika Kiswahili, msemaji anapoyarejelea maji yaliyotajwa na mtu mwingine, “maji hayo” ni ya kawaida kuliko “maji haya.” Neno “yaliyo hai” halijaongezwa kwa kuwa halirudiwi katika aya hii.
- source_word: ἵνα μὴ διψῶ
  choice: ili nisiwe na kiu
  rationale: “Ili” huonyesha kusudi, na “nisiwe na kiu” ni Kiswahili cha kawaida kinachohifadhi hali ya utegemezi bila kuifanya ahadi ya uhakika.
- source_word: μηδὲ διέρχωμαι ἐνθάδε
  choice: wala nisiendelee kuja hapa
  rationale: “Wala” huhifadhi nguvu ya nyongeza hasi ya μηδέ. Muundo wa wakati wa sasa katika διέρχωμαι unaweza kudokeza tendo linalorudiwa, hivyo “nisiendelee kuja” huonyesha kusudi la kutorudia safari hizi.
- source_word: ἀντλεῖν
  choice: kuteka
  rationale: Katika muktadha wa kisima, “kuteka” hueleweka kwa kawaida kuwa kuteka maji; kutaja “maji” tena si lazima na kunafuata ukaribu wa maandishi ya Kigiriki.
theological_decisions:
- issue: Maana ya κύριος katika namna mwanamke Msamaria anavyomwita Yesu
  choice: Bwana
  alternative: Mheshimiwa
  rationale: “Bwana” huhifadhi mwangwi unaowezekana wa kikristo katika Injili ya Yohana bila kudai kwamba mwanamke tayari anakiri wazi utambulisho kamili wa Yesu. Kwa kuwa katika kiwango cha mazungumzo inaweza kuwa heshima tu, maana hiyo mbadala imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa masimulizi “akamwambia” na vitenzi “nipe,” “nisiwe,” na “nisiendelee” ni wa kawaida kwa wasomaji wengi. Tanbihi huhifadhi mvutano kati ya “Bwana” kama jina lenye uzito wa kitheolojia na matumizi ya kawaida ya heshima.
