  yaml_path: translation/nt/john/004/024.yaml
  text: God is spirit[b][a], and those who worship him must worship in spirit and truth.
translation:
  language: sw
  text: Mungu ni roho[b], na wale wanaomwabudu lazima wamwabudu katika roho na kweli.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika Roho na kweli.” Kigiriki kinaweza kueleweka kwa maana hii iliyo mahususi zaidi, lakini maneno ya tafsiri yanahifadhi maana pana ya usemi huo.
    reason: alternative_reading
  - marker: b
    text: “Mungu ni roho” inaeleza asili ya Mungu; haimaanishi tu kwamba Mungu ni roho mmoja miongoni mwa roho wengine.
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεῦμα
  choice: roho
  rationale: Nomino kiarifu isiyo na kibainishi kabla ya ὁ θεός inaeleza asili au sifa ya Mungu, si kwamba Mungu ni roho mmoja tu miongoni mwa viumbe wa roho.
- source_word: ὁ θεός
  choice: Mungu
  rationale: Hili ndilo neno la kawaida la Kiswahili; kibainishi cha Kigiriki kinaonyesha kwamba ‘Mungu’ ndiye kiima cha kishazi.
- source_word: τοὺς προσκυνοῦντας αὐτόν
  choice: wale wanaomwabudu
  rationale: Kivumishi-ushiriki chenye kibainishi kinataja waabudu kama kundi; usemi huu ni wa kawaida na huhifadhi maana ya jumla inayoendelea.
- source_word: ἐν πνεύματι
  choice: katika roho
  rationale: Tafsiri hii huhifadhi upana wa usemi wa Kigiriki usio na kibainishi, bila kuufanya kwa lazima kuwa rejeo la moja kwa moja kwa Roho Mtakatifu au kuwa unyofu wa ndani tu.
- source_word: ἀληθείᾳ
  choice: kweli
  rationale: ‘Kweli’ ni tafsiri ya kawaida na inayofaa katika matumizi ya Yohana, ambapo neno hilo linaweza kujumuisha ukweli na uhalisi wa ufunuo.
- source_word: δεῖ
  choice: wanapaswa
  rationale: Hueleza ulazima. ‘Wanapaswa’ ni Kiswahili cha kawaida na chenye nguvu ya wajibu katika muundo huu.
- source_word: προσκυνεῖν
  choice: kumwabudu
  rationale: Ni kitenzi-jina kinachokamilisha δεῖ; ‘kumwabudu’ ndiyo tafsiri ya kawaida katika muktadha huu, bila kulazimisha ishara ya kimwili ya kusujudu.
theological_decisions:
- issue: Maana ya ‘Mungu ni roho’
  choice: Kauli ya ubora kuhusu asili ya Mungu
  alternative: Mungu ni roho mmoja
  rationale: Mpangilio wa maneno ya Kigiriki na kutokuwapo kwa kibainishi katika πνεῦμα vinaunga mkono maana ya ubora; tafsiri haimweki Mungu tu katika kundi la viumbe wa roho.
- issue: Maana ya ‘katika roho na kweli’
  choice: Ibada inayofanyika katika roho na kweli, huku upana wa usemi ukihifadhiwa
  alternative: katika Roho na kweli; kwa unyofu na kweli
  rationale: πνεύματι na ἀληθείᾳ hazina vibainishi na zimeunganishwa kwa usawa. Tafsiri haibani maana kuwa rejeo la Roho Mtakatifu pekee wala unyofu wa moyoni pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa kawaida kwa wasomaji wengi; ‘katika roho na kweli’ umehifadhiwa kwa makusudi ili kutatua kidogo iwezekanavyo utata halisi wa kifungu.
