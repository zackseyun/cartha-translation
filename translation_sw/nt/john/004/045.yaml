  text: ὅτε οὖν ἦλθεν εἰς τὴν Γαλιλαίαν, ἐδέξαντο αὐτὸν οἱ Γαλιλαῖοι, πάντα ἑωρακότες ⸀ὅσα ἐποίησεν ἐν Ἱεροσολύμοις ἐν τῇ ἑορτῇ, καὶ αὐτοὶ γὰρ ἦλθον εἰς τὴν ἑορτήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/045.yaml
  text: So when he came into Galilee[a], the Galileans welcomed him, having seen all that he had done in Jerusalem at the feast[b], for they too had gone to the feast.
translation:
  language: sw
  text: Basi, alipofika Galilaya, Wagalilaya walimkaribisha, wakiwa wameona yote aliyokuwa amefanya huko Yerusalemu wakati wa sikukuu[a], maana wao pia walikuwa wamekwenda kwenye sikukuu hiyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sherehe.” Neno la Kigiriki ἑορτή linamaanisha sikukuu ya kidini; katika muktadha huu linarejelea sikukuu iliyofanyika Yerusalemu.
    reason: cultural_note
lexical_decisions:
- source_word: ὅτε οὖν
  choice: Basi, alipofika
  rationale: ‘Basi’ linaendeleza simulizi na kuhifadhi nguvu ya kiunganishi οὖν; muundo wa ‘alipofika’ ni wa asili katika Kiswahili.
- source_word: ἦλθεν εἰς τὴν Γαλιλαίαν
  choice: alipofika Galilaya
  rationale: ‘Kufika Galilaya’ huonyesha mwendo kuingia katika eneo hilo kwa Kiswahili cha kawaida bila kuwa tafsiri ngumu ya neno kwa neno.
- source_word: ἐδέξαντο αὐτὸν
  choice: walimkaribisha
  rationale: Katika muktadha huu δέχομαι inaonyesha kumpokea kwa nia njema; ‘walimkaribisha’ huwasilisha maana hiyo ya kijamii.
- source_word: οἱ Γαλιλαῖοι
  choice: Wagalilaya
  rationale: Ni jina fupi na la kawaida kwa watu wa Galilaya.
- source_word: πάντα ἑωρακότες ὅσα
  choice: kwa kuwa walikuwa wameona yote
  rationale: Kirai tegemezi kinaonyesha tendo la kuona lililotangulia na pia msingi wa kukaribishwa kwake; ‘kwa kuwa’ linaweka wazi uhusiano huo unaodokezwa na kishirikishi.
- source_word: ἐποίησεν
  choice: aliyofanya
  rationale: Muundo huu unategemea ‘walikuwa wameona’ na kwa kawaida unaonyesha matendo yaliyotangulia bila kurudia alama ya wakati uliopita timilifu.
- source_word: ἐν Ἱεροσολύμοις
  choice: Yerusalemu
  rationale: Baada ya ‘aliyofanya,’ Kiswahili kinaweza kutumia jina la mahali moja kwa moja kwa maana ya ‘huko Yerusalemu.’
- source_word: ἐν τῇ ἑορτῇ
  choice: wakati wa sikukuu
  rationale: Huonyesha kwa asili kwamba matendo yalifanyika katika kipindi cha sherehe ya kidini.
- source_word: καὶ αὐτοὶ γὰρ
  choice: maana wao pia
  rationale: ‘Maana’ huhifadhi kazi ya γάρ ya kutoa maelezo, na ‘wao pia’ huhifadhi msisitizo na ujumuishaji wa αὐτοὶ καί.
- source_word: ἦλθον εἰς τὴν ἑορτήν
  choice: walikuwa wamekwenda kwenye sikukuu hiyo
  rationale: Wakati uliopita timilifu unaonyesha kwamba kuhudhuria kwao kulitangulia kumpokea Yesu; ‘hiyo’ hurejelea sikukuu iliyotajwa tayari.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini rahisi kueleweka. ‘Walimkaribisha’ limechaguliwa badala ya ‘walimpokea’ kwa sababu muktadha unaonyesha mapokezi yenye nia njema. Alama ya tanbihi [a] imewekwa baada ya kutajwa kwa kwanza kwa sikukuu.
