  text: ἐγὼ ἀπέστειλα ὑμᾶς θερίζειν ὃ οὐχ ὑμεῖς κεκοπιάκατε· ἄλλοι κεκοπιάκασιν, καὶ ὑμεῖς εἰς τὸν κόπον αὐτῶν εἰσεληλύθατε.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/038.yaml
  text: I sent you to reap what you have not labored for[a]; others have labored[b], and you have entered into their labor.
translation:
  language: sw
  text: Mimi niliwatuma kuvuna kile ambacho hamkukifanyia kazi[a]. Wengine wamefanya kazi, nanyi mmeingia katika kazi yao[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuvuna mavuno ambayo hamkuyafanyia kazi.”
    reason: lexical_alternative
  - marker: b
    text: Kwa maana halisi zaidi, “mmeingia katika taabu yao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλα
  choice: niliwatuma
  rationale: Wakati uliopita rahisi unaonyesha tendo la kuwatuma lililokamilika katika muktadha huu, huku ukihifadhi wazo la utume bila kulipanua kuwa ‘niliwapa agizo.’
- source_word: θερίζειν
  choice: kuvuna
  rationale: Neno hili linadumisha mfano wa kilimo unaotawala muktadha; ‘kuvuna’ ni neno la kawaida na la moja kwa moja katika Kiswahili.
- source_word: ὃ
  choice: kile ambacho
  rationale: Kiwakilishi hiki cha uhusiano kimetumika kama nomino. ‘Kile ambacho’ ni wazi na cha asili, na kinaonyesha kitu kinachovunwa bila kukitaja kwa tafsiri ya ziada.
- source_word: κεκοπιάκατε
  choice: hamkukifanyia kazi
  rationale: Usemi huu unaeleza kwamba wao hawakufanya kazi iliyoleta kile kinachovunwa. Unasikika kwa urahisi katika Kiswahili na hauongezi utambulisho wa waliofanya kazi hiyo.
- source_word: ἄλλοι
  choice: wengine
  rationale: Hili ni sawia la moja kwa moja na linaacha utambulisho wa watu hao wazi kama ulivyo katika Kigiriki.
- source_word: κεκοπιάκασιν
  choice: wamefanya kazi kwa bidii
  rationale: Kitenzi kina maana ya kufanya kazi kwa juhudi au kuchoka. Wakati timilifu wa Kiswahili unaonyesha kazi iliyotangulia yenye matokeo yanayoendelea, na ‘kwa bidii’ huhifadhi uzito wa juhudi.
- source_word: εἰς τὸν κόπον αὐτῶν εἰσεληλύθατε
  choice: mmeingia katika kazi yao
  rationale: Tafsiri hii inafuata picha ya Kigiriki ya ‘kuingia katika kazi yao’ na kuhifadhi hali ya sasa inayotokana na tendo lililotangulia. Haibadili waziwazi ‘kazi’ kuwa ‘matunda ya kazi,’ ingawa maana hiyo inaweza kueleweka katika muktadha.
- source_word: ἐγὼ ... ὑμεῖς
  choice: Mimi ... nanyi
  rationale: Viwakilishi vilivyotajwa wazi katika Kigiriki vina msisitizo fulani. ‘Mimi’ na ‘nanyi’ vinahifadhi tofauti hiyo kwa njia ya kawaida katika Kiswahili.
- source_word: κόπον
  choice: kazi
  rationale: Ingawa neno linaweza kumaanisha taabu au kazi ngumu, ‘kazi’ ni la asili zaidi katika usemi ‘kuingia katika kazi yao’; uzito wa juhudi umeonyeshwa katika sentensi iliyotangulia kwa ‘kwa bidii.’
theological_decisions:
- issue: Maana ya mfano wa mavuno na utambulisho wa ‘wengine’
  choice: Mfano wa kilimo na utambulisho mpana wa ‘wengine’ umeachwa bila kufafanuliwa zaidi.
  alternative: Kuwataja ‘wengine’ kuwa manabii, Yohana Mbatizaji, Yesu mwenyewe, au mashahidi waliotangulia.
  rationale: Aya yenyewe haitaji watu hao ni nani. Kutowabainisha kunahifadhi utata halisi wa matini na kuepuka kuingiza tafsiri maalumu ya kiteolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Kuvuna’ hudumisha mfano wa kilimo, huku ‘kazi kwa bidii’ ikieleza juhudi bila kutumia ‘taabu’ kwa namna inayoweza kueleweka hasa kuwa mateso.
