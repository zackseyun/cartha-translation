base_translation:
  language: en
  yaml_path: translation/nt/john/004/017.yaml
  text: 'The woman answered and said to him[a], “I do not have a husband.” Jesus said to her[b], “You have spoken well: ‘I do not have a husband.’”'
translation:
  language: sw
  text: Mwanamke akamjibu, “Sina mume[a].” Yesu akamwambia, “Umesema vyema, ‘Sina mume.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki lililotafsiriwa “mume” linaweza pia kumaanisha “mwanamume”; hapa muktadha unaonyesha maana ya “mume.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη ἡ γυνὴ καὶ εἶπεν
  choice: Mwanamke akajibu
  rationale: Muundo huu wa kawaida wa masimulizi ya Kiswahili unawasilisha tendo la kujibu na kusema bila kurudia maneno kwa namna isiyo ya kawaida.
- source_word: Οὐκ ἔχω ἄνδρα
  choice: Sina mume
  rationale: Katika muktadha huu ἀνήρ humaanisha mume. “Sina mume” ni usemi wa sasa, wa kawaida, na sahihi katika Kiswahili.
- source_word: λέγει αὐτῇ ὁ Ἰησοῦς
  choice: Yesu akamwambia
  rationale: Wakati uliopo wa kihistoria wa Kigiriki umetafsiriwa kwa wakati wa masimulizi wa Kiswahili ili sentensi isomeke kwa kawaida.
- source_word: Καλῶς εἶπας
  choice: Umesema vyema
  rationale: Tafsiri hii inadumisha tathmini chanya ya Yesu kuhusu ukweli wa kauli ya mwanamke, bila kuongeza maana ya ziada.
- source_word: Ἄνδρα οὐκ ἔχω
  choice: Sina mume
  rationale: Kurudiwa kwa kauli kumehifadhiwa kwa sababu Yesu ananukuu maneno ya mwanamke.
theological_decisions:
- issue: Maana ya ἀνήρ katika kauli ya mwanamke
  choice: mume
  alternative: mwanamume
  rationale: Ingawa ἀνήρ inaweza kumaanisha “mwanamume” au “mume,” muktadha wa historia yake ya ndoa katika mstari unaofuata unaonyesha kuwa hapa maana ni “mume.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima, na rahisi kueleweka. Muundo wa Kigiriki “akajibu na kusema” umefupishwa kuwa “akajibu” kwa ufasaha wa kawaida wa Kiswahili, huku maana kamili ikihifadhiwa.
