  text: μὴ σὺ μείζων εἶ τοῦ πατρὸς ἡμῶν Ἰακώβ, ὃς ἔδωκεν ἡμῖν τὸ φρέαρ καὶ αὐτὸς ἐξ αὐτοῦ ἔπιεν καὶ οἱ υἱοὶ αὐτοῦ καὶ τὰ θρέμματα αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/john/004/012.yaml
  text: Are you greater than our father Jacob[a], who gave us the well and drank from it himself, as did his sons and his livestock?
translation:
  language: sw
  text: Je, wewe ni mkuu kuliko baba yetu Yakobo,[a] ambaye alitupa kisima, naye mwenyewe alikunywa maji kutoka katika kisima hicho; wanawe na mifugo yake pia walikunywa maji kutoka humo?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa uwazi zaidi, “Hakika wewe si mkuu kuliko baba yetu Yakobo, sivyo?” Swali la Kigiriki lenye μή linatarajia jibu la kukataa.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ σὺ
  choice: Je, wewe ni
  rationale: Muundo wa swali wenye μή unatarajia jibu la kukataa. Kiswahili cha kawaida huwasilisha changamoto hiyo kwa swali la balagha; kiwakilishi “wewe” kinahifadhi msisitizo wa σὺ.
- source_word: μείζων
  choice: mkuu kuliko
  rationale: Hapa ulinganisho unahusu ukuu au hadhi, si ukubwa wa mwili; “mkuu kuliko” ni wa kawaida na unaofaa muktadha.
- source_word: τοῦ πατρὸς ἡμῶν Ἰακώβ
  choice: baba yetu Yakobo
  rationale: Inahifadhi lugha ya heshima ya ukoo na dai la mwanamke kuhusu urithi wa babu yao.
- source_word: ἔδωκεν ἡμῖν
  choice: alitupa
  rationale: Wakati uliopita sahili unaakisi aoristi kama tendo la kihistoria lililokamilika.
- source_word: τὸ φρέαρ
  choice: kisima hiki
  rationale: φρέαρ ni kisima katika muktadha huu. “Hiki” ni nyongeza ya kidiktiki iliyo ya kawaida kwa Kiswahili katika rejea ya kisima kilichopo mbele ya wazungumzaji, bila kubadili rejea.
- source_word: καὶ αὐτὸς ἐξ αὐτοῦ ἔπιεν
  choice: naye mwenyewe akanywa maji yake
  rationale: “Mwenyewe” huhifadhi msisitizo wa αὐτός. “Akanywa maji yake” ni Kiswahili cha asili zaidi kuliko “akanywa kutoka humo,” huku kikidokeza kwa usahihi maji ya kisima.
- source_word: οἱ υἱοὶ αὐτοῦ
  choice: wanawe
  rationale: υἱοί hapa ni wana wa kiume; “wanawe” ni fupi, ya asili, na sahihi.
- source_word: τὰ θρέμματα αὐτοῦ
  choice: mifugo yake
  rationale: Neno hili linahusu wanyama wanaofugwa kwa ujumla; “mifugo” halibanwi kuwa ng'ombe pekee.
theological_decisions:
- issue: Nguvu ya swali la balagha linaloanzishwa na μή
  choice: Swali la balagha linalotarajia jibu “hapana,” likifafanuliwa kwa tanbihi
  alternative: “Hakika wewe si mkuu kuliko baba yetu Yakobo, sivyo?”
  rationale: Maandishi makuu yanabaki ya kawaida na yenye changamoto, huku tanbihi ikihifadhi wazi matarajio hasi yaliyowekwa na μή bila kugeuza swali kuwa kauli ya moja kwa moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mpangilio ni wa kawaida kwa wasomaji wa kawaida, huku swali la balagha na msisitizo wa “wewe” na “mwenyewe” vikihifadhiwa.
