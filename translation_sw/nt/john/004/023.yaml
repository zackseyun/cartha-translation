source:
  edition: SBLGNT
  text: ἀλλὰ ἔρχεται ὥρα καὶ νῦν ἐστιν, ὅτε οἱ ἀληθινοὶ προσκυνηταὶ προσκυνήσουσιν τῷ πατρὶ ἐν πνεύματι καὶ ἀληθείᾳ, καὶ γὰρ ὁ πατὴρ τοιούτους ζητεῖ τοὺς προσκυνοῦντας αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/023.yaml
  text: But an hour is coming[a], and is now here, when the true worshipers will worship the Father in spirit and truth; for the Father indeed seeks such people to worship him.
translation:
  language: sw
  text: Lakini saa inakuja, na sasa ipo, ambapo waabudu wa kweli watamwabudu Baba katika roho na kweli[a]; kwa maana Baba anawatafuta watu wa namna hiyo, yaani wanaomwabudu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika Roho na kweli.” Kigiriki kinaweza kumaanisha ibada inayowezeshwa na Roho Mtakatifu, ibada katika roho ya mwanadamu, au ibada yenye uhalisi wa kiroho.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: Lakini
  rationale: Inaonyesha utofautishaji na mazungumzo yaliyotangulia kuhusu mahali pa kuabudia.
- source_word: ἔρχεται ὥρα
  choice: saa inakuja
  rationale: Inahifadhi taswira ya 'saa' iliyo muhimu katika Yohana, badala ya kuipanua kuwa 'wakati'.
- source_word: καὶ νῦν ἐστιν
  choice: nayo imekwisha kufika
  rationale: Ni Kiswahili cha kawaida kinachoonyesha kwamba saa iliyotarajiwa tayari imeanza kuwapo.
- source_word: οἱ ἀληθινοὶ προσκυνηταὶ
  choice: waabudu wa kweli
  rationale: Inadumisha maana ya waabudu halisi au wa genuine bila kuingiza tofauti ya kimadhehebu.
- source_word: προσκυνήσουσιν τῷ πατρὶ
  choice: watamwabudu Baba
  rationale: Kitenzi cha wakati ujao na yambwa yake vinatolewa kwa Kiswahili cha moja kwa moja na cha asili.
- source_word: ἐν πνεύματι καὶ ἀληθείᾳ
  choice: katika roho na kweli
  rationale: Inahifadhi nomino zote mbili na utata wa πνεῦμα badala ya kuamua kimya kimya kuwa ni Roho Mtakatifu au roho ya mwanadamu.
- source_word: καὶ γὰρ
  choice: kwa maana
  rationale: Inaonyesha sababu inayofuata; msisitizo wa καί unasikika kwa mtiririko wa sentensi bila kuongeza neno lisilo la lazima.
- source_word: τοιούτους ζητεῖ
  choice: anawatafuta watu kama hao
  rationale: Wakati wa sasa wa ζητεῖ na aina ya watu inayorejelewa na τοιούτους vinaelezwa kwa Kiswahili cha kawaida.
- source_word: τοὺς προσκυνοῦντας αὐτόν
  choice: wamwabudu
  rationale: Kifungu cha kushiriki kinaonyesha kusudi au sifa ya watu hao; katika Kiswahili, 'wamwabudu' ni kifupi na cha asili.
theological_decisions:
- issue: Maana ya ἐν πνεύματι
  choice: katika roho
  alternative: katika Roho; kiroho
  rationale: Neno la Kigiriki halina kibainishi na linaweza kurejelea Roho Mtakatifu, roho ya mwanadamu, au namna ya ibada yenye uhalisi wa kiroho. Matini kuu haifungi maana moja.
- issue: Maana ya 'waabudu wa kweli'
  choice: waabudu wa kweli
  alternative: waabudu halisi
  rationale: Huhifadhi sifa ya ἀληθινοί kama uhalisi au ukweli bila kudokeza kundi fulani la kidini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Saa' imehifadhiwa kwa sababu ya matumizi yake ya kipekee katika Injili ya Yohana. Alama ya tanbihi [a] imewekwa baada ya kirai chote kinachohusika.
