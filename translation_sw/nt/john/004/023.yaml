revisions:
- from: Lakini saa inakuja, nayo imekwisha kufika, ambapo waabudu wa kweli watamwabudu Baba katika roho na kweli[a]; kwa maana Baba anawatafuta watu kama hao wamwabudu.
  to: Lakini saa inakuja, na sasa ipo, ambapo waabudu wa kweli watamwabudu Baba katika roho na kweli[a]; kwa maana Baba anawatafuta watu wa namna hiyo, yaani wanaomwabudu.
  rationale: Revision preserves the Greek present force of καὶ νῦν ἐστιν, clarifies that the Father seeks people characterized as worshiping him, and retains the deliberate ambiguity of ἐν πνεύματι in both the text and footnote.
