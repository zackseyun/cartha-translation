  yaml_path: translation/nt/john/004/044.yaml
  text: For Jesus himself testified that a prophet has no honor in his own homeland[a].
translation:
  language: sw
  text: Kwa maana Yesu mwenyewe alishuhudia kwamba nabii hapati heshima katika nchi yake mwenyewe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “katika eneo lake mwenyewe” au “mahali pake pa asili.” Neno la Kigiriki πατρίς linaweza kumaanisha nchi ya mtu, eneo lake la nyumbani, au mahali pake pa asili.
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: Kwa maana
  rationale: Inaonyesha kuwa kauli hii inatoa maelezo yanayohusiana na simulizi linaloizunguka.
- source_word: αὐτὸς ... Ἰησοῦς
  choice: Yesu mwenyewe
  rationale: Inahifadhi msisitizo wa αὐτός pamoja na jina Yesu kwa Kiswahili cha kawaida.
- source_word: ἐμαρτύρησεν
  choice: alikuwa ameshuhudia
  rationale: Kitenzi hiki kinadumisha lugha muhimu ya ushuhuda katika Injili ya Yohana; wakati timilifu uliopita unaonyesha ushuhuda uliotolewa kabla ya hatua inayosimuliwa katika muktadha.
- source_word: ὅτι
  choice: kwamba
  rationale: Inatanguliza yaliyomo katika ushuhuda wa Yesu kwa namna ya kawaida katika Kiswahili.
- source_word: προφήτης
  choice: nabii
  rationale: Nomino isiyo na kibainishi ina maana ya kijumla katika msemo huu; Kiswahili hakihitaji kibainishi kisicho maalumu.
- source_word: ἐν τῇ ἰδίᾳ πατρίδι
  choice: katika nchi yake mwenyewe
  rationale: πατρίς inaweza kumaanisha nchi ya asili, eneo la nyumbani, au mahali alikozaliwa; 'nchi yake mwenyewe' ni ya kawaida na haibani rejeo la kijiografia.
- source_word: τιμὴν οὐκ ἔχει
  choice: hapati heshima
  rationale: Ni usemi wa asili wa Kiswahili unaowasilisha kwamba nabii hatambuliwi wala kupewa heshima katika kwao, huku ukihifadhi nomino 'heshima'.
theological_decisions:
- issue: Rejeo na upeo wa “nchi yake mwenyewe” katika muktadha wa Yohana
  choice: Kuacha msemo ukiwa wa jumla bila kutaja eneo fulani
  alternative: Kutaja Yudea, Galilaya, au Nazareti
  rationale: Mstari wenyewe hautambui wazi eneo linalokusudiwa. Tafsiri pana inahifadhi utata wa simulizi na haingizi suluhisho la kimadhehebu au la kiufafanuzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. “Kwa maana” hudumisha kiunganishi cha ufafanuzi; “alikuwa ameshuhudia” huunganisha kauli kwa kawaida na muktadha uliotangulia. Alama ya tanbihi [a] imewekwa katika matini kuu.
