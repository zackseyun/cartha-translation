id: JHN.4.31
reference: John 4:31
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ⸀Ἐν τῷ μεταξὺ ἠρώτων αὐτὸν οἱ μαθηταὶ λέγοντες· Ῥαββί, φάγε.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/031.yaml
  text: Meanwhile, the disciples were urging him, saying, “Rabbi, eat.”
translation:
  language: sw
  text: Wakati huohuo[a], wanafunzi walikuwa wakimsihi[b] wakisema, “Rabi[c], kula.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Katika muda huo.”
    reason: lexical_alternative
  - marker: b
    text: Kitenzi hiki kinaweza pia kutafsiriwa “walikuwa wakimwomba” au “waliendelea kumwomba”; hapa kina maana ya kumsihi Yesu ale.
    reason: lexical_alternative
  - marker: c
    text: “Rabi” ni jina la heshima la Kiyahudi linalotumiwa kumwita mtu; pia humaanisha “Mwalimu.”
    reason: cultural_note
lexical_decisions:
- source_word: Ἐν τῷ μεταξὺ
  choice: Wakati huohuo
  rationale: Nahau hii inaonyesha muda uliokuwa ukiendelea kati ya kuondoka kwa mwanamke na mazungumzo yaliyofuata. “Wakati huohuo” ni Kiswahili cha kawaida na fasaha kinachohifadhi uhusiano huo wa wakati.
- source_word: ἠρώτων
  choice: walikuwa wakimsihi
  rationale: Wakati usiotimilifu wa kitenzi unaonyesha tendo lililoendelea au kurudiwa. Katika muktadha, wanafunzi hawakuuliza swali bali walimhimiza Yesu ale; “walikuwa wakimsihi” huonyesha ombi lao lenye msisitizo bila kulifanya kuwa amri.
- source_word: αὐτὸν
  choice: -m- katika “wakimsihi”
  rationale: Kiwakilishi hiki ni yambwa kinachomrejelea Yesu na huwakilishwa kiasili kwa kiambishi cha yambwa katika kitenzi cha Kiswahili.
- source_word: οἱ μαθηταὶ
  choice: wanafunzi
  rationale: Kikundi kinachorejelewa kinajulikana katika muktadha. Kiswahili hakihitaji kibainishi kinacholingana na neno la Kigiriki hapa.
- source_word: λέγοντες
  choice: wakisema
  rationale: Umbo hili linaunganisha maneno yao na tendo la kumsihi kwa njia ya kawaida na iliyo karibu na muundo wa chanzo.
- source_word: Ῥαββί
  choice: Rabi
  rationale: Jina hili la heshima la Kiyahudi limehifadhiwa kwa unukuzi wa Kiswahili badala ya kubadilishwa moja kwa moja kuwa “Mwalimu”; maana yake inaelezwa katika tanbihi.
- source_word: φάγε
  choice: kula
  rationale: Ni agizo la moja kwa moja kwa nafsi ya pili umoja. “Kula” ni tafsiri sahihi, fupi, na ya kawaida bila kuongeza kitu kisichotajwa katika chanzo.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa sasa, wenye hadhi, na unaoeleweka kwa urahisi. Muundo wa tendo linaloendelea umehifadhiwa katika “walikuwa wakimsihi,” na jina la heshima “Rabi” limeachwa katika matini huku maana yake ikifafanuliwa katika tanbihi.
