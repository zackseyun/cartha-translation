  text: Ἔρχεται γυνὴ ἐκ τῆς Σαμαρείας ἀντλῆσαι ὕδωρ. λέγει αὐτῇ ὁ Ἰησοῦς· Δός μοι πεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/007.yaml
  text: A woman from Samaria came to draw water. Jesus said to her[a], “Give me a drink.”
translation:
  language: sw
  text: Mwanamke mmoja kutoka Samaria akaja kuteka maji. Yesu akamwambia[a], “Nipe maji ninywe.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata nyakati za vitenzi vya Kigiriki kwa karibu zaidi, “anakuja … anamwambia”; Kigiriki hutumia wakati uliopo wa kihistoria katika simulizi.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔρχεται
  choice: akaja
  rationale: Ni wakati uliopo wa kihistoria katika simulizi; Kiswahili cha kawaida hutumia wakati uliopita kusimulia tukio, na ‘akaja’ linaendeleza mfuatano wa matendo kwa ufasaha.
- source_word: γυνὴ
  choice: mwanamke mmoja
  rationale: Katika muktadha huu neno linamaanisha mwanamke ambaye bado hajatambulishwa, si lazima mke; ‘mmoja’ huonyesha hali hiyo kwa kawaida katika Kiswahili.
- source_word: ἐκ τῆς Σαμαρείας
  choice: kutoka Samaria
  rationale: Huhifadhi moja kwa moja wazo la asili au mahali alikotoka bila kuongeza wazi kwamba alikuwa Msamaria, jambo ambalo mstari huu haulitamki kwa namna hiyo.
- source_word: ἀντλῆσαι ὕδωρ
  choice: kuteka maji
  rationale: Kitenzi-jina kinaonyesha kusudi la kuja kwake; ‘kuteka maji’ ni usemi wa kawaida wa Kiswahili kwa kuchota maji kisimani.
- source_word: λέγει αὐτῇ
  choice: akamwambia
  rationale: Wakati uliopo wa kihistoria umetafsiriwa kwa wakati wa simulizi wa Kiswahili; ‘akamwambia’ huunganisha tendo hili kwa kawaida na tendo lililotangulia.
- source_word: Δός μοι πεῖν
  choice: Nipe maji ninywe
  rationale: Huwasilisha ombi la Yesu kwa Kiswahili cha kawaida huku likihifadhi muundo wa kumpa kitu ili anywe; ‘maji’ linaeleweka moja kwa moja kutokana na muktadha.
theological_decisions:
- issue: Maana ya ‘Samaria’
  choice: Kutoka Samaria
  alternative: Mwanamke Msamaria; kutoka mji wa Samaria
  rationale: Kigiriki kinasema mwanamke ‘kutoka Samaria.’ Tafsiri haiongezi kwa uwazi utambulisho wa kikabila au kidini ambao haukutajwa kwa muundo huo katika mstari huu, wala hailazimishi maana ya mji badala ya eneo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Kuteka maji’ ni cha kawaida na sahihi katika muktadha wa kisima. Alama ya tanbihi [a] imewekwa baada ya kitenzi kinachohusiana na matumizi ya wakati uliopo wa kihistoria.
