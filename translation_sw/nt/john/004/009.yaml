source:
  edition: SBLGNT
  text: λέγει οὖν αὐτῷ ἡ γυνὴ ἡ Σαμαρῖτις· Πῶς σὺ Ἰουδαῖος ὢν παρ’ ἐμοῦ πεῖν αἰτεῖς ⸂γυναικὸς Σαμαρίτιδος οὔσης⸃; οὐ γὰρ συγχρῶνται Ἰουδαῖοι Σαμαρίταις.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/009.yaml
  text: So the Samaritan woman said to him[a], “How is it that you, being a Jew, ask for a drink from me, a Samaritan woman?” (For Jews do not associate with Samaritans.)
translation:
  language: sw
  text: Basi yule mwanamke Msamaria akamwambia, “Imekuwaje wewe, ukiwa Myahudi, kuniomba maji ya kunywa kutoka kwangu, mimi mwanamke Msamaria?” (Kwa maana Wayahudi hawashughulikiani na Wasamaria.)[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wayahudi hawana mahusiano na Wasamaria.” Huenda pia maana mahususi ni kwamba hawatumii vitu kwa pamoja, kama vile vyombo vya kunywea.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει οὖν
  choice: Basi ... akamwambia
  rationale: “Basi” linaendeleza simulizi na kuhifadhi nguvu ya kiunganishi οὖν kwa Kiswahili cha kawaida; “akamwambia” ni namna ya asili ya kuwasilisha usemi unaofuata.
- source_word: ἡ γυνὴ ἡ Σαμαρῖτις
  choice: yule mwanamke Msamaria
  rationale: “Yule” humtambulisha mwanamke aliyetajwa katika muktadha, huku “mwanamke Msamaria” ikihifadhi jinsia na utambulisho wake wa kijamii-kikabila.
- source_word: Πῶς
  choice: Imekuwaje
  rationale: Usemi huu unaonyesha mshangao kuhusu kuvukwa kwa mpaka wa kijamii kuliko “Jinsi gani” ambalo lingesikika kama swali la namna tu.
- source_word: Ἰουδαῖος
  choice: Myahudi
  rationale: Hapa kuna utofautishaji wa jamii za Wayahudi na Wasamaria, si utofautishaji wa kijiografia tu kati ya Uyahudi na Samaria.
- source_word: ὢν
  choice: ukiwa
  rationale: Huhifadhi hali ya usuli iliyo katika participio bila kulazimisha maana mahususi ya “kwa sababu” au “ingawa.”
- source_word: παρ’ ἐμοῦ πεῖν αἰτεῖς
  choice: kuniomba mimi ... maji ya kunywa
  rationale: Hii ni Kiswahili cha asili kinachoeleza ombi la kitu cha kunywa na kudumisha mkazo kwa mwanamke aliyeombwa.
- source_word: γυναικὸς Σαμαρίτιδος οὔσης
  choice: mimi, mwanamke Msamaria
  rationale: Muundo wa ufafanuzi baada ya “mimi” hudumisha rejeo la nafsi ya kwanza pamoja na utambulisho wake wa kijinsia na kijamii-kikabila.
- source_word: συγχρῶνται
  choice: hawashirikiani na
  rationale: Kitenzi kinaweza kueleza mahusiano ya kijamii kwa ujumla au kutumia vitu kwa pamoja. Tafsiri kuu inatoa maana pana inayofaa maelezo ya mwandishi; tanbihi huhifadhi uwezekano mwembamba zaidi.
theological_decisions:
- issue: Maana ya Ἰουδαῖος katika muktadha huu wa Yohana
  choice: Myahudi
  alternative: Mtu wa Uyahudi
  rationale: Aya inatofautisha Wayahudi na Wasamaria kama jumuiya za kijamii na kidini; maana ya kikanda pekee haitoshi hapa.
- issue: Upeo wa maana ya συγχρῶνται
  choice: hawashirikiani na
  alternative: hawatumii vitu kwa pamoja na / hawana shughuli na
  rationale: Muktadha wa maji unaweza kudokeza kutotumia chombo kimoja, lakini kauli ya ufafanuzi inaweza pia kueleza utengano mpana wa kijamii. Tafsiri kuu inahifadhi maana pana, na tanbihi inaonyesha uwezekano mahususi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Imekuwaje” huwasilisha mshangao kwa kawaida; “maji ya kunywa” linafaa kwa muktadha wa kisima. Tanbihi imewekwa baada ya maelezo ya mabano ili marker [a] ionekane wazi katika matini kuu.
