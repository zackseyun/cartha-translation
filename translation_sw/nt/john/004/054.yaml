  text: τοῦτο ⸀δὲ πάλιν δεύτερον σημεῖον ἐποίησεν ὁ Ἰησοῦς ἐλθὼν ἐκ τῆς Ἰουδαίας εἰς τὴν Γαλιλαίαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/054.yaml
  text: This again was the second sign Jesus did after coming from Judea into Galilee[a].
translation:
  language: sw
  text: Hii sasa ilikuwa ishara ya pili ambayo Yesu aliifanya alipokuja Galilaya kutoka Uyahudi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “muujiza.” Mara nyingi Yohana hutumia “ishara” kusisitiza maana ya tendo hilo pamoja na uwezo wake.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: Hii
  rationale: Kiwakilishi hiki kinaelekeza nyuma kwenye tendo la kumponya mwana wa afisa lililosimuliwa; “Hii” ni ya kawaida na inaeleweka katika Kiswahili.
- source_word: δὲ πάλιν
  choice: tena
  rationale: δέ ni kiunganishi hafifu, na pamoja na πάλιν wazo kuu ni kurudiwa au kufuatana kwa tukio; “tena” hulitoa kwa Kiswahili cha asili bila kuongeza “lakini” isiyohitajika.
- source_word: δεύτερον
  choice: ya pili
  rationale: Ni namba ya mpangilio inayofafanua ishara; muundo “ishara ya pili” ni wa kawaida katika Kiswahili.
- source_word: σημεῖον
  choice: ishara
  rationale: Katika Yohana neno hili halimaanishi tendo la ajabu tu, bali tendo linaloelekeza kwenye maana na utambulisho wa Yesu; “ishara” huhifadhi dhima hiyo.
- source_word: ἐποίησεν
  choice: aliifanya
  rationale: ποιέω pamoja na σημεῖον humaanisha kufanya tendo hilo; “aliifanya” ni wazi na ya kawaida katika Kiswahili.
- source_word: ἐλθὼν ἐκ τῆς Ἰουδαίας εἰς τὴν Γαλιλαίαν
  choice: baada ya kutoka Uyahudi na kuja Galilaya
  rationale: Kirai cha hali ya wakati kinaonyesha tendo lililofuatia kuwasili kwake; tafsiri hii pia huhifadhi mahali alikotoka na alikokwenda kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Matumizi ya σημεῖον katika Injili ya Yohana
  choice: ishara
  alternative: muujiza
  rationale: “Ishara” huhifadhi wazo la Kiyohana kwamba tendo lina maana ya ufunuo zaidi ya kuonyesha nguvu pekee, bila kuongeza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini rahisi kueleweka. Muundo umeweka wazi uhusiano wa wakati wa ἐλθών bila kutumia tungo nzito ya kishiriki.
