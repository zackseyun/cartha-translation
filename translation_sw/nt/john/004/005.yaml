  text: So he came to a town of Samaria called Sychar[b][a], near the piece of land that Jacob had given to Joseph his son.
translation:
  language: sw
  text: Basi akafika katika mji wa Samaria ulioitwa Sikari,[a] karibu na kipande cha ardhi[b] ambacho Yakobo alikuwa amempa Yosefu, mwanawe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “jiji.” Neno la Kigiriki πόλις linaweza kumaanisha mji au jiji, kutegemea muktadha.
    reason: lexical_alternative
  - marker: b
    text: Au “shamba” au “mali.” Neno la Kigiriki χωρίον linaweza kutaja shamba, mali, au kipande cha ardhi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται
  choice: akafika
  rationale: Ni wakati uliopo wa kihistoria katika simulizi; wakati uliopita wa Kiswahili unaendeleza mfuatano wa matukio kwa njia ya kawaida.
- source_word: οὖν
  choice: Basi
  rationale: Huonyesha mwendelezo au matokeo katika simulizi bila uzito mkubwa wa kimantiki unaoweza kudokezwa na ‘kwa hiyo.’
- source_word: πόλιν
  choice: mji
  rationale: ‘Mji’ linaweza kutaja makao ya watu bila kuamua kwa lazima kama yalikuwa mji mkubwa au mdogo.
- source_word: τῆς Σαμαρείας
  choice: wa Samaria
  rationale: Huhifadhi uhusiano wa kijenitivi wa mji na eneo la Samaria kwa Kiswahili cha kawaida.
- source_word: λεγομένην Συχὰρ
  choice: ulioitwa Sikari
  rationale: Hutoa utambulisho wa jina la mji kwa namna ya asili katika Kiswahili.
- source_word: πλησίον
  choice: karibu na
  rationale: Ni usemi wa kawaida wa kuonyesha ukaribu wa mahali.
- source_word: χωρίου
  choice: kipande cha ardhi
  rationale: Huwasilisha eneo au mali ya ardhi bila kulifanya kwa lazima kuwa shamba lililolimwa.
- source_word: ὃ ἔδωκεν Ἰακὼβ
  choice: ambacho Yakobo alikuwa amempa
  rationale: Wakati timilifu uliopita unaonyesha kwamba utoaji huo ulitangulia tukio kuu la simulizi.
- source_word: τῷ Ἰωσὴφ τῷ υἱῷ αὐτοῦ
  choice: Yosefu mwanawe
  rationale: Huhifadhi mpokeaji na ufafanuzi kwamba Yosefu alikuwa mwana wa Yakobo kwa mpangilio wa asili wa Kiswahili.
