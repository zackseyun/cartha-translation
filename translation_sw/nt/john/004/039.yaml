base_translation:
  language: en
  yaml_path: translation/nt/john/004/039.yaml
  text: And many of the Samaritans from that town believed in him because of the word of the woman who was testifying, “He told me everything I did.”
translation:
  language: sw
  text: Na Wasamaria wengi kutoka mji ule wakamwamini kwa sababu ya ujumbe[a] wa yule mwanamke aliyekuwa akishuhudia, “Aliniambia mambo yote niliyofanya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa sababu ya neno la yule mwanamke.” Neno la Kigiriki λόγος linaweza kumaanisha “neno,” “ujumbe,” au “taarifa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐκ δὲ τῆς πόλεως ἐκείνης
  choice: Na ... kutoka mji ule
  rationale: ἐκ inaonyesha asili, na δέ ni kiunganishi chepesi kinachowakilishwa kwa “Na.” “Mji” ni tafsiri ya kawaida na yenye upana unaofaa kwa πόλις.
- source_word: πολλοὶ ... τῶν Σαμαριτῶν
  choice: Wasamaria wengi
  rationale: Muundo wa Kigiriki una maana ya wengi miongoni mwa Wasamaria; Kiswahili cha kawaida hueleza hilo kwa urahisi kama “Wasamaria wengi.”
- source_word: ἐπίστευσαν εἰς αὐτόν
  choice: wakamwamini
  rationale: πιστεύω εἰς inaeleza imani au tumaini linaloelekezwa kwa mtu. “Kumwamini” ni ya asili katika Kiswahili na haiingizi ufafanuzi wa ziada.
- source_word: διὰ τὸν λόγον
  choice: kwa sababu ya ujumbe
  rationale: διά pamoja na hali ya accusative inaonyesha sababu. Katika muktadha huu λόγος ni yale aliyosema mwanamke, hivyo “ujumbe” ni wazi na ya asili; “neno” linawezekana na limehifadhiwa katika tanbihi.
- source_word: τῆς γυναικὸς μαρτυρούσης
  choice: ya yule mwanamke aliyekuwa akishuhudia
  rationale: “Yule mwanamke” humrejelea mwanamke aliyekwisha tajwa, na hali endelevu “aliyekuwa akishuhudia” huhifadhi nguvu ya participle ya wakati wa sasa μαρτυρούσης.
- source_word: Εἶπέν μοι πάντα ἃ ἐποίησα
  choice: Aliniambia mambo yote niliyofanya
  rationale: “Aliniambia” ni usemi wa kawaida kwa Εἶπέν μοι, na “mambo yote niliyofanya” huhifadhi ukamilifu wa πάντα ἃ pamoja na mtazamo wa kitenzi cha aorist bila kulazimisha maana ya wakati timilifu.
theological_decisions:
- issue: Maana ya πιστεύω εἰς katika matumizi ya Yohana
  choice: wakamwamini
  alternative: wakaweka imani yao kwake
  rationale: Tafsiri iliyochaguliwa inaonyesha imani inayoelekezwa kwa Yesu bila kupanua kauli kuwa mfumo wa mafundisho ambao mstari wenyewe hautaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mtindo wa simulizi ni wa kawaida kwa wasomaji wengi; “akamwamini” na “aliyekuwa akishuhudia” huhifadhi maana ya chanzo bila kuwa mzito.
