  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Δεῦτε ἴδετε ἄνθρωπον ὃς εἶπέ μοι πάντα ⸀ὅσα ἐποίησα· μήτι οὗτός ἐστιν ὁ χριστός;
base_translation:
  language: en
  yaml_path: translation/nt/john/004/029.yaml
  text: Come[a], see a man who told me everything I have done. Could this be the Messiah?
translation:
  language: sw
  text: “Njoni mkamwone mtu aliyeniambia mambo yote niliyofanya. Je, yawezekana huyu ndiye Masihi?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Je, huyu si Masihi, sivyo?”
    reason: Njia mbadala ya kuonyesha kwamba μήτι inaweza kudokeza swali linalotarajia jibu hasi.
lexical_decisions:
- source_word: Δεῦτε
  choice: Njoni
  rationale: Ni mwito wa moja kwa moja kwa watu kadhaa, unaohifadhi nguvu ya mwaliko wa Kigiriki kwa Kiswahili cha kawaida.
- source_word: ἴδετε
  choice: mkamwone
  rationale: 'Ikiunganishwa na ‘Njoni,’ umbo hili ni la asili katika Kiswahili na linaonyesha kusudi la kuja: kumwona mtu huyo.'
- source_word: ἄνθρωπον
  choice: mtu
  rationale: Katika Kiswahili, ‘mtu’ humrejelea kwa kawaida mwanadamu mmoja bila kupoteza ukweli kwamba muktadha unamhusu mwanamume; ‘mwanamume’ hapa ingesikika nzito kuliko Kigiriki.
- source_word: ὃς εἶπέ μοι
  choice: aliyeniambia
  rationale: Huwasilisha kwa kawaida tendo la mtu huyo kumwambia mwanamke habari kuhusu matendo yake.
- source_word: πάντα ὅσα
  choice: mambo yote
  rationale: Huhifadhi msisitizo wa ujumla wa kirai cha Kigiriki huku ikitoa sentensi ya kawaida ya Kiswahili.
- source_word: ἐποίησα
  choice: niliyofanya
  rationale: Wakati uliopita wa Kiswahili unawakilisha vizuri aoristi inayorejelea matendo yake yaliyotangulia.
- source_word: μήτι
  choice: Je, yawezekana
  rationale: Huhifadhi swali la kusita na la kuchochea wengine wafikirie, bila kuligeuza kuwa dai la moja kwa moja.
- source_word: ὁ χριστός
  choice: Masihi
  rationale: Χριστός hapa ni cheo cha mkombozi aliyetarajiwa; ‘Masihi’ huwasilisha cheo hicho katika muktadha wa Kiyahudi badala ya kukitumia kama jina.
theological_decisions:
- issue: Namna ya kutafsiri Χριστός kama cheo
  choice: Masihi
  alternative: Kristo
  rationale: Katika muktadha huu neno hilo ni cheo kinachotambulika cha yule aliyetiwa mafuta na kutarajiwa, si jina la mtu; ‘Masihi’ linaonyesha kazi hiyo ya cheo.
- issue: Nguvu ya swali linaloanzishwa na μήτι
  choice: Je, yawezekana huyu ndiye Masihi?
  alternative: Huyu siye Masihi, au?
  rationale: μήτι mara nyingi hudokeza matarajio ya jibu hasi, lakini hapa mwanamke anawaalika watu wachunguze uwezekano huo. Tafsiri kuu huhifadhi kusita na mvutano huo bila kukataa kwa nguvu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Njoni mkamwone’ ni mwaliko wa kawaida kwa kundi; ‘Je, yawezekana’ inadumisha sauti ya ushuhuda wenye tahadhari.
