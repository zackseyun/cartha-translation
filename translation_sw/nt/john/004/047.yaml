id: JHN.4.47
reference: John 4:47
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οὗτος ἀκούσας ὅτι Ἰησοῦς ἥκει ἐκ τῆς Ἰουδαίας εἰς τὴν Γαλιλαίαν ἀπῆλθεν πρὸς αὐτὸν καὶ ⸀ἠρώτα ἵνα καταβῇ καὶ ἰάσηται αὐτοῦ τὸν υἱόν, ἤμελλεν γὰρ ἀποθνῄσκειν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/047.yaml
  text: When this man heard that Jesus had come from Judea into Galilee[a], he went to him and asked him to come down and heal his son[b], for he was about to die.
translation:
  language: sw
  text: Mtu huyo aliposikia kwamba Yesu alikuwa amefika Galilaya kutoka Uyahudi, alimwendea na kumwomba ashuke akamponye mwanawe, kwa maana alikuwa karibu kufa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὗτος
  choice: Mtu huyo
  rationale: Inarejelea afisa wa mfalme katika mstari uliotangulia na kuhifadhi nguvu ya kiashiria cha Kigiriki kwa Kiswahili cha kawaida.
- source_word: ἀκούσας
  choice: aliposikia
  rationale: Kirai tegemezi cha wakati kinawasilisha kwa kawaida uhusiano wa kitenzi-shirikishi cha aoristi na tendo kuu.
- source_word: ἥκει
  choice: alikuwa amefika
  rationale: Kitenzi kinaonyesha kuwasili na hali inayotokana na kuja; wakati timilifu wa zamani unafaa katika taarifa aliyosikia.
- source_word: ἐκ τῆς Ἰουδαίας εἰς τὴν Γαλιλαίαν
  choice: Galilaya kutoka Uyahudi
  rationale: Kiswahili cha kawaida huweka mahali pa kufika kabla ya chanzo katika muundo huu, huku kikihifadhi mwelekeo kutoka Uyahudi hadi Galilaya.
- source_word: ἀπῆλθεν πρὸς αὐτόν
  choice: alimwendea
  rationale: Hutoa kwa ufupi na kwa kawaida maana ya kwenda mahali alipokuwa Yesu.
- source_word: ἠρώτα
  choice: kumwomba
  rationale: Katika muktadha wa ombi kwa Yesu, 'kumwomba' ni ya kawaida na haiongezi nguvu ya 'kusihi'; hali ya imperfect haijalazimishwa kuwa tendo lililorudiwa.
- source_word: ἵνα καταβῇ
  choice: ashuke
  rationale: Inahifadhi maana ya mwendo wa kushuka iliyomo katika καταβαίνω na muundo wa ombi unaofuatiwa na kiima tegemezi.
- source_word: καὶ ἰάσηται
  choice: akamponye
  rationale: Muundo wa 'aka-' unaunganisha kushuka na tendo linalokusudiwa la kumponya kwa Kiswahili cha asili.
- source_word: αὐτοῦ τὸν υἱόν
  choice: mwanawe
  rationale: Ni umbo la kawaida la kumaanisha mwana wa afisa huyo.
- source_word: ἤμελλεν γὰρ ἀποθνῄσκειν
  choice: kwa maana alikuwa karibu kufa
  rationale: Huwasilisha ukaribu wa kifo unaoonyeshwa na μέλλω pamoja na infinitive.
theological_decisions:
- issue: Anayerejelewa na ‘alikuwa karibu kufa’
  choice: Mwana wa afisa ndiye aliyekuwa karibu kufa.
  alternative: Yesu au afisa ndiye aliyekuwa karibu kufa.
  rationale: Mwana ndiye rejeleo la karibu na linalodhihirika wazi katika muktadha; Kiswahili kinaacha kiwakilishi kama Kigiriki lakini muktadha unabainisha rejeleo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Tafsiri imetumia ulinganifu mwafaka, ikihifadhi mwendo wa ‘ashuke’ bila kuongeza maelezo ya kijiografia yasiyokuwamo moja kwa moja katika mstari. Hakuna tanbihi zinazohitajika.
