  source_fidelity: 'Tafsiri inafuata maana ya Kigiriki kwa uaminifu: kiashiria οὗτος kinadumishwa katika “Mtu huyo”; ἀκούσας hutolewa vizuri kwa “aliposikia”; ἥκει kwa “alikuwa amefika”; na mwelekeo kutoka Uyahudi hadi Galilaya umehifadhiwa. “Alimwendea na kumwomba ashuke akamponye mwanawe” hutafsiri kwa usahihi ombi la afisa, mwendo wa kushuka, na uponyaji wa mwana. “Alikuwa karibu kufa” huwasilisha kwa kawaida ukaribu unaoonyeshwa na ἤμελλεν ... ἀποθνῄσκειν; muktadha humrejelea mwana.'
