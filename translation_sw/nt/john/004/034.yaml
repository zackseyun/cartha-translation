  text: λέγει αὐτοῖς ὁ Ἰησοῦς· Ἐμὸν βρῶμά ἐστιν ἵνα ⸀ποιήσω τὸ θέλημα τοῦ πέμψαντός με καὶ τελειώσω αὐτοῦ τὸ ἔργον.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/034.yaml
  text: Jesus said to them[b][a], “My food is to do the will of him who sent me and to complete his work.”
translation:
  language: sw
  text: Yesu akawaambia, “Chakula changu ni kufanya mapenzi ya aliyenituma[b] na kuitimiza kazi yake.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kuimaliza kazi yake.”
    reason: lexical_alternative
  - marker: b
    text: Katika muktadha, “aliyenituma” anamrejelea Baba, ingawa Kigiriki hakitaji cheo hicho wazi hapa.
    reason: cross_reference
lexical_decisions:
- source_word: βρῶμά
  choice: chakula
  rationale: Neno hili kwa kawaida humaanisha chakula. Tafsiri hii inadumisha sitiari halisi katika muktadha ambao wanafunzi walikuwa wakizungumza kuhusu kula.
- source_word: Ἐμὸν βρῶμά ἐστιν
  choice: Chakula changu ni
  rationale: Muundo huu ni wa asili katika Kiswahili na unahifadhi sitiari ya Yesu bila kuifafanua kupita kiasi.
- source_word: ἵνα ποιήσω
  choice: ni kufanya
  rationale: Ingawa ἵνα pamoja na kitenzi tegemezi huonyesha yaliyomo au kusudi, Kiswahili cha kawaida huwasilisha maana hiyo kwa muundo wa ‘ni kufanya.’
- source_word: τὸ θέλημα
  choice: mapenzi
  rationale: ‘Mapenzi’ ni istilahi ya kawaida na sahihi katika Kiswahili kwa θέλημα inapomaanisha nia au matakwa ya Mungu.
- source_word: τοῦ πέμψαντός με
  choice: ya aliyenituma
  rationale: Kirai hiki kinatafsiri kishirikishi chenye kibainishi kwa kishazi rejeshi cha mtu, bila kuongeza wazi cheo ‘Baba’ ambacho hakipo katika mstari wa Kigiriki.
- source_word: τελειώσω
  choice: kuitimiza
  rationale: ‘Kuitimiza’ huonyesha kuifikisha kazi kwenye ukamilifu au mwisho wake uliokusudiwa, si kuiacha tu.
- source_word: ἔργον
  choice: kazi
  rationale: ‘Kazi’ ndilo neno la kawaida na linalofaa katika muktadha kwa utume aliokabidhiwa Yesu.
- source_word: λέγει αὐτοῖς ὁ Ἰησοῦς
  choice: Yesu akawaambia
  rationale: Ingawa λέγει ni wakati wa sasa wa kihistoria, ‘akawaambia’ ni usimulizi wa kawaida wa Kiswahili na huunganisha kauli hii kwa asili na muktadha wake.
theological_decisions:
- issue: Anayerejelewa na ‘aliyenituma’
  choice: Rejeo kwa Baba/Mungu linaachwa likiwa la kidokezo katika maneno ‘aliyenituma.’
  alternative: Kutafsiri wazi ‘Baba aliyenituma.’
  rationale: Muktadha wa Injili ya Yohana unaonyesha kuwa anayerejelewa ni Baba, lakini Kigiriki hakitumii cheo hicho wazi hapa. Tafsiri haiongezi maelezo ya kitheolojia ndani ya mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Sitiari ya chakula na rejeo lisilo wazi kwa Baba zimehifadhiwa.
