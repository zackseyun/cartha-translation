id: JHN.4.49
reference: John 4:49
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: λέγει πρὸς αὐτὸν ὁ βασιλικός· Κύριε, κατάβηθι πρὶν ἀποθανεῖν τὸ παιδίον μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/049.yaml
  text: The royal official said to him[a], “Lord, come down before my child dies.”
translation:
  language: sw
  text: Yule afisa wa kifalme akamwambia, “Bwana[a], shuka kabla mtoto wangu hajafa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Mheshimiwa.” Neno la Kigiriki κύριε ni namna ya heshima ya kumwita mtu, lakini pia linaweza kumaanisha “Bwana.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ βασιλικός
  choice: afisa wa kifalme
  rationale: Neno hili limetumiwa kama nomino kumaanisha mtu aliyehusiana na mfalme au ikulu. “Afisa wa kifalme” ni Kiswahili cha sasa kinachoeleweka na hakiongezi dhana ya tabaka la kiungwana.
- source_word: Κύριε
  choice: Bwana
  rationale: “Bwana” huhifadhi maana pana ya κύριε kama jina la heshima na pia uwezekano wa maana nzito zaidi kumhusu Yesu; maana ya heshima tu imeelezwa katika tanbihi.
- source_word: κατάβηθι
  choice: shuka
  rationale: Amri hii ina maana ya kushuka. Huhifadhi mwelekeo wa kijiografia kutoka Kana kwenda Kapernaumu bila kulazimisha katika Kiswahili tofauti ya “njoo” au “nenda.”
- source_word: πρὶν ἀποθανεῖν
  choice: kabla ... hajafa
  rationale: Muundo huu unaonyesha kitendo kinachoweza kutokea baada ya muda wa rejea; “kabla ... hajafa” ni usemi wa kawaida wa Kiswahili unaohifadhi maana hiyo.
- source_word: τὸ παιδίον μου
  choice: mtoto wangu
  rationale: παιδίον humaanisha mtoto au mtoto mdogo. “Mtoto wangu” haiainishi jinsia zaidi ya neno la Kigiriki katika mstari huu.
- source_word: λέγει πρὸς αὐτόν
  choice: akamwambia
  rationale: Wakati uliopo wa kihistoria umetafsiriwa kwa usimulizi wa wakati uliopita unaosikika kwa kawaida katika Kiswahili; kiambishi “-ka-” kinaendeleza mfuatano wa simulizi.
theological_decisions:
- issue: Tafsiri ya κύριος kama neno la kumwita Yesu
  choice: Bwana
  alternative: Mheshimiwa
  rationale: '“Bwana” huhifadhi tabaka mbili zinazowezekana katika Injili ya Yohana: heshima ya kawaida na mwangwi wa cheo chenye maana nzito zaidi. Kwa kuwa muktadha wa karibu unaweza kuwa usemi wa heshima tu, uwezekano huo umehifadhiwa katika tanbihi.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, ya heshima na rahisi kueleweka. Muundo ni wa asili katika simulizi la Kiswahili huku ukihifadhi marudio ya kijiografia ya “shuka” na utata wa κύριε.
