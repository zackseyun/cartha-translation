id: JHN.4.10
reference: John 4:10
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῇ· Εἰ ᾔδεις τὴν δωρεὰν τοῦ θεοῦ καὶ τίς ἐστιν ὁ λέγων σοι· Δός μοι πεῖν, σὺ ἂν ᾔτησας αὐτὸν καὶ ἔδωκεν ἄν σοι ὕδωρ ζῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/010.yaml
  text: Jesus answered and said to her[a], “If you knew the gift of God, and who it is who says to you, ‘Give me a drink,’ you would have asked him, and he would have given you living water.”
translation:
  language: sw
  text: Yesu akamjibu, “Kama ungeijua zawadi ya Mungu na ungejua ni nani anayekuambia, ‘Nipe ninywe,’ ungemwomba yeye, naye angekupa maji yaliyo hai.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “maji yanayotiririka” au “maji safi.” Usemi huu unaweza kumaanisha maji yanayotiririka, lakini usemi “maji yaliyo hai” hudumisha maana hizo mbili zinazokusudiwa hapa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῇ
  choice: Yesu akamjibu
  rationale: Kiswahili cha simulizi hutumia kwa kawaida ‘akamjibu’ kuwakilisha fomula ya Kigiriki ‘akajibu na kumwambia’; kurudia ‘akamjibu na kumwambia’ kungekuwa kuzito bila kuongeza maana.
- source_word: τὴν δωρεὰν τοῦ θεοῦ
  choice: zawadi ya Mungu
  rationale: ‘Zawadi’ ni neno la kawaida na linaloeleweka kwa δωρεά, ambalo hudokeza kitu kilichotolewa bure; ‘ya Mungu’ inadumisha uhusiano mpana wa genitivi bila kuamua kimya kimya kuwa ni zawadi inayotoka kwa Mungu au inayomhusu Mungu.
- source_word: τίς ἐστιν ὁ λέγων σοι
  choice: ni nani anayekuambia
  rationale: Hii ni kauli ya asili katika Kiswahili na inadumisha mkazo wa kutambua mtu anayesema.
- source_word: Δός μοι πεῖν
  choice: Nipe maji ninywe
  rationale: Katika muktadha wa mazungumzo kisimani, ‘maji’ yanaeleweka wazi na kauli hii ni njia ya kawaida ya Kiswahili ya kuomba maji ya kunywa, ingawa nomino ‘maji’ haijatajwa moja kwa moja katika Kigiriki.
- source_word: ᾔτησας αὐτόν
  choice: ungemwomba yeye
  rationale: Muundo wa masharti ‘ungemwomba’ unaonyesha hali isiyotimizwa; ‘yeye’ inadumisha kiwakilishi cha Kigiriki na kukazia mtu ambaye mwanamke angemwomba.
- source_word: ἔδωκεν ἄν σοι
  choice: angekupa
  rationale: Muundo wa ‘ange-’ unawakilisha matokeo ya masharti yasiyotimizwa kwa njia ya kawaida katika Kiswahili.
- source_word: ὕδωρ ζῶν
  choice: maji yaliyo hai
  rationale: 'Tafsiri hii inadumisha maana mbili za usemi: kwa matumizi ya kawaida unaweza kumaanisha maji yanayotiririka au safi, huku katika muktadha ukielekeza pia kwenye maana ya kina ya kiroho.'
theological_decisions:
- issue: Kudumisha maana halisi na ya ishara ya ὕδωρ ζῶν
  choice: maji yaliyo hai
  alternative: maji yanayotiririka; maji safi
  rationale: Yesu anatumia usemi unaoweza kueleweka kwa kiwango cha kawaida lakini pia una maana ya kina. ‘Maji yaliyo hai’ hayafungi usemi huo kwenye maana ya kimwili pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Kurudiwa kwa ‘ungejua’ kunafanya vipengele viwili vya sharti la Kigiriki viwe wazi na vya asili kwa msomaji wa Kiswahili. Alama ya tanbihi imewekwa baada ya usemi unaoifafanua.
