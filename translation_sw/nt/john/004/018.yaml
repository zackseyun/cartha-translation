  text: For you have had five husbands[a], and the man you now have is not your husband; this you have said truly.
translation:
  language: sw
  text: Kwa maana umekuwa na waume watano[a], na mwanamume uliye naye sasa si mume wako; ulichosema ni kweli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa karibu zaidi na maneno ya Kigiriki: “Kwa maana umekuwa na wanaume watano, na huyo uliye naye sasa si mume wako.” Neno la Kigiriki ἀνήρ linaweza kumaanisha “mwanamume” au “mume”; katika muktadha huu, maana ya “mume” ndiyo inayofaa zaidi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πέντε
  choice: watano
  rationale: Ni nambari ya kawaida inayopatana kisarufi na nomino ya watu, “waume.”
- source_word: γὰρ
  choice: Kwa maana
  rationale: Kiunganishi hiki kinaonyesha sababu inayothibitisha kwamba mwanamke alisema kweli.
- source_word: ἄνδρας
  choice: waume
  rationale: Ingawa ἀνήρ inaweza kumaanisha “mwanamume” au “mume,” muktadha wa historia ya mahusiano ya ndoa na utofautishaji unaofuata unapendelea “waume.”
- source_word: ἔσχες
  choice: umekuwa na
  rationale: Wakati uliopita wa Kigiriki unaeleza historia yake ya awali yenye umuhimu kwa hali ya sasa; “umekuwa na” ni Kiswahili cha kawaida kinachowasilisha maana hiyo.
- source_word: νῦν
  choice: sasa
  rationale: Kielezi hiki kinaonyesha wazi hali yake ya wakati huo.
- source_word: ὃν ἔχεις
  choice: mwanamume uliye naye
  rationale: Kauli hii inahifadhi wazo la mtu aliye katika uhusiano naye bila kuongeza kwamba wanaishi pamoja au kufafanua zaidi aina ya uhusiano.
- source_word: οὐκ ἔστιν σου ἀνήρ
  choice: si mume wako
  rationale: Kiwakilishi σου pamoja na ἀνήρ hapa kinaonyesha uhusiano wa ndoa; tafsiri hii ni wazi na ya kawaida katika Kiswahili.
- source_word: τοῦτο ἀληθὲς εἴρηκας
  choice: ulichosema ni kweli
  rationale: Hii inarejelea kauli ya mwanamke na kutoa maana ya Kigiriki kwa Kiswahili cha kawaida huku ikihifadhi tathmini ya Yesu kwamba kauli hiyo ni ya kweli.
theological_decisions:
- issue: Maana ya ἀνήρ katika sehemu zake mbili
  choice: Kutafsiri sehemu ya kwanza “waume” na ya pili “mume,” huku “mwanamume” ikitumika kumtaja mtu wa sasa.
  alternative: Kutafsiri kwa maana ya jumla kama “wanaume/mwanamume” katika sehemu zote.
  rationale: Muktadha unaonyesha historia ya ndoa ya mwanamke na hali yake ya sasa isiyo ya ndoa. Uchaguzi huu unawasilisha maana ya kimuktadha bila kuongeza hukumu ya kimaadili au maelezo yasiyomo katika maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Mwanamume uliye naye” ni usemi wa kawaida unaobaki karibu na Kigiriki bila kudai kwamba wanaishi pamoja; nusu koloni inadumisha mtiririko na uhusiano wa vifungu vya sentensi ya asili.
