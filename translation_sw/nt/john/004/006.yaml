base_translation:
  language: en
  yaml_path: translation/nt/john/004/006.yaml
  text: Jacob’s well was there[a]. So Jesus, wearied from the journey, was sitting there by the well[c][b]. It was about the sixth hour.
translation:
  language: sw
  text: Kisima cha Yakobo kilikuwa pale[a]. Basi Yesu, akiwa amechoka kwa safari, aliketi hivyo kando ya kisima[b]. Ilikuwa yapata saa ya sita[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Chemchemi ya Yakobo”; neno la Kigiriki πηγή linaweza kumaanisha chemchemi au kisima.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kigiriki lililotafsiriwa “hivyo” linaweza pia kudokeza “jinsi alivyokuwa” au “kwa namna hiyo.”
    reason: lexical_alternative
  - marker: c
    text: Kwa kuhesabu saa za mchana tangu mapambazuko, hii kwa kawaida ni yapata adhuhuri. Hata hivyo, maandishi yenyewe hayataji saa inayolingana katika mfumo wa kisasa.
    reason: alternative_reading
lexical_decisions:
- source_word: πηγή
  choice: kisima
  rationale: Ingawa neno hili la Kigiriki linaweza kumaanisha chemchemi au kisima, simulizi la kuteka maji mahali hapa na matumizi ya kawaida ya jina “kisima cha Yakobo” yanafanya “kisima” liwe chaguo la asili zaidi. Maana ya “chemchemi” imehifadhiwa katika tanbihi.
- source_word: κεκοπιακὼς
  choice: akiwa amechoka
  rationale: Hali timilifu ya kitenzi inaonyesha uchovu uliotokana na juhudi ya safari; muundo huu wa Kiswahili unaeleza hali hiyo ya matokeo kwa lugha ya kawaida na yenye heshima.
- source_word: ἐκ τῆς ὁδοιπορίας
  choice: kwa sababu ya safari
  rationale: ἐκ hapa inaonyesha chanzo au sababu ya uchovu. Tafsiri hii inaweka uhusiano huo wazi bila kuongeza wazo lisilokuwamo.
- source_word: ἐκαθέζετο
  choice: alikuwa ameketi
  rationale: Wakati usiotimilifu wa Kigiriki unaeleza hali au tendo lililokuwa likiendelea katika usimulizi; “alikuwa ameketi” huakisi hali hiyo vizuri kuliko “aliketi” peke yake.
- source_word: οὕτως
  choice: imewakilishwa kwa muktadha, huku maana halisi ikihifadhiwa katika tanbihi
  rationale: Neno hili lina utata wa namna katika kifungu hiki na linaweza kueleweka kama “hivyo” au “jinsi alivyokuwa.” Kulitia moja kwa moja katika sentensi kuu kungetokeza Kiswahili kisicho cha kawaida; tanbihi inalinda uwezekano huo bila kuufuta.
- source_word: ἐπὶ τῇ πηγῇ
  choice: kando ya kisima
  rationale: ἐπί pamoja na hali ya dative ina maana ya mahali hapa. “Kando ya kisima” ni Kiswahili cha kawaida kwa mtu aliyeketi karibu nacho.
- source_word: ὥρα ἦν ὡς ἕκτη
  choice: Ilikuwa yapata saa ya sita
  rationale: “Yapata” linaonyesha ukadiriaji wa ὡς, na “saa ya sita” linahifadhi namna ya kuhesabu saa katika chanzo badala ya kubadili moja kwa moja kuwa saa ya kisasa.
- source_word: δὲ / οὖν
  choice: kiunganishi cha kwanza kimeachwa kisitamkwe / Basi
  rationale: δὲ huendeleza simulizi na si lazima itafsiriwe kwa neno maalumu katika Kiswahili; οὖν hapa imewasilishwa kwa “Basi,” kinachoonyesha mwendelezo au matokeo ya usimulizi kwa kawaida.
theological_decisions:
- issue: Rejeo la wakati katika “saa ya sita”
  choice: Kuhifadhi usemi wa chanzo “yapata saa ya sita” katika maandishi makuu.
  alternative: “Yapata adhuhuri”; au karibu saa kumi na mbili jioni kwa dhana ya kuhesabu saa kwa mfumo wa Kirumi.
  rationale: Kigiriki hakitaji moja kwa moja saa inayolingana katika mfumo wa kisasa. Kuhifadhi usemi wake kunazuia tafsiri kuamua kimya-kimya mjadala wa mpangilio wa nyakati katika Injili ya Yohana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi bila kuwa kigumu. “Yapata” linafaa kwa usimulizi wa Biblia na bado linaeleweka kwa wasomaji wa kawaida. Alama za tanbihi zimewekwa mara tu baada ya vipengele vinavyohusika.
