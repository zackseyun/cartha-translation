  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἶπεν οὖν ὁ Ἰησοῦς πρὸς αὐτόν· Ἐὰν μὴ σημεῖα καὶ τέρατα ἴδητε, οὐ μὴ πιστεύσητε.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/048.yaml
  text: So Jesus said to him[a], “Unless you see signs and wonders, you will certainly not believe.”
translation:
  language: sw
  text: Basi Yesu akamwambia[a], “Msipoona ishara na maajabu, hakika hamtaamini.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Vitenzi “kuona” na “kuamini” viko katika wingi katika Kigiriki. Hivyo, ingawa Yesu anamwambia mtu huyo mmoja, huenda maneno yake yanawahusu pia watu wengine.
    reason: Kufafanua tofauti kati ya mhusika mmoja katika utangulizi na vitenzi vya wingi katika maneno ya Yesu.
lexical_decisions:
- source_word: οὖν
  choice: Basi
  rationale: Inaonyesha mwendelezo wa kimantiki na wa kisimulizi kutoka mstari uliotangulia kwa lugha ya kawaida na yenye hadhi.
- source_word: πρὸς αὐτόν
  choice: akamwambia
  rationale: Inawasilisha kwa kawaida tendo la Yesu kusema na mtu huyo mmoja; kiambishi -mw- kinahifadhi umoja wa mhusika anayelengwa katika utangulizi.
- source_word: Ἐὰν μὴ
  choice: Msipo-
  rationale: Muundo huu wa sharti hasi ni wa asili katika Kiswahili na unatoa maana ya ‘isipokuwa m-’ bila kuongeza ufafanuzi.
- source_word: σημεῖα
  choice: ishara
  rationale: ‘Ishara’ huhifadhi maana ya Kiyohana ya matendo yanayoelekeza zaidi ya tukio lenyewe, badala ya kuyafasiri moja kwa moja kuwa miujiza tu.
- source_word: τέρατα
  choice: maajabu
  rationale: ‘Maajabu’ ni neno linaloeleweka kwa urahisi kwa matukio ya kushangaza na linadumisha jozi ya ‘ishara na maajabu.’
- source_word: ἴδητε
  choice: msipoona
  rationale: Kitenzi cha nafsi ya pili wingi kimehifadhiwa wazi kwa kiambishi m-, huku hali ya sharti ikiwakilishwa kwa -sipo-.
- source_word: οὐ μὴ πιστεύσητε
  choice: hakika hamtaamini
  rationale: ‘Hakika’ pamoja na ukanushi wa wakati ujao huwasilisha ukanushi wenye mkazo wa οὐ μή bila kuugeuza lazima kuwa kauli ya ‘kamwe.’
- source_word: πιστεύσητε
  choice: mtaamini
  rationale: ‘Kuamini’ ni tafsiri ya kawaida, isiyobeba ufafanuzi wa ziada, ya πιστεύω katika Yohana.
theological_decisions:
- issue: Idadi na upeo wa wanaoambiwa
  choice: 'Utangulizi unamtaja mtu mmoja, lakini maneno ya Yesu yanatumia nafsi ya pili wingi: ‘msipoona ... hamtaamini.’'
  alternative: Kuyafanya maneno yote yamhusu afisa huyo peke yake kwa kutumia umoja, au kuongeza ‘ninyi watu’ katika matini.
  rationale: πρὸς αὐτόν inarejelea mtu mmoja, lakini ἴδητε na πιστεύσητε ni vya wingi. Kiswahili kinaweza kuhifadhi tofauti hii moja kwa moja bila kuamua kwa niaba ya msomaji kundi pana hasa ni lipi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Basi’ ni kiunganishi kifupi cha kawaida; ‘ishara na maajabu’ huhifadhi istilahi muhimu bila kuongeza tafsiri ya kimadhehebu. Wingi umeonyeshwa wazi katika ‘msipoona’ na ‘hamtaamini.’
