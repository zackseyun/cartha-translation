  yaml_path: translation/nt/john/004/032.yaml
  text: But he said to them[a], “I have food to eat that you do not know.”
translation:
  language: sw
  text: Lakini akawaambia, “Mimi nina chakula cha kula ambacho ninyi hamkijui.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Lakini
  rationale: Kiunganishi hiki kinaonyesha tofauti ndogo kati ya msukumo wa wanafunzi na jibu la Yesu; ‘Lakini’ ni ya asili katika muktadha huu.
- source_word: εἶπεν αὐτοῖς
  choice: akawaambia
  rationale: Hii ni njia ya kawaida na ya asili ya Kiswahili ya kueleza kwamba alisema maneno hayo kwao.
- source_word: Ἐγὼ
  choice: Mimi
  rationale: Kiwakilishi cha wazi katika Kigiriki kinasisitiza na kutofautisha Yesu na wanafunzi; ‘Mimi’ kinahifadhi msisitizo huo.
- source_word: βρῶσιν
  choice: chakula
  rationale: Hapa neno linamaanisha chakula, si tendo la kula; tafsiri hii pia inadumisha sitiari inayofafanuliwa na muktadha unaofuata.
- source_word: ἔχω φαγεῖν
  choice: nina chakula cha kula
  rationale: Muundo huu unahifadhi kwa uwazi wazo la kuwa na chakula cha kula bila kufafanua sitiari mapema.
- source_word: ἣν
  choice: ambacho
  rationale: Kiwakilishi hiki cha uhusiano kinarejelea ‘chakula’ na kuanzisha kishazi kinachokieleza.
- source_word: ὑμεῖς
  choice: ninyi
  rationale: Kiwakilishi cha wazi kinahifadhi msisitizo na tofauti iliyopo katika Kigiriki kati ya Yesu na wanafunzi.
- source_word: οὐκ οἴδατε
  choice: hamkijui
  rationale: Kitenzi kinachukua ‘chakula’ kama rejeleo lake moja kwa moja; umbo hili ni sahihi na la kawaida katika Kiswahili huku likibaki karibu na Kigiriki.
theological_decisions:
- issue: Maana ya kisitiari ya ‘chakula’ cha Yesu
  choice: Kubakiza neno halisi ‘chakula’ katika matini bila kufafanua sitiari
  alternative: Kusema moja kwa moja kwamba chakula hicho ni kufanya mapenzi ya Baba
  rationale: Muktadha unaofuata unaeleza sitiari, lakini mstari huu wenyewe unaendeleza kutokuelewa kwa wanafunzi. Tafsiri haipaswi kuondoa mvutano huo mapema.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ‘Mimi nina… ambacho ninyi…’ unahifadhi msisitizo wa viwakilishi vya Kigiriki; ‘chakula cha kula’ ni marudio ya kimakusudi yanayoakisi muundo wa chanzo.
