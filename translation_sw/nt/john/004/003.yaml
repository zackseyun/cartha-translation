  footnotes:
  - marker: a
    text: Au, “akaenda tena Galilaya.” Neno la Kigiriki πάλιν linaweza kutafsiriwa “tena,” lakini hapa huenda lina maana ya kurudi, ndiyo sababu limetafsiriwa “akarudi.”
