lexical_decisions:
- source_word: ἀφῆκεν
  choice: akaondoka
  rationale: Katika muktadha huu kitenzi hiki humaanisha kuondoka mahali na kupatia kisogo; “akaondoka Yudea” ni Kiswahili cha kawaida na cha asili.
- source_word: τὴν Ἰουδαίαν
  choice: Yudea
  rationale: Hili ndilo jina la kawaida la Kiswahili kwa eneo hili la kijiografia katika Agano Jipya.
- source_word: ἀπῆλθεν
  choice: akarudi
  rationale: Pamoja na πάλιν, kitenzi hiki kinaeleza kwenda tena mahali alikokuwa awali; “akarudi” huwasilisha mwendo huo kwa Kiswahili cha kawaida.
- source_word: πάλιν
  choice: akarudi
  rationale: Katika muktadha huu πάλιν yaelekea kuonyesha kurudi kuliko kurudia tendo tu. Maana yake imeunganishwa kwa kawaida katika kitenzi “akarudi.”
- source_word: εἰς τὴν Γαλιλαίαν
  choice: Galilaya
  rationale: Kwa kuwa “akarudi” tayari huonyesha mwendo kuelekea mahali, Kiswahili cha kawaida hakihitaji kihusishi kabla ya jina la mahali.
