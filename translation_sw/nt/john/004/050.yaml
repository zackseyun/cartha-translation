  text: λέγει αὐτῷ ὁ Ἰησοῦς· Πορεύου· ὁ υἱός σου ζῇ. ⸀ἐπίστευσεν ὁ ἄνθρωπος τῷ λόγῳ ⸀ὃν εἶπεν αὐτῷ ὁ Ἰησοῦς καὶ ἐπορεύετο.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/050.yaml
  text: Jesus said to him[a], “Go; your son lives.” The man believed the word that Jesus spoke to him and went on his way.
translation:
  language: sw
  text: Yesu akamwambia, “Nenda; mwanao yu hai.” Mtu huyo akaliamini[a] neno ambalo Yesu alimwambia, akaenda zake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, alilitegemea.
    reason: Kitenzi πιστεύω hapa kinaweza kusisitiza kulikubali neno kuwa kweli au kulitegemea.
lexical_decisions:
- source_word: Πορεύου
  choice: Nenda
  rationale: Ni amri ya moja kwa moja ya kuondoka; “Nenda” ni fupi, ya kawaida, na inafaa mwendo wa simulizi.
- source_word: ὁ υἱός σου
  choice: mwanao
  rationale: υἱός humaanisha mwana wa kiume; “mwanao” huhifadhi maana hiyo katika Kiswahili cha kawaida.
- source_word: ζῇ
  choice: yu hai
  rationale: Kitenzi kiko katika wakati wa sasa na kinatangaza kwamba mwana yuko hai; tafsiri hii haikibadili kuwa ahadi ya wakati ujao.
- source_word: ἐπίστευσεν
  choice: akaliamini
  rationale: πιστεύω pamoja na yambwa τῷ λόγῳ hapa humaanisha kulikubali kuwa kweli au kulitumainia neno lililosemwa. “Akaliamini” huhifadhi maana ya msingi bila kufafanua kupita kiasi aina ya imani inayokusudiwa.
- source_word: ὁ ἄνθρωπος
  choice: Mtu huyo
  rationale: Kigiriki kinasema wazi “mtu,” si “afisa.” “Mtu huyo” humrejelea kwa kawaida bila kuingiza cheo kilichotajwa katika muktadha uliotangulia.
- source_word: τῷ λόγῳ
  choice: neno
  rationale: λόγος hapa ni kauli ya Yesu iliyotamkwa. “Neno” linaeleweka kwa msaada wa kishazi kinachofuata.
- source_word: ὃν εἶπεν αὐτῷ ὁ Ἰησοῦς
  choice: ambalo Yesu alimwambia
  rationale: Tafsiri hii huonyesha wazi kwamba “neno” ndilo Yesu alilomwambia mtu huyo na ni ya kawaida katika Kiswahili.
- source_word: ἐπορεύετο
  choice: akaenda zake
  rationale: Kauli hii huonyesha kwamba baada ya kuamini, mtu huyo aliondoka na kuendelea na safari yake, bila kuongeza maelezo yasiyosemwa wazi katika mstari.
theological_decisions:
- issue: Maana ya πιστεύω katika mwitikio wa mtu kwa neno la Yesu
  choice: akaliamini
  alternative: akalitumainia
  rationale: “Akaliamini” huhifadhi istilahi ya kawaida ya imani na hali ya mvutano katika simulizi kuhusu ukubwa au aina ya imani ya mtu huyo. Haifanyi mstari useme wazi zaidi kuliko Kigiriki kuhusu kama hii ni imani ya wokovu au tegemeo kwa ahadi maalumu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Yu hai” ni kauli fupi yenye uzito inayolingana na tamko la Kigiriki, huku “akaenda zake” ikiendeleza simulizi kwa lugha ya kawaida.
