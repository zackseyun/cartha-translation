  yaml_path: translation/nt/john/004/030.yaml
  text: They went out of the city and were coming to him[a].
translation:
  language: sw
  text: Wakatoka mjini, wakawa wanakuja kwake[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Walitoka mjini na walikuwa njiani kumwendea.”
    reason: Mbadala huu unaweka wazi kwamba walikuwa katika safari ya kumwelekea, huku ukihifadhi tendo linaloendelea la ἤρχοντο.
lexical_decisions:
- source_word: ἐξῆλθον
  choice: wakatoka
  rationale: Kitenzi hiki cha wakati uliopita kinaonyesha kuondoka ndani ya mahali fulani; “wakatoka” ni Kiswahili cha kawaida na huhifadhi mfuatano wa simulizi.
- source_word: ἐκ τῆς πόλεως
  choice: mjini
  rationale: “Mjini” kwa kawaida huonyesha kutoka ndani ya mji bila kuhitaji muundo mzito wa “kutoka katika mji.” πόλις inaweza kuwa mji mkubwa au mdogo, na “mji” ni neno pana na la kawaida.
- source_word: ἤρχοντο
  choice: wakawa wanakuja
  rationale: Kauli hii huhifadhi tendo lililokuwa likiendelea katika wakati uliopita, tofauti na “wakaja,” ambalo lingeweza kulionyesha kama tendo lililokamilika.
- source_word: πρὸς αὐτόν
  choice: kwake
  rationale: πρός pamoja na hali ya mtendwa huonyesha mwendo kuelekea kwa mtu. “Kwake” ni usemi wa asili unaoonyesha kuwa walikuwa wakimkaribia Yesu.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na kinachoeleweka kwa urahisi. Muundo “wakawa wanakuja” umetumiwa kuhifadhi hali endelevu ya kitenzi cha Kigiriki bila kufanya sentensi kuwa ngumu.
