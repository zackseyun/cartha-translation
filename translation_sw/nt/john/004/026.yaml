translation:
  language: sw
  text: Yesu akamwambia[a], “Mimi ndiye ninayesema nawe.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mimi ndiye, yule ninayesema nawe.” Kwa neno kwa neno, Kigiriki kinasema, “Mimi ni, yule anayesema nawe.” Kutokana na muktadha wa mstari uliotangulia, utambulisho unaodokezwa ni kwamba yeye ndiye Masihi.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει
  choice: akamwambia
  rationale: Wakati uliopo wa kihistoria katika Kigiriki umetafsiriwa kwa wakati wa masimulizi wa Kiswahili. Kitenzi “akamwambia” pia huonyesha kwa kawaida kwamba Yesu alisema maneno hayo kwa mwanamke huyo.
- source_word: αὐτῇ
  choice: -mw-
  rationale: Kiambishi cha yambwa katika “akamwambia” kinawakilisha dative αὐτῇ kwa Kiswahili cha kawaida bila kulazimika kuongeza “yule mwanamke.”
- source_word: Ἐγώ εἰμι
  choice: Mimi ndiye
  rationale: Katika muktadha wa Masihi aliyetajwa katika mstari uliotangulia, “Mimi ndiye” ni tamko la kawaida la Kiswahili la kujitambulisha. Kiwakilishi “Mimi” kinahifadhi msisitizo wa Ἐγώ, huku tanbihi ikieleza kwamba Kigiriki kinasema kwa kifupi “Mimi ni.”
- source_word: ὁ λαλῶν σοι
  choice: ninayesema nawe
  rationale: Muundo huu unawakilisha kirai cha kisifa chenye participle, yaani “yule anayesema nawe,” kwa Kiswahili cha asili. “Nawe” linafaa kwa mazungumzo ya moja kwa moja yanayoendelea.
theological_decisions:
- issue: Iwapo utambulisho wa Kimasihi uwekwe wazi kwa kuongeza nomino “Masihi”
  choice: Mimi ndiye
  alternative: Mimi ndiye Masihi
  rationale: Muktadha unaonyesha kwamba Yesu anajitambulisha kuwa Masihi, lakini neno “Masihi” halirudiwi katika Kigiriki cha mstari huu. Tafsiri haijaliongeza, hivyo inadumisha ufupi na mvutano wa matini huku ikitoa Kiswahili kinachoeleweka.
- issue: Jinsi ya kushughulikia Ἐγώ εἰμι isiyo na kiarifu kilichotajwa wazi
  choice: Tumia “Mimi ndiye” katika matini na ueleze umbo halisi katika tanbihi
  alternative: Mimi ni, ninayesema nawe
  rationale: “Mimi ni” peke yake husikika kama sentensi isiyokamilika katika Kiswahili cha kawaida, ilhali “Mimi ndiye” huwasilisha utambulisho unaodokezwa na muktadha bila kuongeza moja kwa moja “Masihi.” Tanbihi inalinda uwazi kuhusu umbo la Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Akamwambia” ni mtindo wa kawaida wa simulizi; “Mimi ndiye” ni wa asili zaidi kuliko “Mimi ni” katika utambulisho huu, huku tanbihi ikihifadhi muundo na utata wa Kigiriki.
