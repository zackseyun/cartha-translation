  yaml_path: translation/nt/john/004/028.yaml
  text: So the woman left her water jar and went into the town and says to the people,
translation:
  language: sw
  text: 'Basi, yule mwanamke akaliacha mtungi wake wa maji, akaenda mjini, anawaambia watu:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑδρία
  choice: mtungi wa maji
  rationale: Hutaja chombo cha kuchotea au kuhifadhia maji; usemi huu ni wa kawaida na unaeleweka wazi katika Kiswahili cha Afrika Mashariki.
- source_word: πόλις
  choice: mji
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya mahali pa mjini panapotajwa.
- source_word: λέγει
  choice: akawaambia
  rationale: Wakati uliopo wa kihistoria katika Kigiriki unaendeleza simulizi kwa uchangamfu; Kiswahili cha masimulizi hutumia kwa kawaida mfululizo wa nyakati kwa 'aka-', huku 'waambia' ikionyesha kwamba maneno yaliwaelekea watu.
- source_word: ἄνθρωποι
  choice: watu
  rationale: Katika muktadha huu ni neno jumuishi kwa watu wa mjini, si wanaume pekee.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha asili na chenye hadhi. Mfululizo wa 'akaliacha ... akaenda ... akawaambia' unasomeka vizuri katika simulizi bila kuongeza maelezo yasiyokuwamo katika chanzo.
