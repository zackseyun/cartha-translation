lexical_decisions:
- source_word: καίτοιγε
  choice: ingawa
  rationale: Kiunganishi hiki kinaingiza ufafanuzi wenye hali ya kukubali jambo linalotofautiana na kauli iliyotangulia; “ingawa” ni ya asili na wazi katika Kiswahili cha sasa.
- source_word: Ἰησοῦς
  choice: Yesu
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
- source_word: αὐτὸς
  choice: mwenyewe
  rationale: Linahifadhi msisitizo kwamba Yesu binafsi siye aliyekuwa akifanya ubatizo.
- source_word: οὐκ ἐβάπτιζεν
  choice: hakuwa akibatiza
  rationale: Kauli ya wakati uliopita usiotimilika inaashiria tendo lililokuwa likiendelea au kufanywa kwa kawaida; umbo hili linadokeza hali hiyo kwa Kiswahili cha kawaida.
- source_word: ἀλλ’
  choice: bali
  rationale: “Bali” linaonyesha kwa wazi utofautishaji kati ya Yesu na wanafunzi wake.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: wanafunzi wake ndio waliokuwa akibatiza
  rationale: Kigiriki hakirudii kitenzi katika kishazi hiki, lakini Kiswahili hukihitaji ili maana iwe wazi. “Ndio” linahifadhi msisitizo wa utofautishaji, na “waliokuwa akibatiza” linaendeleza hali ya tendo la wakati uliopita usiotimilika.
theological_decisions:
- issue: Ufafanuzi kuhusu waliokuwa wakibatiza katika huduma ya Yesu
  choice: Mstari unasema kwamba Yesu mwenyewe hakufanya ubatizo; wanafunzi wake ndio walioufanya.
  alternative: “Yesu mwenyewe hakubatiza, bali wanafunzi wake walibatiza.”
  rationale: Tafsiri inahifadhi msisitizo wa αὐτός na hali ya kitenzi cha wakati uliopita usiotimilika bila kuongeza maelezo ya kiteolojia yasiyokuwamo katika maandishi.
translation_notes:
