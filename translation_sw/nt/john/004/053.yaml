base_translation:
  language: en
  yaml_path: translation/nt/john/004/053.yaml
  text: So the father knew that it was at that hour when Jesus said to him[a], “Your son lives,” and he himself believed[b], and his whole household.
translation:
  language: sw
  text: Basi baba akatambua kwamba ilikuwa saa ile Yesu alipomwambia, “Mwanao yu hai.”[a] Naye mwenyewe akaamini,[b] pamoja na watu wote wa nyumbani mwake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mwanao anaishi.”
    reason: lexical_alternative
  - marker: b
    text: Kitenzi “akaamini” kinaweza kumaanisha kwamba aliamini neno hili la Yesu hasa, au kwamba alimwamini Yesu kwa ukamilifu zaidi; Kigiriki hakielezi wazi upeo wa imani hiyo.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔγνω
  choice: akatambua
  rationale: Katika muktadha huu kitenzi kinaonyesha kwamba baba aligundua ulinganifu kati ya saa iliyotajwa na watumishi na wakati Yesu aliposema neno lake. “Akatambua” ni Kiswahili cha kawaida na hudumisha maana hiyo ya utambuzi.
- source_word: οὖν
  choice: Basi
  rationale: Huunganisha hitimisho hili na taarifa ya watumishi katika mstari uliotangulia na kuonyesha matokeo au hitimisho la simulizi.
- source_word: ὁ πατὴρ
  choice: baba
  rationale: Hufuata nafasi ya kifamilia iliyosisitizwa na Kigiriki badala ya kurudia cheo chake kama ofisa.
- source_word: ἐκείνῃ τῇ ὥρᾳ ἐν ᾗ
  choice: ilikuwa saa ile ... alipomwambia
  rationale: Muundo huu wa Kiswahili unaonyesha wakati maalumu na uhusiano wake na wakati Yesu aliposema, bila kuongeza msisitizo usio wazi katika Kigiriki.
- source_word: εἶπεν αὐτῷ ὁ Ἰησοῦς
  choice: Yesu alipomwambia
  rationale: Ni usemi wa kawaida wa Kiswahili unaowasilisha wazi kwamba Yesu alisema maneno hayo kwake.
- source_word: Ὁ υἱός σου ζῇ
  choice: Mwanao yu hai
  rationale: Huonyesha hali ya sasa ya mwana kuwa hai. “Anaishi” pia linawezekana na limetajwa katika tanbihi.
- source_word: ἐπίστευσεν
  choice: akaamini
  rationale: Hudumisha maana pana ya πιστεύω bila kufafanua kwa lazima ikiwa aliamini neno hili mahususi au alimwamini Yesu kwa maana pana zaidi.
- source_word: αὐτὸς
  choice: naye mwenyewe
  rationale: Kiwakilishi cha msisitizo katika Kigiriki kinawakilishwa wazi na “mwenyewe,” huku “naye” kikiendeleza simulizi kwa kawaida.
- source_word: ἡ οἰκία αὐτοῦ ὅλη
  choice: watu wote wa nyumbani mwake
  rationale: Hapa οἰκία ni watu wa kaya, si jengo. Tafsiri hii inaepuka utata wa “nyumba” na kuhifadhi wazo la kaya nzima.
theological_decisions:
- issue: Maana na upeo wa kuamini kwa baba
  choice: Akaamini
  alternative: Aliamini neno la Yesu kuhusu uponyaji pekee, au alimwamini Yesu kwa imani kamili zaidi
  rationale: Kigiriki hakitaji wazi upeo wa imani yake. Tafsiri rahisi “akaamini” huhifadhi uwezekano wa imani katika neno la Yesu na pia maana pana ya kumwamini Yesu, bila kuamua zaidi ya andiko.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa maandiko. “Yu hai” ni kifupi, cha heshima, na kinaeleweka kwa wasomaji wa kawaida; “watu wote wa nyumbani mwake” linaweka wazi kwamba kinachokusudiwa ni kaya nzima.
