  yaml_path: translation/nt/john/004/052.yaml
  text: So he asked them the hour in which he got better. Then they said to him[a], “Yesterday at the seventh hour the fever left him.”
translation:
  language: sw
  text: Basi akawauliza ni saa gani mtoto wake alianza kupata nafuu. Wakamwambia, “Jana, saa ya saba[a], homa ilimwacha.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘Saa ya saba’ inaweza kumaanisha karibu saa moja alasiri ikiwa saa zilihesabiwa tangu macheo; wengine wanaelewa mfumo wa Yohana wa kuhesabu wakati kwa njia tofauti, na hivyo huiona kuwa karibu saa moja jioni.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπύθετο οὖν
  choice: Basi akawauliza
  rationale: Kitenzi kina maana ya kuuliza au kutaka kujua, na οὖν inaendeleza simulizi kwa kuunganisha swali hili na habari ya mstari uliotangulia.
- source_word: τὴν ὥραν παρ’ αὐτῶν
  choice: ni saa gani
  rationale: Huu ni usemi wa kawaida wa Kiswahili wa kuuliza wakati maalumu; wazo la kupata habari kutoka kwao linaonyeshwa na kiambishi cha yambwa katika ‘akawauliza.’
- source_word: ἐν ᾗ κομψότερον ἔσχεν
  choice: alianza kupata nafuu
  rationale: Nahau ya Kigiriki inaeleza hali ya mgonjwa kuimarika; ‘alianza kupata nafuu’ inaonyesha kwa kawaida kwamba mabadiliko hayo yalitokea wakati fulani.
- source_word: εἶπαν οὖν αὐτῷ
  choice: Wakamwambia
  rationale: Muundo huu unaendeleza mfuatano wa simulizi na kuonyesha kuwa jibu lilielekezwa kwake.
- source_word: Ἐχθὲς ὥραν ἑβδόμην
  choice: Jana, saa saba
  rationale: ‘Saa saba’ huhifadhi jina la saa katika maandishi ya Kigiriki bila kulazimisha mfumo mmoja wa kuhesabu muda.
- source_word: ἀφῆκεν αὐτὸν ὁ πυρετός
  choice: homa ilimwacha
  rationale: Tafsiri hii ni ya asili katika Kiswahili na inadumisha homa kama kiima cha kishazi, kama ilivyo katika Kigiriki.
theological_decisions:
- issue: Mfumo wa kuhesabu ‘saa ya saba’
  choice: Kudumisha ‘saa saba’ katika matini kuu
  alternative: Saa moja alasiri ikiwa muda ulihesabiwa tangu macheo, au takriban saa moja jioni kwa uelewa mwingine wa mfumo wa wakati wa Yohana
  rationale: Mstari wenyewe hautaji mfumo uliotumiwa. Kutobadili kuwa wakati wa saa ya kisasa kunahifadhi utata halisi wa chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini rahisi kueleweka. ‘Kupata nafuu’ ni usemi wa kawaida kuhusu kuimarika kwa mgonjwa; ‘homa ilimwacha’ huhifadhi taswira ya chanzo. Alama ya tanbihi imewekwa baada ya ‘Wakamwambia’ ili kuendana na nyenzo ya ushauri, ingawa maelezo yake yanahusu ‘saa saba.’
