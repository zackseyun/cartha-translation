id: JHN.4.27
reference: John 4:27
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ ἐπὶ τούτῳ ἦλθαν οἱ μαθηταὶ αὐτοῦ, καὶ ⸀ἐθαύμαζον ὅτι μετὰ γυναικὸς ἐλάλει· οὐδεὶς μέντοι εἶπεν· Τί ζητεῖς; ἢ τί λαλεῖς μετ’ αὐτῆς;
base_translation:
  language: en
  yaml_path: translation/nt/john/004/027.yaml
  text: And at this point his disciples came[a], and they were amazed that he was speaking with a woman. Yet no one said, “What are you seeking?” or[b], “Why are you speaking with her?”
translation:
  language: sw
  text: Wakati huo wanafunzi wake wakaja, nao walishangaa kwamba alikuwa akizungumza na mwanamke. Hata hivyo, hakuna aliyesema, “Unatafuta nini?”[a] au, “Kwa nini unazungumza naye?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Unataka nini?”
    reason: lexical_alternative
  - marker: b
    text: Kwa neno kwa neno, “Unazungumza nini naye?” Maana katika muktadha ni, “Kwa nini unazungumza naye?”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ τούτῳ
  choice: Wakati huo
  rationale: 'Kirai hiki kina matumizi ya wakati katika simulizi: jambo linatokea katika wakati huo. Tafsiri hii ni ya kawaida na haileti maana ya mahali.'
- source_word: ἐθαύμαζον
  choice: walishangaa
  rationale: Kitenzi kinaonyesha mshangao wao waliokuwa nao walipofika. “Walishangaa” ni Kiswahili cha sasa, cha kawaida na chenye hadhi.
- source_word: μετὰ γυναικὸς
  choice: na mwanamke
  rationale: Nomino isiyo na kibainishi inaelekea kumtaja mwanamke kwa ujumla katika sababu ya mshangao wao. Muktadha hauruhusu maana ya “mke.”
- source_word: ἐλάλει
  choice: alikuwa akizungumza
  rationale: Muundo huu unaonyesha mazungumzo yaliyokuwa yakiendelea wanafunzi walipofika, kulingana na hali ya kitenzi cha Kigiriki.
- source_word: μέντοι
  choice: Hata hivyo
  rationale: Inaonyesha tofauti kati ya kushangaa kwao na kutosema kwao maswali hayo kwa sauti.
- source_word: Τί ζητεῖς;
  choice: Unatafuta nini?
  rationale: Huhifadhi maana ya msingi ya ζητέω, ‘kutafuta,’ na pia kutokutajwa kwa kitu kinachotafutwa. Maana inayowezekana ya “Unataka nini?” imetolewa katika tanbihi.
- source_word: τί λαλεῖς μετ’ αὐτῆς;
  choice: Kwa nini unazungumza naye?
  rationale: Kwa Kiswahili, nguvu ya kimuktadha ya τί katika swali hili inaelezwa kwa kawaida kwa “kwa nini.” Tafsiri ya neno kwa neno ni ngumu katika Kiswahili, kwa hiyo imehifadhiwa katika tanbihi.
theological_decisions:
- issue: Maana ya kijamii ya Yesu kuzungumza na mwanamke
  choice: Kueleza tu kwamba wanafunzi walishangaa kwa sababu alikuwa akizungumza na mwanamke
  alternative: Kuongeza katika mstari sababu inayohusu tofauti za kijinsia, kijamii au za Wayahudi na Wasamaria
  rationale: Kigiriki hakitaji wazi sababu ya kijamii au kikabila ya mshangao wao. Tafsiri kwa hiyo inadumisha ukomo na mvutano wa maelezo ya asili bila kuingiza ufafanuzi wa ziada.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha asili, cha sasa na chenye hadhi. “Akizungumza” ni rasmi kwa kiasi bila kuwa cha kizamani. Alama zote za tanbihi zimewekwa katika matini kuu.
