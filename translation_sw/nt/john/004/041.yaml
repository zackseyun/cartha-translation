translation:
  language: sw
  text: Na watu wengi zaidi wakaamini kwa sababu ya neno lake.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watu wengi zaidi sana wakaamini.” Kigiriki kinatumia usemi wa kulinganisha uliotiwa mkazo.
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa sababu ya ujumbe wake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλῷ πλείους
  choice: wengi zaidi
  rationale: Usemi huu wa kulinganisha uliotiwa mkazo unaonyesha ongezeko kubwa la idadi kwa kulinganisha na waliotajwa katika mstari uliotangulia. “Wengi zaidi” ni Kiswahili cha kawaida na huhifadhi ulinganisho huo.
- source_word: ἐπίστευσαν
  choice: wakaamini
  rationale: Kitenzi hiki cha wakati uliopita kinaeleza kwa njia ya moja kwa moja kwamba waliamini; tafsiri haiongezi kitu kisichotajwa wazi katika mstari huu.
- source_word: διὰ
  choice: kwa sababu ya
  rationale: 'Ikiwa na nomino katika hali ya accusative, διά hapa inaonyesha sababu: kuamini kwao kulitokana na yale aliyosema Yesu.'
- source_word: λόγον
  choice: neno
  rationale: “Neno” huhifadhi msamiati wa Yohana na katika muktadha huu linaeleweka kuwa yale aliyosema Yesu. “Ujumbe” ni tafsiri nyingine ya asili inayowezekana.
- source_word: αὐτοῦ
  choice: lake
  rationale: Kiwakilishi hiki kinamrejelea Yesu katika muktadha wa karibu; “lake” kinakubaliana kisarufi na “neno.”
theological_decisions:
- issue: Jinsi ya kutafsiri πιστεύω katika simulizi lenye muktadha wa wokovu
  choice: wakaamini
  alternative: wakaja kumwamini; wakaweka imani yao kwake
  rationale: Kigiriki kinasema tu kwamba wengi zaidi waliamini kwa sababu ya neno lake, bila kutaja yambwa wazi katika mstari huu. Tafsiri hii haiongezi ufafanuzi wa kimafundisho, huku muktadha wa Yohana ukionyesha anayelengwa na imani hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “Na ... wakaamini” unaendeleza simulizi kutoka mstari uliotangulia. Alama zote za tanbihi zimewekwa katika matini kuu.
