lexical_decisions:
- source_word: γὰρ
  choice: Kwa maana
  rationale: Kiunganishi hiki kinaeleza sababu au hali inayounga mkono simulizi lililotangulia; “Kwa maana” kinahifadhi uhusiano huo kwa Kiswahili cha kawaida.
- source_word: μαθηταὶ αὐτοῦ
  choice: wanafunzi wake
  rationale: Huu ni usemi wa kawaida na sahihi wa Kiswahili kwa nomino pamoja na kiwakilishi cha umilikaji.
- source_word: ἀπεληλύθεισαν
  choice: walikuwa wameenda
  rationale: Wakati timilifu uliopita katika Kigiriki unaonyesha kwamba kuondoka kwao kulitokea kabla ya tukio linalosimuliwa; “walikuwa wameenda” linaonyesha utangulizi huo kwa kawaida.
- source_word: εἰς τὴν πόλιν
  choice: mjini
  rationale: εἰς inaonyesha mwendo kuelekea au kuingia mahali, na πόλις humaanisha mji; “kwenda mjini” ni usemi wa asili wa Kiswahili unaofaa katika muktadha huu.
- source_word: ἵνα
  choice: ku-
  rationale: Hapa ἵνα inaonyesha kusudi; kitenzi-jina “kununua” kinaeleza kusudi hilo kwa Kiswahili cha kawaida.
- source_word: τροφὰς
  choice: chakula
  rationale: Ingawa neno la Kigiriki liko katika wingi na linaweza kumaanisha vyakula au mahitaji ya chakula, “chakula” kama nomino ya jumla ndiyo tafsiri ya kawaida zaidi katika muktadha huu.
- source_word: ἀγοράσωσιν
  choice: kununua
  rationale: Kitenzi hiki kinaeleza tendo lililokusudiwa baada ya ἵνα; “kununua” ni sawa, wazi, na cha kawaida.
