  text: Kwa maana wanafunzi wake walikuwa wameenda mjini[a] kununua chakula[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwenye mji.” Neno πόλις linaweza kutafsiriwa “mji” au, kwa muktadha, “mji mdogo.”
