  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ὡς οὖν ἔγνω ὁ ⸀Ἰησοῦς ὅτι ἤκουσαν οἱ Φαρισαῖοι ὅτι Ἰησοῦς πλείονας μαθητὰς ποιεῖ καὶ βαπτίζει ἢ Ἰωάννης—
base_translation:
  language: en
  yaml_path: translation/nt/john/004/001.yaml
  text: Therefore[a], when Jesus knew that the Pharisees had heard that Jesus was making and baptizing more disciples than John—
translation:
  language: sw
  text: Basi, Yesu alipojua kwamba Mafarisayo walikuwa wamesikia kwamba Yesu alikuwa akiwafanya watu wengi zaidi kuwa wanafunzi na kuwabatiza kuliko Yohana[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yesu alikuwa akifanya wanafunzi wengi zaidi na kubatiza zaidi kuliko Yohana.” Muundo wa Kigiriki unaweza kueleweka kuwa ulinganisho huo unahusu shughuli hizo mbili kwa pamoja, badala ya idadi ya wanafunzi pekee.
    reason: Mbadala wa kisarufi unaohifadhi uwezekano wa upeo tofauti wa ulinganisho katika Kigiriki.
lexical_decisions:
- source_word: Ὡς οὖν
  choice: Basi, ... alipojua
  rationale: “Alipo-” huonyesha wakati, huku “Basi” ikidumisha uhusiano wa kimantiki au mwendelezo wa simulizi unaoonyeshwa na οὖν.
- source_word: ἔγνω
  choice: alipojua
  rationale: Hutoa maana ya Yesu kupata habari au kuwa na ufahamu huo, kwa Kiswahili cha kawaida na kifupi.
- source_word: οἱ Φαρισαῖοι
  choice: Mafarisayo
  rationale: Hili ndilo jina la kawaida la kundi hili katika Kiswahili cha Biblia.
- source_word: ἤκουσαν
  choice: walikuwa wamesikia
  rationale: Muundo huu unaweka wazi kwamba kusikia kwa Mafarisayo kulitangulia kujua kwa Yesu.
- source_word: πλείονας μαθητὰς
  choice: watu wengi zaidi kuwa wanafunzi
  rationale: Katika muundo wa “kufanya ... kuwa wanafunzi,” tafsiri hii ni ya asili na huonyesha wazi kwamba idadi ya waliokuwa wanafanywa wanafunzi ilikuwa kubwa zaidi.
- source_word: ποιεῖ
  choice: alikuwa akifanya ... kuwa wanafunzi
  rationale: ποιεῖ pamoja na μαθητάς humaanisha kufanya watu wawe wanafunzi; muundo huu ni wazi kwa wasomaji wa Kiswahili.
- source_word: βαπτίζει
  choice: kuwabatiza
  rationale: “Kubatiza” ndilo neno la kawaida na linaloeleweka zaidi kwa βαπτίζω katika simulizi la Agano Jipya.
- source_word: ἢ Ἰωάννης
  choice: kuliko Yohana
  rationale: Hudumisha muundo wa ulinganisho bila kurudia vitenzi ambavyo vinaeleweka kutokana na muktadha.
theological_decisions:
- issue: Kauli inaweza kuonekana kumaanisha kwamba Yesu mwenyewe alikuwa akibatiza
  choice: Kudumisha kauli ya moja kwa moja kwamba Yesu alikuwa akifanya watu kuwa wanafunzi na kuwabatiza
  alternative: Kusema mapema kwamba wanafunzi wa Yesu ndio waliokuwa akibatiza
  rationale: Mstari wa 2 ndio unaofafanua kwamba Yesu mwenyewe hakubatiza. Tafsiri ya mstari huu haipaswi kuingiza ufafanuzi huo mapema wala kuondoa mvutano wa simulizi.
- issue: Upeo wa ulinganisho katika πλείονας μαθητὰς ποιεῖ καὶ βαπτίζει ἢ Ἰωάννης
  choice: Kueleza kwamba Yesu alikuwa akifanya watu wengi zaidi kuwa wanafunzi na kuwabatiza kuliko Yohana
  alternative: Kueleza kwamba alikuwa akifanya wanafunzi wengi zaidi na, kwa ujumla, akibatiza zaidi kuliko Yohana
  rationale: Muundo wa Kigiriki unaweza kueleweka kwa zaidi ya njia moja kuhusu jinsi “wengi zaidi” inavyohusiana na vitenzi viwili. Maandishi makuu yanatoa usomaji wa asili, na tanbihi inadumisha usomaji mwingine.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Basi” ni kiunganishi cha kawaida cha simulizi; “alipojua” na “walikuwa wamesikia” huweka mpangilio wa matukio wazi. Alama ya mwisho ya mstari (—) imedumishwa kwa sababu sentensi inaendelea katika mstari unaofuata.
