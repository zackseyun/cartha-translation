id: JHN.4.22
reference: John 4:22
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὑμεῖς προσκυνεῖτε ὃ οὐκ οἴδατε, ἡμεῖς προσκυνοῦμεν ὃ οἴδαμεν, ὅτι ἡ σωτηρία ἐκ τῶν Ἰουδαίων ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/022.yaml
  text: You worship what you do not know; we worship what we know[a], because salvation is from the Jews.
translation:
  language: sw
  text: Ninyi mnaabudu msichokijua; sisi tunaabudu tunachokijua, kwa sababu wokovu unatoka kwa Wayahudi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watu wa Kiyahudi.” Mahali pengine katika Yohana, “Wayudea” huenda ikafaa katika baadhi ya miktadha; lakini hapa tofauti ni kati ya Wasamaria na Wayahudi katika masuala ya ibada na historia ya wokovu.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκυνεῖτε / προσκυνοῦμεν
  choice: mnaabudu / tunaabudu
  rationale: Katika muktadha huu kitenzi kinamaanisha ibada ya kidini, si kuinama tu au kutoa heshima ya kiraia.
- source_word: ὃ
  choice: msichokijua / tunachokijua
  rationale: Kiwakilishi rejeshi cha Kigiriki ni cha jinsia isiyo ya kiume wala ya kike; muundo huu wa Kiswahili unaeleza kwa kawaida ‘kile ambacho’ bila kulazimisha rejeo la kibinafsi lisilo wazi katika Kigiriki.
- source_word: οἴδατε / οἴδαμεν
  choice: mnajua / tunajua
  rationale: Mzizi ‘-jua’ unahifadhi tofauti ya moja kwa moja kati ya kutokijua na kukijua kile kinachoabudiwa.
- source_word: σωτηρία
  choice: wokovu
  rationale: ‘Wokovu’ ni neno la kawaida na linalofaa kwa kazi ya Mungu ya kuokoa katika muktadha huu.
- source_word: ἐκ
  choice: unatoka kwa
  rationale: Muundo huu unaonyesha chanzo au asili ya kihistoria kwa Kiswahili cha kawaida.
- source_word: τῶν Ἰουδαίων
  choice: Wayahudi
  rationale: Hapa tofauti ni kati ya Wasamaria na Wayahudi katika ibada na historia ya wokovu; ‘Wayahudi’ ni tafsiri ya moja kwa moja na ya kawaida.
theological_decisions:
- issue: Maana ya ‘wokovu unatoka kwa Wayahudi’
  choice: Kauli kuhusu chanzo cha kihistoria cha wokovu na jinsi ulivyopitishwa kupitia watu wa Kiyahudi
  alternative: Rejeo finyu kwa asili ya Kiyahudi ya Masihi, au dai pana kuhusu nafasi ya kwanza ya ufunuo na ibada ya Kiyahudi
  rationale: Tafsiri inahifadhi kauli ya chanzo kama ilivyo katika Kigiriki bila kuifanya kuwa dai la ubora wa kikabila wala kuingiza msimamo wa kitheolojia usiotajwa wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Miundo ‘msichokijua’ na ‘tunachokijua’ ni mifupi na ya asili huku ikihifadhi ulinganifu mkali wa sentensi ya Kigiriki.
