  text: Kwa hiyo, wanafunzi walikuwa wakiambiana[a], “Je, kuna mtu aliyemletea chakula?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Je, hakuna mtu aliyemletea chakula?” Swali la Kigiriki lenye μή linatarajia jibu la kukataa.
