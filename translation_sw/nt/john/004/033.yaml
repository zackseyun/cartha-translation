lexical_decisions:
- source_word: ἔλεγον
  choice: walikuwa wakiambiana
  rationale: Kauli ya wakati usiotimilifu inaonyesha mazungumzo yaliyokuwa yakiendelea; pamoja na πρὸς ἀλλήλους, ‘walikuwa wakiambiana’ ni Kiswahili cha kawaida na huonyesha usemi wa wao kwa wao.
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Huunganisha swali lao na kauli ya Yesu iliyotangulia kwa kuonyesha hitimisho au mwendelezo wa simulizi.
- source_word: οἱ μαθηταὶ
  choice: wanafunzi
  rationale: Hili ndilo neno la kawaida na sahihi kwa μαθηταί katika Injili.
- source_word: πρὸς ἀλλήλους
  choice: wakiambiana
  rationale: Umbo la kutendeana linaonyesha wazi kwamba walikuwa wakisema wao kwa wao bila kufanya sentensi kuwa nzito.
- source_word: Μή τις
  choice: Je, kuna mtu
  rationale: Hutoa swali linaloeleweka kwa Kiswahili cha kawaida; alama ya tanbihi huhifadhi kwamba μή huelekeza kwenye jibu la kukataa.
- source_word: ἤνεγκεν αὐτῷ
  choice: aliyemletea
  rationale: Kitenzi hiki huwasilisha kwa kawaida maana ya kumletea yeye, huku kiwakilishi cha yambwa kikimrejelea Yesu katika muktadha.
- source_word: φαγεῖν
  choice: chakula
  rationale: Ingawa kwa umbo ni ‘kula,’ katika muktadha huu linadokeza kitu cha kula; ‘chakula’ ni usemi wa asili na mfupi wa Kiswahili.
