  text: Baada ya siku hizo mbili, aliondoka huko kwenda Galilaya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μετὰ δὲ τὰς δύο ἡμέρας
  choice: Baada ya siku hizo mbili
  rationale: μετά pamoja na hali ya usababishi hapa huonyesha wakati unaofuata, yaani “baada ya.” Kibainishi katika “τὰς δύο ἡμέρας” kinaelekeza kwenye zile siku mbili za kukaa zilizotajwa katika mstari uliotangulia; kwa hiyo “siku hizo mbili” ni ya asili na huweka wazi rejeo hilo. δέ ni kiunganishi hafifu na hakihitaji kutafsiriwa moja kwa moja katika Kiswahili hapa.
- source_word: ἐξῆλθεν
  choice: aliondoka
  rationale: Kitenzi hiki cha wakati uliopita kutoka ἐξέρχομαι kina maana ya kutoka au kuondoka mahali. Katika simulizi la safari, “aliondoka” ni Kiswahili cha kawaida na chenye usahihi.
- source_word: ἐκεῖθεν
  choice: huko
  rationale: Kielezi hiki huonyesha mahali alikotoka, yaani eneo lililotajwa kabla. “Huko” huwasilisha maana hiyo kwa ufupi na kwa kawaida katika Kiswahili.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: kwenda Galilaya
  rationale: εἰς huonyesha mwendo kuelekea mahali panapolengwa. “Kwenda Galilaya” ni usemi wa kawaida wa Kiswahili na hauongezi msisitizo usio wa lazima wa kuingia ndani ya eneo hilo.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa kisasa, wenye hadhi na unaosomeka kwa urahisi. Hakuna tanbihi iliyowekwa kwa sababu tofauti ya Kiingereza kati ya “for Galilee” na “to Galilee” haina tofauti ya maana inayohitaji kuonyeshwa katika tafsiri ya kawaida ya Kiswahili “kwenda Galilaya.”
