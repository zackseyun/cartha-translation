  verdict: approve
  source_fidelity: “Ilimbidi apitie Samaria[a]” accurately conveys ἔδει ... διέρχεσθαι διὰ τῆς Σαμαρείας. “Ilimbidi” retains the past-narrative necessity and does not assign a geographic or theological basis for it. “Apitie Samaria” naturally expresses travel through the region.
