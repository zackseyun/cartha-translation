  text: ἔδει δὲ αὐτὸν διέρχεσθαι διὰ τῆς Σαμαρείας.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/004.yaml
  text: He had to pass through Samaria[a].
translation:
  language: sw
  text: Ilimbidi apitie Samaria[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ilikuwa lazima apitie Samaria.” Kigiriki kinaonyesha ulazima bila kutaja wazi msingi wake hasa.
    reason: Mbadala wa kileksika unaohifadhi kutobainishwa kwa msingi wa ulazima.
lexical_decisions:
- source_word: ἔδει
  choice: Ilimbidi
  rationale: Kitenzi hiki huonyesha ulazima katika simulizi la wakati uliopita. “Ilimbidi” ni Kiswahili cha kawaida na cha asili, na hakielezi chanzo cha ulazima huo.
- source_word: δὲ
  choice: hakikutafsiriwa kwa neno maalumu
  rationale: Hapa δέ ni kiunganishi chepesi cha kuendeleza simulizi, si alama ya upinzani mkubwa. Mtiririko wa Kiswahili hauhitaji kuongeza “basi” au “lakini” katika mstari huu.
- source_word: αὐτὸν
  choice: -m- katika “ilimbidi”
  rationale: Ingawa katika Kigiriki ni kiwakilishi cha hali ya kushutumiwa kinachohusiana na kitenzi-jina, muundo wa Kiswahili “ilimbidi” huwasilisha mhusika kwa kiambishi cha yambwa kwa njia ya kawaida.
- source_word: διέρχεσθαι
  choice: apitie
  rationale: Neno hili pamoja na διά linaonyesha kwenda au kupita ndani ya eneo fulani. “Apitie” ni fupi, ya asili, na huhifadhi maana ya kusafiri kupitia eneo hilo.
- source_word: διὰ τῆς Σαμαρείας
  choice: Samaria
  rationale: διά pamoja na umilikishi huonyesha mwendo kupitia mahali. Katika muundo “apitie Samaria,” maana ya kupitia eneo la Samaria iko wazi bila kuongeza neno “eneo.”
theological_decisions:
- issue: Nguvu na msingi wa ulazima katika ἔδει
  choice: Kutaja ulazima halisi kwa “ilimbidi” bila kueleza ulitokana na nini
  alternative: “Ilikuwa lazima apitie Samaria,” au kufafanua kuwa ulikuwa ulazima wa kijiografia au wa kusudi la Mungu
  rationale: Kigiriki kinathibitisha ulazima lakini mstari huu pekee hautaji msingi wake. Tafsiri haipaswi kuamua kama ulikuwa wa kijiografia, wa kimisheni, au wa kusudi la Mungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, fasaha na chenye hadhi. “Ilimbidi apitie” ni muundo wa kawaida unaoeleweka kwa urahisi; alama ya tanbihi [a] imewekwa katika matini kuu.
