  text: τῇ τε γυναικὶ ἔλεγον ὅτι Οὐκέτι διὰ τὴν σὴν λαλιὰν πιστεύομεν· αὐτοὶ γὰρ ἀκηκόαμεν, καὶ οἴδαμεν ὅτι οὗτός ἐστιν ἀληθῶς ὁ σωτὴρ τοῦ ⸀κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/042.yaml
  text: And they were saying to the woman[a], “We no longer believe because of your word, for we ourselves have heard[b], and we know that this one truly is the Savior of the world.”
translation:
  language: sw
  text: Nao walikuwa wakimwambia yule mwanamke, “Si kwa sababu ya maneno yako tena tunaamini, kwa maana sisi wenyewe tumemsikia, nasi tunajua kwamba huyu kweli ndiye Mwokozi wa ulimwengu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῇ τε γυναικὶ
  choice: Nao ... yule mwanamke
  rationale: Dativu humtaja anayesemeshwa, huku τε ikiwa kiunganishi chepesi cha simulizi; “Nao” huendeleza simulizi kwa Kiswahili cha kawaida.
- source_word: ἔλεγον
  choice: walikuwa wakimwambia
  rationale: Muundo huu unahifadhi hali endelevu ya wakati uliopita iliyo katika imperfect ya Kigiriki na pia unaonyesha wazi kwamba maneno yalielekezwa kwa mwanamke.
- source_word: Οὐκέτι
  choice: Sasa hatuamini tena
  rationale: “Tena” huonyesha kwamba ushuhuda wake si msingi wao wa sasa kama ulivyokuwa awali; “sasa” hufanya badiliko hilo lieleweke kwa urahisi.
- source_word: διὰ τὴν σὴν λαλιὰν
  choice: kwa sababu ya maneno yako
  rationale: διά pamoja na accusative huonyesha sababu au msingi. “Maneno yako” huwasilisha kwa kawaida ushuhuda wa mdomo wa mwanamke bila kuufanya kuwa neno moja maalumu.
- source_word: πιστεύομεν
  choice: tunaamini
  rationale: Wakati wa sasa unaonyesha imani yao ya sasa; katika sentensi hasi imekuwa “hatuamini.”
- source_word: αὐτοὶ
  choice: sisi wenyewe
  rationale: Huhifadhi msisitizo wa uzoefu wao wa moja kwa moja ukilinganishwa na taarifa waliyopewa na mwanamke.
- source_word: ἀκηκόαμεν
  choice: tumemsikia
  rationale: Kauli timilifu inaonyesha tendo lililokamilika lenye matokeo ya sasa. Kiambishi cha yambwa “-m-” kinaweka wazi kwamba waliyemsikia ni Yesu, kama muktadha unavyoonyesha.
- source_word: οἴδαμεν
  choice: tunajua
  rationale: οἶδα hufanya kazi kama kitenzi cha hali ya sasa chenye maana ya kujua.
- source_word: οὗτός
  choice: huyu
  rationale: Kiwakilishi kionyeshi kinadumisha msisitizo wa Kigiriki kwa Yesu kuliko kutumia tu “yeye.”
- source_word: ἀληθῶς
  choice: kweli
  rationale: Huhifadhi uthibitisho wenye uzito wa ungamo lao kwa lugha ya kawaida na yenye heshima.
- source_word: ὁ σωτὴρ
  choice: Mwokozi
  rationale: Ni neno la kawaida la Kiswahili kwa σωτήρ na linahifadhi uzito wa kikristolojia wa cheo hicho.
- source_word: τοῦ κόσμου
  choice: wa ulimwengu
  rationale: Hufuata upeo mpana wa κόσμος bila kuongeza “wote” au kuubana kwa kundi fulani.
theological_decisions:
- issue: Upeo na nguvu ya ungamo la Wasamaria
  choice: “huyu kweli ndiye Mwokozi wa ulimwengu”
  alternative: “huyu ndiye Mwokozi wa watu wote” au tafsiri inayoubana ulimwengu kuwa kundi fulani
  rationale: Tafsiri inadumisha ungamo pana la andiko bila kuongeza ufafanuzi wa kimafundisho kuhusu namna au upeo wa wokovu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. “Walikuwa wakimwambia” huhifadhi hali endelevu ya kitenzi, na “huyu” huhifadhi msisitizo wa kiwakilishi kionyeshi.
