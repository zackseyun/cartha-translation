  yaml_path: translation/nt/john/004/016.yaml
  text: He said to her[a], “Go, call your husband, and come here.”
translation:
  language: sw
  text: Akamwambia, “Nenda ukamwite mume wako, kisha uje hapa.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Λέγει αὐτῇ
  choice: Akamwambia
  rationale: Kauli ya sasa ya kihistoria katika simulizi imetafsiriwa kwa wakati uliopita, ambao ni wa kawaida na wa asili katika simulizi la Kiswahili. Kiambishi -mw- kinaonyesha kuwa alisema kwa mwanamke huyo.
- source_word: Ὕπαγε
  choice: Nenda
  rationale: Amri hii inamtaka aondoke ili akatekeleze jambo linalofuata; “Nenda” ni tafsiri fupi na ya kawaida.
- source_word: φώνησον
  choice: ukamwite
  rationale: Kitenzi hiki hapa kinamaanisha kumwita mtu aje. Muundo “ukamwite” unaunganisha kwa kawaida kwenda na kusudi la kwenda huko.
- source_word: τὸν ἄνδρα σου
  choice: mume wako
  rationale: Ingawa ἀνήρ inaweza kumaanisha “mwanamume” au “mume,” muktadha wa mahusiano ya nyumbani na kimilikishi σου unaunga mkono maana ya “mume wako.”
- source_word: καὶ
  choice: kisha
  rationale: Kiunganishi kinaunganisha amri mbili zinazofuatana. “Kisha” huonyesha kwa Kiswahili cha kawaida kwamba kuja kunafuata baada ya kumwita mume, bila kubadili kiini cha agizo.
- source_word: ἐλθὲ ἐνθάδε
  choice: uje hapa
  rationale: “Uje hapa” ni kauli ya kawaida ya Kiswahili inayoonyesha mwendo kuelekea mahali alipo msemaji. Haiongezi wazi wazo la “kurudi,” ambalo linadokezwa tu na muktadha.
