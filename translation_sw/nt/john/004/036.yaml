  text: ⸀ὁ θερίζων μισθὸν λαμβάνει καὶ συνάγει καρπὸν εἰς ζωὴν αἰώνιον, ⸀ἵνα ὁ σπείρων ὁμοῦ χαίρῃ καὶ ὁ θερίζων.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/036.yaml
  text: The one who reaps is receiving wages and gathering fruit for eternal life[b][a], so that the one who sows and the one who reaps may rejoice together.
translation:
  language: sw
  text: Yule anayevuna anapokea ujira[a] na anakusanya matunda kwa ajili ya uzima wa milele[b], ili yule anayepanda na yule anayevuna wafurahi pamoja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “thawabu.” Neno la Kigiriki linaweza kumaanisha malipo ya kazi au thawabu.
    reason: lexical_alternative
  - marker: b
    text: Au “kuelekea uzima wa milele.” Kirai hiki kinaweza kuonyesha lengo au matokeo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ θερίζων
  choice: yule anayevuna
  rationale: Kirai cha Kigiriki ni kivumishi-kinachotumika-kama-nomino katika wakati wa sasa; tafsiri hii ni ya kawaida na inadumisha tendo linaloendelea.
- source_word: μισθὸν
  choice: ujira
  rationale: Neno hili linaweza kumaanisha malipo ya kazi au thawabu. “Ujira” inadumisha picha halisi ya kazi ya mavuno huku ikiacha uwezekano wa maana pana.
- source_word: λαμβάνει
  choice: anapokea
  rationale: Wakati wa sasa unaonyesha tendo la sasa bila kulazimisha kielezi kisichokuwamo katika matini, kama “tayari.”
- source_word: συνάγει καρπὸν
  choice: anakusanya matunda
  rationale: “Anakusanya” inadumisha tendo sambamba na “anapokea,” na “matunda” huhifadhi sitiari bila kuyafanya kuwa sawa kabisa na tendo la kuvuna.
- source_word: εἰς ζωὴν αἰώνιον
  choice: kwa ajili ya uzima wa milele
  rationale: Kirai hiki kinaelekeza kwenye lengo au matokeo; usemi huu ni wa kawaida katika Kiswahili na hauamui kabisa kati ya dhana hizo.
- source_word: ἵνα
  choice: ili
  rationale: Huanzisha kusudi, ingawa matokeo yanaweza pia kudokezwa; “ili” huunganisha vifungu kwa njia ya kawaida.
- source_word: ὁ σπείρων
  choice: yule anayepanda
  rationale: Inalingana kimuundo na “yule anayevuna” na kudumisha ulinganifu wa Kigiriki.
- source_word: ὁμοῦ χαίρῃ
  choice: wafurahi pamoja
  rationale: Hutoa wazi furaha inayoshirikishwa na mpandaji pamoja na mvunaji.
theological_decisions:
- issue: Iwapo kuongeza kielezi kinachosisitiza kuwa mavuno yanafanyika sasa
  choice: Hakuna neno “tayari” lililoongezwa
  alternative: Tayari yule anayevuna anapokea ujira...
  rationale: Ingawa muktadha unasisitiza uhalisi wa sasa wa mavuno, hakuna kielezi tofauti chenye maana ya “tayari” katika kifungu hiki. Wakati wa sasa wa vitenzi umetosha kuonyesha tendo la sasa.
- issue: Maana ya εἰς ζωὴν αἰώνιον kama lengo au matokeo
  choice: kwa ajili ya uzima wa milele
  alternative: hata kufikia uzima wa milele
  rationale: Tafsiri kuu inadumisha mvutano kati ya lengo na matokeo badala ya kuufunga kwa ufafanuzi mmoja wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Marudio ya “yule anayepanda” na “yule anayevuna” yamehifadhiwa ili kudumisha ulinganifu na msisitizo wa matini chanzi.
