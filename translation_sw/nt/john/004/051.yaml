id: JHN.4.51
reference: John 4:51
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἤδη δὲ αὐτοῦ καταβαίνοντος οἱ δοῦλοι αὐτοῦ ⸀ὑπήντησαν ⸀αὐτῷ λέγοντες ὅτι ὁ παῖς ⸀αὐτοῦ ζῇ.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/051.yaml
  text: And while he was already going down[a], his servants met him, saying that his child was alive.
translation:
  language: sw
  text: Alipokuwa tayari akiteremka, watumwa wake walikutana naye na kumwambia kwamba mtoto wake[a] yu hai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mwanawe.” Neno la Kigiriki pais linaweza kumaanisha “mtoto,” “mvulana,” au, katika baadhi ya miktadha, “mtumishi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤδη
  choice: tayari
  rationale: Huonyesha kwamba safari ya kuteremka ilikuwa imeanza na ilikuwa ikiendelea kabla ya kukutana nao.
- source_word: δὲ
  choice: (haijatafsiriwa kwa kiunganishi cha wazi)
  rationale: Ni kiunganishi hafifu cha kuendeleza simulizi; mtiririko wa kawaida wa Kiswahili hauhitaji ‘na’ au ‘lakini’ hapa.
- source_word: καταβαίνοντος
  choice: alipokuwa ... akiteremka
  rationale: Muundo huu unaonyesha tendo lililokuwa likiendelea wakati watumwa walipokutana naye; ‘kuteremka’ pia hudumisha mwelekeo wa safari kutoka Kana kwenda Kapernaumu.
- source_word: δοῦλοι
  choice: watumwa
  rationale: Katika mazingira ya nyumba ya afisa, neno hili linawahusu watu waliokuwa chini ya mamlaka yake na hudumisha uhalisia wa kijamii wa δοῦλοι kuliko ‘watumishi’.
- source_word: ὑπήντησαν αὐτῷ
  choice: walikutana naye
  rationale: Ni Kiswahili cha kawaida kinachoeleza kwamba walimjia na kukutana naye njiani.
- source_word: λέγοντες
  choice: na kumwambia
  rationale: Huwasilisha tendo lililoambatana na kukutana kwa mtiririko wa kawaida wa Kiswahili.
- source_word: παῖς
  choice: mtoto
  rationale: Neno linaweza kumaanisha mtoto, mvulana, au mtumishi kutegemea muktadha. ‘Mtoto’ hudumisha maana ya kifamilia bila kubainisha zaidi jinsia au umri.
- source_word: ζῇ
  choice: yu hai
  rationale: Huhifadhi hali ya sasa ya kitenzi cha Kigiriki na ujumbe wa moja kwa moja kwamba mtoto anaishi, bila kuongeza tafsiri kama ‘amepona’.
theological_decisions:
- issue: Rejeo la παῖς katika simulizi la uponyaji
  choice: mtoto wake
  alternative: mwanawe; mtumishi wake
  rationale: Ingawa muktadha mpana unamtambulisha kama mwana wa afisa, παῖς katika mstari huu ni pana zaidi. ‘Mtoto wake’ hudumisha uhusiano wa kifamilia bila kulazimisha umahususi ambao neno lenyewe halidai; tanbihi inaonyesha mbadala muhimu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ‘alipokuwa tayari akiteremka’ ni wa asili na hudumisha tendo linaloendelea; ‘yu hai’ ni usemi mfupi, wazi, na wenye uzito wa taarifa ya watumwa.
