id: JHN.4.11
reference: John 4:11
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ⸂ἡ γυνή⸃· Κύριε, οὔτε ἄντλημα ἔχεις καὶ τὸ φρέαρ ἐστὶν βαθύ· πόθεν οὖν ἔχεις τὸ ὕδωρ τὸ ζῶν;
base_translation:
  language: en
  yaml_path: translation/nt/john/004/011.yaml
  text: The woman said to him[a], “Lord, you have neither a bucket nor is the well deep[b]. So where do you get the living water?”
translation:
  language: sw
  text: Mwanamke akamwambia, “Bwana[a], huna chombo cha kutekea maji, na kisima ni kirefu. Basi, hayo maji yaliyo hai[b] unayapata wapi?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Mheshimiwa.” Neno la Kigiriki ni namna ya heshima ya kumwita mtu, lakini pia linaweza kumaanisha “Bwana.”
    reason: alternative_reading
  - marker: b
    text: Au “maji yanayotiririka,” yaani maji safi yanayotembea, tofauti na maji yaliyotuama. Maneno “maji yaliyo hai” pia yanadumisha maana ya ndani iliyokusudiwa katika kauli ya Yesu.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει αὐτῷ
  choice: akamwambia
  rationale: Ingawa Kigiriki kimetumia wakati wa sasa wa kihistoria, ‘akamwambia’ ni mtindo wa kawaida wa masimulizi ya Kiswahili na hudumisha mfululizo wa matukio.
- source_word: ἡ γυνή
  choice: mwanamke
  rationale: Katika muktadha huu neno hilo linamtaja mwanamke Msamaria, si mke.
- source_word: Κύριε
  choice: Bwana
  rationale: ‘Bwana’ ni namna ya heshima ya kumwita mtu na pia linaweza kuwa cheo ‘Bwana’; hivyo linadumisha uwezekano wa maana zote mbili katika muktadha.
- source_word: ἄντλημα
  choice: chombo cha kutekea maji
  rationale: Neno hilo linamaanisha kifaa cha kuchotea maji. Kauli hii ni wazi na ya asili kuliko kulibana kuwa ‘ndoo,’ kwa kuwa aina ya chombo haijatajwa.
- source_word: τὸ φρέαρ
  choice: kisima
  rationale: Katika tukio hili φρέαρ ni kisima ambacho maji huchotwa.
- source_word: βαθύ
  choice: kirefu
  rationale: Kwa Kiswahili kisima husemwa kuwa kirefu; tafsiri hii inatoa maana ya kina bila kuongeza ‘sana,’ ambalo halipo katika chanzo.
- source_word: πόθεν οὖν
  choice: Basi ... wapi
  rationale: ‘Basi’ linaonyesha hitimisho linalotokana na kutokuwa na chombo na urefu wa kisima, huku ‘wapi’ likiuliza chanzo.
- source_word: τὸ ὕδωρ τὸ ζῶν
  choice: hayo maji yaliyo hai
  rationale: 'Tafsiri hii inadumisha usemi wa Kigiriki na maana yake mbili: maji safi yanayotiririka katika matumizi ya kawaida na maana ya ndani inayojitokeza katika maneno ya Yesu.'
theological_decisions:
- issue: Maana ya Κύριε katika jinsi mwanamke anavyomwita Yesu
  choice: Bwana
  alternative: Mheshimiwa
  rationale: Katika hatua hii ya mazungumzo huenda ni namna ya heshima tu, si lazima ungamo kamili kuhusu utambulisho wa Yesu. ‘Bwana’ linaweza kufanya kazi kwa heshima na pia kubeba maana ya cheo, huku tanbihi ikihifadhi uwezekano wa ‘Mheshimiwa.’
- issue: Kudumisha maana mbili za ὕδωρ τὸ ζῶν
  choice: maji yaliyo hai
  alternative: maji yanayotiririka
  rationale: Usemi wa Kigiriki unaweza kumaanisha maji safi yanayotiririka, lakini simulizi pia lina maana ya ndani ya kitheolojia. ‘Maji yaliyo hai’ hayafuti mvutano huo; maana ya kawaida inaelezwa katika tanbihi.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ‘huna chombo ... na kisima ni kirefu’ unafuata mantiki ya Kigiriki: mwanamke anataja vikwazo viwili—Yesu hana kifaa cha kuchotea, na kisima kina kina kikubwa—bila kugeuza sentensi kuwa kana kwamba kisima si kirefu.'
