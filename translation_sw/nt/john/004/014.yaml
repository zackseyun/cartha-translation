  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὃς δ’ ἂν πίῃ ἐκ τοῦ ὕδατος οὗ ἐγὼ δώσω αὐτῷ, οὐ μὴ ⸀διψήσει εἰς τὸν αἰῶνα, ἀλλὰ τὸ ὕδωρ ὃ δώσω αὐτῷ γενήσεται ἐν αὐτῷ πηγὴ ὕδατος ἁλλομένου εἰς ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/014.yaml
  text: But whoever drinks from the water that I will give him will never thirst forever; rather, the water that I will give him will become in him a spring of water welling up to eternal life.
translation:
  language: sw
  text: Lakini yeyote atakayekunywa maji nitakayompa hatakuwa na kiu kamwe; badala yake, maji nitakayompa yatakuwa chemchemi ndani yake ya maji yanayobubujika hadi uzima wa milele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ μὴ διψήσει εἰς τὸν αἰῶνα
  choice: hataona kiu kamwe
  rationale: Muundo wa Kigiriki unatoa ukanushi wenye mkazo pamoja na maana ya kudumu; Kiswahili cha kawaida huwasilisha hilo kwa asili kwa “hataona kiu kamwe.”
- source_word: πηγὴ ὕδατος
  choice: chemchemi ya maji
  rationale: “Chemchemi” huonyesha chanzo cha maji kinachotoka ndani, kulingana na picha ya πηγή.
- source_word: ἁλλομένου
  choice: yanayobubujika
  rationale: Kitenzi kinaonyesha maji yanayoruka au kuchuruzika kwa nguvu; “kububujika” ni picha ya asili na wazi katika Kiswahili.
- source_word: εἰς ζωὴν αἰώνιον
  choice: kuleta uzima wa milele
  rationale: “Kuleta” huhifadhi mwelekeo au matokeo yanayoonyeshwa na εἰς bila kulazimisha kwamba chemchemi yenyewe ni uzima wa milele.
theological_decisions:
- issue: Uhusiano wa maji yanayobubujika na uzima wa milele
  choice: kuleta uzima wa milele
  alternative: hadi uzima wa milele
  rationale: Kigiriki εἰς kinaweza kueleza mwelekeo au matokeo. “Kuleta” ni Kiswahili cha asili kinachohifadhi uhusiano huo bila kuufafanua kupita kiasi.
- issue: Nguvu ya ahadi ya kutokuwa na kiu
  choice: hataona kiu kamwe
  alternative: hataona kiu milele
  rationale: “Kamwe” huwasilisha ukanushi mkali wa οὐ μή na wazo la εἰς τὸν αἰῶνα kwa Kiswahili sanifu na cha kawaida.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa urahisi. Taswira ya maji, chemchemi, na kububujika imehifadhiwa; sentensi imeundwa kwa mtiririko wa kawaida bila kuondoa mkazo wa ahadi.
