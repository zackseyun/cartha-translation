base_translation:
  language: en
  yaml_path: translation/nt/john/004/020.yaml
  text: Our fathers worshiped on this mountain[b][a], and you say that in Jerusalem is the place where one must worship.
translation:
  language: sw
  text: Baba zetu waliabudu juu ya mlima huu,[a] lakini ninyi mnasema kwamba Yerusalemu ndilo mahali ambapo ni lazima kuabudu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Mababu zetu waliabudu juu ya mlima huu.”
    reason: lexical_alternative
  - marker: b
    text: Au “mahali ambapo watu wanapaswa kuabudu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πατέρες ἡμῶν
  choice: Baba zetu
  rationale: Inahifadhi nahau ya Kigiriki na dai la ukoo wa pamoja; hapa “baba” linawahusu pia waliotangulia katika historia ya jamii.
- source_word: ἐν τῷ ὄρει τούτῳ
  choice: juu ya mlima huu
  rationale: Ni usemi wa kawaida wa Kiswahili kwa mahali pa ibada palipo kwenye mlima, bila kubadili maana ya mahali.
- source_word: προσεκύνησαν
  choice: waliabudu
  rationale: Katika mjadala huu kuhusu mahali sahihi pa ibada, maana ya kidini ya προσκυνέω ndiyo inayotawala.
- source_word: καὶ ὑμεῖς λέγετε
  choice: lakini ninyi mnasema
  rationale: Ingawa καὶ kwa kawaida ni “na,” muktadha unaonyesha ulinganisho wenye utofauti. “Lakini” huwasilisha uhusiano huo kwa Kiswahili cha kawaida, huku “ninyi” ikihifadhi msisitizo wa kiwakilishi cha Kigiriki.
- source_word: ἐν Ἱεροσολύμοις
  choice: ni Yerusalemu
  rationale: Katika muundo wa Kiswahili “mahali ... ni Yerusalemu,” kiunganishi hiki ni cha kawaida na kinaonyesha eneo linalodaiwa kuwa mahali pa lazima pa ibada.
- source_word: ὁ τόπος ὅπου προσκυνεῖν δεῖ
  choice: mahali ambapo watu wanapaswa kuabudu
  rationale: Inahifadhi madai ya jumla kuhusu wajibu au ulazima wa kuabudu mahali fulani, kwa lugha ya kawaida isiyomlenga mtu mmoja.
theological_decisions:
- issue: Iwapo kutaja wazi Wasamaria na Wayahudi katika utofauti wa kauli
  choice: Utofauti umeachwa katika “Baba zetu ... lakini ninyi mnasema ...”
  alternative: “Baba zetu Wasamaria ... lakini ninyi Wayahudi mnasema ...”
  rationale: Aya yenyewe haitaji makundi hayo kwa majina; muktadha na viwakilishi vinatosha, hivyo tafsiri haiongezi utambulisho usiotamkwa.
- issue: Jinsi ya kuwasilisha ulazima usiomlenga mtu maalumu katika προσκυνεῖν δεῖ
  choice: “ambapo watu wanapaswa kuabudu”
  alternative: “ambapo ni lazima kuabudu”
  rationale: Muundo uliochaguliwa ni wa kawaida katika Kiswahili na unaendeleza madai ya jumla kuhusu mahali pa ibada bila kuugeuza kuwa amri kwa mtu mmoja.
- issue: Kiwango cha ulazima kinachoonyeshwa na δεῖ
  choice: “wanapaswa” katika matini, huku “ni lazima” ikitolewa katika tanbihi
  alternative: “ni lazima” katika matini
  rationale: “Wanapaswa” ni ya kawaida na yenye heshima, lakini tanbihi inalinda uwezekano wa kusoma δεῖ kwa nguvu zaidi kama ulazima.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Baba zetu” limehifadhiwa ili kudumisha nahau ya ukoo wa kijamii; “wazee wetu” limetolewa kama uwezekano wa maana katika tanbihi. Muundo hauelezi kwa majina Wasamaria au Wayahudi, kwa kuwa majina hayo hayamo katika aya.
