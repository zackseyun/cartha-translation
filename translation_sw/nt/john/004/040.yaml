  text: ὡς οὖν ἦλθον πρὸς αὐτὸν οἱ Σαμαρῖται, ἠρώτων αὐτὸν μεῖναι παρ’ αὐτοῖς· καὶ ἔμεινεν ἐκεῖ δύο ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/040.yaml
  text: So when the Samaritans came to him[a], they asked him to stay with them, and he stayed there two days.
translation:
  language: sw
  text: Basi Wasamaria walipomjia, walimwomba[a] akae kwao; naye akakaa huko siku mbili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: waliendelea kumwomba. Hali ya kitenzi cha Kigiriki inaweza kudokeza ombi lililorudiwa au lililoendelea.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς οὖν
  choice: Basi ... walipo-
  rationale: “Basi” linaonyesha uhusiano wa tukio hili na yaliyotangulia, huku muundo wa “walipo-” ukitoa maana ya wakati kwa Kiswahili cha kawaida.
- source_word: ἦλθον πρὸς αὐτὸν
  choice: walimjia
  rationale: Kitenzi “walimjia” kinaeleza kwa ufupi na kwa kawaida mwendo wao kuelekea kwake.
- source_word: οἱ Σαμαρῖται
  choice: Wasamaria
  rationale: Hili ni jina la kawaida la kundi hilo la watu katika Kiswahili.
- source_word: ἠρώτων
  choice: walimwomba
  rationale: Hutoa ombi lao kwa lugha ya kawaida. Kwa kuwa hali ya tendo lisilokamilika katika Kigiriki inaweza pia kudokeza ombi lililoendelea au kurudiwa, uwezekano huo umewekwa katika tanbihi.
- source_word: μεῖναι παρ’ αὐτοῖς
  choice: akae kwao
  rationale: “Akae kwao” ni usemi wa asili unaomaanisha kubaki mahali walipokuwa na kuwa pamoja nao.
- source_word: καὶ ἔμεινεν ἐκεῖ
  choice: naye akakaa huko
  rationale: Inawakilisha wazi tendo la Yesu kubaki mahali hapo na pia neno ἐκεῖ, “huko.”
- source_word: δύο ἡμέρας
  choice: siku mbili
  rationale: Ni tafsiri ya moja kwa moja ya muda aliokaa.
