base_translation:
  language: en
  yaml_path: translation/nt/john/004/021.yaml
  text: Jesus said to her[a], “Believe me, woman[c][b], an hour is coming when neither on this mountain nor in Jerusalem will you worship the Father.”
translation:
  language: sw
  text: Yesu akamwambia, “Niamini[a], mama[b], kwamba saa inakuja[c] ambapo hamtamwabudu Baba wala juu ya mlima huu wala katika Yerusalemu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nitumaini.” Kitenzi cha Kigiriki kinaweza kumaanisha kuamini anayosema mtu au kumtumaini mtu huyo.
    reason: lexical_alternative
  - marker: b
    text: “Mama” hapa ni namna ya heshima ya kumwita mwanamke, si neno la dharau.
    reason: cultural_note
  - marker: c
    text: Au, “ile saa inakuja.” Ingawa neno hilo halina kibainishi hapa katika Kigiriki, Yohana mara nyingi hutumia “saa” kumaanisha wakati muhimu katika mpango wa Mungu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πίστευέ μοι
  choice: Niamini
  rationale: Kauli ya amri pamoja na kiwakilishi cha nafsi inaomba akubali ukweli wa maneno ya Yesu. “Niamini” ni ya asili katika Kiswahili na pia hudumisha uhusiano wa kitenzi hiki na matumizi mengine ya πιστεύω katika Yohana.
- source_word: γύναι
  choice: mama
  rationale: Katika Kiswahili sanifu cha Afrika Mashariki, “mama” ni namna ya heshima ya kumwita mwanamke mtu mzima na huepuka ukali ambao “mwanamke” ungeweza kuwa nao katika mwito wa moja kwa moja.
- source_word: ἔρχεται ὥρα
  choice: saa inakuja
  rationale: “Saa” huhifadhi istilahi ya Yohana kuhusu wakati maalumu katika mpango wa Mungu; kutokuwapo kwa kibainishi katika Kigiriki kumehifadhiwa bila kuongeza “ile.”
- source_word: ἐν τῷ ὄρει τούτῳ
  choice: juu ya mlima huu
  rationale: Hii ni tafsiri ya kawaida ya Kiswahili kwa eneo lililo kwenye mlima na hudumisha rejeo la mahali patakatifu pa Wasamaria.
- source_word: ἐν Ἱεροσολύμοις
  choice: Yerusalemu
  rationale: Kwa kitenzi “kuabudu,” Kiswahili kinaweza kutaja mahali moja kwa moja bila kihusishi; jina la mji limetolewa kwa umbo la kawaida la Kiswahili.
- source_word: προσκυνήσετε
  choice: hamtamwabudu
  rationale: Wakati ujao na nafsi ya pili wingi vimehifadhiwa. “Kuabudu” ndilo neno la kawaida kwa tendo la kidini linalokusudiwa katika muktadha huu.
- source_word: τῷ πατρί
  choice: Baba
  rationale: Muktadha unamtaja Mungu kwa cheo cha uhusiano “Baba”; herufi kubwa inaonyesha matumizi hayo bila kuongeza maelezo.
- source_word: οὔτε ... οὔτε
  choice: wala ... wala
  rationale: Jozi ya Kiswahili “wala ... wala” huonyesha kwa kawaida na kwa uwazi ukanushaji wa sehemu zote mbili.
theological_decisions:
- issue: Namna Yesu anavyomwita mwanamke kwa γύναι
  choice: mama
  alternative: mwanamke
  rationale: “Mama” huwasilisha heshima iliyokuwamo katika mwito huu katika mazingira hayo, bila kuongeza ukaribu wa “mama yangu” au “mama mpendwa.” Tanbihi inaeleza kuwa si lugha ya dharau.
- issue: Dhamira ya ὥρα katika Yohana
  choice: saa
  alternative: wakati
  rationale: “Saa” huhifadhi msamiati unaojirudia katika Yohana na mvutano kuhusu hatua muhimu inayokuja katika mpango wa Mungu, badala ya kuifanya kuwa kauli ya jumla kuhusu wakati.
- issue: Maeneo ya ibada na Baba
  choice: hamtamwabudu Baba wala juu ya mlima huu wala Yerusalemu
  alternative: si juu ya mlima huu wala Yerusalemu mtakapomwabudu Baba
  rationale: Mpangilio huu ni wa asili katika Kiswahili na hudumisha ukanushaji wa maeneo yote mawili bila kudokeza kwamba ibada kwa Baba yenyewe itakoma.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imetumia “akamwambia” kwa simulizi linaloendelea, “mama” kama mwito wa heshima unaoeleweka kwa wasomaji wa kawaida, na “saa” ili kuhifadhi dhamira mahsusi ya Yohana. Alama zote za tanbihi [a], [b], na [c] zipo katika matini kuu.
