  text: The woman said to him[a], “Lord, I see that you are a prophet.”
translation:
  language: sw
  text: Mwanamke akamwambia, “Bwana[a], ninaona kwamba wewe ni nabii.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mheshimiwa.” Neno la Kigiriki κύριε linaweza kuwa namna ya heshima ya kumwita mtu, na pia linaweza kumaanisha “Bwana.”
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει
  choice: akamwambia
  rationale: Ingawa Kigiriki kinatumia wakati wa sasa wa kisimulizi, Kiswahili cha kawaida hutumia kiambishi cha mfululizo -ka- kuendeleza simulizi kwa ufasaha.
- source_word: αὐτῷ
  choice: -mw-
  rationale: Yambwa hii imeunganishwa ndani ya kitenzi “akamwambia,” ambayo kwa kawaida humaanisha kusema kwa mtu.
- source_word: ἡ γυνή
  choice: mwanamke
  rationale: Katika muktadha huu ni mwanamke Msamaria, si mke; “mwanamke” ni tafsiri ya kawaida na iliyo wazi.
- source_word: Κύριε
  choice: Bwana
  rationale: “Bwana” huhifadhi tafsiri ya kawaida ya κύριος, ingawa hapa pia inaweza kuwa namna ya heshima ya kumwita mtu; uwezekano huo umewekwa katika tanbihi.
- source_word: θεωρῶ
  choice: ninaona
  rationale: Hapa kitenzi kinaonyesha utambuzi unaotokana na yale Yesu aliyofunua; “ninaona” ni ya asili na hudumisha sitiari ya kuona.
- source_word: ὅτι
  choice: kwamba
  rationale: Huanzisha maudhui ya kile mwanamke anachotambua.
- source_word: προφήτης
  choice: nabii
  rationale: Kirai kisicho na kibainishi kinamtambua Yesu kuwa nabii, bila kulazimisha maana ya “yule Nabii.”
- source_word: σύ
  choice: wewe
  rationale: Kiwakilishi kilichotajwa wazi katika Kigiriki kina msisitizo; “wewe” hukihifadhi kwa njia ya kawaida katika Kiswahili.
theological_decisions:
- issue: Maana ya κύριος kama namna ya kumwita Yesu
  choice: Bwana
  alternative: Mheshimiwa
  rationale: Muktadha unaweza kuonyesha heshima bila kuwa bado ungamo kamili kuhusu utambulisho wa Yesu. “Bwana” huhifadhi istilahi kuu, huku tanbihi ikihifadhi uwezekano wa namna ya heshima.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “akamwambia” unaendeleza simulizi kwa kawaida; “ninaona” ni wazi kwa wasomaji wa kawaida huku ikihifadhi maana ya utambuzi.
