  text: ἐν γὰρ τούτῳ ὁ λόγος ⸀ἐστὶν ἀληθινὸς ὅτι Ἄλλος ἐστὶν ὁ σπείρων καὶ ἄλλος ὁ θερίζων·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/037.yaml
  text: 'For in this the saying is true: one is the one sowing[c][b][a], and another the one reaping.'
translation:
  language: sw
  text: 'Kwa maana katika jambo hili msemo[a] huu ni wa kweli: “Mmoja ndiye anayepanda, na mwingine ndiye anayevuna.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “neno”; au, “methali.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν γὰρ τούτῳ
  choice: Kwa maana katika jambo hili
  rationale: “Kwa maana” huhifadhi nguvu ya kiunganishi cha γάρ, na “katika jambo hili” huwasilisha rejeo la ἐν τούτῳ kwa Kiswahili cha kawaida bila kulifafanua kupita kiasi.
- source_word: ὁ λόγος
  choice: msemo huu
  rationale: Hapa λόγος ni kauli au msemo unaotambulika, si cheo cha kitheolojia “Neno.” “Msemo huu” ni ya asili katika muktadha huu na huutambulisha usemi unaofuata.
- source_word: ἀληθινός
  choice: ni wa kweli
  rationale: Kivumishi hiki kinaeleza uhalali wa msemo; “wa kweli” ni Kiswahili cha kawaida na sahihi.
- source_word: ὅτι
  choice: ':'
  rationale: ὅτι inaanzisha yaliyomo katika msemo; alama ya nukta mbili huyatanguliza kwa ufasaha katika Kiswahili.
- source_word: ἄλλος ... καὶ ἄλλος
  choice: Mmoja ... na mwingine
  rationale: Huhifadhi utofauti wa wahusika wawili bila kuwataja au kuwaongeza maelezo yasiyomo katika Kigiriki.
- source_word: ὁ σπείρων ... ὁ θερίζων
  choice: ndiye anayepanda ... ndiye anayevuna
  rationale: Miundo ya vitenzi vya wakati unaoendelea huhifadhi hali ya participio za Kigiriki na ulinganifu wake, huku “ndiye” ikionyesha kwa kawaida mkazo wa wahusika tofauti.
theological_decisions:
- issue: Utambulisho wa mpandaji na mvunaji
  choice: Kuacha msemo ukiwa wa jumla bila kuwataja wanaowakilishwa na mpandaji na mvunaji
  alternative: Kuwatambulisha katika tafsiri kuwa manabii, Yohana Mbatizaji, Yesu, au wanafunzi
  rationale: Kigiriki cha mstari huu hakitambulishi wahusika hao moja kwa moja. Muktadha unaweza kuongoza matumizi ya msemo, lakini tafsiri haipaswi kuingiza ufafanuzi wa kitheolojia ndani ya matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa msemo umewekwa kwa ulinganifu na urahisi wa kueleweka, bila kupoteza utofauti wa mpandaji na mvunaji.
