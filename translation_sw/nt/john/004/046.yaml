  text: Ἦλθεν οὖν ⸀πάλιν εἰς τὴν Κανὰ τῆς Γαλιλαίας, ὅπου ἐποίησεν τὸ ὕδωρ οἶνον. καὶ ἦν τις βασιλικὸς οὗ ὁ υἱὸς ἠσθένει ἐν Καφαρναούμ.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/046.yaml
  text: So he came again to Cana of Galilee[a], where he had made the water wine[b]. And there was a certain royal official whose son was sick in Capernaum.
translation:
  language: sw
  text: Basi akaja tena Kana ya Galilaya, ambako aliyafanya maji kuwa divai[a]. Kulikuwa na afisa fulani wa kifalme[b] ambaye mwanawe alikuwa mgonjwa huko Kapernaumu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa maelezo zaidi, “ambako aliyageuza maji kuwa divai.” Kigiriki kinasema kwa karibu zaidi, “ambako aliyafanya maji kuwa divai.”
    reason: lexical_alternative
  - marker: b
    text: Au “mtumishi wa mfalme” au “mtu wa nyumba ya mfalme.” Neno la Kigiriki βασιλικός humaanisha mtu aliyehusishwa na mfalme, nyumba ya kifalme, au utumishi wa kifalme.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Basi
  rationale: Kiunganishi hiki kinaendeleza simulizi na kuhusianisha kuja kwake na muktadha uliotangulia bila kulazimisha maana kali ya hitimisho.
- source_word: πάλιν
  choice: tena
  rationale: Neno la kawaida na la moja kwa moja linaloonyesha kurudi kwake mahali hapo.
- source_word: Κανὰ τῆς Γαλιλαίας
  choice: Kana ya Galilaya
  rationale: Huhifadhi jina la mahali na uhusiano wake na eneo la Galilaya kwa Kiswahili cha kawaida.
- source_word: ὅπου
  choice: mahali
  rationale: Hutambulisha kwa uwazi eneo ambako tukio la awali lilitokea; katika sentensi hii ‘mahali’ ni ya asili zaidi kuliko kurudia ‘ambapo’ baada ya jina la mahali.
- source_word: ἐποίησεν τὸ ὕδωρ οἶνον
  choice: alipokuwa ameyafanya maji kuwa divai
  rationale: Hufuata kwa karibu muundo wa Kigiriki, ‘aliyafanya maji kuwa divai,’ huku umbo la wakati likionyesha kwamba tukio hilo lilikuwa limetokea kabla ya kurudi huku.
- source_word: βασιλικός
  choice: afisa wa kifalme
  rationale: Huonyesha kuwa mtu huyo alikuwa na uhusiano na mfalme au utumishi wa kifalme bila kudai cheo chake mahususi au hadhi ya kiungwana.
- source_word: τις
  choice: fulani
  rationale: Huhifadhi wazo la mtu mahususi lakini asiyetajwa jina.
- source_word: υἱός
  choice: mwanawe
  rationale: Kigiriki kinamtaja kwa jinsi maalumu kuwa mwana wa kiume, si mtoto kwa ujumla.
- source_word: ἠσθένει
  choice: alikuwa mgonjwa
  rationale: Katika muktadha huu kitenzi kinamaanisha kuugua kimwili; tafsiri hii ni wazi na ya kawaida.
- source_word: Καφαρναούμ
  choice: Kapernaumu
  rationale: Umbo la jina la mahali linalotumika kwa kawaida katika Biblia za Kiswahili.
theological_decisions:
- issue: Kutafsiri βασιλικός bila kudai kwa uhakika nafasi yake katika utawala wa Herode Antipa
  choice: afisa wa kifalme
  alternative: mtumishi wa mfalme; mtu wa nyumba ya mfalme; mtu wa cheo cha juu
  rationale: Aya inaonyesha uhusiano wake na mamlaka ya kifalme lakini haitaji cheo, kazi, wala hadhi yake kwa usahihi. ‘Afisa wa kifalme’ huhifadhi uhusiano huo bila kuongeza habari za kihistoria zisizotajwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wazi, wa heshima, na unaoeleweka kwa wasomaji wa kawaida. Majina yametolewa kwa maumbo yanayotambulika katika matumizi ya Biblia za Kiswahili. Alama za tanbihi zimewekwa kwenye maneno yanayohusika moja kwa moja.
