  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῇ· Πᾶς ὁ πίνων ἐκ τοῦ ὕδατος τούτου διψήσει πάλιν·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/013.yaml
  text: Jesus answered and said to her[a], “Everyone who drinks from this water will be thirsty again.”
translation:
  language: sw
  text: Yesu akamjibu na kumwambia, “Kila mtu anayekunywa maji haya ataona kiu tena.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: akamjibu
  rationale: Kitenzi hiki cha masimulizi kinaonyesha kwamba Yesu alitoa jibu; muundo wa -ka- unaendeleza simulizi kwa Kiswahili cha kawaida.
- source_word: εἶπεν
  choice: na kumwambia
  rationale: Imetafsiriwa kando ili kuhifadhi muundo wa vitenzi viwili ἀπεκρίθη ... καὶ εἶπεν, ingawa Kiswahili mara nyingi kingeweza kuufupisha kuwa ‘akamjibu’ pekee.
- source_word: αὐτῇ
  choice: -m- katika ‘akamjibu’ na ‘kumwambia’
  rationale: Kiambishi cha yambwa kinaonyesha wazi kwamba Yesu alimjibu yule mwanamke.
- source_word: Πᾶς ὁ πίνων
  choice: Kila mtu anayekunywa
  rationale: Muundo huu unaonyesha maana ya jumla na endelevu ya kirai nomino chenye participio ya wakati wa sasa, bila kuifanya kauli ihusu wanaume pekee.
- source_word: ἐκ τοῦ ὕδατος τούτου
  choice: maji haya
  rationale: Kwa Kiswahili, ‘kunywa maji haya’ ni njia ya kawaida na sahihi ya kueleza kunywa kutoka katika maji yanayozungumziwa; kiashiria τούτου kimehifadhiwa kwa ‘haya’.
- source_word: διψήσει
  choice: ataona kiu
  rationale: Hii ni nahau ya kawaida ya Kiswahili inayomaanisha kuwa na kiu na inahifadhi nguvu ya wakati ujao.
- source_word: πάλιν
  choice: tena
  rationale: Neno hili linaonyesha kurudiwa kwa hali ya kuwa na kiu.
theological_decisions:
- issue: Kuhifadhi muundo wa vitenzi viwili ἀπεκρίθη ... καὶ εἶπεν
  choice: akamjibu na kumwambia
  alternative: akamjibu
  rationale: Chanzo kina vitenzi vyote viwili katika fomula ya masimulizi ya Yohana. Kuvihifadhi kunadumisha umbo la maandishi bila kubadili maana.
- issue: Maana ya jumla ya Πᾶς ὁ πίνων
  choice: Kila mtu anayekunywa
  alternative: Yeyote anayekunywa
  rationale: Ingawa umbo la Kigiriki ni la kiume kisarufi, maana yake inawahusu watu wote; tafsiri hii hudumisha upeo huo wa jumla.
- issue: Rejeo la maji
  choice: maji haya
  alternative: maji ya kisima hiki
  rationale: Chanzo kinasema tu ‘maji haya.’ Kutaja kisima kungeongeza ufafanuzi wa muktadha ambao haupo moja kwa moja katika aya hii.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Tafsiri inahifadhi fomula ya vitenzi viwili ya Kigiriki, huku ‘ataona kiu’ ikitoa usemi wa kawaida zaidi kuliko ‘atakuwa na kiu.’ Hakuna tanbihi iliyohitajika, kwa kuwa tofauti ya Kiingereza kati ya ‘will be thirsty’ na ‘will thirst’ haiundi tofauti ya maana inayohitaji kuonyeshwa kwa Kiswahili.
