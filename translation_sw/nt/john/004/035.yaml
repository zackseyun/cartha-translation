base_translation:
  language: en
  yaml_path: translation/nt/john/004/035.yaml
  text: 'Do you not say[a], ‘There are still four months, and then the harvest comes’? Look, I tell you: lift up your eyes and see the fields, that they are white for harvest already.'
translation:
  language: sw
  text: 'Je, ninyi hamsemi, “Bado kuna miezi minne, kisha mavuno yanafika”? Tazameni, ninawaambia: inueni macho yenu, myatazame mashamba, kwa kuwa ni meupe tayari kwa mavuno.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “yameiva tayari kwa mavuno.” Kigiriki huhifadhi taswira ya “meupe,” ikidokeza kwamba mashamba yako tayari kuvunwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ ὑμεῖς λέγετε
  choice: Je, ninyi hamsemi
  rationale: Muundo wa swali hasi umehifadhiwa kwa Kiswahili cha kawaida, huku kiwakilishi “ninyi” kikibeba msisitizo wa ὑμεῖς bila kuutia chumvi.
- source_word: Ἔτι τετράμηνός ἐστιν
  choice: Bado miezi minne
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaoonyesha kipindi kilichobaki kabla ya mavuno.
- source_word: ὁ θερισμὸς ἔρχεται
  choice: kisha mavuno yanafika
  rationale: Wakati wa sasa wa Kigiriki umehifadhiwa katika kauli ya kimethali yenye mtiririko wa asili kwa Kiswahili.
- source_word: ἰδοὺ
  choice: Tazama
  rationale: Neno hili linavuta usikivu kwa nguvu inayofaa bila kutumia lugha ya kizamani.
- source_word: ἐπάρατε τοὺς ὀφθαλμοὺς ὑμῶν
  choice: inueni macho yenu
  rationale: Taswira halisi ya kuinua macho imehifadhiwa badala ya kuirahisisha kuwa “angalieni.”
- source_word: θεάσασθε
  choice: myatazame
  rationale: Kitenzi hiki kinaonyesha kutazama kwa makusudi na kinaendana kwa kawaida na “mashamba.”
- source_word: τὰς χώρας
  choice: mashamba
  rationale: Katika muktadha wa mavuno, neno hili linaelekea kumaanisha maeneo yaliyolimwa, si nchi au maeneo kwa ujumla.
- source_word: λευκαί εἰσιν
  choice: ni meupe
  rationale: Tafsiri inahifadhi taswira ya rangi iliyo katika Kigiriki badala ya kuifasiri moja kwa moja kuwa yameiva.
- source_word: πρὸς θερισμόν
  choice: kwa mavuno
  rationale: Hii ni tafsiri fupi na ya asili inayohifadhi sitiari ya mavuno.
- source_word: ἤδη
  choice: tayari
  rationale: Neno hili limewekwa karibu na mwisho ili kusisitiza kwamba hali ya kuvunwa imefika sasa, kinyume na kusubiri miezi minne.
theological_decisions:
- issue: Kama kauli kuhusu mavuno ifasiriwe wazi kuwa inawahusu watu
  choice: Kuhifadhi taswira ya mashamba na mavuno bila kutaja watu moja kwa moja
  alternative: Kutafsiri kwa ufafanuzi kama “watu wako tayari kukusanywa”
  rationale: Katika muktadha, mavuno yana maana ya kisitiari kuhusu watu walio tayari kupokea ujumbe; hata hivyo, maneno ya Kigiriki yanaendeleza taswira ya kilimo. Tafsiri haiingizi ufafanuzi huo ndani ya mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Kauli ya moja kwa moja na taswira ya kilimo zimehifadhiwa; matumizi ya “myatazame” yanasisitiza uchunguzi wa makusudi.
