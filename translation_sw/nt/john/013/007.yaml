  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Ὃ ἐγὼ ποιῶ σὺ οὐκ οἶδας ἄρτι, γνώσῃ δὲ μετὰ ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/007.yaml
  text: Jesus answered and said to him[a], “What I am doing you do not know now[b], but you will understand after these things.”
translation:
  language: sw
  text: Yesu akamjibu, akamwambia, “Ninalofanya hulijui sasa[a], lakini baada ya mambo haya utaelewa[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki kinatumia hapa kitenzi kinachomaanisha kwa kawaida “kujua,” na baadaye kitenzi kingine kinachoweza kumaanisha “kuja kujua” au “kuelewa.”
    reason: lexical_alternative
  - marker: b
    text: “Baada ya mambo haya” huenda ikarejelea mambo yanayofuata katika tukio hili au, kwa upana zaidi, matukio ya baadaye ambayo yangefafanua tendo la Yesu.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: akamjibu
  rationale: Ni kitenzi cha kawaida cha kusimulia jibu; umbo la mfululizo linafaa katika simulizi la Kiswahili.
- source_word: εἶπεν αὐτῷ
  choice: akamwambia
  rationale: Linahifadhi kitenzi cha pili cha Kigiriki pamoja na mtendewa ‘yeye,’ bila kutumia muundo mgumu wa ‘akajibu na kusema kwake.’
- source_word: Ὃ ἐγὼ ποιῶ
  choice: Ninalofanya
  rationale: Muundo huu wa asili wa Kiswahili unaonyesha tendo ambalo Yesu alikuwa akifanya wakati huo.
- source_word: οὐκ οἶδας ἄρτι
  choice: hulijui sasa
  rationale: ‘Kujua’ linafuata maana ya kawaida ya οἶδα na kuhifadhi tofauti ya kileksia na γινώσκω, huku kiambishi ‘-li-’ kikirejelea tendo linalofanywa.
- source_word: γνώσῃ
  choice: utaelewa
  rationale: Katika muktadha huu γινώσκω huhusu kufahamu maana ya tendo baadaye; ‘utaelewa’ ni ya kawaida na inatofautisha kitenzi hiki na ‘hulijui.’
- source_word: δὲ
  choice: lakini
  rationale: Linaonyesha tofauti kati ya kutokujua kwa sasa na kuelewa baadaye.
- source_word: μετὰ ταῦτα
  choice: baada ya mambo haya
  rationale: Linahifadhi usemi mpana wa Kigiriki bila kuamua kwamba unamaanisha tu baada ya kuoshwa miguu au matukio maalumu ya baadaye.
theological_decisions:
- issue: Wigo wa wakati wa ahadi ya kuelewa baadaye
  choice: baada ya mambo haya
  alternative: baadaye; baada ya tukio hili; baada ya ufufuo
  rationale: Kigiriki hakibainishi ikiwa ni baada ya maelezo ya kuoshwa miguu, baada ya msalaba na ufufuo, au wakati wa ufahamu wa baadaye kupitia Roho. Tafsiri inaacha uwezekano huo wazi.
- issue: Tofauti kati ya οἶδας na γνώσῃ
  choice: hulijui … utaelewa
  alternative: huelewi … utaelewa; hulijui … utalijua
  rationale: Uchaguzi huu unahifadhi tofauti ya vitenzi vya chanzo na pia unaonyesha mwendo kutoka kutokujua maana ya tendo hadi kuifahamu, bila kudai tofauti kali ya kiteolojia kati ya vitenzi hivyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Akamjibu, akamwambia’ linahifadhi vitenzi vyote viwili vya chanzo kwa mtiririko wa kawaida wa simulizi. Alama zote za tanbihi zimewekwa baada ya vifungu vinavyohusika.
