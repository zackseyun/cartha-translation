  text: τεκνία, ἔτι μικρὸν μεθ’ ὑμῶν εἰμι· ζητήσετέ με, καὶ καθὼς εἶπον τοῖς Ἰουδαίοις ὅτι Ὅπου ⸂ἐγὼ ὑπάγω⸃ ὑμεῖς οὐ δύνασθε ἐλθεῖν, καὶ ὑμῖν λέγω ἄρτι.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/033.yaml
  text: Little children[a], I am with you a little while longer. You will seek me, and just as I said to the Jews, ‘Where I am going[b], you are not able to come,’ so now I also say to you.
translation:
  language: sw
  text: “Watoto wadogo, bado niko pamoja nanyi kwa muda mfupi. Mtanitafuta; na kama vile nilivyowaambia Wayahudi[a], ‘Ninakoenda, ninyi hamwezi kuja[b],’ na sasa ninawaambia ninyi pia.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “viongozi wa Kiyahudi,” kwa kuwa katika Injili ya Yohana neno “Wayahudi” wakati mwingine linaweza kuwarejelea hasa viongozi wa Yudea, kulingana na muktadha.
    reason: alternative_reading
  - marker: b
    text: Kwa karibu zaidi, “hamna uwezo wa kuja.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τεκνία
  choice: Watoto wadogo
  rationale: Ni wingi wa neno la udogo linalotumiwa kama mwito wa upendo. “Watoto wadogo” huhifadhi picha ya kifamilia na nguvu ya udogo bila kuongeza kimatini “wangu” au “wapendwa.”
- source_word: ἔτι μικρόν
  choice: bado ... kwa muda mfupi
  rationale: Muundo huu unaonyesha muda mfupi uliobaki. Kiswahili hiki ni cha kawaida na huhifadhi maana ya “kwa muda mfupi zaidi.”
- source_word: μεθ’ ὑμῶν εἰμι
  choice: niko pamoja nanyi
  rationale: Hutoa kwa uwazi kauli ya wakati uliopo kuhusu kuwapo kwa Yesu pamoja nao.
- source_word: ζητήσετέ με
  choice: Mtanitafuta
  rationale: Kitenzi ζητέω hapa kinaweza kumaanisha kutafuta au kujaribu kumpata mtu; “mtanitafuta” ni cha asili na hudumisha uzito wa kauli.
- source_word: καθὼς εἶπον τοῖς Ἰουδαίοις
  choice: kama vile nilivyowaambia Wayahudi
  rationale: Huhifadhi ulinganisho wa καθώς na maana ya moja kwa moja ya Ἰουδαίοις bila kuibana kimbele kuwa viongozi pekee.
- source_word: Ὅπου ἐγὼ ὑπάγω
  choice: Ninakoenda
  rationale: ὑπάγω huonyesha kwenda au kuondoka; “ninakoenda” ni ya kawaida na haitoi ufafanuzi usio wa lazima kuhusu mahali au namna ya kuondoka.
- source_word: οὐ δύνασθε ἐλθεῖν
  choice: ninyi hamna uwezo wa kuja
  rationale: Huhifadhi wazi wazo la δύνασθε, yaani uwezo, pamoja na msisitizo wa kiwakilishi ὑμεῖς. Kiswahili kifupi “hamwezi kuja” pia kinawezekana.
- source_word: καὶ ὑμῖν λέγω ἄρτι
  choice: ndivyo ninavyowaambia ninyi pia sasa
  rationale: Huweka wazi uhusiano na kauli iliyotangulia, matumizi yake sasa kwa wanafunzi, na msisitizo wa ὑμῖν.
theological_decisions:
- issue: Maana ya Ἰουδαίοις katika muktadha wa Injili ya Yohana
  choice: Wayahudi
  alternative: viongozi wa Kiyahudi
  rationale: Neno la Kigiriki kwa kawaida ni “Wayahudi.” Ingawa katika Yohana wakati mwingine linaweza kuwalenga hasa viongozi au mamlaka za Uyahudi, mstari huu wenyewe haulazimishi ufinyu huo. Tafsiri kuu huhifadhi upana wa neno, huku uwezekano wa kimuktadha ukiwekwa katika tanbihi.
- issue: Aina ya kutoweza kuja mahali Yesu anakokwenda
  choice: hamna uwezo wa kuja
  alternative: hamwezi kuja
  rationale: Tafsiri hiyo hudumisha kutoweza kunakosemwa na δύνασθε bila kuamua kimbele kama kizuizi hicho ni cha muda, kiroho, au cha aina nyingine; muktadha mpana ndio unaoeleza zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye heshima lakini kinachoeleweka kwa wasomaji wa kawaida. Mpangilio umefanywa kuwa wa kawaida katika Kiswahili huku urudiaji, ulinganisho, na msisitizo wa viwakilishi vya Kigiriki vikihifadhiwa.
