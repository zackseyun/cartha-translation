lexical_decisions:
- source_word: εἰ
  choice: Kama
  rationale: Inaingiza kishazi cha sharti na kuhifadhi muundo wa moja kwa moja wa Kigiriki.
- source_word: ταῦτα
  choice: mambo haya
  rationale: Kiwakilishi kionyeshi cha wingi kisicho na jinsia kinarejelea mfano na mafundisho ya Yesu yaliyotangulia; “mambo haya” huhifadhi wingi huo kwa Kiswahili cha kawaida.
- source_word: οἴδατε
  choice: mnajua
  rationale: Kitenzi hiki kwa msingi huonyesha kujua au kufahamu; “mnajua” ni tafsiri ya moja kwa moja bila kukifanya kiwe “mmeelewa” pekee.
- source_word: μακάριοί ἐστε
  choice: mmebarikiwa
  rationale: Hueleza hali ya kuwa wenye baraka au kibali, si hisia ya furaha tu. “Mmebarikiwa” ni ya asili katika Kiswahili na huhifadhi uzito wa kibiblia wa neno hilo.
- source_word: ἐὰν
  choice: ikiwa
  rationale: Pamoja na kitenzi cha hali tegemezi, huonyesha sharti linaloweza kutimizwa; “ikiwa” hutofautisha kishazi hiki kwa mtiririko wa asili baada ya “kama” ya kwanza.
- source_word: ποιῆτε
  choice: mnayatenda
  rationale: Katika muktadha huu ni kuyaweka mafundisho hayo katika matendo; “kutenda” ni fasaha na hudumisha msisitizo wa utekelezaji.
- source_word: αὐτά
  choice: -ya- katika “mnayatenda”
  rationale: Kiambishi cha yambwa cha ngeli ya “mambo” kinarejelea kwa uwazi mambo yaliyotajwa bila kurudia kirai kizima.
theological_decisions:
- issue: Maana ya μακάριοι katika muktadha wa uanafunzi
  choice: mmebarikiwa
  alternative: mna furaha / mna bahati
  rationale: “Mmebarikiwa” huhifadhi maana ya hali ya kibali na ustawi unaohusishwa na Mungu, bila kuipunguza kuwa hisia ya furaha au bahati nasibu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa masharti mawili na wingi wa “mambo haya” umehifadhiwa.
