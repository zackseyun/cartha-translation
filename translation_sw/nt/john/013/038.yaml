  text: ⸀ἀποκρίνεται Ἰησοῦς· Τὴν ψυχήν σου ὑπὲρ ἐμοῦ θήσεις; ἀμὴν ἀμὴν λέγω σοι, οὐ μὴ ἀλέκτωρ φωνήσῃ ἕως οὗ ⸀ἀρνήσῃ με τρίς.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/038.yaml
  text: Jesus answered[a], “Will you lay down your life for me? Truly, truly, I say to you, the rooster will certainly not crow until you have denied me three times.”
translation:
  language: sw
  text: Yesu akamjibu, “Je, utatoa uhai wako kwa ajili yangu? Amin, amin, ninakuambia, jogoo hatawika kabla hujanikana mara tatu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκρίνεται
  choice: akamjibu
  rationale: Kauli ya wakati uliopo ya kihistoria imetafsiriwa kwa wakati uliopita wa masimulizi, ambao ni wa kawaida katika Kiswahili; kiambishi -m- kinaonyesha kwamba Yesu anamjibu Petro.
- source_word: ψυχήν
  choice: uhai wako
  rationale: Katika msemo τίθημι τὴν ψυχήν, neno hili linamaanisha kutoa uhai, yaani kufa kwa ajili ya mwingine, wala si hasa nafsi isiyo ya mwili.
- source_word: ὑπὲρ ἐμοῦ
  choice: kwa ajili yangu
  rationale: Huwasilisha kwa kawaida maana ya kutenda kwa manufaa au kwa niaba ya Yesu.
- source_word: θήσεις
  choice: utatoa
  rationale: Pamoja na ψυχή, kitenzi τίθημι ni nahau ya kutoa uhai. 'Utatoa' ni Kiswahili cha kawaida na hudumisha maana ya kujitoa mhanga.
- source_word: ἀμὴν ἀμὴν
  choice: Amin, amin
  rationale: Huhifadhi moja kwa moja fomula nzito na ya kurudiwa iliyo ya pekee katika kauli za Yesu kwenye Yohana, huku neno 'Amin' likieleweka katika matumizi ya Biblia ya Kiswahili.
- source_word: οὐ μὴ
  choice: hatawika kamwe
  rationale: Neno 'kamwe' linahifadhi msisitizo mkali wa ukanushaji wa οὐ μή.
- source_word: ἀλέκτωρ
  choice: jogoo
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa rooster.
- source_word: φωνήσῃ
  choice: atawika
  rationale: Kitenzi 'kuwika' ndicho kinachotumiwa kwa kawaida kuhusu sauti ya jogoo.
- source_word: ἕως οὗ
  choice: mpaka
  rationale: Huonyesha mpaka wa wakati ambapo kuwika hakutatokea.
- source_word: ἀρνήσῃ με
  choice: utakapokuwa umenikana
  rationale: Muundo huu unaonyesha kwamba kumkana Yesu mara tatu kutakuwa kumetimia kabla ya jogoo kuwika; 'kunikana' huhifadhi maana ya moja kwa moja ya kukataa uhusiano naye.
- source_word: τρίς
  choice: mara tatu
  rationale: Ni usemi wa kawaida na wazi katika Kiswahili cha sasa.
theological_decisions:
- issue: Maana ya ψυχή katika muktadha wa kujitoa kwa ajili ya Yesu
  choice: uhai
  alternative: nafsi
  rationale: Muktadha unahusu dai la Petro kwamba yuko tayari kufa kwa ajili ya Yesu. 'Uhai' huonyesha dhabihu hiyo halisi bila kulazimisha maana finyu ya kianthropolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Swali la Yesu limehifadhiwa kama swali la balagha. Marudio ya 'Amin, amin' na ukanushaji wenye msisitizo yamedumishwa.
