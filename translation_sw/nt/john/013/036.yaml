  text: Λέγει αὐτῷ Σίμων Πέτρος· Κύριε, ποῦ ὑπάγεις; ⸀ἀπεκρίθη Ἰησοῦς· Ὅπου ὑπάγω οὐ δύνασαί μοι νῦν ἀκολουθῆσαι, ⸂ἀκολουθήσεις δὲ ὕστερον⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/036.yaml
  text: Simon Peter says to him[a], “Lord, where are you going?” Jesus answered, “Where I am going, you are not able to follow me now[b], but you will follow later.”
translation:
  language: sw
  text: Simoni Petro akamwambia, “Bwana, unakwenda wapi?” Yesu akamjibu, “Ninakoenda, huna uwezo wa kunifuata sasa[a], lakini utanifuata baadaye[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “huwezi kunifuata sasa.” Kigiriki kinatumia wazi kitenzi kinachoonyesha uwezo.
    reason: lexical_alternative
  - marker: b
    text: Maneno “utanifuata baadaye” yanaweza kudokeza kumfuata Yesu baadaye katika mateso au kifo; lakini maneno yenyewe hayafafanui namna ambavyo angefanya hivyo.
    reason: cross_reference
lexical_decisions:
- source_word: Λέγει αὐτῷ
  choice: akamwambia
  rationale: Muundo huu ni wa kawaida na wenye hadhi katika usimulizi wa Kiswahili. Wakati uliopo wa kihistoria wa Kigiriki umeelezwa kwa wakati wa usimulizi wa Kiswahili bila kubadili tendo la kusema kuwa kitenzi kingine.
- source_word: Κύριε
  choice: Bwana
  rationale: “Bwana” ni tafsiri ya kawaida ya κύριος kama namna ya heshima na pia inadumisha uzito wa cheo hicho katika Injili ya Yohana.
- source_word: ποῦ ὑπάγεις
  choice: unakwenda wapi
  rationale: Ni Kiswahili cha sasa na cha kawaida kinachowasilisha maana ya kwenda bila kutaja mahali au namna ya kuondoka ambayo Kigiriki hakufafanui.
- source_word: ἀπεκρίθη Ἰησοῦς
  choice: Yesu akamjibu
  rationale: Ni usemi wa kawaida wa mazungumzo katika usimulizi wa Kiswahili na unahifadhi mhusika anayejibu.
- source_word: Ὅπου ὑπάγω
  choice: Ninapokwenda
  rationale: Inadumisha uhusiano wa kitenzi kilekile na swali la Petro, huku ikisomeka kwa ufasaha katika Kiswahili.
- source_word: οὐ δύνασαί μοι νῦν ἀκολουθῆσαι
  choice: huna uwezo wa kunifuata sasa
  rationale: Inahifadhi wazi dhana ya uwezo iliyo katika δύναμαι, pamoja na “kunifuata” na kipengele cha wakati “sasa.”
- source_word: ἀκολουθήσεις δὲ ὕστερον
  choice: lakini utanifuata baadaye
  rationale: Inahifadhi wakati ujao, utofautishaji wa δέ na ὕστερον bila kufafanua ni kwa njia gani Petro atamfuata.
theological_decisions:
- issue: Maana ya Petro kumfuata Yesu baadaye
  choice: 'Kauli imeachwa wazi: “utanifuata baadaye.”'
  alternative: Kuitaja moja kwa moja kuwa unabii wa kufa kwa Petro, kurejeshwa kwake katika uanafunzi, au kumfuata Yesu katika utukufu wa mwisho.
  rationale: Kigiriki hakielezi namna ya kufuata huko. Tafsiri inadumisha uwezekano wa dokezo la mateso au kifo bila kulifanya kuwa maana pekee ya maneno hayo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa urahisi. Muundo wa masimulizi umetumika kwa ufasaha, huku marudio ya wazo la “kwenda” na “kufuata” yakihifadhiwa.
