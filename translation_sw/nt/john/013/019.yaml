base_translation:
  language: en
  yaml_path: translation/nt/john/013/019.yaml
  text: From now on I am telling you before it happens[a], so that when it does happen, you may believe that I am he.
translation:
  language: sw
  text: Kuanzia sasa ninawaambia kabla jambo hilo halijatokea, ili litakapotokea mpate kuamini kwamba mimi ndiye.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata muundo wa Kigiriki kwa karibu zaidi, “mimi ni.” Usemi huu wa Kigiriki hauna neno linalokamilisha maana yake waziwazi, na huenda pia ukawa mwangwi wa jinsi Mungu anavyojitambulisha katika Isaya na sehemu nyingine za Yohana.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπ’ ἄρτι
  choice: Tangu sasa
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha kipindi kinachoanzia wakati huu na kuendelea.
- source_word: λέγω ὑμῖν
  choice: ninawaambia
  rationale: Wakati wa sasa na walengwa wa wingi vinaonyeshwa kwa kawaida na kwa uwazi katika Kiswahili.
- source_word: πρὸ τοῦ γενέσθαι
  choice: kabla jambo hilo halijatokea
  rationale: Muundo huu unaonyesha wazi kwamba kusema kunatangulia tukio. Nomino “jambo hilo” imetumiwa kwa sababu mfumo wa ngeli za Kiswahili huhitaji rejeleo la kawaida kwa kile kitakachotokea, bila kufafanua tukio lenyewe zaidi ya Kigiriki.
- source_word: ἵνα
  choice: ili
  rationale: “Ili” huonyesha kusudi kwa njia ya kawaida na sahihi katika Kiswahili.
- source_word: πιστεύσητε
  choice: mpate kuamini
  rationale: Huhifadhi wazo la kusudi au matokeo yaliyokusudiwa na kudumisha lugha ya kuamini bila kuongeza maana ya kuanza kuamini.
- source_word: ὅταν γένηται
  choice: litakapotokea
  rationale: Huwasilisha tukio la wakati ujao linalotarajiwa, huku kiambishi cha ngeli kikirejelea “jambo hilo.”
- source_word: ὅτι ἐγώ εἰμι
  choice: kwamba mimi ndiye
  rationale: Ni Kiswahili cha kawaida chenye maana ya kujitambulisha, bila kuongeza jina au cheo kisichopo katika Kigiriki. Tanbihi huhifadhi muundo wa karibu zaidi na uwezekano wa uzito wa kiteolojia.
theological_decisions:
- issue: Jinsi ya kutafsiri usemi kamili ἐγώ εἰμι katika Yohana, ambao huenda ukawa mwangwi wa kujitambulisha kwa Mungu
  choice: kwamba mimi ndiye
  alternative: kwamba mimi ni
  rationale: “Mimi ndiye” inaeleweka kwa kawaida kama kujitambulisha, lakini haitaji wazi yeye ni nani. Kwa kuwa Kigiriki hakina neno linalokamilisha kiarifu, tanbihi inahifadhi tafsiri ya karibu zaidi na kutaja uwezekano wa mwangwi wa lugha ya Isaya na sehemu nyingine za Yohana, bila kuamua maana hiyo kwa lazima.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni rahisi kueleweka kwa wasomaji wa kawaida. “Jambo hilo” huwezesha upatanisho wa ngeli bila kueleza tukio kwa namna ambayo chanzo hakikufanya; “mimi ndiye” huhifadhi mvutano wa usemi usio na kiarifu kilichotajwa.
