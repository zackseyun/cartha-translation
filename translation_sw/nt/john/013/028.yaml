  text: But none of those reclining at the table knew why he said this to him[a].
translation:
  language: sw
  text: Lakini hakuna hata mmoja wa wale waliokuwa wameegemea mezani wakati wa kula aliyejua kwa nini alimwambia hivyo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa mtindo rasmi zaidi, “alimwambia hivyo kwa kusudi gani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: hivyo
  rationale: Kiwakilishi hiki hurejelea maneno yaliyotangulia; katika Kiswahili, ‘alimwambia hivyo’ ni usemi wa kawaida unaohifadhi rejeo hilo bila urudiaji mzito.
- source_word: δὲ
  choice: Lakini
  rationale: Kiunganishi hiki kinaonyesha utofautishaji mdogo na yaliyotangulia, hasa kutokuelewa kwa waliokuwa mezani.
- source_word: οὐδεὶς
  choice: hakuna hata mmoja
  rationale: Huwasilisha ukanushaji kamili kwa uwazi na kwa lugha ya kawaida.
- source_word: ἔγνω
  choice: aliyejua
  rationale: Kitenzi γινώσκω hapa kinaonyesha kwamba hakuna aliyefahamu sababu ya maneno hayo; ‘kujua’ huhifadhi upana wa maana ya chanzo.
- source_word: τῶν ἀνακειμένων
  choice: wa wale waliokuwa wameketi mezani
  rationale: Katika muktadha wa mlo wa kale, ἀνάκειμαι humaanisha kuegemea wakati wa kula. ‘Wameketi mezani’ ni Kiswahili cha sasa na cha kawaida kinachoeleza mazingira bila kuleta picha isiyo ya kawaida ya ‘kulala mezani.’
- source_word: πρὸς τί
  choice: kwa nini
  rationale: Kirai hiki huuliza kusudi au sababu. ‘Kwa nini’ ni tafsiri ya kawaida, huku maana rasmi zaidi ikibainishwa katika tanbihi.
- source_word: εἶπεν αὐτῷ
  choice: alimwambia hivyo
  rationale: Muundo huu unaonyesha kwa kawaida kwamba mtu mmoja alisema jambo hilo kwa mwingine; mhusika wa kiima na wa yambwa hubaki na utata uleule wa Kigiriki katika muktadha huu.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Wameketi mezani’ limetumiwa badala ya tafsiri halisi ya desturi ya kale ya kuegemea wakati wa kula, ili sentensi ieleweke kwa urahisi. Utata wa viwakilishi katika ‘alimwambia’ umehifadhiwa.
