id: JHN.13.1
reference: John 13:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Πρὸ δὲ τῆς ἑορτῆς τοῦ πάσχα εἰδὼς ὁ Ἰησοῦς ὅτι ⸀ἦλθεν αὐτοῦ ἡ ὥρα ἵνα μεταβῇ ἐκ τοῦ κόσμου τούτου πρὸς τὸν πατέρα ἀγαπήσας τοὺς ἰδίους τοὺς ἐν τῷ κόσμῳ εἰς τέλος ἠγάπησεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/001.yaml
  text: Before the Feast of the Passover[a], Jesus, knowing that his hour had come to depart from this world to the Father, having loved his own who were in the world[b], loved them to the end.
translation:
  language: sw
  text: Kabla ya Sikukuu ya Pasaka, Yesu, akijua kwamba saa yake ilikuwa imefika ya kuondoka katika ulimwengu huu na kwenda kwa Baba, akiwa amewapenda watu wake waliokuwa ulimwenguni, aliwapenda hadi mwisho.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliwapenda kikamilifu.” Kirai cha Kigiriki kinaweza kumaanisha kwamba aliendelea kuwapenda hadi wakati wa mwisho, na pia kwamba aliwapenda kwa ukamilifu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρὸ δὲ τῆς ἑορτῆς τοῦ πάσχα
  choice: Kabla ya Sikukuu ya Pasaka
  rationale: Πρό pamoja na hali ya umilikishi huonyesha wakati uliotangulia. δέ ni kiunganishi hafifu ambacho hakihitaji kutafsiriwa kwa neno tofauti hapa. “Sikukuu ya Pasaka” ni Kiswahili cha kawaida na huhifadhi maana ya ἑορτή.
- source_word: εἰδὼς ὁ Ἰησοῦς
  choice: Yesu alijua
  rationale: Kirai cha participio kinaonyesha ufahamu wa Yesu wakati huo. Muundo wa kitenzi kamili ni wa asili zaidi katika Kiswahili kuliko tafsiri ngumu ya moja kwa moja ya participio.
- source_word: ἦλθεν αὐτοῦ ἡ ὥρα
  choice: saa yake ilikuwa imefika
  rationale: Huhifadhi tamathali muhimu ya Yohana kuhusu wakati maalumu uliowekwa wa mateso, kuondoka na kutukuzwa kwa Yesu.
- source_word: ἵνα μεταβῇ ἐκ τοῦ κόσμου τούτου πρὸς τὸν πατέρα
  choice: ya kuondoka katika ulimwengu huu na kwenda kwa Baba
  rationale: “Kuondoka” huonyesha mpito wenye uzito bila kutaja kifo pekee, huku “kwenda kwa Baba” ikihifadhi mwisho wa mwendo unaoelezwa na πρὸς τὸν πατέρα.
- source_word: τοὺς ἰδίους τοὺς ἐν τῷ κόσμῳ
  choice: watu wake waliokuwa ulimwenguni
  rationale: “Watu wake” ni usemi wa asili unaohifadhi upana wa uhusiano wa τοὺς ἰδίους bila kuufupisha kwa “wanafunzi wake.”
- source_word: ἀγαπήσας
  choice: Kwa kuwa alikuwa amewapenda
  rationale: Huwasilisha upendo uliokuwapo tayari kama mazingira ya kauli kuu. “Kwa kuwa” hufanya uhusiano wa sentensi kuwa wazi katika Kiswahili bila kudai kwamba participio lazima iwe na maana ya kisababishi pekee.
- source_word: εἰς τέλος ἠγάπησεν αὐτούς
  choice: aliwapenda mpaka mwisho
  rationale: “Mpaka mwisho” huhifadhi maana ya wakati na pia huacha nafasi kwa wazo la upendo kamili; maana hiyo pana inaelezwa katika tanbihi.
theological_decisions:
- issue: Maana ya εἰς τέλος katika kauli ya kilele kuhusu upendo wa Yesu
  choice: mpaka mwisho
  alternative: kwa ukamilifu; kwa kiwango kamili kabisa
  rationale: Kirai cha Kigiriki kinaweza kuonyesha kudumu kwa upendo hadi wakati wa mwisho au ukamilifu wa upendo. Tafsiri kuu huhifadhi mwangwi wa wakati, na tanbihi huhifadhi maana ya kiwango bila kutatua kimya kimya utata huo.
- issue: Walengwa wa τοὺς ἰδίους
  choice: watu wake
  alternative: wanafunzi wake
  rationale: Muktadha wa karibu unawahusu wanafunzi, lakini Kigiriki ni kipana zaidi. “Watu wake” huepuka kuifanya rejea kuwa finyu kuliko matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Sentensi imegawanywa mara mbili ili kuepuka mlolongo mzito wa vishazi huku ikihifadhi mtiririko wa mawazo ya Kigiriki. Alama ya tanbihi [a] imewekwa baada ya kirai kinachofafanuliwa.
