base_translation:
  language: en
  yaml_path: translation/nt/john/013/008.yaml
  text: Peter said to him[a], “You will never wash my feet.” Jesus answered him, “If I do not wash you, you have no share with me.”
translation:
  language: sw
  text: Petro akamwambia, “Hutaniosha miguu yangu kamwe!” Yesu akamjibu, “Nisipokuosha, huna sehemu[a] pamoja nami.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “huna fungu pamoja nami.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ μὴ νίψῃς … εἰς τὸν αἰῶνα
  choice: Hutaniosha … kamwe
  rationale: Muungano wa οὐ μή na εἰς τὸν αἰῶνα unaonyesha kukataa kwa nguvu jambo la wakati ujao. ‘Hutaniosha … kamwe’ ni Kiswahili cha kawaida kinachohifadhi msisitizo huo.
- source_word: μου τοὺς πόδας
  choice: miguu
  rationale: Kitenzi cha Kiswahili tayari kina kiambishi cha nafsi ‘-ni-’ kinachoonyesha kuwa ni miguu ya Petro; hivyo ‘utaniosha miguu’ ni ya asili na haiongezi uzito usiohitajika wa ‘miguu yangu.’
- source_word: Ἐὰν μὴ νίψω σε
  choice: Nisipokuosha
  rationale: 'Muundo huu wa Kiswahili unawasilisha sharti hasi kwa ufupi na kwa kawaida: ‘ikiwa sitakuosha’ au ‘nisipokuosha.’'
- source_word: οὐκ ἔχεις μέρος
  choice: huna sehemu
  rationale: μέρος inaweza kumaanisha sehemu, fungu, au ushirika wa kushiriki. ‘Huna sehemu’ huhifadhi upana wa sitiari bila kufafanua kupita kiasi aina ya uhusiano unaokusudiwa.
- source_word: μετ’ ἐμοῦ
  choice: pamoja nami
  rationale: μετά pamoja na jenitivi huonyesha kuwa pamoja au kushirikiana na mtu. ‘Pamoja nami’ huhifadhi maana hiyo bila kuibadili kuwa ‘ndani yangu.’
- source_word: ἀπεκρίθη Ἰησοῦς αὐτῷ
  choice: Yesu akamjibu
  rationale: Huu ni usemi wa kawaida wa masimulizi katika Kiswahili unaowasilisha kwa usahihi kwamba Yesu alimjibu Petro.
theological_decisions:
- issue: Maana ya kuwa na μέρος pamoja na Yesu
  choice: huna sehemu pamoja nami
  alternative: huna fungu pamoja nami
  rationale: Kauli inaonyesha kuwa kuoshwa na Yesu ni lazima ili Petro awe na ushirika au ushiriki pamoja naye, lakini mstari wenyewe hauelezi utaratibu wake kuwa wa kisakramenti, wokovu, au mfano wa huduma pekee. Tafsiri inaacha mvutano huo wa kiteolojia wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Kamwe’ na alama ya mshangao zinaonyesha ukali wa kukataa kwa Petro; sentensi ya Yesu imeachwa yenye uzito na uwazi bila kuingiza ufafanuzi wa kimadhehebu.
