  yaml_path: translation/nt/john/013/030.yaml
  text: So after taking the piece of bread[a], he went out immediately[c][b]. And it was night.
translation:
  language: sw
  text: Basi, baada ya kupokea kipande cha mkate[a], huyo[b] akatoka mara moja. Na ilikuwa usiku.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “tonge” au “kipande.” Neno la Kigiriki ψωμίον humaanisha kipande kidogo cha mkate au chakula kilichotolewa wakati wa mlo.
    reason: lexical_alternative
  - marker: b
    text: Kigiriki kina “huyo”; kiwakilishi hiki kionyeshi kina msisitizo zaidi kuliko “yeye” tu, na huenda kinamwelekeza msomaji kwa Yuda.
    reason: lexical_alternative
  - marker: c
    text: Kauli “ilikuwa usiku” ni taarifa halisi ya wakati; huenda pia ikaleta mwangwi wa dhamira ya nuru na giza katika Injili ya Yohana.
    reason: cross_reference
lexical_decisions:
- source_word: λαβὼν
  choice: baada ya kupokea
  rationale: Kitenzi hiki hapa kinaonyesha tendo lililotangulia tendo kuu. Kwa kuwa kipande kilitolewa katika mlo, “kupokea” ni Kiswahili cha kawaida kinachofaa muktadha, huku kikihifadhi mpangilio wa matukio.
- source_word: οὖν
  choice: Basi
  rationale: Neno hili linaendeleza simulizi na kuonyesha matokeo ya yaliyotangulia; “basi” ni la asili na lenye uzito unaofaa.
- source_word: τὸ ψωμίον
  choice: kipande cha mkate
  rationale: ψωμίον ni kipande kidogo cha mkate au chakula. Tafsiri hii ni wazi na ya sasa bila kutumia neno lisilozoeleka.
- source_word: ἐκεῖνος
  choice: huyo
  rationale: Kiwakilishi kionyeshi kina mkazo kuliko kiwakilishi rahisi. “Huyo” kinamhusu Yuda kwa namna ya asili katika Kiswahili na kinahifadhi kiwango fulani cha msisitizo wa Kigiriki.
- source_word: ἐξῆλθεν
  choice: akatoka
  rationale: “Akatoka” kinahifadhi maana ya kwenda nje na pia kinaendeleza mfuatano wa simulizi kwa ufasaha.
- source_word: εὐθύς
  choice: mara moja
  rationale: Huwasilisha wazi kwamba alitoka bila kuchelewa.
- source_word: ἦν δὲ νύξ
  choice: Na ilikuwa usiku
  rationale: Tafsiri ya moja kwa moja inadumisha taarifa ya wakati na nguvu yake ya kifasihi bila kuingiza maana ya kiishara katika matini.
theological_decisions:
- issue: Uwezekano wa “usiku” kuwa na maana ya kiishara katika Injili ya Yohana
  choice: 'Kauli imetafsiriwa moja kwa moja kama taarifa ya wakati: “Na ilikuwa usiku.”'
  alternative: Kueleza wazi katika matini kwamba usiku unawakilisha giza la kiroho.
  rationale: Kigiriki kinatoa taarifa fupi ya wakati. Muktadha wa Yohana unaweza kuleta mwangwi wa dhamira ya nuru na giza, lakini tafsiri haipaswi kuufanya mwangwi huo kuwa maelezo ya wazi yasiyosemwa na matini.
- issue: Msisitizo wa ἐκεῖνος unaomhusu Yuda
  choice: Kutumia “huyo” badala ya “yeye” pekee.
  alternative: “yeye” au kuacha kiwakilishi cha pekee na kusema tu “akatoka.”
  rationale: “Huyo” kinahifadhi uonyeshaji na msisitizo wa ἐκεῖνος bila kuongeza hukumu ya kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Basi” na “akatoka” vinaendeleza simulizi kwa ufasaha; “huyo” kinadumisha msisitizo wa kiwakilishi kionyeshi bila kuwa kizito. Alama zote za tanbihi zimewekwa katika matini kuu.
