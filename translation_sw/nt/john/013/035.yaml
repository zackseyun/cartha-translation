  yaml_path: translation/nt/john/013/035.yaml
  text: By this everyone will know that you are my disciples[b][a], if you have love for one another.
translation:
  language: sw
  text: Kwa hili watu wote watajua kwamba ninyi ni wanafunzi wangu, ikiwa mna upendo ninyi kwa ninyi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana ya karibu, “miongoni mwenu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: Kwa jambo hili
  rationale: Kirai hiki kinaonyesha ishara au msingi ambao kwa huo wengine watawatambua wanafunzi; “Kwa jambo hili” ni Kiswahili cha kawaida kinachohifadhi maana ya kimatumizi bila kuifafanua kupita kiasi.
- source_word: γνώσονται
  choice: watajua
  rationale: Kitenzi cha wakati ujao hapa kina maana pana ya kujua au kutambua ukweli fulani; “watajua” ni cha moja kwa moja na cha asili.
- source_word: πάντες
  choice: watu wote
  rationale: Wingi wa kiume katika Kigiriki unatumiwa kwa maana ya jumla; “watu wote” huonyesha wazi kwamba marejeo hayahusu wanaume pekee.
- source_word: ἐμοὶ μαθηταί ἐστε
  choice: ninyi ni wanafunzi wangu
  rationale: Dative ἐμοὶ ina uhusiano wa kimilikishi na μαθηταί; mpangilio huu ni wa kawaida katika Kiswahili na unahifadhi uhusiano wa mwalimu na mwanafunzi.
- source_word: ἐὰν
  choice: mkiwa
  rationale: Muundo wa “mki-” huwasilisha sharti la Kigiriki kwa Kiswahili cha asili bila kudokeza kwamba upendo unastahili au unanunua uanafunzi.
- source_word: ἀγάπην ἔχητε
  choice: mkiwa na upendo
  rationale: Huhifadhi kitenzi cha kuwa na pamoja na nomino “upendo,” na hivyo kudumisha uhusiano wa msamiati na matumizi mengine ya ἀγάπη katika Yohana.
- source_word: ἐν ἀλλήλοις
  choice: miongoni mwenu
  rationale: Huu ndio ulinganifu rasmi wa kirai cha uhusiano wa ndani na wa pande zote; tanbihi inaeleza kwamba maana inayokusudiwa ni kupendana.
theological_decisions:
- issue: Asili ya sharti linaloletwa na ἐὰν
  choice: mkiwa na upendo miongoni mwenu
  alternative: mtakapopendana
  rationale: Muundo uliochaguliwa huhifadhi hali ya sharti na unaonyesha upendo kuwa alama au ushahidi unaotambulisha wanafunzi, bila kuufanya kuwa njia ya kujipatia uanafunzi.
- issue: Upeo wa πάντες
  choice: watu wote
  alternative: wote
  rationale: “Watu wote” huweka wazi upeo wa jumla wa neno hilo bila kuliwekea jinsia ya kiume.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Wanafunzi wangu” ni istilahi iliyozoeleka katika muktadha wa Injili. Alama ya nukta mbili inaunganisha dai kuu na sharti linalolitambulisha kwa uwazi.
