base_translation:
  language: en
  yaml_path: translation/nt/john/013/016.yaml
  text: Truly[a], truly, I say to you, a servant is not greater than his master[c][b], nor is an apostle greater than the one who sent him.
translation:
  language: sw
  text: “Amin[a], amin, nawaambia, mtumwa[b] si mkuu kuliko bwana[c] wake, wala mtume[d] si mkuu kuliko yule aliyemtuma.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, “Kweli.” Kurudiwa huku kunasisitiza sana maneno yanayofuata.
    reason: lexical_alternative
  - marker: b
    text: Au, “mtumishi”; neno la Kigiriki humaanisha mtu aliye chini ya mamlaka ya bwana wake.
    reason: lexical_alternative
  - marker: c
    text: 'Hapa “bwana” linatumika katika maana ya kijamii: mwenye mamlaka juu ya mtumwa.'
    reason: contextual_clarification
  - marker: d
    text: Au, “mjumbe,” yaani mtu aliyetumwa kwa agizo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: Amin, amin
  rationale: Kauli hii maradufu ni utangulizi wa kusisitiza ukweli wenye mamlaka katika Injili ya Yohana. Kurudia “Amin” kunahifadhi muundo na uzito wa Kigiriki, huku tanbihi ikifafanua maana yake.
- source_word: λέγω ὑμῖν
  choice: nawaambia
  rationale: Hii ni tafsiri ya kawaida na ya asili ya Kiswahili inayohifadhi nafsi ya kwanza na wingi wa wanaoambiwa.
- source_word: δοῦλος
  choice: mtumwa
  rationale: Neno la Kigiriki linaonyesha mtu aliye chini ya mamlaka ya bwana wake. “Mtumwa” huhifadhi uhusiano huo wenye nguvu kuliko “mtumishi.”
- source_word: μείζων
  choice: mkuu kuliko
  rationale: Hapa neno linaonyesha ukuu au cheo cha juu katika mahusiano yote mawili; “mkuu kuliko” ni ya wazi na ya kawaida katika Kiswahili.
- source_word: κύριος
  choice: bwana
  rationale: Katika mlinganisho huu neno linamaanisha mwenye mamlaka juu ya mtumwa. “Bwana” ni la asili katika Kiswahili na linafaa kwa uhusiano huo bila kulazimisha matumizi ya cheo cha kimungu.
- source_word: ἀπόστολος
  choice: mtume
  rationale: Neno humaanisha mtu aliyetumwa kwa agizo. “Mtume” huhifadhi uhusiano wa kimsamiati na kitendo cha kutuma, na “mjumbe” limetolewa kama tafsiri mbadala.
- source_word: τοῦ πέμψαντος αὐτόν
  choice: yule aliyemtuma
  rationale: Tafsiri hii ya kawaida huonyesha wazi mtu aliyetenda tendo la kumtuma na huhifadhi ulinganifu na mtume.
theological_decisions:
- issue: Maana ya κύριος katika mlinganisho huu
  choice: bwana
  alternative: Bwana
  rationale: Muktadha unalinganisha mtumwa na mwenye mamlaka juu yake, sawa na mtume na aliyemtuma. Kwa hiyo neno limetumiwa katika maana yake ya kijamii, bila kukana kwamba “Bwana” linaweza kuwa cheo katika miktadha mingine.
- issue: Maana ya ἀπόστολος
  choice: mtume
  alternative: mjumbe
  rationale: “Mtume” huhifadhi istilahi inayojulikana ya mtu aliyetumwa, lakini hapa inaweza kueleweka kwa maana pana ya mjumbe aliyepewa agizo; tanbihi inalinda upana huo wa maana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi huhifadhi ulinganifu wa misemo miwili ya Kigiriki, na marudio ya “Amin” yameachwa kwa ajili ya msisitizo wa Kiyohana.
