base_translation:
  language: en
  yaml_path: translation/nt/john/013/032.yaml
  text: If God was glorified in him[a], God will also glorify him in himself[b], and will glorify him at once.
translation:
  language: sw
  text: Ikiwa Mungu alitukuzwa ndani yake[a], Mungu pia atamtukuza ndani yake mwenyewe[b], naye atamtukuza mara moja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa kuwa Mungu alitukuzwa ndani yake.” Kigiriki kinatumia εἰ (“ikiwa”), ingawa katika muktadha sharti hilo huenda linachukuliwa kuwa kweli.
    reason: alternative_reading
  - marker: b
    text: Au, “ndani yake mwenyewe” inaweza kueleweka kuwa “pamoja na nafsi yake mwenyewe” au “kwa nafsi yake mwenyewe”; kiwakilishi cha kujirejelea kinamrejelea Mungu, na usemi wa Kigiriki ni mfupi na una maana nzito ya kiteolojia.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ
  choice: Ikiwa
  rationale: Huhifadhi muundo wa sharti ulio wazi katika Kigiriki, bila kuufanya moja kwa moja kuwa sababu; muktadha unaweza kuonyesha kwamba sharti hilo linachukuliwa kuwa kweli.
- source_word: ἐδοξάσθη
  choice: alitukuzwa
  rationale: Huhifadhi kauli tendwa ya aoristi na mwendelezo wa kimsamiati wa δοξάζω katika sentensi.
- source_word: ἐν αὐτῷ
  choice: ndani yake
  rationale: Ni tafsiri ya karibu ya ἐν pamoja na kiwakilishi, na huhifadhi usemi mzito wa Yohana badala ya kuufasiri kuwa ‘kupitia kwake.’
- source_word: δοξάσει
  choice: atamtukuza
  rationale: Huhifadhi wakati ujao na urudiaji wa mzizi δοξάζω; ‘kumheshimu’ ungepunguza uzito wa usemi.
- source_word: ἐν αὑτῷ
  choice: ndani yake mwenyewe
  rationale: Kiwakilishi cha kujirejelea kinamrejelea Mungu; tafsiri hii huhifadhi ukaribu na muundo wa Kigiriki na hali yake yenye maana nyingi.
- source_word: εὐθύς
  choice: mara moja
  rationale: Ni Kiswahili cha kawaida kinachoeleza uharaka bila kugeuza maana kuwa ‘karibuni.’
theological_decisions:
- issue: Nguvu ya sharti la εἰ katika muktadha unaodokeza kwamba jambo hilo ni kweli
  choice: Ikiwa Mungu alitukuzwa ndani yake
  alternative: Kwa kuwa Mungu alitukuzwa ndani yake
  rationale: ‘Ikiwa’ huakisi chembe halisi ya Kigiriki na kuhifadhi mvutano wa kisarufi; tanbihi inaonyesha uwezekano wa kuelewa sharti hilo kuwa linachukuliwa kama kweli.
- issue: Maana ya ἐν αὑτῷ kuhusu jinsi Mungu atakavyomtukuza Mwana
  choice: ndani yake mwenyewe
  alternative: pamoja naye mwenyewe; kwa yeye mwenyewe
  rationale: Usemi wa Kigiriki ni mfupi na wenye uzito wa kiteolojia. Tafsiri kuu haiamui kimya-kimya ikiwa ἐν ina maana ya mahali/uhusiano, ushirika, au njia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Kutukuzwa’ hudumisha istilahi ileile katika vifungu vyote vitatu. Viwakilishi vimeachwa kama vilivyo katika chanzo ili kutofafanua kupita kiasi marejeo ya ‘yeye’ katika mstari huu mmoja.
