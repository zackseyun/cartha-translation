  text: ⸀ἀποκρίνεται ὁ Ἰησοῦς· Ἐκεῖνός ἐστιν ᾧ ἐγὼ ⸀βάψω τὸ ψωμίον ⸂καὶ δώσω αὐτῷ⸃· ⸂βάψας οὖν⸃ τὸ ⸀ψωμίον δίδωσιν Ἰούδᾳ Σίμωνος ⸀Ἰσκαριώτου.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/026.yaml
  text: Jesus answers[a], “It is he to whom I will dip the piece of bread and give it.” So, having dipped the piece of bread, he gives it to Judas, the son of Simon Iscariot.
translation:
  language: sw
  text: Yesu anajibu, “Ni yule ambaye nitachovya kipande cha mkate na kumpa.” Basi, baada ya kuchovya kipande cha mkate, anampa Yuda, mwana wa Simoni Iskariote.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yuda Iskariote, mwana wa Simoni.” Muundo wa maneno ya Kigiriki unaweza kueleweka kwa njia zote mbili.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκρίνεται
  choice: anajibu
  rationale: Wakati uliopo wa kihistoria katika simulizi umehifadhiwa kwa wakati uliopo wa Kiswahili, ambao ni wa asili na hudumisha uhai wa tukio.
- source_word: Ἐκεῖνός ἐστιν
  choice: Ni yule
  rationale: Kauli hii humtambulisha mtu fulani kwa wazi na kwa Kiswahili cha kawaida bila kuongeza maelezo yasiyokuwapo.
- source_word: ᾧ ἐγὼ βάψω τὸ ψωμίον καὶ δώσω αὐτῷ
  choice: ambaye nitamchovyea kipande cha mkate na kumpa
  rationale: Kitenzi cha baadaye βάψω kimewakilishwa wazi kwa “nitamchovyea”; viambishi vya mtendewa katika “nitamchovyea” na “kumpa” vinaonyesha kwamba tendo linaelekezwa kwa mtu huyo.
- source_word: ψωμίον
  choice: kipande cha mkate
  rationale: Hutoa maana ya kipande kidogo cha mkate kwa lugha ya sasa iliyo wazi kuliko neno la kifasihi lisilo la kawaida.
- source_word: βάψας οὖν
  choice: Basi, baada ya kuchovya
  rationale: Huonyesha kwamba kuchovya kulitangulia tendo kuu, huku οὖν ikiwakilishwa kwa kiunganishi cha simulizi “Basi.”
- source_word: δίδωσιν
  choice: anampa
  rationale: Wakati uliopo wa kihistoria umehifadhiwa na kiwakilishi cha kitu kinaeleweka kutokana na kipande cha mkate kilichotajwa mara moja kabla.
- source_word: Ἰούδᾳ Σίμωνος Ἰσκαριώτου
  choice: Yuda, mwana wa Simoni Iskariote
  rationale: Hufuata uhusiano wa karibu wa maumbo ya Kigiriki, ambapo Ἰσκαριώτου inaweza kueleweka ikimfafanua Simoni, huku uwezekano mwingine ukihifadhiwa katika tanbihi.
theological_decisions:
- issue: Utambulisho wa Yuda katika kifungu cha mwisho
  choice: Yuda, mwana wa Simoni Iskariote
  alternative: Yuda Iskariote, mwana wa Simoni
  rationale: Muundo wa Kigiriki Σίμωνος Ἰσκαριώτου unaweza kusomeka moja kwa moja kuwa “wa Simoni Iskariote,” lakini unaweza pia kueleweka kwa utambulisho wa kawaida wa Yuda Iskariote. Maandishi makuu yanafuata muundo wa karibu zaidi, na uwezekano mwingine unawekwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa simulizi umetunza wakati uliopo wa kihistoria, na lugha imeepuka istilahi nzito zisizo za lazima.
