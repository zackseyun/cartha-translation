review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the double title, Jesus’ affirmation of the disciples’ address, and the explanatory force of γάρ. “Kwa maana ndivyo nilivyo” is an appropriately idiomatic way to supply in Swahili the referent implicit in εἰμὶ.
  naturalness: “Nanyi mnasema sawa” is understandable, but “nanyi mnasema kweli” is more natural Standard East African Swahili in this context of affirming that their designation is correct. The revised wording remains concise and suitably dignified.
  terminology: '“Mwalimu” and “Bwana” are appropriate title renderings. The proposed footnote alternative “Mkuu” is not a reliable equivalent for κύριος here: it shifts toward ‘chief/leader’ rather than the title’s lordship/master-authority range. No lexical-alternative footnote is needed in the Swahili text.'
  issues:
  - severity: medium
    issue: The footnote’s alternative “Mkuu” inadequately represents κύριος.
    rationale: “Mkuu” normally denotes a chief, leader, or senior person. It does not function as a close alternative title to “Bwana” in this saying and could misdirect readers regarding the Greek term.
  - severity: low
    issue: “Mnasema sawa” is less idiomatic in this affirmatory context.
    rationale: Although comprehensible, “mnasema kweli” more naturally expresses that what they call him is correct, matching καλῶς λέγετε without expanding the claim.
  revised_text: Ninyi huniita Mwalimu na Bwana, nanyi mnasema kweli, kwa maana ndivyo nilivyo.
