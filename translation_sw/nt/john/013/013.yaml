  text: ὑμεῖς φωνεῖτέ με Ὁ διδάσκαλος καὶ Ὁ κύριος, καὶ καλῶς λέγετε, εἰμὶ γάρ.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/013.yaml
  text: You call me Teacher and Lord, and you speak rightly, for I am.
translation:
  language: sw
  text: Ninyi huniita Mwalimu na Bwana, nanyi mnasema kweli, kwa maana ndivyo nilivyo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φωνεῖτέ
  choice: huniita
  rationale: Katika muundo huu wa kumwita mtu kwa cheo fulani, “huniita” ni Kiswahili cha kawaida na cha moja kwa moja.
- source_word: Ὁ διδάσκαλος
  choice: Mwalimu
  rationale: “Mwalimu” linaeleza wazi cheo cha Yesu; Kiswahili hakihitaji kibainishi kinacholingana na ὁ katika muundo huu.
- source_word: Ὁ κύριος
  choice: Bwana
  rationale: “Bwana” ndilo neno la kawaida la Agano Jipya kwa κύριος na linadumisha maana ya mamlaka na uzito wa cheo hicho.
- source_word: καλῶς λέγετε
  choice: mnasema sawa
  rationale: Usemi huu wa sasa na wa kawaida unaonyesha kwamba kauli yao ni sahihi bila kuongeza ufafanuzi usiokuwamo katika Kigiriki.
- source_word: εἰμὶ γάρ
  choice: kwa maana ndivyo nilivyo
  rationale: Kiswahili kinahitaji kurejelea vyeo vilivyotangulia ili sentensi iwe kamili; “ndivyo nilivyo” hudumisha uthibitisho mfupi na wenye mkazo wa Yesu.
theological_decisions:
- issue: Tafsiri ya κύριος kama cheo cha Yesu
  choice: Bwana
  alternative: Mkuu
  rationale: “Bwana” hudumisha matumizi ya kawaida ya cheo hiki katika Agano Jipya na uzito wake wa kimamlaka, huku tanbihi ikitambua kwamba κύριος pia inaweza kumaanisha mkuu mwenye mamlaka katika muktadha wa kijamii.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa moja kwa moja, lakini “ndivyo nilivyo” umetumiwa badala ya tafsiri isiyo kamili ya neno kwa neno ili kurejelea wazi vyeo vyote viwili.
