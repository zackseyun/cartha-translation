  text: οὐ περὶ πάντων ὑμῶν λέγω· ἐγὼ οἶδα ⸀τίνας ἐξελεξάμην· ἀλλ’ ἵνα ἡ γραφὴ πληρωθῇ· Ὁ τρώγων ⸀μου τὸν ἄρτον ἐπῆρεν ἐπ’ ἐμὲ τὴν πτέρναν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/018.yaml
  text: 'I am not speaking about all of you[a]. I know whom I have chosen[c][b]. But this is so that the Scripture may be fulfilled: ‘The one who eats my bread has lifted up his heel against me.’'
translation:
  language: sw
  text: '“Sisemi kuhusu ninyi nyote. Ninajua wale niliowachagua. Lakini ni ili Andiko litimizwe[a]: ‘Anayekula mkate wangu ameinua kisigino chake dhidi yangu[b].’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nukuu au dokezo kutoka Zaburi 41:9.
    reason: cross_reference
  - marker: b
    text: Kwa namna ya moja kwa moja, “ameinua kisigino chake dhidi yangu.” Usemi huu unaonyesha uadui na usaliti.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ περὶ πάντων ὑμῶν λέγω
  choice: Sisemi kuhusu ninyi nyote
  rationale: 'Muundo huu ni wa kawaida katika Kiswahili cha sasa na unahifadhi maana ya περὶ, ‘kuhusu,’ pamoja na upeo wa ukanushaji: Yesu hasemi kuhusu wote.'
- source_word: οἶδα
  choice: Ninajua
  rationale: Ingawa οἶδα ina umbo la wakati timilifu, katika Kiyunani cha Koine ina maana ya wakati wa sasa, ‘ninajua.’
- source_word: τίνας ἐξελεξάμην
  choice: wale niliowachagua
  rationale: Huhifadhi tendo la kuchagua na watu wanaolengwa bila kueleza kwa nyongeza aina ya uchaguzi unaokusudiwa.
- source_word: ἀλλ’ ἵνα
  choice: Lakini ni ili
  rationale: Huwasilisha kwa Kiswahili kinachoeleweka uhusiano wa kusudi au matokeo unaoletwa na ἵνα bila kuongeza dai la sababu lisilosemwa wazi.
- source_word: ἡ γραφὴ πληρωθῇ
  choice: Maandiko yatimizwe
  rationale: Katika matumizi ya Yohana, γραφή hurejelea Maandiko matakatifu; kauli tendwa tegemezi πληρωθῇ imehifadhiwa kwa ‘yatimizwe.’
- source_word: Ὁ τρώγων μου τὸν ἄρτον
  choice: Anayekula mkate wangu
  rationale: Kitenzi-jina cha Kiyunani kimetafsiriwa kwa muundo wa kawaida ‘anayekula,’ huku μου ikihusishwa na ‘mkate’ kama inavyodokezwa na muktadha wa nukuu.
- source_word: ἐπῆρεν ἐπ’ ἐμὲ τὴν πτέρναν αὐτοῦ
  choice: ameniinulia kisigino chake
  rationale: Huhifadhi picha halisi ya nukuu ya Zaburi na wazo la uadui dhidi ya msemaji; tanbihi inaeleza nahau bila kuibadilisha kuwa ufafanuzi katika matini.
theological_decisions:
- issue: Uhusiano kati ya uchaguzi wa Yesu na msaliti
  choice: Neno ἐξελεξάμην limetafsiriwa moja kwa moja kuwa ‘niliowachagua,’ bila kufafanua uchaguzi huo kidhehebu.
  alternative: Kutafsiri kwa namna inayoufafanua kama uchaguzi wa wokovu pekee au uteuzi wa utume pekee.
  rationale: Aya inasema Yesu anawajua aliowachagua, lakini hapa haifafanui kikamilifu aina ya uchaguzi huo. Tafsiri inahifadhi mvutano huo.
- issue: Nguvu ya ἀλλ’ ἵνα katika uhusiano wa usaliti na kutimizwa kwa Maandiko
  choice: Lakini ni ili Maandiko yatimizwe
  alternative: Lakini hili lilitokea kwa sababu Maandiko yalilazimika kutimia.
  rationale: Chaguo hili linahifadhi lugha ya kusudi au matokeo ya Kiyunani bila kuongeza ufafanuzi wa kideterministi kuhusu chanzo cha usaliti.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni rahisi kueleweka, huku picha ya kishairi ya Zaburi na utata wa kitheolojia kuhusu ‘kuchagua’ vikihifadhiwa.
