base_translation:
  language: en
  yaml_path: translation/nt/john/013/002.yaml
  text: And during supper[a], when the devil had already put it into the heart of Judas Iscariot, Simon's son, to betray him[c][b],
translation:
  language: sw
  text: Wakati chakula cha jioni kikiendelea[a], Ibilisi alikuwa tayari ametia moyoni mwa Yuda, mwana wa Simoni Iskariote, nia[b] ya kumsaliti[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakati chakula cha jioni kilipokuwa kikiendelea.” Kigiriki hakisemi kwamba chakula kilikuwa tayari kimekwisha.
    reason: lexical_alternative
  - marker: b
    text: Kihalisi, “alikuwa tayari ametia moyoni.” Au, “alikuwa tayari amemchochea.”
    reason: lexical_alternative
  - marker: c
    text: Au, “kumkabidhi.” Katika muktadha huu, “kumsaliti” inaonyesha maana ya tendo hilo.
    reason: alternative_reading
lexical_decisions:
- source_word: δείπνου γινομένου
  choice: Wakati chakula cha jioni kikiendelea
  rationale: Muundo huu unaonyesha jambo lililokuwa likitendeka wakati huo; haumaanishi kwamba chakula kilikuwa kimekwisha.
- source_word: διάβολος
  choice: Ibilisi
  rationale: Katika simulizi la Yohana, neno hili linamtaja yule mwovu kama nafsi, na “Ibilisi” ndilo jina la kawaida na linaloeleweka katika Kiswahili cha Biblia.
- source_word: ἤδη βεβληκότος εἰς τὴν καρδίαν
  choice: alikuwa tayari ametia moyoni ... nia
  rationale: Tafsiri hii inadumisha taswira ya Kigiriki ya kutia kitu moyoni huku “nia” ikifanya nahau hiyo ieleweke kwa Kiswahili cha kawaida.
- source_word: καρδίαν
  choice: moyoni
  rationale: “Moyo” huhifadhi taswira ya chanzo na hujumuisha kusudi na utashi, si hisia peke yake.
- source_word: ἵνα παραδοῖ
  choice: nia ya kumsaliti
  rationale: Katika habari ya Yuda, tendo la kumkabidhi Yesu kwa adui zake ni usaliti; muundo wa “nia ya” unaonyesha kusudi lililotiwa moyoni.
- source_word: αὐτόν
  choice: -m- katika “kumsaliti”
  rationale: Kiambishi cha yambwa kinadumisha rejeo la kiwakilishi kwa Yesu bila kulibadili kuwa nomino iliyo wazi.
- source_word: Ἰούδας Σίμωνος Ἰσκαριώτου
  choice: Yuda Iskariote, mwana wa Simoni
  rationale: Muundo huu unamtambulisha Yuda kwa jina la Iskariote na pia kwa uhusiano wake na Simoni, kwa lugha ya kawaida isiyodokeza kwa urahisi kwamba Simoni ndiye anayeelezwa kwa jina hilo.
theological_decisions:
- issue: Uhusika wa Ibilisi na uwajibikaji wa Yuda katika usaliti
  choice: Ibilisi anaelezwa kuwa ametia nia moyoni mwa Yuda, huku Yuda akiwa ndiye atakayemsaliti Yesu.
  alternative: Ibilisi alikuwa amemchochea Yuda; au Ibilisi ndiye aliyekuwa ametenda kupitia Yuda.
  rationale: Kigiriki kinaonyesha ushawishi wa kishetani bila kuondoa kwamba Yuda mwenyewe ndiye mhusika wa usaliti. Tafsiri inadumisha mvutano huo bila kuamua suala la ulazima au kuondoa uwajibikaji wa Yuda.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imeachwa na koma mwishoni kwa sababu mstari huu ni kishazi kinachoendelea katika mstari unaofuata. “Chakula cha jioni kikiendelea” huepuka tafsiri ya kimapokeo inayodokeza kimakosa kwamba chakula kilikuwa kimekwisha.
