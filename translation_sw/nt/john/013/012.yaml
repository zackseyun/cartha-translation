base_translation:
  language: en
  yaml_path: translation/nt/john/013/012.yaml
  text: So when he had washed their feet and taken his garments and reclined again[a], he said to them[b], “Do you understand what I have done for you?”
translation:
  language: sw
  text: Basi, alipokwisha kuosha miguu yao, akachukua mavazi yake, akaketi tena mezani[a], akawaambia, “Je, mnaelewa nilichowafanyia[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alieegemea tena mezani.” Katika milo ya wakati huo, watu kwa kawaida walikula wakiwa wameegemea.
    reason: lexical_alternative
  - marker: b
    text: Au, “nilichowatendea.” Muundo wa Kigiriki unaweza kumaanisha tendo alilowafanyia kwa manufaa yao au alilowatendea.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὅτε οὖν
  choice: Basi, baada ya
  rationale: ‘Baada ya’ huwasilisha uhusiano wa wakati, huku ‘basi’ ikihifadhi mwendelezo wa simulizi unaoonyeshwa na οὖν kwa Kiswahili cha kawaida.
- source_word: ἔνιψεν τοὺς πόδας αὐτῶν
  choice: kuiosha miguu yao
  rationale: Kitenzi katika kishazi cha wakati kinaonyesha tendo lililokamilika kabla ya matendo yanayofuata; ‘baada ya’ huonyesha mfuatano huo kwa uwazi.
- source_word: ἔλαβεν τὰ ἱμάτια αὐτοῦ
  choice: kuyachukua mavazi yake
  rationale: Tafsiri hii inabaki karibu na maana ya msingi ya ἔλαβεν na ἱμάτια bila kuongeza waziwazi wazo la ‘kuvaa,’ ingawa muktadha unaweza kulidokeza.
- source_word: ἀνέπεσεν
  choice: kuketi tena mezani
  rationale: Katika muktadha wa chakula, kitenzi humaanisha kuchukua nafasi ya kula kwa kuegemea. Kiswahili ‘kuketi tena mezani’ ni cha asili na kinachoeleweka, huku tanbihi ikieleza mkao halisi wa wakati huo.
- source_word: πάλιν
  choice: tena
  rationale: Huhifadhi moja kwa moja wazo la kurudia au kurudi katika nafasi ya awali.
- source_word: εἶπεν αὐτοῖς
  choice: akawaambia
  rationale: Ni usemi wa kawaida na wa asili wa Kiswahili kwa ‘alisema kwao,’ bila kubadili nguvu ya kauli.
- source_word: Γινώσκετε
  choice: Je, mnaelewa
  rationale: Katika swali hili, maana inayolengwa ni kutambua umuhimu wa tendo, si kujua tu kwamba limetokea.
- source_word: τί πεποίηκα ὑμῖν
  choice: nilichowafanyia
  rationale: ‘-fanyia’ huonyesha kwa kawaida tendo lililofanywa kwa ajili yao. Hata hivyo, dativu ya Kigiriki inaweza pia kueleweka kama tendo lililofanywa kwao, jambo linalowekwa wazi katika tanbihi.
theological_decisions:
- issue: Mkao wa Yesu aliporudi mezani
  choice: kuketi tena mezani
  alternative: kuegemea tena mezani
  rationale: Tafsiri kuu inalenga Kiswahili cha kawaida bila kuficha mazingira ya kihistoria; tanbihi huhifadhi ukweli kwamba watu waliegemea walipokula.
- issue: Nguvu ya ὑμῖν katika swali la Yesu
  choice: nilichowafanyia
  alternative: nilichowatendea
  rationale: Muktadha wa huduma unaunga mkono maana ya kunufaisha, lakini muundo wa Kigiriki unaweza pia kutafsiriwa kwa upana kama ‘kuwatendea’; tanbihi huhifadhi uwezekano huo bila kuondoa msisitizo wa huduma.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Kuketi tena mezani’ ni ya asili zaidi kuliko ‘kuegemea’ katika matini kuu, na maelezo ya kihistoria yamehifadhiwa katika tanbihi.
