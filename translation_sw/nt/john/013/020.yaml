id: JHN.13.20
reference: John 13:20
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω ὑμῖν, ὁ λαμβάνων ⸀ἄν τινα πέμψω ἐμὲ λαμβάνει, ὁ δὲ ἐμὲ λαμβάνων λαμβάνει τὸν πέμψαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/020.yaml
  text: Truly[a], truly, I say to you, whoever receives anyone I send receives me[b], and whoever receives me receives the one who sent me.
translation:
  language: sw
  text: '“Amin, amin, nawaambia: Yeyote anayempokea mtu yeyote nitakayemtuma, ananipokea mimi; na yeyote anayenipokea mimi, anampokea yule aliyenituma.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: Amin, amin
  rationale: Hudumisha fomula ya Yesu iliyorudiwa kwa mkazo na uzito wake wa kiapo; neno “Amin” linaeleweka na limetumika kwa kawaida katika Kiswahili cha Biblia.
- source_word: λέγω ὑμῖν
  choice: nawaambia
  rationale: Ni tafsiri ya asili na ya sasa ya Kiswahili, ikihifadhi kauli ya moja kwa moja kwa wasikilizaji wengi.
- source_word: ὁ λαμβάνων
  choice: yeyote anayempokea
  rationale: Huonyesha maana ya kijumla ya kishiriki chenye kibainishi bila kuifanya kauli iwahusu wanaume pekee.
- source_word: ἄν τινα πέμψω
  choice: mtu yeyote nitakayemtuma
  rationale: Huonyesha upeo usio na mtu maalumu wa τινα pamoja na hali ya uwezekano ya ἄν na kitenzi cha utegemezi πέμψω.
- source_word: λαμβάνει
  choice: anampokea
  rationale: “Kupokea” hudumisha marudio ya neno la Kigiriki na maana pana ya kumpokea au kumkubali mwakilishi, bila kuibana kuwa ukarimu wa kumpa makao tu.
- source_word: ὁ δὲ ἐμὲ λαμβάνων
  choice: na yeyote anayenipokea mimi
  rationale: δέ hapa inaunganisha hatua inayofuata ya mlingano kuliko kuonyesha upinzani; “na” linafaa kwa mtiririko huo.
- source_word: τὸν πέμψαντά με
  choice: yule aliyenituma
  rationale: Huhifadhi maelezo ya kimahusiano ya chanzo bila kuongeza wazi jina “Baba,” ambalo halipo katika mstari wenyewe.
theological_decisions:
- issue: Utambulisho wa “yule aliyenituma”
  choice: yule aliyenituma
  alternative: Baba aliyenituma
  rationale: Katika muktadha wa Injili ya Yohana, anayerejelewa ni Baba, lakini mstari huu wenyewe unatumia maelezo ya kimahusiano. Tafsiri hailazimishi utambulisho huo ndani ya maneno ya mstari.
- issue: Ujumuishi wa kishiriki cha kiume cha Kigiriki
  choice: yeyote anayempokea
  alternative: mtu anayempokea
  rationale: Umbo la kiume hapa ni la kijumla, si kizuizi cha jinsia; “yeyote” huwasilisha upeo huo kwa Kiswahili cha kawaida.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kifasihi lakini kinachoeleweka kwa urahisi. Marudio ya “anampokea” na viwakilishi vya mkazo “mimi” yamehifadhiwa ili kuonyesha mnyororo wa uwakilishi: mjumbe—Yesu—aliyemtuma Yesu.'
