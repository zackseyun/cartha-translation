  yaml_path: translation/nt/john/013/023.yaml
  text: One of his disciples[a], whom Jesus loved, was reclining in Jesus' bosom.
translation:
  language: sw
  text: Mmoja wa wanafunzi wake, ambaye Yesu alimpenda, alikuwa amejilaza karibu na Yesu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki kihalisi, “kifuani pa Yesu”; msemo unaoeleza nafasi ya mtu aliyejilaza karibu na mwingine wakati wa chakula.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνακείμενος
  choice: alikuwa amejiegemeza
  rationale: Kitenzi hiki kinaonyesha mkao wa kuegemea wakati wa kula katika ulimwengu wa kale; tafsiri hii inaweka wazi mkao huo kwa Kiswahili cha kawaida.
- source_word: εἷς ἐκ τῶν μαθητῶν αὐτοῦ
  choice: Mmoja wa wanafunzi wake
  rationale: Hii ni tafsiri ya kawaida na ya moja kwa moja ya usemi unaoonyesha mmoja katika kundi la wanafunzi wake.
- source_word: ἐν τῷ κόλπῳ τοῦ Ἰησοῦ
  choice: karibu na Yesu
  rationale: Katika mazingira ya chakula, usemi huu unaeleza nafasi ya mtu aliyejiegemeza karibu sana na mwingine. Tafsiri hii huepuka picha inayoweza kupotosha msomaji wa sasa, huku maana halisi ikihifadhiwa katika tanbihi.
- source_word: ὃν ἠγάπα ὁ Ἰησοῦς
  choice: ambaye Yesu alimpenda
  rationale: Hutafsiri moja kwa moja kitenzi cha kupenda na kuhifadhi muundo wa kishazi tegemezi bila kumtambulisha mwanafunzi huyo kwa jina.
theological_decisions:
- issue: Nafasi ya mwanafunzi aliyependwa kando ya Yesu
  choice: karibu na Yesu
  alternative: kifuani pa Yesu
  rationale: Katika muktadha huu, usemi unaeleza mpangilio wa watu waliokuwa wamejiegemeza wakati wa chakula, wala si lazima dai kuhusu muungano wa kiroho. Tanbihi inahifadhi tafsiri ya neno kwa neno na mwangwi wake katika Injili ya Yohana.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni rahisi kwa wasomaji wa kawaida, huku tanbihi ikihifadhi taswira halisi ya Kigiriki.
