    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγείρεται
  choice: anainuka
  rationale: Wakati wa sasa wa kisimulizi umehifadhiwa ili kuonyesha uhai wa simulizi; pia kitenzi hiki kinaeleza kuinuka kutoka mahali alipokuwa ameketi.
- source_word: ἐκ τοῦ δείπνου
  choice: kutoka chakulani
  rationale: Usemi huu wa kawaida wa Kiswahili unaonyesha kuinuka wakati wa mlo bila kulazimisha wazo la wakati maalumu wa siku kama vile ‘chakula cha jioni.’
- source_word: τίθησιν τὰ ἱμάτια
  choice: kuweka kando mavazi yake ya nje
  rationale: Katika muktadha huu τίθημι humaanisha kuyaondoa na kuyaweka kando, na ἱμάτια inaelekea kumaanisha mavazi ya nje, si kuvua nguo zote.
- source_word: λαβὼν λέντιον
  choice: anachukua taulo
  rationale: Taulo ni neno linaloeleweka kwa urahisi na linaonyesha kitambaa kilichotumiwa katika huduma hii.
- source_word: διέζωσεν ἑαυτόν
  choice: kujifunga nayo
  rationale: Hueleza kwa Kiswahili cha sasa tendo la kujizungushia au kujifunga taulo bila kuongeza wazi sehemu ya mwili ambayo Kigiriki hakuitaji.
