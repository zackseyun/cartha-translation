  text: He rises from the supper and lays aside his outer garments[a], and taking a towel[b], tied it around himself.
translation:
  language: sw
  text: Anainuka kutoka chakulani[a]; anaweka kando mavazi yake ya nje. Kisha, baada ya kuchukua taulo[b], anajifunga nayo.
  philosophy: optimal-equivalence
  footnotes:
