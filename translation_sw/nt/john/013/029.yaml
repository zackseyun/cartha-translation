  source_fidelity: 'Tafsiri inawakilisha kwa uaminifu muundo wa Kigiriki: baadhi walikuwa na dhana hiyo kwa sababu Yuda alikuwa na γλωσσόκομον; walifikiri Yesu alimpa ama agizo la kununua mahitaji ya sikukuu au la kuwapa maskini kitu. ‘Baadhi yao’ ni ufafanuzi wa kawaida unaolingana na kundi lililopo katika muktadha, bila kubadili maana.'
