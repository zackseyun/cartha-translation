id: JHN.13.29
reference: John 13:29
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: τινὲς γὰρ ἐδόκουν, ἐπεὶ τὸ γλωσσόκομον ⸀εἶχεν Ἰούδας, ὅτι λέγει αὐτῷ ⸀ὁ Ἰησοῦς· Ἀγόρασον ὧν χρείαν ἔχομεν εἰς τὴν ἑορτήν, ἢ τοῖς πτωχοῖς ἵνα τι δῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/029.yaml
  text: For some thought that[a], because Judas had the money box, Jesus was telling him[b], “Buy what we need for the feast,” or that he should give something to the poor.
translation:
  language: sw
  text: Kwa maana baadhi yao walidhani kwamba, kwa kuwa Yuda alikuwa na sanduku la fedha[a], Yesu alikuwa akimwambia, “Nunua vitu tunavyohitaji kwa ajili ya sikukuu[b],” au kwamba awape maskini kitu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mfuko wa fedha.” Neno la Kigiriki linamaanisha chombo kilichohifadhi fedha za kundi.
    reason: lexical_alternative
  - marker: b
    text: “Sikukuu” hapa ni sikukuu ya Pasaka inayotajwa katika muktadha wa sehemu hii.
    reason: cross_reference
lexical_decisions:
- source_word: τινὲς
  choice: baadhi yao
  rationale: Kiwakilishi cha wingi kisicho bayana kinawarejelea baadhi ya waliokuwapo; “baadhi yao” ni wazi na cha kawaida katika Kiswahili.
- source_word: ἐδόκουν
  choice: walidhani
  rationale: Hutoa wazo lao lisilokuwa na uhakika bila kulifanya kuwa maarifa ya hakika.
- source_word: ἐπεὶ
  choice: kwa kuwa
  rationale: 'Huonyesha sababu iliyowafanya wafikiri hivyo: Yuda ndiye aliyekuwa na chombo cha fedha.'
- source_word: γλωσσόκομον
  choice: sanduku la fedha
  rationale: Neno hilo linamaanisha chombo kilichohifadhi fedha za kundi; tafsiri hii haibainishi zaidi ya chanzo kama kilikuwa mfuko au kisanduku.
- source_word: εἶχεν
  choice: alikuwa na
  rationale: Huhifadhi maana ya msingi ya kuwa na au kushika; muktadha unaonyesha kuwa Yuda alikuwa akilitunza.
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: Yesu alikuwa akimwambia
  rationale: Wakati uliopita unaendelea unafaa katika usimulizi wa Kiswahili na katika dhana ya wanafunzi kuhusu maana ya maneno ya Yesu.
- source_word: Ἀγόρασον
  choice: Nunua
  rationale: Amri ya moja kwa moja, ya kawaida na ya kisasa.
- source_word: ὧν χρείαν ἔχομεν
  choice: vitu tunavyohitaji
  rationale: Ni Kiswahili cha kawaida kinachowasilisha kikamilifu muundo wa kile tunachohitaji.
- source_word: εἰς τὴν ἑορτήν
  choice: kwa ajili ya sikukuu
  rationale: ἑορτή ni sikukuu ya kidini; muktadha ni Pasaka, lakini mstari wenyewe haurudii jina hilo.
- source_word: τοῖς πτωχοῖς ἵνα τι δῷ
  choice: kwamba awape maskini kitu
  rationale: Huhifadhi wazo la tendo lililokusudiwa kama wanafunzi walivyolielewa, kwa Kiswahili fasaha.
theological_decisions:
- issue: Utambulisho wa sikukuu
  choice: sikukuu katika matini, huku tanbihi ikitaja muktadha wa Pasaka
  alternative: sikukuu ya Pasaka
  rationale: Muktadha wa sehemu hii ni Pasaka, lakini ἑορτή katika mstari huu halitaji Pasaka moja kwa moja; hivyo tafsiri haiongezi jina ndani ya matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa sentensi unahifadhi sababu ya dhana ya wanafunzi na njia mbili walizofikiri Yesu alikuwa amemwagiza Yuda.
