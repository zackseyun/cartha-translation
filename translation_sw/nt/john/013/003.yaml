  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ⸀εἰδὼς ὅτι πάντα ⸀ἔδωκεν αὐτῷ ὁ πατὴρ εἰς τὰς χεῖρας, καὶ ὅτι ἀπὸ θεοῦ ἐξῆλθεν καὶ πρὸς τὸν θεὸν ὑπάγει,
base_translation:
  language: en
  yaml_path: translation/nt/john/013/003.yaml
  text: Jesus[a], knowing that the Father had given all things into his hands, and that he had come from God and was going to God[b],
translation:
  language: sw
  text: Yesu, akijua kwamba Baba alikuwa ameweka vitu vyote mikononi mwake, na kwamba alikuwa ametoka kwa Mungu[a] na alikuwa akienda kwa Mungu[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alikuwa amekuja kutoka kwa Mungu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “alikuwa akirudi kwa Mungu”; Kiyunani kinasema tu “alikuwa akienda kwa Mungu.”
    reason: alternative_reading
lexical_decisions:
- source_word: εἰδὼς
  choice: akijua
  rationale: Kirai cha hali kinatanguliza msingi wa tendo linalofuata katika muktadha; “akijua” ni cha kawaida na hakiongezi maelezo yasiyokuwamo.
- source_word: πάντα
  choice: vitu vyote
  rationale: Wingi wa kijinsia isiyo ya kiume wala ya kike una upeo mpana; “vitu vyote” unaonyesha wazi maana hiyo ya ujumla.
- source_word: ἔδωκεν
  choice: alikuwa ameweka
  rationale: Muundo wa wakati uliotangulia unaonyesha kwamba tendo la Baba lilikuwa limetimia kabla ya tukio linalosimuliwa, huku “kuweka mikononi” ukihifadhi sitiari ya Kiyunani.
- source_word: εἰς τὰς χεῖρας
  choice: mikononi mwake
  rationale: Sitiari halisi ya kukabidhi mamlaka au usimamizi inaeleweka vizuri katika Kiswahili na kwa hiyo haijabadilishwa kuwa usemi wa kinadharia.
- source_word: ὁ πατὴρ
  choice: Baba
  rationale: Neno lenye kibainishi linatumika kama cheo; “Baba” linahifadhi uzito wake katika Injili ya Yohana bila kuongeza kimilikishi kisichokuwamo.
- source_word: ἀπὸ θεοῦ
  choice: kutoka kwa Mungu
  rationale: Tafsiri inahifadhi “Mungu,” wala haibadilishi kuwa “Baba” au kuongeza wazo la kuwapo mbele zake.
- source_word: ἐξῆλθεν
  choice: alikuwa ametoka
  rationale: Usemi huu unaonyesha asili au kuja kutoka kwa Mungu na pia unaweka tendo hilo kabla ya wakati wa tukio; tanbihi inaonyesha uwezekano wa kusisitiza wazo la kuja.
- source_word: πρὸς τὸν θεὸν
  choice: kwa Mungu
  rationale: Pamoja na kitenzi cha mwendo, “kwa Mungu” ni usemi wa kawaida wa Kiswahili unaoonyesha kikomo cha mwendo bila kuongeza “kurudi” au “kuwa pamoja na.”
- source_word: ὑπάγει
  choice: alikuwa akienda
  rationale: Muundo huu unaonyesha mwendo uliokuwa unaelekea kutimia na unafaa kwa wakati wa sasa wa kisimulizi katika Kiyunani.
theological_decisions:
- issue: Lugha ya asili ya Kristo katika ἀπὸ θεοῦ ἐξῆλθεν
  choice: alikuwa ametoka kwa Mungu
  alternative: alikuwa amekuja kutoka kwa Mungu
  rationale: Chaguo hili linadumisha kauli yenye uzito kuhusu asili na utume wa Yesu bila kuingiza ufafanuzi wa kimafundisho ambao mstari hautamki moja kwa moja.
- issue: Lugha ya kikomo cha mwendo katika πρὸς τὸν θεὸν ὑπάγει
  choice: alikuwa akienda kwa Mungu
  alternative: alikuwa akirudi kwa Mungu
  rationale: “Kurudi” linaweza kueleweka kutokana na muktadha mpana, lakini halijasemwa wazi katika kirai hiki; tafsiri kuu inahifadhi mvutano huo.
- issue: Kutajwa kwa Yesu kama kiima
  choice: Yesu
  alternative: yeye
  rationale: Jina limewekwa wazi kwa Kiswahili kwa sababu kiima cha kirai tegemezi kinatokana na muktadha uliotangulia; hii haisemi dai jipya la kitheolojia bali huzuia utata wa kisarufi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo wa mstari umeachwa ukiendelea kwa koma kwa sababu sentensi na tendo kuu vinaendelea katika mstari unaofuata. Sitiari ya “mikononi mwake” imehifadhiwa kwa kuwa inaeleweka na inalinda picha ya kukabidhi mamlaka.
