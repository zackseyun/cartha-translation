  yaml_path: translation/nt/john/013/005.yaml
  text: Then he pours water into the washbasin[b][a], and began to wash the disciples’ feet and to wipe them with the towel with which he was girded.
translation:
  language: sw
  text: Kisha akatia maji katika beseni[a], akaanza kuwaosha wanafunzi miguu na kuifuta kwa taulo[b] aliyokuwa amejifunga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaani, chombo kilichotumiwa kuoshea.
    reason: lexical_clarification
  - marker: b
    text: Au, “iliyokuwa imefungwa kumzunguka.” Kigiriki kinaonyesha kwamba taulo hiyo ilikuwa imefungwa kumzunguka.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶτα
  choice: Kisha
  rationale: Huonyesha hatua inayofuata katika simulizi kwa Kiswahili cha kawaida na chenye heshima.
- source_word: βάλλει ὕδωρ
  choice: akatia maji
  rationale: Ingawa βάλλω kwa msingi ni ‘kutia/kuweka,’ katika muktadha huu ‘akatia maji’ ni ya asili na haiongezi namna mahususi ya kuyamimina isiyotajwa wazi na kitenzi.
- source_word: εἰς τὸν νιπτῆρα
  choice: katika beseni
  rationale: νιπτήρ ni chombo cha kuoshea; ‘beseni’ ni neno la kawaida la Kiswahili na muktadha unaonyesha matumizi yake.
- source_word: ἤρξατο νίπτειν
  choice: akaanza kuwaosha
  rationale: Huhifadhi maana ya kuanza tendo la kuosha; kiambishi ‘-wa-’ kinawarejelea wanafunzi kwa kawaida katika Kiswahili.
- source_word: τοὺς πόδας τῶν μαθητῶν
  choice: wanafunzi miguu
  rationale: Muundo wa ‘kuwaosha wanafunzi miguu’ ni wa asili katika Kiswahili na huhifadhi uhusiano wa miguu na wanafunzi.
- source_word: ἐκμάσσειν
  choice: kuifuta
  rationale: Kitenzi kina maana ya kufuta au kukausha kwa kufuta; ‘kuifuta’ hubaki karibu na maana ya msingi, huku ‘i-’ ikirejelea miguu kama ngeli ya 10.
- source_word: τῷ λεντίῳ
  choice: kwa taulo
  rationale: ‘Taulo’ ni kisawe cha kisasa na kinachoeleweka cha kitambaa kilichotumiwa kufutia.
- source_word: ᾧ ἦν διεζωσμένος
  choice: aliyokuwa amejifunga kiunoni
  rationale: Hueleza kwa Kiswahili cha asili hali ya taulo kufungwa kuzunguka mwili kwa ajili ya huduma, bila kutumia neno la kizamani kama ‘kujifunga mshipi.’
