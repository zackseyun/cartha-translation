  text: ἐντολὴν καινὴν δίδωμι ὑμῖν ἵνα ἀγαπᾶτε ἀλλήλους, καθὼς ἠγάπησα ὑμᾶς ἵνα καὶ ὑμεῖς ἀγαπᾶτε ἀλλήλους.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/034.yaml
  text: 'A new commandment I give to you: that you love one another[a]. Just as I loved you[b], you also are to love one another.'
translation:
  language: sw
  text: 'Ninawapa amri mpya[a]: mpendane. Kama vile nilivyowapenda, ninyi pia mpendane[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “agizo jipya.”
    reason: lexical_alternative
  - marker: b
    text: Kifungu cha mwisho kinaweza pia kutafsiriwa, “ili ninyi pia mpendane.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐντολὴν
  choice: amri
  rationale: “Amri” ni neno la kawaida na lenye uzito wa kimaadili katika Kiswahili; linaonyesha kwamba Yesu hatoi ushauri tu bali anaagiza.
- source_word: καινὴν
  choice: mpya
  rationale: “Mpya” linaacha wazi iwapo upya huo ni wa wakati, wa namna, au wa utimilifu wake, kama ilivyo katika Kigiriki.
- source_word: δίδωμι ὑμῖν
  choice: ninawapa
  rationale: Kitenzi hiki kinawasilisha wakati wa sasa na pia walengwa wa utoaji kwa njia ya kawaida katika Kiswahili.
- source_word: ἵνα ἀγαπᾶτε ἀλλήλους
  choice: mpendane
  rationale: Baada ya kutajwa kwa amri, hali ya kuamuru “mpendane” huwasilisha kwa ufupi na kwa kawaida maudhui na nguvu ya ἵνα pamoja na kitenzi chake.
- source_word: ἀγαπᾶτε / ἠγάπησα
  choice: mpendane / nilivyowapenda
  rationale: Lugha ya “kupenda” imetumiwa kwa uthabiti ili kuhifadhi marudio na msisitizo wa mzizi wa Kigiriki.
- source_word: ἀλλήλους
  choice: -ane katika “mpendane”
  rationale: Kiambishi cha kutendeana “-ane” ni njia ya asili ya Kiswahili ya kueleza maana ya “ninyi kwa ninyi.”
- source_word: καθὼς
  choice: kama vile
  rationale: “Kama vile” huonyesha kwamba upendo wa Yesu ndio kielelezo au kipimo cha upendo wa wanafunzi bila kufafanua zaidi uhusiano huo.
- source_word: ἠγάπησα
  choice: nilivyowapenda
  rationale: Wakati uliopita unahifadhi mtazamo wa aoristi kwa upendo ambao Yesu tayari amewaonyesha wanafunzi.
- source_word: ἵνα καὶ ὑμεῖς ἀγαπᾶτε ἀλλήλους
  choice: ninyi pia mpendane
  rationale: Mpangilio huu ni wa kawaida katika Kiswahili, unasisitiza “ninyi pia,” na unaendeleza nguvu ya kuhimiza ya muktadha huku tanbihi ikihifadhi uwezekano wa kusoma ἵνα kama kusudi au matokeo.
theological_decisions:
- issue: Maana ya kuitwa kwa amri hii “mpya”
  choice: Neno “mpya” limeachwa bila maelezo ya ziada katika matini kuu.
  alternative: Inaweza kueleweka kuwa mpya kwa wakati, kwa ubora, au kwa utimilifu wake kupitia mfano wa Yesu.
  rationale: Aya yenyewe haisemi kwa namna gani hasa amri hiyo ni mpya; kutofafanua kunahifadhi uwazi na mvutano wa kitheolojia wa matini.
- issue: Uhusiano kati ya upendo wa Yesu na upendo wa wanafunzi
  choice: “Kama vile nilivyowapenda” limetafsiriwa kama kielelezo kinachoongoza amri ya wanafunzi kupendana.
  alternative: 'Kifungu cha mwisho kinaweza kusomwa kwa uwazi zaidi kama kusudi au matokeo: “ili ninyi pia mpendane.”'
  rationale: καθὼς huweka upendo wa Yesu kama msingi wa ulinganisho, huku ἵνα ya pili ikiruhusu zaidi ya namna moja ya kueleza uhusiano wa kisarufi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wenye hadhi na unaoeleweka kwa urahisi. “Mpendane” ni tamko fupi na la kawaida linalohifadhi urudiaji wa wazo kuu; “ninyi pia” imetajwa wazi ili kudumisha msisitizo wa καὶ ὑμεῖς.
