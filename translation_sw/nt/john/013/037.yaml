id: JHN.13.37
reference: John 13:37
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ⸀ὁ Πέτρος· Κύριε, διὰ τί οὐ δύναμαί σοι ⸀ἀκολουθῆσαι ἄρτι; τὴν ψυχήν μου ὑπὲρ σοῦ θήσω.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/037.yaml
  text: Peter said to him[a], “Lord[b], why am I not able to follow you now? I will lay down my life for you.”
translation:
  language: sw
  text: Petro akamwambia, “Bwana, kwa nini siwezi kukufuata sasa? Nitautoa uhai wangu kwa ajili yako.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει αὐτῷ ὁ Πέτρος
  choice: Petro akamwambia
  rationale: Ingawa λέγει ni wakati wa sasa wa kihistoria, Kiswahili cha masimulizi hutumia kwa kawaida mfululizo wa wakati uliopita; “akamwambia” ni ya asili na inahifadhi mtiririko wa simulizi.
- source_word: Κύριε
  choice: Bwana
  rationale: “Bwana” ni namna ya kawaida ya kumwita Yesu kwa heshima na pia haiondoi uzito wa kitheolojia unaoweza kuwamo katika κύριος.
- source_word: διὰ τί οὐ δύναμαί
  choice: kwa nini siwezi
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya swali la sababu pamoja na kutoweza.
- source_word: σοι ἀκολουθῆσαι
  choice: kukufuata
  rationale: “Kukufuata” huhifadhi maana ya kwenda nyuma au pamoja na Yesu na pia maana pana ya uanafunzi katika Injili ya Yohana.
- source_word: ἄρτι
  choice: sasa
  rationale: “Sasa” huonyesha wakati wa mara hiyo kwa lugha fupi na ya kawaida.
- source_word: τὴν ψυχήν μου
  choice: uhai wangu
  rationale: Katika muundo huu ψυχή humaanisha uhai ambao mtu yuko tayari kuutoa kwa kufa, si hasa sehemu ya kiroho iitwayo nafsi.
- source_word: ὑπὲρ σοῦ
  choice: kwa ajili yako
  rationale: Kauli hii huonyesha tendo linalofanywa kwa manufaa au kwa niaba ya mwingine bila kulazimisha maana finyu zaidi.
- source_word: θήσω
  choice: nitautoa
  rationale: Pamoja na ψυχή, kitenzi hiki ni nahau ya kujitoa kufa. “Nitautoa uhai wangu” ni Kiswahili cha asili kuliko tafsiri sisisi ya “nitaweka,” huku kikihifadhi maana.
theological_decisions:
- issue: Maana ya ψυχή katika kauli ya Petro
  choice: uhai wangu
  alternative: nafsi yangu
  rationale: Muktadha ni utayari wa Petro kufa kwa ajili ya Yesu. “Nafsi yangu” ingeweza kueleweka kimetafizikia na kuficha maana ya uhai unaotolewa katika kifo.
- issue: Wigo wa maana ya ἀκολουθέω
  choice: kukufuata
  alternative: kwenda pamoja nawe
  rationale: “Kukufuata” huhifadhi kwa pamoja maana ya mwendo halisi na mwangwi wa uanafunzi; “kwenda pamoja nawe” ingeweza kuifanya maana iwe ya mahali tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo wa swali umewekwa wa kawaida, na nahau ya Kigiriki kuhusu kuutoa uhai imetafsiriwa kwa Kiswahili cha asili.
