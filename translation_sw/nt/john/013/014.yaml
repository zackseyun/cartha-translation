id: JHN.13.14
reference: John 13:14
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἰ οὖν ἐγὼ ἔνιψα ὑμῶν τοὺς πόδας ὁ κύριος καὶ ὁ διδάσκαλος, καὶ ὑμεῖς ὀφείλετε ἀλλήλων νίπτειν τοὺς πόδας·
base_translation:
  language: en
  yaml_path: translation/nt/john/013/014.yaml
  text: If I then[a], the Lord and the Teacher, have washed your feet, you also ought to wash one another’s feet.
translation:
  language: sw
  text: Basi, ikiwa mimi, Bwana na Mwalimu, nimewaosha miguu yenu, ninyi pia mnapaswa kuoshana miguu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ οὖν
  choice: Basi, ikiwa
  rationale: ‘Ikiwa’ huhifadhi sharti la εἰ, na ‘basi’ huonyesha nguvu ya kimantiki ya οὖν kwa Kiswahili cha kawaida.
- source_word: ἐγὼ
  choice: mimi
  rationale: Kiwakilishi cha wazi kinahifadhi msisitizo wa Kigiriki na kutofautisha tendo la Yesu na wajibu wa wanafunzi.
- source_word: ἔνιψα
  choice: nimewaosha
  rationale: Wakati timilifu wa Kiswahili unaonyesha tendo lililokamilika ambalo bado lina umuhimu katika mazungumzo ya wakati huo.
- source_word: ὑμῶν τοὺς πόδας
  choice: miguu
  rationale: Kiambishi cha yambwa ‘-wa-’ katika ‘nimewaosha’ kinaonyesha kwamba miguu ni yao; muundo huu ni wa kawaida na hauna utata katika Kiswahili.
- source_word: ὁ κύριος
  choice: Bwana
  rationale: Ni tafsiri ya kawaida ya κύριος kama cheo cha Yesu na inadumisha tofauti kati ya hadhi yake na huduma yake ya unyenyekevu.
- source_word: ὁ διδάσκαλος
  choice: Mwalimu
  rationale: Inahifadhi cheo cha Yesu kilichowekwa sambamba na ‘Bwana’ bila kukifafanua kwa maneno ya ziada.
- source_word: καὶ ὑμεῖς
  choice: ninyi pia
  rationale: ‘Ninyi’ huhifadhi msisitizo wa kiwakilishi cha Kigiriki, na ‘pia’ huonyesha kwamba wao wanapaswa kutenda kama Yesu alivyotenda.
- source_word: ὀφείλετε
  choice: mnapaswa
  rationale: Inaeleza wajibu wa kimaadili bila kuugeuza kimya kimya kuwa amri kali kuliko muundo wa Kigiriki.
- source_word: ἀλλήλων νίπτειν τοὺς πόδας
  choice: kuoshana miguu
  rationale: Muundo wa kutendeana ‘-ana’ unaonyesha kwa kawaida tendo la mmoja kwa mwingine, huku ukihifadhi tendo halisi la kuosha miguu.
theological_decisions:
- issue: Tafsiri ya κύριος kama cheo cha Kikristo
  choice: Bwana
  alternative: Mkuu
  rationale: ‘Bwana’ ndiyo tafsiri ya kawaida ya cheo hiki na inaonyesha hadhi ya Yesu inayotofautishwa na tendo lake la unyenyekevu; tanbihi inakiri maana nyingine inayowezekana ya neno hilo katika muktadha.
- issue: Asili ya wajibu wa kuosha miguu
  choice: 'Kuhifadhi tendo halisi: ‘kuoshana miguu’'
  alternative: kutumikiana kwa unyenyekevu
  rationale: Kigiriki kinataja wazi kuosha miguu. Ingawa tendo hilo lina maana pana ya mfano, mstari huu haupaswi kufupishwa kuwa matumizi yake ya jumla.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Basi, ikiwa’ ni muundo wa asili unaohifadhi hoja ya sharti; ‘kuoshana miguu’ ni usemi wazi na wa kawaida wa kutendeana.
