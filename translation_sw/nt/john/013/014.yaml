review_pass:
  verdict: revise
  source_fidelity: The conditional-inferential argument, Jesus' emphatic self-reference, his paired titles, completed washing, and the disciples' reciprocal obligation are all substantially represented. Adding the explicit possessive to 'miguu yenu' more fully represents ὑμῶν and avoids relying solely on an object marker for this relation.
  naturalness: The revised wording is natural Standard East African Swahili. 'Kuoshana miguu' idiomatically conveys reciprocal foot washing.
  terminology: '''Bwana'' and ''Mwalimu'' are appropriate parallel titles for κύριος and διδάσκαλος. The proposed note ''Au, “Mkuu.”'' is not a sound or useful alternative for κύριος in this titular context and should be removed.'
  issues:
  - severity: low
    issue: The possessive relation in ὑμῶν τοὺς πόδας is left implicit.
    rationale: Although 'nimewaosha miguu' can be understood, 'miguu yenu' states explicitly that the feet washed are those of the disciples, as in the Greek.
  - severity: medium
    issue: Footnote alternative “Mkuu” for Bwana is misleading.
    rationale: Mkuu ordinarily means a leader, chief, or superior and is not an apt equivalent for κύριος as Jesus' title here. No alternative-reading note is needed.
  revised_text: Basi, ikiwa mimi, Bwana na Mwalimu, nimewaosha miguu yenu, ninyi pia mnapaswa kuoshana miguu.
