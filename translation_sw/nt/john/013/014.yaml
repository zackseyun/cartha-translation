- from: Basi, ikiwa mimi, Bwana[a] na Mwalimu, nimewaosha miguu, ninyi pia mnapaswa kuoshana miguu.
  to: Basi, ikiwa mimi, Bwana na Mwalimu, nimewaosha miguu yenu, ninyi pia mnapaswa kuoshana miguu.
  rationale: The revision explicitly renders 'your feet' and removes an inaccurate alternative-title footnote, while preserving the source's conditional logic, titles, and concrete reciprocal action.
