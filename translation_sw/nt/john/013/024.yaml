translation:
  language: sw
  text: Basi Simoni Petro akamwashiria huyo mwanafunzi[a] aulize ni nani ambaye huenda Yesu alikuwa akimzungumzia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa karibu zaidi na Kigiriki, “huyo”; neno “mwanafunzi” limeongezwa kutokana na muktadha wa mstari uliotangulia.
    reason: Ufafanuzi wa “mwanafunzi” umetolewa kutokana na muktadha wa mstari uliotangulia.
lexical_decisions:
- source_word: νεύει
  choice: akamwashiria
  rationale: Kitenzi hiki kinaonyesha kutoa ishara bila kusema, si lazima kutikisa kichwa; “akamwashiria” ni cha kawaida na kinaacha namna hasa ya ishara wazi.
- source_word: οὖν
  choice: Basi
  rationale: Hapa neno hili linaendeleza simulizi kwa kuonyesha matokeo ya yaliyotangulia; “Basi” linafaa katika Kiswahili cha simulizi.
- source_word: τούτῳ
  choice: huyo mwanafunzi
  rationale: Kiwakilishi kionyeshi kinamrejelea mwanafunzi aliyetajwa katika mstari uliotangulia. Kuongeza “mwanafunzi” kunafanya rejeo lieleweke kwa kawaida bila kumbainisha kwa jina.
- source_word: πυθέσθαι
  choice: aulize
  rationale: 'Kitenzi-jina kinaeleza kusudi au ujumbe wa ishara ya Petro: mwanafunzi huyo aulize.'
- source_word: τίς ἂν εἴη
  choice: huenda ... nani
  rationale: “Huenda” kinawakilisha hali ya kutokuwa na uhakika inayoletwa na ἄν pamoja na hali ya optative.
- source_word: περὶ οὗ λέγει
  choice: Yesu alikuwa akizungumza juu ya nani
  rationale: Muundo huu ni wa kawaida katika Kiswahili na unaonyesha wazi kuwa mtu anayetafutwa ndiye aliyekuwa akizungumziwa. Jina “Yesu” linaweka wazi mtendaji anayeashiriwa na kitenzi cha Kigiriki kulingana na muktadha.
