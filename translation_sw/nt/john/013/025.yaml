  yaml_path: translation/nt/john/013/025.yaml
  text: So he[a], leaning back in this way against Jesus' chest, says to him, “Lord, who is it?”
translation:
  language: sw
  text: Basi yeye[a], akiegemea kifua cha Yesu kwa namna hiyo, akamwambia, “Bwana, ni nani?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akiwa amejilaza kwa kuegemea karibu na kifua cha Yesu.” Kigiriki kinaonyesha mkao wa kula wa wakati huo, ambapo watu walikula wakiwa wamejilaza kwa kuegemea.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναπεσὼν
  choice: akiwa ameegemea
  rationale: Katika muktadha wa chakula, kitenzi hiki huonyesha kuketi kwa kuegemea mezani; hapa pia kinaonyesha tendo la mwanafunzi kujiegemeza kuelekea kifuani pa Yesu.
- source_word: ἐκεῖνος
  choice: yeye
  rationale: Kiwakilishi hiki kinamrejelea mwanafunzi aliyetajwa katika mstari uliotangulia bila kuongeza neno lisilokuwapo wazi katika Kigiriki.
- source_word: οὕτως
  choice: kwa namna hiyo
  rationale: Huhifadhi rejeo la namna au mkao ulioelezwa katika muktadha wa karibu.
- source_word: ἐπὶ τὸ στῆθος τοῦ Ἰησοῦ
  choice: kifuani pa Yesu
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha mwanafunzi akiegemea sehemu ya kifua cha Yesu.
- source_word: λέγει αὐτῷ
  choice: akamwambia
  rationale: Ingawa Kigiriki kinatumia wakati uliopo wa kihistoria, wakati wa masimulizi wa Kiswahili unasomeka kwa kawaida zaidi hapa na kiambishi -ka- kinaendeleza mfuatano wa matendo.
- source_word: Κύριε
  choice: Bwana
  rationale: Huhifadhi wigo wa neno la heshima kwa Yesu pamoja na uzito wake wa kikristo katika Injili ya Yohana.
- source_word: τίς ἐστιν;
  choice: ni nani?
  rationale: Hili ndilo swali la kawaida la Kiswahili kuhusu utambulisho wa mtu anayezungumziwa.
theological_decisions:
- issue: Tafsiri ya κύριος katika usemi wa moja kwa moja kwa Yesu
  choice: Bwana
  alternative: Mheshimiwa; Mwalimu
  rationale: “Bwana” huhifadhi uwezekano wa kuwa usemi wa heshima na pia maana pana ya kikristo bila kuufanya uwe wa adabu tu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo unabaki karibu na Kigiriki huku ukitumia masimulizi ya kawaida ya Kiswahili; tanbihi inaeleza mkao wa kula ambao huenda usiwe dhahiri kwa msomaji wa leo.
