base_translation:
  language: en
  yaml_path: translation/nt/john/013/027.yaml
  text: And after the piece of bread[a], then Satan entered into him. So Jesus said to him, “What you are doing[b], do more quickly.”
translation:
  language: sw
  text: Na baada ya kile kipande cha mkate[a], ndipo Shetani akaingia ndani yake. Kwa hiyo Yesu akamwambia, “Unalofanya, lifanye haraka zaidi.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kile tonge.” Neno la Kigiriki ψωμίον humaanisha kipande kidogo cha chakula; hapa yaelekea ni kipande cha mkate kilichochovywa na kutolewa wakati wa mlo.
    reason: lexical_alternative
  - marker: b
    text: Au, “lifanye haraka.” Neno la Kigiriki τάχιον lina umbo la kulinganisha, “haraka zaidi,” ingawa linaweza kutafsiriwa kwa Kiswahili laini kuwa “haraka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ψωμίον
  choice: kile kipande cha mkate
  rationale: Neno hili humaanisha kipande kidogo cha chakula; katika muktadha huu ni kipande cha mkate kilichotolewa wakati wa mlo. Tafsiri hii ni wazi na halisi katika Kiswahili cha sasa.
- source_word: εἰσῆλθεν εἰς ἐκεῖνον
  choice: akaingia ndani yake
  rationale: Inahifadhi usemi wa moja kwa moja wa Kigiriki unaoonyesha kuingia kwa Shetani ndani ya Yuda bila kuufanya kuwa sitiari wala kuupanua kitheolojia.
- source_word: ὁ Σατανᾶς
  choice: Shetani
  rationale: Hili ndilo jina/jina la cheo lililozoeleka katika Kiswahili cha Agano Jipya.
- source_word: λέγει οὖν αὐτῷ ὁ Ἰησοῦς
  choice: Kwa hiyo Yesu akamwambia
  rationale: Kiswahili cha masimulizi hutumia kwa kawaida wakati uliopita; kiunganishi 'kwa hiyo' kinawakilisha οὖν na kuonyesha mwendelezo wa kimantiki.
- source_word: Ὃ ποιεῖς
  choice: Unalofanya
  rationale: Inawakilisha kitendo cha sasa bila kuongeza wazo la 'unalokusudia kufanya' au 'unalokaribia kufanya,' ambalo lingekuwa ufafanuzi wa ziada.
- source_word: ποίησον
  choice: lifanye
  rationale: Amri fupi na ya moja kwa moja inahifadhi ukali na ufupi wa Kigiriki, huku kiambishi 'li-' kikirejelea jambo linalofanywa.
- source_word: τάχιον
  choice: upesi zaidi
  rationale: τάχιον ni umbo la kulinganisha; 'upesi zaidi' linahifadhi maana hiyo, tofauti na 'upesi' peke yake.
theological_decisions:
- issue: Namna ya tendo la Shetani kwa Yuda
  choice: Shetani akaingia ndani yake
  alternative: Shetani akamtawala / Yuda akajisalimisha kwa Shetani
  rationale: Maandishi yanasema moja kwa moja kwamba Shetani aliingia ndani yake. Tafsiri haipunguzi jambo hili kuwa sitiari wala kuongeza maelezo kuhusu kiwango cha utawala au uwajibikaji wa Yuda.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa masimulizi umetolewa kwa wakati uliopita wa kawaida, huku uradidi wa 'baada ... ndipo' ukihifadhi msisitizo wa mfuatano katika Kigiriki. Alama zote za tanbihi zimewekwa katika matini kuu.
