  text: So he comes to Simon Peter. He says to him[a], “Lord, are you washing my feet?”
translation:
  language: sw
  text: Basi akamjia Simoni Petro. Petro akamwambia[a], “Bwana, wewe unaniosha miguu yangu?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki κύριε linaweza kutumiwa kama mwito wa heshima; hapa “Bwana” pia huhifadhi uwezekano wa kumrejelea Yesu kwa cheo chake.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔρχεται
  choice: akamjia
  rationale: Kitenzi hiki kinaonyesha Yesu akimwendea Petro. Wakati uliopo wa kisimulizi katika Kigiriki umetafsiriwa kwa mfululizo wa kisimulizi wa Kiswahili, ambao ni wa asili zaidi katika kifungu hiki.
- source_word: οὖν
  choice: Basi
  rationale: Neno hili linaendeleza simulizi na kuonyesha hatua inayofuata bila uzito wa kimantiki unaoweza kudokezwa na “kwa hiyo.”
- source_word: πρὸς Σίμωνα Πέτρον
  choice: Simoni Petro
  rationale: Pamoja na kitenzi “akamjia,” umbo hili linaeleza kwa kawaida mwendo wa Yesu kuelekea kwa Simoni Petro.
- source_word: λέγει αὐτῷ
  choice: Petro akamwambia
  rationale: Msemaji anayetambulika kutokana na swali ni Petro. Kutaja jina lake huondoa utata usio wa maana katika Kiswahili, huku “akamwambia” likihifadhi anayelengwa na usemi.
- source_word: Κύριε
  choice: Bwana
  rationale: “Bwana” ni namna ya kawaida ya kumwita Yesu na inahifadhi maana ya heshima pamoja na uwezekano wa uzito wa kikristo katika Injili ya Yohana.
- source_word: σύ
  choice: wewe
  rationale: Kiwakilishi kilichotajwa wazi katika Kigiriki kina mkazo; “wewe” kinahifadhi mshangao na msisitizo wa Petro.
- source_word: μου
  choice: -ni-
  rationale: Kiswahili huonyesha mhusika anayefanyiwa tendo kwa kiambishi katika “unaniosha”; pamoja na “miguu,” maana ya “miguu yangu” inaeleweka kwa kawaida.
- source_word: νίπτεις
  choice: unaniosha
  rationale: Kauli ya wakati uliopo inaonyesha tendo linalofanyika au linalokusudiwa papo hapo. Kitenzi “kuosha” kinafaa kwa kuosha sehemu ya mwili.
- source_word: τοὺς πόδας
  choice: miguu
  rationale: “Miguu” ni tafsiri ya moja kwa moja na ya kawaida; umilikaji unaeleweka kupitia kiambishi cha mtendewa katika “unaniosha.”
theological_decisions:
- issue: Tafsiri ya κύριε Petro anapomwita Yesu
  choice: Bwana
  alternative: Mheshimiwa
  rationale: “Bwana” huhifadhi namna ya heshima ya kumwita Yesu na pia mwangwi unaowezekana wa cheo chake katika Injili ya Yohana, bila kulazimisha maana moja pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye hadhi na inayoeleweka kwa urahisi. Mfuatano wa vitenzi vya -ka- umetumiwa kwa usimulizi wa asili, huku “wewe” likihifadhi sisitizo la Kigiriki.
