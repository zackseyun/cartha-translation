  yaml_path: translation/nt/john/013/009.yaml
  text: Simon Peter says to him[a], “Lord, not only my feet, but also my hands and my head.”
translation:
  language: sw
  text: Simoni Petro akamwambia, “Bwana,[a] usinioshe miguu yangu tu, bali pia mikono yangu na kichwa changu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au “Mkuu.” Kigiriki: kyrios.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: akamwambia
  rationale: Wakati uliopo wa kihistoria katika simulizi la Kigiriki umetafsiriwa kwa wakati wa masimulizi wa Kiswahili ili sentensi isomeke kwa kawaida huku ikiendeleza tukio.
- source_word: αὐτῷ
  choice: akamwambia
  rationale: Kiambishi -mw- kinawakilisha kiwakilishi cha Kigiriki ‘kwake’ bila kutaja Yesu kwa jina, kwa kuwa Kigiriki pia kinatumia kiwakilishi.
- source_word: Σίμων Πέτρος
  choice: Simoni Petro
  rationale: Majina yametolewa kwa maumbo yaliyozoeleka katika Kiswahili cha Biblia.
- source_word: Κύριε
  choice: Bwana
  rationale: ‘Bwana’ ni tafsiri ya kawaida ya κύριος kama namna ya kumwita Yesu, na inadumisha heshima pamoja na mwangwi wake wa kitheolojia.
- source_word: μὴ ... μόνον ἀλλὰ καὶ
  choice: si ... tu, bali pia
  rationale: 'Muundo huu wa Kiswahili unaonyesha upanuzi wa mkazo: si sehemu moja pekee, bali sehemu nyingine pia.'
- source_word: τοὺς πόδας μου
  choice: miguu yangu
  rationale: Ni tafsiri ya moja kwa moja ya nomino ya wingi pamoja na kimilikishi.
- source_word: τὰς χεῖρας
  choice: mikono yangu
  rationale: Ingawa kimilikishi hakirudiwi katika Kigiriki, kinahusika na viungo vyote vilivyounganishwa; Kiswahili hukitaja ili maana iwe wazi na ya kawaida.
- source_word: τὴν κεφαλήν
  choice: kichwa changu
  rationale: ‘Kichwa’ ni maana ya kawaida hapa, na kimilikishi kilichoeleweka katika mfuatano huo kimetajwa kwa Kiswahili.
theological_decisions:
- issue: Tafsiri ya κύριος kama namna ya kumwita Yesu
  choice: Bwana
  alternative: Mwalimu Mkuu
  rationale: ‘Bwana’ huhifadhi maana ya kawaida ya cheo hiki katika Agano Jipya na mwangwi wake wa Kiyohana bila kulazimisha maana moja tu ya kitheolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Usemi wa Petro umewekwa kwa namna ya kawaida ya Kiswahili; kitenzi ‘usinioshe’ kimebainishwa kutokana na kitendo kinachoeleweka katika muktadha wa aya zilizotangulia.
