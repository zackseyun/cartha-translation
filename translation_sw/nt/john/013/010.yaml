  text: λέγει αὐτῷ ⸀ὁ Ἰησοῦς· Ὁ λελουμένος ⸂οὐκ ἔχει χρείαν⸃ ⸂εἰ μὴ⸃ τοὺς πόδας νίψασθαι, ἀλλ’ ἔστιν καθαρὸς ὅλος· καὶ ὑμεῖς καθαροί ἐστε, ἀλλ’ οὐχὶ πάντες.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/010.yaml
  text: Jesus said to him[a], “The one who has bathed has no need except to wash his feet, but is completely clean. And you are clean, but not all of you.”
translation:
  language: sw
  text: Yesu akamwambia, “Mtu aliyekwisha kuoga[a] hana haja ya kuosha kitu kingine isipokuwa miguu yake, bali ni safi kabisa. Nanyi ni safi, lakini si nyote.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kigiriki kinatumia vitenzi viwili tofauti vya kuosha: λούω, ‘kuoga’ au kuosha mwili mzima, na νίπτω, ‘kuosha’ sehemu ya mwili, kama vile miguu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: Yesu akamwambia
  rationale: Kauli ya sasa ya kihistoria λέγει imetafsiriwa kwa wakati wa masimulizi wa Kiswahili ili simulizi lisikike la kawaida, huku αὐτῷ ikiwakilishwa na kiambishi -mw-.
- source_word: Ὁ λελουμένος
  choice: Mtu aliyekwisha kuoga
  rationale: Kitenzi λούω hapa ni cha kuoga au kuosha mwili mzima; umbo la timilifu linaonyesha tendo lililokamilika na hali inayoendelea, jambo linalosaidiwa na ‘aliyekwisha kuoga’.
- source_word: οὐκ ἔχει χρείαν
  choice: hana haja
  rationale: Hii ni tafsiri ya kawaida na ya moja kwa moja ya nahau ya Kigiriki ἔχει χρείαν.
- source_word: εἰ μὴ
  choice: isipokuwa
  rationale: Hutambulisha jambo pekee linalotengwa na kauli iliyotangulia.
- source_word: τοὺς πόδας νίψασθαι
  choice: kuosha chochote isipokuwa miguu yake
  rationale: νίπτω hutumiwa kwa kuosha sehemu ya mwili, hapa miguu. ‘Miguu yake’ huonyesha kwa kawaida kwamba ni miguu ya mtu aliyekwisha kuoga; ‘chochote’ hukamilisha kwa Kiswahili muundo wa ‘hana haja ... isipokuwa’.
- source_word: καθαρὸς ὅλος
  choice: ni safi mwili wote
  rationale: ὅλος inasisitiza ukamilifu wa usafi; ‘mwili wote’ huunganisha kwa uwazi na picha halisi ya kuoga bila kufuta maana pana ya kiishara.
- source_word: καὶ ὑμεῖς καθαροί ἐστε
  choice: Nanyi ni safi
  rationale: Huhifadhi wingi wa nafsi ya pili na kurudia neno καθαρός, ambalo linaweza kuwa na maana halisi na ya kiroho.
- source_word: ἀλλ’ οὐχὶ πάντες
  choice: lakini si nyote
  rationale: Huweka wazi kwamba tamko la usafi halimhusu kila mmoja katika kundi la wanafunzi.
theological_decisions:
- issue: Picha halisi ya kuosha na maana ya kiishara au kiroho ya usafi
  choice: Kuhifadhi ‘kuoga,’ ‘kuosha ... miguu,’ na ‘safi’ bila kufafanua ishara hiyo katika matini kuu.
  alternative: Kusema wazi ‘safi kiroho,’ au kutafsiri λούω na νίπτω zote kwa kitenzi kilekile bila kubainisha tofauti.
  rationale: Muktadha unaruhusu maana halisi na ya kiishara kutenda pamoja. Kutofafanua zaidi kunahifadhi mvutano huo wa kiteolojia na kuepuka kuingiza tafsiri ya kimadhehebu.
- issue: Mshiriki wa umoja wa kiume anayetumiwa kwa maana ya jumla
  choice: Mtu aliyekwisha kuoga
  alternative: Yeye aliyekwisha kuoga; mwanamume aliyekwisha kuoga
  rationale: ‘Mtu’ huhifadhi umoja na maana ya jumla bila kuufanya usemi umhusu mwanamume pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Akamwambia’ linafaa mtiririko wa simulizi; ‘aliyekwisha kuoga’ ni wazi kwa wasomaji wa kawaida na huhifadhi hali ya tendo lililokamilika. Alama ya tanbihi [a] imewekwa mara tu baada ya ‘kuoga,’ mahali ambapo tofauti ya vitenzi inahusika.
