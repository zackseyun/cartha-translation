base_translation:
  language: en
  yaml_path: translation/nt/john/013/015.yaml
  text: For I have given you an example[a], so that just as I have done to you[c][b], you also may do.
translation:
  language: sw
  text: Kwa maana nimewapa[b] mfano[a], ili kama nilivyowatendea[c], nanyi pia mfanye vivyo hivyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kielelezo” au “kigezo.”
    reason: lexical_alternative
  - marker: b
    text: Au “niliwapa mfano.” Kigiriki kinatumia wakati uliopita; “nimewapa” linaonyesha pia umuhimu wa sasa wa tendo hilo katika muktadha.
    reason: lexical_alternative
  - marker: c
    text: Au “kama nilivyowafanyia.” Kauli ya Kigiriki inaweza kueleza jambo alilowatendea au alilowafanyia.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπόδειγμα
  choice: mfano
  rationale: Neno hili humaanisha mfano, kielelezo, au kigezo kinachowekwa ili kuigwa. “Mfano” ni neno la kawaida na linaloeleweka, huku muktadha ukionyesha wazi kuwa si mfano wa hadithi bali tendo la kuigwa.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Kiunganishi hiki kinaonyesha kwamba Yesu anaeleza sababu au maana ya tendo na agizo lililotangulia.
- source_word: ἔδωκα ὑμῖν
  choice: nimewapa
  rationale: Ingawa ἔδωκα ni njeo ya wakati uliopita, kauli timilifu ya Kiswahili inaonyesha kwa kawaida tendo lililofanyika karibuni ambalo matokeo yake bado yana umuhimu kwa wanafunzi.
- source_word: ἵνα
  choice: ili
  rationale: “Ili” linaonyesha kusudi la Yesu kutoa mfano huo kwa uwazi na kwa Kiswahili cha kawaida.
- source_word: καθὼς
  choice: kama
  rationale: Katika muundo “kama nilivyo…,” neno hili linaonyesha ulinganifu kati ya tendo la Yesu na tendo linalotarajiwa kwa wanafunzi.
- source_word: ἐποίησα ὑμῖν
  choice: nilivyowatendea
  rationale: Kitenzi “watendea” kinaunganisha maana pana ya ποιέω na yambwa ya kisarufi ὑμῖν bila kulazimisha iwapo msisitizo ni “kwa ajili yenu” au “kwenu.” Pia kinafaa kwa tendo la Yesu la kuwaosha miguu.
- source_word: καὶ ὑμεῖς
  choice: nanyi pia
  rationale: Muundo huu unahifadhi msisitizo wa kuwahusisha wanafunzi nao katika kutenda kwa namna inayolingana na Yesu.
- source_word: ποιῆτε
  choice: mfanye vivyo hivyo
  rationale: Baada ya “ili,” “mfanye” huwasilisha kusudi linalotarajiwa. “Vivyo hivyo” huweka wazi kwa Kiswahili cha kawaida namna ya tendo iliyoachwa ikieleweka katika Kigiriki.
theological_decisions:
- issue: Nguvu ya kauli ya Yesu kuhusu wanafunzi kuiga tendo lake
  choice: Tafsiri inaonyesha kwamba tendo la Yesu ni mfano unaopaswa kuigwa, bila kuamua kama mstari huu unaanzisha desturi ya lazima ya kuoshana miguu katika kila mazingira.
  alternative: Kuutafsiri moja kwa moja kama amri ya ibada maalumu kwa waamini wote, au kuufanya kuwa ishara tu isiyodai tendo halisi la kuiga.
  rationale: Mstari unasema wazi kuwa Yesu alitoa mfano kwa kusudi la wanafunzi kutenda kwa namna inayolingana. Hata hivyo, wenyewe hauamui upeo wa kiibada au wa kitaasisi wa tendo hilo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo “kama nilivyowatendea” ni wa asili na unaepuka kufafanua kupita kiasi maana ya ὑμῖν; “mfanye vivyo hivyo” ni wazi bila kuingiza hitimisho la kimadhehebu.
