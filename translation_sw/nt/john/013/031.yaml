id: JHN.13.31
reference: John 13:31
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ὅτε ⸀οὖν ἐξῆλθεν ⸀λέγει Ἰησοῦς· Νῦν ἐδοξάσθη ὁ υἱὸς τοῦ ἀνθρώπου, καὶ ὁ θεὸς ἐδοξάσθη ἐν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/013/031.yaml
  text: So when he had gone out[a], Jesus said, “Now the Son of Man has been glorified, and God has been glorified in him.”
translation:
  language: sw
  text: Basi, alipotoka, Yesu akasema, “Sasa Mwana wa Adamu ametukuzwa, na Mungu ametukuzwa ndani yake[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa njia yake.” Kirai cha Kigiriki kinaweza kueleweka kuwa Mungu ametukuzwa ndani ya Mwana au kwa njia ya Mwana.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὅτε οὖν
  choice: Basi, alipotoka
  rationale: Muundo huu unaunganisha maana ya wakati ya ὅτε na mwendelezo wa simulizi unaoonyeshwa na οὖν kwa Kiswahili cha kawaida na cha asili.
- source_word: ἐξῆλθεν
  choice: alipotoka
  rationale: Kitenzi hiki kinarejelea kuondoka kwa Yuda katika muktadha uliotangulia na kinadumisha wazo la kutoka mahali fulani bila kuongeza maelezo yasiyomo katika maandishi.
- source_word: λέγει
  choice: akasema
  rationale: Ingawa Kigiriki kinatumia wakati wa sasa wa kihistoria, wakati wa simulizi wa Kiswahili unasomeka kwa kawaida kwa kutumia ‘akasema.’
- source_word: Νῦν
  choice: Sasa
  rationale: ‘Sasa’ linahifadhi nguvu ya wakati na ya mazungumzo, likionyesha hatua mpya baada ya Yuda kutoka.
- source_word: ἐδοξάσθη
  choice: ametukuzwa
  rationale: Kauli tendwa ya wakati uliopita inawasilishwa kwa hali timilifu ya Kiswahili, ambayo inaonyesha tukio lililoanza kutimia na umuhimu wake wa sasa bila kubainisha kwa lazima hatua moja tu ya kutukuzwa huko.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  rationale: Hili ni jina la kujitambulisha la Yesu lenye mwangwi muhimu wa kimaandiko; tafsiri hii ya jadi inalihifadhi kama cheo.
- source_word: ὁ θεὸς
  choice: Mungu
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya θεός katika muktadha huu.
- source_word: ἐν αὐτῷ
  choice: ndani yake
  rationale: Tafsiri hii inadumisha maana ya msingi ya kimahali au kimahusiano ya ἐν αὐτῷ, huku uwezekano wa maana ya kiutendaji ukihifadhiwa katika tanbihi.
theological_decisions:
- issue: Maana ya kutukuzwa kwa Mwana wa Adamu
  choice: Kauli zote mbili zimetafsiriwa kama kutukuzwa ambako sasa kumetimia au kumeanzishwa, bila kulifungamanisha na kusulubiwa, kufufuka, au kuinuliwa pekee.
  alternative: Kulielekeza hasa kwenye kusulubiwa pekee, au hasa kwenye kufufuka na kuinuliwa pekee.
  rationale: Kauli ya Yesu inaacha upana wa kitheolojia unaoweza kujumuisha mfululizo mzima wa kifo, kufufuka, na kurudi kwake kwa Baba; tafsiri haipunguzi upana huo.
- issue: Nguvu ya ἐν αὐτῷ
  choice: ndani yake
  alternative: kwa njia yake
  rationale: Kirai kinaweza kueleweka kwa maana ya kimahusiano (‘ndani yake’) au ya kiutendaji (‘kwa njia yake’). Maandishi makuu yanafuata maana ya karibu zaidi na muundo wa Kigiriki, na tanbihi inadumisha uwezekano mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo ni wa asili katika simulizi la Kiswahili, na istilahi ‘Mwana wa Adamu’ pamoja na ‘ametukuzwa’ zinadumisha mwangwi na uzito wa maandishi ya chanzo.
