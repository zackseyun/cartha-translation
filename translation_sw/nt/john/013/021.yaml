  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ταῦτα εἰπὼν ⸀ὁ Ἰησοῦς ἐταράχθη τῷ πνεύματι καὶ ἐμαρτύρησεν καὶ εἶπεν· Ἀμὴν ἀμὴν λέγω ὑμῖν ὅτι εἷς ἐξ ὑμῶν παραδώσει με.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/021.yaml
  text: After saying these things[a], Jesus was troubled in spirit, and testified and said, “Truly, truly, I say to you, one of you will betray me.”
translation:
  language: sw
  text: Baada ya kusema mambo hayo, Yesu alifadhaika rohoni, akashuhudia na kusema, “Amin, amin, nawaambia, mmoja wenu atanisaliti[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya karibu zaidi, “atanikabidhi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα εἰπὼν
  choice: Baada ya kusema mambo hayo
  rationale: Kirai cha kitenzi kishirikishi cha wakati uliopita kinaonyesha mfuatano wa matukio; tafsiri hii ni ya kawaida katika Kiswahili na inadumisha maana hiyo.
- source_word: ἐταράχθη τῷ πνεύματι
  choice: alifadhaika rohoni
  rationale: Neno hili linaonyesha msukosuko au huzuni ya ndani. “Rohoni” inadumisha hali au eneo la ndani linaloonyeshwa na τῷ πνεύματι bila kuongeza kiwango kisichotajwa.
- source_word: ἐμαρτύρησεν
  choice: akashuhudia
  rationale: Inadumisha msamiati muhimu wa Yohana wa kutoa ushuhuda na uzito wa tamko la Yesu, badala ya kulifanya kuwa taarifa ya kawaida tu.
- source_word: Ἀμὴν ἀμὴν
  choice: Amin, amin
  rationale: Inahifadhi marudio na uzito wa fomula ya Yesu katika Injili ya Yohana; “Amin” ni neno linaloeleweka na kutumika kwa kawaida katika Kiswahili cha kibiblia.
- source_word: λέγω ὑμῖν
  choice: nawaambia
  rationale: Ni namna ya moja kwa moja na ya asili ya Kiswahili ya kuwasilisha kitenzi pamoja na kiwakilishi cha wale wanaoambiwa.
- source_word: εἷς ἐξ ὑμῶν
  choice: mmoja wenu
  rationale: Ni Kiswahili cha kawaida kinachohifadhi maana ya mmoja kutoka miongoni mwa wanafunzi waliokuwapo.
- source_word: παραδώσει με
  choice: atanisaliti
  rationale: Katika muktadha wa tendo la Yuda, “atanisaliti” linafikisha kwa usahihi nguvu ya kimuktadha ya παραδίδωμι. Maana ya karibu zaidi ya kumkabidhi mtu imehifadhiwa katika tanbihi.
theological_decisions:
- issue: Jinsi ya kueleza kufadhaika kwa Yesu kwa ndani
  choice: alifadhaika rohoni
  alternative: alifadhaika katika roho yake
  rationale: Tafsiri hii inaacha wazi uhalisi wa msukosuko wa ndani wa Yesu bila kuupunguza wala kuufafanua kwa mfumo wa kiteolojia usiotajwa katika mstari.
- issue: Maana ya παραδίδωμι katika utabiri wa usaliti
  choice: atanisaliti
  alternative: atanikabidhi
  rationale: Muktadha unaonyesha tendo la hiana la mmoja wa wanafunzi, hivyo “atanisaliti” linaeleza maana inayokusudiwa kwa uwazi. Hata hivyo, “atanikabidhi” linahifadhiwa katika tanbihi kwa sababu ndilo linalofuata kwa karibu zaidi maana ya msingi ya kitenzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya simulizi la Injili. Muundo “Amin, amin” umetumiwa kuhifadhi fomula ya kipekee ya Yohana na marudio ya Kigiriki; sentensi nyingine imewekwa katika mtiririko wa kawaida unaoeleweka kwa wasomaji wa leo.
