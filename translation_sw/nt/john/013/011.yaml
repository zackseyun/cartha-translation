  text: ᾔδει γὰρ τὸν παραδιδόντα αὐτόν· διὰ τοῦτο εἶπεν ⸀ὅτι Οὐχὶ πάντες καθαροί ἐστε.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/011.yaml
  text: For he knew the one who was betraying him; for this reason he said[a], “Not all of you are clean.”
translation:
  language: sw
  text: Kwa maana alimjua yule aliyekuwa akimsaliti[a]; kwa sababu hiyo alisema, “Si ninyi nyote mlio safi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa maana ya karibu zaidi na neno lenyewe, “aliyekuwa akimkabidhi.” Katika muktadha, hii inahusu Yuda kumsaliti Yesu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾔδει
  choice: alimjua
  rationale: Ingawa umbo la kitenzi ni la wakati timilifu uliopita, οἶδα kwa kawaida huonyesha hali ya kujua; hapa ‘alimjua’ ni simulizi la kawaida linaloeleza kwamba Yesu alijua mtu huyo.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Kiunganishi hiki kinaeleza sababu ya kauli iliyotangulia na kudumisha uhusiano huo waziwazi.
- source_word: τὸν παραδιδόντα αὐτόν
  choice: yule aliyekuwa akimsaliti[a]
  rationale: παραδίδωμι humaanisha kihalisi ‘kukabidhi,’ lakini katika muktadha huu wa simulizi la mateso inaeleza tendo la usaliti. Umbo ‘aliyekuwa akimsaliti’ pia linadumisha nguvu ya kirai-shirikishi cha Kigiriki. Maana ya karibu zaidi na neno lenyewe imehifadhiwa katika tanbihi.
- source_word: διὰ τοῦτο
  choice: kwa sababu hiyo
  rationale: Kirai hiki kinaonyesha wazi kwamba Yesu alisema maneno yaliyofuata kwa sababu alimjua msaliti.
- source_word: εἶπεν ὅτι
  choice: alisema
  rationale: Katika Kiswahili, ‘alisema’ huanzisha usemi wa moja kwa moja kwa njia ya kawaida; ὅτι inawakilishwa na alama za kunukuu.
- source_word: Οὐχὶ πάντες
  choice: Si ninyi nyote
  rationale: Hii inadumisha ukanushaji wenye mkazo kiasi na kufanya wazi kwamba Yesu anazungumza na kundi la wanafunzi.
- source_word: καθαροί ἐστε
  choice: mlio safi
  rationale: ‘Safi’ huhifadhi mwangwi wa kuoshwa kimwili pamoja na maana ya ndani ya kiroho au kimaadili, bila kuamua upande mmoja pekee.
theological_decisions:
- issue: Maana ya παραδιδόντα kuhusiana na tendo la Yuda
  choice: akimsaliti
  alternative: akimkabidhi
  rationale: Katika muktadha, tendo la kumkabidhi Yesu ni usaliti; ‘akimsaliti’ huwasilisha maana hiyo kwa msomaji wa kawaida. Hata hivyo, maana pana na ya karibu zaidi na neno la Kigiriki imehifadhiwa katika tanbihi.
- issue: Maana ya καθαροί katika mazungumzo kuhusu kuoshwa miguu
  choice: safi
  alternative: watakatifu / wenye usafi wa moyo
  rationale: ‘Safi’ hudumisha kwa pamoja taswira halisi ya kuoshwa na maana ya hali ya ndani; tafsiri za ‘watakatifu’ au ‘wenye usafi wa moyo’ zingefafanua mno upande wa kiroho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa maandiko. ‘Kwa maana’ na ‘kwa sababu hiyo’ zinaweka wazi mantiki ya sentensi, huku ‘safi’ ikihifadhi maana mbili zinazotokana na muktadha wa kuoshwa miguu.
