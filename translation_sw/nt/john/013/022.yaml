translation:
  language: sw
  text: Wanafunzi walikuwa wakitazamana, wakiwa na shaka kuhusu ni nani aliyekuwa akimzungumzia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wanafunzi waliendelea kutazamana, wakiwa wamechanganyikiwa kuhusu ni nani aliyekuwa akimzungumzia.”
    reason: Mbadala huu huonyesha kwa uwazi zaidi uwezekano wa tendo lililoendelea au kurudiwa katika ἔβλεπον na maana ya kutatanika katika ἀπορούμενοι.
lexical_decisions:
- source_word: ἔβλεπον
  choice: walikuwa wakitazamana
  rationale: Wakati usiotimilifu unaonyesha tendo lililokuwa likiendelea; kitenzi cha kutendeana “wakitazamana” huunganisha kwa Kiswahili asilia wazo la kuangalia na εἰς ἀλλήλους.
- source_word: εἰς ἀλλήλους
  choice: wakitazamana
  rationale: Kirai hiki huonyesha kuwa wanafunzi waliangaliana wao kwa wao; umbo la kutendeana linaeleza maana hiyo kwa ufupi na kwa kawaida.
- source_word: οἱ μαθηταὶ
  choice: wanafunzi
  rationale: Kundi linalojulikana kutokana na muktadha ndilo linalorejelewa; Kiswahili hakihitaji kuongeza “wake,” ambalo halipo wazi katika Kigiriki.
- source_word: ἀπορούμενοι
  choice: wakiwa hawajui
  rationale: Kishirikishi kinaonyesha hali ya kutojua au kuwa na mashaka. Kauli hii ni ya kawaida na inaeleweka, bila kuamua zaidi ya chanzo.
- source_word: περὶ τίνος
  choice: juu ya nani
  rationale: περί pamoja na kiwakilishi cha kuuliza katika hali ya genitivi huuliza mtu anayezungumziwa; “juu ya nani” ni sahihi na ya kawaida katika Kiswahili sanifu.
- source_word: λέγει
  choice: alikuwa akisema
  rationale: Ingawa Kigiriki kina wakati wa sasa wa kihistoria, umbo la kuendelea katika wakati uliopita linafaa katika simulizi ya Kiswahili na linahifadhi maana ya kusema bila kuitafsiri kuwa “kumaanisha.”
