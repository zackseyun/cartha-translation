  text: Do not be amazed that I told you[b][a], ‘You must be born from above.’
translation:
  language: sw
  text: Usistaajabu kwamba nilikuambia[b], “Ni lazima mzaliwe kutoka juu[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mzaliwe tena,” au “mzaliwe upya.” Neno la Kigiriki ἄνωθεν linaweza kumaanisha “kutoka juu” au “tena/upya.”
    reason: alternative_reading
  - marker: b
    text: Katika Kigiriki, “nilikuambia” humwelekea mtu mmoja, lakini “mzaliwe” huwaelekea watu wengi.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ θαυμάσῃς
  choice: Usistaajabu
  rationale: μή pamoja na kitenzi cha hali tegemezi ya aoristi hutoa katazo. “Usistaajabu” ni Kiswahili cha kawaida na chenye heshima kinachowasilisha nguvu ya θαυμάζω.
- source_word: ὅτι
  choice: kwamba
  rationale: Hapa ὅτι inatanguliza jambo ambalo Yesu alikuwa amesema; “kwamba” linafaa kwa muundo na maana hiyo.
- source_word: εἶπόν σοι
  choice: nilikuambia
  rationale: σοι ni umoja. “Nilikuambia” ni usemi wa asili wa Kiswahili unaohifadhi maelekezo ya moja kwa moja kwa Nikodemo.
- source_word: Δεῖ
  choice: Ni lazima
  rationale: Δεῖ huonyesha ulazima. “Ni lazima” ni wazi, la kawaida, na linahifadhi uzito wa kauli.
- source_word: ὑμᾶς
  choice: ninyi
  rationale: Kiwakilishi hiki ni wingi. Kiswahili kinaweza kuonyesha tofauti hiyo wazi kwa “ninyi,” tofauti na “-ku-” ya umoja katika “nilikuambia.”
- source_word: γεννηθῆναι
  choice: mzaliwe
  rationale: Hali ya kutendwa ya γεννάω katika muktadha huu inaelezwa kwa kawaida na kwa usahihi kama “kuzaliwa.”
- source_word: ἄνωθεν
  choice: kutoka juu
  rationale: ἄνωθεν inaweza kumaanisha “kutoka juu” au “tena/upya.” “Kutoka juu” huhifadhi wazo la asili ya mbinguni katika Injili ya Yohana, huku maana nyingine ikibainishwa katika tanbihi.
theological_decisions:
- issue: Maana ya ἄνωθεν katika kauli kuhusu kuzaliwa
  choice: kutoka juu
  alternative: tena; upya
  rationale: Neno hili lina maana zaidi ya moja katika Yohana 3. Matumizi yake katika Injili ya Yohana na msisitizo wa kuzaliwa kunakotoka kwa Mungu yanaunga mkono “kutoka juu” katika matini kuu, lakini uwezekano wa “tena/upya” umehifadhiwa katika tanbihi ili kutoondoa mvutano wa kimakusudi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, ya kawaida, na yenye heshima. Tofauti ya umoja na wingi katika Kigiriki imeonyeshwa wazi kwa “nilikuambia” na “ninyi mzaliwe.”
