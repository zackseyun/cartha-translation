  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἦν δὲ καὶ ⸀ὁ Ἰωάννης βαπτίζων ἐν Αἰνὼν ἐγγὺς τοῦ Σαλείμ, ὅτι ὕδατα πολλὰ ἦν ἐκεῖ, καὶ παρεγίνοντο καὶ ἐβαπτίζοντο·
base_translation:
  language: en
  yaml_path: translation/nt/john/003/023.yaml
  text: John also was baptizing at Aenon near Salim[a], because there were many waters there[b], and people were coming and being baptized.
translation:
  language: sw
  text: Yohana pia alikuwa akibatiza huko Ainoni karibu na Salimu, kwa sababu kulikuwa na maji mengi huko, na watu walikuwa wakija na kubatizwa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kitenzi kilichotafsiriwa “akibatiza” na “kubatizwa” kinaweza pia kutafsiriwa “akizamisha” na “kuzamishwa.” Hapa istilahi iliyozoeleka “batiza” imetumiwa, nayo yenyewe haiamui namna ya tendo hilo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ καὶ ὁ Ἰωάννης βαπτίζων
  choice: Yohana pia alikuwa akibatiza
  rationale: δέ ni kiunganishi chepesi cha mazungumzo ambacho hakihitaji kutafsiriwa kwa neno tofauti hapa; καί inaonyesha kwamba Yohana pia alikuwa akifanya tendo hilo. ἦν pamoja na βαπτίζων huonyesha tendo lililoendelea wakati uliopita.
- source_word: ἐν Αἰνὼν ἐγγὺς τοῦ Σαλείμ
  choice: huko Ainoni karibu na Salimu
  rationale: Majina ya maeneo yametoholewa kwa mwandiko unaosomeka kwa Kiswahili; ἐν inaonyesha mahali, na ἐγγύς inaonyesha ukaribu.
- source_word: ὅτι ὕδατα πολλὰ ἦν ἐκεῖ
  choice: kwa sababu kulikuwa na maji mengi huko
  rationale: ὅτι ina maana ya sababu katika muktadha huu. Kiswahili 'maji mengi' huhifadhi wingi wa ὕδατα πολλὰ kwa njia ya kawaida na wazi.
- source_word: παρεγίνοντο
  choice: watu walikuwa wakija
  rationale: Kitenzi cha wakati uliopita usiotimilika huonyesha kuja kulikokuwa kukiendelea au kurudiwa. Kiima 'watu' kimewekwa wazi kwa sababu ya matumizi ya kawaida ya Kiswahili.
- source_word: ἐβαπτίζοντο
  choice: na kubatizwa
  rationale: Umbo la kutendwa na wakati usiotimilika linaonyesha kwamba waliipokea batizo mara kwa mara au kwa kuendelea; muundo huu unaungana kiasili na 'walikuwa wakija'.
theological_decisions:
- issue: Tafsiri ya βαπτίζω
  choice: akibatiza / kubatizwa
  alternative: akizamisha / kuzamishwa
  rationale: ‘Batiza’ ni istilahi iliyozoeleka ya Agano Jipya na haiamui peke yake namna ya tendo hilo. Tafsiri ya ‘zamisha’ inaweza kusisitiza namna fulani ya ubatizo; kwa hiyo imehifadhiwa katika tanbihi badala ya kuwekwa katika matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo 'alikuwa akibatiza' na 'walikuwa wakija' unahifadhi hali ya tendo lililoendelea. Tanbihi imewekwa baada ya sehemu inayohusiana na matumizi yote mawili ya kitenzi.
