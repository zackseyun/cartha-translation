translation:
  language: sw
  text: Baba anampenda Mwana, naye amekabidhi vitu vyote mkononi mwake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa tafsiri ya karibu: “ameweka vitu vyote mkononi mwake.” Usemi wa Kigiriki wa kuweka kitu “mkononi” unaweza kuashiria kukabidhi mamlaka au umiliki.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πατὴρ
  choice: Baba
  rationale: Katika muktadha wa Yohana, hili ni jina la kimahusiano linalomtaja Mungu akiwa Baba kwa uhusiano wake na Mwana. Kiswahili hakihitaji kibainishi kinacholingana na ὁ hapa.
- source_word: ἀγαπᾷ
  choice: anampenda
  rationale: Wakati uliopo unaeleza ukweli wa sasa na unaoendelea; kauli ya kawaida ya Kiswahili huwasilisha maana hiyo kwa ufasaha.
- source_word: τὸν υἱόν
  choice: Mwana
  rationale: Hili ni jina la kimahusiano linalomrejelea Yesu katika uhusiano wake na Baba; herufi kubwa inaonyesha matumizi hayo ya kipekee.
- source_word: πάντα
  choice: vitu vyote
  rationale: Nomino-vumishi ya wingi wa kijinsia kati ina maana pana ya ‘vitu vyote’; tafsiri hii hudumisha upana wake bila kuubana.
- source_word: δέδωκεν
  choice: amekabidhi
  rationale: Kauli timilifu inaonyesha tendo lililokamilika lenye matokeo yanayoendelea. ‘Amekabidhi’ hutoa kwa kawaida wazo la kutoa pamoja na dhamana, ambalo linaafikiana na usemi unaofuata kuhusu mkono.
- source_word: ἐν τῇ χειρὶ αὐτοῦ
  choice: mkononi mwake
  rationale: Tafsiri hii inadumisha taswira ya umoja ya ‘mkono’ na pia inasikika kwa kawaida kama usemi wa kukabidhi mamlaka au milki.
theological_decisions:
- issue: Uhusiano wa Baba na Mwana
  choice: Majina ya kimahusiano ‘Baba’ na ‘Mwana’ yamedumishwa bila kufafanuliwa zaidi.
  alternative: Kuyatumia kama majina ya kawaida ya kifamilia au kuyaeleza kwa maneno ya ziada ya kimafundisho.
  rationale: Muktadha unamtaja Mungu na Yesu kwa majina haya ya kipekee, lakini mstari wenyewe hauhitaji nyongeza ya ufafanuzi wa kimafundisho.
- issue: Upeo na matokeo yanayoendelea ya alichokabidhiwa Mwana
  choice: ‘Amekabidhi vitu vyote’ hudumisha upeo wa πάντα na matokeo yanayoendelea ya δέδωκεν.
  alternative: ‘Alimpa kila kitu,’ ambayo inaweza kusikika kama tendo la zamani tu na kupunguza wazo la mamlaka iliyokabidhiwa.
  rationale: Tafsiri inalinda dai pana la mstari na hali ya sasa inayotokana na tendo lililokamilika, bila kuingiza mfumo wa baadaye wa kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Naye’ huunganisha vishazi kwa ufasaha; ‘mkononi mwake’ huhifadhi taswira ya Kigiriki huku ‘amekabidhi’ ikifanya maana ya usemi huo ieleweke kwa msomaji wa kawaida.
