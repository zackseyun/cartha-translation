source:
  edition: SBLGNT
  text: ⸀ἀπεκρίθη Ἰησοῦς· Ἀμὴν ἀμὴν λέγω σοι, ἐὰν μή τις γεννηθῇ ἐξ ὕδατος καὶ πνεύματος, οὐ δύναται εἰσελθεῖν εἰς τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/005.yaml
  text: Jesus answered[a], “Truly, truly, I say to you, unless someone is born of water and the Spirit[b], he is not able to enter the kingdom of God.”
translation:
  language: sw
  text: Yesu akajibu, “Amin, amin, ninakuambia, mtu asipozaliwa kwa maji na kwa Roho[a], hawezi kuingia katika ufalme wa Mungu.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa maji na kwa roho.” Katika maandishi ya awali ya Kiyunani, hakuna utofauti wa herufi kubwa na ndogo wa kutofautisha “Roho” na “roho,” ingawa “Roho,” yaani Roho Mtakatifu, yaelekea kuwa maana hapa.
    reason: alternative_reading
  - marker: b
    text: Maneno “kwa maji na kwa Roho” yameeleweka kwa njia mbalimbali, kutia ndani kuwa taswira ya kutakaswa na kufanywa upya, kurejelea kuzaliwa kimwili na kuzaliwa kiroho, au kurejelea ubatizo. Tafsiri hii inadumisha maneno ya Kiyunani bila kuamua suala hilo katika matini kuu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: akajibu
  rationale: Ni simulizi la kawaida na la asili katika Kiswahili kwa jibu linalofuata mazungumzo.
- source_word: Ἀμὴν ἀμὴν
  choice: Amin, amin
  rationale: Huhifadhi moja kwa moja fomula ya Kiyunani iliyosisitizwa kwa kurudiwa; ‘amin’ inaeleweka katika lugha ya Biblia ya Kiswahili.
- source_word: λέγω σοι
  choice: ninakuambia
  rationale: Ni Kiswahili cha kawaida chenye uzito wa tamko la moja kwa moja; kiambishi -ku- huhifadhi umoja wa σοι.
- source_word: ἐὰν μή τις
  choice: mtu asipo-
  rationale: Huwakilisha sharti hasi na mhusika asiyeainishwa bila kuingiza jinsia ya kiume.
- source_word: γεννηθῇ
  choice: azaliwe
  rationale: Huhifadhi hali ya kutendwa ya γεννάω; hapa hakuna ἄνωθεν, kwa hiyo ‘tena’ au ‘kutoka juu’ haijaongezwa.
- source_word: ἐξ ὕδατος καὶ πνεύματος
  choice: kwa maji na kwa Roho
  rationale: ‘Kwa’ ni ya asili pamoja na ‘kuzaliwa’ na inaweza kuonyesha chanzo au njia bila kufafanua kupita kiasi; kurudia ‘kwa’ kunafanya uhusiano wa vipengele vyote viwili uwe wazi huku ‘Roho’ ikionyesha rejeo linalowezekana zaidi kwa Roho Mtakatifu.
- source_word: οὐ δύναται
  choice: hawezi
  rationale: Ni namna ya kawaida na sahihi ya Kiswahili ya kueleza kutoweza.
- source_word: εἰσελθεῖν
  choice: kuingia
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida katika muktadha huu.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: ufalme wa Mungu
  rationale: Ni usemi uliozoeleka na sahihi unaohifadhi upana wa maana ya βασιλεία bila kuilazimisha iwe eneo pekee au utawala pekee.
theological_decisions:
- issue: Maana ya πνεύματος katika ἐξ ὕδατος καὶ πνεύματος
  choice: Roho, ikielekea kumaanisha Roho Mtakatifu
  alternative: roho, kwa maana isiyobainishwa au kanuni ya kiroho
  rationale: Muktadha wa Yohana unaelekeza zaidi kwa Roho Mtakatifu, lakini Kiyunani hakina herufi kubwa wala kibainishi kinachoweza kumaliza suala hilo; usomaji mwingine umehifadhiwa katika tanbihi.
- issue: Maana ya ‘maji na Roho’
  choice: Maneno ya Kiyunani yamehifadhiwa bila kubainisha taswira hiyo katika matini kuu
  alternative: maji kama uzazi wa kimwili na Roho kama uzazi wa kiroho; au maji kama ubatizo hasa; au maji na Roho kama utakaso na kufanywa upya
  rationale: Kifungu kina historia ya tafsiri mbalimbali. Matini kuu haipaswi kuingiza msimamo maalumu wa dhehebu ambao Kiyunani pekee haulazimishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Amin, amin’ hudumisha uzito na marudio ya fomula ya Yesu; sentensi iliyobaki ni rahisi kueleweka kwa msomaji wa kawaida. Alama zote za tanbihi zimewekwa katika matini kuu.
