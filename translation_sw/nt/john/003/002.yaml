  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οὗτος ἦλθεν πρὸς αὐτὸν νυκτὸς καὶ εἶπεν αὐτῷ· Ῥαββί, οἴδαμεν ὅτι ἀπὸ θεοῦ ἐλήλυθας διδάσκαλος· οὐδεὶς γὰρ ⸂δύναται ταῦτα τὰ σημεῖα⸃ ποιεῖν ἃ σὺ ποιεῖς, ἐὰν μὴ ᾖ ὁ θεὸς μετ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/002.yaml
  text: This man came to him by night and said to him[a], “Rabbi, we know that you have come from God as a teacher[c][b], for no one is able to do these signs that you do unless God is with him.”
translation:
  language: sw
  text: Huyu alimjia Yesu usiku[a] na kumwambia, “Rabi, tunajua kwamba umetoka kwa Mungu ukiwa mwalimu; kwa maana hakuna mtu anayeweza kufanya ishara hizi[b] unazofanya, Mungu asipokuwa pamoja naye[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakati wa usiku.” Katika Injili ya Yohana, usiku au giza pia huweza kuwa na maana ya kimaudhui.
    reason: lexical_alternative
  - marker: b
    text: Au “ishara hizi za kimiujiza.” Neno la Kigiriki σημεῖα limetafsiriwa “ishara” ili kuhifadhi maana ya matendo yanayoelekeza kwenye jambo lililo zaidi ya matendo yenyewe.
    reason: lexical_alternative
  - marker: c
    text: Kigiriki kina “Mungu asipokuwa pamoja naye,” kikihifadhi usemi wa nafsi ya tatu katika kauli ya Nikodemo.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτος
  choice: Huyu
  rationale: Kiwakilishi hiki kinamrejelea Nikodemo aliyetajwa katika mstari uliotangulia na kinahifadhi nguvu ya uonyeshaji ya neno la Kigiriki.
- source_word: ἦλθεν πρὸς αὐτὸν
  choice: alimjia Yesu
  rationale: ‘Alimjia’ ni usemi wa kawaida wa Kiswahili wa kueleza kwenda kwa mtu; jina ‘Yesu’ linaweka wazi rejeo la kiwakilishi bila kubadili maana.
- source_word: νυκτός
  choice: usiku
  rationale: Hii ni tafsiri ya kawaida ya wakati; pia haiondoi uwezekano wa neno hilo kuwa na mwangwi wa kimaudhui katika Injili ya Yohana.
- source_word: Ῥαββί
  choice: Rabi
  rationale: Cheo cha Kiyahudi kinahifadhiwa kwa unukuzi, kama kilivyohifadhiwa katika Kigiriki, badala ya kukisawazisha tu na ‘Mwalimu.’
- source_word: οἴδαμεν
  choice: tunajua
  rationale: Wingi wa nafsi ya kwanza umehifadhiwa; haubadilishwi kuwa umoja hata kama Nikodemo ndiye anayesema.
- source_word: ἀπὸ θεοῦ ἐλήλυθας
  choice: umetoka kwa Mungu
  rationale: Huhifadhi wazo la asili au ujio kutoka kwa Mungu na hali yenye umuhimu wa sasa, bila kuongeza dhana mahsusi ya ‘kutumwa.’
- source_word: διδάσκαλος
  choice: ukiwa mwalimu
  rationale: Hueleza nafasi ambayo Yesu amekuja akiwa nayo kwa Kiswahili cha kawaida, bila kufanya ‘mwalimu’ kuwa jina jingine la cheo ‘Rabi.’
- source_word: οὐδεὶς γὰρ δύναται
  choice: kwa maana hakuna mtu anayeweza
  rationale: Huhifadhi kiunganishi cha sababu γάρ na maana ya uwezo katika δύναται.
- source_word: ταῦτα τὰ σημεῖα
  choice: ishara hizi
  rationale: ‘Ishara’ huhifadhi istilahi ya Yohana kwa matendo yanayoelekeza zaidi ya tendo lenyewe, bila kuyapunguzia hali yake ya kimiujiza.
- source_word: ποιεῖν ἃ σὺ ποιεῖς
  choice: kufanya ishara hizi unazofanya
  rationale: Kurudiwa kwa kitenzi ποιέω kumehifadhiwa kwa ‘kufanya ... unazofanya.’
- source_word: ἐὰν μὴ ᾖ ὁ θεὸς μετ’ αὐτοῦ
  choice: Mungu asipokuwa pamoja naye
  rationale: Muundo wa sharti umeonyeshwa kwa Kiswahili cha asili, na nafsi ya tatu ‘naye’ imehifadhiwa badala ya kusawazishwa kuwa ‘wewe.’
theological_decisions:
- issue: Tafsiri ya σημεῖα katika muktadha wa Yohana
  choice: ishara
  alternative: miujiza / ishara za kimiujiza
  rationale: ‘Ishara’ huhifadhi uzito wa kiyohane wa matendo yanayodhihirisha utambulisho na kazi ya Yesu, huku maelezo ya chini yakibainisha uwezekano wa msomaji kuyaelewa kama ishara za kimiujiza.
- issue: Mabadiliko kutoka nafsi ya pili kwenda nafsi ya tatu katika maneno ya Nikodemo
  choice: Mungu asipokuwa pamoja naye
  alternative: Mungu asipokuwa pamoja nawe
  rationale: Kigiriki kinahama kutoka kumsemesha Yesu moja kwa moja kwenda kauli ya nafsi ya tatu. Kuhifadhi ‘naye’ kunatunza muundo na utata wa chanzo.
- issue: Iwapo ἀπὸ θεοῦ ἐλήλυθας ina maana ya kutumwa rasmi
  choice: umetoka kwa Mungu
  alternative: umetumwa na Mungu
  rationale: Maneno haya yanataja ujio au asili kutoka kwa Mungu, lakini hayatumii kitenzi cha ‘kutuma’; kwa hiyo tafsiri haiongezi dai lililo wazi zaidi kuliko chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imewekwa wazi kwa msomaji wa kawaida huku ikihifadhi wingi wa ‘tunajua,’ istilahi ‘Rabi,’ kurudiwa kwa ‘kufanya,’ na nafsi ya tatu katika kifungu cha mwisho.
