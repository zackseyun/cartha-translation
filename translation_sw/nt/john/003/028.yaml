  text: αὐτοὶ ὑμεῖς ⸀μοι μαρτυρεῖτε ὅτι ⸀εἶπον· Οὐκ εἰμὶ ἐγὼ ὁ χριστός, ἀλλ’ ὅτι Ἀπεσταλμένος εἰμὶ ἔμπροσθεν ἐκείνου.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/028.yaml
  text: You yourselves bear me witness that I said[a], ‘I am not the Messiah[b], but I have been sent ahead of him.’
translation:
  language: sw
  text: Ninyi wenyewe mnanitolea ushahidi kwamba nilisema, “Mimi si Masihi,[a] bali nimetumwa mbele yake.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kristo.”
    reason: Tafsiri nyingine halali ya cheo Χριστός.
  - marker: b
    text: Au, “nimetumwa nimtangulie” au “nilitumwa mbele yake.”
    reason: Muundo wa Kigiriki unaweza kuwasilishwa kwa tofauti ndogo za wakati; “nimtangulie” hufafanua kwa usemi wa Kiswahili uhusiano wa kuwa mbele yake.
lexical_decisions:
- source_word: αὐτοὶ ὑμεῖς
  choice: Ninyi wenyewe
  rationale: Muundo huu unasisitiza kwamba wasikilizaji wenyewe ndio wanaoweza kuthibitisha kauli ya Yohana.
- source_word: μοι μαρτυρεῖτε
  choice: mnanitolea ushahidi
  rationale: Huwasilisha maana ya kutoa ushahidi unaounga mkono kauli ya Yohana, huku ikihifadhi ladha ya kisheria ya μαρτυρέω kwa Kiswahili cha kawaida.
- source_word: εἶπον
  choice: nilisema
  rationale: Wakati uliopita rahisi unafaa kwa kurejelea kauli ambayo Yohana alikuwa amekwisha kuitoa.
- source_word: ὁ χριστός
  choice: Masihi
  rationale: Hapa Χριστός ni cheo cha yule aliyetiwa mafuta na kutarajiwa, si jina la kawaida; “Masihi” huonyesha kazi hiyo ya cheo kwa uwazi.
- source_word: Ἀπεσταλμένος εἰμὶ
  choice: nimetumwa
  rationale: Hali timilifu ya kutumwa yenye matokeo yanayoendelea inaelezwa kwa kawaida kwa “nimetumwa,” bila kuifanya iwe tukio la zamani tu.
- source_word: ἔμπροσθεν ἐκείνου
  choice: nimtangulie yeye
  rationale: Kauli hii inaonyesha kwamba Yohana alitumwa kabla yake katika kazi ya maandalizi. Kiwakilishi “yeye” kinadumisha msisitizo wa ἐκείνου kwa Kiswahili cha asili.
theological_decisions:
- issue: Kutafsiri Χριστός kama cheo
  choice: Masihi
  alternative: Kristo
  rationale: Yohana anakataa kuwa yule mtiwa-mafuta aliyetazamiwa; kwa hiyo “Masihi” hudumisha maana ya cheo, huku “Kristo” ikibaki tafsiri halali ya jadi.
- issue: Nguvu ya Ἀπεσταλμένος εἰμὶ katika utume wa Yohana
  choice: nimetumwa nimtangulie yeye
  alternative: nilitumwa mbele yake / nimetumwa mbele yake
  rationale: Tafsiri iliyochaguliwa inaonyesha kutumwa kulikotokea na hali yake inayoendelea, pamoja na jukumu la Yohana la kumtangulia, bila kuongeza maelezo kuhusu namna ya maandalizi hayo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Mnanitolea ushahidi” ni wazi kwa msomaji wa kawaida na huhifadhi wazo la ushuhuda; “nimtangulie yeye” ni usemi wa asili unaoonyesha jukumu la Yohana la kwenda kabla ya huyo anayezungumziwa.
