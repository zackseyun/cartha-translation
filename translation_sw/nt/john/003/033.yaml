  yaml_path: translation/nt/john/003/033.yaml
  text: Whoever has received his testimony has certified that God is true[a].
translation:
  language: sw
  text: Yeyote aliyeupokea ushuhuda wake amethibitisha kwamba Mungu ni wa kweli.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya karibu zaidi na maneno ya asili, “ametia muhuri kwamba Mungu ni wa kweli.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λαβὼν
  choice: Yeyote ambaye ameupokea
  rationale: Kirai chenye kibainishi na kitenzi-shirikishi cha wakati uliopita kinamtaja kwa ujumla mtu yeyote anayepokea ushuhuda huo; muundo huu ni wa asili katika Kiswahili na unadokeza tendo lililotimizwa.
- source_word: αὐτοῦ
  choice: wake
  rationale: Kiwakilishi hiki kwa kawaida kinamrejelea aliyetajwa katika muktadha wa karibu, yaani yule atokaye mbinguni/Mwana ambaye ushuhuda wake unazungumziwa.
- source_word: τὴν μαρτυρίαν
  choice: ushuhuda
  rationale: Neno hili humaanisha ushuhuda au ushahidi; “ushuhuda” linafaa kwa kitu kinachopokelewa na linahifadhi dhamira ya ushahidi katika Injili ya Yohana.
- source_word: ἐσφράγισεν
  choice: amethibitisha
  rationale: Kimsingi kitenzi humaanisha kutia muhuri, lakini hapa kimetumiwa kwa njia ya sitiari kumaanisha kutoa uthibitisho thabiti. “Amethibitisha” huwasilisha maana hiyo kwa Kiswahili cha kawaida; picha halisi ya muhuri imehifadhiwa katika tanbihi.
- source_word: ὅτι
  choice: kwamba
  rationale: Hapa ὅτι huanzisha maudhui ya jambo linalothibitishwa, si sababu.
- source_word: ὁ θεὸς
  choice: Mungu
  rationale: Nomino hii ni kiima bayana na haihitaji upanuzi.
- source_word: ἀληθής
  choice: ni wa kweli
  rationale: Katika muktadha huu neno linaeleza kwamba Mungu ni wa kweli, mwaminifu na wa kutegemewa katika asemayo; “wa kweli” ni fupi na huhifadhi upana wa dhamira ya kweli katika Yohana.
theological_decisions:
- issue: Nguvu ya sitiari ya kutia muhuri
  choice: Kutafsiri ἐσφράγισεν kama “amethibitisha” katika matini kuu
  alternative: ametia muhuri wake kuthibitisha
  rationale: Mstari unaonyesha kwamba kuupokea ushuhuda wa Yesu ni kukiri kwa uthabiti kuwa Mungu ni wa kweli. Tafsiri kuu inaweka maana wazi bila kuondoa picha ya asili, ambayo imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo “ni wa kweli” umechaguliwa badala ya “ni mkweli” ili kuhifadhi mwangwi mpana wa ἀληθής bila kuufungia tu katika kusema kweli.
