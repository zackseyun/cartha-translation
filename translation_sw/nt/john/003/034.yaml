  text: ὃν γὰρ ἀπέστειλεν ὁ θεὸς τὰ ῥήματα τοῦ θεοῦ λαλεῖ, οὐ γὰρ ἐκ μέτρου ⸀δίδωσιν τὸ πνεῦμα.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/034.yaml
  text: For the one whom God sent speaks the words of God[a], for he gives the Spirit without measure.
translation:
  language: sw
  text: Kwa maana yule ambaye Mungu alimtuma husema maneno ya Mungu, kwa maana hutoa[a] Roho bila kipimo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika Kigiriki, kiima cha “hutoa” hakitajwi wazi. Kinaweza kueleweka kuwa Mungu; au kuwa yule ambaye Mungu alimtuma.
    reason: alternative_reading
lexical_decisions:
- source_word: ὃν
  choice: yule ambaye
  rationale: Muundo huu unaonyesha wazi kuwa kiwakilishi hiki kinamtaja mtu aliyemtumwa, huku ukibaki wa kawaida na wa heshima katika Kiswahili.
- source_word: ἀπέστειλεν
  choice: alimtuma
  rationale: Wakati uliopita unafaa kwa aoristi katika muktadha huu, na ‘tuma’ huhifadhi msamiati wa Yohana kuhusu kutumwa na Mungu.
- source_word: τὰ ῥήματα τοῦ θεοῦ
  choice: maneno ya Mungu
  rationale: Huhifadhi wingi wa ῥήματα na uhusiano wa moja kwa moja na Mungu bila kuongeza maana ya ‘mafundisho’ au ‘ujumbe.’
- source_word: λαλεῖ
  choice: huyanena
  rationale: ‘Kunena’ ni lugha ya kawaida yenye hadhi inayofaa kwa usemi wa Mungu; kiambishi ‘ya’ kinarejelea maneno yaliyotajwa na kuwasilisha tendo linaloendelea.
- source_word: ἐκ μέτρου
  choice: bila kipimo
  rationale: Pamoja na ukanushi wa Kigiriki, msemo huu humaanisha kutotoa kwa kiasi kilichopimwa au chenye mpaka. ‘Bila kipimo’ huhifadhi sitiari hiyo kwa Kiswahili cha kawaida.
- source_word: δίδωσιν
  choice: hutoa
  rationale: Wakati wa sasa unaakisiwa kwa ‘hutoa.’ Kutoitaja nomino ya mtendaji kunahifadhi kutotajwa kwake katika Kigiriki na uwezekano wa marejeo mawili.
- source_word: τὸ πνεῦμα
  choice: Roho
  rationale: Katika muktadha wa Yohana, neno hili linaeleweka kwa kawaida kuwa Roho wa Mungu. Herufi kubwa huonyesha rejeo hilo bila kuongeza neno ‘Mtakatifu,’ ambalo halipo hapa.
theological_decisions:
- issue: Mtendaji wa δίδωσιν (‘hutoa’)
  choice: Mtendaji habainishwi wazi katika matini kuu; ‘hutoa’ inaweza kumrejelea Mungu.
  alternative: Yule aliyetumwa na Mungu, yaani Mwana, ndiye anayetoa Roho bila kipimo.
  rationale: Kigiriki hakina kiima kilichotajwa katika kishazi hiki. Mtiririko unaweza kumwelekeza msomaji kwa Mungu kama mtoaji, lakini yule aliyetumwa pia anaweza kueleweka kuwa mtendaji. Tafsiri haiongezi nomino na tanbihi huhifadhi mvutano huu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Huyanena’ ni fasaha bila kuwa cha kizamani kupita kiasi; ‘bila kipimo’ ni wazi na huhifadhi picha ya lugha ya asili. Alama ya tanbihi imewekwa mara tu baada ya kitenzi chenye kiima kisichotajwa.
