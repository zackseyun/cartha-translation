  text: John answered and said[a], “A man is not able to receive even one thing unless it has been given to him from heaven.”
translation:
  language: sw
  text: Yohana akajibu na kusema, “Mtu hawezi kupokea hata kitu kimoja, isipokuwa awe amepewa kitu hicho kutoka mbinguni.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη Ἰωάννης καὶ εἶπεν
  choice: Yohana akajibu na kusema
  rationale: Inahifadhi muundo wa kawaida wa simulizi wa Kigiriki, ‘akajibu na kusema,’ kwa Kiswahili cha heshima na kinachoeleweka.
- source_word: Οὐ δύναται
  choice: hawezi
  rationale: Ni usemi wa kawaida wa Kiswahili unaowasilisha wazi kutoweza.
- source_word: ἄνθρωπος
  choice: mtu
  rationale: Katika muktadha huu neno lina maana ya jumla inayomhusu mwanadamu yeyote; ‘mtu’ ni tafsiri ya asili na isiyobana maana kwa wanaume pekee.
- source_word: λαμβάνειν οὐδὲ ἓν
  choice: kupokea hata kitu kimoja
  rationale: ‘Kupokea’ linafaa kwa jambo linalotolewa, na ‘hata kitu kimoja’ linahifadhi msisitizo wa οὐδὲ ἓν.
- source_word: ἐὰν μὴ ᾖ δεδομένον αὐτῷ
  choice: isipokuwa awe amepewa
  rationale: ‘Isipokuwa’ linaonyesha sharti la kipekee, huku ‘awe amepewa’ likihifadhi hali inayotokana na tendo lililotangulia la kutoa; mtendewa yumo katika umbo la kitenzi cha Kiswahili.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: kutoka mbinguni
  rationale: Inahifadhi taswira halisi ya chanzo cha mbinguni bila kuibadili moja kwa moja kuwa ‘kutoka kwa Mungu.’
theological_decisions:
- issue: Upeo wa kauli kuhusu chanzo cha mbinguni
  choice: 'Kauli imeachwa kuwa pana: mtu hawezi kupokea kitu isipokuwa amepewa kutoka mbinguni.'
  alternative: Kuifanya ihusu tu huduma au mamlaka ya kiroho, au kuipanua wazi kuwa fundisho kamili la uamuzi wa Mungu juu ya kila jambo.
  rationale: Muktadha unahusu nafasi na huduma ya Yohana ikilinganishwa na Yesu, lakini maneno yenyewe yana upeo mpana. Tafsiri inahifadhi mvutano huo bila kuingiza mfumo fulani wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo ‘akajibu na kusema’ umehifadhiwa kwa ulinganifu wa karibu na chanzo; ‘mtu’ tayari huwasilisha maana jumuishi ya ἄνθρωπος, hivyo tanbihi ya kijinsia haihitajiki.
