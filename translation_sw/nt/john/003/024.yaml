lexical_decisions:
- source_word: οὔπω
  choice: bado haja-
  rationale: Muundo wa “bado haja-” unaonyesha kwa Kiswahili cha kawaida kwamba tendo hilo halikuwa limetokea kufikia wakati wa simulizi.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Hapa kiunganishi hiki kinatoa maelezo ya msingi yanayofafanua simulizi linalozunguka mstari huu.
- source_word: ἦν βεβλημένος
  choice: alikuwa ... hajatupwa
  rationale: Muundo huu unaonyesha hali iliyotokana na tendo ambalo, kufikia wakati unaorejelewa, lilikuwa bado halijatokea; “kutupwa” pia huhifadhi nguvu ya kitenzi βάλλω.
- source_word: εἰς τὴν φυλακήν
  choice: gerezani
  rationale: Katika muktadha huu φυλακή ni gereza au kifungo. “Gerezani” ni usemi wa asili wa Kiswahili na unaeleza kuingizwa katika hali au mahali pa kifungo.
- source_word: ὁ Ἰωάννης
  choice: Yohana
  rationale: Kigiriki kinamtaja kwa jina rahisi tu; utambulisho wake kamili unatolewa katika tanbihi badala ya kuongezwa katika matini.
theological_decisions:
- issue: Utambulisho wa Ἰωάννης
  choice: Yohana
  alternative: Yohana Mbatizaji
  rationale: Muktadha unaonyesha kuwa huyu ni Yohana Mbatizaji, lakini mstari wenyewe unasema “Yohana” tu. Matini inahifadhi namna hiyo, huku tanbihi ikifafanua utambulisho wake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa kawaida lakini wenye heshima. “Kwa maana” huhifadhi uhusiano wa ufafanuzi, na “alikuwa bado hajatupwa gerezani” ni muundo wa asili unaowasilisha wakati na hali ya kauli ya Kigiriki.
