  text: πᾶς γὰρ ὁ φαῦλα πράσσων μισεῖ τὸ φῶς καὶ οὐκ ἔρχεται πρὸς τὸ φῶς, ἵνα μὴ ἐλεγχθῇ τὰ ἔργα αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/003/020.yaml
  text: For everyone who practices evil hates the light and does not come to the light[b][a], lest his works be exposed.
translation:
  language: sw
  text: Kwa maana kila mtu anayetenda maovu huichukia nuru, wala haji kwenye nuru, ili matendo yake yasifichuliwe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “yakemewe” au “yaonyeshwe kuwa mabaya”; kitenzi cha Kigiriki kinaweza kumaanisha kufichua kosa, kuonyesha hatia, au kuleta jambo nuruni.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς γὰρ ὁ
  choice: Kwa maana kila mtu anaye-
  rationale: “Kwa maana” linahifadhi kazi ya γάρ ya kueleza kauli iliyotangulia. “Kila mtu anaye-” linawakilisha usemi wa jumla πᾶς ὁ pamoja na kirai cha kitenzi, bila kuuwekea mpaka wa jinsia ambao Kiswahili hakihitaji.
- source_word: φαῦλα πράσσων
  choice: anayetenda maovu
  rationale: φαῦλα ina maana ya kimaadili katika muktadha huu, hivyo “maovu” linafaa kuliko “mambo mabaya” au “mambo yasiyofaa.” Kitenzi cha wakati wa sasa πράσσων kinaonyesha mwenendo unaomtambulisha mtu; “anayetenda” ni la kawaida, lenye hadhi, na halipunguzi nguvu ya kauli.
- source_word: μισεῖ τὸ φῶς
  choice: huichukia nuru
  rationale: “Huichukia” linaonyesha tendo la kawaida au la kitabia na kudumisha nguvu ya μισεῖ. “Nuru” linahifadhi sitiari kuu ya Yohana badala ya kuifafanua kwa maneno ya ziada.
- source_word: οὐκ ἔρχεται πρὸς τὸ φῶς
  choice: wala haji kwenye nuru
  rationale: “Wala” linaunganisha kwa kawaida chuki ya nuru na kukataa kuijia. “Haji kwenye nuru” linadumisha taswira rahisi ya kumjia au kuikaribia nuru.
- source_word: ἵνα μὴ
  choice: ili ... yasi-
  rationale: 'Muundo huu wa Kiswahili unaonyesha kusudi hasi au jambo linaloepukwa: mtu haji ili matendo yake yasipatwe na matokeo yanayotajwa.'
- source_word: ἐλεγχθῇ
  choice: yasifichuliwe
  rationale: Katika muktadha wa nuru, “kufichuliwa” huonyesha matendo kuletwa wazi na kuonekana kuwa mabaya, huku likiacha wazi pia wazo la kuthibitishwa kuwa na hatia au kukaripiwa.
- source_word: τὰ ἔργα αὐτοῦ
  choice: matendo yake
  rationale: “Matendo” ni tafsiri ya kawaida na ya moja kwa moja ya ἔργα katika muktadha wa maadili. “Yake” linadumisha umoja wa mtu anayezungumziwa na kwa asili ni la kijinsia-jumuishi katika Kiswahili.
theological_decisions:
- issue: Maana ya ἐλεγχθῇ kuhusiana na nuru
  choice: yasifichuliwe
  alternative: yasikemeewe; yasithibitishwe kuwa mabaya
  rationale: Muktadha unasisitiza nuru kuweka matendo wazi. “Yasifichuliwe” linadumisha taswira hiyo bila kuifunga maana katika kukemea tu au hukumu rasmi tu.
- issue: Umoja wa mwakilishi katika kauli ya jumla
  choice: kila mtu ... matendo yake
  alternative: watu wote ... matendo yao
  rationale: Umoja wa Kigiriki umedumishwa. Kiswahili “mtu” na “yake” havibainishi jinsia, hivyo kauli inawahusu watu wote bila kubadili umoja kuwa wingi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Nuru” na “kuja kwenye nuru” vimedumishwa ili kuhifadhi taswira ya Yohana. Muundo wa “kila mtu ... yake” ni wa kawaida na wa kijinsia-jumuishi katika Kiswahili.
