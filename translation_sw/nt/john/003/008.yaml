id: JHN.3.8
reference: John 3:8
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: τὸ πνεῦμα ὅπου θέλει πνεῖ, καὶ τὴν φωνὴν αὐτοῦ ἀκούεις, ἀλλ’ οὐκ οἶδας πόθεν ἔρχεται καὶ ποῦ ὑπάγει· οὕτως ἐστὶν πᾶς ὁ γεγεννημένος ἐκ τοῦ πνεύματος.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/008.yaml
  text: The wind blows where it wishes[a], and you hear its sound, but you do not know where it comes from and where it goes[b]. So it is with everyone who has been born of the Spirit.
translation:
  language: sw
  text: Upepo huvuma upendako[a], nawe unasikia sauti yake[b], lakini hujui unatoka wapi wala unakwenda wapi. Ndivyo ilivyo kwa kila mtu aliyezaliwa kutokana na Roho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki pneuma linaweza kumaanisha ‘upepo’ au ‘roho.’ Yesu anatumia neno hilohilo katika sehemu zote mbili za mstari huu, akiunda mchezo wa neno ambao Kiswahili hakiwezi kuonyesha kikamilifu.
    reason: lexical_alternative
  - marker: b
    text: Au, ‘sauti ya kusema.’ Neno la Kigiriki linaweza kumaanisha ‘sauti’ au ‘sauti ya kusema’; hapa linarejelea athari ya upepo inayosikika.
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεῦμα (mst. 8a)
  choice: upepo
  rationale: Katika kishazi cha kwanza, πνεῦμα inaambatana na πνεῖ (‘huvuma’) na sauti inayosikika, hivyo maana ya hali ya hewa, ‘upepo,’ ndiyo inayofaa zaidi. Tofauti ya Kiswahili kati ya ‘upepo’ na ‘Roho’ haiwezi kuhifadhi kikamilifu mchezo wa neno la Kigiriki.
- source_word: ὅπου θέλει
  choice: unakotaka
  rationale: Huhifadhi wazo la upepo kwenda mahali ‘unapotaka’ na hali ya kuupa upepo sifa ya kutaka, huku ikiwa ya kawaida na fupi katika Kiswahili.
- source_word: πνεῖ
  choice: huvuma
  rationale: Kitenzi hiki ndicho cha kawaida kwa mwendo wa upepo na kinaonyesha wazi taswira ya hali ya hewa.
- source_word: φωνὴν
  choice: sauti
  rationale: φωνή inaweza kuwa ‘sauti’ au ‘sauti ya kusema’; hapa inarejelea athari inayosikika ya upepo, kwa hiyo ‘sauti’ ni ya asili zaidi kuliko ‘kelele’ au ‘sauti ya kusema.’
- source_word: οὐκ οἶδας πόθεν ἔρχεται καὶ ποῦ ὑπάγει
  choice: hujui unatoka wapi wala unakwenda wapi
  rationale: Hutafsiri kwa uwazi jozi ya maswali kuhusu chanzo na mwisho wa mwendo; ‘wala’ huunganisha vipengele viwili vilivyokanushwa kwa Kiswahili cha kawaida.
- source_word: οὕτως ἐστίν
  choice: Ndivyo ilivyo kwa
  rationale: Ni usemi wa kawaida wa Kiswahili unaoleta matumizi ya ulinganisho bila kudai kwamba mtu ni upepo.
- source_word: πᾶς ὁ γεγεννημένος
  choice: kila mtu aliyezaliwa
  rationale: Hutoa maana ya jumla ya kila mtu na huonyesha hali inayotokana na kuzaliwa, kama participio timilifu ya Kigiriki.
- source_word: ἐκ τοῦ πνεύματος (mst. 8b)
  choice: kutokana na Roho
  rationale: Hapa πνεῦμα inarejelea Roho katika muktadha wa kuzaliwa upya. ‘Kutokana na’ huonyesha kwa uwazi chanzo au asili inayobebwa na ἐκ.
theological_decisions:
- issue: Kutafsiri marudio ya πνεῦμα yenye maana mbili
  choice: Kutafsiri πνεῦμα ya kwanza kuwa ‘upepo’ na ya mwisho kuwa ‘Roho.’
  alternative: Kutafsiri zote mbili kuwa ‘Roho,’ au zote mbili kuwa ‘upepo.’
  rationale: Kigiriki kinatumia kwa makusudi neno moja lenye maana za ‘upepo’ na ‘roho.’ Muktadha wa mwanzo—kuvuma na kusikika—unaelekeza kwa upepo, huku mwisho ukizungumzia kuzaliwa kutokana na Roho. Kiswahili hakiwezi kuhifadhi maana hizo mbili kwa neno lilelile, kwa hiyo tanbihi inaeleza mchezo huo wa neno.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Unakotaka’ ni cha kawaida na huhifadhi ubinafsishaji wa upepo. ‘Kutokana na Roho’ limechaguliwa ili kuonyesha chanzo kinachodokezwa na ἐκ bila kuingiza maelezo ya kimadhehebu.
