id: JHN.3.6
reference: John 3:6
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: τὸ γεγεννημένον ἐκ τῆς σαρκὸς σάρξ ἐστιν, καὶ τὸ γεγεννημένον ἐκ τοῦ πνεύματος πνεῦμά ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/006.yaml
  text: What is born of the flesh is flesh[b][a], and what is born of the Spirit is spirit.
translation:
  language: sw
  text: Kile kilichozaliwa kutokana na mwili ni mwili,[a] na kile kilichozaliwa kutokana na Roho ni roho.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kile kilichozaliwa kutokana na mwili ni cha asili ya kibinadamu.” Neno la Kigiriki linalotafsiriwa “mwili” linaweza katika baadhi ya miktadha kumaanisha asili ya mwanadamu iliyoanguka au yenye dhambi, lakini hapa tofauti kuu ni kati ya kuzaliwa kwa kawaida na kuzaliwa kutokana na Roho.
    reason: lexical_alternative
  - marker: b
    text: Au, “kile kilichozaliwa kutokana na Roho ni cha kiroho.” Kigiriki kinasema kihalisi “ni roho,” na hivyo kudumisha tofauti ya kisifa kati ya “mwili” na “roho.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ γεγεννημένον
  choice: kile kilichozaliwa
  rationale: Muundo huu wa Kiswahili unaonyesha jambo au kiumbe kwa maana ya jumla, kama ulivyo muundo wa Kigiriki wenye kishirikishi cha wakati timilifu katika kauli tendwa.
- source_word: ἐκ
  choice: kutokana na
  rationale: Katika muktadha wa kuzaliwa, neno hili linaonyesha chanzo au asili. “Kutokana na” ni la kawaida na linaepuka utata unaoweza kutokea katika “kuzaliwa na.”
- source_word: σάρξ / σαρκὸς
  choice: mwili
  rationale: Hapa σάρξ inahusu hasa chanzo na hali ya kuzaliwa kwa kawaida kwa mwanadamu, ikilinganishwa na kuzaliwa kutokana na Roho. “Mwili” huhifadhi picha na mvutano wa maneno ya Yohana bila kuingiza moja kwa moja maana finyu ya asili ya dhambi.
- source_word: πνεύματος / πνεῦμά
  choice: Roho / roho
  rationale: Neno la kwanza linamtaja Roho kama chanzo cha kuzaliwa, hivyo linaanza kwa herufi kubwa. Neno la pili linaeleza hali au sifa ya kile kilichozaliwa, hivyo “roho” kwa herufi ndogo huhifadhi tofauti hiyo bila kulifanya kivumishi.
- source_word: ἐστιν
  choice: ni
  rationale: Kishirikishi rahisi “ni” kinadumisha muundo mfupi, wa kimethali na wa ufafanuzi wa sentensi ya Kigiriki.
theological_decisions:
- issue: Maana ya σάρξ katika kishazi cha kwanza
  choice: mwili kama eneo au hali ya kawaida ya kibinadamu
  alternative: asili ya dhambi
  rationale: Ingawa σάρξ wakati mwingine inaweza kuwa na maana ya kimaadili, muktadha huu unatofautisha kuzaliwa kwa kawaida na kuzaliwa kutokana na Roho. “Asili ya dhambi” ingeweka tafsiri finyu zaidi kuliko maandishi yanavyolazimisha.
- issue: Maana ya πνεῦμα katika kiarifu cha kishazi cha pili
  choice: roho
  alternative: ya kiroho; Roho
  rationale: Nomino ya Kigiriki katika kiarifu haina kibainishi na inaweza kuwa na nguvu ya kisifa. “Roho” kwa herufi kubwa ingeweza kukifanya kile kilichozaliwa kuwa sawa moja kwa moja na Roho Mtakatifu, huku “ya kiroho” ikiwa tafsiri elezi zaidi. “roho” huhifadhi ufupi na utata halisi wa Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Marudio ya “kile kilichozaliwa kutokana na” yamedumishwa ili kuhifadhi ulinganifu wa vifungu viwili katika chanzo.
