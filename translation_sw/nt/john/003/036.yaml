  text: ὁ πιστεύων εἰς τὸν υἱὸν ἔχει ζωὴν αἰώνιον· ὁ δὲ ἀπειθῶν τῷ υἱῷ οὐκ ὄψεται ζωήν, ἀλλ’ ἡ ὀργὴ τοῦ θεοῦ μένει ἐπ’ αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/036.yaml
  text: The one who believes in the Son has eternal life; but the one who disobeys the Son will not see life, but the wrath of God remains on him.
translation:
  language: sw
  text: Anayemwamini Mwana anao uzima wa milele; lakini asiyemtii Mwana[a] hataona uzima, bali ghadhabu ya Mungu inabaki juu yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “anayekataa kumwamini Mwana.” Kitenzi cha Kigiriki kinaweza kumaanisha kukataa kuamini pamoja na kutotii.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ πιστεύων εἰς τὸν υἱόν
  choice: anayemwamini Mwana
  rationale: Kirai hiki ni usemi wa jumla kuhusu mtu yeyote anayeamini, na muundo wa Kiswahili wenye kiambishi cha yambwa katika “anayemwamini” unaonyesha imani inayomwelekea Mwana.
- source_word: τὸν υἱόν / τῷ υἱῷ
  choice: Mwana
  rationale: Kigiriki kinatumia cheo chenye kibainishi bila kuongeza neno “wa Mungu”; “Mwana” kinahifadhi matumizi hayo ya Kikristo katika Yohana bila kuongeza ufafanuzi.
- source_word: ἔχει
  choice: anao
  rationale: Kitenzi cha wakati uliopo kinaonyesha kuwa uzima huo ni miliki ya sasa, si ahadi ya wakati ujao pekee.
- source_word: ζωὴν αἰώνιον
  choice: uzima wa milele
  rationale: Huu ni usemi wa kawaida na ulio wazi katika Kiswahili, unaowasilisha kudumu kwa uzima pamoja na ubora wake wa nyakati za mwisho.
- source_word: ὁ δὲ ἀπειθῶν
  choice: lakini asiyemtii
  rationale: ἀπειθέω inaweza kumaanisha kutotii na pia kukataa kuamini. “Asiyemtii” kinahifadhi maana pana ya kutotii, huku maana nyingine ikiwekwa katika tanbihi.
- source_word: οὐκ ὄψεται ζωήν
  choice: hataona uzima
  rationale: Tafsiri hii inahifadhi taswira ya moja kwa moja ya Yohana ya “kuona uzima” na pia nguvu ya wakati ujao ya kitenzi.
- source_word: ἡ ὀργὴ τοῦ θεοῦ
  choice: ghadhabu ya Mungu
  rationale: “Ghadhabu” ni neno la kawaida, lenye hadhi, na halipunguzi uzito wa hukumu ya Mungu iliyoelezwa katika chanzo.
- source_word: μένει ἐπ’ αὐτόν
  choice: inakaa juu yake
  rationale: “Inakaa” kinahifadhi wazo la μένω la hali inayoendelea, na “juu yake” linaonyesha ghadhabu inayobaki ikimkabili mtu huyo.
theological_decisions:
- issue: Maana ya ἀπειθῶν ikilinganishwa na πιστεύων
  choice: Maandishi makuu yametumia “asiyemtii,” na tanbihi imehifadhi maana ya “anayekataa kumwamini.”
  alternative: asiyemwamini / anayekataa kumwamini
  rationale: Muktadha unalinganisha kuamini na ἀπειθέω, lakini kitenzi hicho kinaweza kuunganisha kutokuamini na kutotii. Tafsiri haifuti mvutano huo kwa kuifanya iwe kutokuamini kwa akili tu.
- issue: Wakati wa uzima wa milele na ghadhabu
  choice: “Anao” na “inakaa” zinaonyesha hali za sasa, huku “hataona” ikielekeza pia wakati ujao.
  alternative: Kufanya uzima wa milele na ghadhabu viwe vya wakati ujao pekee.
  rationale: ἔχει na μένει ni vitenzi vya wakati uliopo, ilhali ὄψεται ni cha wakati ujao. Tafsiri imehifadhi tofauti hiyo ya nyakati na mvutano wake wa kiteolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Anao” ni fasaha na wazi kwa wasomaji wa kawaida; “ghadhabu” huhifadhi uzito wa maandishi bila kutumia lugha ya kimadhehebu.
