  text: καὶ καθὼς Μωϋσῆς ὕψωσεν τὸν ὄφιν ἐν τῇ ἐρήμῳ, οὕτως ὑψωθῆναι δεῖ τὸν υἱὸν τοῦ ἀνθρώπου,
base_translation:
  language: en
  yaml_path: translation/nt/john/003/014.yaml
  text: And just as Moses lifted up the serpent in the wilderness[a], so the Son of Man must be lifted up[b],
translation:
  language: sw
  text: Na kama vile Musa alivyoinua nyoka jangwani[a], vivyo hivyo Mwana wa Adamu lazima ainuliwe[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tazama Hesabu 21:8–9 kuhusu Musa kumwinua nyoka jangwani.
    reason: cross_reference
  - marker: b
    text: Au “atukuzwe.” Kitenzi cha Kigiriki kinaweza kumaanisha kuinuliwa kimwili na pia kutukuzwa; huenda Yohana anakusudia maana zote mbili hapa.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς ... οὕτως
  choice: kama vile ... vivyo hivyo
  rationale: Muundo huu wa Kiswahili unaonyesha wazi ulinganisho wa moja kwa moja kati ya tendo la Musa na kile kinachompasa Mwana wa Adamu.
- source_word: ὕψωσεν
  choice: alivyoinua
  rationale: Katika rejeo la Hesabu 21, kitenzi kinaeleza kuinuliwa kwa nyoka mahali pa kuonekana. Pia kinadumisha uhusiano wa kimsamiati na ὑψωθῆναι katika sehemu ya pili ya sentensi.
- source_word: τὸν ὄφιν
  choice: nyoka
  rationale: “Nyoka” ndilo neno la kawaida, wazi na lenye hadhi katika Kiswahili; linafaa kwa simulizi la Hesabu 21 bila kuingiza maelezo yasiyokuwamo katika mstari huu.
- source_word: ἐν τῇ ἐρήμῳ
  choice: jangwani
  rationale: “Jangwani” ni tafsiri ya kawaida na ya asili kwa mazingira ya Israeli wakati wa safari yao, bila kulazimisha maana finyu ya jangwa la mchanga tu.
- source_word: ὑψωθῆναι
  choice: ainuliwe
  rationale: 'Kauli tendwa inaakisi muundo wa Kigiriki na kuhifadhi maana mbili zinazowezekana katika Yohana: kuinuliwa kimwili na kutukuzwa.'
- source_word: δεῖ
  choice: lazima
  rationale: “Lazima” linaonyesha ulazima wenye nguvu, si uwezekano au utabiri wa kawaida tu.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  rationale: Hili ni jina la cheo lililozoeleka katika Biblia ya Kiswahili na linahifadhi miangwi yake ya Kiyahudi na ya kitheolojia bila kulifafanua kupita kiasi.
theological_decisions:
- issue: Maana mbili za ὑψόω katika Injili ya Yohana
  choice: Kutumia “inua/inuliwa” katika sehemu zote mbili za maandishi makuu.
  alternative: Kutafsiri sehemu ya pili kuwa “atukuzwe.”
  rationale: “Ainuliwe” hudumisha ulinganisho na nyoka aliyeinuliwa, huku bado ikiweza kuelekeza kwenye kutukuzwa kwa Mwana wa Adamu. Tafsiri haifungi maana katika kusulubiwa pekee wala katika kutukuzwa pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “kama vile ... vivyo hivyo” ni wa kawaida na unaweka wazi ulinganisho. Mpangilio wa tanbihi umesahihishwa ili rejeo la Hesabu lifuate “jangwani,” na maelezo ya maana mbili yafuatane na “ainuliwe.”
