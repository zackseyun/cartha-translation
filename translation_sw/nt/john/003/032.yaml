  text: What he has seen and heard[a], this he testifies to[b], and no one receives his testimony.
translation:
  language: sw
  text: Yale aliyoyaona na kuyasikia, hayo ndiyo anayoyashuhudia, na hakuna mtu anayekubali ushuhuda wake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kauli “hakuna mtu anayekubali ushuhuda wake” ni ya jumla na yenye mkazo; mstari unaofuata unamtaja mtu anayekubali ushuhuda huo.
    reason: cross_reference
lexical_decisions:
- source_word: ὃ
  choice: Yale
  rationale: Kiwakilishi hiki cha uhusiano kinarejelea mambo yaliyoonwa na kusikiwa. “Yale” ni ya kawaida katika Kiswahili na huandaa urejeleo wa “hayo” bila kuyafanya kuwa mtu.
- source_word: ἑώρακεν καὶ ἤκουσεν
  choice: aliyoyaona na kuyasikia
  rationale: Muundo huu wa Kiswahili unaeleza mambo ambayo ameyaona na kuyasikia. Kiswahili hakihitaji kuonyesha kwa lazima tofauti ndogo ya hali kati ya wakati timilifu wa ἑώρακεν na aoristi ya ἤκουσεν.
- source_word: τοῦτο μαρτυρεῖ
  choice: hayo ndiyo anayoyashuhudia
  rationale: “Hayo ndiyo” huhifadhi msisitizo wa muundo wa kurejelea yaliyotangulia, na “anayoyashuhudia” huwasilisha maana ya kutoa ushahidi kuhusu mambo hayo.
- source_word: μαρτυρίαν
  choice: ushuhuda
  rationale: Neno hili hudumisha uhusiano wa kileksia na kitenzi “anayoyashuhudia” pamoja na maana ya ushahidi.
- source_word: οὐδεὶς
  choice: hakuna mtu
  rationale: Huu ni usemi wa kawaida na wa moja kwa moja wa ukanushi wa jumla katika Kiswahili.
- source_word: λαμβάνει
  choice: anayekubali
  rationale: Katika muktadha wa kupokea ushuhuda kuwa wa kweli, “kukubali” ni Kiswahili cha asili zaidi kuliko “kupokea,” huku kikibaki ndani ya maana inayowezekana ya λαμβάνω.
theological_decisions:
- issue: Upeo wa usemi wa jumla “hakuna mtu anayekubali ushuhuda wake”
  choice: Kuhifadhi ukanushi mkali wa jumla bila kuupunguza
  alternative: Ni watu wachache sana wanaokubali ushuhuda wake
  rationale: Kigiriki kinasema οὐδεὶς kwa namna ya moja kwa moja. Mstari unaofuata unamtaja anayekubali ushuhuda huo, kwa hiyo tafsiri haipaswi kuondoa mvutano huo bali tanbihi inaweza kuueleza.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa “Yale ... hayo ndiyo” huhifadhi urejeleo wenye msisitizo wa Kigiriki kwa lugha inayoeleweka. Kiunganishi “lakini” kinaonyesha upinzani wa kimaana unaowasilishwa na καί katika kishazi cha mwisho.
