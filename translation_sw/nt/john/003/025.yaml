translation:
  language: sw
  text: Basi, mabishano yakatokea kati ya wanafunzi wa Yohana na Myahudi mmoja kuhusu utakaso[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kusafishwa” au “utakaso wa kiibada.” Neno la Kigiriki linaweza kumaanisha kusafishwa kwa ujumla, ingawa katika muktadha huu huenda linahusu utakaso wa kiibada.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο
  choice: kukatokea
  rationale: Kitenzi hiki kinaanzisha tukio lililozuka; “kukatokea” ni Kiswahili cha kawaida katika mtiririko wa simulizi.
- source_word: οὖν
  choice: Basi
  rationale: Hapa chembe hii inaendeleza simulizi na pia kuunganisha tukio na yaliyotangulia bila kusisitiza mno hitimisho la kimantiki.
- source_word: ζήτησις
  choice: mabishano
  rationale: Neno linaweza kumaanisha mjadala au ubishi; muktadha unaonyesha mazungumzo yenye kutofautiana, hivyo “mabishano” yanafaa bila kudai ugomvi mkali.
- source_word: ἐκ τῶν μαθητῶν Ἰωάννου μετὰ Ἰουδαίου
  choice: kati ya wanafunzi wa Yohana na Myahudi mmoja
  rationale: Ingawa ἐκ kwa kawaida ni “kutoka/miongoni mwa,” pamoja na ζήτησις na μετά muundo unaonyesha pande zilizohusika. “Kati ya … na …” ni muundo wa asili wa Kiswahili; “mmoja” huhifadhi umoja wa Ἰουδαίου.
- source_word: περὶ καθαρισμοῦ
  choice: kuhusu utakaso
  rationale: “Utakaso” huhifadhi maana pana ya kusafisha au kutakasa na pia inaweza kubeba kidokezo cha taratibu za kidini bila kulifanya hilo wazi kupita chanzo.
theological_decisions:
- issue: Ikiwa καθαρισμός itafsiriwe kwa maneno yanayotaja wazi utakaso wa kidini
  choice: utakaso
  alternative: kujitakasa; utakaso wa kidini
  rationale: Muktadha wa Yohana unaelekeza kwenye utakaso wenye maana ya kidini au kiibada, lakini mstari wenyewe hauelezi aina yake kwa uwazi. “Utakaso” huhifadhi uwezekano huo bila kuongeza maelezo yasiyosemwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha kisasa na chenye hadhi. “Basi, kukatokea” huendeleza simulizi kwa kawaida; “Myahudi mmoja” huweka wazi kwamba nomino ya Kigiriki ni ya umoja.
