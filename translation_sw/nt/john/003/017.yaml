  yaml_path: translation/nt/john/003/017.yaml
  text: For God did not send the Son into the world so that he might judge the world[a], but so that the world might be saved through him.
translation:
  language: sw
  text: Kwa maana Mungu hakumtuma Mwana ulimwenguni ili auhukumu ulimwengu[a], bali ili ulimwengu uokolewe kupitia yeye.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ili auhukumu ulimwengu adhabu.” Kitenzi cha Kigiriki kinaweza kuwa na maana hiyo nyembamba katika muktadha huu, lakini maana yake ya msingi ni “kuhukumu.”
    reason: alternative_reading
lexical_decisions:
- source_word: οὐ γὰρ
  choice: Kwa maana ... haku-
  rationale: γάρ linaunganisha mstari huu na uliotangulia kwa kutoa maelezo; “Kwa maana” ni kiunganishi cha kawaida na chenye hadhi katika Kiswahili, huku ukanushi ukiwekwa katika kitenzi.
- source_word: ἀπέστειλεν
  choice: hakumtuma
  rationale: ἀποστέλλω hapa lina maana ya kawaida ya “kutuma”; umbo lenye kiambishi cha yambwa linamtaja Mwana kwa njia ya asili katika Kiswahili bila kuongeza wazo la kumkabidhi rasmi utume.
- source_word: ὁ θεὸς
  choice: Mungu
  rationale: Nomino yenye kibainishi katika Kigiriki hutafsiriwa kwa kawaida kuwa “Mungu” katika Kiswahili.
- source_word: τὸν υἱὸν
  choice: Mwana
  rationale: Kigiriki kinasema “Mwana,” bila kimilikishi cha wazi. Herufi kubwa inadumisha matumizi yake kama cheo na muktadha unaweka wazi uhusiano wake na Mungu.
- source_word: εἰς τὸν κόσμον
  choice: ulimwenguni
  rationale: Huwasilisha mwendo wa kuingia katika eneo la ulimwengu kwa Kiswahili cha kawaida na kifupi.
- source_word: ἵνα κρίνῃ τὸν κόσμον
  choice: ili auhukumu ulimwengu
  rationale: κρίνω kimsingi ni “kuhukumu,” neno pana kuliko “kuhukumiwa kuwa na hatia.” Muundo “ili” unaonyesha kusudi la ἵνα, na hali ya tegemezi “auhukumu” inafaa kisarufi.
- source_word: ἀλλ’ ἵνα
  choice: bali ili
  rationale: “Bali” linaonyesha ulinganisho mkali wa makusudi mawili na kudumisha ulinganifu wa vifungu vya ἵνα.
- source_word: σωθῇ
  choice: uokolewe
  rationale: Kitenzi hiki ni cha kutendwa na kinaonyesha wokovu au uokozi; “uokolewe” huhifadhi upana huo na kupatana na “ulimwengu” kama kiima.
- source_word: ὁ κόσμος
  choice: ulimwengu
  rationale: Neno lilelile limerudiwa ili kuhifadhi msisitizo wa κόσμος bila kulifinya kimafafanuzi kuwa “wanadamu” pekee.
- source_word: δι’ αὐτοῦ
  choice: kupitia yeye
  rationale: διά pamoja na hali ya umilikaji huonyesha njia au uwakala. “Kupitia yeye” hudumisha maana hiyo bila kudokeza kwamba yeye ni mtendaji wa moja kwa moja pekee.
theological_decisions:
- issue: Maana ya κρίνῃ ikilinganishwa na σωθῇ
  choice: auhukumu ulimwengu
  alternative: auhukumu ulimwengu kuwa na hatia
  rationale: Kitenzi κρίνω kina maana pana ya kuhukumu, ingawa katika muktadha kinaweza kueleweka kwa maana nyembamba ya kutoa hukumu ya hatia. Matini kuu inadumisha upana wa neno la Kigiriki na mvutano kati ya hukumu na wokovu; maana nyembamba imetajwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo unadumisha marudio ya “ulimwengu,” cheo “Mwana,” na ulinganifu wa makusudi mawili. Tanbihi [a] imewekwa mara tu baada ya kishazi husika.
