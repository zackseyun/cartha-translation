  text: ἀμὴν ἀμὴν λέγω σοι ὅτι ὃ οἴδαμεν λαλοῦμεν καὶ ὃ ἑωράκαμεν μαρτυροῦμεν, καὶ τὴν μαρτυρίαν ἡμῶν οὐ λαμβάνετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/011.yaml
  text: Truly[a], truly, I tell you, we speak what we know and testify to what we have seen[c][b], and you do not receive our testimony.
translation:
  language: sw
  text: Kweli, kweli[a], ninakuambia, tunasema tunachojua na kushuhudia tulichokiona, na ninyi hampokei[c] ushuhuda wetu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Amin, amin, ninakuambia.”
    reason: lexical_alternative
  - marker: b
    text: Haijulikani kwa hakika ni nani wanaojumuishwa katika maneno “tunasema,” “tunashuhudia,” na “wetu.”
    reason: alternative_reading
  - marker: c
    text: Au, “hamkubali.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: Kweli, kweli
  rationale: Huhifadhi urudiaji wa msisitizo na kutoa maana ya kauli hii nzito kwa Kiswahili cha kawaida; umbo la mkopo ‘Amin, amin’ limetajwa katika tanbihi.
- source_word: λέγω σοι
  choice: ninakuambia
  rationale: Ni usemi wa moja kwa moja na wa kawaida unaohifadhi nafsi ya pili umoja ya σοι.
- source_word: ὅτι
  choice: alama ya uakifishaji baada ya ‘ninakuambia’
  rationale: Katika Kiswahili, yaliyomo katika kauli yanaweza kuanza moja kwa moja bila kutafsiri ὅτι kwa neno tofauti; maana yake ya kutambulisha yaliyosemwa imehifadhiwa.
- source_word: ὃ οἴδαμεν
  choice: tunachokijua
  rationale: Hutoa kiwakilishi cha uhusiano cha umoja wa jinsi ya kati kwa njia ya kawaida ya Kiswahili bila kukibadili kuwa orodha ya mambo mengi.
- source_word: λαλοῦμεν
  choice: tunasema
  rationale: Wakati wa sasa unaonyesha tamko la moja kwa moja na la kawaida.
- source_word: ὃ ἑωράκαμεν
  choice: tulichokiona
  rationale: Hueleza kuona kulikotokea na ambalo ndilo msingi wa ushuhuda wa sasa; Kiswahili hakihitaji umbo maalumu linalolingana moja kwa moja na wakati timilifu wa Kigiriki.
- source_word: μαρτυροῦμεν
  choice: kushuhudia
  rationale: Ni kitenzi cha kawaida kinachohifadhi wazo la kutoa ushuhuda na uhusiano wake wa kileksia na ‘ushuhuda’.
- source_word: τὴν μαρτυρίαν ἡμῶν
  choice: ushuhuda wetu
  rationale: Huhifadhi nafsi ya kwanza wingi na msamiati wa ushuhuda bila kufafanua kundi linalomaanishwa.
- source_word: οὐ λαμβάνετε
  choice: ninyi hampokei
  rationale: ‘Kupokea’ huhifadhi taswira na msamiati wa Yohana; ‘ninyi’ huonyesha wazi kuwa hapa anayezungumziwa ni nafsi ya pili wingi, tofauti na ‘ninakuambia’ ya umoja.
- source_word: καὶ ... καὶ
  choice: na ... na
  rationale: Hufuata viunganishi vya Kigiriki moja kwa moja bila kuingiza wazi nguvu ya upinzani ambayo haijaandikwa kwa kiunganishi maalumu.
theological_decisions:
- issue: Rejeo la nafsi ya kwanza wingi katika ‘tunasema ... tunashuhudia ... ushuhuda wetu’
  choice: Wingi umehifadhiwa bila kulitaja kundi hususa.
  alternative: Kufafanua kuwa Yesu anamaanisha yeye na wanafunzi wake, anatumia wingi wa balagha, au anazungumzia ushuhuda wa mbinguni/wa kimungu kwa upana.
  rationale: Maumbo ya Kigiriki ni ya nafsi ya kwanza wingi, lakini rejeo lake linajadiliwa. Tafsiri haipaswi kuondoa utata huo wa kitheolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa msomaji wa kawaida. Tofauti kati ya ‘ninakuambia’ (umoja) na ‘ninyi hampokei’ (wingi) imeonyeshwa wazi. Urudiaji wa mwanzo na viunganishi vya Kigiriki umehifadhiwa, huku sintaksia ikibaki ya kawaida katika Kiswahili.
