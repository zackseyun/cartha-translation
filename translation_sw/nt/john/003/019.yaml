  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: αὕτη δέ ἐστιν ἡ κρίσις ὅτι τὸ φῶς ἐλήλυθεν εἰς τὸν κόσμον καὶ ἠγάπησαν οἱ ἄνθρωποι μᾶλλον τὸ σκότος ἢ τὸ φῶς, ἦν γὰρ ⸂αὐτῶν πονηρὰ⸃ τὰ ἔργα.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/019.yaml
  text: 'And this is the judgment: that the light has come into the world[a], and people loved the darkness rather than the light, because their works were evil.'
translation:
  language: sw
  text: 'Na hii ndiyo hukumu: kwamba nuru imekuja ulimwenguni, na watu walipenda giza kuliko nuru, kwa sababu matendo yao yalikuwa maovu.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κρίσις
  choice: hukumu
  rationale: Neno hili huhifadhi maana pana ya tathmini ya kimungu na matokeo yake bila kuibana mapema kuwa ‘adhabu’ au ‘hatia’ pekee.
- source_word: τὸ φῶς
  choice: nuru
  rationale: Taswira ya Yohana imehifadhiwa bila kumtaja Yesu moja kwa moja ndani ya tafsiri.
- source_word: ἐλήλυθεν
  choice: imekuja
  rationale: Muundo huu huakisi wakati timilifu wa Kigiriki na kusisitiza kuja ambako matokeo yake yanaendelea.
- source_word: κόσμον
  choice: ulimwenguni
  rationale: Hili ni neno la kawaida na la asili kwa κόσμος katika muktadha wa Yohana, likihifadhi upana wake wa kimuktadha.
- source_word: οἱ ἄνθρωποι
  choice: watu
  rationale: Hapa neno la Kigiriki linawahusu wanadamu kwa ujumla, si wanaume pekee; ‘watu’ ni Kiswahili cha kawaida na sahihi.
- source_word: ἠγάπησαν
  choice: wakapenda
  rationale: ‘Kupenda’ huhifadhi nguvu ya kimaadili ya ἀγαπάω, huku kiunganishi cha masimulizi kikitoa mwendo wa sentensi kwa asili.
- source_word: μᾶλλον ... ἢ
  choice: kuliko
  rationale: Katika muundo ‘walipenda X kuliko Y,’ neno hili hutoa ulinganisho wa mapendeleo kwa Kiswahili cha kawaida.
- source_word: τὸ σκότος
  choice: giza
  rationale: Taswira ya giza imehifadhiwa ili kudumisha utofautishaji wake na nuru.
- source_word: πονηρὰ
  choice: maovu
  rationale: Neno hili linaonyesha ubaya wa kimaadili kwa nguvu inayofaa zaidi kuliko ‘mabaya’.
- source_word: τὰ ἔργα
  choice: matendo
  rationale: ‘Matendo’ ni ya asili zaidi katika Kiswahili cha sasa na hubeba maana ya yale watu waliyofanya bila dhana ya kazi za ajira.
theological_decisions:
- issue: Mrejelewa wa ‘nuru’
  choice: Taswira ‘nuru’ imehifadhiwa bila kufafanuliwa katika andiko kuu.
  alternative: Kutafsiri ‘Nuru’ kama cheo dhahiri cha Kristo au kuweka ‘Yesu’ badala yake.
  rationale: Muktadha unaihusianisha nuru na kuja kwa Mwana, lakini Kigiriki kinadumisha taswira; tafsiri haipaswi kuondoa mvutano huo wa kifasihi na kitheolojia.
- issue: Maana ya κρίσις
  choice: hukumu
  alternative: adhabu au uamuzi wa hatia
  rationale: ‘Hukumu’ huhifadhi uwezekano wa maana ya tendo la kuhukumu, tathmini, na matokeo yake, badala ya kuamua mapema kwamba neno linamaanisha adhabu pekee.
- issue: Upeo wa οἱ ἄνθρωποι
  choice: watu
  alternative: wanaume
  rationale: Katika muktadha huu neno linamaanisha wanadamu kwa ujumla. ‘Watu’ huwasilisha upeo huo kwa usahihi na kwa Kiswahili cha kawaida.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa sentensi umehifadhi mantiki ya Kigiriki, huku ‘lakini’ ikionyesha wazi utofauti unaodokezwa na καί katika muktadha: nuru imekuja, lakini mwitikio wa watu ulikuwa kuipenda giza.'
