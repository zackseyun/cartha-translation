  text: ⸀ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Ἀμὴν ἀμὴν λέγω σοι, ἐὰν μή τις γεννηθῇ ἄνωθεν, οὐ δύναται ἰδεῖν τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/003.yaml
  text: Jesus answered and said to him, “Truly, truly, I say to you, unless someone is born from above,[a] he is not able to see the kingdom of God.”
translation:
  language: sw
  text: Yesu akajibu, akamwambia, “Kweli, kweli, ninakuambia, mtu asipozaliwa kutoka juu,[a] hawezi kuuona ufalme wa Mungu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “tena.” Kielezi cha Kigiriki kinaweza kumaanisha “kutoka juu” na pia “tena”; mazungumzo katika mstari unaofuata yanategemea maana hizi mbili.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ
  choice: Yesu akamjibu
  rationale: Kiswahili cha kawaida hutumia kitenzi kimoja ‘akamjibu’ badala ya kurudia ‘akajibu na kumwambia’; maana ya mwitikio kwa mtu huyo inahifadhiwa kwa njia ya asili.
- source_word: Ἀμὴν ἀμὴν
  choice: Kweli, kweli
  rationale: Huhifadhi uradidi wa msisitizo katika Kigiriki huku ikiwa wazi na ya kawaida kwa wasomaji wa Kiswahili cha sasa.
- source_word: λέγω σοι
  choice: ninakuambia
  rationale: Ni tafsiri ya moja kwa moja na ya asili ya kauli ya Yesu kwa mtu mmoja.
- source_word: ἐὰν μή τις
  choice: mtu asipo-
  rationale: Muundo huu unaonyesha sharti hasi la jumla—‘isipokuwa mtu’—kwa Kiswahili fasaha bila kubainisha jinsia.
- source_word: γεννηθῇ
  choice: zaliwa
  rationale: Hutafsiri hali tendwa ya γεννάω bila kuingiza ndani ya kitenzi maana ya ‘tena,’ ambayo inategemea ἄνωθεν.
- source_word: ἄνωθεν
  choice: kutoka juu
  rationale: Maana hii inafaa matumizi ya Yohana na dhamira ya asili ya mbinguni; maana nyingine halisi, ‘tena,’ imehifadhiwa katika tanbihi.
- source_word: οὐ δύναται
  choice: hawezi
  rationale: Ni njia ya kawaida na sahihi ya Kiswahili ya kueleza kutoweza.
- source_word: ἰδεῖν
  choice: kuuona
  rationale: Huhifadhi maana ya msingi ya ‘kuona’ bila kuamua kimya kimya kama inamaanisha kutambua au kushiriki.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: ufalme wa Mungu
  rationale: Ni tafsiri iliyo wazi na iliyozoeleka, inayohifadhi uwezekano wa maana za utawala na himaya.
theological_decisions:
- issue: Maana ya ἄνωθεν katika kauli ya Yesu
  choice: kutoka juu
  alternative: tena; upya
  rationale: Kielezi hiki cha Kigiriki kinaweza kumaanisha ‘kutoka juu’ au ‘tena/upya.’ Muktadha mpana wa Yohana unapendelea asili ya juu, lakini swali la Nikodemo katika mstari unaofuata linategemea maana ya ‘tena.’ Kwa hiyo maandishi makuu yanatumia ‘kutoka juu,’ na maana nyingine inahifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, ya heshima na inayoeleweka kwa urahisi. Muundo wa Kigiriki wenye vitenzi viwili ‘akajibu na kusema’ umewekwa kwa njia ya asili kama ‘akamjibu,’ huku uradidi wenye msisitizo ‘Kweli, kweli’ ukihifadhiwa.
