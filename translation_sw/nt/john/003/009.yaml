  text: Nicodemus answered and said to him[a], “How can these things happen?”
translation:
  language: sw
  text: Nikodemo akamjibu, “Mambo haya yanawezaje kutokea?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: akamjibu
  rationale: Kitenzi hiki katika masimulizi ya mazungumzo humaanisha kujibu. Muundo wa “aka-” unaendeleza mfululizo wa simulizi kwa Kiswahili cha kawaida.
- source_word: Νικόδημος
  choice: Nikodemo
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili.
- source_word: εἶπεν αὐτῷ
  choice: akamjibu
  rationale: Kiswahili cha asili huweza kuunganisha ‘akajibu na kumwambia’ kuwa ‘akamjibu’ bila kupoteza mhusika anayelengwa; kurudia ‘akamwambia’ kungekuwa kizito na kisicho cha lazima.
- source_word: Πῶς
  choice: yanawezaje
  rationale: Kiambishi cha kuuliza “-je” pamoja na kitenzi kinaeleza swali la jinsi au uwezekano kwa Kiswahili cha kawaida.
- source_word: δύναται
  choice: yanaweza
  rationale: Huwasilisha uwezo au uwezekano bila kuongeza ufafanuzi wa kiteolojia.
- source_word: ταῦτα
  choice: mambo haya
  rationale: Huhifadhi wingi wa kiwakilishi na kurejelea mambo ambayo Yesu alikuwa ameeleza.
- source_word: γενέσθαι
  choice: kutokea
  rationale: Huwasilisha maana ya jambo kutendeka au kuja kuwa kwa lugha ya asili; haifanyi swali kuwa tamko la kuwapo tu.
theological_decisions:
- issue: Namna ya kuwasilisha swali la Nikodemo kuhusu mambo ambayo Yesu ameeleza
  choice: Mambo haya yanawezaje kutokea?
  alternative: Mambo haya yanawezaje kuwa?
  rationale: “Kutokea” hudumisha maana ya γίνομαι ya kutendeka au kuja kuwa, huku ikiacha fumbo na mvutano wa kauli ya Yesu bila kuufafanua kidhehebu. “Kuwa” linawezekana lakini linaweza kusikika kama swali kuhusu hali ya kuwapo tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Usemi umewekwa kwa ufupi na kwa mtiririko wa kawaida wa simulizi. Hakuna tanbihi iliyohitajika, kwa kuwa tofauti ya “kutokea/kuwa” si lazima kwa toleo hili na hakuna alama ya tanbihi katika matini kuu.
