  yaml_path: translation/nt/john/003/013.yaml
  text: And no one has ascended into heaven except the one who descended from heaven—the Son of Man[a][b].
translation:
  language: sw
  text: Wala hakuna mtu aliyepaa kwenda mbinguni isipokuwa yeye aliyeshuka kutoka mbinguni—Mwana wa Adamu.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “yeye aliyekuja chini kutoka mbinguni.”
    reason: lexical_alternative
  - marker: b
    text: “Mwana wa Adamu” ni jina la Yesu la kawaida la kujitaja, nalo lina mwangwi wa Danieli 7:13–14.
    reason: cross_reference
lexical_decisions:
- source_word: οὐδεὶς
  choice: hakuna mtu
  rationale: Hutoa kwa Kiswahili cha kawaida maana ya kiwakilishi hasi kisichoainisha mtu, bila kutumia mtindo wa kale au kupunguza wigo wake.
- source_word: ἀναβέβηκεν
  choice: aliyepaa
  rationale: Kitenzi “kupaa” kinafaa kwa mwendo kuelekea mbinguni na kudumisha hadhi ya usemi; muundo wa wakati uliopita wa uhusiano unawasilisha tendo lililotimia katika sentensi hii.
- source_word: εἰς τὸν οὐρανόν
  choice: kwenda mbinguni
  rationale: Huonyesha mwelekeo wa kuingia au kufika mbinguni kwa Kiswahili cha asili, huku ikidumisha utofautishaji wa kupaa na kushuka.
- source_word: εἰ μὴ
  choice: isipokuwa
  rationale: Huweka wazi kwamba anayefuata ndiye pekee anayeondolewa katika kauli hasi iliyotangulia.
- source_word: ὁ ἐκ τοῦ οὐρανοῦ καταβάς
  choice: yeye aliyeshuka kutoka mbinguni
  rationale: Huhifadhi muundo wa kirai cha kishiriki kinachomtaja mtu na ulinganifu wa kimaana kati ya kupaa na kushuka.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  rationale: Hili ndilo jina la kujitaja la Yesu lililozoeleka katika tafsiri za Kiswahili na huhifadhi mwangwi wa Danieli 7 pamoja na uzito wake wa kimuktadha.
theological_decisions:
- issue: Nguvu ya kikristolojia ya “Mwana wa Adamu”
  choice: Kutafsiri kama jina linalotambulika, “Mwana wa Adamu,” bila kulifafanua kwa maneno mengine.
  alternative: Mwanadamu
  rationale: “Mwana wa Adamu” huhifadhi kwa pamoja hali ya msemo, jina la kujitaja, na mwangwi wa kiapokaliptiki wa Danieli 7:13–14, badala ya kuufanya usemi uwe wa kijumla tu.
- issue: Maana ya wakati na hali katika lugha ya kupaa na kushuka
  choice: Kutumia “aliyepaa” na “aliyeshuka” bila kuongeza ufafanuzi wa kimafundisho.
  alternative: aliyekwenda juu ... aliyekuja chini
  rationale: Uteuzi huu huhifadhi dai la maandishi kuhusu asili ya mbinguni na ufikiaji wa pekee, huku ukiepuka kufafanua zaidi ya maneno ya Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Wala hakuna mtu” huunganisha mstari huu na hoja iliyotangulia; “yaani” hutambulisha kwa uwazi kiambatisho “Mwana wa Adamu” bila kuongeza tafsiri ya kimafundisho.
