id: JHN.3.12
reference: John 3:12
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἰ τὰ ἐπίγεια εἶπον ὑμῖν καὶ οὐ πιστεύετε, πῶς ἐὰν εἴπω ὑμῖν τὰ ἐπουράνια πιστεύσετε;
base_translation:
  language: en
  yaml_path: translation/nt/john/003/012.yaml
  text: If I told you about earthly things and you do not believe[b][a], how will you believe if I tell you about heavenly things?
translation:
  language: sw
  text: Ikiwa niliwaambia mambo ya duniani[a] nanyi hamwamini, mtaaminije ikiwa nitawaambia mambo ya mbinguni[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mambo yaliyo duniani.”
    reason: lexical_alternative
  - marker: b
    text: Au, “mambo yaliyo mbinguni.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἐπίγεια
  choice: mambo ya duniani
  rationale: Kivumishi cha wingi wa jinsi ya kati kimetumiwa kama nomino. ‘Mambo ya duniani’ ni Kiswahili cha kawaida kinachohifadhi utofautishaji wake na ‘mambo ya mbinguni’ bila kufafanua kupita kiasi.
- source_word: εἶπον
  choice: nimewaambia
  rationale: Ingawa ni aoristi, hapa kinarejelea maneno ambayo Yesu tayari amemwambia Nikodemo; timilifu ya Kiswahili ni ya asili katika muktadha huu na inahifadhi wazo la tendo lililotangulia lenye umuhimu sasa.
- source_word: ὑμῖν
  choice: wa-
  rationale: Kiwakilishi hiki ni cha wingi. Kiambishi cha yambwa ‘wa-’ katika ‘nimewaambia’ kinahifadhi wingi huo, hata ingawa Yesu anazungumza moja kwa moja na Nikodemo.
- source_word: οὐ πιστεύετε
  choice: hamwamini
  rationale: Wakati wa sasa wenye ukanushi unaonyesha mwitikio wao wa sasa au wa kawaida. ‘Hamwamini’ ni fasaha na haiongezi maana mahsusi ya kumtumaini mtu ambayo muktadha hauilazimishi.
- source_word: πῶς ... πιστεύσετε
  choice: mtaaminije
  rationale: 'Huhifadhi wakati ujao na nguvu ya swali la balagha: kwa namna gani wataamini baadaye ikiwa hawajaamini yale yaliyokwisha kusemwa.'
- source_word: ἐὰν εἴπω
  choice: ikiwa nitawaambia
  rationale: Muundo wa sharti pamoja na aoristi tegemezi unaelekea hali inayowezekana wakati ujao; ‘ikiwa nitawaambia’ ni ya kawaida na hudhihirisha mwelekeo huo.
- source_word: τὰ ἐπουράνια
  choice: mambo ya mbinguni
  rationale: Kivumishi cha wingi kimetumiwa kama nomino. Tafsiri hii huhifadhi ulinganifu na ‘mambo ya duniani’ na haiamui kama maana ni mambo yaliyoko mbinguni au mambo yenye asili/sifa ya mbinguni.
theological_decisions:
- issue: Maana ya utofautishaji kati ya τὰ ἐπίγεια na τὰ ἐπουράνια
  choice: mambo ya duniani ... mambo ya mbinguni
  alternative: mifano ya mambo ya dunia ... siri za kina za Mungu
  rationale: Maneno ya Kigiriki yanaweka makundi mawili yanayotofautishwa lakini hayafafanui kwa uhakika kama ya kwanza ni mifano ya kidunia au matukio duniani, wala kama ya pili ni mafumbo ya kina ya Mungu. Tafsiri pana huhifadhi utata na mvutano wa kifungu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo ‘nanyi hamwamini’ huhifadhi mkazo wa kuunganisha kauli mbili kwa καί, huku ‘mtaaminije’ likiwa swali la balagha la kawaida. Alama zote za tanbihi zimewekwa baada ya virai vinavyohusika.
