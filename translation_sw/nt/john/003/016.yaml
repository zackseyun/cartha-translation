  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Οὕτως γὰρ ἠγάπησεν ὁ θεὸς τὸν κόσμον ὥστε τὸν ⸀υἱὸν τὸν μονογενῆ ἔδωκεν, ἵνα πᾶς ὁ πιστεύων εἰς αὐτὸν μὴ ἀπόληται ἀλλὰ ἔχῃ ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/016.yaml
  text: 'For God loved the world in this way: he gave his only Son[b][a], so that everyone who believes in him should not perish but have eternal life.'
translation:
  language: sw
  text: 'Kwa maana Mungu aliupenda ulimwengu kwa njia hii[a]: alimtoa Mwanawe wa pekee[b], ili kila mtu anayemwamini asiangamie, bali awe na uzima wa milele.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa tafsiri iliyozoeleka, “Kwa maana Mungu aliupenda ulimwengu sana.” Kigiriki kinaweza kueleweka kuwa kinakazia namna ya upendo wa Mungu: “Mungu aliupenda ulimwengu kwa njia hii.”'
    reason: lexical_alternative
  - marker: b
    text: Au “Mwanawe wa pekee aliyezaliwa”; pia yawezekana, “Mwanawe wa kipekee.”
    reason: alternative_reading
lexical_decisions:
- source_word: Οὕτως
  choice: kwa njia hii
  rationale: Katika muktadha huu, neno linaelekeza hasa namna Mungu alivyoonyesha upendo wake, ambayo inaelezwa kwa kumtoa Mwana.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Inahifadhi kazi ya kutoa sababu au maelezo yanayounganisha mstari huu na yaliyotangulia.
- source_word: ἠγάπησεν
  choice: aliupenda
  rationale: Wakati uliopita unaonyesha tendo la Mungu la upendo; kiambishi cha yambwa kinakubaliana kwa kawaida na 'ulimwengu'.
- source_word: τὸν κόσμον
  choice: ulimwengu
  rationale: Inahifadhi upana wa neno la Kigiriki bila kulifupisha kuwa wanadamu pekee.
- source_word: ὥστε ... ἔδωκεν
  choice: ': alimtoa'
  rationale: Nukta mbili zinaanzisha kwa Kiswahili cha kawaida namna halisi ambayo upendo huo ulionyeshwa; 'alimtoa' linaacha upeo wa utoaji wazi kama ilivyo katika Kigiriki.
- source_word: τὸν υἱὸν τὸν μονογενῆ
  choice: Mwanawe wa pekee
  rationale: Linaonyesha uhusiano wa Mwana na upekee wake kwa lugha ya kawaida, bila kulazimisha wazo la kuzaliwa kimwili ndani ya neno μονογενής.
- source_word: ἵνα
  choice: ili
  rationale: Linaonyesha kusudi au matokeo yaliyokusudiwa kwa Kiswahili fasaha.
- source_word: πᾶς ὁ πιστεύων εἰς αὐτὸν
  choice: kila mtu anayemwamini
  rationale: Ni usemi jumuishi na wa kawaida unaohifadhi maana ya kuamini katika yeye bila kuamua mijadala ya baadaye ya kiteolojia.
- source_word: μὴ ἀπόληται
  choice: asiangamie
  rationale: Huhifadhi uzito wa kitenzi na hali ya kusudi inayofuata 'ili' bila kufafanua kupita kiasi namna ya kuangamia.
- source_word: ἔχῃ ζωὴν αἰώνιον
  choice: awe na uzima wa milele
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kuwa na uzima wa milele.
theological_decisions:
- issue: Maana ya Οὕτως
  choice: 'namna: ''kwa njia hii'''
  alternative: '''sana'' au ''kiasi hiki'''
  rationale: Muundo wa sentensi unaeleza upendo wa Mungu kwa tendo la kumtoa Mwana; tafsiri hii haitoi kipaumbele kisicholazimishwa kwa kiwango cha hisia.
- issue: Tafsiri ya μονογενής kuhusu Mwana
  choice: '''Mwanawe wa pekee'' katika matini kuu'
  alternative: '''Mwanawe wa pekee aliyezaliwa'' au ''Mwanawe wa kipekee'''
  rationale: Upekee wa uhusiano wa Mwana unahifadhiwa, huku tafsiri ya jadi yenye 'aliyezaliwa' ikiwekwa katika tanbihi kwa sababu ya umuhimu wake wa kihistoria na kiteolojia.
- issue: Upeo wa πᾶς ὁ πιστεύων
  choice: '''kila mtu anayemwamini'''
  alternative: '''yeyote anayemwamini'''
  rationale: Inahifadhi lugha jumuishi ya mstari bila kuingiza msimamo wa dhehebu kuhusu uteule, upatanisho, au mwitikio wa mwanadamu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Mpangilio wa tanbihi [b][a] umehifadhiwa kulingana na matini ya ushauri ya POB, na kila alama ina tanbihi inayolingana.
