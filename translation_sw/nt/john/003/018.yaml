  text: ὁ πιστεύων εἰς αὐτὸν οὐ κρίνεται· ὁ ⸀δὲ μὴ πιστεύων ἤδη κέκριται, ὅτι μὴ πεπίστευκεν εἰς τὸ ὄνομα τοῦ μονογενοῦς υἱοῦ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/018.yaml
  text: The one who believes in him is not judged[a]; but the one who does not believe has already been judged[b], because he has not believed in the name of the one and only Son of God.
translation:
  language: sw
  text: 'Anayemwamini hahukumiwi kuwa na hatia[a]; lakini asiyemwamini amekwisha kuhukumiwa kuwa na hatia, kwa sababu hajaliamini jina la Mwana wa pekee[b] wa Mungu.


    [a] Au, “hahukumiwi” na “amekwisha kuhukumiwa.” Kitenzi cha Kigiriki kinaweza kumaanisha “kuhukumu” au, katika muktadha huu, “kuhukumu kuwa na hatia.”


    [b] Au, “Mwana wa kipekee”; kwa mapokeo, “Mwana pekee aliyezaliwa.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hahukumiwi” na “amekwisha kuhukumiwa.” Kitenzi cha Kigiriki kinaweza kumaanisha “kuhukumu” au, katika muktadha huu, “kuhukumu kuwa na hatia.”
    reason: lexical_alternative
  - marker: b
    text: Au, “Mwana wa kipekee”; kwa mapokeo, “Mwana pekee aliyezaliwa.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ πιστεύων εἰς αὐτόν
  choice: Anayemwamini
  rationale: Muundo huu wa Kiswahili ni wa kawaida na unaonyesha mtu yeyote mwenye imani inayomwelekea yeye binafsi; kiambishi -mw- kinaunganisha kwa asili maana ya εἰς αὐτόν.
- source_word: οὐ κρίνεται
  choice: hahukumiwi kuwa na hatia
  rationale: Muktadha wa Yohana 3:17–19 unaelekeza kwenye hukumu mbaya, lakini tanbihi inahifadhi maana pana ya kitenzi κρίνω, yaani ‘kuhukumu.’
- source_word: ὁ δὲ μὴ πιστεύων
  choice: lakini asiyemwamini
  rationale: ‘Lakini’ linaonyesha utofauti unaoletwa na δέ, na ‘asiyemwamini’ ni Kiswahili cha asili kwa kishiriki hiki kilichotumiwa kama nomino.
- source_word: ἤδη κέκριται
  choice: amekwisha kuhukumiwa kuwa na hatia
  rationale: ‘Amekwisha’ linaonyesha tendo lililokamilika pamoja na hali yake inayoendelea, kama wakati timilifu wa Kigiriki.
- source_word: ὅτι μὴ πεπίστευκεν
  choice: kwa sababu hajaliamini
  rationale: ‘Kwa sababu’ linaonyesha sababu waziwazi; ‘hajaliamini’ linahifadhi hali ya kutokuamini inayotokana na wakati timilifu.
- source_word: εἰς τὸ ὄνομα
  choice: jina
  rationale: Katika ‘hajaliamini jina,’ kiambishi -li- kinarejelea ‘jina’; neno halijafafanuliwa zaidi ili kuhifadhi usemi halisi wa Yohana kuhusu utambulisho na mamlaka ya mtu.
- source_word: τοῦ μονογενοῦς υἱοῦ τοῦ θεοῦ
  choice: la Mwana wa pekee wa Mungu
  rationale: ‘Wa pekee’ linaeleza upekee wa Mwana bila kuingiza moja kwa moja wazo la kuzaliwa kibayolojia; tafsiri nyingine muhimu zimehifadhiwa katika tanbihi.
theological_decisions:
- issue: Maana ya κρίνω katika mstari huu
  choice: kuhukumiwa kuwa na hatia katika sehemu zote mbili
  alternative: kuhukumiwa
  rationale: Muktadha unahusu wokovu dhidi ya hukumu mbaya, hivyo usemi huu unaweka wazi nguvu ya kimahakama; tanbihi inadumisha uwezekano mpana wa ‘kuhukumiwa’ bila kutatua kimya kimya utata wa Kigiriki.
- issue: Maana ya μονογενής
  choice: Mwana wa pekee
  alternative: Mwana wa kipekee; kwa mapokeo, Mwana pekee aliyezaliwa
  rationale: Tafsiri kuu inasisitiza upekee wa Mwana kulingana na ushahidi wa kileksika, huku tanbihi ikihifadhi tafsiri ya kipekee na ile ya kimapokeo bila kulazimisha lugha ya baadaye ya kimafundisho ndani ya mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa urahisi. Miundo ‘anayemwamini/asiyemwamini’ ni ya kawaida na fasaha; ‘amekwisha’ huhifadhi nguvu ya wakati timilifu bila kuwa nzito. Alama zote za tanbihi zimewekwa katika matini kuu karibu na maneno yanayohusika.
