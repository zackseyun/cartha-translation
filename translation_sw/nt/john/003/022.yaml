  text: Μετὰ ταῦτα ἦλθεν ὁ Ἰησοῦς καὶ οἱ μαθηταὶ αὐτοῦ εἰς τὴν Ἰουδαίαν γῆν, καὶ ἐκεῖ διέτριβεν μετ’ αὐτῶν καὶ ἐβάπτιζεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/022.yaml
  text: After these things[a], Jesus and his disciples went into the land of Judea[c][b], and there he was spending time with them and baptizing.
translation:
  language: sw
  text: Baada ya hayo, Yesu na wanafunzi wake walikwenda katika nchi ya Yudea, na huko alikuwa akitumia muda pamoja nao, akibatiza.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yohana 4:2 hufafanua baadaye kwamba Yesu mwenyewe hakuwa akibatiza, bali wanafunzi wake.
    reason: cross_reference
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: Baada ya hayo
  rationale: Ni mpito wa kawaida wa kisimulizi unaohifadhi wingi wa ταῦτα kwa Kiswahili cha asili bila kuwa mzito.
- source_word: ἦλθεν
  choice: walikwenda
  rationale: Ingawa kitenzi cha Kigiriki kwa msingi ni ‘alikuja,’ muktadha unaonyesha mwendo wa Yesu pamoja na wanafunzi wake kuelekea Yudea; ‘walikwenda’ ni ya kawaida katika simulizi la Kiswahili. Wingi unawahusisha Yesu na wanafunzi wake kama kundi linalosafiri.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: wanafunzi wake
  rationale: Hii ni tafsiri ya kawaida na wazi ya muundo wa umilikaji.
- source_word: εἰς τὴν Ἰουδαίαν γῆν
  choice: katika eneo la Yudea
  rationale: γῆ hapa linaweza kumaanisha nchi au eneo. ‘Eneo la Yudea’ linaonyesha kuwa walitoka katika mazingira ya mji kwenda sehemu nyingine ya Yudea bila kulazimisha maana ya mashambani.
- source_word: διέτριβεν
  choice: akakaa huko
  rationale: Kitenzi kinaonyesha kukaa au kutumia muda mahali. ‘Akakaa huko’ ni cha asili na kinaeleza hali iliyoendelea katika muktadha.
- source_word: μετ’ αὐτῶν
  choice: pamoja nao
  rationale: Hurejelea wanafunzi wake na kutafsiri kwa uwazi uhusiano unaoonyeshwa na kihusishi.
- source_word: ἐβάπτιζεν
  choice: kubatiza
  rationale: ‘Kubatiza’ ni neno la kawaida la Kiswahili kwa tendo hili la kidini na halilazimishi mtindo maalumu wa ubatizo. Muundo ‘akakaa ... na kubatiza’ unaendeleza Yesu kama kiima cha kisarufi cha mstari.
theological_decisions:
- issue: Kiima cha tendo la kubatiza kwa kuzingatia Yohana 4:2
  choice: Kudumisha Yesu kama kiima cha kisarufi katika mstari huu
  alternative: Kusema moja kwa moja kwamba wanafunzi wake ndio waliobatiza
  rationale: Kitenzi cha umoja katika sentensi ya Kigiriki kwa kawaida humrejelea Yesu. Yohana 4:2 baadaye hufafanua kwamba si Yesu mwenyewe aliyebatiza, bali wanafunzi wake; hivyo mstari huu haupaswi kuandikwa upya ili kuondoa mvutano huo wa kisimulizi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. ‘Eneo la Yudea’ huepuka usemi mzito wa ‘nchi ya Yudea’ na pia haliongezi dhana ya mashambani ambayo haijaelezwa wazi.
