base_translation:
  language: en
  yaml_path: translation/nt/john/003/021.yaml
  text: But the one who does the truth comes to the light[a], so that his works may be revealed[d][c][b], because they have been done in God.
translation:
  language: sw
  text: Lakini yule atendaye kweli huja kwenye nuru[a], ili matendo yake yaonekane wazi kwamba yametendwa katika Mungu[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa halisi, “atendaye kweli.” Pia inaweza kueleweka “anayeishi kwa kufuata kweli” au “anayefanya yaliyo ya kweli.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa sababu yametendwa katika Mungu.” Neno la Kigiriki linaweza kutambulisha ama maudhui yanayofunuliwa ama sababu ya kufunuliwa.
    reason: alternative_reading
  - marker: c
    text: “Katika Mungu” pia linaweza kueleweka kuwa “kwa Mungu” au “kwa njia ya Mungu,” lakini msemo wa Kigiriki unaacha maana hiyo wazi zaidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ποιῶν τὴν ἀλήθειαν
  choice: Lakini mtu anayeitenda kweli
  rationale: δέ inaonyesha utofautishaji wa upole na mstari uliotangulia. Kirai cha Kigiriki kwa halisi ni ‘kuitenda kweli’; tafsiri hii inadumisha wazo la Kiyohana kwamba kweli huonekana katika matendo, huku ‘mtu anaye-’ ikiwakilisha kishiriki chenye kibainishi kinachomtaja mtu mwenye sifa hiyo ya kudumu.
- source_word: ἔρχεται πρὸς τὸ φῶς
  choice: huja kwenye nuru
  rationale: πρός pamoja na kitenzi cha mwendo ina maana ya kuelekea au kuja kwenye kitu. ‘Kwenye nuru’ ni Kiswahili cha kawaida kinachohifadhi sitiari ya kuikaribia nuru bila kuibadili kuwa maelezo ya ndani ya sitiari hiyo.
- source_word: ἵνα φανερωθῇ αὐτοῦ τὰ ἔργα
  choice: ili matendo yake yafunuliwe
  rationale: ἵνα inaonyesha kusudi, na φανερωθῇ ni hali ya kutendwa. ‘Yafunuliwe’ huhifadhi kusudi na sauti ya kutendwa; ‘matendo’ ni ya asili zaidi kwa ἔργα katika muktadha wa maadili kuliko ‘kazi’.
- source_word: ὅτι
  choice: kuwa
  rationale: Hapa ὅτι inaweza kutambulisha maudhui yanayofunuliwa au sababu ya kufunuliwa. ‘Kuwa’ katika matini kuu inafuata usomaji wa maudhui, lakini uwezekano wa ‘kwa sababu’ umehifadhiwa katika tanbihi.
- source_word: ἐν θεῷ
  choice: katika Mungu
  rationale: Tafsiri ya karibu inaacha wazi kama kirai kinaonyesha mazingira ya uhusiano na Mungu, utendaji wake, au njia yake. Haitafsiriwi moja kwa moja ‘na Mungu’ au ‘kwa njia ya Mungu,’ kwa kuwa Kigiriki hakilazimishi maana moja tu.
- source_word: ἐστιν εἰργασμένα
  choice: yametendwa
  rationale: Muundo wa wakati timilifu wa kutendwa unaonyesha matendo yaliyokamilishwa na yenye hali inayoendelea. ‘Yametendwa’ ni ya asili na huhifadhi sauti ya kutendwa pamoja na athari ya wakati timilifu.
theological_decisions:
- issue: Maana ya msemo ποιῶν τὴν ἀλήθειαν
  choice: anayeitenda kweli
  alternative: anayeishi kwa kufuata kweli; anayefanya yaliyo ya kweli
  rationale: 'Tafsiri ya karibu inadumisha uzito wa Kiyohana: kweli si jambo la kukubaliwa kiakili tu, bali pia hutendwa. Mbadala wenye ufafanuzi zaidi ungefunga maana mapema.'
- issue: Kazi ya ὅτι
  choice: kuwa, ikitambulisha maudhui ya yanayofunuliwa
  alternative: kwa sababu, ikitambulisha sababu ya kufunuliwa
  rationale: Miundo yote miwili inawezekana kisarufi. Matini kuu inachagua maudhui kwa sababu yanafuata kwa urahisi baada ya ‘yafunuliwe,’ huku tanbihi ikihifadhi usomaji wa kisababishi.
- issue: Maana ya ἐν θεῷ
  choice: katika Mungu
  alternative: na Mungu; kwa njia ya Mungu; katika ushirika na Mungu
  rationale: Kirai kina upana wa kiteolojia unaoweza kuhusisha nyanja, uhusiano, au utendaji wa Mungu. Tafsiri ya karibu haifanyi maana moja kuwa ya lazima.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Kuitenda kweli’ ni msemo usio wa kawaida kidogo lakini umehifadhiwa kimakusudi kwa sababu ya uzito wake katika matini ya Yohana; tanbihi inatoa maana za kawaida zaidi. Alama zote za tanbihi zimo katika matini kuu.
