  yaml_path: translation/nt/john/003/001.yaml
  text: There was a man from the Pharisees named Nicodemus[a], a ruler of the Jews.
translation:
  language: sw
  text: Kulikuwa na mtu wa Mafarisayo aliyeitwa Nikodemo, kiongozi wa Wayahudi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kiongozi wa Wayudea.” Neno la Kigiriki linaweza kumaanisha Wayahudi kwa ujumla au, katika baadhi ya miktadha, Wayudea. Katika muktadha huu, kifungu hicho kinaweza kueleweka kuwa kinahusu uongozi wa Kiyahudi.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἦν δὲ
  choice: Kulikuwa na
  rationale: ἦν inatambulisha kuwepo kwa mtu katika simulizi, na δέ ni kiunganishi hafifu cha kuendeleza habari. Kiswahili cha asili hakihitaji kuongeza ‘sasa’; mwanzo ‘Kulikuwa na’ unabeba utangulizi wa simulizi kwa uwazi.
- source_word: ἄνθρωπος
  choice: mtu mmoja
  rationale: Neno hili linamtaja mtu mahususi wa kiume; muktadha na jina Nikodemo vinaonyesha jinsia yake, huku ‘mtu mmoja’ ikiwa njia ya kawaida ya Kiswahili ya kumtambulisha mhusika mpya.
- source_word: ἐκ τῶν Φαρισαίων
  choice: wa Mafarisayo
  rationale: ἐκ pamoja na hali ya umilikishi huonyesha kuwa Nikodemo alikuwa mmoja wa kundi la Mafarisayo. ‘Wa Mafarisayo’ ni ya kawaida na inaonyesha uanachama huo bila kudokeza tu mahali alikotoka.
- source_word: Νικόδημος ὄνομα αὐτῷ
  choice: jina lake Nikodemo
  rationale: Huu ni usemi wa kawaida wa Kigiriki wa kutaja jina. ‘Jina lake Nikodemo’ ni wa asili, mfupi, na wenye heshima katika Kiswahili.
- source_word: ἄρχων
  choice: kiongozi
  rationale: ἄρχων humaanisha mtu mwenye mamlaka. ‘Kiongozi’ huhifadhi wazo la cheo na mamlaka bila kulazimisha hitimisho lisilotajwa wazi kwamba alikuwa mtawala wa kisiasa au mwanachama wa baraza fulani.
- source_word: τῶν Ἰουδαίων
  choice: wa Wayahudi
  rationale: Katika Yohana, Ἰουδαῖοι inaweza kurejelea Wayahudi kwa ujumla, Wayudea, au viongozi wa Kiyahudi kulingana na muktadha. Hapa ‘wa Wayahudi’ huhifadhi maana pana ya kijamii na kidini; uwezekano mwembamba zaidi umewekwa katika tanbihi.
theological_decisions:
- issue: Maana ya Ἰουδαίων katika muktadha wa Injili ya Yohana
  choice: wa Wayahudi
  alternative: wa Wayudea; au miongoni mwa viongozi wa Kiyahudi
  rationale: Kwa kuwa Nikodemo ametambulishwa kuwa Farisayo na mwenye mamlaka, usemi unaweza kuhusiana hasa na uongozi wa Kiyahudi. Hata hivyo, neno lenyewe pia linaweza kuwa na maana ya kikabila, kidini, au kieneo. Tafsiri kuu haifungi maana hiyo kwa ‘Wayudea’ wala haiongezi ‘miongoni mwa viongozi’; tanbihi huhifadhi utata halisi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imegawanywa mara mbili ili utambulisho wa Nikodemo na nafasi yake usomeke kwa urahisi bila kubadili uhusiano wa vipashio vya Kigiriki. Alama ya tanbihi imewekwa baada ya ‘Wayahudi,’ neno linalohusika moja kwa moja na tanbihi.
