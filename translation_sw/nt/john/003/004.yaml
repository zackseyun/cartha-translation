reference: John 3:4
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: λέγει πρὸς αὐτὸν ⸀ὁ Νικόδημος· Πῶς δύναται ἄνθρωπος γεννηθῆναι γέρων ὤν; μὴ δύναται εἰς τὴν κοιλίαν τῆς μητρὸς αὐτοῦ δεύτερον εἰσελθεῖν καὶ γεννηθῆναι;
base_translation:
  language: en
  yaml_path: translation/nt/john/003/004.yaml
  text: Nicodemus said to him[a], “How can a man be born when he is old? He cannot enter his mother’s womb a second time and be born[b], can he?”
translation:
  language: sw
  text: Nikodemo akamwambia, “Mtu anawezaje kuzaliwa akiwa mzee? Hawezi kuingia tumboni mwa mama yake mara ya pili na kuzaliwa, sivyo?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει πρὸς αὐτὸν
  choice: akamwambia
  rationale: Wakati uliopo wa kihistoria katika simulizi la Yohana umetafsiriwa kwa wakati uliopita wa masimulizi; kiambishi -ka- kinaendeleza mfululizo wa matukio kwa Kiswahili cha kawaida.
- source_word: ὁ Νικόδημος
  choice: Nikodemo
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili.
- source_word: Πῶς δύναται ἄνθρωπος γεννηθῆναι
  choice: Mtu anawezaje kuzaliwa
  rationale: Hii ni tafsiri ya kawaida ya swali kuhusu uwezekano. 'Mtu' humwakilisha binadamu yeyote na inafaa kwa matumizi ya jumla ya ἄνθρωπος.
- source_word: γέρων ὤν
  choice: akiwa mzee
  rationale: Kirai shirikishi kimetafsiriwa kwa kishazi cha hali kinachosikika kwa kawaida katika Kiswahili.
- source_word: μὴ δύναται
  choice: Hawezi ... sivyo?
  rationale: μή hutambulisha swali linalotarajia jibu hasi; muundo huu unadumisha mshangao na kutokuamini kwa Nikodemo.
- source_word: κοιλίαν τῆς μητρὸς αὐτοῦ
  choice: tumboni mwa mama yake
  rationale: Katika muktadha huu κοιλία ni tumbo la uzazi. Usemi 'tumboni mwa mama yake' ni wa kawaida, wazi, na wenye hadhi katika Kiswahili.
- source_word: δεύτερον
  choice: mara ya pili
  rationale: Hutoa moja kwa moja maana ya 'mara ya pili' na kuhifadhi ufahamu halisi wa Nikodemo bila kuingiza maana pana ya 'tena'.
- source_word: εἰσελθεῖν καὶ γεννηθῆναι
  choice: kuingia ... na kuzaliwa
  rationale: Vitenzi vyote viwili vimewekwa wazi ili kuhifadhi picha na mantiki ya swali la Nikodemo.
theological_decisions:
- issue: Jinsi ya kutafsiri ἄνθρωπος yenye matumizi ya jumla
  choice: mtu
  alternative: mwanamume
  rationale: Ingawa umbo la Kigiriki ni la kiume katika umoja, hapa lina maana ya jumla ya binadamu. Kiswahili 'mtu' huhifadhi maana hiyo bila kudokeza kwamba swali linawahusu wanaume pekee.
- issue: Kama kuingiza maana ya 'kuzaliwa tena' kutoka Yohana 3:3
  choice: kuzaliwa ... mara ya pili
  alternative: kuzaliwa tena
  rationale: Mstari huu una δεύτερον, yaani 'mara ya pili,' ambayo inaonyesha tafsiri halisi ya Nikodemo. Tafsiri haijaamua kimyakimya utata wa ἄνωθεν katika mstari uliotangulia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wa simulizi la kawaida; swali la mwisho limeundwa ili kutarajia jibu hasi na kuhifadhi mshangao wa Nikodemo.
