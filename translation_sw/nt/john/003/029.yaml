id: JHN.3.29
reference: John 3:29
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὁ ἔχων τὴν νύμφην νυμφίος ἐστίν· ὁ δὲ φίλος τοῦ νυμφίου ὁ ἑστηκὼς καὶ ἀκούων αὐτοῦ, χαρᾷ χαίρει διὰ τὴν φωνὴν τοῦ νυμφίου. αὕτη οὖν ἡ χαρὰ ἡ ἐμὴ πεπλήρωται.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/029.yaml
  text: The one who has the bride is the bridegroom[a]. But the friend of the bridegroom, who stands and hears him, rejoices greatly because of the bridegroom’s voice[c][b]. Therefore this joy of mine has been made complete.
translation:
  language: sw
  text: Aliye na bibi-arusi ndiye bwana-arusi. Lakini rafiki wa bwana-arusi[a], aliyesimama na kumsikia, hufurahi sana[b] kwa sababu ya sauti ya bwana-arusi. Kwa hiyo, furaha yangu hii imekamilika[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno halisi, “rafiki wa bwana-arusi.” Katika baadhi ya desturi, jukumu lake linaweza kufanana kwa kiasi fulani na la rafiki mkuu wa bwana-arusi.
    reason: cultural_note
  - marker: b
    text: Kwa neno halisi zaidi, “hufurahi kwa furaha”; Kigiriki hutumia maneno yenye mzizi mmoja ili kukazia ukubwa wa furaha.
    reason: lexical_alternative
  - marker: c
    text: Au “imetimizwa” au “imefikia utimilifu.” Neno la Kigiriki linaweza kumaanisha kufikishwa kwenye utimilifu au ukamilifu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἔχων τὴν νύμφην
  choice: Aliye na bibi-arusi
  rationale: Kirai cha nomino kinachoundwa na participio kina maana ya ‘yule aliye na’; ‘bibi-arusi’ huhifadhi picha ya harusi na ulinganifu wake na ‘bwana-arusi.’
- source_word: νυμφίος
  choice: bwana-arusi
  rationale: Ni neno la kawaida na lenye heshima katika Kiswahili kwa mwanamume anayefunga ndoa, nalo huhifadhi picha ya harusi inayorudiwa katika mstari huu.
- source_word: φίλος τοῦ νυμφίου
  choice: rafiki wa bwana-arusi
  rationale: Tafsiri hii hufuata moja kwa moja neno la Kigiriki φίλος, ‘rafiki,’ bila kuingiza cheo maalumu cha kitamaduni kama ‘msimamizi wa bwana-arusi’ katika matini.
- source_word: ὁ ἑστηκὼς καὶ ἀκούων αὐτοῦ
  choice: anayesimama na kumsikia
  rationale: Huhifadhi hali ya rafiki aliyesimama akihudhuria na anayemsikia bwana-arusi; ‘kumsikia’ pia huepuka kuongeza neno ‘sauti’ kabla ya kutajwa kwake wazi baadaye.
- source_word: χαρᾷ χαίρει
  choice: hufurahi sana
  rationale: Muundo wa Kigiriki unaunganisha nomino na kitenzi vya mzizi mmoja ili kukazia furaha. ‘Hufurahi sana’ huwasilisha mkazo huo kwa Kiswahili cha kawaida.
- source_word: διὰ τὴν φωνὴν τοῦ νυμφίου
  choice: kwa sababu ya sauti ya bwana-arusi
  rationale: διά pamoja na akusativi huonyesha sababu; tafsiri hii huhifadhi uhusiano huo wazi.
- source_word: αὕτη οὖν ἡ χαρὰ ἡ ἐμὴ
  choice: Kwa hiyo, furaha yangu hii
  rationale: ‘Kwa hiyo’ huonyesha hitimisho la οὖν, huku ‘furaha yangu hii’ ikihifadhi kiwakilishi cha kuonyesha na msisitizo wa umilikaji.
- source_word: πεπλήρωται
  choice: imekamilika
  rationale: Kauli timilifu inaonyesha furaha iliyofikishwa kwenye hali ya ukamilifu. ‘Imekamilika’ ni ya asili katika Kiswahili na haiilazimishi maana ya kutimizwa kwa unabii.
theological_decisions:
- issue: Picha ya harusi na nafasi ya Yohana Mbatizaji
  choice: Kudumisha bwana-arusi, bibi-arusi, na rafiki wa bwana-arusi bila kumtambulisha bibi-arusi moja kwa moja
  alternative: Kufafanua bibi-arusi kuwa kanisa au watu wa Mungu, au kutafsiri rafiki kama cheo maalumu cha harusi
  rationale: Mstari wenyewe unatumia picha ya harusi lakini haumtambui bibi-arusi kwa jina. Tafsiri inaacha hitimisho hilo la kitheolojia kwa muktadha na ufafanuzi badala ya kulipachika katika matini.
- issue: Maana ya πεπλήρωται kuhusu furaha ya Yohana
  choice: imekamilika
  alternative: imetimizwa
  rationale: Maana zote mbili zinawezekana kileksika, lakini katika muktadha furaha kufikia ukamilifu ndiyo maana ya moja kwa moja zaidi; tanbihi huhifadhi uwezekano wa ‘imetimizwa.’
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Maneno ya kawaida ya harusi—“bibi-arusi” na “bwana-arusi”—yanadumisha sitiari, huku sentensi zikibaki wazi kwa msomaji wa kawaida. Alama zote za tanbihi zimewekwa mara moja katika sehemu husika za matini.
