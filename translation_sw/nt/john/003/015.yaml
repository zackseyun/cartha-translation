  yaml_path: translation/nt/john/003/015.yaml
  text: so that everyone who believes in him may have eternal life[a][b].
translation:
  language: sw
  text: ili kila anayemwamini awe na uzima wa milele.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “yeyote anayemwamini.”
    reason: lexical_alternative
  - marker: b
    text: Kigiriki hapa kinasema kihalisi “anayeamini katika yeye” (ἐν αὐτῷ), si “kuelekea ndani yake”; kwa Kiswahili cha kawaida maana hiyo imetafsiriwa “anayemwamini.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: ili
  rationale: Huanzisha kusudi au matokeo yanayohusiana na kauli iliyotangulia; “ili” ni ya kawaida na hudumisha nguvu ya kusudi.
- source_word: πᾶς ὁ πιστεύων
  choice: kila anayemwamini
  rationale: Kirai hiki chenye kivumishi-ushiriki kilichotumika kama nomino kina maana ya kijumla na jumuishi. “Kila anayemwamini” ni Kiswahili cha asili na huhifadhi wigo wa kila mtu bila kulazimisha hali endelevu.
- source_word: πιστεύων
  choice: anayemwamini
  rationale: Katika muktadha huu, πιστεύω yenye rejea ya mtu hutafsiriwa kwa kawaida kwa “kumwamini,” ikionyesha imani iliyoelekezwa kwake bila kuongeza ufafanuzi wa kiteolojia.
- source_word: ἐν αὐτῷ
  choice: anayemwamini
  rationale: Ingawa Kigiriki kina ἐν (“katika”), Kiswahili sanifu huonyesha imani kwa mtu kwa muundo wa “kumwamini.” Tafsiri ya neno kwa neno “anayeamini ndani yake” si ya kawaida na inaweza kupotosha; tanbihi huhifadhi taarifa ya umbo la Kigiriki.
- source_word: ἔχῃ
  choice: awe na
  rationale: Kiima-tegemezi baada ya ἵνα kinawakilishwa kwa kawaida na kiima-tegemezi cha Kiswahili “awe na,” ambacho hudumisha uhusiano wa kusudi bila kudokeza shaka isiyokusudiwa.
- source_word: ζωὴν αἰώνιον
  choice: uzima wa milele
  rationale: Hii ni tafsiri iliyozoeleka, wazi, na sahihi katika muktadha wa Yohana, ikibeba wazo la uzima usio na mwisho na ubora wa enzi ijayo.
theological_decisions:
- issue: Muundo wa imani katika ἐν αὐτῷ
  choice: anayemwamini
  alternative: anayeamini ndani yake
  rationale: Chanzo kina ἐν αὐτῷ, si εἰς αὐτόν; hata hivyo, Kiswahili hakiwezi kwa kawaida kudumisha tofauti hiyo ya kihusishi bila kuwa kigumu au kupotosha. Maandishi makuu yanatumia muundo wa kawaida wa Kiswahili, huku tanbihi ikieleza kwa uwazi umbo la Kigiriki.
- issue: Wigo wa πᾶς ὁ πιστεύων
  choice: kila anayemwamini
  alternative: yeyote anayemwamini
  rationale: Kirai ni cha kijumla na jumuishi. “Kila anayemwamini” huwasilisha wigo huo wazi na pia hudumisha nguvu ya πᾶς.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo ni mfupi na wa kawaida kwa usomaji wa Biblia; tanbihi ya pili inaeleza tofauti ya kihusishi bila kuingiza fundisho la dhehebu.
