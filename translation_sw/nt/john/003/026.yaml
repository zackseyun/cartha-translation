id: JHN.3.26
reference: John 3:26
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἦλθον πρὸς τὸν Ἰωάννην καὶ εἶπαν αὐτῷ· Ῥαββί, ὃς ἦν μετὰ σοῦ πέραν τοῦ Ἰορδάνου, ᾧ σὺ μεμαρτύρηκας, ἴδε οὗτος βαπτίζει καὶ πάντες ἔρχονται πρὸς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/026.yaml
  text: And they came to John and said to him[a], “Rabbi, the one who was with you beyond the Jordan, to whom you have borne witness—look, he is baptizing[b], and everyone is going to him.”
translation:
  language: sw
  text: Nao wakamjia Yohana na kumwambia, “Rabi, yule aliyekuwa pamoja nawe ng’ambo ya Yordani, ambaye ulimtolea ushahidi[a]—tazama, huyo anabatiza, na wote wanamwendea.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uliyeshuhudia juu yake.” Muundo wa Kigiriki unaweza kueleweka kuwa Yohana alimtolea mtu huyo ushahidi au alitoa ushahidi kumhusu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθον πρὸς τὸν Ἰωάννην
  choice: wakamjia Yohana
  rationale: Kitenzi ‘-jia’ kinaonyesha kwa njia ya asili kwamba walikwenda mahali alipokuwa Yohana, huku kiunganishi ‘waka-’ kikidumisha mfuatano wa simulizi.
- source_word: Ῥαββί
  choice: Rabi
  rationale: Unukuzi huu unaeleweka katika Kiswahili cha Biblia na unahifadhi mazingira ya Kiyahudi pamoja na cheo cha heshima.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: ng’ambo ya Yordani
  rationale: Huu ni usemi wa kawaida wa kijiografia unaohifadhi mtazamo wa maandishi bila kufafanua upande hususa.
- source_word: ᾧ σὺ μεμαρτύρηκας
  choice: ambaye ulimtolea ushahidi
  rationale: Hifadhi lugha muhimu ya ushahidi katika Injili ya Yohana na pia dative inayoweza kueleweka kuwa ushahidi ulitolewa kwake au kumhusu; tanbihi inaonyesha maana nyingine halali.
- source_word: ἴδε
  choice: tazama
  rationale: Ni mwito wa kawaida na wenye hadhi wa kuvuta fikira, bila kuwa wa kizamani kupita kiasi.
- source_word: οὗτος
  choice: huyo
  rationale: Kiwakilishi hiki cha kuonyesha kinadumisha msisitizo wenye kuelekeza wa οὗτος kuliko kutumia ‘yeye’ tu, na ni cha asili katika mazungumzo ya Kiswahili.
- source_word: βαπτίζει
  choice: anabatiza
  rationale: Wakati wa sasa unaonyesha tendo linaloendelea katika muktadha; Kiswahili hulieleza kwa kawaida kwa ‘anabatiza.’
- source_word: πάντες ἔρχονται πρὸς αὐτόν
  choice: wote wanamwendea
  rationale: ‘Wote’ inadumisha ujumlishaji wa balagha, na ‘wanamwendea’ inaonyesha mwendo kuelekea kwake kwa Kiswahili cha asili.
theological_decisions:
- issue: Lugha ya ushahidi katika Injili ya Yohana
  choice: ulimtolea ushahidi
  alternative: ulishuhudia juu yake
  rationale: ‘Kumtolea ushahidi’ inadumisha mzizi na dhana ya ushahidi iliyo muhimu katika Yohana, huku tanbihi ikihifadhi uwezekano kwamba ushahidi huo ulikuwa kumhusu.
- issue: Msisitizo wa οὗτος kwa Yesu
  choice: huyo
  alternative: yeye
  rationale: ‘Huyo’ huhifadhi nguvu ya kiwakilishi cha kuonyesha na hisia inayoweza kuwa katika malalamiko ya wasemaji bila kuongeza hukumu ya wazi kuhusu nia yao.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inadumisha sauti ya simulizi na msisitizo wa malalamiko bila kuwa ngumu au kuingiza ufafanuzi wa kimadhehebu.
