translation:
  language: sw
  text: Yeye lazima aongezeke[a], lakini mimi nipungue.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya karibu zaidi, “Yule lazima aongezeke, lakini mimi nipungue.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖνον
  choice: Yeye
  rationale: Kiwakilishi hiki cha kuonyesha kinamtaja Yesu katika muktadha. “Yeye” ni Kiswahili cha kawaida na fasaha; “yule” kingekuwa tafsiri ya karibu zaidi ya umbo la Kigiriki lakini hapa kingesikika chenye umbali au msisitizo usio wa lazima.
- source_word: δεῖ
  choice: lazima
  rationale: “Lazima” huhifadhi maana ya ulazima bila kufafanua kupita kiasi kama ni amri ya Mungu, mpango wa Mungu, au ulazima wa hali tu.
- source_word: αὐξάνειν
  choice: azidi kuwa mkuu
  rationale: Kauli hii inaonyesha kuendelea kuongezeka kwa ukuu, nafasi, au ushawishi wa Yesu katika muktadha. Inaepuka kuelekeza maana kwenye ukuaji wa mwili au ongezeko la idadi pekee.
- source_word: ἐμὲ
  choice: mimi
  rationale: Kiwakilishi cha nafsi kimetumiwa kama mtendaji wa tendo linalofuata, kwa Kiswahili cha kawaida na kwa kuhifadhi ulinganifu wenye msisitizo kati ya Yesu na Yohana.
- source_word: δὲ
  choice: lakini
  rationale: Neno hili linaonyesha utofauti kati ya kuongezeka kwa Yesu na kupungua kwa Yohana.
- source_word: ἐλαττοῦσθαι
  choice: nizidi kuwa mdogo
  rationale: Kauli hii huhifadhi wazo la kuendelea kupungua kwa nafasi au umaarufu wa Yohana na pia ulinganifu wa kimtindo na “azidi kuwa mkuu.”
theological_decisions:
- issue: Aina ya ulazima unaoonyeshwa na δεῖ
  choice: Kutumia “lazima” bila kueleza chanzo au namna ya ulazima huo.
  alternative: Kusema wazi kuwa hili ni agizo au kusudi lililoamuliwa na Mungu.
  rationale: Muktadha unaweza kuashiria mpangilio wa Mungu katika historia ya wokovu, lakini mstari wenyewe haufafanui namna ya ulazima huo. “Lazima” huhifadhi uzito wa kitheolojia pamoja na utata halisi wa maandishi.
- issue: Maana ya kuongezeka na kupungua
  choice: Kuonyesha kuongezeka na kupungua kwa ukuu au nafasi bila kuifunga maana kwenye idadi ya wafuasi pekee.
  alternative: Kutafsiri moja kwa moja kuwa Yesu atapata wafuasi wengi zaidi na Yohana wachache zaidi.
  rationale: Muktadha unahusisha huduma na wafuasi, lakini maneno ya Kigiriki yana maana pana zaidi. Tafsiri hii haiingizi ufafanuzi mwembamba usiotajwa wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Muundo mfupi na wenye ulinganifu umehifadhiwa ili kudumisha nguvu ya usemi wa Kigiriki.
