  text: Ὁ ἄνωθεν ἐρχόμενος ἐπάνω πάντων ἐστίν. ὁ ὢν ἐκ τῆς γῆς ἐκ τῆς γῆς ἐστιν καὶ ἐκ τῆς γῆς λαλεῖ· ὁ ἐκ τοῦ οὐρανοῦ ἐρχόμενος ἐπάνω πάντων ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/john/003/031.yaml
  text: The one who comes from above is above all[a]. The one who is from the earth is from the earth and speaks from the earth[b]. The one who comes from heaven is above all.
translation:
  language: sw
  text: Yule anayekuja kutoka juu yuko juu ya wote.[a] Yule aliye wa dunia ni wa dunia, naye hunena kutoka duniani.[b] Yule anayekuja kutoka mbinguni yuko juu ya wote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kutoka mbinguni” badala ya “kutoka juu” katika kishazi cha kwanza. Neno la Kigiriki ἄνωθεν linaonyesha asili ya kutoka juu, na maana hiyo inafafanuliwa baadaye kwa maneno “kutoka mbinguni.”
    reason: lexical_alternative
  - marker: b
    text: Au, “hunena kuhusu dunia.” Kigiriki kinarudia usemi unaohusu dunia, jambo linaloweza kuonyesha chanzo, mazingira, au mada ya maneno yake.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνωθεν
  choice: kutoka juu
  rationale: Katika muktadha huu neno linaonyesha asili au mahali anapotoka, si kurudiwa kwa tendo. “Kutoka juu” huhifadhi tofauti ya kimakusudi na “duniani” na baadaye hufafanuliwa na “kutoka mbinguni.”
- source_word: ἐρχόμενος
  choice: anayekuja
  rationale: Huwasilisha kishirikishi cha wakati wa sasa kilichotumiwa kama nomino kwa Kiswahili cha kawaida na cha sasa.
- source_word: ἐπάνω πάντων
  choice: yuko juu ya wote
  rationale: Huhifadhi picha ya kuwa juu pamoja na maana ya ukuu au mamlaka, bila kuibadili moja kwa moja kuwa ufafanuzi kama “ni mkuu kuliko wote.”
- source_word: ὁ ὢν ἐκ τῆς γῆς
  choice: yule anayetoka duniani
  rationale: Huweka mkazo juu ya asili ya mtu huyo na kuendeleza tofauti kati ya dunia na mbingu.
- source_word: γῆ
  choice: dunia
  rationale: Hapa neno linatofautishwa na mbingu, kwa hiyo “dunia” linafaa kuliko “nchi” au “ardhi.”
- source_word: ἐκ τῆς γῆς ἐστιν
  choice: ni wa dunia
  rationale: Huhifadhi kurudiwa kwa wazo la asili ya kidunia kwa lugha inayoeleweka, ingawa muundo wa Kigiriki unarudia kihalisi “kutoka duniani.”
- source_word: ἐκ τῆς γῆς λαλεῖ
  choice: hunena kutokana na dunia
  rationale: “Kutokana na” huacha wazi kama dunia ni chanzo, mazingira, au upeo wa maneno yake; tanbihi inataja uwezekano wa kuelewa dunia kuwa mada.
- source_word: οὐρανός
  choice: mbingu
  rationale: Katika muktadha huu neno linaonyesha ulimwengu wa mbinguni, si anga la kawaida.
theological_decisions:
- issue: Uhusiano kati ya “kutoka juu” na “kutoka mbinguni”
  choice: Kutofautisha maneno hayo mawili kama yalivyo katika Kigiriki
  alternative: Kutafsiri yote mawili “kutoka mbinguni”
  rationale: Kigiriki kinatumia misemo miwili inayohusiana lakini isiyofanana. Tofauti hiyo huhifadhi mtindo wa Yohana, huku msemo wa pili ukifafanua wa kwanza.
- issue: Nguvu ya kurudiwa kwa lugha kuhusu dunia
  choice: Kuhifadhi marejeo matatu ya dunia katika sentensi ya kati
  alternative: Kuyafupisha kuwa “mtu wa kidunia hunena kwa namna ya kidunia”
  rationale: Kurudiwa huko kunasisitiza tofauti kati ya asili ya kidunia na asili ya mbinguni. Kulihifadhi huepuka kuweka tafsiri finyu juu ya maana ya maneno yake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Hunena” limetumiwa kwa sauti ya kifasihi iliyoeleweka na ili kuepuka uzito wa kurudia “huzungumza”; muundo wa aya umehifadhi ulinganifu na marudio ya chanzo cha juu, dunia, na mbingu.
