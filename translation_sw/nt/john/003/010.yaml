base_translation:
  language: en
  yaml_path: translation/nt/john/003/010.yaml
  text: Jesus answered and said to him[a], “You are the teacher of Israel, and you do not know these things?”
translation:
  language: sw
  text: Yesu akajibu, akamwambia, “Wewe ndiye mwalimu wa Israeli[a], nawe huyajui mambo haya?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mwalimu mmoja wa Israeli.” Kigiriki kina “mwalimu” yenye artikeli bayana; huenda matumizi hayo yanaipa kauli hii nguvu ya kusisitiza na ya kirhetorika.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη ... καὶ εἶπεν αὐτῷ
  choice: akamjibu, akamwambia
  rationale: Muundo huu unahifadhi vitenzi viwili vya simulizi, ‘alijibu’ na ‘akamwambia,’ huku ukisomeka kwa kawaida katika Kiswahili.
- source_word: Σὺ
  choice: Wewe ndiye
  rationale: Kiwakilishi kilichotajwa wazi katika Kigiriki kina mkazo. ‘Wewe ndiye’ huhifadhi mkazo huo na pia kusaidia kuonyesha nguvu ya usemi unaofuata.
- source_word: ὁ διδάσκαλος
  choice: mwalimu
  rationale: ‘Mwalimu’ ni neno la kawaida na lenye heshima kwa διδάσκαλος. Muundo ‘ndiye mwalimu’ unaonyesha nguvu ya kibainishi cha Kigiriki kwa njia ya asili katika Kiswahili.
- source_word: τοῦ Ἰσραὴλ
  choice: wa Israeli
  rationale: Huhifadhi uhusiano wa hali ya umilikaji katika Kigiriki na kuonyesha nafasi ya Nikodemo miongoni mwa watu wa Israeli, si eneo la kijiografia tu.
- source_word: ταῦτα
  choice: mambo haya
  rationale: Ni tafsiri ya kawaida na pana inayorejelea mafundisho ya Yesu katika muktadha wa karibu.
- source_word: οὐ γινώσκεις
  choice: huyajui
  rationale: Huhifadhi maana ya msingi ya γινώσκω, ‘kujua,’ ingawa katika muktadha pia inadokeza kutofahamu.
theological_decisions:
- issue: Nguvu ya kauli ὁ διδάσκαλος τοῦ Ἰσραήλ kwa Nikodemo
  choice: Wewe ndiye mwalimu wa Israeli
  alternative: Wewe ni mwalimu mmoja wa Israeli
  rationale: Kibainishi cha Kigiriki kinaipa kauli nguvu maalumu na ya kusisitiza. ‘Ndiye mwalimu’ huhifadhi ukali wa swali la Yesu bila kudai zaidi ya maandishi kwamba Nikodemo alikuwa mwalimu pekee nchini Israeli.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo wa swali unahifadhi ukali wa kirhetorika wa maneno ya Yesu.
