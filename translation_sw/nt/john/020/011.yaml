  yaml_path: translation/nt/john/020/011.yaml
  text: But Mary was standing outside the tomb, weeping. So, as she was weeping, she bent over to look into the tomb,
translation:
  language: sw
  text: Lakini Maria alikuwa amesimama nje ya kaburi, akilia. Basi, alipokuwa akilia, aliinama[a] kutazama ndani ya kaburi,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliinama na kutazama ndani ya kaburi.” Kitenzi cha Kigiriki kina wazo la kuinama ili kutazama ndani.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Lakini
  rationale: Inaonyesha tofauti ndogo na mabadiliko ya simulizi kutoka kwa wanafunzi waliotangulia kuondoka hadi kwa Maria aliyebaki kaburini.
- source_word: εἱστήκει
  choice: alikuwa amesimama
  rationale: Huonyesha hali ya kusimama iliyokuwa ikiendelea wakati huo, badala ya tendo la muda mfupi tu.
- source_word: πρὸς τῷ μνημείῳ ἔξω
  choice: nje ya kaburi
  rationale: Ni usemi wa kawaida wa Kiswahili unaoweka wazi kuwa Maria alikuwa upande wa nje wa kaburi.
- source_word: μνημεῖον
  choice: kaburi
  rationale: Katika muktadha huu neno hilo linamaanisha mahali palipotayarishwa kwa maziko; ‘kaburi’ ni neno la kawaida na sahihi katika Kiswahili.
- source_word: κλαίουσα / ἔκλαιεν
  choice: akilia / alipokuwa akilia
  rationale: Miundo hii inaonyesha kilio cha Maria kilichokuwa kikiendelea; urudiaji huo pia unahifadhi mtiririko wa maandishi ya Kigiriki.
- source_word: ὡς οὖν
  choice: Basi, alipokuwa
  rationale: ‘Basi’ linaendeleza simulizi bila kudai uhusiano mkali wa kisababishi, na ‘alipokuwa’ linaonyesha kuwa tendo lililofuata lilitokea huku kilio kikiendelea.
- source_word: παρέκυψεν
  choice: aliinama ili aangalie
  rationale: Kitenzi kinajumuisha kuinama au kujipinda kwa kusudi la kuangalia ndani; tafsiri hii inaeleza mwendo na kusudi lake kwa Kiswahili cha kawaida.
- source_word: εἰς τὸ μνημεῖον
  choice: ndani ya kaburi
  rationale: Inaonyesha mwelekeo wa macho kuelekea sehemu ya ndani ya kaburi.
