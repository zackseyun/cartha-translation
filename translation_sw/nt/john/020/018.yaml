  text: ἔρχεται ⸀Μαριὰμ ἡ Μαγδαληνὴ ⸀ἀγγέλλουσα τοῖς μαθηταῖς ὅτι ⸀Ἑώρακα τὸν κύριον καὶ ταῦτα εἶπεν αὐτῇ.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/018.yaml
  text: Mary Magdalene came announcing to the disciples[a], “I have seen the Lord,” and that he had said these things to her.
translation:
  language: sw
  text: Maria Magdalene akaja, akawajulisha wanafunzi[a] kwamba amemwona Bwana na kwamba Bwana alikuwa amemwambia mambo hayo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Maria Magdalene akaja kwa wanafunzi, akasema, ‘Nimemwona Bwana,’ na Bwana alimwambia mambo hayo.” Kishazi cha mwisho kinaweza kueleweka ama kuwa sehemu ya taarifa ya Maria au kuwa maelezo ya msimulizi.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔρχεται
  choice: akaja
  rationale: Wakati wa sasa wa Kigiriki umetumiwa kihistoria; wakati uliopita wa Kiswahili unasimulia tukio hilo kwa kawaida. ‘Akaja’ pia hudokeza mwendo kuelekea mahali walipokuwa wanafunzi.
- source_word: Μαριὰμ ἡ Μαγδαληνὴ
  choice: Maria Magdalene
  rationale: Jina na lakabu zimetolewa kwa namna iliyozoeleka katika Kiswahili cha Biblia.
- source_word: ἀγγέλλουσα
  choice: akiwaambia
  rationale: Huhifadhi tendo la kutoa taarifa lililokuwa likifanyika sambamba na kuja kwake, kwa Kiswahili cha kawaida na kinachoeleweka.
- source_word: τοῖς μαθηταῖς
  choice: wanafunzi
  rationale: ‘Wanafunzi’ ni tafsiri ya kawaida na sahihi ya μαθηταῖς; hakuna kiwakilishi cha ‘wake’ katika Kigiriki.
- source_word: ὅτι
  choice: alama za usemi wa moja kwa moja
  rationale: Hapa ὅτι hutambulisha maudhui ya taarifa; alama za kunukuu huwasilisha kwa kawaida maneno ya moja kwa moja katika Kiswahili.
- source_word: Ἑώρακα
  choice: Nimemwona
  rationale: Kauli ya timilifu huonyesha tendo lililokamilika lenye umuhimu wa sasa; ‘nimemwona’ huhifadhi maana hiyo vizuri.
- source_word: τὸν κύριον
  choice: Bwana
  rationale: ‘Bwana’ huhifadhi uzito wa cheo κύριος katika muktadha wa kufufuka kwa Yesu.
- source_word: καὶ ταῦτα εἶπεν αὐτῇ
  choice: na kwamba alikuwa amemwambia mambo hayo
  rationale: Kauli hii imechukuliwa kuwa mwendelezo wa taarifa ya Maria. ‘Alikuwa amemwambia’ huonyesha kwamba maneno ya Bwana yalitangulia taarifa ya Maria, huku ‘mambo hayo’ ikihifadhi ταῦτα.
theological_decisions:
- issue: Tafsiri ya κύριος katika muktadha wa ufufuo
  choice: Bwana
  alternative: mkuu
  rationale: ‘Bwana’ ni cheo kinachotambulika kwa Yesu na huhifadhi uzito wake wa kikristo bila kuupunguza.
- issue: Uhusiano wa καὶ ταῦτα εἶπεν αὐτῇ na taarifa ya Maria
  choice: 'Imejumuishwa katika yale Maria aliyowaambia wanafunzi: ‘na kwamba alikuwa amemwambia mambo hayo’'
  alternative: 'Kauli tofauti ya msimulizi: ‘naye alikuwa amemwambia mambo hayo’'
  rationale: Ingawa hakuna ὅτι ya pili, kisarufi kauli hiyo inaweza kuendeleza maudhui ya ἀγγέλλουσα. Tanbihi huhifadhi uwezekano mwingine wa kuichukua kuwa maelezo ya msimulizi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo ‘akiwaambia’ huhifadhi uhusiano wa kishiriki bila kuwa mgumu, na tanbihi huhifadhi utata halisi wa kauli ya mwisho.
