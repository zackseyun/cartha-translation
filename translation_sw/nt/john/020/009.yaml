  text: For they did not yet understand the Scripture[a], that he had to rise from the dead.
translation:
  language: sw
  text: Kwa maana, hawakuwa bado wameelewa Andiko, kwamba ilimpasa kufufuka[a] kutoka kwa wafu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kufufuliwa kutoka kwa wafu.” Kigiriki hapa kinatumia kitenzi cha kutenda, “kufufuka.”
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδέπω
  choice: bado hawakuwa
  rationale: Muundo huu unaonyesha kwamba kufikia wakati huo walikuwa bado hawajafikia ufahamu huo.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Inaendeleza uhusiano wa maelezo na kauli iliyotangulia kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: ᾔδεισαν
  choice: hawakuwa wamelielewa
  rationale: Ingawa kitenzi cha Kigiriki kimsingi huhusu kujua, hapa kinahusu kuelewa maana ya Andiko.
- source_word: τὴν γραφὴν
  choice: Andiko
  rationale: Umoja wa Kigiriki umehifadhiwa bila kuamua kimyakimya kama ni kifungu fulani maalumu au ushuhuda wa Maandiko kwa ujumla.
- source_word: ὅτι
  choice: kwamba
  rationale: Inatanguliza yaliyomo katika Andiko ambayo hawakuwa wameyaelewa.
- source_word: δεῖ
  choice: ilimpasa
  rationale: Inaonyesha ulazima, hasa ulazima ulio katika kusudi la Mungu, bila kuufanya kuwa shinikizo la nje.
- source_word: αὐτὸν
  choice: -m- katika “ilimpasa”
  rationale: Kiambishi cha yambwa kinamtaja Yesu kwa njia ya kawaida katika muundo wa Kiswahili.
- source_word: ἐκ νεκρῶν
  choice: kutoka kwa wafu
  rationale: Ni usemi wa kawaida na sahihi wa ufufuo; unahifadhi maana ya kutoka miongoni mwa waliokufa.
- source_word: ἀναστῆναι
  choice: kufufuka
  rationale: Kitenzi cha Kigiriki ni cha kutenda, hivyo “kufufuka” kinahifadhi umbo hilo badala ya kuligeuza kuwa “kufufuliwa.”
theological_decisions:
- issue: Usemi wa ufufuo na mtendaji wake
  choice: ilimpasa kufufuka kutoka kwa wafu
  alternative: ilimpasa kufufuliwa kutoka kwa wafu
  rationale: Kigiriki kinatumia kitenzi cha kutenda, kwa hiyo matini kuu inadumisha “kufufuka.” Tafsiri ya kutendwa inawezekana kitheolojia na hutokea kwingineko, lakini haipaswi kuingizwa hapa kwa kufuta namna ya usemi wa aya hii.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Andiko” limeandikwa kwa herufi kubwa ili kuonyesha Maandiko Matakatifu, huku umoja wa Kigiriki ukihifadhiwa. Muundo “ilimpasa kufufuka” ni rasmi lakini unaeleweka na huhifadhi wazo la ulazima.
