  text: ἔτρεχον δὲ οἱ δύο ὁμοῦ· καὶ ὁ ἄλλος μαθητὴς προέδραμεν τάχιον τοῦ Πέτρου καὶ ἦλθεν πρῶτος εἰς τὸ μνημεῖον,
base_translation:
  language: en
  yaml_path: translation/nt/john/020/004.yaml
  text: The two were running together[a], and the other disciple ran ahead faster than Peter and came first to the tomb.
translation:
  language: sw
  text: Wote wawili walikuwa wakikimbia pamoja, na yule mwanafunzi mwingine akakimbia mbele kwa kasi kuliko Petro, akafika kaburini kwanza.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akamshinda Petro mbio.” Kitenzi cha Kigiriki kina maana halisi ya “kukimbia mbele,” huku ulinganisho ukielezwa kwa maneno “kwa kasi kuliko Petro.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτρεχον
  choice: walikuwa wakikimbia
  rationale: Kauli ya wakati usiotimilika inaonyesha tendo lililokuwa likiendelea wakati uliopita; muundo huu wa Kiswahili unadumisha hali hiyo.
- source_word: δὲ
  choice: na
  rationale: Hapa δέ ni kiunganishi hafifu kinachoendeleza simulizi; “na” huepuka kuingiza utofautishaji mkali usiolazimishwa na muktadha.
- source_word: οἱ δύο ὁμοῦ
  choice: wote wawili ... pamoja
  rationale: Huwasilisha wazi kwamba wale wawili walikuwa wakifanya tendo hilo kwa pamoja, kwa Kiswahili cha kawaida.
- source_word: ὁ ἄλλος μαθητής
  choice: yule mwanafunzi mwingine
  rationale: “Mwanafunzi” ni tafsiri ya kawaida ya μαθητής katika simulizi za Injili, na “mwingine” humtofautisha na Petro.
- source_word: προέδραμεν
  choice: akakimbia mbele
  rationale: Huhifadhi picha halisi ya kitenzi ambatani chenye maana ya kukimbia mbele, badala ya kuifupisha kuwa kumshinda mbio.
- source_word: τάχιον τοῦ Πέτρου
  choice: kwa kasi kuliko Petro
  rationale: Huhifadhi ulinganisho ulio wazi katika Kigiriki na kusomeka kwa kawaida katika Kiswahili.
- source_word: ἦλθεν πρῶτος
  choice: akafika ... kwanza
  rationale: Katika muktadha wa mbio kuelekea mahali fulani, “akafika kwanza” huwasilisha kwa kawaida kwamba ndiye aliyewasili wa kwanza.
- source_word: εἰς τὸ μνημεῖον
  choice: kaburini
  rationale: μνημεῖον ni mahali pa kuzikia; “kaburini” hapa huonyesha kufika kwenye kaburi bila kudai kuwa aliingia ndani, jambo linalolingana na mstari unaofuata.
