reference: John 20:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Τῇ δὲ μιᾷ τῶν σαββάτων Μαρία ἡ Μαγδαληνὴ ἔρχεται πρωῒ σκοτίας ἔτι οὔσης εἰς τὸ μνημεῖον, καὶ βλέπει τὸν λίθον ἠρμένον ἐκ τοῦ μνημείου.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/001.yaml
  text: On the first day of the week[a], Mary Magdalene comes to the tomb early, while it was still dark, and sees the stone having been taken away from the tomb.
translation:
  language: sw
  text: Siku ya kwanza ya juma[a], Maria Magdalene anakuja kaburini asubuhi na mapema, kungali giza, na anaona jiwe limeondolewa kutoka kaburini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kihalisi, “siku moja ya Sabato”; hii ni nahau inayomaanisha “siku ya kwanza ya juma.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῇ δὲ μιᾷ τῶν σαββάτων
  choice: Siku ya kwanza ya juma
  rationale: Hii ni nahau ya Kiyunani inayomaanisha siku ya kwanza ya juma. Kiunganishi δέ hakihitaji neno tofauti hapa, kwa kuwa mwanzo wa sentensi unaendeleza simulizi kwa kawaida katika Kiswahili.
- source_word: Μαρία ἡ Μαγδαληνὴ
  choice: Maria Magdalene
  rationale: Hili ndilo umbo la kawaida la jina na lakabu hiyo katika Kiswahili cha Biblia.
- source_word: ἔρχεται
  choice: anakuja
  rationale: Wakati uliopo wa kihistoria umehifadhiwa ili kudumisha uhai na ukaribu wa simulizi la Kiyunani.
- source_word: πρωῒ
  choice: asubuhi na mapema
  rationale: Hueleza wakati wa mapema bila kudai kwamba tayari kulikuwa kumepambazuka; kishazi kinachofuata kinasema bado kulikuwa na giza.
- source_word: σκοτίας ἔτι οὔσης
  choice: kungali giza
  rationale: Ni kishazi cha wakati kinachoeleza hali iliyokuwa ikiendelea; usemi huu ni mfupi, wa asili, na wenye hadhi katika Kiswahili.
- source_word: εἰς τὸ μνημεῖον
  choice: kaburini
  rationale: Katika muktadha huu μνημεῖον ni kaburi alimozikwa Yesu; kiambishi -ni kinaonyesha mwendo kuelekea huko kwa kawaida.
- source_word: βλέπει
  choice: anaona
  rationale: Wakati uliopo wa kihistoria umehifadhiwa sambamba na ἔρχεται.
- source_word: τὸν λίθον ἠρμένον
  choice: kwamba jiwe limeondolewa
  rationale: 'Kauli timilifu tendwa inaonyesha tendo lililokamilika na hali yake inayoendelea: Maria analiona jiwe likiwa tayari limeondolewa.'
- source_word: ἐκ τοῦ μνημείου
  choice: kaburini
  rationale: Katika muundo wa Kiswahili, ‘limeondolewa kaburini’ huonyesha wazi kuondolewa kutoka mahali hapo bila kuongeza neno ‘mlango,’ ambalo halipo wazi katika chanzo.
theological_decisions:
- issue: Wakati wa vitenzi katika simulizi la ufufuo
  choice: 'Kuhifadhi wakati uliopo wa kihistoria: ‘anakuja’ na ‘anaona’'
  alternative: 'Kutumia wakati uliopita: ‘alikuja’ na ‘akaona’'
  rationale: Wakati uliopo wa Kiyunani huleta uhai wa kisimulizi. Kiswahili kinaweza kuuhifadhi kwa kueleweka bila kuongeza ufafanuzi wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Kungali giza’ ni usemi unaoeleweka na unaofaa kwa simulizi rasmi; wakati uliopo wa kihistoria umehifadhiwa kwa makusudi.
