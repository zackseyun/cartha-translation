  text: Baada ya kusema hayo, akawavuvia, akawaambia, “Pokeeni Roho Mtakatifu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτο εἰπὼν
  choice: Baada ya kusema hayo
  rationale: Kirai kishirikishi cha wakati uliopita kinaonyesha kitendo kilichotangulia kitendo kikuu. Tafsiri hii ni ya kawaida katika Kiswahili na inadumisha mfuatano huo.
- source_word: ἐνεφύσησεν
  choice: akawapulizia pumzi
  rationale: Kitenzi hiki humaanisha kupulizia au kupulizia pumzi. Kauli hii ni ya asili katika Kiswahili, inaonyesha kuwa tendo lilielekezwa kwa wanafunzi, na hailazimishi maana ya ‘ndani yao’ katika matini kuu.
- source_word: λέγει αὐτοῖς
  choice: na kuwaambia
  rationale: Ingawa λέγει ni wakati uliopo wa kihistoria, Kiswahili cha masimulizi hutumia kwa kawaida wakati uliopita au muundo wa mfululizo wa matendo. ‘Kuwaambia’ huunganisha matendo kwa ufasaha bila kubadili maana.
- source_word: Λάβετε
  choice: Pokeeni
  rationale: Amri ya wingi ‘Pokeeni’ inafaa kwa kupokea zawadi inayotolewa; ‘Chukueni’ ingeweza kudokeza kujitwalia kwa nguvu zaidi kuliko muktadha unavyotaka.
- source_word: πνεῦμα ἅγιον
  choice: Roho Mtakatifu
  rationale: Katika muktadha wa Injili ya Yohana, kirai hiki kinamtaja Roho wa Mungu. Kiswahili hakihitaji kibainishi kinacholingana na ‘the,’ na herufi kubwa zinaonyesha rejeo hilo la kimungu.
theological_decisions:
- issue: Ikiwa πνεῦμα ἅγιον itafsiriwe kama roho isiyo bayana au kama Roho wa Mungu
  choice: Roho Mtakatifu
  alternative: roho takatifu
  rationale: Muktadha wa Yohana unaelekeza kwa Roho wa Mungu, si roho yoyote yenye sifa ya utakatifu. Tafsiri hii inadumisha rejeo hilo bila kuongeza maelezo yasiyomo katika matini.
- issue: Ikiwa ἐνεφύσησεν inamaanisha kuwapulizia au kupulizia pumzi ndani yao
  choice: akawapulizia pumzi
  alternative: akawapulizia pumzi ndani yao
  rationale: Kitenzi kinaweza kuamsha taswira ya pumzi inayoingia ndani, lakini matini haielezi wazi mahali au mwelekeo. Matini kuu inadumisha kutobainika huko, huku tanbihi ikitaja uwezekano mwingine na mwangwi wa uumbaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo wa masimulizi ni wa kawaida, na ‘Pokeeni’ inadumisha wingi wa amri ya Kigiriki.
