base_translation:
  language: en
  yaml_path: translation/nt/john/020/016.yaml
  text: Jesus says to her[a], “Mary.” Turning, she says to him in Hebrew, “Rabboni!” (which means, “Teacher”).
translation:
  language: sw
  text: Yesu akamwambia, “Mariamu.” Naye akageuka, akamwambia kwa Kiebrania[a], “Rabuni!” (maana yake, “Mwalimu”).
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa Kiaramu.” Neno la Yohana “kwa Kiebrania” linaweza kurejelea kwa upana zaidi lugha ya Kisemiti iliyozungumzwa katika Yudea.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει
  choice: akamwambia
  rationale: Kiswahili cha masimulizi kwa kawaida hutumia wakati uliopita wa mfululizo; hapa ‘akamwambia’ huendeleza simulizi kwa uhai bila kuiga wakati wa sasa wa kihistoria kwa namna isiyo ya kawaida.
- source_word: αὐτῇ
  choice: akamwambia
  rationale: Kiambishi cha yambwa -mw- ndani ya kitenzi huwasilisha kwa kawaida maana ya ‘alimwambia yeye.’
- source_word: Μαριάμ
  choice: Mariamu
  rationale: Hili ni umbo la kawaida la jina hili katika Kiswahili cha Biblia, na linakaribia Μαριάμ kuliko ‘Maria.’
- source_word: στραφεῖσα ἐκείνη
  choice: Yule mwanamke akageuka
  rationale: Kiwakilishi cha kuonyesha ἐκείνη kimewakilishwa wazi kwa ‘yule mwanamke,’ na tendo tangulizi la participio limetolewa kwa mfuatano wa asili wa Kiswahili.
- source_word: Ἑβραϊστί
  choice: kwa Kiebrania
  rationale: Hufuata moja kwa moja usemi wa Kigiriki, huku uwezekano wa kwamba neno hilo linarejelea Kiaramu ukihifadhiwa katika tanbihi.
- source_word: Ραββουνι
  choice: Rabuni
  rationale: Neno limeendelezwa kwa unukuzi kwa sababu mwandishi mwenyewe analifafanua mara moja; umbo ‘Rabuni’ husomeka kwa kawaida katika tahajia ya Kiswahili.
- source_word: ὃ λέγεται Διδάσκαλε
  choice: maana yake, “Mwalimu”
  rationale: Hii ni tafsiri ya asili ya maelezo ya mwandishi; ‘Mwalimu’ huhifadhi maana ya kawaida ya Διδάσκαλε bila kuongeza wazo la mamlaka lililo katika ‘Bwana’ au ‘Mtawala.’
theological_decisions:
- issue: Maana ya Ἑβραϊστί katika simulizi la Yohana
  choice: kwa Kiebrania
  alternative: kwa Kiaramu
  rationale: Matini kuu hufuata neno la Kigiriki ‘kwa Kiebrania.’ Kwa kuwa katika matumizi ya Yohana linaweza kumaanisha kwa upana lugha ya Kisemiti iliyozungumzwa Uyahudi, uwezekano wa Kiaramu umetajwa katika tanbihi badala ya kuamuliwa kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mtindo wa simulizi umetumia viambishi vya mfululizo -ka- kwa ufasaha wa kawaida, huku jina la Kisemiti na ufafanuzi wake vikihifadhiwa.
