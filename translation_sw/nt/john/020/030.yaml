  text: Πολλὰ μὲν οὖν καὶ ἄλλα σημεῖα ἐποίησεν ὁ Ἰησοῦς ἐνώπιον τῶν ⸀μαθητῶν, ἃ οὐκ ἔστιν γεγραμμένα ἐν τῷ βιβλίῳ τούτῳ·
base_translation:
  language: en
  yaml_path: translation/nt/john/020/030.yaml
  text: Jesus did many other signs in the presence of the disciples[a], which are not written in this book.
translation:
  language: sw
  text: Yesu alifanya ishara nyingine nyingi[a] mbele ya wanafunzi, ambazo hazijaandikwa katika kitabu hiki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “miujiza.” Neno la Kigiriki ni “ishara,” likisisitiza matendo yanayoashiria jambo lililo zaidi ya matendo hayo yenyewe na kuonyesha Yesu ni nani.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πολλὰ μὲν οὖν καὶ ἄλλα
  choice: nyingine nyingi
  rationale: Muundo huu unaendeleza na kujumlisha simulizi huku μέν ikitazamia utofautishaji wa mstari wa 31. Kiswahili cha kawaida hakihitaji kila chembe itafsiriwe kivyake; “nyingine nyingi” huwasilisha wingi na nyongeza bila uzito usio wa lazima.
- source_word: σημεῖα
  choice: ishara
  rationale: Katika Injili ya Yohana neno hili humaanisha matendo ya ajabu yanayoelekeza zaidi ya tendo lenyewe na kufunua Yesu ni nani. “Ishara” huhifadhi maana hiyo kuliko “miujiza” peke yake.
- source_word: ἐποίησεν
  choice: alifanya
  rationale: Kitenzi hiki katika muktadha huu kinaelezwa kwa kawaida na kwa usahihi kuwa “alifanya”; hakihitaji neno rasmi zaidi kama “alitekeleza.”
- source_word: ἐνώπιον
  choice: mbele ya
  rationale: Hueleza kwamba ishara zilifanyika wanafunzi wakiwa mashahidi. “Mbele ya” ni Kiswahili cha kawaida na chenye maana hiyo.
- source_word: τῶν μαθητῶν
  choice: wanafunzi
  rationale: Kigiriki kina kibainishi lakini hakina kiwakilishi cha umilikaji. Kiswahili hakihitaji kibainishi hicho hapa, na muktadha unaonyesha kuwa ni wanafunzi wa Yesu.
- source_word: ἃ οὐκ ἔστιν γεγραμμένα
  choice: ambazo hazijaandikwa
  rationale: Muundo wa timilifu tendwa unasisitiza hali ya mambo hayo kutokuwamo katika maandishi. “Hazijaandikwa” huhifadhi kauli tendwa na athari inayoendelea.
- source_word: ἐν τῷ βιβλίῳ τούτῳ
  choice: katika kitabu hiki
  rationale: “Kitabu” ni neno la kawaida na linaloeleweka kwa kazi hii iliyoandikwa; “hati-kunjo” lingeongeza umahususi wa kihistoria usio lazima.
theological_decisions:
- issue: Matumizi ya σημεῖα katika Yohana
  choice: ishara
  alternative: miujiza
  rationale: “Ishara” huhifadhi msisitizo wa Yohana kwamba matendo haya yanafunua utambulisho na kazi ya Yesu, bila kuyapunguza kuwa maonyesho ya nguvu tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Mpangilio “ishara nyingine nyingi” ni wa asili katika Kiswahili. Alama ya tanbihi imewekwa baada ya “wanafunzi” kwa kufuata data iliyotolewa, ingawa maelezo yake yanahusu neno “ishara.”
