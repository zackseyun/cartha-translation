  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Καὶ μεθ’ ἡμέρας ὀκτὼ πάλιν ἦσαν ἔσω οἱ μαθηταὶ αὐτοῦ καὶ Θωμᾶς μετ’ αὐτῶν. ἔρχεται ὁ Ἰησοῦς τῶν θυρῶν κεκλεισμένων, καὶ ἔστη εἰς τὸ μέσον καὶ εἶπεν· Εἰρήνη ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/026.yaml
  text: And after eight days, his disciples were inside again, and Thomas was with them. Jesus comes, though the doors had been shut, and stood in the midst and said, “Peace to you.”
translation:
  language: sw
  text: Baada ya siku nane, wanafunzi wake walikuwa tena ndani, na Tomaso alikuwa pamoja nao. Milango ikiwa imefungwa, Yesu akaja, akasimama katikati yao, akasema, “Amani iwe nanyi.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μεθ’ ἡμέρας ὀκτώ
  choice: Baada ya siku nane
  rationale: Huhifadhi namna ya kuhesabu wakati iliyo katika Kigiriki bila kuibadili kuwa usemi wa ufafanuzi kama ‘juma moja baadaye.’
- source_word: ἔσω
  choice: ndani
  rationale: Tafsiri ya kawaida na ya moja kwa moja; mahali mahsusi panaeleweka kutokana na muktadha.
- source_word: τῶν θυρῶν κεκλεισμένων
  choice: Milango ikiwa imefungwa
  rationale: Huwakilisha hali timilifu ya milango bila kuongeza kwamba ilikuwa imefungwa kwa kufuli, jambo ambalo halijasemwa wazi.
- source_word: ἔρχεται
  choice: akaja
  rationale: Ingawa chanzo kinatumia wakati wa sasa wa kisimulizi, Kiswahili cha kawaida hutumia mfululizo wa ‘ka-’ katika simulizi la wakati uliopita.
- source_word: εἰς τὸ μέσον
  choice: katikati yao
  rationale: Hutoa kwa Kiswahili maana ya Yesu kusimama miongoni mwa wanafunzi; ‘yao’ inarejelea kundi lililotajwa.
- source_word: Εἰρήνη ὑμῖν
  choice: Amani iwe nanyi
  rationale: Salamu ya kawaida, yenye heshima, inayohifadhi maana ya amani kuelekezwa kwa kundi.
theological_decisions:
- issue: Uhusiano kati ya kuja kwa Yesu na milango iliyofungwa
  choice: Milango ikiwa imefungwa, Yesu akaja
  alternative: Ingawa milango ilikuwa imefungwa, Yesu akaja
  rationale: Kirai cha Kigiriki kinaeleza hali ya milango lakini hakitumii kiunganishi wazi cha upinzani. Tafsiri hii haiamui wala kueleza namna Yesu alivyoingia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mfuatano wa vitenzi vya ‘ka-’ unafanya simulizi lisomeke kwa kawaida, huku ‘Amani iwe nanyi’ ikihifadhi salamu ya kundi.
