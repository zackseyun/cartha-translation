  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἔλεγον οὖν αὐτῷ οἱ ἄλλοι μαθηταί· Ἑωράκαμεν τὸν κύριον. ὁ δὲ εἶπεν αὐτοῖς· Ἐὰν μὴ ἴδω ἐν ταῖς χερσὶν αὐτοῦ τὸν τύπον τῶν ἥλων καὶ βάλω τὸν δάκτυλόν μου εἰς τὸν τύπον τῶν ἥλων καὶ βάλω ⸂μου τὴν χεῖρα⸃ εἰς τὴν πλευρὰν αὐτοῦ, οὐ μὴ πιστεύσω.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/025.yaml
  text: So the other disciples were telling him[a], “We have seen the Lord.” But he said to them, “Unless I see in his hands the mark of the nails, and put my finger into the mark of the nails, and put my hand into his side, I will certainly not believe.”
translation:
  language: sw
  text: Basi wale wanafunzi wengine walikuwa wakimwambia, “Tumemwona Bwana.” Lakini yeye akawaambia, “Nisipoona katika mikono yake alama ya misumari, na nisipoingiza kidole changu katika alama ya misumari, na nisipoingiza mkono wangu ubavuni mwake, hakika sitaamini.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sitaamini kamwe.” Kigiriki kimetumia ukanushaji wenye mkazo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: walikuwa wakimwambia
  rationale: Kauli ya wakati usiotimilika inaonyesha tendo lililoendelea au lililorudiwa; muundo huu wa Kiswahili unahifadhi hali hiyo.
- source_word: οὖν
  choice: Basi
  rationale: Kiunganishi hiki kinaendeleza simulizi na kuonyesha matokeo ya yaliyotangulia kwa lugha ya kawaida yenye hadhi.
- source_word: οἱ ἄλλοι μαθηταί
  choice: wale wanafunzi wengine
  rationale: Inawalinganisha wanafunzi waliokuwa wamemwona Yesu na Tomaso bila kuongeza maana nyingine.
- source_word: Ἑωράκαμεν
  choice: Tumemwona
  rationale: Wakati timilifu wa Kiswahili unaonyesha tukio lililokamilika ambalo bado lina umuhimu wakati wa kusema.
- source_word: κύριον
  choice: Bwana
  rationale: Ni tafsiri ya kawaida ya cheo κύριος katika muktadha huu, ambapo kinamtaja Yesu aliyefufuka.
- source_word: Ἐὰν μὴ ἴδω
  choice: Nisipoona
  rationale: Ni sharti hasi la kawaida na la asili katika Kiswahili, linalolingana na maana ya ‘isipokuwa nione’.
- source_word: ἐν ταῖς χερσὶν αὐτοῦ
  choice: katika mikono yake
  rationale: Inafuata ἐν kwa ukaribu na inaeleweka kwa alama zilizo katika sehemu za mwili.
- source_word: τύπον
  choice: alama
  rationale: Hapa τύπος ni athari au alama iliyoachwa na misumari; ‘alama’ ni wazi na ya sasa.
- source_word: ἥλων
  choice: ya misumari
  rationale: Inahifadhi uhusiano wa genitivi kati ya alama na misumari bila kufafanua kupita kiasi.
- source_word: βάλω ... εἰς
  choice: kuingiza ... katika
  rationale: Katika muktadha wa kidole na mkono, ‘kuingiza’ huhifadhi mwendo wa kuelekea ndani unaoonyeshwa na εἰς.
- source_word: τὸν δάκτυλόν μου
  choice: kidole changu
  rationale: Inahifadhi umilikaji ulio wazi katika Kigiriki.
- source_word: μου τὴν χεῖρα
  choice: mkono wangu
  rationale: Inahifadhi umilikaji ulio wazi katika Kigiriki.
- source_word: τὴν πλευρὰν αὐτοῦ
  choice: ubavuni mwake
  rationale: ‘Ubavuni mwake’ ni Kiswahili cha asili kinachoonyesha sehemu ya upande wa mwili bila kuamua kwa undani zaidi aina ya jeraha.
theological_decisions:
- issue: Nguvu ya kukataa kwa Tomaso katika οὐ μὴ πιστεύσω
  choice: hakika sitaamini
  alternative: sitaamini kamwe
  rationale: Ukanushaji maradufu wa Kigiriki ni wa mkazo. ‘Hakika sitaamini’ huhifadhi mkazo huo ndani ya sharti aliloweka Tomaso, bila kuufanya kuwa kauli ya kutokuamini milele.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ‘walikuwa wakimwambia’ unadokeza kurudiwa au kuendelea kwa usemi; marudio ya ‘alama ya misumari’ yamehifadhiwa kwa kuwa yapo katika chanzo. Alama ya tanbihi imewekwa baada ya kauli inayohusika.
