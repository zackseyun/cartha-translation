source:
  edition: SBLGNT
  text: λέγει ⸀αὐτῇ Ἰησοῦς· Γύναι, τί κλαίεις; τίνα ζητεῖς; ἐκείνη δοκοῦσα ὅτι ὁ κηπουρός ἐστιν λέγει αὐτῷ· Κύριε, εἰ σὺ ἐβάστασας αὐτόν, εἰπέ μοι ποῦ ἔθηκας αὐτόν, κἀγὼ αὐτὸν ἀρῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/015.yaml
  text: Jesus says to her[a], “Woman, why are you weeping? Whom are you seeking?” She, supposing that he was the gardener, says to him, “Sir, if you carried him away, tell me where you put him, and I will take him away.”
translation:
  language: sw
  text: Yesu akamwambia, “Mwanamke, kwa nini unalia? Unamtafuta nani?” Yeye, akidhani kwamba alikuwa mtunza bustani, akamwambia, “Bwana[a], ikiwa ni wewe uliyembeba, niambie ulipomweka, nami nitamchukua.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kigiriki: “Bwana” (κύριε). Hapa huenda ni namna ya heshima ya kusema “Mheshimiwa,” kwa kuwa Maria alidhani anazungumza na mtunza bustani.'
    reason: alternative_reading
lexical_decisions:
- source_word: Γύναι
  choice: Mwanamke
  rationale: Ni namna ya heshima ya kumwita mwanamke moja kwa moja katika muktadha huu, wala si dharau. Inahifadhi urudiaji wa usemi wa Yesu katika Yohana bila kuongeza kivumishi kisichokuwamo katika Kigiriki.
- source_word: τί κλαίεις
  choice: kwa nini unalia
  rationale: Kitenzi κλαίω humaanisha kulia; Kiswahili cha kawaida hutumia ‘kulia’ kwa huzuni na machozi. τί hapa huuliza sababu, kwa hiyo ‘kwa nini’ ni ya kiasili.
- source_word: τίνα ζητεῖς
  choice: Unamtafuta nani?
  rationale: ζητέω hapa ni kumtafuta mtu. Mpangilio huu ni wa kawaida katika Kiswahili na unahifadhi kwamba mtendwa ni mtu.
- source_word: δοκοῦσα
  choice: akidhani
  rationale: Huwasilisha hitimisho la Maria ambalo halikuwa sahihi, bila kudokeza kwamba alikuwa na uhakika kamili.
- source_word: ὁ κηπουρός
  choice: mtunza bustani
  rationale: κῆπος katika muktadha ni bustani, na κηπουρός ni mtu anayeitunza. ‘Mtunza bustani’ ni Kiswahili cha sasa na kinachoeleweka kuliko mkopo ‘gardena.’
- source_word: Κύριε
  choice: Bwana
  rationale: ‘Bwana’ huhifadhi istilahi ya Kigiriki κύριε na pia inaweza kutumika kama heshima kwa mwanamume. Tanbihi inaeleza kwamba hapa huenda ni salamu ya heshima kwa sababu Maria alidhani anazungumza na mtunza bustani.
- source_word: ἐβάστασας αὐτόν
  choice: uliyemchukua
  rationale: βαστάζω inaweza kumaanisha kubeba au kuondoa. ‘Kumchukua’ ni ya kiasili katika muktadha wa kuhamisha mwili huku ikiacha namna hasa ya uhamishaji bila kubainishwa.
- source_word: ποῦ ἔθηκας αὐτόν
  choice: ulipomweka
  rationale: τίθημι hapa ni kuweka mahali. ‘Ulipomweka’ ni fasaha na hudumisha rejeo kwa Yesu kama mtu.
- source_word: κἀγὼ αὐτὸν ἀρῶ
  choice: nami nitamchukua
  rationale: αἴρω inaweza kumaanisha kuinua, kuchukua, au kuondoa. ‘Nitamchukua’ huonyesha kusudi la Maria la kuuchukua mwili bila kuongeza maelezo yasiyo katika matini.
theological_decisions:
- issue: Tafsiri ya κύριε katika kauli ya Maria kabla hajamtambua Yesu aliyefufuka
  choice: Bwana
  alternative: Mheshimiwa; Bw.
  rationale: Ingawa muktadha unaonyesha kuwa Maria alidhani ni mtunza bustani na huenda alitumia neno hilo kama heshima tu, ‘Bwana’ huhifadhi kwa uwazi neno κύριε na utata wake wa kimakusudi au wa kifasihi katika simulizi. Tanbihi huzuia msomaji asilazimishe maana ya ungamo la kumtambua Yesu katika hatua hii.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Maswali yamewekwa katika mpangilio wa kawaida wa Kiswahili. ‘Mwanamke’ ni ya moja kwa moja lakini si ya dharau katika muktadha; ‘mtunza bustani’ ni wazi kwa wasomaji wa kawaida. Alama ya tanbihi [a] imewekwa mara tu baada ya ‘Bwana.’
