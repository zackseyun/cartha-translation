  text: εἶπεν οὖν αὐτοῖς ⸂ὁ Ἰησοῦς⸃ πάλιν· Εἰρήνη ὑμῖν· καθὼς ἀπέσταλκέν με ὁ πατήρ, κἀγὼ πέμπω ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/021.yaml
  text: So Jesus said to them again[a], “Peace to you. As the Father has sent me, even so I am sending you.”
translation:
  language: sw
  text: Basi Yesu akawaambia tena, “Amani iwe kwenu. Kama vile Baba alivyonituma, nami ninawatuma ninyi.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: Basi
  rationale: Inaonyesha mwendelezo wa simulizi na uhusiano na tukio lililotangulia kwa Kiswahili cha kawaida.
- source_word: πάλιν
  choice: tena
  rationale: Inaonyesha kwamba Yesu anarudia salamu aliyotoa katika mstari uliotangulia.
- source_word: Εἰρήνη ὑμῖν
  choice: Amani iwe kwenu
  rationale: Ni salamu ya asili na yenye heshima katika Kiswahili, huku ikihifadhi maana ya kauli fupi ya Kigiriki isiyo na kitenzi kilichoandikwa wazi.
- source_word: καθὼς
  choice: Kama vile
  rationale: Inaanzisha ulinganisho wa wazi kati ya kutumwa kwa Yesu na Baba na kutumwa kwa wanafunzi na Yesu.
- source_word: ἀπέσταλκέν
  choice: alivyonituma
  rationale: Muundo huu wa Kiswahili huwasilisha tendo la Baba la kumtuma Yesu kama msingi unaoendelea kuwa na umuhimu kwa utume wa wanafunzi; kutafsiri kwa umbo la wakati timilifu moja kwa moja kungekuwa kizito hapa.
- source_word: ὁ πατήρ
  choice: Baba
  rationale: Inahifadhi jina la kimahusiano la Kiyohana bila kuongeza kimilikishi kisichopo katika Kigiriki.
- source_word: κἀγὼ
  choice: nami
  rationale: Huunganisha kwa mkazo tendo la Yesu na lile la Baba kwa njia fupi na ya kawaida katika Kiswahili.
- source_word: πέμπω
  choice: ninawatuma
  rationale: Wakati wa sasa unaonyesha agizo linalotolewa katika tukio hili; umbo la Kiswahili linaifanya hali hiyo kuwa wazi.
- source_word: ὑμᾶς
  choice: ninyi
  rationale: Kiwakilishi cha mkazo kinawekwa baada ya kitenzi ili kudhihirisha kwamba wale wanaotumwa ni wanafunzi, bila kubadili maana.
theological_decisions:
- issue: Uhusiano kati ya Baba kumtuma Yesu na Yesu kuwatuma wanafunzi
  choice: Kama vile Baba alivyonituma, nami ninawatuma ninyi.
  alternative: Kama Baba alivyonituma, vivyo hivyo nami nawatuma ninyi.
  rationale: Tafsiri inadumisha ulinganisho wa utume na mamlaka ya kutuma bila kudai kwamba namna, cheo, au mamlaka ya kutumwa kwa wanafunzi inalingana kwa kila jambo na kutumwa kwa Yesu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. ‘Amani iwe kwenu’ ni salamu ya asili zaidi kuliko tafsiri ngumu ya neno kwa neno, na ‘Kama vile ... nami’ huhifadhi mlingano wa sentensi bila uzito usio wa lazima.
