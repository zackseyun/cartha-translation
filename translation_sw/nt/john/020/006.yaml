  yaml_path: translation/nt/john/020/006.yaml
  text: Then Simon Peter also came[a], following him, and entered into the tomb; and he sees the linen cloths lying there,
translation:
  language: sw
  text: Basi Simoni Petro naye akaja[a], akimfuata, akaingia ndani ya kaburi; anaviona vitambaa vya kitani vikiwa vimewekwa pale.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki kinatumia wakati uliopo wa kihistoria katika “anakuja” na “anaviona.” Hapa tendo la kwanza limetafsiriwa kwa wakati uliopita ili simulizi lisomeke kwa kawaida katika Kiswahili, lakini la pili limeachwa katika wakati uliopo ili kuhifadhi uhai wa masimulizi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται
  choice: akaja
  rationale: Wakati uliopo wa kihistoria wa Kigiriki umetafsiriwa kwa wakati uliopita, ambao ni wa kawaida katika masimulizi ya Kiswahili, huku mfuatano wa matukio ukibaki wazi.
- source_word: οὖν
  choice: Basi
  rationale: Neno hili linaendeleza simulizi kutokana na mstari uliotangulia; “Basi” ni kiunganishi cha kawaida na cha asili katika Kiswahili cha masimulizi.
- source_word: καὶ Σίμων Πέτρος
  choice: Simoni Petro naye
  rationale: '“Naye” huonyesha maana ya nyongeza ya καί: Simoni Petro pia alifika baada ya yule mwanafunzi mwingine.'
- source_word: ἀκολουθῶν αὐτῷ
  choice: akimfuata yule mwanafunzi mwingine
  rationale: Muundo huu unaonyesha tendo lililoendelea wakati mmoja na kuja kwake. Rejeo limewekwa wazi kwa kutumia utambulisho wa muktadha bila kumtaja mwanafunzi huyo kwa jina.
- source_word: εἰσῆλθεν εἰς τὸ μνημεῖον
  choice: akaingia kaburini
  rationale: “Kaburini” linaonyesha mahali pa kuzikia na mwendo wa kuingia kwa ufupi na kwa Kiswahili cha kawaida.
- source_word: θεωρεῖ
  choice: Anaviona
  rationale: Wakati uliopo wa kihistoria umehifadhiwa hapa ili kuleta uhai wa tukio; “kuviona” pia hudokeza kutazama kwa makini katika muktadha.
- source_word: τὰ ὀθόνια
  choice: vitambaa vya kitani
  rationale: Hili ni tafsiri ya wazi ya vitambaa vya kitani bila kuongeza moja kwa moja kwamba vilikuwa sanda au vitambaa vya maziko.
- source_word: κείμενα
  choice: vikiwa vimelala pale
  rationale: Hueleza hali na mahali pa vitambaa kwa picha ya asili katika Kiswahili, bila kudai ni nani aliyeviweka.
