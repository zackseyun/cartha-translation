  text: καὶ τὸ σουδάριον, ὃ ἦν ἐπὶ τῆς κεφαλῆς αὐτοῦ, οὐ μετὰ τῶν ὀθονίων κείμενον ἀλλὰ χωρὶς ἐντετυλιγμένον εἰς ἕνα τόπον·
base_translation:
  language: en
  yaml_path: translation/nt/john/020/007.yaml
  text: and the face cloth[a], which had been on his head, was not lying with the linen cloths but folded up separately in one place.
translation:
  language: sw
  text: na kitambaa cha kichwa[a], ambacho kilikuwa juu ya kichwa chake, hakikuwa kimewekwa pamoja na vitambaa vya kitani, bali kilikuwa kimeviringishwa kando, katika sehemu moja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kitambaa cha uso.” Neno “kimeviringishwa” linaweza pia kutafsiriwa “kimefungwa” au “kimekunjwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σουδάριον
  choice: kitambaa cha uso
  rationale: Katika muktadha wa maziko ni kitambaa kilichohusishwa na kichwa au uso wa Yesu; usemi huu ni wazi na unaeleweka kwa Kiswahili cha sasa.
- source_word: ἐπὶ τῆς κεφαλῆς αὐτοῦ
  choice: juu ya kichwa chake
  rationale: Hufuata kwa karibu kirai cha Kigiriki bila kubainisha zaidi namna kitambaa kilivyowekwa.
- source_word: ὀθονίων
  choice: vitambaa vya kitani
  rationale: Huhifadhi wingi na kutaja aina ya kitambaa bila kuongeza maelezo yasiyosemwa wazi kuhusu namna kilivyofungwa.
- source_word: κείμενον
  choice: kimelala
  rationale: Huwasilisha hali ya kitu kilichokuwa kimewekwa au kimelala mahali, kwa kupatana na taswira halisi ya mstari.
- source_word: χωρὶς
  choice: kando
  rationale: Huonyesha kuwa kitambaa hicho kilikuwa mbali na vitambaa vya kitani, huku sentensi ikibaki ya kawaida kwa Kiswahili.
- source_word: ἐντετυλιγμένον
  choice: kimekunjwa
  rationale: Huwasilisha hali ya kitambaa kilichokunjwa; neno la Kigiriki linaweza pia kueleweka kuwa kilikuwa kimefungwa au kuviringishwa, hivyo uwezekano huo umehifadhiwa katika tanbihi.
- source_word: εἰς ἕνα τόπον
  choice: mahali pamoja
  rationale: Ni tafsiri ya karibu na ya kawaida inayoonyesha eneo tofauti bila kudokeza kwamba palikuwa mahali pake maalumu.
- source_word: καὶ
  choice: na
  rationale: Ni kiunganishi rahisi kinachoendeleza maelezo ya simulizi kutoka mstari uliotangulia.
theological_decisions:
- issue: Iwapo mpangilio wa vitambaa vya maziko unadokeza dai la kitheolojia linalozidi maelezo ya simulizi
  choice: Mstari umetafsiriwa kama maelezo ya kile kilichoonekana—kitambaa kilikuwa kando na katika hali ya kukunjwa—bila kuongeza maana ya kiishara au hoja ya kiutetezi.
  alternative: Kuufasiri mpangilio huo kama ishara ya kusudi maalumu, utaratibu wa ufufuo, au uthibitisho wa tukio lililojengwa upya kwa namna fulani.
  rationale: Kigiriki kinaeleza mahali na hali ya kitambaa, lakini hakisemi wazi maana ya kiishara; tafsiri kwa hiyo inadumisha tahadhari ya kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo unabaki karibu na maelezo ya Kigiriki bila kuingiza hitimisho la kimadhehebu.
