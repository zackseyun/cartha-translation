  text: Thomas answered and said to him[a], “My Lord and my God!”
translation:
  language: sw
  text: Tomaso akajibu na kumwambia, “Bwana wangu na Mungu wangu!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: akamjibu
  rationale: Kitenzi hiki humaanisha kujibu; umbo la Kiswahili lenye kiambishi cha yambwa linaunganisha kwa kawaida maana ya αὐτῷ, yaani ‘akamjibu.’
- source_word: Θωμᾶς
  choice: Tomaso
  rationale: Jina limetoholewa kwa umbo linalotumika sana katika Kiswahili cha Biblia.
- source_word: εἶπεν αὐτῷ
  choice: akamjibu
  rationale: Ingawa Kigiriki kinasema kihalisi ‘akajibu na kumwambia,’ Kiswahili cha kawaida huepuka uradidi huo; ‘akamjibu’ huhifadhi wazi kwamba maneno yalielekezwa kwake.
- source_word: Ὁ κύριός μου
  choice: Bwana wangu
  rationale: ‘Bwana’ huhifadhi heshima na uzito wa kitheolojia wa κύριος, huku ‘wangu’ ikihifadhi ungamo la kibinafsi.
- source_word: ὁ θεός μου
  choice: Mungu wangu
  rationale: ‘Mungu’ ni tafsiri ya moja kwa moja ya θεός, na ‘wangu’ huhifadhi kiwakilishi cha umilikaji μου.
- source_word: καὶ
  choice: na
  rationale: Kiunganishi kinaunganisha majina haya mawili katika ungamo moja.
theological_decisions:
- issue: Je, maneno ya Tomaso ni ungamo linaloelekezwa moja kwa moja kwa Yesu au mshangao usioelekezwa kwake?
  choice: 'Yametafsiriwa kama maneno yanayoelekezwa moja kwa moja kwake: “Bwana wangu na Mungu wangu!”'
  alternative: Kuyachukulia kama mshangao unaoelekezwa kwa Mungu bila kumwita Yesu moja kwa moja ‘Bwana’ na ‘Mungu.’
  rationale: Kigiriki kina αὐτῷ, ‘kwake,’ na nomino zenye viambishi hapa zinafanya kazi kama mwito wa moja kwa moja. Tafsiri haipunguzi uzito wa ungamo hilo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa urahisi. Muundo wa Kigiriki ‘akajibu na kumwambia’ umewekwa kwa Kiswahili cha kawaida kama ‘akamjibu’ bila kupoteza kwamba Yesu ndiye aliyeambiwa.
