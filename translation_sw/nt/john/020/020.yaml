  text: καὶ τοῦτο εἰπὼν ⸀ἔδειξεν τὰς χεῖρας καὶ τὴν πλευρὰν ⸀αὐτοῖς. ἐχάρησαν οὖν οἱ μαθηταὶ ἰδόντες τὸν κύριον.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/020.yaml
  text: And after saying this, he showed them his hands and his side. Then the disciples rejoiced when they saw the Lord.
translation:
  language: sw
  text: Baada ya kusema hayo, akawaonyesha mikono yake na ubavu wake. Basi wanafunzi walifurahi walipomwona Bwana.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτο εἰπὼν
  choice: Baada ya kusema hayo
  rationale: Kirai cha kitenzi cha wakati uliopita kinaonyesha tendo lililotangulia tendo kuu; tafsiri hii ni ya kawaida katika Kiswahili na inadumisha mfuatano huo.
- source_word: ἔδειξεν ... αὐτοῖς
  choice: akawaonyesha
  rationale: Kitenzi δείκνυμι humaanisha kuonyesha kitu ili kionekane, na kiambishi -wa- kinawakilisha kwa kawaida yambwa αὐτοῖς (‘wao’) katika Kiswahili.
- source_word: τὰς χεῖρας
  choice: mikono yake
  rationale: Ingawa Kigiriki kimetumia kibainishi bila kimilikishi, Kiswahili cha kawaida hutaja ‘yake’ kwa kuwa Yesu anaonyesha mikono yake mwenyewe.
- source_word: τὴν πλευράν
  choice: ubavu wake
  rationale: πλευρά hapa ni sehemu ya upande wa kiwiliwili; ‘ubavu’ ni neno la kawaida katika muktadha huu na linadumisha uhusiano na jeraha lililotajwa awali bila kuliongeza waziwazi.
- source_word: ἐχάρησαν
  choice: walifurahi
  rationale: χαίρω humaanisha kufurahi au kushangilia. ‘Walifurahi’ ni Kiswahili cha sasa na cha kawaida, huku kikidumisha nguvu ya mwitikio wao.
- source_word: οὖν
  choice: Basi
  rationale: οὖν huonyesha matokeo au mwendelezo wa kimantiki; ‘Basi’ linaonyesha uhusiano huo kwa mtindo wa simulizi.
- source_word: οἱ μαθηταί
  choice: wanafunzi
  rationale: ‘Wanafunzi’ ndilo neno la kawaida la Injili kwa μαθηταί, yaani wale waliomfuata na kujifunza kwake Yesu.
- source_word: ἰδόντες
  choice: walipomwona
  rationale: Kirai hiki cha kitenzi kinaeleza tukio lililosababisha furaha yao; kishazi cha wakati ‘walipomwona’ huwasilisha uhusiano huo kwa uwazi.
- source_word: τὸν κύριον
  choice: Bwana
  rationale: κύριος katika tukio hili la Yesu kufufuka lina uzito wa cheo, si wito wa heshima tu; ‘Bwana’ hudumisha maana hiyo katika Kiswahili.
theological_decisions:
- issue: Tafsiri ya κύριος
  choice: Bwana
  alternative: mkuu / mwalimu
  rationale: Katika simulizi hili la Yesu kuwatokea baada ya kufufuka, neno hilo linafanya kazi kama cheo chenye uzito wa Kikristo. ‘Bwana’ hudumisha matumizi ya Yohana na mvutano wake wa kitheolojia bila kulipunguza kuwa wito wa heshima tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa urahisi. Muundo ni wa moja kwa moja na wa kisimulizi; hakuna alama za tanbihi kwa sababu hakuna tanbihi inayohitajika katika mstari huu.
