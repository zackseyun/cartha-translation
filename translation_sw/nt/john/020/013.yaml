base_translation:
  language: en
  yaml_path: translation/nt/john/020/013.yaml
  text: And they said to her[a], “Woman, why are you weeping?” She said to them, “They have taken away my Lord[b], and I do not know where they have put him.”
translation:
  language: sw
  text: Nao wakamwambia, “Mwanamke, unalia kwa nini[a]?” Akawaambia, “Wamemwondoa Bwana wangu[b], nami sijui walikomweka.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, Kigiriki husema “unalia nini?”; katika Kiswahili maana ya kawaida ni “unalia kwa nini?”
    reason: lexical_alternative
  - marker: b
    text: Au, “bwana wangu.” Neno la Kigiriki kyrios linaweza kutumiwa kama cheo cha heshima au kwa maana ya bwana/mkuu; hapa limetafsiriwa “Bwana.”
    reason: alternative_reading
lexical_decisions:
- source_word: Γύναι
  choice: Mwanamke
  rationale: Ni namna ya kumwita mwanamke moja kwa moja na kwa heshima katika muktadha huu; tafsiri hii huhifadhi usemi wa Kigiriki bila kuongeza hisia ambazo hazikutajwa.
- source_word: τί κλαίεις
  choice: unalia kwa nini
  rationale: Ingawa τί kwa msingi ni ‘nini,’ katika muundo huu swali la Kiswahili la kawaida ni ‘unalia kwa nini?’ Kitenzi cha wakati uliopo kinaonyesha tendo linaloendelea.
- source_word: Ἦραν
  choice: Wamemwondoa
  rationale: Hueleza tendo lililokamilika la kumtoa Yesu mahali alipokuwa, huku matokeo yake yakiendelea kuwa muhimu katika wakati wa kauli ya Maria.
- source_word: τὸν κύριόν μου
  choice: Bwana wangu
  rationale: ‘Bwana’ huhifadhi heshima, uhusiano wa kibinafsi, na uwezekano wa uzito wa kikristo katika Injili ya Yohana bila kuufupisha usemi huo kuwa cheo cha kijamii tu.
- source_word: οὐκ οἶδα
  choice: sijui
  rationale: Kitenzi οἶδα kina maana ya hali ya sasa ya kujua; ‘sijui’ ni Kiswahili cha kawaida na sahihi.
- source_word: ποῦ ἔθηκαν αὐτόν
  choice: walikomweka
  rationale: Tafsiri hii huwasilisha kwa ufupi na kwa kawaida maana ya ‘mahali walipomweka,’ bila kudokeza zaidi ya kitendo cha kumweka mahali.
- source_word: ἐκεῖνοι
  choice: wa- katika ‘wakamwambia’
  rationale: Kiwakilishi cha wingi kinarejelea wale waliotajwa katika muktadha; Kiswahili hakihitaji kurudia ‘hao’ ikiwa warejelewa wako wazi.
theological_decisions:
- issue: Maana ya κύριος katika kauli ya Maria
  choice: Bwana wangu
  alternative: bwana wangu, kwa maana ya mkuu au mwenye mamlaka juu yake
  rationale: ‘Bwana’ ndiyo tafsiri ya msingi na huhifadhi uwezekano wa maana ya heshima pamoja na uzito wa kikristo; tanbihi inaonyesha maana nyingine ya kimuktadha bila kuamua kwamba ni cheo cha kijamii tu.
- issue: Toni ya Γύναι
  choice: Mwanamke
  alternative: Mama
  rationale: Neno la Kigiriki ni la heshima katika muktadha huu lakini haliongezi ukaribu wa kihisia. ‘Mwanamke’ huhifadhi uwazi wa usemi wa asili, ilhali ‘Mama’ lingeweza kuingiza kaida ya heshima ya Kiswahili isiyoelezwa moja kwa moja katika neno lenyewe.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi unaoeleweka na hadhi inayofaa Maandiko. Miundo ‘wakamwambia’ na ‘akawaambia’ inawakilisha wakati uliopo wa kihistoria wa Kigiriki kwa namna ya kawaida katika simulizi la Kiswahili.
