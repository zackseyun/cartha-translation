  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ⸀ταῦτα εἰποῦσα ἐστράφη εἰς τὰ ὀπίσω, καὶ θεωρεῖ τὸν Ἰησοῦν ἑστῶτα, καὶ οὐκ ᾔδει ὅτι Ἰησοῦς ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/014.yaml
  text: After saying these things[a], she turned around and saw Jesus standing there, and she did not know that it was Jesus.
translation:
  language: sw
  text: Baada ya kusema hayo, akageuka nyuma, akamwona Yesu amesimama pale, naye hakujua kwamba alikuwa Yesu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hakutambua kwamba alikuwa Yesu.” Kigiriki kinasema kihalisi, “hakujua kwamba ni Yesu,” kikieleza kwamba hakujua utambulisho wake.
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα
  choice: hayo
  rationale: Kiwakilishi cha wingi kinarejelea mambo aliyokuwa amesema; “hayo” ni cha kawaida na huhifadhi wingi wa Kigiriki.
- source_word: εἰποῦσα
  choice: Baada ya kusema
  rationale: Kirai cha wakati kinaonyesha kwamba kusema kulitangulia kugeuka, kwa Kiswahili cha asili na kinachoeleweka.
- source_word: ἐστράφη εἰς τὰ ὀπίσω
  choice: aligeuka nyuma
  rationale: Huwasilisha kwa kawaida tendo la kugeukia upande uliokuwa nyuma yake bila kulifanya kuwa la kiufundi.
- source_word: θεωρεῖ
  choice: akamwona
  rationale: Wakati uliopo wa kihistoria katika simulizi umetafsiriwa kwa mfuatano wa wakati uliopita wa Kiswahili; kitenzi kinaonyesha kwamba alimwona kwa macho.
- source_word: ἑστῶτα
  choice: amesimama pale
  rationale: Huhifadhi hali ya Yesu kuwa amesimama; “pale” hufanya mandhari isikike kwa kawaida bila kudai kwamba alikuwa karibu.
- source_word: οὐκ ᾔδει
  choice: hakujua
  rationale: Hufuata maana ya msingi ya οἶδα na kuacha uwezekano wa “hakutambua” kwa tanbihi badala ya kuufanya kuwa tafsiri pekee.
- source_word: ὅτι Ἰησοῦς ἐστιν
  choice: kwamba alikuwa Yesu
  rationale: Ni namna ya kawaida ya Kiswahili ya kueleza kutokujua utambulisho wa mtu katika simulizi la wakati uliopita.
theological_decisions:
- issue: Utambulisho wa Yesu aliyefufuka katika simulizi
  choice: hakujua kwamba alikuwa Yesu
  alternative: hakutambua kwamba alikuwa Yesu
  rationale: Andiko linasema Maria hakujua utambulisho wake bila kueleza sababu. Tafsiri kuu huhifadhi mvutano huo na haiongezi maelezo ya kiteolojia au kisaikolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo wa simulizi ni wa kawaida kwa wasomaji wengi; hakuna istilahi ya kimadhehebu iliyoingizwa.
