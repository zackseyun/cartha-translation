  text: And stooping to look in[a], he sees the linen cloths lying there, yet he did not enter.
translation:
  language: sw
  text: Naye alipoinama na kuchungulia ndani, akaona vitambaa vya kitani vimewekwa, lakini hakuingia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρακύψας
  choice: alipoinama na kuchungulia ndani
  rationale: Kirai hiki kinaonyesha tendo la kuinama na kutazama kuelekea ndani ya kaburi; tafsiri hii inahifadhi mwendo wa mwili na mwelekeo wa kutazama.
- source_word: βλέπει
  choice: akaona
  rationale: Ingawa Kigiriki kinatumia wakati wa sasa wa kihistoria, katika simulizi la kawaida la Kiswahili mfuatano wa '-ka-' huwasilisha tendo hilo kwa uhai na kwa ufasaha bila kubadili maana.
- source_word: κείμενα
  choice: vikiwa vimelala
  rationale: Kitenzi κεῖμαι kinaeleza kwamba vitambaa vilikuwa katika hali ya kulala mahali; usemi huu hauashirii kwamba mtu fulani alivipanga kwa namna maalumu.
- source_word: τὰ ὀθόνια
  choice: vitambaa vya kitani
  rationale: Hii ni tafsiri ya moja kwa moja ya vitambaa vya kitani vilivyotumiwa katika maziko; muktadha tayari unaonyesha matumizi yake.
- source_word: οὐ μέντοι
  choice: lakini
  rationale: Kiunganishi hiki kinahifadhi tofauti kati ya kuona vitambaa na kutokuingia kaburini.
- source_word: εἰσῆλθεν
  choice: hakuingia
  rationale: Tafsiri ya moja kwa moja na ya kawaida ya tendo la kuingia ndani.
