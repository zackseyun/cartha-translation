  text: ταῦτα δὲ γέγραπται ἵνα ⸀πιστεύητε ὅτι Ἰησοῦς ἐστιν ὁ χριστὸς ὁ υἱὸς τοῦ θεοῦ, καὶ ἵνα πιστεύοντες ζωὴν ἔχητε ἐν τῷ ὀνόματι αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/031.yaml
  text: But these have been written so that you may believe that Jesus is the Messiah[a], the Son of God[b], and so that by believing you may have life in his name.
translation:
  language: sw
  text: Lakini haya yameandikwa ili mwamini[a] kwamba Yesu ndiye Masihi[b], Mwana wa Mungu, na ili kwa kuamini mpate kuwa na uzima katika jina lake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maandishi makuu yana kitenzi cha wakati wa sasa, kinachoweza kueleweka “mwamini” au “mwamini mkiendelea.” Baadhi ya hati zina kitenzi cha aoristi, kinachoweza kueleweka “mpate kuja kuamini.” Tafsiri kuu inatumia “mwamini” kwa upana.
    reason: textual_variant
  - marker: b
    text: Au “Kristo.” Neno la Kigiriki Χριστός ni cheo; hapa limetafsiriwa “Masihi” ili kuhifadhi maana yake.
    reason: alternative_reading
lexical_decisions:
- source_word: ταῦτα
  choice: haya
  rationale: Kiwakilishi hiki kinarejelea ishara na mambo yaliyoandikwa yaliyotajwa katika muktadha; “haya” ni ya kawaida na wazi kwa Kiswahili.
- source_word: δὲ
  choice: Lakini
  rationale: Huonyesha tofauti au mpito mdogo kutoka kauli iliyotangulia.
- source_word: γέγραπται
  choice: yameandikwa
  rationale: Wakati timilifu wa kutendwa unaonyesha tendo lililokamilika lenye matokeo yanayoendelea; “yameandikwa” huwasilisha maana hiyo kwa kawaida.
- source_word: ἵνα πιστεύητε
  choice: ili mpate kuamini
  rationale: Huhifadhi kusudi la sentensi bila kulazimisha maana ya kuanza kuamini au kuendelea kuamini.
- source_word: ὅτι Ἰησοῦς ἐστιν ὁ χριστός
  choice: kwamba Yesu ndiye Masihi
  rationale: “Ndiye” huonyesha utambulisho wa kiarifu, na “Masihi” huhifadhi Χριστός kama cheo badala ya jina.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: Mwana wa Mungu
  rationale: Ni tafsiri ya moja kwa moja na iliyozoeleka ya cheo hiki cha Kristo, bila kupunguza uzito wake.
- source_word: καὶ ἵνα
  choice: na ili
  rationale: Hudumisha muundo sambamba wa kishazi cha pili cha kusudi.
- source_word: πιστεύοντες
  choice: kwa kuamini
  rationale: Huwasilisha kirai shiriki kama njia au hali inayohusiana na kupata uzima.
- source_word: ζωὴν ἔχητε
  choice: mpate kuwa na uzima
  rationale: “Uzima” huhifadhi maana ya kitheolojia ya ζωὴ bila kuongeza “wa milele,” ambalo halipo katika mstari huu.
- source_word: ἐν τῷ ὀνόματι αὐτοῦ
  choice: katika jina lake
  rationale: Hufuata sitiari ya chanzo au uwanja wa mamlaka na utambulisho iliyomo katika Kigiriki, bila kuifafanua kupita kiasi.
theological_decisions:
- issue: Tafsiri ya Χριστός kama cheo
  choice: Masihi
  alternative: Kristo
  rationale: Neno hili linafanya kazi kama cheo kinachomtambulisha Yesu kuwa mfalme aliyetiwa mafuta aliyeahidiwa; “Masihi” huhifadhi maana ya cheo hicho.
- issue: Tofauti ya maandishi na hali ya tendo katika πιστεύητε
  choice: mpate kuamini
  alternative: mpate kuendelea kuamini / mpate kuja kuamini
  rationale: Maandishi ya SBLGNT yana wakati wa sasa wa utegemezi, huku baadhi ya hati zikiwa na wakati aoristi. Tafsiri kuu imeachwa pana ili isiamue kimya kimya ikiwa kusudi ni kuanza au kuendelea kuamini.
- issue: Maana ya ζωὴ
  choice: uzima
  alternative: uzima wa milele
  rationale: Ingawa matumizi ya Yohana yana kina cha kitheolojia, kivumishi “wa milele” hakipo hapa; kwa hiyo hakijaongezwa.
- issue: Maana ya ἐν τῷ ὀνόματι αὐτοῦ
  choice: katika jina lake
  alternative: kwa jina lake
  rationale: “Katika jina lake” huhifadhi kwa karibu usemi wa Kigiriki na upeo wake mpana wa utambulisho, mamlaka, na uhusiano bila kuchagua ufafanuzi mmoja pekee.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi unadumisha vishazi viwili sambamba vya kusudi, na istilahi za kitheolojia zimeachwa wazi bila kuongeza ufafanuzi usiokuwapo katika Kigiriki.
