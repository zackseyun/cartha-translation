  text: τρέχει οὖν καὶ ἔρχεται πρὸς Σίμωνα Πέτρον καὶ πρὸς τὸν ἄλλον μαθητὴν ὃν ἐφίλει ὁ Ἰησοῦς, καὶ λέγει αὐτοῖς· Ἦραν τὸν κύριον ἐκ τοῦ μνημείου, καὶ οὐκ οἴδαμεν ποῦ ἔθηκαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/002.yaml
  text: So she runs and comes to Simon Peter and to the other disciple[a], whom Jesus loved, and says to them, “They have taken the Lord out of the tomb[b], and we do not know where they have laid him.”
translation:
  language: sw
  text: Basi anakimbia na kufika kwa Simoni Petro na kwa yule mwanafunzi mwingine ambaye Yesu alimpenda[a], na anawaambia, “Wamemwondoa Bwana kutoka kaburini, na hatujui[b] walikomweka.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kitenzi cha Kigiriki hapa ni φιλέω, ambacho kinaweza kusisitiza upendo wa karibu; pia yaweza kutafsiriwa, “ambaye Yesu alikuwa akimpenda kwa upendo wa karibu.”
    reason: lexical_alternative
  - marker: b
    text: Maria anasema “hatujui,” akitumia nafsi ya kwanza wingi kama ilivyo katika Kigiriki. Baadhi huelewa kwamba anawahusisha wanawake wengine waliokuwa pamoja naye, lakini mstari huu wenyewe hauelezi sababu ya wingi huo.
    reason: alternative_reading
lexical_decisions:
- source_word: τρέχει
  choice: anakimbia
  rationale: Wakati uliopo wa kisimulizi umehifadhiwa ili kudumisha uhai na uharaka wa tukio.
- source_word: οὖν
  choice: Basi
  rationale: Neno hili linaonyesha matokeo ya jambo lililotangulia kwa mtiririko wa kawaida wa Kiswahili.
- source_word: ἔρχεται πρὸς
  choice: na kwenda kwa
  rationale: Katika muktadha huu kitenzi kinaonyesha mwendo hadi kwa watu waliotajwa; ‘kwenda kwa’ ni Kiswahili cha kawaida na hakilazimishi mtazamo wa mahali wa msimulizi.
- source_word: τὸν ἄλλον μαθητήν
  choice: yule mwanafunzi mwingine
  rationale: ‘Mwanafunzi’ ni neno la kawaida la Injili kwa μαθητής, na ‘mwingine’ huhifadhi utofautishaji wake na Petro.
- source_word: ὃν ἐφίλει ὁ Ἰησοῦς
  choice: ambaye Yesu alimpenda
  rationale: φιλέω hapa huonyesha upendo au shauku ya karibu; ‘alimpenda’ ni ya asili na yenye hadhi bila kudhoofisha maana.
- source_word: λέγει αὐτοῖς
  choice: na kuwaambia
  rationale: Wakati uliopo wa kisimulizi umeendelezwa; umbo hili linaunganisha vitendo kwa Kiswahili kinachoeleweka.
- source_word: Ἦραν
  choice: Wamemwondoa
  rationale: Hali timilifu ya Kiswahili huonyesha tendo lililokamilika lenye matokeo ya sasa, yaani hayupo tena kaburini; ‘kumwondoa’ huwasilisha tendo la kumtoa mahali.
- source_word: τὸν κύριον
  choice: Bwana
  rationale: ‘Bwana’ ni jina la heshima na la kawaida kwa κύριος anapotajwa Yesu katika muktadha huu.
- source_word: ἐκ τοῦ μνημείου
  choice: kaburini
  rationale: μνημεῖον hapa ni kaburi la kuzikia; pamoja na ‘wamemwondoa,’ kiambishi -ni huonyesha kwa kawaida mahali alikotolewa.
- source_word: οὐκ οἴδαμεν
  choice: hatujui
  rationale: Umbo la nafsi ya kwanza wingi limehifadhiwa badala ya kulibadili kuwa umoja.
- source_word: ποῦ ἔθηκαν αὐτόν
  choice: walikomweka
  rationale: τίθημι hapa ni kumweka mahali; ‘walikomweka’ ni ya asili na huhifadhi kutokujulikana kwa mahali alipo.
theological_decisions:
- issue: Tafsiri ya κύριος ikimtaja Yesu
  choice: Bwana
  alternative: bwana mkubwa / mwalimu
  rationale: ‘Bwana’ huhifadhi jina la heshima lenye uzito wa kikristo bila kulipunguza kuwa cheo cha kawaida tu.
- issue: Wingi katika οἴδαμεν
  choice: hatujui
  alternative: sijui
  rationale: Wingi wa Kigiriki umehifadhiwa ili kutosuluhisha kimyakimya swali la watu wengine ambao huenda Maria aliwahusisha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa sasa, wa heshima na unaoeleweka kwa wasomaji wa kawaida. Wakati uliopo wa kisimulizi umehifadhiwa katika mwanzo wa aya, huku usemi wa moja kwa moja ukitumia hali timilifu ya kawaida ya Kiswahili.
