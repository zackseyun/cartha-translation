  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: λέγει ⸀αὐτῇ Ἰησοῦς· Μή μου ἅπτου, οὔπω γὰρ ἀναβέβηκα πρὸς τὸν ⸀πατέρα· πορεύου δὲ πρὸς τοὺς ἀδελφούς μου καὶ εἰπὲ αὐτοῖς· Ἀναβαίνω πρὸς τὸν πατέρα μου καὶ πατέρα ὑμῶν καὶ θεόν μου καὶ θεὸν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/017.yaml
  text: Jesus said to her[a], “Do not cling to me, for I have not yet ascended to the Father. But go to my brothers and tell them, ‘I am ascending to my Father and your Father[b], and my God and your God.’”
translation:
  language: sw
  text: Yesu akamwambia, “Usiendelee kunishikilia[a], kwa maana bado sijapaa kwenda kwa Baba. Lakini nenda kwa ndugu zangu[b] ukawaambie, ‘Ninapaa kwenda kwa Baba yangu na Baba yenu, kwa Mungu wangu na Mungu wenu.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Usiniguse” au “Usiendelee kunishika.” Kigiriki huenda kinamaanisha kuendelea kumshikilia badala ya kumgusa tu.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kigiriki hapa ni wingi wa kiume, “ndugu”; katika muktadha huu linawarejelea wanafunzi wa Yesu na huenda likahusu kundi pana zaidi la wawakilishi wake.
    reason: cultural_note
lexical_decisions:
- source_word: Μή μου ἅπτου
  choice: Usiendelee kunishikilia
  rationale: Kitenzi cha wakati uliopo pamoja na μή kinaweza kukataza tendo linaloendelea. Kauli hii huonyesha kuendelea kumshika bila kudai kwamba kugusa tu kulikatazwa.
- source_word: οὔπω γὰρ ἀναβέβηκα
  choice: kwa maana bado sijapaa
  rationale: “Sijapaa” huhifadhi maana ya kupaa kuelekea kwa Baba na nguvu ya wakati timilifu wa Kigiriki.
- source_word: πρὸς τὸν πατέρα
  choice: kwenda kwa Baba
  rationale: Nomino katika kishazi hiki haina kiwakilishi “yangu”; tafsiri hii huhifadhi tofauti hiyo kabla ya usemi unaofuata.
- source_word: πορεύου
  choice: nenda
  rationale: Ni amri ya kawaida ya kuondoka au kuelekea mahali fulani; “nenda” ni ya asili na wazi katika Kiswahili.
- source_word: ἀδελφούς
  choice: ndugu zangu
  rationale: “Ndugu” ni neno la asili la Kiswahili linaloweza kuwakilisha wingi wa kiume wa Kigiriki bila kulazimisha jinsia katika umbo la neno; tanbihi inaeleza rejeo lake katika muktadha.
- source_word: εἰπὲ αὐτοῖς
  choice: ukawaambie
  rationale: Hii ni njia ya kawaida ya Kiswahili ya kuunganisha amri ya kwenda na ujumbe wa kuwaambia.
- source_word: Ἀναβαίνω
  choice: Ninapaa
  rationale: Wakati uliopo wa Kigiriki unaonyesha tendo linalokaribia au lililo katika mwendo; “ninapaa” huhifadhi uhai na mwelekeo wake.
- source_word: πατέρα μου καὶ πατέρα ὑμῶν
  choice: Baba yangu na Baba yenu
  rationale: Huhifadhi usambamba wa makusudi na kutaja mahusiano hayo mawili kando kando.
- source_word: θεόν μου καὶ θεὸν ὑμῶν
  choice: Mungu wangu na Mungu wenu
  rationale: Ni tafsiri ya moja kwa moja inayohifadhi usambamba na uzito wa kiteolojia bila kuufifisha.
theological_decisions:
- issue: Maana ya Μή μου ἅπτου
  choice: Kukataza kuendelea kumshikilia Yesu
  alternative: Usiniguse
  rationale: Muundo na hali ya kitenzi cha Kigiriki zinaunga mkono wazo la tendo linaloendelea. Tafsiri haifanyi kila mguso kuwa jambo lililokatazwa, wala haisemi zaidi ya matini.
- issue: Tafsiri ya πατέρα katika kishazi cha kwanza
  choice: Baba
  alternative: Baba yangu
  rationale: Matini ya Kigiriki haina μου katika kishazi cha kwanza. Kutotaja “yangu” hapa huheshimu tofauti ya kisarufi, huku usemi unaofuata ukitaja wazi “Baba yangu na Baba yenu.”
- issue: Uzito wa kikristolojia wa “Mungu wangu na Mungu wenu”
  choice: Kutafsiri kauli hiyo moja kwa moja
  alternative: Kuifafanua kwa maneno yanayopunguza nguvu ya “Mungu wangu”
  rationale: Kauli inapaswa kubaki na uzito na mvutano wake wa kiteolojia katika muktadha wa Yohana, bila kugeuzwa ili kutangulia kutatua maswali ya kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Usiendelee kunishikilia” ni wazi kwa msomaji wa kawaida na huhifadhi hali ya tendo linaloendelea. “Kupaa kwenda kwa Baba” hudumisha lugha ya Yohana na kuepuka ufafanuzi wa kimadhehebu.
