  text: ἐξῆλθεν οὖν ὁ Πέτρος καὶ ὁ ἄλλος μαθητής, καὶ ἤρχοντο εἰς τὸ μνημεῖον.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/003.yaml
  text: So Peter and the other disciple went out and were going to the tomb[a].
translation:
  language: sw
  text: Basi Petro na yule mwanafunzi mwingine wakatoka, wakaelekea kaburini[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walikuwa wakienda kaburini.” Kitenzi cha Kigiriki kinaweza kuonyesha kwamba tendo la kwenda lilikuwa linaendelea.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: wakatoka
  rationale: Kitenzi hiki kinaonyesha kuondoka mahali. “Wakatoka” ni usemi wa kawaida wa Kiswahili na pia unaendeleza mfululizo wa simulizi.
- source_word: οὖν
  choice: Basi
  rationale: Hapa neno hili linaunganisha tendo hilo na habari ya mstari uliotangulia kwa kuonyesha matokeo ya jambo lililosemwa; “Basi” ni kiunganishi cha kawaida katika simulizi.
- source_word: ὁ Πέτρος
  choice: Petro
  rationale: Hili ndilo umbo la kawaida la jina hili katika tafsiri za Kiswahili.
- source_word: ὁ ἄλλος μαθητής
  choice: yule mwanafunzi mwingine
  rationale: “Mwanafunzi” ni neno la kawaida kwa μαθητής, na “yule ... mwingine” humtambulisha mtu aliyekwisha kutajwa katika muktadha huku akitofautishwa na Petro.
- source_word: ἤρχοντο
  choice: wakaelekea
  rationale: Kitenzi hiki kinaonyesha mwendo kuelekea mahali fulani. “Wakaelekea” ni cha asili katika simulizi ya Kiswahili na hakidai kwamba waliingia ndani ya kaburi. Hali yake ya tendo linaloendelea imeelezwa katika tanbihi.
- source_word: εἰς τὸ μνημεῖον
  choice: kaburini
  rationale: Katika muktadha huu μνημεῖον ni kaburi alimozikwa Yesu. “Kaburini” huonyesha kuelekea mahali hapo bila kudai kwamba waliingia ndani.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa vitenzi vya mfululizo “wakatoka, wakaelekea” unasomeka kwa kawaida katika simulizi, huku tanbihi ikihifadhi kwa uwazi zaidi hali endelevu ya kitenzi cha Kigiriki.
