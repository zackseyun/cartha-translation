lexical_decisions:
- source_word: ἀπῆλθον
  choice: wakaondoka
  rationale: Kitenzi hiki kinaonyesha kuondoka mahali walipokuwa; “wakaondoka” ni Kiswahili cha kawaida na kinaendeleza simulizi.
- source_word: οὖν
  choice: Basi
  rationale: “Basi” linaonyesha mwendelezo au matokeo katika simulizi bila kufanya uhusiano huo kuwa mkali kupita kiasi.
- source_word: πάλιν
  choice: wakarudi
  rationale: Katika muktadha wa mwendo, “wakarudi” linaeleza kwa kawaida wazo la kwenda tena kuelekea mahali pa awali.
- source_word: πρὸς αὑτούς
  choice: walikokuwa wakikaa
  rationale: Kwa neno kwa neno usemi huu ni “kwao wenyewe,” lakini hapa huenda unamaanisha mahali pao au mahali walipokuwa wakikaa. Tafsiri hii ni ya kawaida bila kudai kwamba kila mmoja alirudi kwenye nyumba yake mwenyewe.
- source_word: οἱ μαθηταί
  choice: wanafunzi
  rationale: “Wanafunzi” ndilo neno la kawaida la Kiswahili kwa wale waliomfuata na kujifunza kwa Yesu.
