base_translation:
  language: en
  yaml_path: translation/nt/john/020/012.yaml
  text: and she sees two angels in white sitting[a], one at the head and one at the feet[b], where the body of Jesus had been lying.
translation:
  language: sw
  text: akaona malaika wawili waliokuwa wameketi, wamevaa mavazi meupe[a], mmoja karibu na kichwa na mwingine karibu na miguu, pale mwili wa Yesu ulikuwa umelala[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa neno moja, Kigiriki ni “katika meupe”; yaani, walikuwa wamevaa mavazi meupe.
    reason: lexical_alternative
  - marker: b
    text: Au “pale mwili wa Yesu ulipokuwa umelazwa.” Kitenzi cha Kigiriki hueleza hali ya mwili kuwa hapo; muktadha unaonyesha kwamba mahali hapo ni pale ulipokuwa kabla ya Maria kuuona kaburi tupu.
    reason: lexical_alternative
lexical_decisions:
- source_word: θεωρεῖ
  choice: akaona
  rationale: Wakati uliopo wa kihistoria katika simulizi umetafsiriwa kwa wakati uliopita wa Kiswahili ili simulizi lisomeke kwa kawaida; kiima ni Maria kutoka muktadha uliotangulia.
- source_word: ἀγγέλους
  choice: malaika
  rationale: Katika muktadha wa kaburi la ufufuo, neno hili linamaanisha viumbe wa mbinguni, si wajumbe wa kawaida.
- source_word: ἐν λευκοῖς
  choice: wamevaa mavazi meupe
  rationale: Kigiriki kinasema kwa ufupi 'katika meupe'; Kiswahili cha kawaida huhitaji kutaja mavazi ili maana iwe wazi bila kubainisha aina yake.
- source_word: καθεζομένους
  choice: wameketi
  rationale: Hueleza mkao wa malaika kwa lugha ya kawaida na yenye heshima.
- source_word: ἕνα πρὸς τῇ κεφαλῇ καὶ ἕνα πρὸς τοῖς ποσίν
  choice: mmoja upande wa kichwa na mwingine upande wa miguu
  rationale: Neno πρός pamoja na hali ya dative huonyesha mahali karibu na ncha za sehemu ambako mwili ulikuwa umelazwa.
- source_word: ὅπου
  choice: pale ... ulipokuwa
  rationale: Muundo huu ni wa asili katika Kiswahili na huonyesha mahali panaporejelewa.
- source_word: ἔκειτο
  choice: ulipokuwa umelazwa
  rationale: Kitenzi kinaonyesha hali ya mwili kuwa umelala au kuwekwa hapo. 'Umelazwa' kinafaa kwa mwili uliowekwa kaburini, huku tanbihi ikihifadhi uwezekano wa tafsiri isiyoeleza tendo la kuulaza.
- source_word: σῶμα τοῦ Ἰησοῦ
  choice: mwili wa Yesu
  rationale: Ni tafsiri ya moja kwa moja, ya kawaida, na yenye heshima.
theological_decisions:
- issue: Maana ya ἀγγέλους katika muktadha wa ufufuo
  choice: malaika wa mbinguni
  alternative: wajumbe
  rationale: Muktadha wa kaburi tupu na mavazi meupe unaonyesha kuwa hawa ni malaika; uamuzi huu unatokana na matumizi ya neno katika muktadha, si msimamo wa dhehebu.
- issue: Hali na wakati unaoonyeshwa na ἔκειτο
  choice: mahali ambapo mwili ulikuwa umelazwa kabla ya Maria kuona
  alternative: mahali ambapo mwili ulikuwa umelala
  rationale: Muundo wa Kiswahili unaonyesha hali iliyotangulia katika simulizi bila kudai zaidi ya muktadha; tanbihi inahifadhi tofauti halisi ya namna ya kutafsiri kitenzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imetumia wakati uliopita unaofaa simulizi la Kiswahili, na imeepuka kuongeza neno lisilo la lazima kama “hapo” baada ya “wameketi.”
