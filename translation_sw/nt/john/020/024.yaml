  text: Θωμᾶς δὲ εἷς ἐκ τῶν δώδεκα, ὁ λεγόμενος Δίδυμος, οὐκ ἦν μετ’ αὐτῶν ὅτε ⸀ἦλθεν Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/024.yaml
  text: Thomas[a], one of the Twelve, the one called Didymus, was not with them when Jesus came.
translation:
  language: sw
  text: Tomaso, mmoja wa wale Kumi na Wawili, aliyeitwa Pacha[a], hakuwa pamoja nao wakati Yesu alipokuja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa Kigiriki: Didimo, maana yake “Pacha.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: imewakilishwa kwa mpito wa kawaida bila kiunganishi cha wazi
  rationale: Hapa δέ ni alama nyepesi ya kuhamisha simulizi kwa Tomaso, si pingamizi kali. Kiswahili cha kawaida hakihitaji neno kama “lakini” au “basi” katika sentensi hii.
- source_word: εἷς ἐκ τῶν δώδεκα
  choice: mmoja wa wale Kumi na Wawili
  rationale: Hili linamtambulisha Tomaso kuwa mshiriki wa kundi lililojulikana la mitume; herufi kubwa zinaonyesha kuwa “Kumi na Wawili” ni jina la kundi.
- source_word: ὁ λεγόμενος Δίδυμος
  choice: aliyeitwa Pacha[a]
  rationale: Δίδυμος lina maana ya “pacha.” Kutafsiri maana yake kunampa msomaji wa Kiswahili taarifa iliyopatikana moja kwa moja kwa msomaji wa Kigiriki, huku tanbihi ikihifadhi umbo la jadi “Didimo.”
- source_word: οὐκ ἦν μετ’ αὐτῶν
  choice: hakuwa pamoja nao
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kutokuwapo kwa Tomaso katika kundi wakati huo.
- source_word: ὅτε ἦλθεν Ἰησοῦς
  choice: Yesu alipokuja
  rationale: Muundo huu ni wa asili katika Kiswahili na unadumisha maana ya wakati ya ὅτε pamoja na maana ya kawaida ya ἦλθεν.
theological_decisions:
- issue: Jinsi ya kutafsiri Δίδυμος
  choice: Pacha
  alternative: Didimo
  rationale: Neno hili si dai la kimafundisho bali ni jina la ziada lenye maana ya wazi katika Kigiriki. “Pacha” huhifadhi maana hiyo; “Didimo” limetajwa katika tanbihi ili kuhifadhi umbo la jadi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa simulizi la Maandiko. “Kumi na Wawili” limetumiwa kama jina rasmi la kundi, na “Pacha” limetafsiriwa kwa uwazi badala ya kuachwa kama umbo la Kigiriki lisiloeleweka kwa wasomaji wengi.
