  text: τότε οὖν εἰσῆλθεν καὶ ὁ ἄλλος μαθητὴς ὁ ἐλθὼν πρῶτος εἰς τὸ μνημεῖον, καὶ εἶδεν καὶ ἐπίστευσεν·
base_translation:
  language: en
  yaml_path: translation/nt/john/020/008.yaml
  text: Then the other disciple[a], who had arrived at the tomb first, also went in[b], and he saw and believed.
translation:
  language: sw
  text: Ndipo yule mwanafunzi mwingine, aliyekuwa amefika kaburini kwanza, naye akaingia, akaona na akaamini.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki kinasema tu “akaamini,” bila kueleza wazi alichoamini. Huenda maana yake ni kwamba aliamini Yesu amefufuka, aliamini ushahidi aliouona, au aliamini taarifa ya awali.
    reason: alternative_reading
lexical_decisions:
- source_word: τότε οὖν
  choice: Ndipo
  rationale: Huonyesha mfuatano wa simulizi wenye kidokezo chepesi cha matokeo; “Ndipo” ni ya asili katika Kiswahili na haiutilii mkazo kupita kiasi uhusiano wa kimantiki.
- source_word: εἰσῆλθεν
  choice: akaingia
  rationale: Hutoa kwa kawaida tendo la kuingia ndani ya kaburi katika mfuatano wa simulizi.
- source_word: ὁ ἄλλος μαθητής
  choice: yule mwanafunzi mwingine
  rationale: “Mwanafunzi” ni istilahi iliyozoeleka kwa μαθητής katika muktadha huu; “yule” humtambulisha mtu ambaye tayari ametajwa katika simulizi.
- source_word: ὁ ἐλθὼν πρῶτος εἰς τὸ μνημεῖον
  choice: aliyekuwa amefika kaburini kwanza
  rationale: Huonyesha kwamba kufika kwake kulitangulia tendo kuu la kuingia, huku “kwanza” ikihifadhi kulinganisha kwake na Petro.
- source_word: μνημεῖον
  choice: kaburini
  rationale: Katika simulizi la maziko na ufufuo, neno hili linamaanisha mahali Yesu alipozikwa; “kaburi” ndilo neno la kawaida na sahihi.
- source_word: καὶ εἶδεν
  choice: akaona
  rationale: Huhifadhi maana ya moja kwa moja na mfuatano wa vitenzi vya simulizi.
- source_word: ἐπίστευσεν
  choice: akaamini
  rationale: Huhifadhi kitenzi bila kutaja alichoamini, sawasawa na ufupi na utata wa Kigiriki.
theological_decisions:
- issue: Alichoamini yule mwanafunzi
  choice: Kutafsiri kitenzi peke yake kuwa “akaamini,” bila kutaja jambo aliloamini.
  alternative: “akaamini kwamba Yesu amefufuka,” “akaamini taarifa ya Maria,” au “akafikia imani.”
  rationale: Kigiriki hakitaji yambwa la kitenzi. Kuliongeza kungeamua suala ambalo andiko lenyewe linaacha wazi, hasa kwa kuzingatia mstari unaofuata.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa vitenzi vya -ka- unatoa mfuatano wa simulizi kwa urahisi; utata wa mwisho wa Kigiriki umehifadhiwa.
