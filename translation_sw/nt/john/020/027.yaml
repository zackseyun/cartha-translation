  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἶτα λέγει τῷ Θωμᾷ· Φέρε τὸν δάκτυλόν σου ὧδε καὶ ἴδε τὰς χεῖράς μου, καὶ φέρε τὴν χεῖρά σου καὶ βάλε εἰς τὴν πλευράν μου, καὶ μὴ γίνου ἄπιστος ἀλλὰ πιστός.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/027.yaml
  text: Then he said to Thomas[a], “Bring your finger here and see my hands, and bring your hand and put it into my side, and do not become unbelieving, but believing.”
translation:
  language: sw
  text: Kisha akamwambia Tomaso, “Leta kidole chako hapa, uone mikono yangu. Leta mkono wako, uuweke katika ubavu wangu. Usiwe asiyeamini, bali uwe anayeamini.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Usiwe asiye mwaminifu, bali uwe mwaminifu.” Vivumishi vya Kigiriki vinaweza kuwa na maana yoyote kati ya hizi, lakini katika muktadha huu tofauti hiyo inalenga hasa imani ya Tomaso kwa Yesu aliyefufuka.
    reason: Usomaji mbadala unaohifadhi upana wa maana wa ἄπιστος na πιστός.
lexical_decisions:
- source_word: εἶτα
  choice: Kisha
  rationale: Inaonyesha mfuatano wa matukio kwa Kiswahili cha kawaida na cha simulizi.
- source_word: λέγει
  choice: akamwambia
  rationale: Ingawa Kigiriki kinatumia wakati uliopo wa kihistoria, wakati uliopita wa kisimulizi ni wa kawaida katika Kiswahili; kiambishi cha mtendewa kinadhihirisha kuwa maneno yanaelekezwa kwa Tomaso.
- source_word: Φέρε
  choice: Leta
  rationale: Inahifadhi maana ya msingi ya kuleta na marudio ya amri hiyo kwa kidole na mkono.
- source_word: δάκτυλόν σου ὧδε
  choice: kidole chako hapa
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida, huku “hapa” ikihifadhi maana elekezi ya ὧδε.
- source_word: ἴδε
  choice: uone
  rationale: Inatoa amri ya kuona kwa Kiswahili cha kawaida bila kutumia lugha ya kizamani.
- source_word: τὰς χεῖράς μου
  choice: mikono yangu
  rationale: Inahifadhi wingi wa neno la asili.
- source_word: βάλε εἰς τὴν πλευράν μου
  choice: uutie ubavuni mwangu
  rationale: “Uutie” hutoa maana ya kuweka au kuingiza, na “ubavuni mwangu” ni usemi wa kawaida unaoonyesha sehemu ya upande wa mwili wa Yesu.
- source_word: μὴ γίνου
  choice: Usiwe
  rationale: Ni amri hasi ya kawaida na yenye hadhi katika Kiswahili; haiongezi wazo la kwamba Tomaso lazima aache hali iliyokuwa imekwisha kudumu.
- source_word: ἄπιστος
  choice: asiyeamini
  rationale: Muktadha unahusu kutokuamini ushuhuda wa kufufuka kwa Yesu; uchaguzi huu unaweka wazi kiini hicho.
- source_word: πιστός
  choice: anayeamini
  rationale: Inalingana kwa uwazi na “asiyeamini” na inalenga imani kwa Yesu aliyefufuka, huku maana mbadala ya uaminifu ikihifadhiwa katika tanbihi.
theological_decisions:
- issue: Tofauti kati ya ἄπιστος na πιστός katika himizo la Yesu kwa Tomaso
  choice: asiyeamini / anayeamini
  alternative: asiye mwaminifu / mwaminifu
  rationale: Muktadha wa karibu unahusu Tomaso kutokuamini ushuhuda kwamba Yesu amefufuka mpaka aone na kugusa. Hata hivyo, vivumishi vya Kigiriki vinaweza pia kueleza kutokuwa mwaminifu na kuwa mwaminifu, hivyo uwezekano huo umetajwa katika tanbihi badala ya kufutwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Marudio ya “Leta” yamehifadhiwa kwa sababu yapo katika Kigiriki; sentensi zimegawanywa kwa ufasaha bila kubadili mfuatano wa amri.
