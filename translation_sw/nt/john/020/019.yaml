id: JHN.20.19
reference: John 20:19
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Οὔσης οὖν ὀψίας τῇ ἡμέρᾳ ἐκείνῃ τῇ ⸀μιᾷ σαββάτων, καὶ τῶν θυρῶν κεκλεισμένων ὅπου ἦσαν οἱ ⸀μαθηταὶ διὰ τὸν φόβον τῶν Ἰουδαίων, ἦλθεν ὁ Ἰησοῦς καὶ ἔστη εἰς τὸ μέσον, καὶ λέγει αὐτοῖς· Εἰρήνη ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/019.yaml
  text: So when it was evening on that day[a], the first day of the week, and the doors had been locked where the disciples were because of fear of the Jews, Jesus came and stood in the midst of them and said to them[b], “Peace to you.”
translation:
  language: sw
  text: Basi, jioni ilipofika siku ile, siku ya kwanza ya juma, milango ilikuwa imefungwa mahali walipokuwa wanafunzi kwa sababu ya kuwaogopa Wayahudi[a]. Yesu akaja, akasimama katikati yao, akawaambia, “Amani iwe kwenu.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au huenda “viongozi wa Kiyahudi” au “watu wa Yudea,” kutegemea jinsi neno la Kigiriki linavyoeleweka katika muktadha huu.
    reason: alternative_reading
  - marker: b
    text: Kigiriki kinasema kihalisi, “Amani kwenu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὔσης ... ὀψίας
  choice: ilipofika jioni
  rationale: Hutoa kwa Kiswahili cha kawaida kishazi cha wakati kinachowakilisha muundo wa Kigiriki wa genitivi huru bila kuwa mgumu.
- source_word: οὖν
  choice: Basi
  rationale: Huendeleza simulizi na kuonyesha uhusiano wake na yaliyotangulia kwa namna ya kawaida katika Kiswahili.
- source_word: τῇ ἡμέρᾳ ἐκείνῃ τῇ μιᾷ σαββάτων
  choice: siku ile, siku ya kwanza ya juma
  rationale: Huhifadhi marejeo ya siku ile na usemi wa Kiyohane unaomaanisha siku ya kwanza ya juma.
- source_word: τῶν θυρῶν κεκλεισμένων
  choice: milango ... ikiwa imefungwa
  rationale: Huwasilisha hali iliyotokana na kitendo kilichotangulia; ‘imefungwa’ ni ya kawaida na inaweza kuonyesha milango iliyofungwa kwa usalama bila kuongeza maelezo yasiyotajwa.
- source_word: ὅπου ἦσαν οἱ μαθηταὶ
  choice: mahali walipokuwa wanafunzi
  rationale: Hutaja mahali walipokuwa tu, bila kuongeza kuwa walikaa au walikusanyika.
- source_word: διὰ τὸν φόβον τῶν Ἰουδαίων
  choice: kwa sababu ya kuwaogopa Wayahudi
  rationale: Hutoa sababu kwa Kiswahili cha asili; kitenzi ‘kuwaogopa’ kinaweka wazi kwamba wanafunzi ndio waliokuwa na hofu.
- source_word: ἔστη εἰς τὸ μέσον
  choice: akasimama katikati yao
  rationale: Huhifadhi picha ya Yesu kusimama katikati ya wanafunzi.
- source_word: λέγει αὐτοῖς
  choice: akawaambia
  rationale: Wakati uliopo wa kihistoria wa Kigiriki umewasilishwa kwa wakati wa simulizi unaosomeka kwa urahisi katika Kiswahili.
- source_word: Εἰρήνη ὑμῖν
  choice: Amani iwe kwenu
  rationale: Ni salamu ya Kiswahili iliyo ya asili inayowasilisha maana ya maneno ya Kigiriki, ambayo kihalisi ni ‘Amani kwenu.’
theological_decisions:
- issue: Marejeo ya τῶν Ἰουδαίων katika Injili ya Yohana
  choice: Wayahudi katika maandishi makuu, pamoja na tanbihi yenye uwezekano wa maana ya kimuktadha
  alternative: viongozi wa Kiyahudi; Wayudea
  rationale: Neno la Kigiriki halisemi wazi ‘viongozi.’ Tafsiri kuu inadumisha upana wake, huku tanbihi ikionyesha kuwa katika muktadha linaweza kumaanisha hasa viongozi wa Kiyahudi au Wayudea na hivyo kuepuka kulifanya shtaka la jumla dhidi ya kabila lote.
- issue: Namna ya salamu Εἰρήνη ὑμῖν
  choice: Amani iwe kwenu
  alternative: Amani kwenu
  rationale: Chaguo kuu ni Kiswahili cha kawaida na chenye hadhi; tanbihi inadumisha muundo mfupi wa Kigiriki bila kuufanya kuwa tafsiri kuu iliyo ngumu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa urahisi. Muundo wa simulizi umetumiwa kwa ufasaha bila kuongeza kwamba wanafunzi walikuwa wamekusanyika au kufafanua jinsi Yesu alivyoingia.
