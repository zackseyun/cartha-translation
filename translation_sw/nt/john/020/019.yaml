  to: Basi, jioni ilipofika siku ile, siku ya kwanza ya juma, milango ilikuwa imefungwa mahali walipokuwa wanafunzi kwa sababu ya kuwaogopa Wayahudi[a]. Yesu akaja, akasimama katikati yao, akawaambia, “Amani iwe kwenu.”[b]
