base_translation:
  language: en
  yaml_path: translation/nt/john/020/023.yaml
  text: If you forgive the sins of any[a], they have been forgiven them; if you retain them[b], they have been retained.
translation:
  language: sw
  text: Mkisamehe dhambi za watu wowote[a], dhambi zao zimesamehewa; mkizishikilia[b], zimeshikiliwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa namna nyingine: “Mkiwasamehe watu wowote dhambi zao, wamesamehewa.” Kigiriki kina kauli za kutendwa katika wakati timilifu katika vishazi vyote viwili, jambo linaloweza kusisitiza tendo lililokamilika lenye matokeo yanayoendelea.'
    reason: lexical_alternative
  - marker: b
    text: Au “mkizibakiza.” Neno la Kigiriki linamaanisha kuzishika au kuzibakiza, kinyume na kuzisamehe.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄν τινων
  choice: watu wowote
  rationale: Muundo huu unaonyesha hali ya masharti yenye mhusika asiyeainishwa. Pamoja na vitenzi vya masharti “mkisamehe” na “mkizishikilia,” “watu wowote” ni Kiswahili cha kawaida kinachohifadhi maana hiyo.
- source_word: ἀφῆτε
  choice: mkisamehe
  rationale: Katika muktadha wa dhambi, ἀφίημι humaanisha kusamehe. Umbo la “mki-” linaonyesha sharti bila kuongeza maelezo kuhusu mamlaka au utaratibu wa msamaha.
- source_word: τὰς ἁμαρτίας
  choice: dhambi
  rationale: “Dhambi” ni neno la kawaida na lenye heshima kwa ἁμαρτίας. Katika Kiswahili halihitaji kibainishi kinacholingana na artikeli ya Kigiriki.
- source_word: ἀφέωνται
  choice: zimesamehewa
  rationale: Kauli ya kutendwa imehifadhiwa, na wakati timilifu wa Kiswahili unaonyesha tendo lililokamilika lenye matokeo yanayoendelea.
- source_word: αὐτοῖς
  choice: dhambi zao
  rationale: Uhusiano wa dhambi na watu unaonyeshwa kwa umilikishi wa kawaida wa Kiswahili. Hili huepuka usemi usio wa kawaida “zimesamehewa kwao” huku likihifadhi maana kwamba dhambi zao ndizo zinazosamehewa.
- source_word: κρατῆτε
  choice: mkizishikilia
  rationale: “Kushikilia” huhifadhi maana ya kubaki nazo au kutokuziachia, na pia upinzani wake na “kusamehe,” bila kuibadili moja kwa moja kuwa “kutokusamehe.”
- source_word: κεκράτηνται
  choice: zimeshikiliwa
  rationale: Kauli ya kutendwa na wakati timilifu vinalingana na kishazi cha kwanza na kuonyesha hali yenye matokeo yanayoendelea.
theological_decisions:
- issue: Je, maneno haya yaelezwe kuwa wanafunzi wenyewe wanafanya msamaha utokee, au kwamba kitendo chao kinalingana na tendo la Mungu?
  choice: 'Kauli za kutendwa zimehifadhiwa: “zimesamehewa” na “zimeshikiliwa.”'
  alternative: Kutaja wazi “Mungu amezisamehe/amezishikilia,” au kusema “watasamehewa/hawatasamehewa.”
  rationale: Kigiriki hakimtaji mtendaji wa kauli hizi waziwazi. Tafsiri haimtaji Mungu kwa nyongeza wala kubadili kauli timilifu kuwa wakati ujao, hivyo inadumisha mvutano na uwezekano wa maana uliomo katika matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Ulinganifu wa vishazi viwili na kauli za kutendwa umehifadhiwa bila kuongeza ufafanuzi wa kimadhehebu.
