  source_fidelity: Tafsiri inahifadhi muundo wa sharti usioainisha wahusika (ἄν τινων), kitu cha ‘dhambi,’ na ulinganifu wa kauli mbili. ‘Zimesamehewa’ na ‘zimeshikiliwa’ ni kauli za kutendwa katika umbo timilifu, zikitoa kwa usahihi hali ya tendo lililokamilika yenye matokeo yanayoendelea. Umilikishi katika ‘dhambi zao’ hutoa kwa njia ya kawaida ya Kiswahili uhusiano unaoonyeshwa na αὐτοῖς, bila kumtaja mtendaji wa msamaha.
  naturalness: 'Kiswahili ni sanifu, cha sasa, na kina mtiririko wa kawaida: “Mkisamehe dhambi za watu wowote, dhambi zao zimesamehewa; mkizishikilia, zimeshikiliwa.” Kurudiwa kwa ‘dhambi’ katika kishazi cha kwanza hufafanua kiima cha ‘zimesamehewa’; kiwakilishi -zi katika kishazi cha pili kina rejeo wazi kwa dhambi.'
