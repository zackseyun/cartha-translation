  text: λέγει αὐτῷ ὁ Ἰησοῦς· Ὅτι ἑώρακάς με πεπίστευκας; μακάριοι οἱ μὴ ἰδόντες καὶ πιστεύσαντες.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/029.yaml
  text: Jesus said to him, “Because you have seen me, you have believed? Blessed are those who have not seen and yet have believed.”
translation:
  language: sw
  text: Yesu akamwambia, “Kwa sababu umeniona, umeamini?[a] Wamebarikiwa wale ambao hawajaona na wameamini.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa sababu umeniona, umeamini.” Kigiriki kinaweza kueleweka kama swali au kama kauli.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: Yesu akamwambia
  rationale: Ingawa λέγει ni wakati wa sasa, ni wakati wa sasa wa kisimulizi; Kiswahili cha kawaida hutumia ‘akamwambia’ ili simulizi litiririke kwa kawaida. αὐτῷ inadokezwa na kiambishi ‘-mw-’.
- source_word: Ὅτι
  choice: Kwa sababu
  rationale: Hapa ὅτι inaeleweka kwa kawaida kuwa inaanzisha sababu inayohusisha kuona kwa Tomaso na kuamini kwake.
- source_word: ἑώρακάς με
  choice: umeniona
  rationale: Kauli timilifu ya Kigiriki inaonyesha tendo lililokamilika lenye matokeo ya sasa; wakati timilifu wa Kiswahili ‘umeniona’ unalihifadhi vizuri.
- source_word: πεπίστευκας
  choice: umeamini
  rationale: Wakati timilifu wa Kiswahili unawakilisha kauli timilifu ya Kigiriki na hali ya sasa ya imani iliyotokana na kuona.
- source_word: μακάριοι
  choice: Wamebarikiwa
  rationale: ‘Wamebarikiwa’ ni lugha ya kawaida, yenye heshima, inayofaa kwa tamko la heri na yenye uzito mkubwa kuliko ‘wana furaha’.
- source_word: οἱ μὴ ἰδόντες
  choice: wale ambao hawajaona
  rationale: Hili ni badiliko la kawaida la kirai nomino-shirikishi cha Kigiriki kuwa kishazi cha Kiswahili, huku kutokuona kukitangulia kuamini.
- source_word: καὶ πιστεύσαντες
  choice: lakini wameamini
  rationale: Ingawa καί kwa msingi ni ‘na’, hapa inaunganisha hali zinazotofautiana—kutokuona na kuamini. ‘Lakini’ huonyesha tofauti hiyo kwa Kiswahili cha asili bila kubadili hoja.
theological_decisions:
- issue: Nguvu ya kishazi cha kwanza cha Yesu
  choice: 'Kimetafsiriwa kama swali: ‘Kwa sababu umeniona, umeamini?’'
  alternative: 'Kauli: ‘Kwa sababu umeniona, umeamini.’'
  rationale: Muktadha unaweza kuonyesha swali la kukazia au karipio la upole, lakini hati za kale hazikuwa na alama za uakifishaji za kisasa. Kwa hiyo uwezekano wa kauli umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, ya kawaida na yenye heshima. Muundo wa simulizi umefanywa wa asili kwa Kiswahili, huku utata halisi wa uakifishaji katika kishazi cha kwanza ukihifadhiwa kwa tanbihi.
