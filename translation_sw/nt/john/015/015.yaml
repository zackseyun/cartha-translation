id: JHN.15.15
reference: John 15:15
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οὐκέτι ⸂λέγω ὑμᾶς⸃ δούλους, ὅτι ὁ δοῦλος οὐκ οἶδεν τί ποιεῖ αὐτοῦ ὁ κύριος· ὑμᾶς δὲ εἴρηκα φίλους, ὅτι πάντα ἃ ἤκουσα παρὰ τοῦ πατρός μου ἐγνώρισα ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/015.yaml
  text: I no longer call you servants[a], because the servant does not know what his master is doing. But I have called you friends[b], because I have made known to you everything that I heard from my Father.
translation:
  language: sw
  text: Siwaiti tena watumwa[a], kwa sababu mtumwa hajui anachofanya bwana wake[b]. Lakini nimewaita marafiki, kwa sababu nimewajulisha kila kitu nilichosikia kutoka kwa Baba yangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki doulos linaweza kumaanisha “mtumwa” au “mtumishi.” Hapa “watumwa” limetumiwa kwa sababu utofautishaji na marafiki unasisitiza hadhi ya kuwa chini ya mamlaka.
    reason: lexical_alternative
  - marker: b
    text: Neno la Kigiriki kyrios linaweza kutafsiriwa “Bwana” au “bwana.” Hapa linamaanisha bwana wa mtumwa katika mfano huu, si lazima cheo cha kimungu.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκέτι λέγω ὑμᾶς
  choice: Siwaiti tena
  rationale: Muundo huu wa kawaida wa Kiswahili unaonyesha wazi badiliko kutoka hali ya awali na kudumisha wakati wa sasa wa λέγω.
- source_word: δούλους / δοῦλος
  choice: watumwa / mtumwa
  rationale: Katika utofautishaji na marafiki, neno hili linaonyesha hadhi ya utegemezi na unyenyekevu chini ya mwenye mamlaka; “watumwa” lina nguvu hiyo kuliko “watumishi.”
- source_word: οἶδεν τί ποιεῖ
  choice: hajui anachofanya
  rationale: Tafsiri hii inadumisha maana ya kujua na tendo la sasa linaloendelea, huku ikiwa ya kawaida katika Kiswahili.
- source_word: αὐτοῦ ὁ κύριος
  choice: bwana wake
  rationale: Hapa κύριος humaanisha mwenye mamlaka juu ya mtumwa katika mfano wa kijamii, si lazima cheo cha kimungu.
- source_word: ὑμᾶς δὲ εἴρηκα φίλους
  choice: Lakini nimewaita marafiki
  rationale: “Nimewaita” huonyesha tangazo lililofanywa ambalo matokeo yake yanaendelea, na “marafiki” hudumisha utofautishaji wa moja kwa moja na watumwa.
- source_word: πάντα ἃ
  choice: kila kitu
  rationale: Ni usemi wa asili na wenye maana jumuishi kwa muundo huu wa Kigiriki.
- source_word: ἤκουσα παρὰ τοῦ πατρός μου
  choice: nilichosikia kutoka kwa Baba yangu
  rationale: “Kusikia” hudumisha maana ya kawaida ya ἀκούω, na “kutoka kwa” huonyesha Baba kuwa chanzo.
- source_word: ἐγνώρισα ὑμῖν
  choice: nimewajulisha
  rationale: Kitenzi hiki huwasilisha kwa ufupi tendo la kufanya jambo lijulikane kwao, pamoja na umuhimu wake unaoendelea katika muktadha.
theological_decisions:
- issue: Maana ya δοῦλος katika utofautishaji wa ufuasi na urafiki
  choice: watumwa
  alternative: watumishi
  rationale: Muktadha unasisitiza tofauti ya hadhi na kutofahamu mipango ya mwenye mamlaka. “Watumwa” hudumisha ukali wa uhusiano huo bila kuufanya kuwa huduma ya hiari.
- issue: Maana ya κύριος katika mfano wa bwana na mtumwa
  choice: bwana wake
  alternative: mkuu wake
  rationale: Hapa neno hilo ni la uhusiano wa kijamii katika mfano, si dai la moja kwa moja kuhusu cheo cha kimungu. “Bwana wake” ni la kawaida na linaendana na “mtumwa.”
- issue: Nguvu ya hali timilifu katika εἴρηκα
  choice: nimewaita
  alternative: niliwaita
  rationale: '“Nimewaita” linaonyesha tendo lililokamilika lenye matokeo yanayoendelea: wanafunzi sasa wana hadhi ya marafiki.'
- issue: Upeo wa πάντα ἃ
  choice: kila kitu nilichosikia
  alternative: mambo yote niliyosikia
  rationale: Tafsiri haipunguzi madai ya mstari wala kuyapanua kwa maelezo ya kitheolojia yasiyosemwa; inadumisha upeo wa kauli yenyewe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni rahisi kueleweka kwa wasomaji wa kawaida; “watumwa” limedumishwa kwa usahihi wa tofauti ya kijamii, na “bwana wake” limetumiwa kwa maana ya kimuktadha.
