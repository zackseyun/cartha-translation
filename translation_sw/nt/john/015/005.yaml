id: JHN.15.5
reference: John 15:5
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐγώ εἰμι ἡ ἄμπελος, ὑμεῖς τὰ κλήματα. ὁ μένων ἐν ἐμοὶ κἀγὼ ἐν αὐτῷ οὗτος φέρει καρπὸν πολύν, ὅτι χωρὶς ἐμοῦ οὐ δύνασθε ποιεῖν οὐδέν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/005.yaml
  text: I am the vine[a]; you are the branches. The one who remains in me, and I in him, bears much fruit[b], because apart from me you are not able to do anything.
translation:
  language: sw
  text: Mimi ndimi mzabibu; ninyi ni matawi. Anayekaa[a] ndani yangu, nami ndani yake[b], huyo huzaa matunda mengi, kwa sababu pasipo mimi hamwezi kufanya chochote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “anayedumu.” Kitenzi cha Kigiriki kinaweza kusisitiza kuendelea kubaki katika uhusiano.
    reason: lexical_alternative
  - marker: b
    text: Kigiriki kinatumia umoja wa kiume kwa maana inayowakilisha wote; kauli hii inamhusu mwanafunzi yeyote anayekaa ndani ya Yesu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄμπελος
  choice: mzabibu
  rationale: “Mzabibu” ni neno la kawaida la Kiswahili kwa mmea wa zabibu na linahifadhi sitiari ya Yesu bila maelezo ya ziada.
- source_word: κλήματα
  choice: matawi
  rationale: Katika muktadha wa mzabibu, neno hili humaanisha matawi au machipukizi; “matawi” ni la kawaida, wazi, na linaendeleza picha ya mzabibu.
- source_word: ὁ μένων
  choice: anayekaa
  rationale: Kitenzi μένω kinaonyesha kuendelea kubaki katika uhusiano. “Anayekaa” ni Kiswahili cha kawaida na chenye maana endelevu katika muktadha huu; uwezekano wa “anayedumu” umeonyeshwa katika tanbihi.
- source_word: ἐν ἐμοὶ ... ἐν αὐτῷ
  choice: ndani yangu ... ndani yake
  rationale: “Ndani” linahifadhi lugha yenye nguvu ya kuwamo kwa kila mmoja ndani ya mwenzake, badala ya kuilegeza kuwa “pamoja na.”
- source_word: κἀγὼ
  choice: nami
  rationale: “Nami” linawakilisha kwa ufupi na kwa kawaida maana ya “na mimi,” huku likihifadhi uhusiano wa pande mbili.
- source_word: φέρει καρπὸν πολύν
  choice: huzaa matunda mengi
  rationale: “Kuzaa matunda” ni msemo wa kawaida unaofaa sitiari ya mzabibu; “hu-” pia huonyesha jambo linalotokea kwa kawaida na kuendelea.
- source_word: χωρὶς ἐμοῦ
  choice: pasipo mimi
  rationale: “Pasipo mimi” linaonyesha kutengwa na Yesu au kutokuwa ndani yake, si kukosa msaada wake tu.
- source_word: οὐ δύνασθε ποιεῖν οὐδέν
  choice: hamwezi kufanya chochote
  rationale: Tafsiri hii inaeleza kutokuwa na uwezo, wala si katazo, na ni Kiswahili cha kawaida chini ya ukanushi.
theological_decisions:
- issue: Lugha ya Yohana kuhusu kuwamo kwa kila mmoja ndani ya mwenzake
  choice: “ndani yangu, nami ndani yake”
  alternative: “pamoja nami, nami pamoja naye”
  rationale: “Ndani” linaakisi ἐν na kuhifadhi kina na mvutano wa kitheolojia wa muungano wa Yesu na mwanafunzi bila kuufafanua kupita kiasi.
- issue: Nguvu ya jumla ya αὐτῷ iliyo katika umoja
  choice: “ndani yake”
  alternative: “ndani yao” au “ndani ya mtu huyo”
  rationale: “Yake” linahifadhi umoja wa Kigiriki kwa Kiswahili cha kawaida. Kwa kuwa Kiswahili hakionyeshi jinsia katika kiwakilishi hiki, tanbihi inaeleza kuwa kauli inamhusu mwanafunzi yeyote anayekaa ndani ya Yesu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “Mimi ndimi” unaendeleza msisitizo wa ἐγώ εἰμι, huku “pasipo mimi” na “hamwezi” vikihifadhi dai thabiti la kutokuwa na uwezo nje ya Yesu.
