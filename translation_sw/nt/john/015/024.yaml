  text: εἰ τὰ ἔργα μὴ ἐποίησα ἐν αὐτοῖς ἃ οὐδεὶς ἄλλος ⸀ἐποίησεν, ἁμαρτίαν οὐκ ⸀εἴχοσαν· νῦν δὲ καὶ ἑωράκασιν καὶ μεμισήκασιν καὶ ἐμὲ καὶ τὸν πατέρα μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/024.yaml
  text: If I had not done among them the works that no one else did[a], they would not have sin[b]; but now they have both seen and hated both me and my Father.
translation:
  language: sw
  text: Kama nisingefanya miongoni mwao matendo ambayo hakuna mtu mwingine aliyefanya, hawangekuwa na dhambi.[a] Lakini sasa wametuona na kutuchukia sisi wote wawili, mimi na Baba yangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hawangekuwa na hatia ya dhambi.” Kigiriki kinasema kwa maana ya moja kwa moja, “hawangekuwa na dhambi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἔργα
  choice: matendo
  rationale: “Matendo” ni neno la kawaida na lenye heshima linalohifadhi maana ya kazi au vitendo vya Yesu vinavyodhihirisha utambulisho na utume wake katika Injili ya Yohana.
- source_word: ἐποίησα ἐν αὐτοῖς
  choice: nisingefanya miongoni mwao
  rationale: Muundo wa masharti yasiyotimia unawakilishwa kwa Kiswahili cha sasa kwa “kama nisingefanya”; “miongoni mwao” huonyesha kwamba Yesu alitenda mbele yao na kati yao, si ndani yao.
- source_word: ἃ οὐδεὶς ἄλλος ἐποίησεν
  choice: ambayo hakuna mtu mwingine aliyefanya
  rationale: Tafsiri hii huhifadhi dai la upekee wa matendo ya Yesu bila kuongeza maelezo yasiyokuwamo katika matini.
- source_word: ἁμαρτίαν οὐκ εἴχοσαν
  choice: hawangekuwa na dhambi
  rationale: Hii huhifadhi kwa karibu nahau ya Kiyohana ya “kuwa na dhambi” badala ya kuifafanua moja kwa moja kuwa hatia au uwajibikaji.
- source_word: νῦν δὲ
  choice: Lakini sasa
  rationale: Maneno haya yanaonyesha wazi tofauti kati ya hali ya kudhaniwa na hali halisi iliyopo sasa.
- source_word: καὶ ἑωράκασιν καὶ μεμισήκασιν καὶ ἐμὲ καὶ τὸν πατέρα μου
  choice: sasa wameniona mimi na Baba yangu, na wametuchukia sisi wote wawili
  rationale: Muundo huu wa asili wa Kiswahili unaonyesha kwamba kuona na kuchukia kunawahusu Yesu na Baba yake. Kurudia kwa namna hii kunaondoa utata wa kisarufi huku kukihifadhi msisitizo wa jozi zote mbili.
theological_decisions:
- issue: Maana ya “hawangekuwa na dhambi” kuhusu hatia yao
  choice: Kudumisha usemi wa Kiyohana “kuwa na dhambi.”
  alternative: “hawangekuwa na hatia ya dhambi”
  rationale: Muktadha unaonyesha kwamba ufunuo uliotolewa kupitia matendo ya Yesu unaongeza uwajibikaji wao, lakini matini yenyewe inasema “kuwa na dhambi.” Tafsiri haipaswi kulifupisha mvutano huo wa kiteolojia kwa kulazimisha maana moja tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Nisingefanya” na “hawangekuwa” ni miundo ya kawaida inayoeleweka kuliko maumbo ya kale “nisingalifanya” na “wasingalikuwa.”
