  yaml_path: translation/nt/john/015/013.yaml
  text: 'No one has greater love than this: that someone lay down his life for his friends[a][b][c][d].'
translation:
  language: sw
  text: 'Hakuna aliye na upendo mkuu kuliko huu: mtu kuutoa uhai wake kwa ajili ya marafiki zake[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtu kuutoa uhai wake kwa niaba ya marafiki zake.”
    reason: lexical_alternative
  - marker: b
    text: Neno la Kigiriki linalotafsiriwa “uhai” linaweza pia kumaanisha “nafsi” au “mtu mwenyewe”; hapa linamaanisha uhai unaotolewa hadi kufa.
    reason: lexical_alternative
lexical_decisions:
- source_word: μείζονα ταύτης ἀγάπην
  choice: upendo mkuu kuliko huu
  rationale: Huhifadhi ulinganisho wa Kigiriki na kufanya ταύτης ielekeze mbele kwenye tendo linalofafanua upendo huo.
- source_word: οὐδεὶς ἔχει
  choice: Hakuna aliye na
  rationale: Ni usemi wa kawaida na wa asili wa Kiswahili unaowasilisha kauli hasi ya jumla.
- source_word: ἵνα τις
  choice: mtu kuutoa
  rationale: Katika muktadha huu ἵνα inaleta maudhui yanayofafanua 'huu,' huku τις ikiwa mhusika asiyeainishwa; muundo wa kitenzi-jina ni wa asili katika Kiswahili.
- source_word: τὴν ψυχὴν αὐτοῦ θῇ
  choice: kuutoa uhai wake
  rationale: ψυχή hapa ni uhai unaotolewa hadi kufa, na τίθημι pamoja na ψυχή hueleza kuutoa uhai kwa kujitoa mwenyewe.
- source_word: ὑπὲρ
  choice: kwa ajili ya
  rationale: Huwasilisha maana ya kufaidi au kutenda kwa manufaa ya wengine bila kulazimisha maana mahsusi ya 'badala ya.'
- source_word: τῶν φίλων αὐτοῦ
  choice: rafiki zake
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya φίλοι pamoja na kiwakilishi cha umilikaji.
theological_decisions:
- issue: Maana ya ψυχή katika kauli ya kujitoa
  choice: uhai
  alternative: nafsi
  rationale: Muktadha unazungumzia mtu kujitoa hadi kufa; 'uhai' huepuka kuingiza mgawanyo wa mwili na nafsi ambao si lengo la aya.
- issue: Nguvu ya ὑπέρ katika upendo wa kujitoa
  choice: kwa ajili ya
  alternative: kwa niaba ya; badala ya
  rationale: Kirai hiki huhifadhi maana ya kutenda kwa manufaa ya wengine bila kuamua kwamba aya hii pekee inadai wazi maana ya ubadilisho.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo 'mtu kuutoa' huhifadhi mhusika wa jumla bila kuweka jinsia, na 'uhai' ni wazi zaidi kuliko 'maisha' katika muktadha wa kuutoa uhai hadi kufa.
