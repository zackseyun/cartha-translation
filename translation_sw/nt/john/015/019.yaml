id: JHN.15.19
reference: John 15:19
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἰ ἐκ τοῦ κόσμου ἦτε, ὁ κόσμος ἂν τὸ ἴδιον ἐφίλει· ὅτι δὲ ἐκ τοῦ κόσμου οὐκ ἐστέ, ἀλλ’ ἐγὼ ἐξελεξάμην ὑμᾶς ἐκ τοῦ κόσμου, διὰ τοῦτο μισεῖ ὑμᾶς ὁ κόσμος.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/019.yaml
  text: If you were from the world[a], the world would love its own. But because you are not from the world, but I chose you out of the world, for this reason the world hates you.
translation:
  language: sw
  text: Kama mngekuwa wa ulimwengu[a], ulimwengu ungewapenda walio wake. Lakini kwa sababu ninyi si wa ulimwengu, bali mimi niliwachagua kutoka ulimwenguni, ndiyo maana ulimwengu unawachukia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mngetokana na ulimwengu.” Kirai cha Kigiriki ἐκ τοῦ κόσμου kinaweza kuonyesha chanzo au kuwa sehemu ya ulimwengu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τοῦ κόσμου
  choice: wa ulimwengu
  rationale: Katika kishazi kinachoeleza utambulisho au uhusiano, Kiswahili cha kawaida hutumia “wa ulimwengu.” Hii inahifadhi maana ya kuwa na ulimwengu kama chanzo au kuwa sehemu yake bila kudokeza tu mahali mtu alikotoka.
- source_word: κόσμος
  choice: ulimwengu
  rationale: “Ulimwengu” ni neno la kawaida na pana linalohifadhi matumizi ya Yohana bila kulifafanua kwa kuongeza wazo la “mfumo wa ulimwengu.”
- source_word: ἂν ... ἐφίλει
  choice: ungewapenda
  rationale: Muundo wa “kama ... unge-” unaonyesha hali isiyo ya kweli na tokeo lake kwa Kiswahili cha asili.
- source_word: τὸ ἴδιον
  choice: walio wake
  rationale: Kirai hiki cha Kiswahili kinarejelea wale walio wa ulimwengu bila kuongeza kwa uwazi zaidi ya Kigiriki neno kama “watu.”
- source_word: φιλέω
  choice: kupenda
  rationale: “Kupenda” ni tafsiri ya kawaida na ya moja kwa moja, nayo inadumisha utofauti mkali na “kuchukia.”
- source_word: ἐξελεξάμην
  choice: niliwachagua
  rationale: “Niliwachagua” huwasilisha kwa kawaida tendo lililokamilika la Yesu la kuwateua, bila kuongeza maana ya kimadhehebu kuhusu uchaguzi.
- source_word: ἐκ τοῦ κόσμου
  choice: kutoka ulimwenguni
  rationale: Baada ya kitenzi “niliwachagua,” “kutoka ulimwenguni” huonyesha kwa asili wazo la kuwatoa katika mazingira au kundi hilo.
- source_word: διὰ τοῦτο
  choice: ndiyo maana
  rationale: “Ndiyo maana” ni usemi wa kawaida wa Kiswahili unaoonyesha wazi sababu ya chuki ya ulimwengu.
- source_word: μισεῖ
  choice: unawachukia
  rationale: Wakati wa sasa katika Kiswahili unaonyesha hali inayoendelea, huku “kuchukia” kikihifadhi ukali wa kitenzi cha Kigiriki.
theological_decisions:
- issue: Maana ya “ulimwengu” katika muktadha wa Yohana
  choice: Kubakiza “ulimwengu” bila maelezo ya ziada katika matini kuu.
  alternative: “mfumo wa ulimwengu” au “jamii ya wanadamu inayompinga Mungu”
  rationale: Neno la Kigiriki lina upana wa kiteolojia katika Yohana. Kulifafanua ndani ya matini kungepunguza maana yake na kuingiza ufafanuzi usiosemwa wazi hapa.
- issue: Maana ya uchaguzi katika ἐξελεξάμην
  choice: “mimi niliwachagua kutoka ulimwenguni”
  alternative: Tafsiri yenye lugha nzito zaidi ya mfumo fulani wa mafundisho kuhusu uteuzi au kuamuliwa tangu awali
  rationale: Aya inasema wazi kwamba Yesu aliwachagua wanafunzi, lakini haisuluhishi mijadala ya baadaye kuhusu uteuzi. Tafsiri inahifadhi dai lenyewe bila kulipanua kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “Kama mngekuwa ... unge-” ni wa kawaida na wazi. Kirai “walio wake” kinadumisha ufupi wa Kigiriki, na “ninyi” kimetumiwa katika kishazi cha pili kusisitiza utofauti.
