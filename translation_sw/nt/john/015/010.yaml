id: JHN.15.10
reference: John 15:10
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐὰν τὰς ἐντολάς μου τηρήσητε, μενεῖτε ἐν τῇ ἀγάπῃ μου, καθὼς ἐγὼ ⸂τὰς ἐντολὰς τοῦ πατρός μου⸃ τετήρηκα καὶ μένω αὐτοῦ ἐν τῇ ἀγάπῃ.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/010.yaml
  text: If you keep my commandments, you will remain in my love, just as I have kept my Father's commandments and remain in his love.
translation:
  language: sw
  text: Mkizishika amri zangu, mtabaki katika upendo wangu, kama vile mimi nilivyozishika amri za Baba yangu na ninabaki katika upendo wake.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐὰν
  choice: Mki-
  rationale: Kiambishi cha sharti katika “mkizishika” kinawasilisha kwa kawaida sharti linaloletwa na ἐὰν pamoja na hali tegemezi.
- source_word: τὰς ἐντολάς μου
  choice: amri zangu
  rationale: “Amri” hudumisha nguvu ya maagizo yenye mamlaka ya ἐντολή na ni Kiswahili cha kawaida na chenye heshima.
- source_word: τηρήσητε
  choice: mkizishika
  rationale: “Kushika amri” huonyesha kuzitii na kuzidumisha, na pia huwezesha kudumisha uhusiano wa kileksia na τετήρηκα.
- source_word: μενεῖτε
  choice: mtabaki
  rationale: “Kubaki” ni neno la kawaida linalohifadhi wazo la kuendelea katika hali au uhusiano, muhimu katika matumizi ya μένω katika Yohana.
- source_word: ἐν τῇ ἀγάπῃ μου
  choice: katika upendo wangu
  rationale: Muundo wa moja kwa moja unahifadhi taswira ya upendo kama eneo la uhusiano ambamo mtu hubaki.
- source_word: καθὼς
  choice: kama vile
  rationale: Huonyesha kwa wazi ulinganisho kati ya mwenendo wa wanafunzi na mfano wa Yesu.
- source_word: τετήρηκα
  choice: nilivyozishika
  rationale: Muundo huu katika kifungu cha kulinganisha unaonyesha tendo la Yesu lililotimia na lenye matokeo yanayoendelea, huku ukihifadhi mzizi uleule wa “kushika.”
- source_word: τοῦ πατρός μου
  choice: za Baba yangu
  rationale: “Baba yangu” ni namna ya kawaida ya Kiswahili ya kuonyesha uhusiano wa umilikaji na hudumisha matumizi ya “Baba” kama cheo cha Mungu katika muktadha.
- source_word: μένω
  choice: ninabaki
  rationale: Wakati wa sasa unahifadhi hali inayoendelea na kurudia neno la msingi lililotafsiriwa “mtabaki.”
- source_word: αὐτοῦ ἐν τῇ ἀγάπῃ
  choice: katika upendo wake
  rationale: Kiwakilishi “wake” kinamrejelea Baba kwa uwazi na kuhifadhi ulinganifu na “katika upendo wangu.”
theological_decisions:
- issue: Uhusiano kati ya kushika amri na kubaki katika upendo wa Yesu
  choice: Kauli imetafsiriwa kama sharti halisi bila kueleza kwamba utiifu unastahili upendo au bila kupunguza sharti hilo kuwa ishara tu.
  alternative: Kufafanua utiifu kuwa njia ya kustahili upendo wa Mungu, au kuwa ushahidi tu usio na nguvu halisi ya sharti.
  rationale: Kigiriki kinaweka uhusiano wa sharti na kuulinganisha na Yesu kushika amri za Baba, lakini kifungu hakisuluhishi mijadala mipana kuhusu sifa, wokovu, au kudumu katika imani.
- issue: Maana ya ἀγάπη
  choice: upendo
  alternative: hisani
  rationale: “Upendo” ni neno la kawaida, la sasa, na lenye upana unaofaa kwa ἀγάπη, na linadumishwa katika sehemu zote mbili za mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Ulinganifu wa “mtabaki/ninabaki” na “upendo wangu/upendo wake” umehifadhiwa. Hakuna alama za tanbihi kwa sababu hakuna tanbihi inayohitajika katika mstari huu.
