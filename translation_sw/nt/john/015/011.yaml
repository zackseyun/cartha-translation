  text: ταῦτα λελάληκα ὑμῖν ἵνα ἡ χαρὰ ἡ ἐμὴ ἐν ὑμῖν ⸀ᾖ καὶ ἡ χαρὰ ὑμῶν πληρωθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/011.yaml
  text: I have spoken these things to you so that my joy may be in you[b][a], and your joy may be made full.
translation:
  language: sw
  text: Nimewaambia mambo haya ili furaha yangu iwe ndani yenu[a], na furaha yenu ikamilike[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “miongoni mwenu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “ijazwe kikamilifu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα
  choice: mambo haya
  rationale: Wingi wa kiwakilishi unaendelezwa kwa Kiswahili cha kawaida na kurejelea mambo ambayo Yesu amekwisha kusema.
- source_word: λελάληκα
  choice: nimewaambia
  rationale: Kauli timilifu ya Kigiriki inaonyeshwa kwa wakati timilifu wa Kiswahili. Katika muktadha huu, 'kuwaambia' ni ya asili zaidi kuliko 'kuzungumza nanyi' huku ikibaki katika maana ya mawasiliano ya Yesu kwa wanafunzi.
- source_word: ὑμῖν
  choice: -wa-
  rationale: Kiambishi cha yambwa '-wa-' kinaonyesha wazi kwamba Yesu aliwaambia watu wengi.
- source_word: ἵνα
  choice: ili
  rationale: '''Ili'' huonyesha kusudi au matokeo yaliyokusudiwa kwa lugha ya sasa na iliyo wazi.'
- source_word: ἡ χαρὰ ἡ ἐμὴ
  choice: furaha yangu
  rationale: Huhifadhi umilikaji wenye mkazo bila kufafanua kupita maandiko ikiwa ni furaha ya Yesu mwenyewe inayoshirikishwa au furaha anayoitoa.
- source_word: ἐν ὑμῖν
  choice: ndani yenu
  rationale: Huhifadhi maana kuu ya uwepo wa ndani, huku maana inayowezekana ya 'miongoni mwenu' ikitolewa katika tanbihi.
- source_word: ᾖ
  choice: iwe
  rationale: Hali ya utegemezi baada ya ἵνα inaonyeshwa kwa muundo wa kusudi 'ili ... iwe'.
- source_word: καὶ
  choice: na
  rationale: Kiunganishi rahisi kinachounganisha vipengele viwili vya kusudi.
- source_word: ἡ χαρὰ ὑμῶν
  choice: furaha yenu
  rationale: Tafsiri ya moja kwa moja na ya kawaida inayodumisha ulinganifu na 'furaha yangu'.
- source_word: πληρωθῇ
  choice: ikamilike
  rationale: Kitenzi hiki kinaweza kuonyesha kufanywa kamili au kujazwa. 'Ikamilike' ni cha asili pamoja na 'furaha' na huhifadhi wazo la kufikia ukamilifu bila kuongeza mhusika anayesababisha tendo.
theological_decisions:
- issue: Asili ya “furaha yangu” katika muktadha wa Yohana
  choice: furaha yangu
  alternative: furaha ninayowapa; furaha kunihusu
  rationale: Kigiriki kinasema tu 'furaha yangu.' Tafsiri haibainishi kama ni furaha ya Yesu mwenyewe inayoshirikishwa na waamini au furaha inayotokana na muungano naye.
- issue: Mahali au namna ya kuwapo kwa furaha ya Yesu
  choice: ndani yenu
  alternative: miongoni mwenu
  rationale: ἐν ὑμῖν inaweza kueleweka kibinafsi kama 'ndani yenu' au kijumuiya kama 'miongoni mwenu.' Maandishi makuu yanatumia maana ya ndani inayoendana na furaha yao kukamilika, lakini tanbihi inadumisha uwezekano mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa urahisi. Muundo ni mfupi na unaendeleza ulinganifu wa 'furaha yangu ... furaha yenu.' Alama zote za tanbihi zimewekwa baada ya vifungu vinavyohusika.
