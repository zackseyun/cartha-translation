  text: Αὕτη ἐστὶν ἡ ἐντολὴ ἡ ἐμὴ ἵνα ἀγαπᾶτε ἀλλήλους καθὼς ἠγάπησα ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/john/015/012.yaml
  text: 'This is my command: that you love one another just as I have loved you[a].'
translation:
  language: sw
  text: 'Hii ndiyo amri yangu: mpendane kama nilivyowapenda.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “Hii ndiyo amri yangu: mpendane jinsi nilivyowapenda.”'
    reason: Mbadala huu unaonyesha tafsiri nyingine ya kawaida ya καθὼς kwa “jinsi,” huku maana ya msingi ya ulinganisho ikibaki ileile.
lexical_decisions:
- source_word: Αὕτη ἐστὶν
  choice: Hii ndiyo
  rationale: Muundo huu wa Kiswahili unatambulisha kwa kawaida na kwa msisitizo amri hususa ambayo Yesu anaitaja.
- source_word: ἐντολὴ
  choice: amri
  rationale: “Amri” ni neno la kawaida, lenye hadhi, na linalohifadhi nguvu ya mamlaka ya neno la Kigiriki.
- source_word: ἡ ἐμὴ
  choice: yangu
  rationale: Kivumishi kimilikishi kinaonyesha kwamba amri hiyo inatoka kwa Yesu na ina mamlaka yake.
- source_word: ἵνα
  choice: ':'
  rationale: Hapa ἵνα inafafanua maudhui ya amri. Katika Kiswahili, nukta mbili huunganisha utambulisho wa amri na maudhui yake kwa njia ya asili bila kulazimisha kishazi cha kusudi.
- source_word: ἀγαπᾶτε
  choice: mpendane
  rationale: Kitenzi cha kutendeana huunganisha kwa ufasaha tendo la kupenda na kiwakilishi cha urejeshano ἀλλήλους; pia kinafaa kwa amri inayoelekezwa kwa kundi.
- source_word: ἀλλήλους
  choice: -ane katika “mpendane”
  rationale: Kiambishi cha kutendeana -ane ndicho njia ya kawaida ya Kiswahili ya kueleza “ninyi kwa ninyi” katika muktadha huu.
- source_word: καθὼς
  choice: kama
  rationale: “Kama” linaonyesha ulinganisho na kumweka upendo wa Yesu kuwa kielelezo cha upendo wao bila kuongeza maelezo yasiyomo katika matini.
- source_word: ἠγάπησα
  choice: nilivyowapenda
  rationale: Muundo “nilivyo-” unaendana kiasili na καθὼς na huhifadhi tendo la wakati uliopita la aoristi bila kulazimisha tofauti ya Kiswahili isiyohitajika kati ya “nilipenda” na “nimependa.”
- source_word: ὑμᾶς
  choice: -wa- katika “nilivyowapenda”
  rationale: Kiambishi cha yambwa -wa- kinawarejelea wanafunzi kama kundi.
theological_decisions:
- issue: Uwasilishaji wa lugha ya ἀγαπάω
  choice: penda
  alternative: fanya hisani
  rationale: “Penda” ni kisawe cha kawaida na sahihi katika Kiswahili, huhifadhi mwendelezo wa msamiati katika kifungu, na hakileti maana finyu au ya kizamani.
- issue: Nguvu na maudhui ya amri ya Yesu
  choice: 'Hii ndiyo amri yangu: mpendane kama nilivyowapenda.'
  alternative: Hii ni amri yangu, kwamba mpendane kama nilivyowapenda.
  rationale: Tafsiri iliyochaguliwa huhifadhi mamlaka ya maneno ya Yesu na ulinganisho unaoufanya upendo wake kuwa kielelezo, huku ikibaki ya asili katika Kiswahili.
- issue: Uhusiano unaoonyeshwa na καθὼς
  choice: kama
  alternative: kwa jinsi ileile nilivyowapenda
  rationale: “Kama” huhifadhi uwezekano wa kuelewa upendo wa Yesu kuwa kielelezo au kipimo bila kufafanua zaidi ya matini ya Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Mpendane” ni fupi na ya kawaida kuliko “mpendane ninyi kwa ninyi,” ambayo ingerudia maana ya kiambishi -ane. Alama ya tanbihi [a] imewekwa baada ya sentensi inayohusika.
