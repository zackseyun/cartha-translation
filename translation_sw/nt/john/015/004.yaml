id: JHN.15.4
reference: John 15:4
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: μείνατε ἐν ἐμοί, κἀγὼ ἐν ὑμῖν. καθὼς τὸ κλῆμα οὐ δύναται καρπὸν φέρειν ἀφ’ ἑαυτοῦ ἐὰν μὴ ⸀μένῃ ἐν τῇ ἀμπέλῳ, οὕτως οὐδὲ ὑμεῖς ἐὰν μὴ ἐν ἐμοὶ ⸀μένητε.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/004.yaml
  text: Remain in me[a], and I in you. Just as the branch is not able to bear fruit by itself unless it remains in the vine, so neither can you unless you remain in me.
translation:
  language: sw
  text: Kaeni ndani yangu[a], nami ndani yenu. Kama vile tawi lisivyoweza kuzaa matunda lenyewe lisipokaa katika mzabibu, vivyo hivyo nanyi hamwezi kuzaa matunda msipokaa ndani yangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Dumuni ndani yangu.” Kitenzi cha Kigiriki μένω kinaweza kueleza kukaa, kubaki, au kudumu.
    reason: lexical_alternative
lexical_decisions:
- source_word: μείνατε / μένῃ / μένητε
  choice: kaeni / likikaa / msipokaa
  rationale: Kitenzi “kaa” ni cha kawaida na cha asili katika Kiswahili, na katika muktadha huu huonyesha kuendelea kuwamo katika uhusiano huo. Kurudiwa kwake kunadumisha neno kuu la Kigiriki μένω katika aya nzima.
- source_word: ἐν ἐμοί
  choice: ndani yangu
  rationale: “Ndani yangu” huhifadhi taswira ya kuwamo au kuunganishwa, badala ya kuifanya iwe ukaribu wa kawaida tu kama “pamoja nami.”
- source_word: κἀγὼ ἐν ὑμῖν
  choice: nami ndani yenu
  rationale: Kigiriki hakina kitenzi kilichotajwa wazi katika kishazi hiki. Kiswahili kinaweza kuhifadhi ufupi na utata huo wa kisarufi bila kuongeza “nitakaa.”
- source_word: τὸ κλῆμα
  choice: tawi
  rationale: “Tawi” ni neno la kawaida na linaloeleweka kwa sehemu ya mzabibu inayoweza kuzaa matunda.
- source_word: οὐ δύναται καρπὸν φέρειν
  choice: lisivyoweza kuzaa matunda
  rationale: Huhifadhi wazi wazo la kutokuwa na uwezo na nahau ya kilimo ya kuzaa matunda.
- source_word: ἀφ’ ἑαυτοῦ
  choice: lenyewe
  rationale: Hueleza kwa Kiswahili cha kawaida kwamba tawi haliwezi kuzaa kwa uwezo wake lenyewe.
- source_word: ἐν τῇ ἀμπέλῳ
  choice: katika mzabibu
  rationale: Tafsiri hii huhifadhi taswira ya asili bila kuongeza maelezo kama “likiwa limeunganishwa na mzabibu.”
- source_word: οὕτως οὐδὲ ὑμεῖς
  choice: vivyo hivyo nanyi hamwezi kuzaa matunda
  rationale: Kigiriki kinaacha maneno “kuzaa matunda” yaeleweke kutokana na kishazi kilichotangulia. Kuyarudia katika Kiswahili hukamilisha sentensi kwa njia ya asili bila kubadili maana.
theological_decisions:
- issue: Maana ya μένω katika uhusiano wa Yesu na wanafunzi
  choice: kaa ndani
  alternative: dumu ndani
  rationale: “Kaa ndani” ni lugha ya sasa, ya kawaida na yenye hadhi, huku ikihifadhi wazo la kuendelea katika uhusiano wa ndani na Yesu. “Dumu” ni mbadala halali unaosisitiza mwendelezo zaidi.
- issue: Kishazi kifupi κἀγὼ ἐν ὑμῖν
  choice: nami ndani yenu
  alternative: nami nitakaa ndani yenu
  rationale: Kwa kuwa Kigiriki hakitaji kitenzi wazi, tafsiri inahifadhi kishazi hicho kifupi na haiamui kimya kimya kama ni amri, ahadi, au kauli inayotegemea kitenzi kilichotangulia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya kawaida, ya sasa na yenye hadhi. Muundo “nami ndani yenu” umeachwa kwa ufupi ili kuhifadhi ellipsisi ya Kigiriki, huku “kuzaa matunda” ikirudiwa mwishoni kwa uwazi wa Kiswahili.
