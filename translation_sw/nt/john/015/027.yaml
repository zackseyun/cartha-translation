  text: And you also testify[b][a], because you have been with me from the beginning.
translation:
  language: sw
  text: Nanyi pia mnashuhudia, kwa sababu mmekuwa pamoja nami tangu mwanzo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ὑμεῖς δὲ
  choice: Nanyi pia
  rationale: Muundo huu unaonyesha msisitizo juu ya wanafunzi na kuwaunganisha na Roho anayeshuhudia katika mstari uliotangulia. Kiswahili cha kawaida kingeweza kusema “nanyi,” lakini “pia” huweka wazi maana ya kwamba wao nao wanashuhudia.
- source_word: μαρτυρεῖτε
  choice: mnashuhudia
  rationale: Kitenzi cha wakati uliopo kina maana ya kutoa ushahidi au kuwa shahidi. “Mnashuhudia” ni lugha ya sasa, ya kawaida, na inadumisha uzito wa ushahidi bila kuifanya sentensi iwe ya kisheria kupita kiasi.
- source_word: ὅτι
  choice: kwa sababu
  rationale: 'Katika muktadha huu neno linaeleweka kwa kawaida kuwa linatoa sababu ya wanafunzi kushuhudia: wamekuwa pamoja na Yesu tangu mwanzo. Tafsiri ya “kwamba” inawezekana kisarufi, lakini si ya asili sana hapa.'
- source_word: ἀπ’ ἀρχῆς
  choice: tangu mwanzo
  rationale: Hii ni tafsiri ya asili ya Kiswahili kwa hali iliyoanza wakati uliopita na kuendelea. Inadumisha upeo wa “mwanzo” bila kuufafanua zaidi ndani ya matini.
- source_word: μετ’ ἐμοῦ
  choice: pamoja nami
  rationale: Hutoa kwa uwazi maana ya ushirika na uwepo wao katika kampuni ya Yesu.
- source_word: ἐστε
  choice: mmekuwa
  rationale: Ingawa kwa umbo ni wakati uliopo, pamoja na “tangu mwanzo” hali hii inaanzia zamani na kuendelea hadi wakati wa kusema. “Mmekuwa” ni Kiswahili cha asili kinachoonyesha hali hiyo inayoendelea.
theological_decisions:
- issue: Upeo wa “tangu mwanzo”
  choice: Kuacha usemi “tangu mwanzo” bila kuainisha mwanzo huo katika matini
  alternative: Kuutaja wazi kuwa mwanzo wa huduma ya hadharani ya Yesu au mwanzo wa uanafunzi wao
  rationale: Muktadha unaelekea kwa uwepo wa kihistoria wa wanafunzi pamoja na Yesu kama msingi wa ushuhuda wao, lakini matini yenyewe haisemi kwa kina mwanzo gani. Tafsiri inadumisha uwazi huo bila kuingiza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Nanyi pia” huhifadhi msisitizo wa kiwakilishi na uhusiano na ushuhuda wa Roho katika muktadha uliotangulia; “mmekuwa” huwasilisha hali inayoendelea tangu wakati uliopita.
