id: JHN.15.16
reference: John 15:16
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οὐχ ὑμεῖς με ἐξελέξασθε, ἀλλ’ ἐγὼ ἐξελεξάμην ὑμᾶς, καὶ ἔθηκα ὑμᾶς ἵνα ὑμεῖς ὑπάγητε καὶ καρπὸν φέρητε καὶ ὁ καρπὸς ὑμῶν μένῃ, ἵνα ὅ τι ἂν αἰτήσητε τὸν πατέρα ἐν τῷ ὀνόματί μου δῷ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/016.yaml
  text: You did not choose me[a], but I chose you and appointed you so that you should go and bear fruit, and that your fruit should remain, so that whatever you ask the Father in my name[c][b], he may give you.
translation:
  language: sw
  text: Si ninyi mlionichagua mimi,[a] bali ni mimi niliyewachagua ninyi na kuwaweka ili mwende, mzae matunda, na matunda yenu yadumu,[b] ili chochote mtakachomwomba Baba[c] kwa jina langu, awape.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mlioniteua mimi … niliyewateua ninyi.” Hapa “kuchagua” linafaa na halilazimishi matumizi ya istilahi maalumu ya kiteolojia.
    reason: lexical_alternative
  - marker: b
    text: Au, “yabaki.” Kitenzi hiki hutumiwa mara nyingi katika Yohana kwa maana ya kubaki, kuendelea kuwapo, au kudumu.
    reason: lexical_alternative
  - marker: c
    text: Kigiriki kinasema “Baba,” si “Baba yangu.”
    reason: textual_clarification
lexical_decisions:
- source_word: ἐξελέξασθε / ἐξελεξάμην
  choice: mlichagua / niliyewachagua
  rationale: ‘Kuchagua’ ni Kiswahili cha kawaida na cha asili kinachodumisha utofautishaji wa tendo la wanafunzi na hatua ya Yesu, bila kuingiza istilahi ya baadaye ya kiteolojia katika matini kuu.
- source_word: ἔθηκα
  choice: kuwaweka
  rationale: Kitenzi τίθημι kimsingi humaanisha kuweka. ‘Kuwaweka’ kinahifadhi picha pana ya Yesu kuwaweka wanafunzi kwa kusudi fulani bila kuifinya kuwa kuwekwa katika cheo rasmi; kusudi linaelezwa na kishazi kinachofuata.
- source_word: ἵνα
  choice: ili
  rationale: ‘Ili’ linaonyesha wazi kusudi la vishazi vyote viwili na kudumisha mwendo wa sentensi ya Kigiriki.
- source_word: ὑπάγητε
  choice: mwende
  rationale: ‘Mwende’ ni tafsiri pana, ya kawaida, inayoweza kuhusisha kwenda kutekeleza utume bila kuongeza neno lisilokuwapo katika Kigiriki.
- source_word: καρπὸν φέρητε
  choice: mzae matunda
  rationale: ‘Kuzaa matunda’ ni tamathali ya kawaida ya Kiswahili na inadumisha picha ya Kiyohana.
- source_word: μένῃ
  choice: yadumu
  rationale: Katika muktadha huu, ‘yadumu’ linaeleza kwamba matunda yanaendelea kuwapo. Tanbihi inadumisha uwezekano wa ‘yabaki,’ unaoakisi matumizi mapana ya μένω katika Yohana.
- source_word: ὅ τι ἂν αἰτήσητε
  choice: chochote mtakachomwomba
  rationale: Muundo wenye ἄν una upana usioainishwa, unaoelezwa kwa kawaida na ‘chochote.’ ‘Kumwomba’ linafaa kwa ombi linaloelekezwa kwa Baba.
- source_word: ἐν τῷ ὀνόματί μου
  choice: kwa jina langu
  rationale: Huu ni usemi wa asili wa Kiswahili unaohifadhi maana ya kiteolojia na kimahusiano bila kuifafanua kupita kiasi.
- source_word: δῷ
  choice: awape
  rationale: Kiima tegemezi cha Kiswahili baada ya ‘ili’ kinaakisi subjunktivu ya Kigiriki na nguvu ya kusudi/matokeo bila kuibadili kuwa ahadi rahisi ya wakati ujao.
- source_word: τὸν πατέρα
  choice: Baba
  rationale: Matini ya Kigiriki inasema ‘Baba,’ si ‘Baba yangu.’ Herufi kubwa inaonyesha matumizi ya cheo hicho kwa Mungu katika muktadha huu.
theological_decisions:
- issue: Uwezekano wa kusoma ἐξελεξάμην kama istilahi maalumu ya fundisho la uteule
  choice: ‘Ni mimi niliyewachagua ninyi’ katika muktadha wa uanafunzi na utume
  alternative: Kutumia istilahi ya kiteolojia kama ‘niliwateua’ ili kusisitiza fundisho la uteule
  rationale: Mstari unasisitiza hatua ya Yesu, lakini ‘kuchagua’ huhifadhi maana ya moja kwa moja ya kitenzi na haikulazimishi matini kuwa kauli ya mfumo fulani wa kiteolojia.
- issue: Maana ya ἔθηκα ὑμᾶς
  choice: ‘Kuwaweka’ kwa kusudi la kwenda na kuzaa matunda
  alternative: ‘Kuwateua’ au ‘kuwaweka rasmi’ katika cheo cha kanisa
  rationale: Tafsiri hii huhifadhi upana wa kitenzi cha Kigiriki na huepuka kuifanya kauli hiyo kuwa uteuzi wa cheo maalumu; kusudi la kuwekwa linafuata katika matini yenyewe.
- issue: Nguvu ya kishazi cha mwisho cha ἵνα
  choice: 'Kudumisha muundo wa kusudi/matokeo: ‘ili ... awape’'
  alternative: 'Kukifanya kuwa ahadi huru yenye nguvu ya wakati ujao: ‘atawapa’'
  rationale: Subjunktivu baada ya ἵνα huunganisha ombi hilo na kusudi la kuchaguliwa, kuwekwa, kwenda, na kuzaa matunda; ‘awape’ huhifadhi utegemezi huo wa kisintaksia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa sentensi unadumisha marudio na mfuatano wa kusudi katika Kigiriki, huku ukibaki wa kawaida kwa msomaji wa leo. ‘Si ninyi … bali ni mimi’ huhifadhi msisitizo wa viwakilishi vya Kigiriki; koma kabla ya alama [a] inafuata uhusiano wake na kitenzi ‘mlichagua.’
