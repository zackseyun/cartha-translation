  text: μνημονεύετε τοῦ λόγου οὗ ἐγὼ εἶπον ὑμῖν· Οὐκ ἔστιν δοῦλος μείζων τοῦ κυρίου αὐτοῦ· εἰ ἐμὲ ἐδίωξαν, καὶ ὑμᾶς διώξουσιν· εἰ τὸν λόγον μου ἐτήρησαν, καὶ τὸν ὑμέτερον τηρήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/020.yaml
  text: 'Remember the word that I said to you: ‘A servant is not greater than his master.’ If they persecuted me[a], they will also persecute you; if they kept my word[b], they will also keep yours.'
translation:
  language: sw
  text: 'Kumbukeni neno nililowaambia: “Mtumwa[a] si mkuu kuliko bwana wake.” Ikiwa walinitesa mimi, watawatesa ninyi pia; ikiwa walilishika neno langu[b], watalishika lenu pia.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mtumishi.” Neno la Kigiriki δοῦλος linaweza kumaanisha mtumwa au mtumishi kutegemea muktadha; hapa “mtumwa” limetumiwa kwa sababu ulinganisho na “bwana” unasisitiza hadhi ya aliye chini ya mamlaka.
    reason: lexical_alternative
  - marker: b
    text: Au “walilitii neno langu.” Katika Yohana, “kulishika neno” kunaweza kujumuisha kuupokea ujumbe wa Yesu na kuishi kwa kuutii.
    reason: lexical_alternative
lexical_decisions:
- source_word: μνημονεύετε
  choice: Kumbukeni
  rationale: Ni amri ya wakati uliopo kwa wingi, ikiwataka wanafunzi waendelee kukumbuka; “Kumbukeni” ni ya kawaida na huhifadhi nguvu ya amri.
- source_word: λόγου
  choice: neno
  rationale: Hapa λόγος inaelekeza kwenye kauli maalumu ambayo Yesu alikuwa amewaambia. “Neno” pia hudumisha ulinganifu na “neno langu” baadaye katika mstari.
- source_word: δοῦλος
  choice: mtumwa
  rationale: Katika kauli hii uhusiano wa hadhi na mamlaka kati ya δοῦλος na κύριος ndio msingi wa ulinganisho; “mtumwa” huhifadhi nguvu hiyo kuliko “mtumishi.”
- source_word: μείζων
  choice: mkuu kuliko
  rationale: Hueleza ulinganisho wa cheo au hadhi bila kuufanya kuwa suala la umuhimu pekee.
- source_word: κυρίου
  choice: bwana wake
  rationale: Katika jozi ya mtumwa na mwenye mamlaka juu yake, “bwana” ni tafsiri ya kawaida ya Kiswahili na haikulazimishi hapa kuwa jina la cheo cha kiungu.
- source_word: ἐδίωξαν / διώξουσιν
  choice: walinitesa / watawatesa
  rationale: Katika muktadha wa uadui dhidi ya Yesu na wanafunzi wake, kitenzi kina maana ya kuwatesa kwa sababu ya msimamo wao, si kuwafuatilia tu.
- source_word: ἐτήρησαν / τηρήσουσιν
  choice: walilishika / watalishika
  rationale: “Kulishika neno” huhifadhi upana wa τηρέω katika Yohana, unaoweza kujumuisha kulipokea, kulizingatia na kulitii.
- source_word: τὸν λόγον μου ... τὸν ὑμέτερον
  choice: neno langu ... lenu
  rationale: Huhifadhi ulinganifu wa moja kwa moja kati ya ujumbe wa Yesu na ule ambao wanafunzi wake watautangaza.
theological_decisions:
- issue: Maana ya δοῦλος katika ulinganisho wa hadhi
  choice: mtumwa
  alternative: mtumishi
  rationale: Kauli inategemea kutokulingana kwa hadhi kati ya δοῦλος na κύριος. “Mtumwa” huonyesha utegemezi na mamlaka ya bwana kwa uwazi zaidi, huku tanbihi ikitaja tafsiri mbadala.
- issue: Maana ya κύριος katika uhusiano na δοῦλος
  choice: bwana
  alternative: Bwana
  rationale: Hapa neno linamtaja mwenye mamlaka juu ya mtumwa katika kauli ya jumla, si lazima cheo cha Kristo; kwa hiyo herufi ndogo na maana ya kijamii zinafaa.
- issue: Upana wa τηρέω kuhusu neno la Yesu
  choice: kulishika neno
  alternative: kulitii neno
  rationale: “Kulishika” hudumisha mvutano wa maana kati ya kupokea au kuzingatia ujumbe na kuishi kwa kuutii, badala ya kuifunga maana katika utii peke yake.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa kauli umewekwa wazi na wa kawaida; “mimi” na “ninyi” zimetumiwa ili kuakisi msisitizo na ulinganifu wa Kigiriki. Alama [a] imewekwa baada ya “Mtumwa,” ambako tanbihi yake ya kileksika inahusika.
