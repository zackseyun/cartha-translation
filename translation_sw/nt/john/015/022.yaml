  yaml_path: translation/nt/john/015/022.yaml
  text: If I had not come and spoken to them[a], they would not have sin[c][b]; but now they have no excuse for their sin.
translation:
  language: sw
  text: Kama nisingekuja na kusema nao, wasingekuwa na dhambi[a]; lakini sasa hawana udhuru kwa dhambi yao.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wasingekuwa na hatia ya dhambi.” Kiyunani kinasema kihalisi, “wasingekuwa na dhambi.”
    reason: lexical_alternative
  - marker: b
    text: Au, “hawana kisingizio kuhusu dhambi yao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ μὴ ἦλθον καὶ ἐλάλησα αὐτοῖς
  choice: Kama sikuja na kusema nao
  rationale: Muundo wa ‘kama’ pamoja na vitenzi vya wakati uliopita huwasilisha hali ya kubuni iliyo kinyume na yaliyotokea; ‘kusema nao’ ni Kiswahili cha kawaida kwa λαλέω pamoja na kiwakilishi cha udativu.
- source_word: ἁμαρτίαν οὐκ εἴχοσαν
  choice: wasingekuwa na dhambi
  rationale: Huhifadhi kwa karibu usemi wa Kiyunani ‘hawangekuwa na dhambi’ na nguvu ya sharti, bila kuufasiri moja kwa moja kuwa kutokuwa na hatia.
- source_word: νῦν δὲ
  choice: lakini sasa
  rationale: Huonyesha tofauti ya wazi kati ya hali ya kubuni na hali halisi ya sasa.
- source_word: πρόφασιν οὐκ ἔχουσιν
  choice: hawana udhuru
  rationale: ‘Udhuru’ huwasilisha maana ya sababu ya kujitetea; ‘kisingizio’ pia kinawezekana lakini mara nyingi hudokeza sababu ya uongo.
- source_word: περὶ τῆς ἁμαρτίας αὐτῶν
  choice: kwa ajili ya dhambi yao
  rationale: Ni muundo wa kawaida wa Kiswahili baada ya ‘hawana udhuru’ na unaonyesha jambo ambalo udhuru huo ungehusu.
theological_decisions:
- issue: Je, ἁμαρτίαν οὐκ εἴχοσαν inamaanisha kutokuwa na dhambi kabisa au kutokuwa na hatia kuhusu kukataa ufunuo wa Yesu?
  choice: wasingekuwa na dhambi
  alternative: wasingekuwa na hatia ya dhambi
  rationale: Muktadha unahusu wajibu wao baada ya Yesu kuja na kusema nao, lakini maandishi ya Kiyunani yanasema kihalisi ‘kuwa na dhambi.’ Tafsiri kuu inadumisha mvutano huo bila kuamua kimadhehebu kwamba ni dhambi hii pekee au kutokuwa na dhambi kabisa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Kama sikuja’ ni muundo wa asili wa sharti lisilotimia; ‘udhuru’ huepuka uzito usio wa lazima wa ‘kisingizio’ huku tanbihi ikihifadhi uwezekano huo.
