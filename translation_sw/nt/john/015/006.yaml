  text: ἐὰν μή τις ⸀μένῃ ἐν ἐμοί, ἐβλήθη ἔξω ὡς τὸ κλῆμα καὶ ἐξηράνθη, καὶ συνάγουσιν αὐτὰ καὶ εἰς τὸ πῦρ βάλλουσιν καὶ καίεται.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/006.yaml
  text: If anyone does not remain in me[a], he is thrown out like the branch and dries up; and they gather them and throw them into the fire[b], and they are burned.
translation:
  language: sw
  text: Mtu yeyote asipobaki ndani yangu[a], hutupwa nje kama tawi na hukauka. Watu huyakusanya matawi hayo, huyatupa motoni[b], na huchomwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “asipodumu ndani yangu.” Kitenzi cha Kiyunani kina maana ya kubaki au kuendelea, nalo ni neno muhimu katika Injili ya Yohana.
    reason: lexical_alternative
  - marker: b
    text: Picha hii inaonya kuhusu kutengwa na kuungua, lakini mstari wenyewe hausemi kama anayeelezwa alipoteza uanafunzi wa kweli au kama uhusiano wake usio wa kweli umefunuliwa.
    reason: alternative_reading
lexical_decisions:
- source_word: μένῃ
  choice: kubaki
  rationale: Kitenzi hiki muhimu katika Injili ya Yohana kinaonyesha kuendelea katika uhusiano. “Kubaki” ni Kiswahili cha kawaida na huhifadhi wazo hilo bila kulifafanua kupita kiasi.
- source_word: ἐν ἐμοί
  choice: ndani yangu
  rationale: Huhifadhi kwa ukaribu sitiari ya uhusiano na muungano na Yesu; “kwangu” au “pamoja nami” kungepunguza nguvu ya kirai cha Kiyunani.
- source_word: ἐβλήθη ἔξω
  choice: hutupwa nje
  rationale: Wakati wa mazoea katika Kiswahili unafaa kwa sharti la jumla, huku kauli tendwa na picha halisi ya kutupwa nje zikihifadhiwa.
- source_word: ὡς τὸ κλῆμα
  choice: kama tawi
  rationale: Katika muktadha κλῆμα ni tawi la mzabibu. “Tawi” ni la asili na muktadha uliotangulia tayari unaweka wazi mzabibu.
- source_word: ἐξηράνθη
  choice: kukauka
  rationale: Hutoa maana halisi ya kuwa kavu au kunyauka katika picha ya tawi.
- source_word: συνάγουσιν
  choice: watu huyakusanya
  rationale: Nafsi ya tatu wingi ya Kiyunani ina watendaji wasiotajwa. Kiswahili cha asili hutumia “watu” bila kudai utambulisho wao.
- source_word: αὐτὰ
  choice: matawi hayo
  rationale: Kiwakilishi ni wingi na kinarejelea matawi ya aina hiyo; kurudia nomino huondoa utata wa upatanisho wa ngeli katika Kiswahili.
- source_word: εἰς τὸ πῦρ βάλλουσιν
  choice: huyatupa motoni
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kitendo cha kuyatupa matawi ndani ya moto.
- source_word: καίεται
  choice: nayo huungua
  rationale: Umbo la Kiyunani ni umoja, lakini baada ya kiwakilishi cha wingi linaweza kuirudisha picha kwenye tawi la mfano. Kiswahili hapa linafuata marejeo ya karibu ya matawi kwa wingi bila kuongeza wazo la kuteketezwa kabisa.
- source_word: τις
  choice: mtu yeyote
  rationale: Hutoa kwa kawaida sharti la jumla la Kiyunani na kuhifadhi nguvu ya umoja.
theological_decisions:
- issue: Iwapo onyo lifafanuliwe kuwa kuanguka kwa mwanafunzi wa kweli au kufunuliwa kwa uhusiano usio wa kweli
  choice: Onyo la moja kwa moja kwa kutumia sitiari bila ufafanuzi wa kimadhehebu
  alternative: Kulieleza wazi ama kama kupoteza uanafunzi wa kweli ama kama kufunuliwa kwa mtu ambaye hakuwahi kuunganishwa kwa kweli na Yesu
  rationale: Mstari unaonya kuhusu kutengwa na kuungua, lakini wenyewe hautatui mjadala wa baadaye kuhusu hali halisi ya mtu anayetajwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. “Ndani yangu” huhifadhi sitiari ya Yohana; sentensi ya pili imegawanywa ili isomeke kwa urahisi huku mfuatano wa picha ukidumishwa.
