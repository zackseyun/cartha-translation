base_translation:
  language: en
  yaml_path: translation/nt/john/015/026.yaml
  text: When the Advocate comes[a], whom I will send to you from the Father—the Spirit of truth[c][b], who proceeds from the Father—he will testify about me.
translation:
  language: sw
  text: Atakapokuja Mtetezi[a], ambaye mimi nitamtuma kwenu kutoka kwa Baba—Roho wa kweli, anayetoka kwa Baba[c]—yeye atatoa ushuhuda kunihusu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Msaidizi,” “Mshauri,” “Mfariji,” au “Paraklito,” kwa Kigiriki παράκλητος.
    reason: lexical_alternative
  - marker: b
    text: Au “atanishuhudia.”
    reason: lexical_alternative
  - marker: c
    text: Kigiriki kinasema “anayetoka kwa Baba”; usemi huu ulikuja kuwa muhimu baadaye katika mijadala ya kiteolojia kuhusu Utatu.
    reason: cross_reference
lexical_decisions:
- source_word: Ὅταν ἔλθῃ
  choice: Atakapokuja
  rationale: Muundo huu wa Kiswahili unaeleza kwa kawaida tukio la wakati ujao linalotarajiwa, bila kulifanya kuwa tukio la kurudiwa-rudiwa.
- source_word: ὁ παράκλητος
  choice: Mtetezi
  rationale: Neno hili linaonyesha mtu anayesimama upande wa mwingine ili kumsaidia, kumwakilisha au kumtetea. “Mtetezi” linafaa pia katika muktadha wa kutoa ushuhuda, huku maana nyingine halali zikibainishwa katika tanbihi.
- source_word: ὃν ἐγὼ πέμψω ὑμῖν
  choice: ambaye mimi nitamtuma kwenu
  rationale: “Nitamtuma kwenu” linaonyesha wazi kwamba Mtetezi ndiye atakayetumwa na wanafunzi ndio watakaompokea; “mimi” linahifadhi mkazo wa ἐγώ.
- source_word: παρὰ τοῦ πατρός
  choice: kutoka kwa Baba
  rationale: Hii ni tafsiri ya kawaida na ya moja kwa moja ya παρά pamoja na hali ya umilikishi katika muktadha huu.
- source_word: τὸ πνεῦμα τῆς ἀληθείας
  choice: Roho wa kweli
  rationale: Huu ni usemi wa asili katika Kiswahili unaohifadhi uhusiano wa kimaana wa “Roho” na “kweli” bila kuufafanua kupita kiasi.
- source_word: ὃ παρὰ τοῦ πατρὸς ἐκπορεύεται
  choice: anayetoka kwa Baba
  rationale: “Anayetoka” ni wazi na wa asili katika Kiswahili, na unahifadhi mwelekeo wa asili kutoka kwa Baba. Tanbihi inabainisha kwamba kitenzi cha Kigiriki kina uzito maalumu wa maneno.
- source_word: ἐκεῖνος
  choice: yeye
  rationale: Kiwakilishi hiki kinahifadhi mkazo wa ἐκεῖνος na kumtaja Roho kwa namna ya kibinafsi, kama inavyofanya sentensi ya Kigiriki.
- source_word: μαρτυρήσει περὶ ἐμοῦ
  choice: atatoa ushuhuda kunihusu
  rationale: Usemi huu ni wa kawaida na unaeleweka, huku ukihifadhi maana ya ushahidi ya μαρτυρέω na maana ya περί, “kuhusu.”
theological_decisions:
- issue: Tafsiri ya παράκλητος katika muktadha unaomhusu Roho
  choice: Mtetezi
  alternative: Msaidizi, Mshauri, Mfariji, au Paraklete
  rationale: Hakuna neno moja la Kiswahili linalobeba maana zote za παράκλητος. “Mtetezi” linahifadhi dhana ya mtu anayesimama upande wa mwingine na linaendana na kazi ya kutoa ushuhuda katika muktadha wa karibu, bila kuingiza fundisho maalumu la dhehebu.
- issue: Kumtaja Roho kwa namna ya kibinafsi
  choice: anayetoka ... yeye atatoa ushuhuda
  alternative: inayotoka ... itatoa ushuhuda
  rationale: Ingawa πνεῦμα ni nomino ya jinsia ya kati katika sarufi ya Kigiriki, mstari unatumia ἐκεῖνος ya jinsia ya kiume na kumwonyesha Roho/Mtetezi akitenda kibinafsi. Kiswahili pia hutumia ngeli ya mtu kwa “Roho.”
- issue: Tafsiri ya ἐκπορεύεται
  choice: anayetoka kwa Baba
  alternative: anayekuja kutoka kwa Baba; anayeendelea kutoka kwa Baba
  rationale: “Anayetoka” ni wa asili na mwaminifu kwa maana ya msingi bila kulazimisha ufafanuzi wa baadaye wa kiteolojia. Tanbihi inalinda umuhimu wa usemi wa Kigiriki na kuacha mvutano wa kiteolojia bila kuutatua kimyakimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Mistari mirefu imetenganishwa kwa vistari virefu ili kuweka wazi maelezo yanayomtambulisha Roho bila kubadili uhusiano wa vifungu.
