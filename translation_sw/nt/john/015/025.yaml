  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀλλ’ ἵνα πληρωθῇ ὁ λόγος ὁ ⸂ἐν τῷ νόμῳ αὐτῶν γεγραμμένος⸃ ὅτι Ἐμίσησάν με δωρεάν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/025.yaml
  text: 'But this happened so that the word written in their Law might be fulfilled: ‘They hated me without cause.’[a][b][c]'
translation:
  language: sw
  text: 'Lakini hayo yalitukia ili neno lililoandikwa katika Sheria yao litimie: “Walinichukia bila sababu.”[a][b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata muundo wa Kigiriki kwa karibu zaidi, “Lakini ili neno lililoandikwa katika Sheria yao litimie.” Kigiriki hakitaji wazi kishazi kikuu; “hayo yalitukia” kimedokezwa na muktadha.
    reason: lexical_alternative
  - marker: b
    text: Hapa “Sheria yao” inatumika kwa maana pana ya Maandiko ya Kiyahudi; nukuu hii inatoka katika Zaburi (ling. Zab 35:19; 69:4).
    reason: cross_reference
  - marker: c
    text: Au, “pasipo sababu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Lakini
  rationale: Kiunganishi hiki kinaonyesha tofauti na kauli iliyotangulia. ‘Lakini’ ni tafsiri ya kawaida na ya moja kwa moja katika Kiswahili.
- source_word: ἵνα πληρωθῇ
  choice: ili ... litimie
  rationale: Muundo huu unaweza kueleza kusudi au matokeo. ‘Ili ... litimie’ huhifadhi lugha ya utimilifu wa Maandiko bila kufafanua kupita kiasi uhusiano huo.
- source_word: ὁ λόγος
  choice: neno
  rationale: Hapa λόγος ni kauli maalumu ya Maandiko. ‘Neno’ linafaa katika mtindo wa kunukuu Maandiko na halirejelei moja kwa moja matumizi ya kiteolojia ya ‘Neno’ katika utangulizi wa Yohana.
- source_word: ἐν τῷ νόμῳ αὐτῶν γεγραμμένος
  choice: lililoandikwa katika Sheria yao
  rationale: Huhifadhi maana ya kitu ambacho kimeandikwa na kinaendelea kusimama katika maandishi. ‘Yao’ hudumisha mtazamo wa kisarufi na wa kimazungumzo wa Yesu kwa wapinzani wake.
- source_word: νόμῳ
  choice: Sheria
  rationale: Ingawa nukuu inatoka katika Zaburi, νόμος hapa inaweza kutumiwa kwa maana pana ya Maandiko ya Kiyahudi. ‘Sheria’ huhifadhi neno la Kigiriki, huku tanbihi ikifafanua matumizi yake mapana.
- source_word: ὅτι
  choice: ':'
  rationale: Hapa ὅτι huanzisha yaliyomo katika neno la Maandiko. Nukta mbili ni njia ya asili ya Kiswahili ya kuanzisha nukuu hiyo.
- source_word: Ἐμίσησάν με
  choice: Walinichukia
  rationale: Kitenzi cha wakati uliopita kimetafsiriwa kwa wakati uliopita wa Kiswahili, kama inavyofaa katika nukuu hii.
- source_word: δωρεάν
  choice: bila sababu
  rationale: Katika muktadha huu neno linamaanisha chuki isiyo na msingi au sababu. ‘Bila sababu’ ni wazi na ya kawaida katika Kiswahili cha sasa kuliko ‘bure,’ ambalo lina maana nyingine pia.
theological_decisions:
- issue: Maana ya ‘Sheria yao’ wakati nukuu inatoka katika Zaburi
  choice: Kutafsiri νόμος kuwa ‘Sheria’ na kueleza katika tanbihi kwamba hapa inaweza kumaanisha Maandiko ya Kiyahudi kwa upana.
  alternative: Kutafsiri moja kwa moja kuwa ‘Maandiko’ ili maana pana iwe wazi katika matini kuu.
  rationale: Matini ya Kigiriki inasema νόμος, kwa hiyo ‘Sheria’ huhifadhi umbo la chanzo na mvutano unaotokana na nukuu kutoka Zaburi. Tanbihi huzuia msomaji asiielewe kuwa vitabu vya sheria pekee.
- issue: Kukamilisha kishazi cha Kigiriki kilichoachwa bila kishazi kikuu dhahiri
  choice: Kuongeza ‘hayo yalitukia’ kwa ajili ya Kiswahili cha kawaida na kinachoeleweka.
  alternative: 'Kuacha muundo wa karibu zaidi na Kigiriki: ‘Lakini ili neno ... litimie.’'
  rationale: Kigiriki kinategemea muktadha uliotangulia. Nyongeza hii huweka wazi jambo lililodokezwa bila kuingiza dai jipya la kiteolojia; tanbihi inaonyesha umbo rasmi zaidi.
- issue: Uhusiano wa kusudi na matokeo katika ἵνα πληρωθῇ
  choice: Kutumia ‘ili ... litimie,’ huku bila kueleza zaidi namna chuki ya wapinzani inavyohusiana na utimilifu wa Maandiko.
  alternative: Kutumia ‘hivyo ... likatimia’ ili kusisitiza zaidi matokeo.
  rationale: ἵνα pamoja na kitenzi tegemezi inaweza kubeba wazo la kusudi au matokeo. Tafsiri iliyochaguliwa huhifadhi lugha ya utimilifu bila kutatua mvutano huo kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi na chenye hadhi. Sentensi imeundwa kwa mtiririko wa kawaida wa Kiswahili huku ikihifadhi istilahi ‘Sheria,’ lugha ya utimilifu, na sauti ya nukuu ya Maandiko.
