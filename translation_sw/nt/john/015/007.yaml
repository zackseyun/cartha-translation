  text: ἐὰν μείνητε ἐν ἐμοὶ καὶ τὰ ῥήματά μου ἐν ὑμῖν μείνῃ, ὃ ἐὰν θέλητε ⸀αἰτήσασθε καὶ γενήσεται ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/john/015/007.yaml
  text: If you remain in me and my words remain in you[a], ask whatever you want[b], and it will be done for you.
translation:
  language: sw
  text: Mkikaa ndani yangu na maneno yangu yakikaa ndani yenu[a], ombeni chochote mtakachotaka[b], nalo mtatendewa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mkidumu ndani yangu ... maneno yangu yakidumu ndani yenu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “chochote mnachotamani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μείνητε / μείνῃ (μένω)
  choice: mkikaa / yakikaa
  rationale: Kitenzi “kukaa” kinawasilisha kuendelea kuwapo katika uhusiano, na kurudiwa kwake kunahifadhi urudiaji wa Kigiriki katika kauli zote mbili.
- source_word: ἐν ἐμοὶ / ἐν ὑμῖν
  choice: ndani yangu / ndani yenu
  rationale: “Ndani ya” huhifadhi lugha ya muungano na uhusiano ya Yohana kuliko kuilegeza kuwa “pamoja na.”
- source_word: τὰ ῥήματά μου
  choice: maneno yangu
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya usemi unaorejelea maneno au kauli za Yesu.
- source_word: ὃ ἐὰν θέλητε
  choice: chochote mnachotaka
  rationale: Huwasilisha kwa Kiswahili cha kawaida wigo wazi wa kitu kinachotakiwa bila kuongeza masharti yasiyotajwa hapa.
- source_word: αἰτήσασθε
  choice: ombeni
  rationale: Katika muktadha huu wa ombi kwa Mungu, “ombeni” ni ya kawaida na hubeba nguvu ya amri ya Kigiriki.
- source_word: γενήσεται ὑμῖν
  choice: nanyi mtatendewa
  rationale: Kauli hii ya kawaida huhifadhi maana ya jambo kutimizwa kwa ajili ya waombaji, bila kulazimisha kutaja mtendaji ambaye Kigiriki hakumtaji wazi.
theological_decisions:
- issue: Muundo wa sharti na ahadi katika kauli ya Yesu kuhusu maombi
  choice: Ahadi ya kuomba na kutendewa imewekwa chini ya sharti la kukaa ndani ya Yesu na maneno yake kukaa ndani ya wanafunzi.
  alternative: Kutafsiri kwa uhuru kana kwamba ahadi hiyo haina sharti.
  rationale: Sintaksia ya Kigiriki inaanza na sharti la ἐὰν; tafsiri inalihifadhi na haipanui ahadi nje ya sharti lililotajwa.
- issue: Mtendaji wa γενήσεται ὑμῖν
  choice: Kutumia “mtatendewa” bila kumtaja mtendaji wazi.
  alternative: “Mungu atawatendea” au “nitawatendea.”
  rationale: Kigiriki hakumtaji mtendaji wazi. Kauli tendwa huhifadhi uwazi huo na kuepuka kuingiza ufafanuzi wa kitheolojia usiotamkwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Kukaa ndani ya” huhifadhi picha kuu ya Yohana na urudiaji wa neno; “kudumu” limetolewa kama mbadala katika tanbihi. Alama zote za tanbihi zimewekwa katika matini.
