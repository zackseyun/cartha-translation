  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἐγώ εἰμι ἡ ἄμπελος ἡ ἀληθινή, καὶ ὁ πατήρ μου ὁ γεωργός ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/john/015/001.yaml
  text: I am the true vine[a], and my Father is the vinegrower.
translation:
  language: sw
  text: “Mimi ndimi mzabibu wa kweli, na Baba yangu ndiye mkulima.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mtunza mzabibu.” Neno la Kigiriki γεωργός humaanisha mtu anayelima au kutunza ardhi; katika muktadha wa mzabibu linaweza kumaanisha hasa mtu anayeutunza mzabibu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγώ εἰμι
  choice: Mimi ndimi
  rationale: Muundo huu wa Kiswahili ni wa asili na wenye msisitizo, hivyo unawakilisha kiwakilishi cha msisitizo Ἐγώ pamoja na εἰμι bila kuongeza maelezo yasiyokuwamo.
- source_word: ἄμπελος
  choice: mzabibu
  rationale: “Mzabibu” ni neno la kawaida na lililo wazi kwa mmea wa zabibu, na linahifadhi taswira ya sitiari.
- source_word: ἀληθινή
  choice: wa kweli
  rationale: “Wa kweli” huhifadhi maana za kuwa halisi, sahihi, au timilifu katika matumizi ya Yohana bila kulazimisha maana moja tu.
- source_word: πατήρ μου
  choice: Baba yangu
  rationale: Hutafsiri uhusiano huo moja kwa moja; herufi kubwa katika “Baba” huonyesha kuwa anayerejelewa ni Mungu bila kubadili maana ya chanzo.
- source_word: γεωργός
  choice: mkulima
  rationale: γεωργός humaanisha mtu anayelima au kutunza ardhi. “Mkulima” ni tafsiri ya kawaida, yenye hadhi, na pana kama neno la Kigiriki; maana mahususi ya mtunza mzabibu imehifadhiwa katika tanbihi.
theological_decisions:
- issue: Utambulisho wa kisitiari katika kauli ya Yesu “Mimi ndimi”
  choice: Kuhifadhi moja kwa moja sitiari “Mimi ndimi mzabibu wa kweli.”
  alternative: Mimi ndimi mzabibu halisi.
  rationale: “Wa kweli” huhifadhi mwangwi na kina cha matumizi ya ἀληθινός katika Yohana bila kufafanua sitiari au kuamua kimya kimya maana yake yote.
- issue: Jukumu la Baba kama γεωργός
  choice: mkulima
  alternative: mtunza mzabibu; mkulima wa mizabibu
  rationale: “Mkulima” huhifadhi upana wa neno la Kigiriki, huku muktadha wa mzabibu ukielekeza kwa kawaida kwenye shughuli ya kuutunza. Tafsiri mahususi zaidi imetajwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye hadhi na inayoeleweka kwa urahisi. Muundo “Mimi ndimi” huhifadhi msisitizo na mtindo wa kauli za Yohana, na “mkulima” ni wa kawaida kuliko istilahi ya kitaalamu.
