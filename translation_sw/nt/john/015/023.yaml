  text: ὁ ἐμὲ μισῶν καὶ τὸν πατέρα μου μισεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/023.yaml
  text: The one who hates me also hates my Father.
translation:
  language: sw
  text: Anayenichukia anamchukia pia Baba yangu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἐμὲ μισῶν
  choice: Anayenichukia mimi
  rationale: Kifungu chenye kibainishi na kitenzi-shirikishi kinamtaja mtu kwa tabia ya tendo hilo. Muundo huu ni wa kawaida katika Kiswahili na hudumisha maana ya mtu yeyote anayefanya hivyo; kuweka “mimi” wazi kunawakilisha ἐμέ.
- source_word: μισῶν / μισεῖ
  choice: anayenichukia / anamchukia
  rationale: Kitenzi μισέω humaanisha ‘chukia.’ Wakati wa sasa wa Kiswahili unafaa kwa kauli hii ya jumla, na mzizi uleule ‘-chukia’ katika sehemu zote mbili huhifadhi urudiaji wa Kigiriki.
- source_word: καὶ
  choice: pia
  rationale: Katika muktadha huu καί huonyesha kwamba chuki dhidi ya Yesu inamhusu Baba vilevile. ‘Pia’ ni ya kawaida na haitoi maana zaidi ya kiunganishi cha Kigiriki.
- source_word: τὸν πατέρα μου
  choice: Baba yangu
  rationale: Hii ndiyo njia ya kawaida ya kutafsiri nomino πατήρ pamoja na kiwakilishi μου. Herufi kubwa katika ‘Baba’ humtambulisha Mungu kama anayerejelewa katika uhusiano wake na Yesu.
theological_decisions:
- issue: Herufi kubwa katika “Baba” inapomrejelea Mungu
  choice: Baba yangu
  alternative: baba yangu
  rationale: Katika Injili ya Yohana, Yesu anaposema ‘Baba yangu’ anamrejelea Mungu kwa jina la uhusiano. Herufi kubwa humsaidia msomaji kutambua anayerejelewa bila kuongeza dai lisilokuwamo katika maandishi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Muundo mfupi unahifadhi ulinganifu na urudiaji wa sentensi ya Kigiriki.
