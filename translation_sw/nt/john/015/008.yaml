translation:
  language: sw
  text: 'Katika hili Baba yangu hutukuzwa: kwamba mzae matunda mengi na mwe wanafunzi wangu.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: Katika hili
  rationale: Inahifadhi rejeo lenye uwezekano wa kuelekea katika jambo linalofuata—kuzaa matunda mengi na kuwa wanafunzi—bila kulipanua kwa ufafanuzi usiomo katika Kigiriki.
- source_word: ἐδοξάσθη
  choice: hutukuzwa
  rationale: Kauli ya sasa ya Kiswahili huwasilisha hali ya Baba kutukuzwa katika jambo hili kwa lugha ya kawaida; umbo la aoristi ya Kigiriki hapa linaweza kueleza ukweli uliothibitishwa bila kulazimisha wakati uliopita katika tafsiri.
- source_word: καρπὸν πολὺν φέρητε
  choice: mzae matunda mengi
  rationale: Hii ni nahau ya kawaida ya Kiswahili inayohifadhi sitiari ya tunda na wingi wake.
- source_word: γένησθε ἐμοὶ μαθηταί
  choice: kuwa wanafunzi wangu
  rationale: Huhifadhi maana ya kuwa au kujionyesha kuwa wanafunzi wa Yesu, bila kuongeza wazo lisilotajwa wazi katika chanzo.
theological_decisions:
- issue: Uhusiano wa ἵνα na kutukuzwa kwa Baba
  choice: kwamba mzae matunda mengi na kuwa wanafunzi wangu
  alternative: ili mzae matunda mengi na kuwa wanafunzi wangu
  rationale: ἵνα inaweza kuonyesha maudhui/matokeo au kusudi. “Kwamba” hufuata muktadha na safu ya ushauri ya POB, ikieleza jambo ambalo ndani yake Baba hutukuzwa, bila kufuta kabisa hisia ya matokeo.
- issue: Maana ya γένησθε kuhusu uanafunzi
  choice: kuwa wanafunzi wangu
  alternative: mjionyeshe kuwa wanafunzi wangu
  rationale: Tafsiri haiongezi wazi dhana ya kuthibitisha uanafunzi, ambayo inawezekana kimuktadha lakini haijaandikwa moja kwa moja; pia haiamui mjadala wa kitheolojia kuhusu kama kuzaa matunda kunaanzisha au kunadhihirisha uanafunzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima lakini rahisi kueleweka. Mpangilio wenye nukta mbili umehifadhi uhusiano wa sentensi na mvutano wa kimaana wa ἵνα.
