translation:
  language: sw
  text: Haya ninawaamuru ili mpendane.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “Haya ninawaamuru: mpendane.” Kishazi cha Kigiriki kinaweza kuonyesha kusudi au kueleza kwa karibu yaliyomo katika amri.'
    reason: alternative_reading
lexical_decisions:
- source_word: ταῦτα
  choice: mambo haya
  rationale: Kiwakilishi hiki cha kuonyesha kiko katika wingi wa kati. “Mambo haya” huhifadhi wingi huo na kwa kawaida hurejelea maagizo yaliyotangulia.
- source_word: ἐντέλλομαι
  choice: ninawaamuru
  rationale: Kitenzi hiki kina maana ya kuamuru au kutoa maagizo. “Ninawaamuru” huhifadhi uzito wa amri na hali ya sasa ya usemi.
- source_word: ὑμῖν
  choice: -wa- katika “ninawaamuru”
  rationale: Kiambishi cha yambwa “-wa-” kinaonyesha kwamba Yesu anawaelekezea wanafunzi wake amri hiyo; katika Kigiriki kiwakilishi hiki ni cha wingi.
- source_word: ἵνα
  choice: ili
  rationale: “Ili” huonyesha kusudi au matokeo yaliyokusudiwa, huku tanbihi ikihifadhi uwezekano wa kishazi hicho kueleza yaliyomo katika amri.
- source_word: ἀγαπᾶτε
  choice: mpendane
  rationale: Muundo wa Kiswahili wa kutendeana unaonyesha kwamba upendo unaelekezwa kwa kila mmoja ndani ya kundi. Hali ya utegemezi baada ya “ili” inafaa kwa kitenzi tegemezi cha Kigiriki.
- source_word: ἀλλήλους
  choice: -an- katika “mpendane”
  rationale: Kiambishi cha kutendeana “-an-” huwasilisha kwa njia ya kawaida maana ya kiwakilishi cha Kigiriki, yaani “ninyi kwa ninyi.”
theological_decisions:
- issue: Uhusiano kati ya amri na kishazi kinachoanza kwa ἵνα
  choice: Kishazi kimetafsiriwa kwa “ili,” kikionyesha kusudi kwamba wanafunzi wapendane.
  alternative: '“Ninawaamuru mambo haya: mpendane.”'
  rationale: ἵνα kwa kawaida huonyesha kusudi au matokeo yaliyokusudiwa, lakini katika mtindo wa Yohana inaweza kukaribia kueleza yaliyomo katika amri. Tafsiri kuu huhifadhi muundo wa kusudi, na tanbihi huhifadhi uwezekano mwingine bila kuondoa mvutano wa kisarufi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Mambo haya” huhifadhi wingi wa Kigiriki; “mpendane” ni usemi wa kawaida na wazi wa upendo wa kila mmoja kwa mwenzake.
