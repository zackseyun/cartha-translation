  yaml_path: translation/nt/john/015/003.yaml
  text: Already you are clean because of the word that I have spoken to you[a].
translation:
  language: sw
  text: Ninyi tayari ni safi kwa sababu ya neno nililowaambia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa njia ya neno nililowaambia.”
    reason: διά inaweza kusisitiza sababu au njia/chombo; matini kuu inatoa maana ya kisababishi, huku tanbihi ikihifadhi uwezekano wa maana ya njia.
lexical_decisions:
- source_word: ἤδη
  choice: tayari
  rationale: Huonyesha hali ambayo tayari imeanza kuwapo; ni usemi wa kawaida na wa moja kwa moja katika Kiswahili.
- source_word: ὑμεῖς
  choice: ninyi
  rationale: Kiwakilishi kimeandikwa wazi katika Kigiriki kwa ajili ya msisitizo; “ninyi” kinahifadhi msisitizo huo.
- source_word: καθαροί
  choice: safi
  rationale: Kinahifadhi wazo la kusafishwa katika muktadha wa mzabibu na kupogolewa, bila kulibana kuwa istilahi maalumu ya kidini.
- source_word: διὰ τὸν λόγον
  choice: kwa sababu ya neno
  rationale: διά pamoja na hali ya accusative hapa kwa kawaida huonyesha sababu; tafsiri hii huhifadhi maana ya kisababishi huku tanbihi ikionyesha uwezekano wa kuelewa chombo.
- source_word: λόγον
  choice: neno
  rationale: Ni tafsiri ya moja kwa moja inayohifadhi matumizi ya Yohana; “ujumbe” au “mafundisho” yangekuwa ya kufafanua zaidi.
- source_word: ὃν λελάληκα ὑμῖν
  choice: nililowaambia
  rationale: Ni Kiswahili cha asili kinachoonyesha kwamba Yesu aliwaeleza neno hilo. Ingawa wakati timilifu wa Kigiriki unaonyesha matokeo yanayoendelea, hali hiyo inaeleweka katika tamko la sasa “ni safi.”
theological_decisions:
- issue: Asili ya usafi wa wanafunzi
  choice: Tamko limetafsiriwa kama hali ya sasa ya kuwa safi bila kuingiza istilahi maalumu ya kimafundisho.
  alternative: Kuufasiri wazi kuwa utakaso wa kisakramenti au tangazo la kuhesabiwa haki.
  rationale: Muktadha wa karibu unatumia mfano wa mzabibu na kupogoa, na Yesu anahusianisha usafi wao na neno lake. Tafsiri inadumisha mfano na uwazi wa kitheolojia wa maandiko.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Muundo “Ninyi tayari ni safi” unahifadhi msisitizo wa kiwakilishi cha Kigiriki na hali iliyopo tayari.
