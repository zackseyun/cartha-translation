  text: ἀλλὰ ταῦτα πάντα ποιήσουσιν ⸂εἰς ὑμᾶς⸃ διὰ τὸ ὄνομά μου, ὅτι οὐκ οἴδασιν τὸν πέμψαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/021.yaml
  text: But they will do all these things to you because of my name[a], because they do not know the one who sent me.
translation:
  language: sw
  text: Lakini watawafanyia mambo haya yote[a] kwa sababu ya jina langu, kwa sababu hawamjui yule aliyenituma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watafanya mambo haya yote dhidi yenu.” Kirai cha Kigiriki kinaweza kumaanisha matendo yanayoelekezwa kwa wanafunzi kwa uhasama.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Lakini
  rationale: Inaonyesha utofauti wenye mkazo na kauli iliyotangulia kwa njia ya kawaida katika Kiswahili.
- source_word: ταῦτα πάντα
  choice: mambo haya yote
  rationale: Inahifadhi nguvu ya kiashiria ταῦτα na wazo la ujumla katika πάντα.
- source_word: ποιήσουσιν εἰς ὑμᾶς
  choice: watawafanyia
  rationale: Kitenzi cha kutendea kinaonyesha kwamba matendo yanaelekezwa kwa wanafunzi, bila kuongeza wazi maana kali zaidi ya ‘dhidi yenu.’
- source_word: διὰ τὸ ὄνομά μου
  choice: kwa sababu ya jina langu
  rationale: Inaonyesha sababu kama ilivyo katika διά pamoja na hali ya kushutumiwa, huku ikihifadhi ‘jina’ kama uwakilishi wa utambulisho na mamlaka ya Yesu.
- source_word: οὐκ οἴδασιν
  choice: hawamjui
  rationale: Kauli hii ni ya kawaida na inaweza kubeba maana ya kutokuwa na ujuzi wa kimahusiano, si ukosefu wa taarifa tu.
- source_word: τὸν πέμψαντά με
  choice: yule aliyenituma
  rationale: Inatafsiri kirai cha kisifa chenye kibainishi bila kuongeza wazi jina ‘Baba,’ ambalo halipo katika mstari wa Kigiriki.
theological_decisions:
- issue: Anayerejelewa na ‘yule aliyenituma’
  choice: Rejeo kwa Baba limeachwa likiwa la kidokezo kama ‘yule aliyenituma.’
  alternative: ‘Baba aliyenituma’
  rationale: Muktadha wa Yohana humtambulisha anayerejelewa, lakini Kigiriki hakitumii nomino ‘Baba’ hapa; tafsiri haiongezi jina hilo.
- issue: Maana ya ‘jina langu’
  choice: Imehifadhiwa kama ‘jina langu.’
  alternative: ‘kwa sababu yangu’
  rationale: ‘Jina’ katika muktadha huu linawakilisha mtu, utambulisho na mamlaka ya Yesu; kulibadilisha kuwa ‘mimi’ kungeondoa taswira ya maandishi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Watawafanyia’ ni usemi wa kawaida unaohifadhi mwelekeo wa matendo kwa wanafunzi na kutoruhusu tafsiri kufunga kabisa uwezekano wa maana ya ‘dhidi yenu.’
