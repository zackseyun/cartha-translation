  text: You are my friends if you do what I command you[a].
translation:
  language: sw
  text: Ninyi ni rafiki zangu ikiwa mnafanya ninayowaamuru.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa muundo rasmi zaidi, “Ninyi ni rafiki zangu ikiwa mnafanya mambo ninayowaamuru.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: Ninyi
  rationale: Kiwakilishi cha nafsi ya pili wingi kimetajwa wazi na kuwekwa mwanzo katika Kigiriki kwa msisitizo; “Ninyi” huhifadhi msisitizo huo kwa Kiswahili cha kawaida.
- source_word: φίλοι μού
  choice: rafiki zangu
  rationale: φίλοι huonyesha uhusiano wa karibu, na μού huonyesha umilikaji au uhusiano; “rafiki zangu” ni tafsiri ya kawaida na ya asili.
- source_word: ἐστε
  choice: ni
  rationale: Kitenzi cha hali ya sasa kimetafsiriwa kwa kishirikishi cha Kiswahili “ni.”
- source_word: ἐὰν
  choice: ikiwa
  rationale: Huanzisha sharti pamoja na hali tegemezi; “ikiwa” huhifadhi maana ya sharti bila kuigeuza kuwa kauli ya wakati.
- source_word: ποιῆτε
  choice: mnafanya
  rationale: Kitenzi hiki hapa humaanisha kutenda au kutekeleza; wakati wa sasa wa Kiswahili unafaa katika sharti hili bila kusisitiza kupita kiasi mwendelezo.
- source_word: ἃ
  choice: ninalo-
  rationale: Kiwakilishi rejeshi cha wingi usio na jinsia kinarejelea mambo yaliyoamriwa. Kiswahili kwa kawaida hukusanya maana hiyo katika muundo “ninayowaamuru,” ingawa “mambo ninayowaamuru” ni rasmi zaidi.
- source_word: ἐγὼ
  choice: ni-
  rationale: Nafsi ya kwanza imeonyeshwa katika kiambishi cha kitenzi cha Kiswahili. Msisitizo wa kiwakilishi cha Kigiriki haujaongezewa neno “mimi,” ambalo lingesikika lenye mkazo mkubwa zaidi katika muktadha huu.
- source_word: ἐντέλλομαι
  choice: waamuru
  rationale: Kitenzi hiki ni kutoa agizo lenye mamlaka; “amuru” huhifadhi mamlaka ya kauli ya Yesu kuliko “fundisha” au “elekeza.”
- source_word: ὑμῖν
  choice: -wa-
  rationale: Yambwa ya nafsi ya pili wingi imejumuishwa kwa kawaida katika kitenzi “ninayowaamuru.”
theological_decisions:
- issue: Uhusiano wa kisharti kati ya urafiki na utiifu
  choice: “Ninyi ni rafiki zangu ikiwa mnafanya ninayowaamuru.”
  alternative: “Ninyi ni rafiki zangu mnapofanya ninayowaamuru.”
  rationale: Muundo wa Kigiriki ἐὰν pamoja na hali tegemezi huonyesha sharti kwa kawaida, si wakati tu. Tafsiri imehifadhi uhusiano huo bila kuamua kimyakimya masuala mapana ya kustahili, wokovu, au kudumu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Ninyi” huhifadhi msisitizo wa ὑμεῖς, huku “ninayowaamuru” ikiwa ya asili na inayoeleweka kwa wasomaji wa kawaida.
