base_translation:
  language: en
  yaml_path: translation/nt/john/015/002.yaml
  text: Every branch in me that does not bear fruit[a], he removes; and every branch that bears fruit[b], he prunes so that it may bear more fruit.
translation:
  language: sw
  text: Kila tawi lililo ndani yangu lisilozaa matunda, yeye huliondoa[a]; na kila tawi linalozaa matunda, yeye hulipogoa[b] ili lizae matunda mengi zaidi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “huchukua”; wengine huelewa αἴρει hapa kuwa “huliinua.”
    reason: alternative_reading
  - marker: b
    text: Kitenzi kilichotafsiriwa “hulipogoa” kinaweza pia kumaanisha “hulisafisha”; “kupogoa” linafaa katika mfano wa mzabibu, huku maana ya kusafisha ikitangulia lugha ya kuwa “safi” katika mstari unaofuata.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν κλῆμα
  choice: Kila tawi
  rationale: πᾶν pamoja na nomino ya umoja ina maana ya kugawa kwa kila mmoja; “kila tawi” ni Kiswahili cha kawaida na huhifadhi mkazo huo.
- source_word: ἐν ἐμοὶ
  choice: ndani yangu
  rationale: Tafsiri ya moja kwa moja huhifadhi lugha ya Kiyohana kuhusu uhusiano na Yesu bila kuongeza ufafanuzi kama “lililounganishwa nami.”
- source_word: μὴ φέρον καρπὸν
  choice: lisilozaa matunda
  rationale: Kirai cha kisifa kimetafsiriwa kwa muundo wa kawaida wa Kiswahili huku kikihifadhi wazo la kutokeza matunda.
- source_word: αἴρει
  choice: huliondoa
  rationale: Katika mfano wa mzabibu, maana ya kuondoa inafaa kwa kulinganisha tendo hili na kupogoa matawi yenye matunda; uwezekano wa “huliinua” umehifadhiwa katika tanbihi.
- source_word: καρπός
  choice: matunda
  rationale: Hili ni neno la kawaida katika kilimo na katika matumizi ya mfano; wingi wa Kiswahili unasikika kwa kawaida hapa.
- source_word: καθαίρει
  choice: hulipogoa
  rationale: Katika muktadha wa mzabibu, kupogoa ndio tendo la kilimo linalokusudiwa. Maana inayohusiana ya kusafisha, ambayo inaunganika na mstari unaofuata, imeelezwa katika tanbihi.
- source_word: ἵνα καρπὸν πλείονα φέρῃ
  choice: ili lizae matunda mengi zaidi
  rationale: “Ili” huonyesha kusudi la ἵνα, na “mengi zaidi” huwasilisha ulinganisho wa πλείονα kwa Kiswahili cha kawaida.
- source_word: αὐτό / αὐτὸ
  choice: -li- katika huliondoa/hulipogoa
  rationale: Kirejeshi cha Kigiriki kinachorejelea tawi kinawakilishwa kwa kiambishi cha yambwa cha ngeli ya LI-YA, kwa mujibu wa sarufi ya Kiswahili.
- source_word: καὶ πᾶν τὸ καρπὸν φέρον
  choice: na kila tawi linalozaa matunda
  rationale: Neno “tawi” limerudiwa kwa uwazi kwa sababu makala na kisifa cha Kigiriki vinarejelea κλῆμα iliyotangulia.
theological_decisions:
- issue: Maana ya αἴρει katika kishazi cha kwanza
  choice: yeye huliondoa
  alternative: yeye huliinua
  rationale: 'Muktadha wa karibu unatofautisha matendo mawili ya mtunza mzabibu: tawi lisilozaa huondolewa, na linalozaa hupogolewa ili liongeze matunda. Tafsiri hii haijaribu kuamua mjadala wa kiteolojia kuhusu uasi au kudumu katika imani; maana mbadala imehifadhiwa katika tanbihi.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo sambamba wa vishazi viwili umehifadhiwa; kiwakilishi “yeye” kimewekwa ili kuonyesha wazi mtenda anayerejelewa kutoka muktadha.
