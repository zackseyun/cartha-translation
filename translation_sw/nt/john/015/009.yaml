  text: καθὼς ἠγάπησέν με ὁ πατήρ, κἀγὼ ⸂ὑμᾶς ἠγάπησα⸃, μείνατε ἐν τῇ ἀγάπῃ τῇ ἐμῇ.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/009.yaml
  text: Just as the Father has loved me[a], I also have loved you; remain in my love.
translation:
  language: sw
  text: Kama vile Baba amenipenda[a], nami nimewapenda ninyi; dumuni katika upendo wangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “Kama vile Baba alivyonipenda, nami niliwapenda ninyi; dumuni katika upendo wangu.” Vitenzi vya Kigiriki viko katika aoristi na vinaweza kutafsiriwa kwa wakati uliopita; tafsiri kuu imetumia wakati timilifu wa Kiswahili ili kuonyesha umuhimu unaoendelea katika muktadha.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: Kama vile
  rationale: Inaonyesha ulinganisho kati ya upendo wa Baba kwa Yesu na upendo wa Yesu kwa wanafunzi wake kwa Kiswahili cha kawaida na wazi.
- source_word: ἠγάπησέν με
  choice: amenipenda
  rationale: Wakati timilifu wa Kiswahili unaonyesha tendo lililotokea lenye umuhimu unaoendelea katika muktadha, bila kudai kwamba aoristi ya Kigiriki yenyewe huonyesha mwendelezo.
- source_word: ὁ πατήρ
  choice: Baba
  rationale: Katika muktadha wa Yohana, ni jina la kumrejelea Mungu kama Baba wa Yesu; herufi kubwa inaonyesha matumizi hayo ya kijina.
- source_word: κἀγὼ
  choice: nami
  rationale: Huunganisha kishazi cha pili na cha kwanza na pia hukazia nafsi ya Yesu kwa njia ya asili katika Kiswahili.
- source_word: ὑμᾶς ἠγάπησα
  choice: nimewapenda ninyi
  rationale: Kiambishi -wa- kinaonyesha wazi wingi wa walengwa, na 'ninyi' hudumisha mkazo uliopo katika kiwakilishi cha Kigiriki. Wakati timilifu unaonyesha umuhimu unaoendelea wa upendo huo.
- source_word: μείνατε
  choice: dumuni
  rationale: Ni amri ya wingi iliyo wazi, yenye maana ya kuendelea au kubaki katika hali fulani; inafaa kwa lugha yenye hadhi na huhifadhi dhamira ya Yohana ya kudumu.
- source_word: ἐν τῇ ἀγάπῃ τῇ ἐμῇ
  choice: katika upendo wangu
  rationale: Huhifadhi kwa ufupi na kiasili wazo la kuwa au kudumu ndani ya upendo ulio wa Yesu.
theological_decisions:
- issue: Tafsiri ya ἀγάπη
  choice: upendo
  alternative: hisani
  rationale: '''Upendo'' ndiyo istilahi ya kawaida, wazi, na inayofaa katika Kiswahili cha sasa; ''hisani'' ingebadili au kupunguza maana katika muktadha huu.'
- issue: Nguvu ya kiaspekti ya ἠγάπησέν na ἠγάπησα
  choice: amenipenda / nimewapenda
  alternative: alinipenda / niliwapenda
  rationale: Timilifu ya Kiswahili inaeleza kwa asili matendo ya zamani yenye umuhimu wa sasa katika hotuba hii. Hata hivyo, aoristi za Kigiriki zinaweza pia kutafsiriwa kwa wakati uliopita, kwa hiyo uwezekano huo umehifadhiwa katika tanbihi.
- issue: Maana ya μένω katika amri
  choice: dumuni katika upendo wangu
  alternative: kaeni katika upendo wangu
  rationale: '''Dumuni'' huonyesha kwa uwazi kuendelea kubaki katika uhusiano huo bila kuingiza maelezo ya kimadhehebu; ''kaeni'' inawezekana lakini inaweza kusikika zaidi kama kuketi au kukaa mahali.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Ninyi' imetumiwa pamoja na kiambishi cha wingi ili kuhifadhi mkazo wa kiwakilishi cha Kigiriki, na 'dumuni' inaweka wazi kwamba amri inaelekezwa kwa watu wengi.
