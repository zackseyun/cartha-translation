  text: Εἰ ὁ κόσμος ὑμᾶς μισεῖ, γινώσκετε ὅτι ἐμὲ πρῶτον ⸀ὑμῶν μεμίσηκεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/018.yaml
  text: If the world hates you[a], know that it has hated me before you.
translation:
  language: sw
  text: Ikiwa ulimwengu unawachukia ninyi, jueni kwamba umenichukia mimi kabla ya kuwachukia ninyi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “umenichukia mimi kwanza kuliko ninyi.” Kigiriki hutumia “kwanza” pamoja na “ninyi” kuonyesha kwamba chuki dhidi ya Yesu ilitangulia.
    reason: lexical_alternative
lexical_decisions:
- source_word: κόσμος
  choice: ulimwengu
  rationale: Katika Yohana neno hili mara nyingi humaanisha wanadamu kwa ujumla, hasa katika upinzani wao dhidi ya Yesu na wafuasi wake. “Ulimwengu” ni tafsiri ya kawaida inayohifadhi upana na uzito wa kiteolojia bila kuongeza ufafanuzi usiotajwa wazi.
- source_word: μισεῖ
  choice: unawachukia
  rationale: Wakati uliopo wa Kigiriki unaeleza hali au jambo la kawaida. Kiswahili cha wakati uliopo kinafikisha maana hiyo kwa njia ya kawaida.
- source_word: γινώσκετε
  choice: jueni
  rationale: 'Umbo hili linaweza kueleweka kisarufi kama taarifa au amri, lakini katika muktadha linafaa zaidi kama himizo: “jueni.”'
- source_word: πρῶτον ... ὑμῶν
  choice: kabla yenu
  rationale: 'Muundo huu unaonyesha utangulizi wa wakati: ulimwengu ulimchukia Yesu kabla ya kuwachukia wanafunzi. “Kabla yenu” ni fupi, ya kawaida, na inahifadhi ulinganisho huo.'
- source_word: μεμίσηκεν
  choice: umenichukia
  rationale: Kauli timilifu ya Kigiriki inaonyesha tendo lililotokea na ambalo matokeo au umuhimu wake unaendelea. “Umenichukia” huhifadhi kwa kiasi kikubwa maana hiyo kuliko wakati uliopita wa kawaida.
- source_word: ἐμὲ
  choice: mimi
  rationale: Kiwakilishi cha Kigiriki kimetiliwa mkazo. Kutaja “mimi” baada ya kiambishi cha yambwa katika “umenichukia” kunahifadhi mkazo huo kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Maana ya κόσμος katika teolojia ya Yohana
  choice: Kubakiza “ulimwengu” bila kuipanua katika matini kuu
  alternative: mfumo wa ulimwengu; wanadamu wanaomwasi Mungu
  rationale: Muktadha unaonyesha upinzani dhidi ya Yesu na wanafunzi wake, lakini tafsiri pana zaidi ingeweka ufafanuzi wa kitheolojia ndani ya matini. “Ulimwengu” huhifadhi mvutano na upana wa neno la asili.
- issue: Nguvu ya γινώσκετε
  choice: 'Kuichukua kama himizo: “jueni”'
  alternative: “mnajua”
  rationale: Ingawa umbo la Kigiriki linaweza kuwa la taarifa au amri, mtiririko wa maneno baada ya kisharti unaunga mkono himizo, bila kuondoa kabisa uwezekano wa kisarufi wa usomaji mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo “kabla yenu” ni mfupi na wa kawaida; tanbihi inaeleza kwa uwazi zaidi uhusiano wa wakati katika Kigiriki.
