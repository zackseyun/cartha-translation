  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ὁ πατὴρ ἔχει ζωὴν ἐν ἑαυτῷ, οὕτως ⸂καὶ τῷ υἱῷ ἔδωκεν⸃ ζωὴν ἔχειν ἐν ἑαυτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/005/026.yaml
  text: For just as the Father has life in himself[b][a], so he also granted the Son to have life in himself.
translation:
  language: sw
  text: Kwa maana kama vile Baba alivyo na uzima ndani yake mwenyewe[a], vivyo hivyo pia alimpa[b] Mwana kuwa na uzima ndani yake mwenyewe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Uzima ndani yake mwenyewe” unaweza kueleweka kuwa uzima ulio katika nafsi yake mwenyewe. Tafsiri inahifadhi maneno ya Kiyunani badala ya kutumia istilahi ya kiteolojia “uzima wa kujitegemea.”
    reason: lexical_alternative
  - marker: b
    text: Au, “alimjalia.” Kitenzi cha Kiyunani ni neno la kawaida linalomaanisha “alitoa” au “alimpa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: Kwa maana kama vile
  rationale: “Kwa maana” huonyesha kazi ya ufafanuzi ya γάρ, na “kama vile” huanzisha ulinganisho wa ὥσπερ kwa Kiswahili cha kawaida.
- source_word: ὁ πατὴρ
  choice: Baba
  rationale: Ni jina la cheo linalomtaja Mungu katika muktadha wa Yohana; herufi kubwa huhifadhi matumizi hayo.
- source_word: ἔχει ζωὴν
  choice: ana uzima
  rationale: Ni tafsiri ya moja kwa moja ya kitenzi cha wakati uliopo pamoja na yambwa wake, bila kuongeza maana ya kiufundi.
- source_word: ζωὴν ἐν ἑαυτῷ
  choice: uzima ndani yake mwenyewe
  rationale: Huhifadhi kirai cha Kiyunani na msisitizo wa ἑαυτῷ bila kukibadili kuwa istilahi ya kiteolojia kama “uzima wa kujitegemea.”
- source_word: οὕτως καὶ
  choice: vivyo hivyo pia
  rationale: Hukamilisha muundo linganishi wa “kama vile ... vivyo hivyo” na kuhifadhi maana ya καί, “pia.”
- source_word: τῷ υἱῷ
  choice: Mwana
  rationale: Ni yambwa isiyo ya moja kwa moja ya ἔδωκεν na jina la cheo la Kristo katika muktadha huu.
- source_word: ἔδωκεν
  choice: alimpa
  rationale: Huhifadhi maana ya kawaida ya “kutoa/kumpa” na hali ya tendo lililotajwa na aoristi, bila kulainisha lugha ya chanzo kwa ufafanuzi wa kiteolojia.
- source_word: ζωὴν ἔχειν
  choice: kuwa na uzima
  rationale: Huwakilisha kwa uwazi muundo wa nomino pamoja na kitenzi-jina katika Kiyunani.
- source_word: ἐν ἑαυτῷ
  choice: ndani yake mwenyewe
  rationale: Kurudia maneno yale yale hudumisha ulinganifu kati ya Baba na Mwana.
theological_decisions:
- issue: Iwapo kirai “uzima ndani yake mwenyewe” kifafanuliwe wazi kuwa “uzima wa kujitegemea”
  choice: Kuhifadhi maneno “uzima ndani yake mwenyewe.”
  alternative: uzima wa kujitegemea
  rationale: Kirai cha Kiyunani ni ἐν ἑαυτῷ. Tafsiri hii huhifadhi uzito na mvutano wa kiteolojia wa andiko bila kuingiza istilahi ya baadaye katika matini kuu.
- issue: Jinsi ya kutafsiri ἔδωκεν katika uhusiano wa Baba na Mwana
  choice: alimpa
  alternative: alimjalia
  rationale: Andiko linasema wazi kwamba Baba alimpa Mwana kuwa na uzima ndani yake mwenyewe. “Alimpa” hufuata maana ya kawaida ya kitenzi bila kupunguza hadhi ya Mwana wala kuongeza maelezo ya kimafundisho.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo unaorudiwa “kama vile ... vivyo hivyo” na kirai “ndani yake mwenyewe” huhifadhi ulinganifu wa sentensi ya Kiyunani. “Uzima” limechaguliwa badala ya “uhai” kwa matumizi yake ya kawaida katika muktadha wa kiteolojia wa Yohana.
