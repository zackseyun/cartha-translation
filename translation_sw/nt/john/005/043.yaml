  text: ἐγὼ ἐλήλυθα ἐν τῷ ὀνόματι τοῦ πατρός μου καὶ οὐ λαμβάνετέ με· ἐὰν ἄλλος ἔλθῃ ἐν τῷ ὀνόματι τῷ ἰδίῳ, ἐκεῖνον λήμψεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/043.yaml
  text: I have come in my Father's name[a], and you do not receive me. If another comes in his own name[b], you will receive him.
translation:
  language: sw
  text: Nimekuja kwa jina la Baba yangu[a], na hamnipokei. Mwingine akija kwa jina lake mwenyewe[b], mtampokea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa mamlaka ya Baba yangu.” Nahau ya Kigiriki “kwa jina” inaweza kurejelea uwakilishi au mamlaka, pamoja na jina lenyewe.
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa mamlaka yake mwenyewe.” Maneno “kwa jina lake mwenyewe” yanatofautishwa kwa nguvu na kuja kwa Yesu “kwa jina la Baba yangu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλήλυθα
  choice: Nimekuja
  rationale: Kauli ya wakati timilifu inaonyesha kuja kulikotokea na matokeo yake yanayoendelea sasa; “nimekuja” hudumisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: ἐν τῷ ὀνόματι τοῦ πατρός μου
  choice: kwa jina la Baba yangu
  rationale: Kirai “kwa jina la” kinadumisha nahau ya Kigiriki, ambayo inaweza kuonyesha uwakilishi au mamlaka bila kuifungia katika maana moja tu.
- source_word: οὐ λαμβάνετέ με
  choice: hamnipokei
  rationale: Hapa λαμβάνω humaanisha kumpokea au kumkubali Yesu, si kumchukua kimwili. “Hamnipokei” pia huwezesha kitenzi kilekile kurudiwa katika hitimisho.
- source_word: ἄλλος
  choice: mwingine
  rationale: Tafsiri hii ya moja kwa moja inadumisha tofauti kati ya Yesu na mtu mwingine bila kuongeza utambulisho usiotajwa.
- source_word: ἐὰν ἄλλος ἔλθῃ
  choice: Mwingine akija
  rationale: Muundo wa “akija” ni wa asili katika Kiswahili na huwasilisha sharti linalowezekana lililo katika Kigiriki.
- source_word: ἐν τῷ ὀνόματι τῷ ἰδίῳ
  choice: kwa jina lake mwenyewe
  rationale: Maneno haya yanadumisha ulinganifu wa kimakusudi na “kwa jina la Baba yangu” na kuacha wazi wazo la kujitegemea au kujipa mamlaka.
- source_word: ἐκεῖνον λήμψεσθε
  choice: mtampokea
  rationale: Wakati ujao wa kitenzi unaonyeshwa wazi, na kurudia “pokea” kunahifadhi nguvu ya utofautishaji wa sentensi.
theological_decisions:
- issue: Kama itajwe wazi kwamba “Baba yangu” ni Mungu Baba
  choice: Kutumia “Baba” kwa herufi kubwa bila kuongeza neno “Mungu”
  alternative: Kutumia “baba” kwa herufi ndogo au kusema “Mungu Baba”
  rationale: Muktadha wa Yohana unaonyesha kwamba Yesu anamrejelea Mungu, lakini kuongeza “Mungu” kungeingiza neno lisilokuwamo katika Kigiriki; herufi kubwa hutambulisha rejeleo hilo bila kupanua matini.
- issue: Kama nahau “kwa jina” ifafanuliwe kuwa lugha ya mamlaka katika matini kuu
  choice: Kudumisha “kwa jina” katika vifungu vyote viwili
  alternative: Kutafsiri “kwa mamlaka ya Baba yangu” na “kwa mamlaka yake mwenyewe”
  rationale: Nahau ya Kigiriki inaweza kuhusisha mamlaka na uwakilishi, lakini ufafanuzi huo katika matini kuu ungepunguza upana wa maana na kudhoofisha ulinganifu wa vifungu viwili.
- issue: Nguvu ya λαμβάνω katika muktadha huu
  choice: Kutumia “kupokea” katika sehemu zote mbili
  alternative: Kutumia “kukubali” au “kukaribisha”
  rationale: “Kupokea” huhifadhi upeo unaoweza kujumuisha kukubali na kukaribisha, na pia kudumisha urudiaji wa kimakusudi wa Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Kwa jina la” ni nahau inayoeleweka na hudumisha ulinganifu wa Kigiriki; “hamnipokei/mtampokea” ni ya kawaida na inadumisha urudiaji wa kitenzi.
