  text: καὶ διὰ τοῦτο ἐδίωκον ⸂οἱ Ἰουδαῖοι τὸν Ἰησοῦν⸃ ὅτι ταῦτα ἐποίει ἐν σαββάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/016.yaml
  text: And because of this the Jews were persecuting Jesus[a], because he was doing these things on the Sabbath.
translation:
  language: sw
  text: Na kwa sababu hiyo Wayahudi[a] walikuwa wakimtesa Yesu, kwa sababu alikuwa akifanya mambo hayo siku ya Sabato.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Wayudea,” au kulingana na muktadha, “viongozi wa Kiyahudi.” Katika Injili ya Yohana, neno hili mara nyingi hurejelea kundi fulani lililompinga Yesu, si kila Myahudi bila ubaguzi.
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: kwa sababu hiyo
  rationale: Kirai hiki kinaonyesha kuwa tukio lililotangulia ndilo lililosababisha upinzani; tafsiri hii huhifadhi wazi uhusiano huo wa kisababishi.
- source_word: ἐδίωκον
  choice: walikuwa wakimtesa
  rationale: Wakati usiotimilika unaonyesha tendo lililoendelea au lililorudiwa. Katika muktadha huu, neno hilo lina maana ya upinzani wenye uhasama, si kufuatilia tu, bila kutanguliza nia ya kuua inayotajwa baadaye katika mstari wa 18.
- source_word: οἱ Ἰουδαῖοι
  choice: Wayahudi
  rationale: Hii ndiyo tafsiri ya moja kwa moja ya jina la kundi la kikabila na kidini. Dokezo linafafanua kuwa katika muktadha wa Yohana neno hili si lazima limaanishe kila Myahudi bila ubaguzi.
- source_word: ταῦτα
  choice: mambo hayo
  rationale: Kiwakilishi hiki cha wingi kinarejelea matendo yaliyosimuliwa punde kabla na kinahifadhi urejeo wa wingi kwa Kiswahili cha kawaida.
- source_word: ἐποίει
  choice: alikuwa akifanya
  rationale: Muundo huu wa Kiswahili unaonyesha tendo lililoendelea au lililokuwa likitendeka, sawasawa na hali ya kitenzi cha Kigiriki.
- source_word: ἐν σαββάτῳ
  choice: siku ya Sabato
  rationale: Huu ni usemi wa kawaida na ulio wazi wa Kiswahili kwa tendo lililofanyika wakati wa Sabato.
theological_decisions:
- issue: Kirejelewa na tafsiri ya οἱ Ἰουδαῖοι katika Yohana
  choice: Wayahudi
  alternative: Wayudea; viongozi wa Kiyahudi
  rationale: Matini kuu inadumisha maana ya moja kwa moja badala ya kubainisha kimuktadha kuwa walikuwa viongozi pekee. Dokezo linahifadhi uwezekano wa kirejelewa kilicho finyu zaidi na kuzuia neno hilo lisieleweke kuwa hukumu dhidi ya Wayahudi wote.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Miundo “walikuwa wakimtesa” na “alikuwa akifanya” inadumisha hali endelevu ya vitenzi vya Kigiriki bila kufanya sentensi iwe nzito.
