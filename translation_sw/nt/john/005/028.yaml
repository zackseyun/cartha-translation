  text: Do not marvel at this[a], because an hour is coming in which all who are in the tombs will hear his voice
translation:
  language: sw
  text: Msistaajabie jambo hili, kwa sababu saa inakuja ambapo wote walio makaburini[a] wataisikia sauti yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sehemu za maziko.” Neno la Kigiriki μνημεῖα linaweza kumaanisha makaburi au sehemu za maziko kwa ujumla.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ θαυμάζετε
  choice: Msistaajabie
  rationale: Kitenzi cha katazo katika wingi; ‘kustaajabia’ kinaonyesha mshangao mkubwa kwa lugha ya sasa yenye hadhi.
- source_word: τοῦτο
  choice: jambo hili
  rationale: Kiwakilishi elekezi kinarejelea dai lililotangulia; ‘jambo hili’ ni wazi na cha kawaida katika Kiswahili.
- source_word: ὅτι
  choice: kwa sababu
  rationale: Hapa kinaanzisha sababu ya katazo, hivyo maana ya kisababishi imewekwa wazi.
- source_word: ἔρχεται ὥρα
  choice: saa inakuja
  rationale: ‘Saa’ huhifadhi neno la Yohana na uzito wake unaowezekana, badala ya kulipanua kuwa ‘wakati’.
- source_word: ἐν ᾗ
  choice: ambapo
  rationale: Ni tafsiri ya asili ya uhusiano wa wakati katika Kiswahili bila kupoteza muundo wa maana.
- source_word: πάντες οἱ ἐν τοῖς μνημείοις
  choice: wote walio makaburini
  rationale: Huwakilisha πάντες οἱ kwa ‘wote walio’ na μνημεῖα kama mahali pa maziko kwa namna inayoeleweka kwa wasomaji wa Kiswahili.
- source_word: ἀκούσουσιν
  choice: wataisikia
  rationale: Wakati ujao wa ἀκούω umetafsiriwa moja kwa moja; kiambishi ‘-i-’ kinarejelea sauti.
- source_word: τῆς φωνῆς αὐτοῦ
  choice: sauti yake
  rationale: φωνή katika muktadha huu ni ‘sauti’; umilikaji wa nafsi ya tatu umehifadhiwa bila ufafanuzi wa ziada.
theological_decisions:
- issue: Lugha ya ufufuo inayodokezwa na walio makaburini kuisikia sauti yake
  choice: Kuhifadhi taswira halisi ya mahali pa maziko bila kuongeza maelezo ya mafundisho ndani ya aya.
  alternative: Kutafsiri kwa upanuzi kama ‘wafu wote’ au kueleza wazi ufufuo.
  rationale: Aya inaelekea kwenye ufufuo, lakini tafsiri inapaswa kuhifadhi maneno na mvutano wa kifungu chenyewe badala ya kueleza hitimisho lake mapema.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Msistaajabie’ na ‘saa inakuja’ huhifadhi uzito wa usemi wa Yohana, huku ‘makaburini’ ikiwa ya kawaida na wazi.
