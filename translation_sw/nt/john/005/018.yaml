id: JHN.5.18
reference: John 5:18
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: διὰ τοῦτο οὖν μᾶλλον ἐζήτουν αὐτὸν οἱ Ἰουδαῖοι ἀποκτεῖναι ὅτι οὐ μόνον ἔλυε τὸ σάββατον, ἀλλὰ καὶ πατέρα ἴδιον ἔλεγε τὸν θεόν, ἴσον ἑαυτὸν ποιῶν τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/018.yaml
  text: For this reason[a], therefore, the Jews were seeking all the more to kill him, because he was not only breaking the Sabbath, but was also calling God his own Father[b], making himself equal with God.
translation:
  language: sw
  text: Kwa sababu hiyo basi, Wayahudi[a] walizidi kutafuta jinsi ya kumuua, kwa sababu hakuwa tu akiivunja Sabato, bali pia alikuwa akimwita Mungu Baba yake mwenyewe, akijiweka sawa na Mungu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika Injili ya Yohana, neno “Wayahudi” mara nyingi huwarejelea kwa namna maalumu wapinzani wa Yesu wa Uyahudi au viongozi fulani wa Kiyahudi katika muktadha, wala si kila Myahudi bila ubaguzi.
    reason: cultural_note
  - marker: b
    text: Au, “akijiweka katika usawa na Mungu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο οὖν
  choice: Kwa sababu hiyo basi
  rationale: Huhifadhi uhusiano wa sababu na hitimisho unaoonyeshwa na virai vyote viwili, huku Kiswahili kikibaki cha kawaida.
- source_word: μᾶλλον ἐζήτουν ... ἀποκτεῖναι
  choice: walizidi kutafuta jinsi ya kumuua
  rationale: ‘Walizidi’ huonyesha ongezeko linalodokezwa na μᾶλλον, na muundo wa kitenzi huwasilisha jitihada iliyoendelea ya kutaka kumuua.
- source_word: οἱ Ἰουδαῖοι
  choice: Wayahudi
  rationale: Hufuata jina la wazi la Kigiriki bila kulibana katika matini kuu kuwa viongozi pekee; upeo unaowezekana wa rejeo unaelezwa katika tanbihi.
- source_word: ἔλυε τὸ σάββατον
  choice: alikuwa akiivunja Sabato
  rationale: ‘Kuivunja Sabato’ ni usemi wa kawaida wa Kiswahili kwa kuvunja masharti ya Sabato na huhifadhi hali ya tendo lililoendelea.
- source_word: πατέρα ἴδιον ἔλεγε τὸν θεόν
  choice: alikuwa akimwita Mungu Baba yake mwenyewe
  rationale: ‘Mwenyewe’ huhifadhi msisitizo wa ἴδιον kwamba alimtaja Mungu kuwa Baba yake binafsi.
- source_word: ἴσον ἑαυτὸν ποιῶν τῷ θεῷ
  choice: hivyo akijiweka katika usawa na Mungu
  rationale: Huwasilisha dai la kuwa sawa na Mungu bila kutumia ‘akijifanya,’ ambalo katika Kiswahili linaweza kueleweka kimakosa kuwa alijidai kwa udanganyifu.
theological_decisions:
- issue: Nguvu ya kikristo ya kauli ya kuwa sawa na Mungu
  choice: hivyo akijiweka katika usawa na Mungu
  alternative: hivyo akijifanya kuwa sawa na Mungu
  rationale: Tafsiri haipunguzi dai la usawa na Mungu, lakini pia haiongezi wazo kwamba dai hilo lilikuwa la uongo, maana ambayo ‘kujifanya’ inaweza kuwa nayo katika Kiswahili.
- issue: Rejeo la ‘Wayahudi’ katika Injili ya Yohana
  choice: Wayahudi katika matini kuu, pamoja na ufafanuzi katika tanbihi
  alternative: viongozi wa Wayahudi
  rationale: Kigiriki kinasema οἱ Ἰουδαῖοι; tanbihi huhifadhi uwezekano kwamba katika muktadha huu jina hilo linawalenga wapinzani au viongozi fulani, si kila Myahudi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umewekwa wazi kwa msomaji wa kawaida, huku mwendelezo wa vitendo na uzito wa dai la Yesu kuhusu Mungu kuwa Baba yake mwenyewe vikihifadhiwa.
