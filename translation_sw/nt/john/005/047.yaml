base_translation:
  language: en
  yaml_path: translation/nt/john/005/047.yaml
  text: But if you do not believe his writings[a], how will you believe my words?
translation:
  language: sw
  text: Lakini ikiwa hamyaamini maandiko yake[a], mtayaaminije maneno yangu?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “barua zake.” Neno la Kigiriki linaweza kumaanisha barua au maandiko; hapa linarejelea mambo ambayo Musa aliandika.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: Lakini ikiwa
  rationale: Inaendeleza hoja kwa sharti lenye utofautishaji, kwa Kiswahili cha kawaida na chenye heshima.
- source_word: τοῖς ἐκείνου γράμμασιν
  choice: maandiko yake
  rationale: γράμματα hapa inarejelea mambo ambayo Musa aliandika katika muktadha wa karibu; “maandiko” ni ya asili zaidi kuliko “herufi” au “barua,” bila kuongeza neno “Maandiko Matakatifu” ambalo halipo wazi katika kifungu.
- source_word: οὐ πιστεύετε
  choice: hamyaamini
  rationale: Kitenzi πιστεύω pamoja na yambwa hapa kina maana ya kuyakubali kuwa ya kweli; hali ya sasa imehifadhiwa.
- source_word: πῶς ... πιστεύσετε
  choice: mtayaaminije
  rationale: Muundo huu wa Kiswahili huhifadhi swali la jinsi pamoja na wakati ujao wa πιστεύσετε.
- source_word: τοῖς ἐμοῖς ῥήμασιν
  choice: maneno yangu
  rationale: ῥήματα inaonyesha maneno au matamko yaliyosemwa; “maneno yangu” ni ya kawaida na huhifadhi utofauti na maandiko ya Musa.
theological_decisions:
- issue: Mhusika anayerejelewa na ἐκείνου (“yake”)
  choice: “yake” inamrejelea Musa katika muktadha wa karibu
  alternative: Kutaja “Musa” moja kwa moja au kuacha rejeleo kuwa la jumla
  rationale: Yohana 5:45–46 inamtaja Musa wazi. Kiwakilishi “yake” kinahifadhi mshikamano na namna ya Kigiriki bila kurudia jina lisilokuwamo katika mstari huu.
- issue: Maana ya πιστεύω
  choice: Kutumia “amini” kwa uthabiti katika vifungu vyote viwili
  alternative: Kutumia “tumaini” au “weka imani katika”
  rationale: Muktadha unasisitiza kuyakubali maandiko ya Musa na maneno ya Yesu kuwa ya kweli; “amini” huhifadhi pia usambamba wa balagha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima, na kinachoeleweka kwa urahisi. Kiambishi cha yambwa katika “hamyaamini/mtayaaminije” kinaonyesha “maandiko” na kuhifadhi usambamba wa sentensi.
