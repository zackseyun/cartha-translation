  text: λέγει αὐτῷ ὁ Ἰησοῦς· ⸀Ἔγειρε ἆρον τὸν κράβαττόν σου καὶ περιπάτει.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/008.yaml
  text: Jesus says to him[a], “Get up, pick up your mat, and walk.”
translation:
  language: sw
  text: Yesu akamwambia, “Inuka, chukua mkeka wako, utembee.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: akamwambia
  rationale: Ingawa Kigiriki kinatumia wakati uliopo wa kihistoria, Kiswahili cha masimulizi kwa kawaida hutumia ‘akamwambia’; ‘anamwambia’ hapa kingesikika si cha kawaida bila muktadha mpana wa wakati uliopo wa kisimulizi.
- source_word: αὐτῷ
  choice: -mwambia
  rationale: Kiambishi cha yambwa ‘-mw-’ kinawakilisha kwa kawaida maana ya ‘alimwambia yeye’ bila kulazimisha kiwakilishi tofauti.
- source_word: Ἔγειρε
  choice: Inuka
  rationale: Amri hii ya kawaida na ya moja kwa moja inaonyesha kuondoka katika hali ya kulala au kukaa bila kuifafanua kwa kuongeza habari ya uponyaji.
- source_word: ἆρον
  choice: chukua
  rationale: ‘Chukua’ ni amri ya asili inayoweza kumaanisha kuinua na kwenda na kitu; ‘nyanyua’ ingesisitiza zaidi tendo la kuinua pekee.
- source_word: κράβαττόν
  choice: mkeka
  rationale: Neno linarejelea tandiko rahisi la kulalia linaloweza kubebwa, si lazima kitanda kizito; ‘mkeka’ linaeleweka kwa urahisi katika Kiswahili cha Afrika Mashariki.
- source_word: περιπάτει
  choice: utembee
  rationale: Muundo wa amri unaoendelea baada ya ‘chukua’ unasikika kwa kawaida kama ‘utembee’ katika Kiswahili, huku ukidumisha maana halisi ya kutembea.
theological_decisions:
- issue: Asili ya amri ya Yesu katika muktadha wa uponyaji
  choice: 'Amri tatu zimetafsiriwa moja kwa moja kama vitendo vya kimwili: kuinuka, kuchukua mkeka, na kutembea.'
  alternative: Kuongeza maneno kama ‘uponywe’ au ‘ukiwa umepona.’
  rationale: Mstari wa Kigiriki hautaji uponyaji moja kwa moja; maana hiyo inaonekana katika muktadha na haipaswi kuongezwa katika tafsiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Akamwambia’ linafuata mtiririko wa kawaida wa masimulizi ya Kiswahili; ‘mkeka’ huepuka picha ya kitanda kikubwa kisichobebeka.
