  yaml_path: translation/nt/john/005/042.yaml
  text: 'But I know you: you do not have the love of God in yourselves.'
translation:
  language: sw
  text: 'Lakini ninawajua: hamna upendo wa Mungu ndani yenu.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa uwazi zaidi, “hamna upendo kwa Mungu ndani yenu.” Kigiriki kinaweza pia kueleweka kwa maana pana zaidi kuwa “hamna ndani yenu upendo utokao kwa Mungu” au “upendo wa Mungu.”
    reason: Usomaji mbadala unaohifadhi uwezekano mbalimbali wa maana ya τοῦ θεοῦ.
lexical_decisions:
- source_word: ἀλλὰ
  choice: Lakini
  rationale: Huonyesha utofautishaji wenye nguvu na yaliyotangulia, kwa lugha ya kawaida na yenye heshima.
- source_word: ἔγνωκα
  choice: ninawajua
  rationale: Wakati timilifu wa Kigiriki unaonyesha ujuzi uliothibitika na unaoendelea; wakati wa sasa katika Kiswahili huwasilisha hali hiyo kwa kawaida.
- source_word: ὑμᾶς
  choice: -wa- katika “ninawajua”
  rationale: Kiambishi hiki ni yambwa cha nafsi ya pili wingi na kinatafsiri ὑμᾶς moja kwa moja.
- source_word: ὅτι
  choice: ':'
  rationale: Nukta mbili zinatanguliza kwa kawaida maudhui ya jambo ambalo Yesu analijua kuwahusu, bila kuongeza maneno yasiyokuwamo katika chanzo.
- source_word: τὴν ἀγάπην τοῦ θεοῦ
  choice: upendo wa Mungu
  rationale: Muundo huu wa Kiswahili unafuata hali ya umilikishi ya Kigiriki na kuhifadhi uwezekano wa maana ya upendo kwa Mungu au upendo unaotoka kwake.
- source_word: οὐκ ἔχετε
  choice: hamna
  rationale: Ni usemi wa sasa ulio wazi na wa kawaida unaoonyesha kwamba hawana upendo huo.
- source_word: ἐν ἑαυτοῖς
  choice: ndani yenu
  rationale: Huwasilisha maana ya kuwa na kitu katika utu wa ndani; pia huonyesha wingi wa wanaosemeshwa.
theological_decisions:
- issue: Maana ya hali ya umilikishi katika “upendo wa Mungu”
  choice: Maandishi makuu yanasema “upendo wa Mungu” bila kufafanua mwelekeo au chanzo chake.
  alternative: “upendo kwa Mungu” au “upendo utokao kwa Mungu”
  rationale: τοῦ θεοῦ inaweza kueleza upendo unaoelekezwa kwa Mungu au upendo unaotoka kwake. Muktadha unaunga mkono sana maana ya upendo kwa Mungu, lakini muundo wa Kigiriki hauondoi kabisa maana pana zaidi; kwa hiyo utata huo umehifadhiwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Ninawajua” ni cha kawaida na huonyesha ujuzi uliothibitika; “ndani yenu” huweka wazi hali ya ndani bila kuwa kizito.
