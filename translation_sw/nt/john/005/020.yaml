  verdict: revise
  source_fidelity: 'Tafsiri inafuata kwa uaminifu muundo na maana ya Kigiriki: φιλεῖ, δείκνυσιν/δείξει, πάντα, msisitizo wa αὐτός, na ἵνα ὑμεῖς θαυμάζητε vimewakilishwa vizuri. Hata hivyo, mbadala katika tanbihi unaongeza kwa tafsiri neno «hata», ambalo halipo katika Kigiriki, na hauwakilishi kwa usahihi mbadala wa wakati ujao.'
  naturalness: Kiswahili cha aya ni sanifu na kinaeleweka. «Kazi kubwa kuliko hizi» ni mtiririko wa kawaida zaidi kuliko «kazi zilizo kubwa kuliko hizi», bila kubadili maana.
  terminology: «Baba», «Mwana», «anampenda», na «kazi» vinafaa kwa muktadha wa Yohana na havibebeshi maandishi tafsiri ya kimafundisho. «Mshangae» huhifadhi maana ya θαυμάζητε kwa mtindo unaofaa.
  issues:
