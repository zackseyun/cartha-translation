  text: ὁ γὰρ πατὴρ φιλεῖ τὸν υἱὸν καὶ πάντα δείκνυσιν αὐτῷ ἃ αὐτὸς ποιεῖ, καὶ μείζονα τούτων δείξει αὐτῷ ἔργα, ἵνα ὑμεῖς θαυμάζητε.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/020.yaml
  text: For the Father loves the Son and shows him all that he himself is doing; and he will show him greater works than these[a], so that you may marvel.
translation:
  language: sw
  text: Kwa maana Baba anampenda Mwana na kumwonyesha yote ambayo yeye mwenyewe anayafanya; naye atamwonyesha kazi kubwa kuliko hizi[a], ili ninyi mshangae.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ili ninyi mtashangaa.” Neno la Kigiriki ἵνα pamoja na kitenzi katika hali ya utegemezi linaweza kuonyesha kusudi na, katika muktadha huu, pia kudokeza matokeo kwamba wasikilizaji wa Yesu watashangaa.
    reason: alternative_reading
lexical_decisions:
- source_word: φιλεῖ
  choice: anampenda
  rationale: Neno hili linaonyesha upendo wa karibu wa Baba kwa Mwana. Katika Yohana, φιλέω linaweza kuingiliana kimaana na ἀγαπάω, hivyo ‘anampenda’ ni tafsiri ya kawaida isiyodhoofisha wala kuzidisha maana.
- source_word: δείκνυσιν ... δείξει
  choice: kumwonyesha ... atamwonyesha
  rationale: ‘Kuonyesha’ ni sawia ya moja kwa moja na huhifadhi urudiaji wa kitenzi kilekile katika wakati wa sasa na ujao.
- source_word: πάντα
  choice: yote
  rationale: ‘Yote’ huwasilisha kwa lugha ya asili upeo kamili wa πάντα na huungana vizuri na kishazi kinachofuata.
- source_word: ἃ αὐτὸς ποιεῖ
  choice: ambayo yeye mwenyewe anayafanya
  rationale: ‘Yeye mwenyewe’ huhifadhi msisitizo wa αὐτός, huku ‘anayafanya’ ikionyesha tendo la sasa linaloendelea bila kuamua kupita kiasi namna ya uendelevu wake.
- source_word: μείζονα τούτων ... ἔργα
  choice: kazi zilizo kubwa kuliko hizi
  rationale: ‘Kazi’ huhifadhi istilahi muhimu ya Yohana kwa matendo ya Yesu, na muundo wa kulinganisha ni wa kawaida katika Kiswahili.
- source_word: ἵνα ὑμεῖς θαυμάζητε
  choice: ili ninyi mshangae
  rationale: ‘Ili’ huhifadhi nguvu ya kusudi iliyo wazi katika ἵνα, huku hali ya utegemezi ‘mshangae’ ikiacha wazi pia uwezekano wa matokeo yanayotarajiwa. ‘Ninyi’ huonyesha msisitizo na wingi wa ὑμεῖς.
theological_decisions:
- issue: Asili ya upendo wa Baba kwa Mwana katika φιλεῖ
  choice: Kutafsiri kwa ‘anampenda’ bila kudokeza kwamba ni upendo dhaifu au wa kibinadamu tu.
  alternative: ‘Ana shauku ya upendo kwa Mwana’ au ‘anamwonea Mwana upendo wa karibu.’
  rationale: φιλέω linaweza kusisitiza ukaribu wa upendo, lakini matumizi ya Yohana hayalazimishi tofauti ya kiteolojia kati yake na ἀγαπάω. Tafsiri rahisi inalinda uhusiano wa Baba na Mwana bila kuingiza tofauti isiyothibitishwa.
- issue: Nguvu ya ἵνα ὑμεῖς θαυμάζητε
  choice: ‘ili ninyi mshangae,’ likihifadhi hasa wazo la kusudi na pia kuruhusu dokezo la matokeo.
  alternative: ‘hata ninyi mtashangaa.’
  rationale: ἵνα pamoja na hali tegemezi mara nyingi huonyesha kusudi, lakini katika muktadha inaweza pia kuelekea matokeo ya mshangao wa wasikilizaji. Maelezo ya chini yanahifadhi uwezekano huo bila kuufanya kuwa maana pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Baba’ na ‘Mwana’ zimeandikwa kwa herufi kubwa kwa kuwa zinatumika kama majina ya uhusiano wa kimungu katika muktadha huu.
