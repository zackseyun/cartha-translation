  - severity: low
    issue: «Kazi zilizo kubwa» ni muundo mzito kidogo.
    rationale: «Kazi kubwa kuliko hizi» ni wa kawaida zaidi katika Kiswahili Sanifu na huwasilisha μείζονα ... ἔργα kwa ufasaha uleule.
