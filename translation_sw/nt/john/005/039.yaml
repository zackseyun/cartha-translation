  text: Ἐραυνᾶτε τὰς γραφάς, ὅτι ὑμεῖς δοκεῖτε ἐν αὐταῖς ζωὴν αἰώνιον ἔχειν· καὶ ἐκεῖναί εἰσιν αἱ μαρτυροῦσαι περὶ ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/005/039.yaml
  text: You search the Scriptures because you think that in them you have eternal life[a]; and these are the ones that testify about me.
translation:
  language: sw
  text: Mnayachunguza Maandiko kwa sababu mnadhani kwamba katika hayo mna uzima wa milele[a]; na hayo ndiyo yanayonishuhudia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yachunguzeni Maandiko,” ikiwa Ἐραυνᾶτε inaeleweka kuwa amri badala ya kauli elekezi.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐραυνᾶτε
  choice: Mnayachunguza
  rationale: Umbo la Kigiriki linaweza kuwa kauli elekezi (‘mnayachunguza’) au amri (‘yachunguzeni’). Muktadha unaelekea kueleza desturi yao ya sasa; uwezekano wa amri umehifadhiwa katika tanbihi.
- source_word: τὰς γραφάς
  choice: Maandiko
  rationale: Katika matumizi ya Yohana, neno hili linarejelea maandiko matakatifu ya Israeli; ‘Maandiko’ ni istilahi ya kawaida na yenye heshima katika Kiswahili.
- source_word: ὅτι
  choice: kwa sababu
  rationale: Hapa linaeleweka kwa maana ya kisababishi, likitoa sababu ya wao kuyachunguza Maandiko.
- source_word: δοκεῖτε
  choice: mnadhani
  rationale: Huwasilisha dhana au imani yao kwa lugha ya kawaida bila kuongeza ukali usiokuwamo wazi katika chanzo.
- source_word: ἐν αὐταῖς
  choice: ndani yake
  rationale: Huhifadhi maana ya msingi ya ἐν na kurejelea Maandiko kama mahali ambamo wao hudhani kuwa wana uzima wa milele.
- source_word: ζωὴν αἰώνιον
  choice: uzima wa milele
  rationale: Hii ndiyo tafsiri ya kawaida na wazi ya usemi muhimu wa Kiyohana.
- source_word: ἐκεῖναί
  choice: nayo ndiyo
  rationale: Kiwakilishi hiki kinasisitiza Maandiko yaliyotajwa; ‘nayo ndiyo’ huonyesha msisitizo huo kwa Kiswahili cha asili.
- source_word: αἱ μαρτυροῦσαι
  choice: yanayonishuhudia
  rationale: Kitenzi ‘kushuhudia’ ni cha kawaida, kinaeleweka, na huhifadhi wazo la kutoa ushahidi lililo muhimu katika Yohana.
- source_word: περὶ ἐμοῦ
  choice: yanayonishuhudia
  rationale: Maana ya ‘kunihusu’ imeunganishwa kwa kawaida katika kitenzi cha Kiswahili ‘kunishuhudia,’ yaani kutoa ushahidi kunihusu.
theological_decisions:
- issue: Hali ya kitenzi Ἐραυνᾶτε
  choice: 'Kauli elekezi: ‘Mnayachunguza Maandiko’'
  alternative: 'Kauli ya amri: ‘Yachunguzeni Maandiko’'
  rationale: Umbo la Kigiriki linaruhusu hali zote mbili. Muktadha wa karibu unapendelea kauli elekezi, kwa kuwa Yesu anaeleza mwenendo wa wasikilizaji wake na kuonyesha kwamba Maandiko yanamshuhudia yeye. Tanbihi inahifadhi uwezekano halisi wa kauli ya amri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Wingi wa nafsi ya pili umehifadhiwa. Muundo ‘ndani yake’ unatumika kwa kurejelea nomino ya ngeli ya Maandiko kwa maana ya jumla.
