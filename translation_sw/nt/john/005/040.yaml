  text: καὶ οὐ θέλετε ἐλθεῖν πρός με ἵνα ζωὴν ἔχητε.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/040.yaml
  text: Yet you are not willing to come to me so that you may have life[a][b].
translation:
  language: sw
  text: Lakini hamtaki kuja kwangu ili mpate uzima[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nanyi hamtaki kuja kwangu ili mpate uzima.” Kiunganishi cha Kigiriki kinaweza kutafsiriwa kwa urahisi kuwa “na,” na kitenzi kinaweza pia kueleweka kuwa “hamko tayari.”
    reason: lexical_alternative
  - marker: b
    text: Katika Injili ya Yohana, “uzima” mara nyingi una maana pana ya uzima utokao kwa Mungu, yaani uzima wa milele, ingawa neno “wa milele” halikutajwa hapa.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ
  choice: Lakini
  rationale: Ingawa καί kwa kawaida humaanisha “na,” hapa inaonyesha tofauti na mashtaka yaliyotangulia; “Lakini” huleta ulinganifu huo kwa Kiswahili cha kawaida.
- source_word: οὐ θέλετε
  choice: hamtaki
  rationale: θέλω huhusu kutaka au kuwa tayari. “Hamtaki” ni ya asili na ya moja kwa moja, huku ikiepuka nguvu ya ziada ya “mnakataa.”
- source_word: ἐλθεῖν πρός με
  choice: kuja kwangu
  rationale: Kirai hiki kwa kawaida humaanisha kuja kwa mtu. Tafsiri inadumisha picha halisi ya Yohana badala ya kuifafanua kuwa “kuniamini.”
- source_word: ἵνα
  choice: ili
  rationale: ἵνα hapa hutambulisha kusudi; “ili” ni njia ya kawaida na wazi ya kulieleza kwa Kiswahili.
- source_word: ζωὴν
  choice: uzima
  rationale: ζωή ni “uzima.” Katika Yohana mara nyingi lina maana pana ya uzima utokao kwa Mungu, lakini neno “wa milele” halipo katika mstari huu.
- source_word: ἔχητε
  choice: mpate
  rationale: Baada ya ἵνα, ἔχητε hueleza kusudi la kuwa na au kupata uzima. “Mpate” ni Kiswahili cha asili katika muundo huu na huhifadhi mwelekeo huo wa kusudi.
theological_decisions:
- issue: Kutafsiri ζωὴν kuwa “uzima” au “uzima wa milele”
  choice: uzima
  alternative: uzima wa milele
  rationale: Ingawa katika Injili ya Yohana ζωή mara nyingi lina uzito wa wokovu na uzima wa milele, αἰώνιος halikutajwa hapa. Maandishi makuu hayapaswi kuongeza sifa ambayo chanzo hakisemi wazi.
- issue: Kufasiri “kuja kwangu” moja kwa moja kuwa kuamini
  choice: kuja kwangu
  alternative: kuniamini; kuja kwangu kwa imani
  rationale: Katika Yohana, kuja kwa Yesu kunahusiana kwa karibu na kuamini, lakini maandishi yanatumia kitenzi halisi cha kuja. Kudumisha usemi huo huhifadhi taswira na mvutano wa kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Hamtaki” na “kuja kwangu” ni miundo ya kawaida inayoeleweka kwa urahisi; “uzima” huhifadhi msamiati wa kibiblia bila kuongeza “wa milele” katika maandishi makuu.
