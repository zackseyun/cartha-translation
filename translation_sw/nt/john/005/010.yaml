base_translation:
  language: en
  yaml_path: translation/nt/john/005/010.yaml
  text: So the Jews were saying to the man who had been healed[a], “It is the Sabbath[c][b], and it is not lawful for you to carry your mat.”
translation:
  language: sw
  text: Basi Wayahudi[a] walikuwa wakimwambia yule aliyekuwa ameponywa, “Ni Sabato, na si halali kwako kuubeba[b] mkeka[c] wako.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au yawezekana, “viongozi wa Wayahudi” au “Wayudea,” kutegemea jinsi Yohana anavyotumia neno hili hapa.
    reason: alternative_reading
  - marker: b
    text: Au “kuuokota” au “kuuchukua.”
    reason: lexical_alternative
  - marker: c
    text: Neno lililotafsiriwa “mkeka” linamaanisha tandiko au godoro jepesi la kulalia linaloweza kubebwa, si lazima kitanda kamili.
    reason: cultural_note
lexical_decisions:
- source_word: ἔλεγον
  choice: walikuwa wakimwambia
  rationale: Kauli ya wakati uliopita usiotimilika inaonyesha usemi uliokuwa ukiendelea au kurudiwa; muundo huu unahifadhi hali hiyo kwa Kiswahili cha kawaida.
- source_word: οὖν
  choice: Basi
  rationale: Kiunganishi hiki kinaendeleza simulizi na kuonyesha matokeo ya tukio lililotangulia bila kufanya sentensi iwe nzito.
- source_word: οἱ Ἰουδαῖοι
  choice: Wayahudi
  rationale: Hii ndiyo maana ya moja kwa moja ya maneno ya Kigiriki. Muktadha wa mstari huu pekee hautaji wazi kwamba walikuwa viongozi, hivyo tafsiri haifupishi maana hiyo kimyakimya.
- source_word: τῷ τεθεραπευμένῳ
  choice: yule aliyekuwa ameponywa
  rationale: Kauli tendwa ya hali timilifu inaonyesha tendo la kuponywa lililokamilika na matokeo yake kuendelea; ‘yule’ ni ya asili kwa kurejelea mtu aliyetajwa katika muktadha.
- source_word: Σάββατόν ἐστιν
  choice: Leo ni Sabato
  rationale: Kwa Kiswahili, ‘Leo ni Sabato’ hutoa kwa kawaida dai la wakati linalomaanishwa na Kigiriki, bila kulifanya kuwa ‘Sabato fulani.’
- source_word: οὐκ ἔξεστίν σοι
  choice: si halali kwako
  rationale: Neno ἔξεστιν linahusu jambo linaloruhusiwa au lililo halali; ‘si halali’ huhifadhi uzito wa kisheria na kidini wa pingamizi hilo.
- source_word: ἆραι
  choice: kuubeba
  rationale: Ingawa kitenzi kinaweza kumaanisha kuinua au kuchukua, hapa pingamizi linahusu kubeba kitu hicho siku ya Sabato.
- source_word: κράβαττον
  choice: mkeka
  rationale: Neno linarejelea tandiko jepesi la kulalia linaloweza kubebwa, si lazima kitanda chenye fremu; ‘mkeka’ ni neno linaloeleweka kwa urahisi katika Kiswahili cha Afrika Mashariki.
theological_decisions:
- issue: Marejeo ya οἱ Ἰουδαῖοι katika Injili ya Yohana
  choice: Wayahudi
  alternative: viongozi wa Wayahudi; Wayudea
  rationale: Mstari huu hautambui wazi kundi hilo kuwa viongozi wala kulifafanua kijiografia. Tafsiri kuu kwa hiyo inadumisha upana wa maneno ya Kigiriki, huku tanbihi ikitaja uwezekano wa maana finyu zaidi kulingana na matumizi ya Yohana.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo ‘walikuwa wakimwambia’ huhifadhi hali ya tendo linaloendelea au kurudiwa. Alama za tanbihi zimewekwa moja kwa moja baada ya maneno yanayohusika.
