  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐκεῖνος ἦν ὁ λύχνος ὁ καιόμενος καὶ φαίνων, ὑμεῖς δὲ ἠθελήσατε ἀγαλλιαθῆναι πρὸς ὥραν ἐν τῷ φωτὶ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/005/035.yaml
  text: He was the lamp that was burning and shining[a], and you were willing to rejoice for a time in his light.
translation:
  language: sw
  text: Yeye alikuwa taa iliyokuwa ikiwaka na kuangaza, nanyi mlitaka kushangilia kwa muda[a] katika nuru yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa muda mfupi.” Kirai hiki kina maana ya kipindi chenye kikomo, si lazima saa moja halisi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖνος
  choice: Yeye
  rationale: Kiwakilishi hiki kinamrejelea Yohana kwa msisitizo. “Yeye” ni cha kawaida katika Kiswahili na kinadumisha msisitizo huo bila kuongeza maelezo yasiyokuwamo.
- source_word: λύχνος
  choice: taa
  rationale: Neno hili linamaanisha taa inayowaka, si nuru kwa maana ya jumla. “Taa” inadumisha tofauti kati ya Yohana, aliyetoa ushuhuda, na nuru yenyewe katika muktadha wa Injili ya Yohana.
- source_word: καιόμενος
  choice: iliyokuwa ikiwaka
  rationale: Kauli hii inaonyesha hali ya kuendelea ya taa kuwaka; umbo hili la Kiswahili linaonyesha mwendelezo huo kwa kawaida.
- source_word: φαίνων
  choice: kuangaza
  rationale: Katika muktadha huu neno linamaanisha kutoa mwanga, si kuonekana tu. “Kuangaza” linaeleweka kwa urahisi na linaendana na taa inayowaka.
- source_word: ἠθελήσατε
  choice: mlitaka
  rationale: Kitenzi kinaonyesha nia au utashi wa wasikilizaji. “Mlitaka” ni cha moja kwa moja na hakiongezi wazo la uamuzi wa kudumu.
- source_word: ἀγαλλιαθῆναι
  choice: kushangilia
  rationale: Kitenzi hiki kinaeleza furaha kubwa. “Kushangilia” kinabeba uzito huo kuliko “kufurahi” pekee huku kikibaki cha kawaida kwa wasomaji wa sasa.
- source_word: πρὸς ὥραν
  choice: kwa muda
  rationale: Kirai hiki kinaonyesha kipindi kifupi au chenye kikomo, si lazima saa moja halisi. “Kwa muda” kinadumisha wazo la hali ya mpito.
- source_word: ἐν τῷ φωτὶ αὐτοῦ
  choice: katika nuru yake
  rationale: Tafsiri hii inadumisha taswira ya watu kushangilia ndani ya au kuhusiana na nuru ya Yohana, bila kubadili kirai kuwa maelezo ya chombo tu.
theological_decisions:
- issue: Tofauti ya kisitiari kati ya Yohana na Yesu katika taswira ya nuru
  choice: Yohana anaitwa “taa,” si “nuru.”
  alternative: Yeye alikuwa nuru.
  rationale: Kigiriki kimetumia λύχνος, si φῶς. Tofauti hii inadumisha nafasi ya Yohana kama shahidi anayeelekeza kwenye nuru, bila kumtambulisha kuwa nuru yenyewe.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo “iliyokuwa ikiwaka na kuangaza” unadumisha vitendo viwili vinavyoendelea, na “kushangilia” linaonyesha nguvu ya furaha iliyo katika kitenzi cha Kigiriki.
