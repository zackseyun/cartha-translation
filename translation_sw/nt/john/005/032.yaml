  text: ἄλλος ἐστὶν ὁ μαρτυρῶν περὶ ἐμοῦ, καὶ οἶδα ὅτι ἀληθής ἐστιν ἡ μαρτυρία ἣν μαρτυρεῖ περὶ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/032.yaml
  text: There is another who testifies about me[a], and I know that the testimony which he testifies about me is true.
translation:
  language: sw
  text: Yuko mwingine anayetoa ushuhuda kunihusu,[a] nami najua kwamba ushuhuda anaoutoa kunihusu ni wa kweli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “anayeshuhudia kunihusu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλος
  choice: mwingine
  rationale: Huhifadhi utofautishaji na ushuhuda wa Yesu mwenyewe katika muktadha bila kumtambulisha shahidi huyo.
- source_word: ὁ μαρτυρῶν
  choice: anayetoa ushuhuda
  rationale: Kirai hiki cha kitenzi katika wakati wa sasa kinamtaja mtu anayeshuhudia; tafsiri hii ni ya kawaida na huhifadhi maana inayoendelea.
- source_word: περὶ ἐμοῦ
  choice: kunihusu
  rationale: περί pamoja na hali ya umilikishi huonyesha jambo linalozungumziwa; ‘kunihusu’ ni Kiswahili cha asili na sahihi.
- source_word: οἶδα
  choice: najua
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kitenzi cha kujua.
- source_word: ἀληθής
  choice: wa kweli
  rationale: Hueleza ushuhuda kuwa wa kweli bila kuupanua kimaf تفسير.
- source_word: ἡ μαρτυρία
  choice: ushuhuda
  rationale: Huhifadhi ladha ya kimahakama ya muktadha na uhusiano wa wazi na kitenzi ‘kutoa ushuhuda’.
- source_word: ἣν μαρτυρεῖ
  choice: anaoutoa
  rationale: Muundo wa urejeshi huhifadhi kishazi rejeshi cha Kigiriki, huku ‘-outoa’ ikirejelea ushuhuda kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Utambulisho wa ‘mwingine’ (ἄλλος)
  choice: Imetafsiriwa kwa ujumla kuwa ‘mwingine’ bila kumtambulisha.
  alternative: Yohana Mbatizaji; Baba; au shahidi mwingine katika maana ya kimahakama.
  rationale: Aya yenyewe haitaji wazi anayelengwa. Tafsiri inahifadhi kiwango hicho cha kutotaja wazi badala ya kuamua suala la kifafanuzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Yuko mwingine’ ni muundo wa asili kwa mtu; urudiaji wa ‘ushuhuda/anaoutoa’ huhifadhi kwa kiasi mtindo wa Kiyohana bila kufanya sentensi kuwa nzito.
