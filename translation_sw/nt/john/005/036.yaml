id: JHN.5.36
reference: John 5:36
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐγὼ δὲ ἔχω τὴν μαρτυρίαν ⸀μείζω τοῦ Ἰωάννου, τὰ γὰρ ἔργα ἃ ⸀δέδωκέν μοι ὁ πατὴρ ἵνα τελειώσω αὐτά, αὐτὰ τὰ ἔργα ⸀ἃ ποιῶ, μαρτυρεῖ περὶ ἐμοῦ ὅτι ὁ πατήρ με ἀπέσταλκεν,
base_translation:
  language: en
  yaml_path: translation/nt/john/005/036.yaml
  text: But I have testimony greater than John's[a], for the works that the Father has given me to complete—these very works that I am doing—testify about me that the Father has sent me.
translation:
  language: sw
  text: Lakini mimi nina ushuhuda ulio mkuu kuliko wa Yohana[a], kwa maana kazi ambazo Baba amenipa nizikamilishe—kazi hizi zenyewe ninazofanya—zinanishuhudia kwamba Baba amenituma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ushahidi ulio mkuu kuliko wa Yohana.”
    reason: Neno μαρτυρία linaweza kuwasilisha wazo la ushuhuda au ushahidi; njia zote mbili zinadumisha maana ya uthibitisho katika muktadha huu.
lexical_decisions:
- source_word: μαρτυρίαν
  choice: ushuhuda
  rationale: Neno hili linadumisha maana ya kutoa uthibitisho kuhusu utambulisho na mamlaka ya Yesu, na linaendana kiasili na kitenzi “nina” katika Kiswahili.
- source_word: μείζω τοῦ Ἰωάννου
  choice: ulio mkuu kuliko wa Yohana
  rationale: “Mkuu kuliko” linaonyesha ulinganisho wa kiwango au uzito, huku “wa Yohana” likihifadhi ufupisho wa Kigiriki unaorejelea ushuhuda wa Yohana bila kuufafanua kupita kiasi.
- source_word: ἔργα
  choice: kazi
  rationale: “Kazi” linaweza kujumuisha matendo yote aliyopewa Yesu na Baba, yakiwemo lakini yasiyowekewa mipaka kuwa miujiza pekee.
- source_word: δέδωκέν μοι ὁ πατὴρ
  choice: Baba amenipa
  rationale: Wakati timilifu wa Kigiriki unaonyeshwa kwa “amenipa,” ukidokeza tendo lililotimizwa ambalo matokeo yake yanaendelea.
- source_word: ἵνα τελειώσω αὐτά
  choice: nizikamilishe
  rationale: Hili linaonyesha kusudi la kupewa kazi hizo na maana ya kuzifikisha kwenye utimilifu wake.
- source_word: αὐτὰ τὰ ἔργα ἃ ποιῶ
  choice: kazi hizi zenyewe ninazofanya
  rationale: “Hizi zenyewe” linahifadhi msisitizo wa αὐτά, na “ninazofanya” linaonyesha shughuli inayoendelea.
- source_word: μαρτυρεῖ περὶ ἐμοῦ
  choice: zinanishuhudia
  rationale: Usemi huu wa asili unaendeleza uwanja wa maana wa ushuhuda na unaonyesha kwamba kazi hizo hutoa uthibitisho kumhusu Yesu.
- source_word: ἀπέσταλκεν
  choice: amenituma
  rationale: “Amenituma” linaakisi wakati timilifu na umuhimu unaoendelea wa kutumwa kwa Yesu na Baba.
theological_decisions:
- issue: Asili ya ushuhuda unaomthibitisha Yesu
  choice: Kazi alizopewa Yesu na Baba zinatoa ushuhuda mkuu kuliko wa Yohana kwamba Baba amemtuma.
  alternative: Kuzitaja kazi hizo kuwa miujiza tu inayothibitisha mamlaka.
  rationale: ἔργα lina wigo mpana katika Yohana; tafsiri haipunguzi kazi hizo kuwa miujiza pekee wala haiongezi ufafanuzi ambao haupo katika mstari.
- issue: Jina ὁ πατήρ katika uhusiano wake na Yesu
  choice: Baba
  alternative: Mungu; Baba yangu
  rationale: Kigiriki kina ὁ πατήρ bila kivumishi cha umilikaji. “Baba” kinahifadhi jina hilo la kiuhusiano bila kuongeza “yangu” au kulibadili kuwa “Mungu.”
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye hadhi na inayoeleweka kwa urahisi. Muundo wa em dash umetumiwa kuhifadhi mkazo wa kirai cha Kigiriki bila kuufanya mstari kuwa mzito.
