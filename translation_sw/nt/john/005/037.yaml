  yaml_path: translation/nt/john/005/037.yaml
  text: And the Father who sent me—that one has testified about me[a]. You have neither ever heard his voice nor seen his form[b],
translation:
  language: sw
  text: Na Baba aliyenituma—yeye ameshuhudia juu yangu.[a] Hamjawahi kusikia sauti yake wala kuuona umbo lake,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Baba aliyenituma mwenyewe ameshuhudia juu yangu.” Neno la Kigiriki linalotafsiriwa “yeye” linamtilia mkazo Baba.
    reason: lexical_alternative
  - marker: b
    text: Au, “mwonekano wake.” Neno la Kigiriki linaweza kumaanisha umbo linaloonekana au mwonekano.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πέμψας με πατὴρ
  choice: Baba aliyenituma
  rationale: Kirai cha participio chenye kibainishi kinamtambulisha Baba kwa tendo la kumtuma Yesu; kishazi rejeshi ni cha asili na wazi katika Kiswahili.
- source_word: ἐκεῖνος
  choice: yeye
  rationale: Kiwakilishi huru baada ya mstari wa kukatiza kinarudia na kusisitiza ‘Baba’ bila ugumu wa usemi kama ‘huyo.’
- source_word: μεμαρτύρηκεν
  choice: ameshuhudia
  rationale: Kauli ya wakati timilifu inadokeza ushuhuda uliotolewa wenye umuhimu unaoendelea; ‘ameshuhudia’ huhifadhi maana hiyo na taswira ya shahidi.
- source_word: περὶ ἐμοῦ
  choice: juu yangu
  rationale: Ni njia ya kawaida ya Kiswahili ya kusema ‘kunihusu’ katika muktadha huu.
- source_word: οὔτε ... οὔτε
  choice: wala ... wala
  rationale: Muundo wa ukanushi unaohusianisha vipashio viwili unaakisiwa kwa kawaida kwa ‘wala ... wala,’ huku ukanushi mkuu ukiwa katika ‘hamjawahi.’
- source_word: φωνὴν αὐτοῦ
  choice: sauti yake
  rationale: φωνή katika muktadha wa kusikia humaanisha moja kwa moja ‘sauti.’
- source_word: πώποτε ἀκηκόατε
  choice: hamjawahi kamwe kuisikia
  rationale: ‘Hamjawahi’ huonyesha kutotokea kwa jambo wakati wowote hadi sasa, na ‘kamwe’ huhifadhi msisitizo wa πώποτε chini ya ukanushi.
- source_word: εἶδος αὐτοῦ
  choice: umbo wake
  rationale: εἶδος inaweza kumaanisha umbo linaloonekana au mwonekano; ‘umbo’ huhifadhi upana na mvutano huo kuliko ufafanuzi wa ziada.
- source_word: ἑωράκατε
  choice: kuuona
  rationale: 'Infinitivu inayotegemea ‘hamjawahi’ hutoa kwa kawaida maana ya timilifu: hawajapata kuuona hadi sasa.'
theological_decisions:
- issue: Msisitizo wa ἐκεῖνος unaomrejelea Baba
  choice: Kuhifadhi msisitizo katika matini kwa ‘—yeye ameshuhudia.’
  alternative: ‘Baba aliyenituma mwenyewe ameshuhudia’ au ‘Baba aliyenituma ameshuhudia’
  rationale: ‘Yeye’ iliyo huru inahifadhi urejeshaji wenye msisitizo wa demonstrativi bila kuongeza dai la kimafundisho au kufanya sentensi iwe nzito.
- issue: Maana ya εἶδος αὐτοῦ
  choice: ‘umbo wake’
  alternative: ‘mwonekano wake’
  rationale: ‘Umbo’ halilazimishi uamuzi kuhusu ikiwa kinachokusudiwa ni sura halisi inayoonekana, mwonekano, au utambuzi wa ufunuo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye staha. Mstari wa kukatiza unahifadhi msisitizo wa ἐκεῖνος. Koma ya mwisho imehifadhiwa kwa kuwa aya inaendelea katika sentensi inayofuata.
