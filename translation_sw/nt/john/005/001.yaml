base_translation:
  language: en
  yaml_path: translation/nt/john/005/001.yaml
  text: After these things[a], there was a feast of the Jews[b], and Jesus went up to Jerusalem.
translation:
  language: sw
  text: Baada ya hayo, kulikuwa na sikukuu[a] ya Wayahudi,[b] naye Yesu akapanda kwenda Yerusalemu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sikukuu ya kidini.”
    reason: lexical_alternative
  - marker: b
    text: Hapa neno “Wayahudi” linarejelea watu wa Kiyahudi kuhusiana na mojawapo ya sikukuu zao; katika baadhi ya miktadha mingine katika Yohana, neno la Kiyunani linaweza pia kumaanisha “Wayudea.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: Baada ya hayo
  rationale: Huhifadhi kishazi cha mpito na wingi wa ταῦτα kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: ἦν
  choice: kulikuwa na
  rationale: Muundo huu wa kutambulisha tukio ni wa asili katika Kiswahili na unaakisi kitenzi cha hali katika wakati uliopita.
- source_word: ἑορτὴ
  choice: sikukuu
  rationale: Neno hili linaeleza tukio la kidini la kusherehekewa; “sikukuu” ni la kawaida na linafaa katika muktadha wa Kiyahudi.
- source_word: τῶν Ἰουδαίων
  choice: ya Wayahudi
  rationale: Hapa umilikaji unaitambulisha sikukuu kuwa ya watu wa Kiyahudi, si hasa ya wakazi wa eneo la Uyahudi.
- source_word: ἀνέβη
  choice: akapanda kwenda
  rationale: Huhifadhi dhana ya kwenda juu kuelekea Yerusalemu, inayoweza kuhusisha mwinuko na lugha ya kawaida ya safari ya hija.
- source_word: Ἱεροσόλυμα
  choice: Yerusalemu
  rationale: Hili ndilo umbo sanifu la jina la mahali katika Kiswahili.
theological_decisions:
- issue: Maana ya Ἰουδαίων katika matumizi ya Yohana
  choice: Wayahudi
  alternative: Wayudea
  rationale: Kwa kuwa neno hilo linaelezea sikukuu, muktadha unaelekea kwa watu wa Kiyahudi na desturi yao ya kidini, si utambulisho wa wakazi wa Uyahudi pekee. Tanbihi inahifadhi uwezekano wa maana nyingine katika miktadha mingine ya Yohana.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Baada ya hayo” ni cha asili bila kufuta wingi wa kishazi cha Kiyunani; “akapanda kwenda” huhifadhi mwelekeo wa safari kuelekea Yerusalemu.
