  to: Kwa maana malaika alikuwa akishuka ndani ya bwawa mara kwa mara na kuyatikisa maji. Basi mtu wa kwanza kuingia baada ya maji kutikiswa angepona[a] ugonjwa wowote uliokuwa umemshika.
  rationale: Marekebisho yanahifadhi maana ya chanzo na uamuzi wa English POB wa kuonyesha hali ya tendo linalojirudia, kwa kubadili 'alipona' kuwa 'angepona.' Tanbihi imeboreshwa kwa mtindo wa Kiswahili na kwa usahihi wa kauli ya tahakiki ya maandishi; kiashiria chake kimehifadhiwa katika maandishi.
