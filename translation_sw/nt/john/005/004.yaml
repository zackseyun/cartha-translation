source:
  edition: robinson-pierpont-2005-byzantine
  text: Ἄγγελος γὰρ κατὰ καιρὸν κατέβαινεν ἐν τῇ κολυμβήθρᾳ, καὶ ἐτάρασσεν τὸ ὕδωρ· ὁ οὖν πρῶτος ἐμβὰς μετὰ τὴν ταραχὴν τοῦ ὕδατος, ὑγιὴς ἐγίνετο, ᾧ δήποτε κατείχετο νοσήματι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/005/004.yaml
  text: For an angel would go down into the pool from time to time and stir up the water. Therefore, the first one to step in after the stirring of the water would become well from whatever disease afflicted him.
translation:
  language: sw
  text: Kwa maana malaika alikuwa akishuka ndani ya bwawa mara kwa mara na kuyatikisa maji. Basi mtu wa kwanza kuingia baada ya maji kutikiswa angepona[a] ugonjwa wowote uliokuwa umemshika.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mstari huu, pamoja na sehemu ya mwisho ya mstari wa 3, haupatikani katika mafunjo ya kale zaidi ya Kigiriki (kama vile Papyrus 66 na Papyrus 75 ya karne ya 3) wala katika hati kuu za karne ya 4 (Sinaiticus na Vaticanus). Unapatikana katika mapokeo ya nakala nyingi za Kibizanti, na pia katika tafsiri za kale za Kilatini na Kisiria. Wasomi wengi huona kuwa ulikuwa nyongeza ya mapema ya wanakili, iliyokusudiwa kueleza kwa nini wagonjwa na wasiojiweza walikusanyika kwenye bwawa.
    reason: textual_critical
lexical_decisions:
- source_word: κατὰ καιρὸν
  choice: mara kwa mara
  rationale: Kirai hiki kinaonyesha tukio lililotokea nyakati mbalimbali, bila kudokeza ratiba maalumu.
- source_word: κατέβαινεν
  choice: alikuwa akishuka
  rationale: Kauli ya wakati usiotimilika inaonyesha tendo la kawaida au lililorudiwa katika wakati uliopita.
- source_word: ἐτάρασσεν
  choice: kuyatikisa
  rationale: Katika muktadha wa maji, kitenzi hiki huonyesha kuyavuruga au kuyafanya yasonge; 'kuyatikisa' ni wazi na ya kawaida.
- source_word: ὑγιὴς ἐγίνετο
  choice: alipona
  rationale: Kirai hiki kinamaanisha kuwa mzima; Kiswahili cha kawaida hutumia 'kupona', huku hali ya kurudiwa ikieleweka kutokana na sentensi ya masharti ya jumla.
- source_word: κατείχετο νοσήματι
  choice: ugonjwa wowote uliokuwa umemshika
  rationale: Kauli ya kutendwa ya κατέχω pamoja na νόσημα inaeleza mtu aliyesumbuliwa au kushikwa na ugonjwa; uchaguzi huu unahifadhi taswira ya kitenzi na unasikika kwa kawaida.
theological_decisions:
- issue: Hali ya dai kuhusu malaika na uponyaji
  choice: Kutafsiri dai hilo moja kwa moja kama lilivyo katika toleo la chanzo
  alternative: Kulipunguza kuwa imani au simulizi la watu waliokuwa bwawani
  rationale: Nakala ya Kigiriki iliyotolewa inalieleza moja kwa moja bila kulitaja kuwa imani ya watu; tafsiri haipaswi kuongeza ufafanuzi huo, huku tanbihi ikieleza suala la tofauti za nakala.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini kinachoeleweka kwa urahisi. Kiashiria cha tanbihi kimewekwa baada ya 'alipona' ili kuhusisha mstari mzima bila kukatiza mwanzo wa sentensi.
