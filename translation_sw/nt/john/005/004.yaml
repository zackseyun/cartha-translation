    issue: Alipona
    rationale: ἐγίνετο ni imperfect, sambamba na κατέβαινεν. 'Angepona' huonyesha matokeo ya kawaida yaliyotarajiwa kila maji yalipotikisika, badala ya tukio moja lililokamilika.
  - severity: low
    issue: Maneno ya tanbihi kuhusu nyongeza
    rationale: '''Nyongeza ya mapema ya mwandishi wa nakala'' si usemi wa kawaida sana na unaweza kudokeza mwandishi mmoja mahsusi. ''Nyongeza ya mapema ya wanakili'' ni ya asili na huhifadhi tathmini ya tahakiki ya maandishi.'
