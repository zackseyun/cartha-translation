  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠρώτησαν
  choice: wakamwuliza
  rationale: Kitenzi cha wakati uliopita, nafsi ya tatu wingi. ‘Wakamwuliza’ ni simulizi la kawaida na haliongezi wazo la uhasama lisilosemwa wazi.
- source_word: οὖν
  choice: Basi
  rationale: Huonyesha mwendelezo wenye matokeo kutoka mstari uliotangulia; ‘Basi’ ni ya kawaida na yenye hadhi katika simulizi la Kiswahili.
- source_word: αὐτόν
  choice: -m- katika ‘wakamwuliza’
  rationale: Kiwakilishi cha yambwa kinamrejelea mtu aliyeponywa na huunganishwa kiasili ndani ya kitenzi cha Kiswahili.
- source_word: Τίς ἐστιν ὁ ἄνθρωπος
  choice: Ni mtu gani
  rationale: Hili ni swali la moja kwa moja kuhusu utambulisho wa mwanamume mahususi; muundo huu ni wa asili katika Kiswahili cha sasa.
- source_word: ὁ εἰπών σοι
  choice: aliyekuambia
  rationale: Ingawa εἰπών kimsingi ni ‘aliyesema,’ katika muktadha wa maneno yaliyoelekezwa kwa mtu fulani, ‘aliyekuambia’ huwasilisha kwa kawaida maana ya kishiriki pamoja na σοι.
- source_word: Ἆρον
  choice: Ichukue
  rationale: Ni amri ya tendo moja. Yambwa haikutajwa katika Kigiriki, lakini Kiswahili huhitaji kiwakilishi cha yambwa hapa; ‘i-’ kinarejelea tandiko au godoro la mstari uliotangulia.
- source_word: καὶ περιπάτει
  choice: utembee
  rationale: Amri ya sasa inafuatia amri ya tendo moja. ‘Utembee’ ni Kiswahili cha kawaida na hakilazimishi maana ya kuendelea kutembea kuliko muktadha unavyothibitisha.
