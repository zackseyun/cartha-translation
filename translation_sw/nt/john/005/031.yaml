translation:
  language: sw
  text: Kama mimi natoa ushuhuda kuhusu mimi mwenyewe, ushuhuda wangu si wa kweli.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ushuhuda wangu hauna uhalali,” katika muktadha wa kisheria wa ushuhuda.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐὰν
  choice: Kama
  rationale: Hutambulisha sharti; “Kama” ni ya kawaida na haiongezi wazo la kurudiwa-rudiwa.
- source_word: ἐγὼ
  choice: mimi
  rationale: Kiwakilishi kilicho wazi katika Kigiriki kimehifadhiwa ili kuonyesha msisitizo mdogo kwa msemaji.
- source_word: μαρτυρῶ
  choice: ninajishuhudia
  rationale: Huhifadhi maana ya kutoa ushahidi, huku muundo wa Kiswahili ukisomeka kwa kawaida pamoja na “mwenyewe.”
- source_word: περὶ ἐμαυτοῦ
  choice: mwenyewe
  rationale: Katika sentensi hii, “ninajishuhudia mwenyewe” hutoa kwa ufupi maana ya kushuhudia kuhusu nafsi yangu bila kuongeza maana ya kufanya hivyo kwa maslahi yangu.
- source_word: ἡ μαρτυρία μου
  choice: ushuhuda wangu
  rationale: Huhifadhi uhusiano wa kimofolojia na kitenzi cha kushuhudia na pia muktadha wa ushahidi.
- source_word: οὐκ ἔστιν ἀληθής
  choice: si wa kweli
  rationale: Ni tafsiri ya moja kwa moja ya ἀληθής na inadumisha mvutano wa maana badala ya kuubana kuwa suala la uhalali wa kisheria pekee.
theological_decisions:
- issue: Maana ya Yesu kusema kwamba ushuhuda wake “si wa kweli”
  choice: si wa kweli
  alternative: hauna uhalali
  rationale: Maneno ya Kigiriki yana ἀληθής, “wa kweli.” Tafsiri kuu inadumisha kauli hiyo na mvutano wake na Yohana 8:14; muktadha wa kisheria unaweza kuashiria uhalali, lakini maana hiyo haipaswi kuchukua nafasi ya wording ya chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo “ninajishuhudia mwenyewe” umechaguliwa kwa ufasaha, huku tanbihi ikihifadhi maana mbadala ya kisheria.
