id: JHN.5.14
reference: John 5:14
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: μετὰ ταῦτα εὑρίσκει αὐτὸν ὁ Ἰησοῦς ἐν τῷ ἱερῷ καὶ εἶπεν αὐτῷ· Ἴδε ὑγιὴς γέγονας· μηκέτι ἁμάρτανε, ἵνα μὴ χεῖρόν ⸂σοί τι⸃ γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/014.yaml
  text: After these things Jesus found him in the temple and said to him[a], “See, you have become well. Sin no more[c][b], so that something worse may not happen to you.”
translation:
  language: sw
  text: Baada ya mambo hayo[a], Yesu alimkuta hekaluni, akamwambia, “Tazama, umepona[b]. Usitende dhambi tena, ili jambo baya zaidi lisije likakupata[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi zaidi, “Baada ya mambo haya.”
    reason: lexical_alternative
  - marker: b
    text: Kwa maana halisi zaidi, “umekuwa mzima,” ikisisitiza hali yake ya sasa kuwa matokeo ya badiliko lililotokea.
    reason: lexical_alternative
  - marker: c
    text: Onyo hili halisemi wazi kama ugonjwa wake wa awali ulisababishwa na dhambi fulani, wala kama “jambo baya zaidi” ni mateso ya hapa duniani, hukumu ya mwisho, au vyote viwili.
    reason: alternative_reading
lexical_decisions:
- source_word: μετὰ ταῦτα
  choice: Baada ya mambo hayo
  rationale: Huhifadhi wingi wa ταῦτα na mpangilio wa simulizi wa Yohana, huku ikiwa Kiswahili cha kawaida na kinachoeleweka.
- source_word: εὑρίσκει
  choice: alimkuta
  rationale: Wakati uliopo wa kihistoria wa Kigiriki umetafsiriwa kwa wakati uliopita, unaofaa zaidi katika simulizi la Kiswahili. “Alimkuta” ni wa kawaida zaidi hapa kuliko “alimpata,” ambalo lingeweza kudokeza kumtafuta kwa mafanikio.
- source_word: ἐν τῷ ἱερῷ
  choice: hekaluni
  rationale: ἱερόν hurejelea eneo la Hekalu kwa ujumla, si patakatifu pa ndani pekee. “Hekaluni” ni tafsiri fupi na ya kawaida bila kuongeza maelezo yasiyotajwa wazi.
- source_word: Ἴδε
  choice: Tazama
  rationale: Huhifadhi wito wa kuelekeza fikira bila kutumia lugha ya kizamani kupita kiasi.
- source_word: ὑγιὴς γέγονας
  choice: umepona
  rationale: Kauli hii ya Kiswahili huonyesha badiliko lililokamilika na hali njema inayodumu sasa. Tanbihi inahifadhi umbo la karibu zaidi na Kigiriki, “umekuwa mzima.”
- source_word: μηκέτι ἁμάρτανε
  choice: Usitende dhambi tena
  rationale: Hutoa amri ya kuacha dhambi kuanzia sasa bila kulazimisha wazo kwamba kitendo fulani cha dhambi kilikuwa kikiendelea bila kukoma.
- source_word: ἵνα μὴ χεῖρόν σοί τι γένηται
  choice: ili jambo baya zaidi lisije likakupata
  rationale: Huhifadhi kusudi au matokeo yanayokusudiwa pamoja na uwezekano wa jambo baya zaidi, kwa Kiswahili cha asili na wazi.
theological_decisions:
- issue: Uhusiano kati ya dhambi na mateso katika onyo la Yesu
  choice: Onyo limetafsiriwa moja kwa moja bila kusema kwamba ugonjwa wa awali ulisababishwa hakika na dhambi fulani, wala kufafanua jambo baya zaidi ni lipi.
  alternative: Kueleza kwamba ugonjwa wa awali ulikuwa adhabu ya dhambi maalumu, au kwamba jambo baya zaidi ni mateso ya hapa duniani pekee au hukumu ya mwisho pekee.
  rationale: Kigiriki kinaunganisha onyo la kutenda dhambi na uwezekano wa jambo baya zaidi, lakini hakielezi wazi uhusiano wa ugonjwa uliopita na dhambi fulani wala hali ya jambo baya zaidi. Tafsiri na tanbihi zinahifadhi mvutano huo wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. “Hekaluni” na “umepona” ni miundo ya kawaida, huku tanbihi zikihifadhi tofauti muhimu za kimsamiati na utata wa kiteolojia.
