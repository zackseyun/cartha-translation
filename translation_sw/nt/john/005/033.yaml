  text: You have sent to John[a], and he has testified to the truth.
translation:
  language: sw
  text: Ninyi mmetuma kwa Yohana, naye ameushuhudia[a] ukweli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ametoa ushuhuda kuhusu ukweli.”
    reason: Njia mbadala ya kutafsiri μεμαρτύρηκε τῇ ἀληθείᾳ, ikionyesha kwa uwazi zaidi uhusiano wa kutoa ushuhuda na ukweli.
lexical_decisions:
- source_word: ὑμεῖς
  choice: Ninyi
  rationale: Kiwakilishi kilichotajwa wazi katika Kigiriki kina mkazo wa kiasi; “Ninyi” huhifadhi mkazo huo kwa Kiswahili cha kawaida bila kuutia chumvi.
- source_word: ἀπεστάλκατε
  choice: mmetuma watu
  rationale: Wakati timilifu unaonyesha tendo la kutuma lililofanyika na lenye umuhimu katika mazungumzo ya sasa. Kiswahili huhitaji kwa kawaida kitu kilichotumwa; “watu” kinaeleweka kutokana na muktadha wa Yohana 1:19, bila kuwataja kwa undani zaidi kuliko chanzo.
- source_word: πρὸς Ἰωάννην
  choice: kwa Yohana
  rationale: “Kwa Yohana” ni usemi wa kawaida wa Kiswahili unaoonyesha kwamba watu waliotumwa walielekezwa kwake; jina limeachwa kuwa “Yohana” kama lilivyo katika Kigiriki.
- source_word: μεμαρτύρηκε
  choice: ameushuhudia
  rationale: Kauli ya wakati timilifu inaonyesha ushuhuda uliotolewa ambao bado una uzito. “Ameushuhudia” ni ya sasa, wazi, na huhifadhi lugha ya ushahidi.
- source_word: τῇ ἀληθείᾳ
  choice: ukweli
  rationale: Kitenzi “kushuhudia” kinaweza kuchukua yambwa moja kwa moja katika Kiswahili. “Ukweli” huhifadhi maana na mwangwi wa kiteolojia wa ἀλήθεια bila kuufafanua kupita chanzo.
theological_decisions:
- issue: Matumizi ya Yohana ya “ukweli”
  choice: ukweli
  alternative: kuhusu yaliyo kweli
  rationale: “Ukweli” huhifadhi uwezekano kwamba neno hilo lina uzito mpana wa kiteolojia katika Injili ya Yohana, bila kulifanya wazi kuwa fundisho maalumu lisilotajwa katika mstari.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa kawaida kwa wasomaji wengi, huku “Ninyi” ikihifadhi mkazo wa kiwakilishi cha Kigiriki. Neno “watu” limeongezwa kwa uwazi wa kisarufi na kimuktadha, kwa kuwa Kiswahili “mmetuma kwa Yohana” kingesikika pungufu.
