  text: In these lay a multitude of the sick[a], blind, lame, and paralyzed.
translation:
  language: sw
  text: 'Katika hayo, umati wa wagonjwa ulikuwa umelala: vipofu, viwete, na wenye viungo vilivyokauka.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “waliopooza.” Neno la Kigiriki kwa maana halisi ni “kavu” au “iliyokauka,” huenda likirejelea viungo vilivyokauka au vilivyosinyaa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ταύταις
  choice: Katika hayo
  rationale: Kiashiria cha kike cha wingi kinarejelea miundo iliyotajwa katika mstari uliotangulia. Tafsiri hii inahifadhi rejeo hilo bila kuongeza nomino isiyopo katika mstari huu.
- source_word: κατέκειτο
  choice: ulikuwa umelala
  rationale: Kitenzi cha wakati usiotimilifu kinaonyesha hali ya kulala au kuwa amelazwa; umoja unapatana na nomino ya pamoja “umati.”
- source_word: πλῆθος
  choice: umati
  rationale: Neno hili linaonyesha idadi kubwa ya watu kama kundi. “Umati” ni la kawaida, lenye hadhi, na linahifadhi maana ya pamoja.
- source_word: τῶν ἀσθενούντων
  choice: wa wagonjwa
  rationale: Katika muktadha huu kitenzi-shirikishi kinamaanisha watu wenye maradhi au udhaifu wa mwili, hivyo “wagonjwa” ni wazi na ya asili.
- source_word: τυφλῶν
  choice: vipofu
  rationale: Ni kisawe cha moja kwa moja na cha kawaida kwa watu wasioweza kuona.
- source_word: χωλῶν
  choice: viwete
  rationale: Neno la Kigiriki linarejelea watu wenye ulemavu wa kutembea. “Viwete” ni fupi na linafaa katika orodha hii.
- source_word: ξηρῶν
  choice: waliopooza
  rationale: Maana ya msingi ni “waliokauka” au “walionyauka,” hasa kuhusu viungo; katika muktadha wa hali za mwili, “waliopooza” huwasilisha kwa kawaida athari inayokusudiwa, huku maana halisi ikihifadhiwa katika tanbihi.
