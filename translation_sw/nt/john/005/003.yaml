translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi unabaki mfupi na unaosomeka kwa urahisi; kistari kirefu kinaonyesha kwamba makundi yanayofuata yanafafanua wagonjwa waliotajwa.
