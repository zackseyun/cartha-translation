  text: καὶ τὸν λόγον αὐτοῦ οὐκ ἔχετε ⸂ἐν ὑμῖν μένοντα⸃, ὅτι ὃν ἀπέστειλεν ἐκεῖνος τούτῳ ὑμεῖς οὐ πιστεύετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/038.yaml
  text: And you do not have his word abiding in you[a], because you do not believe the one whom he sent.
translation:
  language: sw
  text: Nanyi hamna neno lake linalodumu ndani yenu,[a] kwa sababu hamwamini huyo ambaye alimtuma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “linalokaa ndani yenu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λόγον
  choice: neno
  rationale: “Neno” linaonyesha ufunuo au ujumbe wa Mungu na pia linahifadhi msamiati muhimu wa Yohana bila kuufanya kuwa ujumbe wa kawaida tu.
- source_word: ἔχετε
  choice: hamna
  rationale: 'Kitenzi hiki kinaonyesha hali yao ya sasa: hawana neno la Mungu ndani yao. “Hamna” ni tafsiri ya moja kwa moja na ya kawaida katika Kiswahili.'
- source_word: ἐν ὑμῖν μένοντα
  choice: linalodumu ndani yenu
  rationale: “Linalodumu” linahifadhi wazo la kuendelea kuwapo, ambalo limo katika μένω, na linaunganika kwa kawaida na “neno.” “Linalokaa” ni chaguo jingine linalowezekana na limewekwa katika tanbihi.
- source_word: ὅτι
  choice: kwa sababu
  rationale: Hapa ὅτι inaanzisha sababu ya wao kutokuwa na neno la Mungu linalodumu ndani yao.
- source_word: ὃν ἀπέστειλεν ἐκεῖνος
  choice: huyo ambaye yeye alimtuma
  rationale: Maneno haya yanamtaja Yesu kuwa ndiye aliyetumwa na Baba. Muundo huu unahifadhi tendo la Baba la kumtuma bila kuingiza jina lisilotajwa wazi katika mstari.
- source_word: τούτῳ
  choice: huyo
  rationale: Kiwakilishi hiki kimetangulizwa katika Kigiriki kwa ajili ya msisitizo na kinamrejelea Yesu. “Huyo” kinadumisha msisitizo huo kwa Kiswahili cha kawaida.
- source_word: πιστεύετε
  choice: hamwamini
  rationale: πιστεύω ikiwa na mtendewa hapa ina maana ya kumwamini mtu. “Hamwamini” ni ya moja kwa moja na haiongezi ufafanuzi wa kiteolojia usiotajwa.
theological_decisions:
- issue: Uhusiano kati ya neno la Mungu kudumu ndani yao na kutomwamini aliyetumwa
  choice: Mstari unaonyesha kwamba kutomwamini yule aliyetumwa na Baba ndiyo sababu au ushahidi kwamba hawana neno la Mungu linalodumu ndani yao.
  alternative: Inaweza kueleweka hasa kuwa hawalihifadhi wala kulitii Neno la Mungu kwa ndani, bila kuwa kauli maalumu kuhusu kuzaliwa upya au kukaliwa na Roho.
  rationale: Tafsiri inadumisha uhusiano wa sababu uliopo katika ὅτι na mvutano wa kiteolojia wa kifungu, bila kuingiza fundisho maalumu kuhusu kuzaliwa upya, kudumu katika wokovu, au kutiwa nuru.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. “Nanyi hamna” hudumisha muunganiko wa καί na sentensi iliyotangulia; “yeye” imetumiwa ili kuonyesha wazi kwamba mtendaji wa “alimtuma” ni tofauti na “huyo,” ingawa rejeleo lake kwa Baba linategemea muktadha kama lilivyo katika Kigiriki.
