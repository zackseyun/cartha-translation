lexical_decisions:
- source_word: δόξαν
  choice: utukufu
  rationale: Neno δόξα katika muktadha huu linaweza kumaanisha heshima, sifa, au kuthaminiwa na wengine. “Utukufu” huhifadhi uhusiano wa kileksia na mada pana ya utukufu katika Injili ya Yohana, huku tanbihi ikionyesha maana nyingine zinazowezekana.
- source_word: παρὰ ἀνθρώπων
  choice: kutoka kwa wanadamu
  rationale: παρά pamoja na hali ya genitivi huonyesha chanzo, yaani “kutoka kwa.” ἀνθρώπων hapa ni wingi wenye maana ya jumla ya wanadamu; “wanadamu” ni Kiswahili cha kawaida na chenye staha kinachohifadhi tofauti kati ya kibinadamu na kimungu.
- source_word: οὐ λαμβάνω
  choice: Sipokei
  rationale: λαμβάνω humaanisha “kupokea” au “kukubali.” “Sipokei” ni tafsiri ya moja kwa moja ya wakati uliopo na haisukumii ndani ya matini wazo la “kutafuta,” ambalo halijasemwa wazi katika Kigiriki.
theological_decisions:
- issue: Maana ya kauli ya Yesu kuhusu kukubaliwa na wanadamu
  choice: Kauli inabaki kuwa kukataa kupokea utukufu kutoka kwa wanadamu, bila kuongeza maelezo kwamba utume au utambulisho wake hautegemei sifa zao.
  alternative: Kutafsiri kauli kuwa Yesu hatafuti sifa za wanadamu, au kwamba hapokei kamwe heshima yoyote kutoka kwa mtu yeyote.
  rationale: Muktadha unaelekeza kwenye kutotegemea sifa za wanadamu kama uthibitisho, lakini Kigiriki kinasema “sipokei,” si “sitafuti.” Tafsiri ya karibu na chanzo huhifadhi mvutano huo bila kuufafanua kupita kiasi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; sentensi ni fupi, ya asili, na yenye staha. “Wanadamu” huepuka kueleweka kama wanaume pekee na huwasilisha maana ya jumla ya ἀνθρώπων.
