  text: Kulikuwa na mtu mmoja pale ambaye alikuwa mgonjwa kwa miaka thelathini na minane[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliyekuwa na udhaifu wa mwili” au “aliyekuwa na maradhi.” Neno la Kigiriki ἀσθένεια linaweza kumaanisha kwa upana udhaifu wa mwili au ugonjwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δέ
  choice: Palikuwa na
  rationale: δέ ni kiunganishi hafifu kinachoendeleza simulizi; muundo huu wa Kiswahili unamtambulisha mhusika bila kuongeza wazo la wakati au upinzani mkali.
- source_word: τις ἄνθρωπος
  choice: mtu mmoja
  rationale: Muundo huu wa kawaida unaonyesha mtu asiyeainishwa, bila kutumia usemi mzito au wa kizamani.
- source_word: ἐκεῖ
  choice: pale
  rationale: Inaelekeza mahali pa tukio palipotajwa katika muktadha uliotangulia.
- source_word: τριάκοντα ὀκτὼ ἔτη
  choice: miaka thelathini na minane
  rationale: Hii ndiyo namna ya kawaida na wazi ya kutaja idadi hiyo kwa Kiswahili.
- source_word: ἔχων
  choice: ambaye alikuwa ... kwa
  rationale: Kirai hiki kinaonyesha hali iliyoendelea kwa kipindi kilichotajwa; Kiswahili cha kawaida kinahitaji kishazi chenye kitenzi.
- source_word: ἐν τῇ ἀσθενείᾳ αὐτοῦ
  choice: katika ugonjwa wake
  rationale: Huhifadhi muundo wa kirai cha Kigiriki na maana pana ya hali ya kimwili bila kubainisha aina ya maradhi kuliko chanzo kinavyofanya.
