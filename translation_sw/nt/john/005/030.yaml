  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Οὐ δύναμαι ἐγὼ ποιεῖν ἀπ’ ἐμαυτοῦ οὐδέν· καθὼς ἀκούω κρίνω, καὶ ἡ κρίσις ἡ ἐμὴ δικαία ἐστίν, ὅτι οὐ ζητῶ τὸ θέλημα τὸ ἐμὸν ἀλλὰ τὸ θέλημα τοῦ πέμψαντός ⸀με.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/030.yaml
  text: I am not able to do anything from myself. Just as I hear[a], I judge, and my judgment is just, because I do not seek my own will, but the will of the one who sent me.
translation:
  language: sw
  text: Mimi siwezi kufanya jambo lolote kwa nafsi yangu mwenyewe.[a] Kama vile ninavyosikia, ndivyo ninavyohukumu; na hukumu yangu ni ya haki, kwa sababu sitafuti mapenzi yangu mwenyewe, bali mapenzi ya yule aliyenituma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mimi siwezi kufanya jambo lolote kwa kujitegemea.” Kirai cha Kigiriki kinaweza kusisitiza kutotenda kwa kujitegemea; “kwa nafsi yangu mwenyewe” pia huwasilisha kwamba tendo hilo halitokani na yeye pekee.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ δύναμαι ἐγὼ
  choice: Mimi siwezi
  rationale: Huhifadhi ukanushaji wa uwezo katika δύναμαι na msisitizo wa kiwakilishi ἐγώ kwa kutaja wazi “Mimi.”
- source_word: ποιεῖν ἀπ’ ἐμαυτοῦ οὐδέν
  choice: kufanya jambo lolote kutoka kwangu mwenyewe
  rationale: “Kutoka kwangu mwenyewe” huhifadhi wazo la chanzo pamoja na kutotenda kwa kujitegemea; “jambo lolote” ni Kiswahili cha kawaida chini ya ukanushaji.
- source_word: καθὼς ἀκούω κρίνω
  choice: Kama vile ninavyosikia, ndivyo ninavyohukumu
  rationale: Muundo wa “kama vile ... ndivyo ...” unaonyesha wazi ulinganifu wa καθὼς kati ya kusikia na kuhukumu.
- source_word: ἡ κρίσις ἡ ἐμὴ δικαία ἐστίν
  choice: hukumu yangu ni ya haki
  rationale: “Hukumu” hudumisha uhusiano wa kileksika na “ninavyohukumu,” na “ya haki” inafaa katika muktadha wa kimahakama.
- source_word: οὐ ζητῶ τὸ θέλημα τὸ ἐμὸν
  choice: sitafuti mapenzi yangu mwenyewe
  rationale: “Sitafuti” huhifadhi maana ya lengo au nia ya ζητῶ, huku “yangu mwenyewe” ikionyesha msisitizo wa umilikaji katika Kigiriki.
- source_word: ἀλλὰ τὸ θέλημα τοῦ πέμψαντός με
  choice: bali mapenzi ya yule aliyenituma
  rationale: Hutafsiri kirai-shirikishi kwa njia ya kawaida na haiongezi wazi neno “Baba,” ambalo halipo katika mstari huu.
theological_decisions:
- issue: Uhusiano wa tendo la Mwana na aliyemtuma katika ἀπ’ ἐμαυτοῦ
  choice: kutoka kwangu mwenyewe
  alternative: kwa kujitegemea / peke yangu
  rationale: Kauli huhifadhi wazo la chanzo na kutotenda kwa kujitenga bila kuigeuza kuwa ufafanuzi wa kidhehebu au madai ya kutokuwa na uwezo kabisa.
- issue: Maana ya δικαία pamoja na κρίσις
  choice: hukumu yangu ni ya haki
  alternative: hukumu yangu ni adilifu / hukumu yangu ni ya uadilifu
  rationale: “Ya haki” ni ya kawaida, yenye hadhi, na inawasilisha usahihi na uadilifu wa hukumu katika muktadha wa kimahakama.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi unabaki karibu na Kigiriki lakini unasomeka kwa kawaida; istilahi “hukumu” na “mapenzi” hudumisha maana kuu za Yohana.
