base_translation:
  language: en
  yaml_path: translation/nt/john/005/009.yaml
  text: And immediately the man became well[a], and he picked up his mat and began to walk[c][b]. Now that day was a Sabbath.
translation:
  language: sw
  text: Mara moja mtu huyo akawa mzima, akachukua mkeka wake[a] akaanza kutembea.[b] Siku hiyo ilikuwa Sabato.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kitanda chake.” Neno la Kigiriki linamaanisha mkeka, godoro jepesi, au kifaa rahisi cha kulalia kinachoweza kubebwa.
    reason: lexical_alternative
  - marker: b
    text: Au, “alikuwa akitembea.” Umbo la kitenzi cha Kigiriki linaweza kusisitiza tendo lililoendelea; katika muktadha huu linaweza pia kueleweka kuwa alianza kutembea baada ya kuponywa.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθέως
  choice: Mara moja
  rationale: Ni usemi wa kawaida na wenye heshima unaoonyesha kwamba kupona kulitokea papo hapo.
- source_word: ἐγένετο ὑγιὴς
  choice: akawa mzima
  rationale: Huhifadhi wazo la kubadilika kwa hali ya mtu na kuwa mwenye afya bila kuongeza wazi mtendaji ambaye muundo wa Kigiriki hautaji.
- source_word: ὁ ἄνθρωπος
  choice: mtu huyo
  rationale: Humrejelea kwa kawaida mtu maalumu aliyetajwa katika simulizi; muktadha tayari unaonyesha kuwa ni mwanamume.
- source_word: ἦρε
  choice: akachukua
  rationale: Katika muktadha huu kitenzi kinamaanisha kuinua kitu na kwenda nacho; ‘akachukua’ ni Kiswahili cha kawaida na kinaeleweka wazi.
- source_word: κράβαττον
  choice: mkeka
  rationale: Neno hilo linataja kifaa rahisi cha kulalia kinachoweza kubebwa, si lazima kitanda kikubwa cha samani. ‘Mkeka’ huwasilisha vizuri hali hiyo.
- source_word: περιεπάτει
  choice: kuanza kutembea
  rationale: Kauli ya wakati usiotimilika inaweza kueleza tendo lililoendelea au kuanza kwa tendo. Katika muktadha wa kuponywa, usemi huu unaonyesha kwa kawaida kwamba uwezo wake wa kutembea ulirejeshwa, huku uwezekano wa ‘alikuwa akitembea’ ukibainishwa katika tanbihi.
- source_word: Ἦν δὲ
  choice: Siku hiyo ilikuwa
  rationale: δέ inaleta maelezo ya kimazingira kuhusu siku hiyo bila kuhitaji kiunganishi chenye maana kali ya upinzani.
- source_word: σάββατον
  choice: Sabato
  rationale: Kiswahili hakina vibainishi vinavyolingana moja kwa moja na ‘a/the’; ‘Sabato’ hutaja kwa kawaida siku takatifu ya Kiyahudi na kuweka msingi wa mvutano unaofuata.
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: Siku hiyo
  rationale: Hii ndiyo njia ya kawaida na sahihi ya Kiswahili ya kueleza kirai hicho cha wakati.
theological_decisions:
- issue: Jinsi ya kutafsiri σάββατον katika taarifa ya kisimulizi
  choice: Sabato
  alternative: ile Sabato
  rationale: Kigiriki hakina kibainishi hapa, lakini Kiswahili halihitaji kuonyesha tofauti ya ‘a’ na ‘the.’ ‘Sabato’ ni ya kawaida, haiongezi umaalumu usiotajwa, na hudumisha taarifa ya siku inayotanguliza mabishano yanayofuata.
- issue: Namna ya kuonyesha hali ya kupona katika ἐγένετο ὑγιὴς
  choice: akawa mzima
  alternative: akaponywa
  rationale: ‘Akawa mzima’ hufuata kwa karibu muundo wa Kigiriki unaoeleza mabadiliko ya hali. ‘Akaponywa’ lingeweka muundo wa kutendwa ulio wazi zaidi kuliko ulivyo katika kifungu hiki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya kisimulizi. Sentensi ni rahisi kueleweka kwa msomaji wa kawaida. ‘Mara moja’ na mfuatano wa ‘akawa… akachukua… na kuanza…’ hudumisha kasi ya simulizi; ‘Sabato’ linaandikwa kwa herufi kubwa kama jina la siku takatifu ya Kiyahudi.
