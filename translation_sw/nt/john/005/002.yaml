base_translation:
  language: en
  yaml_path: translation/nt/john/005/002.yaml
  text: There is in Jerusalem[a], by the Sheep Gate, a pool called Bethesda in Hebrew[c][b], having five porticoes.
translation:
  language: sw
  text: Yerusalemu kuna bwawa karibu na Lango la Kondoo[c], linaloitwa kwa Kiebrania[a] Bethesda[b], na lina kumbi tano zenye nguzo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa Kiaramu.” Katika Injili ya Yohana, usemi “kwa Kiebrania” mara nyingi unaweza kumaanisha lugha ya Kisemiti ya wenyeji wa Yudea, si lazima Kiebrania kwa maana finyu.
    reason: lexical_alternative
  - marker: b
    text: Baadhi ya hati zina “Bethzatha” au “Bethsaida” badala ya “Bethesda.”
    reason: textual_variant
  - marker: c
    text: Kirai cha Kigiriki kinaelekea kumaanisha eneo la Lango la Kondoo (linganisha Nehemia 3:1; 12:39), ingawa neno “Lango” halijaandikwa wazi katika mstari huu.
    reason: cross_reference
lexical_decisions:
- source_word: ἔστιν δὲ
  choice: kuna
  rationale: Kitenzi cha wakati uliopo kinahifadhiwa kwa “kuna.” Kiunganishi δέ ni chepesi, hivyo hakihitaji neno lenye kuonyesha upinzani mkali.
- source_word: ἐν τοῖς Ἱεροσολύμοις
  choice: Huko Yerusalemu
  rationale: “Yerusalemu” ni umbo la kawaida la jina hili katika Kiswahili; “huko” huanzisha mahali kwa mtiririko wa kawaida.
- source_word: ἐπὶ τῇ προβατικῇ
  choice: karibu na Lango la Kondoo
  rationale: Kirai cha Kigiriki kimeacha nomino ieleweke. Kwa kuzingatia mazingira ya Yerusalemu na kwa kuwa κολυμβήθρα ndiyo bwawa linalotajwa, maana inayowezekana zaidi ni eneo la Lango la Kondoo. Neno lililoongezwa “Lango” linaelezwa katika tanbihi.
- source_word: κολυμβήθρα
  choice: bwawa
  rationale: “Bwawa” ni neno la kawaida na linaloeleweka kwa dimbwi au hifadhi ya maji inayokusudiwa hapa.
- source_word: ἡ ἐπιλεγομένη
  choice: huitwa
  rationale: Hutoa kwa kawaida maana ya jina ambalo bwawa linajulikana nalo.
- source_word: Ἑβραϊστὶ
  choice: kwa Kiebrania
  rationale: Tafsiri kuu inafuata moja kwa moja neno la Kigiriki, huku tanbihi ikihifadhi uwezekano kwamba linamaanisha lugha ya Kisemiti ya eneo hilo, yaani Kiaramu.
- source_word: Βηθεσδά
  choice: Bethesda
  rationale: Hufuata usomaji wa SBLGNT uliotolewa; tofauti za maandishi zimewekwa katika tanbihi.
- source_word: πέντε στοὰς ἔχουσα
  choice: lina njia tano zenye paa na safu za nguzo
  rationale: στοά ni njia au ukumbi uliofunikwa na paa na kuzungukwa au kutegemezwa na safu ya nguzo. Ufafanuzi huu ni sahihi na unaeleweka kuliko kutumia istilahi ya usanifu isiyo ya kawaida.
