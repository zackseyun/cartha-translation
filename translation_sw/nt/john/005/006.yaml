  text: τοῦτον ἰδὼν ὁ Ἰησοῦς κατακείμενον, καὶ γνοὺς ὅτι πολὺν ἤδη χρόνον ἔχει, λέγει αὐτῷ· Θέλεις ὑγιὴς γενέσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/john/005/006.yaml
  text: When Jesus saw this man lying there[a], and knew that he had already been there a long time, he said to him, “Do you want to become well?”
translation:
  language: sw
  text: Yesu alipomwona mtu huyo amelala pale, na alipojua kwamba tayari alikuwa katika hali hiyo kwa muda mrefu,[a] akamwuliza, “Je, unataka kupona?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwamba tayari alikuwa pale kwa muda mrefu.”
    reason: Kigiriki hakitaji wazi muda huo unahusu hali yake au kukaa kwake mahali hapo.
lexical_decisions:
- source_word: τοῦτον
  choice: mtu huyo
  rationale: Kiwakilishi cha kuonyesha kinamrejelea wazi mtu maalumu aliyetajwa katika muktadha; “mtu huyo” ni Kiswahili cha kawaida na huweka rejeleo wazi.
- source_word: ἰδὼν
  choice: alipomwona
  rationale: Kirai cha wakati kinawasilisha kwa Kiswahili fasaha kitendo cha kuona kilichotangulia usemi mkuu.
- source_word: κατακείμενον
  choice: amelala pale
  rationale: Huonyesha kwamba mtu huyo alikuwa amelala chini mahali hapo; “pale” linaunganisha hali yake na mazingira ya simulizi bila kudai kwamba muda mrefu uliotajwa lazima ulikuwa muda wake mahali hapo.
- source_word: γνοὺς
  choice: na kujua
  rationale: Huwasilisha ufahamu wa Yesu bila kueleza alipataje habari hiyo, jambo ambalo chanzo hakilibainishi.
- source_word: πολὺν ἤδη χρόνον ἔχει
  choice: tayari alikuwa katika hali hiyo kwa muda mrefu
  rationale: Kigiriki kwa kifupi kinasema kwamba tayari ‘ana muda mrefu’; muktadha unaelekeza kwenye hali yake. Tafsiri hii ni ya asili na haiingizi dai lisilo wazi kwamba alikuwa amekaa kando ya bwawa muda wote huo.
- source_word: λέγει αὐτῷ
  choice: akamwuliza
  rationale: Ingawa kitenzi cha Kigiriki ni wakati uliopo wa kihistoria, wakati uliopita wa kisimulizi ni wa kawaida katika Kiswahili. Kwa kuwa maneno yanayofuata ni swali, “akamwuliza” ni fasaha na sahihi kimuktadha.
- source_word: Θέλεις
  choice: unataka
  rationale: Ni usemi wa moja kwa moja na wa kawaida wa kutaja nia au tamaa katika Kiswahili cha sasa.
- source_word: ὑγιὴς γενέσθαι
  choice: kupona
  rationale: Katika muktadha wa ugonjwa, “kupona” huwasilisha kwa kawaida kuingia katika hali ya kuwa mzima, yaani nguvu ya γενέσθαι pamoja na ὑγιής.
theological_decisions:
- issue: Namna Yesu alivyopata kujua (γνοὺς)
  choice: Kutaja tu kwamba Yesu alijua, bila kueleza chanzo cha ujuzi huo.
  alternative: Kusema kwamba alijua kwa njia ya kimiujiza au kwamba alifahamu kwa uchunguzi au taarifa ya kawaida.
  rationale: Aya haisemi Yesu alijuaje; tafsiri inadumisha ukimya na mvutano huo wa maandishi.
- issue: Muda mrefu unahusu nini katika πολὺν ἤδη χρόνον ἔχει
  choice: Kuutaja kama muda wa hali yake, huku kuweka tanbihi kuhusu uwezekano wa muda aliokuwa pale.
  alternative: Kusema katika matini kuu kwamba alikuwa pale kwa muda mrefu.
  rationale: Muundo wa Kigiriki hauna kijalizo kilichotajwa wazi. Muktadha wa karibu na aya ya 5 unaunga mkono hali yake, lakini uwezekano wa kuhusisha muda na kukaa pale unastahili kuhifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Je” linaweka swali wazi bila kufanya usemi kuwa mzito; “kupona” ni la kawaida na linafaa katika muktadha wa uponyaji.
