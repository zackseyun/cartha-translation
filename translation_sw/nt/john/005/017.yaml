translation:
  language: sw
  text: Lakini akawajibu[a], “Baba yangu anafanya kazi mpaka sasa, nami pia ninafanya kazi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Baba yangu anaendelea kufanya kazi mpaka sasa, nami pia ninaendelea kufanya kazi.” Wakati wa sasa wa Kigiriki unaweza kutafsiriwa kwa kauli ya kawaida au kwa kauli inayosisitiza tendo linaloendelea.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Lakini
  rationale: Kiunganishi hiki kinaonyesha utofautishaji mdogo na shutuma zilizotangulia; “Lakini” ni ya kawaida na wazi katika muktadha huu.
- source_word: ἀπεκρίνατο αὐτοῖς
  choice: akawajibu
  rationale: Hii ni tafsiri fupi na ya kawaida ya kitenzi pamoja na yambwa yake; kiambishi “-wa-” kinawakilisha “wao.”
- source_word: Ὁ πατήρ μου
  choice: Baba yangu
  rationale: Inahifadhi usemi wa moja kwa moja wa Yesu na uzito wake wa kibinafsi na kitheolojia bila kuongeza ufafanuzi.
- source_word: ἕως ἄρτι
  choice: mpaka sasa
  rationale: Kirai hiki huonyesha kwamba tendo limeendelea hadi wakati wa sasa; “mpaka sasa” ni sawia na ya kawaida katika Kiswahili.
- source_word: ἐργάζεται
  choice: anaendelea kufanya kazi
  rationale: Hufanya hali ya tendo linaloendelea iwe wazi katika Kiswahili, hasa ikiambatana na “mpaka sasa.”
- source_word: κἀγὼ
  choice: nami pia
  rationale: Inahifadhi msisitizo wa nyongeza unaomweka Yesu sambamba na utendaji wa Baba.
- source_word: ἐργάζομαι
  choice: ninafanya kazi
  rationale: Wakati wa sasa unaonyesha utendaji wa Yesu unaoendelea na kudumisha usambamba na kauli kuhusu Baba.
theological_decisions:
- issue: Uhusiano kati ya kazi ya Yesu na kazi ya Baba siku ya Sabato
  choice: “Baba yangu anaendelea kufanya kazi mpaka sasa, nami pia ninafanya kazi.”
  alternative: “Baba yangu hufanya kazi mpaka sasa, nami pia hufanya kazi.”
  rationale: Tafsiri inadumisha usambamba wa makusudi kati ya utendaji wa Baba na wa Yesu bila kuupunguza wala kuongeza maelezo kuhusu Sabato, mamlaka ya Mungu, au usawa wao.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya sasa, wazi na yenye heshima. “Anaendelea kufanya kazi” imetumiwa kuonyesha mwendelezo unaodokezwa na wakati wa sasa pamoja na “mpaka sasa,” huku tanbihi ikihifadhi uwezekano wa kauli ya wakati wa sasa kwa ujumla.
