  text: οὐδὲ γὰρ ὁ πατὴρ κρίνει οὐδένα, ἀλλὰ τὴν κρίσιν πᾶσαν δέδωκεν τῷ υἱῷ,
base_translation:
  language: en
  yaml_path: translation/nt/john/005/022.yaml
  text: For the Father judges no one, but has given all judgment to the Son,
translation:
  language: sw
  text: Kwa maana Baba hamhukumu mtu yeyote, bali amempa Mwana hukumu yote.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐδὲ γὰρ
  choice: Kwa maana
  rationale: Kiunganishi hiki kinaendeleza maelezo ya muktadha uliotangulia. “Kwa maana” kinawasilisha kwa Kiswahili cha kawaida nguvu ya ufafanuzi ya γάρ bila kulazimisha οὐδέ kuwa neno tofauti.
- source_word: ὁ πατὴρ
  choice: Baba
  rationale: Katika muktadha wa Yohana, hili ni jina la cheo linalomtaja Mungu katika uhusiano wake na Mwana; herufi kubwa inaonyesha matumizi hayo ya kipekee.
- source_word: κρίνει
  choice: hamhukumu
  rationale: Wakati uliopo unaeleza hali ya jumla. “Hamhukumu” hudumisha uhusiano wa kitenzi na nomino “hukumu” baadaye na haifupishi maana kuwa kuhukumu kwa hatia pekee.
- source_word: οὐδένα
  choice: mtu yeyote
  rationale: Pamoja na ukanushi katika “hamhukumu,” usemi huu unaonyesha ukanushi unaomhusu kila mtu kwa Kiswahili cha asili.
- source_word: ἀλλὰ
  choice: bali
  rationale: “Bali” linaonyesha kwa wazi tofauti kubwa kati ya Baba kutomhukumu mtu yeyote na kumpa Mwana hukumu yote.
- source_word: τὴν κρίσιν πᾶσαν
  choice: hukumu yote
  rationale: Tafsiri hii inadumisha nomino κρίσις na upeo kamili wa πᾶσαν bila kuongeza kwa ufafanuzi maneno “mamlaka ya kuhukumu,” ingawa dhana hiyo inahusiana na muktadha.
- source_word: δέδωκεν
  choice: amempa
  rationale: Muundo wa wakati timilifu unaonyesha tendo lililokamilika lenye matokeo yanayoendelea; “amempa” huwasilisha hali hiyo kwa Kiswahili cha kawaida.
- source_word: τῷ υἱῷ
  choice: Mwana
  rationale: Kigiriki kina kibainishi pamoja na “Mwana” bila kiwakilishi cha kumiliki. Katika Yohana, “Mwana” ni jina la cheo lenye uzito wa kikristolojia, kwa hiyo limehifadhiwa.
theological_decisions:
- issue: Uhusiano kati ya Baba kuhukumu na Mwana kuhukumu
  choice: 'Kauli imetafsiriwa moja kwa moja: Baba hamhukumu mtu yeyote, bali amempa Mwana hukumu yote.'
  alternative: Kufafanua kuwa Baba hamhukumu mtu yeyote bila ya Mwana, au kuifanya hukumu yote kuwa hukumu ya mwisho tu.
  rationale: Tafsiri inadumisha dai la moja kwa moja na mvutano wake wa kiteolojia bila kuongeza masharti ya kuoanisha ambayo hayapo katika Kigiriki.
- issue: Jina la cheo la kikristolojia “Mwana”
  choice: Kudumisha “Mwana” kama jina la cheo.
  alternative: Kutafsiri “mwana wake.”
  rationale: Andiko halina kiwakilishi cha kumiliki, na jina hili la cheo ni muhimu kwa uhusiano wa Baba na Mwana katika muktadha wa Yohana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo ni wa asili bila kupunguza dai la moja kwa moja la andiko.
