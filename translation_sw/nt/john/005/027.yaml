  yaml_path: translation/nt/john/005/027.yaml
  text: And he gave him authority to execute judgment[a], because he is the Son of Man.
translation:
  language: sw
  text: Naye akampa mamlaka ya kutekeleza hukumu, kwa sababu yeye ni Mwana wa Adamu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa sababu yeye ni mwana wa binadamu,” yaani, kwa sababu anashiriki asili ya kibinadamu. Matini kuu hutumia tafsiri inayowezekana zaidi ya cheo hiki katika Yohana.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξουσίαν
  choice: mamlaka
  rationale: Neno hili linaonyesha mamlaka au haki ya kisheria aliyokabidhiwa, si nguvu tu; katika muktadha huu ni mamlaka ya kuhukumu.
- source_word: ἔδωκεν
  choice: akampa
  rationale: Kitenzi cha Kigiriki humaanisha moja kwa moja ‘alitoa/alimpa’; umbo ‘akampa’ ni la asili katika Kiswahili na linaonyesha Baba kumpa Mwana mamlaka hiyo.
- source_word: αὐτῷ
  choice: -m- katika ‘akampa’
  rationale: Kiwakilishi cha dative kinamrejelea Mwana na kwa kawaida huingizwa katika kitenzi cha Kiswahili kama kiambishi cha yambwa.
- source_word: κρίσιν ποιεῖν
  choice: kutekeleza hukumu
  rationale: Kirai hiki kwa maana halisi ni ‘kufanya hukumu,’ lakini hapa kinamaanisha kutimiza au kutekeleza kazi ya kimahakama. ‘Kutekeleza hukumu’ huhifadhi uzito wa kisheria kuliko ‘kuhukumu’ pekee.
- source_word: ὅτι
  choice: kwa sababu
  rationale: Hapa ὅτι inatoa sababu ya kupewa mamlaka, hivyo ‘kwa sababu’ huwasilisha uhusiano wa kisababishi.
- source_word: υἱὸς ἀνθρώπου
  choice: Mwana wa Adamu
  rationale: Katika Injili ya Yohana, kirai hiki hutumika kama cheo kinachomtambulisha Yesu na kina mwangwi wa Danieli 7. ‘Mwana wa Adamu’ ndilo umbo la kawaida na linalotambulika katika Kiswahili cha Biblia.
- source_word: ἐστίν
  choice: ni
  rationale: Ni kitenzi unganishi cha wakati uliopo, kinachotafsiriwa kwa kawaida ‘ni.’
theological_decisions:
- issue: Iwapo υἱὸς ἀνθρώπου itafsiriwe kama cheo cha Kikristo au kama maelezo ya kawaida ya ubinadamu
  choice: Imetafsiriwa kama cheo ‘Mwana wa Adamu.’
  alternative: ‘mwana wa binadamu,’ yaani, mwanadamu anayeshiriki asili ya kibinadamu
  rationale: Matumizi katika Yohana yanaelekea kuwa cheo maalumu cha Yesu chenye uhusiano na mamlaka ya Mwana wa Adamu katika Danieli 7. Hata hivyo, kwa kuwa Kigiriki hapa hakina kibainishi na kinaweza kusikika kama maelezo ya ubinadamu, uwezekano huo umehifadhiwa katika tanbihi badala ya kufutwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini unaoeleweka kwa wasomaji wa kawaida. ‘Naye’ huunganisha aya na muktadha uliotangulia; ‘mamlaka’ na ‘kutekeleza hukumu’ huhifadhi lugha ya kimahakama. Alama ya tanbihi [a] imewekwa mara baada ya kirai kinachohusika.
