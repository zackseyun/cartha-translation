  text: ἀπεκρίθη αὐτῷ ὁ ἀσθενῶν· Κύριε, ἄνθρωπον οὐκ ἔχω ἵνα ὅταν ταραχθῇ τὸ ὕδωρ βάλῃ με εἰς τὴν κολυμβήθραν· ἐν ᾧ δὲ ἔρχομαι ἐγὼ ἄλλος πρὸ ἐμοῦ καταβαίνει.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/007.yaml
  text: The sick man answered him, “Lord, I have no one to put me into the pool when the water is stirred up; but while I am coming, another goes down before me.”
translation:
  language: sw
  text: Yule mtu aliyekuwa mgonjwa akamjibu, “Bwana, sina mtu wa kuniingiza katika bwawa maji yanapotibuliwa; nami ninapokuja, mtu mwingine hushuka kabla yangu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἀσθενῶν
  choice: yule mtu aliyekuwa mgonjwa
  rationale: Kirai hiki humtambulisha mtu anayeteseka kwa ugonjwa; tafsiri hii ni ya kawaida na hudumisha uhusiano wake na muktadha.
- source_word: Κύριε
  choice: Bwana
  rationale: Neno hili linaweza kuwa namna ya heshima ya kumwita mtu au kumaanisha ‘Bwana’; ‘Bwana’ huhifadhi maana pana na mvutano huo wa kimuktadha.
- source_word: βάλῃ με
  choice: kuniingiza
  rationale: Kitenzi halisi kina wazo la kuweka au kutia; katika muktadha wa kumsaidia mgonjwa aingie bwawani, ‘kuniingiza’ ni wazi na ya kawaida bila kudokeza kumtupa.
- source_word: κολυμβήθραν
  choice: bwawa
  rationale: Hurejelea bwawa la kuogelea au birika; ‘bwawa’ ni neno rahisi na linaloeleweka katika muktadha huu.
- source_word: ταραχθῇ τὸ ὕδωρ
  choice: maji yanapotibuliwa
  rationale: Huhifadhi wazo la maji kuchafuka au kusukumwa, bila kueleza ni nani au nini kinachoyatibua.
- source_word: καταβαίνει
  choice: hushuka
  rationale: Hufuata moja kwa moja mwendo unaoelezwa na Kigiriki wa kushuka kuingia bwawani.
theological_decisions:
- issue: Maana ya Κύριε katika maneno ya mgonjwa
  choice: Bwana
  alternative: Mheshimiwa
  rationale: ‘Bwana’ inaruhusu usomaji wa heshima ya kawaida na pia mwangwi wa kitheolojia, bila kuamua kwamba mgonjwa tayari alikuwa amemtambua Yesu kikamilifu.
- issue: Chanzo cha kutibuliwa kwa maji
  choice: Hakikutajwa
  alternative: Kuongeza malaika au maelezo mengine ya chanzo
  rationale: Aya hii katika SBLGNT haisemi ni nani au nini kinachotibua maji; tafsiri haiongezi maelezo ya mapokeo ya maandishi kutoka sehemu nyingine.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umerahisishwa kwa usomaji wa kawaida huku ukihifadhi maana ya chanzo na utata wa neno ‘Bwana’.
