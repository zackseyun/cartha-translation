base_translation:
  language: en
  yaml_path: translation/nt/john/005/013.yaml
  text: But the man who had been healed did not know who he was[a], for Jesus had withdrawn, since there was a crowd in the place.
translation:
  language: sw
  text: Lakini mtu aliyekuwa ameponywa hakujua Yesu alikuwa nani, kwa maana Yesu alikuwa amejiondoa[a], kwa kuwa palikuwa na umati wa watu mahali pale.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alikuwa ameondoka kimyakimya” au “alikuwa amepenya na kuondoka.” Kitenzi cha Kigiriki hudokeza kwamba Yesu aliondoka bila kuvuta fikira.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰαθεὶς
  choice: yule mtu aliyeponywa
  rationale: Kitenzi-jina tendwa cha wakati uliopita, chenye kibainishi, kinatumika kama nomino. Tafsiri hii inahifadhi hali ya kutendwa na kuonyesha kuwa kuponywa kulitangulia tendo kuu.
- source_word: οὐκ ᾔδει
  choice: hakujua
  rationale: Ni tafsiri ya kawaida, ya moja kwa moja, na ya asili katika Kiswahili kwa οἶδα katika muktadha huu.
- source_word: τίς ἐστιν
  choice: alikuwa nani
  rationale: Kauli hii inamrejelea Yesu kama mtu; katika usemi tegemezi wa Kiswahili, wakati uliopita unalingana kwa kawaida na kitenzi kikuu ‘hakujua’.
- source_word: ἐξένευσεν
  choice: alikuwa ameondoka bila kuonekana
  rationale: ἐκνεύω hapa hudokeza kuondoka bila kuvuta fikira au bila kutambuliwa. Kauli ya ‘alikuwa ameondoka’ pia inaonyesha kuwa kuondoka kulitangulia kutokujua kwa mtu huyo.
- source_word: ὄχλου ὄντος
  choice: kwa kuwa ... palikuwa na umati wa watu
  rationale: Muundo huu wa genitive absolute unaweza kueleza sababu au hali iliyoambatana na tendo. ‘Kwa kuwa’ huhifadhi nguvu yake ya ufafanuzi huku Kiswahili kikiwa cha kawaida.
- source_word: ἐν τῷ τόπῳ
  choice: mahali pale
  rationale: Huhifadhi rejeo la wazi la mahali katika Kigiriki na ni ya asili zaidi kuliko tafsiri ya neno kwa neno ‘katika mahali pale’.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Umati wa watu’ ni wazi kwa wasomaji wa kawaida; ‘bila kuonekana’ huwasilisha kuondoka kusikotambuliwa bila kutumia nahau isiyo rasmi.
