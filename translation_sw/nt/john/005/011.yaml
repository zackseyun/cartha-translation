  text: ⸂ὃς δὲ⸃ ἀπεκρίθη αὐτοῖς· Ὁ ποιήσας με ὑγιῆ ἐκεῖνός μοι εἶπεν Ἆρον τὸν κράβαττόν σου καὶ περιπάτει.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/011.yaml
  text: But he answered them[a], “The one who made me well—that one said to me[b], ‘Pick up your mat and walk.’”
translation:
  language: sw
  text: Lakini yeye akawajibu, “Yule aliyeniponya ndiye aliyeniambia, ‘Chukua mkeka wako, tembea.’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: akawajibu
  rationale: Kitenzi hiki cha kawaida cha masimulizi kinaonyesha jibu kwa watu waliokuwa wakizungumza naye; kiambishi -wa- kinaakisi αὐτοῖς.
- source_word: Ὁ ποιήσας με ὑγιῆ
  choice: Yule aliyeniponya
  rationale: Katika muktadha wa ugonjwa uliodumu kwa muda mrefu, Kiswahili cha kawaida huwasilisha maana ya kusababisha mtu awe mzima kwa kitenzi ‘kuponya’ bila kuongeza wazo la kiroho lisilotajwa.
- source_word: ἐκεῖνός
  choice: ndiye
  rationale: 'Muundo wa mkazo ‘ndiye’ huhifadhi msisitizo wa kiwakilishi cha Kigiriki: mtu aliyemponya ndiye aliyetoa agizo hilo.'
- source_word: Ἆρον
  choice: Chukua
  rationale: Amri hii inaeleza kitendo halisi cha kuuinua na kwenda nao mkeka; ‘chukua’ ni ya asili na wazi katika Kiswahili cha sasa.
- source_word: κράβαττόν
  choice: mkeka
  rationale: Neno la Kigiriki linamaanisha tandiko rahisi la kulalia, si lazima kitanda kikubwa cha samani; ‘mkeka’ linaeleweka kwa urahisi katika mazingira ya Afrika Mashariki.
- source_word: περιπάτει
  choice: utembee
  rationale: Katika mfuatano wa amri, ‘utembee’ ni Kiswahili cha kawaida kinachoonyesha tendo linalotakiwa kufuata baada ya kuuchukua mkeka.
- source_word: δὲ
  choice: Lakini
  rationale: Kiunganishi hiki kinaonyesha utofauti mpole kati ya shtaka lao na jibu la mtu huyo.
theological_decisions:
- issue: Maana inayoweza kuwa ya uponyaji wa kimwili au ukamilifu mpana
  choice: aliyенiponya
  alternative: aliyenifanya niwe mzima
  rationale: Muktadha unahusu kuondolewa kwa udhaifu wa mwili. ‘Aliyeniponya’ ni ya asili na haiongezi dai la ukamilifu wa kiroho ambalo halijaelezwa wazi katika mstari huu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ‘Yule ... ndiye ...’ unahifadhi msisitizo wa Kigiriki bila kuwa mzito. Hakuna tanbihi inayohitajika; tanbihi za Kiingereza zilizotolewa zinaonekana kutolingana na alama zake, hivyo maamuzi ya Kiswahili yametegemezwa moja kwa moja kwenye SBLGNT.
