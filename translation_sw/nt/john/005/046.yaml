base_translation:
  language: en
  yaml_path: translation/nt/john/005/046.yaml
  text: For if you believed Moses[a], you would believe me[b], for he wrote about me.
translation:
  language: sw
  text: Kwa maana kama mngalimwamini Musa, mngeniamini mimi,[a] kwa maana yeye ndiye aliyeandika juu yangu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mngenitumaini.” Kitenzi kilekile cha Kigiriki kimetumiwa katika vifungu vyote viwili.
    reason: lexical_alternative
  - marker: b
    text: 'Kwa namna iliyo karibu zaidi na msisitizo wa Kigiriki: “kwa maana huyo ndiye aliyeandika juu yangu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ γὰρ
  choice: Kwa maana kama
  rationale: γάρ linaunganisha kauli hii na hoja iliyotangulia, na εἰ linaanzisha sharti; “kwa maana kama” ni Kiswahili cha kawaida kinachohifadhi uhusiano huo.
- source_word: ἐπιστεύετε Μωϋσεῖ
  choice: mngalimwamini Musa
  rationale: Kitenzi πιστεύω pamoja na yambwa katika hali ya dative hapa kina maana ya kumwamini mtu. Muundo wa “-ngali-” unaonyesha sharti lisilotimizwa katika muktadha huu.
- source_word: ἐπιστεύετε ἂν ἐμοί
  choice: mngeniamini mimi
  rationale: ἄν pamoja na imperfect huonyesha matokeo yasiyotimia ya sharti. “Mngeniamini” ni muundo wa asili wa Kiswahili, huku “mimi” ikifanya yambwa ἐμοί ionekane wazi bila kuongeza wazo la ‘kuamini katika’ ambalo halijaonyeshwa na kihusishi εἰς.
- source_word: περὶ γὰρ ἐμοῦ
  choice: kwa maana ... juu yangu
  rationale: περί pamoja na genitive humaanisha ‘kuhusu’ au ‘juu ya.’ “Juu yangu” ni usemi wa kawaida unaohifadhi maana ya maandishi kuwa yanamhusu Yesu.
- source_word: ἐκεῖνος
  choice: yeye ndiye
  rationale: Kiwakilishi cha kuonyesha ἐκεῖνος kinamrejelea Musa kwa msisitizo. “Yeye ndiye” kinawakilisha msisitizo huo kwa Kiswahili cha asili.
- source_word: ἔγραψεν
  choice: aliyeandika
  rationale: Aorist inaelezwa kwa tendo la wakati uliopita; muundo wa uhusiano “aliyeandika” unafaa baada ya “yeye ndiye.”
theological_decisions:
- issue: Namna maandishi ya Musa yanavyomshuhudia Yesu
  choice: aliyeandika juu yangu
  alternative: aliyeandika kunihusu
  rationale: Tafsiri inadumisha dai kwamba Musa aliandika kumhusu Yesu bila kutaja kifungu fulani wala kupanua dai hilo zaidi ya maneno ya Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa masharti “mngalimwamini ... mngeniamini” unaeleweka kwa wasomaji wa kawaida na kuhifadhi hali ya sharti lisilotimizwa. “Yeye ndiye” huhifadhi msisitizo wa ἐκεῖνος bila kuwa mzito kupita kiasi.
