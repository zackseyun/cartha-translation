base_translation:
  language: en
  yaml_path: translation/nt/john/005/015.yaml
  text: The man went away and reported to the Jews that Jesus was the one who had made him well[a].
translation:
  language: sw
  text: Yule mtu akaenda zake, akawaarifu Wayahudi kwamba Yesu ndiye aliyemfanya awe mzima[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “viongozi wa Wayahudi” au “Wayudea,” kutegemea jinsi Yohana anavyotumia neno “Wayahudi” katika muktadha huu.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπῆλθεν
  choice: akaondoka
  rationale: Kitenzi hiki kinaonyesha kwamba mtu huyo aliondoka mahali pale; “akaondoka” ni Kiswahili cha kawaida na huendeleza simulizi kwa ufasaha.
- source_word: ὁ ἄνθρωπος
  choice: Yule mtu
  rationale: Nomino hiyo inamrejelea mwanamume aliyekuwa ameponywa, ambaye tayari ametajwa katika muktadha; “yule mtu” ni rejeleo la kawaida katika simulizi la Kiswahili.
- source_word: ἀνήγγειλεν
  choice: akawaambia
  rationale: ἀναγγέλλω hapa ni kutoa taarifa au kujulisha. “Akawaambia” ni ya kawaida na haiongezi wazo lisilo lazima la tangazo la hadharani.
- source_word: τοῖς Ἰουδαίοις
  choice: Wayahudi
  rationale: Tafsiri kuu inahifadhi neno la Kigiriki bila kulibana moja kwa moja kuwa viongozi; uwezekano wa maana ya kimuktadha umeelezwa katika tanbihi.
- source_word: ὅτι
  choice: kwamba
  rationale: Kiunganishi cha kawaida kinachoanzisha taarifa aliyotoa mtu huyo.
- source_word: Ἰησοῦς ἐστιν
  choice: Yesu ndiye
  rationale: Muundo huu wa Kiswahili unahifadhi msisitizo wa kumtambulisha Yesu kuwa mhusika aliyefanya tendo hilo.
- source_word: ὁ ποιήσας αὐτὸν ὑγιῆ
  choice: aliyemponya
  rationale: Ingawa kwa muundo wa maneno ni ‘aliyemfanya awe mzima,’ katika muktadha wa kuondolewa ugonjwa “aliyemponya” hutoa maana hiyo kwa Kiswahili cha kawaida bila kudokeza maana pana zaidi.
theological_decisions:
- issue: Wanaorejelewa na neno τοῖς Ἰουδαίοις katika Injili ya Yohana
  choice: Wayahudi katika matini kuu, pamoja na tanbihi ya kimuktadha
  alternative: viongozi wa Wayahudi; Wayudea
  rationale: Neno la chanzo ni pana kuliko ‘viongozi wa Wayahudi,’ ingawa katika muktadha wa Yohana mara nyingi linaweza kuwalenga viongozi wenye mamlaka. Kutaja “Wayahudi” katika matini kuu huhifadhi utata halisi, huku tanbihi ikizuia tafsiri hiyo isieleweke kana kwamba inawahusu Wayahudi wote bila ubaguzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa na chenye hadhi. Mtiririko wa vitenzi “akaondoka, akawaambia” ni wa kawaida katika masimulizi; “Yesu ndiye” huhifadhi utambulisho wenye msisitizo.
