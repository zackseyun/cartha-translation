  text: καὶ ἐκπορεύσονται οἱ τὰ ἀγαθὰ ποιήσαντες εἰς ἀνάστασιν ζωῆς, οἱ ⸀δὲ τὰ φαῦλα πράξαντες εἰς ἀνάστασιν κρίσεως.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/029.yaml
  text: and will come out—those who have done good to the resurrection of life[a], but those who have done evil to the resurrection of judgment.
translation:
  language: sw
  text: Nao watatoka—wale waliotenda mema kwa ufufuo wa uzima, lakini wale waliotenda maovu kwa ufufuo wa hukumu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ufufuo wa hukumu ya hatia.” Kigiriki hutumia neno “hukumu,” lenye maana pana zaidi; “hukumu ya hatia” ni ufafanuzi mwembamba unaopatikana katika baadhi ya tafsiri.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκπορεύσονται
  choice: watatoka
  rationale: Katika muktadha wa wafu kutoka makaburini baada ya kuisikia sauti ya Mwana (mst. 28–29), “watatoka” ni ya kawaida, wazi, na inalingana moja kwa moja na kitenzi cha Kigiriki.
- source_word: τὰ ἀγαθὰ ποιήσαντες
  choice: wale waliotenda mema
  rationale: Muundo huu unaeleza watu kwa matendo yao. “Kutenda mema” ni Kiswahili cha kawaida na chenye heshima, bila kufafanua zaidi aina ya matendo.
- source_word: ἀνάστασιν ζωῆς
  choice: ufufuo wa uzima
  rationale: Huhifadhi muundo wa nomino na uhusiano wa kisarufi wa maneno ya Kigiriki, pamoja na uwiano wake na “ufufuo wa hukumu.”
- source_word: τὰ φαῦλα πράξαντες
  choice: wale waliotenda maovu
  rationale: Katika muktadha wa hukumu, φαῦλα ina maana ya uovu wa kimaadili. “Waliotenda maovu” ni wazi na ya asili; tofauti ndogo kati ya πράσσω na ποιέω haiwezi kudumishwa hapa bila kufanya Kiswahili kisikike cha kulazimishwa.
- source_word: ἀνάστασιν κρίσεως
  choice: ufufuo wa hukumu
  rationale: κρίσις kimsingi ni “hukumu.” Chaguo hili halibani maana kuwa “adhabu” au “hukumu ya hatia,” hivyo linahifadhi upana na mvutano wa usemi wa Kigiriki.
- source_word: δὲ
  choice: lakini
  rationale: Kiunganishi hiki kinaonyesha tofauti kati ya makundi hayo mawili na matokeo yao.
theological_decisions:
- issue: Iwapo κρίσεως itafsiriwe kwa maana pana ya hukumu au maana finyu ya kuhukumiwa kuwa na hatia
  choice: hukumu
  alternative: hukumu ya hatia
  rationale: Neno κρίσις lenyewe halilazimishi maana finyu ya hukumu ya hatia. “Hukumu” huhifadhi upana wa neno la Kigiriki na kuacha muktadha uonyeshe uzito wa matokeo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa sentensi umehifadhi ulinganifu wa vifungu viwili vya Kigiriki; alama ya mkato mrefu inaonyesha maelezo ya makundi yatakayotoka.
