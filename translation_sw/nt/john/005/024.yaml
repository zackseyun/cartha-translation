id: JHN.5.24
reference: John 5:24
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἀμὴν ἀμὴν λέγω ὑμῖν ὅτι ὁ τὸν λόγον μου ἀκούων καὶ πιστεύων τῷ πέμψαντί με ἔχει ζωὴν αἰώνιον, καὶ εἰς κρίσιν οὐκ ἔρχεται ἀλλὰ μεταβέβηκεν ἐκ τοῦ θανάτου εἰς τὴν ζωήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/024.yaml
  text: Truly[a], truly, I say to you, whoever hears my word and believes him who sent me has eternal life, and does not come into judgment[b], but has passed from death into life.
translation:
  language: sw
  text: '“Kweli, kweli, nawaambia: Yeyote anayesikia neno langu na kumwamini aliyenituma anao uzima wa milele. Haingii katika hukumu[a], bali amevuka[b] kutoka katika kifo na kuingia katika uzima.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “haingii katika hukumu ya adhabu.” Neno la Kigiriki κρίσις linaweza kumaanisha “hukumu” kwa ujumla au, katika muktadha huu, hukumu mbaya.
    reason: lexical_alternative
  - marker: b
    text: 'Kitenzi cha Kigiriki kiko katika hali timilifu, kikionyesha kuvuka kulikokamilika na ambako matokeo yake yanaendelea: “amekwisha kuvuka” kutoka katika kifo na kuingia katika uzima.'
    reason: verbal_aspect
lexical_decisions:
- source_word: Ἀμὴν ἀμὴν
  choice: Kweli, kweli
  rationale: Huhifadhi urudiaji wa msisitizo na uzito wa kauli ya Yesu, huku maana yake ikieleweka kwa wasomaji wa Kiswahili cha sasa.
- source_word: λέγω ὑμῖν
  choice: nawaambia
  rationale: Ni usemi wa kawaida na wa moja kwa moja katika Kiswahili, unaowasilisha wingi wa ὑμῖν.
- source_word: ὁ ... ἀκούων καὶ πιστεύων
  choice: Yeyote anayesikia ... na kumwamini
  rationale: “Yeyote” huwasilisha maana ya jumla ya viambishi vya wakati wa sasa bila kuweka jinsia isiyohitajika.
- source_word: τὸν λόγον μου
  choice: neno langu
  rationale: Huhifadhi istilahi na mwangwi wa Johannine wa λόγος, na hapa inaeleweka kuwa ujumbe au maneno ya Yesu.
- source_word: πιστεύων τῷ πέμψαντί με
  choice: kumwamini aliyenituma
  rationale: Kitenzi cha Kigiriki pamoja na yambwa katika hali ya dative kina maana ya kumwamini au kumtumaini mtu; muundo huu ni wa asili katika Kiswahili.
- source_word: ἔχει ζωὴν αἰώνιον
  choice: anao uzima wa milele
  rationale: Wakati wa sasa wa ἔχει unaonyesha kuwa uzima huu ni milki ya sasa, si ahadi ya wakati ujao pekee.
- source_word: εἰς κρίσιν οὐκ ἔρχεται
  choice: Haingii katika hukumu
  rationale: “Hukumu” huhifadhi upana wa κρίσις bila kuifafanua moja kwa moja kuwa adhabu; “katika” hudumisha mwelekeo wa εἰς.
- source_word: μεταβέβηκεν
  choice: amevuka
  rationale: Hali timilifu ya Kiswahili huonyesha tendo lililotimia, nalo tanbihi hufafanua matokeo yake yanayoendelea.
- source_word: ἐκ τοῦ θανάτου εἰς τὴν ζωήν
  choice: kutoka katika kifo na kuingia katika uzima
  rationale: Huhifadhi utofauti mkali wa kifo na uzima pamoja na mwelekeo wa kutoka hali moja na kuingia nyingine.
theological_decisions:
- issue: Maana ya κρίσις katika muktadha huu wa wokovu
  choice: hukumu
  alternative: adhabu; kuhukumiwa kuwa na hatia
  rationale: Neno linaweza kumaanisha hukumu kwa ujumla au hukumu mbaya katika muktadha. “Hukumu” huhifadhi upana na mvutano wa maandiko bila kuamua kimbele kwamba nomino yenyewe inamaanisha adhabu.
- issue: Nguvu ya vitenzi vya wakati wa sasa na timilifu kuhusu uzima
  choice: Uzima wa milele ni milki ya sasa, na kuvuka kutoka kifoni kuingia uzimani ni tendo lililotimia lenye matokeo yanayoendelea
  alternative: Uzima ni wa wakati ujao pekee; kuvuka kutatokea tu katika hukumu ya baadaye
  rationale: ἔχει ni ya wakati wa sasa, na μεταβέβηκεν ni timilifu. Tafsiri inahifadhi vipengele hivyo bila kuingiza mfumo maalumu wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wazi kwa msomaji wa kawaida, huku urudiaji wa “Kweli, kweli,” istilahi “neno,” na utofauti wa “kifo” na “uzima” vikihifadhi uzito na mwangwi wa maandishi ya Yohana.
