  text: πῶς δύνασθε ὑμεῖς πιστεῦσαι, δόξαν παρ’ ἀλλήλων λαμβάνοντες, καὶ τὴν δόξαν τὴν παρὰ τοῦ μόνου θεοῦ οὐ ζητεῖτε;
base_translation:
  language: en
  yaml_path: translation/nt/john/005/044.yaml
  text: How are you able to believe[c][b][a], receiving glory from one another and not seeking the glory that is from the only God?
translation:
  language: sw
  text: Ninyi mnawezaje kuamini, huku mkipokea utukufu[a] kutoka kwa wenzenu, wala hamtafuti utukufu unaotoka kwa Mungu wa pekee?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “heshima,” katika matukio yote mawili.
    reason: lexical_alternative
  - marker: b
    text: Au, “Mungu mmoja tu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς δύνασθε ὑμεῖς πιστεῦσαι
  choice: Ninyi mnawezaje kuamini
  rationale: Muundo huu ni wa kawaida katika Kiswahili na unahifadhi swali la balagha kuhusu uwezo wa kuamini. Kuweka “Ninyi” wazi kunawakilisha msisitizo wa kiwakilishi ὑμεῖς bila kuuzidisha.
- source_word: δόξαν
  choice: utukufu
  rationale: “Utukufu” huhifadhi neno lilelile katika sehemu zote mbili na kuonyesha kwa uwazi tofauti kati ya utukufu unaotoka kwa wanadamu na ule unaotoka kwa Mungu. Katika muktadha huu “heshima” pia ni tafsiri halali na ya kawaida zaidi katika mazungumzo.
- source_word: παρ’ ἀλλήλων
  choice: kutoka kwa mtu na mwenzake
  rationale: Usemi huu wa asili katika Kiswahili unaonyesha wazi uhusiano wa kupokezana uliomo katika ἀλλήλων, yaani watu kupeana utukufu wao kwa wao.
- source_word: λαμβάνοντες
  choice: huku mkipokea
  rationale: “Huku” huonyesha tendo linaloendelea sambamba na hali inayotajwa katika swali, na “mkipokea” ni tafsiri ya moja kwa moja isiyoongeza wazo la kukubali kwa hiari.
- source_word: καὶ ... οὐ ζητεῖτε
  choice: lakini hamtafuti
  rationale: Ingawa καί kwa kawaida ni “na,” hapa ukanushaji unaweka tofauti dhahiri kati ya kupokea utukufu wa wanadamu na kutoutafuta ule wa Mungu; “lakini” huwasilisha uhusiano huo kwa Kiswahili cha asili.
- source_word: τὴν δόξαν τὴν παρὰ τοῦ μόνου θεοῦ
  choice: utukufu unaotoka kwa Mungu wa pekee
  rationale: Kishazi rejeshi kinaonyesha chanzo cha utukufu kwa uwazi, huku “Mungu wa pekee” kikihifadhi nguvu ya upekee katika μόνος bila kuongeza ufafanuzi wa kimadhehebu.
theological_decisions:
- issue: Maana ya πιστεῦσαι katika muktadha wa Yohana
  choice: kuamini
  alternative: kumtumaini
  rationale: “Kuamini” ni pana na ya kawaida kwa πιστεύω, na haifungi maana kwenye ufafanuzi mwembamba wa kiteolojia. Muktadha unaweza kuhusisha tumaini, lakini neno la chanzo halilazimishi kulieleza hapa.
- issue: Kurudia δόξα katika vifungu vyote viwili
  choice: utukufu
  alternative: heshima
  rationale: Kutumia neno lilelile mara zote mbili kunahifadhi usambamba na mvutano wa maandishi kati ya utukufu wa wanadamu na utukufu wa Mungu.
- issue: Upekee katika τοῦ μόνου θεοῦ
  choice: Mungu wa pekee
  alternative: Mungu mmoja tu
  rationale: Tafsiri hii inathibitisha upekee wa Mungu kama ulivyo katika maandishi bila kuingiza hitimisho jingine la kikristo au lisilo la kikristo ambalo mstari wenyewe haulitamki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inadumisha swali la balagha, msisitizo wa “Ninyi,” na urudiaji wa neno kuu, huku ikitumia “mtu na mwenzake” ili kueleza kwa kawaida maana ya kupokezana.
