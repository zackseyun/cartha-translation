  text: μὴ δοκεῖτε ὅτι ἐγὼ κατηγορήσω ὑμῶν πρὸς τὸν πατέρα· ἔστιν ὁ κατηγορῶν ὑμῶν Μωϋσῆς, εἰς ὃν ὑμεῖς ἠλπίκατε.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/045.yaml
  text: 'Do not think that I will accuse you before the Father[a]; there is one who accuses you: Moses[b], in whom you have put your hope.'
translation:
  language: sw
  text: 'Msidhani kwamba mimi nitawashtaki mbele za Baba[a]. Yuko anayewashtaki: Musa[b], ambaye mmeweka tumaini lenu kwake.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Msidhani kwamba mimi nitawaletea mashtaka mbele za Baba.”
    reason: lexical_alternative
  - marker: b
    text: Yaani, Musa—ambaye mmeweka tumaini lenu kwake, hasa kama mpatanishi na shahidi wa sheria—ndiye anayewashtaki.
    reason: cross_reference
lexical_decisions:
- source_word: μὴ δοκεῖτε
  choice: Msidhani
  rationale: Hutoa katazo la moja kwa moja kwa Kiswahili cha kawaida na kuhifadhi maana ya ‘msifikiri/msione kuwa.’
- source_word: κατηγορήσω
  choice: nitawashtaki
  rationale: ‘Kushtaki’ huhifadhi maana ya kisheria ya kuleta shtaka bila kuipanua kuwa ‘kuwahukumu.’
- source_word: πρὸς τὸν πατέρα
  choice: mbele za Baba
  rationale: Katika muktadha wa shtaka, msemo huu wa Kiswahili huwasilisha kushtaki katika uwepo wa Baba na kuhifadhi taswira ya kimahakama.
- source_word: ἔστιν ὁ κατηγορῶν ὑμῶν
  choice: Yupo anayewashtaki
  rationale: Huhifadhi uwasilishaji wa mshtaki mwingine na nguvu endelevu ya kitenzi kishirikishi cha wakati uliopo.
- source_word: Μωϋσῆς
  choice: Musa
  rationale: Hili ndilo umbo la kawaida la jina hili katika Biblia na Kiswahili sanifu.
- source_word: εἰς ὃν
  choice: ambaye
  rationale: Kiwakilishi humrejelea Musa moja kwa moja, huku uhusiano wa kuweka tumaini ukielezwa na kitenzi kinachofuata.
- source_word: ἠλπίκατε
  choice: mmemwekea tumaini lenu
  rationale: Wakati timilifu wa Kiswahili unaonyesha tendo la kuweka tumaini lenye matokeo yanayoendelea; ‘tumaini lenu’ hufanya usemi uwe wa kawaida na wazi.
theological_decisions:
- issue: Nguvu ya kisheria ya kauli ya Yesu kuhusu shtaka
  choice: nitawashtaki
  alternative: nitawahukumu
  rationale: κατηγορέω humaanisha kushtaki au kuleta mashtaka, si kutoa hukumu ya mwisho; hivyo tafsiri haiongezi dai la kitheolojia lisilomo katika mstari.
- issue: Kitu ambacho wasikilizaji walikiwekea tumaini
  choice: Musa, ambaye mmemwekea tumaini lenu
  alternative: sheria ya Musa / maandishi ya Musa
  rationale: Ingawa muktadha mpana unahusisha maandishi ya Musa, Kigiriki kinamtaja Musa mwenyewe. Tafsiri inadumisha rejeo hilo bila kuingiza ufafanuzi katika matini kuu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Mbele za Baba’ huhifadhi taswira ya kisheria kwa lugha ya kawaida; ‘mmemwekea tumaini lenu’ ni ya asili na huonyesha hali iliyoendelea kutokana na tendo la wakati uliopita.
