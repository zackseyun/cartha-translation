  text: ἐγὼ δὲ οὐ παρὰ ἀνθρώπου τὴν μαρτυρίαν λαμβάνω, ἀλλὰ ταῦτα λέγω ἵνα ὑμεῖς σωθῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/034.yaml
  text: But I do not receive testimony from man; rather, I say these things so that you may be saved.
translation:
  language: sw
  text: Lakini mimi sipokei ushuhuda kutoka kwa mwanadamu; bali nasema mambo haya ili ninyi mpate kuokolewa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρὰ ἀνθρώπου
  choice: kutoka kwa mwanadamu
  rationale: παρά pamoja na hali ya umilikishi huonyesha chanzo. “Kutoka kwa mwanadamu” huhifadhi umoja wa ἀνθρώπου na maana ya ushuhuda wa kibinadamu bila kumfanya lazima awe mtu mmoja maalumu.
- source_word: μαρτυρίαν
  choice: ushuhuda
  rationale: “Ushuhuda” huonyesha yaliyotolewa kama uthibitisho katika muktadha huu na huendana kwa kawaida na kitenzi “kupokea.”
- source_word: λαμβάνω
  choice: sipokei
  rationale: Wakati uliopo umetafsiriwa moja kwa moja. “Sipokei” huhifadhi maana ya msingi bila kuamua zaidi kama ni kukubali kuwa kweli au kutegemea.
- source_word: ταῦτα
  choice: mambo haya
  rationale: Huhifadhi wingi wa kiwakilishi cha Kigiriki na ni usemi wa kawaida wa Kiswahili.
- source_word: λέγω
  choice: nasema
  rationale: Wakati uliopo rahisi unalingana na λέγω na unasikika kwa kawaida pamoja na “mambo haya.”
- source_word: ἵνα ὑμεῖς σωθῆτε
  choice: ili ninyi mpate kuokolewa
  rationale: “Ili” huonyesha kusudi la ἵνα; “mpate kuokolewa” huhifadhi hali ya kutendwa na maana pana ya wokovu. “Ninyi” huonyesha wazi msisitizo wa kiwakilishi ὑμεῖς.
- source_word: δὲ ... ἀλλὰ
  choice: Lakini ... bali
  rationale: 'Muundo huu huhifadhi ulinganishaji wa hoja: Yesu anakataa kwamba hupokea ushuhuda kutoka kwa mwanadamu, kisha anaeleza kusudi la kusema mambo hayo.'
theological_decisions:
- issue: Maana ya σωθῆτε katika muktadha
  choice: mpate kuokolewa
  alternative: mpate kuponywa; mpate kukombolewa
  rationale: Tafsiri hii huhifadhi maana pana ya wokovu bila kuibana kuwa uokozi wa kimwili au kuingiza mfumo fulani maalumu wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Mwanadamu” limetumiwa badala ya “mtu” ili kueleza ushuhuda wenye chanzo cha kibinadamu, huku umoja wa Kigiriki ukihifadhiwa. Hakuna tanbihi inayohitajika.
