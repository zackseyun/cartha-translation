  text: ὥσπερ γὰρ ὁ πατὴρ ἐγείρει τοὺς νεκροὺς καὶ ζῳοποιεῖ, οὕτως καὶ ὁ υἱὸς οὓς θέλει ζῳοποιεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/021.yaml
  text: For just as the Father raises the dead and gives life[b][a], so also the Son gives life to whom he wishes.
translation:
  language: sw
  text: Kwa maana kama vile Baba anavyowafufua wafu na kuwapa uzima, vivyo hivyo Mwana naye huwapa uzima wale anaotaka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: Kwa maana kama vile
  rationale: “Kwa maana” huhifadhi kazi ya γάρ ya kutoa sababu au ufafanuzi, na “kama vile” huanzisha ulinganisho wa ὥσπερ kwa Kiswahili cha kawaida.
- source_word: ὁ πατὴρ
  choice: Baba
  rationale: Katika muktadha huu ni jina la cheo linalomtaja Mungu na linalolinganishwa moja kwa moja na Mwana.
- source_word: ἐγείρει τοὺς νεκρούς
  choice: anavyowafufua wafu
  rationale: “Kufufua” ni neno la kawaida katika muktadha wa kuwainua waliokufa; “wafu” huhifadhi rejeo la jumla la τοὺς νεκρούς.
- source_word: ζῳοποιεῖ
  choice: kuwapa uzima / huwapa uzima
  rationale: Huwasilisha tendo la kutoa uhai kwa lugha ya sasa na inayofahamika. Kiambishi cha yambwa katika “kuwapa” kinaelekezwa kwa “wafu,” kama muundo wa Kigiriki unavyoruhusu kitenzi cha pili kushiriki yambwa wa kwanza.
- source_word: οὕτως καὶ
  choice: vivyo hivyo ... naye
  rationale: Muundo huu wa Kiswahili unaendeleza ulinganisho na kusisitiza kwamba Mwana pia hutenda tendo hilo.
- source_word: ὁ υἱὸς
  choice: Mwana
  rationale: Ni jina la cheo la Kikristo katika muktadha huu na linahifadhi ulinganifu wa Baba na Mwana.
- source_word: οὓς θέλει
  choice: wale anaotaka
  rationale: Huhifadhi wingi wa οὓς na maana halisi ya hiari au nia katika θέλει bila kuongeza ufafanuzi wa kiteolojia.
theological_decisions:
- issue: Ulinganifu wa Baba na Mwana katika kutoa uzima
  choice: 'Kuhifadhi ulinganifu wa moja kwa moja: Baba huwafufua wafu na kuwapa uzima; vivyo hivyo Mwana huwapa uzima.'
  alternative: Kulegeza ulinganifu ili kupunguza maana yake ya Kikristo kuhusu Mwana.
  rationale: Kigiriki kinaweka wazi tendo la Mwana sambamba na tendo la Baba. Tafsiri hailipunguzi wala kuongeza maelezo kuhusu asili ya uhusiano huo.
- issue: θέλει na hiari ya Mwana
  choice: wale anaotaka
  alternative: wale anaowapenda; wale anaowachagua
  rationale: “Anaotaka” huonyesha nia ya Mwana bila kubadili kitenzi kuwa upendo au uchaguzi, dhana ambazo hazijasemwa moja kwa moja hapa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Anavyowafufua” hukamilisha kwa kawaida muundo wa “kama vile,” huku “huwapa” ikionyesha tendo la kawaida au lenye mamlaka. Maneno “Baba” na “Mwana” yameandikwa kwa herufi kubwa kama majina ya cheo katika muktadha.
