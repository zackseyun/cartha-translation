id: JHN.5.23
reference: John 5:23
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἵνα πάντες τιμῶσι τὸν υἱὸν καθὼς τιμῶσι τὸν πατέρα. ὁ μὴ τιμῶν τὸν υἱὸν οὐ τιμᾷ τὸν πατέρα τὸν πέμψαντα αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/023.yaml
  text: so that all may honor the Son just as they honor the Father. The one who does not honor the Son does not honor the Father who sent him.
translation:
  language: sw
  text: ili wote wamheshimu Mwana kama vile wanavyomheshimu Baba. Asiyemheshimu Mwana hamheshimu Baba aliyemtuma.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: ili
  rationale: Kiunganishi hiki kinaonyesha kusudi au matokeo; “ili” ni cha kawaida na huhifadhi nguvu ya kusudi katika Kiswahili.
- source_word: πάντες
  choice: wote
  rationale: Huwakilisha watu wote kwa ufupi na kwa namna ya kawaida katika muktadha huu.
- source_word: τιμῶσι / τιμῶν / τιμᾷ
  choice: wamheshimu / Asiyemheshimu / hamheshimu
  rationale: Kitenzi “heshimu” hutoa maana ya kumpa mtu heshima anayostahili, na mzizi uleule umerudiwa ili kuhifadhi ulinganifu wa maandishi ya Kigiriki.
- source_word: τὸν υἱὸν
  choice: Mwana
  rationale: “Mwana” ni cheo cha Kristo katika muktadha huu; herufi kubwa inaonyesha matumizi yake kama cheo bila kuongeza ufafanuzi wa nje.
- source_word: καθὼς
  choice: kama vile
  rationale: Kirai hiki kinaonyesha ulinganisho wenye nguvu na wa moja kwa moja kati ya heshima anayopewa Mwana na ile anayopewa Baba.
- source_word: τὸν πατέρα
  choice: Baba
  rationale: “Baba” ni jina la kimahusiano linalomtaja Mungu katika muktadha huu; herufi kubwa inafaa kwa matumizi hayo.
- source_word: ὁ μὴ τιμῶν
  choice: Asiyemheshimu
  rationale: Muundo huu wa Kiswahili unawakilisha kwa kawaida kishiriki chenye kibainishi kinachomaanisha mtu yeyote asiyefanya tendo hilo.
- source_word: τὸν πέμψαντα αὐτόν
  choice: aliyemtuma
  rationale: Kishazi hiki humfafanua Baba kuwa ndiye aliyemtuma Mwana. Kiambishi “-m-” kinamrejelea Mwana kwa uwazi wa kimuktadha.
theological_decisions:
- issue: Nguvu ya ulinganisho kati ya kumheshimu Mwana na kumheshimu Baba
  choice: “kama vile wanavyomheshimu Baba”
  alternative: “kama wanavyomheshimu Baba”
  rationale: “Kama vile” huhifadhi ulinganisho wenye nguvu wa καθὼς bila kuupunguza kuwa ufanano wa jumla wala kuingiza istilahi za baadaye za kiteolojia.
- issue: Matumizi ya herufi kubwa katika “Mwana” na “Baba”
  choice: Majina yote mawili yameandikwa kwa herufi kubwa kama vyeo vya kimahusiano katika muktadha
  alternative: “mwana” na “baba” kwa herufi ndogo
  rationale: Ingawa maandishi ya Kigiriki hayatoi uamuzi huu wa kiuandishi, muktadha unamtaja Yesu na Mungu Baba waziwazi; herufi kubwa huwasaidia wasomaji kutambua matumizi ya majina hayo kama vyeo bila kuongeza maana mpya.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Marudio ya kitenzi “heshimu” na ulinganifu wa sentensi yamehifadhiwa kwa sababu ni muhimu katika hoja ya aya.
