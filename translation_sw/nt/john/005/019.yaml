  text: Ἀπεκρίνατο οὖν ὁ Ἰησοῦς καὶ ⸀ἔλεγεν αὐτοῖς· Ἀμὴν ἀμὴν λέγω ὑμῖν, οὐ δύναται ὁ υἱὸς ποιεῖν ἀφ’ ἑαυτοῦ οὐδὲν ⸀ἐὰν μή τι βλέπῃ τὸν πατέρα ποιοῦντα· ἃ γὰρ ἂν ἐκεῖνος ποιῇ, ταῦτα καὶ ὁ υἱὸς ὁμοίως ποιεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/019.yaml
  text: So Jesus answered and said to them[a], “Truly, truly, I say to you, the Son is not able to do anything from himself unless he sees the Father doing it; for whatever that one does[b], these things the Son also does likewise.”
translation:
  language: sw
  text: Basi Yesu akawajibu akawaambia, “Kweli, kweli, ninawaambia, Mwana hawezi kufanya chochote kutoka kwake mwenyewe, isipokuwa amwone Baba akifanya; kwa maana lolote afanyalo Baba, Mwana naye hulifanya vivyo hivyo.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀπεκρίνατο οὖν ὁ Ἰησοῦς καὶ ἔλεγεν αὐτοῖς
  choice: Basi Yesu akawajibu, akawaambia
  rationale: “Basi” huunganisha kauli hii na muktadha kwa kawaida. Muundo wa vitenzi viwili unahifadhi ἀπεκρίνατο ... καὶ ἔλεγεν bila kutumia usemi mzito usio wa kawaida katika Kiswahili.
- source_word: Ἀμὴν ἀμὴν λέγω ὑμῖν
  choice: Kweli kabisa, ninawaambia
  rationale: “Kweli kabisa” huwasilisha msisitizo wa urudiaji wa ἀμὴν kwa lugha ya sasa na yenye heshima, ingawa hairudii neno moja mara mbili.
- source_word: οὐ δύναται ὁ υἱὸς ποιεῖν ... οὐδὲν
  choice: Mwana hawezi kufanya chochote
  rationale: Huhifadhi maana ya uwezo katika οὐ δύναται pamoja na ukanushi kamili wa οὐδὲν.
- source_word: ἀφ’ ἑαυτοῦ
  choice: kwa kujitegemea mwenyewe
  rationale: Huwasilisha kutotenda kutoka kwake mwenyewe au kwa kujitenga na Baba; ni ya kawaida zaidi kuliko tafsiri ya moja kwa moja “kutoka kwake mwenyewe.”
- source_word: ἐὰν μή τι βλέπῃ τὸν πατέρα ποιοῦντα
  choice: isipokuwa kile anachomwona Baba akikifanya
  rationale: Hutoa kwa kawaida muundo wa kuondoa isipokuwa na huhifadhi uhusiano kati ya kuona na tendo la Baba.
- source_word: ἃ γὰρ ἂν ἐκεῖνος ποιῇ
  choice: kwa maana chochote anachofanya Baba
  rationale: “Chochote” huhifadhi maana ya jumla ya relative + ἄν + subjunctive. Kurudia “Baba” huondoa utata wa kiwakilishi katika Kiswahili bila kupoteza utofautishaji.
- source_word: ταῦτα καὶ ὁ υἱὸς ὁμοίως ποιεῖ
  choice: Mwana pia hukifanya vivyo hivyo
  rationale: “Pia” na “vivyo hivyo” huhifadhi msisitizo wa ulinganifu kamili wa matendo ya Baba na ya Mwana.
theological_decisions:
- issue: Kauli ya Mwana kutoweza kutenda kutoka kwake mwenyewe
  choice: Mwana hawezi kufanya chochote kwa kujitegemea mwenyewe
  alternative: Mwana hawezi kufanya chochote peke yake
  rationale: Chaguo hili linahifadhi madai ya maandiko kuhusu kutotengana kwa utendaji wa Mwana na Baba, bila kugeuza kauli kuwa ukosefu wa uungu au udhaifu wa asili.
- issue: Majina ya kimahusiano ὁ υἱὸς na τὸν πατέρα
  choice: Mwana / Baba
  alternative: mwana / baba
  rationale: Herufi kubwa zinaonyesha kuwa haya yanatumika kama majina maalumu ya kimahusiano kwa Yesu na Baba katika muktadha huu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo umewekwa wa kawaida bila kufuta msisitizo wa sentensi ya Kigiriki.
