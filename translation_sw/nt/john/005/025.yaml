id: JHN.5.25
reference: John 5:25
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἀμὴν ἀμὴν λέγω ὑμῖν ὅτι ἔρχεται ὥρα καὶ νῦν ἐστιν ὅτε οἱ νεκροὶ ⸀ἀκούσουσιν τῆς φωνῆς τοῦ υἱοῦ τοῦ θεοῦ καὶ οἱ ἀκούσαντες ⸀ζήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/025.yaml
  text: Truly[a], truly, I say to you that an hour is coming, and now is, when the dead will hear the voice of the Son of God[d][c][b], and those who hear will live.
translation:
  language: sw
  text: Kweli[a], kweli, nawaambia kwamba saa[b] inakuja, na sasa ipo, ambapo wafu[c] wataisikia sauti ya Mwana wa Mungu, na wale watakaoisikia[d] wataishi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata muundo wa asili kwa ukaribu zaidi, “Amin, amin, nawaambia.”
    reason: lexical_alternative
  - marker: b
    text: Neno “saa” linaweza pia kueleweka kwa maana pana zaidi ya “wakati,” lakini Kigiriki kinatumia hasa neno “saa.”
    reason: lexical_alternative
  - marker: c
    text: “Wafu” huenda wakajumuisha hapa maana ya sasa ya kiroho (“na sasa ipo”), huku pia wakielekeza mbele kwenye ufufuo wa mwili katika muktadha unaozunguka mstari huu.
    reason: cross_reference
  - marker: d
    text: Au “wale ambao wamesikia wataishi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀμὴν ἀμὴν
  choice: Kweli, kweli
  rationale: Inawasilisha uthibitisho wa dhati na marudio yenye mkazo kwa Kiswahili cha kawaida; tanbihi inahifadhi umbo rasmi zaidi, “Amin, amin.”
- source_word: λέγω ὑμῖν
  choice: nawaambia
  rationale: Inahifadhi usemi wa moja kwa moja kwa wasikilizaji wengi kwa lugha ya asili na yenye heshima.
- source_word: ἔρχεται ὥρα
  choice: saa inakuja
  rationale: Inahifadhi neno mahsusi ὥρα na uzito wake katika Injili ya Yohana badala ya kulipanua moja kwa moja kuwa “wakati.”
- source_word: καὶ νῦν ἐστιν
  choice: na sasa ipo
  rationale: Inahifadhi kwa ufupi mvutano kati ya saa inayokuja na uwepo wake wa sasa bila kuufafanua kupita kiasi.
- source_word: οἱ νεκροὶ
  choice: wafu
  rationale: Ni tafsiri ya moja kwa moja isiyobana maana kuwa kifo cha kiroho pekee au kifo cha mwili pekee.
- source_word: ἀκούσουσιν τῆς φωνῆς
  choice: wataisikia sauti
  rationale: “Sauti” inafaa kwa msemaji binafsi, na “kusikia” haiingizi wazo la kuitii ambalo halijaelezwa wazi katika kitenzi.
- source_word: τοῦ υἱοῦ τοῦ θεοῦ
  choice: ya Mwana wa Mungu
  rationale: Inahifadhi cheo kamili cha Kikristo kwa uwazi na kwa muundo unaoeleweka katika Kiswahili.
- source_word: οἱ ἀκούσαντες
  choice: wale watakaoisikia
  rationale: Ni Kiswahili cha asili katika kauli yenye mwelekeo wa wakati ujao, huku tanbihi ikionyesha uwezekano wa kuakisi zaidi umbo timilifu la kishiriki cha Kigiriki.
- source_word: ζήσουσιν
  choice: wataishi
  rationale: Inatafsiri ζάω moja kwa moja bila kuamua mapema kwamba maana ni “watafufuka” au “watakuwa hai.”
theological_decisions:
- issue: Maana ya “wafu” katika muktadha wa Yohana
  choice: Imetafsiriwa kwa neno rahisi “wafu,” bila ufafanuzi wa kimafundisho katika matini kuu.
  alternative: “waliokufa kiroho” au “wafu wa mwili”
  rationale: Maneno “na sasa ipo” yanaweza kudokeza hali ya sasa ya kupewa uzima, huku muktadha unaofuata ukizungumzia pia ufufuo wa mwili. Tafsiri inahifadhi mvutano huo.
- issue: Cheo cha Kikristo τοῦ υἱοῦ τοῦ θεοῦ
  choice: Mwana wa Mungu
  alternative: Mwana wake Mungu
  rationale: “Mwana wa Mungu” linaakisi moja kwa moja cheo cha Kigiriki bila kuongeza ufafanuzi wa kimafundisho usiomo katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo “saa inakuja, na sasa ipo” umeachwa kwa kiasi fulani ukiwa na mkazo wa asili ili kuhifadhi mvutano wa wakati ujao na wa sasa katika Kigiriki.
