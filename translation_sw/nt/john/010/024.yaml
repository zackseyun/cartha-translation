  text: ἐκύκλωσαν οὖν αὐτὸν οἱ Ἰουδαῖοι καὶ ἔλεγον αὐτῷ· Ἕως πότε τὴν ψυχὴν ἡμῶν αἴρεις; εἰ σὺ εἶ ὁ χριστός, εἰπὲ ἡμῖν παρρησίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/024.yaml
  text: So the Jews surrounded him and were saying to him[a], “How long will you keep us in suspense? If you are the Messiah[b], tell us plainly.”
translation:
  language: sw
  text: Basi Wayahudi[a] wakamzunguka, wakawa wakimwambia, “Utatuweka katika mashaka mpaka lini?[b] Ikiwa wewe ndiye Masihi, tuambie waziwazi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika Injili ya Yohana, neno “Wayahudi” linaweza kumaanisha hasa viongozi wa Kiyahudi au Wayahudi waliompinga Yesu katika muktadha fulani, wala si Wayahudi wote kwa ujumla.
    reason: cultural_note
  - marker: b
    text: Kwa tafsiri ya karibu zaidi, “Unainua nafsi yetu mpaka lini?” Hii ni nahau yenye maana ya kuwaweka watu katika hali ya kutokuwa na uhakika au mashaka.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκύκλωσαν
  choice: wakamzunguka
  rationale: Kitenzi hiki humaanisha kuzunguka au kuweka katikati. “Wakamzunguka” ni Kiswahili cha kawaida kinachohifadhi hisia ya kitendo cha kimwili na hali ya kumkabili.
- source_word: οὖν
  choice: Basi
  rationale: Kiunganishi hiki kinaendeleza simulizi na kuonyesha uhusiano na yaliyotangulia; “Basi” kinafanya hivyo kwa mtiririko wa kawaida wa Kiswahili.
- source_word: οἱ Ἰουδαῖοι
  choice: Wayahudi
  rationale: Maana ya moja kwa moja ni “Wayahudi.” Kwa kuwa mstari wenyewe hauwataji wazi kuwa viongozi, tafsiri kuu haiongezi ufafanuzi huo; tanbihi inaeleza uwezekano wa maana finyu katika muktadha wa Yohana.
- source_word: ἔλεγον
  choice: wakawa wakimwambia
  rationale: Wakati usiotimilika wa Kigiriki unaonyesha usemi uliokuwa ukiendelea au kurudiwa. Muundo huu wa Kiswahili unahifadhi hali hiyo bila kulazimisha kwamba kila mtu alisema maneno hayo mara nyingi.
- source_word: Ἕως πότε
  choice: mpaka lini
  rationale: Hii ndiyo njia ya kawaida na ya moja kwa moja ya kuuliza kuhusu muda unaoendelea katika Kiswahili.
- source_word: τὴν ψυχὴν ἡμῶν αἴρεις
  choice: Utaendelea kutuweka katika mashaka
  rationale: Kirai hicho, ambacho kwa karibu zaidi ni “unainua nafsi yetu,” ni nahau ya kuwaacha watu katika kutokuwa na uhakika. “Kutuweka katika mashaka” hutoa maana yake kwa Kiswahili cha sasa, huku tanbihi ikihifadhi taswira ya asili.
- source_word: ὁ χριστός
  choice: Masihi
  rationale: Hapa Χριστός ni cheo cha mfalme na mkombozi aliyetazamiwa, si jina la kawaida; “Masihi” huhifadhi mazingira ya Kiyahudi ya swali hilo.
- source_word: εἰπὲ ἡμῖν
  choice: tuambie
  rationale: Amri hii ni ya moja kwa moja; “tuambie” ni fupi, ya kawaida, na yenye nguvu inayofaa.
- source_word: παρρησίᾳ
  choice: waziwazi
  rationale: Katika muktadha huu neno linaashiria kusema kwa uwazi bila utata. “Waziwazi” linaonyesha dai lao la kutaka jibu dhahiri.
theological_decisions:
- issue: Tafsiri ya Χριστός
  choice: Masihi
  alternative: Kristo
  rationale: Neno hili linatumika hapa kama cheo cha Kiyahudi cha yule mfalme-mkombozi aliyetazamiwa. “Masihi” linaonyesha cheo hicho badala ya kulifanya lionekane kama jina binafsi.
- issue: Wanaorejelewa na οἱ Ἰουδαῖοι katika Yohana
  choice: Wayahudi
  alternative: viongozi wa Wayahudi; Wayudea
  rationale: Ingawa katika Injili ya Yohana usemi huu wakati mwingine humaanisha hasa viongozi au wapinzani wa Yesu waliokuwa Wayahudi, mstari huu hauwabainishi hivyo. Matini kuu inahifadhi upana wa Kigiriki, na tanbihi inaonya dhidi ya kuuelewa kuwa hukumu juu ya Wayahudi wote.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi inatumia msamiati wa kawaida unaoeleweka kwa wasomaji wengi, huku “wakawa wakimwambia” ikihifadhi hali ya tendo lililoendelea na “Masihi” ikihifadhi cheo cha Kiyahudi.
