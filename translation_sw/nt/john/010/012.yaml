  text: ὁ ⸀μισθωτὸς καὶ οὐκ ὢν ποιμήν, οὗ οὐκ ⸀ἔστιν τὰ πρόβατα ἴδια, θεωρεῖ τὸν λύκον ἐρχόμενον καὶ ἀφίησιν τὰ πρόβατα καὶ φεύγει— καὶ ὁ λύκος ἁρπάζει αὐτὰ καὶ ⸀σκορπίζει—
base_translation:
  language: en
  yaml_path: translation/nt/john/010/012.yaml
  text: The hired hand[a], who is not a shepherd and whose sheep are not his own, sees the wolf coming and leaves the sheep and flees—and the wolf snatches them and scatters them.
translation:
  language: sw
  text: Mwajiriwa, ambaye si mchungaji, na kondoo hao si wake, humwona mbwa-mwitu akija, kisha huwachaa kondoo[a] na hukimbia—na mbwa-mwitu huwanyakua na kuwatawanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “huwatelekeza kondoo.” Kitenzi “huwacha” kinaweza kuwa na maana yenye nguvu zaidi ya kuwaacha katika hatari.
    reason: lexical_alternative
lexical_decisions:
- source_word: μισθωτός
  choice: mwajiriwa
  rationale: Humaanisha mtu anayefanya kazi kwa ujira. “Mwajiriwa” ni Kiswahili cha sasa na hudumisha tofauti kati yake na mchungaji wa kweli.
- source_word: οὐκ ὢν ποιμήν
  choice: ambaye si mchungaji
  rationale: Kishazi tegemezi kinasikika kwa kawaida katika Kiswahili huku kikihifadhi dai kwamba yeye si mchungaji.
- source_word: οὗ οὐκ ἔστιν τὰ πρόβατα ἴδια
  choice: ambaye kondoo si mali yake mwenyewe
  rationale: Hueleza wazi kwamba kondoo hao si wake, na “mwenyewe” huhifadhi msisitizo wa ἴδια.
- source_word: θεωρεῖ
  choice: humwona
  rationale: Katika muktadha huu kitenzi kinaonyesha kutambua kwa kuona hatari inayokuja.
- source_word: τὸν λύκον ἐρχόμενον
  choice: mbwa mwitu akija
  rationale: Huhifadhi tendo linaloendelea la mbwa mwitu kukaribia bila kuongeza ufafanuzi.
- source_word: ἀφίησιν
  choice: huwaacha
  rationale: Ni kisawe cha moja kwa moja kinachoweza pia kuwa na maana yenye nguvu zaidi ya kuwatelekeza katika hatari; uwezekano huo umeonyeshwa katika tanbihi.
- source_word: φεύγει
  choice: kukimbia
  rationale: Hutoa kwa kawaida tendo la kukimbia ili kuepuka hatari; pamoja na “huwaacha” linategemea kitenzi kisaidizi “hu-” kilichotangulia.
- source_word: ἁρπάζει
  choice: huwanyakua
  rationale: “Kunyakua” hudokeza kuwakamata kwa nguvu na kwa ghafula, kulingana na tendo la mnyama anayewinda.
- source_word: σκορπίζει
  choice: kuwatawanya
  rationale: Huhifadhi matokeo kwamba kondoo wanatawanyika; kiwakilishi cha yambwa kinawekwa wazi kwa Kiswahili cha kawaida.
- source_word: πρόβατα
  choice: kondoo
  rationale: Hudumisha taswira halisi ya kondoo badala ya kutumia nomino ya kijumla kama “kundi.”
theological_decisions:
- issue: Nguvu ya kisitiari ya taswira ya mchungaji
  choice: Kudumisha “mchungaji,” “mwajiriwa,” “kondoo,” na “mbwa mwitu” kama istilahi halisi za ufugaji ndani ya sitiari.
  alternative: Kutumia lugha ya kufasiri kama “kiongozi” au “mlezi.”
  rationale: Yohana 10 hutegemea taswira endelevu ya mchungaji. Kuibadili kuwa dhana za ufafanuzi kungepunguza nguvu ya sitiari na kuingiza tafsiri isiyotajwa katika Kigiriki.
- issue: Maana ya ἀφίησιν
  choice: Kutumia “huwaacha” katika matini na kutaja “huwatelekeza” katika tanbihi.
  alternative: Kutumia moja kwa moja “huwatelekeza” katika matini.
  rationale: Kitenzi kinaweza kumaanisha kuacha au kutelekeza. Matini inahifadhi upana wa kimsamiati, huku muktadha na tanbihi zikionyesha uzito wa tendo hilo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inadumisha wakati wa sasa wa kisimulizi na mwendo wa haraka wa Kigiriki. Alama ya tanbihi imewekwa baada ya “Mwajiriwa”; tanbihi inafafanua mbadala wa μισθωτός bila kuingiza tafsiri ya kimadhehebu.
