base_translation:
  language: en
  yaml_path: translation/nt/john/010/008.yaml
  text: All who came before me are thieves and robbers[a], but the sheep did not listen to them.
translation:
  language: sw
  text: Wote waliokuja kabla yangu ni wezi na wanyang’anyi[a], lakini kondoo hawakuwasikiliza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walionitangulia.” Maneno haya yanaweza kueleweka kwa wakati (“kabla yangu”) au kwa maana ya kuja mapema huku wakidai mamlaka bila kumtambua Yesu. Muktadha unaelekeza kwa wachungaji wa uongo, si watumishi wote wa Mungu waliomtangulia Yesu.
    reason: alternative_reading
lexical_decisions:
- source_word: πάντες ὅσοι
  choice: Wote
  rationale: Muundo huu una maana ya ujumla kwa kundi linalozungumziwa; “Wote” ni Kiswahili cha kawaida na huhifadhi upeo huo.
- source_word: ἦλθον
  choice: waliokuja
  rationale: Wakati uliopita wa Kigiriki unawakilishwa kwa kawaida na “waliokuja,” bila kuongeza wazo la matokeo yanayoendelea.
- source_word: πρὸ ἐμοῦ
  choice: kabla yangu
  rationale: Huhifadhi maana ya kawaida ya wakati, huku uwezekano wa maana ya kuwa mbele au kutangulia ukielezwa katika tanbihi.
- source_word: κλέπται
  choice: wezi
  rationale: Ni neno la kawaida kwa watu wanaoiba, na linafaa katika picha ya wanaoingia isivyo halali katika muktadha huu.
- source_word: λῃσταί
  choice: wanyang’anyi
  rationale: Hutofautisha neno hili na “wezi” na kudokeza uporaji wa nguvu au wa kikatili bila kulibainisha kupita kiasi.
- source_word: ἀλλ’
  choice: lakini
  rationale: Ni kiunganishi cha kawaida cha kuonyesha utofauti katika Kiswahili.
- source_word: οὐκ ἤκουσαν αὐτῶν
  choice: hawakuwasikiliza
  rationale: Katika mfano wa mchungaji na kondoo, kitenzi kinahusu si kusikia sauti tu bali kuitambua na kuitikia; “hawakuwasikiliza” kinafaa kwa muktadha.
- source_word: τὰ πρόβατα
  choice: kondoo
  rationale: Ni tafsiri ya kawaida katika mfano huu; umbo hilo la Kiswahili linaweza kutaja wingi bila kiambishi cha makala.
theological_decisions:
- issue: Upeo na maana ya “wote waliokuja kabla yangu”
  choice: Kutafsiri moja kwa moja “Wote waliokuja kabla yangu” bila kuingiza ufafanuzi katika matini kuu.
  alternative: Wote waliotangulia mbele yangu; au wale waliodai mamlaka ya kichungaji bila kumtegemea Yesu.
  rationale: Maneno ya Kigiriki ni mapana, lakini muktadha unaelekeza kwa wachungaji wa uongo, si lazima watumishi wote wa Mungu waliomtangulia Yesu. Matini kuu huhifadhi mvutano huo, na tanbihi hutoa ufafanuzi wa kimuktadha bila kuufanya kuwa sehemu ya tafsiri.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Wezi na wanyang’anyi” huhifadhi tofauti ya jozi ya maneno ya Kigiriki, na sentensi imewekwa kwa mtiririko wa kawaida unaoeleweka kwa wasomaji wengi.
