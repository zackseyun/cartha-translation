  text: κἀγὼ ⸂δίδωμι αὐτοῖς ζωὴν αἰώνιον⸃, καὶ οὐ μὴ ἀπόλωνται εἰς τὸν αἰῶνα, καὶ οὐχ ἁρπάσει τις αὐτὰ ἐκ τῆς χειρός μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/028.yaml
  text: And I give them eternal life, and they will certainly never perish forever, and no one will snatch them out of my hand.
translation:
  language: sw
  text: Nami ninawapa uzima wa milele, nao hakika hawataangamia kamwe, wala hakuna yeyote atakayewanyakua kutoka mkononi mwangu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κἀγώ
  choice: Nami
  rationale: Huunganisha kauli hii na iliyotangulia huku ikisisitiza mhusika, yaani Yesu.
- source_word: ζωὴν αἰώνιον
  choice: uzima wa milele
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja ya kirai kinachomaanisha uzima wa enzi ijayo au uzima usio na mwisho.
- source_word: οὐ μὴ ἀπόλωνται εἰς τὸν αἰῶνα
  choice: hakika hawataangamia kamwe
  rationale: ‘Hakika’ huonyesha ukanushaji wenye nguvu wa οὐ μή, na ‘kamwe’ huwasilisha nguvu ya εἰς τὸν αἰῶνα kwa Kiswahili cha kawaida bila urudiaji usio wa asili.
- source_word: ἁρπάσει
  choice: atayewanyakua
  rationale: Huhifadhi wazo la kuwakamata au kuwaondoa kwa nguvu.
- source_word: ἐκ τῆς χειρός μου
  choice: kutoka mkononi mwangu
  rationale: Huhifadhi taswira halisi ya kuwa katika mkono wa Yesu, inayodokeza ulinzi na mamlaka.
theological_decisions:
- issue: Nguvu ya ahadi kwamba kondoo hawataangamia
  choice: hakika hawataangamia kamwe
  alternative: hawataangamia hata milele
  rationale: Chaguo hili huhifadhi ukanushaji maradufu wenye msisitizo pamoja na εἰς τὸν αἰῶνα, bila kuingiza maelezo ya kimadhehebu kuhusu namna au masharti ya usalama huo.
- issue: Taswira ya mkono wa Yesu
  choice: mkononi mwangu
  alternative: chini ya ulinzi wangu
  rationale: Tafsiri halisi huhifadhi taswira na mvutano wa kiteolojia wa matini badala ya kuifafanua kwa maana moja tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo ni wa asili kwa msomaji wa kawaida, huku msisitizo wa Kigiriki na taswira ya ‘mkono’ vikihifadhiwa.
