  text: εἰ δὲ ποιῶ, κἂν ἐμοὶ μὴ πιστεύητε τοῖς ἔργοις ⸀πιστεύετε, ἵνα γνῶτε καὶ ⸀γινώσκητε ὅτι ἐν ἐμοὶ ὁ πατὴρ κἀγὼ ἐν ⸂τῷ πατρί⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/038.yaml
  text: But if I do them[a], even if you do not believe me, believe the works, so that you may know and continue to know that the Father is in me[c][b], and I am in the Father.
translation:
  language: sw
  text: Lakini ikiwa ninazitenda, hata kama hamniamini[a], ziaminini hizo kazi, ili mpate kujua na kuendelea kujua[b] kwamba Baba yuko ndani yangu, nami niko ndani ya Baba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hata kama hamweki imani yenu kwangu.” Muundo wa Kigiriki unaweza kumaanisha kutokubali maneno ya Yesu au kutomwamini yeye.
    reason: lexical_alternative
  - marker: b
    text: Vitenzi viwili vya Kigiriki vina maumbo tofauti, ambayo huenda yakasisitiza kufikia ujuzi na kisha kuendelea kuwa nao.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιῶ
  choice: ninazitenda
  rationale: Kitenzi cha wakati uliopo kinaelekeza kwa kazi za Yesu zinazotajwa katika muktadha. Kiambishi cha yambwa “-zi-” kinarejelea kazi hizo bila kuongeza nomino nyingine.
- source_word: κἂν ἐμοὶ μὴ πιστεύητε
  choice: hata kama hamniamini
  rationale: Muundo wa πιστεύω pamoja na ἐμοί unaweza kumaanisha kuamini maneno ya Yesu au kumwamini yeye. “Hamniamini” ni wa asili katika Kiswahili na huhifadhi kiasi fulani cha upana huo.
- source_word: τοῖς ἔργοις πιστεύετε
  choice: ziaminini kazi hizo
  rationale: Kauli hii inazitaja kazi kuwa ushahidi unaopaswa kuaminiwa. “Ziaminini” hudumisha mkazo wa Kigiriki bila kusema waweke imani ya kidini katika kazi zenyewe.
- source_word: ἔργοις
  choice: kazi
  rationale: “Kazi” hudumisha istilahi ya Yohana kwa matendo ya Yesu yanayomfunua; “ishara” ingeongeza tafsiri ambayo neno ἔργα lenyewe halisemi.
- source_word: ἵνα γνῶτε καὶ γινώσκητε
  choice: ili mpate kujua na kuendelea kujua
  rationale: 'Kauli hii huonyesha tofauti ya hali kati ya γνῶτε na γινώσκητε: kufikia maarifa na kuendelea kuwa nayo, huku ikitumia kitenzi kilekile kama Kigiriki.'
- source_word: ἐν ἐμοὶ ὁ πατὴρ κἀγὼ ἐν τῷ πατρί
  choice: Baba yuko ndani yangu, nami niko ndani ya Baba
  rationale: “Ndani ya” huhifadhi usemi wa pande mbili wa ἐν bila kuufafanua kuwa umoja, makao, au fundisho la baadaye.
- source_word: πατήρ
  choice: Baba
  rationale: Kigiriki kinasema “Baba” kwa nomino yenye kibainishi, si “Baba yangu.” Katika muktadha huu Kiswahili hutumia jina la cheo “Baba” bila kuhitaji kibainishi tofauti.
theological_decisions:
- issue: Kuwamo kwa Baba ndani ya Mwana na Mwana ndani ya Baba
  choice: Baba yuko ndani yangu, nami niko ndani ya Baba
  alternative: Baba ameungana nami, nami nimeungana na Baba
  rationale: Tafsiri ya moja kwa moja huhifadhi dai la uhusiano wa pande mbili na mvutano wake wa kitheolojia bila kuingiza istilahi za kimadhehebu au kulifanya kuwa maelezo ya fundisho.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Ziaminini kazi hizo” ni usemi mkato kwa makusudi ili kuhifadhi nguvu ya kauli ya Kigiriki; “Baba yuko ndani yangu” hudumisha lugha ya Yohana bila ufafanuzi wa kimadhehebu.
