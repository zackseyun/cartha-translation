base_translation:
  language: en
  yaml_path: translation/nt/john/010/017.yaml
  text: For this reason the Father loves me[a], because I lay down my life so that I may take it up again.
translation:
  language: sw
  text: Kwa sababu hii Baba ananipenda, kwa kuwa ninautoa uhai wangu ili niuchukue tena.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ili niupokee tena.” Kitenzi cha Kigiriki kinaweza kumaanisha kupokea au kuchukua; katika muktadha huu kinahusu Yesu kuwa hai tena baada ya kutoa uhai wake.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Kwa sababu hii
  rationale: Ni usemi wa kawaida wa Kiswahili unaohifadhi uhusiano wa kisababishi na maelezo yanayofuata.
- source_word: με ὁ πατὴρ ἀγαπᾷ
  choice: Baba ananipenda
  rationale: Neno la Kigiriki linamtaja ‘Baba’ bila kuongeza kimilikishi ‘yangu,’ hivyo tafsiri inadumisha muundo na msamiati wa Yohana.
- source_word: ὅτι
  choice: kwa kuwa
  rationale: Hapa ὅτι inaleta sababu ya upendo wa Baba; ‘kwa kuwa’ ni ya asili na ina maana ya kisababishi.
- source_word: τίθημι τὴν ψυχήν μου
  choice: ninautoa uhai wangu
  rationale: Katika muktadha huu, usemi huo unamaanisha kutoa uhai kwa hiari katika kifo. ‘Ninautoa’ ni wa kawaida zaidi katika Kiswahili kuliko tafsiri halisi ya kuweka chini.
- source_word: τὴν ψυχήν μου
  choice: uhai wangu
  rationale: ψυχή hapa ni uhai ambao Yesu anautoa katika kifo na kuupokea tena, si hoja mahsusi kuhusu tofauti ya mwili na roho.
- source_word: ἵνα
  choice: ili
  rationale: ‘Ili’ huhifadhi maana ya kusudi bila kulazimisha uamuzi mkali kati ya kusudi na matokeo.
- source_word: πάλιν
  choice: tena
  rationale: Huonyesha kurudishwa kwa uhai baada ya kutolewa.
- source_word: λάβω αὐτήν
  choice: niupokee tena
  rationale: λαμβάνω kwa msingi wake inaweza kumaanisha kupokea au kuchukua. ‘Niupokee tena’ ni Kiswahili cha kawaida kinachohifadhi uwezekano huo wa kileksia bila kuondoa mamlaka ya Yesu yanayosisitizwa katika mstari unaofuata.
theological_decisions:
- issue: Maana ya ψυχή katika muktadha wa Yesu kujitoa
  choice: uhai wangu
  alternative: nafsi yangu
  rationale: Muktadha unahusu kifo cha Yesu na kurudia kwake kuwa hai. ‘Uhai’ huepuka kuingiza dai la kianthropolojia ambalo mstari haulengi.
- issue: Nguvu ya ἵνα pamoja na λάβω kuhusu kifo na ufufuo wa Yesu
  choice: ili niupokee tena
  alternative: ili niuchukue tena
  rationale: ‘Ili’ huhifadhi kusudi, na hali tegemezi ya Kiswahili ‘niupokee’ huakisi muundo wa ἵνα na kitenzi tegemezi bila kuugeuza kuwa wakati ujao wa moja kwa moja.
- issue: Maana ya λάβω katika kuchukua au kupokea uhai tena
  choice: niupokee tena
  alternative: niuchukue tena
  rationale: Chaguo hili linatunza maana ya kawaida ya λαμβάνω na kutokufunga utata wa kileksia. Muktadha wa karibu bado unaweka wazi kwamba tendo hili linahusiana na mamlaka ya Yesu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Ninautoa uhai wangu’ ni usemi wazi na wa asili unaowasilisha kujitoa kwa hiari. Alama ya tanbihi imewekwa baada ya sentensi.
