  text: ὁ κλέπτης οὐκ ἔρχεται εἰ μὴ ἵνα κλέψῃ καὶ θύσῃ καὶ ἀπολέσῃ· ἐγὼ ἦλθον ἵνα ζωὴν ἔχωσιν καὶ περισσὸν ἔχωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/010.yaml
  text: The thief comes only to steal and slaughter and destroy[a]; I came so that they may have life[b], and have it abundantly.
translation:
  language: sw
  text: Mwizi huja tu ili aibe, achinje na kuangamiza[a]; mimi nilikuja ili wawe na uzima, na wawe nao kwa wingi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “aue” badala ya “achinje” (θύσῃ). Kitenzi cha Kigiriki mara nyingi humaanisha kuchinja, jambo linalofaa picha ya kondoo katika muktadha huu.
    reason: lexical_alternative
  - marker: b
    text: Au “wawe na uzima kwa wingi” au “wawe nao kwa utimilifu.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ κλέπτης
  choice: Mwizi
  rationale: Nomino hii yenye kiambishi katika Kigiriki inamtaja mwizi kwa maana ya mwakilishi katika mfano wa mchungaji na kondoo; Kiswahili hakihitaji neno la ziada kuonyesha umahususi huo.
- source_word: οὐκ ἔρχεται εἰ μὴ
  choice: huja tu
  rationale: Huu ni usemi unaoweka kusudi pekee la kuja kwake. “Huja tu” ni Kiswahili cha kawaida kinachohifadhi nguvu ya ‘haji isipokuwa’ bila kuwa kizito.
- source_word: ἵνα κλέψῃ
  choice: ili aibe
  rationale: Muundo huu unaonyesha kusudi; “ili aibe” unalihifadhi wazi na kwa kawaida katika Kiswahili.
- source_word: θύσῃ
  choice: achinje
  rationale: Kitenzi θύω mara nyingi humaanisha kuchinja, hasa wanyama. “Achinje” kinafaa kwa picha ya kondoo katika muktadha kuliko neno la jumla “aue.”
- source_word: ἀπολέσῃ
  choice: kuangamiza
  rationale: “Kuangamiza” linaonyesha uharibifu kamili katika mfululizo wa kuiba na kuchinja, bila kubainisha zaidi kitu au namna ya uharibifu.
- source_word: ἐγὼ ἦλθον
  choice: mimi nilikuja
  rationale: Kiwakilishi “mimi” kinahifadhi msisitizo wa ἐγώ na kuonyesha tofauti kati ya kusudi la Yesu na la mwizi; wakati uliopita unawakilisha aoristi kwa kawaida.
- source_word: ἵνα ζωὴν ἔχωσιν
  choice: ili wawe na uzima
  rationale: “Ili” linahifadhi kishazi cha kusudi, na “uzima” linadumisha neno muhimu la Yohana bila kulipanua kuwa “uzima wa milele,” jambo ambalo halijasemwa wazi hapa.
- source_word: περισσὸν ἔχωσιν
  choice: nao wawe nao kwa wingi
  rationale: Kiwakilishi “nao” kinarejelea uzima, huku “kwa wingi” kikionyesha kiwango au utimilifu wa kuwa nao bila kuingiza wazo la mafanikio ya mali.
theological_decisions:
- issue: Upeo wa ζωὴ katika matumizi ya Yohana
  choice: uzima
  alternative: uzima wa milele; uzima wa kweli
  rationale: Aya inatumia ζωὴ bila kivumishi kinachomaanisha ‘wa milele.’ “Uzima” huhifadhi kina cha kitheolojia cha Yohana bila kuongeza ufafanuzi wa kimafundisho usiotajwa wazi.
- issue: Nguvu ya περισσὸν
  choice: kwa wingi
  alternative: kwa ukamilifu; uzima mwingi
  rationale: Usemi huu unaonyesha wingi au utimilifu wa uzima anaoutoa Yesu. “Kwa wingi” huhifadhi maana hiyo bila kuugeuza kuwa ahadi ya utajiri au mafanikio ya kimwili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa maandiko. “Achinje” kinadumisha picha ya kondoo, na “uzima” pamoja na “kwa wingi” huepuka upanuzi wa kimadhehebu au wa mafanikio ya mali.
