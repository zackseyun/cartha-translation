base_translation:
  language: en
  yaml_path: translation/nt/john/010/025.yaml
  text: Jesus answered them[a], “I told you, and you do not believe[b]. The works that I do in the name of my Father—these testify about me.”
translation:
  language: sw
  text: Yesu akawajibu, “Niliwaambia, na hamwamini. Kazi ninazofanya kwa jina la Baba yangu[a]—hizo zinanishuhudia[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa mamlaka ya Baba yangu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “hizo zinatoa ushahidi kunihusu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: akawajibu
  rationale: Ni usemi wa kawaida wa masimulizi unaoonyesha jibu la Yesu kwa watu waliokuwa wakizungumza naye.
- source_word: Εἶπον ὑμῖν
  choice: Niliwaambia
  rationale: Wakati uliopita unaelekeza kwenye maneno ambayo Yesu alikuwa amekwisha kuwaambia; umbo hili ni la asili na linahifadhi walengwa wa kauli hiyo.
- source_word: οὐ πιστεύετε
  choice: hamwamini
  rationale: Kitenzi 'amini' kinahifadhi msamiati muhimu wa Injili ya Yohana bila kuongeza kitu kisichotajwa wazi ambacho hawakukiamini.
- source_word: τὰ ἔργα
  choice: Kazi
  rationale: '''Kazi'' ni neno pana na la kawaida linalofaa kwa matendo na ishara za Yesu, na linaweza kutumiwa kwa uthabiti katika Yohana.'
- source_word: ἐν τῷ ὀνόματι
  choice: kwa jina la
  rationale: Usemi huu unahifadhi wigo wa Kigiriki wa uwakilishi, uhusiano na mamlaka, badala ya kuufupisha kuwa mamlaka peke yake.
- source_word: πατρός μου
  choice: Baba yangu
  rationale: '''Baba'' hapa ni jina la kimahusiano linalomtaja Mungu, hivyo herufi kubwa inafaa katika muktadha huu.'
- source_word: ταῦτα μαρτυρεῖ περὶ ἐμοῦ
  choice: hizo zinanishuhudia
  rationale: '''Hizo'' inadumisha msisitizo wa ταῦτα, na ''zinanishuhudia'' huhifadhi taswira ya ushahidi iliyo muhimu katika Injili ya Yohana.'
theological_decisions:
- issue: Uhusiano wa kazi za Yesu na jina au mamlaka ya Baba
  choice: kwa jina la Baba yangu
  alternative: kwa mamlaka ya Baba yangu
  rationale: Tafsiri ya moja kwa moja inadumisha madai ya uwakilishi na idhini ya Baba bila kuyawekea mipaka kuwa mamlaka pekee; hivyo mvutano na upana wa kiteolojia wa kifungu unabaki.
- issue: Kazi za Yesu kama ushahidi kumhusu
  choice: hizo zinanishuhudia
  alternative: hizo zinatoa ushahidi kunihusu
  rationale: Chaguo kuu linahifadhi kwa ufupi lugha ya ushuhuda ya Yohana, huku tanbihi ikitoa usemi wa Kiswahili ulio wazi zaidi bila kubadili maana.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Lakini' limechaguliwa kuonyesha uhusiano wa kimkinzano unaoeleweka katika καί ya muktadha huu. Alama za tanbihi zimewekwa kwenye vifungu vinavyohusika, kwa kuwa nafasi zake katika safu ya mashauriano ya Kiingereza hazikulingana na maudhui ya tanbihi.
