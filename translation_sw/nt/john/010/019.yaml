  text: Because of these words[a], a division arose again among the Jews.
translation:
  language: sw
  text: Kwa sababu ya maneno hayo, mgawanyiko ukatokea tena miongoni mwa Wayahudi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watu wa Yudea,” au katika baadhi ya miktadha katika Injili ya Yohana, “viongozi wa Kiyahudi.” Neno “Wayahudi” hapa linafuata usemi wa Kigiriki, lakini katika Injili ya Yohana mara nyingi humaanisha kundi fulani kulingana na muktadha, wala si Wayahudi wote kwa ujumla.
    reason: lexical_alternative
lexical_decisions:
- source_word: Σχίσμα
  choice: mgawanyiko
  rationale: Neno hili humaanisha mpasuko au mgawanyiko; hapa linaeleza watu kutofautiana katika mwitikio wao kwa maneno ya Yesu.
- source_word: πάλιν
  choice: tena
  rationale: Kielezi hiki kinaonyesha kurudiwa kwa jambo lililokuwa limetokea hapo awali katika simulizi.
- source_word: ἐγένετο
  choice: ukatokea
  rationale: Kitenzi kinaonyesha kwamba hali hiyo ilitokea; ‘ukatokea’ ni Kiswahili cha kawaida kinachoendana vizuri na ‘mgawanyiko.’
- source_word: ἐν τοῖς Ἰουδαίοις
  choice: miongoni mwa Wayahudi
  rationale: Hii ni tafsiri ya moja kwa moja ya kirai cha Kigiriki, huku tanbihi ikihifadhi uwezekano wa maana ya Wayudea au viongozi wa Kiyahudi kulingana na muktadha wa Yohana.
- source_word: διὰ
  choice: Kwa sababu ya
  rationale: Ikiwa na hali ya accusative, διά huonyesha sababu; ‘kwa sababu ya’ huwasilisha uhusiano huo wazi katika Kiswahili cha sasa.
- source_word: τοὺς λόγους τούτους
  choice: maneno hayo
  rationale: Kirai hiki kinarejelea maneno ambayo Yesu alikuwa ametoka kusema; ‘maneno hayo’ ni cha kawaida na huonyesha marejeo ya nyuma katika simulizi.
theological_decisions:
- issue: Maana ya Ἰουδαῖοι katika Injili ya Yohana
  choice: Wayahudi katika maandishi makuu, pamoja na tanbihi ya kufafanua upeo wake wa kimuktadha
  alternative: Wayudea; viongozi wa Kiyahudi
  rationale: Tafsiri ya moja kwa moja inahifadhi usemi wa Kigiriki, lakini tanbihi inazuia neno hilo lisieleweke kimakosa kuwa linawahusu Wayahudi wote bila ubaguzi; katika Yohana maana yake mara nyingi huamuliwa na muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, fasaha na chenye hadhi. Mpangilio wa sentensi ni wa asili katika Kiswahili, na kiunganishi ‘uka-’ kinaendeleza tukio kwa urahisi bila kupoteza maana ya Kigiriki.
