base_translation:
  language: en
  yaml_path: translation/nt/john/010/011.yaml
  text: I am the good shepherd[c][b][a]. The good shepherd lays down his life for the sheep.
translation:
  language: sw
  text: Mimi ndiye mchungaji mwema[a]. Mchungaji mwema hutoa uhai wake kwa ajili ya kondoo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mchungaji bora” au “mchungaji mwenye sifa njema”; neno la Kigiriki καλός linaweza kumaanisha aliye mwema, bora, au wa kuigwa.
    reason: lexical_alternative
  - marker: b
    text: Kigiriki, “hutia nafsi yake kwa ajili ya kondoo”; hii ni nahau yenye maana ya kutoa uhai wake. “Kwa ajili ya” pia inaweza kutafsiriwa “kwa niaba ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγώ εἰμι
  choice: Mimi ndiye
  rationale: Muundo huu wa Kiswahili unaonyesha msisitizo wa kiwakilishi Ἐγώ kwa njia ya kawaida na yenye hadhi, bila kulazimisha dokezo la moja kwa moja kwa jina la Mungu.
- source_word: ποιμήν
  choice: mchungaji
  rationale: Ni neno la kawaida na sahihi kwa mtu anayechunga kondoo; halileti maana maalumu ya cheo cha kanisa.
- source_word: καλός
  choice: mwema
  rationale: Huwasilisha wema na ubora wa mchungaji kwa Kiswahili cha kawaida; maana zinazowezekana za 'bora' au 'mwenye sifa njema' zimeonyeshwa katika tanbihi.
- source_word: τὴν ψυχὴν αὐτοῦ τίθησιν
  choice: huutoa uhai wake
  rationale: Hii ni tafsiri ya kawaida ya nahau inayomaanisha kujitoa hadi kufa. 'Uhai' huepuka kuelewa ψυχή hapa kama nafsi isiyo ya kimwili, na 'huutoa' ni ya asili zaidi kuliko kuiga moja kwa moja tendo la 'kuweka chini'.
- source_word: ὑπὲρ τῶν προβάτων
  choice: kwa ajili ya kondoo
  rationale: Huhifadhi maana ya kufaidisha au kutenda kwa niaba yao bila kuifungamanisha sentensi na nadharia moja maalumu ya upatanisho.
theological_decisions:
- issue: Nguvu ya utambulisho Ἐγώ εἰμι
  choice: Mimi ndiye
  alternative: Mimi ni; Mimi mwenyewe ndiye
  rationale: Kiswahili hutumia 'ndiye' kwa utambulisho wa kiarifu na msisitizo wa kawaida. Tafsiri haiongezi maelezo yanayolazimisha dokezo la jina la Mungu, ingawa haiyafuti mapana ya kiteolojia ya Injili ya Yohana.
- issue: Maana ya καλός katika jina la mchungaji
  choice: mchungaji mwema
  alternative: mchungaji bora; mchungaji mwenye sifa njema
  rationale: '''Mwema'' ni sahihi, ya kawaida, na huhifadhi wazo la uzuri wa kimaadili na ubora bila kulifafanua kupita kiasi.'
- issue: Maana ya ὑπέρ kuhusu kifo cha Yesu
  choice: kwa ajili ya kondoo
  alternative: kwa niaba ya kondoo
  rationale: Kauli hii hubeba maana ya kufaidisha na inaweza pia kuruhusu wazo la uwakilishi, bila kuamua nadharia fulani ya upatanisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Mimi ndiye' inasikika ya kawaida katika utambulisho huu; 'huutoa uhai wake' huwasilisha nahau ya Kigiriki kwa uwazi. Viashiria vyote vya tanbihi vimewekwa katika matini kuu.
