  text: ἀλλοτρίῳ δὲ οὐ μὴ ⸀ἀκολουθήσουσιν ἀλλὰ φεύξονται ἀπ’ αὐτοῦ, ὅτι οὐκ οἴδασι τῶν ἀλλοτρίων τὴν φωνήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/005.yaml
  text: But they will certainly not follow a stranger[a]; instead, they will flee from him[b], because they do not know the voice of strangers.
translation:
  language: sw
  text: Lakini hawatamfuata kamwe mgeni[a]; badala yake, watamkimbia, kwa sababu hawaijui sauti[b] ya wageni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa hakika hawatamfuata mgeni.” Kigiriki kinatumia ukanushaji wenye mkazo (οὐ μή).
    reason: lexical_alternative
  - marker: b
    text: “Kuijua sauti” pia kunaweza kueleweka kuwa “kuitambua sauti.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλοτρίῳ
  choice: mgeni
  rationale: Katika mfano wa mchungaji na kondoo, neno hili humaanisha mtu asiye wao au wasiyemfahamu. “Mgeni” ni la kawaida na halileti wazo lisilokusudiwa la kabila au taifa jingine.
- source_word: οὐ μὴ ἀκολουθήσουσιν
  choice: hawatamfuata kamwe
  rationale: Muundo οὐ μή pamoja na wakati ujao ni ukanushaji wenye mkazo. “Hawatamfuata kamwe” huonyesha mkazo huo kwa Kiswahili cha sasa.
- source_word: ἀκολουθήσουσιν
  choice: watamfuata
  rationale: Katika muktadha wa kondoo na mchungaji, “kufuata” ndilo neno la moja kwa moja na la kawaida.
- source_word: φεύξονται ἀπ’ αὐτοῦ
  choice: watamkimbia
  rationale: Kitenzi pamoja na ἀπό huonyesha kumwepuka mtu kwa kukimbia mbali naye; “watamkimbia” ni usemi wa asili wa Kiswahili unaobeba maana hiyo.
- source_word: οἴδασι
  choice: hawaijui
  rationale: οἶδα inaweza kumaanisha kujua au kutambua. “Hawaijui sauti” huhifadhi upana huo wa maana bila kuamua kimyakimya kuwa ni utambuzi pekee.
- source_word: τῶν ἀλλοτρίων
  choice: ya wageni
  rationale: Huu ni umilikishi wa wingi unaorejelea kundi la watu wasio wao; “ya wageni” huakisi wingi huo moja kwa moja.
- source_word: φωνήν
  choice: sauti
  rationale: Neno linarejelea sauti au mwito unaoweza kutambulika; “sauti” huhifadhi maana halisi na ya kimahusiano.
- source_word: δὲ ... ἀλλὰ
  choice: Lakini ... badala yake
  rationale: 'Maneno haya yanaweka vitendo viwili katika ulinganisho mkali: hawatafuata, bali watakimbia. Muundo huu ni wazi na wa asili katika Kiswahili.'
theological_decisions:
- issue: Nguvu ya sitiari ya kondoo na mchungaji
  choice: Kudumisha sitiari yenyewe bila kumfafanua “mgeni” katika andiko kuu
  alternative: Kumtambua wazi mgeni kuwa mwalimu wa uongo au kiongozi asiye halali
  rationale: Aya hii inaendelea kuzungumza ndani ya sitiari na haitaji wazi hapa anayewakilishwa na mgeni. Ufafanuzi huo ungeingiza tafsiri ya kitheolojia ndani ya andiko.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Watamkimbia” limetumiwa badala ya muundo mzito “watakimbia mbali naye.” Alama zote za tanbihi zimewekwa katika andiko kuu; [b] imewekwa baada ya kishazi kinachohusika moja kwa moja na maana mbadala ya οἴδασι.
