  text: καθὼς γινώσκει με ὁ πατὴρ κἀγὼ γινώσκω τὸν πατέρα, καὶ τὴν ψυχήν μου τίθημι ὑπὲρ τῶν προβάτων.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/015.yaml
  text: just as the Father knows me and I know the Father[b][a], and I lay down my life for the sheep.
translation:
  language: sw
  text: 'kama vile Baba anavyonijua, nami ninavyomjua Baba, nami nayatoa maisha yangu[a] kwa ajili ya kondoo[b].


    [a] Au “nafsi yangu.” Katika muktadha huu maana yake ni “maisha yangu,” kwa kuwa Yesu anajitoa kufa.


    [b] Au “kwa niaba ya kondoo.” Kihusishi cha Kigiriki kinaweza kuonyesha kutenda kwa manufaa au kwa niaba ya wengine, pamoja na maana ya kujitoa dhabihu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nafsi yangu.” Katika muktadha huu maana yake ni “maisha yangu,” kwa kuwa Yesu anajitoa kufa.
    reason: lexical_alternative
  - marker: b
    text: Au “kwa niaba ya kondoo.” Kihusishi cha Kigiriki kinaweza kuonyesha kutenda kwa manufaa au kwa niaba ya wengine, pamoja na maana ya kujitoa dhabihu.
    reason: alternative_reading
lexical_decisions:
- source_word: καθὼς
  choice: kama vile
  rationale: Inaonyesha ulinganisho wa karibu na kauli iliyotangulia kuhusu kufahamiana kwa mchungaji na kondoo, huku ikisomeka kwa kawaida katika Kiswahili.
- source_word: γινώσκει / γινώσκω
  choice: anavyonijua / ninavyomjua
  rationale: Kitenzi kinamaanisha kujua, hapa kikiwa na uzito wa uhusiano wa karibu. “Kujua” huhifadhi kiungo cha kileksia bila kuongeza ufafanuzi usio katika matini.
- source_word: ὁ πατὴρ / τὸν πατέρα
  choice: Baba
  rationale: Huhifadhi jina la kimahusiano na uwiano wa kauli mbili katika mtindo wa Yohana; Kigiriki hakina kiwakilishi-miliki “yangu.”
- source_word: κἀγὼ
  choice: nami
  rationale: 'Muungano wa καί na ἐγώ unaonyesha uratibu na uwiano: Baba anamjua Yesu, naye Yesu anamjua Baba.'
- source_word: ψυχήν μου
  choice: maisha yangu
  rationale: Katika muktadha wa kujitoa kufa, ψυχή humaanisha uhai au maisha ya mtu, si hasa sehemu isiyo ya mwili. “Maisha yangu” ni ya kawaida na sahihi kimuktadha.
- source_word: τίθημι
  choice: nayatoa
  rationale: Pamoja na ψυχή, kitenzi hiki kinaeleza kujitoa kwa hiari hadi kufa. “Kuyatoa maisha” ni nahau ya asili ya Kiswahili inayohifadhi tendo la hiari.
- source_word: ὑπὲρ
  choice: kwa ajili ya
  rationale: Huonyesha kwamba kujitoa huko ni kwa manufaa ya kondoo na kunaweza pia kuwa na nguvu ya uwakilishi au dhabihu, bila kulazimisha maana moja ya kiufundi.
- source_word: τῶν προβάτων
  choice: kondoo
  rationale: Huhifadhi moja kwa moja taswira kuu ya mchungaji na kondoo badala ya kuibadili kuwa “kundi.”
theological_decisions:
- issue: Nguvu ya ὑπὲρ katika kujitoa kwa Yesu
  choice: kwa ajili ya
  alternative: kwa niaba ya; badala ya
  rationale: “Kwa ajili ya” huonyesha wazi manufaa na kusudi la kujitoa huku, huku ikiacha wazi pia uwezekano wa nguvu ya uwakilishi au ubadala bila kuingiza fomula ya kimafundisho iliyo finyu kuliko Kigiriki.
- issue: Maana ya ψυχή katika muktadha huu
  choice: maisha
  alternative: nafsi
  rationale: Muktadha wa Mchungaji Mwema unaelekeza kwenye Yesu kuyatoa maisha yake kwa kufa. Hivyo “maisha” huepuka kutoa dhana kwamba anazungumzia tu sehemu ya ndani isiyo ya mwili.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa uwiano kati ya Baba na Yesu umehifadhiwa, huku nahau “kuyatoa maisha” ikitoa maana ya asili na inayoeleweka kwa wasomaji wa kawaida.
