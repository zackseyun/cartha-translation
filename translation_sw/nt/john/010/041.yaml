  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ πολλοὶ ἦλθον πρὸς αὐτὸν καὶ ἔλεγον ὅτι Ἰωάννης μὲν σημεῖον ἐποίησεν οὐδέν, πάντα δὲ ὅσα εἶπεν Ἰωάννης περὶ τούτου ἀληθῆ ἦν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/041.yaml
  text: And many came to him and were saying, “John did no sign, but everything that John said about this man was true.”
translation:
  language: sw
  text: Na watu wengi wakamjia, nao walikuwa wakisema, “Yohana hakufanya ishara yoyote, lakini kila jambo alilosema Yohana kumhusu huyu lilikuwa la kweli.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολλοὶ
  choice: watu wengi
  rationale: Kivumishi cha wingi kimetumika kama nomino; kuongeza “watu” ni Kiswahili cha kawaida na huweka maana wazi bila kuiongezea.
- source_word: ἦλθον πρὸς αὐτὸν
  choice: wakamjia
  rationale: Kitenzi hiki kinaonyesha kuelekea kwa mtu; “wakamjia” ni cha asili katika simulizi na hudumisha mwendelezo wa matukio.
- source_word: ἔλεγον
  choice: walikuwa wakisema
  rationale: Muundo huu unahifadhi hali ya tendo lililoendelea au lililorudiwa iliyo katika wakati usiotimilika wa Kigiriki.
- source_word: σημεῖον
  choice: ishara
  rationale: Katika Injili ya Yohana neno hili humaanisha tendo lenye kuonyesha jambo lililo zaidi yake; “ishara” huhifadhi uzito huo kuliko “muujiza” pekee.
- source_word: ἐποίησεν οὐδέν
  choice: hakufanya ishara yoyote
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaowasilisha kwa ukamilifu kwamba Yohana hakufanya hata ishara moja.
- source_word: πάντα δὲ ὅσα
  choice: lakini kila jambo ...
  rationale: “Kila jambo” huhifadhi maana jumuishi ya maneno ya Kigiriki kwa Kiswahili cha asili.
- source_word: περὶ τούτου
  choice: kumhusu huyu
  rationale: “Huyu” huhifadhi nguvu ya kiashiria τούτου badala ya kuifanya kuwa kiwakilishi cha kawaida tu, huku rejeo likibaki la asili katika kauli ya watu.
- source_word: ἀληθῆ ἦν
  choice: lilikuwa la kweli
  rationale: Umoja unapatana na “kila jambo,” na usemi huu unatoa maana ya moja kwa moja bila kuongeza wazo la kuthibitishwa baadaye.
theological_decisions:
- issue: Istilahi ya Kiyohana σημεῖον
  choice: ishara
  alternative: muujiza
  rationale: “Ishara” hudumisha matumizi ya kimada ya Yohana, ambamo tendo humwelekeza msomaji kwenye utambulisho na kazi ya Yesu, bila kuingiza msimamo wa dhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa simulizi “wakamjia” ni wa kawaida katika maandishi ya Biblia, huku “walikuwa wakisema” ukihifadhi hali endelevu ya kitenzi cha Kigiriki. Hakuna tanbihi iliyohitajika kwa sababu “ishara” na “kumhusu huyu” zinawakilisha maandishi ya chanzo kwa uwazi.
