  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐγώ εἰμι ἡ θύρα· δι’ ἐμοῦ ἐάν τις εἰσέλθῃ σωθήσεται καὶ εἰσελεύσεται καὶ ἐξελεύσεται καὶ νομὴν εὑρήσει.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/009.yaml
  text: I am the door. If anyone enters through me[a], he will be saved, and will go in and go out and find pasture.
translation:
  language: sw
  text: Mimi ndiye mlango.[a] Mtu yeyote akiingia kupitia kwangu ataokolewa; ataingia na kutoka, naye atapata malisho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “lango.” Neno la Kigiriki linaweza kumaanisha mlango au lango; “mlango” umetumiwa katika matini kama tafsiri ya moja kwa moja zaidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: θύρα
  choice: mlango
  rationale: Neno θύρα humaanisha mlango au njia ya kuingilia. “Mlango” ni tafsiri ya moja kwa moja na huhifadhi sitiari ya Yesu; “lango” linawezekana katika muktadha wa kondoo na limetajwa katika tanbihi.
- source_word: δι’ ἐμοῦ
  choice: kupitia kwangu
  rationale: διά pamoja na umilikishi huonyesha njia au chombo; “kupitia kwangu” ni Kiswahili cha kawaida kinachomwonyesha Yesu kuwa njia ya kuingia.
- source_word: ἐάν τις εἰσέλθῃ
  choice: Mtu yeyote akiingia
  rationale: Muundo huu ni sharti la jumla lenye wigo wazi. “Mtu yeyote akiingia” ni wa asili katika Kiswahili na huhifadhi maana ya kutomhusisha mtu maalumu.
- source_word: σωθήσεται
  choice: ataokolewa
  rationale: Kitenzi σῴζω kinaweza kumaanisha kuokoa au kukomboa. “Ataokolewa” huhifadhi maana pana ya wokovu katika Yohana bila kuifungia katika usalama wa kimwili pekee.
- source_word: εἰσελεύσεται καὶ ἐξελεύσεται
  choice: ataingia na kutoka
  rationale: Tafsiri hii huhifadhi jozi ya mwendo wa kuingia na kutoka kwa Kiswahili cha kawaida, bila kuongeza ufafanuzi kuhusu uhuru au usalama.
- source_word: νομὴν
  choice: malisho
  rationale: νομή ni eneo au chakula cha kulishia mifugo; “malisho” ni neno la kawaida na linalofaa kwa taswira ya kondoo.
- source_word: εὑρήσει
  choice: atapata
  rationale: Ingawa εὑρίσκω kwa msingi ni “kupata” au “kuona kilichotafutwa,” “atapata malisho” ni usemi wa asili zaidi katika Kiswahili na hudumisha maana rahisi ya matini.
theological_decisions:
- issue: Sitiari ya θύρα katika muktadha wa uchungaji
  choice: mlango
  alternative: lango
  rationale: “Mlango” hudumisha ulinganifu wa moja kwa moja wa sitiari ya kauli ya Yesu, huku “lango” likibaki uwezekano halisi kutokana na muktadha wa zizi la kondoo. Tofauti hiyo imehifadhiwa katika tanbihi bila kulazimisha tafsiri moja ya picha hiyo.
- issue: Wigo wa σωθήσεται
  choice: ataokolewa
  alternative: atanusuriwa
  rationale: “Ataokolewa” huhifadhi uzito wa kiteolojia wa wokovu katika Injili ya Yohana, lakini haiifafanui sentensi kuwa mfumo mwembamba wa mafundisho wala kuiwekea mipaka ya kuokolewa kimwili tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Mimi ndiye” limetumiwa badala ya “Mimi ndimi” ili kuepuka mtindo wa kizamani, huku msisitizo wa ἐγώ εἰμι ukihifadhiwa. Muundo wa sharti “Mtu yeyote akiingia” ni wa kawaida na unaeleweka kwa urahisi.
