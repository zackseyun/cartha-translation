  text: τούτῳ ὁ θυρωρὸς ἀνοίγει, καὶ τὰ πρόβατα τῆς φωνῆς αὐτοῦ ἀκούει καὶ τὰ ἴδια πρόβατα ⸀φωνεῖ κατ’ ὄνομα καὶ ἐξάγει αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/003.yaml
  text: To him the gatekeeper opens[a], and the sheep hear his voice, and he calls his own sheep by name and leads them out.
translation:
  language: sw
  text: Mlinzi wa lango humfungulia; kondoo huisikia sauti yake, naye huwaita kondoo walio wake kwa majina yao na kuwaongoza nje.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “huwatoa nje.”
    reason: Kitenzi ἐξάγει kinaweza kumaanisha ‘kuwaongoza nje’ au ‘kuwatoa nje’; tanbihi inahifadhi uwezekano huo wa kileksika.
lexical_decisions:
- source_word: τούτῳ
  choice: humfungulia
  rationale: Kiambishi cha yambwa -m- katika ‘humfungulia’ humrejelea mchungaji aliyetajwa katika mstari uliotangulia; Kiswahili cha kawaida hakihitaji kuongeza ‘yeye’ au ‘huyo’ hapa.
- source_word: ὁ θυρωρός
  choice: Mlinzi wa lango
  rationale: Hili linafaa mazingira ya zizi la kondoo na ni la sasa na la kawaida kuliko maneno yenye ladha ya kizamani.
- source_word: ἀνοίγει
  choice: humfungulia
  rationale: Kauli ya mazoea ya wakati wa sasa inafaa mfano huu; kitenzi ‘-fungulia’ kinaonyesha kwamba mlinzi anamfungulia mchungaji lango.
- source_word: τὰ πρόβατα
  choice: kondoo
  rationale: Neno la kawaida la Kiswahili kwa wanyama hawa katika taswira ya kichungaji.
- source_word: τῆς φωνῆς αὐτοῦ ἀκούει
  choice: husikia sauti yake
  rationale: Huhifadhi maana ya moja kwa moja ya kusikia sauti bila kuongeza wazo la kutii ambalo halijasemwa wazi katika kitenzi hiki.
- source_word: τὰ ἴδια πρόβατα
  choice: kondoo wake
  rationale: Kiwakilishi cha umilikaji kinaonyesha kwamba ni kondoo walio wake; muundo wa sentensi unaendelea kusisitiza uhusiano huo bila Kiswahili kizito.
- source_word: φωνεῖ κατ’ ὄνομα
  choice: humwita kila mmoja ... kwa jina
  rationale: Hii ni njia ya asili ya Kiswahili ya kueleza kwamba mchungaji huwaita kondoo mmoja mmoja kwa majina yao.
- source_word: ἐξάγει αὐτά
  choice: kuwaongoza nje
  rationale: Katika taswira ya mchungaji, ‘kuwaongoza nje’ huonyesha uelekezaji wake binafsi; maana mbadala ya ‘kuwatoa nje’ imehifadhiwa katika tanbihi.
theological_decisions:
- issue: Taswira ya mchungaji na mhusika anayetenda
  choice: 'Matendo yameachwa kuwa ya mhusika wa kichungaji: mlinzi anamfungulia, kondoo husikia sauti yake, naye huwaita na kuwaongoza nje.'
  alternative: Kumtaja Yesu waziwazi kama mhusika katika mstari huu.
  rationale: Muktadha mpana unaelekeza kwenye maana hiyo, lakini mstari wenyewe unaendeleza mfano bila kumtaja Yesu hapa; tafsiri haipaswi kufafanua kimadhehebu kile ambacho matini imewasilisha kwa taswira.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini kinachoeleweka kwa urahisi. Kauli za mazoea zimetumiwa kuakisi wakati wa sasa katika mfano. Alama ya tanbihi [a] imewekwa baada ya kifungu kinachohusika.
