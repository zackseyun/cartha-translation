  text: Basi Wayahudi[a] wakachukua tena mawe ili wampige kwa mawe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, huenda katika muktadha huu, “viongozi wa Kiyahudi” au “watu wa Yudea.” Katika Injili ya Yohana, usemi “Wayahudi” mara nyingi huwarejelea wapinzani fulani wa Yesu, wala si Wayahudi wote kwa ujumla.
