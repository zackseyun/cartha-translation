lexical_decisions:
- source_word: Ἐβάστασαν
  choice: wakaokota
  rationale: Katika tukio hili la uhasama, kitenzi kinaeleza kuchukua mawe ili kuyatumia mara moja; “wakaokota” ni Kiswahili cha kawaida na cha wazi.
- source_word: οὖν
  choice: Basi
  rationale: Neno hili linaunganisha tendo hilo na maneno yaliyotangulia kwa namna ya kawaida katika simulizi.
- source_word: πάλιν
  choice: tena
  rationale: Linaonyesha kwamba tendo hili lilirudiwa.
- source_word: λίθους
  choice: mawe
  rationale: Hili ndilo neno la moja kwa moja na la kawaida kwa λίθους.
- source_word: οἱ Ἰουδαῖοι
  choice: Wayahudi
  rationale: Hii inafuata kwa karibu usemi wa Kigiriki bila kuufanya wazi zaidi kuliko ulivyo; tanbihi inaeleza uwezekano wa maana finyu katika muktadha wa Yohana.
- source_word: ἵνα λιθάσωσιν αὐτόν
  choice: ili wampige kwa mawe
  rationale: “Ili” huhifadhi maana ya kusudi, na “wampige kwa mawe” ni njia ya kawaida ya Kiswahili ya kueleza tendo la λιθάζω bila kuongeza wazi kwamba walikusudia kumuua.
theological_decisions:
- issue: Wanaorejelewa na οἱ Ἰουδαῖοι katika Injili ya Yohana
  choice: Wayahudi katika maandishi makuu, pamoja na tanbihi ya kufafanua muktadha
  alternative: viongozi wa Kiyahudi; Wayudea
  rationale: Kigiriki kinasema kwa wazi “Wayahudi,” hivyo maandishi makuu hayapaswi kufinyaza maana bila msingi wa moja kwa moja. Hata hivyo, katika Yohana usemi huu mara nyingi huwarejelea wapinzani fulani wa Yesu, wala si Wayahudi wote kwa ujumla.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa maandiko. “Wakaokota tena mawe” ni ya wazi na ya kisasa; “wampige kwa mawe” huhifadhi kitendo kilichokusudiwa bila kuongeza ufafanuzi wa kimadhehebu.
