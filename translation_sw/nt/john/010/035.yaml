  text: εἰ ἐκείνους εἶπεν θεοὺς πρὸς οὓς ὁ λόγος τοῦ θεοῦ ἐγένετο, καὶ οὐ δύναται λυθῆναι ἡ γραφή,
base_translation:
  language: en
  yaml_path: translation/nt/john/010/035.yaml
  text: If he called those to whom the word of God came ‘gods’—and the Scripture cannot be broken—[a][b]
translation:
  language: sw
  text: Ikiwa aliwaita “miungu” wale ambao neno la Mungu liliwajia—na Andiko haliwezi kubatilishwa—[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “walio wa kiungu.” Kigiriki kinasema “miungu,” kikirejelea Zaburi 82:6; baadhi ya wafafanuzi huwaelewa wanaorejelewa kuwa waamuzi wa kibinadamu.
    reason: lexical_alternative
  - marker: b
    text: Kwa maana nyingine, “haliwezi kufutwa” au “haliwezi kuwekwa kando.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ
  choice: Ikiwa
  rationale: Hudumisha muundo wa hoja yenye sharti katika maneno ya Yesu.
- source_word: ἐκείνους
  choice: wale
  rationale: Huwarejelea watu wanaotajwa katika Zaburi 82 bila kuongeza utambulisho ambao hauko wazi katika Kigiriki.
- source_word: εἶπεν θεοὺς
  choice: aliwaita “miungu”
  rationale: Ingawa εἶπεν kwa msingi ni ‘alisema,’ hapa ina maana ya kuwataja au kuwaita kwa jina la ‘miungu’; muundo huu ni wa kawaida katika Kiswahili.
- source_word: θεοὺς
  choice: miungu
  rationale: Hufuata moja kwa moja neno la Zaburi 82:6 ambalo ni msingi wa hoja ya Yesu, bila kulifasiri kuwa ‘waamuzi’ au ‘viumbe wa kiungu.’
- source_word: πρὸς οὓς ὁ λόγος τοῦ θεοῦ ἐγένετο
  choice: wale ambao neno la Mungu liliwajia
  rationale: Hutoa kwa Kiswahili cha kawaida wazo la neno la Mungu kuwafikia watu hao, huku likihifadhi mwelekeo wa πρός na hali ya tukio katika ἐγένετο.
- source_word: οὐ δύναται λυθῆναι
  choice: hayawezi kubatilishwa
  rationale: Kitenzi λύω hapa kina wazo la kuondoa nguvu au mamlaka. ‘Kubatilishwa’ ni cha asili na wazi zaidi kuliko tafsiri halisi ya ‘kuvunjwa’ katika muktadha huu.
- source_word: ἡ γραφή
  choice: Maandiko
  rationale: Katika matumizi ya kawaida ya Biblia ya Kiswahili, ‘Maandiko’ hueleza kwa heshima na uwazi maandishi matakatifu yenye mamlaka; upatanisho wa kisarufi wa wingi unatumiwa bila kubadili rejeleo la Kigiriki.
theological_decisions:
- issue: Maana ya ‘miungu’ katika nukuu ya Yesu
  choice: Kubakiza neno halisi ‘miungu’ bila kulifafanua katika matini kuu.
  alternative: waamuzi; viumbe wa kiungu
  rationale: Hoja ya Yesu inategemea maneno yenyewe ya Zaburi 82:6. Kuchagua ‘waamuzi’ au ‘viumbe wa kiungu’ kungeamua mapema utambulisho ambao matini hii hauufafanui.
- issue: Nguvu ya kauli kwamba Maandiko hayawezi λυθῆναι
  choice: hayawezi kubatilishwa
  alternative: hayawezi kuvunjwa; hayawezi kuwekwa kando
  rationale: Kauli hiyo inasisitiza kwamba mamlaka ya Maandiko haiwezi kufutwa au kuondolewa. Tafsiri iliyochaguliwa inaweka maana hiyo wazi bila kuongeza dai la kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Alama za dondoo zinaonyesha neno linalonukuliwa katika hoja ya Yesu; vistari virefu vinahifadhi kauli ya mabano. Kila alama ya tanbihi imewekwa katika matini kuu.
