translation:
  language: sw
  text: Mimi na Baba ni kitu kimoja[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika Kigiriki, neno “moja” lina jinsia ya kati; linasisitiza umoja bila kusema kwamba Yesu na Baba ni mtu mmoja.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγὼ
  choice: Mimi
  rationale: Kiwakilishi cha nafsi ya kwanza kimetajwa wazi katika Kigiriki kwa msisitizo; “Mimi” huhifadhi msisitizo huo kwa Kiswahili cha kawaida.
- source_word: καὶ
  choice: na
  rationale: Kiunganishi cha kawaida kinachounganisha wahusika wawili bila kuongeza maana nyingine.
- source_word: ὁ πατὴρ
  choice: Baba
  rationale: Katika muktadha wa Yohana, neno hili linamtaja Baba wa Yesu kama jina la heshima; herufi kubwa inaonyesha matumizi hayo.
- source_word: ἕν
  choice: mmoja
  rationale: Katika Kiswahili, baada ya kiima chenye watu, “mmoja” ndilo neno la kawaida la kueleza umoja. Tofauti ya jinsia ya kisarufi ya Kigiriki haiwezi kuonyeshwa moja kwa moja, kwa hiyo ufafanuzi muhimu umewekwa katika tanbihi.
- source_word: ἐσμεν
  choice: tu
  rationale: Ni kitenzi cha nafsi ya kwanza wingi; “tu” huhifadhi wingi unaowatofautisha “Mimi” na “Baba” huku sentensi ikisisitiza umoja wao.
theological_decisions:
- issue: Maana ya ἕν ya jinsia isiyo ya kiume pamoja na ἐσμεν ya wingi katika kauli muhimu kuhusu Kristo
  choice: “Mimi na Baba tu mmoja,” ikisisitiza umoja halisi huku wingi wa kitenzi ukidumisha utofauti kati ya Yesu na Baba.
  alternative: “Mimi na Baba tuna umoja” au “Mimi na Baba ni kitu kimoja.”
  rationale: “Tuna umoja” inaweza kudhoofisha kauli iwe makubaliano tu, huku “ni kitu kimoja” ikiwa ngumu na yenye uwezekano wa kupotosha kwa Kiswahili. Tafsiri iliyochaguliwa huhifadhi kwa ufupi mvutano wa kisarufi na kiteolojia wa Kigiriki bila kuingiza istilahi za baadaye.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, fasaha na chenye hadhi. Muundo “tu mmoja” ni mfupi na wa kawaida katika tafsiri ya kauli hii; tanbihi huhifadhi tofauti muhimu ya sarufi ya Kigiriki ambayo Kiswahili hakiwezi kuonyesha moja kwa moja.
