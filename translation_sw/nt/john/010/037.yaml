  text: εἰ οὐ ποιῶ τὰ ἔργα τοῦ πατρός μου, μὴ πιστεύετέ μοι·
base_translation:
  language: en
  yaml_path: translation/nt/john/010/037.yaml
  text: If I am not doing the works of my Father[a], do not believe me;
translation:
  language: sw
  text: Kama sifanyi kazi za Baba yangu, msiniamini[a];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “msiamini ninayosema.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ
  choice: Kama
  rationale: Huanzisha kishazi cha sharti kwa njia ya kawaida na ya asili katika Kiswahili.
- source_word: οὐ ποιῶ
  choice: sifanyi
  rationale: Huhifadhi ukanushi na hali ya sasa ya kitenzi bila kulazimisha maana ya tendo linaloendelea kuliko inavyodaiwa na muktadha.
- source_word: τὰ ἔργα
  choice: kazi
  rationale: Neno hili linaweza kumaanisha kazi au matendo; ‘kazi’ ni la kawaida, linaeleweka, na linaendeleza uzito wa matumizi ya ἔργα katika Injili ya Yohana.
- source_word: τοῦ πατρός μου
  choice: za Baba yangu
  rationale: Huwakilisha muundo wa umilikaji kwa Kiswahili cha asili; ‘Baba’ imeandikwa kwa herufi kubwa kwa kuwa hapa ni jina la uhusiano linalomtaja Mungu.
- source_word: μὴ πιστεύετέ μοι
  choice: msiniamini
  rationale: Ni katazo linalowaelekea watu wengi. Muundo wa Kiswahili unahifadhi moja kwa moja wazo la kumwamini Yesu, huku uwezekano wa maana ‘kuamini anachosema’ ukielezwa katika tanbihi.
theological_decisions:
- issue: Maana ya πιστεύω pamoja na dativu μοι
  choice: msiniamini
  alternative: msiamini ninayosema
  rationale: Muundo wa Kigiriki unaweza kueleza kumwamini mtu, huku katika muktadha ukiweza pia kugusa kukubali anayosema. Tafsiri kuu inadumisha uelekezaji wa moja kwa moja kwa Yesu bila kuipanua kimafafanuzi; tanbihi inalinda maana nyingine halali.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni fupi na ya moja kwa moja, kama ilivyo katika Kigiriki; alama ya tanbihi imewekwa baada ya neno linalohusika.
