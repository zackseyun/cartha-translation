base_translation:
  language: en
  yaml_path: translation/nt/john/010/039.yaml
  text: So they were seeking again to seize him[a], but he escaped from their hand.
translation:
  language: sw
  text: Kwa hiyo walikuwa wakitafuta tena kumkamata, lakini akatoka mikononi mwao[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa maana halisi, “kutoka katika mkono wao.” Hii ni nahau inayomaanisha kutoka katika uwezo au udhibiti wao.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐζήτουν
  choice: wakajaribu
  rationale: Kitenzi cha wakati usiotimilika kinaonyesha jaribio lililokuwa likifanyika; katika Kiswahili, “wakajaribu” huwasilisha kwa kawaida nia yao ambayo haikutimia.
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Huunganisha jaribio lao na maneno yaliyotangulia kama matokeo ya mjadala huo.
- source_word: πάλιν
  choice: tena
  rationale: Huhifadhi wazi maana ya kurudiwa kwa tendo.
- source_word: πιάσαι
  choice: kumkamata
  rationale: Katika muktadha huu ni kumtia Yesu mikononi kwa nguvu; “kumkamata” ni ya kawaida na haiingizi kwa lazima taratibu rasmi za kisheria.
- source_word: ἐξῆλθεν
  choice: akatoka
  rationale: Huhifadhi maana ya msingi ya kitenzi, “alitoka,” badala ya kuongeza moja kwa moja wazo la ‘kutoroka’ ambalo linadokezwa na muktadha.
- source_word: ἐκ τῆς χειρὸς αὐτῶν
  choice: mikononi mwao
  rationale: Ni nahau ya asili ya Kiswahili inayoonyesha kutoka katika uwezo au udhibiti wao, huku ikilingana na nahau ya Kigiriki iliyo katika umoja, ‘kutoka katika mkono wao.’
theological_decisions:
- issue: Iwapo kueleza wazi kuwa Yesu alitoroka au kuhifadhi usemi wa simulizi wa kutoka mikononi mwao
  choice: akatoka mikononi mwao
  alternative: akawatoroka; akajinasua mikononi mwao
  rationale: Kigiriki hakitumii kitenzi cha moja kwa moja cha ‘kutoroka.’ Tafsiri hii huhifadhi tendo lililoelezwa na pia humruhusu msomaji kuelewa kutokana na muktadha kwamba hawakufanikiwa kumkamata.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Wakajaribu tena kumkamata” ni cha kawaida kuliko tafsiri ya kimuundo kama “walikuwa wakitafuta tena kumkamata,” na “akatoka mikononi mwao” huhifadhi nahau bila kuwa ngumu kueleweka.
