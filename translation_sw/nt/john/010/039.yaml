  source_fidelity: “Wakajaribu” communicates an attempted action, but it compresses the imperfect ἐζήτουν (“they were seeking”) into a completed attempt. “Walikuwa wakitafuta” more directly retains the source’s ongoing/iterative aspect. “Akatoka mikononi mwao” appropriately preserves ἐξῆλθεν and the idiomatic force of ἐκ τῆς χειρὸς αὐτῶν without making escape explicit.
  naturalness: The revised wording is natural Standard East African Swahili. “Mikononi mwao” is the normal Swahili idiom for being in someone’s power or grasp.
  terminology: “Kumkamata” is appropriate for πιάσαι in this hostile context and does not require a formal legal-arrest sense. No theological terminology is at issue.
