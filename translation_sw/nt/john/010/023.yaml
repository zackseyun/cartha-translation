lexical_decisions:
- source_word: καὶ
  choice: Naye
  rationale: Kiunganishi hiki kinaendeleza simulizi kwa Kiswahili cha kawaida bila kuongeza maana ya wakati isiyomo wazi katika Kigiriki.
- source_word: περιεπάτει
  choice: alikuwa akitembea
  rationale: Kauli ya wakati uliopita usiotimilika inaonyesha tendo lililokuwa likiendelea; muundo huu wa Kiswahili unahifadhi hali hiyo.
- source_word: ἱερῷ
  choice: eneo la hekalu
  rationale: ἱερόν hapa ni eneo lote la hekalu, si patakatifu pa ndani pekee; tafsiri hii ni wazi na ya kawaida.
- source_word: στοᾷ
  choice: Ukumbi
  rationale: στοά ni njia au ukumbi wenye paa na safu za nguzo; “Ukumbi” linafaa katika jina la mahali huku maelezo ya usanifu yakitolewa katika tanbihi.
- source_word: τοῦ Σολομῶνος
  choice: wa Sulemani
  rationale: Hiki ni kirejeshi cha umilikaji kinachounda jina la mahali kwa Kiswahili cha kawaida.
