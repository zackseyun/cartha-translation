  text: And Jesus was walking in the temple courts[b][a], in Solomon’s Portico.
translation:
  language: sw
  text: Naye Yesu alikuwa akitembea katika eneo la hekalu[b], kwenye Ukumbi wa Sulemani[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “njia yenye paa na safu za nguzo”; neno la Kigiriki στοά linamaanisha sehemu ya kupitia yenye paa na nguzo.
    reason: lexical_alternative
