  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὁ πατήρ μου ⸀ὃ δέδωκέν ⸀μοι ⸂πάντων μεῖζων⸃ ἐστίν, καὶ οὐδεὶς δύναται ἁρπάζειν ἐκ τῆς χειρὸς τοῦ ⸀πατρός.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/029.yaml
  text: My Father[a], who has given them to me, is greater than all, and no one is able to snatch them out of the Father's hand.
translation:
  language: sw
  text: Baba yangu[a], ambaye amenipa hao, ni mkuu kuliko wote; wala hakuna mtu anayeweza kuwanyakua kutoka mkononi mwa Baba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya karibu zaidi na maneno ya Kigiriki, “Baba yangu, kile alichonipa, ni kikubwa kuliko vyote.” Muundo wa Kigiriki hapa ni mgumu, na wengine huelewa kwamba kile kilichotolewa ndicho kinacholinganishwa, badala ya watu waliotolewa.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ πατήρ μου
  choice: Baba yangu
  rationale: Hii ni tafsiri ya kawaida na ya asili ya umilikishi, inayohifadhi uhusiano wa Yesu na Baba bila kuongeza ufafanuzi.
- source_word: ὃ δέδωκέν μοι
  choice: ambaye amenipa hao
  rationale: Ingawa kiwakilishi cha Kigiriki ni cha umoja wa jinsi isiyo ya kiume wala ya kike na kinaweza kumaanisha ‘kile alichonipa,’ muktadha wa kondoo katika mistari 27–28 unaelekeza kwa watu waliotolewa kwa Yesu. ‘Hao’ huweka rejeo hilo wazi, huku utata halisi ukihifadhiwa katika tanbihi. Wakati timilifu wa δέδωκεν unaonyeshwa kwa ‘amenipa,’ ukidokeza tendo lenye matokeo yanayoendelea.
- source_word: πάντων μεῖζων
  choice: ni mkuu kuliko wote
  rationale: ‘Kuliko wote’ huhifadhi upana wa πάντων bila kuamua kama inahusu watu wote au vitu vyote. ‘Mkuu’ ni ya asili kwa ukuu wa Baba katika muktadha huu.
- source_word: οὐδεὶς δύναται
  choice: hakuna mtu anayeweza
  rationale: Huhifadhi wazi maana ya uwezo au kutokuwa na uwezo katika δύναται, kwa Kiswahili cha kawaida.
- source_word: ἁρπάζειν
  choice: kuwanyakua
  rationale: ‘Kunyakua’ huonyesha kuondoa kwa ghafla au kwa nguvu na hudumisha mwangwi wa mstari wa 28.
- source_word: ἐκ τῆς χειρὸς τοῦ πατρός
  choice: kutoka mkononi mwa Baba
  rationale: Huhifadhi taswira ya mkono kama ishara ya ulinzi, umiliki, na nguvu; ‘kutoka’ huakisi ἐκ kwa njia ya asili katika Kiswahili.
theological_decisions:
- issue: Ugumu wa kisintaksia na wa uhakiki wa matini katika ὃ δέδωκέν μοι
  choice: 'Kutafsiri kishazi kulingana na kondoo walio rejeo la muktadha: ‘ambaye amenipa hao’'
  alternative: ‘Baba yangu, kile alichonipa, ni kikubwa kuliko vyote’ au ‘Kile ambacho Baba yangu amenipa ni kikubwa kuliko vyote’
  rationale: Matini ya Kigiriki iliyochapishwa ni ngumu kisintaksia, na ushahidi wa hati unatofautiana. Muktadha unazungumzia kondoo ambao Baba amempa Mwana, kwa hiyo tafsiri kuu inafanya rejeo la watu lieleweke. Hata hivyo, kwa kuwa muundo wa Kigiriki unaweza kufanya zawadi yenyewe kuwa kiima cha ulinganisho, uwezekano huo umehifadhiwa katika tanbihi.
- issue: Upeo wa ulinganisho katika πάντων μεῖζων
  choice: Kutumia usemi mpana ‘mkuu kuliko wote’ bila kubainisha watu au vitu
  alternative: ‘mkuu kuliko watu wote’ au ‘mkuu kuliko vitu vyote’
  rationale: πάντων inaweza kuwa na upeo mpana; kuibainisha kuwa watu au vitu kungeondoa utata ambao matini haiondoi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi, lakini kinachoeleweka kwa wasomaji wa kawaida. ‘Baba’ imeandikwa kwa herufi kubwa inapomtaja Mungu; sentensi imehifadhi taswira ya kunyakuwa kutoka mkononi.
