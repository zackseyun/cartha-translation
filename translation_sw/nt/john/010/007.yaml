id: JHN.10.7
reference: John 10:7
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Εἶπεν οὖν πάλιν ⸀αὐτοῖς ὁ Ἰησοῦς· Ἀμὴν ἀμὴν λέγω ὑμῖν ⸀ὅτι ἐγώ εἰμι ἡ θύρα τῶν προβάτων.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/007.yaml
  text: So Jesus said to them again[a], “Truly, truly, I say to you, I am the door for the sheep.”
translation:
  language: sw
  text: Kwa hiyo Yesu akawaambia tena, “Kweli, kweli, ninawaambia, mimi ndiye mlango wa kondoo.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “lango la kondoo.” Neno la Kigiriki θύρα linaweza kumaanisha “mlango” au “lango,” hasa katika taswira ya uchungaji.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Inaonyesha mwendelezo wa kimantiki kutoka kutoelewa kwao katika mstari uliotangulia, kwa Kiswahili cha kawaida na chenye uzito unaofaa.
- source_word: πάλιν
  choice: tena
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya adverbia inayoonyesha kurudiwa kwa kusema.
- source_word: Ἀμὴν ἀμὴν
  choice: Kweli, kweli
  rationale: Inahifadhi urudiaji na msisitizo wa tamko la Yesu huku maana ikiwa wazi kwa wasomaji wa kisasa.
- source_word: λέγω ὑμῖν
  choice: ninawaambia
  rationale: Ni usemi wa asili wa Kiswahili unaowakilisha nafsi ya kwanza, wakati uliopo, na kiwakilishi cha wingi cha ὑμῖν.
- source_word: ἐγώ εἰμι
  choice: mimi ndiye
  rationale: Kiwakilishi wazi cha Kigiriki kina msisitizo; “mimi ndiye” huuwasilisha kwa Kiswahili cha kawaida bila kuongeza ufafanuzi wa kiteolojia.
- source_word: θύρα
  choice: mlango
  rationale: “Mlango” ni maana ya msingi na ya kawaida; katika taswira ya zizi pia inaweza kueleweka kama lango.
- source_word: τῶν προβάτων
  choice: wa kondoo
  rationale: Inahifadhi kwa karibu uhusiano wa kimilikishi/kiuhusiano wa genitivi bila kuamua kimya-kimya kuwa maana yake ni “kwa ajili ya kondoo.”
theological_decisions:
- issue: Utambulisho wa kimafumbo katika usemi wa “mimi ndiye”
  choice: mimi ndiye mlango wa kondoo
  alternative: mimi ndiye lango la kondoo / mimi ndiye mlango kwa ajili ya kondoo
  rationale: Tafsiri inahifadhi sitiari na uhusiano wenye uwezekano zaidi ya mmoja wa genitivi, bila kuupanua kuwa maelezo ya mafundisho. “Mlango” ni sawa moja kwa moja na θύρα, huku “lango” likitajwa kama uwezekano wa kimuktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Urudiaji wa “Kweli, kweli” umehifadhiwa kwa ajili ya msisitizo wa asili.
