id: JHN.10.34
reference: John 10:34
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς· Οὐκ ἔστιν γεγραμμένον ἐν τῷ νόμῳ ὑμῶν ⸀ὅτι Ἐγὼ εἶπα· Θεοί ἐστε;
base_translation:
  language: en
  yaml_path: translation/nt/john/010/034.yaml
  text: Jesus answered them[a], “Is it not written in your Law, ‘I said, you are gods’?”
translation:
  language: sw
  text: Yesu akawajibu, “Je, haijaandikwa katika Sheria yenu, ‘Mimi nilisema, ninyi ni miungu[a]’?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “viumbe vya kimungu.” Yesu ananukuu Zaburi 82:6, ambako maana ya neno hili inajadiliwa; maandishi makuu yanahifadhi tafsiri ya moja kwa moja ya nukuu hiyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη αὐτοῖς
  choice: akawajibu
  rationale: Ni usemi wa kawaida wa masimulizi unaoonyesha kwamba Yesu aliwapa jibu; kiambishi -wa- kinawakilisha αὐτοῖς kwa Kiswahili cha asili.
- source_word: Οὐκ ἔστιν γεγραμμένον
  choice: Je, haijaandikwa
  rationale: Muundo huu wa swali huhifadhi swali la Kiyunani na matumizi ya kawaida ya Kiswahili katika kutambulisha nukuu ya Maandiko.
- source_word: ἐν τῷ νόμῳ ὑμῶν
  choice: katika Sheria yenu
  rationale: Hapa νόμος inarejelea Maandiko yao kwa maana pana, kwa kuwa nukuu inatoka Zaburi 82:6; herufi kubwa inaonyesha matumizi hayo maalumu.
- source_word: Ἐγὼ εἶπα
  choice: Mimi nilisema
  rationale: Kiwakilishi cha wazi Ἐγώ kimehifadhiwa kwa neno “Mimi,” bila kuongeza mkazo wa kufasiri.
- source_word: Θεοί ἐστε
  choice: ninyi ni miungu
  rationale: Hii ndiyo tafsiri ya moja kwa moja ya nomino ya wingi θεοί pamoja na kitenzi ἐστε; haiongezi wazo la “kuitwa” ambalo halipo katika Kiyunani.
theological_decisions:
- issue: Tafsiri ya θεοί katika nukuu ya Yesu kutoka Zaburi 82:6
  choice: miungu
  alternative: viumbe vya kimungu
  rationale: “Miungu” huhifadhi maneno ya moja kwa moja na nguvu ya hoja ya nukuu bila kuamua kimya-kimya utambulisho wa wanaosemewa. Tafsiri mbadala imewekwa katika tanbihi ili kuhifadhi mjadala wa kifasiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Je, haijaandikwa” ni ya kawaida katika swali la balagha, na “Sheria yenu” huhifadhi jinsi Yesu anavyowahutubia bila kuifanya istilahi hiyo kuwa Pentateuki pekee.
