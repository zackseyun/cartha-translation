  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἄλλα πρόβατα ἔχω ἃ οὐκ ἔστιν ἐκ τῆς αὐλῆς ταύτης· κἀκεῖνα ⸂δεῖ με⸃ ἀγαγεῖν, καὶ τῆς φωνῆς μου ἀκούσουσιν, καὶ ⸀γενήσονται μία ποίμνη, εἷς ποιμήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/016.yaml
  text: And I have other sheep that are not from this sheepfold[a]. I must bring them also, and they will listen to my voice. Then there will be one flock[b], one shepherd.
translation:
  language: sw
  text: Nami nina kondoo wengine ambao si wa zizi hili. Hao pia ni lazima niwalete, nao wataisikiliza sauti yangu[a]. Ndipo kutakuwa na kundi moja[b] na mchungaji mmoja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wataisikia sauti yangu.” Kitenzi cha Kiyunani kinaweza kumaanisha “kusikia” au “kusikiliza”; hapa huenda kinajumuisha kusikia kunakoleta mwitikio.
    reason: lexical_alternative
  - marker: b
    text: Kiyunani hutofautisha “zizi” (αὐλή, eneo lililozungushiwa) na “kundi” (ποίμνη, mkusanyiko wa kondoo). Kwa hiyo hapa ni “kundi moja,” si “zizi moja.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἄλλα πρόβατα
  choice: kondoo wengine
  rationale: πρόβατα ni neno la kawaida kwa kondoo, si hasa wana-kondoo; ἄλλα huonyesha kondoo wengine zaidi ya wale wanaozungumziwa tayari.
- source_word: αὐλή
  choice: zizi
  rationale: Katika mfano huu wa uchungaji, αὐλή ni eneo lililozungushiwa ambamo kondoo huwekwa. “Zizi” ni neno la kawaida na la asili katika Kiswahili.
- source_word: κἀκεῖνα
  choice: hao pia
  rationale: Kiwakilishi hiki kinawarejelea “kondoo wengine.” “Hao pia” ni cha asili katika Kiswahili na huhifadhi maana ya nyongeza.
- source_word: δεῖ με ἀγαγεῖν
  choice: ni lazima niwalete
  rationale: δεῖ huonyesha ulazima, nao ἀγαγεῖν unaweza kumaanisha kuleta au kuongoza. “Ni lazima niwalete” huhifadhi nguvu ya ulazima bila kuufafanua kitheolojia kupita maandishi.
- source_word: τῆς φωνῆς μου ἀκούσουσιν
  choice: wataisikiliza sauti yangu
  rationale: ἀκούω inaweza kumaanisha kusikia au kusikiliza. Katika picha ya mchungaji katika Yohana, muktadha unaelekea kujumuisha kuitikia sauti, hivyo “wataisikiliza” ni ya asili na inafaa hapa.
- source_word: γενήσονται μία ποίμνη
  choice: ndipo kutakuwa na kundi moja
  rationale: γενήσονται huonyesha hali itakayotokea, na ποίμνη ni kundi la kondoo. Uundaji huu ni wa asili katika Kiswahili na huhifadhi matokeo ya wakati ujao.
- source_word: εἷς ποιμήν
  choice: mchungaji mmoja
  rationale: ποιμήν humaanisha mchungaji; tafsiri ya moja kwa moja inadumisha picha kuu ya mstari.
theological_decisions:
- issue: Kutofautisha αὐλή na ποίμνη
  choice: zizi hili ... kundi moja
  alternative: zizi hili ... zizi moja
  rationale: 'Kiyunani hutumia nomino mbili tofauti: αὐλή ni eneo au zizi, na ποίμνη ni kundi la kondoo. Kutafsiri zote kuwa “zizi” kungeficha tofauti hiyo na kungeweza kupendekeza eneo moja badala ya kundi moja lenye mchungaji mmoja.'
- issue: Nguvu ya δεῖ
  choice: ni lazima niwalete
  alternative: ninahitaji kuwaleta
  rationale: δεῖ huonyesha ulazima wenye uzito katika Yohana. “Ni lazima” huhifadhi nguvu hiyo bila kuingiza maelezo maalumu ya kimafundisho kuhusu chanzo cha ulazima huo.
- issue: Maana ya ἀκούω katika picha ya mchungaji
  choice: wataisikiliza sauti yangu
  alternative: wataisikia sauti yangu
  rationale: Kitenzi kinaweza kuwa kusikia au kusikiliza. Muktadha unaruhusu maana ya kusikia kunakoitikia, lakini tanbihi inadumisha uwezekano wa tafsiri isiyoeleza mwitikio waziwazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wa heshima na unaoeleweka kwa wasomaji wa kawaida. Muundo “Nami nina” huhifadhi mwendelezo wa καί; “hao pia” ni wa kawaida kuliko muundo mzito zaidi. Alama za tanbihi zimewekwa moja kwa moja baada ya maneno yanayohusika.
