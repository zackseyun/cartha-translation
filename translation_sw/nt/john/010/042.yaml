lexical_decisions:
- source_word: καὶ
  choice: Na
  rationale: Kiunganishi hiki kinaunganisha mstari na simulizi lililotangulia bila kuongeza maana ya matokeo au mfuatano usioelezwa wazi.
- source_word: πολλοὶ
  choice: wengi
  rationale: Kivumishi hiki kimetumika kama nomino na kinarejelea watu wengi; “wengi” ni fupi, wazi, na ya kawaida katika Kiswahili.
- source_word: ἐπίστευσαν
  choice: wakamwamini
  rationale: Kitenzi cha wakati uliopita kinaonyesha tendo la kuamini; muundo wa “waka-” unaendeleza simulizi kwa Kiswahili cha kawaida bila kulazimisha maana ya kuanza kuamini.
- source_word: εἰς αὐτὸν
  choice: -mwamini
  rationale: Katika muundo πιστεύω εἰς, imani inaelekezwa kwa Yesu. Kiswahili cha kawaida hutumia “kumwamini” kwa maana ya kumtegemea au kuweka imani kwake.
- source_word: ἐκεῖ
  choice: huko
  rationale: Kielezi hiki kinarejelea mahali palipotajwa katika muktadha uliotangulia; “huko” ni ya asili katika simulizi na huhifadhi msisitizo wa mahali.
theological_decisions:
- issue: Maana ya πιστεύω εἰς αὐτόν katika muktadha wa imani kwa Yesu
  choice: wakamwamini
  alternative: wakaweka imani yao kwake
  rationale: “Kumwamini” huhifadhi maana ya imani na tegemeo linaloelekezwa kwa Yesu bila kufafanua kupita kiasi au kuingiza mfumo maalumu wa kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni fupi na ya asili; hakuna tanbihi zinazohitajika.
