  text: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς· Πολλὰ ⸂ἔργα καλὰ ἔδειξα ὑμῖν⸃ ἐκ τοῦ ⸀πατρός· διὰ ποῖον αὐτῶν ἔργον ⸂ἐμὲ λιθάζετε⸃;
base_translation:
  language: en
  yaml_path: translation/nt/john/010/032.yaml
  text: Jesus answered them[a], “I showed you many good works from the Father[b]; for which of them are you stoning me?”
translation:
  language: sw
  text: Yesu akawajibu, “Nimewaonyesha matendo mengi mema kutoka kwa Baba[a]; ni kwa ajili ya tendo lipi kati ya hayo mnanipiga mawe?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya tafsiri husema “Baba yangu,” lakini Kigiriki hapa kinasema tu “Baba.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς
  choice: Yesu akawajibu
  rationale: Muundo huu ni wa kawaida katika masimulizi ya Kiswahili na unahifadhi wazo la Yesu kuwajibu moja kwa moja.
- source_word: Πολλὰ ἔργα καλὰ
  choice: matendo mengi mema
  rationale: “Matendo” ni neno la kawaida na lenye heshima kwa ἔργα, huku “mema” likihifadhi sifa ya καλὰ bila kuyafanya kuwa miujiza pekee.
- source_word: ἔδειξα ὑμῖν
  choice: Nimewaonyesha
  rationale: Wakati timilifu wa Kiswahili unaeleza matendo ambayo Yesu tayari aliwaonyesha na ambayo bado ndiyo msingi wa swali lake.
- source_word: ἐκ τοῦ πατρός
  choice: kutoka kwa Baba
  rationale: Huhifadhi maana ya chanzo au asili ya matendo hayo na haiongezi kimilikishi “yangu,” ambacho hakipo katika matini hii ya Kigiriki.
- source_word: διὰ ποῖον αὐτῶν ἔργον
  choice: ni kwa ajili ya tendo lipi kati ya hayo
  rationale: “Kwa ajili ya” linaonyesha sababu au msingi, na “kati ya hayo” linarejelea wazi matendo mengi yaliyotajwa.
- source_word: ἐμὲ λιθάζετε
  choice: mnanipiga mawe
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya tendo la kupiga mtu kwa mawe; haiongezi wazo la “kujaribu” au “kutaka,” ambalo halijasemwa wazi katika kitenzi.
theological_decisions:
- issue: Jinsi ya kumtaja Baba katika maneno ya Yesu
  choice: kutoka kwa Baba
  alternative: kutoka kwa Baba yangu
  rationale: Matini ya SBLGNT haina kiwakilishi μου (“yangu”). Kutotumia “yangu” kunadumisha maneno ya chanzo na hakuongezi uzito wa kikristo zaidi ya uliopo, ingawa muktadha unaonyesha uhusiano wa Yesu na Baba.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imetungwa kwa mtiririko wa kawaida wa mazungumzo huku ikihifadhi urudiaji wa “tendo” katika swali na mvutano wa kauli ya Yesu.
