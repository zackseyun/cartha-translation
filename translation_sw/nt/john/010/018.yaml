id: JHN.10.18
reference: John 10:18
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οὐδεὶς ⸀αἴρει αὐτὴν ἀπ’ ἐμοῦ, ἀλλ’ ἐγὼ τίθημι αὐτὴν ἀπ’ ἐμαυτοῦ. ἐξουσίαν ἔχω θεῖναι αὐτήν, καὶ ἐξουσίαν ἔχω πάλιν λαβεῖν αὐτήν· ταύτην τὴν ἐντολὴν ἔλαβον παρὰ τοῦ πατρός μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/018.yaml
  text: No one takes it from me[a], but I lay it down of myself. I have authority to lay it down, and I have authority to take it up again[c][b]. This command I received from my Father.
translation:
  language: sw
  text: Hakuna mtu anayeniondolea uhai wangu, bali mimi mwenyewe nautoa kwa hiari yangu.[a] Nina mamlaka[b] ya kuutoa, na nina mamlaka ya kuuchukua tena.[c] Amri hii nimeipokea kutoka kwa Baba yangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa uamuzi wangu mwenyewe.” Maneno haya yanasisitiza kwamba Yesu anautoa uhai wake kwa hiari.
    reason: lexical_alternative
  - marker: b
    text: Au, “haki” au “uwezo.” Neno la Kigiriki linaweza kujumuisha uwezo wa kutenda na ruhusa au haki halali ya kutenda.
    reason: lexical_alternative
  - marker: c
    text: Yaani, kuuchukua uhai wake tena; linganisha “uhai wangu” katika Yohana 10:17.
    reason: cross_reference
lexical_decisions:
- source_word: αἴρει αὐτὴν ἀπ’ ἐμοῦ
  choice: anayeniondolea uhai wangu
  rationale: Katika muktadha, kiwakilishi αὐτήν kinarejelea ψυχή, ‘uhai,’ katika mstari uliotangulia. Kiswahili cha sasa kinahitaji kurejesha nomino hiyo ili sentensi iwe wazi na ya kawaida; ‘kuniondolea’ huhifadhi maana ya kuchukua kutoka kwake bila kuongeza wazo la kutumia nguvu.
- source_word: τίθημι αὐτὴν
  choice: nautoa
  rationale: Kwa uhai, ‘kutoa’ ni usemi wa kawaida unaowasilisha kujitoa kwa hiari. Pia unaendeleza picha ya Yesu kuutoa uhai wake, ingawa sitiari halisi ya ‘kuuweka chini’ si ya kawaida katika Kiswahili.
- source_word: ἀπ’ ἐμαυτοῦ
  choice: kwa hiari yangu
  rationale: Huu ni usemi wa asili wa Kiswahili unaosisitiza kwamba tendo hilo ni la hiari yake mwenyewe, bila kudokeza kuwa ametenda pasipo uhusiano na Baba.
- source_word: ἐξουσίαν
  choice: mamlaka
  rationale: ‘Mamlaka’ hujumuisha haki na ruhusa halali ya kutenda, si uwezo wa nguvu tu, na inafaa pamoja na amri iliyopokelewa kutoka kwa Baba.
- source_word: πάλιν λαβεῖν αὐτήν
  choice: kuuchukua tena
  rationale: ‘Kuuchukua tena’ huhifadhi maana hai ya λαμβάνω na πάλιν. Haifafanui kupita kiasi namna tendo hilo linavyohusiana na ufufuo.
- source_word: ἐντολὴν
  choice: amri
  rationale: ‘Amri’ ndiyo maana ya moja kwa moja ya ἐντολή na huhifadhi uzito wa kauli pamoja na uhusiano wa Yesu na Baba.
- source_word: παρὰ τοῦ πατρός μου
  choice: kutoka kwa Baba yangu
  rationale: παρά pamoja na hali ya umilikishi huonyesha chanzo; tafsiri hii ni ya kawaida na huhifadhi lugha ya uhusiano wa kifamilia.
theological_decisions:
- issue: Maana ya ἐξουσία kuhusu kifo na kurudi kwa uhai kwa Yesu
  choice: mamlaka
  alternative: uwezo; haki
  rationale: ‘Mamlaka’ huhifadhi kwa pamoja hiari na haki ya Yesu ya kutenda, huku sentensi ya mwisho ikiendelea kuonyesha uhusiano wake na amri ya Baba. Hivyo haisawazishi neno hilo na nguvu tupu wala kuondoa utaratibu wa uhusiano unaoelezwa.
- issue: Nguvu ya ἀπ’ ἐμαυτοῦ
  choice: kwa hiari yangu
  alternative: kutoka kwangu mwenyewe; kwa uamuzi wangu mwenyewe
  rationale: Tafsiri hii inaonyesha wazi kujitoa kwa Yesu kwa hiari, lakini haimaanishi kujitegemea mbali na Baba, kwa kuwa mstari wenyewe unataja amri ya Baba.
- issue: Kirejelewa cha αὐτήν
  choice: uhai wangu
  alternative: huo
  rationale: Kiwakilishi cha Kigiriki kinarejelea uhai wa Yesu katika muktadha wa karibu. Kutaja ‘uhai wangu’ kunaleta Kiswahili cha wazi na cha kawaida bila kubadili kirejelewa.
- issue: Maana ya λαβεῖν katika kauli ya kuuchukua uhai tena
  choice: kuuchukua tena
  alternative: kuupokea tena; kuutwaa tena
  rationale: Kigiriki kinaweza kubeba maana ya kuchukua au kupokea. ‘Kuuchukua tena’ huhifadhi wakala wa Yesu na kutokuamua zaidi ya maandishi ikiwa mkazo uko katika kuchukua au kupokea.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Kutoa uhai’ na ‘kuuchukua tena’ ni miundo inayoeleweka kwa wasomaji wa kawaida; tafsiri inaepuka lugha ya kale isiyo ya lazima. Urejeshaji wa ‘uhai wangu’ badala ya kiwakilishi pekee unatokana na mahitaji ya upatanisho wa ngeli na uwazi wa Kiswahili katika muktadha huu.
