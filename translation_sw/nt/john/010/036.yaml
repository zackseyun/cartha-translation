  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὃν ὁ πατὴρ ἡγίασεν καὶ ἀπέστειλεν εἰς τὸν κόσμον ὑμεῖς λέγετε ὅτι Βλασφημεῖς, ὅτι εἶπον· Υἱὸς τοῦ θεοῦ εἰμι;
base_translation:
  language: en
  yaml_path: translation/nt/john/010/036.yaml
  text: do you say of the one whom the Father sanctified and sent into the world[a], ‘You are blaspheming,’ because I said, ‘I am the Son of God’?”
translation:
  language: sw
  text: Je, ninyi mnamwambia yule ambaye Baba alimtakasa[a] na kumtuma ulimwenguni, ‘Unakufuru,’ kwa sababu nilisema, ‘Mimi ni Mwana wa Mungu’?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “alimweka wakfu” au “alimtenga kwa kusudi maalumu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡγίασεν
  choice: alimtakasa
  rationale: Kitenzi ‘kutakasa’ kinadumisha uhusiano wa moja kwa moja na utakatifu katika ἁγιάζω, huku tanbihi ikionyesha maana mbadala ya kuweka wakfu au kutenga kwa kusudi maalumu. Hakimaanishi hapa kwamba Mwana alibadilishwa kutoka hali ya dhambi.
- source_word: ἀπέστειλεν
  choice: kumtuma
  rationale: ‘Kumtuma’ ni tafsiri ya moja kwa moja na ya kawaida, na inadumisha lugha ya utume inayojirudia katika Injili ya Yohana bila kuongeza wazo la kupewa agizo rasmi.
- source_word: κόσμον
  choice: ulimwenguni
  rationale: ‘Ulimwenguni’ ni tafsiri ya kawaida ya εἰς τὸν κόσμον na inadumisha maana pana ya κόσμος katika Yohana.
- source_word: Βλασφημεῖς
  choice: Unakufuru
  rationale: Kauli ya wakati wa sasa imetafsiriwa kwa Kiswahili cha kawaida kama shtaka la moja kwa moja, ‘Unakufuru.’
- source_word: Υἱὸς τοῦ θεοῦ
  choice: Mwana wa Mungu
  rationale: Hii inadumisha usemi muhimu wa kikristo wa kifungu bila kuingiza ufafanuzi wa kimadhehebu.
- source_word: ὃν ὁ πατὴρ
  choice: yule ambaye Baba
  rationale: Muundo huu ni wa asili na wazi katika Kiswahili na unadumisha rejeo la kishazi husishi.
- source_word: ὅτι ... ὅτι
  choice: mnamwambia ... kwa sababu nilisema
  rationale: ὅτι ya kwanza inaingiza yaliyosemwa, na ya pili inaonyesha sababu ya shtaka. ‘Kwa sababu’ huonyesha uhusiano huo kwa Kiswahili cha kawaida bila kuufafanua kupita kiasi.
theological_decisions:
- issue: Maana ya ἡγίασεν kuhusiana na Mwana
  choice: alimtakasa
  alternative: alimweka wakfu; alimtenga kwa kusudi maalumu
  rationale: ‘Alimtakasa’ inadumisha neno na mvutano wa kiteolojia wa matini. Tanbihi inaeleza maana zinazowezekana katika muktadha wa kutumwa bila kudokeza kwamba Mwana alikuwa mwenye dhambi au asiye mtakatifu hapo awali.
- issue: Uzito wa kikristo wa Υἱὸς τοῦ θεοῦ
  choice: Mwana wa Mungu
  alternative: mwana wa Mungu
  rationale: Herufi kubwa katika ‘Mwana’ inaonyesha matumizi yake kama jina muhimu la utambulisho katika muktadha wa shtaka la kukufuru, bila kuongeza kauli za mafundisho zisizotajwa katika mstari.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka. Muundo wa swali na nukuu umehifadhiwa; ‘ninyi’ imewekwa wazi ili kuonyesha msisitizo wa ὑμεῖς.
