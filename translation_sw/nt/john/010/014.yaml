  text: Mimi ndiye mchungaji mwema, nami ninawajua walio wangu[a], nao walio wangu wananijua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kondoo wangu.” Kigiriki hutumia usemi unaomaanisha “walio/vilivyo vyangu” katika kauli zote mbili.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγώ εἰμι
  choice: Mimi ndiye
  rationale: Hii ni namna ya kawaida na yenye mkazo wa kutambulisha nafsi katika Kiswahili, ikihifadhi msisitizo wa kiwakilishi ἐγώ pamoja na maana ya ‘mimi ni.’
- source_word: ποιμὴν ὁ καλός
  choice: mchungaji mwema
  rationale: ‘Mchungaji’ huhifadhi picha halisi ya mtu anayechunga kondoo bila kuingiza maana ya baadaye ya cheo cha kanisa; ‘mwema’ huwasilisha ubora wa kimaadili na ufaafu unaobebwa na καλός.
- source_word: γινώσκω / γινώσκουσί
  choice: ninawajua / wananijua
  rationale: Kitenzi ‘kujua’ kinahifadhi maana ya ujuzi wa kibinafsi na wa kimahusiano katika kauli hizi mbili zinazolingana.
- source_word: τὰ ἐμὰ / τὰ ἐμά
  choice: walio wangu
  rationale: Usemi huu wa Kiswahili unaonyesha watu walio wa Yesu na kuhifadhi wazo la kuwa mali yake, bila kuingiza moja kwa moja nomino ‘kondoo,’ ambayo haijarudiwa wazi katika Kigiriki cha mstari huu.
- source_word: καί
  choice: nami / nao
  rationale: Viunganishi hivi vya Kiswahili vinaendeleza uratibu rahisi wa kauli za Kigiriki huku vikionyesha kwa uwazi wahusika wanaobadilika.
theological_decisions:
- issue: Kuwasilisha uhusiano wa kujuana kati ya Yesu na walio wake bila kuingiza maelezo ya kimadhehebu
  choice: walio wangu
  alternative: kondoo wangu
  rationale: ‘Walio wangu’ huhifadhi mkazo wa kifungu juu ya kuwa mali ya Yesu na kujuana kibinafsi. ‘Kondoo wangu’ inafaa katika muktadha, lakini nomino hiyo haijasemwa wazi katika vifungu hivi vya Kigiriki.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ‘Mimi ndiye’ ni wa asili na wenye mkazo; ‘walio wangu’ unaeleweka kwa wasomaji wa kawaida huku ukihifadhi ufupi na maana ya umiliki ya matini ya Kigiriki.
