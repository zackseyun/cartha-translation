  text: ἀπεκρίθησαν αὐτῷ οἱ ⸀Ἰουδαῖοι· Περὶ καλοῦ ἔργου οὐ λιθάζομέν σε ἀλλὰ περὶ βλασφημίας, καὶ ὅτι σὺ ἄνθρωπος ὢν ποιεῖς σεαυτὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/033.yaml
  text: The Jews answered him[a], “We are not stoning you for a good work, but for blasphemy, and because you, being a man, make yourself God.”
translation:
  language: sw
  text: Wayahudi wakamjibu, “Hatukupigi mawe kwa sababu ya tendo jema, bali kwa sababu ya kukufuru, na kwa sababu wewe, ingawa wewe ni mwanadamu, unajifanya kuwa Mungu.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “unajifanya kuwa mungu.” Neno la Kigiriki θεόν halina kibainishi, lakini katika muktadha huu wa shtaka la kukufuru, maana inayowezekana zaidi ni “Mungu.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰουδαῖοι
  choice: Wayahudi
  rationale: Ni tafsiri ya moja kwa moja inayohifadhi istilahi ya Yohana bila kuibana kwa maana ya ‘viongozi wa Wayahudi’ au ‘Watu wa Yudea’; katika muktadha huu inarejelea kundi pinzani linalomkabili Yesu.
- source_word: Περὶ καλοῦ ἔργου
  choice: kwa sababu ya tendo jema
  rationale: Huwasilisha περί pamoja na hali ya umilikishi kama sababu ya hatua hiyo, huku ikihifadhi umoja wa ἔργου na sifa ya kimaadili ya καλοῦ.
- source_word: λιθάζομέν
  choice: hatukupigi mawe
  rationale: Wakati uliopo wa kitenzi unaonyesha hatua au nia yao ya sasa; usemi ‘kupiga mawe’ ni wa kawaida na wazi katika Kiswahili.
- source_word: βλασφημίας
  choice: kukufuru
  rationale: Kitenzi-jina hiki ni cha kawaida na hueleweka kwa tendo la kumvunjia Mungu heshima kwa maneno au madai.
- source_word: ἄνθρωπος ὢν
  choice: ingawa ni mwanadamu
  rationale: ‘Ingawa’ huonyesha wazi nguvu ya ukinzani ya kirai shiriki katika shtaka lao, na ‘mwanadamu’ huhifadhi maana ya jumla ya ἄνθρωπος.
- source_word: ποιεῖς σεαυτὸν θεόν
  choice: unajifanya kuwa Mungu
  rationale: Muundo wa kujirejelea pamoja na kiarifu unamaanisha kujifanya au kujiwasilisha kuwa fulani. ‘Mungu’ linafaa zaidi katika muktadha wa shtaka la kukufuru, huku uwezekano wa ‘mungu’ ukihifadhiwa katika tanbihi.
theological_decisions:
- issue: Tafsiri ya θεόν isiyo na kibainishi katika shtaka ποιεῖς σεαυτὸν θεόν
  choice: Mungu
  alternative: mungu
  rationale: Ingawa θεόν bila kibainishi inaweza kisarufi kueleweka kwa namna zote mbili, shtaka la kukufuru na muktadha wa Yohana vinaelekeza kwenye dai la hadhi inayomhusu Mungu. Tanbihi huhifadhi uwezekano mwingine bila kuuficha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo wa sentensi umehifadhi msisitizo na ukinzani wa shtaka la wasemaji.
