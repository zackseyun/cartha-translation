  text: ⸀ὅταν τὰ ἴδια ⸀πάντα ἐκβάλῃ, ἔμπροσθεν αὐτῶν πορεύεται, καὶ τὰ πρόβατα αὐτῷ ἀκολουθεῖ, ὅτι οἴδασιν τὴν φωνὴν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/010/004.yaml
  text: When he has brought out all his own[a], he goes before them, and the sheep follow him, because they know his voice.
translation:
  language: sw
  text: Anapokwisha kuwatoa nje kondoo wake wote[a], hutangulia mbele yao, nao kondoo humfuata, kwa sababu wanaijua sauti yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “amewafukuza nje” au “amewaongoza nje”; kitenzi cha Kigiriki kinaweza kumaanisha kuwafukuza au kuwatoa kutoka mahali palipofungwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: Anapokuwa
  rationale: Huanzisha kishazi cha wakati kisichoainisha tukio moja tu; muundo huu ni wa kawaida katika Kiswahili na unafaa kwa maelezo ya desturi.
- source_word: τὰ ἴδια πάντα
  choice: wote walio wake
  rationale: Huhifadhi wazo la wale walio mali yake huku jinsia ya nomino ikifuata rejeo la kondoo katika muktadha; 'wote' pia huhifadhi πάντα.
- source_word: ἐκβάλῃ
  choice: amewatoa nje
  rationale: Hueleza kuwatoa kutoka zizini bila kuipa kauli ukali usio wa lazima; kauli timilifu inafaa baada ya kishazi cha wakati.
- source_word: ἔμπροσθεν αὐτῶν πορεύεται
  choice: yeye hutangulia mbele yao
  rationale: Huhifadhi taswira ya mchungaji anayeenda akiwa mbele; 'hu-' huonyesha tendo la kawaida katika maelezo haya.
- source_word: τὰ πρόβατα αὐτῷ ἀκολουθεῖ
  choice: nao kondoo humfuata
  rationale: Ni Kiswahili cha kawaida kwa kondoo wanaomfuata mchungaji; 'nao' huunganisha sentensi na kuonyesha wazi mhusika.
- source_word: ὅτι οἴδασιν τὴν φωνὴν αὐτοῦ
  choice: kwa sababu wanaijua sauti yake
  rationale: '''Kwa sababu'' huonyesha sababu wazi, na ''wanaijua'' huhifadhi maana ya kujua huku muktadha ukidokeza kuitambua.'
theological_decisions:
- issue: Taswira ya uchungaji na nguvu ya ἐκβάλῃ
  choice: amewatoa nje
  alternative: amewafukuza nje; amewaongoza nje
  rationale: Muktadha ni wa mchungaji na kondoo wake, si wa kufukuzwa kwa uhasama. Tafsiri hii huhifadhi mwendo wa kutoka ndani ya zizi bila kuingiza wazo la kulazimishwa, huku tanbihi ikitaja upana wa maana ya kitenzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Matumizi ya 'zizi' yameachwa katika tanbihi kwa ufafanuzi wa mazingira, kwa kuwa halitajwi moja kwa moja katika mstari huu.
