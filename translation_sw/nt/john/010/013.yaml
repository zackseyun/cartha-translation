  text: because he is a hired hand and does not care about the sheep.
translation:
  language: sw
  text: kwa sababu yeye ni mfanyakazi wa kuajiriwa, na hajali kondoo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: kwa sababu
  rationale: Katika muktadha huu, neno hili linaeleza sababu ya kukimbia kwa mfanyakazi aliyetajwa katika kifungu kilichotangulia.
- source_word: μισθωτός
  choice: mfanyakazi wa kuajiriwa
  rationale: Neno hili humaanisha mtu anayefanya kazi kwa ujira, tofauti na mwenye kondoo; usemi huu ni wa kawaida na unaeleweka katika Kiswahili cha sasa.
- source_word: οὐ μέλει αὐτῷ περὶ
  choice: wala hawajali
  rationale: Muundo huu unaonyesha kutokuwa na hali ya kujali au kuhangaikia; tafsiri hii ni ya asili na inadumisha uzito wa kimaadili wa kauli hiyo.
- source_word: τῶν προβάτων
  choice: kondoo
  rationale: Tafsiri ya moja kwa moja inadumisha taswira ya uchungaji badala ya kutumia neno pana zaidi, kama ‘kundi.’
theological_decisions:
- issue: Jinsi mfanyakazi wa kuajiriwa anavyotofautishwa na mchungaji mwema
  choice: Kauli imetafsiriwa kama tathmini ya moja kwa moja ya tabia yake bila kumtambulisha mfanyakazi huyo na kundi maalumu la viongozi.
  alternative: Kumfafanua kuwa mfano wa kundi fulani la viongozi wa uongo, au kupunguza tofauti hiyo iwe tu ukosefu wa uhusiano wa karibu wa kikazi.
  rationale: Aya yenyewe inasema kwamba yeye ni mfanyakazi wa kuajiriwa na hawajali kondoo. Tafsiri inadumisha tofauti hiyo bila kuingiza utambulisho au fundisho ambalo halijasemwa wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. ‘Mfanyakazi wa kuajiriwa’ ni wazi ingawa ni kirefu kidogo; kiwakilishi ‘yeye’ kimedumishwa ili kuonyesha msisitizo uliopo katika αὐτῷ.
