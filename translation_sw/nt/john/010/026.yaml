  text: But you do not believe[a], because you are not among my sheep.
translation:
  language: sw
  text: Lakini ninyi hamwamini[a], kwa sababu hamko miongoni mwa kondoo wangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Lakini ninyi hamwamini kwamba hamko miongoni mwa kondoo wangu.” Kiunganishi cha Kigiriki kinaweza pia kueleweka kuwa kinaanzisha maudhui badala ya sababu.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: Lakini
  rationale: Kiunganishi hiki kinaonyesha tofauti na maelezo yaliyotangulia kuhusu kondoo wa Yesu; “Lakini” ni tafsiri ya kawaida na ya asili katika Kiswahili.
- source_word: ὑμεῖς
  choice: ninyi
  rationale: Kiwakilishi kimetajwa wazi katika Kigiriki na kina mkazo. “Ninyi” huhifadhi mkazo huo bila kuutia chumvi.
- source_word: οὐ πιστεύετε
  choice: hamwamini
  rationale: Kitenzi cha wakati wa sasa chenye ukanushi kinatafsiriwa kwa hali ya sasa. Kwa muktadha, “hamwamini” huonyesha kwamba Yesu ndiye anayelengwa na imani, jambo lililo wazi katika mazungumzo.
- source_word: ὅτι
  choice: kwa sababu
  rationale: Hapa ὅτι yaweza kueleweka kama ikitoa sababu au ikianzisha maudhui ya kile kisichoaminiwa. Maana ya sababu inafaa zaidi katika mtiririko wa hoja, huku uwezekano mwingine ukihifadhiwa katika tanbihi.
- source_word: οὐκ ἐστὲ
  choice: ninyi si
  rationale: Hii ni kauli ya moja kwa moja ya kukanusha hali ya kuwa; “ninyi si” ni Kiswahili cha kawaida na huhifadhi mkazo wa kiwakilishi.
- source_word: ἐκ τῶν προβάτων
  choice: miongoni mwa kondoo
  rationale: ἐκ hapa huonyesha kuwa sehemu ya kundi. “Miongoni mwa kondoo” huwasilisha uanachama wa kundi kwa Kiswahili cha asili.
- source_word: τῶν ἐμῶν
  choice: wangu
  rationale: Kivumishi cha umilikaji kinatafsiriwa kwa kawaida kama “wangu,” kikirejelea “kondoo.”
theological_decisions:
- issue: Maana ya ὅτι katika uhusiano kati ya kutokuamini na kuwa miongoni mwa kondoo wa Yesu
  choice: 'Maana ya sababu: “kwa sababu ninyi si miongoni mwa kondoo wangu”'
  alternative: 'Maana ya maudhui: “hamwamini kwamba ninyi si miongoni mwa kondoo wangu”'
  rationale: Muktadha wa karibu unatofautisha kondoo wanaoisikia sauti ya Yesu na kumfuata na wapinzani hawa; kwa hiyo, maana ya sababu inaeleza kutokuamini kwao kwa kutokuwa kwao katika kundi lake. Hata hivyo, muundo wa Kigiriki unaweza pia kuanzisha maudhui ya kile kisichoaminiwa. Tanbihi huhifadhi utata huu bila kuamua kimyakimya mjadala mpana wa kiteolojia kuhusu kutokuamini na kuwa wa kundi la Yesu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Kurudiwa kwa “ninyi” kunahifadhi mkazo wa kiwakilishi cha Kigiriki, ingawa kunafanya sentensi iwe rasmi kidogo.
