  text: Καὶ ἀπῆλθεν πάλιν πέραν τοῦ Ἰορδάνου εἰς τὸν τόπον ὅπου ἦν Ἰωάννης τὸ πρῶτον βαπτίζων, καὶ ἔμεινεν ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/040.yaml
  text: And he went away again across the Jordan to the place where John had first been baptizing[a], and he stayed there.
translation:
  language: sw
  text: Akaenda tena ng'ambo ya Yordani, mpaka mahali ambapo Yohana alikuwa akibatiza hapo mwanzo, naye akakaa huko.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπῆλθεν
  choice: akaondoka
  rationale: Kitenzi hiki kinaonyesha kuondoka mahali alipokuwa; “akaondoka” ni cha kawaida na huhifadhi maana ya kuondoka.
- source_word: πάλιν
  choice: tena
  rationale: Hutoa wazi maana ya tendo kurudiwa.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: akavuka Yordani
  rationale: Katika muktadha wa mwendo, msemo huu unaeleza kwenda upande wa pili wa Yordani; “akavuka Yordani” ni Kiswahili cha asili na kinachoeleweka wazi.
- source_word: εἰς τὸν τόπον
  choice: na kwenda mahali
  rationale: εἰς huonyesha mwendo kuelekea mahali panapolengwa; muundo huu ni wa kawaida katika Kiswahili.
- source_word: ὅπου ἦν Ἰωάννης τὸ πρῶτον βαπτίζων
  choice: ambapo hapo mwanzo Yohana alikuwa akibatiza
  rationale: “Alikuwa akibatiza” huhifadhi hali endelevu ya shughuli ya Yohana, na “hapo mwanzo” huonyesha kuwa ilikuwa katika kipindi cha awali.
- source_word: ἔμεινεν ἐκεῖ
  choice: naye akakaa huko
  rationale: “Akakaa huko” ni tafsiri ya kawaida ya μένω pamoja na ἐκεῖ na huhifadhi maana ya kubaki mahali hapo.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Jina “Yesu” limetumiwa badala ya kiwakilishi pekee ili kurejesha mhusika kwa uwazi katika mstari unaoweza kusomwa peke yake. Hakuna tanbihi iliyowekwa, kwa kuwa tofauti ya Kiingereza kati ya “across” na “beyond” inaweza kuwasilishwa kiasili kwa “akavuka Yordani” bila kupoteza maana ya kuwa upande wa pili.
