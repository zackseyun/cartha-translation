  text: τὰ πρόβατα τὰ ἐμὰ τῆς φωνῆς μου ⸀ἀκούουσιν, κἀγὼ γινώσκω αὐτά, καὶ ἀκολουθοῦσίν μοι,
base_translation:
  language: en
  yaml_path: translation/nt/john/010/027.yaml
  text: My sheep hear my voice, and I know them, and they follow me.
translation:
  language: sw
  text: Kondoo wangu huisikia sauti yangu; nami ninawajua, nao hunifuata.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ πρόβατα τὰ ἐμὰ
  choice: Kondoo wangu
  rationale: Hutoa kwa Kiswahili cha kawaida maana ya umiliki iliyo katika kivumishi cha Kigiriki, bila kuongeza mkazo mzito wa ‘kondoo walio wangu mwenyewe’.
- source_word: τῆς φωνῆς μου
  choice: sauti yangu
  rationale: Katika mfano wa mchungaji na kondoo, ‘sauti’ humaanisha sauti ya mtu inayotambuliwa, wala si mlio wa jumla.
- source_word: ἀκούουσιν
  choice: huisikia
  rationale: Kitenzi cha wakati uliopo kinaonyesha tendo la kawaida au la kudumu. ‘Huisikia’ huhifadhi maana ya moja kwa moja ya kusikia bila kuongeza kwa lazima wazo la kutii au kusikiliza kwa makini.
- source_word: κἀγὼ γινώσκω αὐτά
  choice: nami ninawajua
  rationale: ‘Nami’ huhifadhi kiunganishi na mkazo wa kiasi katika καὶ ἐγώ; ‘ninawajua’ huhifadhi maana pana na ya uhusiano ya γινώσκω bila kuipanua kwa tafsiri.
- source_word: ἀκολουθοῦσίν μοι
  choice: nao hunifuata
  rationale: ‘Hunifuata’ huonyesha kitendo cha kawaida kinachowatambulisha kondoo hao, kama wakati uliopo wa Kigiriki.
theological_decisions:
- issue: Nguvu ya kiuhusiano ya γινώσκω katika mfano wa mchungaji na kondoo
  choice: ninawajua
  alternative: ninawatambua / ninawajua kibinafsi
  rationale: ‘Ninawajua’ huacha kina cha uhusiano kikiwa wazi bila kudhoofisha maana kuwa utambuzi tu wala kuongeza ufafanuzi wa kiteolojia usiotamkwa moja kwa moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Matumizi ya ‘hu-’ katika ‘huisikia’ na ‘hunifuata’ yanaonyesha tabia endelevu au ya kawaida; ‘ninawajua’ hudumisha usemi wa kawaida na wa moja kwa moja.
