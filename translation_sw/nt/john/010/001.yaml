source:
  edition: SBLGNT
  text: Ἀμὴν ἀμὴν λέγω ὑμῖν, ὁ μὴ εἰσερχόμενος διὰ τῆς θύρας εἰς τὴν αὐλὴν τῶν προβάτων ἀλλὰ ἀναβαίνων ἀλλαχόθεν ἐκεῖνος κλέπτης ἐστὶν καὶ λῃστής·
base_translation:
  language: en
  yaml_path: translation/nt/john/010/001.yaml
  text: Truly[a], truly, I say to you, the one who does not enter through the door into the sheepfold[c][b], but climbs up from somewhere else—that man is a thief and a robber.
translation:
  language: sw
  text: '“Amin, amin, nawaambia: Mtu asiyeingia katika zizi la kondoo[b] kwa kupitia langoni[a], bali anayepanda kuingia kwa upande mwingine, huyo ni mwizi na mnyang’anyi.[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kupitia mlangoni.” Neno la Kigiriki θύρα linaweza kumaanisha mlango au lango kulingana na muktadha.
    reason: lexical_alternative
  - marker: b
    text: Au “katika ua wa kondoo” au “katika boma la kondoo.” Neno la Kigiriki αὐλή humaanisha ua au eneo lililozungushiwa; katika muktadha huu linaweza kuwa zizi la kondoo.
    reason: lexical_alternative
  - marker: c
    text: Kigiriki hutofautisha “mwizi” (κλέπτης) na “mnyang’anyi” (λῃστής); neno la pili mara nyingi hudokeza uporaji wa kutumia nguvu au ukatili.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀμὴν ἀμὴν
  choice: Amin, amin
  rationale: Huhifadhi fomula ya Yesu iliyorudiwa kwa msisitizo na uzito wake wa dhati; “Amin” inaeleweka katika Kiswahili cha kibiblia na ibada.
- source_word: λέγω ὑμῖν
  choice: nawaambia
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya usemi wa Yesu kwa watu wengi.
- source_word: ὁ μὴ εἰσερχόμενος
  choice: Mtu asiyeingia
  rationale: Hutoa maana ya mtendaji mmoja anayewakilisha yeyote mwenye sifa hiyo, kwa Kiswahili cha kawaida bila kulazimisha jinsia isiyoonyeshwa kisarufi katika Kiswahili.
- source_word: διὰ τῆς θύρας
  choice: kwa kupitia langoni
  rationale: Katika mazingira ya uzio wa kondoo, “lango” huonyesha njia rasmi ya kuingia kwa ufasaha; neno la Kigiriki linaweza pia kutafsiriwa “mlango.”
- source_word: εἰς τὴν αὐλὴν τῶν προβάτων
  choice: katika zizi la kondoo
  rationale: “Zizi la kondoo” ni usemi wa kawaida unaoonyesha eneo lililozungushiwa na kutumiwa kuwaweka kondoo, kulingana na mazingira ya kichungaji.
- source_word: ἀλλὰ ἀναβαίνων ἀλλαχόθεν
  choice: bali anayepanda kuingia kutoka upande mwingine
  rationale: Huhifadhi picha ya mtu anayepanda au kuvuka kizuizi badala ya kutumia lango, pamoja na wazo la kutoka mahali au upande mwingine.
- source_word: ἐκεῖνος
  choice: huyo
  rationale: Kiwakilishi hiki cha kuonyesha kinadumisha msisitizo wa Kigiriki kwa njia ya kawaida katika Kiswahili.
- source_word: κλέπτης
  choice: mwizi
  rationale: Ni neno la kawaida kwa mtu anayeiba, mara nyingi kwa siri.
- source_word: λῃστής
  choice: mnyang’anyi
  rationale: Hutofautisha neno hili na “mwizi” na kudokeza unyang’anyi wa nguvu au ukatili unaoweza kuwamo katika λῃστής.
theological_decisions:
- issue: Taswira ya θύρα na αὐλή
  choice: Kutafsiri kwa taswira halisi ya “lango” na “zizi la kondoo” bila kuifafanua kialegoria.
  alternative: Kutumia “mlango” na “ua wa kondoo,” au kuongeza moja kwa moja utambulisho wa wahusika wa mfano.
  rationale: Mstari huu unaanzisha taswira ambayo muktadha unaofuata utaifafanua. Tafsiri haipaswi kuingiza mapema hitimisho kuhusu Yesu, viongozi, au wokovu.
- issue: Umoja wa ὁ μὴ εἰσερχόμενος na msisitizo wa ἐκεῖνος
  choice: “Mtu asiyeingia … huyo”
  alternative: “Yeyote asiyeingia … yeye”
  rationale: Muundo huu hudumisha rejeo la mtu mmoja na msisitizo wa kiwakilishi bila kuongeza jinsia ambayo Kiswahili hakihitaji.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya usomaji wa Maandiko. Muundo ni wa asili na unaoeleweka kwa wasomaji wa kawaida, huku marudio ya “Amin, amin” na tofauti kati ya “mwizi” na “mnyang’anyi” vikihifadhiwa.
