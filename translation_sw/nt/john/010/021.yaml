id: JHN.10.21
reference: John 10:21
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ⸀ἄλλοι ἔλεγον· Ταῦτα τὰ ῥήματα οὐκ ἔστιν δαιμονιζομένου· μὴ δαιμόνιον δύναται τυφλῶν ὀφθαλμοὺς ⸀ἀνοῖξαι;
base_translation:
  language: en
  yaml_path: translation/nt/john/010/021.yaml
  text: Others were saying[a], “These words are not those of a demon-possessed man. A demon cannot open the eyes of the blind, can it?”
translation:
  language: sw
  text: Wengine walikuwa wakisema, “Maneno haya si ya mtu mwenye pepo[a]. Kwani pepo anaweza kufungua macho ya vipofu?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Maneno haya hayatoki kwa mtu mwenye pepo.”
    reason: 'Njia nyingine ya kueleza uhusiano wa kimaanana katika οὐκ ἔστιν δαιμονιζομένου: maneno hayo yanaweza kuelezwa kuwa si ‘ya’ mtu huyo au kwamba ‘hayatoki kwa’ mtu huyo.'
lexical_decisions:
- source_word: ἄλλοι
  choice: Wengine
  rationale: Inaonyesha kundi tofauti na wasemaji waliotangulia katika muktadha, kwa Kiswahili cha kawaida na cha moja kwa moja.
- source_word: ἔλεγον
  choice: walikuwa wakisema
  rationale: Kauli ya wakati usiotimilika inadokeza usemi uliokuwa ukiendelea au kurudiwa, jambo linalowasilishwa vizuri kwa muundo huu.
- source_word: Ταῦτα τὰ ῥήματα
  choice: Maneno haya
  rationale: ῥήματα inarejelea maneno aliyosema Yesu; tafsiri hii ni ya moja kwa moja, ya kawaida, na inalinda taswira ya matini.
- source_word: οὐκ ἔστιν δαιμονιζομένου
  choice: si ya mtu mwenye pepo
  rationale: Muundo wa Kigiriki unaonyesha kwamba maneno hayo si maneno yanayolingana na au kutoka kwa mtu mwenye pepo. Kiswahili hiki ni cha asili bila kuingiza maelezo ya kiufundi yasiyolazimishwa na matini.
- source_word: μὴ
  choice: Kwani ...?
  rationale: ‘Kwani’ katika swali hili huonyesha kwamba jibu linalotarajiwa ni la kukataa, sawasawa na nguvu ya μή.
- source_word: δαιμόνιον
  choice: pepo
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja ya δαιμόνιον katika Kiswahili cha Biblia na matumizi ya sasa.
- source_word: δύναται
  choice: anaweza
  rationale: Inahifadhi swali kuhusu uwezo; nguvu ya jibu hasi linalotarajiwa inaonyeshwa na ‘Kwani’ badala ya kugeuza swali kuwa taarifa.
- source_word: τυφλῶν ὀφθαλμοὺς
  choice: macho ya vipofu
  rationale: Inafuata kwa karibu muundo wa Kigiriki, ni ya kawaida kwa Kiswahili, na inadumisha rejeo la kuponywa kwa mtu aliyekuwa kipofu.
- source_word: ἀνοῖξαι
  choice: kufungua
  rationale: Inahifadhi taswira halisi ya kufungua macho badala ya kuibadilisha kuwa ufafanuzi kama ‘kurudisha uwezo wa kuona.’
theological_decisions:
- issue: Tafsiri ya δαιμονίζομαι na δαιμόνιον
  choice: mtu mwenye pepo / pepo
  alternative: mtu aliyepagawa na pepo / roho mwovu
  rationale: ‘Mwenye pepo’ na ‘pepo’ zinawasilisha wazi lugha ya matini kuhusu ushawishi wa kishetani bila kulazimisha nadharia mahususi kuhusu namna au kiwango cha umiliki wa pepo.
- issue: Nguvu ya swali linaloanzishwa na μή
  choice: Kwani pepo anaweza kufungua macho ya vipofu?
  alternative: Je, pepo anaweza kufungua macho ya vipofu?
  rationale: ‘Kwani’ huonyesha kwa njia ya kawaida kwamba wasemaji wanatarajia jibu ‘hawezi,’ huku ikiendelea kuwa swali badala ya kugeuzwa kuwa dai la moja kwa moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Walikuwa wakisema’ huhifadhi hali ya tendo linaloendelea; ‘Kwani’ huleta kwa kawaida matarajio ya jibu hasi. Msamiati umewekwa wazi kwa wasomaji wa kawaida bila kupunguza mvutano wa hoja ya umati.
