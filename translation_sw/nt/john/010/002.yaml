  yaml_path: translation/nt/john/010/002.yaml
  text: But the one who enters through the door is the shepherd of the sheep[a].
translation:
  language: sw
  text: Lakini yule anayeingia kupitia mlango ndiye mchungaji wa kondoo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au “ni mchungaji wa kondoo.” Nomino ya Kigiriki ποιμήν (“mchungaji”) haina kibainishi, lakini muktadha unapendelea maana dhahiri: mchungaji halali, tofauti na waingiaji wasio halali.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ εἰσερχόμενος
  choice: Lakini yule anayeingia
  rationale: Kirai chenye kibainishi na kitenzi-shirikishi cha wakati uliopo kinamtaja mtu anayejulikana kwa tendo la kuingia. “Yule anayeingia” ni Kiswahili cha kawaida chenye maana ya jumla, na “lakini” linaonyesha utofauti na mwizi na mnyang’anyi wa mstari uliotangulia.
- source_word: διὰ τῆς θύρας
  choice: kupitia mlango
  rationale: διά pamoja na umilikishi huonyesha mwendo unaopita katika kitu; “kupitia mlango” linahifadhi taswira ya mahali kwa uwazi.
- source_word: ποιμήν
  choice: ndiye mchungaji
  rationale: Ingawa nomino-arifu ya Kigiriki haina kibainishi, muktadha unamtambulisha mchungaji halali kwa kumtofautisha na waingiaji wasio halali. Muundo wa Kiswahili “ndiye mchungaji” unaonyesha utambulisho huo bila kulazimisha dai la ziada.
- source_word: τῶν προβάτων
  choice: wa kondoo
  rationale: πρόβατα humaanisha kondoo moja kwa moja. “Wa kondoo” huhifadhi taswira halisi badala ya kuibadili kuwa “wa kundi.”
theological_decisions:
- issue: Udhahiri wa ποιμήν kama nomino-arifu
  choice: ndiye mchungaji
  alternative: ni mchungaji
  rationale: Muktadha unamtofautisha mwingiaji halali na wezi na wanyang’anyi, hivyo “ndiye mchungaji” linaonyesha mchungaji anayetambulika na aliye halali. Hata hivyo, kwa kuwa ποιμήν haina kibainishi katika Kigiriki, uwezekano wa “ni mchungaji” umehifadhiwa katika tanbihi, bila kuingiza madai ya kikristo yaliyo nje ya sitiari ya karibu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Yule anayeingia” na “kupitia mlango” ni miundo ya kawaida na inayoeleweka; “ndiye” huwasilisha utofauti na utambulisho unaodokezwa na muktadha.
