  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ταύτην τὴν παροιμίαν εἶπεν αὐτοῖς ὁ Ἰησοῦς· ἐκεῖνοι δὲ οὐκ ἔγνωσαν τίνα ⸀ἦν ἃ ἐλάλει αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/006.yaml
  text: Jesus spoke this figure of speech to them[a], but they did not understand what he was saying to them.
translation:
  language: sw
  text: Yesu aliwaambia usemi huu wa mfano[a], lakini wao hawakuelewa maana ya yale aliyokuwa akiwaambia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mfano,” “kielelezo,” au “methali.” Neno la Kigiriki linaweza kumaanisha kwa upana usemi wa kitamathali; hapa linarejelea maneno ya Yesu kuhusu mchungaji yaliyotolewa kwa lugha isiyo ya moja kwa moja.
    reason: lexical_alternative
lexical_decisions:
- source_word: παροιμίαν
  choice: usemi huu wa mfano
  rationale: Neno hili linaweza kumaanisha usemi wa kitamathali, mfano, au methali. “Usemi wa mfano” linaonyesha kwamba maneno ya Yesu hayakukusudiwa kueleweka kwa maana ya moja kwa moja, bila kuyafanya kuwa lazima mfano wa aina maalumu au methali.
- source_word: εἶπεν αὐτοῖς
  choice: aliwaambia
  rationale: Kitenzi pamoja na kiwakilishi cha yambwa kisicho cha moja kwa moja kinatafsiriwa kwa Kiswahili cha kawaida kuwa “aliwaambia,” kikihifadhi kwamba Yesu aliwaelekezea wao usemi huo.
- source_word: ἐκεῖνοι δὲ
  choice: lakini wao
  rationale: “Lakini” linaonyesha utofautishaji, na “wao” linasisitiza kwamba wasikilizaji, tofauti na Yesu aliyesema, hawakuelewa.
- source_word: οὐκ ἔγνωσαν
  choice: hawakuelewa
  rationale: Katika muktadha huu, kitenzi kinahusu kutofahamu usemi wa kitamathali wa Yesu, si kukosa tu kujua jambo fulani.
- source_word: τίνα ἦν ἃ ἐλάλει αὐτοῖς
  choice: maana ya yale aliyokuwa akiwaambia
  rationale: Muundo wa Kigiriki ni mgumu na kwa karibu unasema “vitu alivyokuwa akiwaambia vilikuwa nini.” Tafsiri hii ya Kiswahili inawasilisha kutofahamu kwao yaliyomaanishwa, huku ikihifadhi kurejelewa kwa mambo aliyokuwa akiwaambia.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa maandiko. “Usemi wa mfano” ni wazi kwa msomaji wa leo na huhifadhi upana wa neno la Kigiriki; sentensi ya pili imewekwa katika muundo wa kawaida wa Kiswahili bila kuondoa wazo la kutofahamu maana.
