  yaml_path: translation/nt/john/010/020.yaml
  text: But many of them were saying[a], “He has a demon and is insane. Why do you listen to him?”
translation:
  language: sw
  text: Lakini wengi wao walikuwa wakisema, “Ana pepo na ana wazimu. Kwa nini mnamsikiliza?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: walikuwa wakisema
  rationale: Kauli ya wakati uliopita isiotimilika inaonyesha usemi uliokuwa ukiendelea au kurudiwa katika tukio hilo.
- source_word: δὲ
  choice: Lakini
  rationale: Kiunganishi hiki kinaonyesha utofauti na mwitikio uliotangulia.
- source_word: πολλοὶ ἐξ αὐτῶν
  choice: wengi wao
  rationale: Ni Kiswahili cha kawaida kinachohifadhi maana kwamba walikuwa sehemu kubwa ya kundi hilo, si lazima wote.
- source_word: Δαιμόνιον ἔχει
  choice: Ana pepo
  rationale: Hufuata kwa uwazi muundo wa Kigiriki, ‘ana pepo,’ bila kuongeza ufafanuzi wa hali ya kupagawa.
- source_word: μαίνεται
  choice: amerukwa na akili
  rationale: Ni usemi wa sasa na unaoeleweka kwa wasomaji wa kawaida, unaowasilisha shtaka kwamba hana akili timamu bila kuufanya kuwa uchunguzi wa kitabibu.
- source_word: τί αὐτοῦ ἀκούετε;
  choice: Kwa nini mnamsikiliza?
  rationale: Katika muktadha huu τί hutumika kwa maana ya ‘kwa nini,’ na ἀκούω pamoja na yambwa katika hali ya genitive ina maana ya kumsikiliza mtu.
theological_decisions:
- issue: Namna ya kutafsiri shtaka la uhasama kuhusu hali ya Yesu
  choice: Ana pepo na amerukwa na akili
  alternative: Amepagawa na pepo na ana wazimu
  rationale: Tafsiri kuu inahifadhi maneno ya moja kwa moja ya Kigiriki na uzito wa kashfa ya wapinzani bila kuyathibitisha kuwa maelezo ya kweli au kuingiza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. ‘Walikuwa wakisema’ huhifadhi hali ya kitendo kinachoendelea, na ‘mnamsikiliza’ linaendeleza nguvu ya swali la lawama.
