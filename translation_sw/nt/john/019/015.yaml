  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ⸂ἐκραύγασαν οὖν ἐκεῖνοι⸃· Ἆρον ἆρον, σταύρωσον αὐτόν. λέγει αὐτοῖς ὁ Πιλᾶτος· Τὸν βασιλέα ὑμῶν σταυρώσω; ἀπεκρίθησαν οἱ ἀρχιερεῖς· Οὐκ ἔχομεν βασιλέα εἰ μὴ Καίσαρα.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/015.yaml
  text: So they cried out[a], “Away, away! Crucify him!” Pilate said to them, “Shall I crucify your king?” The chief priests answered, “We have no king except Caesar.”
translation:
  language: sw
  text: Basi wao wakapiga kelele, “Mwondoe! Mwondoe! Msulubishe!” Pilato akawauliza, “Je, nimsulubishe mfalme wenu?” Makuhani wakuu wakajibu, “Hatuna mfalme ila Kaisari.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκραύγασαν οὖν ἐκεῖνοι
  choice: Basi wao wakapiga kelele
  rationale: “Basi” linaonyesha matokeo au mwendelezo wa simulizi unaoletwa na οὖν; “wao” linadumisha msisitizo wa ἐκεῖνοι; na “wakapiga kelele” linaonyesha kilio cha sauti kubwa cha κραυγάζω bila kuongeza hali maalumu ya kihisia.
- source_word: Ἆρον ἆρον
  choice: Mwondoe! Mwondoe!
  rationale: Amri iliyorudiwa inadai aondolewe mara moja. Kiswahili huweka yambwa inayofahamika kutokana na muktadha katika kiambishi “-m-,” hivyo nguvu ya kilio inadumishwa bila usemi usio wa kawaida.
- source_word: σταύρωσον αὐτόν
  choice: Msulubishe!
  rationale: Katika mazingira ya adhabu ya Kirumi, σταυρόω humaanisha kumsulubisha; kiambishi “m-” kinawakilisha αὐτόν.
- source_word: Τὸν βασιλέα ὑμῶν σταυρώσω;
  choice: Je, nimsulubishe mfalme wenu?
  rationale: Muundo wa swali wenye “ni-...-she” unaonyesha swali la kujadiliana la subjunktivi na kudumisha ukali na kejeli inayoweza kusikika katika swali la Pilato.
- source_word: οἱ ἀρχιερεῖς
  choice: Makuhani wakuu
  rationale: Hili ndilo neno la kawaida na sahihi kwa viongozi wakuu wa kikuhani wanaotajwa kwa wingi.
- source_word: Οὐκ ἔχομεν βασιλέα εἰ μὴ Καίσαρα
  choice: Hatuna mfalme ila Kaisari
  rationale: “Ila” linaonyesha upekee wa εἰ μὴ kwa Kiswahili cha asili na kuhifadhi dai kali kwamba Kaisari pekee ndiye mfalme wao.
theological_decisions:
- issue: Tamko la makuhani wakuu kuhusu utii wa kisiasa
  choice: Hatuna mfalme ila Kaisari
  alternative: Hatuna mfalme mwingine isipokuwa Kaisari
  rationale: Tafsiri inadumisha upekee na mvutano wa tamko lao katika simulizi bila kueleza matokeo yake ya kiteolojia au kuingiza fundisho la dhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Marudio ya amri yamehifadhiwa kwa nguvu ya usemi, huku sentensi zikiwa wazi kwa msomaji wa kawaida.
