  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: τοῦτον οὖν τὸν τίτλον πολλοὶ ἀνέγνωσαν τῶν Ἰουδαίων, ὅτι ἐγγὺς ἦν ὁ τόπος τῆς πόλεως ὅπου ἐσταυρώθη ὁ Ἰησοῦς· καὶ ἦν γεγραμμένον Ἑβραϊστί, ⸂Ῥωμαϊστί, Ἑλληνιστί⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/020.yaml
  text: Therefore many of the Jews read this inscription[a], because the place where Jesus was crucified was near the city; and it was written in Hebrew, in Latin, and in Greek.
translation:
  language: sw
  text: Kwa hiyo, Wayahudi wengi waliisoma ile ilani, kwa sababu mahali ambapo Yesu alisulubiwa palikuwa karibu na mji. Ilikuwa imeandikwa kwa Kiebrania[a], Kilatini na Kigiriki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, yawezekana, “kwa Kiaramu”; Yohana hutumia “Kiebrania” kurejelea lugha ya Kisemiti ya mahali hapo.
    reason: lexical_alternative
lexical_decisions:
- source_word: τίτλον
  choice: ilani
  rationale: Katika muktadha wa kusulubiwa, neno hili linamaanisha maandishi yaliyowekwa ili yaonekane hadharani. “Ilani” ni ya kawaida na inaeleweka kuliko tafsiri halisi ya “jina la cheo.”
- source_word: πολλοὶ ... τῶν Ἰουδαίων
  choice: Wayahudi wengi
  rationale: Huwatambulisha wasomaji wengi waliokuwa Wayahudi bila kudokeza kwamba Wayahudi wote waliisoma.
- source_word: ἀνέγνωσαν
  choice: waliisoma
  rationale: Hutoa maana ya kawaida ya kusoma bila kuongeza kwamba waliisoma kwa sauti.
- source_word: ἐγγὺς ἦν ὁ τόπος τῆς πόλεως
  choice: mahali ... palikuwa karibu na mji
  rationale: Hufuata maana ya moja kwa moja bila kuongeza habari ya lango la mji isiyopatikana katika Kigiriki.
- source_word: ὅπου ἐσταυρώθη ὁ Ἰησοῦς
  choice: ambapo Yesu alisulubiwa
  rationale: Huhifadhi kauli ya kutendwa ya chanzo bila kumtaja mtendaji.
- source_word: ἦν γεγραμμένον
  choice: ilikuwa imeandikwa
  rationale: Huonyesha hali iliyotokana na tendo lililokamilika la kuandika, kama muundo wa Kigiriki unavyodokeza.
- source_word: Ἑβραϊστί
  choice: kwa Kiebrania
  rationale: Huhifadhi jina la lugha lililo katika matini ya Kigiriki; uwezekano wa Kiaramu unaelezwa katika tanbihi.
- source_word: Ῥωμαϊστί
  choice: Kilatini
  rationale: Ingawa maana ya karibu ni “kwa Kirumi,” lugha inayorejelewa ni Kilatini.
- source_word: Ἑλληνιστί
  choice: Kigiriki
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja ya kielezi hiki cha lugha.
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Huendeleza uhusiano wa kimantiki na kisimulizi uliopo na mstari uliotangulia.
theological_decisions:
- issue: Maana ya Ἑβραϊστί katika matumizi ya Yohana
  choice: Kiebrania katika matini kuu
  alternative: Kiaramu
  rationale: Matini ya Kigiriki inasema “Kiebrania,” hivyo hilo limehifadhiwa katika matini kuu. Kwa kuwa neno hilo katika muktadha wa karne ya kwanza huenda likarejelea lugha ya Kisemiti ya mahali hapo, yaani Kiaramu, uwezekano huo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Mpangilio wa sentensi umefanywa kuwa wa kawaida katika Kiswahili huku maana, kauli ya kutendwa na uhusiano wa kisimulizi vikihifadhiwa.
