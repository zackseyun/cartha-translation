base_translation:
  language: en
  yaml_path: translation/nt/john/019/029.yaml
  text: A container full of sour wine was lying there[b][a]; so they put a sponge full of the sour wine on hyssop and brought it to his mouth.
translation:
  language: sw
  text: Chombo kilichojaa divai chachu[a] kilikuwa hapo. Basi wakafunga sifongo iliyojaa divai hiyo chachu kwenye hisopo[b], wakaipeleka kinywani mwake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “siki.” Neno la Kigiriki linaweza kumaanisha divai chachu au siki; hapa huenda linarejelea kinywaji cha divai chachu kilichopatikana kwa askari.
    reason: lexical_alternative
  - marker: b
    text: Au, “juu ya tawi la hisopo” au “kwa hisopo.” Kigiriki kinasema tu “kwenye/kwa hisopo,” na namna hasa sifongo hiyo ilivyoshikizwa au kutumiwa haijulikani kwa uhakika.
    reason: lexical_alternative
lexical_decisions:
- source_word: σκεῦος
  choice: chombo
  rationale: Neno la jumla linalomaanisha chombo au kitu cha kuhifadhia; “chombo” ni la kawaida na halibainishi bila msingi kama kilikuwa mtungi au bakuli.
- source_word: ἔκειτο
  choice: kulikuwa na
  rationale: Huwasilisha kwa Kiswahili hali ya chombo kuwapo mahali pale bila kulazimisha picha isiyo ya kawaida ya kwamba kilikuwa kimelala.
- source_word: ὄξους
  choice: divai chachu
  rationale: Katika muktadha huu neno linaweza kumaanisha divai iliyochacha sana iliyotumiwa kama kinywaji cha bei nafuu; tafsiri hii inaeleweka kama kitu cha kunywa huku tanbihi ikihifadhi uwezekano wa “siki.”
- source_word: μεστόν
  choice: kilichojaa / iliyojaa
  rationale: Huhifadhi urudiaji wa wazo la kujaa kwa chombo na kwa sifongo kwa lugha ya kawaida ya Kiswahili.
- source_word: σπόγγον
  choice: sifongo
  rationale: Ni kisawe cha moja kwa moja na kinachoeleweka katika Kiswahili cha sasa.
- source_word: οὖν
  choice: basi
  rationale: Huonyesha hatua inayofuata au matokeo katika simulizi kwa mtindo wa kawaida na wenye hadhi.
- source_word: ὑσσώπῳ
  choice: kwenye hisopo
  rationale: Hukaa karibu na muundo wa Kigiriki, ambao unaweza kuonyesha kushikizwa juu ya hisopo au kutumiwa kwa hisopo, bila kuongeza waziwazi neno “tawi” lisilokuwamo katika matini.
- source_word: περιθέντες
  choice: wakatia
  rationale: Huwasilisha kitendo kilichotangulia cha kuiweka sifongo kwenye hisopo kwa mfuatano wa kawaida wa simulizi la Kiswahili.
- source_word: προσήνεγκαν
  choice: wakaipeleka
  rationale: Kitenzi kina maana ya kuleta au kusogeza kitu kwa mwingine; “wakaipeleka” kinafaa kwa mwendo wa sifongo kuelekea kinywani.
- source_word: αὐτοῦ τῷ στόματι
  choice: kinywani mwake
  rationale: Ni usemi wa asili wa Kiswahili unaohifadhi kiwakilishi cha nafsi bila kurudia jina la Yesu.
theological_decisions:
- issue: Mwangwi wa kihistoria na wa ibada katika ὑσσώπῳ
  choice: Kuhifadhi “hisopo” katika matini kuu bila kufafanua ishara yake.
  alternative: Kutafsiri kwa ufafanuzi zaidi kuwa “tawi la hisopo,” au kulifanya kuwa “fimbo/mwanzi.”
  rationale: Neno hilo linaweza kuamsha mawazo ya Pasaka au utakaso, lakini mstari wenyewe hausemi hivyo moja kwa moja. Kulihifadhi hudumisha uwezekano huo wa kitheolojia bila kuingiza tafsiri ya kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo umegawanywa katika sentensi mbili kwa usomaji wa asili. Alama zote za tanbihi zimetumiwa katika matini kuu, na utata wa ὄξος pamoja na ὑσσώπῳ umehifadhiwa.
