base_translation:
  language: en
  yaml_path: translation/nt/john/019/003.yaml
  text: And they came up to him and said[a], “Hail[b], King of the Jews!” And they were slapping him.
translation:
  language: sw
  text: Nao walikuwa wakimjia na kumwambia[a], “Salamu, Mfalme wa Wayahudi!” Nao walikuwa wakimpiga kwa makofi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “waliendelea kumjia na kumwambia,” kwa kuwa vitenzi vya Kigiriki vinaweza kuonyesha matendo yaliyoendelea au kurudiwa.
    reason: lexical_alternative
  - marker: b
    text: Kigiriki kwa maana halisi ni “walikuwa wakimpa mapigo”; ῥαπίσματα humaanisha makofi au mapigo, mara nyingi ya kiganja.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρχοντο πρὸς αὐτὸν
  choice: wakawa wakimjia
  rationale: Vitenzi vya hali isiyotimilika vinaonyesha tendo lililoendelea au lililorudiwa; ‘wakawa wakimjia’ huhifadhi mwendo wa kumkaribia Yesu na hali hiyo ya kurudia.
- source_word: ἔλεγον
  choice: na kusema
  rationale: Muundo huu unaunganishwa na ‘wakawa wakimjia’ na kudokeza kuwa walikuwa wakirudia maneno hayo bila kufanya Kiswahili kuwa kizito.
- source_word: Χαῖρε
  choice: Salamu
  rationale: Katika muktadha huu ni salamu rasmi ya kumkejeli kama mfalme. ‘Salamu’ ni ya asili katika Kiswahili na inaweza kubeba kejeli inayodhihirishwa na muktadha.
- source_word: ὁ βασιλεὺς τῶν Ἰουδαίων
  choice: Mfalme wa Wayahudi
  rationale: Hutoa cheo hiki moja kwa moja na kuhifadhi maana yake ya kisiasa na ya Kimasihi katika simulizi.
- source_word: ἐδίδοσαν αὐτῷ ῥαπίσματα
  choice: wakawa wakimpiga makofi
  rationale: ῥαπίσματα ni mapigo ya kiganja au makofi, na kitenzi cha hali isiyotimilika kinaonyesha kupigwa kulikoendelea au kulikorudiwa.
theological_decisions:
- issue: Sauti ya salamu waliompa Yesu
  choice: Salamu ya kifalme inayotumiwa kwa kejeli
  alternative: Salamu ya kawaida isiyoonyesha kejeli
  rationale: Muktadha wa mateso na matendo yao unaonyesha dhihaka; tafsiri inahifadhi namna rasmi ya salamu bila kuongeza maelezo ndani ya mstari.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Wakawa wakimjia’ na ‘wakawa wakimpiga’ huhifadhi hali ya matendo yanayoendelea au kurudiwa, huku ‘Salamu’ ikitoa salamu rasmi ya kejeli kwa njia inayoeleweka kwa wasomaji wa kawaida.
