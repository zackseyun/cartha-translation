  text: 'Kwa maana mambo haya yalitokea ili Andiko litimizwe: “Hakuna mfupa wake hata mmoja utakaovunjwa.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kigiriki: “Mfupa wake hautavunjwa.” Neno “mfupa” liko katika umoja, lakini katika dondoo hii lina maana ya jumla; kwa Kiswahili limetolewa kwa kawaida kama “Hakuna mfupa wake hata mmoja utakaovunjwa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: yalitokea
  rationale: Kitenzi hiki kinaeleza kutukia kwa mambo yaliyosimuliwa; “yalitokea” ni Kiswahili cha kawaida na cha sasa.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Kiunganishi hiki kinatoa sababu au maelezo ya kauli iliyotangulia.
- source_word: ταῦτα
  choice: mambo haya
  rationale: Kiwakilishi hiki cha wingi kinarejelea matukio yaliyotangulia, na “mambo haya” ni usemi wa asili katika Kiswahili.
- source_word: ἵνα
  choice: ili
  rationale: “Ili” inaonyesha kusudi au matokeo yanayohusiana na kutimizwa kwa Andiko.
- source_word: ἡ γραφή
  choice: Andiko
  rationale: Katika muktadha huu neno hilo linamaanisha Andiko takatifu lililonukuliwa; herufi kubwa inaonyesha matumizi hayo maalumu.
- source_word: πληρωθῇ
  choice: litimizwe
  rationale: Huhifadhi hali ya kutendwa na wazo la Andiko kufikia utimilifu wake.
- source_word: Ὀστοῦν
  choice: mfupa
  rationale: Neno la Kigiriki liko katika umoja, lakini katika dondoo hii lina maana ya jumla kuhusu mifupa yake.
- source_word: οὐ συντριβήσεται
  choice: utakaovunjwa
  rationale: Katika muktadha wa mfupa, “kuvunjwa” ndilo neno la kawaida na linalofaa kuliko “kupondwa” au “kusagwa.”
- source_word: αὐτοῦ
  choice: wake
  rationale: Umilikishi huu wa Kiswahili unawakilisha kwa kawaida maana ya ‘wa yeye’.
theological_decisions:
- issue: Kutafsiri umoja wa “mfupa” katika dondoo ya Maandiko huku ikidokeza kwamba hakuna mfupa wowote utakaovunjwa
  choice: Hakuna hata mfupa wake mmoja utakaovunjwa
  alternative: Mfupa wake hautavunjwa
  rationale: Muundo uliochaguliwa ni wa kawaida katika Kiswahili na unaonyesha wazi maana ya jumla ya umoja wa Kigiriki bila kuongeza dai jipya. Pia unadumisha uhusiano wa dondoo na Kutoka 12:46, Hesabu 9:12, na Zaburi 34:20.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi inahifadhi uhusiano wa sababu, kusudi la kutimizwa kwa Andiko, na dondoo katika lugha inayoeleweka kwa urahisi.
