source:
  edition: SBLGNT
  text: ἀλλ’ εἷς τῶν στρατιωτῶν λόγχῃ αὐτοῦ τὴν πλευρὰν ἔνυξεν, καὶ ⸂ἐξῆλθεν εὐθὺς⸃ αἷμα καὶ ὕδωρ.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/034.yaml
  text: But one of the soldiers pierced his side with a spear[b][a], and immediately blood and water came out.
translation:
  language: sw
  text: Lakini mmoja wa askari alimtoboa ubavuni kwa mkuki[a], na mara damu na maji vikatoka.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa fumo.”
    reason: lexical_alternative
  - marker: b
    text: Baadhi ya wafafanuzi huelewa “damu na maji” kwa maana ya kiishara au ya kisakramenti; wengine huona kuwa ni maelezo ya tukio la kimwili. Matini ya Kigiriki yenyewe haielezi umuhimu wake hapa.
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλ’
  choice: Lakini
  rationale: Inaonyesha tofauti na taarifa iliyotangulia kwamba miguu ya Yesu haikuvunjwa, huku ikibaki ya kawaida na wazi katika Kiswahili.
- source_word: εἷς τῶν στρατιωτῶν
  choice: mmoja wa askari
  rationale: Inahifadhi wazi muundo wa Kigiriki unaomaanisha mmoja kutoka katika kundi la askari.
- source_word: λόγχῃ
  choice: kwa mkuki
  rationale: Mkuki ni neno la kawaida na linaloeleweka kwa silaha yenye ncha iliyotumiwa kutoboa; pia linaweza kujumuisha maana ya lance.
- source_word: αὐτοῦ τὴν πλευρὰν
  choice: alimtoboa ubavuni
  rationale: Kiambishi cha yambwa kinamrejelea Yesu, na 'ubavuni' huwasilisha kwa kawaida eneo la upande wa mwili bila kulibainisha kupita maandishi ya Kigiriki.
- source_word: ἔνυξεν
  choice: alimtoboa
  rationale: Kitenzi kinaonyesha kutoboa kwa chombo chenye ncha; 'kutoboa' ni sahihi, cha kawaida, na chenye hadhi katika simulizi hili.
- source_word: καὶ ⸂ἐξῆλθεν εὐθὺς⸃
  choice: na mara ... vikatoka
  rationale: '''Na'' huhifadhi mwendelezo wa tukio, ''mara'' huonyesha utendaji wa papo hapo wa εὐθύς, na ngeli ya wingi katika Kiswahili hufuata kiima ambatani ''damu na maji''.'
- source_word: αἷμα καὶ ὕδωρ
  choice: damu na maji
  rationale: Tafsiri ya moja kwa moja huhifadhi usemi usio wa kawaida bila kuongeza ufafanuzi wa kitabibu, wa kiishara, au wa kisakramenti.
theological_decisions:
- issue: Kama 'damu na maji' zifasiriwe kiishara, kisakramenti, au kitabibu katika matini kuu
  choice: Kuhifadhi usemi halisi 'damu na maji' bila ufafanuzi wa maana yake
  alternative: Kuufafanua kuwa dokezo la kisakramenti au maelezo ya kimwili ya jeraha
  rationale: Aya yenyewe inasimulia yaliyotoka lakini haielezi umuhimu wake. Tafsiri inahifadhi utata na mvutano wa kiteolojia badala ya kuingiza mapokeo fulani katika matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo 'alimtoboa ubavuni' ni wa asili kuliko tafsiri nzito ya neno kwa neno, huku ukihifadhi mhusika, tendo, na eneo la jeraha. Alama zote za tanbihi zimewekwa katika matini kuu.
