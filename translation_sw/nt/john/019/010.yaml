  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: λέγει οὖν αὐτῷ ὁ Πιλᾶτος· Ἐμοὶ οὐ λαλεῖς; οὐκ οἶδας ὅτι ἐξουσίαν ἔχω ⸂ἀπολῦσαί σε καὶ ἐξουσίαν ἔχω σταυρῶσαί⸃ σε;
base_translation:
  language: en
  yaml_path: translation/nt/john/019/010.yaml
  text: So Pilate said to him[a], “Will you not speak to me? Do you not know that I have authority to release you and authority to crucify you?”
translation:
  language: sw
  text: Basi Pilato akamwambia, “Husemi nami? Hujui kwamba nina mamlaka ya kukuachilia, na nina mamlaka ya kukusulubisha?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει οὖν αὐτῷ ὁ Πιλᾶτος
  choice: Basi Pilato akamwambia
  rationale: “Basi” linaendeleza simulizi kwa uasilia, na “akamwambia” linawakilisha kitenzi pamoja na yambwa dative αὐτῷ katika Kiswahili sanifu.
- source_word: Ἐμοὶ οὐ λαλεῖς
  choice: Husemi nami?
  rationale: “Nami” linabeba mkazo wa Ἐμοὶ iliyotangulizwa, huku swali fupi likihifadhi sauti ya Pilato ya kukemea na kushangaa.
- source_word: οὐκ οἶδας ὅτι
  choice: Hujui kwamba
  rationale: Tafsiri ya moja kwa moja na ya kawaida ya swali la balagha linalotanguliza dai la Pilato.
- source_word: ἐξουσίαν ἔχω
  choice: nina mamlaka
  rationale: “Mamlaka” linafaa zaidi kuliko “nguvu” katika muktadha wa kisheria na kiutawala, bila kudai kwamba mamlaka hiyo ni huru au ya mwisho.
- source_word: ἀπολῦσαί σε
  choice: ya kukuachilia
  rationale: Katika muktadha wa kesi, “kukuachilia” humaanisha kumweka huru chini ya uamuzi wa mtawala bila kuongeza wazo la kutangazwa kuwa hana hatia.
- source_word: καὶ ἐξουσίαν ἔχω σταυρῶσαί σε
  choice: na nina mamlaka ya kukusulubisha
  rationale: Kurudia “nina mamlaka” kunahifadhi msisitizo wa Kigiriki na utofautishaji wa matokeo mawili yanayodaiwa na Pilato.
theological_decisions:
- issue: Asili ya ἐξουσία anayodai Pilato
  choice: mamlaka
  alternative: nguvu; haki
  rationale: Aya inaripoti dai la Pilato bila kulithibitisha kuwa mamlaka halali au kamili. “Mamlaka” linahifadhi maana ya kiutawala na mvutano ambao jibu la Yesu katika aya inayofuata litafafanua.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka. Muundo wa maswali unadumisha ukali na majivuno ya Pilato bila kuwa wa kikale.
