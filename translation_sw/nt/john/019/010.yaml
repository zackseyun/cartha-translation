  source_fidelity: 'Tafsiri inawakilisha kwa uaminifu muundo na maana ya Kigiriki: kiunganishi cha simulizi (οὖν), yambwa ya Pilato, swali lenye mkazo wa “kwangu,” na urudiaji wa dai la mamlaka kwa kuachilia au kusulubisha. “Basi Pilato akamwambia” ni utendaji wa kawaida wa present historic katika masimulizi ya Kiswahili.'
