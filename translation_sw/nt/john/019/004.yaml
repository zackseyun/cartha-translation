  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ⸂καὶ ἐξῆλθεν⸃ πάλιν ἔξω ὁ Πιλᾶτος καὶ λέγει αὐτοῖς· Ἴδε ἄγω ὑμῖν αὐτὸν ἔξω, ἵνα γνῶτε ὅτι ⸂οὐδεμίαν αἰτίαν εὑρίσκω ἐν αὐτῷ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/004.yaml
  text: Then Pilate went outside again and said to them[a], “Look, I am bringing him out to you so that you may know that I find no case against him.”
translation:
  language: sw
  text: Kisha Pilato akatoka tena nje, akawaambia, “Tazama, ninamleta nje kwenu ili mjue kwamba sioni shtaka lolote dhidi yake[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “sioni kosa lolote kwake.” Usemi wa Kigiriki unaweza kutafsiriwa kwa njia hii iliyozoeleka zaidi, lakini hapa huenda una maana mahsusi ya kisheria: Pilato haoni shtaka halali au msingi wa kesi dhidi ya Yesu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν ... ἔξω
  choice: akatoka ... nje
  rationale: Muundo huu unaonyesha wazi mwendo wa Pilato kutoka kwenda nje na unasikika kwa kawaida katika Kiswahili.
- source_word: πάλιν
  choice: tena
  rationale: Neno hili linaonyesha kurudiwa kwa tendo kwa ufupi na kwa kawaida.
- source_word: λέγει
  choice: akawaambia
  rationale: Ingawa Kigiriki kinatumia wakati wa sasa wa kihistoria, wakati uliopita unafaa katika simulizi la Kiswahili; kiambishi cha yambwa kinaonyesha kwamba alisema kwao.
- source_word: Ἴδε
  choice: Tazama
  rationale: Ni neno la kuvuta usikivu, lenye hadhi na linaloeleweka katika Kiswahili cha sasa.
- source_word: ἄγω ... αὐτὸν ἔξω
  choice: ninamleta nje kwenu
  rationale: Katika mazingira haya Pilato anamtoa Yesu na kumleta mbele ya watu; usemi huu unaonyesha tendo linaloendelea na mwelekeo wake kwao.
- source_word: ἵνα γνῶτε
  choice: ili mjue
  rationale: Huhifadhi wazi kusudi linaloonyeshwa na ἵνα pamoja na hali tegemezi ya kitenzi.
- source_word: οὐδεμίαν αἰτίαν
  choice: shtaka lolote
  rationale: Katika mazingira ya hukumu, αἰτία lina maana ya kisheria ya shtaka au msingi wa mashtaka, si kosa la jumla tu.
- source_word: εὑρίσκω ἐν αὐτῷ
  choice: sioni ... dhidi yake
  rationale: Ingawa kitenzi kwa msingi ni ‘napata,’ katika tamko la kisheria Kiswahili cha kawaida husema ‘sioni shtaka dhidi yake,’ kikihifadhi maana ya tathmini ya Pilato.
theological_decisions:
- issue: Maneno ya kisheria katika tamko la Pilato kuhusu kutokuwa na hatia kwa Yesu
  choice: sioni shtaka lolote dhidi yake
  alternative: sioni kosa lolote kwake
  rationale: Chaguo hili linatanguliza mazingira ya kesi na tathmini ya Pilato bila kugeuza mstari wenyewe kuwa tamko pana zaidi la kiteolojia. Tafsiri mbadala ya jadi imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ya moja kwa moja imetumiwa kwa urahisi wa kuelewa, huku mazingira ya kisheria na tamko la Pilato yakihifadhiwa.
