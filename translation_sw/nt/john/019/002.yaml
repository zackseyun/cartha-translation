  yaml_path: translation/nt/john/019/002.yaml
  text: And the soldiers, after weaving a crown out of thorns, put it on his head and clothed him in a purple robe,
translation:
  language: sw
  text: Nao askari, baada ya kusuka taji la miiba, wakaliweka kichwani mwake na kumvika vazi la zambarau.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στρατιῶται
  choice: askari
  rationale: Neno la kawaida na sahihi kwa wanajeshi wa Roma katika muktadha huu.
- source_word: πλέξαντες
  choice: baada ya kusokota
  rationale: Kitenzi kishirikishi cha wakati uliopita kinaonyesha tendo lililotangulia tendo kuu; ‘baada ya kusokota’ ni Kiswahili cha asili na hudumisha mfuatano huo.
- source_word: στέφανον ἐξ ἀκανθῶν
  choice: taji la miiba
  rationale: ‘Taji’ hudumisha taswira ya kifalme, na ‘la miiba’ ni usemi wa kawaida wa Kiswahili unaoonyesha kitu kilichotengenezwa kwa miiba.
- source_word: ἐπέθηκαν αὐτοῦ τῇ κεφαλῇ
  choice: wakaliweka kichwani mwake
  rationale: Hii ni tafsiri ya kawaida ya Kiswahili ya kuweka taji juu ya kichwa chake, huku kiwakilishi ‘-li-’ kikirejelea taji.
- source_word: ἱμάτιον
  choice: vazi
  rationale: Neno hili hudumisha upana wa maana ya ἱμάτιον kama nguo bila kuibainisha kupita kiasi kuwa joho au koti.
- source_word: πορφυροῦν
  choice: la zambarau
  rationale: Hutoa rangi moja kwa moja na kudumisha dokezo la kifalme lililopo katika muktadha.
- source_word: περιέβαλον αὐτόν
  choice: kumvika
  rationale: Katika muktadha wa vazi, περιβάλλω inaweza kumaanisha kumvika au kumfunika; ‘kumvika’ ni ya asili na inaeleweka wazi.
theological_decisions:
- issue: Taswira ya kumfanya Yesu aonekane kama mfalme kwa dhihaka
  choice: Kusimulia matendo moja kwa moja kwa maneno ‘taji’ na ‘vazi la zambarau’ bila kuongeza maelezo ya dhihaka.
  alternative: Kuongeza maneno kama ‘kwa dhihaka’ au ‘ili kumdhihaki kama mfalme.’
  rationale: Andiko lenyewe linasimulia matendo hayo bila kufafanua nia yao katika mstari huu; taswira ya kifalme inaonekana kupitia taji na rangi ya zambarau.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo umesawazisha uaminifu kwa Kigiriki na mtiririko wa asili wa Kiswahili.
