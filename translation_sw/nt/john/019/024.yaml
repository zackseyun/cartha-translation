  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἶπαν οὖν πρὸς ἀλλήλους· Μὴ σχίσωμεν αὐτόν, ἀλλὰ λάχωμεν περὶ αὐτοῦ τίνος ἔσται· ἵνα ἡ γραφὴ πληρωθῇ ⸂ἡ λέγουσα⸃· Διεμερίσαντο τὰ ἱμάτιά μου ἑαυτοῖς καὶ ἐπὶ τὸν ἱματισμόν μου ἔβαλον κλῆρον. Οἱ μὲν οὖν στρατιῶται ταῦτα ἐποίησαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/024.yaml
  text: So they said to one another[a], “Let us not tear it, but cast lots for it to decide whose it will be,” so that the Scripture might be fulfilled that says, “They divided my garments among themselves[b], and for my clothing they cast a lot.” So the soldiers did these things.
translation:
  language: sw
  text: Kwa hiyo wakasema wao kwa wao, “Tusilirarue, bali tupige kura kuhusu hilo ili tuamue litakuwa la nani.” Ili Andiko litimizwe, lile lisemalo, “Waligawana mavazi yangu wao kwa wao, na kuhusu vazi langu wakapiga kura.”[b] Basi askari wakafanya mambo haya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Maneno haya yamenukuliwa kutoka Zaburi 22:18.
    reason: cross_reference
lexical_decisions:
- source_word: σχίσωμεν
  choice: tusiirarue
  rationale: Kitenzi hiki humaanisha kurarua au kupasua. ‘Kurarua’ ni neno la kawaida na la asili kwa kitambaa au vazi.
- source_word: αὐτόν
  choice: -i- katika ‘tusiirarue’
  rationale: Ingawa kiwakilishi cha Kigiriki ni cha kiume kisarufi, kinarejelea vazi lililotajwa katika muktadha; Kiswahili hutumia upatanisho wa ngeli wa kitu hicho.
- source_word: λάχωμεν
  choice: tuipigie kura
  rationale: Kifungu hiki kinaeleza kutumia kura kuamua umiliki. ‘Kupigia kura’ ni usemi unaoeleweka katika Kiswahili, huku tanbihi ikifafanua kuwa si uchaguzi wa kawaida.
- source_word: περὶ αὐτοῦ τίνος ἔσται
  choice: ili tujue itakuwa ya nani
  rationale: Maneno haya yanaeleza kusudi la kura—kuamua ni nani atakayepata vazi—kwa Kiswahili cha kawaida bila kubadili maana.
- source_word: ἵνα ἡ γραφὴ πληρωθῇ
  choice: Hii ilikuwa ili Andiko litimizwe
  rationale: Tafsiri hii inahifadhi muundo wa Yohana wa kutimizwa kwa Andiko na pia kusudi linaloonyeshwa na ἵνα bila kufafanua zaidi uhusiano wa kusudi la Mungu na tendo la wanadamu.
- source_word: ἡ γραφή
  choice: Andiko
  rationale: Umoja wa Kigiriki unarejelea kifungu mahususi cha Maandiko kinachonukuliwa, hivyo ‘Andiko’ huhifadhi umoja huo.
- source_word: ἡ λέγουσα
  choice: linalosema
  rationale: Huu ni usemi wa kawaida unaolitambulisha Andiko linalofuata.
- source_word: Διεμερίσαντο
  choice: Waligawana
  rationale: Kitenzi kina maana ya kugawa vitu miongoni mwa watu; ‘waligawana’ huonyesha wazi kwamba walivigawa wao kwa wao.
- source_word: ἱμάτιά
  choice: mavazi
  rationale: Neno la wingi linamaanisha nguo au mavazi; ‘mavazi’ linafaa kwa sajili ya nukuu ya Maandiko.
- source_word: ἑαυτοῖς
  choice: wao kwa wao
  rationale: Kiwakilishi rejeshi kinaonyesha ugawaji miongoni mwa askari wenyewe.
- source_word: ἱματισμόν
  choice: vazi
  rationale: Kigiriki kinatumia neno tofauti na ἱμάτια na liko katika umoja. ‘Vazi’ huhifadhi tofauti hiyo kwa Kiswahili cha asili.
- source_word: ἔβαλον κλῆρον
  choice: wakalipigia kura
  rationale: Kifungu kinamaanisha kwamba walitumia kura kuamua mwenye kulipata vazi; umoja wa κλῆρον unaakisiwa katika wazo la kura hiyo bila kufanya sentensi kuwa ngumu.
theological_decisions:
- issue: Uhusiano kati ya tendo la askari na kutimizwa kwa Andiko katika ἵνα ἡ γραφὴ πληρωθῇ
  choice: Kutafsiri moja kwa moja kuwa jambo hili lilikuwa ili Andiko litimizwe, bila kuongeza maelezo ya jinsi kusudi la Mungu linavyohusiana na uchaguzi wa askari.
  alternative: 'Kutafsiri ἵνα kama matokeo tu: ‘na hivyo Andiko likatimizwa.’'
  rationale: Yohana hutumia mara nyingi muundo huu wa kutimizwa kwa Maandiko. Tafsiri inadumisha dai la kusudi/kutimizwa lililo katika matini, lakini haisuluhishi kwa lazima mvutano kati ya utawala wa Mungu na wajibu wa wanadamu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Wakaambiana’ na ‘basi’ vinadumisha mtiririko wa simulizi; ‘Andiko’ linahifadhi umoja wa Kigiriki na kurejelea kifungu mahususi kinachonukuliwa.
