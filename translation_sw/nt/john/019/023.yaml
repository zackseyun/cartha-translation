  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οἱ οὖν στρατιῶται ὅτε ἐσταύρωσαν τὸν Ἰησοῦν ἔλαβον τὰ ἱμάτια αὐτοῦ καὶ ἐποίησαν τέσσαρα μέρη, ἑκάστῳ στρατιώτῃ μέρος, καὶ τὸν χιτῶνα. ἦν δὲ ὁ χιτὼν ἄραφος, ἐκ τῶν ἄνωθεν ὑφαντὸς δι’ ὅλου·
base_translation:
  language: en
  yaml_path: translation/nt/john/019/023.yaml
  text: So when the soldiers had crucified Jesus[a], they took his outer garments and made four parts, a part for each soldier, and also the tunic. Now the tunic was seamless[c][b], woven from the top throughout.
translation:
  language: sw
  text: Basi, askari walipokwisha kumsulubisha Yesu, walichukua mavazi yake ya nje[a] na kuyagawa katika sehemu nne, sehemu moja kwa kila askari; wakachukua pia kanzu yake. Kanzu hiyo haikuwa na mshono; ilikuwa imefumwa kuanzia juu[b] kwa urefu wake wote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mavazi yake”; neno la Kigiriki linaweza kumaanisha mavazi kwa ujumla, lakini hapa huenda linamaanisha mavazi ya nje kwa kuwa kanzu inatajwa kando.
    reason: lexical_alternative
  - marker: b
    text: Au “kutoka juu.” Katika muktadha huu, maneno hayo yaelekea yanamaanisha kwamba kanzu ilifumwa kuanzia sehemu ya juu ya vazi; usemi unaofuata unaonyesha kwamba ufumaji uliendelea katika vazi lote.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ οὖν στρατιῶται
  choice: Basi, askari
  rationale: οὖν hapa inaendeleza simulizi; “Basi” ni kiunganishi cha kawaida cha Kiswahili kisichosisitiza hitimisho la kimantiki.
- source_word: ὅτε ἐσταύρωσαν τὸν Ἰησοῦν
  choice: walipokwisha kumsulubisha Yesu
  rationale: Muundo huu unaonyesha kwa kawaida kwamba kusulubisha kulitangulia kuchukua na kugawa mavazi.
- source_word: ἔλαβον τὰ ἱμάτια αὐτοῦ
  choice: walichukua mavazi yake ya nje
  rationale: Katika muktadha huu ἱμάτια zinatofautishwa na χιτών inayotajwa peke yake; “mavazi ya nje” hudumisha tofauti hiyo bila kudai kwamba neno hilo huwa na maana hiyo kila mahali.
- source_word: ἐποίησαν τέσσαρα μέρη, ἑκάστῳ στρατιώτῃ μέρος
  choice: na kuyagawa katika sehemu nne, sehemu moja kwa kila askari
  rationale: Ingawa kwa karibu ni “wakafanya sehemu nne,” Kiswahili cha kawaida huhitaji kitenzi “kuyagawa”; kirai kinachofuata kinaeleza kuwa kila askari alipata sehemu moja.
- source_word: καὶ τὸν χιτῶνα
  choice: wakachukua pia kanzu yake
  rationale: χίτων ni vazi lililovaliwa karibu na mwili. “Kanzu” ni neno linaloeleweka katika Kiswahili, na “pia” linaonyesha kuwa vazi hilo linatajwa kando na mavazi mengine.
- source_word: ἦν δὲ ὁ χιτὼν ἄραφος
  choice: Kanzu hiyo haikuwa na mshono
  rationale: ἄραφος humaanisha “isiyoshonwa/isiyo na mshono.” Kauli hii ni wazi na ya asili kuliko istilahi inayoweza kudokeza tu umbo la vazi.
- source_word: ἐκ τῶν ἄνωθεν ὑφαντὸς δι’ ὅλου
  choice: bali ilikuwa imefumwa yote tangu juu
  rationale: “Tangu juu” huhifadhi maana ya mahali ya ἄνωθεν katika muktadha wa utengenezaji wa vazi, na “imefumwa yote” huwasilisha δι’ ὅλου kama ufumaji unaoendelea katika vazi zima.
theological_decisions:
- issue: Uwezekano wa kuipa kanzu isiyo na mshono maana ya mfano
  choice: Kutafsiri maelezo ya kanzu kwa namna ya moja kwa moja bila kuongeza maana ya kiishara
  alternative: Kuitambulisha kama dokezo la mavazi ya ukuhani au ishara ya umoja wa kanisa
  rationale: Aya yenyewe inaeleza jinsi vazi lilivyotengenezwa na hatua za askari; haitamki maana hizo za kiishara.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa na chenye heshima. “Walipokwisha” huweka wazi mfuatano wa matukio; “kanzu” ni rahisi kueleweka kuliko istilahi ya kiufundi ya vazi la kale. Alama zote za tanbihi zimewekwa katika matini kuu.
