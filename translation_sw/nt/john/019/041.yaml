base_translation:
  language: en
  yaml_path: translation/nt/john/019/041.yaml
  text: In the place where he was crucified there was a garden, and in the garden a new tomb, in which no one had yet been laid.
translation:
  language: sw
  text: Mahali aliposulubiwa palikuwa na bustani, na ndani ya bustani hiyo palikuwa na kaburi jipya, ambamo hadi wakati huo mtu yeyote alikuwa bado hajalazwa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: (haikutafsiriwa kwa neno maalumu)
  rationale: Kiunganishi hiki kinaonyesha mpito mdogo wa simulizi. Katika Kiswahili, mtiririko huo unaeleweka kiasili bila kuongeza “basi” au neno la wakati lisilokuwapo katika chanzo.
- source_word: τόπῳ
  choice: mahali
  rationale: “Mahali” ni tafsiri ya kawaida na ya asili ya τόπος katika mazingira haya.
- source_word: ὅπου ἐσταυρώθη
  choice: aliposulubiwa
  rationale: Muundo huu unadumisha kauli tendwa ya Kigiriki bila kuongeza wazi wale waliomsulubisha.
- source_word: κῆπος
  choice: bustani
  rationale: “Bustani” ndilo neno la kawaida la Kiswahili kwa κῆπος; “shamba la matunda” lingekuwa maalumu kupita kiasi.
- source_word: μνημεῖον
  choice: kaburi
  rationale: Katika muktadha wa maziko, “kaburi” linaonyesha mahali pa kuweka mwili na ni neno la kawaida, lenye hadhi katika Kiswahili.
- source_word: καινόν
  choice: jipya
  rationale: Tafsiri hii inadumisha maana ya msingi ya “jipya”; sentensi inayofuata ndiyo inayoeleza kwamba halikuwa limetumiwa.
- source_word: ἐν ᾧ
  choice: ambamo
  rationale: “Ambamo” hurejelea kaburi kwa uwazi na kuonyesha kuwa mtu angewekwa ndani yake.
- source_word: οὐδέπω οὐδεὶς
  choice: bado hakuna mtu
  rationale: Muundo huu unahifadhi maana ya wakati ya οὐδέπω pamoja na ukanushaji wa οὐδεὶς kwa Kiswahili cha kawaida.
- source_word: ἦν τεθειμένος
  choice: aliyekuwa amelazwa
  rationale: Muundo huu unaonyesha hali iliyotokana na tendo lililotangulia. “Amelazwa” linafaa kwa muktadha wa maziko bila kubadili kitenzi kuwa “amezikwa,” jambo ambalo lingeeleza zaidi ya neno la Kigiriki.
theological_decisions:
- issue: Maneno ya muktadha wa maziko kwa μνημεῖον na τεθειμένος
  choice: kaburi ... aliyekuwa amelazwa
  alternative: kaburi ... aliyekuwa amewekwa
  rationale: “Kaburi” na “amelazwa” yanaonyesha wazi mazingira ya maziko, lakini hayaongezi dai kwamba mtu alikuwa tayari “amezikwa,” ambalo lingekuwa maalumu zaidi kuliko chanzo.
- issue: Kauli ya ἐσταυρώθη
  choice: aliposulubiwa
  alternative: walipomsulubisha
  rationale: Kauli tendwa inadumishwa kama ilivyo katika Kigiriki na haiongezi mhusika wa tendo ambaye hakutajwa katika kishazi hiki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, ya heshima, na inayoeleweka kwa wasomaji wa kawaida. Marudio ya “bustani” yamedumishwa kwa uwazi na kwa kufuata muundo wa chanzo.
