  text: ἦλθον οὖν οἱ στρατιῶται, καὶ τοῦ μὲν πρώτου κατέαξαν τὰ σκέλη καὶ τοῦ ἄλλου τοῦ συσταυρωθέντος αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/019/032.yaml
  text: So the soldiers came and broke the legs of the first man[b][a], and of the other who had been crucified with him.
translation:
  language: sw
  text: Basi askari wakaja, wakavunja miguu ya yule wa kwanza, na ya yule mwingine aliyesulubiwa pamoja naye.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika muktadha, “naye” anamrejelea Yesu; kisarufi inaweza pia kueleweka kuwa anamrejelea yule wa kwanza.
    reason: referent_ambiguity
lexical_decisions:
- source_word: οὖν
  choice: Basi
  rationale: Inaendeleza simulizi na kuonyesha kuwa tendo hili lilitokana na agizo lililotajwa katika mstari uliotangulia, kwa Kiswahili cha kawaida na cha hadhi.
- source_word: οἱ στρατιῶται
  choice: askari
  rationale: Ni neno la kawaida na lililo wazi kwa wanajeshi Waroma katika muktadha huu.
- source_word: τοῦ μὲν πρώτου
  choice: ya yule wa kwanza
  rationale: Kigiriki kinasema kihalisi ‘wa kwanza’ bila kutaja tena ‘mtu’; Kiswahili kinaweza kuacha jina hilo likieleweka kwa kawaida kutokana na muktadha.
- source_word: κατέαξαν τὰ σκέλη
  choice: wakavunja miguu
  rationale: ‘Kuvunja miguu’ ni tafsiri ya moja kwa moja na ya kawaida ya kitendo kilichotajwa; kiambishi ‘waka-’ kinaonyesha mfululizo wa matendo katika simulizi.
- source_word: τοῦ ἄλλου
  choice: na ya yule mwingine
  rationale: Muundo huu unategemea kitenzi na neno ‘miguu’ vilivyotangulia, kama Kigiriki, lakini unabaki wazi na wa kawaida katika Kiswahili.
- source_word: τοῦ συσταυρωθέντος αὐτῷ
  choice: aliyesulubiwa pamoja naye
  rationale: Kirai hiki kinamtambulisha huyo mwingine kwa kusulubiwa pamoja na mtu anayetajwa kwa kiwakilishi; ‘naye’ huhifadhi kiwakilishi cha Kigiriki badala ya kuingiza jina lisilokuwamo katika mstari.
theological_decisions:
- issue: Mrejelewa wa αὐτῷ (‘naye’)
  choice: Kiwakilishi ‘naye’ kimehifadhiwa katika matini; katika muktadha kinamwelekea Yesu.
  alternative: Kisarufi, kinaweza kueleweka kuwa kinamrejelea yule wa kwanza.
  rationale: Katika simulizi la Yohana, wale wengine wawili wanatambulishwa kwa uhusiano wao na Yesu, ambaye ndiye mhusika mkuu wa tukio. Hata hivyo, kwa kuwa Kigiriki kimetumia kiwakilishi badala ya jina ‘Yesu,’ tafsiri inahifadhi namna hiyo na kueleza mrejelewa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi na chenye hadhi. Muundo wa ‘wakaja, wakavunja’ umetumiwa ili simulizi litiririke kwa kawaida; ellipsisi katika ‘na ya yule mwingine’ huhifadhi ufupi wa Kigiriki bila kupunguza uelewevu.
