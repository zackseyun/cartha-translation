  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἦλθεν δὲ καὶ Νικόδημος, ὁ ἐλθὼν πρὸς ⸀αὐτὸν νυκτὸς τὸ πρῶτον, φέρων ⸀μίγμα σμύρνης καὶ ἀλόης ὡς λίτρας ἑκατόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/039.yaml
  text: Nicodemus also came—the one who had first come to him at night—bringing a mixture of myrrh and aloes[b][a], about a hundred litras.
translation:
  language: sw
  text: Nikodemo pia akaja—yule aliyemjia Yesu usiku hapo awali[a]—akileta mchanganyiko wa manemane na udi, kiasi cha litra mia moja[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “yule aliyemjia Yesu usiku mara ya kwanza”; rejea Yohana 3:1–2.
    reason: cross_reference
  - marker: b
    text: Litra ilikuwa pauni ya Kirumi, yenye uzito wa karibu gramu 327. Litra mia moja zilikuwa takriban kilogramu 32–33.
    reason: cultural_note
lexical_decisions:
- source_word: ἦλθεν δὲ καὶ
  choice: pia akaja
  rationale: δέ ni kiunganishi chepesi, huku καί ikimwongeza Nikodemo kwa wale wanaoshiriki maziko. “Pia akaja” ni ya asili katika Kiswahili na inahifadhi maana hiyo ya nyongeza.
- source_word: Νικόδημος
  choice: Nikodemo
  rationale: Jina limetoholewa kwa umbo linalotumika kwa kawaida katika Kiswahili.
- source_word: ὁ ἐλθὼν πρὸς αὐτὸν νυκτὸς τὸ πρῶτον
  choice: yule aliyekuwa amemjia Yesu usiku hapo awali
  rationale: Kirai hiki kinamtambulisha Nikodemo kwa kurejelea ziara yake katika Yohana 3:1–2. “Hapo awali” linaonyesha rejeleo la wakati uliopita bila kudai kwa lazima kwamba hiyo ilikuwa ziara ya kwanza kati ya ziara kadhaa.
- source_word: φέρων
  choice: akileta
  rationale: Kitenzi-jina cha wakati uliopo kinaeleza tendo lililoandamana na kuja kwake; “akileta” ni usemi wa kawaida na huonyesha hali hiyo.
- source_word: μίγμα σμύρνης καὶ ἀλόης
  choice: mchanganyiko wa manemane na udi
  rationale: μίγμα ni mchanganyiko, σμύρνη ni manemane, na ἀλόη hapa ni kitu chenye harufu nzuri kilichotumiwa katika maandalizi ya maziko; “udi” huepuka kueleweka kama mmea wa kisasa wa aloe vera.
- source_word: ὡς
  choice: kiasi cha
  rationale: Inapotumiwa pamoja na kipimo, ὡς huonyesha ukadiriaji. “Kiasi cha” ni njia ya kawaida ya Kiswahili ya kuonyesha kwamba idadi si kamili kabisa.
- source_word: λίτρας ἑκατόν
  choice: litra mia moja
  rationale: “Litra” huhifadhi kipimo cha kale cha Kirumi bila kukichanganya na pauni au kilogramu za kisasa; ufafanuzi wa thamani yake umetolewa katika tanbihi.
theological_decisions:
- issue: Rejeleo la αὐτόν katika kirai kinachomtambulisha Nikodemo
  choice: “Yesu”
  alternative: “yeye”
  rationale: Muktadha wa simulizi unarejelea wazi ziara ya Nikodemo kwa Yesu katika Yohana 3:1–2. Kutaja “Yesu” huondoa utata usio wa maana katika Kiswahili bila kuongeza fundisho la kiteolojia.
- issue: Maana ya τὸ πρῶτον
  choice: “hapo awali”
  alternative: “mara ya kwanza”
  rationale: Katika muktadha huu kirai kinaweza kueleweka kama “awali/zamani” na si lazima kuhesabu ziara. Tafsiri kuu inahifadhi rejeleo la simulizi, huku maana nyingine inayowezekana ikitajwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima na unaosomeka kwa urahisi. “Manemane” na “udi” ni maneno yanayoeleweka katika muktadha wa manukato ya maziko, na kipimo cha kale kimehifadhiwa huku kikifafanuliwa katika tanbihi.
