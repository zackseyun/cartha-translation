  yaml_path: translation/nt/john/019/018.yaml
  text: where they crucified him[a], and with him two others, one on each side, and Jesus in the middle.
translation:
  language: sw
  text: Hapo walimsulubisha, na pamoja naye watu wengine wawili, mmoja upande huu na mwingine upande ule, naye Yesu katikati.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅπου
  choice: Hapo
  rationale: Kielezi hiki cha mahali kinaunganisha moja kwa moja na mahali palipotajwa katika muktadha; “Hapo” ni cha asili na sahihi katika Kiswahili.
- source_word: ἐσταύρωσαν
  choice: walimsulubisha
  rationale: Kitenzi hiki katika simulizi la mateso kinamaanisha kumuua kwa kumsulubisha; tafsiri haiongezi maelezo yasiyotajwa kuhusu namna ya kumfunga kwenye msalaba.
- source_word: μετ’ αὐτοῦ
  choice: pamoja naye
  rationale: μετά pamoja na hali ya umilikishi huonyesha uandamani; “pamoja naye” ni wazi na ya kawaida.
- source_word: ἄλλους δύο
  choice: watu wengine wawili
  rationale: Kigiriki kinasema kihalisi “wengine wawili” bila nomino, lakini Kiswahili huhitaji mtajo wa asili ili sentensi isikike kamili; “watu” haiongezi utambulisho maalumu zaidi ya muktadha.
- source_word: ἐντεῦθεν καὶ ἐντεῦθεν
  choice: mmoja upande huu na mwingine upande ule
  rationale: Jozi hii ya vielezi inaonyesha kwamba hao wawili waliwekwa pande mbili tofauti; usemi huu huhifadhi mgawanyo huo waziwazi.
- source_word: μέσον
  choice: katikati
  rationale: Neno hili linaonyesha mahali pa kati. “Katikati” huhifadhi picha ya nafasi bila kulazimika kuongeza kirai “yao.”
- source_word: δὲ
  choice: naye
  rationale: δέ hapa ni kiunganishi chepesi, si upinzani mkali; “naye” huunganisha kwa asili huku ikimwelekeza msomaji kwa Yesu.
- source_word: τὸν Ἰησοῦν
  choice: Yesu
  rationale: Jina linamtaja Yesu kuwa yule aliyewekwa katika nafasi ya kati; mpangilio wa Kiswahili unawasilisha hilo kwa uwazi.
theological_decisions:
- issue: Iwapo kuweka wazi kwamba Yesu alikuwa kati ya wale wengine wawili
  choice: mmoja upande huu na mwingine upande ule, naye Yesu katikati
  alternative: Yesu akiwa katikati yao
  rationale: Kigiriki hutaja kwanza nafasi za pande mbili na kisha Yesu kuwa katikati. Tafsiri iliyochaguliwa huhifadhi mpangilio na taswira hiyo bila kubadili sentensi kuwa maelezo yaliyofupishwa zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa kawaida kwa wasomaji wengi, huku ukihifadhi urudiaji wa kimakusudi wa nafasi katika Kigiriki.
