  text: Basi akamkabidhi kwao ili asulubiwe.[a] Basi wakamchukua Yesu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akamkabidhi kwao asulubiwe.” Muundo wa Kigiriki unaonyesha kusudi na unaweza pia kutafsiriwa kwa ufupi zaidi.
    reason: lexical_alternative
  - marker: b
    text: Aya hii haiwataji kwa jina wale wanaorejelewa na “kwao” wala kiima cha “wakamchukua”; muktadha wa karibu humsaidia msomaji kuwatambua.
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: ndipo
  rationale: Inaonyesha hatua inayofuata katika simulizi kwa njia ya asili katika Kiswahili.
- source_word: οὖν
  choice: basi / kwa hiyo
  rationale: Chembe hii inaunganisha matukio kwa maana ya matokeo au mwendelezo. Muundo wa kwanza unaunganisha ‘basi’ na ‘ndipo’; katika sentensi ya pili ‘kwa hiyo’ inawakilisha οὖν ya pili iliyo katika maandishi ya SBLGNT.
- source_word: παρέδωκεν
  choice: akamkabidhi
  rationale: ‘Kumkabidhi’ huonyesha kumweka mtu chini ya mamlaka au udhibiti wa wengine, na inafaa katika muktadha wa uamuzi wa kisheria.
- source_word: αὐτὸν αὐτοῖς
  choice: akamkabidhi kwao
  rationale: Viwakilishi vinadumishwa bila kutaja wazi kundi ambalo Kigiriki hakilitaji katika aya hii.
- source_word: ἵνα σταυρωθῇ
  choice: ili asulubiwe
  rationale: ‘Ili’ huhifadhi maana ya kusudi ya ἵνα, huku ‘asulubiwe’ ikidumisha hali ya kutendwa.
- source_word: Παρέλαβον
  choice: wakamchukua
  rationale: Katika muktadha huu neno lina maana ya kumchukua au kumweka chini ya uangalizi; ‘wakamchukua’ ni wazi na ya kawaida.
- source_word: Ἰησοῦν
  choice: Yesu
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
theological_decisions:
- issue: Marejeo ya ‘kwao’ na kiima cha ‘wakamchukua’
  choice: Kudumisha viwakilishi visivyotaja kundi wazi katika matini kuu.
  alternative: Kutaja makuhani wakuu na maofisa wao, Wayahudi, au askari Waroma.
  rationale: Kigiriki cha aya hii hakitambulishi kundi hilo kwa jina. Kulitaja kungeondoa kwa tafsiri uwazi wenye mipaka ambao matini yenyewe imeuacha.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa simulizi la kawaida; viwakilishi vya Kigiriki vimeachwa bila kufafanuliwa kupita matini.
