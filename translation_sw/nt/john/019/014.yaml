  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἦν δὲ παρασκευὴ τοῦ πάσχα, ὥρα ⸂ἦν ὡς⸃ ἕκτη. καὶ λέγει τοῖς Ἰουδαίοις· Ἴδε ὁ βασιλεὺς ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/014.yaml
  text: It was the day of preparation of the Passover[a]; it was about the sixth hour. And he says to the Jews, “Behold[b], your king!”
translation:
  language: sw
  text: Ilikuwa siku ya Maandalizi ya Pasaka; ilikuwa karibu saa sita.[a] Naye akawaambia Wayahudi, “Tazameni, mfalme wenu!”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaweza kumaanisha karibu adhuhuri katika hesabu ya saa ya Kiyahudi; namna ya kuhesabu saa katika muktadha huu hujadiliwa.
    reason: cultural_note
  - marker: b
    text: Katika muktadha huu, “Wayahudi” huenda ikawalenga hasa wenye mamlaka wa Uyahudi au viongozi wa Wayahudi.
    reason: alternative_reading
lexical_decisions:
- source_word: παρασκευὴ τοῦ πάσχα
  choice: siku ya Maandalizi ya Pasaka
  rationale: “Siku ya Maandalizi” huonyesha matumizi ya παρασκευή kama jina la siku ya maandalizi kabla ya Sabato au sikukuu, huku “ya Pasaka” ikihifadhi uhusiano wa kijenitivi bila kuamua zaidi maana yake.
- source_word: ὥρα ἦν ὡς ἕκτη
  choice: ilikuwa karibu saa sita
  rationale: Huhifadhi namna ya kale ya kutaja wakati na pia ukadiriaji unaoonyeshwa na ὡς. Kwa kawaida hii hueleweka kuwa karibu adhuhuri, lakini hesabu ya saa haifafanuliwi ndani ya mstari.
- source_word: λέγει
  choice: akawaambia
  rationale: Ingawa Kigiriki kinatumia wakati uliopo wa kihistoria, wakati uliopita wa kisimulizi ni wa asili zaidi katika Kiswahili. Kiambishi cha wingi kinaendana na walengwa τοῖς Ἰουδαίοις.
- source_word: τοῖς Ἰουδαίοις
  choice: Wayahudi
  rationale: Ni tafsiri ya moja kwa moja ya neno la chanzo; mstari wenyewe hauwabainishi kuwa viongozi pekee.
- source_word: Ἴδε
  choice: Tazameni
  rationale: Amri ya wingi ni ya asili kwa kuwa Pilato anawahutubia watu wengi, na huhifadhi nguvu ya tamko la kuwaelekeza waangalie.
- source_word: ὁ βασιλεὺς ὑμῶν
  choice: mfalme wenu
  rationale: Huhifadhi umilikishi na nguvu ya kisiasa na ya kejeli ya kauli ya Pilato.
theological_decisions:
- issue: Rejeo la τοῖς Ἰουδαίοις katika Injili ya Yohana
  choice: Wayahudi
  alternative: viongozi wa Wayahudi; Wayudea
  rationale: Tafsiri kuu haibani rejeo kuliko Kigiriki; uwezekano kwamba muktadha unawalenga hasa viongozi wa Kiyahudi umeelezwa katika tanbihi.
- issue: Namna ya kuhesabu “saa sita”
  choice: kuhifadhi usemi wa kale “karibu saa sita”
  alternative: karibu adhuhuri
  rationale: Hii huhifadhi ukadiriaji na namna ya chanzo ya kutaja wakati bila kutatua kimya kimya mjadala wa mpangilio wa saa.
- issue: Uhusiano wa “Maandalizi” na “Pasaka”
  choice: siku ya Maandalizi ya Pasaka
  alternative: siku ya maandalizi kwa ajili ya Pasaka
  rationale: Kijenitivi τοῦ πάσχα kinaweza kueleweka kwa zaidi ya namna moja; usemi mfupi wa “ya Pasaka” huhifadhi uhusiano huo bila kuufafanua kupita kiasi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Maandalizi” limeandikwa kwa herufi kubwa kuonyesha matumizi yake kama jina la siku. “Saa sita” limehifadhiwa kama namna ya kale ya kuhesabu saa; kwa hesabu iliyozoeleka ya kuanzia mapambazuko, ni karibu adhuhuri.
