  text: Οἱ οὖν Ἰουδαῖοι, ⸂ἐπεὶ παρασκευὴ ἦν, ἵνα μὴ μείνῃ ἐπὶ τοῦ σταυροῦ τὰ σώματα ἐν τῷ σαββάτῳ⸃, ἦν γὰρ μεγάλη ἡ ἡμέρα ἐκείνου τοῦ σαββάτου, ἠρώτησαν τὸν Πιλᾶτον ἵνα κατεαγῶσιν αὐτῶν τὰ σκέλη καὶ ἀρθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/031.yaml
  text: Therefore the Jews[a], because it was the day of preparation[d][c][b], asked Pilate that the bodies might not remain on the cross on the Sabbath—for that Sabbath day was a great one—and that their legs might be broken and they might be taken away.
translation:
  language: sw
  text: Kwa hiyo, Wayahudi[a], kwa kuwa ilikuwa Siku ya Maandalizi[b], walimwomba Pilato kwamba miili isibaki misalabani siku ya Sabato—kwa maana Sabato hiyo ilikuwa ya umuhimu wa pekee[c]—na kwamba miguu yao ivunjwe, na miili iondolewe[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika baadhi ya miktadha ya Injili ya Yohana, “Wayahudi” inaweza kumaanisha hasa viongozi wa Kiyahudi au wenye mamlaka.
    reason: alternative_reading
  - marker: b
    text: Yaani, siku ya kujiandaa kabla ya Sabato; pia yaweza kuitwa “siku ya maandalizi.”
    reason: lexical_alternative
  - marker: c
    text: Yaani, Sabato hiyo ilikuwa ya umuhimu wa pekee.
    reason: meaning_clarification
  - marker: d
    text: Au, “miili ishushwe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ οὖν Ἰουδαῖοι
  choice: Kwa hiyo Wayahudi
  rationale: οὖν inaonyesha matokeo au mwendelezo; “Kwa hiyo” inafaa hapa. Ἰουδαῖοι imetafsiriwa kwa namna isiyobana maana kuwa viongozi pekee, huku uwezekano huo ukielezwa katika tanbihi.
- source_word: ἐπεὶ παρασκευὴ ἦν
  choice: kwa kuwa ilikuwa Siku ya Maandalizi
  rationale: παρασκευή hapa ni siku ya kujiandaa kabla ya Sabato. Jina hili linawekwa wazi na tanbihi ili lisieleweke kama maandalizi ya kawaida tu.
- source_word: ἵνα μὴ μείνῃ ἐπὶ τοῦ σταυροῦ τὰ σώματα ἐν τῷ σαββάτῳ
  choice: kwamba miili isibaki misalabani siku ya Sabato
  rationale: Muundo wa kusudi wa ἵνα pamoja na kitenzi tegemezi umehifadhiwa. Wingi “misalabani” ni wa asili katika Kiswahili kwa miili ya watu kadhaa, ingawa Kigiriki hutumia umoja wa kijumla.
- source_word: ἦν γὰρ μεγάλη ἡ ἡμέρα ἐκείνου τοῦ σαββάτου
  choice: kwa maana siku ya Sabato hiyo ilikuwa siku kuu
  rationale: μεγάλη ni “kuu/kubwa” na hapa huonyesha umuhimu wa pekee wa Sabato hiyo bila kueleza zaidi sababu ambayo kifungu chenyewe hakitaji.
- source_word: ἠρώτησαν τὸν Πιλᾶτον
  choice: waliomba Pilato
  rationale: ἐρωτάω hapa ni kuomba jambo kwa mwenye mamlaka; “waliomba Pilato” ni sahihi na ya kawaida bila kuongeza wazi maneno “ruhusa.”
- source_word: ἵνα κατεαγῶσιν αὐτῶν τὰ σκέλη
  choice: kwamba miguu yao ivunjwe
  rationale: κατάγνυμι humaanisha kuvunja; kauli tendwa ya Kigiriki na sehemu ya mwili inayolengwa zimehifadhiwa.
- source_word: καὶ ἀρθῶσιν
  choice: kisha miili iondolewe
  rationale: αἴρω hapa ina maana ya kuondoa au kutwaa. Kurudia “miili” huondoa utata wa kisarufi katika Kiswahili bila kuamua kama tendo lilikuwa tu kuwashusha au kuwaondoa kabisa.
theological_decisions:
- issue: Rejeo la Ἰουδαῖοι katika Injili ya Yohana
  choice: Wayahudi
  alternative: viongozi wa Wayahudi; Wayudea
  rationale: Neno la Kigiriki lina matumizi yanayotofautiana kulingana na muktadha. Aya haibani wazi kundi hilo kuwa viongozi pekee, hivyo tafsiri pana imewekwa katika matini na uwezekano finyu umehifadhiwa katika tanbihi.
- issue: Maana ya μεγάλη kuhusu Sabato
  choice: siku kuu
  alternative: Sabato hiyo ilikuwa ya umuhimu wa pekee; siku ya juu
  rationale: “Siku kuu” huhifadhi maana ya msingi ya μεγάλη na kuonyesha umuhimu wa Sabato hiyo bila kuingiza istilahi ya kimadhehebu au maelezo yasiyotajwa katika aya.
- issue: Maana ya ἀρθῶσιν katika muktadha wa kusulubiwa
  choice: miili iondolewe
  alternative: miili ishushwe
  rationale: Kitenzi kinaweza kumaanisha kuinua, kuondoa, au kutwaa. “Iondolewe” huhifadhi upana wake; “ishushwe” ni tafsiri inayowezekana kutokana na muktadha lakini ni mahsusi zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imepangwa ili ionyeshe sababu ya ombi, umuhimu wa Sabato hiyo, na matendo mawili yaliyoombwa. Alama zote za tanbihi [a]–[d] zimewekwa katika matini kuu.
