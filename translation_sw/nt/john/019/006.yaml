id: JHN.19.6
reference: John 19:6
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὅτε οὖν εἶδον αὐτὸν οἱ ἀρχιερεῖς καὶ οἱ ὑπηρέται ἐκραύγασαν λέγοντες· Σταύρωσον ⸀σταύρωσον. λέγει αὐτοῖς ὁ Πιλᾶτος· Λάβετε αὐτὸν ὑμεῖς καὶ σταυρώσατε, ἐγὼ γὰρ οὐχ εὑρίσκω ἐν αὐτῷ αἰτίαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/006.yaml
  text: So when the chief priests and the officers saw him[a], they cried out, saying, “Crucify him! Crucify him!” Pilate said to them, “You take him and crucify him[b], for I find no charge against him.”
translation:
  language: sw
  text: Basi makuhani wakuu na maafisa walipomwona, wakapiga kelele wakisema, “Msulubishe! Msulubishe!” Pilato akawaambia, “Ninyi wenyewe mchukueni mkamsulubishe[a], kwa maana mimi sioni shtaka lolote dhidi yake[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kigiriki kinataja wazi “ninyi,” na hivyo kusisitiza: “Ninyi wenyewe mchukueni mkamsulubishe.”'
    reason: lexical_emphasis
  - marker: b
    text: Au, “sioni kosa lolote kwake.” Neno la Kigiriki linaweza kumaanisha kosa, shtaka, au msingi wa mashtaka; hapa maana ya kisheria ndiyo inayotawala.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε οὖν
  choice: Basi ... walipomwona
  rationale: “Basi” linaendeleza na kuonyesha matokeo ya simulizi, huku “walipomwona” likihifadhi maana ya wakati ya ὅτε kwa Kiswahili cha kawaida.
- source_word: ἀρχιερεῖς
  choice: makuhani wakuu
  rationale: Ni istilahi ya kawaida kwa viongozi wa juu wa kikuhani wa Yerusalemu; wingi umehifadhiwa.
- source_word: ὑπηρέται
  choice: maafisa
  rationale: Katika muktadha wa Yohana, neno hili linamaanisha watendaji walio chini ya mamlaka za Kiyahudi. “Maafisa” linahifadhi maana ya kiutendaji bila kuongeza kwamba walikuwa watumishi wa Hekalu.
- source_word: ἐκραύγασαν λέγοντες
  choice: wakapiga kelele wakisema
  rationale: Linawasilisha sauti kubwa ya kilio cha hadharani na pia linahifadhi muundo wa kitenzi pamoja na kishirikishi.
- source_word: Σταύρωσον σταύρωσον
  choice: Msulubishe! Msulubishe!
  rationale: Kurudiwa kwa amri kumehifadhiwa kwa msisitizo. Kiambishi cha yambwa “-m-” kinamtaja Yesu ambaye tayari ametajwa katika muktadha.
- source_word: Λάβετε αὐτὸν ὑμεῖς
  choice: Ninyi wenyewe mchukueni
  rationale: “Ninyi wenyewe” linaonyesha msisitizo wa kiwakilishi ὑμεῖς na tofauti kati yao na Pilato.
- source_word: σταυρώσατε
  choice: mkamsulubishe
  rationale: Linatoa amri ya kumsulubisha na linaunganisha kwa kawaida tendo hilo na amri iliyotangulia ya kumchukua.
- source_word: αἰτίαν
  choice: shtaka lolote
  rationale: Katika mazingira haya ya hukumu, neno lina maana ya shtaka au msingi wa mashtaka. “Shtaka” linaonyesha vizuri maana ya kisheria.
theological_decisions:
- issue: Tamko la Pilato kuhusu kutokuwa na hatia kwa Yesu
  choice: mimi sioni shtaka lolote dhidi yake
  alternative: mimi sioni kosa lolote kwake
  rationale: Kauli hiyo kimsingi ni uamuzi wa kisheria katika kesi hii. “Shtaka” linahifadhi maana ya kimahakama bila kuibadili kuwa tamko pana la kiteolojia, ingawa tamko hilo bado linaonyesha kwamba Pilato hakuona msingi wa kumhukumu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imewekwa katika mtiririko wa kawaida wa simulizi, huku marudio, amri, msisitizo wa “ninyi,” na maana ya kimahakama vikihifadhiwa.
