base_translation:
  language: en
  yaml_path: translation/nt/john/019/025.yaml
  text: Standing by the cross of Jesus were his mother[a], and his mother's sister, Mary the wife of Clopas[b], and Mary Magdalene.
translation:
  language: sw
  text: Kando ya msalaba wa Yesu walikuwa wamesimama mama yake, dada wa mama yake, Maria wa Klopa[a][b], na Maria Magdalene.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Maria, mke wa Klopa.” Kigiriki hakitaji wazi uhusiano wake na Klopa, ingawa mara nyingi inaeleweka kuwa alikuwa mke wake.
    reason: lexical_alternative
  - marker: b
    text: Inawezekana pia mstari huu unawataja wanawake watatu badala ya wanne, ikiwa “dada wa mama yake” ni maelezo yanayomtambulisha Maria wa Klopa.
    reason: alternative_reading
lexical_decisions:
- source_word: Εἱστήκεισαν
  choice: walikuwa wamesimama
  rationale: Muundo huu unaonyesha hali iliyoendelea ya kuwa wamesimama, badala ya tendo la muda mfupi tu.
- source_word: δὲ
  choice: haijatafsiriwa kwa neno maalumu
  rationale: Hapa δέ ni kiunganishi hafifu cha kuendeleza simulizi; mtiririko wa kawaida wa Kiswahili hauhitaji kuongezewa ‘basi’ au ‘lakini’.
- source_word: παρὰ τῷ σταυρῷ
  choice: kando ya msalaba
  rationale: παρά pamoja na hali ya dative huonyesha ukaribu wa mahali; ‘kando ya’ ni Kiswahili cha kawaida na huweka wazi kuwa walikuwa karibu na msalaba.
- source_word: τοῦ Ἰησοῦ
  choice: wa Yesu
  rationale: Inadumisha uhusiano wa moja kwa moja wa genitive kati ya msalaba na Yesu bila kuongeza maelezo yasiyokuwamo katika matini.
- source_word: ἡ μήτηρ αὐτοῦ
  choice: mama yake
  rationale: Tafsiri ya moja kwa moja na ya kawaida ya kirai hiki.
- source_word: ἡ ἀδελφὴ τῆς μητρὸς αὐτοῦ
  choice: dada ya mama yake
  rationale: Inawakilisha moja kwa moja ‘dada wa mama yake’ na ni usemi unaoeleweka kwa wasomaji wa Kiswahili.
- source_word: Μαρία ἡ τοῦ Κλωπᾶ
  choice: Maria wa Klopa
  rationale: Kirai cha Kigiriki kinamtambulisha Maria kwa uhusiano wake na Klopa bila kutaja wazi aina ya uhusiano huo. ‘Maria wa Klopa’ huhifadhi kutobainishwa huko; uwezekano wa maana ya mke umeelezwa katika tanbihi.
- source_word: Μαρία ἡ Μαγδαληνή
  choice: Maria Magdalene
  rationale: Hili ndilo jina la kawaida la Kiswahili linalomtambulisha Maria aliyetoka Magdala.
theological_decisions:
- issue: Utambulisho na idadi ya wanawake waliokuwa kando ya msalaba
  choice: 'Matini kuu inasomwa kuwa inawataja wanawake wanne: mama yake Yesu, dada ya mama yake, Maria wa Klopa, na Maria Magdalene.'
  alternative: Inawezekana pia kirai ‘dada ya mama yake’ kinamfafanua Maria wa Klopa, hivyo wanawake wanaotajwa wakawa watatu.
  rationale: Muundo wa orodha unaweza kueleweka kuwa na washiriki wanne, lakini sintaksia ya Kigiriki ni fupi na hairuhusu kuondoa kabisa usomaji wa watu watatu. Tafsiri inafuata usomaji wa kawaida wa watu wanne huku ikihifadhi usomaji mwingine katika tanbihi.
- issue: Uhusiano wa Maria na Klopa
  choice: Maria wa Klopa
  alternative: Maria, mke wa Klopa
  rationale: Kigiriki hakisemi wazi ‘mke.’ Tafsiri kuu inadumisha utata wa chanzo, na tafsiri iliyozoeleka ya uhusiano wa ndoa inawekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. ‘Walikuwa wamesimama’ huhifadhi hali endelevu ya kitenzi, na ‘Maria wa Klopa’ huepuka kufafanua uhusiano ambao Kigiriki hakitaji wazi.
