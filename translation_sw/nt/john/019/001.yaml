  text: Then Pilate took Jesus and flogged him[a].
translation:
  language: sw
  text: Ndipo Pilato akamchukua Yesu na kumpiga mijeledi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kuweka wazi zaidi kwamba tendo lilifanywa kwa amri yake, “Ndipo Pilato akamchukua Yesu na kuamuru apigwe mijeledi.”
    reason: alternative_reading
lexical_decisions:
- source_word: Τότε οὖν
  choice: Ndipo
  rationale: Katika muktadha huu, “ndipo” linaonyesha mfuatano wa tukio na mwendelezo wa hoja kwa Kiswahili cha kawaida bila kurudia viunganishi viwili.
- source_word: ἔλαβεν
  choice: akamchukua
  rationale: Huhifadhi maana ya kawaida ya λαμβάνω na kuendeleza simulizi; haliongezi wazo la kukamata kwa nguvu wala kuamuru wengine wamchukue.
- source_word: ὁ Πιλᾶτος
  choice: Pilato
  rationale: Hili ndilo umbo la kawaida la jina hili katika Biblia za Kiswahili; kibainishi cha Kigiriki hakihitaji kutafsiriwa.
- source_word: τὸν Ἰησοῦν
  choice: Yesu
  rationale: Umbo la kawaida la jina; ndiye mtendwa wa kitenzi “akamchukua.”
- source_word: ἐμαστίγωσεν
  choice: kumpiga mijeledi
  rationale: Hueleza wazi kupigwa kwa mjeledi kwa lugha ya sasa na yenye hadhi, huku likihifadhi ukali wa tendo kuliko usemi wa jumla “kumpiga.”
theological_decisions:
- issue: Ikiwa Pilato alimpiga Yesu mwenyewe au aliamuru apigwe
  choice: Pilato anabaki kuwa kiima cha vitenzi vyote bila kubainisha utekelezaji wa moja kwa moja au kwa wakala.
  alternative: Ndipo Pilato akamchukua Yesu na kuamuru apigwe mijeledi.
  rationale: Kigiriki kinamtaja Pilato kama kiima cha ἔλαβεν na ἐμαστίγωσεν. Tafsiri kuu huhifadhi muundo huo na utata halisi wa uwakala bila kuingiza maelezo ya taratibu za Kirumi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa “akam-” unaendeleza simulizi kwa kawaida; “mijeledi” ni wazi kwa wasomaji wa kawaida na huepuka msamiati wa kizamani.
