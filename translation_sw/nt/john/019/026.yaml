  text: Ἰησοῦς οὖν ἰδὼν τὴν μητέρα καὶ τὸν μαθητὴν παρεστῶτα ὃν ἠγάπα λέγει τῇ ⸀μητρί· Γύναι, ⸀ἴδε ὁ υἱός σου·
base_translation:
  language: en
  yaml_path: translation/nt/john/019/026.yaml
  text: So when Jesus saw his mother and the disciple whom he loved standing there[a], he says to his mother, “Woman, behold, your son.”
translation:
  language: sw
  text: Basi Yesu alipomwona mama yake na yule mwanafunzi ambaye Yesu alimpenda, aliyekuwa amesimama karibu, alimwambia mama yake, “Mwanamke[a], tazama, mwanao.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki ni “Mwanamke.” Huu ni mwito wa heshima, si usemi wa dharau, ingawa “Mwanamke” inaweza kusikika kwa ukali katika matumizi ya kisasa.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Basi
  rationale: Inaonyesha mwendelezo wa simulizi na uhusiano wake na tukio lililotangulia kwa Kiswahili cha kawaida.
- source_word: ἰδὼν
  choice: alipomwona
  rationale: 'Huitafsiri hali ya wakati ya kitenzi-shirikishi cha aoristi kwa mtiririko wa asili: Yesu alipomwona.'
- source_word: τὴν μητέρα
  choice: mama yake
  rationale: Ingawa Kigiriki kina kibainishi badala ya kimilikishi, muktadha unaonyesha wazi kuwa ni mama yake Yesu; Kiswahili hutumia kimilikishi kwa kawaida hapa.
- source_word: τὸν μαθητὴν
  choice: yule mwanafunzi
  rationale: Neno ‘yule’ linadumisha urejeleaji maalumu wa mwanafunzi anayetambulika katika simulizi.
- source_word: παρεστῶτα
  choice: akiwa amesimama karibu
  rationale: Inaonyesha kwamba mwanafunzi huyo alikuwapo hapo akiwa amesimama karibu, kwa lugha ya picha na ya kawaida.
- source_word: ὃν ἠγάπα
  choice: ambaye Yesu alimpenda
  rationale: Kutaja Yesu wazi kunazuia utata wa kisarufi usiokusudiwa katika Kiswahili kuhusu ni nani aliyependa, huku maana ya chanzo ikihifadhiwa.
- source_word: λέγει
  choice: akamwambia
  rationale: Ingawa Kigiriki kinatumia wakati uliopo wa kihistoria, mfululizo wa ‘aka-’ ni njia ya kawaida na hai ya kusimulia matukio yaliyofuatana katika Kiswahili.
- source_word: Γύναι
  choice: Mama
  rationale: Katika Kiswahili, ‘Mama’ ni namna ya heshima ya kumwita mwanamke mtu mzima. Inawasilisha heshima ya vocative ya Kigiriki bila ukali ambao ‘Mwanamke’ ungeweza kuwa nao katika usemi wa moja kwa moja.
- source_word: ἴδε
  choice: tazama
  rationale: Inahifadhi nguvu ya agizo la kuonyesha na uzito wa tamko linalofuata.
- source_word: ὁ υἱός σου
  choice: mwanao
  rationale: Ni usemi mfupi na wa asili unaotambulisha mwanafunzi huyo katika uhusiano wa mwana kwa mama ya Yesu.
theological_decisions:
- issue: Namna Yesu anavyomwita Maria katika Γύναι
  choice: Mama, pamoja na tanbihi inayoeleza maana halisi na sauti yake ya heshima
  alternative: Mwanamke; Mama mpendwa
  rationale: Γύναι ni namna ya kumwita mwanamke kwa heshima, wala si tusi. ‘Mama’ ni kifani cha heshima katika Kiswahili cha Afrika Mashariki, lakini tanbihi inahifadhi uwazi kwamba neno la Kigiriki ni ‘mwanamke’ na halisemi moja kwa moja ‘mama yangu.’
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa simulizi umetumia ‘alipo-’ na ‘aka-’ kwa mtiririko wa kawaida; tamko la Yesu limebaki fupi na lenye uzito.
