  text: καὶ πάλιν ἑτέρα γραφὴ λέγει· Ὄψονται εἰς ὃν ἐξεκέντησαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/037.yaml
  text: And again another Scripture says[a], “They will look on the one whom they pierced.”
translation:
  language: sw
  text: Na tena Andiko lingine linasema[a], “Watamtazama yule waliyemchoma.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Watamwelekea yule waliyemchoma.” Muundo wa Kigiriki unaweza kueleza kumtazama mtu au kuelekeza macho kwake; maneno haya yanatoa mwangwi wa Zekaria 12:10.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: tena
  rationale: Hutambulisha ushuhuda mwingine wa Maandiko na ni kiunganishi cha kawaida na cha asili katika Kiswahili.
- source_word: ἑτέρα γραφή
  choice: Andiko lingine
  rationale: Neno γραφή hapa linarejelea kifungu cha Maandiko Matakatifu, na ἑτέρα linaonyesha ushuhuda mwingine unaoongezwa.
- source_word: λέγει
  choice: linasema
  rationale: Wakati uliopo wa Kigiriki umehifadhiwa katika mtindo wa kawaida wa kunukuu Maandiko kana kwamba yanaendelea kusema.
- source_word: Ὄψονται εἰς ὃν
  choice: Watamtazama yule
  rationale: Kitenzi pamoja na εἰς kinaonyesha kutazama kunakoelekezwa kwa mtu. “Watamtazama yule” ni Kiswahili cha asili na kinahifadhi mhusika binafsi bila kuongeza maana isiyosemwa wazi.
- source_word: ἐξεκέντησαν
  choice: waliyemchoma
  rationale: Hueleza tendo lililofanywa la kumchoma mtu, likipatana na mazingira ya kusulubiwa na mwangwi wa Zekaria 12:10.
theological_decisions:
- issue: Kuhifadhi nguvu ya kimasiha ya dondoo la Zekaria bila kuingiza maneno ya ziada kutoka katika Kiebrania au Septuajinti
  choice: Watamtazama yule waliyemchoma
  alternative: Watamwelekea yule waliyemchoma
  rationale: Maneno ya Yohana katika Kigiriki ndiyo yanayotawala tafsiri ya mstari huu. “Yule” hufanya rejeo la mtu liwe wazi na la asili katika Kiswahili, huku mazingira yakimtambulisha aliyechomwa kuwa Yesu bila kuingiza moja kwa moja usemi wa nafsi ya kwanza wa Zekaria 12:10.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya usomaji wa Maandiko lakini kinachoeleweka kwa urahisi. “Andiko lingine linasema” ni mtindo wa kawaida wa kunukuu Maandiko; “waliyemchoma” ni wazi na wa moja kwa moja bila kuwa wa kale kupita kiasi.
