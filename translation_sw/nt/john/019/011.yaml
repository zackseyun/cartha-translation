base_translation:
  language: en
  yaml_path: translation/nt/john/019/011.yaml
  text: Jesus answered him[a], “You would have no authority over me at all unless it had been given to you from above[b]. Therefore the one who handed me over to you has the greater sin.”
translation:
  language: sw
  text: Yesu akamjibu, “Hungekuwa na mamlaka yoyote juu yangu kama hukupewa mamlaka hayo kutoka juu[a]. Kwa hiyo, aliyenikabidhi kwako[b] ana dhambi kubwa zaidi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kutoka mbinguni.” Kigiriki kinasema “kutoka juu,” usemi ambao katika Injili ya Yohana mara nyingi huelekeza kwenye chanzo cha kimungu.
    reason: lexical_alternative
  - marker: b
    text: Mtu aliyemkabidhi Yesu kwa Pilato hatajwi wazi hapa. Watafsiri humtambua kwa namna mbalimbali kuwa Yuda, Kayafa, au viongozi wa Wayahudi kwa ujumla.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξουσίαν
  choice: mamlaka
  rationale: Katika muktadha wa Pilato kama mtawala na hakimu, “mamlaka” huonyesha uwezo na ruhusa ya kutawala, si nguvu za kimwili tu.
- source_word: κατ’ ἐμοῦ οὐδεμίαν
  choice: mamlaka yoyote juu yangu
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaohifadhi uhusiano wa kimamlaka na msisitizo wa οὐδεμίαν, yaani kutokuwa na mamlaka hata kidogo.
- source_word: δεδομένον σοι
  choice: hukupewa mamlaka hayo
  rationale: Kauli tendwa inaonyesha kwamba Pilato alipokea mamlaka badala ya kuwa nayo kutoka kwake mwenyewe; wakati uliotangulia unaelezwa kwa kawaida katika sentensi sharti ya Kiswahili.
- source_word: ἄνωθεν
  choice: kutoka juu
  rationale: Tafsiri hii huhifadhi usemi wa Yohana unaodokeza chanzo cha kimungu bila kuufanya wazi zaidi kuliko Kigiriki kwa kusema moja kwa moja “kutoka mbinguni” au “kutoka kwa Mungu.”
- source_word: διὰ τοῦτο
  choice: Kwa hiyo
  rationale: Huonyesha kwa lugha ya kawaida uhusiano wa sababu na hitimisho uliomo katika kifungu cha Kigiriki.
- source_word: ὁ παραδούς μέ σοι
  choice: aliyenikabidhi kwako
  rationale: “Kukabidhi” inafaa katika simulizi la Yesu kutiwa mikononi mwa mamlaka na haimtambulishi mhusika huyu kuwa Yuda, Kayafa, au kundi fulani bila ushahidi wa wazi katika mstari huu.
- source_word: μείζονα ἁμαρτίαν ἔχει
  choice: ana dhambi kubwa zaidi
  rationale: Huhifadhi usemi halisi wa kulinganisha ukubwa wa dhambi na kuacha wazi kipimo na mhusika anayelinganishwa naye.
theological_decisions:
- issue: Chanzo cha mamlaka ya Pilato kinachodokezwa na ἄνωθεν
  choice: “Kutoka juu” linaonyesha chanzo cha juu, ambacho katika Yohana kwa kawaida ni cha kimungu, bila kuongeza fundisho pana kuhusu mamlaka zote za kisiasa.
  alternative: “Kutoka mbinguni” au “kutoka kwa Mungu.”
  rationale: Kigiriki kinasema “kutoka juu.” Tafsiri inalinda dokezo la chanzo cha kimungu na pia kiwango cha uwazi cha matini.
- issue: Utambulisho wa ὁ παραδούς μέ σοι
  choice: 'Mhusika anaachwa bila kutajwa kwa jina: “aliyenikabidhi kwako.”'
  alternative: Yuda, Kayafa, au viongozi wa Wayahudi kwa ujumla.
  rationale: Mstari wenyewe haumtambui mhusika huyo waziwazi, kwa hiyo tafsiri haipaswi kuondoa utata huo.
- issue: Ulinganisho katika μείζονα ἁμαρτίαν
  choice: “Dhambi kubwa zaidi” huhifadhi tofauti ya kiwango cha dhambi bila kumwondolea Pilato wajibu.
  alternative: “Hatia kubwa zaidi” au ufafanuzi unaosema wazi kwamba dhambi hiyo ni kubwa kuliko ya Pilato.
  rationale: Matini inazungumzia “dhambi” na kulinganisha ukubwa wake; haisemi kwamba Pilato hana dhambi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Hungekuwa ... kama hukupewa” ni muundo wa kawaida wa sharti lisilotimia; “mamlaka yoyote” huhifadhi msisitizo wa Kigiriki. Alama zote za tanbihi zimewekwa baada ya maneno yanayohusika.
