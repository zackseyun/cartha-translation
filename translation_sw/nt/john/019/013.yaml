id: JHN.19.13
reference: John 19:13
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ὁ οὖν Πιλᾶτος ἀκούσας ⸂τῶν λόγων τούτων⸃ ἤγαγεν ἔξω τὸν Ἰησοῦν, καὶ ἐκάθισεν ⸀ἐπὶ βήματος εἰς τόπον λεγόμενον Λιθόστρωτον, Ἑβραϊστὶ δὲ Γαββαθα.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/013.yaml
  text: So when Pilate heard these words[a], he brought Jesus outside and sat down on the judgment seat at a place called the Stone Pavement, and in Hebrew[b], Gabbatha.
translation:
  language: sw
  text: Basi Pilato aliposikia maneno hayo[a], alimleta Yesu nje, akaketi kwenye kiti cha hukumu mahali palipoitwa Sakafu ya Mawe, na kwa Kiebrania[b], Gabatha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akamketisha kwenye kiti cha hukumu.” Kitenzi cha Kigiriki kinaweza kueleweka kuwa Pilato alimketisha Yesu, ingawa maana inayowezekana zaidi hapa ni kwamba Pilato mwenyewe aliketi kwenye kiti cha hukumu.
    reason: alternative_reading
  - marker: b
    text: “Kwa Kiebrania” huenda kunarejelea lugha ya Kisemiti iliyotumiwa katika eneo hilo, labda Kiaramu, kama ilivyo kwingine katika Yohana.
    reason: cultural_note
lexical_decisions:
- source_word: οὖν
  choice: Basi
  rationale: Inaonyesha mwendelezo na matokeo ya mazungumzo yaliyotangulia kwa Kiswahili cha kawaida.
- source_word: ἀκούσας τῶν λόγων τούτων
  choice: aliposikia maneno hayo
  rationale: Kirai cha wakati kinawakilisha kitenzi-shirikishi cha aoristi, na ‘maneno hayo’ yanarejelea yaliyokuwa yamesemwa.
- source_word: ἤγαγεν ἔξω τὸν Ἰησοῦν
  choice: alimleta Yesu nje
  rationale: Kinawasilisha wazi tendo la kumtoa Yesu kwenda nje bila kudokeza zaidi namna alivyomwongoza.
- source_word: ἐκάθισεν ἐπὶ βήματος
  choice: akaketi kwenye kiti cha hukumu
  rationale: Muktadha wa kimahakama unaonyesha kuwa βῆμα ni kiti au jukwaa rasmi la kutoa hukumu; usomaji unaowezekana zaidi ni kwamba Pilato ndiye aliyeketi.
- source_word: εἰς τόπον λεγόμενον Λιθόστρωτον
  choice: mahali palipoitwa Sakafu ya Mawe
  rationale: εἰς inaelezwa kama mahali tendo lilipofikia, na jina la Kigiriki lenye maana dhahiri limetafsiriwa kwa Kiswahili.
- source_word: Ἑβραϊστὶ δὲ Γαββαθα
  choice: na kwa Kiebrania, Gabatha
  rationale: Maandishi yenyewe yanasema ‘kwa Kiebrania’; jina Gabatha limenukuliwa kifonetiki, huku dokezo likifafanua matumizi ya lugha katika Yohana.
theological_decisions:
- issue: Mtenda wa ἐκάθισεν
  choice: Pilato aliketi kwenye kiti cha hukumu
  alternative: Pilato alimketisha Yesu kwenye kiti cha hukumu
  rationale: Muundo wa Kigiriki unaweza kueleweka kwa maana isiyoelekeza tendo kwa kitu au kwa maana elekezi. Muktadha wa mahakama na sintaksia ya kawaida vinaunga mkono zaidi Pilato kuketi, lakini uwezekano mwingine umehifadhiwa katika tanbihi kwa kuwa ni halisi na una umuhimu wa kiufafanuzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha kisasa na chenye hadhi. ‘Kiti cha hukumu’ kinaeleweka kwa urahisi kuliko istilahi ya kitaalamu, na ‘Sakafu ya Mawe’ huhifadhi maana ya jina la Kigiriki. Alama zote za tanbihi zimewekwa katika matini kuu.
