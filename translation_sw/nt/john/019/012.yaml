  text: ἐκ τούτου ⸂ὁ Πιλᾶτος ἐζήτει⸃ ἀπολῦσαι αὐτόν· οἱ δὲ Ἰουδαῖοι ⸀ἐκραύγασαν λέγοντες· Ἐὰν τοῦτον ἀπολύσῃς, οὐκ εἶ φίλος τοῦ Καίσαρος· πᾶς ὁ βασιλέα ἑαυτὸν ποιῶν ἀντιλέγει τῷ Καίσαρι.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/012.yaml
  text: From then on Pilate was seeking to release him. But the Jews shouted, saying, “If you release this man, you are not Caesar’s friend. Everyone who makes himself a king speaks against Caesar.”
translation:
  language: sw
  text: Tangu wakati huo, Pilato alikuwa akitafuta kumwachilia Yesu.[a] Lakini Wayahudi[b] wakapiga kelele wakisema, “Ukimwachilia mtu huyu, wewe si rafiki wa Kaisari. Kila anayejifanya kuwa mfalme anampinga Kaisari.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa sababu hiyo Pilato aliendelea kutafuta kumwachilia Yesu.” Kirai cha Kigiriki kinaweza kueleweka kuwa cha wakati (“tangu wakati huo”) au cha sababu (“kwa sababu hiyo”).
    reason: lexical_alternative
  - marker: b
    text: Katika Injili ya Yohana, “Wayahudi” mara nyingi huwarejelea hasa viongozi wa Kiyahudi au wapinzani fulani wa Kiyahudi katika muktadha wa simulizi, si lazima watu wote wa Kiyahudi.
    reason: cultural_note
  - marker: c
    text: Au, “anasema dhidi ya Kaisari” au “anajiweka dhidi ya Kaisari.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τούτου
  choice: Tangu wakati huo
  rationale: Kirai hiki kinaeleweka kwa kawaida hapa kama alama ya wakati katika mtiririko wa simulizi, huku maana ya kisababishi ikihifadhiwa katika tanbihi.
- source_word: ἐζήτει
  choice: alijaribu kuendelea
  rationale: Wakati usiotimilika wa Kigiriki unaonyesha jaribio lililoendelea au lililorudiwa; usemi huu ni wa asili katika Kiswahili na unahifadhi nguvu hiyo.
- source_word: ἀπολῦσαι / ἀπολύσῃς
  choice: kumwachilia / ukimwachilia
  rationale: Kitenzi kinamaanisha kuachiliwa rasmi kutoka kizuizini, na “achilia” kinafaa katika mazingira haya ya hukumu.
- source_word: οἱ δὲ Ἰουδαῖοι
  choice: Lakini Wayahudi
  rationale: Tafsiri inahifadhi upana wa neno la asili bila kulibana katika matini kuu kuwa “viongozi wa Wayahudi”; muktadha wake unaelezwa katika tanbihi.
- source_word: ἐκραύγασαν λέγοντες
  choice: wakapiga kelele wakisema
  rationale: Hii huonyesha kilio cha hadharani chenye sauti kubwa na pia huhifadhi muundo unaoanzisha usemi wa moja kwa moja.
- source_word: τοῦτον
  choice: mtu huyu
  rationale: Huhifadhi nguvu ya kiashiria na sauti ya dharau inayowezekana kuliko kutumia kiwakilishi pekee.
- source_word: φίλος τοῦ Καίσαρος
  choice: rafiki wa Kaisari
  rationale: Ni usemi wa kawaida wa Kiswahili unaohifadhi madai ya uaminifu wa kisiasa bila kuufanya kwa lazima kuwa cheo rasmi.
- source_word: πᾶς ὁ βασιλέα ἑαυτὸν ποιῶν
  choice: Kila anayejifanya kuwa mfalme
  rationale: Hufuata kwa karibu wazo la mtu kujifanya mfalme na kuepuka tafsiri dhaifu zaidi ya kudai tu kuwa mfalme.
- source_word: ἀντιλέγει τῷ Καίσαρι
  choice: anampinga Kaisari
  rationale: Katika tishio hili la kisiasa na kisheria, kitenzi kinamaanisha kusimama dhidi ya au kumpinga Kaisari; tafsiri hii ni ya asili na sahihi kimuktadha.
theological_decisions:
- issue: Kirejeleo cha “Wayahudi” katika Injili ya Yohana
  choice: Kuhifadhi “Wayahudi” katika matini kuu
  alternative: viongozi wa Wayahudi; Wayudea
  rationale: Neno la Kigiriki halibainishi viongozi pekee. Tanbihi inazuia uelewa wa jumla usiofaa bila kubadili upana wa matini asili.
- issue: Nguvu ya ἀντιλέγει katika shtaka dhidi ya Yesu
  choice: anampinga Kaisari
  alternative: anasema dhidi ya Kaisari; anajiweka dhidi ya Kaisari
  rationale: Muktadha wa kisiasa unalenga uasi au upinzani kwa Kaisari, si tendo la kusema tu; “anampinga” huhifadhi maana hiyo bila kuongeza fundisho la nje.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Yesu” imetumiwa badala ya kiwakilishi katika sentensi ya kwanza ili kurejelea mhusika kwa uwazi wa kawaida wa Kiswahili; maana haijapanuliwa. Tanbihi zote zimewekewa alama katika matini kuu.
