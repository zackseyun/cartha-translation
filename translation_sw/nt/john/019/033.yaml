  yaml_path: translation/nt/john/019/033.yaml
  text: But when they came to Jesus[a], seeing that he was already dead[b], they did not break his legs.
translation:
  language: sw
  text: Lakini walipomjia Yesu[a], walipoona kwamba alikuwa amekwisha kufa[b], hawakuivunja miguu yake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Baadaye Yohana anahusianisha tendo hili na Maandiko: “Hakuna mfupa wake utakaovunjwa” (Yohana 19:36; linganisha Kutoka 12:46; Hesabu 9:12; Zaburi 34:20).'
    reason: cross_reference
  - marker: b
    text: Au, “walipoona kwamba tayari alikuwa amekufa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ δὲ τὸν Ἰησοῦν ἐλθόντες
  choice: Lakini walipomfikia Yesu
  rationale: Muundo wa kitenzi-shirikishi pamoja na δέ umetafsiriwa kama kishazi cha wakati. “Lakini” linaonyesha utofauti wa kadiri na walivyowatendea wale wengine, na “walipomfikia Yesu” linaonyesha mwendo uliolenga kwake.
- source_word: ὡς εἶδον
  choice: na kuona kwamba
  rationale: ὡς pamoja na kitenzi cha wakati uliopita huonyesha hali waliyoitambua na ambayo iliongoza tendo lililofuata. Tafsiri hii inadumisha maana ya kuona bila kuongeza ufafanuzi usio katika maandishi.
- source_word: ἤδη
  choice: amekwisha
  rationale: Neno hili linaonyesha kwamba kifo kilikuwa tayari kimetokea walipomfikia Yesu. “Amekwisha kufa” ni usemi wa kawaida wa Kiswahili unaowasilisha maana hiyo.
- source_word: τεθνηκότα
  choice: alikuwa amekwisha kufa
  rationale: Kitenzi-shirikishi cha hali timilifu kinakazia hali iliyotokana na kufa. Muundo huu wa Kiswahili unaonyesha tukio lililokamilika na hali iliyokuwapo wakati walipomwona.
- source_word: οὐ κατέαξαν
  choice: hawakuivunja
  rationale: κατάγνυμι hapa humaanisha kuvunja kiungo au mifupa yake. “Kuvunja” ndilo neno sahihi na la kawaida katika muktadha huu.
- source_word: τὰ σκέλη
  choice: miguu yake
  rationale: σκέλη humaanisha miguu. Kiswahili cha kawaida husema “kuvunja miguu,” ingawa tendo lenyewe linahusisha mifupa ya miguu.
theological_decisions:
- issue: Dokezo linalowezekana la kutimizwa kwa Maandiko kwa kutovunjwa kwa miguu ya Yesu
  choice: Maandishi makuu yanasalia kuwa simulizi la moja kwa moja bila kuongeza lugha ya kutimizwa kwa unabii katika aya hii.
  alternative: Kutumia “mifupa ya miguu” ili kutanguliza uhusiano na Yohana 19:36.
  rationale: Yohana 19:36 yenyewe inaeleza wazi uhusiano huo na Maandiko. Aya hii isimuliwe kama ilivyo, huku tanbihi ikionyesha marejeo husika bila kuingiza mapema maelezo ya kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa simulizi la Biblia. “Walipomfikia” ni wazi zaidi katika muktadha wa askari waliokuwa wakienda kwa waliosulubiwa mmoja baada ya mwingine; “miguu” ni ya kawaida kuliko maelezo ya kianatomia yasiyo ya lazima.
