id: JHN.19.7
reference: John 19:7
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀπεκρίθησαν αὐτῷ οἱ Ἰουδαῖοι· Ἡμεῖς νόμον ἔχομεν, καὶ κατὰ τὸν ⸀νόμον ὀφείλει ἀποθανεῖν, ὅτι ⸂υἱὸν θεοῦ ἑαυτὸν⸃ ἐποίησεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/007.yaml
  text: The Jews answered him[a], “We have a law, and according to that law he ought to die[b], because he made himself the Son of God.”
translation:
  language: sw
  text: Wayahudi wakamjibu, “Sisi tunayo sheria, na kwa mujibu wa sheria hiyo[a] inampasa afe, kwa sababu alijifanya kuwa Mwana wa Mungu[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa mujibu wa sheria.” Kigiriki kinarudia neno “sheria”; mara ya pili linarejelea sheria iliyotajwa kwanza.
    reason: lexical_alternative
  - marker: b
    text: Au, “alidai kuwa Mwana wa Mungu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθησαν αὐτῷ
  choice: wakamjibu
  rationale: Ni kauli ya kawaida ya kisimulizi inayoonyesha kuwa walimjibu mtu aliyetajwa katika muktadha; kiwakilishi cha yambwa kinahifadhi αὐτῷ bila kurudia jina lake.
- source_word: οἱ Ἰουδαῖοι
  choice: Wayahudi
  rationale: Hili ndilo neno la moja kwa moja la kundi lililotajwa katika Kigiriki. Aya yenyewe hailibani wazi kundi hilo kuwa viongozi pekee.
- source_word: Ἡμεῖς νόμον ἔχομεν
  choice: Sisi tunayo sheria
  rationale: “Sisi” linahifadhi msisitizo wa Ἡμεῖς, na “tunayo sheria” ni Kiswahili cha kawaida kinachowasilisha dai la kuwa na msingi wa kisheria bila kulazimisha hapa jina rasmi la Torati.
- source_word: κατὰ τὸν νόμον
  choice: kwa mujibu wa sheria hiyo
  rationale: “Sheria hiyo” inarejelea wazi sheria iliyotajwa mara moja kabla yake na hivyo kuhifadhi nguvu ya kiashiria cha nomino yenye kibainishi katika Kigiriki.
- source_word: ὀφείλει ἀποθανεῖν
  choice: inampasa afe
  rationale: Kauli hii inaonyesha wajibu unaodaiwa kisheria bila kuugeuza kuwa maelezo ya ulazima wa kimajaliwa.
- source_word: υἱὸν θεοῦ
  choice: Mwana wa Mungu
  rationale: Katika muktadha wa Yohana, maneno haya yanawasilisha hadhi ya pekee ya kimwana iliyokuwa msingi wa shtaka. Kiswahili halihitaji kibainishi kinacholingana moja kwa moja na “the” ya Kiingereza.
- source_word: ἑαυτὸν ἐποίησεν
  choice: alijifanya kuwa
  rationale: Hii inahifadhi namna washitaki walivyoliunda dai lao, badala ya kulibadili moja kwa moja kuwa kauli isiyo na upande kama “alidai kuwa.”
theological_decisions:
- issue: Maana ya υἱὸν θεοῦ katika shtaka dhidi ya Yesu
  choice: Mwana wa Mungu
  alternative: mwana wa Mungu
  rationale: Herufi kubwa inaonyesha matumizi ya cheo katika muktadha huu bila kuongeza maelezo ya kimafundisho ndani ya shtaka. Tafsiri haifanyi usemi huo kuwa kundi lisilo maalumu la “mwana mmoja wa Mungu.”
- issue: Nguvu ya ἑαυτὸν ἐποίησεν
  choice: alijifanya kuwa
  alternative: alidai kuwa
  rationale: “Alijifanya kuwa” inadumisha lugha ya washitaki na mvutano wake; “alidai kuwa” ingeweka wazi zaidi maana ya madai lakini ingepunguza taswira ya Kigiriki ya mtu kujifanya mwenyewe kuwa na hadhi hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wenye heshima na unaosomeka kwa urahisi. Muundo “inampasa afe” una uzito wa kisheria lakini bado unaeleweka kwa wasomaji wa kawaida. Alama za tanbihi zimewekwa baada ya maneno yanayohusika moja kwa moja.
