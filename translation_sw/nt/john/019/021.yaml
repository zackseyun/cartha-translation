  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἔλεγον οὖν τῷ Πιλάτῳ οἱ ἀρχιερεῖς τῶν Ἰουδαίων· Μὴ γράφε· Ὁ βασιλεὺς τῶν Ἰουδαίων, ἀλλ’ ὅτι ἐκεῖνος εἶπεν Βασιλεὺς ⸂τῶν Ἰουδαίων εἰμί⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/021.yaml
  text: So the chief priests of the Jews were saying to Pilate[a], “Do not write, ‘The King of the Jews,’ but that he said[b], ‘I am King of the Jews.’”
translation:
  language: sw
  text: Kwa hiyo, makuhani wakuu wa Wayahudi[a] walikuwa wakimwambia Pilato, “Usiandike, ‘Mfalme wa Wayahudi,’ bali andika kwamba mtu huyo alisema, ‘Mimi ni Mfalme wa Wayahudi.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watu wa Yudea,” na “Mfalme wa watu wa Yudea.” Neno la Kigiriki linaweza kumaanisha Wayahudi kwa ujumla au watu wa Yudea hasa, kutegemea muktadha.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔλεγον
  choice: walikuwa wakimwambia
  rationale: Kauli ya wakati usiotimilika inaonyesha tendo lililokuwa likiendelea au kurudiwa; muundo huu wa Kiswahili unahifadhi hali hiyo kwa njia ya kawaida.
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Kiunganishi kinaendeleza simulizi huku kikionyesha matokeo ya yaliyotangulia.
- source_word: ἀρχιερεῖς
  choice: makuhani wakuu
  rationale: Hili ndilo jina la kawaida la viongozi wa kikuhani; halimaanishi kwamba wote walikuwa wanashikilia kwa wakati mmoja cheo cha kuhani mkuu mmoja.
- source_word: τῶν Ἰουδαίων
  choice: wa Wayahudi
  rationale: Katika simulizi la mateso, usemi “Mfalme wa Wayahudi” ni jina la kisiasa na kidini linalotambulika. Uwezekano wa maana “watu wa Yudea” umeonyeshwa katika tanbihi.
- source_word: Μὴ γράφε
  choice: Usiandike
  rationale: Ni katazo la moja kwa moja na la kawaida katika Kiswahili.
- source_word: Ὁ βασιλεὺς τῶν Ἰουδαίων
  choice: Mfalme wa Wayahudi
  rationale: Inahifadhi maneno ya maandishi yaliyobishaniwa kama cheo.
- source_word: ἀλλ’ ὅτι
  choice: bali
  rationale: Inaonyesha marekebisho ambayo viongozi hao walitaka Pilato aandike badala ya maneno ya awali.
- source_word: ἐκεῖνος
  choice: Yeye
  rationale: Kiwakilishi cha kusisitiza kinaonyesha wazi kwamba Yesu ndiye aliyesema maneno hayo bila kuingiza dharau ambayo si lazima iwe dhahiri katika Kiswahili.
- source_word: εἶπεν
  choice: alisema
  rationale: Tafsiri ya moja kwa moja haiingizii maana yenye nguvu zaidi kama “alidai.”
- source_word: Βασιλεὺς τῶν Ἰουδαίων εἰμί
  choice: Mimi ni Mfalme wa Wayahudi
  rationale: Muundo huu wa Kiswahili ni wa kawaida na unahifadhi msisitizo wa nafsi katika εἰμί. Kiswahili hakina kibainishi maalumu kinacholingana moja kwa moja na tofauti ya Kiingereza kati ya “a king” na “the King.”
theological_decisions:
- issue: Maana ya Ἰουδαίων katika simulizi la mateso katika Yohana
  choice: Wayahudi
  alternative: watu wa Yudea
  rationale: Muktadha unahusu maandishi “Mfalme wa Wayahudi,” jina la kisiasa na kidini lililozoeleka katika simulizi la mateso. Hata hivyo, neno la Kigiriki linaweza kumaanisha watu wa Yudea katika baadhi ya miktadha, kwa hiyo uwezekano huo haujafichwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Usemi wa moja kwa moja umewekwa kwa viwango vya alama za kunukuu ili kutofautisha amri ya viongozi, maandishi ya Pilato, na maneno waliyotaka yahusishwe na Yesu.
