  text: καὶ βαστάζων ⸂αὑτῷ τὸν σταυρὸν⸃ ἐξῆλθεν εἰς ⸀τὸν λεγόμενον Κρανίου Τόπον, ⸀ὃ λέγεται Ἑβραϊστὶ Γολγοθα,
base_translation:
  language: en
  yaml_path: translation/nt/john/019/017.yaml
  text: And carrying the cross by himself[a], he went out to the place called Skull Place, which in Hebrew is called Golgotha.
translation:
  language: sw
  text: Naye, akiwa ameubeba msalaba yeye mwenyewe[a], akatoka kwenda mahali paitwapo Mahali pa Fuvu, ambapo kwa Kiebrania[b] panaitwa Golgotha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya nakala za kale hazina maneno “yeye mwenyewe.”
    reason: textual_variant
  - marker: b
    text: Au huenda, “kwa Kiaramu.” Neno la Yohana “kwa Kiebrania” linaweza kurejelea lugha ya Kisemiti ya wenyeji wa Yudea.
    reason: lexical_alternative
lexical_decisions:
- source_word: βαστάζων
  choice: akiwa ameubeba
  rationale: Kitenzi hiki kinaonyesha kubeba kitu halisi; muundo huu wa Kiswahili unaunganisha tendo la kubeba na tendo kuu la kutoka kwa njia ya kawaida na iliyo wazi.
- source_word: αὑτῷ τὸν σταυρόν
  choice: msalaba mwenyewe
  rationale: Neno la kujirejelea linasisitiza kwamba Yesu ndiye aliyeubeba msalaba. Tafsiri hii haiongezi wazo lisilo la lazima kwamba ulikuwa mali yake.
- source_word: σταυρός
  choice: msalaba
  rationale: Hili ndilo neno la kawaida na sahihi katika muktadha wa mateso; neno la Kigiriki hapa halilazimishi maana nyembamba ya boriti ya msalaba pekee.
- source_word: ἐξῆλθεν εἰς
  choice: akatoka kwenda
  rationale: Maneno haya yanadumisha wazo la kutoka na kuelekea mahali fulani kwa Kiswahili cha kawaida.
- source_word: τὸν λεγόμενον Κρανίου Τόπον
  choice: mahali paitwapo Mahali pa Fuvu
  rationale: Tafsiri hii inadumisha muundo wa jina na maana ya moja kwa moja ya κρανίον, yaani fuvu, bila kuingiza usemi wa mapokeo usio katika maneno yenyewe.
- source_word: ὃ λέγεται
  choice: ambapo ... panaitwa
  rationale: Muundo huu wa Kiswahili unaeleza kwa kawaida kwamba mahali hapo panajulikana kwa jina linalofuata.
- source_word: Ἑβραϊστί
  choice: kwa Kiebrania
  rationale: Hii inafuata moja kwa moja neno la Kigiriki, huku uwezekano wa kurejelea Kiaramu ukihifadhiwa katika tanbihi.
- source_word: Γολγοθα
  choice: Golgotha
  rationale: Jina hili la mahali limetoholewa kwa kuandikwa kwa herufi za Kiswahili bila kutafsiri maana yake.
theological_decisions:
- issue: Maana ya rejeleo la lugha katika Ἑβραϊστί
  choice: kwa Kiebrania
  alternative: kwa Kiaramu
  rationale: Matini ya Kigiriki inasema wazi “kwa Kiebrania,” kwa hiyo hilo linahifadhiwa katika matini kuu. Hata hivyo, katika matumizi ya Yohana neno hilo huenda likarejelea lugha ya Kisemiti ya wenyeji, yaelekea Kiaramu; uwezekano huo unawekwa katika tanbihi badala ya kuamuliwa kimya kimya.
- issue: Nguvu ya αὑτῷ katika tendo la kubeba msalaba
  choice: msalaba mwenyewe
  alternative: msalaba wake mwenyewe
  rationale: Tafsiri iliyochaguliwa inasisitiza kwamba Yesu aliubeba yeye mwenyewe, huku ikiepuka kugeuza kiwakilishi hicho moja kwa moja kuwa umilikaji ambao si lazima katika muktadha huu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Paitwapo” na “panaitwa” ni miundo fasaha inayoeleweka, nayo marudio ya “mahali” yanahifadhi namna jina hilo linavyotolewa katika Kigiriki.
