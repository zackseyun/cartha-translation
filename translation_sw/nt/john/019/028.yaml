  text: Μετὰ τοῦτο ⸀εἰδὼς ὁ Ἰησοῦς ὅτι ⸂ἤδη πάντα⸃ τετέλεσται ἵνα τελειωθῇ ἡ γραφὴ λέγει· Διψῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/028.yaml
  text: After this[a], Jesus, knowing that all things had already been completed, in order that the Scripture might be fulfilled, said, “I thirst.”
translation:
  language: sw
  text: Baada ya hayo, Yesu, akijua kwamba kila kitu kilikuwa tayari kimekamilika, ili Andiko litimizwe, alisema, “Nina kiu.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa mtindo wa kimapokeo, “Ninaona kiu.”
    reason: Njia nyingine ya kimapokeo ya kueleza Διψῶ katika Kiswahili.
lexical_decisions:
- source_word: Μετὰ τοῦτο
  choice: Baada ya hayo
  rationale: Ni kiunganishi cha kawaida cha wakati katika simulizi la Kiswahili. Ingawa τοῦτο ni umoja, ‘baada ya hayo’ kwa kawaida humaanisha ‘baada ya jambo hilo’ bila kulazimisha muundo mgumu.
- source_word: εἰδὼς
  choice: akijua
  rationale: Huwasilisha hali inayoandamana na tendo kuu na kumtaja Yesu kuwa ndiye aliyekuwa na ufahamu huo.
- source_word: ἤδη πάντα τετέλεσται
  choice: kila kitu kilikuwa tayari kimekamilika
  rationale: ‘Kila kitu’ huwakilisha πάντα, huku ‘kilikuwa tayari kimekamilika’ kikionyesha hali ya ukamilisho iliyokuwapo kabla ya kauli iliyofuata.
- source_word: ἵνα τελειωθῇ ἡ γραφή
  choice: ili Andiko litimizwe
  rationale: ‘Ili’ huhifadhi maana ya kusudi au matokeo ya ἵνα. Kwa Andiko takatifu, ‘litimizwe’ ni Kiswahili cha kawaida na cha muktadha huu, ingawa kitenzi cha Kigiriki pia kina wazo la kukamilishwa.
- source_word: λέγει
  choice: alisema
  rationale: Wakati uliopita ni wa kawaida katika simulizi la Kiswahili, ingawa Kigiriki kimetumia wakati wa sasa wa kihistoria.
- source_word: Διψῶ
  choice: Nina kiu
  rationale: Ni kauli ya moja kwa moja, ya sasa, na ya kawaida katika Kiswahili cha kisasa, inayowasilisha wazi hali ya Yesu.
theological_decisions:
- issue: Uhusiano kati ya ufahamu wa Yesu, kukamilika kwa kila kitu, na kutimizwa kwa Andiko
  choice: Sentensi inasema Yesu alijua kwamba kila kitu kilikuwa tayari kimekamilika, kisha akasema maneno hayo ili Andiko litimizwe.
  alternative: Kishazi cha ἵνα kinaweza kueleweka kwa msisitizo wa matokeo—kwamba kwa kusema hivyo Andiko likatimizwa—bila kuamua mfumo mpana wa kitheolojia.
  rationale: Muundo huu huhifadhi mfuatano na mvutano wa maandishi ya Kigiriki bila kuingiza maelezo ya kimadhehebu kuhusu kujua mambo kabla au kuamuliwa kwake. Pia unatofautisha kukamilika kwa πάντα na kutimizwa kwa Andiko.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. ‘Andiko’ limetumiwa kwa umoja ili kuakisi ἡ γραφή; herufi kubwa inaonyesha rejeo kwa Andiko takatifu.
