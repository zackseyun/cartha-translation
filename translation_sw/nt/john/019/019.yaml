id: JHN.19.19
reference: John 19:19
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἔγραψεν δὲ καὶ τίτλον ὁ Πιλᾶτος καὶ ἔθηκεν ἐπὶ τοῦ σταυροῦ· ἦν δὲ γεγραμμένον· Ἰησοῦς ὁ Ναζωραῖος ὁ βασιλεὺς τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/019.yaml
  text: 'Pilate also wrote an inscription and put it on the cross. It was written: “Jesus the Nazarene[a], the King of the Jews.”'
translation:
  language: sw
  text: 'Pilato pia aliandika kibao na kukiweka msalabani. Kilikuwa kimeandikwa: “Yesu Mnazareti, Mfalme wa Wayahudi[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Mfalme wa watu wa Yudea.” Neno la Kigiriki linaweza kumaanisha Wayahudi kwa ujumla au watu wa Yudea hasa, kutegemea muktadha.
    reason: alternative_reading
lexical_decisions:
- source_word: τίτλον
  choice: kibao
  rationale: Katika muktadha wa kusulubiwa, neno hili linamaanisha kibao chenye maandishi kilichowekwa kwa mtu aliyehukumiwa. “Kibao” ni Kiswahili cha kawaida na cha wazi; “jina la cheo” kingekuwa hafifu hapa.
- source_word: ἔθηκεν ἐπὶ τοῦ σταυροῦ
  choice: kukiweka msalabani
  rationale: Huwakilisha moja kwa moja maana ya kuweka kitu juu ya msalaba bila kuongeza dhana ya kwamba kilikuwa juu zaidi ya msalaba.
- source_word: γεγραμμένον
  choice: Kilikuwa kimeandikwa
  rationale: Muundo huu huhifadhi hali ya matokeo ya maandishi yaliyokwisha kuandikwa na unasikika kwa kawaida katika Kiswahili.
- source_word: Ναζωραῖος
  choice: Mnazareti
  rationale: Ni jina la utambulisho linalotokana na Nazareti na hufuata umbo la Kigiriki la kivumishi au nomino kuliko kulipanua kuwa kishazi “wa Nazareti.”
- source_word: βασιλεὺς τῶν Ἰουδαίων
  choice: Mfalme wa Wayahudi
  rationale: Hili ndilo tamko la kifalme linaloeleweka kwa kawaida katika simulizi la mateso; uwezekano wa maana “watu wa Yudea” umehifadhiwa katika tanbihi.
- source_word: δὲ καὶ
  choice: pia
  rationale: Huonyesha mwendelezo wenye nyongeza kwa Kiswahili laini bila kuzidisha viunganishi.
- source_word: Ἰησοῦς
  choice: Yesu
  rationale: Umbo la kawaida la jina hili katika Kiswahili.
- source_word: Πιλᾶτος
  choice: Pilato
  rationale: Umbo la kawaida la jina hili katika Kiswahili.
- source_word: σταυροῦ
  choice: msalabani
  rationale: “Msalaba” ni neno la kawaida na linalofaa katika simulizi za kusulubiwa katika Injili.
theological_decisions:
- issue: Tafsiri ya Ἰουδαίων katika maandishi ya kibao
  choice: Wayahudi
  alternative: watu wa Yudea
  rationale: Katika muktadha huu, maneno hayo ni tangazo la hadharani la ufalme wa Yesu, na “Wayahudi” huonyesha maana iliyozoeleka na inayowezekana zaidi. Hata hivyo, neno la Kigiriki linaweza kumaanisha watu wa Yudea kulingana na muktadha, hivyo uwezekano huo umewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Sentensi zimewekwa kwa mtiririko wa asili huku mpangilio na maana ya chanzo cha Kigiriki vikihifadhiwa.
