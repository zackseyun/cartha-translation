base_translation:
  language: en
  yaml_path: translation/nt/john/019/009.yaml
  text: And he entered the governor’s headquarters again and said to Jesus[a], “Where are you from?” But Jesus gave him no answer.
translation:
  language: sw
  text: Akaingia tena katika makao makuu ya gavana[a] akamwambia Yesu, “Wewe umetoka wapi?” Lakini Yesu hakumpa jibu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “praetorium,” makao rasmi au makao makuu ya gavana wa Roma.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσῆλθεν
  choice: akaingia
  rationale: Kitenzi hiki kinaonyesha kuingia ndani ya mahali; “akaingia” ni cha kawaida na kinaendeleza simulizi kwa ufasaha.
- source_word: πραιτώριον
  choice: makao makuu ya gavana
  rationale: Neno hili humaanisha makao rasmi au makao makuu ya gavana wa Roma. Tafsiri hii inaeleza kazi ya mahali hapo kwa lugha inayoeleweka, huku istilahi ya asili ikitolewa katika tanbihi.
- source_word: πάλιν
  choice: tena
  rationale: Kielezi hiki kinaonyesha kwamba tendo la kuingia lilirudiwa.
- source_word: λέγει
  choice: kumwambia
  rationale: Ingawa Kigiriki kinatumia wakati wa sasa wa kihistoria, wakati wa simulizi wa Kiswahili umetumiwa kwa ufasaha; kiambishi “-mw-” kinahifadhi kwamba maneno yalielekezwa kwa Yesu.
- source_word: Πόθεν εἶ σύ
  choice: Wewe umetoka wapi?
  rationale: Hili ni swali kuhusu asili au mahali alikotoka mtu. “Wewe umetoka wapi?” ni Kiswahili cha kawaida na msisitizo wa σύ unawakilishwa kwa “Wewe.”
- source_word: ἀπόκρισιν οὐκ ἔδωκεν αὐτῷ
  choice: hakumpa jibu
  rationale: Tafsiri hii inahifadhi tamathali halisi ya Kigiriki ya ‘kutompa jibu’ na ni ya kawaida katika Kiswahili.
- source_word: δὲ
  choice: Lakini
  rationale: “Lakini” inaonyesha tofauti kati ya swali lililoulizwa na ukimya wa Yesu.
theological_decisions:
- issue: Mhusika wa kitenzi ambaye hajatajwa wazi
  choice: Kutotaja jina la Pilato katika mstari, bali kutumia muundo wa Kiswahili wenye mhusika anayeeleweka kutokana na muktadha.
  alternative: Kutaja “Pilato” wazi katika maandishi makuu.
  rationale: Kigiriki hakitaji mhusika kwa jina katika mstari huu, ingawa muktadha unaonyesha wazi kuwa ni Pilato. Muundo wa “Akaingia” unadumisha hali hiyo bila kuleta utata usio wa lazima.
- issue: Maana ya swali la Pilato
  choice: Wewe umetoka wapi?
  alternative: Wewe ni wa wapi?
  rationale: Tafsiri iliyochaguliwa inahifadhi swali la Πόθεν kuhusu chanzo au asili bila kulifafanua kuwa linahusu mahali pa kuzaliwa, uraia, au asili ya kiungu pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wa kawaida, wenye heshima na unaoeleweka kwa wasomaji wa leo. Alama ya tanbihi imewekwa moja kwa moja baada ya kirai kinachoeleza πραιτώριον.
