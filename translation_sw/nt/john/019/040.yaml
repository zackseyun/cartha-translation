  text: ἔλαβον οὖν τὸ σῶμα τοῦ Ἰησοῦ καὶ ἔδησαν ⸀αὐτὸ ὀθονίοις μετὰ τῶν ἀρωμάτων, καθὼς ἔθος ἐστὶν τοῖς Ἰουδαίοις ἐνταφιάζειν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/040.yaml
  text: So they took Jesus’s body and wrapped it in linen cloths with the spices[a], as is the burial custom of the Jews.
translation:
  language: sw
  text: Basi, waliuchukua mwili wa Yesu na kuufunga kwa vitambaa vya kitani pamoja na manukato, kama ilivyo desturi ya Wayahudi katika kuandaa mwili kwa maziko.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “desturi ya watu wa Yudea,” ikiwa neno hilo linaeleweka kwa maana ya kijiografia badala ya kikabila au kidini; hapa muktadha unaunga mkono desturi ya maziko ya Wayahudi kwa ujumla.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔλαβον
  choice: waliuchukua
  rationale: Katika muktadha huu, kitenzi kinamaanisha kuuchukua mwili ili kuuandaa kwa maziko.
- source_word: οὖν
  choice: Basi
  rationale: Kiunganishi hiki kinaonyesha mwendelezo au matokeo ya simulizi kutokana na mstari uliotangulia; “Basi” ni cha kawaida na cha asili katika Kiswahili.
- source_word: σῶμα
  choice: mwili
  rationale: Hii ndiyo maana ya moja kwa moja ya neno la Kigiriki; “maiti” ingesisitiza hali ya kifo kuliko neno la chanzo linavyohitaji.
- source_word: ἔδησαν
  choice: kuufunga
  rationale: δέω humaanisha kufunga; hapa linaeleza kuzungushiwa na kushikiliwa kwa vitambaa vya kitani katika maandalizi ya maziko.
- source_word: ὀθονίοις
  choice: kwa vitambaa vya kitani
  rationale: Neno hili hurejelea vipande au vitambaa vya kitani vilivyotumiwa katika maziko; tafsiri hii inadumisha aina ya kitambaa bila kuongeza ufafanuzi usio lazima.
- source_word: ἀρώματα
  choice: manukato
  rationale: ἄρωμα ni vitu vyenye harufu nzuri vilivyotumiwa kuandaa mwili kwa maziko; “manukato” ni neno la kawaida na linaloeleweka katika Kiswahili.
- source_word: καθὼς
  choice: kama
  rationale: Linaonyesha kwamba tendo hilo lilipatana na desturi iliyotajwa.
- source_word: ἔθος ἐστὶν
  choice: kama ilivyo desturi
  rationale: Muundo huu wa Kiswahili unatoa kwa kawaida maana ya jambo lililozoeleka au kufanywa kwa desturi.
- source_word: τοῖς Ἰουδαίοις
  choice: ya Wayahudi
  rationale: Katika muktadha huu, neno linarejelea desturi ya kidini na kitamaduni ya Wayahudi kwa ujumla, si hasa mamlaka za Kiyahudi.
- source_word: ἐνταφιάζειν
  choice: katika kuandaa mwili kwa maziko
  rationale: Kitenzi hiki katika muktadha wa mazishi kinaweza kujumuisha maandalizi ya mwili kwa ajili ya maziko, si tendo la kuutia kaburini pekee.
theological_decisions:
- issue: Maana ya τοῖς Ἰουδαίοις
  choice: Wayahudi
  alternative: Watu wa Yudea
  rationale: Hapa kinachozungumziwa ni desturi pana ya maziko ya Kiyahudi, wala si mahali wanakotoka watu au kundi la viongozi wa Yudea.
- issue: Upeo wa maana ya ἐνταφιάζειν
  choice: kuandaa mwili kwa maziko
  alternative: kuzika
  rationale: Matendo yanayotajwa ni ya kuutayarisha mwili kabla ya kuuweka kaburini; tafsiri hii inazuia kueleweka kana kwamba kitendo cha kuutia kaburini ndicho pekee kinachomaanishwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Vitambaa vya kitani” na “kuandaa mwili kwa maziko” ni wazi kwa msomaji wa kawaida huku vikibaki karibu na ushahidi wa Kigiriki.
