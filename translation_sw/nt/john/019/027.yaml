  yaml_path: translation/nt/john/019/027.yaml
  text: Then he said to the disciple, “Look, your mother.” And from that hour the disciple took her into his own home.
translation:
  language: sw
  text: Kisha akamwambia yule mwanafunzi, “Tazama, mama yako.” Tangu saa ile, yule mwanafunzi akamchukua na kumkaribisha nyumbani kwake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa ukaribu, “katika yale yaliyokuwa yake mwenyewe.” Kirai hiki kinaweza kurejelea makao yake au mazingira yake ya nyumbani na ya uangalizi.
    reason: Huhifadhi upana wa εἰς τὰ ἴδια huku tafsiri kuu ikitoa maana ya asili katika muktadha.
lexical_decisions:
- source_word: Ἴδε
  choice: Tazama
  rationale: Amri hii fupi ya kutazama pia hutambulisha uhusiano mpya; “Tazama” ni ya heshima na ya kawaida katika matini ya Biblia bila kuongeza maelezo.
- source_word: εἰς τὰ ἴδια
  choice: akaishi nyumbani kwake
  rationale: Kirai hiki kwa maana halisi ni “katika vitu/mahali pake mwenyewe,” na katika muktadha kinaashiria kumwingiza katika makao na uangalizi wake. Tafsiri hii ni ya asili kwa Kiswahili, huku tanbihi ikihifadhi upana wa kirai cha Kigiriki.
theological_decisions:
- issue: Asili ya uhusiano unaotangazwa kwa maneno “mama yako”
  choice: Kuhifadhi tamko moja kwa moja bila kulifafanua kitheolojia
  alternative: Kulieleza wazi kuwa ni ulezi wa kifamilia tu au kumpa Maria cheo cha kiroho kwa waamini wote
  rationale: Aya yenyewe inatangaza uhusiano kati ya mama na mwanafunzi bila kufafanua upeo wake wa kitheolojia; tafsiri haipaswi kuamua zaidi ya matini.
- issue: Maana ya mwanafunzi kumchukua Maria εἰς τὰ ἴδια
  choice: Kumchukua akaishi nyumbani kwake
  alternative: Kumchukua kuwa mali yake au kusema tu alimchukua kwake
  rationale: Muktadha unaunga mkono mapokezi katika makao na uangalizi wa mwanafunzi, lakini haupaswi kugeuzwa kuwa lugha ya umiliki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Yule mwanafunzi” hudumisha urejeleaji maalumu wa Kigiriki, na sentensi ya mwisho imeundwa kwa mtiririko wa kawaida wa Kiswahili.
