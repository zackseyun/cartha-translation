  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐξῆλθεν οὖν ὁ Ἰησοῦς ἔξω, φορῶν τὸν ἀκάνθινον στέφανον καὶ τὸ πορφυροῦν ἱμάτιον. καὶ λέγει αὐτοῖς· ⸀Ἰδοὺ ὁ ἄνθρωπος.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/005.yaml
  text: So Jesus came out[a], wearing the crown of thorns and the purple robe. And he says to them, “Behold, the man.”
translation:
  language: sw
  text: Basi Yesu akatoka nje akiwa amevaa taji ya miiba na vazi la zambarau. Pilato akawaambia, “Tazameni, huyu hapa mtu!”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mtazameni mtu huyu!” Neno la Kigiriki Ἰδοὺ ni usemi wa kuvuta usikivu ambao unaweza kutafsiriwa “Tazameni,” “Angalieni,” au “Ona.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν οὖν ... ἔξω
  choice: Basi ... akatoka nje
  rationale: “Basi” linaonyesha mwendelezo au matokeo katika simulizi, na “akatoka nje” linawakilisha mwendo wa kutoka pamoja na msisitizo wa ἔξω kwa Kiswahili cha kawaida.
- source_word: φορῶν
  choice: akiwa amevaa
  rationale: Muundo huu unaonyesha kwamba Yesu alikuwa amevaa vitu hivyo alipotoka nje.
- source_word: ἀκάνθινον στέφανον
  choice: taji ya miiba
  rationale: Ni usemi wa kawaida na sahihi kwa taji lililotengenezwa kwa miiba.
- source_word: πορφυροῦν ἱμάτιον
  choice: vazi la zambarau
  rationale: ἱμάτιον ni vazi kwa maana pana; “vazi” huepuka kulibainisha kupita kiasi kama joho, huku “zambarau” ikihifadhi ishara ya kifalme katika dhihaka hii.
- source_word: λέγει αὐτοῖς
  choice: Pilato akawaambia
  rationale: Kiima kilichodokezwa na muktadha ni Pilato. Kukitaja kunazuia utata usio wa asili katika Kiswahili kuhusu msemaji, huku “akawaambia” ikitoa mtiririko hai wa simulizi.
- source_word: Ἰδοὺ
  choice: Tazameni
  rationale: Ni mwito wa kuvuta usikivu wa kundi na unafaa kwa tangazo la hadharani; “Angalieni” pia linawezekana lakini si la kawaida kwa wasomaji wengi wa sasa.
- source_word: ὁ ἄνθρωπος
  choice: huyu hapa mtu
  rationale: Usemi huu unamwelekeza Yesu mahususi mbele ya umati na unasikika kwa asili katika Kiswahili. Neno “mtu” linahifadhi maana ya ἄνθρωπος bila kuingiza ufafanuzi mpana wa kiteolojia.
theological_decisions:
- issue: Jinsi ya kutafsiri ὁ ἄνθρωπος katika tangazo la Pilato
  choice: huyu hapa mtu
  alternative: mtu huyo / mwanadamu
  rationale: Kauli inamhusu Yesu mahususi aliyeletwa mbele ya umati. “Huyu hapa mtu” huhifadhi uelekezaji wa moja kwa moja na hadhi yake kama mtu bila kuamua ikiwa kauli hiyo ina mwangwi mpana kuhusu uwakilishi wa wanadamu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya simulizi. Kauli ya mwisho imewekwa kwa lugha ya kawaida lakini yenye uzito wa tangazo la hadharani.
