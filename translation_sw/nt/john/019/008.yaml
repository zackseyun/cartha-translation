lexical_decisions:
- source_word: Ὅτε οὖν
  choice: Basi ... alipo-
  rationale: Muundo huu unaunganisha simulizi kwa kawaida na kuonyesha wakati wa tendo bila kulazimisha maana nzito ya kisababishi kwa οὖν.
- source_word: ἤκουσεν
  choice: aliposikia
  rationale: Kitenzi 'kusikia' kinafaa kwa kupokea kauli iliyotangulia katika muktadha huu.
- source_word: ὁ Πιλᾶτος
  choice: Pilato
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili cha Biblia.
- source_word: τοῦτον τὸν λόγον
  choice: maneno hayo
  rationale: Katika muktadha, λόγος hurejelea kauli iliyotangulia, si neno moja tu. 'Maneno hayo' ni ya asili na yanaeleweka kwa urahisi katika Kiswahili.
- source_word: μᾶλλον
  choice: hata zaidi
  rationale: Huonyesha wazi kwamba hofu ya Pilato iliongezeka ikilinganishwa na hali yake ya awali.
- source_word: ἐφοβήθη
  choice: aliogopa
  rationale: Kiswahili 'aliogopa hata zaidi' huwasilisha kwa kawaida kuongezeka kwa hofu ambako kunatokana na muunganiko wa kitenzi na μᾶλλον.
theological_decisions:
- issue: Asili ya hofu ya Pilato
  choice: Kutaja tu kwamba hofu yake iliongezeka
  alternative: Kufafanua hofu kuwa ya kisiasa, ya ushirikina, au ya kitheolojia
  rationale: Kigiriki hakielezi sababu au aina ya hofu ya Pilato; tafsiri inahifadhi mvutano huo wa kisimulizi bila kuutatua.
