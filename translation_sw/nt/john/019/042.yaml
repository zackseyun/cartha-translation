  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐκεῖ οὖν διὰ τὴν παρασκευὴν τῶν Ἰουδαίων, ὅτι ἐγγὺς ἦν τὸ μνημεῖον, ἔθηκαν τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/042.yaml
  text: So there[a], because of the Jews’ day of preparation, since the tomb was nearby, they laid Jesus there.
translation:
  language: sw
  text: Basi, kwa sababu ilikuwa siku ya Maandalizi ya Wayahudi[a], na kwa kuwa kaburi lilikuwa karibu, wakamweka Yesu humo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa sababu ya siku ya Maandalizi ya Wayahudi,” au “kwa sababu yalikuwa Maandalizi ya Wayahudi.”
    reason: Neno παρασκευή linaweza kueleweka kama jina la siku ya maandalizi au kama istilahi maalumu, “Maandalizi”; muundo wa Kigiriki pia unaweza kutafsiriwa bila kuongeza kitenzi “ilikuwa.”
lexical_decisions:
- source_word: ἐκεῖ
  choice: humo
  rationale: Kielezi hiki kinaonyesha mahali walipomzika Yesu. “Humo” hurejelea kwa kawaida ndani ya kaburi lililotajwa na kinafaa katika muktadha huu.
- source_word: οὖν
  choice: Basi
  rationale: Huunganisha hitimisho au mwendelezo wa simulizi na yaliyotangulia; “Basi” ni kiunganishi cha kawaida na chenye hadhi katika Kiswahili.
- source_word: διὰ τὴν παρασκευὴν
  choice: kwa sababu ilikuwa siku ya Maandalizi
  rationale: διά pamoja na hali ya kushutumiwa huonyesha sababu. παρασκευή hapa ni istilahi ya siku ya maandalizi kabla ya Sabato; muundo huu unaeleweka kwa msomaji wa sasa bila kuifanya kuwa dai maalumu zaidi la kalenda.
- source_word: τῶν Ἰουδαίων
  choice: ya Wayahudi
  rationale: Inahifadhi uhusiano wa kimilikishi wa Kigiriki bila kuamua zaidi ikiwa msisitizo ni wa kikabila, kidini, au kimila.
- source_word: ὅτι
  choice: na kwa kuwa
  rationale: Huanzisha sababu ya ziada ya kuchagua kaburi hilo. “Na kwa kuwa” huonyesha vizuri uhusiano wa kisababishi katika sentensi ya Kiswahili.
- source_word: ἐγγὺς
  choice: karibu
  rationale: Huonyesha kwamba kaburi halikuwa mbali na mahali pa kusulubiwa.
- source_word: μνημεῖον
  choice: kaburi
  rationale: Katika muktadha wa maziko, “kaburi” ndilo neno la kawaida na sahihi kwa mahali palipotayarishwa kuuweka mwili.
- source_word: ἔθηκαν
  choice: wakamweka
  rationale: Kitenzi τίθημι hapa humaanisha kumweka Yesu kaburini; “wakamweka” ni cha kawaida na hudumisha mwendelezo wa simulizi.
- source_word: τὸν Ἰησοῦν
  choice: Yesu
  rationale: Ni mtendwa wa kitenzi, kwa kutumia umbo la kawaida la jina hilo katika Kiswahili.
theological_decisions:
- issue: Maana ya παρασκευή katika simulizi la mateso
  choice: siku ya Maandalizi
  alternative: Maandalizi; siku ya kuandaa
  rationale: Neno la Kigiriki linaweza kutumiwa kama jina maalumu la siku ya kujiandaa kabla ya Sabato. “Siku ya Maandalizi” hufafanua maana kwa msomaji wa sasa huku ikihifadhi istilahi ya kihistoria bila kubainisha madai ya ziada ya kalenda.
- issue: Uhusiano wa τῶν Ἰουδαίων na παρασκευή
  choice: ya Wayahudi
  alternative: ya Kiyahudi; Maandalizi ya Wayahudi
  rationale: Uamuzi huu unafuata genitivi ya Kigiriki na haulegezi wala haukazi zaidi ya andiko namna usemi huo unavyohusiana na Wayahudi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imetengenezwa upya kidogo kwa ufasaha wa Kiswahili, huku sababu mbili za Kigiriki zikibaki wazi. “Humo” mwishoni huwakilisha ἐκεῖ na kurejelea ndani ya kaburi.
