  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Μετὰ ⸀δὲ ταῦτα ἠρώτησεν τὸν Πιλᾶτον Ἰωσὴφ ⸀ἀπὸ Ἁριμαθαίας, ὢν μαθητὴς τοῦ Ἰησοῦ κεκρυμμένος δὲ διὰ τὸν φόβον τῶν Ἰουδαίων, ἵνα ἄρῃ τὸ σῶμα τοῦ Ἰησοῦ· καὶ ἐπέτρεψεν ὁ Πιλᾶτος. ἦλθεν οὖν καὶ ἦρεν τὸ σῶμα ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/038.yaml
  text: After these things[a], Joseph from Arimathea, being a disciple of Jesus but having kept it hidden because of fear of the Jews, asked Pilate that he might take away the body of Jesus. And Pilate gave permission. So he came and took away his body.
translation:
  language: sw
  text: Baada ya hayo, Yosefu kutoka Arimathaya, ambaye alikuwa mwanafunzi wa Yesu lakini alikuwa amelificha jambo hilo kwa kuwaogopa Wayahudi[a], alimwomba Pilato amruhusu kuuondoa mwili wa Yesu. Pilato akampa ruhusa. Basi Yosefu akaja na kuuondoa mwili wa Yesu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa maana mahususi zaidi katika muktadha huu, “viongozi au mamlaka za Kiyahudi.” Mara nyingi Yohana hutumia “Wayahudi” kuwarejelea wale waliompinga Yesu, wala si watu wote wa Kiyahudi bila ubaguzi.
    reason: Ufafanuzi wa rejeo lenye utata la Ἰουδαίων ili kuzuia kulielewa kama lawama kwa Wayahudi wote.
lexical_decisions:
- source_word: Μετὰ δὲ ταῦτα
  choice: Baada ya hayo
  rationale: Huhifadhi mpito wa wakati na wingi wa ταῦτα kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: Ἰωσὴφ ἀπὸ Ἁριμαθαίας
  choice: Yosefu kutoka Arimathaya
  rationale: Neno ἀπό linaonyesha asili au mahali alikotoka; “kutoka Arimathaya” linaakisi hilo moja kwa moja.
- source_word: ὢν μαθητὴς τοῦ Ἰησοῦ
  choice: ambaye alikuwa mwanafunzi wa Yesu
  rationale: Ni muundo wa asili wa Kiswahili unaowasilisha kirai-shirikishi cha Kigiriki bila kupoteza maana.
- source_word: κεκρυμμένος
  choice: alikuwa amelificha jambo hilo
  rationale: Hufanya wazi kwamba alichoficha ni hali yake ya kuwa mwanafunzi, huku ikihifadhi hali ya tendo lililokuwa limekwisha kufanyika na kuendelea kuwa na matokeo.
- source_word: διὰ τὸν φόβον τῶν Ἰουδαίων
  choice: kwa kuwaogopa Wayahudi
  rationale: Ni Kiswahili cha kawaida kinachoeleza sababu ya kuficha uanafunzi wake, bila kubadili rejeo lenye utata la Ἰουδαίων.
- source_word: ἵνα ἄρῃ τὸ σῶμα τοῦ Ἰησοῦ
  choice: ruhuma ya kuuondoa mwili wa Yesu
  rationale: Katika muktadha αἴρω humaanisha kuondoa au kuchukua mwili kwa maziko; kuongeza “ruhusa” kunapatana na ombi lililoelekezwa kwa Pilato.
- source_word: ἐπέτρεψεν
  choice: akampa ruhusa
  rationale: Huwasilisha wazi maana ya Pilato kukubali na kuruhusu ombi hilo.
- source_word: ἦλθεν οὖν καὶ ἦρεν τὸ σῶμα αὐτοῦ
  choice: Basi Yosefu akaenda na kuuondoa mwili wake
  rationale: “Basi” huonyesha matokeo au mfuatano wa οὖν; kutaja Yosefu huondoa utata wa kiwakilishi katika Kiswahili, na “mwili wake” huhifadhi αὐτοῦ.
theological_decisions:
- issue: Rejeo la τῶν Ἰουδαίων katika Injili ya Yohana
  choice: Wayahudi katika maandishi makuu, pamoja na tanbihi ya kufafanua muktadha
  alternative: viongozi wa Kiyahudi; Wayudea
  rationale: Kigiriki kinasema Ἰουδαίων, hivyo maandishi makuu hayapunguzi maana yake kwa tafsiri maalumu. Tanbihi inaonyesha kuwa katika muktadha huu huenda hasa ikawarejelea viongozi au mamlaka za Kiyahudi waliompinga Yesu, si Wayahudi wote bila ubaguzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo umeweka karibu maana ya Kigiriki huku ukitumia mtiririko wa kawaida wa Kiswahili.
