  text: Pilate answered[a], “What I have written, I have written.”
translation:
  language: sw
  text: Pilato akajibu, “Nilichoandika, nimeandika.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Niliyoandika, niliandika.” Kigiriki kinatumia wakati timilifu mara mbili, ambao unaweza kusisitiza kwamba alichoandika Pilato ni cha mwisho na kitaendelea kubaki hivyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: akajibu
  rationale: Kitenzi hiki katika simulizi humaanisha ‘alijibu.’ Kiambishi -ka- kinaendeleza mfuatano wa matukio kwa njia ya kawaida katika simulizi la Kiswahili.
- source_word: ὁ Πιλᾶτος
  choice: Pilato
  rationale: Jina la mtu limetolewa kwa umbo lake la kawaida katika Kiswahili; kibainishi cha Kigiriki hakihitaji kutafsiriwa.
- source_word: Ὃ
  choice: Nilicho-
  rationale: Kiwakilishi rejeshi cha Kigiriki kinatumika kijina kwa maana ya ‘kile ambacho/what.’ Muundo ‘nilichoandika’ ni wa kawaida na mfupi katika Kiswahili.
- source_word: γέγραφα
  choice: nimeandika
  rationale: Wakati timilifu wa Kiswahili unaonyesha tendo lililokamilika lenye matokeo yanayoendelea, hivyo unafaa kuwasilisha uzito wa kauli ya Pilato kwamba maandishi yameshawekwa na yatabaki hivyo.
theological_decisions:
- issue: Nguvu ya urudiaji wa wakati timilifu γέγραφα γέγραφα
  choice: “Nilichoandika, nimeandika.”
  alternative: “Niliyoandika, niliandika.”
  rationale: Tafsiri kuu inatumia ‘nimeandika’ katika kauli ya mwisho ili kuonyesha ukamilifu wa tendo na uamuzi usiobadilika. Sehemu ya kwanza inahitaji muundo rejeshi wa kawaida ‘nilichoandika,’ kwa hiyo haiwezi kurudia umbo lilelile bila kufanya Kiswahili kuwa kizito. Urudiaji wa maana na mkazo wa kauli ya Kigiriki bado umehifadhiwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni fupi, ya heshima, na ya kawaida katika simulizi. Muundo umehifadhi mkazo na uamuzi thabiti wa kauli ya Pilato bila kuongeza maelezo ndani ya matini.
