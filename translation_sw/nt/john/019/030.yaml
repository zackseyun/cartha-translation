  text: ὅτε οὖν ἔλαβεν τὸ ὄξος ὁ Ἰησοῦς εἶπεν· Τετέλεσται, καὶ κλίνας τὴν κεφαλὴν παρέδωκεν τὸ πνεῦμα.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/030.yaml
  text: So when Jesus had received the sour wine[a], he said, “It is finished,” and bowing his head[c][b], he gave up his spirit.
translation:
  language: sw
  text: Basi Yesu alipokwisha kuipokea ile divai chachu[a], alisema, “Imekwisha[b].” Na akainamisha kichwa, akaikabidhi roho yake[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “siki” au “siki ya divai.” Neno la Kigiriki ὄξος linamaanisha divai chachu.
    reason: lexical_alternative
  - marker: b
    text: Au “Imetimizwa” au “Imekamilika.”
    reason: lexical_alternative
  - marker: c
    text: Au “akavuta pumzi yake ya mwisho.” Kigiriki kinasema kihalisi zaidi, “akaikabidhi roho.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτε οὖν
  choice: Basi ... alipokwisha
  rationale: “Basi” linaendeleza mtiririko wa simulizi unaoonyeshwa na οὖν, huku “alipokwisha” likihifadhi uhusiano wa wakati unaoonyeshwa na ὅτε pamoja na tendo lililotangulia.
- source_word: ἔλαβεν
  choice: kuipokea
  rationale: Katika muktadha wa Yesu kupewa kinywaji kwa sifongo, “kuipokea” ni ya kawaida na sahihi kuliko “kuitwaa.”
- source_word: τὸ ὄξος
  choice: ile divai chachu
  rationale: ὄξος ni divai iliyokuwa chachu au siki ya divai. “Divai chachu” inaeleweka kwa urahisi na haileti picha ya siki ya kisasa pekee.
- source_word: Τετέλεσται
  choice: Imekwisha
  rationale: Kauli hii inahifadhi ukamilifu na matokeo yanayoendelea ya kitenzi cha wakati timilifu, bila kutaja wazi ni jambo gani lililokamilika.
- source_word: κλίνας τὴν κεφαλήν
  choice: akainamisha kichwa
  rationale: Hii ni Kiswahili cha kawaida kinachoonyesha tendo lililotangulia tendo kuu, bila kufanya sentensi kuwa nzito.
- source_word: παρέδωκεν
  choice: akaitoa
  rationale: Ingawa παραδίδωμι mara nyingi humaanisha kukabidhi au kutoa, hapa pamoja na “roho” inaeleza Yesu kutoa uhai wake katika kifo.
- source_word: τὸ πνεῦμα
  choice: roho yake
  rationale: Kigiriki kinasema kihalisi “roho,” na Kiswahili cha kawaida huhitaji kimilikishi “yake.” Neno “roho” linahifadhi maana pana zaidi kuliko “pumzi” pekee.
theological_decisions:
- issue: Iwapo παρέδωκεν τὸ πνεῦμα itafsiriwe kama nahau ya kufa tu au ihifadhi maneno yanayohusu roho ya Yesu.
  choice: akaitoa roho yake
  alternative: akavuta pumzi yake ya mwisho
  rationale: Tafsiri iliyochaguliwa inabaki karibu na maneno ya Kigiriki na inadumisha uzito wa tendo hilo na uwezekano wa kulielewa kama tendo la hiari, bila kuongeza ufafanuzi wa kimafundisho.
- issue: Maana mahususi ya Τετέλεσται na jambo linalosemwa kuwa limekamilika.
  choice: Imekwisha
  alternative: Imetimizwa; Imekamilika
  rationale: Kigiriki hakitaji wazi kiima au jambo lililokamilika. “Imekwisha” huhifadhi hali hiyo ya kutotajwa pamoja na maana ya ukamilifu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa simulizi ni wa asili, huku istilahi “roho yake” na utata wa “Imekwisha” vikihifadhiwa.
