  text: καὶ ὁ ἑωρακὼς μεμαρτύρηκεν, καὶ ἀληθινὴ ⸂αὐτοῦ ἐστιν⸃ ἡ μαρτυρία, καὶ ἐκεῖνος οἶδεν ὅτι ἀληθῆ λέγει, ἵνα ⸀καὶ ὑμεῖς ⸀πιστεύητε.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/035.yaml
  text: And the one who has seen has testified[a], and his testimony is true, and that one knows that he is telling the truth, so that you also may believe.
translation:
  language: sw
  text: Na yule aliyeona ametoa ushahidi, na ushahidi wake ni wa kweli. Huyo anajua kwamba anasema kweli, ili ninyi pia muamini.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ili ninyi pia mwendelee kuamini.” Kauli tegemezi ya wakati wa sasa katika Kigiriki inaweza kuwa na maana ya tendo linaloendelea.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ἑωρακὼς
  choice: yule aliyeona
  rationale: Huhifadhi muundo wa kirai nomino na nguvu ya shahidi aliyejionea, huku hali timilifu ikidokeza tendo lililotokea na umuhimu wake unaoendelea.
- source_word: μεμαρτύρηκεν
  choice: ametoa ushahidi
  rationale: Ni Kiswahili cha kawaida na chenye heshima kinachoeleza ushuhuda uliotolewa na wenye uhalali unaoendelea.
- source_word: ἀληθινὴ ... ἡ μαρτυρία
  choice: ushahidi wake ni wa kweli
  rationale: Hueleza moja kwa moja ukweli na uaminifu wa ushahidi bila kuufasiri zaidi ya maandishi.
- source_word: ἐκεῖνος
  choice: yeye huyo
  rationale: Huhifadhi msisitizo wa kiwakilishi cha kuonyesha katika Kigiriki na haimtambulishi shahidi huyo kwa jina.
- source_word: οἶδεν
  choice: anajua
  rationale: Ingawa umbo la Kigiriki ni timilifu, neno hili hutumika kwa maana ya hali ya sasa; ‘anajua’ ni tafsiri ya kawaida.
- source_word: ἀληθῆ λέγει
  choice: anasema kweli
  rationale: Ni usemi wa asili wa Kiswahili unaowasilisha maana ya kusema yaliyo ya kweli.
- source_word: ἵνα καὶ ὑμεῖς πιστεύητε
  choice: ili ninyi pia muamini
  rationale: ‘Ili’ huonyesha kusudi, ‘pia’ huhifadhi καί, na ‘muamini’ huacha wazi iwapo maana ni kuanza kuamini au kuendelea kuamini.
theological_decisions:
- issue: Anayerejelewa na viwakilishi vyenye msisitizo
  choice: Utambulisho wa shahidi haujaamuliwa; ametajwa kama ‘yule aliyeona’ na ‘yeye huyo’.
  alternative: Mwandishi au mwanafunzi aliyependwa anajirejelea kwa nafsi ya tatu; au anarejelea shahidi mwingine tofauti.
  rationale: Kigiriki hakimtambulishi shahidi waziwazi. Tafsiri inadumisha nafsi ya tatu na msisitizo bila kuingiza utambulisho maalumu.
- issue: Nguvu ya πιστεύητε
  choice: muamini
  alternative: mwendelee kuamini
  rationale: Kauli tegemezi ya wakati wa sasa katika Kigiriki inaweza kudokeza imani inayoendelea, lakini katika muktadha huu inaweza pia kueleza kuamini bila kubainisha mwendelezo. Maandishi makuu yanatumia usemi usioamua jambo hilo, na uwezekano wa mwendelezo unawekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imegawanywa mara mbili kwa usomaji wa kawaida, huku marudio ya ‘ushahidi’ na msisitizo wa ‘yeye huyo’ yakihifadhiwa.
