  yaml_path: translation/nt/john/017/017.yaml
  text: Sanctify them in the truth[a]; your word is truth.
translation:
  language: sw
  text: Watakase katika kweli; neno lako ni kweli[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “neno lako ndilo kweli.” Katika Kigiriki, nomino-arifu “kweli” haina artikeli; jambo hili linaweza kukazia sifa (“ni kweli”) badala ya utambulisho wa moja kwa moja.
    reason: alternative_reading
lexical_decisions:
- source_word: ἁγίασον
  choice: Watakase
  rationale: Kitenzi hiki cha amri kinaonyesha kuwaweka wakfu kwa Mungu na kuwafanya watakatifu. “Watakase” ni usemi wa kawaida wa kibiblia unaohifadhi pande zote mbili za maana hiyo.
- source_word: αὐτοὺς
  choice: wa-
  rationale: Kiambishi cha yambwa “wa-” kinawarejelea wanafunzi walio wengi na ni sawa na kiwakilishi cha Kigiriki.
- source_word: ἐν τῇ ἀληθείᾳ
  choice: katika kweli
  rationale: “Katika” huhifadhi upana wa ἐν, ambao unaweza kuonyesha mazingira au njia, bila kuifungia maana katika “kwa njia ya.” Nomino yenye kibainishi hapa inarejelea kweli inayotambulika katika muktadha.
- source_word: ὁ λόγος ὁ σὸς
  choice: neno lako
  rationale: “Neno” linawakilisha λόγος kama ujumbe wa Mungu, na “lako” hutafsiri umilikishi wa Kigiriki kwa Kiswahili cha kawaida.
- source_word: ἀλήθειά ἐστιν
  choice: ni kweli
  rationale: 'Kirai hiki huhifadhi nguvu ya sifa ya nomino ἀλήθεια isiyo na kibainishi: neno la Mungu ni kweli. Hakibadilishi nomino hiyo kuwa kivumishi tu kama “ni la kweli,” wala hakiongezi kwa lazima maana ya utambulisho kamili ya “ndilo ile kweli.”'
theological_decisions:
- issue: Iwapo ἀλήθεια katika kishazi cha pili itafsiriwe kwa maana ya sifa au utambulisho dhahiri
  choice: neno lako ni kweli
  alternative: neno lako ndilo ile kweli
  rationale: Kwa kuwa ἀλήθεια ni nomino-arifu isiyo na kibainishi, “ni kweli” huhifadhi uwezekano mkubwa wa maana ya sifa bila kupunguza dai la Yesu kwamba neno la Mungu lina tabia ya kweli. Chaguo la utambulisho dhahiri linawezekana, hivyo limeonyeshwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya maandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo ni mfupi na unafuata usambamba wa Kigiriki. Alama ya tanbihi [a] imewekwa baada ya “kweli” ya kwanza ili kuendana na safu ya marejeo iliyotolewa, ingawa maelezo yake yanahusu kishazi cha pili.
