  text: ὅτε ἤμην μετ’ ⸀αὐτῶν ἐγὼ ἐτήρουν αὐτοὺς ἐν τῷ ὀνόματί σου ⸀ᾧ δέδωκάς μοι, ⸀καὶ ἐφύλαξα, καὶ οὐδεὶς ἐξ αὐτῶν ἀπώλετο εἰ μὴ ὁ υἱὸς τῆς ἀπωλείας, ἵνα ἡ γραφὴ πληρωθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/012.yaml
  text: While I was with them[a], I kept them in your name, which you have given me, and I guarded them, and not one of them perished except the son of destruction[b], so that the Scripture might be fulfilled.
translation:
  language: sw
  text: Nilipokuwa pamoja nao, niliwahifadhi katika jina lako ulilonipa, nami nikawalinda; wala hakuna hata mmoja wao aliyeangamia isipokuwa mwana wa maangamizi[a], ili Andiko litimie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Mwana wa maangamizi” ni msemo wa mtindo wa Kiebrania; unaweza pia kutafsiriwa “yule aliyekusudiwa maangamizi” au, kwa mapokeo, “mwana wa upotevu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε ἤμην μετ’ αὐτῶν
  choice: Nilipokuwa pamoja nao
  rationale: Muundo huu wa Kiswahili unaonyesha hali iliyoendelea wakati Yesu alipokuwa pamoja na wanafunzi.
- source_word: ἐτήρουν αὐτοὺς
  choice: niliwalinda
  rationale: ‘Kulinda’ ni ya kawaida na hudokeza uangalizi endelevu; inatofautishwa na kitenzi kinachofuata kwa kutumia ‘kuhifadhi.’
- source_word: ἐν τῷ ὀνόματί σου
  choice: katika jina lako
  rationale: Tafsiri ya karibu huhifadhi upana wa maana ya ‘jina’ bila kuifafanua kimadhehebu kuwa mamlaka, nguvu, au tabia pekee.
- source_word: ᾧ δέδωκάς μοι
  choice: ulilonipa
  rationale: Kiwakilishi cha uhusiano cha kike katika Kiswahili kinakubaliana na ‘jina,’ kulingana na kiwakilishi cha Kigiriki cha umoja kisicho na jinsia kinachorejelea ὀνόματι.
- source_word: καὶ ἐφύλαξα
  choice: nami nikawahifadhi
  rationale: ‘Kuhifadhi’ hutenganisha φυλάσσω na τηρέω huku ikiendeleza maana ya kuwalinda dhidi ya hatari au upotevu.
- source_word: οὐδεὶς ἐξ αὐτῶν ἀπώλετο
  choice: wala hakuna hata mmoja wao aliyeangamia
  rationale: ‘Aliyeangamia’ hudumisha uzito wa ἀπώλετο; ‘aliyepotea’ ni mbadala halali lakini unaweza kueleweka kama kupotea njia tu.
- source_word: ὁ υἱὸς τῆς ἀπωλείας
  choice: mwana wa maangamizi
  rationale: Huhifadhi nahau ya Kisemiti kwa namna iliyo wazi katika Kiswahili bila kuamua ikiwa inaeleza tabia au hatima.
- source_word: ἵνα ἡ γραφὴ πληρωθῇ
  choice: ili Andiko litimie
  rationale: ‘Ili’ huhifadhi wazo la kusudi au matokeo, na ‘Andiko’ la umoja linafuata kifungu chenye kibainishi katika Kigiriki.
theological_decisions:
- issue: Kirejelewa cha ᾧ δέδωκάς μοι
  choice: 'Kishazi kinarejelea ‘jina lako’: ‘jina lako ulilonipa.’'
  alternative: 'Kukirejeza kwa wanafunzi: ‘wale ulionipa.’'
  rationale: Katika matini iliyotolewa, kiwakilishi cha Kigiriki ni cha umoja kisicho na jinsia na kinapatana kiasili na ὀνόματι, si αὐτούς ya wingi wa kiume.
- issue: Maana ya ὁ υἱὸς τῆς ἀπωλείας
  choice: mwana wa maangamizi
  alternative: yule aliyekusudiwa kuangamia; mwana wa upotevu
  rationale: Tafsiri rasmi huhifadhi nahau na mvutano wa kiteolojia bila kuipanua kuwa tamko mahususi kuhusu kuamuliwa tangu awali.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Niliwalinda’ na ‘nikawahifadhi’ hudumisha tofauti ya vitenzi viwili vya Kigiriki bila lugha nzito isiyo ya kawaida.
