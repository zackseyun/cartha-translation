  text: Οὐ περὶ τούτων δὲ ἐρωτῶ μόνον, ἀλλὰ καὶ περὶ τῶν πιστευόντων διὰ τοῦ λόγου αὐτῶν εἰς ἐμέ,
base_translation:
  language: en
  yaml_path: translation/nt/john/017/020.yaml
  text: I do not ask concerning these only[a], but also concerning those who believe in me through their word[b],
translation:
  language: sw
  text: Siombi kwa ajili ya hawa tu, bali pia kwa ajili ya wale wanaoniamini kwa njia ya ujumbe wao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa njia ya neno lao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρωτῶ
  choice: naomba
  rationale: Kitenzi hiki katika muktadha huu kinaeleza Yesu akimwomba Baba. “Naomba” ni cha kawaida na hakiongezi maana ya kiibada kwa kiwango ambacho “nasali” ingeweza kuongeza.
- source_word: περὶ τούτων
  choice: kwa ajili ya hawa
  rationale: περί pamoja na hali ya umilikaji huonyesha jambo au watu wanaohusika katika ombi. Kiswahili cha “kwa ajili ya hawa” ni cha asili katika muktadha wa kuwaombea watu, huku “hawa” kikidumisha rejeo lisilotajwa wazi zaidi.
- source_word: μόνον
  choice: tu
  rationale: “Tu” huweka kikomo cha ombi kwa Kiswahili cha kawaida na kwa ufupi.
- source_word: ἀλλὰ καὶ
  choice: bali pia
  rationale: Huhifadhi tofauti na nyongeza iliyomo katika muundo wa Kiyunani.
- source_word: τῶν πιστευόντων
  choice: wale wanaoniamini
  rationale: Kirai hiki hudumisha nguvu ya kitenzi cha kauli endelevu bila kuongeza wakati ujao ambao haujaonyeshwa wazi katika Kiyunani.
- source_word: διὰ τοῦ λόγου αὐτῶν
  choice: kwa njia ya ujumbe wao
  rationale: λόγος hapa hueleweka kiasili kuwa ujumbe au ushuhuda unaowafikisha wengine kwenye imani. “Kwa njia ya” huonyesha wazi dhima ya ujumbe huo kama njia.
- source_word: εἰς ἐμέ
  choice: wanaoniamini
  rationale: Muundo πιστεύω εἰς katika Yohana unaonyesha kumwamini mtu; Kiswahili cha kawaida huunganisha kiambishi cha yambwa katika “wanaoniamini.”
- source_word: Οὐ ... μόνον
  choice: Siombi ... tu
  rationale: Muundo huu huhifadhi ukanushi pamoja na kikomo cha ombi kwa Kiswahili cha asili.
theological_decisions:
- issue: Upeo wa ombi la Yesu zaidi ya wanafunzi waliokuwa pamoja naye
  choice: Maneno yanawahusisha wengine wanaomwamini Yesu kwa njia ya ujumbe wa wanafunzi, bila kutaja wazi wakati wao.
  alternative: 'Kutafsiri kwa wakati ujao: “wale watakaoniamini,” jambo linalowatambulisha wazi kuwa waamini wa baadaye.'
  rationale: Kauli ya Kiyunani τῶν πιστευόντων haina alama ya wazi ya wakati ujao. Kutumia “wanaoniamini” hudumisha uwezekano wa kuwahusisha waamini wa sasa na wa baadaye bila kupunguza maana pana ya ushuhuda wa wanafunzi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa urahisi. “Hawa” huacha rejeo kwa wanafunzi litokane na muktadha; “ujumbe wao” ni cha asili zaidi kuliko “neno lao,” ambalo limehifadhiwa katika tanbihi kwa ukaribu wa kileksia na λόγος.
