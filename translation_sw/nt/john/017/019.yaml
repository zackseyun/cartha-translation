  yaml_path: translation/nt/john/017/019.yaml
  text: And for their sake I sanctify myself[b][a], so that they also may be sanctified in truth.
translation:
  language: sw
  text: Na kwa ajili yao ninajiweka wakfu[a], ili wao pia wawe wamewekwa wakfu katika kweli[b].[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ninajitakasa.” Kitenzi cha Kigiriki kinatokana na mzizi uleule unaotumiwa baadaye katika mstari huu kwa maneno “wawe wamewekwa wakfu.”
    reason: lexical_alternative
  - marker: b
    text: Au, “katika ile kweli”; linganisha 17:17.
    reason: alternative_reading
  - marker: c
    text: Baadhi ya nakala za kale hazina maneno “ili wao pia wawe.”
    reason: textual_variant
lexical_decisions:
- source_word: ὑπὲρ αὐτῶν
  choice: kwa ajili yao
  rationale: Kirai hiki kinaeleza tendo linalofanywa kwa manufaa yao bila kulazimisha maana ya uwakilishi au ubadala.
- source_word: ἁγιάζω ἐμαυτόν
  choice: ninajiweka wakfu
  rationale: Katika muktadha huu, Yesu anajitenga na kujitoa kwa kazi takatifu kwa ajili ya wanafunzi wake; tafsiri hii huepuka kudokeza kwamba anatakaswa kutoka katika uchafu wa kimaadili.
- source_word: ἵνα
  choice: ili
  rationale: Huonyesha kusudi kwa njia ya kawaida na iliyo wazi katika Kiswahili.
- source_word: καὶ αὐτοὶ
  choice: wao pia
  rationale: Hudumisha msisitizo na wazo la wao kushirikishwa katika kuwekwa wakfu.
- source_word: ὦσιν ... ἡγιασμένοι
  choice: wawe wamewekwa wakfu
  rationale: Muundo huu unaonyesha hali iliyotokana na tendo lililofanyika na pia unadumisha uhusiano wa kileksika na ‘ninajiweka wakfu.’
- source_word: ἐν ἀληθείᾳ
  choice: katika kweli
  rationale: Hudumisha kutokuwapo kwa kibainishi katika Kigiriki na inaweza kueleza mazingira au uhalisi ambamo kuwekwa wakfu hutokea.
theological_decisions:
- issue: Maana ya Yesu kujiweka wakfu
  choice: Yesu anajitenga na kujitoa mwenyewe kwa kazi takatifu kwa manufaa ya wanafunzi wake.
  alternative: Yesu anajitakasa au anajifanya kuwa mtakatifu zaidi kimaadili.
  rationale: Muktadha unaelekeza kwenye kujiweka wakfu kwa utume, si kutoka katika uchafu wa kimaadili kwenda katika utakatifu.
- issue: Nguvu ya ἐν ἀληθείᾳ
  choice: katika kweli
  alternative: katika ile kweli; kwa njia ya kweli
  rationale: Kigiriki hakina kibainishi, kwa hiyo tafsiri haifanyi kirai hiki kuwa maalumu zaidi kuliko chanzo, huku ikihifadhi mwangwi wa Yohana 17:17.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. ‘Kujiweka wakfu’ ni ya kawaida katika sajili ya kidini na inalinda maana ya kujitenga kwa kusudi takatifu.
