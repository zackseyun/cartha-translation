id: JHN.17.15
reference: John 17:15
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: οὐκ ἐρωτῶ ἵνα ἄρῃς αὐτοὺς ἐκ τοῦ κόσμου ἀλλ’ ἵνα τηρήσῃς αὐτοὺς ἐκ τοῦ πονηροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/015.yaml
  text: I am not asking that you take them out of the world[a], but that you keep them from the evil one.
translation:
  language: sw
  text: Siombi kwamba uwaondoe ulimwenguni, bali kwamba uwalinde dhidi ya yule mwovu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uwalinde dhidi ya uovu.” Maneno ya Kigiriki τοῦ πονηροῦ yanaweza kumaanisha ama “yule mwovu” ama “uovu.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐρωτῶ
  choice: Siombi
  rationale: Katika muktadha wa sala ya Yesu, kitenzi cha wakati uliopo kinaelezwa kwa Kiswahili cha kawaida kama “siombi”; kinaonyesha ombi analolitoa sasa bila kutumia lugha nzito ya kidini.
- source_word: ἄρῃς
  choice: uwaondoe
  rationale: αἴρω hapa ina maana ya kuondoa au kuchukua kutoka mahali; “uwaondoe ulimwenguni” ni usemi wa asili unaolingana na ἐκ τοῦ κόσμου.
- source_word: κόσμου
  choice: ulimwenguni
  rationale: “Ulimwengu” huhifadhi upana wa κόσμος katika matumizi ya Yohana bila kuufafanua kupita kiasi kuwa jamii au mfumo wa wanadamu.
- source_word: τηρήσῃς
  choice: uwalinde
  rationale: τηρέω inaweza kumaanisha kutunza, kulinda, au kuhifadhi. Pamoja na ἐκ, “uwalinde dhidi ya” huwasilisha kwa uwazi dhana ya kuwahifadhi wasipatwe na madhara.
- source_word: ἐκ
  choice: dhidi ya
  rationale: Katika muundo τηρήσῃς ... ἐκ, maana ni ulinzi dhidi ya kitu; “dhidi ya” ni Kiswahili cha asili na hutofautisha kifungu hiki na “uwaondoe ulimwenguni.”
- source_word: τοῦ πονηροῦ
  choice: yule mwovu
  rationale: Kivumishi chenye kibainishi kinaweza kuwa cha kiume, “yule mwovu,” au cha kijinsia-kati, “uovu.” Muktadha wa maandishi ya Yohana unaunga mkono rejeo la kibinafsi, huku uwezekano mwingine ukihifadhiwa katika tanbihi.
theological_decisions:
- issue: Iwapo τοῦ πονηροῦ inamaanisha “uovu” usio wa kibinafsi au “yule mwovu” wa kibinafsi
  choice: yule mwovu
  alternative: uovu
  rationale: Umbo la Kigiriki lina utata wa kweli. Matumizi ya Yohana na muktadha wa ulinzi wa Mungu yanaelekeza kwenye rejeo la kibinafsi, lakini tanbihi inahifadhi maana nyingine bila kuondoa mvutano wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa moja kwa moja na unaeleweka kwa wasomaji wa kawaida; “Siombi” inafaa kwa sauti ya sala, na “yule mwovu” huhifadhi rejeo la kibinafsi linalowezekana.
