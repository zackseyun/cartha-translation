id: JHN.17.25
reference: John 17:25
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ⸀Πάτερ δίκαιε, καὶ ὁ κόσμος σε οὐκ ἔγνω, ἐγὼ δέ σε ἔγνων, καὶ οὗτοι ἔγνωσαν ὅτι σύ με ἀπέστειλας,
base_translation:
  language: en
  yaml_path: translation/nt/john/017/025.yaml
  text: Righteous Father[a], though the world has not known you, I have known you[b], and these have known that you sent me.
translation:
  language: sw
  text: Baba mwenye haki, ingawa ulimwengu[a] haukukujua, mimi nilikujua, na hawa walijua kwamba wewe ulinituma.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Katika Injili ya Yohana, “ulimwengu” mara nyingi humaanisha wanadamu walio mbali na Mungu, lakini neno hili lina maana pana zaidi pia.
    reason: cross_reference
  - marker: b
    text: Vitenzi vya Kigiriki vinavyotafsiriwa “haukukujua,” “nilikujua,” na “walijua” vyote viko katika wakati uliopita; maarifa hayo yana umuhimu unaoendelea katika muktadha wa sala hii.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάτερ δίκαιε
  choice: Baba mwenye haki
  rationale: Vocative address rendered naturally without the archaic-sounding “Ee.” The phrase “mwenye haki” preserves the moral and theological force of δίκαιος without limiting it to judicial fairness.
- source_word: καὶ ὁ κόσμος ... οὐκ ἔγνω, ἐγὼ δέ
  choice: ingawa ulimwengu haukukujua, mimi nilikujua
  rationale: The first καί is understood concessively in relation to the contrast marked by δέ. “Ingawa” makes that discourse relation clear in natural Swahili.
- source_word: ὁ κόσμος
  choice: ulimwengu
  rationale: This retains the broad and layered Johannine term rather than narrowing it to “watu wa ulimwengu” or an explicitly evil world-system.
- source_word: ἔγνω / ἔγνων / ἔγνωσαν
  choice: haukukujua / nilikujua / walijua
  rationale: Simple past forms closely reflect the Greek aorists and are clear, idiomatic Swahili. Repeating forms of kujua preserves the source’s lexical pattern and its relational-cognitive breadth.
- source_word: οὗτοι
  choice: hawa
  rationale: The demonstrative is retained without adding “wanafunzi,” although Jesus’ followers are the contextual referents.
- source_word: σύ με ἀπέστειλας
  choice: wewe ulinituma
  rationale: The explicit pronoun “wewe” reflects the expressed Greek σύ, while “ulinituma” naturally renders the aorist verb.
theological_decisions:
- issue: The Father’s attribute δίκαιε
  choice: Baba mwenye haki
  alternative: Baba wa haki; Baba mwadilifu
  rationale: “Mwenye haki” is dignified and broad enough to include moral rightness without reducing the term to fairness or making righteousness sound merely adjectival in a modern secular sense.
- issue: Meaning of κόσμος in John
  choice: ulimwengu
  alternative: watu wa ulimwengu; mfumo wa ulimwengu
  rationale: The source term can evoke humanity estranged from God while retaining wider Johannine resonances. The main text preserves that breadth.
- issue: Aspect of the aorist forms of γινώσκω
  choice: simple past forms throughout the knowing clauses
  alternative: haujakujua / nimekujua / wamejua
  rationale: The Greek uses aorists throughout. Swahili simple past represents these consistently and naturally, while a footnote acknowledges that the knowledge remains relevant in the prayer’s setting.
- issue: Identity of οὗτοι
  choice: hawa
  alternative: wanafunzi hawa; watu hawa
  rationale: The context points to Jesus’ followers, but the Greek itself uses only a demonstrative. Retaining “hawa” avoids inserting an interpretive noun.
translation_notes:
  register: Standard East African Swahili in a current, dignified register. The wording avoids archaic vocative particles and denominational terminology. Clause order and repeated kujua forms preserve the source’s contrast and rhetorical pattern.
