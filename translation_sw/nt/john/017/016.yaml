  yaml_path: translation/nt/john/017/016.yaml
  text: They are not from the world[a], just as I am not from the world.
translation:
  language: sw
  text: Wao si wa ulimwengu[a], kama vile mimi nisivyo wa ulimwengu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hawatokani na ulimwengu.” Kirai cha Kigiriki kinaweza kuonyesha chanzo au asili, na pia uhusiano au kuwa sehemu ya kitu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ
  choice: wa
  rationale: Katika muundo wa Kiswahili ‘kuwa wa ulimwengu,’ ‘wa’ huweza kueleza asili, uhusiano, au kuwa sehemu ya ulimwengu; ni ya kawaida zaidi kuliko tafsiri ya moja kwa moja ‘kutoka ulimwenguni.’
- source_word: κόσμου
  choice: ulimwengu
  rationale: Neno rahisi ‘ulimwengu’ linahifadhi upana wa κόσμος katika Yohana bila kulifafanua kuwa mfumo fulani au mpangilio uliopotoka.
- source_word: οὐκ εἰσὶν
  choice: si
  rationale: Ni ukanushi wa sasa wa nafsi ya tatu wingi, unaolingana kwa kawaida na ‘hawako/si’; hapa ‘si wa’ ni Kiswahili fasaha.
- source_word: καθὼς
  choice: kama vile
  rationale: Huonyesha ulinganisho ulio wazi kati yao na Yesu kwa lugha ya sasa na ya kawaida.
- source_word: ἐγὼ
  choice: mimi
  rationale: Kiwakilishi cha wazi kinahifadhi mkazo wa ἐγώ ndani ya ulinganisho.
- source_word: οὐκ εἰμὶ
  choice: nisivyo
  rationale: Muundo ‘kama vile mimi nisivyo’ ni wa kawaida katika Kiswahili na unawasilisha ukanushi wa nafsi ya kwanza ndani ya ulinganisho.
- source_word: ἐκ τοῦ κόσμου
  choice: wa ulimwengu
  rationale: Kirai kimerudiwa kwa namna ileile katika vishazi vyote. Kiswahili ‘wa ulimwengu’ huhifadhi maana ya asili au uhusiano, huku ‘kutoka ulimwenguni’ ikiweza kusikika zaidi kama mwendo wa mahali.
theological_decisions:
- issue: Maana ya ‘ulimwengu’ katika teolojia ya Yohana
  choice: Kubaki na ‘ulimwengu’ bila ufafanuzi wa ziada katika matini kuu.
  alternative: mfumo wa ulimwengu; mpangilio wa sasa uliopotoka
  rationale: κόσμος lina kina cha kiteolojia katika Yohana, lakini mstari huu haulazimishi ufafanuzi mwembamba. Neno rahisi linahifadhi utata na mvutano wa matini.
- issue: 'Upeo wa ἐκ: asili au kuwa sehemu ya kitu'
  choice: Kutumia ‘wa’ katika matini na kueleza ‘kutoka’ katika tanbihi.
  alternative: kutoka ulimwenguni
  rationale: ‘Wa ulimwengu’ ni Kiswahili cha asili kinachoweza kueleza kuwa sehemu ya ulimwengu au kupata utambulisho humo; tanbihi inadumisha maana ya msingi ya chanzo/asili iliyo katika ἐκ.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo wa kulinganisha umehifadhiwa, na kirai kilekile ‘wa ulimwengu’ kimetumiwa katika sehemu zote mbili ili kuakisi urudiaji wa Kigiriki.
