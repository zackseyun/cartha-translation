id: JHN.17.3
reference: John 17:3
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: αὕτη δέ ἐστιν ἡ αἰώνιος ζωὴ ἵνα γινώσκωσι σὲ τὸν μόνον ἀληθινὸν θεὸν καὶ ὃν ἀπέστειλας Ἰησοῦν Χριστόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/003.yaml
  text: 'And this is eternal life: that they may know you[a], the only true God, and Jesus the Messiah whom you sent.'
translation:
  language: sw
  text: 'Na uzima wa milele ndio huu: kwamba wakujue wewe, Mungu wa kweli, wa pekee, na Yesu Masihi[a] uliyemtuma.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya jadi, “Yesu Kristo.” Neno la Kigiriki Χριστός linaweza kutumiwa kama cheo (“Masihi”) au, katika baadhi ya mazingira, kama jina-cheo (“Kristo”).
    reason: Usomaji mbadala unaodumisha uwezekano wa Χριστός kuwa cheo au jina-cheo.
lexical_decisions:
- source_word: αὕτη δέ ἐστιν
  choice: Na ... ndio huu
  rationale: Muundo huu unaendeleza wazo kwa nguvu ya δέ na kulitambulisha jambo linalofafanuliwa, huku ukisomeka kwa Kiswahili cha kawaida.
- source_word: ἡ αἰώνιος ζωὴ
  choice: uzima wa milele
  rationale: Huu ndio usemi wa kawaida na unaoeleweka kwa dhana ya Kiyohana ya uzima wa enzi ijayo wenye kudumu.
- source_word: ἵνα γινώσκωσι
  choice: kwamba wakujue
  rationale: ἵνα hapa inafafanua yaliyomo katika uzima wa milele; hali ya utegemezi katika ‘wakujue’ inadumisha umbo la subjunktivi bila kuufanya usemi kuwa wa kusudi tu.
- source_word: σὲ
  choice: wewe
  rationale: Ni yambwa ya γινώσκωσι na inamrejelea Baba anayeombwa na Yesu.
- source_word: τὸν μόνον ἀληθινὸν θεὸν
  choice: Mungu wa pekee wa kweli
  rationale: Inahifadhi madai kwamba anayezungumziwa ndiye Mungu pekee wa kweli, kwa mpangilio wa Kiswahili ulio wazi na wa asili.
- source_word: καὶ
  choice: na
  rationale: Inaunganisha kwa urahisi Baba na Yesu aliyetumwa bila kuongeza ufafanuzi wa kiteolojia usiomo katika sentensi.
- source_word: ὃν ἀπέστειλας
  choice: uliyemtuma
  rationale: Kishazi rejeshi kinamtambulisha Yesu kwa uhusiano na utume aliopokea kutoka kwa Baba; wakati uliopita unalingana na aoristi.
- source_word: Ἰησοῦν Χριστόν
  choice: Yesu Masihi
  rationale: Masihi linadumisha maana ya cheo cha Χριστός katika muktadha huu, huku ‘Yesu Kristo’ ikihifadhiwa katika tanbihi kama tafsiri ya jadi na inayoweza kuwa jina-cheo.
theological_decisions:
- issue: Uhusiano wa maneno ‘Mungu wa pekee wa kweli’ na Yesu
  choice: Kumwacha Baba aitwe moja kwa moja ‘Mungu wa pekee wa kweli,’ huku Yesu akitofautishwa kuwa yule aliyetumwa.
  alternative: Kuongeza maneno yanayoeleza wazi fundisho la Utatu au kulegeza tofauti ya kisintaksia kati ya Baba na Yesu.
  rationale: Tafsiri inapaswa kudumisha maneno na mvutano wa kiteolojia wa aya yenyewe bila kutatua kwa nyongeza mijadala ya baadaye.
- issue: Tafsiri ya Χριστόν
  choice: Masihi
  alternative: Kristo
  rationale: Katika muktadha huu maana ya cheo bado inasikika; hata hivyo, uwezekano wa matumizi yaliyo kama jina-cheo unadumishwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni wazi kwa msomaji wa kawaida; ‘wakujue’ huhifadhi hali ya kumjua kwa uhusiano na kwa kuendelea, bila kuiongeza wazi katika matini.
