  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ νῦν δόξασόν με σύ, πάτερ, παρὰ σεαυτῷ τῇ δόξῃ ᾗ εἶχον πρὸ τοῦ τὸν κόσμον εἶναι παρὰ σοί.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/005.yaml
  text: And now[a], Father[b], glorify me in your presence with the glory that I had with you before the world existed.
translation:
  language: sw
  text: Na sasa, wewe Baba, unitukuze mbele zako[a] kwa utukufu niliokuwa nao pamoja nawe kabla ulimwengu haujakuwapo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “pamoja nawe.” Kirai cha Kigiriki kinaweza kumaanisha kwa uhalisi zaidi kuwa karibu na Baba.
    reason: lexical_alternative
  - marker: b
    text: Au, “kabla ulimwengu haujakuwepo” au “kabla ulimwengu haujaanza kuwapo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δόξασόν
  choice: unitukuze
  rationale: Kitenzi hiki kinahifadhi msamiati wa Kiyohana wa utukufu na ombi la Mwana kutukuzwa na Baba; ‘uniheshimu’ kingepunguza uzito wake wa kiteolojia.
- source_word: παρὰ σεαυτῷ
  choice: mbele zako
  rationale: παρά pamoja na hali ya dative huonyesha ukaribu au kuwapo mbele ya mtu. ‘Mbele zako’ ni Kiswahili cha kawaida kinachohifadhi maana hiyo ya kimahusiano na kimahali.
- source_word: τῇ δόξῃ
  choice: kwa utukufu
  rationale: Dative inaunganisha kutukuzwa na utukufu unaofafanuliwa katika kishazi kinachofuata. ‘Kwa utukufu’ ni muundo wa kawaida na wazi katika Kiswahili.
- source_word: ᾗ εἶχον
  choice: niliokuwa nao
  rationale: Imperfect εἶχον inaonyesha kwamba Yesu alikuwa na utukufu huo kabla; muundo huu wa Kiswahili unaeleza umilikaji wa wakati uliopita kwa kawaida.
- source_word: πρὸ τοῦ τὸν κόσμον εἶναι
  choice: kabla ulimwengu haujakuwapo
  rationale: Muundo wa infinitive wenye article unaonyesha wakati uliotangulia. Tafsiri hii inahifadhi maana ya kuwapo kwa ulimwengu bila kuongeza maelezo.
- source_word: παρὰ σοί
  choice: pamoja nawe
  rationale: παρά pamoja na dative inaonyesha ukaribu na ushirika. ‘Pamoja nawe’ ni fupi, ya asili, na inafaa kwa muktadha wa uhusiano na Baba.
- source_word: σύ, πάτερ
  choice: wewe Baba
  rationale: Kiwakilishi σύ kimetajwa wazi kwa msisitizo. ‘Wewe Baba’ kinahifadhi msisitizo huo kwa Kiswahili cha sala bila kuufuta.
- source_word: κόσμον
  choice: ulimwengu
  rationale: ‘Ulimwengu’ ndilo neno la kawaida na linalofaa kwa κόσμος katika muktadha huu.
theological_decisions:
- issue: Kuwapo kwa Mwana kabla ya ulimwengu kunakodokezwa na mstari
  choice: Kishazi cha wakati kimetafsiriwa moja kwa moja kuwa Yesu alikuwa na utukufu pamoja na Baba kabla ulimwengu haujakuwapo.
  alternative: Kupunguza kauli hiyo na kuifanya irejelee tu utukufu uliokusudiwa baadaye.
  rationale: Kigiriki kinaeleza wazi utukufu ambao Yesu alikuwa nao pamoja na Baba kabla ya kuwapo kwa ulimwengu. Tafsiri haipaswi kupunguza wala kupanua dai hilo.
- issue: Asili ya ‘utukufu’ alio nao pamoja na Baba
  choice: Neno ‘utukufu’ limehifadhiwa bila ufafanuzi wa ziada.
  alternative: Fahari au heshima.
  rationale: Mstari unasema kwamba utukufu huo ulikuwa pamoja na Baba lakini hauufafanui zaidi hapa. ‘Utukufu’ huhifadhi msamiati na mvutano wa kiteolojia wa Yohana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi inayofaa sala. Muundo ‘wewe Baba’ unahifadhi msisitizo wa kiwakilishi cha Kigiriki; ‘mbele zako’ na ‘pamoja nawe’ zinatofautisha kwa kawaida vifungu viwili vya παρά huku zikihifadhi uhusiano wao wa maana.
