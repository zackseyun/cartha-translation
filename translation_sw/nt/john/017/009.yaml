  yaml_path: translation/nt/john/017/009.yaml
  text: I am asking on their behalf[a]. I am not asking on behalf of the world, but on behalf of those whom you have given me[b], because they are yours.
translation:
  language: sw
  text: Mimi ninawaombea. Siuombei ulimwengu, bali ninawaombea wale ulionipa, kwa sababu wao ni wako.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐρωτῶ
  choice: ninawaombea / siuombei
  rationale: Kitenzi cha Kigiriki kimsingi ni ‘kuomba’ au ‘kusihi’; katika muktadha wa Yesu akizungumza na Baba kuhusu wengine, ‘kuwaombea’ ni Kiswahili cha kawaida na huonyesha ombi kwa ajili yao bila kutumia msamiati wa kidhehebu.
- source_word: περὶ αὐτῶν
  choice: ninawaombea wao
  rationale: περί pamoja na kitenzi cha kuomba hapa inaweza kumaanisha ‘kuhusu’ au ‘kwa ajili ya.’ ‘Kuwaombea’ huwasilisha vizuri maana ya uombezi katika Kiswahili; ‘wao’ imebaki ili kudumisha mkazo wa kiwakilishi cha Kigiriki.
- source_word: κόσμου
  choice: ulimwengu
  rationale: Neno limeachwa kwa upana wake wa Kiyohana bila kulifafanua kuwa wanadamu wote au mfumo wa uovu.
- source_word: ὧν δέδωκάς μοι
  choice: wale ulionipa
  rationale: Huwataja watu waliotolewa kwa Mwana kwa usemi wa kawaida wa Kiswahili. Muundo ‘ulionipa’ unaonyesha tendo lililokamilika ambalo matokeo yake yanaendelea katika muktadha.
- source_word: ὅτι
  choice: kwa sababu
  rationale: 'Huonyesha wazi sababu ya Yesu kuwaombea: wao ni wa Baba.'
- source_word: σοί εἰσιν
  choice: wao ni wako
  rationale: Ni tafsiri ya moja kwa moja inayohifadhi maana ya uhusiano na umiliki, huku kiwakilishi ‘wao’ kikitoa mkazo wa asili.
- source_word: ἐγὼ
  choice: Mimi
  rationale: Kiwakilishi huru kimehifadhiwa ili kuonyesha mkazo wa ἐγώ na kuanzisha utofautishaji unaofuata.
- source_word: ἀλλὰ
  choice: bali
  rationale: '‘Bali’ huonyesha kwa kawaida utofautishaji mkali baada ya kauli hasi: si ulimwengu, bali wale aliopewa.'
theological_decisions:
- issue: Iwapo ἐρωτῶ itafsiriwe kwa lugha ya sala iliyo wazi
  choice: ninawaombea
  alternative: ninaomba kuhusu wao / ninaomba kwa ajili yao
  rationale: Ingawa maana ya msingi ya ἐρωτάω ni kuomba au kusihi, muktadha ni Yesu akimwelekea Baba kwa ajili ya wengine. ‘Ninawaombea’ ni ya asili na yenye maana hiyo, bila kuingiza desturi maalumu ya kidhehebu.
- issue: Upeo wa maana ya ‘ulimwengu’
  choice: ulimwengu
  alternative: wanadamu kwa ujumla / mfumo wa ulimwengu usioamini
  rationale: κόσμος katika Yohana ina wigo wa maana unaotegemea muktadha. Tafsiri haibani maana hapa, hivyo inadumisha mvutano wa kitheolojia uliopo kati ya ulimwengu na wale ambao Baba amempa Mwana.
- issue: Maana ya περί katika ombi hili
  choice: kwa ajili yao, ikionyeshwa na ‘ninawaombea’
  alternative: kuhusu wao
  rationale: Katika muktadha wa ombi kwa Baba, περί inaweza kuonyesha jambo linalohusu watu hao au ombi kwa ajili yao. Maandishi yametumia maana ya uombezi, huku tanbihi ikihifadhi uwezekano wa ‘kuhusu wao.’
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Mimi’ na ‘wao’ zimetumiwa kwa mkazo licha ya alama za nafsi tayari kuwamo katika vitenzi. Kitenzi ‘kuwaombea’ kimechaguliwa kwa ufasaha wa Kiswahili na maana ya uombezi; utata wa περί umehifadhiwa katika tanbihi.
