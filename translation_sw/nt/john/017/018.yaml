  yaml_path: translation/nt/john/017/018.yaml
  text: Just as you sent me into the world, I also sent them into the world.
translation:
  language: sw
  text: Kama vile ulivyonituma ulimwenguni, nami niliwatuma ulimwenguni.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθὼς
  choice: Kama vile
  rationale: Huonyesha ulinganisho kati ya Baba kumtuma Yesu na Yesu kuwatuma wanafunzi wake, kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: ἐμὲ
  choice: -ni- katika “ulivyonituma”
  rationale: Ni yambwa ya kitenzi ἀπέστειλας; kiambishi cha Kiswahili huwasilisha maana ya “mimi” kwa njia ya asili.
- source_word: ἀπέστειλας
  choice: ulivyonituma
  rationale: Kitenzi “kutuma” kinahifadhi maana ya msingi na lugha ya utume katika Yohana bila kuongeza tafsiri ya “kuagiza rasmi.”
- source_word: εἰς τὸν κόσμον
  choice: ulimwenguni
  rationale: Huwasilisha mwendo wa kuingia katika ulimwengu kwa Kiswahili cha asili, huku neno “ulimwengu” likidumisha uzito wa matumizi ya Yohana.
- source_word: κἀγὼ
  choice: nami
  rationale: Huonyesha kwa ufupi na kwa asili nguvu ya καὶ ἐγώ, yaani “mimi pia,” na kudumisha ulinganifu wa vifungu.
- source_word: ἀπέστειλα
  choice: niliwatuma
  rationale: Neno lilelile la msingi, “kutuma,” limetumiwa ili kuhifadhi ulinganifu wa makusudi na tendo la Baba.
- source_word: αὐτοὺς
  choice: -wa- katika “niliwatuma”
  rationale: Kiambishi hiki kinawarejelea wanafunzi kwa njia ya kawaida katika Kiswahili.
- source_word: κόσμον
  choice: ulimwengu
  rationale: Ni tafsiri ya kawaida ya κόσμος na inadumisha mvutano wa kitheolojia wa utume ndani ya ulimwengu bila kuufafanua kupita kiasi.
theological_decisions:
- issue: Ulinganifu kati ya Baba kumtuma Mwana na Mwana kuwatuma wanafunzi
  choice: 'Kuhifadhi kitenzi kilekile cha msingi: “ulivyonituma ... niliwatuma.”'
  alternative: “ulivyonituma ... niliwapa agizo” au “niliwatuma kwa kazi maalumu”
  rationale: Kurudia “kutuma” kunadumisha ulinganifu wa maandishi bila kudai kwamba hadhi au namna ya utume wa wanafunzi ni sawa kabisa na utume wa kipekee wa Mwana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha asili na chenye hadhi. Muundo “Kama vile ulivyonituma” unaweka wazi ulinganisho; “ulimwenguni” ni wa kawaida na huhifadhi wazo la kuelekezwa ndani ya ulimwengu.
