  source_fidelity: 'Tafsiri inafuata kwa uaminifu mtiririko wa Kigiriki: mpito wa νῦν δέ, kuja kwa Yesu kwa Baba, usemi wake akiwa ulimwenguni, na kusudi la wanafunzi kuwa na furaha yake. Hata hivyo, “wawe na furaha yangu ikiwa imekamilika ndani yao” haisemi kwa ufasaha uhusiano wa πεπληρωμένην na furaha; Kigiriki husisitiza furaha kufikishwa kwenye utimilifu ndani yao.'
  naturalness: “Nikiwa ulimwenguni” ni ya kawaida na ya heshima katika Kiswahili sanifu. Badiliko la mwisho linafanya sehemu ya furaha iwe ya kawaida zaidi katika Kiswahili cha sasa na cha kibiblia.
  terminology: “Furaha yangu” huhifadhi vizuri umilikaji wa τὴν χαρὰν τὴν ἐμήν. “Itimizwe” ni kauli ya asili kwa furaha kufikishwa kwenye utimilifu; haiongezi tafsiri ya kidini. Tanbihi ya “miongoni mwao” si mbadala wa lazima wala ulio karibu zaidi wa ἐν ἑαυτοῖς katika muktadha huu, hivyo imeondolewa.
