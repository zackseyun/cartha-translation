  text: νῦν δὲ πρὸς σὲ ἔρχομαι, καὶ ταῦτα λαλῶ ἐν τῷ κόσμῳ ἵνα ἔχωσιν τὴν χαρὰν τὴν ἐμὴν πεπληρωμένην ἐν ⸀ἑαυτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/013.yaml
  text: But now I am coming to you[b][a], and I am speaking these things in the world so that they may have my joy fulfilled in themselves.
translation:
  language: sw
  text: Lakini sasa ninakuja kwako, na nasema mambo haya nikiwa ulimwenguni, ili furaha yangu itimizwe ndani yao.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νῦν δὲ
  choice: Lakini sasa
  rationale: “Sasa” huonyesha wakati wa sasa kwa kulinganisha na yaliyotangulia, na “lakini” huhifadhi badiliko lenye nguvu ndogo linaloletwa na δέ.
- source_word: πρὸς σὲ ἔρχομαι
  choice: ninakuja kwako
  rationale: Kauli hii huonyesha mwendo unaomwelekea Baba; wakati wa sasa wa Kiswahili unafaa katika muktadha wa sala na kurudi kwake kunakokaribia.
- source_word: ταῦτα λαλῶ
  choice: nasema mambo haya
  rationale: Hii ni kauli ya kawaida na ya wazi ya Kiswahili inayohifadhi tendo la Yesu la kuyatamka mambo haya.
- source_word: ἐν τῷ κόσμῳ
  choice: nikiwa ulimwenguni
  rationale: Muundo huu unaonyesha kwa njia ya kawaida kwamba Yesu anasema hayo akiwa bado katika ulimwengu, bila kuifanya κόσμος kuwa hadhira ya maneno yake.
- source_word: ἵνα ἔχωσιν
  choice: ili wawe na
  rationale: “Ili” huonyesha kusudi, na “wawe na” huhifadhi kitenzi cha kuwa na jambo badala ya kukifupisha kuwa hali tu.
- source_word: τὴν χαρὰν τὴν ἐμὴν
  choice: furaha yangu
  rationale: 'Huhifadhi moja kwa moja maana ya umilikaji: furaha ambayo ni ya Yesu.'
- source_word: πεπληρωμένην
  choice: ikiwa imekamilika
  rationale: Hueleza furaha iliyofikishwa kwenye ukamilifu na kubaki katika hali hiyo, kulingana na nguvu ya kauli timilifu tendwa.
- source_word: ἐν ἑαυτοῖς
  choice: ndani yao
  rationale: Hii kwa kawaida huonyesha furaha inayokuwamo na kuonwa ndani ya wanafunzi, huku uwezekano wa maana ya pamoja ukihifadhiwa katika tanbihi.
theological_decisions:
- issue: Maana ya “furaha yangu”
  choice: Furaha ni ya Yesu mwenyewe na inapaswa kuwamo kikamilifu ndani ya wanafunzi.
  alternative: Furaha kuhusu Yesu.
  rationale: Kiwakilishi ἐμὴν kwa kawaida huonyesha furaha iliyo ya Yesu; tafsiri haiongezi maelezo ya kidogma kuhusu namna wanavyoshiriki furaha hiyo.
- issue: Mahali pa ukamilifu wa furaha
  choice: ndani yao
  alternative: miongoni mwao
  rationale: ἐν ἑαυτοῖς inaweza kueleweka kuwa ndani ya kila mmoja au katika jumuiya yao; maana ya ndani ndiyo inayofaa zaidi katika muktadha, lakini nyingine imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “nikiwa ulimwenguni” umetumiwa kwa ufasaha ili kuonyesha mazingira ya Yesu aliposema maneno haya; “ikiwa imekamilika” huhifadhi wazo la furaha kufikishwa kwenye ukamilifu.
