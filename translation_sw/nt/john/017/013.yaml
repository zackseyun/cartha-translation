  - severity: low
    issue: Tanbihi ya “miongoni mwao” haina ulazima wa kutosha.
    rationale: Ingawa plural reflexive inaweza katika mazingira fulani kubeba wazo la pamoja, ἐν ἑαυτοῖς hapa kwa kawaida huelekea “ndani yao”; tanbihi inaweza kuelekeza msomaji kwenye maana isiyo ya kwanza bila sababu ya maandishi.
