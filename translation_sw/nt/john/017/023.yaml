  text: ἐγὼ ἐν αὐτοῖς καὶ σὺ ἐν ἐμοί, ἵνα ὦσιν τετελειωμένοι εἰς ἕν, ⸀ἵνα γινώσκῃ ὁ κόσμος ὅτι σύ με ἀπέστειλας καὶ ἠγάπησας αὐτοὺς καθὼς ἐμὲ ἠγάπησας.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/023.yaml
  text: I in them and you in me[a], so that they may be perfected into one, so that the world may know that you sent me and loved them just as you loved me.
translation:
  language: sw
  text: Mimi ndani yao, nawe ndani yangu, ili wakamilishwe kuwa kitu kimoja,[a] ili ulimwengu ujue kwamba ulinituma na kwamba uliwapenda kama ulivyonipenda mimi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakamilishwe katika umoja,” au “wafikishwe kwenye utimilifu wa kuwa kitu kimoja.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν αὐτοῖς / ἐν ἐμοί
  choice: ndani yao / ndani yangu
  rationale: Neno “ndani” linahifadhi lugha ya Yohana kuhusu kukaa ndani ya mwingine na halidhoofishi maana hiyo kuwa kuwapo tu miongoni mwao.
- source_word: τετελειωμένοι
  choice: wakamilishwe
  rationale: Hali ya tendo timilifu la kutendwa inaonyesha kufikishwa katika hali ya ukamilifu au utimilifu; hapa neno halifafanuliwi kwa lazima kuwa ukamilifu wa kutokuwa na dhambi.
- source_word: εἰς ἕν
  choice: wawe kitu kimoja
  rationale: Kiswahili hiki cha kawaida kinaonyesha matokeo au lengo la kufanywa mmoja, kulingana na εἰς pamoja na hali ya kushutumiwa.
- source_word: γινώσκῃ
  choice: ujue
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya kitenzi katika kishazi cha kusudi kinachoanza na ἵνα.
- source_word: κόσμος
  choice: ulimwengu
  rationale: Inahifadhi istilahi ya kawaida ya Yohana bila kuibana kimafasiri kuwa mfumo wa ulimwengu au watu wa ulimwengu.
- source_word: ἀπέστειλας
  choice: ulinituma
  rationale: “Kutuma” ni tafsiri ya asili na thabiti ya ἀποστέλλω katika Yohana, ikihifadhi wazo la utume bila maelezo ya ziada.
- source_word: ἠγάπησας
  choice: ulipenda / uliwapenda
  rationale: Inahifadhi urudiaji wa kitenzi kilekile cha Kigiriki na maana yake ya msingi ya kupenda.
- source_word: καθὼς
  choice: kama ... -vyo-
  rationale: Muundo “kama ulivyonipenda” unaonyesha ulinganisho wa kweli kwa Kiswahili cha kawaida bila kuupunguza wala kuupanua.
theological_decisions:
- issue: Nguvu ya ulinganisho katika kauli kwamba Baba aliwapenda wao kama alivyompenda Yesu
  choice: kama ulivyonipenda mimi
  alternative: kwa upendo wa aina ileile uliyonipenda nao
  rationale: Tafsiri ya moja kwa moja inahifadhi uzito na mvutano wa καθὼς bila kufafanua kiwango au namna ya ulinganisho zaidi ya maandiko.
- issue: Maana ya τετελειωμένοι katika muktadha
  choice: wakamilishwe wawe kitu kimoja
  alternative: wakamilike katika umoja
  rationale: Muundo huu unaonyesha kufikishwa kwenye utimilifu wenye lengo la umoja, bila kudai wazi kwamba waamini tayari wamefikia ukamilifu usio na dhambi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa kishazi cha kwanza umehifadhiwa kwa ukaribu ili kudumisha mkazo wa lugha ya Yohana; “mimi” ya mwisho imewekwa kwa msisitizo wa asili wa Kiswahili.
