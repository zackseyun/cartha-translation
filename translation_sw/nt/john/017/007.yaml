  text: Now they have come to know that everything you have given me is from you[a].
translation:
  language: sw
  text: Sasa wametambua kwamba kila kitu ulichonipa hutoka kwako.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kila kitu ambacho umenipa kinatoka kwako.”
    reason: Mbadala wa uundaji wa Kiswahili unaoeleza chanzo cha kila kitu alichopewa Yesu, bila kubadili maana ya msingi.
lexical_decisions:
- source_word: νῦν
  choice: Sasa
  rationale: Kielezi hiki huonyesha hatua ya sasa katika ufahamu wa wanafunzi; “Sasa” ni ya kawaida na ya moja kwa moja.
- source_word: ἔγνωκαν
  choice: wamekuja kujua
  rationale: Wakati timilifu unaonyesha kwamba walifikia ufahamu ambao matokeo yake yanaendelea sasa; “wamekuja kujua” huhifadhi mchakato na hali yake ya sasa.
- source_word: ὅτι
  choice: kwamba
  rationale: Kiunganishi cha kawaida kinachoanzisha yaliyomo katika jambo walilolijua.
- source_word: πάντα ὅσα
  choice: kila kitu
  rationale: Muungano huu huonyesha jumla ya vitu vyote; “kila kitu” ni Kiswahili cha asili na huhifadhi maana pana.
- source_word: δέδωκάς μοι
  choice: ulichonipa
  rationale: Muundo huu wa Kiswahili unaonyesha jambo ambalo Baba amempa Yesu na ambalo umuhimu wake unaendelea, bila kulazimisha matumizi yasiyo ya kawaida ya wakati timilifu.
- source_word: παρὰ σοῦ
  choice: kimetoka kwako
  rationale: παρά pamoja na hali ya umilikishi huonyesha chanzo au asili; “kimetoka kwako” huwasilisha wazi kwamba Baba ndiye chanzo.
- source_word: εἰσιν
  choice: kimetoka
  rationale: Ingawa kitenzi cha Kigiriki ni wingi, “kila kitu” katika Kiswahili huchukua upatanisho wa ngeli ya kitu kimoja, hivyo “kimetoka” ni cha kawaida.
theological_decisions:
- issue: Uhusiano kati ya vitu ambavyo Baba amempa Mwana na chanzo chake
  choice: 'Kifungu kimetafsiriwa kama kauli ya asili: “kila kitu ulichonipa kimetoka kwako.”'
  alternative: “kila kitu ambacho umenipa kinatoka kwako”
  rationale: Mstari unasisitiza kwamba Baba ndiye chanzo cha yote ambayo Mwana amepokea, bila kuongeza maelezo ya kimafundisho yasiyosemwa katika maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo “wamekuja kujua” umechaguliwa ili kuhifadhi nguvu ya wakati timilifu wa Kigiriki.
