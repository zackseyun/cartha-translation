id: JHN.17.26
reference: John 17:26
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἐγνώρισα αὐτοῖς τὸ ὄνομά σου καὶ γνωρίσω, ἵνα ἡ ἀγάπη ἣν ἠγάπησάς με ἐν αὐτοῖς ᾖ κἀγὼ ἐν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/026.yaml
  text: And I made your name known to them[a], and I will make it known, so that the love with which you loved me may be in them[c][b], and I in them.
translation:
  language: sw
  text: Nimewajulisha jina lako[a][b], nami nitalijulisha, ili upendo ulionipenda nao uwe ndani yao[c], nami niwe ndani yao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nimewafunulia jina lako, nami nitalifunua.”
    reason: lexical_alternative
  - marker: b
    text: “Jina lako” linamaanisha utambulisho na tabia ya Mungu kama alivyojifunua, si jina linalotamkwa tu.
    reason: cultural_note
  - marker: c
    text: Au, “miongoni mwao”; hata hivyo, “ndani yao” inadumisha vizuri zaidi dhamira ya kukaa ndani inayopatikana katika Injili ya Yohana.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγνώρισα
  choice: nimewajulisha
  rationale: Kitenzi hiki kinahifadhi maana ya kusababisha watu wajue, huku kauli ya hali timilifu ya Kiswahili ikieleza tendo lililofanywa lenye matokeo yanayoendelea katika muktadha huu.
- source_word: τὸ ὄνομά σου
  choice: jina lako
  rationale: Tafsiri hii inadumisha taswira halisi ya ‘jina’ bila kuibadili katika matini kuwa ‘tabia yako’ au ‘wewe ni nani.’
- source_word: γνωρίσω
  choice: nitalijulisha
  rationale: Wakati ujao umehifadhiwa, na kiambishi ‘-li-’ kinarejelea ‘jina lako’ kwa njia ya kawaida katika Kiswahili.
- source_word: ἵνα
  choice: ili
  rationale: ‘Ili’ huonyesha kusudi au matokeo yanayokusudiwa kwa lugha ya kawaida na yenye hadhi.
- source_word: ἡ ἀγάπη
  choice: upendo
  rationale: Hili ndilo neno la kawaida na linalofaa kwa ἀγάπη katika muktadha huu.
- source_word: ἣν ἠγάπησάς με
  choice: ulionipenda nao
  rationale: Muundo huu wa Kiswahili unaonyesha kwamba ni upendo ambao Baba alimtendea Mwana, na unahifadhi wazo la ‘upendo uliopenda nao.’
- source_word: ἐν αὐτοῖς
  choice: ndani yao
  rationale: ‘Ndani yao’ ni tafsiri ya moja kwa moja inayohifadhi dhamira ya Yohana ya kukaa ndani, bila kuamua kwamba maana ni ‘miongoni mwao.’
- source_word: ᾖ
  choice: uwe
  rationale: Kauli tegemezi baada ya ‘ili’ inawakilishwa kwa kawaida na umbo ‘uwe.’
- source_word: κἀγὼ ἐν αὐτοῖς
  choice: nami niwe ndani yao
  rationale: Kiswahili kinahitaji kitenzi kilichodokezwa katika Kigiriki; ‘niwe’ hukirudia kwa uwazi bila kuunda uhusiano mpya wa kisababu.
theological_decisions:
- issue: Maana ya ‘jina lako’ katika teolojia ya Yohana
  choice: Kudumisha ‘jina lako’ katika matini kuu.
  alternative: ‘tabia yako’ au ‘wewe ni nani’
  rationale: ‘Jina’ linahusu utambulisho na tabia ya Mungu kama alivyojifunua, lakini kulifafanua moja kwa moja katika matini kungeondoa kina na upana wa usemi wa asili.
- issue: Uhusiano wa upendo wa Mungu na Kristo kukaa ndani ya waamini
  choice: 'Kuwasilisha mambo hayo mawili kwa uratibu: ‘upendo ... uwe ndani yao, nami niwe ndani yao.’'
  alternative: Kufanya kukaa kwa Kristo kuwa sababu au ufafanuzi wa upendo kuwa ndani yao.
  rationale: Kigiriki kinaweka mambo haya pamoja bila kutaja wazi uhusiano wa kisababu; tafsiri haipaswi kuamua zaidi ya matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo ni wa asili bila kupunguza urudiaji na mvutano wa kiteolojia wa Kigiriki.
