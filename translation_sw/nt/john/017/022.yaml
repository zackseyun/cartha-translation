  text: κἀγὼ τὴν δόξαν ἣν δέδωκάς μοι δέδωκα αὐτοῖς, ἵνα ὦσιν ἓν καθὼς ἡμεῖς ⸀ἕν,
base_translation:
  language: en
  yaml_path: translation/nt/john/017/022.yaml
  text: And I have given them the glory that you have given me[a], so that they may be one, just as we are one.
translation:
  language: sw
  text: Nami nimewapa utukufu ule ulionipa,[a] ili wawe kitu kimoja, kama vile sisi tulivyo kitu kimoja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mimi pia nimewapa utukufu ule ulionipa.” Neno la Kigiriki κἀγώ linaweza kuwa na msisitizo wa nyongeza, “mimi pia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ
  choice: Nami
  rationale: Muungano wa καί + ἐγώ una maana ya kuunganisha na pia unaweza kuwa na msisitizo wa nyongeza. “Nami” ni Kiswahili cha asili kinachohifadhi mtiririko na uwezekano wa maana ya “mimi pia.”
- source_word: δόξαν
  choice: utukufu
  rationale: Katika Yohana, δόξα kwa kawaida hubeba maana nzito ya utukufu wa Mungu, si heshima ya kibinadamu pekee.
- source_word: ἣν δέδωκάς μοι
  choice: ule ulionipa
  rationale: Kiswahili hakina umbo linalolingana moja kwa moja na timilifu ya Kigiriki; “ulionipa” huwasilisha tendo lililotimia, huku muktadha ukionyesha matokeo yake yanayoendelea.
- source_word: δέδωκα αὐτοῖς
  choice: nimewapa
  rationale: Wakati timilifu wa Kiswahili unaonyesha zawadi iliyotolewa na ambayo matokeo yake yanaendelea.
- source_word: ἵνα
  choice: ili
  rationale: “Ili” huonyesha wazi kusudi au matokeo yaliyokusudiwa kwa lugha ya kawaida na yenye heshima.
- source_word: ὦσιν
  choice: wawe
  rationale: Umbo tegemezi baada ya “ili” huwasilisha kusudi lililokusudiwa.
- source_word: ἓν
  choice: kitu kimoja
  rationale: Kigiriki hutumia umoja wa jinsi isiyo na uhai, hivyo “kitu kimoja” huepuka kudokeza kuwa ni mtu mmoja na huhifadhi wazo la umoja bila kulifafanua kupita kiasi.
- source_word: καθὼς
  choice: kama vile
  rationale: Huonyesha ulinganisho kwa uwazi na kwa Kiswahili cha kawaida.
- source_word: ἡμεῖς ἕν
  choice: sisi tulivyo kitu kimoja
  rationale: Kitenzi cha kuwa kinadokezwa katika Kigiriki lakini kinahitaji kutamkwa kwa Kiswahili. Tafsiri hii huhifadhi ulinganisho mfupi bila kufafanua aina ya umoja.
theological_decisions:
- issue: Asili ya umoja wa waamini ukilinganishwa na umoja wa Baba na Mwana
  choice: “ili wawe kitu kimoja, kama vile sisi tulivyo kitu kimoja”
  alternative: Kufafanua umoja huo kuwa wa kimahusiano pekee, ushiriki katika uzima wa Mungu, au umoja wa kitaasisi wa kanisa
  rationale: Aya inalinganisha moja kwa moja umoja wa wanafunzi na umoja wa Baba na Mwana, lakini haifafanui hapa namna kamili ya ulinganisho huo. Maneno yameachwa wazi ili kuhifadhi mvutano wa kiteolojia bila kuingiza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. “Nami” hudumisha muunganisho wa sentensi na uwezekano wa msisitizo; “kitu kimoja” huhifadhi hali ya ἕν bila kuufanya umoja huo kuwa ‘mtu mmoja.’
