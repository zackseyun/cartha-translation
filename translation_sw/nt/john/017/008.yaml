  text: ὅτι τὰ ῥήματα ἃ ⸀ἔδωκάς μοι δέδωκα αὐτοῖς, καὶ αὐτοὶ ἔλαβον καὶ ἔγνωσαν ἀληθῶς ὅτι παρὰ σοῦ ἐξῆλθον, καὶ ἐπίστευσαν ὅτι σύ με ἀπέστειλας.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/008.yaml
  text: For the words that you gave me I have given to them[a], and they received them and truly came to know that I came from you[b], and they believed that you sent me.
translation:
  language: sw
  text: Kwa maana maneno uliyonipa nimewapa wao[a]. Nao waliyapokea na wakajua kwa kweli kwamba nilitoka kwako[b], na wakaamini kwamba ulinituma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kauli ulizonipa nimewapa wao.”
    reason: lexical_alternative
  - marker: b
    text: Au, “nilitoka upande wako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥήματα
  choice: maneno
  rationale: “Maneno” huhifadhi wingi na maana ya kauli zilizonenwa bila kuifasiri kwa upana kuwa ujumbe mmoja.
- source_word: ἔδωκάς ... δέδωκα
  choice: uliyonipa ... nimewapa
  rationale: “Uliyonipa” huwakilisha tendo lililokamilika, na “nimewapa” huhifadhi kwa kawaida katika Kiswahili matokeo ya tendo la wakati uliopita yanayoendelea kuwapo.
- source_word: ἔλαβον
  choice: waliyapokea
  rationale: Katika muktadha wa kupokea maneno yaliyotolewa, “kupokea” ni ya asili na haiongezi tafsiri ya “kukubali.”
- source_word: ἔγνωσαν ἀληθῶς
  choice: wakajua kwa kweli
  rationale: Kauli hii huhifadhi ἀληθῶς waziwazi na kuonyesha kufikia maarifa hayo bila kuipanua kuwa uhakika tu.
- source_word: παρὰ σοῦ ἐξῆλθον
  choice: nilitoka kwako
  rationale: Hii ni kauli ya kawaida ya Kiswahili inayoonyesha asili au mahali alikotoka Yesu huku ikiacha uzito wa kitheolojia wa maneno hayo bila kuufafanua zaidi.
- source_word: ἐπίστευσαν ὅτι
  choice: wakaamini kwamba
  rationale: Muundo huu huonyesha wazi kuwa waliliamini dai linalofuata, badala ya kugeuza kitenzi kuwa kauli ya jumla kuhusu kumtumaini mtu.
- source_word: ἀπέστειλας
  choice: ulinituma
  rationale: “Ulinituma” ni tafsiri ya moja kwa moja na yenye uzito unaofaa kwa tendo la Baba kumtuma Yesu.
- source_word: ὅτι
  choice: Kwa maana
  rationale: ὅτι ya mwanzo inaeleza sababu au msingi wa kauli iliyotangulia; “Kwa maana” huunganisha sentensi hizo kwa Kiswahili cha kawaida na chenye hadhi.
theological_decisions:
- issue: Uhusiano wa Yesu na Baba katika παρὰ σοῦ ἐξῆλθον
  choice: nilitoka kwako
  alternative: nilitoka upande wako
  rationale: “Nilitoka kwako” huhifadhi dai la asili bila kuingiza istilahi za baadaye za kimafundisho; maelezo mbadala yanaonyesha pia wazo la kutoka mbele au upande wa Baba.
- issue: Maana ya πιστεύω inapofuatwa na ὅτι
  choice: wakaamini kwamba
  alternative: wakasadiki kwamba
  rationale: Kifungu kinachofuata ni dai waliloamini kuwa kweli; “wakaamini kwamba” huhifadhi muundo huo kwa uwazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi umehifadhi mfululizo wa matendo—kupokea, kujua, na kuamini—kwa viunganishi vya kawaida. Viwakilishi vya yambwa katika “uliyonipa,” “nimewapa,” na “waliyapokea” vinabainisha mahusiano ya kisarufi kwa njia ya asili katika Kiswahili.
