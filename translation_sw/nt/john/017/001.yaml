id: JHN.17.1
reference: John 17:1
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ταῦτα ⸀ἐλάλησεν Ἰησοῦς, καὶ ⸂ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ εἰς τὸν οὐρανὸν εἶπεν⸃· Πάτερ, ἐλήλυθεν ἡ ὥρα· δόξασόν σου τὸν υἱόν, ⸀ἵνα ὁ ⸀υἱὸς δοξάσῃ σέ,
base_translation:
  language: en
  yaml_path: translation/nt/john/017/001.yaml
  text: 'Jesus said these things, and lifting up his eyes to heaven, he said: “Father, the hour has come. Glorify your Son, so that the Son may glorify you,”'
translation:
  language: sw
  text: Yesu alisema mambo hayo, kisha akainua macho yake kuelekea mbinguni, akasema, “Baba, saa imefika. Mtukuze Mwana wako, ili Mwana akutukuze wewe.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ταῦτα
  choice: mambo hayo
  rationale: Kiwakilishi cha wingi kisicho na jinsia kinarejelea maneno yaliyotangulia; “mambo hayo” ni Kiswahili cha kawaida kinachodumisha rejeo hilo.
- source_word: ἐλάλησεν
  choice: alisema
  rationale: Ingawa kitenzi kinaweza kutafsiriwa “alinena,” “alisema” ni cha kawaida na cha sasa katika Kiswahili, bila kubadili maana.
- source_word: ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ
  choice: akainua macho yake
  rationale: Inahifadhi tendo halisi la kuinua macho na kuwasilisha kitenzi tegemezi cha aoristi kwa mfuatano wa asili wa Kiswahili.
- source_word: εἰς τὸν οὐρανόν
  choice: kuelekea mbinguni
  rationale: εἰς hapa huonyesha mwelekeo; “kuelekea mbinguni” huepuka kudokeza kwamba macho yalifika mahali fulani na ni usemi wa kawaida.
- source_word: Πάτερ
  choice: Baba
  rationale: Ni mwito wa moja kwa moja bila kuongeza “yangu,” ambalo halipo katika Kigiriki.
- source_word: ἐλήλυθεν ἡ ὥρα
  choice: saa imefika
  rationale: Kauli timilifu inaonyesha kuwasili kwa wakati uliowekwa; “saa” inadumisha msamiati wa kimada wa Yohana kuliko “wakati.”
- source_word: δόξασόν
  choice: Mtukuze
  rationale: “Kutukuza” hubeba maana ya heshima, utukufu, na ufunuo inayopatikana katika δοξάζω, hasa katika Yohana.
- source_word: σου τὸν υἱόν
  choice: Mwana wako
  rationale: Kiwakilishi milikishi kinatafsiriwa kwa mpangilio wa kawaida wa Kiswahili; herufi kubwa inaonyesha matumizi ya cheo yanayomrejelea Yesu.
- source_word: ἵνα
  choice: ili
  rationale: “Ili” huonyesha kusudi au tokeo linalokusudiwa kwa uwazi na kwa ufupi.
- source_word: ὁ υἱὸς
  choice: Mwana
  rationale: Kiswahili hakina kibainishi kinacholingana moja kwa moja na ὁ; “Mwana” inadumisha matumizi ya cheo bila kurudia kimilikishi kisichorudiwa katika Kigiriki.
- source_word: δοξάσῃ σέ
  choice: akutukuze wewe
  rationale: Muundo wa “ili” pamoja na kiima na kitenzi unawakilisha subjunktivi ya kusudi; “wewe” inadumisha kiwakilishi cha Kigiriki chenye kujitokeza wazi na ulinganifu wa kutukuzana.
theological_decisions:
- issue: Kutukuzana kwa Baba na Mwana
  choice: “Mtukuze Mwana wako, ili Mwana akutukuze wewe” bila ufafanuzi wa ziada
  alternative: “Mheshimu Mwana wako, ili naye akuletee utukufu”
  rationale: Chaguo hili linadumisha uzito na ulinganifu wa δοξάζω katika vifungu vyote viwili, bila kuingiza maelezo ya kiteolojia yasiyotajwa moja kwa moja.
- issue: Matumizi ya herufi kubwa katika “Mwana”
  choice: “Mwana” kwa herufi kubwa
  alternative: “mwana” kwa herufi ndogo
  rationale: Katika muktadha huu neno linatumika kama cheo kinachomrejelea Yesu; herufi kubwa humsaidia msomaji kutambua rejeo hilo bila kubadili maana ya neno.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Kisha” huunganisha vitendo kwa mtiririko wa kawaida, huku “akainua” na “akasema” zikidumisha mfuatano wa simulizi. Hakuna tanbihi inayohitajika kwa aya hii.
