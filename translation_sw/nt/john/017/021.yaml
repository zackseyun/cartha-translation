id: JHN.17.21
reference: John 17:21
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἵνα πάντες ἓν ὦσιν, καθὼς σύ, ⸀πάτερ, ἐν ἐμοὶ κἀγὼ ἐν σοί, ἵνα καὶ αὐτοὶ ἐν ⸀ἡμῖν ὦσιν, ἵνα ὁ κόσμος ⸀πιστεύῃ ὅτι σύ με ἀπέστειλας.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/021.yaml
  text: that they may all be one[a], just as you, Father, are in me and I am in you; that they also may be in us[c][b], so that the world may believe that you sent me.
translation:
  language: sw
  text: ili wote wawe kitu kimoja[a], kama vile wewe, Baba, ulivyo ndani yangu, nami ndani yako; ili wao pia wawe ndani yetu[b], kusudi ulimwengu uamini[c] kwamba wewe ulinituma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wote wawe na umoja.” Kigiriki kinasema kwa uhalisia zaidi “wote wawe kitu kimoja,” jambo linalohifadhi maana pana ya umoja bila kuibana iwe upande mmoja tu.
    reason: lexical_alternative
  - marker: b
    text: Kurudiwa kwa neno “ndani” (“ndani yangu,” “ndani yako,” “ndani yetu”) kunaakisi lugha ya Yohana kuhusu kukaa ndani ya mwingine na kushiriki; maana yake ni nzito kuliko kuwa pamoja tu.
    reason: cross_reference
  - marker: c
    text: Au, “upate kuamini.” Kigiriki kinaweza kueleweka kuwa ulimwengu uamini, bila kutaja wazi kama msisitizo ni kuanza kuamini au kuendelea katika imani.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: ili / kusudi
  rationale: Vishazi vitatu vya ἵνα vinaendeleza mtiririko wa kusudi au matokeo. “Ili” katika viwili vya kwanza na “kusudi” katika cha mwisho ni Kiswahili cha kawaida na huhifadhi uhusiano huo bila kulazimisha tofauti isiyomo wazi katika Kigiriki.
- source_word: πάντες
  choice: wote
  rationale: Huhifadhi upeo wa jumla wa ombi la Yesu kwa njia fupi na ya kawaida.
- source_word: ἓν
  choice: kitu kimoja
  rationale: ἓν ni umoja wa jinsia isiyo ya kiume wala ya kike. “Kitu kimoja” huhifadhi taswira ya kuwa ‘moja’ bila kuifafanua kuwa umoja wa shirika, kusudi, au aina nyingine pekee.
- source_word: καθὼς
  choice: kama vile
  rationale: Huonyesha wazi ulinganisho kati ya kuwa kwa waamini kitu kimoja na uhusiano wa Baba na Mwana.
- source_word: πάτερ
  choice: Baba
  rationale: Huhifadhi mwito wa moja kwa moja pamoja na maana yake ya kimahusiano na kitheolojia.
- source_word: ἐν ἐμοὶ ... ἐν σοί
  choice: ndani yangu ... ndani yako
  rationale: Kurudia “ndani” huhifadhi ἐν na lugha ya Yohana kuhusu kukaa ndani ya mwingine; “pamoja nami ... pamoja nawe” kungepunguza nguvu yake.
- source_word: κἀγώ
  choice: nami
  rationale: 'Huunganisha kwa kawaida katika Kiswahili upande wa pili wa uhusiano wa pande mbili: ‘nami ndani yako.’'
- source_word: καὶ αὐτοὶ
  choice: wao pia
  rationale: Huhifadhi nguvu ya nyongeza ya καί na kuhusisha waamini na uhusiano uliotajwa wa Baba na Mwana.
- source_word: ἐν ἡμῖν
  choice: ndani yetu
  rationale: Hufuata Kigiriki kwa karibu na kuhifadhi maana nzito ya kushiriki au kukaa ndani, badala ya ushirika wa nje tu.
- source_word: κόσμος
  choice: ulimwengu
  rationale: Ni neno la kawaida linalohifadhi matumizi mapana na yenye uzito wa kitheolojia ya κόσμος katika Yohana.
- source_word: πιστεύῃ
  choice: uamini
  rationale: Huwakilisha hali tegemezi ya wakati uliopo bila kuamua kama msisitizo ni kuanza kuamini au kuendelea kuamini.
- source_word: ἀπέστειλας
  choice: ulinituma
  rationale: Huwasilisha kwa kawaida tendo la wakati uliopita na kuhifadhi wazi mtendaji ‘wewe’ na mtendwa ‘mimi.’
theological_decisions:
- issue: Asili ya kuwa kwa waamini kitu kimoja kwa kulinganishwa na Baba na Mwana
  choice: Kutafsiri ἓν kuwa “kitu kimoja” na kuhifadhi “ndani yetu” bila maelezo ya ziada.
  alternative: “wawe na umoja” au “wawe na kusudi moja”
  rationale: Andiko halifafanui umoja huo kuwa wa shirika, maadili, kusudi, au hali ya kimetafizikia pekee. Tafsiri hii huhifadhi upana na mvutano wa kitheolojia wa chanzo bila kuingiza fundisho la dhehebu.
- issue: Lugha ya Yohana kuhusu kuwa ndani ya mwingine
  choice: Kutumia “ndani yangu,” “ndani yako,” na “ndani yetu.”
  alternative: “pamoja nami,” “pamoja nawe,” na “pamoja nasi”
  rationale: Kigiriki hurudia ἐν. Kutumia “ndani” huhifadhi lugha ya ushiriki na kukaa ndani ya mwingine, huku kuepuka kuifanya iwe ushirika wa kawaida tu.
- issue: Kipengele cha tendo katika πιστεύῃ
  choice: Kutumia “uamini” bila kubainisha mwanzo au mwendelezo wa imani.
  alternative: “upate kuamini” au “uendelee kuamini”
  rationale: Muundo wa Kigiriki unaweza kuzungumzia kuamini bila kuamua wazi kama ulimwengu unaanza au unaendelea kuamini; tafsiri haipaswi kuondoa utata huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi huhifadhi mpangilio wa maombi matatu ya kusudi, mwito “Baba,” na marudio ya “ndani,” huku ikisomeka kwa kawaida kwa wasomaji wa kawaida.
