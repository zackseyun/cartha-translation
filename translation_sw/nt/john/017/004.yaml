  text: ἐγώ σε ἐδόξασα ἐπὶ τῆς γῆς, τὸ ἔργον ⸀τελειώσας ὃ δέδωκάς μοι ἵνα ποιήσω·
base_translation:
  language: en
  yaml_path: translation/nt/john/017/004.yaml
  text: I glorified you on the earth by completing the work that you have given me to do[a].
translation:
  language: sw
  text: Nilikutukuza duniani kwa kukamilisha kazi uliyonipa niifanye.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nikiwa nimekamilisha kazi uliyonipa niifanye.”
    reason: Tafsiri hii mbadala inahifadhi kwa karibu zaidi muundo wa kihusishi cha Kigiriki τελειώσας na kutobainisha kabisa kama kinaonyesha njia au hali inayoandamana.
lexical_decisions:
- source_word: ἐδόξασα
  choice: nilikutukuza
  rationale: 'Kitenzi “kutukuza” kinahifadhi uzito wa δοξάζω katika Injili ya Yohana: kumpa au kumdhihirisha Mungu utukufu, si kumheshimu tu.'
- source_word: ἐπὶ τῆς γῆς
  choice: duniani
  rationale: Hii ni tafsiri ya kawaida na ya asili ya Kiswahili kwa maana ya mahali ya kirai hiki, bila kuongeza uzito usio wa lazima wa “juu ya dunia.”
- source_word: τελειώσας
  choice: kwa kukamilisha
  rationale: Kirai hiki kinaonyesha njia ambayo Yesu alimtukuza Baba, huku kikihifadhi maana ya kuifikisha kazi mwisho wake.
- source_word: τὸ ἔργον
  choice: kazi
  rationale: “Kazi” ni neno la moja kwa moja na la kawaida kwa ἔργον katika muktadha wa utume ambao Baba alimpa Yesu.
- source_word: δέδωκάς μοι
  choice: uliyonipa
  rationale: Muundo huu wa Kiswahili unaonyesha kuwa kazi hiyo ilitolewa kwa Yesu na bado ndiyo kazi aliyokuwa nayo; unawakilisha kwa kawaida umuhimu unaoendelea wa hali timilifu ya Kigiriki.
- source_word: ἵνα ποιήσω
  choice: niifanye
  rationale: Baada ya “uliyonipa,” kiunganishi hiki kinaeleza kusudi la kuitoa kazi hiyo kwa Kiswahili cha asili.
- source_word: ἐγώ σε
  choice: nili-...-ku-
  rationale: Viambishi vya nafsi katika “nilikutukuza” vinawakilisha “mimi ... wewe” kwa kawaida; kuongeza “Mimi mwenyewe” kungezidisha mkazo.
theological_decisions:
- issue: Uhusiano wa τελειώσας na tendo la Yesu la kumtukuza Baba
  choice: '“kwa kukamilisha”: kukamilisha kazi ndiyo njia ambayo Yesu alimtukuza Baba.'
  alternative: '“nikiwa nimekamilisha”: inaweza kusomeka kama hali au tendo linaloandamana, bila kubainisha wazi kuwa ni njia.'
  rationale: Muundo wa Kigiriki unaunganisha kihusishi hicho na kitenzi kikuu kwa namna inayoweza kueleza jinsi utukufu ulivyoletwa. Tafsiri kuu inaonyesha uhusiano huo, na tanbihi inahifadhi uwezekano wa tafsiri rasmi zaidi bila kuingiza dai pana la kiteolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Duniani” na “niifanye” ni miundo ya kawaida na inayoeleweka kwa urahisi; “kutukuza” huhifadhi istilahi muhimu ya Yohana.
