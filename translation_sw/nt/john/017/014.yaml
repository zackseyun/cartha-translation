  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐγὼ δέδωκα αὐτοῖς τὸν λόγον σου, καὶ ὁ κόσμος ἐμίσησεν αὐτούς, ὅτι οὐκ εἰσὶν ἐκ τοῦ κόσμου καθὼς ἐγὼ οὐκ εἰμὶ ἐκ τοῦ κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/014.yaml
  text: I have given them your word[a], and the world has hated them because they are not of the world, just as I am not of the world.
translation:
  language: sw
  text: Nimewapa neno lako, na ulimwengu umewachukia kwa sababu hawatokani na ulimwengu[a], kama vile mimi nisivyotokana na ulimwengu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “si wa ulimwengu.” Usemi wa Kigiriki unaweza kuonyesha chanzo au kuwa mali ya upande fulani.
    reason: lexical_alternative
lexical_decisions:
- source_word: δέδωκα
  choice: nimewapa
  rationale: Kauli ya wakati timilifu inaonyesha tendo lililokamilika ambalo matokeo yake yanaendelea; “nimewapa” hudumisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: λόγον
  choice: neno
  rationale: “Neno” linadumisha msamiati wa Yohana na upana wa maana ya ujumbe wa Baba uliowasilishwa kupitia Yesu bila kuufafanua kupita kiasi.
- source_word: κόσμος
  choice: ulimwengu
  rationale: Hili ndilo neno la kawaida kwa κόσμος na linahifadhi upana wake; katika muktadha huu uadui wa ulimwengu unaonekana wazi kutokana na kitenzi “umewachukia.”
- source_word: ἐμίσησεν
  choice: umewachukia
  rationale: Wakati timilifu wa Kiswahili unaonyesha uadui uliotokea na ambao bado ni hali halisi katika muktadha wa sala hii.
- source_word: ὅτι
  choice: kwa sababu
  rationale: 'Kiunganishi hiki kina maana ya kisababishi hapa: chuki ya ulimwengu inahusishwa na kutotokana kwa wanafunzi na ulimwengu.'
- source_word: ἐκ τοῦ κόσμου
  choice: hawatokani na ulimwengu
  rationale: “Kutokana na” huonyesha chanzo au asili kwa Kiswahili cha kawaida, bila kupunguza usemi kuwa suala la uanachama pekee wala kuleta wazo la kutoka mahali kimwili.
- source_word: καθὼς
  choice: kama vile
  rationale: Usemi huu unaonyesha wazi ulinganisho kati ya uhusiano wa wanafunzi na ulimwengu na ule wa Yesu.
theological_decisions:
- issue: Uhusiano wa wanafunzi na “ulimwengu” ukilinganishwa na Yesu
  choice: hawatokani na ulimwengu, kama vile mimi nisivyotokana na ulimwengu
  alternative: si wa ulimwengu, kama vile mimi nisivyo wa ulimwengu
  rationale: Tafsiri kuu inadumisha wazo la chanzo katika ἐκ na ulinganisho wa moja kwa moja uliomo katika maandishi, bila kuufanya usemi huo kuwa dai la kijamii tu au kuingiza maelezo ya kimetafizikia yasiyotajwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Hawatokani na ulimwengu” ni cha kueleweka kwa wasomaji wa kawaida na huhifadhi mvutano wa maana kati ya chanzo na kuwa wa upande wa ulimwengu.
