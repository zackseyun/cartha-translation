  text: καθὼς ἔδωκας αὐτῷ ἐξουσίαν πάσης σαρκός, ἵνα πᾶν ὃ δέδωκας αὐτῷ ⸀δώσῃ αὐτοῖς ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/002.yaml
  text: just as you gave him authority over all flesh[a], so that to all whom you have given him[b], he may give eternal life.
translation:
  language: sw
  text: kama vile ulivyompa mamlaka juu ya wanadamu wote[a], ili wale wote uliompa[b] awape uzima wa milele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki ni “mwili wote,” nahau ya kibiblia inayomaanisha wanadamu wote.
    reason: lexical_alternative
  - marker: b
    text: Neno kwa neno, “kila [kitu] ambacho umempa”; Kigiriki kinatumia umoja wa jinsia ya kati kama jina la mkusanyiko wa watu ambao Baba amempa Mwana.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: kama vile
  rationale: Huonyesha ulinganisho unaohusiana na ombi la mstari uliotangulia, kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: ἔδωκας αὐτῷ ἐξουσίαν
  choice: ulivyompa mamlaka
  rationale: Wakati uliopita wa kitenzi umehifadhiwa, na “mamlaka” linaonyesha haki na uwezo wa kutawala aliopewa, si nguvu ghafi tu.
- source_word: πάσης σαρκός
  choice: juu ya wanadamu wote[a]
  rationale: Nahau ya Kigiriki “mwili wote” inawahusu wanadamu wote. Tafsiri hii ni ya asili zaidi katika Kiswahili cha sasa, huku umbo halisi likielezwa katika tanbihi.
- source_word: ἵνα
  choice: ili
  rationale: Huonyesha kusudi au matokeo yaliyokusudiwa kwa ufupi na kwa kawaida katika Kiswahili.
- source_word: πᾶν ὃ δέδωκας αὐτῷ
  choice: wale wote uliompa[b]
  rationale: Ingawa Kigiriki kina umbo la umoja wa jinsia ya kati linalotumiwa kwa mkusanyiko, muktadha unaonyesha watu. “Wale wote” ni wazi na ya asili bila kuficha umbo la asili, ambalo linaelezwa katika tanbihi.
- source_word: δώσῃ αὐτοῖς ζωὴν αἰώνιον
  choice: awape uzima wa milele
  rationale: Muundo huu huonyesha kusudi la kumpa kila mmoja katika kundi hilo uzima wa milele na hutumia istilahi ya kawaida ya Kiyohana.
theological_decisions:
- issue: Upeo wa “wanadamu wote” na utambulisho wa “wale wote uliompa”
  choice: Kuhifadhi mamlaka ya Mwana juu ya wanadamu wote, huku uzima wa milele katika sentensi hii ukihusishwa na wale ambao Baba amempa.
  alternative: Kupanua au kupunguza makundi hayo ili kuyapatanisha na mfumo fulani wa kiteolojia.
  rationale: Mstari wenyewe unaweka pamoja upeo wa jumla wa mamlaka na kundi maalumu linalotajwa kuwa limepewa Mwana. Tafsiri haiondoi mvutano huo wala kuuingiza katika fundisho la dhehebu fulani.
- issue: Umbo la mkusanyiko katika πᾶν ὃ
  choice: Kulionyesha kwa “wale wote” katika maandishi na kueleza umbo halisi katika tanbihi.
  alternative: Kutafsiri moja kwa moja “kila kitu ambacho umempa,” jambo ambalo kwa Kiswahili lingeweza kuwafanya wasomaji wafikiri kuwa vitu, si watu, ndio wanaopewa uzima.
  rationale: Kiwakilishi cha wingi αὐτοῖς na muktadha vinaonyesha kuwa mkusanyiko huo unawahusu watu, lakini tanbihi huhifadhi sifa ya kisarufi ya Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Mpangilio wa kishazi umewekwa karibu na Kigiriki kwa kutanguliza “wale wote uliompa” kabla ya “awape,” bila kufanya sentensi kuwa ngumu.
