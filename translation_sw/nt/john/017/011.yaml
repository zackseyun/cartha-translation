  text: καὶ οὐκέτι εἰμὶ ἐν τῷ κόσμῳ, καὶ ⸀αὐτοὶ ἐν τῷ κόσμῳ εἰσίν, κἀγὼ πρὸς σὲ ἔρχομαι. πάτερ ἅγιε, τήρησον αὐτοὺς ἐν τῷ ὀνόματί σου ᾧ δέδωκάς μοι, ἵνα ὦσιν ἓν ⸀καθὼς ἡμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/011.yaml
  text: And I am no longer in the world[a], but they are in the world, and I am coming to you. Holy Father, keep them in your name, which you have given to me, so that they may be one[b], just as we are.
translation:
  language: sw
  text: Mimi simo tena ulimwenguni, lakini wao wamo ulimwenguni, nami ninakuja kwako. Baba Mtakatifu, uwahifadhi katika jina lako[a], ulilonipa[b], ili wawe kitu kimoja, kama sisi tulivyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “uwahifadhi kwa jina lako” au “uwahifadhi kupitia jina lako.” Kirai cha Kigiriki kinaweza kuonyesha nyanja, njia, au mamlaka.
    reason: lexical_alternative
  - marker: b
    text: Baadhi ya hati zinasomeka kwa maana ya “uwahifadhi katika jina lako ulilonipa,” lakini nyingine zinaeleweka kuwa “uwahifadhi katika jina lako wale ulionipa.” Tafsiri hii inafuata usomaji wa SBLGNT, ambamo kiwakilishi cha urejeshi kinarejelea “jina.”
    reason: textual_variant
lexical_decisions:
- source_word: οὐκέτι εἰμὶ ἐν τῷ κόσμῳ
  choice: simo tena ulimwenguni
  rationale: “Tena” huonyesha kwamba hali hiyo inakoma, na “ulimwenguni” huhifadhi neno la msingi la Yohana kwa mazingira ya kibinadamu duniani ambamo wanafunzi wanabaki.
- source_word: κἀγὼ πρὸς σὲ ἔρχομαι
  choice: nami ninakuja kwako
  rationale: Wakati wa sasa wa kitenzi umetafsiriwa kwa namna inayoonyesha tendo linalokaribia, huku mwelekeo wa kitenzi cha Kigiriki, ‘kuja,’ ukihifadhiwa.
- source_word: πάτερ ἅγιε
  choice: Baba Mtakatifu
  rationale: Hii ni namna ya kawaida, yenye heshima, ya kuhifadhi mwito wa moja kwa moja pamoja na sifa ya utakatifu.
- source_word: τήρησον
  choice: uwalinde
  rationale: Kitenzi kinaweza kumaanisha kutunza, kulinda, au kuhifadhi. “Uwalinde” ni Kiswahili cha kawaida kinachoonyesha ulinzi bila kuufanya kuwa wa kimwili tu.
- source_word: ἐν τῷ ὀνόματί σου
  choice: katika jina lako
  rationale: “Katika” huhifadhi uwezekano wa maana ya kuwa ndani ya eneo au uhalisi unaowakilishwa na jina, bila kuamua kimya kimya kwamba jina ni chombo tu cha ulinzi.
- source_word: ᾧ δέδωκάς μοι
  choice: ulilonipa
  rationale: Kiambishi cha urejeshi “-lo-” kinarejelea “jina,” sawasawa na upatanisho wa kisarufi wa usomaji wa SBLGNT.
- source_word: ἵνα ὦσιν ἓν
  choice: ili wawe kitu kimoja
  rationale: “Ili” huonyesha kusudi, na “kitu kimoja” huhifadhi wazo la umoja linalotolewa na neno la Kigiriki la jinsia ya kati, badala ya kuwafanya wawe mtu mmoja.
- source_word: καθὼς ἡμεῖς
  choice: kama sisi tulivyo
  rationale: Huhifadhi ulinganisho halisi kati ya umoja wa wanafunzi na wa Baba na Mwana bila kufafanua zaidi asili ya ulinganisho huo.
theological_decisions:
- issue: Maana ya ‘uwalinde katika jina lako’
  choice: Maneno hayo yamehifadhiwa bila kufafanuliwa ndani ya andiko kuu.
  alternative: uwalinde kwa jina lako; uwahifadhi kupitia jina lako
  rationale: Kirai cha Kigiriki kinaweza kuonyesha eneo, njia, au mamlaka. Tafsiri ya moja kwa moja zaidi huhifadhi upana huo wa maana.
- issue: Nguvu ya ‘ili wawe kitu kimoja kama sisi tulivyo’
  choice: Ulinganisho kati ya umoja wa wanafunzi na umoja wa Baba na Mwana umehifadhiwa bila kuufafanua kimetafizikia.
  alternative: ili wawe na ushirikiano tu; ili wawe na umoja wa asili sawa kabisa
  rationale: Andiko linatoa ulinganisho wenye uzito, lakini halielezi katika mstari huu namna kamili ya umoja huo. Tafsiri haipaswi kuupunguza wala kuongezea kauli ya baadaye ya kimafundisho.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki kimetumiwa kwa mtindo wa sasa, wa heshima na unaosomeka kwa urahisi. “Simo/wamo” ni miundo ya kawaida kwa hali ya kuwapo mahali; “kitu kimoja” huhifadhi wazo la umoja bila kudokeza kwamba wanafunzi wanakuwa mtu mmoja.
