  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἐφανέρωσά σου τὸ ὄνομα τοῖς ἀνθρώποις οὓς ⸀ἔδωκάς μοι ἐκ τοῦ κόσμου. σοὶ ἦσαν κἀμοὶ αὐτοὺς ⸁ἔδωκας, καὶ τὸν λόγον σου τετήρηκαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/006.yaml
  text: I have made your name known to the men whom you gave me out of the world. They were yours, and you gave them to me, and they have kept your word.
translation:
  language: sw
  text: Nimelifunua jina lako[a][b] kwa watu[c] ulionipa kutoka ulimwenguni.[d] Walikuwa wako, nawe ukanipa watu hao; nao wamelishika neno lako.[e]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nimelifanya jina lako lijulikane.”
    reason: lexical_alternative
  - marker: b
    text: “Jina lako” hapa linamaanisha utambulisho na tabia ya Mungu kama alivyojifunua, si jina linalotamkwa tu.
    reason: cultural_note
  - marker: c
    text: Au, “kwa wanadamu.” Katika muktadha huu, wanaorejelewa moja kwa moja ni wanafunzi wa Yesu.
    reason: lexical_alternative
  - marker: d
    text: Au, “miongoni mwa ulimwengu.”
    reason: lexical_alternative
  - marker: e
    text: Au, “wamelitii neno lako”; Kigiriki kinasema kwa uhalisi zaidi, “wamelishika neno lako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐφανέρωσά
  choice: Nimelifunua
  rationale: Kitenzi φανερόω humaanisha kuweka wazi au kufanya kitu kijulikane. “Nimelifunua” ni Kiswahili cha kawaida na chenye hadhi, na kinahifadhi wazo la ufunuo bila kutumia maelezo marefu.
- source_word: τὸ ὄνομα
  choice: jina lako
  rationale: Maandishi yanasema kihalisi “jina.” Katika muktadha wa Yohana, jina linahusisha utambulisho na tabia ya Mungu iliyofunuliwa; hivyo neno halisi limehifadhiwa badala ya kufafanuliwa ndani ya matini.
- source_word: τοῖς ἀνθρώποις
  choice: kwa watu
  rationale: ἄνθρωποι inaweza kumaanisha watu au wanadamu. “Watu” ni ya asili katika Kiswahili na inafaa kwa wale wanafunzi wanaorejelewa hapa bila kuingiza ubainishaji wa kijinsia ambao Kiswahili hakihitaji.
- source_word: οὓς ἔδωκάς μοι
  choice: ulionipa
  rationale: Muundo huu unaeleza kwa ufupi kwamba Baba aliwapa watu hao kwa Mwana. “Ulionipa” ni wa moja kwa moja na wa kawaida katika Kiswahili.
- source_word: ἐκ τοῦ κόσμου
  choice: kutoka ulimwenguni
  rationale: ἐκ huonyesha kwamba watu hao walitolewa miongoni mwa ulimwengu. “Kutoka ulimwenguni” huhifadhi wazo hilo kwa Kiswahili cha asili.
- source_word: σοὶ ἦσαν
  choice: Walikuwa wako
  rationale: Tafsiri hii inafuata kwa karibu muundo mfupi wa Kigiriki na kuhifadhi maana ya kuwa mali ya Baba.
- source_word: κἀμοὶ αὐτοὺς ἔδωκας
  choice: nawe ukanipa watu hao
  rationale: Kurudia “watu hao” huepusha muundo usio wa asili wa “ukanipa wao,” huku kukihifadhi wazi kwamba Baba aliwapa kwa Mwana.
- source_word: τὸν λόγον σου
  choice: neno lako
  rationale: λόγος inaweza kuwa neno, ujumbe, au mafundisho. “Neno lako” huhifadhi istilahi ya maandiko na upana wake wa maana.
- source_word: τετήρηκαν
  choice: wamelishika
  rationale: Wakati timilifu wa τηρέω unaonyesha tendo lenye matokeo yanayoendelea. “Wamelishika” huhifadhi maana ya kutunza, kuzingatia, na kutii bila kuifupisha kuwa utii pekee.
theological_decisions:
- issue: Maana ya “jina lako” katika teolojia ya Yohana
  choice: Kuhifadhi usemi halisi “jina lako” katika matini kuu
  alternative: Kutafsiri kwa ufafanuzi kuwa “wewe ni nani” au “tabia yako”
  rationale: Usemi huo unahusu utambulisho, tabia, na uwepo wa Baba kama ulivyofunuliwa, lakini Kigiriki kinasema “jina.” Kuhifadhi picha hiyo kunadumisha kina chake cha kibiblia bila kuifungia katika ufafanuzi mmoja.
- issue: Maana na warejelewa wa τοῖς ἀνθρώποις
  choice: kwa watu
  alternative: kwa wanadamu au kwa wanaume
  rationale: Neno la Kigiriki linaweza kutumiwa kwa watu kwa ujumla, huku muktadha ukirejelea wanafunzi wa Yesu. “Watu” ni sahihi na ya kawaida katika Kiswahili, ambalo halilazimishi utofautishaji wa kijinsia hapa.
- issue: Baba kuwapa watu kwa Mwana
  choice: Kuhifadhi kauli kwamba Baba aliwapa watu hao kwa Mwana bila kueleza mfumo wa uchaguzi
  alternative: Kufafanua kifungu kulingana na mfumo maalumu wa kimadhehebu kuhusu uchaguzi au mwitikio wa binadamu
  rationale: Aya inasema wazi kwamba Baba aliwapa watu hao kwa Mwana, lakini haielezi hapa utaratibu kamili wa tendo hilo. Tafsiri inaacha mvutano huo wa kiteolojia ulivyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo umewekwa wa moja kwa moja na wenye uzito wa sala, bila lugha ya kimadhehebu.
