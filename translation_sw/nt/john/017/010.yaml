  yaml_path: translation/nt/john/017/010.yaml
  text: And all that is mine is yours[a], and what is yours is mine, and I have been glorified in them.
translation:
  language: sw
  text: Na vyote vilivyo vyangu ni vyako, na vilivyo vyako ni vyangu, nami nimetukuzwa ndani yao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kupitia kwao” au “miongoni mwao.” Kigiriki kinasema “ndani yao”; katika muktadha, usemi huo unaweza kueleza mahali, njia, au udhihirisho wa utukufu.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἐμὰ πάντα
  choice: vyote vilivyo vyangu
  rationale: Kauli hii ya wingi wa jinsi ya kati inarejelea kwa upana kila kilicho cha Yesu. Kiswahili hiki ni cha kawaida na kinahifadhi maana jumuishi bila kuifanya ihusu vitu vya kimwili pekee.
- source_word: σά
  choice: ni vyako
  rationale: Kivumishi cha kumiliki kimetafsiriwa kwa muundo wa kawaida wa Kiswahili unaoonyesha umiliki wa Baba kwa ufupi na wazi.
- source_word: τὰ σὰ ἐμά
  choice: vilivyo vyako ni vyangu
  rationale: Muundo huu unalingana na kishazi cha kwanza na kuhifadhi tamko la umiliki wa pande zote bila kulidhoofisha.
- source_word: δεδόξασμαι
  choice: nimetukuzwa
  rationale: Kauli timilifu tendwa inaonyesha tendo lililotimia lenye matokeo yanayoendelea. “Nimetukuzwa” huhifadhi vizuri umbo hilo na hali ya kutendwa.
- source_word: ἐν αὐτοῖς
  choice: ndani yao
  rationale: Hii ndiyo tafsiri ya moja kwa moja ya ἐν αὐτοῖς, ikidokeza kwamba utukufu wa Yesu umeonekana ndani yao bila kulazimisha maana ya chombo (“kupitia kwao”) au ya mahali pa kijamii (“miongoni mwao”).
theological_decisions:
- issue: Umiliki wa pande zote kati ya Mwana na Baba
  choice: 'Tamko limetafsiriwa moja kwa moja: “vyote vilivyo vyangu ni vyako, na vilivyo vyako ni vyangu.”'
  alternative: Kulifanya tamko lieleze ushirikiano wa kiutendaji tu badala ya umiliki wa pande zote.
  rationale: Kigiriki kinatamka umiliki wa pande zote waziwazi. Tafsiri hailainishi dai hilo, wala haiingizi istilahi za baadaye za kimafundisho ambazo hazimo katika mstari.
- issue: Maana na rejeleo la ἐν αὐτοῖς
  choice: Maana ya karibu na mahali imehifadhiwa kwa “ndani yao.”
  alternative: “kupitia kwao” kama chombo, au “miongoni mwao” kama uwepo wa kimahusiano.
  rationale: Kihusishi ἐν kinaweza kuwa na vivuli hivi vya maana kulingana na muktadha, lakini mstari haulazimishi uchaguzi mmoja. Maandishi makuu yanahifadhi hali hiyo ya kutokuwa na uamuzi kamili, na tanbihi inaonyesha uwezekano mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Urudiaji wa “vyangu/vyako” umehifadhiwa ili kuonyesha uwiano wa kauli ya Kigiriki.
