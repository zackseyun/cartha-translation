  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ⸀πάτερ, ⸀ὃ δέδωκάς μοι, θέλω ἵνα ὅπου εἰμὶ ἐγὼ κἀκεῖνοι ὦσιν μετ’ ἐμοῦ, ἵνα θεωρῶσιν τὴν δόξαν τὴν ἐμὴν ἣν ⸀δέδωκάς μοι, ὅτι ἠγάπησάς με πρὸ καταβολῆς κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/024.yaml
  text: Father[a], I desire that those whom you have given me also may be with me where I am, so that they may see my glory that you have given me, because you loved me before the foundation of the world.
translation:
  language: sw
  text: Baba, nataka wale ulionipa nao wawe pamoja nami mahali nilipo, ili wauone utukufu wangu ambao umenipa, kwa sababu ulinipenda kabla ya kuwekwa misingi ya ulimwengu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάτερ
  choice: Baba
  rationale: Ni mwito wa moja kwa moja kwa Mungu; “Baba” ni tafsiri ya kawaida na ya heshima bila kuongeza kimilikishi kisichomo katika Kigiriki.
- source_word: ὃ δέδωκάς μοι
  choice: wale ulionipa
  rationale: Ingawa ὃ ni umoja wa jinsia ya kati, hapa inatumika kwa maana ya mkusanyo wa watu, kama inavyoonyeshwa na viwakilishi na kitenzi vya wingi vinavyofuata. “Wale ulionipa” ni Kiswahili cha asili na huweka wazi kuwa wanaorejelewa ni watu.
- source_word: θέλω
  choice: nataka
  rationale: θέλω huonyesha nia au hamu yenye nguvu. Katika Kiswahili cha sasa, “nataka” ni ya moja kwa moja na ya kawaida, bila kuigeuza kauli hiyo kuwa amri au tamko la wakati ujao.
- source_word: κἀκεῖνοι ὦσιν μετ’ ἐμοῦ
  choice: wao pia wawe pamoja nami
  rationale: “Pia” huhifadhi nguvu ya nyongeza katika κἀκεῖνοι, na “wawe pamoja nami” huwasilisha ombi kwa Kiswahili fasaha.
- source_word: ὅπου εἰμὶ ἐγὼ
  choice: mahali nilipo
  rationale: Hii ni namna ya kawaida ya Kiswahili ya kueleza “where I am”; maana ya mahali na msisitizo wa mzungumzaji vinaeleweka bila tungo nzito.
- source_word: θεωρῶσιν
  choice: wauone
  rationale: θεωρέω inaweza kumaanisha kuona, kutazama, au kushuhudia. “Wauone” ni wazi kwa msomaji wa kawaida na bado inafaa kwa kitu kinachoonekana, yaani utukufu.
- source_word: τὴν δόξαν τὴν ἐμὴν
  choice: utukufu wangu
  rationale: Huhifadhi kwa ufupi na kwa kawaida msisitizo wa umilikaji ulio katika Kigiriki.
- source_word: ἣν δέδωκάς μοι
  choice: ambao umenipa
  rationale: “Umenipa” huonyesha tendo lililokamilika lenye matokeo yanayoendelea, sawasawa na wakati timilifu wa Kigiriki.
- source_word: ὅτι ἠγάπησάς με
  choice: kwa sababu ulinipenda
  rationale: “Kwa sababu” huonyesha wazi uhusiano wa kisababu wa ὅτι, na “ulinipenda” huwasilisha kitenzi cha wakati uliopita.
- source_word: πρὸ καταβολῆς κόσμου
  choice: kabla ya kuwekwa msingi wa ulimwengu
  rationale: Huhifadhi taswira ya “kuweka msingi” iliyo katika καταβολή na tamko la wazi la wakati uliotangulia kuumbwa kwa ulimwengu.
theological_decisions:
- issue: Kuwapo kwa Mwana kabla ya uumbaji kunakodokezwa na kupendwa kwake kabla ya kuwekwa msingi wa ulimwengu
  choice: 'Kauli ya wakati imehifadhiwa moja kwa moja: “ulinipenda kabla ya kuwekwa msingi wa ulimwengu.”'
  alternative: Kufafanua usemi huo kwa njia ya mfano au kuupunguza kuwa mpango wa Mungu tu kabla ya uumbaji.
  rationale: Kigiriki kinatoa tamko la moja kwa moja kuhusu upendo wa Baba kwa Mwana kabla ya msingi wa ulimwengu; tafsiri hailainishi wala kuupanua zaidi ya maandishi.
- issue: Nguvu ya θέλω katika sala ya Yesu
  choice: “nataka”
  alternative: “ninatamani” au “ni mapenzi yangu”
  rationale: “Nataka” huhifadhi nia halisi na yenye nguvu, lakini muktadha wa sala huizuia isisomwe kama amri kavu. Pia ni lugha ya sasa na inayoeleweka kwa urahisi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Mpangilio wa sentensi umefanywa wa kawaida katika Kiswahili huku usemi wa mkusanyo, nguvu ya “pia,” taswira ya kuwekwa msingi, na uhusiano wa kisababu vikihifadhiwa.
