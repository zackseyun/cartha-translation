  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: πάτερ, δόξασόν σου τὸ ὄνομα. ἦλθεν οὖν φωνὴ ἐκ τοῦ οὐρανοῦ· Καὶ ἐδόξασα καὶ πάλιν δοξάσω.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/028.yaml
  text: 'Father[a], glorify your name. Then a voice came from heaven: “I have glorified it, and I will glorify it again.”'
translation:
  language: sw
  text: 'Baba, litukuze jina lako. Ndipo sauti ikaja kutoka mbinguni: “Nimelitukuza[a], nami nitalitukuza tena.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata muundo wa Kigiriki kwa karibu zaidi, “Nililitukuza, nami nitalitukuza tena.”
    reason: Kitenzi cha kwanza ni aoristi katika Kigiriki, ambacho kinaweza kutafsiriwa kwa wakati uliopita “nililitukuza”; “nimelitukuza” huonyesha vizuri zaidi tendo lililokamilika lenye umuhimu wa sasa katika Kiswahili.
lexical_decisions:
- source_word: πάτερ
  choice: Baba
  rationale: Ni hali ya wito wa moja kwa moja kwa Mungu. “Baba” ni tafsiri ya kawaida na ya asili; hakuna kiwakilishi cha umilikaji “wangu” katika Kigiriki.
- source_word: δόξασόν
  choice: litukuze
  rationale: Kitenzi δοξάζω hapa kinamaanisha kudhihirisha utukufu. “Litukuze” huhifadhi msamiati wa kitheolojia wa Yohana na hukubaliana na nomino “jina” kama yambwa.
- source_word: σου τὸ ὄνομα
  choice: jina lako
  rationale: Huu ni usemi wa kawaida unaorejelea si jina kama neno tu, bali pia tabia na sifa za Mungu zilizofunuliwa. “Jina lako” ni Kiswahili cha asili kinachohifadhi uzito huo.
- source_word: ἦλθεν οὖν
  choice: Ndipo ... ikaja
  rationale: οὖν hapa huendeleza simulizi, na “ndipo” huonyesha mfuatano huo kwa Kiswahili cha asili. ἦλθεν limetafsiriwa “ikaja,” likikubaliana na “sauti.”
- source_word: φωνὴ
  choice: sauti
  rationale: Ingawa φωνή inaweza kumaanisha sauti kwa ujumla, maneno yanayofuata yanaonyesha kuwa ni sauti inayosema kwa kueleweka.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: kutoka mbinguni
  rationale: “Kutoka mbinguni” huonyesha chanzo cha kimungu na ni usemi wa kawaida wa kibiblia kwa οὐρανός katika muktadha huu.
- source_word: Καὶ ἐδόξασα καὶ πάλιν δοξάσω
  choice: Nimelitukuza, nami nitalitukuza tena
  rationale: Wakati timilifu wa Kiswahili “nimelitukuza” huwasilisha tendo lililokamilika lenye umuhimu wa sasa. Kiambishi “li” kinarejelea “jina,” na “tena” kinaambatana kwa kawaida na tendo la baadaye.
theological_decisions:
- issue: Yambwa iliyodokezwa katika jibu la sauti
  choice: Kutumia kiambishi “li” kinachorejelea “jina”
  alternative: 'Kuacha yambwa bila kutajwa: “Nimetukuza, nami nitatukuza tena”'
  rationale: Kigiriki kinaacha yambwa ikiwa imedokezwa na muktadha. Kiswahili cha kawaida huonyesha rejeo hilo kwa kiambishi cha yambwa; “li” huonyesha wazi kwamba Baba anazungumzia kulitukuza jina lake bila kuingiza wazo jipya.
- issue: Tafsiri ya δοξάζω katika muktadha wa kitheolojia wa Yohana
  choice: tukuza
  alternative: heshimisha; onyesha utukufu wa
  rationale: “Tukuza” huhifadhi mtandao wa lugha ya utukufu katika Injili ya Yohana na haipunguzi maana kuwa heshima ya kawaida tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni fupi na ya moja kwa moja; lugha ya “jina” na “kutukuza” imehifadhiwa kwa sababu ya uzito wake katika teolojia ya Yohana.
