  text: Why was this perfume not sold for three hundred denarii and given to the poor?[a]
translation:
  language: sw
  text: “Kwa nini manukato haya hayakuuzwa kwa dinari mia tatu, na pesa hizo zikapewa maskini?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dinari moja ilikuwa mshahara wa kawaida wa siku moja kwa mfanyakazi; dinari mia tatu zilikuwa karibu na mapato ya mwaka mzima, kwa kuzingatia siku zisizofanyiwa kazi.
    reason: cultural_note
lexical_decisions:
- source_word: Διὰ τί
  choice: Kwa nini
  rationale: Ni swali la kawaida na la moja kwa moja linalomaanisha ‘kwa sababu gani?’
- source_word: τοῦτο τὸ μύρον
  choice: manukato haya
  rationale: μύρον hapa ni manukato ya gharama yaliyotumika kupaka; ‘manukato’ ni neno la kawaida katika Kiswahili cha sasa, na kiashiria ‘haya’ kinaafikiana nalo kisarufi.
- source_word: οὐκ ἐπράθη
  choice: hayakuuzwa
  rationale: Huhifadhi hali ya kutendwa ya kitenzi cha Kigiriki na nguvu ya swali la malalamiko.
- source_word: τριακοσίων δηναρίων
  choice: kwa dinari mia tatu
  rationale: Huhifadhi jina la kihistoria la sarafu na maana ya genitive ya bei, bila kubadili thamani hiyo kuwa makadirio ndani ya matini.
- source_word: καὶ ἐδόθη πτωχοῖς
  choice: na fedha hizo kutolewa kwa maskini
  rationale: Kigiriki kinasema kihalisi ‘na kutolewa kwa maskini’; kuongeza ‘fedha hizo’ kunabainisha kwa Kiswahili cha kawaida kwamba mapato ya mauzo ndiyo yangetolewa, si manukato yenyewe.
