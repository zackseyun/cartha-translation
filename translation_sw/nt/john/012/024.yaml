id: JHN.12.24
reference: John 12:24
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω ὑμῖν, ἐὰν μὴ ὁ κόκκος τοῦ σίτου πεσὼν εἰς τὴν γῆν ἀποθάνῃ, αὐτὸς μόνος μένει· ἐὰν δὲ ἀποθάνῃ, πολὺν καρπὸν φέρει.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/024.yaml
  text: Truly[a], truly, I say to you, unless the grain of wheat falls into the ground and dies, it remains by itself; but if it dies[b], it bears much fruit.
translation:
  language: sw
  text: Amin, amin, nawaambia, punje ya ngano isipoanguka ardhini na kufa, hubaki peke yake; lakini ikifa, huzaa matunda mengi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mfano huu unahusu punje ambayo lazima ife ardhini ili izae matunda. Katika muktadha, Yesu anautumia kuhusu kifo chake mwenyewe na kuhusu wale wanaomfuata.
    reason: cross_reference
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: Amin, amin
  rationale: Katika kauli hii maalumu ya Yesu katika Yohana, mkopo wa Kiswahili “Amin” huhifadhi urudiaji, uzito, na ladha ya usemi wa asili bila kuugeuza kuwa maelezo marefu.
- source_word: λέγω ὑμῖν
  choice: nawaambia
  rationale: Ni usemi wa kawaida na wa moja kwa moja wa Kiswahili unaohifadhi nafsi ya kwanza na anwani ya wingi.
- source_word: ἐὰν μὴ
  choice: isipo-
  rationale: Muundo wa sharti hasi wa Kiswahili unawasilisha kwa kawaida maana ya “isipokuwa/ikiwa haitatokea kwamba” katika sentensi hii.
- source_word: ὁ κόκκος τοῦ σίτου
  choice: punje ya ngano
  rationale: “Punje” ni neno la kawaida kwa chembe ya nafaka inayoweza kupandwa, nalo huhifadhi picha halisi ya kilimo.
- source_word: πεσὼν εἰς τὴν γῆν
  choice: kuanguka ardhini
  rationale: Huhifadhi mwendo wa punje kuingia/kufika kwenye udongo katika muktadha wa kupandwa; “ardhini” ni ya kawaida na yenye hadhi katika Kiswahili.
- source_word: ἀποθάνῃ
  choice: kufa / ikifa
  rationale: Huhifadhi moja kwa moja lugha ya kifo katika mfano badala ya kuipunguza kuwa kuoza au kuota.
- source_word: αὐτὸς μόνος μένει
  choice: hubaki peke yake
  rationale: 'Huhifadhi nguvu ya αὐτός pamoja na μόνος: punje hubaki yenyewe, bila kuongezeka. Usemi huu ni wa asili katika Kiswahili.'
- source_word: ἐὰν δὲ ἀποθάνῃ
  choice: lakini ikifa
  rationale: “Lakini” huonyesha utofauti unaoletwa na δέ, na “ikifa” hutoa sharti hilo kwa ufupi na kawaida.
- source_word: πολὺν καρπὸν φέρει
  choice: huzaa matunda mengi
  rationale: Huhifadhi nahau na mfano wa kuzaa matunda, ambao ni muhimu katika msamiati wa Yohana, bila kuufasiri kuwa mavuno.
theological_decisions:
- issue: Mfano wa kilimo wenye maana inayodokezwa kuhusu kifo cha Yesu na ufuasi
  choice: Kudumisha mfano halisi wa punje inayokufa na kuzaa matunda katika maandishi makuu
  alternative: Kupanua tafsiri ili kutaja wazi kifo cha Yesu na matokeo yake kwa wengi
  rationale: Muktadha unaelekeza kwa Yesu na pia kwa wafuasi wake katika mistari inayofuata, lakini mstari wenyewe hutoa mfano bila kufafanua matumizi yake yote. Tafsiri kwa hiyo haifungi kimya kimya maana hiyo katika fundisho moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Amin, amin” huhifadhi fomula bainifu ya Yohana; “punje ya ngano” na “huzaa matunda mengi” ni wazi kwa wasomaji wa kawaida. Alama [a] imewekwa baada ya mfano mzima unaofafanuliwa na tanbihi.
