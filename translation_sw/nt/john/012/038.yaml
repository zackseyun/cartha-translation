  text: ἵνα ὁ λόγος Ἠσαΐου τοῦ προφήτου πληρωθῇ ὃν εἶπεν· Κύριε, τίς ἐπίστευσεν τῇ ἀκοῇ ἡμῶν; καὶ ὁ βραχίων κυρίου τίνι ἀπεκαλύφθη;
base_translation:
  language: en
  yaml_path: translation/nt/john/012/038.yaml
  text: 'so that the word of Isaiah the prophet might be fulfilled[a], which he said: “Lord, who has believed our report? And to whom has the arm of the Lord been revealed?”'
translation:
  language: sw
  text: 'ili neno la nabii Isaya litimie, ambalo alisema: “Bwana, ni nani aliyeamini ujumbe wetu?[a] Na mkono wa Bwana umefunuliwa kwa nani?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “habari tuliyoitangaza,” au “yale tuliyoyasikia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: ili
  rationale: Kiunganishi hiki huwasilisha kusudi au matokeo kwa njia ya kawaida katika Kiswahili bila kuamua kabisa kati ya maana hizo.
- source_word: ὁ λόγος Ἠσαΐου τοῦ προφήτου
  choice: neno la nabii Isaya
  rationale: “Neno” linaendeleza mtindo wa kibiblia wa kutimia kwa kauli ya nabii, huku muundo wa Kiswahili ukiwa wa kawaida na wazi.
- source_word: πληρωθῇ
  choice: litimie
  rationale: Huhifadhi wazo la kutimia kwa unabii na hali ya utegemezi baada ya ἵνα kwa Kiswahili cha asili.
- source_word: Κύριε
  choice: Bwana
  rationale: Ni tafsiri ya kawaida ya nomino ya mwito κύριος katika anwani kwa Mungu.
- source_word: τίς ἐπίστευσεν
  choice: ni nani aliyeamini
  rationale: Swali hili la balagha linatolewa kwa muundo wa kawaida wa Kiswahili bila kuongeza maelezo.
- source_word: τῇ ἀκοῇ ἡμῶν
  choice: ujumbe wetu
  rationale: Katika muktadha huu ἀκοή linaweza kumaanisha habari au ujumbe uliotangazwa; “ujumbe wetu” ni wazi na wa kawaida katika Kiswahili.
- source_word: ὁ βραχίων κυρίου
  choice: mkono wa Bwana
  rationale: Huhifadhi sitiari ya Kiebrania/Kigiriki kuhusu nguvu na tendo la Mungu badala ya kuifafanua.
- source_word: τίνι ἀπεκαλύφθη
  choice: umefunuliwa kwa nani
  rationale: Huhifadhi kauli tendwa na swali la balagha, kwa wakati unaofaa katika Kiswahili.
theological_decisions:
- issue: Lugha ya kutimia na kusudi au matokeo ya ἵνα
  choice: ili ... litimie
  alternative: hivyo ... likatimia
  rationale: “Ili ... litimie” huhifadhi mfumo wa Yohana wa kutimia kwa Maandiko na haifafanui kwa ziada kama ἵνα hapa ni kusudi, matokeo, au yote mawili.
- issue: Maana ya ἀκοή katika nukuu ya Isaya
  choice: ujumbe wetu
  alternative: habari tuliyoitangaza; yale tuliyoyasikia
  rationale: Neno linaweza kueleza jambo lililosikiwa au ujumbe unaotangazwa. Matini kuu inatumia usemi wa kawaida, huku tanbihi ikihifadhi uwezekano halisi wa kileksia.
- issue: Sitiari ya βραχίων κυρίου
  choice: mkono wa Bwana
  alternative: nguvu za Bwana
  rationale: Sitiari ya Maandiko imehifadhiwa ili tafsiri isibadilishe picha hiyo kuwa ufafanuzi wa kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kimaandiko lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa nukuu na sitiari ya “mkono wa Bwana” umehifadhiwa.
