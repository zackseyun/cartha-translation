  text: ἠγάπησαν γὰρ τὴν δόξαν τῶν ἀνθρώπων μᾶλλον ἤπερ τὴν δόξαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/043.yaml
  text: For they loved the glory of men rather than the glory of God[a].
translation:
  language: sw
  text: Kwa maana walipenda utukufu wa wanadamu kuliko utukufu wa Mungu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sifa ya watu kuliko sifa ya Mungu,” au “kibali cha wanadamu kuliko kibali cha Mungu.”
    reason: Neno la Kigiriki δόξα linaweza kumaanisha utukufu, sifa, heshima au kibali; pia muundo wa Kigiriki unaweza kuonyesha chanzo.
lexical_decisions:
- source_word: ἠγάπησαν
  choice: walipenda
  rationale: Kitenzi cha wakati uliopita kinakazia upendo au mshikamano wa hiari; “walipenda” huhifadhi nguvu ya ἀγαπάω, huku muundo wa kulinganisha ukionyesha walichokipendelea.
- source_word: γὰρ
  choice: Kwa maana
  rationale: Kiunganishi hiki kinatoa sababu ya kauli iliyotangulia na kudumisha uhusiano wa hoja katika muktadha.
- source_word: δόξαν
  choice: utukufu
  rationale: “Utukufu” huhifadhi urudiaji wa neno lilelile katika sehemu zote mbili na mwangwi wake mpana katika Injili ya Yohana; maana finyu zaidi kama “sifa” au “kibali” imewekwa katika tanbihi.
- source_word: τῶν ἀνθρώπων
  choice: wa wanadamu
  rationale: ἄνθρωποι hapa humaanisha watu kwa ujumla, si wanaume pekee. “Wanadamu” ni sahihi kijinsia na huhifadhi uwezekano wa hali ya umilikaji au chanzo katika kauli ya Kigiriki.
- source_word: μᾶλλον ἤπερ
  choice: kuliko
  rationale: Muundo huu wa kulinganisha unaonyesha kwamba walithamini upande mmoja zaidi ya mwingine; “kuliko” ni wa kawaida na wazi katika Kiswahili.
- source_word: τοῦ θεοῦ
  choice: wa Mungu
  rationale: Huhifadhi ulinganifu na “wa wanadamu” na kuacha wazi kama utukufu huo ni wa Mungu au unatoka kwa Mungu.
theological_decisions:
- issue: Maana ya δόξα katika tofauti kati ya wanadamu na Mungu
  choice: utukufu
  alternative: sifa; heshima; kibali
  rationale: “Utukufu” hudumisha upana wa maana na uhusiano wa kiteolojia wa neno hili katika Yohana bila kulifinyaza kuwa kibali pekee.
- issue: Maana ya viambishi vya umilikaji katika τῶν ἀνθρώπων na τοῦ θεοῦ
  choice: wa wanadamu / wa Mungu
  alternative: kutoka kwa wanadamu / kutoka kwa Mungu
  rationale: Muundo wa “wa” huhifadhi ulinganifu na utata halisi wa Kigiriki kati ya utukufu unaohusishwa na mhusika na ule unaotoka kwake.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye lugha ya sasa na yenye hadhi. “Wanadamu” huepuka kueleweka kana kwamba wanaume pekee ndio wanaokusudiwa. Urudiaji wa “utukufu” umehifadhiwa kwa sababu ni wa kimakusudi katika chanzo.
