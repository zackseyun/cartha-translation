id: JHN.12.7
reference: John 12:7
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἶπεν οὖν ὁ Ἰησοῦς· Ἄφες αὐτήν, ⸀ἵνα εἰς τὴν ἡμέραν τοῦ ἐνταφιασμοῦ μου ⸀τηρήσῃ αὐτό·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/007.yaml
  text: So Jesus said[a], “Leave her alone[b], so that she may keep it for the day of my burial.”
translation:
  language: sw
  text: Basi Yesu akasema, “Mwache[a], ili aitunze kwa ajili ya siku ya maziko yangu.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mwache; ameitunza kwa ajili ya siku ya maziko yangu.” Wengine huelewa kifungu hiki kuwa kinaeleza jambo ambalo tayari amelifanya, badala ya jambo ambalo bado angefanya.
    reason: alternative_reading
  - marker: b
    text: Au, “Mwache ili aitunze mpaka siku ya maziko yangu.” Muundo wa Kigiriki unaweza pia kueleweka kwa maana ya wakati iliyo wazi zaidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Basi
  rationale: Huonyesha mwendelezo wa simulizi au hitimisho linalotokana na yaliyotangulia, kwa Kiswahili cha kawaida na cha heshima.
- source_word: Ἄφες αὐτήν
  choice: Mwache
  rationale: Amri hii inamaanisha kuacha kumzuia au kumsumbua mwanamke; “Mwache” ni ya asili na ina nguvu inayofaa katika muktadha.
- source_word: ἵνα
  choice: ili
  rationale: Hutambulisha kusudi au matokeo yaliyokusudiwa bila kuondoa utata wa kisintaksia wa kifungu.
- source_word: εἰς τὴν ἡμέραν
  choice: kwa ajili ya siku
  rationale: Huonyesha tukio la baadaye lililokusudiwa bila kulazimisha maana mahususi zaidi ya “mpaka siku.”
- source_word: ἐνταφιασμοῦ
  choice: maziko
  rationale: Ni neno la kawaida na wazi kwa tendo au tukio la kuzika, bila kutumia istilahi nzito isiyohitajika.
- source_word: τηρήσῃ
  choice: aitunze
  rationale: Huwasilisha wazo la kuhifadhi kitu kwa kusudi fulani; hali ya utegemezi baada ya ἵνα inaonyeshwa kwa muundo wa Kiswahili “ili aitunze.”
- source_word: αὐτό
  choice: -i- katika “aitunze”
  rationale: Kiambishi cha yambwa katika kitenzi kinarejelea marhamu/manukato yaliyotajwa katika muktadha bila kuongeza nomino ambayo haipo katika mstari huu.
theological_decisions:
- issue: Uhusiano wa tendo la mwanamke na maziko ya Yesu yanayokuja
  choice: Kifungu kimetafsiriwa kama agizo la Yesu kwamba kitu hicho kitunzwe kwa ajili ya siku ya maziko yake.
  alternative: “Mwache; ameitunza kwa ajili ya siku ya maziko yangu,” au “Mwache ili aitunze mpaka siku ya maziko yangu.”
  rationale: Kigiriki kina ugumu halisi wa kisintaksia na kimeeleweka kwa njia zaidi ya moja. Tafsiri kuu inafuata kwa karibu muundo Ἄφες… ἵνα… τηρήσῃ, huku maelezo ya chini yakihifadhi uwezekano mwingine badala ya kuumaliza kimya kimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi na chenye heshima. “Mwache” ni ya kawaida kuliko “Mruhusu,” na “maziko” inaeleweka kwa urahisi. Alama zote za maelezo ya chini zimewekwa katika matini kuu.
