review_pass:
  verdict: revise
  source_fidelity: 'Draft faithfully retains the loud public utterance, the generic participial subject, the repeated πιστεύω construction, and the deliberately paradoxical contrast: faith in Jesus is contrasted with faith in the one who sent him without adding “only,” “also,” or “the Father.” A small revision makes the two occurrences of εἰς ἐμέ correspond more visibly in Swahili and renders the two finite Greek verbs more idiomatically.'
  naturalness: “Akapaza sauti na kusema” is understandable but less natural and less verbally parallel than “akapaza sauti, akasema.” Repeating “mimi” in both faith clauses is natural in this solemn register and makes the rhetorical repetition clear.
  terminology: -amini / kumwamini is appropriate Standard East African Swahili for πιστεύω directed toward a person. “Bali” accurately conveys ἀλλά. “Yeye aliyenituma” appropriately leaves the sender indirect, as does the Greek.
  issues:
  - severity: low
    issue: The first occurrence of εἰς ἐμέ is less explicit than the second in the draft.
    rationale: “Anayeniamini” is grammatically adequate, but adding the independent pronoun “mimi” in both clauses better preserves the source’s repeated wording and its rhetorical tension.
  - severity: low
    issue: “Akapaza sauti na kusema” is stylistically less idiomatic than a finite coordinated verb.
    rationale: ἔκραξεν καὶ εἶπεν is naturally rendered “akapaza sauti, akasema,” preserving both actions in clear narrative Swahili.
  revised_text: Lakini Yesu akapaza sauti, akasema, “Yeye anayeniamini mimi, haniamini mimi, bali anamwamini yeye aliyenituma.”
