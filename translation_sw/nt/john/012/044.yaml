  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἰησοῦς δὲ ἔκραξεν καὶ εἶπεν· Ὁ πιστεύων εἰς ἐμὲ οὐ πιστεύει εἰς ἐμὲ ἀλλὰ εἰς τὸν πέμψαντά με,
base_translation:
  language: en
  yaml_path: translation/nt/john/012/044.yaml
  text: But Jesus cried out and said[a], “The one who believes in me does not believe in me[b], but in the one who sent me,”
translation:
  language: sw
  text: Lakini Yesu akapaza sauti, akasema, “Yeye anayeniamini mimi, haniamini mimi, bali anamwamini yeye aliyenituma.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Lakini
  rationale: Hutambulisha mpito wenye utofautishaji mdogo na muktadha uliotangulia; “Lakini” ni ya kawaida na huhifadhi mwendo huo wa hoja.
- source_word: ἔκραξεν
  choice: akapaza sauti
  rationale: Kitenzi κράζω kinaonyesha kusema kwa sauti kubwa hadharani. “Akapaza sauti” ni Kiswahili cha sasa, cha heshima, na chenye nguvu bila kudokeza lazima kilio cha huzuni.
- source_word: Ὁ πιστεύων
  choice: Anayeniamini
  rationale: 'Kirai chenye kibainishi na hali ya kushiriki kina maana ya jumla: mtu yeyote anayemwamini Yesu. Muundo huu ni wa asili kwa Kiswahili na hauongezi neno “yeyote” lisilohitajika.'
- source_word: πιστεύων / πιστεύει εἰς
  choice: -amini
  rationale: Katika Kiswahili, kumwamini mtu huonyesha imani au tegemeo linaloelekezwa kwake. Kurudia mzizi uleule kunahifadhi urudiaji wa Kigiriki.
- source_word: εἰς ἐμέ
  choice: -niamini / haniamini mimi
  rationale: Kiswahili huonyesha kiima cha imani kwa kiambishi cha yambwa badala ya tafsiri ya neno kwa neno ya εἰς. Kiwakilishi “mimi” katika kishazi cha pili kinahifadhi msisitizo na mvutano wa kauli.
- source_word: ἀλλὰ εἰς τὸν πέμψαντά με
  choice: bali anamwamini yeye aliyenituma
  rationale: “Bali” huhifadhi utofautishaji mkali wa ἀλλά. “Yeye aliyenituma” huacha mtendaji akiwa ametajwa kwa njia isiyo ya moja kwa moja kama ilivyo katika Kigiriki, bila kuongeza “Baba” katika matini.
theological_decisions:
- issue: Kauli “haniamini mimi, bali anamwamini yeye aliyenituma” inaweza kueleweka kana kwamba Yesu si mlengwa halali wa imani.
  choice: Kuhifadhi kauli yenye mvutano bila kuongeza “tu” au “pekee.”
  alternative: “Haniamini mimi tu, bali pia anamwamini Baba aliyenituma.”
  rationale: Matini ya Kigiriki haina “tu,” “pekee,” “pia,” wala jina “Baba.” Tafsiri iliyochaguliwa huhifadhi dai la kimahusiano kwamba kumwamini Yesu hakutenganishwi na kumwamini yule aliyemtuma, bila kutatua kimafafanuzi mvutano wa matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Akapaza sauti” ni ya kueleweka kwa wasomaji wa kawaida; “bali” huhifadhi uzito wa utofautishaji wa sentensi. Hakuna tanbihi iliyoongezwa kwa sababu ufafanuzi wa kiteolojia wa Kiingereza si tofauti ya matini wala ya tafsiri inayohitaji kuingia katika mstari huu.
