  rationale: 'The revision is limited to idiomatic verbal coordination and explicit parallel repetition of “mimi.” It preserves the source’s ambiguity and theological tension, does not identify the sender as “Baba,” and adds no interpretive qualification such as “tu” or “pekee.” No footnote is required: the English lexical alternative does not represent a Swahili textual issue, and its explanatory theological note should not be imported as though it were part of the verse.'
