id: JHN.12.26
reference: John 12:26
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐὰν ἐμοί ⸂τις διακονῇ⸃ ἐμοὶ ἀκολουθείτω, καὶ ὅπου εἰμὶ ἐγὼ ἐκεῖ καὶ ὁ διάκονος ὁ ἐμὸς ἔσται· ⸀ἐάν τις ἐμοὶ διακονῇ τιμήσει αὐτὸν ὁ πατήρ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/026.yaml
  text: If anyone serves me[a], let him follow me; and where I am, there my servant will be also. If anyone serves me, the Father will honor him.
translation:
  language: sw
  text: Mtu yeyote akinitumikia[a], na anifuate; nami nilipo, mtumishi wangu atakuwapo pia. Mtu yeyote akinitumikia, Baba atamheshimu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kigiriki kina muundo wa umoja wa kijumla: “Mtu yeyote akinitumikia … Baba atamheshimu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: διακονῇ
  choice: akinitumikia
  rationale: Kitenzi “kutumikia” kinaeleza huduma inayotolewa kwa Yesu kwa Kiswahili cha kawaida, bila maana finyu ya cheo cha kanisa.
- source_word: ἀκολουθείτω
  choice: na anifuate
  rationale: Muundo huu wa Kiswahili unahifadhi nguvu ya amri ya wakati uliopo na unaeleza wito wa kumfuata Yesu bila kulazimisha ufafanuzi wa kipengele cha kuendelea.
- source_word: διάκονος
  choice: mtumishi
  rationale: Hapa neno linamaanisha mtu anayemtumikia Yesu kwa ujumla, si cheo maalumu cha kanisa kama “shemasi.”
- source_word: ὅπου εἰμὶ ἐγὼ
  choice: nami nilipo
  rationale: Kiswahili hiki ni cha asili na kinabeba msisitizo wa kiwakilishi ἐγώ kwa kutumia “nami,” bila kuongeza maana isiyokuwapo.
- source_word: ἐκεῖ καὶ
  choice: atakuwapo pia
  rationale: “Pia” inahifadhi maana ya nyongeza ya καί, huku mahali pakirejelewa kiasili na “nilipo.”
- source_word: τιμήσει
  choice: atamheshimu
  rationale: “Kumheshimu” huwasilisha moja kwa moja ahadi ya Baba kumpa heshima mtumishi wa Yesu bila kufafanua aina ya heshima hiyo.
- source_word: ὁ πατήρ
  choice: Baba
  rationale: Tafsiri haiongezi kimilikishi “yangu,” kwa kuwa Kigiriki kinasema “Baba” tu katika muktadha huu.
- source_word: τις
  choice: mtu yeyote
  rationale: Hii ni tafsiri ya kawaida na jumuishi ya kiwakilishi kisichobainisha mtu τις.
- source_word: αὐτὸν
  choice: -m- katika atamheshimu
  rationale: Kiambishi cha yambwa cha nafsi ya tatu umoja kinamrejelea kiasili mtu yeyote aliyetajwa hapo awali bila kuashiria kwamba ni mwanamume pekee.
theological_decisions:
- issue: Rejeo la kijumla katika sentensi za masharti
  choice: Kutumia “mtu yeyote” na maumbo ya umoja ya ngeli ya mtu
  alternative: Kutumia maneno yanayomtaja mwanamume waziwazi
  rationale: Kigiriki kina muundo wa umoja wa kiume wenye matumizi ya kijumla. Kiswahili hutumia ngeli ya mtu kwa wote bila kulazimika kuingiza jinsia ya kiume, hivyo maana jumuishi na umoja vinahifadhiwa.
- issue: Maana ya heshima anayoitoa Baba
  choice: “Baba atamheshimu” bila kuieleza heshima hiyo zaidi
  alternative: Kuitafsiri mahsusi kuwa thawabu ya mbinguni au kutukuzwa wakati ujao
  rationale: Aya inaahidi heshima kutoka kwa Baba lakini haibainishi namna yake; tafsiri inaacha upana huo wa kitheolojia kama ulivyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Mtumishi” huepuka maana ya cheo cha kanisa, na “Baba” imeachwa bila kuongeza “yangu.”
