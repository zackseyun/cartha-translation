base_translation:
  language: en
  yaml_path: translation/nt/john/012/036.yaml
  text: While you have the light[a], believe in the light, so that you may become sons of light. Jesus spoke these things[b], and he departed and hid from them.
translation:
  language: sw
  text: Maadamu mnayo nuru, iaminini nuru, ili mpate kuwa wana wa nuru.[a] Yesu alisema mambo hayo,[b] kisha akaondoka na kujificha mbali nao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watoto wa nuru.” Kigiriki husema “wana wa nuru,” nahau ya watu wanaotambulishwa na nuru.
    reason: lexical_alternative
  - marker: b
    text: Au, “Yesu alisema mambo haya, na baada ya kuondoka akajificha mbali nao.”
    reason: previous_rendering
lexical_decisions:
- source_word: ὡς τὸ φῶς ἔχετε
  choice: Maadamu mnayo nuru
  rationale: Katika muundo huu ὡς ina maana ya muda, ‘maadamu/wakati mnayo.’ ‘Maadamu’ ni ya asili katika Kiswahili na inadumisha hali ya uharaka bila kuongeza muda usiotajwa.
- source_word: τὸ φῶς
  choice: nuru
  rationale: ‘Nuru’ ni neno la kawaida na lenye hadhi linalohifadhi taswira ya Yohana, pamoja na maana zake za kawaida na za kiteolojia.
- source_word: πιστεύετε εἰς τὸ φῶς
  choice: iaminini nuru
  rationale: Kauli hii inatoa amri ya kuamini nuru. Muundo wa Kiswahili ‘iaminini nuru’ ni mfupi na wa kawaida, nao hauongezi ufafanuzi wa kimadhehebu.
- source_word: ἵνα
  choice: ili
  rationale: ‘Ili’ huonyesha kusudi au tokeo linalokusudiwa kwa njia ya kawaida katika Kiswahili.
- source_word: υἱοὶ φωτός
  choice: wana wa nuru
  rationale: ‘Wana wa nuru’ huhifadhi nahau ya kifamilia ya Kigiriki na wazo la watu wanaotambulishwa kwa nuru. Katika Kiswahili ‘wana’ linaweza kutumika kwa kundi zima bila kubadili taswira ya asili.
- source_word: γένησθε
  choice: mpate kuwa
  rationale: Muundo huu huhifadhi wazo la kufanyika au kuja kuwa, si hali ya kuwapo tu.
- source_word: Ταῦτα ἐλάλησεν Ἰησοῦς
  choice: Yesu alisema mambo hayo
  rationale: Hii ni lugha ya Kiswahili iliyo ya asili na yenye hadhi; inawakilisha λαλέω kwa usahihi katika muktadha wa simulizi.
- source_word: ἀπελθὼν
  choice: kisha akaondoka
  rationale: Kielezi ‘kisha’ kinaonyesha kuwa kuondoka kulitangulia kujificha, kama inavyoonyeshwa na kitenzi-shirikishi cha wakati uliopita.
- source_word: ἐκρύβη ἀπ’ αὐτῶν
  choice: kujificha wasimwone
  rationale: Ingawa umbo la Kigiriki ni la kutendwa, katika muktadha lina maana inayofanana na kujificha mwenyewe. Kiswahili hiki ni cha asili na kinaonyesha kuwa alijificha kutoka kwao.
theological_decisions:
- issue: Nahau ya kifamilia katika υἱοὶ φωτός
  choice: wana wa nuru
  alternative: watoto wa nuru
  rationale: ‘Wana’ huhifadhi kwa karibu zaidi umbo la υἱοί na nahau ya watu wanaotambulishwa kwa nuru; tanbihi inaeleza maana yake jumuishi bila kufifisha taswira ya chanzo.
- issue: Kauli ya Yohana πιστεύω εἰς
  choice: iaminini nuru
  alternative: iwekeni imani yenu katika nuru
  rationale: Chaguo kuu ni la moja kwa moja na haliongezi maelezo. Linahifadhi mwito wa kuamini na mtindo mfupi wa Yohana.
- issue: Maana ya kati katika ἐκρύβη
  choice: kujificha wasimwone
  alternative: alifichwa kutoka kwao
  rationale: Muktadha unaonyesha tendo la Yesu mwenyewe, si kwamba mtu mwingine alimficha; tafsiri ya kujirejelea ndiyo ya asili zaidi katika Kiswahili.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni rahisi kueleweka kwa wasomaji wa kawaida, huku nahau kuu ya ‘wana wa nuru’ na mfuatano wa matendo ya Kigiriki vikihifadhiwa.
