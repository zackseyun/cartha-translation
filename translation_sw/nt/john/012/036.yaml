  rationale: The revision replaces the added purposive wording “wasimwone” with “mbali nao,” directly expressing the source's “from them.” Footnote a is tightened to explain the Greek idiom without interpretive addition, and footnote b now reflects the alternative participial sequencing of “after departing.”
