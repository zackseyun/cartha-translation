    text: Au, “watoto wa nuru.” Kigiriki husema “wana wa nuru,” nahau ya watu wanaotambulishwa na nuru.
    reason: lexical_alternative
  - marker: b
    text: Au, “Yesu alisema mambo haya, na baada ya kuondoka akajificha mbali nao.”
    reason: previous_rendering
  revision_rationale: The revision replaces the added purposive wording “wasimwone” with “mbali nao,” directly expressing the source's “from them.” Footnote a is tightened to explain the Greek idiom without interpretive addition, and footnote b now reflects the alternative participial sequencing of “after departing.”
