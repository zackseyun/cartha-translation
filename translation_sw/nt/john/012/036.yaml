review_pass:
  verdict: revise
  source_fidelity: 'The principal clauses are conveyed accurately: the temporal urgency of ὡς, the call to believe in the light, the purpose of becoming sons of light, and Jesus'' subsequent withdrawal. However, “kujisficha wasimwone” introduces a purpose/result (“so that they would not see him”) not stated by ἀπ’ αὐτῶν, which simply specifies separation from them.'
  naturalness: “Maadamu mnayo nuru” and “iaminini nuru” are natural Standard East African Swahili. “Akajificha mbali nao” is a more direct and natural rendering of hiding himself from them than the purposive “wasimwone.”
  terminology: “Nuru,” “wana wa nuru,” and “iaminini” appropriately retain the Johannine imagery, the masculine familial expression, and πιστεύετε εἰς without doctrinal expansion. The note should explain the idiom without adding “maisha,” which is not explicit in the phrase.
  issues:
  - severity: medium
    issue: “wasimwone” adds an unstated purposive clause.
    rationale: The Greek ἐκρύβη ἀπ’ αὐτῶν means that he hid himself/was hidden from them. Although avoiding being seen is implicit in hiding, the subjunctive wasimwone explicitly recasts the phrase as their not seeing him rather than retaining the stated relation “from them.”
  - severity: low
    issue: Footnote b does not present the relevant alternative for the departure participle.
    rationale: 'The stated alternative, “Baada ya kusema mambo hayo,” shifts attention to the preceding speech, whereas the source-form alternative concerns ἀπελθών: “after departing, he hid himself from them.”'
  - severity: low
    issue: Footnote a adds “maisha” to the explanation of the idiom.
    rationale: The idiom denotes people characterized by light; “maisha yao” is a plausible application but is not required for lexical explanation and is best omitted for precision.
  revised_text: Maadamu mnayo nuru, iaminini nuru, ili mpate kuwa wana wa nuru.[a] Yesu alisema mambo hayo,[b] kisha akaondoka na kujificha mbali nao.
  revised_footnotes:
