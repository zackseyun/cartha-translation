id: JHN.12.9
reference: John 12:9
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἔγνω ⸀οὖν ὄχλος πολὺς ἐκ τῶν Ἰουδαίων ὅτι ἐκεῖ ἐστιν, καὶ ἦλθον οὐ διὰ τὸν Ἰησοῦν μόνον, ἀλλ’ ἵνα καὶ τὸν Λάζαρον ἴδωσιν ὃν ἤγειρεν ἐκ νεκρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/009.yaml
  text: So a large crowd of the Jews learned that he was there[a], and they came not only because of Jesus, but also so that they might see Lazarus, whom he had raised from the dead.
translation:
  language: sw
  text: Basi umati mkubwa kutoka miongoni mwa Wayahudi[a] ukapata habari kwamba Yesu alikuwa huko. Watu hao wakaja si kwa sababu ya Yesu tu, bali pia ili wamwone Lazaro, ambaye Yesu alikuwa amemfufua kutoka kwa wafu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kutoka miongoni mwa watu wa Yudea.” Neno la Kigiriki linaweza kumaanisha Wayahudi kwa ujumla au, katika baadhi ya miktadha katika Yohana, watu wa Yudea hasa.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἔγνω
  choice: ukapata habari
  rationale: Kitenzi cha wakati uliopita hapa kinaonyesha kupata taarifa, si kuwa na maarifa tu. Kauli hii ni ya kawaida na wazi katika Kiswahili.
- source_word: οὖν
  choice: Basi
  rationale: Inaendeleza simulizi kwa kuonyesha matokeo ya yaliyotangulia bila kutumia kiunganishi kizito kupita kiasi.
- source_word: ὄχλος πολὺς
  choice: umati mkubwa
  rationale: Inahifadhi dhana ya kundi kubwa la watu kama nomino ya pamoja.
- source_word: ἐκ τῶν Ἰουδαίων
  choice: wa Wayahudi
  rationale: Inautambulisha umati kuwa wa watu wa Kiyahudi; uwezekano wa maana ya kijiografia, yaani watu wa Yudea, umehifadhiwa katika tanbihi.
- source_word: ὅτι ἐκεῖ ἐστιν
  choice: kwamba Yesu alikuwa huko
  rationale: Yesu ametajwa wazi kwa kuwa ndiye mhusika aliyedokezwa na muktadha. Wakati uliopita ni wa kawaida katika simulizi la Kiswahili baada ya kauli ya kupata habari.
- source_word: ἦλθον
  choice: Watu hao wakaja
  rationale: Kauli hii hufanya wingi wa watu ndani ya umati uwe wazi na huepuka upatanisho usio wa kawaida wa nomino ya pamoja na vitenzi vinavyofuata.
- source_word: οὐ διὰ τὸν Ἰησοῦν μόνον
  choice: si kwa sababu ya Yesu tu
  rationale: διά pamoja na hali ya kushutumiwa huonyesha sababu au kichocheo; tafsiri hii ni wazi na ya kawaida.
- source_word: ἀλλ’ ἵνα καὶ
  choice: bali pia ili
  rationale: Inahifadhi utofautishaji pamoja na kusudi la kuja kwao.
- source_word: ἴδωσιν
  choice: wamwone
  rationale: Hali tegemezi baada ya ἵνα inaonyesha kusudi; muundo wa Kiswahili wenye “ili” unawakilisha hilo kwa kawaida.
- source_word: Λάζαρον
  choice: Lazaro
  rationale: Jina limetoholewa kwa umbo linalotumika kwa kawaida katika Kiswahili.
- source_word: ὃν ἤγειρεν ἐκ νεκρῶν
  choice: ambaye Yesu alikuwa amemfufua kutoka kwa wafu
  rationale: Wakati timilifu uliopita unaweka wazi kwamba kufufuliwa kwa Lazaro kulitangulia kuja kwao; “kutoka kwa wafu” huhifadhi usemi wa chanzo.
theological_decisions:
- issue: Maana ya Ἰουδαίων katika Injili ya Yohana
  choice: Wayahudi
  alternative: watu wa Yudea
  rationale: Katika muktadha huu neno linaweza kueleweka kuwa watu wa Kiyahudi kwa ujumla, lakini matumizi ya Yohana wakati mwingine yanaweza kuwa ya kijiografia. Tafsiri kuu haitii ndani ya mstari maana ya kipolemiki, na tanbihi inalinda uwezekano mwingine.
translation_notes:
  register: 'Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ya Kigiriki imegawanywa mara mbili ili kudumisha upatanisho wa kawaida: “umati” ni nomino ya pamoja, kisha “watu hao” huonyesha wazi wahusika wengi wanaokuja na kutaka kumwona Lazaro.'
