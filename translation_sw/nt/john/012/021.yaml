  text: οὗτοι οὖν προσῆλθον Φιλίππῳ τῷ ἀπὸ Βηθσαϊδὰ τῆς Γαλιλαίας, καὶ ἠρώτων αὐτὸν λέγοντες· Κύριε, θέλομεν τὸν Ἰησοῦν ἰδεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/021.yaml
  text: So these came to Philip[a], who was from Bethsaida in Galilee, and were asking him, saying, “Lord, we want to see Jesus.”
translation:
  language: sw
  text: Basi hao wakamwendea Filipo, aliyetoka Bethsaida, katika Galilaya, wakawa wakimwomba, wakisema, “Bwana[a], tunataka kumwona Yesu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mheshimiwa, tunataka kumwona Yesu.” Neno la Kigiriki κύριε linaweza kuwa namna ya heshima ya kumwita mtu, na pia linaweza kumaanisha “Bwana.”
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτοι
  choice: hao
  rationale: Kiwakilishi-kionyeshi cha wingi kinawarejelea Wagiriki waliotajwa katika mstari uliotangulia na kuhifadhi uhusiano wa kimatini.
- source_word: οὖν
  choice: Basi
  rationale: Huonyesha mwendelezo wa simulizi au matokeo; “Basi” ni kiunganishi cha kawaida na cha asili katika simulizi la Kiswahili.
- source_word: προσῆλθον
  choice: wakamwendea
  rationale: Hutoa maana ya kwenda au kukaribia mtu, huku umbo la mfululizo “waka-” likifaa mtiririko wa simulizi.
- source_word: Φιλίππῳ
  choice: Filipo
  rationale: Hili ndilo umbo la kawaida la jina Φίλιππος katika Biblia za Kiswahili.
- source_word: τῷ ἀπὸ Βηθσαϊδὰ τῆς Γαλιλαίας
  choice: aliyetoka Bethsaida ya Galilaya
  rationale: Kishazi rejeshi ni cha asili katika Kiswahili na kinaonyesha wazi asili ya Filipo bila kuongeza maelezo yasiyokuwamo.
- source_word: ἠρώτων
  choice: wakawa wakimwomba
  rationale: Huhifadhi hali endelevu ya wakati usiotimilifu wa Kigiriki na, katika muktadha huu, huonyesha ombi walilomwelekezea Filipo.
- source_word: λέγοντες
  choice: wakisema
  rationale: Huhifadhi kishiriki kinachoanzisha maneno yenyewe ya ombi lao.
- source_word: Κύριε
  choice: Bwana
  rationale: “Bwana” huhifadhi ulinganifu wa kawaida wa κύριος na pia inaweza kutumiwa kama namna ya heshima ya kumwita mtu; uwezekano wa maana ya “Mheshimiwa” umeonyeshwa katika tanbihi.
- source_word: θέλομεν
  choice: tunataka
  rationale: Ni usemi wa moja kwa moja, wa sasa, na wa kawaida unaoonyesha nia au shauku yao.
- source_word: τὸν Ἰησοῦν
  choice: Yesu
  rationale: Jina la kawaida la Kiswahili; Kiswahili hakihitaji kutafsiri kibainishi cha Kigiriki kabla ya jina la mtu.
- source_word: ἰδεῖν
  choice: kumwona
  rationale: Huhifadhi maana ya msingi ya ὁράω, “kuona,” bila kuifafanua zaidi kuwa kukutana au kuzungumza naye.
theological_decisions:
- issue: Maana ya κύριε katika maneno yaliyoelekezwa kwa Filipo
  choice: Bwana
  alternative: Mheshimiwa
  rationale: Katika muktadha huu neno hilo huenda ni namna ya heshima ya kumwita Filipo, wala si lazima liwe tamko la kitheolojia. “Bwana” huhifadhi uwazi wa kileksika na pia linaweza kuwa jina la heshima katika Kiswahili; tanbihi inahifadhi maana mbadala ya kimuktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo “wakawa wakimwomba” umetumiwa kuhifadhi hali endelevu ya ἠρώτων; “Basi hao” inadumisha rejeo kwa watu waliotajwa katika mstari uliotangulia.
