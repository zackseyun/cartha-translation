id: JHN.12.3
reference: John 12:3
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἡ οὖν ⸀Μαριὰμ λαβοῦσα λίτραν μύρου νάρδου πιστικῆς πολυτίμου ἤλειψεν τοὺς πόδας τοῦ Ἰησοῦ καὶ ἐξέμαξεν ταῖς θριξὶν αὐτῆς τοὺς πόδας αὐτοῦ· ἡ δὲ οἰκία ἐπληρώθη ἐκ τῆς ὀσμῆς τοῦ μύρου.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/003.yaml
  text: Then Mary took a litra of costly pure nard perfume[a], anointed Jesus's feet, and wiped his feet with her hair[c][b]. And the house was filled with the fragrance of the perfume.
translation:
  language: sw
  text: Basi Maria akachukua litra moja ya mafuta ya nardo safi, yenye thamani kubwa[a][b], akazipaka miguu ya Yesu, kisha akaifuta miguu yake kwa nywele zake. Nyumba ikajaa harufu nzuri ya mafuta hayo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Litra ilikuwa kipimo cha uzito cha Waroma, takriban gramu 327, yaani karibu theluthi moja ya kilogramu.
    reason: cultural_note
  - marker: b
    text: Au, “nardo halisi.” Maana kamili ya neno la Kigiriki lililotafsiriwa “safi” inabishaniwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Basi
  rationale: Kiunganishi hiki kinaendeleza simulizi kutokana na tukio lililotangulia bila kulazimisha maana nzito ya hitimisho.
- source_word: λαβοῦσα
  choice: akachukua
  rationale: Kauli shirikishi ya wakati uliopita imewasilishwa kama kitenzi katika mfululizo wa matendo, jambo la kawaida katika simulizi la Kiswahili.
- source_word: λίτραν
  choice: litra moja
  rationale: Jina la kipimo cha kale limehifadhiwa kwa unukuzi badala ya kubadilishwa na kipimo cha kisasa kisicho sawia kabisa; maelezo yametolewa chini.
- source_word: μύρου
  choice: manukato
  rationale: Katika muktadha huu neno hilo linamaanisha mafuta au marhamu yenye harufu nzuri yaliyotumiwa kupaka mwili; “manukato” ni neno la kawaida na linaendana na kutajwa kwa harufu baadaye.
- source_word: νάρδου
  choice: nardo
  rationale: Jina la kitu hicho chenye harufu limehifadhiwa kwa unukuzi unaosomeka kwa Kiswahili.
- source_word: πιστικῆς
  choice: safi
  rationale: Hii ni maana inayokubalika katika muktadha wa nardo yenye thamani kubwa, lakini kwa kuwa maana kamili ya kivumishi hiki inabishaniwa, uwezekano wa “halisi” umehifadhiwa katika tanbihi.
- source_word: πολυτίμου
  choice: ya thamani kubwa
  rationale: Kauli hii inaonyesha wazi thamani yake kubwa ya kifedha kwa Kiswahili cha sasa na chenye hadhi.
- source_word: ἤλειψεν
  choice: akampaka Yesu miguuni
  rationale: “Kupaka” linaeleza tendo la kutumia manukato bila kulazimisha maana ya kiibada au ya kutawaza, huku muktadha ukihifadhi uwezekano wa umuhimu wa kiishara.
- source_word: ἐξέμαξεν
  choice: akaifuta
  rationale: Kitenzi kina maana ya kufuta au kukausha; “kufuta” ni cha moja kwa moja na cha kawaida hapa.
- source_word: ταῖς θριξὶν αὐτῆς
  choice: kwa nywele zake
  rationale: Inahifadhi matumizi ya nywele zake kama chombo cha kufutia kwa Kiswahili cha asili.
- source_word: ἐπληρώθη ἐκ τῆς ὀσμῆς
  choice: ikajaa harufu nzuri
  rationale: Muundo huu unawasilisha hali ya nyumba kujazwa na harufu ya manukato kwa namna ya kawaida katika Kiswahili.
theological_decisions:
- issue: Uwezekano wa kuipa lugha ya kupaka maana ya ziada ya kitheolojia
  choice: Kutafsiri ἤλειψεν kwa “akampaka” katika maana yake ya tendo la simulizi.
  alternative: “akamtia mafuta” au “akampaka mafuta kwa ibada”
  rationale: Andiko linaeleza tendo la kumpaka Yesu manukato lakini halitamki wazi hapa kuwa ni sakramenti, kutawazwa, au ibada rasmi. Tafsiri haifungi umuhimu wake wa kiishara wala kuuingiza moja kwa moja.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo wa simulizi umetumia mfululizo wa vitenzi vya -ka-. Jina la kale “litra” na dutu “nardo” yamehifadhiwa, huku kipimo na utata wa λεξimu πιστικῆς vikifafanuliwa katika tanbihi.
