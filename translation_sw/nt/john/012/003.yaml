    text: Litra ilikuwa kipimo cha uzito cha Waroma, takriban gramu 327, yaani karibu theluthi moja ya kilogramu.
    reason: cultural_note
  - marker: b
    text: Au, “nardo halisi.” Maana kamili ya neno la Kigiriki lililotafsiriwa “safi” inabishaniwa.
    reason: lexical_alternative
  revision_rationale: The revision makes the anointing of Jesus’ feet explicit, uses idiomatic Swahili for the fragrant oil/ointment, and corrects the footnote so that the acknowledged lexical uncertainty is confined to πιστικῆς (“safi”/“halisi”), not to the separate term for high value.
