revisions:
- from: Basi Maria akachukua litra moja ya manukato ya nardo safi na ya thamani kubwa[a][b], akampaka Yesu miguuni, kisha akaifuta miguu yake kwa nywele zake. Nyumba ikajaa harufu nzuri ya manukato hayo.
  to: Basi Maria akachukua litra moja ya mafuta ya nardo safi, yenye thamani kubwa[a][b], akazipaka miguu ya Yesu, kisha akaifuta miguu yake kwa nywele zake. Nyumba ikajaa harufu nzuri ya mafuta hayo.
  rationale: The revision makes the anointing of Jesus’ feet explicit, uses idiomatic Swahili for the fragrant oil/ointment, and corrects the footnote so that the acknowledged lexical uncertainty is confined to πιστικῆς (“safi”/“halisi”), not to the separate term for high value.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T10:42:36Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the narrative connective, the ancient measure, nard, the costly quality, the application to Jesus’ feet, wiping with Mary’s hair, and the house filled with fragrance. However, “akampaka Yesu miguuni” is less precise than the Greek, which expressly identifies Jesus’ feet as the direct location of the anointing. The lexical-alternative note also incorrectly extends the debated sense of πιστικῆς to include “ya thamani kubwa,” which translates the undisputed πολυτίμου.
  naturalness: The narrative sequence is clear and generally natural. “Mafuta ya nardo” is more idiomatic and materially specific in this context than bare “manukato,” while still allowing for the fragrant ointment/oil denoted by μύρον. “Akazipaka miguu ya Yesu” naturally and explicitly expresses application to his feet.
  terminology: “Maria,” “litra,” and “nardo” are suitable. “Mafuta ya nardo safi, yenye thamani kubwa” preserves the debated qualifier without obscuring the separate assertion that the nard was costly. The note should limit the alternative “halisi” to πιστικῆς.
  issues:
  - severity: medium
    issue: The phrase “akampaka Yesu miguuni” does not explicitly state that the perfume was applied to Jesus’ feet.
    rationale: The Greek has τοὺς πόδας τοῦ Ἰησοῦ as the object of ἤλειψεν. A direct rendering avoids the possible sense of merely applying perfume to Jesus while he was at/near his feet.
  - severity: medium
    issue: Footnote b makes “ya thamani kubwa” part of the alternative reading for the debated adjective.
    rationale: Only πιστικῆς is lexically disputed; πολυτίμου independently and clearly means costly/valuable. The note should not suggest that value is included in the lexical uncertainty.
  revised_text: Basi Maria akachukua litra moja ya mafuta ya nardo safi, yenye thamani kubwa[a][b], akazipaka miguu ya Yesu, kisha akaifuta miguu yake kwa nywele zake. Nyumba ikajaa harufu nzuri ya mafuta hayo.
  revised_footnotes:
