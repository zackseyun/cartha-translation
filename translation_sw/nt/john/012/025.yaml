  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὁ φιλῶν τὴν ψυχὴν αὐτοῦ ⸀ἀπολλύει αὐτήν, καὶ ὁ μισῶν τὴν ψυχὴν αὐτοῦ ἐν τῷ κόσμῳ τούτῳ εἰς ζωὴν αἰώνιον φυλάξει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/025.yaml
  text: The one who loves his life loses it[b][a], and the one who hates his life in this world will keep it for eternal life.
translation:
  language: sw
  text: Anayeupenda uhai wake huupoteza, naye anayeuchukia uhai wake katika ulimwengu huu atauhifadhi kwa uzima wa milele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “nafsi yake” au “maisha yake.” Neno la Kigiriki ψυχή linaweza kumaanisha uhai, nafsi, au mtu mwenyewe kulingana na muktadha. “Anayeuchukia uhai wake” ni kauli kali ya kimakusudi kuhusu kutoutanguliza uhai wa sasa katika ulimwengu huu kuliko uzima wa milele; si agizo la kujichukia.
    reason: lexical_alternative_and_paradox_clarification
lexical_decisions:
- source_word: ὁ φιλῶν
  choice: anayeipenda
  rationale: Kirai cha kisifa chenye kibainishi kinamtaja mtu yeyote kwa ujumla; muundo huu wa Kiswahili ni wa kawaida na unadumisha hali ya tendo linaloendelea.
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: nafsi yake
  rationale: Neno ψυχή linaweza kumaanisha uhai, nafsi, au mtu mwenyewe. Katika Kiswahili, “nafsi yake” hudumisha upana huo na kufanya vitendo vya kuipenda, kuichukia, kuipoteza, na kuihifadhi visikike kwa kawaida.
- source_word: ἀπολλύει
  choice: huipoteza
  rationale: Wakati wa sasa unaeleza matokeo ya jumla ya kuipenda nafsi; “huipoteza” unaendana na kinyume chake, “ataihifadhi.”
- source_word: ὁ μισῶν
  choice: anayeichukia
  rationale: Neno kali μισέω limehifadhiwa badala ya kulainishwa kuwa “anayependa kidogo,” ili kudumisha kitendawili cha kauli ya Yesu.
- source_word: ἐν τῷ κόσμῳ τούτῳ
  choice: katika ulimwengu huu
  rationale: Huu ni utafsiri wa moja kwa moja na wa kawaida; katika Yohana kirai hiki pia kinaweza kudokeza mpangilio wa sasa wa ulimwengu.
- source_word: φυλάξει
  choice: ataihifadhi
  rationale: Wakati ujao umehifadhiwa. “Ataihifadhi” huonyesha kuitunza au kuilinda na inafaa kwa mwelekeo unaofuata wa uzima wa milele.
- source_word: εἰς ζωὴν αἰώνιον
  choice: kwa ajili ya uzima wa milele
  rationale: εἰς huonyesha lengo au matokeo; “kwa ajili ya” ni Kiswahili cha asili kinachodumisha uhusiano huo bila kuufafanua kupita kiasi.
theological_decisions:
- issue: Maana ya “kuichukia nafsi yake”
  choice: Kudumisha maneno makali “anayeichukia nafsi yake,” yakifafanuliwa na “katika ulimwengu huu.”
  alternative: anayependa nafsi yake kidogo; asiyeishikilia sana nafsi yake
  rationale: Kitenzi cha Kigiriki ni μισέω. Kauli hii ya kimakusudi yenye ukinzani inapaswa kubaki katika matini; haifundishi mtu kujidharau, bali kukataa kuushikilia uhai au masilahi yake katika ulimwengu wa sasa kuliko uaminifu unaoelekea uzima wa milele.
- issue: Maana ya ψυχή
  choice: nafsi
  alternative: uhai; maisha; mtu mwenyewe
  rationale: “Nafsi” hudumisha uwezekano wa kurejelea uhai au mtu mwenyewe bila kulazimisha wazo la sehemu isiyo ya mwili. Maana pana imeelezwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi unadumisha ulinganifu wa vifungu viwili na ukali wa kitendawili cha Kigiriki. Alama ya tanbihi [a] imewekwa baada ya sentensi kwa kuwa tanbihi inafafanua matumizi ya ψυχή na μισέω katika vifungu vyote viwili.
