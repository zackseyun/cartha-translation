  yaml_path: translation/nt/john/012/011.yaml
  text: because many of the Jews were going away because of him and were believing in Jesus[a][b][c][d].
translation:
  language: sw
  text: kwa kuwa Wayahudi wengi[a] walikuwa wakiondoka[b] kwa ajili yake na walikuwa wakimwamini Yesu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watu wa Yudea.” Katika Injili ya Yohana, “Wayahudi” wakati mwingine linaweza kumaanisha kwa namna mahususi zaidi watu wa Yudea au viongozi wa Kiyahudi, kutegemea muktadha.
    reason: alternative_reading
  - marker: b
    text: Au, “walikuwa wakitoka” au “walikuwa wakijiondoa.” Kitenzi cha Kigiriki kinaonyesha kuondoka kulikokuwa kukiendelea; huenda muktadha ukadokeza kuondoka kutoka msimamo au ushawishi wa viongozi waliompinga Yesu, lakini mstari hautaji wazi walikuwa wakiondoka kwa nani.
    reason: lexical_alternative
  - marker: c
    text: Au, “wakimtumaini Yesu” au “wakiweka imani yao kwa Yesu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: kwa sababu
  rationale: Kiunganishi hiki kinaeleza sababu ya makuhani wakuu kutaka kumuua Lazaro katika mstari uliotangulia.
- source_word: πολλοὶ
  choice: wengi
  rationale: Hili ndilo neno la kawaida na la asili la kuonyesha idadi kubwa bila kuongeza mkazo usiokuwamo katika Kigiriki.
- source_word: δι’ αὐτὸν
  choice: kwa sababu yake
  rationale: διά pamoja na hali ya kushutumiwa ina maana ya sababu hapa; Lazaro ndiye aliyesababisha watu hao kuitikia kwa namna hii.
- source_word: ὑπῆγον
  choice: walikuwa wakiondoka
  rationale: Kauli ya wakati usiotimilika inaonyesha tendo lililokuwa likiendelea au kujirudia. Tafsiri hii inadumisha picha ya kuondoka bila kuamua kimya kimya walikuwa wakiondoka mahali gani au kujitenga na nani.
- source_word: τῶν Ἰουδαίων
  choice: wa Wayahudi
  rationale: 'Huu ni uhusiano wa sehemu ya jumla: wengi miongoni mwa Wayahudi. Neno la Kigiriki linaweza pia kumaanisha Wayudea katika baadhi ya miktadha ya Yohana, jambo linalowekwa katika tanbihi.'
- source_word: ἐπίστευον εἰς τὸν Ἰησοῦν
  choice: wakimwamini Yesu
  rationale: Kauli ya wakati usiotimilika inaonyesha mwitikio uliokuwa ukiendelea au kujirudia, na muundo πιστεύω εἰς unaelekeza imani kwa Yesu binafsi.
theological_decisions:
- issue: Maana ya Ἰουδαίων katika Injili ya Yohana
  choice: Wayahudi
  alternative: Wayudea; viongozi wa Kiyahudi
  rationale: Katika Yohana neno hili hutumiwa kwa maana tofauti kulingana na muktadha. Hapa 'wengi wa' huonyesha sehemu ya kundi, wala si hukumu ya jumla juu ya Wayahudi wote. Tafsiri kuu inahifadhi upana wa neno, huku uwezekano wa 'Wayudea' ukitajwa katika tanbihi.
- issue: Nguvu ya πιστεύω εἰς
  choice: wakimwamini Yesu
  alternative: wakimtumaini Yesu; wakiweka imani yao kwa Yesu
  rationale: Mstari unasema kwamba imani yao ilielekezwa kwa Yesu, lakini hausemi moja kwa moja matokeo yote ya kitheolojia ya imani hiyo. Kwa hiyo tafsiri haiongezi dhana kama 'kuwa wanafunzi' au 'kuokolewa'.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “walikuwa wakiondoka ... na wakimwamini” unadumisha hali ya matendo yaliyokuwa yakiendelea. Kurudiwa kwa “kwa sababu” ni kwa asili katika Kiswahili na kunatofautisha sababu inayounganisha mstari huu na mstari uliotangulia na sababu iliyowafanya watu waitikie.
