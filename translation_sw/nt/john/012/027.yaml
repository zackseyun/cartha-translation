  text: Νῦν ἡ ψυχή μου τετάρακται, καὶ τί εἴπω; πάτερ, σῶσόν με ἐκ τῆς ὥρας ταύτης. ἀλλὰ διὰ τοῦτο ἦλθον εἰς τὴν ὥραν ταύτην.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/027.yaml
  text: Now my soul is troubled[a], and what should I say? Father, save me from this hour. But for this reason I came to this hour.
translation:
  language: sw
  text: Sasa nafsi yangu imefadhaika[a], nami niseme nini? Baba, niokoe kutoka katika saa hii. Lakini ni kwa sababu hii nilikuja kufikia saa hii.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “Niseme nini? ‘Baba, niokoe kutoka katika saa hii’?” Kigiriki kinaweza pia kueleweka kuwa swali la balagha badala ya ombi la moja kwa moja.'
    reason: alternative_reading
lexical_decisions:
- source_word: Νῦν
  choice: Sasa
  rationale: Kielezi hiki kinaonyesha uharaka wa mfadhaiko wa Yesu wakati huu.
- source_word: ψυχή
  choice: nafsi yangu
  rationale: Hurejelea utu au maisha ya ndani ya Yesu; “nafsi” hudumisha uzito wa usemi bila kuufafanua kupita kiasi.
- source_word: τετάρακται
  choice: imefadhaika
  rationale: Kauli timilifu inaonyesha hali ya sasa iliyosababishwa na msukosuko; “imefadhaika” ni ya kawaida na huonyesha taabu ya ndani.
- source_word: τί εἴπω
  choice: niseme nini?
  rationale: Huwasilisha hali ya Yesu ya kujiuliza kwa tafakari kwa Kiswahili cha kawaida.
- source_word: πάτερ
  choice: Baba
  rationale: Ni mwito wa moja kwa moja kwa Mungu, unaotafsiriwa kwa kawaida kuwa “Baba.”
- source_word: σῶσόν με ἐκ τῆς ὥρας ταύτης
  choice: niokoe na saa hii
  rationale: “Niokoe” huhifadhi nguvu ya amri-ombi, na “na saa hii” huonyesha kuokolewa kutoka katika kipindi hiki kinachokaribia.
- source_word: ὥρα
  choice: saa
  rationale: “Saa” hudumisha motifu muhimu katika Yohana ya wakati uliowekwa wa mateso, kifo, na kutukuzwa kwa Yesu.
- source_word: ἀλλὰ διὰ τοῦτο
  choice: Lakini ni kwa sababu hii
  rationale: Huhifadhi tofauti pamoja na maana ya sababu au kusudi bila kuamua kwa nguvu zaidi ya Kigiriki.
- source_word: ἦλθον εἰς τὴν ὥραν ταύτην
  choice: nilikuja kwenye saa hii
  rationale: Hufuata maana ya msingi ya εἰς kama kufikia wakati huo, huku muktadha ukidokeza kusudi.
theological_decisions:
- issue: Iwapo maneno “Baba, niokoe na saa hii” ni ombi la moja kwa moja au sehemu ya swali la balagha.
  choice: 'Yametafsiriwa kama ombi la moja kwa moja: “Baba, niokoe na saa hii.”'
  alternative: “Niseme nini? ‘Baba, niokoe na saa hii’?”
  rationale: Alama za uakifishaji hazikuwa sehemu ya hati za kwanza, hivyo miundo yote miwili inawezekana. Uakifishaji wa SBLGNT unaonyesha ombi la moja kwa moja, kisha kauli pinzani kuhusu kusudi; tanbihi inahifadhi uwezekano wa swali la balagha na mvutano wa kifungu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Nafsi” na “saa” zimedumishwa kwa sababu ya uzito na motifu zake katika Yohana; sentensi ni fupi ili ihifadhi mkazo na mvutano wa asili.
