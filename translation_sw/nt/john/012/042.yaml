base_translation:
  language: en
  yaml_path: translation/nt/john/012/042.yaml
  text: Nevertheless, even among the rulers many believed in him, but because of the Pharisees they were not confessing it, so that they might not become excluded from the synagogue.
translation:
  language: sw
  text: Hata hivyo, hata miongoni mwa viongozi, wengi walimwamini; lakini kwa sababu ya Mafarisayo, hawakuwa wakikiri hilo, ili wasije wakatengwa na sinagogi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wasije wakafukuzwa kutoka sinagogini.” Neno la Kigiriki linamaanisha kutengwa na jumuiya ya sinagogi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅμως μέντοι
  choice: Hata hivyo
  rationale: Jozi hii ya chembe inaonyesha ukinzani wenye msisitizo; “Hata hivyo” ni usemi wa kawaida na wenye heshima unaohifadhi nguvu hiyo.
- source_word: καὶ ἐκ τῶν ἀρχόντων πολλοὶ
  choice: wengi hata miongoni mwa viongozi
  rationale: ἐκ pamoja na hali ya umilikishi huonyesha kuwa walitoka katika kundi hilo, na ἄρχοντες hapa ni viongozi au wenye mamlaka, si wakuu wa kifalme.
- source_word: ἐπίστευσαν εἰς αὐτόν
  choice: walimwamini
  rationale: Katika Yohana, πιστεύω εἰς huonyesha imani au utegemezi unaoelekezwa kwa Yesu; “walimwamini” ni Kiswahili cha kawaida na hakiamui ubora wa imani yao.
- source_word: διὰ τοὺς Φαρισαίους
  choice: kwa sababu ya Mafarisayo
  rationale: διά pamoja na hali ya kushutumiwa huonyesha sababu. Hofu inadokezwa na muktadha lakini haisemwi moja kwa moja, hivyo haijaongezwa katika matini.
- source_word: οὐχ ὡμολόγουν
  choice: hawakuwa wakikiri hilo
  rationale: Wakati usiotimilika unaonyesha hali au tendo lililoendelea. Kiwakilishi “hilo” kinaelekeza kwenye imani yao iliyotangulia bila kulazimisha kitu kisichotajwa wazi katika Kigiriki.
- source_word: ἵνα μὴ
  choice: ili wasije
  rationale: Muundo huu unahifadhi kusudi la kuepuka matokeo fulani kwa Kiswahili cha asili.
- source_word: ἀποσυνάγωγοι γένωνται
  choice: wakatengwa na jumuiya ya sinagogi
  rationale: Neno linaonyesha kuwa nje ya ushirika au jumuiya ya sinagogi; tafsiri hii huonyesha hali ya kutengwa bila kudokeza lazima utaratibu rasmi wa kisheria.
theological_decisions:
- issue: Hali ya imani ya viongozi hawa katika teolojia ya Yohana
  choice: Kutafsiri ἐπίστευσαν moja kwa moja kuwa “walimwamini,” huku kutokiri kwao kukibaki wazi.
  alternative: Kusema walidai tu kuwa na imani, au kusema walikuwa wamepata wokovu wa kweli.
  rationale: Aya inathibitisha kuwa waliamini lakini pia inaonyesha hawakukiri wazi. Tafsiri inadumisha mvutano huo badala ya kuamua hadhi yao ya kiroho zaidi ya matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. “Jumuiya ya sinagogi” inafafanua kwamba kutengwa kulihusu ushirika wa kijamii na kidini, si jengo pekee.
