  text: ἐγὼ φῶς εἰς τὸν κόσμον ἐλήλυθα, ἵνα πᾶς ὁ πιστεύων εἰς ἐμὲ ἐν τῇ σκοτίᾳ μὴ μείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/046.yaml
  text: I have come into the world as light[b][a], so that everyone who believes in me may not remain in the darkness.
translation:
  language: sw
  text: Mimi nimekuja ulimwenguni nikiwa nuru, ili kila anayeniamini asibaki gizani.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φῶς
  choice: nuru
  rationale: “Nuru” ni neno la kawaida na lenye hadhi linalohifadhi sitiari muhimu ya Yohana. Kiswahili hakina vibainishi vinavyolingana moja kwa moja na ‘a/the,’ kwa hiyo hali ya neno la Kigiriki lisilo na kibainishi haihitaji kulazimishwa kwa ufafanuzi wa ziada.
- source_word: εἰς τὸν κόσμον
  choice: ulimwenguni
  rationale: Hali ya mahali yenye kiambishi -ni huwasilisha kwa kawaida kuingia katika nyanja ya ulimwengu katika sentensi yenye kitenzi cha kuja.
- source_word: ἐλήλυθα
  choice: nimekuja
  rationale: Wakati timilifu wa Kiswahili unafaa kuonyesha tendo la kuja lililotimia ambalo matokeo au hali yake inaendelea sasa, sawasawa na nguvu ya perfect ya Kigiriki.
- source_word: ἵνα
  choice: ili
  rationale: “Ili” huonyesha kusudi kwa uwazi na kwa Kiswahili cha kawaida.
- source_word: πᾶς ὁ πιστεύων
  choice: kila anayeamini
  rationale: Muundo huu unaonyesha kundi lote la watu wenye sifa ya kuamini bila kuingiza hitimisho la kimadhehebu kuhusu jinsi imani inavyotokea.
- source_word: πιστεύων εἰς ἐμέ
  choice: anayeniamini
  rationale: “Kumwamini” mtu ni Kiswahili asilia kwa imani au tegemeo linaloelekezwa kwa mtu huyo, na hapa kinarejelea Yesu moja kwa moja.
- source_word: ἐν τῇ σκοτίᾳ
  choice: gizani
  rationale: “Gizani” huhifadhi taswira ya kuwa ndani ya eneo au hali ya giza; kwa kuwa Kiswahili hakina kibainishi cha wazi, haifai kuongeza neno lisilo la lazima ili kuwakilisha άρθρο ya Kigiriki.
- source_word: μὴ μείνῃ
  choice: asibaki
  rationale: 'Hali tegemezi hasi baada ya “ili” huonyesha kusudi hasi kwa njia ya kawaida: mtu huyo asiendelee kubaki katika hali hiyo.'
theological_decisions:
- issue: Kujitambulisha kwa Kristo kwa taswira ya nuru katika Yohana
  choice: “Nikiwa nuru” humtambulisha Yesu mwenyewe kuwa nuru huku ikihifadhi sitiari ya maandiko.
  alternative: “Nimekuja kuleta nuru ulimwenguni”
  rationale: Mbadala ungeweza kumfanya Yesu aonekane tu kuwa mleta nuru, ilhali Kigiriki kinahusisha nuru moja kwa moja na yeye. Tafsiri iliyochaguliwa haiiongezei sitiari maelezo ya kimafundisho.
- issue: Upeo wa πᾶς ὁ πιστεύων
  choice: “Kila anayeniamini”
  alternative: “Yeyote anayeniamini”
  rationale: Chaguo hili linaonyesha upeo wa jumla wa kundi la waaminio bila kuamua mabishano mapana kuhusu uchaguzi au hiari.
- issue: Kusudi linaloonyeshwa na ἵνα pamoja na μή
  choice: “Ili ... asibaki”
  alternative: “Kusudi ... asikae”
  rationale: Muundo huu huhifadhi kusudi la kuja kwa Yesu na wazo la kutokuendelea katika hali ya giza, bila kuligeuza kuwa ahadi iliyofafanuliwa kupita maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Mimi” imehifadhiwa kwa mkazo unaotokana na ἐγώ; “nimekuja” na “asibaki” ni miundo ya kawaida na inayoeleweka kwa wasomaji wengi. Hakuna tanbihi inayohitajika kwa tofauti ya kibainishi, kwa sababu Kiswahili hakina mfumo wa ‘a/the’ kama Kiingereza.
