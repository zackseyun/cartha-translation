base_translation:
  language: en
  yaml_path: translation/nt/john/012/048.yaml
  text: 'The one who rejects me and does not receive my words has one who judges him: the word that I spoke will judge him on the last day[a][b].'
translation:
  language: sw
  text: 'Anayenikataa na asiyeyapokea maneno yangu ana anayemhukumu: neno nililolisema ndilo litakalomhukumu siku ya mwisho.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “na asiyeyakubali maneno yangu.” Kitenzi cha Kigiriki kinaweza kumaanisha kupokea, kuyakaribisha, au kukubali.
    reason: lexical_alternative
  - marker: b
    text: Au, “ujumbe niliosema.” Neno la Kigiriki logos linaweza kumaanisha “neno” au “ujumbe,” kutegemea muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀθετῶν
  choice: anayenikataa
  rationale: Kitenzi hiki hapa kinaonyesha kumkataa Yesu mwenyewe, si kupuuza tu; “anayenikataa” ni cha kawaida na huhifadhi nguvu ya kibinafsi.
- source_word: μὴ λαμβάνων τὰ ῥήματά μου
  choice: kutoyapokea maneno yangu
  rationale: “Kupokea” huhifadhi wazo la kuyakaribisha au kuyakubali maneno ya Yesu, na pia mwangwi wa matumizi ya Kiyohana.
- source_word: τὰ ῥήματά μου
  choice: maneno yangu
  rationale: Wingi “maneno” unaakisi ῥήματα kama matamshi ya Yesu kwa lugha ya kawaida ya Kiswahili.
- source_word: ἔχει τὸν κρίνοντα αὐτόν
  choice: ana wa kumhukumu
  rationale: Muundo huu huhifadhi usemi wenye pengo kidogo wa Kigiriki kwamba mtu huyo tayari “ana” wa kumhukumu, kabla ya sentensi inayofuata kumtambulisha.
- source_word: ὁ λόγος ὃν ἐλάλησα
  choice: neno nililolisema
  rationale: “Neno” huhifadhi umoja na uzito wa λόγος, huku “nililolisema” ikionyesha wazi kuwa ni ujumbe uliotamkwa.
- source_word: ἐκεῖνος κρινεῖ αὐτόν
  choice: ndilo litakalomhukumu
  rationale: “Ndilo” huonyesha msisitizo wa ἐκεῖνος na kurejelea moja kwa moja “neno,” bila kuondoa uhuishaji wa kisemantiki uliomo katika chanzo.
- source_word: ἐν τῇ ἐσχάτῃ ἡμέρᾳ
  choice: siku ya mwisho
  rationale: Huu ni usemi wa asili na wa kawaida wa Kiswahili unaohifadhi rejeo la Kiyohana kuhusu hukumu ya mwisho bila kuongeza mpangilio wa kimafundisho.
theological_decisions:
- issue: Asili ya mhukumu katika mstari huu
  choice: Maneno yanaonyesha neno alilolisema Yesu kuwa ndilo litakalomhukumu mtu siku ya mwisho.
  alternative: Kulieleza neno kuwa kipimo tu cha hukumu, au kuibadili sentensi ili Yesu peke yake atajwe moja kwa moja kuwa mhukumu.
  rationale: Muundo wa Kigiriki kwanza unasema mtu huyo ana wa kumhukumu, kisha unalitaja neno alilolisema Yesu. Tafsiri huhifadhi mvutano huo bila kuupatanisha kimya kimya na kauli nyingine za Yohana kuhusu nafasi ya Yesu katika hukumu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo “ana wa kumhukumu” umeachwa kwa makusudi ili kuhifadhi sintaksia na mvutano wa chanzo, huku “ndilo” ikitoa msisitizo wa kawaida wa Kiswahili.
