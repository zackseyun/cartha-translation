  text: ἀπεκρίθη ⸀οὖν αὐτῷ ὁ ὄχλος· Ἡμεῖς ἠκούσαμεν ἐκ τοῦ νόμου ὅτι ὁ χριστὸς μένει εἰς τὸν αἰῶνα, καὶ πῶς ⸂λέγεις σὺ⸃ ⸀ὅτι δεῖ ὑψωθῆναι τὸν υἱὸν τοῦ ἀνθρώπου; τίς ἐστιν οὗτος ὁ υἱὸς τοῦ ἀνθρώπου;
base_translation:
  language: en
  yaml_path: translation/nt/john/012/034.yaml
  text: So the crowd answered him[a], "We have heard from the Law that the Messiah remains forever[b], and how can you say that the Son of Man must be lifted up? Who is this Son of Man?"
translation:
  language: sw
  text: Basi umati ukamjibu, “Tumesikia kutoka katika Sheria kwamba Masihi[a] hudumu milele; na wewe unawezaje kusema kwamba Mwana wa Adamu hana budi kuinuliwa[b]? Huyu Mwana wa Adamu ni nani?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiyunani χριστός, yaani “Kristo”; hapa limetafsiriwa “Masihi” kwa sababu linatumika kama cheo.
    reason: lexical_alternative
  - marker: b
    text: Au “kutukuzwa.” Katika Yohana, “kuinuliwa” kunaweza kumaanisha kuinuliwa kimwili na pia kutukuzwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη οὖν αὐτῷ ὁ ὄχλος
  choice: Basi umati ukamjibu
  rationale: “Basi” linaendeleza hoja ya mazungumzo; “umati” ni neno la kawaida kwa kundi lililokusanyika, na “ukamjibu” linawakilisha kitenzi pamoja na yambwa αὐτῷ kwa Kiswahili cha asili.
- source_word: Ἡμεῖς ἠκούσαμεν ἐκ τοῦ νόμου
  choice: Tumesikia katika Sheria
  rationale: Wakati timilifu wa Kiswahili unaonyesha mapokeo waliyoyasikia ambayo bado yana uzito katika hoja yao. “Sheria” limehifadhi namna ya Kiyunani ya kurejelea ushuhuda wa Maandiko katika mazingira ya Kiyahudi.
- source_word: ὁ χριστός
  choice: Masihi
  rationale: Hapa Χριστός linatumika wazi kama cheo cha yule aliyetarajiwa, hivyo “Masihi” linaonyesha muktadha wa Kiyahudi kwa uwazi.
- source_word: μένει εἰς τὸν αἰῶνα
  choice: hudumu milele
  rationale: “Hudumu” linaonyesha kuendelea kuwepo kwa muda, huku “milele” likitoa maana ya msemo εἰς τὸν αἰῶνα kwa Kiswahili cha kawaida.
- source_word: πῶς λέγεις σὺ
  choice: unawezaje kusema
  rationale: Swali linaonyesha mshangao na pingamizi, si ombi la taarifa tu; “unawezaje kusema” linahifadhi nguvu hiyo.
- source_word: δεῖ ὑψωθῆναι
  choice: hana budi kuinuliwa
  rationale: “Hana budi” linaonyesha ulazima wa δεῖ. “Kuinuliwa” halifungi maana katika kuinuliwa kimwili pekee wala kutukuzwa pekee.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  rationale: Hili ni tumizi la kawaida na lenye hadhi la cheo hiki katika Kiswahili, nalo linahifadhi mwangwi wake wa kibiblia.
- source_word: τίς ἐστιν οὗτος ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Huyu Mwana wa Adamu ni nani?
  rationale: Mpangilio huu ni wa asili katika Kiswahili na unahifadhi mkazo wa οὗτος, “huyu.”
theological_decisions:
- issue: Tafsiri ya Χριστός kama cheo
  choice: Masihi
  alternative: Kristo
  rationale: Katika kauli “Masihi hudumu milele,” neno hili linafanya kazi kama cheo cha matarajio ya Kiyahudi, si kama jina la kawaida.
- issue: Maana yenye tabaka ya ὑψωθῆναι katika Yohana
  choice: kuinuliwa
  alternative: kutukuzwa
  rationale: “Kuinuliwa” linaweza kuelekeza kwenye kuinuliwa kimwili msalabani na pia kwenye kuinuliwa kwa heshima; tafsiri haiondoi mvutano huo wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi zimeundwa kwa urahisi wa kusomwa kwa sauti, huku istilahi za kibiblia “Sheria,” “Masihi,” na “Mwana wa Adamu” zikihifadhiwa.
