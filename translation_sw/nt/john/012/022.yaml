  text: ἔρχεται ⸀ὁ Φίλιππος καὶ λέγει τῷ Ἀνδρέᾳ· ⸀ἔρχεται Ἀνδρέας καὶ Φίλιππος ⸀καὶ λέγουσιν τῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/022.yaml
  text: Philip comes and tells Andrew[a]; Andrew and Philip come and tell Jesus.
translation:
  language: sw
  text: Filipo anakuja na kumwambia Andrea[a]; Andrea na Filipo wanakuja na kumwambia Yesu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki kinatumia wakati uliopo wa kihistoria katika mstari wote (‘anakuja … anamwambia … wanakuja … wanamwambia’), mtindo wa kawaida wa usimulizi unaofanya tukio lionekane la moja kwa moja. Tafsiri nyingine hutumia wakati uliopita.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται
  choice: anakuja / wanakuja
  rationale: Wakati uliopo wa kihistoria umehifadhiwa ili kuendeleza uhai na ukaribu wa usimulizi wa Yohana. Umbo la pili ni la wingi kwa sababu wahusika ni Andrea na Filipo.
- source_word: λέγει / λέγουσιν
  choice: anamwambia / wanamwambia
  rationale: ‘Kumwambia’ ni Kiswahili cha kawaida na huonyesha mawasiliano yanayoelekezwa kwa mtu bila kuongeza maudhui ambayo hayakutajwa.
- source_word: καί
  choice: na
  rationale: Kiunganishi rahisi ‘na’ kinahifadhi mtiririko wa sentensi za Kigiriki bila kuongeza maana ya wakati au matokeo kama ‘kisha’ au ‘kwa hiyo’.
- source_word: ὁ Φίλιππος
  choice: Filipo
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili; kibainishi cha Kigiriki hakihitaji kutafsiriwa mbele ya jina la mtu.
- source_word: τῷ Ἀνδρέᾳ
  choice: Andrea
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili, na uhusiano wa yambwa umeonyeshwa na kiambishi ‘-mw-’ katika ‘kumwambia’.
- source_word: τῷ Ἰησοῦ
  choice: Yesu
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili, na uhusiano wa yambwa umeonyeshwa na kiambishi ‘-mw-’ katika ‘kumwambia’.
