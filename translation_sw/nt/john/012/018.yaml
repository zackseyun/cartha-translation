  text: For this reason also the crowd went to meet him[b][a], because they heard that he had done this sign.
translation:
  language: sw
  text: Kwa sababu hiyo, umati pia ulikwenda kumlaki[a], kwa maana walikuwa wamesikia kwamba alikuwa amefanya ishara hii[b].
  philosophy: optimal-equivalence
  footnotes:
