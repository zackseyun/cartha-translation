    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Kwa sababu hiyo
  rationale: Kirai hiki kinaonyesha wazi uhusiano wa kisababishi na yaliyotangulia.
- source_word: καὶ
  choice: pia
  rationale: Neno hili linahifadhi maana ya nyongeza katika tendo la umati.
- source_word: ὑπήντησεν αὐτῷ
  choice: ulikwenda kumlaki
  rationale: Kitenzi cha Kigiriki kina maana ya kwenda kukutana na mtu; “kwenda kumlaki” ni Kiswahili cha kawaida kinachohifadhi mwelekeo huo.
- source_word: ὁ ὄχλος
  choice: umati
  rationale: “Umati” ni neno la kawaida na lenye heshima kwa kundi kubwa la watu.
- source_word: ὅτι
  choice: kwa maana
  rationale: Hapa kiunganishi kinaeleza sababu iliyoufanya umati uende kumlaki Yesu.
- source_word: ἤκουσαν
  choice: walikuwa wamesikia
  rationale: Wakati uliotangulia unaweka wazi kwamba kusikia kulitokea kabla ya umati kwenda kumlaki, bila kubadili maana ya aoristi katika muktadha huu.
- source_word: τοῦτο αὐτὸν πεποιηκέναι τὸ σημεῖον
  choice: kwamba alikuwa amefanya ishara hii
  rationale: Muundo huu unahifadhi tendo lililokamilika na mpangilio wa kawaida wa Kiswahili; “hii” inaelekeza kwenye ishara iliyotajwa katika muktadha.
- source_word: τὸ σημεῖον
  choice: ishara
  rationale: “Ishara” huhifadhi matumizi maalumu ya Yohana kwa tendo la ajabu linaloelekeza zaidi ya tendo lenyewe, badala ya kulifanya tu kuwa “muujiza.”
theological_decisions:
- issue: Tafsiri ya neno la Kiyohana σημεῖον
  choice: ishara
  alternative: muujiza
  rationale: “Ishara” huhifadhi uzito wa kifunuo wa matendo ya Yesu katika Injili ya Yohana, bila kuondoa hali yake ya ajabu wala kuingiza ufafanuzi wa ziada.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo ni wa ulinganifu mwafaka na unahifadhi uhusiano wa kisababishi pamoja na maana ya pekee ya “ishara” katika Yohana.
