  yaml_path: translation/nt/john/012/041.yaml
  text: Isaiah said these things because he saw his glory and spoke about him[a].
translation:
  language: sw
  text: Isaya alisema mambo haya kwa sababu aliuona utukufu wake, naye akazungumza kumhusu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Isaya alisema mambo haya kwa sababu aliuona utukufu wa Mungu, naye akazungumza kumhusu.” Katika muktadha wa Yohana, huenda viwakilishi hivyo vinamrejelea Yesu; lakini katika muktadha mpana wa Isaya, ni maono ya utukufu wa Bwana (Isa 6:1).
    reason: alternative_reading
lexical_decisions:
- source_word: ταῦτα
  choice: mambo haya
  rationale: Kiwakilishi cha wingi wa kati kinarejelea maneno ya kinabii yaliyotangulia; “mambo haya” ni Kiswahili cha kawaida na wazi.
- source_word: εἶπεν
  choice: alisema
  rationale: Hutoa maana ya kawaida ya kitenzi λέγω na kuruhusu utofautishaji mdogo na ἐλάλησεν baadaye.
- source_word: Ἠσαΐας
  choice: Isaya
  rationale: Hili ndilo umbo la kawaida la jina la nabii katika Kiswahili cha Biblia.
- source_word: ὅτι
  choice: kwa sababu
  rationale: Katika muktadha huu ὅτι inaeleweka vizuri zaidi kama ikitoa sababu ya Isaya kusema mambo hayo; maana ya “kwamba” inawezekana kisarufi lakini haifai sana hapa.
- source_word: εἶδεν
  choice: aliuona
  rationale: Ni tafsiri ya moja kwa moja ya ὁράω; kiambishi “u-” kinapatana kwa kawaida na nomino “utukufu.”
- source_word: τὴν δόξαν αὐτοῦ
  choice: utukufu wake
  rationale: “Utukufu” huhifadhi uzito wa δόξα katika Yohana, huku “wake” ikidumisha kutotajwa kwa jina la anayerejelewa katika Kigiriki.
- source_word: ἐλάλησεν
  choice: akasema
  rationale: Huwasilisha λαλέω kwa Kiswahili cha kawaida huku mfuatano wa “aka-” ukiunganisha tendo hili na kuona kwake; Kiswahili hakihitaji utofautishaji mkali kati ya λέγω na λαλέω hapa.
- source_word: περὶ αὐτοῦ
  choice: habari zake
  rationale: Ni usemi wa asili wa Kiswahili wenye maana ya kusema kumhusu mtu, na unahifadhi kiwakilishi kisichomtaja moja kwa moja.
theological_decisions:
- issue: Anayerejelewa na viwakilishi αὐτοῦ / αὐτοῦ
  choice: Viwakilishi vimeachwa kama “wake/zake,” huku muktadha wa Yohana ukielekeza kwa Yesu.
  alternative: Kutaja wazi “utukufu wa Mungu” na kwamba Isaya alisema habari zake.
  rationale: Muktadha wa karibu unatumia Isaya kueleza kutokuamini kwa watu mbele ya Yesu na hivyo unaelekeza viwakilishi kwa Yesu. Hata hivyo, Isaya 6 ni maono ya utukufu wa Bwana. Kutohusisha jina moja kwa moja katika mstari kunahifadhi umbo na mvutano wa matini ya Kigiriki, na tanbihi inaeleza uwezekano mpana.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Mambo haya” na “habari zake” ni misemo inayoeleweka kwa urahisi; viwakilishi vinahifadhi kutotajwa wazi kwa mhusika kama ilivyo katika Kigiriki.
