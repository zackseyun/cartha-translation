  text: οἱ οὖν Φαρισαῖοι εἶπαν πρὸς ἑαυτούς· Θεωρεῖτε ὅτι οὐκ ὠφελεῖτε οὐδέν· ἴδε ὁ ⸀κόσμος ὀπίσω αὐτοῦ ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/019.yaml
  text: So the Pharisees said to one another[a], “You see that you are accomplishing nothing. Look—the world has gone after him.”
translation:
  language: sw
  text: Basi Mafarisayo wakaambiana, “Mnaona kwamba hamfaulu chochote. Tazama, ulimwengu umekwenda kumfuata!”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kila mtu amekwenda kumfuata.” Kigiriki kinasema “ulimwengu,” huenda ni usemi wa kutia chumvi.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Basi
  rationale: Huonyesha matokeo au hitimisho linalotokana na tukio lililotangulia, kwa mtiririko wa kawaida wa Kiswahili.
- source_word: πρὸς ἑαυτούς
  choice: wakaambiana
  rationale: Hutoa maana ya kutendeana ya Mafarisayo kusema wao kwa wao kwa lugha ya kawaida na wazi.
- source_word: Θεωρεῖτε
  choice: Mnaona
  rationale: Ni kitenzi cha wakati uliopo, wingi, kinachotumiwa hapa kama kauli ya kusisitiza kwa kukata tamaa, si lazima kama amri.
- source_word: οὐκ ὠφελεῖτε οὐδέν
  choice: hamfanikiwi chochote
  rationale: Huwasilisha ubatili wa juhudi zao dhidi ya Yesu bila kufuata kihalisi maana ya faida au msaada isiyofaa vizuri katika muktadha huu.
- source_word: ἴδε
  choice: Tazama
  rationale: Ni neno la kuvuta fikira lenye msisitizo wa ghafla; “Tazama” lina hadhi na linaeleweka katika Kiswahili cha sasa.
- source_word: κόσμος
  choice: ulimwengu
  rationale: Hudumisha neno halisi la Kigiriki na chumvi ya usemi ya Mafarisayo badala ya kulifupisha moja kwa moja kuwa “kila mtu.”
- source_word: ὀπίσω αὐτοῦ
  choice: kumfuata
  rationale: Hutoa kwa Kiswahili maana ya nahau ya kwenda nyuma ya mtu kwa kuwa mfuasi wake.
- source_word: ἀπῆλθεν
  choice: umekwenda
  rationale: Wakati timilifu wa Kiswahili unasisitiza hali iliyotokea na matokeo yake yanayoonekana sasa, kama ilivyo katika malalamiko yao.
theological_decisions:
- issue: Upeo wa κόσμος katika kauli ya Mafarisayo
  choice: Kudumisha “ulimwengu” kama chumvi ya usemi
  alternative: “kila mtu” au “umati wote”
  rationale: Kauli hiyo ni ya kutia chumvi kutokana na kufadhaika. “Ulimwengu” huhifadhi usemi wa Kigiriki na mwangwi wake katika Injili ya Yohana bila kudai kwamba kila mwanadamu alimfuata Yesu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Usemi “wakaambiana” ni wa asili zaidi kuliko “walisema wao kwa wao,” huku “hamfanikiwi chochote” ukitoa wazi maana ya ubatili wa juhudi zao.
