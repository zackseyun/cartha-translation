base_translation:
  language: en
  yaml_path: translation/nt/john/012/031.yaml
  text: Now is the judgment of this world[b][a]; now the ruler of this world will be cast out.
translation:
  language: sw
  text: Sasa ulimwengu huu unahukumiwa; sasa mtawala wa ulimwengu huu[a] atatupwa nje.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mkuu wa ulimwengu huu.” Usemi huu kwa kawaida hueleweka kumrejelea Shetani.
    reason: lexical_alternative_and_identity_note
lexical_decisions:
- source_word: νῦν
  choice: Sasa
  rationale: Limetafsiriwa vivyo hivyo katika sehemu zote mbili ili kuhifadhi mkazo wa wakati na muundo sambamba wa Kigiriki.
- source_word: κρίσις ἐστὶν
  choice: unahukumiwa
  rationale: Kauli ya kitenzi ni ya asili katika Kiswahili na inaonyesha tendo la hukumu linalotokea sasa, bila kuibana maana kuwa hukumu ya adhabu pekee.
- source_word: τοῦ κόσμου τούτου
  choice: ulimwengu huu
  rationale: Huhifadhi kiashiria τούτου na utofautishaji wa Kiyohana unaohusishwa na ulimwengu wa sasa.
- source_word: ὁ ἄρχων
  choice: mtawala
  rationale: Ni neno la sasa na linaloeleweka kwa mtu mwenye mamlaka, bila kumtaja moja kwa moja anayekusudiwa.
- source_word: ἐκβληθήσεται ἔξω
  choice: atatupwa nje
  rationale: Huhifadhi hali ya kutendwa ya wakati ujao na msisitizo wa kuondolewa unaotokana na ἔξω.
theological_decisions:
- issue: Utambulisho wa “mtawala wa ulimwengu huu”
  choice: Umeachwa wazi katika matini kuu kama “mtawala wa ulimwengu huu.”
  alternative: Shetani/Ibilisi; au mfumo wa ulimwengu wa sasa uliowasilishwa kama mtu
  rationale: Katika Yohana usemi huu hueleweka kwa kawaida kumrejelea Shetani, lakini Kigiriki kinatumia cheo badala ya jina. Tafsiri haiingizi utambulisho huo moja kwa moja katika matini.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo sambamba wa “Sasa ...; sasa ...” umehifadhiwa, na “atatupwa nje” ni usemi wazi unaodumisha nguvu ya Kigiriki.
