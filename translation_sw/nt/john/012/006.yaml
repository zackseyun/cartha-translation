base_translation:
  language: en
  yaml_path: translation/nt/john/012/006.yaml
  text: He said this not because he cared about the poor[a], but because he was a thief, and having the money box[b], he used to take what was put into it.
translation:
  language: sw
  text: Alisema hivyo, si kwa sababu aliwajali maskini, bali kwa sababu alikuwa mwizi na, akiwa na sanduku la fedha[a], alikuwa akichukua vilivyowekwa humo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “mfuko wa fedha.” Neno la Kigiriki linaweza kumaanisha chombo cha kuhifadhia fedha.
    reason: lexical_alternative
  - marker: b
    text: Au, “alikuwa akivibeba,” au “alikuwa akiiba vilivyowekwa humo.” Mara nyingi kitenzi cha Kigiriki humaanisha “kubeba,” lakini hapa muktadha (“alikuwa mwizi”) unaonyesha kujitwalia isivyo halali.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν δὲ τοῦτο
  choice: Alisema hivyo
  rationale: Kauli hii inawakilisha moja kwa moja ‘alisema hili/hivyo’; δέ ni kiunganishi chepesi ambacho si lazima kiwekwe wazi katika Kiswahili.
- source_word: οὐχ ὅτι περὶ τῶν πτωχῶν ἔμελεν αὐτῷ
  choice: si kwa sababu aliwajali maskini
  rationale: Muundo οὐχ ὅτι unakanusha sababu inayodhaniwa, na μέλει pamoja na mtendewa huonyesha kuwajali watu.
- source_word: ἀλλ’ ὅτι κλέπτης ἦν
  choice: bali kwa sababu alikuwa mwizi
  rationale: ἀλλ’ ὅτι hutaja sababu halisi kwa kulinganisha na iliyokanushwa; κλέπτης ni mwizi, si lazima mnyang’anyi.
- source_word: τὸ γλωσσόκομον ἔχων
  choice: Yeye ndiye aliyekuwa na sanduku la fedha
  rationale: γλωσσόκομον inaweza kuwa sanduku au mfuko wa kuhifadhia fedha; ‘sanduku la fedha’ ni wazi na karibu na maana ya msingi. Muundo huu pia unaonyesha kwamba sanduku hilo lilikuwa chini ya usimamizi wake.
- source_word: τὰ βαλλόμενα
  choice: vilivyowekwa humo
  rationale: Kirai hiki kinamaanisha vitu vilivyotiwa ndani ya chombo; ‘humo’ huweka wazi mahali panaporejelewa bila kudai kwamba vilikuwa fedha pekee.
- source_word: ἐβάσταζεν
  choice: alikuwa akichukua
  rationale: Wakati usiotimilika unaonyesha tendo la mazoea au lililoendelea. Katika muktadha wa kuitwa mwizi, βαστάζω inaashiria kujitwalia, ingawa kimsingi inaweza pia kumaanisha kubeba.
theological_decisions:
- issue: Maana ya ἐβάσταζεν kuhusiana na wizi wa Yuda
  choice: alikuwa akichukua vilivyowekwa humo
  alternative: alikuwa akiviba vilivyowekwa humo; alikuwa akivibeba vilivyowekwa humo
  rationale: Muktadha wa ‘alikuwa mwizi’ unaelekeza kwenye kujitwalia kwa udanganyifu. Hata hivyo, ‘akichukua’ huhifadhi kiasi fulani cha upana wa kitenzi βαστάζω badala ya kuingiza moja kwa moja ‘kuiba’ katika kitenzi chenyewe.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imegawanywa ili isomeke kwa urahisi, huku msisitizo wa Kigiriki juu ya Yuda kuwa na sanduku ukihifadhiwa kwa ‘Yeye ndiye’. Alama zote za tanbihi [a] na [b] zimo katika matini kuu.
