  yaml_path: translation/nt/john/012/045.yaml
  text: And the one who sees me sees the one who sent me[a].
translation:
  language: sw
  text: Na anayeniona anamwona aliyenituma.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “anayenitazama”; kitenzi cha Kigiriki kinaweza kumaanisha kuona kwa kutazama na kutambua kwa makini, si kuona kwa macho tu.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Na
  rationale: Kiunganishi hiki kinaunganisha kauli na muktadha uliotangulia kwa njia ya moja kwa moja na ya kawaida.
- source_word: ὁ θεωρῶν
  choice: anayeniona
  rationale: Kirai chenye kibainishi na kitenzi-ushiriki cha wakati uliopo kinamtaja kwa ujumla mtu anayefanya tendo hilo. Muundo huu ni wa asili katika Kiswahili na unadumisha umoja wa uwakilishi.
- source_word: ἐμὲ
  choice: -ni- (katika “anayeniona”)
  rationale: Kiwakilishi cha nafsi ya kwanza kama yambwa kinaonyeshwa kwa kiambishi -ni- katika kitenzi cha Kiswahili, bila kulazimisha mkazo usiohitajika.
- source_word: θεωρεῖ
  choice: anamwona
  rationale: Kitenzi θεωρέω kinaweza kumaanisha kuona, kutazama, au kutambua kwa makini. “Anamwona” ni lugha ya kawaida ya sasa na kinahifadhi urudiaji wa kitenzi cha Kigiriki.
- source_word: τὸν πέμψαντά με
  choice: aliyenituma
  rationale: Kitenzi-ushiriki chenye kibainishi kinamtaja yule aliyemtuma Yesu bila kuongeza cheo kisichotajwa wazi katika mstari. Kiswahili huwasilisha uhusiano huu kwa ufupi na kwa kawaida.
theological_decisions:
- issue: Uhusiano kati ya kumwona Yesu na kumwona aliyemtuma
  choice: 'Kauli imetafsiriwa moja kwa moja: anayemwona Yesu anamwona aliyemtuma.'
  alternative: Kufafanua kuwa mtu anamjua tu aliyetuma kupitia Yesu, au kuongeza maneno yanayodai utambulisho wa kiontolojia.
  rationale: Kigiriki kinaweka ulinganifu wa moja kwa moja katika ufunuo, lakini hakitoi ufafanuzi zaidi hapa. Tafsiri inadumisha nguvu na mvutano wa kiteolojia wa kauli bila kuupunguza wala kuongeza fundisho lisilotamkwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye staha, na inayoeleweka kwa urahisi. Urudiaji wa “ona” umedumishwa ili kuakisi urudiaji wa θεωρέω katika Kigiriki.
