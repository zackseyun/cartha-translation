base_translation:
  language: en
  yaml_path: translation/nt/john/012/032.yaml
  text: And I[a], when I am lifted up from the earth[c][b], will draw all people to myself.
translation:
  language: sw
  text: Nami, nitakapoinuliwa[a][b] kutoka ardhini, nitawavuta watu wote[c] kwangu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ikiwa nitainuliwa.” Kigiriki kimetumia umbo la sharti, lakini katika muktadha linarejelea kifo cha Yesu kinachokaribia na ambacho kinaelezwa kuwa cha hakika.
    reason: alternative_reading
  - marker: b
    text: “Kuinuliwa” kunaweza pia kumaanisha “kutukuzwa”; hivyo hudumisha maana mbili katika Yohana—kusulubiwa na kutukuzwa.
    reason: lexical_alternative
  - marker: c
    text: Kwa neno moja, “wote.” Kigiriki kinaelekea kumaanisha watu wote, lakini mstari huu wenyewe hauelezi zaidi jinsi kauli hiyo inavyohusiana na mijadala ya kitheolojia kuhusu upeo wa wokovu.
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ
  choice: Nami
  rationale: Muungano wa καί na ἐγώ unaunganisha kauli hii na iliyotangulia huku ukimkazia Yesu kwa kiasi. “Nami” ni ya asili na huhifadhi nguvu hizo zote mbili.
- source_word: ἐὰν
  choice: nitakapoinuliwa
  rationale: Ingawa ἐάν pamoja na hali tegemezi ina umbo la sharti, katika muktadha Yesu anazungumzia kifo chake kinachokaribia kama tukio la hakika. Muundo wa “nitakapo-” huwasilisha maana hiyo kwa Kiswahili cha kawaida, huku tanbihi ikihifadhi uwezekano wa kutafsiri umbo la sharti moja kwa moja.
- source_word: ὑψωθῶ
  choice: nitakapoinuliwa
  rationale: Kitenzi ὑψόω katika Yohana kinadokeza kwa pamoja kuinuliwa kimwili msalabani na kutukuzwa. “Kuinuliwa” huhifadhi maana hizo mbili kuliko “kutukuzwa” peke yake.
- source_word: ἐκ τῆς γῆς
  choice: kutoka ardhini
  rationale: Hapa γῆ inaelekea kumaanisha ardhi au uso wa nchi ambao Yesu atainuliwa kutoka kwake wakati wa kusulubiwa. “Kutoka ardhini” ni wazi na haigeuzi kauli kuwa rejeo la nchi fulani.
- source_word: πάντας
  choice: watu wote
  rationale: Kivumishi hiki cha wingi wa kiume kimetumiwa kama nomino na kwa kawaida kinawarejelea wanadamu. “Watu wote” huweka rejeo hilo wazi bila kuamua mabishano ya baadaye kuhusu upeo wa wokovu.
- source_word: ἑλκύσω
  choice: nitawavuta
  rationale: ἕλκω humaanisha kuvuta au kuelekeza kitu au mtu upande fulani. “Nitawavuta” huhifadhi nguvu ya picha hiyo bila kufafanua kupita kiasi namna uvutaji huo unavyotendeka.
- source_word: πρὸς ἐμαυτόν
  choice: kwangu
  rationale: Katika Kiswahili, “kwangu” huwasilisha kwa njia ya kawaida mwelekeo unaolengwa na kiwakilishi cha kujirejelea ἐμαυτόν; “kwangu mwenyewe” ingekuwa na mkazo usio wa lazima hapa.
theological_decisions:
- issue: Upeo wa πάντας kuhusiana na wokovu
  choice: watu wote
  alternative: wote; kila mtu; watu wa kila aina
  rationale: Neno la Kigiriki linawarejelea watu na lina upeo mpana. Tafsiri haisuluhishi kimya kimya kama maana ni kila mtu bila ubaguzi au watu wa kila aina; tanbihi inaonyesha kuwa Kigiriki chenyewe kinasema “wote.”
- issue: Maana mbili za ὑψωθῶ katika Yohana
  choice: kuinuliwa
  alternative: kutukuzwa
  rationale: “Kuinuliwa” hudumisha mvutano wa kimakusudi kati ya kusulubiwa kwa Yesu na kutukuzwa kwake, badala ya kuchagua upande mmoja tu wa maana.
- issue: Umbo la sharti la ἐὰν na uhakika wa kifo cha Yesu katika muktadha
  choice: nitakapoinuliwa
  alternative: nikiinuliwa; ikiwa nitainuliwa
  rationale: Muktadha unaonyesha tukio linalokaribia na la hakika, lakini Kigiriki kimetumia umbo la sharti. Maandishi makuu yanatumia Kiswahili cha kawaida kinachoonyesha uhakika huo, na tanbihi inahifadhi umbo mbadala la sharti.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Sentensi fupi imehifadhi mpangilio na mkazo wa chanzo bila kuwa ngumu; istilahi “kuinuliwa” imechaguliwa ili kubeba maana mbili za Yohana.
