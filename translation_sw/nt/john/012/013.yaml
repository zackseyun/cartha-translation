base_translation:
  language: en
  yaml_path: translation/nt/john/012/013.yaml
  text: They took the palm branches and went out to meet him[a], and they were crying out, “Hosanna! Blessed is the one who comes in the name of the Lord[c][b], even the King of Israel!”
translation:
  language: sw
  text: Wakachukua matawi ya mitende, wakatoka kumlaki, nao walikuwa wakipaza sauti, “Hosana![a] Amebarikiwa yule ajaye kwa jina la Bwana![b] Na Mfalme wa Israeli!”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hosana ni mwito uliotokana na Kiebrania, wenye maana ya “tuokoe sasa” au “tafadhali, okoa”; kufikia wakati huu pia ulitumika kama mwito wa sifa.
    reason: lexical_alternative
  - marker: b
    text: Maneno haya yana mwangwi wa Zaburi 118:26.
    reason: cross_reference
  - marker: c
    text: 'Au: “Naam, Mfalme wa Israeli!”'
    reason: alternative_reading
lexical_decisions:
- source_word: βαΐα τῶν φοινίκων
  choice: matawi ya mitende
  rationale: Hutaja matawi na aina ya miti kwa uwazi, huku ikiwa Kiswahili cha kawaida na cha asili.
- source_word: ἐξῆλθον εἰς ὑπάντησιν αὐτῷ
  choice: wakaenda nje kumlaki
  rationale: Kumlaki hueleza kwenda nje kukutana na mtu anayekuja, bila kuongeza maelezo yasiyomo katika Kigiriki.
- source_word: ἐκραύγαζον
  choice: waliendelea kupaza sauti
  rationale: Muundo wa wakati usiotimilika unaonyesha tendo lililoendelea au lililorudiwa; kauli hii inalihifadhi jambo hilo kwa Kiswahili cha kawaida.
- source_word: Ὡσαννά
  choice: Hosana
  rationale: Neno limehifadhiwa kwa unukuzi kwa kuwa lilitumika kama mwito wa ibada na sifa, huku maana yake ya Kiebrania ikifafanuliwa katika tanbihi.
- source_word: εὐλογημένος ὁ ἐρχόμενος
  choice: Amebarikiwa yeye ajaye
  rationale: Huhifadhi muundo wa kishiriki chenye kazi ya nomino na mwangwi wa Zaburi 118:26 kwa lugha yenye hadhi na inayoeleweka.
- source_word: ἐν ὀνόματι κυρίου
  choice: kwa jina la Bwana
  rationale: Ni usemi wa kawaida wa kibiblia unaowakilisha kwa karibu maneno ya Kigiriki na mwangwi wa Zaburi.
- source_word: καὶ ὁ βασιλεὺς τοῦ Ἰσραήλ
  choice: Naam, Mfalme wa Israeli
  rationale: Naam linaonyesha matumizi yanayowezekana ya καί ya kusisitiza au kufafanua cheo cha yule anayekuja. Uwezekano wa kukitafsiri kama kiunganishi rahisi umehifadhiwa katika tanbihi.
theological_decisions:
- issue: Tafsiri ya κύριος katika mwangwi wa Zaburi 118:26
  choice: Bwana
  alternative: BWANA
  rationale: Nakala ya Kigiriki ina κυρίου; “Bwana” huiwakilisha moja kwa moja. Ingawa chanzo cha Kiebrania cha Zaburi kina jina la Mungu, herufi kubwa zote zingeingiza taarifa kutoka nje ya umbo la Kigiriki.
- issue: Nguvu ya kifalme na ya Kimasihi katika mwito wa umati
  choice: Kuhifadhi cheo “Mfalme wa Israeli” bila kukipunguza wala kukipanua
  alternative: mfalme wa Israeli / Mfalme wa Israeli, pia
  rationale: Nakala yenyewe inatumia cheo cha kifalme. Tafsiri haiongezi ufafanuzi wa kimafundisho zaidi ya yale yaliyosemwa.
- issue: Uhusiano wa καὶ ὁ βασιλεὺς τοῦ Ἰσραήλ na kishazi kilichotangulia
  choice: Naam, Mfalme wa Israeli
  alternative: na Mfalme wa Israeli
  rationale: καί inaweza kuwa ya kusisitiza au ya kuunganisha. Matini kuu inatumia maana ya kusisitiza inayosikika kiasili, na tanbihi inahifadhi uwezekano wa kiunganishi cha kawaida.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo wa sasa, wenye hadhi na unaosomeka kwa urahisi. “Kumlaki” linafaa kwa tukio la kwenda nje kukutana na mtu anayekuja, na “waliendelea kupaza sauti” linahifadhi hali endelevu ya kitenzi cha Kigiriki.
