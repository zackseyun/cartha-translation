  text: τοσαῦτα δὲ αὐτοῦ σημεῖα πεποιηκότος ἔμπροσθεν αὐτῶν οὐκ ἐπίστευον εἰς αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/john/012/037.yaml
  text: Although he had done so many signs before them[a], they did not believe in him[b],
translation:
  language: sw
  text: Ingawa alikuwa amefanya ishara nyingi hivyo mbele yao, hawakumwamini.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “waliendelea kutomwamini”; kitenzi cha Kigiriki kiko katika wakati usiotimilika, ambao unaweza kudokeza hali ya kutokuamini iliyoendelea au kujirudia.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοσαῦτα
  choice: nyingi hivyo
  rationale: Huonyesha wingi kwa msisitizo na kurejelea ishara nyingi zilizotangulia katika simulizi.
- source_word: δὲ
  choice: Ingawa
  rationale: Nguvu ya utofautishaji imewasilishwa kwa muundo wa kukubali hali, unaoonyesha kwamba kutokuamini kwao kuliendelea licha ya ishara.
- source_word: σημεῖα
  choice: ishara
  rationale: Neno hili linahifadhi maana ya Kiyohana ya matendo yanayoelekeza zaidi ya tendo lenyewe na kufunua utambulisho wa Yesu.
- source_word: πεποιηκότος
  choice: alikuwa amefanya
  rationale: Muundo huu unaonyesha tendo lililotangulia lenye umuhimu unaoendelea katika hali inayosimuliwa.
- source_word: ἔμπροσθεν αὐτῶν
  choice: mbele yao
  rationale: Huhifadhi maana kwamba ishara zilifanywa waziwazi wakiwa mashahidi.
- source_word: οὐκ ἐπίστευον
  choice: hawakumwamini
  rationale: Ni Kiswahili cha kawaida na cha asili; tanbihi inadokeza kwamba hali ya kutokuamini inaweza kuwa ilikuwa ikiendelea au kujirudia kwa sababu kitenzi cha Kigiriki kiko katika wakati usiotimilika.
- source_word: εἰς αὐτόν
  choice: kumwamini
  rationale: Katika Kiswahili, muundo wa kawaida wa kueleza imani au tumaini linaloelekezwa kwa mtu ni 'kumwamini'.
theological_decisions:
- issue: Kutafsiri hali ya kutokuamini katika Injili ya Yohana kwa kuzingatia kitenzi cha wakati usiotimilika
  choice: hawakumwamini
  alternative: waliendelea kutomwamini
  rationale: Chaguo kuu ni la asili na wazi katika Kiswahili, huku tanbihi ikihifadhi uwezekano wa maana inayoendelea au kujirudia bila kuongeza wazo la kukataa kwa makusudi lisilotajwa wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Muundo wa 'Ingawa ...' unawasilisha utofautishaji wa δὲ pamoja na nguvu ya kukubali hali ya kishazi tegemezi bila urudufu usio wa lazima.
