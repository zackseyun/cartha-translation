  text: ⸀ταῦτα οὐκ ἔγνωσαν ⸂αὐτοῦ οἱ μαθηταὶ⸃ τὸ πρῶτον, ἀλλ’ ὅτε ἐδοξάσθη Ἰησοῦς τότε ἐμνήσθησαν ὅτι ταῦτα ἦν ἐπ’ αὐτῷ γεγραμμένα καὶ ταῦτα ἐποίησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/016.yaml
  text: His disciples did not understand these things at first[a], but when Jesus was glorified[c][b], then they remembered that these things had been written about him and that they had done these things to him.
translation:
  language: sw
  text: Wanafunzi wake hawakuelewa mambo haya mwanzoni[a], lakini Yesu alipotukuzwa[b], ndipo walipokumbuka kwamba mambo haya yalikuwa yameandikwa kumhusu[c], na kwamba walikuwa wamefanya mambo haya kwake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hawakuyajua mambo haya mwanzoni.”
    reason: lexical_alternative
  - marker: b
    text: Katika Yohana, “kutukuzwa” kwa Yesu kwa kawaida huhusishwa na kifo, ufufuo na kuinuliwa kwake.
    reason: cross_reference
  - marker: c
    text: Au, “yalikuwa yameandikwa kuhusu yeye.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγνωσαν
  choice: hawakuelewa
  rationale: Katika muktadha huu tatizo si kutokuwa na taarifa tu, bali kutotambua maana ya matukio; “hawakuelewa” ni Kiswahili cha kawaida na mwafaka.
- source_word: αὐτοῦ οἱ μαθηταί
  choice: wanafunzi wake
  rationale: Huwasilisha kwa kawaida uhusiano unaoonyeshwa na kiwakilishi cha umilikaji katika Kigiriki.
- source_word: τὸ πρῶτον
  choice: mwanzoni
  rationale: Ni usemi wa kawaida wa wakati unaomaanisha “hapo awali” au “mwanzoni.”
- source_word: ἐδοξάσθη
  choice: alipotukuzwa
  rationale: “Kutukuzwa” huhifadhi uzito wa kiteolojia wa δοξάζω katika Yohana bila kuufupisha kuwa kuheshimiwa tu.
- source_word: ἐμνήσθησαν
  choice: walipokumbuka
  rationale: Hutoa kwa kawaida maana ya kitenzi hiki katika mfuatano wa simulizi.
- source_word: ἐπ’ αὐτῷ γεγραμμένα
  choice: yalikuwa yameandikwa kumhusu
  rationale: ἐπί pamoja na dativu hapa humaanisha “kuhusu”; umbo “yalikuwa yameandikwa” huonyesha kuwa maandiko yalitangulia kukumbuka kwao.
- source_word: ταῦτα ἐποίησαν αὐτῷ
  choice: walikuwa wamemtendea mambo hayo
  rationale: Huhifadhi tendo lililofanywa kwake na kulifanya litangulie wakati wa kukumbuka, bila kuongeza mhusika ambaye Kigiriki hakumtaji wazi.
- source_word: ταῦτα
  choice: mambo haya / mambo hayo
  rationale: Huhifadhi wingi na mshikamano wa marejeo; “hayo” katika kutajwa kwa mwisho ni rejeo la kawaida la Kiswahili kwa mambo yaliyokwisha tajwa.
theological_decisions:
- issue: Maana ya Yesu kutukuzwa katika muktadha wa Yohana
  choice: alipotukuzwa
  alternative: alipoinuliwa; alipopewa heshima
  rationale: Neno hili limeachwa na upana wake wa Kiyohana, unaoweza kuhusisha kifo, ufufuo na kuinuliwa kwa Yesu, bila kulazimisha hatua moja tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa asili na unaoeleweka kwa wasomaji wa kawaida, huku marudio, mpangilio wa simulizi na utata halisi wa matini vikihifadhiwa.
