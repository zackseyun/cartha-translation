  text: ἐμαρτύρει οὖν ὁ ὄχλος ὁ ὢν μετ’ αὐτοῦ ὅτε τὸν Λάζαρον ἐφώνησεν ἐκ τοῦ μνημείου καὶ ἤγειρεν αὐτὸν ἐκ νεκρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/017.yaml
  text: So the crowd that had been with him when he called Lazarus out of the tomb and raised him from the dead was bearing witness[a].
translation:
  language: sw
  text: Kwa hiyo, umati uliokuwa pamoja naye wakati alipomwita Lazaro atoke kaburini na kumfufua kutoka kwa wafu uliendelea kutoa ushahidi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uliendelea kushuhudia”; kitenzi cha Kiyunani kinaweza kumaanisha kutoa ushahidi au kushuhudia, jambo linalojirudia katika Injili ya Yohana.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμαρτύρει
  choice: uliendelea kutoa ushahidi
  rationale: Wakati usiotimilika wa Kiyunani unaonyesha tendo lililoendelea au kurudiwa katika simulizi; usemi huu pia unahifadhi dhana muhimu ya kutoa ushahidi katika Injili ya Yohana.
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Inaonyesha uhusiano wa kimantiki na kisimulizi na yaliyotangulia, kwa lugha ya kawaida na yenye hadhi.
- source_word: ὁ ὄχλος
  choice: umati
  rationale: Ni neno la kawaida la Kiswahili kwa kundi kubwa la watu na linafaa katika muktadha huu.
- source_word: ὁ ὢν μετ’ αὐτοῦ
  choice: uliokuwa pamoja naye
  rationale: Kirai hiki kinabainisha umati maalumu uliokuwapo pamoja na Yesu wakati wa tukio lililotajwa.
- source_word: ὅτε
  choice: wakati
  rationale: Huanzisha kwa kawaida tukio la wakati ambalo umati huo ulishuhudia.
- source_word: ἐφώνησεν
  choice: alipomwita
  rationale: Hueleza moja kwa moja tendo la Yesu kumwita Lazaro bila kuongeza mkazo usiotajwa wazi na kitenzi.
- source_word: ἐκ τοῦ μνημείου
  choice: atoke kaburini
  rationale: μνημεῖον hapa ni mahali pa kuzikia; muundo huu wa Kiswahili unaonyesha wazi mwendo wa kutoka ndani ya kaburi.
- source_word: ἤγειρεν
  choice: kumfufua
  rationale: Katika muktadha wa kutoka kwa wafu, 'kufufua' ni tafsiri ya asili na sahihi ya ἐγείρω.
- source_word: ἐκ νεκρῶν
  choice: kutoka kwa wafu
  rationale: Ni usemi wa kawaida wa kibiblia katika Kiswahili unaodumisha maana ya kufufuliwa kutoka miongoni mwa waliokufa.
theological_decisions:
- issue: Kauli kuhusu kufufuliwa kwa Lazaro
  choice: kumfufua kutoka kwa wafu
  alternative: kumrudisha kutoka miongoni mwa wafu
  rationale: Kiyunani kinasema wazi kwamba Yesu alimfufua Lazaro kutoka kwa wafu. Tafsiri inadumisha dai hilo la muujiza bila kulipunguza wala kuongeza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo 'uliendelea kutoa ushahidi' unaonyesha hali ya kuendelea ya kitenzi cha Kiyunani, huku 'atoke kaburini' ukiweka wazi mwendo unaodokezwa na ἐκ.
