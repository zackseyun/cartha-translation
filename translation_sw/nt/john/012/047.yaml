  text: καὶ ἐάν τίς μου ἀκούσῃ τῶν ῥημάτων καὶ μὴ ⸀φυλάξῃ, ἐγὼ οὐ κρίνω αὐτόν, οὐ γὰρ ἦλθον ἵνα κρίνω τὸν κόσμον ἀλλ’ ἵνα σώσω τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/047.yaml
  text: And if anyone hears my words and does not keep them[a], I do not judge him; for I did not come to judge the world[b], but to save the world.
translation:
  language: sw
  text: Na mtu yeyote akiyasikia maneno yangu lakini asiyashike[a], mimi simhukumu[b]; kwa maana sikuja kuuhukumu ulimwengu, bali kuuokoa ulimwengu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “asiyatii.” Kitenzi cha Kigiriki kinaweza kumaanisha kushika, kutunza, au kutii.
    reason: lexical_alternative
  - marker: b
    text: Au “simhukumu kuwa na hatia.” Katika muktadha huu, neno la Kigiriki linaweza kubeba maana ya hukumu mbaya, ingawa neno lilelile limetafsiriwa “hukumu” katika sehemu inayofuata.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐάν τίς
  choice: mtu yeyote aki-
  rationale: Muundo huu wa Kiswahili unaonyesha sharti la jumla linalomhusu mtu yeyote, bila kulifanya kuwa tukio moja maalumu.
- source_word: ἀκούσῃ
  choice: akiyasikia
  rationale: ‘Kusikia’ huhifadhi maana ya msingi ya kitenzi bila kuongeza wazo lenye nguvu zaidi la kusikiliza kwa makini au kuitikia.
- source_word: τῶν ῥημάτων
  choice: maneno yangu
  rationale: Hii ni tafsiri ya kawaida na yenye hadhi ya maneno au matamko yaliyosemwa na Yesu.
- source_word: φυλάξῃ
  choice: asiyashike
  rationale: ‘Kushika’ huhifadhi upana wa maana unaoweza kujumuisha kuyatunza, kudumu nayo, na kuyatii; ‘kutii’ pekee ingepunguza maana.
- source_word: οὐ κρίνω αὐτόν
  choice: mimi simhukumu
  rationale: Kitenzi ‘hukumu’ kinarudiwa katika sentensi kama ilivyo κρίνω katika Kigiriki. Kiambishi ‘m-’ humrejelea mtu aliyetajwa bila kulazimisha jinsia katika Kiswahili.
- source_word: οὐ γὰρ ἦλθον
  choice: kwa maana sikuja
  rationale: Wakati uliopita unaeleza kwa muhtasari kuja na utume wa Yesu; ‘kwa maana’ linaonyesha sababu inayofuata.
- source_word: ἵνα κρίνω τὸν κόσμον
  choice: kuuhukumu ulimwengu
  rationale: Kiswahili cha ‘sikuja ku-’ kinaonyesha kusudi kwa kawaida, huku ‘ulimwengu’ ukihifadhi neno pana la Yohana.
- source_word: ἀλλ’ ἵνα σώσω τὸν κόσμον
  choice: bali kuuokoa ulimwengu
  rationale: ‘Bali’ linaweka tofauti ya wazi kati ya kuhukumu na kuokoa; ‘kuokoa’ huhifadhi maana kuu ya σῴζω.
theological_decisions:
- issue: Kauli ya Yesu ‘mimi simhukumu’ ikilinganishwa na lugha nyingine ya hukumu katika Yohana
  choice: Kutumia ‘hukumu’ katika sehemu zote mbili na kuacha muktadha uonyeshe tofauti ya kusudi la kuja kwake.
  alternative: Kutafsiri ‘simhukumu’ kuwa ‘simlaani,’ au kuongeza ‘sasa.’
  rationale: Tafsiri hii huhifadhi urudiaji wa κρίνω na mvutano wa kiteolojia kati ya wokovu kama kusudi la kuja kwa Yesu na hukumu inayotajwa kwingine, bila kuupatanisha kwa ufafanuzi ulioongezwa.
- issue: Kiwakilishi cha umoja αὐτόν chenye maana ya jumla
  choice: Kutumia kiambishi cha yambwa ‘m-’ katika ‘simhukumu.’
  alternative: Kusema ‘simhukumu mtu huyo.’
  rationale: Mfumo wa kawaida wa Kiswahili humrejelea mtu mmoja bila kuonyesha jinsia; hivyo maana ya umoja na matumizi ya jumla huhifadhiwa kwa kawaida.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ‘mtu yeyote akiyasikia’ ni wa kawaida na unaonyesha sharti la jumla. ‘Lakini’ limetumiwa kuwasilisha kwa asili tofauti kati ya kusikia na kutoshika, huku urudiaji wa ‘ulimwengu’ ukidumishwa kama katika chanzo.
