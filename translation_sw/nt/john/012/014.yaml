  text: εὑρὼν δὲ ὁ Ἰησοῦς ὀνάριον ἐκάθισεν ἐπ’ αὐτό, καθώς ἐστιν γεγραμμένον·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/014.yaml
  text: 'Then Jesus[a], having found a young donkey, sat on it, just as it is written:'
translation:
  language: sw
  text: 'Kisha Yesu, baada ya kupata mwana-punda[a], akaketi juu yake, kama ilivyoandikwa:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “punda mdogo.” Neno la Kigiriki ὀνάριον humaanisha punda, mara nyingi punda mchanga.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὑρὼν
  choice: baada ya kupata
  rationale: Kauli hii ya kishirikishi ya wakati uliopita inaonyesha tendo lililotangulia tendo kuu; “baada ya kupata” huhifadhi mfuatano huo kwa Kiswahili cha kawaida.
- source_word: δὲ
  choice: Kisha
  rationale: Hapa δέ ni kiunganishi hafifu kinachoendeleza simulizi, si lazima kionyeshe upinzani. “Kisha” huleta mtiririko wa kawaida bila kuongeza maana ya “lakini”.
- source_word: ὀνάριον
  choice: mwana-punda
  rationale: ὀνάριον ni jina la punda katika umbo la udogo na mara nyingi humaanisha punda mchanga. “Mwana-punda” ni neno la kawaida na lenye heshima linalofaa katika muktadha huu, huku tanbihi ikihifadhi uwezekano wa maana pana zaidi.
- source_word: ἐκάθισεν ἐπ’ αὐτό
  choice: akaketi juu yake
  rationale: Tafsiri hii hufuata moja kwa moja maana ya Kigiriki ya kuketi juu ya huyo punda, bila kuibadili kuwa kauli yenye tafsiri zaidi kama “akampanda.”
- source_word: καθώς ἐστιν γεγραμμένον
  choice: kama ilivyoandikwa
  rationale: Hii ni kauli ya kawaida ya kutanguliza nukuu ya Maandiko. “Kama ilivyoandikwa” ni Kiswahili cha asili kinachohifadhi ulinganifu wa καθώς na hali endelevu ya jambo lililoandikwa.
- source_word: ὁ Ἰησοῦς
  choice: Yesu
  rationale: Kiswahili, kama Kiingereza, hakihitaji kibainishi kabla ya jina la mtu; hivyo jina linatafsiriwa kwa kawaida kuwa “Yesu.”
theological_decisions:
- issue: Uhusiano wa tendo la Yesu na nukuu ya Maandiko
  choice: Tendo la Yesu la kumpata mwana-punda na kuketi juu yake linaelezwa kuwa sawasawa na yaliyoandikwa, bila kutaja wazi nia yake.
  alternative: Kutafsiri kwa namna inayodokeza wazi kwamba Yesu alifanya hivyo kwa kusudi la kutimiza unabii.
  rationale: Aya inasimulia tendo, kisha inaleta nukuu kwa kauli “kama ilivyoandikwa.” Inaonyesha ulinganifu wa kinabii, lakini haisemi wazi hapa ikiwa Yesu alikusudia kuigiza unabii huo; tafsiri haiongezi jambo hilo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa sasa, wa heshima na unaoeleweka kwa wasomaji wa kawaida. Muundo wa kishirikishi umetolewa kwa “baada ya” ili uwe wa asili bila kupoteza mfuatano wa matendo.
