base_translation:
  language: en
  yaml_path: translation/nt/john/012/023.yaml
  text: But Jesus answered them[a], saying[b], “The hour has come for the Son of Man to be glorified.”
translation:
  language: sw
  text: Lakini Yesu akawajibu, akisema, “Saa[a] imefika, ili Mwana wa Adamu[b] atukuzwe.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Wakati umefika.” Kigiriki kinasema “saa,” neno linalojirudia katika Injili ya Yohana likimaanisha wakati maalumu uliowekwa kwa mateso na utukufu wa Yesu.
    reason: lexical_alternative
  - marker: b
    text: Au “Mwana wa Binadamu.” Jina la cheo la Kigiriki “Mwana wa Adamu” lina mwangwi wa Danieli 7; limehifadhiwa hapa kwa sababu ya uzito wake wa kiteolojia na uhusiano wake na maandiko hayo.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκρίνεται
  choice: akawajibu
  rationale: Kitenzi hiki kiko katika wakati wa sasa wa kisimulizi katika Kigiriki, lakini Kiswahili cha kawaida cha masimulizi hutumia wakati uliopita mfululizo; “akawajibu” pia hudokeza kwamba jibu lilielekezwa kwao.
- source_word: αὐτοῖς
  choice: -wa- katika “akawajibu”
  rationale: Kiambishi cha yambwa “-wa-” kinawakilisha kwa kawaida na kwa ufasaha dhamiri ya Kigiriki inayomaanisha “wao.”
- source_word: λέγων
  choice: akisema
  rationale: Hifadhi muundo wa kishiriki unaoanzisha maneno ya Yesu kwa njia inayoeleweka na ya asili katika Kiswahili.
- source_word: Ἐλήλυθεν
  choice: imefika
  rationale: Wakati timilifu wa Kigiriki unaonyesha kuwa saa hiyo imewasili na sasa ipo; “imefika” huhifadhi hali hiyo ya sasa inayotokana na kuwasili.
- source_word: ὥρα
  choice: Saa
  rationale: “Saa” huhifadhi taswira na istilahi inayojirudia katika Injili ya Yohana kuhusu wakati maalumu uliowekwa kwa mateso na utukufu wa Yesu.
- source_word: ἵνα
  choice: ya ... kutukuzwa
  rationale: Muundo huu wa Kiswahili huonyesha kwa kawaida yaliyokusudiwa au yaliyomo katika kufika kwa saa hiyo bila kulazimisha maana kuwa kusudi pekee.
- source_word: δοξασθῇ
  choice: kutukuzwa
  rationale: Hifadhi kauli tendwa na uzito wa kiteolojia wa δοξάζω, ambao katika Yohana unahusisha kuinuliwa kwa Yesu kupitia kifo, ufufuo na kuthibitishwa kwake.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  rationale: Hili ni jina la cheo linalotambulika katika Kiswahili na linahifadhi mwangwi wake wa Danieli 7 pamoja na nguvu yake ya kikristo katika Injili ya Yohana.
theological_decisions:
- issue: Jinsi ya kutafsiri jina la cheo ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  alternative: Mwana wa Binadamu
  rationale: “Mwana wa Adamu” huhifadhi jina la cheo la Yesu na uhusiano wake na Danieli 7, badala ya kulifanya kuwa maelezo ya kawaida tu kuhusu ubinadamu.
- issue: Hali ya kitenzi na nguvu ya kiteolojia ya Ἐλήλυθεν ἡ ὥρα
  choice: Saa imefika
  alternative: Wakati umefika
  rationale: “Saa” huhifadhi istilahi muhimu inayojirudia katika Yohana, na “imefika” hudumisha hali ya sasa inayotokana na kuwasili kwa wakati huo wa maamuzi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo “akawajibu, akisema” unafuata ushahidi wa Kigiriki bila kuwa mzito kupita kiasi; alama za tanbihi zimewekwa moja kwa moja baada ya maneno yanayofafanuliwa.
