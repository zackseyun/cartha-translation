  text: 'Kwa sababu hiyo hawakuweza kuamini, kwa kuwa Isaya alisema tena:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Kwa sababu hiyo
  rationale: Kirai hiki kinaonyesha sababu inayohusiana moja kwa moja na muktadha uliotangulia; ‘Kwa sababu hiyo’ ni cha asili na wazi katika Kiswahili.
- source_word: οὐκ ἠδύναντο
  choice: hawakuweza
  rationale: Kitenzi hiki kinaeleza kutoweza, si kukataa tu; tafsiri hii inadumisha maana ya kutokuwa na uwezo bila kuieleza kidoktrini.
- source_word: πιστεύειν
  choice: kuamini
  rationale: Hili ndilo neno la kawaida na la moja kwa moja kwa πιστεύειν katika matumizi ya Yohana.
- source_word: ὅτι
  choice: kwa kuwa
  rationale: Katika muktadha huu ὅτι inaanzisha sababu inayofafanuliwa na nukuu nyingine ya Isaya; ‘kwa kuwa’ huhifadhi uhusiano huo wa kisababu.
- source_word: πάλιν
  choice: tena
  rationale: Neno hili linaonyesha kuwa anafuata usemi mwingine wa Isaya baada ya nukuu iliyotangulia.
- source_word: εἶπεν
  choice: alisema
  rationale: Hii ni tafsiri ya kawaida na ya asili ya fomula ya kutambulisha nukuu.
- source_word: Ἠσαΐας
  choice: Isaya
  rationale: Jina limetolewa kwa umbo lake lililozoeleka katika Kiswahili.
theological_decisions:
- issue: Asili ya kutoweza kwao kuamini
  choice: hawakuweza kuamini
  alternative: hawakutaka kuamini
  rationale: Kigiriki kinasema wazi kutoweza, si kutotaka tu. Tafsiri inadumisha mvutano huo bila kuingiza maelezo ya kimadhehebu kuhusu ugumu wa moyo, uchaguzi wa Mungu, au wajibu wa mwanadamu.
- issue: Kazi ya ὅτι katika sentensi
  choice: kwa kuwa
  alternative: kwamba
  rationale: Imechukuliwa kuwa kiunganishi cha sababu, kama muktadha na nukuu inayofuata zinavyoelekeza, huku tafsiri isiongeze ufafanuzi usiokuwamo katika aya.
