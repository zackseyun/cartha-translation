  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἶπεν οὖν αὐτοῖς ὁ Ἰησοῦς· Ἔτι μικρὸν χρόνον τὸ φῶς ⸂ἐν ὑμῖν⸃ ἐστιν. περιπατεῖτε ⸀ὡς τὸ φῶς ἔχετε, ἵνα μὴ σκοτία ὑμᾶς καταλάβῃ, καὶ ὁ περιπατῶν ἐν τῇ σκοτίᾳ οὐκ οἶδεν ποῦ ὑπάγει.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/035.yaml
  text: So Jesus said to them[a], “The light is still among you for a little while. Walk while you have the light, so that darkness may not overtake you. The one who walks in the darkness does not know where he is going.”
translation:
  language: sw
  text: Kwa hiyo Yesu akawaambia, “Nuru bado iko kati yenu[a] kwa muda mfupi. Tembeeni maadamu mnayo nuru, ili giza lisiwapate. Anayetembea gizani hajui anakokwenda.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ndani yenu” au “pamoja nanyi.” Kirai cha Kigiriki kinaweza kueleweka kwa njia zaidi ya moja, ingawa “kati yenu” kinafaa zaidi katika muktadha huu wa kuwapo kwa Yesu hadharani.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Ni kiunganishi cha kawaida kinachohusisha kauli ya Yesu na mazungumzo yaliyotangulia bila kuifanya ionekane kuwa hitimisho kali la kimantiki.
- source_word: Ἔτι μικρὸν χρόνον
  choice: bado ... kwa muda mfupi
  rationale: Huwasilisha maana ya ἔτι na kirai cha wakati μικρὸν χρόνον kwa Kiswahili cha kawaida.
- source_word: τὸ φῶς
  choice: Nuru
  rationale: Taswira ya nuru imehifadhiwa moja kwa moja kwa sababu ina uzito wa kimafumbo katika Injili ya Yohana na haipaswi kufafanuliwa ndani ya tafsiri.
- source_word: ἐν ὑμῖν
  choice: kati yenu
  rationale: Katika muktadha huu inaelekea kurejelea kuwapo kwa Yesu hadharani miongoni mwa watu. Uwezekano wa maana nyingine umehifadhiwa katika tanbihi.
- source_word: περιπατεῖτε
  choice: Tembeeni
  rationale: Huhifadhi taswira ya kutembea, ambayo pia inaweza kuelekeza kwa mwenendo wa maisha bila kuibadili kuwa ufafanuzi.
- source_word: ὡς
  choice: maadamu
  rationale: Imeeleweka kwa maana ya wakati pamoja na ἔχετε, ikionyesha kwamba nafasi hiyo ipo kwa muda wenye kikomo.
- source_word: ἵνα μὴ
  choice: ili ... lisi-
  rationale: Huonyesha kusudi au matokeo yanayokusudiwa kwa Kiswahili cha kawaida.
- source_word: σκοτία
  choice: giza
  rationale: Ni tafsiri ya moja kwa moja inayohifadhi utofautishaji wa nuru na giza ulio muhimu katika Yohana.
- source_word: καταλάβῃ
  choice: lisiwapate
  rationale: Kitenzi hiki kinaweza kumaanisha kufikia, kukamata, au kushinda. ‘Lisiwapate’ hudumisha taswira ya giza linalowafikia watu bila kufungia maana katika ushindi pekee.
- source_word: ὁ περιπατῶν
  choice: Anayetembea
  rationale: Huwasilisha hali ya jumla ya nomino-shirikishi kwa muundo wa kawaida wa Kiswahili.
- source_word: ἐν τῇ σκοτίᾳ
  choice: gizani
  rationale: Ni usemi wa asili wa Kiswahili kwa kuwa ndani ya eneo au hali ya giza, huku ukihifadhi taswira ya maandishi.
- source_word: οὐκ οἶδεν ποῦ ὑπάγει
  choice: hajui anakokwenda
  rationale: Ni Kiswahili cha kawaida kinachohifadhi maana ya kutokujua mwelekeo au mwisho wa safari.
theological_decisions:
- issue: Maana ya ἐν ὑμῖν kuhusiana na ‘nuru’
  choice: kati yenu
  alternative: ndani yenu; pamoja nanyi
  rationale: Muktadha wa simulizi unaonyesha Yesu akizungumza kuhusu muda mfupi uliobaki wa kuwapo kwake hadharani kama nuru. Hata hivyo, ἐν inaweza pia kueleweka kwa maana ya ndani au ya kuwa pamoja, hivyo uwezekano huo umeonyeshwa katika tanbihi badala ya kuondolewa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Taswira za nuru, giza, na kutembea zimehifadhiwa; miundo imewekwa kwa namna inayoeleweka kwa msomaji wa kawaida.
