  text: Ἦσαν δὲ ⸂Ἕλληνές τινες⸃ ἐκ τῶν ἀναβαινόντων ἵνα προσκυνήσωσιν ἐν τῇ ἑορτῇ·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/020.yaml
  text: There were some Greeks among those going up to worship at the feast[a].
translation:
  language: sw
  text: Kulikuwa na Wayunani kadhaa miongoni mwa wale waliokuwa wakipanda kwenda kuabudu wakati wa sikukuu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wayunani fulani”; huenda walikuwa watu wasio Wayahudi waliokuwa wamepanda kwenda kuabudu wakati wa sikukuu.
    reason: Huonyesha namna nyingine ya kutafsiri τινες na kudumisha kutobainishwa kwa utambulisho wao wa kidini.
lexical_decisions:
- source_word: Ἦσαν δὲ
  choice: Kulikuwa na
  rationale: ἦσαν inaonyesha kuwapo kwa watu hao, na δέ ni kiunganishi chepesi cha kuendeleza au kuhamisha simulizi. Kiswahili cha kawaida kinaweza kuacha nguvu hiyo katika mtiririko wa sentensi bila kuongeza neno la wakati kama ‘sasa’.
- source_word: Ἕλληνές τινες
  choice: Wayunani kadhaa
  rationale: Ἕλληνες kimsingi humaanisha Wayunani, si kwa ujumla watu wa mataifa mengine; τινες huonyesha idadi isiyotajwa, hivyo ‘kadhaa’.
- source_word: ἐκ τῶν ἀναβαινόντων
  choice: miongoni mwa wale waliokuwa wakipanda
  rationale: ἐκ inaonyesha kwamba Wayunani hao walikuwa sehemu ya kundi hilo. ‘Kupanda’ huhifadhi usemi wa hija ya kwenda Yerusalemu bila kuongeza maelezo yasiyomo.
- source_word: ἵνα προσκυνήσωσιν
  choice: kwenda kuabudu
  rationale: ἵνα pamoja na hali tegemezi huonyesha kusudi. ‘Kwenda kuabudu’ ni Kiswahili cha asili kinachoweka wazi kusudi la safari; hapa προσκυνέω ni ibada ya kidini.
- source_word: ἐν τῇ ἑορτῇ
  choice: wakati wa sikukuu
  rationale: ἑορτή ni sikukuu ya Kiyahudi inayozungumziwa katika muktadha huu. ‘Wakati wa sikukuu’ ni ya kawaida na haiongezi utambulisho ambao kifungu hiki hakitaji moja kwa moja.
theological_decisions:
- issue: Utambulisho wa Ἕλληνες
  choice: Wayunani
  alternative: Watu wa mataifa mengine
  rationale: Neno la Kigiriki lenyewe linawaita ‘Wayunani.’ Haijaelezwa wazi kama walikuwa waongofu kamili, wamchao Mungu, au kundi jingine; tafsiri haipaswi kuondoa hali hiyo ya kutobainishwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Wayunani’ ni istilahi inayoeleweka katika sajili ya Biblia; ‘wakipanda’ huhifadhi taswira ya hija ya kwenda Yerusalemu.
