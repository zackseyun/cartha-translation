  text: Μὴ φοβοῦ, θυγάτηρ Σιών· ἰδοὺ ὁ βασιλεύς σου ἔρχεται, καθήμενος ἐπὶ πῶλον ὄνου.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/015.yaml
  text: Do not be afraid[a], daughter of Zion. Look, your King is coming[e][d][c][b], seated on a donkey’s colt.
translation:
  language: sw
  text: “Usiogope, binti Sayuni.[a] Tazama, Mfalme wako anakuja akiwa ameketi juu ya mwana-punda.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Binti Sayuni” ni namna ya kinabii ya kuiwakilisha Sayuni/Yerusalemu kama mtu. Maneno ya mstari huu yanadokeza Zekaria 9:9 na kumwasilisha Yesu kuwa Mfalme aliyeahidiwa wa Sayuni.
    reason: cultural_note; cross_reference
  - marker: b
    text: Au, “juu ya mtoto wa punda.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ φοβοῦ
  choice: Usiogope
  rationale: Katazo hili linaelezwa kwa Kiswahili cha kawaida na cha moja kwa moja; linahifadhi maana ya kuondoa hofu bila kutumia lugha ya kizamani.
- source_word: θυγάτηρ Σιών
  choice: binti Sayuni
  rationale: Kirai hiki kinahifadhi sitiari ya kinabii inayoiwakilisha Sayuni/Yerusalemu kama binti, bila kuibadili kuwa maelezo ndani ya matini.
- source_word: ἰδοὺ
  choice: Tazama
  rationale: Neno hili huvuta usikivu kwa jambo linalofuata na linafaa katika sajili ya unabii iliyo ya heshima lakini inayoeleweka.
- source_word: ὁ βασιλεύς σου
  choice: Mfalme wako
  rationale: Huhifadhi nomino yenye uainisho na kiwakilishi cha umilikaji. Herufi kubwa inaonyesha matumizi yake kama cheo cha kifalme kwa Yesu katika muktadha huu.
- source_word: ἔρχεται
  choice: anakuja
  rationale: Wakati wa sasa wa Kigiriki unaonyesha ujio kwa uhai na ukaribu; ‘anakuja’ ni namna ya kawaida ya kuwasilisha hilo kwa Kiswahili.
- source_word: καθήμενος
  choice: akiwa ameketi
  rationale: Kirai hiki kinaonyesha namna Mfalme anavyokuja na kinahifadhi maana halisi ya kuketi bila kuongeza wazo la ‘kupanda’ ambalo halijaelezwa moja kwa moja.
- source_word: ἐπὶ πῶλον ὄνου
  choice: juu ya mwana-punda
  rationale: ‘Mwana-punda’ kwa kawaida humaanisha punda mchanga na hivyo huwasilisha kwa ufupi wazo la πῶλος lililofafanuliwa na ὄνου.
theological_decisions:
- issue: Dokezo la Kimasihi kwa Zekaria 9:9
  choice: Kuhifadhi ‘binti Sayuni’ na ‘Mfalme wako’ katika matini, huku dokezo kwa Zekaria likielezwa katika tanbihi.
  alternative: Kumtaja Yerusalemu moja kwa moja au kufafanua ndani ya mstari kwamba Yesu ndiye Mfalme wa Kimasihi aliyeahidiwa.
  rationale: Matini yenyewe hutumia lugha ya kinabii na ya kifalme bila maelezo hayo ya wazi; tafsiri inapaswa kuhifadhi dokezo na mvutano wake badala ya kulipanua kimafundisho.
- issue: Uandishi wa ‘Mfalme’ kwa herufi kubwa
  choice: Mfalme
  alternative: mfalme
  rationale: Maandishi ya Kigiriki hayatatui suala la herufi kubwa. Hapa herufi kubwa inaonyesha matumizi ya neno hilo kama cheo cha Yesu katika muktadha wa kifalme wa Kimasihi, bila kubadili maana ya kileksia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi na inayoeleweka kwa msomaji wa kawaida. ‘Tazama’ huhifadhi ladha ya kinabii bila kuwa ya kizamani kupita kiasi. Mpangilio wa alama za tanbihi umewekwa karibu na vifungu vinavyoelezwa.
