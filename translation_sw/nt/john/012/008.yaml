  text: τοὺς πτωχοὺς γὰρ πάντοτε ἔχετε μεθ’ ἑαυτῶν, ἐμὲ δὲ οὐ πάντοτε ἔχετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/008.yaml
  text: For you always have the poor with you[a], but you do not always have me.
translation:
  language: sw
  text: Kwa maana maskini[a] mnao sikuzote pamoja nanyi, lakini mimi hamtakuwa nami sikuzote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “watu maskini.” Neno la Kigiriki ni kivumishi kilichotumiwa kama nomino: “maskini.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πτωχούς
  choice: maskini
  rationale: Kivumishi cha Kigiriki kimetumiwa kama nomino na kinarejelea watu maskini kwa ujumla; “maskini” ni usemi wa kawaida na wenye heshima katika Kiswahili.
- source_word: γάρ
  choice: Kwa maana
  rationale: Kiunganishi hiki kinatoa sababu au maelezo ya kauli iliyotangulia; “kwa maana” kinahifadhi uhusiano huo kwa Kiswahili cha asili.
- source_word: πάντοτε
  choice: sikuzote
  rationale: Neno hili linaonyesha kuwapo wakati wote au daima katika muktadha huu; limetafsiriwa sawasawa katika sehemu zote mbili za mstari.
- source_word: ἔχετε
  choice: mnao / hamnami
  rationale: Kitenzi kinaeleza kuwapo kwa mtu pamoja nao, si umiliki. Miundo ya Kiswahili “mnao pamoja nanyi” na “hamnami” huwasilisha maana hiyo kwa ufasaha.
- source_word: μεθ’ ἑαυτῶν
  choice: pamoja nanyi
  rationale: Kirai hiki kina maana ya kuwa katika ushirika au uwepo wao; “pamoja nanyi” ni cha kawaida na kinaonyesha maana hiyo wazi.
- source_word: ἐμέ
  choice: mimi
  rationale: Kiwakilishi hiki kimetiliwa mkazo katika Kigiriki na kinamrejelea Yesu; “mimi” kinahifadhi mkazo huo katika utofautishaji.
- source_word: δέ
  choice: lakini
  rationale: Neno hili linaonyesha utofautishaji kati ya kuwapo kwa maskini sikuzote na muda mdogo wa kuwapo kwa Yesu pamoja na wanafunzi.
- source_word: οὐ πάντοτε
  choice: hamnami sikuzote
  rationale: Muundo huu unakanusha kuwapo kwake pamoja nao sikuzote bila kudokeza kutokuwapo kabisa.
theological_decisions:
- issue: Hatari ya kutumia kauli ya Yesu kupunguza umuhimu wa kuwajali maskini
  choice: Kauli imetafsiriwa kama utofautishaji wa kuwapo na wakati, bila kudokeza kuwa kuwajali maskini si muhimu.
  alternative: Kufafanua kwa maneno ya ziada kwamba maskini ni wa umuhimu mdogo, au kulainisha kauli hadi utofautishaji wake upotee.
  rationale: Kigiriki kinasema kwamba maskini wako pamoja nao sikuzote, lakini Yesu hatakuwa pamoja nao sikuzote. Tafsiri inahifadhi mvutano huo bila kuingiza hitimisho la kiteolojia lisilotajwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Mnao pamoja nanyi” ni wazi na cha asili, huku “hamnami” kikitoa utofautishaji mfupi na wenye nguvu. Alama ya tanbihi [a] imewekwa baada ya kishazi kinachohusika.
