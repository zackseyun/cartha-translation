  text: ἀπεκρίθη ⸂Ἰησοῦς καὶ εἶπεν⸃· Οὐ δι’ ἐμὲ ⸂ἡ φωνὴ αὕτη⸃ γέγονεν ἀλλὰ δι’ ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/030.yaml
  text: Jesus answered and said[a], “This voice has not come for my sake, but for yours.”
translation:
  language: sw
  text: Yesu akajibu, akasema, “Sauti hii haikutokea kwa ajili yangu, bali kwa ajili yenu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: akajibu
  rationale: Ni usemi wa kawaida wa kisimulizi unaoonyesha jibu la Yesu katika mazungumzo.
- source_word: εἶπεν
  choice: na kusema
  rationale: Inahifadhi vitenzi vyote viwili katika kauli ya Kiyunani ἀπεκρίθη ... καὶ εἶπεν kwa Kiswahili kinachoeleweka.
- source_word: φωνή
  choice: sauti
  rationale: Katika muktadha huu ni sauti iliyotoka mbinguni na kusikika, si tukio la sauti kwa ujumla.
- source_word: γέγονεν
  choice: haikutokea
  rationale: Kitenzi γίνομαι katika kauli timilifu hapa kinaeleza kutokea kwa sauti kama tukio; ‘haikutokea’ ni ya asili na inabaki karibu na maana hiyo.
- source_word: δι’ ἐμέ
  choice: kwa ajili yangu
  rationale: Inaeleza kusudi au manufaa yanayolengwa huku ikibakiza uwezekano mdogo wa uhusiano wa kisababishi uliomo katika διά pamoja na hali ya kushtaki.
- source_word: δι’ ὑμᾶς
  choice: kwa ajili yenu
  rationale: Inadumisha ulinganifu na δι’ ἐμέ na kuonyesha kwamba waliolengwa kufaidika na sauti hiyo ni wasikilizaji.
- source_word: Οὐ ... ἀλλὰ
  choice: si ... bali
  rationale: Muundo huu unahifadhi kwa uwazi utofautishaji wa Kiyunani.
theological_decisions:
- issue: Kusudi la sauti kutoka mbinguni
  choice: Sauti hiyo haikutokea kwa manufaa ya Yesu, bali kwa manufaa ya watu waliokuwa wakimsikiliza.
  alternative: Sauti hiyo haikutokea kwa sababu ya Yesu, bali kwa sababu yao.
  rationale: Katika muktadha huu διά pamoja na hali ya kushtaki inaeleweka vyema kama ikionyesha kusudi au manufaa. Tafsiri hiyo haiongezi dai lolote kuhusu kwa nini Yesu hakuihitaji sauti hiyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Kwa ajili yangu ... kwa ajili yenu’ ni wazi na hudumisha ulinganifu wa sentensi. Hakuna tanbihi iliyoongezwa kwa kuwa tafsiri kuu inaweza kubeba maana inayopendelewa bila kuficha tofauti ya kisemantiki kwa namna inayohitaji tanbihi ya lazima.
