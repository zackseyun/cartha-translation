  yaml_path: translation/nt/john/012/033.yaml
  text: He was saying this to signify what kind of death he was about to die[a].
translation:
  language: sw
  text: Alisema hayo akionyesha ni kifo cha namna gani ambacho alikuwa karibu kufa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa kifo cha namna gani angekufa.” Usemi wa Kigiriki unaweza kusisitiza namna au njia ya kifo.
    reason: Mbadala wa kileksia wa muundo wa dative unaoweza kukazia namna au njia ambayo kifo kingetokea.
lexical_decisions:
- source_word: τοῦτο
  choice: hayo
  rationale: Kiwakilishi hiki kinarejelea kauli ya Yesu iliyotangulia; katika Kiswahili, “hayo” hurejelea kwa kawaida maneno yaliyosemwa.
- source_word: δὲ
  choice: hakikutafsiriwa kwa neno la pekee
  rationale: Hapa δέ ni kiunganishi hafifu cha kuendeleza maelezo. Mtiririko wa sentensi ya Kiswahili unatosha bila kuongeza “basi,” “lakini,” au neno la wakati lisilokuwamo katika chanzo.
- source_word: ἔλεγεν
  choice: alisema
  rationale: Ingawa kitenzi cha Kigiriki ni cha hali isiyotimilika, katika maelezo haya ya msimulizi Kiswahili cha kawaida hutumia “alisema”; “alikuwa akisema” kingesikika kizito na kingeweza kudokeza kurudiwa kwa kauli.
- source_word: σημαίνων
  choice: akiashiria
  rationale: Neno hili lina maana ya kufanya jambo lijulikane kwa ishara au dokezo. “Akiashiria” huhifadhi maana hiyo na uhusiano wa tendo linaloandamana na kusema.
- source_word: ποίῳ θανάτῳ
  choice: kifo cha namna gani
  rationale: Usemi huu unaeleza aina au namna ya kifo, si ukweli wa kufa tu. Kiswahili “angekufa kifo cha namna gani” ni cha kawaida na huhifadhi wazo hilo.
- source_word: ἤμελλεν
  choice: angekufa
  rationale: Muundo wa wakati ujao ukitazamwa kutoka wakati uliopita unaelezwa kwa kawaida kwa “ange-”. Hii huepuka kuongeza wazo lenye nguvu zaidi la kuamriwa na hatima, ingawa haionyeshi moja kwa moja kila kivuli cha ukaribu kinachoweza kuwamo katika μέλλω.
- source_word: ἀποθνῄσκειν
  choice: kufa
  rationale: Ni kitenzi-jina kinachokamilisha ἤμελλεν; katika Kiswahili kinawakilishwa kwa kawaida ndani ya “angekufa”.
theological_decisions:
- issue: Iwapo kutaja wazi kusulubiwa
  choice: 'Kudumisha usemi usio wa moja kwa moja: “angekufa kifo cha namna gani”'
  alternative: “angekufa kwa kusulubiwa” au “angeuawa msalabani”
  rationale: Muktadha unaelekeza kwenye kusulubiwa, lakini mstari huu wenyewe hautaji msalaba. Tafsiri inadumisha namna ya maelezo ya mwandishi bila kufanya dokezo hilo kuwa tamko la wazi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni fupi na ya kawaida; “akiashiria” huhifadhi dokezo la kimakusudi la mwandishi bila kutaja kusulubiwa moja kwa moja.
