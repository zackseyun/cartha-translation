base_translation:
  language: en
  yaml_path: translation/nt/john/012/049.yaml
  text: For I have not spoken from myself[b][a], but the Father who sent me has himself given me a command as to what I should say and what I should speak.
translation:
  language: sw
  text: Kwa maana mimi sikunena kwa uamuzi wangu mwenyewe[a], bali Baba aliyenituma, yeye mwenyewe amenipa amri kuhusu ninachopaswa kusema na ninachopaswa kunena.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa mamlaka yangu mwenyewe.”
    reason: lexical_alternative
  - marker: b
    text: Kigiriki kinatumia vitenzi viwili tofauti vinavyoweza kutafsiriwa “kusema” na “kunena”; tafsiri imehifadhi tofauti hiyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξ ἐμαυτοῦ
  choice: kwa shauri langu mwenyewe
  rationale: Hii ni Kiswahili cha kawaida kinachoonyesha kwamba Yesu hakunena kwa msukumo au uamuzi wake binafsi. Tanbihi inahifadhi uwezekano wa kuelewa kirai hiki kuwa ‘kwa mamlaka yangu mwenyewe.’
- source_word: οὐκ ἐλάλησα
  choice: sikunena
  rationale: Wakati uliopita wa Kiswahili unafaa katika muktadha wa huduma na maneno ya Yesu hadi wakati huo. ‘Kunena’ pia husaidia kuhifadhi tofauti na kitenzi λέγω kinachofuata.
- source_word: ὁ πέμψας με πατήρ
  choice: Baba aliyenituma
  rationale: Kirai tegemezi kinawasilisha kwa ufasaha kivumishi-shirikishi cha Kigiriki. ‘Baba’ imetumiwa kama jina la kumtaja Mungu katika muktadha huu.
- source_word: αὐτός
  choice: yeye mwenyewe
  rationale: Maneno haya yanahifadhi msisitizo wa kiwakilishi cha Kigiriki kwamba Baba mwenyewe ndiye aliyetoa amri hiyo.
- source_word: ἐντολήν
  choice: amri
  rationale: ‘Amri’ ni neno la sasa na la kawaida lenye uzito wa mamlaka unaolingana na ἐντολή, bila kulifanya kuwa rejeo la lazima kwa kanuni fulani ya sheria.
- source_word: δέδωκεν
  choice: amenipa
  rationale: Wakati timilifu wa Kiswahili unaonyesha tendo lililofanyika ambalo matokeo na mamlaka yake yanaendelea.
- source_word: τί εἴπω
  choice: ninachopaswa kusema
  rationale: Muundo huu wa kawaida unaonyesha swali lisilo la moja kwa moja pamoja na nguvu ya maelekezo iliyomo katika ‘amri.’
- source_word: καὶ τί λαλήσω
  choice: na ninachopaswa kunena
  rationale: ‘Kunena’ hutofautishwa na ‘kusema’ ili kuhifadhi matumizi ya vitenzi viwili tofauti, λέγω na λαλέω, katika Kigiriki.
theological_decisions:
- issue: Uhusiano wa maneno ya Mwana na amri ya Baba
  choice: Tafsiri inaonyesha kwamba Yesu haneni kwa kujitegemea, bali katika utume na kwa amri ya Baba.
  alternative: Kufasiri maneno haya ama kana kwamba Yesu ni nabii wa kibinadamu tu, ama kana kwamba anatenda kwa kujitegemea lakini anakubaliana tu na Baba.
  rationale: Mstari wenyewe unasisitiza kwamba maneno ya Yesu hayatoki kwa shauri lake mwenyewe na kwamba Baba aliyemtuma alimpa amri. Tafsiri haiongezi hitimisho kuhusu asili ya Mwana lisilotamkwa moja kwa moja katika mstari.
- issue: Maana ya πατήρ
  choice: Baba
  alternative: baba
  rationale: Katika muktadha wa Yohana, neno hili linamtaja Mungu kwa cheo cha kiuhusiano, hivyo limeandikwa kwa herufi kubwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. ‘Kwa shauri langu mwenyewe’ ni cha kueleweka kwa wasomaji wa kawaida, huku tanbihi ikihifadhi maana mbadala ya mamlaka. Uradidi wa ‘kusema’ na ‘kunena’ umeachwa kwa makusudi ili kuonyesha tofauti ya vitenzi vya Kigiriki.
