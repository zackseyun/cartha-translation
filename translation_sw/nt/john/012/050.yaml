  text: καὶ οἶδα ὅτι ἡ ἐντολὴ αὐτοῦ ζωὴ αἰώνιός ἐστιν. ἃ οὖν ⸂ἐγὼ λαλῶ⸃, καθὼς εἴρηκέν μοι ὁ πατήρ, οὕτως λαλῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/050.yaml
  text: And I know that his commandment is eternal life. So what I speak[a], I speak just as the Father has told me.
translation:
  language: sw
  text: Nami ninajua kwamba amri yake ni uzima wa milele.[a] Kwa hiyo, yale ninayosema, nayasema kama vile Baba alivyoniambia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “amri yake huleta uzima wa milele” au “amri yake inahusu uzima wa milele.” Kigiriki, kwa maana ya karibu zaidi, husema, “amri yake ni uzima wa milele.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐντολή
  choice: amri
  rationale: “Amri” ni neno la kawaida na lenye heshima kwa agizo lenye mamlaka; linadumisha maana ya ἐντολή bila uzito usio wa lazima.
- source_word: ζωὴ αἰώνιος
  choice: uzima wa milele
  rationale: Hili ndilo fungu la kawaida katika Kiswahili kwa usemi huu wa Kiyohana, likidumisha wazo la kudumu na uzito wake wa kiteolojia.
- source_word: ἃ
  choice: yale
  rationale: “Yale” hurejelea kwa kawaida mambo anayoyasema Yesu na kudumisha wingi wa kiwakilishi cha Kigiriki bila kufanya sentensi kuwa nzito.
- source_word: λαλῶ
  choice: ninayosema / ninayasema
  rationale: Kitenzi “sema” ni cha asili zaidi katika Kiswahili hapa; kurudiwa kwake mara mbili kunadumisha urudiaji wa λαλέω katika Kigiriki.
- source_word: καθὼς
  choice: kama vile
  rationale: “Kama vile” huonyesha ulinganifu wa namna kati ya maagizo ya Baba na maneno ya Yesu.
- source_word: εἴρηκέν μοι
  choice: alivyoniambia
  rationale: Muundo huu ni wa kawaida katika Kiswahili na unaonyesha kwamba Baba alimweleza Yesu jambo ambalo linaendelea kuwa msingi wa kusema kwake.
- source_word: ὁ πατήρ
  choice: Baba
  rationale: Jina hili la uhusiano linadumisha “Baba” bila kuongeza “yangu,” ambayo haimo katika Kigiriki.
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Huonyesha wazi hitimisho au matokeo yanayotokana na kauli iliyotangulia.
- source_word: οἶδα
  choice: ninajua
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida inayodumisha uhakika wa kauli.
theological_decisions:
- issue: Maana ya “amri yake ni uzima wa milele”
  choice: Kudumisha usemi wa moja kwa moja “amri yake ni uzima wa milele.”
  alternative: “Amri yake huleta uzima wa milele” au “amri yake inahusu uzima wa milele.”
  rationale: Kigiriki kina usemi wa usawa wa moja kwa moja, si kitenzi kinachosema wazi “huleta” au “inahusu.” Tafsiri ya msingi inadumisha mvutano huo wa kiteolojia bila kuufafanua kupita maandishi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa, cha heshima, na kinachoeleweka kwa msomaji wa kawaida. Urudiaji wa kitenzi “sema” umehifadhiwa; usemi wa moja kwa moja kuhusu amri na uzima wa milele haujafafanuliwa kimadhehebu.
