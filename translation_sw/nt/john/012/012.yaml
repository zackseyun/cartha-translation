  text: Τῇ ἐπαύριον ⸀ὁ ὄχλος πολὺς ὁ ἐλθὼν εἰς τὴν ἑορτήν, ἀκούσαντες ὅτι ἔρχεται ⸁ὁ Ἰησοῦς εἰς Ἱεροσόλυμα,
base_translation:
  language: en
  yaml_path: translation/nt/john/012/012.yaml
  text: The next day[a], the large crowd that had come to the feast, when they heard that Jesus was coming to Jerusalem[b],
translation:
  language: sw
  text: Siku iliyofuata, umati mkubwa uliokuwa umekuja kwenye sikukuu, uliposikia kwamba Yesu alikuwa anakuja Yerusalemu,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τῇ ἐπαύριον
  choice: Siku iliyofuata
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha mfuatano wa simulizi bila ugumu usio wa lazima.
- source_word: ὁ ὄχλος πολὺς
  choice: umati mkubwa
  rationale: ὄχλος ni umati wa watu, na πολὺς hapa huonyesha ukubwa wake; tafsiri hii ni wazi na ya asili.
- source_word: ὁ ἐλθὼν εἰς τὴν ἑορτήν
  choice: uliokuwa umekuja kwenye sikukuu
  rationale: Kirai cha kisifa kinatafsiriwa kwa kishazi rejeshi cha kawaida; wakati timilifu unaonyesha kwamba kuja kwao kulitangulia tukio linalosimuliwa.
- source_word: ἀκούσαντες
  choice: uliposikia
  rationale: Ingawa kishiriki cha Kigiriki ni cha wingi na kinawarejelea watu waliomo katika umati, Kiswahili kwa kawaida hupatanisha kitenzi na nomino ya pamoja ‘umati’; maana ya wakati imehifadhiwa.
- source_word: ὅτι ἔρχεται
  choice: kwamba Yesu alikuwa anakuja
  rationale: Wakati uliopo wa kihistoria wa Kigiriki umetolewa kwa wakati uliopita unaoendelea ili usimulizi wa Kiswahili uwe wa asili huku mwendo unaoendelea ukihifadhiwa.
- source_word: ὁ Ἰησοῦς
  choice: Yesu
  rationale: Jina la mtu limetolewa kwa umbo lake lililozoeleka katika Kiswahili.
- source_word: εἰς Ἱεροσόλυμα
  choice: Yerusalemu
  rationale: Pamoja na kitenzi cha mwendo ‘kuja,’ Kiswahili hakihitaji kihusishi cha ziada ili kueleza mahali anakoelekea.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mstari umeachwa ukiishia kwa koma kwa sababu sentensi inaendelea katika mstari unaofuata. ‘Sikukuu’ ni tafsiri ya kawaida na pana ya ἑορτή; hakuna tanbihi inayohitajika. Wakati uliopo wa kihistoria umetafsiriwa kwa namna ya kawaida ya simulizi ya Kiswahili bila kuondoa maana ya Yesu kuwa njiani kuelekea Yerusalemu.
