  text: Τετύφλωκεν αὐτῶν τοὺς ὀφθαλμοὺς καὶ ⸀ἐπώρωσεν αὐτῶν τὴν καρδίαν, ἵνα μὴ ἴδωσιν τοῖς ὀφθαλμοῖς καὶ νοήσωσιν τῇ καρδίᾳ καὶ ⸀στραφῶσιν, καὶ ⸀ἰάσομαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/040.yaml
  text: He has blinded their eyes and hardened their heart[a], so that they may not see with their eyes and understand with their heart and turn[c][b], and I would heal them.
translation:
  language: sw
  text: Ameyapofusha macho yao na ameufanya moyo wao kuwa mgumu, ili wasione kwa macho yao, wala wasielewe kwa moyo wao, wala wasigeuke[a][c], na nitawaponya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “waongoke” badala ya “wageuke.”
    reason: lexical_alternative
  - marker: b
    text: Kwa kawaida, “nitawaponya.” Kitenzi cha Kigiriki ni cha wakati ujao.
    reason: lexical_alternative
  - marker: c
    text: Maneno haya yanaakisi Isaya 6:10.
    reason: cross_reference
lexical_decisions:
- source_word: Τετύφλωκεν
  choice: Ameyapofusha
  rationale: Kauli ya wakati timilifu inaonyesha tendo lililotendeka ambalo matokeo yake yanaendelea; ‘ameyapofusha’ huhifadhi maana hiyo kwa Kiswahili cha kawaida.
- source_word: ἐπώρωσεν
  choice: ameufanya ... kuwa mgumu
  rationale: Kirai hiki ni cha asili katika Kiswahili na kinaonyesha kuufanya moyo usiwe mwepesi wa kuitikia, bila kupunguza uzito wa hukumu unaopatikana katika dondoo la Isaya.
- source_word: καρδίαν / καρδίᾳ
  choice: moyo / kwa moyo wao
  rationale: ‘Moyo’ huhifadhi taswira na mtazamo wa kibiblia kuhusu utu wa ndani; tendo la ‘kuelewa’ linaweka wazi upande wa ufahamu.
- source_word: ἵνα μὴ
  choice: ili wasi-
  rationale: Muundo huu wa Kiswahili unaonyesha kusudi au matokeo hasi kwa uwazi na kwa lugha ya sasa.
- source_word: ἴδωσιν τοῖς ὀφθαλμοῖς
  choice: wasione kwa macho yao
  rationale: Tafsiri ya moja kwa moja huhifadhi taswira halisi na usambamba wake na kuelewa kwa moyo.
- source_word: νοήσωσιν
  choice: wasielewe
  rationale: Kitenzi hiki hapa kinahusu kufahamu au kuelewa; ‘wasielewe’ ni cha kawaida na sahihi katika muktadha.
- source_word: στραφῶσιν
  choice: wasigeuke
  rationale: ‘Kugeuka’ huhifadhi upana na taswira ya kitenzi cha Kigiriki bila kukifungamanisha moja kwa moja na istilahi maalumu ya kidini kama ‘kuongoka.’
- source_word: ἰάσομαι
  choice: ningewaponya
  rationale: 'Ingawa umbo la Kigiriki ni la wakati ujao, ‘ningewaponya’ linaonyesha kwa Kiswahili uhusiano wa kutegemea sharti unaotokana na mfululizo wa kusudi/matokeo: kuona, kuelewa na kugeuka.'
- source_word: αὐτῶν τὴν καρδίαν
  choice: moyo wao
  rationale: Umoja wa Kigiriki umehifadhiwa kama umoja wa kijumla, unaowakilisha hali ya ndani ya kundi lote.
theological_decisions:
- issue: Utendaji wa Mungu katika kupofusha na kuufanya moyo kuwa mgumu
  choice: Kuhifadhi mtendaji wa umoja wazi katika ‘Ameyapofusha ... na ameufanya ...’
  alternative: Kutumia kauli isiyoonyesha mtendaji au kauli tendwa ili kupunguza ukali wa wazo
  rationale: Vitenzi vya Kigiriki vinamtaja wazi mtendaji wa umoja. Tafsiri inahifadhi mvutano wa kiteolojia kuhusu hukumu ya Mungu badala ya kuupunguza.
- issue: Lugha ya uongofu katika στραφῶσιν
  choice: wasigeuke
  alternative: waongoke
  rationale: Kitenzi cha Kigiriki kina maana pana ya kugeuka au kurudi. ‘Wasigeuke’ huhifadhi upana huo, huku ‘waongoke’ likitajwa katika tanbihi kama uwezekano wa kimuktadha.
- issue: Umbo la ἰάσομαι katika muktadha wa ἵνα μή
  choice: ningewaponya
  alternative: nitawaponya
  rationale: Umbo lenyewe ni la wakati ujao, lakini katika sentensi hii uponyaji unategemea kuona, kuelewa na kugeuka. Kauli ya masharti ni ya asili zaidi katika Kiswahili, na umbo la moja kwa moja la wakati ujao limehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi imehifadhi usambamba wa ‘macho—kuona’ na ‘moyo—kuelewa,’ pamoja na umoja wa kijumla wa ‘moyo wao.’
