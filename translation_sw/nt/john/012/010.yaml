  text: ἐβουλεύσαντο δὲ οἱ ἀρχιερεῖς ἵνα καὶ τὸν Λάζαρον ἀποκτείνωσιν,
base_translation:
  language: en
  yaml_path: translation/nt/john/012/010.yaml
  text: So the chief priests decided to kill Lazarus also,[a]
translation:
  language: sw
  text: Kwa hiyo, makuhani wakuu wakaamua kumuua Lazaro pia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wakapanga kumuua Lazaro pia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβουλεύσαντο
  choice: wakaamua
  rationale: Kitenzi hiki kinaonyesha mashauriano au kufikiri kunakoishia katika azimio la kutenda. “Wakaamua” ni Kiswahili cha sasa na cha kawaida; “wakapanga” pia kinawezekana, lakini kinakazia zaidi hatua ya kupanga.
- source_word: δὲ
  choice: Kwa hiyo
  rationale: Katika mtiririko wa simulizi, kiunganishi hiki kinaendeleza matokeo ya yaliyotangulia. “Kwa hiyo” huonyesha uhusiano huo kwa kawaida bila kuingiza utofautishaji mkali.
- source_word: οἱ ἀρχιερεῖς
  choice: makuhani wakuu
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa viongozi wa kikuhani wanaotajwa kwa wingi katika Injili, wala halimaanishi kuhani mkuu mmoja tu.
- source_word: ἵνα
  choice: kumuua
  rationale: Baada ya “wakaamua,” dhamira ya kusudi au maudhui ya uamuzi inaelezwa kwa kawaida kwa kitenzi-jina cha Kiswahili, “kumuua.”
- source_word: καὶ
  choice: pia
  rationale: Neno hili linamwongeza Lazaro kwa wale waliolengwa kuuawa, kwa mujibu wa muktadha. “Pia” huhifadhi maana hiyo ya nyongeza bila kuongeza mkazo wa “hata.”
- source_word: τὸν Λάζαρον
  choice: Lazaro
  rationale: Jina limetoholewa kwa umbo linalotumika kwa kawaida katika Biblia za Kiswahili; kibainishi cha Kigiriki hakihitaji kutafsiriwa kando.
- source_word: ἀποκτείνωσιν
  choice: kumuua
  rationale: “Kuua” ni tafsiri ya moja kwa moja na ya kawaida. “Kumwua” pia ni tahajia inayokubalika, lakini “kumuua” ni wazi na imeenea; “kumwondoa uhai” ingekuwa ndefu, na “kumwua kikatili” ingeongeza maana isiyosemwa.
theological_decisions:
- issue: Namna ya kuwasilisha nia ya makuhani wakuu dhidi ya Lazaro
  choice: Kusema moja kwa moja kwamba waliamua kumuua Lazaro
  alternative: Kutumia maneno yenye uzito wa ziada kama “walipanga njama” au “walikula njama”
  rationale: Andiko linaonyesha uamuzi wa makusudi wa kumuua Lazaro, lakini halitumii hapa neno maalumu linalolazimisha wazo la njama. Tafsiri inahifadhi uzito wa nia yao bila kuongeza maelezo ya kifasiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa simulizi “wakaamua” unaendeleza vizuri mfululizo wa matukio.
