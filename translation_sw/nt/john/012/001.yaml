  text: Ὁ οὖν Ἰησοῦς πρὸ ἓξ ἡμερῶν τοῦ πάσχα ἦλθεν εἰς Βηθανίαν, ὅπου ἦν ⸀Λάζαρος, ὃν ἤγειρεν ἐκ νεκρῶν ⸀Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/001.yaml
  text: So Jesus came to Bethany six days before the Passover[a], where Lazarus was, whom Jesus had raised from the dead.
translation:
  language: sw
  text: Basi, siku sita kabla ya Pasaka, Yesu alifika Bethania, alikokuwa Lazaro, ambaye Yesu alikuwa amemfufua kutoka kwa wafu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa usemi wa karibu zaidi, “kutoka miongoni mwa wafu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Basi
  rationale: Kiunganishi hiki kinaendeleza simulizi kwa kuhusisha mstari huu na yaliyotangulia, huku kikisikika kwa kawaida katika Kiswahili.
- source_word: πρὸ ἓξ ἡμερῶν τοῦ πάσχα
  choice: siku sita kabla ya Pasaka
  rationale: Huu ndio usemi wa kawaida na sahihi wa wakati katika Kiswahili; Pasaka hapa ni sikukuu ya Kiyahudi inayojulikana.
- source_word: ἦλθεν εἰς Βηθανίαν
  choice: alifika Bethania
  rationale: Katika muktadha huu, 'alifika' huwasilisha kwa kawaida mwendo wa Yesu hadi Bethania bila kulazimisha mtazamo wa 'alikuja' au 'alikwenda'.
- source_word: ὅπου ἦν Λάζαρος
  choice: alikokuwa Lazaro
  rationale: Tafsiri hii huhifadhi kauli rahisi ya mahali bila kuongeza kwamba Lazaro aliishi au alikuwa anakaa huko.
- source_word: ἤγειρεν
  choice: alikuwa amemfufua
  rationale: Muundo huu unaonyesha kwamba tendo la kumfufua Lazaro lilitangulia kufika kwa Yesu katika mstari huu; 'kufufua' ni maana inayofaa katika muktadha wa kifo.
- source_word: ἐκ νεκρῶν
  choice: kutoka miongoni mwa wafu
  rationale: Huhifadhi wazi wazo la kutoka katikati ya kundi la waliokufa, ambalo limo katika muundo wa Kigiriki.
- source_word: Βηθανίαν
  choice: Bethania
  rationale: Jina la mahali limetoholewa kwa tahajia iliyozoeleka katika Kiswahili.
- source_word: πάσχα
  choice: Pasaka
  rationale: Hili ndilo jina la kawaida la Kiswahili kwa sikukuu ya Kiyahudi inayotajwa hapa.
theological_decisions:
- issue: Lugha ya ufufuo kuhusu Lazaro
  choice: ambaye Yesu alikuwa amemfufua kutoka miongoni mwa wafu
  alternative: ambaye alikuwa amemfufua kutoka kwa wafu
  rationale: Jina 'Yesu' limerudiwa kama katika Kigiriki, badala ya kubadilishwa kuwa kiwakilishi, ili kuhifadhi msisitizo wa wazi kwamba Yesu ndiye aliyemfufua Lazaro. 'Miongoni mwa wafu' pia huhifadhi upeo wa ἐκ νεκρῶν bila kuufanya usemi huo kuwa madai mapana zaidi ya maandishi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mpangilio ni wa kawaida katika simulizi, huku marudio ya jina Yesu na taarifa rahisi kuhusu mahali Lazaro alipokuwa vikihifadhiwa.
