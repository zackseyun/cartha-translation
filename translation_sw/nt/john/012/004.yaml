  text: λέγει ⸀δὲ ⸂Ἰούδας ὁ Ἰσκαριώτης εἷς τῶν μαθητῶν αὐτοῦ⸃, ὁ μέλλων αὐτὸν παραδιδόναι·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/004.yaml
  text: But Judas Iscariot[a], one of his disciples—the one who was about to betray him—said,
translation:
  language: sw
  text: Lakini Yuda Iskariote, mmoja wa wanafunzi wake—yule ambaye alikuwa karibu kumsaliti[a]—akasema,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya karibu zaidi, “kumkabidhi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: akasema
  rationale: Ingawa Kigiriki kimetumia wakati uliopo wa kisimulizi (‘anasema’), Kiswahili cha kawaida hutumia wakati uliopita katika masimulizi. ‘Akasema’ pia linaendeleza mfuatano wa matukio kwa ufasaha.
- source_word: δὲ
  choice: Lakini
  rationale: Kiunganishi hiki kinaonyesha badiliko lenye utofauti mdogo; hapa kinatofautisha tendo la Mariamu na pingamizi la Yuda.
- source_word: Ἰούδας ὁ Ἰσκαριώτης
  choice: Yuda Iskariote
  rationale: Haya ndiyo maumbo ya majina yaliyozoeleka katika Kiswahili cha Biblia na yanatambulika kwa urahisi.
- source_word: εἷς τῶν μαθητῶν αὐτοῦ
  choice: mmoja wa wanafunzi wake
  rationale: ‘Wanafunzi’ huhifadhi uhusiano wa mwalimu na mwanafunzi unaokusudiwa na μαθητής, kwa usahihi zaidi kuliko neno pana kama ‘wafuasi.’
- source_word: ὁ μέλλων
  choice: yule ambaye alikuwa karibu
  rationale: Muundo huu unahifadhi maana ya tendo lililokuwa likitarajiwa au kukaribia kutokea bila kulieleza tu kama tukio la baadaye.
- source_word: παραδιδόναι
  choice: kumsaliti
  rationale: Kitenzi παραδίδωμι kwa msingi humaanisha ‘kumkabidhi,’ lakini katika muktadha wa tendo la Yuda dhidi ya Yesu kinamaanisha usaliti. Tafsiri ya msingi imehifadhiwa katika tanbihi.
theological_decisions:
- issue: Jinsi ya kutafsiri παραδιδόναι kuhusu tendo la Yuda kwa Yesu
  choice: kumsaliti
  alternative: kumkabidhi
  rationale: ‘Kumsaliti’ huonyesha kwa uwazi maana ya tendo hilo katika muktadha, ilhali ‘kumkabidhi’ huhifadhi upana wa kimsingi wa kitenzi na ulinganifu wake na matumizi mengine. Tanbihi inadumisha uwezekano huo wa kileksika bila kuficha uzito wa muktadha.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imehifadhi koma ya mwisho kwa kuwa usemi wa Yuda unaendelea katika mstari unaofuata. Alama ya tanbihi imewekwa moja kwa moja baada ya ‘kumsaliti,’ neno linalohusika.
