base_translation:
  language: en
  yaml_path: translation/nt/john/012/002.yaml
  text: So they made a dinner for him there[a], and Martha was serving, but Lazarus was one of those reclining at the table with him.
translation:
  language: sw
  text: Kwa hiyo wakamwandalia chakula huko, na Martha alikuwa akihudumu, lakini Lazaro alikuwa mmoja wa wale waliokuwa wameketi mezani[a] pamoja naye.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya karibu zaidi, “mmoja wa wale waliokuwa wamejilaza pamoja naye.” Katika milo rasmi ya wakati huo, ilikuwa desturi kula watu wakiwa wamejilaza au kuegemea, badala ya kuketi kama ilivyo kawaida leo.
    reason: cultural_note
lexical_decisions:
- source_word: ἐποίησαν
  choice: wakamwandalia
  rationale: Pamoja na δεῖπνον na αὐτῷ, kitenzi kinaeleza kuandaa chakula kwa ajili ya Yesu; muundo huu ni wa asili katika Kiswahili na hauwataji waandaaji ambao Kigiriki hakiwataji.
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Kiunganishi hiki kinaendeleza simulizi kwa kuhusianisha tukio na muktadha uliotangulia; ‘Kwa hiyo’ kinahifadhi nguvu yake ya kimantiki.
- source_word: δεῖπνον
  choice: chakula
  rationale: Neno hilo humaanisha mlo mkuu, mara nyingi wa jioni. ‘Chakula’ ni wazi na cha kawaida bila kudokeza karamu kubwa kuliko inavyosema Kigiriki.
- source_word: ἐκεῖ
  choice: huko
  rationale: Kielezi cha mahali kinarejelea Bethania katika muktadha; ‘huko’ ni cha asili katika simulizi ya Kiswahili.
- source_word: διηκόνει
  choice: alikuwa akihudumu
  rationale: Muundo wa wakati uliopita unaoendelea unaakisi hali endelevu ya imperfect; katika mazingira haya huduma ilikuwa kuwahudumia watu wakati wa chakula.
- source_word: δὲ
  choice: lakini
  rationale: Kinabainisha tofauti ndogo kati ya Martha aliyekuwa akihudumu na Lazaro aliyekuwa miongoni mwa waliokula pamoja na Yesu.
- source_word: εἷς ἦν ἐκ
  choice: alikuwa mmoja wa
  rationale: Muundo huu unamtambulisha Lazaro kuwa mmoja wa kundi lililokuwapo kwenye chakula.
- source_word: ἀνακειμένων
  choice: wale waliokuwa wameketi mezani
  rationale: Kitenzi humaanisha kujiegemeza au kulala kwa ubavu wakati wa chakula. Maandishi makuu yanatumia usemi wa kawaida wa Kiswahili, huku tanbihi ikihifadhi desturi mahususi ya wakati huo.
- source_word: σὺν αὐτῷ
  choice: pamoja naye
  rationale: Ni usemi wa uandamani; kiwakilishi kinamrejelea Yesu katika muktadha.
