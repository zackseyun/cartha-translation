  text: ὁ οὖν ὄχλος ὁ ἑστὼς καὶ ἀκούσας ἔλεγεν βροντὴν γεγονέναι· ἄλλοι ἔλεγον· Ἄγγελος αὐτῷ λελάληκεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/029.yaml
  text: So the crowd that was standing there and had heard it was saying that thunder had happened; others were saying[a], “An angel has spoken to him.”
translation:
  language: sw
  text: Basi, umati uliokuwa umesimama pale na ulikuwa umesikia sauti hiyo ulikuwa ukisema kwamba kulikuwa kumenguruma; wengine walikuwa wakisema, “Malaika amesema naye.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Ngurumo ilikuwa imetokea.”
    reason: Hutoa tafsiri ya karibu zaidi ya βροντὴν γεγονέναι; maandishi makuu hutumia usemi wa kawaida wa Kiswahili.
lexical_decisions:
- source_word: οὖν
  choice: Basi
  rationale: Huendeleza simulizi na kuonyesha matokeo ya sauti iliyotangulia bila kufanya uhusiano huo kuwa wa kimantiki kupita kiasi.
- source_word: ὄχλος
  choice: umati
  rationale: Ni neno la kawaida na linaloeleweka kwa kundi kubwa la watu waliokusanyika.
- source_word: ὁ ἑστὼς
  choice: uliokuwa umesimama pale
  rationale: Huwakilisha hali inayoendelea inayotokana na kitenzi timilifu cha Kigiriki na pia eneo linalodokezwa na muktadha.
- source_word: ἀκούσας
  choice: ambao ulikuwa umesikia sauti hiyo
  rationale: Huonyesha kwamba kusikia kulitokea kabla ya kusema. ‘Sauti hiyo’ imewekwa wazi kutokana na sauti iliyotajwa katika mstari uliotangulia.
- source_word: ἔλεγεν
  choice: ulikuwa ukisema
  rationale: Muundo huu huhifadhi hali ya kuendelea au kurudiwa ya kitenzi cha wakati usiotimilifu.
- source_word: βροντὴν γεγονέναι
  choice: Radi ilikuwa imepiga
  rationale: Ni usemi wa kawaida wa Kiswahili unaowasilisha kwamba ngurumo ilikuwa imetokea, huku wakati timilifu ukidokeza tukio lililokuwa limekwisha kutokea.
- source_word: ἄλλοι
  choice: Wengine
  rationale: Hutofautisha kundi jingine ndani ya umati.
- source_word: Ἄγγελος
  choice: Malaika
  rationale: Katika muktadha huu umati unaifasiri sauti ya mbinguni kuwa ya kiumbe wa mbinguni, si mjumbe wa kibinadamu.
- source_word: αὐτῷ
  choice: naye
  rationale: Katika usemi ‘amezungumza naye,’ huwasilisha kwa Kiswahili cha kawaida kwamba malaika alizungumza na Yesu, bila kulazimisha maudhui ambayo hayakutajwa.
- source_word: λελάληκεν
  choice: amezungumza
  rationale: Wakati timilifu wa Kiswahili huhifadhi tendo lililokamilika lenye umuhimu kwa hali ya sasa.
theological_decisions:
- issue: Asili ya msemaji wa mbinguni
  choice: Malaika amezungumza naye
  alternative: Mjumbe amezungumza naye
  rationale: Muktadha unaonyesha kwamba huu ni ufafanuzi wa umati kuhusu sauti iliyotoka mbinguni. ‘Malaika’ ndiyo maana inayowezekana zaidi hapa, bila kuongeza maelezo ya kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa simulizi ni wa kawaida kwa wasomaji wengi; vipengele vya wakati vya Kigiriki vimehifadhiwa kadiri vinavyoweza kusikika kwa uasilia katika Kiswahili.
