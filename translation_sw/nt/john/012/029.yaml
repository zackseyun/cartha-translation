  rationale: Nimebadilisha “radi” kuwa “kumenguruma” ili kutafsiri βροντή kama ngurumo, si umeme wa radi. Nimeondoa alama za nukuu katika kauli ya kwanza na kutumia “kwamba,” kwa kuwa Kigiriki hutumia infinitivu ya taarifa. Pia nimeweka “walikuwa wakisema” katika makundi yote mawili ili kuonyesha imperfect ya Kigiriki. Kifungu cha “uliokuwa umesikia” huhifadhi tendo la kusikia lililotangulia kauli ya umati.
