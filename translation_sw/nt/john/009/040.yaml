  text: ⸀ἤκουσαν ἐκ τῶν Φαρισαίων ταῦτα οἱ ⸂μετ’ αὐτοῦ ὄντες⸃, καὶ εἶπον αὐτῷ· Μὴ καὶ ἡμεῖς τυφλοί ἐσμεν;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/040.yaml
  text: Some of the Pharisees who were with him heard these things and said to him[a], “Surely we are not blind too, are we?”
translation:
  language: sw
  text: Baadhi ya Mafarisayo waliokuwa pamoja naye walisikia mambo hayo, wakamwambia, “Je, sisi pia si vipofu, sivyo?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Je, sisi pia ni vipofu?” Katika Kigiriki, swali hili linaanza na μή, ambayo kwa kawaida hutazamia jibu la kukataa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσαν
  choice: walisikia
  rationale: Kitenzi hiki katika simulizi kinaonyesha kwamba walipokea na kuelewa kwa kusikia yale ambayo Yesu alisema; “walisikia” ni Kiswahili cha kawaida na sahihi.
- source_word: ἐκ τῶν Φαρισαίων
  choice: Baadhi ya Mafarisayo
  rationale: Muundo wa ἐκ pamoja na hali ya umilikishi unaonyesha sehemu ya kundi, si Mafarisayo wote.
- source_word: ταῦτα
  choice: mambo hayo
  rationale: Inahifadhi wingi wa kiwakilishi na kurejelea kauli zilizotangulia bila kuziweka kuwa maneno pekee.
- source_word: οἱ μετ’ αὐτοῦ ὄντες
  choice: waliokuwa pamoja naye
  rationale: Tafsiri hii ya kawaida inatambulisha Mafarisayo waliokuwapo pamoja na Yesu bila kufanya muundo kuwa mzito.
- source_word: εἶπον αὐτῷ
  choice: wakamwambia
  rationale: Huwasilisha kwa kawaida tendo la kumwelekea Yesu kwa maneno; umbo la swali linaonekana katika nukuu yenyewe.
- source_word: Μὴ
  choice: Je, ...?
  rationale: Katika muktadha huu μή huanzisha swali linalotarajia jibu la kukataa. Kiswahili mara nyingi huacha matarajio hayo yaonekane kupitia muktadha na sauti; tanbihi inalieleza wazi.
- source_word: καὶ
  choice: pia
  rationale: Inaunganisha “sisi” na vipofu waliotajwa katika mazungumzo yaliyotangulia.
- source_word: ἡμεῖς
  choice: sisi
  rationale: Kiwakilishi kilichotamkwa wazi katika Kigiriki kina mkazo, ambao “sisi” inauhifadhi.
- source_word: τυφλοί
  choice: vipofu
  rationale: Neno linatafsiriwa bila kuongeza “kiroho,” hivyo taswira na kinaya cha muktadha vinabaki.
- source_word: ἐσμεν
  choice: ni
  rationale: Kishirikishi cha wakati uliopo kinawasilishwa kwa muundo wa kawaida wa Kiswahili.
theological_decisions:
- issue: Iwapo maana ya sitiari ya τυφλοί ielezwe wazi
  choice: Kutumia “vipofu” bila kuongeza “kiroho” katika matini kuu
  alternative: vipofu kiroho
  rationale: Muktadha unaonyesha maana ya kiroho, lakini Kigiriki hakiongezi sifa hiyo. Kuacha “vipofu” kunadumisha kinaya cha Yohana na huepuka kuingiza ufafanuzi ndani ya matini.
- issue: Mwelekeo wa swali linaloanzishwa na μή
  choice: Kuweka swali la kawaida katika matini na kueleza matarajio ya jibu hasi katika tanbihi
  alternative: “Hakika sisi pia si vipofu, sivyo?”
  rationale: Muundo mbadala unaweza kusikika usio wa kawaida au wenye mkazo uliozidi katika Kiswahili. Tanbihi huhifadhi taarifa ya kisarufi bila kulazimisha usemi mgumu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Wakamwambia” ni mtiririko wa kawaida wa simulizi, na “mambo hayo” huhifadhi rejeo pana la ταῦτα. Alama ya tanbihi imewekwa baada ya nukuu nzima.
