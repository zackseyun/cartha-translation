lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Kwa sababu hiyo
  rationale: Kirai hiki kinaelekeza nyuma kwenye sababu iliyotajwa katika mstari wa 22 na kuhifadhi wazi uhusiano wa kisababishi.
- source_word: οἱ γονεῖς αὐτοῦ
  choice: wazazi wake
  rationale: Hili ni neno la kawaida na sahihi la Kiswahili kwa wazazi wa mtu huyo kwa pamoja.
- source_word: εἶπαν
  choice: walisema
  rationale: Kitenzi hiki ni cha kawaida cha kusema; tafsiri hii haiongezi maana maalumu ya kujibu au kueleza ambayo haijawekwa wazi katika Kigiriki.
- source_word: Ἡλικίαν ἔχει
  choice: Ana umri wa kutosha
  rationale: Nahau hii inaonyesha kwamba mtu huyo alikuwa na umri wa kuwajibika na kujibu mwenyewe. Kiswahili hiki ni cha asili na hakilazimishi maana mahususi zaidi ya kuwa mtu mzima kisheria.
- source_word: αὐτὸν
  choice: yeye mwenyewe
  rationale: 'Kiwakilishi hiki kina msisitizo: wazazi wanaelekeza waulizaji wamwendee mwana wao moja kwa moja.'
- source_word: ἐπερωτήσατε
  choice: mwulizeni
  rationale: Amri hii inataka swali lielekezwe kwake; “mwulizeni” ni Kiswahili cha kawaida na cha moja kwa moja.
