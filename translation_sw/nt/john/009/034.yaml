  text: ἀπεκρίθησαν καὶ εἶπαν αὐτῷ· Ἐν ἁμαρτίαις σὺ ἐγεννήθης ὅλος, καὶ σὺ διδάσκεις ἡμᾶς; καὶ ἐξέβαλον αὐτὸν ἔξω.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/034.yaml
  text: They answered and said to him[a], “You were born entirely in sins[c][b], and are you teaching us?” And they cast him out.
translation:
  language: sw
  text: Wakamjibu, “Wewe ulizaliwa katika dhambi tupu, halafu unatufundisha sisi?” Nao wakamfukuza.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “wakamtoa nje.” Huenda hii inamaanisha walimfukuza kutoka mbele yao; katika muktadha inaweza pia kudokeza kutengwa na jumuiya ya sinagogi.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθησαν καὶ εἶπαν αὐτῷ
  choice: Wakamjibu
  rationale: Kiswahili cha kawaida hutumia kitenzi kimoja ‘kujibu’ kwa muundo huu wa Kigiriki; kutafsiri ‘wakajibu na kumwambia’ kungekuwa nzito na isiyo ya kawaida bila kuongeza maana.
- source_word: Ἐν ἁμαρτίαις
  choice: ukiwa umejaa dhambi
  rationale: Huhifadhi wingi wa ἁμαρτίαις na nguvu ya shutuma, huku ikitoa Kiswahili kinachoeleweka kuliko tafsiri sisisi ‘katika dhambi.’
- source_word: ἐγεννήθης ὅλος
  choice: ulizaliwa ukiwa ... kabisa
  rationale: ‘Kabisa’ huwasilisha mkazo wa ὅλος juu ya hali waliyomshutumu nayo tangu kuzaliwa, bila kudai kuwa kitendo cha kuzaliwa chenyewe kilikuwa ‘kamili.’
- source_word: καὶ σὺ διδάσκεις ἡμᾶς;
  choice: halafu unatufundisha sisi?
  rationale: ‘Halafu’ huonyesha mshangao wenye dharau wa swali, na ‘sisi’ huhifadhi mkazo wa viwakilishi σὺ na ἡμᾶς.
- source_word: ἐξέβαλον αὐτὸν ἔξω
  choice: wakamtoa nje
  rationale: Ni usemi wa asili wa Kiswahili unaodumisha wazo la kumfukuza kutoka walipokuwapo, bila kuamua kwa lazima kama lilikuwa tendo rasmi la kumtenga na sinagogi.
theological_decisions:
- issue: Maana ya shutuma kwamba alizaliwa ‘katika dhambi’ kuhusiana na upofu wake wa kuzaliwa
  choice: Maneno yamewasilishwa kama shutuma kwamba hali yake tangu kuzaliwa ilikuwa imejaa dhambi.
  alternative: ‘Ulizaliwa katika dhambi kabisa’ au ‘ulizaliwa ukiwa mwenye dhambi kabisa.’
  rationale: Kigiriki hakielezi kama wanamaanisha dhambi zake mwenyewe, dhambi ya kurithi, au dhambi za wazazi wake. Tafsiri haiongezi maelezo ya kimafundisho ambayo hayajasemwa.
- issue: Maana ya kumtoa nje
  choice: Tafsiri kuu haisemi wazi kwamba alitengwa rasmi na jumuiya ya sinagogi.
  alternative: ‘Wakamfukuza kutoka katika sinagogi.’
  rationale: Muktadha unaweza kudokeza kutengwa na jumuiya, lakini maneno yenyewe yanaweza pia kumaanisha tu kumfukuza kutoka mbele yao; tanbihi huhifadhi uwezekano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mazungumzo yanadumisha sauti kali na ya dharau ya wasemaji bila kutumia lugha ya kizamani.
