  text: Basi wakamwambia, “Alikufanyia nini? Alifunguaje macho yako?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπον
  choice: wakamwambia
  rationale: Kitenzi λέγω kinamaanisha kusema; umbo la wingi na kiwakilishi cha yule mtu yamewasilishwa kwa ‘wakamwambia,’ bila kubadili kitenzi kuwa ‘wakauliza,’ ingawa maneno yanayofuata ni maswali.
- source_word: οὖν
  choice: Basi
  rationale: ‘Basi’ ni kiunganishi cha kawaida kinachoonyesha mwendelezo au matokeo katika hoja, bila kukifanya kiwe cha wakati tu.
- source_word: Τί ἐποίησέν σοι
  choice: Alikufanyia nini?
  rationale: ‘Alikufanyia nini?’ ni Kiswahili cha asili kinachohifadhi swali kuhusu jambo alilomtendea mtu huyo; pia hakilazimishi maana ya tendo kuwa la faida au la madhara.
- source_word: πῶς ἤνοιξέν σου τοὺς ὀφθαλμούς
  choice: Alifunguaje macho yako?
  rationale: Hili linaonyesha kwa kawaida na kwa ufupi swali la namna au njia ambayo macho yake yalifunguliwa, huku likihifadhi kauli tendaji.
