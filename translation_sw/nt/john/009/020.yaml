  yaml_path: translation/nt/john/009/020.yaml
  text: So his parents answered and said[a], “We know that this is our son and that he was born blind.
translation:
  language: sw
  text: Basi wazazi wake wakajibu na kusema, “Tunajua kwamba huyu ni mwana wetu, na kwamba alizaliwa kipofu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: Basi
  rationale: Inaonyesha mwendelezo wa kisimulizi na matokeo ya kuulizwa kwa wazazi katika mstari uliotangulia, kwa Kiswahili cha kawaida.
- source_word: γονεῖς
  choice: wazazi
  rationale: Nomino ya wingi inawarejelea baba na mama kwa pamoja; “wazazi” ndiyo tafsiri ya kawaida na sahihi.
- source_word: ἀπεκρίθησαν ... καὶ εἶπαν
  choice: wakajibu na kusema
  rationale: Inahifadhi vitenzi vyote viwili na muundo wa usemi wa Yohana bila kuufupisha kuwa kitenzi kimoja.
- source_word: Οἴδαμεν
  choice: Tunajua
  rationale: Inawasilisha moja kwa moja maarifa au uhakika unaodaiwa na wazazi.
- source_word: οὗτός ἐστιν ὁ υἱὸς ἡμῶν
  choice: huyu ni mwana wetu
  rationale: Ni utambulisho wa kawaida kwa Kiswahili na unahifadhi nguvu ya kiashiria οὗτος.
- source_word: τυφλὸς
  choice: kipofu
  rationale: Ni kivumishi cha hali yake wakati wa kuzaliwa; “kipofu” ni neno la kawaida na lenye heshima katika muktadha huu.
- source_word: ἐγεννήθη
  choice: alizaliwa
  rationale: Kauli tendwa ya γεννάω katika muktadha wa kuzaliwa hutafsiriwa kwa kawaida “alizaliwa.”
- source_word: τυφλὸς ἐγεννήθη
  choice: alizaliwa kipofu
  rationale: Inafuata kwa karibu maana na mpangilio wa Kigiriki huku ikiwa Kiswahili cha asili na kinachoeleweka.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa jozi “wakajibu na kusema” umehifadhiwa kwa uaminifu kwa mtindo wa chanzo. Hakuna tanbihi iliyowekwa kwa sababu “alizaliwa kipofu” na “alikuwa kipofu tangu kuzaliwa” hazileti tofauti ya maana inayohitaji tanbihi katika Kiswahili.
