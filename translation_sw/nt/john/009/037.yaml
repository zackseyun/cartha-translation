  text: Jesus said to him[a], “You have seen him, and the one speaking with you is he.”
translation:
  language: sw
  text: Yesu akamwambia, “Na umemwona, na anayesema nawe ndiye huyo.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν αὐτῷ ὁ Ἰησοῦς
  choice: Yesu akamwambia
  rationale: 'Muundo huu ni wa kawaida katika masimulizi ya Kiswahili: ‘akamwambia’ humtaja anayesema na yule anayeambiwa bila kuongeza maana zaidi ya Kigiriki.'
- source_word: Καὶ ἑώρακας αὐτὸν
  choice: Umemwona
  rationale: Wakati timilifu wa Kigiriki unaonyesha tendo lililokwisha kutokea lenye umuhimu wa sasa; ‘umemwona’ huhifadhi maana hiyo kwa Kiswahili cha kawaida. Kiunganishi καί hakihitaji kutafsiriwa hapa kwa neno tofauti, kwa kuwa uhusiano wa kauli unaendelea wazi katika sentensi inayofuata.
- source_word: ὁ λαλῶν
  choice: anayesema
  rationale: Kirai hiki cha kitenzi cha wakati wa sasa kinamtambulisha mtu anayeendelea kusema. ‘Anayesema’ ni cha heshima, cha kawaida, na kinabaki karibu na maana ya chanzo.
- source_word: μετὰ σοῦ
  choice: nawe
  rationale: μετά pamoja na hali ya genitivi ina maana ya msingi ya ‘pamoja na/na.’ ‘Anayesema nawe’ ni Kiswahili cha kawaida na huhifadhi wazo la kusema pamoja na mtu badala ya kuligeuza bila sababu kuwa ‘kwako.’
- source_word: ἐκεῖνός ἐστιν
  choice: ndiye huyo
  rationale: Kiswahili huhitaji utambulisho huu kusemwa kwa namna kamili na ya asili. ‘Ndiye huyo’ huhifadhi msisitizo wa kumtambulisha Yesu moja kwa moja bila kurudia cheo kilichotajwa katika muktadha uliotangulia.
theological_decisions:
- issue: Yesu kujitambulisha kuwa ndiye anayerejelewa katika swali la awali kuhusu Mwana wa Adamu
  choice: anayesema nawe ndiye huyo
  alternative: huyo unayesema naye ndiye
  rationale: Tafsiri inahifadhi utambulisho wa moja kwa moja uliomo katika Kigiriki bila kuongeza cheo ‘Mwana wa Adamu’ ndani ya aya hii, na pia bila kugeuza kauli kuwa maelezo mapana zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima, na rahisi kueleweka. ‘Ndiye huyo’ imetumiwa ili utambulisho usikike kamili na wa kawaida kwa Kiswahili huku mpangilio na msisitizo wa Kigiriki vikihifadhiwa.
