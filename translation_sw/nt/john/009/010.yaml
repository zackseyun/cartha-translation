  text: So they said to him[a], “How were your eyes opened?”
translation:
  language: sw
  text: Basi wakamwuliza, “Macho yako yalifumbuliwaje?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: wakawa wakimuuliza
  rationale: Kitenzi cha wakati uliopita unaoendelea (imperfect) kinaweza kuonyesha usemi uliokuwa ukiendelea au kurudiwa. Katika muktadha huu usemi wenyewe ni swali, hivyo ‘wakawa wakimuuliza’ ni Kiswahili cha kawaida kinachohifadhi hali hiyo.
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Kiunganishi hiki kinaonyesha matokeo au mwendelezo wenye uhusiano na yaliyotangulia. ‘Kwa hiyo’ kinahifadhi nguvu hiyo ya kimantiki kwa lugha ya kawaida.
- source_word: αὐτῷ
  choice: -mu- katika ‘wakimuuliza’
  rationale: Kiwakilishi cha nafsi ya tatu umoja kama yambwa kinawakilisha kwa usahihi maana ya ‘kwake/yeye’ katika muundo wa Kiswahili.
- source_word: Πῶς
  choice: -je katika ‘yalifumbuliwaje’
  rationale: Kiambishi ‘-je’ huuliza namna kwa njia ya kawaida na ya moja kwa moja katika Kiswahili.
- source_word: ἠνεῴχθησάν
  choice: yalifumbuliwa
  rationale: Ni kitenzi cha aoristi katika kauli tendwa. ‘Yalifumbuliwa’ kinahifadhi kauli tendwa na tukio lililokamilika bila kumtaja mtendaji.
- source_word: σου
  choice: yako
  rationale: Kiwakilishi hiki cha umilikaji wa nafsi ya pili umoja kinaendana na nomino ‘macho’.
- source_word: οἱ ὀφθαλμοί
  choice: macho
  rationale: ‘Macho’ ndiyo neno la kawaida na sahihi la Kiswahili; umilikaji unaonyeshwa kwa ‘yako’.
theological_decisions:
- issue: Mtendaji wa kufumbua macho hakutajwa
  choice: Kauli tendwa ‘yalifumbuliwa’ imedumishwa
  alternative: ‘Ulipataje kuona?’
  rationale: Kigiriki hakimtaji mtendaji, na muundo wake unalenga kufumbuliwa kwa macho. Tafsiri haipaswi kutaja mtendaji wala kubadili swali kuwa swali kuhusu uwezo wa kuona.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Wakawa wakimuuliza’ ni cha asili kuliko kufuata neno kwa neno ‘walikuwa wakisema kwake,’ huku kikihifadhi hali ya imperfect; ‘macho yako yalifumbuliwaje?’ huhifadhi kauli tendwa ya Kigiriki.
