  text: ἀπεκρίθη οὖν ⸀ἐκεῖνος· Εἰ ἁμαρτωλός ἐστιν οὐκ οἶδα· ἓν οἶδα ὅτι τυφλὸς ὢν ἄρτι βλέπω.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/025.yaml
  text: 'So that man answered[a], “Whether he is a sinner, I do not know. One thing I do know: though I was blind, now I see.”'
translation:
  language: sw
  text: 'Basi yule mtu akajibu, “Sijui kama yeye ni mwenye dhambi. Jambo moja nalijua: nilikuwa kipofu, lakini sasa ninaona.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη οὖν ἐκεῖνος
  choice: Basi, mtu huyo akajibu
  rationale: “Basi” linaendeleza hoja kutoka mazungumzo yaliyotangulia; “mtu huyo” linahifadhi nguvu ya kiwakilishi cha kuonyesha ἐκεῖνος; na “akajibu” ni simulizi la kawaida na la moja kwa moja.
- source_word: Εἰ ἁμαρτωλός ἐστιν
  choice: Kama yeye ni mwenye dhambi
  rationale: Katika muktadha wa jambo analosema halijui, “kama” linaweza kuleta maana ya ‘ikiwa’ au ‘iwapo,’ hivyo linahifadhi upeo wa εἰ bila kuamua zaidi ya maandishi. “Mwenye dhambi” ni usemi wa kawaida wa Kiswahili kwa ἁμαρτωλός.
- source_word: οὐκ οἶδα
  choice: sijui
  rationale: Hili ni tamko la moja kwa moja na la kawaida la kutokuwa na maarifa; kitenzi cha Kigiriki kina umbo la timilifu lakini maana ya wakati wa sasa.
- source_word: ἓν οἶδα
  choice: Jambo moja ninalijua
  rationale: Kurudia kitenzi kamili kunasisitiza tofauti kati ya jambo asilolijua na ushuhuda mmoja anaojua kwa hakika.
- source_word: τυφλὸς ὢν
  choice: nilikuwa kipofu
  rationale: Kirai shirikishi kinaeleza hali yake ya zamani, ambayo inatofautishwa wazi na uwezo wake wa kuona sasa.
- source_word: ἄρτι βλέπω
  choice: sasa ninaona
  rationale: “Sasa” linaonyesha hali ya sasa kinyume na upofu wa zamani, na “ninaona” linatafsiri βλέπω kwa njia ya moja kwa moja.
theological_decisions:
- issue: Kuhifadhi ukomo wa maarifa ya mtu aliyeponywa bila kutoa uamuzi wa msimulizi kuhusu hali ya Yesu
  choice: Kama yeye ni mwenye dhambi, sijui.
  alternative: Sijui ikiwa yeye ni mwenye dhambi.
  rationale: Kauli hiyo inaripoti tu kwamba msemaji hajui jibu la shtaka lililotolewa. Haitoi hukumu kwamba Yesu ni mwenye dhambi wala kutatua swali hilo kwa niaba ya msimulizi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi fupi na mlingano wa ‘nilikuwa kipofu, lakini sasa ninaona’ huhifadhi nguvu ya ushuhuda wa msemaji.
