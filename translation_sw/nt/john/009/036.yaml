translation:
  language: sw
  text: Yule mtu akajibu, akasema, “Na ni nani huyo, Bwana[a], ili nimwamini?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “bwana,” kama neno la heshima. Neno la Kigiriki κύριε linaweza kuwa namna ya heshima ya kumwita mtu, na pia linaweza kumaanisha “Bwana.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη ἐκεῖνος καὶ εἶπεν
  choice: Yule mtu akajibu
  rationale: Muundo wa Kigiriki una kitenzi maradufu, kihalisi ‘akajibu na kusema.’ Katika Kiswahili cha sasa, ‘akajibu’ pekee hutoa maana hiyo kwa kawaida, huku ἐκεῖνος ikitafsiriwa ‘yule mtu’ ili kurejelea wazi mtu aliyezaliwa kipofu.
- source_word: Καὶ τίς ἐστιν
  choice: Ni nani huyo
  rationale: Καί ya mwanzo inaendeleza jibu, lakini katika Kiswahili uendelevu huo unaeleweka kiasili bila kuanza swali kwa ‘Na.’ ‘Ni nani huyo’ huhifadhi swali la kumtambulisha mtu anayezungumziwa.
- source_word: κύριε
  choice: Bwana
  rationale: ‘Bwana’ ndilo chaguo la kawaida kwa κύριε na huhifadhi uwezekano wa maana ya kitheolojia; kwa kuwa hapa pia linaweza kuwa neno la heshima, uwezekano huo umeelezwa katika tanbihi.
- source_word: ἵνα πιστεύσω εἰς αὐτόν
  choice: ili nimwamini
  rationale: ‘Ili’ huhifadhi kusudi linaloonyeshwa na ἵνα pamoja na hali tegemezi. ‘Nimwamini’ ni Kiswahili cha kawaida kwa πιστεύω εἰς αὐτόν katika muktadha huu.
theological_decisions:
- issue: Maana ya κύριε kabla ya kukiri kwa mtu huyo katika mstari unaofuata
  choice: Bwana
  alternative: bwana / mheshimiwa kama namna ya heshima
  rationale: κύριε inaweza kumaanisha ‘Bwana’ au kutumiwa kama namna ya heshima. Matini kuu inatumia ‘Bwana,’ lakini tanbihi huhifadhi utata wa kiwango cha utambuzi wa msemaji bila kukilazimisha kifungu kuelekea tafsiri moja.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Yule mtu’ huweka mrejelewa wazi; sentensi ya moja kwa moja huepuka urudiaji usio wa kawaida wa ‘akajibu na kusema.’
