id: JHN.9.15
reference: John 9:15
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: πάλιν οὖν ἠρώτων αὐτὸν καὶ οἱ Φαρισαῖοι πῶς ἀνέβλεψεν. ὁ δὲ εἶπεν αὐτοῖς· Πηλὸν ἐπέθηκέν μου ἐπὶ τοὺς ὀφθαλμούς, καὶ ἐνιψάμην, καὶ βλέπω.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/015.yaml
  text: So the Pharisees also asked him again how he had received his sight[a]. He said to them, “He put mud on my eyes, and I washed[b], and I see.”
translation:
  language: sw
  text: Kwa hiyo, Mafarisayo nao wakamuuliza tena jinsi alivyopata kuona. Akawaambia, “Alinipaka tope machoni, nami nikanawa, na sasa ninaona.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάλιν
  choice: tena
  rationale: Huonyesha kuwa swali hili lilirudiwa; “tena” ni tafsiri fupi na ya kawaida.
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Huunganisha tukio hili na simulizi lililotangulia bila kulifanya kuwa hitimisho lenye nguvu kupita kiasi.
- source_word: ἠρώτων
  choice: wakamuuliza
  rationale: Kauli ya wakati usiotimilika inaweza kudokeza kuuliza kwa kuendelea, lakini pamoja na “tena,” umbo hili ni la asili katika Kiswahili.
- source_word: καὶ οἱ Φαρισαῖοι
  choice: Mafarisayo nao
  rationale: “Nao” huhifadhi maana ya καί kwamba Mafarisayo pia walishiriki katika kumuuliza.
- source_word: πῶς ἀνέβλεψεν
  choice: jinsi alivyopata kuona
  rationale: Katika muktadha wa mtu aliyezaliwa kipofu, ἀναβλέπω humaanisha kupata uwezo wa kuona; tafsiri hii haidokezi kimakosa kwamba hapo awali alikuwa ameona.
- source_word: Πηλὸν
  choice: tope
  rationale: πηλός ni tope au udongo laini; “tope” ni neno la kawaida na linafaa katika muktadha huu.
- source_word: ἐπέθηκέν μου ἐπὶ τοὺς ὀφθαλμούς
  choice: Alinipaka tope machoni
  rationale: Ingawa kitenzi kwa msingi ni kuweka juu ya, “kupaka tope machoni” ni Kiswahili cha asili kinachoeleza tendo hilo kwa usahihi.
- source_word: ἐνιψάμην
  choice: nami nikanawa
  rationale: Aoristi ya kati ya νίπτω inaeleza mtu kujiosha; “nikanawa” ni ya asili na hudumisha mfuatano wa matendo.
- source_word: βλέπω
  choice: na sasa ninaona
  rationale: Wakati wa sasa unaonyesha hali yake ya sasa baada ya kuosha; “sasa” huifanya tofauti hiyo iwe wazi bila kubadili maana.
