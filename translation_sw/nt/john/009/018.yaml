  text: Οὐκ ἐπίστευσαν οὖν οἱ Ἰουδαῖοι περὶ αὐτοῦ ὅτι ⸂ἦν τυφλὸς⸃ καὶ ἀνέβλεψεν, ἕως ὅτου ἐφώνησαν τοὺς γονεῖς αὐτοῦ ⸂τοῦ ἀναβλέψαντος⸃
base_translation:
  language: en
  yaml_path: translation/nt/john/009/018.yaml
  text: So the Jews did not believe concerning him that he had been blind and had received sight[a], until they called the parents of the one who had received sight.
translation:
  language: sw
  text: Kwa hiyo, Wayahudi hawakuamini kwamba alikuwa kipofu na alipata kuona[a], mpaka walipowaita wazazi wa yule aliyepata kuona.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au labda, “viongozi wa Wayahudi” au “watu wa Yudea,” kutegemea jinsi usemi wa Yohana “Wayahudi” unavyoeleweka katika muktadha huu.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπίστευσαν
  choice: hawakuamini
  rationale: Kitenzi kinafuatwa na kishazi cha ὅτι kinachoeleza jambo ambalo hawakulikubali kuwa kweli; hivyo ‘hawakuamini’ ni sawia na ya kawaida kuliko ‘hawakumtumaini.’
- source_word: οἱ Ἰουδαῖοι
  choice: Wayahudi
  rationale: Huhifadhi usemi wa Kigiriki bila kuufanya kwa lazima kuwa ‘viongozi wa Wayahudi’ au ‘Wayudea’; maana mahususi inaweza kutegemea muktadha wa simulizi.
- source_word: περὶ αὐτοῦ
  choice: habari zake
  rationale: Ni usemi wa Kiswahili unaoeleza kwamba kutokuamini kwao kulihusu hali na ushuhuda wake.
- source_word: ἦν τυφλὸς
  choice: alikuwa kipofu
  rationale: Huwakilisha imperfect ya Kigiriki moja kwa moja na kwa Kiswahili cha kawaida; mpangilio wa simulizi unaonyesha kuwa hali hiyo ilitangulia kuona kwake.
- source_word: ἀνέβλεψεν
  choice: sasa anaona
  rationale: Katika muktadha wa uponyaji, ἀναβλέπω humaanisha kupata uwezo wa kuona. ‘Sasa anaona’ ni ya asili na haidokezi kwamba lazima aliwahi kuona zamani, kama ambavyo ‘aliona tena’ ingeweza kudokeza.
- source_word: ἕως ὅτου
  choice: mpaka
  rationale: Huonyesha kikomo cha wakati kwa njia ya kawaida katika Kiswahili.
- source_word: ἐφώνησαν
  choice: walipowaita
  rationale: φωνέω hapa ni kuwaita watu waje; ‘walipowaita’ ni sahihi na ya kawaida bila kuongeza nguvu ya kisheria ya ‘kuwaita rasmi.’
- source_word: γονεῖς
  choice: wazazi wake
  rationale: Ni tafsiri ya moja kwa moja na wazi ya γονεῖς, huku kimilikishi kikirejelea mtu aliyeponywa.
- source_word: τοῦ ἀναβλέψαντος
  choice: huyo aliyepata kuona
  rationale: Huhifadhi muundo wa participle yenye kibainishi na kumtambulisha mtu kwa tukio la kupata uwezo wa kuona bila kuongeza nomino isiyokuwamo wazi katika Kigiriki.
theological_decisions:
- issue: Mrejelewa na maana ya οἱ Ἰουδαῖοι katika Yohana
  choice: Wayahudi
  alternative: viongozi wa Wayahudi; Wayudea
  rationale: Maandishi yanasema οἱ Ἰουδαῖοι. Katika Injili ya Yohana usemi huo unaweza kuwa na mrejelewa mwembamba kulingana na muktadha, lakini kuandika ‘viongozi’ katika matini kuu kungeamua jambo ambalo Kigiriki hakisemi wazi. Tanbihi inahifadhi uwezekano huo na kuzuia usemi usieleweke kuwa dai kuhusu Wayahudi wote kwa ujumla.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo umefanywa wa kawaida kwa msomaji wa leo, huku usemi wenye utata οἱ Ἰουδαῖοι ukihifadhiwa katika matini kuu na kufafanuliwa kwa tanbihi.
