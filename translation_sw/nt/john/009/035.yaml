id: JHN.9.35
reference: John 9:35
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ⸀Ἤκουσεν Ἰησοῦς ὅτι ἐξέβαλον αὐτὸν ἔξω, καὶ εὑρὼν αὐτὸν ⸀εἶπεν· Σὺ πιστεύεις εἰς τὸν υἱὸν τοῦ ⸀ἀνθρώπου;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/035.yaml
  text: Jesus heard that they had thrown him out[a], and when he found him, he said, “Do you believe in the Son of Man?”
translation:
  language: sw
  text: Yesu alisikia kwamba walikuwa wamemfukuza nje. Alipompata, akamwambia, “Je, wewe unamwamini Mwana wa Adamu?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati zina “Mwana wa Mungu” badala ya “Mwana wa Adamu.”
    reason: textual_variant
lexical_decisions:
- source_word: ἐξέβαλον ... ἔξω
  choice: walikuwa wamemfukuza nje
  rationale: Muungano huu unasisitiza kufukuzwa na kutengwa; “kumfukuza nje” ni Kiswahili cha kawaida chenye nguvu inayofaa katika muktadha.
- source_word: εὑρὼν
  choice: Alipompata
  rationale: Kirai tegemezi cha wakati kinaonyesha kwa kawaida kwamba Yesu alisema hayo baada ya kumpata.
- source_word: Σὺ πιστεύεις
  choice: Je, wewe unamwamini
  rationale: “Kuamini” pamoja na kiambishi cha yambwa humaanisha kumwamini mtu, na “wewe” kinahifadhi msisitizo wa kiwakilishi cha Kigiriki.
- source_word: εἰς
  choice: -mwamini
  rationale: Baada ya πιστεύω, εἰς huonyesha imani au tumaini linaloelekezwa kwa mtu; Kiswahili huiwasilisha kwa kawaida kwa “kumwamini.”
- source_word: υἱὸν τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  rationale: Hili ndilo jina la cheo lililozoeleka katika Biblia ya Kiswahili, na linahifadhi mwangwi wake wa Danieli 7 pamoja na matumizi yake katika Yohana.
theological_decisions:
- issue: Tofauti ya maandishi kuhusu jina la cheo katika swali
  choice: Mwana wa Adamu
  alternative: Mwana wa Mungu
  rationale: Maandishi ya SBLGNT yana ἀνθρώπου (“Adamu/binadamu”), hivyo yamefuatwa katika matini kuu. Tofauti muhimu ya “Mwana wa Mungu” imehifadhiwa katika tanbihi bila kuamua mvutano wa kimapokeo kimya kimya.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Je, wewe” huhifadhi msisitizo wa Σὺ bila kufanya swali lisikike la kigeni; sentensi zimegawanywa kwa mtiririko wa kawaida.
