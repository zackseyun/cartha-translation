  text: ὁ δὲ ἔφη· Πιστεύω, κύριε· καὶ προσεκύνησεν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/038.yaml
  text: And he said[a], “I believe[b], Lord,” and he worshiped him.
translation:
  language: sw
  text: Naye akasema, “Ninaamini, Bwana[a],” kisha akamwabudu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “bwana.” Neno la Kigiriki κύριε linaweza kuwa namna ya heshima ya kumwita mtu; hapa “Bwana” limependelewa kwa sababu muktadha unafikia kilele katika ungamo la imani na ibada.
    reason: alternative_reading
  - marker: b
    text: Au “akamsujudia” / “akainama mbele yake kwa heshima.” Kitenzi cha Kigiriki kinaweza kumaanisha kusujudu au kutoa heshima; hapa kimetafsiriwa “akamwabudu” kwa kuzingatia muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: Naye
  rationale: Neno ὁ linatumika kiwakilishi kumrejelea mtu aliyeponywa, na δέ ni kiunganishi chepesi cha simulizi; “Naye” ni ya asili katika Kiswahili bila kusisitiza tofauti isiyokuwapo.
- source_word: ἔφη
  choice: akasema
  rationale: Wakati wa aoristi wa φημί ni utangulizi wa kawaida wa maneno ya mhusika; “akasema” linaendeleza simulizi kwa Kiswahili cha kawaida.
- source_word: Πιστεύω
  choice: Ninaamini
  rationale: Hili linahifadhi maana ya moja kwa moja ya πιστεύω na mwangwi wa mada ya kuamini katika Injili ya Yohana.
- source_word: κύριε
  choice: Bwana
  rationale: “Bwana” linaweza kuwa neno la heshima au cheo chenye uzito zaidi; muktadha wa ungamo na tendo linalofuata unapendelea “Bwana,” huku uwezekano wa “bwana” kama heshima ukihifadhiwa katika tanbihi.
- source_word: προσεκύνησεν
  choice: akamwabudu
  rationale: προσκυνέω inaweza kumaanisha kusujudu, kutoa heshima, au kuabudu. Katika muktadha huu—baada ya kumwamini Yesu—“akamwabudu” linafaa zaidi, huku maana nyingine ikiwekwa katika tanbihi.
- source_word: αὐτῷ
  choice: -mw- katika “akamwabudu”
  rationale: Kiwakilishi cha yambwa kinachomrejelea Yesu kimewakilishwa kiasili na kiambishi cha yambwa -mw- katika kitenzi cha Kiswahili.
theological_decisions:
- issue: Ikiwa κύριε ni neno la heshima tu au ni ungamo lenye uzito wa “Bwana”
  choice: Bwana
  alternative: bwana / mheshimiwa
  rationale: Baada ya Yesu kujitambulisha na mtu huyo kusema anaamini, tendo linalofuata linaipa kauli uzito uliozidi heshima ya kawaida. Hata hivyo, utata halisi wa neno la Kigiriki umehifadhiwa katika tanbihi.
- issue: Ikiwa προσεκύνησεν ni kuabudu au kusujudu/kutoa heshima
  choice: akamwabudu
  alternative: akamsujudia / akainama mbele yake kwa heshima
  rationale: Muktadha wa kumwamini Yesu unaunga mkono maana ya kuabudu, lakini kitenzi chenyewe kinaweza pia kueleza kusujudu au kutoa heshima; uwezekano huo haujafichwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ni mfupi na wa asili katika simulizi. “Kisha” linaonyesha mfuatano wa kauli na tendo bila kuongeza uhusiano wa kimantiki usioelezwa.
