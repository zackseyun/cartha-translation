reference: John 9:7
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτῷ· Ὕπαγε νίψαι εἰς τὴν κολυμβήθραν τοῦ Σιλωάμ (ὃ ἑρμηνεύεται Ἀπεσταλμένος). ἀπῆλθεν οὖν καὶ ἐνίψατο, καὶ ἦλθεν βλέπων.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/007.yaml
  text: And he said to him[a], “Go, wash in the pool of Siloam” (which is translated “Sent”). So he went and washed, and came back seeing.
translation:
  language: sw
  text: Akamwambia, “Nenda ukanawe katika bwawa la Siloamu” (jina hilo hutafsiriwa “Aliyetumwa”[a]). Basi akaenda, akanawa, akaja akiwa anaona.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “jina hilo lina maana ya ‘Aliyetumwa.’”
    reason: Njia nyingine ya asili ya kuwasilisha ἑρμηνεύεται kama maelezo ya maana ya jina badala ya kutumia neno “hutafsiriwa.”
lexical_decisions:
- source_word: Ὕπαγε
  choice: Nenda
  rationale: Ni amri ya moja kwa moja ya kwenda, na “Nenda” ni ya kawaida na ya asili katika Kiswahili.
- source_word: νίψαι / ἐνίψατο
  choice: ukanawe / akanawa
  rationale: Kitenzi νίπτω humaanisha kuosha, mara nyingi sehemu ya mwili badala ya kuoga mwili mzima. “Kunawa” kinaeleza tendo hilo kwa Kiswahili cha kawaida bila kuongeza kuwa alioga.
- source_word: εἰς τὴν κολυμβήθραν
  choice: katika bwawa
  rationale: κολυμβήθρα ni bwawa au hifadhi ya maji. Pamoja na tendo la kunawa, “katika bwawa” ni fasaha na hakilazimishi maana kwamba aliingia ndani ya bwawa.
- source_word: Σιλωάμ
  choice: Siloamu
  rationale: Hili ni umbo la kawaida la Kiswahili la jina la mahali, likifuata desturi ya kutohariri maana ya jina ndani ya jina lenyewe.
- source_word: ὃ ἑρμηνεύεται Ἀπεσταλμένος
  choice: jina hilo hutafsiriwa “Aliyetumwa”
  rationale: Kauli hii inahifadhi maelezo ya wazi ya msimulizi kwamba jina Siloamu linatafsiriwa. “Aliyetumwa” hudumisha hali ya kutendwa ya Ἀπεσταλμένος bila kufafanua zaidi ishara yake ya kitheolojia.
- source_word: οὖν
  choice: Basi
  rationale: Hapa οὖν inaendeleza matokeo ya amri katika simulizi; “Basi” ni kiunganishi cha kawaida na chenye mtiririko mzuri.
- source_word: ἀπῆλθεν
  choice: akaenda
  rationale: Ni tendo rahisi la kuondoka au kwenda, nalo linafuata amri ya Yesu kwa mfululizo wa kawaida wa kisimulizi.
- source_word: ἦλθεν βλέπων
  choice: akaja akiwa anaona
  rationale: Tafsiri hii inadumisha kitenzi “akaja” na umbo shirikishi linaloonyesha kwamba sasa alikuwa anaona. Haiongezi wazi dhana ya kurudi, ambayo inaeleweka katika muktadha lakini haijasemwa moja kwa moja na ἦλθεν.
theological_decisions:
- issue: Jinsi ya kutafsiri maelezo ya jina Siloamu bila kuzidisha ishara ya Kiyohana
  choice: Kuweka maelezo “jina hilo hutafsiriwa ‘Aliyetumwa’” ndani ya mstari
  alternative: Kupanua maneno hayo ili kuyaunganisha wazi na Yesu kama aliyetumwa na Baba
  rationale: Maelezo hayo yamo katika Kigiriki na kwa hiyo yanapaswa kubaki katika maandishi. Hata hivyo, mstari wenyewe hausemi wazi uhusiano wa kiishara, hivyo tafsiri haipaswi kuufafanua kwa niaba ya msomaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida wa kisimulizi na hadhi inayofaa maandiko. Mfululizo wa vitenzi “akaenda, akanawa, akaja” unasomeka kwa urahisi huku ukihifadhi mwendo wa sentensi ya Kigiriki.
