  yaml_path: translation/nt/john/009/002.yaml
  text: And his disciples asked him[a], saying, “Rabbi, who sinned, this man or his parents, that he should be born blind?”
translation:
  language: sw
  text: Wanafunzi wake wakamuuliza, “Rabi, ni nani aliyetenda dhambi—mtu huyu au wazazi wake—ili azaliwe kipofu?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kishazi cha Kigiriki kinaweza kueleweka kuwa kinaonyesha kusudi au matokeo ambayo wanafunzi waliudhania katika swali lao.
    reason: alternative_reading
lexical_decisions:
- source_word: ἠρώτησαν
  choice: wakamuuliza
  rationale: Kitenzi hiki kinaeleza swali la kawaida walilomwuliza Yesu; ‘wakamuuliza’ ni usemi wa asili na pia huonyesha tendo lililofuata katika simulizi.
- source_word: μαθηταὶ
  choice: wanafunzi
  rationale: ‘Wanafunzi’ ni istilahi iliyozoeleka kwa wafuasi wanaojifunza chini ya mwalimu na inahifadhi uhusiano huo.
- source_word: λέγοντες
  choice: wakamuuliza, “…”
  rationale: Katika Kiswahili, yaliyomo katika kirai ‘wakisema’ yanaweza kuunganishwa moja kwa moja na kitenzi ‘wakamuuliza’ bila kupoteza maana au mtiririko wa simulizi.
- source_word: Ῥαββί
  choice: Rabi
  rationale: ‘Rabi’ huhifadhi mazingira ya Kiyahudi na ni cheo cha heshima kinachotambulika katika matumizi ya kibiblia ya Kiswahili.
- source_word: τίς
  choice: ni nani
  rationale: Hili ndilo swali la kawaida la Kiswahili linalotaka kumtambua aliyekuwa na hatia.
- source_word: ἥμαρτεν
  choice: aliyetenda dhambi
  rationale: ‘Alitenda dhambi’ huwasilisha moja kwa moja tendo linaloulizwa bila kuongeza uzito usiokuwamo katika Kigiriki.
- source_word: οὗτος
  choice: mtu huyu
  rationale: Neno hilo humrejelea yule mtu kipofu; ‘mtu huyu’ ni wazi na la asili kuliko ‘huyu’ peke yake katika swali hili.
- source_word: γονεῖς
  choice: wazazi
  rationale: Hili ndilo neno la kawaida na sahihi la Kiswahili kwa baba na mama kwa pamoja.
- source_word: ἵνα
  choice: hata
  rationale: Katika muundo ‘hata akazaliwa,’ neno hili linaonyesha uhusiano wa matokeo au kusudi uliodhaniwa na wanafunzi bila kuufanya kuwa kauli ya msimulizi.
- source_word: τυφλὸς
  choice: kipofu
  rationale: ‘Kipofu’ hueleza kwa uwazi hali ya mtu huyo tangu kuzaliwa.
- source_word: γεννηθῇ
  choice: akazaliwa
  rationale: Umbo hili ni la asili katika Kiswahili baada ya ‘hata’ na huonyesha kuzaliwa kwake kama jambo linalohusishwa katika swali na dhambi iliyotajwa.
theological_decisions:
- issue: Maana ya ἵνα katika swali kuhusu dhambi na kuzaliwa kipofu
  choice: hata akazaliwa kipofu
  alternative: ili azaliwe kipofu; ndiyo maana akazaliwa kipofu
  rationale: Tafsiri inadumisha uhusiano wa kusudi au matokeo ambao wanafunzi waliudhania, lakini haiwasilishi dhana yao kana kwamba msimulizi anaithibitisha kuwa fundisho. Tanbihi inaweka wazi uwezekano mwingine wa kisarufi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na heshima inayofaa simulizi la Injili. Mistari mirefu imetenganisha chaguo mbili katika swali ili kurahisisha usomaji; ‘Rabi’ imehifadhiwa kwa ajili ya mazingira ya Kiyahudi.
