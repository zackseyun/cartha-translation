  yaml_path: translation/nt/john/009/032.yaml
  text: From of old it has never been heard that anyone opened the eyes of one born blind[a].
translation:
  language: sw
  text: Tangu zamani, haijawahi kusikika kwamba mtu yeyote amefungua macho ya mtu aliyezaliwa kipofu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Tangu kuumbwa kwa ulimwengu, haijawahi kusikika …”
    reason: Mbadala huu unaonyesha tafsiri ya jadi, iliyo pana zaidi, ya nahau ἐκ τοῦ αἰῶνος.
lexical_decisions:
- source_word: ἐκ τοῦ αἰῶνος
  choice: Tangu zamani
  rationale: Kirai hiki ni nahau ya wakati inayoonyesha kipindi chote cha historia inayokumbukwa. “Tangu zamani” ni Kiswahili cha kawaida na chenye hadhi, bila kuingiza maana ya kimetafizikia ya “tangu milele.”
- source_word: οὐκ ἠκούσθη
  choice: haijapata kusikika
  rationale: Kauli hii hudokeza kwamba jambo kama hilo halijawahi kuripotiwa au kujulikana. Muundo huu unahifadhi hali ya kutendwa ya Kigiriki na kusisitiza kutokuwapo kwa tukio la mfano.
- source_word: ὅτι
  choice: kwamba
  rationale: Neno hili linaanzisha maudhui ya jambo ambalo halijapata kusikika; “kwamba” linaakisi ujenzi huo moja kwa moja na kwa kawaida.
- source_word: ἠνέῳξέν
  choice: amefungua
  rationale: Kitenzi ἀνοίγω pamoja na “macho” humaanisha kuyafungua. “Amefungua” kinadumisha maana ya msingi bila kuongeza dhana ya kurejesha ambayo haijaelezwa moja kwa moja.
- source_word: τις
  choice: mtu yeyote
  rationale: Kiwakilishi kisichodhihirisha mtu maalumu kiko ndani ya dai hasi la jumla; “mtu yeyote” kinafaa katika muktadha huo.
- source_word: ὀφθαλμοὺς
  choice: macho
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa viungo vinavyofunguliwa katika muktadha huu.
- source_word: τυφλοῦ γεγεννημένου
  choice: ya mtu aliyezaliwa kipofu
  rationale: Kirai hiki kinaeleza kwamba mwenye macho hayo alikuwa kipofu tangu kuzaliwa. “Mtu” kinaonyesha nafsi bila kuongeza bayana jinsia ambayo haipaswi kulazimishwa na umbo la kisarufi pekee.
theological_decisions:
- issue: Upeo wa maana ya ἐκ τοῦ αἰῶνος
  choice: 'Nahau ya kihistoria: “Tangu zamani,” yaani katika historia inayokumbukwa'
  alternative: “Tangu ulimwengu uanze” au “tangu milele”
  rationale: Msemaji anatoa dai kuhusu tukio lisilokuwa na mfano katika uzoefu wa wanadamu, si tamko la kimetafizikia kuhusu umilele. Tafsiri kuu inahifadhi nguvu ya dai bila kupanua upeo wake kupita kiasi; mbadala wa jadi umewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, kinachoeleweka na chenye hadhi. Muundo “haijapata kusikika” unafaa kwa madai ya kutokuwapo kwa tukio la mfano, huku “amefungua macho” ukibaki karibu na picha halisi ya Kigiriki.
