base_translation:
  language: en
  yaml_path: translation/nt/john/009/009.yaml
  text: Some were saying[a], “This is he.” Others were saying, “No, but he is like him.” He kept saying, “I am he.”
translation:
  language: sw
  text: Wengine walikuwa wakisema, “Ni yeye.” Wengine nao walikuwa wakisema, “Hapana, ila anafanana naye.” Yeye aliendelea kusema, “Ni mimi.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa karibu zaidi na muundo wa Kigiriki, “Mimi ndiye.” Hapa maana yake ni kujitambulisha kwa kawaida: mtu huyo anasema kwamba yeye ndiye wanayemjadili.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλοι … ἄλλοι
  choice: Wengine … Wengine nao
  rationale: Maneno haya yanatofautisha makundi mawili katika umati. Neno “nao” linafanya utofautishaji huo uwe wazi na wa kawaida katika Kiswahili.
- source_word: ἔλεγον
  choice: walikuwa wakisema
  rationale: Wakati usiotimilika wa Kigiriki unaonyesha mazungumzo yaliyokuwa yakiendelea au kauli zilizorudiwa.
- source_word: Οὗτός ἐστιν
  choice: Ni yeye
  rationale: Hii ni kauli fupi ya kumtambua mtu. Kiswahili cha kawaida husema “Ni yeye” badala ya tafsiri ngumu ya neno kwa neno “Huyu ndiye.”
- source_word: Οὐχί, ἀλλὰ
  choice: Hapana, ila
  rationale: “Hapana” inatoa uk否 wa moja kwa moja, na “ila” inaonyesha tofauti kati ya kumtambua mtu huyo na kusema kwamba anafanana tu naye.
- source_word: ὅμοιος αὐτῷ ἐστιν
  choice: anafanana naye
  rationale: Kauli hii inaonyesha kufanana, si kuwa mtu yuleyule.
- source_word: ἐκεῖνος ἔλεγεν
  choice: yeye aliendelea kusema
  rationale: Kiwakilishi kinamrejelea mtu aliyekuwa anajadiliwa, na wakati usiotimilika unaonyesha kwamba aliendelea kusisitiza jibu lake.
- source_word: Ἐγώ εἰμι
  choice: Ni mimi
  rationale: Katika muktadha huu, maneno hayo ni ya kujitambulisha kwa kawaida. “Ni mimi” ni Kiswahili cha asili na kinaonyesha kwamba yeye ndiye mtu wanayemjadili.
theological_decisions:
- issue: Tafsiri ya Ἐγώ εἰμι katika Injili ya Yohana
  choice: Ni mimi
  alternative: Mimi niko
  rationale: Ingawa maneno ἐγώ εἰμι yanaweza kuwa na uzito wa pekee katika sehemu nyingine za Yohana, hapa yanasemwa na mtu aliyeponywa ili kuthibitisha utambulisho wake. Tafsiri haileti dai la Kikristo ambalo muktadha huu haulitoi, huku tanbihi ikihifadhi muundo wa Kigiriki.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa mazungumzo umewekwa wazi bila kuwa mgumu; hali ya kuendelea ya vitenzi vya Kigiriki imehifadhiwa kwa “walikuwa wakisema” na “aliendelea kusema.”
