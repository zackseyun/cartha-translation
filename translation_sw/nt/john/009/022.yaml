id: JHN.9.22
reference: John 9:22
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ταῦτα εἶπαν οἱ γονεῖς αὐτοῦ ὅτι ἐφοβοῦντο τοὺς Ἰουδαίους, ἤδη γὰρ συνετέθειντο οἱ Ἰουδαῖοι ἵνα ἐάν τις αὐτὸν ὁμολογήσῃ χριστόν, ἀποσυνάγωγος γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/022.yaml
  text: His parents said these things because they were afraid of the Jews[a], for the Jews had already agreed that if anyone confessed him as the Messiah[b], he would be put out of the synagogue.
translation:
  language: sw
  text: Wazazi wake walisema mambo hayo kwa sababu waliwaogopa Wayahudi[a], kwa maana Wayahudi walikuwa wamekwisha kukubaliana kwamba mtu yeyote akimkiri kuwa ndiye Masihi[b], atengwe na sinagogi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kigiriki: “Wayahudi.” Katika muktadha huu, huenda neno hilo linarejelea wenye mamlaka miongoni mwa Wayahudi, wala si Wayahudi wote bila ubaguzi.'
    reason: cultural_note
  - marker: b
    text: Au “kuwa ndiye Kristo” au “kuwa yeye ni Kristo.”
    reason: alternative_reading
lexical_decisions:
- source_word: ταῦτα
  choice: mambo hayo
  rationale: Kiwakilishi cha wingi kinarejelea kauli zilizotangulia za wazazi; “mambo hayo” ni Kiswahili cha kawaida na huhifadhi wingi huo.
- source_word: οἱ γονεῖς αὐτοῦ
  choice: wazazi wake
  rationale: Hii ndiyo tafsiri ya kawaida na ya moja kwa moja ya kirai hiki.
- source_word: ὅτι ἐφοβοῦντο
  choice: kwa sababu waliwaogopa
  rationale: ὅτι inaeleza sababu, na kitenzi cha wakati usiotimilifu kinaonyesha hofu iliyokuwapo wakati huo.
- source_word: τοὺς Ἰουδαίους / οἱ Ἰουδαῖοι
  choice: Wayahudi
  rationale: Huhifadhi istilahi pana ya Kigiriki; tanbihi inafafanua kuwa katika muktadha huu huenda inawahusu wenye mamlaka miongoni mwa Wayahudi.
- source_word: ἤδη ... συνετέθειντο
  choice: walikuwa wamekwisha kukubaliana
  rationale: Huhifadhi tendo lililokuwa limefanyika kabla ya tukio hili pamoja na wazo la makubaliano yaliyofikiwa.
- source_word: ἐάν τις
  choice: mtu yeyote aki-
  rationale: Muundo huu wa Kiswahili huwasilisha kwa kawaida sharti lisilomhusu mtu maalumu.
- source_word: αὐτὸν ὁμολογήσῃ χριστόν
  choice: akimkiri kuwa ndiye Masihi
  rationale: “Kumkiri” huonyesha kukiri au kutambua hadharani, na “kuwa ndiye Masihi” huwasilisha Χριστός kama cheo.
- source_word: ἀποσυνάγωγος γένηται
  choice: atengwe na sinagogi
  rationale: Hueleza kunyimwa ushirika au kufukuzwa katika jumuiya ya sinagogi bila kuongeza maelezo yasiyomo katika mstari.
theological_decisions:
- issue: Maana ya Χριστός
  choice: Masihi
  alternative: Kristo; ndiye Kristo
  rationale: Katika mstari huu neno hilo ni cheo cha yule aliyetiwa mafuta, si jina tu; “Masihi” huhifadhi mazingira ya Kiyahudi ya dai hilo.
- issue: Wanaorejelewa na οἱ Ἰουδαῖοι katika Yohana
  choice: Wayahudi, pamoja na tanbihi ya kimuktadha
  alternative: viongozi wa Wayahudi; Wayudea
  rationale: Neno la Kigiriki linaweza kuwa pana au finyu kutegemea muktadha. Matini kuu huhifadhi upana wake, huku tanbihi ikionyesha kwamba hapa huenda linarejelea hasa wenye mamlaka walioweza kutenga watu na sinagogi.
- issue: Maana ya ἀποσυνάγωγος
  choice: atengwe na sinagogi
  alternative: afukuzwe katika sinagogi; anyimwe ushirika wa sinagogi
  rationale: “Atengwe na sinagogi” huhifadhi maana ya kutengwa na jumuiya bila kuamua kwa undani utaratibu au kiwango cha adhabu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi ya kisimulizi. “Walikuwa wamekwisha kukubaliana” huonyesha tendo lililotangulia, na “sinagogi” huhifadhi istilahi ya mazingira ya Kiyahudi.
