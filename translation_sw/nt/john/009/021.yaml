  text: πῶς δὲ νῦν βλέπει οὐκ οἴδαμεν, ἢ τίς ἤνοιξεν αὐτοῦ τοὺς ὀφθαλμοὺς ἡμεῖς οὐκ οἴδαμεν· ⸂αὐτὸν ἐρωτήσατε, ἡλικίαν ἔχει⸃, αὐτὸς περὶ ἑαυτοῦ λαλήσει.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/021.yaml
  text: But how he now sees[a], we do not know; or who opened his eyes, we do not know. Ask him; he is of age. He will speak for himself.
translation:
  language: sw
  text: Lakini jinsi anavyoona sasa, hatujui; au ni nani aliyefungua macho yake, hatujui. Muulizeni yeye; ana umri wa kutosha. Yeye mwenyewe atajisemea.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Anaweza kujisemea.” Wakati ujao katika Kigiriki unaweza kutumika hapa kama dai la kawaida kwamba ana uwezo au wajibu wa kujibu mwenyewe.
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς δὲ νῦν βλέπει
  choice: Lakini jinsi anavyoona sasa
  rationale: “Jinsi” huwasilisha swali la namna katika πῶς, “lakini” huonyesha nguvu nyepesi ya utofautishaji ya δέ, na “anavyoona sasa” huhifadhi wakati wa sasa wa βλέπει bila kuongeza wazo la uwezo.
- source_word: οὐκ οἴδαμεν
  choice: hatujui
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya οὐκ οἴδαμεν. Kurudiwa kwake kumehifadhiwa ili kudumisha msisitizo wa ushuhuda wa wazazi.
- source_word: ἢ τίς ἤνοιξεν αὐτοῦ τοὺς ὀφθαλμούς
  choice: wala ni nani aliyefungua macho yake
  rationale: “Aliyefungua macho yake” huhifadhi nahau ya simulizi na uhusiano wake na tendo la kuponywa. “Wala” huunganisha jambo la pili ambalo wazazi wanadai kutolijua.
- source_word: αὐτὸν ἐρωτήσατε
  choice: Muulizeni yeye
  rationale: Kitenzi ni agizo kwa wingi. “Muulizeni” ni Kiswahili cha kawaida, na “yeye” huhifadhi msisitizo wa kumwelekeza mhusika mwenyewe.
- source_word: ἡλικίαν ἔχει
  choice: ana umri wa kutosha
  rationale: Katika muktadha huu, ἡλικίαν ἔχει humaanisha kwamba ana umri unaomwezesha kujibu kwa niaba yake mwenyewe. Usemi huu ni wa kawaida na hauelekezi kimakosa kwenye kimo cha mwili.
- source_word: αὐτὸς περὶ ἑαυτοῦ λαλήσει
  choice: Yeye mwenyewe atajisemea
  rationale: “Yeye mwenyewe” huhifadhi msisitizo wa αὐτός, na “atajisemea” huwasilisha wakati ujao wa λαλήσει pamoja na maana ya kusema kwa niaba yake mwenyewe.
theological_decisions:
- issue: Maana ya ἡλικίαν ἔχει katika muktadha
  choice: Ana umri wa kutosha kujibu mwenyewe
  alternative: Ni mtu mzima; au ana ukomavu
  rationale: Muktadha ni wa kuhojiwa na wa ushuhuda. Wazazi wanawaelekeza waulizaji kwa mwana wao kwa sababu anaweza kuwajibika kwa jibu lake mwenyewe; hakuna msingi wa kuelewa neno hili kama kimo cha mwili.
- issue: Nguvu ya αὐτὸς περὶ ἑαυτοῦ λαλήσει
  choice: Yeye mwenyewe atajisemea
  alternative: Anaweza kujisemea mwenyewe
  rationale: Tafsiri kuu huhifadhi umbo la wakati ujao la Kigiriki na msisitizo wa mhusika mwenyewe, huku tanbihi ikihifadhi uwezekano wa kulielewa kama dai la uwezo au wajibu wa kujibu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi na chenye heshima. Kurudiwa kwa “hatujui” kumehifadhiwa kwa sababu ni sehemu ya msisitizo wa chanzo. Alama ya tanbihi imewekwa baada ya kishazi kinachohusika moja kwa moja na mbadala wake.
