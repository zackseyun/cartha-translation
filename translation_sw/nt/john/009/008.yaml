  text: οἱ οὖν γείτονες καὶ οἱ θεωροῦντες αὐτὸν τὸ πρότερον ὅτι ⸀προσαίτης ἦν ἔλεγον· Οὐχ οὗτός ἐστιν ὁ καθήμενος καὶ προσαιτῶν;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/008.yaml
  text: So the neighbors[a], and those who had seen him before as a beggar, were saying, “Is this not the man who used to sit and beg?”
translation:
  language: sw
  text: Kwa hiyo, majirani zake na wale waliokuwa wamemwona zamani akiwa mwombaji walikuwa wakisema, “Je, huyu si yule aliyekuwa akiketi na kuombaomba?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Inaendeleza simulizi kwa kuonyesha uhusiano na tukio lililotangulia bila kuongeza hitimisho lisilokuwamo.
- source_word: γείτονες
  choice: majirani zake
  rationale: Ni tafsiri ya kawaida na ya moja kwa moja kwa watu walioishi karibu naye; kiwakilishi cha umilikaji kinaeleweka kutokana na muktadha.
- source_word: θεωροῦντες αὐτὸν τὸ πρότερον
  choice: waliokuwa wamemwona zamani
  rationale: Muundo huu unaonyesha watu waliomwona katika wakati uliopita, labda mara kwa mara, na hivyo waliweza kumtambua.
- source_word: ὅτι προσαίτης ἦν
  choice: akiwa mwombaji
  rationale: Huhifadhi maana ya hali au utambulisho wake wa zamani bila kulazimisha ὅτι kuwa sababu.
- source_word: ἔλεγον
  choice: walikuwa wakisema
  rationale: Huhifadhi hali endelevu au inayorudiwa ya kitenzi cha wakati usiotimilika.
- source_word: Οὐχ οὗτός ἐστιν
  choice: Je, huyu si yule
  rationale: Swali hili linatarajia jibu la kukubali na linasikika la kawaida katika Kiswahili sanifu.
- source_word: ὁ καθήμενος καὶ προσαιτῶν
  choice: aliyekuwa akiketi na kuombaomba
  rationale: Vitenzi endelevu vinamtambulisha kwa shughuli yake ya kawaida ya zamani; ‘kuombaomba’ hutofautisha kuomba sadaka na kuomba kwa maana pana.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa sentensi unafuata simulizi kwa urahisi huku ukihifadhi hali endelevu ya ἔλεγον na shughuli ya kawaida iliyoonyeshwa na participles.
