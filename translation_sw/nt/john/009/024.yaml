  text: Ἐφώνησαν οὖν ⸂τὸν ἄνθρωπον ἐκ δευτέρου⸃ ὃς ἦν τυφλὸς καὶ εἶπαν αὐτῷ· Δὸς δόξαν τῷ θεῷ· ἡμεῖς οἴδαμεν ὅτι ⸂οὗτος ὁ ἄνθρωπος⸃ ἁμαρτωλός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/024.yaml
  text: So they called the man who had been blind a second time and said to him[a], “Give glory to God; we know that this man is a sinner.”
translation:
  language: sw
  text: Basi wakamwita kwa mara ya pili mtu aliyekuwa kipofu, wakamwambia, “Mpe Mungu utukufu[a]. Sisi tunajua kwamba mtu huyu ni mwenye dhambi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au huenda hii ni nahau ya kumwapisha mtu: “Mpe Mungu utukufu,” yaani, “Sema kweli mbele za Mungu” au “Kiri wazi mbele za Mungu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐφώνησαν
  choice: wakamwita
  rationale: Katika muktadha huu φωνέω inaonyesha kuwa viongozi walimwita mtu huyo arudi mbele yao. “Wakamwita” ni Kiswahili cha kawaida na hakiongezi wazo la mamlaka rasmi ambalo lingeweza kudokezwa na “wakamwagiza afike.”
- source_word: οὖν
  choice: Basi
  rationale: οὖν inaunganisha tukio hili na majibizano yaliyotangulia na pia kuendeleza simulizi; “Basi” hubeba kazi hiyo kwa Kiswahili cha asili.
- source_word: ἐκ δευτέρου
  choice: tena
  rationale: Nahau hii inamaanisha “kwa mara ya pili.” “Tena” ni ya asili na fupi katika mfuatano huu, huku ikionyesha kurudiwa kwa tendo.
- source_word: ὃς ἦν τυφλός
  choice: aliyekuwa kipofu
  rationale: Kauli hii inaeleza hali yake ya zamani; umbo “aliyekuwa” linaonyesha kwamba sasa ameponywa bila kudai kuwa bado ni kipofu.
- source_word: Δὸς δόξαν τῷ θεῷ
  choice: Mpe Mungu utukufu
  rationale: Tafsiri hii inahifadhi maneno ya moja kwa moja ya Kigiriki, huku maana inayowezekana ya kiapo cha kusema kweli ikielezwa katika tanbihi.
- source_word: ἡμεῖς οἴδαμεν
  choice: Sisi tunajua
  rationale: Kutaja “Sisi” wazi kunahifadhi mkazo wa kiwakilishi ἡμεῖς na msisitizo wa madai yao ya uhakika.
- source_word: οὗτος ὁ ἄνθρωπος
  choice: mtu huyu
  rationale: “Mtu huyu” ni tafsiri ya kawaida isiyoongeza dharau ambayo haijawekwa wazi katika Kigiriki.
- source_word: ἁμαρτωλός
  choice: mwenye dhambi
  rationale: Katika nafasi ya kiarifu, “mwenye dhambi” huwasilisha shtaka kwamba mtu huyo ni mtenda dhambi, kwa lugha ya Kiswahili iliyo wazi na yenye heshima.
theological_decisions:
- issue: Maana ya kinahau ya Δὸς δόξαν τῷ θεῷ
  choice: Kuhifadhi maneno ya moja kwa moja “Mpe Mungu utukufu” katika andiko kuu
  alternative: Kutafsiri maana inayodhaniwa moja kwa moja, kama “Sema kweli mbele za Mungu” au “Kiri wazi mbele za Mungu”
  rationale: Kauli hii huenda ni agizo zito la kusema kweli au kukiri, lakini maneno yake yenyewe yanamhusu Mungu kupewa utukufu. Tafsiri kuu inahifadhi mvutano huo, na tanbihi inaonyesha maana ya kinahau bila kuifanya kuwa tafsiri pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi na chenye hadhi. Muundo wa simulizi ni wa asili, huku mkazo wa “Sisi” na utata wa kauli kuhusu kumpa Mungu utukufu vikihifadhiwa.
