id: JHN.9.16
reference: John 9:16
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἔλεγον οὖν ἐκ τῶν Φαρισαίων τινές· ⸂Οὐκ ἔστιν οὗτος παρὰ θεοῦ ὁ ἄνθρωπος⸃, ὅτι τὸ σάββατον οὐ τηρεῖ. ⸀ἄλλοι ἔλεγον· Πῶς δύναται ἄνθρωπος ἁμαρτωλὸς τοιαῦτα σημεῖα ποιεῖν; καὶ σχίσμα ἦν ἐν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/016.yaml
  text: So some of the Pharisees were saying[a], “This man is not from God, because he does not keep the Sabbath.” But others were saying[b], “How can a sinful man do such signs?” And there was a division among them.
translation:
  language: sw
  text: Basi baadhi ya Mafarisayo walikuwa wakisema, “Mtu huyu hatoki kwa Mungu, kwa sababu haishiki Sabato.” Lakini wengine walikuwa wakisema, “Mtu mwenye dhambi anawezaje kufanya ishara kama hizi[a]?” Kukawa na mgawanyiko kati yao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “ishara za kimuujiza.” Katika Injili ya Yohana, “ishara” ni matendo yenye maana inayofunua zaidi ya tendo lenyewe.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον ... τινές
  choice: baadhi ... walikuwa wakisema
  rationale: Wakati usiotimilika wa ἔλεγον unaonyesha usemi uliokuwa ukiendelea katika tukio; ‘baadhi’ ni tafsiri ya kawaida ya τινές.
- source_word: οὖν
  choice: Basi
  rationale: ‘Basi’ huendeleza hoja au simulizi kwa njia ya kawaida na yenye hadhi katika Kiswahili.
- source_word: ἐκ τῶν Φαρισαίων
  choice: baadhi ya Mafarisayo
  rationale: Huwatambulisha wasemaji kuwa kikundi fulani miongoni mwa Mafarisayo.
- source_word: οὗτος ... ὁ ἄνθρωπος
  choice: Mtu huyu
  rationale: Huhifadhi rejeo la moja kwa moja kwa mwanamume huyu bila kuongeza dharau isiyo wazi katika Kigiriki.
- source_word: παρὰ θεοῦ
  choice: hatoki kwa Mungu
  rationale: Kirai kinaonyesha asili au chanzo; ‘kutoka kwa Mungu’ hakiongezi wazo mahususi zaidi la kutumwa.
- source_word: τηρεῖ τὸ σάββατον
  choice: haishiki Sabato
  rationale: ‘Kushika Sabato’ ni usemi wa kawaida wa kutii au kuadhimisha masharti yake.
- source_word: Πῶς δύναται
  choice: anawezaje
  rationale: Huhifadhi swali kuhusu uwezo au uwezekano kwa Kiswahili cha kawaida.
- source_word: ἄνθρωπος ἁμαρτωλὸς
  choice: mtu mwenye dhambi
  rationale: Huhifadhi muundo wa Kigiriki ambamo kivumishi kinamwelezea mtu, bila kuubadili kuwa tu nomino ‘mtenda dhambi.’
- source_word: τοιαῦτα σημεῖα
  choice: ishara kama hizi
  rationale: ‘Ishara’ huhifadhi maana ya σημεῖα katika Yohana, huku ‘kama hizi’ ikiwakilisha τοιαῦτα kwa lugha ya kawaida.
- source_word: σχίσμα
  choice: mgawanyiko
  rationale: Neno hili linaonyesha hali ya kutokubaliana iliyowatenganisha, bila kutumia lugha ya mazungumzo kupita kiasi.
theological_decisions:
- issue: Maana ya σημεῖα katika Yohana
  choice: ishara
  alternative: miujiza; ishara za kimuujiza
  rationale: Yohana hutumia ‘ishara’ kwa matendo yanayoelekeza kwenye maana inayofunua zaidi ya tendo lenyewe. Tafsiri hii haififishi uzito huo kuwa ‘miujiza’ pekee.
- issue: Kauli kwamba Yesu anatoka kwa Mungu
  choice: hatoki kwa Mungu
  alternative: hajatumwa na Mungu
  rationale: Kigiriki kinataja chanzo au asili. ‘Hajatumwa na Mungu’ kingeongeza kwa uwazi zaidi wazo la utume ambalo halijatajwa katika kirai hiki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, ya kawaida na yenye hadhi. Miundo ya wakati uliopita unaoendelea imetumiwa kwa semi za pande zote mbili, na ‘Kukawa’ huhifadhi mwendo wa simulizi kwa ufupi.
