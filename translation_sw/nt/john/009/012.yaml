  text: ⸂καὶ εἶπαν⸃ αὐτῷ· Ποῦ ἐστιν ἐκεῖνος; λέγει· Οὐκ οἶδα.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/012.yaml
  text: And they said to him[a], “Where is that man?” He says, “I do not know.”
translation:
  language: sw
  text: Wakamwambia, “Yuko wapi huyo mtu[a]?” Akasema, “Sijui.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yuko wapi huyo?” Kigiriki kina neno la kuonyesha linaloweza kutafsiriwa bila kuongeza neno “mtu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Wa-
  rationale: Kiunganishi hiki kimeunganishwa kwa kawaida na kitenzi katika “Wakamwambia,” kikidumisha mwendelezo wa simulizi bila kuongeza maana ya sababu au matokeo.
- source_word: εἶπαν αὐτῷ
  choice: wakamwambia
  rationale: Huwasilisha kwa Kiswahili cha kawaida tendo la kusema kwa mtu aliyeponywa; ingawa maneno yenyewe ni swali, tafsiri haibadili kitenzi kuwa “wakauliza.”
- source_word: Ποῦ ἐστιν
  choice: Yuko wapi
  rationale: “Yuko” hutumiwa kwa mtu na huunda swali la mahali kwa njia ya kawaida na wazi.
- source_word: ἐκεῖνος
  choice: huyo mtu
  rationale: Kiwakilishi cha kuonyesha kimetafsiriwa kwa namna ya kawaida inayohifadhi rejeleo lenye umbali fulani; “mtu” inaeleweka kutokana na muktadha kuwa ni Yesu.
- source_word: λέγει
  choice: Akasema
  rationale: Wakati uliopo wa kihistoria wa Kigiriki umetafsiriwa kwa wakati wa simulizi wa Kiswahili, ambao ni wa asili zaidi hapa bila kubadili mfuatano wa tukio.
- source_word: Οὐκ οἶδα
  choice: Sijui
  rationale: Ni tafsiri fupi, ya moja kwa moja, na ya kawaida ya kauli hii.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima, na rahisi kueleweka. “Wakamwambia” na “akasema” zinafuata mtiririko wa kawaida wa simulizi la Kiswahili, huku tanbihi ikihifadhi uwezekano wa kutafsiri ἐκεῖνος bila nomino iliyoongezwa.
