  yaml_path: translation/nt/john/009/013.yaml
  text: They brought the man who had formerly been blind to the Pharisees[a].
translation:
  language: sw
  text: Wakamleta kwa Mafarisayo yule mtu aliyekuwa kipofu hapo awali.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄγουσιν
  choice: Wakamleta
  rationale: Wakati uliopo wa Kigiriki umetumiwa kama wakati uliopo wa kihistoria; wakati uliopita wa kisimulizi ni wa asili zaidi katika Kiswahili. Kitenzi hiki pia kinadokeza kumpeleka mtu kwa wengine.
- source_word: αὐτὸν
  choice: -m- katika “Wakamleta”
  rationale: Kiwakilishi cha yambwa ‘yeye’ kinawakilishwa kwa kiambishi cha yambwa -m- kwa mujibu wa sarufi ya Kiswahili.
- source_word: πρὸς τοὺς Φαρισαίους
  choice: kwa Mafarisayo
  rationale: πρός pamoja na hali ya accusative hapa huonyesha kuelekea kwa watu; ‘kwa Mafarisayo’ ni tafsiri ya kawaida isiyoongeza wazo la kushtakiwa mbele yao.
- source_word: Φαρισαίους
  choice: Mafarisayo
  rationale: Hili ndilo umbo la kawaida la Kiswahili la jina la kundi hili.
- source_word: τὸν ποτε τυφλόν
  choice: yule mtu aliyekuwa kipofu hapo awali
  rationale: Kirai hiki kinatumika kama nomino na humtambulisha mtu kwa hali yake ya zamani, huku kikidokeza kwamba sasa si kipofu.
- source_word: ποτε
  choice: hapo awali
  rationale: Katika muktadha huu neno lina maana ya hali ya zamani, si ‘wakati fulani’ usiojulikana.
- source_word: τυφλόν
  choice: kipofu
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya hali ya kutoweza kuona.
