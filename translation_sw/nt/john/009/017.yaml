  text: λέγουσιν ⸀οὖν τῷ τυφλῷ πάλιν· ⸂Τί σὺ⸃ λέγεις περὶ αὐτοῦ, ὅτι ἠνέῳξέν σου τοὺς ὀφθαλμούς; ὁ δὲ εἶπεν ὅτι Προφήτης ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/017.yaml
  text: So they said again to the blind man[a], “What do you say about him, since he opened your eyes?” And he said[c][b], “He is a prophet.”
translation:
  language: sw
  text: Kwa hiyo wakamwuliza tena yule kipofu, “Wewe[a] unasema nini kumhusu, kwa kuwa[b] alifungua macho yako?” Naye akasema, “Yeye ni nabii.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wewe mwenyewe unasema nini kumhusu?” Kiyunani hutaja wazi “wewe” kwa msisitizo.
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa sababu alifungua macho yako.”
    reason: lexical_alternative
  - marker: c
    text: Au, “Yeye ni Nabii.” Kiyunani kinaweza kusomwa kama cheo zaidi, lakini muktadha pia unaunga mkono maana “nabii.”
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Inaonyesha mwendelezo wenye hitimisho kutoka katika mazungumzo yaliyotangulia; ni ya kawaida na inaeleweka katika Kiswahili sanifu.
- source_word: τῷ τυφλῷ
  choice: yule kipofu
  rationale: Kivumishi cha Kiyunani kimetumiwa kama nomino. ‘Yule kipofu’ ni kifupi na cha kawaida, bila kuingiza wazi wazo la ‘aliyekuwa kipofu’ ambalo halijasemwa katika kishazi hiki.
- source_word: πάλιν
  choice: tena
  rationale: Inadumisha maana ya kurudiwa kwa swali katika uchunguzi unaoendelea.
- source_word: Τί σὺ λέγεις
  choice: Wewe unasema nini
  rationale: Kiwakilishi σὺ kimetajwa wazi kwa msisitizo; kuweka ‘wewe’ kunahifadhi msisitizo huo kwa Kiswahili cha kawaida.
- source_word: περὶ αὐτοῦ
  choice: kumhusu
  rationale: Ni tafsiri ya kawaida na fupi ya περί pamoja na jenitivi katika muktadha huu.
- source_word: ὅτι
  choice: kwa kuwa
  rationale: Hapa ὅτι inaelekea kutaja msingi au sababu ya swali. ‘Kwa kuwa’ huhifadhi uhusiano huo bila kuufanya kuwa maelezo ya mbali.
- source_word: ἠνέῳξέν σου τοὺς ὀφθαλμούς
  choice: amefungua macho yako
  rationale: Timilifu ya Kiswahili huonyesha tendo lililokamilika ambalo matokeo yake yanaonekana katika hali ya sasa ya mtu huyo; taswira ya kufungua macho imehifadhiwa.
- source_word: Προφήτης ἐστίν
  choice: Yeye ni nabii
  rationale: 'Nomino isiyo na kibainishi katika nafasi ya kiarifu inafaa kueleweka hapa kama utambulisho wa jumla: mmoja wa manabii, bila kulazimisha cheo maalumu.'
theological_decisions:
- issue: Iwapo Προφήτης itafsiriwe kama cheo maalumu au nomino ya kawaida
  choice: Yeye ni nabii
  alternative: Yeye ndiye Nabii
  rationale: Muktadha unaonyesha hatua ya mwanzo katika tathmini ya mtu aliyeponywa kumhusu Yesu. ‘Nabii’ huhifadhi maendeleo hayo ya simulizi na haingizi dai mahususi la kimasiya lisilolazimishwa na Kiyunani.
- issue: Uhusiano unaoletwa na ὅτι
  choice: kwa kuwa amefungua macho yako
  alternative: kwamba amefungua macho yako
  rationale: '‘Kwa kuwa’ huwasilisha usomaji wa kisababishi unaofaa zaidi: wanamtaka atoe tathmini kumhusu Yesu kwa msingi wa tendo hilo. ‘Kwamba’ linawezekana kisarufi lakini haliko wazi sana katika Kiswahili hiki.'
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo unabaki karibu na simulizi la Kiyunani huku ‘wewe’ ikihifadhi msisitizo wa σὺ. Hakuna tanbihi iliyohitajika, kwa kuwa tofauti kuu zimewasilishwa wazi katika uchaguzi wa maneno na hazileti utata unaohitaji alama katika matini.
