  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ⸀οἴδαμεν ὅτι ⸂ἁμαρτωλῶν ὁ θεὸς⸃ οὐκ ἀκούει, ἀλλ’ ἐάν τις θεοσεβὴς ᾖ καὶ τὸ θέλημα αὐτοῦ ποιῇ τούτου ἀκούει.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/031.yaml
  text: We know that God does not listen to sinners; but if anyone is God-fearing and does his will[a], he listens to him.
translation:
  language: sw
  text: Tunajua kwamba Mungu hawasikilizi wadhambi; lakini mtu akiwa mcha Mungu[a] na kutenda mapenzi yake, Mungu humsikiliza mtu huyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “anayemwabudu Mungu.”
    reason: Neno θεοσεβής linaweza kutafsiriwa kama mtu anayemcha Mungu au anayemwabudu Mungu; tanbihi inadumisha uwezekano huu wa kileksika.
lexical_decisions:
- source_word: οἴδαμεν
  choice: Tunajua
  rationale: Ingawa οἶδα ina umbo la wakati timilifu, katika Kiyunani cha Koine ina maana ya wakati uliopo; “Tunajua” ni Kiswahili cha kawaida na sahihi.
- source_word: ἁμαρτωλῶν
  choice: wadhambi
  rationale: Nomino hii ya wingi inataja kundi la watu wenye dhambi. “Wadhambi” ni fupi, wazi, na inadumisha uzito wa kimaadili na kidini wa neno la asili.
- source_word: ἀκούει
  choice: hawasikilizi / humsikiliza
  rationale: Katika muktadha huu, ἀκούω haimaanishi kusikia sauti tu, bali kumsikiliza mtu kwa kumjali au kumwitikia. “Kusikiliza” inadumisha maana hiyo bila kuifafanua zaidi kuwa “kujibu.”
- source_word: θεοσεβὴς
  choice: mcha Mungu
  rationale: θεοσεβής humaanisha mtu anayemheshimu na kumcha Mungu. “Mcha Mungu” ni usemi wa kawaida, wenye staha, unaotaja Mungu waziwazi na usiopunguza maana kuwa ibada ya kidini pekee.
- source_word: τὸ θέλημα αὐτοῦ ποιῇ
  choice: kutenda mapenzi yake
  rationale: Huu ni ulinganifu wa kawaida na wa asili wa nahau ποιεῖν τὸ θέλημα, huku ukidumisha maana ya kufanya yale Mungu anayotaka.
- source_word: τούτου ἀκούει
  choice: Mungu humsikiliza mtu huyo
  rationale: τούτου inamrejelea kwa mkazo mtu mcha Mungu anayefanya mapenzi ya Mungu. Kurudia “Mungu” kunaondoa utata wa viwakilishi katika Kiswahili, na “mtu huyo” inadumisha mkazo wa rejeleo hilo.
- source_word: ἀλλ’ ἐάν τις
  choice: lakini mtu akiwa
  rationale: Maneno haya yanaanzisha hali yenye utofauti. “Lakini mtu akiwa” ni Kiswahili cha asili kinachodumisha maana ya mtu yeyote bila kulazimika kuongeza neno jingine.
theological_decisions:
- issue: Upeo wa kauli “Mungu hawasikilizi wadhambi”
  choice: Kauli imetafsiriwa kama ilivyosemwa, bila kuipunguza makali wala kuifanya kuwa mfumo mpana wa mafundisho.
  alternative: Mungu hasikii maombi ya wadhambi; au Mungu hawakubali wadhambi.
  rationale: Kiyunani kinasema tu kwamba Mungu “hawasikilizi” wadhambi, kinyume na kumsikiliza mtu mcha Mungu atendaye mapenzi yake. Tafsiri inadumisha mvutano wa kauli ya msemaji katika muktadha bila kuingiza dai kuhusu kila namna ambayo Mungu anaweza kusikia, kujua, au kuitikia wadhambi.
- issue: Maana ya θεοσεβής
  choice: mcha Mungu
  alternative: anayemwabudu Mungu
  rationale: Neno linaweza kuashiria mtu anayemwabudu Mungu, lakini “mcha Mungu” inadumisha vizuri zaidi maana pana ya kumheshimu na kumcha Mungu. Tafsiri mbadala imehifadhiwa katika tanbihi.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi, na chenye staha. Muundo “Mungu hawasikilizi wadhambi” ni sahihi: kiambishi “ha-” kinaonyesha ukanushi wa kiima, na “-wa-” ni kiambishi cha yambwa kinachowarejelea wadhambi. Neno “Mungu” limerudiwa katika kishazi cha mwisho ili kuepusha utata wa nani anayemsikiliza nani.'
