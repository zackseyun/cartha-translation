  text: ⸀ἡμᾶς δεῖ ἐργάζεσθαι τὰ ἔργα τοῦ πέμψαντός με ἕως ἡμέρα ἐστίν· ἔρχεται νὺξ ὅτε οὐδεὶς δύναται ἐργάζεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/004.yaml
  text: We must do the works of the one who sent me while it is day; night is coming[a], when no one can work.
translation:
  language: sw
  text: Imetupasa kuyatenda matendo ya yule aliyenituma maadamu ni mchana; usiku unakuja[a], wakati ambapo hakuna mtu anayeweza kufanya kazi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Baadhi ya hati zina: “Imenipasa kuyatenda matendo ya yule aliyenituma.”'
    reason: textual_variant
lexical_decisions:
- source_word: ἡμᾶς δεῖ
  choice: Imetupasa
  rationale: Muundo huu wa Kiswahili unaonyesha ulazima unaowahusu ‘sisi,’ kulingana na usomaji wa SBLGNT ἡμᾶς, na unasikika kwa kawaida na kwa heshima.
- source_word: ἐργάζεσθαι τὰ ἔργα
  choice: kuzifanya kazi
  rationale: ‘Kufanya kazi’ huepuka urudiaji usio wa kawaida wa kitenzi na nomino yenye mzizi mmoja, huku ikihifadhi maana ya kutekeleza kazi alizopewa.
- source_word: τοῦ πέμψαντός με
  choice: za yule aliyenituma
  rationale: Kirai hiki kinadumisha rejeo la mtu binafsi bila kumtaja wazi zaidi ya Kigiriki; ‘za’ huonyesha kwamba kazi hizo ni zake au zimetoka kwake.
- source_word: ἕως ἡμέρα ἐστίν
  choice: maadamu ni mchana
  rationale: Hiki ni kirai cha muda cha Kiswahili kinachoonyesha kipindi ambacho nafasi ya kutenda bado ipo, sambamba na tofauti ya usiku unaokuja.
- source_word: ἔρχεται νὺξ
  choice: usiku unakuja
  rationale: Wakati wa sasa wenye maana ya tukio linalokaribia umehifadhiwa kwa usemi wa kawaida wa Kiswahili.
- source_word: ὅτε οὐδεὶς δύναται ἐργάζεσθαι
  choice: wakati ambapo hakuna mtu anayeweza kufanya kazi
  rationale: Tafsiri hii huhifadhi maana ya muda, ukosefu wa uwezo, na kutomhusisha jinsia fulani.
theological_decisions:
- issue: 'Tofauti ya maandishi mwanzoni mwa aya: ἡμᾶς (‘sisi’) dhidi ya ἐμέ (‘mimi’)'
  choice: Imetupasa kuzifanya kazi za yule aliyenituma
  alternative: Imenipasa kuzifanya kazi za yule aliyenituma
  rationale: Matini ya SBLGNT iliyotolewa ina ἡμᾶς, hivyo tafsiri kuu inafuata wingi ‘sisi.’ Usomaji wa umoja umeenea katika mapokeo ya hati na kwa hiyo umetajwa katika tanbihi bila kuondoa mvutano wa kimaandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, kinachoeleweka na chenye hadhi. ‘Imetupasa’ huwasilisha ulazima kwa ufupi; ‘maadamu ni mchana’ hudumisha taswira ya mchana na usiku bila kuifafanua kitheolojia kupita matini.
