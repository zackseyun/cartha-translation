  text: ἀπεκρίθη αὐτοῖς· Εἶπον ὑμῖν ἤδη καὶ οὐκ ἠκούσατε· τί πάλιν θέλετε ἀκούειν; μὴ καὶ ὑμεῖς θέλετε αὐτοῦ μαθηταὶ γενέσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/027.yaml
  text: He answered them[a], “I already told you, and you did not listen. Why do you want to hear it again? You do not also want to become his disciples[b], do you?”
translation:
  language: sw
  text: Akawajibu, “Nimewaambia tayari, nanyi hamkusikiliza.[a] Kwa nini mnataka kusikia tena? Ninyi pia hamtaki kuwa wanafunzi wake, sivyo?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nanyi hamkusikia.” Kitenzi cha Kigiriki kinaweza kumaanisha “kusikia” au “kusikiliza”; hapa huenda kinamaanisha kutotilia maanani yaliyosemwa.
    reason: lexical_alternative
  - marker: b
    text: Au, “Hakika ninyi pia hamtaki kuwa wanafunzi wake?” Swali la Kigiriki limetungwa kwa namna inayotarajia jibu la kukataa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη αὐτοῖς
  choice: Akawajibu
  rationale: Ni simulizi la kawaida la kujibu; umbo hili ni la asili katika Kiswahili na linahifadhi walengwa wa jibu.
- source_word: ἤδη
  choice: tayari
  rationale: Linaonyesha kuwa jambo hilo lilifanyika kabla na linasisitiza kuwa alikuwa amekwisha kuwaambia.
- source_word: οὐκ ἠκούσατε
  choice: hamkusikiliza
  rationale: Ingawa ἀκούω inaweza kumaanisha ‘kusikia,’ muktadha unakazia kutotilia maanani yale yaliyosemwa, hivyo ‘kusikiliza’ linafaa zaidi.
- source_word: τί πάλιν θέλετε ἀκούειν;
  choice: Kwa nini mnataka kusikia tena?
  rationale: τί hapa linaeleweka kiasili kama swali la sababu lenye sauti ya kukerwa; ‘kusikia’ pia huhifadhi mwangwi wa kitenzi kilekile cha Kigiriki.
- source_word: μὴ καὶ ὑμεῖς
  choice: Ninyi pia hamtaki ... au mnataka?
  rationale: μή huanzisha swali linalotarajia jibu la kukataa; swali la mkia ‘au mnataka?’ linafikisha nguvu hiyo kwa Kiswahili cha kawaida.
- source_word: αὐτοῦ μαθηταὶ
  choice: wanafunzi wake
  rationale: Huu ni muundo wa kawaida wa umilikaji katika Kiswahili na unafaa kwa μαθηταί katika Injili ya Yohana.
- source_word: γενέσθαι
  choice: kuwa
  rationale: Katika Kiswahili, ‘kuwa wanafunzi wake’ hueleza kwa kawaida kuingia katika hali hiyo; ‘kuwa’ hapa halipotezi maana ya kuanza kufuata.
theological_decisions:
- issue: Nguvu ya balagha ya swali la mwisho
  choice: 'Swali la kejeli linalotarajia kukataliwa: “Ninyi pia hamtaki kuwa wanafunzi wake, au mnataka?”'
  alternative: “Je, ninyi pia mnataka kuwa wanafunzi wake?”
  rationale: Chembe μή inaashiria kwamba msemaji anatarajia jibu hasi. Tafsiri ya swali la mkia inahifadhi kejeli na matarajio hayo bila kuyafanya kuwa dai la mafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Usemi ‘au mnataka?’ ni wa kawaida na unaonyesha kejeli ya swali bila kutumia lugha nzito. Alama zote za tanbihi zimewekwa katika matini kuu.
