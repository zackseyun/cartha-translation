  text: Sisi tunajua kwamba Mungu amesema na Musa, lakini kuhusu mtu huyu, hatujui anatoka wapi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “anakuja kutoka wapi.” Katika Injili ya Yohana, maswali kuhusu asili ya Yesu yanaweza kuwa na maana ya kawaida na pia dokezo la kina zaidi la kiteolojia.
