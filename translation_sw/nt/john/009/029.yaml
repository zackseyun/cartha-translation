lexical_decisions:
- source_word: ἡμεῖς
  choice: Sisi
  rationale: Kiwakilishi kilichotajwa wazi katika Kigiriki kinaweka msisitizo na tofauti; “Sisi” huihifadhi kwa Kiswahili cha kawaida.
- source_word: οἴδαμεν
  choice: tunajua
  rationale: Hueleza kujua au kuwa na uhakika; limetafsiriwa vivyo hivyo katika sehemu zote mbili za aya.
- source_word: Μωϋσεῖ
  choice: Musa
  rationale: Hili ndilo umbo la kawaida la jina hili katika Biblia za Kiswahili.
- source_word: λελάληκεν
  choice: amesema na
  rationale: Wakati timilifu unaonyesha tendo la Mungu la kusema ambalo linachukuliwa kuwa jambo lililothibitishwa na lenye umuhimu unaoendelea; “amesema na” ni Kiswahili cha asili kwa mtu anayeelekezewa maneno.
- source_word: ὁ θεός
  choice: Mungu
  rationale: Tafsiri ya kawaida na ya moja kwa moja ya θεός katika muktadha huu.
- source_word: τοῦτον
  choice: mtu huyu
  rationale: Humrejelea Yesu kwa namna ya kumweka mbali; “mtu huyu” ni ya kawaida na inadumisha sauti hiyo bila kuongeza dharau isiyo wazi katika neno lenyewe.
- source_word: δὲ
  choice: lakini kuhusu
  rationale: Inaonyesha tofauti na kubadili mada kumwelekea “mtu huyu.”
- source_word: οὐκ οἴδαμεν
  choice: hatujui
  rationale: Inadumisha urudiaji wa kitenzi cha kujua na ukanushaji wake kwa Kiswahili fasaha.
- source_word: πόθεν ἐστίν
  choice: anatoka wapi
  rationale: Usemi huu ni wa kawaida katika Kiswahili na huhifadhi wazo pana la asili au chimbuko bila kulifungia katika mahali pa kijiografia pekee.
theological_decisions:
- issue: Maana ya asili ya Yesu katika πόθεν ἐστίν
  choice: anatoka wapi
  alternative: asili yake ni ipi; anakuja kutoka wapi
  rationale: Katika Injili ya Yohana, swali kuhusu Yesu anatoka wapi linaweza kuwa na maana ya kawaida na pia dokezo la kina kuhusu asili au mamlaka yake. Tafsiri haifafanui mojawapo na hivyo inadumisha utata na kejeli ya kisimulizi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa urahisi. Muundo “Sisi tunajua” unahifadhi msisitizo wa ἡμεῖς; “amesema na Musa” huepuka maana isiyokusudiwa ambayo “amemwambia Musa” ingeweza kuleta kwa kutohitaji kutaja yaliyosemwa.
