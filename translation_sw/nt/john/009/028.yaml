  text: ⸀ἐλοιδόρησαν αὐτὸν καὶ εἶπον· Σὺ ⸂μαθητὴς εἶ⸃ ἐκείνου, ἡμεῖς δὲ τοῦ Μωϋσέως ἐσμὲν μαθηταί·
base_translation:
  language: en
  yaml_path: translation/nt/john/009/028.yaml
  text: They reviled him and said[a], “You are that man's disciple, but we are disciples of Moses.”
translation:
  language: sw
  text: Wakamtukana, wakasema, “Wewe ni mwanafunzi wa mtu huyo[a], lakini sisi ni wanafunzi wa Musa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Wewe ni mwanafunzi wake.” Kigiriki kina “wa yule” au “wa mtu huyo,” usemi ambao huenda una toni ya dharau hapa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλοιδόρησαν
  choice: Wakamtukana
  rationale: Kitenzi hiki kinaonyesha kumshambulia mtu kwa maneno ya dharau. ‘Wakamtukana’ ni cha kawaida na chenye uzito unaofaa katika Kiswahili cha sasa.
- source_word: καὶ εἶπον
  choice: na kusema
  rationale: Muundo huu unaendeleza simulizi kwa kawaida baada ya ‘Wakamtukana’ bila kulazimika kurudia kiwakilishi cha mtenda.
- source_word: Σὺ
  choice: Wewe
  rationale: Kiwakilishi kimetajwa wazi na kuwekwa mwanzoni ili kuhifadhi mkazo wa Kigiriki.
- source_word: μαθητὴς / μαθηταί
  choice: mwanafunzi / wanafunzi
  rationale: ‘Mwanafunzi’ ni tafsiri iliyozoeleka ya μαθητής katika muktadha wa mwalimu na wafuasi wake; matumizi yale yale katika sehemu zote mbili yanahifadhi ulinganisho wa kimakusudi.
- source_word: ἐκείνου
  choice: wa mtu huyo
  rationale: Kirai hiki kinahifadhi umbali unaodokezwa na kiwakilishi cha kuonyesha na, katika muktadha huu wa uhasama, kinaweza pia kusikika kuwa cha kumdharau.
- source_word: ἡμεῖς δὲ
  choice: lakini sisi
  rationale: ‘Lakini’ linaonyesha utofautishaji, na ‘sisi’ lililotajwa wazi linahifadhi mkazo wa kiwakilishi cha Kigiriki.
- source_word: τοῦ Μωϋσέως
  choice: wa Mose
  rationale: Hii inaonyesha uhusiano wao na Mose kama wanafunzi wake kwa Kiswahili cha kawaida.
- source_word: ἐσμὲν μαθηταί
  choice: ni wanafunzi
  rationale: Muundo huu wa Kiswahili unaeleza hali yao moja kwa moja na kudumisha ulinganifu na ‘ni mwanafunzi’ katika kishazi cha kwanza.
theological_decisions:
- issue: Toni ya ἐκείνου inapomtaja Yesu
  choice: Imetafsiriwa ‘mtu huyo’ ili kuhifadhi umbali wa usemi na uwezekano wa dharau katika muktadha wa uhasama.
  alternative: ‘wake’ au ‘wa huyo’ kwa toni isiyo wazi sana
  rationale: Kiwakilishi cha Kigiriki chenyewe kinaweza kuwa cha kuonyesha tu, lakini tendo la kumtukana mtu na mvutano wa mazungumzo vinaunga mkono toni ya kumweka Yesu mbali bila kuongeza tusi lisilokuwamo.
- issue: Ulinganifu wa μαθητής katika pande zote mbili
  choice: Imetafsiriwa ‘mwanafunzi/wanafunzi’ katika pande zote mbili.
  alternative: ‘mfuasi/wafuasi’
  rationale: Kurudia neno lile lile kunahifadhi utofautishaji wa wazi kati ya kujihusisha na Yesu na kujihusisha na Mose, bila kuamua zaidi ya maandishi kuhusu asili ya ufuasi huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Wakamtukana’ ni cha kueleweka kwa wasomaji wa kawaida, na ‘mtu huyo’ huhifadhi toni ya kuwaweka mbali bila kutumia lugha kali kupita maandishi ya Kigiriki.
