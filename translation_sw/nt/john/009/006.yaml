id: JHN.9.6
reference: John 9:6
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ταῦτα εἰπὼν ἔπτυσεν χαμαὶ καὶ ἐποίησεν πηλὸν ἐκ τοῦ πτύσματος, καὶ ⸀ἐπέχρισεν ⸀αὐτοῦ τὸν πηλὸν ἐπὶ τοὺς ⸀ὀφθαλμούς,
base_translation:
  language: en
  yaml_path: translation/nt/john/009/006.yaml
  text: After saying these things[a], he spit on the ground and made mud from the saliva, and he spread the mud on his eyes,
translation:
  language: sw
  text: Baada ya kusema hayo, alitema mate chini, akatengeneza tope kwa mate hayo, kisha akalipaka tope hilo kwenye macho yake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akayapaka macho yake kwa tope hilo.” Kitenzi cha Kigiriki kinaweza kumaanisha kupaka kitu juu ya kitu au kutia mafuta.
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα εἰπὼν
  choice: Baada ya kusema hayo
  rationale: Kirai cha Kigiriki kinaonyesha kwamba kusema kulitangulia matendo yanayofuata; muundo huu ni wa kawaida na wazi katika Kiswahili.
- source_word: ἔπτυσεν χαμαί
  choice: alitema mate chini
  rationale: χαμαί humaanisha chini au ardhini. Kiswahili cha kawaida hutumia ‘kutema mate,’ hivyo tafsiri hii inawasilisha tendo halisi kwa uwazi.
- source_word: ἐποίησεν πηλὸν
  choice: akatengeneza tope
  rationale: πηλός inaweza kumaanisha udongo wa mfinyanzi au tope. Katika muktadha wa mate yaliyochanganywa na ardhi, ‘tope’ ni neno la kawaida na linalofaa zaidi.
- source_word: ἐκ τοῦ πτύσματος
  choice: kwa mate hayo
  rationale: Kirai kinaonyesha kwamba mate ndiyo yaliyotumiwa kutengeneza tope. ‘Mate hayo’ pia hurejelea wazi mate yaliyotajwa katika tendo lililotangulia.
- source_word: ἐπέχρισεν
  choice: akalipaka
  rationale: Kitenzi hiki kinaweza kumaanisha kupaka juu, kupaka kwa kusugua, au kutia mafuta. ‘Akalipaka’ kinaeleza tendo la kuweka tope kwenye macho kwa lugha ya kawaida bila kulifanya kuwa tendo la kiibada.
- source_word: αὐτοῦ ... ἐπὶ τοὺς ὀφθαλμούς
  choice: kwenye macho yake
  rationale: Kiwakilishi kinamrejelea yule mtu kipofu katika muktadha. ‘Kwenye macho yake’ ni Kiswahili cha kawaida na kinahifadhi kiwakilishi cha maandishi ya Kigiriki.
- source_word: τὸν πηλόν
  choice: tope hilo
  rationale: Kibainishi cha Kigiriki hurejelea tope lililotengenezwa muda huo; ‘hilo’ kinahifadhi urejeleo huo.
theological_decisions:
- issue: Dokezo linalowezekana la kiibada katika ἐπέχρισεν
  choice: Tendo limetafsiriwa kwa kitenzi cha kawaida ‘akalipaka.’
  alternative: ‘akayapaka macho yake kwa tope hilo’ au, kwa maana nyingine ya kitenzi, ‘aliyatia mafuta’
  rationale: Muktadha unaeleza matumizi halisi ya tope, si tendo linalotajwa wazi kuwa la kiibada. Tafsiri kuu inaepuka kuingiza maana ya kidini isiyosemwa moja kwa moja, huku tanbihi ikihifadhi upana wa kimaana wa kitenzi cha Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na rahisi kueleweka. Mfuatano wa ‘alitema … akatengeneza … kisha akalipaka’ unaonyesha wazi mpangilio wa matendo bila kuwa mgumu.
