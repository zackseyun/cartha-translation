  text: ἀπεκρίθη Ἰησοῦς· Οὔτε οὗτος ἥμαρτεν οὔτε οἱ γονεῖς αὐτοῦ, ἀλλ’ ἵνα φανερωθῇ τὰ ἔργα τοῦ θεοῦ ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/003.yaml
  text: Jesus answered[a], “Neither this man sinned, nor his parents[c][b], but so that the works of God might be revealed in him.”
translation:
  language: sw
  text: Yesu akajibu, “Mtu huyu hakutenda dhambi, wala wazazi wake hawakutenda dhambi; bali ni ili kazi za Mungu zidhihirishwe ndani yake.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kupitia kwake.” Kigiriki kinasema “ndani yake,” ambako kunaweza kuonyesha eneo au njia ambamo kazi za Mungu zinadhihirishwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: akajibu
  rationale: Katika simulizi ya mazungumzo, ‘akajibu’ ni tafsiri ya kawaida na ya asili, huku ikihifadhi mfuatano wa kimasimulizi.
- source_word: Οὔτε ... οὔτε
  choice: Si ... wala si
  rationale: Muundo huu wa Kiswahili unakanusha kwa msisitizo uwezekano wote wawili unaotajwa.
- source_word: οὗτος
  choice: mtu huyu
  rationale: Muktadha unaonyesha kuwa Yesu anamsema yule mtu aliyezaliwa kipofu; ‘mtu huyu’ ni wazi na ya kawaida.
- source_word: ἥμαρτεν
  choice: aliyetenda dhambi
  rationale: Hutoa maana ya moja kwa moja ya ἁμαρτάνω na huingia kwa kawaida katika muundo wa Kiswahili.
- source_word: γονεῖς
  choice: wazazi
  rationale: Hii ndiyo tafsiri ya kawaida na sahihi ya γονεῖς.
- source_word: ἀλλ’ ἵνα
  choice: bali ni ili
  rationale: Huhifadhi mpito mkali kutoka kwa sababu zilizokataliwa kwenda kwa kusudi lililoelezwa, bila kuongeza wazi maneno yasiyomo katika Kigiriki kama ‘jambo hili lilitokea.’
- source_word: φανερωθῇ
  choice: zidhihirishwe
  rationale: Huhifadhi hali ya kutendwa na wazo la kazi hizo kuwekwa wazi au kuonekana.
- source_word: τὰ ἔργα τοῦ θεοῦ
  choice: kazi za Mungu
  rationale: Ni tafsiri ya wazi na ya kawaida inayohifadhi msamiati wa Yohana.
- source_word: ἐν αὐτῷ
  choice: ndani yake
  rationale: Ni tafsiri ya karibu ya ἐν αὐτῷ na huhifadhi uwezekano wa kuelewa kwamba kazi hizo zinaonekana ndani yake au kupitia kwake.
theological_decisions:
- issue: Je, Yesu anakataa uhusiano wote kati ya dhambi na mateso, au anakataa tu kwamba upofu huu ulisababishwa na dhambi ya mtu huyu au ya wazazi wake?
  choice: Kauli ya kukataa imewekewa watu hawa na tukio hili maalumu.
  alternative: Kufafanua kwa jumla kwamba mateso kamwe hayahusiani na dhambi ya mtu au ya wazazi.
  rationale: Mstari unajibu swali maalumu la wanafunzi; haupaswi kupanuliwa kuwa kanuni ya jumla ambayo haijasemwa.
- issue: Je, ἵνα inaonyesha kusudi au tokeo tu?
  choice: 'Lugha ya kusudi: ‘ili kazi za Mungu zidhihirishwe.’'
  alternative: ‘na matokeo yake kazi za Mungu zikadhihirishwa,’ au upangaji wa sentensi unaoondoa kabisa wazo la kusudi.
  rationale: Maana ya kawaida ya ἵνα pamoja na hali tegemezi ni kusudi. Tafsiri inadumisha mvutano huo bila kuongeza madai kuhusu namna Mungu alivyousababisha upofu.
- issue: Maana ya ἐν αὐτῷ
  choice: ‘ndani yake’ katika matini kuu.
  alternative: ‘kupitia kwake.’
  rationale: ‘Ndani yake’ hufuata Kigiriki kwa karibu na kuhifadhi utata wa kama mtu huyu ni eneo au njia ambayo kazi za Mungu zinaonyeshwa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ‘Si mtu huyu aliyetenda dhambi, wala si wazazi wake’ ni wa asili zaidi kuliko ufuataji mkavu wa mpangilio wa Kigiriki. Semikoloni husaidia kuonyesha mpito kutoka kwa sababu zilizokataliwa kwenda kwa kusudi, bila kutatua mvutano wa kiteolojia uliomo katika ἀλλ’ ἵνα.
