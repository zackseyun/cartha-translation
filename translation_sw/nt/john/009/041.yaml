  text: εἶπεν αὐτοῖς ὁ Ἰησοῦς· Εἰ τυφλοὶ ἦτε, οὐκ ἂν εἴχετε ἁμαρτίαν· νῦν δὲ λέγετε ὅτι Βλέπομεν· ⸀ἡ ἁμαρτία ὑμῶν μένει.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/041.yaml
  text: Jesus said to them[a], “If you were blind, you would not have sin. But now you say, ‘We see,’ so your sin remains.”
translation:
  language: sw
  text: Yesu akawaambia, “Kama mngekuwa vipofu, msingekuwa na dhambi[a]. Lakini sasa mnasema, ‘Tunaona’; dhambi yenu inabaki.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “msingekuwa na hatia.” Neno la Kigiriki ni “dhambi”; hapa linaweza pia kujumuisha maana ya hatia.
    reason: lexical_alternative
lexical_decisions:
- source_word: τυφλοὶ
  choice: vipofu
  rationale: Hili ndilo neno la moja kwa moja la Kiswahili kwa ‘blind.’ Muktadha unalipa maana ya kimfano kuhusu utambuzi wa kiroho, lakini tafsiri haiongezi neno ‘kiroho,’ ili kuhifadhi picha ya upofu iliyoendelezwa katika sura nzima.
- source_word: οὐκ ἂν εἴχετε
  choice: msingekuwa na
  rationale: Muundo wa sharti lisilo halisi unaeleza matokeo ya hali ya kudhaniwa. ‘Msingekuwa na’ ni Kiswahili cha kawaida na sahihi kwa maana hiyo.
- source_word: ἁμαρτίαν
  choice: dhambi
  rationale: Neno la Kigiriki kwa kawaida humaanisha ‘dhambi.’ Ingawa hapa linaweza pia kudokeza hatia, ‘dhambi’ huhifadhi maana yake ya moja kwa moja na matumizi ya Yohana bila kuifinya maana.
- source_word: νῦν δὲ
  choice: Lakini sasa
  rationale: Maneno haya yanaonyesha tofauti kati ya hali ya kudhaniwa na hali yao ya sasa. ‘Lakini sasa’ ni ya kawaida na wazi katika Kiswahili.
- source_word: λέγετε ὅτι Βλέπομεν
  choice: mnasema, ‘Tunaona’
  rationale: Tafsiri inahifadhi mabadiliko kutoka nafsi ya pili wingi hadi usemi wa moja kwa moja katika nafsi ya kwanza wingi, pamoja na nguvu ya kinaya ya kauli hiyo.
- source_word: ἡ ἁμαρτία ὑμῶν μένει
  choice: dhambi yenu inabaki
  rationale: ‘Inabaki’ huonyesha hali inayoendelea na kuhifadhi maana ya kitenzi μένει, ambacho ni muhimu katika maandishi ya Yohana.
theological_decisions:
- issue: Iwapo kuweka wazi kwamba ‘vipofu’ ni upofu wa kiroho na kwamba ‘dhambi’ inamaanisha hatia mbele za Mungu
  choice: Kuhifadhi maneno ya moja kwa moja ‘vipofu’ na ‘dhambi’ bila ufafanuzi wa kiimani ndani ya andiko kuu.
  alternative: “Kama mngekuwa vipofu kiroho, msingekuwa na hatia ya dhambi.”
  rationale: Muktadha unahusu utambuzi wa kiroho, lakini maneno ya Yesu yanaendeleza kimakusudi picha ya upofu wa kimwili katika sura hii. Kuongeza ‘kiroho’ au kubadili ‘dhambi’ kuwa ‘hatia’ kungemaliza mvutano na upana wa maana uliopo katika Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa kawaida kwa wasomaji wengi huku ukihifadhi sitiari, usemi wa moja kwa moja, na mvutano wa kiteolojia wa maandishi ya Kigiriki.
