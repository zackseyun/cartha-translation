  text: And they asked them, saying, “Is this your son, whom you say was born blind? How then does he now see?”
translation:
  language: sw
  text: Wakawauliza, “Je, huyu ndiye mwana wenu, ambaye ninyi mnasema alizaliwa kipofu? Basi, inakuwaje sasa anaona?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠρώτησαν
  choice: wakawauliza
  rationale: Kitenzi hiki kinaeleza kuwa waliwauliza wazazi wake moja kwa moja; ‘wakawauliza’ ni cha kawaida katika masimulizi ya Kiswahili na kinaendeleza mtiririko wa simulizi.
- source_word: λέγοντες
  choice: '[imewasilishwa kwa kuanzisha maneno ya moja kwa moja]'
  rationale: Kirai ‘wakiwakisema’ si cha kawaida katika Kiswahili hapa; alama za kunukuu baada ya ‘wakawauliza’ zinawasilisha kwa kawaida kazi ya participio hii.
- source_word: Οὗτός ἐστιν ὁ υἱὸς ὑμῶν
  choice: Je, huyu ndiye mwana wenu
  rationale: Ingawa muundo wa Kigiriki ni wa kauli, muktadha wake ni swali. ‘Ndiye’ huonyesha utambulisho unaoulizwa kwa lugha ya asili ya Kiswahili.
- source_word: ὃν ὑμεῖς λέγετε
  choice: ambaye ninyi mnasema
  rationale: ‘Mnasema’ inadumisha kutokuwamo kwa λέγετε bila kuongeza maana ya mashaka kama ‘mnayedai’; ‘ninyi’ inahifadhi msisitizo wa kiwakilishi cha Kigiriki.
- source_word: τυφλὸς ἐγεννήθη
  choice: alizaliwa kipofu
  rationale: Hii ni namna ya kawaida na iliyo wazi ya kueleza kwamba upofu ulikuwapo tangu kuzaliwa.
- source_word: πῶς οὖν
  choice: Basi, ... anaonaje
  rationale: ‘Basi’ huhifadhi nguvu ya hitimisho au swali linalotokana na kauli iliyotangulia, huku ‘anaonaje’ ikiwa mpangilio wa kawaida wa Kiswahili.
- source_word: βλέπει
  choice: anaona
  rationale: Wakati wa sasa unaonyesha hali halisi ya kuona kwa sasa; ‘anaona’ huepuka kuibadili kuwa swali la uwezo tu, kama ‘anawezaje kuona’.
- source_word: ἄρτι
  choice: sasa
  rationale: ‘Sasa’ linaonyesha wazi utofauti kati ya upofu wa awali na hali yake ya sasa.
theological_decisions: []
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa Kigiriki ‘wakiisema’ umegeuzwa kwa kawaida kuwa utangulizi wa swali la moja kwa moja bila kupoteza maudhui. Hakuna tanbihi zinazohitajika.
