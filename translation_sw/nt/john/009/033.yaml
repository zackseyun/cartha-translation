  text: If this man were not from God[a], he could do nothing.
translation:
  language: sw
  text: Kama mtu huyu asingekuwa ametoka kwa Mungu[a], hangeweza kufanya chochote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Isipokuwa mtu huyu ametoka kwa Mungu, hangeweza kufanya chochote.”
    reason: Mbadala huu unaonyesha kwamba εἰ μή pia inaweza kuwasilishwa kwa muundo wa ‘isipokuwa,’ ilhali ‘kama ... asingekuwa’ huonyesha kwa uwazi zaidi muundo wa sharti katika Kiswahili.
lexical_decisions:
- source_word: εἰ μὴ
  choice: Kama ... asingekuwa
  rationale: Muundo huu unaonyesha sharti linalodhani hali iliyo kinyume na ukweli, huku ukihifadhi wazi umbo la ‘ikiwa ... si.’
- source_word: ἦν
  choice: asingekuwa ametoka
  rationale: Wakati usiotimilika wa Kigiriki, pamoja na sentensi ya sharti, unaeleza hali inayodhaniwa kuwa kinyume na ukweli. Kiswahili hutumia ‘asingekuwa’ kuonyesha maana hiyo; ‘ametoka’ hufanya uhusiano wa chanzo katika ‘kutoka kwa Mungu’ usikike kwa kawaida.
- source_word: οὗτος
  choice: mtu huyu
  rationale: Katika muktadha, kiwakilishi hiki kinamtaja Yesu, mwanamume ambaye tayari anazungumziwa. ‘Mtu huyu’ ni wazi na ya kawaida katika Kiswahili.
- source_word: παρὰ θεοῦ
  choice: ametoka kwa Mungu
  rationale: παρά pamoja na hali ya umilikishi huonyesha chanzo au asili. ‘Kutoka kwa Mungu’ huhifadhi maana hiyo bila kuipanua kuwa ‘ametumwa na Mungu’ au ‘amepewa mamlaka na Mungu.’
- source_word: οὐκ ἠδύνατο
  choice: hangeweza
  rationale: Kitenzi hiki kinaonyesha kutoweza; umbo la masharti ‘hangeweza’ linaendana kwa kawaida na hoja ya sentensi nzima.
- source_word: ποιεῖν
  choice: kufanya
  rationale: ποιέω ni neno lenye maana pana. ‘Kufanya’ ni la kawaida na haliongezi tafsiri maalumu kama ‘kutenda miujiza,’ ingawa matendo hayo ndiyo muktadha.
- source_word: οὐδέν
  choice: chochote
  rationale: Baada ya kitenzi hasi ‘hangeweza,’ ‘chochote’ ndiyo njia ya kawaida ya Kiswahili ya kuonyesha kutoweza kabisa kufanya jambo lolote.
theological_decisions:
- issue: Maana ya ‘kutoka kwa Mungu’ kuhusiana na Yesu
  choice: Kuhifadhi usemi wa chanzo, ‘ametoka kwa Mungu,’ bila kuufafanua zaidi.
  alternative: ‘ametumwa na Mungu’ au ‘amepewa mamlaka na Mungu’
  rationale: Usemi wa Kigiriki unadai uhusiano wa Yesu na Mungu kama chanzo, lakini hapa haufafanui kwa maneno ya kiufundi ikiwa hasa unazungumzia kutumwa, mamlaka, au asili yake. Tafsiri haipaswi kuondoa mvutano huo wa kiteolojia.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni ya kawaida kwa msomaji wa leo, huku ikihifadhi hoja ya sharti iliyo kinyume na ukweli na kutopanua ‘kutoka kwa Mungu’ zaidi ya ushahidi wa Kigiriki.
