lexical_decisions:
- source_word: σάββατον
  choice: Sabato
  rationale: Neno hili linataja siku ya Sabato. Muundo wa Kiswahili wenye kiarifu mwishoni—“ilikuwa Sabato”—ni wa kawaida na unadumisha taarifa ya wakati bila kuongeza maelezo kuhusu sheria ya Sabato.
- source_word: ἐν ᾗ ἡμέρᾳ
  choice: Siku ambayo
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaowasilisha kwa wazi uhusiano wa wakati uliomo katika kirai cha Kigiriki.
- source_word: πηλόν
  choice: tope
  rationale: Katika muktadha wa mate yaliyochanganywa na udongo, “tope” ni neno la kawaida na linaloeleweka kwa urahisi; “udongo wa mfinyanzi” au “udongo” pia yanawezekana lakini yanaweza kusikika ya kiufundi au yasieleze vizuri mchanganyiko huo.
- source_word: ἐποίησεν
  choice: alitengeneza
  rationale: Kitenzi hiki kinaonyesha kwamba Yesu aliandaa au alifanya tope. “Alitengeneza” ni cha asili zaidi katika Kiswahili hapa kuliko “alifanya,” ambacho kinaweza kuwa na maana pana mno.
- source_word: ἀνέῳξεν
  choice: kuyafungua
  rationale: Tafsiri hii inadumisha picha halisi ya Kigiriki ya kufungua macho badala ya kuibadili moja kwa moja kuwa “kumrudishia uwezo wa kuona.”
- source_word: αὐτοῦ τοὺς ὀφθαλμούς
  choice: macho yake
  rationale: Hii inadumisha rejeo la wazi la viungo vya mwili katika matini badala ya kutumia dhana ya jumla ya uwezo wa kuona.
- source_word: δὲ
  choice: —
  rationale: Kiunganishi hiki hafifu cha masimulizi hakihitaji neno tofauti katika sentensi hii ya Kiswahili; mtiririko na mabadiliko ya taarifa yanaeleweka bila kuongeza “basi,” “na,” au “lakini,” ambayo yangeweza kutoa mkazo usiokusudiwa.
theological_decisions:
- issue: Kutajwa kwa Sabato kuhusiana na tendo la Yesu la kuponya
  choice: Kutoa taarifa ya wakati moja kwa moja bila kueleza iwapo tendo hilo lilivunja au halikuvunja sheria ya Sabato.
  alternative: Kuongeza maelezo kwamba uponyaji huo ulisababisha mabishano kuhusu Sabato.
  rationale: Aya yenyewe inatoa jambo la msingi linaloandaa mabishano yanayofuata. Tafsiri haipaswi kutatua mapema mvutano wa kiteolojia au wa kisheria.
- issue: Usemi “aliyafungua macho yake”
  choice: Kudumisha usemi halisi wa matini kuhusu kufunguliwa kwa macho.
  alternative: Kutafsiri kwa ufafanuzi kuwa “alimponya” au “alimrudishia uwezo wa kuona.”
  rationale: Usemi halisi unadumisha mtindo wa Yohana na haupunguzi tendo hilo kuwa maelezo ya jumla, ingawa katika muktadha linamaanisha uponyaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Mpangilio wa sentensi umebadilishwa kwa ufasaha wa Kiswahili huku taarifa ya msingi kwamba siku hiyo ilikuwa Sabato ikidumishwa.
