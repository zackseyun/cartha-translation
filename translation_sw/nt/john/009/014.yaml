translation:
  language: sw
  text: Siku ambayo Yesu alitengeneza tope[a] na akafungua macho ya yule mtu[b] ilikuwa Sabato.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “udongo.”
    reason: lexical_alternative
  - marker: b
    text: 'Kigiriki: “akafungua macho yake,” usemi halisi unaoeleza kuponywa kwake.'
