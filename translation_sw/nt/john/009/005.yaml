  yaml_path: translation/nt/john/009/005.yaml
  text: While I am in the world, I am the light of the world.
translation:
  language: sw
  text: Nikiwa ulimwenguni, mimi ni nuru ya ulimwengu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅταν ἐν τῷ κόσμῳ ὦ
  choice: Nikiwa ulimwenguni
  rationale: Muundo huu wa Kiswahili unaeleza hali ya Yesu kuwapo ulimwenguni na, katika muktadha huu, unasomeka kwa kawaida kama ‘wakati niko ulimwenguni,’ bila kulazimisha tafsiri ya neno kwa neno ya ὅταν.
- source_word: φῶς
  choice: nuru
  rationale: ‘Nuru’ ni neno la kawaida, lenye hadhi, na huhifadhi taswira ya mwanga pamoja na maana yake ya kitheolojia katika Injili ya Yohana.
- source_word: τοῦ κόσμου
  choice: ya ulimwengu
  rationale: Huhifadhi uhusiano wa moja kwa moja wa kishazi cha Kigiriki na mwangwi wa kauli ‘nuru ya ulimwengu.’
theological_decisions:
- issue: Uhusiano wa muda katika ὅταν ἐν τῷ κόσμῳ ὦ
  choice: Nikiwa ulimwenguni
  alternative: Wakati niko ulimwenguni / Kila ninapokuwa ulimwenguni
  rationale: Katika muktadha, kauli inahusu kuwapo kwa Yesu ulimwenguni wakati wa huduma yake. ‘Nikiwa’ huhifadhi uhusiano huo bila kuingiza dai lisilo la lazima kwamba nuru yake hukoma baada ya kuondoka kwake, wala msisitizo wa kurudiarudia unaoweza kudokezwa na ‘kila ninapokuwa.’
- issue: Msisitizo wa kiwakilishi katika φῶς εἰμι
  choice: mimi ni nuru
  alternative: ni nuru
  rationale: Kuweka ‘mimi’ kunawakilisha msisitizo unaoweza kusikika katika kauli ya utambulisho ya Yesu na kulingana na mtindo wa kauli zake katika Yohana.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; sentensi ni fupi, ya asili, yenye hadhi na inayoeleweka kwa wasomaji wa kawaida.
