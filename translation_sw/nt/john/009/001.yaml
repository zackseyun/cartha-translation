  text: Καὶ παράγων εἶδεν ἄνθρωπον τυφλὸν ἐκ γενετῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/001.yaml
  text: And as he was passing by[a], he saw a man blind from birth.
translation:
  language: sw
  text: Na alipokuwa akipita, alimwona mtu aliyekuwa kipofu tangu kuzaliwa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: Alipokuwa
  rationale: Kiunganishi Καὶ kinaendeleza simulizi, lakini katika Kiswahili uhusiano wake na kishiriki παράγων unaelezwa kwa kawaida kwa kishazi cha wakati bila kuanza na “Na.”
- source_word: παράγων
  choice: alipokuwa akipita
  rationale: Muundo huu unaonyesha kitendo kilichokuwa kikiendelea wakati tendo kuu la kumwona lilipotokea.
- source_word: εἶδεν
  choice: alimwona
  rationale: Hii ndiyo tafsiri ya moja kwa moja na ya kawaida ya kitenzi ὁράω katika muktadha huu.
- source_word: ἄνθρωπον
  choice: mtu
  rationale: ἄνθρωπος humaanisha mtu; Kiswahili “mtu” ni la kawaida na halihitaji kuongeza jinsia ambayo nomino yenyewe haibainishi moja kwa moja.
- source_word: τυφλὸν
  choice: aliyekuwa kipofu
  rationale: Kishazi hiki kinaunganisha kwa uwazi hali ya upofu na mtu anayetajwa, kwa Kiswahili cha kawaida.
- source_word: ἐκ γενετῆς
  choice: tangu kuzaliwa
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha kwamba hali hiyo ilikuwapo kuanzia kuzaliwa.
theological_decisions:
- issue: Uwasilishaji wa jinsia katika ἄνθρωπον
  choice: mtu
  alternative: mwanamume
  rationale: Neno la Kigiriki ἄνθρωπος hapa linamtaja mtu mmoja, lakini lenyewe si lazima limaanishe “mwanamume.” “Mtu” huhifadhi maana ya neno bila kuingiza ubainishaji wa jinsia usio katika mstari huu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo wa wakati huhifadhi hali endelevu ya kishiriki cha Kigiriki bila kufanya sentensi kuwa nzito.
