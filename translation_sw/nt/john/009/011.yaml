  text: ἀπεκρίθη ⸀ἐκεῖνος· ⸂Ὁ ἄνθρωπος ὁ⸃ λεγόμενος Ἰησοῦς πηλὸν ἐποίησεν καὶ ἐπέχρισέν μου τοὺς ὀφθαλμοὺς καὶ εἶπέν μοι ⸀ὅτι Ὕπαγε εἰς ⸀τὸν Σιλωὰμ καὶ νίψαι· ἀπελθὼν ⸀οὖν καὶ νιψάμενος ἀνέβλεψα.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/011.yaml
  text: He answered[a], “The man called Jesus made mud and spread it on my eyes, and he told me, ‘Go to Siloam and wash.’ So I went away and washed[c][b], and I received my sight.”
translation:
  language: sw
  text: Yule mtu akajibu, “Mtu aitwaye Yesu alitengeneza tope[a], akanipaka tope machoni[b], kisha akaniambia, ‘Nenda Siloamu ukanawe.’ Basi nikaenda, nikanawa, nikapata kuona[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “udongo wa mfinyanzi.” Neno la Kigiriki πηλός linaweza kumaanisha tope au udongo.
    reason: lexical_alternative
  - marker: b
    text: Au, “akanipaka macho.” Kitenzi cha Kigiriki kinaweza kumaanisha kupaka au kusambaza kitu juu ya sehemu fulani; wakati mwingine hutafsiriwa rasmi zaidi kuwa “kutia mafuta.”
    reason: lexical_alternative
  - marker: c
    text: Au, “nikaanza kuona.” Katika muktadha huu kitenzi kinamaanisha kupata uwezo wa kuona baada ya kuwa kipofu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη ἐκεῖνος
  choice: Yule mtu akajibu
  rationale: Neno ἐκεῖνος limetajwa wazi na humrejelea mtu aliyeponywa; ‘yule mtu’ ni ya asili katika Kiswahili na huepuka tafsiri ngumu ya ‘yule.’
- source_word: Ὁ ἄνθρωπος ὁ λεγόμενος Ἰησοῦς
  choice: Mtu aitwaye Yesu
  rationale: Hutambulisha Yesu kwa jina bila kuongeza cheo au ukiri wa kitheolojia ambao msemaji hajautoa katika hatua hii ya simulizi.
- source_word: πηλὸν ἐποίησεν
  choice: alitengeneza tope
  rationale: Katika muktadha wa udongo uliochanganywa na mate, ‘tope’ ni neno la kawaida na wazi; πηλός pia linaweza kueleweka kuwa udongo wa mfinyanzi.
- source_word: ἐπέχρισέν μου τοὺς ὀφθαλμούς
  choice: akanipaka machoni
  rationale: ἐπιχρίω huonyesha kupaka au kupaka kitu juu ya sehemu fulani. Kiswahili hiki kinaeleza tendo la kimwili bila kuingiza maana ya kiibada ya ‘kutia mafuta.’
- source_word: εἶπέν μοι ὅτι
  choice: kisha akaniambia
  rationale: Ni utangulizi wa kawaida wa maneno ya moja kwa moja; ‘kisha’ huendeleza mfuatano wa matendo bila kuubadili.
- source_word: Ὕπαγε εἰς τὸν Σιλωὰμ καὶ νίψαι
  choice: Nenda Siloamu ukaoshe
  rationale: Huhifadhi amri mbili zinazofuatana kwa Kiswahili cha kawaida. Chanzo kinataja Siloamu bila kurudia neno ‘bwawa.’
- source_word: ἀπελθὼν οὖν καὶ νιψάμενος
  choice: Basi nikaenda, nikaosha
  rationale: ‘Basi’ huonyesha matokeo ya kutii amri, na vitenzi vinawasilisha mfuatano wa kwenda na kuosha kwa uwazi.
- source_word: ἀνέβλεψα
  choice: nikapata kuona
  rationale: Katika simulizi la kuponywa kwa mtu aliyekuwa kipofu tangu kuzaliwa, kitenzi humaanisha kupata uwezo wa kuona. ‘Nikapata kuona’ hakidokezi kimakosa kwamba alikuwa ameona hapo awali.
theological_decisions:
- issue: Jinsi msemaji anavyomtambulisha Yesu
  choice: Mtu aitwaye Yesu
  alternative: Yesu, yule mtu
  rationale: 'Huhifadhi kiwango cha uelewa wa mtu aliyeponywa katika hatua hii ya simulizi: anamweleza Yesu kama mtu anayeitwa Yesu, bila kuingiza mapema cheo cha juu au ukiri wa baadaye.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mtindo wa simulizi umetumia mfuatano wa vitenzi unaosikika kawaida kwa wasomaji wa kawaida. ‘Machoni’ limetumiwa badala ya usemi mzito ‘juu ya macho yangu,’ na ‘nikapata kuona’ huhifadhi ukweli wa muktadha kwamba mtu huyo alikuwa kipofu tangu kuzaliwa.
