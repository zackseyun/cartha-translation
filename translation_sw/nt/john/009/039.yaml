  source_fidelity: 'Tafsiri inafuata kwa karibu muundo na maana ya Kigiriki: κρίμα ni “hukumu,” εἰς τὸν κόσμον τοῦτον ἦλθον ni “nilikuja katika ulimwengu huu,” na ulinganifu wa wale wasioona/wanaoona umehifadhiwa. Hata hivyo, “Kisha” huongeza mfuatano wa wakati ambao καὶ peke yake haiuweki wazi, na “wawe vipofu” haisisitizi vya kutosha maana ya γένωνται, “waje kuwa.”'
  naturalness: Kiswahili kwa ujumla ni sanifu na cha asili. “Yesu akasema” ni laini zaidi na sahihi bila “Kisha.” “Waje kuwa vipofu” ni usemi wa kawaida unaobeba ugeuzi unaokusudiwa katika sentensi ya Kigiriki.
  terminology: “Hukumu” ni chaguo sahihi kwa κρίμα na halibani maana kuwa adhabu. “Ulimwengu,” “waone,” na “vipofu” vinafaa. Tanbihi imerekebishwa ili itoe mbadala unaoeleweka na kufafanua athari ya hukumu bila kuingiza tafsiri ya kiitikadi.
