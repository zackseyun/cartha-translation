  text: καὶ εἶπεν ὁ Ἰησοῦς· Εἰς κρίμα ἐγὼ εἰς τὸν κόσμον τοῦτον ἦλθον, ἵνα οἱ μὴ βλέποντες βλέπωσιν καὶ οἱ βλέποντες τυφλοὶ γένωνται.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/039.yaml
  text: And Jesus said[a], “For judgment I came into this world, so that those who do not see may see, and those who see may become blind.”
translation:
  language: sw
  text: Yesu akasema, “Kwa ajili ya hukumu[a] nilikuja katika ulimwengu huu, ili wale wasioona waone, na wale wanaoona waje kuwa vipofu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa hukumu.” Neno la Kigiriki linaweza kukazia athari ya hukumu inayotokana na kuja kwa Yesu, wala si adhabu pekee.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίμα
  choice: hukumu
  rationale: ‘Hukumu’ huhifadhi maana ya matokeo ya uamuzi wa kimahakama na haibani maana kuwa adhabu tu; katika muktadha huu kuja kwa Yesu kunafunua hali halisi ya watu na kuleta mgawanyo.
- source_word: κόσμον
  choice: ulimwengu
  rationale: ‘Ulimwengu’ ni tafsiri ya kawaida ya κόσμος na hapa inafaa kwa ulimwengu wa wanadamu ambao Yesu aliujia.
- source_word: οἱ μὴ βλέποντες / οἱ βλέποντες
  choice: wale wasioona / wale wanaoona
  rationale: Muundo huu wa ulinganifu huhifadhi kwa pamoja maana halisi na ya kiroho bila kutaja kundi la kwanza moja kwa moja kuwa ‘vipofu.’
- source_word: βλέπωσιν
  choice: waone
  rationale: ‘Waone’ ni usemi wa asili wa Kiswahili baada ya ‘ili’ na huhifadhi uwezekano wa kuona kimwili na kiroho.
- source_word: τυφλοὶ γένωνται
  choice: wawe vipofu
  rationale: ‘Wawe vipofu’ huwasilisha mabadiliko yanayoonyeshwa na γένωνται na kuhifadhi ugeuzi mkali wa msemo.
- source_word: εἰς τὸν κόσμον τοῦτον ἦλθον
  choice: nilikuja katika ulimwengu huu
  rationale: Tafsiri hii ni ya kawaida na yenye heshima katika Kiswahili, huku ikihifadhi lugha ya Yohana kuhusu Yesu kuja ulimwenguni.
theological_decisions:
- issue: Uhusiano na Yohana 3:17, ambako Mwana hakutumwa ili auhukumu ulimwengu
  choice: Kutafsiri κρίμα kuwa ‘hukumu’ bila kuondoa mvutano
  alternative: ‘mgawanyo,’ ‘hatua ya hukumu,’ au ‘adhabu’
  rationale: 'Mstari huu unaonyesha kuja kwa Yesu kukileta kitenganisho chenye athari ya hukumu: wasioona wanaona, nao wanaodhani kuwa wanaona wanakuwa vipofu. ‘Hukumu’ huhifadhi mvutano wa kitheolojia na haubani maana kuwa adhabu pekee.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Ulinganifu wa ‘wale wasioona ... wale wanaoona’ umehifadhiwa, pamoja na fumbo la kuona kimwili na kiroho.
