base_translation:
  language: en
  yaml_path: translation/nt/john/009/030.yaml
  text: 'The man answered and said to them[a], “This is the remarkable thing: you do not know where he is from[b], and yet he opened my eyes.”'
translation:
  language: sw
  text: 'Yule mtu akawajibu, “Jambo la kushangaza ni hili[a]: ninyi hamjui anatoka wapi[b], lakini alinifumbua macho!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “jambo la kustaajabisha.”
    reason: lexical_alternative
  - marker: b
    text: Au “anapotoka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη ὁ ἄνθρωπος καὶ εἶπεν αὐτοῖς
  choice: Yule mtu akawajibu
  rationale: Muundo wa Kiswahili ‘akawajibu’ unawakilisha kwa kawaida fomula ya Kigiriki ‘akajibu na kuwaambia’ bila urudiaji mzito; ‘yule mtu’ humrejelea kwa wazi mtu aliyeponywa katika simulizi.
- source_word: Ἐν τούτῳ γὰρ τὸ θαυμαστόν ἐστιν
  choice: Hili ndilo jambo la kushangaza
  rationale: Hutoa maana ya kile kinachoonekana cha ajabu au cha kustaajabisha na kuhifadhi msisitizo pamoja na kejeli ya jibu lake. Neno γάρ linaeleweka katika mtiririko wa maelezo na halihitaji kiunganishi tofauti katika Kiswahili.
- source_word: ὑμεῖς οὐκ οἴδατε
  choice: ninyi hamjui
  rationale: ‘Ninyi’ huhifadhi msisitizo wa kiwakilishi kilichotajwa wazi katika Kigiriki, huku ‘hamjui’ ikieleza ukosefu wa maarifa, si kutokuelewa tu.
- source_word: πόθεν ἐστίν
  choice: anatoka wapi
  rationale: Ni usemi wa kawaida wa Kiswahili kuhusu asili au mahali mtu anakotoka, bila kuamua zaidi maana ya asili hiyo.
- source_word: καὶ ἤνοιξέν μου τοὺς ὀφθαλμούς
  choice: na bado amenifungua macho
  rationale: ‘Na bado’ huonyesha nguvu ya utofautishaji na kejeli iliyomo katika muktadha; ‘amenifungua macho’ huhifadhi usemi halisi wa uponyaji na mwangwi wake mpana bila kuufafanua.
theological_decisions:
- issue: Mwangwi wa kimethali wa kufunguliwa macho katika Injili ya Yohana
  choice: amenifungua macho
  alternative: amenipa nuru ya kiroho
  rationale: Katika muktadha wa karibu maneno hayo yanahusu uponyaji wa macho ya mwili. Tafsiri inaruhusu pia mwangwi wa kuona kiroho ujitokeze katika simulizi bila kuuingiza wazi katika mstari.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imeundwa kwa mtiririko wa kawaida wa masimulizi; ‘ninyi’ huhifadhi msisitizo wa Kigiriki, na mshangao wa mwisho huonyesha sauti ya kejeli yenye nguvu bila kuzidisha maana.
