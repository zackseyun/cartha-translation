  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἶπεν οὖν αὐτῷ ὁ Πιλᾶτος· Οὐκοῦν βασιλεὺς εἶ σύ; ἀπεκρίθη ⸀ὁ Ἰησοῦς· Σὺ λέγεις ὅτι βασιλεύς ⸀εἰμι. ἐγὼ εἰς τοῦτο γεγέννημαι καὶ εἰς τοῦτο ἐλήλυθα εἰς τὸν κόσμον ἵνα μαρτυρήσω τῇ ἀληθείᾳ· πᾶς ὁ ὢν ἐκ τῆς ἀληθείας ἀκούει μου τῆς φωνῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/037.yaml
  text: 'Then Pilate said to him[a], “So then, are you a king?” Jesus answered, “You say that I am a king. For this I have been born, and for this I have come into the world: that I should bear witness to the truth. Everyone who is of the truth listens to my voice.”'
translation:
  language: sw
  text: 'Basi Pilato akamwambia, “Kwa hiyo, wewe ni mfalme?” Yesu akajibu, “Wewe unasema kwamba mimi ni mfalme.[a] Kwa kusudi hili nimezaliwa, na kwa kusudi hili nimekuja ulimwenguni: ili niushuhudie ukweli. Kila mtu aliye wa ukweli huisikiliza sauti yangu.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, “Umesema: mimi ni mfalme,” au, “Umesema kwa usahihi kwamba mimi ni mfalme.” Maneno ya Kigiriki ni mafupi na yanaweza kueleweka kama uthibitisho wenye tahadhari.'
    reason: Usomaji mbadala unaodumisha utata wa jibu la Yesu.
lexical_decisions:
- source_word: Οὐκοῦν
  choice: Kwa hiyo
  rationale: Inaonyesha kwamba Pilato anafikia hitimisho kutokana na maneno yaliyotangulia, bila kuifanya kauli yake iwe nzito au isiyo ya kawaida katika Kiswahili.
- source_word: βασιλεὺς
  choice: mfalme
  rationale: Ni tafsiri ya kawaida katika muktadha wa uchunguzi wa Kirumi, na inadumisha maana za kisiasa na za Kimasihi bila ufafanuzi wa ziada.
- source_word: Σὺ λέγεις ὅτι βασιλεύς εἰμι
  choice: Wewe unasema kwamba mimi ni mfalme
  rationale: Inafuata kwa karibu muundo mfupi wa Kigiriki na kudumisha utata wake kama uthibitisho wenye tahadhari, bila kuugeuza waziwazi kuwa kukubali kwa nguvu au kukataa.
- source_word: γεγέννημαι
  choice: nimezaliwa
  rationale: Huwakilisha hali timilifu ya kitenzi na umuhimu unaoendelea wa kuzaliwa kwa Yesu, bila kuingiza maana ya kitheolojia isiyolazimishwa na muktadha.
- source_word: ἐλήλυθα εἰς τὸν κόσμον
  choice: nimekuja ulimwenguni
  rationale: Hudumisha hali timilifu na lugha ya Yohana kuhusu kuja kwa Yesu na utume wake ulimwenguni.
- source_word: μαρτυρήσω τῇ ἀληθείᾳ
  choice: niushuhudie ukweli
  rationale: Kitenzi hiki kinadumisha lugha ya ushahidi yenye mwelekeo wa kisheria katika Yohana; kiambishi cha yambwa katika ‘niushuhudie’ ni cha kawaida na wazi katika Kiswahili.
- source_word: πᾶς ὁ ὢν ἐκ τῆς ἀληθείας
  choice: Kila mtu aliye wa ukweli
  rationale: Ingawa ni usemi wenye uzito wa kimtindo, unadumisha uhusiano au asili inayoonyeshwa na ἐκ bila kuufasiri kwa nguvu kama ‘aliye upande wa’ au ‘anayemiliki’ ukweli.
- source_word: ἀκούει μου τῆς φωνῆς
  choice: huisikiliza sauti yangu
  rationale: ‘Huisikiliza’ huonyesha kusikia kwa kuitikia, huku ‘sauti yangu’ ikidumisha picha na mwangwi wa lugha ya Yohana.
theological_decisions:
- issue: Maana ya jibu la Yesu kwa Pilato (Σὺ λέγεις ὅτι βασιλεύς εἰμι)
  choice: Wewe unasema kwamba mimi ni mfalme
  alternative: '‘Umesema: mimi ni mfalme,’ au ‘Umesema kwa usahihi kwamba mimi ni mfalme’'
  rationale: Kigiriki kinaweza kusikika kama uthibitisho wenye tahadhari, lakini hakisemi wazi kama ni uthibitisho mkali au jibu la kujitenga. Tafsiri kuu inadumisha mvutano huo, na tanbihi inaonyesha uwezekano mwingine.
- issue: Tofauti kati ya kuzaliwa na kuja ulimwenguni
  choice: Kudumisha vishazi vyote viwili tofauti
  alternative: Kuvifupisha kuwa kauli moja kuhusu utume wa Yesu
  rationale: Maneno ya Yohana yanatofautisha kuzaliwa kwa Yesu na kuja kwake ulimwenguni. Vishazi vyote viwili vimehifadhiwa bila kuongeza maelezo ya kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa kawaida kwa wasomaji wa leo, huku marudio ya ‘Kwa kusudi hili’ yakidumisha msisitizo wa maandishi ya Kigiriki. Usemi ‘aliye wa ukweli’ umehifadhiwa kwa makusudi ili kutopoteza lugha ya kiuhusiano au ya asili iliyo katika ἐκ τῆς ἀληθείας.
