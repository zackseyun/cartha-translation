  text: ὁ δὲ Πέτρος εἱστήκει πρὸς τῇ θύρᾳ ἔξω. ἐξῆλθεν οὖν ὁ μαθητὴς ὁ ἄλλος ⸀ὁ γνωστὸς ⸂τοῦ ἀρχιερέως⸃ καὶ εἶπεν τῇ θυρωρῷ καὶ εἰσήγαγεν τὸν Πέτρον.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/016.yaml
  text: But Peter was standing outside at the door[a]. So the other disciple, who was known to the high priest[b], went out and spoke to the doorkeeper and brought Peter in.
translation:
  language: sw
  text: Lakini Petro alikuwa amesimama nje karibu na mlango. Basi yule mwanafunzi mwingine, aliyejulikana na kuhani mkuu[a], akatoka, akazungumza na mwanamke aliyekuwa mlinzi wa mlango[b], kisha akamwingiza Petro ndani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliyekuwa mtu wa kufahamiana na kuhani mkuu.” Kigiriki hakibainishi walikuwa na uhusiano wa karibu kwa kiwango gani.
    reason: lexical_alternative
  - marker: b
    text: Au, “mwanamke mlinzi wa lango.” Neno la Kigiriki humaanisha mtu aliyekuwa amewekwa kwenye sehemu ya kuingilia, na umbo lake hapa ni la kike.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἱστήκει
  choice: alikuwa amesimama
  rationale: Huonyesha hali ya Petro iliyoendelea wakati huo; muundo huu ni wa kawaida katika Kiswahili na hauongezi muda maalumu usiotajwa.
- source_word: πρὸς τῇ θύρᾳ ἔξω
  choice: nje karibu na mlango
  rationale: Huhifadhi ἔξω kama ‘nje’ na πρὸς τῇ θύρᾳ kama mahali karibu na mlango, bila kulazimisha maana ya ‘lango.’
- source_word: ὁ μαθητὴς ὁ ἄλλος
  choice: yule mwanafunzi mwingine
  rationale: ‘Mwanafunzi’ ni neno la kawaida la Kiswahili kwa μαθητής katika simulizi za Injili na huhifadhi uhusiano wa mtu anayemfuata mwalimu.
- source_word: ὁ γνωστὸς τοῦ ἀρχιερέως
  choice: aliyekuwa akijulikana na kuhani mkuu
  rationale: Huhifadhi kutobainishwa kwa ukaribu wa uhusiano; maandishi hayasemi wazi kama alikuwa rafiki au mtu wa kufahamiana tu.
- source_word: ἀρχιερεύς
  choice: kuhani mkuu
  rationale: Ni istilahi ya kawaida na sahihi kwa cheo hiki cha Kiyahudi.
- source_word: θυρωρῷ
  choice: mlinzi wa mlango
  rationale: Hueleza kwa Kiswahili cha kawaida mtu aliyekuwa amewekwa kwenye sehemu ya kuingilia; neno la Kigiriki hapa lina umbo la kike, lakini jukumu ndilo linalosisitizwa.
- source_word: εἶπεν τῇ θυρωρῷ
  choice: akazungumza na mlinzi wa mlango
  rationale: Kwa kuwa maneno aliyosema hayajanukuliwa, ‘akazungumza na’ ni ya kawaida kuliko ‘akamwambia’ na haihitaji kijalizo.
- source_word: εἰσήγαγεν τὸν Πέτρον
  choice: akamwingiza Petro ndani
  rationale: Huwasilisha kwa ufupi na kwa kawaida tendo la kumleta Petro kutoka nje kwenda ndani.
