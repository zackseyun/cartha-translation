  text: τί με ⸂ἐρωτᾷς; ἐρώτησον⸃ τοὺς ἀκηκοότας τί ἐλάλησα αὐτοῖς· ἴδε οὗτοι οἴδασιν ἃ εἶπον ἐγώ.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/021.yaml
  text: Why do you question me? Question those who have heard what I said to them. Look[a], they know what I said.
translation:
  language: sw
  text: “Kwa nini unanihoji? Waulize wale waliosikia yale niliyowaambia. Tazama, hawa wanajua niliyosema.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τί με ἐρωτᾷς
  choice: Kwa nini unanihoji?
  rationale: Kitenzi ἐρωτάω kinaweza kumaanisha ‘kuuliza,’ lakini katika mazingira haya ya kusikilizwa rasmi mbele ya kuhani mkuu, ‘kuhoji’ kinaonyesha kwa kawaida zaidi uzito wa swali bila kufikia maana kali ya ‘kupeleleza.’
- source_word: ἐρώτησον
  choice: Waulize
  rationale: Ingawa ni kitenzi kilekile, Kiswahili cha kawaida husema ‘waulize wale waliosikia’; ‘wahoji’ hapa kingesikika kana kwamba Yesu anataka nao wafanyiwe uchunguzi rasmi. Amri ya moja kwa moja imehifadhiwa.
- source_word: τοὺς ἀκηκοότας
  choice: wale waliosikia
  rationale: Muundo huu wa kawaida wa Kiswahili unatambulisha watu waliokwisha kusikia mafundisho ya Yesu. Hakuna haja ya kuongeza ‘mimi,’ kwa kuwa sentensi inayofuata inaeleza walichosikia.
- source_word: τί ἐλάλησα αὐτοῖς
  choice: yale niliyowaambia
  rationale: λαλέω hapa ni kusema au kunena kwao. ‘Niliyowaambia’ ni Kiswahili asilia kinachohifadhi walengwa wa usemi bila kudokeza zaidi ya maandishi.
- source_word: ἴδε
  choice: Tazama
  rationale: Ni neno la kuvuta fikira. ‘Tazama’ ni la sasa, lenye heshima, na halina ukale usio wa lazima.
- source_word: οὗτοι οἴδασιν
  choice: hao wanajua
  rationale: ‘Hao’ huhifadhi nguvu ya kiashiria ya οὗτοι na kwa kawaida hurejelea watu waliotajwa au waliopo katika mazingira hayo.
- source_word: ἃ εἶπον ἐγώ
  choice: niliyosema
  rationale: Hutoa kwa ufupi na kawaida maudhui wanayoyajua. Msisitizo wa ἐγώ unaeleweka kutokana na muktadha na kurudiwa kwa nafsi ya kwanza; ‘mimi mwenyewe’ ungekuwa mzito kupita kiasi.
theological_decisions:
- issue: Toni ya kisheria katika jibu la Yesu mbele ya kuhani mkuu
  choice: Kutumia ‘unanihoji’ katika swali la kwanza, lakini ‘waulize’ katika amri inayofuata.
  alternative: Kutumia ‘unaniuliza ... waulize’ au ‘unanihoji ... wahoji.’
  rationale: Muktadha rasmi unaunga mkono ‘kuhoji’ katika swali linaloelekezwa kwa Yesu. Hata hivyo, Kiswahili cha kawaida kinahitaji ‘waulize wale waliosikia’ katika sehemu ya pili. Tofauti hii ya maneno haiwajibishi tafsiri kuacha ulinganifu wa Kigiriki, bali huepuka maana ya ziada kwamba mashahidi nao wafanyiwe uchunguzi rasmi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi zimewekwa za moja kwa moja, na ‘hao’ imehifadhi ili kuonyesha nguvu ya kiashiria katika maandishi ya Kigiriki.
