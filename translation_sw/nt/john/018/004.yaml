  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἰησοῦς ⸀οὖν εἰδὼς πάντα τὰ ἐρχόμενα ἐπ’ αὐτὸν ⸂ἐξῆλθεν, καὶ λέγει⸃ αὐτοῖς· Τίνα ζητεῖτε;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/004.yaml
  text: Jesus therefore[a], knowing all the things coming upon him, went out and said to them, “Whom are you seeking?”
translation:
  language: sw
  text: Kwa hiyo Yesu, akijua yote yaliyokuwa yanamjia[a], alitoka na kuwauliza, “Mnamtafuta nani?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “yote yaliyokuwa karibu kumpata.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Inaonyesha mwendelezo wenye uhusiano wa kimantiki katika simulizi, badala ya kuonyesha wakati tu kama ‘kisha’.
- source_word: εἰδὼς
  choice: akijua
  rationale: Inawakilisha hali ya Yesu kuwa na ufahamu wa mambo hayo kabla ya kutoka, kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: πάντα τὰ ἐρχόμενα ἐπ’ αὐτόν
  choice: yote yaliyokuwa yanamjia
  rationale: Inahifadhi ujumla wa πάντα na wazo la matukio yaliyokuwa yakimkabili, bila kuyafafanua zaidi ya Kigiriki.
- source_word: ἐξῆλθεν
  choice: alitoka
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida, bila kuongeza wazo la kishindo kama ‘alijitokeza’.
- source_word: λέγει
  choice: kuwauliza
  rationale: Muktadha na dative αὐτοῖς zinaonyesha kwamba maneno hayo yalielekezwa kwao; Kiswahili hutumia kwa kawaida ‘aliwauliza’ kabla ya swali, huku wakati wa simulizi ukisawazishwa kuwa uliopita.
- source_word: Τίνα ζητεῖτε
  choice: Mnamtafuta nani?
  rationale: Muundo huu ni wa asili katika Kiswahili na unahifadhi ‘nani’ kama yambwa wa kitenzi ζητεῖτε; ‘kutafuta’ hudumisha uzito wa ζητέω.
theological_decisions:
- issue: Ufahamu wa Yesu wa mambo yaliyokuwa yakimjia
  choice: Tafsiri inaonyesha kwamba Yesu alijua yote yaliyokuwa yakimjia.
  alternative: Kusema wazi zaidi ‘yote yaliyokuwa karibu kumpata’ ili kusisitiza kutokea kwa matukio hayo muda mfupi baadaye.
  rationale: Kifungu kinadhihirisha ufahamu wa Yesu kabla ya matukio hayo, lakini tafsiri haiongezi kauli ya kimafundisho kuhusu upeo wa elimu yake zaidi ya yanayosemwa hapa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Mnamtafuta nani?’ ni cha asili zaidi kuliko muundo rasmi usio wa kawaida, na ‘yaliyokuwa yanamjia’ huhifadhi taswira ya Kigiriki bila kuifafanua kupita kiasi.
