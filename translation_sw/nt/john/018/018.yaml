reference: John 18:18
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἱστήκεισαν δὲ οἱ δοῦλοι καὶ οἱ ὑπηρέται ἀνθρακιὰν πεποιηκότες, ὅτι ψῦχος ἦν, καὶ ἐθερμαίνοντο· ἦν δὲ ⸂καὶ ὁ Πέτρος μετ’ αὐτῶν⸃ ἑστὼς καὶ θερμαινόμενος.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/018.yaml
  text: The servants and the officers were standing there[a], having made a charcoal fire because it was cold, and they were warming themselves[b]. Peter also was standing with them and warming himself.
translation:
  language: sw
  text: Watumwa[a] na walinzi[b] walikuwa wamesimama, wakiwa wamewasha moto wa mkaa kwa sababu kulikuwa na baridi, nao walikuwa wakijipasha moto. Petro pia alikuwa amesimama pamoja nao, akijipasha moto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “watumishi”; neno la Kigiriki linaweza kutumiwa kwa watumishi, lakini hapa huenda linamaanisha watu waliokuwa watumwa katika nyumba hiyo.
    reason: lexical_alternative
  - marker: b
    text: Au “watumishi rasmi”; neno hili linamaanisha wahudumu wenye mamlaka, ambao hapa huenda walihusishwa na hekalu au nyumba ya kuhani mkuu.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλοι
  choice: watumwa
  rationale: Neno hili linaweza kumaanisha watumishi au watumwa; hapa “watumwa” linadumisha uwezekano mkubwa kwamba hawa walikuwa watu wa nyumbani waliokuwa chini ya umiliki au kifungo cha kijamii.
- source_word: ὑπηρέται
  choice: walinzi
  rationale: Katika muktadha huu wa Yohana, neno hili linarejelea watumishi rasmi wenye wajibu wa ulinzi au utekelezaji; “walinzi” ni Kiswahili cha kawaida kinachoonyesha kazi hiyo bila kudai cheo maalumu.
- source_word: ἀνθρακιὰν
  choice: moto wa mkaa
  rationale: Tafsiri hii inahifadhi maelezo halisi ya aina ya moto, ambayo yana umuhimu wa kisimulizi katika Injili ya Yohana.
- source_word: πεποιηκότες
  choice: wakiwa wamewasha
  rationale: Muundo huu unaonyesha tendo lililokamilika ambalo matokeo yake—moto unaowaka—yanaendelea kuwepo.
- source_word: ὅτι ψῦχος ἦν
  choice: kwa sababu kulikuwa na baridi
  rationale: 'Huhifadhi wazi uhusiano wa sababu: waliwasha moto kwa kuwa hali ya hewa ilikuwa ya baridi.'
- source_word: ἐθερμαίνοντο
  choice: walikuwa wakijipasha moto
  rationale: Huwasilisha tendo linaloendelea na maana ya kujitia joto.
- source_word: ἦν δὲ καὶ ὁ Πέτρος μετ’ αὐτῶν ἑστὼς
  choice: Petro pia alikuwa amesimama pamoja nao
  rationale: “Pia” huhifadhi msisitizo wa nyongeza wa καί, na “pamoja nao” huweka wazi kwamba Petro alikuwa miongoni mwa kundi hilo.
- source_word: θερμαινόμενος
  choice: akijipasha moto
  rationale: Huhifadhi tendo la Petro linaloendelea na kulilinganisha na tendo la kundi lililotajwa kabla yake.
