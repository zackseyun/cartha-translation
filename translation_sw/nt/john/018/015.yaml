  text: Ἠκολούθει δὲ τῷ Ἰησοῦ Σίμων Πέτρος ⸀καὶ ἄλλος μαθητής. ὁ δὲ μαθητὴς ἐκεῖνος ἦν γνωστὸς τῷ ἀρχιερεῖ καὶ συνεισῆλθεν τῷ Ἰησοῦ εἰς τὴν αὐλὴν τοῦ ἀρχιερέως,
base_translation:
  language: en
  yaml_path: translation/nt/john/018/015.yaml
  text: Simon Peter was following Jesus[a], and so was another disciple. That disciple was known to the high priest, and he went in with Jesus into the courtyard of the high priest,
translation:
  language: sw
  text: Simoni Petro alikuwa akimfuata Yesu, na mwanafunzi mwingine pia.[a] Mwanafunzi huyo alijulikana na kuhani mkuu, naye akaingia pamoja na Yesu katika ua wa kuhani mkuu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa tafsiri ya karibu zaidi: “Simoni Petro alikuwa akimfuata Yesu, na mwanafunzi mwingine.” Kigiriki kinaacha tendo la pamoja la mwanafunzi wa pili lieleweke bila kulirudia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἠκολούθει
  choice: alikuwa akimfuata
  rationale: Kauli ya wakati uliopita usiotimilika inaonyesha tendo lililokuwa likiendelea katika simulizi; muundo huu wa Kiswahili unahifadhi hali hiyo.
- source_word: δὲ
  choice: —
  rationale: Ni kiunganishi hafifu cha kuendeleza simulizi; hakihitaji kutafsiriwa kwa neno maalumu hapa kwa kuwa mtiririko wa Kiswahili tayari ni wa kawaida na hakuna tofauti kali inayokusudiwa.
- source_word: καὶ ἄλλος μαθητής
  choice: na mwanafunzi mwingine pia
  rationale: Neno “pia” linaweka wazi kwa Kiswahili kwamba mwanafunzi mwingine alikuwa akifanya tendo lilelile la kumfuata Yesu, ambalo Kigiriki huliacha lieleweke kutokana na muktadha.
- source_word: μαθητής
  choice: mwanafunzi
  rationale: Ni neno la kawaida na sahihi katika Injili kwa mtu anayejifunza kwa Yesu na kumfuata.
- source_word: ἐκεῖνος
  choice: huyo
  rationale: Kiwakilishi hiki kinamrejelea mwanafunzi mwingine aliyetajwa mara moja kabla.
- source_word: γνωστὸς
  choice: alijulikana na
  rationale: Huhifadhi maana ya kuwa mtu anayejulikana kwa kuhani mkuu bila kuongeza kwamba walikuwa marafiki au walifahamiana sana.
- source_word: ἀρχιερεῖ / ἀρχιερέως
  choice: kuhani mkuu
  rationale: Ni tafsiri ya kawaida ya cheo hiki, na umoja umehifadhiwa katika sehemu zote mbili.
- source_word: συνεισῆλθεν
  choice: akaingia pamoja na
  rationale: Huwasilisha kuingia kwa kushirikiana na Yesu na pia kuendeleza mlolongo wa simulizi kwa Kiswahili cha kawaida.
- source_word: αὐλήν
  choice: ua
  rationale: Katika muktadha huu ni eneo la wazi lililozungukwa ndani ya makao ya kuhani mkuu; “ua” ni neno la kawaida lisiloongeza dhana ya jumba la kifalme.
