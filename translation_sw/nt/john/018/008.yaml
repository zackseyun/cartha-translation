  yaml_path: translation/nt/john/018/008.yaml
  text: Jesus answered[a], “I told you that I am he. So if you are seeking me, let these men go.”
translation:
  language: sw
  text: Yesu akajibu, “Niliwaambia kwamba mimi ndiye[a]. Basi, ikiwa mnanitafuta mimi, waacheni hawa waende.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki hakitaji neno linalolingana na “yeye”; kwa neno kwa neno husema, “Mimi ni.” Katika Kiswahili, “mimi ndiye” ni usemi wa kawaida wa kujitambulisha katika muktadha huu.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: akajibu
  rationale: Ni usemi wa kawaida wa kisimulizi unaoonyesha jibu la Yesu katika mazungumzo na kuendeleza mfuatano wa matukio.
- source_word: Εἶπον ὑμῖν
  choice: Niliwaambia
  rationale: Kitenzi cha wakati uliopita pamoja na ὑμῖν kinarejelea wazi jambo ambalo Yesu alikuwa amekwisha kuwaambia.
- source_word: ἐγώ εἰμι
  choice: mimi ndiye
  rationale: Katika tukio hili Yesu anajitambulisha kuwa yule wanayemtafuta. “Mimi ndiye” ni Kiswahili cha kawaida katika muktadha huo, huku uwezekano wa kusoma maneno hayo kama “Mimi niko” ukihifadhiwa katika tanbihi.
- source_word: ζητεῖτε
  choice: mnanitafuta
  rationale: Wakati wa sasa unaonyesha utafutaji unaoendelea katika tukio hili; “mnanitafuta” ni wa moja kwa moja na wa kawaida.
- source_word: ἐμὲ
  choice: mimi
  rationale: Kiwakilishi hiki kimetajwa kwa msisitizo katika Kigiriki; “mimi” baada ya “mnanitafuta” kinahifadhi msisitizo huo kwa njia ya asili katika Kiswahili.
- source_word: ἄφετε
  choice: waacheni
  rationale: Amri hii ina maana ya kuwaruhusu waondoke, bila kulazimisha dhana kwamba tayari walikuwa wamefungwa au kuwekwa kizuizini.
- source_word: τούτους
  choice: hawa
  rationale: Kiwakilishi kionyeshi kinawarejelea wazi wale waliokuwa pamoja na Yesu; Kiswahili hakihitaji kuongeza nomino hapa.
- source_word: ὑπάγειν
  choice: waende
  rationale: Baada ya “waacheni,” kitenzi hiki kinaeleza kuwaruhusu waondoke; “waende” ni tafsiri fupi na ya kawaida.
theological_decisions:
- issue: Maana ya ἐγώ εἰμι katika Injili ya Yohana
  choice: mimi ndiye
  alternative: Mimi niko
  rationale: Muktadha wa kukamatwa unaonyesha kwamba Yesu anajibu swali la utambulisho, hivyo “mimi ndiye” huwasilisha maana ya moja kwa moja kwa Kiswahili cha kawaida. Hata hivyo, maneno ya Kigiriki yanaweza kutafsiriwa bila kijalizo kama “Mimi niko,” jambo linaloweza kuwa na mwangwi mpana wa kiteolojia katika Injili ya Yohana; uwezekano huo haujaondolewa bali umewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo “mimi ndiye” ni wa kawaida katika kujitambulisha, na urudiaji wa “mimi” katika “mnanitafuta mimi” unahifadhi msisitizo wa Kigiriki bila kufanya sentensi kuwa nzito.
