  yaml_path: translation/nt/john/018/022.yaml
  text: And when he had said these things[a], one of the officers standing by struck Jesus, saying[b], “Is this how you answer the high priest?”
translation:
  language: sw
  text: Yesu alipokwisha kusema hayo, mmoja wa maafisa[a], aliyekuwa amesimama karibu, akampiga Yesu[b] na kusema, “Hivyo ndivyo unavyomjibu kuhani mkuu?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno lililotafsiriwa “maafisa” linaweza pia kumaanisha wahudumu au watumishi; katika muktadha huu huenda linawarejelea watumishi rasmi.
    reason: lexical_alternative
  - marker: b
    text: Au “akampiga Yesu kofi”; usemi wa Kigiriki unaonyesha pigo la mkono na unaweza kurejelea kofi au pigo linalofanana nalo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα δὲ αὐτοῦ εἰπόντος
  choice: Yesu alipokwisha kusema hayo
  rationale: Kishazi hiki cha wakati kinaonyesha kwamba Yesu alimaliza kusema maneno yaliyotangulia kabla ya tendo linalofuata. Kutaja ‘Yesu’ kunaondoa utata wa kiima katika Kiswahili bila kubadili rejeo la Kigiriki; ‘hayo’ huhifadhi wingi wa ταῦτα kwa namna ya kawaida.
- source_word: εἷς παρεστηκὼς τῶν ὑπηρετῶν
  choice: mmoja wa maofisa waliokuwa wamesimama hapo
  rationale: ‘Mmoja wa’ huhifadhi muundo wa Kigiriki. Katika simulizi la kukamatwa na kuhojiwa kwa Yesu, ὑπηρέται ni watumishi wenye jukumu rasmi, ingawa neno lenyewe linaweza pia kumaanisha wahudumu au watumishi. ‘Waliokuwa wamesimama hapo’ huonyesha kuwapo kwao karibu na tukio.
- source_word: ἔδωκεν ῥάπισμα τῷ Ἰησοῦ
  choice: akampiga Yesu
  rationale: Usemi wa Kigiriki unaonyesha pigo la mkono, huenda kofi au pigo linalofanana nalo. ‘Akampiga’ ni wa kawaida na huacha upeo huo wazi; tanbihi hutoa maelezo ya aina ya pigo.
- source_word: εἰπών
  choice: na kusema
  rationale: Huunganisha tendo la kupiga na maneno ya afisa kwa Kiswahili cha kawaida.
- source_word: Οὕτως ἀποκρίνῃ τῷ ἀρχιερεῖ;
  choice: Hivyo ndivyo unavyomjibu kuhani mkuu?
  rationale: Muundo huu huhifadhi swali la kukemea kuhusu namna Yesu alivyomjibu kuhani mkuu, bila kulifanya kuwa kauli ya moja kwa moja.
theological_decisions:
- issue: Utambulisho wa ὑπηρετῶν
  choice: maofisa, yaani watumishi wenye jukumu rasmi
  alternative: watumishi au wahudumu
  rationale: Muktadha wa kuhojiwa kwa Yesu unaelekea kwa wafanyakazi rasmi wa mamlaka ya ukuhani, lakini neno la Kigiriki ni pana zaidi; tanbihi huhifadhi uwezekano huo bila kuingiza hitimisho la kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa simulizi ulio wazi na wenye heshima. ‘Hayo’ ni ya kawaida kuliko ‘mambo haya’ katika kurejelea maneno yaliyotangulia. Alama za tanbihi zimewekwa baada ya maneno yanayofafanuliwa.
