reference: John 18:35
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀπεκρίθη ὁ Πιλᾶτος· Μήτι ἐγὼ Ἰουδαῖός εἰμι; τὸ ἔθνος τὸ σὸν καὶ οἱ ἀρχιερεῖς παρέδωκάν σε ἐμοί· τί ἐποίησας;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/035.yaml
  text: Pilate answered[a], “I am not a Jew, am I? Your own nation and the chief priests handed you over to me. What have you done?”
translation:
  language: sw
  text: Pilato akajibu, “Kwani mimi ni Myahudi[a]? Taifa lako lenyewe na makuhani wakuu wamekukabidhi kwangu. Umefanya nini?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mkaaji wa Yudea.” Neno la Kigiriki linaweza kumaanisha utambulisho wa kikabila au kidini (“Myahudi”), au utambulisho wa kieneo (“mkaaji wa Yudea”), kutegemea muktadha.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: akajibu
  rationale: Ni kitenzi cha kawaida na cha asili katika masimulizi ya mazungumzo, nacho kinaonyesha kwamba Pilato aliitikia maneno yaliyotangulia.
- source_word: Μήτι
  choice: Kwani mimi ni ...?
  rationale: “Kwani” katika swali hili la balagha hudokeza kwamba jibu linalotarajiwa ni la kukataa, bila kulifanya swali kuwa tamko la moja kwa moja.
- source_word: Ἰουδαῖός
  choice: Myahudi
  rationale: Katika muktadha huu Pilato anajitofautisha na Yesu na taifa la Yesu kwa utambulisho wa kikabila na kidini. “Myahudi” ndiyo tafsiri ya kawaida na inayoeleweka zaidi; hata hivyo, maana ya “mkaaji wa Yudea” bado inawezekana na imeonyeshwa katika tanbihi.
- source_word: τὸ ἔθνος τὸ σὸν
  choice: Taifa lako lenyewe
  rationale: “Taifa” linaonyesha jamii ya watu kwa ujumla, na “lenyewe” linadumisha msisitizo wa kiwakilishi τὸ σὸν pamoja na sauti ya Pilato ya kujitenga nao.
- source_word: ἀρχιερεῖς
  choice: makuhani wakuu
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa viongozi wa ukuhani wa Yerusalemu wanaotajwa kwa wingi.
- source_word: παρέδωκάν σε ἐμοί
  choice: wamekukabidhi kwangu
  rationale: Tafsiri hii inadumisha maana ya kumtia mtu chini ya mamlaka ya mwingine katika mazingira ya kisheria, bila kuingiza moja kwa moja maana nzito zaidi ya kumsaliti.
- source_word: τί ἐποίησας
  choice: Umefanya nini?
  rationale: Wakati timilifu wa Kiswahili unaonyesha tendo lililokamilika ambalo matokeo yake yanahusika katika uchunguzi wa sasa wa Pilato.
theological_decisions:
- issue: Maana ya Ἰουδαῖος katika Injili ya Yohana
  choice: Myahudi
  alternative: Mkaaji wa Yudea
  rationale: Swali la Pilato, likifuatwa na kutajwa kwa “taifa lako lenyewe,” linaelekea kwenye maana pana ya utambulisho wa kitaifa, kikabila, au kidini kuliko maana finyu ya eneo la Yudea. Hata hivyo, kwa kuwa neno la Kigiriki linaweza kuwa na maana ya kieneo kulingana na muktadha, uwezekano huo umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. “Kwani” limetumiwa kudumisha nguvu ya swali la balagha linalotarajia jibu la kukataa. Alama ya tanbihi imewekwa baada ya “Myahudi,” neno ambalo tanbihi inalifafanua.
