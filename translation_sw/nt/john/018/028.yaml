  source_fidelity: 'Tafsiri inafuata kwa uaminifu muundo na maana ya Kigiriki: uhamisho wa Yesu kutoka kwa Kayafa kwenda praetorium, asubuhi na mapema, msisitizo wa “wao wenyewe,” kujiepusha na unajisi wa kiibada, na kusudi la kula Pasaka. Utata wa “kula Pasaka” umehifadhiwa bila kuamua mjadala wa kronolojia.'
