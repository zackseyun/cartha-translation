id: JHN.18.28
reference: John 18:28
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Ἄγουσιν οὖν τὸν Ἰησοῦν ἀπὸ τοῦ Καϊάφα εἰς τὸ πραιτώριον· ἦν δὲ πρωΐ· καὶ αὐτοὶ οὐκ εἰσῆλθον εἰς τὸ πραιτώριον, ἵνα μὴ μιανθῶσιν ⸀ἀλλὰ φάγωσιν τὸ πάσχα.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/028.yaml
  text: So they led Jesus from Caiaphas into the governor’s headquarters[a]. Now it was early morning. They themselves did not enter the headquarters, so that they would not be defiled[c][b], but could eat the Passover.
translation:
  language: sw
  text: Basi wakampeleka Yesu kutoka kwa Kayafa hadi makao makuu ya gavana[a]. Ilikuwa asubuhi na mapema. Wao wenyewe hawakuingia katika makao hayo, ili wasiwe najisi[b], bali waweze kula Pasaka[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Praitorio,” yaani makao rasmi na kituo cha hukumu cha gavana wa Roma.
    reason: lexical_alternative
  - marker: b
    text: “Kuwa najisi” hapa kunamaanisha kutokuwa safi kwa taratibu za kidini.
    reason: cultural_note
  - marker: c
    text: “Kula Pasaka” huenda kunamaanisha hasa kula mlo wa Pasaka, au kwa maana pana zaidi kula milo na kushiriki maadhimisho ya sikukuu ya Pasaka.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἄγουσιν
  choice: wakampeleka
  rationale: Wakati uliopo wa kihistoria umetafsiriwa kwa wakati uliopita wa masimulizi; kitenzi hiki kinaonyesha Yesu akiongozwa akiwa chini ya ulinzi.
- source_word: οὖν
  choice: Basi
  rationale: Huhifadhi kiunganishi cha mwendelezo au hitimisho la simulizi kwa Kiswahili cha kawaida.
- source_word: πραιτώριον
  choice: makao makuu ya gavana
  rationale: Huwasilisha kwa uwazi mahali rasmi pa gavana wa Roma, palipotumika kama makao na kituo cha utawala na hukumu, bila kutegemea neno la mkopo lisiloeleweka kwa wengi.
- source_word: πρωΐ
  choice: asubuhi na mapema
  rationale: Huonyesha sehemu ya mapema ya siku bila kulazimisha maana mahususi ya mapambazuko.
- source_word: αὐτοὶ
  choice: Wao wenyewe
  rationale: Huhifadhi msisitizo wa kiwakilishi na utofauti kati ya kumfikisha Yesu na wao kukataa kuingia.
- source_word: μιανθῶσιν
  choice: wasiwe najisi
  rationale: Neno 'najisi' linaonyesha hali ya kutokuwa safi kidini au kiibada, si uchafu wa kawaida tu.
- source_word: φάγωσιν τὸ πάσχα
  choice: waweze kula Pasaka
  rationale: Huhifadhi usemi wa chanzo na kuacha wazi ikiwa unamaanisha mlo wa Pasaka hasa au milo na maadhimisho ya sikukuu kwa maana pana.
- source_word: Καϊάφα
  choice: Kayafa
  rationale: Jina limetoholewa kwa tahajia iliyozoeleka katika Kiswahili.
- source_word: Ἰησοῦν
  choice: Yesu
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili.
theological_decisions:
- issue: Maana ya 'kula Pasaka' kuhusiana na mpangilio wa matukio katika Injili ya Yohana
  choice: Kudumisha usemi 'kula Pasaka' bila kubainisha aina ya mlo unaorejelewa.
  alternative: Kula mlo wa Pasaka; kula vyakula au dhabihu za sikukuu.
  rationale: Usemi wa Kigiriki ni wazi kimsingi lakini rejeo lake hasa linajadiliwa. Tafsiri hii inadumisha utata halisi na mvutano wa mpangilio wa matukio badala ya kuutatua kimyakimya.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. 'Makao makuu ya gavana' yanaeleweka kwa wasomaji wa kawaida; 'najisi' huhifadhi maana ya kidini na kufafanuliwa katika tanbihi. Alama zote za tanbihi zimewekwa moja kwa moja baada ya vifungu vinavyohusika.
