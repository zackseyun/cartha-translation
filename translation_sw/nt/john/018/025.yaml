  text: Ἦν δὲ Σίμων Πέτρος ἑστὼς καὶ θερμαινόμενος. εἶπον οὖν αὐτῷ· Μὴ καὶ σὺ ἐκ τῶν μαθητῶν αὐτοῦ εἶ; ⸀ἠρνήσατο ἐκεῖνος καὶ εἶπεν· Οὐκ εἰμί.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/025.yaml
  text: Simon Peter was standing and warming himself. So they said to him[a], “You are not also one of his disciples, are you?” He denied it and said, “I am not.”
translation:
  language: sw
  text: Naye Simoni Petro alikuwa amesimama akijipasha moto. Basi wakamwambia[a], “Wewe pia si mmoja wa wanafunzi wake, sivyo?” Akakana na kusema, “Mimi si mmoja wao.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Hakika wewe pia si mmoja wa wanafunzi wake?” Swali la Kigiriki lenye μή linatarajia jibu la kukataa.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦν δὲ Σίμων Πέτρος
  choice: Naye Simoni Petro alikuwa
  rationale: δέ ni kiunganishi hafifu kinachoendeleza simulizi na kumrudisha Petro kuwa mhusika mkuu wa sentensi; “Naye” huleta mtiririko huo kwa Kiswahili bila kuweka mkazo mkubwa wa upinzani.
- source_word: ἑστὼς
  choice: amesimama
  rationale: Kauli ya hali timilifu inaonyesha Petro akiwa katika hali inayoendelea ya kusimama; “alikuwa amesimama” ni Kiswahili cha kawaida kwa hali hiyo.
- source_word: θερμαινόμενος
  choice: akijipasha moto
  rationale: Kitenzi kinaonyesha Petro akijitia joto. Mahali pa moto palipo hakutajwi wazi katika mstari huu, kwa hiyo hakuna nyongeza kama “kando ya moto.”
- source_word: εἶπον οὖν αὐτῷ
  choice: Basi wakamwambia
  rationale: οὖν huunganisha swali na hali iliyotangulia; “Basi” ni kiunganishi cha kawaida katika simulizi. Wingi usio na jina maalumu umehifadhiwa kwa “waka-,” na “kumwambia” hudumisha maana ya εἶπον.
- source_word: Μὴ καὶ σὺ ... εἶ;
  choice: Wewe pia si ... sivyo?
  rationale: μή hufanya swali litarajie jibu la kukataa. Muundo wa Kiswahili “si ... sivyo?” huhifadhi matarajio hayo, na “pia” huwakilisha καί.
- source_word: ἐκ τῶν μαθητῶν αὐτοῦ
  choice: mmoja wa wanafunzi wake
  rationale: ἐκ pamoja na uhusiano wa kundi humaanisha kuwa mshiriki wa kundi; “mmoja wa” ni Kiswahili cha asili na sahihi.
- source_word: ἠρνήσατο ἐκεῖνος
  choice: Akakana
  rationale: Kitenzi kinamaanisha kukataa kukiri dai lililoulizwa. Kiswahili kinaweza kutumia “akakana” bila kuongeza yambwa, na kiwakilishi chenye mkazo ἐκεῖνος hakihitaji tafsiri nzito hapa.
- source_word: Οὐκ εἰμί
  choice: Mimi si mmoja wao
  rationale: Jibu la Kigiriki ni fupi na linaacha kijalizo kieleweke kutokana na swali. Kiswahili cha kawaida kinahitaji kijalizo ili kuepuka maana potovu ya “si mimi”; “mmoja wao” hurudia tu uanachama ulioulizwa bila kupanua wigo wa kukana.
theological_decisions:
- issue: Asili ya kukana kwa Petro
  choice: Kauli imetafsiriwa kuwa kukataa kwamba yeye ni mmoja wa wanafunzi wa Yesu.
  alternative: Kupanua kauli kuwa kukana kwa jumla zaidi uhusiano wake wote na Yesu.
  rationale: Muktadha wa kisarufi unaweka kukana huku katika jibu la swali kuhusu kuwa mmoja wa wanafunzi wake. Tafsiri haiongezi madai mapana ya kiteolojia kuliko mstari wenyewe.
- issue: Matarajio yaliyomo katika swali lenye μή
  choice: Muundo “si ... sivyo?” unaonyesha kuwa waulizaji wanatarajia jibu la kukataa.
  alternative: Swali lisiloelekeza, kama “Je, wewe pia ni mmoja wa wanafunzi wake?”
  rationale: Swali lisiloelekeza lingeondoa mwelekeo halisi wa μή na hivyo kupunguza mvutano wa simulizi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wa kawaida lakini wenye heshima. “Kujipasha moto” ni usemi wa sasa unaoeleweka kwa urahisi. Muundo wa swali umechaguliwa ili kuhifadhi matarajio ya jibu hasi yaliyomo katika Kigiriki.
