  text: εἶπεν οὖν ὁ Ἰησοῦς τῷ Πέτρῳ· Βάλε τὴν ⸀μάχαιραν εἰς τὴν θήκην· τὸ ποτήριον ὃ δέδωκέν μοι ὁ πατὴρ οὐ μὴ πίω αὐτό;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/011.yaml
  text: So Jesus said to Peter[a], “Put the sword into its sheath[b]. Shall I not drink the cup that the Father has given me?”
translation:
  language: sw
  text: Basi Yesu akamwambia Petro, “Rudisha upanga kwenye ala yake.[a] Je, nisikinywe kikombe ambacho Baba amenipa?[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kifuko cha upanga.”
    reason: lexical_alternative
  - marker: b
    text: Katika Biblia, “kikombe” hutumiwa kwa njia ya sitiari kumaanisha mateso au fungu alilopanga Mungu; linganisha na sala ya Yesu huko Gethsemane (Math. 26:39; Marko 14:36; Luka 22:42).
    reason: cross_reference
lexical_decisions:
- source_word: οὖν
  choice: Basi
  rationale: Inaonyesha mwendelezo na matokeo katika simulizi kwa Kiswahili cha kawaida bila kufanya kiunganishi hicho kiwe kizito kupita kiasi.
- source_word: Βάλε
  choice: Rudisha
  rationale: Katika mazingira haya, amri ya kuweka upanga ndani ya ala yake ina maana ya kuurudisha humo; ‘rudisha’ ni ya kawaida na huwasilisha amri hiyo wazi.
- source_word: μάχαιραν
  choice: upanga
  rationale: Ni neno la kawaida na linaloeleweka kwa silaha yenye makali katika tukio hili, bila kulibana kuwa lazima jambia au upanga mfupi.
- source_word: θήκην
  choice: ala yake
  rationale: ‘Ala’ humaanisha kifuniko au nyumba ya upanga. Kiwakilishi ‘yake’ ni cha kawaida kwa Kiswahili katika usemi huu, ingawa Kigiriki kina kibainishi tu.
- source_word: ποτήριον
  choice: kikombe
  rationale: Inahifadhi sitiari ya Kibiblia badala ya kuifafanua katika matini kuwa mateso, kifo, au ghadhabu.
- source_word: δέδωκέν
  choice: amenipa
  rationale: Wakati timilifu wa Kiswahili unaonyesha tendo lililokamilika ambalo matokeo yake yanaendelea kuwa muhimu sasa.
- source_word: ὁ πατήρ
  choice: Baba
  rationale: Inahifadhi mtindo wa Yohana na haiongezi ‘Baba yangu,’ jambo ambalo halijaelezwa moja kwa moja katika Kigiriki.
- source_word: οὐ μὴ πίω αὐτό;
  choice: Je, nisikinywe ...?
  rationale: Swali hili la balagha linatarajia jibu la kukubali kwamba Yesu atakinywa. Muundo huu wa Kiswahili huhifadhi nguvu ya swali bila kuligeuza kuwa kauli.
theological_decisions:
- issue: Maana ya ‘kikombe’
  choice: Kudumisha ‘kikombe’ kama sitiari ya mateso au fungu alilopewa Yesu na Baba, bila kuifafanua zaidi katika matini kuu.
  alternative: mateso aliyopangiwa Yesu; fungu alilopewa na Baba; kikombe cha ghadhabu ya Mungu
  rationale: Muktadha unaunga mkono maana ya mateso yaliyowekwa mbele ya Yesu, lakini mstari wenyewe hauibani sitiari hiyo kwa ufafanuzi mmoja wa kimafundisho.
- issue: Uhusiano wa Yesu na Baba katika ‘Baba amenipa’
  choice: Kutafsiri kwa uwazi kama utii wa Yesu kwa Baba bila kuongeza maelezo ya kimafundisho.
  alternative: Baba yangu amenipangia hili; Baba amenikabidhi hili
  rationale: Matini inaonyesha kukubali kwa hiari kile ambacho Baba amempa Yesu. Tafsiri ya moja kwa moja hudumisha heshima yake na haiongezi maneno yasiyokuwamo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Sitiari ya ‘kikombe’ imehifadhiwa, na swali la balagha limeachwa kuwa swali.
