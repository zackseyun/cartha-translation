  text: ἵνα ὁ λόγος τοῦ Ἰησοῦ πληρωθῇ ὃν εἶπεν σημαίνων ποίῳ θανάτῳ ἤμελλεν ἀποθνῄσκειν.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/032.yaml
  text: so that the word of Jesus would be fulfilled[a], which he had spoken[c][b], indicating by what kind of death he was about to die.
translation:
  language: sw
  text: ili neno la Yesu alilokuwa amelisema litimizwe[a], akionyesha namna ambayo alikuwa karibu kufa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kauli ya Yesu.”
    reason: lexical_alternative
  - marker: b
    text: Yaani, Yesu alikuwa ameonyesha namna ya kifo chake, labda akirejelea kusulubiwa (linganisha Yohana 12:32–33).
    reason: cross_reference
lexical_decisions:
- source_word: ἵνα
  choice: ili
  rationale: Huanzisha kusudi au matokeo; “ili” ni ya kawaida katika Kiswahili na inadumisha nguvu ya kishabaha ya kishazi.
- source_word: ὁ λόγος τοῦ Ἰησοῦ
  choice: neno la Yesu
  rationale: Hapa λόγος ni kauli aliyosema Yesu, si jina la cheo “Neno” katika Yohana 1:1. “Neno la Yesu” inadumisha pia mtindo wa kutimizwa kwa neno.
- source_word: πληρωθῇ
  choice: litimizwe
  rationale: Kitenzi cha kutendwa kinadumishwa na kinaendeleza lugha muhimu ya utimilifu katika Injili ya Yohana.
- source_word: ὃν εἶπεν
  choice: ambalo alikuwa amesema
  rationale: Kiwakilishi kinarejelea “neno,” na wakati uliopita timilifu unaonyesha kuwa kauli hiyo ilitangulia tukio linalosimuliwa.
- source_word: σημαίνων
  choice: akionyesha
  rationale: Huidumisha kama kishiriki kinachomweleza Yesu aliposema kauli hiyo, bila kukifanya kwa lazima kuwa kishazi cha kusudi.
- source_word: ποίῳ θανάτῳ
  choice: kifo cha aina gani
  rationale: ποίῳ huuliza aina au namna ya kifo, si ukweli wa kufa tu; muundo huu ni wazi na wa kawaida kwa wasomaji wa Kiswahili.
- source_word: ἤμελλεν ἀποθνῄσκειν
  choice: angekufa
  rationale: Huwasilisha kifo kilichokuwa mbele yake katika simulizi bila kuingiza kwa lazima maana nzito zaidi ya kuamuliwa tangu awali.
theological_decisions:
- issue: Lugha ya utimilifu kuhusu utabiri wa Yesu
  choice: “neno la Yesu litimizwe”
  alternative: “aliyosema Yesu yatimie”
  rationale: Neno “litimizwe” linahifadhi lugha ya πληρωθῇ na uzito wake katika Yohana, ambapo tukio linatimiza kauli ya Yesu.
- issue: Nguvu ya μέλλω kuhusiana na kifo cha Yesu
  choice: “angekufa”
  alternative: “alikuwa amekusudiwa kufa”
  rationale: Tafsiri hii inaonyesha tukio la baadaye kwa mtazamo wa simulizi bila kuingiza dai kali zaidi la kimafundisho ambalo μέλλω hailazimishi hapa.
- issue: Uhusiano wa σημαίνων na εἶπεν
  choice: “alikuwa amesema, akionyesha”
  alternative: “alikuwa amesema ili kuonyesha”
  rationale: Muundo wa kishiriki unadumisha uwezekano wa kuelewa maneno ya Yesu kuwa yalionyesha namna ya kifo chake, bila kuamua kimya kimya kuwa maana yake ni kusudi pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa sasa, wenye heshima na unaoeleweka kwa wasomaji wa kawaida. “Akionyesha” inadumisha muundo wa kishiriki wa Kigiriki, huku tanbihi ikitoa uwezekano wa maana ya kusudi.
