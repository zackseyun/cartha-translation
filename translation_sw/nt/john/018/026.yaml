  text: λέγει εἷς ἐκ τῶν δούλων τοῦ ἀρχιερέως, συγγενὴς ὢν οὗ ἀπέκοψεν Πέτρος τὸ ὠτίον· Οὐκ ἐγώ σε εἶδον ἐν τῷ κήπῳ μετ’ αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/026.yaml
  text: One of the high priest’s servants[a], being a relative of the man whose ear Peter had cut off, said, “Didn’t I see you in the garden with him?”
translation:
  language: sw
  text: Mmoja wa watumwa wa kuhani mkuu, aliyekuwa jamaa ya yule mtu ambaye Petro alikuwa amemkata sikio, akasema, “Je, si mimi niliyekuona bustanini pamoja naye?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δούλων
  choice: watumwa
  rationale: Neno δοῦλος katika mazingira haya linamaanisha watu wa nyumba waliokuwa chini ya umiliki wa kuhani mkuu; “watumwa” huhifadhi hali yao ya utumwa badala ya kuipunguza kuwa utumishi wa kawaida.
- source_word: ἀρχιερέως
  choice: kuhani mkuu
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa cheo cha ἀρχιερεύς katika simulizi la mateso ya Yesu.
- source_word: συγγενὴς ὢν
  choice: ambaye alikuwa jamaa
  rationale: Hueleza uhusiano wa kifamilia wa msemaji kwa lugha ya kawaida bila kuongeza kiwango kisichotajwa cha undugu.
- source_word: οὗ
  choice: ya yule mtu ambaye
  rationale: Kiwakilishi cha Kigiriki humrejelea mwenye sikio; kumtaja wazi “yule mtu” hufanya sentensi iwe wazi na ya kawaida katika Kiswahili.
- source_word: ἀπέκοψεν
  choice: alikuwa amemkata
  rationale: Muundo huu unaonyesha kwamba tendo la Petro la kukata sikio lilikuwa limetokea kabla ya kauli hii.
- source_word: ὠτίον
  choice: sikio
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida; udogo wa kimofolojia wa neno la Kigiriki hauhitaji kuonyeshwa hapa.
- source_word: Οὐκ ἐγώ σε εἶδον
  choice: Je, si mimi niliyekuona
  rationale: Huhifadhi swali linalotarajia jibu la kukubali na pia mkazo wa ἐγώ, “mimi.”
- source_word: ἐν τῷ κήπῳ
  choice: bustanini
  rationale: κήπος humaanisha bustani katika muktadha huu, mahali Yesu alipokamatwa.
- source_word: μετ’ αὐτοῦ
  choice: pamoja naye
  rationale: Ni tafsiri ya asili ya Kiswahili; kiwakilishi kinamrejelea Yesu kutokana na muktadha.
theological_decisions:
- issue: Tafsiri ya δοῦλος katika mazingira halisi ya nyumba
  choice: watumwa
  alternative: watumishi
  rationale: Muktadha unaonyesha watu waliokuwa katika hali ya utumwa chini ya nyumba ya kuhani mkuu. “Watumwa” huhifadhi uhalisi huo wa kijamii, ilhali “watumishi” lingeweza kuufifisha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa swali umechaguliwa ili kudumisha mkazo wa msemaji bila kuwa mgumu, na hakuna tanbihi inayohitajika kwa kuwa “watumwa” huwasilisha maana ya muktadha moja kwa moja.
