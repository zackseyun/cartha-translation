base_translation:
  language: en
  yaml_path: translation/nt/john/018/034.yaml
  text: Jesus answered[a], “Are you saying this on your own, or did others tell you about me?”
translation:
  language: sw
  text: Yesu akajibu, “Je, wewe mwenyewe unasema hivi[a], au wengine walikuambia kunihusu?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Je, unasema hivi kwa nafsi yako mwenyewe?” Kigiriki kinasema kihalisi “kutoka kwako mwenyewe,” kikionyesha swali la kama kauli hiyo ilitoka kwa Pilato binafsi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: akajibu
  rationale: Ni kitenzi cha kawaida katika masimulizi kinachoonyesha kwamba Yesu alitoa jibu katika mazungumzo yanayoendelea.
- source_word: Ἀπὸ σεαυτοῦ
  choice: kutokana na wewe mwenyewe
  rationale: 'Muundo huu unahifadhi wazo la chanzo au asili ya kauli: kama maneno hayo yalitokana na Pilato binafsi. Tanbihi inatoa usemi wa Kiswahili ulio huru zaidi.'
- source_word: σὺ
  choice: wewe
  rationale: Kiwakilishi kilichotajwa wazi katika Kigiriki kinaweka mkazo kwa Pilato; neno “wewe” linahifadhi mkazo huo.
- source_word: τοῦτο λέγεις
  choice: unasema hivi
  rationale: “Hivi” hurejelea swali la Pilato lililotangulia, na wakati wa sasa unafaa kwa mazungumzo ya moja kwa moja.
- source_word: ἢ
  choice: au
  rationale: Huonyesha uwezekano mwingine katika swali.
- source_word: ἄλλοι εἶπόν σοι
  choice: wengine walikuambia
  rationale: Wakati uliopita rahisi unaonyesha kwamba watu wengine huenda walimpa Pilato habari hiyo; “walikuambia” ni Kiswahili cha kawaida.
- source_word: περὶ ἐμοῦ
  choice: habari zangu
  rationale: Ni usemi wa kawaida wa Kiswahili wenye maana ya kile kilichosemwa kumhusu Yesu.
theological_decisions:
- issue: Lengo la swali la Yesu kwa Pilato
  choice: Swali linauliza kama kauli ya Pilato ilitokana naye mwenyewe au na habari alizopewa na wengine.
  alternative: “Je, unauliza hivi kwa uamuzi wako mwenyewe...?”
  rationale: Kigiriki kinakazia chanzo cha kauli bila kueleza moja kwa moja nia ya Pilato. Tafsiri haiongezi maelezo ya kiteolojia au ya kisaikolojia yasiyosemwa katika mstari.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “kutokana na wewe mwenyewe” umetumiwa ili kuhifadhi maana ya chanzo katika Kigiriki, huku tanbihi ikisaidia kwa usemi ulio huru zaidi.
