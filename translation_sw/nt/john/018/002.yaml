  yaml_path: translation/nt/john/018/002.yaml
  text: Judas, who was betraying him, also knew the place, because Jesus had often gathered there with his disciples.
translation:
  language: sw
  text: Yuda, aliyekuwa akimsaliti[a], pia alipajua mahali pale, kwa sababu Yesu alikuwa akikutana huko mara nyingi na wanafunzi wake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “aliyekuwa akimkabidhi.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa sababu Yesu alikuwa akikusanyika huko mara nyingi pamoja na wanafunzi wake.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾔδει
  choice: alipajua
  rationale: Kitenzi hiki kinaonyesha kwamba Yuda alifahamu mahali hapo. Kiambishi cha ngeli -pa- kinaelekeza kwa kawaida na kwa uwazi kwenye mahali.
- source_word: δὲ
  choice: hakikutafsiriwa kwa neno tofauti
  rationale: Hapa δέ ni kiunganishi hafifu cha kuendeleza simulizi. Mtiririko wa Kiswahili hauhitaji ‘basi’ au ‘lakini,’ ambayo ingeweza kuongeza mpito au utofautishaji usio wazi katika chanzo.
- source_word: καὶ
  choice: pia
  rationale: ‘Pia’ kinahifadhi maana ya nyongeza ya καί kwa njia ya kawaida katika Kiswahili.
- source_word: ὁ παραδιδοὺς αὐτὸν
  choice: aliyekuwa akimsaliti
  rationale: Kauli hii inamtambulisha Yuda kwa tendo lake lililokuwa likiendelea katika simulizi. ‘Kumsaliti’ huwasilisha maana ya kimuktadha ya παραδίδωμι katika simulizi la mateso.
- source_word: τὸν τόπον
  choice: mahali pale
  rationale: ‘Mahali pale’ ni rejeleo la kawaida la Kiswahili kwa eneo lililotajwa na linalojulikana katika muktadha.
- source_word: ὅτι
  choice: kwa sababu
  rationale: Hapa ὅτι inaeleza sababu iliyomfanya Yuda apajue mahali hapo.
- source_word: πολλάκις
  choice: mara nyingi
  rationale: Hii huonyesha kwa uwazi tendo lililotokea kwa kurudiwa-rudiwa.
- source_word: συνήχθη
  choice: alikuwa akikutana
  rationale: 'Ingawa umbo la Kigiriki ni la kutendwa, katika muktadha linaweza kuwa na maana isiyoelekeza tendo kwa kitu: kukusanyika au kukutana. ‘Alikuwa akikutana’ ni Kiswahili cha kawaida na huonyesha mikutano ya mara kwa mara.'
- source_word: μετὰ τῶν μαθητῶν αὐτοῦ
  choice: na wanafunzi wake
  rationale: ‘Na’ huwasilisha ushirika unaoonyeshwa na μετά, na ‘wanafunzi wake’ huhifadhi uhusiano wa mwalimu na wanafunzi.
theological_decisions:
- issue: Maana ya παραδιδοὺς kuhusu Yuda
  choice: akimsaliti
  alternative: akimkabidhi
  rationale: Katika simulizi la mateso, neno hili linahusu tendo la Yuda la kumsaliti Yesu, lakini tanbihi inadumisha maana halisi zaidi ya kumkabidhi kwa wengine.
- issue: Maana ya συνήχθη
  choice: alikuwa akikutana huko mara nyingi na wanafunzi wake
  alternative: alikuwa akikusanyika huko mara nyingi pamoja na wanafunzi wake
  rationale: Tafsiri kuu hutumia usemi wa kawaida wa Kiswahili bila kufuta uwezekano wa lugha ya kukusanyika, ambao umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. ‘Alipajua mahali pale’ ni ya asili kuliko ‘alijua mahali pale,’ na ‘alikuwa akikutana’ huonyesha desturi ya wakati uliopita kwa ufasaha.
