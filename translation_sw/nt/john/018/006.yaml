  text: So when he said to them[a], “I am he,” they went backward and fell to the ground.
translation:
  language: sw
  text: Basi, alipowaambia[a], “Mimi ndiye,” walirudi nyuma, wakaanguka chini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa Kigiriki, “Mimi ni.” Usemi huo unaweza pia kuwa na mwangwi wa kauli za pekee za “Mimi ni” katika Injili ya Yohana.
