lexical_decisions:
- source_word: ὡς οὖν
  choice: Basi, alipo-
  rationale: Muundo huu wa Kiswahili unaunganisha kiunganishi cha simulizi οὖν na maana ya wakati ya ὡς kwa lugha ya kawaida.
- source_word: εἶπεν αὐτοῖς
  choice: alipowaambia
  rationale: Hutoa kwa kawaida kitendo cha kusema pamoja na walengwa wake, bila kubadili maana kuwa maelezo yasiyo ya moja kwa moja.
- source_word: Ἐγώ εἰμι
  choice: Mimi ndiye
  rationale: Katika muktadha wa kutambuliwa kwa mtu, hii ni kauli ya kawaida ya Kiswahili inayojibu ni nani anayetafutwa; tanbihi inahifadhi tafsiri ya karibu zaidi na umbo la Kigiriki pamoja na mwangwi wake unaowezekana katika Yohana.
- source_word: ἀπῆλθον εἰς τὰ ὀπίσω
  choice: walirudi nyuma
  rationale: Inahifadhi wazi mwendo wa kuelekea nyuma kwa Kiswahili cha kawaida na cha sasa.
- source_word: ἔπεσαν χαμαί
  choice: wakaanguka chini
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha kuanguka mpaka ardhini.
theological_decisions:
- issue: Tafsiri ya Ἐγώ εἰμι katika muktadha wa Yohana wenye mwangwi wa kitheolojia unaowezekana
  choice: Mimi ndiye
  alternative: Mimi niko
  rationale: Muktadha wa karibu unaonyesha kujitambulisha, hivyo matini kuu inatumia Kiswahili kinachoeleweka kwa kawaida. Hata hivyo, tanbihi inahifadhi umbo la karibu zaidi na Kigiriki na uwezekano wa mwangwi wa kauli za pekee za “Mimi niko” katika Yohana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Mpangilio wa vitenzi “walirudi nyuma, wakaanguka” unadumisha mwendo wa simulizi.
