  text: καὶ ⸀ἤγαγον πρὸς Ἅνναν πρῶτον· ἦν γὰρ πενθερὸς τοῦ Καϊάφα, ὃς ἦν ἀρχιερεὺς τοῦ ἐνιαυτοῦ ἐκείνου·
base_translation:
  language: en
  yaml_path: translation/nt/john/018/013.yaml
  text: And they led him first to Annas, for he was the father-in-law of Caiaphas, who was high priest that year.
translation:
  language: sw
  text: Nao wakampeleka kwanza kwa Anasi, kwa maana alikuwa baba mkwe wa Kayafa, aliyekuwa kuhani mkuu mwaka ule.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤγαγον
  choice: wakampeleka
  rationale: Kitenzi ἄγω kina maana ya kuongoza au kupeleka. Katika muktadha wa kukamatwa na kuhamishwa chini ya ulinzi, “wakampeleka” ni Kiswahili cha kawaida na huonyesha tendo hilo wazi; kiwakilishi cha yambwa kinarejelea Yesu kutokana na muktadha.
- source_word: πρὸς Ἅνναν
  choice: kwa Anasi
  rationale: πρός pamoja na hali ya kushutumiwa huonyesha mwendo kuelekea kwa mtu. “Kwa Anasi” ni usemi wa kawaida wa Kiswahili kwa kumpeleka mtu mahali alipo mtu mwingine.
- source_word: πρῶτον
  choice: kwanza
  rationale: Neno hili limetumiwa kama kielezi cha mpangilio na linaonyesha kwamba Anasi ndiye aliyekuwa kituo cha kwanza.
- source_word: πενθερός
  choice: baba mkwe
  rationale: πενθερός humaanisha hasa baba wa mke; “baba mkwe” ni sawa sahihi na ya kawaida katika Kiswahili.
- source_word: ἀρχιερεύς
  choice: kuhani mkuu
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa cheo cha juu kabisa cha ukuhani wa Kiyahudi.
- source_word: τοῦ ἐνιαυτοῦ ἐκείνου
  choice: mwaka ule
  rationale: Kirai hiki kinatoa alama ya wakati. “Mwaka ule” ni cha asili na huhifadhi maana ya Kigiriki bila ugumu wa tafsiri ya neno kwa neno.
- source_word: Ἅνναν
  choice: Anasi
  rationale: Jina limetoholewa kwa umbo lililozoeleka katika matumizi ya Biblia ya Kiswahili.
- source_word: Καϊάφα
  choice: Kayafa
  rationale: Jina limetoholewa kwa umbo la kawaida na linalosomeka kwa urahisi katika Kiswahili.
theological_decisions:
- issue: Kirejeleo cha “aliyekuwa kuhani mkuu mwaka ule”
  choice: Kishazi cha uhusiano kinamrejelea Kayafa.
  alternative: Kukipanga kwa namna ambayo kingeweza kueleweka kuwa kinamrejelea Anasi.
  rationale: Katika Kigiriki, kiwakilishi ὃς kinamrejelea kwa kawaida nomino iliyo karibu zaidi, Καϊάφα. Mpangilio wa Kiswahili umehifadhi uhusiano huo bila kuingiza utata usiokuwapo katika chanzo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Kiunganishi “Nao” kinaendeleza simulizi, na “wakampeleka” kinaonyesha hatua inayofuata katika mfululizo wa matukio.
