reference: John 18:36
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς· Ἡ βασιλεία ἡ ἐμὴ οὐκ ἔστιν ἐκ τοῦ κόσμου τούτου· εἰ ἐκ τοῦ κόσμου τούτου ἦν ἡ βασιλεία ἡ ἐμή, οἱ ὑπηρέται ⸂οἱ ἐμοὶ ἠγωνίζοντο ἄν⸃, ἵνα μὴ παραδοθῶ τοῖς Ἰουδαίοις· νῦν δὲ ἡ βασιλεία ἡ ἐμὴ οὐκ ἔστιν ἐντεῦθεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/036.yaml
  text: Jesus answered[a], “My kingdom is not from this world. If my kingdom were from this world, my servants would be fighting so that I might not be handed over to the Jews. But as it is, my kingdom is not from here.”
translation:
  language: sw
  text: Yesu akajibu, “Ufalme wangu hautokani na ulimwengu huu. Kama ufalme wangu ungetokana na ulimwengu huu, watumishi wangu wangekuwa wakipigana ili nisikabidhiwe kwa Wayahudi[a]. Lakini kwa hali ilivyo, ufalme wangu hautoki hapa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “watu wa Yudea”; huenda hapa neno hilo likiwataja hasa viongozi wa Kiyahudi huko Yudea.
    reason: alternative_reading
lexical_decisions:
- source_word: βασιλεία
  choice: ufalme
  rationale: “Ufalme” ni tafsiri ya kawaida na ya asili katika muktadha huu wa kifalme, nayo inaweza kuhusisha eneo la kifalme pamoja na utawala wa mfalme bila kulazimisha maana moja pekee.
- source_word: ἐκ τοῦ κόσμου τούτου
  choice: hautokani na ulimwengu huu
  rationale: Kirai hiki kinaonyesha chanzo au asili. “Hautokani na” huhifadhi maana hiyo kwa Kiswahili cha kawaida, badala ya kudokeza tu kwamba ufalme haupo ulimwenguni.
- source_word: κόσμος
  choice: ulimwengu
  rationale: “Ulimwengu” ndiyo tafsiri ya moja kwa moja na inayoeleweka; muktadha wa Yohana unaweza kuipa pia dhana ya mpangilio wa wanadamu unaompinga Mungu bila kuipanua wazi katika matini.
- source_word: ὑπηρέται
  choice: watumishi
  rationale: Neno hili linawataja walio chini ya mamlaka ya mwingine. “Watumishi” linafaa katika muktadha wa ufalme na haliongezi maana maalumu ya maafisa au polisi.
- source_word: ἠγωνίζοντο ἄν
  choice: wangekuwa wakipigana
  rationale: Muundo huu wa hali isiyotimia unaonyesha tendo ambalo lingeendelea katika hali ya kudhaniwa; “wangekuwa wakipigana” huhifadhi hali hiyo kuliko “wangepigana” pekee.
- source_word: ἵνα μὴ παραδοθῶ
  choice: ili nisikabidhiwe
  rationale: “Ili” huonyesha kusudi, na “nisikabidhiwe” ni Kiswahili cha sasa kinachohifadhi wazo la kukabidhiwa mikononi mwa wenye mamlaka.
- source_word: τοῖς Ἰουδαίοις
  choice: kwa Wayahudi
  rationale: “Wayahudi” huhifadhi maana pana ya neno la Kigiriki; kwa kuwa katika muktadha huu huenda likawalenga hasa watu wa Yudea au viongozi wao, uwezekano huo umewekwa katika tanbihi badala ya kuingizwa katika matini.
- source_word: νῦν δὲ
  choice: Lakini kwa hali ilivyo
  rationale: Hapa maneno haya yanatofautisha hali halisi na hali ya kudhaniwa iliyotangulia. Kauli hii huwasilisha utofauti huo kwa Kiswahili cha asili.
- source_word: ἐντεῦθεν
  choice: hautoki hapa
  rationale: “Hapa” huhifadhi usemi elekezi wa Kigiriki na pia tofauti ndogo ya maneno kati ya hitimisho hili na kauli ya awali kuhusu ulimwengu.
theological_decisions:
- issue: Asili ya ufalme wa Yesu katika uhusiano wake na ulimwengu
  choice: “Hautokani na ulimwengu huu” limetumiwa kuonyesha chanzo au asili.
  alternative: “Si wa ulimwengu huu” au “si sehemu ya ulimwengu huu.”
  rationale: Kauli ya Kigiriki haikanushi kwamba ufalme wa Yesu unatenda ndani ya ulimwengu; inakanusha kwamba chanzo chake ni mpangilio wa ulimwengu huu. Tafsiri hii huhifadhi mvutano huo bila kuifanya iwe mafundisho ya kujitenga na mambo ya duniani.
- issue: Wanaorejelewa na Ἰουδαῖοι katika Yohana
  choice: Matini kuu ina “Wayahudi,” huku tanbihi ikihifadhi uwezekano wa maana nyembamba ya kimuktadha.
  alternative: “Watu wa Yudea” au “viongozi wa Kiyahudi.”
  rationale: Neno la Kigiriki linaweza kumaanisha Wayahudi kwa jumla au, katika baadhi ya miktadha ya Yohana, watu wa Yudea na hasa viongozi wao. Matini kuu haifungi maana mapema, na tanbihi husaidia kueleza muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo “wangekuwa wakipigana” umechaguliwa ili kuonyesha tendo endelevu katika hali isiyotimia, huku “hautokani” na “hautoki hapa” zikihifadhi tofauti ya misemo ya Kigiriki.
