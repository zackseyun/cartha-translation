  text: λέγει οὖν ⸂τῷ Πέτρῳ ἡ παιδίσκη ἡ θυρωρός⸃· Μὴ καὶ σὺ ἐκ τῶν μαθητῶν εἶ τοῦ ἀνθρώπου τούτου; λέγει ἐκεῖνος· Οὐκ εἰμί.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/017.yaml
  text: So the servant girl who kept the door said to Peter[a], “You are not also one of this man's disciples, are you?” He said, “I am not.”
translation:
  language: sw
  text: Basi yule kijakazi aliyekuwa mlinzi wa mlango akamwambia Petro[a], “Wewe pia si mmoja wa wanafunzi wa mtu huyu, sivyo?” Petro akasema, “Mimi si mmoja wao.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “msichana mtumwa aliyekuwa mlinzi wa mlango.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Basi
  rationale: Kiunganishi hiki kinaendeleza simulizi na kuonyesha matokeo ya yaliyotangulia; “Basi” ni cha kawaida na chenye uzito unaofaa katika simulizi.
- source_word: παιδίσκη
  choice: kijakazi
  rationale: Neno hili humaanisha msichana au mwanamke kijana aliye mtumishi, na huenda pia alikuwa mtumwa. “Kijakazi” ni neno la kawaida la kibiblia na linaonyesha jinsia pamoja na hali ya utumishi bila kulazimisha uamuzi kuhusu hadhi yake ya kisheria.
- source_word: θυρωρός
  choice: aliyekuwa mlinzi wa mlango
  rationale: Hueleza jukumu la mtu aliyelinda au kuhudumia lango. Kishazi hiki ni wazi kwa wasomaji wa sasa na kinahifadhi kazi iliyotajwa katika Kigiriki.
- source_word: Μὴ καὶ σὺ
  choice: Wewe pia si ... sivyo?
  rationale: μή katika swali hudokeza kuwa jibu linalotarajiwa ni la kukataa; muundo huu wa Kiswahili unaonyesha matarajio hayo kwa njia ya kawaida.
- source_word: ἐκ τῶν μαθητῶν
  choice: mmoja wa wanafunzi
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaohifadhi maana ya kuwa sehemu ya kundi.
- source_word: τοῦ ἀνθρώπου τούτου
  choice: wa mtu huyu
  rationale: Hifadhi usemi wa kawaida na wenye umbali fulani wa “mtu huyu,” bila kuufanya kuwa cheo au kuongeza dharau isiyo dhahiri.
- source_word: ἐκεῖνος
  choice: Petro
  rationale: Kumtaja Petro tena ni kawaida na wazi katika Kiswahili, huku rejeleo la kiwakilishi cha Kigiriki likibaki lilelile.
- source_word: Οὐκ εἰμί
  choice: Mimi siye
  rationale: Jibu hili fupi linahifadhi ukataaji wa moja kwa moja na wa kidokezo wa Kigiriki, yaani, “Mimi si mmoja wao.”
theological_decisions:
- issue: Nguvu ya swali hasi linaloanzishwa na μή
  choice: 'Kulitoa kama swali linalotarajia jibu hasi: “Wewe pia si ... sivyo?”'
  alternative: “Je, wewe pia ni mmoja wa ...?” bila kuonyesha jibu linalotarajiwa
  rationale: Muundo uliochaguliwa unahifadhi mwelekeo wa kisarufi wa swali la Kigiriki bila kuzidisha sauti au nia ya msemaji.
- issue: Hadhi ya kijamii inayoweza kudokezwa na παιδίσκη
  choice: Kutumia “kijakazi” katika matini kuu
  alternative: “msichana mtumwa”
  rationale: Neno la Kigiriki linaweza kumaanisha mtumishi wa kike au mtumwa wa kike. Muktadha unatilia mkazo zaidi jinsia, umri wa kiasi, na jukumu lake kuliko hadhi yake mahususi ya kisheria; tanbihi huhifadhi uwezekano mwingine.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa simulizi ulio wa kawaida na wenye staha. “Kijakazi” lina ladha ya kibiblia lakini bado linaeleweka; tanbihi inaweka wazi uwezekano wa hadhi ya utumwa. Swali hasi limetungwa kwa “si ... sivyo?” ili kuhifadhi matarajio ya jibu la kukataa.
