  text: εἶπεν οὖν αὐτοῖς ⸀ὁ Πιλᾶτος· Λάβετε αὐτὸν ὑμεῖς, καὶ κατὰ τὸν νόμον ὑμῶν κρίνατε αὐτόν. ⸀εἶπον αὐτῷ οἱ Ἰουδαῖοι· Ἡμῖν οὐκ ἔξεστιν ἀποκτεῖναι οὐδένα·
base_translation:
  language: en
  yaml_path: translation/nt/john/018/031.yaml
  text: So Pilate said to them[a], “Take him yourselves and judge him according to your law.” The Jews said to him, “It is not lawful for us to put anyone to death.”
translation:
  language: sw
  text: Basi Pilato akawaambia, “Mchukueni ninyi wenyewe, mkamhukumu kulingana na sheria yenu.” Wayahudi[a] wakamwambia, “Sisi haturuhusiwi kumuua mtu yeyote.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kigiriki: “Wayahudi” (hoi Ioudaioi); katika muktadha huu, neno hilo linawarejelea wale waliokuwa wakizungumza na Pilato—hasa viongozi au washtaki wa Kiyahudi—si Wayahudi wote kwa ujumla.'
    reason: Hufafanua rejeleo la kimuktadha bila kubana katika matini kuu usemi wa Kigiriki “Wayahudi.”
lexical_decisions:
- source_word: οὖν
  choice: Basi
  rationale: Kiunganishi hiki kinaendeleza mtiririko wa simulizi na hitimisho la kauli iliyotangulia kwa Kiswahili cha kawaida.
- source_word: Λάβετε αὐτὸν ὑμεῖς
  choice: Mchukueni ninyi wenyewe
  rationale: Kauli ya kuamuru pamoja na kiwakilishi cha wazi ὑμεῖς inasisitiza kwamba wao ndio wachukue hatua; “ninyi wenyewe” huonyesha msisitizo huo kwa Kiswahili sanifu.
- source_word: κατὰ τὸν νόμον ὑμῶν
  choice: kulingana na sheria yenu
  rationale: κατά pamoja na hali ya kushutumiwa huonyesha kipimo au kanuni inayofuatwa; tafsiri hii ni ya asili na sahihi.
- source_word: κρίνατε
  choice: mkamhukumu
  rationale: κρίνω hapa ina maana ya kutoa hukumu katika muktadha wa kisheria, bila kulazimisha wazo mahususi la kesi ya Kirumi.
- source_word: οἱ Ἰουδαῖοι
  choice: Viongozi wa Wayahudi
  rationale: Katika tukio hili, msemaji ni kundi la mamlaka au washtaki wa Kiyahudi waliokuwa mbele ya Pilato, si Wayahudi wote. Tafsiri ya kimuktadha huepusha ujumla unaopotosha, huku tanbihi ikihifadhi muundo halisi wa Kigiriki.
- source_word: Ἡμῖν οὐκ ἔξεστιν
  choice: Sisi haturuhusiwi
  rationale: ἔξεστιν hueleza jambo linaloruhusiwa au kuwa halali, na kiwakilishi ἡμῖν kinapewa msisitizo wa asili kwa “Sisi.”
- source_word: ἀποκτεῖναι οὐδένα
  choice: kumuua mtu yeyote
  rationale: ἀποκτείνω kimsingi ni kuua; muktadha ni wa utekelezaji wa hukumu ya kifo, lakini “kumuua” huhifadhi upana wa neno la Kigiriki kuliko “kumnyonga” au “kumwua kwa hukumu.”
theological_decisions:
- issue: Rejeleo la οἱ Ἰουδαῖοι katika simulizi la mateso ya Yesu
  choice: Viongozi wa Wayahudi
  alternative: Wayahudi; Wayudea
  rationale: Muktadha wa karibu unaonyesha kwamba hawa ni wenye mamlaka au washtaki wanaozungumza na Pilato. Chaguo hili halihusishi taifa lote la Wayahudi na tendo la kundi hili; tanbihi inataja kwa uwazi muundo wa Kigiriki ili ushahidi wa chanzo usifichwe.
- issue: Nguvu ya kisheria ya ἔξεστιν na ἀποκτεῖναι
  choice: Sisi haturuhusiwi kumuua mtu yeyote
  alternative: Si halali kwetu kumhukumu mtu yeyote auawe; hatuna ruhusa ya kumwua mtu yeyote
  rationale: Tafsiri inaonyesha kizuizi cha ruhusa ya kisheria bila kuamua kimyakimya chanzo au kiwango kamili cha mamlaka hiyo, jambo ambalo mstari wenyewe halifafanui.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Mchukueni ninyi wenyewe” huhifadhi msisitizo wa ὑμεῖς; “mkamhukumu” ni mtiririko wa kawaida baada ya amri; “haturuhusiwi” ni wazi kwa wasomaji wa kawaida na hudumisha maana ya kisheria.
