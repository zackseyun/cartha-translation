  text: ἀπεκρίθησαν αὐτῷ· Ἰησοῦν τὸν Ναζωραῖον. λέγει ⸀αὐτοῖς· Ἐγώ εἰμι. εἱστήκει δὲ καὶ Ἰούδας ὁ παραδιδοὺς αὐτὸν μετ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/005.yaml
  text: They answered him, “Jesus the Nazarene.” He said to them, “I am he.” Now Judas, who was betraying him, was also standing with them.
translation:
  language: sw
  text: Wakamjibu, “Yesu Mnazareti.” Akawaambia, “Ni mimi.” Yuda, aliyekuwa akimsaliti, alikuwa pia amesimama pamoja nao.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰησοῦν τὸν Ναζωραῖον
  choice: Yesu Mnazareti
  rationale: Huwasilisha kwa njia ya kawaida ya Kiswahili mtu anayetambulishwa kwa asili yake ya Nazareti.
- source_word: Ἐγώ εἰμι
  choice: Ni mimi
  rationale: Jibu fupi na la asili katika muktadha wa kujitambulisha; linadumisha msisitizo wa kiwakilishi cha Kigiriki bila kuongeza neno lisilokuwamo katika chanzo.
- source_word: ὁ παραδιδοὺς αὐτόν
  choice: aliyekuwa akimsaliti
  rationale: Kitenzi cha wakati unaoendelea kinaonyesha jukumu la Yuda katika tukio lililokuwa likiendelea; “kumsaliti” ni neno la kawaida na linalofaa kimuktadha.
- source_word: μετ’ αὐτῶν
  choice: pamoja nao
  rationale: Huhifadhi wazi kwamba Yuda alikuwa upande wa kundi lililokuja kumkamata Yesu.
theological_decisions:
- issue: Maana ya Ἐγώ εἰμι
  choice: Ni mimi
  alternative: Mimi ndiye
  rationale: Kauli inaweza kuwa jibu la kawaida la kujitambulisha huku ikibeba mwangwi mpana katika Injili ya Yohana. “Ni mimi” ni ya asili, haiongezi kirai kama “ndiye huyo,” na haiamui kimya-kimya kiwango cha maana ya kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Mpangilio wa sentensi unafuata kwa karibu mwendo wa simulizi la Kigiriki.
