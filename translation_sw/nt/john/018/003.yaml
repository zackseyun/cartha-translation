  text: ὁ οὖν Ἰούδας λαβὼν τὴν σπεῖραν καὶ ἐκ τῶν ἀρχιερέων καὶ ⸂ἐκ τῶν⸃ Φαρισαίων ὑπηρέτας ἔρχεται ἐκεῖ μετὰ φανῶν καὶ λαμπάδων καὶ ὅπλων.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/003.yaml
  text: So Judas[a], having taken the cohort and officers from the chief priests and from the Pharisees[b], comes there with lanterns and torches and weapons.
translation:
  language: sw
  text: Basi Yuda, akiwa amechukua kikosi cha askari[a] na maafisa[b] kutoka kwa makuhani wakuu na Mafarisayo, akaja huko pamoja nao, wakiwa na taa, mienge, na silaha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sehemu ya kikosi” au “kundi la askari.” Neno la Kigiriki linaweza kumaanisha kikosi cha kijeshi bila kudai kwamba kikosi kizima kilikuwepo.
    reason: lexical_alternative
  - marker: b
    text: Au “walinzi” au “walinzi wa Hekalu.” Neno hili linamaanisha watendaji rasmi waliotumikia mamlaka za Kiyahudi.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Basi
  rationale: Kiunganishi hiki kinaendeleza simulizi kwa njia ya kawaida na kuhifadhi uhusiano wake na yaliyotangulia.
- source_word: λαβὼν
  choice: akiwa amechukua
  rationale: Huhifadhi tendo la kitenzi kishirikishi lililotangulia tendo kuu, bila kulifanya kuwa tukio lisilohusiana.
- source_word: σπεῖραν
  choice: kikosi cha askari
  rationale: Ni lugha inayoeleweka kwa wasomaji wa kawaida na inaonyesha kundi la kijeshi bila kudai kwamba kikosi kizima chenye idadi kamili kilikuwepo.
- source_word: ὑπηρέτας
  choice: maafisa
  rationale: Huwaonyesha watendaji rasmi waliokuwa chini ya mamlaka za Kiyahudi bila kuwabainisha zaidi ya ushahidi wa matini.
- source_word: ἀρχιερέων
  choice: makuhani wakuu
  rationale: Hili ndilo neno la kawaida kwa viongozi wakuu wa kikuhani wanaotajwa kwa wingi.
- source_word: Φαρισαίων
  choice: Mafarisayo
  rationale: Ni umbo la kawaida la Kiswahili la jina la kundi hili.
- source_word: ἔρχεται
  choice: akaja
  rationale: Wakati uliopita wa kisimulizi ni wa asili zaidi katika Kiswahili; bado unawasilisha ujio kama tendo kuu la sentensi.
- source_word: ἐκεῖ
  choice: huko
  rationale: Hurejelea mahali palipotajwa tayari katika muktadha.
- source_word: φανῶν
  choice: taa
  rationale: Huwakilisha vyombo vya mwanga vinavyobebeka na kubaki tofauti na mienge inayofuata.
- source_word: λαμπάδων
  choice: mienge
  rationale: Huhifadhi tofauti ya kileksika kati ya λαμπάδων na φανῶν.
- source_word: ὅπλων
  choice: silaha
  rationale: Ni neno la sasa na la jumla kwa vifaa vya mapigano.
theological_decisions:
- issue: Utambulisho na muundo wa kundi lililokuja kumkamata Yesu
  choice: Kutaja kikosi cha askari na maafisa waliotoka kwa makuhani wakuu na Mafarisayo kama makundi yanayotofautishwa.
  alternative: Kutafsiri kwa ujumla kuwa ‘kundi la askari na walinzi,’ au kutaja ‘kikosi kidogo’ pekee.
  rationale: Matini inatofautisha σπεῖρα na ὑπηρέται waliotoka kwa mamlaka za Kiyahudi, lakini haisemi kwa hakika idadi ya askari wala kwamba kikosi kizima kilikuwepo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa sentensi umetenganisha kikosi cha askari na maafisa wa mamlaka za Kiyahudi, huku ukiepuka kubainisha idadi ya kikosi au wajibu wa maafisa kwa namna inayozidi matini.
