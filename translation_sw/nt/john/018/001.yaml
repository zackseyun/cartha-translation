base_translation:
  language: en
  yaml_path: translation/nt/john/018/001.yaml
  text: After saying these things[a], Jesus went out with his disciples across the Kidron Valley, where there was a garden, into which he and his disciples entered.
translation:
  language: sw
  text: Baada ya kusema hayo, Yesu alitoka pamoja na wanafunzi wake na kuvuka kijito cha Kidron[a], ambako kulikuwa na bustani; akaingia humo pamoja na wanafunzi wake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “bonde la Kidron” au “mkondo wa Kidron.” Neno la Kigiriki linamaanisha mkondo ambao kwa kawaida huwa na maji wakati wa msimu wa mvua.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα εἰπὼν
  choice: Baada ya kusema hayo
  rationale: Kirai hiki cha wakati kinaonyesha kwamba kitendo kilichofuata kilitokea baada ya Yesu kusema mambo yaliyotangulia; tafsiri hii ni ya kawaida na wazi katika Kiswahili.
- source_word: ἐξῆλθεν
  choice: alitoka
  rationale: Kitenzi hiki kina maana ya msingi ya kutoka; ‘alitoka’ kinahifadhi mwendo halisi bila kuongeza wazo la kuondoka kabisa.
- source_word: σὺν τοῖς μαθηταῖς αὐτοῦ
  choice: pamoja na wanafunzi wake
  rationale: σύν pamoja na hali ya dative huonyesha uandamani; usemi huu ni wa asili na wenye heshima katika Kiswahili.
- source_word: πέραν τοῦ χειμάρρου τοῦ Κεδρών
  choice: kuvuka kijito cha Kidron
  rationale: πέραν katika muktadha wa mwendo inaonyesha kufika upande wa pili, huku χείμαρρος ikitaja mkondo wa maji wa msimu. ‘Kijito’ ni rahisi kueleweka, na maelezo ya chini yanafafanua hali yake ya msimu.
- source_word: ὅπου ἦν κῆπος
  choice: ambako kulikuwa na bustani
  rationale: Tafsiri hii inahifadhi maana ya mahali na muundo wa kuwepo kwa bustani kwa Kiswahili cha kawaida.
- source_word: εἰς ὃν εἰσῆλθεν
  choice: akaingia humo
  rationale: ‘Humo’ linaonyesha wazi mwendo wa kuingia ndani ya bustani bila kutumia muundo mzito wa kirejeshi.
- source_word: αὐτὸς καὶ οἱ μαθηταὶ αὐτοῦ
  choice: pamoja na wanafunzi wake
  rationale: Muundo huu unaonyesha kwamba Yesu aliingia akiwa ameandamana na wanafunzi wake bila kulazimisha mkazo wa ziada wa ‘yeye mwenyewe.’
