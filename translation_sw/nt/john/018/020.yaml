source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀αὐτῷ Ἰησοῦς· Ἐγὼ παρρησίᾳ ⸀λελάληκα τῷ κόσμῳ· ἐγὼ πάντοτε ἐδίδαξα ἐν συναγωγῇ καὶ ἐν τῷ ἱερῷ, ὅπου ⸀πάντες οἱ Ἰουδαῖοι συνέρχονται, καὶ ἐν κρυπτῷ ἐλάλησα οὐδέν·
base_translation:
  language: en
  yaml_path: translation/nt/john/018/020.yaml
  text: Jesus answered him[a], “I have spoken openly to the world. I always taught in the synagogue and in the temple, where all the Jews gather[b], and I said nothing in secret.”
translation:
  language: sw
  text: Yesu akamjibu, “Mimi nimesema waziwazi kwa ulimwengu. Sikuzote nilifundisha katika sinagogi na katika eneo la hekalu[a], mahali ambapo Wayahudi wote hukusanyika[b]; wala sikusema jambo lolote kwa siri.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “katika viwanja vya hekalu” au “katika eneo la hekalu”; neno la Kigiriki linarejelea eneo pana la hekalu, si patakatifu pa ndani pekee.
    reason: lexical_alternative
  - marker: b
    text: Au “watu wote wa Kiyahudi”; katika baadhi ya miktadha ya Yohana neno la Kigiriki linaweza pia kumaanisha “Wayudea.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παρρησίᾳ
  choice: waziwazi
  rationale: Katika muktadha huu neno hili linatofautishwa na ‘kwa siri’; ‘waziwazi’ linaonyesha kusema hadharani bila kuficha, bila kusisitiza mno ujasiri.
- source_word: λελάληκα
  choice: nimesema
  rationale: Kauli timilifu ya Kigiriki inaonyesha maneno yaliyosemwa hapo awali ambayo bado yana umuhimu katika wakati wa mahojiano.
- source_word: τῷ κόσμῳ
  choice: kwa ulimwengu
  rationale: Huhifadhi msamiati mpana wa Yohana kuliko kuubana kuwa ‘kwa watu wote’ au ‘hadharani,’ huku muktadha ukionyesha usemi wa hadhara.
- source_word: πάντοτε
  choice: sikuzote
  rationale: Ni Kiswahili cha kawaida na chenye heshima kinachoonyesha desturi ya kudumu ya kufundisha hadharani.
- source_word: ἐδίδαξα
  choice: nilifundisha
  rationale: Wakati uliopita rahisi unawakilisha vizuri aoristi ya Kigiriki katika simulizi hili.
- source_word: ἐν συναγωγῇ
  choice: katika sinagogi
  rationale: Umoja wa Kigiriki umehifadhiwa na unaweza kueleweka kwa maana ya jumla kama mazingira ya kawaida ya mafundisho ya Kiyahudi.
- source_word: ἐν τῷ ἱερῷ
  choice: katika eneo la hekalu
  rationale: ἱερόν humaanisha jengo lote au viwanja vya hekalu, si patakatifu pa ndani pekee; ‘eneo la hekalu’ huzuia dhana isiyo sahihi.
- source_word: πάντες οἱ Ἰουδαῖοι
  choice: Wayahudi wote
  rationale: Hili ni tafsiri ya moja kwa moja; katika muktadha huu linaelekea kuwarejelea watu wa Kiyahudi katika mikusanyiko yao ya hadhara, si viongozi pekee.
- source_word: συνέρχονται
  choice: hukusanyika
  rationale: Hutoa maana ya kukutana pamoja, na hali ya mazoea inafaa kwa kauli kuhusu mahali pa mikusanyiko ya kawaida.
- source_word: ἐν κρυπτῷ
  choice: kwa siri
  rationale: Huhifadhi utofauti wa moja kwa moja na ‘waziwazi’ kwa Kiswahili cha asili.
- source_word: ἐλάλησα οὐδέν
  choice: sikusema jambo lolote
  rationale: Ni usemi wa kawaida wa Kiswahili unaohifadhi ukanushi kamili wa Kigiriki.
- source_word: ἀπεκρίθη αὐτῷ
  choice: akamjibu
  rationale: Ni uwasilishaji mfupi na wa kawaida wa simulizi, huku kiwakilishi cha yambwa kikihifadhiwa.
theological_decisions:
- issue: Mrejelewa wa Ἰουδαῖοι katika Yohana
  choice: Wayahudi wote
  alternative: Watu wote wa Kiyahudi; Wayudea wote
  rationale: Matumizi ya Ἰουδαῖοι katika Yohana hutegemea muktadha. Kutajwa kwa sinagogi na eneo la hekalu hapa kunaelekeza kwa mazingira mapana ya mikusanyiko ya watu wa Kiyahudi, si lazima viongozi wa kidini pekee. Tanbihi huhifadhi uwezekano wa maana nyingine bila kuingiza msimamo wa chuki dhidi ya Wayahudi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ni wa asili kwa wasomaji wa kawaida, huku tofauti kati ya kusema waziwazi na kusema kwa siri, pamoja na upana wa istilahi za hekalu na Wayahudi, vikihifadhiwa.
