  text: Ὁ οὖν ἀρχιερεὺς ἠρώτησεν τὸν Ἰησοῦν περὶ τῶν μαθητῶν αὐτοῦ καὶ περὶ τῆς διδαχῆς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/019.yaml
  text: So the high priest questioned Jesus about his disciples and about his teaching[a].
translation:
  language: sw
  text: Basi kuhani mkuu akamwuliza Yesu kuhusu wanafunzi wake na kuhusu mafundisho yake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akamhoji Yesu.” Kitenzi cha Kigiriki kinaweza kutafsiriwa “aliuliza” au “alihoji”; “akamwuliza” limetumiwa hapa ili lisitie maana kali zaidi ya inavyohitajika, ingawa mazingira ni ya uchunguzi rasmi.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Basi
  rationale: Kiunganishi hiki kinaendeleza simulizi kwa kuonyesha uhusiano na yaliyotangulia; “Basi” ni cha kawaida na hudumisha nguvu hiyo bila kufanya hitimisho kuwa nzito kupita kiasi.
- source_word: ἀρχιερεὺς
  choice: kuhani mkuu
  rationale: Hili ndilo neno la kawaida la Kiswahili kwa cheo cha ἀρχιερεύς. Jina la Ana halijaingizwa kwa kuwa matini ya Kigiriki inataja cheo pekee.
- source_word: ἠρώτησεν
  choice: akamhoji
  rationale: Kitenzi kinaweza kumaanisha kuuliza au kuhoji. “Kumhoji” kinafaa kwa mazingira rasmi ya kusikilizwa kwa Yesu bila kuongeza ukali unaoweza kudokezwa na “kumhoji kwa nguvu” au “kumpekua kwa maswali.”
- source_word: περὶ
  choice: kuhusu
  rationale: Katika matukio yote mawili, neno hili linataja mada ya maswali; “kuhusu” ni la asili, wazi, na lenye heshima katika Kiswahili cha sasa.
- source_word: μαθητῶν
  choice: wanafunzi
  rationale: “Wanafunzi” hudumisha uhusiano wa mwalimu na mwanafunzi unaobebwa na μαθητής, na ni neno lililozoeleka katika Injili.
- source_word: διδαχῆς
  choice: mafundisho
  rationale: “Mafundisho” ni tafsiri ya kawaida na inayoeleweka ya διδαχή hapa; haiongezi maana maalumu ya kimadhehebu.
- source_word: αὐτοῦ
  choice: wake / yake
  rationale: Viwakilishi vyote viwili vinamrejelea Yesu; upatanisho wa kisarufi wa Kiswahili unahitaji “wake” kwa wanafunzi na “yake” kwa mafundisho.
theological_decisions:
- issue: Tafsiri ya cheo ἀρχιερεύς katika muktadha ambao mhusika ni Ana badala ya Kayafa, kuhani mkuu aliyetambuliwa na Waroma wakati huo
  choice: 'Kuhifadhi cheo cha matini: “kuhani mkuu”'
  alternative: “Ana, kuhani mkuu” au “mkuu wa makuhani”
  rationale: Tafsiri inafuata maneno ya Kigiriki bila kuoanisha kimya kimya taarifa ya kihistoria au kuingiza jina lisilokuwamo katika mstari. Hivyo mvutano wa masimulizi unabaki kama ulivyo katika chanzo.
- issue: Nguvu ya ἠρώτησεν katika mazingira rasmi
  choice: “akamhoji” katika matini, huku “akamuuliza” ikitajwa katika tanbihi
  alternative: “akamuuliza”
  rationale: Kigiriki kinakubali maana zote mbili. “Akamhoji” huakisi mazingira rasmi, lakini tanbihi huhifadhi uwezekano mpana zaidi wa kileksia bila kudai kwamba lilikuwa shinikizo kali la kisheria.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa masimulizi “akamhoji” ni wa kawaida katika usimulizi wa Biblia na unaeleweka kwa wasomaji wa kawaida. Urudiaji wa “kuhusu” umehifadhiwa ili kuakisi muundo sambamba wa Kigiriki.
