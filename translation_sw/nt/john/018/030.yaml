  yaml_path: translation/nt/john/018/030.yaml
  text: They answered and said to him[a], “If this man were not an evildoer, we would not have handed him over to you.”
translation:
  language: sw
  text: Wakamjibu, wakasema, “Kama mtu huyu asingekuwa akitenda maovu, tusingemkabidhi mikononi mwako.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθησαν καὶ εἶπαν αὐτῷ
  choice: Wakamjibu, wakasema
  rationale: Huhifadhi vitenzi vyote viwili vya fomula ya kisimulizi, huku kiwakilishi cha yambwa katika “wakamjibu” kikirejelea Pilato kwa kawaida katika Kiswahili.
- source_word: Εἰ μὴ ἦν
  choice: Kama ... asingekuwa
  rationale: Muundo huu wa sharti unaonyesha hali iliyo kinyume na ukweli kama ilivyo katika Kigiriki.
- source_word: οὗτος
  choice: mtu huyu
  rationale: Ni usemi wa kawaida unaomtaja Yesu huku ukihifadhi kiasi cha kujitenga kilichomo katika kiashiria cha Kigiriki.
- source_word: κακὸν ποιῶν
  choice: akitenda maovu
  rationale: Huhifadhi nguvu ya kishiriki ya “kutenda” na uzito wa kimaadili wa κακόν bila kuigeuza kuwa jina la kisheria kama “mhalifu.”
- source_word: οὐκ ἄν σοι παρεδώκαμεν αὐτόν
  choice: tusingemkabidhi kwako
  rationale: Huwakilisha matokeo ya sharti lisilo halisi na maana ya kumtia mtu mikononi mwa mamlaka katika muktadha wa kisheria.
theological_decisions:
- issue: Nguvu na upeo wa shtaka dhidi ya Yesu
  choice: akitenda maovu
  alternative: angekuwa mtenda maovu; angekuwa mhalifu
  rationale: κακὸν ποιῶν ni shtaka pana la kutenda yaliyo maovu, si lazima istilahi rasmi ya kisheria. Tafsiri hii huhifadhi madai yao ya jumla bila kuongeza kosa maalumu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Wakamjibu, wakasema” kimedumishwa ili kuhifadhi fomula kamili ya Kigiriki; “tusingemkabidhi kwako” ni ya kawaida na inaafiki mazingira ya mamlaka ya Pilato.
