  text: So Annas sent him bound to Caiaphas the high priest[a].
translation:
  language: sw
  text: Basi Anasi akamtuma Yesu kwa Kayafa, kuhani mkuu, huku Yesu akiwa amefungwa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa kuzingatia muktadha: “Basi Anasi alikuwa amemtuma Yesu kwa Kayafa, kuhani mkuu, huku Yesu akiwa amefungwa,” ikiwa maneno haya yatachukuliwa kuwa maelezo ya pembeni yanayofafanua yaliyotangulia.'
