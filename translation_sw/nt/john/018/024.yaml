lexical_decisions:
- source_word: ἀπέστειλεν
  choice: akamtuma
  rationale: Kitenzi cha wakati uliopita katika simulizi; “akamtuma” ni Kiswahili cha kawaida na huonyesha Anasi ndiye aliyemtuma Yesu.
- source_word: οὖν
  choice: Basi
  rationale: Huhifadhi kiunganishi cha mwendelezo wa simulizi bila uzito wa kimantiki unaoweza kudokezwa na “kwa hiyo.”
- source_word: δεδεμένον
  choice: akiwa amefungwa
  rationale: Huonyesha hali iliyotokana na kufungwa na iliyoendelea wakati wa kutumwa, sawasawa na participio timilifu tendwa.
- source_word: πρὸς
  choice: kwa
  rationale: Pamoja na kitenzi cha kutuma na jina la mtu, huonyesha kuelekezwa kwa mtu huyo; “kwa Kayafa” ni matumizi ya kawaida ya Kiswahili.
- source_word: Καϊάφαν
  choice: Kayafa
  rationale: Umbo la jina lililozoeleka katika tafsiri za Biblia za Kiswahili.
- source_word: τὸν ἀρχιερέα
  choice: kuhani mkuu
  rationale: Hurejelea cheo maalumu cha ukuhani mkuu, si kundi pana la wakuu wa makuhani.
- source_word: ὁ Ἅννας
  choice: Anasi
  rationale: Umbo la jina lililozoeleka katika tafsiri za Biblia za Kiswahili.
theological_decisions:
- issue: Mpangilio wa simulizi ukilinganishwa na muktadha unaozunguka mstari huu
  choice: 'Kutafsiri kama tendo la kawaida la wakati uliopita: Anasi alimtuma Yesu akiwa amefungwa kwa Kayafa.'
  alternative: 'Kuchukulia mstari huu kuwa maelezo ya pembeni kuhusu jambo lililokuwa limetokea kabla: Anasi alikuwa amemtuma Yesu akiwa amefungwa kwa Kayafa.'
  rationale: Aoristi elekezi husomeka kwa kawaida kama tukio linalofuata katika simulizi. Hata hivyo, uhusiano wake na mistari inayozunguka unaweza kueleweka kama kurejelea tukio la awali; tanbihi huhifadhi uwezekano huo bila kuutatua kimyakimya katika matini kuu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “akiwa amefungwa” ni wa asili na huhifadhi hali endelevu ya δεδεμένον; tanbihi huhifadhi utata halisi wa mpangilio wa simulizi.
