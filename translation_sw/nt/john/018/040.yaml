  text: ἐκραύγασαν οὖν ⸀πάλιν λέγοντες· Μὴ τοῦτον ἀλλὰ τὸν Βαραββᾶν. ἦν δὲ ὁ Βαραββᾶς λῃστής.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/040.yaml
  text: So they shouted again[a], saying, “Not this man, but Barabbas!” Now Barabbas was a robber.
translation:
  language: sw
  text: Basi wakapiga kelele tena, wakisema, “Si huyu, bali Baraba!” Baraba alikuwa mnyang’anyi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “jambazi”; neno la Kigiriki linaweza kumaanisha mnyang’anyi, jambazi, au, katika baadhi ya mazingira, mwasi mwenye kutumia nguvu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκραύγασαν
  choice: wakapiga kelele
  rationale: Kitenzi hiki humaanisha kutoa sauti kubwa kwa kupaza sauti. “Wakapiga kelele” ni Kiswahili cha kawaida na chenye nguvu inayolingana na neno la Kigiriki.
- source_word: οὖν
  choice: Basi
  rationale: Hapa οὖν inaunganisha jibu hili na mazungumzo yaliyotangulia. “Basi” huonyesha mwendelezo au matokeo kwa njia ya asili katika Kiswahili.
- source_word: πάλιν
  choice: tena
  rationale: “Tena” linaonyesha wazi kwamba kitendo hicho kilirudiwa.
- source_word: λέγοντες
  choice: wakisema
  rationale: Ingawa maana yake tayari inaeleweka baada ya “wakapiga kelele,” kirai hiki kipo katika Kigiriki na kimehifadhiwa kwa Kiswahili cha asili.
- source_word: Μὴ τοῦτον ἀλλὰ τὸν Βαραββᾶν
  choice: Si huyu, bali Baraba
  rationale: “Huyu” huhifadhi nguvu ya kiwakilishi cha kuonyesha τοῦτον, na “bali” huwasilisha utofautishaji wa ἀλλά.
- source_word: Βαραββᾶν / Βαραββᾶς
  choice: Baraba
  rationale: Jina limetoholewa kwa umbo lililozoeleka katika Kiswahili.
- source_word: ἦν δὲ
  choice: alikuwa
  rationale: δέ hapa inaanzisha maelezo ya ziada kuhusu Baraba. Kiswahili hakihitaji kiunganishi cha wazi ili kuwasilisha mpito huu kwa ufasaha.
- source_word: λῃστής
  choice: mnyang’anyi
  rationale: Neno hili kwa kawaida humaanisha mnyang’anyi au jambazi. “Mnyang’anyi” ni neno wazi kwa wasomaji wa kawaida, huku upana wa maana ukihifadhiwa katika tanbihi.
theological_decisions:
- issue: Upana wa maana ya λῃστής katika kumweleza Baraba
  choice: mnyang’anyi
  alternative: jambazi; mwasi mwenye kutumia nguvu
  rationale: Mstari wenyewe haumshurutishi mtafsiri kueleza Baraba moja kwa moja kuwa mwasi wa kisiasa. Tafsiri kuu inatumia maana ya msingi iliyo wazi, huku tanbihi ikihifadhi uwezekano wa neno hilo kumaanisha jambazi au mwasi mwenye kutumia nguvu katika baadhi ya mazingira.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo wa kurudiwa kwa “wakapiga kelele ... wakisema” umehifadhiwa kwa sababu unaakisi muundo wa Kigiriki bila kuwa mzito kupita kiasi.
