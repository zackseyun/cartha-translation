  text: Then Peter denied it again[a], and immediately a rooster crowed.
translation:
  language: sw
  text: Basi Petro akakana tena[a], na mara jogoo akawika.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki hakitaji wazi jambo alilolikana; muktadha wa swali lililotangulia hulionyesha.
