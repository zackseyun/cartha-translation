lexical_decisions:
- source_word: πάλιν
  choice: tena
  rationale: Kielezi hiki huonyesha kurudiwa kwa tendo; “tena” ni tafsiri fupi na ya kawaida katika muktadha wa kukana kwa Petro mara kadhaa.
- source_word: οὖν
  choice: Basi
  rationale: Kiunganishi hiki kinaendeleza simulizi na kuhusianisha jibu la Petro na swali lililotangulia; “basi” ni cha asili katika Kiswahili bila kusisitiza mno hitimisho la kimantiki.
- source_word: ἠρνήσατο
  choice: akakana
  rationale: Kitenzi ἀρνέομαι hapa humaanisha kukataa au kukana jambo lililoulizwa. Kiswahili kinaweza kutumia “akakana” bila kutaja yambwa, kama ilivyo katika Kigiriki.
- source_word: Πέτρος
  choice: Petro
  rationale: Hili ndilo umbo la kawaida la jina hili katika tafsiri za Biblia za Kiswahili.
- source_word: καὶ
  choice: na
  rationale: Kiunganishi rahisi kinachounganisha kukana kwa Petro na tukio lililofuata mara moja.
- source_word: εὐθέως
  choice: mara
  rationale: Katika muundo “na mara,” neno hili linaonyesha kwamba kuwika kulitokea papo hapo baada ya kukana; ni usemi wa asili na wenye uzito unaofaa kwa simulizi.
- source_word: ἀλέκτωρ
  choice: jogoo
  rationale: Neno hili humaanisha kuku dume; “jogoo” ndilo neno la kawaida na wazi katika Kiswahili cha Afrika Mashariki.
- source_word: ἐφώνησεν
  choice: akawika
  rationale: Ingawa kitenzi chenyewe kina maana pana ya kutoa sauti, kikiwa na jogoo kama kiima tafsiri ya kawaida ya Kiswahili ni “akawika.”
