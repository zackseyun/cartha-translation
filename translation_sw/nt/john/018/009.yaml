base_translation:
  language: en
  yaml_path: translation/nt/john/018/009.yaml
  text: 'so that the word that he had spoken might be fulfilled: “Of those whom you have given me[a], I lost not one.”'
translation:
  language: sw
  text: 'ili litimie neno alilosema: “Kati ya wale ulionipa, sikumpoteza hata mmoja.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: ili
  rationale: Huonyesha kusudi au matokeo; “ili” ni ya kawaida na huhifadhi nguvu ya kishazi cha Kigiriki.
- source_word: πληρωθῇ
  choice: litimie
  rationale: Kitenzi hiki cha kutendwa kinaonyesha kwamba neno la Yesu lilifikia utimilifu wake; “litimie” ni usemi wa kawaida katika Kiswahili bila kulifanya moja kwa moja kuwa unabii rasmi.
- source_word: ὁ λόγος
  choice: neno
  rationale: Hapa λόγος ni kauli maalumu ambayo Yesu alikuwa amesema, si cheo cha kitheolojia “Neno.”
- source_word: ὃν εἶπεν
  choice: alilokuwa amesema
  rationale: Muundo huu unaonyesha kwa kawaida kwamba kauli hiyo ilitangulia tukio la sasa.
- source_word: ὅτι
  choice: ':'
  rationale: Alama ya nukta mbili inatanguliza kwa uwazi maneno yaliyonukuliwa moja kwa moja.
- source_word: Οὓς δέδωκάς μοι
  choice: Katika wale ulionipa
  rationale: “Katika wale” huandaa kirai cha sehemu ἐξ αὐτῶν, huku “ulionipa” ikitoa kwa Kiswahili cha kawaida wazo la wale ambao Baba amemkabidhi Yesu.
- source_word: ἀπώλεσα
  choice: sikumpoteza
  rationale: Katika muktadha wa Yesu kuwalinda wanafunzi wake, maana inayofaa ni kutompoteza mtu aliye chini ya uangalizi wake, si kumwangamiza kwa tendo.
- source_word: ἐξ αὐτῶν οὐδένα
  choice: hata mmoja wao
  rationale: Huhifadhi msisitizo wa Kigiriki, yaani kwamba hakuna hata mtu mmoja miongoni mwao aliyepotea.
theological_decisions:
- issue: Asili ya lugha ya utimilifu
  choice: Kutafsiri πληρωθῇ kuwa “litimie” kwa neno la Yesu lililotangulia
  alternative: “liwe kweli”
  rationale: Yohana hutumia lugha ya utimilifu pia kuhusu maneno ya Yesu mwenyewe. “Litimie” huhifadhi uzito wa kusudi la Mungu na kutokea kwa jambo hilo bila kudai kwamba kauli hiyo ni unabii rasmi wa Maandiko.
- issue: Maana ya ἀπώλεσα kuhusu wanafunzi
  choice: “sikumpoteza hata mmoja wao” kwa maana ya kuwahifadhi wale waliokabidhiwa kwa Yesu
  alternative: “sikumwangamiza yeyote kati yao” au “sikumwacha yeyote kati yao aangamie”
  rationale: Muktadha ni Yesu kuwalinda wanafunzi wakati wa kukamatwa kwake, ukirejelea Yohana 17:12. “Kupoteza” huhifadhi msamiati na mvutano wa kitheolojia wa Yohana bila kuingiza mfumo mwembamba wa kimafundisho.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni ya kawaida kwa wasomaji wa leo huku ikihifadhi muundo wa utimilifu, nukuu ya moja kwa moja, na msisitizo wa “hata mmoja.”
