base_translation:
  language: en
  yaml_path: translation/nt/john/018/014.yaml
  text: Caiaphas was the one who had advised the Jews that it was better for one man to die for the people[a][b].
translation:
  language: sw
  text: Kayafa ndiye aliyewashauri Wayahudi[a] kwamba ni afadhali mtu mmoja afe kwa ajili ya watu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “viongozi wa Wayahudi” au “watu wa Yudea,” kulingana na jinsi neno “Wayahudi” linavyoeleweka katika muktadha huu wa Yohana.
    reason: alternative_reading
  - marker: b
    text: Au “kwa niaba ya watu”; kirai hiki kinaweza pia kuwa na dokezo la uwakilishi au dhabihu katika muktadha.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ
  choice: ndiye aliyekuwa
  rationale: δέ ni kiunganishi hafifu cha simulizi, kisichohitaji neno tofauti mwanzoni; muundo huu wa Kiswahili unaendeleza simulizi kwa kawaida huku ukimtambulisha Kayafa kwa tendo lililotangulia.
- source_word: Καϊάφας
  choice: Kayafa
  rationale: Jina limetoholewa kwa tahajia iliyozoeleka katika Kiswahili.
- source_word: ὁ συμβουλεύσας
  choice: aliyekuwa amewashauri
  rationale: Kishiriki chenye kibainishi kinamtambulisha Kayafa kwa ushauri aliokuwa amekwisha kutoa; wakati timilifu wa Kiswahili unaonyesha kuwa tendo hilo lilitangulia.
- source_word: τοῖς Ἰουδαίοις
  choice: Wayahudi
  rationale: Neno la Kigiriki halina kibainishi kinacholibana kuwa viongozi pekee. Tafsiri kuu inadumisha usemi mpana wa chanzo, na tanbihi inaonyesha uwezekano wa maana ya kimuktadha.
- source_word: ὅτι συμφέρει
  choice: kwamba ilikuwa afadhali
  rationale: συμφέρει huonyesha jambo lenye manufaa au linalofaa; ‘ilikuwa afadhali’ ni Kiswahili cha kawaida kinacholingana na muktadha wa shauri.
- source_word: ἕνα ἄνθρωπον
  choice: mtu mmoja
  rationale: Huhifadhi msisitizo wa idadi moja na humrejelea mtu mahususi bila kufanya Kiswahili kuwa kizito.
- source_word: ἀποθανεῖν
  choice: afe
  rationale: Hutoa kwa ufupi na kwa kawaida maana ya kitenzi-jina cha kufa baada ya ‘ilikuwa afadhali.’
- source_word: ὑπὲρ τοῦ λαοῦ
  choice: kwa ajili ya watu
  rationale: Muundo huu unaweza kuonyesha manufaa au uwakilishi bila kuamua wazi ikiwa maana ni ya badala au dhabihu.
- source_word: λαοῦ
  choice: watu
  rationale: λαός hapa ni ‘watu,’ si ἔθνος, ‘taifa’; uchaguzi huu unafuata kwa usahihi neno la mstari huu.
theological_decisions:
- issue: Dokezo la uwakilishi, dhabihu, au kufa badala ya wengine katika ὑπὲρ τοῦ λαοῦ
  choice: kwa ajili ya watu
  alternative: kwa niaba ya watu; badala ya watu
  rationale: Kirai kinaweza kumaanisha kufa kwa manufaa au kwa niaba ya watu, na katika muktadha mpana kinaweza kuwa na dokezo la dhabihu au ubadala. Tafsiri kuu haifanyi dokezo hilo kuwa fundisho lililoelezwa wazi kuliko chanzo.
- issue: Wanaorejelewa na τοῖς Ἰουδαίοις katika Injili ya Yohana
  choice: Wayahudi
  alternative: viongozi wa Wayahudi; Wayudea
  rationale: Chanzo kinasema ‘Wayahudi’ bila kulibana wazi neno hilo. Kwa kuwa katika Yohana rejeo lake hutegemea muktadha, tafsiri kuu inadumisha upana huo na tanbihi inatoa njia nyingine za kulielewa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo ‘ndiye aliyekuwa amewashauri’ ni wa kawaida na unaonyesha kitendo kilichotangulia. Alama zote za tanbihi zimewekwa katika matini kuu.
