  text: Σίμων οὖν Πέτρος ἔχων μάχαιραν εἵλκυσεν αὐτὴν καὶ ἔπαισεν τὸν τοῦ ἀρχιερέως δοῦλον καὶ ἀπέκοψεν αὐτοῦ τὸ ⸀ὠτάριον τὸ δεξιόν. ἦν δὲ ὄνομα τῷ δούλῳ Μάλχος.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/010.yaml
  text: Then Simon Peter[a], having a sword, drew it and struck the high priest’s servant and cut off his right ear. Now the servant’s name was Malchus.
translation:
  language: sw
  text: Basi Simoni Petro, akiwa na upanga, akauchomoa, akampiga mtumwa[a] wa kuhani mkuu na kumkata sikio lake la kulia. Jina la mtumwa huyo lilikuwa Malko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mtumishi.” Neno la Kigiriki doulos linaweza kumaanisha “mtumwa” au “mtumishi,” kutegemea muktadha.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Basi
  rationale: Huendeleza simulizi huku pia ikiunganisha tendo hili na yaliyotangulia, bila kulifanya lionekane kuwa hitimisho kali la kimantiki.
- source_word: ἔχων μάχαιραν
  choice: akiwa na upanga
  rationale: Huhifadhi maana ya kishirikishi ἔχων kwa Kiswahili cha kawaida; μάχαιρα inaweza kumaanisha upanga mfupi au kisu kikubwa, lakini “upanga” ni neno pana na linalofaa katika muktadha huu.
- source_word: εἵλκυσεν αὐτὴν
  choice: akauchomoa
  rationale: Ni usemi wa kawaida wa Kiswahili kwa kutoa silaha kutoka alikokuwa ameihifadhi; kiambishi -u- kinarejelea upanga.
- source_word: ἔπαισεν
  choice: akampiga
  rationale: Hutoa maana ya kumpiga kwa silaha kwa lugha ya kawaida na yenye hadhi.
- source_word: τὸν τοῦ ἀρχιερέως δοῦλον
  choice: mtumwa wa kuhani mkuu
  rationale: δοῦλος humaanisha mtu aliye katika hali ya utumwa au utumishi unaomilikiwa; uhusiano na kuhani mkuu hapa unaunga mkono “mtumwa,” huku “mtumishi” ikibaki kuwa uwezekano wa kileksia.
- source_word: ἀπέκοψεν
  choice: kumkata
  rationale: Katika muundo “kumkata sikio,” Kiswahili hueleza kwa kawaida kitendo cha kuliondoa kwa kukata; kuongeza “likatike” kungekuwa na uzito usio wa lazima.
- source_word: ὠτάριον τὸ δεξιόν
  choice: sikio lake la kulia
  rationale: Umbo la kudunisha ὠτάριον halilazimishi “sikio dogo”; “sikio” ndilo neno la kawaida, na τὸ δεξιόν hubainisha upande wa kulia.
- source_word: ἦν δὲ ὄνομα τῷ δούλῳ Μάλχος
  choice: Jina la mtumwa huyo lilikuwa Malko
  rationale: Hubadili muundo wa kidativi wa Kigiriki kuwa umilikaji wa kawaida katika Kiswahili; “huyo” humtambulisha tena mtu aliyekwisha tajwa, na Μάλχος limetoholewa kuwa “Malko.”
theological_decisions:
- issue: Tafsiri ya δοῦλος
  choice: mtumwa
  alternative: mtumishi
  rationale: “Mtumwa” huonyesha wazi hali ya kijamii inayoweza kudokezwa na δοῦλος na uhusiano wake na kuhani mkuu. Hata hivyo, kwa kuwa neno hilo la Kigiriki linaweza kutumiwa pia kwa mtumishi kutegemea muktadha, uwezekano huo umehifadhiwa katika tanbihi bila kuamua zaidi ya ushahidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, fasaha na chenye hadhi. Mfuatano wa vitenzi wenye viambishi vya marejeo umechaguliwa ili simulizi lisomeke kwa kawaida. Alama ya tanbihi imewekwa baada ya sentensi inayomtaja Malko, na tanbihi inahusu matumizi yote mawili ya “mtumwa” katika aya.
