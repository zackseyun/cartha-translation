  text: ἔστιν δὲ συνήθεια ὑμῖν ἵνα ἕνα ⸂ἀπολύσω ὑμῖν⸃ ἐν τῷ πάσχα· βούλεσθε οὖν ⸄ἀπολύσω ὑμῖν⸅ τὸν βασιλέα τῶν Ἰουδαίων;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/039.yaml
  text: But you have a custom that I release one man for you at the Passover[a]. So do you want me to release to you the King of the Jews?
translation:
  language: sw
  text: Lakini mna desturi kwamba niwaachilie mtu mmoja wakati wa Pasaka. Basi, mnataka niwaachilie Mfalme wa Wayahudi?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Mfalme wa Wayudea.” Neno la Kigiriki linaweza kumaanisha Wayahudi au Wayudea kulingana na muktadha; hapa linaonekana katika cheo maalumu kinachotumiwa katika simulizi la mateso ya Yesu.
    reason: alternative_reading
lexical_decisions:
- source_word: συνήθεια
  choice: desturi
  rationale: “Desturi” huonyesha utaratibu wa kijamii uliozoeleka katika mazingira haya ya hukumu na sikukuu, si mazoea ya mtu binafsi.
- source_word: ἵνα ἕνα ἀπολύσω ὑμῖν
  choice: ya mimi kuwaachilia mtu mmoja
  rationale: Kifungu hiki kinaeleza yaliyomo katika desturi hiyo. “Mtu mmoja” huweka wazi rejeo la kibinadamu la ἕνα kwa Kiswahili cha kawaida, huku “kuwaachilia” kikibeba maana ya kumfungua mfungwa kwa ajili yao.
- source_word: ἀπολύω
  choice: kuwaachilia / niwaachilie
  rationale: “Kumwachilia” ni neno la kawaida na sahihi kwa kitendo cha mtawala kumfungua mfungwa; limetumiwa kwa uthabiti katika matukio yote mawili.
- source_word: ἐν τῷ πάσχα
  choice: wakati wa Pasaka
  rationale: Hii huwasilisha kwa uwazi maana ya wakati wa sikukuu bila kulazimisha kuwa tendo hilo lilifanyika katika muda wote wa Pasaka.
- source_word: βούλεσθε οὖν
  choice: Basi, mnataka
  rationale: “Basi” huonyesha hitimisho au mpito wa οὖν, na “mnataka” ni usemi wa sasa na wa kawaida kwa βούλεσθε.
- source_word: τὸν βασιλέα τῶν Ἰουδαίων
  choice: Mfalme wa Wayahudi
  rationale: Hapa kirai hiki kinatumika kama cheo maalumu katika simulizi la mateso ya Yesu. Herufi kubwa katika “Mfalme” inaonyesha matumizi hayo ya kicheo.
theological_decisions:
- issue: Maana ya Ἰουδαίων katika cheo τὸν βασιλέα τῶν Ἰουδαίων
  choice: Mfalme wa Wayahudi
  alternative: Mfalme wa Wayudea
  rationale: Katika simulizi la mateso katika Yohana, kirai hiki ni cheo au shtaka la kifalme linalohusishwa na Yesu. “Wayahudi” huhifadhi maana ya kihistoria na ya kisimulizi iliyozoeleka, lakini uwezekano wa maana ya kikanda umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa urahisi. Muundo “mnayo desturi ya mimi...” umechaguliwa ili kudumisha kwamba Pilato ndiye anayemwachilia mfungwa, bila kufanya sentensi kuwa nzito kupita kiasi.
