  text: λέγει αὐτῷ ὁ Πιλᾶτος· Τί ἐστιν ἀλήθεια; Καὶ τοῦτο εἰπὼν πάλιν ἐξῆλθεν πρὸς τοὺς Ἰουδαίους, καὶ λέγει αὐτοῖς· Ἐγὼ οὐδεμίαν ⸂εὑρίσκω ἐν αὐτῷ αἰτίαν⸃·
base_translation:
  language: en
  yaml_path: translation/nt/john/018/038.yaml
  text: Pilate said to him[a], “What is truth?” After saying this, he went out again to the Jews and said to them, “I find no case against him.”
translation:
  language: sw
  text: Pilato akamwambia, “Kweli ni nini?” Baada ya kusema hayo, akatoka tena kwenda kwa Wayahudi[a] na kuwaambia, “Sioni sababu yoyote ya kumshtaki.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “viongozi wa Wayahudi.” Katika Yohana, neno “Wayahudi” wakati mwingine linaweza kumaanisha hasa viongozi wa Wayahudi au kundi linalowawakilisha wale waliokuwa wakimpinga Yesu katika muktadha husika.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει αὐτῷ ὁ Πιλᾶτος
  choice: Pilato akamwambia
  rationale: Kauli ya sasa ya kihistoria λέγει imetafsiriwa kwa wakati wa masimulizi katika Kiswahili; kiambishi -mw- kinawakilisha αὐτῷ kwa kawaida na kwa uwazi.
- source_word: Τί ἐστιν ἀλήθεια;
  choice: Kweli ni nini?
  rationale: ἀλήθεια hapa haina kibainishi; “kweli” ni tafsiri ya moja kwa moja na ya kawaida isiyoongeza maana ya “ile kweli”.
- source_word: Καὶ τοῦτο εἰπὼν
  choice: Baada ya kusema hayo
  rationale: Kirai cha aoristi kinaonyesha tendo lililotangulia; “baada ya kusema hayo” kinaeleza mfuatano huo kwa Kiswahili cha kawaida.
- source_word: πάλιν ἐξῆλθεν πρὸς τοὺς Ἰουδαίους
  choice: akatoka tena kwenda kwa Wayahudi[a]
  rationale: “Akatoka tena” huhifadhi tendo la kutoka na kurudiwa kwake; “Wayahudi” huhifadhi neno la chanzo, huku tanbihi ikieleza uwezekano wa rejeo jembamba katika muktadha.
- source_word: καὶ λέγει αὐτοῖς
  choice: na kuwaambia
  rationale: Kauli ya sasa ya kihistoria imetolewa kwa mtiririko wa wakati wa masimulizi, na αὐτοῖς imewakilishwa na “wa-”.
- source_word: Ἐγὼ οὐδεμίαν εὑρίσκω ἐν αὐτῷ αἰτίαν
  choice: Sioni shtaka lolote dhidi yake
  rationale: Katika muktadha huu wa mahakama, αἰτία humaanisha shtaka au msingi wa kumshtaki mtu. “Sioni shtaka lolote dhidi yake” ni ya asili katika Kiswahili na huhifadhi maana ya kisheria bila kuigeuza kuwa kosa la jumla la kimaadili.
theological_decisions:
- issue: Rejeo la Ἰουδαίους katika simulizi la mateso la Yohana
  choice: Wayahudi katika matini kuu, pamoja na tanbihi ya ufafanuzi
  alternative: viongozi wa Wayahudi; Wayudea
  rationale: “Wayahudi” hudumisha uwazi kwa neno la Kigiriki, lakini matumizi ya Yohana yanaweza kumaanisha kwa namna jembamba zaidi viongozi au kundi la wawakilishi waliokuwa wakimpinga Yesu katika muktadha huu. Tanbihi huhifadhi uwezekano huo bila kuufanya kuwa uamuzi wa lazima katika matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na kinachoeleweka kwa urahisi. Muundo wa vitenzi vya mfululizo umetumiwa kwa masimulizi ya kawaida, huku maana ya kisheria ya αἰτία ikihifadhiwa.
