base_translation:
  language: en
  yaml_path: translation/nt/john/018/023.yaml
  text: Jesus answered him[a], “If I spoke wrongly, testify about the wrong; but if rightly[b], why do you strike me?”
translation:
  language: sw
  text: Yesu akamjibu, “Ikiwa nilisema vibaya, toa ushahidi kuhusu ubaya huo[a]; lakini ikiwa nilisema vema, kwa nini unanipiga[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kuhusu jambo baya” au “kuhusu jambo lililokuwa baya.”
    reason: lexical_alternative
  - marker: b
    text: Au “unanipiga kwa nini?” Kitenzi cha Kigiriki kinaweza kumaanisha kupiga kwa maana pana, na katika miktadha mingine kupiga sana.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη αὐτῷ Ἰησοῦς
  choice: Yesu akamjibu
  rationale: Muundo huu ni wa kawaida katika masimulizi ya Kiswahili, unaonyesha kwamba Yesu alimjibu mtu aliyetajwa katika muktadha, na unadumisha mtiririko wa simulizi.
- source_word: Εἰ κακῶς ἐλάλησα
  choice: Ikiwa nilisema vibaya
  rationale: “Ikiwa” inadumisha sharti la hoja, na “nilisema vibaya” huwakilisha kauli ya wakati uliopita pamoja na maana pana ya κακῶς bila kuamua kama ubaya huo ulikuwa wa kimaadili, wa kweli, au wa kufaa.
- source_word: μαρτύρησον
  choice: toa ushahidi
  rationale: Kauli hii ya amri ina maana ya kutoa ushahidi na inafaa mazingira ya kisheria au ya uchunguzi kuliko neno la jumla kama “sema.”
- source_word: περὶ τοῦ κακοῦ
  choice: kuhusu kosa hilo
  rationale: “Kosa hilo” ni Kiswahili cha kawaida katika hoja ya kutaka jambo linalodaiwa kuwa baya lithibitishwe. Tanbihi inadumisha uwezekano mpana wa “ubaya huo” au “jambo lililokuwa baya.”
- source_word: εἰ δὲ καλῶς
  choice: lakini ikiwa nilisema vema
  rationale: “Lakini” inaonyesha ulinganisho wa matawi mawili ya sharti. “Vema” inahifadhi upinzani wa κακῶς na καλῶς kwa lugha fupi na ya asili.
- source_word: τί με δέρεις
  choice: kwa nini unanipiga
  rationale: Katika muktadha huu τί hutenda kazi kama “kwa nini.” Kitenzi δέρεις kinaweza kumaanisha kupiga kwa upana; “unanipiga” hakiamui bila msingi kwamba lilikuwa kofi au kipigo cha muda mrefu.
theological_decisions:
- issue: Namna ya kuwasilisha jibu la Yesu kwa vurugu isiyo na ushahidi
  choice: Jibu limetafsiriwa kama dai la kutoa ushahidi likifuatiwa na swali kuhusu kupigwa.
  alternative: Kulipanua kuwa shutuma ya wazi ya ukiukaji wa sheria, au kulainisha sauti yake isiwe na uzito wa kimahakama.
  rationale: Kigiriki chenyewe kinaweka mkazo katika ushahidi na kutokuwa na msingi wa kumpiga Yesu, lakini hakiongezi maelezo ya kidoktrini au hukumu pana ya kisheria. Tafsiri inadumisha mvutano huo bila kuufafanua kupita maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa simulizi la Injili. “Toa ushahidi” inadumisha sauti ya kimahakama, huku “vibaya/vema” na “unanipiga” vikibaki wazi na kueleweka kwa wasomaji wa kawaida.
