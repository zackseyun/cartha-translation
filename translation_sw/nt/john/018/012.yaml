  yaml_path: translation/nt/john/018/012.yaml
  text: So the cohort[a], the commander, and the officers of the Jews seized Jesus and bound him.
translation:
  language: sw
  text: Basi kikosi cha askari, kamanda, na maafisa wa Wayahudi[a] wakamkamata Yesu na kumfunga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “wa viongozi wa Kiyahudi” au “wa Wayudea,” kutegemea muktadha. Mara nyingi Yohana hutumia “Wayahudi” kwa maana finyu kuliko watu wote wa Kiyahudi.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Basi
  rationale: Inaendeleza simulizi na kuonyesha kuwa tendo hili lilifuata matukio yaliyotangulia, kwa lugha ya kawaida na yenye heshima.
- source_word: σπεῖρα
  choice: kikosi cha askari
  rationale: Neno hili ni istilahi ya kijeshi inayoweza kumaanisha kohorti; tafsiri hii inaeleweka kwa urahisi bila kudai wazi kwamba kikosi kizima kilikuwapo.
- source_word: χιλίαρχος
  choice: kamanda
  rationale: Humtaja afisa mkuu wa kijeshi aliyesimamia kikosi; “kamanda” ni sahihi na inaeleweka zaidi kuliko cheo cha kihistoria kisichozoeleka.
- source_word: ὑπηρέται
  choice: walinzi
  rationale: Katika muktadha huu ni watumishi rasmi waliohusika katika ukamataji, si watumishi wa nyumbani. “Walinzi” inaonyesha kazi yao bila kuongeza maelezo yasiyosemwa wazi kama “polisi wa Hekalu.”
- source_word: τῶν Ἰουδαίων
  choice: wa Wayahudi
  rationale: Inahifadhi muundo wa Kigiriki bila kuamua kimya-kimya kwamba maana yake lazima iwe viongozi wa Kiyahudi au wakazi wa Yudea; tanbihi inaeleza uwezekano wa maana finyu kulingana na muktadha.
- source_word: συνέλαβον
  choice: wakamkamata
  rationale: Inaonyesha kumshika na kumtia chini ya ulinzi; ni ya asili katika simulizi la Kiswahili na haihitaji kudokeza taratibu rasmi zaidi za kisheria.
- source_word: ἔδησαν
  choice: kumfunga
  rationale: Ni tafsiri ya moja kwa moja ya tendo la kumfunga Yesu, katika mtindo wa kawaida na wenye heshima.
theological_decisions:
- issue: Maana na rejeo la τῶν Ἰουδαίων katika Injili ya Yohana
  choice: wa Wayahudi
  alternative: wa viongozi wa Kiyahudi; wa Wayudea
  rationale: Matini kuu inahifadhi maneno ya Kigiriki na utata wake badala ya kuyafanya yawahusu viongozi pekee. Tanbihi inazuia usemi huo usieleweke kana kwamba unawahusu Wayahudi wote bila tofauti.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa vitenzi mfululizo “wakamkamata ... na kumfunga” unaendeleza simulizi kwa ufasaha. Tanbihi imewekwa baada ya “Wayahudi,” ambako utata unaohitaji ufafanuzi unatokea.
