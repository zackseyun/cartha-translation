id: JHN.18.7
reference: John 18:7
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: πάλιν οὖν ⸂ἐπηρώτησεν αὐτούς⸃· Τίνα ζητεῖτε; οἱ δὲ εἶπαν· Ἰησοῦν τὸν Ναζωραῖον.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/007.yaml
  text: So he asked them again[a], “Whom are you seeking?” And they said, “Jesus the Nazarene.”
translation:
  language: sw
  text: Basi akawauliza tena, “Mnamtafuta nani?” Nao wakasema, “Yesu Mnazareti[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Yesu wa Nazareti”; Kigiriki, “Yesu Mnazareti.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: tena
  rationale: Kielezi hiki huonyesha kurudiwa kwa tendo; “tena” ni kifupi na cha kawaida katika simulizi.
- source_word: οὖν
  choice: Basi
  rationale: Kiunganishi hiki kinaendeleza tukio kutokana na yaliyotangulia; “Basi” hudumisha mtiririko wa simulizi bila kutoa uzito mkubwa kupita kiasi wa hitimisho.
- source_word: ἐπηρώτησεν αὐτούς
  choice: akawauliza
  rationale: Kitenzi kinamaanisha kuwauliza swali la moja kwa moja. “Akawauliza” ni Kiswahili cha kawaida na kinaonyesha pia walengwa wa swali.
- source_word: Τίνα ζητεῖτε
  choice: Mnamtafuta nani?
  rationale: Muundo huu ni wa asili katika Kiswahili na unahifadhi maana ya tendo linaloendelea la kumtafuta mtu.
- source_word: οἱ δὲ εἶπαν
  choice: Nao wakasema
  rationale: δέ hapa huendeleza mazungumzo kwa tofauti ndogo; “Nao” huunganisha jibu lao kwa mtiririko wa simulizi.
- source_word: Ἰησοῦν
  choice: Yesu
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili.
- source_word: τὸν Ναζωραῖον
  choice: Mnazareti
  rationale: Ναζωραῖος ni jina la kumtambulisha mtu kwa uhusiano wake na Nazareti. “Mnazareti” huhifadhi umbo la lakabu la Kigiriki, huku mbadala wa kawaida zaidi “wa Nazareti” ukitolewa katika tanbihi.
theological_decisions:
- issue: Kutafsiri Ναζωραῖος kama lakabu ya Yesu
  choice: Mnazareti
  alternative: wa Nazareti
  rationale: Hili hasa ni jina la kihistoria la kumtambulisha Yesu, si cheo cha kimafundisho. “Mnazareti” hudumisha umbo la Kigiriki bila kuongeza dai jingine la kiufafanuzi; “wa Nazareti” ni tafsiri ya kawaida na ya asili zaidi, hivyo imehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa simulizi la Maandiko. Alama ya tanbihi imewekwa baada ya neno linalohusika moja kwa moja.
