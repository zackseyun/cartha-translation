  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Εἰσῆλθεν οὖν ⸂πάλιν εἰς τὸ πραιτώριον⸃ ὁ Πιλᾶτος καὶ ἐφώνησεν τὸν Ἰησοῦν καὶ εἶπεν αὐτῷ· Σὺ εἶ ὁ βασιλεὺς τῶν Ἰουδαίων;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/033.yaml
  text: So Pilate went back into the governor’s headquarters and called Jesus and said to him[b][a], “Are you the King of the Jews?”
translation:
  language: sw
  text: Basi Pilato akaingia tena katika makao makuu ya gavana[a], akamwita Yesu na kumwambia, “Je, wewe ndiye Mfalme wa Wayahudi[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “praitōrioni,” yaani makao rasmi au makao makuu ya gavana wa Kirumi.
    reason: lexical_alternative
  - marker: b
    text: Au “Watu wa Yudea.” Neno la Kigiriki linaweza kumaanisha Wayahudi kwa ujumla au, katika miktadha fulani, watu wa Yudea.
    reason: alternative_reading
lexical_decisions:
- source_word: Εἰσῆλθεν ... πάλιν
  choice: akaingia tena
  rationale: Muunganiko huu unaeleza kuingia kwa mara nyingine au kurudi ndani; “akaingia tena” ni wa kawaida na unaofuata mtiririko wa simulizi kwa Kiswahili.
- source_word: οὖν
  choice: Basi
  rationale: “Basi” huonyesha mwendelezo au matokeo katika simulizi bila kutoa uzito wa kimantiki uliozidi muktadha.
- source_word: πραιτώριον
  choice: makao makuu ya gavana
  rationale: Neno hili hapa linamaanisha jengo rasmi la gavana wa Kirumi, yaani makao au kituo chake cha utawala. Tafsiri hii inaeleweka kwa wasomaji wa sasa kuliko neno la mkopo lisilo la kawaida.
- source_word: ἐφώνησεν τὸν Ἰησοῦν
  choice: akamwita Yesu
  rationale: φωνέω katika muktadha huu ni kumwita mtu aje au aitwe; “akamwita” ni ya asili na haiongezi ukali unaoweza kudokezwa na “akamwamuru aitwe.”
- source_word: εἶπεν αὐτῷ
  choice: na kumwambia
  rationale: Tafsiri hii inadumisha maana ya msingi ya λέγω, “kusema/kumwambia,” huku alama na muundo wa maneno yanayonukuliwa vikionyesha kuwa ni swali.
- source_word: Σὺ εἶ ὁ βασιλεὺς
  choice: Je, wewe ndiye Mfalme
  rationale: “Wewe ndiye” huhifadhi msisitizo wa kiwakilishi cha wazi σύ na utambulisho unaoonyeshwa na kibainishi katika ὁ βασιλεύς. “Je” huweka wazi swali kwa Kiswahili sanifu.
- source_word: τῶν Ἰουδαίων
  choice: wa Wayahudi
  rationale: Katika shtaka la kisiasa mbele ya Pilato, “Mfalme wa Wayahudi” ndilo tamko linalofaa zaidi kihistoria na kimuktadha; uwezekano wa maana ya “Watu wa Yudea” umehifadhiwa katika tanbihi.
theological_decisions:
- issue: Maana ya Ἰουδαίων katika cheo cha kifalme
  choice: Wayahudi
  alternative: Watu wa Yudea
  rationale: Muktadha ni shtaka la Kirumi kuhusu ufalme wa Yesu, hivyo “Wayahudi” linafaa kwa kundi la kikabila, kidini na kisiasa linalokusudiwa. Hata hivyo, neno la Kigiriki linaweza katika miktadha fulani kuwa na maana ya kijiografia, kwa hiyo uwezekano huo haujafutwa bali umewekwa katika tanbihi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa vitenzi mfululizo unadumisha mwendo wa simulizi; tanbihi zinaeleza istilahi ya Kirumi na utata halisi wa Ἰουδαίων.
