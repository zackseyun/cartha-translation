  yaml_path: translation/nt/john/018/029.yaml
  text: So Pilate went outside to them and said, “What accusation do you bring against this man?”
translation:
  language: sw
  text: Basi Pilato akatoka nje akawaendea, akasema, “Mnaleta shtaka gani dhidi ya mtu huyu?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξῆλθεν ... ἔξω
  choice: akatoka nje
  rationale: Kitenzi pamoja na kielezi vinasisitiza mwendo kutoka ndani kwenda nje; ‘akatoka nje’ ni Kiswahili cha kawaida kinachohifadhi maana hiyo ya mahali.
- source_word: οὖν
  choice: Basi
  rationale: Hapa neno hili linaendeleza simulizi kwa kuonyesha hatua inayofuata kutokana na mazingira yaliyotangulia; ‘Basi’ linafaa katika simulizi la Kiswahili.
- source_word: πρὸς αὐτούς
  choice: kwenda kwao
  rationale: πρός pamoja na hali ya kuelekea inaonyesha mwendo wa kwenda mahali walipokuwa ili kukutana nao; ‘kwenda kwao’ huepuka maana isiyokusudiwa ya kutoka nje kwa sababu yao.
- source_word: φησίν
  choice: akasema
  rationale: Ingawa Kigiriki kinatumia wakati uliopo wa kihistoria, wakati uliopita wa kisimulizi ni wa asili katika Kiswahili.
- source_word: Τίνα κατηγορίαν
  choice: shtaka gani
  rationale: κατηγορία ni shtaka la kisheria; ‘shtaka’ ni neno la kawaida na sahihi katika muktadha wa mashitaka.
- source_word: φέρετε
  choice: mnaleta
  rationale: Kitenzi hiki kina maana ya kuleta au kuwasilisha shtaka; ‘mnaleta’ kinahifadhi taswira na nguvu ya kitenzi cha Kigiriki.
- source_word: κατὰ τοῦ ἀνθρώπου τούτου
  choice: dhidi ya mtu huyu
  rationale: κατά pamoja na jenitivi ina maana ya ‘dhidi ya’ katika muktadha wa kisheria, na ἄνθρωπος hapa humrejelea mwanamume huyu binafsi; Kiswahili kwa kawaida hutumia ‘mtu huyu’ bila kupoteza marejeo hayo.
