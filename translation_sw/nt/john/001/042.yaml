  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ⸀ἤγαγεν αὐτὸν πρὸς τὸν Ἰησοῦν. ἐμβλέψας αὐτῷ ὁ Ἰησοῦς εἶπεν· Σὺ εἶ Σίμων ὁ υἱὸς ⸀Ἰωάννου, σὺ κληθήσῃ Κηφᾶς (ὃ ἑρμηνεύεται Πέτρος).
base_translation:
  language: en
  yaml_path: translation/nt/john/001/042.yaml
  text: He brought him to Jesus[a]. Looking at him, Jesus said, “You are Simon, the son of John[b]; you will be called Cephas” (which is translated Peter).
translation:
  language: sw
  text: Akamleta kwa Yesu. Yesu akamtazama kwa makini, akasema, “Wewe ni Simoni, mwana wa Yohana[a]; utaitwa Kefa[b]” (ambalo tafsiri yake ni Petro).
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati zina “Yona” badala ya “Yohana”; matini ya SBLGNT ina “Yohana.”
    reason: textual_variant
  - marker: b
    text: Kefa ni jina la Kisemiti linalolingana na Petro, na lina maana ya “mwamba” au “jiwe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγαγεν αὐτὸν πρὸς τὸν Ἰησοῦν
  choice: Akamleta kwa Yesu
  rationale: Kitenzi ἄγω hapa kinaeleza kumleta mtu kwa mtu mwingine; “akamleta kwa Yesu” ni Kiswahili cha kawaida na huhifadhi tendo lililokamilika bila kuongeza namna ya kuandamana naye.
- source_word: ἐμβλέψας αὐτῷ
  choice: Yesu akamtazama kwa makini
  rationale: ἐμβλέπω hudokeza kumtazama mtu kwa uangalifu au kwa mkazo, si kumwona kijuujuu tu. “Akamtazama kwa makini” huonyesha dokezo hilo kwa lugha ya kawaida bila kulitia chumvi.
- source_word: Σὺ εἶ Σίμων
  choice: Wewe ni Simoni
  rationale: Kiwakilishi cha wazi σὺ kimehifadhiwa kwa “wewe,” kikitoa uelekezaji wa moja kwa moja unaopatikana katika Kigiriki.
- source_word: ὁ υἱὸς Ἰωάννου
  choice: mwana wa Yohana
  rationale: Matini ya SBLGNT ina Ἰωάννου, yaani Yohana. Tofauti ya “Yona” imehifadhiwa katika tanbihi.
- source_word: κληθήσῃ
  choice: utaitwa
  rationale: Hii ni kauli tendwa ya wakati ujao ya καλέω; “utaitwa” huhifadhi wakati ujao na tendo la kupewa jina.
- source_word: Κηφᾶς
  choice: Kefa
  rationale: Jina la Kisemiti limetoholewa kwa umbo la Kiswahili linalotumika kwa kawaida, bila kutafsiri maana yake ndani ya matini kuu.
- source_word: ὃ ἑρμηνεύεται Πέτρος
  choice: jina hilo likitafsiriwa ni Petro
  rationale: Usemi huu huhifadhi maelezo ya matini kwamba jina la Kisemiti Kefa linatolewa kwa jina la Kigiriki Petro, huku ukisomeka kwa Kiswahili cha kawaida.
theological_decisions:
- issue: Namna ya kutafsiri maelezo ya Κηφᾶς/Πέτρος
  choice: Kuhifadhi Kefa na Petro kama majina katika matini kuu
  alternative: Kutafsiri jina moja kwa moja kuwa “Mwamba” au “Jiwe”
  rationale: Mstari unahusu Yesu kumpa Simoni jina jipya. Matini yenyewe inalinganisha jina la Kisemiti na jina la Kigiriki; kwa hiyo majina yote mawili yamehifadhiwa, huku maana yake ya kileksika ikielezwa katika tanbihi bila kuamua kwa niaba ya msomaji matokeo yoyote ya kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni fupi na wazi; “kwa makini” huhifadhi uzito wa ἐμβλέψας, na majina Yohana, Kefa, na Petro yanafuata maumbo yanayotambulika kwa wasomaji wa Kiswahili.
