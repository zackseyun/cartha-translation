base_translation:
  language: en
  yaml_path: translation/nt/john/001/040.yaml
  text: Andrew[a], Simon Peter’s brother, was one of the two who had heard from John and followed him.
translation:
  language: sw
  text: Andrea, ndugu ya Simoni Petro, alikuwa mmoja wa wale wawili waliokuwa wamesikia kutoka kwa Yohana na kumfuata Yesu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kwa uhalisi zaidi, Kiyunani husema: “mmoja wa wale wawili waliokuwa wamesikia kutoka kwa Yohana na kumfuata yeye.” Katika muktadha, “yeye” ni Yesu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν
  choice: alikuwa
  rationale: Kitenzi hiki cha wakati uliopita kinatumika kama kiunganishi cha kumtambulisha Andrea kuwa mmoja wa wale wawili.
- source_word: Ἀνδρέας
  choice: Andrea
  rationale: Jina limeandikwa kwa namna iliyozoeleka katika tafsiri za Biblia za Kiswahili.
- source_word: ὁ ἀδελφὸς Σίμωνος Πέτρου
  choice: ndugu yake Simoni Petro
  rationale: Katika muktadha huu ἀδελφός ni ndugu wa kiume wa familia; muundo wa umilikaji ni wa kawaida na wazi katika Kiswahili.
- source_word: εἷς ἐκ τῶν δύο
  choice: mmoja wa wale wawili
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaohifadhi maana kamili ya sehemu ya kundi la watu wawili.
- source_word: τῶν ἀκουσάντων παρὰ Ἰωάννου
  choice: waliomsikia Yohana
  rationale: παρά pamoja na hali ya genitivi humtaja Yohana kama chanzo cha yale waliyosikia. Kiswahili cha kawaida husema waliomsikia mtu bila kulazimika kuongeza 'kutoka kwa'; kiambishi cha yambwa kinamrejelea Yohana.
- source_word: καὶ ἀκολουθησάντων αὐτῷ
  choice: na kumfuata Yesu
  rationale: ἀκολουθέω ni 'kufuata.' Kwa kuwa Kiswahili hutumia kiambishi cha yambwa chenye ngeli ya mtu ambacho peke yake kingeweza kumrejelea Yohana kimakosa, jina 'Yesu' limewekwa wazi kulingana na muktadha wa karibu wa Yohana 1:35–39.
theological_decisions:
- issue: Anayerejelewa na αὐτῷ
  choice: Yesu ametajwa wazi katika maandishi
  alternative: kutafsiri 'na kumfuata' na kuacha kiwakilishi bila jina
  rationale: Kisarufi αὐτῷ ni 'yeye,' lakini simulizi la karibu linaonyesha kwamba wanafunzi walimsikia Yohana kisha wakamfuata Yesu. Katika Kiswahili, 'waliomsikia Yohana na kumfuata' kwa kawaida humfanya Yohana aonekane kuwa ndiye aliyefuatwa; kumtaja Yesu kunazuia utata unaotokana na muundo wa lugha pokezi bila kubadili mtiririko wa simulizi.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imeundwa kwa urahisi wa usomaji wa kawaida; jina Yesu limewekwa wazi ili kuzuia kiwakilishi cha Kiswahili kisimrejelee Yohana kimakosa.
