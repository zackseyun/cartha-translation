base_translation:
  language: en
  yaml_path: translation/nt/john/001/012.yaml
  text: But to all who received him[a], he gave them the right to become children of God—to those who believe in his name,
translation:
  language: sw
  text: Lakini wote waliompokea, aliwapa haki[a] ya kufanyika watoto wa Mungu, wale wanaoamini katika jina lake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “mamlaka” au “uwezo”; neno la Kigiriki linaweza kumaanisha mamlaka iliyotolewa, haki, au uwezo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσοι
  choice: wale wote
  rationale: Kauli hii ya wingi inawahusu watu wote wanaotajwa; “wale wote” ni Kiswahili cha kawaida na huhifadhi maana ya jumla.
- source_word: δὲ
  choice: Lakini
  rationale: Kiunganishi hiki kinaonyesha tofauti na kukataliwa kwake katika mstari uliotangulia.
- source_word: ἔλαβον αὐτόν
  choice: waliompokea
  rationale: Katika muktadha huu, λαμβάνω humaanisha kumpokea au kumkaribisha yeye, si kumchukua kimwili. “Waliompokea” huhifadhi usemi wa Yohana bila kuufafanua kupita kiasi.
- source_word: ἔδωκεν
  choice: aliwapa
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya kitenzi δίδωμι.
- source_word: ἐξουσίαν
  choice: haki
  rationale: Hapa neno hilo linaonyesha ruhusa au hadhi aliyopewa mtu ya kufanyika mtoto wa Mungu, wala si nguvu ghafi. “Haki” ni ya asili katika Kiswahili hiki, huku uwezekano wa “mamlaka” na “uwezo” ukitajwa katika tanbihi.
- source_word: τέκνα θεοῦ
  choice: watoto wa Mungu
  rationale: τέκνα ni neno linalowajumuisha watoto wa jinsia zote, si wana wa kiume pekee.
- source_word: γενέσθαι
  choice: kufanyika
  rationale: Kitenzi hiki kinaonyesha kuingia katika hali mpya; “kufanyika” huhifadhi mabadiliko hayo vizuri kuliko “kuwa” peke yake.
- source_word: τοῖς πιστεύουσιν
  choice: wale wanaoamini
  rationale: Kirai hiki kinawatambulisha watu wenye sifa ya kuamini na kinaendelea kuhifadhi umbo la kitenzi la Kigiriki.
- source_word: εἰς τὸ ὄνομα αὐτοῦ
  choice: katika jina lake
  rationale: Usemi huu unaelekeza imani kwa nafsi na utambulisho wake uliofunuliwa. “Katika jina lake” huhifadhi neno ὄνομα na mwelekeo wa imani unaodokezwa na εἰς.
theological_decisions:
- issue: Uhusiano kati ya “waliompokea” na “wale wanaoamini katika jina lake”
  choice: Misemo yote miwili imetafsiriwa, na wa pili umetambulishwa kwa “yaani” kuwa ufafanuzi wa watu waliompokea.
  alternative: Kuichukulia misemo hiyo kuwa visawe kamili na kutafsiri wazo moja tu.
  rationale: Kigiriki kinahifadhi misemo yote miwili. Kirai cha mwisho kinawatambulisha wapokeaji kwa usahihi zaidi bila kufuta usemi wa kwanza; hivyo uzito wa kiteolojia wa Yohana unabaki bila kuamuliwa kupita kiasi.
- issue: Maana ya τέκνα katika uhusiano na Mungu
  choice: watoto wa Mungu
  alternative: wana wa Mungu
  rationale: Kigiriki kimetumia τέκνα, ambalo linawahusu watoto kwa upana, si υἱοί ambalo lingeweza kudokeza wana. Tafsiri hii ni sahihi kijinsia na haiingizi maana ya kiume isiyokuwamo katika chanzo.
- issue: Maana ya ἐξουσίαν katika kufanyika watoto wa Mungu
  choice: haki
  alternative: mamlaka au uwezo
  rationale: Muktadha unasisitiza hadhi au ruhusa inayotolewa na Kristo. Tanbihi inahifadhi upana halisi wa neno la Kigiriki bila kulazimisha maana moja pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Mstari mrefu umetenganishwa kwa dashibodi ili kirai cha mwisho cha ufafanuzi kisomeke wazi; alama ya tanbihi imewekwa baada ya neno linalohusika, “haki”.
