base_translation:
  language: en
  yaml_path: translation/nt/john/001/014.yaml
  text: And the Word became flesh and dwelt among us[a], and we saw his glory, glory as of the one and only Son from the Father[b], full of grace and truth.
translation:
  language: sw
  text: Neno alifanyika mwili, akakaa miongoni mwetu[a]. Nasi tuliona utukufu wake, utukufu kama wa Mwana wa pekee aliyetoka kwa Baba[b], akiwa amejaa neema na kweli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “akapiga hema lake miongoni mwetu” au “akaweka maskani yake miongoni mwetu”; kitenzi hiki kina mwangwi wa taswira ya hema au maskani.
    reason: lexical_alternative
  - marker: b
    text: Au, “Mwana mzaliwa-pekee”; au, “Mwana wa kipekee.” Neno “Mwana” halijaandikwa wazi katika Kigiriki, lakini linaeleweka kutokana na muktadha wa “Baba.”
    reason: alternative_reading
lexical_decisions:
- source_word: λόγος
  choice: Neno
  rationale: Ni jina la Kiyohana lililozoeleka na lenye upana wa maana kuliko “Ujumbe” au “Akili”; pia linadumisha uhusiano wake na mistari ya mwanzo ya utangulizi.
- source_word: σὰρξ
  choice: mwili
  rationale: Linahifadhi uzito wa usemi wa Kigiriki kuhusu Neno kuingia katika maisha halisi ya kibinadamu yenye mwili, bila kuugeuza kuwa dhana ya jumla kama “ubinadamu” au “asili ya kibinadamu.”
- source_word: ἐγένετο
  choice: akawa
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha badiliko linalotajwa wazi katika sentensi.
- source_word: ἐσκήνωσεν ἐν ἡμῖν
  choice: akakaa miongoni mwetu
  rationale: Ni tafsiri ya asili na inayoeleweka kwa urahisi. Taswira ya kupiga hema au maskani imehifadhiwa katika tanbihi.
- source_word: ἐθεασάμεθα
  choice: tukauona
  rationale: Inaonyesha kuona kwa ushuhuda wa moja kwa moja kwa lugha ya sasa, bila kutumia msamiati wa kizamani.
- source_word: δόξαν
  choice: utukufu
  rationale: Ni neno la kawaida la kibiblia linalobeba maana ya fahari na uwepo wenye adhama.
- source_word: ὡς
  choice: kama wa
  rationale: Linahifadhi muundo wa ulinganisho wa Kigiriki bila kudokeza kwamba utukufu huo ulikuwa mwonekano wa bandia tu.
- source_word: μονογενοῦς
  choice: Mwana wa pekee
  rationale: Katika muktadha wa Baba, usemi huu unaeleza upekee wa uhusiano wa Mwana. “Mwana” imetumiwa kwa uwazi wa Kiswahili, ingawa nomino hiyo haijaandikwa moja kwa moja katika Kigiriki; jambo hilo na tafsiri ya jadi vimeelezwa katika tanbihi.
- source_word: παρὰ πατρός
  choice: anayetoka kwa Baba
  rationale: Inaonyesha asili au kuja kutoka kwa Baba kwa Kiswahili cha kawaida, huku ikitambua kwamba παρά pia inaweza kusisitiza kuwa karibu na Baba.
- source_word: πλήρης χάριτος καὶ ἀληθείας
  choice: akiwa amejaa neema na kweli
  rationale: Inahifadhi maneno muhimu ya kibiblia na kuelekeza maelezo hayo kwa Neno/Mwana, sawasawa na hali ya kivumishi cha Kigiriki.
theological_decisions:
- issue: Maana ya μονογενοῦς katika muktadha wa Mwana na Baba
  choice: Mwana wa pekee
  alternative: Mwana mzaliwa-pekee; au, aliye wa pekee
  rationale: Maana kuu hapa ni upekee wa Mwana. Tafsiri ya jadi “mzaliwa-pekee” ina umuhimu wa kihistoria lakini si lazima iwe maana ya kimsingi ya neno lenyewe, kwa hiyo imehifadhiwa katika tanbihi. Kwa kuwa Kigiriki hakina nomino “Mwana” waziwazi katika kishazi hiki, hali hiyo pia imetajwa ili kutoficha muundo wa chanzo.
- issue: Taswira ya maskani katika ἐσκήνωσεν
  choice: akakaa miongoni mwetu
  alternative: akapiga hema lake miongoni mwetu; akaweka maskani yake miongoni mwetu
  rationale: Matini kuu inatanguliza uelewekaji wa kawaida, lakini tanbihi inadumisha mwangwi unaowezekana wa hema au maskani ya uwepo wa Mungu.
- issue: Mhusika anayeelezwa kuwa amejaa neema na kweli
  choice: akiwa amejaa neema na kweli
  alternative: uliojawa neema na kweli
  rationale: Kivumishi πλήρης kiko katika umbo la kiume la umoja na kinaelekea kumweleza Neno/Mwana, si “utukufu” wa kike katika Kigiriki. Muundo wa Kiswahili unadumisha mwelekeo huo bila kuongeza maelezo ya kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi ya kifasihi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo “Neno akawa mwili” umehifadhiwa kwa makusudi ili kudumisha nguvu ya chanzo, huku “akakaa miongoni mwetu” na “tukauona” zikitumia lugha ya sasa isiyo ya kizamani.
