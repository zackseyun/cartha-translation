  text: Τῇ ἐπαύριον ἠθέλησεν ἐξελθεῖν εἰς τὴν Γαλιλαίαν. καὶ εὑρίσκει Φίλιππον καὶ λέγει αὐτῷ ὁ Ἰησοῦς· Ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/043.yaml
  text: The next day he wanted to go out into Galilee[a], and Jesus finds Philip and says to him[c][b], “Follow me.”
translation:
  language: sw
  text: Kesho yake alitaka kwenda Galilaya.[a] Yesu akamkuta Filipo, akamwambia,[b] “Nifuate.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kuingia Galilaya.” Kihusishi cha Kigiriki kinaonyesha mwendo kuelekea au kuingia katika eneo hilo.
    reason: lexical_alternative
  - marker: b
    text: Katika Kigiriki, vitenzi “anakuta” na “anamwambia” viko katika wakati wa sasa wa kihistoria ili kufanya simulizi liwe hai. Kiswahili kimetumia mtiririko wa kawaida wa usimulizi, “akamkuta … akamwambia.”
    reason: lexical_alternative
  - marker: c
    text: Amri “Nifuate” inaweza kumaanisha kuandamana na Yesu kimwili na pia mwito mpana wa kuwa mwanafunzi wake.
    reason: alternative_reading
lexical_decisions:
- source_word: Τῇ ἐπαύριον
  choice: Kesho yake
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha siku iliyofuata katika mfululizo wa simulizi.
- source_word: ἠθέλησεν
  choice: alitaka
  rationale: Huhifadhi maana ya kutaka au kuwa na nia bila kuifanya kwa lazima kuwa uamuzi rasmi.
- source_word: ἐξελθεῖν εἰς τὴν Γαλιλαίαν
  choice: kwenda Galilaya
  rationale: Ni Kiswahili cha kawaida kwa mwendo kuelekea eneo hilo; wazo la kutoka mahali pa awali linaeleweka katika muktadha bila kutumia tungo nzito.
- source_word: εὑρίσκει
  choice: akamkuta
  rationale: Kitenzi cha usimulizi chenye kiambishi aka- kinaendeleza matukio kwa kawaida katika Kiswahili. Ingawa Kigiriki kina wakati wa sasa wa kihistoria, Kiswahili cha sasa hapa kingesikika si cha kawaida.
- source_word: Φίλιππον
  choice: Filipo
  rationale: Jina limetoholewa kwa umbo lililozoeleka katika Kiswahili cha Biblia.
- source_word: λέγει αὐτῷ
  choice: akamwambia
  rationale: Huonyesha kwa kawaida kwamba Yesu alisema maneno yaliyofuata moja kwa moja kwa Filipo; aka- linaendeleza simulizi.
- source_word: Ἀκολούθει μοι
  choice: Nifuate
  rationale: Ni amri fupi na ya asili inayoweza kumaanisha kuandamana na Yesu na pia kuwa mwanafunzi wake, bila kufuta utata huo.
theological_decisions:
- issue: Nguvu ya amri ya Yesu kwa Filipo
  choice: “Nifuate,” mwito unaoweza kubeba maana ya kuandamana na Yesu na kumfuata kama mwanafunzi
  alternative: Mwaliko wa kwenda pamoja na Yesu kimwili tu
  rationale: Matumizi ya ἀκολουθέω katika Injili mara nyingi yana uzito wa uanafunzi, lakini mazingira pia yanahusu safari halisi. Tafsiri fupi “Nifuate” huhifadhi maana zote mbili bila kuamua zaidi ya maandishi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa aka- umetumiwa kwa mtiririko wa kawaida wa simulizi; sentensi imebaki fupi na ya moja kwa moja kama chanzo.
