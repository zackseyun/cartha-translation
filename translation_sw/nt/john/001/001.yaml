  yaml_path: translation/nt/john/001/001.yaml
  text: In the beginning was the Word[a], and the Word was with God[b], and the Word was God.
translation:
  language: sw
  text: Hapo mwanzo[a] alikuwako Neno, naye Neno alikuwa pamoja na Mungu, naye Neno alikuwa Mungu.[b]
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: Usemi “Hapo mwanzo” unaakisi Mwanzo 1:1 na kuhusianisha Neno na mwanzo wa uumbaji.
    reason: cross_reference
  - marker: b
    text: Au, “Neno alikuwa wa kimungu”; au, “alivyo Mungu, ndivyo alivyokuwa Neno.” Muundo wa Kigiriki katika kishazi cha mwisho huonyesha hasa sifa au asili ya Neno kuwa ya kimungu, huku ukiutofautisha Neno na “Mungu” anayetajwa katika kishazi kilichotangulia.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐν ἀρχῇ
  choice: Hapo mwanzo
  rationale: Ni usemi wa kawaida na wenye hadhi unaoakisi Mwanzo 1:1 na kuhusisha Neno na mwanzo wa uumbaji.
- source_word: ἦν
  choice: alikuwako / alikuwa
  rationale: Wakati usiotimilika wa εἰμί unaonyesha kuwako katika wakati unaotajwa. “Alikuwako” ni wa asili katika kishazi cha kwanza, huku “alikuwa” ikifaa katika vishazi vinavyoeleza uhusiano na asili; urudiaji wa kitenzi cha Kigiriki bado unaonekana.
- source_word: ὁ λόγος
  choice: Neno
  rationale: “Neno” huhifadhi wigo wa λόγος unaohusu usemi na ufunuo, na ni jina la kimuktadha linalomtaja kwa nafsi; herufi kubwa inaonyesha matumizi hayo bila kuingiza maelezo ya ziada.
- source_word: πρὸς τὸν θεόν
  choice: pamoja na Mungu
  rationale: Katika muktadha huu πρός inaonyesha uwepo pamoja, uhusiano, na mwelekeo wa kibinafsi. “Pamoja na Mungu” ni Kiswahili cha asili na hudumisha tofauti kati ya Neno na Mungu anayetajwa hapa.
- source_word: τὸν θεόν
  choice: Mungu
  rationale: Nomino yenye kibainishi inamtaja Mungu kwa namna maalumu; Kiswahili hakihitaji kibainishi tofauti hapa.
- source_word: θεὸς ἦν ὁ λόγος
  choice: Neno alikuwa Mungu
  rationale: Mpangilio wa asili unaweka θεός kama kiarifu chenye mkazo wa sifa au asili. Tafsiri hii inathibitisha kikamilifu asili ya Neno kuwa ya Mungu bila kumfanya Neno kuwa nafsi ileile na Mungu wa kishazi kilichotangulia.
theological_decisions:
- issue: Namna ya kutafsiri θεός isiyo na kibainishi katika kishazi cha mwisho
  choice: Neno alikuwa Mungu
  alternative: Neno alikuwa wa asili ya Mungu; au, alivyo Mungu, ndivyo alivyokuwa Neno
  rationale: 'Muundo wa Kigiriki una nguvu ya kisifa: unasema Neno ana asili kamili ya Mungu, huku ukidumisha tofauti ya kibinafsi iliyo katika kishazi kilichotangulia. Tafsiri kuu ni ya moja kwa moja na ya asili; tanbihi huhifadhi ufafanuzi mbadala bila kupunguza θεός kuwa sifa hafifu tu.'
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. “Naye” hudumisha mwendelezo na mdundo wa sentensi. Alama zote za tanbihi zimewekwa katika matini kuu karibu na maneno yanayohusika.
