lexical_decisions:
- source_word: ἐμαρτύρησεν
  choice: akatoa ushuhuda
  rationale: Kitenzi μαρτυρέω kinamaanisha kutoa ushahidi au ushuhuda. Kauli hii ni ya kawaida katika Kiswahili cha sasa na inadumisha wazo la shahidi.
- source_word: λέγων
  choice: akisema
  rationale: Kirai hiki kinafuata muundo wa hali ya kuendelea wa Kigiriki na kinatambulisha maneno ya ushuhuda wa Yohana kwa njia ya asili katika Kiswahili.
- source_word: Τεθέαμαι
  choice: Nimemwona
  rationale: Wakati timilifu wa Kigiriki unaonyesha jambo ambalo Yohana ameliona mwenyewe na ambalo ushuhuda wake wa sasa unategemea. Wakati timilifu wa Kiswahili unafikisha maana hiyo kwa uwazi.
- source_word: τὸ πνεῦμα
  choice: Roho
  rationale: Muktadha wa Yohana 1:32–33 unaonyesha kwamba anayerejelewa ni Roho Mtakatifu. Herufi kubwa inabainisha rejeleo hilo bila kuongeza neno lisilokuwapo hapa.
- source_word: καταβαῖνον
  choice: akishuka
  rationale: Neno hili linaeleza mwendo wa kuelekea chini. Muundo wa -ki- unaonyesha kitendo ambacho Yohana alimwona Roho akikifanya.
- source_word: ὡς περιστερὰν
  choice: kama njiwa
  rationale: ὡς inaonyesha ulinganisho. 'Kama njiwa' inadumisha taswira bila kudai kwamba Roho alikuwa njiwa kihalisi.
- source_word: ἐξ οὐρανοῦ
  choice: kutoka mbinguni
  rationale: ἐξ huonyesha chanzo cha mwendo. 'Kutoka mbinguni' ni kauli ya kawaida na wazi katika Kiswahili.
- source_word: ἔμεινεν
  choice: akabaki
  rationale: μένω ni kitenzi muhimu katika Injili ya Yohana chenye maana ya kubaki au kudumu. 'Akabaki' huepuka maana inayoweza kujitokeza ya 'akakaa' kama tendo la kuketi.
- source_word: ἐπ’ αὐτόν
  choice: juu yake
  rationale: Kirai hiki huonyesha kuwa Roho alishuka na kubaki juu ya mtu huyo. 'Juu yake' ni fasiri ya asili na sahihi.
theological_decisions:
- issue: Utambulisho wa τὸ πνεῦμα
  choice: Roho, akirejelea Roho Mtakatifu
  alternative: roho kwa maana isiyobainishwa
  rationale: Muktadha wa karibu, hasa mstari wa 33, unamtambulisha kama Roho Mtakatifu. Fasiri haiongezi neno 'Mtakatifu' katika mstari huu, bali inadumisha rejeleo kwa herufi kubwa.
- issue: Maana ya ὡς περιστερὰν
  choice: 'ulinganisho: ''kama njiwa'''
  alternative: '''akiwa njiwa'' au ''katika umbo la njiwa'''
  rationale: ὡς kwa kawaida huonyesha ufananisho. Tafsiri hii haifafanui kupita kiasi namna halisi ya kuonekana kwa Roho.
- issue: Upatanisho wa kisarufi kwa Roho
  choice: 'upatanisho wa nafsi: ''akishuka ... akabaki'''
  alternative: 'upatanisho wa ngeli usio wa nafsi: ''ikishuka ... ikabaki'''
  rationale: Katika Kiswahili cha kawaida cha kibiblia, Roho Mtakatifu hutajwa kwa upatanisho wa nafsi. Hii ni ya asili katika lugha lengwa na inapatana na muktadha wa kiungu bila kuongeza kiwakilishi tofauti na maandishi ya Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa urahisi. Muundo unafuata kwa karibu mtiririko wa Kigiriki huku ukibaki wa asili katika Kiswahili. Alama zote za tanbihi zimewekwa mahali zinapohusika katika matini kuu.
