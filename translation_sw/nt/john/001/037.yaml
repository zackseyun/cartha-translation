base_translation:
  language: en
  yaml_path: translation/nt/john/001/037.yaml
  text: And the two disciples heard him speaking[a], and they followed Jesus.
translation:
  language: sw
  text: Wale wanafunzi wawili[a] walimsikia akisema, nao wakamfuata Yesu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kueleza wazi zaidi, “wanafunzi wake wawili,” yaani wanafunzi wa Yohana Mbatizaji.
    reason: alternative_reading
lexical_decisions:
- source_word: ἤκουσαν
  choice: walimsikia
  rationale: Kitenzi hiki kinaeleza tukio la kusikia yaliyosemwa; “walimsikia” ni Kiswahili cha kawaida na hakidokezi kwa lazima kusikiliza kwa muda mrefu.
- source_word: οἱ δύο μαθηταὶ αὐτοῦ
  choice: wale wanafunzi wawili[a]
  rationale: “Wale” huwatambulisha wanafunzi wawili waliotajwa katika muktadha uliotangulia. Kiwakilishi αὐτοῦ, ambacho kinawahusisha na Yohana Mbatizaji, kinaelezwa katika tanbihi ili kuepuka kiwakilishi cha Kiswahili kinachoweza kueleweka kimakosa kuwa kinamhusu Yesu.
- source_word: λαλοῦντος
  choice: akisema hayo
  rationale: Muundo huu unaonyesha kwamba walimsikia wakati alipokuwa akisema maneno yaliyotangulia. “Hayo” ni rejeo la kawaida la Kiswahili kwa kauli iliyonukuliwa katika mstari uliotangulia, bila kuongeza maudhui mapya.
- source_word: ἠκολούθησαν
  choice: wakamfuata
  rationale: “Kumfuata” huhifadhi maana ya mara moja ya kwenda nyuma ya Yesu na pia mwangwi wa kuwa wafuasi wake, bila kulazimisha mojawapo ya maana hizo.
- source_word: τῷ Ἰησοῦ
  choice: Yesu
  rationale: Katika Kiswahili, mtu anayefuatwa huwekwa kama yambwa wa moja kwa moja katika kitenzi “kumfuata”; kiambishi -m- na jina “Yesu” huwasilisha uhusiano wa dative wa Kigiriki kwa kawaida.
theological_decisions:
- issue: Rejeo la αὐτοῦ katika οἱ δύο μαθηταὶ αὐτοῦ
  choice: Limeeleweka kuwa linamhusu Yohana Mbatizaji na kufafanuliwa katika tanbihi.
  alternative: Kutafsiri moja kwa moja “wanafunzi wake wawili,” jambo ambalo linaweza kumwacha msomaji wa Kiswahili akijiuliza ikiwa “wake” anamhusu Yohana au Yesu.
  rationale: Muktadha wa Yohana 1:35–36 unamtaja Yohana akiwa na wanafunzi wake wawili; baada ya wao kusikia kauli yake kuhusu Yesu, wanamfuata Yesu. Tanbihi huhifadhi taarifa ya kiwakilishi cha Kigiriki huku maandishi makuu yakibaki wazi na ya kawaida.
- issue: Maana ya kumfuata Yesu
  choice: Imetafsiriwa kwa “wakamfuata Yesu,” ikihifadhi maana ya kimwili na uwezekano wa maana ya uanafunzi.
  alternative: “Wakaenda nyuma ya Yesu” ingesisitiza mwendo wa kimwili pekee, na “wakawa wanafunzi wa Yesu” ingefafanua maana ya kitheolojia zaidi ya ilivyo wazi katika sentensi.
  rationale: Kitenzi cha Kigiriki ἀκολουθέω kinaweza kubeba viwango vyote viwili vya maana katika simulizi hili; “kumfuata” hudumisha mvutano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya simulizi la Biblia. “Nao wakamfuata” huunganisha matukio kwa mtiririko wa kawaida, na “wale” hurejelea wazi wanafunzi waliotajwa katika mstari uliotangulia.
