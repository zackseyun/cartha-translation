  text: ⸀ὅτι ἐκ τοῦ πληρώματος αὐτοῦ ἡμεῖς πάντες ἐλάβομεν, καὶ χάριν ἀντὶ χάριτος·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/016.yaml
  text: For from his fullness we have all received[a], and grace upon grace.
translation:
  language: sw
  text: Kwa maana sisi sote tumepokea kutoka katika utimilifu wake, na neema badala ya neema.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “neema juu ya neema,” au “neema moja baada ya nyingine.” Kirai cha Kigiriki kinaweza kudokeza neema zinazofuatana, lakini ἀντί kwa maana ya moja kwa moja zaidi ni “badala ya” au “mahali pa.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: Kwa maana
  rationale: Katika muktadha huu kiunganishi kinaanzisha maelezo au sababu ya yaliyotangulia; “Kwa maana” ni ya kawaida na huhifadhi nguvu hiyo.
- source_word: ἐκ τοῦ πληρώματος αὐτοῦ
  choice: kutokana na utimilifu wake
  rationale: “Kutokana na” huonyesha chanzo kinachodokezwa na ἐκ, huku “utimilifu wake” ikihifadhi maana ya πλήρωμα kuwa ukamilifu au wingi kamili ulio wake.
- source_word: ἡμεῖς πάντες
  choice: sisi sote
  rationale: Kiwakilishi kilichotajwa wazi pamoja na πάντες kina mkazo; “sisi sote” huhifadhi mkazo huo kwa Kiswahili cha kawaida.
- source_word: ἐλάβομεν
  choice: tumepokea
  rationale: Wakati timilifu wa Kiswahili unaeleza kwa kawaida tendo la kupokea lililotokea na ambalo matokeo yake yanaendelea kuwapo.
- source_word: καὶ
  choice: ','
  rationale: Katika kishazi hiki καὶ kinaweza kuleta ufafanuzi wa kile kilichopokewa. Koma huleta Kiswahili cha asili bila kulazimisha uhusiano kuwa wa kujumlisha tu.
- source_word: χάριν ἀντὶ χάριτος
  choice: neema badala ya neema
  rationale: “Badala ya” huhifadhi maana ya msingi ya ἀντί, yaani kitu kuchukua nafasi ya kingine, bila kufuta uwezekano wa mfululizo wa neema.
theological_decisions:
- issue: Maana ya χάριν ἀντὶ χάριτος
  choice: neema badala ya neema
  alternative: neema juu ya neema; neema moja baada ya nyingine
  rationale: Kirai hiki kina tafsiri kadhaa zinazowezekana. Matini kuu huhifadhi nguvu ya msingi ya ἀντί (“badala ya”), huku tanbihi ikionyesha uwezekano wa neema zinazofuatana au kuongezeka, bila kuamua kimya-kimya mvutano wa kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi ni fupi na inaeleweka kwa wasomaji wa kawaida; usemi “neema badala ya neema” umeachwa kwa makusudi ukiwa na mvutano wa matini asili, na tanbihi inafafanua uwezekano mwingine.
