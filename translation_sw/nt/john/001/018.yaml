  text: θεὸν οὐδεὶς ἑώρακεν πώποτε· ⸂μονογενὴς θεὸς⸃ ὁ ὢν εἰς τὸν κόλπον τοῦ πατρὸς ἐκεῖνος ἐξηγήσατο.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/018.yaml
  text: No one has ever seen God[a]; the one and only God, who is in the bosom of the Father[c][b], has made him known.
translation:
  language: sw
  text: Hakuna mtu aliyewahi kumwona Mungu; Mungu wa pekee[a], aliye kifuani mwa Baba[b], ndiye aliyemjulisha[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati zinasoma “Mwana wa pekee” (au “Mwana wa pekee aliyezaliwa”) badala ya “Mungu wa pekee.”
    reason: textual_variant
  - marker: b
    text: Au “aliye karibu kabisa na Baba.” Kigiriki kinasema kihalisi “aliye kifuani mwa Baba,” taswira inayoonyesha ukaribu wa ndani sana.
    reason: lexical_alternative
  - marker: c
    text: Au “aliyemweleza” au “aliyemfunua.”
    reason: lexical_alternative
lexical_decisions:
- source_word: θεὸν
  choice: Mungu
  rationale: Ni yambwa ya moja kwa moja ya ἑώρακεν na hapa θεός humrejelea Mungu moja kwa moja.
- source_word: οὐδεὶς
  choice: Hakuna mtu
  rationale: Ni Kiswahili cha kawaida na cha sasa kinachohifadhi ukanushaji wa jumla.
- source_word: ἑώρακεν πώποτε
  choice: aliyewahi kumwona
  rationale: Muundo huu unaonyesha kwamba hakuna mtu katika wakati wowote aliyemwona Mungu, na unasikika kwa asili katika Kiswahili.
- source_word: μονογενὴς θεὸς
  choice: Mungu wa pekee
  rationale: Toleo la SBLGNT linasoma θεός, 'Mungu'; μονογενής hapa lina maana ya aliye wa pekee au wa aina yake, si lazima neno lenyewe limaanishe 'aliyezaliwa.' Tofauti ya hati 'Mwana wa pekee' imehifadhiwa katika tanbihi.
- source_word: ὁ ὢν
  choice: aliye
  rationale: Kirai kishirikishi kinamfafanua 'Mungu wa pekee'; kishazi rejeshi ni cha asili zaidi katika Kiswahili.
- source_word: εἰς τὸν κόλπον τοῦ πατρὸς
  choice: kifuani mwa Baba
  rationale: Huhifadhi taswira ya κόλπος na kuonyesha ukaribu wa ndani sana; mbadala wa kimaanisho umetolewa katika tanbihi.
- source_word: ἐκεῖνος
  choice: ndiye
  rationale: Kiambishi hiki cha msisitizo kinawakilisha nguvu ya kiwakilishi cha kuonyesha ἐκεῖνος bila kurudia kiwakilishi kwa namna isiyo ya asili.
- source_word: ἐξηγήσατο
  choice: aliyemfunua
  rationale: Katika muktadha, kitenzi kinaeleza kumjulisha au kumdhihirisha Mungu; 'kumfunua' ni kifupi, cha asili, na huhifadhi wazo la ufunuo.
theological_decisions:
- issue: Tofauti ya maandishi kati ya μονογενὴς θεὸς na ὁ μονογενὴς υἱός
  choice: Matini kuu inafuata SBLGNT kwa 'Mungu wa pekee,' huku 'Mwana wa pekee' ikiwekwa katika tanbihi.
  alternative: Mwana wa pekee; Mwana pekee aliyezaliwa
  rationale: Kwa kuwa chanzo kilichotolewa kinasoma μονογενὴς θεός, tafsiri inafuata usomaji huo. Tofauti muhimu ya kihati na ya kikristolojia imeonyeshwa wazi badala ya kutatuliwa kimya kimya.
- issue: Maana ya μονογενής
  choice: wa pekee
  alternative: aliyezaliwa pekee; wa aina yake
  rationale: Ushahidi wa kileksika unaunga mkono maana ya upekee au kutokuwa na mwingine wa aina hiyo. Tafsiri ya jadi 'aliyezaliwa pekee' ina umuhimu wa kihistoria, lakini inaweza kudokeza kwamba wazo la kuzaliwa limo moja kwa moja katika maana ya kawaida ya neno.
- issue: Mhusika wa ἐξηγήσατο
  choice: Mungu wa pekee ndiye anayemfunua Mungu ambaye hakuna mtu aliyemwona.
  alternative: Ameeleza habari zake; amemjulisha
  rationale: Muundo wa Kigiriki unamrejesha mtendaji kwa μονογενὴς θεός na yambwa inayodokezwa kwa θεόν ya mwanzo. Kiswahili kimetumia 'ndiye' kuweka rejeo hilo wazi bila kuondoa mvutano wa matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. 'Kifuani mwa Baba' huhifadhi sitiari ya asili; 'ndiye' hudumisha msisitizo wa ἐκεῖνος na kuzuia utata wa mtendaji. Kila alama ya tanbihi imewekwa katika matini kuu.
