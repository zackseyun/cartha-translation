  text: ταῦτα ἐν Βηθανίᾳ ἐγένετο πέραν τοῦ Ἰορδάνου, ὅπου ἦν ⸀ὁ Ἰωάννης βαπτίζων.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/028.yaml
  text: These things took place in Bethany beyond the Jordan[a], where John was baptizing.
translation:
  language: sw
  text: Mambo haya yalitukia Bethania, ng’ambo ya Mto Yordani,[a] mahali ambapo Yohana alikuwa akibatiza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati na mapokeo ya baadaye ya tafsiri yana “Bethabara” badala ya “Bethania.”
    reason: textual_variant
lexical_decisions:
- source_word: ταῦτα
  choice: Mambo haya
  rationale: Huhifadhi wingi wa kiwakilishi cha Kigiriki na kurejelea mazungumzo na matukio yaliyotangulia.
- source_word: ἐν Βηθανίᾳ
  choice: Bethania
  rationale: Jina la mahali limetoholewa kwa namna iliyozoeleka katika Kiswahili; katika sentensi hii kihusishi tofauti si lazima kwa sababu kitenzi cha kutukia kinaweza kufuatwa moja kwa moja na mahali.
- source_word: ἐγένετο
  choice: yalitukia
  rationale: Ni usemi wa sasa, wa asili na wenye hadhi unaoonyesha kwamba mambo hayo yalifanyika, bila kutumia lugha ya kizamani.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: ng’ambo ya Mto Yordani
  rationale: Hueleza mahali upande wa pili wa Yordani kwa Kiswahili cha kawaida; neno “Mto” linaweka wazi kwamba Yordani hapa ni mto.
- source_word: ὅπου
  choice: mahali ambapo
  rationale: Hutoa uhusiano wa mahali kwa uwazi na kwa mtiririko wa kawaida wa Kiswahili.
- source_word: ἦν ... βαπτίζων
  choice: alikuwa akibatiza
  rationale: Muundo huu huhifadhi tendo lililokuwa likiendelea, kama muundo wa Kigiriki wa kitenzi kisaidizi pamoja na participio ya wakati uliopo.
theological_decisions:
- issue: Tofauti ya maandishi kati ya Βηθανίᾳ (Bethania) na Βηθαβαρᾷ (Bethabara)
  choice: Bethania
  alternative: Bethabara
  rationale: SBLGNT iliyotolewa ina Βηθανίᾳ; kwa hiyo maandishi makuu yanafuata ushahidi huo. “Bethabara,” inayopatikana katika baadhi ya hati na mapokeo ya baadaye ya tafsiri, imehifadhiwa katika tanbihi bila kuingizwa katika maandishi makuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. “Ng’ambo ya Mto Yordani” ni wazi na ya asili; “alikuwa akibatiza” huhifadhi hali ya tendo lililokuwa likiendelea.
