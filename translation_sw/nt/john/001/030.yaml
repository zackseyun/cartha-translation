  yaml_path: translation/nt/john/001/030.yaml
  text: This is he of whom I said[a], ‘After me comes a man who ranks before me[b], because he was before me.’
translation:
  language: sw
  text: Huyu ndiye yule ambaye nilisema kumhusu, “Baada yangu anakuja mwanamume ambaye amekuwa mbele yangu[a], kwa sababu alikuwa kabla yangu[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “amepata nafasi ya mbele kuliko mimi.” Kigiriki kinaweza kuonyesha kutangulia au kuwa na cheo cha juu, si mfuatano wa wakati tu.
    reason: lexical_alternative
  - marker: b
    text: Au, “alikuwapo kabla yangu.” Huenda maneno haya yanadokeza kuwako kwa Yesu kabla ya Yohana, ingawa Kigiriki kinasema kwa ufupi, “alikuwa kabla yangu.”
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτός ἐστιν
  choice: Huyu ndiye
  rationale: Muundo huu unatambulisha mtu kwa msisitizo na kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: ὑπὲρ οὗ ἐγὼ εἶπον
  choice: niliyesema juu yake
  rationale: Katika muundo huu ὑπέρ humaanisha ‘kuhusu’ au ‘juu ya’; tafsiri hii ni ya asili katika Kiswahili.
- source_word: Ὀπίσω μου ἔρχεται
  choice: Baada yangu anakuja
  rationale: ὀπίσω μου hapa inaonyesha mfuatano, hasa wa wakati au wa kujitokeza, kuliko mahali halisi nyuma ya mtu.
- source_word: ἀνὴρ
  choice: mtu
  rationale: Katika Kiswahili, ‘mtu’ humrejelea kwa kawaida mwanamume anayezungumziwa bila ulazima wa kutumia neno la kibayolojia ‘mwanamume’; muktadha unamtambulisha Yesu waziwazi.
- source_word: ἔμπροσθέν μου γέγονεν
  choice: amekuwa mbele yangu
  rationale: Kauli hii huhifadhi hali iliyotokana na tendo lililokamilika na pia mvutano kati ya kuwa mbele kwa cheo na kuwa mbele katika mfuatano, bila kulazimisha maana moja pekee.
- source_word: ὅτι
  choice: kwa sababu
  rationale: Neno hili linaonyesha sababu ya kauli iliyotangulia.
- source_word: πρῶτός μου ἦν
  choice: alikuwa kabla yangu
  rationale: Tafsiri hii ni fupi kama Kigiriki na huhifadhi wazo la kutangulia, huku ikiruhusu muktadha kuonyesha maana ya kuwako kabla bila kuipanua ndani ya matini.
theological_decisions:
- issue: Jinsi ya kutafsiri kishazi cha mwisho kuhusiana na kuwako kwa Kristo kabla ya Yohana
  choice: alikuwa kabla yangu
  alternative: alikuwapo kabla yangu
  rationale: Muktadha wa Yohana unaelekeza kwa nguvu kwenye kuwako kwa Yesu kabla ya Yohana, lakini Kigiriki kinasema kwa ufupi ‘alikuwa kabla yangu.’ Tafsiri iliyochaguliwa huhifadhi maana hiyo pamoja na mvutano wa kimaana badala ya kuifafanua kupita chanzo.
- issue: Maana ya ἔμπροσθέν μου γέγονεν
  choice: amekuwa mbele yangu
  alternative: amepata nafasi ya mbele kuliko mimi
  rationale: Kigiriki kinaweza kuonyesha kutangulia au kuwa na cheo cha juu. Kauli kuu imehifadhi upeo huo, na maana ya cheo imewekwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye hadhi na inayoeleweka kwa urahisi. Muundo wa ushuhuda wa Yohana na utata halisi wa vishazi viwili vya kulinganisha umehifadhiwa.
