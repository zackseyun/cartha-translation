  text: καὶ εἶπεν αὐτῷ Ναθαναήλ· Ἐκ Ναζαρὲτ δύναταί τι ἀγαθὸν εἶναι; λέγει αὐτῷ ⸀ὁ Φίλιππος· Ἔρχου καὶ ἴδε.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/046.yaml
  text: And Nathanael said to him[a], “Can anything good come from Nazareth?” Philip said to him, “Come and see.”
translation:
  language: sw
  text: Nathanaeli akamwambia[a], “Je, kitu chochote kizuri kinaweza kutoka Nazareti?” Filipo akamwambia, “Njoo uone.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa tafsiri ya karibu zaidi na maneno ya asili, “Je, kitu chochote kizuri kinaweza kuwa cha Nazareti?”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ εἶπεν αὐτῷ Ναθαναήλ
  choice: Nathanaeli akamwambia
  rationale: Kiunganishi καί pamoja na kitenzi cha kisimulizi kimetolewa kwa ‘aka-’, mtiririko wa kawaida wa simulizi la Kiswahili. ‘Akamwambia’ pia huwakilisha wazi αὐτῷ bila kutumia kiwakilishi kizito.
- source_word: Ἐκ Ναζαρὲτ
  choice: kutoka Nazareti
  rationale: ἐκ huonyesha chanzo au asili. ‘Kutoka Nazareti’ ni usemi wa kawaida wa Kiswahili unaohifadhi maana hiyo.
- source_word: δύναταί τι ἀγαθὸν εἶναι
  choice: kitu chochote kizuri kinaweza kutoka
  rationale: δύναται huonyesha uwezekano, na τι ἀγαθόν ni ‘kitu chochote kizuri.’ Ingawa εἶναι ni ‘kuwa,’ muundo wa Kiswahili wenye mahali pa asili unasomeka kwa kawaida kama ‘kutoka’; tanbihi huhifadhi tafsiri ya karibu zaidi na muundo wa Kigiriki.
- source_word: λέγει αὐτῷ ὁ Φίλιππος
  choice: Filipo akamwambia
  rationale: Wakati uliopo wa kihistoria wa Kigiriki umesawazishwa kuwa simulizi la wakati uliopita kwa kutumia ‘aka-’, jambo la kawaida na la asili katika Kiswahili.
- source_word: Ἔρχου καὶ ἴδε
  choice: Njoo uone
  rationale: Amri hizi mbili zinatoa mwaliko mfupi na wa moja kwa moja. Kiswahili hakihitaji kiunganishi ‘na’ kati yake; ‘Njoo uone’ huhifadhi maana na nguvu ya mwaliko.
theological_decisions:
- issue: Toni ya swali la Nathanaeli kuhusu Nazareti
  choice: Swali la balagha limetafsiriwa moja kwa moja bila kuongeza dhihaka au dharau.
  alternative: Je, kuna kitu chochote kizuri kinachoweza kuwa kutoka Nazareti?
  rationale: Maneno ya Kigiriki yanaonyesha shaka, lakini hayaweki wazi toni ya kejeli. Tafsiri inahifadhi shaka hiyo bila kuiongeza.
translation_notes:
  register: 'Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini kinachoeleweka kwa urahisi. Majina yametoholewa kwa mazoea ya kawaida ya Biblia ya Kiswahili: Nathanaeli, Nazareti, na Filipo.'
