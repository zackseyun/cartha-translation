  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: κἀγὼ οὐκ ᾔδειν αὐτόν, ἀλλ’ ὁ πέμψας με βαπτίζειν ἐν ὕδατι ἐκεῖνός μοι εἶπεν· Ἐφ’ ὃν ἂν ἴδῃς τὸ πνεῦμα καταβαῖνον καὶ μένον ἐπ’ αὐτόν, οὗτός ἐστιν ὁ βαπτίζων ἐν πνεύματι ἁγίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/033.yaml
  text: And I did not know him[a], but the one who sent me to baptize in water said to me, ‘The one on whom you see the Spirit descending and remaining on him[c][b], this is he who baptizes in the Holy Spirit.’
translation:
  language: sw
  text: Nami sikumjua[a], lakini yule aliyenituma kubatiza katika maji[b] aliniambia, “Yule utakayemwona Roho akishuka na kudumu juu yake[c], ndiye anayebatiza katika Roho Mtakatifu[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “sikumtambua.” Kigiriki kinaweza kumaanisha kutomjua mtu au kutomtambua katika muktadha huu.
    reason: lexical_alternative
  - marker: b
    text: Au “kubatiza kwa maji” ... “kubatiza kwa Roho Mtakatifu.” Kigiriki kinatumia kihusishi kilekile katika vifungu vyote viwili; matini kuu imehifadhi usambamba huo kwa kutumia “katika.”
    reason: lexical_alternative
  - marker: c
    text: Au “akikaa” au “akibaki.” Kitenzi hiki ni muhimu katika Injili ya Yohana na mara nyingi humaanisha kukaa, kubaki, au kudumu.
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ
  choice: Nami
  rationale: Muunganiko wa καί + ἐγώ unaendeleza maelezo na kumkazia msemaji; “Nami” ni Kiswahili cha kawaida na chenye uzito unaofaa.
- source_word: οὐκ ᾔδειν αὐτόν
  choice: sikumjua
  rationale: Kauli hii inaweza kumaanisha kutomjua au kutomtambua katika muktadha; “sikumjua” ndiyo tafsiri ya moja kwa moja, huku uwezekano wa “sikumtambua” ukihifadhiwa katika tanbihi.
- source_word: ὁ πέμψας με
  choice: yule aliyenituma
  rationale: Kifungu cha kisifa chenye kibainishi kimetafsiriwa kwa muundo wa kawaida wa Kiswahili unaomtaja mtu fulani bila kutumia lugha ya kizamani.
- source_word: βαπτίζειν ἐν ὕδατι
  choice: kubatiza katika maji
  rationale: “Katika” huhifadhi kwa kiwango kinachowezekana kihusishi ἐν na usambamba wake na “katika Roho Mtakatifu.”
- source_word: Ἐφ’ ὃν ἂν ἴδῃς
  choice: Yule utakayemwona
  rationale: Muundo huu unatambulisha ishara ambayo kwayo mtu huyo angejulikana; tafsiri hii ni ya kawaida na huhifadhi nguvu ya urejeshi wa kifungu.
- source_word: τὸ πνεῦμα
  choice: Roho
  rationale: Muktadha na kirai kinachofuata “Roho Mtakatifu” vinaonyesha kuwa anayerejelewa ni Roho wa Mungu.
- source_word: καταβαῖνον καὶ μένον ἐπ’ αὐτόν
  choice: akishuka na kukaa juu yake
  rationale: 'Huhifadhi vitendo viwili vinavyoendelea vya kuona: kushuka kwa Roho na kuendelea kwake juu ya Yesu. “Kukaa” ni lugha inayoeleweka na pia inaweza kubeba wazo la kudumu.'
- source_word: οὗτός ἐστιν ὁ βαπτίζων
  choice: ndiye anayebatiza
  rationale: “Ndiye” huhifadhi nguvu ya utambulisho wa οὗτός ἐστιν kwa Kiswahili cha asili.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: katika Roho Mtakatifu
  rationale: Tafsiri hii hudumisha usambamba wa ἐν na kirai cha awali “katika maji,” bila kuamua kimya kimya kama maana ya kihusishi ni chombo au mazingira.
theological_decisions:
- issue: Utambulisho wa πνεῦμα / πνεύματι ἁγίῳ
  choice: Roho ... Roho Mtakatifu
  alternative: roho ... roho takatifu
  rationale: Muktadha wa karibu unamtambulisha Roho anayeshuka kuwa Roho Mtakatifu; herufi kubwa zinaonyesha rejeleo hilo bila kuongeza dai jipya la kimafundisho.
- issue: Kihusishi katika vifungu vya ubatizo
  choice: kubatiza katika maji ... kubatiza katika Roho Mtakatifu
  alternative: kubatiza kwa maji ... kubatiza kwa Roho Mtakatifu
  rationale: “Katika” katika vifungu vyote viwili huhifadhi usambamba wa ἐν katika Kigiriki na huepuka kuamua kama maji na Roho ni chombo pekee cha tendo.
- issue: Maana ya οὐκ ᾔδειν katika uhusiano wa Yohana na Yesu
  choice: sikumjua
  alternative: sikumtambua
  rationale: Kigiriki kinaweza kueleza kutomjua au kutomtambua. Matini kuu inatumia maana ya moja kwa moja, na tanbihi inadumisha uwezekano mwingine bila kutatua mvutano wa kimuktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo “yule ... ndiye” hutoa utambulisho wazi na wa asili; usambamba wa “katika maji” na “katika Roho Mtakatifu” umehifadhiwa kwa makusudi.
