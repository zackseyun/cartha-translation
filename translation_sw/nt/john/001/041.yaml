  text: εὑρίσκει οὗτος ⸀πρῶτον τὸν ἀδελφὸν τὸν ἴδιον Σίμωνα καὶ λέγει αὐτῷ· Εὑρήκαμεν τὸν Μεσσίαν (ὅ ἐστιν μεθερμηνευόμενον χριστός).
base_translation:
  language: en
  yaml_path: translation/nt/john/001/041.yaml
  text: He first found his own brother Simon and said to him[a], “We have found the Messiah” (which means Messiah).
translation:
  language: sw
  text: Kwanza alimkuta Simoni, ndugu yake mwenyewe, akamwambia, “Tumempata Masihi” (yaani, Mtiwa mafuta[a]).
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au kwa tafsiri iliyozoeleka zaidi: “Tumempata Masihi” (ambayo, ikitafsiriwa, ni “Kristo”).'
    reason: Huhifadhi umbo la kimapokeo “Kristo” kwa χριστός na huonyesha wazi kwamba mabano ni ufafanuzi wa tafsiri.
lexical_decisions:
- source_word: εὑρίσκει
  choice: alimkuta
  rationale: Ingawa Kigiriki kinatumia wakati wa sasa wa kisimulizi, wakati uliopita ni wa kawaida na wa asili katika masimulizi ya Kiswahili. “Kumkuta” hapa linafaa kwa maana ya kumpata mtu aliyekuwa akitafutwa.
- source_word: οὗτος
  choice: —
  rationale: Kiwakilishi hiki kinamrejelea Andrea katika muktadha. Hakikutajwa kando kwa sababu kiima tayari kimeonyeshwa katika kitenzi cha Kiswahili “alimkuta,” hivyo sentensi hailemei.
- source_word: πρῶτον
  choice: Kwanza
  rationale: 'Linahifadhi maana ya mpangilio: tendo hili ndilo lililotangulia.'
- source_word: τὸν ἀδελφὸν τὸν ἴδιον
  choice: ndugu yake mwenyewe
  rationale: “Mwenyewe” linahifadhi msisitizo wa ἴδιον, na “ndugu” ni neno la kawaida la Kiswahili linaloweza kumrejelea ndugu wa kiume anayejulikana hapa kuwa Simoni.
- source_word: Σίμωνα
  choice: Simoni
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili cha Biblia.
- source_word: λέγει αὐτῷ
  choice: akamwambia
  rationale: Wakati uliopita wa kisimulizi ni wa asili katika Kiswahili; muundo wa “aka-” unaunganisha tendo hili na tendo lililotangulia bila kupoteza mfuatano.
- source_word: Εὑρήκαμεν
  choice: Tumempata
  rationale: Kauli hii inaonyesha ugunduzi uliotokea ambao matokeo yake yanaendelea kuwa muhimu wakati wa kusema; kauli timilifu ya Kiswahili inaleta maana hiyo kwa ufasaha.
- source_word: Μεσσίαν
  choice: Masihi
  rationale: Hili ndilo umbo la Kiswahili la jina la cheo la Kisemiti Μεσσίας na linahifadhi mazingira yake ya Kiyahudi.
- source_word: μεθερμηνευόμενον
  choice: yaani
  rationale: Katika mabano, “yaani” ni njia fupi na ya asili ya Kiswahili ya kuanzisha ufafanuzi wa maana, ingawa tafsiri halisi zaidi ni “likitafsiriwa.”
- source_word: χριστός
  choice: Mtiwa-Mafuta
  rationale: χριστός maana yake ni mtu aliyetiwa mafuta. Tafsiri hii inaonyesha wazi kwa msomaji wa Kiswahili kwa nini Yohana anaeleza neno “Masihi,” badala ya kubadili tu kutoka mkopo mmoja wa lugha kwenda mwingine.
theological_decisions:
- issue: Uwasilishaji wa Μεσσίας na χριστός kama vyeo vya Kimasihi
  choice: “Masihi” imetumiwa kwa Μεσσίας, na “Mtiwa-Mafuta” kwa ufafanuzi wa χριστός.
  alternative: “Masihi” ... “Kristo”
  rationale: Maandishi ya Kigiriki yanatofautisha neno la Kisemiti “Masihi” na neno lake la Kigiriki χριστός. “Mtiwa-Mafuta” huhifadhi maana ya ufafanuzi huo kwa Kiswahili, huku tanbihi ikihifadhi tafsiri ya jadi “Kristo” bila kuingiza msimamo wa dhehebu.
- issue: Wakati wa sasa wa kihistoria katika masimulizi
  choice: 'Umetafsiriwa kwa wakati uliopita: “alimkuta ... akamwambia.”'
  alternative: “anamkuta ... anamwambia”
  rationale: Hili ni badiliko la kisarufi kwa ufasaha wa simulizi la Kiswahili, si badiliko la mpangilio au ukweli wa matukio.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi ya usomaji wa Maandiko. Muundo ni wa asili kwa simulizi la Kiswahili, huku istilahi “Masihi” na ufafanuzi “Mtiwa-Mafuta” vikihifadhi uhusiano wa kimaanisho uliopo katika Kigiriki.
