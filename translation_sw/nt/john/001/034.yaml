  yaml_path: translation/nt/john/001/034.yaml
  text: And I have seen and have testified that this is the Chosen One of God[a].
translation:
  language: sw
  text: Nami nimeona na nimeshuhudia kwamba huyu ndiye Mteule wa Mungu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baadhi ya hati za kale zinasoma “Mwana wa Mungu” badala ya “Mteule wa Mungu.”
    reason: textual_variant
lexical_decisions:
- source_word: κἀγώ
  choice: Nami
  rationale: Muungano wa καί na ἐγώ unaendeleza kauli iliyotangulia na kusisitiza msemaji; “Nami” ni Kiswahili cha kawaida na chenye nguvu hiyo.
- source_word: ἑώρακα
  choice: nimeona
  rationale: Wakati timilifu unaonyesha tendo la kuona lililotimia na lenye athari inayoendelea; “nimeona” huhifadhi maana hiyo kwa kawaida.
- source_word: μεμαρτύρηκα
  choice: kutoa ushuhuda
  rationale: Pamoja na kisaidizi “nime-” kinachotawala vitenzi vilivyounganishwa, usemi huu huonyesha ushuhuda uliotolewa ambao uhalali wake unaendelea.
- source_word: ὅτι
  choice: kwamba
  rationale: Hapa ὅτι inaanzisha yaliyomo katika ushuhuda, si sababu.
- source_word: οὗτός
  choice: huyu
  rationale: Kiwakilishi hiki cha kuonyesha kinamwelekeza Yesu moja kwa moja na kwa ukaribu.
- source_word: ἐκλεκτός
  choice: Mteule
  rationale: Kivumishi hiki kimetumiwa kama nomino pamoja na kibainishi; “Mteule” ni jina la cheo lililo wazi na la kawaida.
- source_word: τοῦ θεοῦ
  choice: wa Mungu
  rationale: Muundo wa uhusiano wa Kigiriki unawakilishwa kwa kawaida na “wa Mungu,” bila kuufasiri zaidi kuwa “kutoka kwa Mungu.”
theological_decisions:
- issue: Cheo cha Kikristo katika Yohana 1:34
  choice: Mteule wa Mungu
  alternative: Mwana wa Mungu
  rationale: Matini ya SBLGNT iliyotolewa inasoma ὁ ἐκλεκτὸς τοῦ θεοῦ, hivyo tafsiri kuu inafuata “Mteule wa Mungu.” Tofauti muhimu ya hati za kale, “Mwana wa Mungu,” imehifadhiwa katika tanbihi badala ya kuingizwa katika matini kuu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “nimeona na kutoa ushuhuda” ni wa asili katika Kiswahili na unatumia kisaidizi cha hali timilifu kwa vitenzi viwili vilivyounganishwa; cheo “Mteule” kimeandikwa kwa herufi kubwa kwa kuwa kinamrejelea Yesu kama cheo.
