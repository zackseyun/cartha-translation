id: JHN.1.25
reference: John 1:25
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ ἠρώτησαν αὐτὸν καὶ εἶπαν αὐτῷ· Τί οὖν βαπτίζεις εἰ σὺ οὐκ εἶ ὁ χριστὸς ⸂οὐδὲ Ἠλίας οὐδὲ⸃ ὁ προφήτης;
base_translation:
  language: en
  yaml_path: translation/nt/john/001/025.yaml
  text: And they asked him and said to him[a], “Why then are you baptizing, if you are not the Messiah, nor Elijah[b], nor the Prophet?”
translation:
  language: sw
  text: Nao wakamwuliza, wakamwambia, “Kwa nini basi unabatiza ikiwa wewe si Masihi[a], wala Eliya, wala yule Nabii[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Kristo.” Neno la Kigiriki Χριστός (Christos) ni cheo kinachomaanisha “Masihi.”
    reason: alternative_reading
  - marker: b
    text: Huenda “yule Nabii” ni nabii aliyetazamiwa kuwa kama Musa (tazama Kumbukumbu la Torati 18:15).
    reason: cross_reference
lexical_decisions:
- source_word: ἠρώτησαν
  choice: wakamwuliza
  rationale: Kitenzi hiki ni aoristi tendaji na kinaendeleza simulizi; “wakamwuliza” ni Kiswahili cha kawaida kisichoongeza dhana ya uhasama.
- source_word: εἶπαν αὐτῷ
  choice: na kumwambia
  rationale: Inahifadhi kitenzi cha pili cha Kigiriki bila kurudia kiwakilishi kwa namna nzito katika Kiswahili.
- source_word: Τί οὖν
  choice: Kwa nini basi
  rationale: Katika muundo huu, τί pamoja na οὖν inauliza sababu au msingi wa tendo, hivyo “Kwa nini basi” ni ya asili na sahihi.
- source_word: βαπτίζεις
  choice: unabatiza
  rationale: Wakati uliopo unaonyesha tendo linaloendelea kufanywa na Yohana; Kiswahili hutumia umbo la wakati uliopo kwa maana hiyo.
- source_word: ὁ χριστός
  choice: Masihi
  rationale: Hapa Χριστός ni cheo cha yule aliyetazamiwa na Wayahudi, si jina binafsi; “Masihi” huhifadhi muktadha huo.
- source_word: Ἠλίας
  choice: Eliya
  rationale: Hili ndilo umbo la kawaida la jina hili katika Kiswahili cha Biblia.
- source_word: ὁ προφήτης
  choice: yule Nabii
  rationale: Kibainishi cha Kigiriki kinaonyesha mtu maalumu aliyetazamiwa; “yule Nabii” huwasilisha umaalumu huo kwa Kiswahili cha kawaida.
- source_word: οὐδὲ ... οὐδὲ
  choice: wala ... wala
  rationale: Muundo huu wa Kiswahili huunganisha kwa usahihi vipengele vinavyokanushwa baada ya “si”.
theological_decisions:
- issue: Jinsi ya kutafsiri Χριστός katika swali kuhusu utambulisho wa Yohana
  choice: Masihi
  alternative: Kristo
  rationale: Neno hilo limetumika kama cheo katika muktadha wa matarajio ya Kiyahudi. “Masihi” huhifadhi maana hiyo bila kulifanya jina binafsi.
- issue: Ikiwa ὁ προφήτης ni nabii yeyote au mtu maalumu aliyetazamiwa
  choice: yule Nabii
  alternative: nabii
  rationale: Kibainishi na muktadha vinaelekeza kwa mtu maalumu aliyetazamiwa. Tafsiri hii inaonyesha umaalumu huo bila kuamua zaidi ya maandishi kuhusu utambulisho wake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. Muundo “wakamwuliza na kumwambia” unahifadhi vitenzi viwili vya chanzo huku ukiepuka urudiaji mzito. Alama za tanbihi zimewekwa baada ya maneno yanayofafanuliwa.
