base_translation:
  language: en
  yaml_path: translation/nt/john/001/051.yaml
  text: And he said to him[a], “Truly, truly, I say to you[b], you will see heaven opened and the angels of God ascending and descending on the Son of Man.”
translation:
  language: sw
  text: Naye akamwambia, “Kweli, kweli, ninawaambia[a], mtaona mbingu zikiwa zimefunguliwa, na malaika wa Mungu wakipanda na kushuka juu ya Mwana wa Adamu.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ingawa Yesu anasemeshwa kwanza na mtu mmoja (“akamwambia”), “ninawaambia” na “mtaona” ni wingi katika Kigiriki; hivyo kauli inapanuka zaidi ya mtu huyo mmoja.
    reason: lexical_alternative
  - marker: b
    text: Picha hii ina mwangwi wa ndoto ya Yakobo katika Mwanzo 28:12, lakini hapa imeelekezwa kwa Mwana wa Adamu.
    reason: cross_reference
lexical_decisions:
- source_word: Ἀμὴν ἀμὴν
  choice: Kweli, kweli
  rationale: Inahifadhi urudiaji wenye msisitizo na uzito wa kauli ya Yesu kwa Kiswahili cha kawaida na chenye heshima.
- source_word: ὑμῖν
  choice: ninawaambia
  rationale: Kiambishi -wa- kinaonyesha wazi kwamba Yesu sasa anawaambia watu wengi, ingawa simulizi lilianza kwa kumwelekea Nathanaeli mmoja.
- source_word: ὄψεσθε
  choice: mtaona
  rationale: Ni wakati ujao na wingi, sawasawa na umbo la Kigiriki.
- source_word: τὸν οὐρανὸν ἀνεῳγότα
  choice: mbingu ikiwa imefunguliwa
  rationale: Inaonyesha hali ya mbingu baada ya kufunguliwa, bila kuongeza wazo lisilokuwamo katika Kigiriki.
- source_word: ἀγγέλους
  choice: malaika
  rationale: Katika ono hili la kimungu na mwangwi wa Mwanzo 28, neno linamaanisha viumbe wa mbinguni, si wajumbe wa kibinadamu.
- source_word: ἀναβαίνοντας καὶ καταβαίνοντας
  choice: wakipanda na kushuka
  rationale: Jozi hii ya mwelekeo ni ya asili katika Kiswahili na inahifadhi mwangwi wa Mwanzo 28:12.
- source_word: ἐπὶ
  choice: juu ya
  rationale: Inahifadhi uhusiano wa kimahali wa malaika kwa Mwana wa Adamu bila kuufafanua zaidi kiteolojia.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Mwana wa Adamu
  rationale: Hili ni jina la kujitambulisha la Yesu lenye mwangwi mpana wa Maandiko; tafsiri hii iliyozoeleka inalinda uzito huo.
theological_decisions:
- issue: Kauli inaanza kwa kumwelekea mtu mmoja (αὐτῷ), lakini viwakilishi katika maneno ya Yesu ni vya wingi (ὑμῖν, ὄψεσθε).
  choice: Kiswahili kinaonyesha wingi wazi kwa “ninawaambia” na “mtaona,” huku tanbihi ikieleza badiliko hilo.
  alternative: Kutumia umoja kana kwamba maneno yote yanaelekezwa kwa Nathanaeli peke yake.
  rationale: Maumbo ya Kigiriki ni ya wingi na yanaweza kupanua hadhira zaidi ya Nathanaeli bila kufuta kwamba Yesu alikuwa akimjibu yeye.
- issue: Picha ya malaika kupanda na kushuka ina mwangwi wa ndoto ya Yakobo katika Mwanzo 28:12.
  choice: Picha yenyewe imehifadhiwa katika matini, na mwangwi wa Mwanzo umeelezwa katika tanbihi.
  alternative: Kupanua matini ili kusema wazi kwamba Yesu ndiye ngazi au mahali pa ufunuo wa Mungu.
  rationale: Kigiriki kinaweka Mwana wa Adamu katikati ya picha hiyo lakini hakitoi ufafanuzi huo moja kwa moja; hivyo mvutano wa kiteolojia haupaswi kutatuliwa kwa nyongeza ya kitafsiri.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. “Kweli, kweli” ni wazi kwa msomaji wa kawaida; “Mwana wa Adamu” huhifadhi istilahi ya kimaandiko. Wingi umeonyeshwa moja kwa moja katika vitenzi vya Kiswahili.
