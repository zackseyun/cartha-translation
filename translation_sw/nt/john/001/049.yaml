  text: ἀπεκρίθη ⸂αὐτῷ Ναθαναήλ⸃· Ῥαββί, σὺ εἶ ὁ υἱὸς τοῦ θεοῦ, σὺ ⸂βασιλεὺς εἶ⸃ τοῦ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/049.yaml
  text: Nathanael answered him, “Rabbi, you are the Son of God; you are the King of Israel.”
translation:
  language: sw
  text: Nathanaeli akamjibu, “Rabi, wewe ni Mwana wa Mungu; wewe ni Mfalme wa Israeli.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: akamjibu
  rationale: Ni tafsiri ya kawaida na ya asili katika masimulizi ya mazungumzo; kiambishi -m- kinamrejelea Yesu, anayejibiwa.
- source_word: Ῥαββί
  choice: Rabi
  rationale: Inahifadhi cheo maalumu cha Kiyahudi na mazingira ya kihistoria; ni neno linaloeleweka katika Kiswahili cha Biblia.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: Mwana wa Mungu
  rationale: Inahifadhi cheo dhahiri chenye uzito wa Kikristo bila kukipanua au kukidhoofisha.
- source_word: βασιλεὺς
  choice: Mfalme
  rationale: Ni kisawe cha moja kwa moja cha cheo cha kifalme; katika muktadha huu nomino-arifu isiyo na kibainishi ina maana dhahiri.
- source_word: τοῦ Ἰσραήλ
  choice: wa Israeli
  rationale: Inafuata muundo wa kimilikishi wa Kigiriki na kuhifadhi namna rasmi ya cheo hicho.
- source_word: σὺ εἶ … σὺ … εἶ
  choice: wewe ni … wewe ni
  rationale: Kurudia kiwakilishi na kitenzi kunahifadhi msisitizo na ulinganifu wa ungamo la Kigiriki.
- source_word: Ναθαναήλ
  choice: Nathanaeli
  rationale: Ni umbo la jina lililozoeleka katika Kiswahili sanifu cha Biblia na linaingizwa kwa urahisi katika sarufi ya Kiswahili.
theological_decisions:
- issue: Uzito wa Kikristo wa ungamo “Mwana wa Mungu”
  choice: 'Kuhifadhi cheo kama kilivyo: “Mwana wa Mungu.”'
  alternative: “mwana mmoja wa Mungu” au ufafanuzi mpana wa baadaye wa kimafundisho
  rationale: Kigiriki kina cheo dhahiri chenye uzito wa Kimasihi na Kikristo katika Injili ya Yohana; tafsiri haikipunguzi wala kuingiza maelezo yasiyosemwa katika mstari.
- issue: Maana ya kifalme na ya Kimasihi ya “Mfalme wa Israeli”
  choice: Kutafsiri kwa cheo rasmi “Mfalme wa Israeli.”
  alternative: “mfalme anayetawala Israeli” au “mfalme wa Waisraeli”
  rationale: Muundo huu huhifadhi cheo cha kifalme kinachohusishwa na tumaini la Masihi bila kukifafanua kupita maandishi ya chanzo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni ya asili katika masimulizi ya Biblia, huku marudio ya “wewe ni” yakihifadhi msisitizo wa chanzo.
