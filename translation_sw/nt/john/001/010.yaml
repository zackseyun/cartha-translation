base_translation:
  language: en
  yaml_path: translation/nt/john/001/010.yaml
  text: He was in the world[a], and the world came into being through him[b], and the world did not know him.
translation:
  language: sw
  text: Alikuwa ulimwenguni, na ulimwengu ulikuja kuwapo kwa njia yake[a], na ulimwengu haukumjua[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “uliumbwa kwa njia yake.” Kitenzi cha Kigiriki humaanisha “ulikuja kuwapo” au “ulianza kuwapo.”
    reason: lexical_alternative
  - marker: b
    text: “Haukumjua” pia linaweza kumaanisha “haukumtambua” au “haukumkubali.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κόσμῳ / κόσμος
  choice: ulimwenguni / ulimwengu
  rationale: Neno κόσμος limetafsiriwa kwa uthabiti kuwa “ulimwengu” katika sehemu zote tatu. Hivyo maana zake zinazoweza kuhusisha uumbaji, ulimwengu unaokaliwa, au wanadamu hazifungwi kwa tafsiri moja tu.
- source_word: ἦν
  choice: Alikuwa
  rationale: Wakati usiotimilika wa εἰμί unaonyesha kuwapo kwake kulikokuwa kunaendelea. “Alikuwa” ni Kiswahili cha kawaida na kinahifadhi tofauti na ἐγένετο katika kishazi kinachofuata.
- source_word: δι’ αὐτοῦ
  choice: kwa njia yake
  rationale: διά pamoja na hali ya umilikishi huonyesha njia au wakala. “Kwa njia yake” ni ya asili katika Kiswahili na inaendeleza wazo la Yohana 1:3 bila kumfanya mhusika kuwa chombo kisicho cha kibinafsi.
- source_word: ἐγένετο
  choice: ulipata kuwapo
  rationale: γίνομαι hapa humaanisha kuja kuwapo. “Ulipata kuwapo” huhifadhi lugha ya asili ya kuanza kuwapo na kuitofautisha na ἦν, “alikuwa,” badala ya kuifanya moja kwa moja kuwa kitenzi “kuumba.”
- source_word: ἔγνω
  choice: haukumjua
  rationale: γινώσκω kimsingi ni “kujua.” Katika muktadha inaweza pia kumaanisha kutambua au kukubali, lakini “haukumjua” huhifadhi upana na kina cha usemi wa Yohana.
- source_word: αὐτόν / αὐτοῦ
  choice: -m- / yake
  rationale: Viwakilishi vinamrejelea Neno katika muktadha uliotangulia. Miundo “haukumjua” na “kwa njia yake” inadumisha rejeo la kibinafsi.
theological_decisions:
- issue: Mhusika wa kitenzi ambaye hajatajwa wazi
  choice: Kutumia “Alikuwa,” kwa kumrejelea Neno kama nafsi katika muktadha wa karibu.
  alternative: Kutumia muundo usio wa kibinafsi kwa sababu nomino ya mhusika haijarudiwa katika mstari huu.
  rationale: Muktadha wa Yohana 1:1–9 tayari unamtambulisha Neno kwa namna ya kibinafsi. Tafsiri hii haiongezi jina au cheo kisichokuwapo katika mstari.
- issue: Lugha ya kuja kuwapo kwa ulimwengu ikilinganishwa na kuwapo kwa Neno
  choice: “Ulimwengu ulipata kuwapo kwa njia yake.”
  alternative: “Ulimwengu uliumbwa kwa njia yake.”
  rationale: Chaguo hili linahifadhi tofauti ya maandishi kati ya ἦν, inayosema Neno “alikuwa,” na ἐγένετο, inayosema ulimwengu ulianza kuwapo, bila kuongeza istilahi ya kiteolojia.
- issue: Maana pana ya kutomjua
  choice: “Ulimwengu haukumjua.”
  alternative: “Ulimwengu haukumtambua” au “haukumkubali.”
  rationale: “Kumjua” huhifadhi utata wa kimakusudi unaoweza kujumuisha kutotambua na kutokubali, bila kuamua kimya kimya maana moja pekee.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Kurudiwa kwa “ulimwengu” na kiunganishi “na” kumehifadhiwa kwa sababu ni sehemu ya mpangilio na msisitizo wa Kigiriki. Alama za tanbihi zimewekwa baada ya vifungu vinavyohusika moja kwa moja.
