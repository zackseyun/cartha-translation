base_translation:
  language: en
  yaml_path: translation/nt/john/001/015.yaml
  text: John testifies about him and has cried out[a], saying, “This was he of whom I said, ‘The one coming after me has become before me[b], because he was before me.’”
translation:
  language: sw
  text: 'Yohana anatoa ushahidi kumhusu, naye amepaza sauti akisema, “Huyu ndiye niliyesema juu yake: ‘Yule anayekuja baada yangu amekuwa mbele yangu[a], kwa sababu alikuwa kabla yangu[b].’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “amenitangulia kwa cheo” au “amenizidi.” Maneno ya Kigiriki yanaweza kuonyesha nafasi ya mbele au ukuu wa cheo, pamoja na mfuatano wa wakati.
    reason: lexical_alternative
  - marker: b
    text: Au, “alikuwako kabla yangu.” Usemi “alikuwa kabla yangu” unafuata Kigiriki kwa karibu zaidi, huku ukiendelea kuruhusu maana ya kuwako kwake kabla ya Yohana katika muktadha.
    reason: alternative_reading
lexical_decisions:
- source_word: μαρτυρεῖ
  choice: anamshuhudia
  rationale: Wakati wa sasa unaonyesha ushuhuda unaoendelea au unaowasilishwa kwa uhai; kitenzi hiki kinahifadhi maana ya kutoa ushahidi kuhusu mtu.
- source_word: περὶ αὐτοῦ
  choice: juu yake
  rationale: Ni usemi wa kawaida wa Kiswahili unaoonyesha kwamba Yohana alisema habari zinazomhusu huyo mtu.
- source_word: κέκραγεν
  choice: amepaza sauti
  rationale: Hali timilifu ya Kiswahili inawakilisha kwa kawaida tendo lililotokea ambalo uzito wake unaendelea, huku ‘kupaza sauti’ ikionyesha tangazo la wazi na lenye nguvu.
- source_word: λέγων
  choice: akisema
  rationale: Muundo wa ‘aki-’ unaunganisha tendo hili kwa kawaida na kupaza sauti bila kuifanya sentensi kuwa nzito.
- source_word: Οὗτος ἦν ὃν εἶπον
  choice: Huyu ndiye niliyesema juu yake
  rationale: Huu ni muundo wa asili wa Kiswahili unaotambulisha mtu ambaye Yohana alikuwa amemtaja, huku wakati uliopita ukibaki katika ‘niliyesema.’
- source_word: Ὁ ὀπίσω μου ἐρχόμενος
  choice: Yule anayekuja baada yangu
  rationale: Unahifadhi hali ya kuja na maana ya mfuatano wa wakati au huduma iliyomo katika ‘baada yangu.’
- source_word: ἔμπροσθέν μου γέγονεν
  choice: amekuwa mbele yangu
  rationale: Unahifadhi hali timilifu ya γέγονεν na lugha ya ‘mbele yangu’ bila kuamua kimya-kimya kama wazo kuu ni cheo, ukuu, au kutangulia.
- source_word: ὅτι
  choice: kwa sababu
  rationale: Unaonyesha wazi kwamba kifungu kinachofuata kinatoa sababu ya dai lililotangulia.
- source_word: πρῶτός μου ἦν
  choice: alikuwa kabla yangu
  rationale: Unahifadhi dai la kutangulia bila kuongeza moja kwa moja kitenzi ‘kuwako,’ hivyo muktadha wenyewe unabeba maana ya uwepo wa awali.
theological_decisions:
- issue: Jinsi ya kutafsiri πρῶτός μου ἦν kuhusiana na kuwako kwa Kristo kabla ya Yohana
  choice: alikuwa kabla yangu
  alternative: alikuwako kabla yangu
  rationale: Kifungu kinadokeza kwa nguvu kuwako kwa Kristo kabla ya Yohana, lakini tafsiri kuu haiongezi ufafanuzi ambao haujatamkwa wazi katika Kigiriki. Tanbihi inatoa usomaji ulio wazi zaidi bila kuondoa mvutano wa maneno ya asili.
- issue: Maana ya ἔμπροσθέν μου γέγονεν
  choice: amekuwa mbele yangu
  alternative: amenitangulia kwa cheo / amenizidi
  rationale: Maneno ya Kigiriki yanaweza kuonyesha kutangulia au ukuu wa cheo. Tafsiri kuu inahifadhi taswira yake, na tanbihi inaonyesha maana mbadala zinazowezekana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Amekuwa mbele yangu’ limehifadhiwa licha ya kuwa si usemi wa kawaida kabisa, kwa sababu linatunza kwa makusudi utata wa chanzo; tanbihi husaidia msomaji bila kulazimisha tafsiri moja.
