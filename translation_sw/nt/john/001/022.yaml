  yaml_path: translation/nt/john/001/022.yaml
  text: So they said to him, “Who are you, so that we may give an answer to those who sent us? What do you say about yourself?”
translation:
  language: sw
  text: Basi wakamwambia, “Wewe ni nani, ili tuweze kuwapa wale waliotutuma jibu? Unasema nini kuhusu wewe mwenyewe?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: Basi
  rationale: Inaonyesha mwendelezo wenye hitimisho kutoka katika mazungumzo yaliyotangulia; “Basi” ni ya kawaida na yenye hadhi katika Kiswahili.
- source_word: εἶπαν ... αὐτῷ
  choice: wakamwambia
  rationale: Huwasilisha usemi wa moja kwa moja kwa njia ya asili ya Kiswahili, huku kiambishi cha mtendewa kikihifadhi maana ya “kwake.”
- source_word: Τίς εἶ;
  choice: Wewe ni nani?
  rationale: Ni swali la moja kwa moja kuhusu utambulisho; kutaja “wewe” kunaleta msisitizo wa kawaida wa Kiswahili bila kuongeza maudhui mapya.
- source_word: ἵνα ἀπόκρισιν δῶμεν
  choice: Tuambie ili tuweze kuwajibu
  rationale: “Ili” huhifadhi kusudi la ἵνα, na “kuwajibu” huwasilisha kwa Kiswahili cha kawaida wazo la kuwapa waliowatuma jibu. “Tuambie” limeeleweka kutokana na ombi la jibu katika muktadha.
- source_word: τοῖς πέμψασιν ἡμᾶς
  choice: wale waliotutuma
  rationale: Huhifadhi kishazi cha kisifa cha kiambishi chenye maana ya watu waliowatuma wajumbe.
- source_word: τί λέγεις περὶ σεαυτοῦ;
  choice: Unasema nini kuhusu wewe mwenyewe?
  rationale: Huhifadhi swali la ushuhuda wake binafsi na maana ya reflexive ya σεαυτοῦ bila kulifasiri zaidi.
