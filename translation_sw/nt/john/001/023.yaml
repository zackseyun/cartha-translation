id: JHN.1.23
reference: John 1:23
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἔφη· Ἐγὼ φωνὴ βοῶντος ἐν τῇ ἐρήμῳ· Εὐθύνατε τὴν ὁδὸν κυρίου, καθὼς εἶπεν Ἠσαΐας ὁ προφήτης.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/023.yaml
  text: He said[a], “I am a voice of one crying out in the wilderness, ‘Make straight the way of the Lord,’ just as Isaiah the prophet said.”
translation:
  language: sw
  text: Akasema[a], “Mimi ni sauti ya mtu anayepaza sauti nyikani, ‘Nyoosheni njia ya Bwana,’ kama alivyosema nabii Isaya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, ingawa uwezekano wake ni mdogo: “Mimi ni sauti nyikani ya mtu anayepaza sauti.” Kirai cha Kigiriki kinaweza kuunganishwa kwa njia hii tofauti, lakini tafsiri katika matini ndiyo inayotiririka kwa kawaida zaidi hapa.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔφη
  choice: Akasema
  rationale: Ni utangulizi wa kawaida wa maneno ya mhusika katika simulizi na unafaa kwa mazungumzo haya.
- source_word: Ἐγὼ
  choice: Mimi
  rationale: Kiwakilishi kilichotajwa wazi katika Kigiriki kina mkazo; “Mimi” kinauhifadhi kwa Kiswahili cha kawaida.
- source_word: φωνὴ
  choice: sauti
  rationale: Kinahifadhi sitiari ya Yohana kujitambulisha kuwa sauti bila kuongeza ufafanuzi usiomo katika chanzo.
- source_word: βοῶντος
  choice: ya mtu anayepaza sauti
  rationale: Muundo huu unaonyesha kuwa sauti ni ya mtu anayetoa mwito kwa nguvu, huku ukihifadhi uhusiano wa kisarufi na φωνή.
- source_word: ἐν τῇ ἐρήμῳ
  choice: nyikani
  rationale: “Nyikani” ni neno la kawaida na lenye hadhi kwa eneo lisilokaliwa, na linafaa katika muktadha wa Yohana na dondoo la Isaya.
- source_word: Εὐθύνατε
  choice: Nyoosheni
  rationale: Amri ya wingi inaelekeza hatua ya kufanya njia iwe nyoofu, kwa lugha fupi na ya asili.
- source_word: τὴν ὁδὸν
  choice: njia
  rationale: “Njia” huhifadhi taswira halisi pamoja na maana yake pana ya kisitiari.
- source_word: κυρίου
  choice: Bwana
  rationale: “Bwana” ni tafsiri ya kawaida ya κύριος na huhifadhi uzito wa dondoo la kinabii bila kuupunguza kuwa cheo cha kawaida tu.
- source_word: καθὼς
  choice: kama
  rationale: Inaonyesha ulinganifu wa moja kwa moja kati ya kujitambulisha kwa Yohana na kauli ya Isaya.
- source_word: εἶπεν
  choice: alivyosema
  rationale: Muundo huu ni wa asili baada ya “kama” na unawakilisha tendo la kusema katika wakati uliopita.
- source_word: Ἠσαΐας ὁ προφήτης
  choice: nabii Isaya
  rationale: Huu ndio mpangilio wa kawaida na wa asili katika Kiswahili, huku ukihifadhi cheo cha Isaya.
theological_decisions:
- issue: Tafsiri ya κύριος katika dondoo la Isaya
  choice: Bwana
  alternative: bwana mkubwa / mwenye mamlaka
  rationale: “Bwana” huhifadhi uzito wa jina au cheo katika dondoo la Isaya na pia mvutano wake wa kitheolojia katika muktadha wa Yohana, bila kulazimisha ufafanuzi zaidi ya maandishi.
- issue: Uhusiano wa “nyikani” na kirai kinachotangulia
  choice: mtu anayepaza sauti nyikani
  alternative: sauti nyikani ya mtu anayepaza sauti
  rationale: Usomaji mkuu unaunganisha mahali pa nyikani na tendo la kupaza sauti, ambalo ndilo jambo linalotiririka kwa kawaida zaidi katika muktadha. Tanbihi inahifadhi uwezekano mwingine wa kisarufi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye hadhi na inayoeleweka kwa urahisi. “Anayepaza sauti” huepuka hisia hasi zinazoweza kuletwa na “anayepiga kelele,” huku ikihifadhi nguvu ya mwito wa kinabii.
