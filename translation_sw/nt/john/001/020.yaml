  text: καὶ ὡμολόγησεν καὶ οὐκ ἠρνήσατο, καὶ ὡμολόγησεν ὅτι ⸂Ἐγὼ οὐκ εἰμὶ⸃ ὁ χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/020.yaml
  text: And he confessed and did not deny[a], but confessed, “I am not the Messiah.”
translation:
  language: sw
  text: Naye alikiri, wala hakukana, bali alikiri, “Mimi si Masihi[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kristo.” Neno la Kigiriki χριστός (Christos) ni cheo chenye maana ya “Mtiwa-Mafuta.” Hapa limetafsiriwa “Masihi.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὡμολόγησεν
  choice: alikiri
  rationale: Kitenzi hiki hapa kinaonyesha kukiri au kutangaza wazi mbele ya wengine. “Alikiri” ni neno la kawaida na lenye uzito unaofaa, na limerudiwa ili kuhifadhi msisitizo wa Kigiriki.
- source_word: οὐκ ἠρνήσατο
  choice: wala hakukana
  rationale: “Hakukana” hutoa maana ya moja kwa moja ya ἀρνέομαι, huku “wala” ikiunganisha kauli hii na kukiri kulikotangulia kwa msisitizo wa kawaida katika Kiswahili.
- source_word: καὶ ... καὶ ... καὶ
  choice: Naye ... wala ... bali ...
  rationale: Muundo huu unawasilisha mfululizo wa msisitizo wa viunganishi vya Kigiriki kwa Kiswahili cha asili; “bali” linaonyesha kwamba kauli ya mwisho inarudia na kufafanua kukiri kwake.
- source_word: Ἐγὼ οὐκ εἰμὶ
  choice: Mimi si
  rationale: Kiwakilishi cha wazi “Mimi” kinahifadhi msisitizo wa Ἐγώ bila kuongeza maana isiyokuwamo katika chanzo.
- source_word: ὁ χριστός
  choice: Masihi
  rationale: Χριστός hapa ni cheo cha yule mtiwa-mafuta aliyetarajiwa, si jina la kawaida; “Masihi” huwasilisha muktadha huo wa Kiyahudi kwa uwazi.
theological_decisions:
- issue: Tafsiri ya Χριστός kama cheo
  choice: Masihi
  alternative: Kristo
  rationale: Katika muktadha huu Yohana anakana kuwa yeye ndiye mtiwa-mafuta aliyetarajiwa. “Masihi” huhifadhi matumizi ya neno hili kama cheo, huku “Kristo” likiwekwa katika tanbihi kama tafsiri mbadala iliyozoeleka.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Marudio ya “alikiri” yamehifadhiwa kwa sababu ni sehemu ya msisitizo wa chanzo; “Mimi” pia limehifadhiwa ili kuonyesha mkazo wa kiwakilishi cha Kigiriki.
