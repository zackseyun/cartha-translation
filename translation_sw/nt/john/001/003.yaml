id: JHN.1.3
reference: John 1:3
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: πάντα δι’ αὐτοῦ ἐγένετο, καὶ χωρὶς αὐτοῦ ἐγένετο οὐδὲ ἕν. ὃ γέγονεν
base_translation:
  language: en
  yaml_path: translation/nt/john/001/003.yaml
  text: All things came into being through him[a], and apart from him not even one thing came into being that has come into being.
translation:
  language: sw
  text: Vitu vyote vilikuja kuwapo kupitia yeye, na pasipo yeye hakukuja kuwapo hata kitu kimoja ambacho kimekuja kuwapo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, mstari wa 4 unaweza kuanza hivi: “Kilichokuja kuwapo ndani yake kilikuwa uzima.”'
    reason: alternative_reading
lexical_decisions:
- source_word: πάντα
  choice: Vitu vyote
  rationale: Nomino hii ya wingi ya jinsia isiyo na uhai ina maana pana inayojumuisha kila kilichoumbwa; “vitu vyote” huhifadhi wingi na upeo wake.
- source_word: δι’ αὐτοῦ
  choice: kupitia yeye
  rationale: διά pamoja na umilikishi huonyesha njia au wakala; “kupitia yeye” huhifadhi dhana kwamba yeye ndiye njia ambayo vitu vyote vilipata kuwapo, bila kuifupisha kuwa tu “na yeye.”
- source_word: ἐγένετο
  choice: vilikuja kuwapo / hakukuja kuwapo
  rationale: Kitenzi γίνομαι hapa hueleza kuingia katika hali ya kuwapo. “Kuja kuwapo” ni Kiswahili cha kawaida kinachohifadhi maana hiyo kuliko “kutengenezwa.”
- source_word: χωρὶς αὐτοῦ
  choice: pasipo yeye
  rationale: χωρίς huonyesha kutengwa au kutokuwapo kwa mhusika; “pasipo yeye” ni ya heshima na ya kiwango cha juu kidogo, inayofaa utangulizi huu.
- source_word: οὐδὲ ἕν
  choice: hata kitu kimoja
  rationale: Kauli hii ni ya mkazo. “Hata kitu kimoja” hudumisha ukanushi kamili na msisitizo wa οὐδέ pamoja na ἕν.
- source_word: ὃ γέγονεν
  choice: ambacho kimekuja kuwapo
  rationale: Kwa kukiunganisha kifungu hiki na mstari wa 3, “ambacho” hukirejesha kwa “kitu kimoja.” Wakati timilifu wa γέγονεν unaakisiwa kwa “kimekuja kuwapo.”
theological_decisions:
- issue: Uhusiano wa kifungu cha mwisho ὃ γέγονεν
  choice: 'Kukiunganisha na mstari wa 3: “hata kitu kimoja ambacho kimekuja kuwapo.”'
  alternative: 'Kukifanya mwanzo wa mstari wa 4: “Kilichokuja kuwapo ndani yake kilikuwa uzima.”'
  rationale: Hati za kale za Kigiriki hazikuwa na uakifishaji wa awali unaoamua jambo hili, kwa hiyo miundo yote miwili inawezekana. Matini kuu inafuata uakifishaji wa SBLGNT na kusisitiza kwamba kila kilichopata kuwapo kilipata kuwapo kupitia Neno; usomaji mwingine halali umehifadhiwa katika tanbihi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Kuja kuwapo” limetumiwa kwa uthabiti kuonyesha kuingia katika hali ya kuwapo; “pasipo” hudumisha uzito wa mtindo wa utangulizi bila kuwa lugha ya kizamani. Alama ya tanbihi imewekwa baada ya kifungu ambacho kina usomaji mbadala.
