base_translation:
  language: en
  yaml_path: translation/nt/john/001/044.yaml
  text: Philip was from Bethsaida[a], from the town of Andrew and Peter.
translation:
  language: sw
  text: Filipo alitoka Bethsaida[a], mji ambao Andrea na Petro walitoka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Bethsaida, mji wa Andrea na Petro,” yaani, mji wao wa asili.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν
  choice: alikuwa anatoka
  rationale: Imperfekti ya εἰμί pamoja na ἀπό inaeleza asili ya Filipo. Kiswahili cha kawaida hueleza jambo hilo kwa ‘alikuwa anatoka’ badala ya tafsiri ngumu ya neno kwa neno.
- source_word: δὲ
  choice: imeachwa bila kutafsiriwa moja kwa moja
  rationale: δέ ni kiunganishi hafifu cha simulizi; hapa mtiririko wa Kiswahili ni wa kawaida bila ‘basi’ au ‘lakini’, ambazo zingeongeza uzito usiokuwapo katika chanzo.
- source_word: Φίλιππος
  choice: Filipo
  rationale: Jina limetolewa kwa umbo lililozoeleka katika Kiswahili sanifu cha Biblia.
- source_word: ἀπὸ Βηθσαϊδά
  choice: anatoka Bethsaida
  rationale: ἀπό huonyesha chanzo au asili; ‘anatoka Bethsaida’ ni usemi wa kawaida na sahihi wa Kiswahili.
- source_word: ἐκ τῆς πόλεως
  choice: mji
  rationale: πόλις linaweza kumaanisha mji bila kulazimisha tofauti ya kisasa kati ya ‘town’ na ‘city’. Muundo wa Kiswahili unaunganisha kirai hiki moja kwa moja na Bethsaida.
- source_word: Ἀνδρέου καὶ Πέτρου
  choice: walikotoka Andrea na Petro
  rationale: Genitivi hizi zinaonyesha uhusiano wa mji na asili ya Andrea na Petro. Usemi huu huwasilisha maana hiyo kwa uwazi bila kudai kwamba mji ulikuwa mali yao.
