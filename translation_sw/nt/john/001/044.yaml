translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Tafsiri inatanguliza uwazi wa maana huku ikihifadhi urudiaji wa wazo la asili katika sentensi ya Kigiriki. Alama ya tanbihi imewekwa baada ya ‘Bethsaida’ kama ilivyo katika safu ya mashauriano.
