  text: οὗτος ἦλθεν εἰς μαρτυρίαν, ἵνα μαρτυρήσῃ περὶ τοῦ φωτός, ἵνα πάντες πιστεύσωσιν δι’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/007.yaml
  text: He came as a witness[a], so that he might testify about the Light[b], so that all might believe through him.
translation:
  language: sw
  text: Huyu alikuja kama shahidi[a] ili ashuhudie kuhusu Nuru, ili watu wote waamini kupitia kwake.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa ajili ya ushuhuda.”
    reason: lexical_alternative
  - marker: b
    text: Yaani, kupitia ushuhuda wa Yohana; baadhi huchukulia “kwake” kuwa inamrejelea Nuru badala yake.
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτος
  choice: Huyo
  rationale: Kiwakilishi hiki cha kuonyesha kinamrejelea kwa mkazo Yohana aliyetajwa katika mstari uliotangulia; “Huyo” ni cha asili katika Kiswahili na huhifadhi nguvu ya kurejelea.
- source_word: ἦλθεν
  choice: alikuja
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya kitenzi ἔρχομαι katika wakati uliopita wa simulizi.
- source_word: εἰς μαρτυρίαν
  choice: kama shahidi
  rationale: Katika muktadha huu kirai kinaonyesha jukumu au kusudi la kuja kwa Yohana. “Kama shahidi” ni Kiswahili cha kawaida na huhifadhi maana ya kutoa ushahidi.
- source_word: ἵνα μαρτυρήσῃ
  choice: ili ashuhudie
  rationale: “Ili” huonyesha kusudi la ἵνα, na “ashuhudie” huhifadhi uhusiano wa kimsamiati na ushahidi bila kufanya sentensi kuwa nzito.
- source_word: περὶ τοῦ φωτός
  choice: kuhusu Nuru
  rationale: περί pamoja na hali ya umilikaji humaanisha “kuhusu.” “Nuru” imeandikwa kwa herufi kubwa kwa sababu hapa inamrejelea kwa namna ya cheo yule Nuru wa kweli, si mwanga wa kawaida.
- source_word: ἵνα πάντες πιστεύσωσιν
  choice: ili watu wote waamini
  rationale: Kirai cha pili cha kusudi kimehifadhiwa kwa “ili.” “Watu wote” huwasilisha πάντες kwa uwazi na “waamini” ni tafsiri ya kawaida ya πιστεύω hapa.
- source_word: δι’ αὐτοῦ
  choice: kupitia kwake
  rationale: διά pamoja na hali ya umilikaji huonyesha njia au wakala. “Kupitia kwake” ni cha asili na huhifadhi uwezekano wa kisarufi wa kiwakilishi bila kuongeza maneno yasiyokuwamo katika chanzo.
theological_decisions:
- issue: Kirejelewa cha αὐτοῦ katika δι’ αὐτοῦ
  choice: Katika mtiririko wa sentensi, “kwake” inaelekea kumrejelea Yohana shahidi.
  alternative: Baadhi huona “kwake” kuwa inamrejelea Nuru.
  rationale: Yohana ndiye mhusika mkuu wa sentensi na ndiye kirejelewa kinachofaa zaidi kimuktadha; maana huwa kwamba watu waamini kupitia ushuhuda wake. Hata hivyo, kwa kuwa umbo la Kigiriki lenyewe linaweza kuhusishwa na Nuru, tafsiri haibadilishi kiwakilishi bali tanbihi inaweka wazi uwezekano huo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo wa vifungu viwili vya kusudi umehifadhiwa, huku urudiaji wa istilahi za ushahidi ukibaki wa asili na unaoeleweka.
