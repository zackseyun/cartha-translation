id: JHN.1.48
reference: John 1:48
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: λέγει αὐτῷ Ναθαναήλ· Πόθεν με γινώσκεις; ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Πρὸ τοῦ σε Φίλιππον φωνῆσαι ὄντα ὑπὸ τὴν συκῆν εἶδόν σε.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/048.yaml
  text: Nathanael said to him[a], “How do you know me?” Jesus answered and said to him, “Before Philip called you, while you were under the fig tree, I saw you.”
translation:
  language: sw
  text: Nathanaeli akamwambia, “Unanijuaje?[a]” Yesu akajibu, akamwambia, “Kabla Filipo hajakuita, ulipokuwa chini ya mtini, nilikuona.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kwa tafsiri ya neno kwa neno zaidi, “Unanijua kutoka wapi?”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πόθεν με γινώσκεις
  choice: Unanijuaje?
  rationale: Katika muktadha huu Πόθεν (‘kutoka wapi’) inauliza msingi au namna Yesu alivyomjua Nathanaeli. ‘Unanijuaje?’ ni Kiswahili cha kawaida na huwasilisha maana ya msemo mzima.
- source_word: ἀπεκρίθη ... καὶ εἶπεν αὐτῷ
  choice: akajibu, akamwambia
  rationale: Uundaji huu unawakilisha vitenzi vyote viwili vya Kigiriki huku ukiendelea kuwa wa kawaida katika masimulizi ya Kiswahili.
- source_word: Πρὸ τοῦ σε Φίλιππον φωνῆσαι
  choice: Kabla Filipo hajakuita
  rationale: Huwasilisha wazi uhusiano wa wakati uliotolewa na Πρὸ τοῦ pamoja na kitenzi-jina, na ‘kuita’ linafaa katika muktadha wa Filipo kumwendea Nathanaeli.
- source_word: ὄντα ὑπὸ τὴν συκῆν
  choice: ulipokuwa chini ya mtini
  rationale: Kirai hiki kinaeleza hali ya Nathanaeli wakati Yesu alipomwona. ‘Ulipokuwa’ ni cha asili na huhifadhi nguvu ya kimazingira na ya wakati ya participio.
- source_word: εἶδόν σε
  choice: nilikuona
  rationale: Kauli ya wakati uliopita huwakilishwa moja kwa moja; uhusiano wake na mwito wa Filipo tayari umewekwa na ‘Kabla.’
- source_word: συκῆν
  choice: mtini
  rationale: Hili ndilo jina la kawaida la Kiswahili kwa fig tree; ‘chini ya mtini’ ni usemi wa asili.
theological_decisions:
- issue: Asili ya Yesu kumjua na kumwona Nathanaeli
  choice: Kauli imetafsiriwa moja kwa moja bila kueleza jinsi Yesu alivyopata ujuzi huo.
  alternative: Kudokeza wazi kwamba Yesu alitumia maarifa ya kimiujiza au, kinyume chake, kwamba alikuwa amemwona kwa njia ya kawaida tu.
  rationale: Aya inasema Yesu alimwona Nathanaeli kabla ya Filipo kumwita, lakini haielezi utaratibu wa ujuzi huo. Tafsiri inaacha mvutano huo kama ulivyo katika matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Mtindo wa masimulizi wenye viambishi vya mfululizo (‘akamwambia,’ ‘akajibu’) umetumiwa kwa ufasaha wa kawaida wa Biblia ya Kiswahili.
