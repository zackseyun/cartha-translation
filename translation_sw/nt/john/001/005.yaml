  yaml_path: translation/nt/john/001/005.yaml
  text: And the light shines in the darkness[a], and the darkness has not overcome it.
translation:
  language: sw
  text: Nuru inang'aa gizani, na giza halijaishinda.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “giza halijaifahamu” au “halijaishika.” Kitenzi cha Kigiriki kinaweza kumaanisha kushinda, kufahamu, au kushika.
    reason: alternative_reading
lexical_decisions:
- source_word: φῶς
  choice: nuru
  rationale: “Nuru” ni neno la kawaida na lenye hadhi linalodumisha taswira kuu ya Yohana. Kiswahili hakihitaji kibainishi kinacholingana moja kwa moja na τὸ; muktadha unaifanya nuru hii kuwa mahsusi.
- source_word: σκοτίᾳ / σκοτία
  choice: giza
  rationale: “Giza” linadumisha upinzani wa kitaswira na wa kimada kati ya nuru na giza. Kutokuwepo kwa kibainishi katika Kiswahili hakupotezi urejeo mahsusi unaoeleweka katika muktadha.
- source_word: φαίνει
  choice: yang’aa
  rationale: Wakati wa sasa wa “yang’aa” unaonyesha tendo linaloendelea na unasikika kwa kawaida katika Kiswahili cha sasa.
- source_word: κατέλαβεν
  choice: halijaishinda
  rationale: Katika taswira ya nuru dhidi ya giza, “halijaishinda” huwasilisha maana ya kushinda au kuizidi nguvu. Kwa kuwa kitenzi cha Kigiriki pia kinaweza kumaanisha kufahamu au kushika, maana hiyo imehifadhiwa katika tanbihi.
- source_word: αὐτὸ
  choice: -i- katika “halijaishinda”
  rationale: Kiambishi cha yambwa “-i-” kinarejelea “nuru” kwa upatanisho wa kisarufi wa Kiswahili, bila kulazimisha rejeo la kibinadamu ambalo halijawekwa wazi katika mstari huu.
theological_decisions:
- issue: Maana ya κατέλαβεν katika upinzani wa nuru na giza
  choice: halijaishinda
  alternative: halijaifahamu / halijaishika
  rationale: Kigiriki kinaruhusu maana ya uhasama—kushinda au kukamata—na maana ya kiakili ya kufahamu. Taswira ya nuru na giza inaunga mkono “halijaishinda,” lakini tanbihi inadumisha utata halisi na uwezekano wa maana yenye tabaka.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Nayo” inaendeleza mtiririko wa πρόλογος bila kutafsiri καί kwa namna nzito; “wala” huunganisha kwa kawaida kauli ya pili iliyo hasi. Alama [a] imewekwa baada ya kishazi kinachohusika.
