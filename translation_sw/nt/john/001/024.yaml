  text: And they had been sent from the Pharisees[a].
translation:
  language: sw
  text: Nao walikuwa wametumwa kutoka kwa Mafarisayo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nao walikuwa wametumwa na Mafarisayo.” Kigiriki kinaonyesha kihalisi zaidi kwamba walitoka kwa Mafarisayo.
    reason: alternative_reading
lexical_decisions:
- source_word: Καὶ
  choice: Nao
  rationale: Kiunganishi hiki kinadumisha mtiririko wa simulizi na kuwaunganisha watu wanaotajwa na muktadha uliotangulia bila kuongeza maana mpya.
- source_word: ἀπεσταλμένοι ἦσαν
  choice: walikuwa wametumwa
  rationale: Muundo wa kitenzi kishirikishi cha wakati timilifu pamoja na ἦσαν unaonyesha tendo la kutumwa lililokuwa limekamilika na hali yake ikiendelea; Kiswahili hiki ni cha kawaida na kinahifadhi wazo hilo.
- source_word: ἐκ
  choice: kutoka kwa
  rationale: ἐκ pamoja na hali ya umilikishi huonyesha hasa chanzo au asili. ‘Kutoka kwa’ kinahifadhi maana hiyo bila kusisitiza moja kwa moja kwamba Mafarisayo ndio waliotekeleza tendo la kuwatuma.
- source_word: τῶν Φαρισαίων
  choice: Mafarisayo
  rationale: Hili ndilo jina la kawaida la kundi hili katika Kiswahili cha Biblia; Kiswahili hakihitaji kibainishi kinacholingana na τῶν.
theological_decisions:
- issue: Uhusiano wa wajumbe hao na Mafarisayo
  choice: Watu hao walikuwa wametumwa kutoka kwa Mafarisayo, jambo linalosisitiza chanzo cha ujumbe huo.
  alternative: Watu hao walikuwa wametumwa na Mafarisayo, jambo linalosisitiza Mafarisayo kama watendaji wa tendo la kuwatuma.
  rationale: Kigiriki kinatumia ἐκ na hali ya umilikishi, ambayo kwa msingi huonyesha chanzo au asili kuliko mtendaji wa tendo. Tafsiri kuu inahifadhi tofauti hiyo, huku tanbihi ikitoa maana nyingine inayowezekana katika muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Nao’ huendeleza simulizi kwa ufasaha; ‘kutoka kwa Mafarisayo’ huhifadhi kwa makusudi uwezekano wa chanzo badala ya kulazimisha maana ya mtendaji.
