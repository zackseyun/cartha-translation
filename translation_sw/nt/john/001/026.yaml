  text: ἀπεκρίθη αὐτοῖς ὁ Ἰωάννης λέγων· Ἐγὼ βαπτίζω ἐν ὕδατι· ⸀μέσος ὑμῶν ⸀ἕστηκεν ὃν ὑμεῖς οὐκ οἴδατε,
base_translation:
  language: en
  yaml_path: translation/nt/john/001/026.yaml
  text: John answered them[a], saying, “I baptize in water. Among you stands one whom you do not know,”
translation:
  language: sw
  text: Yohana akawajibu, “Mimi ninabatiza kwa maji. Katikati yenu[a] amesimama mtu ambaye ninyi hamjui.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Miongoni mwenu.”
    reason: Kiswahili hiki ni tafsiri nyingine ya μέσος ὑμῶν, kikisisitiza kuwapo kwake ndani ya kundi lao.
lexical_decisions:
- source_word: ἀπεκρίθη αὐτοῖς ὁ Ἰωάννης λέγων
  choice: Yohana akawajibu
  rationale: Hutoa kwa Kiswahili cha kawaida tendo la kujibu na kutanguliza maneno yanayofuata; maana ya λέγων inaonyeshwa wazi na nukuu bila kurudia kwa uzito ‘akisema.’
- source_word: βαπτίζω
  choice: ninabatiza
  rationale: ‘Batiza’ ni neno la kawaida na lililozoeleka katika muktadha huu; halibani maana kuwa aina moja tu ya utekelezaji.
- source_word: ἐν ὕδατι
  choice: kwa maji
  rationale: Ni usemi wa asili wa Kiswahili unaotaja maji kama kipengele au njia ya ubatizo bila kulazimisha ufafanuzi wa kimadhehebu kuhusu namna yake.
- source_word: μέσος ὑμῶν
  choice: Katikati yenu
  rationale: Huhifadhi nafasi ya kishazi mwanzoni na wazo la kuwapo ndani ya kundi lao.
- source_word: ἕστηκεν
  choice: amesimama
  rationale: Huwasilisha hali ya sasa iliyotokana na kusimama, sawasawa na nguvu ya wakati timilifu wa Kigiriki katika muktadha.
- source_word: ὃν ὑμεῖς οὐκ οἴδατε
  choice: mtu ambaye ninyi hamjui
  rationale: Huhifadhi maana pana ya ‘kutomjua’ badala ya kuibana kuwa ‘kutomtambua’; ‘ninyi’ huakisi msisitizo wa kiwakilishi cha Kigiriki.
theological_decisions:
- issue: Utambulisho wa mtu asiyepewa jina anayesimama katikati yao
  choice: mtu ambaye ninyi hamjui
  alternative: Masihi; Yesu; yeye
  rationale: Ingawa muktadha mpana humtambulisha, aya yenyewe haitaji jina wala cheo chake. Tafsiri inadumisha mvutano huo wa kisimulizi bila kuutangulia ufafanuzi wa aya zinazofuata.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa nukuu ni wa kawaida kwa wasomaji wengi; maneno ya kitheolojia hayajaongezewa ufafanuzi usiomo katika aya.
