base_translation:
  language: en
  yaml_path: translation/nt/john/001/021.yaml
  text: And they asked him[a], “What then? Are you Elijah?” And he says, “I am not.” “Are you the Prophet?” And he answered[b], “No.”
translation:
  language: sw
  text: Wakamwuliza, “Basi, wewe ni Eliya?” Anasema,[b] “Mimi si.” “Je, wewe ndiye yule Nabii?[a]” Akajibu, “La.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Nabii huyo,” yaelekea akimaanisha nabii aliyetazamiwa aliye kama Musa (Kumbukumbu la Torati 18:15, 18).
    reason: alternative_reading
  - marker: b
    text: Kigiriki hutumia wakati wa sasa wa kihistoria katika “anasema,” mtindo unaofanya simulizi kuwa hai.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠρώτησαν
  choice: wakamwuliza
  rationale: Kitenzi hiki katika wakati uliopita kinaendeleza simulizi na kutambulisha swali la moja kwa moja; ‘wakamwuliza’ ni Kiswahili cha kawaida na wazi.
- source_word: Τί οὖν;
  choice: Basi
  rationale: Katika muktadha huu, usemi huo mfupi unaanzisha swali linalofuata baada ya majibu ya kukataa. ‘Basi’ huhifadhi uhusiano huo wa kimantiki kwa Kiswahili cha asili bila kulazimisha swali lisilo kamili la ‘Nini basi?’
- source_word: σὺ Ἠλίας εἶ
  choice: wewe ni Eliya?
  rationale: ‘Wewe’ huhifadhi msisitizo wa kiwakilishi σὺ, na mpangilio huu ni swali la kawaida la Kiswahili. Jina Ἠλίας limetolewa kwa umbo la kawaida ‘Eliya’.
- source_word: Οὐκ εἰμί
  choice: Mimi siye
  rationale: Jibu hili fupi huhifadhi kukanusha kwa kitenzi kishirikishi bila kuongeza maelezo ya kupatanisha kifungu hiki na vifungu vingine. ‘Mimi’ pia hudumisha mkazo wa jibu.
- source_word: Ὁ προφήτης
  choice: yule Nabii
  rationale: Kibainishi katika Kigiriki kinaonyesha nabii maalumu aliyekuwa akitazamiwa, si nabii yeyote. ‘Yule Nabii’ huhifadhi umaalumu huo na dokezo la cheo bila kutaja utambulisho wake moja kwa moja.
- source_word: λέγει
  choice: akasema
  rationale: Ingawa Kigiriki kina wakati wa sasa wa kihistoria, Kiswahili cha simulizi kwa kawaida hutumia mfululizo wa ‘ka-’. ‘Akasema’ ni ya asili na huhifadhi mwendo hai wa simulizi.
- source_word: ἀπεκρίθη
  choice: akajibu
  rationale: Ni kitenzi cha kawaida cha kutoa jibu katika simulizi; ‘akajibu’ kinaendeleza mfululizo wa matukio kwa uwazi.
- source_word: Οὔ
  choice: La
  rationale: Chembe hii ni jibu la moja kwa moja la kukataa. ‘La’ ni jibu fupi, lenye hadhi na la kawaida kwa swali la ndiyo au hapana.
theological_decisions:
- issue: Utambulisho wa ‘yule Nabii’
  choice: Kutafsiri ‘yule Nabii’ bila ufafanuzi wa utambulisho wake katika matini kuu.
  alternative: ‘Nabii kama Musa’ au ‘nabii fulani’.
  rationale: Kibainishi cha Kigiriki kinaashiria mtu maalumu aliyekuwa akitazamiwa, lakini aya yenyewe haumtambulishi wazi. Tafsiri inadumisha dokezo na mvutano huo; tanbihi inaeleza rejeo linalowezekana.
- issue: Yohana kukataa kwamba yeye ni Eliya
  choice: 'Kutoa jibu lake moja kwa moja: ‘Mimi siye.’'
  alternative: Kupanua kuwa ‘Mimi si Eliya mwenyewe’ au kulipatanisha wazi na maelezo ya Injili nyingine.
  rationale: Matini inatoa katazo la moja kwa moja. Kuongeza namna ya kulielewa kungeingiza upatanisho wa kitafsiri ambao haujasemwa katika aya hii.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Mfululizo wa vitenzi vya ‘ka-’ umetumiwa kwa simulizi la asili. Majibu yameachwa mafupi ili kuhifadhi ukali na ufupi wa Kigiriki. Alama zote za tanbihi [a] na [b] zimewekwa katika matini kuu.
