base_translation:
  language: en
  yaml_path: translation/nt/john/001/031.yaml
  text: 'And I did not know him[a], but for this reason I came baptizing in water: that he might be revealed to Israel.'
translation:
  language: sw
  text: 'Nami sikumjua[a], lakini kwa sababu hii nilikuja nikibatiza kwa maji: ili afunuliwe kwa Israeli.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “sikumtambua.” Kigiriki kinaweza kumaanisha kutomjua au kutomtambua; tafsiri kuu inahifadhi usemi mpana zaidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ
  choice: Nami
  rationale: Muunganiko wa καί na ἐγώ unaendeleza ushuhuda uliotangulia na kuweka msisitizo mdogo kwa msemaji; “Nami” ni ya kawaida na yenye hadhi katika Kiswahili.
- source_word: οὐκ ᾔδειν αὐτόν
  choice: sikumjua
  rationale: Kauli hii inaeleza hali ya kutomjua wakati uliopita bila kuamua kama Yohana hakuwa amefahamiana naye binafsi au hakumtambua katika utambulisho wake; uwezekano wa pili umewekwa katika tanbihi.
- source_word: ἀλλ’
  choice: lakini
  rationale: Inaonyesha tofauti kati ya hali ya awali ya Yohana ya kutomjua na kusudi la huduma yake ya kubatiza.
- source_word: ἵνα φανερωθῇ
  choice: ili afunuliwe
  rationale: “Ili” linaonyesha kusudi, na “afunuliwe” linahifadhi hali ya kutendwa ya kitenzi bila kutaja mtendaji.
- source_word: τῷ Ἰσραὴλ
  choice: kwa Israeli
  rationale: Inahifadhi rejeleo la pamoja la Israeli na uhusiano wa kile kinachofunuliwa kuelekezwa kwake, bila kuongeza maelezo yasiyokuwamo katika maandishi.
- source_word: διὰ τοῦτο
  choice: kwa kusudi hili
  rationale: Katika muktadha huu kirai kinaelekeza mbele kwenye kishazi cha kusudi; tafsiri hii huifanya sentensi iwe wazi na ya kawaida katika Kiswahili.
- source_word: ἦλθον ἐγὼ
  choice: nilikuja
  rationale: Wakati uliopita sahili unawakilisha vizuri aoristi hapa; kiwakilishi cha nafsi kilichomo katika kitenzi kinatosha katika Kiswahili.
- source_word: ἐν ὕδατι
  choice: katika maji
  rationale: Inahifadhi kwa karibu taswira ya mahali iliyomo katika ἐν ὕδατι na haibadili waziwazi kuwa chombo pekee cha tendo.
- source_word: βαπτίζων
  choice: nikibatiza
  rationale: Muundo wa “nikibatiza” unaonyesha tendo lililoandamana na kuja kwa Yohana, na unahifadhi neno la kawaida la kidini bila kufafanua namna ya ubatizo zaidi ya maandishi.
theological_decisions:
- issue: Maana ya Yohana kusema kwamba hakumjua Yesu
  choice: sikumjua
  alternative: sikumtambua; sikumjua kuwa ndiye Masihi
  rationale: Mstari wenyewe hausemi wazi ikiwa Yohana hakuwa amefahamiana naye binafsi au hakumtambua katika utambulisho wake. Tafsiri kuu inahifadhi upana na mvutano huo badala ya kuingiza upatanisho wa kitheolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. Mpangilio wa sentensi umewekwa wa kawaida huku kishazi cha kusudi na hali ya kutendwa vikihifadhiwa.
