  text: ἦν τὸ φῶς τὸ ἀληθινὸν ὃ φωτίζει πάντα ἄνθρωπον ἐρχόμενον εἰς τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/009.yaml
  text: The true light[a], which enlightens every person, was coming into the world.
translation:
  language: sw
  text: Nuru ya kweli[a], inayemtia nuru kila mtu, ilikuwa inakuja ulimwenguni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “Nuru ya kweli, inayemtia nuru kila mtu anayekuja ulimwenguni.” Katika Kigiriki, neno “anayekuja” linaweza kuhusishwa na “kila mtu” badala ya “nuru ya kweli.”'
    reason: alternative_reading
lexical_decisions:
- source_word: φῶς
  choice: nuru
  rationale: Nomino ya kawaida “nuru” inahifadhi sitiari ya Kiyohana bila kulazimisha herufi kubwa.
- source_word: ἀληθινόν
  choice: ya kweli
  rationale: Huwasilisha maana ya kilicho halisi na kamili, si tu kauli iliyo sahihi.
- source_word: φωτίζει
  choice: inayemtia nuru
  rationale: Ni usemi wa asili unaohifadhi maana ya kutoa nuru na uwezekano wa maana ya kiroho.
- source_word: πάντα ἄνθρωπον
  choice: kila mtu
  rationale: Ni Kiswahili cha kawaida na sahihi kwa umoja wa kijumla unaojumuisha wanadamu wote.
- source_word: ἐρχόμενον εἰς τὸν κόσμον
  choice: ilikuwa inakuja ulimwenguni
  rationale: Katika matini kuu kirai hiki kinahusishwa kwa maana na “nuru ya kweli,” huku utata wa kisarufi ukihifadhiwa katika tanbihi.
- source_word: κόσμον
  choice: ulimwenguni
  rationale: Ni tafsiri ya kawaida ya κόσμος katika muktadha huu na inaendana na kitenzi cha mwendo.
- source_word: ἦν
  choice: ilikuwa
  rationale: Huhifadhi hali ya wakati uliopita usiotimilika na, pamoja na kirai cha kuja, huunda “ilikuwa inakuja.”
theological_decisions:
- issue: Kirai ἐρχόμενον (“inayekuja”) kinahusishwa na neno gani?
  choice: 'Katika matini kuu kinahusishwa kwa maana na “nuru ya kweli”: “ilikuwa inakuja ulimwenguni.”'
  alternative: 'Kinaweza kuhusishwa kisarufi na “kila mtu”: “kila mtu anayekuja ulimwenguni.”'
  rationale: Kisarufi, participio ya Kigiriki inaweza kurejelea ἄνθρωπον, lakini matumizi ya Kiyohana na muktadha wa utangulizi huunga mkono pia kuja kwa Nuru ulimwenguni. Tanbihi inahifadhi utata huo wa kweli.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Muundo unaepuka istilahi nzito kama “kuangazia” pale ambapo “kumtia nuru” huhifadhi vizuri zaidi sitiari ya chanzo.
