  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Ὅτι εἶπόν σοι ⸀ὅτι εἶδόν σε ὑποκάτω τῆς συκῆς πιστεύεις; μείζω τούτων ⸀ὄψῃ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/050.yaml
  text: Jesus answered and said to him[a], “Because I told you that I saw you under the fig tree, do you believe? You will see greater things than these.”
translation:
  language: sw
  text: Yesu akamjibu, “Je, unaamini kwa sababu nilikuambia kwamba nilikuona chini ya mtini?[a] Utaona mambo makubwa kuliko haya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kwa sababu nilikuambia kwamba nilikuona chini ya mtini, unaamini?”
    reason: Mbadala huu hufuata kwa karibu zaidi mpangilio wa maneno wa Kigiriki, ambamo kirai cha sababu kinatangulia swali.
lexical_decisions:
- source_word: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ
  choice: Yesu akamjibu
  rationale: Katika Kiswahili, ‘akamjibu’ kwa kawaida tayari huleta maana ya kusema kwa kujibu; kutafsiri vitenzi vyote viwili moja kwa moja kungetokeza usemi mzito na usio wa kawaida.
- source_word: Ὅτι
  choice: Kwa sababu
  rationale: Neno hili linaanzisha sababu inayohusishwa na swali la Yesu, huku tanbihi ikihifadhi uwezekano wa kulifanya swali hilo liwe wazi zaidi kwa ‘Je, ni kwa sababu…?’
- source_word: ὅτι
  choice: kwamba
  rationale: ὅτι ya pili inaanzisha maudhui ya jambo ambalo Yesu alimwambia, tofauti na ὅτι ya kwanza yenye maana ya sababu.
- source_word: εἶδόν σε
  choice: nilikuona
  rationale: Wakati uliopita rahisi unafaa katika muktadha na hauongezi wazo la wakati uliotangulia zaidi.
- source_word: ὑποκάτω τῆς συκῆς
  choice: chini ya mtini
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaohifadhi picha halisi ya mahali chini ya mti wa tini.
- source_word: πιστεύεις
  choice: unaamini
  rationale: Huhifadhi wakati wa sasa na wazo la kuamini katika swali la balagha bila kuongeza kitu kinachoaminiwa ambacho hakijasemwa wazi hapa.
- source_word: μείζω τούτων
  choice: mambo makubwa kuliko haya
  rationale: Kivumishi cha kulinganisha cha wingi kisicho na nomino kinawakilishwa kwa kawaida kwa ‘mambo makubwa,’ na ‘kuliko haya’ huhifadhi ulinganisho wa wingi.
- source_word: ὄψῃ
  choice: utaona
  rationale: Hutoa kwa uwazi hali ya wakati ujao ya kitenzi ὁράω katika Kiswahili cha sasa.
theological_decisions:
- issue: Nguvu ya swali πιστεύεις;
  choice: 'Swali la balagha: ‘unaamini?’'
  alternative: 'Kauli yenye mshangao au karipio hafifu: ‘Unaamini kwa sababu…’'
  rationale: Muundo wa Kigiriki unaeleweka vizuri kama swali, lakini hauhitaji kulifanya kuwa karipio kali. Tafsiri inadumisha mvutano huo na kuliacha liandamane na ahadi ya ufunuo mkubwa zaidi.
- issue: Uhusiano wa Ὅτι na swali
  choice: ‘Kwa sababu … unaamini?’
  alternative: ‘Je, ni kwa sababu … ndiyo maana unaamini?’
  rationale: Kigiriki kinaweza kuwakilishwa kwa swali linaloanza na sababu au kwa muundo wa Kiswahili unaofafanua zaidi uhusiano huo. Matini kuu inabaki karibu na mpangilio wa chanzo, huku tanbihi ikitoa mbadala wa wazi zaidi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa heshima lakini wa kawaida na unaoeleweka. ‘Mtini’ ni jina lililozoeleka la mti wa tini katika lugha ya Biblia. Muundo mzito wa moja kwa moja ‘akajibu na kumwambia’ umeepukwa kwa sababu ‘akamjibu’ ni wa asili zaidi bila kupoteza kazi ya fomula ya simulizi.
