id: JHN.1.17
reference: John 1:17
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ὅτι ὁ νόμος διὰ Μωϋσέως ἐδόθη, ἡ χάρις καὶ ἡ ἀλήθεια διὰ Ἰησοῦ Χριστοῦ ἐγένετο.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/017.yaml
  text: For the law was given through Moses[a]; grace and truth came through Jesus the Messiah.
translation:
  language: sw
  text: Kwa maana sheria ilitolewa kupitia Musa; neema na kweli zilikuja kupitia Yesu Masihi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa usemi wa kimapokeo, “Yesu Kristo.”
    reason: Tafsiri mbadala ya Χριστός inayohifadhi umbo lililozoeleka katika mapokeo ya Kikristo.
lexical_decisions:
- source_word: ὅτι
  choice: Kwa maana
  rationale: Katika muktadha huu neno hili linatoa msingi wa maelezo ya kauli iliyotangulia; “Kwa maana” ni ya kawaida na huhifadhi uhusiano huo wa kimantiki.
- source_word: ὁ νόμος
  choice: sheria
  rationale: Neno hili linarejelea sheria iliyotolewa kupitia Musa. “Sheria” ni wazi kwa wasomaji wa Kiswahili na haliongezi maana isiyokuwamo katika maandishi.
- source_word: διὰ Μωϋσέως
  choice: kupitia Musa
  rationale: διά pamoja na umilikishi huonyesha wakala au njia; “kupitia Musa” huhifadhi wazo la Musa kuwa mpatanishi bila kumfanya chanzo cha sheria.
- source_word: ἐδόθη
  choice: ilitolewa
  rationale: Huhifadhi kauli tendwa ya kitenzi na maana ya kitu kilichotolewa, huku mtendaji—Mungu—akiachwa bila kutajwa kama ilivyo katika Kigiriki.
- source_word: ἡ χάρις
  choice: neema
  rationale: “Neema” ni neno la kawaida na lenye upana unaofaa kwa χάρις katika muktadha wa Yohana.
- source_word: ἡ ἀλήθεια
  choice: kweli
  rationale: “Kweli” huhifadhi maana ya ἀλήθεια na mwangwi wa Yohana 1:14 bila kuibana kuwa uaminifu pekee au uhalisi pekee.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: kupitia Yesu Masihi
  rationale: “Kupitia” hudumisha ulinganifu na kishazi kinachomhusu Musa, na “Masihi” hutafsiri Χριστός kama cheo chenye maana badala ya kukinakili tu.
- source_word: ἐγένετο
  choice: zilikuja
  rationale: Katika muktadha huu kitenzi kinaonyesha kwamba neema na kweli ziliwasili au kujidhihirisha kihistoria kupitia Yesu; “zilikuja” ni Kiswahili cha kawaida na huepuka maana potovu ya “zikawa.”
theological_decisions:
- issue: Jinsi ya kutafsiri Χριστοῦ katika Ἰησοῦ Χριστοῦ
  choice: Yesu Masihi
  alternative: Yesu Kristo
  rationale: Χριστός lina maana ya cheo, “Masihi.” Tafsiri kuu inaonyesha maana hiyo wazi, huku umbo la kimapokeo “Yesu Kristo” likihifadhiwa katika tanbihi.
- issue: Uhusiano kati ya sheria na neema pamoja na kweli
  choice: Kudumisha utofautishaji wa vishazi bila kuongeza kwamba sheria haikuwa na neema au kweli
  alternative: Kuongeza maelezo yanayoweka sheria kinyume kabisa na neema na kweli
  rationale: Maandishi yanatofautisha namna sheria ilivyotolewa kupitia Musa na namna neema na kweli zilivyokuja kupitia Yesu, lakini hayasemi moja kwa moja kwamba sheria haikuwa na neema wala kweli.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo sambamba wa “kupitia Musa” na “kupitia Yesu Masihi” umehifadhiwa. Alama ya tanbihi imewekwa baada ya kirai kinachohusika moja kwa moja.
