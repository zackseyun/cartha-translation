  yaml_path: translation/nt/john/001/035.yaml
  text: On the next day[a], John was standing there again, and two of his disciples were with him.
translation:
  language: sw
  text: Kesho yake[a], Yohana alikuwa amesimama pale tena, pamoja na wanafunzi wake wawili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “Siku iliyofuata, Yohana alikuwa amesimama tena pamoja na wanafunzi wake wawili.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῇ ἐπαύριον
  choice: Kesho yake
  rationale: Kirai hiki ni nahau ya wakati inayomaanisha siku iliyofuata. “Kesho yake” ni Kiswahili cha kawaida na huendeleza kwa uwazi mfululizo wa simulizi.
- source_word: πάλιν
  choice: tena
  rationale: Neno hili huonyesha kurudiwa kwa hali ya tukio lililotangulia; “tena” ni tafsiri fupi na ya kawaida.
- source_word: εἱστήκει
  choice: alikuwa amesimama pale
  rationale: Umbo hili linaeleza hali ya kusimama iliyokuwa ikiendelea wakati huo. “Alikuwa amesimama” huhifadhi hali hiyo, huku “pale” ikisaidia sentensi kuwa ya kawaida katika Kiswahili bila kudai mahali mahususi zaidi.
- source_word: ὁ Ἰωάννης
  choice: Yohana
  rationale: Hili ndilo umbo la kawaida la jina hili katika Biblia za Kiswahili. Ingawa muktadha unamtambulisha kuwa Yohana Mbatizaji, maandishi yenyewe yanasema tu “Yohana.”
- source_word: καὶ
  choice: pamoja na
  rationale: Katika muundo huu, “pamoja na” huunganisha Yohana na wanafunzi wawili kwa Kiswahili cha kawaida, bila kubadili uhusiano wa vipashio katika tukio.
- source_word: ἐκ τῶν μαθητῶν αὐτοῦ δύο
  choice: wanafunzi wake wawili
  rationale: Kirai hiki kihalisi ni “wawili kutoka miongoni mwa wanafunzi wake.” Kiswahili “wanafunzi wake wawili” huhifadhi maana ya sehemu ya kundi kwa njia ya kawaida na inayoeleweka.
