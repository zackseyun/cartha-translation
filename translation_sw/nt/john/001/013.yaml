base_translation:
  language: en
  yaml_path: translation/nt/john/001/013.yaml
  text: who were born, not from bloods, nor from the will of the flesh, nor from the will of a man, but from God.
translation:
  language: sw
  text: ambao walizaliwa, si kutokana na damu[a], wala kutokana na utashi wa mwili, wala kutokana na utashi wa mwanamume, bali kutokana na Mungu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kigiriki kina neno “damu” katika wingi, usemi usio wa kawaida unaoelekea kumaanisha nasaba au uzazi wa kibinadamu.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἳ
  choice: ambao
  rationale: Kiwakilishi hiki cha uhusiano kinaunganisha mstari huu na watu waliotajwa katika mstari uliotangulia.
- source_word: ἐξ αἱμάτων
  choice: kutokana na damu
  rationale: Katika Kiswahili, “damu” kwa maana ya asili ya ukoo kwa kawaida hutumiwa kama nomino isiyohesabika. Tafsiri hii inaeleza chanzo cha kibinadamu bila kulazimisha wingi usio wa kawaida; wingi wa Kigiriki umeelezwa katika tanbihi.
- source_word: θελήματος
  choice: mapenzi
  rationale: “Mapenzi” yanafaa kwa nia au utashi hapa na yanawezesha kurudiwa kwa muundo wa sentensi.
- source_word: σαρκὸς
  choice: mwili
  rationale: “Mwili” huhifadhi lugha halisi ya σάρξ na hapa inaelekea kumaanisha msukumo au uzazi wa kawaida wa kibinadamu, bila kuingiza maana maalumu ya kimadhehebu.
- source_word: ἀνδρὸς
  choice: mwanamume
  rationale: Neno hili linahifadhi rejeo mahususi kwa mtu wa kiume katika muktadha wa kuzaa, badala ya kulipanua kuwa binadamu kwa ujumla.
- source_word: ἐκ θεοῦ
  choice: kutokana na Mungu
  rationale: Huhifadhi ulinganifu wa chanzo unaoonyeshwa na ἐκ katika vifungu vyote vya mstari.
- source_word: ἐγεννήθησαν
  choice: walizaliwa
  rationale: Hii ni tafsiri ya kawaida na ya sasa ya kauli tendwa katika muktadha huu, bila kutumia lugha ya kale au kuelekeza bila lazima kwa upande mmoja wa tendo la kuzaa.
theological_decisions:
- issue: Tofauti kati ya asili ya kibinadamu na asili inayotokana na Mungu
  choice: Mstari unasema kwamba kuzaliwa kwao hakukutokana na ukoo wa asili wala utashi wa kibinadamu wa kuzaa, bali kulitokana na Mungu.
  alternative: Kauli inaweza kueleweka kwa maana finyu zaidi kuwa inakataa utegemezi wa ukoo wa kikabila pekee.
  rationale: Kanusho la sehemu tatu linaweka uzazi wa kawaida wa kibinadamu kinyume na asili inayotokana na Mungu. Tafsiri haielezi namna ya kuzaliwa huko zaidi ya kile kinachosemwa na mstari.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima, na inaendeleza muundo wa sentensi kutoka mstari uliotangulia. Kurudiwa kwa “kutokana na” kunahifadhi msisitizo na ulinganifu wa maandishi ya Kigiriki.
