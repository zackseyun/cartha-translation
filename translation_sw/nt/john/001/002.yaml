lexical_decisions:
- source_word: οὗτος
  choice: Huyo
  rationale: Kiwakilishi hiki kinarejelea Neno lililotajwa katika mstari wa 1. “Huyo” ni cha asili katika Kiswahili, hudumisha rejeleo la kibinafsi, na kiko karibu zaidi na maana ya msingi ya οὗτος kuliko kuongeza jina tena.
- source_word: ἦν
  choice: alikuwa
  rationale: Hii ni tafsiri ya kawaida ya wakati usiotimilika wa εἰμί na inaeleza hali iliyoendelea bila kuongeza wazo lisilo wazi katika matini.
- source_word: ἐν ἀρχῇ
  choice: tangu mwanzo
  rationale: Katika Kiswahili, “tangu mwanzo” huwasilisha kwa kawaida kwamba hali hiyo ilikuwapo tayari mwanzo ulipofika. Pia hudumisha mwangwi wa Mwanzo 1:1, ingawa tafsiri ya karibu zaidi “hapo mwanzo” inawezekana.
- source_word: πρὸς
  choice: pamoja na
  rationale: Katika muktadha huu πρός linaonyesha uwepo pamoja na uhusiano na utofauti wa wahusika. “Pamoja na” ni usemi wa kawaida wa Kiswahili usiofafanua kupita kiasi namna ya uhusiano huo.
- source_word: τὸν θεόν
  choice: Mungu
  rationale: Ingawa Kigiriki kina kibainishi, Kiswahili cha kawaida hakihitaji kukitafsiri kando hapa. “Mungu” humtambulisha mhusika kwa usahihi.
theological_decisions:
- issue: Rejeleo la οὗτος kwa Neno katika Yohana 1:1
  choice: Kimetafsiriwa “Huyo,” kikimrejelea Neno kama mhusika binafsi.
  alternative: “Yeye” au “Huyu”
  rationale: “Huyo” huhifadhi nguvu ya kiwakilishi cha kuonyesha huku kikirejelea wazi mhusika aliyetangulia, bila kuongeza maelezo ya kidoktrini yasiyokuwamo katika mstari.
- issue: Nguvu ya πρὸς τὸν θεόν
  choice: “pamoja na Mungu”
  alternative: “kwa Mungu” au “mbele za Mungu”
  rationale: “Pamoja na Mungu” huhifadhi ukaribu wa uhusiano na utofauti kati ya Neno na Mungu bila kufafanua zaidi asili ya uhusiano huo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni fupi na ya kawaida; “Huyo” inaunganisha mstari huu na Neno la mstari uliotangulia, na “pamoja na Mungu” huepuka ukakasi wa “kwa Mungu.”
