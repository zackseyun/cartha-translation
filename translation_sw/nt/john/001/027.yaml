  text: the one coming after me[a], whose sandal strap I am not worthy to untie.
translation:
  language: sw
  text: yule anayekuja baada yangu, ambaye sistahili kufungua kamba ya sandali yake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “yule anayekuja nyuma yangu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ὀπίσω μου ἐρχόμενος
  choice: yule anayekuja baada yangu
  rationale: Kirai chenye kibainishi na kitenzi-shirikishi kinamtaja mtu maalumu. ‘Anayekuja baada yangu’ ni Kiswahili cha kawaida kinachohifadhi wazo la kuja na mpangilio wa kufuatana bila kulazimisha maana ya mahali.
- source_word: οὗ
  choice: ambaye ... chake
  rationale: Kiwakilishi cha uhusiano katika hali ya umilikishi kimewasilishwa kiasili kwa ‘ambaye’ pamoja na kiambishi cha umilikishi katika ‘chake.’
- source_word: οὐκ εἰμὶ ἄξιος
  choice: sistahili hata
  rationale: ‘Sistahili’ huhifadhi maana ya kutokuwa mwenye kustahili au kufaa. ‘Hata’ huifanya kauli iwe ya kawaida katika Kiswahili na kusisitiza udogo wa tendo bila kuongeza dai jipya la kiteolojia.
- source_word: ἵνα λύσω
  choice: kufungua
  rationale: Baada ya ‘sistahili,’ muundo wa ἵνα na utegemezi unaelezwa kiasili kwa kitenzi-jina. Katika muktadha wa kamba ya kiatu, ‘kufungua’ ni wazi na ya kawaida.
- source_word: ἱμάντα
  choice: kamba
  rationale: Hapa neno linamaanisha ukanda au kamba ya kufungia kiatu. ‘Kamba’ inaeleweka kwa urahisi katika Kiswahili cha kisasa.
- source_word: τοῦ ὑποδήματος
  choice: kiatu
  rationale: ὑπόδημα ni kiatu au sandali. ‘Kiatu’ ni neno la kawaida na pana; tanbihi inaonyesha uwezekano wa tafsiri iliyo mahususi zaidi, ‘sandali.’
theological_decisions:
- issue: Uhusiano wa ‘baada yangu’ na yule anayekuja
  choice: anayekuja baada yangu
  alternative: anayekuja nyuma yangu
  rationale: Tafsiri inahifadhi maana ya kawaida ya kufuatana kwa wakati au huduma, bila kuingiza moja kwa moja dai la ukuu linalofafanuliwa katika muktadha wa karibu.
- issue: Kiwango cha kutostahili kwa Yohana
  choice: sistahili hata kufungua
  alternative: sistahili kwamba nifungue
  rationale: Muundo wa Kiswahili unaonyesha unyenyekevu mkubwa wa Yohana na tendo linalokusudiwa, bila kuufanya usemi kuwa fundisho la ziada kuhusu hadhi yake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Yule’ humtambulisha mtu maalumu; ‘sistahili hata’ ni ya kawaida na yenye nguvu bila kuwa ya kale. Alama ya tanbihi imewekwa baada ya sentensi kwa kuwa tanbihi inahusu muundo mzima wa kishazi cha mwisho.
