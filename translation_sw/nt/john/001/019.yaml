  text: Καὶ αὕτη ἐστὶν ἡ μαρτυρία τοῦ Ἰωάννου ὅτε ⸀ἀπέστειλαν οἱ Ἰουδαῖοι ἐξ Ἱεροσολύμων ἱερεῖς καὶ Λευίτας ἵνα ἐρωτήσωσιν αὐτόν· Σὺ τίς εἶ;
base_translation:
  language: en
  yaml_path: translation/nt/john/001/019.yaml
  text: And this is the testimony of John[a], when the Jews sent priests and Levites from Jerusalem to ask him, “Who are you?”
translation:
  language: sw
  text: Na huu ndio ushuhuda wa Yohana, wakati Wayahudi[a] walipotuma makuhani na Walawi kutoka Yerusalemu ili wamwulize, “Wewe ni nani?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “viongozi wa Wayahudi” au “Wayudea.” Katika Injili ya Yohana, neno “Wayahudi” mara nyingi huwarejelea hasa viongozi wa kidini wa Kiyahudi walioko Yudea, wala si watu wote wa Kiyahudi.
    reason: lexical_alternative
lexical_decisions:
- source_word: μαρτυρία
  choice: ushuhuda
  rationale: Neno “ushuhuda” linafaa kwa taarifa anayotoa shahidi na linahifadhi dhana ya kisheria ya kutoa ushahidi iliyo muhimu katika Injili ya Yohana.
- source_word: τοῦ Ἰωάννου
  choice: wa Yohana
  rationale: 'Hii ni jenitivi yenye maana ya mtendaji: ni ushuhuda uliotolewa na Yohana, si ushuhuda unaomhusu Yohana.'
- source_word: ὅτε
  choice: walipo-
  rationale: Muundo wa wakati “walipotuma” unaonyesha kwa njia ya kawaida ya Kiswahili tukio ambalo katika hilo ushuhuda huo ulitolewa.
- source_word: ἀπέστειλαν
  choice: walituma
  rationale: “Walituma” ni tafsiri wazi na ya kawaida ya kitenzi hiki katika simulizi.
- source_word: οἱ Ἰουδαῖοι
  choice: Wayahudi
  rationale: Hii inadumisha usemi wa Kigiriki bila kuufanya wazi zaidi kuliko chanzo; tanbihi inaeleza kwamba katika muktadha huu huenda hasa viongozi wa kidini wa Uyahudi walioko Yudea wanakusudiwa.
- source_word: ἐξ Ἱεροσολύμων
  choice: kutoka Yerusalemu
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaoonyesha mahali walikotoka waliotumwa.
- source_word: ἱερεῖς καὶ Λευίτας
  choice: makuhani na Walawi
  rationale: Majina haya yanahifadhi makundi mawili tofauti yaliyohusishwa na huduma ya Hekalu.
- source_word: ἵνα ἐρωτήσωσιν αὐτόν
  choice: ili wamwulize
  rationale: “Ili” linaonyesha kusudi la kuwatuma, kama ilivyo katika kishazi cha Kigiriki cha ἵνα.
- source_word: Σὺ τίς εἶ;
  choice: Wewe ni nani?
  rationale: Kuweka “Wewe” kunahifadhi msisitizo wa kiwakilishi cha Kigiriki Σὺ na bado ni swali la kawaida katika Kiswahili.
theological_decisions:
- issue: Mrejelewa wa οἱ Ἰουδαῖοι katika Injili ya Yohana
  choice: Wayahudi katika matini kuu, pamoja na tanbihi ya ufafanuzi
  alternative: viongozi wa Wayahudi; Wayudea
  rationale: Tafsiri hii inadumisha upana na mvutano wa usemi wa chanzo huku tanbihi ikizuia kueleweka kana kwamba watu wote wa Kiyahudi wanalaumiwa. Kutumwa kwa makuhani na Walawi kutoka Yerusalemu kunaonyesha kwamba mamlaka za kidini zinaonekana hasa katika muktadha huu.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo “Na huu ndio…” unahifadhi kiunganishi cha Kigiriki, huku “walipotuma” ukitoa mtiririko wa asili wa Kiswahili. “Wamwulize” limetumiwa kwa tahajia sanifu.
