  text: Alikuja kwa yaliyo yake mwenyewe[a], na watu wake mwenyewe hawakumpokea[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Alikuja kwa kile kilichokuwa chake.” Kirai cha kwanza katika Kigiriki ni wingi wa jinsi isiyo ya kiume, tofauti na kirai kinachofuata cha wingi wa kiume, kinachorejelea watu wake.
    reason: alternative_reading
  - marker: b
    text: Au, “hawakumkubali” au “hawakumkaribisha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς τὰ ἴδια
  choice: katika vilivyo vyake
  rationale: Kirai cha Kigiriki ni wingi wa jinsi isiyo ya kiume na kinaelekeza kwa vitu, mahali, au milki iliyokuwa yake, si moja kwa moja kwa watu. Tafsiri hii inadumisha upana huo na kuitofautisha na “watu wake mwenyewe” inayofuata.
- source_word: ἦλθεν
  choice: alikuja
  rationale: Kitenzi hiki kinaeleza kwa urahisi kuja kwake na kinafaa katika mtiririko wa simulizi.
- source_word: οἱ ἴδιοι
  choice: watu wake mwenyewe
  rationale: Wingi wa kiume katika Kigiriki unaonyesha watu. Kutaja “watu” wazi kunadumisha tofauti iliyokusudiwa na kirai cha kwanza.
- source_word: παρέλαβον
  choice: hawakumpokea
  rationale: Neno hili linaweza kumaanisha kumpokea, kumkubali, au kumkaribisha mtu. “Hawakumpokea” ni pana na halibani maana katika wazo moja tu.
- source_word: αὐτόν
  choice: -m- katika “hawakumpokea”
  rationale: Kiwakilishi hiki kinamrejelea yeye aliyetajwa katika muktadha; Kiswahili hukiwakilisha kwa kiambishi cha yambwa -m-.
theological_decisions:
- issue: Maana na uhusiano wa matumizi mawili ya ἴδιος
  choice: Kirai cha kwanza kinarejelea vilivyokuwa vyake, huku cha pili kikirejelea watu wake mwenyewe.
  alternative: Vishazi vyote viwili vinaweza kueleweka kuwa vinarejelea watu wake; au cha kwanza kinaweza kueleweka hasa kuwa nyumba yake.
  rationale: Kigiriki hubadilika kutoka wingi wa jinsi isiyo ya kiume, τὰ ἴδια, kwenda wingi wa kiume, οἱ ἴδιοι. Tafsiri inadumisha tofauti hiyo bila kuamua kwa lazima kama cha kwanza ni nyumba, nchi, milki, au mali yake.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka. “Katika vilivyo vyake” ni kirai kifupi kinachodumisha upana wa Kigiriki, ingawa tanbihi inasaidia kufafanua tofauti yake na “watu wake mwenyewe.”
