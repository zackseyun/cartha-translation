  yaml_path: translation/nt/john/001/008.yaml
  text: He was not the light[a], but came to bear witness about the light.
translation:
  language: sw
  text: Yeye hakuwa ile Nuru,[a] bali alikuja ili atoe ushahidi kuhusu ile Nuru.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au, kwa kufuata muundo wa Kigiriki kwa karibu zaidi: “Yeye hakuwa ile Nuru, bali ili atoe ushahidi kuhusu ile Nuru.” Katika sehemu ya pili, Kigiriki kinaacha kitenzi kieleweke kutokana na muktadha.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἦν
  choice: hakuwa
  rationale: Ni tafsiri ya moja kwa moja ya kitenzi εἰμί katika wakati uliopita kisichokanushwa; hapa Kiswahili hutumia kwa kawaida “hakuwa”.
- source_word: ἐκεῖνος
  choice: Yeye
  rationale: Ingawa ni kiwakilishi cha kuonyesha, katika mtindo wa Yohana kinamrejelea mtu kwa msisitizo. “Yeye” ni ya asili katika Kiswahili na inadumisha msisitizo huo.
- source_word: τὸ φῶς
  choice: ile Nuru
  rationale: “Ile” inaonyesha kwamba ni Nuru maalumu iliyokwisha kutajwa katika utangulizi. Herufi kubwa inasaidia kutambulisha rejeo hili la pekee bila kuongeza ufafanuzi wa kimadhehebu.
- source_word: ἀλλ’ ἵνα
  choice: bali alikuja
  rationale: Baada ya ἀλλά, Kigiriki kinaacha kitenzi kikieleweka kutokana na muktadha. “Alikuja” hukamilisha sentensi kwa Kiswahili cha kawaida na kuonyesha kusudi lililotajwa katika mstari uliotangulia.
- source_word: μαρτυρήσῃ
  choice: kuitolea ushahidi
  rationale: Kauli hii inadumisha maana ya kutoa ushahidi kuhusu mwingine na inafaa matumizi ya kimahakama au kiushahidi ya μαρτυρέω katika Yohana.
- source_word: περὶ τοῦ φωτός
  choice: ile Nuru
  rationale: Muundo “kuitolea ushahidi ile Nuru” ni Kiswahili cha asili kinachoeleza kwamba Nuru ndiyo inayohusu ushahidi huo; unawakilisha περί pamoja na nomino katika hali ya genitive.
theological_decisions:
- issue: Utambulisho na jukumu la Yohana kuhusiana na Nuru
  choice: Mstari unakataa kwamba Yohana mwenyewe alikuwa Nuru na unaeleza kusudi lake kuwa kuitolea ushahidi Nuru.
  alternative: 'Tafsiri ya karibu zaidi na muundo wa Kigiriki inaweza kuwa: “Yeye hakuwa ile Nuru, bali ili aitoe ushahidi kuhusu ile Nuru.”'
  rationale: Tafsiri inadumisha tofauti kati ya shahidi na Nuru bila kuongeza ufafanuzi wa kiteolojia. Neno “alikuja” linajaza tu kitenzi kilichoachwa katika Kigiriki na kinachoeleweka kutokana na muktadha.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. “Bali” inadumisha utofautishaji wenye nguvu, na “kuitolea ushahidi” ni ya asili kuliko muundo mzito wa “kushuhudia kuhusu.”
