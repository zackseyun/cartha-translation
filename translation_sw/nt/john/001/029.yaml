  source_fidelity: 'Tafsiri inafuata kwa uaminifu matini ya Kigiriki: wakati wa sasa wa kisimulizi katika βλέπει na λέγει umehifadhiwa; πρὸς αὐτόν imewasilishwa kwa maana ya Yesu kumjia Yohana; na umoja wa τὴν ἁμαρτίαν umehifadhiwa katika “dhambi ya ulimwengu.” “Anayeondoa” ni tafsiri sahihi ya αἴρων katika muktadha huu na haina ufafanuzi wa ziada wa kiteolojia.'
