id: JHN.1.29
reference: John 1:29
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: Τῇ ἐπαύριον βλέπει τὸν Ἰησοῦν ἐρχόμενον πρὸς αὐτόν, καὶ λέγει· Ἴδε ὁ ἀμνὸς τοῦ θεοῦ ὁ αἴρων τὴν ἁμαρτίαν τοῦ κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/029.yaml
  text: The next day he sees Jesus coming toward him and says, “Look, the Lamb of God, who takes away the sin of the world!”
translation:
  language: sw
  text: Kesho yake, anamwona Yesu akija kwake, naye anasema, “Tazama, Mwanakondoo wa Mungu, anayeondoa dhambi ya ulimwengu!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τῇ ἐπαύριον
  choice: Kesho yake
  rationale: Ni usemi wa kawaida wa Kiswahili unaowasilisha kwa usahihi siku iliyofuata katika simulizi.
- source_word: βλέπει
  choice: anamwona
  rationale: Wakati wa sasa wa kisimulizi umehifadhiwa, kama katika Kigiriki.
- source_word: Ἴδε
  choice: Tazama
  rationale: Amri hii ya kuvuta fikira ina uzito na hadhi inayofaa huku ikieleweka kwa wasomaji wa kawaida.
- source_word: ὁ ἀμνὸς τοῦ θεοῦ
  choice: Mwanakondoo wa Mungu
  rationale: Huhifadhi taswira halisi na yenye uzito wa kitheolojia ya matini chanzo.
- source_word: ὁ αἴρων
  choice: anayeondoa
  rationale: Kitenzi αἴρω hapa kwa kawaida hueleweka kama kuondoa; uchaguzi huu hauongezi maelezo kuhusu njia ambayo dhambi inaondolewa.
- source_word: τὴν ἁμαρτίαν τοῦ κόσμου
  choice: dhambi ya ulimwengu
  rationale: Umoja wa ἁμαρτίαν umehifadhiwa, na κόσμος imetafsiriwa kwa neno la kawaida ‘ulimwengu’.
theological_decisions:
- issue: Maana ya αἴρων kuhusu dhambi
  choice: anayeondoa
  alternative: anayebeba
  rationale: αἴρω inaweza kuhusisha kuinua au kubeba, lakini katika muktadha huu maana ya kuondoa ndiyo inayotawala. Tafsiri haielezi zaidi iwapo kuondoa huko kunatokea kwa kubeba dhambi, hivyo inadumisha mvutano wa kitheolojia.
- issue: Umoja wa ‘dhambi’
  choice: dhambi ya ulimwengu
  alternative: dhambi za ulimwengu
  rationale: Matini ya Kigiriki ina nomino ya umoja, ambayo inaweza kuelekeza dhambi kama hali au jumla ya uasi wa ulimwengu; kwa hiyo haijabadilishwa kuwa wingi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye lugha ya sasa, yenye hadhi na inayoeleweka kwa urahisi. Wakati wa sasa wa kisimulizi umehifadhiwa katika ‘anamwona’ na ‘anasema’.
