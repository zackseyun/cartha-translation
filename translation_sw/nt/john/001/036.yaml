lexical_decisions:
- source_word: ἐμβλέψας
  choice: akamtazama
  rationale: Kitenzi hiki kinaonyesha kumwangalia mtu kwa makini; ‘akamtazama’ ni cha kawaida na cha asili katika Kiswahili.
- source_word: περιπατοῦντι
  choice: alipokuwa akitembea
  rationale: Huwasilisha tendo linaloendelea wakati Yesu anatazamwa.
- source_word: λέγει
  choice: akasema
  rationale: Ingawa Kigiriki kinatumia wakati wa sasa wa kisimulizi, wakati uliopita wa kisimulizi unasikika kwa kawaida katika Kiswahili.
- source_word: Ἴδε
  choice: Tazama
  rationale: Ni mwito wa kuelekeza fikira kwa Yesu, wenye uzito unaofaa muktadha.
- source_word: ὁ ἀμνὸς τοῦ θεοῦ
  choice: Mwanakondoo wa Mungu
  rationale: Hifadhi taswira kuu ya kitheolojia na muundo wa uhusiano wa Kigiriki bila kuufafanua kupita maandishi.
theological_decisions:
- issue: Maana ya ‘Mwanakondoo wa Mungu’
  choice: Taswira imehifadhiwa bila maelezo ya ziada.
  alternative: Kuifafanua moja kwa moja kuwa dhabihu au mkombozi.
  rationale: Mstari wenyewe hautaji wazi ni kipengele gani cha taswira ya mwanakondoo kinachokusudiwa; tafsiri haipaswi kuondoa upana huo wa maana.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Sentensi ni fupi na inaendeleza mtindo wa simulizi.
