id: JHN.1.39
reference: John 1:39
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: λέγει αὐτοῖς· Ἔρχεσθε καὶ ⸂ὄψεσθε. ἦλθαν οὖν⸃ καὶ εἶδαν ποῦ μένει, καὶ παρ’ αὐτῷ ἔμειναν τὴν ἡμέραν ἐκείνην· ὥρα ἦν ὡς δεκάτη.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/039.yaml
  text: He said to them[a], “Come, and you will see.” So they went and saw where he was staying, and they stayed with him that day. It was about the tenth hour.
translation:
  language: sw
  text: Akawaambia, “Njooni, nanyi mtaona.” Basi wakaenda, wakaona mahali alipokuwa anakaa, nao wakakaa pamoja naye siku hiyo. Ilikuwa karibu saa ya kumi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ikiwa saa zilihesabiwa tangu macheo, hii ilikuwa karibu saa 4:00 alasiri; wengine huelewa kuwa saa zilihesabiwa kwa mfumo wa Kirumi, hivyo ilikuwa karibu saa 10:00 asubuhi.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει αὐτοῖς
  choice: Akawaambia
  rationale: Kauli ya wakati uliopo inayotumiwa kusimulia tukio la zamani imetafsiriwa kwa wakati uliopita wa masimulizi ya Kiswahili.
- source_word: Ἔρχεσθε
  choice: Njooni
  rationale: Ni mwaliko wa moja kwa moja kwa watu zaidi ya mmoja; “Njooni” ni wa kawaida na wa heshima katika Kiswahili.
- source_word: ὄψεσθε
  choice: nanyi mtaona
  rationale: 'Huhifadhi hali ya wakati ujao na uhusiano wa kauli mbili: kuja kutafuatwa na kuona.'
- source_word: ἦλθαν οὖν
  choice: Basi wakaenda
  rationale: “Basi” huonyesha matokeo ya mwaliko, na “wakaenda” ni mwendo unaoeleweka kwa kawaida kutoka kwa mtazamo wa masimulizi.
- source_word: εἶδαν
  choice: wakaona
  rationale: Ni tafsiri ya moja kwa moja na pia huhifadhi mwangwi wa kitenzi “mtaona.”
- source_word: ποῦ μένει
  choice: mahali alipokuwa anakaa
  rationale: Katika muktadha huu μένω inahusu mahali Yesu alipokuwa amefikia au akiishi kwa muda; usemi huu ni wa asili bila kuainisha kama nyumba au malazi.
- source_word: παρ’ αὐτῷ
  choice: pamoja naye
  rationale: Huonyesha kuwa walibaki katika ushirika wake, bila kuongeza dai lisilotajwa wazi kuhusu mahali.
- source_word: ἔμειναν
  choice: wakakaa
  rationale: “Kukaa” ni kitenzi cha kawaida hapa na huhifadhi uhusiano wa kileksia na “alipokuwa anakaa.”
- source_word: τὴν ἡμέραν ἐκείνην
  choice: siku hiyo
  rationale: Hutaja siku ile bila kuongeza “siku nzima” au “muda uliobaki wa siku,” ambayo hayajasemwa wazi.
- source_word: ὥρα ἦν ὡς δεκάτη
  choice: Ilikuwa karibu saa ya kumi
  rationale: “Karibu” huwakilisha ukadiriaji wa ὡς, na “saa ya kumi” huhifadhi namna ya chanzo ya kutaja wakati badala ya kuibadili moja kwa moja kuwa saa ya kisasa.
theological_decisions:
- issue: Jinsi ya kuhesabu “saa ya kumi”
  choice: Usemi halisi “saa ya kumi” umehifadhiwa katika matini kuu.
  alternative: Takriban saa 10:00 asubuhi kwa hesabu ya Kirumi, au takriban saa 4:00 alasiri ikiwa saa zilihesabiwa tangu macheo.
  rationale: Matini yenyewe haitaji mfumo uliotumiwa kuhesabu saa. Tanbihi inaweka wazi uwezekano mkuu bila kutatua kimabavu jambo lenye utata.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa matini ya Biblia. “Saa ya kumi” imewekewa tanbihi kwa sababu desturi ya Kiswahili ya kutaja saa inaweza kumwelekeza msomaji moja kwa moja kwenye saa 4:00 alasiri, ilhali mfumo wa kuhesabu saa katika kifungu hiki unabishaniwa.
