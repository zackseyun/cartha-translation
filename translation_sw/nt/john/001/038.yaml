  text: στραφεὶς δὲ ὁ Ἰησοῦς καὶ θεασάμενος αὐτοὺς ἀκολουθοῦντας λέγει αὐτοῖς· Τί ζητεῖτε; οἱ δὲ εἶπαν αὐτῷ· Ῥαββί (ὃ λέγεται ⸀μεθερμηνευόμενον Διδάσκαλε), ποῦ μένεις;
base_translation:
  language: en
  yaml_path: translation/nt/john/001/038.yaml
  text: Then Jesus turned and[a], seeing them following, said to them, “What are you seeking?” They said to him, “Rabbi” (which translated means Teacher)[c][b], “where are you staying?”
translation:
  language: sw
  text: Kisha Yesu akageuka, na alipowaona wakimfuata, akawaambia, “Mnatafuta nini?”[a] Wakamwambia, “Rabi”[b] (yaani, “Mwalimu”), “Unakaa wapi?”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mnataka nini?” Kitenzi cha Kigiriki kinaweza kumaanisha kutafuta kitu au kukitamani.
    reason: lexical_alternative
  - marker: b
    text: “Rabi” ni cheo cha Kiebrania au Kiaramu kinachomaanisha “Mwalimu.”
    reason: cultural_note
  - marker: c
    text: Kitenzi cha Kigiriki kinachotafsiriwa “unakaa” kinaweza pia kutafsiriwa “unabaki”; ndicho kinachotumiwa mara nyingi katika Yohana kwa maana ya kubaki.
    reason: lexical_alternative
lexical_decisions:
- source_word: στραφεὶς
  choice: akageuka
  rationale: Kitenzi hiki kinaonyesha Yesu aligeuka kabla ya kusema; “akageuka” ni cha kawaida na hakiongezi mwelekeo ambao Kigiriki hakijautaja.
- source_word: θεασάμενος
  choice: akawaona
  rationale: Huwasilisha tendo la kuwaona kwa makini katika mfuatano wa simulizi, bila kuongeza wazo la kushangaa au kugundua kwa ghafla.
- source_word: ἀκολουθοῦντας
  choice: wakimfuata
  rationale: 'Huhifadhi tendo linaloendelea na pia uwezekano wa maana mbili katika Yohana: walikuwa wakitembea nyuma yake na wakati huohuo walikuwa wakianza kuwa wafuasi wake.'
- source_word: Τί ζητεῖτε;
  choice: Mnatafuta nini?
  rationale: “Kutafuta” linaweza kumaanisha kutafuta kitu kwa kawaida au kuwa na shauku ya ndani; kwa hiyo linahifadhi kina kinachowezekana katika simulizi la Yohana.
- source_word: Ῥαββί
  choice: Rabi
  rationale: Cheo hiki cha Kiyahudi kimetoholewa kwa kuwa mwandishi mwenyewe anakifafanua mara moja.
- source_word: μεθερμηνευόμενον Διδάσκαλε
  choice: maana yake, “Mwalimu”
  rationale: Hutoa kwa Kiswahili cha asili maelezo ya mwandishi kuhusu maana ya cheo hicho, huku “Mwalimu” likihifadhi matumizi yake kama neno la kumwita mtu.
- source_word: ποῦ μένεις;
  choice: unakaa wapi?
  rationale: Katika mazingira haya swali linahusu mahali Yesu alipokuwa akikaa. Tafsiri hii ni ya kawaida kwa Kiswahili, ingawa kitenzi cha Kigiriki kinaweza pia kumaanisha kubaki.
theological_decisions:
- issue: Kitenzi μένω kina uzito wa kiteolojia baadaye katika Yohana, lakini hapa kinatumika katika swali kuhusu mahali.
  choice: unakaa wapi?
  alternative: unabaki wapi?
  rationale: Muktadha wa karibu unaonyesha wanafunzi wanauliza mahali Yesu anapokaa. Tanbihi inahifadhi uhusiano wa kitenzi hiki na wazo la kubaki bila kulazimisha maana hiyo katika sentensi.
- issue: ζητέω kinaweza kuwa swali la kawaida au swali lenye kina kuhusu tamaa ya ndani.
  choice: Mnatafuta nini?
  alternative: Mnataka nini?
  rationale: “Mnatafuta nini?” ni la kawaida kwa Kiswahili na pia linaacha wazi mwangwi wa kiroho unaowezekana katika simulizi, badala ya kuufuta au kuufanya uwe wazi kupita kiasi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Mfuatano wa vitenzi “akageuka, akawaona, akawauliza” unasomeka kwa urahisi katika simulizi. “Rabi” limehifadhiwa kwa kuwa andiko lenyewe linatoa maana yake.
