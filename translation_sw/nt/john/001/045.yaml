id: JHN.1.45
reference: John 1:45
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εὑρίσκει Φίλιππος τὸν Ναθαναὴλ καὶ λέγει αὐτῷ· Ὃν ἔγραψεν Μωϋσῆς ἐν τῷ νόμῳ καὶ οἱ προφῆται εὑρήκαμεν, ⸀Ἰησοῦν υἱὸν τοῦ Ἰωσὴφ τὸν ἀπὸ Ναζαρέτ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/045.yaml
  text: 'Philip found Nathanael and said to him[a], “We have found him of whom Moses in the Law and also the prophets wrote: Jesus son of Joseph[b], from Nazareth.”'
translation:
  language: sw
  text: 'Filipo akamkuta Nathanaeli, akamwambia, “Tumempata yule ambaye Musa aliandika kumhusu katika Sheria, na manabii pia waliandika kumhusu: Yesu, mwana wa Yosefu, aliyetoka Nazareti.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὑρίσκει
  choice: akamkuta
  rationale: Wakati uliopo wa kihistoria katika Kigiriki umetafsiriwa kwa wakati wa masimulizi wa Kiswahili; “akamkuta” ni wa kawaida na unaendeleza mtiririko wa simulizi.
- source_word: λέγει
  choice: akamwambia
  rationale: Wakati uliopo wa kihistoria umetolewa kwa umbo la masimulizi lenye wakati uliopita; kiambishi cha yambwa kinaonyesha wazi kuwa alimwambia Nathanaeli.
- source_word: Ὃν ... ἔγραψεν
  choice: yule ambaye ... aliandika habari zake
  rationale: Muundo huu wa Kiswahili unaonyesha kuwa mtu huyo ndiye aliyeandikiwa, bila kufanya kitenzi “aliandika” kisionekane kuwa na yambwa.
- source_word: ἐν τῷ νόμῳ
  choice: katika Sheria
  rationale: “Sheria” yenye herufi kubwa inaonyesha maandiko yanayohusishwa na Musa, si sheria kwa maana ya jumla.
- source_word: οἱ προφῆται
  choice: manabii
  rationale: Ni neno la kawaida la Kiswahili kwa mashahidi wa kinabii na, katika muktadha huu, maandiko yao.
- source_word: εὑρήκαμεν
  choice: tumempata
  rationale: Kauli timilifu ya Kigiriki ina matokeo ya sasa; Kiswahili “tumempata” huhifadhi maana ya ugunduzi ambao sasa umetimia.
- source_word: υἱὸν τοῦ Ἰωσὴφ
  choice: mwana wa Yosefu
  rationale: Inahifadhi utambulisho wa kawaida wa kijamii uliotamkwa na Filipo bila kuongeza ufafanuzi wa kikristo usiotajwa katika aya.
- source_word: τὸν ἀπὸ Ναζαρέτ
  choice: kutoka Nazareti
  rationale: “Kutoka” huwakilisha moja kwa moja ἀπό na kuonyesha asili au uhusiano na mahali hapo.
- source_word: Ναθαναὴλ
  choice: Nathanaeli
  rationale: Umbo la jina linalotambulika katika matumizi ya Biblia ya Kiswahili.
- source_word: Ἰησοῦν
  choice: Yesu
  rationale: Umbo sanifu la jina hili katika Kiswahili.
- source_word: Μωϋσῆς
  choice: Musa
  rationale: Umbo sanifu la jina hili katika Kiswahili.
theological_decisions:
- issue: Maana ya “mwana wa Yosefu” kuhusiana na kristolojia
  choice: Kauli ya Filipo “Yesu mwana wa Yosefu” imehifadhiwa kama ilivyo.
  alternative: Yesu, aliyedhaniwa kuwa mwana wa Yosefu
  rationale: Aya inaripoti utambulisho wa Yesu kwa maneno ya Filipo. Tafsiri haipaswi kuingiza ufafanuzi wa baadaye wa kimafundisho ndani ya kauli yenyewe.
- issue: Ushuhuda wa Musa na manabii
  choice: Musa na manabii wote wamewasilishwa kama waliandika habari za mtu huyu.
  alternative: Yule ambaye Musa aliandika habari zake katika Sheria na manabii pia
  rationale: Kurudia “ambaye ... waliandika habari zake” kunafanya wahusika wote wawili kuwa wazi na kuhifadhi madai ya Filipo bila kufafanua zaidi aina ya unabii unaokusudiwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Muundo wa “aka-” unafaa masimulizi ya Biblia na unaeleweka kwa urahisi. Hakuna tanbihi iliyohitajika, kwa kuwa tofauti za kimuundo na maana ya ἀπό zimewasilishwa wazi katika matini.
