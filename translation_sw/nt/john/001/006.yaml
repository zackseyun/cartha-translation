  text: There was a man sent from God[a], whose name was John.
translation:
  language: sw
  text: Alitokea mtu aliyetumwa kutoka kwa Mungu; jina lake lilikuwa Yohana.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐγένετο
  choice: Alitokea
  rationale: Katika muktadha huu kitenzi kinamtambulisha mhusika mpya katika simulizi. “Alitokea” ni Kiswahili cha kawaida na hakidokezi kwamba aliumbwa wakati huo.
- source_word: ἄνθρωπος
  choice: mtu
  rationale: Neno linamtaja mtu mmoja, Yohana. “Mtu” ni la kawaida na la heshima katika Kiswahili; jinsia yake inaeleweka kutokana na jina na muktadha.
- source_word: ἀπεσταλμένος
  choice: aliyetumwa
  rationale: Huhifadhi hali ya kutendwa na wazo la kuwa ametumwa kwa kazi fulani bila kuongeza cheo kisichotajwa katika mstari.
- source_word: παρὰ θεοῦ
  choice: kutoka kwa Mungu
  rationale: παρά pamoja na hali ya kumiliki huonyesha chanzo; “kutoka kwa Mungu” huhifadhi mkazo huo kuliko “na Mungu,” ambalo lingeweka mkazo zaidi juu ya mtendaji.
- source_word: ὄνομα αὐτῷ Ἰωάννης
  choice: jina lake Yohana
  rationale: Ni usemi wa asili na wenye kueleweka unaowasilisha kwa ufupi nahau ya Kigiriki ya kumtambulisha kwa jina.
- source_word: Ἰωάννης
  choice: Yohana
  rationale: “Yohana” ni umbo la jina lililozoeleka katika tafsiri za Biblia za Kiswahili na katika matumizi ya kawaida ya Kikristo Afrika Mashariki.
theological_decisions:
- issue: Asili ya utume wa Yohana
  choice: “aliyetumwa kutoka kwa Mungu” humwonyesha Yohana kuwa ametumwa kwa agizo lenye chanzo chake kwa Mungu.
  alternative: “aliyetumwa na Mungu”
  rationale: Muundo wa Kigiriki unaunganisha hali ya kutumwa na chanzo chake kwa Mungu. Tafsiri iliyochaguliwa huhifadhi wazo hilo bila kuongeza madai mengine kuhusu cheo au huduma ya Yohana.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Sentensi ni fupi na ya kisimulizi. Hakuna tanbihi iliyowekwa kwa sababu “jina lake Yohana” ni wazi na tofauti zinazowezekana hazibadili maana kwa kiwango kinachohitaji tanbihi.
