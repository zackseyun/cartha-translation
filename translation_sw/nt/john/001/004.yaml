  yaml_path: translation/nt/john/001/004.yaml
  text: In him was life[a], and the life was the light of men.
translation:
  language: sw
  text: Ndani yake kulikuwa na uzima, na uzima huo ulikuwa nuru ya wanadamu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν αὐτῷ
  choice: Ndani yake
  rationale: Inadumisha maana ya ἐν pamoja na kiwakilishi kinachomrejelea Neno katika muktadha. Kiswahili hakihitaji kutofautisha ‘yeye’ na ‘hicho’ katika umbo la ‘yake,’ lakini muktadha unaendelea kuonyesha mrejelewa wake.
- source_word: ζωὴ
  choice: uzima
  rationale: ‘Uzima’ ni tafsiri ya kawaida na yenye uzito unaofaa kwa ζωή; haiongezi waziwazi wazo la ‘uzima wa milele,’ ambalo halijasemwa katika mstari huu.
- source_word: ἦν
  choice: kulikuwa na / ulikuwa
  rationale: Wakati uliopita wa hali unaonyeshwa kwa ‘kulikuwa na’ katika kishazi cha kwanza na ‘ulikuwa’ katika cha pili, kwa Kiswahili cha kawaida na cha asili.
- source_word: ἡ ζωὴ
  choice: uzima huo
  rationale: ‘Huo’ huonyesha wazi kwamba uzima katika kishazi cha pili ndio ule uliotajwa katika kishazi cha kwanza, ikihifadhi nguvu ya urejeleo ya kibainishi cha Kigiriki.
- source_word: τὸ φῶς
  choice: nuru
  rationale: ‘Nuru’ ni tafsiri ya asili na yenye hadhi ya φῶς, huku ikidumisha taswira kuu ya Yohana bila kuifafanua kupita kiasi.
- source_word: τῶν ἀνθρώπων
  choice: ya wanadamu
  rationale: ‘Wanadamu’ humaanisha watu wote kwa kawaida katika Kiswahili na kuakisi hali ya jumla ya ἀνθρώπων pamoja na uhusiano wa umilikaji unaoonyeshwa na jenitivi.
theological_decisions:
- issue: Mrejelewa na hali ya kibinafsi ya αὐτῷ
  choice: ‘Yake’ inamrejelea Neno kama mwenye hali ya kibinafsi katika muktadha.
  alternative: Kuchukua λόγος kwa maana dhahania na kuelewa ‘yake’ kama rejeleo lisilo la kibinafsi.
  rationale: Muktadha wa dibaji unamwasilisha Neno kwa namna ya kibinafsi. Hata hivyo, umbo la kawaida la Kiswahili ‘yake’ halilazimishi ufafanuzi wa ziada usiomo katika mstari.
- issue: Maana ya jumla ya ἀνθρώπων
  choice: ‘Wanadamu,’ yaani jamii yote ya binadamu.
  alternative: ‘Watu.’
  rationale: Neno ‘wanadamu’ ni jumuishi kwa jinsia zote, lina hadhi inayofaa, na linawasilisha kwa usahihi maana ya jumla ya neno la Kigiriki.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo ‘Ndani yake’ unahifadhi msisitizo wa mwanzo wa Kigiriki; ‘uzima huo’ huleta urejeleo wa wazi na wa asili katika Kiswahili. Hakuna tanbihi inayohitajika, kwa kuwa ‘wanadamu’ tayari huwasilisha wazi maana jumuishi ya ἀνθρώπων.
