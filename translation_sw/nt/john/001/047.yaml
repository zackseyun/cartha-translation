  text: εἶδεν ⸀ὁ Ἰησοῦς τὸν Ναθαναὴλ ἐρχόμενον πρὸς αὐτὸν καὶ λέγει περὶ αὐτοῦ· Ἴδε ἀληθῶς Ἰσραηλίτης ἐν ᾧ δόλος οὐκ ἔστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/047.yaml
  text: Jesus saw Nathanael coming toward him and said about him, “Look, truly an Israelite in whom there is no deceit.”
translation:
  language: sw
  text: Yesu alimwona Nathanaeli akimjia, akasema juu yake, “Tazama, Mwisraeli wa kweli, ambaye ndani yake hamna udanganyifu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἴδε
  choice: Tazama
  rationale: Ni mwito wa kuelekeza usikivu wa wasikilizaji; ‘Tazama’ ni ya kawaida katika lugha ya Biblia na inadumisha nguvu ya usemi.
- source_word: ἀληθῶς Ἰσραηλίτης
  choice: Mwisraeli wa kweli
  rationale: Kielezi ἀληθῶς kinaeleza uhalisi wa sifa ya kuwa Mwisraeli, si tu kuthibitisha sentensi kwa kusema ‘kweli’.
- source_word: δόλος
  choice: udanganyifu
  rationale: Neno hili humaanisha hila au ujanja wa kudanganya; ‘udanganyifu’ ni pana, wazi, na la asili katika Kiswahili cha sasa.
- source_word: ἐν ᾧ ... οὐκ ἔστιν
  choice: ambaye ndani yake hamna
  rationale: Inahifadhi taswira ya Kigiriki ya kitu kutokuwamo ndani ya mtu, huku ikisomeka kwa kawaida katika Kiswahili.
theological_decisions:
- issue: Maana ya ‘Mwisraeli wa kweli’
  choice: Mwisraeli wa kweli
  alternative: kweli, Mwisraeli
  rationale: Muundo uliochaguliwa huhifadhi uwezekano kwamba Yesu anasifu uhalisi wa tabia ya Nathanaeli kama Mwisraeli, hasa kwa maelezo yanayofuata kuhusu kutokuwa na udanganyifu, bila kuongeza tafsiri ya kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa urahisi. Jina ‘Nathanaeli’ limeandikwa kwa umbo lililozoeleka katika tafsiri za Kiswahili.
