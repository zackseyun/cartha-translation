id: JHN.11.44
reference: John 11:44
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ⸀ἐξῆλθεν ὁ τεθνηκὼς δεδεμένος τοὺς πόδας καὶ τὰς χεῖρας κειρίαις, καὶ ἡ ὄψις αὐτοῦ σουδαρίῳ περιεδέδετο. λέγει ⸂αὐτοῖς ὁ Ἰησοῦς⸃· Λύσατε αὐτὸν καὶ ἄφετε ⸀αὐτὸν ὑπάγειν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/044.yaml
  text: The man who had died came out, his feet and hands bound with burial cloths, and his face wrapped with a cloth. Jesus says to them, “Unbind him and let him go.”
translation:
  language: sw
  text: Yule aliyekuwa amekufa akatoka nje, miguu na mikono yake ikiwa imefungwa kwa vitambaa vya maziko, na uso wake ukiwa umefungwa kwa kitambaa. Yesu akawaambia, “Mfungueni, mwacheni aende.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ τεθνηκώς
  choice: yule aliyekuwa amekufa
  rationale: Huwakilisha hali ya Lazaro kama mtu aliyekuwa amekufa bila kuongeza ufafanuzi usio katika matini.
- source_word: κειρίαις
  choice: vitambaa vya maziko
  rationale: Neno hili linamaanisha vipande au vitambaa vilivyotumika katika maandalizi ya maziko; tafsiri hii ni ya kawaida na inaeleweka.
- source_word: ἡ ὄψις αὐτοῦ
  choice: uso wake
  rationale: Katika muktadha huu ὄψις hurejelea sehemu ya mbele ya kichwa, yaani uso.
- source_word: σουδαρίῳ
  choice: kitambaa
  rationale: Ni kitambaa maalumu, mara nyingi cha kufutia au kufunika uso; hapa 'kitambaa' huepuka maelezo ya ziada yasiyo ya lazima.
- source_word: Λύσατε αὐτόν
  choice: Mfungueni
  rationale: Kitenzi λύω hapa humaanisha kuondoa vifungo au vitambaa vilivyomfunga.
- source_word: ἄφετε αὐτὸν ὑπάγειν
  choice: mwacheni aende
  rationale: 'Hudumisha muundo na maana ya amri mbili: kumruhusu aende baada ya kufunguliwa.'
theological_decisions:
- issue: Wakati wa kihistoria katika λέγει
  choice: Yesu akawaambia
  alternative: Yesu anawaambia
  rationale: Kigiriki kinatumia wakati wa sasa wa kihistoria, lakini simulizi la Kiswahili husomeka kwa kawaida kwa wakati uliopita. Maana ya tukio haibadilishwi.
- issue: Jinsi marehemu alivyoweza kutoka akiwa amefungwa
  choice: Imeachwa bila maelezo
  alternative: Kufafanua namna alivyotembea au alivyotolewa
  rationale: Matini yenyewe haisemi jinsi alivyotoka; tafsiri inadumisha hali hiyo bila kuitatua kwa kubuni.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Hakuna alama za tanbihi kwa kuwa hakuna tanbihi zinazohitajika katika aya hii.
