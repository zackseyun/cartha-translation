  text: ἐὰν δέ τις περιπατῇ ἐν τῇ νυκτί, προσκόπτει, ὅτι τὸ φῶς οὐκ ἔστιν ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/010.yaml
  text: But if anyone walks in the night[a], he stumbles, because the light is not in him.
translation:
  language: sw
  text: Lakini mtu akitembea usiku, anajikwaa, kwa sababu nuru haimo ndani yake.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “nuru haiko pamoja naye.” Kigiriki kinasema kihalisi zaidi “ndani yake,” jambo linaloweza kudokeza zaidi ya kutokuwapo kwa mwanga wa nje.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐὰν δέ τις
  choice: Lakini mtu aki-
  rationale: “Lakini” huhifadhi utofautishaji wa δέ, huku “mtu aki-” ikitoa sharti lenye maana ya jumla bila kulifanya kuwa tukio maalumu.
- source_word: περιπατῇ ἐν τῇ νυκτί
  choice: akitembea usiku
  rationale: Huhifadhi picha halisi ya kutembea na usiku, pamoja na uwezekano wa maana pana ya kiroho; Kiswahili cha kawaida hakihitaji kihusishi kabla ya “usiku.”
- source_word: προσκόπτει
  choice: anajikwaa
  rationale: Ni neno la kawaida na lenye hadhi linalobeba maana ya kujikwaa kimwili na pia kwa njia ya mfano.
- source_word: ὅτι τὸ φῶς
  choice: kwa sababu nuru
  rationale: “Kwa sababu” huonyesha wazi uhusiano wa kisababishi, na “nuru” huhifadhi taswira yenye uzito wa Kiyohana.
- source_word: οὐκ ἔστιν ἐν αὐτῷ
  choice: haimo ndani yake
  rationale: Huhifadhi kwa uwazi ἐν, “ndani yake,” badala ya kuibadili kimya kimya kuwa ukosefu wa mwanga wa nje pekee.
theological_decisions:
- issue: Maana ya “nuru haimo ndani yake”
  choice: Kudumisha usemi wa ndani, “haimo ndani yake.”
  alternative: “nuru haiko pamoja naye,” kama kauli inayohusu mwanga wa nje tu
  rationale: Kigiriki kinasema ἐν αὐτῷ, kwa kawaida “ndani yake.” Usemi huu unafaa picha ya mazingira na wakati huohuo unaacha wazi kina cha kiteolojia cha nuru katika Injili ya Yohana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Akitembea usiku” ni cha asili kuliko “akitembea katika usiku,” na “nuru” huhifadhi sajili ya kibiblia bila kuwa ya kizamani.
