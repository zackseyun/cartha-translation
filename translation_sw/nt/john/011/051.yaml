  text: τοῦτο δὲ ἀφ’ ἑαυτοῦ οὐκ εἶπεν, ἀλλὰ ἀρχιερεὺς ὢν τοῦ ἐνιαυτοῦ ἐκείνου ἐπροφήτευσεν ὅτι ἔμελλεν Ἰησοῦς ἀποθνῄσκειν ὑπὲρ τοῦ ἔθνους,
base_translation:
  language: en
  yaml_path: translation/nt/john/011/051.yaml
  text: He did not say this from himself[a], but being high priest that year, he prophesied that Jesus was going to die for the nation[c][b],
translation:
  language: sw
  text: Hakulitamka jambo hili kwa nafsi yake mwenyewe[a], bali akiwa kuhani mkuu mwaka ule, alitabiri kwamba Yesu angekufa kwa ajili ya taifa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “kwa hiari yake mwenyewe.”
    reason: lexical_alternative
  - marker: b
    text: Au, “kwa niaba ya taifa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο δὲ
  choice: jambo hili
  rationale: “Jambo hili” hurejelea kauli iliyotangulia; δέ ina nguvu hafifu ya kiunganishi na haihitaji kutafsiriwa kwa neno tofauti hapa, kwa kuwa mtiririko wa Kiswahili tayari unaweka mpito huo wazi.
- source_word: ἀφ’ ἑαυτοῦ
  choice: kwa uamuzi wake mwenyewe
  rationale: Hueleza kwamba kauli haikutokana na uamuzi au msukumo wa Kayafa mwenyewe. Hii ni ya asili zaidi kwa Kiswahili kuliko tafsiri ya moja kwa moja “kutoka kwake mwenyewe.”
- source_word: οὐκ εἶπεν
  choice: Hakusema
  rationale: Ni ulinganifu wa kawaida na wa moja kwa moja wa kitenzi λέγω katika muktadha huu.
- source_word: ἀλλὰ ἀρχιερεὺς ὢν τοῦ ἐνιαυτοῦ ἐκείνου
  choice: bali, kwa kuwa alikuwa kuhani mkuu mwaka ule
  rationale: “Kwa kuwa” huwasilisha hali ya usuli yenye dokezo la kisababishi katika kirai shirikishi, bila kuongeza maelezo yasiyokuwamo; “mwaka ule” ni Kiswahili cha kawaida kwa τοῦ ἐνιαυτοῦ ἐκείνου.
- source_word: ἐπροφήτευσεν
  choice: alitoa unabii
  rationale: Huhifadhi wazi nguvu ya usemi wa kinabii na ni lugha ya sasa, yenye hadhi, inayoeleweka kwa wasomaji wa kawaida.
- source_word: ἔμελλεν ... ἀποθνῄσκειν
  choice: angekufa
  rationale: Katika usemi wa wakati uliopita, “angekufa” huonyesha tukio la baadaye lililokuwa linatarajiwa bila kulazimisha maana ya ukaribu wa mara moja au hatima isiyoepukika.
- source_word: ὑπὲρ τοῦ ἔθνους
  choice: kwa ajili ya taifa
  rationale: Huhifadhi maana pana ya manufaa/uwakilishi ya ὑπέρ bila kuibana kuwa fomula maalumu ya kitheolojia; “taifa” hudumisha umoja wa ἔθνος na rejeo lake kwa taifa la Wayahudi katika muktadha.
theological_decisions:
- issue: Kauli ya Kayafa kuitwa unabii
  choice: Maandishi yanasema wazi kwamba alitoa unabii kwa kuwa alikuwa kuhani mkuu mwaka ule.
  alternative: Kayafa alitabiri kwa ufahamu kamili; au Yohana anatumia kejeli tu bila unabii halisi.
  rationale: Tafsiri inadumisha dai halisi la ἐπροφήτευσεν lakini haisemi zaidi kuhusu kiwango cha ufahamu, tabia, au hali ya kiroho ya Kayafa.
- issue: Nguvu ya ὑπὲρ kuhusu kifo cha Yesu
  choice: kwa ajili ya taifa
  alternative: kwa niaba ya taifa; badala ya taifa
  rationale: Kirai kikuu kinaacha wazi upana wa maana ya manufaa na uwakilishi, bila kulazimisha maana finyu ya ubadala ambayo kifungu hiki pekee hakielezi kikamilifu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. Muundo umefanywa wa asili kwa Kiswahili huku ukihifadhi mvutano wa maandishi kati ya nia ya Kayafa na maana ya kinabii ya maneno yake.
