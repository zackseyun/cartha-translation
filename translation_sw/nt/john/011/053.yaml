  yaml_path: translation/nt/john/011/053.yaml
  text: So from that day on they planned to kill him.
translation:
  language: sw
  text: Kwa hiyo, tangu siku hiyo wakapanga kumuua.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπ’ ἐκείνης ... τῆς ἡμέρας
  choice: tangu siku hiyo
  rationale: Kirai hiki kinaonyesha siku hiyo kuwa mwanzo wa mpango ulioendelea. Kiswahili cha kawaida ‘tangu siku hiyo’ kinatoa maana hiyo kwa uwazi.
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Kiunganishi hiki kinaonyesha matokeo ya kikao kilichotangulia; ‘Kwa hiyo’ huhifadhi uhusiano huo wa kimantiki kwa Kiswahili cha kawaida.
- source_word: ἐβουλεύσαντο
  choice: wakapanga
  rationale: Kitenzi kinaonyesha mashauriano yaliyozaa mpango wenye kusudi. ‘Wakapanga’ ni cha asili na hudumisha uzito wa njama kuliko kusema walifikiria tu.
- source_word: ἵνα ἀποκτείνωσιν
  choice: kumuua
  rationale: Muundo wa ἵνα pamoja na kitenzi cha kupanga unaonyesha lengo au yaliyopangwa. ‘Kumuua’ ni usemi wa moja kwa moja na wa kawaida, bila kuingiza wazo la hukumu rasmi ambalo halijaelezwa.
- source_word: αὐτόν
  choice: -mu- katika ‘kumuua’
  rationale: Kiwakilishi kinamrejelea Yesu katika muktadha wa karibu; Kiswahili hukiwakilisha kiasili kwa kiambishi cha yambwa ‘-mu-’ bila kulazimika kutaja jina lake.
theological_decisions:
- issue: Aina ya nia ya viongozi dhidi ya Yesu
  choice: Kauli imetafsiriwa kuwa mpango thabiti wa kumuua.
  alternative: Walijadili au walifikiria kumuua.
  rationale: Kigiriki kinaonyesha hatua madhubuti ya kupanga njama baada ya mashauriano yaliyotangulia. Tafsiri haipunguzi uzito wa nia hiyo wala kuiongezea maelezo ya kisheria au ya kimafundisho yasiyokuwamo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, wazi na chenye heshima. Muundo wa ‘waka-’ unaendeleza simulizi kwa kawaida, huku ‘Kwa hiyo’ ikihifadhi wazi matokeo ya tukio lililotangulia.
