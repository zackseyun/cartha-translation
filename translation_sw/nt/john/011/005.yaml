base_translation:
  language: en
  yaml_path: translation/nt/john/011/005.yaml
  text: Jesus loved Martha and her sister and Lazarus.
translation:
  language: sw
  text: Yesu aliwapenda Martha, dada yake, na Lazaro.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠγάπα
  choice: aliwapenda
  rationale: Kitenzi cha wakati usiotimilika kinaonyesha upendo wa Yesu uliokuwa hali endelevu wakati huo. Kiswahili cha kawaida hutumia wakati uliopita rahisi kwa namna ya asili; kiambishi cha kitu -wa- kinakirejelea kikundi cha watu watatu.
- source_word: δὲ
  choice: hakikutafsiriwa kwa neno tofauti
  rationale: Hiki ni kiunganishi hafifu cha mtiririko wa habari. Katika sentensi hii, kukiacha bila neno maalumu kunatoa Kiswahili cha asili bila kukifanya kiwe na maana kali ya upinzani au ya wakati.
- source_word: τὴν Μάρθαν
  choice: Martha
  rationale: Jina la mtu limeandikwa kwa namna iliyozoeleka katika Kiswahili cha Biblia.
- source_word: τὴν ἀδελφὴν αὐτῆς
  choice: dada yake
  rationale: Hii ni tafsiri ya asili ya nomino pamoja na kiwakilishi cha umilikaji. Mstari wenyewe haumtajii dada huyo jina.
- source_word: τὸν Λάζαρον
  choice: Lazaro
  rationale: Jina la mtu limetoholewa kwa namna iliyozoeleka katika Kiswahili.
- source_word: καὶ ... καὶ
  choice: Martha, dada yake, na Lazaro
  rationale: Orodha ya wahusika watatu imewasilishwa kwa uunganishaji wa kawaida wa Kiswahili. Kurudia “na” kabla ya kila mshiriki kungekuwa na uzito usio wa lazima katika Kiswahili, ingawa uhusiano wa vipashio vyote umehifadhiwa.
theological_decisions:
- issue: Nguvu ya wakati usiotimilika katika ἠγάπα kuhusu upendo wa Yesu
  choice: Kauli rahisi kwamba Yesu aliendelea kuwa na upendo kwa Martha, dada yake, na Lazaro
  alternative: '“alikuwa akiwapenda,” au maana ya kuanza: “alianza kuwapenda”'
  rationale: Wakati usiotimilika hapa unaeleweka kwa kawaida kuwa hali iliyoendelea katika wakati uliopita. “Aliwapenda” ni ya asili na haiongezi dai la kwamba upendo ulianza wakati huo wala msisitizo usiotajwa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa urahisi. Muundo ni mfupi na wa asili; hakuna alama za tanbihi kwa kuwa hakuna tanbihi inayohitajika.
