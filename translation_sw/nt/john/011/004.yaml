  text: ἀκούσας δὲ ὁ Ἰησοῦς εἶπεν· Αὕτη ἡ ἀσθένεια οὐκ ἔστιν πρὸς θάνατον ἀλλ’ ὑπὲρ τῆς δόξης τοῦ θεοῦ ἵνα δοξασθῇ ὁ υἱὸς τοῦ θεοῦ δι’ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/004.yaml
  text: But when Jesus heard it[a], he said, “This sickness is not unto death, but for the glory of God, so that the Son of God may be glorified through it.”
translation:
  language: sw
  text: Lakini Yesu aliposikia hayo, alisema, “Ugonjwa huu si wa mauti[a], bali ni kwa ajili ya utukufu wa Mungu, ili Mwana wa Mungu atukuzwe kwa njia ya ugonjwa huu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “hauishii katika kifo.” Usemi wa Kigiriki unaweza kumaanisha kwamba kifo si matokeo ya mwisho wala kusudi la ugonjwa huu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας δὲ ὁ Ἰησοῦς
  choice: Lakini Yesu aliposikia hayo
  rationale: Kishiriki cha wakati uliopita ἀκούσας kinaelezwa kwa kishazi cha wakati cha Kiswahili, “aliposikia.” Neno “hayo” linaelekeza kwa kawaida kwenye taarifa iliyotangulia kuhusu ugonjwa wa Lazaro, huku δέ ikiwakilishwa na “Lakini” kama badiliko au utofautishaji hafifu katika simulizi.
- source_word: ἀσθένεια
  choice: ugonjwa
  rationale: “Ugonjwa” ni neno la kawaida, pana, na linaloeleweka kwa urahisi kwa hali ya Lazaro bila kuifanya ionekane kama istilahi ya kitabibu.
- source_word: οὐκ ἔστιν πρὸς θάνατον
  choice: si wa kifo
  rationale: Usemi huu mfupi unahifadhi kwa kiasi kikubwa sintaksia na mvutano wa Kigiriki, ambapo πρὸς inaweza kuonyesha mwelekeo, matokeo, au mwisho. Haukanushi kwa maelezo ya ziada kwamba Lazaro atakufa kwa muda katika simulizi.
- source_word: ὑπὲρ τῆς δόξης τοῦ θεοῦ
  choice: ni kwa ajili ya utukufu wa Mungu
  rationale: “Kwa ajili ya” linaonyesha kusudi au manufaa ya ὑπέρ, na “utukufu wa Mungu” linatunza uzito wa θεοῦ na δόξης.
- source_word: ἵνα δοξασθῇ
  choice: ili ... atukuzwe
  rationale: “Ili” linaonyesha kusudi la ἵνα, na “atukuzwe” linahifadhi hali ya kutendwa ya kitenzi δοξασθῇ.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: Mwana wa Mungu
  rationale: Hili ni tafsiri ya moja kwa moja, iliyozoeleka, na yenye heshima ya cheo hiki cha Kristo.
- source_word: δι’ αὐτῆς
  choice: kwa njia ya ugonjwa huo
  rationale: διά pamoja na hali ya umilikishi huonyesha njia au chombo. Kurudia “ugonjwa huo” badala ya kutumia kiwakilishi kunaondoa utata usio wa lazima katika Kiswahili kuhusu rejea ya αὐτῆς.
theological_decisions:
- issue: Maana ya οὐκ ἔστιν πρὸς θάνατον kwa kuwa Lazaro anakufa baadaye katika simulizi
  choice: “Si wa kifo” limeachwa na mvutano wake, huku tanbihi ikionyesha uwezekano kwamba kifo si mwisho au kusudi la ugonjwa huo.
  alternative: “Hautasababisha kifo” au “si ugonjwa wa kufisha.”
  rationale: Muktadha wa Yohana 11 unaonyesha kwamba Lazaro anakufa, lakini kifo si matokeo ya mwisho ya tukio hilo. Tafsiri kuu haipaswi kuondoa mvutano huu wala kuingiza ufafanuzi wote ndani ya mstari.
- issue: Uhusiano kati ya utukufu wa Mungu na kutukuzwa kwa Mwana wa Mungu
  choice: 'Vishazi vyote viwili vimetafsiriwa tofauti: ugonjwa ni kwa ajili ya utukufu wa Mungu, ili Mwana wa Mungu atukuzwe kwa njia yake.'
  alternative: Kuvijumlisha kuwa kauli moja ya jumla kuhusu utukufu wa kimungu.
  rationale: Kigiriki kinataja wazi utukufu wa Mungu na kutukuzwa kwa Mwana. Kuvihifadhi vyote kunatunza msisitizo wa kifungu bila kuongeza hitimisho la kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ni ya sasa, yenye heshima, na inayoeleweka kwa wasomaji wa kawaida. “Si wa kifo” lina ladha ya kifasihi inayofaa maandiko na huhifadhi ufupi pamoja na utata halisi wa usemi wa Kigiriki.
