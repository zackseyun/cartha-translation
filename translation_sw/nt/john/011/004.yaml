review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the temporal participle, the purpose clauses, the passive sense of ‘may be glorified,’ and the distinct references to God’s glory and the Son’s glorification. ‘Si wa kifo’ seeks to preserve πρὸς θάνατον, but it is not idiomatic enough in contemporary Standard East African Swahili.
  naturalness: Replace the awkward predicate ‘si wa kifo’ with the established scriptural and natural expression ‘si wa mauti.’ Also replace ‘kwa njia ya ugonjwa huo’ with ‘kwa njia ya ugonjwa huu’; the latter is smoother and retains the explicit reference of δι’ αὐτῆς without a potentially awkward shift to a distal demonstrative.
  terminology: ‘Ugonjwa,’ ‘utukufu wa Mungu,’ and ‘Mwana wa Mungu’ are accurate, natural, and appropriate in register. ‘Mauti’ is a well-established elevated biblical equivalent for θάνατος and is especially suitable in this context.
  issues:
  - severity: medium
    issue: ‘Ugonjwa huu si wa kifo’ is syntactically understandable but unnatural/marked Swahili.
    rationale: The construction does not naturally convey the Greek teleological idiom to ordinary Swahili readers. ‘Si wa mauti’ is a familiar, concise biblical expression that preserves the text’s unresolved narrative tension rather than paraphrasing it as a categorical denial of Lazarus’s death.
  - severity: low
    issue: ‘Kwa njia ya ugonjwa huo’ is somewhat heavy and less cohesive than needed.
    rationale: The Greek pronoun refers to the illness. Repeating the noun is a sound way to avoid ambiguity in Swahili, but ‘ugonjwa huu’ fits the immediately stated illness and reads more naturally.
  revised_text: Lakini Yesu aliposikia hayo, alisema, “Ugonjwa huu si wa mauti[a], bali ni kwa ajili ya utukufu wa Mungu, ili Mwana wa Mungu atukuzwe kwa njia ya ugonjwa huu.”
  revised_footnotes:
