  verdict: revise
  source_fidelity: The draft accurately conveys Jesus’ gladness, its reference to the disciples’ benefit, his absence, and the ensuing exhortation to go to Lazarus. However, “mpate kuamini” can naturally suggest being enabled or getting an opportunity to believe, whereas πιστεύσητε simply states the intended result, “that you may believe.”
  naturalness: The Swahili is clear, modern, and appropriately respectful. “Sikuwepo huko” is a slightly more usual contemporary expression than “sikuwako huko,” while preserving the same meaning.
  terminology: “Kuamini” is the appropriate Johannine rendering of πιστεύω. The proposed main text keeps it unqualified; an ingressive possibility may be retained in a carefully limited footnote.
  issues:
  - severity: medium
    issue: The main text uses “mpate kuamini” for πιστεύσητε.
    rationale: Although idiomatic in some Bible-register usage, “kupata kuamini” may add an ability, opportunity, or attainment nuance not explicitly expressed by the Greek. “Ili muamini” more directly preserves the purpose clause and leaves the aorist’s possible ingressive force unforced.
  revised_text: Nami ninafurahi kwa ajili yenu kwamba sikuwepo huko, ili muamini.[a] Lakini twendeni kwake.
