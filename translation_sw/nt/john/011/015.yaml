base_translation:
  language: en
  yaml_path: translation/nt/john/011/015.yaml
  text: And I am glad for your sake that I was not there[a], so that you may believe. But let us go to him.
translation:
  language: sw
  text: Nami ninafurahi kwa ajili yenu kwamba sikuwepo huko, ili muamini.[a] Lakini twendeni kwake.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “ili mje kuamini.” Kitenzi cha Kigiriki kiko katika aoristi na kinaweza kudokeza kuanza kuamini, ingawa “ili muamini” limetumiwa katika maandishi ili kuhifadhi maana pana bila kuongeza tafsiri isiyolazimishwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: χαίρω
  choice: ninafurahi
  rationale: Kitenzi cha wakati wa sasa kinaonyesha furaha ya Yesu; “ninafurahi” ni Kiswahili cha kawaida na chenye heshima.
- source_word: δι’ ὑμᾶς
  choice: kwa ajili yenu
  rationale: Kirai hiki kinaonyesha kwamba jambo hilo lilikuwa kwa manufaa ya wanafunzi, si kwamba wao ndio chanzo tu cha furaha.
- source_word: ἵνα πιστεύσητε
  choice: ili mpate kuamini
  rationale: ἵνα pamoja na kitenzi tegemezi huonyesha kusudi. “Mpate kuamini” ni ya asili na haikazii kupita kiasi kama walikuwa hawajaamini kabisa hapo awali.
- source_word: ὅτι οὐκ ἤμην ἐκεῖ
  choice: kwamba sikuwako huko
  rationale: ὅτι hapa linaanzisha jambo ambalo Yesu analifurahia; “sikuwako huko” linawakilisha moja kwa moja hali ya kutokuwapo mahali pale.
- source_word: ἀλλὰ ἄγωμεν πρὸς αὐτόν
  choice: Lakini twendeni kwake
  rationale: ἀλλά huleta utofautishaji na mpito kwenda kwenye hatua inayofuata; ἄγωμεν ni himizo la nafsi ya kwanza wingi, na πρός pamoja na hali ya kushutumiwa huonyesha mwendo kuelekea kwa mtu.
theological_decisions:
- issue: Nguvu ya πιστεύσητε katika muktadha wa Yohana
  choice: mpate kuamini
  alternative: mpate kuja kuamini
  rationale: Wakati wa kitenzi cha Kigiriki unaweza kudokeza kuingia katika hali ya kuamini, lakini haulazimishi hitimisho kwamba wanafunzi hawakuwa na imani yoyote kabla ya hapo. Tafsiri kuu inadumisha mvutano huo bila kuufafanua kupita kiasi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, fasaha na chenye heshima. “Sikuwako” na “twendeni kwake” ni miundo ya kawaida inayoeleweka kwa urahisi.
