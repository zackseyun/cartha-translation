  text: καὶ πᾶς ὁ ζῶν καὶ πιστεύων εἰς ἐμὲ οὐ μὴ ἀποθάνῃ εἰς τὸν αἰῶνα· πιστεύεις τοῦτο;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/026.yaml
  text: And everyone who lives and believes in me will certainly never die forever. Do you believe this?
translation:
  language: sw
  text: Na kila mtu anayeishi na kuniamini hatakufa kamwe. Je, unaamini jambo hili?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶς ὁ ζῶν
  choice: kila mtu anayeishi
  rationale: Huhifadhi muundo wa kijumla wa Kigiriki na maana ya mtu aliye hai bila kuongeza ufafanuzi usiotajwa.
- source_word: πιστεύων εἰς ἐμέ
  choice: kuniamini
  rationale: Ni Kiswahili cha kawaida kinachoeleza imani iliyoelekezwa kwa Yesu, si kukubali taarifa fulani tu.
- source_word: οὐ μὴ ἀποθάνῃ
  choice: hatakufa kamwe
  rationale: Muungano wa οὐ μή ni ukanushi wenye mkazo; “kamwe” huwasilisha mkazo huo kwa Kiswahili cha asili.
- source_word: εἰς τὸν αἰῶνα
  choice: kamwe
  rationale: Katika muundo huu wa ukanushi, kirai hiki kina maana ya kiidioma ya “kamwe”; hakifai kutafsiriwa kwa namna isiyo ya asili kama “kufa milele.”
- source_word: πιστεύεις τοῦτο;
  choice: Je, unaamini jambo hili?
  rationale: “Jambo hili” linaonyesha wazi kuwa τοῦτο inarejelea dai lililotangulia na ni usemi wa kawaida wa Kiswahili.
theological_decisions:
- issue: Kauli kwamba mwamini ‘hatakufa kamwe’ licha ya uwezekano wa kifo cha mwili
  choice: 'Kudumisha kauli yenye nguvu: “hatakufa kamwe”'
  alternative: “hatakufa milele” au kufafanua “hatakufa kiroho”
  rationale: Chanzo hakiongezi neno “kiroho” wala hakitatui wazi mvutano kati ya kifo cha mwili na uzima anaoutaja Yesu. Tafsiri inapaswa kuhifadhi mvutano huo bila kuingiza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye heshima na kinachoeleweka kwa wasomaji wa kawaida. Sentensi ni fupi na ya moja kwa moja, huku mkazo wa ukanushi wa Kigiriki ukihifadhiwa kwa “kamwe.”
