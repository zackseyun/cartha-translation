  yaml_path: translation/nt/john/011/014.yaml
  text: So then Jesus told them plainly[a], “Lazarus has died.”
translation:
  language: sw
  text: Basi Yesu akawaambia waziwazi[a], “Lazaro amekufa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Basi Yesu akawaambia kwa uwazi, ‘Lazaro alikufa.’”
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε οὖν
  choice: Basi
  rationale: Muunganiko huu unaendeleza simulizi na kuonyesha matokeo ya yaliyotangulia. “Basi” ni kiunganishi cha kawaida na cha asili katika Kiswahili kinachobeba nguvu hiyo bila kurudia viunganishi.
- source_word: εἶπεν αὐτοῖς
  choice: akawaambia
  rationale: Kitenzi hiki kinawasilisha kwa kawaida tendo la Yesu kuwaambia wanafunzi wake jambo fulani, huku muundo wa “aka-” ukiendeleza mfuatano wa simulizi.
- source_word: παρρησίᾳ
  choice: waziwazi
  rationale: Katika muktadha huu neno linaonyesha kwamba Yesu aliacha usemi wa mfano kuhusu kulala na kusema kwa uwazi usio na utata. “Waziwazi” ni la asili na linasisitiza uwazi huo.
- source_word: Λάζαρος
  choice: Lazaro
  rationale: Hili ndilo umbo la jina hili lililozoeleka katika Kiswahili.
- source_word: ἀπέθανεν
  choice: amekufa
  rationale: Aoristi inataja tukio la kifo. Kauli “amekufa” ni ya kawaida katika Kiswahili na huonyesha tukio lililokamilika lenye umuhimu kwa hali ya sasa.
theological_decisions:
- issue: Maana ya kauli ya Yesu kuhusu hali ya Lazaro
  choice: Kauli ya moja kwa moja kwamba Lazaro amekufa kimwili, inayofafanua usemi wa awali kuhusu kulala.
  alternative: Kuendeleza mfano wa kulala.
  rationale: Aya yenyewe inaondoa utata wa usemi wa awali kwa kutumia ἀπέθανεν moja kwa moja; kwa hiyo tafsiri hapa inapaswa kusema wazi kwamba Lazaro amekufa.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi lakini rahisi kueleweka. “Waziwazi” linafaa katika simulizi la kawaida; tanbihi inahifadhi uwezekano wa “kwa uwazi” na wakati sahili “alikufa.”
