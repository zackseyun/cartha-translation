  text: λέγει αὐτῇ ὁ Ἰησοῦς· Οὐκ εἶπόν σοι ὅτι ἐὰν πιστεύσῃς ⸀ὄψῃ τὴν δόξαν τοῦ θεοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/040.yaml
  text: Jesus said to her, “Did I not tell you that if you believe, you will see the glory of God?”
translation:
  language: sw
  text: Yesu akamwambia, “Je, sikukuambia kwamba ukiamini, utauona utukufu wa Mungu?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει αὐτῇ ὁ Ἰησοῦς
  choice: Yesu akamwambia
  rationale: Ingawa λέγει ni wakati wa sasa wa kihistoria, muundo wa masimulizi wa Kiswahili kwa kutumia ‘aka-’ unasikika wa kawaida na unaendeleza tukio; αὐτῇ inaonyeshwa kwa kiambishi ‘-mw-’.
- source_word: Οὐκ εἶπόν σοι
  choice: Je, sikukuambia
  rationale: Hili ni swali la balagha linalotarajia jibu la kukubali. ‘Sikukuambia’ ni Kiswahili cha kawaida na huhifadhi anwani ya moja kwa moja kwa Martha.
- source_word: ἐὰν πιστεύσῃς
  choice: ukiamini
  rationale: Muundo wa ‘uki-’ unaonyesha sharti kwa kawaida, na ‘amini’ huhifadhi maana na msamiati muhimu wa πιστεύω katika Injili ya Yohana bila kuubana kuwa fundisho maalumu.
- source_word: ὄψῃ
  choice: utauona
  rationale: Wakati ujao umeonyeshwa wazi kwa ‘uta-’; kiambishi ‘-u-’ kinarejelea ‘utukufu’ kama nomino ya ngeli ya 11.
- source_word: τὴν δόξαν τοῦ θεοῦ
  choice: utukufu wa Mungu
  rationale: ‘Utukufu’ ni tafsiri iliyozoeleka na yenye uzito unaofaa kwa δόξα, huku ‘wa Mungu’ ikihifadhi uhusiano wa genitivi bila kuufafanua kupita kiasi.
theological_decisions:
- issue: Uhusiano kati ya kuamini na kuuona utukufu wa Mungu
  choice: Kauli imetafsiriwa moja kwa moja kama ahadi yenye sharti iliyotolewa kwa Martha.
  alternative: Kuifafanua ama kama kanuni ya jumla kuhusu imani na miujiza, ama kama ahadi inayohusu tu kufufuliwa kwa Lazaro.
  rationale: Aya yenyewe haitatui upeo mpana wa ahadi hiyo. Tafsiri inahifadhi sharti na mvutano wa kiteolojia bila kuongeza ufafanuzi wa kimadhehebu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na kinachoeleweka kwa urahisi. Muundo ‘Yesu akamwambia’ unafaa katika simulizi, na swali la balagha limewekwa wazi kwa ‘Je’.
