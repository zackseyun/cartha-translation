  text: λέγουσιν αὐτῷ οἱ μαθηταί· Ῥαββί, νῦν ἐζήτουν σε λιθάσαι οἱ Ἰουδαῖοι, καὶ πάλιν ὑπάγεις ἐκεῖ;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/008.yaml
  text: The disciples said to him[a], “Rabbi, just now the Jews were seeking to stone you, and are you going there again?”
translation:
  language: sw
  text: Wanafunzi wakamwambia[a], “Rabi, hivi punde Wayahudi walikuwa wakijaribu kukupiga kwa mawe, nawe unakwenda huko tena?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Wayudea,” au katika muktadha huu, “viongozi wa Kiyahudi.” Mara nyingi Yohana hutumia “Wayahudi” kuwarejelea wapinzani wa Yesu huko Yudea, wala si Wayahudi wote kwa ujumla.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγουσιν
  choice: wakamwambia
  rationale: Wakati uliopo wa kihistoria katika simulizi la Kigiriki umetafsiriwa kwa wakati uliopita wa kisimulizi, ambao ni wa kawaida na wa asili katika Kiswahili.
- source_word: Ῥαββί
  choice: Rabi
  rationale: Jina hili la heshima la Kisemiti limehifadhiwa kama lilivyotoholewa, badala ya kubadilishwa kuwa “Mwalimu,” ili kudumisha namna wanafunzi walivyomwita Yesu na mtindo wa Yohana.
- source_word: νῦν
  choice: muda mfupi tu uliopita
  rationale: Katika muktadha huu neno hilo linaonyesha tukio la karibuni, si wakati wa sasa tu; usemi huu unaeleza maana hiyo kwa Kiswahili cha kawaida.
- source_word: ἐζήτουν
  choice: walikuwa wakijaribu
  rationale: Wakati usiotimilika unaonyesha juhudi iliyoendelea au iliyofanywa wakati uliopita. “Walikuwa wakijaribu” ni ya asili katika Kiswahili na inaonyesha kwamba nia yao haikutimizwa.
- source_word: λιθάσαι
  choice: kukupiga kwa mawe
  rationale: Hii ni tafsiri ya moja kwa moja na ya kawaida ya tendo la kupiga mtu kwa mawe; haiongezi “hadi kufa,” jambo ambalo linaweza kudokezwa lakini halijasemwa wazi katika Kigiriki.
- source_word: οἱ Ἰουδαῖοι
  choice: Wayahudi
  rationale: Hii ndiyo maana ya moja kwa moja ya neno. Kwa kuwa katika Yohana linaweza kumaanisha kwa upeo mwembamba Wayudea au viongozi wa Kiyahudi waliompinga Yesu, uwezekano huo umewekwa katika tanbihi bila kuufanya tafsiri kuu kuwa finyu.
- source_word: πάλιν
  choice: tena
  rationale: Hili ndilo neno la kawaida na la moja kwa moja la Kiswahili kwa tendo linalorudiwa.
- source_word: ὑπάγεις
  choice: unakwenda
  rationale: Kitenzi hapa kinamaanisha kwenda mahali palipotajwa; “unakwenda” ni wazi na ya kawaida katika Kiswahili.
- source_word: ἐκεῖ
  choice: huko
  rationale: Kielezi hiki kinarejelea mahali palipotajwa awali, yaani eneo la hatari huko Yudea.
theological_decisions:
- issue: Wanaorejelewa na οἱ Ἰουδαῖοι katika Yohana
  choice: Wayahudi
  alternative: Wayudea; au katika muktadha huu, viongozi wa Kiyahudi
  rationale: Tafsiri kuu inahifadhi maana pana ya kileksika bila kuingiza kwa lazima maana ya “viongozi,” ambayo haijaelezwa wazi. Tanbihi inaonyesha kwamba matumizi ya Yohana hapa huenda yanarejelea hasa wapinzani wa Yesu huko Yudea, wala si Wayahudi wote.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida lakini wa heshima. Swali la wanafunzi limehifadhi mshangao na wasiwasi wake kwa muundo “nawe unakwenda huko tena?”
