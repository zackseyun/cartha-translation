id: JHN.11.16
reference: John 11:16
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἶπεν οὖν Θωμᾶς ὁ λεγόμενος Δίδυμος τοῖς συμμαθηταῖς· Ἄγωμεν καὶ ἡμεῖς ἵνα ἀποθάνωμεν μετ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/016.yaml
  text: So Thomas[a], called Didymus, said to his fellow disciples, “Let us also go, so that we may die with him.”
translation:
  language: sw
  text: Basi, Tomaso, aitwaye Didimo[a], akawaambia wanafunzi wenzake, “Twende na sisi, ili tufe pamoja naye.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Didimo ni neno la Kigiriki linalomaanisha Pacha.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Basi
  rationale: Inaonyesha mwendelezo wenye hitimisho kutoka mazungumzo yaliyotangulia, kwa Kiswahili cha kawaida na chenye hadhi.
- source_word: Θωμᾶς
  choice: Tomaso
  rationale: Jina limetoholewa kwa umbo linalotumiwa kwa kawaida katika tafsiri za Kiswahili.
- source_word: ὁ λεγόμενος Δίδυμος
  choice: aitwaye Didimo[a]
  rationale: Inahifadhi jina la Kigiriki Didimo huku tanbihi ikieleza maana yake, ‘Pacha.’
- source_word: τοῖς συμμαθηταῖς
  choice: wanafunzi wenzake
  rationale: Neno hilo linamaanisha wanafunzi wenza; usemi huu ni wa kawaida na unaonyesha uhusiano wao bila kuongeza tafsiri ya ziada.
- source_word: Ἄγωμεν
  choice: Twende
  rationale: Ni hali ya kuhimiza katika nafsi ya kwanza wingi, ikiwataka wengine waende pamoja naye.
- source_word: καὶ ἡμεῖς
  choice: na sisi
  rationale: Inahifadhi msisitizo wa kuwajumuisha Tomaso na wanafunzi wengine pamoja na Yesu.
- source_word: ἵνα
  choice: ili
  rationale: Inaweza kuonyesha kusudi au matokeo yanayotarajiwa bila kulazimisha tofauti isiyo wazi katika muktadha.
- source_word: ἀποθάνωμεν
  choice: tufe
  rationale: Hali tegemezi ya Kiswahili inawasilisha kwa ufupi na kwa kawaida kitenzi cha Kigiriki kilicho katika subjunctive.
- source_word: μετ’ αὐτοῦ
  choice: pamoja naye
  rationale: Inaonyesha kuambatana naye na, katika muktadha, kufa pamoja naye.
theological_decisions:
- issue: Toni na kusudi la kauli ya Tomaso
  choice: Kauli imetafsiriwa moja kwa moja bila kuongezewa hisia au tathmini.
  alternative: Kuitafsiri waziwazi kuwa ujasiri wa uaminifu, kukata tamaa kuhusu kifo, au kejeli yenye kukosa matumaini.
  rationale: Kigiriki hakibainishi moja kwa moja toni ya Tomaso; tafsiri inahifadhi uwezekano huo bila kuamua hali yake ya kisaikolojia au maana ya kiteolojia.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. ‘Twende na sisi’ huhifadhi msisitizo wa καὶ ἡμεῖς kwa namna ya asili.
