  text: καὶ ταῦτα εἰπὼν φωνῇ μεγάλῃ ἐκραύγασεν· Λάζαρε, δεῦρο ἔξω.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/043.yaml
  text: And after saying these things[a], he cried out with a loud voice, “Lazarus, come out!”
translation:
  language: sw
  text: Baada ya kusema hayo, akaita kwa sauti kubwa, “Lazaro, njoo nje![a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, kwa kufuata muundo wa Kigiriki kwa ukaribu zaidi, “njoo huku nje!”
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα
  choice: hayo
  rationale: Ni kiwakilishi cha kuonyesha cha wingi kinachorejelea maneno yaliyotangulia; “hayo” ni tafsiri ya asili na ya kawaida katika Kiswahili.
- source_word: εἰπὼν
  choice: Baada ya kusema
  rationale: Kitenzi-shirikishi cha wakati uliopita kinaonyesha kwamba kusema kulitangulia kuita; muundo huu unaweka wazi mfuatano huo kwa Kiswahili cha kawaida.
- source_word: φωνῇ μεγάλῃ
  choice: kwa sauti kubwa
  rationale: Kirai hiki kinaeleza namna ya kuita na kusisitiza ukubwa wa sauti; tafsiri hii ni ya kawaida na wazi.
- source_word: ἐκραύγασεν
  choice: akaita
  rationale: Kitenzi kina maana ya kutoa mwito au kilio kwa nguvu. Pamoja na “kwa sauti kubwa,” neno “akaita” linawasilisha mwito ulioelekezwa kwa Lazaro bila urudiaji usio wa lazima.
- source_word: Λάζαρε
  choice: Lazaro
  rationale: Ni namna ya kawaida ya kuandika jina hili katika Kiswahili, hapa likiwa katika hali ya kumwita mtu moja kwa moja.
- source_word: δεῦρο ἔξω
  choice: njoo nje
  rationale: δεῦρο hutumiwa kama amri ya kuja, na ἔξω humaanisha nje. “Njoo nje” ni amri fupi, yenye nguvu, na ya asili katika Kiswahili cha sasa.
theological_decisions:
- issue: Kutafsiri amri ya muujiza bila kuingiza lugha ya kale au ufafanuzi wa kimadhehebu
  choice: njoo nje
  alternative: njoo huku nje
  rationale: “Njoo nje” inahifadhi maana ya msingi ya δεῦρο ἔξω kwa lugha ya sasa. “Njoo huku nje” huonyesha kwa uwazi zaidi wazo la kuja mahali alipo msemaji, lakini “huku” si lazima katika Kiswahili na inaweza kufanya amri iwe nzito kuliko ilivyo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima lakini rahisi kueleweka. Sentensi inatumia mfuatano wa kawaida wa simulizi na amri fupi yenye msisitizo.
