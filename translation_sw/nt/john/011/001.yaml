  text: Ἦν δέ τις ἀσθενῶν, Λάζαρος ἀπὸ Βηθανίας ἐκ τῆς κώμης Μαρίας καὶ Μάρθας τῆς ἀδελφῆς αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/001.yaml
  text: A certain man was sick[a], Lazarus from Bethany, from the village of Mary and her sister Martha.
translation:
  language: sw
  text: Kulikuwa na mtu mmoja, Lazaro wa Bethania, kutoka kijiji cha Maria na dada yake Martha, aliyekuwa mgonjwa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Au: “Mtu mmoja alikuwa mgonjwa, Lazaro wa Bethania, kutoka kijiji cha Maria na dada yake Martha.”'
    reason: Mpangilio mwingine unaowezekana wa sentensi unaohifadhi uhusiano uleule wa kisarufi.
lexical_decisions:
- source_word: Ἦν δέ
  choice: Kulikuwa na
  rationale: Muundo huu unaanzisha hali mpya katika simulizi kwa Kiswahili cha kawaida. Nguvu hafifu ya kiunganishi δέ imeachwa idokezwe na mpito wa simulizi badala ya kupewa neno lenye uzito wa tofauti.
- source_word: τις
  choice: mtu mmoja
  rationale: τις humtambulisha mtu asiyepewa jina mara moja lakini aliye mahususi; “mtu mmoja” ni usemi wa kawaida na wa wazi katika Kiswahili.
- source_word: ἀσθενῶν
  choice: aliyekuwa mgonjwa
  rationale: Katika muktadha huu kitenzi hiki kinamaanisha kuwa mgonjwa, si kuwa dhaifu tu. Muundo huu pia unaonyesha hali iliyokuwa ikiendelea.
- source_word: Λάζαρος
  choice: Lazaro
  rationale: Jina limetoholewa kwa namna iliyozoeleka katika Kiswahili.
- source_word: ἀπὸ Βηθανίας
  choice: wa Bethania
  rationale: Hutaja mahali Lazaro alikotoka au alikohusishwa nako; “wa Bethania” ni usemi wa asili katika Kiswahili.
- source_word: ἐκ τῆς κώμης
  choice: kutoka kijiji cha
  rationale: κώμη ni kijiji au makazi madogo, na ἐκ huonyesha mahali alikotoka.
- source_word: Μαρίας καὶ Μάρθας τῆς ἀδελφῆς αὐτῆς
  choice: Maria na dada yake Martha
  rationale: Maneno haya yanahusisha kijiji hicho na Maria na Martha na yanamtambulisha Martha wazi kuwa dada ya Maria, kama inavyoonyesha αὐτῆς.
theological_decisions: []
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki; lugha ni ya simulizi, yenye heshima na inayoeleweka kwa wasomaji wa kawaida. Marudio ya mahali katika ἀπὸ Βηθανίας na ἐκ τῆς κώμης yamehifadhiwa badala ya kufupishwa.
