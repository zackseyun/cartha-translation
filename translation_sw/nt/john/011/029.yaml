  text: And when she heard it[a], she got up quickly and went to him.
translation:
  language: sw
  text: Naye aliposikia hayo, aliinuka haraka, akaenda kwake.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκείνη
  choice: naye
  rationale: Kiwakilishi kirejeshi kinamrejelea Maria katika muktadha. “Naye” ni cha kawaida katika simulizi la Kiswahili na kinaendeleza habari bila kutumia usemi mzito kama “yule mwanamke.”
- source_word: δὲ
  choice: -ye katika “naye”
  rationale: Hapa δέ ni kiunganishi hafifu cha kuendeleza simulizi, si alama ya upinzani mkali. Kimewakilishwa kwa kawaida ndani ya “naye.”
- source_word: ὡς
  choice: alipo-
  rationale: Katika muundo huu wa wakati, ὡς huonyesha wakati tendo lilipotokea. Kiambishi “alipo-” kinatoa maana ya “wakati/aliposikia” bila kuongeza msisitizo wa “mara tu.”
- source_word: ἤκουσεν
  choice: alisikia hayo
  rationale: Kitenzi kina maana ya “kusikia.” “Hayo” ni kijalizo cha kawaida kinachorejelea ujumbe wa mstari uliotangulia bila kuufafanua kupita kiasi.
- source_word: ἠγέρθη
  choice: aliinuka
  rationale: 'Ingawa umbo la Kigiriki ni la kati/tendwa, katika muktadha huu lina maana isiyo elekezi kwa mtendaji mwingine: Maria aliinuka. “Aliinuka” ni fasaha na ya kawaida.'
- source_word: ταχὺ
  choice: haraka
  rationale: Neno hili linaonyesha kasi au utayari wa tendo; “haraka” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: ἤρχετο
  choice: akaenda
  rationale: Kauli isiyotimilika inaonyesha mwendo uliokuwa ukiendelea. Katika mfululizo wa simulizi la Kiswahili, “akaenda” ni ya kawaida kuliko “alikuwa akienda,” bila kubadili mwelekeo wa mwendo.
- source_word: πρὸς αὐτόν
  choice: kwake
  rationale: πρός pamoja na hali ya kushutumiwa huonyesha mwendo kuelekea kwa mtu. “Kwake” humtaja Yesu kama lengo la mwendo kwa Kiswahili cha kawaida.
