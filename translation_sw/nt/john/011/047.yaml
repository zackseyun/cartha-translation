  text: συνήγαγον οὖν οἱ ἀρχιερεῖς καὶ οἱ Φαρισαῖοι συνέδριον, καὶ ἔλεγον· Τί ποιοῦμεν ὅτι οὗτος ὁ ἄνθρωπος πολλὰ ⸂ποιεῖ σημεῖα⸃;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/047.yaml
  text: So the chief priests and the Pharisees gathered a council and were saying[a], “What are we doing? For this man is doing many signs.”
translation:
  language: sw
  text: Basi wakuu wa makuhani na Mafarisayo wakaitisha baraza[a], wakasema, “Tunafanya nini? Kwa maana mtu huyu anafanya ishara nyingi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “Sanhedrini,” yaani baraza kuu la utawala la Wayahudi.
    reason: alternative_reading
lexical_decisions:
- source_word: συνήγαγον
  choice: wakaitisha
  rationale: Kitenzi hiki kinaonyesha kwamba viongozi waliwakusanya wajumbe ili baraza likutane. ‘Wakaitisha baraza’ ni Kiswahili cha kawaida na chenye heshima, bila kuongeza maelezo yasiyomo katika maandishi.
- source_word: οὖν
  choice: Basi
  rationale: ‘Basi’ linaonyesha matokeo ya yaliyotangulia katika simulizi bila kufanya uhusiano huo kuwa wa kimantiki kupita kiasi.
- source_word: ἀρχιερεῖς
  choice: makuhani wakuu
  rationale: Hili ndilo neno la kawaida kwa viongozi wa kikuhani wanaotajwa kwa wingi; halimaanishi lazima kwamba wote walikuwa wanashikilia cheo cha kuhani mkuu kwa wakati mmoja.
- source_word: Φαρισαῖοι
  choice: Mafarisayo
  rationale: Hili ni umbo lililozoeleka katika Kiswahili kwa kundi hili la Kiyahudi.
- source_word: συνέδριον
  choice: baraza
  rationale: ‘Baraza’ linatafsiri maana ya chombo kinachokutana kujadili na kuamua, huku utambulisho wake unaowezekana kuwa Sanhedrini ukielezwa katika tanbihi.
- source_word: ἔλεγον
  choice: wakawa wakisema
  rationale: Muundo huu unahifadhi hali endelevu au ya kurudiwa ya wakati usiotimilifu wa Kigiriki kuliko ‘wakasema’ pekee.
- source_word: Τί ποιοῦμεν
  choice: Tunafanya nini?
  rationale: Huhifadhi hali elekezi ya wakati wa sasa katika Kigiriki na pia huwasilisha mshangao wao kuhusu kutokuchukua hatua.
- source_word: ὅτι
  choice: Kwa maana
  rationale: Linaanzisha sababu ya swali lao kwa njia ya asili katika usemi wa Kiswahili.
- source_word: οὗτος ὁ ἄνθρωπος
  choice: mtu huyu
  rationale: Huhifadhi rejeo la moja kwa moja kwa Yesu na sauti ya wasemaji bila kulainisha au kuongeza dharau.
- source_word: πολλὰ ποιεῖ σημεῖα
  choice: anafanya ishara nyingi
  rationale: ‘Anafanya’ huhifadhi wakati wa sasa, na ‘ishara’ hudumisha uzito wa neno la Yohana kwa matendo yanayoelekeza kwenye utambulisho wa Yesu, badala ya kuyaita tu miujiza.
theological_decisions:
- issue: Tafsiri ya σημεῖα katika Injili ya Yohana
  choice: ishara
  alternative: miujiza; ishara za kimuujiza
  rationale: Yohana hutumia neno hili kwa matendo yenye kufunua na kuelekeza zaidi ya tukio lenyewe. ‘Ishara’ huhifadhi maana hiyo bila kuongeza ufafanuzi katika matini kuu.
- issue: Utambulisho wa συνέδριον
  choice: baraza
  alternative: Sanhedrini
  rationale: Matini kuu inatafsiri nomino ya Kigiriki badala ya kuiweka moja kwa moja kama jina maalumu. Kwa kuwa huenda inarejelea baraza kuu la utawala la Wayahudi, utambulisho huo umewekwa katika tanbihi.
- issue: Nguvu ya swali Τί ποιοῦμεν
  choice: Tunafanya nini?
  alternative: Tufanye nini?
  rationale: Kigiriki kina hali elekezi, si hali tegemezi ya wazi. Tafsiri iliyochaguliwa huhifadhi mvutano kati ya swali la kujilaumu na kutafuta hatua ya kuchukua.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. ‘Wakaitisha baraza’ ni usemi wa kawaida wa taasisi; ‘wakawa wakisema’ huhifadhi mwendelezo wa usemi; na ‘ishara’ hudumisha msamiati muhimu wa Yohana.
