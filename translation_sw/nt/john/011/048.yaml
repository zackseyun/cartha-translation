id: JHN.11.48
reference: John 11:48
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἐὰν ἀφῶμεν αὐτὸν οὕτως, πάντες πιστεύσουσιν εἰς αὐτόν, καὶ ἐλεύσονται οἱ Ῥωμαῖοι καὶ ἀροῦσιν ἡμῶν καὶ τὸν τόπον καὶ τὸ ἔθνος.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/048.yaml
  text: If we let him go on like this[a], everyone will believe in him[b], and the Romans will come and take away both our place and our nation.
translation:
  language: sw
  text: Tukimwacha aendelee hivi, kila mtu atamwamini, nao Waroma watakuja na kutunyang’anya mahali petu[a] pamoja na taifa letu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “hekalu letu.” Kigiriki kinasema “mahali petu,” ambako huenda kukarejelea hasa hekalu au, kwa maana pana zaidi, mahali au hadhi yao.
    reason: alternative_reading
  - marker: b
    text: Au “watu wetu” badala ya “taifa letu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφῶμεν αὐτὸν οὕτως
  choice: tukimwacha aendelee hivi
  rationale: Kitenzi ἀφίημι hapa kina maana ya kuruhusu au kuacha, na οὕτως ni “hivi.” Neno “aendelee” linaonyesha kwa Kiswahili cha kawaida kwamba wanazungumzia kumruhusu aendelee kutenda kwa namna hiyo.
- source_word: πάντες
  choice: kila mtu
  rationale: Ingawa umbo la Kigiriki ni wingi, maana yake hapa ni ya jumla; “kila mtu” ni Kiswahili cha kawaida kinachoonyesha upana huo.
- source_word: πιστεύσουσιν εἰς αὐτόν
  choice: atamwamini
  rationale: Muundo wa Yohana πιστεύω εἰς pamoja na yambwa una maana ya kumwamini mtu au kuweka imani kwake. “Atamwamini” ni wa kawaida na hauongezi ufafanuzi wa kimadhehebu.
- source_word: ἐλεύσονται οἱ Ῥωμαῖοι
  choice: Waroma watakuja
  rationale: Huu ni uwasilishaji wa moja kwa moja wa kitenzi cha wakati ujao pamoja na kiima chake.
- source_word: ἀροῦσιν
  choice: kutunyang’anya
  rationale: αἴρω hapa ni kuondoa au kutwaa. “Kutunyang’anya” huwasilisha kwamba Waroma watawaondolea vitu hivyo kwa nguvu bila kutumia neno lenye nguvu zaidi la “kuharibu.”
- source_word: τόπον
  choice: mahali
  rationale: τόπος kimsingi ni “mahali.” Katika muktadha huenda ni hekalu au hadhi/nafasi yao, hivyo “mahali” huhifadhi utata wa Kigiriki.
- source_word: ἔθνος
  choice: taifa
  rationale: ἔθνος inaweza kumaanisha taifa au watu kama kundi. “Taifa” linafaa kwa hofu ya kisiasa katika muktadha huu, huku “watu wetu” likihifadhiwa kama uwezekano katika tanbihi.
- source_word: ἡμῶν ... καὶ τὸν τόπον καὶ τὸ ἔθνος
  choice: mahali petu pamoja na taifa letu
  rationale: Kiwakilishi ἡμῶν kinahusiana na vitu vyote viwili. “Pamoja na” huonyesha wazi nguvu ya kauli ya Kigiriki inayojumuisha vyote.
theological_decisions:
- issue: Kile kinachorejelewa na τόπον (“mahali petu”)
  choice: Mahali
  alternative: Hekalu letu; au nafasi/hadhi yetu
  rationale: Huenda viongozi walihofia hatua ya Waroma dhidi ya hekalu na pia dhidi ya nafasi yao ya kitaasisi, lakini neno la Kigiriki ni pana. Tafsiri kuu haifungi maana hiyo, na tanbihi inaonyesha uwezekano maalumu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imetumia “Tukimwacha aendelee hivi” kwa mtiririko wa kawaida, huku “mahali” na “taifa” vikihifadhi upana na mvutano wa maneno ya Kigiriki.
