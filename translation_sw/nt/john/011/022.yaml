  yaml_path: translation/nt/john/011/022.yaml
  text: But even now I know that whatever you ask from God, God will give you.
translation:
  language: sw
  text: Lakini hata sasa[a] najua kwamba chochote utakachomwomba Mungu, Mungu atakupa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Na sasa.” Kiunganishi cha Kigiriki kinaweza kutafsiriwa tu “na,” lakini katika muktadha pia kinaonyesha ugeuko baada ya Martha kutaja kifo cha Lazaro.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ νῦν
  choice: Lakini hata sasa
  rationale: Katika muktadha, καί inaendeleza usemi huku ikileta ugeuko wa kulinganisha hali ya sasa na kifo cha Lazaro; “lakini hata sasa” huhifadhi ugeuko huo pamoja na maana ya wakati ya νῦν.
- source_word: οἶδα
  choice: najua
  rationale: Ingawa umbo la Kigiriki ni timilifu, οἶδα kwa kawaida lina maana ya wakati wa sasa; “najua” ni tafsiri ya moja kwa moja na ya kawaida.
- source_word: ὅσα ἂν
  choice: chochote
  rationale: Kiambishi cha urejeshi pamoja na ἄν kinaonyesha jambo lisiloainishwa au lenye upeo wazi; “chochote” huwasilisha maana hiyo kwa Kiswahili cha kawaida.
- source_word: αἰτήσῃ τὸν θεὸν
  choice: utakachomwomba Mungu
  rationale: Kitenzi “kumwomba” humchukua anayeombwa kama yambwa na ni njia ya kawaida ya Kiswahili ya kusema kumwomba Mungu kitu; umbo la wakati ujao katika kishazi rejeshi ni la kawaida kwa maana hii ya jumla.
- source_word: δώσει σοι ὁ θεός
  choice: Mungu atakupa
  rationale: Huhifadhi kitenzi cha moja kwa moja “kupa,” yambwa “-ku-,” na msisitizo wa kurudiwa kwa jina “Mungu” kama katika Kigiriki.
theological_decisions:
- issue: Kauli ya Martha inaweza kufasiriwa kupita kiasi kana kwamba inaamua kikamilifu uhusiano wa Yesu na Mungu.
  choice: 'Kuhifadhi maneno ya wazi ya Martha: “utakachomwomba Mungu, Mungu atakupa.”'
  alternative: Kupanua “Mungu” kuwa “Mungu Baba” au kubadili maneno ili kuondoa dhana ya utegemezi.
  rationale: Mstari unasimulia maneno ya Martha na unaacha mvutano wa kisimulizi wa Yohana ubaki; hakuna msingi wa kuongeza “Baba” wala wa kusawazisha usemi kwa sababu za kimafundisho.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye staha. “Utakachomwomba Mungu” ni usemi wa kawaida wa maombi na hauongezi kitu kisichotajwa; marudio ya “Mungu” yamehifadhiwa kwa uaminifu kwa matini.
