base_translation:
  language: en
  yaml_path: translation/nt/john/011/002.yaml
  text: It was Mary who had anointed the Lord with perfume and wiped his feet with her hair[a], whose brother Lazarus was sick.
translation:
  language: sw
  text: Maria ndiye aliyempaka Bwana mafuta yenye harufu nzuri na kufuta miguu yake kwa nywele zake[a]; Lazaro, ndugu yake, alikuwa mgonjwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “marhamu yenye harufu nzuri” au “mafuta ya manukato”; neno la Kigiriki linamaanisha mafuta au marhamu yenye manukato.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ Μαριὰμ
  choice: Huyu ndiye Maria
  rationale: Muundo huu wa utambulisho unamtaja Maria kwa msisitizo wa kawaida katika Kiswahili; δέ ina kazi ya kuendeleza maelezo na haihitaji kutafsiriwa kwa neno la wakati kama “sasa”.
- source_word: ἡ ἀλείψασα
  choice: aliyempaka
  rationale: Kishiriki chenye kiambishi kinaeleza Maria ni yupi. Kitenzi “kupaka” kinafaa kwa kitendo cha kuweka mafuta juu ya mtu; wakati uliopita unaeleweka katika muktadha bila kulazimisha muundo mzito.
- source_word: τὸν κύριον
  choice: Bwana
  rationale: Linahifadhi cheo cha Yesu na uzito wake wa kisimulizi na kitheolojia.
- source_word: μύρῳ
  choice: mafuta yenye harufu nzuri
  rationale: μύρον humaanisha mafuta au marhamu yenye manukato. Usemi huu ni wazi, wa sasa, na hauzuii maana kwenye manukato ya majimaji pekee.
- source_word: καὶ ἐκμάξασα
  choice: na kuifuta
  rationale: ἐκμάσσω ni kufuta au kukausha kwa kufuta. “Kuifuta” ni ya kawaida na hudumisha uhusiano wa kitendo cha pili na Maria.
- source_word: τοὺς πόδας αὐτοῦ
  choice: miguu yake
  rationale: Tafsiri ya moja kwa moja na ya kawaida; kiambishi cha ngeli katika “kuifuta” hurejelea “miguu” kama kitu kimoja cha kisarufi.
- source_word: ταῖς θριξὶν αὐτῆς
  choice: kwa nywele zake
  rationale: Dative ya chombo imetafsiriwa kwa “kwa,” ikionyesha alichotumia kufutia.
- source_word: ἧς ὁ ἀδελφὸς Λάζαρος
  choice: Lazaro ... alikuwa ndugu yake
  rationale: Mpangilio huu wa sentensi ni wa asili katika Kiswahili na unaweka wazi kwamba Lazaro alikuwa ndugu ya Maria.
- source_word: ἠσθένει
  choice: aliyekuwa mgonjwa
  rationale: Kitenzi kinarejelea ugonjwa wa mwili unaoendelea wakati huo; muundo huu unatoa maana hiyo kwa uwazi.
theological_decisions:
- issue: Tafsiri ya κύριος kama cheo cha Yesu
  choice: Bwana
  alternative: bwana mkuu / mwalimu
  rationale: “Bwana” ndiyo tafsiri ya kawaida inayohifadhi uzito wa cheo hiki bila kukipunguza kuwa uhusiano wa kijamii tu.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Sentensi imegawanywa mara mbili ili kuzuia kishazi kirefu kisicho cha kawaida na kuweka wazi uhusiano wa Maria na Lazaro.
