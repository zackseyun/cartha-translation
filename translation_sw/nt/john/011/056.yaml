  text: ἐζήτουν οὖν τὸν Ἰησοῦν καὶ ἔλεγον μετ’ ἀλλήλων ἐν τῷ ἱερῷ ἑστηκότες· Τί δοκεῖ ὑμῖν; ὅτι οὐ μὴ ἔλθῃ εἰς τὴν ἑορτήν;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/056.yaml
  text: So they were looking for Jesus and saying to one another as they stood in the temple courts[b][a], “What do you think? That he certainly will not come to the feast?”
translation:
  language: sw
  text: Basi, walikuwa wakimtafuta Yesu na wakisema wao kwa wao, wakiwa wamesimama katika viwanja vya hekalu[a], “Mnaonaje? Je, kwa vyovyote vile hatakuja kwenye sikukuu?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neno la Kigiriki ἱερόν linamaanisha eneo au viwanja vya hekalu, si hasa patakatifu pa ndani.
    reason: cultural_note
  - marker: b
    text: Au, “Je, hatafika kabisa kwenye sikukuu?” Kigiriki kinatumia ukanushaji wenye mkazo (οὐ μή).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐζήτουν
  choice: walikuwa wakimtafuta
  rationale: Kauli ya wakati usiotimilika inaonyesha tendo lililoendelea; usemi huu ni wa kawaida na huhifadhi wazo la kujaribu kumpata Yesu.
- source_word: οὖν
  choice: Basi
  rationale: Inaunganisha simulizi hili na muktadha uliotangulia kwa mtiririko wa kawaida wa Kiswahili.
- source_word: ἔλεγον μετ’ ἀλλήλων
  choice: walisemezana
  rationale: Kitenzi hiki cha Kiswahili huonyesha mazungumzo ya kurudishana kati yao na kuwasilisha hali ya usemi uliokuwa ukiendelea.
- source_word: ἐν τῷ ἱερῷ
  choice: katika viwanja vya hekalu
  rationale: ἱερόν hapa ni eneo lote la hekalu, si patakatifu pa ndani pekee; “viwanja vya hekalu” hufafanua tofauti hiyo kwa lugha inayoeleweka.
- source_word: ἑστηκότες
  choice: wakiwa wamesimama
  rationale: Huhifadhi hali ya kusimama iliyoonyeshwa na kitenzi-jina cha wakati timilifu.
- source_word: Τί δοκεῖ ὑμῖν;
  choice: Mnaonaje?
  rationale: Ni namna ya asili ya Kiswahili ya kuuliza maoni ya kundi.
- source_word: ὅτι
  choice: Kwamba
  rationale: Huhifadhi muundo wa Kigiriki unaotanguliza maudhui ya maoni baada ya swali, bila kulazimisha tafsiri moja ya uhusiano wake na swali.
- source_word: οὐ μὴ ἔλθῃ
  choice: kwa hakika hatakuja
  rationale: Huwasilisha ukanushaji wenye mkazo wa οὐ μή kwa Kiswahili cha sasa.
- source_word: εἰς τὴν ἑορτήν
  choice: kwenye sikukuu
  rationale: “Sikukuu” ni neno la kawaida na lenye heshima kwa sherehe ya kidini inayozungumziwa katika muktadha huu.
theological_decisions:
- issue: Nguvu na namna ya swali lenye οὐ μή
  choice: “Kwamba kwa hakika hatakuja kwenye sikukuu?”
  alternative: “Je, kweli hatakuja kwenye sikukuu?”
  rationale: Chaguo kuu huhifadhi ukanushaji wenye mkazo na muundo wenye ὅτι, huku tanbihi ikitambua kuwa maneno yanaweza kusikika kama hitimisho au swali lenye matarajio.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; lugha ya sasa, yenye heshima na inayoeleweka. Muundo wa swali umeachwa na mvutano wake wa asili badala ya kulainishwa kuwa swali lisilo na mkazo.
