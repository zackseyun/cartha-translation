  text: ἐγὼ δὲ ᾔδειν ὅτι πάντοτέ μου ἀκούεις· ἀλλὰ διὰ τὸν ὄχλον τὸν περιεστῶτα εἶπον, ἵνα πιστεύσωσιν ὅτι σύ με ἀπέστειλας.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/042.yaml
  text: But I knew that you always hear me[a]. Yet I said this because of the crowd standing around[b], so that they may believe that you sent me.
translation:
  language: sw
  text: Lakini nilijua kwamba wewe hunisikia sikuzote. Hata hivyo, nilisema haya kwa sababu ya umati uliokuwa umesimama kunizunguka[a], ili waamini kwamba wewe ndiye uliyenituma[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “kwa ajili ya umati uliokuwa umesimama kunizunguka.”
    reason: lexical_alternative
  - marker: b
    text: 'Kigiriki kinakazia “wewe”: “kwamba wewe ndiye uliyenituma.”'
    reason: source_emphasis
lexical_decisions:
- source_word: ᾔδειν
  choice: nilijua
  rationale: Kitenzi hiki hutenda kazi kama wakati uliopita wa ‘kujua.’ ‘Nilijua’ ni Kiswahili cha kawaida na hakilazimishi maana ya wakati uliopita uliotangulia.
- source_word: πάντοτέ μου ἀκούεις
  choice: wewe hunisikia sikuzote
  rationale: ‘Hunisikia’ huonyesha hali ya kudumu ya Baba kumsikia Yesu, huku ‘sikuzote’ ikihifadhi maana ya πάντοτε.
- source_word: ἀλλὰ
  choice: Hata hivyo
  rationale: Inaonyesha tofauti kati ya Yesu kujua kwamba Baba humsikia na sababu yake ya kusema maneno hayo hadharani.
- source_word: διὰ τὸν ὄχλον
  choice: kwa sababu ya umati
  rationale: διά pamoja na hali ya accusative huonyesha sababu; tungo hii ni ya moja kwa moja, huku tanbihi ikihifadhi uwezekano wa kuelewa ‘kwa ajili ya umati.’
- source_word: τὸν περιεστῶτα
  choice: uliosimama hapo karibu
  rationale: Inatoa kwa Kiswahili cha asili picha ya umati uliokuwapo ukisimama kumzunguka Yesu, bila kutumia tamko lisilo la kawaida.
- source_word: εἶπον
  choice: nilisema haya
  rationale: ‘Haya’ hurejelea kwa kawaida maneno ya sala ambayo Yesu alikuwa ametoka kusema.
- source_word: ἵνα πιστεύσωσιν
  choice: ili waamini
  rationale: ‘Ili’ huhifadhi wazi kusudi linaloonyeshwa na ἵνα pamoja na subjunctive.
- source_word: ὅτι σύ με ἀπέστειλας
  choice: kwamba wewe ndiye uliyenituma
  rationale: ‘Wewe ndiye’ huhifadhi msisitizo wa kiwakilishi cha wazi σύ, na ‘uliyenituma’ huhifadhi wazo la kutumwa.
theological_decisions:
- issue: Nguvu ya kauli ya Yesu kuhusu Baba kumsikia
  choice: Baba humsikia Yesu sikuzote, na Yesu alisema sala hiyo kwa sauti kwa manufaa ya umati.
  alternative: Kauli hiyo inaweza kueleweka kwa upana kama fundisho la jumla kuhusu kujibiwa kwa sala.
  rationale: Muktadha wa karibu ni sala ya Yesu kabla ya kumfufua Lazaro. Tafsiri inadumisha ukaribu wa Baba na Mwana pamoja na kusudi lililotajwa la kuleta imani, bila kuongeza mfumo wa mafundisho usiotajwa.
- issue: Kusudi la sala ya hadharani
  choice: Yesu alisema maneno hayo ili umati uamini kwamba Baba ndiye aliyemtuma.
  alternative: Kusudi hilo linaweza kufikiriwa kuwa uthibitisho wa muujiza huu pekee.
  rationale: Kishazi cha ἵνα kinaelekeza moja kwa moja kwenye imani kwamba Baba alimtuma Yesu; tafsiri haipunguzi wala kupanua dai hilo.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki; mtindo ni wa sasa, wenye heshima na unaosomeka kwa urahisi. ‘Hunisikia sikuzote’ ni ya kawaida kuliko mpangilio mzito zaidi, na ‘wewe ndiye’ huhifadhi msisitizo wa maandishi ya Kigiriki.
