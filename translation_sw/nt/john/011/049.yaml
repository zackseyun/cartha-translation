  yaml_path: translation/nt/john/011/049.yaml
  text: But one of them[a], Caiaphas, who was high priest that year, said to them, “You know nothing at all.”
translation:
  language: sw
  text: Lakini mmoja wao, Kayafa, ambaye alikuwa kuhani mkuu mwaka huo, aliwaambia, “Ninyi hamjui jambo lolote kabisa.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἷς δέ τις ἐξ αὐτῶν
  choice: Lakini mmoja wao
  rationale: Muundo εἷς ... τις unamtambulisha mtu mmoja kutoka katika kundi; Kiswahili cha kawaida huutoa kwa urahisi kama “mmoja wao.” δέ imetafsiriwa “Lakini” ili kuonyesha tofauti au mpito mdogo kutoka katika mjadala uliotangulia.
- source_word: Καϊάφας
  choice: Kayafa
  rationale: Jina limetoholewa kwa tahajia iliyozoeleka katika Kiswahili.
- source_word: ἀρχιερεὺς
  choice: kuhani mkuu
  rationale: Hili ndilo jina mahususi la mwenye cheo hicho, na linaitofautisha nafasi yake na kundi pana la viongozi wa makuhani.
- source_word: ὢν τοῦ ἐνιαυτοῦ ἐκείνου
  choice: ambaye alikuwa kuhani mkuu mwaka huo
  rationale: Kirai elezi kinamfafanua Kayafa; “mwaka huo” ni Kiswahili cha asili kinachohifadhi taarifa ya wakati bila kuongeza ufafanuzi wa kihistoria au kiteolojia.
- source_word: εἶπεν αὐτοῖς
  choice: akawaambia
  rationale: Katika simulizi, “akawaambia” ni usemi wa kawaida wa Kiswahili kwa kitendo cha kusema maneno yanayofuata kwa kundi hilo.
- source_word: Ὑμεῖς
  choice: Ninyi
  rationale: Kiwakilishi kilicho wazi katika Kigiriki kina msisitizo; “Ninyi” kinakihifadhi kwa kuitaja nafsi moja kwa moja.
- source_word: οὐκ οἴδατε οὐδέν
  choice: hamjui jambo lolote kabisa
  rationale: Ukanushi ulioimarishwa katika Kigiriki ni karipio lenye mkazo. “Jambo lolote kabisa” huwasilisha nguvu hiyo kwa Kiswahili cha kawaida bila kueleweka kama ukanushi unaojibatilisha.
theological_decisions:
- issue: Maelezo ya wakati kuhusu cheo cha Kayafa
  choice: ambaye alikuwa kuhani mkuu mwaka huo
  alternative: akiwa kuhani mkuu wa mwaka huo
  rationale: Tafsiri inatoa maelezo ya kihistoria kama yalivyo bila kuingiza ufafanuzi kuhusu muda wa ukuhani mkuu au kejeli ya kisimulizi ya Yohana.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye heshima. Sentensi imeundwa kwa mtiririko wa kawaida wa simulizi; karipio la mwisho limehifadhiwa kwa msisitizo wa “Ninyi” na “kabisa.”
