id: JHN.11.54
reference: John 11:54
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ⸂Ὁ οὖν Ἰησοῦς⸃ οὐκέτι παρρησίᾳ περιεπάτει ἐν τοῖς Ἰουδαίοις, ἀλλὰ ἀπῆλθεν ἐκεῖθεν εἰς τὴν χώραν ἐγγὺς τῆς ἐρήμου, εἰς Ἐφραὶμ λεγομένην πόλιν, κἀκεῖ ⸀ἔμεινεν μετὰ τῶν ⸀μαθητῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/054.yaml
  text: So Jesus no longer walked openly among the Jews[a], but departed from there to the region near the wilderness, to a city called Ephraim, and stayed there with the disciples.
translation:
  language: sw
  text: Kwa hiyo Yesu hakutembea tena hadharani miongoni mwa Wayahudi[a], bali aliondoka huko akaenda katika eneo lililo karibu na nyika, kwenye mji ulioitwa Efraimu. Akakaa huko pamoja na wanafunzi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “miongoni mwa watu wa Yudea.” Katika Injili ya Yohana, neno “Wayahudi” wakati mwingine linaweza kumaanisha hasa watu wa Yudea au viongozi wa Kiyahudi, kutegemea muktadha.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Inaonyesha matokeo ya njama iliyotajwa katika mstari uliotangulia na kuhifadhi nguvu ya kimantiki ya kiunganishi hicho.
- source_word: οὐκέτι
  choice: hakutembea tena
  rationale: Muundo huu unaonyesha kwa kawaida kwamba Yesu aliacha mwenendo wake wa awali wa kwenda huku na huku hadharani.
- source_word: παρρησίᾳ
  choice: hadharani
  rationale: Katika muktadha huu neno linahusu kuonekana na kutenda wazi mbele ya watu, si hasa ujasiri wa ndani.
- source_word: περιεπάτει
  choice: hakutembea
  rationale: Kitenzi kinadumisha taswira ya kutembea, huku katika simulizi kikimaanisha pia kwenda huku na huku au kuonekana katika shughuli za hadhara.
- source_word: ἐν τοῖς Ἰουδαίοις
  choice: miongoni mwa Wayahudi
  rationale: Ni tafsiri pana na inayotambulika ya Ἰουδαῖοι; tanbihi inahifadhi uwezekano wa maana ya kikanda, yaani watu wa Yudea.
- source_word: ἀπῆλθεν ἐκεῖθεν
  choice: aliondoka huko
  rationale: Ni usemi wa kawaida na ulio wazi wa Kiswahili unaoonyesha mwendo wa kuondoka mahali pa awali.
- source_word: χώραν
  choice: eneo
  rationale: Hurejelea sehemu au ukanda wa nchi, wala si taifa la kisasa.
- source_word: ἐγγὺς τῆς ἐρήμου
  choice: lililo karibu na nyika
  rationale: ‘Nyika’ inaonyesha eneo kame au lisilokaliwa na watu wengi bila kudai kwamba lilikuwa jangwa la mchanga.
- source_word: εἰς Ἐφραὶμ λεγομένην πόλιν
  choice: kwenye mji ulioitwa Efraimu
  rationale: Hutoa maana ya πόλις na λεγομένην kwa Kiswahili cha kawaida na cha heshima.
- source_word: κἀκεῖ ἔμεινεν
  choice: Akakaa huko
  rationale: Katika simulizi la safari, ‘akakaa huko’ ni tafsiri ya asili ya kubaki au kukaa mahali kwa muda.
- source_word: μετὰ τῶν μαθητῶν
  choice: pamoja na wanafunzi
  rationale: Haihifadhi kimakusudi kimilikishi ‘wake,’ ambacho kinaeleweka katika muktadha lakini hakipo wazi katika Kigiriki.
theological_decisions:
- issue: Maana ya Ἰουδαῖοι katika Injili ya Yohana
  choice: miongoni mwa Wayahudi
  alternative: miongoni mwa watu wa Yudea
  rationale: Neno linaweza kuwa na maana ya kikabila, kikanda, au kuwalenga viongozi wa Kiyahudi kulingana na muktadha. Hapa kauli inahusu kwenda kwa Yesu hadharani katika mazingira hayo; tanbihi inazuia tafsiri hiyo isieleweke kuwa madai kuhusu Wayahudi wote.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. ‘Hadharani’ ni ya kawaida kuliko tafsiri halisi isiyo laini ya ‘kwa uwazi,’ na ‘nyika’ inafaa kwa mazingira yasiyokaliwa sana. Sentensi imegawanywa kabla ya ‘Akakaa huko’ ili isilemee, bila kubadili mfuatano wa simulizi.
