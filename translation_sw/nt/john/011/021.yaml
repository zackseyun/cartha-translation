  text: εἶπεν οὖν ⸀ἡ Μάρθα πρὸς ⸀τὸν Ἰησοῦν· Κύριε, εἰ ἦς ὧδε ⸂οὐκ ἂν ἀπέθανεν ὁ ἀδελφός μου⸃·
base_translation:
  language: en
  yaml_path: translation/nt/john/011/021.yaml
  text: So Martha said to Jesus[a], “Lord, if you had been here, my brother would not have died.”
translation:
  language: sw
  text: Kwa hiyo Martha akamwambia Yesu, “Bwana[a], kama ungekuwa hapa, ndugu yangu hangekufa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Mheshimiwa”; neno la Kigiriki κύριε linaweza kutumiwa kama namna ya heshima ya kumwita mtu, lakini “Bwana” pia huhifadhi uzito unaowezekana wa kitheolojia katika Injili ya Yohana.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Kwa hiyo
  rationale: Kiunganishi hiki kinaonyesha mwendelezo wenye uhusiano na yaliyotangulia; “Kwa hiyo” kinahifadhi nguvu hiyo kwa Kiswahili cha kawaida.
- source_word: εἶπεν ... πρὸς τὸν Ἰησοῦν
  choice: akamwambia Yesu
  rationale: Katika Kiswahili, muundo wa kawaida wa kumtaja anayeambiwa ni “kumwambia”; kiambishi “aka-” kinaendeleza simulizi.
- source_word: Κύριε
  choice: Bwana
  rationale: “Bwana” huhifadhi maana ya heshima na pia uzito unaowezekana wa kitheolojia katika Injili ya Yohana.
- source_word: εἰ ἦς ὧδε
  choice: kama ungekuwa hapa
  rationale: Muundo huu wa masharti unaonyesha hali isiyotokea wakati uliopita; “ungekuwa hapa” ni wa asili na sahihi katika Kiswahili.
- source_word: οὐκ ἂν ἀπέθανεν
  choice: hangekufa
  rationale: Huu ni upande wa matokeo wa sharti lisilotimia la wakati uliopita; “hangekufa” huwasilisha matokeo hayo kwa ufupi na kwa kawaida.
- source_word: ὁ ἀδελφός μου
  choice: ndugu yangu
  rationale: Katika muktadha huu neno linamtaja Lazaro, ndugu wa kiume wa Martha. Kiswahili cha kawaida hutumia “ndugu yangu,” huku muktadha ukibainisha jinsia.
theological_decisions:
- issue: Tafsiri ya κύριος kama namna Martha anavyomwita Yesu
  choice: Bwana
  alternative: Mheshimiwa
  rationale: “Bwana” huhifadhi kwa pamoja matumizi ya heshima na mwangwi unaowezekana wa kikristolojia bila kuamua kimya-kimya kiwango cha imani ambacho Martha anaonyesha hapa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, cha heshima na kinachoeleweka kwa wasomaji wa kawaida. Muundo wa simulizi umetolewa kwa “akamwambia,” na sharti lisilotimia limewasilishwa kwa “ungekuwa ... hangekufa.”
