  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Yesu anakuja.” Kigiriki kinatumia kitenzi cha wakati wa sasa katika taarifa hii, ambacho kinaweza kutafsiriwa kwa ukaribu zaidi kama wakati wa sasa wa kisimulizi.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Basi
  rationale: Inaendeleza simulizi na kuunganisha tendo la Martha na muktadha uliotangulia kwa njia ya kawaida katika Kiswahili.
- source_word: ὡς
  choice: aliposikia
  rationale: Muundo wa ki- huwasilisha uhusiano wa wakati kwa kawaida bila kuongeza wazo la ‘mara tu,’ ambalo halijaelezwa wazi.
- source_word: ἤκουσεν
  choice: alisikia
  rationale: Ni tafsiri ya moja kwa moja ya ἀκούω na haiongezi maana pana ya ‘alipata habari.’
- source_word: ἔρχεται
  choice: alikuwa anakuja
  rationale: Huwasilisha tendo linaloendelea katika muktadha wa simulizi la wakati uliopita; tanbihi inahifadhi uwezekano wa kutafsiri wakati wa sasa wa Kigiriki kwa namna ya moja kwa moja zaidi.
- source_word: ὑπήντησεν
  choice: akaenda kumlaki
  rationale: ‘Kumlaki’ huonyesha kwenda kukutana na mtu anayekuja, na hivyo kuhifadhi mwelekeo uliomo katika kitenzi cha Kigiriki.
- source_word: δὲ
  choice: lakini
  rationale: Inaonyesha tofauti nyepesi kati ya tendo la Martha na hali ya Maria.
- source_word: ἐν τῷ οἴκῳ
  choice: nyumbani
  rationale: Ni usemi wa kawaida na wazi wa Kiswahili kwa kuwa ndani ya nyumba katika muktadha huu.
- source_word: ἐκαθέζετο
  choice: alikuwa ameketi
  rationale: Huwasilisha hali ya Maria iliyoendelea wakati Martha alipoondoka, bila kuongeza kwamba aliamua kubaki.
- source_word: Μάρθα / Μαρία / Ἰησοῦς
  choice: Martha / Maria / Yesu
  rationale: Majina yametolewa kwa maumbo yaliyozoeleka katika Kiswahili cha Biblia na matumizi ya Afrika Mashariki.
