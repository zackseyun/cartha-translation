base_translation:
  language: en
  yaml_path: translation/nt/john/011/041.yaml
  text: So they took away the stone[a]. And Jesus lifted his eyes upward and said, “Father[b], I thank you that you have heard me,”
translation:
  language: sw
  text: Basi wakaliondoa lile jiwe. Naye Yesu akainua macho yake juu[a], akasema, “Baba, ninakushukuru kwa kuwa umenisikia[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au “akatazama juu.”
    reason: lexical_alternative
  - marker: b
    text: Au “ulinisikia.” Kigiriki kimetumia wakati unaoeleza tendo lililokamilika; “umenisikia” hukazia umuhimu wake wa sasa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦραν
  choice: wakaliondoa
  rationale: Katika muktadha wa kufungua kaburi, αἴρω ina maana ya kuliondoa jiwe mahali pake; ‘wakaliondoa’ ni ya kawaida na haidokezi tu kulinyanyua.
- source_word: οὖν
  choice: Basi
  rationale: Inaonyesha matokeo ya amri iliyotolewa kabla na pia kuendeleza simulizi kwa Kiswahili cha kawaida.
- source_word: τὸν λίθον
  choice: lile jiwe
  rationale: ‘Jiwe’ ndilo neno la kawaida kwa λίθος katika muktadha wa kaburi, na ‘lile’ hurejelea jiwe lililotajwa tayari.
- source_word: ὁ δὲ Ἰησοῦς
  choice: Naye Yesu
  rationale: δέ hapa ni kiunganishi hafifu cha kuhamisha mhusika, si upinzani mkali; ‘Naye Yesu’ ni ya asili katika simulizi.
- source_word: ἦρεν τοὺς ὀφθαλμοὺς ἄνω
  choice: akainua macho yake juu
  rationale: Inahifadhi picha halisi ya kuelekeza macho juu, huku ikibaki wazi na ya kawaida kwa msomaji wa Kiswahili.
- source_word: Πάτερ
  choice: Baba
  rationale: Ni mwito wa moja kwa moja katika sala; ‘Baba’ huhifadhi ukaribu na heshima bila kuongeza mtindo wa kiliturujia.
- source_word: εὐχαριστῶ σοι
  choice: ninakushukuru
  rationale: Ni usemi wa moja kwa moja na wa sasa wa kutoa shukrani, unaolingana kwa kawaida na Kiswahili.
- source_word: ὅτι ἤκουσάς μου
  choice: kwa kuwa umenisikia
  rationale: ‘Kwa kuwa’ hutoa sababu ya shukrani katika muktadha huu, na ‘umenisikia’ huonyesha tendo lililokamilika lenye umuhimu wa sasa; pia katika muktadha wa sala linaweza kumaanisha kusikiliza kwa kukubali ombi bila kulifafanua kupita kiasi.
theological_decisions:
- issue: Namna Yesu anavyomwita Mungu katika sala
  choice: Baba
  alternative: Ee Baba
  rationale: Mwito rahisi unalingana moja kwa moja na Πάτερ na huhifadhi ukaribu pamoja na heshima bila kuongeza chembe ya mwito isiyopo wazi katika Kigiriki.
- issue: Maana ya ἤκουσάς μου katika muktadha wa sala
  choice: umenisikia
  alternative: ulinisikia
  rationale: Huhifadhi dai kwamba Baba amemsikia Yesu bila kuongeza maelezo ya kimafundisho kuhusu namna sala ilivyojibiwa; wakati timilifu wa Kiswahili huwasilisha tendo lililokamilika lenye athari ya sasa.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi lakini kinachoeleweka kwa urahisi. Muundo wa simulizi ni wa kawaida, na picha ya kuinua macho imehifadhiwa. Alama za tanbihi zimewekwa baada ya maneno yanayohusika, kwa kuwa katika safu ya mashauriano ya Kiingereza alama hizo zilionekana kutolingana na maelezo yake.
