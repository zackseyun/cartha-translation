  text: Ἦν δὲ ἐγγὺς τὸ πάσχα τῶν Ἰουδαίων, καὶ ἀνέβησαν πολλοὶ εἰς Ἱεροσόλυμα ἐκ τῆς χώρας πρὸ τοῦ πάσχα ἵνα ἁγνίσωσιν ἑαυτούς.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/055.yaml
  text: The Passover of the Jews was near[b][a], and many went up to Jerusalem from the countryside before the Passover to purify themselves.
translation:
  language: sw
  text: Pasaka ya Wayahudi[a] ilikuwa karibu, na watu wengi walipanda kwenda Yerusalemu kutoka mashambani kabla ya Pasaka ili kujitakasa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Pasaka ya Kiyahudi.” Kigiriki kinasema kihalisi zaidi, “Pasaka ya Wayahudi,” usemi unaorudiwa katika Injili ya Yohana.
    reason: lexical_alternative
  - marker: b
    text: Yaani, kujitakasa kidesturi katika maandalizi ya Pasaka.
    reason: cultural_note
lexical_decisions:
- source_word: Ἦν δὲ
  choice: ilikuwa
  rationale: δέ ni kiunganishi hafifu cha mtiririko wa simulizi; muktadha wa Kiswahili hauhitaji neno la ziada kama “basi” au “wakati huo.”
- source_word: ἐγγὺς
  choice: karibu
  rationale: Hapa lina maana ya ukaribu wa wakati; “ilikuwa karibu” ni Kiswahili cha kawaida na wazi.
- source_word: τὸ πάσχα τῶν Ἰουδαίων
  choice: Pasaka ya Wayahudi
  rationale: Tafsiri hii inaonyesha wazi muundo wa Kigiriki na kuhifadhi usemi unaorudiwa katika Injili ya Yohana.
- source_word: ἀνέβησαν
  choice: walipanda kwenda
  rationale: Inahifadhi wazo la kwenda juu kuelekea Yerusalemu, kijiografia na kwa desturi ya safari ya sikukuu.
- source_word: πολλοὶ
  choice: watu wengi
  rationale: Kivumishi hiki kimetumiwa kama nomino; kuongeza “watu” hufanya sentensi iwe wazi na ya kawaida katika Kiswahili.
- source_word: εἰς Ἱεροσόλυμα
  choice: kwenda Yerusalemu
  rationale: Huu ni usemi wa kawaida wa Kiswahili unaohifadhi mwelekeo wa safari.
- source_word: ἐκ τῆς χώρας
  choice: kutoka sehemu za mashambani
  rationale: χώρα hapa inaelekea kumaanisha maeneo ya nje ya mji; usemi huu unaonyesha tofauti hiyo bila kudai eneo moja maalumu.
- source_word: πρὸ τοῦ πάσχα
  choice: kabla ya Pasaka
  rationale: Ni tafsiri ya moja kwa moja na ya kawaida ya usemi wa wakati.
- source_word: ἵνα ἁγνίσωσιν ἑαυτούς
  choice: ili kujitakasa
  rationale: “Ili” huonyesha kusudi la ἵνα, na “kujitakasa” huhifadhi maana ya utakaso bila kuieleza kupita kiasi katika matini kuu.
theological_decisions:
- issue: Asili ya kujitakasa kabla ya Pasaka
  choice: ili kujitakasa
  alternative: ili kujisafisha kidesturi
  rationale: Muktadha unaonyesha maandalizi ya kiibada ya Kiyahudi kabla ya Pasaka. Tafsiri kuu haibadili tendo hilo kuwa utakaso wa maadili ya ndani wala kuliunganisha na mafundisho ya baadaye; tanbihi inaeleza mazingira yake ya kidesturi.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye hadhi lakini kinachoeleweka kwa wasomaji wa kawaida. Muundo “walipanda kwenda Yerusalemu” umechaguliwa ili kuhifadhi maana ya safari ya kupanda bila kutumia lugha ngumu; tanbihi zimewekwa karibu na vifungu vinavyofafanuliwa.
