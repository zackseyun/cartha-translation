id: JHN.11.9
reference: John 11:9
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς· Οὐχὶ δώδεκα ⸂ὧραί εἰσιν⸃ τῆς ἡμέρας; ἐάν τις περιπατῇ ἐν τῇ ἡμέρᾳ, οὐ προσκόπτει, ὅτι τὸ φῶς τοῦ κόσμου τούτου βλέπει·
base_translation:
  language: en
  yaml_path: translation/nt/john/011/009.yaml
  text: Jesus answered[a], “Are there not twelve hours in the day? If anyone walks in the day, he does not stumble[c][b], because he sees the light of this world.”
translation:
  language: sw
  text: Yesu akajibu, “Je, mchana hauna saa kumi na mbili?[a] Mtu akitembea wakati wa mchana, hajikwai,[b] kwa sababu anaiona nuru ya ulimwengu huu.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Je, hakuna saa kumi na mbili za mchana?”
    reason: lexical_alternative
  - marker: b
    text: 'Kiyunani kimetumia umoja wa uwakilishi: “mtu ... hajikwai.”'
    reason: lexical_alternative
  - marker: c
    text: Maneno “nuru ya ulimwengu huu” yanaweza pia kuwa na mwangwi mpana kuhusu nuru ya Mungu katika Injili ya Yohana; hapa yametafsiriwa kama yalivyoandikwa.
    reason: cross_reference
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: akajibu
  rationale: Kitenzi hiki ni cha kawaida katika masimulizi na kinaonyesha jibu la Yesu bila kuongeza maana nyingine.
- source_word: Οὐχὶ δώδεκα ὧραί εἰσιν τῆς ἡμέρας;
  choice: Je, mchana hauna saa kumi na mbili?
  rationale: Muundo huu wa Kiswahili ni wa asili na unabaki na nguvu ya swali la balagha linalotarajia jibu la kukubali.
- source_word: ἐάν τις περιπατῇ ἐν τῇ ἡμέρᾳ
  choice: Mtu akitembea wakati wa mchana
  rationale: “Mtu” linaonyesha mtu yeyote kwa maana ya jumla, na “wakati wa mchana” ni Kiswahili cha kawaida kinachohifadhi picha ya kutembea katika nuru ya mchana.
- source_word: οὐ προσκόπτει
  choice: hajikwai
  rationale: “Kujikwaa” huhifadhi picha halisi ya kugonga kizuizi kwa mguu na pia uwezekano wa maana pana ya kisitiari.
- source_word: τὸ φῶς τοῦ κόσμου τούτου βλέπει
  choice: anaiona nuru ya ulimwengu huu
  rationale: Tafsiri hii inafuata maneno ya Kiyunani kwa karibu, huku ikiacha mwangwi mpana wa “nuru” katika Injili ya Yohana bila kuufafanua ndani ya matini.
theological_decisions:
- issue: Uwezekano wa “nuru” kuwa na maana ya kiishara katika muktadha wa Yohana
  choice: Kuhifadhi picha ya kawaida katika matini kuu bila kuitambulisha waziwazi kuwa Yesu au mwongozo wa Mungu
  alternative: Kutafsiri “nuru ya ulimwengu huu” moja kwa moja kuwa rejeo la Yesu au nuru ya Mungu
  rationale: Katika Yohana, “nuru” mara nyingi ina kina cha kiteolojia, lakini hapa kauli pia inaeleweka kwa maana yake ya kawaida kuhusu kutembea mchana. Tafsiri inaacha maana hizo zisimame pamoja.
- issue: Umoja wa uwakilishi katika τις ... βλέπει
  choice: Kutumia “mtu ... anaiona”
  alternative: Kutumia wingi, kama “watu ... wanaiona”
  rationale: Kiyunani kinatumia mtu mmoja wa mfano. Kiswahili “mtu” huhifadhi umoja huo kwa njia ya asili bila kulazimisha jinsia ambayo sarufi ya Kiswahili haiihitaji.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa na chenye hadhi. “Je” linaweka wazi swali la balagha, “mchana” na “wakati wa mchana” ni vya kawaida kwa wasomaji wengi, na “nuru” limechaguliwa badala ya “mwanga” ili kuhifadhi uzito wa kifasihi na mwangwi wa matumizi yake katika Yohana.
