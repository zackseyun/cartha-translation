id: JHN.11.25
reference: John 11:25
language:
  code: sw
  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: εἶπεν αὐτῇ ὁ Ἰησοῦς· Ἐγώ εἰμι ἡ ἀνάστασις καὶ ἡ ζωή· ὁ πιστεύων εἰς ἐμὲ κἂν ἀποθάνῃ ζήσεται,
base_translation:
  language: en
  yaml_path: translation/nt/john/011/025.yaml
  text: Jesus said to her[a], “I am the resurrection and the life. The one who believes in me, even if he dies, will live,”
translation:
  language: sw
  text: Yesu akamwambia, “Mimi ndimi ufufuo na uzima. Yeyote anayeniamini, hata akifa, ataishi.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν αὐτῇ ὁ Ἰησοῦς
  choice: Yesu akamwambia
  rationale: Muundo huu ni wa kawaida na wa asili katika simulizi la Kiswahili; kiambishi -mw- kinahifadhi wazi kwamba Yesu alisema maneno hayo kwa mwanamke, yaani Martha katika muktadha.
- source_word: Ἐγώ εἰμι
  choice: Mimi ndimi
  rationale: Kauli hii inahifadhi msisitizo wa kiwakilishi Ἐγώ pamoja na utambulisho wa moja kwa moja, kwa lugha ya Kiswahili yenye hadhi na uzito unaofaa katika Injili ya Yohana.
- source_word: ἡ ἀνάστασις
  choice: ufufuo
  rationale: Katika muktadha huu neno linamaanisha ufufuo kutoka kwa wafu, si kuinuka kwa maana ya kawaida.
- source_word: ἡ ζωή
  choice: uzima
  rationale: ‘Uzima’ linafaa kwa dhana pana ya ζωή katika Yohana, likijumuisha uhai unaotolewa na Mungu na usioishia katika kifo.
- source_word: ὁ πιστεύων
  choice: yeyote anayeamini
  rationale: Kirai hiki kinawasilisha kwa Kiswahili cha kawaida mtu yeyote anayekuwa na imani; kinaendeleza maana ya jumla ya umoja wa kirai cha Kigiriki bila kuifanya kuwa jina lisilo na mwendo kama ‘mwamini.’
- source_word: εἰς ἐμέ
  choice: anayeniamini
  rationale: Kitenzi ‘-amini’ chenye kiambishi cha mtendwa ni njia ya asili ya Kiswahili ya kueleza kumwamini au kuweka tumaini kwa mtu, badala ya tafsiri ngumu ya kihalisi ya εἰς.
- source_word: κἂν ἀποθάνῃ
  choice: hata akifa
  rationale: '‘Hata’ pamoja na hali ya -ki- hutoa kwa kawaida nguvu ya sharti lenye concessive: hata ikitokea kwamba mtu huyo anakufa.'
- source_word: ζήσεται
  choice: ataishi
  rationale: Wakati ujao umehifadhiwa moja kwa moja bila kuongeza ‘tena,’ ambalo halipo wazi katika Kigiriki; hivyo maana inaweza kujumuisha ufufuo na uzima unaodumu.
theological_decisions:
- issue: Umoja wa uwakilishi katika ὁ πιστεύων na vitenzi vinavyofuata
  choice: Yeyote anayeniamini, hata akifa, ataishi
  alternative: Mtu anayeniamini, hata akifa, ataishi
  rationale: Kiswahili hakilazimishi kuonyesha jinsia katika maumbo haya. ‘Yeyote’ huhifadhi maana jumuishi na ya jumla ya umoja wa Kigiriki bila kuingiza jinsia isiyo ya lazima au kubadili sentensi kuwa wingi.
- issue: Upeo wa kujitambulisha kwa Yesu katika Ἐγώ εἰμι ἡ ἀνάστασις καὶ ἡ ζωή
  choice: Mimi ndimi ufufuo na uzima
  alternative: Mimi ndiye ninayefufua na kutoa uzima
  rationale: Tafsiri inahifadhi dai la moja kwa moja la utambulisho badala ya kuligeuza kuwa maelezo ya kazi ya Yesu pekee. Hivyo uzito wa Kikristo wa kauli unabaki bila kupanuliwa zaidi ya matini.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, cha sasa, chenye hadhi na kinachoeleweka kwa wasomaji wa kawaida. ‘Mimi ndimi’ kimetumiwa kwa makusudi kuhifadhi msisitizo wa Ἐγώ εἰμι; sehemu nyingine zimetolewa kwa mtiririko wa asili wa Kiswahili. Hakuna tanbihi inayohitajika, kwa kuwa ‘yeyote … akifa’ tayari huonyesha kwa kawaida umoja wa uwakilishi bila utata wa kijinsia.
