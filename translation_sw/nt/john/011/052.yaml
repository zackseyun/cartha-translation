  name: Swahili
  native_name: Kiswahili
  variant: Standard East African Swahili
source:
  edition: SBLGNT
  text: καὶ οὐχ ὑπὲρ τοῦ ἔθνους μόνον, ἀλλ’ ἵνα καὶ τὰ τέκνα τοῦ θεοῦ τὰ διεσκορπισμένα συναγάγῃ εἰς ἕν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/052.yaml
  text: and not for the nation only[b][a], but also so that he might gather into one the scattered children of God.
translation:
  language: sw
  text: na si kwa ajili ya taifa hilo tu[a][b], bali pia ili awakusanye watoto wa Mungu waliotawanyika kuwa kitu kimoja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Taifa hilo” hapa linamaanisha taifa la Wayahudi.
    reason: cultural_note
  - marker: b
    text: Au, “si kwa ajili ya taifa hilo tu, bali pia ili kuwakusanya kuwa kitu kimoja watoto wa Mungu waliotawanyika.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθνους
  choice: taifa
  rationale: “Taifa” linahifadhi maana ya umoja wa jamii ya kitaifa; katika muktadha huu ni taifa la Wayahudi, bila kupanua neno lenyewe kwa ufafanuzi wa ziada.
- source_word: ἵνα
  choice: ili
  rationale: “Ili” linaonyesha kusudi la kifo kilichotajwa katika mstari uliotangulia na ni la kawaida katika Kiswahili cha sasa.
- source_word: τέκνα τοῦ θεοῦ
  choice: watoto wa Mungu
  rationale: τέκνα ni neno jumuishi kwa watoto, si wana wa kiume pekee; tafsiri hii inahifadhi maana hiyo.
- source_word: διεσκορπισμένα
  choice: waliotawanyika
  rationale: Umbo timilifu la kutendwa linaeleza hali ya watoto hao kuwa wametawanyika; “waliotawanyika” ni ya asili na wazi.
- source_word: συναγάγῃ
  choice: awakusanye
  rationale: Kitenzi hiki kinaonyesha kuwaleta pamoja. Kiambishi cha yambwa “-wa-” kinawarejelea watoto wa Mungu bila kuongeza nomino nyingine.
- source_word: εἰς ἕν
  choice: wawe kitu kimoja
  rationale: Kigiriki hakitaji wazi “mwili” wala kufafanua aina ya umoja. Kauli hii inahifadhi ufupi na upana wa maana, huku ikisikika kwa kawaida katika Kiswahili.
- source_word: καὶ οὐχ ὑπὲρ τοῦ ἔθνους μόνον, ἀλλ’
  choice: na si kwa ajili ya taifa hilo tu, bali pia
  rationale: Muundo huu unaendeleza wazo la mstari uliotangulia kuhusu Yesu kufa kwa ajili ya wengine na kuhifadhi ulinganisho wa “si ... tu, bali pia.”
theological_decisions:
- issue: Utambulisho wa “watoto wa Mungu”
  choice: Kauli pana inayowaonyesha watu wa Mungu waliotawanyika na kukusanywa kwa njia ya kifo cha Yesu, bila kubainisha zaidi kundi lao.
  alternative: Wayahudi wa ughaibuni pekee; au wateule wanaoamini kutoka miongoni mwa Wayahudi na watu wa mataifa mengine.
  rationale: Mstari unatofautisha “taifa hilo” na kundi pana la watoto wa Mungu waliotawanyika. Tafsiri haifungi utambulisho wao ndani ya mfumo mmoja wa kimadhehebu.
- issue: Maana ya εἰς ἕν
  choice: wawe kitu kimoja
  alternative: wawe mwili mmoja; waungane
  rationale: Chanzo kinasema tu “katika/kuwa moja” bila kutaja mwili au kueleza namna ya umoja; tafsiri inahifadhi mvutano na upana huo.
translation_notes:
  register: Kiswahili sanifu cha Afrika Mashariki, chenye mtiririko wa kawaida na hadhi inayofaa maandiko. “Taifa hilo” linaunganisha sentensi na muktadha wa karibu; “wawe kitu kimoja” huepuka kuongeza “mwili” au ufafanuzi wa kimadhehebu ambao hauko wazi katika Kigiriki.
