  text: λέγει αὐτῷ· Ναί, κύριε· ἐγὼ πεπίστευκα ὅτι σὺ εἶ ὁ χριστὸς ὁ υἱὸς τοῦ θεοῦ ὁ εἰς τὸν κόσμον ἐρχόμενος.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/027.yaml
  text: She said to him[a], “Yes, Lord; I have believed that you are the Messiah, the Son of God[b], the one coming into the world.”
translation:
  language: sw
  text: Akamwambia, “Ndiyo, Bwana. Mimi nimeamini kwamba wewe ndiye Masihi[a], Mwana wa Mungu, yule ajaye ulimwenguni[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Au, “Kristo.” Neno la Kigiriki Χριστός (Christos) ni cheo chenye maana ya “Aliyetiwa Mafuta”; hapa limetafsiriwa “Masihi.”
    reason: alternative_reading
  - marker: b
    text: Au, “yule anayekuja ulimwenguni.” Kirai cha Kigiriki kinaweza kutafsiriwa kwa kishazi cha uhusiano kilicho wazi zaidi.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει αὐτῷ
  choice: Akamwambia
  rationale: Ingawa Kigiriki kinatumia wakati wa sasa wa kihistoria, wakati uliopita wa masimulizi ni wa kawaida zaidi katika Kiswahili. Mhusika wa kike anatambulika katika muktadha, bila kulazimika kutaja jina lake hapa.
- source_word: Ναί
  choice: Ndiyo
  rationale: Ni jibu la kukubali lililo wazi na la kawaida katika mazungumzo.
- source_word: κύριε
  choice: Bwana
  rationale: Katika ungamo hili, neno lina uzito wa heshima na linaweza pia kuwa na maana ya kitheolojia; “Bwana” huhifadhi upana huo kuliko “bwana” kwa maana ya heshima ya kawaida tu.
- source_word: ἐγὼ πεπίστευκα
  choice: Mimi nimeamini
  rationale: “Nimeamini” huhifadhi kwa kadiri ya kawaida katika Kiswahili hali ya imani iliyoanza kabla na inayoendelea sasa; “mimi” hudhihirisha msisitizo wa ἐγώ.
- source_word: ὅτι σὺ εἶ
  choice: kwamba wewe ndiye
  rationale: “Kwamba” huanzisha maudhui ya imani, na “wewe ndiye” huhifadhi msisitizo wa utambulisho katika σὺ εἶ.
- source_word: ὁ χριστός
  choice: Masihi
  rationale: Hapa Χριστός ni cheo cha yule aliyetiwa mafuta na kutarajiwa, kwa hiyo “Masihi” huwasilisha maana ya cheo hicho badala ya kulitumia kama jina tu.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: Mwana wa Mungu
  rationale: Hili ndilo tamko la kawaida na sahihi la cheo hiki cha kikristo, likihifadhi uzito wake bila kulifafanua kupita maandishi.
- source_word: ὁ εἰς τὸν κόσμον ἐρχόμενος
  choice: yule ajaye ulimwenguni
  rationale: Muundo huu huhifadhi wazo la mtu anayejulikana au kutarajiwa kuwa anakuja ulimwenguni, huku ukibaki wa asili na wenye hadhi katika Kiswahili.
- source_word: κόσμον
  choice: ulimwenguni
  rationale: Katika muktadha huu “ulimwengu” ni tafsiri ya kawaida ya κόσμος, yaani mazingira ya maisha ya wanadamu ambamo huyo anayetarajiwa anakuja.
theological_decisions:
- issue: Tafsiri ya Χριστός kama cheo katika ungamo
  choice: Masihi
  alternative: Kristo
  rationale: Mstari huu unamtambulisha Yesu kwa cheo rasmi. “Masihi” huhifadhi maana ya Kiyahudi ya aliyetiwa mafuta na kutarajiwa, huku tanbihi ikitoa umbo la jadi “Kristo.”
- issue: Nguvu ya κύριε katika maneno ya Martha
  choice: Bwana
  alternative: bwana
  rationale: Muktadha wa kumkiri Yesu kuwa Masihi na Mwana wa Mungu unaunga mkono anwani yenye heshima na uwezekano wa uzito wa kitheolojia. “Bwana” haiulazimishi msomaji kuamua zaidi ya maandishi.
- issue: Hali ya kitenzi πεπίστευκα
  choice: nimeamini
  alternative: naamini
  rationale: Wakati timilifu wa Kigiriki unaonyesha usadikisho uliopatikana tayari na ambao bado una nguvu. “Nimeamini” huhifadhi hali hiyo vizuri kuliko wakati wa sasa pekee.
- issue: Nguvu ya ὁ ἐρχόμενος
  choice: yule ajaye ulimwenguni
  alternative: yule anayekuja ulimwenguni
  rationale: Kirai kinaweza kueleweka kama cheo cha yule anayetarajiwa na pia kama maelezo ya kuja kwake. Tafsiri kuu huhifadhi mvuto wa cheo hicho; tanbihi inaonyesha njia iliyo wazi zaidi ya kueleza tendo linaloendelea.
translation_notes:
  register: Kiswahili Sanifu cha Afrika Mashariki, chenye mtindo wa sasa, wa heshima na unaofaa usomaji wa Biblia. “Akamwambia” ni masimulizi ya kawaida; “mimi” na “wewe ndiye” huhifadhi misisitizo ya Kigiriki. “Yule ajaye” ni mtindo wenye hadhi lakini bado unaeleweka kwa wasomaji wa kawaida.
